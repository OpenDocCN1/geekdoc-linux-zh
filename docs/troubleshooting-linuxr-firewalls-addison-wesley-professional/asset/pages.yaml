  md: '# USING TCP WRAPPERS AND FIREWALL RULES


    What chapter on securing a system would be complete without a quick reminder that
    you should protect all your running services with TCP wrappers and firewall rules?
    For those who are not familiar with TCP wrappers, as this is referred to, this
    gives you the ability to monitor and filter TCP connections via IP address or
    hostname. For example, let''s say that you want to allow SSH connections to your
    firewall but via firewall rules, but what if you don''t have any firewall rules
    on your firewall yet or on the interface you want to filter unwanted connections
    to the SSH port. The solution is simple—use TCP wrappers.


    Before diving into how to do this with SSH, a quick review of TCP wrappers is
    in order. Traditionally, TCP wrappers were used in conjunction with a "super server"
    such as inetd or xinetd. These super servers handle all the inbound connections
    to the servers they manage, such as telnet, ftp, gopher, and other services. TCP
    wrappers filter these connections by being invoked by the super server before
    the actual service itself is invoked, hence the name "TCP wrapper." The wrapper
    was placed "around" the service it is configured to protect. There is a quick
    look at one example from inetd:


    ```

    telnet stream tcp nowait root /usr/sbin/tcpd  in.telnet

    ```


    This describes how the inetd "super server" is to invoke the telnet daemon. The
    TCP wrapper is invoked first via the /usr/sbin/tcpd command. For xinetd, tcpd
    is called automatically for any TCP service, unless you disable this functionality
    explicitly in your service''s configuration file.


    For services such as ssh, support for TCP wrappers may or may not be compiled
    into the daemon. Never assume that it is. To determine if TCP wrapper support
    is available in your ssh binary, you can use this command:


    ```

    ld /usr/sbin/ssh

    ```


    This command will tell you what libraries your ssh binary is "linked" against.
    What you will be looking for is the libwrap library, and the format of the ldd
    output will look something like this:


    ```

    libwrap.so.0 => /usr/lib/libwrap.so.0 (0x20706000)

    libutil.so.1 => /lib/libutil.so.1 (0x2070f000)

    libz.so.1 => /usr/lib/libz.so.1 (0x20712000)

    libns1.so.1 => /lib/libns1.so.1 (0x20720000)

    libcrypto.so.4 => /lib/libcrypto.so.4 (0x20735000)

    ```'
