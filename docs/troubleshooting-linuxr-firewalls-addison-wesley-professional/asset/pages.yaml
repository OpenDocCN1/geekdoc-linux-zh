  md: '# SMTP Server Timeouts/Failures/Numerous Processes


    In this scenario, you have just configured a mail server behind a Masquerading/NAT
    firewall, and now the mail server is manifesting issues with timeouts to some
    but not all external mail servers. Further, this issue might also result in an
    MTA with hundreds of open processes for incoming messages, running for several
    hours (reported on sendmail!). When the server is connected directly to the Internet,
    these issues disappear.


    Most likely this is an issue related to either an identd (AUTH) request, either
    from or to the server. A great many services, including SMTP, FTP, and POP3, use
    identd requests to query the remote server for the username initiating the connection.
    In this case, what is happening is the identd (TCP Port 113) request is being
    dropped (-j DROP) at the firewall''s external interface. The sending server (either
    your internal server or the remote one) in this case is not receiving a TCP RST
    packet, and as such, nothing is telling it to shut down the process, so it waits
    until it times out. Your options are here either to allow the identd service,
    which we do not recommend, or change your rules on this service to a REJECT policy,
    which will return RST/ACK, instructing the remote server to terminate the identd
    request.


    This first rule assumes that the mail server is running on the firewall itself
    with a very restrictive "unallow allow, deny" policy:


    ```

    # where eth0 is our external interface

    IPTABLES -A INPUT -i eth0 -dport 113 -j REJECT

    ```


    ```

    # where eth0 is your external Internet facing interface

    # where eth1 is your internal network, 10.10.10.0/24

    # where eth2 is your DMZ network, 192.168.1.0/24

    EXTERNAL=eth0

    INTERNAL=eth1

    DMZ=eth2

    MAILSERVER=192.168.1.25

    ```


    ```

    IPTABLES -A FORWARD -i EXTERNAL -o DMZ -p tcp \

    --dport 25 -s mailserver.isp.com -m state \

    --state NEW,ESTABLISHED,RELATED -j ACCEPT

    ```


    ```

    IPTABLES -t PREROUTING -i EXTERNAL -p tcp \

    --dport 25 -j DNAT --to-destination MAILSERVER

    ```'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'The following rule demonstrates how to achieve this, where Host-A is our firewall
    andnHost-B (192.168.1.25) is our internal SMTP server, located on the DMZ segment

    192.168.1.0/24:


    ```

    # where eth0 is our external interface

    # where eth1 is our internal network, 10.10.10.0/24

    # where eth2 is our DMZ network, 192.168.1.0/24


    $IPTABLES -A FORWARD -i eth0 -o eth2 -p tcp \

    dport 113 -j REJECT

    ```


    # SMALL E-MAIL SEND/RECEIVE CORRECTLY—LARGE E-MAIL

    Messages Do Not


    In this example, our firewall is operating an MTA or forwarding connections to
    a

    DNAT-ed SMTP server. Small e-mail messages can be sent and received correctly
    by the

    mail server; large messages repeatedly fail.


    This is almost always caused by an MTU setting on the firewall, typically in DSL,
    or

    PPPoE environments where the overhead of this environment reduces the maximum

    unit size that you can transmit over your upstream connection. This also can occur
    with

    VPN environments, such as PPTP. The fix for this situation is fairly straightforward,
    and

    we discuss it in more detail in the VPN chapter. For brevity''s sake, here''s
    the fix:


    ```

    # where eth0 is the external interface

    $IPTABLES -A OUTPUT -o eth0 -p tcp \

    --tcp-flags SYN,RST SYN -j TCPMSS \

    -clamp-mss-to-pmtu

    ```


    # SUMMARY


    One thing we really did not touch on in this chapter is a set of firewall rules
    you can use

    to fight spam. This is a topic near and to us, as we are sure it is to you. Everyone

    hates spam, and there are more strategies for fighting spam than you can poke
    a stick

    at at. We are also in the fight against spam, and you can see our anti-spam efforts
    at

    http://www.atomicrocketturtle.com.'
