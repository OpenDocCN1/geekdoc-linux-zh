  md: "# CHAPTER 15 WEB SERVICES (WEB SERVERS AND WEB PROXIES)\n\nmore detailed browsing\
    \ statistics from one of the many squid log analyzers listed at: http://www.squid-cache.org/Scripts/\n\
    \nIn the following example, our firewall, Host-A (10.10.10.1), has an internal\
    \ network, 10.10.10.0/24. This configuration demonstrates a transparent proxy\
    \ rule to an instance of squid running on the local firewall:\n\n+   # where eth0\
    \ is the external (Internet) interface\n# where eth1 is the internal (10.10.10.0/24)\n\
    \n```\n$IPTABLES -A INPUT -p tcp --dport 3128 -i eth0 \\\n  -j ACCEPT\n$IPTABLES\
    \ -t nat -A PREROUTING -i eth1 -p tcp \\\n  --dport 80 -j REDIRECT --to-port 3128\n\
    ```\n\nThe first rule allows port 3128 connections on all interfaces except for\
    \ localhost.\nThe second rule dictates that all traffic passing through the firewall\
    \ on port 80 will be REDIRECTED to port 3128 (squid) on the server.\n\nThis next\
    \ rule demonstrates the same configuration as the previous listing with an additional\
    \ external dedicated squid proxy server system\n\n```\n$IPTABLES -t nat -A PREROUTING\
    \ -i eth1 \\\n  -s ! 10.10.10.200 -p tcp --dport 80 -j DNAT \\\n  --to 10.10.10.200:3128\n\
    $IPTABLES -t nat -A POSTROUTING -o eth1 \\\n  -s 10.10.10.0/24 -d 10.10.10.200\
    \ -j SNAT \\\n  --to 10.10.10.1\n```\n\nThe first rule redirects all traffic on\
    \ the internal network that is not from Host-B (10.10.10.200), to Host-B.\nThe\
    \ second rule rewrites all traffic passing through the firewall with the destination\
    \ of 10.10.10.200 to appear to come from 10.10.10.1. This is so our redirected\
    \ traffic knows to come back to the firewall.\n\nSometimes it is necessary to\
    \ exclude a host or a network from being cached by the transparent proxy server.\
    \ Excluding an IP or network from transparent caching can be achieved with a user-defined\
    \ chain. In the next example, our firewall Host-Aun runs a local"
  merge: -1
