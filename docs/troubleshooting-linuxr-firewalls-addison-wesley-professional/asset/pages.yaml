- img_proc: true
  md: '# CHAPTER 16 : FILE SERVICES (NFS AND FTP)


    This is a very common problem that is indicative of the FTP connection tracking
    module either not being built into the kernel, or if this is a modular kernel—not
    loaded. Assuming you have a modular kernel, run the following command:


    ```

    modprobe ip_conntrack_ftp

    ```


    If you do not have this module or your kernel is compiled without module support,
    you will need to compile it in the following:


    # Kernels 2.4.x


    ```

    Networking options --->

    IP: Netfilter Configuration --->

    FTP protocol support

    ```


    # Kernels 2.6.x


    ```

    Device Drivers --->

    Networking support --->

    Networking options --->

    Network packet filtering (replaces ipchains) --->

    IP: Netfilter Configuration --->

    FTP protocol support

    ```


    **Select M for modular support, or * to build this directly into the kernel.'
  merge: -1
