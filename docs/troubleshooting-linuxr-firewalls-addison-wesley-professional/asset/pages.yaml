  md: "# COMMON QUESTION\n\nQ: How do I stop the network 169.254.0.0/16 from being\
    \ added to my routes?\n\nA: OK, this is not firewall related, but we have been\
    \ asked it enough that we promised to include it in the book. This is a DHCP thing,\
    \ and it's called a \"Zeroconf route.\" And we agree, it's annoying. If you are\
    \ on a Redhat box and want it to go away, comment out the following from /etc/sysconfig/network-scripts/ifup.\n\
    \n```\n# Zeroconf route.\nif [ -z \"${NOZEROCONF}\" -a \"${ISALIAS}\" = \"no\"\
    \ ]; then\n  ip route replace 169.254.0.0/16 dev ${REALDEVICE}\nfi\n```\n\n# INBOUND:\
    \ CREATING A RULE FOR A NEW TCP SERVICE\n\nUndoubtedly you're going to run into\
    \ a situation where you need to create a rule for a new service. In this example,\
    \ we have a system running a service called \"turtled,\" which is responsible\
    \ for controlling a 300-foot tall, fire-breathing rocket named Gamera.\" According\
    \ to legend, he was made by Atlanteans, and because they're all gone, we don't\
    \ have the documentation for turtled anymore. Even worse, because there's only\
    \ one Gamera, you're not going to find any on Google or a mailing list. Not to\
    \ worry! First we need to determine what port turtled runs on. We can do that\
    \ with the netstat-pan command:\n\n```\n[root@winona root#] netstat -pan | grep\
    \ turtled\ntcp        0 0.0.0.0:2212             0.0.0.0:*\n  LISTEN     3806/turtled\n\
    ```\n\nThe first column tells us that this is a TCP protocol, and 0.0.0.0:2212\
    \ tells us that the service is listening on the port 2212. On a host-only firewall,\
    \ the rule for this service would look like this:\n\n```\n$IPTABLES -A INPUT -p\
    \ tcp --dport 2212 -j ACCEPT\n```\n\nIf we wanted to limit connections to the\
    \ turtled service, we could use the RETURN rule to create an exception to exclude\
    \ hosts from a DROP rule. In this example, two users,"
  merge: -1
  pgno: 256
- img_proc: true
  md: 'Asagi coming from the host 22.33.44.55, and Ayana coming from the host 11.22.33.44,
    need access to turtled:


    ```

    $IPTABLES -N USERS

    IPTABLES -A GAMERA


    IPTABLES -A USERS -s 11.22.33.44 -j RETURN

    IPTABLES -A USERS -s 22.33.44.55 -j RETURN

    IPTABLES -A USERS -j DROP

    ```


    ```

    $IPTABLES -A GAMERA -j USERS

    $IPTABLES -A GAMERA -p tcp -dport 2122 -j ACCEPT

    $IPTABLES -A GAMERA -j DROP

    ```


    The first chain, USERS, contains a list of IP addresses we''ll allow. The second
    chain, GAMERA, starts with a test against the first chain. This matches the incoming
    rule against the IPs listed in USERS, if a rule is matched against the IP address
    22.33.44.55—for example, we get an exception and RETURN to the GAMERA chain to
    process the next rule, which is to allow the connection to port 2122. If the IP
    address does not match anything in the US chain, the final rule is a DROP, which
    is matched, and terminates the rest of the GAMERA chain. As you can see, the use
    of RETURN in a firewall chain is very powerful. It allows you to quickly create
    groups of users and separate your rules more cleanly.


    To continue with this example, let''s assume that you are attempting to forward
    requests to turtled to an internal server. The firewall, Host-A, has three interfaces:
    external, internal (10.10.0/24), and DMZ (192.168.1.0/24). Turtled runs on the
    system Host-B, located on the DMZ network with the IP address of 192.168.1.10.
    We will forward connections from Host-A''s external IP address to Host-B:


    ```

    # where eth0 is the external interface (Internet)

    # where eth1 is the internal interface (10.10.0/24) with the IP 10.10.10.1

    # where eth2 is the DMZ interface (192.168.1.0/24) with the IP 192.168.1.1


    EXTERNAL=eth0

    INTERNAL=eth1

    DMZ=eth2


    SERVER=192.168.1.10


    $IPTABLES -A FORWARD -i $EXTERNAL -o $DMZ -p tcp \

    n    --dport 2122 -m state \

    ```'
