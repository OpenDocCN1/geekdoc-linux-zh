  md: '# DNS/DHCP


    Name resolution and the dynamic assignment of IP addresses, whether from the perspective
    of the firewall as a dynamic device or as the DHCP address provider itself, poses
    several problems. These can include issues with updating firewall rules in a dynamic
    environment, such as cable modems and DSLs to DMZs for DHCP servers. In this chapter,
    we will cover some of the more common issues with getting DNS to work on or through
    firewalls as well as one more bizarre configuration console games to work over
    the Internetwork (we''re not kidding).


    # COMMON QUESTIONS


    Q: Can you use hostnames instead of IP addresses?


    A: Yes, you can; however, when the rules are initially loaded, netfilter will
    perform a lookup on those names and use the IP address returned at that time.
    So any updates against the hostname after the rules have been loaded will have
    no effect. The hard way to update this would be to write something using the iptables
    -R flag (replace). The -R flag, however, suffers from issues when the source and/or
    destination names resolved to multiple addresses. The low-tech approach to dealing
    with this problem is just to reload your rules.


    Q: Can firewall rules direct traffic to different systems based on the domain
    name?'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Chapter 10 DNSHCP


    A: No—iptables/netfilter operates at too low of a level to do name-based rules
    like this. You would need to use an application layer proxy server or iproute2
    to achieve this effect.


    # TOOLS DISCUSSED IN THIS CHAPTER


    +   - DNSMasq (http://www.thekelleys.org.uk/dnsmasq/doc.html). The following is
    from the DNSMasq documentation:


    DNSMasq is lightweight, easy to configure DNS forwarder and DHCP server. It is
    designed to provide DNS and, optionally, DHCP, to a small network. It can serve
    the names of local machines in the global DNS. The DHCP server integrates with
    the DNS server and allows machines with DHCP-allocated addresses to appear in
    the DNS with names configured either in each host or in a central configuration
    file. DNSMasq supports static and dynamic DHCP leases and BOOTP for network booting
    of diskless machines.


    DNSMasq is useful if you are in an environment where you need to provide an application
    layer DNS forwarding service but do not have the time or inclination to use a
    full-featured DNS server such as BIND.


    +   - DHCRelay (http://www.isc.org) is part of the larger DHCP package from the
    Internet Server Consortium (ISC). We use it to provide an application layer proxy
    server for DHCP requests in a DMZ environment.


    # FORWARDING DNS QUERIES TO AN UPSTREAM/Remote DNS SERVER


    In this configuration, you have a firewall, called Host-A (10.10.10.1), and an
    internal non-routable network (RFC1918) at 10.10.10.0/24. Currently this network
    has no internal DNS servers or servers serving queries for internal hosts. To
    provide DNS services for Internet addresses, these queries will have to be forwarded
    to an external DNS server that can do this. There are several methods to accomplish
    this...


    +   - The first method involves using application layer proxies, such as BIND
    or DNSMasq. Our first example involves BIND, the Berkeley Internet Name Domain,
    from http://www.isc.org. BIND is the most commonly deployed'
