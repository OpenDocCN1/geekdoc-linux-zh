- img_proc: true
  md: 'The bottom line is that stateful firewalls are safer than non-stateful firewalls
    because we can write simpler and generally stricter rules. We don''t have to open
    as much to get things to work. The firewall understands the lower-level protocols,
    and with the assistance of what are known as "helpers", it can understand other
    higher-level protocols, such as FTP, IRC, and others. This allows the firewall
    to make decisions on the fly about its configuration based on its needs at the
    time. This also gives you greater control over the traffic moving through your
    firewall instead of just trying to control things based on ports, you can now
    control them based on the protocol. For instance, if wanted to block certain P2P
    traffic through your firewall you could do this using a helper module.


    To accomplish all of these things, we need to understand the four states that
    the filter state engine recognizes. These are the states a packet is in on the
    kernel''s connection tracking capabilities. The four states are: NEW, INVALID,
    RELATED, and ESTABLISHED. At any given time a packet, under the control of the
    state engine, is in one of these four states.


    # NETFILTER STATES


    +   * NEW: A new connection. Only the first packet in a connection will meet this
    state. All subsequent packets, for that session, will not be considered NEW.

    * ESTABLISHED: A session that has been established and is being tracked by the
    state engine. All packets that follow after a packet labeled as NEW in a single
    session.

    * RELATED: A special state. A separate connection related to an ESTABLISHED connection
    can happen when an ESTABLISHED connection spawns a new connection as part of its
    data communication process. An example of this is FTP-DATA connection spawned
    by an FTP connection. These types of connections are very complicated and almost
    always require a "helper" module that has been written to understand the underlying
    protocol. If there is no helper module to analyze a complex protocol that requires
    a RELATED connection to function, then that connection will not function properly.

    * INVALID: A packet that is otherwise not identified as having any state. It is
    always a good idea to DROP, not REJECT, this packet.


    A connection''s state, however, can change based on what happens with future packets
    in that connection. An example of this would be a new inet connection. When the
    first packet comes in, it would be in the NEW state; this would create a new connection
    for the state engine to manage. The proceeding packets that create the session
    would move the connection from the NEW state to the ESTABLISHED state.'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'The specific piece of netfilter code that handles all of this magic is called
    conrack. Its job is to watch each session and determine if the packets are part
    of an existing session or a related one and to enforce the rules supplied by the
    userland tools around that information.


    All of this magic occurs in the PREROUTING chain. All connection tracking occurs
    there—except for packets generated by the firewall itself. For instance, if you
    are running a name server on your firewall, and the firewall needs to lookup a
    host name, that packet''s state would be handled in the OUTPUT chain.


    For example, when a packet goes out of the firewall, its initial state is set
    to NEW in the PREROUTING chain; when the packets arrive back at the firewall,
    the PREROUTING chain changes the connection''s state from NEW to ESTABLISHED.
    This state is then passed up the chain to other rules. So if you had a rule that
    allowed ESTABLISHED packets through your FORWARD target, the return packets would
    be allowed back to the client that initiated the connection.


    # WHAT FRAGMENTATION?


    netfilter and iptables have removed the need to muck around with turning fragmentation
    on or off, with 2.0 and 2.2 kernels. Defragmentation, as it is, is always done
    when the state engine is used. The brief explanation for this is that the state
    engine could not work otherwise. Some packets lack enough context to tell the
    kernel enough about the connection it might be associated with. The fact that
    the kernel does this us is a good thing. It makes the firewall more secure, the
    rules can be much simpler because we don''t have to worry about fragments anymore,
    and we can detect other problems with the packet before passing it to a protected
    resource.


    But we are paranoid people and we like to be safe, it never hurts to add in a
    rule to catch any fragments and drop them if something were to go wrong horribly
    with all of this. We''ve never seen this happen, but it''s such a trivial thing
    to add to your firewall rules that we don''t see why it would hurt.


    To catch any fragments that slip through, which again, shouldn''t occur if you
    are using the state engine, add these rules to the top of your rule sets:


    ```

    $IPTABLES -N NOFRAGS

    $IPTABLES -A OUTPUT -p ip -f -j NOFRAGS

    $IPTABLES -A INPUT -p ip -f -j NOFRAGS

    $IPTABLES -A FORWARD -p ip -f -j NOFRAGS

    $IPTABLES -A NOFRAGS -m limit --limit 1/second \

    -j LOG --log-level info --log-prefix "Fragment \

    - DROP " --log-tcp-sequence --log-tcp-options \

    --log-ip-options

    $IPTABLES -A NOFRAGS -j DROP

    ```'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# CHAPTER 6 NETFILTER TABLES OVERVIEW


    Just to be clear, defragmentation happens automatically only when conntrack is
    used. If you are not using the state engine, then you have fragments plenty to
    deal with. You also cannot turn this off if you are using conntrack. If you want
    fragments, then you cannot use the state engine.


    # TAKING A CLOSER LOOK AT THE STATE ENGINE


    Now that we have a basic understanding of how the state engine works, let''s take
    a look at what it''s tracking. The first place to look is in the most powerful
    file system on a Linux system, /proc. In case you are not aware of what /proc
    is, it''s a virtual file system that lets you look at the devices in your system,
    reconfigure some of them, and even to modify the kernels and networks'' behavior
    on the fly. This is an extraordinarily powerful feature of Linux that we highly
    recommend you read up if you are not already familiar with all the things you
    can do under /proc. It''s beyond the scope of this book to spend too much time
    on the rest of /proc, so we will limit ourselves to those parts that relate to
    firewalls, and for now, just the state engine. Pack moving through the state engine
    are in one of four states.


    As the state engine, let''s take a look at /proc/net/ip_conntrack. This lists
    all the current connections the kernel is tracking and any information the system
    has on those connections. A typical entry might look like this:


    ```

    tcp 6 431890 ESTABLISHED src=68.100.73.75 dst=207.126.99.62 sport=47037 dport=80
    src=207.126.99.62 dst=68.100.73.75 sport=80 dport=47037 use=1 bytes=3041

    ```


    All the information needed to determine the current state of this connection is
    provided by looking inside this /proc entry, Table 6.1 contains a breakdown of
    all the fields. You can dump the real-time contents of this by simply typing this
    command:


    ```

    cat /proc/net/ip_conntrack

    ```


    # Table 6.1 Connection Tracking Fields


    | Protocol | Decimal value for Protocol type | Time the connection has to live
    in the engine | Current state of this connection | Source IP | Destination IP
    | Key word: source | Expected Destination | Expected source | Expected source
    |

    |---|---|---|---|---|---|---|---|---||

    | | | (Note 1) | | | | (Note 2) | (Note 2) | (Note 3) | (Note 3) |'
