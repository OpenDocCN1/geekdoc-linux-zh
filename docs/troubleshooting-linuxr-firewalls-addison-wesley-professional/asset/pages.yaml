  md: '# FTP Forward: From One Internet Server to Another Internet Server


    We see this particular scenario all the time when dealing with systems in the
    hosting space. It''s a fairly migratory business with servers moving between the
    large hosting providers or between IP space frequently. The idea is to move your
    content and services to the new system and set up firewall rules on the old system
    to DNAT traffic from the old server to the new server. This is the case typically
    all the content and users have been moved to the new server and all the DNS and
    registrar records have been changed to point to the new server. These rules work
    almost the same as a regular FORWARD rule, the main difference is that our new
    server is only communicating back through the old server when it sends traffic
    its way. Otherwise, it communicates as its normal IP address—through its normal
    network with NAT-ing.


    In this example, we have two hosts, Host-A (11.22.33.44), which is our old server,
    and Host-B (22.33.44.55), our new system. We add the following rules to Host-A:


    ```

    #!/bin/sh


    iPTABLES="/sbin/iptables"

    EXTERNAL=eth0

    OLDSERVER=12.22.33.44

    NEWSERVER=22.33.44.55


    # load the ip_connection tracking modules for ftp

    modprobe ip_conrack_ftp

    modprobe ip_nat_ftp


    iPTABLES -A FORWARD -i $EXTERNAL -o $EXTERNAL \

    \  -p tcp --dport 20:21 -d $OLDSERVER -m state \

    \  --state NEW,ESTABLISHED,RELATED -j ACCEPT


    iPTABLES -t nat -A PREROUTING -i $EXTERNAL -p tcp \

    \  --dport 20:21 -d $OLDSERVER -j DNAT \

    \  --to-destination $NEWSERVER

    iPTABLES -t nat -A POSTROUTING -p tcp --dport 20:21 -d $NEWSERVER \

    \  -j SNAT --to $OLDSERVER

    ```


    ```

    # Enable IP Forwarding in the kernel

    echo 1 >/proc/sys/net/ipv4/ip_forward

    ```'
