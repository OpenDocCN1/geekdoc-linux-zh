- img_proc: true
  md: "# squid-caching server for the network 10.10.10.0/24. The system's Host-B (10.10.10.200),\
    \ and Host-C (10.10.10.201) will be excluded from caching:\n\n```\n$SQUID\nIPTABLES\
    \ -A PREROUTING -t nat -p tcp --dport 80 \\\n  -j SQUID\nIPTABLES -A SQUID -t\
    \ nat -s 10.10.10.200 -j RETURN\nIPTABLES -A SQUID -t nat -s 10.10.10.201 -j RETURN\n\
    IPTABLES -A SQUID -t nat -j REDIRECT --to-port 3128\n```\n\nThe main difference\
    \ here from the previous examples is that we use -j RETURN to match the hosts\
    \ 10.10.10.200 and 10.10.10.201. This performs an exception when those IP addresses\
    \ are matched against the rule and returns to the PREROUTING route, passing the\
    \ traffic from host through the firewall without redirecting it to the squid port.\
    \ All other traffic is not matched against those two exception rules, and will\
    \ be processed by squid.\n\n# NOTE\n\nThe examples do not attempt to handle HTTPS\
    \ traffic. This is because among other things, squid cannot really cache SSL encrypted\
    \ traffic. But more importly, using a transparent proxy with SSL traffic is a\
    \ great example of a man-in-the-middle attack.\n\n# SUMMARY\n\nWeb server DMZs\
    \ are probably one of the more common uses you will find for Linux firewalls these\
    \ days. We run across people running NAT-ed web server clusters in the hosting\
    \ business all the time using Linux boxes as front-end firewalls. Of course, one\
    \ of the more common misconceptions we run into with these users is that when\
    \ a system is compromised—even though a firewall was being used (host-based or\
    \ otherwise). A firewall is not a silver bullet, and while it can protect your\
    \ system from compromise, it cannot protect you from what you allow in. If you\
    \ allow connections to your web server, the firewall does not really protect you\
    \ from web-based attacks.\n\nThis is why we always recommend running web servers\
    \ on dedicated DMZ segments. And when your web server is compromised, it cannot\
    \ be used to leverage access to your internal network."
  merge: -1
