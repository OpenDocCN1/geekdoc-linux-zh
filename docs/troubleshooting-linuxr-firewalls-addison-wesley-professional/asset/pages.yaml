    # # TCP


    TCP connections, unlike UDP, are stateful. They consist of a predefined manner
    of establishing a connection and tearing it down. This mechanism is commonly referred
    to as the handshaking, which was covered in Chapter 5. Because of its connectionoriented
    status, TCP connection has many intermediate states before it reaches the ESTABLISHED
    state.


    # # APPLYING WHAT HAS BEEN COVERED SO FAR BY IMPLEMENTING GOOD RULES


    Now that we have covered risk management, securing the firewall, problem-solving
    methodologies, and netfilter coolers, it''s time to delve into some ideas about
    how to construct good files rules. One of the first tools you can use is iptables
    policies. iptables policies allow a user to set absolute and default rules for
    chains. For instance, if you set the policy for the INPUT chain to DROP, every
    packet going to the firewall''s interfaces not being FORWARD-ed by the firewall
    will be dropped unless you explicitly set a rule to do otherwise. Policies are
    an excellent way of sanity checking your rules by defining a default behavior
    for all rules—if no other conditions are met. For purposes of security, the default
    DROP for the INPUT, OUTPUT, and FORWARD rules is always recommended.


    iptables is linear—that is, rules are checked in a top to bottom, first inserted
    into the kernel order. If a rule exists to allow all traffic to port 23, but a
    later rule says to block traffic from a specific host, that specific host will
    still be able to connect to port 23. It''s critical then to structure your firewall
    rules in a carefully chosen order, putting all of your ACCEPT rules at the end
    of your rulesets so that any explicit and specific DROP or REJECT rules will be
    triggered before them. One of caution—don''t put your default DROP and LOG rules
    above your ACCEPT rules otherwise, nothing will get through your firewall.'
