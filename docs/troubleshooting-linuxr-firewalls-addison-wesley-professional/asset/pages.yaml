  md: '# CHAPTER 16 FILE SERVICES (NFS AND FTP)


    If all this seems familiar, this is because this is exactly the same thing we
    did for web traffic in the previous chapter, with one exception—we have to add
    a ruleset for the FTP-data channel on port 20 and make sure the ip_conntrack_ftp
    and ip_nat_ftp modules are loaded.


    # FTP FORWARD: RESTRICTING FTP ACCESS TO A FORWARDED SERVER


    This next ruleset demonstrates how to limit the hosts that can connect to the
    forwarded FTP server. Our firewall Host-B (192.168.1.21). The following network
    is allowed to connect 22.33.44.0/24 (Internet) to the FTP TCP ports 20 and 21.


    This first configuration demonstrates the rules needed to achieve this type of
    configuration using DNAT rules:


    ```

    #!/bin/sh


    IPTABLES="sbin/sh"


    # where eth0 is the external interface (Internet)

    # where eth1 is the internal interface (10.10.10.0/24)

    # where eth2 is the DMZ interface (192.168.1.0/24)

    EXTERNAL=eth0

    INTERNAL=eth1

    DMZ=eth2


    # Our internal DMZ servers

    SERVER=192.168.1.21


    # load the ip_connection tracking modules for ftp

    modprobe ip_conntrack_ftp

    modprobe ip_nat_ftp


    # clear our old rules

    IPTABLES -F

    IPTABLES -X


    # create our Allow lists

    IPTABLES -N FTPCLIENTS

    IPTABLES -A FTPCLIENTS -s 22.33.44.0/24 -j RETURN

    IPTABLES -A FTPCLIENTS -j DROP

    ```'
  merge: -1
  pgno: 311
- img_proc: true
  md: '```

    $IPTABLES -A FORWARD -i $EXTERNAL -p tcp \\

    --dport 20:21 -m state \\

    --state NEW,ESTABLISHED,RELATED -j FTPCLIENTS

    $IPTABLES -A FORWARD -i $EXTERNAL -p tcp \\

    --dport 20:21 -m state \\

    --state NEW,ESTABLISHED,RELATED -j ACCEPT

    ```


    ```

    $IPTABLES -t nat -A PREROUTING -i $EXTERNAL -p tcp \\

    --dport 20:21 -j DNAT --to-destination SERVER

    ```


    # Enable IP Forwarding in the kernel

    echo 1 >/proc/sys/net/ipv4/ip_forward


    The use of the user defined chain FTPCLIENT allows the firewall administrator
    an easier method of modifying the allow list without having to customize a large
    number of rules. New users can be added to the FTPCLIENTS chain.


    # FTP OUTBOUND: CONNECTIONS ARE ESTABLISHED, BUT DIRECTORIES CANNOT BE LISTED,
    AND FILES CANNOT BE DOWNLOADED


    In this example, internal systems on the network 10.10.10.0/24, behind the firewall-A,
    can successfully connect to FTP servers on the external side of the firewall.
    However, returning DATA port connections are not successfully transmitted through
    the firewall. The result is that commands in the FTP session appear to hang when
    performing commands that return data (1s, get, and so on).


    ![](img/9e2290071e555156f9bb68f2189d9345_312_0.png)


    **Figure 16.6** Outbound FTP connections are established, directories cannot be
    listed, files cannot be downloaded.'
  merge: -1
