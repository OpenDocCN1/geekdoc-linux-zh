- img_proc: true
  md: '3. Ensure that the correct default route and netmask is set on the gateway/firewall
    system. Ensure that the routes back back to the internal networks are correct
    as well. Consider clearing all the firewall rules and testing basic access to
    external and internal networks from the firewall itself.


    4. Enable IP forwarding: echo 1 > /proc/sys/net/ipv4/ip_forward.


    5. Load IP connection tracking module modprobe <modulename>, where <modulename>
    corresponds to the ip_tracking module for the service you are using.


    Example:

    modprobe ip_conntrack_amanda

    modprobe ip_conntrack_ftp

    modprobe ip_conntrack_irc

    modprobe ip_conntrack

    modprobe ip_conntrack_tftap

    modprobe ip_nat_amanda

    modprobe ip_nat_ftp

    modprobe ip_nat_irc

    modprobe ip_nat_snmp_basic

    modprobe ip_nat_tftap


    6. Enable connection tracking or output rules. Connection tracking rules:


    ```

    $IPTABLES -A INPUT -m state --state ESTABLISHED, RELATED -j ACCEPT

    # Don''t set NEW in here**

    $IPTABLES -A OUTPUT -m state --state ESTABLISHED, RELATED -j ACCEPT

    $IPTABLES -A FORWARD -m state --state ESTABLISHED, RELATED -j ACCEPT

    ```


    7. Confirm that the kernel is actually compiled to support IP Forwarding and NAT

    For 2.4.x kernels—if this is a custom compiled kernel, ensure that the following
    is set:


    Make menuconfig for console

    make xconfig for X11


    > ** Setting NEW globally on the INPUT , FORWARD and OUTPUT chains effectively
    disables all your filtering.'
