  md: '# WHAT KDS OF FIREWALLS ARE THEY?


    Just remember, like everything else we''ve discussed so far, firewalls are not
    a silver bullet. Just because you installed one doesn''t mean you''re safe. A
    firewall is a compartmentalization tool with holes in it. If you let someone go
    through your web service port, it''s not going to protect you from web attacks;
    if your browser has a flaw in it, it''s not going to protect you from spyware
    that leverages that hole to attack your computer. It takes more than a firewall
    to manage risk these days.


    # DO I NEED MORE THAN A FIREWALL?


    Yes, always with a doubt, you need more than a firewall. You will need tools to
    help harden your system, to check the integrity of your files, binaries and drivers,
    intrusion detection and prevention tools, patch management technologies, and penetration
    testing tools. Sometimes you might even need military grade cryptography, security
    policies to describe what users can and cannot do, training for those users, and
    above all else, a certification program and even a risk management plan. A firewall
    is never enough for itself.


    # WHAT KDS OF FIREWALLS ARE THERE?


    There are four types of firewalls, which are all available on Linux platforms.
    These are, in order of complexity and features, packet filtering, application
    proxies, stateful inspection, and hybrid. There are, as we will explain, a few
    very specialized firewalls for extremely high security environments, trusted guards,
    and one way filters. These types of firewalls are beyond the scope of this book,
    but if you are interested in learning more about them, we have a section on those
    types of devices at our website (www.gotroot.com).


    # FIREWALL TYPES


    +   - Packet Filtering: These are the first generation of firewalls, generally
    what you see on modern routers these days. While useful, they are generally trivial
    to circumvent an attacker using a number of common attack methods.

    - Application Proxies: This is the second generation of firewall technology, although
    it could be said this is actually the first in some ways. An application layer
    firewall is a proxy server, like the HTTP proxy server, Squid, for example. They
    also provide a layer of granularity into security policy that you won''t find
    in stateful inspection or packet filtering firewalls.'
