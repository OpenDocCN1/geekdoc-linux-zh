- img_proc: true
  md: '# # Using iptables


    # ## PROPER IPTABLES SYNTAX


    In our experience, some of the problems with iptables that are more difficult
    to diagnose stem from a lack of proper understanding of iptables usage and syntax.
    As part of the troubleshooting process, make sure you double-check the proper
    syntax for iptables commands and that you understand how the commands are supposed
    to be used.


    It is beyond the scope of this book to document all the switches for iptables;
    however, a few brief pointers should help with uncovering the proper manner in
    which a command should be executed. The first useful tool is iptables itself,
    iptables has a certain amount of built-in documentation that can be accessed by
    passing iptables the -h switch. When combined with module commands or targets,
    specific information about that module or target may be available. In this example,
    we are using a patched 1.2.9 iptables binary with the fake-source patch added.
    When the -h switch is passed, along with the specific commands and targets we
    are interested in seeing documentation about, we will use the following command
    to access the internal documentation:


    ```

    iptables -j REJECT -h

    ```'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'Along with the normal iptables command help passed back, at the bottom of the
    list you may see some text like this:


    Valid reject types:


    +   - icmp-net-unreachable ICMP network unreachable

    - net-unreach alias

    - icmp-host-unreachable ICMP host unreachable

    - host-unreachable alias

    - icmp-proto-unreachable ICMP protocol unreachable

    - proto-unreachable alias

    - icmp-port-unreachable ICMP port unreachable (default)

    - port-unreach alias

    - icmp-net-prohibited ICMP network prohibited

    - net-prohib alias

    - icmp-host-prohibited ICMP host prohibited

    - host-prohib alias

    - tcp-reset TCP packet

    - tcp-reset alias

    - icmp-admin-prohibited ICMP administratively prohibited (*)

    - admin-prohib


    --fake-source fake the source address with the destination address of the matched
    packet (useful for port unreachable ICMP message).


    > *) See man page or read the INCOMPATIBILITIES file for compatibility issues.


    The proper syntax for this type of documentation request


    ```

    iptables <command switch> <target>-h

    ```


    This can help with some of the more obscure options and with any custom patches
    to iptables that may not otherwise be documented by the netfilter project. With
    regard to the netfilter project, there is no better source of information than
    the developers who created netfilter and iptables. The netfilter website (http://www.netfilter.org)
    contains the most complete set of documentation on iptables and netfilter available
    anywhere. The key lesson to take away from this section is that before you start
    digging deeper into a firewall problem, first make certain the syntax for iptables
    is correct.


    Moving on, one of the more important set of switches to understand the differences
    between are the -I and -A switches. -I is used to insert a rule into the top of
    the current chain. The -A switch, unlike the -I switch, appends a rule to current
    chain. In other words, -A puts the new rule at the end of the chain, and -I puts
    it at the beginning.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'The key thing to stress here is that -I puts rules in before all previous rules,
    and -A puts them in after. This is because the default behavior of -I is to insert
    the rule before all other rules in the chain, in what is referred to as “position
    1.” You can specify the position in the chain you want the rule inserted into
    -I by passing it an integer with that location. We must really advise against
    using the -S in this manner. There may be some unique circumstance when you need
    to do that, but it’s a bad habit to get into, with hard coded numbers, you run
    the risk of getting out of sync with your other rules. The better habit to get
    into is to use the -A and define your rules in the exact order in you want the
    kernel to parse through them. From top to bottom you should have your default
    rules at the end of your list of rules and all your exceptions before these default
    rules.


    Using -I prodigiously is a very common mistake made by those new to iptables.
    For instance, adding a new global DROP rule with the -I to the INPUT chain will
    cause all packets to be dropped; whereas, the -A will just drop any packets that
    not otherwise addressed by your other rules in the INPUT chain before that DROP
    declaration.-I should only be used if you want to stick something in ahead of
    rules you have already placed on a system and only if you really know what you
    are doing. If you are creating a new set of rules, again we recommend you always
    use the -A. This will cause the rules to be added to the chain in the exact order
    in which they are executed whereas with -I, the exact opposite would be true!


    With regard to defining rules by its number, you can also reference a rule by
    either its name—or by its number. As iptables is linear, each rule added into
    the kernel is assigned a number either in the order in which it was added, as
    with -A, or by the position dictated by default with -I, which is in reverse order,
    or in explicit order defined by the user. For instance, suppose you wanted to
    add a new rule to the top of the INPUT chain as the first rule in chain and you
    wanted to reject all SYN packets sent to port 113 on the host. You would use the
    following syntax:


    ```

    $IPTABLES -I INPUT 1 -p tcp -m tcp --dport 113 \n--syn -j REJECT

    ```


    Because the default behavior of -I is used to insert the new rule into the chain
    at position 1, then the following command is as same as the previous example:


    ```

    $IPTABLES -I INPUT -p tcp -m tcp --dport 113 \n--syn -j REJECT

    ```'
  merge: -1
