- img_proc: true
  md: '# # NAT (Network Address Translation) and IP Forwarding


    By far perhaps the most common use of Linux firewalls these days are in SOHO (Small
    Office/Home Office) environments. NAT-ing, or setting up a firewall to perform
    Network Address Translation (NAT) services, is simply a method of translating
    one address space to another—or to be more specific in terms of SOHO users, a
    method of sharing a single network connection amongst multiple machines. NAT-ing
    is probably one of the most common uses of a firewall.


    For more advanced installations, we can use NAT to create “DMZ” networks (short
    for De-Militarized Zones), which are networks that sit off the “side” of the firewall
    to speak. DMZs are dedicated to some specific task such as hosting corporate web,
    mail, DNS, and so DMZ network would be used to provide limited access to/from
    those systems from other networks for the purpose of isolating them from the internal
    network and the Internet. The intent is not only protect those servers, but also
    to protect the internal network from them. After all, they are exposed to untrusted
    web, the Internet perhaps, and those servers have a higher probability of being
    broken into. Because they are isolated on a DMZ network, those servers cannot
    be used to break into the internal network if the firewall is configured properly.
    A word of caution: DMZ is only a DMZ if the firewall is configured to isolate
    the systems on that DMZ network from some other network. If you punch holes in
    your firewall, allowing your DMZ servers to connect back into your Internet network(s),
    you''re seriously weakening if not outright eliminating the protections you get
    by isolating your DMZ servers.


    Some example uses of a DMZ network would be to create a DMZ for all your wireless
    access points (see the VPN chapter for more information on this) and to use that
    DMZ'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# CHAPTER 12 NAT (NETWORK ADDRESS TRANSLATION) AND IP FORWARDING


    to limit your wireless users can access on your internal “wired” network. Another
    use of a DMZ might be to allow access to your web or mail servers from networks
    outside of your control (like the Internet) or a partner’s network. The value
    of such a configuration, as already described, that if your mail or web servers
    are compromised, an intruder could not use those systems to leverage access into
    your internal network.


    In this chapter we will cover diagnostic procedures for some of the most common
    NAT problems and provide examples of how to create specific types of firewalls.
    Specifically, debugging common DMZ mistakes, issues with the common network hardware,
    methods to aid you in debugging NAT or IP forwarding issues, and some frequently
    asked questions regarding Network Address Translation and IP Forwarding configurations
    will be discussed.


    Recall that before starting any of these steps, you will want to apply the troubleshooting
    methodology covered in Chapter 4, and the OSI model technique in Chapter 5 to
    rule out root causes in lower parts of the OSI model (Layers 1 and 2) and also
    to correctly identify and recreate the problem before attempting any of these
    steps.


    # COMMON QUESTIONS ABOUT LINUX NAT


    Q: What''s the real difference between masquerading and SNAT?


    A: Both are methods of moving traffic between networks through the firewall. In
    practice, masquerading is going to be the right choice when you''re dealing with
    dynamic external IP addresses (Internet facing, and so on) and SNAT is going to
    be the right choice when IP address is static and so on) you''re looking to allow
    connections back through your firewall to your internal network. Additionally
    the overhead of supporting SNAT connections is lower than that of supporting masqueraded
    connections.


    Q: Can iptables/nftables use hostnames for DNAT rules rather than IP addresses?


    A: Yes and no. You can certainly use a hostname instead of an IP address in a
    firewall rule; however, when the rule is loaded, this is converted into an IP
    address. So if the intent is to get an effect like name-based virtual hosting
    in apache—multiple hostnames to a single IP address and you want to route those
    connections to different internal machines by the hostname, iptables is not capable
    of doing this by itself. However the addition of a user space application-layer
    proxy, such as the http proxy, squid (http://www.squid-cache.org), or the user
    space utility, iproute2 (ftp://ftp.inp.ac.ru/ip-routing/), would allow you to
    do this.'
  merge: -1
  pgno: 231
- img_proc: true
  md: "# Q: My filter rules aren't working in a NAT environment!\n\nA: One mistake\
    \ you don't want to make is to use DROP/REJECT rules inside a NAT table. This\
    \ is because the NAT table makes heavy use of connection tracking, which simply\
    \ put, means it's not going to see all the packets. The firewall cannot see all\
    \ the packets, then it's pretty likely that you're going to be leaking information—or\
    \ worse, packets and out of your network.\n\nYou'll also see this happen using\
    \ the rmap tests discussed in Chapter 10 when your rules are out of order. Make\
    \ sure you have your DROP rules before you ALLOW rules. A good way to do this\
    \ is to set a global DENY ALL type rule first and then selectively allow what\
    \ kind of traffic you want to allow through that in each step.\n\n# TOOLS/METHODS\
    \ DISCUSSED IN THIS CHAPTER\n\n# DIAGNOSTIC LOGGING\n\nProbably one of the single\
    \ most valuable diagnostic procedures in debugging firewall rules is a catch all\
    \ logging rule, which was covered earlier in Chapter 9. In all of our following\
    \ example rules, we will include that example of our diagnostic catch all rule.\
    \ You may or not want to keep this rule on a production environment, especially\
    \ if you are interested in seeing what your firewall is dropping from a security\
    \ standpoint. However, bear in mind the additional disk space this might require\
    \ for long-term use and potential I/O issues caused by excessive writes to the\
    \ log file(s).\n\nExample:\n\n```\n# catch all dropped packets\niptables -A INPUT\
    \ -p all -m limit --limit 1/second \\\n  -j LOG --log-level info --log-prefix\
    \ FINAL - DROP \"\\n  --log-tcp-sequence --log-tcp-options --log-ip-options\n\
    ```\n\nExample output:\n\n```\nJun 30 17:22:19 localhost kernel: FINAL= DROP IN=eth0\
    \ OUT=\nMAC=ff:ff:ff:ff:ff:ff:00:50:57:00:d2:b9:08 SRC=10.5.64.1 DST=255.255.255.255\n\
    LEN=328 TOS=0x06 PREC=0x00 TTL=16 ID=0 PROTO=UDP SPT=67 DPT=308\nJun 30 17:22:23\
    \ localhost kernel: FINAL= DROP IN=eth1 OUT=\nMAC=ff:ff:ff:ff:ff:ff:00:0a:e6:d8:ec:af:08\
    \ SRC=10.10.12.201 DST=255.255.255.255\nLEN=153 TOS=0x00 PREC=0x00 TTL=64 ID=0\
    \ PROTO=UDP SPT=631 DPT=631 LEN=133\n```"
