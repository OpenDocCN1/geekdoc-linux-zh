- img_proc: true
  md: '# Putting It All Together


    Figure 6.4 shows what all of this looks like when put together. The important
    point in the decision-making process the kernel uses is the routing decision before
    either INPUT or FORWARD rules are used. Remember, INPUT rules do not affect packets
    that the firewall is forwarding to another host. If you want to deny a specific
    type of traffic and only apply to the INPUT rules, then this traffic will continue
    to pass through your firewall to other hosts. When in doubt, do it twice—once
    for the INPUT rules and once for the FORWARD rules.


    So to repeat, if a packet is being forwarded by our firewall, it will bypass the
    INPUT and OUTPUT rules. Remember this when you are constructing your rules and
    diagnosing problems with them. This also helps when creating logging functions,
    to detail if the rule set tripped was an INPUT, OUTPUT, or FORWARD rule. This
    is also where PRERUTING chains come into play. For instance, a packet destined
    for the firewall''s external interface but is actually supposed to be sent to
    a host behind the firewall, and the PRERUTING rules change the packet''s destination.
    NAT is one such case. In this case, the packet would be rewritten and be sent
    down the FORWARD chains because the kernel would make a routing decision (this
    packet is not for us; for another system) and then try to route the packet. The
    netfilter rules would catch it as a forwarding event and process only FORWARD
    rules against it.


    Another place you will see the opposite behavior is with application proxies.
    For instance, if you are using squid on your firewall, the FORWARD rules will
    not be called, even though your firewall is technically forwarding packets. However,
    it''s the application, in this case squid, doing the actual forwarding. The kernel
    has no way of knowing this, so only the INPUT and OUTPUT rules will be tripped
    as squid is just a local process on the firewall.


    netfilter maintains state on Packetsfilter, unlike previous firewalling systems
    in Linux, by having ability to track connections through their life cycles. It
    can automatically open ports on the firewall (if configured correctly) as needed
    to allow dynamic protocols, such as FTP, without the need for complex and potentially
    dangerous rules that set a "range" of ports for such needs. It can track a session
    to ensure that an attacker cannot trick the firewall into passing traffic to a
    system. The connection tracking system can help identify bogus or unclean packets
    that might be a result of an attack, and in general, the new statefulness of the
    Linux firewalling system can make your life much easier.


    As the netfilter developers have been so to point out, you can refer to the elements
    of the Linux kernel that give us the ability to do this as either a connection
    tracking engine or a state engine. We, like the netfilter developers, will use
    both terms interchangeably.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '![](img/9e2290071e555156f9bb68f2189d9345_112_0.png)


    **Figure 6.4** netfilter packet path.'
