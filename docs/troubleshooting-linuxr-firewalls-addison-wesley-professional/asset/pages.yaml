- img_proc: true
  md: '# DNS Lookups Fail: Short DNS Name Lookups Work—Long Name Lookups Do Not


    This problem might also manifest itself as Unix hosts being able to perform short
    lookups only and Windows hosts not able to perform any lookups at all. In general,
    DNS queries that are 512 bytes and below will use UDP port 53 and above that,
    TCP port 53. Windows systems will use both the TCP and UDP ports, regardless of
    size. (We''ve yet to fathom why it will use one over the other.)


    The solution here is to ensure that your firewall rules are not blocking TCP port
    53.


    # DNS Lookups Fail: Nameserver RUNNING ON THE FIREWALL


    In this configuration, the firewall Host-A is running a local DNS server, either
    handling requests for itself or for internal users on the network 10.10.10.0/24.
    Local zones contained on the server function correctly; lookups on Internet records
    fail.


    Regardless of whether this server is acting as a forwarder or an authoritative
    name-server—or even as a DNS proxy, all lookups to external zones will fail if
    the firewall does not a) have rules allowing to make external connections and
    b) have connection tracking enabled.


    In both cases, we can solve this issue with these rules:


    ```

    $iptables -A OUTPUT -m state ---state NEW, ESTABLISHED, RELATED -j ACCEPT

    iptables -A INPUT -m state ---state NEW, ESTABLISHED, RELATED -j ACCEPT

    ```


    Note that this is an OUTPUT rule. This is because the connection is originating
    on the firewall itself. This is a more general purpose rule that is going to allow
    all connections originating on the firewall outbound, which might not be what
    you want. An example of a more restrictive rule follows:


    ```

    # where eth0 is the external interface on our firewall

    $iptables -A OUTPUT -o eth0 -p udp -dport 53 -m state -state NEW -j ACCEPT

    $iptables -A OUTPUT -o eth0 -p tcp -dport 53 -m state -state NEW -j ACCEPT

    $iptables -A INPUT -i eth0 -p udp -dport 53 -m state -state NEW, ESTABLISHED,RELATED
    -j ACCEPT

    $iptables -A INPUT -i eth0 -p tcp -dport 53 -m state -state NEW, ESTABLISHED,RELATED
    -j ACCEPT

    ```'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# DNS LOOKUPS FAIL: NAMESERVER RUNNING ON THE INTERNAL AND/OR DMZ Network


    In this configuration, the internal/DMZ nameserver Host-B (10.10.10.53) cannot
    make DNS lookups through firewall Host-A to root servers. Like the example here,
    this is most likely being caused by two scenarios: a) there are no rules allowing
    this service to connect outbound or b) assuming this service is allowed to connect
    outbound, tracking is not enabled.


    First, assuming that this firewall has a restrictive policy on what connections
    are allowed outbound, we ensure that the service is allowed through the firewall
    with these rules:


    ```

    # where eth1 is the internal interface on the firewall

    IPTABLES -A FORWARD -p tcp -dport 53 -m state --state NEW, ESTABLISHED, RELATED
    -j

    ACCEPT

    IPTABLES -A FORWARD -p udp -dport 53 -m state --state NEW, ESTABLISHED,RELATED
    -j

    ACCEPT

    IPTABLES -A FORWARD -p udp -i eth1 -s 10.10.10.53 -d 0/0 -dport 53 -j ACCEPT

    IPTABLES -A FORWARD -p tcp -i eth1 -s 10.10.10.53 -d 0/0 -dport 53 -j ACCEPT

    ```


    # MISLEADING RDNS ISSUE: NEW MAIL, OR FTP CONNECTIONS TO REMOTE SYSTEMS TAKE 30
    SECONDS OR MORE TO START


    This is not actually a DNS issue at all, but enough people associate it with reverse
    DNS lookups that we decided to put it in this section. The extended description
    of this problem is that in general, other services such as web browsing or instant
    messaging are very responsive. Only connections that appear to involve DNS lookups
    on your firewall, such as an FTP connection for example, take 30 seconds to start.
    What is probably going on here is that the server on the other side is making
    an identd (Auth) request to your server, and it''s timing out waiting for a reply.


    On a host-only firewall, there are three fixes for this. The first is the least
    favorable—to run an identd server on your host. This would add a service that
    could be exploited and leak information about your system, which is not desirable.
    The second method of fixing this is to add a rule to REJECT any identd requests
    to your system. Following is an example:


    ```

    # this will send an icmp response indicating that the identd/auth service is not
    available

    IPTABLES -A INPUT -p tcp -dport 113 -j REJECT

    ```'
