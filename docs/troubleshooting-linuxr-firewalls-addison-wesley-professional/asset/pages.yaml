  md: '# Example Firewall with 3 Interfaces


    ![](img/9e2290071e555156f9bb68f2189d9345_136_0.png)


    Figure 7.1 Example firewall with three interfaces.


    # KERNEL OPTIONS


    The first task to undertake when configuring the firewall ruleset is to turn on
    all the options you would like the kernel to use when processing IP packets. The
    very first thing we recommend is that you turn your ip_forwarding off. Don''t
    worry—it will be turned on after everything is done. Of course, we will show you
    where we think it should be re-enabled as well. The point with turning it off
    is to make sure that nothing is flowing through your firewall when you are changing,
    flushing, and otherwise mucking with your rules. For extremely complicated rulesets,
    it can take a few seconds to load all the rules. We''ve even seen systems with
    thousands of rules that may take a minute to load. During that period it it''s
    possible that something might slip through your firewall that you would not otherwise
    allow. The simplest way to prevent this is to turn ip_forwarding off while you
    are loading your rules and to turn it back on only when you are finished. To turn
    ip_forwarding off, change the boolean value from 1 to 0:


