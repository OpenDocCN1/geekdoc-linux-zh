  md: '# II. Gather All Pertinent Facts About the Situation


    +   - The Golden Question: What Changed?

    - What''s common to this problem?

    - Does it happen from everywhere on the network?

    - Do all OSs seem to be affected by this problem?


    # III. Define What the “End State” Should Be


    +   - How should the system or systems behave normally? In other words, do you
    know the correct behavior is? Make sure you clearly define that; otherwise, you
    will not be able to test the system to determine if it is functioning properly.


    # IV. Develop Possible Solutions and Create an Action Plan


    +   - Develop possible solutions.

    - Develop a plan for each solution.


    # V. Analyze and Compare Possible Solutions


    +   - Start with the simplest problem first.

    - Start with the simplest solution first.


    # VI. Select and Implement the Solution


    +   - Track changes and give yourself the ability to roll back.


    # VII. Critically Analyze the Solution for Effectiveness


    # VIII. Repeat Process Until You Resolve the Problem


    # RECOGNIZE, DEFINE, AND ISOLATE THE PROBLEM


    This is the simplest but most overlooked step in the problem-solving process.
    This is largely due to the perceived obviousness of what the problem is. People
    assume that the problem they are experiencing and reporting is the actual problem.
    More often than not, there are key details missing from the problem narrative.
    For instance, a user might report that he cannot log into a server the firewall
    is protecting, when in reality the user is trying to log into another server.
    The user is confident that he is logging into the server your firewall is protecting,
    but someone made a typo in the DNS server, and the IP address now points to a
    different system where the user does not have an account.


    +   1. What is the problem exactly? Before even touching your firewall, consider
    that the problem may not be related to the firewall at all. As a central component
    in most'
