    $IPTABLES -A INPUT -m state --state ESTABLISHED,RELATED

    ```


    # DHCP: DYNAMICALLY UPDATING FIREWALL RULES WITH THE IP CHANGES


    This is a fairly common scenario—you have a firewall with a dynamically assigned
    IPnaddress, and when that IP address changes, you need to update your firewall
    rules

    accordingly. Most DHCP clients already have the hooks built in to call an external
    script

    en an IP address is renewed. We will cover two of the more popular clients,

    DHClient, and DHCPcd in the following examples:


    DHCPClient is the default DHCP client for Redhat and Fedora systems (this is generally

    already configured by default):


    +   1. Create the file /etc/dhcpclient-exit-hooks.

    2. Load this up in your favorite editor and add in the reference to your firewall
    script,

    example:


    ```

    sh /etc/rc.d/rc.firewall

    ```


    DHCPcd is another popular DHCP client, which you''ll find on distributions such
    as

    Gentoo:


    +   1. Load up /etc/dhcpc/dhcpcd.exe in your favorite editor

    2. Locate the switch case at the end. In this you''ll note several conditions
    on the state of

    t interface (Just activated/New IP, renewal with the same IP, and so on)

    3. In the New IP case, insert a call to your firewall script. For example:


    ```

    sh /etc/rc.d/rc.firewall

    ```'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# CHAPTER 18 DNS/DHCP


    NOTE

    Ensure that your firewall script(s) always flush their rules prior to reloading.

    Ensure something like the following is at the top of your firewall scripts.


    ```

    $IPTABLES -F

    $IPTABLES -X

    ```


    The first line will flush your tables; the second will delete the user-defined
    chains.


    # BLOCKING OUTBOUND DHCP


    This question has been asked enough times that it warranted a response in this
    book. If you have read the Layer 2 chapter of this book already, you might already
    know a bit about the issues with blocking outbound DHCP in a bridging environment
    (or blocking DHCP responses by MAC address for example). This section assumes
    that you are posed with the problem of keeping DHCP requests confined to a physical
    segment, separated by a non-bridging firewall. Here''s the news—DHCP responses
    are not going to cross that firewall. If that''s what you were worried about,
    you''re done; worry no longer. If DHCP is running on the server itself, then all
    that is required is a simple refiguration of the DHCP daemon.


    In the following example, our firewall, Host-A, has two interfaces eth0 (external),
    and eth1 (internal, 10.10.10.0/24). This configuration is using the ISC DHCP daemon
    (http://www.isc.org/), which is commonly the default DHCP server in most Linux
    distributions. To restrict responses to the internal network, in this case interface
    eth1, you would start **dhcpd** with the interface name to which you want to listen.


    For example: /usr/sbin/dhcpd eth1


    On some distributions, as Red Hat systems, you can also set this as a configuration-file:


    +   1. Load up /etc/sysconfig/dhcpd in your favorite editor and set the following


    ```

    DHCPDARGS="eth1"

    ```


    where eth1 responds to the physical interface you want DHCP to listen on. If other
    interfaces were defined in this file, your job is finished at this point.'
