  md: "```\nlet rulenum=$rulenum+1\n;\n(delete)\niptables -t table -D $chain $rulenum\n\
    let rulenum=$rulenum-1\n;\nesac\nlast_chain=$chain\n}\n```\n\n```\nstart() {\n\
    for table in $(cat /proc/net/ip_tables_names); do\nrulenum=1\niptables-save -t\
    \ table | grep '^-'' | \\\n  while read cmd; do\n    log_entry add -t table $cmd\n\
    \    let rulenum=$rulenum+1\n  done\ndone\n}\n```\n\n```\nstop() {\nfor table\
    \ in $(cat /proc/net/ip_tables_names); do\niptables-save -t table | grep '^-''\
    \ | \\\n  while read cmd; do\n    echo $cmd | grep -q -e '--log-prefix \"*\"\n\
    \    if [ $? -eq 0 ]; then\n      log_entry delete -t table $cmd\n    else\n \
    \     log_entry skip -t table $cmd\n    fi\n    let rulenum=$rulenum+1\n  done\n\
    done\n}\n```\n\n```\ncase \"$1\" in\nstart) start\n  ;\nstop) stop\n  ;\n*) echo\
    \ \"Usage: $0 {start|stop}\"\nexit 1\nesac\n```\n\nexit 0"
