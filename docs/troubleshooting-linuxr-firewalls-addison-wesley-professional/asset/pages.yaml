- img_proc: true
  md: 'So, in our example, traceroute sends the initial packet with TTL of 1, the
    first hop subtracts 1 and sends back an ICMP unreachable. Then traceroute sends
    another packet with the TTL set to 2, causing the first hop to decrease the TTL
    in the header field of the packet to 1 and then sends it on to the second hop
    in the route. This second hop decrements the TTL to 0, drops, and sends back a
    destination unreachable message. This process keeps happening, with traceroute
    patiently adding 1 to the TTL, until it generates the final packet to the destination
    host.


    This is where you can use, with iptables, play some neat tricks on traceroute
    by using the iptables TTL target (-j TTL -ttl1-inc <value>) to increase the TTL,
    while traceroute''s performance, by any value you like, causes the packet to bypass
    the firewall, where the firewall becomes "invisible" to traceroute. For example,
    this rule increases the TTL for UDP traceroute packets by one:


    ```

    iptables -t mangle -A PREROUTING -p TCP | \

    --dport 33542 -j TTL --ttl1-inc 1

    ```


