  md: '# CHAPTER 1 INTRODUCTION


    In Information Warfare parlance, there are three general classes of threats. they.
    are unstructured, structured, and highly structured threats. Briefly, they are
    defined as


    +   - **Unstructured**: A non-funded adversary with no specific organization or
    long term planning. Example: disgruntled employee or a lone “cracker.”

    - **Structured**: A funded attacker or group of attackers with some organization
    and funding with generally longer term planning. Examples: organized crime or
    well-funded “cracker” organizations.

    - **Highly Structured**: A highly funded attacker or group of attackers, usually
    with national state assets. Examples: national intelligence agencies or terrorist
    organizations.


    These are general classes of threats, and there are greatly overlaps between them,
    so don''t think of them as hard and fast rules. These are generalizations of all
    the “bad guys” out to help you think about who might want to cause harm to your
    assets, or “steal” them so they can use them for their own purposes or even just
    deny you access to your assets. It is fully to try and divide the motivations
    of a threat. You''ll never know what your attacker is thinking, don''t get caught
    up trying to convince yourself that some attacker won''t be motivated to do something.
    People do things for all sorts of irrational reasons, and computer crackers are
    no exception.


    The point here is understanding the threat is only part of the process of managing
    risk. You should consider the threats against your assets, but you will also need
    to consider the second concept at the same time: value. It is not only important
    to define how valuable your assets are to, but also to understand who might be
    willing to spend some of their own assets to steal or “borrow” yours and what
    those assets might be worth to them. The secretary''s computer might seem unimportant
    in the grand scheme of things, but maybe your attacker wants to use your drive
    space to store something, or perhaps the attacker needs the secretary''s computer
    to break into the network at large and then break into something far more important.
    Keep this in mind when analyzing threats and value in your organization.


    In economic terms, it is also useful to remember that assets are not only money.
    An asset''s value could be the time to break into your system, or perhaps something
    more abstract, the opportunity cost of breaking into your system versus some other
    organization''s systems. The bottom line is that value goes beyond just putting
    a price on an asset; an attacker might not have money in all when breaking into
    a network.


    Consider this example: An unstructured threat, a bored student, decides to try
    and break into your network. The student might have no funding at all to attack
    your assets but is simply curious and motivated to see if he can break into a
    highly secure facility.'
