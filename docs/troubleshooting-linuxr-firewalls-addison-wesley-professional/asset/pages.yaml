- img_proc: true
  md: 'Following is a brief teaser on nmap. To quickly scan a system to determine
    if any ports are open, you can use this simple command:


    ```

    nmap -sS <host name, IP, or network address>

    ```


    This would launch what is referred to as a “SYN” scan against the host or network.
    This is basically a “half open” scan, if you recall from Chapter 5, “The OSI Model:
    Start from the Beginning. This would start the first part of the TCP connection
    by sending the SYN request to the host or hosts. If there were anything listening
    on that, the host could reply with an RST (this is what happens when you use a
    -j REJECT action with your rules), or could simply not reply at all (such as what
    happens when you use a -j DROP with your firewall rules). nmap then pulls all
    information together and tells you which ports are open.


    Another simple and brief foray into nmap would involve how to test a specific
    port. You can do this with the following command:


    ```

    nmap -sS -p 22 <host name, IP, or network address>

    ```


    This would cause nmap to test only one port, 22, or the SSH port, to see if the
    service was open to the host you are testing. You can also perform other types
    of tests with nmap, such as connect with the -s switch instead of the -S switch.
    This would carry out a full three-way handshake before reporting any port as open—and
    other types of scans as well. We will explore the use of nmap with firewalls in
    Chapter 10, “Testing Your Firewall Rules (Security)”,


    # FIREWALL MANAGEMENT AND RULE BUILDING


    Of when it comes to managing multiple or extremely complex firewall environments,
    some of the goals are automating away drudgery and hopefully eliminating “fat-finger”
    mistakes in firewall rules. While not as flexible as creating your own rules by
    hand, these tools go a long way in abstracting the vast majority of the situations
    you will run into when building and integrating firewalls together.


    ISCS, available from http://iscs.sourceforge.net/, is probably one of the more
    exciting open source projects we ran into. ISCS (Integrated Secure Communications
    System) is a management infrastructure for firewalls, VPN’s, PKI, and eventually
    IDS systems with snort. When you’re creating a large network of multiple VPN’s,
    distributed DHCP servers, hundreds of firewalls, and a Public Key Infrastructure
    (PKI), this is the kind of tool you are not going to be able to live without.'
