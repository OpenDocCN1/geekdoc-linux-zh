  md: 'Note that this rule uses the INPUT chain. This is because the traffic is destined
    to the iptables/netfilter system itself. Applying the lessons learned from the
    simple iptables-based MAC filtering detailed previously, we can create a user-defined
    chain to filter out multiple MAC addresses.


    Example:


    ```

    $IPTABLES -N MACFILTER

    $IPTABLES -A MACFILTER -s 00:11:22:33:44:55 -j ACCEPT

    $IPTABLES -A MACFILTER -s 00:11:22:33:44:11 -j ACCEPT

    $IPTABLES -A MACFILTER -s 00:11:22:33:44:22 -j ACCEPT

    $IPTABLES -A MACFILTER -s 00:11:22:33:44:33 -j ACCEPT

    $IPTABLES -A MACFILTER -j DROP

    ```


    This would be followed by an INPUT chain rule to only allow MAC addresses listed
    in MACFILTER to communicate with the firewall.


    ```

    # eth0 -A INPUT -i eth0 -j MACFILTER

    ```


    Just like the MAC Filtering section here, if you only wanted to apply these rules
    on traffic passing through the firewall, you would use


    ```

    $IPTABLES -A FORWARD -i eth0 -j MACFILTER

    ```


    ```

    # eth0 is the physical interface that would be receiving the traffic.

    ```


    # SUMMARY


    As the perl goes, “There’s more than one way to do it!” Firewalling can be done
    in such a way that it is transparent to the user and other components in the network.
    It really depends on the problem you are trying to solve. As mentioned before,
    favor Layer 2 firewalls for internal use in environments where we need to have
    minimal impact on the users. As later chapters will show, it’s not a one-size-fits-all
    process; there times when using netfilter/iptables will be the right solution,
    and other times when it would be better to use a netfilter/iptables as a Layer
    3 device such as NAT, as the next chapter will discuss.'
