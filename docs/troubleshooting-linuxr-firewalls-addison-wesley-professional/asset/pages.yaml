    The second method involves using DNSMasq, available from http://www.thekelleys.org.uk/dnsmasq/doc.html.
    DNSMasq is a much lighter weight DNS Forwarder/DHCP server suited for this type
    of task specifically.


    +   1. DNSMasq (consult the DNSMasq documentation if you are not familiar with
    how to build or install this package). RPM shortcut: rpmbuild -ta dnsmasq-2.6.tar.gz.

    2. Configure your firewall''s /etc/resol.conf. DNSMasq pulls DNS queries from
    the system wide resolve.conf. If you want to configure DNSMasq to use a different
    list of nameservers, load up the DNSMasq config file, /etc/dnsmasq.conf in your
    favorite editor and change the following line:


    resolv-file=/etc/somefile


    where /etc/somefile is your file containing a list of nameservers, one per line,
    that DNSMasq will forward DNS queries to.


    # DNS LOOKUP FAILS: INTERNAL HOSTS COMMUNICATING TO AN EXTERNAL NAMESERVER


    In this configuration, hosts on the RFC1918 network, 10.10.10.0/24, behind the
    firewall (Host-A) cannot successfully make DNS lookups.


    +   1. Before delving into deeper diagnostics, first verify that systems on the
    internal network can make connections through the firewall based on the IP address.
    Second, verify that you are using the correct IP address for the external DNS
    server(s)—and that they are actively active.


    +   2. Assuming that both IP-based connections are successful and that the external
    DNS servers are active, this typically means two things: the NAT rules are not
    using connection tracking or that there are filters on TCP/UDP port 53. Step through
    your firewall rules and verify that these ports are not being blocked.


    324'
