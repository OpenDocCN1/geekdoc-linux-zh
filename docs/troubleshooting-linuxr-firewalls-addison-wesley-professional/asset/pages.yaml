- img_proc: true
  md: '# CHAPTER 2 LOCAL FIREWALL SECURITY


    | Service | Example of user to Run as | Method |

    |------|---|---|

    | postfix | postfix | Set in the main.conf file |

    | sendmail | sendmail | Set in the sendmail.cf file |

    | squid | squid | Set in the squid.conf file |


    You''ll notice that we recommend you run each service as a different user. In
    the past the practice was to run them all as common non-privileged user, such
    as *nobody*. We do not recommend this approach. It''s literally putting all your
    eggs into one basket. If someone breaks in the *nobody* user, he may have access
    to everything of importance on your system also running as *nobody*. The goal
    is to compartmentalize. Every service, where possible, should run as its own user.
    We have additional recipes and instructions about running services with least
    privilege, as always, at our website, www.gtroot.com.


    # RESTRICTING THE FILE SYSTEM


    Aside from managing your file permissions and ensuring that you don''t have certain
    critical files and directories to be world -writable by untrusted groups and users,
    we also recommend isolating critical files and mounting them within special file
    systems.


    The first approach we recommend is the use of **chroot**, which is just short
    hand for "change root." A chroot simply changes the root directory for a process.
    For instance, if you create a directory named /chroot/named, and you **chroot**
    the process to this directory, the named process will see the /chroot/named as
    its directory and should not reach any files outside of that directory. This essentially
    "traps" the named process inside the **chrooted** file system. We must pause at
    this point and warn that the vanilla **chroot** in Linux kernels is not nearly
    as secure as our description implies. There are many ways of escaping **chroots**
    under Linux with the vanilla Linux kernel.


    The news is that there are several security patches for Linux that close these
    holes, such as **openwall** (www.openwall.com) and **grsecurity** (www.grsecurity.net),
    but without these patches or other modifications to the kernel, the **chroot**
    is not as secure as it should be. With that said, every chroot affords some security
    in the face of none, so do chroot your processes where you can and if you can
    patch your kernel, check with your Linux vendor to see if they have hardened the
    kernel to protect against **chroot** escapes.


    The next element to securing your file systems is to move all **suid** files to
    a special file system for **suid** files. If you do not know what **suid** and
    **sgid** files are, they are'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'simply files set with a special file system privileges that tells the Linux
    kernel to run program with elevated privileges. For instance, the passwd command
    has the suid bit set on it, and the file is owned by root. This means that when
    you run the passwd command, the OS will "set the suid," of the process to root,
    the owner of the file. This means that passwd will now run as if root were running
    the command, which is what gives it permission to modify the /etc/passwd and /etc/shadow
    files. The security risk is there if the passwd command or some other suid command
    has some flaw in it, you may be able to exploit that with root privileges. sgid
    files are very similar; when the sgid bit is set on a file, it "sets the group"
    for the process. This means, similar to suid, the process will then run with the
    group privileges of the file it is owned by. In essence, every suid and sgid file
    is a potential hole in the system, review these files carefully and only give
    access to suid and sgid files to trusted users, and remove those suid and sgid
    files you cannot prove that you need.


    After you have isolated suid and sgid files, move them to their own file system
    on which you can set the suid bit to activate in /etc/fstab. Then set all of your
    mount points to nosuid.


    ```

    cat /etc/fstab

    /dev/hda3 /home ext3 nosuid,nodev 1 2

    /dev/hda1 /usr ext3 nosuid,nodev 1 2

    /dev/hda2 /trusted suid 1 2

    /dev/hda4 /tmp ext3 nosuid,nodev 1 2

    ```


    By doing this you can set the rest of your file systems not to allow suid and
    sgid files to run. This also helps you to evaluate suid/sgid files you have on
    your system and to remove the ones you cannot prove that you need, which brings
    us to the final point about suid and sgid files. You want to inventory all of
    these files on your system and remove the suid and sgid bits from any programs
    you do not use.


    # SECURITY TOOLS TO INSTALL


    This is by no means an all-inclusive list—just listing of general categories of
    tools you think you should be running and some examples of software that can fill
    this need.


    # LOG MONITORING TOOLS


    These are tools that parse through the system logs on the firewall to detect events
    worthy of attention. Some of the better tools can categorize and prioritize the
    events to help you identify attacks or even just suspicious behavior.'
