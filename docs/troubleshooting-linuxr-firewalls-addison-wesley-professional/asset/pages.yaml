  md: '# FILTERING ON MAC ADDRESS BOUND TO A SPECIFIC IP ADDRESS WITH IPTABLES


    The first example describes a rule allowing a specific IP address, 10.10.10.12,
    to pass through the firewall if it is bound to the MAC address, 00:11:22:33:44:55.
    This is useful in the case of wireless networks (although not foolproof—MAC addresses
    can be spoofed, too!).


    ```

    iptables -A FORWARD -p IPv4 --ip-src 10.10.10.12 \

    -s ! 00:11:22:33:44:55 -j DROP

    ```


    # FILTERING OUT SPECIFIC PORTS WITH EBABLES


    The following rule demonstrates a more powerful target in iptables, the BROUTING
    policy. The following example shows the ebables rule being used to only allow
    port 25 traffic (SMTP) to the host 10.10.10.12.


    ```

    iptables -t broute -A BROUTING -p ipv4 \

    --ip-dst 10.10.10.12 -ip-proto tcp \

    --ip-dport 25 -j ACCEPT

    iptables -t broute -A BROUTING -p ipv4 \

    --ip-proto tcp --ip-dport 25 -j DROP

    ```


    # BUILDING AN INLINE TRANSPARENT BRIDGING FIREWALL WITH IPTABLES (STEALTH FIREWALL)


    ebables is a far more powerful interface for manipulating traffic at Layer 2;
    however, in environments where you do not need to control Layer 2 traffic with
    the granularity of ebables, iptables can be used for handling firewall rules at
    Layer 3, implemented in a Layer 2 bridge.


    An example of using iptables in a Layer 2 transparent firewall is a worm defense
    system. As Figure 11.4 shows, we have several of these firewalls deployed throughout
    the network where we place restrictions on what kinds of traffic can come into
    and out of the networks. Our users are on the network 192.168.1.0, and we will
    use this firewall to block all NetBIOS traffic going into and out of this network.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '![](img/9e2290071e555156f9bb68f2189d9345_225_0.png)


    The policy on the Layer-2 firewall blocks all NetBios traffic entering and leaving
    the 192.168.32.0/24 network. While the firewall has an IP address, it is only
    used for management purposes. No topology change is required on the 192.168.32.0/24
    hosts. They continue to use the same gateway as prior to the installation of the
    layer-2 firewall.


    **Figure 11.4** The use of inline Layer 2 firewalls.


    The following script would be applied to each firewall, modifying the management
    IP and gateway variables as required.


    ```

    #!/bin/sh


    ABLES=/sbin/iptables

    IFCONFIG=/sbin/ifconfig

    BRCTL=/usr/sbin/brctl

    ROUTE=/sbin/route


    MANAGEMENTIP=192.168.1.51

    MANAGEMENTGATEWAY=192.168.1.1


    # shut down our Ethernet devices

    $IFCONFIG eth0 down

    $IFCONFIG eth1down

    ```'
