- img_proc: true
  md: '# Instant Messaging


    In a instant messaging (IM) is becoming an increasingly popular means of communication
    these days—for both personal and business traffic. In this chapter we cover some
    of the most common problems with supporting the myriad features of IM clients,
    as well as all the different protocols such as AOL''s Instant Messenger (AIM),
    ICQ, Microsoft''s MSN, Yahoo, NetMeeting, and the open source GnomeMeeting client.
    We will also touch on the subject of of what to do when your policy dictates that
    you need effective ways of blocking IM traffic with your firewall.


    # Common Questions/Problems


    Q: Should you be concerned about IM traffic in terms of security?

    A: In a nutshell—yes, absolutely. It''s a vector of data transmission just like
    e-mail, is gen-eral in the clear and unencrypted, and allows the transfer of files,
    and the clients themselves have been subject to numerous security vulnerabilities
    in the past. Your own corporate information security policy will dictate whether
    the risk of using IM is accept-able or not. Personally, we feel it is that IM
    is an excellent addition to any business that could use the added convenience
    for coordinating between coworkers, friends, and family that otherwise would have
    involved a phone call or face-to-face meeting (the social ramifications of this
    we do not feel we are qualified to comment on). The caveat here is that we also
    use encrypting IM plugins (gaim-encryption, http://gaim-encryption-tion.sf.net)
    and definitely advise that other people do the same.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# CHAPTER 17 NETWORKING


    # TOOLS DISCUSSED IN THIS CHAPTER


    +   **Sniffers:** As always, your first line tool here is a good network sniffer.
    Ethereal (http://www.ethereal.com) specifically supports the ability to decode
    several of the more popular IM protocols.


    +   **Proxies:** ReAIM (http://reaim.sourceforge.net/) and GNU Gatekeeper Proxy
    (http://www.willamowius.de/h323develop.html)


    # NetMeeting and GnomMeeting


    NetMeeting (http://www.microsoft.com/windows/netmeeting/) is Microsoft''s other
    "instant" messaging client (the main one being MSN, the messenger...not the ISP/Portal!).
    It''s definitely not remotely in the same ballpark as the other clients when it
    comes to the prolific nature of its acceptance in terms of users. But in the case
    of business users, it''s a fairly common application and lends itself to collaborative
    business needs, including the ability to do remote desktop sharing. Unlike the
    other IM services, NetMeeting does not require access to central servers on the
    Internet to function. Additionally, NetMeeting supports multiple complex protocols,
    including H.323, used for voice-over IP traffic.


    GnomeMeeting (http://www.gnomemeeting.org) is the open source counterpart to Microsoft
    NetMeeting, and is included by default with many Linux distributions these days,
    including Redhat, SuSE, Mandrake, and Debian.


    # CONNECTING TO A REMOTE NetMeeting/GnomeMeeting CLIENT FROM BEHIND AN IPTABLES
    FIREWALL (OUTBOUND CALLS ONLY)


    Generally this is a fairly straightforward setup. Assuming you''re running a standard
    masquerading or NAT firewall, no special settings are required. However, if you
    are experiencing difficulty establishing NetMeeting connections across your firewall,
    ensure that you have connection tracking enabled and that there are not any OUTPUT
    rules on the ports:


    ```

    TCP 1720

    TCP 30000-30010

    UDP 5000-5007

    UDP 5010-5013

    ```'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# CONNECTING TO A NetMeeting/GnomeMeeting Client BEHIND A NETFILTER/IPTABLES
    FIREWALL (INBOUND/OUTBOUND CALLS)


    There are two ways of allowing inbound Net/GnomeMeeting connections through a
    firewall, and it depends on the number of users who require Net/GnomeMeeting access.
    The first method is a Single-Use configuration, where only one system on the inside
    of the firewall can accept inbound connections. This is the most simplistic configuration
    and will cause the least amount of hassle on the part of the remote users attempting
    to communicate with you.


    For users of GnomeMeeting, versions 0.94 have improved support for crossing NAT
    devices considerably. Specifically, you will need to reconfigure your GnomeMeeting
    client to be "NAT aware" by selecting the following preferences:


    ![](img/9e2290071e555156f9bb68f2189d9345_318_0.png)


    Figure 17.1 GnomeMeeting NAT preferences.'
  merge: -1
  pgno: 318
- img_proc: true
  md: "Single-Use configuration is as follows (this script was modified from the fantastic\
    \ documentation provided by the GnomeMeeting developers):\n\n```\n#!/bin/bash\n\
    ```\n\n```\n# = your public Internet-Device\nOUT_DEV=eth0\n```\n\n```\n# = your\
    \ internal Internet-Device\nIN_DEV=eth1\n# Host to which the incoming H323 is\
    \ being forwarded\nIN_HOST=192.168.70.18\n```\n\n```\nTCP_PORT_RANGE=30000:30010\n\
    RTP_PORT_RANGE=5000:5007\nTCP_LISTENING_PORT=1720\nGK_PORT_RANGE=5010:5013\n```\n\
    \n```\n# TCP_PORT_RANGE - H245, if no tunneling is made\n#RTP_PORT_RANGE - RTP\
    \ connections (2 audio, 2 video - RTP and RTCP)\n#TCP_LISTENING_PORT - H323 port\n\
    #GK_PORT_RANGE - if external GK is used\n```\n\n```\n# activate masquerading on\
    \ public interface\nIPTABLES -t nat -A POSTROUTING -o $OUT_DEV \\\n    -j MASQUERADE\n\
    # set incoming port forwarding...\n```\n\n```\nIPTABLES -t nat -I PREROUTING -1\
    \ -i $OUT_DEV -p tcp\n    --dport $TCP_PORT_RANGE -j DNAT --to-dest $IN_HOST\n\
    IPTABLES -t nat -I PREROUTING -1 -i $OUT_DEV -p udp\n    --dport $RTP_PORT_RANGE\
    \ -j DNAT --to-dest $IN_HOST\nIPTABLES -I FORWARD 1 -p tcp -i $OUT_DEV \\\n  \
    \  --dport $TCP_PORT_RANGE -d $IN_HOST -j ACCEPT\nIPTABLES -I FORWARD 1 -p udp\
    \ -i $OUT_DEV \\\n    --dport $RTP_PORT_RANGE -d $IN_HOST -j ACCEPT\nIPTABLES\
    \ -t PREROUTING -1 -i $OUT_DEV -p tcp \\\n    --dport $TCP_LISTENING_PORT -j DNAT\
    \ -to-dest \\\n    $IN_HOST\nIPTABLES -I FORWARD 1 -p tcp -i $OUT_DEV \\\n   \
    \ --dport $TCP_LISTENING_PORT -d $IN_HOST -j ACCEPT\n```"
  merge: -1
  pgno: 319
- img_proc: true
  md: "```\n# add port forwarding for external GK\n$IPTABLES -t nat -I PREROUTING\
    \ -i $OUT_DEV -p udp \\\n    --dport $GK_PORT_RANGE -j DNAT --to-dest $IN_HOST\\\
    nn$IPTABLES -I FORWARD 1 -p udp -d $IN_HOST \\\n    --dport $GK_PORT_RANGE -d\
    \ $IN_HOST -j ACCEPT\\\n$IPTABLES -I POSTROUTING 1 -t nat -o $OUT_DEV \\\n   \
    \ -d $IN_HOST -p udp --dport $GK_PORT_RANGE \\\\\n    -j ACCEPT\n```\n\nFor connecting\
    \ to multiple Net/GnomeMeeting clients in your firewall, you will be required\
    \ to run the GNU Gatekeeper proxy (http://www.willamius.de/h323developopt.html).\n\
    \n# DIRECTLY FROM THE GNOMEMeeting'S DOCUMENTATION\n\nThe latest versions of the\
    \ NAT/PAT gateway have several possibilities that permit you to install it on\
    \ your NAT/PAT gateway and configure it to act as a proxy. After it is installed\
    \ and configured as a proxy (see the config file given below as example), you\
    \ can go in the GnomeMeeting preferences and make GnomeMeeting register to the\
    \ gatekeeper using a given alias (Directory section to register to the gatekeeper,\
    \ Personal Data section to give the alias to use when registering).\n\nDoing so,\
    \ and provided that the correct ports are open on the firewall (read the previous\
    \ section—but keep in mind that the gatekeeper can use other ports), you will\
    \ be able to call registered and non-registered endpoints.\n\nYou can call a registered\
    \ endpoint with GnomeMeeting using its registering aliases (alias, the user e-mail\
    \ address if it is what the external user chose to register on your gatekeeper.\n\
    \nYou can also call an unregistered endpoint using a URL of the form @hostname\
    \ (for example, @heracite.be to call heracite.be if that machine is not registered\
    \ to the gatekeeper.\n\nExternal users cannot call you if they register to your\
    \ gatekeeper installed on your gateway and if they know what aliases you used\
    \ to register to your gatekeeper. The gatekeeper is able to work with H.245 Tunneling\
    \ and without it. It is automatic. Here is the config gatekeeper.ini to configure\
    \ it as a gatekeeper/proxy:\n\n```\n[Gatekeeper::Main]\nFourtytwo=42\n[RoutedMode]\n\
    GKRouted=1\nAcceptUnregisteredCalls=0\n```"
