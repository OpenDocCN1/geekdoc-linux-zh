    # INVALID PACKETS AND RULES TO DROP THEM


    As with the content of a packet, we might want to drop a packet because of its
    headers, because it doesn''t match a known connection state, its checksum doesn''t
    match, or something else is wrong with it. iptables gives us tools to help with
    this, the INVALID state and the unclean module. The INVALID state, described in
    earlier chapters, defines a packet otherwise does not match the NEW, RELATED,
    or ESTABLISHED states. The unclean module, considered experimental and temporarily
    removed from the early 2.6 kernels, is supposed to detect packets with bad header
    options and other problems, such as bad ports. We don''t recommend you use this
    module at this time.


    ```

    iptables -N BOGUS

    iptables -t filter -A INPUT -m conrack \

    --ctstate INVALID -j BOGUS

    iptables -t filter -A OUTPUT -m conrack \

    --ctstate INVALID -j BOGUS

    iptables -t filter -A FORWARD -m conrack \

    --ctstate INVALID -j BOGUS

    iptables -A BOGUS -m limit --limit 1/second -j LOG \

    --log-level info --log-prefix "INVALID PACKET \"

    -- DROP " --log-tcp-sequence --log-tcp-options \

    --log-ip-options

    ```


    ```

    iptables -A BOGUS -j DROP

    ```


    If you want to try the unclean module, here is a simple way to add it into your
    rulesets. Remember that iptables is linear, so if you want the unclean module
    to check all of your packets, you will need to place this chain ahead of any ACCEPT
    rules you may have.


    ```

    iptables -N DIRTY

    iptables -A INPUT -m unclean -j DIRTY

    iptables -A OUTPUT -m unclean -j DIRTY

    iptables -A FORWARD -m unclean -j DIRTY

    iptables -A DIRTY -m limit --limit 1/second -j LOG \

    --log-level info --log-prefix "CLEAN PACKET \"

    -- DROP " --log-tcp-sequence --log-tcp-options \

    --log-ip-options

    iptables -A DIRTY -j DROP

    ```'
