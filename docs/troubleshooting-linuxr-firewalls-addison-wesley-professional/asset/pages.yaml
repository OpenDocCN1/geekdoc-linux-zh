  md: '# Introduction


    # Why We Wrote This Book


    There are a lot of security books—books about risk management, cryptography, cracking,
    hacking, and writing better software, along with many firewall “cookbooks” and
    “bibles.” We wrote this book because there are not many books out that focus specifically
    on what to do when something goes wrong with your firewall or that explain how
    to fix errant firewalls. We wanted to put together a book that would combine the
    practical elements of fixing specific and common problems with Linux firewalls,
    along with how to figure out what might be causing a problem we might not have
    foreseen when we set out to write this book. In our exploration, we found that
    there was no book that did these things. Nothing existed that reduced all these
    disparate pieces of knowledge, the Tao of firewall security, the Zen of troubleshooting,
    and the nifty-gritty, step-by-step instructions to fix a problem. This book presents
    a simple and easy-to-follow methodology for solving problems, along with a practical
    manual that will give the tools and the knowledge to fix some of the common problems
    users experience when building and maintaining Linux-based firewalls.


    When reading this book, realize that our intent is to provide a methodology that
    can serve as the baseline for solving problems. We believe that having a good
    mindset is the most critical tool you can have at your disposal addressing firewall
    issues. We cannot cover every possible problem, but we have combed our resources
    to provide as many common problems encountered with Linux netfilter-based firewalls
    and the solutions to those problems. We arrived at this list of common problems
    by researching all of the public Linux firewall mailing lists, by speaking with
    several large Linux customers,'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# INTRODUCTION


    and by reflecting on our experiences with Linux firewalls spanning over a decade
    of experience working with Linux. Hopefully we will have covered any problems
    you might have


    In, this book seeks to make engineers into mechanics with a whole box full of
    tools, a shelf full of easy to read manuals, and a mind filled with the necessary
    knowledge and scientific thinking to fix any problem a firewall might have. If
    you don''t take the time to fully understand the mechanics of a problem, it''s
    possible we have the solution already documented in this book. If you want to
    understand more, you can read the first half of the book.


    # HOW THIS BOOK IS ORGANIZED


    This book is organized into three sections. Section 1 is a brief introduction
    to our principles of security and risk management in which we explain how firewalls
    work, how they should be set up, and some sample recipes for various firewall
    configurations. If you''re new to firewalls or need a refresher, this is a good
    section for you to read. If you''re old with firewalls, you can probably skip
    this section and move to Sections 2 and 3.


    Section 2 is about troubleshooting and diagnostic methodologies. The intent here
    is to pass on troubleshooting methods and tools to reduce the amount of effort
    involved with troubleshooting and implementing a solution. The goal for this section
    is to teach you how to figure things out for yourself, to do it quickly, and to
    be able to repeat that process in the future. In Section 2 we explain how the
    key element to solving problems is to methodically reduce variables and to start
    with the simplest explanation first.


    Section 3 contains the specific troubleshooting chapters in the book. This is
    where the troubleshooting guides reside. It should be possible to just flip open
    the book to any part of Section 3 and follow the instructions to diagnose and
    fix the problem. The goal of'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'the section is to be a fix-it manual for even the least technically adept user.
    We believe that this gradual procession to the final section of our book provides
    enough background information to make the process of troubleshooting second nature
    to the reader.


    With regard to the issues of making this material as approachable as possible,
    we make no assumption about the reader''s knowledge about good firewalling, risk
    management, and computer security practices. An important thought hopefully not
    lost on the reader is that firewalls and other security devices should be managed
    with a great deal of foresight and knowledge. Failure to utilize a protocol or
    the consequences of allowing it through your firewall could have disastrous consequences.


    However, we do understand that time is short, and sometimes you have to come back
    to it and understand what effect it has. Nevertheless, with that said, along our
    deepest empathy for all the overworked systems engineers out there, it is very
    easy to make changes to security models, firewalls, and other security technologies
    that can have profound and dangerous implications on the security posture of your
    network if you do not understand what those changes do. This book is not meant
    to be a replacement for competent security advice. There is much to be said for
    understanding the products you support, and firewalls are all the more important
    to fully grasp. If you are having trouble understanding the guts of your firewall,
    you could be in trouble. When in doubt, you can never know too much, so avail
    yourself of all the information you can get on information security principles,
    risk management, and specifically firewall fundamentals. Given the propensity
    of organizations to rely solely on their firewalls for the lion''s share of their
    security needs, it''s critical that the firewall be configured in the most secure
    manner possible—it could be all that stands between your network''s continued
    normalcy and high-pressure down time.


    # GOALS OF THIS BOOK


    It is our sincere hope that we accomplish three goals with this book:


    +   1. To teach you, the reader, that security is not really the goal of computer
    security. As strange as that might sound, the only realizable goal of computer
    security is to manage risk. It''s essentially impossible to avoid all the risks
    out there, so you need to learn to manage the consequences of those risks, while
    applying reasonable and effective countermeasures to help mitigate those risks.
    Sometimes, all you will ever be able to recover from a risk. The point is to change
    your mindset and look at the problem through a different lens: risk management.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '2. To teach you how to approach and solve problems in a scientific and methodical
    manner, using a well-known and widely used problem-solving methodology.


    3. Finally and simply, to provide you with a book that contains specific information
    about how to solve your Linux firewall problem.


    We can''t cover every possible problem in this book, so as we''ve already alluded,
    we will have to show you how to troubleshoot and solve unforeseen problems on
    your own. To help with this process and provide access to your peers, we have
    included numerous references to other websites, mailing lists, and forums where
    you might be to seek help from the Linux community, and we''ve also set up our
    website (www.getroot.com) to further assist with the process of documenting new
    problems and provide a forum for the community to discuss them and share information.


    # THE METHODICAL APPROACH AND THE NEED FOR A METHODOLOGY


    Oh no say—not much management speak! Please, I Fear not; we promise that we won''t
    waste your time with YAUM (Yet Another Useless Methodology). We want you to find
    your problem and fix it quickly. So you can call this process, a method, a or
    if you like, call it a methodology—whatever works for you. What we don''t want
    to do is fill your head with some useless babble. This methodology is hard won
    from years of solving problems.


    It started many years ago. Painted on the wall of our parents'' garage was a slogan:
    “1st law of wrenching: always check the spark plugs!” Scott painted this on the
    wall as a reminder of a valuable lesson we learned as teenagers. You need a plan
    for fixing things, and you need some “laws” to make sure you don''t waste a lot
    of time figuring out what your problem is when it''s staring you in the face.


    As it was, had cars, many young men do high school, which were the primary focus
    of our budding engineer minds. They were complex, and when they were fun, they
    took us to places to have fun, and they were essential parts of teenagers'' social
    lives. Without a car, life was a little less fun, and things were much farther
    away. However, our cars were used and needed work—sometimes a lot of work—to keep
    running. So we learned to take care of our cars, to fix them when they broke down,
    and to modify them to make them better. After all, what kind of engineer is happy
    with something it is out of the box? Everything could be a little better, couldn''t
    it? All of this meant that we had to figure out what was wrong with them while
    not wasting too much time doing so. We paid for muscle cars, and we wanted to
    drive them! Enter the first law of wrenching.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The first law of wrenchin was the result of a marathon session trying to figure
    out what was wrong with one of our cars (Mike had a 1972 Pontiac GTO; Scott still
    has a 1970 Oldsmobile 442). For days we struggled to figure out how the motor
    wasn''t performing as it should. We changed the timing, retuned the carburetor,
    drained the tank, changed the headers, and so on. We did everything we could think
    of...except check the spark plugs. That was too easy! It couldn''t be the spark
    plugs, we told ourselves. Five minutes after we stopped convincing ourselves wasn''t
    the spark plugs, we pulled them out. They were covered with soot. The result of
    all our other twiddling had made already fouled plugs an absolute mess. In short,
    the problem was absolute—there was no way we could have gotten that GTO to run
    correctly, and the only solution was the simplest and easiest to execute. After
    that we figured out and had replaced the spark plugs, a five-minute job, if we
    had 1972 GTO running perfectly. What was really glaring about this experience
    was that we knew better! Of course it could be the spark plugs; we just didn''t
    check them, even though all the signs that the root cause were searing us in the
    face, as it were. The idea that the spark plugs were the cause of the problem
    just seemed too simple. We thought, wrongly, that it had to be something more
    complex.


    Back then, our problem was caused by the lack of a clear system for problem solving
    or a mechanism for working through the problem to rules before leaping to what
    we might have thought was the root cause. We needed to work out our way through
    the motor, ruling things out by one and we had to start with the simplest things
    first. From that on, we decided that we wanted to spend more time using our cars
    as opposed to fixing them. So the journey started putting a plan in place to help
    prevent these forays into endlessly searching for the root cause of a problem.
    Over the years, we learned to work through the problem carefully, and we discovered
    that other people had come up with well thought means of troubleshooting as. It
    is hard without experience and knowledge that we present here to help you troubleshoot
    more effectively.


    With Linux firewalls, this need for specific steps and a clearly defined approach
    is now different. There are so many variables in a modern firewall that it''s
    easy to overlook the real source of any problem. For instance, we had a big high-end
    SMP DEC Linux box that we used as a high-end packet switch and firewall. It worked
    perfectly in our lab in Virginia. We shipped it to our ISP, and all the network
    cards simply stopped working. We were puzzled, so we got on the the console and
    found that the network cards were up, that they had IPs, but they simply could
    not talk to anything.


    The NIC driver module was loaded, and the machine worked without any problem for
    weeks on our lab''s network. The co-location facility''s network should have been
    no different, except for one small change: the ISP''s network was Ethernet, and
    our lab'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'was FastEthernet. We didn''t expect this would create any problems. After all,
    the network cards were designed to support both types of network, Ethernet and
    FastEthernet, and we had worked with these drivers on both mediums. Our network
    was faster, and all we did put the box on a slower network. Stepping down, as
    it was, we shouldn''t have made any difference. If we were flummoxed. Why that
    seemingly insignificant difference cause the cards to stop working?


    The simple reason was that we were running the wrong driver. This might seem obvious,
    but the cards we were using were DEC cards, and the wrong drivers would load and
    work with the wrong card, and they would work on a FastEthernet network! In our
    case, the system we thought was Tulip FastEthernet card, when the cards were really
    DEC500s.


    So back in our lab, the Tulip driver worked fine at FastEthernet speeds and never
    once complained about the fact that the card was not a Tulip. Couple with the
    fact that we stocked DEC NIC cards, Tulips, and you can see how this mistake was
    made. They look the same, and the OS showed they were the same when it detected
    them. Fortunately, we had a simple process that we will illustrate how to work
    through this quickly, and we had the system up in short order. Total time to debug
    this problem and fix it was under five minutes.


    The point here is that best and quickest way to arrive at the root cause of your
    firewall problem is the application of a well thought out process of elimination.
    It''s very tempting sometimes to leap to a conclusion about what''s causing the
    problem with your firewall, but unless you''re lucky, you can actually make the
    problem worse. Take our word for it...relax, sit down, and work through the problem
    step by step. Stick with the approach we have outlined in this book, and you''ll
