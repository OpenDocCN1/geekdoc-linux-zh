  pgno: 70
- img_proc: true
  md: 'Two of our favorites are logwatch and logcheck. You can find both of these
    at our website, http://www.gotroot.com. logwatch comes with many Linux distributions
    now, and it basically gives you a daily summary of activity on your system. logwatch
    depends on extensions to understand the log format of the various applications
    running on your system, such as sudo or ssh. If there is no extension on your
    system for the application you wish to monitor, logwatch might miss some important
    information about that application.


    The other side of the coin is logcheck, written by a friend of ours, Craig Rowland.
    Craig''s logcheck takes the approach that you should be notified of anything you
    haven''t told logcheck to ignore. This can generate a considerable amount of alerts,
    but it guarantees you will not miss anything, and by default logcheck comes with
    a number of expressions in its default install to reduce the volume to a useful
    amount of traffic.


    # NETWORK INTRUSION DETECTION


    This might seem out of scope for a firewall, but we think a firewall is a perfect
    place to run an NIDS, or Network Intrusion Detection System, provided that your
    firewall has enough disk space for the logs and enough memory CPU power to handle
    the extra overhead of the NIDS. Generally a firewall is a good choice point to
    see traffic from many networks as it flows through the firewall. For instance,
    many firewalls are built with at least three network interfaces to allow for an
    internal, external, and DMZ network. If you run your NIDS on another system, you
    might need three NIDS boxes to see all this traffic. Also, with the introduction
    of snort and other open source NIDS on the scene, it''s free to run a high quality
    NIDS on as many systems as you want.


    As other services, make sure your NIDS is running of all its components as a non-privileged
    user and that it''s properly chrooted. Snort has these capabilities built in,
    as some of the other open source NIDS. Just because it''s an NIDS does not mean
    it''s free from possible security vulnerabilities. Many commercial and open source
    NIDS have security flaws in that could have led to the compromise of the system
    running the NIDS, so, assume the worst, run them with the least privilege necessary,
    and stick them into a chroot.


    You can find snort at the website, http://www.snort.org. and you can find information
    about other intrusion detection packages at www.gotroot.com.


    # HOST INTRUSION DETECTION


    These tools focus not on looking at what''s going on with your network, but solely
    on what''s going on with the local system. These tools might look at what modules
    are loaded on a system, the users logged in, when they logged in, and from where.
    Others'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'crawl the file system looking for known signs of intrusion, files with bad
    permissions, misconfigured programs, and other behaviors or indicators of problems.
    You might have to run several of these to get the full range of features you want.
    Again, this is only a partial list to get you started. There are many excellent
    HIDS tools and products out there.


    # TIGER


    TIGER is a set of Bourne shell scripts, C programs, and data files which are used
    to perform a security audit of Unix systems. The security audit results are useful
    for system analysis (security auditing) and for real-time, host-based intrusion
    detection (http://www.tigersecurity.org).


    # rkhunter


    This tool scans for rootkits, backdoors, and local exploits (http://www.rootkit.nl/).


    # chkrootkit


    chkrootkit is a tool to locally check for signs of a rootkit. This tool can also
    integrate with later versions of TIGER (http://www.chkrootkit.org/).


    # TITAN


    TITAN is a collection of programs, each of which fixes or tightens one or more
    potential security problems with a particular aspect in the setup or configuration
    of a Unix system. Conceived and created by Brad Powell, it was written in Bourne
    shell, and its simple modular design makes it trivial for anyone who can write
    a shell script or program to add to it, as well as completely understand the internal
    workings of the system.

    ITAN does not replace other security tools, but when used in combination with
    them, it can help the transformation of a new, out of the box system into a firewall
    or security conscious system into a significantly easier task. In a nutshell,
    it attempts to help improve the security of the system it runs on (http://www.fish.com/titan/).


    # samhain


    samhain is an open source file integrity and host-based intrusion detection system
    for Unix and Linux (http://www.la-samhnna.de/samhain/index.html).


    # tripwire


    tripwire is a file integrity checking tool. It''s probably one of the most well
    known HIDS tools. tripwire basically generates a hash, or checksum, of all the
    files on your system you tell it to monitor. If the file changes, tripwire will
    alert you to it. There are commercial as'
  merge: -1
  pgno: 72
