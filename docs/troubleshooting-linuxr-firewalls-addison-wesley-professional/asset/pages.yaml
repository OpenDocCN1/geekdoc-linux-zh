    # Forward: A Basic Masquerading Firewall


    Figure 12.1 is a basic firewall setup using IP masquerading. This type of configuration
    is suitable for environments involving dynamic IP addresses on the external interface.
    If you have a static IP address on your external interface, SNAT configuration
    is going to be a more efficient choice. In this configuration, your firewall Host-A
    protects an internal network, 10.10.10.0/24, and is connected to the Internet
    through a cable or DSL connection. If you''re trying to get a firewall set up
    quickly and aren''t concerned about more complicated features, this is the section
    for you.


    ![](img/9e2290071e555156f9bb68f2189d9345_237_0.png)


    Figure 12.1 A masquerading SOHO firewall.'
  merge: -1
  pgno: 237
- img_proc: true
  md: "This example script is self-contained; it consists of a minimal filtering policy,\
    \ purely allowing all traffic from the internal RFC1918 network to be masqueraded\
    \ out through the external interface:\n\n```\n#!/bin/sh\n\nIPTABLES=\"/sbin/iptables\"\
    \nEXTERNAL=\"eth0\"\nINTERNAL=\"eth1\"\n```\n\n```\n# Flush our old rules\n$IPTABLES\
    \ -F\n$IPTABLES -X\n```\n\n```\n# load your connection tracking modules\nmodprobe\
    \ ip_conntrack\nmodprobe ip_conntrack_ftp\n```\n\n```\n# this next rule is mainly\
    \ for PPPoE, VPN, and DSL users\n$IPTABLES -A FORWARD -p tcp --tcp-flags SYN,RST\
    \ SYN \\\n    -j TCPMSS --clamp-mss-to-pmtu\n```\n\n```\n# these are our connection\
    \ tracking rules\n$IPTABLES -A INPUT -m state \\\n    ---state ESTABLISHED,RELATED\
    \ -j ACCEPT\n$IPTABLES -A OUTPUT -m state \\\n    ---state NEW,ESTABLISHED,RELATED\
    \ -j ACCEPT\n$IPTABLES -A FORWARD -m state \\\n    ---state NEW,ESTABLISHED,RELATED\
    \ -j ACCEPT\n```\n\n```\n# finally, we masquerade our traffic\n$IPTABLES -t nat\
    \ -A POSTROUTING -o eth0 -j MASQUERADE\n```\n\n```\n# Enable IP Forwarding in\
    \ the kernel\necho \"1\" > /proc/sys/net/ipv4/ip_forward\n```"
  merge: -1
  pgno: 238
