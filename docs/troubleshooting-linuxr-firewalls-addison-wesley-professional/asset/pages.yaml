- img_proc: true
  md: 'There are also extension modules for conrack track even more states depending
    on the protocol. What has been covered here is only a partial list of all the
    internal states that can exist for the conrack engine. The important thing to
    remember here is that for the most part, you don''t need to worry about the netfilter
    internal states. The NEW, RELATED, and ESTABLISHED states will get the work done
    for you through iptables.


    There is one other state that we briefly touched on, the INVALID state. This state
    is supposed to catch all packets that don''t easily fall into the other states;
    for instance, packets that are out of order or mangled somehow are supposed to
    be represented as INVALID packets. For the most part, this is true, but in practice
    depends on the version of the kernel and the connection tracking code used. To
    clarify, there are two different connect-tracking engines available for the netfilter
    subsystem in the Linux kernel. Most users will only use the standard engine, which
    comes by default in Linux kernels. There is also an enhanced connection-tracking
    engine that implements and extends TCP connection tracking based on the article,
    "Real Stateful TCP Packet Filtering in IP Filter," by Guido van Rooij. This engine
    is also referred to as the tcp-window-tracking patch. We bring this up because
    it is possible that a packet might trick the default state-tracking engine available
    as a patch for the kernel. If you are interested in using this patch, you will
    find information about how to patch your kernel in later chapters. If you have
    trouble patching your kernel, you can also visit our Web site (www.root.com) for
    assistance.


    On the surface, it appears that the NEW state should do sanity checking of the
    packet to make sure it''s "new" connection. However, iptables has some useful
    features that make this more complicated than it is. NEW does not check to make
    sure the packet is part of a NEW connection in the sense that it is "new" TCP
    or UDP connection; instead, it will just assume that packet that is not assigned
    to some other state is NEW. This means for the unwise firewall administrator,
    the kernel will happily pass a packet that is either the beginning of a three-way
    handshake, a SYN packet, or part of an otherwise existing session. For the average
    firewall, this is a bad thing. We don''t want any old packet coming along and
    getting passed through as a NEW connection. We usually want to see a three-way
    handshake or otherwise for our firewall to truly investigate the "newness" of
    a connection.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# CHAPTER 6 NETFILTER AND IPTABLES OVERVIEW


    This is actually a feature of the firewall that has a practical use. And, no,
    this is not a feature in the "it’s a bug, but let'' call it a feature" sense.
    It’s a darn useful set of behaviors to have in a high-end firewall. For example,
    assume you have two firewalls for your network and one of them goes down. The
    one that went down is immediately replaced by the backup or secondary firewall;
    it simply changes its IP and spoofs its MAC to be the firewall that died. This
    is called failover, and it’s very handy. If iptables required a NEW session to
    fully negotiate it, all the existing connections from the former now-dead firewall
    would die. They wouldn’t work because the firewall would drop them as not being,
    but as something else. To give you the ability to do fancy things like as failover,
    the default behavior is to pick up sessions, midstream as we are, and continue
    on if nothing happened.


    However, if you don’t have this setup (and most people do not), and you are concerned
    about the sorts of packets that might slip through your firewall due to this feature,
    SYN-ACK packets for instance, you obviously want to turn this off. And it turns
    out that it’s a relatively simple thing to do. Just add these rules to the top
    of your firewall rules before any ACCEPT rules, and you’re set.


    ```

    $IPTABLES -N SYN_ONLY

    $IPTABLES -A INPUT -p tcp --syn -m conntrack \

    --ctstate NEW -j SYN_ONLY

    $IPTABLES -A FORWARD -p tcp --syn -m conntrack \

    --ctstate NEW -j SYN_ONLY

    $IPTABLES -A SYN_ONLY -m limit --limit 2/second \

    -j LOG --log-level info --log-prefix \

    --SYN ONLY --DROP --log-tcp-sequence \

    --log-tcp-options --log-ip-options

    $IPTABLES -A SYN_ONLY -j DROP

    ```


    The behavior of the state tracking engine can be changed by installing a patch
    from the netfilter patch-o-omatic archives called the "tcp-window-tracking extension".
    This change causes the tracking engine to maintain state by looking at the TCP
    window settings of the packet.


    The tcp-window-tracking modification to netfilter/iptables expands the TCP connection
    tracking according to the article http://www.iae.lae/users/guido/papers/tcp_filtering.ps.gz
    by Guido van Rooij. In addition to the extended connection tracking capabilities,
    it also supports TCP window scaling and SACK.


    The next chapter will explore these behaviors and how to configure iptables in
    depth.'
  merge: -1
  pgno: 119
