  md: "The following script is a functional working example of the previous script,\
    \ but that forwards all traffic to the IP address of the remote server. This uses\
    \ an external file forwarded to list the source and destination IPs in this format:\
    \ SOURCE-IP:DESTINATION-IP (i.e., 11.22.33.44:22.33.44.55).\n\n```\n#!/bin/sh\n\
    \nIPTABLES=\"/sbin/iptables\"\nCONFIG=/etc/rc.d/forwarded\nEXTERNAL=eth0\n```\n\
    \n```\n# Enable connection tracking\n$IPTABLES -A INPUT -m state \\\n  --state\
    \ ESTABLISHED,RELATED -j ACCEPT\n$IPTABLES -A OUTPUT -m state \\\n  --state NEW,ESTABLISHED,RELATED\
    \ -j ACCEPT\n$IPTABLES -A FORWARD -i EXTERNAL -o EXTERNAL \\\n  --state NEW,ESTABLISHED,RELATED\
    \ -j ACCEPT\n```\n\n```\nfor i in `cat $CONFIG`; do\nSOURCEIP=$(echo $i | awk\
    \ '{print $1}')`\nDESTIP=$(echo $i | awk -F: '{print $2}')`\necho \"Forwarding\
    \ $SOURCEIP to $DESTIP\"\n$IPTABLES -A FORWARD -i $EXTERNAL -o $EXTERNAL \\\n\
    \  -d $SOURCEIP -m state \\\n  NEW,ESTABLISHED,RELATED -j ACCEPT\n$IPTABLES -t\
    \ nat -A PREROUTING -i $EXTERNAL \\\n  -d $SOURCEIP -j DNAT --to-destination $DESTIP\
    \ \\\n$IPTABLES -t nat -A POSTROUTING -d $DESTIP \\\n  -j SNAT --$SOURCEIP\n```\n\
    \n```\ndone\n```\n\n```\n# Enable IP Forwarding in the kernel\necho \"1\" > /proc/sys/net/ipv4/ip_forward\n\
    ```\n\nIn a hosting environment, it's very common to have multiple and sometimes\
    \ hundreds of IPs on one interface. This method makes it possible to mitigate\
    \ the outage time generally experienced while moving large numbers of virtual\
    \ hosts between servers."
