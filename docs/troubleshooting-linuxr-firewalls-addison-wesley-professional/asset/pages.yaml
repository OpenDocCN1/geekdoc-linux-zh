  md: "# FTP INBOUND: REDIRECTING FTP CONNECTIONS TO ANOTHER PORT ON THE SERVER\n\n\
    In this scenario, our FTP server Host-A is not running on the standard FTP port\
    \ (TCP 21), so we will need to use a host-based firewall rule to forward queries\
    \ to the port we're running the FTP server on. In this case, Host-A is running\
    \ an FTP server on port 5050.\n first example assumes that you have a restrictive\
    \ policy, so our first rules are to allow connections to port 21 and 5050:\n\n\
    ```\n$iptables -A INPUT -p tcp --dport 21 -j ACCEPT\n$iptables -A INPUT -p tcp\
    \ --dport 5050 -j ACCEPT\n$iptables -t nat -A PREROUTING -p tcp --dport 21 \\\n\
    \  -j REDIRECT --to-ports 5050\n# This final rule ensures that ftp connections\
    \ that\n# originate locally are redirected\n$iptables -A OUTPUT -t nat -p tcp\
    \ -d EXTERNAL \\\n  --dport 21 -j REDIRECT --to 5050\n```\n\nNote that this final\
    \ rule is applied OUTPUT—this is because it's referring to traffic originating\
    \ on the system itself.\n\n# FTP SERVER: FORWARDING TO AN FTP SERVER BEHIND THE\
    \ FIREWALL ON A DMZ SEGMENT\n\nThis configuration assumes that you have a front-end\
    \ firewall (Host-A) and an FTP server (Host-B, 192.168.1.21) on a DMZ segment\
    \ (192.168.1.0/24). Connections to Host-A on ports 21 will be forwarded to the\
    \ FTP server Host-B on the DMZ segment. Figure 16.4 describes the design.\n\n\
    When working with this type of setup, one of the first things to keep in mind\
    \ is that there are two separate netfilter kernel connection tracking modules\
    \ that must be loaded to get this to work. They are\n\n```\nip_conntrack_ftp\n\
    ip_nat_ftp\n```\n\nThese modules are both configured by default on the commercial\
    \ Linux distributions, like Redhat and SuSE. If your system does not have these\
    \ modules installed, or if you're're using a custom kernel, ensure that you have\
    \ the following configured in your kernel:"
