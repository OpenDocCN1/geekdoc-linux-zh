  md: '# CHAPTER 2 USING FIREWALLS


    The preferred method is to explicitly load your modules after you know which ones
    you need. Loading all the modules, either manually or via our script, can create
    numerous vulnerabilities for network by allowing certain types of traffic to flow
    through your firewall that otherwise may be too risky for you to allow.


    # FIREWALL RULES


    After the kernel is properly configured and all the necessary firewall modules
    are loaded, you can start adding rules into the kernel. As with the order we defined
    at the beginning of this chapter, we will start with any special rules to affect
    the shape of packets for performance reasons. One example is to set up your MSS
    to PMTU clamp rules, as explained in later chapters in this book. We will only
    briefly touch on the problem them to solve it, as it relates to an MTU problem
    typically encountered with PPPoE (PPP over Ethernet) connections, such is that
    the connection will stall. We cover this in more detail in Chapter 12, "NAT (Network
    Address Translation) and IP Forwarding." The point is that you want to put these
    kinds of special purpose packet manipulation rules at the beginning of your firewall
    rules so they will always be used. Here is an example of set of rules to fix an
    MTU problem on an example firewall, were it to be using a DSL connection on its
    Internet interface (eth0).


    ```

    iptables -A OUTPUT -o eth0 -p tcp --tcp-flags \\

    SYN,RST SYN -j TCP --clamp-mss-to-pmtu

    iiptables -A FORWARD -o eth0 -p tcp --tcp-flags \\

    SYN,RST SYN -j TCP --clamp-mss-to-pmtu

    ```


    This would "clamp" the Maximum Segment Size (MSS) to the path MTU. This would
    prevent unnecessary fragmentation in the connection that might cause it to stall.


    # QUALITY OF SERVICE RULES


    Next, we will append our quality of service rules to establish the level of priority
    certain traffic will get for devices that honor what are referred to as Terms
    of Services (TOS) settings. These are just examples, but for our firewalls, we
    like to set telnet and the fpt command to Minimize-Delay, which should cause the
    telnet and fpt command sessions to be a little more responsive when dealing with
    a saturated network.


    ```

    iptables -A PRERUTING -t mangle -p tcp --sport \

    telnet -j TOS --set-tos Minimize-Delay

    ```'
