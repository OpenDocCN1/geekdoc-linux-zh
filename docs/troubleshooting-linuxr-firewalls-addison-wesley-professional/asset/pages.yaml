- img_proc: true
  md: '# CHAPTER 8 A TOUR OF OUR COLLECTIVE TOOLBOX


    If you''re only running a single firewall, ISCS is not really going to be that
    useful to you. However, if you''re in a multiple firewall environment where you
    need to compartmentalize departments from one another (an environment where cheap
    Linux firewalls excel!) or perhaps a business with offices distributed all over
    a region or even the world, ISCS provides a great interface to create and manage
    a distributed infrastructure.


    The following screenshot is just one example of business with multiple departments
    and the access policies between each group, in this case, a default ALLOW policy.
    You can see how quickly you could use this system to compartmentalize departments
    or regions from one another—or perhaps just specific services, such as filtering
    worm ports between departments, a dirt cheap and highly effective method of defending
    large networks against worm infections.


    ![](img/9e2290071e555156f9bb68f2189d9345_177_0.png)


    Figure 8.5 Graphic depicting the iscs interfaces'' visualization of a default
    allow policy.'
