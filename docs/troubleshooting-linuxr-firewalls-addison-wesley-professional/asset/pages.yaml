    # # ANALYZING TRAFFIC UTILIZATION


    Sometimes the problems in the network are not that you cannot get into or out
    of a network; rather, it''s the performance. One of the most common issues we''ve
    found that cause this problem are systems that are consuming vast amounts of network
    resources, such as numerous streaming audio or video users, distributed denial
    of service attack zombies, or just a large download in progress. Finding the source
    of bandwidth consumption can be time-consuming, and if other firewalls or NAT
    devices are involved—like a great game of network hide-and-go-seck.


    **etherape**(http://etherape.sourceforge.net/) is a visualization tool for network
    data. It''s a highly useful tool for looking at how much and what kind of traffic
    systems are attempting to send information through your firewall. Unlike some
    of the other command line tools, **etherape** is entirely graphic, as piping anything
    from **etherape** to something else is out of the query. We need better CLI fans,
    but we use **etherape** because it''s a good visualization tool—it''s good for
    smaller networks or low traffic segments. If you are familiar with **etherman**,
    you will recognize **etherape** right away.'
