  md: "--state NEW,ESTABLISHED,RELATED -j ACCEPT\n$IPTABLES -t nat -A PREROUTING -i\
    \ EXTERNAL -p tcp \\\n-d EXT_HOSTC --dport 80 -j DNAT \\\n--to-destination $HOSTC\n\
    \n# HTTPS traffic, TCP port 80 to HOSTC\n$IPTABLES -A FORWARD -i EXTERNAL -o DMZ\
    \ -p tcp \\\n-d EXT_HOSTC --dport 443 -m state \\\n--state NEW,ESTABLISHED,RELATED\
    \ -j ACCEPT\n$IPTABLES -t nat -A PREROUTING -i EXTERNAL -p tcp \\\n-d EXT_HOSTC\
    \ --dport 443 -j DNAT \\\n--to-destination $HOSTC\n\n# Forward:To a Remote SERVER\
    \ on the INTERNET\n\nThis particular scenario we see all the time when dealing\
    \ with systems in the hosting space. It's a fairly migratory business with servers\
    \ moving frequently between the large hosting providers or between IP space. The\
    \ idea is to move your content and services to the new system and set up firewall\
    \ rules on the old system to DNAT traffic from the old server to the new server.\
    \ This is typically all the content and users have been moved to the new server\
    \ and all the DNS and registrar records have been changed to point to the new\
    \ server. These rules work almost the same as a regular FORWARD rule. The main\
    \ difference is that our new server is only going to communicate back through\
    \ the old server when it sends traffic its way. Otherwise, it communicates as\
    \ its normal IP address, through its normal network, and with no NAT-ing.\nIn\
    \ this example, we have two hosts, Host-A (11.22.33.44), which is our old server,\
    \ and Host-B (22.33.44.55), our new system. We add the following rules to Host-A:\n\
    \n```\n#!/bin/sh\n\nIPTABLES=/sbin/iptables\"\nEXTERNAL=eth0\nOLDSERVER=11.22.33.44\n\
    NEWSERVER=22.33.44.55\n```\n\n```\n# Enable connection tracking\n$IPTABLES -A\
    \ INPUT -m state \\\n  --state NEW,ESTABLISHED,RELATED -j ACCEPT\n$IPTABLES -A\
    \ OUTPUT -m state \\\n  --state NEW,ESTABLISHED,RELATED -j ACCEPT\n$IPTABLES -A\
