    configured.


    # Breaking Down Some Examples


    To get a sense of the wide range of connections you might see in /proc/net/ip_

    rack, we will review some examples. In the next chapter we explore this system
    in

    even greater detail. The intent of this chapter is to cover broad concepts, so
    we will only

    over two of the most common protocols, UDP and TCP.


    The first example that follows is an established TCP session for an HTTP server

    GET request might look like. The packet has also been mangled to allow the client,

    172.31.254.2., to NAT its traffic through the firewall. The second hand of the
    IP pairs

    is the expected source and destination for any return packets.


    ```

    tcp 6 271 ESTABLISHED src=172.31.254.2 dst=1.2.3.4 sport=2503 dport=80

    src=1.2.3.4 dst=EXTERNAL_IP_FOR_NAT_CLIENT sport=80 dport=2503 use=1 bytes=118740288

    ```


    This is what a fully tracked NAT connection might look like. Before a TCP conn-

    eection reaches the ESTABLISHED state, it has to go through the three-way handshake

    process explained in Chapter 5. Within the netfilter state engine, this is reflected
    as part

    of three states: SYN_SENT, SYN_RECV, and ESTABLISHED. For example:


    # Step 1:


    ```

    tcp 6 39 SYN_SENT src=172.31.254.2 dst=172.140.27.241 sport=1848

    dport=3855[UNREPLIED] src=172.140.27.241 dst=EXTERNAL_IP_FOR_NAT_CLIENT sport=3855

    dport=1848 use=1 bytes=144

    ```


    # Step 2:


    ```

    tcp 6 29 SYN_RECV src=1.2.3.4 dst=1.2.3.5 sport=1855 dport=25 src=1.2.3.4

    dst=1.2.3.4 sport=25 dport=1855 use=1 bytes=192

    ```'
