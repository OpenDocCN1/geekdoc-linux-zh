- img_proc: true
  md: 'organizations'' network architectures, the firewall tends to be blamed for
    everything and typically when someone cannot get "out" to the Internet. It''s
    useful to determine if the problem lies elsewhere—before starting in on such a
    complex task as troubleshooting your firewall.


    +   2. Can you duplicate the problem and cause it to occur when you want to? This
    is essential when troubleshooting. The problem may no longer exist, and if you
    cannot duplicate the problem, you will have tremendous testing your solution.


    +   3. Ask the most important question of them all: What changed? We recommend
    you print these two words out and put them up over your desk, because in experience
    these two words solved more problems than everything else combined. In short,
    if the system was working correctly at some point, what has changed between now
    and then? Never assume that changes have not occurred, or that the changes did
    occur have caused the problem you are trying to solve. Sometimes the problem is
    simpler than we imagine.


    +   4. What happens if you revert the system back to its original state? Did that
    solve the problem? This is a critical step that helps to quickly eliminate the
    root cause of a problem. If rolling the system back to its original state does
    not solve the problem, you can run out that change completely.


    +   5. What is the scope of the problem?

    - Isolate the problem.

    - Where is it?

    - Does it affect one system, many systems, one protocol, or all of them?

    - Which ports are involved, and what time of day does the problem occur?

    - Which OSs is it affecting in your organization?

    - If the problem is big, break it into smaller problems and tasks that are easy
    to manage.


    +   6. Prioritize the problem(s). Is this something you have to fix right now?


    # GATHER FACTS


    +   1. Gather all pertinent facts about the situation:

    - Where does this happen?

    - When does this happen?

    - Who does this happen to?

    - What components are involved? (load balancers, switches, desktops, routers,
    and or servers)'
