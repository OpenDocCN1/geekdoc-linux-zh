    The moral of the story is to look at the connections with a close eye and check
    for flags in the packets, such as ECN, if a connection is not working, again before
    moving up the OSI Model. Always rule out lower-level problems before hypothesizing
    about the root of your problem.


    The example above was not meant to single out ECN as a problematic extension to
    IP for all of our servers. What we are showing is how a simple change to the session
    can cause appears to be a higher level problem, the need to truly isolate the
    root cause of a problem, and the tools to do so.


    With ECN however, we like to use it on our internal and Internet reachable machine
    but not as of for our firewalls because there are still too many sites out there
    that do not support ECN. The good news is that you can run ECN off on your firewall,
    and filter out ECN packets on your out-interfaces without causing any problems,
    while gaining the advantages of better congestion control. If you use squid as
    an HTTP proxy for your firewall, either transparent or not, the packets will also
    pack the ECN flag.


    Let''s take a look at another example. We have a firewall with two outbound interfaces
