- img_proc: true
  md: '# CHAPTER II DNS/DHCP


    The following, however, does not work because there''s no MAC address for it:


    ```

    /sbin/dhcpcd -t 60 -h Co -d eth01

    ```


    At this point, we''re in the realm of “there’s more than one way to do it.” We
    could use ebtables (Chapter 15) and do some MAC layer NAT-ing of the device we''d
    like to get a DHCP address for. However, it turns out that the user client itself
    can send the MAC address along with it.


    ```

    /sbin/dhcpcd -R N -t 60 -h Co -I 00:11:22:33:44:55 eth0:1

    ```


    00:11:22:33:44:55 is the MAC address you''d like to send out. The -I flag is the
    “Client Identifier”, which what tells the DHCP server on the other end the unique
    ID, typically the MAC address.


    At this point you would need to configure the firewall rules based on IP address,
    using the IP alias, eth0:1, which is not going to work because iptables/netfilter
    uses the physical, rather than logical, device to match its rules.


    In general, this configuration is probably a bad idea. A safer setup would be
    to add a third interface and establish a DMZ for this device.


    # DHCP: REDIRECT DHCP REQUESTS TO DMZ


    In this configuration we have a firewall (Host-A), a DHCP server (Host-B, 192.168.1.67),
    a DMZ segment (192.168.1.0/24), and an internal network 10.10.10.0/24. The strategy
    is to locate the DHCP server in the DMZ segment, potentially to provide some security
    for this device or for some other infrastructure reason and secure it from the
    hosts on the internal network. In this scenario, it is the “internal” hosts that
    are not to be trusted. This is not a safe configuration for an Internet-reachable
    DMZ. This is a DMZ against the internal network only.


    There are numerous reasons for this sort of configuration—generally they stem
    from providing DHCP services for an untrusted network or perhaps to create some
    sort of fault tolerant DHCP cluster for a large network. Regardless, when we say
    DMZ, we aren’t talking about something Internet hosts can reach. A DHCP server
    on such a DMZ, communicating with internal hosts, would make a fantastic vector
    for attack on internal systems.


    Figure 18.1 should serve to illustrate the utility of this configuration.'
  merge: -1
  pgno: 343
- img_proc: true
  md: '![](img/9e2290071e555156f9bb68f2189d9345_344_0.png)


    **Figure 18.1** Redirect DHCP requests to DMZ.


    While it is possible to use something such as **ebtables** (Chapter 15) to directly
    bridge DHCP requests to our 192.168.1.0/24 network, it also would more or less
    open up the internal DMZ network to several vectors of attack. Instead, in this
    configuration we will use an application layer proxy server called **dhcrelay**
    to relay our client requests to the real DHCP server.


    First, the proxy server, **dhcrelay**, is included in the DHCP package from the
    Internet Software Consortium (ISC).


    From the ISC documentation on **dhcrelay**:


    > The DHCP Relay Agent listens for DHCP and BOOTP queries and responses. When
    a query is received from a client, dhcrelay forwards it to the list of DHCP servers
    specified on the command line. When a reply is received from a server, it is broadcast
    or unicast (according to the relay agent''s ability or the client''s request)
    on the network from which the original request came.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# CHAPTER 18 DNS/DHCP


    This is the standard DHCP server that comes with most Linux distributions, including
    Redhat/Fedora, SuSE, Mandrake, and so on. The first step in this configuration
    is to ensure that this is installed on the server:


    +   Redhat/Mandrake/SuSE users will find this in the dhcp rpm (yum, up2date, and
    redcarpet shortcuts apply).


    ```

    up2date -i dhcp

    yum install dhcp

    rug in dhcp

    ```


    +   For Redhat users, load the configuration file, /etc/sysconfig/dhcrelay, into
    your preferred editor and modify the following:


    ```

    INTERFACES="eth1"

    DHCPSERVERS="

    ```


    Where eth1 is the interface dhcrelay should listen for DHCP requests.

    For other operating systems, consult your documentation on where this is set,
    or start dhcrelay with the following example:


    ```

    dhcrelay -i eth1 192.168.1.67

    ```


    +   Ensure that the firewall rules allow connections on the DHCP ports, 67 and
    68.


    ```

    # where eth1 is your 10.10.10.0/24 network

    $IPTABLES -A INPUT -m state -state ESTABLISHED,RELATED -i eth1

    $IPTABLES -A INPUT -p tcp -dport 67:68 -i eth1 -j ACCEPT

    $IPTABLES -A INPUT -p udp -dport 67:68 -i eth1 -j ACCEPT

    ```'
  merge: -1
