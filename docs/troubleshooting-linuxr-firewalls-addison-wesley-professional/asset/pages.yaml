  md: '# SETTING UP EXAMPLE FIREWALL


    There are also types of port scans that are always indicative of malicious intent,
    as these packets cannot “normally” be produced by standard TCP communication practices.
    In essence, these are packets that contain bogus or illegal TCP flag combinations,
    such as a packet with the SYN and FIN flags set and other illegal combinations.
    First, we create the new chain, PORTSCAN:


    ```

    iptables -N PORTSCAN

    ```


    Then we detect any packets with the FIN, URG and PSH flags set, which is illegal
    and never happens with normal traffic. Because of this, we want to detect it and
    then do something about.


    ```

    iptables -A INPUT -i all -p tcp --tcp-flags ALL \

    FIN,URG,PSH -m recent --set -j PORTSCAN

    iptables -A FORWARD -i all -p tcp --tcp-flags ALL \

    FIN,URG,PSH -m recent --set -j PORTSCAN

    ```


    The same is true for other types of packets, such as SYN/RST, which is also bogus,
    with SYN/FIN and FIN setting all the packet flags, and also the "xmas" tree packet
    flag combination or turning on the URG, ACK, PSH, RST, SYN, and FIN flags. All
    of these are illegal combinations we want to detect and correct. You will notice
    that we are calling a new module, the -m recent module. This module, when used
    with the --set command, will record the IP address of the source (or destination
    if used with --destination-ip command) for use by the recent module. We will cover
    the recent module later on in this chapter, but briefly, it can allow us to temporarily
    block packets from those sources. If this is not something you want to try, just
    remove the -m recent


    ```

    # SYN/RST

    iptables -A INPUT -i all -p tcp --tcp-flags SYN,RST \

    SYN,RST -m recent --set -j PORTSCAN

    iptables -A FORWARD -i all -p tcp \

    --tcp-flags SYN,RST -m recent --set \

    -j PORTSCAN

    ```


    ```

    # SYN/FIN

    iptables -A INPUT -i all -p tcp --tcp-flags SYN,FIN \

    SYN,FIN -m recent --set -j PORTSCAN

    iptables -A FORWARD -i all -p tcp --tcp-flags SYN,FIN\

    SYN,FIN -m recent --set -j PORTSCAN

    ```


