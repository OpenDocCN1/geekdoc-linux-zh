  md: '# The OSI Model: Start from the Beginning


    So now that you know how to use a systematic method for solving problems, it''s
    time to apply knowledge to a well-understood model of networking behavior, the
    Open System Interconnection (OSI) model. The OSI model, in case you are not familiar
    with it, is composed of seven layers that describe all the elements in a networkeded
    connection. Think of it like building a house: To paint the outside of the house,
    you''ve got to have walls. To have walls, you''ve got to have a floor, and to
    have a floor, you need a foundation. The OSI model describes the layers of abstraction
    you need to create interconnected systems.


    We have that when you really don''t know where to start, looking at the problem
    through this lens can be very helpful to quickly rule out elements and find the
    root causes of a tricky problem—without having to resort to more complicated methods.
    This approach might seem bit condescending, but we''re not trying to insult anyone''s
    intelligence with this approach. There are plenty of sexy and complicated solutions
    later on in this book, but they won''t help you diagnose some of the simpler problems
    as easily as this method will.


    Expanding on the example here, to create a network, you must have electrical (or
    optical) connections between devices by plugging them in (Layer 1). Adjacent Network
    Interface Controllers, in turn, can now communicate with each other (MAC addresses,
    Layer 2). IP addresses start at Layer 3; services that receive connections are
    at Layer 4. Layer 5 handles the session information such as an interrupted login
    attempt due to a network failure in the layers below. Layer 6 translates the information
    to from the end user application and the network, and Layer 7 is the User Interface
    itself (web browser).'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Chapter 2 The OSI Model - The Beginning


    | Layer | Description |

    |---|---|

    | Physical Layer 1 | Electron, radio or light signals are all conveyed into a
    usable stream of data at this layer in order to form the most basic layer of serving
    or receiving data in a network. |

    | Data Link Layer 2 | This layer consists of two sub-layers, the Local Link Control
    (LLC) sub-layer, and the Media Access Control sub-layer. LLC is responsible for
    error correction, transmission of "frames which are basically blocks of data MAC
    is responsible for determining how the device accesses the data, and the permission
    to transmit it. |

    | Network Layer 3 | Network routing information. The first layer of the Internet,
    IP (internet Protocol) starts here. |

    | Transport Layer 4 | End to communication control. End to communication control.
    |

    | Session Layer 5 | Handles problems which are not communication Issues. |

    | Presentation Layer 6 | Converts the networking information, into information
    usable by the application, and vice-versa. |

    | Application Layer 7 | The User interface. |


    Figure 5.1 The OSI model.


    Remember the OSI model because we will be referencing it again as part of our
    troubleshooting system. The OSI model can help to quickly work upwards through
    the layers to rule out other problems that might be causing problems at a higher
    layer. For instance, a website could be slow due to a physical problem with the
    Fast Ethernet switch it is plugged into.


    # INTERNET PROTOCOLS AT A GLANCE


    There is no way that we could hope to cover IPs completely in a book about firewall
    diagnostics. It''s a huge subject and has been covered in absolutely fantastic
    detail by the late Great W. Richard Stevens in the books, The Protocols TCP/IP
    Illustrated Volume 1 and The Implementation (TCP/IP Illustrated, Volume 2), coauthored
    by Gary R. Wright. A basic understanding of TCP/IP and how it fits with the concept
    of firewalling, however, is within the scope of this book. If you want to know
    more about TCP/IP, please check out the fine books mentioned here, and if you
    already have a firm grasp of this subject, then you can skip over some of this
    material. We provide it here as a brief introduction for the reader.'
