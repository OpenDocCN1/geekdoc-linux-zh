  md: "# CHAPTER 16 FILE SERVICES (NFS AND FTP)\n\nAssuming that the previous changes\
    \ have been made and you are only attempting to set firewall rules on the NFS\
    \ server itself, you will need to set the following: a default DROP policy, you:\n\
    \n```\n# eth0 is the systems only interface, with the IP address of 10.10.10.100\n\
    $IPTABLES -A INPUT -p tcp -m tcp --dport 111 -j ACCEPT\n$IPTABLES -A INPUT -p\
    \ udp -m udp --dport 111 -j ACCEPT\n$IPTABLES -A INPUT -p tcp -m tcp --dport 2049\
    \ -j ACCEPT\n$IPTABLES -A INPUT -p udp -m udp --dport 2049 -j ACCEPT\n$IPTABLES\
    \ -A INPUT -p tcp -m tcp \\\nn  --dport 4000:4003 -j ACCEPT\n$IPTABLES -A INPUT\
    \ -p udp -m udp \\\nn  --dport 4000:4003 -j ACCEPT\n```\n\nThis would allow connections\
    \ from all hosts to this system. However, if we wanted to limit these connections\
    \ to specific hosts—192.168.1.5 and 192.168.1.6, for example—we could use the\
    \ RETURN target rule and user-defined tables to accomplish this:\n\n```\n# part\
    \ 1\n$IPTABLES -N NFSCLIENTS\n$IPTABLES -N NFSSERVER\n# part 2\n$IPTABLES -A NFSCLIENTS\
    \ -s 192.168.1.5 -j RETURN\n$IPTABLES -A NFSCLIENTS -s 192.168.1.6 -j RETURN\n\
    $IPTABLES -A NFSCLIENTS -j DROP\n```\n\n```\n#part 3\n\n$IPTABLES -A NFSSERVER\
    \ -j NFSCLIENTS\n$IPTABLES -A NFSSERVER -p tcp -m tcp --dport 111 \\\n-j ACCEPT\n\
    $IPTABLES -A NFSSERVER -p udp -m udp --dport 111 \\\n-j ACCEPT\n$IPTABLES -A NFSSERVER\
    \ -p tcp -m tcp --dport 2049 \\\n-j ACCEPT\n$IPTABLES -A NFSSERVER -p udp -m udp\
    \ --dport 2049 \\\n-j ACCEPT\n$IPTABLES -A NFSSERVER -p tcp -m tcp \\\n  --dport\
    \ 4000:4003 -j ACCEPT\n$IPTABLES -A NFSSERVER -p udp -m udp \\\n  --dport 4000:4003\
    \ -j ACCEPT\n$IPTABLES -A NFSSERVER -j DROP\n```"
  merge: -1
  pgno: 299
- img_proc: true
  md: 'The part 1 creates the user-defined chains, NFSCLIENTS, where we will stick
    all our allowed clients, and NFSSERVER, which is where we will contain our NFS
    server itself. part 2 defines the hosts that belong to the NFSCLIENTS allow list,
    using the RETURN flag, part 3 contains the policy that we''re applying to the
    server itself. The first line in part 3 is to include the exception list of hosts
    from NFSCLIENTS and the ending DROP policy. Any hosts that do not match this list
    will be dropped by the final line in NFSCLIENTS before being processed by the
    remainder of the NFSSERVER chain.


    This next configuration assumes that the firewall is located on an internal network
    with internal clients. The "external" interface in this configuration assumes
    the rest of the internal network. "Internal" is for clients in that particular
    department, and we still create a DMZ network to host our NFS server itself. The
    firewall forwards requests for a remote NFS server but will appear to the NFS
    server itself to external clients. Client requests are directed to the firewall''s
    eth0 interface with the IP address of 172.16.10.1. These are then forwarded to
    the internal NFS server, 192.168.1.100.


    ![](img/9e2290071e555156f9bb68f2189d9345_300_0.png)


    Figure 16.2 A DMZ-ed NFS server on an internal corporate network.'
  merge: -1
  pgno: 300
- img_proc: true
  md: "# CHAPTER 16 FILE SERVICES (NFS AND FTP)\n\n```\n#!/bin/sh\nIPTABLES=/sbin/iptables\n\
    #eth0 is the firewalls 172.16.10.0/16 network\n#interface, 172.16.10.1\n#eth1\
    \ is the firewalls internal 10.10.10.0/24 network\n#interface, 10.10.10.1\n#eth2\
    \ is the firewalls dmz 192.168.1.0/24, 192.168.1.1\n```\n\n```\nEXTERNAL=eth0\n\
    INTERNAL=eth1\nDMZ=eth2\n\nEXTERNALIP=172.16.10.1\nSERVER=192.168.1.100\nNFSPORTS=\"\
    111 2049 4000:4003\"\n```\n\n```\n# This example for loop runs through the array\
    \ $NFPORTS, for each port we need\n# to allow. Otherwise, this script could be\
    \ very long.\nfor i in $NFPORTS; do\nIPTABLES -A FORWARD -i $EXTERNAL -o $DMZ\
    \ -p ALL \\\n  --dport $i -m state -state \\ \\\n  NEW,ESTABLISHED,RELATED -j\
    \ ACCEPT \\\nIPTABLES -t nat A PREROUTING -i $EXTERNAL \\\n  -p ALL --dport $i\
    \ -j DNAT --to-destination \\\n  $SERVER\n\ndone\n```\n\n```\n# Final SNAT rule\
    \ on our external interface\nIPTABLES -t nat -A POSTROUTING -i eth1 \\\n  -o $EXTERNAL\
    \ -j SNAT --to $EXTERNAL\n```\n\n```\n# enable IP Forwarding\necho 1 > /proc/sys/net/ipv4/ip_forward\n\
    ```\n\nUnlike many of our other examples where we use NAT to allow access to a\
    \ device, in this example we will show the use of IP forwarding. This requires\
    \ some upstream topology changes from the firewall, specifically setting your\
    \ gateway to understand that the route to the network lies behind the firewall.\
    \ This second configuration assumes the firewall is not using NAT and is purely\
    \ routing the traffic into the 192.168.1.0/24. Furthermore, the firewall is configured\
    \ with an access list to restrict what networks can access this NFS server, specifically\
    \ the network 192.168.2.0/24 and the host 192.168.3.100:\n\n200"
