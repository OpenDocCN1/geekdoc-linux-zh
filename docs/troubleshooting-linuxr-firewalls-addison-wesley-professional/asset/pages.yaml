    $BRCTL addbr br0\n$BRCTL addif br0 eth0\n$BRCTL addif br0 eth1\n\n# add an IP\
    \ address to the bridge device, this is for management purposes only\n$IFCONFIG\
    \ br0 $MANAGEMENTIP\n$ROUTE add default gw $MANAGEMENTGATEWAY\n\n# now for our\
    \ firewall rules\n# note that when bridging these rules are applied against the\
    \ FORWARD\n$IPTABLES -A FORWARD -p all -sport 135 -j REJECT\n$IPTABLES -A FORWARD\
    \ -p all -dport 135 -j REJECT\n$IPTABLES -A FORWARD -p all -sport 137 -j REJECT\n\
    $IPTABLES -A FORWARD -p all -dport 137 -j REJECT\n$IPTABLES -A FORWARD -p all\
    \ -sport 139 -j REJECT\n$IPTABLES -A FORWARD -p all -dport 139 -j REJECT\n$IPTABLES\
    \ -A FORWARD -s 192.168.1.0/24 -j ACCEPT\n$IPTABLES -A FORWARD -d 192.168.1.0/24\
    \ -j ACCEPT\n\n# MAC ADDRESS FILTERING WITH IPTABLES\n\nIn the Layer 2 world,\
    \ systems are uniquely identified by their MAC addresses, which might look something\
    \ like this: 00:90:F5:1E:30:D0. **iptables** can be used at Layer 2, just like\
    \ **ebtables**, specifically for filtering out MAC addresses. You might want to\
    \ do this because you are running a transparent firewall and your users have dynamically\
    \ assigned IP addresses. Filtering purely on the IP address (Layer 3) might not\
    \ be particularly effective due to the fact that these IP addresses are ever changing.\
    \ (Note: MAC addresses can be changed too—this is **not a silver bullet**!)\n\n\
    In the event that you need to filter MAC addresses either destined to or passing\
    \ through the firewall (presumably in a bridging configuration), one recommended\
    \ method is to combine your filter rules into one common defined chain, as follows:\n\
    \n```\n$IPTABLES -N MACFILTER\n$IPTABLES -A MACFILTER -m mac \\\n    --mac-source\
