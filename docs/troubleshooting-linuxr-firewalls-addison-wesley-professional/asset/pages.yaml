  md: "This first configuration demonstrates the rules in Figure 15.1:\n\n```\n# where\
    \ eth0 is the external interface (Internet)\n# where eth1 is the internal interface\
    \ (10.10.10.0/24)\n# where eth2 is the DMZ interface (192.168.1.0/24)\n```\n\n\
    ```\nEXTERNAL=eth0\nINTERNAL=eth1\nDMZ=eth2\n\nSERVER=192.168.1.80\n\n# HTTP traffic,\
    \ TCP port 80\niptables -A FORWARD -i $EXTERNAL -o DMZ -p tcp \\\n  --dport 80\
    \ -m state --state \\\n  NEW,ESTABLISHED,RELATED -j ACCEPT\niptables -t nat -A\
    \ PREROUTING -i $EXTERNAL -p tcp \\\n  --dport 80 -j DNAT --to-destination $SERVER\n\
    \n# HTTPS traffic, TCP port 443\niptables -t nat -A PREROUTING -i $EXTERNAL -p\
    \ tcp \\\n  --dport 443 -j DNAT --to-destination $SERVER\niptables -A FORWARD\
    \ -i $EXTERNAL -o DMZ -p tcp \\\n  --dport 443 -m state --state \\\n  NEW,ESTABLISHED,RELATED\
    \ -j ACCEPT\n```\n\n# Forward:To Multiple Internal Servers\n\nThis next example\
