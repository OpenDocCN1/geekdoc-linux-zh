- img_proc: true
  md: 'The other switch we want to mention when using ping is the -s switch. The size
    of the packet sent and can help with diagnosing MTU problems or other packet size
    problems with your firewall and the networks between your firewall and the target
    of your ping. A normal ping, which is only 84-byte, gets through, and a large
    ping of 2000 bytes does not, the problem is most likely an MTU and fragmentation
    problem.


    ```

    ping -s 2000 www.groot.com

    PING goroot.com (205.241.45.98) 2028 bytes

    2008 bytes from plk.shinn.net (205.241.45.98): icmp_seq=1 ttl=50 time=105 ms

    2008 bytes from plesk.shinn.net (205.241.45.98): icmp_seq=2 ttl=50 time=153 ms

    2008 bytes from plesk.shinn.net (205.241.45.98): icmp_seq=3 ttl=50 time=116 ms

    2008 bytes from plesk.shinn.net (205.241.45.98): icmp_seq=4 ttl=50 time=183 ms

    2008 bytes from plesk.shinn.net (205.241.45.98): icmp_seq=5 ttl=50 time=106 ms

    2008 bytes from plesk.shinn.net (205.241.45.98): icmp_seq=6 ttl=50 time=117 ms

    ```


    -- goroot.com ping statistics

    6 packets transmitted, 6 received, 0% packet loss, time 5008ms

    rt min/avg/max/mdev = 105.469/130.371/183.593/28.654 ms


    nmap is another tool that can ping hosts, unlike ping, it''s not limited to using
    ICMP pings. To send an ICMP ping with nmap, you would use the -s switches with
    nmap in this manner, replacing 10.10.10.192 with the IP address or hostname of
    the host you wanted to ping:


    ```

    nmap -sP 10.10.10.192

    ```


    ```

    Starting nmap 3.50 ( http://www.insecure.org/nmap/ ) at 2004-07-11 23:09 EDT

    Host printer.shinn.net (10.10.10.192) appears to be up.

    nmap run completed -- 1 IP address (1 host) scanned in 0.324 seconds

    ```


    nmap also has the ability to "sweep" a network block, ping all the hosts in that
    box, and then presenting information about which host responded to the ICMP pings.
    This can be useful to determine if a particular host is having a problem at a
    lower layer in the OSI model and routing a network-wide problem. Here is an example
    of using nmap in that manner:


    ```

    nmap -sP 10.10.10.0/24

    ```


    ```

    Starting nmap 3.50 ( http://www.insecure.org/nmap/ ) at 2004-07-11 23:12 EDT

    Host a.foo.com (10.10.10.192) appears to be up.

    Host x.foo.com (10.10.10.253) appears to be up.

    nmap run completed -- 256 IP addresses (2 hosts) scanned in 294.960 seconds

    ```'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'nmap also can generate what is referred to as a tcp ping. This is basically
    accompanied by sending a SYN, ACK, SYN+ACK, or any other packet to host and registering
    the response it gets back from the port that was "pinged." This is an excellent
    way of testing to see if a service is up, when you know the host is. Keep in mind
    that this sort of a "ping" is occurring at Layer 4 of the OSI model and as much
    might not be an effective way of ruling out problems at lower layers.


    If you can ping with ICMP and you aren''t losing any packets, including large
    packets, then you can rule out the problem as a Layer 2 problem. The problem lies
    somewhere in Layers 3 through 7.


    ```

    nmap -sT -p 80 www.gotroot.com

    ```


    Starting nmap 3.50 ( http://www.insecure.org/nmap/ ) at 2004-04-02 21:10 EDT

    Interesting ports on www.gotroot.com (205.241.45.98):

    PORT STATE SERVICE

    80/tcp open http


    nmap run completed -- 1 IP address (1 host) scanned in 0.715 seconds


    The next tool, traceroute, is a key piece of network diagnosis toolkit. traceroute
    can record the routes of a packet as it moves through the network. This is similar
    to using ping with the R switch, traceroute uses a different method for recording
    routes. There are two versions of traceroute—the venerable classic traceroute,
    which uses UDP and ICMP, and tcptraceroute which uses TCP to trace out the routes
    of clients. Both of these tools have their place, so neither is better than the
    other.


    Classic traceroute uses UDP packets with an initial TTL of 1 to determine the
    route to a host. causing the first machine or device it reaches along the way
    to send back an ICMP unreachable message because the message has "lived too long."
    TTL, or Time To Live, is a field in the IP headers that tells a compliant device
    how much "life" is left in the packet. Each device in a route is required to reduce
    the TTL by one before passing the packet on to the next device in the route. traceroute
    uses this to record the route by sending multiple packets with increasing TTLs,
    starting at 1, and increasing from there.


    A device is required to send back an ICMP packet anytime the TTL reaches 0. So,
    when traceroute sends its initial packet, it''s already stacked the deck that
    the first hop will have to reduce the TTL to 0 by subtracting 1 from the initial
    TTL of 1. It''s a pretty neat trick, and it does for each step along the way.
    Each time, traceroute records this information as the next hop in the route by
    looking for those ICMP unreachable packets.'
