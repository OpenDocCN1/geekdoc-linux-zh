    Host-A on ports 80 and 443 (HTTP and HTTPS, respectively) will be forwarded to
    the web server Host-B on the DMZ segment. Figure 15.1 describes the design.


    ![](img/9e2290071e555156f9bb68f2189d9345_285_0.png)


