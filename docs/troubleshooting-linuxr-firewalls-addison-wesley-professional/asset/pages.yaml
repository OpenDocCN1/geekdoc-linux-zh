  md: '# A Tour of Our Collective Toolbox


    Every engineer needs tools to solve problems, and with firewalls there is no exception.
    Thanks to the wonders of open source development, there is a tremendous array
    of tools at your disposal to help test, debug, understand, and diagnose virtually
    any firewall problem. The purpose of this chapter is to review and present the
    tools that we use in this book to help identify and solve firewall problems. We
    have also included some other tools that we do not directly reference but should
    be of use.


    # OLD FAITHFUL


    There are a number of tools we have already touched on that we consider to be
    basic but critical. Even though many readers are already well aware of and how
    to use them, we would be remiss if we did not at least list them here. These tools,
    which have been in use for literally decades, fall into the category of "old faithful"
    because they can, in extremely short order and with little knowledge, tell you
    a lot about the state of affairs with your firewall and network.

    The first is telnet. Certainly other tools such as strobe, nc, nmap, and others
    can initiate calls, but telnet tends to be simple, straightforward to use, and
    something we suspect many of our readers are already familiar with. If it''s not
    already obvious for what you would use telnet, we recommend that you call on telnet
    to help you diagnose quickly if you can connect to a remote TCP server. Again,
    there are other tools such as nmap that can launch multiple connections, using
    different means of connecting and also can connect to UDP services, but telnet
    still remains the simplest to use in our'
