    # Note 1


    This number is reset when a new packet arrives that is relevant to this connection.
    The value is then reset

    to the default value for this connection type.


    # Note 2


    Depending on the direction of the connection—be it a SNAT, MASQ, or DNAT—one of
    these may be

    modified to the NAT-ed IP. See Table 6.1 for an explanation of these fields.


