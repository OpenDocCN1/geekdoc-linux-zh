  md: "# CHAPTER 13 GENERAL IP (LAYER 3)\n\nSERVER=192.168.1.110\n\n```\n# Create\
    \ our user defined chain for exceptions\n$IPTABLES -N USERS\n$IPTABLES -A USERS\
    \ -s 11.22.33.44 -j RETURN\n$IPTABLES -A USERS -s 22.33.44.55 -j RETURN\n$IPTABLES\
    \ -A USERS -j DROP\n```\n\n```\n$IPTABLES -A FORWARD -i EXTERNAL -o DMZ -p tcp\
    \ \\\n    --dport 2122 -m state \\\n    --state NEW, ESTABLISHED, RELATED -j USERS\n\
    $IPTABLES -A FORWARD -i EXTERNAL -o DMZ -p tcp \\\n    --dport 2122 -m state \\\
    \n    --state NEW, ESTABLISHED, RELATED -j ACCEPT\n```\n\nThis is the first time\
    \ we demonstrate the use of -j RETURN. Basically this means when the rule is matched,\
    \ stopping this chain and either return to this chain will be called from (which\
    \ we are not doing in this example) or go to the next chain, in this case the\
    \ line:\n\n```\n$IPTABLES -A FORWARD -i EXTERNAL -o DMZ -p tcp \\\n    --dport\
    \ 2122 -m state \\\n    --state NEW, ESTABLISHED, RELATED -j ACCEPT\n```\n\nThis\
    \ allows our users to merrily resume wielding their 300-foot tall, fire-breathing\
    \ rocket turtle. If you are familiar with the concept of groups in Unix, then\
    \ this idea should not be too much of a stretch to grasp. We are basically creating\
    \ a \"group\" of trusted IP addresses with the name \"USERS.\" This way, we can\
    \ reuse these IP addresses in other rules, thereby simplifying our overall ruleset.\n\
    \n# INBOUND: ALLOWING SSH TO A LOCAL SYSTEM\n\nSecure Shell (SSH) is the most\
    \ common means out of remotely administering a system. If you are in a situation\
    \ where you have to explicitly allow an SSH session to your system, undoubtedly\
    \ you have already grasped the concept of an \"unless allow, deny\" policy; however,\
    \ as a recap, you would need to specify the following rule if your system was\
    \ configured with a default -j DROP policy on the INPUT chain."
