    # Tools DISCUSSED IN THIS CHAPTER


    Sniffers: Probably the most useful tool for when diagnosing any type of tunneling
    or NAT-ing problems has been a really good sniffer. We prefer ethereal (www.ethereal.com),
    which comes with most Linux distributions and is available for just about every
    operating system under the sun (including Linux, Solaris, Windows, OSX, even BeOS).
    Another advantage to ethereal is that it has both a graphical and command line
    interface, which is especially useful that you can change the format of the command
    line interface to emulate the output from other sniffer software (tcpdump and
    snoop, among others).


    In the case of VPN diagnostics, as long as the VPN creates a device, frees creates
    the ipsec device, you can attach to that device and look at the kinds of traffic
    going through the VPN. http://www.openswan.org, is an IPSEC implementation for
    Linux that includes support for numerous authentication mechanisms and is in general
    very compatible with the myriad IPSEC implementations from open source and commercial
    vendors.


    # IPSEC: Internal Systems—Behind a NAT/MASQ FIREWALL CONNECT TO AN EXTERNAL IPSEC
    SERVER


    Extended Description: You have an internal system (Host-A) that creates an IPSEC
    VPN to another system, for example a corporate VPN server (Host-B), through your
    firewall. Non-VPN traffic functions properly, however the VPN connection cannot
    be established. In this “road warrior” configuration, the internal system (laptop
    in diagram here) only connects to the remote system as an end-node; it does not
    perform any routing.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '![](img/9e2290071e555156f9bb68f2189d9345_352_0.png)


    **Figure 19.1** Internal systems cannot connect to external IPSEC server.


    This is a pretty standard configuration with very common problems. In my experience
    with five separate VPN implementations, Ive never had it the same problem twice.
    Some clients are more sensitive to NAT scenarios than others, and some are just
    painfully slow when it comes to authentication. The first step is to ensure that
    you can reach the remote VPN server in the first place, as well as other sites
    on the Internet. Verify that you can access that system with `ping, traceroute`,
    and so on. I spent a whole afternoon tearing my hair out in frustration about
    a VPN not working, only to find out that they had changed IPs.


    The next step is to get a sniffer running on the firewall itself and to look at
    the inbound and outbound traffic in each direction to verify that the traffic
    is traversing the firewall correctly (or at all!). One component to look into
    with VPN software is that you enable it to use NAT Traversal Mode. If traffic
    is not passing through the firewall, this is definitely the first place to start.


    Assuming traffic is not passing through the firewall, this could be due to any
    number of issues, starting with the MTU settings mentioned earlier in this chapter.
    The following is a quick checklist of the more obvious problems that will cause
    a breakdown in this VPN configuration:


    +   1. Are you running a DSL or PPPoE connection between Host-A and the VPN server,
    Host-B? If so, check the MTU settings on the firewall and Host-A. The default
    configurations can be as high as 1500, which will absolutely break your IPSEC
    VPN. Recommended configurations can back this off to as low as 1300 before you
    get a successful connection working. We have also found that shutting down the
    interfaces and reloading the network card modules on the firewall are required
    to get this to into effect 100% of the time—either that or a reboot.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# CHAPTER 19 VISUAL PRIVATE NETWORKS


    2. Does your IPSEC client have a NAT traversal setting? Most of them do, as well
    as other encapsulation options. Enable these options first. If the IPSEC client
    requires these options to traverse NAT safely, no amount of tinkering with the
    firewall itself is going to help you.


    3. Is another IPSEC VPN running on Host-B successfully? We have had the situation
    pop up on a very basic iptables/netfilter configuration where multiple systems
    behind the firewall were connecting to the same remote VPN server. Connection
    tracking was not enabled. Instead, it was using a very basic output rule, so only
    the first system to connect could work. The right answer here is to enable connection
    tracking! While adding the rules after the VPN connection was up didn''t resolve
    the problem; even flushing rules and clearing the connection tracking table didn''t
    help. In the end, a reboot solved the problem. Later it was determined that this
    was an issue with the IPSEC VPN client itself.


    Example Rules:


    ```

    $IPTABLES -A INPUT -m state --state ESTABLISHED, RELATED -j ACCEPT

    $IPTABLES -A OUTPUT -m state --state NEW, ESTABLISHED, RELATED -j ACCEPT

    $IPTABLES -A FORWARD -m state --state NEW, ESTABLISHED,RELATED -j ACCEPT

    ```


    # IPSEC: FIREWALL CANNOT ESTABLISH IPSEC VPNs


    Extended Description: You have a NAT/MASQUERADING firewall that is IPSEC capable
    (free/openswan). This firewall acts as an end-node, NAT/MASQUERADING traffic into
    the VPN itself so all connections inside the VPN, as well as to the external network,
    appear to be coming from the firewall itself. The VPN will either not connect
    or connected won''t route correctly.


    Generally you find this kind of configuration where you do not or cannot allow
    the remote access to your network. I use this configuration personally because
    I do not trust the hosts on the other end of the VPN to be allowed to directly
    communicate with my network. This is also an Optimal Extranet configuration.


    As mentioned earlier in the chapter—and I cannot stress this enough with IPSEC—the
    MTU settings will cause issues here. This is generally the case when the VPN itself
    cannot be established with the remote system. In cases where the VPNs themselves
    are established and communicating successfully, routing to the remote network
    is the trouble. The next thing to check is the NAT rules.


    340'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Tools DISCUSSED IN THIS CHAPTER


    ![](img/9e2290071e555156f9bb68f2189d9345_354_0.png)


    **Figure 19.2** Firewall cannot establish IPSEC VPNs.


    The great way to diagnose this type of problem is with a sniffer like ethereal.
    My method is to look at the ipsec interface itself, in the case of free/openswan
    this is ipsec0, ipsec1, ipsec2, and so on. The following output is from my home
    network through the firewall, minimoose, to a remote network showing a successful
    VPN tunnel:


    ```

    root@minimoose]# tethereal -i ipec0

    107.113060 10.10.12.1 -> 10.10.11.102 TCP 58844 > [SYN] Seq=2062573597 Ack=0

    58840 Len=0 Mss=1460 Tsv=55962409 Tser=0 W=0

    107.17181 10.10.11.10 -> 10.10.12.100 TCP 58844 [SYN, ACK] Seq=2910414569

    Ack2062573598 Win=5792 Len=0 Mss=1460 Tsv=90414655 Tser=559624609 W=0

    107.175746 10.10.12.1 -> 10.10.11.102 TCP 58844 [ACK] Seq=2062573598

    A2910414570 Win=58840 Len=0 Tsv=559624416 Tser=90414655

    ```


    This configuration consists of an internal host called winona (IP 10.10.12.100),
    SSH-through the firewall minimoose (10.10.12.1 internal IP, dynamic IP on the
    external interface), to the remote system 10.10.11.102. Connections from the 10.10.12/24
    network have been NAT-ed and appear to come from the host minimoose using the
    following rules:


    ```

    $IPTABLES -t nat -A POSTROUTING -o ipsec0 -s 10.10.12.0/24 -d 10.10.11/24 -j SNAT

    --to-source 10.10.12.1

    ```'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# CHAPTER 19 VIRTUAL PRIVATE NETWORK


    We would use this configuration where the remote network is only expecting to
    see a single source IP address for accessing hosts on its internal network. Otherwise
    the remote firewall would discard, or not know how to route the 10.10.12.0/24
    traffic back to your network. Here is an example of what would look like:


    ```

    [root@minimoose root]# tethereal -i ipsec

    Capturing on ipsec0

    0.000010.10.11.102 198 -> 10.10.11.102 TCP 58845 >> ssh [SYN] Seq=272408935 Ack=0

    Win=5840 Len=0 MSS=1460 TSV=566028529 TSER=0 WS=0

    0.000010.10.11.102 198 -> 10.10.11.102 TCP 58845 >> ssh [SYN] Seq=272408936 Ack=0

    Win=5840 Len=0 MSS=1460 TSV=566028529 TSER=0 WS=0

    ```


    Note that the 10.10.11.102 isn''t responding. This is due to the fact that 10.10.11.102
    doesn''t have a route back to the 10.10.12.0/24 network. Most likely it is responding
    out its default route. Another important element in this configuration to pay
    attention to is the -o flag, which in iptables designates the interface this rule
    is bound to. In multi-IPSEC configurations, this is an important rule to pay attention
    to, given that in general the default behavior is to bind this to assume the external
    interface on the system. This would make the source for the packets the external
    IP address for all your VPN traffic, breaking your VPN connection.


    # IPSEC: FIREWALL CAN ESTABLISH CONNECTIONS TO A REMOTE VPN SERVER, BUT TRAFFIC
    DOES NOT ROUT CORRECTLY INSIDE THE VPN


    Extended Description: Two firewalls are configured to connect RFC 1918 networks
    to each other over a VPN. In the example, the left side network 10.10.10.0/24
    is attempting to be connected to the right side network 10.10.11.0/24 from the
    firewall, minimoose, to the firewall, jenner, over an IPSec connection such as
    freeopens.


    This configuration is a true NAT to NAT VPN configuration that you would most
    likely be using in an environment where you are linking two corporate networks
    together, perhaps in the case of eliminating a legacy WAN connection.

    as mentioned earlier in the chapter, not every IPS implementation is going to
    be compatible with every other. This is especially true when you get into the
    various authentication mechanisms used. We favor openswan (www.openswan.org),
    which for the most part handles all the standard authentication mechanisms. Assuming
    that the system is with the initial connections not working correctly, the MTU
    settings or ISP policy that blocks IPSEC traffic could be the culprit. The best
    way to verify this is with a sniffer. If you can see your traffic out from one
    firewall but never see it on the other, then the problem is most likely an upstream
    filter blocking your traffic. If the traffic arrives but is discarded, then the
    problem is likely MTU related.


    ![](img/9e2290071e555156f9bb68f2189d9345_355_0.png)'
  merge: -1
  pgno: 355
- img_proc: true
  md: '![](img/9e2290071e555156f9bb68f2189d9345_356_0.png)


    **Figure 19.3** Traffic does not route through VPN.


    Assuming the VPN itself can be established, but the traffic is not routing between
    networks, set up sniffers on both sides to capture traffic between systems. Typically
    the issues in this area are related to the source and/or destination of the packets
    traversing the VPN. Like the section here, the systems on each end will get confused
    as to where to send the return traffic. The following is a basic working example
    of the preceding configuration using freeswan/openswan to link both sides. Keep
    in mind that this is a basic configuration and you would not want to run this
    as it is in a production environment. Specifically, the FORWARD NEW rule should
    be more specific, covering traffic only from your trusted network to whatever
    destinations you want the firewall to forward traffic for:


    ```

    #!/bin/sh


    IPTABLES=/sbin/iptables


    #Connection tracking rules

    $IPTABLES -A INPUT -m state -state ESTABLISHED,RELATED -j ACCEPT

    $IPTABLES -A OUTPUT -m state -state NEW,ESTABLISHED,RELATED -j ACCEPT

    $IPTABLES -A FORWARD -m state -state NEW,ESTABLISHED,RELATED -j ACCEPT

    ```


    ```

    # eth0 is our external dynamic interface, eth1 is our internal interface

    $IPTABLES -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    ```

    # enable IP Forwarding

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
