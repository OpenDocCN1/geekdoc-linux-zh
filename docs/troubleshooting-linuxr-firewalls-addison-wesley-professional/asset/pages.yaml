  md: "# MSN MESSENGER\n\nMSN is the other instant messaging client from Microsoft,\
    \ available at http://messenger.msn.com/. Unlike NetMeeting, it's a much \"lighter\
    \ weight\" client and uses basic TCP ports to communicate to its central servers.\
    \ It also now includes the ability to handle video and voice traffic as well as\
    \ transfers.\n\n# CONNECTING TO OTHER MSN USERS\n\nText messaging is rarely an\
    \ issue with MSN Messenger; it uses standard TCP ports, and provided you are not\
    \ blocking anything outbound, it is a very simple connection that \"just works\"\
    \ as long as your NAT/Masquerading rules are set up correctly.\n\nFile, video\
    \ and voice transfers are a completely different matter, however, and to get these\
    \ to work consistently, we recommend the use of a transparent proxy like ReAIM\
    \ (http://reaim.sourceforge.net/) on your firewall. After it is installed and\
    \ running, you will need to add some firewall rules to ensure that your MSN connections\
    \ are being routed through the proxy server transparent. This ensures that your\
    \ users will not have to make any configuration changes in their desktop MSN clients.\n\
    \nThe following rules and documentation were copied from the ReAIM website:\n\n\
    +   # assuming eth0 is the external interface\n# assuming eth1 is the internal\
    \ interface\n\n```\n$IPTABLES -t nat -A PREROUTING -i eth1 -p tcp \\\n  --dport\
    \ 1863 -j REDIRECT --to-ports 1863\n$IPTABLES -A INPUT -i eth1 -p tcp --dport\
    \ 1863 \\\n  -j ACCEPT\n```\n\nThe proxy will manage the redirected AIM and MSN\
    \ messages and redirected AIM Share so that direct connections appear to be from\
    \ the external IP address, on the port range 40000-40099. However, this is not\
    \ enough—the AIM software does not honor the overrides ReAIM uses, so we also\
    \ listen to ports 4443 and 5566. For good measure, we listen to the MSN port too.\n\
    \nSo, the very basic setup, in addition to your current ruleset, is to permit\
    \ connections to these ports.\n\n```\n$IPTABLES -A INPUT -i eth0 -p tcp --dport\
    \ 1863:1864 \\\n  -j ACCEPT\n$IPTABLES -A INPUT -i eth0 -p tcp --dport 4443 \\\
    \n  -j ACCEPT\n```"
  merge: -1
  pgno: 322
- img_proc: true
  md: "```\nSIPTABLES -A INPUT -i eth0 -p tcp --dport 5566 \\\n  -j ACCEPT\nSIPTABLES\
    \ -A INPUT -i eth0 -p tcp --dport 40000:40099\\\n  -j ACCEPT\n```\n\n# BLOCKING\
    \ MESSENGER TRAFFIC AT THE FIREWALL\n\nThe standard MSN client uses TCP port 1863;\
    \ however, it has been reported that some clients will also attempt to fall back\
    \ on other standard ports such as 80 (http) and 443 (https) to reestablish their\
    \ connections. One strategy is to block access to the login servers themselves.\
    \ At the writing of this book, this was messenger.hotmail1.com, which maps to\
    \ 207.46.104.20—although I suspect MSN will have other login servers in that network\
    \ space. Your approach here can be three-fold:\n\nLog and Filter MSN port 1863:\n\
    \n```\nSIPTABLES -A FORWARD -p tcp --dport 1863 -m limit \\\n  --limit 1/second\
    \ -j LOG --log-level info \\\n  --log-prefix \"Policy Violation: MSN \"\nSIPTABLES\
    \ -A FORWARD -p tcp --dport 1863 -j DROP\n```\n\nLog and Filter the login server:\n\
    \n```\nSIPTABLES -A FORWARD -d 207.46.104.20 -m limit \\\n  --limit 1/second -j\
    \ LOG --log-level info \\\n  --log-prefix \"Policy Violation: MSN \"\nSIPTABLES\
    \ -A FORWARD -d 207.46.104.20 -j DROP\n```\n\nLog and Filter the messaging servers:\n\
    \n```\nSIPTABLES -A FORWARD -d 207.46.110.0/25 -m limit \\\n  --limit 1/second\
    \ -j LOG --log-level info \\\n  --log-prefix \"Policy Violation: MSN \"\nSIPTABLES\
    \ -A FORWARD -d 207.46.110.0/25 -j DROP\n```"
  merge: -1
  pgno: 323
- img_proc: true
  md: '# YAHOO MESSENGER


    Yahoo Messenger is the instant messaging client from Yahoo. It supports voice,
    video, and file transfers in addition to standard text instant messaging. It uses
    several TCP and UDP ports depending upon the services being used. The following
    page on Yahoo’s site documents the ports and servers used by Yahoo Messenger:

    http://help.yahoo.com/help/us/msg/twin/twin-15.html.


    # CONNECTING TO YAHOO MESSENGER


    Yahoo has been by far the least problematic of all the IM services we have tested.
    It’s extremely firewall friendly, even in the case of more complex services such
    as voice and video.

    For login and text messaging connections, Yahoo Messenger will use the following
    TCP ports:


    +   * 20 (generally reserved for FTP)

    * 23 (generally reserved for telnet)

    * 25 (generally reserved for SMTP)

    * 80 (generally reserved for HTTP)

    * 119 (generally reserved for NNTP)

    * 5050

    * Video traffic (Webcam) will use TCP port: 5100

    * File Transfers use TCP port: 80 and the HTTP protocol (this is extremely trivial
    to get through firewalls)

    * Voice communication uses TCP or UDP ports 5000-5010


    If you experience difficulty in getting these services to traverse the firewall,
    the usual suspects would be DROP/REJECT rules on one or more (Yahoo is very difficult
    to block!) of the ports listed here.


    # BLOCKING YAHOO MESSENGER TRAFFIC


    First and foremost, Yahoo has done a fantastic job at making their IM client firewall
    friendly (in terms of circumventing, that is!), due to their copious use of “standard”
    services ports and literally hundreds of servers and IP addresses all over the
    place. This is by far one of the hardest IM clients to filter out. The most effective
    method we have used so far is far to block the login servers; however, users clever
    enough to reconfigure'
