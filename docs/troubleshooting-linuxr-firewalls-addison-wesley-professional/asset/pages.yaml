  md: '# OTHER HARDENING STEPS


    Remove any software you cannot prove that you need. One easy piece of software
    to remove is your compiler. Regardless of what you remove, getting rid of software
    you don''t need will reduce the number of patches to install, and it will also
    lessen your exposure to unknown flaws. The less software you have, the fewer vulnerabilities
    to which you are exposed.


    And finally, don''t assume you got any of this right. Now is the time to test
    the system and see if you can break in. Never assume that you haven''t missed
    something or incorrectly installed some useful security tool. If you really want
    to test your system, don''t do the testing yourself. Have a trusted associate
    test the system or hire a security auditor to test the security posture of your
    system.


    # SUMMARY


    As we mentioned in the previous chapter, a firewall alone might not be enough
    to secure your systems. We highly recommend the tools mentioned here for both
    the firewall and any Linux-based servers you have in your internal network or
    DMZs. A combination of Network and Host-based Intrusion Detection systems and
    kernel hardening (we cannot recommend grsecurity enough) can assist you in dramatically
    increasing the overall security posture of your network. If anything, this chapter
    should serve as a good basic checklist for any Linux-based server, or even desktop,
    you are using in your enterprise.


    Aside from constructing good firewall rules, you will also need to secure the
    firewall itself to benefit from any increase in protection your firewall might
    be able to convey. If your firewall is vulnerable, everything else that depends
    on it is equally vulnerable. Ensure that your firewall is the most secured system
    in your enterprise before focusing your efforts on anything else. As it is, in
    most enterprises, the firewall is the single most important and relied upon component
    in the security model. Even if your enterprise is different, always make sure
    your firewall''s security posture sets the standard for everything else in your
    enterprise.'
