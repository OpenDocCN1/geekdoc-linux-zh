  md: '# HOW TO THREAT RISK MANAGEMENT


    Time, for that threat, might be also a low value asset because the student is
    summer break and has free time in extreme abundance. Not all threats are pedestrian;
    there are also highly funded and highly motivated organizations that have all
    the resources necessary to penetrate the most guarded assets. The point here is
    not to underestimate the resources at the disposal of a particular class of threats
    you might be attempting to defend against. Even though you will never truly be
    able to read the mind of someone who wants to beat into your computers, it can
    help to think like your opponent. Try to imagine what your enemy might do and
    if possible, attempt to break into your own networks from the perspective of those
    various threats you are attempting to defend against. Just try not to underestimate
    your threats. A lack of imagination has been the undoing of more than one organization.


    With two critical concepts out of the way, the next concept to cover is protection
    or simply answer the question: What is it exactly that you want to protect? And
    within that question lies another: What is it about that asset you want to protect?
    One useful way to answer that question is by considering the following acronym:
    CIA. It stands for confidentiality, integrity, and availability. This defines
    what it is about the asset that is important.


    For instance, if the asset has to be kept secret, then confidentiality is the
    goal. Is it critical that the asset not altered or tampered with? If so, then
    integrity is a protection goal. And finally, must the asset be valuable, to whom,
    and under what circumstances? None of these goals are mutually exclusive; they
    are simply another means of determining what is important in a security model.
    You can have an asset that needs all three of these protection goals accomplished—and
    another with only one.


    It''s critical that you consider what it is, out of the CIA acronym, that you
    want to protect within each asset. If your goal is to make your website stays
    up and all the information on your site is public, then IA is important for that
    system. For e-mail perhaps you are only concerned with confidentiality, or perhaps
    your company is a health care provider and has a legal requirement to maintain
    the confidentiality of its customers'' information. For each asset, the goals
    are different, and the reasons for those goals are going to be different.


    The next concept to consider is means. How will you accomplish your risk management
    goals? With any risk management problem, you have three options, which also have
    their own acronym—AMR: avoid, mitigate, recover.


    Specifically with avoidance you can try to prevent or avoid the worst case, with
    mitigation you attempt to mitigate or manage your risk, and with recovery, you
    simply plan how you will recover from that risk. As with CIA, these of are are
    inherently mutually exclusive. You must consider which of these options is acceptable
    to you before proceeding with your risk management plan.'
