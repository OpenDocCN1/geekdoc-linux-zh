  md: '# TROUBLESHOOTING WITH THIS PERSPECTIVE IN MIND


    Aside from the obvious benefits of using this bottom-up methodology, we have found
    that you don''t really know where to start, looking at the problem through this
    lens can be very helpful at quickly ruling out elements that may not causing the
    problem. It''s also amazing how often these simple problems end up being the cause
    of what appears to be a complex problem. Following are some undoubtedly oversimplified
    but really common problems we have seen far too often to people who should know
    better by now—to help illustrate the things to look for at layers of the OSI model.
    The point being that sometimes, you''re just over-thinking the problem. Also note
    how the "quick checks" get more complicated the farther you go down. Start with
    the simple things first! The following Scott one-liners on each layer help help
    illustrate the point.


    # Layer 1: Test To Make You Have Physical Connectivity


    > One-liner: "You kicked your patch cable out." —Scott


    This is one of the simpler things to test but often goes overlooked. What you
    want to look for is not just that you have a link light, which is also important,
    but that the cable is properly terminated, it is in spec for the connection it''s
    being used for (CAT3 when you need CAT6), and other physical problems. The following
    is a general list of things to look for; the key thing to keep in mind is that
    you want to rule out physical connectivity issues before you move on to more difficult
    problems.


    +   1. Are you plugged in?

    2. Is the cable actually any good? Is it in spec?

    3. Is the port on the switch/hub working? Try another port to see if that fixes
    your problem.


    # Layer 2: Test Your Driver


    > One-liner: "That''s not a Tulip card." —Scott


    +   1. 10/1000/10000 issue—are you actually running the right one? Some cards
    different drivers based on speed or need to be passed various switches to configure
    them to work at different speeds, full duplex, half duplex, etc.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '2. Is the MTU size correct for your network? For instance, the MTU size on
    DSL connections that use PPPoE actually matters to successfully process large
    packets. Hint—1500 is good for cable modems, Ethernet, and T1+ connections, but
    when you''re dealing with VPNs (Virtual Private Networks) over DSL and ATM, you''ll
    probably have to back this off in increments until you find the right setup for
    your network.


    3. Is that network really Ethernet? Is it Token Ring? Is it something else?


    # Layer 3: Test IP Layer


    One-liner: “That''s not my IP.”—Scott


    +   1. Ping it first—from your box and another box.

    Traceroute.

    2. Packet sniff it it—are you getting packets back? Is anything going out? Are
    the IP addresses correct? For instance, NAT rules can change the IP addresses
    of the source and destination hosts. If this is done incorrectly, or not at all,
    the source address being sent out could be incorrect.


    # Layer 4: Test the TCP Layer


    One-liner: “I’m not running a web server on that machine.”—Scott


    +   1. Telnet to the port, from front of and behind the firewall. A great way
    to lose a lot of time is to diagnose a firewall by trying to connect to a service
    that isn''t actually running on the other end. A simple “telnet somehost.com 25”
    (this would connect to the mail port) can help you save some time.

    2. Test the service without the application. In other words, if you''re testing
    a mail server rule, try testing the connection with a command line telnet before
    sending mail.

    3. Test with the application last.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Layer 5: Test the Session Layer


    One-liner: "Wait for the login prompt." —Scott


    +   1. The session layer is responsible for coordinating the connection(s) from
    an application to a networked system and vice versa. Logins, Name resolution,
    etc. generally are depicted as happening at this level. So it helps sometimes
    to be patient. For example, some mail servers will do an identd request when you
    connect. Until you receive the response, they won''t pass you up to the next layer.
    The connection will appear to stall. From your perspective it might appear as
    something is wrong given that it''s not responding right away—if you weren''t
    running the identd service.


    # Layer 6: Test the Presentation Layer


    One-liner: "That doesn''t actually support your authentication system." —Scott


    +   1. Test to make sure what you''re using actually supports what you''re trying
    to do when it comes to the presentation layer. A good example of this is the myriad
    IPSEC implementations. Generally getting them to communicate in Layers 3 and 4
    is pretty easy; it''s when you get up to the authentication and encryption in
    Layer 6 that things get weird.


    # Layer 7: Test the Application Layer


    One-liner: "Try using the right password." —Scott


    +   1. Make sure you''re actually entering the right login information or URL
    to that website you can''t get to before you blow the firewall. Is that site even?

    2. Is the remote application working from somewhere else? Try connecting to the
    site from some host that is not affected by the firewall.


    The lesson to take away from this approach is to conclusively eliminate dependencies.
    This isn''t a complete list of things to check. It''s just a set of examples to
    help remember the layers and what to look for as you work through them. The chapters
    in Section 3 of'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'the book have more detailed lists of items to test at each layer for specific
    problems, but you may determine that there are others specific to your implementation
    that we may not cover.


    Remember, if you cannot eliminate a layer and move onto another layer, keep in
    mind the unresolved problems from the previous layers. It could be a more complex
    problem. The intent is to eliminate variables to make it possible to work on increasingly
    complex layers. As you move up the OSI model, the number of dependencies increases
    dramatically; if you do not rule out a layer, you''re making it that much harder
    to diagnose the next layer. Repeat and live by the old adage, "keep it simple,"
    when you''re troubleshooting and you''ll save yourself a lot of time by reducing
    the variables in your problem.


    # SUMMARY


    As mentioned earlier in this chapter, we cannot hope to cover TCP/IP as well or
    as effectively as W. Richard Stevens and Gary Wright did in the TCP/IP Illustrated
    books. We used them before we wrote this book and have no doubt we will continue
    to use them after. So do yourself a favor and go pick up a copy; we cannot recommend
    them enough when it comes to a definitive guide on TCP/IP.


    That being said, this chapter should serve as a very basic reference to the mechanisms
    by which the Internet Protocol will traverse a firewall at Layers 3 and 4. In
    later chapters we also cover firewall at Layer 2 of the OSI model—to give a complete
    picture of the capabilities of netfilter and iptables.'
  merge: -1
