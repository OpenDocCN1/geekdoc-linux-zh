- img_proc: true
  md: "firewall policy, the rules required to allow SSH connections to the firewall,\
    \ and a caching DNS server on the internal interface:\n\n```\n#!/bin/sh\n\nIPTABLES=\"\
    /sbin/iptables\"\nEXTERNAL=\"eth0\"\nINTERNAL=\"eth1\"\nEXTERNALIP=\"22.33.44.55\"\
    \n```\n\n```\n# Flush out old rules\n$IPTABLES -F\n$IPTABLES -X\n```\n\n```\n\
    echo \"Setting default filter policy\"\n$IPTABLES -P INPUT DROP\n$IPTABLES -P\
    \ OUTPUT DROP\n$IPTABLES -P FORWARD DROP\n```\n\n```\n# load your connection tracking\
    \ modules\nmodprobe ip_conntrack_ftp\nmodprobe ip_conntrack_ftp\n# this next rule\
    \ is PPPoE, and DSL users\n$IPTABLES -A OUTPUT -o eth0 -p tcp \\\n    --tcp-flags\
    \ SYN SYN,RST SYN -j TCPMSS \\\n    --clamp-mss-to-pmtu\n```\n\n```\n# these are\
    \ our connection tracking rules\n$IPTABLES -A INPUT -m state \\\n    --state ESTABLISHED,RELATED\
    \ -j ACCEPT\n$IPTABLES -A OUTPUT -m state \\\n    --state NEW,ESTABLISHED -j ACCEPT\n\
    $IPTABLES -A FORWARD -m state \\\n    --state NEW,ESTABLISHED -j ACCEPT\n```\n\
    \n```\n# Allow DNS queries on the internal interface\n$IPTABLES -A INPUT -p tcp\
    \ --dport 53 -i eth1 -j ACCEPT\n$IPTABLES -A INPUT -p udp --dport 53 -i eth1 -j\
    \ ACCEPT\n```\n\n```\n# Allow SSH\n$IPTABLES -A INPUT -p tcp --dport 22 -j ACCEPT\n\
    ```\n\n```\n# finally, we SNAT our traffic\n$IPTABLES -t nat -A POSTROUTING -i\
    \ eth1 -o $EXTERNAL \\\n-j SNAT --to $EXTERNALIP\n```"
