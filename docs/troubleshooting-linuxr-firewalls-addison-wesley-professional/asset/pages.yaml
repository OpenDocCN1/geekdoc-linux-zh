  md: "# A QUICK WORD ON FRAGMENTS\n\nWith 2.4 and 2.6 kernels, fragment reassembly\
    \ is automatic whenever you use the connection tracking engine or are doing NAT.\
    \ For that reason, it is not generally necessary to concern yourself with fragments\
    \ passing through your firewall. However, we all make mistakes, and it's possible\
    \ the firewall could be started without the connection tracking engine properly,\
    \ compiled in, or even loaded. Because of this, we like to include a fragment\
    \ sanity check ruleset to drop any fragments that try to pass through the firewall.\
    \ As already stated, this rule shouldn't be triggered if you are using connection\
    \ tracking, as the state engine will handle fragment reassembly automatically.\n\
    \nThe rules outlined as follows should never be triggered unless has gone horribly\
    \ wrongly, which is why it might be useful to keep it in the rules if you forget\
    \ to load the contrack modules or break your NAT rules. The bottom line is that\
    \ it can't hurt you to add these rules if you are doing NAT, or both; it can only\
    \ help in the worst-case scenario. Remember, with security we are not interested\
    \ in how a security technology works; we are interested in how it fails. We want\
    \ to catch and stop the failures in a system, not assume that they won't occur.\n\
    \n```\niptables -N NOFRAG\niptables -A OUTPUT -p ip -f -j NOFRAG\niptables -A\
    \ INPUT -p ip -f -j NOFRAG\niptables -A FORWARD -p ip -f -j NOFRAG\niptables -A\
    \ NOFRAG -m limit --limit 1/second \\\n  -j LOG --log-level info --log-prefix\
    \ \\\n  \"Fragment -- DROP --log-tcp-sequence \\\n  --log-tcp-options --log-ip-options\n\
    iptables -A NOFRAG -j DROP\n```\n\n# SYN FLOODS\n\nThankfully there are many ways\
    \ to protect against SYN floods. One we already discussed, using SYN cookies,\
    \ and the other is to use iptables to watch the rate at which SYN packets are\
    \ flowing in or through the firewall and to throttle those SYNs accordingly. You\
    \ can also use this method to control the flow of packets to host, to some extent,\
    \ if your goal is to do more than just limit SYN floods.\n\n```\niptables -N syn-flood\n\
    iptables -A INPUT -i eth+- -p tcp --tcp-flags \\\n  SYN,ACK,FIN,RST RST -j syn-flood\n\
    ```"
