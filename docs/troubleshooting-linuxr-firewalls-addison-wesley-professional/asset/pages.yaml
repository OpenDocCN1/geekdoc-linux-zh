    The first network setting of interest is the TCP FIN timeout. This defines the
    amount of time to hold a socket in the FIN-WAIT-2 status, if the socket was closed
    by our side. This is part of the final tear down part of TCP session where we
    send out FIN packet and are awaiting a response from the other side an ACK response.
    If the host on the side is broken, is slow, or does not respond, the socket will
    be held open for a certain period of time to wait regardless of what happens.
    The usual value is 60 seconds for 2.4 and 2.6 kernel, and was 180 seconds for
    2.2. We recommend you set this at 45 seconds, which means the socket will be killed
    off if the remote host does not finish the tear down'
