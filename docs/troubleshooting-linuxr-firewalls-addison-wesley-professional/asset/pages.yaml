    all the chains.


    The last useful switch to understand with iptables is -j. This tells iptables
    to "jump" to another chain. It is extremely useful when constructing your own
    chains, as you can create some logic in your rulesets with different rules triggering
    unique chains. For instance, if you created a chain called MY_LOG via this command:


    ```

    iptables -N MY_LOG

