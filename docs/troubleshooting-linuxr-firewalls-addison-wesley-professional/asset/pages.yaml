  md: '# PPTP: CANNOT ESTABLISH PPTP CONNECTIONS THROUGH THE FIREWALL


    Extended Description: You have an internal system that creates a Point to Point
    Tunneling Protocol (PPTP) VPN to another system, for example a corporate VPN server,
    through your firewall. Non-VPN traffic functions properly; however, the PPTP VPN
    connection cannot be established. In this “road warrior” configuration, the internal
    system (laptop in diagram here) only connects to the remote system as an end-node;
    it does not perform any routing.


    ![](img/9e2290071e555156f9bb68f2189d9345_358_0.png)


    VPNs, like PPTP, suffer from problems seen in both Layer 3 and Layer 4 -based
    VPNs, because it gives it in both worlds—by using both a Layer 4 TCP control port,
    as well as a Layer 3 data protocol. This means that not only is is also going
    to require a special connection tracking module as well as paying attention to
    filter rules on the Layer 4 traffic.


    PPTP traffic uses protocol 47 (GRE), TCP port 1723, and requires some additional
    patches to be added into the Linux kernel to traverse NAT firewalls. Specifically,
    the kernel has to be patched with the pptp-conntrack-nat.patch from patch-o-matic
    and have the following options enabled:


    Networking options


    +   * IP: GRE tunnels over IP


    +   * IP: broadcast GRE over IP


    Networking options -> -> IP: Netfilter Configuration'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# CHAPTER 19 VIRTUAL PRIVATE NETWORKS


    -> Connection tracking


    +   * GRE protocol support

    * PPTP protocol support


    Without these modules and settings built into the kernel, PPTP connections will
    not work through the firewall. Furthermore, these are not set in default Redhat
    kernels. So if you are running a Redhat box and have not specifically rebuilt
    your system to support these options, then no amount of tinkering on the firewall
    is going to get to this work!


    Just like IPSEC, PPTP is very sensitive to the MTU settings between endpoints.
    This is due to the fact that PPTP really uses PPP (Point to Point Protocol) inside
    the PPTP encapsulation system to handle the real network traffic. Because of the
    overhead in in encapsulation, you''ll need to keep an eye on both the firewall
    and your client''s MTU. In general, if you''re having connection or performance
    issues, setting both systems to the same MTU.


    The next step is to verify that you can actually connect to the remote PPTP system.
    This is such a well-known service, ISPs with a no-VPN policy will likely block
    this PPTP connection. Verify with your ISPs that they allow this type of traffic
    in advance. If you have the capability to set up sniffers on both ends of the
    PPTP connection, verify that both endpoints are communicating both the TCP and
    protocol 47 traffic correctly. PPTP needs both!


    Finally, ensure that your firewall is allowing protocol 47 (GRE) traffic outbound.
    The following example rules are from the pptpclient website (http://pptpclient.sourceforge.net/howto-diagnosis.html).
    Document the proper firewall rules to work with PPTP:


    ```

    # eth0 is our external interface

    $IPTABLES --insert OUTPUT 1 \

    --source 0.0.0.0/0.0.0.0 \

    --destination 0.0.0.0/0.0.0.0 \

    --jump ACCEPT --protocol gre \

    --out-interface eth0 \


    $IPTABLES --insert INPUT 1 \

    --source 0.0.0.0/0.0.0.0 \

    --destination 0.0.0.0/0.0.0.0 \

    --jump ACCEPT --protocol gre \

    --in-interface eth0

    ```'
  merge: -1
  pgno: 359
