    -j STEALTH \

    iptables -A INPUT -p udp -i eth+ -m stealth \

    -j STEALTH \

    iptables -A STEALTH -m limit --limit 1/second \

    -j LOG --log-level info \

    --log-prefix "STEALTH - DROP " --log-tcp-sequence\\

    --log-tcp-options --log-ip-options

    iptables -A STEALTH -j DROP

    ```


    # SHUNNING BAD GUYS


    Remember all those rules with the "recent" rules. Well, as we touched before,
    that module allows the kernel to remember an address for a period of time and
    then do something with it. A source or destination address can be added to this
    special list, which you can reference later on in your firewall rules. One useful
    trick you can do with this which is to temporarily drop, or shun, packets from
    particular sources and destinations that you detect in other rulesets, such as
    with the port scan rules or string matching. This might allow you to respond to
    an attack and block all the packets from source or destination until you can investigate
    further—or simply for a small period of time, throw the attacker off. Here is
    an example of such a ruleset that blocks all packets from these recorded IPs for
    a period of 300 seconds:


    ```

    iptables -N OFFENDER

    iptables -A INPUT -m recent --check --seconds 300 \

    -j OFFENDER

    iptables -A FORWARD -m recent --check --seconds 300\

    -j OFFENDER

    iptables -A OFFENDER -m limit --limit 1/second -j LOG \

    --log-level info \

    --log-prefix "OFFENDER -- SHUN " \

    --log-tcp-sequence --log-ip-options \

    --log-ip-options


    iptables -A OFFENDER -j DROP

    ```


    148'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'We recommend that until you are comfortable with shunning, you only add these
    rules after your ESTABLISHED and RELATED rules so that you don''t accidentally
    shun yourself from your firewall or cut off already "trusted" traffic. With these
    rules added in the previous example, as already explained, the shun period is
    for 30 seconds—or 5 minutes. You can change this to whatever value you think is
    appropriate, 10 seconds or even an entire day (86400 seconds) or higher if you
    like. Our recommendation is not to get too crazy with these numbers; shunning
    is helpful in the short term, but not so useful in the long term. People can change
    their IP addresses, so the idea isn''t to block someone forever—that would be
    impossible; you just change their IP. The idea is to couple this with good signatures
    on your firewall and to shun the attacker long enough to fool their attack tools
    and to hopefully stop the attack. Human beings will never be faster than computers
    when it comes to responding to attacks; shunning buys you time to look into the
    attack and determine if further action is necessary or if a false alarm has occurred.
    We realize that for some organizations it might be difficult to trust a piece
    of technology, your firewall, to make these decisions for you. However, if you
    have a good response policy and some effective procedures in place so that you
    can review your shunts within a reasonable amount of time, it can become an extremely
    useful tool.


    # ACCEPT RULES


    Now you can now add in all your ACCEPT rules. After you have finished with those
    rules, you will want to add in your default catch all DROP and LOG rule. Remember
    the cardinal rule, "unless allow, deny." This rule, which is put in at the end
    of all your rules, complies that.


    ```

    iptables -N FINAL_DROP

    iptables -A OUTPUT -j FINAL_DROP

    iptables -A INPUT -j FINAL_DROP

    iptables -A FORWARD -j FINAL_DROP --limit limit 1/second \

    jj LOG -j FINAL_DROP --log-level info --log-prefix "Final DROP" \\

    --log-tcp-sequence --log-tcp-options \

    --log-ip-options

    iptables -A FINAL_DROP -j DROP

    ```'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'And finally, IP forwarding can be turned back on. We always like to turn forwarding
    off while we are loading new rules because sometimes you can get into a race condition
    where bad packets slip through before your rules are fully in place.


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    #  SUMMARY


    After reading this chapter, you should have a good understanding of the proper
    order of your firewall rules, some neat tricks you can implement to detect suspicious
    traffic and attacks through your firewall, and some useful kernel settings to
    help your firewall to perform more efficiently. Should you wish to explore any
    of the concepts in this chapter in greater detail, we will refer you again to
    our website (www.gotroot.com) and the documentation, tools, and forums there.


    Finally, remember to construct your rules so that you deny everything by default
    and to only change your rules to allow traffic through that you can prove you
    need to let through. Never, ever try to build a firewall that explicitly denies
    certain things but otherwise allows everything else through. You can''t even begin
    to imagine all the ways a firewall can be breached by applying this method. The
    golden rule is: “unless allow, deny.” Stick with that, and as they say, you''ll
    sleep well at night.'
