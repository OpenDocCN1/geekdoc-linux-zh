    # VIEWING NAT CONNECTIONS WITH NETSTAT-NAT


    One highly recommended tool for viewing NAT-ed connections through a firewall
    is the user-space tool, netstat-nat available from: http://tweeegy.demon.nl/projects/netstat-nat/index.html.


    This utility, which requires the kernel to be compiled with IP connection tracking,
    works similarly to the netstat command, but specifically displays NAT connection
    information.


    Example diagnostic usage:


    ```

    netstat-nat -S would display SNAT or masqueraded connections

    netstat-nat -D would display DNAT connections

    netstat-nat -L would display connections to the NAT server

    ```


    Example output:


    ```

    [root@minimoose root]# netstat-nat -S

    Proto NATed Address Foreign Address State

    tcp 10.10.12.201:59837 po:imaps ESTABLISHED

    tcp 192.168.32.190:36340 server4:ssh ESTABLISHED

    ```


    This output shows that the system 10.10.12.201 has an outbound SSL IMAP connection
    to the remote server "po" and the system 192.168.32.190 has an outbound SSH connection
    to the server "server4",


    ```

    [root@minimoose root]# netstat-nat -D

    Proto NATed Address Foreign Address State

    tcp 10.10.12.201:37708 10.10.12.1:http ESTABLISHED

    tcp 192.168.32.190:47775 192.168.32.1:51990 ESTABLISHED

    ```


    This output demonstrates more advanced inbound connection data. Specifically,
    our firewall is transparent application layer proxies, reaim (for IM traffic)
    and squid (for web traffic) on the firewall itself. Both of these proxies are
    discussed in later chapters, and the data here indicates that there is an open
    redirect from the systems'
