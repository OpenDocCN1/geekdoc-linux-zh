- img_proc: true
  md: '# Getting Started


    Starting off this chapter, we''re going to repeat a topic covered in Chapter 1,
    a topic that in our opinion can''t be repeated enough. A firewall is never going
    to be enough to secure your network, your hosts, your data, or whatever else you
    are trying to protect; you must do more. It takes a lot more than one method,
    a firewall or even technology alone to manage risk. Technology alone will not
    suffice. If you find yourself repeating until you are blue in the face, you will
    understand why this is such a critical point to repeat. Risk management is more
    than technology and more than policies or any other single element. It takes the
    full spectrum of risk management solutions to truly address the problem.


    In case the point wasn''t clear the first time we said it, a firewall alone will
    not make your computer security problems go away. With that said, the goal of
    this chapter is to explore and expand on those concepts that can help you to protect
    your computing assets where a firewall cannot. The most important element of that
    approach is to recognize that your goal is not to secure your assets, but to come
    up with a comprehensive risk management plan and to execute that to secure your
    assets.


    In this chapter, we will explore the major elements of the risk management approach
    to computer security and present some basic concepts to get you started. It is
    not only important to ensure that your firewall is working and that it''s doing
    its job of protecting your enterprise correctly, but also that you understand
    what a firewall cannot do for you. One of the worst trends we have seen in computer
    security is an over-reliance on firewalls and the false belief that a firewall
    can be relied upon to shoulder the lion''s share of the work when securing a network
    and its assets. Too many organizations install a firewall and go no further. Firewalls
    are important and useful security tools, but they are'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'not silver bullets, and they are becoming less and less effective against the
    growing range of threats and vectors used against protected systems.


    # RISK MANAGEMENT


    As already stated, the key to any good computer security program is risk management.
    Nothing short of a comprehensive risk management program is going to suffice in
    the rapidly evolving world of computer security. New threats, vulnerabilities,
    counter measures, technologies, exploits, and products appear on the market everyday.
    Sooner or later, something will happen that your security model does not account
    for. Natural disasters such as fires and floods or physical threat of a laptop,
    and your data can be lost or in the hands of hostile party. Without a comprehensive
    and holistic approach to security, you will always be playing catch up. The news
    is that computer security is a subset of risk management, so our computer security
    problems fit nicely into a body of work that stretches back over centuries. There
    are even industries, of which you might already be aware, that cater directly
    to the risk market, such as insurance companies and underwriters. Risk, as we
    already mentioned, is a fact of life; you cannot build a security model that will
    protect you from all possible threats. What you can do is build a good risk management
    model that accounts for the things you cannot control, the things you can, and
    how you will out the problems that crop up in between. Keep in mind: It is possible
    to implement a risk management program that will address your worst-case scenario
    so that you can sleep at night. The best part is that your program only needs
    to be as complicated as you need it to be.


    # BASIC ELEMENTS OF RISK MANAGEMENT


    There are three basic goals of computer security, which are broke down into the
    CIA acronym. In mind we are not talking about the intelligence agency with the
    same acronym, but rather the three goals of computer security: protect the confidentiality,
    integrity, andor availability of a computing asset. The goal of confidentiality
    is to prevent disclosure of information to unauthorized parties. Integrity is
    the goal of ensuring that the information or asset has not been tampered with,
    and availability is exactly what it sounds like—the goal of making sure that the
    information or asset is available to the parties that need access when they need
    access.


    For any given asset, one or more of these goals might be more important than the
    other, and the extent to that goal is achieved is entirely unique to that asset.
    What is secure enough for one system might not be for another. One simple example
    is to ask yourself if your home is secure enough. For some, simple locks will
    suffice for'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'their assets and the threats they feel their home may be exposed to; for others
    an alarm system, date bolts, and irons bars are sufficient. The point here is
    that the goals will always be different for each asset you choose to protect,
    as will be the methods and the extent to which you protect that system.


    Keep this in mind when evaluating your risk management processes. It will help
    to focus your efforts on those elements of your plan that will accomplish your
    goals in a customized manner for each asset.


    # SEVEN STEPS TO MANAGING RISK


    We are firm adherents to the principle that risk management has to be an ongoing
    cyclical process. You cannot expect to respond to the ever-changing landscape
    of threats and vulnerabilities by relying on an old risk assessment or a one-time
    shot at developing a risk assessment program. For your risk management program
    to succeed, you have to re-evaluate your data, systems, and counter measures regularly.
    One to accomplish this is to conduct regular vulnerability assessment and threat
    analysis of your organization. The vulnerability assessment should be conducted
    as many times a year, and IT vulnerability assessment should be conducted as often
    as possible. With open source vulnerability assessment tools such as nessus (www.ness.org),
    there is no reason why an organization should schedule weekly vulnerability scans
    on their IT resources, and with the wide range of qualified firms to choose from,
    a third party assessment should be conducted on at least a quarterly basis for
    the entire organization. Why so often? Things change, and with IT, they change
    often and fast. With every new patch, piece of software, computer, or user, has
    changed. The key element here is that your organization changes all the time,
    and you have to keep up with that dynamic element of life. One suggestion we de
    make to all our customers is to always run a vulnerability scanner against any
    system that has changes made to it. Such is the case of installing a new patch
    or granting/removing a user''s access. The following sections discuss seven phases
    of implementing a strong risk management program. The phases are


    +   - Phase I: Analyze


    +   - Phase II: Document


    +   - Phase III: Secure the Enterprise


    +   - Phase IV: Implement Monitoring


    +   - Phase V: Test


    +   - Phase VI: Integrate


    +   - Phase VII: Improve'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# PHASE I: ANALYZE


    # INVENTORY


    The first step in any risk management process is to take stock of what you must
    protect and not make the mistake of looking at just what you want to protect.
    This involves establishing systems and networks you''re working with and the way
    data flows between those systems, domains, or enclaves you''re trying to compartmentalize
    by inventory of your systems, defining what they do, and detail regarding who
    should have access to what specific resources on those systems. This includes
    all the pieces to your system or enterprise that must be protected and how they
    are deployed today. This is a critical distinction because too often when constructing
    risk management programs, organizations become very myopic in their analysis of
    what they think they need to protect Many organizations will zero in on only those
    assets that they want to protect, while ignoring all the other pieces of their
    network that might contribute to a reduced security posture for that asset. The
    problem becomes one of omission ignorance.


    For instance, we have customers overlook that modems are an easy vector of penetrating
    an organization''s security perimeter (the proverbial Belgium to the firewall''s
    Maginot Line). In these cases it was felt that the systems modems were attached
    to were of low importance and, not a high security priority. Further, there was
    a general lack of operational awareness of how these systems connected to the
    rest of the network.


    The problem is that the low value or unimportant system with the modem connected
    to it was really just a vector into something far more valuable, the network itself.
    After you are inside an organization''s network, you have free run of the place.
    In short, too many computer security models tend to look like an egg, hard on
    the outside, liquid on the inside. If you get the shell, through a modem for instance,
    you can move around with impunity throughout the entire organization.


    The point here is to recognize the dependencies in your organization''s security
    plan. Just because your organization has an excellent Internet security plan provided
    by a state of the art Linux firewall does not mean that you do not have to consider
    other vectors into your security enclave. Look at everything and consider how
    it could be used to defeat your security counter measure. Laptops are another
    example. Assume for a moment that you have fantastic perimeter security and you
    have every way into your organization accounted for and properly compartmentalized,
    such as modems and wireless access points. However, the users on your network
    take their laptops outside your network, to their homes, school, or a coffee shop,
    and those laptops become temporarily infected with worms or Trojans when connected
    to the not so secure network they are temporarily attached to.'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'These users then reconnect their laptops to your network and without realizing
    it, unleash those worms on your network—defeating your security model.


    You cannot manage these risks by only looking at what you want to protect. You
    have to expand your horizons, so to speak, and look at the whole picture. Be creative
    and think about the threats and vectors that bring those into your network. If
    you have some critical assets in your network, consider what it is those assets
    trust and don''t make assumptions about your security model that are not based
    on fact. A good rule of thumb: When in doubt, don''t trust it.


    To wrap up this thread, the first step is to take stock of what your network is
    composed. How is it laid out, what systems are connected to, who runs those systems,
    and what are all the paths from outside the network to your critical assets? Consider
    how much you can trust the assets inside your network. You might have to compartmentalize
    systems off others by deploying internal firewalls. For more critical systems,
    you have to do more than that, as isolating those systems so that they are not
    connected to your main network. Some organizations do this with their accounting
    systems, and the military is supposed to isolate systems within their own networks,
    physically separated from the non-classified systems.


    Another problem we have seen is organizations that look at what they want their
    networks to be or hope to be. Reality, cold unfiltered reality, is the only ingredient
    that will work here. Don''t assume that your wire or logic diagrams correspond
    to the physical "secure" network will be deployed on time or that they will. In
    one fascinating example we ran with a large organization, they had one of the
    most elaborate security models we had ever seen. This organization had seven separate
    networks, all separated by firewalls with Network-based Intrusion Detection Systems
    (NIDS) at each entry point. The products they chose were all top of the line,
    including trusted Operating Systems and, at that, brand new Host-based Intrusion
    Detection Systems (HIDS) products. Everything looked great on paper and even logical
    when mapped out with our tools. But when we drew traces, we realized they had
    hooked everything up the same switch. They were relying on one switch to create
    their carefully separated networks, to include having external networks plugged
    into the switch! To their overall team, this was a perfectly reasonable solution—and
    this was far and away one of the more well read and intelligent customers we had
    encountered. The problem was that their networking team was not part of the security
    design team, and the security design team was not part of the deployment team.
    When all was said and done, the system in logical terms was exactly as the designers
    had said it should be, but in physical terms, it was a different story. The moral
    of the story is to assume nothing when taking stock of your assets. Documentation
    is useful only to get you started. Check everything manually and physically—and
    assume nothing.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# QUANTIFY THE VALUE OF THE ASSET


    As part of the process of taking stock of what you must protect in your organization,
    it’s important to quantify what those assets are worth to your organization. How
    much disclosure of that information cost? How much would loss of that asset cost?
    What if the data was simply tampered with? For each organization, and for each
    asset, the answers to these questions are different. A public web server might
    be as important as the company''s accounting system—or vice versa in some cases.
    Consider the asset, what it does, and what would happen if the asset couldn''t
    continue in its current function.


    As part of the analysis phase, conduct a vulnerability assessment of the entire
    organization to verify this data and help to find vulnerabilities. A vulnerability
    assessment is defined by the U.S. Government as


    +   1. “An examination of the ability of a system or application, including current
    security procedures and controls, to withstand assault. A vulnerability assessment
    might use to: a) identify weaknesses that could be exploited; and b) predict the
    effectiveness of additional security measures in protecting information resources
    from attack.

    2. Systematic examination of a critical infrastructure, the interconnected systems
    on which it relies, its information, or product to determine the adequacy of security
    measures, identify security deficiencies, evaluate security alternatives, and
    verify the adequacy of such measures after implementation.” (U.S. Government,
    CIAO)


    In short, a vulnerability assessment is any means of testing your entire organization,
    its systems, controls, and personnel, to detect vulnerabilities and to determine
    if the controls are to protect against threats to your organization.


    One of the more critical elements in any risk management program is the vulnerability
    assessment. Only by critically and scientifically assessing the vulnerabilities
    and testing the controls in an organization can one hope to improve that organization''s
    security posture, to develop an effective risk management program, and to truly
    understand the inter-relationships between the elements of an organization. Frankly,
    vulnerability assessments have become part of the lexicon for IT and are commonplace
    across the industry, but they are still not conducted with as much regularity
    or vigor as we would like to see. For IT assessment, there are now open source
    tools, such as nessus that make it possible to automate vulnerability scans for
    IT resources from Cron. We highly encourage you to do this wherever possible.
    Think of this for your network.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# THREAT ANALYSIS


    The final step in the analysis phase is to analyze the threats that might want
    to gain access to, damage, or deny access to your assets. Recall from Chapter
    1 that there are three general classes of threats that we can look for for quick
    reference. Not all threats fall into those three categories, but as a whole they
    tend to cover the threats most organizations will face. Different assets might
    be exposed to different threats; a low value asset might just be a stepping stone
    to a higher value asset for one class of threats. For instance, an unimportant
    public web server with no important data or accounts is allowed to connect back
    into the organizations internal network through a hole in the firewall that it
    can authenticate to a Primary Domain Controller (PDC). The web server is broken
    into, and the attacker uses the unimportant web server to break into the PDC through
    a vulnerability in the RPC services. The PDC is then used to break into all the
    critical systems on the network. In this example, the threats perceived to exist
    against the web server, unstructured threats, are not the full range of threats
    that might exist—because of its relationship to a higher value target. This goes
    back to the issue of understanding the inter-relationships between systems, networks,
    assets, and even people. When analyzing for threats (i.e. who would want to break
    into this system?), consider the down effects of breaking into the assets. This
    also brings up an emerging risk to organizations that goes beyond the scenario
    painted here and is directly related to the problem of analyzing threats; that
    risk is down stream liability.


    # Down Stream Liability


    A not so new concept that is garnering a good deal of attention is "down stream
    liability." This concept relates to the notion that your organization is liable
    for any damage done to a third-party system because your systems were used to
    effect this damage. For example, in the previous case, your unimportant web server
    is broken into and used to break into a bank. The bank could sue your organization
    for failing to take appropriate measures to properly protect your systems. In
    laymans terms, basically this means that you can be sued for failing to effectively
    manage the security posture of your systems.


    # PHASE II: DOCUMENT


    Once you have determined what you must protect, what it''s worth, and who might
    want to attack it, then it''s time to document all of this with some clear information
    about who manages the system, who they work for, and what the system does. The
    primary reason for documenting these sorts of details is to take a snapshot in
    time of the'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# GETTING STARTED


    enterprise and to protect your organization against loss of this knowledge should
    people leave the organization. In our experience, formal office documents for
    this sort of documentation might be necessary for legal and regulatory purposes.
    There are new federal laws that require companies to fully document their internal
    controls and for the senior management to literally sign off on the integrity
    of those controls. Imagine if you were held personally liable for the security
    of your entire company. You might want it in writing as well.


    However, an electronic version of this information shouldn''t conflict with this
    requirement, and we have found that having this information available to authorized
    parties through a web interface can be invaluable during a crisis. If your data
    changes frequently, you might consider using a wiki (www.wiki.org) or some other
    Content Management System (CMS) to help manage the dynamic flow of information
    into these documents. Finally, when you are constructing this documentation, online
    collaboration tools can really pay off. In a large multi-state or multi-national
    organization, it can be difficult to exchange documents with colleagues in different
    time zones. By making the documentation process as easy and accessible as possible,
    with the appropriate security controls of course, you can reduce the level of
    effort required to document systems and system changes. We believe that when creating
    these documents, it''s helpful to keep the process as dynamic and flexible as
    possible. Formal controls on the documentation process can be put into place after
    you have collected the information you need to create formal documentation.


    There are three sub-phases within this phase:


    +   1. Create your plan

    2. Create a security policy

    3. Create security procedures


    # Create Your Plan


    To secure an organization you need to create a plan. To start off with the plan,
    you need to consider the security models and approaches that are appropriate for
    your networks. There is a whole range of security models that are appropriate
    for one set of threats over another, and it is beyond the scope of this book to
    go into much detail on security models.


    As security approaches, there are currently two effective approaches to building
    the security plan: the classic and time proven method, Defense in Depth (DID),
    and the relatively new Holistic approach. We will explain these in detail here,
    but we consider the'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'Holistic approach to really be a natural extension of the DID approach into
    the entire enterprise and always recommend the Holistic approach over classic
    DID.


    # Defense in Depth


    ![](img/9e2290071e555156f9bb68f2189d9345_44_0.png)


    Figure 2.1 An example of a simple network applying the Defense-in-Depth principle.


    Defense in Depth relies upon layers of security procedures, technologies, and
    policies to compensate for breaches by one or more layers before it as part of
    a perimeter-based security model. Like an onion, this security approach is implemented
    by building in layer after layer of counter measures for each identified threat
    or class of threats around an asset or assets to be protected. For instance a
    very simplistic layering might look like this: firewalls Layer 1, Intrusion Detection
    Systems (IDS) Layer 2, systems hardening Layer 3, Host-based Intrusion Detection
    (HIDS) Layer 4, Kernel-based Intrusion Systems/Kernel-based Intrusion Prevention
    Systems (KIDS/KIPS) Layer 5, systems backups Layer 6, and insurance Layer 7.'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'Again, this is just a simplistic example of layered security, which excludes
    many other elements of the model and assumes that only one technology might make
    up a layer. Defense in Depth is typically built backwards from a designated perimeter
    towards an asset or set of assets. This complicates matters tremendously when
    you are starting up your firewall to allow services into your networks and/or
    connecting your networks with other organizations'' networks; the perimeter essentially
    disappears.


    In those cases, which are becoming the norm as to the exception, it is very difficult
    to define what the perimeter is or where it is. The class DID model is left wanting
    because the perimeter can, in essence, be still a good model to keep in your mind,
    building in layers to fall back on one another, but as a concept it isn''t really
    effective as it is. The network perimeter has almost disappeared with the introduction
    of wireless assets, laptops, VPNs, ASPs, virtual servers, shared hosting, and
    other technologies. Our contention is that the perimeter is really down at every
    desktop and server, and in some cases, it''s down to the very applications themselves.


    This leads to the holistic approach, which is essentially akin to pushing perimeters
    straight down to each server and in some cases into each application. In short,
    it is like living in a world without firewalls, where the bad guys communicate
    with every system and program in your network. In many cases, this is precisely
    the world that we live in now. None of this is to say that firewalls are not useful;
    that is far from the case. You don''t want to get rid of your firewalls and other
    perimeter security devices, and you certainly don''t want to stop creating security
    perimeters around an asset or set of assets. The point is to realize that this
    approach is not as effective as it might seem in most cases.


    # Holistic


    The holistic approach makes risk management an integrated part of the organization''s
    standard operating practices. As opposed to looking at risk and its subset, security,
    as a perimeter issue or by securing assets via an after-the-fact approach, the
    holistic approach recognizes that perimeters generally do not exist in modern
    networks or are difficult to create and that an after-the-fact approach to security
    is not effective. For any risk management program to succeed, it has to be built
    into the organization in a seamless manner as possible, where security is built
    into every system and application with the realities of modern computing firmly
    in mind.


    This approach to information security is touted by some as a "new" approach. We
    disagree. It might be new in the sense that more organizations should be doing
    it and are are not, but it''s not new in the sense that it''s an approach that
    the security community is just warming up to. The holistic approach is a logical
    extension of good risk management'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'approaches. You cannot expect to understand the inter-relationships of your
    risks and exposures without looking the whole picture.


    This brings us to the issue of looking beyond just IT security. For any risk management
    program to be effective, all the organization''s risks must be evaluated, physical
    security, personnel issues, and IT to legal liability, regulatory issues, and
    so on. It must all be integrated into the plan. The good news is that life is
    all about risk management already, so there is nothing unusual about this approach.
    It comes naturally when you are starting it. Security has to be part of the whole
    process, not an afterthought or focused on an isolated element. As the saying
    goes, you''re only as strong as your weakest link.


    Within the holistic approach, there are typically three critical elements to the
    risk management plan, which are protection, detection, and reaction, defined as
    follows:


    +   **Protection**: Counter measure includes risk assessments, vulnerability assessments,
    threat analysis, policies, procedures, and technical controls to defend against
    all threats to the assets being protected.

    * **Detection**: Elements that monitor for potential and real breakdowns in protections
    that could result in security breaches.

    * **Reaction**: Those responsive mechanisms that will thwart attacks before damage
    can be.


    A holistic approach is incomplete and ineffective without all these elements.
    For instance, if the organization can only detect after the fact that a break-in
    has occurred, via a non-reactionary IDS for instance, then it lacks a reaction
    capacity. Try to create a plan that is as safe as possible. Humans are always
    slower than computers, and any security plan that depends on a person to react
    to an attack is doomed to fail. You''ll never win that race.


    After you have settled on the security approach and model, document your plan
    and how you intend to approach securing your assets.


    # CREATE A SECURITY POLICY


    Surprisingly, many organizations have security policies, which is a step in the
    right direction. Unfortunately, they tend to either be developed in a vacuum or
    are woefully out of date with the current technologies being used in an organization.
    One agency we worked with had a policy of virus scanning all floppy disks that
    physically came into their offices. This was a great idea—before laptops, modems,
    and the Internet and had little practical effect when it came to protecting their
    network and computers from viruses. Users'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'simply took their laptops home and came back with a virus. The point here is
    that after you create a set of rules to define what is acceptable behavior on
    your networks and what personnel controls you will depend on to help control the
    security posture of your enterprise (such as shredding documents), it''s important
    that the policy be kept up to date. An out of date policy is a liability. Users
    will recognize the policy is out of date and will begin to disregard other rules
    that might still be useful and valid in the mistaken belief that those rules are
    also no longer pertinent.


    # CREATE SECURITY PROCEDURES


    Security procedures are briefly defined as those documented steps and methods
    your organization will undertake as part of its normal operational procedures
    to manage the security posture of your enterprise. Some examples would be procedures
    for monitoring firewalls, installing patches, or deploying new systems. These
    are basically your cookbooks for securing your enterprise. Instead of requiring
    each member of the organization to work out the methods of implementing the policies
    and managing their security posture, the procedures break down into that level
    of detail needed for that audience. In some cases, might require significant automation;
    for instance, a good procedure for securing a Windows workstation, while valuable,
    might be far time-consuming than creating a set of scripts that accomplish the
    same thing. It''s a good idea to document the script, but with a useful tool there
    is no need to produce a step-by-step guide for the end user.


    # PHASE III: SECURE THE ENTERPRISE


    Ironically, this is usually the only phase that most organizations undertake and
    even then partially. After you have completed Phases I and II, you can start to
    appreciate how hard it is to secure an asset without a thorough understanding
    of its value, purpose, and the threats array against it. You wouldn''t want to
    spend a million dollars defending something that is only worth a hundred, and
    vice versa.


    Only when the first two phases are complete should an organization focus its energies
    on securing its assets. This is not to say that some emergency stop gap measures
    are not appropriate in the interim, but do not make the mistake some organizations
    have made of assuming these temporary measures are sufficient for a leisurely
    approach to Phases I and II. We have seen some government agencies that have given
    themselves years to complete Phases I and II with disastrous, highly public results.'
