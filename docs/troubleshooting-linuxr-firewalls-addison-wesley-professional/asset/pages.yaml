    Figure 10.2 Setting the firewall as your gateway.


    **Host-A:** Our firewall

    **Host-B:** The attacker

    **Network-A:** Internal Network


    Host-B connects to the “hard” or externally facing network in your office building
    (perhaps from a conference room on a “DMZ” network or wireless network). Host-B
    sets the default route to Host-A. Then it starts using **nmap** to scan out nonroutable
