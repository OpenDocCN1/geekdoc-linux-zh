  md: '# Running a PPTP Server BEHIND A NAT FIREWALL


    For allowing PPTP access in the other direction where the remote system would
    need to connect to an internal PPTP server through a netfilter/iptables firewall,
    the following example DNAT rules should follow:


    ```

    # establishing eth0 is your external interface, and that you have a PPTP server
    at

    10.10.10.5

    $IPTABLES -t nat -A PREROUTING -i eth0 -p tcp --dport 1723 -j DNAT --to-destination

    10.10.10.5

    $IPTABLES-A FORWARD -i eth0 -m state --state NEW -p tcp -d 10.10.10.5 --dport
    1723 -j

    ACCEPT

    $IPTABLES -A FORWARD -i eth0 -m state --state NEW -p 47 -d 10.10.10.5 -j ACCEPT

    $IPTABLES -t nat -A PREROUTING -i eth0 -p 47 -j DNAT -to-destination 10.10.10.5

    $IPTABLES -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    # PPTP: FIREWALL CANNOT ESTABLISH PPTP VPNs


    Extended Description: You have a NAT/MASQUERADING firewall that is PPTP-capable.
    This firewall acts as an end node, NAT/MASQUERADING traffic into the PPTP VPN
    itself so that all connections inside the PPTP VPN, as well as to the external
    network, appear to be coming from the firewall.


    ![](img/9e2290071e555156f9bb68f2189d9345_360_0.png)


    **Figure 19.5** Firewall cannot establish PPTP VPNs.'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'This is a fairly basic configuration and in practice much more simple to implement
    than actually trying to NAT PPTP traffic through the firewall. In this configuration,
    the firewall needs only to establish a PPTP connection to the remote system and
    then using NAT rules, NAT/MASQUERADE the traffic from its internal systems into
    the PPTP VPN. For this type of setup, I cannot recommend the pptclient project:
    http://pptp-client.sourceforge.net/. The documentation provided for numerous configurations
    just cannot be overlooked. They cover numerous scenarios dealing with the automatic
    establishment of the PPTP VPN, DSL issues, and installing the encryption modules
    required to secure the connection.


    In this configuration you can borrow a rule from the IPSEC section here dealing
    with masquerading traffic from one network across the VPN tunnel using an SNAT
    rule:


    ```

    IPTABLES -t nat -A POSTROUTING -o ppp0 \

    -s 10.10.12.0/24 -d 10.10.11.0/24 -j SNAT \

    --source 10.10.12.1

    ```


    The primary difference between this rule and the IPSEC rule here is that PPTP
    encapsulates a PPP connection, so our device name is different.


    # PPTP: FIREWALL CAN ESTABLISH CONNECTIONS TO A REMOTE VPN SERVER, BUT TRAFFIC
    DOES NOT ROUTE CORRECTLY INSIDE THE VPN


    Extended Description: Two firewalls are configured to connect RFC 1918 networks
    to each other over a PPTP VPN. In the following example, the left side network,
    10.10.10.0/24, is attempting to be connected to the right side network, 10.10.11.0/24,
    over a PPTP connection.


    This is the type of configuration you would use if you were attempting to join
    two remote networks together over the Internet, in the case of migrating from
    a legacy WAN to a VPN over the Internet. In this example, we have two RFC 1918
    networks, 10.10.10.0/24 and two firewalls, Host-A and Host-B.


    The first step into diagnosing problems with this configuration is to ensure that
    the VPN session itself is being established, which you can verify by monitoring
    the log files or using a sniffer like ethereal. In general, leaving out the obvious
    authentication or availability issues between Host-A and Host-B, the MTU path
    discovery issues are the first thing to look at when performing your PPTP diagnostics.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '![](img/9e2290071e555156f9bb68f2189d9345_362_0.png)


    Figure 19.6 Traffic does not route through PPTP VPN.


    As PPTP also uses GRE protocol 47, it is also necessary to build your kernel with
    GREF support, documented here, and if that support is modular, the ip_gre module
    is loaded in the kernel:


    ```

    modprobe ip_gre

    ```


    > NOTE

    Versions of pptclient 1.2.0 and greater no longer require this.


    A symptom of this not being loaded, aside from the obvious that the VPN isn''t
    working, will be ICMP protocol unreachable reply messages in your sniffer dump
    on protocol 47.


    Just like IPSEC rules here, if your NAT/MASQUERADING rule is not bound to your
    external interface, you may be rewriting your VPN traffic so it appears to be
    coming from your external interface on your firewall. The following extremely
    simple rule shows how to ensure that this traffic is not being NAT-ed:


    ```

    #Connection tracking rules

    $IPTABLES -A INPUT -m state -state \

    ESTABLISHED,RELATED -j ACCEPT

    $IPTABLES -A OUTPUT -m state -state \

    NEW,ESTABLISHED,RELATED -j ACCEPT

    ```'
