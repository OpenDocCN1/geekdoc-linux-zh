    # REMOTE LOGGING


    You also might want to keep a real-time copy of your firewall''s logs on another
    system you can trust. This system shouldn''t be used for anything else if you
    intend to use the logs for forensics or evidentiary purposes. Judges and lawyers
    are starting to catch up with technology and realizing how fragile digital evidence
    can be. If you are relying on a copy of logs running on a system that has been
    compromised, you have a serious problem. The logs can be easily tampered with
    to remove information, plant false information, or anything else you can or imagine.
    For some peace of mind, keep a separate copy of your logs on a separate system.
    One way to accomplish this is to set up a logger in your syslog.conf and configure
    the remote system to listen for these entries. For many Linux systems using classic
    syslog, the remote host will need to be running syslogd -r switch to set syslog
    to listen to UDP port 514 for syslog traffic.


    # CORRECTLY CONFIGURE THE SOFTWARE YOU ARE USING


    Most software comes with too many features turned on and is rarely configured
    to operate in the most paranoid mode. Assume the worst—that all the services and
    software running on your firewall are configured to allow the world to have full
    access to the system without having to so much as an account and password on the
    system. For instance, the venerable sshd, the stalwart tool of Unix administrators
    everywhere, is rarely configured out of the box to its most secure settings. Too
    often is set to allow protocol 1 connections, which is known to have serious security
    flaws, allow root logins, to not run as unprivileged user, and to honor user environment
    settings. All of'
