- img_proc: true
  md: 'When activated, the system will generate a log entry for each chain in the
    ruleset, prefacing these debugging rules with an asterisk "*" to help tell them
    apart from normal logging rules and also to make it easier to remove these via
    the iptables-trace script. The net field denotes the type of chain being logged,
    "m" for mangle, "f" for filter, and "n" for nat. Following that is the name of
    the chain, OUTPUT for instance, then the index for the rule to tell you in what
    order this rule is triggered, and finally the target of the rule.


    Like an init script, this is invoked with a stop or start command. It then parses
    the iptables rules and adds a LOG target for that so that you can track the progress
    of a packet as it moves through the system. Tools like fwbuilder and others also
    add in these sorts of diagnostic/debugging rules on-the-fly through their interfaces.
    The intent is to add in a logging rule for everything and to assume nothing is
    working correctly.


    # THE CATCH ALL LOGGING RULE


    Another useful logging trick is to put in place at the end of all your firewall
    rules, before your final DROP or REJECT rule, a catch all logging rule. This will
    help you diagnose packets that are dropped by the firewall because of a missing
    rule, typo, or other mistake. This is also a useful security measure because the
    firewall will now log all the packets you will reject as part of your "unless
    allow, deny" security philosophy.


    ```

    # catch all dropped packets

    $IPTABLES -A INPUT -p all -m limit --limit 1/second \

    -j LOG --log-level info --prefix "FINAL - DROP " \

    --log-tcp-sequence --log-tcp-options -log-ip-options

    ```


    Keep in mind that in our example we are limiting the number of packets that will
    be logged to one per second. This is to prevent the firewall system from being
    overwhelmed by either too much traffic or by a deliberate attempt by an attacker
    to overwhelm the system. This is just a suggestion, though. If you want to log
    every packet, your iptables command would look like this:


    ```

    # catch all dropped packets

    $IPTABLES -A INPUT -p all -j LOG --log-level info \

    -log -prefix "FINAL - DROP " --log-tcp-sequence \

    --log-tcp-options -log-ip-options

    ```'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# THE IPTABLES TRACE PATCH


    There is also a nifty patch for iptables called TR. It is not presently part of
    the stock iptables binary or any stock kernels, so you will have to patch both
    to get this option. We provide instructions for patching on our website at http://www.gotroot.com.
    Where possible, we also provide links to copies of some iptables binaries that
    include this option, and you will find it as a module in the kernels we provide
    on our website. The patch is also available from the netfilter website, http://www.netfilter.org.
    It''s included in the patch-o-matic archives.


    TRACE is a target, much in the same way that ACCEPT or DROP are. You mark a packet
    with TRACE, and the system will log “flow” through the netfilter system via its
    table or chain name.


    We think the -j TRACE target should be included in every iptables binary and kernel
    distribution. Although it can be slow, it''s a useful tool designed to help you
    with diagnosing firewall rules.


    Unfortunately, as TRACE is not included in any Linux distributions, we''re not
    going to spend any time discussing it in this book, as it''s not really available
    for most users. Our goal is to focus on tools that are in widespread use. If you
    are interested in using -j TRACE, please check our website (www.gotroot.com) for
    examples.


    # CHECKING THE NETWORK


    Refer back to the troubleshooting methodology covered in Chapter 4 and the OSI
    model in Chapter 5. The first thing to check when diagnosing network problems
    is the arp cache to make sure that the problem with the firewall or host is not
    just related to a bad arp entry and a problem at Layer 2 of the OSI model. To
    view the arp cache, the command is very straightforward:


    ```

    arp -n

    ```


    | Address | Hwtype | Hwaddress | Flags Mask | Iface |

    |---|---|---|---||

    | 192.168.10.1 | ether | 00:00:12:34:56:78 | C | eth1 |


    Or in the Linux style:


    ```

    arp -e

    ```


    | Address | Hwtype | Hwaddress | Flags Mask | Iface |

    |---|---|---|---||

    | foo.bar.edu | ether | 00:00:12:34:56:78 | C | eth1 |'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'In this example, there is just one host, our firewall, as seen from a client.
    Let''s imagine the arp entry is reporting the wrong hardware address for our firewall.
    You can flush this entry from the arp table with the -d switch.


    arp -d 192.168.10.1


    When viewing the arp cache on your host, you will see that it''s empty:


    arp -n

    Address Hwtype Hwidth Flags Mask Iface


    Please check the arp man pages for information on other options for arp. The intent
    here is to show that you will want to work up from the OSI model, ruling out problems
    before moving to more complex issues. When arp is ruled out, you can move to IP
    and so on.


    Next, we move on to ping. As the reader is no doubt, ping is one of the easiest
    tools for testing a connection and can help determine if a host is up or if there
    is an outage between two hosts. Again, the intent is to rule out root problems
    at lower layers of the OSI model before moving to higher levels. ping included
    with Linux and other operating systems is greatly limited in terms of what it
    can test for. With ping, you might be able, depending on your firewall rules,
    to help determine if a problem lies at a lower or higher level of the OSI model,
    indicating where you should start looking. The previous chapter included some
    examples of how to use ping to diagnose Layer 2 problems. Here we present some
    additional uses of ping to test more basic connectivity between hosts. It can
    also be used to map the route between two hosts using the -R switch:


    ```

    ping -R gootroot.com (205.241.45.98) 56(124) bytes of data.

    PING gootroot.com (205.241.45.98): icmp_seq=1 ttl=50 time=92.7 ms

    64 bytes from plesk.shinn.net (216.248.230.134) icmp_seq=1 ttl=50 time=... ms

    RR: liberty.gmsociety.org (216.248.230.134)

    pos2-0.gsrl2012.fmt.he.net (64.249.221)

    ix-4-0.core.PaloAlto.Telelog.net (64.86.84.154)

    if-8-0.core.PaloAlto.Telelog.net (207.455.222.26)

    s1-teleg-2-0.sprintlink.net (160.81.205.142)

    s1-gw28-ana-0-0.sprintlink.net (144.232.1.30)

    s1-bb21-ana-6-0.sprintlink.net (144.232.1.61)

    s1-bb25-ana-8-0.sprintlink.net (144.232.9.64)

    s1-bb24-fw-14-0.sprintlink.net (144.232.11.73)

    ```'
  merge: -1
