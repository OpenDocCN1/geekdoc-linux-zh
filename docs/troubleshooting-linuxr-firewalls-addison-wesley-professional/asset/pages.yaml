  md: "# # Web Services\n(Web Servers and Web Proxies)\n\nIn this chapter, we cover\
    \ common firewall configurations for both network and host-only firewalls and\
    \ web services. Specifically, we provide example configurations for \"unless allow,\
    \ deny\" host-only firewalls, transparent web proxy servers, single and multi-IP\
    \ forwarding configurations, filtering access to web servers and clients, as a\
    \ typical road warrior forwarded configuration.\n\n# ## COMMON QUESTIONS\n\nQ:\
    \ I have a DMZ web server or one running on my firewall itself. I can see it at\
    \ home but not work. What is going on?\n\nA: A great many ISPs filter out port\
    \ 80 these days on their broadband networks. Before spending a great deal of time\
    \ trying to debug your firewall, check with your ISP first and see if they are\
    \ filtering this service out. If they are, your only option is to run your web\
    \ server on another ISP that is not filtered or run your web server on a different\
    \ port. A quick and dirty way to test this is with telnet and to issue a HEAD\
    \ / HTML 1.0 \n\n\n\nExample:\n\n```\n[user@laptop]$ telnet www.atomicrockettle.com\
    \ 80\nConnected to www.atomicrockettle.com (216.218.240.133)\nEscape character\
    \ is '^'\nHEAD / HTML 1.0 \n\n\n```"
  merge: -1
