    # TESTING FROM THE OUTSIDE->IN


    Of course this is typically what a firewall is all about—making sure people cannot
    get back in. We use the exact same method as previously described in the nmap
    scan with the added dimension of looking at the output itself. Obviously you need
    to have a host you can get to first, if you''re on the other side of the Internet,
    your options are limited. However, if you''re on the same segment of the firewall,
    here is a neat trick that may help you identify weaknesses in your firewall. Set
    the firewall as your gateway. You''d be surprised at how many times we have managed
    to beat firewall rules by doing this. We realize it''s a pretty brainless method,
    but it''s often the simple things that get you into the most trouble.'
