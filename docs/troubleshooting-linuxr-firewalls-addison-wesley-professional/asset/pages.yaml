  md: '# CHAPTER 7 USING IPTABLES


    Based on that documentation, that is why we place these kinds of rules after our
    state tracking rules. The ESTABLISHED AND RELATED rules here will catch all of
    the NAT packets for. Everything after that is an unused product and anyone hitting
    those ports is either confused, running a broken app, or up to no good.


    ```

