  md: '# Introduction


    Basically, an application proxy is an application that runs on your firewall or
    gateway that relays traffic between you and your destination. The added advantage
    here is that the traffic is being sent/received between both endpoints by a third-party
    application, meaning you can enforce very specific guidelines on the way the traffic
    is crafted between both points.


    +   **Stateful Inspection**: This would be the third generation of firewall technology,
    which is related to the packet filtering method, but it extends the capabilities
    of firewalling by continuing to inspect the packets as they pass through the firewall.
    Netfilter/iptables is a stateful inspection type firewall.

    main features are

    * stateful packet filtering (connection tracking)

    * all kinds of network address translation

    * flexible and extensible infrastructure

    * large number of additional features as patches


    +   **Hybrids**: Hybrids are the fourth generation. They are a combination of
    the previous three, giving the users more control of the methods they intend to
    employ to carry out their firewall policy.


