    # CORRECTIVE ACTIONS


    +   1. Connect cabling—ensure that all cables are correctly wired and correctly
    plugged in. Loose or bad cabling can cause inconsistent operation.


    +   2. Ensure that the network card driver you are using is the correct one for
    the device. Oftentimes drivers, such as the tulip chipset, will work on multiple
    multipul-based network cards.'
  merge: -1
