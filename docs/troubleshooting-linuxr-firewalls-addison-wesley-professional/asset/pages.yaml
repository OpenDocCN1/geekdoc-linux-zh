  md: '# PHASE IV: IMPLEMENT MONITORING


    When all is said and done, you''re going to develop a system to measure the quality
    of your efforts on an ongoing and regular basis. This is done through security
    metrics and improves with maturity of the security process within an organization.
    There are five levels of maturity of a risk management program:


    +   1. Having well-defined security policies

    2. Having well-defined procedures

    3. Implementing those procedures

    4. Testing compliance with effectiveness of those procedures

    5. Fully integrating these policies and procedures into the ongoing regular operations
    of the organization


    Don''t feel like you have to bite off the entire risk management approach in one
    step. It takes time, research, tact, patience, and persistence to collect all
    the data, to create coherent and balanced policies, and to get them integrated
    into organization. It might take years for a large government agency or company
    to fully embrace these changes, and sadly it usually takes a major disaster for
    the process to really gain momentum. If you want to see fundamental changes in
    your organization''s risk management process occur, it''s going to take hard work.
    All the firewalls in the world can''t replace the effect of having a Level 5 risk
    management program in place. It is well worth the effort.


    # PHASE V:TEST


    During this phase, the organization should rigorously and skeptically test every
    assumption and system for weakness. Testing should also be built into the standard
    practices of the organization to occur on a regular basis. This phase is not only
    designed to determine if the effort at any one point is effective and how it can
    be improved upon, but also to create a regular and in-depth process for testing
    all policies, procedures, personnel, and controls for ongoing effectiveness. When
    creating a risk management program, this can be accomplished by conducting another
    set of vulnerability assessments.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# PHASE VI: INTEGRATE


    Integrate all procedures, policies, and controls into the standard practices of
    the organization to occur on a daily basis. No really—we mean it. For the process
    to be truly integrated, and this is a very difficult thing to realize, it has
    to become part of the fabric of daily activities. Systems need to be patched quickly,
    passwords must be strong, policies must be followed, intrusions must be detected,
    and so on. The list goes on. The point is that you can''t produce several policies
    and deploy some clever security controls, such as firewalls, and then forget about
    it all and hope that everything will be secure. All the former steps should lead
    to fundamental change in the organization.


    # PHASE VII: IMPROVE


    The last phase of the process is to integrate all the lessons learned and any
    new information gleaned from all the other phases in improving the entire risk
    management program. This is basically a loop or a full life cycle approach. Phase
    VII leads back into Phase I, where the process is repeated again infinitely.


    To close out this chapter, the overall security of your networks and organization
    will depend entirely on how robust your risk management process is and how well
    and sincerely it is implemented.


    # SUMMARY


    Before you implement a firewall, first ask yourself what you are trying to defend—and
    from whom. Firewalls are only one part of the overall security strategy, one tool
    among many will help you defend your network, systems, and ultimately your business
    from threats. It is not a replacement for diligent planning, nor is it a security
    “silver bullet.” Its purpose is, above all, to serve as a mechanism for compartmentalization.
    It cannot protect your systems from what you allow in.'
