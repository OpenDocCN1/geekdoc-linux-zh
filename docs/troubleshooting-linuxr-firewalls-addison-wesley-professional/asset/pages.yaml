  md: "host-based firewall rules to restrict the clients that can connect to it. The\
    \ networks 10.10.10.0/24 and 192.168.1.0/24 are allowed to connect to the FTP\
    \ service on port TCP port 21. SSH connections are only allowed from the host\
    \ 172.16.32.32.\n\nOur first example is a very short, basic method:\n\n```\n#\
    \ where $DNSSERVER is our DNS server.\n$IPTABLES -P INPUT DROP\n$IPTABLES -A INPUT\
    \ -s 10.10.10.0/24 -p tcp \\\n  --d-port 21 -j ACCEPT\n$IPTABLES -A INPUT -s 192.168.1.0/24\
    \ -p tcp \\\n  --d-port 21 -j ACCEPT\n$IPTABLES -A INPUT -s 172.16.32.32 -p tcp\
    \ \\\n  --d-port 22 -j ACCEPT\n$IPTABLES -A INPUT -A INPUT -p udp -m udp \\\n\
    \  -s $DNSSERVER --sport 53 -d 0/0 -j ACCEPT\n```\n\nThis second example achieves\
    \ the same effect with a bit more flexibility and overall network friendliness\
    \ given to the service, the previous rule uses - DROP, REJECT when a restricted\
    \ host attempts to connect to the service, which just tosses the packets to the\
    \ side. While in effect this achieves the same thing, using a -j REJECT rule will\
    \ make it easier to diagnose that they are being filtered out from the perspective\
    \ of the client.\n\n```\n# where $DNSSERVER is the IP address of your DNS server.\n\
    $IPTABLES -N FTPCLIENTS\n$IPTABLES -A INPUT -N FTPCLIENTS\n$IPTABLES -A FORWARD\
    \ -j FTPCLIENTS\n$IPTABLES -A FTPCLIENTS -p tcp -m tcp --dport 21 \\\n  -s 10.10.10.0/24\
    \ --syn -j ACCEPT\n$IPTABLES -A FTPCLIENTS -p tcp -m tcp --dport 21 \\\n  -s 192.168.1.0/24\
    \ --syn -j ACCEPT\n$IPTABLES -A FTPCLIENTS -p tcp -m tcp --dport 22 \\\n  -s 172.16.32.32\
    \ --syn -j ACCEPT\n$IPTABLES -A FTPCLIENTS -j ACCEPT\n$IPTABLES -A FTPCLIENTS\
    \ -p udp -m udp -s $DNSSERVER \\\n  --sport 53 -d 0/0 -j ACCEPT\n$IPTABLES -A\
    \ FTPCLIENTS -p tcp -m tcp --syn -j REJECT\n$IPTABLES -A FTPCLIENTS -p udp -m\
    \ udp -j REJECT\n```"
