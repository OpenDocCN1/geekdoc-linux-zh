  md: '# Cloud FIREWALL SECURITY


    run yum out of cron, or you can use some yum scripts that some yum distributions
    include to add yum to the cron process automatically.


    Here is an example yum cron process that would attempt to download and install
    any new updates to the system at 3:00 a.m. every night of the week. The -y switch
    tells yum to answer "yes" to any questions it might ask. The upgrade option tells
    yum to update existing software and not to install any new packages that have
    been released.


    ```

    0 3 * * * /usr/bin/yum upgrade -y

    ```


    You can find yum at the following websites: http://www.groot.com and http://www.fedora.us.


    # RED CARPET


    red carpet is Simian''s, now Novell''s, package management system. red carpet
    is a truly advanced package management system, leveraging the systems local package
    management system (rpm for instance) along with remote host management capabilities,
    a slick GUI, integrity verification site fail over, and a true client/server model.
    This wonder package allows you to remotely control all your hosts running red
    carpet and to push/remove/install software on all those hosts. You can also run
    it in standalone mode if you do not need the remote control features, and it also
    works just as well from the command line as it does the GUI.


    For instance, from the command line you can instruct red carpet to upgrade all
    the software on a system:


    ```

    rug up -y

    ```


    or for the older red carpet client:


    ```

    rc up -y

    ```


    It''s important to note though red carpet, like yum, uses channels to control
    the software it will manage. You will need to configure red carpet to download
    and watch for changes to the channels that matter to your system.

    Also red carpet will not automatically install updates. You will need to set up
    a cron-job to do that for you. Here is an example of a cronjob we have used successfully:


    ```

    0 */12 * * * /usr/bin/rug up -y

    ```'
