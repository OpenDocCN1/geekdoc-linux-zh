  md: '# # Testing Your Firewall Rules (for Security!)


    Firewalls work both ways. You can use them to keep bad traffic from the outside
    coming in


    This is perhaps a good moment to talk about the concept of firewalls in general
    (we promise to be brief.) and why the very first diagnostic procedure we talk
    about is specifically the most important. A firewall is not a router; nor is it
    a gateway. It’s a compartmentalization tool. If the whole reason you picked up
    out of your network, then this book is to make sure you can get your traffic out
    is probably the most important section for you to read. There are three types
    of firewalls:


    +   1. Application Layer (proxy servers such as squid, reiam, or the TIS firewall
    toolkit)

    2. Packet Filtering (routers, switches, and so on)

    3. Stateful Inspection (netfilter/iptables)


    Routers and other network gateways generally fall into the “packet filtering”
    category, which means that they look at the first packet in a session, match it
    to a rule, and then let the rest go with no further inspection. That means they
    are trivial to beat (and we’ll show you how later in the chapter) using some very
    simple methods. Stateful inspection firewalls look at every packet as it goes
    by to ensure it conforms to the firewall policy you have created on the system.
    The methods used here may work on a stateful inspection firewall but generally
    only if you’ve done something horribly, horribly wrong.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Chapter 6 Testing Your Firewall Rules (FOR SECURITY)


    How do you beat packet filtering firewalls? Simple—fragment the packets. There
    are many ways to do this, with userspace tools as nmap, changing the MTU on your
    network card, or your personal favorite, a tool called fragrouter from the nids-benchmark
    toolkit (http://packetstore.widesarch.nl/UNIX/JDS/nidsbench/nidsbench.html) by
    Thomas Ptacek and T. Newsham. We will see at fragrouter later in the chapter to
    demonstrate weaknesses in packet filtering systems.


    There are two types of tests you should perform on every firewall: an external
    scan against inside systems (OUTSIDE->IN), and an internal scan against systems
    on the outside (INSIDE->OUT). The first test is useful in occasions where you''re
    dealing with address reachable from your network through your firewall, such as
    a DMZ network, or if you are in an environment where potential intruders can set
    your firewall as the gateway (think wireless networks or conference rooms if you
    put them in DMZs).


    The INSIDE->OUT test verifies kinds of traffic from your internal or DMZ networks
    get across your firewall. This is a useful verification test if you are attempting
    to filter what types of traffic your DMZ systems can get through your firewall.
    If your DMZ hosts web servers, there is no point in allowing them to send out
    to the X11 port, SMTP, or frankly any traffic that is not coming from the source
    port of the web server itself (TCP ports 80 and 443, respectively). This is valuable
    for a security standpoint in the event the web server is compromised (through
    port 80—because you have a firewall it doesn''t mean that your web server cannot
    be exploited on the ports you allow in!), it cannot be used as a platform to attack
    other systems through your firewall.


    A good example of an INSIDE->OUT test discovering a weakness in firewall rules
    was when we were setting setting IPS IPS VPNs to secure our wireless networks
    (see Chapter 19, "Virtual Private Networks," for more information on this). Our
    firewalls were configured to allow transparent proxies on web and IM traffic,
    so though the firewalls were configured to block all outbound traffic not coming
    through the IPSEC VPN networks, the transparent proxy servers were redirecting
    the traffic output. This was discovered and corrected quickly by using an INSIDE->OUT
    scan.


    # INSIDE->OUT TESTING WITH NMAP AND IPLOG


    Another way to test what can come in, or probably more interestingly, what can
    go out through a combination of nmap and iplog (www.insecure.org) is a very popular
    users port scanner that bundles with most Linux distributions these days. iplog
    (http://ojnk.sourceforge.net) is a userspace port connection logger. You could
    also use iptables/filter rules to log these connections, but for the sake of testing,
    using iplog as an independent method for collecting diagnostic information is
    preferred.


    ![](img/9e2290071e555156f9bb68f2189d9345_203_0.png)'
  merge: -1
  pgno: 203
- img_proc: true
  md: '![](img/9e2290071e555156f9bb68f2189d9345_204_0.png)


    Figure 10.1 nmap INSIDE->OUT scan with iplog.


    To test your outbound rules, you will need two systems—one behind your firewall
    running **nmap** and one on the outside running **iplog**. The idea here is that
    you''re going to do full 65536 port TCP/SYN/FIN/UDP scans through your firewall
    to see what it allows outbound and log these connections on the **iplog** host.
    You will want to use this test method whenever you need to verify that you are
    filtering outbound connections successfully. (A very important test!)


    The first system is your scanner system running behind your firewall, and we will
    call Host-A. The second system is the **iplog** system, Host-B.


    Host-A:

    This system will specifically need to be physically connected into the network
    of the same segment(s) containing the systems that you are testing your rules
    against. This is due to the nature of iptables/netfilter allowing you to assign
    rules to the firewall''s interface. Try and make sure that system is as close
    to the "real thing" (a web server for example) as possible. Or barring that...use
    the real thing! In this first example we''ll assume our scanner system is a Redhat
    9 web server called Host-A, sitting on the DMZ segment. From this system, we will
    perform our port scan against the system with Host-B on the opposite side of the
    firewall. From Host-A we will execute six types of test'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'scans, a three-way-handshake tcpopen() scan, a SYN only scan, a FIN only scan,
    a NULL scan, an XMAS scan, and a UDP scan. The following is the syntax of the
    tcpopen() scan:


    TCP Open (three-way handshake)


    nmap -sT -P0 -p 1-65535 Host-B


    SYN scan (sends SYN packets only)


    nmap -sS -P0 -p 1-65535 Host-B


    FIN scan (sends the FIN packet only)


    nmap -sF -P0 -p 1-65535 Host-B


    NULL scan (sends TCP packets with NO flags set)


    nmap -sN -P0 -p 1-65535 Host-B


    XMAS scan (sends TCP packets with the X flag set)


    nmap -sX -P0 -p 1-65535 Host-B


    UDP scan (sends UDP packets only)


    nmap -sU -P0 -p 1-65535 Host-B


    ICMP scan


    nmap -sP Host-B


    > NOTE

    The -P0 flag instructs nmap NOT to use an ICMP or TCP ping to determine if the
    remote host is active. This ensures that your scan will work regardless of whether
    it is possible to ping or connect to a service on the remote system; otherwise,
    if ICMP were not allowed, nmap would exit, thereby ruining the value of this test.
    All we care about is the data!'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Host-B:


    This is your logging system, which should catch all the packets your firewall
    is allowing to pass through its rules. For this example, we will assume that Host-B
    is a Redhat 9 server on the Internet with no filters or proxy servers other than
    the firewall being tested—between and Host-A. This system is running iplog v.2.2.3,
    with the following options:


    ```

    iplog -D -F -P -S -b -d -f -detect-syn-scan=true -n -p -w

    ```


    # Table 10.1 Options


    | - | - |

    | - | - |

    | -D | Logs the destination of traffic. |

    | -F | Logs UDP scans. |

    | -P | Log ICMP ping floods. |

    | -S | Log smurf (These are attacks that involve pinging a system with a broadcast
    address in the response field. We''re not testing this directly, but it comes
    handy when playing with the mangle features in iptables.) |

    | -b | Log bogus TCP flags. |

    | -d | Ignore DNS traffic (from the local system, specified in /etc/resolv.conf).
    |

    | -f | Log FIN scans. |

    | --detect-syn-scan=true | (This keeps iplog from being overwhelmed if you''re
    testing something SYN flooding through the firewall.) |

    | -n | Log NULL scans. |

    | -p | Log port scans. |

    | -w | Log the IP along with the hostname. |

    | -t | Log traceroutes. |

    | -x | Log Xmas scans. |

    | -y | Log fragment attacks (ala fragrouter). |


    Once running, iplog will default to dumping its data to syslog on our Redhat 9
    system—this is the logfile /var/log/messages.'
