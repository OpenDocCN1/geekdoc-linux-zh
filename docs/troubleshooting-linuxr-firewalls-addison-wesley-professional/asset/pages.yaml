    udp 17 0 src=10.10.10.8 dst=10.10.10.253 sport=40005 dport=53 src=10.10.10.253

    dst=10.10.10.8 sport=53 dport=40005 [ASSURED] use=1=761


    For a closed session, we will see a TIME_WAIT state. This is a post-closed state
    for this session. After a session has been terminated, the kernel waits, by default,
    180 seconds to ensure that any out-of-order packets that might have been part
    of this connection are properly sorted out and allowed to reach their destination.
    Once the timer reaches zero, the connection is removed from the state engine entirely.
    In this case, the connection has 45 seconds left.


    tcp 6 32 TIME_WAIT src=172.31.254.2 dst=80.57.62.61 sport=1849 dport=2794

    src=80.57.62.61 dst=EXTERNAL_IP_FOR_NAT_CLIENT sport=2794 dport=1849 use=1=956


    You might notice that the states listed in these examples are sometimes different
    from the ones we explained in the first part of the chapter. This is because netfilter
    and iptables are different parts of the kernel. iptables is a user interface to
    the netfilter code. Many of the internal netfilter states are not something the
    typical user will need to manipulate when using the state engine. For instance,
    when using iptables, we do not have to concern ourselves with the SYN_SENT and
    SYN_RECV states. They don''t matter to us. We only care about the beginning or
    the end of that process. That is—a NEW,'
