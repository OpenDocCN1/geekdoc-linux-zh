  md: 'There are three basic sub-phases to this phase:


    +   1. Implement policies

    2. Implement procedures

    3. Deploy security technology and counter measures


    # IMPLEMENT POLICIES


    This sounds like a simple step, but it''s often overlooked. Policies are created
    but aren''ntneffectively enforced or implemented in a meaningful manner inside
    an organization. If the policies don''t make sense because the users don''t understand
    them or know they exist, they won''t be followed. If the managing authority lacks
    the authority to enforce the policies, they aren''t what they''re written in.
    The implementation phase involves dealing with all these issues in a productive
    manner so that your security policies are actually effective. This can be one
    of the more time-consuming elements of bringing a risk management program into
    an organization, typically the process starts from inside the IT group in a corporation,
    which does not have the authority to dictate policies to the entire rest of the
    organization. For any set of policies to be effective, the process will require
    full management support and buy-in, all the way up to the highest possible authority
    in the company. Otherwise, you are left not with policies, but with suggestions.
    Suggestions will not protect you from risk.


    # IMPLEMENT PROCEDURES


    As policies, put the procedures into regular daily use. A good practice is to
    make sure it''s as difficult as possible to not follow the procedures. When there
    is a shortcut available that bypasses your security procedures, sadly people will
    take it. Policies can help here by instituting sanctions for bypassing procedures—as
    can technical barriers. For instance, password strength checks are an example
    of automating a policy and a procedure. The user is forced to follow good security
    procedures for creating strong password.


    # DEPLOY SECURITY TECHNOLOGY AND COUNTER MEASURES


    As this book focuses on firewalls, we will concentrate on how we can deploy security
    technology and counter measures using a firewall; however, keep in mind that this
    phase is absolutely not accomplished through the use of firewalls alone. There
    are a number of'
  merge: -1
