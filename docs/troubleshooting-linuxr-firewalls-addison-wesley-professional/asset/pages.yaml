    while the rest of the traffic goes over the other interface. To accomplish this
    we use the ROUTE-path-o metric/iptables patch to give us the ability to route
    arbitrarily by source, destination or destination port, MAC address, and so on.
    The following is what the pertinent rules look like:


    ```

    iptables -A PROUTING -t mangle -s 192.168.10.0/24 \

    -p tcp --dport 25 -j ROUTE --gw 1.2.3.4 --oif eth2 \

    --continue

    ```


    gw is our upstream gateway for the second ISP connection on this firewall. When
    we try to connect out to port 25 on one of our servers, the connection does not
    go through.'
