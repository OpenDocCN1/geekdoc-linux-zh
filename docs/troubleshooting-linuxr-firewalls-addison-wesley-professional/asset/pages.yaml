- img_proc: true
  md: 'This second rule instructs iptables to redirect all outbound traffic from the
    10.10.10.0/24 to the destination network 10.10.11.0/24 only out the ppp0 device.


    ```

    $IPTABLES --insert INPUT 1 --source 10.10.11.0/24 \

    --destination 10.10.10.0/24 --jump ACCEPT -i ppp0

    ```


    This rule sets the INPUT policy that traffic on the ppp0 interface, from the 10.10.11.0/24
    network destined to the 10.10.10.0/24 network, be accepted.


    ```

    $IPTABLES --insert FORWARD 1 --source 10.10.10.0/24 \

    --destination 10.10.11.0/24 --jump ACCEPT -o ppp0

    ```


    The fourth rule in this chain netfilter to forward packets from the source network
    10.10.10.0/24 and a destination of 10.10.11.0/24 out the ppp0 interface. Without
    this rule, the Host-A firewall itself would be allowed to communicate with systems
    on the 10.10.11.0/24 network.


    ```

    $IPTABLES --insert FORWARD 1 --source 10.10.11.0/24 \

    --destination 10.10.10.0/24 --jump ACCEPT -i ppp0

    ```


    This fifth rule sets the FORWARD policy for traffic from the 10.10.11.0/24 network,
    destined to the 10.10.10.0/24 network, be accepted on the ppp0 interface.


    ```

    $IPTABLES --append FORWARD --protocol tcp \

    --tcp-flags SYN, RST SYN --jump TCPMSS \

    --clamp-mss-to-pmtu

    ```


    This final rule is used on 2 kernels to deal with the oft-repeated MTU path discovery
    issue when dealing with DSL, PPPoE, and other situations where the MTU is causing
    problems with your connections.


    # USING A FREE/OPENSWAN VPN TO SECURE A WIRELESS NETWORK


    This example is specifically for securing a wireless network, but it could just
    easily be used to create a "road warrior" VPN connection in conjunction with netfilter
    this example.


    In this scenario, we have a wireless segment (192.168.32.0/24) that we would like
    to secure using netfilter and an openswan IPSEC VPN. Our access point will act
    as the DHCP server, and we will configure our firewall (Firewall-A) to drop all
    traffic from the'
  merge: -1
  pgno: 364
- img_proc: true
  md: '192.168.32.0/24 network attempting to traverse the firewall. This is to ensure
    that if someone manages to hop on the wireless network by cracking the WEP or
    WAP keys, or she still cannot access systems on the other side (internal network)
    of your firewall, or the Internet. Of course, they will be able to attack nodes
    on the wireless segment, so you might want to establish local firewall rules on
    all your hosts as shown in the example at the end of this section.


    ![](img/9e2290071e555156f9bb68f2189d9345_365_0.png)


    **Figure 19.7** A wireless network secured using firewall rules and IPSec VPNs.


    The intent of this design is to


    +   1. Secure your wireless communications from eavesdropping.

    2. Secure your wireless network from becoming an open access point and prevent
    attackers from accessing your internal network or the Internet.'
