  md: "# SSH, by default uses TCP port 22. To allow SSH connections to your system,\
    \ you need\nto add the following rule:\n\n```\n$IPTABLES -A INPUT -p tcp --dport\
    \ 22 -j ACCEPT\n```\n\nSSH supports userland connection filtering, using tcpwrappers;\
    \ however, we recom-\nmend that you limit direct access to your services whenever\
    \ you can because every\nservice, including SSH, has some type of remotely exploitable\
    \ vulnerability that\nsom like tcpwrappers would not save you from. The following\
    \ example rule\ndemonstrates a firewall set up to restrict access to only the\
    \ SSH port from the hosts\n22.33.44.55 and 11.22.33.44:\n\n```\n# where DNSSERVER\n\
    $IPTABLES -P INPUT -j DROP\n$IPTABLES -A INPUT -s 11.22.33.44 -p tcp --dport 22\
    \ \\\n  -j ACCEPT\n$IPTABLES -A INPUT -s 22.33.44.55 -p tcp --dport 22 \\\n  -j\
    \ ACCEPT\n```\n\n```\n# allow DNS\n$IPTABLES -A INPUT -p udp -m udp -s DNSSERVER\
    \ \\\n  --port 53 -d 0/0 -j ACCEPT\n```\n\nThis last rule allows the system to\
    \ make DNS lookups. The next example was\ngener by Redhat's Lokkit utility and\
    \ demonstrates using a user-defined chain to\nachieve the same:\n\n```\n# part\
    \ 1\n$IPTABLES -N SSHCLIENTS\n$IPTABLES -A INPUT -N SSHCLIENTS\n$IPTABLES -A FORWARD\
    \ -j SSHCLIENTS\n$IPTABLES -A SSHCLIENTS -p tcp -m tcp --dport 22 \\\n  -s 11.22.33.44\
    \ ---syn -j ACCEPT\n$IPTABLES -A SSHCLIENTS -p tcp -m tcp --dport 22 \\\n  -s\
    \ 22.33.44.55 --syn -j ACCEPT\n$IPTABLES -A SSHCLIENTS -j ACCEPT\n```\n\n```\n\
    # part 2\n$IPTABLES -A SSHCLIENTS -p udp -m udp -s DNSSERVER \\\n  --port 53 -d\
    \ 0/0 -j ACCEPT\n```"
