  md: '# UNDERSTANDING THE INTERNET PROTOCOL (IP)


    IP is a Layer 3 protocol (Network Layer) and is documented fully in RFC 791. IP
    traffic contains routing and address information and is the medium by which packets
    traverse the Internet—hence, the rather obvious name, "Internet Protocol." This,
    combined with the Transmission Control Protocol (TCP), the backbone of how many
    services on the Internet function. From IP''s routing duties, this is also where
    the reassembly of packets (which we call a single unit of IP, TCP, ICMP, or UDP
    data) occurs when IP traffic moves through devices that dictate the Maximum Transmission
    Unit (MTU) size.


    Briefly, the MTU defines how big of a packet a particular device can handle. With
    fast connections, this value isn''t nearly as important because it''s almost always
    set to the maximum size possible. MTU is mostly an issue with slower connections,
    such as modems, where the maximum packet size is much smaller. MTUs become important
    when packets are lost and have to be retransmitted. If a packet is very large
    and only a tiny portion of the packet was really lost, the entire packet must
    be retransmitted. The idea behind smaller MTUs is to help prevent resending too
    much data.


    | Version | IHL | Type-of-service | Total Length |

    |---|---|---|---|n| Identification | | Flags | Fragment Offset |

    | Time-to-Live | | Protocol | Header Checksum |

    | | | Source Address | |

    | | | Destination Address | |

    | | | Options | Padding |

    | | | Data | |


    Figure 5.2 The Internet Protocol Packet.'
