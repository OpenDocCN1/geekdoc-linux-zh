  md: 'greatly on these using the switches and techniques we describe in Chapters
    6 and 7 and other chapters in this book. For instance, you could apply this rule
    to a specific interface, such as eth0 or eth1 to further control who has access
    to this rule by adding the -i <interface> switch for INPUT and FORWARD rules for
    OUTPUT and POSTROUTING rules, the -o <switch>. The -i switch defines the incoming
