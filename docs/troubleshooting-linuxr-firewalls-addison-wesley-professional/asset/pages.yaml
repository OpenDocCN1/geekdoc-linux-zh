  md: '# SMTP (e-mail)


    In this chapter we will cover some of the more common SMTP issues, including sending/receiving
    mail from the firewall, forwarding SMTP traffic to an internal mail server, and
    dealing with special circumstances to keep in mind when firewalling SMTP servers.


    # Common Questions


    Q: Can iptables/netfilter alert via e-mail?


    A: Natively, no, it cannot. There are numerous ways to add in alerting capabilities
    with user space tools such as the IDS `snort` (http://www.snort.org).


    Q: Can firewall rules be used to route traffic based on the recipient?


    A: The short answer is no. The (very) long answer is yes, but you would need to
    use something like `iproute2` (http://ftp.in.ac.ru/ip-routing/) or an application
    layer proxy. It is also possible to use firewall rules to route SMTP traffic destined
    to one machine, to another machine using a redirect rule that can be used to do
    inline filtering (spam, scanning, and so on) on that traffic. It would be up to
    this third-party system to then send the processed SMTP traffic to the original
    destination.'
  merge: -1
  pgno: 270
- img_proc: true
  md: "# CHAPTER 14 SMTP (EMAIL)\n\n# TOOLS DISCUSSED IN THIS CHAPTER\n\nsnort, an\
    \ open source Network-based Intrusion Detection System (NIDS), is covered in this\
    \ chapter and can be found at http://www.snort.org.\n\n# ALLOWING SMTP TO/FROM\
    \ YOUR FIREWALLS\n\nIn this configuration, our firewall (Host-A) is running a\
    \ local MTA (Mail Transfer Agent). This MTA is responsible for sending and/or\
    \ receiving e-mail. It is assumed that you have correctly configured your MTA\
    \ and it functions when the firewall rules are not loaded. The following example\
    \ rules should allow both host-based and network-protecting firewalls to allow\
    \ the SMTP service on the firewall:\n\nReceiving SMTP traffic on Host-A:\n\n```\n\
    $IPTABLES -A INPUT -p tcp--dport 25 -j ACCEPT\n```\n\nThis rule would allow inbound\
    \ SMTP connections on all interfaces. If you wanted to limit this to a specific\
    \ interface, say in the example of a firewall accepting mail only from an internal\
    \ network, we would specify the interface with the following:\n\n```\n# where\
    \ eth1 the internal interface\n$IPTABLES -A INPUT -i eth1 tcp--dport 25 -j ACCEPT\n\
    ```\n\nFor allowing outbound SMTP traffic from the firewall, we would use a connection\
    \ tracking rule as follows:\n\n```\n$IPTABLES -A OUTPUT -p tcp -sport 25 -m state\
    \ \\\n  -state NEW,ESTABLISHED, RELATED -j ACCEPT\n```\n\n# FORWARDING SMTP TO\
    \ AN INTERNAL MAIL SERVER\n\nIn this configuration, our firewall, Host-A, receives\
    \ and forwards SMTP connections on its external interface to an internal server\
    \ using DNAT. Ideally in this configuration, you want your SMTP server (192.168.1.25)\
    \ to exist on its own DMZ segment (192.168.1.0/24). Forwarding these connections\
    \ directly to an internally hosted SMTP server, however common, is not recommended.\
    \ It absolutely opens your internal systems"
