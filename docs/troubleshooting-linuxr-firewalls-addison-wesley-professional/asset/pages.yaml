  md: '# CHAPTER I - LOCAL FIREWALL SECURITY


    well as open source versions of tripwire. The commercial version can be found
    on trip-wire''s website, http://www.tripwire.com/.


    The open source version is available, as with many other tools in this book, at
    our website, http://www.getroot.com.


    # AIDE


    AIDE (Advanced Intrusion Detection Environment) is a free open source replacement
    for tripwire. It''s very similar to tripwire and is even included in some Linux
