    this chapter, the only values you should be concerned with in these commands:


    -p tcp


    This defines the IP protocol. In the present case for ssh, we’re using the TCP
    protocol because ssh runs over the TCP protocol. The TCP protocol is covered in
    the next chapter.


    -s 10.10.1.100


    The -s switch defines the “source” of the connection, 10.10.1.100. This can either
    be an IP address or a network address, such as 10.10.1.0/24. If your intent was
    to allow all connections from 10.10.1.0/24 address, such as 10.10.1.101, and 10.10.1.200
    and any other IP address in the 10.10.1.0/24 network, you would use this instead:


    -s 10.10.1.0/24


    And finally, the destination port itself is defined with this switch:


    ```

    --dport 22

    ```


    This tells iptables to only apply this rule to connections bound to the destination
    port 22 on the firewall. Keep in mind that these are very simple rules and that
    you can expand'
