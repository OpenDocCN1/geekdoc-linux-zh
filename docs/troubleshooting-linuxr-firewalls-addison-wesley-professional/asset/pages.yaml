  md: "# CHAPTER 16 FILE SERVICES NFS AND FTP\n\n```\n# enable connection tracking\n\
    $IPTABLES -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT\n$IPTABLES -A\
    \ OUTPUT -m state --state NEW,ESTABLISHED,RELATED -j ACCEPT\n$IPTABLES -A FORWARD\
    \ ESTABLISHED,RELATED -j ACCEPT\n```\n\n```\n# create the user-defined access\
    \ list\n$IPTABLES -N NFSCLIENTS\n$IPTABLES -A NFSCLIENTS -s 192.168.2.0/24 -j\
    \ RETURN\n$IPTABLES -A NFSCLIENTS -s 192.168.3.100 -j RETURN\n$IPTABLES -A NFSCLIENTS\
    \ -j DROP\n```\n\n```\nfor i in $NFS_PORTS; do\n$IPTABLES -A FORWARD -i EXTERNAL\
    \ -p ALL --dport $i \\\n\\  --m state --state NEW -j NFSCLIENTS\n$IPTABLES -A\
    \ FORWARD -i EXTERNAL -p ALL \\\n\\  --dport $i -m state --state NEW -j ACCEPT\n\
    done\n```\n\n```\n# allow ssh to the firewall\n$IPTABLES -A INPUT -p tcp --dport\
    \ 22 -j ACCEPT\n```\n\n```\n# final rule that lets 192.168.1.0/24 hosts communicate\n\
    # with the rest of the network\n$IPTABLES -A FORWARD -i INTERNAL -p ALL \\\n\n\
    \  -d 0.0.0.0 -s 192.168.1.0/24 -j ACCEPT\n```\n\n```\n# enable ip forwarding\n\
    echo 1 > /proc/sys/net/ipv4/ip_forward\n```\n\n# FTP INBOUND: RUNNING A LOCAL\
    \ FTP SERVER (BASIC RULES)\n\nIn this, the most basic host-based firewall configuration,\
