    To prevent SYN flood attacks, the 2.4 and 2.6 kernels, if compiled with this option,
    have the ability to send out what are referred to as “SYN cookies.” These are
    basic ACK packets that contain a little cryptographic hash, which the responding
    client will echo back as part of its SYN-ACK packet. If the kernel does not see
    this “cookie” in the reply packet, it will assume the connection is bogus and
    drop it. The kernel will only send SYN cookies if the SYN socket buffer is backlogged.
    The intent is to help protect the system from SYN flood attacks. We recommend
    this be turned on by passing I into the /proc/sys/net/ipv4/tcp_syncookies proc
    entry:


    ```

    echo 1 > /proc/sys/net/ipv4/tcp_syncookies

    ```


    ECN, or Explicit Congestion Notification, is a nifty little extension to IP that
    is still in the RFC phase and is not an official extension to IP. It basically
    allows for, as its name implies, a system to explicitly notify a peer that its
    connection is temporarily congested, which should help with dynamically reconfiguring
    timeouts, windows, and other aspects of network behavior to compensate for this.
    However, not all IP stacks know how to deal with this, if you turn this on you
    may notice that you cannot connect to certain sites. For this reason, we recommend
    turning this off on your firewall.


    ```

    echo 0 > /proc/sys/net/ipv4/tcp_ecn

    ```'
