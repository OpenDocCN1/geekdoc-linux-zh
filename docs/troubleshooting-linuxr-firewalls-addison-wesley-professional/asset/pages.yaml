- img_proc: true
  md: '# Packet Sent by Firewall from a Local Process to a Remote System

    (OUTPUT)


    The next case covers what happens when a local process on the firewall tries to
    send a packet out. Such examples might be a DNS server running on the firewall
    or a proxy server. When a packet is generated by a local process, it follows a
    different and inverted path from the previous example.


    Steps:


    +   1. Local program/process generates packet.

    2. The kernel makes a routing decision—where does this packet go?

    3. The netfilter OUTPUT mangle chain is triggered.

    4. OUTPUT: NAT

    5. OUTPUT: filter

    6. POSTROUTING: mangle

    7. POSTROUTING: NAT

    8. Goes out firewall interface.

    9. On the wire (might not get to destination).


    # Packet Our Firewall Is Forwarding for Some Other Host to Some Host

    (FORWARD)


    Finally, the process for handling packets that are only being forwarded by the
    firewall is through yet another different branch in the packet processing tree.
    In this example, the firewall does not trip the INPUT or OUTPUT rules and only
    tries the FORWARD rules.


    Steps:


    +   1. Packet is sent by source to firewall.

    2. Packet is received by the physical interface(s) on firewall.

    3. Packet is processed by the kernel driver on firewall.

    4. Packet is processed by the networking protocol(s) layer on firewall.

    5. Packet is processed by netfilter on firewall.

    6. Any PRERUTING mangle rules are applied. This might change the TTL or TOS of
    the packet.

    7. Any PRERUTING NAT rules are applied. This might change the source and/or destination
    of the packet.

    8. Kernel makes routing decision—where does this packet go? In this example, it’s
    destined not for the firewall, but for some other system the firewall forwards
    packets.'
  merge: -1
  pgno: 109
- img_proc: true
