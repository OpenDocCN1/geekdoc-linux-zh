    22.33.44.55. This allows the flexibility of creating VPNs, as discussed in later
    chapters of the book.


    # Forward: A Basic DMZ


    12.3 demonstrates the ruleset from the previous listing and adding a DMZ network,
    where we can support separate web and mail servers. Our firewall, Host-A, protects
    an internal network, 10.10.10.0/24, a DMZ network, 192.168.1.0/24, where we can
    connect our web server Host-B with the IP address of 192.168.1.80 and our mail
    server Host-C with the IP address of 192.168.1.25. In addition, we configure this
    DMZ so that it cannot access the internal network and all hosts on the Internet
    and the internal network can connect to our DMZ-ed web and mail servers using
    their names, www.domain.com, and mail.domain.com, respectively. Creating DMZs
    around specific services is covered in more detail in later chapters.


    ![](img/9e2290071e555156f9bb68f2189d9345_241_0.png)


    **Figure 12.3** A basic DMZ network.'
