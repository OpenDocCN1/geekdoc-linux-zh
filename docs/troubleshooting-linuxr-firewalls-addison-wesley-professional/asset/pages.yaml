    The example configures a DHCP range of 10.10.10.100-10.10.10.200 with a lease
    time of 12 hours. This also sets the default route to our firewall''s internal
    interface, 10.10.10.1, and the default nameserver, 10.10.10.1.


    # DHCP:Two Addresses on One External INTERFACE


    This is a rather unique question. It was posted to the netfilter mailing list,
    and we felt that it was bizarre enough to require an honorable mention in the
    book. If this section is actually useful to you, and you actually did this, please
    drop us an email about it and why.


    This being said, the topic of the post was about getting an additional DHCP address
    assigned to the external interface on his firewall to get this assigned to his
    gaming console. This device presumably needed ports for "clear shot" to the Internet
    to host games, and port forwarding these ports from the regular IP would would
    have broken other services. Unfortunately not knowing what these ports were, it
    was hard to say if that was really as insurmountable a port forwarding problem
    or not, but that''s neither here nor there. The initial attempt to lease a second
    IP by using an IP alias won''t work because the IP aliased device (eth0:1) doesn''t
    have a MAC address, which is what the DHCP server on the other end is looking
    for. According to the author, the following was the wrong way to do it:


    The following works:


    ```

    /sbin/dhcpcd -t 60 -h CO -d eth0

    ```'
