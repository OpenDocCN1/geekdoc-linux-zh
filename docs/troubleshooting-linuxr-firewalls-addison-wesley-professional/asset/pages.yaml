- img_proc: true
  md: '# TOOLS/METHODS DISCUSSED IN THIS CHAPTER


    9. Ensure that any DROP rules do not match the traffic from your NAT-ed network(s).
    The IP gateway system functions correctly with all firewall rules disabled, it''s
    possible that there are issues with the order in which the firewall rules are
    set. Ensure that the ALLOW rules come before any DROP rules that reference the
    internal network or services being accessed.


    10. Ensure that the upstream gateway from the firewall is configured with the
    appropriate routes for the forwarded internal networks with the firewall set as
    the gateway for those networks.


    11. Clear all the filter rules from your firewall. If one of these is having a
    conflict with the traffic routing through your firewall, consult the diagnostic
    logging section of this book for further information on how to determine which
    rule is being problematic.


    12. Ensure that the nodes on your internal network are configured with the firewall
    as their default route or gateway into those external networks.


    13. The problem is most likely not in the firewall as at this point the system
    is configured as a basic IP gateway and contains no filtering rules at all. Possibly
    the problem is DNS related or is in the network (netmask, and so on) on the hosts
    themselves.


    14. Enable NAT and/or MASQUERADE in the Linux kernel.


    15. Enable NAT or MASQUERADE rules for the internal network. Example—MASQUERADE
    rule, where eth0 is the Internet or external facing interface:


    ```

    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    16. Ensure that the NAT or MASQ rule is bound to the correct interface. Failure
    to bind the correct interface can result in traffic destined for non-masqueraded
    or NAT-ed network to appear to come from the NAT or MASQUERADE network(s), which
    may be intended.


    17. Enable connection tracking with the following rule:


    ```

    $IPTABLES -A INPUT -m state --state ESTABLISHED, RELATED -j ACCEPT #

    Don''t set NEW in here**

    $IPTABLES -A OUTPUT -m state --state ESTABLISHED, RELATED -j ACCEPT

    $IPTABLES -A FORWARD -m state --state ESTABLISHED, RELATED -j ACCEPT

    ```


    18. Clear DROP or OUTPUT filtering rules that may be interfering with the routing
    of traffic.


    > Setting global NEW rules on the INPUT, FORWARD, and OUTPUT chains effectively
    disables all your filtering.'
  merge: -1
  pgno: 248
