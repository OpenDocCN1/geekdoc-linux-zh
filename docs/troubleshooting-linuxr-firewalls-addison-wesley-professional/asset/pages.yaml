  md: '# SEND TCP RESET FOR AUTH CONNECTIONS


    Many services out there will combine the inbound connection to the service with
    an outbound IDENTENT/AUTH request. If we just drop the packet, the server on the
    other end will sit and wait for a response, making your connections (FTP for example)
    appear to be slow. By returning a TCP RST/ACK response, you''re telling the server
    making the auth request that you don''t respond to AUTH. This should shut down
    the query on the other end and speed up.


    ```

    iptables -I INPUT -p tcp -s any/0 --dport 113 \

    -j REJECT --reject-with-tcp-reset

    iptables -I FORWARD -p tcp -i eth1 -s any/0 \

    --dport 113 REJECT --reject-with-tcp-reset

    iptables -I FORWARD -p tcp -i eth2 -s any/0 \

    --dport 113 REJECT --reject-with-tcp-reset

    ```


    # PLAYING AROUND WITH TTL VALUES


    This next example requires the TTL patch from patch-o-matic, which you can find
    at www.netfilter.org. This patch allows you to manipulate the TTL response values
    of your packets. This patch can be useful in doing things such as hiding your
    firewall from tracer-outes or hiding the fact that you have hosts behind your
    firewall. For instance, to confuse classic traceroute by adding 1 to TTL on the
    standard traceroute ports 333434-33542, you would use this following:


    ```

    iptables -t mangle -A PREROUTING -p UDP \

    --dport 33434:33542 -j TTL --ttl-inc 1

    ```


    To briefly digress on the topic of fooling traceroute, there is also a user space
    program called countertrace that create elaborate responses to traceroutes based
    on user defined configurations. The author''s website says, countertrace is a
    userland, iptables QUEUE target handler for Linux 2.4 kernels running netfilter,
    which attempts to give the illusion that there are multiple, imaginary IP hops
    between itself and the rest of the world. The imaginary hops that countertrace
    projects also have the ability to introduce accumulative, imaginary latency.


    The URL for countertrace is http://michael.toren.net/code/countertrace/


    README.'
  merge: -1
