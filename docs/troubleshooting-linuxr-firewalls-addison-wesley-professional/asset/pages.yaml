  md: '# CHAPTER 10 TESTING YOUR FIREWALL RULES (FOR SECURITY)


    # NOTE


    A useful addition to this is the netstat -pan command, which will show you the
    process name associated with each port.


    # TESTING YOUR FIREWALL WITH FRAGOUTER


    As mentioned earlier, fragmentation attacks are a great way to beat packet filtering
    firewalls. It''s not normally an issue with iptables/netfilter; however, it can
    happen in certain conditions. And if you ever needed to assess the firewall capabilities
    of a piece of network gear in conjunction with your Linux fighters, this is a
    great method to do it. To test your firewall(s) using fragrouter, you will need
    two systems in addition to your firewall/packet filter. This is because fragrouter
    cannot design by be run on the same system from which you''re testing (according
    to the documentation, it is to prevent abuse). In this example, we have three
    systems. The firewall, our scanner box called Host-A, the iplog machine called
    Host-B, and the fragrouter system called Host-C.


    ![](img/9e2290071e555156f9bb68f2189d9345_213_0.png)


    Figure 10.3 Testing packet filters with fragrouter.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'We''ll assume you''ve already set up Host-A and Host-B as outlined here. Our
    Host-C system is an aged Redhat 7.2 system, and while this OS has End-Of-Lived
    (EOL) by Redhat, security updates are still available from the FedoraLegacy.org
    project for at least another year and a half after the EOL date (at least). So
    it''s a safe, supported OS that should not expose you to any additional unreasonable
    risk from using it in a testing environment. That long-winding startup aside,
    you''ll need to install fragrouter on the system (which incidentally, we have
    only run on older Redhat systems, which is why we brought this all up!)


    On Host-A: Set the default route to Host-B using Host-C as the gateway:


    ```

    [root@Host-A root]# route add host Host-B gateway Host-B

    ```


    On Host-C: Install and start fragrouter:


    ```

    [root@Host-C root]# fragrouter -F1

    fragrouter: frag-1 started

    ```


    On Host-A, start your TCP connections, nmap attacks, and so on and watch the output
    on Host-B''s iplog traffic. Additionally, return traffic from Host-A will not
    pass through fragrouter, which is handy if you are testing more advanced things
    such as combining your firewall with an IDS. In general, the output you''re going
    to see on Host-B will be the same as the nonfragment tests. In fact, you can perform
    fragmentation tests using nmap with the -f flag. However, what''s nice about fragrouter
    is that you''re able to test any application you in a fragmented state (web, NFS,
    mail, and so on). When it comes to demonstrating what the risk is from fragmentation
    attacks, this is a fantastic way to do it.


    In closing, the scope of this test is specifically to verify that rules you know
    are in place and are not susceptible to fragmentation attacks. For example, you''ve
    already verified that outbound rules are working with your firewalls, and you''re
    testing their ability to deal with complex packet fragmentation (or you just want
    to see if your packet filtering on the switch/router actually works!)


    # VLANs


    VLANs are virtual LAN environments created logically (as opposed to physically)
    in network switching equipment. They are very common in modern networks and absolutely
    fantastic way to improve quality of service in a big network. However, a VLAN'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'is no substitute for physical separation between firewalled networks. This
    is due to the fact that there are all sorts of different methods available to
    defeat the compartmentalization of a VLAN or switched network. One such tool is
    called sniff (http://www.monkey.org/~dugsong/dsniff/), and we have used it many
    times to demonstrate how Layer 2 compartmentalization is not appropriate for firewall
    environments.


    For example, we were performing a vulnerability assessment on a very large banking
    client. They had, by far, the most fantastic, heavily compartmentalized, paranoid
    wire diagram we had ever seen: multiple layers of firewalls, NIDS (network-based
    intrusion detection), and HIDS (host-based intrusion detection) all over the place,
    which looked absolutely fantastic on paper. However, what they failed to recognize
    was that the “compartmentalization” was really logical. The entire five-layer
    (no joke—dual-connected firewalls protecting 20 systems) system was really two
    switches. We broke into their edge router, which was connected to the management
    network (also logical) and from proceeded to spoof our way onto every VLAN, bypassing
    all five layers of firewalls. I doubt a single one of our packets ever touched
    them. NIDS, of course, rarely detect the symptoms of such an attack, and the HIDS...well,
    they all logged to the management system—which was the first system we were able
    to compromise.


    As for How To on how we did all of this...well, you''ll have to wait for our next
    book!


    # SUMMARY


    To repeat a theme, just installing a firewall is not going to secure your network.
    The firewall rules, the placement of networks, and the physical infrastructure
    are all components in building an effective security model—along with other elements
    of security and risk management discussed throughout this book. If there is any
    theme you should take from this chapter, it is that you should always test everything
    rigorously whenever you make a change. Challenge your assumptions and whenever
    possible, use third parties to review your work!'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Layer 2/Inline Filtering


    In addition to Layer 3 (IP), and Layer 4 (TCP/UDP) filtering capabilities as described
    in preceding chapters, iptables/netfilter also has the capacity to filter traffic
    at Layer 2. This is an especially useful mechanism in environments where you are
    attempting to build an inline transparent firewall, in the case of an IDS you
    would like to make capable of responding to attacks, performing filtering in a
    bridging environment, or adding in MAC address filter rules when dealing with
    wireless networks.


    Bridging, simply put, is a method of two or more separate Ethernet networks together.
    From the perspective of the users on either side of the bridge, they are on the
    same network. This is because bridging happens at Layer 2 of the OSI model, which
    is the layer before IP (Internet Protocol). Because of this, firewalling in Layer
    2 is considered "transparent" because no IP addresses are involved.


    A transparent firewall is basically implementing a firewall inside of a bridge.
    The advantage of this is that it is a low-impact network topology change. If you
    have ever attempted to make topology changes in a large bureaucratic business
    or government agency, we are sure you can relate to the pain these changes cause.
    A transparent firewall is by its nature invisible—the fact that it''s Linux-based
    means that it is low cost and can run on Legacy hardware. If you were ever looking
    for an ideal way to use Linux firewalls in a large enterprise, this is it. You
    can build them out of old gear you have lying around and deploy them throughout
    your network without having to change settings on other devices (routers, gateways,
    and so on). Best of all, your users will never even notice that they have been
    installed.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'Figure 11.1 shows a 10.0.0.0/8 RFC1918 network running off of two separate
    switches. In this configuration, from the user’s perspective on the 10.10.10.0/8
    network and the 10.10.11.0/8 network, they are on the same network.


    ![](img/9e2290071e555156f9bb68f2189d9345_217_0.png)


    This is our router, configured as the gateway for the 10.10.10.0/24 network. Its
    IP address is 10.10.10.1


