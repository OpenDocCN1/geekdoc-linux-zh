  md: '# Troubleshooting Methodology


    It''s important to use a systematic approach to solving firewall problems, much
    in the same manner that a systematic approach to risk management or network engineering
    is helpful when building a firewall. When troubleshooting, this is especially
    important in dealing with the increasingly complex world of networking and computing
    technologies we are required to support today. If you don''t rely on a logical
    method of isolating root causes and eliminating root variables, you can find yourself
    wasting significant amounts of time repeating the same steps in your effort to
    resolve a troublesome issue, or you might even make the problem worse. The use
    of it is further exacerbated by the increased dependency on networks over the
    years to perform critical tasks, which has increased the need to resolve problems
    with those networks quickly. Down time is tolerated less and less, and firewalls
    tend to be choke points of failure in many networks. Firewall outages tend to
    have significant effects on an organization''s operations.


    In the heat of the moment and under pressure to make things happen quickly, it''s
    very easy to make waters worse. Having a good problem-solving process can help
    you to "take a breath" and pull yourself out of the emotions of the moment to
    think about the problem more rationally. Problem-solving methodologies are also
    used in other fields, such as in emergency medicine and military combat operations,
    so you can see that its use is not merely an academic approach for paper only;
    it''s in some truly high stress fields when seconds really count. If it works
    for them, it can work for you.


    As we begin, we would like to point out that we did not create the problem-solving
    process we present in this book. Instead, we have adapted problem-solving methods
    that we were exposed to in the past, such as Cisco System''s troubleshooting methodology,
    the U.S. Army''s Problem Solving Methodology from FM 22-100, and others.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'In our experience, when you become accustomed to using the process, you will
    forget that you are even doing it, but it takes place. The best time to use it
    is when the chips are down and you are up against a tight deadline. There is a
    saying in the military, "Train as you will fight because you will fight as trained."
    The point of this phrase is that you don''t want to do things differently when
    you are learning as opposed to when you are doing for real. When the pressure
    is on, it''s typical to fall back on your training, so push yourself to be actively
    methodical and systematic in your approach. If you do, you will operate that way
    instinctively and won''t have to think about it in the pressure of the moment.
    In short, it will come naturally to you.


    Even if you don''t make this approach a regular part of your troubleshooting,
    we have found this approach to be extremely helpful when working on particularly
    troublesome issues when you have more time. And lastly, if you are pressed for
    time, always check the documentation for your products first because your problem
    may be a common one, and the solution might be simply documented therein. To that
    end, we have included some of the more commonly reported problems users have encountered
    with Linux firewalls in Section 3 of this book, which we hope will directly cover
    a problem you are encountering.


    For all other cases where the solution is either not well documented, not clear
    what the problem is, or simply doesn''t work, it is helpful to use the methodical
    approach we outline here to troubleshoot your problem.


    # PROBLEM SOLVING METHODOLOGY


    +    Recognize, Define, and Isolate the Problem


    +   * What is the problem?

    * Isolate the problem.

    * What is the scope of the problem?

    * Can you duplicate the problem? This is a critical step; if you cannot cause
    the problem to occur again, you will not be able to test your solution.

    * Prioritize the problem(s). Is this something you have to fix right now?

    * If it''s a particularly difficult, boring, or unpleasant problem to solve, try
    the "ten minute plan." Just tell yourself you''ll work on it for ten minutes.
    For most people, after they start working on a task, even an unpleasant one, they
    will commit to it. It''s getting started that is the chore, not continuing to
    work on it.'
