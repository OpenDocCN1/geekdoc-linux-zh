  md: '# TCP Connections Are Closed


    TCP is as equally methodical about closing connections as it is about creating
    them. TCP sessions can be closed in two ways. The first is very similar to the
    way in which a connection is established, via a four-way handshake referred to
    as a “close”. The second method is called a TCP abort and uses a special packet
    flag to set the reset, or RST flag.


    A close request using the four-way handshake method starts with the party that
    wants to close the connection by resending a FIN+ACK packet to the other party.
    This is the most graceful manner of closing a session and does not represent any
    sort of error state on the requester’s end. We point out that because a TCP abort,
    the second method, is normally invoked when one of the parties encounters an error
    and wishes to close the connection in an error state. We have seen some vendors
    use the RST method a little too prodigiously, which causes some high level applications
    that depend on this “niceness” to infer an error state from the state of the connection;
    if if the close method is used, they infer, right in fact, that something went
    wrong. One fascinating example of this occurs with some high-level applications
    that look for an error state from the TCP connect call, and when a TCP abort occurs,
    the web application assumes the entire HTTP connection failed and will simply
    retry the connection again. We found this problem at one large customer of ours.
    They had an XML/HTTP application designed to send messages to another host running
    a web server. The client would send the data via an HTTP POST, the server would
    acknowledge the successful receipt of the data up at Layer 7, and meanwhile down
    at Layer 3, a low balancing switch killed the session part through the close process
    with an RST packet. The client inferred, incorrectly, that the server had not
    receive the data correctly. Technically speaking, this was one correct manner
    of interpreting the TCP abort call.


    Regardless, our client’s application assumed it needed to resend all the data
    because all back from the server saying that it successfully received the data
    was discarded due to an error state created by the TCP abort call. In fairness,
    the program on the client could have been better written to take these exceptions
    into account, by simply looking at the HTTP data and ignoring the TCP error state.
    Nevertheless, the problem was so low in the OSI model that our customer spent
    months trying to figure out why their application randomly attempting to resend
    the same messages over and over again when the server had acknowledged them already.


    # TCP CLOSE


    The CLOSE is accomplished, as we have already discussed, via a four-way handshake.
    Unlike establishing a connection, to close a session, both hosts must agree to
    the request.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'One host cannot arbitrarily close the connection via this method. The process
    starts with the party that wishes to close the connection sending a FIN+ACK packet.
    The other host, if it agrees to close the session, sends back a FIN+ACK packet.
    The other host must also send its own FIN packet to the first host, which must
    also send a FIN+ACK packet. The process is basically a complete mirror on both
    ends. This is done so that both sides can empty their buffers of any remaining
    data. Until the final FIN is sent, data can still flow from the party that did
    not initiate the CLOSE request. This means that connection can be half closed,
    meaning that one side has stopped sending data and is waiting for the other side
    to stop—while the other side is still sending data.


    # TCP ABORT


    A TCP ABORT, or RST packet, is sent normally when data has been lost due to an
    unrecoverable error. This method of closing a TCP session can be used arbitrarily
    to shut a connection down. Both hosts do not have to agree to close the session.


    ![](img/9e2290071e555156f9bb68f2189d9345_100_0.png)


    Figure 5.6 Three-way teardown.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# CHAPTER 5 THE OSI MODEL: START FROM THE BEGINNING


    There is much more to TCP than we have covered here, so don''t consider this complete
    explanation. For instance, we haven''t covered the scenario of TCP windows or
    the various methods used to recover from packet loss. Other books cover those
    issues in wonderful detail: our objective is to briefly cover those aspects of
    TCP that are most important to troubleshooting firewalls. We will also assume,
    in later portions of the book, that the reader has a in-depth understanding of
    TCP if the subject matter requires it. Where this assumption excites, we will
    point the reader to other books on the subject.


    # UNDERSTANDING UDP


    User Data Protocol (UDP) is the other “big” protocol used on the Internet. Unlike
    TCP, it is entirely connectionless, like TCP, it''s also a transport layer protocol
    (Layer 4) and is part of the Internet Protocol. Also unlike TCP, UDP has no inherent
    flow control, error recovery, or reliability capabilities. If a UDP packet is
    lost, the receiving host has no way of knowing or reporting this as part of the
    native functionality of UDP. Because of this, some applications that use UDP implemented
    their own internal functions to compensate. This is not to say that UDP is bad
    protocol—far from it. Sometimes a developer does not need the additional functionality
    of TCP, or the flow control characteristics of TCP may cause problems such as
    with VPNs. There are advantages to UDP because of its simpler design, as already
    indicated, but another is that UDP packets tend to be smaller, they will use less
    bandwidth. This can be necessary for protocols that consume large amounts of bandwidth,
    such as file transfer protocols, VPNs, or voice-over IP.


    UDP packets contain five fields, the first four of which are the UDP header. The
    header is made up the the following fields: source and destination ports, length,
    and checksum. The body of the message, also known as its data or payload field,
    contains the actual message or data being sent via the UDP protocol. The checksum
    field is optional and can be used to provide some integrity check on the UDP header
    and data fields, but is not required.


    | Source Port | Destination Port |

    |---|---|

    | Length | Checksum |

    | Data (Payload) |


    Figure 5.7 The UDP packet.'
