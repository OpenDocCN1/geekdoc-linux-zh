  md: '# OVER RELIANCE ON PATCHING


    With all the talk about patching and the importance of doing it regularly, we
    must caution that patching is not going to be a silver bullet either. Not only
    is it likely that your system will still have numerous security vulnerabilities
    in it that you will need to patch in the future, but also the programs you are
    using could have fundamental flaws in them that do not properly guard against
    the risks you wish to manage. For instance, if you are concerned with protecting
    the confidentiality of your e-mails, patching your e-mail clients is unlikely
    to accomplish without some additional security measures, such as encrypting your
    e-mail. In short, just that the software is bug free and working properly does
    not mean that using it is risk free.


    As already alluded to in earlier chapters, there are now examples of previously
    unknown vulnerabilities being discovered in widely used software by the "bad guys,"
    months before the good guys, as you gentle reader, and vendors find out. For instance,
    very high profile sites in rsync were broken into in early 2004 due to an undiscovered
    flaw the only people who were likely patched against that flaw were the crackers
    that discovered the flaw and kept it to themselves! Just because a flaw is not
    known to exist in means does not mean that the flaw does not exist. As Carl Sagan
    said, "absence of evidence is not evidence of absence." It''s always wise to assume
    that when you patch you are only doing the bare minimum necessary to secure your
    system. It''s just par for the course to patch.


    # TURNING OFF SERVICES


    You have likely heard this one as well. If you don''t need a service, turn it
    off. We have to add one thing to that—if you cannot prove that you need the service,
    turn it off. Many of the customers we have worked with insisted that they needed
    a service, or at least thought that they did. They assumed that they needed the
    server. After all, it was on, so it must be necessary. A lot of services are turned
    on by default on many products that are not necessary to most users. If you''re
    not sure you need a service, turn it off. If it doesn''t break anything, then
    you don''t need it. We can''t think of a better way to learn about a service than
    turning it off. If no one complains about it being off, you can file it away as
    a service to learn about when you have free time and focus your efforts on the
    services that your users need. In doubt, turn it off.'
  merge: -1
  pgno: 63
