- img_proc: true
  md: '9. If you can, use a hardened kernel such as grsecurity, openwall, SELinux,
    LIDS, and other patches.


    10. Test your system''s security and improve.


    Keep in mind that these are general concepts, so if you have a better means of
    accomplishing these goals, stick with what works for you. Security is a complicated
    process, and people seem to have their own specific methods that work for them.


    # THE IMPORTANCE OF KEEPING YOUR SOFTWARE UP TO DATE


    If you haven''t already picked up on the importance of keeping your system properly
    patched and up to date from all the stories constantly in the media and on mailing
    lists, then let us join the chorus. You must get into the habit of monitoring
    the latest patch releases from your vendors, and you must keep up to date with
    the various security lists for your products. There is a continuous daily deluge
    of new vulnerabilities being discovered, which might affect you. If you want to
    keep the probability of intrusion down, then you really need to make this a top
    priority in your Information Technology plan. As we already stated, computer patches,
    hardware, and software are created by people, and people are not perfect creatures.
    They make buggy software, and they keep making buggy software, revision after
    revision. Hardware is no different. It is critical that you install vendor security
    patches, new security flash updates for your hardware, and other them as quickly
    as you can after they come. In some cases we recommend installing them the day
    they are released. This isn''t always practical, so you will have to weigh the
    risks associated with each new software change in your enterprise against vulnerabilities,
    if those vulnerabilities are exposed in your enterprise, the problems they fix,
    and if they introduce any new problems.


    The bad news is that by the time your peers show you a patch comes out, the bad
    guys are definitely on their way to writing an exploit for it that will be crawling
    around the Internet within days, not hours. In some cases, the patch might fix
    a vulnerability that the bad guys found out before the good guys did, and are
    already exploiting it. Every day the world of safety between a patch is released
    and when it starts to become actively exploited shrinks, and as stated, sometimes
    that gap does not exist at all. There are several security approaches that seek
    to address this “zero day” problem—that is, the notion that you have no time to
    keep your systems up to date and the assumption that your systems have additional,
    as yet undiscovered vulnerabilities. We will touch on some technologies available
    to Linux that can assist in this area. One of these is the new SELinux extensions
    in the 2.6 kernel. SELinux gives you the ability to'
