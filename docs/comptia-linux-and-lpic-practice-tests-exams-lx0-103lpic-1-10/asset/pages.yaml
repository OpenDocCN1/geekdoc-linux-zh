  md: '# Introduction


    CompTIA Linux+ and LPIC Practice Tests is a companion volume to the CompTIA Linux+
    Study Guide. This book helps you to prepare for the certification exams by testing
    your knowledge of the concepts and terminology being used on the exam. Within
    the book are 1,201 questions, answers, and explanations covering the range of
    topics necessary for the exams.


    Each of the chapters within the book contains questions specific to a section
    of the exam. There are also four longer practice exams that encompass questions
    from a given domain. This book is intended to be used in conjunction with the
    corresponding certification-related books, and it can be used to find areas that
    you may need to emphasize for further study.


    # Linux+ Certification


    CompTIA certifications are notable for the added benefits that can be found by
    certificate holders. Linux+ certification is a way to prove that you possess the
    knowledge necessary to perform job-related duties for Linux administration. It
    helps to prepare for the things you''ll need to do with a Linux server. Included
    among the areas tested are installation, compiling and installing server software,
    and security. These topics are vital to the everyday job of a Linux administrator.


    Importantly, the certification exams are not tied to a particular distribution
    but rather to the broad Linux ecosystem. This better prepares you for the variety
    of Linux flavors that you''ll encounter at a given employer or job.


    # How This Book Is Organized


    This book consists of two sections, each based on one of the exams involved in
    the Linux+ and LPIC certification series. The book has a chapter dedicated to
    each of the relevant domains. At the end of the book, there are four longer practice
    exams corresponding to a given set of domains.


    Each chapter begins with a list of the objective domains covered in that chapter.
    While the questions themselves draw from those objectives, you can expect to draw
    on other knowledge relevant to being a Linux administrator.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    The review questions and final review tests included in this book are not derived
    from the actual Linux+ exam questions. They serve to provide exposure to the underlying
    content and to deliver a comparable testing vehicle for you to prepare for the
    exam. It will not be a useful exercise to memorize the answers to these questions
    and assume that doing so will enable you to pass the exam. The underlying subject
    matter is the important focus of your studies so that you will be able to pass
    the exam.


    Congratulations on the decision to demonstrate your Linux administration skills
    with this certification.


    # How to Use This Book and the Interactive Online Learning Environment and Test
    Bank


    This book includes 1200 practice test questions, which will help you get ready
    to pass the Linux+ and LPIC exams. The interactive online learning environment
    that accompanies the CompTIA Linux+ and LPIC Practice Tests provides a robust
    test bank to help you prepare for the certification exams and increase your chances
    of passing them the first time! By using this test bank, you can identify weak
    areas up front and then develop a solid studying strategy using each of these
    robust testing features.


    The test bank also offers four practice exams. Take these practice exams just
    as if you were taking the actual exam (without any reference material). When you''ve
    finished the first exam, move on to the next one to solidify your test-taking
    skills. If you get more than 90 percent of the answers correct, you''re ready
    to take the certification exams.


    The Syex Interactive Online Test Bank can be accessed at http://www.wiley.com/Sybextestprep.'
  merge: -1
