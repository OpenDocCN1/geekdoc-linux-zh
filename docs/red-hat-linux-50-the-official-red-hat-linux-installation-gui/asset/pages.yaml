  md: '# 6


    # # Post Installation Configuration


    After installation your system is fully functional, but you may still want to
    do some additional configuration. This chapter describes some of the various system
    configuration tasks you may need to do.


    # ## 6.1 Building a Custom Kernel


    With the introduction of modularization in the Linux 2.0.x kernel there have been
    some significant changes in building customized kernels. In the past you were
    required to compile support into your kernel if you wanted to access a particular
    hardware or filesystem component. For some hardware configurations the size of
    the kernel could quickly reach a critical level. To require ready support for
    items that were only occasionally used was an inefficient use of system resources.
    With the capabilities of the 2.0.x kernel, if there are certain hardware components
    or filesystems that are used infrequently, driver modules for them can be loaded
    on demand. For information on handling kernel see Chapter 9, Section 9.6.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 6.1.1 Building a modularized kernel


    Only Red Hat Linux/Intel and Red Hat Linux/SPARC support modular kernels, Red
    Hat Linux/Alpha users must build a monolithic kernel (see Section 6.1.3 below).


    These instructions provide you with the knowledge required to take advantage of
    the power and flexibility available through kernel modularization. If you do not
    wish to take advantage of modularization, please see Section 6.1.3 for an explanation
    of the different aspects of building and installing a monolithic kernel. It is
    assumed that you have already installed the kernel-headers and kernel-source packages
    and you issue all commands from the /usr/src/linux/directory.


    It is important to begin a kernel with the source tree in a known condition. Therefore,
    it is recommended that you begin with the command make proper. This will remove
    any configuration files along with the remains of any previous builds that may
    be scattered around the source tree. You must create a configuration file that
    will determine which components to include in your new kernel. Depending upon
    your hardware and personal preferences there are three methods to configure the
    kernel.


    +   * make An interactive text program. Components are presented and you answer
    with Y (yes), N (no), or M (module).

    * make menuconfig A graphic, menu driven program. Components are presented in
    a menu of categories, you select the desired components in the same manner used
    in the Red Hat Linux installation program. Toggle the tag corresponding to the
    item you included; Y (yes), N (no), or M (module).

    * make xconfig An Windows program. Components are listed in different levels of
    menus, components are selected using a mouse. Again, select Y (yes), N (no), or
    M (module).


