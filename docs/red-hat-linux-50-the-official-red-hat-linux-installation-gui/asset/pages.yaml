    sent from your system to your system will be sent to the machine you are masquerading
    as. For example, in the above illustration, log files are periodically sent to
    root@poodle.redhat.com by the cron daemon would be sent to root@mail.redhat.com.


    #  6.6 Controlling Access to Services


    As a security measure, most network services are managed by a protective guard
    called a TCP wrapper. The protected services are listed in /etc/inetd.conf that
    specify /usr/sbin/tcpd. tcpd can allow or deny access to a service based on the
    origin of the request, and the configuration in /etc/hosts.allow and /etc/hosts.deny.
    By default Red Hat Linux allows all service requests. To disable or limit services
    you can edit /etc/hosts.allow file. Here is an example /etc/hosts.allow file:


    ```

    ALL: redhat.com .redhat.com

    in.talkd: ALL

    in.ntalkd: ALL

    in.fingerd: ALL

    in.ftptpd: ALL

    ```


    This configuration allows all connections from redhat.com and *.redhat.com machines.
    It also allows talk, finger, and ftp requests from all machines.


    tcpd allows much more sophisticated access control, using a combination of /etc/hosts.allowand
    /etc/hosts.deny. Read the tcpd(8) and hosts.access(5) man pages for complete details.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 6.7 Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the anon-ftp
    rpm package (which you may have already done at install time). Once it is installed,
    anonymous FTP will be up and running.


    There are a few files you might wish to edit for your FTP server.


    +   /etc/ftpass This file defines most of the access control for your FTP server.
    Some of the things that you can do: set logical "groups" to control access from
    different sites, limit the number of simultaneous FTP connections, configure transfer
    logging, and much more. Read the ftpass man page for complete details.


    +   /etc/ftthosts The ftthosts file is used to allow or deny access to certain
    accounts from various hosts. Read the ftthosts man page for details.


    +   /etc/ftpusers This file lists all the users that are not allowed to ftp into
    your machine. For example, root is listed in /etc/ftpusers by default. That means
    that you cannot ftp to your machine and log in as root. This is a good security
    measure, but some administrators prefer to remove root from this file.


    # 6.8 World Wide Web


    The world wide web is one of the hottest aspects of the Internet today. Red Hat
    Linux lets you get in the action on the two ways – as a web browser, and as a
    web server. Let''s look at both.


    # 6.8.1 World Wide Web Browsers


    A variety of web browsers are available for Linux, including freely distributable
    browsers such as arena, lynx, and grail. The most popular commercial browsers
    are those from Netscape Communications Corporation. It is available for evaluation
    and non-commerical from their ftp site:


    ```

    http://www.netscape.com/download/client_download.html

    ```


    It is also available in two fully licensed versions directly from Netscape.'
