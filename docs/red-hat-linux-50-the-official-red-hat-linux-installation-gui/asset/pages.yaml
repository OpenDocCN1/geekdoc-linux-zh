- pgno: 323
  md: '# # redhat 5.0 LINUX OPERATING SYSTEM


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_323_0.png)


    The Complete Red Hat Linux Operating System is a POSIX based system that can be
    used as a UNIX workstation ranging from internet servers to reliable workload
    computing.


    # ## Installation Guide


    From initial insertion of your boot floppy to completion of post-installation
    configuration, the Red Hat Installation Guide is the "Official" manual for installing
    the Red Hat Linux you bought. The Guide''s step-by-step approach takes you through
    preparing for the initial install, getting the installation program booted, and
    handling any post-installation issues. Add information about your hardware subjects
    (including Alpha and SPARC Instations) and you''re ready to go, whether you''ve
    bought Red Hat Linux or downloaded it from the net.


    # ## Internet Server


    Right out of the box, Red Hat Linux can provide internet services, including web,
    email, news, DNS, and more, for multiple sites, with remarkable ease. With RPM
    (the Red Hat Package Manager) you can keep your system up to date with the latest
    security releases and install new software with a single command. RPM can help
    secure your system by keeping it up to date with vulnerabilities.


    # ## Award Winning Operating System


    Chosen by InfoWorld as the Desktop Operating System 1996 Product of the Year,
    and by Z-Davis as a finalist for the 1997 European Software Award in the Enterprise
    Desktop category, the Red Hat Linux Operating System continues to widen its lead
    over alternative OS''s for users needing a reliable, secure, and high performance
    computer environment on desktop and server PCs.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_323_1.png)


    # ## Desktop Environment


    With Red Hat Linux 5.0, you gain the freedom to manage your desktops. Choose from
    multiple window managers. Get on the net, build some programs, and format floppy
    (all at once time) and enjoy an extremely stable operating system that multi-tasks
    more smoothly than other OS''s. Running Red Hat Linux are able to run continuously
    for months on end.


    # ## Red Hat Configuration and Hardware


    # ## Learning Platform


    With source code (except for commercial apps), what could be better learning platform?
    Learn how an operating system works from the ground up. Red Hat Linux comes with
    plenty of programming languages (python, perl, Tc/Tk), tools for math and engineering
    applications (spice, Gnuplot, etc.). The included Apache server provides a platform
    for learning programming and HTML ordering.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_323_2.png)


