- pgno: 260
  md: '# E.7 Running the Flash Management Utility


    Note that on systems environment variables may be stored and where is more than
    one flash block (for example, the AlphaPC64) the flash management utility will
    look for a block to hold MILO''s environment variables. If such a block already
    exists, the flash management utility will tell you where it is. Otherwise, you
    must use the environment command to set a block and initialise it. In the above
    above example, flash block 12 contains MILO''s environment variables.


    # E.7.1 The "help" command


    ```

    FMU help

    FMU command summary:

    nlist - List the contents of flash

    program - program an image to flash

    quit - Quit

    environment - Set which block should contain the environment \

    nbootopt num - Select firmware type to use on next power up

    help - Print this help text

    FMU>

    ```


    Note that the environment and bootopt commands are only available on the EB66+,
    the AlphaPC64, EB164 and PC164 systems (and their clones).


    # E.7.2 The "list" command


    The "list" command shows the current usage of the flash memory. Where there is
    more than one flash block, the usage of each flash block is shown. In the example
    below you can see that Windows NT ARC is using blocks 4-7 and 15.


    ```

    FMU list

    Flash blocks: 0:DBM 1:DBM 2:DBM 3:WNT 4:WNT 5:WNT 6:WNT

    7:WNT 8:MILO 9:MILO 10:MILO 11:MILO 12:MILO 13:U 14:U

    15:WNT

    Listing images

    Flash image starting at block: 0

    Firmware Image Id: 0 (Alpha Evaluation Board Debug Monitor)

    Image size is 19148 bytes (3 blocks)

    Executing at 0x300000

    ```'
  merge: -1
