    # Extensions


    Extensions are configured in the /usr/lib/X11/Metro/Extensions file. Most extensions
    are dynamically loaded; that is, if they are needed they are loaded automatically
    without any additional manual configuration. An extension that is "ON" is loaded
    at server startup and never unloaded. An extension that is "DYN" is dynamically
    loaded on request by an X client XQueryExtension call. These extensions display
    with XListExtensions or xdpyinfo. An extension that is "OFF" can not be used,
    nor is it displayed with XListExtensions or xdpyinfo.


    # Special Notes


    +   - Multi-Buffering and DOUBLE-BUFFER cannot be dynamically loaded. They must
    be set to "ON" or "OFF".


    +   - GLX (OpenGL) can be dynamically loaded, however GLX depends on DOUBLE-BUFFER
    being "ON". Therefore, to use GLX, set DOUBLE-BUFFER to "ON" and GLX to "DYN".


    +   - X3D-PEX (PEX) can be dynamically loaded, however X3D-PEX depends on Multi-Buffering
    being "ON". Therefore, to use X3D-PEX, set Multi-Buffering to "ON" and X3D-PEX
    to "DYN".'
  merge: -1
  img_proc: true
