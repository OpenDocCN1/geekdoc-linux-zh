- pgno: 196
  md: '# 11.6 Rescue Modes


    # 11.5.2 Init Runlevels


    Generally, Red Hat Linux runs in run level 3—full multiuser mode. The following
    runlevels are used in Red Hat Linux:


    +   0 Halt.

    1 Single user mode.

    2 Multiuser mode, without NFS.

    3 Full multiuser mode.

    4 Reboot.


    If your machine gets into a state where it will not boot due to a bad /etc/inittab,
    or will not let you in because you have a corrupted /etc/passwd or have simply
    forgotten your password, boot into single user mode by typing linux 1 at the LILO
    boot prompt. A very bare system will come up and you will be given a shell from
    which you can fix things.


    # 11.5.3 Shutting Down


    To shut down Red Hat Linux, issue the shutdown command. You can read the shutdown
    man page for complete details, the two most common usages are:


    ```

    shutdown -h now

    shutdown -r now

    ```


    Each will cleanly shutdown the system. After shutting everything down, the first
    will halt the machine, and the second will reboot.


    Do not run the reboot or halt commands directly in order to prevent damage to
    your filesystem.


    # 11.6 Rescue Modes


    When things go wrong, there are several ways to work on fixing them. However,
    they require that you understand the system well. This manual can''t teach you
    what to do, but we will present the ways that you can use our products to get
    into rescue modes where you can use your own knowledge to rescue the system.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 11.6.1 Through LILO


    If your system boots, but does not allow you to log in it when it has completed
    booting, you can use the single or emergency boot option. At the LILO boot: prompt,
    type linux single in order to boot in single-user mode. your local filesystems
    will be mounted, but your network will not be activated. In emergency mode, almost
    nothing will be set up. Only the root filesystem will be mounted, and it will
    be mounted read-only.


    # 11.6.2 Emergency Boot Diskettes


    The installation diskette can also be used as a rescue disk set. When you boot
    the diskette, type rescue at the boot prompt (on non-Intel platforms, add rescue
    as an option to the kernel that you are booting, for example, linux rescue), and
    the install process will ask a few questions, request that you insert the second
    disk, and set up shells on VC1 and VC2. The shell that is running is ash, a minimal
    bourne with no history or command-line editing.


    The PATH environment variable is set so that once you have mounted your root partition
    on /mnt, binaries from your root partition will be run if they do not exist on
    the diskette. Also, the libraries in /mnt/lib and /mnt/usr/lib will be used if
    needed. You may wish to change your PATH to not include /bin and /usr/bin, leaving
    /mnt/bin, /mnt/usr/bin, etc., while you are working on repairing your system.
    If you do that, you will need to use /bin/mnt to unmount /mnt.


    Limited versions of important utilities are available before you mount /mnt:


    mount The command does not require that the device node being already exist, and
    doesn''t require the full name of the device. It assumes ext2 systems unless otherwise.


    ```

    mount /dev/sda1 /mnt -t ext2

    ```


    is functionally equivalent to


    ```

    mount sda1 /mnt

    ```


    ash The full version


    cat Does not accept any options'
  merge: -1
