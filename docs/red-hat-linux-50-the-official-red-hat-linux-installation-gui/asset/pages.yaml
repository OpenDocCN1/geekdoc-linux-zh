- pgno: 53
  md: '# 3.1.1 Using the Keyboard to Navigate


    +   - Windows

    - Buttons

    - Text regions (with or without scrollbars)

    - Check boxes

    - Text input boxes


    We point out these features as we encounter them in the installation. Note that,
    because the installation program must run on a wide variety of computers, the
    user interface is character-based. In addition, some computers may not have a
    mouse, so the installation program uses keystrokes for getting around.


    You can navigate around the installation dialogs using a simple set of keystrokes.
    In most dialog boxes there is a cursor or highlight which you can move using the
    arrow keys ← ↑ ↓. By using Tab or Alt Tab, you can cycle forward or backward through
    each widget on the screen. In addition, summaries of available function keys are
    presented at the bottom of each screen.


    To “press” a button, position the highlight over the button (using Tab, for instance)
    and press Space. To select an item from a list of items, move the highlight to
    the item you wish to select and press Enter. To select an item with a check box,
    move the highlight to the check box and press Space to select an item. To deselect,
    press Space a second time.


    Pressing F12 accepts the current values and proceeds to the next dialog; it is
    usually equivalent to pressing the OK button.


    **Please Note:** Unless a dialog box is waiting for your input, do not press any
    keys during the installation process – it may result in unpredictable behavior.


    # 3.1.2 A Note About Virtual Consoles


    There is more to the Red Hat Linux installation program than the dialog boxes
    it presents as it guides you through the installation process. In fact, the installation
    program makes several different kinds of diagnostic messages available to'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 3.2 Starting the Installation Program


    you, in addition to giving you a way to enter commands from a shell prompt. This
    presents this information on five virtual consoles which you can switch between
    using a single keystroke. These virtual consoles can be very helpful if you encounter
    a problem while installing Red Hat Linux. Messages displayed on the install or
    system consoles can help pinpoint the problem. Please see Figure 3.1 for a listing
    of the virtual consoles, the keystrokes to switch to, and their contents.


    | Console | Keystroke | Contents |

    |---|---|---|

    | 1 | Alt-F1 | installation dialog |

    | 2 | Alt-F2 | shell prompt |

    | 3 | Alt-F3 | install log (messages from install program) |

    | 4 | Alt-F4 | system log (messages from kernel, etc.) |

    | 5 | Alt-F5 | other messages |


    Figure 3.1: Virtual Console Information


    In general, there should be no reason to leave virtual console #1 unless you are
    attempting to diagnose installation problems. But if you are the curious type,
    free to look around.


    # 3.2 Starting the Installation Program


    Now it''s time to start installing Red Hat Linux. To start the installation, it
