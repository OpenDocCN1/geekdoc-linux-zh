  md: '# 22


    # Before You Begin


    People with SPARC should take a moment to read Appendix C on page 197. This appendix
    covers aspects of the installation process that differ from a typical Red Hat
    Linux/Intel installation.


    You can install or upgrade Red Hat Linux via any of several different methods.
    Each method works best in different situations, and has different requirements.
    But before we discuss each installation method, let''s take a look at an issue
    that may affect some of you.


    # 2.3.1 PCMIA Support During the Installation


    The PCMIA section is specific to Intel-based computers only


    Most Intel-based laptop computers support PCMIA (also known as PC Card). Computers
    that support PCMIA devices contain a controller having one or more slots in which
    a PCMIA device can be installed. These devices may be modems, LAN adapters, SCSI
    adapters, and so on.


    When installing Red Hat Linux/Intel on a PCMIA-capable computer, it is important
    to note if a PCMIA device will be used during installation. For example, if you
    want to install Red Hat Linux/Intel from a CD-ROM, and your CD-ROM drive is connected
    to a PCMIA adapter, the installation program will require PCMIA support. Likewise,
    if you are going to use one of the network-based installation methods, you will
    need PCMIA support if your network adapter is PCMIA.


    PCMIA support is dependent on two things:


    +   - The type of PCMIA controller in your computer system.


    +   - The type of PCMIA device that you wish to use during the installation.


    While every PCMIA controller and most popular PCMIA devices are supported, there
    are some exceptions. For more information, please consult the Red Hat Linux Hardware
    Compatibility List at http://www.redhat.com/hardware.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2.3 Installation Methods


    The main thing to keep in mind is that if you require PCMCIA support, you will
    need the supplemental diskette.


    | PCMCIA support is not available for the Alpha |


    | PCMCIA support is not available for the SPARC |


    # 2.3.2 Installing From a CD-ROM


    If you have a Red Hat Linux CD-ROM, and your computer has a supported CD-ROM drive,
    you should consider this installation method. Installing directly from CD-ROM
    is the most straightforward approach. When installing from CD-ROM, the packages
    you select are read from the CD-ROM, and are installed on your hard drive.


    # How To Do It


    As the name implies, you''ll need a Red Hat Linux CD-ROM, a supported CD-ROM drive,
    and a means of starting the installation program.


    Intel systems will need to use the boot diskette (and the supplemental diskette
    if PCMCIA support is required). There is an alternate method of installing from
    CD-ROM that uses no diskettes, but requires that the system be running DOS. We''ll
    discuss this approach (known as autoboot) in Chapter 3 on page 35. For now, note
    that PCMCIA support is not available when using autoboot.


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.4 on page 25.


    # 2.3.3 Installing From an FTP Site


    If you don''t have a Red Hat Linux CD-ROM or a CD-ROM drive, but you do have network
    access, then an FTP installation may be for you. When installing via FTP,'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'the Red Hat Linux packages you select are downloaded (using FTP) across the
    network to your computer, and are installed on your hard drive.


    # How To Do It


    When doing an FTP install, you''ll need LAN-based access to a network; a dialup
    connection via modem won''t cut it. If your Local Area Network has Internet access,
    you can use one of the many FTP sites that mirror Red Hat Linux. You can find
    a list of mirror sites at http://ftp.redhat.com/MIRRORS.


    If your LAN doesn''t have Internet access, all is not lost. If there is a computer
    on your LAN that can accept anonymous FTP requests, simply load Red Hat Linux
    on that system, and you''re ready to go.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_41_0.png)


    For an FTP installation, you must use both the boot and supplemental diskettes.
    You will need to have a valid nameserver configured or you must specify the IP
    address of the FTP server you will be using. You will also need the path to the
    Red Hat Linux directory on the FTP server.


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.4 on the facing page.


    # 2.3.4 Installing From an NFS Server


    If your system doesn''t have a CD-ROM drive, but you do have network access, then
    an NFS installation may be for for you. When installing via NFS, the Red Hat Linux
    packages you select are NFS-served to your computer from an NFS server system.
    The packages are then installed on your hard drive.


    # How To Do It


    If you wish to perform an NFS installation, you will need to mount the Red Hat
    CD-ROM on a machine that supports ISO-9660 file systems with Rock Ridge extensions.
    The machine must also support NFS. Export the CD-ROM file system via NFS. You
    will need to have a nameserver configured, or know the NFS server''s IP address,
    as well as the path to the exported CD-ROM.'
