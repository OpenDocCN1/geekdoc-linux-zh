    # Graphics Card Configuration


    Press Page Down to move to the second configuration screen, which controls the
    graphics card, the number of colors, the virtual resolution, and the physical
    resolution.


    Each graphics card configuration consists of five elements:


    +   - The graphics card (make and model)

    - The number of colors supported on screen simultaneously (color depth)

    - The virtual resolution of the screen (width x height)

    - The physical resolution of the screen (width x height)

    - The screen refresh rate (Hz).


    Non-interleaved modes give a better screen appearance than refresh rates which
    are labeled "Interlaced". highest refresh rate that your monitor supports will
    give the best image. At higher resolutions a higher refresh rate is particularly
    important to prevent the screen from visibly flickering. The highest refresh rate
    supported by the selected monitor is automatically displayed. Graphics Card'
  merge: -1
