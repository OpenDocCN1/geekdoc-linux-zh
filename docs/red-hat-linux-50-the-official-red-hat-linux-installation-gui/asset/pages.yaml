- pgno: 27
  md: 'The following rulesets have been added to the S98 (local additions) section
    of /etc/sendmail.cf:


    +   - junk

    - check.mail

    - check.rcpt

    - remove.local

    - junkIP

    - check_relay


    The actions of these rulesets are controlled by the following files in the /etc/mail
    directory:


    +   - ip.allow

    - name.allow

    - relay.allow

    - deny


    Let''s take a look at each of these files.


    ip.allow


    This is a flat text file that contains the addresses or networks of hosts that
    are allowed to use this host as a relay.


    The format for this file is:


    ```

    hhh.hhh.hhh

    ccc.ccc.ccc

    bbb.bbb

    aaa

    ```


    These lines represents a host address, a class C network, a class B network and
    a class A network, respectively.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 1.3 System Administration-Related Enhancements


    name.allow


    This is a flat text file that contains the hostnames or domain names of hosts
    that are allowed to use this host as a relay.


    The format for this file is:


    ```

    hostname.domain.com

    domain.com

    ```


    These lines represent a hostname and a domain name.


    **Please Note:** Hosts not ''included'' in either ip.allow or name.allow will
    be given an error message of "551: xxx, we do not relay" where xxx is the RCPT
    address that was given.


    relay.allow


    This is a flat text file that contains the hostnames, domain names, host addresses
    or networks for which this machine will relay to:


    The format for this file is:


    ```

    hostname.domain.com

    domain.com

    hhh.hhh.hhh.hhh

    ccc.ccc.ccc

    bbb.bbb

    aaa

    ```


    The formats in this file are the same as for the ip.allow and name.allow and relay.allow
    are plain text files, described earlier.


    **Please Note:** Since ip.allow, name.allow and relay.allow are plain text files,
    any changes to them will necessitate restarting sendmail. This can be accomplished
    by executing the followowin commands:


    ```

    /etc/rc.d/init.d/sendmail stop; /etc/rc.d/init.d/sendmail start.

    ```'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# New Features Of Red Hat Linux 5.0


    deny


    This is a flat text file that must be converted into a hash database file with
    makemap(8) before use. This file contains a set of email addresses, hostnames,
    domain names, host addresses, or network addresses seperated a tab from an error
    message.


    The format for this file is:


    ```

    user@domain.com<tab>error message 0

    hostname.domain.com<tab>error message 1

    domain.com<tab>error message 2

    hhh.hhh.hhh<tab>error message 1

    ccc.ccc.ccc<tab>error message 3

    bbb.<tab>error message 4

    aaa<tab>error message 5

    ```


    Each line represents the identification of a known spammer. When an email address
    is specified in this file, the error message provided will be returned to the
    spammer''s MTA. For the other formats, the corresponding error message will be
    logged to /var/log/maillog, and “550 Access denied” is returned to the spammer''s
    MTA.


    The following command can be used to create the hash database version of the file:

    makemap -v /etc/mail/deny < /etc/mail/deny


    The output from this command is the database file /etc/mail/deny.db.


