  md: '# 5.2.1 Configuring the Metro-X Server


    If you are installing from an Official Red Hat Linux/Intel CD, you may install
    one copy of MetroLink''s Metro-X server, a high-quality commercial X server for
    Linux. Please see the MetroLink license (paper copy) accompanying your Red Hat
    Linux CD for license information. If you choose to use Metro-X, the install program
    launches the Metro-X configuration utility config; please see Section 6.3 on page
    96 for more information on how to use configX.


    # 5.2.2 Configuring an XFree86 Server


    If you wish to use XFree86, the installation program launches the Xconfigurator
    utility, which is described in detail in Section 6.2 on page 94.

    Xconfigurator probes your system in an attempt to determine what type of video
    card you have. Failing that, Xconfigurator will provide a list of video cards.
    Select your video card from the list and press Enter. If your video card does
    not appear on the list, XFree86 may not support it. However, if you have technical
    knowledge about your card, you may choose Unlisted Card and attempt to configure
    it anyway.


    Once you have selected your video card, the installation program installs the
    appropriate XFree86 server, and Xconfigurator presents a list of monitors. If
    your monitor appears on the list, select it and press Enter. Otherwise, select
    Custom. Xconfigurator prompts you to select the horizontal sync range and vertical
    sync range of your monitor (these values are generally available in the documentation
    which accompanies your monitor, or from your monitor''s vendor or manufacturer).


    **Please Note:** It is not recommended to select a monitor "similar" to your monitor
    unless you are certain that the monitor you are selecting does not exceed the
    capabilities of your monitor. If you do, it is possible you overclock your monitor
    and damage or destroy it.


    Next, Xconfigurator prompts for the amount of video memory installed on your video
    card. If you are not sure, please consult the documentation accompanying your
    video card. It will not damage your video card by choosing more memory than is
    available, but the XFree86 server may not start correctly if you do.


    If the video card you selected might have a video clockchip, Xconfigurator presents
    a list of clockchips. The recommended choice is No Clockchip Setting,'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 5.3 Configuring Networking


    since XFree86 can automatically detect the proper clockchip in most cases.


    Finally, Xconfigurator prompts you to select the video modes you wish to use;
    select one or more modes by pressing Space. Xconfigurator then writes a configuration
    file containing all of your choices to /etc/X11/XF86Config.


    # 5.3 Configuring Networking


    Next, the installation program gives you an opportunity to configure (or reconfigure)
    networking. If you are installing from CD-ROM or from a local hard disk, the installation
    program asks you want to configure networking. If you choose No, your Red Hat
    Linux system will be a standalone workstation. If you choose Yes, you may configure
    networking as described below.


    If you are installing Red Hat Linux via NFS or FTP, you have already entered temporary
    networking information. The install program offers you three choices (see Figure
    5.1):


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_92_0.png)


    Figure 5.1: Network Configuration Options


    +   * **Keep this setup** – Keeps the network configuration you used during the
    installation. All the networking information you entered previously becomes part
    of your system''s permanent configuration.'
