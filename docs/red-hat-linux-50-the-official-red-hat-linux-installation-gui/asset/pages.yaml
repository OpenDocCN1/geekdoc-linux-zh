- pgno: 262
  md: '# E.8 Restrictions.


    # E.7.5 The "bootopt" command


    This is just the same as MILO’s "bootopt" command, see (Section E.6.4).


    # E.7.6 The "quit" command


    This is really pretty meaningless. The only way back to MILO (or anything else)
    once the flash management utility has run to reboot the system.


    # E.8 Restrictions.


    Unfortunately this is not a perfect world and there, as always, some restrictions
    that you should be aware of.


    MILO is not meant to load operating systems other than Linux, although it can
    load images linked to run at the same place in memory as Linux (which is 0xFFFF00031000).
    This is how the flash management utilities can run.


    The PALCode sources included in `miniboot/palcode/blah` are correct, however there
    are problems when they are built using the latest gas. They do build if you use
    the ancient a.out that’s supplied in the Alpha Evaluation Board toolset (and that’s
    how they were built). I’m trying to get someone to fix the new gas. Mean-while,
    as a workaround, I have provided pre-built PALCode for the supported boards and
    David Mosberger-Tang has a fixed gas on his ftp site.


    # E.9 Problem Solving.


    Here are some common problems that people have seen, together with the solutions.


    Reading MS-DOS floppies from the Evaluation Board Debug Monitor.


    Some of the older versions of the Evaluation Board Debug Monitor (pre-version
    2.0) have a problem with DOS format floppies generated from Linux. Usually, the
    Debug Monitor can load the first sectors all right, but then goes into an endless
    loop complaining about "bad sectors.". Apparently, there is an incompatibility'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 246 Alpha Mililoader Howto


    between the DOS file system as expected by the Debug Monitor and the Linux implementation
    of DOSFS. To make the long story short: if you run into this problem, try using
    DOS to write the floppy disk. For example, if loading the file MILO doesn''t work,
    use a DOS machine, insert the floppy and then


    ```

    copy a:MILO.cab c:

    copy c:MILO.cab a:

    del c:MILO.cab

    ```


    Then booting from floppy again. This normally solves the problem. MILO displays
    a long sequence of > and does not accept input.


    This usually happens when MILO was built to use COM1 as a secondary console device.
    In such case, MILO echo output to COM1 and accepts input from there also. This
    is for debugging but not great if you have a device other than a terminal connected.
    If this happens, disconnect the device or power down until the Linux kernel has
    booted. Once Linux is up and running, everything will work as expected.


    MILO complains that the kernel image has the wrong magic number


    Older versions of MILO did not support the ELF object file format and so not recognise
    an ELF image and this might be your problem. If this is reported, upgrade to the
    latest MILO that you can find. All 2.0.20 and beyond MILOS support ELF. On the
    other hand it could be that the image is indeed damaged. You should also note
    that MILO does not automatically distinguish between GZIP''d and non-GZIP images;
    you will need to add the ".gz" suffix to the file name.


    MILO prints "...turning on virtual addressing and jumping to the Linux Kernel"
    and nothing else happens


    One obvious problem is that the kernel image is wrongly built or built for another
    Alpha system altogether. Another is that the video board is for TGA (Zlxp) device
    and the kernel has been built for a VGA device (or vice versa). It is worth building
    the kernel to echo to COM1 and connecting a terminal to that serial port or retrying
    the kernel that came with the Linux distribution that you installed.


    MILO does not recognise the SCSI device


    The standard MILO images include as many device drivers as are known to be stable
    for Alpha (as of now) that includes the NCR 810, QLOGIC ISP, Busologic and Adaptec
    2940 cards. If your card is not included, it may be that the driver is not stable
    enough on an Alpha system yet. Again, the latest MILO images'
  merge: -1
  img_proc: true
