- pgno: 55
  md: '# 3.2.1 Booting the Installation Program


    To start installing Red Hat Linux, insert your boot diskette into your computer''s
    first diskette drive and reboot. After a short delay, a screen containing the
    boot prompt should appear. The screen contains information on a variety of boot
    options. Each boot option also has one or more help screens associated with it.
    To access a help screen, press the appropriate function key as listed in the line
    at the bottom of the screen. You should keep two things in mind:


    +   * The initial screen will automatically start the installation program if
    you take no action within the first minute. To disable this feature, press one
    of the help screen keys.

    * If you press a help screen function key, there will be a slight delay as the
    help screen is read from diskette.


    Normally, you''ll only need to press Enter to boot. Watch the boot messages to
    see whether the Linux kernel detects your hardware. If it does not properly detect
    your hardware, you may need to restart the installation in “expert” mode. Expert
    mode disables most hardware probing, and gives you the option of entering options
    for the drivers loaded during the installation. Expert mode can be entered using
    the boot command:


    ```

    boot: expert

    ```


    **Please Note:** The initial boot messages will not contain any references to
    SCSI or network cards. These devices are supported by modules that are loaded
    during the installation process.


    Options can also be passed to the kernel. For example, to instruct the kernel
    to use all RAM in a 128 MB system, enter:


    ```

    boot: linux mem=128M

    ```


    After entering any options, press Enter to boot using those options. If you need
    to specify boot options to identify your hardware, – they will be needed later.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 3.3 Beginning the Installation


