  md: 'will bring up the man page for ls. The man page is viewed through the less
    program, so all of the options to less will work while in a man page. Some important
    key strokes are:


    +   - q to quit

    - Enter to page down line by line

    - Space to page down back up by one page

    - followed by a string and Enter to search for a string

    - n to find the next occurrence of the previous search


    Sometimes viewing man pages isn''t too friendly on line. Providing you have a
    working printer, you can print man pages as well. If you don''t have postscript
    printing capability and just want to print ASCII, you can print man pages with:


    ```

