    # How to Send Them


    Red Hat’s support system is email-based and is partially automated; for this reason,
    it is important to make sure you send support questions in the correct format,
    so that your message will be recognized and routed to an appropriate support technician.
    In order to receive technical support for your Red Hat Software product, you must
    first register.


    Submitting trouble tickets can be sent in the traditional email way, or can be
    initiated via the World Wide Web. After providing the information for the registration,
    you will have a new menu allowing you to edit your registration information or
    open a trouble ticket. Hurry and login to open a ticket on the Web! http://www.redhat.com/support/register/


    To open a support ticket via email, all you need to do is send the support system
    message with a Subject: [registration #nnnn nnnn nnnn], where nnnn nnnn nnnn nnn
    is the registration number of the product for which you are requesting support.
    For example, if your registration number is fffe fff0, the subject line should
    read:


    ```

    Subject: [registration #fffe fff0 fff 00]

    ```


    The square brackets, the number sign, and the word ‘registration’ must be present.
    If you wish, you may add explanatory text to the subject line:


    ```

    Subject: [registration #fffe fff0 fff 00] CD-ROM problem

    ```


    Once you’ve opened a ticket, support responses come to you with the support ticket
    number in the subject line:'
