- pgno: 12
  md: '# Preface


    Welcome! And thanks for your interest in Red Hat Linux. We have what we think
    is the best Linux distribution on the market today, and we work hard to keep it
    that way. Red Hat Linux 5.0 is the latest in a long line of software from Red
    Hat Software. We hope you like it, and that you enjoy using Red Hat Linux as much
    as we enjoyed making it for you.


    It''s interesting to note that, while Linux is popular and well-known by a certain
    segment of the computer-using population, there any many people out there that
    are only now hearing about Linux. For this group of people, the following section
    should provide enough background to help you get acquainted with Linux and Red
    Hat Software. If you''d like to learn more about how Linux is developed and distributed,
    see Appendix I on page 277 for more information.


    # What is Linux?


    Back in August of 1991, a student from Finland began a post to the comp.os.minix
    newsgroup with the words:


    > Hello everybody out there using minix -

    I''m doing a (free) operating system (just a hobby,

    won''t be big and professional like gnu) for

    386(486) AT clones.


    The student was Linus Torvalds, and the “hobby” he spoke of eventually became
    what we know today as Linux.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'A full-featured POSIX-compliant operating system, Linux has been developed
    not just by Linus, but by hundreds of programmers around the world. The interesting
    thing about this is that this massive, world-wide development effort is largely
    uncoordinated. Sure, Linus calls the shots where the kernel is concerned, Linux
    is more than just the kernel. There is no management infrastructure; A student
    in Russia gets a new motherboard, and writes a driver to support a neat feature
    the motherboard has. A system administrator in Maryland needs backup software,
    writes it, and gives it away to anyone that needs it. The right things just seem
    to happen at the right time.


    Another interesting thing is that Linux can be obtained for absolutely no money.
    That''s right, most of the software is available (at no charge) to anyone with
    the time and inclination to download it. But not anyone has that much time...


    # What is Red Hat Linux?


    Unlike, other distributions, this one was fundamentally different. The difference?
    Instead of being a snapshot of a hard disk that had a working copy of Linux on
    it, or a set of diskettes from which different parts of the operating system could
    be dumped, this distribution was based on packages.


    Each package provided a different piece of software, fully tested, configured,
    and ready to run. Want to try a new editor? Download the package and install it.
    In seconds, you can get it a try. Don''t like it? Issue a single command, and
    the package is removed.


    If that was all there was to it, this distribution would be pretty nifty. But
    being package-based meant there was one additional advantage:


    This Linux distribution could be easily upgraded.


    Software development in the Linux world is fast-paced, so new versions of old
    software come out continually. With other distributions, upgrading software was
    painful - a complete upgrade usually meant deleting everything on your hard drive
    and starting over.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Preface


    By now you''ve probably guessed that the group of programmers in North Carolina
    is Red Hat Software, and the package-based distribution is Red Hat Linux.


    Since Red Hat Linux''s introduction in the summer of 1994, Linux and Red Hat Software
    have grown by leaps and bounds. Much has changed; support for more esoteric hardware,
    huge increases in reliability, and the growing use of Linux companies around the
    world.


    But much still remains the same. Linux is still developed by people world-wide;
    Linux is still involved. Red Hat Software is still located in North Carolina;
    still trying to make Linux easier for people to use.


    And Red Hat Linux is still package-based; always has been, always will be.


    Since the release of version 4.0, Red Hat Linux runs on three leading platforms:
    Intel compatible PCs, Digital computers, and Sun SPARC equipment. Our unified
    source tree and the benefits of RPM (Red Hat Package Management) technology enable
    us to deploy Red Hat Linux for each platform with a minimum of effort. This in
    turn enables our users to manage and port software between these platforms as
    easily as possible.


    We make Red Hat Linux available by unrestricted FTP from our site and mirror sites
    on the Internet. Red Hat Linux is also available on CD-ROM. For current information
    on our product offerings and links to other Linux resources please check Red Hat
    Software''s web site at http://www.redhat.com.


    On most systems, Red Hat Linux is easy to install; the installation program can
    walk you through the process in as little as 15 minutes. The system itself is
    very flexible. With RPM, you can install and uninstall individual software packages
    with minimal effort. Because of RPM, Red Hat Linux is also easy to maintain -
    package installations that can be verified and corrected, and packages can be
    installed and uninstalled simply and reliably. Furthermore, Red Hat Linux is easy
    to administer. Included are a rich set of administrative tools reduce the hassle
    of everyday system administration. Complete source code is provided for the freely
    distributable components of the system.


    # An Overview of This Manual


    This manual is organized to guide you through the process of installing Red Hat
    Linux quickly and easily. Towards that goal, let''s take a look at each chapter
    to help you get acclimated:'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Chapter 1, New Features Of Red Hat Linux 5.0 contains information concerning
    ing new functionality that has been added to Red Hat Linux 5.0.


    Chapter 2, Before You Begin contains information on tasks you should perform prior
    to starting the Red Hat Linux installation.


    Chapter 3, Starting the Installation contains detailed instructions for starting
    the Red Hat Linux installation process.


    Chapter 4, Continuing the Installation contains instructions on the main part
    of the installation process.


    Chapter 5, Finishing the Installation contains instructions on the last steps
    required to complete the installation process.


    Chapters 6 – 11 explain how to configure various services once you have installed
    Red Hat Linux, how to find documentation on your system, and how to use the various
    system management and administration tools which company Red Hat Linux. They also
    include an explanation of what''s special about your Red Hat Linux system, including
    where special files live and how to shut down Red Hat Linux.


    Appendices contain extra information about Red Hat Linux, including information
    for owners of Digital Alpha and Sun SPARC machines, frequently asked questions,
    etc.


    # Quick Start Information


    Those of you that have installed Red Hat Linux /Intel before and are in a hurry
    to get started only boot a boot diskette, and select the desired installation
    method. If you are installing from an FTP site, a hard disk, or you''ll be using
    a PCMCIA card during the installation, you''ll be prompted to insert a supplemental
    diskette. In either case, answer all questions as they are presented.


    If you are attempting to install Red Hat Linux for either the Alpha or the SPARC,
    you really should read Chapter 2 on page 15. It will refer you to information
    specific to your non-Intel-based system.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Upgrading from a Prior Version of Red Hat Linux


    The installation process for Red Hat Linux 5.0 includes the ability to upgrade
    to prior versions of Red Hat Linux (2.0, 2.1, 3.0.3, 4.0, 4.1, and 4.2) which
    are based on RPM technology. Upgrading your system installs the modular 2.0.x
    kernel as well as updated versions of the packages that are installed on your
    machine. The upgrade process preserves existing configuration files using a .rpmsave
    extension (e.g., sendmail.cf.rpmsave) and leaves a log telling what actions it
    took in /tmp/upgradelog. As software evolves, configuration file formats can change,
    so you should carefully compare your original configuration files to the new files
    before integrating your changes.


    # A Word From the Developers


    We would like to thank all our beta testers for entrusting their systems to early
    versions of Red Hat Linux and for taking the time to submit bug reports from the
    front, especially those of you who have been with Red Hat since the “Halloween”
    release and earlier. We would also like to thank Linus Torvalds and the hundreds
    of thousands of developers around the world for creating, truly, one of the wonders
    of distributed development.


    And, again, we’d like to thank you for your interest in Red Hat Linux!


    The Red Hat Development Team


    # Notes from the Editor


    Starting with this manual, Red Hat Software has dedicated full-time resources
    to producing documentation. Those of you who have read previous versions of this
    manual will probably notice that some changes have been made; we hope you’ll like
    them. Our goal is to evolve this manual into a comprehensive document that can
    serve the needs of anyone wishing to install Red Hat Linux, no matter what their
    level of experience.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# We Need Feedback!


    As we move towards this goal, there are sure to be mistakes. If you spot one,
    or if you''ve thought of a way to make this manual better, we''d love to hear
    from you!

    nPlease send mail to:


    ```

