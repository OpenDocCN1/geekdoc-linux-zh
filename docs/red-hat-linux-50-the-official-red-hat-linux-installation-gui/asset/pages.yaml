- pgno: 68
  md: '# 4


    # Continuing the Installation


    # 4.1 Upgrading or Installing


    After you choose an installation method (and, if you''re installing via the network,
    after you configure networking information), the installation program prompts
    you to either install or upgrade (see Figure 4.1 on the following page).


    # 4.1.1 Installing


    You usually install Red Hat Linux on a clean disk partition or set of partitions,
    or over another installation of Linux.


    **Please Note:** Installing Red Hat Linux over another installation of Linux (including
    Red Hat Linux) does not preserve any information from the prior installation.
    Make sure you save any important files!


    If you wish to perform a full install, choose **Install**, and skip to section
    4.2 on page 53.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# 52


    # Continuing the Installation


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_69_0.png)


    Figure 4.1: Upgrading or Installing


    # 4.1.2 Upgrading


    The installation process for Red Hat Linux 5.0 includes the ability to upgrade
    from prior versions of Red Hat Linux (version 2.0 and later) which are based on
    RPM technology. Upgrading your system installs the modular 2.0.x kernel as well
    as updated versions of the packages which are currently installed on your machine.
    The upgrade process preserves existing configuration files by renaming them using
    a .rpmsave (e.g., sendmail.cf.rpms) and leaves a log telling what actions it took
    in /tmp/upupgrade. As software, configuration file formats can change, so you
    should carefully compare your original configuration files to the new files before
    integrating your changes.


    If you wish to upgrade your Red Hat Linux system, choose Upgrade.


    Please Note: Some upgraded packages may require that other packages are also installed
    for proper operation. The upgrade procedure takes care of these dependencies,
    but it may need to install additional packages. You will be shown the names of
    the required packages, and you may then decide to install them or not.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 4.2 SCSI Support


    If you choose to perform an upgrade or a full install, the installation program
    will probe your system for SCSI adapters. In some cases, the installation program
    will ask you whether you have any SCSI adapters. If you choose Yes, the following
    dialog presents a list of SCSI drivers. Choose the driver that most closely resembles
    your SCSI adapter. The installation program then gives you an opportunity to specify
    options for the SCSI driver you selected; most SCSI drivers detect your hardware
    automatically, however.


    # 4.3 Creating Partitions for Red Hat Linux


    At this point, it’s necessary to let the installation program know where it should
    install Red Hat Linux. This is done by defining mount points for one or more partitions
    in which Red Hat Linux will be installed. You may also need to create and/or delete
    partitions at this time.


    The installation program presents a dialog box that allows you to choose from
    two disk partitioning tools (see Figure 4.2 on the following page). The two choices
    you have:


    +   **Disk Druid** – This is Red Hat Linux’s new install-time disk management
    utility. It can create and delete disk partitions according to user-supplied requirements,
    in addition to managing mount points for each partition.


    +   **fdisk** – This is the traditional Linux disk partitioning tool. While it
    is somewhatwhat more flexible than Disk Druid, the downside is that fdisk assumes
    you have some experience with disk partitioning, and are comfortable with its
    somewhat terse user interface.


    > Disk Druid is not available on Red Hat Linux/SPARC.


    With the exception of certain esoteric situations, Disk Druid can handle the partitioning
    requirements for a typical Red Hat Linux installation.


    Select the disk partitioning tool you’d like to use, and press Enter. If you choose
    Disk Druid, continue reading. If you’d rather use fdisk, please turn to Section
    4.3.2 on page 61.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 54


    # Continuing the Installation


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_71_0.png)


    Figure 4.2: Selecting Disk Setup Method


    # 4.3.1 Using Druid


    If you selected Druid, you will be presented with a screen that looks like figure
    4.3 on the facing page. While it may look overwhelming at first, it really isn’t.
    Let’s go over each of Disk Druid’s three sections, and you’ll see that there’s
    nothing to be scared of.


    # The “Current Disk Partitions” Section


    Each line in the “Current Disk Partitions” section represents a disk partition.
    You’ll note that this section has a scroll bar to the right, which means there
    might be more partitions than can be displayed at one time. If you use the Up
    and Down keys, you can see if there are any additional partitions there. Each
    line in this section has five different fields:


    +   **Mount Point** – This field indicates where the partition will be mounted
    when Red Hat Linux is installed and running.


    +   **Device** – This field displays the partitions device name.


    +   **Requested** – The “Requested” field shows the minimum size requested when
    the partition was defined.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 4.3 Creating Partitions for Red Hat Linux


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_72_0.png)


    Figure 4.3: Disk Druid Main Screen


    **Actual** - The "Actual" field shows the space currently allocated to the partition.

    **Type** - This field shows the partition''s type.


    **Another Type of Partition** As you scroll through the "Current Disk Partitions"
    section, you might see an "Unallocated Requested Partitions" title bar, followed
    by one or more partitions. As the titles, these are partitions that have been
    requested, but for one reason or another, have not been allocated. A common reason
    for having an unallocated partition is a lack of sufficient free space for the
    partition. In any case, the reason the partition is unallocated will be displayed
    after the partition''s mount point.


    **“Drive Summaries” Section**


    Each line in the “Drive Summaries” section represents a hard disk on your system.

    Each line has the following fields:


    **Drive** – This field shows the hard disk’s device name.


    **Geom [C/H/S]** – This field shows the hard disk’s *geometry*. The geometry consists
    of three numbers representing the number of cylinders, heads, and sectors reported
    by the hard disk.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Continuing the Installation


    Total – The "Total" field shows the total available space on the hard disk.


    Used – This field shows how much of the hard disk''s space is currently allocated
    to partitions.


    Free – The "Free" field shows how much of the hard disk''s space is still unallocated.


    Bar Graph – This field presents a visual representation of the space currently
    used on the hard disk. The more pound signs there are between the square braces,
    the less free space there is. In Figure 4.3 on the page before, the bar graph
    shows no free space.


    # Disk Druid''s Buttons


    These buttons control Disk Druid''s actions. They are used to add and delete partitions,
    and to change partition attributes. In addition, there are buttons that are used
    to accept the changes you''ve made, discard those changes, or exit Disk Druid
    entirely. Let''s take a look at each button in order.


    +   Add – The "Add" button is used to request a new partition. When selected,
    a dialog box will appear containing fields that must be filled in.


    +   Add NFS – This button is used to add a read-only NFS-served filesystem to
    the set of mount points on your Red Linux system. When selected, a dialog box
    will appear containing fields that must be filled in.


    +   Edit – The "Edit" button is used to modify attributes of the partition currently
    highlighted in the "Current Disk Partitions" section. Selecting this button will
    cause a dialog box to appear. Some or all of the fields in the "Edit Partition"
    box may be changed, depending on whether the partition information has already
    been written to disk or not.


    +   Delete – The "Delete" button is used to delete the partition currently highlighted
    in the "Current Disk Partitions" section. Selecting this button will cause a dialog
    box to appear to confirm the deletion.


    +   Reset – This button is used to discard all changes you may have made in Disk
    Druid, and return the list of partitions to what they read from the partition
    table(s) on your hard disk(s). When selected, you''ll be asked to confirm whether
    you want the changes discarded or not. Note that any mount points you specified
    will be lost, and will need to be reentered.'
  merge: -1
  img_proc: true
