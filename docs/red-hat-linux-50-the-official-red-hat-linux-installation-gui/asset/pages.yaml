- pgno: 128
  md: '# 6.9 NFS Configuration


    # 6.9.1 Mounting NFS Filesystems


    Use the mount command to mount a NFS filesystem from another machine:


    ```

    mount porky:/mnt/export /mnt/local

    ```


    In this command, porky is the hostname of the NFS fileserver, /mnt/export is the
    filesystem that porky is exporting, and /mnt/local is a directory on your local
    machine where we want to mount the filesystem. After the mount command runs (and
    if we have the proper permissions from porky) we can enter /mnt/local and get
    a listing of the files in /mnt/export porky.


    # 6.9.2 Exporting NFS Filesystems


    The file that controls what filesystems you wish to export is /etc/exports. Its
    format is:


    ```

    directory      hostname(options)

    ```


    the (options) are optional. For example:


    ```

    /mnt/export      speedy.redhat.com

    ```


    would allow speedy.redhat.com to mount /mnt/export, but:


    ```

    /mnt/export      speedy.redhat.com(ro)

    ```


    would just allow speedy to mount /mnt/export read-only.


    Each time you change /etc/exports, you need to tell the NFS daemons to examine
    it for new information. One simple way to accomplish this is to just stop and
    start the daemons:


    ```

    /etc/rc.d/init.d/nfs stop

    /etc/rc.d/init.d/nfs start

    ```


    The following will also work:'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# killall -HUP rpc.nfsd rpc.mountd


    See the following man pages for more details: nfsd(8), mount(8), mountd(8), and
    exports(5). Another good reference is Managing NFS and NIS Services by Hal Stern,
    published by O''Reilly & Associates.


    # 6.10 Running Programs at Boot Time


    The file /etc/rc.d/rc.local is executed at boot time, after all other initialization
    is complete, and whenever you change runlevels. You can add additional initialization
    commands here. For instance, you may want to start up additional daemons. In addition,
    if you require serial port setup, you can edit /etc/rc.d/rc.serial, and it will
    be executed automatically at boot time.


    The default /etc/rc.d/rc.local simply creates a nice login banner with your kernel
    version and machine type.


    # 6.11 Color-ls Setup


    color-ls is now part of the standard ls command. To get colorized directory listings,
    simply issue the command (in bash):


    ```

    alias ls=''ls'' --color=tty

    ```'
  merge: -1
  img_proc: true
