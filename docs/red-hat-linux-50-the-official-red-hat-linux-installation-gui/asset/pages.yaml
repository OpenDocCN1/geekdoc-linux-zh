- pgno: 177
  md: 'After you''ve begun the installation, a window appears like the one in 10.11.
    It tracks the progress of the installation so you''ll know something is happening.
    The top bar shows how much of the current package (whose name is listed side of
    it) has been installed while the bottom graph shows how much of the total installation
    has been finished. The number of packages, package sizes, and time estimates are
    continually updated.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_177_0.png)


    Figure 10.11: Installation Progress


    If a problem occurs during the installation, a window will appear listing any
    errors that occurred. If this happens, you should correct the problems and then
    try again.


    After the installation has completed, the package and groups that have been installed
    are moved from the available window to the main glint window to show you that
    they have been successfully installed.


    # Upgrading Packages


    When a new version of a package has been released, it is easy to install it on
    your system. Select the packages from the window of available packages in the
    same way you select packages for installation. Both the Upgrade button and the
    context sensitive menus will begin the upgrade.


    During the upgrade, you''ll see a progress indicator like for installing packages.
    When it''s finished, the installed packages will appear in the main glint windows
    and any old versions of the packages will be removed.


    It is much better to use the upgrade option than to uninstall the old versions
    of a package and then install the new one. Using upgrade ensures that any changes
    you made to package configuration files get preserved properly, while doing it'
  merge: -1
