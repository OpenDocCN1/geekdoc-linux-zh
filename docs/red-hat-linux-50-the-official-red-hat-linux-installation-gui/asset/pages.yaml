    otherwise modified in any way.


    # 11.4.2 Services


    Each program which uses PAM defines its own "service" name. The login program
    defines the service type login, ftppd defines the service type ftp, etc. In general,
    the service type is the name of the program used to access the service, not (if
    there is a difference) the program used to provide the service.


    # 11.4.3 The Configuration Files


    The directory /etc/pam.d is used to configure all PAM applications. (This used
    to be /etc/pam.conf in earlier PAM versions; while the pam.conf file is still
    read if no /etc/pam.d/ entry is found, it is deprecated.) Each application (really,
    each service) has its own file. A file looks like:


    ```

    ##PAM-1.0

    auth required /lib/security/pam_security.so

    auth required /lib/security/pam_pwdb.so shadow nullok

    auth required /lib/security/pam_login.so

    account required /lib/security/pam_pwdb.so

    password required /lib/security/pam_cracklib.so

    password required /lib/security/pam_pwdb.so shadow

    session required /lib/security/pam_pwdb.so nullok use_authtok

    ```


    The first line is a comment. Any line that starts with a # character is a comment.
    The next three lines stack up three modules to use for login authorization. The
    first line makes sure that if the user is trying to log in as root, the tty on
    which they are logging is listed in the /etc/security file if it exists. The second
    line causes the user to be asked for a password and the password checked. The
    third line checks if the file exists, and if it does, displays the contents of
    the file, and if the user is not root, does not let him or her log in.


    Note that all three modules are checked, even if the first module fails. This
    is a security decision—it is designed to not let the user know why their authentication
    was disallowed, knowing why it was disallowed allow them to break the authentication
    more easily. You can change this behavior by changing'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 11.4 User Authentication with PAM


    required to requisite; if any requisite module returns failure, PAM fails immediately
    without calling any other modules.


    The fifth line causes any necessary accounting to be done. For example, if shadow
    passwords have been enabled, the pam.pwdb.so module will check to see if the account
    has expired, or if the user has not changed his or her password and the grace
    period for changing the password has expired.


    The sixth line (which we''ve had to wrap) specifies that if the login program
    changes the user''s password, it should use the pam.pwdb.so module to do so. (It
    will do so only if an auth module has determined that the password needs to be
    changed—for example, if a shadow password has expired.)


    The final line specifies that the pam.pwdb.so module should be used to manage
    the session. Currently, that module doesn''t do anything; it could be replaced
    (or supplemented by stacking) any necessary module.


    Note that the order of the lines within each file matters. While it doesn''t really
    matter in which order required modules are called, there are other control flags
    available. While optional is rarely used, and never used by default on a Red Hat
    Linux system, sufficient and requisite cause order to become important.


    Let''s look at the auth configuration for login:


    ```

    auth required      /lib/security/pam_securetty.so

    auth sufficient /lib/security/pam_hosts.auth.so

    auth required    /lib/security/pam_pwdb.so shadow nullock

    auth required    /lib/security/pam_nologin.so

    ```


    That looks like the login entry, but there''s an extra line specifying an extra
    module, and the modules are specified in a different order.


    First, pam_security.so keeps root logins from happening on insecure terminals.
    This effectively disallows all root login attempts. If you wish to allow them
    (in which we recommend that you either not be internet-connected or be behind
    a good firewall), you can simply remove that line.


    Second, pam_nologin.so checks /etc/nologin, as specified above.


    Third, pam_hosts.auth.so authenticates the user, PAM immediately returns success
    to login without any password checking being done. If pam_hosts.auth.so fails
    to authenticate the user, that failed authentication is ignored.'
  merge: -1
