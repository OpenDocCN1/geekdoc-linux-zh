- pgno: 165
  md: '# Control Panel


    The system clock is not changed until you click on the Set System Clock button.

    Click on Reset Time to set the time machine back to that of the system.


    Please Note: Changing the time can seriously confuse programs that depend on

    the normal progression of time, and possibly cause problems. Try to quit as

    many applications and processes as early as possible before changing the time
    or date.


    # 9.6 Kernel Daemon Configuration


    As discussed in Chapter 6, Red Hat Linux includes kerneld, the Kernel Daemon,

    which automatically loads software and hardware support into memory as

    it is needed, and unloads when it is no longer used.


    The tool shown in Figure 9.17 manages the configuration file for kernel. While

    knerld can load some things, such as filesystems, without explicit configuration,

    it needs to be told what hardware support to load when it is presented with a

    generic hardware request.


    | Type Module Arguments |

    |---|---||

    | scsi_host BusLogic | |

    | eth0 3c59x | xcvr=1 ia-0x300 irq=5 |

    | eth1 3c503 | |


    Figure 9.17: Kernel Module Management


    For instance, when the kernel wants to load support for ethernet, knerld needs

    to know which ethernet card do you have, and if your ethernet card requires special

    configuration, it needs to know about that, too.'
