    to 3.4.4 on page 45. If you’re going to do an FTP installation, read on.


    # 3.4.3 Installing via FTP


    If you are going to install Red Hat Linux from an FTP site, highlight “FTP”, and
    select OK. FTP installations require the supplemental diskette – when asked to
