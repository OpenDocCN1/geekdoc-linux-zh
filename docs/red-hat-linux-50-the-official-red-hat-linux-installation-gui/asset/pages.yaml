    power reduction. To activate this mode, the X server disables the horizontal signal
    to the monitor.


    DPMSSusspendDelay<number> This controls the number of seconds after the last user
    input before the screen enters DPMS suspend mode. Suspend mode provides significant
    power reduction. To activate this mode, the X server disables the vertical sync
    signal to the monitor.


