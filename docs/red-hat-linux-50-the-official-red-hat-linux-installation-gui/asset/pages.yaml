- pgno: 234
  md: '# D.5 Installing


    # D.5.3 Starting the Installation


    After the kernel boots, it prompts for a ramdisk. Remove the kernel diskette,
    insert the ramdisk diskette, and press Enter After the ramdisk is done loading,
    you should see the first installation screen.


    # D.5.4 Issues Specific to Red Hat Linux/Alpha


    Before you return to the installation, you should know about some differences
    between Red Hat Linux/Intel and its Alpha counterpart. Let''s review them:


    # Disk Partitioning


    Red Hat Linux/Alpha supports two varieties of hard drive partitioning:


    +   - Standard fdisk-style partitioning: this has the usual oddities (such as
    extended partitions) and is in the same way as on Intel platforms (using Linux
    fdisk). This is the partitioning style you use if you are using the ARC or AlphaBIOS
    console.

    - BSD-style disk-labelling: It is normal to make the first partition on a disk-labelled
    hard drive the swap partition. We don''t recommend BSD disk-labelling unless it
    is absolutely necessary (such as in the case of sharing a hard drive between Digital
    Unix and Red Hat Linux/ Alpha). Note that you need to use about if you use BSD-style
    disk labels. Note that an RPM package of about comes with Red Hat Linux/Alpha.


    # Creating a MILO Partition


    If your system supports MILO, you should allocate a small (no more than 2 MB)
    partition to it. The partition type must be DOS. This is where you will copy MILO
    and linload.exe after the installation completes.


    # XFree86 and TGA


    If you have an Alpha with a TGA card and you choose to install XFree86, the installation
    program prompts you to choose a video card. Choose Unlisted Server,'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'and the installation program will display a list of available servers. Choose
    the TGA server.


    You can now turn back to Section 3.3 on page 39 to complete the installation.


    # D.5.5 Finishing Up


    After the installation is finished and your system is fully configured, you will
    be asked to reset your computer. This indicates that your system has been successfully
    fully installed.


    # Configuring MILO


    Order to boot your newly installed system, you''ll need to use your MILO diskette.
    To boot Red Hat Linux/Alpha from MILO, you must use the boot command. The command
    differs slightly depending on where your root partition is. For example, if your
    root partition is the second partition on your first SCSI hard drive, you would
    boot as follows:


    ```

    boot sda2:vminux.gz root=/dev/sda2

    ```


    However, if your root partition is the third partition on your second IDE drive,
    you would use this command:


    ```

    boot hdb3:vminux.gz root=/dev/hdb3

    ```


    Boot your Alpha system (using the appropriate root partition name for your system,
    of course). Once Red Hat Linux/Alpha has finished booting, login, and issue the
    following command:


    ```

    dd if=/dev/fd0 of=/dev/sda1 bs=1440k

    ```


    This will copy MILO (along with linload.exe) to the small MILO partition you created
    during installation.


    Finally, you need to create a boot selection that will look for MILO on your MILO
    partition. Shutdown your Alpha system, and perform the following steps from the
    ARC console:'
  merge: -1
  img_proc: true
