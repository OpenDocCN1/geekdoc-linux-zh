  md: '# System Administration


    Finally (if pam_rhosts.auth.so has failed to authenticate the user), the pam_pwdb.so
    module performs normal password authentication.


    Note that if you do not want to prompt for a password if the security check fails,
    you can change the pam_security.so module from required to requisite


    # 11.4.4 Shadow Passwords


    Shadow password support has changed significantly for Red Hat Linux 5.0. Please
