- pgno: 248
  md: '# How To Load MILO


    +   - EB64+ (Section E.5.7)

    - EB66+ (Section E.5.7)

    - EB164 (Section E.5.7)

    - PC164 (Section E.5.7)


    Before you consider this method, you should not include the early versions of
    the Evaluation Board Debug Monitor did not include video or keyboard drivers and
    so you must be prepared to connect another system via the serial port so that
    you can use the Debug Monitor. Its interface is very simple and typing help shows
    a whole heap of commands. The ones that are most interesting include the word
    boot or load in them.


    The Evaluation Board Debug Monitor can load an image either via the network (netboot)
    or via a floppy (flboot). In either case, set the boot address to 0x200000 (>
    bootadr 200000) before booting the image.


    If the image is on floppy (and note that only DOS formatted floppies are supported),
    then you will need to type the following command:


    ```

    AlphaPC64> flboot <MILO-image-name>

    ```


    # E.5.4 Loading MILO from a Failsafe Boot Block Floppy


    Only the AxpPCI33 is known to include failsafe boot block floppy support (Section
    E.5.7).


    If you do not have a standard pre-built MILO .dd image, then you may need to build
    an SRM boot block floppy. Once you have built MILO, you may need to do the following
    on Digital Unix box:


    ```

    fdisk -fmt /dev/rfd0a

    cat mboot bootm > /dev/rfd0a

    disklabel -rw rfd0a ''rx23'' mboot bootm

    ```


    Or on a Linux box:


    ```

    cat mboot bootm > /dev/fd0

    ```'
