    # 4.5 Formatting Partitions


    The next dialog box presents a list of partitions to format (see Figure 4.14 on
    page 69). All newly created partitions should be formatted. In addition, any already-existing
    partitions that contain old data no longer need be formatted. However, partitions
    such as /home or /usr/local must not be formatted if they contain data that you
    wish to keep. Select each partition to format and press Space If you wish to check
    for bad blocks while formatting each filesystem, select Check for bad blocks during
    format. Select OK, and press Space.


    # 4.6 Selecting and Installing Packages


    After your partitions have been configured and formatted, you are ready to select
    packages for installation. You can select components, which group packages together
    according to function, individual packages, or a combination of the two.'
