- pgno: 108
  md: '# 6.1 Building a Custom Kernel


    make mrproper and make config commands and use the command make dep followed by
    make clean to prepare the source tree for the build.


    The next step consists of the actual compilation of the source code components
    into a working program that you can use to boot. The method described here is
    the easiest to recover from in the event of a mishap. If you are interested in
    other possibilities details can be found in the Kernel-HOWTO or in the Makefile
    in /usr/src/linux on your Linux system.


    +   - Build the kernel with make boot.

    - Build any modules you configured with make modules.

    - Move the old set of modules out of the way with:


    ```

    rm -rf /lib/modules/2.0.29-old

    mv /lib/modules/2.0.29 /lib/modules/2.0.29-old

    ```


    Of course, if you have upgraded your kernel, replace 2.0.29 with the version you
    are using.


    +   - Install the new modules (even if you didn''t build any) with make modules.install.


    If you have a SCSI adapter and made your SCSI driver modular, build a new initrd
    image (see Section 6.1.2; note that there are few practical reasons to make the
    SCSI driver modular in a custom kernel).


    In order to provide a redundant boot source to protect from a possible error in
    a new kernel you should keep the original kernel available. Adding a kernel to
    the LILO menu is as simple as renaming the original kernel in /boot, copying the
    new kernel to /boot, adding a few lines in /etc/lilo.conf and running /sbin/lilo.
    Here is an example of the default /etc/lilo.conf file shipped with Red Hat Linux:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=100

    image=/boot/vmlinux

    label=linux

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Post Installation Configuration


    root=/dev/hdal

    read-only


    Now you must update /etc/lilo.conf. If you built a new initrd image you must tell
    LILO to use it. In this example of /etc/lilo.conf we have added four lines at
    the bottom of the file to indicate which kernel to boot. We have renamed /boot/vmlinuz
    to /boot/vmlinuz.old and changed its label to old. We have also added an initrd
    line for the new kernel:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot.b

    prom

    timeout=100

    image=/boot/vmlinuz

    label=linux

    initrd=/boot/initrd

    root=/dev/hdal

    read-only

    image=/boot/vmlinuz.old

    label=old

    root=/dev/hdal

    read-only

    ```


    Now when the system boots and you press Tab at the LILO boot: prompt two choices
    will be shown:


    ```

    LILO boot:

    linux old

    ```


    To boot the new kernel (linux) simply press Enter or wait for LILO to time out.
    If you want to boot the old kernel (old), simply enter old and press Enter


    Here is a summary of the steps:


    +   - mv /boot/vmlinuz /boot/vmlinuz.old

    - cp /usr/src/linux/arch/i386/boot/zImage /boot/vmlinuz

    - edit /etc/lilo.conf

    - run /sbin/lilo'
  merge: -1
  img_proc: true
- pgno: 110
  md: "# 6.1 Building a Custom Kernel\n\nYou can begin testing your new kernel by\
    \ rebooting your computer and watching the messages to ensure your hardware is\
    \ detected properly.\n\n# 6.1.2 Making an initrd image\n\nAn initrd image is needed\
    \ for loading your SCSI module at boot time. The shell script /sbin/mkinitrd can\
    \ build a proper initrd image for your machine if the following conditions are\
    \ met:\n\n+   - The loopback device is available.\n- The /etc/conf.modules file\
    \ has a line for your SCSI adapter; for example:\n  alias scsi_hostadapter BusLogic\n\
    \nTo build the new initrd image, run /sbin/mkinitrd with parameters such as this:\n\
    \n```\n/sbin/mkinitrd /boot/newinitrd-image 2.0.12\n```\n\nwhere /boot/newinitrd-image\
    \ is the file to use for your new image, and 2.0.12 is the kernel whose modules\
    \ (from /lib/modules) should be used in the initrd image (not necessarily the\
    \ same as the version number of the currently running kernel).\n\n# 6.1.3 Building\
    \ a monolithic kernel\n\nTo build a monolithic kernel you follow the same steps\
    \ as building a modularized kernel with a few exceptions.\n\n+   - When configuring\
    \ the kernel only answer Yes and No to the questions (don't make anything modular).\n\
    - Omit the steps:\n\n```\nmake modules\nmake modules_install\n```\n\n+   - Edit\
    \ the file /etc/rc.d/rc.sysinit and comment out the line depmod\na by inserting\
    \ a “#” at the beginning of the line."
