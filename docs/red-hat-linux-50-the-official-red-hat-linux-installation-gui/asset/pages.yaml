- pgno: 164
  md: '# 9.5 Time and Date


    After providing the configuration information for your new device, click Done.
    The device should appear in your Interfaces list as an inactive device. (The active
    column should have a label of no). To activate the new device, first select it
    with a mouse click and then choose on the Activate button. If it does not come
    up properly, you may need to reconfigure it by choosing on Edit.


    # 9.4.4 Managing Routes


    In the Routes management screen you have the ability to add, edit, or remove static
    networking routes. Adding or editing an entry involves identical actions, just
    like the Hosts panel. An edit dialog box will appear, simply type the new information
    and click Done when you are finished. See figure 9.16 for an example.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_164_0.png)


    # 9.5 Time and Date


