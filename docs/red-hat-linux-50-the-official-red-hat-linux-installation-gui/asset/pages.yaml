- pgno: 230
  md: '# D.3 Installation Overview


    The X Window System should work on any machine with an S based video card (except
    the Jensen machines). S3 Virge cards, the Matrox Millenium, Millenium II, and
    the Mystique will work, as will most of the cards from Orchid and Number 9. Most
    Diamond Stealth cards are also supported. Digital TGA cards (based on the DC21030
    chip) are supported in 8 bit mode, and an X server for Mach64 cards is also provided.


    **Please Note:**There is an X server available specifically for Jensens with an
    S3 card. It is available from ftp://ftp.azstarnet.com/pub/linux/axp/jensen. Note
    that this is mirrored by several of the bigger FTP sites, should you have trouble
    connecting.


    # D.3 Installation Overview


    Installing Red Hat Linux on an Alpha system is slightly more complex than installing
    Red Hat Linux/Intel, mostly due to differences in machine architecture, and the
    variety of different models supported. In general, the main steps to a successful
    install are:


    +   1. Create MILO, kernel, and ramdisk diskettes from images available on the
    Red Hat Linux/Alpha CD.

    2. Use the MILO diskette to boot the appropriate Linux kernel.

    3. Load and run the Red Hat Linux/Alpha installation program.

    4. After the installation completes, install MILO on a small disk partition on
    your machine.


    **Please Note:**While the majority of Alpha systems are supported by MILO, those
    that are not will need to boot the boot floppy (or CD-ROM) directly from the SRM
    (System Reference Manual) console. Information on doing this is available from
    the Red Hat Software website site at http://www.redhat.com/linux-info/alpha/faq.
    You should also consult your system documentation for the proper boot command
    syntax, but in general, the proper command would look like this:


    ```

    boot dva0 -file vmlinux.gz -flags "load_ramdisk=1 prompt_ramdisk=1*

    ```'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# D.4 Choosing/ Diskette Images


    The Red Hat Linux/ Alpha installation process is diskette-based. The number and
    contents of the diskettes varies according to the type of Alpha system you have.
    Therefore, before creating diskettes, it''s necessary to pick the appropriate
    image files. Use the following table as a guide:


    | System Type | MILO Image (In milo/images) | Boot Image (In images) |

    |---|---|--|

    | Alcor (ARC Console) | N/A | alcor.img |

    | Alcor (SRM Console) | N/A | alcor-s.img |

    | Alpha-XLT | xlt.img | xlt.img |

    | Cabriolet | cab.img | cab.img |

    | EB164 | eb164.img | eb164.img |

    | EB64+ | eb64p.img | eb64p.img |

    | EB66 | eb66.img | eb66.img |

    | EB66+ | eb66p.img | eb66p.img |

    | Miata | miata.img | miata.img |

    | Noname | noname.img | noname.img |

    | PC164 | pc164.img | pc164.img |

    | PC164LX | lx164.img | pc164.img |

    | PC164SX | sx164.img | sx164.img |


    Creating a MILO Diskette If your system is supported by MILO, you will find the
    appropriate image in the milo/images directory on the Red Hat Linux/Alpha CD-ROM.
    Refer to Appendix B on page 193 for instructions on writing the image file to
    a diskette. Make sure you label the diskette "MILO Diskette".


    **Note:**If you have trouble with MILO, the first thing to try is a newer MILO
    image. The latest version of MILO is always available at

    ft://ftp.digital.com/pub/DEC/Linux-Alpha/Miniloader/.


    **Creating a Boot Diskette** You will find the appropriate boot diskette image
    in the images directory on the Red Hat Linux/Alpha CD-ROM. Refer to Appendix B
    on page 193 for instructions on writing the image file to a diskette. Make sure
    you label the diskette "Boot Diskette".'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# D.5 Installing


    Creating a Ramdisk Diskette All Red Hat/Alpha installations use the same ramdisk
    image. It is called ramdisk.img, and can be found in the images directory on the
    Red Hat Linux/Alpha CD-ROM. Refer to Appendix B on page 193 for instructions on
    writing the image file to a diskette. Make sure you label the diskette "Ramdisk
    Diskette".


    # D.5 Installing


    # D.5.1 Booting the MILO Diskette


    (If you Alpha system doesn''t support MILO, please skip to Section D.5.2 on the
    following page.)


    Before you boot your MILO diskette, you''ll need to add a new boot selection to
    your ARC console. You can add a new boot selection for your MILO diskette following
    these steps:


    +   1. From the boot menu, select "Supplementary menu".

    2. From the supplementary selections menu, select "Set up the system".

    3. From the boot selections menu, select "Add a boot selection".

    4. Select "Floppy Disk 0".

    5. Enter "linload.exe" as the osloader directory and name after erasing any default
    information.

    6. Indicate that the operating system is in the same partition as the osloader
    by entering "yes".

    7. Enter "/" as the operating system root directory after erasing any default
    information.

    8. Give the boot selection a meaningful name. "Linux" is a nice name.

    9. Indicate that you do not want to initialize the debugger at boot time by entering
    "no".

    10. From the boot selection menu, select "Change a boot selection option". Pick
    the boot selection you just created.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 216 Information specific to Red Hat Linux/Alpha


    +   11. Using the arrow keys, select "OSLOADADFILENAME", and enter "\milo". Press
    Enter


    +   12. Using the arrow keys, select "OSLOADADOPTIONS", and erase any information
    that may be there. Press Enter


    +   13. Press Esc to leave the "Change a boot selection option" menu.


    +   14. Select "Setup Menu". Select "Supplementary menu


    +   15. Return to the boot menu.


    At the end of this process, your boot selection should look something like this
    one (Not counting differences in boot selection name and disk identification strings):


    ```

    LOADIDENTIFIER =Linux

    SYSTEMSPARTITION=multi(0)disk(0)fdisk(0)

    OSLOADER=multi(0)disk(0)\load.exe

    OSLOADERPARTITION=multi(0)disk(0)fdisk(0)

    OSLOADFILENAME=\milo

    OSOPTIONS=

    ```


    At this point your Alpha system has been set to boot MILO from diskette.


    # D.5.2 Booting the Kernel Diskette


    Now it''s time to get things started. We need to start by booting from the kernel
    diskette you''ve created. How this is done depends on your Alpha system. If it
    supports MILO, insert your MILO diskette, and boot from that. At the MILO> prompt,
    insert your kernel diskette, and enter the following boot command:


    ```

    boot floppy

    ```


    MILO should then read the Linux kernel from your boot disk and start running it.
    On the other hand, if you cannot use MILO, and must boot using the SRM console,
    enter the appropriate boot command for your Alpha system, making sure to add the
    following arguments to be passed to the kernel:


    ```

    *load_ramdisk=1 prompt_ramdisk=1*

    ```'
  merge: -1
