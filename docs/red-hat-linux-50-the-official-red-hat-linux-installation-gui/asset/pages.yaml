    **Old Timer** - If you''re a long-time Red Hat Linux user, you probably don''t
    need us telling you what documentation to read. Thanks for reading this far!—


    # 2.6 A Note About Kernel Drivers


    During installation of Red Hat Linux, there are some limits placed on the filesystems
    and other drivers supported by the kernel. However, after installation there is
    support for all file systems available under Linux. At install the modularkernel
    has support for (E)IDE devices (including ATAPI CD-ROM drives), SCSI adapters,
    and network cards. Additionally, mice, SLIP, SLIP, PPP, PLIP, FPU emulation, console
    selection, ELF, SysV IPC, IP forwarding, firewalling and accounting, reverse ARP,
    QIC tape and parallel printers, are supported.


    **Please Note:** Because Red Hat Linux supports on many different types of hardware,
    many drivers (including those for SCSI adapters, network cards, and many CD-ROMs)
    are not built into the Linux kernel during installation; rather, they are available
    as *modules* and loaded as you need them during the installation process. If necessary,
    you will have the chance to specify options for these modules at the time they
    are loaded, and in fact these drivers will ignore any options you specify for
    them at the *boot:* prompt.


