    # 2.3.5 Installing From a Hard Drive


    If none of the other installation methods will work for you, but you have some
    means of getting the Red Hat Linux packages written to your system''s hard drive,
    you can install from your hard drive. In this installation method, the Red Hat
    Linux packages you select are read from one partition on a hard drive, and are
    installed on another partition (or set of partitions).


    # How To Do It


    The hard drive installation method requires a bit of up-front effort on your part,
    as you must copy all the necessary files to a partition before starting the Red
    Hat Linux installation program. You must first create a RedHat directory at the
    top level of your directory tree. Everything you install should be placed in that
    directory. First copy the base subdirectory and its contents.


    Next, copy the packages you want to install to another subdirectory called RPMS.
    You can use available space on an existing DOS partition or a Linux partition
    that is not required in the install process (for example, a partition that would
    be used for data storage on the installed system).


    If you are using a DOS filesystem, you will not be able to use the full Linux
    filenames for the RPM packages. The installation process does not care what the
    filenames look like, but it is a good idea that you keep track of them. You''ll
    need a boot and supplemental diskette when installing from a hard drive.


    # 2.4 Disk Partitions


    In order to install Red Hat Linux, you must make disk space available for it.
    This disk space needs to be separate from the disk space used by other operating
