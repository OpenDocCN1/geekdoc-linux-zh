  md: '# 30


    # Before You Begin


    you may face a situation where LILO will initially (because all the necessary
    information is below cylinder 1023), but will fail if a new kernel is to be loaded,
    and that kernel resides above cylinder 1023.


    As mentioned earlier, it is possible that some of the newer BIOSes may permit
    LILO to work with configurations that don''t meet our guidelines. Likewise, some
    of LILO''s more esoteric features may be used to get a Linux system started, even
    if the configuration doesn''t meet our guidelines. However, due to the number
    of variables involved, Red Hat Software cannot support such extraordinary efforts.


    # 2.4.4 How Many Partitions?


    Although you can install Red Hat Linux in a single partition (subject to any of
    the partitioning considerations we''ve mentioned so far), it''s much better idea
    to split things up a bit. We recommend the following layout as a compromise between
    single-partition simplicity, and multi-partition flexibility:


    **Please Note:** If you plan to install all the software packages accompanying
    Red Hat Linux, you may need to use even larger partitions.


    **A swap partition** – Swap partitions are used to support virtual memory. If
    your computer has 16 MB of RAM or less, you must create a swap partition. Even
    if you have more memory, a swap partition is still recommended. The minimum-size
    of your swap partition should be equal to your computer''s RAM, or 16 MB (whichever
    is larger).


    **A root partition** – The root partition is where / (the root directory) resides.
    It only needs to contain things necessary to boot your system, as well as system
    configuration files. A root partition of 50 MB to 80 MB works well for most systems.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_47_0.png)


    Don''t forget the LILO constraints we mentioned in Section 2.4.3 on the page before!


    /usr partition – The /usr partition is where much of the software on a Red Hat
    Linux system resides. This partition should be between 200 MB and 500 MB, depending
    on how many packages you plan to install. If at all possible, try to be generous
    with the /usr partition. Any RPM-based packages you install later will (in general)
    use more space from /usr than any other partition.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 2.5 Getting Documentation


    A /home partition – This is where users’ home directories go; the size of /home
    depends on how many users you plan to have on your Red Linux system and what they
    might store in their home directories.


    > The following partition is specific to Red Hat Linux /Alpha installations.


    A MILO partition – Alpha owners that will be using MILO to boot their systems
    should create a 1.5 MB DOS partition where MILO can be copied after the installation
    is complete.


    Additionally, you may wish to create any of the following:


    +   A /usr/local partition – Traditionally, /usr/local has been used to hold things
    you wish to keep separate from the rest of your Red Hat Linux system, such as
    software that is not available as an RPM package. The size depends on the amount
    of software you anticipate putting on your system.


    +   A /usr/src partition – There are two things that are stored in /usr/src on
    a Red Hat Linux system:


    +   Linux Kernel Sources – The complete sources for the linux kernel are stored
    here, and new kernels are built here.


    +   Sources For RPM-Based Packages – If a source package file (aka SRPM) is installed,
    the files are stored here. Note that, unless specified otherwise, any packages
    built will also use a build directory here.


    +   Again, the size of this partition would depend on the amount of software you
    anticipate building.


    A /tmp partition – As the name implies, the /tmp partition is for temporary files.
    Creating a partition dedicated to /tmp is a good idea for larger, multiuser systems
    or network server machines. The reason is that many active users can fill the
    root partition (/), which is where /tmp is located. It’s not necessary to dedicate
    a partition to /tmp on single-user workstations.


