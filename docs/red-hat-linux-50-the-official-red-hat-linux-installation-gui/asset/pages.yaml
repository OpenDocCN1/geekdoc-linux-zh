    # 6.8.2 World Web Server


    If you installed the Apache web server (from the apache package), then your Web
    service is already up and running! Just point your web browser at http://localhost.


    The default page shown is /home/httpd/html/index.html. You can edit this file
    (or completely replace it) to your liking. All the CGI programs, icons, and html
    pages are stored in /home/httpd, but this can be changed in the apache configuration
    files, all of which are stored in /etc/httpd/conf/. Logs of all http activity
    are kept in /var/log/httpd/. Setting up your site is as easy as adding your own
    HTML pages and links to the /home/httpd/html/ directory. For more information
    on customizing your web server we recommend a reference such HTML: The Definitive
    Guide by Chuck Musciano & Bill Kennedy, published by O''Reilly & Associates.


    # 6.9 NFS Configuration


    NFS stands for Network File System, and is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means that it can export filesystems to other systems, and
    mount filesystems exported from other machines.'
