- pgno: 216
  md: '# C.2 Installation Overview


    +   - Toshiba XM-3201B

    - AppleCD 300 Plus on older SPARC PROM

    - Apple CD600i


    # C.2 Installation Overview


    Installing Red Hat Linux on a SPARC system is slightly more complex than in-stalling
    Red Hat Linux/Intel, mostly due to differences in machine architecture. In general,
    the main steps to a successful installation are:


    +   1. Determine which console commands your SPARC systems supports.

    2. Determine whether you have sufficient memory to use a ramdisk-based installation.

    3. Determine how you will boot the installation program.

    4. Determine what installation method you will use.

    5. Determine whether you will install Red Hat Linux/SPARC from a serial terminal.

    6. Load and run the Red Hat Linux installation program.


    Let''s look at each of these steps in more detail.


    # C.3 Console Commands


    SPARC systems have two different types of boot commands available, depending on
    the version of the system''s console PROM. Systems with a PROM less than 2.0 use
    what is known as the “old” style boot command, while systems whose PROM is at
    version 2.0 or greater can use either the old or the new style boot commands.
    If your SPARC system''s console prompt is “ok”, then your system is in new command
    mode, and can use the new style boot command.


    In general, it''s preferable to use the new style boot command if your system
    supports it. Of course, it''s possible to use the old style boot command, but
    you''ll need'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Information Specific to Red Hat Linux/SPARC


    to know a bit more about your hardware configuration. An excellent reference on
    older Sun hardware in general (the old-style boot commands in particular) can
    be found in The Sun Hardware Reference, by James W. Bardsall. It can be found
    at ftp://ftp.picarey.com/pub/Sun-Hardware-Ref/parts/. The file part2 contains
    an in-depth description of the "ROM monitors" present in older Sun Systems.


    In general, the new style boot command is boot, followed by descriptive device
    name (such as floppy, cdrom, or net).


    The old style boot command is b, followed by a device specifier in the form:


    ```

    xx(a,b,c)

    ```


    xx is used to specify the device type (such as sd for SCSI disks), a is the controller
    number, b, is the device''s unit number, and c is the partition number. Please
    refer to The Sun Hardware Reference if you have an older SPARC system, and require
    additional information on its boot command syntax.


    # C.4 Ramdisk-based Installation Criteria


    When the Red Hat Linux/SPARC installation starts, normally a ramdisk is loaded
    into memory. This ramdisk contains data and programs required to perform the installation,
    and is approximately 4 MB in size. Since the ramdisk memory away from the Red
    Hat Linux/SPARC installation program, your SPARC system must have at least 12
    MB of memory in order to successfully use a ramdisk-based installation.


    For SPARC systems with less than 12 MB of RAM, another approach is available.
    It is known as an NFS-mounted root. As the names imply, instead of using a ramdisk
    to hold parts of the Red Hat Linux/SPARC installation program, an NFS server is
    used to export the necessary files to the SPARC system. While this approach uses
    less memory, it is somewhat complex to set up.


    Please Note:Red Hat Linux/SPARC may also be installed by booting from the Red
    Hat Linux /SPARC CD-ROM. This method uses neither a ramdisk or an NFS-mounted
    root, as the necessary files are already present on the Red Hat Linux/SPARC CD-ROM.
    We will discuss booting from CD-ROM in Section C.5.2 on page 202.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# C.5 Choosing a Boot Method


    # C.4.1 Preparing to Use an NFS-Mounted Root


    If you will be using an NFS-mounted root for the installation program, you''ll
    need a network connection for your SPARC system, an NFS server capable of exporting
    the Red Hat Linux/SPARC CD-ROM (or equivalent files), and the ability to respond
    to rarp requests, so that your SPARC system can obtain its IP address. The necessary
    commands for rarp would be:


    ```

    rarp -s ip.address.of:sparc hw:address:sparc

    rarp -s ip.address.of:sparc hw:address:sparc

    ```


    As you might suppose, replace ip.address.of:sparc with the IP address of your
    SPARC system, and replace hw:address:sparc with the MAC address of your SPARC
    system''s network adapter. The IP address is assigned by your network administrator,
    and the MAC address is displayed on your SPARC system''s console at power-up.


    To use an NFS-mounted root during the installation, add the following argument
    to your boot command:


    ```

    linux fsroot=nfs.server.ip.address:/path/to/RH/image

    ```


    The word linux should always be included in a boot command that must precede the
    first argument. Replace nfs.server.ip.address with the NFS server''s IP address,
    and /path/to/RH/image with the path to the exported directory containing the appropriate
    Red Hat Linux/SPARC files.


    # C.5 Choosing a Boot Method


    This section describes how to start (or boot) the installation program. Once the
    installation program is running, you will be able to choose from several installation
    methods. You can choose from the following installation methods: CD-ROM, NFS,
    hard disk, and FTP. (Note that if the installation program is booted directly
    from CD-ROM, the installation will automatically proceed from CD-ROM.)


    There are three different ways a Red Hat Linux/SPARC installation can be started:'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Boot From Diskette - The installation program is read from a diskette.


    Boot From CD-ROM - The installation program is read directly from the Red Hat
    Linux/SPARC CD-ROM.


    Boot From the Network - The installation program is read from a TFTP server.


    # C.5.1 Booting From Diskette


    If your SPARC system has a diskette drive, you can boot the Red Hat Linux/SPARC
    installation program from a diskette. The boot diskette image (known as boot.img)
    is located in the images/ directory on your Red Hat Linux/SPARC CD-ROM. Please
    refer to Appendix B on page 193 for instructions on writing the image to a diskette.
    Make sure you use the diskette "Boot Diskette".


    # ette Boot Commands


    For SPARC systems with a PROM version of 2.0 or greater, the proper boot command
    (when in new command mode) is:


    ```

    boot floppy

    ```


    On the other hand, SPARC systems with PROM versions less than 2.0 should use the
    following command at the > prompt:


    ```

    b fd()

    ```


    Please Note:There have been reports that some systems with pre-2.0 PROMs-cannot
    boot the Red Hat Linux/SPARC installation program from diskette. If you find this
    to be the case with your SPARC system, you will need to use another boot method.


    # C.5.2 Booting From CD-ROM


    If your SPARC system has a fully Sun-supported CD-ROM drive, you can boot directly
    from the Red Hat Linux/SPARC CD-ROM. For SPARC systems with a PROM version of
    2.0 or better, use the following command when in new command mode:'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# C5 Choosing a Boot Method


    boot cdrom


    SPARC systems with PROM versions less than 2.0 may not be able to boot from a
    CD-ROM at all. Theoretically, if your SPARC system has a CD-ROM at SCSI id 6,
    the following command should boot the Red Hat Linux/SPARC installation program:


    ```

    b sd(0,6,0)

    ```


    Unfortunately, due to a lack of resources, Red Hat Software has not been able
    to test this boot command. If one of our readers has been successful getting a
    pre-2.0 SPARC system booted from the Red Hat Linux/SPARC CD-ROM, please send us
    mail at docs@redhat.com, and we will update this manual. Thank you!


    Note that using an NFS-mounted root after booting from CD-ROM is not supported,
    the filesystem on the Red Hat Linux/SPARC CD-ROM performs the same function as
    an NFS-mounted root. Therefore, no additional boot command should be given for
    CD-ROM boots.


    # C.5.3 Booting From the Network


    There are two types of network boots supported by the Red Hat Linux/SPARC installation
    program:


    +   Network boot with NFS-mounted root. This method is required for SPARC systems
    with less than 12 MB of RAM.

    Network boot with network-loaded ramdisk. This method can be used by systems with
    at least 12 MB of RAM.


    While booting your SPARC system from the network is fairly straightforward, there
    are several requirements:


    +   Your SPARC system must have a network connection.

    Your network must be able to give your SPARC system its IP address via a rarp.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '+   You must have a TFTP server that can download the Red Hat Linux/SPARC kernel
    and installation program to your SPARC system.


    +   If you are going to use an NFS-mounted root, an NFS server capable of exporting
    the Red Hat Linux/SPARC CD-ROM (or equivalent files).


    Setting up RARP If you are going to use rarp, please refer to Section C.4.1 on
    page 201.


    TFTP Server Setup If you are setting up a TFTP server on a Red Hat Linux system,
    simply install the latest ttfp package by RPM, and make sure the line in inetd.conf
    that will run ttfp is uncommented. Don''t forget to kill -HUP inetd if you needed
    to make any changes to inetd.conf.


    Next, you''ll need to make a symlink describing the SPARC system to be booted,
    and pointing to the file from which it should boot. The name of the symlink contains
    two items:


    +   1. The IP address of the system to be booted, in hexadecimal.


    +   2. A string describing the architecture of the system to be booted.


    To convert the more common "dotted decimal" IP address into its hex equivalent,
    convert each address'' four groups of numbers into hex. If the resulting hex number
    is only one digit, add a leading zero to it. Then append all four hex numbers
    together. For example, take the IP address 10.0.2.254. Convert each set of four
    numbers into hex, and add a leading zero where necessary


    ```

    10 = A or 0A

    0 = 0 or 00

    2 = 2 or 02

    254 = FE or FE

    ```


    Therefore, the IP address 10.0.2.254 is in hex: 0A0002FE.


    The second part of the symlink name is the SPARC system''s architecture. For our
    example, we''ll use SUN4M. The IP address and architecture are separated by a
    dot, resulting in this symlink name:'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# C.6 Choosing an Installation Method


    OA0002FE.SUN4M


    The last step is figuring out what this symlink should point to. There are two
    choices. If you want to use an NFS-mounted root, use the file /kernels/vmlinux.
    If you would rather use a ramdisk, use the file /images/tftpboot.img.


    Place the appropriate file in the TFTP server’s directory, and create the symlink.
    In this example, we’re using the image that includes a ramdisk:


    ```

    ln -s tftpboot.img 0A002FE.SUN4M

    ```


    # Network Boot Commands


    You’re now ready to boot. If you’re going to boot tftpboot.img, simply use the
    following command (in new command mode):


    ```

    boot net

    ```


    On the other hand, if you’re going to boot from vmlinux and use an NFS-mounted
    root, use this command:


    ```

    boot net linux nfsroot=nfs.server.IP.address:/path/to/RH/image

    ```


    Replace nfs.server.ip.address with the NFS server’s IP address, and /path/to/RH/image
    with the path to the exported directory containing the appropriate Red Hat Linux/SPARC
    files.


    SPARC systems with PROM versions less than 2.0 should use this boot command, appending
    the usual NFS root argument if required:


    ```

    b le()

    ```


    # C.6 Choosing an Installation Method


    Once your SPARC systems has booted, and the installation program is running, you’ll
    be asked to choose an installation method (unless you’ve booted directly from
    CD-ROM, in which case a CD-ROM installation method is assumed). Red Hat Linux/SPARC
    can be installed by any of the following methods:'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# C.6.1 CD-ROM Installation


    +   * Installing packages from CD-ROM.

    * Installing packages from an FTP site.

    * Installing packages from an NFS server.

    * Installing packages from a locally-attached hard disk.


    This is the most straightforward method. It requires a Red Hat Linux/SPARC CD-ROM,
    and a Sun-supported CD-ROM connected to your SPARC system.


    # C.6.2 FTP Installation


    This installation method requires a local area network connection and access to
    an FTP site with the Red Hat Linux/SPARC CD-ROM (or equivalent files).


    # C.6.3 NFS Installation


    Installing via NFS requires a local area network connection and access to an NFS
    server that can export the contents of the Red Hat Linux/SPARC CD-ROM (or equivalent
    files).


    # Hard Disk Installation


    This installation method requires that the contents of the Red Hat Linux/SPARC
    CD-ROM (or equivalent files) have been copied to a hard disk directly attached
    to your SPARC system. It is important to note that the partition holding these
    files cannot be used for any other purpose during the installation (ie, it cannot
    be given a mount point during the installation). In addition, the partition must
    be in ext2 format.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# C.7 Installation Using a Serial Terminal


    # C.7 Installation Using a Serial Terminal


    You can also install Red Hat Linux/SPARC using a serial terminal attached to your
    SPARC system. Any terminal which can emulate a VT100 (or a computer with terminal
    emulation software) will work fine. Boot as you would normally, and at the SILO
    prompt encoder:


    ```

    linux serial

    ```


    The installation program runs on the first serial port at 9600 baud, 8 bits, parity,
    1 stop bit (often called 9600, 8, N, 1). The installation program can run in color,
    if your serial terminal supports color. Note that a computer running remit and
    connected to your SPARC system will display in color.


    At prompt dialog during a serial installation (any dialog with an OK button),
    you can press Ctrl+Z to start a subshell. To return to the installation program,
    enter exit at the shell prompt.


    When the installation is complete, simply boot normally, and Red Hat Linux will
    come up on your serial terminal.


    # C.8 Installation: Selecting System Components


    (For an explanation of system components, please see Section 4.6.1 on page 67.)


    **Important!** When selecting system components to install for Red Hat Linux/SPARC,
    choosing to install Everything without choosing Select individual packages could
    result in serious problems, and possibly an unbootable Red Hat Linux/SPARC system.
    Here is why:


    +   * The last kernel to be installed will be a multi-processor kernel, which
    will fail to work on sun4 machines.

    * The default X server will end up as XsunMono, which may not work for most people.


    If you wish to install Everything, choose Select individual packages as well.
    Then, deselect all the kernels except for one you wish to install (kernel-sparc'
  merge: -1
  img_proc: true
- pgno: 225
  md: "works for (most) and all X servers except the one for your hardware (XsunMono\n\
    for bwtwo video cards, Xsun for all 8-bit displays, and Xsun24 for the supported\n\
    24-bit displays).\n\n# C.9 SILO Configuration\n\nSILO configuration is nearly\
    \ identical to LILO configuration. See Section 5.8 on\npage 82 for more details.\n\
    \n**Please Note:**Unlike SILO, SILO cannot be configured to boot other operating\
    \ sys-\ntems the installation. However, information on configuring SILO to boot\n\
    other operating systems is available. Please read the file README in\n/usr/doc/silo*/docs\
    \ after installation.\n\n# C.10 Partitioning\n\nThere is one additional step required\
    \ when partitioning a hard drive for Red Hat\nLinux/SPARC. You must create the\
    \ third partition of every disk as type Whole\nDisk spanning from cylinder 0 to\
    \ the end of the disk. It shouldn't be used in any\nway, but it must exist. You\
    \ can create other partitions as you normally would.\n\nNote that this partition\
    \ will already exist on any disk that has been used under\nSunOS or Solaris. If\
    \ you are partitioning a new disk, you can use fdisk’s\"\ncommand to create a\
    \ standard disk label (which includes the whole-disk partition).\nIf you don't\
    \ care for the size of the other partitions created by \"s\", you can delete\n\
    those partitions and recreate them with the sizes you want.\n\n# C.10.1 Swap Partitions\
    \ and Red Hat Linux/SPARC\n\nBecause of the way disk partitioning is done, if\
    \ the first partition on a disk starts\nat cylinder 0, and is used for swap space,\
    \ it will overwrite the drive's partition table.\nThis is a bad thing. Therefore,\
    \ you have two options:\n\n+   - Do not use the first partition for swap.\n- Use\
    \ the first partition for swap, but when you create it, start it at cylinder 1\n\
    \  instead of cylinder 0."
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Either approach will save your drive''s partition table.


    # C.11 X Windows


    There is no mouse or X windows config on the SPARC. The 8 bit server is installed
    by default. If you want to use the 24 bit server (for TCX cards), you need to
    install the Xsun24 package. If you only have a bwtwo framebuffer and want to increase
    performance, install the XsunMono package. Installing both of the above requires
    you to restart X windows. Also, you can install the Xsun package if you use one
    of the above servers.'
  merge: -1
