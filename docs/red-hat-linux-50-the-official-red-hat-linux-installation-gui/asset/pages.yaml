    # 11.4.5 More Information


    This is just an introduction to PAM. More information is included with the system
    in /usr/doc/pam*, including a System Administrators'' Guide, a Module Writers''
    Manual, an Application Developers'' Manual, and the PAM standard, DCE-RFC 86.0.
    In addition, documentation is available from the Red Hat web site, http://www.redhat.com/linux-info/pam/


    # 11.5 The Boot Process, Init, and Shutdown


    # 11.5.1 System V Init


    This section is a brief description of the internals of the boot process. It basically
    covers in how the machine boots using SysV Init and the differences between the
    original init used in older Linux releases.


    Init is the program that runs by the kernel at boot time. It is in charge of starting
    all the normal processes that need to run at boot time. These include the gettyys
    allow you to log in, NFS daemons, FTP daemons, and anything you want to run when
    your machine boots.


    SysV Init is fast becoming the standard in the Linux world to control the startup
    of software at boot time. This is because it is easier to use and more powerful
    and'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 11.5 The Boot Process, Init, and Shutdown


    flexible than the traditional BSD init.

    SysV init also differs from BSD init in that the config files are in a subdirectory
    of

    /etc instead of residing directly in /etc. This directory is called rc.d. In there

    You will find rc.sysinit and the following directories:


    ```

    init.d

    rc0.d

    rc1.d

    rc2.d

    rc3.d

    rc4.d

    rc5.d

    rc6.d

    ```


    init.d contains a bunch of scripts. Basically, you need one script for each service

    y may need to start at boot time or when entering another runlevel. Services

    include things like networking, nfs, sendmail, httpd, etc. Services do not include

    th like serial that may only be run once and then exited. Things that

    should go in rc.local or rc.serial.


    If you want rc.local, it should be in /etc/rc.d. Most systems include one

    even though it doesn''t do much. You can also include an rc.serial in /etc/rc.d

    if you need to do serial port specific things at boot time.


    The chain of events is as follows:


    +   - The kernel looks in several places for init and runs the first one it finds

    - init runs /etc/rc.d/rc.sysinit

    - rc.sysinit does a bunch of necessary things and then runs rc.serial

    (if it exists)

    - init runs all the scripts for the default runlevel.

    - init runs rc.local


    The default runlevel is decided in /etc/inittab. You should have a line close

    to the top level like:


    ```

    id:3:initdefault:

    ```'
