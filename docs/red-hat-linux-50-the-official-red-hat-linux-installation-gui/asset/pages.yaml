- pgno: 46
  md: '# 2.4 Disk Partitions


    # 2.4.3 One Last Wrinkle: Using LILO


    LILO (the Linux LOader) is the most commonly used method to boot Red Hat Linux
    on Intel-based systems. using only the Basic I/O System (or BIOS) built into the
    computer hardware itself. The remainder of this section is entirely Intel-specific,
    and need not be read by Alpha or SPARC owners, who may skip ahead to Section 2.4.4
    on the following page.


    # BIOS-Related Limitations Impacting LILO


    LILO is subject to some limitations imposed by the BIOS in most Intel-based computers.
    Specifically, most BIOSes cannot access more than two hard drives and they can''t
    access any data stored beyond cylinder 1023 (the 1024th cylinder) of any drive.
    Note that some recent BIOSes do not have these limitations, but this is by no
    universal means.


    All the data LILO needs to access at boot time (including the Linux kernel) are
    located in the /boot directory, which is normal part of the root part partition
    (known as/). Here are the guidelines you must follow if you are going to use LILO
    to boot your Red Hat Linux system:


    On First Two IDE Drives – If you have 2 IDE (or EIDE) drives, /boot must be located
    on one of them. Note that this two-drive limit also includes any IDE CD-ROM drives
    on your primary IDE controller. So, if you have one IDE hard drive, and one IDE
    CD-ROM on your primary controller, /boot must be located on the first hard drive
    only, even if you have other hard drives on your secondary IDE controller.


    On First IDE Or First SCSI Drive – If you have one IDE (or EIDE) and one or more
    SCSI drives,/boot must be located either the IDE drive or the SCSI drive at ID
    0. No other SCSI IDs will work.


    On First Two SCSI Drives – If you have one SCSI hard drives, /boot must be located
    on a drive at ID 0 or ID 1. No other SCSI IDs will work.


    Partition Completely Below Cylinder 1023 – No matter which of the above configurations
    apply, the partition that holds/boot must be located entirely below cylinder 1023.
    If the partition holding /boot straddles cylinder 1023,'
  merge: -1
  img_proc: true
