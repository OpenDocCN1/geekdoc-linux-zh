  img_proc: true
- pgno: 249
  md: 'If you have a standard MILO image available (say MILO.dd) then you would build
    a boot block floppy using the following command:


    ```

    dd if=MILO.dd of=/dev/fd0

    ```


    # E.5.5 Loading MILO from Flash


    There are a number of systems where MILO can be blown into flash and booted directly
    (instead of via the Windows NT ARC firmware):


    +   * AlphaPC64 (Section E.5.7)

    * Noname (Section E.5.7)

    * EB66+ (Section E.5.7)

    * EB164 (Section E.5.7)

    * PC164 (Section E.5.7)


    # E.5.6 Loading MILO from the SRM Console


    The SRM (short for System Reference Manual) Console knows nothing about files-ystems
    or disk-partitions, it simply expects that the secondary bootstrap loader occupies
    a consecutive range of physical disk sectors starting from a given offset. The
    information describing the secondary bootstrap loader (its size and offset) is
    given in the 512 byte block. To load MILO via the SRM you must generate that structure
    on a device which the SRM can access (such as a floppy disk). This is what mboot
    and bootm, mboot is the first block (or boot description) and mboot is the MILO
    image rounded up to a 512 byte boundary.


    To load MILO from a boot block device, either build mboot and bootm and push them
    onto the boot device using the following command:


    ```

    $ cat mboot bootm > /dev/fd0

    ```


    Or, grab the appropriate MILO.dd from a web site and write it onto the boot device
    using either RAWWRITE. EXE or dd.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# 5 How To Load MILO


    Once you have done that you can boot the SRM console and use one of its many commands
    to boot MILO. For example, to boot MILO from a boot block floppy you would use
    the following command:


    ```

    >>>boot dva0

    (boot dva0.0.0.0.1 -flags 0)

    block 0 of dva0.0.0.0.1 is a valid boot block

    reading 621 blocks from dva0.0.0.0.1

    bootstrap code read in

    base = 112000, image_start = 0, image_bytes = 4da00

    initializing HWRFB at 20000

    initializing page table at 104000

    initializing machine state

    setting affinity to the primary CPU

    jumping to bootstrap code

    MILO Stub: V1.1

    Unzipping MILO into position

    Allocating memory for unzip

    ####...

    ```


    The following systems are known to have SRM Console support:


    +   * Noname (Section E.5.7)

    * AlphaPC64 (Section E.5.7)

    * EB164 (Section E.5.7)

    * PC164 (Section E.5.7)


    # E.5.7 System Specific Information


    # AxpPCI33 (Noname)


    The Noname board can load MILO from the Windows NT ARC firmware (Section E.5.1),
    from the SRM Console (Section E.5.6), and from a failsafe boot block floppy (Section
    E.5.4). A flash management utility, runnable from MILO is available so that once
    MILO is running, it can be blown into flash (Section E.7). However, be warned
    that once you have done this you will lose the previous image held there as there
    is only room for one image.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'The way that Noname boots is controlled by a set of jumpers on the board, J29
    and J28. These look like:


    | J29 | 2 x x x 6 |

    | | 1 x x x 5 |

    | J28 | 2 x x x 6 |

    | | 1 x x x 5 |


    The two options that we''re interested in are J28, pins 1-3 which boots the console/loader
    from flash and J29, pins 1-3 which boots the console/loader from a boot block
    floppy. The second option is the one that you need to first boot MILO on the Noname
    board.


    Once you''ve selected the boot from floppy option via the jumpers, the SRM block
    floppy containing MILO into the floppy and reboot. In a few seconds (after the
    floppy light goes out) you should see the screen blank to white and MILO telling
    you what''s going on.


    If you are really interested in technical stuff, the Noname loads images off the
    floppy into physical address 0x104000 and images from flash into 0x100000. For
    this reason, MILO is built with its PALCode starting at 0x200000. When it is first
    loaded, it moves itself to the correct location (see relocate.5)


    # AlphaPC64 (Cabriolet)


    AlphaPC64 includes the Windows NT ARC firmware (Section E.5.1), the SRM Console
    (Section E.5.6) and the Evaluation Debug Monitor (Section E.5.3). These images
    are in flash and there is room to add MILO so that you can boot MILO directly
    from flash. A flash management utility, runnable from MILO is available that once
    MILO is running, it can be blown into flash (Section E.7). This system supports
    MILO environment variables.


    You select between the boot options (and MILO when it is put into flash) using
    a combination of jumpers and a boot option which is saved in the NVRAM of the
    TOY clock.


    The jumper is J2, SP bits 6 and 7 have the following meanings:


    +   * SP bit 6 should always be out. If this jumper is set out then the SROM mini-'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# E How To Load MILO


    debugger gets booted,


    +   - SP bit 7 is in boot image selected by the boot option byte in the TOY clock,

    - SP bit 7 out is boot first image in flash.


    So, with bit 7 out, the Debug Monitor will be booted as it is always the first
    image in flash. With bit 7 in, the image selected by the boot option in the TOY
    clock will be selected. The Debug Monitor, the Windows NT ARC firmware and MILO
    all support setting this boot option byte but you must be very careful using it.
    In particular, you cannot set the boot option that the next system boots MILO
    when you are running the Windows NT ARC firmware, it only allows you to test Debug
    Monitor or Windows NT ARC as boot options.


    To get MILO into flash via the Evaluation Board Debug Monitor, you will need a
    flashable image. The build procedures give MILO.rom, but you can also make a rom
    image using the maker tool in the Debug Monitor software that comes with the board:


    ```

    > makerom -v i7 -i200000 MILO -o mini.flash

    ```


    (type makerom to find out what the arguments mean, but 7 is a flash image used
    by the s and -i200000 gives the load address for the image as 0x200000).


    Load that image into memory (via the Debug Monitor commands fload, netload, and
    so on) at 0x200000 and then blow the image into flash:


    ```

    AlphaPC64> flash 200000 8

    ```


    (200000 is where the image to be blown is in memory and 8 is the segment number
    where you put the image. There are 1024*64 byte segments in the flash and the
    Debug Monitor is at seg 0 and the Windows NT ARC firmware is at seg 4).


    Set up the image that the srom will boot by writing the number of the image into
    the TOY clock.


    ```

    AlphaPC64> bootopt 131

    ```


    (131 means boot the 3rd image, 129 = 1st, 130 = 2nd and so on).


    Power off, put jumper 7 on and power on and you should see the MILO burst into
    life. If you don''t take jumper 7 back off and reboot the Debug Monitor.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# EB66+


    The EB66+, like all of the Alpha Evaluation Boards built by Digital contains the
    Evaluation Board Debug Monitor and so this is available to load MILO (Section
    E5.3). Often (although not always) boards whose design is derived from these include
    the Debug Monitor also. Usually, these boards include the Windows NT ARC firmware
    (Section E5.1). A flash management utility, runnable from MILO is available so
    that once MILO is running, it can be blown into flash (Section E.7). This system
    supports MILO environment variables.


    These systems have several boot images in flash controlled by jumpers. The two
    jumper banks are J18 and J16 and are located at the bottom of the board in the
    middle (if the Alpha chip is at the top). You select between the boot options
    (and MILO when it is put into flash) using a combination of jumpers and a boot
    option which is saved in the NVRAM of the TOY clock.


    Jumper 7-8 of J18 means the boot image described by the boot option. Jumper 7-8
    of J18 means out the Evaluation Board Debug Monitor.


    Blowing an image into flash via the Evaluation Board Debug Monitor is exactly
    the procedure for for the AlphaPC64 (Section E5.7).


    # EB64+/Aspen Alpine


    This system is quite like the AlphaPC64 except that it does not contain flash
    MILO can be loaded from. The EB64+ has two ROMs, one of which contains the Windows
    NT ARC firmware (Section E5.1) and the other contains the Evaluation Board Debug
    Monitor (Section E5.3).


    The Aspen Alpine is a little different in that it has only one ROM; this contains
    the Windows NT ARC firmware.


    # Universal Desktop Box (Multia)


    This is a very compact pre-packaged 21066 based system that includes a TGA (21030)
    graphics device. Although you can just fit a half height PCI graphics in the box
    you are better off waiting for full TGA support in XFree86. It includes the Windows
    NT ARC firmware and so booting from that is the prefered method (Section E.1).'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# How To Load MILO


