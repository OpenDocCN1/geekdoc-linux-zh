- pgno: 210
  md: '# Making Installation Diskettes


    While the Red Hat Linux/Intel boxed set includes boot and supplemental diskettes,
    this is not the case for the Alpha and SPARC version of Red Hat Linux. In addition,
    people attempting to install Red Hat Linux/Intel may need to use updated diskette
    images obtained from the Red Hat Linux Errata. Therefore, it is sometimes necessary
    to create a diskette from an image file.


    As the name implies, an image file is a file that contains an exact copy (or image)
    of a diskette''s contents. Since a diskette contains filesystem information in
    addition to the data contained in the files, the image file is not usable until
    it has been written to a diskette.


    To start, you''ll need a blank, formatted, high-density (1.44 MB), 3.5-inch diskette.
    You''ll need access to a computer with a 3.5-inch diskette drive, and capable
    of running a DOS program, or the dd utility program found on most Linux-like operating
    systems.


    The image files are found in the following directories on your Red Hat Linux CD:


    +   - images – Contains the boot and supplemental images for Red Hat Linux/Intel,
    and the various kernel and ramdisk images for Red Hat Linux/Alpha. On the Red
    Hat Linux/SPARC CD, this directory contains the boot image, and'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# an image for network booting.


    +   - milo--Contains the various images for the Red Hat Linux/ Alpha miniloader,

    MILO. This directory exists only on Red Hat Linux/ Alpha CDs.


    Once you''ve selected the proper image, it''s time to transfer the image file
    onto a diskette. As mentioned previously, this can be done on a DOS-capable system,
    or on a system running a Linux-like operating system.


    # B.1 Making a Diskette Under MS-DOS


    To make a diskette under MS-DOS, use the rawwrite utility included in the Red
    Hat Linux CD in the dosutils directory. First, label a blank, formatted 3.5-inch
    diskette appropriately (eg. "Boot Diskette", "Supplemental Diskette", etc). Insert
    it into the diskette drive. Then, use the following commands (assuming your CD
    is drive d):


    ```

    C:\> d:

    D:\> cd dosutils

    D:\dosutils> rawwrite

    Enter image source file name: ..images\boot.img

    Enter target diskette drive: a:

    nPlease insert a formatted diskette into drive A: and

    press --ENTER-- : EnternD:\dosutils>

    ```


    rawwrite asks you for the filename of a diskette image; and name of the image
    you wish to write (for example, ..images/boot.img). Then rawwrite asks for a diskette
    drive to write the image to enter a:. Finally, rawwrite asks for confirmation
    that a formatted diskette is in the drive you''ve selected. After pressing Enter
    to confirm, rawwrite copies the image file onto the diskette. If you need to make
    another diskette, label another diskette, and run rawwrite again, specifying the
    appropriate image file.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# B.2 Making a Diskette Under a Linux-like O/S


    To make a diskette under Linux (or any other Linux-like operating system), you
    must have permission to write to the device representing a 3.5-inch diskette drive
    (known as /dev/fd0 under Linux). First, label a blank, formatted diskette appropriately
    (e.g., "Boot Diskette", "Supplemental Diskette", etc). Insert it into the diskette
    drive (but don''t issue a mount command). After mounting the Red Hat Linux CD,
    change directory to the directory containing the desired image file, and use the
    following command (changing the name of the image file and diskette device as
    appropriate):


    ```

    # dd if=boot.img of=/dev/fd0 bs=1440k

    ```


    If you need to make another diskette, label another diskette, and run dd again,
    specifying the appropriate image file.'
  merge: -1
  img_proc: true
