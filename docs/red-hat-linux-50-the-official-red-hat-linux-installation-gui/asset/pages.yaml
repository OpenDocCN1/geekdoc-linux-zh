    Be sure to mention the manual''s title, along with your suggestion. If you''ve
    found an error, please include the page number so we can find it easily. We may
    not be able to respond to every message sent to us, but you can be sure that we''ll
    be reading them all!


    # I Couldn''t Have Done it Without...


    Thanks go out to the past authors of this manual. A great deal of their work is
    still here. A great, big "Thank You" is also owed to the Red Hat Linux 5.0 development
    team for putting up with the many questions, comments, and pleading requests for
    reviews of this manual. Thanks, guys!


    Last but far from least is the support group at Red Hat Software. They have given
    many insightful suggestions regarding this manual, based on extensive experience
    with thousands of Red Hat Linux customers. So if you find yourself breezing through
    the installation chapters, it''s due in no small part to their input. I thank
    them.


    Edward C. Bailey'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1 New Features Of Red Hat Linux 5.0


    This chapter describes features that are new to Red Hat Linux 5.0.


    # 1.1 Installation-Related Enhancements


    There have been many changes made to make the Red Hat Linux installation process-
    easier. Here''s a list:


    +   * Automatic probing of PCI devices

    * Expert installation mode

    * Kickstart installation mode

    * New method of configuring partitions and mount points

    * Daemons can be configured to run at boot or not

    * Enhanced XFree86 configuration'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.1.1 Automatic Probing of PCI devices


    The installation program can probe computers with PCI devices. If desired, auto-probing
    can be disabled by running the installation in expert mode (see Section 1.1.2).


    # 1.1.2 Expert Installation Mode


    By entering at expert at boot: prompt, you can run the installation program in
    expert mode. Expert mode causes the installation program to revert to an installation
    style very similar to that used with Red Hat Linux 4.2. This means that most of
    the new auto-probing code is replaced with dialog boxes that prompt the user to
    manually enter device information. These dialog boxes also include a field allowing
    the user to enter options to be passed to the driver module being loaded. Therefore,
    if a particular hardware configuration requires module options, an expert-mode
    installation should be used.


    # 1.1.3 Kickstart Installation Mode


    It''s possible to automate Red Hat Linux installations using kickstart mode. Instead
    of asking the user questions during the installation, kickstart mode reads a file
    that contains all the information necessary to install Red Hat Linux. This is
    handy when installing many similarly-configured systems. For more information
    on kickstart mode, please read /doc/README.ks on the Red Hat Linux CD-ROM.


    # 1.1.4 Configuring Partitions and Mount Points


    In the past, the installation program used fdisk to set up disk partitions, and
    a series of dialog boxes to define mount points. While functionality is still
    available in Red Hat Linux 5.0, there is an alternative. Disk Druid provides both
    mount point and partition configuration in one concise screen. In addition, Disk
    Druid supports the concept of "growable partitions" – partitions that can grow
    beyond a minimum size to allocate all remaining space on a hard disk.


    For more information on Disk Druid, please refer to Section 4.3.1 on page 54.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.2 New User-Mode Tools


    > Disk Druid is not available under the Red Hat/SPARC installation program.


    # 1.1.5 Configuring Services to Run at Boot Time


    In prior versions of Red Hat Linux, if you installed a particular service (such
    bind, samba, etc.) while installing Red Hat Linux, that service configured to
    automatically start once the installation was complete and the system rebooted.
    Now, you will have the option, during the installation, to select which services
    should start and which should not. During the installation, you will be asked
    to select which services should be started whenever the system is booted. For
    more information, refer to Section 5.5 on page 76.


    # 1.1.6 Enhanced XFree86 Configuration


    The XFree86 configuration utility XConfigurator has been enhanced. It will now
    attempt to probe your system to automatically determine what type of video card
    is installed. In addition, XConfigurator will now determine the optimal display
    resolution and color depth for your hardware configuration.


    # 1.2 New User-Mode Tools


    One of the biggest stumbling blocks to a new Red Hat Linux user is that many tasks
    can only be performed by the root account, by knowing an arcane set of commands,
    or both. To make life easier, there are several new tools that can be used by
    any user to perform common tasks:


    +   * User information tool

    * User password tool

    * Filesystem mount tool

    * Network device tool'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 1.2.1 User Information Tool


    The user information tool is used to set the “gecos” information in a user’s password
    record. Figure 1.1 shows it in action.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_21_0.png)


    Figure 1.1: User Information Tool


    As you can see, you can enter your:


    +   - Full Name

    - Office

    - Office Phone

    - Home Phone

    - Shell


    To use this tool, run /usr/bin/userinfo.


    # 1.2.2 User Password Tool


    As the name implies, the user password tool is used to change passwords. The tool
    displays a pop-up message identifying the user whose password is being changed,
    followed by prompts for the current and new password. To use the password tool,
    run /usr/bin/userpasswd.'
