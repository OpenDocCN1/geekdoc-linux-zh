- pgno: 157
  md: 'Printer Device: Usually /dev/lp1, the name of the port which the printer is
    attached to. Serial printers are usually on /dev/ttyS0 ports. You need to manually
    configure serial parameters.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_157_0.png)


