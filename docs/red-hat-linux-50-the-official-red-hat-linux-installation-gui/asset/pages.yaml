- pgno: 294
  md: '# Red Hat and Freerely

    Distributable Software.


    # I.0.1 Red Hat History


    Linux, like Unix itself, is a very modular operating system. The skills required
    to select, compile, link, and install, the various components that are needed
    for a complete Linux OS are beyond the experience of most people who might want
    to use Linux. The various Linux distributions go a long way towards solving this
    for the average Linux user, but most do not address the problem of how to upgrade
    your Linux system once you get it successfully installed. Most users found it
    easier to delete their whole Linux system and reinstall from scratch when they
    needed to upgrade.


    The Red Hat distribution makes Linux easier to install and maintain by providing
    the user with advanced package management, graphical (point and click!) system
    installation and control, and system administration tools.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '278


    Red Hat and Freely Distributable Software.


    # I.1 The Free Software Model


    Probably the best feature of Linux and the GNU utilities in general and Red Hat
    Linux in particular is that it is distributable under the terms of the GNU Public
    License (GPL). This feature has allowed research institutions, universities, commercial
    enterprises, and hackers, to develop and use Red Hat Linux and related technologies
    co-operatively without fear that their work would someday be controlled and restricted
    by a commercial vendor.


    In short, the GPL changes the model of software development and distribution to
    one much like the model our Legal system and its industry uses. If a lawyer signs
    an argument that wins his case in front of the supreme court his reward is not
    only the fees he pays but also the additional clients that his achievement attracts
    to his practice. The “argument” he used becomes available for any other lawyer
    to use without restriction, and in fact becomes part of our collective legal heritage.


    This new model is already a new industry with companies like Cygnus Support (see
    http://www.cygnus.com) being multi-million dollar enterprises on the basis of
    providing support and services for large commercial enterprises of GPL''d and
    other “freely distributable” software. Red Hat Software, Inc.’s rapid growth is
    based, similarly, on our development and support of the Red Hat Linux distribution,
    a product that we distribute worldwide on CD and over the Internet under the terms
    of the GPL.


    # I.2 The Evolution of “Free Software”


    The Unix operating system was also developed on a cooperative basis by AT&T with
    the active support of many universities and research establishments. Many of the
    early Unix contributors were disappointed when AT&T began in the late 1970''s
    and 1980''s, to enforce their copyright terms over the use and distribution of
    Unix. This eventually resulted in the long and bitter legal battle between AT&T
    (and subsequently Novell who bought the Unix copyrights from AT&T in 1991) and
    the University of California at Berkeley. In a partial resolve to this problem
    of individual control of a public software development project, the Massachusetts
    Institute of Technology (MIT) in Cambridge, MA has, since 1984, supported Richard
    Stallman’s efforts to launch a movement in the software development community
    to support the development of free software. This resulted in the establishment
    of The Free Software Foundation (the FSF), and its GNU project. The name GNU'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# 1.3 The GNU Public License


    follows in an early Unix tradition of recursive acronyms as program names, and
    stands for GNU''s Not Unix. The FSF continues to be head-quartered at MIT, and
    has enjoying amazing success over the last decade with products like GNU C, C++,
    Emacs, and many other products, which of form substantial and key building blocks
    of the Linux operating system. Richard Stallman insists, with some justification,
    that Linux should correctly be known as a GNU system.


    There are many other "free software" licenses that are of the code in Red Hat
    Linux has been licensed under. The most popular of these are the University of
    California at Berkeley BSD License where the copyright holder remains the owner
    but with no restrictions on further distribution are imposed on the user of the
    code.


    Also coming from MIT, but not related to the FSF or the GPL, is the X Consortium,
    which is an industry sponsored effort to build and maintain the X Window System.
    In turn, a group called the XFree Project has on the responsibility to port the
    X Window System to the Intel platform. We have included copies of each of these
    licenses in the appendix of this manual for your convenience. Linux is continuing
    to progress very rapidly because of the contributions of this world wide development
    effort, to you and your company or school are encouraged to contribute.


    # I.3 The GNU Public License


    Red Hat Software, Inc., has chosen to license its code under the GPL for two reasons.
    One is that this is the easiest thing to do since the Linux kernel is licensed
    this way and our code interacts with other GPL''d code sufficiently to make any
    other Licensing scheme difficult. The other is that for the purpose of cooperative
    development purposes we genuinely feel that the GPL is in fact the most effective
    license format.


    The purpose of the GPL is like any standard copyright license, to define what
    you can and cannot use the product for. However it differs substantially from
    commercial licenses because instead restricting the use of its software purpose
    is to guarantee your use of the software.


    In no way we restrict the use of standard commercially licensed software with
    Linux or other GPL''d code. Only the changes that you make to the code that you
    "borrowed" from someone else that was licensed under the GPL must be made available
    to others under the same unrestricted rules defined by the GPL. Any'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'product that simply uses or operates on top of Linux can be licensed under
    any commercial rules you chose.


    There are many leading commercial software developers who are actively supporting
    their commercial products on Linux for which you must purchase a license, such
    as Motif from the OSF, Empress RDBMS from Empress Software, WordPerfect, and recently
    Appliquare - the Office Suite from Apprix Inc. and Red Hat Software. You will
    find a complete copy of the GPL in section J.


    # 1.4 Will Linux Replace Commercial OSes?


    The huge development effort and will distribution of the Linux OS will ensure
    that it takes its place as a real, viable, and significant alternative to commercially
    restricted operating systems. The open development model, availability of source,
    and lack of license restrictions are “features” of the Linux OS that commercial
    OS developers simply cannot offer. Software development groups who need this model
    include groups from government affiliated research organizations, to academic
    research and teaching projects, to commercial software application developers.


    The recent rapid increase in new applications becoming available for Linux and
    the rapidly growing user base of these technologies are causing even the largest
    computer industry organizations to take Linux seriously. Even Datapro (a McGraw-Hill
    Company) in their recent 1996 Survey of the UNIX industry included that: “Programmers
    are taking a hard look at the viability of Linux on production platforms now cost
    less than Microsoft and has added the benefits of UNIX, such as great performance,
    inherent power tool sets, and communication capabilities.


    The new distribution and development model that Linux, and other “freely distributable”
    software represent is the FSF''s GNU code, a new model that is already successfully
    competing with the older commercially-restricted model. There is an exciting future
    for these technologies that we are pleased you are now a part of.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# I.5 Red Hat Software, Inc.''s Role in Linux Development


    # I.5 Red Hat Software, Inc.''s Role in Linux Development


    The Red Hat Linux distribution is also issued under the GPL. We see our role as
    making the Linux OS easy to install, configure, and maintain for professional
    developers, system administrators, and students. Red Hat Linux is available at
    no cost and few restrictions (the GPL) on many fpt sites on the Internet. It is
    also available on CD from Red Hat Software http://www.redhat.com or (919) 547-0012
    and from most of the Red Hat CD vendors.


    Red Hat Software, Inc. provides support for users of the Linux OS, from individuals
    running a single workstation to large organizations running hundreds of networked
    machines, in a variety of programs.


    We gratefully acknowledge the support that we have received from the Linux development
    community including Lin Torvalds, everyone on the Linux contributors list, and
    the thousands of developers who helped make Linux today. We would also like to
    acknowledge the growing contribution of commercial developers to our efforts including
    Digital Equipment Corporation, O''Reilly & Associates, Metro Linux, and many others.
    We are encouraged to use Red Hat''s Linux distribution, to develop and add features,
    or simply package programs that you need or that you think others would appreciate.
    Please do not hesitate to contact us for any help you require.


    You can contact Red Hat Software directly at: info@redhat.com.


    # I.6 Further Reading


    There are Internet listings of both the freely distributable, and commercial software
    available for Linux in documents such as the Linux Journal, the Commercial HOWTO,
    the Linux Software Map, and from many Linux vendors, including Red Hat Software''s
    retail division. Many third party and commercial products can be purchased through
    Red Hat''s web site, including Motif, database development systems, editors, and
    more. Info can be obtained by a fax request to (919) 572-6726, and the web site
    is located at http://www.redhat.com.


    For more information on Linux see:


    +   - Running Linux, M. Welsh, O''Reilly & Associates, 1995.'
