  md: '# 11.1.2 /usr/local in Red Hat Linux


    Red Hat Linux, the intended use for /usr/local is slightly different from that
    specified by the FSSTND. The FSSTND says that /usr/local should be where your
    store software that is to remain safe from system software upgrades. Since system
    upgrades from Red Hat Software are done safely with the RPM system and Glint,
    you don''t need to protect files by putting them in /usr/local. Instead, we recommend
    you use /usr/local for software that is local to your machine.


    For instance, let''s say you have mounted /usr via read-only NFS from beavis.
    If there is a package or program you would like to install, but you are not allowed
    to write to beavis, you should install it under /usr/local. Later perhaps, if
    you''ve managed to convince the system administrator of beavis to install the
    program on /usr, you can uninstall it from /usr/local.


    # 11.2 Special Red Hat File Locations


    In addition to the files pertaining to the RPM system that reside in /var/lib/rpm
    (see chapter 8), there are two other special locations that are reserved for Red
    Hat Linux configuration and operation.


    The control-panel and related tools put lots of stuff in /usr/lib/rhs. There is
    probably nothing here that you would want to edit. It is mostly small scripts,
    bitmaps and text files.


    The other location, /etc/config, stores configuration information. The major of
    the files in this directory are the scripts that run at boot time. It is possible
    to edit these by hand, but it would be better to use the proper control-panel
    tool.


    # 11.3 Users, Groups and User-Private Groups


