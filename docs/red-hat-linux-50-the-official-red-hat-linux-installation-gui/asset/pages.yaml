    these include the Debug Monitor Also. Usually, these boards include the Windows
    NT ARC firmware (Section E.5.1). The SRM console is also available (Section E.5.6).
    A flash management utility, runnable from MILO is available so that once MILO
    is running, it can be blown into flash (Section E.7). This system supports MILO
    environment variables.


    These systems have several boot images in flash controlled by jumpers. The main
    jumper block, J30, contains the system configuration jumpers and jumper CF6 in
    the system that will boot the Debug Monitor, the default is out.


    Blowing an image into flash via the Evaluation Board Debug Monitor is exactly
    the same procedure as for the AlphaPC64 (Section E.5.7).'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# XL266


    XL266 is one of a family of systems that are known as Avanti. It has a riser card
    containing the Alpha chip and cache which plugs into the main board at angles.
    This board can replace the equivalent Pentium board.


    Some of these systems ship with the SRM console but others, notably the XL266
    ship with only the Windows NT ARC firmware (Section E.5.1).


    Here is my list of compatible systems:


    +   * AlphaStation 400 (Avanti),

    * AlphaStation 250,

    * AlphaStation 200 (Mustang),

    * XL. There are two flavours, XL266 and XL233 with the only difference being in
    processor speed and cache


    Note the system I use to develop and test MILO is an XL266 and so this is the
    only one that I can guarantee work. However, technically, all of the above systems
    are equivalent; they have the same support chipsets and the same interrupt handling
    mechanisms.


    # Platform2000


    This is a 233Mhz 21066 based system.


    # E.6 MILO''s User Interface


    Once you have correctly installed /loaded/run MILO you will see the MILO (for
    MiniLOader) prompt displayed on your screen. There is a very simple interface
    that you must use in order to boot a particular Linux kernel image. Typing “help”
    is a good idea as it gives a useful summary of the commands.


    # E.6.1 The "help" Command


    Probably the most useful command that MILO has:'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# E MILO''s User Interface


    MILO> help

    MILO command summary:


    +   ls [-t fs] [dev:[dir]]

    - List files in directory on device

    boot [-t fs] [dev:file] [boot]

    - Boot Linux from the specified device and file

    run [-t fs] dev:file

    - Run the standalone program dev:file

    show

    - Display all known devices and file systems

    set VAR VALUE

    - Set the variable VAR to the specified VALUE

    un VAR

    - Delete the specified variable

    reset

    - Delete all variables

    print

    - Display current variable settings

    help [var]

    - Print this help text


    Devices are specified as: fd0, hda1, hda2, sda...

    Use the ''-t filesystem'' option if you want to use

    anything but the default filesystem (''ext2'').

    Use the ''show'' command to show known devices and filesystems.

    Type ''help var'' for a list of variables.


    **Note** that the bootopt command only appears on AlphaPC64 (and similar) systems.
    Refer to the board''s documentation to find out what it means.


    **Devices.** Until you use a command that needs to make use of a device, no device
    initialisation will take place. The first show, ls, boot or run commands all cause
    the devices within MILO to be analysed. Devices are named in the same way (exactly)
    that Linux will name them. So, the first IDE disk will be called ''hda'' and its
    first partition will be ''hda1''. Use the show command to show what devices are
    available.


    **File Systems.** MILO supports three file systems, MSDOS, EXT2 and ISO9660. As
    long as a device is available to it, MILO can listboot or run an image stored
    on one of these file systems. MILO''s default file system is EXT2 and so you tell
    MILO that all of the commands that use filenames allow you to pass the file system
    using the -t [filesystem] option. So if you wanted to list the contents of a SCSI
    CD ROM, you might type the following:


    ```

    MILO> ls -t iso9660 scd0

    ```'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Alpha Miniloader Howto


    Variables. MILO contains some settable variables that help the boot process. If
    you are loading via the Windows NT ARC firmware, MILO makes use of the boot environment
    variables set up by that firmware. For some systems, MILO (for example, the AlphaPC64)
    maintains its own set of environment variables that do not change from boot to
    boot. These variables are:


    +   MILO> help var

    Variables that MILO cares about:

    MEMORY_SIZE - System memory size in megabytes

    BOOT_DEV - Specifies the default boot device

    BOOT_FILE - Specifies the boot string to pass to the kernel

    BOOT_STRING - SCSIN_HOSTID - Specifies the host id of the n-th SCSI controller

    PCI_LATENCY - Specifies the PCI master device latency

    AUTOBOT - If set, MILO attempts to boot on powerup

    and enters command loop only on failure.

    AUTOBOT_TIMEOUT - Seconds to wait before auto-booting on powerup.


    BEWARE of setting AUTOBOT without setting the timeout, you can end up automatically
    booting after a timeout of 0 seconds which may not be what you want.


    PCILLATENCY is the number of PCI cycles that PCI bus mastering device hangs on
    the PCI bus for once it has control. The default value for this is 32 and the
    maximum value is 255. Setting a high value means that each time a device gets
    control of the PCI bus it can transfer more data. However, setting it high also
    means that devices may have to wait longer to get control.


    # E.6.2 Booting Linux


    The boot command boots a linux kernel from a device. You will need to have a linux
    kernel image on an EXT2 formatted disk (SCSI, IDE or floppy) or an ISO9660 formatted
    CD available to MILO. The image can be gzip''d and in this case MILO will automatically
    gunzip it. Early versions of MILO recognised a gzip file by the .gz suffix but
    later MILOs look for magic numbers in the image.


    You should note that the version of MILO does not usually have to match the version
    of the Linux kernel that you are loading. Boot Linux using the following command
    syntax:'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# MILO''s User Interface


    ```

    MILO> boot [-t file-system] device-name:file-name \

    [ [boot-option] [boot-option] ...]

    ```


    device-name is the name of the file that you wish to use and file-name is the
    name of the file containing the Linux kernel. All arguments supplied after the
    file name are passed directly to the Linux kernel.


    If you are installing Red Hat, then you will need to specify a root device and
    so on. You would use:


    ```

    MILO> boot fd0:vmlinux.gz root=/dev/fd0 load_ramdisk=1

    ```


    MILO will automatically contain the block devices that you configure into your
    vmlinux. It has the floppy driver, the IDE driver and a number of SCSI drivers
    (for example, the NIC 810), and these work fine. Also, it is important to set
    the host id of the SCSI controller to a reasonable value. By default, MILO will
    initialize it to the highest possible value (7) which should normally work just.
    However, if you wish, you can explicitly set the host id of the n-th SCSI controller
    in the system by setting environment variable SCSIN_HOSTID to the appropriate
    value. For example, to set the horrid of the first SCSI controller to 7, you can
    issue the following command at MILO prompt:


    ```

    setenv SCSI0_HOSTID 7

    ```


    # E.6.3 Rebooting Linux


    You may want to reboot a running Linux system using the shutdown -r now command.
    In this case, the Linux kernel returns control to MILO (via the HALT CallPAL endpoint).
    MILO leaves a compressed copy of itself in memory for this reason and detects
    that the system is rebooted from information held in the HWRPB (Hardware Restart
    Parameter Block). In this case it starts to reboot using exactly the same command
    that was used to boot the Linux kernel the last time. There is a 30 second timeout
    that allows you to interrupt this process and boot whatever kernel you wish in
    whatever way you.


    # E.6.4 The "bootopt" command


    For flash based systems such as the AlphaPC64, EB164 and the EB66+, there are
    a number of possible boot options and these are changed using the bootopt com-'
  merge: -1
  img_proc: true
