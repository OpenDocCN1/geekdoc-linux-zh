- pgno: 278
  md: '# G.2.4 Modes


    The last section of the Xconfig file is the Mode database (Modes). It contains
    the VESA timing specifications for various resolutions. The default values work
    for most graphics cards, but they can be tweaked to center the image and adjust
    its size on the monitor. Most of the Metro-X servers use this database to configure
    the card for graphics mode. The modes indicate which clock to use from the displayConfig
    file''s CLOCKS line, and also show the horizontal and vertical timing values.
    More specifically, one of the examples are:


    ```

    ''''1024x768'''' 65 1024 1092 1220 1344 768 786 791 810

    ```


    The following table shows the definition of each Modes number from the prior example.


    | VALUE | Meaning |

    |---|---|

    | "1024X768" 65 | Screen Resolution in Pix Pixel Clock (MHz) |

    | 1024 | Pixels Displayed (H) |

    | 1092 | Sync Start (H) |

    | 1220 | Sync End (H) |

    | 1344 | Total (H) |

    | 768 | Pixels Displayed (V) |

    | 786 | Sync Start (V) |

    | 791 | Sync End (V) |

    | 810 | Total (V) |


    Figure G.3: Modes Definitions


    These numbers represent the electron beam traverses per one vertical refresh of
    the screen. They determine where the image is positioned on the screen, and what
    the refresh rate is.


    # Adjusting the Image Position


    You can edit the Modes numbers if the screen image does not properly center or
    fill the monitor screen. Be sure to center the image before stretching or shrinking.
    Any adjustments you make will go into effect after restarting the X server.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'Centering the Image: The Pixels Displayed numbers must match the desired physical
    screen resolution. The Sync Start and Sync End numbers must be increased or decreased
    (to left or right; up or down) at the same time and stay within the range of the
    Displayed and Total values.


    +   - Image too far right: To adjust an image that is too far to the right, increase
    the Horizontal Sync Start and Horizontal Sync End values equally.


    +   - Image too far left: To adjust an image that is too far to the left, decrease
    the Horizontal Sync Start and Horizontal Sync End values equally. For example,
    to adjust an image that is too far to the left, you can begin the process by adding
    8 to the two horizontal timing numbers (Sync Start and Sync End). Make sure that
    the Sync End number does not exceed the Horizontal Total number. The same technique
    applies for vertical positioning:


    +   - Image too low: To adjust an image that is too far to the bottom, decrease
    the Vertical Sync Start and Vertical Sync End values equally.


    +   - Image too high: To adjust an image that is too far to the top, increase
    the Vertical Sync Start and Vertical Sync End values equally. For example, to
    adjust an image that is too high, you could begin the process by adding 8 to the
    two vertical timing numbers (Sync Start and Sync End). Make sure that the Sync
    End number does not exceed the Vertical Total number.


    Stretching or Shrinking the Image: The Pixels Displayed numbers must match the
    desired physical screen resolution. The Total value is increased or decreased
    to stretch or shrink the image. In addition, to hold the center position, the
    Sync Start and Sync End numbers must be increased or decreased equally, based
    on one-half of the difference in the Total value. For instance, if you added 10
    to the Horizontal Total value, you would also add 5 to the Horizontal Sync Start
    value and 5 to the Horizontal Sync End values.


    +   - Image too narrow horizontally: To stretch an image that is too narrow horizontally
    (extra space appears on the left and right), increase the Horizontal Total by
    amount x, then add one-half of x to both the Horizontal Sync Start and Sync End
    values.


    +   - Image too narrow vertically: To stretch an image that is too narrow vertically
    (extra space appears on the top and bottom), increase the Vertical Total'
  merge: -1
  img_proc: true
