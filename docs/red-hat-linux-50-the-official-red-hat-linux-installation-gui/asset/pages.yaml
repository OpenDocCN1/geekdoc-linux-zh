- pgno: 203
  md: '# A.2 Getting Support


    As of July 1996, Red Hat Software put a new Technical Support system online. The
    support system automatically routes questions to support technicians. The document
    describes how to use the Red Hat Software technical support system.


    # A.2.1 Registration


    In order to receive technical support for your Red Hat Software product, you have
    to register it. Every official Red Hat product comes with a Registration Card.
    Your product registration number appears on both the detachable mail-in portion
    and on the top portion of this card. The product registration number uniquely
    identifies the product which you have purchased (such as Red Hat Linux) that includes
    30 days of free installation technical support by fax or email.


    # Registering via the Web


    Registering via the Web


    You can register your Red Hat Software product online at Red Hat’s World Wide
    Web site at http://www.redhat.com/support/register/. Choose Register a Product.
    Please enter all applicable information, and please be accurate with the system
    information. This information will aid in solving problems and answering questions
    more quickly and easily, and incorrect information benefits neither us our customers.
    Also, make sure the electronic mail address you give is correct. All support correspondence
    will be sent to that address. If this should change, please login to the registration
    pages and edit this information.


    Registration has changed. There will be no more answering ID numbers to remember.
    If you don''t have a current login to the support database, you will need to create
    one. Simply enter a name at the Support Login and click on the Create Login button
    to begin registration of your product. If you were already registered for support
    before August 14, 1997 you can login in by using your email address as your Support
    Login and your former support/customer ID as the password. The password can be
    changed once logged in. If you don''t remember it, follow the steps as if you
    never had a login, and re-enter the registration numbers and information.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# A.2 Getting Support


    # Registering via Email


    If you don''t have access to the World Wide Web, but you do have access to Internet
    mail, you can send registration details to register@redhat.com. Please include
    the following information:


    +   - Contact Information: name, address, city, state/province, country, zip/postal
    code, and telephone and fax numbers; also, support ID if you have one;

    - Product Information: name of product that you are registering, product registration
    number (very important!), architecture you''re using the product on (Intel, Alpha/AXP,
    or Sparc), and what you''re using the product for (File Server, Internet Server,
    Workstation, Home Computer, or Other);

    - System Information: CPU (i386, i486, i586, i686/PentiumPro, AXP21164, AXP21064,
    Spar4C, Spar4M), CPU speed (MHz), amount of RAM (MB), hard drives (number, size,
    type, partitions), video card, CD-ROM drive, and network card, and other hardware
    components (SCSI or ISDN adapters, etc.).


    # Registering via Fax or Snail Mail


    Although a mail-in portion is provided with your registration card, we do not
    recommend registering via fax or snail mail if you have access to either the World
    Wide Web or Internet mail; if you do, your registration is likely to be delayed
    considerably. If you do wish to register via fax, fax a copy of your registration
    card to Red Hat Software at +1-919-361-2711.


    # A.2.2 Support Questions


    Technical support is a black art: in most cases, support technicians rely solely
    on communication with the customer to solve installation problems on hardware
    the technicians have never physically seen. It is extremely important, therefore,
    to state your question clearly and concisely, including detailed information such
    as:


    +   - symptoms of the problem ("Red Hat Linux 5.0 doesn''t recognize my CD-ROM
    drive.")

    - when the problem began ("It stopped working yesterday ...")'
  merge: -1
  img_proc: true
