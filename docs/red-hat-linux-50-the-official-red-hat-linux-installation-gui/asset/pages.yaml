    see a cursor or highlight the **Yes** button. If you don''t see a cursor or highlight
    press `Tab` once to select No, and `Enter` to proceed.


    Next, the installation program displays a welcome message. Press `Enter` to begin
    the installation. If you wish to abort the installation process at this time,
    simply eject the boot diskette now and reboot your machine.'
