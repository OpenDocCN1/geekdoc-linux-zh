- pgno: 228
  md: '# Information specific to Red Hat Linux/Alpha


    # D.1 Introduction


    This appendix describes the differences between Red Hat Linux/Alpha and Red Hat
    Linux/Intel installations. While it provides a good overview of these differences,
    you will find it easier to read chapters 2, 3, and 6 in order. These chapters
    will refer you to the appropriate parts of this appendix at the appropriate time.


    In addition, the Linux/Alpha homepage at http://www.azstarnet.com/axplinux/ contains
    a wealth of information for people considering Red Hat Linux/Alpha.


    # D.2 Supported Hardware


    Red Hat Linux/Alpha supports a variety of hardware based on the Alpha processor
    and the PCI bus. The most recent list of hardware supported by Red Hat'
