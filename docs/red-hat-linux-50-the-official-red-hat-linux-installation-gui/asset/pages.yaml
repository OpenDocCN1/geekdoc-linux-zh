- pgno: 121
  md: '# Multiple-Screen Configuration


    Metro-X supports up to four screens which can all be controlled simultaneously
    with a single keyboard and mouse. This allows you to run many applications without
    overlapping windows, and is particularly useful for image-processing work. For
    each screen used, a separate configuration must be created for that screen''s
    monitor and graphics card. See section G.1.4 for graphics card requirements.


    # Adding a Screen


    Metro-X defaults to a single-screen setup. The first screen configured is labeled
    Screen 0. When you add a second screen, all of its configuration defaults will
    duplicate the current settings of Screen 0. If your hardware is the same on all
    screens, you can save time by configuring Screen 0 before adding the other screens.
    Similarly, as more screens are added, the settings of whichever one is currently
    active when you add another screen will determine the default settings of the
    new screen.


    +   1. Press Alt-S to display the Screen pull-down menu.

    2. Type A for Add.

    3. The Monitor and Graphics Card icons for Screen 0 become outlines, and two full-color
    icons appear for Screen 1.

    4. Refer to the procedures described earlier in this chapter if any changes need
    to be made to the new screen''s configuration.

    5. Use the Page Down Page Up keys to move to the configuration pages of each screen.


    # Deleting a Screen


    When a screen is deleted, all screens with higher screen numbers immediately drop
    one slot. For instance: You currently have screens 0, 1, and 2 configured and
    you delete screen 1. That screen and all of its configuration information disappears.
    Screen 2 becomes screen 1, but retains its own configuration. You are left with
    screens 0 and 1.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 6.3 X Window Configuration with Metro-X


    +   1. Use the Page Down or Page Up to activate the set of icons for the screen
    you want to delete.


    +   2. Press Alt-S to display the Screen pull-down menu.


    +   3. Type D for Delete.


    +   4. One set of Monitor and Graphics Card icons disappears. Higher-numbered
    screens (if any) immediately fill the gap of the deleted screen.


    # Screen Layout


    The Screen Layout window lets you specify how the multiple screens are arranged
    in your workspace so mouse movement from screen to screen will be appropriate.


    +   1. Press Alt-S to display the Screen pull-down menu.


    +   2. Type L for Layout.


    +   3. The Screen Layout window appears.


    +   4. Press to view the various layout combinations for your number of screens.


    +   5. When the layout you want is displayed, press Enter to select it.


    # Font Path


    If needed, you can edit your font path from within the Metro-X Configuration Utility.
    This will be necessary if you are using a font server instead of or in addition
    to your existing fonts.


    +   1. Press Alt-C to display the Configuration pull-down menu, then press Enter.


    +   2. The Font Path window appears.


    +   3. Edit the file as necessary for your system. Metro-X looks for fonts in
    the order in which the directories are listed in this file. If you are using a
    font server, enter this as the first line:


    ```

    tcp/<fontserver machine>:7000

    ```'
