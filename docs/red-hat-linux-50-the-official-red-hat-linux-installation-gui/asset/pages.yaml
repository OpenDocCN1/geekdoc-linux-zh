- pgno: 117
  md: '# Monitor configuration


    The default monitor setting is Generic 640x480 @ 60Hz 13 inch.


    +   1. Press ↓ to display the list of monitors.

    2. Press ↑ or ↓ to scroll to your monitor entry, then press Enter to select it.

    3. Press Tab to move to the next field.

    4. If you need to change the screen width (mm), edit it here.

    5. Press Tab to move to the next field.

    6. If you need to change the screen height (mm), edit it here.

    7. Press Tab to move to the next field.


    # Screen Saver


    Some graphics cards and monitors support the Display Power Management System (DPMS),
    which minimizes the power used by the monitor when user input ceases. If your
    hardware has this feature, the phases of DPMS can be controlled in this section.
    The typical DPMS setup has a cascade effect, with the various phases activated
    in succession with your choice of delay times between each.


    +   * X Screen Saver - Preliminary phase to DPMS, which blanks the screen but
    provides no power reduction.

    * Standby Mode - First phase of DPMS, which provides moderate power reduction
    by disabling the horizontal sync signal to the monitor.

    * Suspend Mode - Second phase of DPMS, which provides significant power reduction
    by disabling the vertical sync signal to the monitor.

    * Monitor Off - Final phase of DPMS, which provides maximum power reduction by
    disabling both the horizontal and vertical sync signal to the monitor.


    +   1. In the X Screen Saver Delay field, press Enter to toggle this on or off.

    2. If toggled on, press Tab to move to the Minutes field, then use ← or → to set
    the value.'
  merge: -1
  img_proc: true
