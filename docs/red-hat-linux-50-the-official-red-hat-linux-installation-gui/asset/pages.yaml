    # 4.6.1 Selecting Components


    Components group packages together according to the functionality they provide.
    For example, C Development, Networked Workstation, or Web Server. Select each
    component you wish to install and press Space. Selecting Everything (which can
    be found at the end of the component list) installs all packages included with
    Red Hat Linux (see Figure 4.15 on page 70).


    If you wish to select or deselect individual packages, choose Select individual
    packages.


    # 4.6.2 Selecting Individual Packages


    After selecting the components you wish to install, you may select or deselect
    individual packages. The installation program presents a list of the package groups
    available; select a group to examine and press Enter. The installation program
    presents a list of the packages in that group, which you may select or deselect
    Space by pressing F1 (see Figure 4.16 on page 71). You may view a detailed description
    of a package by pressing the Select Group dialog box.


    Please Note: Some packages (such as the kernel and certain libraries) are required'
