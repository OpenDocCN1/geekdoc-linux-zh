- pgno: 119
  md: '# Post Installation Configuration


    1. The default graphics card setting is IBM VGA.


    2. Press [I] to display the list of graphics cards.


    3. Press [↑] or [↓] to scroll to your graphics card entry, then press [Enter]
    to select it.


    4. Press [Tab] to move to the next field.


    # Colors


    Not all graphics cards can support all color depths (number of colors). Only the
    options for the color depths supported by your card will be sensitve in this field.
    The other options will be gray out.


    +   - Only one color option can be selected (due to design limitations of X).

    - In some cases the color options available will be limited by the physical resolution(s)
    you choose, based on the capabilities of your graphics card. Not all color depths
    are available at high resolutions.


    +   - The default setting is at the lowest value for your card.

    - Decide which available color setting you want to use.

    - Press [Tab] to move to that color setting, then press [Enter] to select it.
    (The previous setting will be canceled.)

    - Press [Tab] to move to the next field.


    # Virtual Resolution


    The Virtual Resolution setting allows you to have an on-screen work area that
    is actually larger than your physical screen. Windows can extend beyond the physical
    boundaries and are viewed by scrolling into the extended areas. Only the options
    for the virtual resolutions supported by your card will be sensitive in this field.
    The other options will be gray out. If you don''t want to use this feature, select
    the Disabled option.


    +   - Only one virtual resolution can be selected.'
