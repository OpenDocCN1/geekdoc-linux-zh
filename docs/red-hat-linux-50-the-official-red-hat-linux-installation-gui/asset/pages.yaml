- pgno: 195
  md: 'From this, you''d look in the second column and see that the default runlevel
    3, as should be the case for most systems. If you want to change it, you can edit
    /etc/inittab by hand and change the 3. Be very careful when you are messing with
    the inittab. If you mess up, you can fix it by rebooting and doing:


    LILO boot: linux single


    This would allow you to boot into single user mode so you can fix inittab.


    Now, how does it run all the right scripts? If you enter ls -l on rc3.d, you might
    see something like this:


    ```

    lrwxrwxrxrwx 1 root root 17 3:11 S10network --> ../init.d/network

    lrwxwxrxrwx 1 root root 16 3:11 S30syslog --> ../init.d/syslog

    lrwxwxrxrwx 1 root root 14 4:32 S40cron --> ../init.d/cron

    lrwxwxrxrwx 1 root root 14 3:11 S50init --> ../init.d/init

    lrwxwxrxrwx 1 root root 13 3:11 S60nfs --> ../init.d/nfs

    lrwxwxrxrwx 1 root root 15 3:11 S70nfs --> ../init.d/nfsfs

    lrwxwxrxrwx 1 root root 18 3:11 S91lpd --> ../init.d/lpd

    lrwxwxrxrwx 1 root root 11 3:11 S99local --> ../rc.local

    ```


    What you''ll notice is that there are no real "files" in the init.d directory.
    Everything is a link to one of the scripts in the init.d directory. The links
    also have an "S" and a number at the beginning. The "S" means to start this particular
    script and a "K" would mean to stop it. The number is just for ordering purposes.
    Init will start all the services based on the order they appear. You can duplicate
    numbers, but it will onify confuse you somewhat. You just need to use a two digit
    number only, along with an upper case "S" or "K" to start or stop the services
    you need to.


    How does init start and stop services? Simple. Each of the scripts is written
    to accept an argument which can be "start" or "stop". You execute these scripts
    by hand with a command like:


    ```

    /etc/rc.d/init.d/httpd.init stop

    ```


    to stop the httpd server. Init reads the name and if it has a "K", it calls the
    script with the "stop" argument. If it has an "S" it calls the script with a "start"
    argument. Why all these runlevels? Some people want an easy way to set up machines
    to be multi-purpose. I could have a "server" runlevel that runs httpd, sendmail,
    networking, etc. Then I could have a "user" runlevel that runs xdm, networking,
    etc.'
