  md: '# 4.3 Creating Partitions for Red Hat Linux


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_80_0.png)


    Figure 4.9: Sample Output From fdisk


    # Numbering Partitions


    Linux refers to divide partitions using a combination of letters and numbers which
    may be confusing to inexperienced users. Here is a summary:


    **First Two Letters** - The first two letters of the partition name indicate the
    type of device on which the partition resides. You''ll normally see either hd
    (for IDE disks), or sd (for SCSI disks).


    **The Next Letter** - This letter indicates which device the partition is on.
    For example, /dev/hda (the first IDE hard disk) or /dev/sdb (the second SCSI disk).


    **The number** denotes the partition. The first four (primary or extended) partitions
    are numbered 1 through 4. Logical partitions start at 5. E.g., /dev/hda3 is the
    third primary or extended partition on the first hard disk; /dev/sdb6 is the logical
    partition on the second SCSI hard disk.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Changing the Partition Table


    When you are finished partitioning your disks, press Done; you may see a message
    indicating that the installation program needs to reboot. This is a normal occurrence
    after changing a disk''s partition data; it usually happens if you created, changed,
    or deleted any extended partitions. After you press OK, your machine will reboot.
    Follow the same installation steps you did up until Partitioning Disks; then simply
    choose Done.


    # 4.3.3 Filesystem Configuration


    Since Red Hat Linux may be distributed across several disk partitions, you need
    to choose which disk partitions go with which filesystem.


    # Selecting the Root Partition


    If you are performing a full install, the installation program presents a list
    of the Linux partitions it can find and prompts you to choose a root partition
    (see Figure 4.10 on the facing page). The root partition (or root filesystem)
    is the one which holds everything necessary to boot your Red Hat Linux system;
    it is mounted on / the root directory when your system boots. Select the root
    partition you wish to use and press Enter.


    If you are performing an upgrade, the installation program tries to find your
    root partition automatically; if it finds one, it goes on the next step.


    # Other Partitions


    The next dialog box contains a list of all disk partitions with filesystems readable
    by Red Hat Linux, including partitions for MS-DOS or Windows. This gives you the
    opportunity to assign these partitions to different parts of your Red Hat Linux
    filesystem. The partitions you assign will be automatically mounted when your
    Red Hat Linux system boots. Select the partition you wish to assign and press
    Enter (or choose Edit); then enter the mount point for that partition, e.g., /usr
    (see Figure 4.11 on page 66).


    Additionally, Red Hat Linux allows you to mount read-only NFS volumes when your
    system boots; this allows directory trees to be shared across a network. Choose'
  merge: -1
