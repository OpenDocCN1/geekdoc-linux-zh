    program asks you to choose a SCSI driver. Choose the driver that most resembles
    your adapter. You may specify options for the driver if necessary; however, most
    drivers will detect your SCSI adapter automatically.


    Other If your CD-ROM is neither an IDE nor a SCSI CD-ROM, it’s an “other”. Sound
    cards with proprietary CD-ROM interfaces are good examples of this CD-ROM type.
    The installation program presents a list of drivers for supported CD-ROMs– choose
    a driver and, if necessary, specify any driver options.


