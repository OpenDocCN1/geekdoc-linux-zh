    Installing Without Using a Boot Diskette Alternatively, if you have MS-DOS installed
    on your computer, you can boot the installation system directly from the CD without
    using any diskettes.


    To do this, use the following commands (assuming your CD is drive d:)


    ```

    C:\> d:

    D:\> cd dosutils

    D:\dosutils> autoboot.bat

    ```


    Note that this method will not work in a DOS window – the autoboot.bat file must
    be executed with DOS as the only operating system. In other words, Windows cannot
    be running.


    **Please Note:** The Red Hat Linux/Intel CD-ROM can also be booted by newer computers
    that support bootable CD-ROMs. Not all computers support this feature, so if yours
    can''t boot from CD-ROM, you''ll have to use a boot diskette (or autoboot from
