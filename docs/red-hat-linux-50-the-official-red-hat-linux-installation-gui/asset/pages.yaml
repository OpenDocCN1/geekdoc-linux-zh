- pgno: 180
  md: '# # 11nSystem Administration


    This chapter is an overview of the Red Hat Linux system. It will illustrate things
    that you may not know about the system and things that are somewhat different
    from other UNIX systems. Note that most system administration task are performed
    with the control-panel, which is covered in chapter 9.


    # ## 11.1 Filesystem Structure


    Red Hat Software is committed to the Linux File System Standard, a collaborative
    document that defines the names and locations of many files and directories. We
    will continue to track the standard to keep Red Hat compliant.


    While compliance with the standard means many, the two most important are compatibility
    with other compliant systems, and the ability to mount the /usr partition read-only.
    The /usr partition contains common executables and is not meant to be changed
    by users. Because of the, /usr partition can be mounted from the CD-ROM or from
    another machine via read-only NFS. The current Linux Filesystem Standard (FSSTND)
    document is the authoritative reference to any FSSTND compliant filesystem, but
    the standard leaves many areas unde'
  merge: -1
  img_proc: true
- pgno: 181
  md: "fined or extensible. In this section we provide an overview of the standard\
    \ and a description of the parts of the filesystem not covered by the standard.\n\
    \nThe complete standard can be viewed at:\n\n```\nhttp://www.pathname.com/fhs/\n\
    ```\n\n# 11.1.1 Overview of the FSSTND\n\nThe directories and files noted here\
    \ are a small subset of those specified by the FSSTND document. Check the latest\
    \ FSSTND document for the most up to date and complete information.\n\n# The /etc\
    \ Directory\n\n /etc directory is reserved for configuration files that are local\
    \ to your machine. No binaries are to be put in /etc. Binaries that were in the\
    \ past put in /etc should go into /sbin or possibly /bin.\n\nThe X11 and skel\
    \ directories should be subdirectories of /etc\n\n+   - X11\n+- skel\n\nThe X11\
    \ directory is for X11 configuration files such as XF86Config. The skel directory\
    \ is for “skeleton” user files, which are files used to populate a home directory\
    \ when a user is first created.\n\n# The /lib Directory\n\nThe /lib directory\
    \ should contain only those libraries that are need to execute the binaries in\
    \ /bin and /sbin."
  merge: -1
  img_proc: true
