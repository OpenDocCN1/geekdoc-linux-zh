- pgno: 124
  md: '# 6.5 Sendmail


    you have a 2 button mouse and want to emulate the third (middle) mouse button
    with a simultaneous click of the left and right mouse buttons use Tab to move
    the cursor to the Emulate 3 Buttons checkbox and press Spacebar to toggle the
    selection.


    # 6.5 Sendmail


    A default sendmail.cf file will be installed in /etc/. The default configuration
    should work for most SMTP-only sites. It will not work for UUCP sites; you will
    need to generate a new sendmail.cf if you need to use UUCP mail transfers. To
    generate a new sendmail.cf, you will need to install m4 and the sendmail source
    package. Read the README file in the sendmail sources for more details on creating
    sendmail configuration files. Also, O''Reilly & Associates publishes a good sendmail
    reference entitled sendmail by Bryan Costales.


    One common sendmail configuration is to have a single machine act as a mail gateway
    for all the machines on your network. For instance, at Red Hat Software we have
    a machine mail.redhat.com that does all our mail. On that machine we simply add
    the names of machines for which mail.redhat.com will handle mail to /etc/sendmail.cw.
    Here is an example:


    ```

    # sendmail.cw - include all aliases for your machine

    # here.

    torgo.redhat.com

    poodle.redhat.com

    devel.redhat.com

    ```


    On the other machines, torgo, poodle, and devel, we need to edit /etc/sendmail.cf
    to "masquerade" as mail.redhat.com when sending mail, and to forward any forward
    local mail processing to redhat.com. Find the DH and DM lines in /etc/sendmail.cf
    and edit them thus:


    ```

    # who I send unqualified names to

    # (null means deliver locally)

    DRmail.redhat.com

    ```


    ```

    # who gets all local email traffic

    DHmail.redhat.com

    ```'
