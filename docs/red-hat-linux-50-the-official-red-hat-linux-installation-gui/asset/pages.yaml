- pgno: 168
  md: '# 10


    # Glint


    Red Hat provides a graphical tool to aid in package installation and removal.
    It''s called glint (Graphical Linux Installation Tool) and runs under the X Windows
    System. It allows easy installation, uninstallation, upgrading, querying, and
    verification of packages. The interface is similar to the one found in many popular
    file managers and is simple to use.


    Operations are performed in glint by selecting the packages to operate on and
    then selecting the operation to perform via pushbuttons. Installing a package
    places all of the components of that package on your system. Uninstalling one
    removes all traces of the package except for configuration files you have modified.
    Upgrading a package installs the newly available version and uninstalls all other
    versions that were previously installed. This allows quick upgrading to the latest
    releases of packages.


    The query operation lets you examine the details of installed or available package.
    You can view the description of the package, where and when it was built, in the
    package, and other attributes. All of the configuration and documentation components
    of each package are clearly marked as such to reduce the time you spend looking
    for them.


    Using glint to perform all of these operations is the same as using rpm to do
    them'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'from the command line. However, the graphical nature of glint often makes these
    operations easier to perform.


    The normal way to handle glint is to display the available packages and files,
    the ones you want to operate on, and then press a button or choose a menu item
    that performs the operation. For instance, you can install several packages with
    a few button clicks.


    # 10.1 Starting glint


    To start glint, simply run glint & from any X terminal window. That will bring
    up a window that looks like the one in figure 10.1. Any user can use glint to
    query and verify packages, but if you need to install, uninstall, or upgrade packages
    be sure to run glint as root.


    There are two main parts to the glint interface. The first, on the left, allows
    you to browse and select the packages installed on your system. The right side
    contains buttons that manipulate the selected packages.


    | Path: | | | | Query |

    |---|---|---|---|---||

    | | Daemons | Red | Shells | X11 | Uninstall |

    | | | | | | Verify |

    | | | | | | Configure |

    | Games | Documentation | Applications | Development | Available |

    | Packages selected: 0 | | | | | Exit |


    Figure 10.1: Main Glint Window


    # 10.2 The Package Display


    Each folder icon in glint represents a group of packages. Each group can contain
    other groups, which allows for flexible locations of packages. Groups are used
    to'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 10.2 The Package Display


    place packages that perform similar functions in similar locations. For example,
    Red Hat includes many application programs as editors and spreadsheets. All of
    the text based ones appear in the “Applications” group. Inside of group, there
    is another grouping for all of the editors that are shipped.


    By convention, groups are written in the same way as UNIX paths. The top most
    group is written first, and subsequent groups follow with a slash separating the
    group names. This means that an X-based drawing program appears in the X11/Applications/Graphics
    group.


    To view the packages and subgroups within a group, double click the left mouse
    button on a group''s folder icon. The window then changes to show what package
    contains. The top line of the package display shows which group you''re currently
    looking in, as well as the groups leading to the current one. To return to the
    previous group you were looking at, double click on the “Back” folder, which is
    always in the upper left hand corner of the folder area (though it gets scrolled
    away).


    If you''d like to examine a subgroup in a new window, double click the mouse button
    on its folder. If your mouse has only two buttons, click both. This will create
    a new window with that group in it.


    # 10.2.1 Context Sensitive Menus


    Pressing the right mouse button on any icon in the package window brings up a
    small, context sensitive menu. The exact items it contains depends on exactly
    where you press it. They all contain options to select or deselect the item, and
    many let you install, uninstall, query, upgrade, or verify the item you clicked
    on. There''s more information on how to do these things.


    To choose an item from a context sensitive menu, press and hold the right mouse
    button on an icon. While still holding the right button down, move the mouse pointer
    over the item you''d to select (which will then become highlighted). Release the
    right mouse button to select that item and make the menu disappear.


    # 10.2.2 Selecting Packages


    To select a single package, click the left mouse button on it. You''ll notice
    a thin border appear around the package''s icon (as shown in figure 10.2) which
    shows that it''s currently selected. To unselect, click the left mouse button
    on and'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'the border will disappear. The number of packages currently selected is always
    displayed at the bottom of the window. A group''s folder icon displays the number
    of packages inside of that group have been selected, or All if all of them have
    been.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_171_0.png)


    Figure 10.2: Selecting Packages in Glint


    The context sensitive menu for a package also allows easy selection and unselection.
    Using the select and unselect options on a package''s icon selects or unselects
    that package, while those options on a group''s folder icon select and unselect
    all of the packages in that group. Using these menu options makes selecting groups
    of packages much quicker than selecting each package individually.


    # 10.2.3 Viewing Available Packages


    To see what packages are available for you install, choose the Available button
    from any glint window. After a few moments, a new window, like the one shown in
    figure 10.3, will appear. The differences in the title and buttons indicate that
    this window is listing packages you may install. Navigating through these packages
    and selecting them is the same as in the other glint windows.


    If you get an error message from glint saying that it can''t find any RPMs, see
    the section below on Configuration.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 10.3 Configuration


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_172_0.png)


    Figure 10.3: Available Window


    # 10.3 Configuration


    The only configuration information glint needs the path to new RPMs. When you''re
    using your Red Hat CD-ROM, this will probably be /mnt/cdrom/RedHat/RPMS, which
    is the default path for glint. If you download new RPMs from the Internet or want
    to install RPMs via a NFS mounted CD-ROM this path will probably be different
    for you.


    | Configuration |

    | You have to close all of your available windows and reopen before changing your
    package directory will have any affect. | Package path: /mnt/cdrom/RedHat/RPMS
    |

    | Ok | Save | Default | Cancel |


    Figure 10.4: Configuration Window


    To change this path, first be sure to close all of the windows listing available
    packages you may open. Then choose the Configuration option from one of the remaining
    windows. This will open a dialog box like the one shown in figure 10.4. You can
    type the full path to the RPMs you''d like to look at. Choosing the Save button
    will save this path, making it the default for future glint sessions. The Default
    button restores the path to the one glint used when it started.


    After changing this path and closing the dialog box, you can use the Available'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'button to view the packages available in the new location.


    # # 10.4 Package Manipulation


    # ## 10.4.1 Querying Packages


    The easiest to query a single package or group is to use the query option from
    the icon''s context sensitive menu. If you want to query a more diverse set of
    packages, select them all and use the Query button in one of the windows.


    Using either of these methods creates a window like the one shown in figure 10.5.
    If you choose only one package, it will look a bit different however, so some
    of this won''t apply.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_173_0.png)


    Figure 10.5: Query Window


    On the left of the window is a list of the packages that have been queried. Selecting
    one of them will change the information in the rest of the window. You may step
    through them in order by using the Next and Previous buttons on the right side
    of the window.


    The name, version, and release of the current package are in the top middle of
    the query window. Immediately below this is the description of the package, which
    can be quite large. A scroll bar is there to let you read the thing.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 10.4 Package Manipulation


    With the description is a list of the files contained in the package. Along with
    the full path to the file, the file list tells you a couple of other things. If
    a D appears to the left of the path, that file is a documentation file and would
    be a good thing to read. If a C appears there, then the file is a configuration
    file. A * means that the correct version of that file is not installed on your
    system. This can occur because a more recent version of a package was installed
    or because two packages contain different versions of the same file.


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_174_0.png)


    Figure 10.6: Query Details


    More information on a package can be seen by clicking on the Details pushbutton.
    A window like the one in figure 10.6 will appear. This lists more information
    about the package being displayed in the main query window. When you select a
    new package in the query window, the information in the details window will change
    to reflect your choice.


    You may also select, unselect, or verify a package while querying it by using
    the buttons provided. Click on the Close button when you are finished looking
    at the packages.


    # 10.4.2 Verifying Packages


    Verifying a package checks all of the files in the package to insure they match
    the ones present on your system. The checksum, file size, permissions, and owner
    attributes are all checked against the database. This check can be used when you
    suspect that one of programs files has become corrupted due to the installation
    of new programs.


    Choosing the packages to verify is the same as choosing the packages to query.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Select the packages and use the Verify button or choose the Verify entry from
