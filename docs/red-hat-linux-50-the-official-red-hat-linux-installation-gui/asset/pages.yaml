    # 6.2.2 XConfigurator


    To configure X Windows you must first select your video card. Scroll down the
    list of supported cards until you locate the card in your machine. Section 6.2.2
    may help you determine the video server that matches your hardware. If your card
    is not listed it may not be supported by XFree6. In this case you can try the
