    # 5.7 Setting a Root Password


    The installation program will next prompt you to set a root password for your
    system (see Figure 5.12 on page 86). You''ll use the root password to log into
    your Red Linux system for the first time.


    The root password must be at least six characters long; the password you type
    is not echoed on the screen. You must enter the password twice; if the two passwords
    do not match, the installation program will ask you to enter them again.


    You ought to make the root password something you can remember, but not something
    that is easy for someone else to guess. Your name, phone number,อย่าง, password,
    root, 123456, and ante are all examples of poor passwords. Good passwords mix
    numerals with upper and lower case letters and do not contain dictionary words:
    Aard37vark or 420BmtTNT, for example. Remember that the password is case-sensitive.
    Write down this password and keep it in a secure place.


    **Please Note:** *The root user (also known as the superuser)* has complete access
    to the entire system; for this, logging in as the root user is best done only
    to perform system maintenance or administration, so that critical system files
    are not inadvertently changed, moved, or deleted. Please see Section 9.1 on page
    132 for instructions on how to add a user account for yourself after you reboot'
  merge: -1
