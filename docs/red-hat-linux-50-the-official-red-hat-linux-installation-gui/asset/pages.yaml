- pgno: 148
  md: '# 9


    # Control Panel


    The control panel is a launching pad for a number of different system administration
    tools. They make your life easier by letting you configure things without remembering
    configuration file formats and awkward command line options.


    To start the control-panel, start the X Window System as root with startx and
    type control-panel in an xterm. You will need to root to run the control-panel
    tools successfully. You can do this as well if you already have X running as a
    normal user. Just type su -c control-panel and type the root password when prompted.
    If you plan to do other tasks as root, you could type su - root password when
    prompted. You will then be given a root shell. Here, you will need to type DISPLAY=:control-panel
    & to get the control panel to work. The "DISPLAY" tells the control panel to use
    your display. This syntax works only for a Bourne-compatible shell like bash.


    If you run tcsh, you would enter setenv DISPLAY :0; control-panel &.


    Double clicking on an icon starts a tool. Please note that


    ![](img/ba3e691092e6adf79e7e80117b3e5a27_148_0.png)'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'you are not prevented from starting two instances of any tool, but doing so
    is a very bad idea because you may try to edit the same files in two places and
    end up overwriting your changes. If you accidentally start a second copy of a
    tool, you should quit it immediately. Also, do not manually edit files managed
    by the control-panel tools while the tools are running. Similarly, do not run
    any other programs that may change those files while the tools are running.


    # 9.1 User and Group Configuration


    The tool shown in Figure 9.1 manages the users and groups on your system. In a
    sense, it is a graphical editor for /etc/password and /etc/group, and for /etc/shadow
    if you have enabled shadow passwords. With this tool you can add and remove users
    and groups, login shells, full names, home directories, uid, gid, etc.


    | Name | UID | GID | Password | Home Directory |

    | --- | --- | --- | --- | --- |

    | root | 0 | 0 | exists | /root |

    | bin | 1 | 1 | disabled | /home/bin |

    | daemon | 2 | 2 | disabled | /sbin |

    | admin | 3 | 4 | disabled | /var/adm |

    | lp | 4 | 7 | disabled | /var/spool/lpd |

    | sync | 5 | 0 | disabled | /sbin |

    | shutdown | 6 | 0 | disabled | /sbin |

    | halt | 7 | 0 | disabled | /sbin |

    | mail | 8 | 12 | disabled | /var/spool/mail |

    | news | 9 | 13 | disabled | /var/spool/news |


    Figure 9.1: User and Group Configuration Panel


    # 9.1.1 Adding or Editing a User


    The same interface is used to add and edit users. To add a user, click on the
    Add button in the main window. A dialog box will pop up like the one in figure
    9.2 will'
  merge: -1
