    # 1.3.7 Anti-spam changes to sendmail


    Sendmail version 8.8.7 is included with Red Hat Linux 5.0. Also included are rulesets
    discourage the distribution of unsolicited commercial e-mail (also known as “spam”).
    These rules were created by Claus Aßmann. Some information is included below,
    please consult Claus'' web page documenting his changes at:


    ```

    http://www.informatik.uni-kieiel.de/~7Eca/email/check.html

    ```


    **Please Note:** In this release of Red Hat Linux, sendmail does not relay by
    default. Because of this, if your Red Hat Linux system must act as a relay, please
    review the following information.


    # Overview


    This release has been configured to take advantage of the latest changes to sendmail
    to prevent spam by the addition of new sendmail rulesets.'
  merge: -1
