    On the other hand


    During the installation process, you''ll be given the chance to create partitions
    for Red Hat Linux. At this point, your main concern is making sure you have sufficient
    disk space available to create those partitions. Let''s review the different ways
    to free up space for Red Hat Linux partitions.


    # 2.4.1 Repartitioning Strategies


    There are three possible scenarios you may face when attempting to repartition
    your hard disk:


    +   - Unpartitioned free space is available.

    - An unused partition is available.

    - Free space in an actively used partition is available.


    Let''s look at each scenario in order.


    # Using Unpartitioned Free Space


    In this situation, the partitions defined do not span the entire hard disk, leaving
    unallocated space that is not part of any defined partition. If you think about
    it,'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 2.4 Disk Partitions


    an unused hard disk also falls into this category; the only difference is that
    all the space is not part of any defined partition.


    In this case, you can simply create the necessary partitions from the unused space.


    # Using An Unused Partition


    Last year you replaced that 105MB hard drive on your Windows system with a 1.2GB
    monster. You partitioned it into two equal parts, figuring that you''d use the
    C: "drive" (really the first partition) for Windows, and the D: "drive" (re-ally
    the second partition) for your collection of freeware programs down-loaded from
    the Internet. Well, you''d been so used to using C: that you never put anything
    of substance on D:.


    If you find yourself in this situation, you can use the space allocated to the
    unused partition. You''ll need to delete the partition, and create the appropriate
    Linux partitions in its place.


    # Using Free Space From An Active Partition


    This is the most common situation. It is, unfortunately, the hardest to deal with.
    The main problem is that you have enough free space, but it''s presently allo-cated
    to a partition that is in use. If you purchased a computer with pre-installed
    software, the hard disk most likely has one massive partition holding the operating
    system and data.


    Aside from adding a new hard drive to your system, you have two choices:


    +   Destructive Repartitioning – Basically, you delete the single large partition,
    and create several smaller ones. As you might imagine, any data you had in that
    partition is destroyed. This means making a complete backup is nec-ensory. For
    your own sake, make two backups, use verification (if available in your backup
    software), and try to read data from your backup before delete the partition.
    Note also that if there was an operating system of some type installed on that
    partition, it will need to be reinstalled as well.


    After creating a smaller partition for your existing software, you can rein-install
    any software, restore your data, and continue with your Red Hat Linux installation.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Non-Destructive Repartitioning – Here, you run a program that does the seemingly
    impossible; it makes a big partition smaller without losing any of the files stored
    in partition. Many people have found this method to be reliable and trouble-free;
    we recommend that you make backups of the partition being resized, just in case.


    What software should you use to perform this feat? You can use the fips utility
    to resize FAT (File Allocation Table) partitions. It''s included on the Red Hat
    Linux/Intel CD-ROM in the dosutils directory. Before using it, however, we highly
    recommend reading the fips documentation, located in the fipsdoc subdirectory.


    Please Note: At the present time, the fips utility cannot resize the FAT32-style
    partitions found on many newer computers. If your computer has a FAT32 partition,
    you can either use destructive repartitioning, or purchase commercial disk management
    software capable of shrinking FAT32 partitions.


    # 2.4.2 Disk Partitions and Other Operating Systems


    If your Red Hat Linux partitions will be sharing a hard disk with partitions by
    other operating systems, most of the time you''ll have no problems. However, there
    are certain combinations of Linux and other operating systems that require extra
    care. Information on creating disk partitions compatible with other operating
    systems is available in several HOWTOs and Mini-HOWTOs, available on the Red Hat
    Linux CD in the doc/HOWTO and doc/HOWTO/mini directories. In particular, the Mini-HOWTOs
    whose names start with Linux+ are quite helpful.


    If Red Hat Linux/Intel will coexist on your disk partitions with the OS/2 partitioning
    software—otherwise, OS/2 may not recognize the disk partitions. During the installation,
    do not create any new partitions, but do set the proper partition types for your
    Linux partitions using the Linux fdisk.'
  merge: -1
