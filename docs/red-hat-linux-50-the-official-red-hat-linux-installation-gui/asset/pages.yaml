    ```


    If you have a postscript printer, you will probably want to print with:


    ```

    man -t COMMAND | l1pr

    ```


    In both of those commands have "COMMAND" for the command you are trying to get
    help for.

    Also, sometimes things have more than one man page. Here is a table of what is
    located where:


    | Section | Contents |

    | 1 | user commands |

    | 2 | system calls |

    | 3 | library calls |

    | 4 | devices |

    | 5 | file formats |

    | 6 | games |

    | 7 | miscellaneous |

    | 8 | system commands |

