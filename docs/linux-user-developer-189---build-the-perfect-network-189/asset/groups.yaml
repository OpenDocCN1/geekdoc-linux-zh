    ## Serval 的未来


    Paul 提到，企业和初创公司已开始考虑 Serval 作为一个可以在其上构建服务的平台。“我们的重点是建立一个 Serval 应用——就像我们建立了 Wi-Fi
    和蓝牙联盟以及这类围绕 Serval 的小组。这将以一种常规的方式，让企业通过他们的产品支持 Serval 的持续开发和测试供大家使用。当然，他们分担了成本，到那时我们可能真正实现了财务上的可持续性。”


    ![](img/301dc180ffb6e12d0783cd1567376047_36_0.png)


