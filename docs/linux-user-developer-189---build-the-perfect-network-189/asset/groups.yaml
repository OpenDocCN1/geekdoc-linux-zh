    Although the real benefit of Qubes OS, there are also occasions where you''ll
    want to share data between domains. At the most basic level, this means able to
    copy and paste, which is fully supported out of Qubes OS. In the source app, copy
    the content as normal using the appropriate shortcut, for example, Ctrl+C. This
    tells Qubes that what is in focus is to globally copy between domains. It is simply
    a matter of going to the target domain and pressing Ctrl+Shift+V to paste into
    that domain. Note that only plain-text copy and paste is supported. If desired,
    specific cubes such as vault can be configured and also changed by /etc/qubes-rc-policy/quies/clipboard


    ## Moving files

    As well as for copy and paste, Qubes OS makes it straightforward to move files
    between domains. The easiest way is to use the GUI: simply open the file in the
    manager, select the appropriate file and the right-click menu select the "Copy
    to another AppVM". You''ll be prompted for the name of the destination. A confirmation
    box from dom0 appears (this is impossible to (fake)) and after closing, the file
    copies to place. Bound inside arrives in /home/user/Qubes_Incoming/


    As Qubes evolves, file copy can also be carried out from the command line. Use
    `qube-to-move` for earlier versions of Qubes OS.


    - Out of the box, Qubes OS includes TemplateMs for Fedora and Debian, there are
    a number of additional templates based on other Linux distributions. There are
    also templates available without official support.


    The tool is well documented in the Qubes OS website, but it is a fairly involved
    process and is not for the faint hearted. The most popular distributions are Arch
    Linux (which has no community builder) and Ubuntu (which uses building templates).
    To note that these are provided by third parties other than you; also note that
    third-party templates haven''t undergone the same security testing as it applies
    to the included templates.


    Qubes OS is a popular tool for penetration testing, and the documentation details
    how to install BlackArch, Kali and the Penetration Framework (PTF) if you want
    to use it for.


    ## The core of Qubes and the importance of dom0

    In addition to your cubes and TemplateVMs, there''s an additional domain called
    dom0, which is where Window Manager and Desktop Manager runs. This is also where
    you log to the system. dom0 is more trusted than any other domain, including TemplateMs
    and black-labelled cubes. If dom0 were ever to be compromised, the entire system
    would be compromised. Due to the nature of this, dom0 has no connectivity and
    is only used for specific purposes. All is to avoid it for anything else. In particular,
    you should never use applications in dom0; do absolutely everything in your cubes,
    that''s what they are for!


    ## Feature Qubes

    If the idea of building or using a third party TemplateVM feels too much work,
    another option provided by Qubes is HVM (Hardware VM) domains. HVMs enable the
    creation of domains from any provided image or ISO. This also allows installation
    of Windows-based VMs in Qubes. To create an HVM-based guest, select the option
    to create a new guest in Qubes Manager when installing. For the type, select ''Standalone
    not based on a template''.


    ## OS includes TemplateMs for Fedora and Debian

    As you will need to modify the network firewall, you will now have an additional
    option to "Install from device". This launches an additional dialog box where
    you can then choose the appropriate installation ISO - either a connected physical
    disk or a file located in an existing kube. After selecting the appropriate source,
    your opens and your installation begins.


    ## VMs enable the creation of domains based on any OS, if you have the ISO

    If you want to install Windows in a HVM, be aware of a few limitations. The most
    recent supported version is Windows 10 Pro which is supported, but there are reports
    of Qubes GUI passthrough. There is currently no audio support for Windows HVMs.
    On the plus side, Qubes Windows Tools (QWT) can be installed which provide a host
    of features for Windows users: a seamless GUI that integrates Qubes with the Windows
    desktop; support for clipboard and paste; support for secure file exchange between
    the Windows VM and other. Another option is using generic drivers for Windows,
    which provides the ability to run systems within or from other VMs for Windows
    for better performance compared to QEMU-emulated devices. However, not official
    Qubes OS (such as other Linux distros), some third-party apps may get to work
