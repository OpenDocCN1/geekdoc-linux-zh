    # 构建完美的网络


    ## 其他访问类型


    网络不仅仅是连接到以太网交换机上的电脑——如果你或其他人想通过无线连接呢？


    > 快速提示 密码策略

    > 你可能想为访客访问设置一个华且简单的密码，但对于内部网络访问，请选择一个更强大且不同的密码。


    当要为你的网络添加无线访问时，它会带来许多新问题，在深入操作之前，你需要认真考虑以下答案：


    - 你是否想给访客提供访问权限？

    - 你是否应该为访客设置一个独立的网络，允许访问互联网但不能访问本地计算机？

    - 接入点（AP）应该放在哪里？

    - 我需要多个接入点吗？

    - 天线会有帮助吗？

    - 你应该使用哪一个接入点？


    ISP 提供的路由器可能包含一个接入点（AP），但这可能并不理想。除了 ISP 远程访问你设备的隐私顾虑外，它可能无法提供你想要的功能，或者它的位置并非覆盖的最佳去处。独立
    AP 的功能通常比默认的多得多。有几个用于 AP 的 Linux 发行版，DD-WRT 和 OpenWrt —— 我们正在使用后者。这些允许你在网络上的 AP
    上运行许多服务，例如 DNS 或 VPN，减少了对一直开启的电脑来执行这些任务的需求。


    手机上的信号强度应用将帮助你决定整体覆盖的最佳位置。如果建筑很大，或者墙壁太厚无法覆盖每个角落，你有若干种选择：不同的天线、多个 AP 或中继器。中继器通过它增加一个设备到另一个设备之间的连接，AP
    则会增强信号。多个 AP 工作效果良好，如果你在每个设备上使用相同的 SSID 和密码，当你在建筑内移动时，它们会自动切换，始终提供良好的的信号。当你遇到信号强度问题时，请检查附近的
    AP，并将你的 AP 设置在互不干扰的通道上。更好的 AP 还具有可拆卸的天线。更换天线不会增加功率，但会增强覆盖范围。高增益、更长的天线会增加水平覆盖范围（假设
    AP 是垂直放置的），但是以牺牲垂直覆盖为代价。这对于单层建筑或当你拥有大区域时非常有用。如果你无法将 AP 置于中心位置，你可能可以使用一个提供非对称覆盖的定向天线。


    接入点的放置非常重要，使用独立的 AP 会更容易实现，因为你不再受限于互联网连接进入场所的位置。


    > 快速指南 访客访问

    > 你需要考虑邀请谁加入你的无线网络。连接 AP 不仅为他们提供互联网，还提供你的本地网络。你是否可以为访客提供一个（虚拟局域网 VLAN），以及访客 VLAN
    如何与你的 VLAN 分离。具体细节取决于路由器的操作系统或 Wi-Fi 硬件。最好的方法之一是在路由器中创建 VLAN，并为每个 VLAN 连接一个独立的
    AP。哪种最好取决于路由器以及取决于 AP。你是否有选项使用流量整形（traffic-shaping）来防止访客用户占用你的带宽。有些人将其称为热点模式。不要倾向于让你的访客访问开放，它仍然需要
    WPA。


    ## 添加 VPN


    一旦你开始向网络中添加更多电脑，从外部访问它们的需求就会随之增长。这引发了几几个问题。如果你有多个设备，你必须在标准端口上运行 SSH，因为 NAT 路由器可以将每个端口转发到相应的端口；虽然有反向映射的方法可以解决这个问题，但非常复杂。另一个问题是，你向外界开放的端口越多，你暴露的风险就越大。因此，最好的办法是以安全的方式从外部连接到网络，同时允许你获取所需的一切。


    OpenVPN（虚拟专用网络）使用安全隧道来保护你外部的互联网流量。通过 OpenVPN，你可以加入基于 SSH 的 VPN，这是一种安全的连接方法。需要注意的是，你使用的
    VPN 服务与其他人使用的的是相同的，无论是否是其他人，你加入它都是为了伪装你的位置。以下是我们的配置方式：


    设置可能有点复杂，但有 PIPVPN 提供的帮助。从名字你就能猜到，它是为树莓派（Raspberry Pi）设计的，你网络中隐藏的某一个微型板子可以作为网关，它也运行在
    Ubuntu 和 Debian 发行版上。使用 PIPVPN 设置 OpenVPN 服务器；请运行：


    ```

    $ curl -l https://pipvpn.io

    ```


    这将下载并运行脚本。它会要求你提供一些选项，为服务器生成密钥，安装并配置客户端以便能够连接。PIPVN 也为你完成了这些工作：


    ```

    $ pipvpn add

    ```


    这会要求你输入名称和密码（与电脑上的用户密码不同）。PIPVN 会生成一个包含配置和证书的文件。这就是你导入到 VPN 客户端以建立连接的内容。


    ![](img/301dc180ffb6e12d0783cd1567376047_29_0.png)


    ## 加密强度


    选择你所需的加密类型（从列表中选择）：

    这是一个将在你的系统上生成的加密密钥。密钥越大，花费的时间越长。对于大多数应用程序，建议使用 2048 位。如果你不确定，可以使用 1024 位，这对于正常使用已经足够了！如果你对事情极度偏执……那就选
    4096 位吧。


    - 1024 加密（仅用于测试）

    - 2048 加密（推荐级别）

    - 4096 加密（偏执级别）


    上述 PIPVN 是设置 OpenVPN 最简单的方法；眼敏锐的人可能注意到它运行在 Ubuntu 上，而不是树莓派上，尽管名字是如此


    ## 产品


    ### 接入点固件

    用开源替代方案替换你的接入点或路由器固件。


    ![](img/301dc180ffb6e12d0783cd1567376047_0.png)


    ### DD-WRT

    DD-WRT 是最出名的选择。它的名字源于它最初为经典的 WRT 开发，现在涵盖了数百种型号，但更加灵活，代价是需要努力。通过它，你可以增加路由器的功能。


    ![](img/301dc180ffb6e12d0783cd1567376047_1.png)


    ### OpenWrt

    OpenVPN 是它的分支。


    ### 安装固件

    在路由器上安装操作系统出奇地简单，特别是当你使用出厂安装的情况下，但请务必遵循说明以防止路由器变“砖”。


    ![](img/301dc180ffb6e12d0783cd1567376047_2.png)


    www.linuxuser.com


