    ```

    http_access allow 127.0.0.1/8          # localhost 源

    http_access allow 192.168.1.0/24        # 本地网络

    http_access allow 10.0.0.0/8             # 私有网络

    http_access deny all                   # 拒绝所有其他源

    ```


