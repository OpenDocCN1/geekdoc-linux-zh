    ### 使用 GNU Make 构建程序：多目录


    在组合一个跨越多个目录的项目时，有许多技巧可以使用。几乎所有大型软件项目最终都会跨越大量目录。项目使用目录将项目组织成连贯的、自包含的单元，这些单元负责项目的某个特定部分。然而，目录结构的某些部分实际上是由
    make 强制执行的。在创建用于构建项目的 makefile 时，很难跟踪项目各处的所有文件，用户以前通常让自己的项目目录结构反映他们自己。


    正如我们所见，一旦不同目录之间开始出现非平凡的依赖关系，这种方法就有了缺点，因此在这里我们也将考虑一种替代方案。


    ### 自动创建目录


    当我们构建一个多目录项目时，不仅源文件存在于目录中；输出文件也需要组织，以便我们可以创建一个新的输出文件。我们用于输出文件的目录是存在于每个的。我们可以手动创建这些目录并将它们与源文件一起分发，但这非常难以维护。相反，为了允许用户配置我们用于输出文件的目录结构。


    这很容易做到：我们可以将目录作为输出文件的先决条件，如图 1 所示。在这里，构建输出文件的规则在编译文件之前确保该目录存在。


    构建一个项目需要多种技术的结合。构建多目录项目的经典方法是在每个目录中有一个单独的 makefile，并递归调用 make；这种递归方法允许我们将构建拆分到多个
    makefile 中，每个 makefile 负责自己的部分。


