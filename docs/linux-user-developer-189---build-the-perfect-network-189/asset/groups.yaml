    一旦完成安装，连接你的 Pi 并确保网络、鼠标、键盘和摄像头正常工作。记住键盘布局必须与连接到你服务器的键盘相同。用户将需要使用你创建的凭据登录。你可以使用预装软件、更改背景等。然而，如果禁用了远程访问，他们在不安装软件的情况下无法进行系统更改。


    ## 08 编辑用户和账户


    PiServer 工具允许你根据需要向 Raspberry Pi 添加新用户。要编辑用户账户，点击左侧的“用户”选项卡并点击“添加”或“删除”。服务器管理员也可以在此重置用户的密码。通过“客户端”选项卡向你的网络添加更多
    Pi，这里的指南与步骤 4 相同。使用“编辑”按钮为每个 Pi 提供描述，例如 Classroom Pi 1。


    ![](img/301dc180ffb6e12d0783cd1567376047_74_3.png)


    > 遇到“没有服务器！”的问题？


    如果你没有服务器作为你的 Pi Server，你可以在虚拟机或类似设备上设置 Debian 和 Raspberry Pi。如果你想这样做，请确保你的虚拟磁盘足够大以包含系统，并至少使用
    8GB。你的虚拟机还需要直接连接到 Pi，在 VirtualBox 中，你可以通过点击虚拟机的“设置”来实现。然后点击“网络”。在下方的“连接到”标签菜单中，选择“桥接适配器”。你也可以使用
    Raspberry Pi 作为服务器，文件性能显然会比专用服务器或虚拟机慢得多。


    # 教程


    ## pyLCI


    ## 使用 pyLCI 控制你的 Pi


    ## 停止使用那些奇怪的命令行——这是一种更简单的控制方式


    pyLCI 是一个简单的硬件接口，你可以在 Pi 上使用它进行配置，而无需 HDMI 显示器、以太网或 USB 适配。它可以快速配置最重要的设置，例如将 Pi
    连接到有线或无线网络并获取其 IP 地址。pyLCI 是无线的——你可以在户外舒适地使用它，甚至在 Pi 上工作！你只需要一个带有字符显示屏（I2C）的扩展，价格低至
    5 英镑，pyLCI 代表“基于 Python 的控制界面”，即使是不懂技术的人也可以使用它。总的来说，在设置项目时它节省了大量时间。它并没有完全取代命令行；它帮助你摆脱知道
    IP 地址的麻烦，让你的 Pi 项目变得更加用户友好。


    ## pyLCI 的用处


    在某些地方 pyLCI 特别有用——例如在教学工作中。当桌子上有多个 Pi 且需要 SSH 时，pyLCI 只需要几秒钟就能获取 IP 地址；否则，它在黑客松非常有用。如果你不需要花时间寻找
    HDMI 显示器，你就有时间实际工作。使用 pyLCI，你可以专注于重要的事情，并通过编写简单的 pyLCI 插件让每个项目变得更简单。它帮助你安全地传输项目并展示给同事看——当项目涉及更多部分时，一旦你传输完成，它就会停止，并且互联网连接或仅启动命令可以轻松连接到
    Pi。另一个 pyLCI 很有帮助的项目是运行 Pi-hole 的 Pi 服务器。


    ![](img/301dc180ffb6e12d0783cd1567376047_75_0.png)


    ## 资源


    pyLCI 是一个使用 Raspberry Pi 扩展和 Python 的工具，适用于基于 Raspberry Pi 的项目。


    - pyLCI 源码：https://github.com/raspberrypi/pyLCI

    - pyLCI 文档：https://pylci.io

    - 教程文件：filesilo.co.uk


    ![](img/301dc180ffb6e12d0783cd1567376047_75_1.png)

    ![](img/301dc180ffb6e12d0783cd1567376047_75_2.png)


    ## 功能


    你可以通过 pyLCI 监控 CPU 和负载；前往“系统与运行时间”。同样对于你的树莓派项目，你可以查看显示屏并确认 Pi 是否正在运行或没有重启。可以轻松地看到你正在
    Pi 上做什么，或者从它上面流传输视频——你可以检查 CPU 负载以及你运行的进程是否完成，这非常有用，因为你不需要一直检查。


    此外，如果你的 Pi 有 RGB 扩展板（如 Adafruit HAT）或某种 RGB LED，你可以用颜色显示 CPU 负载。当负载为 100% 时它会变红色，当低于
    30% 时会变绿色，之间的值显示蓝色——这可以让你监控 Pi 变得更加方便和贴心。


    最重要的是如何使用 pyLCI 连接 Wi-Fi；前往“网络与 Wi-Fi”。如果你有 Wi-Fi 卡，你会看到一个操作列表。选择网络，输入密码并等待五秒。然后进入“网络”查看哪些网络可用。选择你要连接的网络；如果它设置了密码，你需要输入密码并等待连接。使用开关和按钮也可以连接网络。


    使用 Pi 作为路由器的小型 Web 服务器，一个可以快速查看内部情况的工具是有用的，因为你不需要 SSH 或访问 Web 界面。你可以检查 Pi 是否运行或操作系统是否崩溃、重启服务、挂载驱动器以及你的脚本——你也可以从界面运行命令（输入非常简单，而且有命令历史记录不需要重复）。


    大多数字符显示器和按钮都是开箱即用的。例如，Adafruit 适用于树莓派的16 LCD + 键盘，它带有 RGB 背光显示器；你可以从 Adafruit
    (www.adafruit.com) 或其一个分销商购买。还有带有更多按钮和 SPI 接收器的 PiFace 控制与显示，可在 Element (www.element.com)
    购买。还有带有微调和独立 RGB 背光的 Adafruit 扩展板克隆，可以在 eBay 及类似网站购买。如果你有一个带有 LCD 和按钮的不同扩展板，使用
    pyLCI 是很容易的；你可以将 GPIO 和屏幕映射到配置文件中（指令请参见 pyLCI 源码中的 `OTHER_SHELDS.md`）。


