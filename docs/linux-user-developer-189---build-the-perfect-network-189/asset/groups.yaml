    # Python


    # Dask: how to do parallel programming the easy way


    Parallel computing can be difficult to do well, especially with large amounts
    of data – but meet Dask


    Parallel programming can be one of the most difficult techniques to implement.
    After all, the whole point is to run multiple procedures concurrently. Once you
    start having more than one at a time, you can get confused as to what process
    caused the result you''re seeing. Debugging reveals a new level of difficulty,
    especially when you have large sets of data that need to be coordinated across
    all of parallel processes. You need to be aware of potential issues of reason
    or repetition of calculations. If the multiple threads are not properly synchronized
    when they read or write the data.


    Dask using the pip command, the available options are shown below:


    +   - pip install dask[complete]: Install everything

    - pip install dask[array]: Install Dask and pandas

    - pip install dask[bag]: Install Dask and cloudpickle

    - pip install dask[dataframe]: Install Dask, numpy, and pandas

    - pip install dask: Install Dask, giving you only what you need


    If you want to avoid installation, you can use Anaconda, as includes all the installation
    options for Dask. If you''re using Raspberry Pi, try Berryconda instead. Then,
    if you need older and greatest features, you can always download and install from
    source. We''s also an exercise for the reader to find all of the requirements
    for compiling your personal version of Dask.


    # Install Dask


