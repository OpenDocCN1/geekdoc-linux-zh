    \ 也可以将其分布到多个 CPU 核心上，以便你可以并行处理数据块。你可以使用 `from_` 函数从 Pandas DataFrames 创建 Dask\
    \ DataFrames。\n\nArray 以 NumPy 数组为模型，简化了在网络上分发此类数据处理的任务。Dask Array 由数百万个 NumPy\
    \ 数组网格组成。默认情况下，Dask 使用线程调度器，但你也可以分布式调度器，性能不会有损失。由于 Dask 与 NumPy 数组关联紧密，实际上有一些可以与\
    \ NumPy 一起使用的有用函数。\n\nBag 是 Python 对象的松散集合，可以分布在你的机器网络中。\n\n其他对象也是如此。由 Dask 创建的新型数据对象（Bag、Array\
    \ 和 DataFrame）是根据调度器可以处理的属性生成的。你的项目可能需要非常特定的结构来按顺序管理任务。这就是 Dask 自动过程的用场。如果是这种情况，你可以创建一个你选择的新型数据对象，它输出一个\
    \ Dask 图，该图可以交给调度器执行。\n\n- 三个宽泛层：数据、执行图和调度计划\n\n| Array | 调度器 (Schedulers) |\n\
    |---|---|\n| | | |\n\n### Bag 图\nDataFrame\n\n## 许多用例利用 Dask 提供的数据对象，以简化处理任务的并行化\n\
