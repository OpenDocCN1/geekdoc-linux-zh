    # Tutorial


    ## pyLCI


    ## Control your Pi with pyLCI


    ## Stop using all those weird console commands – this is an easier way to control
    your Pi


    pyLCI is a simple hardware interface you can use on your Pi to control and configure
    without the usual requirement of having an HDMI monitor, Ethernet or connecting
    to a USB dongle. It makes easy to quickly configure the most important settings,
    such as connecting the Pi to a wired or wireless network and getting its IP address.
    This pyLCI is wireless – you can use it comfortably outdoors, or even working
    with your Pi on a long bus ride! All you need is a simple shield with a character
    display (I2C), and for instant shields which you can get them as cheap as £5,
    pyLCI stands for ''Python-based Linux Control Interface'' and eliminates the need
    to remember commands or spend time connecting even people who are not technically
    literate can use it. In general, it saves you a lot of time when setting up projects.
    It does not replace the command-line completely; it helps you get through the
    hassle of needing to know the IP address which could otherwise waste a lot of
    your time, and it allows you to make your Pi projects considerably more user-friendly.


    ## Where pyLCI is useful


    There are places where pyLCI can be particularly useful – in educational works,
    for example. When you have multiple on a desk and students have to SSH you might
    need the IP address of ''The Pi to the left of that guy''; with pyLCI, it takes
    five seconds. Otherwise, it helps on hackathons, if at the beginning you have
    to spend time searching for an HDMI-capable monitor, you will have no time to
    actually work on your idea. With pyLCI, you can focus on what''s important, and
    you can make every project easier by writing a simple pyLCI plugin for monitoring
    your software. Also it helps you to transport your project safely. Say you''re
    bringing your project to work and show it to your co-workers – there''s a chance
    the more parts are involved in your project, the bigger it''ll stop working once
    you''ve transported it, and the internet connection, a loose wire, a hardcoded
    IP address or just a command to run on startup can easily connect to your Pi and
    figure out what the problem is. One more project with which pyLCI is helpful is
    Pi-based home servers. running with Pi-hole.


    ![](img/301dc180ffb6e12d0783cd1567376047_75_0.png)


    ## Resources


    pyLCI is a maker who uses Raspberry Pi extension along with Python, and works
    on Raspberry Pi-based projects.


    - pyLCI Source: https://github.com/raspberrypi/pyLCI

    - pyLCI documentation: https://pylci.io

    - Tutorial files available: filesilo.co.uk


    ![](img/301dc180ffb6e12d0783cd1567376047_75_1.png)

    ![](img/301dc180ffb6e12d0783cd1567376047_75_2.png)


    ## Capabilities


    You can monitor the CPU and load from pyLCI; go to System & Uptime. Likewise for
    monitoring your Raspberry projects, you can glance at the display and see if your
    Pi is running or hasn''t rebooted when you don''t expect it. It is easy to see
    if you are doing something on a Pi, or streaming video from it - you can check
    the CPU load and if the process you''ve running has finished, which is very useful
    because you never have to check it all the time.


    Additionally, if your Pi has an RGB shield (like the Adafruit HAT) or an RGB LED
    of some sort, you can show the CPU load in color. It will turn red when the load
    is 100%, turn green when it''s below 30%, and blue for values in between - which
    can make monitoring your Pi much more convenient and thankful.


    Most important is how to connect to Wi-Fi using pyLCI; go to Network & Wi-Fi.
    If you have a Wi-Fi card, you''ll see a list of actions. Pick the network, enter
    the password, and wait for five seconds. Then go to Networks to see which networks
    are available. Pick the network you want to connect to; if it has a password set,
    you will need to enter the password and wait for the network. Using the switch
    and button will also connect a network.


    A small webserver using the Pi as router, a tool that takes a quick peek under
    the bonnet is useful since you don''t have to use SSH or access a web interface.
    You can check whether your Pi is running or the OS has crashed, restarted services,
    mounted drives and your script - you can also run commands from the interface
    (entering is fairly simple, but there''s a command history you don''t have to
    repeat yourself).


    Most character displays and buttons are supported out-of-the-box. For example,
    Adafruit''s 16 LCD + Keypad for Raspberry Pi, which has a display with RGB backlight;
    you can get it from Adafruit (www.adafruit.com) or one of its distributors. Also
    PiFace Control and Display with more buttons and an SPI receiver, available from
    Element (www.element.com). There are also clones of the Adafruit shield with minor
    changes and separate RGB backlight, available on eBay and similar sites. If you''ve
    got a different shield which does have LCD and buttons, it''s easy to work with
    pyLCI; you can map the GPIO and the screen into a config file (see OTHER_SHELDS.md
    in the pyLCI source for instructions).


    ![](img/301dc180ffb6e12d0783cd1567376047_76_0.png)


    As the software allows, pyLCI can do anything that runs on Raspberry Pi or Linux.
    Check whether its compatible by running:


    - cat /os-release


    If your VERSION_ID is 8 or more, you can install pyLCI; if a system might be better,
    upgrade it.


    ## Installation and usage


    To install pyLCI, download from GitHub, install its dependencies, run the configuration
    script and then pyLCI --will configure itself if that is needed. Then run pyLCI
    to make your hardware work. Or you can just copy your local code to the global
    pyLCI install (which runs on system startup). The sync mechanism is there so that
    local changes won''t break pyLCI until you sync. Here''s some code to do all:


    ```

    apt-get install git

    git clone https://github.com/raspberrypi/pyLCI

    ./setup.sh

    ./config.sh

    ```


    ```

    sudo python main.py

    ./update.sh

    ```


    Your screen should light up, and "Welcome pyLCI" should appear on it. After, you''ll
    see a menu: the Up and Down buttons to navigate, and Enter to enter submenus.
    To go back, use the Left key. The Right key will be used for context or other
    keys. Pi Control and Display has the Left and two leftmost keys in the bottom
    row, with the other keys unused.


