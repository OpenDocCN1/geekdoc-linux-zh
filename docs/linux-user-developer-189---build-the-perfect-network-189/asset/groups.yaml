    # 03 Custom the server display


    By default, Debian with Raspberry Pi desktop will use a restrictive 640x480 resolution.
    To fix this, restart the machine and hold C to enter the GRUB prompt. Enter the
    command videoinfo and note the supported modes supported by your monitor. Then
    reboot to the Debian desktop. Run nano /etc/grub.conf. Remove the # from the start
    of the line to set resolution to 1024x768. Press Ctrl+X and then Y to save and
    exit. Next, run update-grub and restart your Pi.


    # 04 Register Pis with the server


    Connect your Raspberry Pi to the network router or the ethernet port. Return to
