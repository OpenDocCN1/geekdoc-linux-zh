    # 开源你的 Linux 新闻与观点


    # 观点

    # 内核专栏


    自从 Spectre（幽灵漏洞）和 Meltdown（熔断漏洞）产生冲击以来，4.16 版本的开发进展异常地顺利——尽管仍有大量工作需要完成。


    ![](img/301dc180ffb6e12d0783cd1567376047_15_0.png)


    Jon Masters 是一位致力于 Linux 超过 22 年的内核黑客，他在 13 岁时就进入大学。Jon 住在剑桥，在一家大型企业 Linux 供应商工作，负责推动能效服务器标准的制定。


    Linus Torvalds 在 2 月宣布了 Linux 4.16-rc2，并注意到情况相当平静，他认为“这次相对安静的发布是 4.16 版本的良好迹象”。他此前曾提到“情况似乎比
    4.15 要平静。我们现在有了（已知的）待处理停留，而且在合并窗口期间没有出现问题”，直到 4.15 开发周期的末尾，这恰好与可能导致许多现代发行版出现问题的安全漏洞公开讨论相吻合。


    最终，4.15 需要的 RC（发布候选版本）数量比通常的 7 个更多，而在该周期中，社区的几位成员为了旅行或急需的休息制定了这一计划。因此，Linus 表示他将推迟下一次发布。


    4.16 包含了开发周期期间 Linus 树中存在的一些有趣功能。这些包括在 x86 系统上支持‘Jailhouse’、PowerPC 上的内存保护密钥（Memory
    Protection Keys），以及针对 Meltdown 和 Spectre 漏洞的更多安全修复。


    内存保护密钥允许应用程序限制其对地址空间某些区域的访问。虽然有很多方法可以实现这一点，但我们希望以更安全的方式来实现。通过使用接口（例如内核 API），应用程序可以显式地限制自身对包含加密密钥的内存的访问，除非在需要访问它们的时间点。如果之后在应用程序中发现漏洞，可能会欺骗它通过无意访问泄露加密密钥，而这种访问将触发故障。


    Jailhouse 被称为“静态分区”虚拟机程序，它并非旨在构建云计算服务或运行通用操作系统（如 Windows 客户虚拟机）。相反，jailhouse 旨在显式地隔离硬件资源，而不会向机器上运行的应用程序隐藏其存在。通常，Jailhouse
    用于自动驾驶汽车等领域，这些领域对实时要求的轻量化非常重要。


    Peter Misdek 正在处理由 Jason Baron 之前创建的用于原子内核更新的补丁（kpatch）。这种机制通过应用已准备好的二进制补丁，可以在不重启的情况下更新正在运行的内核。到为止，这些热补丁只能通过一个补丁进行移除，这将导致移除并重新应用其他补丁。


    Taras Kondrutik 正在工作为用于内核镜像的 eBPF 格式添加属性。这将允许 SELinux 在没有初始镜像的情况下加载到文件上。通过向镜像添加属性，SELinux
    还可以解决安全问题，这些做法通常受到了良好好评。问题变成了是否可以使用 eBPF 标准，或者是否可以支持后者（这可能需要它的某些支持），看起来后者更受需要。


    # 上游通过上月白皮书中发布的一种新方法修复了 Spectre 变体 2


    # 构建完美的网络


    ## 在何处寻找


    - 设计你的网络：你在物理布局方面需要什么，以及你可能需要的一些硬件。

    - 文件和媒体：确保网络上的所有文件都可以供任何人访问。

    - 监控：关注计算机的性能。

    - 基础服务：提供网络所需的服务，如 DNS、路由和代理服务器。

    - 自动化系统：保持系统更新并进行维护。

    - 无线与安全：提供良好的连接，保护你的网络免受窃听。


    ![](img/301dc180ffb6e12d0783cd1567376047_18_0.png)


    '
