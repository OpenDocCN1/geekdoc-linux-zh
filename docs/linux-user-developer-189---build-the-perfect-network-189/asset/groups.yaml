    The good people of the Raspberry Pi Foundation have outlined once again with the
    release of PiServer, a tool which allows you to easily set up any Pi (Pixel) network
    hub. This enables you to set up a network of Raspberry Pis, each of which is connected
    to a central server.


    The fact that every Pi is a ''network client'', uses the same accessible files
    make PiServer perfect for classroom environments or labs where you might want
    to use Raspberry Pis for specific purposes such as teaching or operating.


    You can create as many as you need without reboot. These setups don''t require
    root privileges, they cannot install software without, this makes for a better
    and safer learning environment.


    In to start setting up your network, you will need at least one Pi and an Ethernet
    cable to connect each one to the router or network hub. The PiServer tool is easily
    available via Debian with Raspberry Pi Desktop. Follow these steps to install
    it on an SD card for best results, you can also set it up using a virtual machine
    or Raspberry Pi (see below).


    # 01 Enable network boot


    Each Pi must have network boot enabled. To do this you will need a microSD card
    with Raspberry or Raspberry Lite preinstalled. To enable network boot, just add
    the line prog_usb_boot_mode=1 to the config.txt in /boot. You can do this manually
    on your computer using a card reader, or by opening a terminal on the Pi and


