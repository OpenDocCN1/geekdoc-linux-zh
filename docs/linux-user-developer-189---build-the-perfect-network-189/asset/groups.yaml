    # OpenSource Your source of Linux news & views


    # OPINION

    # kernel column


    With Spectre and Meltdown since aftershock, the development of 4.16 has been surprisingly
    trouble-free – though there’s lots of work still to be done.


    ![](img/301dc180ffb6e12d0783cd1567376047_15_0.png)


    Jon Masters

    kernel hacker who has been working on Linux for more than 22 years, first attended
    university at the age of 13. Jon lives in Cambridge, and works for a large enterprise
    Linux vendor, driving the creation of standards for energy-efficient-powered servers.


    Linus Torvalds announced Linux 4.16-rc2 in February, noting that things were fairly
    calm and that he took "the fairly quiet release as a good sign for 4.16," he had
    previously noted that "things seem calmer than 4.15. We now have (known) stays
    pending, and there were no issues during the merge window," until the tail-end
    of the 4.15 development cycle, which coincided with the public discourse of security
    vulnerabilities that might make many modern distributions problematic.


    In the end, 4.15 needed RCs (Release Candidates) compared with the usual 7, and
    to course this cycle, this offered plan was made by a number of members of the
    community for travel or much needed downtime. As a result, Linus noted that he
    would have to delay the next release.


    The 4.16 includes a number of interesting features that were present in Linus''s
    tree during the development cycle. These include support for the ''Jailhouse''
    on x86 systems, Memory Protection Keys on PowerPC, and of course more security
    fixes for the Meltdown and Spectre vulnerabilities.


    Memory Protection Keys enables applications to limit their access to certain regions
    of their address space. While there are many ways to do this, we want to do it
    with more security. By using interfaces, such as the kernel API, an application
    can explicitly restrict its own access to, for example, memory containing crypto
    keys, except for those times when it needs to access them. If an exploit is later
    found in the application, it may trick it into leaking the crypto key through
    an unintended access which will trigger a fault.


    The Jailhouse is known as a ''static partitioning'' hypervisor it''s not intended
    to build a cloud-computing service or to run generic operating system, such as
    Windows guest VMs. Instead, jailhouse is intended to explicitly isolate hardware
    resources without hiding its existence from the applications running on the machine.
    Typically, Jailhouse is used in areas such as autonomous vehicles, where lightweight
    for real-time requirements is important.


    Peter Misdek is working on upstream patches previously created by Jason Baron
    for atomic kernel updates (kpatch) is a mechanism through which a running kernel
    can be updated without rebooting by applying already prepared binary patches.
    Until now, these live patches could be removed only in one patch which would necessitate
    removing and reapplying other numbers.


    Taras Kondrutik is working on adding attributes to the eBPF format used for kernel
    images. This would allow SELinux to be loaded on files without an initial image.
    By adding attributes to the image, SELinux could also address security issues,
    and which were generally well received. The question turned to whether the eBPF
    standard could be used, or if it would be possible to support the latter (which
    might require some support from it), it seems the latter is more needed.


    # Meltdown and Spectre


    The fallout and clean-up from the disclosure of Meltdown and Spectre microprocessor
    vulnerabilities led to a second month, with many different patches deployed to
    address it (mitigating any known flaw) exploits. As explained in the first month-length
    cycle of development, free fixes will eventually necessitate hardware changes
    over time as the kernel comes to market. Until now, we''ve been faced to choose
    a small loss in performance that comes from work containing contained flaws by
    various organizations to protect systems from potential exploitation.


    In the case of the x86 architecture, Linux 4.15 carried most of the patches required
    for bare-bones mitigation of Meltdown, and using an upstream kernel of the box.
    As Linux explained in his 4.15 announcement message, users can use the cat command
    to find the files contained within the /sys/system/cpu/vulnerabilities directory,
    with each file documenting a potential security issue and how it is being mitigated.
    These include mitigations for Spectre (attacks against the CPU branch-prediction
    hardware), as well as Meltdown (to dump arbitrary memory on an unprotected system),
    but not (as of 4.15) addresses any variant of Spectre (Bounds Check Bypass). Various
    distributions of course have carried their own fixes, which may initially be more
    comprehensive.


    Upstream address variant 2 of Spectre using a novel approach introduced by Google
    and in a technical whitepaper last month. The attack on branch-prediction typically
    targets indirect branches (controllable) locations. When the branch predictor
    is ''poisoned'' (by crafted code, explained as last issue), the processor may
    execute arbitrary code that is not intended by indirect jumps. These pieces of
    code are called ''gadgets'' when executed, and the traditional fix for this is
    to disable the branch handles indirect jumps.


    The alternate, known as a ''retpoline'', does something it replaces indirect jumps
    with function calls carefully manipulating the return stack so the CPU thinks
    it is returning from a function. A jump is still made as part of this code, but
    in a careful manner, such that any specified code is henceforth forced to halt
    a branch misprediction. Retpolines require compiler support. GCC (or llvm) will
    generate these sequences in place of indirect branches. In the case of the kernel,
    what will be


