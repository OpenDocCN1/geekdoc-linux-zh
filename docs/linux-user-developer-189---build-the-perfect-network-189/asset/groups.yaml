  mdcn: "\n\n# 教程\n\n# Python\n\n## 简化数据对象\n到目前为止，我们查看了如何设置集群以及显式地连接网络。这并不是大多数人使用\
    \ Dask 的方式。许多人利用 Dask 提供的数据对象来并行处理任务。引入的三个主要对象是 Array（数组）、Bag（袋）和 DataFrame（数据框）；它们提供了针对特定工作流优化的功能。\n\
    \n强制此点。Bag 的内容是不可变的，不能被更改。这样就不会损坏可能被其他线程使用的数据。创建一个 Bag 可以简单地使用 `from_sequence()`\
