- md: "\n# Server hardening\n\n## Secure your system with server hardening\n\nBatten\
    \ the hatches and lock down your Linux server by following these handy instructions\n\
    \n![](img/301dc180ffb6e12d0783cd1567376047_45_0.png)\n\nIf you operate your Linux\
    \ server, you can congratulate yourself on being in good company: Linux accounts\
    \ for over 97 cent of all server operating systems. This is because Linux is free\
    \ of charge but also because those popular servers such as Debian and Ubuntu are\
    \ highly customizable. \n\nUnfortunately, Linux's relative popularity also means\
    \ your servers are popular targets for attack, such as Mirai, the staggering denial\
    \ of service attack in 2016 which targeted various DNS hosting providers.\n\n\
    In this guide, you'll discover ways to 'harden' your server to protect against\
    \ this and other types of attacks. If your server is running Ubuntu 16.04 LTS,\
    \ it is one of the most popular Linux systems on the market.\n\nYou can also encrypt\
    \ any external drives to which the server is connected using cryptsetup. For instance,\
    \ to encrypt the drive using /dev/sdb1, run sudo cryptsetup luksFormat and follow\
    \ the process of entering a password; formatting the drive will be lost.\n\nThe\
    \ server's shared memory is another vulnerable point. This area is designed to\
    \ allow programs to exchange data easily, but a malicious program could potentially\
    \ execute processes you don't want, or change the system programs. Set memory\
    \ to read-only by running sudo nano /etc/\n\n# The greatest advantage of unattended-upgrade\
    \ is its greatest weakness\n\nWe've assumed that you need steps for setting up\
    \ the server and creating a user account, as well as route on how to use apt-get\
    \ to install software. For the first time, we encourage you to read the Ubuntu\
    \ server guide. Make sure to backup your data before following these steps.\n\n\
    > Fstab: then adding the text /run/sh defaults 0 0 to the end of the file. This\
    \ will improve your server security, remember that certain accounts may need to\
    \ write to /run/sh. Reboot your machine and run sudo mount -a.\n\n# Secure drives\
    \ and memory\n\nWhen setting up your server, you should have been given the option\
    \ to encrypt your partitions, including the swap space, using LUKS. If you chose\
    \ a guided installation, you can encrypt the home folder. If this is seized while\
    \ it is powered off, it would be extremely difficult to access your data.\n\n\
    # Automatic updates\n\nAdmins have to strike a balance between critical updates\
    \ and keeping the server running. The unattended-updates package, which comes\
    \ preinstalled in Ubuntu Server, offers an advantage. During the setup, Ubuntu\
    \ will ask you if you wish to enable automatic updates. If you're to ensure this\
    \ is enabled, you can view your current unattended-upgrade configurations by running\
    \ sudo nano /etc/apt/apt.conf.d/50attended-upgrades\n\nIf you're using Ubuntu,\
    \ you also have the option to encrypt the home folder account before it's created.\
    \ If you didn't, you can use the cryptfs-home-tool to create a new home folder\
    \ with encrypted data. To do this, link and run cryptfs-migrate-home --user=username.\
    \ Follow the steps on screen. Once you complete it, you must log into your account\
    \ before the next restart. If your swap is unencrypted, an adversary can also\
    \ gather data on running processes, so make sure it's encrypted with sudo cryptsetup-swap.\n\
    \n![](img/301dc180ffb6e12d0783cd1567376047_45_1.png)\n\nRemove the // at the start\
    \ of any line to enable other kinds of update if you want.\n\nSecurity updates\
    \ usually require a restart. You can configure the server to do this automatically\
    \ by starting with Upgrade-Automatic-Reboot and setting false to true. If you\
    \ are worried about much severe downtime, you can also schedule restarts by changing\
    \ the Automatic-Reboot value. For example, set unattended-upgrade-reboot \"04\
    \ * * * *\";\n\nYou can tune your update schedule by further running nano /etc/apt/apt.conf.d/config(20auto)\
    \ to edit.\n\n```\nAPT-Periodic::Package-Lists: \"1\"\nAPT-Periodic::Download-Upgradeable-Packages:\
    \ \"1\"\nAPT-Periodic::AutocleanInterval: \"7\"\nAPT-Periodic::Unattended-Upgrade:\
    \ \"1\"\n```\n\nThis configuration will update the package lists, download and\
    \ apply updates every day. The local download archive is cleared once a week.\
    \ Feel free to change these values to a schedule that suits you. The greatest\
    \ advantage of unattended-upgrades is that they run automatically, in that you\
    \ don't have to worry about issues with your configuration. If you use unattended-upgrades,\
    \ note that these settings won't update the kernel itself. However, you can do\
    \ it via sudo apt-get dist. If you run multiple servers, you can also configure\
    \ them to send an email about update issues. See here for more information.\n\n\
    # AppArmor\n\nOne of the easiest ways to secure your server is to reduce its attack\
    \ surface. In particular, this allows many programs and services that you need.\
    \ For example, a simple DNS server doesn't need to run as root, which is ideal.\
    \ If you use Ubuntu Server, it is very easy to use \"Manual package selection\"\
    , then only install the packages you need. If you installed the default packages,\
    \ you can choose which to run. You can use systemctl stop --now. Reboot now to\
    \ finish removing.\n\nAppArmor is a kernel enhancement that protects resources\
    \ and networking is allowed. The specific rules for each program are enforced\
    \ through the use of profiles. These are small text files and some programs have\
    \ their own AppArmor profiles. At the moment, only the core of the system is installed,\
    \ you can choose to install more of the following collections:\n\n- Manual package\
    \ selection\n- Mail server\n- PostgreSQL database\n- Standards utilities\n- Ubuntu\
    \ server\n\nAnd AppArmor shares more with each new release; you can create other\
    \ profiles. The most restricted mode for AppArmor is when all unauthorized access\
    \ is blocked and logs are logged. The easiest way to use is to install apparmor-utils.\
    \ You can then enforce specific profiles via the command. For instance:\n\n```bash\n\
    sudo aa-enforce /etc/apparmor.d/usr.sbin/dovecat\n```\n\nYou can run AppArmor\
    \ in 'complaint' mode where policies are logged but not enforced. See here for\
    \ more information.\n\n# Lock down SSH\n\nAs administrator, you'll probably need\
    \ to log into your server via SSH. Run sudo nano sshhd_config to view your current\
    \ configuration. The first port is the default. If you're used on one system,\
    \ use stat to see any ports currently in use. You can log in by changing the value\
