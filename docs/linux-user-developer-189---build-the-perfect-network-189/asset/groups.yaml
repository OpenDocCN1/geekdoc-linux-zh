    # 开源


    06 新闻与观点 | 10 字母 | 12 访谈 | 16 Kernel世界


    ![](img/301dc180ffb6e12d0783cd1567376047_5_0.png)


    # UBUNTU


    ## 由于稳定性和共享问题，Wayland 不再作为默认


    由于对稳定性的抱怨，Xorg 更适合这项工作。


    据报道，即将发布的 Ubuntu 18.04 LTS ''Bionic Beaver''（海羚海狸）将放弃 Wayland 显示服务器并恢复到 Xorg。桌面工程经理
    Will Cook 在博客中解释说，系统将包含 Xorg 图形栈和基于 Wayland 的系统。然而，在一次巨大的反转中，他强调了 Xorg 将成为默认选项。


    考虑到 LTS 版本拥有五年的支持寿命，因此它需要可靠地运行。Cook 列举了如 WebRTC、Google Hangouts 和 Skype 等屏幕共享服务；带有
    RDP 和 VNC 的远程桌面；以及——


    在探索前两者时，Cook 观察到 Wayland/GNOME 计划是使用 Pipewire 进行屏幕共享，这需要进一步开发。“在此之前，Xorg 可以独立于显示服务器重新启动。”


    关于可恢复性，文中明确了 GNOME shell 在崩溃时可以“结束”其他进程的事实：“当使用 Xorg 时，shell 可能会崩溃，一旦 shell 重启，你就可以从离开的地方无缝接会话，你的应用程序仍在运行。”


    虽然开源驱动程序运行良好，但涉及到游戏时，他们想要确保 Wayland 的稳定性是合情合理的。对于标准的桌面活动，专有驱动的可靠性较低，遗憾的是，它们在帧率、纹理等方面的性能要好得多。解决此办法是切换到
    Xorg 并使用专有驱动。


    Cook 补充道，这不仅仅是为了 Wayland。“在使用不会崩溃或导致架构崩溃的 shell 时也存在问题。对于这项进行中的工作有两个解决方案，我们将向即将推出的上游做出贡献。简而言之，我们仍然致力于
    GNOME 和 shell，通过添加功能和修复漏洞来改进 Wayland。”


    正如 Cook 所指出的：“Ubuntu 的体验需要是稳定的，并提供用户在日常生活中需要的功能……对于 18.04 LTS，我们将评估 Wayland 作为默认选项。”恢复到
    Xorg 仅仅是 Wayland 最终被所有主流发行版接受道路上的一个小插曲。


