    \ your personal version of Dask.\n\n## Install Dask\n\nBefore you get started,\
    \ you need to have Dask installed. Because there are so many parts to, the development\
    \ team has provided installation in several ways; thus you can install only the\
    \ parts you need. If you're just starting up it's pretty simple. Out of the box,\
    \ Dask is already configured to run on a single machine. This allows you to start\
    \ developing and running code. Dask uses schedulers to manage tasks and ensure\
    \ they behave as intended. On a single machine, the default scheduler scales up\
    \ to use threads and processes requires no additional code and is the best way\
    \ to get started with Dask, such as Bag and DataFrame. This means you can get\
    \ better performance with ease. You will then need to handle the choice of scheduler\
    \ in order to get it to work, with code like:\n\n```python\nimport dask.array\
    \ as da\nimport dask.bag as db\n\nx = da.random((10000, 10000), chunks=(1000,\
    \ 1000))\nresult = x.compute()\nprint(result)\n```\n\n```python\nthread_sched\
    \ = dask.distributed.get()\nproc_sched = dask.multiprocessing.get()\n```\n\n![](img/301dc180ffb6e12d0783cd1567376047_49_0.png)\n\
    \n## Bernard\n\nIn this day, Bernard helps researchers and students at the university\
    \ level in designing and running projects on supercomputing clusters.\n\n## Resources\n\
    \n- Dask http://bit.ly/dask\n- Dask documentation: https://dask.org\n\nAll of\
    \ the above using lower-level functions available within the Python standard library,\
    \ there is no reason to do the work. The Dask library has been designed to manage\
    \ the complexities involved when you use more than one CPU core. It provides the\
    \ functionality to create and schedule tasks, as well as classes to manage data\
    \ that is aware of parallel execution. Tutorial available at: filesilo.co\n\n\
    ![](img/301dc180ffb6e12d0783cd1567376047_49_1.png)\n\n50\n\n## Use scheduling\n\
    \nOnce you have some code ready, you will likely need to move to an environment\
    \ where you can take advantage of even higher parallelism - maybe you've built\
    \ a Raspberry Pi cluster, or you're working in an HPC environment at the university.\
    \ In these cases, you will need to use a distributed scheduler. You can also use\
    \ this scheduler on a single machine, which will allow you to do all of your development\
    \ locally before moving to a larger production system. In this case, you just\
    \ need to create a new Client object with options such as below:\n\n```python\n\
    from dask_distributed import Client\nclient = Client()\n```\n\nThis sets up a\
    \ local cluster of scheduler and workers, as in Figure 1. When you move to multiple\
    \ machines, you will need to use this same infrastructure across your network\
    \ of machines. The first step is to set up a scheduler on the main machine, using\
    \ **dask-scheduler**:\n\n```\n# dask-scheduler\nScheduler at tcp://192.0.0.1:8786\n\
    ```\n\nThis starts the scheduler on this machine, listening for incoming requests\
    \ from workers. You process these with the command **dask-worker**, giving it\
    \ the IP address of the machine hosting the scheduler.\n\n```bash\n# dask-worker\n\
    Start at: tcp://192.0.0.1:8786\nRegistered to: tcp://192.0.0.1:8786\n```\n\nIf\
    \ you want to manage workers from your scheduler, you can use the dask-ssh command\
    \ to start workers on the remote nodes over SSH. To do this, however, the Python\
    \ library **dask** must be installed on each cluster.\n\n## First run\n\nOnce\
    \ you have hundreds of threads or processes, how do you set them up? The most\
    \ direct way is to create a Client object that uses this network, and handle the\
    \ location of the scheduler process. For example, you would use 192.0.0.1:8786\
    \ as the parameter to the **Client**. You can then call map functions to distribute\
    \ your function across the cluster and get the results back. As an example, if\
    \ you wanted to get the result of the first 100 numbers on your cluster: you would\
    \ use something like this:\n\n```python\ndef square(x):\n    return x**2\n\nanswer\
    \ = client.map(square, range(100))\nclient.gather(answer)\n```\n\n![](img/301dc180ffb6e12d0783cd1567376047_50_0.png)\n\
    \n## First run\n\nOnce you start running them, the more you spread out the work\
    \ among them, the more you open up a huge number of options in how to tune the\
    \ system for your own needs. The scheduler is easy to work with. You can use the\
    \ **scheduler_info()** method of the Client object to get the details of the current\
    \ configuration. If you need more information, you can collect logs by executing\
    \ get_scheduler_logs() and the worker logs with **get_worker_logs()**. This gives\
    \ you details on how the scheduling has been handled in the past.\n\n> Above Dask\
    \ uses a central scheduler and a set of workers that do the actual computational\
    \ work\n\n> Debugging Dask code is debugging Dask code. The standard debugger\
    \ doesn't know how to communicate across multiple machines. If you need to debug,\
    \ you might need to simplify your job so that it can run on a single machine locally.\n\
    \n> Anaconda includes all the options for Dask. If you are using a Raspberry Pi,\
    \ try Berryconda indent\n\nwww.daskuser.co | 51\n"
