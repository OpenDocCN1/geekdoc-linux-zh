    and is available for x86, ARM and AMD devices.


    Manjaro

    jaro is a more powerful distribution with automatic hardware detection, multiple
    kernel support and configuration.


    Archman GNU

    Based on Arch, this version eschechew pacman in favor with the intention of making
    software installation easier. It''s lightweight, too.


