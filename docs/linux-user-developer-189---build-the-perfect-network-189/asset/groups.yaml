    \ 49\n\n## Python\n\n## Dask: how to do parallel programming the easy way\n\n\
    Parallel computing can be difficult to do well, especially with large amounts\
    \ of data – but meet Dask.\n\nParallel programming can be one of the most difficult\
    \ techniques to implement. After all, the whole point is to run multiple procedures\
    \ concurrently. Once you start having more than one at a time, you can get confused\
    \ as to what process caused the result you're seeing. Debugging reveals a new\
    \ level of difficulty, especially when you have large sets of data that need to\
