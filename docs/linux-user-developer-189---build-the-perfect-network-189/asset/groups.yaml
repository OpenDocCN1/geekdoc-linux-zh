    ### 快速指南

    反向代理

    反向代理的工作方式与普通代理不同，它将请求从一个服务器转发到另一个。其理念是如果你有多个域名指向你的本地服务器（或其他），例如，你可以将请求转发到 yourdomain.com，尽管所有请求都进入
    80 端口，由反向代理执行。


    ## 如何

    设置代理服务器


    | 名称 | 是否安装 | 最新版本 | 说明 |

    | :--- | :--- | :--- | :--- |

