    - Destination system may not support all attributes (dates, rights, etc...)

    - Delete the file if it''s no longer needed


    Duplicity verifies backups on an online service periodically to ensure their integrity


    # ## Backup control


    The tool allows you to fine-tune a backup by specifying which files you don''t
    want to back up. It contains a list of common patterns for files to exclude such
    as temporary or hidden files, and you can also manually specify your own patterns,
    files, and exclude files that exceed a particular size. There is also an option
    to exclude files that are larger than a particular size. Furthermore you can use
    the Advanced pull-down menu to add and remove a host of other users.


    # ## Backup control


    The program allows you to exclude directories or files from a backup by either
    filtering them or choosing one of the predefined list items to exclude certain
    types of files. There''s also an option to exclude files that are larger than
    a particular size. Furthermore you can use the Advanced pull-down menu to add
    and remove a host of other users.


    # ## User experience


    Back In Time is very intuitive. One runs with multiple profiles to access and
    back up system files. The first time you''re invited to create a backup profile
    within the default folder using the multi-tiered settings. You can create many
    profiles with different backup settings as needed.


    # ## User experience


    Duplicity has a graphical interface which is clear and intuitive and can be locked
    with a password. Duplicity breaks down critical tasks into wizards; the app runs
    through a step wizard to help configure a backup. It also exposes the right amount
    of info in hand, while advanced options are just a pull-down menu away.


    For security, Back In Time can encrypt snapshots using EncFS. You can use its
    interface to create a locally encrypted or an SSH-encrypted profile. However,
    it is not necessary to compress the snapshots to save both time and disk space.


    Files are encrypted with AES-256 by default and you can also use GPG to compress
    the backups to your destination. Duplicity also compresses all data it is encrypted
    and transfers compressed copies of already compressed files such as .zip and .gz.


    # ## Restoration


    Back In Time creates snapshots, which means a directory''s contents into the backup
    if the contents change (you can specify if you want to use a file''s checksum
    to detect changes, which takes time). The tool can restore individual files and
    complete directories to their original location or to a custom location.


    The Restore lists all backups, but also gives you the option to restore from backups
    not listed or from a cloud service. Once you''ve selected a backup, Duplicity
    enables you to select and selectively restore individual files or the entire archive.
    Files can be restored to their original location or a different location.


    # ## Overall


    Back In Time does not support multiple network protocols or encryption standards,
    nor can it compress snapshots. However it still manages to offer a good number
    of configurable parameters.


    Duplicity offers all the best features of its peers and excels at virtually all
    backup and restoration tasks. Its intuitive interface gives you the right number
    of options at any given moment.


