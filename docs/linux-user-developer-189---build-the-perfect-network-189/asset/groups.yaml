    Dask is already configured to run on a single machine. This allows you to start
    developing and running code away. Dask uses schedulers to manage tasks and ensure
    they behave as intended.


    When on a single machine, the default scheduler scales up to use threads and processes
    on the system. This scheduler requires no additional code and is the best way
