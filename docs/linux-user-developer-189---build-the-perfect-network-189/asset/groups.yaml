  mdcn: "\n\n# Linux 核心教程\n\n通过将构建每个子目录的规则标记为 `.PHONY`，我们可以确保它们始终能够运行，即使它们与未更新的目录同名。\n\
    \n| 图 2 |\n| :--- |\n| SUBDIRECTORIES = images audio |\n| .PHONY build_subdirs\
    \ |\n| build_subdirs : $(SUBDIRECTORIES) |\n| $(MAKE) -C $$0 |\n\n每个子目录都被视为先决条件。每个子目录都有一个独立的规则来调用指定位置的\
    \ Makefile。我们需要通过 `.PHONY` 来创建这些规则，否则 Make 将把它们指向实际目录而不是运行（因为目录尚未更新，或者不需要）。\n\n\
    ## 在 Make 之间传递变量\n\n在复杂的 Makefile 中，由于不同的 Make 调用之间存在变量，我们可能希望递归地传递变量的值。例如，如果我们在整个过程中使用\
    \ `IMAGE_DIR`，我们不想在每一个 Makefile 中重新定义 `IMAGE_DIR`。\n\n解决方案是利用 Make 变量和调用之间存在对应关系这一事实。对于\
    \ Make 调用的每一个 Makefile，都会共享同名的变量。我们可以通过在递归调用所有 Makefile 之前定义想要包含的变量来解决这个问题：\n\n\
    ```bash\n$ export IMAGE_DIR=$pictures\n```\n\n然后我们可以在任何 Makefile 内部访问此变量 `$(IMAGE_DIR)`。然而，我们在\
    \ Makefile 内部定义变量的值或使用如 `$(path)` 等特殊功能。幸运的是，Make 允许我们通过 `export` 关键字将变量导出到整个环境：\n\
    \n```bash\n$ export TARGET_DIR=$target\n```\n\n当我们写下时，确保 `IMAGE_DIR` 变量对所有的 Make\
    \ 调用可见。我们可以使用 `export` 和 `unexport` 来更改 Make 变量的作用域。\n\n![](img/301dc180ffb6e12d0783cd1567376047_39.png)\n\
    \n```make\n# 所有 Make 调用可见\nexport TARGET_DIR\n# 仅在此 make 中访问\n```\n\n“多个 Makefile”方法是将过程拆分为独立部分的简单方法。如果项目部分是独立的，那么它们运行得非常好。然而，将构建部分拆分为独立的\
    \ Makefile 有许多缺点。\n\n问题在于，独立的 Make 调用是完全分离的。它们共享变量，但正如我们在本节看到的，它们无法从一个 make 作为另一个\
    \ make 的依赖来共享。\n\n## 对于 shell 中的环境，Make 会创建同名的变量\n\n为了理解这个问题，让我们回到示例。假设我们正在构建一个依赖于\
    \ `AttributeError.h` 和 `Screen.h` 头文件的项目。这些头文件位于目录内部，不是由人工定义的，而过程中自动生成的。问题是它们是在目录内的\
    \ Makefile 中生成的。我们应该将文件作为依赖：\n\n```make\nPHONY:\n$(MAKE) -C $$0\ngamepad: gamepad.AttributeError.h\n\
    gcc -o gamepad gamepad.c\n```\n\n由于 `AttributeError` 和 `Screen.h` 是目录内的 Makefile\
    \ 构建的，它们在任何 Make 变量中定义。这意味着它们没有被视为源文件，Make 将拒绝继续构建。只要我们在运行 `gamepad` 之前运行 Makefile\
    \ 就可以了。作为此的改进，我们可以添加一条规则，确保目录内的文件始终在该 Makefile 中构建：\n\n```make\nInclude/\n$(MAKE)\
    \ -C $$0\n```\n\n这个问题在于，我们现有的 Makefile 并不知道第二个 Makefile 中 `Screen.h` 的先决条件。当然，我们可以在第一个\
    \ Makefile 中添加更多信息来解释这一点，但我们会产生大量的重复代码，并失去了最初拥有多个 Makefile 的好处。\n\n## 图 3 - tar\n\
    \n解决问题的唯一真正方法是使用单一 Makefile 调用，而不是递归调用 make。这种方法将迫使我们使用单个 Makefile，因为 Makefile\
    \ 允许我们使用 `include` 将 Makefile 相互包含。\n\n```make\nMAKE_SUBDIR = for dir in $(SUBDIRS);\
    \ do (cd $$dir; $(MAKE) $$0) exit 5; done\ndefault:\n    @$(MAKE_SUBDIR)\nall:\n\
    \    @$(MAKE_SUBDIR)\ninstall:\n    @$(MAKE_SUBDIR)\nclean:\n    @$(MAKE_SUBDIR)\n\
    ```\n\n这种处理大型多目录项目的策略可以通过将这些 Makefile `include` 到我们的基础 Makefile 中来到达每个目录，而不是递归调用它们。例如，以下代码将包含我们的\
    \ Makefile 中：\n\n![](img/301dc180ffb6e12d0783cd1567376047_40.png)\n\n采用这种方法时，我们应该确保被包含的\
    \ Makefile 中的没有任何变量名与主 Makefile 中的变量名重合，因为 `include` 除了包含给定文件的文本外，没有做任何其他事情。\n\
    \n上面经常看到开发者使用 shell 循环来递归调用子目录中的 Make，但本教程中概述的方法更好。\n\n## 自动构建\n\n假设我们正在构建一个大型项目。我们有很多包含我们输出的规则。然后我们可以包含所有的\
    \ `.d` 文件作为依赖：\n\n```make\nSOURCES = player.c screen.h\ninclude ($(SOURCES:.c=.d)\n\
    \ncomponent: player.c\n```\n\n使用 `include` 指令是关键的：如果文件不存在，Make 会报错（幸运的是，`include`\
    \ 可以忽略不存在的文件）。如果我们想在整个过程中使用 `IMAGE_DIR`，或者使用诸如 `$(path)` 等特殊功能。\n\n## 发现工具\n\n\
    **Toni Castillo**              \n\n上面谁说黑客不享受美观且功能强大的图形界面？\n\n"
