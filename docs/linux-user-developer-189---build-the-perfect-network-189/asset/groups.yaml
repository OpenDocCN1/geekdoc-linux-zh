    # ## Pass variables between makes


    With a complicated makefile where we have variables between different invocations
    of Make, we might reactively want to pass the values of variables. For example,
    if we use IMAGE_DIR throughout our process, we don''t want to redefine the IMAGE_DIR
    variable inside every single makefile.


    The solution is to use the fact that there is a close correspondence between Make
    variables and invocations. For every makefile that Make calls, it will share its
    variables with the same name. We can get around the problem by defining the variables
    that we want to include in all the makefiles, so before calling them recursively.


    ```

    $ export IMAGE_DIR=$pictures

