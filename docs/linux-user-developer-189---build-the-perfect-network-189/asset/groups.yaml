    # Build the Perfect Network


    ## Other types of access


    It''s not all about computers plugged into Ethernet switches – what if you or
    others want to connect wirelessly?


    > QUICK TIP Password policies

    > You may want a fancy simple password for guest access, but choose a much stronger,
    and different one, for internal network access.


    When it comes to adding wireless access to your network, it brings a lot of new
    questions and the answers you need serious consideration before diving in:


    - Do you want to give access to visitors?

    - Should you have a separate network for guests that gives access to the internet
    but not local computers?

    - Where should access point be?

    - Do I need multiple access points?

    - Will antennas help?

    - Which access point should you use?


    It is likely that your ISP-provided router includes an access point (AP), but
    that may not be ideal. Aside from privacy concerns of your ISP remote access to
    your device, it may not provide the features you want, or it is not located in
    the best place for coverage. Standalone APs are usually with far more features
    than the default. There are a couple of Linux distro for APs, DD-WRT and OpenWrt
    – which we use. These allow many services you can run of your network on the AP,
    such as DNS or VPN, reducing the need for an always-on computer to do this.


    A strength app on a mobile phone will help you decide the best place for overall
    coverage. If the building is large, or the walls too thick to cover everywhere,
    you have a number of options: different antennas, more than one AP, or repeater.
    A repeater uses it to increase connections, to one device and to the other, the
    AP would strengthen signal. Multiple APs work well and if you use them same SSID
    and password on each device, switch automatically as you move around the building,
    always giving a decent signal. When you have signal strength issues, check with
    nearby APs and set your APs to channels well away from each other. The better
    APs also have removable antennas. Changing the antenna will not increase the power,
    but it will enhance the coverage. A higher-gain, longer antenna will increase
    horizontal coverage (assuming the AP is positioned vertically) at the expense
    of vertical coverage. This is useful in a single-story building, or if you have
    a large area. If you are unable to position your AP centrally, you may be able
    to fit a directional antenna that gives asymmetrical coverage.


    Access point placement is important, and is easier to do with a separate AP as
    you are not tied to where the internet connection enters the premises.


    > QUICK GUIDE Guest access

    > You need to consider who you''re inviting to your wireless network. Connecting
    to the AP not only gives them the internet but also your local network. Whether
    you can provide one for the guests (Virtual LAN) and which the guest VLAN is separated
    from yours. The exact details of this vary depending on your router''s operating
    system or Wi-Fi hardware. One the best approach is to create the VLANs in your
    router and connect a separate AP for each one. Depends on the router, which is
    best and depends on APs. Do you have the option of using traffic-shaping to prevent
    guest users sucking up your bandwidth. Some refer to this as hotspot mode. Don''t
    be tempted to make your guest access open, it still needs WPA.


    ## Adding a VPN


    Once you start adding more computers to your network, the need to access them
    from outside grows. This raises a few issues. If you have more than one of them,
    you have to run SSH on standard ports, as a NAT router can forward each port to
    the one; there are ways around this with reverse, but it is complicated. Another
    issue is that the more ports you open up to the outside world, the more exposed
    you are. So it would be to connect to your network from outside in a way that
    is secure, but allows you to get everything you can.


    OpenVPN (Virtual Private Network) uses a secure tunnel to protect your internet
    traffic outside. With OpenVPN, you can join a VPN based on SSH, which is a secure
    method of connecting. It should be noted that the VPN services that you use are
    the same as the one everyone else uses, someone else or not, you join, to disguise
    your location. Here is how we have it


    It can be a little tricky to set up but there is help in the form of PIPVPN. From
    the name you guessed it is designed for the Raspberry Pi, and one of the tiny
    boards tucked away on your network can act as a gateway, but it also runs on Ubuntu
    and Debian distributions. To set up an OpenVPN server using PIPVPN; run:


    ```

    $ curl -l https://pipvpn.io

    ```


    This will download the script and run it. It will ask you for some options, generate
    keys for the server, install and configure client to be able to connect. PIPVPN
    does this for you too:


    ```

    $ pipvpn add

    ```


    This asks you for the name and a password (not the same as the user''s password
    on the computer). PIPVPN will generate a file with both configuration and certificate.
    This is what you import into the VPN client to establish it.


    ![](img/301dc180ffb6e12d0783cd1567376047_29_0.png)


    ## Encryption strength


    Choose your desired type of encryption (from space to select):

    This is an encryption key that will be generated on your system. The larger the
    key, the more time this will take. For most applications, it is recommended to
    use 2048 bits. If you are unsure you can use 1024 bits which is enough for normal
    use! If you are paranoid about things... then grab a cube of you and pick 4096
    bits.


    - 1024 encryption (testing only)

    - 2048 encryption (recommended level)

    - 4096 encryption (paranoid level)


    Above PIPVN is the easiest way to set up OpenVPN; the eagle-eyed you may have
    noticed that it''s running on Ubuntu, not on a Raspberry Pi, despite the name


    ## PRODUCTS


    ### Access point firmware

    Replace your access point or router''s firmware with an open source alternative.


    ![](img/301dc180ffb6e12d0783cd1567376047_0.png)


    ### DD-WRT

    DD-WRT is the most well-known choices. Its name comes from the fact that it was
    originally developed for classic WRT and now covers hundreds of models, but more
    flexible, at the expense of effort. With it, you can increase the capabilities
    of your router.


    ![](img/301dc180ffb6e12d0783cd1567376047_1.png)


    ### OpenWrt

    OpenVPN is a fork of it.


    ### Installing firmware

    Installing your OS on your router is surprisingly simple, especially if you are
    using a factory installed, but be careful to follow the instructions to avoid
    bricking your router.


