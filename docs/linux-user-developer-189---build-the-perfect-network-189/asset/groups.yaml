    # in this issue

    >> Build the Perfect Network, p18

    >> Qubes OS from Scratch, p60

    >> Saving Lives with Mesh, p33


    Welcome to the UK and North America''s favourite LinuxUser and FOSS magazine.
    I experienced an earthquake while we were making this inspiring piece on open
    source mesh networks used for disaster relief (p34). Fortunately, it was only
    4.3 on the Richter scale. But there are plenty of other things to get us excited
    about as we set up a network suitable for advanced home or small-business use
    (p18).


    If security and privacy are your concern, you''ll enjoy our guide to building
    Qubes OS from scratch, with its bare-metal hypervisor-based compartmentalisation
    (p60). Meanwhile, in tutorials we have a standalone primer on the worlds of statistical
    programming with R; server hardening with Drake; and in Pi tutorials we will have
    ''ZeroPhone'' himself, Arsenij Pencuis, with a guide to monitoring your Pi''s
    system parameters with a press of button!!

    Chris Thorn, Editor


    COMPETITION

    Write to us and win an iTunes Dash Pro!

    linuxuser@futureunet.com

    Twitter: @linuxusermag

    Facebook: facebook/LinuxUserUK

