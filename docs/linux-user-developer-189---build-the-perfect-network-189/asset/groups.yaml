    # 服务器加固


    ## 通过服务器加固保护您的系统


    遵循这些实用的指令，筑好防御措施并封锁您的 Linux 服务器


    ![](img/301dc180ffb6e12d0783cd1567376047_45_0.png)


    如果您正在运行 Linux 服务器，那么可以恭喜自己，因为您加入了一个优秀的圈子：Linux 占据了所有服务器操作系统的 97% 以上。这不仅是因为 Linux
    是免费的，还因为像 Debian 和 Ubuntu 那些热门服务器具有高度的可定制性。


    遗憾的是，Linux 的相对流行也意味着您的服务器是攻击的热门目标，例如 2016 年针对各种 DNS 托管提供商的惊人拒绝服务攻击——Mirai（米 瑞
    虫）攻击。


    在本指南中，您将发现一些“加固”您的服务器的方法，以防止此类及其他类型的攻击。如果您的服务器运行的是 Ubuntu 16.04 LTS，它是市场上最流行的
    Linux 系统之一。


    您还可以使用 `cryptsetup` 对连接到服务器的任何外部驱动器进行加密。例如，要加密驱动器，运行 `cryptsetup luksFormat /dev/sdb1`
    并按照过程输入密码；驱动器将丢失。


    服务器的共享内存是另一个漏洞点。该区域允许程序交换数据，但恶意程序可能会执行您不希望的程序或更改系统。将内存设置为只读，运行 `sudo nano /etc/fstab`：


    # unattended-upgrade 的最大优势


    假设您需要以下步骤来设置服务器并创建用户账户，以及如何使用 `apt-get` 安装软件。第一次，我们建议您阅读 Ubuntu 服务器指南。在执行这些步骤之前，请确保备份数据。在
    `/run/sh` 文件末尾添加 `defaults 0`。这将提高服务器安全性，记住某些账户可能需要写入 `/run/sh`。重启机器并运行 `sudo
    mount -a`。


    # 安全驱动器和内存


    在设置服务器时，您应该获得加密您的分区的选项，包括交换分区，并使用 LUKS。如果您选择了引导安装，可以加密主文件夹。如果处于关闭状态，访问数据将非常困难。


    # 自动更新


    管理员必须在关键更新和保持服务器运行之间取得平衡。Ubuntu Server 预装的 `unattended-updates` 软件包提供了优势。在设置期间，Ubuntu
    会询问您是否启用自动更新。如果已启用，可以通过运行 `sudo nano /etc/apt/apt.conf.d/50attended-upgrades`
    查看当前的 unattended-upgrade 配置。


    您可以通过进一步运行 `nano /etc/apt/apt.conf.d/config` 来调整您的更新计划：


    ```

    APT-Periodic::Package-Lists: "1"

    APT-Periodic::Download-Packages: "1"

    APT-Periodic::AutocleanInterval: "7"

    APT-Periodic::Unattended-Upgrade: "1"

    ```


    此配置将每天更新软件包列表并应用更新。本地下载每周清理一次。可以随时更改这些值以适应您的计划。`unattended-upgrades` 的最大优势是它们会自动运行，因此您不需要担心配置问题。如果您使用
    unattended-upgrades，请注意这些设置不会更新内核本身。然而，您可以通过 `sudo apt-get dist` 执行它。如果您运行多个服务器，还可以配置它们在更新问题时发送电子邮件。请查看此处更多信息。


    # AppArmor


    保护服务器的最简单方法之一是减少其攻击面。特别是，这允许许多您需要的程序和服务运行。例如，简单的 DNS 服务器不需要以 root 身份运行，这是理想的。如果您使用
    Ubuntu Server，可以很容易地使用“手动软件包选择”，然后只安装您需要的包。如果您安装了默认包，可以选择运行哪些。您可以使用 `systemctl
    stop --now`。现在重启以完成删除。


    AppArmor 是一项内核扩展，用于保护资源并允许网络。每个程序的特定规则通过使用配置文件（profiles）实施。这些是较小的文本文件，某些程序有自己的
    AppArmor 配置文件。目前，只安装了系统核心，您可以选择安装以下集合：


    - 手动软件包选择

    - 邮件服务器

    - PostgreSQL 数据库

    - 标准实用程序

    - Ubuntu 服务器


    AppArmor 在每个新版本中都共享更多内容；您可以创建其他配置文件。AppArmor 最严格的模式是阻止所有未经授权的访问并记录日志。最简单的使用方法是安装
    `apparmor-utils`。然后您可以通过命令强制特定的配置文件。例如：


    ```bash

    sudo aa-enforce /etc/apparmor.d/usr.sbin/dovecat

    ```


    您可以在“投诉”（complaint）模式下运行 AppArmor，在该模式下策略会被记录但不会被执行。请查看此处更多信息。


    # 锁定 SSH


    作为管理员，您可能需要通过 SSH 登录您的服务器。运行 `sudo nano sshhd_config` 查看您当前的配置。第一个端口是默认端口。如果您习惯于一个系统，使用
    `stat` 查看任何正在使用的端口。您可以通过更改 SSH 端口的值来登录。如果您从网络上的某个位置使用服务器，可以使用 `LimitAddress` 将
    SSH 限制为 IP 地址。这是安全连接的最简单方法。添加其他 IP 地址（例如针对某台机器）。在完成后，必须在下次重启之前登录账户。如果您的交换分区未加密，攻击者也可以收集运行进程的数据，请确保使用
    `cryptsetup-swap` 进行加密。


    ![](img/301dc180ffb6e12d0783cd1567376047_45_1.png)


    移除任何行开头的 `//` 以启用其他类型的更新。


    安全更新通常需要重启。您可以通过启动 `Upgrade-reboot` 并将其设置为 `true` 来配置服务器自动执行此操作。如果您担心长时间停机，也可以通过更改
    `Automatic-reboot` 值来安排重启。例如，设置 `unattended-upgrade-reboot "04 * * *"`；


    # UFW (防火墙)


    UFW（Uncomplicated Firewall）是 Ubuntu 自带的简单防火墙工具，它让配置复杂的 iptables 规则变得简单。首先，通过运行
    `ufw status` 查看状态。如果它未启用，运行 `ufw enable` 来启用它。现在您可以允许特定的端口，例如，`ufw allow 22/tcp`
    允许 SSH，`ufw allow 80/tcp` 允许 HTTP，`ufw allow 443/tcp` 允许 HTTPS。如果您想阻止某个端口，可以使用
    `ufw deny <port>`。要删除某个规则，可以使用 `ufw delete allow <port>`。UFW 还可以允许特定的 IP 地址或范围，例如
    `ufw allow from 192.168.1.1 to any port 22`。您还可以允许特定的网段，例如 `ufw allow from 192.168.1.0/24`。UFW
    还可以限制流量流量。以下是一些常用的 UFW 规则：


    ```

    # 拒绝所有入站流量（默认）

    ufw default deny incoming

    # 允许所有出站流量

    ufw default allow outgoing

    # 允许 SSH (端口22)

    ufw allow 22/tcp

    # 允许 HTTP (80)

    ufw allow 80/tcp

    # 允许 HTTPS (443)

    ufw allow 443/tcp

    # 允许特定 IP 访问 SSH

    ufw allow from 192.168.1.1 to any port 22

    # 允许特定网段访问 HTTP

    ufw allow from 192.168.1.0/24 to any port 80

    # 限制每个 IP 的连接数（防止暴力破解）

    ufw limit in 22/tcp

    ```


    配置完成后，运行 `ufw enable` 启用防火墙。系统会警告这可能会断开当前的 SSH 连接，输入 `y` 确认。最后，运行 `ufw status
    verbose` 查看详细状态。


