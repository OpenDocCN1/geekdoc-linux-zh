    - pip install dask[dataframe]: 安装 Dask, numpy 和 pandas\n- pip install dask: 安装\
    \ Dask，仅提供你需要的\n\n如果你想避免安装，可以使用 Anaconda，它包含了 Dask 的所有选项。如果你在使用 Raspberry Pi，尝试\
    \ Berryconda。然后，如果你需要旧版本的功能，可以从源码下载。这是给读者的练习。\n\n## 安装 Dask\n\n在开始之前，你需要安装 Dask。因为有很多部分，开发团队提供了几种安装方式；因此你只需要安装需要的部分。如果你只是刚开始，它非常简单。默认情况下，Dask\
