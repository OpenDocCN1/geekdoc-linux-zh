    # Serval 项目：利用网状网络拯救生命


    Chris Thornett 采访了一位开源项目的创始人，该项目希望让每个人都能用上移动通信。


    ## 保罗·加德纳-斯蒂芬博士（Dr. Paul Gardner-Stephen）


    Paul 是澳大利亚阿德莱弗林德大学科学与工程学院的高级讲师。他是 Serval 项目的创始人。


    ## 核心信息


    Serval 项目是一项人道主义努力，旨在无论收入水平、地理位置或是否发生灾害，通过允许现成的手机在不需要基站的情况下直接通信，让所有人都能用上移动电信服务。


    ## 保罗的灵感来自哪里？


    “我会说‘这是一种纯粹主义’（嗯）；通过开源的笔记本电脑和手机来实现这种可能，因为这是必要的。我们也知道，那些正在做 Google Cubes 的人正在他们他们能触及的范围内为人们提供一个安全的互联网环境。”


    新可制造的 Serval 网状扩展器（Serval Mesh Extenders）用于连接各个社区，而不需要蜂基站。


    > “我记得我听过海地的地震，”Paul Gardner-Stephen 说。对于 Paul 这种哪里都骑自行车的人来说，这很不寻常，他那天坐出租车去上班，“我开着收音机，正听到地震正在发生的新闻。”Paul
    的工作是在阿德莱弗林德大学教授科学和工程学，但在过去的八年里，他一直在运行一套用于灾区的地区的开源网状移动电话系统。我们当时正在通过 PixieVoIP 通话交流，但他的声音穿透了我们交谈期间连接不畅的网络，当他回忆起海地的情况时，那种感觉依然很真实。“我本能地知道，在三三天内，在没有法律秩序能够协调行动的情况下，这会导致无政府状态。海地的地震最终影响了估计
