    # Build the Perfect Network


    ## Where to find


    - Design your network: What you need in terms of physical layout, and some of
    the hardware you may need.

    - File and media: Making sure all files on network are accessible to anyone.

    - Monitoring: Keeping an eye on the performance of computers.

    - Essential services: Providing the services you need for network, such as DNS,
    routing and proxy servers.

    - Automate systems: Keeping systems up to date and maintenance.

    - Wireless and security: Providing good connectivity, keeping your network safe
    from eavesdropping.


