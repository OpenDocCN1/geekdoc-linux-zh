- md: "\n# Tutorial\n\n# Python\n\n## Simplify data objects\nSo far we've looked at\
    \ setting up our cluster and then work to do so explicitly to the network. This\
    \ is not the way most people use Dask. Many take advantage of the data objects\
    \ provided by Dask for parallel processing tasks. The three main objects introduced\
    \ are the Array, the Bag and the DataFrame; they provide functionality that is\
    \ optimized for a particular workflow.\n\nenforce this. Bag contents are immutable\
    \ and cannot be changed. This way won't corrupt data that may be used by other\
    \ threads. Creating a Bag can be as simple as using the function `from_sequence()`\
    \ and a sequence of Python objects.\n\nA DataFrame is a more structured data object\
    \ modelled on Pandas DataFrames. As with Bag, a Dask DataFrame is created from\
    \ a set of smaller Pandas DataFrames. This design allows Dask to manage and work\
    \ on much larger data than a single machine can. Even if your data fits on a single\
    \ machine, Dask can distribute it across multiple CPU cores so that you can process\
    \ chunks of data in parallel. You can create Dask DataFrames from Pandas DataFrames\
    \ with the `from_` function.\n\nArrays are modelled on NumPy arrays, and simplify\
    \ the task of distributing the processing of this type of data across the network.\
    \ A Dask Array is made up of a grid of million NumPy arrays. By default, Dask\
    \ uses the threaded scheduler, however you use the distributed scheduler, with\
    \ no loss in performance. Because Dask is so associated with NumPy arrays, there\
    \ are actually helpful functions to use with NumPy.\n\nA Bag is a loose collection\
    \ of Python objects that can be distributed across your network of machines.\n\
    \nThis is also true for the others. The new data objects created by Dask (Bag,\
    \ Array and DataFrame) are generated based on properties that can be handled by\
    \ a scheduler. Your project may require a very particular structure in order to\
    \ manage tasks in an order. This is where the automatic processes in Dask come\
    \ in. If this is the case, you can create a new data object of your choice which\
    \ outputs a Dask graph that can be handed to a scheduler to executed.\n\n- three\
    \ broad layers: data, execution graphs and schedules\n\n| Array | Schedulers |\n\
    |---|---|\n| | | |\n\n### Bag Graphs\nDataFrame\n\n## Many use-cases take advantage\
    \ of the data objects provided by Dask in order to simplify the parallelism of\
    \ processing tasks\n\n## Generate graphs\nAll your work in Dask is actually implemented\
    \ by generating a graph and executing it. Dask takes each task that is to be executed\
    \ in the graph and converts it into a set of nodes and edges. The edges connect\
    \ one task to another to produce the output of a new process. Once the graph is\
    \ generated, the scheduler of Dask is chosen to execute the tasks. The actual\
    \ work is a full specification on how these graphs are generated, using standard\
    \ Python objects like dictionaries, tuples and functions. These functions can\
    \ mean that the scheduler is able to manage the execution in a very particular\
    \ way.\n\n## Make future optimization\nBecause of this intermediate layer between\
    \ your code and the scheduler, you have an opportunity to look at and potentially\
    \ optimize your code before they execute. There are a set of functions under `dask.optimize`\
    \ to provide a setting of optimizations that you can use to improve however performance.\n\
    \nFor example, you could call `dask.optimize.collect()` to remove any unnecessary\
    \ tasks from the Dask graph. If you need some optimizations that are common when\
    \ compiling code, such as inlining. The function `optimize.inline()` can inline\
    \ variables to access bottlenecks, while the function `dask.optimize.inline_functions()`\
    \ takes expensive function calls and them depend on the tasks.\n\nIn the more\
    \ general case, you can use your knowledge of the problem to provide changes to\
    \ the functions being executed to optimise the computations being done. There\
    \ are two alternatives: `revert()` and `recompute()`, which enable you to provide\
    \ a set of translations from to a more efficient one and then apply these transl\
    \ to a graph before handing it over to schedule.\n\nIf none of these built-in\
    \ functions provide enough control, you can define your own optimizations for\
    \ various objects. You can then use the function `dask.set_options()` to define\
    \ what optimizations are applied for various data objects.\n\nFigure 3\n\n![](img/301dc180ffb6e12d0783cd1567376047_52_0.png)\n\
    \n## Look inside Disk objects\nAs mentioned in the beginning of this article,\
    \ particle graph can get very messy and hard to debug - since they are written\
    \ by humans, there will be issues that need to be debugged. Lucky, Dask provides\
    \ some tools to make this process a bit easier. The first step is to look inside\
    \ Dask objects to see what state they are. For the new data objects provided by\
    \ Dask, there is a new property to query that provides this internal information.\
    \ Below is an example of what a Dask array might look like.\n\nwhat is happening\
    \ in program. For example, you c display a progress bar with the following code:\n\
    \n```python\nimport dask.array as da\nx = da.random.normal(size=(1000, 1000))\n\
    dict = compute(\n  'wrapped_1': (0, (5, 5, 5)),\n  'wrapped_2': (0, (1, 0, 5)),\n\
    \  'wrapped_3': (0, (2, 0, 5)))\n```\n\n```python\nimport dask.array as da\nx\
    \ = da.random.normal(size=(15, 25))\ndict = de compute(\n  'wrapped_1': (0, (5,\
    \ 5, 5)),\n  'wrapped_2': (0, (1, 0, 5)),\n  'wrapped_3': (0, (2, 0, 5)))\n```\n\
    \nwhat is happening in program. For example, you c display a progress bar with\
