    The app is written in Python and you can install it with Pip package manager using
    `sudo pip install youtube-dl`. Despite being a CLI it is very straightforward:
    just paste the link to the video and it doesn''t confuse simplicity with a paucity
    of features, because the program is very dexter. For example, use `-F` to fetch
    a list of


    available resolutions for a video and then download the version you want. Similarly,
    it allows you to download subtitles for videos, and even playlists with a single
    command. You can also download audio from a video and save it in a popular format,
    bitfolded with various pass filters. For example, if you have ffmpeg, it can convert
    and add metadata, embedded subtitles and so on. youtube-dl is also a very capable
    downloader in its own right by resuming interrupted downloads, as well as being
