    # # Back In Time


    # # Duplication


    A general backup tool that does a little bit of everything


    Easy to use backup application excels at everything it does


    ![](img/301dc180ffb6e12d0783cd1567376047_81_0.png)


    ![](img/301dc180ffb6e12d0783cd1567376047_81_1.png)


    +   - Enable snapshots on battery

