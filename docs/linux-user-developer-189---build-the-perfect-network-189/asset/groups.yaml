    # 现正在发售！


    # APPLE HOMEPOD 首次评测


    ![](img/301dc180ffb6e12d0783cd1567376047_69_0.png)


    ![](img/301dc180ffb6e12d0783cd1567376047_69_1.png)


    可在 WHSmith、myfavouritemmagazines.co.uk 购买，或直接在您设备的 App Store 中搜索“T3”


    # 今日订阅立享优惠！www.myfavouritemmagazines.co.uk/T3


    # 程序员与制作者的必备指南


    # 实用型树莓派


    ![](img/301dc180ffb6e12d0783cd1567376047_70_0.png)


    > 72 “在组装这个东西时我遇到了很多障碍”


    # 目录


    - 72 Pi 项目：创建一个复古火箭控制面板的挑战

    - 74 使用 PiServer 设置一个连接到服务器的 Pi 网络

    - 76 使用 pyLCI 和廉价的字符液晶显示屏控制你的 Pi


    # 复古火箭面板


    # Rick Perotti


    # 喜欢吗？


    Rick 是 Architecture Corporation 的演示架构师，负责物联网和聊天机器人项目。工作之余，他热爱使用树莓派和 Arduino。


    你可以在 Pinterest 上看到 Rick 的项目情绪板](https://pinterest.com/rickperotti/switches-)。更多请在
    Instagram 上关注他](https://instagram.com/rick-perotti/)。


    一个由 Pi 和 Arduino 驱动的面板，将旧式儿童用电视与科幻电影融合在一起。


    ![](img/301dc180ffb6e12d0783cd1567376047_71_0.png)


    从小起，Rick Perotti 就各种控制面板上的开关和旋钮非常着迷——仪表盘、航天器和飞机驾驶舱。成年后，他决定自己动手制作一个控制面板。他并不知道这会有多困难。除了许多事情之外，他必须学习编程，而结果是一个充满了旋钮和开关、足以满足任何孩子想象力的作品。


    这一年是一次学习经历。最大的挑战是什么？是弄清楚每一个面板。我尝试了许多不同的技术，最后决定采用……


    > 我在这个项目上工作了 14 个月


    Mechanical Mystacle Oracle – Oracle 杂志为它制作了一段视频](http://bit.ly/RickiHomunculus)。


    在经历了这个项目的漫长旅程后，会有什么不同的做法？我总共兼职做了这个项目 14 个月。提前要到，并不是一切都会按照你预期的那样运行！尽量不要在组装过程的混乱中崩溃，这种混乱曾坐在桌前试图解决问题时击败了我。我了解到我需要停止用头撞墙，换一种思考方式。离开问题一段时间后再回来，可以带给你一个全新的视角。


    对我们的读者有什么建议吗？


    是的——我第一次使用了一个带可更换烙头的变功率电烙铁。你永远无法用 商店卖的那种廉价电烙铁焊接 Arduino。你可能会熔化或损坏你正尝试处理的东西。


    这个项目的规模非常惊人。你数过在这个项目中包含了多少个旋钮、开关和按钮吗？不，我数过——当我发现所有的参考资料都在这里时，我非常开心！这里是我为项目使用的参考资料（在开始之前看过的）：《星球大战》、《帝国大击战》、《第五元素》、《杰克小子》、《羊皮（那只可怕的猴子）》、《月球》、《外星人》、《太空生活》、《Bucky
    Fanoza 的冒险》、《第八维度》、《星际引力》、《星际穿越》、《漫威特工》。


    你对你的下一个项目有什么想法，或者你想做一些比这个更复杂的东西？


    使用激光切割机和 CoreDraw，在开始项目时我并没有其他设备。这个项目迫使我买了一台激光切割机。


    我对切割机自带的免费软件并不满意，最后使用了 CoreDraw。是否有软件差距能对你有帮助？切割机通常被称为“激光切割机”或“激光机”。我使用 Fusion
    和 AI Express 在合适的位置放置名称。不过我是通过查看 YouTube 上的结尾视频做到的。但我需要一个 CoreDraw 插件，让你插入并确保你切割了它。


    我不愿意支付年度许可，CoreDraw 的费用和项目本身一样贵！我必须寻找廉价软件，以便我创建设计并生成 G-code。我选择了最便宜的路线，这样我才能项目取得进展。告诉我们你参与的活动。这是年度的
    Maker Faire，已经是第二年了。我专门为这次活动制作了这个项目。


    Rick 的项目记录在](https://www.github.com/memmer/r7097，更多信息请查看使用开源项目 project.io。


    # 完美的面板


    经过一些实验后，Rick 决定使用 3mm 的 MDF 板制作面板。他首先在 CoreDRAW 中绘制面板，并预先识别出他想要使用的旋钮和开关。每个面板有两个层：一层用于切割，另一层用于打印；他使用了覆盖着透明片的光面纸。在确保所有孔对齐后，他使用
    3M 喷雾胶粘合打印件，开孔，并使用皮具冲器制作四个角的安装孔。


    ![](img/301dc180ffb6e12d0783cd1567376047_72_0.png)


    # 旋钮，大量的旋钮


    所有零件都来自 AliExpress、Amazon 和 eBay。Rick 说，买到你需要的并不容易；你需要了解 SPDT（单刀双掷）和 DPDT（双刀双掷）开关以及瞬时与自锁的区别。自锁开关在按下时开启并关闭。灯的格式相同，对于
    12V、24V、120V 或 220V 要仔细阅读。


    ![](img/301dc180ffb6e12d0783cd1567376047_1.png)


    # CPU 控制面板


    为了给底部面板供电，Rick 使用了 Arduino 驱动四个继电器板。他添加了塑料管。为了点亮它们，他必须使用两个 12V 电源：灯是并联的，这样每个继电器都被拉动。


    # 布线


    Rick 将他的布线描述为一种“直接搞定”的方法，计划是在 Oracle 的 Maker Faire 展示整个面板。“我必须保留 12V 电源，因为灯太棒了！”


    ![](img/301dc180ffb6e12d0783cd1567376047_2.png)


    # 绘图


    Rick 使用 CO2 激光切割机并使用切割机自带的 CoreDRAW 设计了他的面板。“成功！”切割机支持 CoreDRAW 插件。“我必须编写这个程序，但我被卡住了，”Rick
    说，所以我买了它的许可。


    ![](img/301dc180ffb6e12d0783cd1567376047_3.png)


