    ## 在哪里找到你需要的内容


    - 什么是 Qubes OS？p61

    什么是 Qubes OS 以及它与其他发行版有何不同？发现你可能想要使用 Qubes。

    - Qubes OS 安装过程 p62

    Qubes OS 的安装过程比典型的发行版更复杂、涉及更多，但我们将引导你完成。


    - 核心在于域/立方体/AppVM p64

    隔离化是 Qubes OS 的核心：你的用户被划分为相互隔离的上下文中。

    - 应用安装与更新 p66

    在 Qubes OS 中安装和更新应用程序基于更新模板虚拟机（templateVMs）。


    - 在 Qubes OS 上运行 Windows p68

    某些用户需要使用 Windows OS，然而，它可以在 Qubes OS 中运行——但有一些局限性。

    - 确保你的安装安全 p68

    一些最佳实践将帮助你确保 Qubes OS 安装不会意外被破解。


    Qubes OS 被其开发者标识为“一种卓越的操作系统”，从安全的角度来看，它比标准发行版具有巨大的优势——这就是为什么我们将其记录为由吹哨者爱德华·斯斯诺登（Edward
    Snowden）誉为“当今可用的最佳操作系统”（这句话直接引用自 Qubes OS 首页，这在专家中是常态而非例外）。


    Qubes OS 模型的核心是隔离化概念。该操作系统假设，在没有 Qubes OS 的情况下，无法信任一个完美、无 bug 的设备；发行版中任何部分的 bug
    都可能导致系统被接管，如果某个环境被破解。这个免费开源项目专注于安全，在日常情况下，你将孤立的隔间作为“立方体（cubes）”。从根本上说，使用裸金属机器最简单的方法是这种，这很有意义——底层技术是裸金属虚拟机监控程序“Xen”。一种比虚拟化工具使用的
    Type 2（托管型）虚拟机监控程序更强大的监控程序，因为它们在更低的级别上进行分离。它绝不允许你访问底层的安全域概念。开箱域已为工作、个人和不可信进行了配置，但你可以创建其他域——你可能希望它们用于游戏、银行、购物和其他类似的活动。


    当你带出一个隔离的设置时，笔记本电脑移开了目光。虽然安全威胁让 Qubes OS 初步具有吸引力，但对特性的恐惧很容易让人在日常使用中放弃虚拟化提供的限制。Qubes
    OS 尝试通过等功能克服这一点，如隔离加密、立方体之间的安全复制粘贴、文件网络、硬件隔离和彩色窗口，这是 V 的首次尝试。


    ## Qubes 与物理机


    得益于裸金属虚拟机监控程序，Qubes OS 的工作就像一台机器一样，与多个设备相比，使用该操作系统在物理上非常简单。正如你预期的，主要的风险是由于内置内核
    VM 文件系统在立方体之间进行物理简单（安全）数据传输。最终，如果虚拟机系统被破解，一切都处于危险之中（尽管非常不利），而且你的技术——例如，留下一个


    Qubes OS 使用名为 TemplateVM 的模板系统来简化软件的安装和设置。基础模板基于 Fedora，但该发行版的开发者 IT 还提供了一个裸金属模板。有多种模板可用，包括
    Ubuntu 和 Debian。因为它是裸金属虚拟机监控程序，从根本上说，你看到的任何事情都是可能的。


    > 没有 Qubes OS，分区部分的某个 bug 可能会导致系统被接管


    www.linuxuser.com 61


