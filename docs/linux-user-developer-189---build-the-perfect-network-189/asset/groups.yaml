    “我会说‘这是一种纯粹主义’（嗯）；通过开源的笔记本电脑和手机来实现这种可能，因为这是必要的。我们也知道，那些正在做 Google Cubes 的人正在他们他们能触及的范围内为人们提供一个安全的互联网环境。”


    新可制造的 Serval 网状扩展器（Serval Mesh Extenders）用于连接各个社区，而不需要蜂基站。


    > “我记得我听过海地的地震，”Paul Gardner-Stephen 说。对于 Paul 这种哪里都骑自行车的人来说，这很不寻常，他那天坐出租车去上班，“我开着收音机，正听到地震正在发生的新闻。”Paul
    的工作是在阿德莱弗林德大学教授科学和工程学，但在过去的八年里，他一直在运行一套用于灾区的开源网状移动电话系统。我们当时正在通过 PixieVoIP 通话交流，但他的声音穿透了我们交谈期间连接不畅的网络，当他回忆起海地的情况时，那种感觉依然很真实。“我本能地知道，在三三天内，在没有法律秩序能够协调行动的情况下，这会导致无政府状态。海地的地震最终影响了估计
    300 万人，死亡人数多达 16 万，但随之而来的人道主义危机也困扰了 Paul 和整个世界。海地的机场受损严重，每条路都被地震摧毁了。起初，援助通过一家小型国际救援机构进入，大约需要两天时间才能到达会被港（Port-au-Prince）。感觉非常紧迫，在法律秩序恢复、人们吃饱饭之前，当在通往会被港港头路上的那个女人倒下时。在那一刻，Paul
    意识到海地人的情况将会变得非常糟糕。一点历史告诉我们发生了什么：帮派在四处游荡，发生了各种事件和各种糟糕的事情，因为情况是如此绝望且不受控，”Paul 说。Paul
    的主要反应是，这种情况在如此绝望的情况下绝不应该再次发生。作为一名基督徒，他我们


    ![](img/301dc180ffb6e12d0783cd1567376047_33_0.png)


    也强烈地认为自己应该应该利用自己的天赋来帮助他人：“我意识到在那一刻，我有背景可以制造出可以在灾区运行的电信系统。没有其他人会费心去做。这有点像《旧约》中以斯帖的故事：保罗，你来到这个位置是为了在这样的时刻吗？这真的让我思考——我们能尽所能做些什么呢？”


    Paul 最初的一些想法有点有点疯狂，包括将像变压器一样的集装箱在被掉到各地后变成地面上的手机塔。但他确实做到了，而且并没有费多少努力，现在海地的每个人都有了通信所需的硬件：“这被称为一个手机应用，你可以带着它去手机塔，那里有对天线，那些是小电脑，”Paul
    说，“它们可以做完全的功能，比如视频网络等等。”然而，电话的主流定制模型与此恰恰相反：‘让手机可以在没有基站的情况下工作’，这就是 Paul 想要的。因为正在进行的运动，任何关闭的行为都会破坏手机网络创造的力量——一个有缺陷的移动模型让
    Paul 思考他能做什么。第一部商用发布的安卓手机是，的T-Mobile G1（也称为 HTC Dream），


