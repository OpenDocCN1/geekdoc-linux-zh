  mdcn: '


    尽管 Qubes OS 的真正优势是隔离，但在某些情况下你可能需要在不同的域（domains）之间共享数据。在最基础的层，这意味着可以复制和粘贴，Qubes
    OS 是完全支持这一点的。在源应用程序中，使用适当的快捷键（例如 Ctrl+C）正常复制内容。这会告诉 Qubes 当前焦点的内容要在域间进行全局复制。你只需要进入目标域并按
    Ctrl+Shift+V 即可粘贴到该域中。请注意，系统仅支持纯文本的复制和粘贴。如果需要，可以对特定的立方（如 vault）进行配置，并通过 `/etc/qubes-rc-policy/quies/clipboard`
    进行修改。


    ## 移动文件

    除了复制和粘贴，Qubes OS 还让域之间的文件移动变得非常简单。最简单的方法是使用 GUI：只需在管理器中打开文件，选择适当的文件，通过右键菜单选择“复制到另一个
    AppVM（Copy to another AppVM）”。系统会提示你输入目标的名称。会弹出一个 dom0 的确认框（这是无法伪造的），关闭后，文件将复制到目标位置。Bound
    内部的文件将到达 `/home/user/Qubes_Incoming/`


    随着 Qubes 的演进，也可以从命令行执行文件复制。对于早期版本的 Qubes OS，请使用 `qube-to-move`。


    - 出箱的 Qubes OS 包含了 Fedora 和 Debian 的模板虚拟机（TemplateMs），还有许多基于其他 Linux 发行版的额外模板。此外也有没有官方支持的模板。


    该工具在 Qubes OS 网站上有详细的文档，但过程相当复杂，不适合胆子小的人。最流行的发行版是 Arch Linux（没有社区构建器）和 Ubuntu（使用构建模板）。需要注意的是，这些是由除你之外的第三方提供的；同时请注意，第三方模板没有经过与内置模板相同的安全测试。


    Qubes OS 是一项流行的渗透测试工具，如果你想使用它，文档详细说明了如何安装 BlackArch、Kali 和渗透测试框架 (PTF)。


    ## Qubes 的核心与 dom0 的性

    除了你的立方（cubes）和模板虚拟机（TemplateVMs），还有一个名为 dom0 的域，它是窗口管理器（Window Manager）和桌面管理器（Desktop
    Manager）运行的地方。这也是你登录系统的地方。dom0 的信任度高于任何其他域，包括模板虚拟机和黑色标签立方。如果 dom0 被攻破，整个系统都将面临破解风险。由于这种性质，dom0
    没有网络连接，且仅用于特定目的。应避免将它用于任何其他用途。特别是，你绝对不要在 dom0 中运行应用程序；所有操作都应在你的立方中完成，这正是它们的用途！


    ## 特性 Qubes

    如果你觉得构建或使用第三方 TemplateVM 的工作量太大了，Qubes 提供的另一个选项是 HVM（硬件虚拟机）域。HVM 允许从任何提供的镜像或 ISO
    创建域。这还允许在 Qubes 中安装 Windows 虚拟机。要创建一个基于 HVM 的客户端，安装时在 Qubes Manager 中选择创建新客户端的选项。对于类型，选择“Standalone
    not based on a template”（非模板的独立）。


    ## OS 包含 Fedora 和 Debian 的模板虚拟机

    由于你需要修改网络防火墙，现在你多了一个“从设备安装”的选项。这将启动一个额外的对话框，你可以在其中选择合适的安装 ISO —— 可以连接的物理磁盘或位于现有
    kube 中的文件。选择合适的源后，安装程序将打开并开始。


    ## 只要有 ISO，虚拟机就能基于任何操作系统创建域

    如果你想在 HVM 中安装 Windows，请注意一些局限性。支持的最新版本是 Windows 10 Pro，但有关于 Qubes GUI 透传的报告。目前
    Windows HVM 不支持音频。好在，可以安装 Qubes Windows Tools (QWT)，它为 Windows 用户提供了一系列功能：一个将
    Qubes 与 Windows 桌面集成的无缝 GUI；支持剪贴板和粘贴；支持 Windows 虚拟机与其他虚拟机之间的安全文件交换。另一个选项是使用 Windows
    通用驱动程序，它提供了在内部或从其他虚拟机运行系统的能力，与 QEMU 模拟设备相比性能更好。然而，对于非官方 Qubes OS（如其他 Linux 发行版），某些第三方应用可能无法正常工作。


    ## 在 Qubes OS 上安装 Anti Evil MDM (AEM)

    ### 背景

    AEM 并非 Qubes OS 的官方组件。


    ## 使用 AEM 安装

    ## 安全考量

    ## 安全考量

    ## 背景

    ## 实现考量

    ## 安全考量

    Anti Evil MDM 提供额外的保护，警告任何 BIOS 或启动分区的更改。你的更改很可能是通过物理访问电脑完成的。


    ## 确保安全

    Qubes OS 提供了许多技巧来确保你的安装是并保持安全的：这非常重要，因为这正是你最初使用 Qubes OS 的原因！在上述隔离恶意软件之后，有几个关键点需要记住：


    第一点是对安全上下文保持高度警觉。彩色的窗口边界有助于区分它们。这对于自定义服务特别有价值；如果你看到带有不同颜色边界的提示，请将其移出你的边界，以确保它没有被劫持。另一个关键是使用软件扩展方法。虽然你会经常安装到模板虚拟机中，但你永远不要在自己基于模板的
    Qubes 中启动它们。


    最后，通过运行 `sudo-apt update-dist-upgrade` 或 `sudo dnf update` 来更新模板和模板虚拟机，始终保持最新的安全更新。


    ## 快速指南：使用此兼容性运行 Qubes 的最佳硬件

    正如你预期的，由于它实际上运行了多个操作系统，Qubes OS 对硬件有一定的要求。Qubes 指南建议使用带有 VT-x 或 EPT 的 Intel CPU，或
    AMD-V, RVI, Intel 或 d-Vi（即 AMD IOMMU），4GB 内存和至少 32GB 磁盘空间。必要建议使用快速 SSD，理想情况是带有更好
    BIOS 支持的 Intel 和 TPM。Nvidia GPU 特别有问题；AMD GPU 更好，但寻找支持 Qubes 的系统的最佳地方是广泛的硬件列表，而不是官方
    Qubes OS。


    '
