    # Puppet Enterprise


    作为开源版本的替代方案，Puppet Enterprise（免费管理最多十个节点）可用于更大或更复杂的环境。我们发现，这对于在全范围内使用 Puppet 管理异构基础设施特别有用。例如，除了
    Linux 服务器外，或者我们需要接入现有的 Active Directory（活动目录）以建立适当的基于角色的身份验证范围。对于使用 Puppet 但又需要与公司流程、报告和合规需求保持一致的团队来说，企业版的内置功能非常值得关注。


    ![](img/301dc180ffb6e12d0783cd1567376047_12_0.png)


    配置管理涵盖了持续集成、持续交付、应用程序交付（ARA 应用程序发布自动化）标准和测试领域。Puppet pipeline 产生输出以实现应用程序交付自动化，并允许我们在控制服务的同时，包含持续集成、持续交付、部署通知、安全——这些能够很好地与
    Puppet 无缝集成，而 Puppet 一直以来为运营团队提供顶级的自动化工具。


    客户，还有多云和混合云基础设施，其中一些留在本地，另一些则转向云端。我们看到传统工具与现代工具的并存，并且在 Kubernetes 等特定平台上有大量采用。


    当我们审视市场，观察客户如何部署员工以及他们如何在整个生命周期中管理软件时，我们的合作伙伴继续确保我们在各种客户用例中交付成果——既有广度也有深度，不仅针对开发（Dev），也针对运营（Ops）。


    我们不仅是在前进和赋能开发团队，还有运营团队。这为客户创造了巨大的价值。


    如果你有很多不同的部署类型，Distelli 可能会很有意义。处理所有这些多样性并需要某种能实现可视化的帮助。


    所以你看到你的客户从配置增长到了开发阶段？


    RS: 是的，我们作为一家多产品、多组合的公司正在扩大我们的能力。


    你觉得市场将向何处发展？我们看到混合系统正变得流行，但我很好奇听你认为在开发方面它们将向何方发展。


    RS: 确实，从旧的基础现实云状态，到将它们迁移到云端，发生了真正的转变。我们确实看到客户正在根据用户的需求使用各种方法。我们并不认为“一刀切”是典型的。我们确实看到云是我们战略中重要组成部分……


    你能给我们概述一下 Puppet 的产品方案吗？


    RS: 有三个主要产品。有 Pipelines，它是一个持续集成、持续交付 ARA（应用程序发布自动化）产品，专门为将传统应用程序部署到虚拟机或 VM 而开发，无论……


    > “我们现在正在前进并赋能开发团队，以及运营团队”


    # 开源：你的新闻与观点来源


    用于直播的 VM：本地或云端、多云、公有云、私有云或混合云；无论你是否托管来自 Github、Bitbucket、Mercurial 或 Git 仓库的软件并与所有这些集成。


    我们还在流水线空间还有另一个产品，即 Pipeline for Containers（容器流水）。它为跨多个 Kubernetes 集群构建和部署的容器提供了类似但更强大的工具。同样，我们针对本地、公有云、私有云、混合云的
    Kubernetes 客户，继续帮助他们使用其他开发团队和开发人员使用的所有工具。


    我们提供的第三个产品是 Container Registry（容器注册表），它允许企业在本地构建和运行容器，也可以开始将这些镜像推送到第三方注册表，无论使用何种云。真正赋予客户的是选择的自由和不受……的自由，并允许他们在任何云中无缝使用已构建的容器镜像。


    我想得对吗，注册表是一个开源项目吗？


    RS: Puppet Registry 有几个不同的版本。Puppet Registry 是基于开源项目的，但也有商业版本以供企业使用。


    除了 Puppet Enterprise，还有其他哪些产品是基于开源项目的吗？


    RS：Pipelines 和 Pipeline for Containers 是商业产品。Puppet Registry 是唯一一个开源版本。其他产品都是由
    Disteli 构建的，现在由于 Disteli 的收购，Puppet Registry 的模型与 Puppet Enterprise 类似。


    社区对开源版本的兴趣是否很大？


    RS: 是的，当客户谈到这个领域时，他们正在寻找深度集成、各种连接方案。他们还想要不同的部署模型。所以 Pipeline for Containers 是免费提供的，但对于企业版，可以在本地运行。我们发现了很大兴趣，Puppet
    在这个空间：


    # Puppet 快速指南


    Puppet 旨在简化交付并提供自动化。


    ![](img/301dc180ffb6e12d0783cd1567376047_13_0.png)


    Puppet 正在迅速扩张，在新加坡和西雅图开设了办公室，并随着 Disteli 的收购涵盖了软件生命周期的各个方面。Puppet 提供持续集成和持续交付技术，使公司能够获得整个环境的清晰视图。Pipeline
    for Containers 允许客户从源仓库构建镜像并将其部署到 Kubernetes 集群。Puppet Registry 是开源项目，方便开发团队管理存储在本地和远程仓库中的镜像。Bolt
    被设计用于在部署时跨基础设施运行配置管理，这涵盖了传统和云。


    随着我们今年的愿景和路线图，现在假设一切运行得顺畅，未来的计划是什么？


    RS: 正确，我们正在持续集成。但我想传递给客户的消息是，创新没有停止。我们将继续创新，并在这些产品中添加功能集，因为客户正期待着这种速度。


    > 未来六个月从市场进入的角度来看将是关键


    Puppet 的情况改变了你的任何方法吗？它让你有不同的想法吗？


    RS: 我们 一直信信的是通过自动化来实现。


    MC: 从市场进入的角度来看，未来六个月对于 Puppet 来说将是转折性的，包括公司的演进以及与客户接触。Puppet 带来的产品满足了客户的需求。


    事实上，我们刚刚在欧洲这里举行了技术咨询会议，他们说全球客户对此非常渴望。我们在欧洲以及亚太等主要地区都运行了技术咨询会议，他们在范围内非常一致。你听到的是什么？通常，复杂性——管理复杂性——似乎是一个持续存在的问题。我们关注微软的开放性，最近看到它在
    [Azure] 云平台上提供更好产品的效果如此。


    MC: 实际上你来自 Amazon，可以分享一下那里的经验吗？


    RS: 是的。正如我之前提到的，在创立自己的公司之前，我在 Amazon 工作了近九年。我把所有时间都花在了 AWS 上。事实上，我是 AWS 团队的第四批员工。所以我们共同成长，这种增长很重要。


    我想我学到了这些，客户也在讨论这一点：面对所有这些复杂性时，我们如何移动得更快？我的意思是，曾有一段时间只是机架搭建，但然后是虚拟化，我们进入云技术，现在我们谈论的是多云和服务器开发。行业的变化率呈指数级增长。我离开
    Amazon 后学到的是，自动化（至少在应用程序交付方面）现在必须跟上。这是我开始时的任务之一——构建自动化，具有 Puppet 在配置和配置管理领域所拥有的相同规模和复杂性的应用程序交付服务，这是他们在配置管理领域使用的内容的一部分。这与客户产生了很好的共鸣。我们现在已经取得了成功。


