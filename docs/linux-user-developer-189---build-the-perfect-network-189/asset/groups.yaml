    in the system /etc/passwd file. If the user is only to have access to the Samba
    server, you can create the user without a home directory and then prevent other
    logins:


    ```

    sudo useradd -m username

    sudo usermod -L username

    ```


    Then use sambap to create their login. However, if you want them to be able to
    log in via SSH, and to have a normal user who doesn''t need password at all, add
    a line to /etc/samba/smb.conf:


    ```

    linux = samba

    ```


