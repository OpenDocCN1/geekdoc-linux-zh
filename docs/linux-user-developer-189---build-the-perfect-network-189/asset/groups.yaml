    意识到海地人的情况将会变得非常糟糕。一点历史告诉我们发生了什么：帮派在四处游荡，发生了各种事件和各种糟糕的事情，因为情况是如此绝望且不受控，”Paul 说。Paul
    的主要反应是，这种情况在如此绝望的情况下绝不应该再次发生。作为一名基督徒，他我们


