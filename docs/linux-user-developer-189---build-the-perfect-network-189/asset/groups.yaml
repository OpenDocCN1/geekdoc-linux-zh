    开始 Qubes OS 的安装与其他 Linux 发行版非常相似。安装包可以从 www.qubes-os.org 下载或直接从 mirrors.kernel.org
    下载。对于这种性质的发行版，验证真实性和完整性至关重要，对于每个下载都有一个签名、数字和 PGP 密钥。毕竟，如果操作系统在传输途中被破解，那么安装一个安全的操作系统也就没有意义！


    安装后，系统将提示你选择语言并设置键盘布局。请确保在此时选对正确的设置，因为该布局将用于输入初始磁盘加密密码，且键盘设置在随后的启动过程中无法更改。默认安装带有
    Fedora 的操作系统、可选的 Debian 模板（也包含 Fedora 26）以及可选的 Wh 网关和工作站模板。


    Qubes OS 至少需要 25GB 空间；18GB 用于软件本身，7.22GB 用于交换分区（swap）。交换可以通过手动或自动方式进行，如：


    ![](img/301dc180ffb6e12d0783cd1567376047_61_0.png)


