    boards tucked away on


    your network can act as a gateway, but it also runs on Ubuntu and Debian distributions.
    To set up an OpenVPN server using PIPVPN; run:


    ```

    $ curl -l https://pipvpn.io

    ```


    This will download the script and run it. It will ask you for some options, generate
    keys for the server, install and configure. You will need to set up client to
    be able to connect, and PIPVPN does this for you too:


