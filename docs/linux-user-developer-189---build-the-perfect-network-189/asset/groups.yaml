    As an alternative to the open source version, Puppet Enterprise (which is free
    for managing up to ten nodes) can be used for larger or more complex environments.
    We''ve found this especially useful for managing heterogeneous infrastructure
    using Puppet across the board. As well as Linux servers, for example, or we have
    a need to hook into an existing Active Directory to establish proper role-based
    authentication scopes. For teams that use Puppet but also need to align themselves
    with corporate processes, reporting and compliance needs, the built-in functions
    of the enterprise version are well worth looking.


    ![](img/301dc180ffb6e12d0783cd1567376047_12_0.png)


    configuration management and also into the areas of continuous integration, continuous
    delivery, applications delivery (ARA Application Release Automation) standards
    and testing. Puppet pipeline produces outputs to automate the application delivery,
    and allow us to control services while including continuous integration, continuous
    delivery, deployment notifications, security—which is well able to be seamlessly
    integrated with Puppet, which has always provided best-of-breed automation for
    operations teams.


    customers, also multi-cloud and hybrid-cloud infrastructure with some remaining
    on-premises and others going into the cloud. We''re seeing a mix of legacy and
    modern tooling, and a lot of uptake on some specific platforms as Kubernetes.


    As we look at the market and see where our customers are deploying their staff
