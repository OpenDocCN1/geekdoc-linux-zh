    we want a Make-only solution, particularly since we want to define the value of
    our variable inside the makefile, or use special features such as $(path. Luckily,
    Make allows us to export a variable to the entire environment variable by using
    the export keyword:


    ```

    $ export TARGET_DIR=$target

    ```


    When we write, we ensure that the variable IMAGE_DIR will be accessible to all
    invocations of Make. We can use the export and unexport to change the scope of
    any Make variable.


