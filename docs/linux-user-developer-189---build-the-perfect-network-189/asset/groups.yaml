    说，“它们可以做完全的功能，比如视频网络等等。”然而，电话的主倒性定制模型与此恰恰相反：‘让手机可以在没有基站的情况下工作’，这就是 Paul 想要的。因为正在进行的运动，任何关闭的行为都会破坏手机网络创造的力量——一个有缺陷的移动模型让
