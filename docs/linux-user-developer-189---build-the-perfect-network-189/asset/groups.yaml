    ## File and media servers


    Allow others on your network, and elsewhere, to access files and media from your
    servers


    Once you start multiple devices on your network you run into a particular problem:
    how to access a file on a different device. There are two positions. One is to
    use a synchronization protocol like Synthing, which makes important directories
    are copied to all devices that they need. This works for a small number of devices,
    but becomes cumbersome. The other option is to use a file server serving from
    one device but accessible from all of them. You can implement a file server using
    various technologies.


    Examples are NFS, Samba or even FTP, the file is covered by the likes of AirSonic
    (audio files) or Plex (video files). The alternative is to use a dedicated file
    server, a NAS (Network Attached Storage), running a specialist like FreeNAS. This
    is easy to set up and manage but handles the separate computer.


    Samba is an implementation of the Microsoft CIFS protocol (usually called SMB,
    hence the name Samba) and is more widely supported than NFS, so we''ll concentrate
    on that. Install Samba from your distro''s repositories in the usual way and set
    it up by the


    ![](img/301dc180ffb6e12d0783cd1567376047_23_0.png)


    main configuration file at http://samba/smb.conf. The file uses INI format, where
    name in square brackets followed by one or more lines setting parameters, and
    at the end of the section. The first part is called [global] and, not surprisingly,
    contains global settings for the server. At a minimum it will:


    ```

    [global]

    workgroup = MYGROUP

