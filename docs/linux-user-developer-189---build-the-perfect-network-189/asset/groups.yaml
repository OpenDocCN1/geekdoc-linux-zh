    An alternative of making files available is to run your own cloud server, using
    something like Nextcloud. Nextcloud gives you a similar experience to Dropbox
    or one of the other cloud-storage services, but under your own control. Not only
    do you keep all of your data but it is also served at speed for local users. This
    may be a suitable solution for less technical users, it is more work for you to
    set up.


    These parameters are all pretty self-explanatory. To mount this share, you will
    need to use a username and password. It is possible to set up anonymous logins
    on Samba, but not wise, if you are writing applications. Samba users can be created
    with the:


    ```

    [Music]

    comment = Music folder

    path = /mnt/music

    read only = no

    ```


