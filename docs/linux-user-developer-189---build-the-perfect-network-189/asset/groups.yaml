    # Contents

    ![](img/301dc180ffb6e12d0783cd1567376047_3_0.png)


    # OpenSource Features

    # Tutorials

    - 06 News: Wayland goes and updated

    - 18 Build the Perfect Network: Are your systems and file management getting out
    of hand? It might be time to create your own network. Neil Bothwick looks at how
    to set up an advanced home or small business network, determining its best topology
    and setting up basic services, maintaining privacy without compromising on security.

    - 38 Essential Linux: GNU Make: How best to deal with multiple directories

    - 40 Letters: Tell us what you really think

    - 42 Security: Configuring Puppet plans to manage DevOps simpler

    - 46 Server hardening: Lock down your Linux server with attention to this guide
    - Jon Masters reveals what will be in it.

    - 60 Qubes OS From Scratch: Qubes OS is touted by its developers as "a reasonably
    secure operating system" but in reality offers huge benefits over standard distributions
    from security perspective - provided you''re willing to put in a little bit of
    effort. Discover how to install, configure and use this hyper-secure OS to keep
    your data safe.

    - 50 Python: parallel programming: Meet the tool that can take a look out of pain

    - 54 R: statistical programming: Learn how to analyse data and perform simulations
    using this matrix-based language

    - 34 The Serval Project: Founder Paul Gardner-Stanley on saving lives with mesh


    - 72 Pi Project: Rick Perotti always wanted his own rocket ship Pi. As an adult,
    he spent 14 months building around the Pi - and here explains exactly how he did
    it with the help of a laser cutter

    - 76 Control your Pi with pyCLI: LCI is a simple hardware device you can use with
    a character display and buttons to control your Pi''s basic functions - and monitor
    its uptime and CPU at a glance.

    - 74 Create a Piserver network: The Foundation''s latest tool is a godsend for
    anyone who wants to create their own Pi. Discover how to use it with guide

    - 81 Group test: backup tools: Backing up can be a drudge, but these tools promise
    to make the process simpler. Which of them does it best?

    - 88 FRITZBox 7590: A do-it-all with a wacky name and even wacky design, but can
    it justify it?

    - 88 Arch Rolling 2018.01: Another day, another Arch-based KDE distribution -
    except this one has few tweaks to offer

    - 90 Fresh Foss: We take a look at QuZilla 2.2.5, a web browser, the ExifTool
    10.77 modifier, youtube-dl for downloading video/audio

    - 96 Top open source projects: What projects are ticking developers'' fancies
    this month?


    # Practical Pi

    # Reviews

    # Back page


    # LinuxUser & Developer

