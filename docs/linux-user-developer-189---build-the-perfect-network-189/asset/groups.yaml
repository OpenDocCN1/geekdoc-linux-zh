    ## 05 Create user accounts


    You must create at least one user account that people using the Pi can log in.
    Remember that this account is created on the server and will use the files there.
    This means, for example, create a user ''Alice'' with the password password123;
    she can log in using these credentials on the Pi connected to your server and
    use the same files. You can create another user account setup if you want. Fill
    in the files, then click ''Next'' to continue.


    ![](img/301dc180ffb6e12d0783cd1567376047_74_0.png)


    ## 06 Install the operating system


    Use the screen to choose which OS to install. If the method of writing only Raspberry
    Pi OS Lite is available, the Raspberry Team recommends it for future. Pi also
    supports installing an OS local files on a USB, although it''s not clear if other
    Pi compatible systems currently work with it. If you''re having trouble, go to
    /var/lib/piimage to see how the operating system images are created. Click ''Next''
    for the software to install before clicking ''Next''


    ## 09 Install software


    If users don''t have privileges, they can''t update the system or install new
    programs. Click the software tab in PiServer to remove this. Here you can choose
    to remove or add another OS. Alternatively click ''Next'' to be taken to the root
    user you can perform operations such as downloading new programs. Use the system
    to run apt-get update and apt-get upgrade to ensure all users have the most recent
    version of Raspberry Pi.


    ![](img/301dc180ffb6e12d0783cd1567376047_74_1.png)


    ## 10 Change DHCP server settings


    In most cases your server is connected to a router and you want it to act as a
    proxy server. In other words, if your server has own IP addresses to devices on
    the network, your device server is in any way communicating with the Raspberry
    Pi, you can select ''Static'' as a Static DHCP server if you want. Check that
    the desired range of IPs, netmask and gateway addresses are correct and click
    Save.


    ![](img/301dc180ffb6e12d0783cd1567376047_74_2.png)


    ## 07 Start your Pi


    Once installation is complete, connect your Pi and make sure that the network,
    mouse, keyboard and camera work as each one. Remember that the keyboard must have
    the same layout as the one connected to your server. Users will need to log in
    using the credentials you created. You can use preinstalled software, change the
    background, and much more. If remote access is disabled, however, they cannot
    make system-changes without installing software.


    ## 08 Edit users and accounts


    The PiServer tool allows you to add new users to Raspberry Pi as needed. To edit
    user accounts, click the Users tab on the left and click Add or Remove. The server
    admin can also reset the password for users from here. The Clients tab to add
    more Pi to your network, the guide here is the same as in Step 4. Use the Edit
