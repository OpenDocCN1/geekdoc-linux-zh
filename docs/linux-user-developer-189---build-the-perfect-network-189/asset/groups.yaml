    在 Paul 列出的名单之后，现在有几对村民彼此建立了几个网格节点：“我们想在这些相距 9 公里的村庄之间建立连接，这样我们就能看到人们日常生活中如何使用这项技术，或者在发生这样的灾害时，我们知道如何使用它。”


    Serval 正在与网络和其他方合作创建网格到短信的网关，以便我们将通信扩展到手机基塔范围之外。“在瓦努阿图，岛屿之间的距离长达 100 公里，但我们可以使用开源技术桥接这一切，这正是我所尝试管理的。如果我们做到了，我们将服务社区并拯救生命，而且这是……”


    Serval 不仅仅为村民部署网络后拍拍走人；对于 Paul 来说，梦想是让那些部署它的人。“使用开源软件的非常好的点之一是，它让人们能够以权限的方式寻求他们所需的帮助。他们不需要请求其他人解决他们的问题。我们正试图在通信方面补充这一点，如果一个村庄连接到外部世界或其他村庄，他们应该能够自己解决。”


    “我们正在向整个社区发送消息，我们正在开发的软件已经在那里了——我们发布了 alpha 版本，它是 Serval Mesh 应用的后续版本，它包含了我们称为
    MeshW 的短信功能，以及我们称为 MeshMB 的推特微博功能。我们一直在尝试当几天后信息返回时如何处理这些情况，以及人们反馈我们需要更多。”


    “知道我们为人们创造了价值，以至于他们实际上在关注我们，这真的非常令人满意。他们知道这本身是有成本的，遗憾的是我们无法免费提供，但由于周围对通信这种需求，这就是世界，这是一种深层次的人类需求。能够为人们尝试解决这些问题，是巨大的快乐、动力和一种荣幸。”


