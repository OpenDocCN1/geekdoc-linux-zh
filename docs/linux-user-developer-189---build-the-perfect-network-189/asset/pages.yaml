    you log to the system. dom0 is more trusted than any other domain, including TemplateMs
    and black-labelled cubes. If dom0 were ever to be compromised,


    the entire system would be compromised. Due to the nature of this, dom0 has no
    connectivity and is only used for specific purposes. All is to avoid it for anything
    else. In particular, you should never use applications in dom0; do absolutely
    everything in your cubes, that''s what they are for!


