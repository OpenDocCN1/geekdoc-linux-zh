  md: '# VIDEO DOWNLOADER


    # youtube-dl 2018.01.27


    # A command-line tool to grab online videos


    There''s no dearth of graphical tools that can download content from video sharing
    websites. What sets youtube-dl apart from the rest is that it can fetch videos
    from dozens of video sharing services including YouTube, Vimeo, Khan Academy,
    TED, PBS, BBC Archive and more.


    The app is written in Python and you can install it with Pip package manager using
    `sudo pip install youtube-dl`. Despite being a CLI it is very straightforward:
    just paste the link to the video and it doesn''t confuse simplicity with a paucity
    of features, because the program is very dexter. For example, use `-F` to fetch
    a list of


    available resolutions for a video and then download the version you want. Similarly,
    it allows you to download subtitles for videos, and even playlists with a single
    command. You can also download audio from a video and save it in a popular format,
    bitfolded with various pass filters. For example, if you have ffmpeg, it can convert
    and add metadata, embedded subtitles and so on. youtube-dl is also a very capable
    downloader in its own right by resuming interrupted downloads, as well as being
    able to limit download rates. You can forget about downloading from commercial
    sites like Netflix, as youtube-dl won''t touching DRM-protected


    +   Pros

    Forward to use and Chock-full of features and a wide range of video-sharing websites.


    +   Cons

    Limited in what you can download and need to read through its main page before
    you can use


    +   Great for...

    Automatically downloading a bunch of videos.

    http://github.com/youtube-dl


    # MUSIC PLAYER


    # BallroomDJ 3.18.4


    Out non-stop music all the evening


    If you''re planning an event and want to stream music without any interruption,
    you can delegate the task to BallroomDJ! This graphical app is designed for all
    ballroom events and dates that require unrestricted music playback. The app allows
    you to organize your music library. It includes features such as automatic playlist
    generator and flexible controls, while other features include the ability to define
    maximum playback time and create a custom playlist. You also have the option to
    set the start and end and adjust your playback speed and pitch without modifying
    the audio file. The app will play music without any intervention, it does easy
    to interact with the play queue by adding and removing tracks. To install the
    app simply download and extract the tarball. Run the command line with ./INSTALL
    and follow the prompts to specify an installation directory, and download any
    additional components if required. The app relies on a variety of source apps
    such as the VLC media player and the PulseAudio sound server.


    ![](img/301dc180ffb6e12d0783cd1567376047_90_0.png)


    Before you start using BallroomDJ you''ll need to spend some time mastering the
    app''s Tcl/based user interface


    +   Pros

    An app with features and functions to enable uninterrupted music playback.


    +   Cons

    A cumbersome and esoteric user interface that takes some getting used to.


    +   Great for...

    Dissing out a stream of music throughout an event.

