    # ## 3 Test your configuration

    Configuration is important for any program, but maybe you want to abuse it. In
    squid you have an option to test the configuration before it goes live. Run `squid
    -k parse` - to see the configuration alone.


    # ## 4 Start/restart the proxy server

    Some distro start automatically when you install them, which isn''t always a good
    idea. After the settings, restart the server with `systemctl restart squid`. This
    takes a while. Then use your browser to use your server address and port 3128.


