    # # SOFTWARE


    # # Wine updated with support for Direct3D 10/11


    Windows compatibility layer also adds Android graphics drivers


    The Wine team has announced the release of Wine 3.0, the favoured option for running
    Windows apps and games on Linux, which brings with it a long-awaited improvement
    in graphics performance. With Direct3D 10 and 11 support, the team adds graphics
    drivers, and support for more shaders.


    All of this means you can expect improvements in the performance of Wine software
    on Linux, as well as wider selection of apps and games. Wider support for more
    games is another benefit, that will certainly attract anyone hoping to use Wine.
    For free, however improved support might encourage you if you want to use CrossOver
    to adapt and polish games.


    # ### This month


    Not liking of some other additions, the Wine team clarified that "because of the
    annual release schedule, some features are being and have been deferred to the
    next development cycle. This includes Direct3D 12 and Vulkan, and support to enable
    Direct3D on Android."


    As important as the release of Wine 3.0 is for gamers, it''s also quite a big
    deal for developers. The inclusion of the Android graphics drivers has been made
    available via winehq.org. For ARM and Intel-based Android devices, Wine 3.0 can
    be easily installed and used. However, the possibility of running legacy Windows
    software on x86/x64 devices on Android is fascinating.


    Most significant for PC users, particularly gamers, is the Direct3D 10 and 11
    support, with tessellation shaders, depth bias, multithreaded shaders, for more
    graphics cards, and improvements to OpenGL. There are also improvements to HiDP
    scaling and memory management.


    # ### Highlights


    +   • development (5)

    • Stable releases (2)

    The users support the latest, although it''s worth noting that ArchLinux has dropped
    to 12 places while Manjaro remains at 1.


    ArchLinux

    One of the well-known to the Debian family, ArchLinux has its own package manager
    and is available for x86, ARM and AMD devices.


    Manjaro

    jaro is a more powerful distribution with automatic hardware detection, multiple
    kernel support and configuration.


    Archman GNU

    Based on Arch, this version eschechew pacman in favor with the intention of making
    software installation easier. It''s lightweight, too.


