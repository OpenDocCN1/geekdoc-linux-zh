    # Learn statistical programming with R


    Master the basics using the R programming language to analyse data and perform
    simulations


    ![](img/301dc180ffb6e12d0783cd1567376047_53_0.png)


    John Gowers


    John is a university tutor in Programming and Science. He helps to learn Linux
    on everyone who can get his hands on. He has used it in academic research and
    in public-sector industry.


    # Resources


    +   * See your package manager downloaded at www-project.org


    +   * Optional: use your package manager or download from www.studio.com


    > In 1993, R has evolved to become one of the most used programming languages
    in the world and it is the most popular language for statistics.


    R is invaluable for analysing and solving real-world statistical problems


    # Get started


    The first step to working with R is to open the REPL (read-evaluate-print loop)
    that we use for real-time interaction. If you have the RStudio IDE, it will open
    up for you, otherwise you can type


    ```

    $ R

    ```


    at the command line to access a more limited version. We''ll start with a classic
    case of Simpson''s paradox. The particular example we will use is, and centered
    around two treatments for kidney disease.


    We can''t hope to cover everything R has to offer in this article but we''ll give
    you an idea of the language and the different operations it supports. We''ll be
    covering a set of case studies based on clinical statistics, Simpson''s paradox
    and the Monty Hill Problem, which will help you to understand some of the paradigms
    that R supports.


    R is a matrix-based language like MATLAB or S, and is designed using a functional-style
    approach. The result is a powerful statistical analysis.


    The first stone is located in the upper kidney, which involves the patient''s
    flank, followed by an incision into the kidney. The second stone is treated percutaneous
    nephrolithotomy (PN), which involves a much smaller incision through the skin
    into the kidney, allowing the stone to be removed that way. If the stone is large,
    it may be broken using ultrasound probes.


    Once you''ve got the basics of R, there are numerous online resources you can
    search out to help you with your own specific statistical problems.


    We are going to use the dataset kidneystones.csv, which is based on real data
    from a paper'
