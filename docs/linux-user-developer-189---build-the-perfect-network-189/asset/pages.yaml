    \ create a new script kidney.R, and copy the definitions of the functions print.success-rate\
    \ and group into it. You can also add any other function definitions that you\
    \ might find helpful. The best way to print out the definition of a function is\
    \ by typing its name in the REPL.\n\nWe can now save this into our script, making\
    \ sure to call print.success later. In order to load it into R, we use the source\
    \ function. So you use\n\nFigure 7\n\n```\nmonty.hall <- function(pick.final.door)\
    \ (\n  doors <- set.up.doors()\n  # Pick door 1 to start with.\n  first_door <-\
    \ doors[1]\n  open_door <- get.door(doors, first_door)\n  final_door <-\n    pick.final.door(doors,\
    \ first_door, open_door)\n  return(final_door)\n)\n```\n\nThe function that runs\
    \ the simulation. R treats any line starting with a # as a comment\n\nthe other\
    \ door. He asks you to choose a door, and when you do, he opens one of the other\
    \ two, revealing a goat. He then offers you a choice: either keep your original\
    \ door, or switch to the third door which is still closed and that one you did\
    \ not choose. The question is, should you stay with your first choice, or switch\
    \ to the other?\n\nThis can be solved mathematically, but intuitively, it seems\
    \ as though it would make no difference which of the two doors you chose. Let's\
    \ write an R script to experiment with.\n\nCreate a new function monty-hall. To\
    \ run the function we are about to write, we will start with a choice of the three\
    \ doors in the first\n\nIn R session, we have access to all functions from the\
