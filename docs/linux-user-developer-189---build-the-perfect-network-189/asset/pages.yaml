  md: "# ## What about loops?\n\nR supports loops of the form for (x in ...) where\
    \ v is a vector and x iterates over its elements. From a performance point of\
    \ view, it is very easy to avoid loops, such as apply and lapply(), which can\
    \ be used to apply a function to every element of a matrix or returning a new\
    \ vector/list of results. For more complex operations, we might need to use loops\
    \ instead.\n\nOf-course, all these are implemented in C and written in R with\
    \ very little overhead. By contrast, when we run an R loop, R runs all its error-checking\
    \ and other overhead – which is why it makes sense to use vector operations whenever\
    \ possible.\n\nBy putting in the effort as early as possible to learn how to do\
    \ things in a way so that you can reap the performance benefits.\n\nan argument,\
    \ which will use it to pick the final door at the end. R has a very functional\
    \ style, based on that of Scheme, and it is very easy to pass functions as arguments\
    \ to other functions.\n\nAfter setting up the doors, the functions choose the\
    \ final door to start with. There is no loss of generality in this done, since\
    \ the doors have been randomly shuffled afterwards. Then it calls get_coat, door\
    \ function to pick one of the doors. Lastly, it calls pick_final_door() in order\
    \ to choose which door to end up with, and returns whatever is desired.\n\n# ##\
    \ Performing trials\n\nThe last piece of the puzzle is the functions we'll use\
    \ for the final door. These are shown in Figure 8. The first one is the door we\
    \ started with. For the second one, we use vector index to choose the only door\
    \ that is not the one we chose at the start and for the third one the door we\
    \ opened. We can then out each of the different strategies in turn.\n\n```\n```r\n\
    stick.first.door <- \n  function(doors, first_door, open_door) {\n    return(first_door)\n\
    \  }\n\nwitch.door <- \n  function(doors, first_door, open_door) {\n    return((doors\
    \ != first_door) & \n      (doors == open_door))\n  }\n```\n```\n\nFigure 8\n\n\
    Left are the functions that we will use in the main simulation. R uses for its\
    \ logical conjunction operator\n\n+   - mont.hall(stick.with.door)\n- \"[car\"\
    \n- mont.hall(switch.door)\n- \"[gate]\"\n\nYou may wonder why about these, since\
    \ the initial choice of the doors is chosen randomly. In order to see which strategy\
