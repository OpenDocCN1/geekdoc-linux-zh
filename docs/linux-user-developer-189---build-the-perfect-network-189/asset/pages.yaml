    there is a problem with this approach. To see why, we need to remember that adding
    a rule as a prerequisite to rule B does two separate things:


    +   1. It makes sure the target for rule A has been built before running the rule
    for B

    2. If the file requires rule A is out of date, it will rebuild it before running
    the recipe for B


    In the case of that rule, however, we are only interested in number 1. We want
    to move any files into that directory, every time the rule runs but we don''t
    want to rebuild it every time the directory''s time changes every time we modify
    one file in the directory; so if we just modified one file inside target, Makefile
    would move every file inside target.


    Luckily, Makefile provides a mechanism for making a prerequisite that is only
    fulfilled once. This is called an order-only prerequisite, which only affects
    the order in which targets are built, and does not rebuild the target if it is
    out of date. To show how to use an order-only prerequisite, put it on the right-hand
    side of a pipe like this:


    ```

    $TARGET_DIR/player : player.ov2d.raw

    $$(CC) -o $$

    ```


    We can have many normal prerequisites and order-only prerequisites for a rule.
    The syntax for specifying them is that all the normal prerequisites go on the
    left side of the pipe and the order-only prerequisites go on the right side. For
    example:


    ```

    $rule_name : prerequisites | order-only

    ```


    normal and order-only prerequisites, while only order-only prerequisites are rebuilt.
    If a rule has only a normal prerequisite, we can omit the pipe character (as we
    have been doing in this series of tasks up until now).


