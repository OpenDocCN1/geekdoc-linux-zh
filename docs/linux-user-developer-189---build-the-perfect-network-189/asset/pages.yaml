  md: '# Tutorial


    # pyLCI


    # Control your Pi with pyLCI


    # Stop using all those weird console commands – this is an easier way to control
    your Pi


    pyLCI is a simple hardware interface you can use on your Pi to control and configure
    without the usual requirement of having an HDMI monitor, Ethernet or connecting
    to a USB dongle. It makes easy to quickly configure the most important settings,
    such as connecting the Pi to a wired or wireless network and getting its IP address.
    This pyLCI is wireless – you can use it comfortably outdoors, or even working
    with your Pi on a long bus ride! All you need is a simple shield with a character
    display (I2C), and for instant shields which you can get them as cheap as £5,
    pyLCI stands for ''Python-based Linux Control Interface'' and eliminates the need
    to remember commands or spend time connecting even people who are not technically
    literate can use it. In general, it saves you a lot of time when setting up projects.
    It does not replace the command-line completely; it helps you get through the
    hassle of needing to know the IP address which could otherwise waste a lot of
    your time, and it allows you to make your Pi projects considerably more user-friendly.


    # Where pyLCI is useful


    There are places where pyLCI can be particularly useful – in educational works,
    for example. When you have multiple on a desk and students have to SSH you might
    need the IP address of ''The Pi to the left of that guy''; with pyLCI, it takes
    five seconds.

    newise, it helps on hackathons, if at the beginning, you have to spend time searching
    for a HDMI-capable monitor, you will have no time to actually work on your idea.
    With pyLCI, you can focus on what''s important, and you can make every project
    easier by writing a simple pyLCI plugin for monitoring your software.


    Also, it helps you to transport your project safely. Say you''re bringing your
    project to work and show it to your co-workers – there''s a chance the more parts
    are involved in your project, the bigger it''ll stop working once you''ve transported
    it, and the internet connection, a loose wire, a hard-coded IP address or just
    a command to run on startup, you can easily connect to your Pi and figure out
    what the problem is.


    One more project with which pyLCI is helpful is Pi-based home servers. You are
    running with Pi-hole,


