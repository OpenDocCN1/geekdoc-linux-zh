    # Capabilities


    You can monitor the CPU and load from pyLCI; go to System & Uptime. Likewise for
    monitoring your Raspberry projects, you can glance at the display and see if your
    Pi is running or hasn''t rebooted when you don''t expect it. It is easy to see
    if you are and doing something on a Pi, or streaming video from it - you can check
    the CPU load and if the process you''ve running has finished, which is very useful
