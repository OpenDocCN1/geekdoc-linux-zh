    The 4.16 includes a number of interesting features that were present in Linus''s
    tree during the development cycle. These include support for the ''Jailhouse''
    on x86 systems, Memory Protection Keys on PowerPC, and of course more security
    fixes for the Meltdown and Spectre vulnerabilities.


    Memory Protection Keys enables applications to limit their access to certain regions
    of their address space. While there are many ways to do this, we want to do it
    with more security. By using interfaces, such as the kernel API, an application
    can explicitly restrict its own access to, for example, memory containing crypto
    keys, except for those times when it needs to access them. If an exploit is later
    found in the application, it may trick it into leaking the crypto key through
    an unassisted access which will trigger a fault.


    The Jailhouse is known as a ''static partitioning'' hypervisor it''s not intended
    to build a cloud-computing service or to run generic operating system, such as
    Windows guest VMs. Instead, jailhouse is intended to explicitly isolate hardware
    resources without hiding its existence from the


    applications running on the machine. Typically, Jailhouse is used in areas such
    as autonomous vehicles, where lightweight for real-time requirements is important.


    Peter Misdek is working on upstream patches previously created by Jason Baron
    for atomic kernel updates (kpatch) is a mechanism through which a running kernel
    can be updated without rebooting by applying already prepared binary patches.
    Until now, these live patches could be removed only in one patch which would necessitate
    removing and reapplying other numbers.


    Taras Kondrutik is working on adding attributes to the eBPF format used for kernel
    images. This would allow SELinux to be loaded on files without an initial image.
    By adding attributes to the image, SELinux could also address security issues,
