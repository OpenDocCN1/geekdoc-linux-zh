  md: '# OpenSource Your source of Linux news & views


    # INTERVIEW PUPPET


    # Puppet: the complexity fixer


    The renowned configuration management been explains its plans to automate everything
    from commits to software deployments and beyond


    Luke Kanies founded Puppet in 2005, the project, along with the likes of Chef
    took quickly IT automation mainstream. Puppet''s Kanies became a synonym that
    he and his colleagues feared would be dealing with repetitive tasks with the potential
    to go wrong – while others of the interest, such as Google and Amazon, had the
    ''magic'' sort to automatically configure various systems


    ![](img/301dc180ffb6e12d0783cd1567376047_11_0.png)


    The rest of the industry was struggling, so Kanies licensed the Puppet release
    under GPL, later Apache 2.0. It used a model-based approach built around a simple
