    Upstream address variant 2 of Spectre using a novel approach introduced by Google
    and in a technical whitepaper last month. The attack on branch-prediction typically
    targets indirect branches (controllable) locations. When the branch predictor
    is ''poisoned'' (by crafted code, explained as last issue), the processor may
    execute arbitrary code that is not intended by indirect jumps. These pieces of
    code are called ''gadgets'' when executed, and the traditional fix for this is
    to disable the branch handles indirect jumps.


    The alternate, known as a ''retpoline'', does something it replaces indirect jumps
    with function calls carefully manipulating the return stack so the CPU thinks
    it is returning from a function. A jump is still made as part of this code, but
    in a careful manner, such that any specified code


    # # Upstream address variant 2 of Spectre using a novel approach released in a
    whitepaper last month


    is henceforth forced to halt a branch misprediction. Retpolines require compiler
    support. GCC (or llvm) will generate these sequences in place of indirect branches.
    In the case of the kernel, what will also generate speculative indirect code provided
    by the kernel, so both the kernel and compiler must have this for it to work.
    The very recent update GCC has been updated, with the most recent mitigation that
    can now be built with a special GCC.


    Retpolines are good, but they''re not the only way to mitigate Spectre variant
    2. Another piece is


    a barrier operation on the process (task) context switch which flushes the branch
    predictor state. On x86, this is known as IBPB (Indirect Branch Prediction Barrier)
    and must be provided by updated CPU separately. IBPB support was modified to run
    in 4.16 (which was only happen in certain cases, such as switching into a non-dummy
    process, skipping it back to the process following it), through a patch from Thomas
