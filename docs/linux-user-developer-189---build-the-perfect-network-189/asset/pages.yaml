    # ## 1 Install the squid proxy server

    A recent version of squid should be in your distribution software manager, or
    you can compile from the source code on the DIY using `configure && make && make
    install`, which should be necessary if you don''t really need the latest version.


    # ## 2 Configuration basics

    You should set one line in `/etc/squid/squid.conf` to suit your local network.
    Use localhost to point to other examples. Then check the `http_access` line, which
    determine who can use the server. The defaults may be suitable for you, but check
    anyway.


    ```

    apt-get update

    apt-get install squid

    ```


    Recommended minimum configuration:


    Sample rule allowing access from your local networks. To allow browsing you should
    add the following


    ```

    http_access allow 127.0.0.1/8          # localhost source

    http_access allow 192.168.1.0/24        # local network

    http_access allow 10.0.0.0/8             # private network

    http_access deny all                   # deny all other sources

    ```


    ```

    tail -f /var/log/squid/access.log

