    of info in hand, while advanced options are just a pull-down menu away.


    For security, Back In Time can encrypt snapshots using EncFS. You can use its
    interface to create a locally encrypted or an SSH-encrypted profile. However,
    it is not necessary to compress the snapshots to save both time and disk space.


    Files are encrypted with AES-256 by default and you can also use GPG to compress
    the backups to your destination. Duplicity also compresses all data it is encrypted
