    Generate graphs

    All your work in Dask is actually implemented by generating a graph and executing
    it. Dask takes each task that is to be executed in the graph and converts it into
    a set of nodes and edges. The edges connect one task to another to produce the
    output of a new process. Once the graph is generated, the scheduler of Dask is
    chosen to execute the tasks. The actual work is a full specification on how these
    graphs are generated, using standard Python objects like dictionaries, tuples
    and functions. These functions can mean that the scheduler is able to manage the
    execution in a very particular way.


