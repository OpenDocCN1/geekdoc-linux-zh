  md: '# Perfecting panels


    After some experimentation, Rick settled on using 3/16-inch MDF for the panels.
    He first drew the panel in CoreDRAW, making sure beforehand he identified the
    dials, switches and on that he wanted to use. Each had two layers: one for the
    cutting of holes and one for the panel print-out; he used photo paper covered
    with a clear protective sheet. Making sure all holes were aligned, he used 3M
    Spray Mount to glue the print-outs, cut the holes, and used a leather puncher
    for the four corner mounting holes.


    ![](img/301dc180ffb6e12d0783cd1567376047_72_0.png)


    # Dials, lots of dials


    All the parts came from AliExpress, Amazon and eBay. It''s not easy to buy what
    you need, Rick says; you''ll need to know the difference between SPDT and DPDT
    (Single-Pole and Double-Pole, Double-Throw) switches and momentary vs latch. Latch
    toggles on and off, even when pressed. "Lights will be in the same format, and
    for 12V, 24V, 120V or 220V, read carefully."


    ![](img/301dc180ffb6e12d0783cd1567376047_72_1.png)


    CPU CONTROL PANEL


    # Light show


    To power the panels at the bottom, Rick used an Arduino driving a four-relay board.
    He added marbles with plastic tubing by conventional 3.3V Christmas lights. To
    light them all, he had to use two 3.3V power supplies: "The lights were wired
    up in parallel, in a random order, so that each relay is pulled a random pattern
    of lights is."


    # Wiring web


    Rick describes his wiring as a "get-er-done approach", as the plan was to display
    the complete panel at Oracle''s Maker Faire. "I had to keep 12V power supplies
    to the project because there were so many magnificent lights!"


    ![](img/301dc180ffb6e12d0783cd1567376047_72_2.png)


    # Drawing it out


    Rick used CO2 laser cutter and designed his panels using CoreDRAW the free software
    supplied with the cutter. "Success!" Fortunately, the cutter supported a CoreDRAW
    Add-On. "I had to build this program, but I was kind of stuck," says Rick, so
    he bought a licence for it.


    ![](img/301dc180ffb6e12d0783cd1567376047_72_3.png)


    ![](img/301dc180ffb6e12d0783cd1567376047_72_4.png)


    # Switch to visual display


    A monitor on the panel displays files; it''s a 9-inch TFT Display Module HDMI+VGA+2AV
    Board and can be used with any Pi model. Rick wrote a Python script that runs
    and controls the OMXPlayer where his knob is turned. It uses 10 GPIO lines for
    rotary switches on the panel that catches the knob''s movements.


    ![](img/301dc180ffb6e12d0783cd1567376047_72_5.png)


