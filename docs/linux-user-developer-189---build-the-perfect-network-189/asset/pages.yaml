  md: "# Tutorial\n\n# Programming with R\n\n+   Clear out the workspace\n\nWhen you\
    \ declare a function or variable in the REPL, it's loaded into R's workspace and\
    \ stays there. If you're using RStudio, the Environment pane could cause unexpected\
    \ behaviour if you forget about a function definition. You can use the rsrm command\
    \ to delete the definition of a particular function or variable, which is very\
