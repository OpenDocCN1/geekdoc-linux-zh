    # UBUNTU


    # ## Wayland dropped as default due to stability and sharing issues


    With complaints over stability Xorg’s just better suited for the job


    Forthcoming Ubuntu release 18.04 LTS ''Bionic Beaver'' will abandon the Wayland
    display server and revert to Xorg, it has been reported. A blog post from desktop
    engineering manager Will Cook explains that Xorg graphics stack and the Wayland-based
    system will be included. However, in a massive reversal, it underlined that Xorg
    will be the default instead.


    Bearing in mind that the LTS has a five year support life, therefore needs to
    be worked with reliably. Cook lists screen sharing services such as WebRTC, Google
    Hangouts and Skype; remote desktop with RDP and VNC; and


    Exploring the first two, Cook observed that the Wayland/GNOME plan is to use Pipewire
    for screen sharing, further development is needed. "Until then, Xorg can restart
    independently of the display server


    With regards to recoverability, the fact that a GNOME shell can "end" the other
    process when crash is clarified: "When using Xorg, the shell can crash and once
    the shell is restarted, you can pretty pick up your session from where you left
    off, with your applications still running."


    While open source drivers work fine, it makes sense that they want to ensure stability
    of Wayland when it comes to games. For standard desktop activities, proprietary
    drivers are less reliable and, unfortunately, they offer far better


    performance in terms of frame rate, textures and so on. The solution to this problem
    is to switch to Xorg and use proprietary drivers.


    It''s not just for Wayland, Cook added. "There are also problems when using the
    shell that doesn''t crash or crash the architecture. There are two solutions to
    this work-[s] in progress and we will contribute to the upcoming upstream. In
    short, we remain committed to GNOME and the shell fixing Wayland by adding features
    and fixing bugs."


    As Cook noted: "the Ubuntu experience needs to be stable and provide the features
    users expect to use in daily life... For 18.04 LTS we will evaluate Wayland as
    the default." Reverting to Xorg is little more than a hiccup on the road to Wayland
    eventual acceptance by all major distros."


