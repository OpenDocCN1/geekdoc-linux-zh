  md: '# OPINION


    # Security: it’s time to make the shift left


    The merging of development lagging has left security concerns behind — Paul Farrington
    suggests number of ways to bring it back in line


    The staggering growth of the application economy has unprecedented pressure on
    deadlines results in lost revenue, while failing to improve quality through DevOps
    meets the demand for better performance. This burden on developers shifts the
    responsibility for establishing security throughout the entire lifecycle — including
    production and customer usage — to include developers.


    inconvenient bottleneck, but become integral part of the build process. To shift,
    it is crucial to bring development, operations and security together with a culture
    of quality improvement. There are a few suggestions how DevOps teams make the
    shift


    Fail quickly, using automation Build testing directly into the DevOps process
    as early as possible.


    Integrate security into dev tools Integrating security reduces friction. Ensure
    your security assessments integrate your IDE and toolset items such as developer
    code and coordinate remediation.


    Build security campaigns Make those with an interest in your security champions,
    who can help resolve conflict


    # Evolution’s shift


    The shift left has not only changed the role of developers, but has transformed
    the software lifecycle into state.


    In the traditional approach to software development, Waterfall would have handoffs
    at each stage of the software lifecycle (SDLC); from development, quality assurance
    and operations. With knowledge lost during the silos, operations, development,
    and business intent would never be the same: to the end, business intent would
    need to make up the changes.


    Agile development further brought business intent and applied knowledge with the
    product owner, developers and quality assurance on the same team. However, it
    still seems some of the problems persist control across the spectrum; the team
    now must be responsible for security. As a result, developers are starting to
    think differently about what they’re building and how they are securing it.


    The benefits of ‘shift left’ have been tested by the software development industry
    for a long time, including higher confidence in the delivered product, but costs
    have become lately to the ‘shift left’ method. However, with software and application-related
    data breaches and cyberattacks heavily impacting the industry over last five years,
    it is clear that security can no longer be viewed as an


    > Give developers the tools to find and fix errors such as developers write,


    Don’t stop for false alarms Don’t put up security solutions with high false-positive
    rate; as false alarms could create a bad burden from being deployed


    Extend security into production Application security can’t stop after deployment.
    Similar to other aspects of DevOps, a well-integrated solution must provide fast
    feedback from production from any subsequent incidents.


    Start making it By taking the decision to ensure that security is integrated across
    the entire SDLC from the outset, you will enable your team to deliver secure security
    — and faster.


    # Paul Farrington


    Paul is a Manager for the EMEA Solution Architects at Veracode.


