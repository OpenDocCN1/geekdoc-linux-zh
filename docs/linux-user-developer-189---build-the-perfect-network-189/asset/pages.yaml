    \ HPC environment at your university. In these cases, you will need to move to\
    \ a distributed scheduler. You can also use this scheduler on a single machine,\
    \ which will allow you to do all of your development locally before moving to\
    \ a larger production system. In this case, you just need to create a new Client\
    \ object with options, such as below:\n\n```\n```python\nfrom dask_distributed\
    \ import Client\nclient = Client()\n```\n```\n\nThis sets up a local cluster of\
    \ scheduler and workers, as in Figure 1. When you move to multiple machines, you\
    \ will need to use this same infrastructure across your network of machines. The\
    \ first step is to set up a scheduler on the main machine, using **dask-scheduler**:\n\
    \n```\n# dask-scheduler\nScheduler at tcp://192.0.0.1:8786\n```\n\nThis starts\
    \ the scheduler on this machine, listening for incoming requests from workers.\
    \ You process these with the command **dask-worker**, giving it the IP address\
    \ of the machine hosting the scheduler.\n\n```\n```bash\n# dask-worker\nStart\
    \ at: tcp://192.0.0.1:8786\nRegistered to: tcp://192.0.0.1:8786\n```\n```\n\n\
    If you want to manage workers from your scheduler, you can use the dask-ssh command\
    \ to start workers on the remote nodes over SSH. To do this, however, the Python\
    \ library **parkask** must be installed on each cluster.\n\n# First run\n\nOnce\
    \ you have hundreds of threads or processes, how do you set up them? The most\
    \ direct way is to create a Client object that uses this network, and handle in\
    \ the location of the scheduler process. For example, you would use 192.0.0.1:8786\
    \ as the parameter to the **Client**. You can then call map functions to distribute\
    \ your function across the cluster and get the results back. As an example, if\
    \ you wanted to get the result of the first 100 numbers on your cluster: you would\
    \ use something like this:\n\n```\n```python\\def square(x):\n    return x**2\n\
    \nanswer = client.map(square, range(100))\nclient.gather(answer)\n```\n```\n\n\
    ![](img/301dc180ffb6e12d0783cd1567376047_50_0.png)\n\n# First run\n\nOnce you\
    \ start running them, the more you spread out the work among them, the more you\
    \ open up a huge number of options in how to tune the system to optimize for your\
    \ own needs. The scheduler is easy to work with. You can use the **scheduler_info()**\
    \ method of the Client object to get the details of the current configuration.\
    \ If you need more information, you can collect logs by executing get_scheduler_logs()\
    \ and the worker logs with **get_worker_logs()**. This gives you details on how\
    \ the scheduling has been handled in the past.\n\n> Above Dask uses a central\
    \ scheduler and a set of workers that do the actual computational work\n\n> Debugging\
    \ Dask code is debugging Dask code. The standard debugger doesn't know how to\
    \ communicate across multiple machines. If you need to debug, you might need to\
    \ simplify your job so that it can run on a single machine locally.\n\n# Anaconda\
    \ includes all the options for Dask. If you are using a Raspberry Pi, try Berricane\
    \ indent\n\nBut what if you need to know what is happening right now, in terms\
    \ of how your computations are being distributed? Use the **processing()** method\
    \ to see which task is running on which worker. From this information, you might\
    \ find some workers have more tasks to carry out. In these cases, you can use\
    \ the **rebalance()** method to redistribute tasks to workers that are more loaded.\
    \ If it fails and you find the results are now worse, you can stop everything\
    \ and get back to an original state using the **restart()** method.\n\nEverything\
    \ runs within a single process and you can use the debugger to access all of the\
    \ information about your Dask objects.\n\nwww.daskuser.co | 51"
