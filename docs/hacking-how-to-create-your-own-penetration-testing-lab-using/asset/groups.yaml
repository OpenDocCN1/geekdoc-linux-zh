    # 黑客技术：


    *初学者指南：如何使用 Kali Linux 2016 创建你自己的渗透测试实验室*


    **Gary Mitnick**


    © 2016


    未经作者或版权持有人的事先书面许可，不得以电子或机械等任何形式或通过任何手段（包括复印、录音或任何信息存储或检索系统）复制或传播本书的任何部分，评论中引用的简短摘录除外。


    尽管作者已彻底研究所有来源，以确保本书所包含信息的准确性和完整性，但我们对本文中的任何错误、不准确、遗漏或不一致不承担责任。对任何个人或组织的无意冒犯纯属无意识。读者应根据自己的判断和/或咨询编程专家，以解决特定于其个人需求的應用程式。


    ## 目录


    - 引言

    - 飞行前检查清单

    - 在 BIOS 中启用虚拟化

    - Virtual Box + 扩展

    - 构建你的 Kali 虚拟机

    - 安装 Kali ISO

    - 调整你的 Kali 虚拟机

    - 安装来宾添加项

    - 资源

    - 更多课程书籍


    ## 引言


    本指南旨在帮助你开始使用 Gary Mitnick 编写的“初学者完整道德黑客系列”，而无需购买任何专门的渗透测试设备。作为渗透测试的入门，这足以让你起步。当你脱离初学者阶段后，你可能不会再用虚拟机（VM）进行测试。你的主机操作系统是什么并不重要，只要你能够启动并运行
    Virtual Box，步骤都是一样。我建议初学者使用虚拟机的原因是，如果出现问题，你也不会失去整个系统。（这是安全的）


    > *本文档是独立完成的，与任何人没有联系。其目的是加快在虚拟机中安装 Kali 的过程。*


    目前获取此手稿只有两种方式 – 通过亚马逊和通过我们的邮件列表（免费）。无论您如何获得此副本，我想向您表示感谢，并祝贺您投资于您的计算机知识。


    ## 开始之前：


    课程中使用你现有的设备是没问题的，但课程外的现实世界渗透测试则不然。大多数东西都会工作，顺便说一下，有些东西就是不行。


    *注意：* 内部无线网卡是否符合芯片要求？**停止警告：** 使用虚拟机时，VM 在 Kali 中会显示为以太网适配器 eth0。没有外部 USB 无线网卡，你就无法进行无线课程。为了冗余，我没有说在虚拟机中使用内部无线网卡。为了能够在
    VM 中进行无线课程，请搜索适用于 Kali Linux 的 USB 无线适配器。以下是两个介绍使用什么网站的网站：


    - http://www.blackmoreops.com/2014/01/08/recommended-usb-wireless-cards-kali-linux/

    - http://www.aircrack-ng.org/doku.php?id=compatibility_drivers

    - http://www.wirelesshack.org/top-kali-linux-compatible-usb-adapters-dongles-2015.html


    ## 更多课程书籍


    ![](img/5481504809e843668406e46c502c72ab_4_0.png)

    https://www.amazon.com/dp/B013JB351K/


    ![](img/5481504809e843668406e46c502c72ab_4_1.png)

    https://www.amazon.com/dp/B01M15T2GG/


    ## 飞行前检查清单


    - 检查并更新你的 BIOS，然后在 BIOS 中启用虚拟化。

    - 检查当前操作系统上的磁盘空间。你的系统需要 15% 的可用空间，然后你还需要额外的空间用于 Virtual Box 和 Kali。


    *这在开始之前很重要，需要检查。*


    - Hyper-V *不能*用于本课程。VMware 可以，但你应该会使用它。


    *注意：* 如果你启用了 Hyper-V，在尝试在 Virtual Box 中安装 Kali 时会出现问题，你将无法看到用于虚拟机的 64 位 Linux
    版本，你可以禁用 Hyper-V 在 Windows 功能中只需取消选中任何 Hyper-V 并重启你的系统。


    - 检查你的操作系统版本。它是 64 位还是 32 位？你的所有下载都应与你的系统匹配。*(64 位程序不能在 32 位机器上工作，反之亦然)*

    - 下载 Virtual Box 和 Virtual Box 扩展 - 在创建你的 Kali 虚拟机之前安装两者。


    https://www.virtualbox.org/wiki/Downloads


    - 从 https://www.kali.org/downloads/ 下载 Kali 2016 ISO，确保你有完整的下载（某些安全套件可能会阻止此下载）
    在连接你的 USB 外部无线网卡之前，确保你用 Virtual Box 扩展、来宾添加项和已安装更新的 Kali 正常运行。


    ## BIOS 启用虚拟化


    在 BIOS 中启用虚拟化（如果你不这样做，你将无法看到 64 位版本，并且安装可能会失败）。在物理系统启动期间进入 BIOS。每个系统都不同，所以要按的键可能因系统而异。我使用了一台戴尔笔记本电脑，所以我必须按
    F2 进入 BIOS。（google 搜索你的系统）


    ![](img/5481504809e843668406e46c502c72ab_6_0.png)


    在这种情况下，虚拟化在“高级”选项卡下，你要确保它已启用**（设置虚拟机的大部分麻烦都是因为跳过或没有做这一步）** 一旦你启用了虚拟化，你就想要保存你的更改并退出
    BIOS。在某些系统中，它可能不称为虚拟化，而是说“VT-x”


    ![](img/5481504809e843668406e46c502c72ab_6_1.png)


    某些系统可能需要完全关闭电源然后重新启动，以使这生效。你可以向系统制造商或谷歌查询如何进入你的 BIOS。你可以在 https://en.wikipedia.org/wiki/BIOS
    阅读什么是 BIOS


    ## Virtual Box + 扩展


    安装 Virtual Box，然后安装 Virtual Box 扩展。这些是基本的 Windows 程序，只需对 Virtual Box 和 Virtual
    Box 扩展都使用默认设置。如果你的主机系统是 OS X 或 Linux，你需要进行相同的安装，但要使用与你系统匹配的 Virtual Box 版本。创建虚拟机的步骤是相同的。


    在 Windows 中，右键点击并选择“以管理员身份运行”选项，以避免任何问题（即使你有管理权限）。如果你不在 Windows 中，请确保你拥有与你的系统
    OS 匹配的版本。所有下载都可以从 [https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)
    找到


    你还需要从 [https://www.kali.org/downloads/](https://www.kali.org/downloads/) 下载 Kali
    Linux 2016 ISO 文件，选择与你系统匹配的版本。根据你的操作系统进行安装。如果你有一个 64 位系统，那么下载 64 位版本和 32 位版本并使用
    32 位选项。如果你没有虚拟化功能可用，请使用 32 位下载进行安装。


    ![](img/5481504809e843668406e46c502c72ab_7_0.png)


    在 Windows 中，以管理员身份运行，完成后关闭并安装 VBox 扩展。


    ![](img/5481504809e843668406e46c502c72ab_8_0.png)


    ![](img/5481504809e843668406e46c502c72ab_8_1.png)


    ## 构建你的 Kali 虚拟机


    启动 Virtual Box（我已经在这里安装了另一个 VM 中的 Kali，这就是为什么你会看到那里有那个图标，我们将在这里创建一个新的 VM）


    ![](img/5481504809e843668406e46c502c72ab_9_0.png)


    点击“新建”。这开始创建新的 VM。


    ![](img/5481504809e843668406e46c502c72ab_10_0.png)


    给它一个像“Kali”这样的名字，或者你想叫它的任何名字。然后点击“类型”旁边的下拉菜单并选择“Linux”


    然后选择“Debian 64位”（如果你有 64 位系统，并且 BIOS 中开启了虚拟化（如果你有 32 位系统，则选择 Debian 32 位选项）按“下一步”


    ![](img/5481504809e843668406e46c502c72ab_11_0.png)


    ![](img/5481504809e843668406e46c502c72ab_11_1.png)


    设置你的内存大小，我的机器有 8gig 可用，所以给 VM 分配 2 gig。你可以输入你想给 VM 分配多少。我选择了 2048。如果需要，这可以稍后更改。（不要给得太少，否则会很慢，给得太多，你的主机系统也会变慢）


