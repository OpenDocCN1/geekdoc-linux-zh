  mdcn: '


    接下来，我们将为 Kali 创建一块虚拟硬盘。在本示例中，我使用了 32GB。如果你的空间充足，可以分配更多空间。（再次检查一下你实际硬盘上的可用空间）


    ![](img/5481504809e843668406e46c502c72ab_12_0.png)


    ![](img/5481504809e843668406e46c502c72ab_12_1.png)


    除非你有其他计划，否则请保持默认设置并点击“下一步”。


    ![](img/5481504809e843668406e46c502c72ab_13_0.png)


    保持默认设置，点击“下一步”。


    ![](img/5481504809e843668406e46c502c72ab_14_0.png)


    我将此设置为 32GB。如果你有多余空间，请尝试设置为 64GB 并点击“创建”（不要使用默认的 8GB，请修改它）


    ![](img/5481504809e843668406e46c502c72ab_15_0.png)


    ![](img/5481504809e843668406e46c502c72ab_15_1.png)


    在“系统”下的“加速”选项卡中，所有选项都应被选中（*如果你没有在 BIOS 中开启虚拟化，这些选项可能会呈灰色不可用状态*）


    桥接你的网卡（你实际网卡的名称可能不同），你需要选择主机系统当前用于获取 IP 地址并连接互联网的网卡。


    ![](img/5481504809e843668406e46c502c72ab_16_0.png)


    让你的网络设置看起来完全像这样，但使用你现有的网卡，并在高级部分允许所有权限。此时你的虚拟机已准备就绪，点击“确定”，前往 VBox 顶部并点击“启动”。


    ![](img/5481504809e843668406e46c502c72ab_16_1.png)


    ## 安装 Kali ISO


    ![](img/5481504809e843668406e46c502c72ab_17_0.png)


    ![](img/5481504809e843668406e46c502c72ab_17_1.png)


    浏览到 2016 版本的 ISO 文件。


    会弹出“选择启动磁盘”，请浏览到你下载的 Kali ISO 镜像文件。如果看不到该文件，请使用文件夹图标进行浏览（希望你记得把它放在哪里了），然后点击**启动**。


    ![](img/5481504809e843668406e46c502c72ab_18_0.png)


    使用“安装”选项，安装过程即开始。


    ![](img/5481504809e843668406e46c502c72ab_19_0.png)


    选择你的语言和所在国家。我选择了美式英语（在后续的*国家/地区设置屏幕中请保持默认设置*）（如果键盘设置错误，之后可能无法登录）


    ![](img/5481504809e843668406e46c502c72ab_20_0.png)


    安装应该开始进行。这需要一些时间。（*如果你没有分配足够的磁盘空间，此操作可能会失败*）


    ![](img/5481504809e843668406e46c502c72ab_21_0.png)


    在这里你可以随意命名，但在大多数屏幕中，你可以保持默认设置并按继续键（*回车键*）。


    ![](img/5481504809e843668406e46c502c72ab_22_0.png)


    域名不是必须的，直接按继续即可。


    ![](img/5481504809e843668406e46c502c72ab_23_0.png)


    设置你的密码，不要忘记了。它是区分大小写的，并且你需要在下一个屏幕上验证它（重要的是你已经正确设置了语言，否则后续可能会出问题）。设置你的时区（当你启动 Kali
    时，确保你的时区和时间设置正确），这可以防止某些程序（如 Tor 浏览器）无法正确加载。


    ### 配置时钟


    如果所需的时区未在列表中显示，请返回“选择语言”步骤，并选择一个使用所需时区的国家（你居住或所在的地区）。


    选择你的时区：


    - 中部时间 (Central)

    - 山地时间 (Mountain)

    - 太平洋时间 (Pacific)

    - 阿拉斯加时间 (Alaska)

    - (夏威夷)

    - 亚利桑那时间 (Arizona)

    - 东部印第安纳时间 (East Indiana)

    - Severo


    <返回>


    ```

    <Tab> 移动: <Space> 选择: <Enter> 激活按钮

    ```


    ![](img/5481504809e843668406e46c502c72ab_25_0.png)


    对此项选择默认设置。


    ![](img/5481504809e843668406e46c502c72ab_26_0.png)


    按回车键。


    ![](img/5481504809e843668406e46c502c72ab_27_0.png)


    继续选择默认设置，直到你到达“网络镜像”。


    ![](img/5481504809e843668406e46c502c72ab_28_0.png)


    用 Tab 键切换到“是”，按回车键。


    安装将开始并持续一段时间，请耐心等待。


    ![](img/5481504809e843668406e46c502c72ab_29_0.png)


    当接近结束时，它会提示关于网络镜像的问题，对此请选择“否”。


    ![](img/5481504809e843668406e46c502c72ab_30_0.png)


    安装将继续进行。


    ![](img/5481504809e843668406e46c502c72ab_31_0.png)


    你是在虚拟机中，不要惊慌，点击“是”。


    ![](img/5481504809e843668406e46c502c72ab_31_1.png)


    这是一个虚拟机，选择第二个选项，安装将继续进行。这不会触及你的物理硬盘，它将安装在你创建的虚拟硬盘上。


    ![](img/5481504809e843668406e46c502c72ab_32_0.png)


    你马上就要完成了。


    ![](img/5481504809e843668406e46c502c72ab_33_0.png)


    即将完成。


    ![](img/5481504809e843668406e46c502c72ab_33_1.png)


    欢迎来到虚拟机中的 KALI，使用 root 用户登录，并使用你之前创建的密码。


    ![](img/5481504809e843668406e46c502c72ab_34_0.png)


    游戏开始了。你既然已经走到了这一步；接下来我们将调整安装设置，为更新和其他互联网功能做好准备。


    ## 调整你的 Kali 虚拟机


    还有最后几步，你的 Kali 虚拟机就可以投入使用了。让我们打开“终端”并验证和更改一些设置。


    ![](img/5481504809e843668406e46c502c72ab_35_0.png)


    要启动终端：点击 iceweasel 下方的图标，它看起来像命令提示符，当它打开时你会看到这个屏幕。这就是我们要验证一些设置的地方。


    将 NetworkManager.conf 文件的设置从“false”更改为“true”。


    ![](img/5481504809e843668406e46c502c72ab_36_0.png)


    我们要进入包含 NetworkManager.conf 文件的目录 - 从提示符处，使用 cd /etc/NetworkManager 更改你的目录（区分大小写）你的提示符应该变为该目录。


    ![](img/5481504809e843668406e46c502c72ab_36_1.png)


    进入该目录后，输入 ls 并确认。你将看到“NetworkManager.conf 文件”（这里显示为白色）。然后我们要编辑此文件。我们将使用 nano（一个文本编辑器）在同一目录中输入
    nano NetworkManager.conf 并按回车键（区分大小写）


    ![](img/5481504809e843668406e46c502c72ab_36_2.png)


    在显示“managed=false”的地方，将其更改为“managed=true”。然后按 Ctrl+O 并按回车键保存，再按 Ctrl+X 退出编辑器返回终端，看看你是否能
    ping google.com。


    检查你的源文件，以获取正确的 Kali 更新和升级库，当前文件可以在这里找到 <http://docs.kali.org/general-use/kali-linux-sources-list-repositories>
    你需要让源文件中的所有行与该文件匹配，以避免重复。我只是清理了我的文件并粘贴了链接中的那些行。让我们检查或清理该文件


    ```

    root@kali:~# cd /etc/apt

    root@kali:/etc/apt# ls

    apt.conf.d   preferences.d  sources.list-

    listchanges.conf  sources.list  sources.list.d

    root@kali:/etc/apt#

    ```


    导航到 cd /etc/apt 目录并执行 ls 再次检查 sources.list 文件，我们将再次使用 nano 通过输入 nano sources.list
    来查看此文件。


    在这种情况下，我取了链接中的行并粘贴到文件中，清理了其余部分。**注意：*它们有时会更改*** 因此你需要查看 docs.kali.org 上的 Kali
    文档


    ![](img/5481504809e843668406e46c502c72ab_37_0.png)


    如果它们匹配，你就准备好了；如果不匹配，请再次在 nano 会话中进行剪切和粘贴，按 Ctrl+O 和回车键保存，按 Ctrl+X 退出。


    该获取更新和/或升级了。一旦我们有了连接性和源文件中的库，就是检查更新的时候了。


    ![](img/5481504809e843668406e46c502c72ab_37_1.png)


    输入 apt-get update && apt-get upgrade -y（-y 表示自动回答“是”以安装那些需要确认的项目，而不需要你逐个回答）


    ![](img/5481504809e843668406e46c502c72ab_38_0.png)


    一旦更新开始，请耐心等待，大文件有时看起来像系统卡死了一样，而且第一次这样做可能需要一段时间。（你应该考虑经常这样做，因为经常会有更新）。完成后，你可能会看到一些通知，以“W”开头的仅为警告，不是问题。但是，如果你开始看到以“E”开头的文本，请阅读它们
    /检查连接性/ 再次检查源文件。随着新的滚动更新，你还希望运行 **apt-get dist-upgrade**，这也可能需要一段时间。重启 Kali 并再次运行
    **apt-get update && apt-get upgrade** -y 以确保你拥有所有内容。


    '
