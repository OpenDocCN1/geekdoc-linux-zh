  md: '

    Next we will Create a virtual hard disk for Kali. I used 32gig for this example.
    You can give it more space if you have it. (again check the free space on your
    actual hard drive)


    ![](img/5481504809e843668406e46c502c72ab_12_0.png)


    ![](img/5481504809e843668406e46c502c72ab_12_1.png)


    Unless you have other plans take the default and press “Next”.


    ![](img/5481504809e843668406e46c502c72ab_13_0.png)


    Take the default press “Next”.


    ![](img/5481504809e843668406e46c502c72ab_14_0.png)


    I set this to 32 gig. If you have space to spare, try 64 gig and click create
    (Do Not take default of 8 Gig change it)


    ![](img/5481504809e843668406e46c502c72ab_15_0.png)


    ![](img/5481504809e843668406e46c502c72ab_15_1.png)


    Under System, under the Acceleration tab, all of the options should be checked
    (*These might be grayed out if you did not turn on virtualization on in your BIOS*)


    Bridge your adapter (the name of your actual adapter may be different) you want
    the adapter that your host system is currently getting an IP address and connecting
    to the internet.


    ![](img/5481504809e843668406e46c502c72ab_16_0.png)


    Make your network setting look exactly like this, but with the adapter you have
    and allow all in the advanced section. Your VM is now prepped, press OK, go to
    the top of VBox and press START.


    ![](img/5481504809e843668406e46c502c72ab_16_1.png)


    ## Install Kali ISO


    ![](img/5481504809e843668406e46c502c72ab_17_0.png)


    ![](img/5481504809e843668406e46c502c72ab_17_1.png)


    Browse to the 2016 iso


    “Select start-up disk” will pop up, browse to the Kali ISO image you downloaded.
    Use the folder icon to browse to it if you do not see it (hopefully you remember
    where you put it) press **Start**.


    ![](img/5481504809e843668406e46c502c72ab_18_0.png)


    Use the Install option and you are on your way.


    ![](img/5481504809e843668406e46c502c72ab_19_0.png)


    Select your language and country. I picked American English (select the defaults
    on the remainder of the *set-up screens for your country etc.*) (incorrect keyboard
    and you may not be able to log in after)


    ![](img/5481504809e843668406e46c502c72ab_20_0.png)


    The install should begin. This can take time. (*If you did not allow enough disk
    space, this operation may fail*)


    ![](img/5481504809e843668406e46c502c72ab_21_0.png)


    Here you can call it what you want but for most of the screens, you can take the
    default and just press continue (*enter key*)


    ![](img/5481504809e843668406e46c502c72ab_22_0.png)


    A domain name is not required, just press continue.


    ![](img/5481504809e843668406e46c502c72ab_23_0.png)


    Set your password, don’t forget it. It is case sensitive, and you will need to
    verify it on the next screen (important you have the right language already set
    or you may get in later) Set your time zone (when you boot into Kali make sure
    your time zone and time are correct), this can prevent some programs from loading
    correctly like the Tor browser.


    ### Configure the clock


    If the desired time zone is not listed, then please go back to the step “Choose
    language” and select a country that uses the desired time zone (the country where
    you live or are located).


    Select your time zone:


    - Central

    - Mountain

    - Pacific

    - Alaska

    - (Hawaii)

    - Arizona

    - East Indiana

    - Severo


    <Go Back>


    ```

    <Tab> moves: <Space> selects: <Enter> activates buttons

    ```


    ![](img/5481504809e843668406e46c502c72ab_25_0.png)


    Select the default for this.


    ![](img/5481504809e843668406e46c502c72ab_26_0.png)


    Press enter.


    ![](img/5481504809e843668406e46c502c72ab_27_0.png)


    Keep selecting the defaults until you get to “Network Mirror”.


    ![](img/5481504809e843668406e46c502c72ab_28_0.png)


    Tab over to “Yes” Press enter


    The install will begin and will take a while, be patient.


    ![](img/5481504809e843668406e46c502c72ab_29_0.png)


    When it gets close to the end, it will prompt about a network mirror select “No”
    for this.


    ![](img/5481504809e843668406e46c502c72ab_30_0.png)


    The installation will continue.


    ![](img/5481504809e843668406e46c502c72ab_31_0.png)


    You are in a VM do not panic, press “YES”.


    ![](img/5481504809e843668406e46c502c72ab_31_1.png)


    It is a VM select the second option, and the install will continue. This does
    not touch your physical hard drive it is going to go on the virtual hard drive
    you created.


    ![](img/5481504809e843668406e46c502c72ab_32_0.png)


    You are almost there.


    ![](img/5481504809e843668406e46c502c72ab_33_0.png)


    Almost done.


    ![](img/5481504809e843668406e46c502c72ab_33_1.png)


    Welcome to KALI in a VM, login as root and use the password you have previously
    created.


    ![](img/5481504809e843668406e46c502c72ab_34_0.png)


    Let the games begin. You have gotten this far; next we will tweak the installation
    and get ready for updates and other internet functionality.


    ## Tweak your Kali VM


    There are a few final steps and your Kali VM will be ready to go. Let''s go to
    the “Terminal” and verify and change some settings.


    ![](img/5481504809e843668406e46c502c72ab_35_0.png)


    To launch the terminal: press the icon under iceweasel, it looks like a command
    prompt, and when it opens you see this screen. This is where we are going to verify
    some settings.


    Change the NetworkManager.conf file settings from “false” to “true”.


    ![](img/5481504809e843668406e46c502c72ab_36_0.png)


    We want to get to the directory that contains the NetworkManager.conf file - from
    the prompt, change your directory with cd /etc/NetworkManager (case sensitive)
    your prompt should change to that directory.


    ![](img/5481504809e843668406e46c502c72ab_36_1.png)


    Once there type in ls and confirm. You will see the “NetworkManager.conf file”
    (Seen here in white). We then want to edit this file. We are going to use nano
    (a text editor for this) In the same directory type in nano NetworkManager.conf
    and press enter (case sensitive)


    ![](img/5481504809e843668406e46c502c72ab_36_2.png)


    Where it says “managed=false” change to “managed=true”. Then hit Ctrl+O and hit
    enter to save then Ctrl+X to exit the editor and return to the terminal and see
    if you can ping google.com


    Check your source file for the correct repositories for Kali updates and upgrades
    to the current files can be found here <http://docs.kali.org/general-use/kali-linux-sources-list-repositories>
    You need all lines of this to match in your source file to avoid duplicates. I
    just cleaned mine out and pasted the ones in that link in. Let’s check or clean
    out the file


    ```

    root@kali:~# cd /etc/apt

    root@kali:/etc/apt# ls

    apt.conf.d   preferences.d  sources.list-

    listchanges.conf  sources.list  sources.list.d

    root@kali:/etc/apt#

    ```


    Navigate to cd /etc/apt directory and do an ls to check for the sources.list file
    again we are going to use nano to check out this file by typing nano sources.list


    In this case I took the lines in the link and pasted them into the file and cleaned
    out the rest. **NOTE: *they do change it now and then*** so you need to check
    Kali docs at docs.kali.org


    ![](img/5481504809e843668406e46c502c72ab_37_0.png)


    If they match you are good to go, if not cut and paste into your nano session
    again Ctrl+O and press enter to save and Ctrl+X to exit.


    Time to get updates and/or upgrades. Once we have connectivity and repositories
    in the source file it’s time to check for updates.


    ![](img/5481504809e843668406e46c502c72ab_37_1.png)


    Type in apt-get update && apt-get upgrade -y (the -y is answering yes to things
    that want to install without prompting you to answer for each one)


    ![](img/5481504809e843668406e46c502c72ab_38_0.png)


    Once the updates start, be patient big files sometimes look like your system is
    locked and the first time you do this it can take a while. (You should consider
    doing this fairly often as there are often updates) When completed, you may see
    notices, the ones that begin with “W” are only warnings and not a problem. However,
    if you start seeing ones that begin with “E” and text, read them /check connectivity/
    check the source file again. With the new rolling updates, you will also want
    to run **apt-get dist-upgrade** and this can take a while. Reboot Kali and do
    the **apt-get update && apt-get upgrade** -y again to be sure you have everything.

