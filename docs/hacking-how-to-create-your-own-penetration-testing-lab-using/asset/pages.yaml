- pgno: 3
  md: '# Introduction


    This guidebook is to help you get going with the “The Complete Ethical Hacking
    Series for beginners” by Gary Mitnick without buying any specialized equipment
    for penetration testing. As an introduction to penetration testing this will be
    all you need to get started. As you leave the beginner stages you will probably
    not be using a Virtual Machine (VM) for your testing purposes. It does not matter
    what the operating system of your host machine is, if you can get a Virtual Box
    up and running the steps are all the same. The reason I suggest a Virtual Machine
    for beginners is that if something goes awry you won’t lose your entire system.
    (This is safe)


    > *This document was done independently with no connections to anyone. The intent
    is to speed up the Kali installation process in a Virtual Machine.*


    Currently there are only 2 ways of obtaining this manuscripot – through amazon
    and through our mailing list (for free). Regardless of how you obtained this copy
    I want to thank you and congratulate you for investing in yourself and your computer
    knowledge.


    # Before you begin:


    Working with what you already have is fine for the course, however not for real
    world pen testing outside of it. Most things will work, and by the way some things
    just WILL NOT.


    *Note:* Does internal wireless meet the chip requirements? **STOP Warning:** A
    VM will show up in Kali as an Ethernet adapter eth0. You can’t do the wireless
    lectures without an external USB wireless card when using a Virtual Machine. To
    be redundant I did not say use the internal wireless card in a Virtual Machine.
    To be able to do the wireless lectures in a VM, do a search for USB wireless adapters
    for Kali Linux. Here are a couple of sites that talk about what to use:


    +   - http://www.blackmoreops.com/2014/01/08/recommended-usb-wireless-cards-kali-linux/

    +   - http://www.aircrack-ng.org/doku.php?id=compatibility_drivers

    +   - http://www.wirelesshack.org/top-kali-linux-compatible-usb-adapters-dongles-2015.html'
  merge: -1
  img_proc: true
