  md: '# EJECT FLOPPY DISKS AND CD-ROMS


    Although the floppy and CD-ROM eject process in Linux is more complex than the
    simple pop-in and pop-out functions on a Windows PC, the GNOME system makes the
    process easier by placing these functions on a tool—the Disk Manager.


    However, by placing the functions you need on the label of a button, Linux has
    made it easier to unmount a disk you want to eject.


    You must always remember when you are using floppy disks and compact discs in
    Linux that are not using a standard PC with Windows. In Linux, you must unmount
    a floppy or a CD before you eject the button to remove the disk.


