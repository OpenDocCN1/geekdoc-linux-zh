    # Update your man pages.


    The man pages are included with all versions of UNIX and Linux. However, your
    version of may be out of date depending on the version of Linux you are using.
    An older man page may not include some of the newer commands. You can consult
    the vendor of the version of Linux you are to determine whether you can download
    the latest commands in your man pages.


    # Decrypt a man page.


    Most man pages are not so much technical as wordy. If you do not understand a
    page, print it for easier reading. Another option is to search the Internet for
    how-to instructions on pages that are too cryptic for you. User groups have posted
    an enormous amount of how-to pages that can help you.


    Access man no matter how you are logged in.


    The man pages are available for all users, root and otherwise. Usually the root
    account finds man pages most helpful because general users do not delve into Linux
    as deeply as root. As an administrator, you will frequently rely on information
