  md: '# CUSTOMIZE YOUR SCREEN SAVER


    screen savers are programs that automatically start when your computer is inactive
    for a specified amount of time. Screen savers can serve several purposes, depending
    on how you configure them. They can prolong the life of your monitor, reduce electricity
    consumption when you are not using your computer, and even prevent someone from
    viewing or devaluing your user account.


    is composed of phosphor dots that glow when struck by electrons. If the image
    does not change for a long time, that image can literally get burned into the
    screen, blurring any image that is being displayed. A screen saver program is
    designed to extend the life of your monitor by preventing this burn-in. By displaying
    a constantly changing pattern, it is impossible for an image to permanently imprint
    on the screen.


    The main purpose of a screen saver is to prevent burn-in. The image on the computer
    screen


