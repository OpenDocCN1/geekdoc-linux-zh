  md: '# Apply It


    Grant users system access for making changes in LinuxConf.


    When you click a user account name in LinuxConf, one of the tabs on the far right
    is the Privileges tab. The access privilege list is located there, and you can
    give the user permission to perform tasks in LinuxConf.


    Watch for user names that are the same as system account names.


    Do not allow users to change their user names to the same names as system accounts.
    For example, if a user changes his or her name to mail, you must immediately switch
    it to something else. Having duplicate user names and system account names could
    cause both Linux and the administrator serious problems. User account names must
    be unique, and LinuxConf has built-in safeguards to help prevent duplicates.


