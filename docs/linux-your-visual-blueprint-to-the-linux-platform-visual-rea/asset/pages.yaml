    # FORCE-KILL A VI PROCESS


    +   1 ps -ef | grep vi.


    +   2 Press Enter.


    +   3 kill 2779.


    +   4 Press Enter.


    +   5 ps -ef | grep vi to check the result.


    +   6 Press Enter.


    +   The display shows that the process is still running.


    +   7 Type kill -9 2779.


    +   8 Press Enter.


    +   9 Type ps -ef | grep vi to check the result.


    +   10 Press Enter.


    +   The display shows that the process is gone.'
