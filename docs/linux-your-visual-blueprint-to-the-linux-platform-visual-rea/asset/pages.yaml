  md: '# GET TO KNOW THE LINUX DESKTOP ENVIRONMENT


    # Extra


    Learn other ways to prevent overlapping windows on a desktop.


    The next section, "Turn Windows into Icons and Bars," explains additional methods
    of preventing windows beside resizing and moving windows around the desktop.


    Find a window lost completely behind another, larger window.


    Make the larger window active and then minimize it. Then you can click and drag
    the smaller, previously hidden window to an area of the desktop where it is not
    eclipsed by the larger window.


    Watch for performance degradation.


    In theory, there is no maximum number of windows you can have open. In practice,
    however having an excessive number of windows open at the same time can cause
    older machines to slow down slightly. The number varies from machine to machine
    depending on the hardware. An x86 machine with 8 or 10 windows can have up to
    50 windows open without suffering performance.


    ![](img/2fa10bfc913512051e0929ab24933fc6_38_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_38_1.png)


    +   Hold the mouse pointer over the title bar of the window.


    +   When you have the pointer in the right location, the diagonal pointer turns
    into a four-point icon that looks like a compass.


    +   Draw the window to the location you want and release the mouse button.


    Note: Combine moving and resizing windows to avoid problems with overlapping.'
  merge: -1
