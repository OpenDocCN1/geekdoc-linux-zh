  md: '# Extra


    How get and put equate to the network terms upload and download.


    As a rule, get is the equivalent of download and put is the equivalent of upload.
    Traditionally, network diagrams show most data consumers, also called client machines,
    below the servers. Therefore you get a file and pull it down to the client machine
    or put a file from the client machine on the server.


    How can you log in to a secure FTP server.


    To use a secure FTP server, you must have a user account name and password that
    the server recognizes. However, many servers let you log in with the user account
    name.


    Why may you be unable to copy a file to the FTP server?


    Your ability to copy to an FTP server is a question of permissions. Unless you
    have write permissions for the target directory on the FTP server, which is rare
    on a secure server, you are not allowed to put or upload files to the server.


    ![](img/2fa10bfc913512051e0929ab24933fc6_284_0.png)


