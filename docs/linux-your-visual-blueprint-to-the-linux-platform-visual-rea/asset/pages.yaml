    when the CD-ROM is spinning, but it is unbalanced. In most cases, the cause of
    the unbalance is that you placed the CD in the drive upside down. Eject the CD-ROM,
    turn it over, and put it back in the drive. If the CD is in the drive correctly,
    you may have a failing CD-ROM drive.


