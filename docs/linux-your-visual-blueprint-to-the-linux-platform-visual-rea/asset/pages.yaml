    # Apply It


    Use pipe instead of a redirect command with ps.


    When you use a redirect, you transfer output data to a file or from a file to
    a command. The pipe command is designed to send the output of one command as the
    input for another command. You can certainly redirect the output of the ps command
    to a file and then read the file, but that process is cumbersome. You cannot use
    redirect to send the output of ps directly through a grep command. Instead you
    have to use a separate grep command on the file you just directed the output to.


    Redirect output from multiple files.


    There are no limits to the number of files that you can include in a redirect
    command. For example, you could redirect output from five files into one by using
    a command similar to cat a b c d e >> <recipient file>. However, this is rarely
    done; it is more to copy files instead of redirecting their contents.


    ![](img/2fa10bfc913512051e0929ab24933fc6_172_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_172_1.png)


    # APPEND A FILE REMOTELY


    +   1 Type cat gettysburg_final ~/var/Sculptor/michaelangelo.


    +   This command appends the contents of gettysburg_final to /var/Sculptor/michaelangelo.


    +   2 Press Enter.


    +   3 Type cat /var/Sculptor/michaelangelo to check the result.


    +   4 Press Enter.


    # APPEND TEXT FROM MULTIPLE FILES INTO ONE FILE WITH A REDRECT


    +   1 Type cat draft text >> myfile.


    +   This command appends the text in both the first and second names into the
    third one that is receiving the redirected text.


    +   The text is redirected and you are returned to the command prompt.


    159'
