  md: '# WORK WITH THE LINUX FILE SYSTEM IN GNOME


    # Extra


    Root account access privileges.


    The root account is the administrator, so by definition, that account has full
    access to all directories. Of course, just because you have access does not mean
    you should change everything. In fact, in some areas such as /bin and /dev, you
    should change things as little as possible to prevent problems with the system.


    The best directory for storing files.


    By default, files are saved to a Home directory in the /home area. You can save
    files in other locations, but not store them in the /tmp directory. Because that
    directory is temporary, its contents are dumped and lost every time you reboot
    the system.


    General user account access privileges.


    The directories accessible via a general user account depend on the privileges
    that you, the root user, grant to everyone else. Usually, user accounts can access
    anything on a Linux system, but they are prevented from making permanent changes
    to any sensitive areas of the system, such as /usr or /var.


