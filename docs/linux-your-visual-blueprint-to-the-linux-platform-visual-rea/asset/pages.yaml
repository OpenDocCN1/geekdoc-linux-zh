  md: '# DELETE FILES AND DIRECTORIES


    You delete files with the rm command and directories with the rmdir command in
    the Linux Terminal. When you delete a file or directory, Linux asks if you are
    sure you want to delete it. Make sure you pay attention here, because once you
    answer yes, there is no turning back or restoring the file, unless you have made
    a backup copy and stored it somewhere else.


    You delete entire directories in Linux using the -r command option with the rm
    command. Linux offers an additional safeguard when it comes to deleting directories.
    If there are files inside the directory, GNOME asks you if you want to delete
    all files inside the directory as well. If you want to keep any files inside the
