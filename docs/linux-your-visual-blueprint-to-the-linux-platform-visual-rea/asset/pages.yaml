  md: '# APPENDIX B


    # CREATE A LINUX RECOVERY DISK


    You can create a recovery disk to restore your system in the event of a system
    crash. As long as your crashed or malfunctioning system is still bootable, you
    can use a recovery boot disk to boot and repair your system. The difference between
    a boot disk and recovery disk is that a recovery disk also contains processes
    that run automatically to restore a damaged operating system.


    and repair entire file systems and disks on a machine with comparative ease. Stored
    on a recovery disk are procedures and system diagnostic tools copied over the
    installation CD-ROM. When you activate and use the tools on the disk, these tools
    complete the recovery and repair tasks automatically or at most with little prompting
    from you in a user menu. You should always have a recovery disk and a boot somewhere
    in your lab, office, or equipment room.


    Sometimes you may be unable to get to the root of the problem from the GUI or
    even the Terminal. In such a case, you need to boot the machine with recovery
