  md: '# USING GNOTEPAD+ FOR WORD PROCESSING


    # Apply It


    Use the Undo and Redo toolbars.


    Both Undo and Redo are available as toolbar buttons with curved arrows. To tell
    which is which, move the mouse pointer over the buttons to see the pop-up descriptions.
    Another easy way to remember is that as you type, text, the cursor moves from
    left to right across the screen. The undo arrow points counterclockwise, to follow
    the flow of text, as if it were turning back the typed event.


    Use Undo All and Redo All instead of closing and reopening a document.


    To discard all your changes and go back to the original document, you could close
    the file without saving and then reopen the document. But these are extra steps,
    and gnotepad+ will delay you by asking if you want to save your changes. Yes,
    you have no way of turning back the mistake. Undo All saves you these extra steps
    and the possibility of overwriting your original document with changes that you
    do not want to keep.


    ![](img/2fa10bfc913512051e0929ab24933fc6_270_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_270_1.png)


    Click Redo on the Edit menu if you change your mind about the change you just
    made.


    You need to select the command once for each action that you want to redo.


    There are no toolbar buttons or Ctrl keys to activate these two menu commands.


    +   - Clicking the command once undoes the last action.


    +   - Click Edit.


    +   - Click Undo All or Redo All.'
