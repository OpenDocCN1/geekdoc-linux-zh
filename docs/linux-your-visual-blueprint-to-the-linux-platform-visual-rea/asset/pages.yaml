  md: '# EDIT USER ACCOUNTS IN THE LINUX TERMINAL


    You can make changes to user accounts in the Linux Terminal as well as in the
    GNOME interface, but editing user accounts in the Linux Terminal has a couple
    of advantages over working in GNOME.


    For example, if you are already working in the Terminal window, you do not have
    to shift back and forth from the Linux Terminal to the GUI system. Another advantage
    is when you become proficient with editing accounts


    in the Terminal, your Linux skills are more transferable. This means that if you
    have to work on a slightly different Linux system that does not have the GUI-based
    LinuxConf tool, you can still successfully perform your job.


    A Linux expert needs to know how to perform tasks in both the GUI and the Linux
    Terminal. To edit accounts in the Terminal, you use the vi editor. Refer to Chapter
    9 for more information on using the vi editor.


    ![](img/2fa10bfc913512051e0929ab24933fc6_73_0.png)


    +   - You must be logged in as root to edit a user account.


    +   - 1 Click the Terminal emulation button.


    +   - The Linux Terminal window opens.


    +   - 2 Type vi /etc/passwd. Note: The passwd file is a critical file. If it is
    corrupted during editing, every user on the system could be affected, including
    root.


    +   - 3 Press Enter.


    +   - You are now in the vi editor. The screen displays the contents of the passwd
    file.


    +   - 4 Move the cursor to the bottom line so you can edit the user account ragnar.'
