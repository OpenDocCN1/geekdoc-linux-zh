  md: '# LIST USER GROUPS


    You can use the LinuxConf to view the entire list of user groups on your system.


    A user group is a logical collection of user accounts. As a user, you are part
    of a group of accounts that shares file permissions, e-mail aliases, and probably
    the same slice of hard disk holds data. LinuxConf enables you to view this group
    information in alphabetical order in a friendly, graphic mode.


    Note also that when LinuxConf lists all groups, it is not just groups that have
    users. LinuxConf shows you all the groups, some of which may not have users attached
    to them.


    For example, assume you have a user group called games that has no users in the
    group. Just because there are no users in the group does not mean that the group
    ceases to exist. It is simply an empty logical container that you can place users
    into.


    ![](img/2fa10bfc913512051e0929ab24933fc6_77_0.png)


    +   - Open LinuxConf.

    - The GNOME-Linuxconf window appears.


    +   - Scroll down to Users accounts.


    +   - Click Group definitions under the Normal heading.


    +   - The User groups panel appears in the right frame.

    - The last letters of two group names—console and daemon—are truncated in the
    first column.'
  merge: -1
