  md: '# ADD USER GROUPS


    f you work on a network with more than a few user accounts, you need to know how
    to add user groups.


    Creating new user groups helps keep your users organized. Normally, the root account
    organizes the groups by the names of departments, such as accounting, marketing,
    and research.


    As the majority of the functions in the Linux configuration tool, the root account
    may add a new user group. After you


    create the group, you can add or delete members as necessary.


    No set ratio exists between users and user groups. Because user accounts simply
    provide a method for users to log into a Linux system, a single user can belong
    to one or multiple user groups. Similarly, a group can have two, a million users,
    or no users at all—the logical grouping still exists and works just as well.


