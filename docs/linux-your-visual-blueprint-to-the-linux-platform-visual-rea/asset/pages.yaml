  md: '# # LOG IN AS THE ROOT USER ACCOUNT


    s the root user on a Linux system, you can edit any file and change any permissions
    you wish. The root user is the administrative account with unilateral privileges
    over all accounts and files on the Linux system.


    You can enter the root account in one of two ways. First, you can perform the
    typical login procedure, using root instead of another user account name. You
    can also become root by using the su command. The su command stands for switch
    and is primarily used by administrators when they need to switch to the root account
    to handle an administrative task or repair.


    Any Linux system includes only one root account, but other accounts can be granted
    the same privileges as root if necessary. For security purposes, root privileges
    should be granted sparingly, if at all.


    # LOG IN AS THE ROOT USER ACCOUNT


    ![](img/2fa10bfc913512051e0929ab24933fc6_51_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_51_1.png)


    # LOG IN AS ROOT


    +   1 Type root or the name of a user account that has root privileges at the
    login prompt.


    +   2 Type your password.


    +   3 Press Enter. If the password is correct, you are logged in as root.


    Your password normally is not displayed. However, in some versions of Linux, your
    password may be represented as a row of asterisks.'
  merge: -1
