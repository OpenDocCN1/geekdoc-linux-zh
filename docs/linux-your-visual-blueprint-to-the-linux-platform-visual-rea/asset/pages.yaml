  md: '# LINUX


    # EDITOR USER ACCOUNTS


    You can edit account information on the LinuxConf Users accounts screen. Depending
    on how permission your system allows, users may be able to change their passwords
    and other pertinent information. However, if you want to keep all administrative
    functions under your control, you can designate root as the sole point of contact
    for change. Be warned, that if you choose this option, you can quickly become
    overwhelmed by mundane administration chores.


    For example, assume that on a particular work day a new user needs to be added
    to the games group. Furthermore, the user''s name has changed, so you also need
    to change the account name. Another user needs mail aliases changed, and a fourth
    wants a password changed to something obscure. If you have to continuously perform
    these tasks for a large user community, you will be spending too much time administering
    user accounts.


