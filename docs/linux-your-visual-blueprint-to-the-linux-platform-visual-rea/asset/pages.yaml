  md: '# Apply It


    View additional menu options at the base of the Terminal screen.


    View messages in chronological order only.


    Because pine is not a GUI-based program, it does not have drop-down menus. The
    designers could only include a dozen commands at the base of the screen. Press
    O to see the next dozen commands displayed. The commands do not have to be shown
    on the screen for you to use them.


    Unlike newer, GUI-based mail programs, you cannot change the order of the messages
    to organize them by username, priority, or reverse chronology. Pine displays messages
    in the inbox and all of its folders—strictly by chronological order according
    to the date on the sender''s machine when the email was sent, when you receive
    it. If you receive e-mails that out of date, it means messages were delayed between
