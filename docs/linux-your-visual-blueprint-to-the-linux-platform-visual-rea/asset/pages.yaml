    3. Scroll down to Users accounts.


    +   3 Click User accounts under the Normal heading.

    4. The users accounts panel appears in the right frame.

    5 Click Add.


    +   The User account creation panel appears.

    5 Type kiko in the Login name field.


    +   By default, The account is enabled button if the field is depressed. If not,
    click it to activate the account.'
