  md: '# Apply It


    Make a boot disk now.

    When you installed Linux, you should have been prompted to create a boot disk
    during the installation process. If you get the chance, always choose Yes at this
    prompt. If you do not yet have an emergency boot disk, make one.


    Do not count on a UNIX boot disk on your Linux machine.

    UNIX, while a close relative of Linux, usually has more differences in its boot
    processes and kernel configurations than most flavors of Linux. Trying to boot
    a Linux machine from a UNIX boot disk should not harm your current installation,
    but it is unlikely to work.


    Use your boot disk with a different flavor of Linux.

    You can try to use your emergency disk to boot a machine running a different flavor
    of Linux. In some cases, it might work, as long as the two brands of Linux are
    not too dissimilar. The attempt should not damage your current installation of
    Linux in any way. However, by no means should you rely on this method as a backup
    for your machine.


    ![](img/2fa10bfc913512051e0929ab24933fc6_326_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_326_1.png)


