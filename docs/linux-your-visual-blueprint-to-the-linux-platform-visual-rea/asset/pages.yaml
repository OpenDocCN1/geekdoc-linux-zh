  md: '# Apply It


    Set the delay interval in the shutdown command to two, five, or ten minutes instead
    of 30 or 60 seconds.


    By default, the shutdown time interval in Linux is 30 seconds. However, if you
    want a longer delay—a minute or two, or more—simply enter the time you want in
    seconds. Linux does not accept units in any interval except, so you have to calculate
    the number of seconds your time interval contains.


    For example, shut down the system in two minutes, type the following at the command
    prompt and press Enter:


    ```

    shutdown -t 120

    ```


    To shut down the system in five minutes, type the following at the command prompt
    and press Enter:


    ```

    shutdown -t 300

    ```


    To shut down the system in ten minutes, type the following at the command prompt
    and press Enter:


    ```

    shutdown -t 600

    ```


    ![](img/2fa10bfc913512051e0929ab24933fc6_30_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_30_1.png)


    +   4 Linux displays the broadcast message notification.


    +   5 Press Enter to return to the command prompt.


    +   6 Type shutdown -t 60 at the command prompt.


    +   7 Press Enter. Linux waits the specified time and then automatically initiates
    the shutdown procedure.


    +   Shutdown is another Linux-based utility that allows you to specify how long
    you want the system to wait before it initiates a halt. In this case, typing shutdown
    -t 60 waits 60 seconds before shutting down.'
