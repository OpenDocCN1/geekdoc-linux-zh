  md: '# APPENDIX B


    # CREATE A LINUX BOOT DISK


    You can create a Linux boot disk as backup for your system. Although Linux is
    one of the most stable and reliable operating systems on the market, it is conceivable
    that something could happen to make the system haywire and refuse to boot. For
    example, a sudden loss of power or a surge from a nearby lightning strike while
    the system is in the middle of a delicate operation can cause a lockup so severe
    that booting is not possible.


    You might also run into this kind of problem if one of your hard drives is failing.
    In that case, booting up the system—even one more time—is crucial for salvaging
    as many of the files on the old disk as possible. You can only perform this feat
    if you have a boot disk available.


    # CREATE A LINUX BOOT DISK


    ![](img/2fa10bfc913512051e0929ab24933fc6_325_0.png)


