  md: '# BROWSE THE LINUX FILE SYSTEM IN GNOME


    You can browse the different directories in the Linux file system once you understand
    that directories in Linux are organized in a tree structure. When you open a directory,
    any files or subdirectories inside are displayed as branching out in the GNOME
    File Manager''s left window.


    The absolute beginning of the tree-shaped Linux file system is, appropriately
    enough, called the root directory, which is different than the default Home directory
    you see when you log in as the root account.


    The root directory instead is a couple of levels higher up in the directory structure,
    symbolized by the slash sign, /. When you display the root directory in File Manager,
    you see all the rest of the major directories, as /etc, /var, and /usr, listed
    as subdirectories of the root directory.


    ![](img/2fa10bfc913512051e0929ab24933fc6_97_0.png)


