  md: '# SET UP LINUX USER ACCOUNTS AND GROUPS


    # Apply It


    Find groups by scrolling.


    Avoid naming a group after a user.


    LinuxConf''s User groups panel is not as flexible as its Microsoft Windows counterpart,
    so you cannot list groups by group ID or list members alphabetically. To find
    a group, scroll down the alphabetical list to locate the entry.


    Linux does not prevent you from naming a group after a user, but it is not a good
    habit. It can cause too much confusion.


