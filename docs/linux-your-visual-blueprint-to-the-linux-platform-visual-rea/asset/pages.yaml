  md: '# SET UP LINUX USER ACCOUNTS AND GROUPS


    # Apply It


    # Understand the difference between user groups and user accounts.


    User groups serve a different function than user accounts. User groups do not
    contain actual data, so you cannot put them into status by disabling them the
    way you can a user account. User groups are simply logical groupings.


    # Bring back an accidentally deleted group.


    You cannot restore a user group, but you can re-create it. When you delete a group,
    you delete the logical grouping of the user accounts that make up that group.
    But do not worry; by deleting a group you do not delete the user accounts.


    # Disable a group without deleting it.


    The closest you can come to disabling a group without deleting it is to remove
    every user account in the group and leave it empty.


    ![](img/2fa10bfc913512051e0929ab24933fc6_84_0.png)


