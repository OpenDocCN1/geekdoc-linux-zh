  md: '# Decide where to locate the spool.


    The print spool is stored by default in the /var directory. If the disk partition
    where /var is located getting full, you can move the print spool to /tmp/. The
    advantage of doing this is that Linux automatically empties /tmp whenever you
    restart your computer, which helps prevent /tmp from filling up. The disadvantage
    is that if you have jobs in the queue and you reboot, the print jobs are lost.


    # Change the print spool location.


    Click any printer in the Print System Manager. When the Edit dialog box appears,
    type a new location, such as /tmp, in the Spool Directory field.


    # Keep the print spool size manageable.


    If you do not want to set print size limits, an alternative is to e-mail your
    users and ask them not to print documents longer than 50 pages during peak hours.


