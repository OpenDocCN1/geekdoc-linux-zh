  md: '# USING THE MAN PAGES


    You can find answers to most of your Linux system administration questions and
    get more information on topics you need to know about the man pages available
    on every Linux machine. The man, short for manual, pages list all the Linux commands
    that have been passed down from earlier versions of the Linux and UNIX operating
    systems. The man pages list each command''s function, as well to provide all the
    available options that you can run with each command.


    Although written in a very technical way, the man pages are an invaluable source
    of information if you are trying to determine what command option to use with
    a particular utility.


    Although the man pages cover 90 percent of the functions you will use in the Linux
    Terminal window, they do not cover the later, GUI-based utilities such as GNOME.
    For information on GNOME options and commands, see Chapters 2 and 4.


    ![](img/2fa10bfc913512051e0929ab24933fc6_173_0.png)


    # USING THE MAN PAGES


    # FIND INFORMATION ABOUT THE PS COMMAND


    +   1 Type man ps at the command prompt.


    +   2 Press Enter. A formatting page message appears as man searches its pages
    for ps.


    +   The appropriate man page displays in the vi editor window.


    +   Although you cannot edit the man pages, you can scroll and search through
    the entry.'
