  md: '# SELECT BACKGROUND WALLPAPER


    You can add pictures, shapes, or patterns to your desktop background to create
    a more colorful and attractive working environment.


    Wallpaper, unlike color solids and gradients, do not come standard with most Linux
    installations because of the wide range of monitors with different capabilities
    on the market. For example, if GNOME were to include background wallpaper that
    incorporated a three-dimensional image, older monitors might be unable to draw
    the figure accurately, leading to color distortion or monitor burnout.


    The pictures or shapes you place in the background are called background wallpaper,
    or wallpaper for short, because the process of pasting a picture or pattern on
    your desktop is roughly analogous to hanging wallpaper in your house or apartment.


