    ASCII and Postscript are distinct systems, and certain types of printers handle
    one or the other best. Some printers handle both. You can normally find out types
    of systems your printer use by checking the documentation that came with your
    printer. You will usually end up the default printer port setting—Print ASCII
    directly to port, which works best for the vast majority of printers on the market
    today, especially local printers on a small network or standalone machine.


    Learn what SMB—Samba—and NCP—NetWare—printers are all.


    SMB stands for server message block, also known as Samba, which is software that
    lets you connect Windows machines to your Linux network and uses hard drives.
    NCP stands for NetWare core protocol, which means that you are dealing with a
    NetWare server.


    Find additional help and instructions.


