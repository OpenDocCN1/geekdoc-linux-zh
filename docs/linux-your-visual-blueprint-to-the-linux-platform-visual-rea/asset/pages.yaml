  md: '# LIST FILES (CONTINUED)


    You can list files in Linux in more complex ways than simply by size, time, or
    type of file. Linux enables you to list files in reverse alphabetical order, reverse
    time-edited order, and in reverse order by size—smallest to largest, instead of
    largest to smallest.


    The most powerful tool that you have at disposal with the ls command is the ability
    to list files in directories outside of the current one. This ability is also
    called remote listing. For example, if you are in the /root directory, you do
    not have to change directories to the /etc directory if you want to list files
    in /etc.


    If you combine, or stack, the -r option with the ls command, you can list the
    files in the directory by time edited in reverse order. This enables you to zero
    in on the most recently edited files.


    Instead, you can run a single command to list files in any directory on your Linux
    machine without having to open any new directories or windows the desktop.


    ![](img/2fa10bfc913512051e0929ab24933fc6_137_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_137_1.png)


    # LIST FILES BY TIME EDITED, IN REVERSE ORDER


    # LIST FILES IN DIRECTORIES OUTSIDE OF YOUR CURRENT DIRECTORY


    +   1 Type ls -ltr

    2 Press Enter.


    +   1 Type ls /var to list the files in the /var directory.

    2 Press Enter.'
