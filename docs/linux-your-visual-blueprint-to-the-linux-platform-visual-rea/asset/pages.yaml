  md: '# WORK WITH DRIVES AND DISKS


    # Apply It


    Watch out for runaway processes.

    The most common cause of a rapidly filling hard drive is a runaway process that
    writes a log file to the hard drive. Once the drive fills up and there is no room
    to save any more information in the log file, all work on the computer comes to
    a halt, forcing you to reboot the machine. Sometimes, rebooting does not seem
    to help since the log file can still be there once you reboot. Eliminating that
    file as soon as possible is critical.


    Monitor disk space availability.

    Even if you have a stable number of users and no problems with your system, you
    still need to monitor disk space availability. Just because you are not adding
    new users does not mean you are not going to use more space. As people work on
    the system, they save files to the hard drive. Even though the process is incremental
    and slow, you can run out of space additionally, sort of log as they operate,
    if you do not control the logging function to keep the files under a certain size,
    they can keep growing and eventually fill the drive or partition.


