  md: '# MAXIMIZE, MINIMIZE,

    AND CLOSE WINDOWS


    Whether you are working with a desktop window, a program window, or a Linux Terminal,
    three common buttons in each type have the identical purposes. These buttons are
    located at the upper right of each window and allow you to maximize, minimize,
    or close the window or Terminal.


    On the other hand, if you need more space on the desktop, minimizing a window
    is a convenient method to get the window out of the way without closing the program
    or Terminal. Closing a window is an easy way to terminate the program it was running
    or to prepare to log out of the Linux desktop environment. However, keep in mind
    that closing a window can end a program, and you lose any data that you have not
    saved.


    You may want to maximize a window to see as much of the window''s contents as
    possible.


    ![](img/2fa10bfc913512051e0929ab24933fc6_35_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_35_1.png)


    # MAXIMIZE, MINIMIZE, AND CLOSE WINDOWS


    +   1 Move your mouse pointer over the Maximize button and click to maximize a
    window.


    +   The Maximize button is the second of the three buttons in the upper-right
    corner. The button icon is a small square with a dark line across the top.


    +   The maximized window takes the entire screen.


    Note: The size of the pictures and the font of the print do not enlarge. Maximizing
    windows gives you more window space but does not proportionally increase the size
    of the icons or directories.'
