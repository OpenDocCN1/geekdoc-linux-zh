  md: '# WORK WITH DRIVES AND DISKS


    # Apply It


    Stick with iso9660 for your CD-ROM drive.

    The only other selection that enables a CD-ROM to run properly is the hpfis, or
    high performance file system, which is occasionally used on Linux and UNIX systems
    for installing programs. However, this setting is not recommended because it does
    not enable your CD-ROM to read CDs formatted for the PC. Due to CD-ROM standards
    over the last 10 years, 99 percent of them operate properly under the iso standard.
    Choosing a different system significantly increases the chances of running into
    a problem.


    Read CD-ROMs formatted for the Macintosh.

    Because the iso9660 setting is the industry standard, you can read Macintosh-formatted
    CD-ROMs. However, the Macintosh file system is different from Linux, you will
    not be able to copy files from the CD-ROM or run any programs from the CD-ROM.


    ![](img/2fa10bfc913512051e0929ab24933fc6_214_0.png)


