    an upgrade. If you have never run Red Hat on your computer, or if you want to
    completely overwrite an older version on the computer, keep the default setting
    of Install. Select Upgrade only if you are running Red Hat 6.0 or 6.1. Note that
    selecting Upgrade will not overwrite any


    existing files on your machine, while Install will generally overwrite your existing
    files. Be sure to back up any files you want to save.


