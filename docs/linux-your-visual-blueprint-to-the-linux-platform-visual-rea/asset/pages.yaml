  md: '# SET KEYBOARD AND MOUSE PROPERTIES


    You can also set your keyboard and mouse properties in the GNOME desktop to respond
    to your desires and natural reflexes.


    Setting up your keyboard and mouse to repeat strokes or clicks as necessary can
    save you a lot of frustration down the day. Without this ability, you might find
    yourself hammering repeatedly at the space bar or Enter to add lines or spaces
    to a large document, which is fatiguing to you and can prematurely wear out your
    keyboard.


    In GNOME, the speed that the mouse pointer moves across the screen is highly customizable.
    Some people prefer the mouse pointer move across the entire desktop with a flick
    of the wrist; others, such as graphic artists, prefer to have more control and
    accuracy with each mouse movement. You can even set the all-important mouse to
    be a left-handed versus right-handed one.


    ![](img/2fa10bfc913512051e0929ab24933fc6_178_0.png)


