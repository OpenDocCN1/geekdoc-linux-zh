  md: '# CHANGE DIRECTORIES

    IN THE LINUX TERMINAL


    Getting around in the Linux file structure is just as important when you are in
    the Terminal window as in the GNOME system. If you use a GUI-based lay of land,
    you need to practice moving around in the Terminal where you do not have the visual
    cues of icons and folders. This is especially worthwhile to learn if you are an
    administrator, as you will perform this task multiple times on any given day.


    To change directories in the Linux Terminal, use the cd command, which stands
    for change directory, command. Most Linux commands are case sensitive, and the
    cd command is no exception. If you want to go to the Files directory, but you
    type files after the cd command at the command prompt, you will not go anywhere
    or end up in the wrong location.


    ![](img/2fa10bfc913512051e0929ab24933fc6_139_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_139_1.png)


    +   - Open a Terminal window.

    - Type cd Files at the command prompt to change to the Files subdirectory under
    /root Home directory.

    - Press Enter.


    +   Note: The Files subdirectory is for illustration purposes and is not a Linux
    default.

    The username is the same because you are still logged in as root, but the new
    location is Files. The full path name, /root/Files, is not displayed.'
