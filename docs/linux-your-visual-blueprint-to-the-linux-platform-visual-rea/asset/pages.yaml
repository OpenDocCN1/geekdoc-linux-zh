  md: '# Extra


    # Linux knows your mouse type.


    If you have a three-button mouse, the system detects it and offers it as the default
    Mouse Configuration setting. On most two-button mice, Red Hat Linux lets you emulate
    this by pressing the left and right buttons at the same time.


    # How to tell partition holds your current operating system.


    The Linux installation process automatically detects all partitions. If you have
    MS-DOS, NetWare, or Windows on your machine, it shows up as its own partition.


    # Why you should select Automatic Partitioning.


    The Automatic partitioning allows Linux to detect the different divisions, or
    partitions, on your hard drive. This process allows Linux to remove any existing
    partitions and install itself as the operating system on your computer, or install
    itself on a separate partition.


    # How to decide whether to delete any existing partitions.


    You can delete existing partitions, but in the process you delete all information
    in that partition. If you want to continue running MS-DOS on your machine, for
    example, do not delete or edit that partition.


