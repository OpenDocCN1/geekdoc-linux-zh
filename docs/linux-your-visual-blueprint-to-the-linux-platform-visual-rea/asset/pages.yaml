  md: '# USING COMMAND AND

    INSERT MODE IN VI


    You switch between two modes while you work in the vi editor. One is the Command
    mode, which lets you move around within the document, change the format, delete
    text, quit, or save the document. You may not, however, add text in Command mode.


    By default, you are always in Command mode in vi, but have several ways to get
    into Insert mode. Only one option lets you switch back to Command mode, though:
    pressing the Esc key, also known as the Escape key. On most keyboards, the Esc
    key is set apart from the rest of the key rows in the upper left corner.


    The Insert mode works in the opposite manner. When you are in Insert mode, you
    cannot perform any of the fancier functions in vi, but you can enter text.


    # USING COMMAND AND INSERT MODE IN VI


    ![](img/2fa10bfc913512051e0929ab24933fc6_235_0.png)


