  md: '# WORK WITH THE LINUX FILE SYSTEM IN GNOME


    # Apply it


    Learn the difference between a program and a script.


    Multitask in Linux.


    A program is a product constructed or coded and sold with Linux or GNOME, usually
    for personal productivity, such as a word processing application. A script is
    a series of Linux or UNIX commands that are put together in a Linux file and made
    executable by giving it execute permissions. Unlike programs, scripts are normally
    used for system maintenance, such as checking for disk problems.


    The number of programs you can run at time in the Linux environment depends on
    how high-powered your Linux machine is. If you are running large programs like
    WordPerfect for Linux and Netscape, do not run more than two or three at the same
    time or your system will slow down noticeably.


    Launch a program while you run another in Linux.


