  md: '# UNDO AND REDO CHANGES


    You can reverse or replace a change that you have made to a gnotepad+ document
    by using the Undo and Redo menu commands. The Undo and Redo menu commands are
    simple to use and very important if you make a major mistake that threatens to
    wipe out a large amount of text.


    The Undo and Redo menu commands in gnotepad+ are sophisticated enough to offer,
    as with more mainstream word processors, multiple levels of undo and redo. You
    can even undo an action that occurred several keystrokes or commands ago.


    If you cannot remember the exact sequence of events, use the menu commands Undo
    All and Redo All. All the changes you have made are undone and you can start anew
    without searching for an older copy of the document. Of course, you should save
    your documents regularly to prevent such problems.


    ![](img/2fa10bfc913512051e0929ab24933fc6_269_0.png)


    # USE THE UNDO COMMAND


    +   Highlight a line of text.


    +   Cut the line from the document by clicking the Cut button on the toolbar.


    +   Click Undo on the Edit menu. Clicking the command once undo the last action.


    +   You need to select the command for each action that you want to undo.'
  merge: -1
