    +   1 Type Is | cat.

    2 Press Enter.


    While ls is by lists your files in rows, pipe funnels the information from ls
    to cat, allowing you to print the information in column form.


    The pipe command can only shift data to another command. For example, you cannot
    pipe the contents of one file, in this example it is getburg_final, to another,
    such as michaelangelo.


    You might expect this command to transfer the contents of the first file to the
    second, but pipe does not work with files, commands.


    +   4 Press Enter.

