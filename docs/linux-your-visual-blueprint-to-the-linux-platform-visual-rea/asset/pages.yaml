  md: '# SET UP LINUX USER ACCOUNTS AND GROUPS


    # Apply It


    Create and follow a consistent naming scheme for user accounts.


    Gain advantages with a consistent naming scheme.


    The first rule is to avoid duplication. The second rule is to maintain a consistent
    naming scheme on your system if you have more than a few users. For example, a
    common scheme is to use a combination of users'' first initial and last name,
    so John Smith''s account name would be smith. Never use any of the default account
    names such as lp or root, or generic names such as default or user02, and so on.


    If you have a consistent scheme, it is easier to recognize users on your system.
    For example, if you request a password change from jsmith, you may know who the
    person belongs to, and what his needs might be. A similar message from user THX1138
    gives you no clues.


