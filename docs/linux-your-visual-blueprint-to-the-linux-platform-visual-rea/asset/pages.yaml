  md: '# SET UP NETSCAPE FOR WEB BROWSING AND E-MAIL


    # Apply


    Attach a picture or file to an e-mail.


    Click the paper clip icon below and to the left of your recipient''s e-mail address
    is entered. A blank field appears to the right of the paper clip icon. Right-click
    in this field and select Attach File from the drop-down menu. Netscape takes you
    to a navigation screen where you can select the file to attach by clicking it.
    When you click the Send button, Netscape sends your message and the file you have
    attached.


    Attach large pictures or files.


    There is no limit to the size of a single file you attach to an e-mail message.
    However, even a single message of over 5MB can significantly slow down the machine
    for the time it takes to transmit it. Consider using a compression utility for
    large files to speed transmission.


    Attach multiple pictures or files.


    Although there is no limit to the number of images or other kinds of files you
    can attach to an e-mail message, messages greater than 5MB in length will slow
    down most Linux systems until Netscape completes the transmission.


