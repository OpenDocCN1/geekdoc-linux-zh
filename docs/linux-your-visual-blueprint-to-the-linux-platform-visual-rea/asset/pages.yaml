    Click Addition in the left frame of the Netscape Preferences dialog box.


    +   - Check to make sure that the default setting. Address books, is selected.


    # SET HOW NETSCAPE TREATS FORWARDED MESSAGES


    +   - Netscape lets you specify how you forward messages.

    - Click Messages in the left frame of the Netscape Preferences dialog box.

    - Click the arrow to the right of the As attachment and select your choice from
    the menu.


    +   - If you select Quoted or Inline, any message you forward shows up in the
