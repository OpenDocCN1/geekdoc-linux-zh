  md: '# DETERMINE YOUR CURRENT LOGIN


    Before you edit files or execute commands that could affect the entire Linux system,
    you first need to determine how you are logged in the system. This statement may
    sound absurd, but it brings an important issue in Linux.


    On some Linux systems, the prompt does not indicate a person''s login. Many systems
    have a blank prompt. The prompt, shown as a dollar sign, tells you that the Bourne-again
    shell is in use. There are no clues to the user identity.


    Although you are one person, you can log in under several different user accounts.
    For example, you may think you are logged in as a general user when you are actually
    in the root administrator account. Logged in as root, you can do serious damage
    to the Linux system and not realize until it is too late. Take steps to ensure
    a situation like this does not happen.


    To determine your current account identity, use the whoami command. You can also
    use the id command if you want more detail about the account. The id command displays
    more information about the account, including whether the account has root privileges.


    # DETERMINE YOUR CURRENT LOGIN


    ![](img/2fa10bfc913512051e0929ab24933fc6_149_0.png)


    # CHECK THE COMMAND PROMPT


    +   - By default in most Red Hat installations, the user account identity is listed
    as the first field left of the prompt.


    +   - This screen shows that you are logged in as root.


    ![](img/2fa10bfc913512051e0929ab24933fc6_149_1.png)


    +   - This screen shows that you are now logged in to the system as a different
    user.'
