  md: '# SET NETSCAPE FOR WEB BROWSING AND E-MAIL


    # Apply It


    Understand what happens to incoming mail if you run out of disk space.


    Make sure that large e-mails do not take up too much disk space.


    Incoming e-mail is stored on your hard drive until you delete it. However, if
    you run out of disk space to store the incoming e-mail, your system runs into
    difficulty. Whenever you runs out of space, it will not only cause slowdowns as
    well, if you have insufficient disk space to accept incoming messages, they are
    generally returned to the sender as undelirable.


    If you are on disk space, you can ensure that Netscape does not store messages
    that are over a certain length like 10K or 50K. Open Netscape. Click Preferences
    on the Edit drop-down menu, then click Mail & Newsgroups. Next, click Disk Space
    and type the maximum size message you want in the Do not store messages locally
    that are larger than.


    ![](img/2fa10bfc913512051e0929ab24933fc6_306_0.png)


