  md: '# # APPENDIX A


    # # THE RED HAT LINUX 6.2 INSTALLATION PROCESS (CONTINUED)


    You should take the time to set up the correct time zone for your Linux computer,
    set a reasonably secure root password, and enter any user accounts you want during
    the installation process. Because the importance of each of these areas, it is
    best not to skip this stage and plan to finish the job.


    In the interest of getting your users up and running as soon as the installation
    is complete, you should create as many user accounts as you need.


    Selecting the right time zone allows your machine to perform automated tasks such
    as disk auditing during off-hours, such as after midnight. Entering as many user
    accounts as you available is less crucial, but extremely easy to do at this point.


    Finally, your most important task is to pick a secure root password. Do not leave
    this blank or use a simple password such as root. If your system is not protected
    by a secure password, anyone can log in as the administrator and cause damage.
    Choose a password of at least six characters that is not easily determined by
    anyone but yourself.


