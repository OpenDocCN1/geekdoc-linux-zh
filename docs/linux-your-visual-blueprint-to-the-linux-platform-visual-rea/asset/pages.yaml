  md: '# CUSTOMIZE YOUR GNOME DESKTOP


    You can customize your GNOME desktop to match your own personal style or set the
    desktop with a color scheme that you find pleasing to your eyes. Part of working
    with a GUI-based system like GNOME is the ability to decorate your work area with
    colored patterns or pictures.


    The most commonly customized feature on the desktop is the desktop background.
    You can change the desktop background to a completely different color, or you
    can simply select a different shade of the same color for easier viewing. If you
    want to try something more complex, you can also grade the color to give your
    background a three-dimensional effect.


