    # EDITOR USER ACCOUNTS (CONTINUED)


    You can easily change a user password in LinuxConf. Just as you first created
    the account, you have a built-in safeguard that prevents you from entering a password
    with typographical errors. However, a key difference between changing a user account
    versus creating it is that users can also change their passwords at any time,
    unless you change the system''s permissions to prevent them from doing this. Root
    is the only account that can set a user''s password at creation time.


    Because users can set their passwords whenever they want, you only have to edit
    their passwords in special situations. The most common case is when you are having
    a security problem where someone is hacking, or gaining illegal access to, your
    system through a specific user account. If that user is on vacation or not it
    is up to you to make the password change.


