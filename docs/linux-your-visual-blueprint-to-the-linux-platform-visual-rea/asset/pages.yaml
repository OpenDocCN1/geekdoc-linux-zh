  md: '# Extra


    You can only use the PID to kill a process.

    The kill command works with process identification numbers only. You cannot kill
    a process by its name. Because more than one occurrence of a process may be running,
    if you killed the process by name, you would also kill processes that are functioning
    properly and currently in use.


    Similarly, you cannot kill a process using a username. By default, Linux runs
    several background processes, such as GNOME, that are necessary for you to work
    in the operating system. If you were able to kill processes by username, you would
    kill everything that particular user had running and terminate the person''s Linux
    session as.


    Nothing happens if you send a kill command for a process that is not running.

    The kill command is targeted at a specific PID. If a program with that PID happens
    to shut down and is no longer running by the time you send the kill, the signal
    has no effect.


    ![](img/2fa10bfc913512051e0929ab24933fc6_166_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_166_1.png)


    # KILL MULTIPLE PROCESSES WITH ONE KILL COMMAND


    +   This command kills four running vi processes, but ignores 2779.


    +   1 Type kill 2775 2776 2777


    +   3 Type ps -ef | grep vi to check the result.


    +   The screen displays the one remaining vi process, number 2779.


    +   2 Press Enter.


    +   4 Press Enter.'
