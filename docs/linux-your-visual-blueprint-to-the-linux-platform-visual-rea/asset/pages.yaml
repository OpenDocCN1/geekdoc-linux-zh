    +   1. Use the scroll bars in the frame to browse the Linux file system through
    GNOME.


    +   2. Click a directory.


    The tree view in the frame of the directory is closed, indicated by the +.


    Because the tree is closed, the subdirectories are listed in the right frame.


    +   3. Click the sign next to a directory name.


    +   The closed setting changes an open setting, marked with -.


    +   The tree frame lists the subdirectories in the opened directory.'
