  md: '# SEND AND RECEIVE E-MAIL

    IN NETSCAPE


    you can send and receive messages from your friends online once you have set up
    your browser to handle e-mail. You are then ready to enjoy the pleasant pastime
    of communicating electronically. Receiving mail in the Netscape Messenger utility
    is a simple task, requiring only a few clicks of the mouse.


    Netscape does not pull mail from the mail server every 10 to 15 minutes. Instead,
    you must click a button on the toolbar to get your messages. The disadvantage
    of this method is that you do not receive messages—and some of them may be urgent—until
    you check your mail queue.


    Unlike e-mail programs, Netscape on Linux does not actively check your mail. To
