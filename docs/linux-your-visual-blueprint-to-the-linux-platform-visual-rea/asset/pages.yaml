  md: '# FIND FILES IN THE

    LINUX TERMINAL


    You can locate files that you have misplaced or that seem to have vanished with
    the find command. The find command searches a given area of the system for the
    missing file.


    The find command is automatically recursive, meaning that it searches all the
    subdirectories under a given search point. For example, if you specify /var as
    the starting point for the search, find searches /var, /var/subdirectory, /var/sub/subdirectory,
    and so on.


    If you have a good idea where the file is located, begin your search in that directory.
    But you will not find a file under /var if the file is in the /etc directory tree.
    If you want to guarantee that you find the file, you can start your search at
    the root directory, /. If you are not sure of the filename, you can include a
    wildcard character—an asterisk—in your search parameters.


    You use this format to perform a find:


    ```

    find <search point> <command option>

    <filename>

    ```


    ![](img/2fa10bfc913512051e0929ab24933fc6_153_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_153_1.png)


    # FIND A FILE IN YOUR HOME DIRECTORY


    +   Type find, followed by a space, a period and then another space.


    +   Because you are searching in your current directory, you signify this with
    a single period preceded and followed by a space.


    # FIND A FILE IN A REMOTE DIRECTORY


    +   Type find /var -name michaelangelo to find the file michaelangelo in the /var
    directory.


    +   In this example, you use /var as the search starting point.


    # Type -name testcut.


    Note: Directory names, filenames, and contents are for illustration purposes and
    are not defaults included in your Linux installation.


    # Press Enter.


    +   The result shows that the file testcut exists in the local. /testcut directory.


    # Press Enter.


    +   Linux locates this file under /var/Sculptor. Sculptor is a subdirectory of
    /var.'
