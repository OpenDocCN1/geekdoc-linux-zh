  md: '# EXECUTE BASIC COMMANDS AND PERFORM TASKS IN THE TERMINAL


    # Apply It


    Be careful with your redirects.


    If you accidentally redirect information with the > < commands to a file containing
    data, you lose the original data in the file. Linux writes the new information
    you sent over the data that was already in the file. The redirect commands, unlike
    the remove command rm, do not come with any safeguards or warning messages that
    ask you to complete the task. For reason, never rush through a redirection task.


    Make sure you have write permission for the file.


    You cannot redirect information to a file if you do not have write permission
    for that file. If you do not have write permissions, you are not forbidden from
    using a text editor on the file, but you cannot edit it in any way. If you attempt
    to redirect information to a file that lacks write permissions, Linux does not
    carry out the task.


