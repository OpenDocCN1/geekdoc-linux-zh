  md: '# MEET THE LINUX OPERATING SYSTEM


    Linux is an operating system that Linux Torvalds created at the University of
    Helsinki in 1991 in response to the cost and high maintenance of the operating
    systems then available. Although Linux was designed to work quickly on even the
    most primitive computers, it is able to handle the networking needs of today''s
    user. Linux can connect multiple users and user groups with e-mail, networked
    printers, shared file systems, and Web access in a manner similar to the Microsoft
    operating system.


    Linux is an offshoot of UNIX, the basic operating system known for its stability,
    speed, and lack of a GUI, or graphic user interface.


    In addition, Linux is also an open source code operating system, meaning that
    users can modify the code to their specifications.


    Linux Torvalds decided to make Linux code freely available. This is why Linux
    is called a "freely distributed" operating system.


    # WORK WITH THE NEW GUI IN LINUX


    Linux comes from several different companies, such as Red Hat and Caldera. The
    CD-ROM set that comes with this book contains Red Hat Linux version 6.2, so the
    Red Hat Corporation provides the technical support and online documentation.


    As Linux has become more popular, it has adapted to the use of newer, user-friendly
    GUIs to perform most tasks. The two most popular GUIs that run with the Linux
    operating system are the K Desktop Environment, or KDE, and GNOME. This book focuses
    on the GNOME, pronounced Goo-NOME, desktop environment, because it is supported
    as the default GUI by one of the most popular releases of Linux, Red Hat 6.2.


    The latest development common to all recent versions of Linux is the use of a
    GUI. In short, the GUI is the desktop most computer users are seeing when they
    turn on their computers. Small images of user programs and files, called icons,
    sit on the desktop and allow users to access these files or programs by clicking
    them with the mouse pointer.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# INTRODUCTION


    # COMPARE LINUX TO WINDOWS


    traditionally, the main advantage of Linux is that it is much cheaper than other
    operating systems. This is still true; for example, you can download the entire
    Linux operating system free from many places on the Internet. In addition, Linux
    offers the following advantages:


    Linux is more flexible than Windows because the source code is open, which means
    that users can modify and correct the Linux code.


    +   - Linux can run on outdated machines as ancient as its cousins


    +   - When it comes to large-scale server architectures, Linux and its UNIX cousins
    are more reliable than the Microsoft operating system.


    +   - Therefore, if you want to develop your own scripts to automate administration
    tasks, you can. If your script is exceptionally efficient, your creation may become
    immortalized in future versions of Linux.


    # CUSTOMIZE YOUR LINUX ENVIRONMENT


    Linux has two areas that you can customize—the GUI desktop and the Linux environment
    itself. In the GUI, you have all the flexibility of the Microsoft Desktop Themes.
    You can customize your desktop background, edit your screen saver, and set system
    sounds.


    to find binaries or programs to execute. If you are logged into the administrator''s
    account, you can alter settings that affect all the users on your network, such
    as file permissions and account creation.


    In the Linux environment, you can set properties such as the path that Linux searches


    # ACCESS PROGRAMS ON THE GNOME DESKTOP


    The GNOME Desktop environment is one of the easiest to use in Linux, since it
    looks a lot like the Windows environment. In addition to opening windows to list
    icons, folders, and files, you can open Terminal windows.


    Terminal windows are direct links to the Linux environment that control the network,
    below the desktop and out of sight. If you are from a Windows background, you
    may think of this as opening a DOS prompt from the Start button.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# MEET THE LINUX OPERATING SYSTEM (CONTINUED)


    # USE THIS BOOK WITHOUT A LINUX GUI LIKE GNOME


    If you have inherited an older version of Linux that does not use a desktop environment,
    this book will still be of great value to you. While some tasks in Linux are more
    accessible with the desktop, some tasks still require knowledge of the terminal
    window and a text editor, such as the vi editor.


    You may also be using a version of Linux that has a GUI, but it is not GNOME.
    For example,


    the Mandrake release of Linux defaults to the KDE desktop. Again, this book will
    be of use to you. The basic concepts of window- and desktop-based environment
    are universal to all kinds of GUIs. For example, both KDE and GNOME allow you
    to open, close, and resize windows on the desktop in the same manner.


    # MANAGE USERS AND GROUPS IN LINUX


    Linux allows you to control the creation and removal of individual user accounts
    from the administrator''s account. In addition, you can set up user accounts with
    defaults files are created with specific default configurations, settings and
    properties. You can control when and where the user can access the network — a
    big plus in today''s security-conscious environment. You can


    even temporarily lock users out of their accounts if they go on vacation or leave
    the company.

    in Linux, you can also assign multiple groups for a user account. Whether checking,
    deleting, or merging groups, Linux allows you to add and remove users from group
    lists without worrying about redundant entries.


    # NETWORK IN LINUX


    Linux is an open operating system because of its ease in connecting to other machines.
    Entire suites of commands are available to both the administrator and the user
    for networking,


    such as copying files with rcp or ftp. Linux users also have the option of connecting
    to other machines and operating them remotely, via the telnet or login utilities.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# INTRODUCTION


    # SHARE SOFTWARE AND HARDWARE RESOURCES IN LINUX


    | Linux openness enables the efficient sharing of files and programs between machines
    using the Network File System utility. For example, instead of having to place
    a copy of a program on each machine, placing the program in a networked file system
    allows any machine to mount the file system and run the program from that central
    location. | Linux also excels in the ability to share hardware. If you are on
    a slow machine, you can run a program remotely, taking advantage of the faster
    machines on the network. This ability to farm out network tasks makes Linux a
    natural when it comes to printing documents on remote network printers. |


    # ACCESS E-MAIL AND THE WEB IN LINUX


    | Depending on which version of Linux you are running, you can choose from two
    or more different e-mail programs. The most popular of the Terminal-based mail
    programs is pine. Pine works without a GUI, which makes it extremely fast and
    stable when working with large documents. | The other main player in Linux e-mail
    is Netscape Messenger. Netscape Messenger is included in the Netscape Communicator
    Web suite. Communicator also includes Netscape Navigator, the popular web browser.
    You will find the use of a program that handles both your e-mail and your Web
    browsing tempting. |


    # HANDLE SECURITY ISSUES IN LINUX


    | Because Linux is open for sharing data, security issues may surface, Most security
