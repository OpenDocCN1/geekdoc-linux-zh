  md: '# STOP PROGRAMS THAT DO NOT RESPOND TO KILL


    Processes sometimes do not respond to the kill command, but you can use a command
    option to force the kill. Processes fail to respond when they are hung, meaning
    that they refuse to shut down. Refusal to shut down tends to happen on busy machines
    with dozens of different processes running, CPU time could be so limited that
    the process cannot complete its exit cycle.


    You still use the kill command, but pair it with a special command option: -9.
    The kill -9 command is equal to the Force Quit in the Microsoft Windows world.
    No matter where the program is — midcommand or nearing completion—the program
    terminates immediately. Linux may produce a core file when this occurs. If so,
    delete the file.


    # STOP PROGRAMS THAT DO NOT RESPOND TO KILL


    ![](img/2fa10bfc913512051e0929ab24933fc6_167_0.png)


