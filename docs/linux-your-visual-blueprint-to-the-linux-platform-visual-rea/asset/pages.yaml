  md: '# LINUX


    # # USING THE PIPE COMMAND


    You can transfer the output of one Linux command to another with the help of a
    UNIX shell utility pipe.


    Using Caps Lock does not produce a pipe. You must press Shift+Backslash.


    You do not type the letters pipe to use the utility. Instead, you type the pipe
    symbol. The character normally exists on the same key as the backslash, which
    is located above the Enter key. To type the pipe symbol, hold down the Shift key
    and press the backlash key.


    The pipe command is most often used with the ps, also known as process search,
    and cat commands. You learn about ps later in this chapter. The cat command displays
    the text in a file in column format.


