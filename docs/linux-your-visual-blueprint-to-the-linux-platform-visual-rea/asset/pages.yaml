  md: '# USING THE GNOME LINUXCONF TOOL


    linuxConf is the main tool you use to do of the administrative work in the GNOME
    GUI system. You use LinuxConf to create user accounts, edit system information,
    set up e-mail aliases, and perform other number of functions. If you are from
    the Windows world, this tool is the combined equivalent of the various management
    tools available on your Windows NT server.


    can view the settings you create and select in LinuxConf, only the root administrative
    account can actually make a permanent change in this administration tool.


    While useful, the LinuxConf tool can be initially confusing for many new administrators.
    Before jumping directly into user and group administration, I will go over the
    basics of how to navigate and use the LinuxConf tool.


    LinuxConf stands for—as you might guess—Linux Configuration. Although other users
    on the system


