  md: '# SHARE FILES AND DIRECTORIES


    You can share both files and directories in Linux so that some or all people on
    the system can easily access data. The Linux operating system, everything—graphic
    objects, directories, and text—is a file.


    You work with files and file systems constantly when you perform basic administrative
