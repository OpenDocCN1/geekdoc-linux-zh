  md: '# CHANGE THE ROOT PASSWORD

    LINUXCONF


    You can change the password for your administrative account, root, by using the
    utility. Changing password panel in the LinuxConf utility for this task is to
    work in the graphical environment of the GNOME desktop. Changing your root password
    increases the level of security on your Linux system.


    account''s password on a regular basis. If someone accidentally sees the password
    or is able to hack into it, that person gains administrative privileges.


    Whoever has the password will be able to delete any file on your system, change
    important network settings, or crash the entire machine. If you ever suspect that
    someone may have guessed or hacked your root account password, immediately change
    it to prevent these kinds of problems.


    You should encourage all of your users to periodically update their passwords.
    However, it is doubly important that you change the root


    ![](img/2fa10bfc913512051e0929ab24933fc6_69_0.png)


    +   1 Open LinuxConf.

    - The GNOME-Linuxconf window appears.

    2 Scroll down to Users accounts.


    +   3 Click root password under the Normal heading.


    +   4 Type your current password in the Password field.

    - Note that the password is displayed as a series of asterisks.


    +   5 Click Accept.


    +   The Changing password appears.'
