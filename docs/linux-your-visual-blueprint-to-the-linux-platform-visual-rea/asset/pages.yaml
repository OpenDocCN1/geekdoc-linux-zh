  md: '# ADD USER ACCOUNTS


    One of the most basic administrative functions in Linux is adding users, and if
    you work on a network with a few users, adding new ones will be one of your most
    common tasks. LinuxCont is designed to let you add new users easily.


    Note that there is no set ratio between users and user accounts. Because a user
    account is simply the way user logs into the Linux system, a single person can
    have one or multiple user accounts. However, a good practice is to grant only
    one account to each user. This practice limits possible security breaches from
    an illegally gained password because the user only has to keep track of one password
    instead of several.


    As the majority of the functions in the Linux configuration tool, the root user
    may add a new user account. However, after accounts are created, users may reconfigure
    them, unless the administrator decides to reserve all account edit functions for
    root administration.


    # ADD USER ACCOUNTS


    ![](img/2fa10bfc913512051e0929ab24933fc6_59_0.png)


