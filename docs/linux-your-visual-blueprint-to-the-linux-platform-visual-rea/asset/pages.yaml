  md: '# LINUX


    # COPY FILES WITH RCP


    You can use rcp, which stands for remote copy, to copy files and directories between
    Linux or UNIX machines on an intranet. The advantage of using rcp is that it is
    probably the fastest, most stable method of transferring small-to-medium-sized
    files across the network.


    When you are ready to perform a remote copy, be sure that you are in the directory
    where the file resides. In this example, if the file gnew were located in /Gnew2
    directory, you would first have to change directories to /Gnew2.


    On the other hand, the command syntax is tricky and the function is limited by
    the fact that it is restricted to Linux and UNIX machines. The rcp command is
    less of a standalone utility and more of a glorified command or extension of the
    UNIX command cp, or copy.


    However, when you recursively copy an entire directory, change directories so
    that you are one level above the directory you want to copy. The rationale behind
    this is that you cannot recursively copy a directory that you are in.


    ![](img/2fa10bfc913512051e0929ab24933fc6_281_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_281_1.png)


    # COPY FILES WITH RCP


    # COPY FILES


    +   1 Click the Terminal emulation to open the Linux Terminal.


    +   2 Type rcp gnew:localhost /etc/root_storage at the command prompt.


    +   3 Press Enter. Linux copies the file to the remote machine localhost.


    +   A remote is simply a different machine than the one you are logged into. The
    machine localhost could be in the next room or other location.


    # A DIRECTORY RECURSIVELY


    +   1 Type cd for two periods.


    +   2 This moves you the directory immediately above your current location.


    +   3 Type rcp -r Gnew2:localhost /etc/root_storage at the command prompt.


    +   4 Press Enter.


    268'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Apply It


    Copy files from remote machines without a password.


    The rcp command does not ask you for password authentication. When you are logged
    in to the remote machine, you can use rcp as much as you want.


    Understand why you may not be able to copy files from one machine to the other.


    Because rcp is such a simple command, not much can go wrong. If you are not allowed
    to copy files, the cause is most likely due to file permissions. Make sure you
    write permissions for both your target file and the directory you are copying.


    Handle an rcp refused message.


    You get an rcp refused message if you run into network problems. Stop your copying
    by pressing Ctrl+C, log out of the remote machine, and attempt to log back in.


    ![](img/2fa10bfc913512051e0929ab24933fc6_282_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_282_1.png)


    ```

    [root@localhost ~] rcp /etc/root_storage/gnew2

    gnew2 created

    [root@localhost ~]$

    ```


    System Reference

    rcp - remote file copy


    RCP(1)


    SYNOPSIS

    rcp [options] [host1]file1 [...file1...] [[host2]file2 [...file2...]]


    DESCRIPTION

    rcp copies files between machines. Each file or directory is specified by a file
    name (containing no characters like * or ? before any)


    > The -p option allows rcp to preserve (duplicate) the attributes of the files.
    By default the mode and owner of files are set to those of the user executing
    rcp. The file may be modified if the vanish(2) on the destination host is used.


