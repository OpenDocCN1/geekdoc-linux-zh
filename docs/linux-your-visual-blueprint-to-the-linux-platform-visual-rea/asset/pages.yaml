  md: '# SET UP LINUX USER ACCOUNTS AND GROUPS


    # Apply It


    Separate multiple users in a group with commas instead of colons.


    Linux interprets the colon in the /etc/groups file as a field delimiter, while
    a comma tells Linux that the text after the comma is part of a list. If you separate
    users with colons, Linux assumes it is supposed to ignore anything after the colon
    as not part of the same list or field.


    Clean out the /etc/groups file.


    If you delete a user account and forget to remove the account from the groups
    file, it does not affect your system negatively. However, you should take the
    time to clean out the /etc/groups file periodically so it does not get too cluttered
    with defunct user accounts.


