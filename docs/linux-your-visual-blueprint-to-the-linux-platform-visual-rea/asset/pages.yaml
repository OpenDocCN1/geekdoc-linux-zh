    this number for the command that creates the boot disk.


    +   7 Type mkbootdisk -device/dev/fd 2.2.14-5.0 at the prompt.

    If this command does not work properly, type the following at the command prompt
    and press Enter: /sbin/mkbootdisk -device/dev/fd 2.2.14-5.0.

    8 Press Enter.


    +   9 Press Enter to confirm.

    After the copying is completed, the command prompt returns.

    Label your disk Emergency Boot Disk.'
