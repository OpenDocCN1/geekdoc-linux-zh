  md: '# LIST USER ACCOUNTS


    You can use LinuxConf to easily view the entire list of user accounts on your
    system. LinuxConf lets you view the account listings in alphabetical order in
    a friendly, graphic mode. When you list accounts, you see every single account
    that has been created in your Linux system — not simply the user accounts that
    are currently logged in. Note also that a user account may or not have a person
    attached to it.


    For example, you may see the user account xfs in the xfs group, but xfs is simply
    the dummy account that the system uses when it accesses the X Font server. Whenever
