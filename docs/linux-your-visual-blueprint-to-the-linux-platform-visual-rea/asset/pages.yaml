  md: '# SET UP LINUX USER ACCOUNTS AND GROUPS


    # Apply It


    Verify your current user account login.

    If your version of Linux does not display your current user account at the command
    prompt, type whoami and press Enter. The whoami command displays your user login
    account. On the majority of Linux systems, when you are logged in as root, your
    prompt is the hash mark: #


    Prevent a user from reading a file that is readable and writable by everyone.

    Root has the power to disable or delete entire user accounts. By blocking or evicting
    a user from the system, root can prevent access.


    Access your user''s files if the permissions are set strictly to user-only reading
    and writing.

    Remember that root is the administrative account in Linux. Since this account
    must be able to access any file to administer the machine, user-set permissions
    do not prevent root from viewing or editing files.


    ![](img/2fa10bfc913512051e0929ab24933fc6_52_0.png)


