- img_proc: true
  md: '# SET UP LINUX USER ACCOUNTS AND GROUPS


    # Apply It


    Determine how often to change the root password.


    Select a good password.


    How often you change the root password depends on the security level you need
    to maintain your system. If you are the only person on your machine and you do
    not log into the Internet or store important files on your computer, you may never
    need to change the password. On the other hand, if you work at a computer lab
    that does important and sensitive research, consider changing it every three months.


    Choose a password that is at least six characters in length. Avoiding your name,
    birthdate, phone number, or a dictionary word people associate with you. It is
    best to mix numbers and letters to form a password that only you will understand
    and remember. Finally, keep in mind that Linux is a case-sensitive operating system.
    Using a capital letter anywhere other than the first character will add to the
    difficulty in guessing or cracking your password.


    ![](img/2fa10bfc913512051e0929ab24933fc6_70_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_70_1.png)


    6 Type the new password in the New UNIX password field.


    7 Click Accept.


    8 Retype the password in the Retype new UNIX password field to confirm.


    9 Click Accept when you are done.'
