  md: '# LINUX


    # # SHUT DOWN LINUX

    WITH THE GUI


    If you run Linux in an environment where multiple people access it over a network,
    you should shut down Linux only when you need to perform system maintenance, prevent
    an electrical outage, or upgrade hardware. Most upgrades and system maintenance
    are scheduled outages, meaning that you should plan to shut down Linux ahead of
    time to do these tasks.


    Ideally, notify people a few days in advance of your shutdown, particularly if
    the shutdown will last more than an hour or will require system testing afterwards.
    You should also notify them on the same day the shutdown takes place, since users
    are notorious for forgetting about pending shutdowns.


    To minimize disruption, notify users in advance that the Linux server will be
    shutting down and their work may be affected.


