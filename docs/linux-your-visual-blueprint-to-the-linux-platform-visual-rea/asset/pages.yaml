  md: '# ADD A LOCAL PRINTER


    You can maximize the speed of your print jobs by sending your documents to a local
    printer. A local printer is one that you connect directly to a specific machine.
    Although the name *local* implies that the printer only handles jobs generated
    from the computer it is attached to, that is not necessarily the case. A local
    printer can also be networked and receive print jobs from machines at all corners
    of the network.


    However, if you run Linux at home on a standalone system you will definitely work
    with local printers. Because you do not have a network in place—except perhaps
    one or two machines you have linked together—the Print System Manager are all
    local ones.


    People who most work with local printers are those in small, single-office networks
    with only a few users.


    ![](img/2fa10bfc913512051e0929ab24933fc6_287_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_287_1.png)


