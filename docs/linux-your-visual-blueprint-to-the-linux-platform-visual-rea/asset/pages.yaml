    Before installing any of the programs on the discs, make sure a newer version
    of the program is not already installed on your computer. For information on installing
    different versions of the same program, contact the program''s manufacturer.


    # SYSTEM REQUIREMENTS


    Your computer should be equipped with the following hardware hardware to use the
    contents of the CD-ROM discs:


