    a prankster as a hacker as an open terminal with access to the user''s private
    files.


    program is called killing the program. The term killing refers to the process
    of sending a signal to a running program and ordering it to expire, or die, in
    an orderly manner.


    Sometimes a program refuses to die, so you also need to know some techniques to
    kill it. While kill is a literal command you can use in the Linux terminal, GNOME
    gives you other techniques for shutting down a program to die.


