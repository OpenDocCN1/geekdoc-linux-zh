    # COPY A FILE TO THE FTP SERVER


    +   2 Press Enter.

    The file downloads from the server to your computer.

    2 The command prompt returns when the download is finished.


    +   1 Type put myfile at the ftp command prompt.

    2 This command puts the myfile on the server.'
