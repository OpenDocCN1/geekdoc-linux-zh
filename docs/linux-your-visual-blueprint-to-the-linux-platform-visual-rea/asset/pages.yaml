  md: '# # ADD USER ACCOUNTS IN THE LINUX TERMINAL


    You can also add new user accounts without using the LinuxConf utility, and knowing
    how to perform the account creation task without benefit of the LinuxConf utility
    is a useful skill. Although using LinuxConf is slightly easier, especially if
    you are familiar with the Windows environment, you can perform the same tasks
    in the Linux Terminal and often save some time in the process.


    environment and the Linux Terminal. You can accomplish all your work in the Terminal
    and save yourself some mouse and keystroke labor.


    The Linux command to add new user accounts is useradd. The useradd command has
    the same default settings for account setup as LinuxConf, such as starting new
    accounts in the bash. If you want to change any of the defaults, the easiest method
    is to create the user account with useradd in Terminal and then edit the account
    later with LinuxConf.


    For example, if you are working in the Linux Terminal, you do not have to switch
    between the GNOME GUI


    ![](img/2fa10bfc913512051e0929ab24933fc6_71_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_71_1.png)


    # ## CREATE A USER ACCOUNT IN LINUX TERMINAL


    +   - You must be logged in as root to add a user.


    +   - Click the Terminal Emulator button to open a Terminal window.


    +   - The Linux Terminal window appears.


    +   - Type useradd ragnar.


    +   - Press Enter.


    # ## SET THE PASSWORD


    +   - Type passwd ragnar.


    +   - Press Enter.


    +   - Type the password for the user.


    Note: For security purposes, the password does not display on-screen.


    +   - Press Enter.'
