  md: '# COPY AND PRINT FILES


    # Apply It


    Understand the function of printcap.


    Forget about the print jobs queued on a deleted printer.


    Do not be confused by the reference to the printcap file on the Linux message
    if you are sure you want to delete a printer. The printcap is a Linux file that
    serves the same purpose as the Print System Manager. In effect, the Print System
    Manager is a graphical front end that lets you edit your file without having to
    use the vi editor.


    When you delete a printer through the control-panel, its print queue is deleted
    as well. All print jobs stored in that queue are permanently deleted. If you physically
    remove the printer, the print jobs remain in the queue.


    Watch your system logs.


    Linux is quirky about print jobs stacked up on a broken or nonexistent printer.
    Most often, Linux automatically deletes these jobs. However, sometimes the system
    does not delete or reassign them to another machine. If your system logs indicate
    a loss of disk space for no discernible reason, check your print queues to ensure
    that nothing is getting back up.


