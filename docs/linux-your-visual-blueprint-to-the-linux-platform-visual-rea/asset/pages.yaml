  md: '# Apply It


    Call the exclamation point bang in Linux.

    The short answer for why the exclamation point is called a bang that it is traditional.
    Also, bang is easier to say than exclamation point and it helps prevent confusion.
    Similarly, Linux has another name for the pound sign, #. It is a hash mark to
    differentiate it from the symbol for pound. If used in your text, it would cause
    no end of confusion.


    Order the commands properly.

    If you type : instead of :, you are instructing Linux to quit and then save. Because
    this sequence does not make any sense, qui complains that is not a command it
    recognizes, forcing you to retype :wq correctly.


    Understand restrictions on a forced save.

    There are two reasons why you might not be able to save changes to a file, even
    when you use a forced write. First, even a forced write cannot work on a file
    that does not write permission. Second, you might not be the owner of the file.


