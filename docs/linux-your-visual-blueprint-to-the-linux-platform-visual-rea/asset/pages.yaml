  md: '# WORK WITH THE LINUX FILE SYSTEM IN GNOME


    # Extra


    Using spaces, hyphens, colons, or slashes in your filenames.


    GNOME does not prevent you from using any particular characters in your filenames.
    However, naming files with slashes or colons can cause confusion when you work
    with files, especially in the Linux Terminal window.


    Changing the extensions on a file.

    You can change a file''s extensions, but the file will most likely become unusable.
    For example, changing a graphics file bubbles.bmp to bubbles.txt will not create
    a document. If you opened the renamed file in a word processor, it will likely
    look like a mass of undefined characters.


    # Renaming directories.


    Renaming directories does not impact files inside the directories. However, be
    careful about renaming directories that came preinstalled with your Linux machine.
    Certain programs may look for those directory names so they know how to run or
    where to store log files.


