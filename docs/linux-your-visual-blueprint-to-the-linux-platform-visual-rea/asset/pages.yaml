  md: '# LINUX


    # # START THE VI EDITOR


    You can use the vi editor for everything from creating text documents to writing
    scripts, editing files, and searching through log files with more detail than
    you can with the `grep` command. To many users, vi is the most important utility
    in the Linux world.


    Other text editors are available for Linux, such as emacs, Ex, and the GNOME-based
    WordPerfect program. Only vi, however, automatically comes with all Linux installations
    and is universally popular with users and administrators.


    Because vi is not graphics-based like today''s word processors, it can be more
    challenging to use than many other text-processing programs. On the other hand,
    vi is so incredibly flexible and powerful that whole books are dedicated to its
    quirks and hidden commands. This book covers the most important and useful vi
    commands.


    ![](img/2fa10bfc913512051e0929ab24933fc6_231_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_231_1.png)


    # START THE VI EDITOR


    # CREATE A NEW DOCUMENT


    +   1 Open a Terminal window.


    +   2 Type vi at the command prompt.


    +   3 Press Enter.


    +   Red Hat Linux 6.2 comes with vim, a new form of vi. When you begin typing,
    this Intro screen disappears.


    218'
