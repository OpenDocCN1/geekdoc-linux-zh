  md: '# STOP PROGRAMS WITH KILL


    You can stop any program in Linux with the kill command, which sends a signal
    to terminate a specific program if that program is currently running. By default,
    kill instructs the program to initiate and complete its exit procedure and then
    stop.


    This default prevents the program from crashing and leaving behind a core file.
    If you are from the Windows world, having the program complete its exit procedure
    is the equivalent of allowing the computer to perform


    its shutdown procedure rather than abruptly switching off the power.


    You only want to use the kill command when a program hangs or refuses to exit.
    A program hangs in Linux if it malfunctions or is waiting for to be relayed via
    a pipe command or a secondary process. The appropriate format for kill is


    ```

    kill <PIDnumber>

    ```


    ![](img/2fa10bfc913512051e0929ab24933fc6_165_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_165_1.png)


    # KILL A VI PROCESS


    +   1 Type ps -ef | grep vi.


    +   2 Press Enter.


    +   The information you need, PID 2775, is in the second column.


    +   5 Type ps -ef | grep vi again to double-check the results.


    +   3 kill 2775 to kill the vi process.


    +   6 Press Enter.


    +   The vi process is gone.'
  merge: -1
