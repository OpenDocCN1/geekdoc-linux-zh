    Web and displaying the Page with the requested information.


    If you don''t want to wait for a connection or you don''t have access to the world
    outside your Linux network, excellent documentation exists local to the machine
    as well. The Gnome Help Browser is a GUI-based documentation system that works
    with a Web-style interface.


    The Gnome Help Browser contains hyperlinks that lead you to either Red Hat documentation
    or GNOME desktop documentation. A hyperlink is a line of text that takes you to
    the documents described if you click it.


    The Gnome Help Browser is especially useful in that it covers GNOME-specific and
    Red Hat-specific topics. Whether you need to find out how to configure an obscure
