  md: '# SET UP LINUX USER ACCOUNTS AND GROUPS


    # Apply It


    Do not delete system groups.


    Even though you do not see any users in groups such as tty, ftp, and nobody, you
    should never delete these groups. Linux automatically created all of these groups
    during installation. While they may not have any members listed, they perform
    the same functions as system accounts in the /etc/passwd file—they help your Linux
    system perform routine, automated system maintenance.


    Do not merge groups by giving them the same group identification number.


    Even though it seems like a good idea to merge two groups by simply giving them
    the same group identification number, this is not a good practice. Giving two
    groups the same GID does fool the Linux system into thinking that the groups are
    one. Instead, you are likely to confuse the operating system so that it ignores
    the users listed in both of the groups.


