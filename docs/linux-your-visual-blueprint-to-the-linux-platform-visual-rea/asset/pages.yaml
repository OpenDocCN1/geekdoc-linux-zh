  md: '# OPEN PINE MAIL


    Pine is the name of an e-mail program that works in the Linux Terminal. You can
    use it as an alternative to Netscape Messenger if you want to keep your Web browsing
    program and your e-mail program separate. Pine predates Netscape''s program, and
    does not use a GUI of any sort. You type commands and press keys, but you do not
    use your mouse to work any part of pine mail.


    So what is the advantage of choosing pine as your e-mail program? It is native
    to Linux, making it much more stable than Netscape mail. It is also faster, on
    average, than Netscape mail because it has no graphics to display. One potential
    drawback is that you may have problems receiving graphics as e-mail attachments
    in pine mail, so if you often receive .jpeg or .bmp files, you may want to use
    Netscape Messenger instead.


    ![](img/2fa10bfc913512051e0929ab24933fc6_309_0.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_309_1.png)


    # OPEN PINE MAIL


    +   1 Open a Terminal window. Pine only starts in the Linux Terminal.


    +   2 Type pine at the command prompt.


    +   3 Press Enter.


    +   The first time you start pine, you receive a welcome message.


    +   4 Press E to exit the greeting screen.'
