    # DISABLE AN ACCOUNT


    +   Move the cursor to the second field in kiko''s account row.


    +   The fields in the /etc/passwd file are separated by columns.


    +   Delete the x in the field.


    +   Insert an asterisk in its place.


    Note. The password field for all accounts contains an x.


    +   Press i to switch to insert mode.


    ![](img/2fa10bfc913512051e0929ab24933fc6_76_2.png)


    ![](img/2fa10bfc913512051e0929ab24933fc6_76_3.png)


