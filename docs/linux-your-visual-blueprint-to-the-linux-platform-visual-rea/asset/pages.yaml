  md: '# LINUX


    # RECEIVE E-MAIL IN PINE


    You can receive and store mail in the location of your choice when you work in
    pine. You can also delete e-mail that you longer want or need, and gives you the
    opportunity to change your mind about deletions.


    pine does not remove mail you have selected to delete until you actually exit
    the program. Even at that point, the application asks for confirmation.


    Pine has its own conventions for receiving and deleting e-mail. Pine works with
    a notification program called beep, which beeps whenever mail comes in. You also
    see a message at the base of the screen telling you a message has arrived. When
    it comes to deleting mail,


    However, use the Recycle Bin option in Microsoft Windows, once you confirm a message
    deleted, it is no longer retractable. If you receive a high volume of important
