  md: '# DELETE FILES AND DIRECTORIES


    You should make a habit of deleting files and directories that you no longer need
    or use and those that are produced by system processes. For example, the core
    file is produced when a GNOME or Linux process dies. Ordinarily, these files are
    very large and do not serve a purpose for the typical user or administrator. You
    should be familiar with how to delete them.


    GNOME does this because there is no Trash Can or Recycle Bin in Linux: Once you
    delete a file, it is gone forever.


    Linux also offers another safeguard when it comes to deleting directories. If
    files are inside the directory, GNOME asks you to delete all the files inside
    the directory as well. If you want to keep any files inside the directory, first
    move or copy them elsewhere.


    When you delete a file or directory, GNOME asks you if you are sure you delete
    it.


