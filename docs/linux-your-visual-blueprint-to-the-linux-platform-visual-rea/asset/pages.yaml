    Unlike Microsoft Windows where you can pop CDs in and out, in Linux, you always
    need to unmount the CD-ROM drive before removing the CD. In the Linux Terminal,
    type `/mnt/cdrom` and press Enter. If you do not unmount the CD, you confuse the
    operating system and could affect its ability to recognize a CD mount later.


