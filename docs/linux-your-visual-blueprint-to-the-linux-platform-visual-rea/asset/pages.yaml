  md: '# Apply It


    # Troubleshoot an auto-detection failure.


    If Linux does not detect your printer automatically, try these troubleshooting
    suggestions:


    +   1 Check the printer cables. One end or the other may be loose.


    +   2 If that does not work, restart the computer.


    +   3 If your printer is not listed, try replacing the printer cables. Restart
    and try again.


    +   4 Finally, check the printer on another machine to isolate the problem. You
    could have a 100-percent Linux machine but a malfunctioning printer.


    # Understand the auto-detection screen.


    Even if Linux does not display the auto-detection screen, there is a good possibility
    that nothing has gone wrong with your installation; because Linux not automatically
    detect the printer does not necessarily mean trouble. Also, you may be using a
    serial printer that connects via your machine''s serial port as opposed to the
    parallel port, or you may be using Sparc or Alpha architectures.


