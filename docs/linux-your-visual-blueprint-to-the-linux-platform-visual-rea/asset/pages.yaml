  md: '# ADD TEXT (CONTINUED)


    You have another option for inserting text into a document with the vi editor.
    Instead of pressing the letter i in Command mode, you can press the letter a.


    As its name suggests, the append command is most useful when you are working with
    existing documents. Preexisting documents normally contain a substantial amount
    of text already. Moving the cursor to the end of a line in a final paragraph of
    a document and using the append command guarantees that you do not accidentally
    insert new words in the middle of existing text.


    A command stands for append. The append command works exactly like insert in that
    that it takes you directly into the vi Insert mode. However, unlike the insert
