  md: '# GET TO KNOW THE LINUX DESKTOP ENVIRONMENT


    # Extra


    When to use the Halt command and the Reboot command.


    Because Reboot does not turn off the power to the system, use Reboot when you
    want to test changes you have made to the Linux system. Halt actually powers down
    your system, so it is best to halt Unix when you plan to touch the hardware inside
    the machine. Note that to prevent electric shock, you should halt the Linux system
    and physically unplug the machine from the wall socket.


    What to do during a power outage if you have a single, non-networked Linux machine.


    Since you cannot perform a standard shutdown with the loss of power, simply press
    the power switches to switch off your machine. Although this does not help recover
    data or restore your machine, it can prevent a blown fuse when your power is restored,
    especially if you have a large number of electrical appliances hooked up to your
    household sockets.


    What to do if your network is accidentally shut off in a power outage.


    Turn off all the Linux machines on your network. Since you cannot perform a standard
    shutdown with the loss of power, simply press the power switches for each individual
    machine. This is important, because it prevents blowing a fuse when the electricity
    is restored. When the power is restored, turn your Linux machines on at a time
    to gently bring power usage to what it was before.


    ![](img/2fa10bfc913512051e0929ab24933fc6_28_0.png)


