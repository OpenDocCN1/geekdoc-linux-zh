  md: '# Extra


    What you should do if a computer running Windows does not recognize your Linux
    disk.


    What you should do if your own machine refuses to read your floppy disk.


    Disks storing Linux and PC information work equally well on both systems. Only
    the file format and the types of files stored cause problems. If your PC does
    not recognize the Linux disk and asks you to format it, do not proceed unless
    you can afford to lose the data on the disk. Instead, try a different floppy to
    see if the PC drive is faulty.


    Floppy disks are more prone to failure than hard disks. The new 3.5-inch disks
    are much tougher than the older, 5.25-inch disks, floppies can still be demagnetized,
    melted in a hot car, or rendered inoper by scratches or dust. If yours refuses
    to work, check the disk for physical damage and try reading it on another machine.
    If the disk is unusable, throw it away and make a new one.


