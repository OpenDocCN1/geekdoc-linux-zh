  md: '# TURN WINDOWS INTO ICONS AND BARS


    By turning a window into an icon on the GNOME toolbar or shrinking the window
    to the size of its title bar, you can increase the space on your desktop while
    leaving multiple windows open.


    Iconifying the window is simply another process of minimizing for saving space
    on the desktop and allowing for easy retrieval. Shrinking the window to the title
    bar is much like rolling up a curtain.


    When you want to restore the window, you can roll it back down again.


    Shinking and restoring a window does not affect the information or application
    in the window. For example, if you are running a word processing application in
    an iconified window, the program continues to run until you actually close the
    window. The text is not altered or reformatted by the change in the window''s
    shape or status.


    ![](img/2fa10bfc913512051e0929ab24933fc6_39_0.png)


    # CREATE AN ICON


    +   **1** Click the option box in the upper-left corner of the window.


    +   **2** Select Iconify from the drop-down menu.


    +   **3** The window changes into an icon on the GNOME toolbar at the bottom of
    the screen.


    +   **4** Click the icon to restore the window.'
  merge: -1
