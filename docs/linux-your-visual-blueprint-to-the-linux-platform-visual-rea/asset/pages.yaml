  md: '# COPY AND MOVE FILES

    OR DIRECTORIES


    When you copy a file, you create an exact duplicate of the file in a new location.
    When you move a file, you create a duplicate of the file in a new location, but
    delete the original copy in the original location.


    Copying and moving files are some of the most important actions in Linux. By learning
    how to properly move or copy files, you can make files more readily backup to
    other users, and can make backup copies of important files to prevent a disaster
    if the system crashes.


    An important concept when copying directories is recursiveness. To copy a directory
    recursively means to copy the directory and all of the files inside of it. When
    you use the click-and-drag method of copying a directory, the directory is automatically
    copied recursively.


    For this example, you can move a file from the /root directory to the Files directory.


