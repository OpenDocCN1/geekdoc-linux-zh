  md: '# SET UP LINUX USER ACCOUNTS AND GROUPS


    # Apply It


    Reactivate an account.


    To reactivate an account, open the /etc/passwd file in the vi editor. Move the
    cursor to the password field and remove the asterisk. Do not type anything in
    its place. Exit and save your changes in the vi editor. Immediately have the user
    log in and enter a new password.


    Do not type the new password into the /etc/passwd file.


    Linux stores passwords not as characters of the alphabet, but as code. The passwd
    command is the only way that Linux can properly translate your password into that
    code.


    Make sure the user enters a new password immediately.


    Removing the asterisk in the password field leaves two colons side by side. To
    Linux, this means the field is empty, so no one needs a password for account to
    log into your system. This is a significant security hazard.


    ![](img/2fa10bfc913512051e0929ab24933fc6_76_0.png)


