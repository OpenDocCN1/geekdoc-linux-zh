    \    }\n}\n```\n\nDjango Suit 是你管理页面一个极佳且高度可配置的主题。\n\n## 教程：AWS 上的 NGINX\n\n###\
    \ 使用 AWS 上的 NGINX 为你的网站加速\n\n世界上访问最频繁的一些网站中，有 1,000 个运行在 NGINX 上。网页访问者并不喜欢每次点击或触摸时等待页面加载。如果你想降低跳出率，就给他们网站中渴望的：速度，然后是更多的速度。没有高性能\
    \ Web 服务器，任何 Web 运动项目都无济于事。\n\n在基准测试中，NGINX 可以碾压竞争对手。它提供的请求数是其最快竞争对手（Lighttpd）的两倍，是整个市场领导者（Apache）的八倍。它具有一种符合互联网标准的“安全性”；NGINX\
    \ 的设计考虑了易于配置和健壮的安全。它小的内存占用使其能够运行在任何预算有限的 AWS EC2 Linux 实例上（每年 1500 美元，但开源是免费的，而且对于大多数人来说，它几乎）一样好）。\n\
    \n#### 01 登录 AWS 管理控制台\n\nAWS 账户所有者可以 AWS root 身份登录，root 是所有基础设施服务（而非单个服务器实例）的超级用户。如果听我们的话，你应该只登录\
    \ AWS root 账户，创建一个 IAM 用户，并配合 MFA 令牌生成器（例如智能手机上的应用）进行多因素身份验证，而不是像组织中的其他人那样。\n\n\
    登录你的 AWS root 账户时，在 Web 浏览器中导航至：\n\nhttp://aws.amazon.com/\n\n... 并使用你的电子邮件地址。作为\
    \ IAM 用户登录时，转到特定特定的登录页面并输入你的 IAM 用户名和密码。\n\n![](img/78fc0912c436c898922acde3c325ec7a_27_0.png)\n\
    \nFelipe Martins & Anna Kobylinsa 在两年前成立旨在构建和扩展企业 IT，设计云解决方案并优化 AWS 上的 NGINX。\n\
    \n![](img/78fc0912c436c898922acde3c325ec7a_27_1.png)\n\n### 资源\nAWS root 账户\n\n\
    在设置和运行网站时，AWS 提供了多种服务选择。URL 看起来如下：\n\n```\nhttps://AWS-account-ID.signin.amazon.com/console\n\
    ```\n\n在示例 URL 中，将 AWS-account-ID 替换为你的 AWS 账户数字。或者，你可以在 AWS 管理控制台的 IAM 仪表中获取\
    \ ID 并创建一个易记的别名。\n\n## 启动 EC2 实例\n\n除非你熟悉竞价实例（spot instances）的特性（例如亚马逊经常执行的无通知关机），否则最好的选择是按需请求（on-demand\
    \ request），它确保了你的卷有保障（竞价实例会停机），并将收取你预留计算资源的费用（某些类型实例的折扣）。在 AWS 管理控制台中，导航到 EC2\
    \ Instances 部分并点击 Launch（启动）。选择你喜欢的 AMI，它将使用 `ami-1eca77gg`、来自 RHEL/CentOS 族的\
    \ Linux 或从 Purpose 类别中选择实例类型。选择实例类型是棘手的的；你需要考虑符合你用例的特征。EC2 价格位于：\n\n![](img/78fc0912c436c898922acde3c325ec7a_28_0.png)\n\
    \nhttp://amazon.com/ec2/pricing/#reserved-instances\n\n可以给你提供计算资源开支的详细历史，但请记住：你保留的卷以及你使用但未释放的\
    \ IP——其他一切都会让你的钱包缩水。一些旧账户还使用了 EC2 Classic 环境；如果你看到它，请远离它。为你的 Web 服务器使用 VPC，最好配合\
    \ VPC 仪表板工作。\n\n关于如何管理数据和存储的额外提示，请参考教程：AWS 云中的 Linux。为了连接到 NGINX，你必须在你的 EC2 实例的安全组中为客户请求开放\
    \ 80 (HTTP) 和 443 (HTTPS) 端口，以便 NGINX 能够正常工作。设置好你的密钥对并启动实例。\n\n## 分配 IP 地址\n\n\
    为你的 NGINX 实例分配 IP 地址。这让你能够在无需停止的情况下终止甚至关闭你的 DNS 配置。对于你的实例，NGINX 需要一个弹性 IP（EIP）。为了获取它，导航到\
    \ EC2 控制台中的 Elastic IP 并点击 Allocate Address（分配地址）。在后续选择相应的 VPC 并配置。这是你 AWS 账户的\
    \ IP 地址。为了将其链接到 NGINX 实例，点击 Associate（关联）。从搜索框中选择你的实例或网络接口并确认。\n\n## 没有 Apache？\n\
    \n在过去的几年里，虚拟化、容器和分类对 Web 服务器提出了需求。Apache 已经过时了。在此期间，程序员发明了 NGINX 作为替代方案。\n\n##\
    \ 04 注册域名\n\n通常情况下，你的服务器通过域名而非 IP 地址接收请求。为了正确设置，你需要注册一个全限定域名。除非你追求奇特的顶级域名（例如非常有盛名的名称），否则你可以选择\
    \ Amazon Route 53 提供的域名。\n\n转到你项目的页眉（在 Route 53 控制台中），选择一个域名，填写详情，完成支付，该域名就归你了。\n\
    \n你需要一些 DNS 服务器将流量引导到你的 Linux 实例。你能获得的最佳优惠之一是 Route 53 提供的 Hosted Zones 服务（选择\
    \ Hosted Zones）。\n\n## 05. 配置\n\n在 Route 53 的 AWS 管理控制台中进入 Hosted Zones 部分为你的域名创建一个新的托管区域。设置一个新域名。例如，你需要创建一个指向\
    \ Linux 实例 IP 地址的记录类型，以及指向 A 记录的 CNAME 记录。在每种情况下，选择 Not Alias（非别名）选项，设置 Alias（别名）并保持\
    \ TTL 值不变。所有这些看起来很复杂，但一旦你知道如何做，它其实很简单。\n\n结果如下：\n\n```\nmydomain.co.uk A 56.728.123\
    \ 300\nwww.mydomain.co.uk CNAME mydomain.\nco.uk 380\n```\n\n(56.728.123) 是你第\
    \ 3 步中的 EIP。\n\n> 你可以在 Web 浏览器 www.mydomain.com 对你的域名运行诊断。\n\n"
