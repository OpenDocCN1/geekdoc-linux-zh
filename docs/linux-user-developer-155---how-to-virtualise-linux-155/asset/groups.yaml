    # Feature


    ## Build your own automated system


    Discover how to remotely switch sockets, your garage door, a strip of LED lights
    and more


    ## Remote control sockets


    We are going to use a 433MHz receiver and transmitter module; these can be found
    for a couple of pounds on ebay - simply search for “433MHz” and you''ll find what
    you''re looking for remote control sockets. We used a pack of four remote control
    sockets for this project. The sockets are ideal for items such as floor-standing
    lamps, and anything else without an on/off switch. In our experience, it has worked
    perfectly for the time we have used it.


    You can use the 433MHz receiver and a simple piece of Arduino software to capture
    the message from the remote so you can trigger it. These modules have very simple
    wiring: 5V, Ground and Data. The receiver has two pins for the data line but you
    only need to connect to ground. The beauty of remote control codes is that it
    can be used for anything you like at 433MHz - remote control garage doors or light
    switches are likely to use 433MHz.


    ## LED strips


    LED strips are great. They are very easy to find on Amazon and cost about £15
    for a length of five metres with a 12V power supply and remote. They have adhesive
    on the back so they can be stuck to a surface. They give off a lot of light. Alternatively,
    you can have an individual red green and blue colour component. These colours
    can be set to any brightness between 0 and 100% using pulse width modulation.
    Each colour is a square wave that has a certain amount of time. If the Red signal
    had a 50% duty cycle then it would be on 50% of the time, resulting in reduced
    brightness. The strip has four connectors for red green and blue. The colour connectors
    are the pins for each. When the pin for colour is connected to ground, the circuit
    is completed, allowing 12V to flow through the LED. We will use a separate transistor
    for each colour. Note that the Arduino and power supply should be connected together
    on breadboard. The 12V three separate colours used for RGB strip. We have wired
    manually to the LEDs.


    (img/78fc0912c436c89922acde325ec7a_51_0)

    (img/78fc0912c436c89922acde325ec7a_51_1)


    ## Home automation


    supply for the LEDs should not connect to the Arduino - to the LED strip or the
    Arduino will get damaged. We used TIP120 NPN transistor, which is capable of switching
    5 amps - this is plenty for our application (the power supply with the strip only
    requires 2 amps). This transistor would also be good for controlling the speed
    of fan or other motors. We connected the TIP120 Base and Emitter from left to
    right, the base is connected to PWM signal from the Arduino via 220-ohm resistor.
    The collector is connected to one of the colour pins of the LED strip, and we
    used solid wire from emitter-to-collector When passing high amounts of current,
    these strips also get hot. Also used solid wire from emitter-to-ground and collector-to-LED
    jumper wires. You must ensure that none of the wires connected to the strip share
    otherwise you could damage LEDs. Our setup could involve moving the circuit onto
    breadboard so we have tested that it works.


    ## hardware


    A more involved option for home automation could be remote control curtains or
    blinds. These are excellent options because you can use them to wake up and have
    them close when the sun goes down. These devices are likely to use the same 433MHz
    frequency that the remote control uses so you could add them to the software we''re
    going to write without much effort. If you want to turn them on you could write
    your own Python script that sends the open and close commands to the blinds.


    ## Temperature sensor


    The TMP36 is a very simple IC, it has three pins: 5V supply, ground and output-V
    to represent temperature. This variable voltage can be read from the analogue
    pins of Arduino. The formula is: Temp in C = [(V in mV) - 500] / 10, so a voltage
    of 0.7V will be 20°C.


    ## Camera


    You can use either USB webcam or Raspberry Pi camera for video stream. The Raspberry
    Pi camera should be connected with the blue plastic connector and the exposed
    traces of the ribbon cable facing towards the HDMI connector.


    (img/78fc0912c436c89922acde325ec7a_52_0)


    Top The Raspberry Pi camera plugs directly into the Raspberry Pi itself not requiring
    extra wiring. Below The temperature sensor is very simply wired up, connected
    to positive and ground rails with a data pin.


    (img/78fc0912c436c89922acde325ec7a_52_1)

    (img/78fc0912c436c89922acde325ec7a_52_2)


    ## Feature


    ## Control your automated system


    ## Configure your Raspberry Pi and Arduino to work in harmony for an automated
    home


    We are going to use homecontrol.js as the control software for our automated system.
    This is a home automation system written in Node.js that runs on the Raspberry
    Pi, and sends commands to the Arduino via USB to various hardware connected to
    it. Although some of the things the Arduino does be done with the Raspberry Pi
    in theory, the Raspberry Pi does not have analog voltage input and light sensors
    would not be possible in this case. Also Raspberry Pi has only one hardware pulse
    modulation output which is needed for the LED strip.


    - sudo apt-get update

    - sudo apt-get upgrade

    - sudo apt-get install libboost-dev arduino streamer


    Next, we need to download a precompiled Node.js and a MongoDB package (both are
    required by homecontrol.js). Packages can be found at http://liamfaser.co.uk/lead/homeautomation,
    in case they go missing.


    ## Raspberry Pi prep


    Use the latest Raspberry Pi as a starting point for this project. Use the default
    username of "pi" and default password "raspberry". The first thing you''ll need
    to do is use sudo raspberry-config to enable the camera and resize the root filesystem
    so the system uses all of the available space on the SD card. Time to time we
    can update our packages to the latest version and then install extra packages
    that will be required later:


