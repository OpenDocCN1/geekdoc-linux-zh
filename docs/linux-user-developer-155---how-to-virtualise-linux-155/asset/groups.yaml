    # Contribute to Magma


    Many people from all over the world help Magma - a Linux-based operating system
    and a friendly community - for building Free Software projects.


    Contributing is a great way to give back to the software you use. No matter how
    much time you have or what you know, you can always find something to contribute
    and we welcome you so that your contribution to the project can be as great as
    possible!


    Check what you can do:


    +   - Stop by the forums and introduce yourself

    - Report bugs in the tracker

    - Talk about the project with people


    # Times


    How much free time do you have to give and how much of it are you willing to spend
    to help what we need?


    # A few minutes


    Even just a few minutes a week can make a difference.


    # Helping others


    We always need people to answer questions and help new users get started.


    # Writing, copying and translating


    If you are good at writing or translating, we could use your skills to help us
    improve the Magma documentation.


    Magma is localized in many languages now, but we always need more translations.
    Thanks for your help!


    # Triaging


    > An impressive amount of work has been done on the installer, with a new UEFI
    feature being support for modern machines


    Above Packages are installed using Magma''s custom RDMrake GUI or via its command
    line utility


    opt for the ISO you get full control during the installation and can add more
    desktop environments, set your network boot options, change your shell or bootloader,
    customise the services that are installed, configure firewalls, we set up proxies
    and very finely control which packages are installed by default. The highly configurable
    installer allows for a variety of draws of Magma, which you can always opt for
    the more straightforward Live CD or the architectural ISO for them users, more
    experts (like us).


    Once you''re actually inside Magma, we''re pleased to report that it''s really
    simple to get started. We welcome any feedback explaining how to add the new-free
    repos in case you didn''t sort those out out via your installation method of choice,
    and linking to the RDMrake GUI and RPM for package management, and also providing
    a handy Applications section, Essentially a shortlist from the main package


    manager. Applications sections provide new users with quick links to audio video
    decoders, plus popular software like Skype, Firefox, Flatscape and desktop environments.


    Some of the environments are better than others - we had a little trouble with
    some but wanted to start with a mix of: GNOME, KDE, LXQt, XFCE, and more. Openbox,
    Cinnamon and Enlightenment are all installed. With these everything except where
    the user chooses to log in, it''s hard to fault the reality - the only thing we
    found was missing some up-to-date software for the latest versions of the KDE
    system.


    For example, Firefox is the 31.7 ESR version 4.1.4 rather than the new Plasma
    5. As Rémi said, it had to stop at some point in order to get the stable enough
    finish and has done an excellent job.


    Gavin Thomas


    # Pros


    UEFI is now supported, and the Magma Control Centre and customisable installer
    has received significant praise


    # Cons


    Huge range of packages updated, but the longer freeze time has means that the
    release is lagging in terms of number versions


    # Summary


    Magma is an elegant distro that enhances its core system with many improvements
    and fixes. Weaknesses have been pointed to package management, while UEFI supports
    more modern architectures.


