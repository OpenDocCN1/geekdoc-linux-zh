  mdcn: "\n正如向你所示，此偏移处的指令是触发双重释放（double-free）或内存损坏错误的指令。显而易见，这条指令正在释放已经读取过的地址 0x013ceeb0，这是在\
    \ gdb 会话中运行程序导致段错误的错误。该程序是基于课程的；你必须将输出重定向到另一个终端，否则很难调试：\n\n（第 10-12 行）。请记住，栈存储着函数的参数，通过运行\
    \ `step` 命令，你允许栈在调用外部函数之前被正确设置。正如你之前看到的，`free()` 函数正在释放此处之前在 ELF 二进制文件内部已经释放过的地址\
    \ 0x013ceeb0。确实是这同一个地址（最后一行）。因此，你的陈述得到了确认，一个显而易见的结论是：地址 0x013ceeb0 尝试被另一个地方释放两次。\n\
    \n```gdb\n(gdb) tty /dev/pts/2\n(gdb) set file data.bin/x86_64/segment\n(gdb)\
    \ b 0x04a6b80\nBreakpoint 1 at 0x04a6b80\n(gdb) step\n#1 0x04a6b80 in free()\n\
    0x0000000000400000 in free () from /lib\n0x000ffff77a2b7b0 in free () at 0x7ffff77a2b7b00000\n\
    0x0000000000401b18 in __malloc_free (this=0x013ceeb0, size=0)\n```\n\n那么，如果你没有安装程序的源码，当你无法访问源码时，可以解析\
    \ ELF。如果你猜出指令所在的位置，可以将该操作码（op-code）指令替换为 `93 50 90 53`。我们的推理是这样的：如果我们不替换偏移处的 `free()`\
    \ 函数，我们必须使用什么其他指令呢？首先想到的第一个指令是 `nop`（无操作）。由于 `free` 调用占用五个字节，如果将其替换为 `nop`，只需将这五个字节替换为\
    \ `0x90`。之后，再次尝试并运行程序。正如我们预期的，安装程序没有崩溃，错误也消失了！\n\n将程序重定向到 /dev/pts/2 后，在指令所在的偏移处\
