- md: "\n# Python\n\n## Optimise by going outside\n\nThis article on Python optimisation\
    \ looks at how to use external compiled code to speed up your program\n\n![](img/78fc0912c436c898922acde3c325ec7a_69_0.png)\n\
    \n> The previous two articles of this series looked at profiling code to see the\
    \ existing code. In those cases, you have the option of using outtools to translate\
    \ Python to machine code. The most common technique is to use Cython (www.python.org)\
    \ to take code, compile it, and call it from Python. The first item you need is\
    \ a C header name ending, then you can use new external code with the Python command:\n\
    \n> dealloc function to clean up steps and memory frees. Also free Cython with\
    \ external libraries to be linked. In Python you can do this with the extra:\n\
    \n- - from import hello_world\n\nand as it any other Python function. While the\
    \ above will let you take advantage of machine code, the real power when you use\
    \ Cython within your Python code. The functions defined in Cython can be called\
    \ within them with a simple statement. If you want to use them and need to pass\
    \ a string to an integer, you can use\n\n```\nlibraries=(\"lib\")\n```\n\n- -\
    \ Added to the Entry in your setup.py.\n\nWithin Python, you can create objects\
    \ without worrying about whether they will be shared with equal equality. But\
    \ sometimes, when you are including C code memory management Cython decides for\
    \ the C standard library. It's say you need to allocate for an array of objects.\n\
    \nJoey Barnard is a true believer in building tools for researchers with scientific\
    \ computing problems and writing Android apps\n\n```\nvoid* c_my_array = malloc(sizeof(double));\n\
    ```\n\n# Why Python?\n\nWhen you are done, you can clean up with\n\nIt's the official\
    \ language of Python. Read the docs at python.org\n\n```\nfree(my_array)\n```\n\
    \nThe problem is that, memory is outside of the Python heap and so it is not collected.\
    \ A preferred method is to use the C-API functions within the package cython.\
    \ The elements are PyMem_Malloc, PyMem_Release, and PyMem_Free.\n\n- - to install\
    \ the package into your Python system library.\n\nBefore we show how to use Cython,\
    \ we will confirm everything is correct. Your Python code needs to be in its own\
    \ file, with a file name like hello.py. Hello World function would look like this:\n\
    \n```python\ndef hello_world():\n    print(\"Hello World to x\")\n```\n\nNow you\
    \ need a setup.py file for the compilation:\n\n```python\nfrom distutils.setup\
    \ import setup\nfrom Cython.Build import cythonize\n\nsetup(ext_modules=cythonize(\"\
    hello.pyx\"))\n```\n\nWith two files, you can build the external code with the\
    \ command \"setup.py build --inplace\". It creates a C source file and compiles\
    \ it into shared library with .so file\n\nCython also includes declarations for\
    \ the C library from the libc header. While these two libraries are handy, they\
    \ manage memory management. In cases, you can provide declarations of them. For\
