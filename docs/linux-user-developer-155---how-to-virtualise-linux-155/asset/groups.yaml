    \n## 常见问题解答 (FAQ)\n更新发行版\n\n**Q：那么我如何自动更新我的发行版？**\nA：某些发行版包含一个非常有用的更新器，例如 Ubuntu。当有可用更新时，它们通常会提示你，它将更新并安装任何必要的包，同时保留你的文件和设置。其他发行版没有这个过程，因此你需要备份文件并安装更新后的发行版。最好留意任何可能影响你特定系统的更新。\n\
    \n**Q：我使用的是 LTS（长期支持）版 Ubuntu，但没有显示升级。这是什么问题？**\nA：请使用“软件更新管理器”（Update Manager）并检查“设置”。转到“更新”选项卡，寻找“通知我\
    \ Ubuntu 版本”的菜单，并将其更改为“任何”。\n\n**Q：如果我不喜欢，可以回降级到之前的版本吗？**\nA：不太可能。这非常危险，并且可能会破坏所有包以回到之前的状态；最佳解决方案是进行备份，以防你想要回滚。\n\
    \n## 分析此问题\n\n我正在运行 Ubuntu 15.04，我在 Ubuntu 软件中心安装了“磁盘用量”（Disk Usage）。它安装正常，但我发现任何地方都找不到它。在“附件”菜单里没有，在应用程序文件夹里没有，在终端里也没有。我搜索了“Ubuntu\
    \ 软件中心”来显示位置，但那里什么都没有。我重启了电脑。还是没有。我卸载了“磁盘用量分析器”并重新安装了。有人知道可能发生了什么吗？\n\nAbove Disk\
    \ Analyzer 擅长分解存储空间的使用情况\n在我们在“管理”中看到的系统中，它会出现在菜单中，具体是在“管理”分类下。你确定你安装了正确的包吗？它被称为\
    \ `GNOME usage`，在软件中心里它被称为 `usage analyzer`。\n你可以尝试使用命令行安装它。打开终端并使用：\n\n```bash\n\
    $ sudo apt-get install baobab\n```\n\n你可以在终端里直接用 `baobab` 使用，或者在你的系统中再看一眼。\n\n\
