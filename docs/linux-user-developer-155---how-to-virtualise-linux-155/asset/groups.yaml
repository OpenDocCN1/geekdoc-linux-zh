    \n游戏自早期以来已经进步了很多，近年来，通过媒体讲述引人入胜的故事变得更加容易。视觉小说比以往任何时候都流行，尽管它们在其他地区也越来越流行，玩家通常通过点击来做出决定并探索路径。\n\
