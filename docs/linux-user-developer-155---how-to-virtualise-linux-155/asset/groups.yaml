    ##评测


    ## Banana Pro


    ![](img/78fc0912c436c898922acde3c325ec7a_81_0.png)


    ## 微型电脑


    ## Banana Pro


    有了新的制造合作伙伴，Lemaker 升级后的类 Pi 设备是否已经摆脱它的灵感来源？


    Lemaker 原本的 Banana Pi 因其派生性和“模仿者”的名字备受批评，但这家中国公司最终填补了市场空白。虽然它采用 ARMv6 单核处理器且没有高速存储，但
    Banana Pro 拥有的双核 ARMv7 芯片和 SATA 接口，并支持更广泛的免费操作系统。


    - CPU：双核 ARMv7 1 GHz

    - GPU：ARM Mali-400 MP2，带有 CedarVR

    - RAM：1GB DDR3

    - 存储：Micro-SD, SATA 2.0

    - 网络：以太网，802.11b/g 无线

    - 额外端口：USB2，28 个用户访问的 GPIO


    自 2013 年 Banana Pi 发布以来，市场已经发生了演变，Lemaker 以 Banana Pro 做出了回应。


    遗憾的是，这并没有领先。当 Banana Pi 发布时，它提供的性能显著优于树莓派；虽然树莓派 2 是双核处理器，但树莓派 2 b 的四核处理器完全碾压了双核的
    A20 —— 而且价格更便宜。


    因此，提到 A20 令人失望，但 Lemaker 至少有了可展示的改进。一个亮黄色的 40 脚 GPIO 插针与树莓派的引脚一致，使得兼容性更加容易。主板的改进在于像
    Pi 2 一样，去除了复合视频输出，取而代之的是紧凑的 3.5mm 接口。


    最大的变化是包含了 802.11b/g 无线网络，这已已成为标准。


    - 尺寸：92x60 mm


    可在 RobotShop.com 购买


    价格：£34.99 / $55


    ![](img/78fc0912c436c898922acde3c325ec7a_82_0.png)


    ![](img/78fc0912c436c898922acde3c325ec7a_82_1.png)


    ![](img/78fc0912c436c898922acde3c325ec7a_82_2.png)


    ![](img/78fc0912c436c898922acde3c325ec7a_82_3.png)


    ## 优点


    优秀的网络功能和高速存储与广泛的操作系统无缝结合，使得 Banana Pro 非常具有灵活性。


    ## 缺点


    如果你需要集成无线 Wi-Fi，树莓派 2 Model B 提供了更多 USB 端口和更好的性能。


    > 最大的变化是标准配置了 802.11b/g/n 无线网络，它与千兆以太网并列——前代实际吞吐量限制为 233MB/s——提供了比其灵感来源更高的性能。与
    Pi 板本身解耦的包是你已经开始但不需要安装；可以单独购买 USB 转 RP-SMA 适配器来利用两个 USB 端口。内置 AXP20 电源管理单元 (PMU)
    是 Pro 型的新功能，而全 SD 卡已被 Micro-SD 卡取代。


    Scratch 安装在 Micro-SD 卡上（不提供），通过复制直接文件系统镜像；无需设置系统。


    与许多中国单板电脑一样，Banana Pro 自 1 月以来所需的各种操作系统和更新的系统镜像也可以通过其他机制分发，包括：


    但必须说，Banana Pro 的问题在于价格；对于与更强大的树莓派 2 和官方 Wi-Fi 适配器相当的成本，它缺乏为树莓派 2 型号开发的同等高质量软件硬件。


    ## 总结


    不可否认，Banana Pro 是 Banana Pi 的改进，然而，由于与树莓派 2 Model B 相比缺少两个全尺寸 USB 端口，它未能通过，而 Pi
    2 的四核处理器让更便宜的 Banana Pro 胜一筹。


    兼容性也需要考虑：从树莓派内核到 Android 4.4 —— 在没有 Wi-Fi 支持的情况下，Ubuntu 和 Debian 变体可用，以及用于教学的基础。


    ![](img/78fc0912c436c898922acde3c325ec7a_82_4.png)


