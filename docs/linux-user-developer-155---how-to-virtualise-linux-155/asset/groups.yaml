    上面的增强功能将被安装以完成设置，但你以后可以返回设置并取消它


    当你完成并进入虚拟机操作系统后，你可能想安装增强功能。这允许你通过正确的设置让虚拟机全屏运行，还可以启用指针集成、视频支持、客机之间的无缝窗口和文件夹以及更多功能。要执行此操作，进入“设备（Devices）”菜单选择“插入增强功能  映像（Insert
    Guest Additions CD Image）”。挂载磁盘（它不会自动挂载），然后从顶部点击。从那里，选择工作正常的分辨率（如果没有显示全屏），你的客机内部已完全启动，然后分别安装磁盘和
    VirtualBox-guest-packages。最后，如果你安装了增强功能。接下来，进入“设置”，点击 USB 并启用控制器，然后点击“添加”选择过滤器。最后，过滤你的用户组设置。滚动到浏览器并将该用户添加到组中。


    ## VirtualBox 扩展


    VirtualBox 有专有的扩展包：

    - 远程桌面支持，允许从一台主机运行另一台虚拟机，你需要一个强大的服务器来运行多种类型的客机。

    - 该包还可以启用 USB 3.0 (EHCI) 控制器、通过映射 Intel PXE ROM 进行远程启动、系统摄像头等。


    你可以使用下拉菜单选择挂载在虚拟驱动器上的硬盘和 ISO。


    在将你的 USB 设备添加到过滤器之后，运行客机时会断开与主机的连接，释放它。


    ### # 使用 QEMU 进行虚拟化


    熟悉这种具有更多可控元素和更高性能的手动虚拟化软件


    ```bash

    sudo apt update

    sudo apt install qemu-kvm qemu-system-x86 qemu-system-arm

    ```


    ## 03 仿真 x86


    确保你已经下载了 ISO，然后将其放入 qemu 工作目录以便于启动。完成后，这比通常要快得多。


    ```bash

    $ sudo qemu-system-x86 -hda vdh.img -cdrom [ISO].iso -m 2048 -boot d

    ```


    ... 虽然可能比其他虚拟化解决方案慢一点，因为它实际上是在仿真系统，但它是可以运行的。


    QEMU 不说是一个虚拟化软件，不如说是一个仿真器，允许你在 x86/x64 上运行，尽管它允许你仿真 ARM、MIPS。这比 VirtualBox 稍微复杂一点。但是，你可以运行硬盘镜像。


    ## 04 安装在虚拟硬盘上


    执行你操作系统的安装程序（确保你创建一个大虚拟硬盘），再次，它会比通常花费更长时间。一旦安装完成并可以使用以下命令重新打开它：


    ### 01 获取 QEMU


    首先，我们需要在你的系统上安装 QEMU——大多数 Linux 仓库都支持它，在 Ubuntu 中你可以找到类似的内容：


    ```bash

    $ sudo apt install qemu

    ```


    对于 Fedora，你将使用 yum install，如果你是系统管理员，你可能想从源码编译以确保它在你的源码上运行——可以在 https://www.qemu.org/download
    获取


    ### 02 创建虚拟硬盘


    你可以在仿真操作系统和发行版时创建一些虚拟空间，这对保存数据很有用，你甚至可以根据需要进行安装。在终端中你可以执行：


    ```bash

    $ sudo qemu-img create vdh.img 20G

    ```


    这创建一个 20 GB 的硬盘，尽管你可以根据需要将其大大或小。它可能会保留在工作目录。


    ### 05 仿真 ARM


    这可以用于仿真树莓派或其他物品，如果你想访问设备，这是测试运行 ARM 版本软件的好方法。这需要对初始运行命令进行一些更改，例如：


    ```bash

    $ sudo qemu-system-arm

    ```


    ... 以及相关的镜像和内存详情（-m 选项）以适应系统。


    ### 06 仿真 MIPS


    使用 QEMU 仿真 ARM，这允许你在 MIPS 硬件上进行测试。QEMU 支持 MIPS 以及许多其他类型的 CPU 架构，为此你需要使用 qemu-system-mips
    来运行镜像或操作系统。如果需要，还支持 MISEL 和 MIPS64，只需将命令改为 qemu-system-misel 和 qemu-system-mips64。


    www.linuxuser.co.uk


