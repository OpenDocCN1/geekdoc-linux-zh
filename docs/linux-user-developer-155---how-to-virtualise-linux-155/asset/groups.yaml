    用途：测试和开发运行在不同架构上的操作系统


    QEMU 不说是一个虚拟化软件，不如说是一个运行镜像的仿真器。你可以使用 ISO 并像其他虚拟机解决方案一样运行 Linux 发行版或 Windows；与这些系统不同，你还可以运行需要
    ARM（如树莓派发行版）、MIPS 或你可以想到的任何其他处理器的发行版。如果你手头没有相关设备，这对于在不同架构上测试软件非常好。不过，使用起来可能有点复杂，因为它更多依赖于命令行界面。


    - 最佳内存

    给系统分配内存取决于主机将给客机分配多少内存。虽然如果你在作为主机的专用服务器上使用主机内存时这不是必须的，但给虚拟客机主机分配大量内存资源会对主机的性能产生负面影响。请保留一半的内存作为良好的最小值，特别是当你的桌面系统资源有限时。


    ## 功能 如何可视化 Linux


    ### # 从 VIRTBOX 开始


    通过易于使用的 VirtualBox 学习如何使用这种非常有用的虚拟机


    要创建你的第一个虚拟机，打开程序并点击“新建（New）”。将类型（Type）和版本（Version）设置得尽可能接近你的客机发行版——例如，使用 Debian
    基础。接下来，为你的虚拟机分配内存，这取决于你计划运行多少个客机，但一般规则是如果你只运行一个，就给虚拟机分配足够的内存。最后，创建一个虚拟硬盘。如果你需要像
    VMWare 那样与其他协作，请坚持默认的 VDI 格式。或者如果你的虚拟机设置可以更快，请使用固定大小（Fixed Size）的硬盘而不是动态分配（Dynamically
    Allocated）。使用硬盘的大小留出空间——足够设置内存。此外，安全总没好。


    硬盘设置好后，你的虚拟机几乎准备就绪了。点击“设置（Settings）”并进入“系统（System）”菜单。除了内存设置，你可以在第一个标签页上更改默认启动顺序。你还可以增加虚拟机
    CPU 处理器的核心数——如果你同时运行多个，这将很有。接下来，如果你使用滑块的绿色区域，请启用共享内存（Shared Memory）。如果你安装了增强功能（Guest
    Additions，见下文），开启3D 加速和2D 视频加速有助于提高性能。要挂载物理或虚拟（通过 VirtualBox）光驱，通过添加 IDE 次级媒体控制器并选择你的
