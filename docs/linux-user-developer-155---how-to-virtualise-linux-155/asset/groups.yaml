    ## Mini PC


    ## Banana Pro


    With a new manufacturing partner, Lemaker''s upgraded Pi-alike de-facto erase
    its inspiration?


    Lemaker''s original Banana Pi drew criticism for its derivative nature and me-too
    name, but the Chinese company ultimately filled a gap in the market. While it
    had an ARMv6 single-core processor and no high-speed storage, the Banana Pro boasted
    a dual-core ARMv7 chip and SATA interface, with a wider range of costless operating
    systems.


    - CPU Dual-core ARMv7 1 GHz

    - GPU ARM Mali-400 MP2 with CedarVR

    - RAM 1GB DDR3

    - Storage Micro-SD, SATA 2.0

    - Networking Ethernet, 802.11b/g wireless

    - Additional ports USB2, 28 user-access GPIOs


    The market has evolved since the Banana Pi launched back in 2013, and Lemaker
    has responded with the Banana Pro.


    That''s not Leeds, unfortunately. When the Banana Pi launched, it offered significantly
    improved performance over the Raspberry Pi; while the Raspberry Pi 2 was a dual-core
    processor, the quad-core processor in the Raspberry Pi 2 b obliterates the dual-core
    A20 - and one which costs less, too.


    The mention of the A20, then, is a disappointment, but Lemaker has at least improvements
    to show. A bright yellow 40-pin GPIO header matches the pinout of the Raspberry
    Pi, making compatibility easier. Boards are improved by the removal - just like
    the Pi 2 - of a composite video output in favour of a compact 3.5mm jack.


    The biggest change is the inclusion of 802.11b/g wireless networking, which stands
    as since.


    - Size 92x60 mm


    Available from RobotShop.com


    Price £34.99 / $55


    ![](img/78fc0912c436c898922acde3c325ec7a_82_0.png)


