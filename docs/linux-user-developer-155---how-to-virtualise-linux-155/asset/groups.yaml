    ## Linux Foundation digs for nearly $500,000 in funding for security projects


    The Linux Foundation has announced that its Core Infrastructure Initiative has
    raised $500,000 in funding for three security-related projects: The Debian Reproducible
    Builds project, Hanno Böck''s Fuzzing Project and Pascal Cuq''s CIS Interpreter,
    while providing for the hiring of Emery Ratcliffe, senior director of Infrastructure
    security for the Core Initiative itself.


    One of the first people to build secure systems is Catherine Ratiff, known for
    her contribution to the First Criteria Evaluation of Linux and has worked with
    the Linux Foundation Group, GlobalPlatform, and holds Certified Systems Security
    Professional status.


    > "We wanted to get the Linux Foundation and work on the Infrastructure Initiative
    because improving the security of critical open source is a bigger problem than
    any one company can tackle on its own," says Ralf of Ratiff.


    > "I am looking forward to working with all members to achieve more and address
    underfunded support projects and work to change the industry practices and protects
    open source software."


    Funding is being used for these three projects: $200,000 to Debian Reproducible
    Builds project, $60,000 to Hanno Böck''s Fuzzing Project and $192,000 to Pascal
    Cuq''s CIS Interpreter, led by James Holger and Jeremy LeJerry, aims to eliminate
    vulnerabilities from the code and improve security of free software projects.


    The Fuzzing Project, meanwhile, has addressed numerous security issues in packages
    including GnuPG and OpenSSL, with the $60,000 grant to be used to continue his
    work.


    While each project we''re funding today is great, each is critical for the global
    community''s security and cybersecurity. These new grants, with the stellar addition
    of Emery Mean, will help address infrastructure vulnerabilities in the months
    ahead," claimed Jim Zemlin.


    Jim Zemlin, executive director of the Linux Foundation, sees each project as "critical".


    The Core Infrastructure Initiative was set up by Linux Foundation in the wake
    of the Heartbleed vulnerability in 2014 as a means to provide support and improve
    the security of technologies considered critical to Linux and its users.


    # CONTAINERS


    ## Canonical launches ‘Fan’ network system


    ### To ease the pressure of full-bursting to IPv4 networks


    Canonical has launched a new networking system to vastly increase the number of
    IP addresses available to containers without adding complexity, dubbed the Fan.


    "Because we are mapping addresses algorithmically, we avoid any need for a database
    of every host," says Shuttleworth. "We can calculate instantly the host-network
    on each host, instead of relying on software-defined endpoints. This allows for
    many more addresses, with a single route to the ‘fan’ network of mesh tunnels
    we now have merged."


    "It means that you can picture it as a fan with better IP addresses available,
    without 250 IP addresses available," explained Canonical Mark Shuttleworth of
    Ubuntu. More than that, you can run multiple fans, so each make, and every fan
    can give you 250 the IP addresses.


    The Fan launched for Ubuntu images on Amazon''s Web Services (AWS) cloud platform
    is now available for Google Cloud Engine (GCE), with support for multiple platforms.
    Shuttleworth says that Canonical intends to submit a Request For Comments (RFC)
    to the Internet Engineering Task Force (IFT) to turn Fan into a cross-vendor standard
    for containers. Fan requires a modified Linux kernel, a modified ipt2 package,
    the new fanctl utility, and the published tutorials.


    The Fan system was created by Mark Shuttleworth and implemented by John Courte
    to provide additional addresses for any host in a local network, as a means of
    scaling to host denser containerised systems (SDN). It does not provide arbitrary
    virtualization of software-defined where live migration of an interface from one
    to another is required. Instead, it is with the use of containers such as LXC/Docker
    needed.


    Canonical documentation describing the Fan on the official website www.ubuntu.com/FanNetworking


