    ## 教程 | SSD & HDD


    ## 通过结合 SSD 和 HDD 设置你的系统


    ### 通过混合存储环境打造“两兼优”的场景


    ![](img/78fc0912c436c898922acde3c325ec7a_35_0.png)


    SSD 固硬盘在现代计算中已经存在了一段时间了。现在，中等容量硬盘的价格已经可以负担得起，尤其是与几年前购买 64 GB 硬盘可能需要花费的数百美元相比。不过，对于
    TB 级别的大容量存储空间仍然昂贵。此外，SSD 也有存在写入次数限制的问题，在计算领域也是如此。


    - 01 选择 SSD

    你选择 SSD 硬盘时应考虑几个因素，但最重要的因素之一是所需的空间。由于我们将 SSD 视为主硬盘，它需要能够包含操作系统，并留出大量空间安装应用程序和软件包。正如讨论过的，现在
    SSD 硬盘的容量大得多，但价格也随容量增加。


    因此，两者结合似乎是一个非常好的主意。用一个硬盘处理所有文件系统，另一个硬盘处理占用更多空间的任务，这样使用更便宜的替代方案更有意义，特别是因为这些任务不需要
    SSD 的速度也能良好运行。继续阅读以了解创建你的完美混合系统需要注意的细节。


    **Rob Zetsloot** 是复杂系统模型和标准硬件开发者，精通 Python、Django 和 Go。他热爱对计算进行实验。


    ## 资源


    - SSD 硬盘（至少 64 GB）

    - HDD 硬盘 Lucky Gadsby bit.ly/L0bUfd


    幸运的是，Linux 发行版通常需要的空间比 Gates 和其他系统提供的要少。20 GB 通常足够安装发行版以及一些占用空间较大的应用程序，因此像 64
    GB 的硬盘在技术上是足够的。尽管如此，现在 120 GB 的硬盘非常常见且价格合理，因此我们建议选择这种硬盘以确保具有一定程度的前瞻性。


    ![](img/78fc0912c436c898922acde3c325ec7a_35_1.png)


    右 SSD 将包含发行版安装所需的交换分区和 ext4 分区


    ## 格式化硬盘


    ![](img/78fc0912c436c898922acde3c325ec7a_36_0.png)


    - 02 选择 HDD

    这是公式中的大硬盘，所有硬盘都将列在这里。现在你有了它，我们将交由你决定，但如果你至少有 500 GB 的 SSD（最好），并且是 HDD，你可以选择 1
    TB 或更多。如果你有空间，可以获取更多的 HDD 和分区，并可以根据需要任意划分。


    - 04 安装硬盘

    现在我们可以开始安装 Linux 了。从你的安装启动运行环境或安装过程并开始安装流程。在涉及分区时，在根目录 (/) 硬盘上设置分区。你需要选择 SSD，你必须通过大小以及交换（swap）和家目录（home）来识别这两个分区。如果你有足够的空间，在系统中创建一个新分区，并将其挂载点设为
    `/`。安装将继续。剩余的硬盘和分区可以稍后设置。你可以不使用根 (/) 挂载点，而是将其设置为家目录硬盘。这需要你将挂载点设为 ''home''。


    - 03 格式化硬盘

    在执行任何操作之前，格式化你的新硬盘是个好主意。并不是每个系统都在安装过程中内置了格式化工具，所以你可以……


    SSD 将为你格式化以拥有任何其他 Linux 硬盘。在 SSD 上使用 ext4 更好且能产生性能。但创建一个交换分区，它会提供相同数量的源交换内存。你可以用一个交换分区填满整个硬盘，并将其余部分留给跨系统的
    ext 分区。


    HDD 存储可以以你想要的方式提供帮助，但我们建议将其格式化为 NTFS，这样在不同系统之间更具通用性。你可以用一个交换分区填满整个硬盘，其余部分留在 SSD
    上。如果你打算也做，请先在其中设置 RAID。


    - 05 使用系统

    实际上使用我们创建的系统既容易又简单。你用于启动的 SSD 保持原样，因此它的加载速度应该比以前快一点，类似但你不需要安装 SSD。安装和运行会稍微快一点，但受限于下载和操作系统的速度。任何配置文件将自动保存到你的家目录，或由你手动保存。


    左 将 HDD 设置为 NTFS，网络上的 Windows 机器可以访问这些文件。


    - 混合硬盘

    除了我们的混合方案，专门获取混合硬盘。它们有固态存储，有更大的磁盘存储。经常从其他分区使用的文件通常用于创建的存储解决方案。


    如果你在 Linux 上将存储驱动器设置为为了属性挂载，可能会存在问题。这可以很容易修复——安装 `ntfs-3g` 软件包即可让其工作。如果它需要在启动时挂载……


