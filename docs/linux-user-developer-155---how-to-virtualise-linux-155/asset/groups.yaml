    安全


    ## 核心基础设施倡议资助新的安全项目


    ![](img/78fc0912c436c898922acde3c325ec7a_5_0.png)


    ## Linux 基金会为安全项目募集近 50 万美元


    Linux 基金会宣布，其核心基础设施倡议（Core Infrastructure Initiative）已为三个安全相关项目筹集了 50 万美元资金：Debian
    可重现构建项目、Hanno Böck 的模糊测试（Fuzzing）项目以及 Pascal Cuq 的 CIS 解释器，同时还为该倡议本身的基础设施安全总监
    Emery Ratcliffe 提供了职位。


    首批构建安全系统的人之一 Catherine Ratiff，她因对 Linux 第一标准评估的贡献而闻名，曾与 Linux 基金会小组、GlobalPlatform
    合作，并持有认证系统安全专业人员（CSSSP）身份。


    > “我们希望加入 Linux 基金会并致力于基础设施倡议，因为提高关键开源软件的安全性比任何单一公司能独立解决的问题要大得多，”Ratiff 说道。


    > “我期待与所有成员共同工作，取得更多成就，解决那些资金不足的支持项目，并致力于改变行业惯例，保护开源软件。”


    资金将用于这三个项目：200,000 美元用于 Debian 可重现构建项目，60,000 美元用于 Hanno Böck 的模糊测试项目，192,000
    美元用于 Pascal Cuq 的 CIS 解释器。这些项目由 James Holger 和 Jeremy LeJerry Led，旨在消除代码中的漏洞并提高自由软件项目的安全性。


    与此同时，模糊测试项目已解决了包括 GnuPG 和 OpenSSL 在内的多个包中的安全问题，这 60,000 美元的资助将用于继续他的工作。


    “虽然我们今天资助的每个项目都很优秀，但每一个对于全球社区的安全和网络安全都是至关重要的，”Jim Zemlin 声称，“随着 Emery Mean 的加入，这些新资助将在未来几个月内帮助解决基础设施漏洞。”


    Linux 基金会执行主任 Jim Zemlin 认为每个项目都是“关键的”。


    核心基础设施倡议由 Linux 基金会在2014 年 Heartbleed 漏洞出现后设立，旨在提供支持并提高被认为是 Linux 及其用户关键技术的安全性。


    # 容器


    ## Canonical 推出“Fan”网络系统


    ### 缓解 IPv4 网络全突发流量压力


    Canonical 发布了一种全新的网络系统，可以在不增加复杂性的情况下大幅增加容器可用的 IP 地址数量，被称为 Fan。


    “由于我们通过算法映射地址，因此我们避免了对每个主机建立数据库的需求，”Shuttleworth 说，“我们可以立即计算出每个主机上的主机网络，而不是依赖于软件定义的端点。这允许提供更多的地址，只需单路由即可进入我们现在合并的网格隧道‘扇’网络。”


    “这意味着你可以把它想象成一个拥有更多 IP 地址的扇形，而不是只有 250 个可用 IP 地址，”Ubuntu 的 Canonical Mark Shuttleworth
    解释道。此外，你可以运行多个扇形，因此每个品牌、每个扇都可以为你提供 250 个 IP 地址。”


    为亚马逊云 (AWS) 平台上的 Ubuntu 镜像推出的 Fan 现已适用于 Google Cloud Engine (GCE)，并支持多个平台。Shuttleworth
    表示，Canonical 打算向互联网工程任务组（IFT）提交征求意见（RFC），将 Fan 变为跨供应商的容器标准。Fan 需要修改过的 Linux 内核、修改过的
    ipt2 包、新的 fanctl 实用程序以及发布的教程。


    Fan 系统由 Mark Shuttleworth 创建并由 John Courte 实现，旨在为本地网络中的任何主机提供额外地址，作为扩展到更密集的容器化系统（SDN）的手段。它并不提供在需要将接口从一个热迁移到另一个时所需的任意软件定义虚拟化。相反，它需要配合如
    LXC/Docker 等容器使用。


    Canonical 官方网站 www.ubuntu.com/FanNetworking 提供了关于 Fan 的文档说明。


    # 教育


    ## FUZE BASIC v3 更新图形


    ### 添加了精灵功能


    FUZE 发布了第三代 FUZE BASIC 编程语言，这是 BASIC 语言的现代延续，专为 FUZE 编程电子工作站设计。


    在树莓派和其他平台上免费提供，FUZE BASIC 增加了高级图形处理命令，如精灵旋转和缩放、透明度通道等，


    # 前五名


    ## Linux 4.1 LTS 的特性


    ### 1 功耗提升

    最新长期支持内核的发布改进了笔记本电脑和桌面级电脑的电池寿命，对 Intel Core 设备（包括 Intel Compute Stack）益处尤为。


    ### 2 密码学

    得益于 Android 为移动平台提供的补丁，Ext4 文件系统现在包含了即时层级加密选项。这独立于现有的 Linux 加密功能（如 de-crypt）存在。


    ### 3 更好的游戏体验

    使用 4.1 内核的 Linux 游戏体验为罗技方向盘、游戏控制器和微软设备提供了更好的力反馈支持。


    ### 4 更好的支持

    使用 4.1 内核的 Linux 游戏体验为罗技方向盘、游戏手和微软设备提供了更好的力反馈支持。


    ### 5 更好的支持

    使用 4.1 内核的 Linux 游戏体验为罗技方向盘、游戏控制器和微软设备提供了更好的力反馈支持。


