    Here is indicated, it is a normal practice to store all debug messages in a different
    file. For this purpose you need to modify /etc/syslog.conf file by adding the
    following line:


    - <debug /var/log/apache2


    After restart, Apache will be able to store all debug messages to the syslog server.
    The web log file helps us in the debugging process. Log files will help you detect
    problems, identify your site''s problems, find out about your site''s best features
    and interesting information.


