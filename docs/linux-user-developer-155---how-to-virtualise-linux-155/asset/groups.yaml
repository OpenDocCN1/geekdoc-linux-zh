    # Tutorial logs


    The beauty of rotate lies in the fact that it allows us to handle each log file
    daily, monthly, or when grows too large. So using rotate, it is possible to keep
    logs longer with less disk space. Practice is rotate as a daily. Thus it is not
    needed to rotate a log file several times.


    When called, rotate does:


    The daily tells rotate to rotate files every day.

    - **Rotate 1** tells it to rotate log files once before.

    - **Create** tells rotate to create a new log file as it rotates the old one.

    - **Compress** tells it to compress logs when they are old.

    - **Include** instructs rotate to do more instructions in -cfg/rotate. Let us
    consider another example:


    - The rotate configuration file: /etc/rotate.conf

    - The files in configuration directory: /etc/rotate.d/

    - If you have many services (Apache web server, MySQL etc) define your system
    configuration file in etc/rotate.d.


    Rotate comes with many lines and some of these are useful. The following are some
    options with rotate:


    - v verbose mode

    - d enable debug mode

    - f force the log file, if not necessary

    - u use output for a short message, giving information on usage

    - weekly

    -- rotate 5


    Here are the rules to handle the error messages at /var/log. These files will
    go through weekly before they are removed. After the log file has been rotated,
    the command /bin/kill -H syslog will be executed. Rotate finds extra use in rotating
    the log files (error and log) generated by a server. The following:


    ```

    /var/log/http.log /var/log/error.log

    rotate 5

    mail root@hostname.com

    size

    postscript

    ```


    As mentioned, rotate comes with configuration file - rotate.conf, located at /etc.
    It is a normal practice to place site-specific configuration files in /etc/rotate.d.
    Let us see how we can use rotate for logging the logs Rotate reads about the log
    files if it is handling from series of configuration files. The configuration
    files are normally written in cfg-like format. First, we need to create a configuration
    file for logfiles; let us have this configuration in:


    Here, two specified log files (access and error) are rotated when their size over
    100k and the log files are going through five rotations. In this case, note that
    all log files are removed from the system. Any error that occurs during the processing
    of log files is mailed to root. Now let us consider site-specific configuration
    file. As mentioned earlier, configuration files are available in the /etc/rotate.d
    directory.


    ## Edit Logging Settings


    Select a Log Level to control the level of detail included in your logs.


    | Log Level | |

    | :--- | :--- |

    | Log Rotation | Create a new log file every day. 50 (kb) |

    | Disable log rotate file | Save all logs in the same file |

    | Max File Size | 10000 file(kb) |

    | Rotate files based on size | |

    | Max File Size in Rotation | 10 file(kb) |


    ```

    /var/log/http.log {

    weekly

    rotate 5

    compress

    missingok

    notify

    postscript

    sbin/kill -HUP ''cat /var/run/http.pid 2>/dev/null''

    }

    ```


    The output of the command is given below:


    The wild card (*) is used in this example to rotate all files inside a specific
    directory (/var/log/httpd). The various log files are rotated before being removed
    from the system. The old logs are compressed using gzip in order to save space.
    We can now use this detail in the configuration file - it says if the log file
    is missing, it goes to the next one without issuing an error message. log specifies
    that we do not rotate the log if it is missing.


    For a specific period, let''s create a file: /home/sway/cfg/log/webapp.log and
    will illustrate how to rotate webpage''s logs. Inside this file, we will have
    a section for each log file. Let''s take a look at one of the logs - say, gen.log.


    > Logrotate is considered to be a very powerful tool for developers, so ensure
    that it is set up as cron job to avoid manual work.


    ```

    /home/sway/cfg/webapp/gen.log

    ```


    - weekly

    rotate 5

    copytruncate

    compress

    notrotate

    missingok


    It can be seen that this specific section contains instructions on how to find
    the location of the log to be rotated and do the rotation, which is rotate the
    log weekly. 5 tells to rotate the log 5 times weekly. Copytruncate tells rotate
    to compress the log file in place, instead of deleting it and creating a new file.
    Not tells rotate not to rotate the log if it is missing or to issue an error if
    the log file is missing.


    In all the examples above we have used various directives such as logrotate, compress,
    size, daily, weekly, monthly. There are three commands in log configuration files
    that specify how often to rotate the log - they are daily, and monthly. When we
    use compress, the log file is compressed using gzip in order to save space.


    It is very natural to rotate n log rotation in configuration file which may be
    slightly inaccurate - n week''s worth of log files will be kept if the rotation
    is weekly, rotation if it is daily, and we are keeping four days'' worth of log
    each.


    lograte - /home/sway/cfg/log/lograte.conf tells what command to run. Please note
    that lograte is at /usr/sbin/ on our machine, but may be different on the one
    you are using. The -s option is to show information about the log file. Above
    This the contents of typical access lograte.status - This status is very needed
    because lograte will keep this information in a file where we have permission
    to access. Since it will store the date and time of the last rotation - /home/sway/cfg/lograte.conf
    tells lograte configuration file was used.


    The cron job set everything to be functioning as expected. It is better to add
    the -f option, to /usr/sbin/lograte -f /home/sway/cfg/log/lograte.conf - with
    this file included, the cron job will remain running in the foreground and will
    not be unexpected.


    Apache also comes with a support tool logrotate. You can use this programs to
    rotate


    ```

    30 * 6 * /usr/sbin/logrotate -s /home/sway/cfg/logrotate.status /home/sway/cfg/logrotate.conf

    ```


    The first part of this cron job runs at 30 * 6 * * every morning. The second part
    - /usr/bin/


    ```

    Transferlog / /my_path/rotates /log_file <rotation time in second>

    ```


    For example, if you want to rotate the access log every 86400 seconds (which is
    24 hours), one can use the following


    ```

    Transferlog / /my_path/rotates /var/log/httpd 86400

    ```

