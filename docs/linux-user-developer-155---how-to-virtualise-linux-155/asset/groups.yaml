    第二代 Ubuntu 手机急需改进 BQ Aquarius 4.5 的初始表现。MX4 具备这些吗？


    终于，在等待了几个月后，第二部手机手机了。最初的 BQ Aquarius 4.5 —— 一部尚可的手机，但配置糟糕，且伴随其的极早期版本的 Ubuntu 看起来更像是你们日常使用的软件的早期开发阶段。低配置和不稳定的界面使得我们的评价并不那么正面。简单来说，硬件需要更好，操作系统则需要社区和社交媒体的更多帮助。


    现在我们有了美族 MX4 作为你 Ubuntu 手机的第二选择。中国市场的一个热门品牌，美族通常制造 Android 设备，因此它对智能手机的设计和制造也很熟悉。事实上，MX4
    Ubuntu 版是一部在去年底在中国市场发布的 Android 手机，但从未在西方发行。


    设备的其余部分保持不变：相当数量的 RAM 和内部存储，以及一个可以持续运行很长时间的电池。手机本身的设计非常漂亮；白色塑料机身，起来一点也不廉价，这样你就不会不小心撞击到全屏边缘。它的设计让人想起
    iPhone 和 Galaxy S 系列，这显然解释了这款手机在大众中的流行。对于现代 Android 手机来说，独特的是，它没有依赖软键进行主页、返回和其他应用操作，它还有一个电容式主页按钮，位于
    iPhone 主按键所在的位置。虽然该按钮通常不是 Ubuntu 手机用户体验的一部分，但它实际上与操作系统非常契合。


    # CPU

    八核，2 GHz (联发科 MT6759v)


    # RAM

    2 GB


    # 操作系统

    Ubuntu 15.04


    # 显示

    5.36 英 IPS 屏幕，1080 x 1920 像素 (418 ppi)


    # 摄像头

    2000 万像素后摄像头，200 万像素自拍摄像头


    # 存储

