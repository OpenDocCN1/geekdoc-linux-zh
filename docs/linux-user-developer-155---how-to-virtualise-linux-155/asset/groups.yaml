    Log rotation is important and it is very handy. It helps the easy management of
    log files that systems generate large - a typical use in case of a web server.
    Using this method, you can compress the log files, remove old ones. Rotating a
    log file means to copy a copy to backup and create a new log file. We can then
    delete old files when they are out of date. In this job, for example we will need
    to configure a log file and files that log how to rotate the log files for that
    specific program. Log rotation involves the regular weekly or monthly moving of
    an existing log file to some other and then starting with an empty log file. A
    typical log rotation configuration is given below:


    - ErrorLog

    - see man logrotate for details

    - rotate log files weekly

    - keep 4 weeks of backups

    - and restart, Apache will write all error messages to syslog.

    - create new empty log files after rotating old ones

    - compress


