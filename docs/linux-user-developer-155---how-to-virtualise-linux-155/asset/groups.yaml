    ## Feature


    ## Set up your control interface


    Now is the time to start adding our sensors and devices to heimcontrol.js.


    ![](img/78fc0912c436c898922acde3c325ec7a_55_0.png)


    ### 01 Start heimcontrol.js on boot

    Before we start adding devices, it makes sense to start heimcontrol.js on boot.
    To do this, we can add a line to /etc/rc.local which is a script that gets ran
    at boot by the root user. The file needs to be edited with sudo and your favourite
    editor, for example:


    ```bash

    sudo nano /etc/rc.local

    ```


    Add the following line before the line "exit 0":


    ```bash

    su pi -c "node /home/pi/heimcontrol.js/heimcontrol.js" &

    ```


    Heimcontrol.js will be started automatically from boot now, but now you can start
    it with node/home/heimcontrol.js/heimcontrol.js.


    ![](img/78fc0912c436c898922acde3c325ec7a_55_1.png)


    ### 02 Add the camera feed

    Go to Settings and select Webcam, Set the method to Streamer and you can pick
    the devices as /dev/video. Pick an interval, we picked two seconds but you can
    pick any interval you like. Shorter intervals are more feasible on a Raspberry
    Pi 2, as it is more responsive. Save and then go back to the home page.


    ### 03 Prepare remote control socket codes

    This is where you need the codes that needed earlier on. The Heimcontrol.js web
    interface takes the code as a binary string of 1s and 0s. However, the code we
    needed is in a different format so you''ll need to convert it to binary using
    Python. Type python2 into the terminal to open a Python interpreter. Format the
    integer you captured as a binary string like:


    ```python

    >> "{0:b}".format(167380653)

    "111111110101110000111"

    ```


    The heimcontrol.js interface works really on mobile devices.


    ## Home automation


    ## Expand into the future


    ### Set up multiple systems

    Now that you have homecontrol.js set up in one room, you could extend the system
    by setting up multiple Raspberry Pis and having them work together with all the
    older models that are gathering in your drawers. You could have another Raspberry
    Pi that reverses power-over-Ethernet cable with the connecting network.


    ![](img/78fc0912c436c898922acde3c325ec7a_56_0.png)


    ### 04 Add the remote control

    Go to the Settings menu and go to the Arduino section. Click the button and set
    the method to RC Switch. Set the code type to binary. Give it a name, enter the
    RF frequency you''ve worked out for, and enter the two codes that you used for
    the on/off buttons. Go back to the home page and test if the switch works. If
    it does, you don''t need to add anything to the transmitter by making sure it
    is connected correctly.


    Above the pulse width modulation for the Arduino. One wave is 20% of the time
    however (300ms). This controls the brightness of each LED to create any colour
    from the three primary colors.


    ### 05 Add the temperature sensor

    The temperature sensor can be tricky because it needs calibrating. A multimeter
    is so good you can accurately measure the analogue value. Go to the Arduino settings
    and add a sensor. Select TMP36 (New) in unit: °C and 10. Read 718mv with a multimeter,
    which would put the temp at 21.8°C. Experiment with the formula by we the real
    value of x is your sensor, or ends up with a offset. Since the Arduino has a 10-bit-to-digital
    converter, it is 0-1023 to read a voltage up to 5V. Then you have to enhance matched
    perfectly, otherwise the sensor will crash if it simply tries to string the you
    in.


    #### Remote access

    If you want to remotely access your automation system you can use a dynamic DNS
    provider so that each room allows you to create a bookmark that always points
    to your address. Then if you use SSH on your router to try your Raspberry Pi,
    you will be able to SSH into it anywhere (obviously you''ll want to change the
    default port 22 (for doing this)). If you then can port forward the homecontrol
    web interface to your local machine. We''ve found this in a previous Raspberry
    Pi File which can be viewed by visiting raspberrypi.local (instead of using port
    8080. to use port 8080.)


    #### Set up an audio system

    A nice addition to home automation would be some kind of multi-room audio system.
    If there''s a Raspberry Pi in each room, you''ll need a cheap-class class amplifier
    for each room and a bookshelf speaker to get this going. A pair of PC speakers
    would also do. If you just want one of speakers to work and support a web interface.
    Alternatively, could look into setting up Squeebox, which is multi-audio software
    that was developed by Logitech but is now open source.


    ![](img/78fc0912c436c898922acde3c325ec7a_56_1.png)


    ### 06 Add the led strip

    Finally, it''s time to add the LED strip. Make sure the wires are connected to
