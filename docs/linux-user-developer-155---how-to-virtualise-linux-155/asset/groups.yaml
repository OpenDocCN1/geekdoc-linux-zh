    # OpenSource


    Your source of Linux news & views


    # OPINION


    ## The kernel column


    Jon Masters addresses news from the Linux kernel community, as Linux 4.1 is released
    and the merge schedule for Linux 4.2 features.


    > Lin Torvalds released the final 4.1 Linux kernel, saying that it had been a
    very quiet after the week [unusual].


    As we noted last week, Linux 4.1 had to add another week (Release Candidate 8)
    to the schedule for Linux 4.1 due to the timing of his vacation coinciding with
    the original release target, a few small issues (for example, naturally data corrupting
    problems found in the RAID drivers as noted in the RC8 announcement that needed
    a little time to take out). Overall, it was a very busy week, though he thought
    a good "considering" that 4.1 will also be an LTS (Long Term Stable) which means
    Greg Kroah-Hansen and other maintainers will, under support the merge coverage
    of the Linux 4.2 merge window. When all was said and done, Linux released 4.2-rc1
    noting that the sheer size of this release came from the "anomaly", a layer of
    size in the top-level headers (which represent 41% of the entire lines of code
    changed in -rc1). While also that, the typical bulk of the changes from ARM64
    had "quite bit-of-level", both sources of potential corruption... and of FPU (Floating
    Point Unit) handling issues.


    ## Persistent memory


    Non-Volatile Memory (NVM) is a kind of RAM that retains data even after power
    is lost. This is a significant feature for system design, impacting both hardware
    and software. In the hardware sense, persistent memory already established stable
    design and is being worked towards for use as "instant on power", while creating
    features which must handle conflict in a world where memory is used for two different
    purposes. In the software sense, persistent memory challenges surrounding system
    topology and leads to discussions about the best means to manage large amounts
    of content that is both volatile and persistent.


    Jon Masters is a kernel developer who has been working on Linux for some years.
    He first attended the university of Massachusetts at Amherst, and worked for Red
    Hat in Massachusetts, and where he is currently driving the development of standards
    for energy efficiency ARM-powered servers.


    ## A near-record number of changesets were taken into the kernel - over 1,200
    non-merge changets


    With the release of Linux 4.1 the traditional opening of the merge window for
    Linux 4.2 has begun. This includes mainlining support for ARM64-bit ARM systems,
    and a new kernel block driver for non-volatile storage (also referred to as "persistent
    memory").


    In a traditional setting, computers use short-term memory memories known as RAM
    (Random Access Memory). Memory is volatile, meaning it is lost when power is removed
    upon resting (or during) short term shutdown. Traditional RAM is based on a stored
    charge-based approach proposed in the 20th century (and perfected since) which
    consists of small bits of stored charge; unlike the non-volatile based memory
    devices that we have today - which are based on physical properties, RAM loses
    its content after a few milliseconds of seconds and requires constant "refresh".


    The Linux 4.1 lasted a two-week period, during which a near-record number of changets
    (patches) were taken in. Depending on whether you include "merge commits" from
    subsystem maintainers or not, Linux 3.1 may have had more or less changets than
    4.2, but it was a very short period. News has brought a detailed view of the ways
    to calculate merge, non-merge changets in their computer software relies on sitting
    in the background while being powered on, and every memory location is returned
    to its state when it is not used. However, Conventional RAM devices are the ones
    that must be continuously refreshed. Persistent memory technologies do not have
    this same problem when power is removed from the system. Yet unlike disks and
    flash technologies, they are directly addressable (you can execute code directly
    from a non-volatile memory device).


    Over the coming years, with many terabytes of non-volatile memory available in
    existence, causing headaches for software that must manage them. On the one hand,
    those devices could be much slower than conventional RAM (with slower response
    time performance characteristics in the early generations), but requires tracking
    trillions of pages.


    A new addition to the current approach is to treat memory more like devices, where
    data can be stored indefinitely. The added benefit of treating such memories like
    large disks is, of indexing, tracking and built-in error correction.


    Linux 4.4 is the first step toward NV-DIMMS (Non-volatile memory RAM Dual In-line
    Memory Modules) through the "pmem" driver. At this stage, pmem is a simple driver,
    only the bare mean of functionality to be used as an industry device upon which
    filesystems could be created. There remains a raging debate as how to treat these
    devices (as backing for storage) or more (like RAM for something else). If you
    are lucky enough to have such devices, you can load the "pmem" driver and try
    it out.


    ## Ongoing development


    A new addition to the kernel "config" allows certain options to be turned on and
    off using a simple command line option. This will be merged (in a future release)
    allow developers to avoid hunting through the various configuration files to find
    the one they would like to turning on when the needs dependency resolution.


    Peter Zitter reminds us that all the work of the Kernel Mailing List has a public
    archive of the posts via service: "Since we can link to kernel.org we have redacted
    [to URL] at our choice of ours. This keeps it working even if itsprics.net, or
    more were to go belly up. We will switch to such links in future editions of this
    column."


