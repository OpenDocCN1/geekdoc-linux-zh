    软件偶尔会发生故障。无论是因为代码中的缺陷、还是软件所依赖的外部库存在 Bug，其结果都是都是的：程序崩溃。在这种情况下，ICT 专家应该负责解决问题，或者找到一种在不调试代码的情况下规避问题的方法。然而，跳过对软件的所有先有知识可能是行的，但如果没有正确的工具和技术，进行全面的分析将证明是困难的。在这些情况下，ICT
    专家将能够在没有源代码的情况下找到替代方案（或者考虑到 GNU Linux 机器上运行着非开源程序），本教程将向你展示真实案例，通过使用 ICT 专家的经验帮助你分析、调试并制作
    GNU 调试器（GNU Debugger）。这一过程适用于你不熟悉该缺陷软件的情况。


