- md: "\n# Questions & answers\nWeb: www.linuxuser.co.uk\nEmail: linuxuser@imagine-publishing.co.uk\n\
    \n# Q & A\n\n## Your questions answered\nSend us questions and we'll do our best\
    \ to answer them!\n\n![](img/78fc0912c436c898922acde3c325ec7a_89_0.png)\n\n##\
    \ FAQ\nUpdating a distribution\n\n**Q: So how do I update my distro automatically?**\n\
    A: Some distributions include a rather useful updater, such as Ubuntu. They usually\
    \ prompt you if an update becomes available, it will update and install any necessary\
    \ packages while keeping your files and settings. Others do not have this process,\
    \ so you will need to back up your files and install the updated version of the\
    \ distro. It's good to keep an eye out for any updates that might affect your\
    \ specific system.\n\n**Q: I'm on LTS (Long-Term Support) Ubuntu, and the upgrade\
    \ is not showing up. What is the problem?**\nA: Use the Update Manager and check\
    \ Settings. Go to the Updates tab and look for the menu with 'Notify me of a Ubuntu\
    \ version' and change it to 'Any'\n\n**Q: Can I downgrade back to a previous version\
    \ if I don't like it?**\nA: Not really. It would be dangerous and might break\
    \ all the packages back to a prior state; the best solution is to perform a backup\
    \ in case you wish to revert\n\n## Analyze this\n\nI'm running Ubuntu 15.04, I\
    \ installed Disk Usage from Ubuntu Software Center. It installed normally but\
    \ I couldn't find it anywhere. Not in the Accessories menu, in the application\
    \ folder or in the terminal. I searched for Ubuntu Software Center that shows\
    \ the location, but there's nothing there. I restarted the computer. Nothing.\
    \ I uninstalled the Disk Usage Analyzer and installed it again. Any idea what\
    \ might be going on?\n\nAbove The Disk Analyzer is good at breaking down where\
    \ storage is being used\nOn the systems we've seen in the Administration it just\
    \ comes up in the menu, specifically in the Administration. Did you make sure\
    \ you installed the right package? It's called the GNOME usage and it's called\
    \ the usage analyzer in the software centre.\nYou can try to install it using\
    \ the command line. Open up a terminal and use:\n\n```bash\n$ sudo apt-get install\
    \ baobab\n```\n\nYou can use both in the terminal with just baobab or have another\
    \ look in yours.\n\nSteven Grayson90\n\n## Fix your graphs\n\nI have installed\
    \ Grafana on my CentOS 7 with NGINX + PHP-FPM, manually with the help of a couple\
    \ guides online.\n\nAll seems to work - but it doesn't really show any graphs.\
    \ It should display the space but the image just won't load. For some reason,\
    \ I have the data in the rectify:\n\n```bash\n# curl /var/log/nginx/www.domain.com/process-service-graph\
    \ \\\n  -H \"Content-Type: application/json\" \\\n  -d \"start=\\$1\" \\\n  -d\
    \ \"end=\\$2\" \\\n  -d \"step=\\$3\" \\\n  -d \"value=\\$4\"\n```\n\nregister\
    \ 0\n\n```xml\n<!-- Round Database -->\n  <version>0023.0</version>\n  <step>30s</step>\
    \ <-->\n  <lastupdate>1435996565</lastupdate>\n  <timestamp>2015-06-07T19:44:25\
    \ UTC</timestamp>\n```\n\n```json\n{\n  \"data\": {\n    \"type\": \"gauge\",\n\
    \    \"name\": \"heartbeat-60s\",\n    \"min\":0,\n    \"max\":100\n  }\n}\n```\n\
    \nNo errors in the logs.\n\n```text\nprocess_data\nservice_data_file=/var/log/nginx/perferdata.log\n\
    service_data_file_template=$SERVICE_OUTPUT/$SERVICE_ID.PERFDATA\nservice_data_file_mode=master\n\
    service_data_file_perferdata_processing\nservice_data_file_processing=\nprocess-service-graph\n\
    ```\n\nIn templates:\n\n```text\ndef service name named-graph\naction_url show.cgi?host=$HOSTNAME&service=$SERVICE\n\
    ='graph'\noncmover=showGraphPopup(\"his\")\nonclickout=showGraphPopup()\n```\n\
    \n## Remote dial\n\nI am somewhat desperate, I have been looking for a solution\
    \ for days and have found nothing (and simply cannot believe that I'm the only\
    \ one thinking this)\n\nOkay, this is what I am looking for: Can I make my Android\
    \ dial a phone number to see the screen of my phone from anywhere? Give number\
    \ the signal of an email in Thunderbird, or if I go in, say, for the sake of Linux,\
    \ is it possible to do that for Windows? I see numbers on my screen on my smartphone\
    \ from anywhere. This is such a waste of time could be so much faster with the\
    \ right app!\n\nAnyone anyone have an idea? Or anyone around to help?\n\nRose\n\
    \nThere should be here a better method, really there are so many ways to use Android\
    \ over the network that it can stream my phone screen without prefix and corresponding\
    \ app you can use.\n\nThere are solutions! We would like to use Android to transfer\
    \ files and share at times, like messaging messages with calling calls. This can\
    \ easily copy and paste the phone number directly into the dialer and it will\
    \ make the call.\n\nAndroid requires an internet connection, so like Bluetooth\
    \ might work better. I also need a more connect with pop-ups and such touch into\
    \ the browser, and you can also call it through. google.com/apps/details?id=com.pushbullet.android.im_GB\n\
    \n![](img/78fc0912c436c898922acde3c325ec7a_90_0.png)\n\nAbove to connecting your\
    \ phone from a Linux PC you shouldn't be\n\n## ZFS updated date\n\nI am using\
    \ Arch, just updated and installed zfs-git from the AUR (which is the recommended\
    \ way to use it). I tried to start the zfs daemon with systemctl start.zfs. That\
    \ gave error:\n\nA dependency for zfs.target failed. See 'journalctl' for details.\n\
    \nWhat am I doing here?\n\nIf it's not displaying the graph properly, then you\
    \ might need to look at it temporarily Take a look in /log/nanographics/nanograph.graph.\
    \ Here's the nanografisroupoption file. It looks like:\n\n```text\n/log/nanographics=/var/log/nginx/\\\
    \n```\n\nthen you might need to change it:\n\n```text\n/log/nanographics/cgi-bin\n\
    ```\n\nThat should get the graph to display properly.\n\n# Questions & answers\n\
    Contact us...\nWeb: www.linuxuser.co.uk\nEmail: linuxuser@imagine-publishing.co.uk\n\
    \n## Pie solution\n\nI have a problem with Adobe Flash player that apparently\
    \ be fixed using Devil's Pie as a workaround, making it auto-start in Ubuntu 13.04\
    \ with Gnome.\n\nHere is what I managed to achieve after following the instructions\
    \ I was pointed to. Made the file /etc/devilspc.conf with the following content:\n\
    \n```\nstart on stop\nonrun on level [016]\n```\n\n```bash\nexec su - ben \"devilspie\"\
    \n```\n\nI wanted to test first if I could find it manually, but I couldn't understand\
    \ the output. Either way, since Devil's Pie is not working, it stays in the running\
    \ processes of System Manager.\n\nBen Harrington\n\nSince Devil's Pie is working,\
    \ you probably don't need to put it into roost. As for, I checked for the details\
    \ in journalctl -xe (or journalctl), and it says:\n\n## Q&A\n\nError was encountered\
    \ while opening journal files: Geen beschikbaar\n\n```bash\n# Get array port index\n\
    ArrayIndex=$(snmpwalk -v 2c $community\nswitchPort$etherStatsEntry.1 | awk\n'{print\
    \ $4}')\n```\n\nWhich translates to: \"No data available\", basically: Journal\
    \ files fail to be present and updated under /var/log/journal. Google failed me.\n\
    \n## Is it possible to get answers from switch?\n\nThe exit status of the last\
    \ command is evaluated '0' if True or '1' if False and intercepted by '$'. # Something\
    \ wrong echo \"SNMP IP address or SNMP not configured for.\"\n\nThis is not your\
    \ fault - I've installed everything correctly, the issue is that the system needs\
    \ to refresh configuration files and reboot for Linux. If that still doesn't work,\
    \ then completely remove the package and restart.\n\n```\nEXIT_UNKNOWN\n```\n\n\
    - Remove with apt remove\n- Download the tarballs from the ARC and extract\n-\
    \ Then make and make install -u for utils-gl, split-gl, zfs-init in that order.\n\
    \n## Exiting the code\n\nI'm writing a script to keep status counters under SNMP\
    \ queries. At some point, this script connects via snmp.\n\nTimeout: No response\
    \ on 10.68.254,245\n\nHow can I handle this in the script? The code doesn't work,\
    \ because I always get a '0' exit code. I noticed that:\n\n```bash\n# get array\
    \ port index\nArrayIndex=$(snmpwalk -v 2c $community\nswitchPort$etherStatsEntry.1\
    \ | awk\n'{print $4}')\n```\n\nand\n\n```bash\nsnmpwalk -v 2c $community\nswitchPort$etherStatsEntry.1\
    \ | awk\n'{print $4}')\n```\n\n| Name | Action |\n| --- | --- |\n| Blueheaven\
    \ | Add |\n| CarBoo | Edit |\n| Firefox | Edit |\n| Chrome | Edit |\n| Debian\
    \ | Delete |\n\nStartup Applications\n\nsync your free apps and connect to the\
    \ web startup configurations\n\ninitialize touchfiguration\n\nAbove Gnome's Startup\
    \ Applications helps you with graphical programs\n\nAbove Build your bash scripts\
    \ the right and careful way, and they'll work\n\n```bash\n# The exit status of\
    \ the last command is evaluated '0' if True or '1' if False and intercepted by\
    \ '$'\nif [ $? -ne 0 ]; then\n  echo # Something wrong\n  echo \"SNMP IP address\
    \ or SNMP not configured for.\"\n  exit EXIT_UNKNOWN\nfi\n```\n"
