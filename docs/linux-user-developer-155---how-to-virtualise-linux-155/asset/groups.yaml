    Finally, after months of waiting, the second Phone is upon us. The original BQ
    Aquarius 4.5 - a serviceable phone but poor specs and extremely early version
    of Ubuntu that accompanied it seemed a lot more like early development of what
    you''re using on a day-to-day basis. The low specs and shaky interface made enough
    that our review was somewhat less than positives. Put simply, the hardware needed
    to be better and the operating system needed much more help from the community
    and social media.


