    | 接收1670057 | 24bit |

    | 接收1670056 | 24bit |

    | 接收1670055 | 24bit |

    | 接收1670054 | 24bit |

    | 接收1670053 | 24bit |

    | 接收1670052 | 24bit |

    | 接收1670051 | 24bit |

    | 接收1670050 | 24bit |

    | 接收1670049 | 24bit |

    | 接收1670048 | 24bit |

    | 接收1670047 | 24bit |

    | 接收1670046 | 24bit |

    | 接收1670045 | 24bit |


    ## 控制软件


    这些是我从遥控插座控制器中嗅探的代码：


    ```bash

    sudo dpkg -i mongodb_2.1.1_armhf.deb

    # start

    sudo /etc/init.d/mongod start

    # setup

    sudo config set

    ```


    这里修改了 homecontrol.js。这是一个运行在树莓派上的 Node.js 自动化系统，通过 USB 向 Arduino 发送命令。虽然理论上某些情况下树莓派没有模拟输入输出，但
    LED 灯带是需要这些。


    ```bash

    https://github.com/liamfaser/homecontrol.js

    git clone

    npm install

