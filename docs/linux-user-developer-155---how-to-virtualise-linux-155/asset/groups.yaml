    ![](img/78fc0912c436c898922acde3c325ec7a_80_0.png)


    > 中国市场的一个热门品牌，美族通常制造 Android 设备，因此它对智能手机的设计和制造也很熟悉。


    # 优点

    - 比 Aquila 的机身漂亮得多，屏幕好得多——实际上可以与现代智能手机竞争


    # 缺点

    - 屏幕也绝对非常漂亮——与 Aquila 的老旧屏幕有巨大差异。凭借 5.5 英寸 IPS 面，它触摸明亮且质量良好。不过有些软件相当缓慢，尽管缩略图在高分辨率下有时会出现一些像素化。虽然硬件有了显著改进，并能与目前的智能手机竞争——但
    Ubuntu 操作系统并没有同等质量。


    - 应用程序的选择也没有改进。仍然存在发布时没有的一些范围，Ubuntu 手机的独特体验更好，但遗憾的是社区在填补文件空白方面很困难。这些重要应用程序真的需要为
    Ubuntu Touch 提供一些官方应用，特别是地图，以及通知并不总是像 Android 的拖放那样好用。


    - 所以，虽然 MX4 相比 Android 有改进，但它仍然有 Android 的早期问题，而且只有当 Ubuntu Touch 真正跟上同样的风格时，你才能获得良好的体验。如果你进行一种改变——一种全新的、独特且相当不错的用户体验和工作流——可以比
    Ubuntu Touch 做更多。


    你可以买一台 Windows 手机。


    # 总结

    [注：此处原文为 "Summary"]

    MX4 在你手里感觉像是一部正的现代智能手机，它拥有很棒的设计（即使不公平），并使用了市场上不错的组件和部件。说 MX4 受限于 Ubuntu 操作系统的限制是不公平的，但它仍然无法弥补
    Ubuntu 操作系统的局限性。


