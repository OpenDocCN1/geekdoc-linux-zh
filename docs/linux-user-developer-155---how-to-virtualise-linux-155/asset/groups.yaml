    # TOOLS FOR VIRTUALISATION


    Which hypervisor best suits your needs for virtualising operating systems?


    ## KVM


    USEFUL Emulation and virtualisation servers for more dedicated VMs


    KVM is the set of virtualisation modules that are built into the Linux kernel
    - not a keyboard and mouse switch. The benefit of having KVM built into Linux
    itself is that it makes easier to turn it into a dedicated hypervisor, maybe the
    kind you''d use on a server, without requiring extra layers of packages and other
    software on top of it. It is quick to set up especially with a graphical method,
    and it has some basic functionality between host and guest. It can be used on
    the command line easily if you plan to have a headless server.


    ## VirtualBox


    USEFUL Testing software, development or any kind of activity where you''d like
    to use a particular environment on your desktop


    VirtualBox is very popular among home users. It''s very simple to use, which is
    why it''s so popular. We use it all the time for testing, and it''s great for
    creating a separate distro or versions of a distro for testing software in development
    to see how it works under different conditions. It doesn''t quite have the efficiency
    of KVM as it runs roughly different within the operating system, but it''s much
    easier to use from the host system as you work on multiple things inside and outside
    the guest. Get it now from bit.ly/midas


    ## QEMU


