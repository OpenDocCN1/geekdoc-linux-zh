    # Tutorial Server logs


    # Log and monitor server logs


    # Discover about server status and logging in a web server, in addition to managing
    log files


    ![](img/78fc0912c436c898922acde3c325ec7a_31_0.png)


    Web servers are considered to be the easier targets for hackers. Since a web server
    is usually exposed to the entire universe, it’s pretty important to secure it.
    This is the reason sensitive information (such as credit card numbers) stored
    on a web server are always encrypted. Apache, despite its networking capabilities,
    is not immune.


    Apache is an open source web server and developers around the world keep working
    constantly in order to improve its performance.


    Apache enables you to monitor two types of information—server information and
    server status. As expected, server status is dynamic. By using Apache, it is possible
    to monitor some critical information such as the server’s uptime, number of requests
    received, total data transfer, and error codes.


    The mod_status module enables administrators to monitor server statistics. To
    view it, a page is created with server status statistics. The HTML page contains
    the following information:


    +   * Current time on the server

    * Time when the server was last requested


    +   * Total number of accesses served

    * Total bytes transferred by server


    +   * The current hosts and requests processed

    * Information about the current processes


    Please note that mod_status is not included in the standard Apache distribution.
    We thus need to add it to the configuration file and then make it to create a
    new executable. Once you have the mod_status module compiled and built into Apache,
    you will need to define a URL—Apache will use this URL to display the information.
    This is a way of telling Apache which URL will be used for serving the server
    status on the web browser. Now, let''s assume we want to use the URL:


    ```

    http://mydomain.com/apache-status

    ```


    Using the <Location ...>, you can tell the server status handler you want to handle
    in this URL using the server handler defined in the mod_status module. The following
    will do this:


    ```

    <Location /apache-status>

    ```


    ```

    serverlog server-status

    <Location>

    ```


    Apache comes with a few script to log the server_status—you can run this script
    in the support directory. This script is used periodically to store server status
    information. It is good to run this as a cron job to get the information on a
    desired time frequency. Before using it, you need to modify the value of the following
    parameters:


    ```

    loglevel

    Sport

    $request

    ```


    Knowing the status and configuration of your server is helpful in managing it.
    But who is accessing your server status is also important. By configuring the
    log directive in the mod_log, this module is responsible for basic logging. The
    Common Log Format (CLF) file is a set of files for each request. Each line is
    composed of tokens separated by spaces.


    If it does not have a value then it is represented by a hyphen. Here are the directives
    available in the mod_log config, so let us take a look at these to understand
    them about:


    The LogFile sets the name of the log file where the log information is stored.
    Each directive takes a file path or a pipe to a log program as the argument. If
    the log filename is set to /etc/log/access_log, the Server will write to it. The
    following Apache will send log information to /etc/log/access_log:


    ```

    TransferLog /logs/access.log

    ```


    LogFormat defines the format of the log file named by the TransferLog directive.
    LogFormat directive enables you to send logging information to a log file or an
    external program. Unlike the TransferLog directive,


