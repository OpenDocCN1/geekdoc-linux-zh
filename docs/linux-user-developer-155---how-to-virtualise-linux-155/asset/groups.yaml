    \ and the Perl version was modified in order to read a text file with the words\
    \ by line.\n\n| palindromeRev.txt: 0.018s |\n| palindromePoint.txt: 0.015s |\n\
    | palindromeArray.txt: 0.013s |\n| palindromeRev.txt: 0.017s |\n| palindromeArray.txt:\
