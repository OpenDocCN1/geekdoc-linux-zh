    # Feature How to envisage linux


    # VIRTUALISE WITH KVM


    A virtualisation tool built right into the Linux kernel, Kernel-based Virtual
    Machines are powerful and fairly easy to use


    Also known as Kernel-based Virtual Machine, this allows for a Linux distro itself
    to be the hypervisor for its virtual machines. This requires hardware virtualisation
    support in Intel and AMD processors (Intel VT-x and AMD-V, respectively), but
    supports a lot of Linux distros and other operating systems. It can be managed
    graphically like VirtualBox while also being a little more efficient in some cases.


    # Test compatibility


    It''s important to find out whether your system can actually run virtual machines
    using KVM, as it requires the hardware virtualisation support to be activated.
    To do this, open the terminal and use the following:


    ```

    $ egrep -c ''kvm*'' /proc/cpuinfo

    ```


    If it returns a number of "1" or higher, this means your CPU supports KVM, although
    you may need to activate it in the BIOS if your virtual does not work.


    KVM is good for both desktops and servers used for creating virtual machines,
    while being easier setup than VirtualBox, while being lighter than QEMU.


    Create and manage multiple virtual machines run on KVM using the VMM interface
    that also works with QEMU.


    Use the virtual machine with a powerful guest interface that enables some excellent
    host-guest controls


    ![](img/78fc0912c436c898922acde3c325ec7a_17_0.png)


    Run virtual machines with better efficiency than some other methods, thanks to
    it being tied directly to the kernel'
