    homecontrol.js 已经修改了  。在在启动之前，你需要知道树莓派的 IP。通过 ip 命令找到它。


    ```bash

    node /usr/share/arduino/libraries

    ```


    这里是 homecontrol.js 启动代码：


    ```bash

    node homecontrol.js

    ```


