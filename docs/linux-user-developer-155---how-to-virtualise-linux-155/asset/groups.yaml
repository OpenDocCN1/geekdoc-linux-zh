    \ 函数之前分析栈，会立即导致双重释放内存损坏错误。\n\n## 结论\n\n人们通常认为调试是一个运气问题，而不是专业问题。然而，没有专家认同这一观点。我们坚信，大多数软件相关问题都可以通过调试来解决，这篇文章提供了足够的证据：我们的\
    \ gdb 会话显示了应用补丁后的完全命中（左上角），而调试显示了段错误（左下角）。\n\n# 教程你自己的 Linux shell – 第 2 部分\n\n\
    这篇总结文章将向你展示如何改进 shell，这是揭示如何开发你自己的 Linux 文章的第二部分也是最后一部分。该 shell 的名称为 `lud`，其源码为\
    \ `file2`；`lud` 的初始版本是第一部分中第一个文件的副本。在这篇总结文章中，我们将添加一些功能来改进这个 shell。如果在任何一点你不完全理解发生了什么，最好的想法是回去重读第一篇文章，以避免陷入困扰。\n\
    \n### 01 创建 man 页（帮助页）\n\n正如每一个自律的 UNIX 程序一样，你将创建的 shell 将有一个页面。第一次生成 man 页并不容易——你能做的最好的事情就是获取一个现有的\
    \ man 页作为参考。man 页是用一种文本语言编写的，支持用于各种样式的大量宏包。\n\n### 02 关于 grep 的更多信息\n\n`grep`\
    \ 是 `tr` 的替代品，由 GNU 项目创建。你可以在 https://www.gnu.org/software/grep/ 更多关于它的信息。你通过执行\
    \ `./lud` 查看保存在 file1 中的 man 页。\n\n### 03 运行外部程序\n\n除非你正在启动内核本身，否则程序在 UNIX 上执行的唯一方法是使用\
    \ `exec` 系统调用。`exec` 家族系统调用的最重要的优势是安全性，因为无法溢出 `exec` 系统调用。\n\n## 资源\n\nUNIX 管理员，\n\
    程序员，\nOS 和 DBA 以及\n自 1993 年起一直是数学家\n\nGCC 编译器\n\n当你编写并实现一个新 shell 时，非常重要的一点是根据你的要求实现它，但不要忘记用户。Linux\
    \ shell 编程是一项艰巨的任务。这篇文章只是开始；后续的文章将讨论 Linux shell 编程的其他方面，包括进程、进程间通信、线程、高级 IO 和网络编程。\n\
    \n### 获取变量的值\n\n这部分关于获取一个已有的变量，即著名的 `PATH` 变量，它定义了命令的搜索路径。`PATH` 变量是 shell 中用冒号分隔的目录列表（例如），`environment(Variable)`\
    \ 显示了如何通过 `get` 命令获取已有环境变量的值。\n\n```\necho $PATH\n```\n\n### 为变量赋值\n\n定义新变量时最困难的部分是其实技术本身并不棘手，非常简单：这是你开发应用程序时的一个优势。\n\
    \n```ccase\n    printf(\"Enter the prompt: \");\n    prompt = strchr(copy, ':');\n\
    \    if (prompt) {\n        printf(\"%s\", prompt);\n        strcpy(prompt, line);\n\
    \        size_t len = strlen(line);\n        prompt[len] = '\\0';\n    }\nesac\n\
    ```\n\n展示如何使用系统调用超出了本文范围，但重要的是知道 `system()` C 函数实现了命令。后续的 UNIX 系统编程文章将详细介绍 `exec`\
    \ 家族系统调用。\n\n> 现在你应该能理解，环境变量在 shell 编程中起着关键作用\n\n### 实现环境变量\n\n在定义或更改环境变量之前使用一个关键字是常见做法。shell\
    \ 将使用它。`setenv()` C 函数的实现非常清晰：如果环境变量存在，它会为它们分配所需的空间。如果第三个参数（覆盖）的值不是 0，它将覆盖变量名的值——如果没有现有值，它会将新变量添加到环境中。\n\
    \n### 06 修改提示符\n\n现在可以更改提示符了。在这一步之后，你将学习使用 `prompt` 命令定义静态提示符。你现在可以使用静态文本作为提示符，但以后你需要动态提示符。C\
    \ 代码非常容易理解：当检测到 `prompt` 命令时，替换单词 \"prompt\" 并行的其余部分赋值给提示变量。在 C 提示符末尾添加一个空格使其看起来更好看。\n\
    \n| NAME |\n|---|-\n| lud - 这是一个 lud shell 的简单 man 页 |\n| SYNOPSIS |\n| lud |\n\
