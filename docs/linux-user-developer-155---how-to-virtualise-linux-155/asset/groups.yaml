    # DS115d AND DS215d

    THE PERFECT DATA STORAGE SOLUTION FOR YOUR HOME

    Run your own personal cloud from the comfort and security of your home


    ## POWER-SAVING AND RELIABLE

    DS215j features a dual-core CPU, supports up to 12TB of data and consumes less
    than 14w when active while the DS115j offers a stable storage environment for
    users with no need for raid, consuming less than 1w when active.


    ## ACCESS ANYWHERE, ANYTIME

    Synology NAS and the intuitive DiskStation Manager (DSM) software allows multiple
    users to sync and share files among devices, including Windows PC, Mac, Linux,
    iOS, Android and Windows Phone.


    ## MULTIMEDIA CENTRE

    Audio Station, Photo Station, Video Station and Media Server transform your Synology
    NAS into a centralised multimedia hub.


    Where to Buy

    ![](img/78fc0912c436c898922acde3c325ec7a_1_20.png)


    Synology apps available on

