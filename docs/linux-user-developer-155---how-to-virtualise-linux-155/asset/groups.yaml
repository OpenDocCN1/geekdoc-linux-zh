    ## 功能


    ## 设置您的控制界面


    现在是开始将我们的传感器和设备添加到 heimcontrol.js 中的时候了。


    ![](img/78fc0912c436c898922acde3c325ec7a_55_0.png)


    ### 01 开机自启动 heimcontrol.js

    在我们开始添加设备之前，在开机时启动 heimcontrol.js 是合理的。要做到这一点，我们可以在 `/etc/rc.local` 中添加一行，这是一个由
    root 用户在启动时运行的脚本。需要使用 `sudo` 和您喜欢的编辑器编辑该文件，例如：


    ```bash

    sudo nano /etc/rc.local

    ```


    在 "exit 0" 所在之前添加以下行：


    ```bash

    su pi -c "node /home/pi/heimcontrol.js/heimcontrol.js" &

    ```


    现在 heimcontrol.js 将从开机自动启动，但您现在可以通过 `node /home/heimcontrol.js/heimcontrol.js`
    手动启动它。


    ![](img/78fc0912c436c898922acde3c325ec7a_55_1.png)


    ### 02 添加摄像头流

    进入设置（Settings）并选择摄像头（Webcam），将方法设置为流媒体器（Streamer），您可以选择 `/dev/video` 作为设备。选择一个间隔，我们选择了两秒，但您可以选择任何喜欢的间隔。在树莓派
    2 上，较短的间隔更可行，因为它的响应更快。保存并返回首页。


    ### 03 准备远程控制字代码

    这里您需要之前提到的代码。Heimcontrol.js Web 界面将代码视为 1 和 0 组成的二进制字符串。然而，我们需要的代码格式不同，因此您需要使用
    Python 将其转换为二进制。在终端输入 `python2` 打开 Python 解释器。将您采集的整数格式化为二进制字符串，如：


    ```python

    >> "{0:b}".format(167380653)

    "111111110101110000111"

    ```


    heimcontrol.js 界面在移动设备上的运行效果非常好。


    ## 家庭自动化


    ## 扩展未来


    ### 设置多个系统

    既然您已经在一个房间里设置好了 heimcontrol.js，您可以通过设置多个树莓派来扩展系统，让它们与您在抽屉里收集的所有旧型号协同工作。您可以使用另一个树莓派，通过连接的网络反向以太网供电（PoE）。


    ![](img/78fc0912c436c898922acde3c325ec7a_56_0.png)


    ### 04 添加远程控制器

    进入设置（Settings）菜单并进入 Arduino 部分。点击按钮并将方法设置为 RC Switch（无线开关）。将代码类型设置为二进制。给它起一个名称，输入您计算出的
    RF 频率，并输入用于开启/关闭按钮的两个代码。返回首页测试开关是否工作。如果正常，只需确保发射器连接正确，就不需要在发射器上添加任何内容。


    在 Arduino 的脉冲宽度调制（PWM）上方。然而，一个波形占时间的 20%（即 300ms）。这控制每个 LED 的亮度，以从三种原色创建出任何颜色。


    ### 05 添加温度传感器

    温度传感器可能很复杂，因为需要校准。使用万用表非常好，您可以准确地测量模拟值。进入 Arduino 设置并添加传感器。在单位中选择 `°C` 和 `10`
    中的 `TMP36 (New)`。用万用表读取 718mv，这会将温度定在 21.8°C。通过公式进行实验，其中 $x$ 的真实值是您的传感器，或者会产生偏移。由于
    Arduino 具有 10 位数模转换器，它可以在 `0-1023` 之间读取高达 5V 的电压。然后您必须完美匹配，否则传感器如果简单地尝试将您字符串化就会崩溃。


    #### 远程访问

    如果您想远程访问您的自动化系统，可以使用动态 DNS（DDNS）提供商，这样每个房间都可以让您创建一个始终指向您地址的书签。然后，如果您在路由器上使用 SSH
    尝试连接树莓派，您可以在任何地方 SSH 进入它（当然，您需要更改默认端口 22 以实现此目的）。然后，您可以将 homecontrol Web 界面端口转发到您的本地机器。我们在之前的一份树莓派文件中发现过，可以通过访问
    `raspberrypi.local` 查看（而不是使用端口 8080。要使用端口 8080.）。


    #### 设置音频系统

    家庭自动化的一个很好的补充是某种多房间音频系统。如果每个房间都有一个树莓派，您需要为每个房间准备一个廉价的功率放大器和一个书架扬箱来启动它。一对 PC 声箱也可以。如果您只想让其中一个扬箱工作并支持
    Web 界面。或者，可以考虑设置 Squeebox，这是一种由罗技开发但现已开源的多音频软件。


    ![](img/78fc0912c436c898922acde3c325ec7a_56_1.png)


    ### 06 添加 LED 灯带

    最后，是添加 LED 灯带了。确保电线连接到支持 PWM 的引脚上。


