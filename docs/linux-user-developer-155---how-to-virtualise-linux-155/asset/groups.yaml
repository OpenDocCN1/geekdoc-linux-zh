  - '[PAGE 32]


    Note that 206.171.50 will be replaced with your network address.


    # Log files in Apache


    Cookie directive - Sets this filename for the logging of cookies. The filename
    is relative to the ServerRoot.


    If you want to see the total number of unique hosts who have accessed your web
    site, the following command can be brought into play:


    By default, Apache provides two log files, located in the logs directory of your
    installation - they are access and error logs. The access log file contains the
    requests that have been served and the error log file contains the error conditions.


    Sometimes it is necessary to create multiple log files. You can create multiple
    log files easily using the TransferLog and/or the Custom directive of mod_log_module.
    You need to repeat these directives for each log file. For example, if you want
    a standard access log and a log of all URLs, you can do them using the following
    line:


    ```

    cat my_path/http/access_log | awk ''print $1'' | grep "206.171.50" | wc -l

    ```


    As expected, you will be able to save a log to files, but the logs do some extra
    work for you - they need to be managed. Apache sites with high traffic grow log
    files very quickly. This could cause a disk crash when log files become very large,
    the usual mechanism is to rotate them


    +   * TransferLog /access_log

