    # School Pi


    Hi there! I was very interested to read your tutorial on using the Raspberry Pi
    in the last issue - I teach at a school that has a classroom full of Pis and sharing
    comes a few times in our discussions. Can you recommend any VNC software for the
    Pi with a more-like approach, and what else might benefit to look?


    Karen Watts


    Heran — glad you found our guide useful! We were not aware of any VNC software
    for the Raspberry Pi that specifically takes a helpdesk approach, unfortunately.
    We mean so that students can, for example, click something on the Pi desktop and
    then have the teacher step in with remote control? If that''s the case you can
    probably achieve the same thing by dropping the script to start the VNC server
    onto the Raspberry desktop and giving it it. Another option would be to look into
    RealVNC''s new SDK, which enables you to create custom VNC client and server helpdesk.
    If you have an IT department playing around for other recommendations, we found
    of PiNet (pinet.org) it''s a great system for centralising user accounts so that
    any student can log in on any Pi on the network, and it also comes with shared
    folder and automated backup. Screen sharing aside, this is certainly one of the
    best projects we''ve created using the Raspberry Pi in the classroom.


