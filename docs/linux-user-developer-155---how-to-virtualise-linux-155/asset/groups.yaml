    # Install KVM


    Once you''re satisfied about whether your VMS will work or not, it''s time to
    install KVM – although it is part of the kernel, it''s not automatically activated
    at the time. To do this easily, simply open the terminal and use them:


    ```

    $ sudo apt-get install qemu-kvm bridge-utils

    ```


    This is purely the command line version, if you want to add the graphical tools
    (which we''re covering), you can install them:


    ```

    $ sudo apt-get install libvirt-bin virt-mager

    ```


    Normal users can''t use VMS, so you need to elevate any non-root users you''d
    like to access them by adding them to groups with the correct permissions. The
    group is libvirt, and you can also use your own username with:


    ```

    $ virsh <qemu>/system list

    ```


    Log out and back in, and check to make sure it worked by:


    It will then list all of the running VMs, at the moment it will be none.


    ![](img/78fc0912c436c898922acde3c325ec7a_18_0.png)


    # 04 Create a virtual machine


    In the menus of your distro there should be to find the Virtual Machine. Open
    it up and you will be greeted by the graphical interface. From here you can make
    a bit of creating your virtual machine by first clicking on ''Create a new virtual
    machine''.


    We''re going to be using an ISO, so that and select the ISO you want to use. Give
    the VM a set amount of RAM (we like to give with half of what you have, but to
    refer to on CPU usage specifics for the matter), and an amount of storage memory.


    # 05 CPU usage


    On all of these virtual machines we''re creating, having to set a CPU core from
    the host machine. Like RAM you can use about half the available cores without
    consuming too much for the host system. If you plan to host multiple guests (normal
    user), it might be better to only use a few resources for each one, otherwise
    this will mean your virtual machine''s performance drops. Play around with multiple
    and see what suits best.


    ![](img/78fc0912c436c898922acde3c325ec7a_18_1.png)


    # 06 install the virtual machine


    Click and finish then use the VM once it''s all ready to go. Depending on your
    distro, you''ll go through a different install process - major distributions will
    be able to recognise and how to install with little trouble. Unlike VirtualBox,
    you don''t have the right-Control button to use as ''host key'', so you''ll have
    to manually fullscreen and fullscreen-screen.


    ![](img/78fc0912c436c898922acde3c325ec7a_18_2.png)


    # 06 Manage virtual machines


    When virtual machines can be paused, forced out, reset and have reboot and shutdown
    shortcuts to you. You can use the ''Send key'' in the interface while it''s running
    to switch between the standard of Chrome OS or Linux using the ones keys to go
    between different instances.


    You can''t modify the virtual machines, but you can create more to different specifications,
    or delete them if they start over. You can also use ''Redirect USB device'' from
    the ''Virtual Machine'' menu on the top bar, allowing you to access external storage.


