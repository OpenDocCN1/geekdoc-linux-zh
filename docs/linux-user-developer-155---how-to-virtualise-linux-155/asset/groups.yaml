    # AWS 上的 NGINX 教程


    GNU/Linux 上的 NGINX

    在 AWS GNU Linux 云端运行的 NGINX 为您提供了一个灵活的开源 Web 服务器企业级基础设施，您可以用家庭预算进行设置和运行。如果免费可用资源不完全符合您的需求，可以使用
    NGINX 构建您自己的自定义系统。


    ![](img/78fc0912c436c898922acde3c325ec7a_29_0.png)


    如果您在启动时为实例添加了任何额外卷卷（随 AMI 附带的卷），现在是对它们进行格式化、挂载并将它们添加到 /etc/fstab 的时候。在 AWS 上，您可以在
    AWS 管理界面的 Elastic Block Store 部分创建额外的云卷，并将其附加到已运行的实例。


    ## 08 获取 root 权限


    接下来，使用命令：


    ```

    sudo su

    ```


    ... 以获取 root 权限。


    ## 09 从二进制文件安装 NGINX


    现在使用此命令安装 NGINX：


    ```

    yum install nginx

    ```


    由于您的 Amazon Linux 上没有安装 Apache，因此不需要将其删除。


    ![](img/78fc0912c436c898922acde3c325ec7a_29_1.png)


    ## 06 为您的域名设置名称服务器


    为了在您选择的注册处为您的域名配置 NS 服务器，请在域名相应的表单中输入 DNS 服务器的主机。如果您使用 Route 53 作为 DNS 服务，NS 服务器列在域名
    Route 53 托管区域（Hosted Zone）部分。它们看起来如下：


    - ns-1234.awns-12.co.uk

    - ns-4321.awns-56.com

    - ns-1321.awns-24.org

    - ns-9876.awns-99.net


    您需要在注册商维护的域名配置中设置 NS 服务器。要验证设置是否正确，可以使用免费服务 intools 对您的域名进行诊断：


    ```

    http://intools.com/

    ```


    除非您打算为域名租用邮件服务器，否则可以忽略忽略任何关于缺少 MX 的投诉。


    ## 07 连接到您的 Linux 实例


    此时，您的实例应该已经通过健康检查且状态为“运行（running）”。导航到控制台的实例列表，从列表中选择您的实例并点击连接（Connect）按钮以查看连接说明。启动
    SSH 连接并输入类似以下的内容：


    ```

    ssh -i /path/to/yourPrivateKey.pem ec2-user@XX.XX.XX.XX

    ```


    用户名通常是 ec2-user 或 root，从技术上说，AMI 的创建者可以将其设置为他们想要的任何值。如果您的实例用户不是 root，您可以使用以下命令获取超级用户权限：


    ```

    sudo su

    ```


    ## 10 编辑 /etc/nginx.conf


    NGINX 将其配置文件保存在 /etc/nginx.conf 中。使用您喜欢的编辑器打开主配置文件：


    ```

    worker_processes auto;

    Start-NGINX

    service nginx start

    ```


    现在，当您使用服务器的 IP 地址或域名时，将使用随处带有的 /usr/share/nginx/html 的通用测试页面。


    ## 11 设置虚拟主机


    NGINX 虚拟主机的默认配置存储在 /etc/nginx.conf/ 中的配置文件中，但有一种更优雅的方法使用 sites-enabled 和 sites-available
    来管理这些设置。请创建这些目录：


    ```

    mkdir /etc/nginx/sites-enabled

    mkdir /etc/nginx/sites-available

    ```


    > 默认情况下，Linux 中的 Web 服务器 NGINX 将配置文件存储在目录 /etc/nginx/conf.d 中


    打开配置文件 /etc/nginx/nginx.conf 并创建一个链接到：


    ```

    include /etc/nginx/conf.d/*;

    ```


    ... 带有哈希 NGINX 将忽略它：


    ```

    include /etc/nginx/conf.d/*;

    ```


    在下一行，告诉 NGINX 读取 /nginx/sites-enabled 目录的内容：


    ```

    include sites-enabled/*;

    ```


    对于每个您想要链接到 sites 目录的网站：


    ```

    touch /etc/nginx/sites-available/www.mydomain.com

    ```


    为了启用它，在 sites-enabled 目录中创建其配置的链接：


    ```

    ln -s /etc/nginx/sites-available/www.mydomain.com /etc/nginx/sites-enabled

    ```


    到目前为止，您的配置文件只是一个空占位符。


    ## 13 支持的数据库


    在本教程的设置中，NGINX 可以提供静态页面。为了使用服务器端脚本（例如作为 CMS 系统的引擎），您将需要为您选择的脚本语言（PHP, Perl）安装
    MySQL/MariaDB 等 Web 服务器。所有所需的服务将在启动时自动启动。对于 NGINX，这是：


    ```

    chconfig --le=2345 nginx on

    ```


    ## 14 启动 NGINX


    在提示符处输入此命令：


    ```

    service nginx start

    ```


    ... 手动启动 NGINX。


    ## 15 为您的网站创建根目录并测试页面


    在站点配置文件（步骤2）中 location (/) 指定路径下创建网站的根目录：


    ```

    mkdir /usr/share/nginx/www/my-website.com

    ```


    ## 12 编辑您的站点配置文件


    使用您喜欢的文本编辑器打开站点配置文件：


    ```

    /etc/nginx/sites-available/www.mydomain.com

    ```


    要告诉 NGINX 如何处理对该站点的请求，您需要在配置(server)中定义它：


    ```

    server {

    listen 80;

    server_name www.mydomain.com;

    # 其他在此

    }

    ```


    NGINX 配置文件的每个部分定义了 location 并为站点的目录设置特定属性。这就是您如何定义 Web 文档的位置以及各种类型内容的优先级顺序：


    ```

    location /

    root /usr/share/nginx/www:my-website.com;

    index index.html index.htm;

    ```


    调整根目录树的权限：


    ```

    chown -R nginx:nginx /usr/share/nginx/www/my-website.com

    ```


    调整根目录树的权限：


    ```

    chown -R nginx:nginx /usr/share/nginx/www/my-website.com

    ```


