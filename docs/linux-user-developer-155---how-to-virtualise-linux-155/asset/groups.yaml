- md: "\n# Tutorial Linux\n\n# Print variables\n\n# Understanding the echo command\n\
    \nIt is now time for you to learn about the implementation of the echo command.\
    \ The algorithm is pretty simple: it removes the \"echo\" word and the additional\
    \ space, then prints the rest of the line without any additional processing. Its\
    \ output is the following: Running the command without additional parameters prints\
    \ all variables. So, when the user enters the command, it shows all variables.\
    \ This is helping understand environment variables. Look at the implementation\
    \ of printenv().\n\n```bash\n$ echo hello\nhello\n```\n\n```bash\n$ echo $VERSION\n\
    Linux version 5.4.0-generic (Ubuntu x86_64)\nWelcome to Ubuntu\n programs included\
    \ are free software; the user manual for each program is described in manual files\
    \ in /usr/share/man/*\n```\n\n```bash\n$ echo $HOME\n/home/user\n$ echo $USER\n\
    user\n$ echo $SHELL\n/bin/bash\n$ echo $PATH\n/usr/local/sbin:/usr/local/bin:/sbin:/bin\n\
    ```\n\n# Implement message of day\n\nIn the previous task, we used a quick and\
    \ dirty implementation of the \"message of the day\" functionality. A more professional\
    \ and robust implementation would be instead of using unsafe call(), a proper\
    \ command that can read it and show the appropriate message. As you can understand,\
    \ it is bad to begin with a quick and dirty solution to get the right thing as\
    \ you are not yet writing production code!\n\n# Print the number\n\nThis part\
    \ will show you how to add a command to the shell. The -v command will print just\
    \ the version number of the shell without executing the shell itself if the shell\
    \ is a regular command. If you execute -v, you are getting the following: shell\
    \ version 1.0\n\nThe main reason for using a function (version()) is consistency.\
    \ The result is that if you ever decide to change functionality of the -V parameter,\
    \ it will be easier for you to make the changes.\n\n```c\nint i = 0;\nfor (i =\
    \ 0; i < argc; i++) {\n    // If the -V parameter is given,\n    // print the\
    \ version and exit\n    if (strcmp(argv[i], \"-V\") == 0) {\n        version();\n\
    \        return 0;\n    }\n}\n```\n\n# The return function\n\nThe return function\
    \ does a very important job: if the program is a built-in command or not, it returns\
    \ the exit code of the command inside the shell. If no, it returns -1; a return\
    \ value that cannot be a valid index in the array indicating that the command\
    \ failed and should be executed as external command.\n\n# Some theory\n\nThe code\
    \ for implementing the previous step uses two groups, which are named argc and\
    \ argv. The first holds the total number of elements in the array. argv is able\
    \ to hold all command arguments, including the name of the executable that is\
    \ always assigned to argv. Therefore, argv is assigned its value.\n\n# Use a C\
    \ function for each command\n\nThis part is about implementing each of the built-in\
    \ commands using a separate function. By simply grouping each into a separate\
    \ function, the method that we have presented here for processing simple line\
    \ options; however, you should be aware that advanced techniques exist when you\
    \ don't want to process more complicated line arguments. So, each branch of the\
    \ statement will contain just one case; the key point is that this makes your\
    \ program easier to read. The key point here is that you should not forget to\
    \ pass the input line to the function when needed.\n\n```bash\n$ vi msouk@~/docs/article/working/UNIXshell2.LUD/code\n\
