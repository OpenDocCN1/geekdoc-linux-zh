    ## VirtualBox extensions


    There''s proprietary extensions pack by VirtualBox:

    - Remote Desktop support to run a VM on one host machine from another, for which
    you need a powerful server for multiple guest types.

    - The pack can also enable USB 3.0 (EHCI) controller, remote booting via mapping
    of the Intel PXE ROM, the system''s webcam, and more.


    Your disk drives and ISOs mounted on virtual drives can be selected using the
    drop-down menu.


    Above Adding your USB device to the Filters disconnects it the host when you run
    the guest, freeing it for use.


    ### # VIRTUALISE WITH QEMU


    Get to grips with this manual virtualisation software that has a more controllable
    elements and a little more power


    ```bash

    sudo apt update

    sudo apt install qemu-kvm qemu-system-x86 qemu-system-arm

    ```


    ## 03 Emulate x86


    Make sure you have an ISO downloaded, then put it into the qemu working directory
    to make launching easier. That''s done, much faster than usual.


    ```bash

    $ sudo qemu-system-x86 -hda vdh.img -cdrom [ISO].iso -m 2048 -boot d

    ```


    ... with being it might be a little slower than the other virtualisation solutions
    because it''s actually emulating the system, but it will work.


    QEMU is not so much virtual software as it is an emulator, allowing you to run
    on x86/x64, though it allows you to emulate ARM, MIPS. It is a bit trickier than
    with VirtualBox. However, you can run an image of hard drive.


    ## 04 Install on virtual drive


    Go through the installation procedure for your OS (make sure you make a big virtual
    drive), and again, it will take a little longer than usual. Once it''s installed
    and you can turn it back on using:


    ### 01 Get QEMU


    First we need to install QEMU on your system - it''s supported by most Linux repositories,
    in Ubuntu you will find it with something like:


    ```bash

    $ sudo apt install qemu

    ```


    For Fedora you will use yum install, if you''re a sysadmin, then you would want
    to build from source to make sure it works on your source - it is available at
    https://www.qemu.org/download/


    ### 02 Create a virtual drive


    You can create some virtual space to use while emulating the operating systems
    and distros, which is useful for saving data, and you can even install it if you
    wish. In the terminal you can do this by using:


    ```bash

    $ sudo qemu-img create vdh.img 20G

    ```


    This creates a 20 GB hard drive, although you can make it as large or small as
    you want. It will possibly keep it in a working directory.


    ### 05 Emulate ARM


    This can be used to emulate the Raspberry Pi as other things, and it is a good
    way to test software that run on ARM versions of other devices if you want access
    to a device. This requires a little change of the initial run command to like:


    ```bash

    $ sudo qemu-system-arm

    ```


    ... with the relevant image and RAM details (the -m option) to suit the system.


    ### 06 Emulate MIPS


    Using QEMU to emulate ARM, this allows you to test things on MIPS hardware. It''s
    supported on QEMU among many other types of CPU architecture, and for this you
    need to use the qemu-system-mips to run an image or operating system. There''s
    also support for MISEL and MIPS64 if you need so, just change the command to qemu-system-misel
    and qemu-system-mips64.


