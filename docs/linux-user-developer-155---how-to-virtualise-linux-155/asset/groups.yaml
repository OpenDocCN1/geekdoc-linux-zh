    # 欢迎阅读第 155 期 Linux User & Developer


    ## 本期内容

    - 使用 Pi 进行家居自动化

    - Linux 虚拟机虚拟化

    - 软件调试技术

    - 美出 MX4 Ubuntu 版测评


    ## 每期都让 Linux User 更加实惠 第 22 页


    Rob Zetsloot 是一位航空航天工程专家，使用 Python 对复杂模拟进行建模。最近，他险些放弃了 iPad 职业生涯，现在他正使用 Pi 协调一组
    Linux 虚拟机（第 24 页），并用 Python 编写一部视觉小说（第 62 页）。他梦想着 Ubuntu。


    Jon Master 是一位内核黑客，从事 Linux 工作已有 19 年，他首先就读于英国大学，住在马萨诸塞州剑桥，在一家企业 Linux 供应商工作。你可以在第
    10 到 13 页找到他。


    Liam Fraaser 是 RaspberryPi/YouTube 记者，并担任 RaspberryPi 的 Linux 服务器管理员志愿者。在第 50
    页可以了解他是如何设置 RaspberryPi 的，包括视频门铃、DC 灯光、插座和鼠标。


    Mihalis Toukalos 是一位 Linux 系统管理员，在编程、数据库和数学方面拥有专长。他自 1993 年以来一直使用 Linux。本月他将关注
    C# 程序员（第 11 列），关于他的两部分内容，请参阅第 44 页获取一些出色的编程建议。


    Dan Alder 是 Pi 认证教育员也是 CAS 的首席教练。他热衷教学、黑客技术和项目，并利用这些项目吸引学生参与学习。在第 38 页，他展示了如何为他上个月开始构建的
    Pi 构建软件模块。


    Gareth Halifer 是我们的驻驻记者，为您带来世界各地的最新动态。在第 6 页中，他列出了如 Banana Pro 等笔记本电脑——看看这第二代
    Banana SRC 相比 Pi 2 表现如何。


    欢迎阅读最新版本的 Linux User & Developer，这是英国和美国最喜爱的 Linux 和开源杂志。


    容器（Containers）现在在公众中备受关注，特别是近期如 Open Container 的发布等进展，但虚拟机尚未消失——正确的混合方案可能比使用任何一种工具都获益。本月我们将向你展示如何运行
    VirtualBox、QEMU 和 KVM：这三项工具将使你能够创建强大的无头服务器、创建不同的处理器架构，并创建你所需的测试环境，或保留旧的操作系统环境。


    我们本月还将讨论如何使用 Raspberry Pi 以及一个名为 Home 的 Node.js 项目，通过传感器、摄像头和视频通过简单的 Web 界面控制家居（第
    50 页）。我们还评测了一些优秀的桌面服务器、Ubuntu 和 Debian，并以他们上个月开始的 Linux Shell 和可穿戴元素作为结尾。想知道我们对最新美出
    MX4 的看法，请前往第 80 页告诉我们你的想法。


    Gavin Thomas

