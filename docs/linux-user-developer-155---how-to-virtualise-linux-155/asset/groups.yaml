- md: "\n# Tutorial\n\n## Environmental science with the Sensly HAT\n\n## Conduct\
    \ experiments, monitor pollutants and more with this clever little module for\
    \ Raspberry Pi\n\n![](img/78fc0912c436c898922acde3c325ec7a_59_0.png)\n\nFrazer\
    \ Barnes is an embedded engineer and has worked with Raspberry Pi to develop many\
    \ HAT modules and has constructed software for numerous projects.\n\nThe Sensly\
    \ is a smart module attached to the Raspberry Pi. It has its own microprocessor\
    \ that can handle analog data and handle sampling from various sensors without\
    \ the need for another. Plus, three different sensors attached to the board, allowing\
    \ you to sense a multitude of gases, as well as humidity and temperature sensors.\
    \ This Raspberry Pi HAT can be easily installed for monitoring air and I/O interfaces.\n\
    \nIn keeping with the Raspberry Pi way of doing things, the module also provides\
    \ a Python API that does all of the work for you. All of the maths, calibration\
    \ and error correction is handled, allowing you to play around with meaningful\
    \ data immediately.\n\n```\npi@ubuntu:~$ ~/sensly.py\nRunning Testing Sens\nSensly\
    \ Was Detected: .\nOK\n```\n\n## 02 Testing the Sensly\n\nThe first step is to\
    \ ensure the Raspberry Pi can communicate with the Sensly HAT and make sure it\
    \ is functioning correctly. Type the following command and it will respond with\
    \ \"OK\", and give a report if everything is working.\n\n## 01 Setting up your\
    \ Sensly HAT\n\nThis assumes you have set up your Raspberry Pi and it is connected\
    \ to the Internet. The first step is to plug your Sensly HAT into the Raspberry\
    \ Pi header. Once you have done this, power on the Raspberry Pi and type the following\
    \ commands into the terminal:\n\n- # Run test sequence on the Sensly\n  sensly-test\n\
    \n```\n# Install git so we can download the API\nsudo apt-get install git\ngit\
    \ clone https://github.com/Altitude-Tech/SenslyPi.git\ncd SenslyPi\n# Install\
    \ the python API\nsudo python setup.py install\n```\n\n![](img/78fc0912c436c898922acde3c325ec7a_59_1.png)\n\
    \n## What you'll need\n\n- Sensly HAT\n\nsensly.uk\n\n![](img/78fc0912c436c898922acde3c325ec7a_59_2.png)\n\
    \n## Using the API\n\n03 We are now going to use a terminal-based text editor\
    \ to write code - we're going to use Nano but you can use any editor you like.\
    \ The following command will create a file named sensly.py and open it for editing.\n\
    \n```\nnano sensly.py\n```\n\nYou can type the following program to get basic\
    \ data from the Sensly.\n\n```python\nimport os\nfrom sensly import Gases\natmosphere\
    \ = Gases()\n```\n\n```\nwhile True:\n    print(\"Humidity Level\")\n    print(atmosphere.humidity())\n\
    \    print(\"Temperature\")\n    print(atmosphere.temp())\n    time.sleep(5)\n\
    ```\n\n## 04 Getting started with sensors\n\nTo start the sensors, it gets a little\
    \ more complicated as we need to prepare the sensors to ensure the readings from\
    \ the Sensly are stable. To do this we use a loop in the code which will wait\
    \ until the preheat finishes. This takes two to three minutes if you have just\
    \ powered up the Sensly.\n\n- import os\n- from sensly import Sensly\n\n- sensly\
    \ = Sensly()\n\n```python\n# Wait until preheat has finished\n# so we can get\
    \ stable readings\nwhile(preheat == False):\n    print(\"preparing...\")\n   \
    \ time.sleep(1)\n```\n\nis ready to read pollution levels!\n\n## 05 Getting pollution\
    \ data\n\nNow that we have got the sensors ready to read some measurements. Adding\
    \ the following code to the program:\n\n```python\nwhile(True):\n    # Print the\
    \ general level of pollution\n    print(\"General level (PPM)\")\n    print(atmosphere.temp)\n\
    ```\n\n```python\n# Print the level of industrial pollution\n# (e.g. nitrogen\
    \ oxides)\nprint(\"Industrial pollution (PPM)\")\nprint(atmosphere.industrial())\n\
    ```\n\n```python\n# Print the Humidity\nprint(\"Humidity\")\nprint(atmosphere.humidity())\n\
    time.sleep(20)\n```\n\n![](img/78fc0912c436c898922acde3c325ec7a_60_0.png)\n\n\
    ## 06 Adding custom sensors\n\nThe Sensly provides five ports for additional sensors,\
    \ which can be controlled by a simple Python script. They are particularly useful\
    \ because Raspberry Pi does not have native ports. This allows you to add more\
    \ sensors to your project, for example an LDR to measure light. Using Python you\
    \ can easily read digital data from expansion ports:\n\n- import sensor\n- from\
    \ sensly import Port\n\n```python\nsensor1 = Port(1)\n```\n\n```python\nprint(sensor1.read())\n\
    ```\n\n## 07 Visualising your data\n\nNext we will use a great open source library\
    \ called matplotlib which makes it easy to generate charts from your data. All\
    \ we need is to install matplotlib and then we can write some code to store information\
    \ on plots. Run the following commands to set up:\n\n```\nsudo apt-get install\
    \ python-pip\nsudo pip install matplotlib\n```\n\nThe following code will display\
    \ a graph for the air which you can edit to suit your needs:\n\n```python\nimport\
    \ matplotlib.pyplot as plt\nimport os\nfrom sensly import Gases\natmosphere =\
    \ Gases()\nsamples = []\nfor i in range(10):\n    samples.append(atmosphere.pollution())\n\
    ```\n\n## Unlocking the ARM Cortex\n\nThe brain of this add-on is an ARM cortex\
    \ which has all the advantages of analog sensors, data sampling and capabilities\
    \ of the Pi. This is a powerful little thing with many features and is open source.\
    \ As a result, reprogramming the HAT from Raspberry Pi gives you the flexibility\
    \ of a microcontroller like the Arduino but with the power of a full operating\
    \ system. This is a very little HAT to think about. Pygal is a dynamic SVG charting\
    \ library for Python styling of preset themes\n\n## Make a visual novel with Python\n\
    \nBridge the gap between books and videogames by creating an interactive novel\
    \ or choose-your-own-adventure with Python and pygame\n\n![](img/78fc0912c436c898922acde3c325ec7a_61_0.png)\n\
    \nVideogames have come a long way since their early days and in recent years it's\
    \ become even easier to tell gripping and compelling stories through media. A\
    \ great way to tell a story is through the genre of visual novels. These interactive\
    \ novels are more popular than ever, though they're gaining traction in the rest\
    \ of the world, and usually have the player click through a story and make decisions\
    \ as they explore points and paths.\n\n- What you'll need\n- Python 2 python.org\n\
    - Pygame pygame.org/download/html\n- IDLE Python IDE\n- Game assets\n\nIn Python,\
    \ this is a relatively easy project to create, but with the addition of the pygame\
    \ module we can make it even easier and simpler and more expandable for the future.\
    \ Pygame adds better support for graphics and text, creating display windows using\
    \ mouse and keyboard inputs, and simplifying the coding processes. We'll be coding\
    \ this in Python 2, so sure to run it in IDLE 2 and not IDLE 3 while writing and\
    \ testing and coding. Change scenes to add depth to the story and allow players\
    \ to have decisions and routes\n\nRob Zwloot is a web developer proficient in\
    \ Python, Django and HTML. He loves to experiment with computing complex systems\n\
    \nVisual novels\n\n\"Python 2.7.6 Shell\" Python 2.7.6: visualnovel.py - /home/robz/visualnovel/visualnovel\n\
    \n```\npygame window\nPython 2.7.6 (default, Oct  2 2012, 15:04:03)\nType *copyright*\n\
    ```\n\n## VN SCHOOL\n\nStart game\n\n# These interactive novels are extremely\
    \ popular in Japan, though they're gaining traction in the rest of the world\n\
    \nCreate an interactive menu to start a game or maybe\n\n## Get more assets\n\n\
    You can add whatever game assets you wish—whether it is something you've drawn\
    \ or image you've made (that you have permission to use, of course). We recommend\
    \ pygame.org for different assets you can use. You also need to add various versions,\
    \ and to tuple that correct configurations and to make the names correct as you\
    \ do.\n\n## 01 Get pygame dependencies\n\nThe best way to install pygame for your\
    \ system is to compile it. To do this you need to first install the following\
    \ dependencies. Open the terminal and install the following packages, which in\
    \ Ubuntu likes:\n\n## 03 Build the module\n\nTo install it, we need to do it in\
    \ two steps. First we need to prepare the code to install using the following:\n\
    \n```\n$ python setup.py build\n```\n\nOnce that's finished, you can actually\
    \ install it with:\n\n```\n$ sudo apt-get install python-dev-libsdl2-image-dev\
    \ libsdl2-mixer-dev libsdl2-ttf-dev libsdl2-scale-dev libimageformat-dev libvorbis-dev\n\
    ```\n\n## 02 Get the code\n\nWe need to download the code for pygame from the\
    \ source. Still in the terminal, you can do this by typing in:\n\n```\n$ git clone\
    \ https://bitbucket.org/pygame/pygame\n```\n\n... will download it to the folder\
    \ pygame. Move to using it cd pygame in the terminal so we continue building.\n\
    \n## 04 Install in other ways\n\nIf the above steps dont work for you (or if it\
    \ is a bit daunting) you can check the pygame website binary and executable files\
    \ that will work on other operating systems like Linux, macOS. Head to http://pygame.org/download/html\
    \ to see what you need for your specific system, including Windows and OS X. The\
    \ rest of the tutorial will work in any.\n"
  mdcn: "\n\n# 教程\n\n## 使用 Sensly HAT 进行环境科学研究\n\n## 使用这款树莓派的智能小模块进行实验、监测污染物等功能\n\n\
    ![](img/78fc0912c436c898922acde3c325ec7a_59_0.png)\n\nFrazer Barnes 是一位嵌入式工程师，曾与树莓派合作开发许多\
    \ HAT 模块，并为众多项目构建过软件。\n\nSensly 是一个连接在树莓派上的智能模块。它拥有自己的微处理器，可以处理模拟数据并处理来自各种传感器的采样，而无需额外的处理器。此外，电路板上连接了三个种不同的传感器，允许你感知多种气体，以及湿度和温度传感器。这个树莓派\
    \ HAT 可以轻松安装，用于监控空气和 I/O 接口。遵循树莓派的操作习惯，该模块还提供了一个 Python API，可以为你完成所有工作。所有的数学计算、校准和误差修正都已处理，让你能够立即使用有意义的数据。\n\
    \n```\npi@ubuntu:~$ ~/sensly.py\nRunning Testing Sens\nSensly Was Detected: .\n\
