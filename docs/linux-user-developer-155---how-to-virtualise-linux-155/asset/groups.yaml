    ## 图形化 SSH 客户端评测


    ## 简而言之：对比结论


    | PuTTY | ClusterSSH | SecPanel | Secure Shell |

    |---|---|---|---|

    | 连接选项 | 为用户为设置所有这些连接提供了良好的基础选项 6 | 令人失望的是模糊，且它不会记住任何连接 3 | 提供许多选项和自定义功能，可方便你建立的连接
    8 | 可以创建并保存所有连接以及密码，但没有保存功能 7 |

    | 多重连接 | 虽然可以正常工作，但确实需要重启核心程序 | 这显然是 Cluster 的主要卖点，而且运行得非常好 | 这种很好：通过运行 Cluster
    的方式使其变得更加实用 8 | 避免多重连接——你必须重启程序，这非常痛苦 |

    | 其他功能 | 任何额外功能大多围绕外观和窗口行为 | ClusterSSH 允许我们发送几个随机命令 | 另一个像 transit 一样不错的工具，且法语中是熟悉的界面，使其易于上手
    | 这里没有其他类似的，其他的都可以保存密码 3 |

    | 易用性 | 一旦你理解了它，就会变得非常容易使用 | 极其不熟悉的界面实际上并不好用 | 它能完成它想做的一切，但确实让你需要付出努力 | 一个非常好的
    SSH 客户端，可以让你无忧地连接设备 5 | 你确实需要处理很多问题，但当你终于搞定它时，它是好的 |

    | 总体 | 很好，但显然更适合不支持 SSH 的 Windows | | | 并不真的适合初学者，或者与其他产品相比显得过于简单 5 |


    ## 优胜者是……


    ### SecPanel


    不可否认；SSH 的实用性永远不会真正消失。在一个带宽增加、访问或广播屏幕变得更更容易的世界里，人们对远程连接的需求很大，这种连接对用户的要求比简单的命令行更多。这些
    SSH 客户端的总体状况适用于那些只需要在命令行中使用 SSH、除此之外没有其他需求的人。而SecPanel 为在开发环境中处理 SSH 的管理员提供了一个出色的解决方案。


    SecPanel 的真正之处在于，它为必须处理大量远程计算机的人提供了许多优秀的功能，从多重连接到能够传输文件。它不仅仅是一个工具，而且运行得更好，为这些工具的用户提供了更熟悉的界面。这帮助它确立了获胜地位。


    从整体来看，PuTTY 有点令人失望，它非常像 Windows 可以发现的类型。


    ![](img/78fc0912c436c898922acde3c325ec7a_77_0.png)


    额外功能帮助 SecPanel 客户端测试 SSH 连接（操作系统只允许原生支持，但这一事实意味着与 SecPanel 和 SSH 的完整功能相比，它稍微落后）。


    SecureShell 和 ClusterSSH 的规格可以这么说——至少尝试做一些不同的事情，但如果你想做多客户端控制以外的任何事情，最好使用终端或其他工具。


    似乎，最好的 SSH 图形化工具只管理其他界面的 SSH，但它做得极其出色。


