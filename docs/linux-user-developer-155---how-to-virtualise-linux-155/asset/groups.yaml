    \ power and difficulty of C pointers while trying to locate palindromes\n\n> >\
    \ This column will focus on finding out if a word is a palindrome. A palindrome\
    \ is a word, phrase or sequence that reads the same backwards as forwards. We\
    \ will deal with words but it is easy to extend the code to our phrases or sequences.\n\
    \nThe first method (palindromerev) will use an uncommon method: it will compute\
    \ the reverse of the given word and compare it to the original. It is easy to\
    \ understand why it is not very efficient: the *reverse* function does not stop\
    \ until it is reversed the longer the word, the higher needed.\n\nA more rational\
    \ approach would be to compare the first and last letters of the word, and so\
    \ on, until there is a mismatch or no more letters to test. The following presents\
    \ the plain version (palindromePoint) of the palindrome function that implements\
    \ an algorithm based on the previous technique:\n\n```\nconst char *t = strlen(s);\n\
    while (*t && *t == *s++)\n{\n t--;\n}\nreturn *t == 0;\n```\n\nAlthough this is\
    \ the shortest version, it is the most challenging to read and understand.\n\n\
    An alternative approach would be to use array to implement palindromeArray:\n\n\
    ```\nsize_t i = 0, j = strlen(s);\nwhile (i < j && s[i] == s[--j])\n{\\ ni++;\n\
    }\nreturn i >= j;\n```\n\nThis is far more elegant than the plain version. There\
    \ is a strong chance that the C compiler will optimize your code and use pointers\
    \ to make it run even faster if you use array arithmetic. Nevertheless, if you\
    \ want your code to be quicker, you should write code that runs faster in the\
    \ first place!\n\nThe nice advantage of the two aforementioned approaches is that\
    \ the process stops as soon as it discovers a 'problem' in the word that does\
    \ not\n\nmake a palindrome (the second condition inside the two *loops*).\n\n\
    An alternative approach would be use a scripting language. The Perl version (palindrome.pm)\
    \ uses the reverse function instead of implementing an equivalent function. Therefore,\
    \ the equivalent statement for checking whether a palindrome is just (reverse($word)),\
