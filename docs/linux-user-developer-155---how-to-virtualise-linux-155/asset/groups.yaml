    # 功能


    ## 构建你自己的自动化系统


    探索如何远程控制插座、车库门、LED 灯带等更多设备


    ## 遥控控制插座


    我们将使用一个 433MHz 接收器和发射器模块；你可以在 ebay 上花几英镑买到它们——只需搜索“433MHz”，就能找到你正在寻找的遥控插座。在这个项目中，我们使用了一组四只的遥控插座。这些插座非常适合落地灯以及任何没有开/关开关的设备。根据我们的经验，在我们使用的这段时间内，它们运行得非常完美。


    你可以使用 433MHz 接收器和简单的 Arduino 软件来捕获遥控器的消息，从而触发它。这些模块的接线非常简单：5V、地线（Ground）和数据（Data）。接收器有两个数据线引脚，但你只需要连接到地线。遥控代码的妙之处在于，它们可以在
    433MHz 下用于任何你需要的设备——遥控车库门或灯开关很可能使用 433MHz。


    ## LED 灯带


    LED 灯带非常棒。在亚马逊上很容易找到，五米长带 12V 电源和遥控器的价格约为 15 英镑。它们背部有胶，可以粘在表面。它们发出的光充足。或者，你可以拥有独立的红、绿、蓝组件。可以使用脉宽调制（PWM）将这些颜色设置为
    0 到 100% 之间的任何亮度。每个颜色都是具有特定时间的方波。如果红色信号具有 50% 的占空比，那么它将在 50% 的时间内开启，导致亮度降低。灯带有四个用于红、绿、蓝的连接器。颜色连接器是各个引脚。当颜色引脚连接到地线时，电路形成，允许
    12V 流过 LED。我们将为每个颜色使用单独的晶体管。注意，Arduino 和电源应该在面包板上连接在一起。RGB 灯带使用了三种独立的 12V 颜色。我们是手动连接到
    LED 的。


    (img/78fc0912c436c89922acde325ec7a_51_0)

    (img/78fc0912c436c89922acde325ec7a_51_1)


    ## 家庭自动化


    LED 的电源不应连接到 Arduino ——否则 LED 灯带或 Arduino 将损坏。我们使用了 TIP120 NPN 晶体管，它能够开关 5 安培——这对于我们的应用来说足够了（带带的电源只需要
    2 安培）。这种晶体管也适用于控制风扇或其他电机的速度。我们从左到右连接了 TIP120 的基极和发射极，基极通过 220 欧电阻连接到 Arduino 的
    PWM 信号。集极连接到 LED 灯带的一个颜色引脚，我们使用硬线从发射极连接到集极。在通过过大电流时，这些灯带也会发热。还使用了硬线从发射极到地线，以及集极到
    LED 的跳线导。你必须确保连接到灯带的电线没有短路，否则可能会损坏 LED。我们的设置可能涉及电路移动到面包板上，我们测试过它是可以工作的。


    ## 硬件


    家庭自动化更复杂的选项可以是遥控窗帘或百叶窗。这些是极佳的选择，因为你可以用它们来唤醒你，并在日落时让它们关闭。这些设备可能使用与遥控器相同的 433MHz
    频率，因此你可以毫不费力地将它们添加到我们即将编写的软件中。如果你想开启它们，可以编写自己的 Python 脚本向百叶窗发送打开和关闭命令。


    ## 温度传感器


    TMP36 是一个非常简单的 IC，它有三个引脚：5V 电源、地线和代表温度的输出。该电压可以从 Arduino 的模拟引脚读取。公式为：Temp in C
    = [(V in mV) - 500] / 10，因此 0.7V 的电压对应 20°C。


    ## 摄像头


    你可以使用 USB 摄像头或树莓派摄像头进行视频流传输。树莓派摄像头应与蓝色接口连接，排线面向 HDMI 接口。


    (img/78fc0912c436c89922acde325ec7a_52_0) 顶部树莓派摄像头直接插入树莓派本身，不需要额外的接线。下面的温度传感器非常简单地连接到正极轨道和地线数据引脚。


    (img/78fc0912c436c89922acde325ec7a_52_1)

    (img/78fc0912c436c89922acde325ec7a_52_2)


    ## 功能


    ## 配置你的树莓派和 Arduino 协同工作


    我们将使用 homecontrol.js 作为自动化系统的控制软件。这是一个运行在树莓派上的 Node.js 自动化系统，通过 USB 向 Arduino
    发送命令。虽然理论上某些情况下树莓派没有模拟输入输出，但 LED 灯带是需要这些。


    - sudo apt-get update

    - sudo apt-get upgrade

    - sudo apt-get install libboost-dev


    接下来，我们需要下载预编译的 Node.js 和 MongoDB 软件包（homecontrol.js 都需要）。可以在 http://liamfaser.co.uk/lead/homeautomation
    找到它们。


    ## 树莓派准备


    使用最新的树莓派作为该项目的起点。使用默认用户名 "pi" 和默认密码 "raspberry"。你需要做的第一件事是使用 raspberry-config
    启用摄像头并调整文件系统，以便系统使用 SD 卡上的所有可用空间。我们可以更新我们的软件包，然后安装后续需要的软件包：


    ```bash

    wget https://node-arm.herokuapp.com/node_0.10.36_armhf.deb

    sudo dpkg -i node_0.10.36_armhf.deb

    ```


    检查是否安装正确：


    ```bash

    pip install raspberrypi

    node -v v0.10.36

    ```


    安装 MongoDB...


    ```bash

    wget https://github.com/tanjanson/mongodb-armhf-deb/download/v2.1.1-mongodb_2.1.1_armhf.deb

    ```


    (img/78fc0912c436c89922acde325ec7a_53_0) 无线接收器工作需要电源并连接到数据引脚。


    (img/78fc0912c436c89922acde325ec7a_53_1)

    (img/78fc0912c436c89922acde325ec7a_53_2)

    (img/78fc0912c436c89922acde325ec7a_53_3)


    ## 家庭自动化


    这种工作方式非常优雅，因为它允许无需重新编程即可添加更多传感器。


    (img/78fc0912c436c89922acde325ec7a_54_0)


    | 协议 | 位数 |

    | :--- | :--- |

    | 接收1670063 | 24bit |

    | 接收1670062 | 24bit |

    | 接收1670061 | 24bit |

