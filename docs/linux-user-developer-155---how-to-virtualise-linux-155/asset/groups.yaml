    # Tutorial NGINX on AWS


    NGINX on GNU/Linux

    NGINX running in the AWS cloud on GNU Linux gives you a flexible open source web
    server enterprise-class infrastructure that you can set up and run on a household
    budget. Build your own custom system with NGINX from freely available sources
    if they aren''t exactly right for your needs.


    ![](img/78fc0912c436c898922acde3c325ec7a_29_0.png)


    If you added any additional volumes to your instance at launch (the volumes that
    came with the AMI), now is the time to format them, mount them, and add them to
    /etc/fstab. On AWS, you can create additional volumes and attach them to an already
    running instance in the section Elastic Block Store of the AWS Management.


    ## 08 Acquire root privileges


    Next, use the command:


    ```

    sudo su

    ```


    ... in order to acquire root privileges.


    ## 09 Install NGINX from binaries


    Now install NGINX using this command:


    ```

    yum install nginx

    ```


    Since Apache is not installed on your Amazon Linux, you don''t need to remove
    it.


    ![](img/78fc0912c436c898922acde3c325ec7a_29_1.png)


    ## 06 Set up your namesvers for your domain


    In order to configure the NS server for your domain with the registrar of your
    choice, enter the host names of your DNS servers in the appropriate form for your
    domain. If you are using Route 53 as DNS service, the NS servers are listed in
    the Hosted Zone section of Route 53 for your domain. They look like:


    - ns-1234.awns-12.co.uk

    - ns-4321.awns-56.com

    - ns-1321.awns-24.org

    - ns-9876.awns-99.net


    You need to set the NS servers in the configuration of your domain that is maintained
    by your registrar. To verify that the setup is correct, you can run diagnostics
    on your domain using the free service intools:


    ```

    http://intools.com/

    ```


    Unless you intend to rent a mailer for your domain, you can happily ignore any
    complaints about a missing MX.


    ## 07 Connect to your Linux instance


    At this point, your instance should have passed health checks and status as ''running''.
    Navigate to the Instances list of the Console, select your instance from the list
    and click the Connect button to view instructions on connecting to it. Start an
    SSH connection and enter something like this:


    ```

    ssh -i /path/to/yourPrivateKey.pem ec2-user@XX.XX.XX.XX

    ```


    The username is usually ec2-user or root, technically, the creator of the AMI
    can set it to whatever they want. If your instance is anything other than root,
    you can assume superuser privileges using the command:


    ```

    sudo su

    ```


    ## 10 Edit /etc/nginx.conf


    NGINX saves its configuration files in /etc/nginx.conf. Open the main config file
    in your editor of choice:


    ```

    worker_processes auto;

    Start-NGINX

    service nginx start

    ```


    Now when you use the IP address of your server or to domain name use the generic
    test page that comes with everywhere in /usr/share/nginx/html.


    ## 11 Set up virtual hosts


    The default configuration of virtual hosts in NGINX is stored in configuration
    files located in /etc/nginx.conf/, but there is a more elegant way to manage these
    settings using sites-enabled and sites-available. Have a creating these directions:


    ```

    mkdir /etc/nginx/sites-enabled

    mkdir /etc/nginx/sites-available

    ```


    > By default, the web server NGINX stores its configuration files in Linux in
    the directory /etc/nginx/conf.d


    Open the config file /etc/nginx/nginx.conf and create a link to:


    ```

    include /etc/nginx/conf.d/*;

    ```


    ... with a hash NGINX will ignore it:


    ```

    include /etc/nginx/conf.d/*;

    ```


    On the next line, tell NGINX to read the contents of the directory/nginx/sites-enabled:


    ```

    include sites-enabled/*;

    ```


    For each website you want to link to the sites-directory:


    ```

    touch /etc/nginx/sites-available/www.mydomain.com

    ```


    In order to enable it, create a link to its configuration file in the sites-enabled
    directory:


    ```

    ln -s /etc/nginx/sites-available/www.mydomain.com /etc/nginx/sites-enabled

    ```


    So far, your config file is an empty placeholder.


