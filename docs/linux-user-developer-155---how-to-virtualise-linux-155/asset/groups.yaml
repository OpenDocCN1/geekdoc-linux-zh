    # 观点


    ## 内核专栏


    随着 Linux 4.1 的发布以及 Linux 4.2 特性合并计划的启动，Jon Masters 阐述了来自 Linux 内核社区的新闻。


    > Lin Torvalds 发布了最终的 4.1 Linux 内核，并表示在[不寻常]的一周之后，这非常安静。


    正如我们上周注意的那样，Linux 4.1 必须在计划中额外增加了一周（候选版本 8），这是由于他的假期时间与原定发布目标重合，以及存在了一些小问题（例如，在
    RC8 公文中提到的 RAID 驱动程序中自然存在会导致数据损坏的问题，这需要一些时间来解决）。总的来说，这是一个非常忙的一周，尽管他认为一个很好的“考虑”因素是，由于
    4.1 将成为一个 LTS（长期支持版本），这意味着 Greg Kroah-Hansen 和其他维护者将在支持下进行 4.2 合并窗口的覆盖。在一切完成后，Linux
    发布了 4.2-rc1，并指出该版本的巨大规模源于“异常”，即顶层头文件中的一层尺寸（占了 -rc1 中更改的所有代码行数的 41%）。同时，来自 ARM64
    的典型更改具有“相当多的位差异”，这两种来源都可能导致损坏……以及 FPU（浮点单元）处理问题。


    ## 持久性内存


    非易失性内存（NVM）是一种即使在掉电后也能保留数据的 RAM。这是系统设计中的一项重要特性，对硬件和软件均有影响。在硬件方面，持久性内存已经建立了稳定的设计，并正朝着“即时启动”的使用方向努力，同时在内存被用于两个不同用途的世界中创建必须处理冲突的功能。在软件方面，持久性内存带来了系统拓扑的挑战，并引发了关于管理大量既易失又持久的内容最佳手段的讨论。


    Jon Masters 是一位已经在 Linux 领域工作多年的内核开发者。他最初就读于马萨诸塞大学阿姆斯特德分校，并在马萨诸塞州的 Red Hat 工作过，目前在该那里驱动能源高效
    ARM 驱动服务器标准的开发。


    ## 内核合并了接近记录的更改集 - 超过 1200 个非合并更改


    随着 Linux 4.1 的发布，Linux 4.2 合并窗口的传统开启已经开始。这包括对 64 位 ARM 系统的主线支持，以及一种用于非易失性存储（也称为“持久性内存”）的新内核块驱动程序。


    在传统环境中，计算机使用称为 RAM（随机存存储器）的短期内存。内存是易失的，这意味着在休息（或在短期关机期间）移除电源后，数据将会丢失。传统 RAM 基于
    20 世纪提出的（并在之后不断完善的）基于存储电荷的方法，它由微小的存储电荷组成；与我们今天拥有的基于物理特性的非易失内存设备不同，RAM 在几毫秒到几秒后就会丢失内容，并需要不断“刷新”。


    Linux 4.1 持续了两个周，其期间接收了数量接近记录的更改集（补丁）。取决于你是否包含子系统维护者的“合并提交”，Linux 3.1 的更改集可能比
    4.2 多或少，但那是一个非常短的时期。新闻提供了关于计算机软件中计算合并和非合并更改集的详细视图，这些方法依赖于通电状态下的后台运行，并且每个内存位置在不使用时恢复到初始状态。然而，传统的
    RAM 设备是必须持续刷新的。持久性内存技术在系统掉电时不会遇到同样的问题。但与磁盘和闪存技术不同，它们是可以直接寻址的（你可以直接从非易失内存设备中执行代码）。


    在未来几年里，随着大量 TB 非易失性内存的可用，管理它们变得令人头疼。另一方面，这些设备可能比传统的 RAM 慢（由于早期版本的性能特性），但不需要索引。内核“config”的一个新功能允许通过简单的命令行选项开启和关闭某些选项。这将合并（在未来的版本中），允许开发者避免在各种文件中查找他们想要开启的选项。如果你足够幸运拥有此类设备，可以加载并尝试它们。将这些内存视为磁盘的额外益处是，可以在其上创建文件系统。在当前阶段，NV-DIM（（非易失性内存模块）内存，通过“pmem”驱动。


    ## 持续开发


