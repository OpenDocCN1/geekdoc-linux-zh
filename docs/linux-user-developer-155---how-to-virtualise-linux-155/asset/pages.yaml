  md: '# Tutorial NGINX on AWS


    # Supercharge your website with NGINX on AWS


    Some of the most-visited websites in the world, 1,000 run on NGINX, and you can


    Web visitors don''t appreciate waiting for a page to load each time they tap or
    click. If you want to bounce rate, give them what it craves: in a website: speed,
    then more speed. Nothing works web sports without a high-performance web server.


    In benchmark, NGINX can crush its competition. It can serve double the number
    of requests its fastest competitor (Lighttpd) and eight times that of the overall
    market leader (Apache). It has one level of ''security'' that qualifies for internet,
    NGINX was designed with easy configuration and robust security in mind. Its small
    memory footprint lets it run on any AWS EC2 instance of Linux on a budget ($1,500
    USD and year, but Open Source is free of charge and, for most, it (almost) just
    as good.


    +   01 Sign to the AWS Management Console


    The owner of an AWS account can sign in to it as AWS root, who is the superuser
    for all infrastructure services (not individual server instances). If it were
    up to us, you would only sign in to AWS root account, create an IAM user and use
    that with an MFA token generator for multi-factor authentication (such as an app
    on your smartphone), when anyone else in your organization


    When signing in your AWS root account, navigate in your web browser:


    http://aws.amazon.com/


    ... and use your email address. When signing in as an IAM user, head over your
    account-specific sign-in page and enter your IAM username and password.


    ![](img/78fc0912c436c898922acde3c325ec7a_27_0.png)


    Felipe Martins & Anna Kobylinsa

    te up two years ago to build and scale up enterprise IT, designing cloud solutions
    and optimizing NGINX on AWS.


    ![](img/78fc0912c436c898922acde3c325ec7a_27_1.png)


    Resources

    AWS root account


    Right AWS offers a variety of services to choose from when setting up and running
    a website'
