  md: '# Welcome


    # to issue 155 Linux User & Developer


    # This issue


    +   Home automation with Pi

    Virtualising Linux machines

    Software debugging techniques

    Meizu MX4 Ubuntu Edition reviewed


    # Get Linux User cheaper every issue Page 22


    Rob Zetsloot is an aerospace engineering specialist using Python to model complex
    simulations. Recently, he came dangerously close to ending an iPad career and
    is now orchestrating a fleet of Linux VMs (p.24) while using Pi, and writing a
    visual novel in Python (p.62). He dreams of Ubuntu.


    Jon Master is a kernel hacker who has been working on Linux for 19 years, he first
    attended University UK and lives in Cambridge, Massachusetts, and works for the
    enterprise Linux vendor. You can find him on pages 10 to 13.


    Liam Fraaser is the RaspberryPi/YouTube reporter and volunteers as a Linux server
    administrator for RaspberryPi. On page 50 to find out how he set up RaspberryPi,
    including a video doorbell, DC lights, plugs and mice.


    Mihalis Toukalos is a Linux system administrator with expertise in programming,
    databases and mathematics. He has been using Linux since 1993. This month takes
    a look at C# programmers (Column 11), and off his two-part go to page 44 for some
    great programming tips.


    Dan Alder is a Pi Certified Educator and a Lead Coach for CAS. He is passionate
    about teaching, hacking, and projects, and uses them to engage his students in
    what he teaches. On page 38 he shows how to build the software modules for the
    Pi he started building last month.


    Gareth Halifer is our resident reporter and brings you the latest developments
    from all over the world. Covering on page 6, he lists out laptops like the Banano
    Pro – to see how this second iteration of the Banana SRC fares against the Pi
    2.


    Welcome to the latest issue of Linux User & Developer, the UK and America''s favourite
    Linux and open source magazine.


    Containers are many in the public eye now, particularly with recent developments
    like the launch of the Open Container, but virtual machines aren''t going anywhere
    yet – the right hybrid setup could be more beneficial than using either. This
    month shows you how to run with VirtualBox, QEMU and KVM: three things that will
    enable you to create powerful headless servers, create different processor architectures
    and also create test environments of your choice, or preserve an old OS environment.


    We''re also talking about this month, using the Raspberry Pi, a Node.js project
    called Home to get control over your home with a bunch of sensors, cameras and
    video from a simple web interface (page 50). We also review some great desktop
    servers, Ubuntu and Debian and finish off with the Linux shell and wearable touches
    that they began last month. And to see what we think of the latest Ubuntu Phone,
    the Meizu MX4, head to page 80 for Bob''s review – let us know your thoughts


    Gavin Thomas


