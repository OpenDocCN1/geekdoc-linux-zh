  md: '# Sensors The temperature, humidity and pressure sensors used in this model
    all output their data in real time to the automation dashboard.


    # Lights PubNub''s LEGO Smart Home uses lots of LEDs to simulate the lights that
    you would have around your home, like this porch light


    ![](img/78fc0912c436c898922acde3c325ec7a_57_0.png)


    # Appliances This light is used to represent other appliances you can add, from
    Nest thermostats to Wemo outlets, and much more


    # Doors There''s a tiny stepper behind this door that can open and close at the
    touch of a button on the dashboard


    ![](img/78fc0912c436c898922acde3c325ec7a_57_1.png)


    # # LEGO Smart Home


    Bhavana Srinivas and Georem from PubNub show us how you can connect Internet of
    Things devices as blocks of LEGO


    # So tell us PubNub and your LEGO Smart Home.


    PubNub is a global data stream network. What this means is, you can talk between
    devices in real-time, And going as well, you can scale and build realtime applications.
    The simplest case is when you use it to talk to each other — using any kind of
    instant messaging or a callback that requires blocks to be updated in real time.
    For home automation — that of real-time messaging is brought to PubNub. Since
    with world, your data gets replicated and we can communicate between devices in
    less than a second.


    The Internet of Things was picking up at PubNub last year, so we decided to integrate
    PubNub as a software for any kind of automation that we built. We were building
    projects with Unity/v11y and the Raspberry Pi+ to help as the brain behind the
    project, powering the embedded sensors, and we used PubNub as a glue to talk between
    these different devices.


    which in PubNub, and then on a mobile phone you could control all the devices
    in your home, the devices being embedded LEDs — to simulate lights like a fireplace,
    a barbecue station and lights within the house to open and close the door, and
    a couple of sensors to measure different values within the house.


    So what can you do on your dashboard, on the app we built? You can instruct it
    to switch on the light or the door, it will reflect immediately in the house.
