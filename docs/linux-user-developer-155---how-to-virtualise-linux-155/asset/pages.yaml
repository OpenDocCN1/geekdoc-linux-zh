    # Launch an EC2 Instance


    Unless you are familiar with the quirks of spot instances, such as unannounced
    shutdowns routinely performed by Amazon, your best bet is on-demand request that
    ensures your volumes are guaranteed (a downtime of spot instances) and will charge
    you for the reservation of compute resources (a discount on types of instances).
    In the AWS Management Console, navigate to the section EC2 Instances and click
    Launch. Select an AMI of your choice which will be using ami-1eca77gg, Linux from
