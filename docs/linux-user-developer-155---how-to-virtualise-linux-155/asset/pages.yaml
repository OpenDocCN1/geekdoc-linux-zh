    # Build your own automated system


    Discover how to remotely switch sockets, your garage door, a strip of LED lights
    and more


    # Remote control sockets


    We are going to use a <433MHz receiver and transmitter module these can be found
    for a couple of pounds on ebay - simply search for “433MHz” and you''ll find what
    you''re looking for remote control sockets. We used a pack of four remote control
    sockets for this project. The sockets are ideal for items such as floor-standing
    lamps, and anything else without an on/off switch. In our experience, it has worked
    perfectly for the time we have used it.


    You can use the 433MHz receiver and a simple piece of Arduino software to capture
    the message from the remote so you can trigger it. These modules have very simple
    wiring: 5V, Ground and Data. The receiver has two pins for the data line but you
    only need to connect to ground. The beauty of remote control codes is that it
    can be used for anything you like at 433MHz - remote control garage doors or light
    switches are likely to use 433MHz.


    # LED strips


    LED strips are great. They are very easy to find on Amazon and cost about £15
    for a length of five metres with a 12V power supply and remote. They have adhesive
    on the back so they can be stuck to a surface. They give off a lot of light. Alternatively,
    you can have an individual red green and blue colour component. These colours
    can be set to any brightness between 0 and 100% using pulse width modulation.
    Each colour is a square wave that has a certain amount of time. If the Red signal
    had a 50% duty cycle then it would be on 50% of the time, resulting in reduced
    brightness. The strip has four connectors for red green and blue. The colour connectors
    are the pins for each. When the pin for colour is connected to ground, the circuit
    is completed, allowing 12V to flow through the LED. We will use a separate transistor
    for each colour. Note that the Arduino and power supply should be connected together
    on the breadboard. The 12V


