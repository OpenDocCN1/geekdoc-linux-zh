  md: '# Questions & answers

    Web: www.linuxuser.co.uk

    Email: linuxuser@imagine-publishing.co.uk


    # Q & A


    # # Your questions answered

    Send us questions and we''ll do our best to answer them!


    ![](img/78fc0912c436c898922acde3c325ec7a_89_0.png)


    # FAQ

    Updating a distribution


    **Q: So how do I update my distro automatically?**

    A: Some distributions include a rather useful updater, such as Ubuntu. They usually
    prompt you if an update becomes available, it will update and install any necessary
    packages while keeping your files and settings. Others do not have this process,
    so you will need to back up your files and install the updated version of the
    distro. It''s good to keep an eye out for any updates that might affect your specific
    system.


    **Q: I''m on LTS (Long-Term Support) Ubuntu, and the upgrade is not showing up.
    What is the problem?**

    A: Use the Update Manager and check Settings. Go to the Updates tab and look for
    the menu with ''Notify me of a Ubuntu version'' and change it to ''Any''


    **Q: Can I downgrade back to a previous version if I don''t like it?**

    A: Not really. It would be dangerous and might break all the packages back to
    a prior state; the best solution is to perform a backup in case you wish to revert


    # Analyze this


    I''m running Ubuntu 15.04, I installed Disk Usage from Ubuntu Software Center.
    It installed normally but I couldn''t find it anywhere. Not in the Accessories
    menu, in the application folder or in the terminal. I searched for Ubuntu Software
    Center that shows the location, but there''s nothing there. I restarted the computer.
    Nothing. I uninstalled the Disk Usage Analyzer and installed it again. Any idea
    what might be going on?


    Above The Disk Analyzer is good at breaking down where storage is being used

    On the systems we''ve seen in the Administration it just comes up in the menu,
    specifically in the Administration. Did you make sure you installed the right
    package? It''s called the GNOME usage and it''s called the usage analyzer in the
    software centre.

    You can try to install it using the command line. Open up a terminal and use:


    ```

    $ sudo apt-get install baobab

    ```


    You can use both in the terminal with just baobab or have another look in yours.


    Steven Grayson


