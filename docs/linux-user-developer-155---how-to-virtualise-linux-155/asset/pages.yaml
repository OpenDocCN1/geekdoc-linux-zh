    Make sure to keep your operating systems backed up

    and safe with these handy software tips


    One of the benefits of using virtual machines is that they allow to create backups
    or snapshots of specific states so that you can revert back to them in the future,
    or from the one before the latest version. This is a good way to test and copy
    different versions of the software, without risking anything. Backups and snapshots
    are quite different in the software, so it is better to think about what you want
    to do. Do you want to restore an older version if something goes wrong with the
    VM, or if something goes wrong with the host?


    Back up and restore

    Restoring is just as easy on a virtual hard drive, it makes it easier to back
    it up. In most cases, you can just copy the file and move it somewhere safe or
    secure. Like VirtualBox, this appliance also contains the VM which makes it easy
    to restore it later without having the settings with you.


    VirtualBox has the ability to export virtual appliances into a file for restoring
    later, which also has all the details of the VM. An OVF (virtualisation format)
    which is used by other hypervisors and virtual machines.


    Restoring a virtual hard drive device is nice and easy. In VirtualBox, you can
    create a new virtual machine and restore it using any virtual hard drive from
    any location. You''ll have to check the settings in order to make sure everything
    is working as well as it should.


    # Snapshots


    An excellent feature of VirtualBox is the ability to create a snapshot of the
    virtual machine at its current state. This can then be used as a reference point
    to start again using older software, to create a different package and upgrade
    it.


    To snapshot, select your virtual machine from the manager. At the top-right of
    the VirtualBox interface is the Snapshots tab - from which you can press the camera
    to create a snapshot of the current system. You can then select which version
    to start up each time, but warned that it does use extra storage space.


    VirtualBox has the ability to export virtual appliances into a file better suited
    for restoring later, which also has all the system details of the VM


    ![](img/78fc0912c436c898922acde3c325ec7a_20_0.png)


    Create and manage snapshots and clones using VirtualBox


    # RESOURCES


    Each of the virtualisation methods will have their own quick and solutions for
    any issues you may come across. For each of these, check the documentation or
    any of the described methods online on the VirtualBox website (wiki.virtualbox.org/Documentation).
    KVM has a forum for help, but it also has a website and community (wiki.kvm.org/Manual).
    KVM is part of the Linux kernel, it has its own site dedicated to its use, which
    also has its community (linux-questions.org).


    If you still stuck after reading the documentation, you can also check out the
    forums. VirtualBox and KVM do not have the best place to ask them about issues;
    there is an excellent forum filled with many people who can help you resolve the
    issues you are facing. For more virtualisation updates in the VM community, check
    our website for a few virtualisation tutorials.


