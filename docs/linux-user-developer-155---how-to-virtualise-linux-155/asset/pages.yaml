    # Meizu MX4 Ubuntu Edition


    ![](img/78fc0912c436c898922acde3c325ec7a_79_0.png)


    The second round of Ubuntu Phones drastically needs to improve on the initial
    offering of the BQ Aquarius 4.5. Does the MX4 have what it takes?


    Finally, after months of waiting, the second Phone is upon us. The original BQ
    Aquarius 4.5 - a serviceable phone but poor specs and extremely early version
    of Ubuntu that accompanied it seemed a lot more like early development of what
    you''re using on a day-to-day basis. The low specs and shaky interface made enough
    that our review was somewhat less than positives. Put simply, the hardware needed
    to be better and the operating system needed much more help from the community
    and social media.


    Now we have the Meizu MX4 as your second choice for an Ubuntu Phone. A popular
    brand in the Chinese market, Meizu usually makes Android devices so it''s also
    familiar with smartphone design and manufacturing. In fact, the MX4 Ubuntu Edition
    is Android phone which was released at the end of the last year into the Chinese
    market but never saw a Western release.


    The rest of the device stayed the same: a decent amount of RAM and internal storage
    along with a battery to keep it going for a significant period of time. The design
    of the phone itself is very nice; a white, plastic body that doesn''t feel cheap
    at all, so that you don''t accidentally hit the all-hi-screen edges. It''s reminiscent
    of the iPhone and Galaxy S series in design, which clearly delivered to selection
    this phone''s popularity with the masses. Uniquely for modern Android phones,
    instead of relying on the soft keys for home, back and other apps, it also has
    a capacitive home button where on iPhones main button would be. Although the button
    isn''t normally part of the Ubuntu Phone''s UX, it actually really well with the
    operating system.'
