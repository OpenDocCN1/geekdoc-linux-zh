    supply for the LEDs should not connect to the Arduino - to the LED strip - or
    the Arduino will get damaged.

    We used a TIP120 NPN transistor, which is capable of switching 5 amps - this is
    plenty for our application (the power supply with the strip only requires 2.5
    amps because there is a 1 amp transistor for each colour). This transistor would
    also be good for controlling the speed of a fan or other motors.

    We connected the TIP120 Base and Emitter, from left to right, the base is connected
    to the PWM signal from the Arduino via a 220-ohm resistor. The collector is connected
    to one of the colour pins of the LED strip, and we used solid wire from the emitter-to-collector.
    When passing high amounts of current, these strips also get hot. Also, we used
    solid wire from the emitter-to-ground and collector-to-LED strip more current
    than bread jumper wires. You must ensure that none of the wires connected to the
    strip share, otherwise you could damage the LEDs in the strip. Our setup could
    involve moving the circuit onto a veroboard so it is more stable now we have tested
    that it works on a breadboard.


    # hardware


    A more involved option for home automation could be remote control curtains or
    remote blinds. These are excellent options because you can use them to wake yourself
    up, and have them close when the sun goes down. These devices are likely to use
    the same 433MHz frequency that the remote control uses, so you could add them
    to the software we''re going to write without much effort. If you want to turn
    them on a timer you could write your own Python script that sends the open and
    close commands to the blinds. We will discuss this at right times.


    # Temperature sensor


    The TMP36 is a very simple IC, it has three pins: 5V supply, ground and output
    0-2V to represent temperature.

    This variable voltage can be read from the analogue pins of Arduino. The formula
    is: Temp in C = [(V in mV) - 500] / 10, so a voltage of 0.7V will be 20°C.


    # Camera


    You can use either USB webcam or Raspberry Pi camera for video stream. The Raspberry
    Pi camera should be connected with the blue plastic connector, and the exposed
    traces of the ribbon cable facing towards the HDMI connector.


