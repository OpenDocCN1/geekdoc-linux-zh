    remember: also the volumes you keep around and the IPs you use but not release—everything
    else will make a dent in your pocket. Some of the older accounts also used the
    EC2 Classic environment; if you see this, stay away from it. Use the VPC for your
    web servers which is best to work with the VPC Dashboard.


    For additional hints on how to manage data and storage, please refer to the tutorial:
    Linux in the AWS Cloud. In order to connect to NGINX, you have to open port 80
    (HTTP) and 443 (HTTPS) for requests from customers in the Security Group of your
    EC2 instance so that NGINX can do its job properly. Set up your key pair and launch
    the instance.


    # Assign an IP address


    to your NGINX instance. This gives you the ability to terminate or even shut down
    your DNS configuration without a temporary stop (for your instance. Your NGINX
    needs an Elastic IP (EIP) for its order. In order to obtain it, navigate to Elastic
    IP in the pane of the EC2 console and click on the Allocate Address button.


    In the following, select the appropriate VPC and configure. Confirm this is an
