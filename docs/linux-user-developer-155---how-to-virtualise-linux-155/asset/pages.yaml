    # # The Do It Yourself age


    Marshall McLuhan predicted that “the age of automation is going to be the age
    of ‘do it yourself.’ Such is the spirit of


    > > Half a century ago


    Fifty years ago, the fact that we would be redefining the World Web. The Web is
    radically changing the ways we perceive and react to the social forces that shape
    and are changed by the world in which we live. We are in the era of the invention
    of the printing press and the upheavals of the industrial revolution, society
    departed from the preserve of elites, monks and scribes, who were invested with
    a shamanic power over the knowledge and the printed word.


    The invention of the printing press transformed the possibilities of publishing.
    Books became accessible to a wider audience, and led to the blossoming of ideas
    which were no longer confined to the interests of religious elites. Copyright
    was out of effect, not to protect the rights of writers, but to publishers. In
    1710, the Company of Stationers and Printers was given a monopoly on publishing
    (and censorship) over the publishing industry. Authors had no right to the ownership
    of the work, nor the right to publish it except exclusive reproduction and distribution,
    which made sense relative to the costs. This, before authors began relating to
    the professionalization of authorship,


    Similarly, the invention of the phonograph transformed the music industry. It
    is easy to forget how recent and transformative such technologies were. One not
    hundred years ago our ancestors had no access to the technologies we take for
    granted. Photography was a new and rare technology, and the


    facilities we see as necessities—central heating, and cold running water, flushing
    toilets, fridges, cars, and radio and TV—had yet to be invented, or were out of
    the reach of the average citizen.


    McLuhan observed, the technologies we use transform every aspect of our lives,
    everything remains within walls. The photograph: museum without walls. The electric
    light: space without walls. The movie, radio and TV: windows without walls. The
    new environment: “the food-gatherer reemer as information-gatherer.”


    In electronic media, less a nomad than his Paleolithic ancestors,” he wrote. The
    technologies of the Web are redefining the possibilities for information exchange
    and the dissemination of ideas and how we respond, as artists or writers or consumers
    who are out of step with the realities. Many industry structures are so that the
    “intellectual property” is owned by the distributor, or more than by the creator.
    Look at the music industry; in most cases company records owns the rights to the
    work, and the artist has control over the performance.


    Copyright followed the invention of the printing press. The music industry followed
    the invention of the phonograph and the publishers of printed works, and of music,
    control the outputs and the distribution, the artist has very little power over
    the content and media. It is noted that most records are in control of a handful
    of hands, and that those companies make the majority of the music labels making
    the money. This is the current change of technology that shifts the ownership
    of the means to the record and play the music. Change is inevitable.


    Ever present, McLuhan predicted that “technology advances, the resistance adapts
    and against the age of automation is going to be the age of ‘do it yourself.’
    Such is the spirit of Linux and free software.


    Richard Hillis writes about art, music, digital and a variety of publications


