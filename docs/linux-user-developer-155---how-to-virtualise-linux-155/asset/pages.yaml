  md: "# Python column\n\n# Cython and Pymimport\n\n# You can create new objects without\
    \ worrying about where they will be stored\n\nOne major issue with Cython is that\
    \ you are dragged back into the development cycle of compiled languages, where\
    \ one issue is that you need to write, compile, then import the modules in the\
    \ order they behave. If the code you are writing isn't too complicated, then a\
    \ different option you can choose is Pymimport. Pymimport is provided through\
    \ the Cython package, and is compiled on the fly when you need to use it. To use\
    \ it, you need to import it and run the function:\n\n# Full code listing\n\n#\
    \ The contents here should be divided into several # separate files in order to\
    \ use the examples\n\n```\n# hello.pyx\n# Basic Cython hello world\ndef hello_world(name):\n\
    \    print(\"Hello World to %s\" % name)\n```\n\nThen, when you import your .pyx\
    \ file, it gets silently compiled. however, one issue is much control over how\
    \ this is handled. In most cases, the defaults are usually fine. Pymimport performs\
    \ a reconcile when a source file is newer than the associated source file. In\
    \ some cases, you will have a single .pyx file. If you have multiple dependencies,\
    \ you can import them from pcpydep. Any dependency should be on a separate line\
    \ within this file.\n\n```\n# setup.py\n# This is the setup script to compile\
    \ the\n# Hello Cython example\nfrom distutils.core import setup\nfrom Cython.Build\
    \ import cythonize\nsetup(ext_modules=cythonize(\"hello.pyx\"))\n```\n\n# Coding\
    \ with Cython\n\n```\n# gato.py\n# You can import standard library functions directly\n\
    from cstdlib import atoi\ncdef parse_char_to_int(char* s):\n    assert s is not\
    \ NULL, \"String is\"\n    return atoi(s)\n```\n\nIf you're learning more about\
    \ Cython, it's worth checking out bit.ly/2MF2WRKG. In this issue, Liam Fraser\
    \ explains how to write simple functions using Python and Cython, taking advantage\
    \ of Cython's performance play play nodes at the same time. The code is listed\
    \ in its entirety for you to examine and type yourself, and is also available\
    \ as a FileSite.com download, so it's great way to see the power of this compiler\
    \ in action.\n\n```\n# sine.pyx\n# You need to declare C library functions\n#\
    \ to use them within Python\ncimport from \"math.h\"\ndouble sine(double x)\n\
    ```\n\n```\n# setup3.py\n# You need to add in which external libraries to link\
    \ to\nfrom distutils.core import setup\nfrom Cython.Build import cythonize\nfrom\
    \ Extension\nextext_modules=[Extension(\"sine\", sources=[\"sine.pyx\"],\nlibraries=[\"\
    m\"]])\nsetup(name=\"sine\", ext_modules=cythonize(ext_modules))\n```\n\n![](img/78fc0912c436c898922acde3c325ec7a_70_0.png)\n\
    \nwww.luxuseror.com 71"
