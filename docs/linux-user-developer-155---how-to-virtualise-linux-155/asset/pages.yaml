  md: '```

    mkdir /etc/nginx/sites-enabled

    mdir /etc/nginx/sites-available

    ```


    > By default, the web server NGINX stores its configuration files in Linux in
    the directory /etc/nginx/conf.d


    Open the config file /etc/nginx/nginx.conf and create a link to:


    ```

    include /etc/nginx/conf.d/*;

    ```


    ... with a hash NGINX will ignore it:


    ```

    include /etc/nginx/conf.d/*;

    ```


    On the next line, tell NGINX to read the contents of the directory/nginx/sites-enabled:


    ```

    include sites-enabled/*;

    ```


    For each website you want to link to the sites-directory:


    ```

    touch /etc/nginx/sites-available/www.mydomain.com

    ```


    In order to enable it, create a link to its configuration file in the sites-enabled
    directory:


    ```

    ln -s /etc/nginx/sites-available/www.mydomain.com /etc/nginx/sites-enabled

    ```


    So far, your config file is an empty placeholder.


    # 13 Supported database


    In the setup during this tutorial, NGINX can serve static pages. In order to use
    server-side scripting (for example as the engine of your CMS system), you will
    need to install a web server like MySQL/MariaDB NGINX for the scripting language
    of your choice (PHP, Perl). All required services will start automatically at
    boot time. For NGINX, this is


    ```

    chconfig --le=2345 nginx on

    ```


    # 14 Start NGINX


    At the prompt, enter this command:


    ```

    service nginx start

    ```


    ... to manually start NGINX.


    # 15 Create the root directory for your website and test page


    Create the root directory of your website in the path that is specified in the
    location (/) of your site''s config file (Step 2):


    ```

    mkdir /usr/share/nginx/www/my-website.com

    ```


    # 12 Edit your site''s configuration file


    Open your site''s config file in your favourite text editor:


    ```

    /etc/nginx/sites-available/www.mydomain.com

    ```


    To tell NGINX what to do about the requests for the site, you need to define it
    in the configuration(server):


    ```

    server {

    listen 80;

    server_name www.mydomain.com;

    # else here

    }

    ```


    Each section of an NGINX config file defines location and sets specific attributes
    to a directory of the site. This is how you can define the location for the web
    documents and the order of priorities for various types of content:


    ```

    location /

    root /usr/share/nginx/www:my-website.com;

    index index.html index.htm;

    ```


    Adjust privileges on the root directory tree:


    ```

