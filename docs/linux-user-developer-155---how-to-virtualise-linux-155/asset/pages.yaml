    # Features in

    Linux 4.1 LTS


    # 1 Power efficiency gains


    The release of the latest long-term support kernel improves the battery life of
    laptops and desktops, with particular benefits to be found for Intel Core devices
    — including the Intel Compute Stack.


    # 2 Cryptography


    The Ext4 filesystem now includes options for on-the-fly-level cryptography, thanks
    to patches provided by Android for the mobile platform. This exists independently
    of existing Linux encryption functionality such de-crypt.


    # 3 Better gaming


    Linux gaming with the 4.1 kernel finds better back force for Logitech wheels,
    gamepads, and the Microsoft One Controller, improving the experience of games
    with such changes.


    # 4 Wacom support


    Artists who use Wacom or Wacom-compatible tablets will be thrilled as the A1 tablet
    driver includes improved support for wireless tablets and enhanced support for
