    ```


    Well, do you not have the installer''s source code, when you don''t have access
    to the sources, you can parse the ELF. If you guess where the instruction is located
    you can replace the op-code instruction with 93 50 90 53 with another one. Our
    reasoning is this: if we did not replace the free() function at the offset, what
    other instruction would we have to use? The first one that comes to mind is, the
    nop (no operation). Since the free call is in five bytes, if we replace it with
    nop, replace those five bytes with 0x90. After that, try again and run the program.
    As we expected, the installer does not crash and the bug disappears!


    After redirecting the program to /dev/pts/2, set a breakpoint at the offset 0x013ceeb0
    (lines 2-4) where the instruction is located; then run the program. Once you find
