    # ## Fixing a double-free error


    It is time to move on to your next assignment: fixing the software; patch the
    API graphics drivers on a GNU/Linux box, and install the driver. Right before
    installing the entry, a double-free memory corruption error is triggered and the
    corruption naturally prevents the installer from actually setting up the driver.


    The GLIBC library uses free for allocation. In this particular case, the corruption
    happens because of a double-free pointer condition. You know that the source of
    the corruption is out of your control, because it''s new-hardware and the only
    drivers capable of detecting the problem are those of Intel. Your mission is to
    find a way to


    ```

    ### ...data/bin/x86_64/setup double free or corruption (Fastopt) 0x7c13ef80

    libibc.so.6:0x7c13ef80

    data/bin/x86_64/setup

    ```


    ```

    Apart from knowing the exact address that the double-free memory corruption error
    is placed at offset 0xb80 in the binary file (last line), the software is not
    source code. Therefore you do not have the source code. So you are at the mercy
    of disassemblers and debuggers to look up the offset and look for the offset 0xb80.

    ```


