    # 04. Register a domain


    Normally, your server receives requests by domain name, not IP address. In order
    to set it up correctly, you will need to register a fully qualified name. Unless
    you are after an exotic top level (such as a very prestigious name), you can choose
    a domain that you can use for periods provided by Amazon''s Route 5 service (Route
    53)


    Head to the header of your project (in the Route 53 console), choose a domain
    name, fill out the details, complete the payment and the domain name is yours.


    You will need some DNS servers to direct traffic to your Linux instance. One of
    the best deals you can get is when the Hosted Zones service of Amazon''s Route
    5 offering (select Hosted Zones).


    # 05 Configure


    Navigate to the section (Hosted Zones) in the AWS Management Console for Route
    53 and create a new hosted zone for your domain. Set up a new domain automatically.
    For example, you need to create a record type that points to the IP address of
    your Linux instance and the CNAME record that points to the A record. In each
    case select the Not Alias option, Alias set and leave the TTL value unchanged.
    All of this might seem complicated, but it is quite true once you know how to
    do it.


    The result looks like this:


    ```

    mydomain.co.uk A 56.728.123 300

    www.mydomain.co.uk CNAME mydomain.

    co.uk 380

    ```


    (56.728.123) is your EIP from Step 3.'
