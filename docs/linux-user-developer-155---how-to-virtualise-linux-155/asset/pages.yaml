    # Set up your control interface


    Now is the time to start adding our sensors and devices to heimcontrol.js


    ![](img/78fc0912c436c898922acde3c325ec7a_55_0.png)


    01 Start heimcontrol.js on boot

    Before we start adding devices, it makes sense to start heimcontrol.js on boot.
    To do this, we can add a line to /etc/rc.local which is a script that gets ran
    at boot by the root user. The file needs to be edited with sudo and your favourite
    editor, for example:


    ```

    sudo nano /etc/rc.local

    ```


    Add the following line before the line "exit 0":


    ```

    su pi -c "node /home/pi/heimcontrol.js/heimcontrol.js" &

    ```


    Heimcontrol.js will be started automatically from boot now, but now you can start
    it with node/home/heimcontrol.js/heimcontrol.js.


    ![](img/78fc0912c436c898922acde3c325ec7a_55_1.png)


    02 Add the camera feed

    Go to Settings and select Webcam, Set the method to Streamer and you can pick
    the devices as /dev/video. Pick an interval, we picked two seconds but you can
    pick any interval you like. Shorter intervals are more feasible on a Raspberry
    Pi 2, as it is more responsive. Save and then go back to the home page.


    03 Prepare remote control socket codes

    This is where you need the codes that needed earlier on. The Heimcontrol.js web
    interface takes the code as a binary string of 1s and 0s. However, the code we
    needed is in a different format so you''ll need to convert it to binary using
    Python. Type python2 into the terminal to open a Python interpreter. Format the
    integer you captured as a binary string like:


    ```

    >> "{0:b}".format(167380653)

    "111111110101110000111"

    ```


    Left The heimcontrol.js interface works really on mobile devices'
