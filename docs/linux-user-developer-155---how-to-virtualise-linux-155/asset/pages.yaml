  md: '# # FAQ


    # # What is Astro Pi?


    Code is written in schools and sent up to the International Space Station – but
    what''s running on now?


    ![](img/78fc0912c436c898922acde3c325ec7a_71_0.png)


    Gavin Thomas is the Editor of LUKg and Raspberry Pi. He is an experienced tech
    journalist with a passion for grown projects.


    If you like this:


    The Foundation has supported the Sense HAT, from the initial hardware setup to
    displays and images, with the sensors and more;


    Further


    reading


    There are more resources out there in the world - you can find out cheat sheets
    and resources like those on the Sense HAT STEM centre site here at astropi.com.
    Our page has start projects to play along with raspberry.com/benignual/astro-examples/


    **Why is heat on Astro Pi some sort of space-Raspberry Pi model?**


    Not quite, but Astro Pi is not the theme of the competition, run by the Raspberry
    Foundation alongside some leading teams from UKSpace which has closed and ended.
    It is the first competition that is focused on alone, known as the Sense HAT.
    This acronym stands for Hardware Attached to Top.)


    **What''s the competition all about?**


    Armed at primary and secondary school teachers would lead their classes in projects
    to create awesome software or even a game to interact with the astronauts. The
    primary school entrants are in and will be programmed by the Foundation team –
    the secondary schools need to write and test their own code. The winners from
    the primary and secondary schools will then have their code sent up to the ISS
    with a Raspberry Pi, a Sense HAT and British astronaut Tim Peake, who will run
    in the Earth-orbit and send back data to you.


    **Awesome! When blast-off?**


    November 2015. The primary school competition has closed and the winners were
    announced: Hannah Belshaw, from Booker Girl''s School in Croydon, had an ingenious
    idea to visualise data from the spaceborne as terrain in Minecraft and the Code
    Club presented an excellent experiment to determine whether or not you could detect
    astronauts aboard by using humidity and temperature


    Left we hope to see more competitions like this that gets involved with computing


    sensors along the cameras, good use of the Sense HAT''s capabilities. The secondary
    school competition will be closed by the time you read this


    and winners will be announced soon. After that, Tim Peake will launch the mission
    for testing.


    **The Astro Pi HAT sounds like it can do a lot, then? What is actually capable
    of?**


    The Sense HAT sits right up to the GPIO pins, and adds loads of sensors like the
    temperature, humidity and light sensors as well as a nicely veiled display. There
    are an accelerometer, regular and infrared magnetometer, a real-time clock, five-button
    joystick and some little buttons. It''s an incredibly little thing.


    I definitely need this in my life. What can I get one?


    Unfortunately, you''ll have to wait a little to get your hands on one of these.
    The Raspberry Foundation will run another competition as soon as the commercial
    production is. In the first run.


    Its general blog is as good as the Astro Pi is real; it''s just a case of the
    folks producing it, working out in public. Once it''s ready, you''ll be able to
    get it through the usual channels, the foundation''s Swag shop, element.


    If you want to find more, check out the Foundation blog - Liz has rounded up all
    in one list: raspberry.com/competitions/astro-pi. Then there''s the official site
    at astropi.com. And finally (just just it''s cool), a virtual Sense HAT in Minecraft
    talking to a real Sense HAT: youtube.com/watch?v=4IAIV_sec_


    ![](img/78fc0912c436c898922acde3c325ec7a_71_1.png)


    72'
