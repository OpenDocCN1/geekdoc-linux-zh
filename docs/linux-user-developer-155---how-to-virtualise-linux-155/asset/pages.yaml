  md: '# # Tutorial Server logs


    ![](img/78fc0912c436c898922acde3c325ec7a_33_0.png)


    The beauty of rotate lies in the fact that it allows us to handle each log file
    daily, monthly, or when it grows too large. So using rotate, it is possible to
    keep logs longer with less disk space.


    Practice is rotate as a daily cron job. Thus it is not needed to rotate a log
    file several times in a day. If we have a program that keeps logs with each passing
    day, if log files grow with size, then rotate can help us clean up when it is
    called. When called, rotate does:


    The daily tells rotate to rotate files every day. **Rotate 1** tells it to rotate
    log files once before removing the old files. **Create** tells rotate to create
    a new log file as it rotates the old one. **Compress** tells it to compress logs
    when they are old. **Include** instructs rotate to do more instructions in -cfg/rotate.
    Let us consider another example here:


    +   - The rotate configuration file: /etc/rotate.conf

    - The files in the configuration directory: /etc/rotate.d/

    - If you have many services (Apache web server, MySQL etc) define your system
    configuration file in etc/rotate.d.


    Rotate comes with many command lines and some of these are pretty useful. The
    following are some of the options with rotate:


    +   - v turn verbose mode

    - d enable debug mode

    - f force rotate the log file, if it is not necessary

    - u use output for a short message, giving information on usage


    ```

    /var/error_messages

    rotate 5

    weekly

    postscript

    endscript

    sbin/kill -H syslog

    ```


    Here are the rules to handle the error messages at /var/log. These files will
    go through weekly rotations before they are removed. After the log file has been
    rotated, the command /bin/kill -H syslog will be executed.


    Rotate finds extra use in rotating the log files (error and log) generated by
    a server. The following:


    ```

    /var/log/http.log /var/log/error.log

    rotate 5

    mail root@hostname.com

    sizeblock

    postscript\endscript

    sbin/kill -HUP http

    ```


    As mentioned, rotate comes with configuration file - rotate.conf, located at /etc.
    It is a normal practice to place the site-specific configuration files in /etc/rotate.d
    directory. Let us see how we can use rotate for logging the logs


    Rotate reads about the log files if it is handling from a series of configuration
    files. The configuration files are normally written in a cfg-like format. First,
    we need to create a configuration file for logfiles; let us have this configuration
    in /home/sway/rotate.conf. The contents of this configuration file look like:


    ```

    daily

    rotate 1

    create

    compress

    include /home/sway/conf/logfile.d

    ```


    Here, two specified log files (access and error) are rotated when their size over
    100k and the log files are mailed going through five rotations. In this case,
    note that all log files are not removed from the system. Any error that occurs
    during the processing of log files is mailed to root.


    Now let us consider site-specific configuration file. As mentioned earlier, configuration
    files are available in the /etc/rotate.d directory.


    Edit Logging Settings for account

    Select a Log Level to control the level of detail included in your logs.


    | Log Level | | |

    |---|---|---||

    | Log Rotation | | |

    | Create a new log file every day. | 50 (kb) | |

    | Disable log rotate file. Save all logs in the same file | | |

    | Max File Size | 10000 | file(kb) |

    | Rotate files based on size | | |

    | Max File Size | | |

    | Max File Size in Rotation | 10 | file(kb) |


    ```

    $ /var/log/http.log {

    weekly

    rotate 52

    compress

    dissook

    notifyem

    postscript

    sbin/kill -HUP ''cat /var/run/http.pid 2>/dev/null''

    }

    ```


