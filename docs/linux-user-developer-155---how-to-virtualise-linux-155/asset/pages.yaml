  md: '# Home automation


    # Your smart home setup


    Remote control sockets

    Energy saving and green houses are a big thing now, and you can buy power strips
    that will shut down every socket from far away. This saves energy accurately though,
    and being able to manually control the socket is not always easy if it''s hidden
    or part of a power strip. With the use of remote control sockets, you can control
    the power of lighting from anywhere, enabling better control and less use of standby
    modes.


    ![](img/78fc0912c436c898922acde3c325ec7a_50_0.png)


    # Lights


    A basic home automation function is controlling the lights in the house depending
    on the time of day or how dark it is. There are many ways to do this: the popular
    method right now is Wi-Fi enabled bulbs, allowing for direct control, but there
    are LEDs that can easily light a room and are much easier to manually interface
    with. With all of these methods from home you can remotely control the lights
    to switch on or off as you leave, it''s easy to try and spooks house guests,


    # Thermostat


    Technologies like Nest are becoming extremely popular, but connected thermostats
    have been around for a long time - for years. While we''re not going to be creating
    a thermostat that ''seems'', for external control and monitoring is easy enough
    when you have the right equipment. We''ll be concentrating on monitoring the smart
    home thermostat and a bit of calibration to figure out the temperature.


    # Security doorbell


    It''s surprisingly easy to get one of these home security systems set up. Using
    technology created for security allows you to monitor live feed using the Raspberry
    Pi that can be displayed on your phone. If you use the Pi camera, you can see
    and then knock it into the doorbell if it''s a really cool party trick.


    # Augment your home by adding your own infrastructure to control it, all custom-coded
    and controlled by your Raspberry Pi


    We regularly talk about how the Raspberry Pi is the perfect computer to have around
    the house doing the hard work of saving power while it''s running. It''s not the
    power of the device, but it is just really good at it. - size and flexibility
    can make it often surprisingly powerful tool,


    And we can also go a lot further - handling idle computing tasks around the house,
    what if we had control it? Through home automation and a bit of fancy coding,
    you can easily make the Raspberry Pi do a little bit more and control many aspects
    of your home by not only setting up the controllable lights and thermostats and
    such, but also how to go about controlling them. Snark voice interface is not
    required.'
