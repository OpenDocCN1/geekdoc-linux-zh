    # What you''ll need


    +   * Pi Glove or a similar hardware setup


    # 05 GPIO pull-ups


    To register the finger button, we use GPIO pull-ups to detect the two contacts
    that have touched. The pull-up resistor sets the current to 0 volts. When the
    two wires connect, the voltage changes and this state change is registered, triggering
    the function when you release the button. If you have no pull-up or pull-down
    the GPIO pin can change state, for instance if there is external interference,
    it can trigger your button even if you did not touch it. To set up, add the following
    code to your program:


    ```

    GPIO.setmode(GPIO.BCM)

    ### sets the pin to high ###

    GPIO.cleanup()

    GPIO.setup(17, GPIO.IN, GPIO.P_UP)

    ## ON THE BOARD STATE

    GPIO.setup(18, GPIO.IN, GPIO.P_UP)

    ## #12 ON THE MUSIC PLAYER

    GPIO.setup(19, GPIO.IN, GPIO.P_UP)

