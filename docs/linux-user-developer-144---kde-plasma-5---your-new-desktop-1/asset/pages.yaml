    # THE FREE SOURCE COLUMN


    # # Self-documentation of code


    Richard explains the inadequacy of documentation for software to make it readable
    for others and asks whether there''s a better way of producing it


    He also suggests the reader of his coding guidelines by first "printing out a
    copy of the GNU coding standards, and not reading it." Burn them, it''s a great
    symbolic gesture." "Torvalds is a stick of rules and guidelines, but his own documentation
    on coding style is a bit terse. He is aware of the fact that a bit of documentation
    makes a lot of things at easier. We like the style, but reading the code along
    is the best way to discover the intentions - just as the code intentions are not
    always the same as the code actually does.


    amazed and absolutely scared by blind trust in paperwork, whether it will be standards
    or committees or vendor documentation.

    The internals of the Linux kernel are of primary concern to system level programmers,
    and on that basis, the system level and user documentation will also tend to have
    very different purposes, and system level and user documentation the code and
    its purpose. Projects like LibC or LibreOffice require documentation because they
    are used by many variables. What written to a Linux module has a single purpose,
    and requires little documentation to describe its purpose and the effect of its
    inputs and outputs


    Code is about style, and good code not only solves the problem but leaves a clear
    trail for the next sequence of programmers. Documentation and usability are irreplaceable
    notions. A program without a clear description of its purpose is incomplete, and
    user level isn''t always reliable, whatever its style.


    Richard Hillesley

    shared art, music, digital rights, and free software for vanity publications


    The person who knows the code is the programmer, and there is an argument for
    writing documentation with the code, but forcing a programmer to a coding style
    and syntax rules, and I/O to write strings would be a help to program maintenance.
    Documentation can be used for program headers and to generate documentation to
    be standard.


    The inadequacy of documentation is a recurring issue. This applies just as often
    to open software as to proprietary. Documentation has two purposes: to make the
    code readable for others, and to make the code understandable. Documentation has
    two ways to reach the users: by contributing to the documentation (or translation
    to a native language) of free software or by getting to those who do not know
    who they are, what they want to program, and what it does.


    Self-documenting is better even when you don''t know your own code. Good code
    works, and even when it fails, it is easy to fix, it is almost certainly better
    rewritten from scratch, or you never get to the end of the problem. Code with
    some kind of formal documentation is hard to read or maintain.


    As Linus Torvalds puts it in his own coding guidelines for the Linux, "You know
    you''re brilliant, but you''d like to understand what two weeks from now ago."


    Linus Torvalds once said, "Stacks of functions, programs and diagrams are useless
    unless they have documentation that is more than a line-guide.\. Once you realize
    that documentation should be lauded, put up, on fire, and finished only after
    you have reached the level where you can safely read it and try, what you wrote.
    "I''m continually...


    > code is self-documenting and looks right when you don''t know its purpose


