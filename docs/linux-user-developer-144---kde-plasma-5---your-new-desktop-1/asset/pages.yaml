    \ -- sh - 90~45\ntotal 1\n-lrwxrwxr-x 1 root root 34 Mar 17 15:27 -> /etc/nginx/sites-available/default\
    \ site with Nginx\n    listen 80 # listen for ipv4; line is default and implied\n\
    \    listen [::]:80 # listen for ipv6; line is default and implied\n    #listen\
    \ 443 ssl # listen for ipv4; line is commented out\n    #listen [::]:443 ssl #\
    \ listen for ipv6; line is commented out\n    location ~ \\.php$ { fastcgi_pass\
    \ 127.0.0.1:9000; }\root@mail:etc/nginx/sites-enabled #1\nstart nginx\n    master\
    \ process 1234 started on 127.0.0.1:100 (Address ready in use)\n    worker processes\
    \ 5 started, on 127.0.0.1:100 (Address ready in use)\n    worker processes 5 started,\
    \ on 127.0.0.1:100 (Address ready in use)\n    worker processes 5 started, on\
    \ 127.0.0.1:100 (Address ready in use)\n```\n\n# 04 Serve two sites with Nginx\n\
    \nAlthough it looks like you need to make changes to nginx.conf to configure Nginx,\
    \ it is better to create two new files inside /etc/nginx/sites-enabled. All the\
    \ contents of the files are included automatically in the nginx.conf by the following\
    \ command include /etc/nginx/sites-enabled;\n\n```\ninclude /etc/nginx/sites-enabled/*;\n\
    ```\n\nFor our example, the two subdomains will be named ltd1.msoukatale.eu and\
    \ ltd2.msoukatale.eu. you should also update your DNS to create the two subdomains.\n\
    \n# 05 Nginx configuration\n\nTwo files were created /etc/sites-enabled, named\
    \ ltd1 and ltd2, which hold the configuration for each subdomain. Since they serve\
    \ two different servers, and both have different access and error log files, each\
    \ will use the same API as defined by their own configurations.\n\nAs you can\
    \ see, listen on port 80 (the value of the virtual server address) is used in\
    \ both root directories. Now you need to create two index.html or index files,\
    \ one in /var/www/public/ltd1/index.html and another in /var/www/public/ltd2/index.html.\n\
    \n+   01 Install Nginx\n- Installing Nginx on Debian 7 is as simple as following:\
    \ execute the following command with root privileges:\n- # apt-get install nginx\n\
    \nDebian 7 will install an older version of Nginx (1.2.1) but you can install\
    \ a newer version of Nginx if you want. The default repository of Nginx on Debian\
    \ is /usr/share/nginx/, which you can change with the following settings:\n\n\
    ```\n- #1 ls -la /usr/share/nginx/\ntotal 8\n-lrwxrwxr-x 1 root root 34 Mar 17\
    \ 15:27 -> default.conf\n-lrwxrwxr-x 1 root root 104 Apr 01 12:04 -> index.html\n\
    ```\n\n# 02 Nginx configurations\n\nOn a Debian 7 system, the configuration files\
    \ of Nginx are located in /etc/nginx. The contents of /etc/nginx are similar to\
    \ /etc/apache but Nginx puts its own files there. It is good practice to create\
    \ a separate configuration file for each domain or subdomain to serve and put\
    \ them inside the sites-enabled directory.\n\n# 03 Serving your first site with\
    \ Nginx\n\nIf you try to run Nginx while Apache is already running, it is very\
    \ likely that you are going to get some errors. You can stop Apache first or you\
    \ can use a TCP proxy, and in this case, Apache can use a TCP proxy instead of\
    \ Nginx for its own purposes; therefore you should change the Nginx configuration\
    \ to use any port as long as it is not in use by another process.\n\nIf you want\
    \ to use the default port 80 (the value of the HTTP service), you must manually\
    \ select the configuration file at the end of the URL, so that Nginx can use it\
    \ instead.\n\n# 06 Rewrite nginx rules\n\nNginx does not support a .htaccess file.\
    \ The functionality of a .htaccess file is enabled in the configuration of each\
    \ individual directory. The equivalent rewrite rules in Nginx are usually simpler\
    \ and less complex than the ones used in Apache.htaccess.\n\nWhile not having\
    \ a .htaccess file, the equivalent configuration looks like a like one. As you\
    \ become more experienced with rewrite rules, you will appreciate Nginx rules\
    \ and thinking about how .htaccess works.\n\nA good practice is to work with two\
    \ processes and find out if two are not enough. Further, fewer worker processes\
    \ mean less memory used by Nginx.\n\n```\n# group - worker nginx processes\nworker_processes\
    \ 4;\n```\n\n51 www.linuxuser.com"
