  md: "# # Send and receive emails using Node.js\n\nUse Node.js modules to send report\
    \ errors and storing mail offline\n\nTUTORIAL\n\n# ## How old is email?\n\nThat's\
    \ a question question you can date modern email – at least the beginnings of it\
    \ back to the seventies. Computerised point-point messaging systems have been\
    \ knocking around since the Sixties but a standardised system that connects different\
    \ computers across a network was a pretty awesome idea. The @ sign has been around\
    \ for a long time, there was widespread use of the 17th Century and accounts up\
    \ in 14th Century manuscripts. Now that email is sent more in a day than there\
    \ are people to read it. Why not use emails? seemingly on a whim to help determine\
    \ a user on a separate machine to send a message to just the local box.\n\n> Node.js\
    \ is very much the new thing in the technology world\n\n# ## 03 Sending our first\
    \ email\n\nRight, now we're set to send email at least that out. The method we\
    \ just created, `sendmail`, is what we're going to use to send email, let's give\
    \ it a try.\n\n```\n// using a preconfigured service\nvar transporter = nodemailer.createTransport({\n\
    \  service: \"Gmail\",\n  auth: {\n    user: \"EMAIL USER>\",\n    pass: \"EMAIL\
    \ PASSWORD\"\n  }\n});\n```\n\nFig 01\n\ntransporter accepts two arguments: the\
    \ first is an object where the email is going, coming from, the subject, the subject\
    \ line, and the body of the message. The second argument is a callback that will\
    \ be called when the email has successfully sent (or, if it went wrong). Taking\
    \ care of that means we don't need to create a new transporter for every message\
    \ we want to send, we can use the same one again and again.\n\n```\n// using a\
    \ custom configure\nvar transporter = require('nodemailer-smtp-transport');\n\
    var transporter = nodemailer.createTransport({\n  host: \"EMAIL SERVER\",\n  port:\
    \ 25,\n  auth: {\n    user: \"EMAIL USERNAME>\",\n    pass: \"EMAIL PASSWORD\"\
    \n  },\n  maxConnections: 5,\n  maxMessages: 10\n});\n```\n\nFig 02\n\nYou'll\
    \ see that we have a text and a html body in our object. The text is plaintext\
    \ message and our html is HTML body for the message. You can send one or the other,\
    \ or both, if you need for older email clients – but they don't have to equal\
    \ one another. We have the field surrounded so you can quickly check. Now, let's\
    \ send email (Fig. 03).\n\n```\nvar mailOptions = {\n  to: \"person@mail.com\"\
    ,\n  from: \"Node Mailer <nodemailer@mail.com>\",\n  subject: \"A test of Nodemailer\"\
    ,\n  html: \"Mary had a little lamb, with feathers as white as snow\",\n  text:\
    \ \"where everywhere Mary was to follow ~\"\n};\n\ntransporter.sendmail(mailOptions,\
    \ (error, response) => {\n  if(error) {\n    console.error(error);\n  } else {\n\
    \    console.log(response);\n  }\n});\n```\n\nFig 03\n\nAnd if you open your email,\
    \ you'll see a shiny new email sitting in your inbox. Neat, huh?\n\n```\nimap.once('ready',\
    \ function() {\n  console.log(\"I am ready!\");\n});\n\\imap.once('error', function(err)\
    \ {\n  console.log(\"There was an error connecting to the mail server,\", err);\n\
    });\n\\imap.once('end', function() {\n  console.log(\"Connection closed\");\n\
    });\n```\n\nFig 04\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_46_0.png)\n\n47\
