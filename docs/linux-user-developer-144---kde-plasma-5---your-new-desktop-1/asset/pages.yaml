    \ | Description |\n| FILENAME | Name of current input file |\n| FS | Field separator\
    \ character |\n| NF | Number of fields in input line |\n| NR | Number of records\
    \ |\n| OFMT | Output format |\n| OFS | Output field separator |\n| ORS | Output\
    \ record separator |\n| RS | Input record separator |\n\n```\n#!/usr/bin/awk -f\n\
    # Generate random numbers using Awk\nfor (i=0; i<100; i++) {\n\tprint i;\n}\n\n\
    while (i < 500) {\n\tm = int(rand()*100);\n\tprint tm;\n}\n\nfor (i=0; i<100;\
    \ i++) {\n\tprint i, \"Record\", rand(), \"times\";\n}\n```\n\nThe BEGIN and\n\
    END patterns\n\nGenerating\nrandom numbers\nusing Awk\n\n# Process text\nfaster\
    \ with Awk and Sed\n\nMake your life easier by using Sed and Awk\nto work with\
