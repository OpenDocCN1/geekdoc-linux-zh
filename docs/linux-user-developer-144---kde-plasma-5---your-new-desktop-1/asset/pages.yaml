    the top desktops. Like XFCE it''s good on GTK, but it''s more about being minimalist
    without losing the features of a standard or traditional desktop while a CPU monitor
    can be included in the panel itself.


    Specifically, LXDE uses only 78MB of RAM, with 20MB on top of Openbox as a pure
    window manager. Compared to XFCE, if you''re running on 256MB of RAM, that''s
    a big enough amount to carry. This is also used on Raspberry, as the Raspberry
    Pi.


    LXDE is a very mouse-driven desktop. There are no important keyboard shortcuts
    and everything needs to be accessed via point-and-click. Windows are typically
    arranged and the window styling is normally minimal. The program menu holds the
    standard range of categories for programs and access to settings; all the default
    LXDE apps are quite basic but they''re all quite customisable in the process.
    There''s nothing really quantifiably special about LXDE in terms of workflow –
    it''s just that it has a good basic workflow while being as lightweight as it
    can.


    In terms of extr out more powerful systems, the gain made between XFCE and LXDE
    is worth getting into diminishing returns when you''re concerning yourself over
    ten megabytes on eight gigabyte system.


    LXDE can be further modified to make it lighter than its standard version, by
    changing the file manager. When there are file managers that do just enough and
    save on a few extra megabytes, here are some suggestions on alternate file managers:


    ICEWM

    A lightweight manager sometimes paired with LXDE on extremely lightweight systems


    FWM

    A much older windows manager was made in a time when resources were more precious.


    Enrichment

    We talk about this later as fully-blown desktop but it can also be used as a lightweight
    manager in LXDE itself


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_22_4.png)


    Left Another simplistic file manager that does no more than it needs


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_22_5.png)'
