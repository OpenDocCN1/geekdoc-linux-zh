- pgno: 60
  md: '# # Bullet Pi


    PiFace creator Andrew Robinson shows how you can freeze time by chaining 48 Raspberry
    Pi cameras


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_60_0.png)


    **What was the inspiration behind Bullet Pi?**nSo I saw The Matrix and also a
    project called *Supernatural: The Universe Powers of Animals* which shot dots
    jumping out of the wall and they could freeze time, and then repeat. I thought
    what if I made an array of Raspberry cameras and it would be a really amazing
    effect? And here it was, it actually worked, but it seemed quite simple. So I
    had the Raspberry Pi and a couple of cameras on my desk, and it was sort of like,
    ''Well, if I have enough time I could just get a lot of cameras and they''re not
    expensive - right?'' It was one of those moments when you think it would work
    but you don''t actually know. So I bought four cameras and started.


    with buttons - it just draws a menu. So that lets us know all the Pis have booted
    up, but if you''ve got 48 Pis how do you find out which one failed when they lock
    up? So that was really a tricky task in terms of debugging, and I also wanted
    to do a lateral version.


    you can build it - but it might be much easier. We also tried it in other configurations,
    and when you put it in a list instead of going through a menu on each Pi, and
    then when the sequence is in a list you can actually retrieve the Pi that you''ve
    made a mistake on and look at what you want. Like SSH into it and set a file.


    **What are you using to stitch the images?**nWe had to do this to get a smooth
    video out, but some of the frames were overlapping, and if you don''t then the
    pictures will go up and down. So we also took a test to find out whether there
    was a positive or negative offset to each frame, and then we stitched them together
    perfectly and put them in the middle of the frame.


    **What configurations are you using?**nWe tried some scenarios and we also tried
    it in one lines, then vertically, and then as well as spinning around a point.
    We found some plans which worked and we have had many wacky setbacks so far.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_60_1.png)


    Andrew Robinson

    research fellow at the University of Manchester, and the creator of Control and
    Display at

    pipiface.org


    **Like it?**

    If you''re interested in Control and Display other projects, check out tutorials
    provided by Andrew Robinson at http://pipiface.org/


    **So was it a good concept testing?**

    Well, yes it was - but it''s not like we''d actually finished the thing. We still
    didn''t actually know. So then it was just buying of a few more cameras. To get
    to the stage where you can all take a test of the full set of 48 cameras and build
    it. It was only really when the first time we got them all together, that you
    could have a load of frames and then it is pretty much what we needed. One of
    the problems was that we had to deal with a lot of frames and then flickering...
    ''Well we''ve got to, but to... then?''


    Is it a scripted thing or do you manually invoke the shots?

    We actually triggered it as two points, but then we decided to trigger them all
    in together and all running at once. Once we run it we have to stitch the shots
    and save the images, and if you trigger it one by one then the person you''re
    taking the image of each shot would be different. So it saves saving time, that''s
    always better for us.


    Further reading

    To see Bullet Pi in action check out this video from the Manchester University:
    https://youtube.com/v=vly2ly2Q


    **What''s the best Pi projects comes from? How do you want to do it?**

    It''s gone through a few iterations and now we''re working on a few refinements.
    In the latest setup, we''ve got all the Pis booted into Raspberry Pi OS, and now
    we''ve got them over every Raspberry Pi a PiFace and Control Display module that
    you can have simple像是


    **Do you plan to do any more things with it?**nI would like to do more things
    with it. One of the things that I would like to do is to walk around and play
    with more of it. So we want to have someone standing in the circle and then we
    could actually get possible angles and take the rig - that way we could follow
    the action, and then see what the Raspberry Pi can do. I would also like to see
    it in background mode things like that. We also think fireworks could be quite
    interesting, come November.


    Is the PiFace a complex project or is it something you wanted to do?

    It was a luxury for us that we had it around. Turned around to save us time when
    we were debugging, it''s not essential -


    61 www.linuxuser.com'
