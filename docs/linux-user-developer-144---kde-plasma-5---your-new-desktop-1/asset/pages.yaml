  md: "So what have we done here? As soon as a connection we've opened is ready we\
    \ use 'open()' to read the statistics for our mailboxes, in our 'INBOX': Now,\
    \ every request we run from inside this callback will be applied and will result\
    \ in mail from them. You've logged out the 'this' box is useful as it gets stats\
    \ about the mailboxes we've just opened. So, let's get a couple of items from\
    \ our inbox, say the first item\n\nWhat we'll want to fetch a sequence of messages\
    \ from the newest to the tenth and then log it? We need to create a new variable,\
    \ fetch to this:\n\n```\nvar fetch = imap.fetch('seq1:10', {\n  'HEADER.FIELDS\
    \ (SUBJECT)',\n});\n```\n\nHandling data streams us through the amount of messages\
    \ we've like to retrieve and the parts of those messages that we'll like to parse.\
    \ In this instance, we're getting the text and subject line of the first ten messages.\
    \ When the method is called, a stream of data will be received from our server.\
    \ We need to add items to fetch to build up the connection until we have all of\
    \ the data we're expecting (Fig. 06):\n\nSo as once we've received all the messages\
    \ we've asked for, we will loop through the MAP events. For each message, 'on(\\\
    'message')' will be triggered to listen for the 'body' and subject. Then we hook\
    \ into the data to get the full content of our message (Fig. 07):\n\nAs we receive\
    \ the data from the stream, we use 'on(\\'data')' and add it to our buffer. Every\
    \ stream we receive is fired from our mailbox, so we can now log out the buffer\
    \ and receive our email body.\n\n# So7 we have used the tools to send and receive\
    \ many emails with Node.js\n\nBut that doesn't show us how much Node.js can do.\
    \ We want to send a report when an error has been received, before we wrap up.\
    \ We're going to write a Node module that will run alongside other Node apps.\
    \ We'll create a new file called 'crash.js'. Since we use 'send.js', we're going\
    \ to require Nodemailer in this script and just like before, we need to create\
    \ a transporter for any email.\n\n```\nfunction sendReport(details, callback)\
    \ {\n  details.to = \"errorreport@mail.web\";\n  details.from = \"node.app@the.web\"\
    ;\n  details.subject = \"A Node app has crashed.\\n\n  transporter.sendMail(details,\
    \ function(error, info) {\n    if(error) {\n      console.log(error);\n    } else\
    \ {\n      console.log(\"Message sent: \" + info.response);\n      if(callback\
    \ === undefined) {\n        callback();\n      }\n    }\n  });\n}\n```\n\n```\n\
    sendReport({\n  html: \"<div>One of your Node apps has crashed. The error \" +\
    \ exception + \"</div></div>\",\n  function() {\n    process.exit(1);\n  }\n});\n\
    ```\n\nAs soon as we send an email report, we're going to create a function that\
    \ will be triggered when an uncaught exception occurs.\n\nIn just before, we'll\
