    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_65_0.png)


    Advancements in alarm clock technology are hardly exciting news reports you see
    on the ten o''clock but it''s something very real in this day and age. Anyone
    with a smartphone has access to a world of apps to help them get a better night''s
    sleep, through sleep-cycle sensing and a gradually increasing alarm volume to
    wake them up.


    If you don''t have a smartphone or find the current selection tool limited, you
    can always make a smart alarm clock using Raspberry Pi. In this tutorial we will
    show you how to program the Pi to play a bit of white noise, use a custom alarm
    sound and help you wake up.


    01 Update your Pi

    To make sure the Raspberry Pi will work as expected, it''s best to get it updated
    first of all. Do with this:


    +   * sudo apt-get update && sudo apt-get upgrade


    This will also mean when installing new software the latest version is installed
    as well.


