  md: '# # Run Linux on your Android device


    Install an ultra-portable version of Linux


    FEATURE


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_26_0.png)


    # # Rooting questions


    The ins and outs of rooting an android device


    What is rooting?

    In short, it is gaining root access to control some of Android''s security features.
    This involves unlocking the device''s bootloader, replacing the system with a
    custom version and installing a superuser app.


    numerous desktop utilities to simplify the process. There''s even an Android app
    for it, which is not entirely transparent and you''ll have to deal with many devices
    with a single button tap.


    What benefits does it offer?

    Rooting allows you to modify almost every aspect of the system, install custom
    ROMs, remove bloatware, and run a full-blown Linux environment.


    What are the downsides?

    You''ll almost certainly void your warranty and there is a low risk of bricking
    your device. You might break things, but you should be able to restore it if you
    have a computer connected to the device and fastboot tools to flash the original
    Android ROM. Also, unlocking requires a factory reset that wipes your device''s
    data and apps, so you''ll want to be sure to back up everything first. Data is
    backed up to your Google account in the cloud, but it''s not entirely reliable,
    so you might want to find another way to back up your data. A rooted device access
    to Linux app stores is fantastic.


    How difficult is it to do?

    The process differs for every Android device, but often entails connecting to
    a computer. For this, your device must have USB Debugging enabled, which appears
    when you tap the Build Number seven times on the About Phone screen. Fastboot
    tools are also needed.


    Above Sandy, we experienced problems with the Complete Linux Installer app


    If you are waiting for the launch of Ubuntu smartphones (which are supposed to
    later this year), don''t want to wait for such a new phone, or you want to use
    a different version of Linux on your current phone, there is an alternative.


    It is possible to run a variety of Linux distributions on a standard Android smartphone
    or tablet without rooting to get a full-desktop experience. You don''t even need
    to root your phone for any of the methods that we explain in here.


    and simplest of this is Kevin Boone''s KBX2 project goal is to run a variety of
    UserBox with a number of Linux distributions. With all of the features we explore
    in here, it can be installed via an Android app on your Android device.


    No rooting required

    In some methods, rooting for Linux on an Android device doesn''t even require
    you to root the device to unlock Android''s security features and gain superuser
    privileges—we''ll take a look at that process later.


    Another non-root solution is the Linux Emulator, part of the GENymU hardware.
    It can be downloaded as an APK from the Play Store and installed on your device.
    It allows you to run Linux on an x86 ARM-based device, but it''s a bit on the
    slow.


    If you''re after a more fully-featured device without rooting, the best solution
    currently available is the GnuRoot app by Ian Shannon. Downloadable for free from
    the phone Store.


    # # KBX2 Busy Box


    An easy-to-use InstallBox with some standard Linux tools


    The KBX2 project: kevinboone/kbx2/

    works by creating a Linux root file system within the private data area of your
    Android device. You don''t need to root it—try Android Linux Terminal by Jack
    Paulge!


    which runs manually from any app command, and it''s much easier to use the Package
    Manager app too.


    You can download the project from the KBX2 site without the need to root your
    Android device.


    ```

    dpkg -i /sdcard/Download/package.deb

    Compile packages include Perl, Dropbox

    SSH support), GCC, rim and vim.

    ```


