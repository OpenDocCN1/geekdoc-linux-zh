- pgno: 61
  md: '# # Tutorial


    # # Make a Raspberry Pi sampler


    Build your own looping drum machine with only 200 lines of code!


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_61_0.png)


    Left Extra breadboards are used here to keep the main breadboard as free from
    wires as possible


    +   ### What you''ll need

    - Latest Raspberry image [raspberrypi.org/downloads](#)

    - At least one breadboard

    - Push buttons

    - LEDs

    - Female-to-male GPIO jumper cables

    - Male-to-male GPIO jumper cables


    In this tutorial we combine electronics, music and programming knowledge to create
    a simple sampler with looping capabilities. The implementation in this article
    has three drum sounds as the samples, but it is trivial to add more until you
    run out of GPIO pins.


    01 Connect LEDs

    The circuit diagram shows an LED that can be turned on or off with GPIO output.
    The orange wire is the connection to the GPIO pin. This goes through a 2200 ohm
    resistor to limit the current level. This current flows the positive leg of the
    LED and then back to ground. We need more LEDs for this project.


    Before we start, I''ll cover some basic terms. Music is split into bars. There
    are a certain number of beats in a bar. Our sampler uses 44 steps to represent
    beats in each bar. Tempo is the speed at which music is played, and it is measured
    in beats per minute (bpm). A metronome is an audible device used to keep time
    with the beat.


    Quantization is the process of aligning notes to beats, or fractions of a beat,
    and a quantization value is usually given in the form 1/8. This means that there
    are eight places in a bar where a note can be placed. When the sampler is recording
    and a button is pressed, we store the sample at the current position in the bar
    with the accuracy of the quantization value. There''s a lot to cover, so let''s
    get started.


    Liam Fraser is the creator of the Raspberry Pi server series and YouTube videos
    and volunteers as a Linux volunteer for the Raspberry Pi Foundation


    www.linuxuser.co.uk'
