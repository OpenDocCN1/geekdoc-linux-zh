  md: "# Tutorial\n\n# Full code listing\n\n```\n#!/usr/bin env python\nimport time\n\
    import subprocess\nimport RPi.GPIO as GPIO\n```\n\n```\nalarm_hour = 7\nalarm_minute\
    \ = 30\nalarm_volume = 10\n```\n\n```\nsubprocess.call('mixer set Pcm 10%%', shell=True)\n\
    subprocess.call('vlc-wrapper /home/pi/alarm/whitenoise.mp3 --repeat -1 dummy',\
    \ shell=True)\n```\n\n```\nGPIO.setmode(GPIO.BOARD)\nGPIO.setup(3, GPIO.IN)\n\
    ```\n\n```\nwhile(True):\n    current_time = list(time.localtime())\n    current_hour\
    \ = current_time[3]\n    current_minute = current_time[4]\n```\n\n```\nif current_hour\
    \ == alarm_hour and current_minute == alarm_minute:\n    subprocess.call('vlc-wrapper\
    \ /home/pi/alarm/alarm.mp3 --repeat -1 dummy', shell=True)\n    time.sleep(62.5)\n\
    ```\n\n```\nwhile True:\n    if GPIO.input(3)==0:\n        subprocess.call('killall\
    \ vlc', shell=True)\n```\n\n```\nelse:\n    alarm_volume = 5\n    new_volume =\
    \ 'mixer set Pcm ' + str(alarm_volume) + '%'\n    subprocess.call(new_volume,\
    \ shell=True)\n    time.sleep(2.5)\n```\n\n```\nGPIO.cleanup()\n```\n\n# PiAlarm\
    \ code\n\nOur smart alarm code for the Raspberry Pi, using Python, VLC and a button.\n\
    \n+   01 Only basic modules are needed for the code - to the alarm, GPIO for the\
    \ volume, and for the system of calling VLC and changing volume.\n\n+   02 The\
    \ alarm settings are kept here: the time is in 24 hours for your hour variable,\
    \ you can change this to suit your needs.\n\n+   03 The white noise file begins\
    \ to play. It uses vlc and is called within a shell. The repeat option is important\
    \ to make sure it plays all night.\n\n+   04 This sets the GPIO port to accept\
    \ an input from the button, which will be used to kill the clock alarm.\n\n+ \
    \  05 The loop keeps so that the code can keep track of the time, using localtime\
    \ as part of the process.\n\n+   06 If the button is pressed, the code makes the\
    \ current time the same as the alarm time before activating. The sub-process uses\
    \ the command line to first kill vlc, which stops the white noise, before restarting\
    \ to play the alarm and you.\n\n+   07 If the button is pressed, VLC is killed.\
    \ This simply stops the alarm and you.\n\n+   08 If the button is not pressed,\
    \ the value for alarm is increased by five and then passed on to the command line\
    \ to increase the volume by 5 percent. It then waits 2 seconds before the alarm\
    \ is increased.\n\n+   09 The sleep loop dictates how long the button needs to\
    \ be pressed, and the GPIO cleanup function makes the GPIO ports are deactivated\
    \ when everything is finished.\n\n# The code makes sure the current time is the\
    \ same as the alarm time before activating"
