  md: '# Linux Developer


    # Send and receive emails using Node.js


    Using Nodemailer and Node IMAP, we''ll look at using emails to send error reports,
    well as storing recent emails offline


    # Advisor


    Sean Tracy is a creative technologists at a leading digital agency. He spends
    a lot of his time living inside Node.js, Python and Android


    # Resources


    +   - Node.js 10.0.*](https://nodejs.org)

    - Nodemailer 1.1.1.*](https://nodemailer.com)

    - Node IMAP 0.8.12](https://github.com/mdsec/node-imap)


    # A mail server with IMAP


    # Your favourite text editor


    Email is one of the oldest technologies we''ve been getting around and is a part
    of our everyday lives. The rise of social networking behaviors such as Facebook
    or Twitter, has made email as a way to get large boxes of text and media across
    the web. But although we are aware of more ways to connect, you most likely maintain
    your mail server you provide or shaped around. When was the last time you played
    around it?


    In this article, we''re going to take a look at two of the most popular IMAP modules
    for Node.js - Nodemailer and Node IMAP. We will show you how to log into an email
    server with send out generated messages to recipients, and Node IMAP let us access
    our mail servers and read some of the most recent messages sent by others.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_45_0.png)


    Above you can combine Nodemailer with whichever mail server you choose


    +   01 Install nodemailer modules


    Those of you with Nodemailer may already be wondering how to get into IMAP - that''s
    right, with NPM. Create a new project folder and then run the following command:


    ```

    npm install nodemailer

    ```


    So, what does nodemailer do? Nodemailer is our module for sending an email using
    service and Node IMAP is the library to be used to retrieve emails from our mail
    server. First, we''ll create a simple example to get started with how to use each
    library.


    +   02 Set up IMAP modules


    Create a new file ''mail.js'' for editing and configuring Node IMAP like:


    ```

    var nodemailer = require(''nodemailer'');

    ```


    On this''s it would make a great deal for us; in order to send an email need to
    tell Nodemailer how to connect to our server and with a transporter. Now, we have
    two options here:


    we can use one of the preset transporters put together for us by the Nodemailer
    library to connect with popular mail services or we create our own configured
    transporter to connect to any configured mail server. To send and receive emails,
    we''ll look at all approaches here however. When you choose to connect to your
    email server you need to provide the technical details are required for a connection.


    Let''s get on to what is. First


    This time, we''ll need the host, port number and the maximum number of allowed
    connections to connect to our server, as well as the credentials that we passed
    before.


