  md: '# Editor''s picks


    **LXQt** Targeting the need for a classic desktop environment that''s lightning;
    fast, modular and based on modern technologies and standards, this is the result
    of a merge of the LXDE-Qt and Razor-qt projects; still undergoing development
    but has all the hallmarks of a gold standard desktop environment.


    **Nginx** Emerging as a serious alternative to Apache, with take-ups steadily
    rising, Nginx is an HTTP and reverse proxy (plus mail server) demonstrates its
    capabilities using Joomla! this month and you can install it from the packages
    on your disk.


    **Enlightenment** a massively extensible, lightweight window manager, Enlightenment
    is part of a wider project of libraries that power millions of systems, from mobile
    phones to printers.


    # Complete index


    # Operating systems


    **Elementary OS Freya Beta 1** Exactly a year after its release, elementary OS
    is back with its first beta for version 3, bringing a host of updates, new hardware
    support and libraries.


    **LXDE 14.0.4** A new favourite of ours, this is the 64-bit version of the lightweight
    LXDE distro that revitalises the old project with an optimized LXDE desktop.


    **Android-x86 4.4** Having been in development for some time, the team''s first
    stable version of the Android 4.4 (KitKat) port for x86 has finally arrived.


    **PlinuxOS 2014** One of the established release distributions, this latest version
    of PlinuxOS is the LXDE spin, though it''s easy enough to re-install your desktop
    if you prefer a different environment.


