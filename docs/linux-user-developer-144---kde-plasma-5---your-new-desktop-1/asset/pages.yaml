  md: '# # Review Screenwriter software


    # In Brief: Compare and contrast our verdicts


    # ### Treby


    # ### Libreenplay


    # ### Celtx


    # ### Fade In


    | Features | Treby | Libreenplay | Celtx | Fade In |

    |---|---|---|---|---|n| | App behaviour can''t be changed and there no templates
    for different projects | Only holds basic formats in the Styles menu; then they
    are set automatically | Plenty of customise templates and a paid for syncing service
    built in | Good range of fairly customisable, though limited to TV and film |

    | Formatting | Desack of the layout, auto-formatting is major and recognises what
    you''re doing | Auto-formatting is pretty good but the preset Styles can only
    be customised case-by-case | Though Celtx isn''t quite smart as Treby, it is still
    much easier to pick up good ideas | Easily accessible styles drawer and plenty
    of options to switch and modify them |

    | Management | No easy way to see and browse saved information in a macro level
    interface | Powerful indexing and searching tools but no dedicated lists or database
    | Solid baseline less visible character database and user interface | Solid navigation
    feature for it, though no direct search de-indexing needed |

    | Installation | Not in many of the major distros, no besides needs to compile-
    | Not the easiest to install and missing key management/navigation features |
    While it''s a bit more available than a regular Writer document, it''s not really
    a time-saver | Celtx software let down a little by installation and operation
    | Excellent for scripts but not enough for larger projects |


    # # AND THE WINNER IS ...


    There is to be said for the simple interfaces provided by Treby program and the
    excellent Celtx software and its suite of cloud-based tools that won us. One of
    the key advantages of Celtx is its many features, with templates for writing comics,
