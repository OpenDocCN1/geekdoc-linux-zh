  md: '# # Boot Linux from an NFS server


    Launch a distro from multiple locations on a network


    TUTORIAL


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_0.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_1.png)


    | robz@vubontw: | Configure PXE |

    | --- | --- |

    | nano 2.2.6 | options |

    | /etc/dhcp/dhcp.conf | modified |


    # 01 First installation


    The first job is to install some simple packages on the server side. Open up the
    DHCP server a few other things with:


    ```

    ```sudo apt-get install dhcp-server

    tftppd-hpa nfs-kernel-server\initramfs-tools ```

    ```


    # 02 Configure DHCP


    The server will need to have a DHCP server set up. To do this, open the terminal
    and get the DHCP config file by typing nano /etc/dhcp.conf by adding the following
    lines to the end of the file:


    ```

    ```allow boot;

    allow boot; ```

    ```


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_2.png)


    ```

    ```host pxe_client {

    hardware ethernet=xx:xx:xx:xx:xx:xx;

    fixed-address=192.168.1. }

    subnet 192.168.1.0 mask 255.255.255.0 {

    range 192.168.1.100 192.168.1.250;

    options broadcast-address=192.168.1.255;

    options routers=192.168.1.1;

    options domain-name=servers.192.168.1.1; ```

    ```


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_3.png)


    # 05 Restart DHCP


    Save the file to confirm the changes - they can be modified further at a later
    date if any settings change. Before moving on, the server needs to be restarted
    using:


    ```

    ```sudo service isc-dhcp-server restart ```

    ```


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_4.png)


    # 03 Configure the server and IPs


    Add this:


    ```

    ```subnet 192.168.x.0 mask 255.255.255.0 {

    range 192.168.x.100 192.168.x.250;

    options broadcast-address=192.168.x.255;

    options routers=192.168.x.1;

    option domain-name=servers.192.168.x.x;

    filename="pxelinux.0"; ```

    ```


    Changing the ''x'' to your network.


    # 04 Configure PXE options


    Finish it off with PXE instruction to follow the client. This works especially
    if you want to use multiple discs.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_5.png)


    # 07 Create a TFTP server


    There needs to be a root directory for some of the TFTP files for the setup to
    work properly. This is linked with PXE booting protocols and so this directory
    needs to be created:


    # 08 TFTP boots


    The current PXE boot files need to be used by the TFTP directories so this is
    done with:


    ```

    ```sudo cp /usr/lib/syslinux/pxelinux.0 /tftpboot/ ```

    ```


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_6.png)


    # 06 Create a TFTP server


    There needs to be a transfer boot files and this can be done with a TFTP server.
    Open the config file with sudo nano /etc/default/tftp-hpa and add to the following:


    ```

    ```RUN_DAEMON="yes"

    OPTIONS="-1 -s /tftpboot ```

    ```


