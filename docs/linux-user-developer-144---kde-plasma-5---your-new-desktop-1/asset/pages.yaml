    # # Boot Linux from NFS server


    The distro is installed on the server that is always on. It can be used on multiple
    systems if set up correctly


    Diskless booting allows you to access the same distro from multiple locations
    on a network without juggling files


    # ## Resources


    An Ubuntu server


    While may think like they''re common, the concept of a mainframe with dumb terminals
    is of an obsolete concern now. The proliferation of high-performance machines
    made it easier to have everyone their own system and that''s really changed.


    between different computers within the same network, a more updated version of
    the classic machine image may prove better. With NFS booting, the kernel and file
    systems are kept on a central server and pushed out onto client systems to be
    booted off which means they will always be available wherever you want to log
    in.


    What has changed, though, is the way we treat data, which is now backed up to
    the cloud so it''s ever-accessible, or just around in our pocket on tiny USB storage
