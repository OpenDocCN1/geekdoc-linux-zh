  md: '# Tutorial


    # Program Arduino on the Raspberry Pi


    Rob Zwetsloot models complex systems and is a web proficient in Python, Django,
    Go and PHP. He loves to experiment with computing


    You can interface a Raspberry Pi with Arduino components – now learn how to program
    them from the Pi and control the Makeblock


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_69_0.png)


    # What you''ll need


    +   - Makeblock robot starter kit https://www.makeblock.com/starter-robot-kit-v2-0-blue-with-electronics/


    Learning to code is one of the best things about owning a Raspberry Pi for a lot
    of people. Python and C are easy enough to start with on a Pi and you won''t get
    stuck. When it comes to physical computing and making, not much beats using Python
    to control the open source controllers, servos and sensors associated with the
    system.


    01 Update your Pi

    Always sure your Raspberry Pi is up to date. This tutorial is based around Raspian
    so set up an SD card if you don''t have one, and then do an update with sudo apt-get
    update & sudo upgrade. Make sure the firmware is up to date as well with a sudo
    pi-update.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_69_1.png)


    Once set up, we can also use the Pi to program the Makeblock robot we reviewed
    in issue 142 of Linux User & Developer, using either the built-in commands or
