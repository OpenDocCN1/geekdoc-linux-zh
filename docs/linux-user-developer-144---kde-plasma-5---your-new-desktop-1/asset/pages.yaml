    \ you'll encounter with Nginx\n\n# ### Event-driven\n\nEvent-driven means that\
    \ notifications or signals are used to mark the initiation or completion of a\
    \ process; therefore resources can be used by other processes until a process\
    \ event is triggered. As a result, memory and CPU usage is optimised with Nginx.\n\
    \n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_52_0.png)\n\n# ### Asynchronous\n\n\
    Asynchronous means that threads are running concurrently and not block while array\
    \ many requests, meaning Nginx can handle a lot more.\n\n# ### Single-threaded\n\
    \nSingle-threaded means that a single worker process can serve multiple clients\
    \ because the resources are not blocked. It does this asynchronously with better\
    \ results than multi-threaded processes.\n\n# ## Nginx requests using as few threads\
    \ as possible\n\n```\nif ($rewrite_filename ~ \"/.*\") {\n  return 404;\n}\n```\n\
    \noutput of \"nginx -t\" will only show the first one.\nYou have to correct the\
    \ first error and run the command again to make sure no other errors exist.\n\n\
    Usually, requests are easier to read and understand Apache, but you need to train\
    \ yourself in order to be able to handle an .htaccess file.\n\n# ## 10 More about\
    \ Nginx rewrite rules\n\nYou will learn how to configure the single most useful\
    \ set of Apache rules into the equal Nginx setup. The rules are as follows:\n\n\
    # ## 11 Nginx versus\n\n# ## 09 Log files\n\nYou can define your log file format\
    \ as follows:\n\nThe only reason for Nginx to use modules is to make full use\
    \ of multi-core, multi-threading systems. On the other hand, Apache uses asynchronous\
    \ I/O, so it is better to serve each request using a separate process or thread.\n\
    \n```\nlog_format nginx_main '$$remote_addr - $remote_user [$time_local] \"$request\"\
    \ $status $body_bytes_sent \"$http_referer\" \"$http_user_agent\"';\n\nrewrite(\\\
    ($request_uri,\\$REQUEST_FILENAME) / /, break);\nrewrite(\\($request_uri,\\$REQUEST_FILENAME)\
    \ / /index.php?query_string last);\n```\n\nThe above rules dictate when the filename\
    \ in the URI is not a file or directory that is present on the disk, this is a\
    \ popular method for Content Management Systems. All Apache rules can be translated\
