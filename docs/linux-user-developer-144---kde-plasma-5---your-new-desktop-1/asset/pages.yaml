    # RDBMS Concepts


    +   1. What is a database?

    - A database is a collection of related information, or data, which is designed,
    built, and operated for some specific set of purposes.

    2. What is an RDBMS?

    - An RDBMS is a collection of programs that allows users to create, update, and
    maintain data in a relational database.

    3. What is a key?

    - A key is an attribute used to identify a record in a table.

    - Primary Key

    - Foreign Key

    - Unique Key

    - Composite Key

    - Candidate Key

    4. What are constraints?

    - Constraints are rules applied to table columns to ensure accuracy and reliability
    of the data.

    - Entity Integrity Constraint

    - Referential Integrity Constraint

    - Domain Constraint

    - Check Constraint

    5. What are data types?

    - Data types define the type of value that can be stored in a column.

    - Integer

    - Char

    - Varchar

    - Date

    - Boolean


