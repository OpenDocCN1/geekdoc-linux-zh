    Here you''ll find 20 of the latest and greatest

    software packages, all 10 desktop

    environments we test this month


    Tutorial Archives

    De-archived for programming pleasure,

    some of the greatest guides from past issues


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_95_0.png)


    # How to burn an ISO


    Want to try a new distro ISO? Here''s how to get started...


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_95_1.png)


    STEP 1: Grab a new ISO

    Copy the ISO from our disc cover to your

    hard drive go to the Tabs tab, click ISO and

    to Save. After, install an ISO online

    download. If you''re not sure you need a 32-bit or

    64-bit version, go for the former to be safe.


    STEP 2: Open or Install Brasero

    Brasero is the most popular open source-

    utility. If it''s not already installed on

    distro, locate it in your repository and

    install it. Then open and search ''Brasero

    im'' from the Projects tab on the left.


    STEP 3: Burn your disc image

    On the Burning Setup menu, click the first

    box - marked here - to select a disc image -

    and navigate to the ISO you just want on your

    drive. Once selected, you''ve got a CD or DVD

    writable disc image and click ''Create Image'''
