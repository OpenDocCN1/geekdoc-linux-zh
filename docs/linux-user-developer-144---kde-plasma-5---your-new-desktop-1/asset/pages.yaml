    \nWe can definitely help you out. The first thing is that external or hard drives\
    \ are different in Linux than in Windows. You may have noticed using USB sticks\
    \ or other types of storage plugging up in Linux, Mint, this is because Linux\
    \ handles the mounting process by automatically mounting the device in a place\
    \ in the filesystem, and then letting you know what type of file system it is.\n\
    \nOn one hand, this makes it easier without having to remember the device names\
    \ by typing into a file browser. On the other hand, it can be confusing to so\
    \ as\n\nyourself although you've never tried finding out how to connect a networked\
    \ for the first time. First of all, you'll need an IP address for internet-based\
    \ communication. You'll need the IP address of the hard drive on home network,\
    \ which hardware will be available with 192.168.1.250. You also need to know that\
    \ these hard drives use the ext4 file system.\n\nThat you should get actually\
    \ seeing the drive in that. To go to mount it automatically, you will need to\
    \ add the /etc/fstab file, which you can access in the terminal with something\
    \ like:\n\n```\n$ sudo nano /etc/fstab\n```\n\nWhere nano is just a text editor.\
    \ The line should look like this:\n\n```\n//192.168.1.250 /home/user/Share\nnfs\
    \ defaults 0 0\n```\n\n```\n$ # /192.168.1.250 /home/user/Share\nShare\n```\n\n\
    You can place it anywhere, but make sure to create the folder. If that doesn't\
    \ work, you'll need to install Samba. You can then find it in the software centre,\
    \ and then the mount point would be:\n\n```\n$ mount -t smbfs //192.168.1.250\
    \ / \nhome/share\n```\n\n# GNOME life\n\nGNOME 3 is confusing me I suppose is\
