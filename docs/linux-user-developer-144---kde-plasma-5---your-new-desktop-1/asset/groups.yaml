    ## 特性


    ## 黑马选手


    ### MATE 以及 GNOME 代码的延续


    Cinnamon 的轻量级对应品是 GNOME 2 系列的延续，当开发者不同意 GNOME SHELL 的方向时，它对代码进行了分支。MATE 团队的目标是保持
    GNOME 2 桌面风格并使其保持更新，整合通知和应用程序搜索等现代桌面功能。


    它最适合偏好经典 GNOME 2 工作流风格的资深用户：所有内容都可以从顶部栏访问，无需在不同的应用程序中寻找，窗口显示在底部面板，并采用以鼠标为中心的设计。它目前出现在几个发行版中，并不断被加入更多发行版；它比
    GNOME、KDE 和 Cinnamon 轻量得多，但确实无法与 LXDE 或 XFCE 竞争。


    > 最适合寻找现代功能的资深用户。相关发行版：Linux Mint, https://mate-desktop.org


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_23_0.png)


    - **优点**：流行 GNOME 代码的轻量级延续

    - **缺点**：对于某些使用 LXDE 或 XFCE 的用户来说过时


    上方：默认情况下，你可以让 MATE 看起来和旧的 GNOME 2 一模一样，尽管 Linux Mint 使用了略不同的……


    ## Enlightenment


    ### 一个具有独特且熟悉的轻量级备选项


    Enlightenment 依赖屏幕上略微倾斜的面板，其中包含系统信息和打开窗口列表。菜单可以从任何地方访问，但在桌面空白处的任何点击右键也会弹出选项。由于面板没有正确占据整个屏幕，实际上让你觉得错失了屏幕空间。它运行非常快、轻量，且在使用时高度依赖鼠标。由于面板隐藏的方式，它并不非常适合触摸屏，而且并没有多少实用的键盘快捷键。这是一个非常被忽视的桌面，它使用
    GTK 或 Qt 驱动，这使其在运行混合不同代码的应用程序时表现得好得多。


    > 最适合高度定制化、轻量化的设置。相关发行版：Bodhi Linux, Elive: https://www.enlightenment.org


    - **优点**：轻量且在可用性和选项效果方面关注独特

    - **缺点**：独特的界面可能让某些用户感到困惑


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_23_1.png)


    上方：你可以从任何地方访问应用程序菜单，以防你无法到达面板。


    LinuxUser | 重量级 | 新人入场 | 轻量级 *


    ## MATE, Enlightenment, LXQt & Openbox


    测试过的 10 种 Linux 桌面环境


    ## 特性


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_24_0.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_24_1.png)


    ## LXQt


    这个轻量级桌面的 Qt 端口在视觉上有一些差异。


    ## Openbox


    窗口管理器可以很容易地作为极简主义桌面使用。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_24_2.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_24_3.png)


    上方：LXQt 的审美比任何其他东西都接近 KDE，尽管如此，它仍然是 LXDE。


    上方：Openbox 真的只是一个窗口管理器，它控制窗口在桌面环境中的美学和位置，当作为桌面使用时，它的极简设计就会显现出来。


    将优秀的 LXDE 移植到 LXQt 的好处是，它是我们去年使用的 Razor-Qt 桌面的最佳继承者。它经常被评为最喜爱之一。LXQt 取了 KDE 的一些功能并将其应用于
    LXDE 框架——如果你是那种使用大量应用程序并偏好轻量级环境的人，那么 LXQt 是你的正确选择。


    Openbox 通常被认为是一个窗口管理器——控制窗口在桌面环境中的美学和位置的东西。然而，Openbox 也可以与其他工具完全独立使用来实现极简桌面，使用最少的资源。


    - **优点**：轻量级环境

    - **优点**：独特的界面

    - **缺点**：独特的界面可能让某些用户感到困惑

    - **缺点**：资源占用高


    上方：默认情况下，你可以让 MATE 看起来和旧的 GNOME 2 一模一样，尽管 Linux Mint 使用了略不同的……


