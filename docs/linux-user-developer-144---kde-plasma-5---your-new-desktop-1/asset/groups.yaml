  mdcn: "\n\n# 树莓派第一\n制作一个智能闹钟 • 另有 14 页树莓派专栏\n\nwww.linuxuser.co.uk\n\n# LinuxUser\n\
    \n# 4 种发行版与开发者\n实机启动 DVD\n\n# KDE Plasma 5\n\nVS\n\n# Gnome | LXDE | Unity | Cinnamon\
    \ 及更多\n\n# 经测试的 10 种桌面系统\n\n# 从网络启动 Linux\n为无无盘启动配置 NFS 服务器\n\n# 34 页专家 Linux\
    \ 教程\n\n+ >> Shell  Shell 脚本第 3 部分 >> Nginx >> Awk & Sed\n\n# 使用 Node.js 处理电子邮件\n\
    发送和收发邮件及报告\n\n# 在安卓上运行 Linux\n适用于未根化设备的发行版和工具\n\n+ 内页还精彩\n- >> 从树莓派为 Arduino 编写程序\n\
    - >> 评测：Android-x86 发行版\n- >> 测试了剧本创作软件\n\nJetson TK1\nNvidia Jetson TK1 是未来的单板计算机\
    \ (SBC) 吗？\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_1_0.png)\n\n# 你愿意做 Code\
    \ Club 的志愿者吗？\n\nCode Club 是一个全国性的志愿者网络，为 9-11 岁的儿童提供志愿者领导的课后编程俱乐部。\n\n我们需要精通计算机编程的人担任志愿者，每周在当地的小学、图书馆或社区中心运营一小时俱乐部。\n\
    \n我们为志愿者创建了教学项目，我们制作的项目旨在通过向孩子们展示如何制作电脑游戏、动画和网站来教他们编程。\n\n加入我们吧，让我们教下一代编写代码！\n\
    \n访问 www.codeclub.org.uk 了解更多信息\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_1_1.png)\n\
    \n# 欢迎\n\n# 订阅《Linux User & Developer》第 144 期\n\n# 让每期 Linux User 更加便宜\n\n**Bob\
    \ Zetswloot** 学习过航天工程，使用 Python 进行复杂的仿真建模。他曾多次与 Robot-Bot 合作，本月他完成了基于 Arduino\
    \ 的 Shell 树莓派（第 78 页）。他还参与了与 Liam Faser 的 RiSampler 的前卫极简技术混合（第 62 页）。\n\n**Richard\
    \ Smitley** 在 WYSIWYG（所见即所得）成为最强大的工作环境之前就开始使用电脑。Richard 本月开启了一个新专栏（第 13 页），并包含了一个关于代码重构指南的短系列文章（第\
    \ 56 页）。\n\n**Nitish Tiwari** 职业软件开发者兼爱好者。除了为开源项目写作，他还会搭建和使用开源软件。Nitish 在本期中介绍了如何使用\
    \ Alfresco 进行管理员级管理（第 54 页）。\n\n**Mihalis Toukalos** 职业系统管理员，从事数据库和数学工作。他从 1993\
    \ 年起一直使用 Linux。本月，Mihalis 展示了如何使用 Awd 最快地处理大文件，以及如何延长硬件的使用寿命（第 36 页）。\n\n**James\
    \ L** 是一位内核黑客，从事 Linux 工作已有 18 年，从他 13 岁进入大学开始。Jon 住在剑桥、曼彻斯特，在一家大型创业企业工作。你可以在第\
    \ 14-15 页找到他的内核专栏。\n\n**Gareth Halfacre** 是我们的驻地记者，为我们带来全球的最新动态，从第 6 页开始。Gareth\
    \ 测试了新的 Jetson TV 版本 80，看看这是否真的是他——他未来的板卡。\n\n- 在安卓上运行 Linux\n- 配置 Nginx 服务器\n\
    - 评测：Nvidia Nvidia TK1\n- 通过网络进行无盘启动\n\n欢迎阅读最新版本的《Linux User & Developer》，这是英国和非洲喜爱的\
