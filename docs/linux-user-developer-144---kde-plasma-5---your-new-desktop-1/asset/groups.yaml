    \n我看了《黑客矩阵》，还看到了一个名为《超自然：动物宇宙的力量》的项目，里面拍摄了光点从墙上跳出并能冻结时间，然后重复。我在想，如果我制作一个树莓派摄像头阵列，效果会很神奇吧？结果它出现了，确实行得通，但看起来非常简单。当时我的桌子上放着一台树莓派和几个摄像头，我在想：“嗯，如果我有足够的时间，我只需要买很多摄像头，它们并不贵——对吧？”那是那种你觉得它可能可行，但实际上并不知道的时刻。于是我买了四个摄像头并开始动手了。\n\
    \n通过按钮——它只是会画出一个菜单。这让我们知道所有的 Pi 都已启动，但如果你有 48 台 Pi，当它们死机时，你如何发现哪一个失败了呢？在调试方面这真的是一个棘手的任务，而且我还想做一个横向的版本。\n\
    \n你可以构建它——但可能会简单得多。我们还尝试了其他配置，当你把它们放在列表里而不是在每个 Pi 上通过菜单操作时，当序列处于列表中时，你实际上可以找回你出错的那台\
    \ Pi 并查看你想的内容。比如通过 SSH 登录它并设置一个文件。\n\n**你们使用什么来拼接图像？**\n\n我们必须这样做才能输出平滑的视频，但某些帧是重叠的，如果不处理，图片就会上下跳动。所以我们还做了一项测试，以确定每一帧是否存在正偏移或负偏移，然后将它们完美地缝合并放在帧的中间。\n\
    \n**你们使用了什么配置？**\n\n我们尝试了一些场景，先是尝试单行排列，然后垂直排列，以及绕某一点旋转。我们发现了一些可行的方案，到目前为止我们遇到了很多怪异的挫折。\n\
