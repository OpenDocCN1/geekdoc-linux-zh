    ## Unity Cinnamon

    测试过的 10 种 Linux 桌面环境特辑


    ## Cinnamon


    ### 曾是 GNOME 的分支，现已成为最强大且灵活的桌面环境之一


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_20_0.png)


    上述 Cinnamon 起源于更传统配置的 GNOME shell，并已演变成了一个独特的产物。


    Linux Mint 使用比 GNOME shell 时间更长，或者说事实上它曾将 Ubuntu 2 作为其桌面。当 GNOME 将桌面更新到当前版本后，Mint
    团队决定使用一些略有不同的方案。


    在通过使用 Mint GNOME Shell 扩展 (MGE) 将桌面恢复到更易于识别的状态后，该团队创建了 Cinnamon 并在发布后开发了了自己的桌面环境。Cinnamon
    的设计充分利用了其优势，即通知和桌面设置。Cinnamon 以一种人们更熟悉的、即所谓的“传统桌面隐喻”的形式实现了这一点，这包括底部面板上的许多窗口。


    除了这些功能外，Cinnamon 还提供了高度可定制的小程序（applets），用于选择和访问如更新、通知、显示分辨率等服务。可以从这里添加或删除功能，在最近的更新中，它们能够智能地感知何时正在处理某个应用程序。


    Cinnamon 大多数支持触控，尽管菜单很小，且屏幕空间使得使用变得困难。如果没有键盘快捷键，用于搜索的 Super 键和 Ctrl+Alt-方向键就像在
    GNOME 中一样关键。然而，你如何完美地管理工作空间或所有工作空间呢？


