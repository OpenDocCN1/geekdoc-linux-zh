    In order to operate, some changes to the kernel are required (simply by merging
    kdbus itself). The newly "memfd" mechanism provides for sharing of trackable memory
    regions between processes; otherwise one would use a traditional file descriptor.


    The "file copying" capability works in hand with memfd because the shared memory
    is sent within a member to be merged and received by a process without risk of
    the sending process trying to modify it after it has been sent.


    Once a member is sealed it cannot be changed by the sending process. A kdbus message
    transmission takes the form of allocating a member, sending a message into that
    newly allocated member, and passing it to kernel. Since kdbus is an inline mechanism,
    this means can take place in a very lightweight "zero-copy" fashion, so that the
    kernel can play a few tricks instead of complex memory management tricks to share
