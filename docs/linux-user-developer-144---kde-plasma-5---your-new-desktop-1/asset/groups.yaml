  mdcn: "\n\n# 教程\n\n将您的软件和文件保留在系统之间，因为它们存储在服务器而非本地存储中\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_41_0.png)\n\
    \n从任何连接了网络的计算机远程连接到功能完的 Ubuntu 发行版\n\n# 从 NFS 服务器启动 Linux\n\n该发行版安装在始终处于开启状态的服务器上。如果设置得当，它可以在多个系统上使用。\n\
    \n无盘启动允许您从网络上的多个位置访问同一个发行版，而无需反复处理文件传输。\n\n## 资源\n\n一个 Ubuntu 服务器\n\n虽然您可能认为它们很常见，但大型机配合哑终端终端（dumb\
    \ terminals）的概念在现在已经是一个过时的考虑了。高性能机器的普及让每个人都拥有一自己的系统变得更加容易，这真的改变了现状。\n\n在同一网络内的不同计算机之间，使用更新版本的经典机器镜像可能效果更好。通过\
    \ NFS 启动，内核和文件系统保留在中央服务器上，并推送到客户端系统进行引导，这意味着无论您在何处登录，它们始终可用。\n\n然而，发生变化的是我们处理数据的方式，现在数据被备份到云端以便随处访问，或者就放在口袋里的微型\
    \ USB 存储设备中，其内存比您处理文档所需的内存多得多。如果您正在移动\n\n本教程需要一个专门托管发行版且始终开启的服务器——特别是一个 Ubuntu\
    \ 服务器——以便在网络中提供 Ubuntu 服务。\n\nwww.linuxuser.co.uk\n\n# 从 NFS 服务器启动 Linux\n\n在网络上的多个位置启动发行版\n\
    \n教程\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_0.png)\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_1.png)\n\
    \n| robz@vubontw: | 配置 PXE |\n| --- | --- |\n| nano 2.2.6 | options |\n| /etc/dhcp/dhcp.conf\
    \ | modified |\n\n# 01 首次安装\n\n第一项工作是在服务器端安装一些简单的软件包。使用以下命令打开 DHCP 服务器和其他其他内容：\n\
    \n```bash\nsudo apt-get install dhcp-server tftppd-hpa nfs-kernel-server initramfs-tools\n\
    ```\n\n# 02 配置 DHCP\n\n服务器需要设置一个 DHCP 服务器。要此操作，打开终端并输入 `nano /etc/dhcp.conf` 获取\
    \ DHCP 配置，并在文件末尾添加以下行：\n\n```bash\nallow boot;\n```\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_2.png)\n\
    \n```bash\nhost pxe_client {\n  hardware ethernet=xx:xx:xx:xx:xx:xx;\n  fixed-address=192.168.1.2;\n\
    }\nsubnet 192.168.1.0 mask 255.255.255.0 {\n  range 192.168.1.100 192.168.1.250;\n\
    \  options broadcast-address=192.168.1.255;\n  options routers=192.168.1.1;\n\
    \  options domain-name=servers.192.168.1.1;\n}\n```\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_3.png)\n\
    \n# 05 重启 DHCP\n\n保存文件以确认更改 - 如果以后有任何设置更改，可以对其进一步修改。在继续之前，需要使用以下命令重启服务器：\n\n```bash\n\
    sudo service isc-dhcp-server restart\n```\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_4.png)\n\
    \n# 03 配置服务器和 IP\n\n添加此内容：\n\n```bash\nsubnet 192.168.x.0 mask 255.255.255.0 {\n\
    \  range 192.168.x.100 192.168.x.250;\n  options broadcast-address=192.168.x.255;\n\
    \  options routers=192.168.x.1;\n  option domain-name=servers.192.168.x.x;\n \
    \ filename=\"pxelinux.0\";\n}\n```\n\n将 'x' 更改为您的网络。\n\n# 04 配置 PXE 选项\n\n最后使用\
    \ PXE 指令完成，以引导客户端。当您想使用多个磁盘时，这特别有效。\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_5.png)\n\
    \n# 07 创建 TFTP 服务器\n\n为了让设置正常工作，需要一个根目录存放某些 TFTP 文件。这与 PXE 启动协议相关，因此需要创建此目录：\n\
    \n# 08 TFTP 启动\n\n当前的 PXE 启动文件需要被 TFTP 目录使用，操作方法如下：\n\n```bash\nsudo cp /usr/lib/syslinux/pxelinux.0\
    \ /tftpboot/\n```\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_6.png)\n\n# 06\
    \ 创建 TFTP 服务器\n\nTFTP 服务器需要传输引导文件，可以通过 TFTP 服务器完成。使用 `nano /etc/default/tftp`\
    \ 打开配置文件并添加以下内容：\n\n```bash\nRUN_DAEMON=\"yes\"\nOPTIONS=\"-s /tftpboot\"\n```\n\
    \nwww.linuxux.co\n\n#教程\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_43_0.png)\n\
    \n```\n# /etc/exports: 导出到 NFS 文件的访问控制列表。\n# NFSv2 和 NFS3 的示例：\n/srv/nfs 192.168.1.0(rw,sync)\n\
    # NFS4 的示例：\n/srv/nfs 192.168.1.0(rw,sync,fsid=0,no_subtree_check)\n```\n\n# 09\
    \ 默认内核配置\n\n使用 `nano /tftpboot/pxelinux.cfg` 创建新文件并添加以下详细信息：\n\n```\nLABEL linux\n\
    KERNEL-linux\nAPPEND root=/dev/initrd initrd.img root=nfs:192.168.1.2/nfsroot\n\
    ```\n\n# 10 设置 TFTP\n\n第一步是让 TFTP 服务器正常工作。为了实现这一点，设置正确的权限：\n\n```bash\nsudo chmod\
    \ -R 777 /tftpboot\n```\n\n...这意味着可以使用以下命令启动 TFTP 服务器：\n\n```bash\nsudo /etc/init.d/tftp\
    \ start\n```\n\n#11 Root 文件\n\n需要一个存放客户端操作系统文件的文件夹，使用 `mkdir /nfsroot` 创建。使用 `nano\
    \ /etc/exports` 导出根并添加以下行：\n\n```\n/nfsroot 192.168.1.x(rw,no_root_squash,async,secure)\n\
    ```\n\n使用 `sudo exports -rv` 保存退出。\n\n#12 客户端设置\n\n客户端系统需要安装硬盘。获取所需的 Ubuntu 版本并使用标准设置安装。完成后，移除硬盘。\n\
    \n# 13 客户端内核\n\n保持系统连接并打开终端。将内核复制到您的主目录，以备以后需要修复问题。使用以下命令操作：\n\n```bash\nsudo\
    \ cp /boot/vmlinux-* /\n```\n\n# 14 修改 initrd\n\n需要更改某些引导标志以便系统知道如何引导。使用 `nano\
    \ /etc/initramfs-tools/initramfs.conf` 打开配置文件并确保变量如下：\n\n```\nMODULES=netboot\n\
    ```\n\n# 15 模块和生成\n\n查找网络适配器所需的模块，并将它们添加到模块文件中（`sudo /etc/initramfs-tools/modules`）。完成后，保存文件并运行：\n\
    \n```bash\nmkinitramfs -u /initrd.img -uname=\"*\"\n```\n\n# 16 将操作系统复制到服务器\n\n\
    现在客户端已完全启动，您可以开始将文件传输到服务器。通过输入以下命令执行：\n\n# 17 返回服务器\n\n一旦从客户端完成所有传输，返回服务器并备份终端。内核和\
    \ init 文件需要复制到 fptrees 目录：\n\n| | | | defaults | 0 |\n|---|---|---|---|---|\n\
    | proc | /dev/nfs | nfs | defaults | 0 |\n| none | /tmp | tmpfs | defaults | 1\
    \ |\n| none | /var/run | tmpfs | defaults | 0 |\n| none | /var/lock | tmpfs |\
    \ defaults | 0 |\n| none | /var/tmp | tmpfs | defaults | 0 |\n\n```bash\n$ cp\
    \ -av \"uname\" -r /nfsroot\n$ cp -nrl-link \"uname\" /nfsroot\n```\n\n# 18 网络修改\n\
    \n为了确保 DHCP 设置保持不变，需要更新网络接口配置文件。使用 `sudo nano /nfsroot/etc/network/interfaces`\
    \ 更改这些行：\n\n```\nrobz@ubuntu:~\nGNU nano 2.2.6                               File:\
    \ /nfsroot/etc/network/interfaces  Modified\n\n# 环回网络接口\nauto lo\niface lo loopback\n\
    \n# 主网络接口，为了 NFS root 已注释\nauto eth0\n#iface eth0 inet dhcp\n#iface eth0 inet\
    \ manual\n```\n\n```bash\n$ mount -t nfs -o 192.168.1.2 /nfsroot/mnt\n$ cp -ax\
    \ /mnt/.\n```\n\n# 19 更新 fstab\n\n打开 `/nfsroot/etc/fstab` 的 fstab，确保它看起来像这样：\n\
    \n# 20 客户端 BIOS\n\n重启客户端系统并进入 BIOS 启动菜单。确保将网络启动移动到第一个选项，如果需要，可以进行修改。\n\n# 21 通过网络启动\n\
    \n重启客户端，它将开始引导过程，从服务器获取内核和 PXE 镜像。只要配置得当，这在多个系统上都有效。\n\n# 22 通过网络启动\n\n客户端的所有功能都运行正常了吗？如果您需要计划在文件服务器上使用额外空间或在主\
    \ PXE 服务器上使用额外空间，现在可以移除它们的硬盘了。计算机现在可以通过网络启动，而不需要内部存储。\n\n"
