    While officially, Ubuntu Touch only supports Samsung Galaxy and Google devices.
    If you want to run it on other devices, check our website for more details: https://wiki.ubuntu.com/Devices/

    Installing it is surprisingly easy if you''ve already unlocked your device and
    rooted it. Simply download the Ubuntu Installer ZIP file (bitly/to/) and move
    it to your SD card. Restart your phone, then hold the power-volume buttons until
    you see the green screen with a large start. Use the volume-down button to boot
    into recovery mode and release power button.

    Now you can install the Ubuntu installer from your SD card (in /directory). Reboot
    the device and you should have the Ubuntu Dual Boot in your apps menu. You can
    install apps from unknown sources (Settings>Security). Now tap the app, then ''Choose
    to install'' to select a version of Ubuntu. You''ll need to wait a while for the
    app to download and install.


    When it''s finished, tap the ''Reboot to Ubuntu'' to launch Ubuntu Touch.

    The gesture-navigation system is easy to use swipe from the left edge to open
