    \n对于重要消息来说，丢失要重要得多，不像短信或通知会在其他地方开启或关闭。\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_48_0.png)\n\
    \n49 www.linuxuser.com\n\n# Linux 开发者教程\n\nJoomla 配置文件\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_49_0.png)\n\
    \nNginx 日志文件示例\n\nNginx 服务三个不同的网站\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_49_1.png)\n\
    \n用于 PHP 的 www.conf 文件\n\n# 使用 Nginx 运行 Joomla! 网站\n\n学习配置 Nginx 为简单网站提供服务，并发现为什么它是\
    \ Apache 的严肃替代方案？\n\n# 顾问\n\nMahalis Tsoukalos 是一位精通编程、数据库和方法论的 Linux 系统管理员。他自\
    \ 1993 年以来一直使用 Linux\n\nNginx（读作 Engine X）是由 Igor Sysoev 在 2002 年在俄罗斯开发的 Web 服务器。在本文中你将学习如何在\
    \ Linux 机器上安装和运行 Nginx，如何配置它并与 Joomla 使用。\n\n这个问题与 Apache 是一个基于进程的服务器有关；在处理并发连接时，每个连接都需要它自己的专用，这允许它在不产生过多进程的情况下每秒处理更多请求。因此，与\
    \ Apache 相比，更少的 Nginx 可以提供更多的请求。此外，Nginx 在提供静态页面时的内存消耗非常低，且其配置非常简单。\n\n"
