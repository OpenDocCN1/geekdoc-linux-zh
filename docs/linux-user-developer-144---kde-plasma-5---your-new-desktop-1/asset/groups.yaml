    \ 48 台摄像头进行全套测试并完成构建的阶段。只有当我们第一次把它们全部组合在一起时，你才能获得大量的帧，而这基本上就是我们需要的。问题之一是我们必须处理大量的帧以及闪烁问题……“好吧，我们必须这样做，但是……然后？”\n\
    \n是脚本控制的，还是手动触发拍摄？\n\n我们实际上是分两个点触发的，但后来我们决定让它们同时触发并同时运行。一旦运行，我们必须拼接拍摄的内容并保存图像，如果你逐一个触发，那么你每一张照片拍摄的对象就会不是同一个人。所以这样可以节省时间，这对我们来说总是好的。\n\
