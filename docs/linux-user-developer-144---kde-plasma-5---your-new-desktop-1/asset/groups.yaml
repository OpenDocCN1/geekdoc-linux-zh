    # Torvalls 仍对桌面主导地位充满希望


    内核创建者 Linus Torvalls 表示，他尚未放弃看到自己的作品在桌面市场占据主导地位的希望，就像它在高性能市场占据的那样。


    在北美 Linux 会上，针对内核开发者兼主持人 Greg Hartman 提出的关于内核小组下一个目标应该放在何处的问题，Torvalls 说道：


    > “桌面端的挑战并不是内核问题。它是一个整个基础设施的问题，”Torvalls 解释道。


    “我想总有一天我们会到达那里的。”当 Kro-Hartman 询问这是否会是“Linux 桌面年”时（这是一个经常出现的预测，但尚未在任何特定年份实现），Torvalls
    回答道：“我不谈论那个！”


