    \ | |\n| 根目录 | | | | |\n| 应用程序 | | | | |\n\n面包板是电路原型设计的极佳工具。如果你想开始你的树莓派项目，可能为你的面包板买一个外壳会更好，因为这样焊接和直接连接到\
    \ GPIO 端口要容易得多。外壳会让整个设备看起来很整洁。\n\n## 04 更多准备工作\n\n一旦打开按钮，树莓派就会启动；如果接线正确，它应该立即启动。等桌面加载后，在\
    \ home 目录下创建一个名为 `alarm` 的新文件夹。在我们创建的代码版本中，已经包含了你应该使用的必要 mp3 文件。\n\n## 05 获取代码\n\
    \n在下一页获取完整代码，无论它是什么类型，你可以在过程中对其进行编辑，或者直接从网上下载：\n\n```\nhttp://linuxuser.co.uk/wp-content/uploads/2014/09/alarm.zip\n\
    ```\n\n## 06 设置你的闹钟\n\n在代码中有两个变量：`hour`（小时）和 `minute`（分钟）。根据你的输入确定闹钟响的时间并对其进行操作。默认设置为早上\
    \ 7:30，请将其更改为你想要醒来的时间。\n\n## 02 安装音频播放器\n\n在本教程中，我们将使用 VLC 来播放白噪音和闹钟声。Python 可以很容易地使用它来实现我们想要的任务。在终端中使用以下命令安装：\n\
    \n## 03 sudo apt-get install vlc\n\n```\nuser@pi:~~$ sudo apt-get update\n读取软件包列表...\
    \ 完成\n正在构建依赖树... 完成\n读取信息表... 完成\nuser@pi:~~$ sudo apt-get install vlc\n正在读取软件包列表...\
    \ 完成\n正在构建依赖树... 完成\n读取信息表... 完成\n以下将安装新软件包：\n vlc/3.0.16-1ubuntu4 [arm64] 48.5\
    \ MB\n升级 0 个，安装 1 个，移除 0 个，未升级 0 个。\n此操作后，将使用 112 MB 的额外磁盘空间。\n```\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_66_1.png)\n\
