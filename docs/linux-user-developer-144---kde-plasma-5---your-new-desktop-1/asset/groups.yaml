    \n## 08 继续起床\n\n对于一个简单的闹钟，有很多可以可以改进的地方。看一眼下一页的代码并进行测试，以确保音量水平和增量符合你的喜意，一旦你满意了，我们将提供一些进一步改进它的想法。\n\
    \n## 07 音频选择\n\n你可以为白噪音和闹钟声使用任何声音。这些文件需要放在我们为闹钟文件创建的目录中，并按照你在修改该部分时使用的代码进行命名。闹钟还支持播放列表，如果你更喜欢听音乐醒来的话。\n\
    \n# 教程\n\n# 完整代码列表\n\n```python\n#!/usr/bin/env python\nimport time\nimport subprocess\n\
    import RPi.GPIO as GPIO\n```\n\n```python\nalarm_hour = 7\nalarm_minute = 30\n\
    alarm_volume = 10\n```\n\n```python\nsubprocess.call('mixer set Pcm 10%%', shell=True)\n\
    subprocess.call('vlc-wrapper /home/pi/alarm/whitenoise.mp3 --repeat -1 dummy',\
    \ shell=True)\n```\n\n```python\nGPIO.setmode(GPIO.BOARD)\nGPIO.setup(3, GPIO.IN)\n\
    ```\n\n```python\nwhile(True):\n    current_time = time.localtime()\n    current_hour\
    \ = current_time[3]\n    current_minute = current_time[4]\n```\n\n```python\n\
    if current_hour == alarm_hour and current_minute == alarm_minute:\n    subprocess.call('vlc-wrapper\
    \ /home/pi/alarm/alarm.mp3 --repeat -1 dummy', shell=True)\n    time.sleep(2.5)\n\
    ```\n\n```python\nwhile True:\n    if GPIO.input(3) == 0:\n        subprocess.call('killall\
    \ vlc', shell=True)\n    else:\n        alarm_volume = 5\n        new_volume =\
    \ 'mixer set Pcm ' + str(alarm_volume) + '%'\n        subprocess.call(new_volume,\
    \ shell=True)\n        time.sleep(2.5)\n```\n\n```python\nGPIO.cleanup()\n```\n\
