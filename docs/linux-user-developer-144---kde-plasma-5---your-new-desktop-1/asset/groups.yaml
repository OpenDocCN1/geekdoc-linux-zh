    # LINUXCON


    # Torvalls still hoping for desktop dominance


    Linux Torvalls, creator of the kernel, has indicated he still hasn''t abandoned
    the hope of seeing his creation dominate the desktop market as much as it has
    dominated the high-performance market.


    Responding to a question from kernel developer and moderator Greg Hartman at the
    Linux North America conference about where the kernel panel should target next,
    Torvalls stated:


    > “the challenge on the desktop is not a kernel problem. It''s a whole infrastructure
    problem,” Torvalls explained.


    “I think we''ll get there one day.” Asked whether this could be the “year of the
    Linux desktop” by Kro-Hartman, a regularly occurring prediction that that is not
    yet true for any given, Torvalls replied “I’m not going there!”


    - The Linux desktop has been around the corner for almost 20 years...


