    \ 上没有此类指示。\n\n如果你在使用现代的 Android-x86，你将能够快速熟悉工作流，特别是因为 Android 的基础已经改变了。你需要用鼠标向下动通知栏，并在屏幕上的项目或按钮之间进行滑动操作。\n\
