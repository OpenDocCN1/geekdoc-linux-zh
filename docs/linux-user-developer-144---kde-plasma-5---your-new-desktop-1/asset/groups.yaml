    \ a few other things with:\n\n```bash\nsudo apt-get install dhcp-server tftppd-hpa\
    \ nfs-kernel-server initramfs-tools\n```\n\n# 02 Configure DHCP\n\nThe server\
    \ will need to have a DHCP server set up. To do this, open the terminal and get\
    \ the DHCP config file by typing nano /etc/dhcp.conf by adding the following lines\
    \ to the end of the file:\n\n```bash\nallow boot;\n```\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_2.png)\n\
    \n```bash\nhost pxe_client {\n  hardware ethernet=xx:xx:xx:xx:xx:xx;\n  fixed-address=192.168.1.2;\n\
    }\nsubnet 192.168.1.0 mask 255.255.255.0 {\n  range 192.168.1.100 192.168.1.250;\n\
    \  options broadcast-address=192.168.1.255;\n  options routers=192.168.1.1;\n\
    \  options domain-name=servers.192.168.1.1;\n}\n```\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_3.png)\n\
    \n# 05 Restart DHCP\n\nSave the file to confirm the changes - they can be modified\
    \ further at a later date if any settings change. Before moving on, the server\
    \ needs to be restarted using:\n\n```bash\nsudo service isc-dhcp-server restart\n\
    ```\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_4.png)\n\n# 03 Configure the\
    \ server and IPs\n\nAdd this:\n\n```bash\nsubnet 192.168.x.0 mask 255.255.255.0\
    \ {\n  range 192.168.x.100 192.168.x.250;\n  options broadcast-address=192.168.x.255;\n\
    \  options routers=192.168.x.1;\n  option domain-name=servers.192.168.x.x;\n \
    \ filename=\"pxelinux.0\";\n}\n```\n\nChanging the 'x' to your network.\n\n# 04\
    \ Configure PXE options\n\nFinish it off with PXE instruction to follow the client.\
    \ This works especially if you want to use multiple discs.\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_5.png)\n\
    \n# 07 Create a TFTP server\n\nThere needs to be a root directory for some of\
    \ the TFTP files for the setup to work properly. This is linked with PXE booting\
    \ protocols and so this directory needs to be created:\n\n# 08 TFTP boots\n\n\
    The current PXE boot files need to be used by TFTP directories so this is done\
    \ with:\n\n```bash\nsudo cp /usr/lib/syslinux/pxelinux.0 /tftpboot/\n```\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_6.png)\n\
    \n# 06 Create a TFTP server\n\nThere needs to transfer boot files and this can\
    \ be done with TFTP server. Open the config file with nano /etc/default/tftp and\
    \ add to the following:\n\n```bash\nRUN_DAEMON=\"yes\"\nOPTIONS=\"-s /tftpboot\"\
    \n```\n\nwww.linuxux.co.uk\n\n# Tutorial\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_43_0.png)\n\
    \n```\n# /etc/exports: the access control list for filesystems which may be exported\
    \ to NFS clients. See exports(s).\n# Example for NFSv2 and NFS3:\n/srv/nfs 192.168.1.0(rw,sync,no_subtree_check)\n\
    # Example for NFS4:\n/srv/nfs 192.168.1.0(rw,sync,fsid=0,no_subtree_check)\n```\n\
    \n# 09 Default kernel configuration\n\nCreate a new file with nano /tftpboot/pxelinux.cfg\
    \ and add the following with the necessary details:\n\n```\nLABEL linux\nKERNEL-linux\n\
    APPEND root=/dev/initrd initrd.img root=nfs:192.168.1.2/nfsroot\n```\n\n# 10 Setup\
    \ TFTP\n\nThe first step is to get TFTP server working properly. To do this, the\
    \ correct permissions to set with:\n\n```bash\nsudo chmod -R 777 /tftpboot\n```\n\
    \n...which finally means TFTP server can be started using:\n\n```bash\nsudo /etc/init.d/tftpboot\
    \ start\n```\n\n# 11 Root files\n\nThere needs to be a folder to hold the files\
    \ for the client OS, make this using mkdir /nfsroot. Export root using sudo nano\
    \ /etc/exports and add the following line:\n\n```\n/nfsroot 192.168.1.x(rw,no_root_squash,async,secure)\n\
    ```\n\nSave and exit with sudo exports -rv\n\n# 12 Client setup\n\nThe client\
    \ system needs to start having a hard drive installed. Get the version of Ubuntu\
    \ you want to use and install it with standard settings to the system. Once finished,\
    \ remove the drive.\n\n# 13 Client kernel\n\nStay connected to the system and\
    \ open the terminal. Copy the kernel to your home directory in case it needs to\
    \ be restored bit down the line to fix an issue. Do this with:\n\n```bash\nsudo\
    \ cp /boot/vmlinux-* /\n```\n\n# 14 Modify the initrd\n\nSome boot flags need\
    \ to be changed so the system knows how to boot. Open the config file with nano\
    \ /etc/initramfs-tools/initramfs.conf and make sure the following variables are\
    \ as:\n\n```\nMODULES=netboot\n```\n\n# 15 Modules and making\n\nFind out what\
    \ modules you need for your network adapter and add them to the network modules\
    \ file which can be accessed sudo /etc/initramfs-tools/modules. Once finished,\
    \ save the file and boot the\n\n```bash\nmkinitramfs -u /initrd.img -uname=\"\
    *\"\n```\n\n# 16 Copy OS to server\n\nNow that the client is completely up, you\
    \ can start transferring the files across to the server. Do this by typing in\
    \ the following commands:\n\n# 17 Back to server\n\nOnce everything has finished\
    \ transferring over from the client, return to the server and back up the terminal.\
    \ The kernel and init files need to be copied to the fptrees directories:\n\n\
    | | | | defaults | 0 |\n|---|---|---|---|---|\n| proc | /dev/nfs | nfs | defaults\
    \ | 0 |\n| none | /tmp | tmpfs | defaults | 1 |\n| none | /var/run | tmpfs | defaults\
    \ | 0 |\n| none | /var/lock | tmpfs | defaults | 0 |\n| none | /var/tmp | tmpfs\
    \ | defaults | 0 |\n\n```bash\n$ cp -av \"uname\" -r /nfsroot\n$ cp -nrl-link\
    \ \"uname\" /nfsroot\n```\n\n# 18 Network modifications\n\nTo ensure the DHCP\
    \ settings remain constant, the network interfaces config file needs to be updated.\
    \ Use sudo nano /nfsroot/etc/network/interfaces and change these lines:\n\n```\n\
    robz@ubuntu:~\nGNU nano 2.2.6                               File: /nfsroot/etc/network/interfaces\
