    \ on the Raspberry Pi\n\nRob Zwetsloot models complex systems and is a web proficient\
    \ in Python, Django, Go and PHP. He loves to experiment with computing.\n\nYou\
    \ can interface a Raspberry Pi with Arduino components – now learn how to program\
    \ them from the Pi and control the Makeblock.\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_69_0.png)\n\
    \n# What you'll need\n\n- Makeblock robot starter kit https://www.makeblock.com/starter-robot-kit-v2-0-blue-with-electronics\n\
    \nLearning to code is one of the best things about owning a Raspberry Pi for a\
    \ lot of people. Python and C are easy enough to start with on a Pi and you won't\
    \ get stuck. When it comes to physical computing and making, not beats using Python\
    \ to control the open source controllers, servos and sensors associated with the\
    \ system.\n\n01 Update your Pi\nAlways sure your Raspberry Pi is up to date. This\
    \ tutorial is based around Raspian so set up an SD card if you don't have one,\
    \ and then do an update with sudo apt-get update & sudo upgrade. Make sure the\
    \ firmware is up to date as well with a sudo pi-update.\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_69_1.png)\n\
    \nOnce set up, we can also use the Pi to program the Makeblock robot we reviewed\
    \ in issue 142 of Linux User & Developer, using either the built-in commands or\
    \ your own code.\n"
