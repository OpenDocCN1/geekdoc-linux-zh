    # Program Arduino on Pi


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_70_0.png)


    # 02 Install Arduino IDE


    Next you''ll need to install Arduino to the Raspberry Pi - luckily it''s in the
    repos for Raspian all you''ll need is to open a terminal and type:


    +   $ sudo apt-get install arduino


    # 03 Install Arduino libraries


    To get everything working on the Pi you''ll also need to install some libraries
    as well. This will allow you to connect to various Arduino boards, especially
    the Makeblock board. With this:


    +   $ sudo apt-get install libftdi1 avrdude openjdk-6-jre librtx-java


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_70_1.png)


    # 06 Install Makeblock examples


    Turn off the Arduino IDE, if you haven''t already, and find the ''sketchbook''
    folder in the home directory. Create a new folder inside it and copy and paste
    the ''makeblock'' folder from the unzipped files into this directory to effectively
    install it to Arduino.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_70_2.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_70_3.png)


    # 04 Using Arduino


    Now everything is ready you can open up the Arduino IDE. It can be found in the
    Electronics section of the program menu. It will create a sketchbook folder in
    the home menu where all your projects will live.


    # 07 Prepare your board


    Once you''ve built your Makeblock board, unplug the battery and plug the control
    board into the Raspberry Pi via USB cable. Restart the Arduino IDE and go to Tools,
    Board and select Arduino Leonardo. Make sure to make sure that the correct Serial
    Port is selected.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_70_4.png)


    # 08 Program your board


    Now you can load an example code to make everything working. Click on File, Examples
    and find the ''makeblock'' menu. Go to the Sketch option and select Arduino Uno.
    Upload it to the Makeblock, unplug from the Pi and give it a with the remote control.


    # 05 Makeblock starter kit libraries


    # 09 More programming


    To program the Makeblock, it''s best to grab the example code so you can get an
    idea of how it works. The zip for these can be downloaded from github.com/Makeblock-Library/archive/master.zip.
    Unzip it to a separate folder before continuing.


    Now you can modify the example codes to change the function of the Makeblock.
    This will allow you to understand how it works, and other Arduino devices, programmed
    so that you can write your own code next.


    71 www.linux.co.uk'
