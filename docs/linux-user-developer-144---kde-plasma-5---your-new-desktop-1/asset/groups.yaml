    Plasma 5 的新审美真的非常棒。现代计算机那种利落、干净的线条在开发过程中广受欢迎。将其用于设计工作绝对是极佳的体验，而且与之前的 Cinnamon
    和 KDE 4 相比，这是第一次如此。


    KDE Plasma 是过去十年的桌面大战之主角，显然倾向于 GNOME，但有很多你应该尝试 KDE 的理由。最终，而且现在它变得越来越流行，当 Cinnamon
    或 Plasma 只是面对已经消逝的老派时，你并不在最长的名单中，它也绝对不是桌面环境的首选。


