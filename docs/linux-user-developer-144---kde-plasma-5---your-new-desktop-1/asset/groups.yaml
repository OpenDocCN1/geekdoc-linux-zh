  mdcn: "\n\n# Linux 开发者\n\n# 使用 Node.js 发送和接收电子邮件\n\n我们将使用 Nodemailer 和 Node IMAP\
    \ 来研究如何使用电子邮件发送错误报告，以及离线存储最近的邮件。\n\n# \n\nSean Tracy 是一家领先数字机构的创意技术专家。他花费大量时间沉浸在\
    \ Node.js、Python 和 Android 世界中。\n\n# 资源\n\n- [Node.js 10.0.*](https://nodejs.org)\n\
    - [Nodemailer 1.1.1.*](https://nodemailer.com)\n- [Node IMAP 0.8.12](https://github.com/mdsec/node-imap)\n\
    \n# 带有 IMAP 的邮件服务器\n\n# 你最喜欢的文本编辑器\n\n电子邮件是我们一直在使用的最老的技术之一，也是我们日常生活的一部分。Facebook\
    \ 或 Twitter 等社交网络行为的兴起，使电子邮件成为一种在网络上传输大量文本和多媒体的方式。但尽管我们意识到了有更多连接方式，你很可能仍然维护着一个你提供或围绕其构建的邮件服务器。你上一次玩它是什么时候时候了？\n\
    \n在本文中，我们将看看 Node.js 中最流行的两个 IMAP 模块——Nodemailer 和 Node IMAP。我们将向你展示如何登录邮件服务器并向接收者发送生成的消息，以及\
    \ Node IMAP 如何让我们访问邮件服务器并读取他人发送的某些最新消息。\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_45_0.png)\n\
    \n在上方你可以将 Nodemailer 与你选择的任何邮件服务器结合。\n\n### 01 安装 nodemailer 模块\n\n已经使用 Nodemailer\
    \ 的人可能已经在好奇如何进入 IMAP 了——没错，通过 NPM。创建一个新的项目文件夹，然后运行以下命令：\n\n```bash\nnpm install\
    \ nodemailer\n```\n\n那么，nodemailer 是干什么的？Nodemailer 是我们用于使用服务发送电子邮件的模块，而 Node\
    \ IMAP 是用于从我们的邮件服务器检索电子邮件的库。首先，我们将创建一个简单的示例来开始学习如何使用每个库。\n\n### 02 设置 IMAP 模块\n\
    \n创建一个新文件 'mail.js' 来编辑和配置 Node IMAP，例如：\n\n```javascript\nvar nodemailer = require('nodemailer');\n\
    ```\n\n在这一步这对我们非常有帮助；为了发送电子邮件，我们需要告诉 Nodemailer 如何连接到我们的服务器以及使用哪个传输器（transporter）。现在，我们有两个选择：\n\
    \n我们可以使用 Nodemailer 库为我们组装的预设传输器之一来连接流行的邮件服务，或者我们创建一个自定义配置的传输器来连接到任何配置好的邮件服务器。不过，为了发送和接收电子邮件，我们在这里将查看所有方法。当你选择连接到你的电子邮件服务器时，你需要提供连接所需的get细节。\n\
    \n让我们进入主题。首先：\n\n这次，我们需要主机名（host）、端口号以及允许的最大连接数来连接到服务器，以及我们之前传递的凭据。\n\n# 使用 Node.js\
    \ 发送和接收电子邮件\n\n使用 Node.js 模块发送错误报告并离线存储邮件。\n\n教程\n\n## 电子邮件有多历史了？\n\n这是一个你可以追溯现代电子邮件年代的问题——至少它的开头可以追溯到\
    \ 70 年代。计算机化的点对点消息系统从 60 年代起一直存在，但一个跨越网络连接不同计算机的标准化系统是一个非常棒的主意。@ 符号已经存在很长时间了，它在\
    \ 17 世纪被广泛使用，并在 14 世纪的手稿中就有记录。现在，每天发送的电子邮件比阅读它的人还要多。为什么不使用电子邮件呢？这似乎是心血来潮，为了帮助另一台机器上的用户发送发送到本地信箱的消息。\n\
    \n> Node.js 是技术领域非常非常新的事物。\n\n## 03 发送我们的第一封电子邮件\n\n好了，现在我们准备好发送电子邮件了，至少是发出去。我们刚刚创建的方法\
    \ `sendmail` 是我们将用来发送电子邮件的方法，让我们试一试。\n\n```javascript\n// 使用预配置的服务\nvar transporter\
    \ = nodemailer.createTransport({\n  service: \"Gmail\",\n  auth: {\n    user:\
    \ \"EMAIL USER\",\n    pass: \"EMAIL PASSWORD\"\n  }\n});\n```\n图 01\n\ntransporter\
    \ 接受两个参数：第一个是一个对象，包含了邮件的去向、发件人、主题、主题行和消息正文。第二个参数是一个回调函数，它会在电子邮件成功发送（或如果出错）时被调用。处理好这一点意味着我们不需要为想要发送的每条消息创建一个新的传输器，我们可以反复使用同一个一个。\n\
    \n```javascript\n// 使用自定义配置\nvar transporter = require('nodemailer-smtp-transport');\n\
