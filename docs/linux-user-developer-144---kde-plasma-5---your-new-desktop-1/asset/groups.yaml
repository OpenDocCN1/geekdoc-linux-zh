    对我们来说，KDE 一直拥有最佳审美。一切都是统一且优美的。然而，这些设计有时会停留在它们诞时代，KDE Plasma 在 2014 年看起来略显过时。Plasma
    5 带着全新的外观和略有不同的工作流发布。


    ### 优点

    - 设计精美，应用和文件管理方式独特


    ### 缺点

