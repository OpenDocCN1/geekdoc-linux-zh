    # Unity


    # Ubuntu''s desktop environment is a distro and device-spanning concept


    One of the most controversial desktops to date, Unity is part of Canonical''s
    grand vision for an Linux distro - in this case Ubuntu. Being familiar with the
    desktop means you should get started with the interface as well, or at least with
    the theory. Unity is a graphical shell that sits on top of GNOME and was originally
    implemented as an alternative to GNOME 3


    Unity takes search of modern desktops and splits it up into categories which you''re
    not exactly what you''re looking for. What kind of mind are you feeling in the
    mood to list today? Maybe you want something fast? Even if you do search, you
    can then easily drill down between these lenses and add more as you see fit. The
    launcher on the side acts as a quick launch and a way to switch


    between applications, with a focus on application-switching rather than window-switching
    by default.


    There are also some extra features like the HUD, as a way to focus on any area
    instead ofing through menus. It''s an interesting system, but as a lot of workflow
    relies on muscle-memory or remembering the vague description what you find.


    It''s very much one of the more-friendly desktops, so much that it makes the mouse
    seem like a hindrance to the desktop. While GNOME is not as easy in its way as
    Unity, it generally feels a bit more usable than the current GNOME shell because
    the mouse is completely obsolete.


    Unity is heavily tied to Ubuntu as it is open source and code is available for
    you to use. It''s not readily packaged in repos, though you will have to find
    a third-party repository or build from scratch.


