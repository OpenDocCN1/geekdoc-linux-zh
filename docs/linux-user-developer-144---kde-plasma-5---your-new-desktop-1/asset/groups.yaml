    \ of storage plugging up in Linux, Mint, this is because Linux handles the mounting\
    \ process by automatically mounting the device in a place in the filesystem, and\
    \ then letting you know what type of file system it is.\n\nOn one hand, this makes\
    \ it easier without having to remember the device names by typing into a file\
    \ browser. On the other hand, it can be confusing to so as\n\nyourself although\
    \ you've never tried finding out how to connect a networked for the first time.\
    \ First of all, you'll need an IP address for internet-based communication. You'll\
    \ need the IP address of the hard drive on home network, which hardware will be\
    \ available with 192.168.1.250. You also need to know that these hard drives use\
    \ the ext4 file system.\n\nThat you should get actually seeing the drive in that.\
    \ To go to mount it automatically, you will need to add the /etc/fstab file, which\
