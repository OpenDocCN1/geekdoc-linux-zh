    - $ sudo apt-get install arduino


    # 03 安装 Arduino 库


    为了让树莓派上的一切正常运行，你还需要安装一些库。这将允许你连接到各种 Arduino 板板，特别是 Makeblock 板板。通过以下命令：


    - $ sudo apt-get install libftdi1 avrdude openjdk-6-jre librtx-java


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_70_1.png)


    # 06 安装 Makeblock 示例


    如果你还没有关闭 Arduino IDE，请将其关闭，然后在主目录下找到 ''sketchbook''（草稿簿）文件夹。在其中创建一个新文件夹，并将解压文件中的
    ''makeblock'' 文件夹复制并粘贴到此目录，即可将其有效地安装到 Arduino。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_70_2.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_70_3.png)


    # 04 使用 Arduino


    现在一切都准备就绪，你可以打开 Arduino IDE。可以在程序菜单的“电子”（Electronics）部分找到它。它会在主菜单创建一个 sketchbook
    文件夹，你所有的项目都存在那里。


    # 07 准备你的板板


    一旦制作好 Makeblock 板板，拔掉电池并通过 USB 线将控制板连接到树莓派。重启 Arduino IDE，进入“工具”（Tools）->“板卡”（Board）并选择
    Arduino Leonardo。确保选择了正确的串口（Serial Port）。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_70_4.png)


    # 08 为你的板板编写程序


    现在你可以加载示例代码来让一切正常工作。点击“文件”（File）->“示例”（Examples）并找到 ''makeblock'' 菜单。进入“Sketch”选项并选择
    Arduino Uno。将其上传到 Makeblock 中，从树莓派上拔下，并带上遥控器让它运行。


    # 05 Makeblock 入门套件库


    # 09 更多编程


    为了编写 Makeblock，最好是获取示例代码，这样你就可以了解它是如何工作的。这些内容的压缩包可以从 github.com/Makeblock-Library/archive/master.zip
    下载。在继续之前，先将其解压到单独文件夹中。


    现在你可以修改示例代码来更改 Makeblock 的功能。这将让你理解它的工作原理，以及其他 Arduino 设备是如何编程的，以便你下次编写 way自己的代码。


