    # TRAINING


    # Linux Foundation launches new Certification Programme


    Online performance-based exams to certify Linux professionals


    The Linux Foundation has announced the immediate launch of its Linux Foundation
    Certification Programme, which it states is designed for both early-career and
    experienced engineers looking to confirm their knowledge of the platform.


    based, testing the student''s ability to solve real-world problems in a simulated
    command line rather than using theory or multiple-choice questioning. The exam
    may be retained each year through mandatory re-certification.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_5_0.png)


    Following industry reports


    Given the demand for Linux in the global job market, the new certification programme
    is designed to follow on Introduction to Linux online (MOOC) and students to take
    exams that result in the qualifications of Linux Foundation Certified System Administrator
    (LFCSA) and Linux Foundation Certified Engineer (LFCE) at $300 per exam, taken
    from anywhere in the world.


    "The timing is perfect for this


    "Our mission is to address the demand for Linux we are currently experiencing.
    We are making our training program more accessible to worldwide users, one distribution,"
    claimed Jim Zemlin, executive Director at The Linux Foundation, at the launch.


    "Our new Certification Programme will be accessible to everyone and we hope to
    be among the first and the best. We believe Linux professionals will want to portray
    their skills, and that these certificates will be a hallmark of quality throughout
    our industry.


    Details of the programme are available at training.linuxfoundation.org/certification.


    The Linux Foundation has worked to ensure a number of distributions, with able
    to take the exam in one of three flavors: CentOS, openSUSE and Ubuntu. Exams are
    performance-


