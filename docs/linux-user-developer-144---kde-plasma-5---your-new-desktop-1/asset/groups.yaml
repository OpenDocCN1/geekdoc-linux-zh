    ## 评测剧本作家软件


    ## 简述：对比与我们的评判结果


    ### Treby


    ### Libreenplay


    ### Celtx


    ### Fade In


    | 特性 | Treby | Libreenplay | Celtx | Fade In |

    |---|---|---|---|---|

    | 应用行为无法更改，且没有针对不同项目的模板 | 仅在“样式”菜单中保留基础格式；然后它们会自动设置 | 拥有许多可自定义的模板，并内置了付费同步服务 |
    提供了一系列相当可自定义的范围，尽管仅限于电视和电影 |

    | 格式化 | 缺乏布局设计，自动格式化是主要功能并能识别你的操作 | 自动格式化非常好，但预设的“样式”只能逐个进行自定义 | 尽管 Celtx 不像 Treby
    那么智能，但获取好想法仍然容易得多 | 样式抽屉易于访问，并有许多选项可以切换和修改它们 |

    | 管理 | 无法在宏观界面上方便地查看和浏览保存的信息 | 强大的索引和搜索工具，但没有专门的列表或数据库 | 基础功能稳实，角色数据库可见度较低，用户界面良好
    | 导航功能稳实，虽然不需要直接的搜索去索引功能 |

    | 安装 | 在许多主流发行版中没有，除了编译外没有其他 | 安装不是最容易的，且缺少关键的管理/导航功能 | 虽然比普通的 Writer 文档更容易获得，但它并不能真正节省时间
    | Celtx 软件在安装和操作上略显逊色 | 非常适合脚本，但对于较大的项目来说还不够 |


    ## 那么，获胜者是……


    Treby 程序提供的简单界面，以及出色的 Celtx 软件及其云端工具包赢得了我们的青。Celtx 的主要优势之一是它的许多功能，拥有编写漫画、漫画书和音频的模板，以及剧本和电影的模板——Treby
    在电影方面很棒，但自动格式化功能表现不佳。


    除此，Celtx 在 Fade In 面前更胜一筹。当我用 Screenwriter 编写时，它清晰的界面正是我想要的，且不会拥挤你的写作空间（Treby
    在这一点得了高分）。我们非常喜欢 Fade In，但当我们真正开始编写剧本时，使用 Celtx 的工作流明显更好。


