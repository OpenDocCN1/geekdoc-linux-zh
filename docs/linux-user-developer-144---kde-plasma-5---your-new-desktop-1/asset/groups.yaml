    # DEVELOPMENT


    # Nvidia launches

    CUDA 6.5


    # Claims ARMv8 support will bolster HPC


    Nvidia has launched the latest version of compute Unified Device Architecture
    (CUDA) toolkit, for the latest ARMv8 instruction set ahead of the public availability
    of its Project Developer Tegra K1-64bit dual-core-system-on-chip.


    Designed to allow rapid development of graphics processor-parallel workloads with
    GPU hardware, CUDA 6.5 offers support for the 64-bit ARMv8 instruction set for
    the first time. With Nvidia planning to launch a 64-bit version of Tegra K1 which
    will include 192 CUDA-processing cores offering a claimed total of 300 gflops
    of single-floating-point compute performance, the launch is well-timed.


    The heritage of ARM64 (ARMv8) is in low-power, scale-out data centres and microservices,
    while GPUs are built for ultra-fast performance. When we combine the two, we have
    a compelling solution for HPC high-performance computing claimed Nvidia''s Mark
    Harris at the CUDA 6.5 launch. "ARM64 provides power efficiency, system GPUs provide
    the bridge to high-throughput, powerful compute performance."


    - CUDA 6.5 supports the 64-bit ARMv8 instruction set of the Tegra K1


    CUDA 6.5 is available for download free developer registration, the 32-bit Tegra
    K1-based Jetson Tokyo board is on sale for £99.99 (reviewed on page 83). Nvidia
    has not yet offered a launch date for 64-bit equivalent.


