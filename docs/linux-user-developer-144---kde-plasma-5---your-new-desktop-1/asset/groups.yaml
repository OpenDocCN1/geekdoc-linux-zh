  - '[PAGE 1]


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_1_0.png)


    # Can you volunteer for Code Club?


    Code Club is a nationwide network of volunteer-led after school coding clubs for
    children aged 9-11.


    We need people who know how to program computers to volunteer to run a club at
    their local primary school, library or community centre for an hour a week.


    We create the projects for our volunteers to teach, the projects we make teach
    children to program by showing them how to make computer games, animations and
    websites.


    Get involved, let''s teach the next generation to code!


    Visit www.codeclub.org.uk to find out more


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_1_1.png)'
  - '[PAGE 2]


    # Welcome


    # to 144 of Linux User & Developer


    # Get Linux User cheaper every issue


    **Bob Zetswloot** studied aerospace engineering, using Python to model complex
    simulations. A sometime he reached with Robot-Bot and this month he finished his
    shell Arduino-based Pi (page 78). He also joins in mixing avant-garde minat techno
    with Liam Faser''s RiSampler (page 62).


    **Richard Smitley** started using computers before WYSIWYG was the most powerful
    process working environment. Richard begins a new column on pages this month (page
    13) and includes short series with a guide to refactoring code (page 56).


    **Nitish Tiwari** is a software developer by profession and on enthusiast. As
    well as writing for open source, he sets up and uses open source software. Nitish
    walks through administrator management with Alfresco in this issue (page 54).


    **Mihalis Toukalos** is a system administrator by trade, working in databases
    and mathematics. He has used Linux since 1993. This month, Mihalis shows how to
    work with large files at the fastest with Awd and how to get more life from your
    hardware (page 36).


    **James L** is a kernel hacker who has been working on Linux for 18 years, since
    entering university at the age of 13. Jon lives in Cambridge, Manchester and works
    for a large enterprise venture. You can find his Kernel Column on pages 14-15.


    **Gareth Halfacre** is our resident reporter and brings us the latest developments
    from all over the world, starting on page 6. Gareth tests out the new Jetson TV
    version 80 to see if this is really the thing-his board of the future.


    +   * Run Linux on Android

    * Configure an Nginx server

    * Reviewed: Nvidia Nvidia TK1

    * Diskless booting over a network


    Welcome to the latest edition of Linux User & Developer, the UK and Africa''s
    favourite Linux. Linux is all about choice, and one of the keys to make as a user
    or developer is which desktop environment to use. Attitudes have changed since
    we asked which desktop is right for you, and workflow between GNOME and KDE is
    involving a much more diverse battle for your surface. How row a desktop for every
    type of user and workflow performance, how to help you make of it if we tested
    the best desktops and picked out their pros, cons and uses (page 16). Once you
    pick which one you like, just grab it from your free-disc.


    And if you''d like to see a desktop on a smaller, more portable screen then turn
    to page 26. We show you how to install Linux on your Android phone or tablet—regardless
    of your rooting situation and take advantage of freedom from your gear.


    Once your screen is all set, check out this month''s line-up – as well as shell
    scripting, Nginx and NFS servers, and we have some more Pi projects for if you''re
    looking to get your teeth into this issue. Have fun!


    **Gavin Thomas**, Deputy Editor


    # Get touch with the team: linuxuser@linux-publishing.co.uk


    Facebook Linux User & Developer


    Twitter: @linuxuser imagineshop.co.uk


    Buy online


    # Visit us online for more news, tutorials, and reviews: www.linuxuser.co.uk


