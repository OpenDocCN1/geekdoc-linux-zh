    Commands can be entered via the Terminal app. Note that there are a few seconds,
    depending on the device, but it is usable and gives you a good preview of the
    finished system.

    To return to Android, simply hold the power button to launch it. Restart Touch
    and then open the Ubuntu Dual Boot app. You can also uninstall it when remains
    from the settings.

    As we have demonstrated, there are many ways to install Linux on your Android
