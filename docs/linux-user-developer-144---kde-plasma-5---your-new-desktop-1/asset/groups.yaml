    # News

    The latest in the Linux community


    # OPEN SOURCE


    ANDROID


    # Intel pushes for x86 Android gaming


    Partners with Unity to improve developer tools


    Intel, system-on-chip processor designs are struggling to gain ground against
    industry incumbent ARM, has announced a partnership with game engine company Unity
    to bring native support for its software to x86-based Android handsets.


    Currently, many popular applications and games are available exclusively for ARM-architecture
    devices, with the relatively rare x86 instruction set architecture being largely
    ignored when it comes to software that requires native compilation. The partnership
    with Unity, Intel has, allows developers to quickly port their Unity projects
    to Android on x86 chips without compatibility issues.


    > "We set a goal of 40 million Android-based tablets this year and expect more
    than 100 million Android-based devices by the end of the year," claimed Intel''s
    Doug Fisher. Our collaboration with Unity will give its nearly 3 million developers
    the necessary software tools and support to build Android on Intel architecture."


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_8_0.png)


    +   - Unity developers will be able to access Intel graphics technology


    SECURITY


    # Synology hit by SynLocker malware


    Encrypts files, demands Bitcoins


    Synology network-attached storage devices have been hit by a self-propagating
    “ransomware package dubbed SynLocker, leaving users locked out of their files
    unless they pay an ever-increasing.


    Based on the source code of Cryptolocker, Synology’s Linux-DiskStation Manager
    (DSM) can gain access to internet-based DiskStation devices and encrypt all content
    files. Once encryption has begun, the administration page is replaced with a demand
    for the payment of 0.06 Bitcoins – £210 – to access the decryption key, with details
    provided to frame time.


    Synology has indicated that the vulnerability used by the attack was patched in
    December 2013, and only users running DiskStation Manager without the patch installed
    are vulnerable to attack. Updating to the current available releases of DiskStation
    Manager will close the vulnerability but not restore access to encrypted files.


    The attacker or attackers behind SynLocker have indicated that they will close
    the site offering decryption keys, promising to sell the entire database for 200
    Bitcoins (around £61,000). At the time of writing, however, the site remained
    active and were still being made available for individual purchase by affected
    users.


