    ## 新活动


    ## Linux 基金会宣布 Vault 会议


    探讨基于 Linux 的存储和文件系统


    Linux 基金会旨在将 Linux 内核领域领先的文件系统和存储开发人员与相关项目聚在一起，为此发起了 Vault 会议。


    Vault 将于 2015 年 3 月 11 日至 12 日在波士顿举行，届时将专属的 Linux 存储与管理社区同期。Linux 基金会希望驱动 Linux
    驱动硬件和软件的创新，为扩展软件开发者与硬件供应商之间的合作提供空间。


    “世界上 90% 的数据是在过去几年中创建的，大多数”


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_9_0.png)


    “上方，你可以为 Linux 基金会网站提交提案，数据正通过基于 Linux 的系统进行存储和访问，”Linux 基金会首席营销官 Amanda McPherson
    说道。


    “现在是让开源社区引入 Vault 这个新论坛的理想时机，共同探索提高容量、效率和安全的新方法，以应对未来几年将面临的海量数据。通过汇聚 Linux 文件系统和存储领域的智者，以及我们不断挑战可能边界的成员，Vault
    将能够扩展 Linux 的领先水平。”


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_9_1.png)


