    # OpenSource


    您的 Linux 新闻与观点来源


    # JON MASTERS


    ## 内核专


    Jon Masters 概述了 Linux 内核社区的最新动态，包括针对 3.17 内核正在进行的工作。


    我们在几个期数之前的 LU&D 中介绍过 `getrandom()`。它提供了一个新的资源安全 API，用于获取随机数（熵），该 API 对于在某些系统上可能发生或被阻塞的资源可用性低（挂起）的情况，始终是安全的。在没有足够资源来打开
    `/proc` 或 `/dev` 条目的情况下，`getrandom` 和 OpenSSL 系统服务可能始终能够使用传统的/随机种子接口来获取驱动会话的加密算法。而这个新系统提供了一个始终可用的随机数源，这可能更好，因为空闲的文件描述符不会影响可用性。因此，在大于或等于
    3.17 的 Linux 内核中可以使用此新系统。它提供了更多可以为内核代码提供熵的功能，而此前内核社区并没有实际用户对这些支持感兴趣。


    ### dbus 的准备工作


    在即将到来的“3.17-kernel”中，D-Bus 的实现工作在 3.17 中完成。D-Bus 是一种 IPC（进程间通信）系统，最初由 D-Bus 项目定义，现在在
    Qt4 中被称为 KDE。D-Bus 还允许服务通过接收消息来注册自己，然后向其他发送消息。服务可以根据请求被激活，这也是许多现代桌面组件实际的工作方式。在典型的实现中，我们提供了一个特定的“特权系统通道”以及一个用于用户登录会话的“会话通道”。


    Jon Masters 是一位 Linux 内核客，从事 Linux 领域已 20 年（从他 13 岁在马萨诸塞州剑桥上大学开始），他为一家大型软件供应商工作。他在
    kerneljournal.com 每日发布 Linux 内核日志。


    Linus Torvalds 发布了第一个发布的 3.17 内核 (RC1)，他声称该版本正在传输中（因此无法跟上大量涌入的补丁）。3.17 允许功能进入开发周期的“合并窗口”已经结束。


    dbus 旨在通过使用 D-Bus 作为一种机制来减少单次操作所需的交互次数。相反，现有服务需要一个处理消息来调用发送消息，而中间没有处理器（dbus-daemon），最后通过线程安全的接口由消息接收者接收，且不需要在各种进程之间进行上下文切换（被称为“任务”）。


    他还注意到，北半球的叶子比前几个要小。合并到 3.17-rc1 的新功能分布在内核各个角落。它们包括 `getrandom()` 函数，以及 dbus 需要的“合并”和“文件密封”（file
    sealing）功能。


    在架构层面，3.17 增加了四级页表，以支持 64 位架构 arch64。在物理地址空间方面，Linux 在具有大量物理内存的 x86 上使用，确保满足 64
    位范围（约 2^48，即 256 TB）的所需的现实，这是通过在 64 位系统上拥有一个极可能的物理内存映射（混合内存和地址），这在若干不再被广泛使用的架构上可行。由于情况通常如此，目前还没有移除内核支持的正式计划，而是由于某些损坏未修复持续了足够久，足以明显表明之前在某些其他案例中描述的，可能需要更重量级的处理，以及一个对于遗留应用程序看似内存高效的服务。


    ## 受影响的系统将反复重温 70 代


    为了运行，需要对内核进行一些更改（只需通过合并 kdbus 本身）。新的 `memfd` 机制提供了进程之间之间可跟踪内存区域的共享；否则将使用传统的文件描述符。


    “文件复制”功能与 `memfd` 配合工作，因为共享内存是在待合并的成员内部发送并被进程接收的，没有发送进程在发送后尝试对其修改的风险。


    一旦成员被密封，发送进程就无法对其进行更改。kdbus 消息传输的形式为分配一个成员、向该新分配的成员发送消息，并将其传递给内核。由于 kdbus 是一种内联机制，这意味着可以以非常轻量级的“零拷贝”方式进行，以便内核可以使用一些技巧而不是复杂的内存管理技巧来共享共享缓冲区。


    在过去的几个月里，关于 Linux 就绪情况的担忧日益多。这些担忧在 John Stutz 在 2014 年内核峰会之前针对该主题发表的一篇（长长的）“灾难素材”文章中达到顶点。John
    对“32 位架构的终结”提出了多项响应，例如引入一种具有支持全 64 位选项的新 ABI 的特殊子架构变体。2038 年对于 Unix 和类 Unix 操作系统是特殊的，因为溢出针对那些本要在
    2038 年 1 月 19 日之后工作的人。Unix `time_t` 溢出，大多数金融系统所认为的 Unix Epoch（1970 年）将溢出，受影响的系统将反复重温
    70 代。为了解决这个问题，但不像许多读者想象的，大多数金融系统按 365 天计算利息。


    Matt Fengming、Yinghai、Lu Hardy 和 Anton Mikkians 讨论了使用内核接口 (`intmap`) 在 64 位系统上处理
    32 位指针，由于内核和核心代码中的各种问题，这种支持非常有限，这些问题并未引入他们系统的“有缺陷的固件”。Yinghai 指出他最初请求补丁是为了支持数
    GB 大的 ramfs 镜像，这在目前非常罕见。


    Mitchell 发布了针对 kdb（可选内置内核调试器）内部“选择性减少功能”的补丁，这些可以用于 Linux 内核中的“调用 sock”机制。


    反转可能会提供给那些在没有补丁或工作的情况下启动内核调试器的人，限制了用户任意依赖系统或内核本身的“魔法同步”组合。


    来自马萨诸塞大学的 Mitchell 在内核邮件列表 (KML) 上邀请加入各种对内核开发感兴趣的“Linux 开发协作项目”，该调查在 http://rf076.roots.debian.org/5080/html/
    进行。


    最后，Simeon Rothfelt 补充说明，Linux 3.17 是第一个包含 linux-next 统计的版本，3.17-rc 此前已列在 linux-next
    中。


