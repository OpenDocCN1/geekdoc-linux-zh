    ### Trelby


    一款具有极简美学的多平台软件。Trelby 界面足够简洁，可以帮助你专注于任务，但仍然包含了许多惊人的工具和选项，具有自动编辑和格式化功能，以及角色名数据库、报告、图表等。


    文档：bit/1roejebL


    ### LibOScreenplay


    与其他程序不同。LibOScreenplay 是 LibreOffice Writer 的一个模板，专为电影制作者创建。LibOScreenplay 和其他自动调度模板的创建是为了保持简单，而不是使用专用程序，或者完全保持一个低调的系统。


    下载：bit/1u3ofMFZ


    ### Celtx


    既有在线版本也有免费桌面应用，Celtx 是一款功能齐全的剧本创作工具，由订阅服务支持，为你提供大量工具。它提供云存储、办公和管理工具、剧本编写和分镜工具、预算和清单。


    下载：bit/5SftQ1


    ### Fade In


    定位为专业级工具的 Fade In 具有高级感，这种感觉由广泛的自定义和细节支持，外云存储和良好的支持。另一个优势是 Fade In Mobile，这是一个让你能够随时随地导入和编辑剧本的
    App。


    下载：bit/1nyAST5D


    75 www.linuxuser.co.uk


    ## 评测


    ### Trelby


    一款设计更极简的专用歌曲创作工具。


    ### LibOScreenplay


    获取最佳 Office 套件的模板，减少你的额外软件。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_75_0.png)

    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_75_1.png)


    - 一个完整的常用名数据库，以防你需要帮助。

    - 模板包括精少数符合剧本标准的必备样式。


    ## 功能


    与本次测试中的其他剧本创作工具相比，Trelby 的功能较少。该应用程序的优点——在处理对话、场景等切换方面——是无法更改的。没有针对不同类型剧本的模板或笔记功能。


    作为基准，LibOScreenplay 仅包含你所需必需的基础格式样式。可以从菜单独立访问并更改它们。否则，如果你正在使用 LibreOffice Writer，它并不是为这项任务设计的。


    ## 格式


    尽管没有更改格式的方法，但 Trelby 在处理方式上非常聪明。例如，你只需点击即可更改行并保持文本一致。


    如果你发现某一刻需要大幅更改，在 Fade In 列中也可以访问这些样式。


    ## 管理


    Trelby 会记住角色和场景，例如在下拉菜单期间。找到角色数据库很困难，但它配合所有报告，让你监控动作与对话的比例。


    ## 安装


    源码在 Debian 和 Ubuntu 上免费提供，但并非适合所有人。在实际安装桌面版本之前，你需要注册一个免费账户，在线等效版本也是如此。至少桌面版本不需要安装——它将直接运行。


    ## 总体


    Trelby 是很可靠的，绝对比任何其他软件都好，但它不像其他那样具有吸引力。唯一的一就是让剧本编写尽可能简单。


    76 www.linuxuser.co.uk


    ## 剧本创作软件


    哪里是编写剧本的最佳地点？


    ## 评测


    ### Celtx


    多平台且非常流行的在线。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_76_0.png)


    Celtx 为编写不同类型提供了许多选项。


    ### Fade In


    另一个多平台 App。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_76_1.png)


    创建更好剧本的选项有限。


    ## 功能


    本次测试中最功能全的。Celtx 不仅有大量的剧本类型选择，而且非常舒适。对于电影和电视剧本，Fade In 拥有其他应用程序的所有主要功能。


    ## 功能


    Celtx 很好地猜测你任何时候想要写什么，但它与某些并不相同。


    ## 格式


    一种使用样式的良好方法，当你对工作流进行轻微修改时会变得活跃。


    ## 管理


    剧本的重要方面保留在侧边信息栏的顶部，如场景和笔记。快速参考，以及通过导航面板进行良好的搜索方法。


    ## 安装


    可以通过主界面访问非常实用的数据库结构，以便快速参考角色和地点，并还有一种良好的搜索方法。


