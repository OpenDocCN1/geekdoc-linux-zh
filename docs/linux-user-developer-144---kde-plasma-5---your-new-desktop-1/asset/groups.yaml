  md: "\n# Tutorial\n\nKeep your software and files between systems, as they are stored\
    \ on the server and not local storage\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_41_0.png)\n\
    \nConnect remotely to a fully working Ubuntu distro from any networked computer\n\
    \n# Boot Linux from NFS server\n\nThe distro is installed on the server that is\
    \ always on. It can be used on multiple systems if set up correctly\n\nDiskless\
    \ booting allows you to access the same distro from multiple locations on a network\
    \ without juggling files\n\n## Resources\n\nAn Ubuntu server\n\nWhile you may\
    \ think like they're common, the concept of a mainframe with dumb terminals is\
    \ of an obsolete concern now. The proliferation of high-performance machines made\
    \ it easier to have everyone their own system and that's really changed.\n\nBetween\
    \ different computers within the same network, a more updated version of the classic\
    \ machine image may prove better. With NFS booting, the kernel and file systems\
    \ are kept on a central server and pushed out onto client systems to be booted\
    \ off which means they will always be available wherever you want to log in.\n\
    \nWhat has changed, though, is the way we treat data, which is now backed up to\
    \ the cloud so it's ever-accessible, or just around in our pocket on tiny USB\
    \ storage devices with more memory than you'd ever need for processing documents.\
    \ If you're moving\n\nThis tutorial needs a server that's dedicated to hosting\
    \ the distro and is always — specifically an Ubuntu server — to be able to serve\
    \ Ubuntu around a network.\n\nwww.linuxuser.co.uk\n\n# Boot Linux from an NFS\
    \ server\n\nLaunch a distro from multiple locations on a network\n\nTUTORIAL\n\
    \n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_0.png)\n\n![](img/bab7f65683e8ebca10d1e8aa808ba7ff_42_1.png)\n\
    \n| robz@vubontw: | Configure PXE |\n| --- | --- |\n| nano 2.2.6 | options |\n\
    | /etc/dhcp/dhcp.conf | modified |\n\n# 01 First installation\n\nThe first job\
