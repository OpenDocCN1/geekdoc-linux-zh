    问：我如何更改 GRUB 菜单的启动顺序？

    答：在 grub 2 中，启动菜单的顺序由 /etc/grub.d 内部文件的顺序决定。主安装程序（你正在使用的那个）将列在第一位。只需更改数字即可更改顺序。


    问：我可以在列表中添加其他条目吗？

    答：是的，你需要在与 grub.d 中已存在的文件相同的文件的文件。再次，它们是按数字排序的。


    问：我可以更改默认条目吗？

