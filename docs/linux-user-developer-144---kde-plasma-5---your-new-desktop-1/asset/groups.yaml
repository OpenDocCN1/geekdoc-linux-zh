    # # Why do it?


    The key benefits of running Linux on Android


    +   * It''s portable and convenient. No need to carry another laptop when you
    can run Linux on your phone instead.

    * Access the command line from a terminal and use all of your favourite Linux
    tools.

    * Use VNC to run a desktop GUI anded applications.

    * Gain access to thousands of Linux applications; many of these are more powerful
    and more comfortable than Android environment.

    * It''s particularly useful for users and software developers, in order to build
    ARM software, and have real-get access.

    * You could run a LAMP server on your device, run web apps. It''s relatively straightforward
    to configure.

    * A Linux-running Android device could be used in hardware projects, such as roots
    Pi remote control unit.

    * Gain all the benefits of running Linux without harming your standard Android
    device with access to all of worlds on one device.


    Above the other Linux Deploy, Kali comes with a basic set of desktop applications


