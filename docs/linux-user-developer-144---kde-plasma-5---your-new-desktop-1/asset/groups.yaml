    # 您的观点


    您的 Linux 新闻与观点来源

    联系我们...

    注册并发表您的评论... www.linuxuser.co.uk/forum/ linuxuser@imagine-publishing.co.uk


    # 您的观点

    Linux User 来信

    您对杂志、Linux 和开源的意见


    # Model B+ 并不是 A++


    B+ 比 B 更强大吗？抱歉，但它们也需要提高性能和内存。我们中的一些人需要更多的性能，而基于 ARM 的双核在平板电脑上很便宜。我尝试过使用原版的 Model
    B，它简直像中世纪的东西。并不是说它在开启交换分区的情况下无法播放视频。等待页面加载完成需要三分钟意味着我最终不得不花 9.99 英镑买了一个旧的 AMD
    E6640 主机并安装了 Linux。这要好得多。我看出其他别人可以派上用场，但我的几乎没法用。


    Mi Pen


    值得注意的是，树莓派从未被设计为消费级爱好设备，但随着芯片的过时，看起来明年这个时候将树莓派升级到树莓派 2 似乎是更好的选择。基金会将 Model B 作为最后一个迭代，所以也许等待
    Model C 或在未来升级是值得的。


    # 开源，大门敞开？


    虽然我是开源的支持者，但我一直担心恶意代码通过隐藏链接或代码片段进入我使用的程序中。


    我使用的开源代码越多，就越发现它们实际上是完整的。这不是移动性的问题，而是代码确实有效。听到有人正试图破坏，而模组维护者（mods）能够确保他们的代码不混入，这真好。听到他们给予了疑点利益，并在他们真的想要贡献时提供了一些最佳实践，这种感觉很好。


    这是我对贡献过程的一些感受。


    Lisa


    我们对 Linux User 的“飞行堡垒”状况大笑了一场，但如果主控们没有都收到警告，这可能会是一个严重的问题，而且这种情况很有可能。幸运的是他们都收到了警告，可能很快他们就会保持更新。他们感到很惊讶。他们耐心地依靠，尤其是那些关于
    Linux 本人如何处理短终止进程的故事——尤其是有一次可疑点渗透了，而 Linux 自己自己顶住了。


    # 更新的内核


    每当我更新我的发行版时，我都会获得新版本的 Linux 内核；然而，它并不是最新版本。它们在 3.12 系列上到了 3.16。是遗漏了什么吗？我做错了吗？我想知道新内核更新中函数是如何更新的。如果发行版不能自动升级到最新内核，我可以自己安装吗？为什么这些发行版不将它们更新到最新内核？


    Laura B


    Model B 性能稍低，并不是所有人想要的


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_93_0.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_93_1.png)


    94 www.linuxuser.co.uk


    以上 Linux 及其团队密切关注内核，以跟踪更新并阻止恶意代码


    # 您的观点

    Model B+, Linux 内核, 香蕉派

    来信


    ## Twitter:

    @linuxusermag


    ## Facebook:

    Linux User & 开发者

    不仅仅是内核在备份方面略显滞后；许多发行版也使用了旧版本。这是根据具体情况安排的，同时也保持其他软件处于最新。一种情况是版本并不总是基于个案且是不同的发行版，但最终由于人类需求和在下一个版本中以不同的方式修复问题。内核则略有不同，因为它是系统的核心，每个内核都有不同的主版本。你可能想要耐心安装最新内核，或者你可能想从头重新安装软件。我们发现最简单的方法是获取持续更新并使用最新软件的滚动发行版。


    # 话题

    ## 新款香蕉派


    我们上次测评了香蕉派（Banana Pi），然后在网上发布了评论，反应相当复杂；夹杂着好奇心和失望。我们的对话以及关于香蕉派的：http://bit.ly/3hluk


    > Glen Duncan 说:

    “为那些发现了莓果变体的用户提供的升级”


    > Hulong Luo 说:

    我们使用香蕉派一个月来将 Android 软件移植到树莓派。我发现它快得多，最重要的是它支持 Android 并可以运行 Chrome。树莓派似乎无法支持
    Android。


    > PyPlate 说:

    “我对性能的提升感到非常满意。我用四个香蕉派构建了一个集群。”


    > Michael Horne 说:

    “你是对的”


    # Android 杂志


    # 选择时间

    随着更多内容整合进 Linux 内核，开发这种最流行的操作系统之一变得越来越简单。拥有超过 25 亿下载量和超过 1 亿 Android 设备，全球准备好并愿意使用应用程序的用户。作为
    Android 驱动的编辑部，我们在 Android 几个月后采取了专门针对该平台的刊物。除了新闻和评论帮助您保持 Android 更新，这里还有关于您的黑客操作的教程和建议。在
    www.linuxuser.co.uk 了解更多。


    > Keith Neill 说:

    “虽然试图驾驭树莓派的边缘很容易的。但无论如何，它们真的可行吗？树莓派如果能降低成本，实际上会运行得更好。这次升级带来了一些批评”


    > Pas 说:

    “我对我的家里感兴趣，带有服务器。很好的一点是，它为移动设备提供的支持是很有需要的。”


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_94_0.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_94_1.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_94_2.png)


    99.linuxuser.co.uk


    # 在 DVD 上

    发现等待您的内容


    欢迎阅读 Linux User & 开发者，为您提供本月测试的最新的发行版。在您的桌面上，您可以轻松安装并查看感兴趣的版本。此外还有三个用于测试新想法的启动发行版——Android-x86
    的第一个稳定版本。像既往一样，所有您需要的软件包。


    发行版

    Elementary OS、PlinuxOS 和 LXDE 都从 DVD 启动。Android-x86 是可以下载的 ISO 文件。作为每期的核心内容，您可以找到遵循
    DVD 此部分教程所需的所有资源和代码。在这里您将找到用于编程的最新最佳软件环境。


    教程存档

    来自过去期数的一些优秀指南


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_95_0.png)


    # 如何刻录 ISO

    想尝试新的发行版吗？这里是开始的方法……


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_95_1.png)


    步骤 1：获取新 ISO

    将 ISO 从我们的光盘封面拷贝到您的硬盘，进入“标签”选项卡，点击 ISO 并保存。之后，在线安装 ISO。如果您不确定需要 32 位还是 64 位版本，请选择前者以防起见。


    步骤 2：打开或安装 Brasero

    Brasero 是最流行的开源工具。如果发行版尚未安装，请在存储库中找到并安装它。然后打开并从左侧的“项目”选项卡搜索“Brasero”。


    步骤 3：刻录您的磁盘镜像

    在刻录设置菜单中，点击第一个框（此处有标记）来选择磁盘镜像，并导航到您刚刚放在驱动器上的 ISO。一旦选中，您就有了一个 CD 或 DVD 可写磁盘镜像，点击“创建映像”。


    # 编辑挑选


    **LXQt** 针对需要速度极快、模块化且基于现代技术和标准的经典桌面环境的需求，这是 LXDE-Qt 和 Razor-qt 项目合并的成果；虽仍在开发中，但已具备金标准桌面环境的所有特征。


    **Nginx** 作为 Apache 的严肃替代品脱颖而出，采用率稳上升，Nginx 作为一个 HTTP 和反向代理（外邮件服务器），在本月使用 Joomla!
    展示了它的能力，您可以从磁盘上的软件包中安装它。


    **Enlightenment** 一种极大可扩展的轻量级窗口管理器，Enlightenment 是更广泛库项目的一部分，该项目驱动了从手机到打印机的数百万系统。


    # 完整索引


    # 操作系统


    **Elementary OS Freya Beta 1** 在发布正好一年后，elementary OS 回归并推出了 3 版本的第一个测试版，带来了大量更新、新硬件支持和库。


    **LXDE 14.0.4** 我们的新宠爱，这是轻量级 LXDE 发行版的 64 位版本，通过优化的 LXDE 桌面复活了这个旧项目。


    **Android-x86 4.4** 经过一段时间的开发，团队发布了 Android 4.4 (KitKat) 适配 x86 的第一个稳定版本。


    **PlinuxOS 2014** 作为成熟的发行版之一，最新版本的 PlinuxOS 是 LXDE 衍生版，尽管如果您偏好不同的环境，重新安装桌面也非常容易。


