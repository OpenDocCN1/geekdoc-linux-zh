    在大家的帮助下，一份关于编程你自己的 Pi（RasPi）的特殊指南——我们为社区推出的全新全数字姊妹杂志的首期——已经非常火爆并引起了不关注。如果这对你来说是很新鲜的，请翻阅前几页，亲自看看这精美的一期。RasPi
    是专为那些每月都会直奔杂志红边页页的读者打造的专题杂志，旨在每个月为你提供最佳阅读体验，充满锐的摄影、智能代码以及你想要的所有 Fritzing 图表，每一期我们都会带你完成一个大项目，并将编码技能提升到新高度。App
