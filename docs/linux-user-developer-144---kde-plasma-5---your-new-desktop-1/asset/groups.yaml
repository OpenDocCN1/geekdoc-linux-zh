    # DEVELOPMENT


    # Nvidia launches

    CUDA 6.5


    # Claims ARMv8 support will bolster HPC


    Nvidia has launched the latest version of compute Unified Device Architecture
    (CUDA) toolkit, for the latest ARMv8 instruction set ahead of the public availability
    of its Project Developer Tegra K1-64bit dual-core-system-on-chip.


    Designed to allow rapid development of graphics processor-parallel workloads with
    GPU hardware, CUDA 6.5 offers support for the 64-bit ARMv8 instruction set for
    the first time. With Nvidia planning to launch a 64-bit version of Tegra K1 which
    will include 192 CUDA-processing cores offering a claimed total of 300 gflops
    of single-floating-point compute performance, the launch is well-timed.


    The heritage of ARM64 (ARMv8) is in low-power, scale-out data centres and microservices,
    while GPUs are built for ultra-fast performance. When we combine the two, we have
    a compelling solution for HPC high-performance computing claimed Nvidia''s Mark
    Harris at the CUDA 6.5 launch. "ARM64 provides power efficiency, system GPUs provide
    the bridge to high-throughput, powerful compute performance."


    +   CUDA 6.5 supports the 64-bit ARMv8 instruction set of the Tegra K1


    CUDA 6.5 is available for download free developer registration, the 32-bit Tegra
    K1-based Jetson Tokyo board is on sale for £99.99 (reviewed on page 83). Nvidia
    has not yet offered a launch date for 64-bit equivalent.


    # OPEN SOURCE


    # Munich to evaluate LiMux success


    # Return to a Windows policy following claims of performance


    The City of Munich is evaluating its IT system to abandon its pioneering open-source
    adoption, returning its systems back to Microsoft''s Windows platform following
    what are claimed to be problems about the Linux systems currently in use.


    According to a report from local news outlet Süddeutsche, deputy mayor Josef Schmidt
    says Linux-based systems with Windows. "No matter what department I visit, they
    get everything that they need to work," says Schmidt, "We have to change."


    An independent expert group has been appointed to analyse the situation. "If the
    experts recommend a return to Microsoft," said Schmidt, "that is not impossible
    for me"


    The City of Munich was the first of governments to look towards a shift away from
    proprietary software, having begun its


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_7_1.png)


    to do." Schmidt claimed that the total cost of ownership for Linux has not been
    proven as attractive as its alternative. "We have the impression that Linux is
    very expensive," he added, "because it has a lot of performance concerns."


    However, this is not to say the case for LiMux alone. Rather, the council''s elected
    mayor Dieter Reter has claimed the Linux IT systems in an interview, with the
    Tech-department council councillor Stefan Haas clarifies, "we question the organisation,
    performance and the usability and satisfaction of the users."


    +   The City of Munich has appointed experts to rule on whether it should abandon
    LiMux


    migration to the custom-developed LiMux distribution in 2004. Schmidt''s reported
    claims aside, the move has been generally reported as a major success.'
