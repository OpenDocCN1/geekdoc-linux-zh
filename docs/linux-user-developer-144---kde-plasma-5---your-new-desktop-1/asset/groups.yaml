    # # Zotac Nvidia Jetson TK1


    With five Cortex-A15 processor cores, a customised Ubuntu OS and 192 CUDA cores,
    is the Jetson TK1 the SBC of the future?


    +   **Pros**

    The pre-installed operating system is user-friendly, Tegra K1 processor puts hardware
    to no shame


    The Jetson TK1''s first development board to be marketed at the general public,
    has taken a circuitous route to our heroes. Unveiled at the Graphics Technology
    Conference earlier this year, the board launched in Europe hampered by export
    regulations. Zotac, as an Nvidia partner for its graphics hardware, volunteered
    to sort things out and has partnered with Maplin to be the first to bring it.


    +   **Cons**

    It''s cheap, the GPU performance is less than friendly, and Nvidia hardware lacks
    OpenCL support despite its deponents on the chip


    In so, however, the price has become a little muchled: $192, a clever deal per
    GPU core, has become £199. Compared to the £30 Raspberry Pi, it''s a high-end
    item that could find itself priced out of the reach of the common user''s customers.


    A glance at the specifications reveals the Jetson is so highly priced; it is the
    latest-generation Tegra K1, a 32-bit ARM: Cortex-A15 implementation


    which packs 2.30hz CPU cores and a fifth low-power ''Shadow Core'' that takes
    over background processing to reduce power draw. Its biggest feature, is the 192
    Kepler GPU cores, based on Nvidia Maxwell graphics chips and full support for
    the Compute Unified Device Architecture (CUDA) general-purpose GPU offload.


    Developers are able to take tasks that are highly parallel in nature and run them
    on the GPU rather than the CPU. It''s a technique that is well-used in games and
    can be used for cryptography to computer vision. It is the only GPGPU language
    supported by the Jetson: despite the Tegra K1 boasting fully OpenCL support, this
    is not implemented in the Jetson, leaving Nvidia''s proprietary CUDA as the only
    option available to developers.


