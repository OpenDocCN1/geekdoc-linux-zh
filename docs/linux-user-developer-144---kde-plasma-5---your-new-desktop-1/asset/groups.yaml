    # 常见问题解答：什么是 Python？


    Rob Zwaetsloot 作为一个精通 Python、Django 的 Web 开发人员，他喜欢这样进行代码实验……


    树莓派基金会有一份关于 Python 的绝佳指南，你可以从那里开始学习该语言的基础知识：bit.ly/LLJD


    延伸阅读

    我们在 User & Developer 网站上提供了树莓派相关的教程，还有一本专门针对树莓派项目的数字杂志叫做 RaspPi。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_71_0.png)


    # 什么是 Python？


    这种在树莓派上流行的编程语言。是什么让它如此特别？


    人们对树莓派上的 Python 有很多关注。这是编程树莓派的唯一方式吗？

    完全不是。我们在树莓派上使用 Linux，几乎可以使用所有的编程语言。C、C++、Python 等都与树莓派完全兼容。我们正使用它们来为树莓派——创建在树莓派上运行的程序。


    科学。这涉及编码，Python 被认为是一门容易学习的语言。对于所有人来说，精通 Python 很容易，而且我们也认同树莓派基金会的目标。


    所以“可读性”意味着你只需要看就能理解发生了什么吗？

    这并不完全是意思；你仍然需要对 Python 和代码有基本的理解，以识别代码，并可能包括列表（list）或类（class）之间的区别。这些可以很容易学会，而且（通常）比其他语言更容易上手。


    什么让它比其他语言更容易使用？

    变量和函数的命名非常清晰，其结构设计用于处理许多其他语言。这意味着你扫描它的几行代码比扫描其他语言要快，而其他语言看起来像是在键盘上乱走。


    它足够容易教给孩子吗？

    绝对可以。它在数学上非常简单，因为你正在教授规则和方法，通过正确的课程可以立即获得答案，只需通过思考就可以引入并并在不同的概念上进行构建。那这很值得知道。如果是这样的话，为什么许多像你和树莓派的人们还要继续使用
    Python 呢？

    这真的回到了树莓派基金会的使命：帮助学生学习计算机。由于你正在教授规则，并且你可以立即产生答案或输出事实，英国课程即将发生的变化将涵盖具体的编码。


    等等……IDLE？那是刻意的引用吗？

    完全不是——Python 被全球各地的公司使用，它并不是唯一的语言，尽管至少有些公司不使用 Python，但它让你学习编程的细微之处，并让其他语言变得容易一点。

    是的，IDLE 是以 Monty Python 和 Eric 命名的，因为科技界的每个人都是极客。我看到树莓派上有很多多个 IDLE。![](img/bab7f65683e8ebca10d1e8aa808ba7ff_71_1.png)


    # 常见问题解答


    Python 可以与其他语言交互吗？

    标准的 IDLE 使用 Python 2，而其他 IDLE 使用 Python 3。它们之间有很大不同。由于 Python 在树莓派上的流行，它在项目中仍然非常普遍。


    这取决于语言，在某些情况下你可能需要使用不同的语言。数据库可以使用 SQL 来创建和管理，但 Python 就可以处理一切。


    我应该用哪一个？

    最好坚持使用 Python 2，从 2 迁移到 3 并不是什么大问题，由于某些的变化会发生，你将处于一个很好的位置。![](img/bab7f65683e8ebca10d1e8aa808ba7ff_72_2.png)


    # 如何创建程序？


    我可以在树莓派上创建代码吗？

    像编程一样，你将创建一个脚本：一个包含所有代码的文件，然后 Python 解释器将运行它。你可以在专业的文本编辑器中创建它，甚至在终端上编写并将其保存为 .py
    文件。最好的方法是在 IDLE 中创建。


    它是特定平台的，所以如果你在 PC 上有模块和文件，你可以将它们传输过去，运行运行良好。某些模块可能使用不同版本的 Python，但在 99% 的情况下不会遇到问题。


    # 什么是 IDLE？如何在树莓派上获取它？


    集成环境软件允许你创建和测试特殊语言的脚本。你还有其他调试文件的方法，在树莓派使用 Python 的情况下，你可以使用已经安装并从桌面获取的 IDLE。![](img/bab7f65683e8ebca10d1e8aa808ba7ff_72_3.png)


    # 在树莓派上制作 Minecraft 第140


    使用 Python 和一些专门为树莓派版本制作的特殊库制作 Minecraft，是参与并学习一些游戏编程的一种棒方法。![](img/bab7f65683e8ebca10d1e8aa808ba7ff_72_4.png)


    # 音频书第143期


    这个项目的美丽之处在于，你可以创建一个物理设备来执行任务，只需修改一行代码即可在两者之间切换，或者多写几行代码让它同时工作。


    # Python 大师课第126期


    在很久以前的第126 期，我们为初学者提供了一份指南，介绍了如何接触 Python，从最基础知识开始到更多。在我们的 iTunes 应用内的 Python
    数字版中会有详细解释。


    '
