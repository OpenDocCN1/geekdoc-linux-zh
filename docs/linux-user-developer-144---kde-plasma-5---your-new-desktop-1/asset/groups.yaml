    DHCP server a few other things with:


    ```

    ```sudo apt-get install dhcp-server

    tftppd-hpa nfs-kernel-server\initramfs-tools ```

    ```


    # 02 Configure DHCP


    The server will need to have a DHCP server set up. To do this, open the terminal
    and get the DHCP config file by typing nano /etc/dhcp.conf by adding the following
    lines to the end of the file:


    ```

    ```allow boot;

