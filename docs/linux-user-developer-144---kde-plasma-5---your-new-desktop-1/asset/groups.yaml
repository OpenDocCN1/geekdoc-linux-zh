    # ## 08 Awk built-in functions


    Awk has built-in functions for string, number and random manipulation. You can
    easily generate random numbers using Awk but be warned that Awk''s rand() function
    can generate repeatable output. The presented example uses an array rnd to store
    the generated random numbers.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_39_0.png)


    # ## 09 Pattern matching


    The following awk identifies if the input is an integer, string or an empty line:


    an awk program, allows you to do additional processing of the data.

    The FILENAME variable holds the filename of the file currently processed but you
    can use it inside the BEGIN block if it is not defined.


    ```

    /^[0-9]+$/ { print "This is an integer" }

    /^[^0-9]+$/ { print "This is a string" }

    $/ { print "This is an empty line" }

    ```


    Please note that it can match more than one line.

    A awk script can become a program by changing its properties and inserting the
    line at its start (to a Perl script):


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_39_1.png)


    # ## 07 Doing simple things with Awk


    The command line finds the unique IDs on an Apache log page file:


    ```

    $ access.log ''{print $1}'' | sort | uniq -c

    ```


    The "print $1" prints the first column of each line, which is the IP address of
    the client.

    The next command finds the total Mbytes by summing up the counts of the field:


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_39_2.png)


