    That you should get actually seeing the drive in that. To go to mount it automatically,
    you will need to add the /etc/fstab file, which you can access in the terminal
    with something like:


    ```

    $ sudo nano /etc/fstab

    ```


    Where nano is just a text editor. The line should look like this:


    ```

    //192.168.1.250 /home/user/Share

    nfs defaults 0 0

    ```


    ```

    $ # /192.168.1.250 /home/user/Share

    Share

    ```


    You can place it anywhere, but make sure to create the folder. If that doesn''t
    work, you''ll need to install Samba. You can then find it in the software centre,
    and then the mount point would be:


    ```

    $ mount -t smbfs //192.168.1.250 / home/share

    ```


