    ## 在终端模拟器中运行多个发行版……


    GNURoot 应用让运行多个发行版变得简单


    - 01 在你 Android 设备的 Play 商店中搜索 GNURoot。安装主 GNURoot 应用，然后选择你想要运行的辅助性发行版（helper
    distro）。

    - 02 打开 GNURoot 应用，从顶部的下拉菜单中选择你正在使用的辅助性发行版。然后点击“Create New Root”（创建新根）框进行解压——这可能需要几分钟。

    - 03 完成后，从第二个下拉菜单中选择发行版，并点击“Fake Root”（伪根）框（这样你就可以使用 apt-get 和其他命令），然后点击 Launch
    Roots（启动根）。

    - 04 首次启动可能需要一段时间，导致几秒钟黑屏。现在你已经准备好运行下载的发行版了。

    - 05 首先，为了确保所有内容都是最新的，请使用命令 `apt-get update` 和 `apt-get upgrade`。如果使用 Fedora，请改用
    `yum update`。


    > 要运行程序你需要 GUI。GNURoot 提供了一种实现 GUI 的方法


    ## ARM 设备


    **在 x86 基础上运行 Linux**

    **Android 设备**


    对于本文，我们关注的是在 ARM 架构的设备上安装 Linux。然而，像三星 Galaxy Tab 3 是基于 x86 架构的。由于几乎所有的 Linux
    发行版都基于 x86，这具有些挑战性。


    无论使用 U 盘（本文使用了 U 盘）还是 SD 卡，进行微调以使功能正常工作，对于三星 Galaxy Tab 3、Ubuntu 和 openSUSE（这种模式）似乎是最佳选择。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_27_0.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_27_1.png)


    Store (github.com/distroot)；它通过 Linux Proot 提供的进程在非 x86 设备上运行。无需担心任何技术障碍，因为该应用并不会让你以
    root 身份使用。相反，你只需要下载并安装适用于不同 ARM 设备的“应用”（如 Ubuntu、Fedora 或 Arch）。


    按照通常，你可以通过点击顶部的“apt”创建额外的终端，然后在左上角的垂直菜单之间切换。右上角的（三个）图标允许你调整窗口大小和移动窗口，包括字体大小（你可能在小屏幕上需要更看清文本）以及用于各种缓冲区组合的特殊键。


    ### 获取图形界面

    虽然运行 Linux 非常有用，但你的选择有限。GNURoot 的四个主要发行版的特点是，它们只能在没有 GUI 的情况下运行。如果你需要 GUI，GNURoot
    提供了一种实现它的方法，使用“VNC server”（其目的是为了启动一个 VNC 服务器）。要查看 GUI，你需要安装 (github.com/distroot/vroot)
    或 Gentoo (github.com/poRoot 是 VRoot 的旧版本)，然后使用许多可用的 VNC 客户端之一。Wheezy 发行版在终端中启动。更新并升级后，你可以安装你需要的图形环境——第一次运行时看起来应该像
    ''root1!''。然后你可以打开 VNC Viewer 应用并指向此地址，输入密码为 ''password''。随后将启动虚拟桌面——注意，没有真正的桌面环境


