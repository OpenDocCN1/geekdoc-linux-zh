    # FAQ:

    Editing GRUB


    Q: How can I change the boot order of GRUB menu?


    A: In grub 2, the boot menu''s order is determined by the order of files inside
    the /etc/grub.d directory. The main Linux installation, the one you''re using,
    will be listed as 10_ubuntu, everything in discovers will be listed in order from
    the os filer. Simply change the numbers to change the order.


    Q: Can I add Windows or other entries to list?


