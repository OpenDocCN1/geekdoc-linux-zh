    # Linux Foundation announces Vault conference


    Addresses Linux-based storage and filesystems


    Aiming to bring the world''s leading developers in filesystems and storage within
    the Linux kernel together with related projects, Linux Foundation has launched
    the Vault conference.

    Vault will take place on 11-12 March 2015 in Boston, alongside the exclusive Linux
    Storage and Management community. The Linux Foundation hopes to drive innovation
    in Linux-powered hardware and software providing space for extending the collaboration
    between software developers and hardware vendors.

    "90 cent of the world''s data has been created in the last few years and most
    of


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_9_0.png)


    Above You can submit a proposal for the Linux Foundation website that data is
    being stored and accessed via a Linux-based system," said Linux Foundation chief
    marketing officer Amanda McPherson.

    "Now is the ideal time to bring the open source community in this new forum, Vault,
    to collaborate on new methods of improving capacity, efficiency and security to
    manage the huge data volumes encountered in the coming years. By bringing together
    the minds of Linux file systems and storage and our members who are pushing the
    limits of what is possible, Vault should expand the state of the art in Linux."


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_9_1.png)


