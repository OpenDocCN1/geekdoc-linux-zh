    ## The kernel column


    Jon Masters outlines the latest happenings in the Linux kernel community, including
    ongoing work towards the 3.17 kernel.


    We covered getrandom() in LU&D a few issues ago. It provides a new resource-safe
    API for obtaining random numbers (entropy) that is always safe against low availability
    of resources (stalling) that can occur or be blocked by any, on some systems.
    In the absence of sufficient resources available to open /proc or /dev entries,
    it might be that getrandom and the OpenSSL system service are always available
    to use the traditional/random seed interfaces for obtaining the cryptographic
    algorithms that power sessions. The new system provides an always available random
    number source, which could be better because a free file descriptor does not affect
    the usability. Thus, it is possible to use the new system in Linux kernels greater
    than or equal to 3.17. It provides more functions that can provide entropy to
    kernel code the kernel community that there were no actual users with an interest
    in support.


    ### Preparation for dbus


    Preparation worked in 3.17 for the forthcoming "3.17-kernel" in implementation
    of D-Bus is an IPC (Inter-Process Communicator) system originally defined by the
    D-Bus project and also now known as KDE in Qt4. D-Bus also allows services to
    register themselves by receiving messages and then send messages to others. Services
    can be activated in request, which is how many of the modern desktop components
    actually work. In a typical implementation, there is one specifically "privileged
    system channel" provided by us and one "session channel" for login sessions for
    users.


    Jon Masters is a Linux kernel hacker who has been on Linux for over 20 years,
    since he first attended university at the age of 13 in Cambridge, Massachusetts,
    and works for a large software vendor. He publishes a daily Linux kernel journal
    at kerneljournal.com.


    Linux Torvalds announced the first released 3.17 kernel (RC1) which should be
    traveling (and thus not to keep up with a massive influx of patches) that he claimed.
    The "merge window" of the period during which features are allowed into development
    cycle for 3.17 is away.


    dbus aims to reduce the number of interactions required for one operation by using
    D-Bus as a mechanism. Whereas, the existing services need a processing message
    to make a call to send a message, without a handler in the middle (dbus-daemon),
    and finally received by the recipient of the message via a thread-safe interface
    requiring no context switches between various processes (known as "tasks").


    He also noted, that of northern hemisphere leaves are smaller than the first few.
    New features pulled into 3.17-rc1 were spread all over the kernel. They include
    the getrandom() function, and for the "merge and "file sealing" features needed
    for dbus.


    At the architecture level, 3.17 adds four-level page table to support the 64-bit
    arch64 with x86 in terms of the physical address space that can be used by Linux
    on x86 with much physical memory to ensure the required reality of the 64-bit
    range (around 2^48, which is 256 terabytes) is satisfied by having a highly-possible
