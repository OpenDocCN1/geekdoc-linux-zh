    # 01 Install Awk and Sed


    The good news is that every Linux distribution comes with Sed and at least one
    version of Awk installed so you do not have to install them yourself, however
    you might want different variants using the package manager of your Linux version.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_38_2.png)


    # 02 Using Sed


    The Sed command globally replaces a string with another in a file:


    ```

    $ sed ''s/string/two/g'' file

    ```


    If you want to save the original file contents to a new file and the changed character,
    use the following option:


    The previous command replaces occurrence of the word "three" with "3", with the
    output to the file "text" and keeps the original file "text".


    If you want to perform a case insensitive search and replace, use the following
    command:


    ```

    $ sed -i.bak ''s/three/3/g'' file

    ```


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_38_3.png)


    # 03 Using Awk


    "Hello World" program can be written in two ways. The first one is via command
    line and the second is by storing the script. It is better to use Awk on a separate
    file if you are beginners.


    By default, Awk splits input lines into fields based on spaces and tabs. You can
    change the field separator using the -F command option and another character.


    # 04 A Sed example


    Awk allows you to create multiple files. The following example shows the path
    of the binary from "/usr/local/bin/perl" in multiple files:


    ```

    $ sed ''s|/usr/local/bin/perl|/usr/bin/perl|g''

    ```


    Note that you have to escape the character "/" in order to use the "/" character
    as a normal character.


    Always remember that Sed, the previous file is gone forever.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_38_4.png)


    # 05 An Awk example


    If you want to print the first and third columns of a file, you should follow
    the following command:


    ```

    awk ''{print $1, $3}''

    ```


    If you want to print the second and third columns in reverse, execute the following
    command:


    ```

    awk ''{print $3, $2}''

    ```


    To print the last two columns of the input, use:


    ```

    awk ''{print $(NF-1), $NF}''

    ```


    Here, NF is a variable that holds the number of fields in the current line and
    $NF is the last field of the current line. The $0 variable represents the current
    line.


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_38_5.png)


