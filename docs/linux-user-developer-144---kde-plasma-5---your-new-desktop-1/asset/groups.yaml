    # 特性


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_28_0.png)


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_28_1.png)


    这是 Debian 的 Whezy，用于 GNURoot 运行 Xfce 桌面环境


    ## 从 Android 启动 PC


    使用 DriveDroid 在没有 live CD 或 USB 的情况下在 PC 上安装并启动


    如果你希望在 PC 上使用 Linux，那么 live CD 或 U 盘允许你随地启动。更好的是，DriveDroid 使用你的 Android 手机，你可以随身携带。在应用中选择
    ISO 或 IMG 文件后连接 USB 到 PC，然后重启（进入 BIOS）。然后启动你选择的发行版。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_28_2.png)


    默认情况下，这是一个 xterm 窗口用于 Whezy。通过清除屏幕，你可以移动鼠标指针并选择它。在顶部的工具栏上使用如 Ctrl、Alt 等按键帮助我们避免设备变砖——如果发生这种情况。另一个缺点是重置你的手机并删除所有应用和数据，所以要提前备份。从这个终端，鼠标指针可以拖动。虽然有点慢，你可能会遇到错误并可能同步。你也可以通过
    apt-get 安装 Xfce。然后在 VNC 窗口安装后，你就准备好了。在启动引导程序后，你也可以在 Play 商店安装兼容的发行版。最简单的方法是使用
    Linux Deploy (github.com/linux-deploy) 和 Linux Farm。两者都允许在 Android 设备内安装发行版。它们不是虚拟机，因为它们直接运行在
    SD 卡上并从终端访问根或使用 GUI。使用 Linux Deploy 易用的界面，可以安装并启动 Ubuntu 以及 Fedora 以及 Debian、Kali
    和 openSUSE——只需几次点击即可设置。尽管该应用本身目前处于 Alpha 测试阶段，你可能想在它准备好时尝试。然而，在这里我们关注更可靠的 Linux
    Deploy。启动应用会带你进入带有黑屏的


    ## 完整安装


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_28_3.png)


    29 | linuxuser.com


    ## 在 Linux Deploy 上运行发行版


    在 root 的 Android 设备上轻松安装选择的发行版


    - 01  Linux Deploy 并点击顶部的箭头图标访问设置。点击“Distribution”选择你想更改的发行版、版本和架构。

    - 02 向滚动设置并点击 root 环境。默认点击 SSH 和 GUI。设置宽度高度以适应屏幕（以后可以更改）。

    - 03 当所有设置完成后，点击 Install 开始安装。制作 img 文件后，所有安装过程将在屏幕显示。当你看到“end”时，发行版已准备好启动。点击
    Start。

    - 04 从终端访问发行版，使用任何应用（如果使用默认设置）登录到 android@your IP 地址。你现在可以从终端启动 Linux 命令。

    - 05 要使用 GUI，启动你的 VNC viewer。使用地址、端口和默认密码。连接后，桌面将会出现。如果你需要在 Linux Deploy 中更改设置，点击
    Stop 和 Start。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_29_0.png)


    并在 Linux Deploy 中更改 GUI 设置并重启发行版。虽然我们考虑使用 Linux Deploy，你可能会发现一些缺点。发行版没有原生环境快；在某些情况下，只需输入
    SSH 然后失败就是问题。如果在安装期间磁盘满遇到“fail to truncate”错误，我们发现减小镜像大小通常会有帮助，尽管如果空间有限则并不理想。


    ## 远程控制


    通过手机控制 PC


    使用 Android 设备配合 PC 的另一种方法是通过远程控制。VNC viewer 应用允许你从安装的桌面客户端访问手机。你可以控制设备、播放音乐和视频、移动鼠标并发送自定义命令。或者，Remote
    Launcher 应用通过运行虚拟桌面允许类似的访问。虽然没有 SSH 或 VNC 快，但两个应用都易于使用设备 IP 地址和顶部选项（参见使用 Linux
    Deploy）。点击箭头图标显示设置，你可以在其中选择安装哪个发行版。


    一旦通过 SSH 或 Wi-Fi 连接（如果你使用移动数据则不起作用），当看到“end”消息时，安装完成。如果你完成了，就准备好启动了。点击 Start 按钮启动
    Linux 发行版，服务器将可用。注意，你无法从 Linux Deploy 本身输入任何命令——你需要从 Termux 或 JuiceSSH 等 SSH 应用连接。然后你就可以从终端输入
    Linux 命令。


    要访问 GUI 和桌面环境，你需要使用像 VNC Viewer 这样的 VNC 应用。如果桌面有一些限制，只需


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_29_1.png)


    ## Magic touch


    虽然在手机上运行 Linux 发行版很棒，但使用鼠标和虚拟按钮导航可能会困难。你可能想使用 Magic touch。它不仅仅适用于 Ubuntu（免费），它是一个付费应用。它在你的设备上提供全屏版本的
    Ubuntu。与运行发行版的其他方法不同，它不是运行在虚拟环境中——相反，你将其作为独立应用安装在恢复分区中。


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_29_2.png)


