    # Nvidia 发布

    CUDA 6.5


    # 声称 ARMv8 支持将助力 HPC


    Nvidia 发布了最新版本的计算统一设备架构 (CUDA) 工具包，以在其 Project Developer Tegra K1 64位双核系统级芯片公开发售之前，支持最新的
    ARMv8 指令集。


    CUDA 6.5 旨在允许使用 GPU 硬件快速开发图形处理器并行工作负载，首次提供了对 64 位 ARMv8 指令集的支持。随着 Nvidia 计划推出
    64 位版本的 Tegra K1（该版本将包含 192 个 CUDA 处理核心，据称总计提供 300 gflops 的单浮点计算性能），此次发布时机非常恰当。


    ARM64 (ARMv8) 的优势在于低功耗、扩展数据中心和微服务，而 GPU 是为极速性能设计的。当我们将两者结合时，就得到了针对 HPC 高性能计算的有力解决方案，Nvidia
    的 Mark Harris 在 CUDA 6.5 发布会上表示：“ARM64 提供了能效，系统 GPU 为通往高吞吐、强大的计算性能提供了桥梁。”


    - CUDA 6.5 支持 Tegra K1 的 64 位 ARMv8 指令集


    开发者注册即可免费下载 CUDA 6.5，32 位 Jetson Tokyo 板售价 99.99 英镑（见第 83 页测评）。Nvidia 尚未提供 64
    位等效版本的发布日期。


