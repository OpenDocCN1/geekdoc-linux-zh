    ## 在你的 Android 设备上运行 Linux


    安装一个超便携版的 Linux


    特性


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_30_0.png)


    ## 为什么要这么做？


    在 Android 上运行 Linux 的主要优势：


    - 它既便携又方便。当你可以在手机上运行 Linux 时，就不需要随身携带笔记本电脑了。

    - 从终端访问命令行，并使用你所有喜爱的 Linux 工具。

    - 使用 VNC 运行桌面 GUI 和应用程序。

    - 获取数千个 Linux 应用程序；其中许多程序都比 Android 环境更强大、更舒适。

    - 这对于用户和软件开发人员特别有用，用于构建 ARM 软件，并进行实时访问。

    - 你可以在你的设备上运行 LAMP 服务器，运行 Web 应用程序。其配置相对简单。

    - 运行 Linux 的 Android 设备可以用于硬件项目，例如树莓派远程控制单元。

    - 在不影响你标准 Android 设备的前提下，获得运行 Linux 的所有好处，在一个设备上访问整个世界。


    相比于其他的 Linux Deploy，Kali 自带了一套基础桌面应用程序。


    > 虽然我们使用 Linux Deploy 取得了成功，但确实遇到了一些棘手的问题


    设备，你可以通过最快的方法与 Android 进行双启动。

    尽管官方上，Ubuntu Touch 仅支持三星 Galaxy 和 Google 设备。如果你想在其他设备上运行它，请查看我们的网站获取更多详情：https://wiki.ubuntu.com/Devices/


    如果你已经解锁了设备并获取了 root 权限，安装它会出奇地简单。只需下载 Ubuntu 安装程序 ZIP 文件（bitly/to/）并将其移动到 SD 卡中。重启手机，然后按住电源和音量键，直到看到带有大启动字样的绿色屏幕。使用音量减键进入恢复模式并松开电源键。


    现在你可以从 SD 卡（在 /directory 中）安装 Ubuntu 安装程序了。重启设备，你理应该在应用菜单中看到 Ubuntu 双启动了。你可以从未知源安装应用（设置>
    安全）。现在点击该应用，然后点击“选择安装”来选择一个 Ubuntu 版本。你需要等待一段时间让应用下载并安装。


    完成后，点击“重启到 Ubuntu”以启动 Ubuntu Touch。

    手势导航系统非常易用：从左边缘向滑动打开菜单，从顶部滑动打开快速设置面板以及更多选项。可以通过终端应用输入命令。注意，需要几秒钟（取决于设备），但它是可用的，并让你对完成后的系统有一个良好的预览。


    要返回 Android，只需按住电源键启动它。重启 Touch，然后打开 Ubuntu 双启动应用。如果仍然存在，你也可以从设置中卸载它。

    正如我们所演示的，有许多方法可以在你的 Android 设备上安装 Linux，每种方法都有优缺点。一旦安装，你可以用它做很多事情——查看右侧的“为什么不？”框获取一些灵感。所以，为什么不在你的手机上安装
    Linux 并随身带去任何地方呢？


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_30_1.png)


    没错，在已 root 的设备上使用 Ubuntu Boot 应用可以很容易安装 Ubuntu Touch


    ![](img/bab7f65683e8ebca10d1e8aa808ba7ff_30_2.png)


