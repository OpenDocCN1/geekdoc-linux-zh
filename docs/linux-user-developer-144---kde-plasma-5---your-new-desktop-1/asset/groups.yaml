    OPEN SOURCE


    # DEVELOPMENT


    # Kernel adopts two-factor authentication


    YubiKeys used to protect Git repository


    The official Git repository for Linux kernel has moved to a two-factor authentication
    system to protect the source code.


    Currently, the Git repositories require that maintainers and contributors use
    SSH keys to authenticate with. Concerns over the possibility of said keys finding
    their way into malicious hands, have resulted in the adoption of a two-factor
    authentication system by the popular YubiKey tokens distributed free to active
    participants.


    We wanted to further tighten our access requirements, without causing undue inconvenience.
    We needed a solution that would allow everyone to enroll their devices and do
    most token operations on their devices,” says Konstantin Rabitz. “At the time,
    both the mainline and stable Linux kernel repositories are already protected by
    requiring two-factor authentication before git push.


    We are hoping that many more [developers] will choose to turn on two-factor authentication
    on their own hosts at kernel.org,” he added, “which will make it much more difficult
    for an attacker to sneak in a malicious commit.”


    +   The maine and stable repos require two-factor authentication dongles


