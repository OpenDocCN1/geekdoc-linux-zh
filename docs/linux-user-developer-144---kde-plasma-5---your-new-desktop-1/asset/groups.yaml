    # 内核采用双重身份验证


    使用 YubiKey 保护 Git 仓库


    Linux 内核的官方 Git 仓库已迁移到双重身份验证系统以保护源代码。


    目前，Git 仓库要求维护者和贡献者使用 SSH 密钥进行身份验证。由于担心这些密钥可能落入恶意分子之手，对于向活跃参与者免费分发的流行的 YubiKey
    令牌，已采用了双重身份验证系统。


    “我们希望进一步收紧访问要求，同时避免造成不必要的不便。我们需要一种能让大家注册自己的设备并在其设备上完成大多数令牌操作的解决方案，”Konstantin
    Rabitz 说。“在当时，主线和稳定版 Linux 内核仓库已经受到保护，在 git push 之前需要双重身份验证。”


    “我们希望更多的[开发者]会在 kernel.org 上在自己的主机上开启双重身份验证，”他补充道，“这将使得攻击者植入恶意提交变得困难得多。”


    - 主线和稳定版仓库需要双重身份验证令牌


