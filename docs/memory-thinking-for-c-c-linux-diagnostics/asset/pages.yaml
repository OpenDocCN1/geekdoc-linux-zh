- img_proc: true
  md: '# Pointer


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_35_0.png)


    Conceptually, a pointer is an entity that refers (or points) to some other entity.
    We say entity, not an object, so as not to confuse it with objects in C++ or objects
    in object-oriented programming. This can be my finger, for example, pointing to
    an apple.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Pointer Dereference


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_36_0.png)


    A pointer dereference is an act of getting the entity it references for further
    inspection or usage. Imagine I point to an apple, and you grab it to eat.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Many to One


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_37_0.png)


    Several pointers can refer (or point) to the same entity. For example, two people
    are pointing to the same apple. So, conceptually, pointers are distinct from entities
    they point to. Should we call the latter pointees?'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Many to One Dereference


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_38_0.png)


    Of course, if you dereference the same object, you get the same object. If someone
    else grabs an apple, I point to, at the same time as you do, both get the same
    apple.'
  merge: -1
  pgno: 38
