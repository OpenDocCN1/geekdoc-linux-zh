  md: '# Which C & C++?


    +   * C

    * C++ as a better C

    * Proper C++ (legacy and modern)

    * Linux specifics


    Which C and C++? We look at a unified presentation approach combining all C and
    C++ variants. Since this course is about diagnostics and not designing and and
    implementing code, we do not make distinctions. It is not possible to cover all
    the differences in the short time that we have. We also describe things as they
    are in Linux programming (and narrowly from a Linux system programming perspective),
    not as they ought to be from the latest C++ standards.'
  merge: -1
