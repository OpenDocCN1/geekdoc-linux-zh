  md: '# Pointer to Pointer Dereference


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_43_0.png)


    When we dereference the first pointer, we get an entity, another pointer, which
    we can also dereference to get the underlying entity. You point to me, but an
    alien snatches me with an apple I point to. Inside a ship, another alien takes
