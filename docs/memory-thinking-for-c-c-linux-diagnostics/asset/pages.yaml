  md: '# A64 CPU Registers


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_189_0.png)


    There are 31 general registers from X0 and X30, with some delegated to specific
    tasks such as intra-procedure calls (X16, XIP0, and X17, XIP1), addressing stack
    frames (Frame Pointer, FP, X29) and return addresses, the so-called Link Register
    (LR, X30). When you call a function, the return address of a caller is saved in
    LR, not as in Intel/AMD x64. The return instruction in a callee uses the address
    in LR to assign it to PC and resume execution. But if a callee calls other functions,
    the current LR needs to be manually saved somewhere, usually on the stack. There''s
    Stack Pointer, SP, of course. To get zero values, there''s the so-called Zero
    Register, XZR. All X registers are 64-bit, and 32-bit lower parts are addressed
    via the W prefix. Next, we briefly look at some aspects related to our exercises.'
  merge: -1
