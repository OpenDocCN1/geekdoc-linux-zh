  md: '# My History of C & C++


    # My History of C & C++


    +   - C from 1987 and C++ from 1989 (Old CV)

    - C++ as a better C from 1991

    - Implicit design patterns in 1994-1995

    - C++ as proper C++ from 2000

    - Explicit design patterns in 2000

    - C++98/03/STL from 2001

    - BSD dump analysis from 2012

    - Linux core dump analysis from 2015

    - [..

    - C++11/14 from 2016

    - C++17 from 2017

    - Functional programming from 2020

    - Linux system programming since 2022

    - C++20 from 2023


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_30_0.png)


    This history slide is only about C and C++ languages. Despite many years, it is
    still easy to recall when I started learning C. It was shortly after I started
    my university education. And although my first programming language was FORTRAN,
    I read the classic K&R book in a library. C++ is harder to recall, but most likely,
    it was in 1989, least according to my old CV, which is the source of truth. I
    definitely started using C++ in commercial projects around 1991 but used it as
    a better C, and there was no standard template library (STL) at that time. I recall
    some fascinating C++ GUI frameworks for MS-DOS, like Zinc. In 1994-1995, I designed
    a word processor, and in the process, I implicitly many design patterns later
    discovered in the GOF book of 2000. The authors also use a word processor for
    illustration. I mainly understand C++ as C++ in 2000 when I read a book about
    CORBA distributed object technology that used C++. I continued learning C++ by
    reading many books of that time and learned the merits of using STL and also how
    to use it effectively. In 2001, I joined a company that developed C++ static analysis
    tools, and this greatly improved my C++ knowledge up the expert at'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'that time. C++03 didn''t have major changes compared to C++98, and this is
    why I included it with C++98 for the year 2001. In 2003, things turned out unexpectedly
    as I moved from full-time development using C++ to full-time memory dump analysis
    of C++ programs with Mac OS X core dump analysis of user space (BSD) in 2012 and
    Linux user space core dump analysis in 2015. I continued using C++03 for writing
    diagnostic tools, though. In 2016, I learned that the language completely changed
    to C++11/14. I came back to full-time C++ programming in late 2017, where I also
    started using language features from C++17. In 2020, I moved to functional programming
    in Scala, which also influenced my C++ coding for new projects. Now, I have started
