  md: "# Synchronization Solution\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_254_0.png)\n\
    \n```\nstd::atomic<long> counter{0};\n\nstd::mutex m;\n\nvoid threadProcCpp(std::string\
    \ msg) {\n    while (true) {\n        std::scoped_lock lock {m};\n        std::cout\
    \ << msg << \": \" << ++counter << std::endl;\n    }\n}\n\nvoid foo() {\n    std::jthread\
    \ thread1(threadProcCpp, \"Hello1\");\n    std::jthread thread2(threadProcCpp,\
    \ \"Hello2\");\n}\n```\n\nThe following code example solves the data race problem\
    \ by guarding access via scoped_lock that is implemented using mutex:\n\n```\n\
    std::atomic<long> counter{0};\nstd::mutex m;\nvoid threadProcCpp(std::string msg)\
    \ {\n    while (true) {\n        std::scoped_lock lock {m};\n        std::cout\
    \ << msg << \": \" << ++counter << std::endl;\n    }\n}\nvoid foo() {\n    std::jthread\
    \ thread1(threadProcCpp, \"Hello1\");\n    std::jthread thread2(threadProcCpp,\
    \ \"Hello2\");\n}\n```"
