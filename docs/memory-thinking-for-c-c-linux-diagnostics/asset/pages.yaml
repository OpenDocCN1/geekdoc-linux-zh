- img_proc: true
  md: '# VPTR and Struct Memory Layout


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_220_0.png)


    Every object whose structure has virtual methods has an implicit virtual function
    pointer (_vptr) as its first member containing an address of the corresponding
    structure virtual functions table. Therefore, each virtual function call from
    a base structure pointer is a type-independent call where the target function
    address is easily calculated based on the address of the virtual function table
    and virtual function offset.


    The code examples corresponding to the memory diagram:


    ```

    Base *pMyBase = &myBase;

    pMyBase->vmethod2();


    pMyBase = &myDerived;

    pMyBase->vmethod2();

    ```'
