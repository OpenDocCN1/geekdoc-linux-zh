    ```

    Dynamic Allocation (C-style)


    * Persistent across function calls

    * (m|c|re)alloc

    * free

    * Can be replaced

    ```


    There are some advantages to a dynamic memory allocation compared to a local stack
    allocation. The allocated memory and its values persist across function calls.
    Since allocations are implemented by library calls, they can be replaced with
    other libraries and custom code that provides debugging capabilities for tracking
    memory allocations and deallocations, as well as other checks.'
