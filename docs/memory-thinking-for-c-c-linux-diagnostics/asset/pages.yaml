  md: '# x64 CPU Registers


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_181_0.png)


    There are familiar 32-bit CPU register names, such as EAX, that are extended to
    64-bit names, such as RAX. Most of them are traditionally specialized, such as
    ALU, counter, and memory copy registers. Although, now they all can be used as
    general-purpose registers. There is, of course, a stack pointer, RSP, and, additionally,
    a frame pointer, RBP, which is used to address local variables and saved parameters.
    In some compiler code generation implementations, RBP is also used as a general-purpose
    register, with RSP taking the role of a frame pointer. An instruction pointer
    RIP is saved in the stack memory region with every function call, then restored
    on return from the called function. In addition, the x64 platform features another
    eight general-purpose registers, from R8 to R15.'
  merge: -1
