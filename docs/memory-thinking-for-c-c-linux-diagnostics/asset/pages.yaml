  md: '# Basic Design


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_242_0.png)


    +   * A structure with operators mimicking pointer behavior such as dereferencing

    * Encapsulates raw pointers

    * Restricts undesirable behavior

    * Contains reference count that tracks copies

    * Provides a destructor to release memory if the reference count becomes 0


    A smart pointer should include functionality similar to raw pointers for seamless
    use during the refactoring of legacy code and simultaneously eliminate most, if
    not all, problems with raw pointer usage.'
