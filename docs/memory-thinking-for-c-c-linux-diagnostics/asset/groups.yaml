    \ (int *)\np = reinterpret_cast<int>();\n```\n\n# 强制转换\n\n```cpp\nstruct A\n{\n\
    \    unsigned int u1;\n    unsigned int u2;\n};\nstruct B\n{\n    unsigned long\
    \ ul;\n} b;\n\nA a = reinterpret_cast<A>(b);\n\na = *(A*)&b;\n```\n\n不同的结构通过 C++\
    \ 重新解释是不兼容的。但我们可以将源结构指针重新解释为目标结构指针并进行解引用。在这种情况下，底层内存单元被重新解释为目标结构的值。查看关于结构的后续章节：\n\
    \n```cpp\nstruct A\n{\n    unsigned int u1;\n    unsigned int u2;\n};\nstruct\
    \ B\n{\n    unsigned long ul;\n} b;\n\nA a = reinterpret_cast<A>(b);\na = *(A*)&b;\n\
    a = *reinterpret_cast<A*>(&b);\n```\n\n# 结构、类和对象\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_82_0.png)\n\
    \n现在我们涵盖了结构、类以及它们的对象。\n\n# 结构\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_83_0.png)\n\
    \n我们可以将结构视为在内存中布局的字段集合。结构可以命名，也可以像右侧所示是匿名的。\n\n代码示例：\n\n```cpp\nstruct MyStruct\
    \ {\n    int field;\n    // ...\n}\nstruct MyStruct myStruct;\nMyStruct myStruct2;\n\
    struct MyStruct *pMyStruct;\nMyStruct *pMyStruct2;\nstruct {\n    int field;\n\
    \    // ...\n} myOtherStruct;\n```\n\n# 访问级别\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_84_0.png)\n\
    \n带有 `private` 访问修饰符的字段无法从外部引用。\n\n代码示例：\n\n```cpp\nstruct MyStruct {\n// public:\n\
    \  int field1;\nprivate:\n  int field2;\n} myStruct;\n\nmyStruct.field1 = 1;\n\
    myStruct.field2 = 2;\n```\n\n# 类和对象\n\n```cpp\nclass MyClass {\n    int field;\n\
    \    // ...\n}\n\nclass MyClass myClass;\nMyClass myClass2;\n\nclass MyClass *pMyClass;\n\
    MyClass *pMyClass2;\nclass {\n    int field;\n    // ...\n} myObjectClass;\n```\n\
    \n类具有相同的结构。\n\n代码示例：\n\n```cpp\nclass MyClass {\n    int field;\n    // ...\n\
    }\nclass MyClass myClass;\nMyClass myClass2;\nclass MyClass *pMyClass;\nMyClass\
    \ *pMyClass2;\nclass {\n    int field;\n    // ...\n} myObjectClass;\n```\n\n\
    # 结构和类\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_86_0.png)\n\n结构和类在 C++ 中完全相同，可以互换使用。这就是为什么你总能在优秀的\
    \ C++ 书中看到 `struct`。唯一的区别（如果我们现在忽略继承的话）是字段访问，结构在默认情况下是 `public` 的，而类是 `private`\
    \ 的。\n\n代码示例：\n\n```cpp\nstruct tagStruct      class tagClass\n{             \
    \         {\n// public:               public: // (private:)\nint field;      \
    \       int field;\n// ...                  // ...\n};                     };\n\
    ```\n\n# 结构指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_87_0.png)\n\n在这里，我们再次通过指针的概念图示，并用\
    \ C 和 C++ 代码进行注释。\n\n代码示例：\n\n```cpp\nMyStruct *pMyStruct = &myStruct;\n```\n\n\
    # 结构指针解引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_88_0.png)\n\n在这里，我们解引用某个结构体的指针。我们得到结构的值并将其赋值给\
    \ `myStruct` 变量。\n\n代码示例：\n\n```cpp\nMyStruct myStruct = *pMyStruct;\n```\n\n\
    # 多个指针指向同一个结构\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_89_0.png)\n\n在这里，我们将一个指针的值赋值另一个指针，它们现在都指向同一个结构。\n\
    \n代码示例：\n\n```cpp\nMyStruct *pMyStruct = &myStruct;\nMyStruct *pMyStruct2 = pMyStruct;\n\
    ```\n\n# 多对一解引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_90_0.png)\n\n如果我们对两者进行解引用，我们将得到相同地址的相同。\n\
    \n代码示例：\n\n```cpp\nassert(&pMyStruct == &pMyStruct2);\n```\n\n"
