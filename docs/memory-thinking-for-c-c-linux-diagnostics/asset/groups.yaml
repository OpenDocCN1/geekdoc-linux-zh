    Finally, the RAII idiom is specifically about managing resources, including memory,'
  - "[PAGE 247]\n\n# RAII Definition\n\n```\nstruct Resource {\n  Resource Acquisition\
    \ Is Initialization\n  Resource() {\n    // acquire resource, e.g., new\n    //\
    \ initialize resource, e.g., set memory values to 0\n  }\n  Includes resource\
    \ release\n  ~Resource() {\n    // release resource, e.g., delete\n  }\n}\n```\n\
    \nAn RAII structure encapsulates simultaneous “atomic” resource acquisition and\
    \ initialization in its constructors and includes resource release logic in its\
    \ destructor.\n\nThe code example:\n\n```\nstruct Resource {\n  Resource() {\n\
    \    // acquire resource, e.g., new\n    // initialize resource, e.g., set memory\
    \ values to 0\n  }\n  ~Resource() {\n    // release resource, e.g., delete\n \
    \ }\n}\n```"
  - "[PAGE 248]\n\n# RAII Advantages\n\n```\nRAII Advantages\n\n* Resource safety\n\
    \nvoid foo { Resource r; }\n\n* Resource life-cycle predictability\n\n* Exception\
    \ safety\n\ntry {\n    Resource r;\n    throw -1;\n} catch (...) {\n}\n```\n\n\
    There are several advantages to using the RAII idiom. When going out of scope,\
    \ it automatically releases a resource due to a called destructor:\n\n# void foo\
    \ { Resource r;\n\nIn the presence of exceptions, the destructor releases the\
    \ acquired resource automatically. All these contribute to the predictable resource\
    \ life cycle.\n\n```\ntry {\n    Resource r;\n    throw -1;\n} catch (...) {\n\
    }\n```"
