    \ *pMyBase = &MyDerived;\npMyBase->method(0);\n```"
- md: "\n```cpp\npMyBase->vmethod(0);\npMyBase->Base::vmethod(0);\n```\n\n## Structure\
    \ Pure Virtual Methods\n\nIf we want to make sure we never define objects of the\
    \ base type and make sure we override all virtual methods in the derived type,\
    \ we can make the virtual functions pure by using 0.\n\nThe code example:\n\n\
    ```cpp\nstruct Base\n{\n    int method (int i) { return i; }\n    virtual int\
    \ vmethod (int i) = 0;\n}\nstruct Derived : Base\n{\n    int method (int i) {\
    \ return ++i; }\n    virtual int vmethod (int i) override { return ++i; }\n} myDerived;\n\
    Base *pMyBase = &myDerived;\npMyBase->vmethod(0);\n```\n\n## Structure as Interface\n\
    \nPure virtual functions allow specifying abstract interfaces the derived types\
    \ have to implement.\n\nThe code example:\n\n```cpp\nstruct Interface {\n    virtual\
    \ int vmethod1 (int i) = 0;\n    virtual int vmethod2 (int i) = 0;\n}\nstruct\
    \ Implementer : Interface {\n    virtual int vmethod1 (int i) override { return\
    \ ++i; }\n    virtual int vmethod2 (int i) override { return ++i; }\n} myObject;\n\
    \nInterface *pIFace = &myObject;\npIFace->vmethod1(0);\n```\n\n## Function Structure\n\
    \n```cpp\nstruct MyFunction\n{\n    int field{1};\n    int operator() { return\
    \ field; }\n} myFunction;\n\nmyFunction();\n```\n\nFunctions may also encapsulate\
    \ state. The best way to do it is via structures that implement function call\
    \ operators.\n\nThe code example:\n\n```cpp\nstruct MyFunction\n{\n    int field{1};\n\
    \    int operator() { return field; }\n} myFunction;\n\nmyFunction();\n```\n\n\
    ## Structure Constructors\n\n```cpp\nstruct MyFunction\n{\n    MyFunction(): field{1}\
    \ {}\n    MyFunction(int _field): field{field} {}\n    int field;\n    int operator()\
    \ { return field; }\n} myFunction, myFunction2(2);\n\nmyFunction();\nmyFunction2();\n\
    ```\n\nNow, we come to traditional OOP topics in classic C++. Constructors are\
    \ methods with or without arguments for structure initialization with custom initialization\
    \ logic inside, for example, acquiring required resources.\n\nThe code example:\n\
    \n```cpp\nstruct MyFunction\n{\n    MyFunction(): field{1} {}\n    MyFunction(int\
    \ _field): field{field} {}\n    int field;\n    int operator() { return field;\
    \ }\n} myFunction, myFunction2(2);\n\nmyFunction();\nmyFunction2();\n```\n\n##\
    \ Structure Copy Constructor\n\n```cpp\nstruct MyFunction\n{\n    MyFunction():\
    \ field{1} { }\n    MyFunction(int _field): field{_field} { }\n    MyFunction(const\
    \ MyFunction& src):\n        field(src.field) { ++field; }\n    int field;\n \
    \   int operator() { return field; }\n} myFunction;\n\nMyFunction myFunction2(myFunction);\n\
    MyFunction myFunction3 = myFunction;\n```\n\nWhen we copy objects but need complex\
    \ copying logic or nontrivial memory management copy constructor methods are quite\
    \ handy. We pass the source object reference as const if we don't plan to modify\
    \ it.\n\nThe code code example:\n\n```cpp\nstruct MyFunction\n{\n    MyFunction():\
    \ field{1} { }\n    MyFunction(int _field): field{_field} { }\n    MyFunction(const\
    \ MyFunction& src):\n        field(src.field) { ++field; }\n    int field;\n \
    \   int operator() { return field; }\n} myFunction;\n\nMyFunction myFunction2(myFunction);\n\
    MyFunction myFunction3 = myFunction;\n```\n\n## Structure Copy Assignment\n\n\
    In case of nontrivial reassignments, we can implement an assignment operator.\
    \ We, however, must be careful not to copy to itself (this), and we return the\
    \ non-const reference to itself (this) to allow chained copies.\n\n```cpp\nstruct\
    \ MyFunction\n{\n    MyFunction(): field{1} { }\n    MyFunction(int _field): field{_field}\
    \ { }\n    MyFunction(const MyFunction& src):\n        field(src.field); ++field;\
    \ }\n    MyFunction& operator=(const MyFunction& src) {\n        if (this != &src)\
    \ { field = src.field; }\n        return *this;\n    }\n\n    int field;\n   \
    \ int operator() { return field; }\n} myFunction;\n\nMyFunction myFunction2;\n\
    myFunction2 = myFunction;\n```\n\n## Structure Destructor\n\n```cpp\nstruct MyFunction\n\
    {\n    MyFunction(): field{1} { }\n    ~MyFunction() {\n        // Destructor\
    \ logic\n    }\n    MyFunction(const MyFunction& src):\n        field(src.field)\
    \ { ++field; }\n    int field;\n    int operator() { return field; }\n} myFunction;\n\
    ```\n\nWhen we copy objects but need complex copying logic or nontrivial memory\
    \ management copy constructor methods are quite handy. We pass the source object\
    \ reference as const if we don't plan to modify it.\n"
  mdcn: "\n\n```cpp\npMyBase->vmethod(0);\npMyBase->Base::vmethod(0);\n```\n\n## 结构体纯虚方法\n\
    \n如果我们想确保永远不定义基类型的对象，并确保派生类型重写了所有虚方法，可以使用 `0` 将虚函数变为纯虚函数。\n\n代码示例：\n\n```cpp\n\
    struct Base\n{\n    int method (int i) { return i; }\n    virtual int vmethod\
    \ (int i) = 0;\n}\nstruct Derived : Base\n{\n    int method (int i) { return ++i;\
    \ }\n    virtual int vmethod (int i) override { return ++i; }\n} myDerived;\n\
    Base *pMyBase = &myDerived;\npMyBase->vmethod(0);\n```\n\n## 结构体接口\n\n纯虚函数允许指定派生类型必须实现的抽象接口。\n\
    \n代码示例：\n\n```cpp\nstruct Interface {\n    virtual int vmethod1 (int i) = 0;\n\
    \    virtual int vmethod2 (int i) = 0;\n}\nstruct Implementer : Interface {\n\
    \    virtual int vmethod1 (int i) override { return ++i; }\n    virtual int vmethod2\
    \ (int i) override { return ++i; }\n} myObject;\n\nInterface *pIFace = &myObject;\n\
    pIFace->vmethod1(0);\n```\n\n## 函数结构体\n\n```cpp\nstruct MyFunction\n{\n    int\
    \ field{1};\n    int operator() { return field; }\n} myFunction;\n\nmyFunction();\n\
    ```\n\n函数也可以封装状态。实现此点的最佳方法是通过实现函数调用运算符的结构体。\n\n代码示例：\n\n```cpp\nstruct MyFunction\n\
    {\n    int field{1};\n    int operator() { return field; }\n} myFunction;\n\n\
    myFunction();\n```\n\n## 结构体构造函数\n\n```cpp\nstruct MyFunction\n{\n    MyFunction():\
    \ field{1} {}\n    MyFunction(int _field): field{field} {}\n    int field;\n \
    \   int operator() { return field; }\n} myFunction, myFunction2(2);\n\nmyFunction();\n\
    myFunction2();\n```\n\n现在，我们来看经典 C++ 中传统的 OOP 主题。构造函数是带有或不带参数的成员，用于结构体的初始化，并在包含自定义的初始化逻辑，例如获取所需的资源。\n\
    \n代码示例：\n\n```cpp\nstruct MyFunction\n{\n    MyFunction(): field{1} {}\n    MyFunction(int\
    \ _field): field{field} {}\n    int field;\n    int operator() { return field;\
    \ }\n} myFunction, myFunction2(2);\n\nmyFunction();\nmyFunction2();\n```\n\n##\
    \ 结构体拷贝构造函数\n\n```cpp\nstruct MyFunction\n{\n    MyFunction(): field{1} { }\n\
    \    MyFunction(int _field): field{_field} { }\n    MyFunction(const MyFunction&\
    \ src):\n        field(src.field) { ++field; }\n    int field;\n    int operator()\
    \ { return field; }\n} myFunction;\n\nMyFunction myFunction2(myFunction);\nMyFunction\
    \ myFunction3 = myFunction;\n```\n\n当我们复制对象但需要复杂的拷贝逻辑或非平凡的内存管理时，拷贝构造函数非常好用。如果我们不修改源对象，则以\
    \ `const` 传递源对象的引用。\n\n代码示例：\n\n```cpp\nstruct MyFunction\n{\n    MyFunction():\
    \ field{1} { }\n    MyFunction(int _field): field{_field} { }\n    MyFunction(const\
    \ MyFunction& src):\n        field(src.field) { ++field; }\n    int field;\n \
    \   int operator() { return field; }\n} myFunction;\n\nMyFunction myFunction2(myFunction);\n\
    MyFunction myFunction3 = myFunction;\n```\n\n## 结构体拷贝赋值\n\n在发生非平凡重新赋值的情况下，我们可以实现一个赋值运算符。然而，我们必须小心不要拷贝到自身（this），并返回自身的非\
    \ const 引用（this）以允许链链式拷贝。\n\n```cpp\nstruct MyFunction\n{\n    MyFunction(): field{1}\
    \ { }\n    MyFunction(int _field): field{_field} { }\n    MyFunction(const MyFunction&\
    \ src):\n        field(src.field); ++field; }\n    MyFunction& operator=(const\
    \ MyFunction& src) {\n        if (this != &src) { field = src.field; }\n     \
    \   return *this;\n    }\n\n    int field;\n    int operator() { return field;\
    \ }\n} myFunction;\n\nMyFunction myFunction2;\nmyFunction2 = myFunction;\n```\n\
    \n## 结构体析构函数\n\n```cpp\nstruct MyFunction\n{\n    MyFunction(): field{1} { }\n\
    \    ~MyFunction() {\n        // 析构逻辑\n    }\n    MyFunction(const MyFunction&\
    \ src):\n        field(src.field) { ++field; }\n    int field;\n    int operator()\
    \ { return field; }\n} myFunction;\n```\n\n当我们复制对象但需要复杂的拷贝逻辑或非平凡的内存管理时，拷贝构造函数非常好用。如果我们不修改源对象，则以\
    \ `const` 传递源对象的引用。\n\n"
