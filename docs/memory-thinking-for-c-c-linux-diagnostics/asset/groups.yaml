    # 关于作者


    Dmitry Vostikov 是一位国际认可的专家、演讲者、教育者、科学家、发明家和作家。他创立了面向模式的软件诊断、取证和预测学科（系统化软件诊断）以及软件诊断学院（DA+TA:DumpAnalysis.org
    + TraceAnalysis.org）。Vostikov 还编写了 50 多本关于软件诊断、异常检测与分析、软件与内存取证、根因分析与问题解决、内存转储分析分析、软件追踪与日志分析、逆向工程以及恶意软件分析的著作。他在多个行业的软件架构、设计、开发和维护方面拥有超过
    25 年的经验，并担任过领导、技术和人员管理职务。Dmitry 还创立了 Systematix.io、BriteTrace、Analog.io、DiaThings、Loglett、OpenTask
    迭代与增量发布（OpenTask.com）、软件诊断技术与服务（原 Memory Dump Analysis Services）、PatternDiagnostics.com
    以及软件预测。在空余时间，他在 Debugging.TV 上介绍各种调试主题，并探索软件叙事学（Software Narratology）、其进一步发展——万物叙事学与万物诊断（DoT）、软件病理学（Software
    Pathology）以及量子软件诊断。他目前感兴趣的领域是理论软件诊断及其数学和计算机科学基础、形式逻辑、人工智能、机器学习和数据挖掘在诊断和异常检测中的应用、软件诊断工程和诊断驱动开发、诊断工作流与交互。最近的领域还包括云原生计算、安全、自动化、函数式编程、范畴论在软件开发和大数据中的应用以及人工智能诊断。


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_16_0.png)


    # 引言


    原始课程名称


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_17_0.png)


    # 先决条件


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_18_0.png)


    为了从本次培训中获益最大化，预计你已经具备某一种除 C 或 C++ 以外的编程语言的基础开发经验，并可选具备基础的内存转储分析经验。我还针对某些主题包含了必要的
    x64 和 A64 反汇编回顾。


    # 培训目标


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_19_0.png)


    我们的首要目标是以加速的方式学习 C、C++ 及其内部机制。首先，我们回顾软件诊断所需的常用 C 和 C++ 基础。然后，我们将重点关注内存和内部机制，学习各种
    C++ 特性。我们还将看到 C 和 C++ 知识如何帮助诊断和调试的示例。


    培训原则


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_20_0.png)


    有许多可以考虑的培训格式，我认为最好的方法是集中在幻灯片和你可以验证的代码示例上。


    # 安排


    ```

    std::vector<Session> sessions;

    assert(sessions.size() == 5);

    assert(sessions.capacity() > 5);

    ```


    我计划培训仅分为 5 节，每节 2 小时，但如有必要，为了足够的细节涵盖所有必要材料，可能会增加节数。


    # 培训理念


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_22_0.png)


    创建一个类似的基于 Windows 的培训后，将其移植到 Linux 是自然而然的。此外，核心储分析和逆向工程课程的学员问了关于 C 和 C++ 的问题，我意识到他们如果接受这项培训将会受益。这项培训也可以填补这些课程之间的某些空白。最后，我最近开发了加速
    Linux API 培训课程（参见书末的参考文献部分），该课程假设具备经典 C 和 C++ 的固体知识，而目前的 C 和 C++ 课程可能提供此类知识。


