  - "[PAGE 101]\n\n# Structure Inheritance\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_101_0.png)\n\
    \nStructures can inherit fields from other structures. In case of the same field\
    \ names, the derived structure hides the base structure fields, but they can be\
    \ accessed by explicit base structure name qualification:\n\n```\nstruct Base\
    \ {\n  int field;\n};\nstruct Derived : Base {\n  int field;\n  int field2;\n\
    } myDerived;\nmyDerived.field;\nmyDerived.Base::field;\nBase *pMyBase = &myDerived;\n\
    pMyBase->field;\n```"
  - "[PAGE 102]\n\n# Structure Slicing\n\n```\nstruct Base\n{\n    int field;\n};\n\
    struct Derived : Base\n{\n    int field2;\n    myDerived { 0 };\n};\nnBase myBase\
    \ = myDerived;\nmyDerived = myBase;\nmyDerived = static_cast<Derived>(myBase);\n\
    \nBase *pMyBase = &myDerived;\nDerived *pMyDerived = pMyBase;\n\nDerived *pMyDerived\
    \ = static_cast<Derived>*(pMyBase);\n```\n\nIt is possible to copy a derived structure\
    \ to a base structure variable, but in this case, the former contents are sliced\
    \ since the base structure occupies less memory. The other way around, from the\
    \ base structure to the derived, is forbidden by default because the compiler\
    \ doesn't know how to fill the new-derived fields. However, this can be forced\
    \ with a static cast where the derived fields are filled with the existing adjacent\
    \ memory content, which can be completely random. The same downcast can be done\
    \ between pointers, but when we try to dereference a target pointer to the derived\
    \ structure later, we may get random data.\n\nThe code example:\n\n```\nstruct\
    \ Base\n{\n    int field;\n};\n```"
  - "[PAGE 103]\n\n```\nstruct Derived : Base {\n    int field2;\n} myDerived { 0\
    \ };\n\nBase myBase = myDerived;\nmyDerived = myBase;\nmyDerived = static_cast<Derived>(myBase);\n\
    \nBase *pMyBase = &myDerived;\nDerived *pMyDerived = pMyBase;\nDerived *pMyDerived\
    \ = static_cast<Derived*>(pMyBase);\n```"
  - "[PAGE 104]\n\n# Inheritance Access Level\n\n```\nstruct Base\n{\n    int field;\n\
    }\n\nstruct Derived : private Base\n{\n    int field;\n    int field2;\n} myDerived;\n\
    \nmyDerived.field;\nmyDerived.Base::field;\n\nBase *pMyBase = &myDerived;\npMyBase->field;\n\
    ```\n\nIt is possible to inherit privately. In such a case, the base structure\
    \ fields are inaccessible from the outside, even with the explicit qualification.\n\
    \nThe code example:\n\n```\nstruct Base\n{\n    int field;\n}\n\nstruct Derived\
    \ : private Derived\n{\n    int field;\n    int field2;\n} myDerived;\n\nmyDerived.field;\n\
    myDerived.Base::field;\n\nBase *pMyBase = &myDerived;\npMyBase->field;\n```"
  - "[PAGE 105]\n\n# Structures and Classes II\n\n```\nstruct ==* class\n\nstruct\
    \ Base {\n  // public:\n  int field;\n}\nclass Base {\n  public:\n  int field;\n\
    }\nstruct Derived : Base // (public) =\nclass Derived : public Base // (private)\
    \ {\n  // ...\n}\n```\n\nAgain, structures and classes are almost equivalent except\
    \ for the default inheritance access (and field access), which is, by default,\
    \ public for structures and private for classes. Public access needs to be specified\
    \ explicitly in this training, which is not really relevant for memory thinking\
    \ when looking at built code.\n\nThe code example:\n\n```\nstruct Base {\n  //\
    \ public:\n  int field;\n}\nclass Base {\n  public:\n  int field;\n}\nstruct Derived\
    \ : Base // (public)\n  // ...\n}\nclass Derived : public Base // (private)\n\
    \  // ...\n}\n```"
- md: "\n# Internal Structure Alignment\n\n```cpp\nstruct Struct {\n    bool field1;\n\
    \    short field2;\n    long field3;\n} myStruct;\n\n(gdb) ptype a / Struct\n\
    /** offset      | size */  | type = struct {\n    bool field1;\n/** XXX 1-byte\
    \ hole */| 1 *//\n    short field2;\n/** XXX 4-byte hole */| 0 *//\n    long field3;\n\
    } /* total size (bytes): 16 */\n\n#pragma pack(1)\nstruct StructPacked {\n   \
    \ bool field1;\n    short field2;\n    long field4;\n} myStructPacked;\n\n(gdb)\
    \ ptype o / StructPacked\n/** offset      | size */  | type = struct StructPacked\
    \ {\n    bool field1;\n/** 0 | 1 *//\n    short field2;\n/** 1 | 2 *//\n    long\
    \ field4;\n/** 3 | 0 *//\n} /* total size (bytes): 11 */\n```\n\nFields may be\
    \ aligned according to their default type alignment, which may introduce gaps,\
    \ increasing the overall structure size.\n\nThe code example corresponding to\
    \ the GDB output:\n\n```cpp\nstruct Struct {\n    bool field1;\n    short field2;\n\
    \    long field3;\n} myStruct;\n\n#pragma pack(1)\nstruct StructPacked {\n   \
    \ bool field1;\n    short field2;\n    long field4;\n} myStructPacked;\n```\n\n\
    # Static Structure Fields\n\n```cpp\nstruct MyStruct\n{\n    int field;\n    static\
    \ unsigned shared_field;\n} myStruct1, myStruct2;\n\nunsigned MyStruct::shared_field\
    \ = 123;\n\nmyStruct1.field = 0;\nmyStruct1.shared_field = 123;\nmyStruct2.field\
    \ = 1;\n\n(gdb) ptype /o MyStruct\n$type = struct MyStruct {\n    /* offset  \
    \  size */\n    0          | 4 */\n    int field;\n    static unsigned shared_field;\n\
    \    /* total size (bytes): 4 */\n}\n\n(gdb) x &MyStruct::shared_field:\n0x4028\
    \ <MyStruct::shared_field>: 0x0000007b\n```\n\nStatic structure field values are\
    \ shared between the different objects of the same structure type. They occupy\
    \ uniquely separate memory cells from the objects' memory.\n\nThe code example\
    \ corresponding to the GDB output:\n\n```cpp\nstruct MyStruct\n{\n    int field;\n\
    \    static unsigned shared_field;\n} myStruct1, myStruct2;\n\nunsigned MyStruct::shared_field\
    \ = 123;\n\nmyStruct1.field = 0;\nmyStruct1.shared_field = 123;\nmyStruct2.field\
    \ = 1;\n```\n\n# Uniform Initialization\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_108_0.png)\n\
    \nThroughout C++ history, there were several ways to initialize variables.\nFinally,\
    \ there is some uniform way to do it consistently.\n\n# Old Initialization Ways\n\
    \n```cpp\nOuterStruct *pMyStruct;\nOuterStruct *pMyStruct = NULL;\nOuterStruct\
    \ *pMyStruct(NULL);\nOuterStruct *pMyStruct = nullptr;\n```\n\nWhen we omit an\
    \ initialization value, a variable is considered uninitialized if its memory belongs\
