    pMyBase->method2();\n```\n\n# 模板简介\n\nC++ 模板和模板元编程是一个巨大的宇宙。我们只涵盖介绍。\n\n# 为什么要用模板？\n\
    \n在接下来的幻片中，我们将简要介绍“为什么”方面的内容。\n\n模板允许我们用更高的抽象性编写更少的代码，将实现细节交给编译器。编译器会检查模板参数是否兼容，例如它们是否实现了所需的操作和方法。\n\
