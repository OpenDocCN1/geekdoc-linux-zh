  - "[PAGE 219]\n\n# VTBL Memory Layout\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_219_0.png)\n\
    \nThe virtual function calls are implemented uniformly by having a specific virtual\
    \ function table (vtbl or vtable) for each structure where the addresses of the\
    \ base structure methods are replaced with those of the derived structure methods,\
    \ if any.\n\nThe code examples corresponding to the memory diagram:\n\n```\nstruct\
    \ Base\n{\n    virtual void vmethod1() {}\n    virtual void vmethod2() {}\n} myBase;\n\
    \nstruct Derived : Base\n{\n    int field;\n    void vmethod2() override {}\n\
    } myDerived;\n```"
  - '[PAGE 220]


    # VPTR and Struct Memory Layout


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_220_0.png)


    Every object whose structure has virtual methods has an implicit virtual function
    pointer (_vptr) as its first member containing an address of the corresponding
    structure virtual functions table. Therefore, each virtual function call from
    a base structure pointer is a type-independent call where the target function
    address is easily calculated based on the address of the virtual function table
    and virtual function offset.


    The code examples corresponding to the memory diagram:


    ```

    Base *pMyBase = &myBase;

    pMyBase->vmethod2();


    pMyBase = &myDerived;

    pMyBase->vmethod2();

    ```'
