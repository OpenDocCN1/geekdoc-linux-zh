    \ = nullptr;\n```\n\n```cpp\nOuterStruct *pMyStruct{}\nOuterStruct *pMyStruct{NULL};\n\
    OuterStruct *pMyStruct{nullptr};\nOuterStruct *pMyStruct{&myStruct};\n```\n\n\
    When we use the new way of initialization in modern C++, we can use empty {} to\
