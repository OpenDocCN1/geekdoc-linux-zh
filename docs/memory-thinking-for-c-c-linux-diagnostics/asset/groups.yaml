- md: "\n## Metafunctions\n\n```\nMetafunctions\n\n// f: Value -> Value\n// mf: Type\
    \ -> Type\n\ntemplate <typename T>\nstruct Pointer {\n    // typedef T* type;\n\
    \    using type = T;\n}\n\nPointer<int>::type pInt; // int *pInt\nPointer<int\
    \ *>::type pPInt; // int **ppInt\nPointer<struct M>::type pM; // struct M *pM;\n\
    ```\n\nMetafunctions transform type: they take types as parameters and return\
    \ types as output.\n\nThe code example:\n\n```cpp\n// f: Value -> Value\n// mf:\
    \ Type -> Type\ntemplate <typename T>\nstruct Pointer {\n    // typedef T* type;\n\
    \    using type = T;\n}\n\nPointer<int>::type pInt; // int *pInt\nPointer<int\
    \ *>::type pPInt; // int **ppInt\nPointer<struct M>::type pM; // struct M *pM;\n\
    ```\n\n## Iterators as Pointers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_232_0.png)\n\
    \nNow, we take a bird’s eye view of standard library containers, iterators, and\
    \ algorithms from a pointer perspective.\n\nThere are many container types in\
    \ the standard C++ library (formerly called STL, Standard Template Library). In\
    \ this course edition, we don't delve into their specifics. We hope the names\
    \ intuitively suggest their semantics.\n\n## Iterators\n\n```cpp\nstd::vector<int>\
    \ v{1, 2, 3, 4, 5};\nstd::vector<int>::iterator it = v.begin();\n\nwhile (it !=\
    \ v.end())\n{\n    std::cout << *it;\n    ++it;\n}\n\nint a[5]{1, 2, 3, 4, 5};\n\
    int *pa = &a[0];\n\nwhile (pa != &a[5])\n{\n    std::cout << *pa;\n    ++pa;\n\
    }\n```\n\nAn iterator is a pointer abstraction. You can move it (depending on\
    \ container semantics) like a pointer increment/decrement, and you can dereference\
    \ it like a pointer to get a value:\n\n```cpp\nstd::vector<int> v{1, 2, 3, 4,\
    \ 5};\nstd::vector<int>::iterator it = v.begin();\n\nwhile (it != v.end())\n{\n\
    \    std::cout << *it;\n    ++it;\n}\n\nint a[5]{1, 2, 3, 4, 5};\nint *pa = &a[0];\n\
    \nwhile (pa != &a[5])\n{\n    std::cout << *pa;\n    ++pa;\n}\n```\n\n## Constant\
    \ Iterators\n\n```cpp\nstd::vector<int> v1{1, 2, 3, 4, 5};\nstd::vector<int>::const_iterator\
    \ cit = v.cbegin();\n\nwhile (cit != v.cend())\n{\n    std::cout << *cit;\n  \
    \  ++cit;\n}\n\nint a[5]{1, 2, 3, 4, 5 };\nconst int *cpa = &a[0];\n\nwhile (cpa\
    \ != &a[5])\n{\n    std::cout << *cpa;\n    ++cpa;\n}\n```\n\nLike a pointer to\
    \ constant values, there are constant iterators:\n\n```cpp\nstd::vector<int> v1{1,\
    \ 2, 3, 4, 5};\nstd::vector<int>::const_iterator cit = v.cbegin();\n\nwhile (cit\
    \ != v.cend())\n{\n    std::cout << *cit;\n    ++cit;\n}\n\nint a[5]{1, 2, 3,\
    \ 4, 5 };\nconst int *cpa = &a[0];\n\nwhile (cpa != &a[5])\n{\n    std::cout <<\
    \ *cpa;\n    ++cpa;\n}\n```\n\n## Pointers as Iterators\n\n```cpp\nint a[5]{ 1,\
    \ 2, 3, 4, 5 };\nint *itarr = std::begin(a);\n\n// auto itarr = std::begin(a);\n\
    while (itarr != std::end(a))\n{\n    std::cout << *itarr;\n    ++itarr;\n}\nconst\
    \ int *citarr = std::cbegin(a);\nwhile (citarr != std::cend(a))\n{\n    std::cout\
    \ << *citarr;\n    ++citarr;\n}\n```\n\nPointers can also be considered as iterators.\n\
    \n```cpp\nint a[5]{ 1, 2, 3, 4, 5 };\nint *itarr = std::begin(a);\n\n// auto itarr\
    \ = std::begin(a);\nwhile (itarr != std::end(a))\n{\n    std::cout << *itarr;\n\
    \    ++itarr;\n}\nconst int *citarr = std::cbegin(a);\nwhile (citarr != std::cend(a))\n\
    {\n    std::cout << *citarr;\n    ++citarr;\n}\n```\n\n## Algorithms\n\n```cpp\n\
    std::vector<int> v{2, 1, 3, 4, 5};\nstd::sort(v.begin(), v.end());\n\nint arr[5]{\
    \ 2, 1, 3, 4, 5 };\nstd::sort(std::begin(arr), std::end(arr));\n```\n\nBoth iterators\
    \ and containers and pointers as iterators and arrays can be used with the C++\
    \ standard library.\n\n## Memory Ownership\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_238.png)\n\
    \nWe now look at common ownership problems and see how they are resolved in modern\
    \ C++.\n\n## Pointers as Owners\n\n- Ownership of dynamic memory after allocation\n\
    - Contain the address of allocated memory\n- Read/Write/Release\n\nPointers can\
    \ be considered owners of dynamically allocated memory since they contain the\
    \ address, and that memory can be accessed through them.\n\n## Problems with Pointer\
    \ Owners\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_240.png)\n\nHowever, manual\
    \ pointer usage is prone to errors due to possible ownership, crashes due to possible\
    \ releases, and memory leaks due to dangling pointers going out of scope.\n\n\
    ## Basic Design\n\n- A structure with operators mimicking pointer behavior as\
    \ dereferencing\n- Encapsulates raw pointers\n- Restricts undesirable behavior\n\
    - Contains reference count that tracks copies\n- Provides a destructor to release\
    \ memory if the reference count becomes 0\n\nA smart pointer should include functionality\
    \ similar to raw pointers for seamless use during refactoring of legacy code and\
    \ simultaneously eliminate, if not all, problems with pointer usage.\n\n## Unique\
    \ Pointers\n\n```cpp\nstd::unique_ptr<int> fooU(std::unique_ptr<int> pPar)\n{\n\
    \    std::unique_ptr<int> pInt(pPar.release());\n    assert(pPar == nullptr);\n\
    \    if (pInt)\n        int n = *pInt; // *pInt.get();\n    return pInt;\n}\n\n\
    void barU() {\n    std::unique_ptr<int> pIntPar(new int(0));\n    std::unique_ptr<int>\
    \ pIntRes;\n    assert(pIntRes == nullptr);\n    pIntRes = fooU(std::move(pIntPar));\n\
    \    assert(pPar == nullptr && pIntRes != nullptr);\n}\n```\n\nFor smart pointers\
    \ without sharing functionality, the unique_ptr should be used. Copying must transfer\
    \ ownership, making the source nullptr.\n\n## Descriptors as Unique Pointers\n\
    \n```cpp\n// int fd = open(...);\n// close(fd);\n\nauto fdDeleter = [](auto pfd)\n\
    {\n    if (pfd && (*pfd != -1))\n        ::close(*fd);\n};\n\nusing FD = std::unique_ptr<int,\
    \ decltype(fdDeleter)>;\n```\n\nFile descriptors are good candidates for unique\
    \ pointers, but they should be supplied with a custom deletion mechanism.\n\n\
    ## Shared Pointers\n\n```cpp\nstd::shared_ptr<int> fooS(std::shared_ptr<int> pIntPar)\n\
    {\n    std::shared_ptr<int> pInt(pIntPar);\n    assert(pIntPar != nullptr && pIntPar.use_count()\
    \ == 0);\n    if (pInt)\n        int n = *pInt;\n    return pInt;\n}\n\nvoid barS()\
    \ {\n    std::shared_ptr<int> pIntPar(new int(0));\n    std::shared_ptr<int> pIntRes;\n\
    \    assert(pIntRes == nullptr && pIntRes.use_count() == 0);\n    pIntRes = pInt(pIntPar);\n\
    \    assert(pIntPar != nullptr && pIntRes != nullptr);\n    assert(pIntRes.use_count()\
    \ == 2 && pIntPar.use_count() == 2);\n}\n```\n\nWe want to freely copy pointers\
    \ with all new copies pointing to the same memory, then the shared_ptr is our\
    \ choice:\n\n```cpp\nstd::shared_ptr<int> fooS(std::shared_ptr<int> pIntPar)\n\
    {\n    std::shared_ptr<int> pInt(pIntPar);\n    assert(pIntPar != nullptr && pIntPar.use_count()\
    \ == 3);\n    if (pInt)\n        int n = *pInt;\n    return pInt;\n}\n\nvoid barS()\
    \ {\n    std::shared_ptr<int> pIntPar(new int(0));\n    std::shared_ptr<int> pIntRes;\n\
    \    assert(pIntRes == nullptr && pIntRes.use_count() == 0 && pIntPar.use_count()\
    \ == 1);\n    pIntRes = fooS(pIntPar);\n    assert(pIntPar != nullptr && pIntRes\
    \ != nullptr);\n    assert(pIntRes.use_count() == 2 && pIntPar.use_count() ==\
    \ 2);\n}\n```\n"
