- md: "\n# RAII\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_246_0.png)\n\nFinally,\
    \ the RAII idiom is specifically about managing resources, including memory,\n\
    \n# RAII Definition\n\n```cpp\nstruct Resource {\n  Resource Acquisition Is Initialization\n\
    \  Resource() {\n    // acquire resource, e.g., new\n    // initialize resource,\
    \ e.g., set memory values to 0\n  }\n  // Includes resource release\n  ~Resource()\
    \ {\n    // release resource, e.g., delete\n  }\n}\n```\n\nAn RAII structure encapsulates\
    \ simultaneous “atomic” resource acquisition and initialization in its constructors\
    \ and includes resource release logic in its destructor.\n\nThe code example:\n\
    \n```cpp\nstruct Resource {\n  Resource() {\n    // acquire resource, e.g., new\n\
    \    // initialize resource, e.g., set memory values to 0\n  }\n  ~Resource()\
    \ {\n    // release resource, e.g., delete\n  }\n}\n```\n\n# RAII Advantages\n\
    \n```cpp\nRAII Advantages\n\n* Resource safety\nvoid foo() { Resource r; }\n\n\
    * Resource life-cycle predictability\n\n* Exception safety\n\ntry {\n    Resource\
    \ r;\n    throw -1;\n} catch (...) {\n}\n```\n\nThere are several advantages to\
    \ using the RAII idiom. When going out of scope, it automatically releases a resource\
    \ due to a called destructor:\n\n```cpp\nvoid foo() { Resource r; }\n```\n\nIn\
    \ the presence of exceptions, the destructor releases the acquired resource automatically.\
    \ All these contribute to the predictable resource life cycle.\n\n```cpp\ntry\
    \ {\n    Resource r;\n    throw -1;\n} catch (...) {\n}\n```\n\n# File Descriptor\
    \ RAII\n\n```cpp\nstruct RAII_FD : FD\n{\n    RAII_FD(int _fd) : FD(&fd, fdDeleter),\
    \ fd(_fd) {};\n    void operator=(int _fd) { \n        FD::reset(); \n       \
    \ fd = _fd;\n        FD::reset(&fd); \n    }\n    operator int() const { return\
    \ fd; }\nprivate:\n    int fd;\n};\n\nint foo ()\n{\n    RAII_FD fd = ::open(...);\n\
    \    if (fd == -1)\n        // return -1;\n    return 0;\n}\n```\n\nThe code example\
    \ of encapsulating file descriptors using the RAII idiom. We reuse the FD type\
    \ from the previous Descriptors as Unique Pointers slide:\n\n```cpp\nstruct RAII_FD\
    \ : FD\n{\n    RAII_FD(int _fd) : FD(&fd, fdDeleter), fd(_fd) {};\n    void operator=(int\
    \ _fd) { \n        FD::reset(); \n        fd = _fd;\n        FD::reset(&fd); \n\
    \    }\n    operator int() const { return fd; }\nprivate:\n    int fd;\n};\n\n\
    int foo ()\n{\n    RAII_FD fd = ::open(...);\n    if (fd == -1)\n        // return\
    \ -1;\n    return 0;\n}\n```\n\n# Threads and Synchronization\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_250_0.png)\n\
    \nOur final section in this edition is about threads and synchronization in C++.\n\
    \n# Threads in C/C++\n\n```cpp\nvoid *thread_proc (void *arg) {\n  sleep((unsigned\
    \ long)arg);\n  return 0;\n}\n\nvoid foo() {\n  pthread_t tid;\n\n  pthread_create(&tid,\
    \ NULL, thread_proc, (void *));\n}\n```\n\nTraditional C/C++ threading using raw\
    \ pthread API is limited. Passing any parameter type and casting it is error-prone.\n\
    \nThe code example:\n\n```cpp\nvoid *thread_proc (void *arg) {\n  sleep((unsigned\
    \ long)arg);\n  return 0;\n}\n\nvoid foo() {\n  pthread_t tid;\n  pthread_create\
    \ (&tid, NULL, thread_proc, (void*)5);\n}\n```\n\n# Threads in C++ Proper\n\n\
    ```cpp\n// functions, function objects, lambdas\nvoid threadProcCpp(int param,\
    \ std::string msg)\n{\n    ::sleep(param);\n    std::cout << \"New Thread Created!\"\
    \ + msg << std::endl;\n}\n\nvoid foo()\n{\n    std::thread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n    //...\n    threadProcCpp.join();\n    // std::jthread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n```\n\n2023 Software Diagnostics Services\n\nThe proper C++\
    \ standard library thread allows the utilization of the power of modern C++ abstractions.\
    \ Please also note the existence of jthread that combines both thread creation\
    \ and join:\n\n```cpp\n// functions, function objects, lambdas\nvoid threadProcCpp(int\
    \ param, std::string msg)\n{\n    ::sleep(param);\n    std::cout << \"New Thread\
    \ Created!\" + msg << std::endl;\n}\n\nvoid foo()\n{\n    std::thread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n    //...\n    threadProcCpp.join();\n    // std::jthread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n}\n```\n\n# Synchronization Problems\n\n```cpp\nlong counter{0};\n\
    \nvoid threadProcCpp(std::string msg)\n{\n    while (true)\n    {\n        std::cout\
    \ << msg << \": \" << ++counter << std::endl;\n    }\n}\n\nvoid foo() {\n    std::jthread\
    \ thread1(threadProcCpp, \"Hello1\");\n    std::jthread thread2(threadProcCpp,\
    \ \"Hello2\");\n}\n```\n\nIn the code example, the output from << operators from\
    \ different threads is mixed and looks like garbage:\n\n```cpp\nlong counter{0};\n\
    void threadProcCpp(std::string msg)\n{\n    while (true)\n    {\n        std::cout\
    \ << msg << \": \" << ++counter << std::endl;\n    }\n}\nvoid foo() {\n    std::jthread\
    \ thread1(threadProcCpp, \"Hello1\");\n    std::jthread thread2(threadProcCpp,\
    \ \"Hello2\");\n}\n\n// Hello2: 1694\n// : 1695\n```\n\n# Synchronization Solution\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_254_0.png)\n\n```cpp\nstd::atomic<long>\
    \ counter{0};\n\nstd::mutex m;\n\nvoid threadProcCpp(std::string msg)\n{\n   \
    \ while (true)\n    {\n        std::lock_guard<std::mutex> lock(m);\n        std::cout\
    \ << msg << \": \" << ++counter << std::endl;\n    }\n}\n\nvoid foo() {\n    std::jthread\
    \ thread1(threadProcCpp, \"Hello1\");\n    std::jthread thread2(threadProcCpp,\
    \ \"Hello2\");\n}\n```\n\nThe following code example solves the data race by guarding\
    \ access via scoped_lock that is implemented using mutex:\n\n# Resources\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_255_0.png)\n\
    \nNow, I have a few slides about references and resources for further reading.\n\
    \n# C and C++\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_256_0.png)\n\nMy reading\
    \ list up to C++17:\n\n# My Road to Modern C++\n\nhttps://www.linkedin.com/pulse/my-road-to-modern-c/\n\
    \ncppreference\n\nhttps://en.cppreference.com/w/\n\nTwo recent books are also\
