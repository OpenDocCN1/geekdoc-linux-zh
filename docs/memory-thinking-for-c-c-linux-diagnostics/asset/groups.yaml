  - "[PAGE 97]\n\n# Addresses and Structures\n\n```\nstruct OuterStruct {\n  int field1;\n\
    \  struct InnerStruct {\n    int field1;\n    int field2;\n  } field2;\n  struct\
    \ InnerStruct {\n    int field;\n  } field3;\n  } myStruct;\n```\n\n| | |\n|---||\n\
    | 2ab1000: | 2ab1008 |\n| 2ab1004: | ffffffff |\n| 2ab1008: | 2ab1010 |\n| | 2ab100c\
    \ |\n| 2ab1010: | 00000000 |\n| 2ab1014: | 00000200 |\n\nA structure in memory\
    \ is a sequential collection of memory cells; some be multicell and themselves\
    \ substructures. Each part of its, its member, or structure field has its own\
    \ address as well, in addition to the overall address of the structure.\n\nThe\
    \ code example corresponding to the memory diagram:\n\n```\nstruct OuterStruct\
    \ {\n  int field1;\n  struct InnerStruct {\n    int field1;\n    int field2;\n\
    \  } field2;\n  struct InnerStruct {\n    int field;\n  } field3;\n  } myStruct;\n\
    ```"
