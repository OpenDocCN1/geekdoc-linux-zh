    ```cpp\nOuterStruct *pMyStruct{}\nOuterStruct *pMyStruct{NULL};\nOuterStruct *pMyStruct{nullptr};\n\
    OuterStruct *pMyStruct{&myStruct};\n```\n\n# Uniform Structure Initialization\n\
    \n```cpp\nstruct OuterStruct\n{\n    int field1;\n    struct InnerStruct\n   \
    \ {\n        int field1;\n        int field2;\n    } field2;\n    struct InnerStruct\n\
    \    {\n        int field;\n    } field3;\n} myStructA {1, {2}, {4}};\n\nstruct\
    \ OuterStruct\n{\n    int field1{1};\n    struct InnerStruct\n    {\n        int\
    \ field1{2};\n        int field2{3};\n    } field2;\n    struct InnerStruct\n\
    \    {\n        int field{4};\n    } field3;\n} myStructB;\n```\n\nIt is possible\
    \ to uniformly initialize the structure outside or provide default initializers\
    \ in the structure definition.\n\nThe code example:\n\n```cpp\nstruct OuterStruct\n\
    {\n    int field1;\n    struct InnerStruct\n    {\n        int field1;\n     \
    \   int field2;\n    } field2;\n    struct InnerStruct\n    {\n        int field;\n\
    \    } field3;\n} myStructA {1, {2}, {4}};\n\nstruct OuterStruct\n{\n    int field1{1};\n\
    \    struct InnerStruct\n    {\n        int field1{2};\n        int field2{3};\n\
    \    } field2;\n    struct InnerStruct\n    {\n        int field{4};\n    } field3;\n\
    } myStructB;\n```\n\n# Static Field Initialization\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_112_0.png)\n\
    \n```cpp\nstruct MyStruct {\n    int field;\n    inline unsigned shared_field{123};\n\
