  mdcn: "\n\n# RAII\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_246_0.png)\n\n最后，RAII\
    \ 范式专门用于管理资源，包括内存。\n\n# RAII 定义\n\n```cpp\nstruct Resource {\n  Resource Acquisition\
    \ Is Initialization\n  Resource() {\n    // 获取资源，例如 new\n    // 初始化资源，例如将内存值置为\
    \ 0\n  }\n  // 资源释放\n  ~Resource() {\n    // 释放资源，例如 delete\n  }\n}\n```\n\nRAII\
    \ 结构体在其构造函数中封装了同步的“原子性”资源获取与初始化，并在析构函数中包含了资源释放逻辑。\n\n代码示例：\n\n```cpp\nstruct Resource\
    \ {\n  Resource() {\n    // 获取资源，例如 new\n    // 初始化资源，例如将内存值置为 0\n  }\n  ~Resource()\
    \ {\n    // 释放资源，例如 delete\n  }\n}\n```\n\n# RAII 优势\n\n```cpp\nRAII  Advantages\n\
    \n* 资源安全\nvoid foo() { Resource r; }\n\n* 资源生命周期可预测\n\n* 异常安全\n\ntry {\n    Resource\
    \ r;\n    throw -1;\n} catch (...) {\n}\n```\n\n使用 RAII 范式有几个优势。当离开作用域时，由于析构函数的调用，资源会自动释放：\n\
    \n```cpp\nvoid foo() { Resource r; }\n```\n\n在存在异常的情况下，析构函数会自动释放已获取的资源。这些因素共同贡献了可预测的资源生命周期。\n\
    \n```cpp\ntry {\n    Resource r;\n    throw -1;\n} catch (...) {\n}\n```\n\n#\
    \ 文件描述符 RAII\n\n```cpp\nstruct RAII_FD : FD\n{\n    RAII_FD(int _fd) : FD(&fd,\
    \ fdDeleter), fd(_fd) {};\n    void operator=(int _fd) { \n        FD::reset();\
    \ \n        fd = _fd;\n        FD::reset(&fd); \n    }\n    operator int() const\
    \ { return fd; }\nprivate:\n    int fd;\n};\n\nint foo ()\n{\n    RAII_FD fd =\
    \ ::open(...);\n    if (fd == -1)\n        // return -1;\n    return 0;\n}\n```\n\
    \n使用 RAII 范式封装文件描述符的代码示例。我们复用了之前 Descriptors 中的 FD 类型，就像 Unique Pointers 的移动语义一样：\n\
    \n```cpp\nstruct RAII_FD : FD\n{\n    RAII_FD(int _fd) : FD(&fd, fdDeleter), fd(_fd)\
    \ {};\n    void operator=(int _fd) { \n        FD::reset(); \n        fd = _fd;\n\
    \        FD::reset(&fd); \n    }\n    operator int() const { return fd; }\nprivate:\n\
    \    int fd;\n};\n\nint foo ()\n{\n    RAII_FD fd = ::open(...);\n    if (fd ==\
    \ -1)\n        // return -1;\n    return 0;\n}\n```\n\n# 线程与同步\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_250_0.png)\n\
    \n本版的最后一章节是关于 C++ 中的线程与同步。\n\n# C/C++ 中的线程\n\n```cpp\nvoid *thread_proc (void\
