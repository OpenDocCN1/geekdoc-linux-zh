    - Coroutines

    - Modules

    - Tasks

    - Ranges

    - Container and algorithm semantics and pragmatics

    - Container allocators

    - Polymorphic allocators


    > * We promise to include these topics in the second edition


    There are some C++ topics that we did not include:


    - Enumerations

    - Move constructors and assignment operators

    - Deleted and default members

    - Universal references

    - Concepts

    - Coroutines

    - Modules

    - Tasks

    - Ranges

    - Container and algorithm semantics and pragmatics

    - Container allocators

    - Polymorphic allocators


    We promise to include these topics in the second edition.


    # Linux C & C++ Aspects


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_26_0.png)


    In addition, we also discuss related Linux aspects, including:


    - Linux-specific type aliases and macros

    - LP64

    - Necessary x64 and A64 disassembly

    - Parameter passing

    - Implicit parameter


    # Why C & C++?


    ```

    Why C and C++


    * Interfacing

    * Malware analysis

    * Vulnerability analysis and exploitation

    * Reversing

    * Diagnostics

    * Low-level debugging

    * OS Monitoring

    * Memory forensics

    * Crash and hang analysis

    * Secure coding

    * Static code analysis

    * Trace and log analysis

    ```


    First, why did we create this course? Even if you don’ develop in C and C++, the
    knowledge of C and C++ and their internals is necessary for many software construction
    and post-construction activities:


    - Interfacing

    - Malware analysis

    - Vulnerability analysis and exploitation

    - Reversing

    - Diagnostics

    - Low-level debugging

    - OS Monitoring

    - Memory forensics

    - Crash and hang analysis

    - Secure coding

    - Static code analysis

    - Trace and log analysis


    In this training, we mostly look at C and C++ from a software diagnostics perspective.
    This perspective includes memory dump analysis and, partially, trace and log analysis.
    The knowledge of C and C++ is tacitly assumed in my other courses, where most
    abnormal software behavior modeling exercises are written in C and C++.


    # Which C & C++?


    - C

    - C++ as a better C

    - Proper C++ (legacy and modern)

    - Linux specifics


    Which C and C++? We look at a unified presentation approach combining all C and
    C++ variants. Since this course is about diagnostics and not designing and implementing
    code, we do not make distinctions. It is not possible to cover all the differences
    in the short time that we have. We also describe things as they are in Linux programming
    (and narrowly from a Linux system programming perspective), not as they ought
    to be from the latest C++ standards.

