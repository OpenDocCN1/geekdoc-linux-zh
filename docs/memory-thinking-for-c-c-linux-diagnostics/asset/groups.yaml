    - VTBL 和 VPTR

    - 访问级别

    - 重载、重写

    - 模板

    - 内存所有权，RAII

    - 智能指针


    # 我们不涵盖的内容


    - 枚举

    - 移动构造函数与赋值

    - 默认成员

    - 通用引用

    - 概念

    - 模块

