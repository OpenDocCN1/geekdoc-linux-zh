- md: "\n[content]\n# My History of C & C++\n\n- C from 1987 and C++ from 1989 (Old\
    \ CV)\n- C++ as a better C from 1991\n- Implicit design patterns in 1994-1995\n\
    - C++ as proper C++ from 2000\n- Explicit design patterns in 2000\n- C++98/03/STL\
    \ from 2001\n- BSD dump analysis from 2012\n- Linux core dump analysis from 2015\n\
    - [..\n- C++11/14 from 2016\n- C++17 from 2017\n- Functional programming from\
    \ 2020\n- Linux system programming since 2022\n- C++20 from 2023\n\nThis history\
    \ slide is only about C and C++ languages. Despite many years, it is still easy\
    \ to recall when I started learning C. It was shortly after I started my university\
    \ education. And although my first programming language was FORTRAN, I read the\
    \ classic K&R book in a library. C++ is harder to recall, but most likely, it\
    \ was in 1989, least according to my old CV, which is the source of truth. I definitely\
    \ started using C++ in commercial projects around 1991 but used it as a better\
    \ C, and there was no standard template library (STL) at that time. I recall some\
    \ fascinating C++ GUI frameworks for MS-DOS, like Zinc. In 1994-1995, I designed\
    \ a word processor, and in the process, I implicitly many design patterns later\
    \ discovered in the GOF book of 2000. The authors also use a word processor for\
    \ illustration. I mainly understand C++ as C++ in 2000 when I read a book about\
    \ CORBA distributed object technology that used C++. I continued learning C++\
    \ by reading many books of that time and learned the merits of using STL and also\
    \ how to use it effectively. In 2001, I joined a company that developed C++ static\
    \ analysis tools, and this greatly improved my C++ knowledge up to the expert\
    \ at that time. C++03 didn't have major changes compared to C++98, and this is\
    \ why I included it with C++98 for the year 2001. In 2003, things turned out unexpectedly\
    \ as I moved from full-time development using C++ to full-time memory dump analysis\
    \ of C++ programs with Mac OS X core dump analysis of user space (BSD) in 2012\
    \ and Linux user space core dump analysis in 2015. I continued using C++03 for\
    \ writing diagnostic tools, though. In 2016, I learned that the language completely\
    \ changed to C++11/14. I came back to full-time C++ programming in late 2017,\
    \ where I also started using language features from C++17. In 2020, I moved to\
    \ functional programming in Scala, which also influenced my C++ coding for new\
    \ projects. Now, I have started using C++20 - a bit late since C++23 is already\
    \ available, and I am switching from Scala to Rust.\n\n# Zinc\n\nhttps://en.wikipedia.org/wiki/Zinc_Application_Framework\n\
    \n# Old CV\n\nhttps://opentask.com/Vostokov/CV.htm\n\n# C and C++ Mastery Process\n\
    \nDespite high-level features in C++, there’s still much low-level overlap with\
    \ C, and when I program in C and C++, I mentally compile to memory. This helps\
    \ when I have a doubt about whether this or that construct is safe. I also believe\
    \ that looking at how C and C++ constructs are implemented in memory greatly helps\
    \ in learning these languages.\n\nThis slide about a thought process when using\
    \ a programming language is perhaps controversial. With C and C++, we think about\
    \ memory; with Scala/FP, we think about functions; and with Python, we think about\
    \ data.\n\n# Philosophy of Pointers\n\nWe start with pointers, the most important\
    \ concept in C and also in C++. I originally created this approach in 2015 but\
    \ now extended it for this training.\n\n# Pointer\n\nConceptually, a pointer is\
    \ an entity that refers (or points) to some other entity. We say entity, not an\
    \ object, so as not to confuse it with objects in C++ or objects in object-oriented\
    \ programming. This can be my finger, for example, pointing to an apple.\n\n#\
    \ Pointer Dereference\n\nA pointer dereference is an act of getting the entity\
    \ it references for further inspection or usage. Imagine I point to an apple,\
    \ and you grab it.\n\n# Many to One\n\nSeveral pointers can refer (or point) to\
    \ the same entity. For example, two people are pointing to the same apple. So,\
    \ pointers are distinct from entities they point to. Should we call the latter\
    \ pointees?\n\n# Many to One Dereference\n\nOf course, if you dereference the\
    \ same object, you get the same object. If someone else grabs an apple I point\
    \ to, at the same time as you, both get the same apple.\n\n# Invalid Pointer\n\
    \nSome pointers may be invalid; for example, I may point to an imaginary apple.\n\
    \n# Pointer Dereference\n\nWhen you dereference an invalid pointer, you get a\
    \ problem; for example, you fail to get an imaginary apple I point to.\n\nSome\
    \ pointers are called dangling – they used to point to valid entities long ago,\
    \ but not anymore, so a dereference fails. You’re reaching for an apple that I\
    \ point to, but someone snatched it a second ago.\n\n# Pointer to Pointer\n\n\
    Since a pointer is also an entity that can be pointed to, there can be a chain\
    \ of pointers. You point to me; I point to an apple.\n\n# Pointer to Pointer Dereference\n\
    \nWhen we dereference the first pointer, we get an entity, another pointer, which\
    \ we can also dereference to get the underlying entity. You point to me, but someone\
    \ snatches me with an apple I point to. Inside this, another alien takes the apple\
    \ for analysis.\n\n# Naming Pointers and Entities\n\nNames are distinct from entities.\
    \ Names can be programming language identifiers or just unique numbers or IDs.\n\
    \n# Names as Pointer Content\n\nPointers, as entities, may contain names, and\
    \ these names may be names of pointers, too. If a pointer contains only a name,\
    \ we say the pointer value is the name. So, the pointer value can be another pointer\
    \ value, and the latter pointer value is the name of some other entity.\n\n# Pointers\
    \ as Entities\n\nPointer dereference is an act. If we put acts aside, pointers\
    \ are just entities with some content that can be interpreted as a name if necessary.\
    \ All these dereferences happen only at runtime. The pointer content (its value)\
    \ may be invalid for all time without any problem until we use it.\n\n# Memory\
    \ and Pointers\n\nNow, we look at the memory representation of pointers and entities\
    \ they point to.\n\n# Mental Exercise\n\nHere, in this picture, entities are the\
    \ so-called memory cells. Memory cells have addresses that start from 0 and are\
    \ usually incremented by the so-called pointer size, which is 4 on 32-bit systems\
    \ and 8 on 64-bit systems. Here, for visual clarity, we use memory cells from\
    \ a 32-bit system.\n\n# Debugger Memory Layout\n\nWhen we use a debugger, it prints\
    \ memory cell addresses and their contents in a certain layout shown on this slide.\
    \ Some debugger commands, such as x in GDB, use 2-column and some n-column layouts\
    \ to print memory.\n\n# Memory Dereference Layout\n\nFor a 2-column format, some\
    \ debuggers and their commands may interpret the second column as a pointer. In\
    \ such a case, the third column is a value from a pointer dereference. Also, notice\
    \ a case when a pointer points to itself. For GDB, it is possible to emulate such\
    \ behavior using a custom script:\n\n```\ndefine dpp\n    set $i = 0\n    set\
    \ $p = $arg0\n    while $i < $arg1\n        printf \"%p: \" , $p\n        x/gx\
    \ *(long *)$$p\n        set $i = $i + 1\n        set $p = $p + 8\nend\n```\n[/content]\n"
  mdcn: "\n# 我的 C 与 C++ 历史\n\n- 1987 年开始学习 C，1989 年开始 C++（旧版简历）\n- 1991 年起作为更好的 C\
    \ 的 C++\n- 1994-1995 年的隐式设计模式\n- 2000 年起作为真正的 C++\n- 2000 年的显式设计模式\n- 2001 年的\
    \ C++98/03/STL\n- 2012 年的 BSD core dump 分析\n- 2015 年的 Linux core dump 分析\n- [..\n\
    - 2016 年的 C++11/14\n- 2017 年的 C++17\n- 2020 年开始的函数式编程\n- 2022 年起的 Linux 系统编程\n\
    - 2023 年的 C++20\n\n这张历史幻灯片仅关于 C 和 C++ 语言。尽管过了多年，我仍然很容易想起我开始学习 C 的时候。那在我开始大学教育后不久。尽管我的第一门编程语言是\
    \ FORTRAN，但我在图书馆读了经典的 K&R 书籍。C++ 比较难记起，但很可能是在 1989 年，至少根据我的旧简历是，它是事实的来源。我肯定在 1991\
    \ 年左右开始在商业项目中使用 C++，但将其作为一种更好的 C 使用，当时还没有标准模板库（STL）。我记得有一些针对 MS-DOS 的奇妙 C++ GUI\
    \ 框架，比如 Zinc。在 1994-1995 年，我设计了一个文字处理器，在这个过程中，我隐式地使用了许多后来在 2000 年 GOF 书中发现的设计模式。书的作者也使用文字处理器作为说明。2000\
    \ 年，当我读一本关于使用 C++ 的 CORBA 分布式对象技术的书时，我主要将 C++ 理解为 C++。通过阅读那个时代的许多书籍继续学习 C++，并学会了使用\
    \ STL 的优点以及如何有效地使用它。2001 年，我加入了一家开发 C++ 静态分析工具的公司，这极大地提升了我的 C++ 知识，使其达到了当时的专家水平。C++03\
    \ 与 C++98 相比没有重大变化，这就是为什么我将它与 C++98 一起放在了 2001 年。2003 年，情况发生了出意之外的变化，我从使用 C++\
    \ 的全职开发转变为对 C++ 程序进行全职内存 dump 分析，包括 2012 年的 Mac OS X 用户空间（BSD）核心转 dump 分析，以及 2015\
    \ 年的 Linux 用户空间 core dump 分析。尽管如此，我继续使用 C++03 编写诊断工具。2016 年，我了解到语言已完全变为 C++11/14。我在\
    \ 2017 年底回归了全职 C++ 编程，期间也开始使用 C++17 的语言特性。2020 年，我转向了 Scala 函数式编程，这候影响了我新项目的 C++\
    \ 代码编写。现在，我开始使用 C++20 —— 晚了一点，因为 C++23 已经可用，而且我正在从 Scala 转向 Rust。\n\n# Zinc\n\n\
    https://en.wikipedia.org/wiki/Zinc_Application_Framework\n\n# 旧简历\n\nhttps://opentask.com/Vostokov/CV.htm\n\
    \n# C 与 C++ 精通之路\n\n尽管 C++ 有许多高级特性，但它与 C 之间有很多底层重叠，当我用 C 和 C++ 编程时，我会在脑中编译为内存。这在我怀疑某个构造是否安全时很有帮助。我也认为，观察\
    \ C 和 C++ 构造在内存中是如何实现的对学习这些语言非常有帮助。\n\n这张关于使用编程语言时的思维过程的幻灯片可能存在争议。对于 C 和 C++，我们考虑内存；对于\
    \ Scala/FP，我们考虑函数；对于 Python，我们考虑数据。\n\n# 指针哲学\n\n我们从指针开始，这是 C 也是 C++ 中最重要的概念。我最初在\
    \ 2015 年创建了这种方法，现在为了这次培训对其进行了扩展。\n\n# 指针\n\n从概念上说，指针是一个引用（或指向）其他实体的实体。我们称之为实体（entity）而不是对象（object），目的是以防与\
    \ C++ 中的对象或面向对象编程中的对象混淆。例如，这可以是我的手指指向一个苹果。\n\n# 指针解引用\n\n指针解引用是获取其所引用实体以进行进一步检查或使用的行为。想象我指向一个苹果，而你抓住了它。\n\
    \n# 多对一\n\n多个指针可以引用（或指向）同一个实体。例如，两个人指向同一个苹果。所以，指针与它们指向的实体是区别的。我们应该称后者为被对象（pointees）吗？\n\
    \n# 多对一解引用\n\n当然，如果你对同一个对象进行解引用，你会得到同一个对象。如果别人和你同时抓住了我指向的那个苹果，你们都得到了同一个苹果。\n\n\
    # 无效指针\n\n某些指针可能是无效的；例如，我可能指向一个想象的苹果。\n\n# 指针解引用\n\n当你对无效指针进行解引用时，你会遇到问题；例如，你无法得到我指向的那个虚拟苹果。\n\
    \n某些指针被称为悬挂指针（dangling）——它们很久以前曾指向有效的实体，但现在不再了，所以解引用会失败。你正伸手去拿我指向的苹果，但别人在一秒钟前抢走了。\n\
    \n# 指针指针\n\n由于指针本身也是可以被指向的实体，因此可以存在指针链。你指向我；我指向一个苹果。\n\n# 指针指针解引用\n\n当我们对第一个指针进行解引用时，我们得到一个实体，另一个指针，我们可以对其进行解引用。你指向我，但有人夺走了我指向的苹果。在这里，另一个人苹果。\n\
    \n# 命名指针与实体\n\n名称与实体是有区别的。名称可以是编程语言的标识符或唯一的数字。\n\n# 作为指针的内容\n\n作为实体的指针可能包含名称，这些名称也可能是指针的名称。如果指针只包含名称，我们说指针的值是名称。所以，指针的值可以是另一个指针的值，后者指针的值是另一个实体的名称。\n\
    \n# 作为实体的指针\n\n解引用是一个行为。如果我们把行为分开，指针只是实体，在必要时可以被解释为名称。所有解引用都发生在运行时。指针的内容（其值）可能一直是无效的，直到我们使用它。\n\
    \n# 内存与指针\n\n现在，我们观察指针及其指向的实体的内存表示。\n\n# 心理练习\n\n在此图中，实体是所谓的内存单元。内存单元的地址从 0 开始，并通常按指针的大小递增（32\
    \ 位系统上为 4，64 位系统上为 8）。在这里，为了视觉清晰，我们使用了来自 32 位系统的内存单元。\n\n# 调试器内存布局\n\n当我们使用调试器时，它会按照此幻灯片所示的布局打印内存单元地址及其内容。某些调试器命令（如\
    \ GDB 中的 x）使用 2 列和某些 n 列布局来打印内存。\n\n# 内存解引用布局\n\n对于 2 列格式，某些调试器及其命令可能会将第二列解释为指针。在这种情况下，第三列是指针解引用的值。还要注意指针指向自身的情况。对于\
    \ GDB，可以使用自定义脚本来模拟这种行为：\n\n```\ndefine dpp\n    set $i = 0\n    set $p = $arg0\n\
    \    while $i < $arg1\n        printf \"%p: \" , $p\n        x/gx *(long *)$$p\n\
    \        set $i = $i + 1\n        set $p = $p + 8\nend\n```\n"
