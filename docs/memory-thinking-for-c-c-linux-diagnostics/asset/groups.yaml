    - 容器语义与实践

    - 容器分配器

    - 析态分配器


    > * 我们将在第二版中包含这些主题


    # Linux C & C++ 方面


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_26_0.png)


    此外，我们还讨论了相关的 Linux 方面，包括：


    - Linux 特有的类型定义与宏

    - LP64

    -  x64 和 A64 反汇编

    - 参数传递

    - 隐式参数


    # 为什么选择 C & C++


    ```

    为什么是 C 和 C++


    * 接口

    * 恶意软件分析

    * 漏洞分析与利用

    * 逆向

    * 诊断

    * 底部调试

    * OS 监控

    * 内存取证

    * 崩溃分析

    * 安全编码

    * 静态代码分析

    * 追踪与日志分析

    ```


    首先，为什么要创建这个课程？即使你不开发 C 或 C++，C 和 C++ 及其内部机制的知识对于许多构建后续的活动也是必要的：


    - 接口

    - 恶意软件分析

    - 漏洞分析与利用

    - 逆向

    - 诊断

    - 底层调试

    - OS 监控

    - 内存取证

    - 崩溃分析

    - 安全编码

    - 静态代码分析

    - 追踪与日志分析


    在本次培训中，我们主要从软件诊断的角度来看 C 和 C++。这个视角包含了内存转储分析，以及部分追踪和日志分析。在我其他的课程中，C 和 C++ 的知识是隐含的，那里大多数异常软件行为建模都是用
    C 和 C++ 编写的。


    # 哪些 C & C++？


    - C

    - 作为更好的 C 的 C++

    - 真正的 C++（传统与现代）

    - Linux 特性


    哪些 C 和 C++？我们将采用统一的演示方法来看所有 C 和 C++ 变体。由于本课程是关于诊断而非设计和实现代码，因此我们不做区分。在有限的时间内无法涵盖所有差异。我们描述的是
    Linux 编程中的实际情况（从狭义的 Linux 系统编程视角来看），而不是最新 C++ 标准所要求的样子。


