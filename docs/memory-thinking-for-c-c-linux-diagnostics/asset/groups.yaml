    //...

    struct S { };

    //...

    S s;

    ```


    Multiple declarations of the same entity are allowed, but only one definition
    is allowed, the essence of ODR, One Definition Rule.


    The code example:


    ```

    struct S { }; // via thirdparty.h

    //...

    struct S { };

    //...

    S s;

    ```'
