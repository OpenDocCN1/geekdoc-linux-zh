    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_122_0.png)\n\n请记住，所有函数局部变量的栈内存是在函数入口处分配的，但单个变量可能在稍后进行初始化。\n\
    \n对应内存图的代码示例：\n\nfoo(1);\n\n当我们进入 foo 函数时，分配的栈帧包含了局部变量 `c`，它初始是未初始化的：\n\n```cpp\n\
    void foo(int i) {\n  ...\n}\n```\n\n如果函数参数 `i` 的值为正数，则会跳过局部变量 `c` 的初始化，导致断言失败：\n\
