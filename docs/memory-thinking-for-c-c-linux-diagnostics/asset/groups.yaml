    \n# Virtual Function Call\n\nThis section provides an overview of virtual function\
    \ calls in C++.\n\n# VTBL Layout\n\nThe virtual function calls are implemented\
    \ uniformly by having a specific virtual function table (vtbl or vtable) for each\
    \ structure where addresses of base methods are replaced with those of derived\
    \ methods, if any.\n\n```cpp\nstruct Base {\n    virtual void method1() {}\n \
    \   virtual void method2() {}\n};\n\nstruct Derived : Base {\n    int field;\n\
    \    void method2() override {}\n};\n```\n\n# VPTR and Struct Layout\n\nEvery\
    \ object whose structure has virtual methods has an implicit virtual function\
    \ pointer (vptr) as its member containing the address of the corresponding structure\
    \ functions table. Therefore, each virtual function call from a base pointer is\
    \ easily calculated based on the virtual function table and offset.\n\n```cpp\n\
    Base *pMyBase = &myBase;\npMyBase->method2();\n\npMyBase = &myDerived;\npMyBase->method2();\n\
    ```\n\n# Templates: Introduction\n\nC++ templates and template metaprogramming\
    \ are a vast universe. We only cover this introduction.\n\n# Why Templates?\n\n\
    In the following slides, we briefly cover \"why\" aspects.\n\nTemplates allow\
    \ us to write less code with higher abstractions, delegating implementation details\
    \ to compiler. The compiler checks that template arguments are compatible, for\
    \ example, they implement the required operations and methods.\n\nThe code example:\n\
    \n```cpp\ntemplate<typename T>\nT add (const T& op1, const T& op2)\n{\n    return\
    \ op1 + op2;\n}\nvoid foo() {\n    add<int>(1, 2);\n    add<struct S>(struct S(1),\
    \ struct S(2));\n}\n```\n\n```cpp\nstruct S {\n  S(int val) : val(val) {}\n  S\
    \ operator+(const S& s) const {\n    return S(val + s.val);\n  }\n  int val;\n\
    };\n\n// S operator+(const S& s1, const S& s2)\n// {\n//   return S(s1.val + s2.val);\n\
    // }\n```\n\n# Types of Templates\n\n- Struct templates:\n`template <typename\
    \ T> struct TStruct { T data; }`\n`struct TStruct<int> ts;`\n- Function templates:\n\
    `struct FStruct { template <typename T> T zero() { return T(0); } } fs;`\n`fs.zero<int>();`\n\
    - Variable templates:\n`template <typename T> T zero();`\n`auto z = zero<int>;`\n\
    \nThe following code provides examples for struct, function, and variable template\
    \ categories:\n\n```cpp\ntemplate <typename T> struct TStruct { T data; }\nstruct\
    \ TStruct<int> ts;\n\nstruct FStruct {\n    template <typename T> T zero() { return\
    \ T(0); }\n} fs;\nfs.zero<int>();\n\ntemplate <typename T> T zero{};\nauto z =\
    \ zero<int>;\n```\n\n# Types of Template Parameters\n\nThere are two categories\
    \ of template parameters: type and non-type.\n\nThe code example and the corresponding\
    \ assembly language:\n\n```cpp\ntemplate <int c> decltype(c) constant() { return\
    \ c; }\nconstant<1>();\n```\n\nNon-type template parameters allow the generation\
    \ of very compact code with a distinct purpose, as shown in x64 and ARM64 disassembly:\n\
