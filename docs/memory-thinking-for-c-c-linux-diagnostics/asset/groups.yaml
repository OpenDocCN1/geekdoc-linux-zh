- md: "\n## Invalid Pointer to Structure\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_91_0.png)\n\
    \nHere, we depict an uninitialized pointer that, depending on the memory storage\
    \ type, can be a NULL pointer or some random value.\n\nThe code example:\n\n```\n\
    MyStruct *pMyStruct;\n```\n\n## Invalid Pointer Dereference\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_92_0.png)\n\
    \nDereferencing an uninitialized pointer can have undefined behavior, most likely\
    \ an access violation leading to a crash.\n\nThe code example:\n\n```\nMyStruct\
    \ *pMyStruct;\nMyStruct myStruct = *pMyStruct;\n```\n\n## Wild (Dangling) Pointer\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_93_0.png)\n\nMemory for a structure\
    \ can be dynamically allocated and then deallocated, but if a pointer is not reset\
    \ to some value easy to check, such as 0, then we have a dangling pointer with\
    \ its dereferencing resulting in undefined behavior that could lead to further\
    \ corruption.\n\nThe code example:\n\n```\nMyStruct *pMyStruct = new MyStruct;\n\
    delete pMyStruct;\n\nMyStruct myStruct = *pMyStruct;\n```\n\n## Pointer to Pointer\
    \ to Structure\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_94_0.png)\n\nWe can\
    \ also have pointers to pointers to structures and so on, with double and more\
    \ dereferences needed to get the value. We'll see why we need double-pointers\
    \ later when we discuss passing parameters to functions.\n\nThe code example:\n\
    \n```\nMyStruct *pMyStruct = &myStruct;\nMyStruct **ppMyStruct = &pMyStruct;\n\
    ```\n\n## Pointer to Pointer Dereference\n\n```\nMyStruct *pMyStruct = *ppMyStruct;\n\
    MyStruct myStruct = *pMyStruct;\nmyStruct = **ppMyStruct;\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_95_0.png)\n\
    \nHere, we have double dereference illustrated.\n\nThe code example:\n\n```\n\
    MyStruct *pMyStruct = *ppMyStruct;\nMyStruct myStruct = *pMyStruct;\nmyStruct\
    \ = **ppMyStruct;\n```\n\n## Memory and Structures\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_96_0.png)\n\
    \nNow, we look at the memory representation of structures.\n\n## Addresses and\
    \ Structures\n\n```cpp\nstruct OuterStruct {\n  int field1;\n  struct InnerStruct\
    \ {\n    int field1;\n    int field2;\n  } field2;\n  struct InnerStruct {\n \
    \   int field;\n  } field3;\n  } myStruct;\n```\n\n| | |\n| :--- | :--- |\n| 2ab1000:\
    \ | 2ab1008 |\n| 2ab1004: | ffffffff |\n| 2ab1008: | 2ab1010 |\n| | 2ab100c |\n\
    | 2ab1010: | 00000000 |\n| 2ab1014: | 00000200 |\n\nA structure in memory is a\
    \ sequential collection of memory cells; some be multicell and themselves substructures.\
    \ Each part of its, its member, or structure field has its own address as well,\
    \ in addition to the overall address of the structure.\n\nThe code example corresponding\
    \ to the memory diagram:\n\n```cpp\nstruct OuterStruct {\n  int field1;\n  struct\
    \ InnerStruct {\n    int field1;\n    int field2;\n  } field2;\n  struct InnerStruct\
    \ {\n    int field;\n  } field3;\n  } myStruct;\n```\n\n## Structure Field Access\n\
    \n```cpp\n&myStruct; // 2ab1004\n&myStruct.field1; // 2ab1004\nmyStruct.field1;\
    \ // ffffffff\n&myStruct.field2; // 2ab1008\n&myStruct.field2.field1; // 2ab1008\n\
    myStruct.field2.field1; // 2ab1010\nmyStruct.field2.field2; // 2ab100c\nmyStruct.field2.field2;\
    \ // 2ab100c\n&myStruct.field3; // 2ab1010\nmyStruct.field3.field; // 2ab1010\n\
    myStruct.field3.field; // 0\n```\n\n| 2ab1000 | 2ab1008 |\n| :--- | :--- |\n|\
    \ 2ab1004 | ffffffff |\n| 2ab1008 | 2ab1010 |\n| | 2ab100c |\n| 2ab1010 | 00000000\
    \ |\n| 2ab1014 | 00000200 |\n\nThis example shows field addresses and access when\
    \ we have a structure value. The code example corresponding to the memory diagram:\n\
    \n```cpp\n&myStruct; // 2ab1004\n&myStruct.field1; // 2ab1004\nmyStruct.field1;\
    \ // ffffffff\n&myStruct.field2; // 2ab1008\n&myStruct.field2.field1; // 2ab1008\n\
    myStruct.field2.field1; // 2ab1010\nmyStruct.field2.field2; // 2ab100c\nmyStruct.field2.field2;\
    \ // 2ab100c\n&myStruct.field3; // 2ab1010\nmyStruct.field3.field; // 2ab1010\n\
    myStruct.field3.field; // 0\n```\n\n## Pointers to Structures\n\n```\n2ab1000:\
    \ 2ab1008      2ab1016: 2ab1004\n2ab1004: ffffffff\n2ab1008: 2ab1010         2ab100c\n\
    2ab1010: 00000000\n2ab1014: 00000200\n\nOuterStruct *pMyStruct = &myStruct;\n\
    &myStruct; // 2ab1004\npMyStruct; // 2ab1004\n&pMyStruct; // 2ab1016\n```\n\n\
    A structure has its address. A pointer to a structure is a memory cell that contains\
    \ that address. It has its own address. The code example corresponding to the\
    \ memory diagram:\n\n```cpp\nOuterStruct *pMyStruct = &myStruct;\n&myStruct; //\
    \ 2ab1004\npMyStruct; // 2ab1004\n&pMyStruct; // 2ab1016\n```\n\n## Pointers to\
    \ Structure Fields (Wait, the text says \"Pointers to Structure Fields\")\n\n\
    This example shows field addresses and access when we have a pointer to a value.\
    \ The code example corresponding to the memory diagram:\n\n```cpp\n&myStruct;\
    \ // 2ab1004\n&myStruct.field1; // 2ab1004\nmyStruct.field1; // ffffffff\n&myStruct.field2;\
    \ // 2ab1008\n&myStruct.field2.field1; // 2ab1008\nmyStruct.field2.field1; //\
    \ 2ab1010\nmyStruct.field2.field2; // 2ab100c\nmyStruct.field2.field2; // 2ab100c\n\
    &myStruct.field3; // 2ab1010\nmyStruct.field3.field; // 2ab1010\nmyStruct.field3.field;\
    \ // 0\n```\n\n## Structure Inheritance\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_101_0.png)\n\
    \nStructures can inherit fields from other structures. In case of the same field\
    \ names, the derived structure hides the base structure fields, but they can be\
    \ accessed by explicit structure name qualification:\n\n```cpp\nstruct Base {\n\
    \  int field;\n};\nstruct Derived : Base {\n  int field;\n  int field2;\n} myDerived;\n\
    myDerived.field;\nmyDerived.Base::field;\nBase *pMyBase = &myDerived;\npMyBase->field;\n\
    ```\n\n## Structure Slicing\n\n```cpp\nstruct Base {\n    int field;\n};\nstruct\
    \ Derived : Base {\n    int field2;\n    myDerived { 0 };\n};\nBase myBase = myDerived;\n\
    myDerived = myBase;\nmyDerived = static_cast<Derived>(myBase);\n\nBase *pMyBase\
    \ = &myDerived;\nDerived *pMyStruct = pMyBase;\n\nDerived *pMyStruct = static_cast<Derived*>(pMyBase);\n\
    ```\n\nIt is possible to copy a derived structure to a base structure variable,\
    \ but in this case, the former contents are sliced since the base structure occupies\
    \ less memory. The other way around, from the base structure to the derived, is\
    \ forbidden by default because the compiler't know how to fill the new derived\
    \ fields. However, this can be forced with a static cast where the derived fields\
    \ are filled with the existing adjacent memory content, which can be completely\
    \ random. The same downcast can be done between pointers, but when we try to dereference\
    \ a target pointer to the derived structure later, we may get random data.\n\n\
    The code example:\n\n```cpp\nstruct Base {\n    int field;\n};\n```\n\n```cpp\n\
    struct Derived : Base {\n    int field2;\n} myDerived { 0 };\n\nBase myBase =\
    \ myDerived;\nmyDerived = myBase;\nmyDerived = static_cast<Derived>(myBase);\n\
    \nBase *pMyBase = &myDerived;\nDerived *pMyStruct = pMyBase;\nDerived *pMyStruct\
    \ = static_cast<Derived*>(pMyBase);\n```\n\n## Inheritance Access Level\n\n```cpp\n\
    struct Base {\n    int field;\n}\n\nstruct Derived : private Base {\n    int field;\n\
    \    int field2;\n} myDerived;\n\nmyDerived.field;\nmyDerived.Base::field;\n\n\
    Base *pMyBase = &myDerived;\npMyBase->field;\n```\n\nIt is possible to inherit\
    \ privately. In such a case, the base structure fields are inaccessible from the\
    \ outside, even with the explicit qualification.\n\nThe code example:\n\n```cpp\n\
    struct Base {\n    int field;\n}\n\nstruct Derived : private Base {\n    int field;\n\
    \    int field2;\n} myDerived;\n\nmyDerived.field;\nmyDerived.Base::field;\n\n\
    Base *pMyBase = &myDerived;\npMyBase->field;\n```\n\n## Structures and Classes\
    \ II\n\n```cpp\nstruct Base {\n  // public:\n  int field;\n}\nclass Base {\n \
    \ public:\n  int field;\n}\nstruct Derived : Base // (public)\nclass Derived :\
    \ public Base // (private) {\n  // ...\n}\n```\n\nAgain, structures and classes\
    \ are almost equivalent except for the default inheritance access (and field access),\
    \ which is, by default, public for structures and private for classes. Public\
    \ access needs to be specified explicitly in this training, which is not really\
    \ relevant for memory thinking when looking at built code.\n\nThe code example:\n\
    \n```cpp\nstruct Base {\n  // public:\n  int field;\n}\nclass Base {\n  public:\n\
    \  int field;\n}\nstruct Derived : Base // (public)\n  // ...\n}\nclass Derived\
    \ : public Base // (private) {\n  // ...\n}\n```\n"
  mdcn: "\n\n## 无效的结构指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_91_0.png)\n\n\
    在这里，我们描述了一个未初始化的指针，取决于内存存储类型，它可能是一个 NULL 指针或某个随机值。\n\n代码示例：\n\n```\nMyStruct *pMyStruct;\n\
    ```\n\n## 无效的指针解引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_92_0.png)\n\n对未初始化的指针进行解引用会导致未定义行为，最可能导致访问冲突并崩溃。\n\
    \n代码示例：\n\n```\nMyStruct *pMyStruct;\nMyStruct myStruct = *pMyStruct;\n```\n\n\
    ## 野指针（悬空指针）\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_93_0.png)\n\n结构的内存可以动态分配然后释放，但如果指针没有重置为某些易于检查的值（例如\
    \ 0），我们就会得到一个悬空指针，其解引用将导致可能进一步损坏的未定义行为。\n\n代码示例：\n\n```\nMyStruct *pMyStruct =\
    \ new MyStruct;\ndelete pMyStruct;\n\nMyStruct myStruct = *pMyStruct;\n```\n\n\
    ## 指向指针的指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_94_0.png)\n\n我们也可以拥有指向结构指针的指针等等，需要两次或多次解引用才能获取值。稍后在讨论向函数传递参数时，我们会看到为什么我们需要双指针。\n\
    \n代码示例：\n\n```\nMyStruct *pMyStruct = &myStruct;\nMyStruct **ppMyStruct = &pMyStruct;\n\
    ```\n\n## 指向指针的指针解引用\n\n```\nMyStruct *pMyStruct = *ppMyStruct;\nMyStruct myStruct\
    \ = *pMyStruct;\nmyStruct = **ppMyStruct;\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_95_0.png)\n\
    \n在这里，我们展示了双重解引用。\n\n代码示例：\n\n```\nMyStruct *pMyStruct = *ppMyStruct;\nMyStruct\
    \ myStruct = *pMyStruct;\nmyStruct = **ppMyStruct;\n```\n\n## 内存与结构\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_96_0.png)\n\
    \n现在，我们来看结构的内存表示。\n\n## 地址与结构\n\n```cpp\nstruct OuterStruct {\n  int field1;\n\
    \  struct InnerStruct {\n    int field1;\n    int field2;\n  } field2;\n  struct\
    \ InnerStruct {\n    int field;\n  } field3;\n  } myStruct;\n```\n\n| | |\n| :---\
    \ | :--- |\n| 2ab1000: | 2ab1008 |\n| 2ab1004: | ffffffff |\n| 2ab1008: | 2ab1010\
    \ |\n| | 2ab100c |\n| 2ab1010: | 00000000 |\n| 2ab1014: | 00000200 |\n\n内存中的结构是内存单元的顺序集合；某些是多单元的，且本身也是子结构。除了结构的整体地址外，它的每个部分、其成员或结构字段也有它们自己的地址。\n\
    \n与内存图对应的代码示例：\n\n```cpp\nstruct OuterStruct {\n  int field1;\n  struct InnerStruct\
    \ {\n    int field1;\n    int field2;\n  } field2;\n  struct InnerStruct {\n \
    \   int field;\n  } field3;\n  } myStruct;\n```\n\n## 结构字段访问\n\n```cpp\n&myStruct;\
    \ // 2ab1004\n&myStruct.field1; // 2ab1004\nmyStruct.field1; // ffffffff\n&myStruct.field2;\
    \ // 2ab1008\n&myStruct.field2.field1; // 2ab1008\nmyStruct.field2.field1; //\
    \ 2ab1010\nmyStruct.field2.field2; // 2ab100c\nmyStruct.field2.field2; // 2ab100c\n\
    &myStruct.field3; // 2ab1010\nmyStruct.field3.field; // 2ab1010\nmyStruct.field3.field;\
    \ // 0\n```\n\n| 2ab1000 | 2ab1008 |\n| :--- | :--- |\n| 2ab1004 | ffffffff |\n\
    | 2ab1008 | 2ab1010 |\n| | 2ab100c |\n| 2ab1010 | 00000000 |\n| 2ab1014 | 00000200\
    \ |\n\n此示例展示了当我们有一个结构值时的字段地址和访问情况。与内存图对应的代码示例：\n\n```cpp\n&myStruct; // 2ab1004\n\
    &myStruct.field1; // 2ab1004\nmyStruct.field1; // ffffffff\n&myStruct.field2;\
    \ // 2ab1008\n&myStruct.field2.field1; // 2ab1008\nmyStruct.field2.field1; //\
    \ 2ab1010\nmyStruct.field2.field2; // 2ab100c\nmyStruct.field2.field2; // 2ab100c\n\
    &myStruct.field3; // 2ab1010\nmyStruct.field3.field; // 2ab1010\nmyStruct.field3.field;\
    \ // 0\n```\n\n## 指向结构的指针\n\n```\n2ab1000: 2ab1008      2ab1016: 2ab1004\n2ab1004:\
    \ ffffffff\n2ab1008: 2ab1010         2ab100c\n2ab1010: 0000000\n2ab1014: 0000020\n\
    \nOuterStruct *pMyStruct = &myStruct;\n&myStruct; // 2ab1004\npMyStruct; // 2ab1004\n\
    &pMyStruct; // 2ab116\n```\n\n结构有一个地址。指向结构的指针是一个包含该地址的内存单元。它有自己的地址。与内存图对应的代码示例：\n\
    \n```cpp\nOuterStruct *pMyStruct = &myStruct;\n&myStruct; // 2ab1004\npMyStruct;\
    \ // 2ab1004\n&pMyStruct; // 2ab016\n```\n\n## 指向结构字段的指针（等等，说是“指向结构字段的指针”）\n\n\
    此示例展示了当我们有一个指向值的指针时的字段地址和访问。与内存图对应的代码示例：\n\n```cpp\n&myStruct; // 2ab1004\n&myStruct.field1;\
    \ // 2ab1004\nmyStruct.field1; // ffffffff\n&myStruct.field2; // 2ab1008\n&myStruct.field2.field1;\
    \ // 2ab1008\nmyStruct.field2.field1; // 2ab1010\nmyStruct.field2.field2; // 2ab100c\n\
    myStruct.field2.field2; // 2ab100c\n&myStruct.field3; // 2ab1010\nmyStruct.field3.field;\
    \ // 2ab1010\nmyStruct.field3.field; // 0\n```\n\n## 结构继承\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_101_0.png)\n\
    \n结构可以从其他结构继承字段。在字段相同的情况下，派生结构隐藏了基结构字段，但可以通过显式结构限定来访问：\n\n```cpp\nstruct Base\
    \ {\n  int field;\n};\nstruct Derived : Base {\n  int field;\n  int field2;\n\
    } myDerived;\nmyDerived.field;\nmyDerived.Base::field;\nBase *pMyBase = &myDerived;\n\
    pMyBase->field;\n```\n\n## 结构切片\n\n```cpp\nstruct Base {\n    int field;\n};\n\
    struct Derived : Base {\n    int field2;\n    myDerived { 0 };\n};\nBase myBase\
    \ = myDerived;\nmyDerived = myBase;\nmyDerived = static_cast<Derived>(myBase);\n\
    \nBase *pMyBase = &myDerived;\nDerived *pMyStruct = pMyBase;\n\nDerived *pMyStruct\
    \ = static_cast<Derived*>(pMyBase);\n```\n\n可以将派生结构拷贝到基结构变量，但在这种情况下由于基结构占据内存较少，以前的内容会被切片。相反，从基结构到派生结构默认是被禁止的，因为编译器不知道如何填充新的派生字段。然而，可以通过\
    \ `static cast` 强制执行，派生字段将用现有的相邻内容填充，这些内容可能是完全随机的。指针之间也可以进行相同的向下转换，但当我们以后尝试解引用指向派生结构的指针时，可能会得到随机数据。\n\
    \n代码示例：\n\n```cpp\nstruct Base {\n    int field;\n};\n```\n\n```cpp\nstruct Derived\
    \ : Base {\n    int field2;\n} myDerived { 0 };\n\nBase myBase = myDerived;\n\
    myDerived = myBase;\nmyDerived = static_cast<Derived>(myBase);\n\nBase *pMyBase\
    \ = &myDerived;\nDerived *pMyStruct = pMyBase;\nDerived *pMyStruct = static_cast<Derived*>(pMyBase);\n\
    ```\n\n## 继承访问级别\n\n```cpp\nstruct Base {\n    int field;\n}\n\nstruct Derived\
    \ : private Base {\n    int field;\n    int field2;\n} myDerived;\n\nmyDerived.field;\n\
    myDerived.Base::field;\n\nBase *pMyBase = &myDerived;\npMyBase->field;\n```\n\n\
    可以进行私有继承。在这种情况下，基结构字段从外部无法访问，即使使用显式限定也也不行。\n\n代码示例：\n\n```cpp\nstruct Base {\n\
    \    int field;\n}\n\nstruct Derived : private Base {\n    int field;\n    int\
    \ field2;\n} myDerived;\n\nmyDerived.field;\nmyDerived.Base::field;\n\nBase *pMyBase\
    \ = &myDerived;\npMyBase->field;\n```\n\n## 结构与类 II\n\n```cpp\nstruct Base {\n\
    \  // public:\n  int field;\n}\nclass Base {\n  public:\n  int field;\n}\nstruct\
    \ Derived : Base // (public)\nclass Derived : public Base // (private) {\n  //\
    \ ...\n}\n```\n\n再次，结构和类几乎等同，除了默认继承访问（以及字段访问）外，默认情况下结构是公开的，而类是私有的。在本次训练中需要显式指定公开访问，这对于在查看构建代码时进行内存思维并不重要。\n\
    \n代码示例：\n\n```cpp\nstruct Base {\n  // public:\n  int field;\n}\nclass Base {\n\
    \  public:\n  int field;\n}\nstruct Derived : Base // (public)\nclass Derived\
    \ : public Base // (private) {\n  // ...\n}\n```\n\n"
