    \ = 0;\nmyStruct1.shared_field = 123;\nmyStruct2.field = 1;\n```\n\nThe latest\
    \ C++ standards allow static field initialization inside the structure instead\
    \ of the classic C++ ways of outside (shown in comments).\n\nThe code example:\n\
    \n```cpp\nstruct MyStruct {\n    int field;\n    inline unsigned shared_field{123};\n\
    } myStruct1, myStruct2;\n\n// unsigned MyStruct::shared_field = 123;\n\nmyStruct1.field\
    \ = 0;\nmyStruct1.shared_field = 123;\nmyStruct2.field = 1;\n```\n\n# Macros,\
    \ Types, and Synonyms\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_113_0.png)\n\
    \nType names may be long or inconvenient. There are some ways to construct easier\
    \ names.\n\n# Macros\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_114_0.png)\n\n\
    ```cpp\n#define TRUE 1\n#define byte_t unsigned char\n#define p_byte_t unsigned\
    \ char *\n#define p_MyStruct MyStruct *\n```\n\n# Old Way\n\n```cpp\ntypedef unsigned\
    \ char byte_t;\ntypedef unsigned char *p_byte_t;\ntypedef unsigned char byte_t,\
    \ *p_byte_t;\ntypedef struct {} MyStruct, *p_MyStruct;\n```\n\nThe code example:\n\
    \n```cpp\ntypedef unsigned char byte_t;\ntypedef unsigned char *p_byte_t;\ntypedef\
    \ unsigned char byte_t, *p_byte_t;\ntypedef struct {} MyStruct, *p_MyStruct;\n\
    ```\n\n# New Way\n\n```cpp\nusing byte_t = unsigned char;\nusing p_byte_t = unsigned\
    \ char *;\nusing MyStruct = struct {};\n```\n\nThe code example:\n\n```cpp\nusing\
    \ byte_t = unsigned char;\nusing p_byte_t = unsigned char *;\nusing MyStruct =\
    \ struct {};\n```\n\n# Memory Storage\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_117_0.png)\n\
    \nWhat memory storage is used to store values ultimately influences program behavior\
    \ and possible defects.\n\n# Overview\n\n- Global (link)\n- TU static (file)\n\
    - Function static\n- Local (stack)\n- Dynamic (heap)\n- Local-dynamic (stack →\
