- md: "\n## Conceptual Layer (Design)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_141_0.png)\n\
    \nIn the design layer, we may want to separate implementation details.\n\n## Incomplete\
    \ Types\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_142_0.png)\n\n```cpp\nstruct\
    \ MyStruct; // declaration\n\nstruct MyStruct *pMyStruct; // (declaration and)\
    \ definition\n\n// Pimpl (Pointer to Implementation) idiom\n\nstruct Instrument\
    \ // (declaration and) definition\n{\n    int getMeasurement(); // declaration\n\
    private:\n    struct InstrumentImpl; // declaration\n    struct InstrumentImpl\
    \ *pImpl; // definition\n};\n```\n\nSuch separation is achieved via incomplete\
    \ types and the so-called Pimpl (Pointer to Implementation) idiom:\n\n```cpp\n\
    struct MyStruct; // declaration\nstruct MyStruct *pMyStruct; // (declaration and)\
    \ definition\n// Pimpl (Pointer to Implementation) idiom\nstruct Instrument //\
    \ (declaration and) definition\n{\n    int getMeasurement(); // declaration\n\
    private:\n    struct InstrumentImpl; // declaration\n    struct InstrumentImpl\
    \ *pImpl; // definition\n};\n```\n\n## References\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_143_0.png)\n\
    \nNow, a slide for C++ references. We plan to extend this section in the second\
    \ edition.\n\n## Type& vs. Type*\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_144_0.png)\n\
    \nFrom the memory perspective, references and pointers are the same thing. The\
    \ only difference is that you cannot have a dangling reference; it must be initialized.\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_145_0.png)\n\nLet's now briefly discuss\
    \ various categories of values. These are what are stored in memory. A pointer\
    \ value is also a value that is interpreted as a memory address pointing to some\
    \ other value elsewhere.\n\n## Value Categories\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_146_0.png)\n\
    \nWhen reading C++ documentation, you frequently see the so-called lvalues and\
    \ rvalues mentioned. Crudely, you can think about them as left and right values\
    \ in expressions, where the right value can be temporary, and the left value has\
    \ to be backed up by some memory.\n\n## Classification\n\nhttps://en.cppreference.com/w/cpp/language/value_category\n\
    \n## Constant Values\n\n## Constant Values\n\n```cpp\nconst int cv{1}; int v;\n\
    const int *pc;\nint * const cp = v;\nconst int * const cpc{cp};\nconst int& rc{v};\
    \ int& r{v};\n```\n\nThe values can also be constant, facilitating functional\
    \ programming and code security. Please note that there can be pointers and references\
    \ to constant values, constant pointers to mutable variables, and both. The way\
    \ to read such declarations is from right to left.\n\nThe code examples:\n\n```cpp\n\
    const int cv{1}; int v;\nconst int *pc;\nint * const cp = v;\nconst int * const\
    \ cpc{cp};\nconst int& rc{v}; int& r{v};\n```\n\n## Constant Expressions\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_148_0.png)\n\
    \nThere are different ways to define constants for later symbolic use. The C and\
    \ classic C++ way uses preprocessor (legacy) and const. The modern way is to use\
    \ constexpr, which is more flexible.\n\nCode examples:\n\n```cpp\n#define myConst\
    \ 1\nconst int myConst = 1;\nconstexpr int myConst = 1;\n```\n\n## Functions\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_149_0.png)\n\nThis section is the largest\
    \ in the course. We may split it up in the second edition once it grows more.\n\
    \n## Pointers to Functions\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_150_0.png)\n\
    \nFunctions are code bytes and, therefore, occupy some memory locations with their\
    \ start addresses.\n\nThe code examples corresponding to the memory diagram:\n\
    \n```cpp\nint foo (int i)\n{\n// ...\nreturn 0;\n}\n```\n\nIt is possible to have\
    \ pointers and references to functions:\n\n```cpp\nint (*pf) (int) {foo};\npf\
    \ = &foo;\nint (&rf) (int) {*pf};\n```\n\nWhen having a pointer or reference to\
    \ a function, it is possible to call the function with or without using the dereferencing\
    \ syntax (*):\n\n```cpp\npf(10);\n(*pf)(10);\nrf(10);\n```\n\n## Function Pointer\
    \ Types\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_152_0.png)\n\nFunction pointer\
    \ type declarations can be done using typedef or the more modern using alias.\n\
    \nThe code examples:\n\n```cpp\ntypedef int (*PF)(int);\nusing PF = int (*)(int);\n\
    ```\n\n## Reading Declarations\n\n## Reading Declarations\n\n- Right → Left\n\
    - Left → Right\n\nIt is worth knowing the rules of reading declarations since\
    \ function pointer types can be complicated. The first example reads as an array\
    \ of pointers to constant integers. The next example is a pointer to a function\
    \ that accepts a pointer to a constant and returns an integer, and another is\
    \ a pointer to a function that accepts an integer and returns an integer. It can\
    \ be simplified by using such types.\n\n## Structure Function Fields\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_154_0.png)\n\
    \nStructures may contain fields that are pointers to functions: the obvious way\
    \ to implement in C.\n\nThe code example:\n\n```cpp\nstruct {\n    int field;\n\
    \    int (*pFunc)(int);\n};\n```\n\n## Structure Methods\n\nC++ introduced structure\
    \ or class methods. They can be defined either inside the structure definition\
    \ or outside with the structure qualification.\n\nThe code example:\n\n```cpp\n\
    struct MyStruct\n{\n    int field;\n    int method(int i) { return i; }\n};\n\n\
    int MyStruct::method(int i) { return i; }\n```\n\n## Structure Methods (Inlined)\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_156_0.png)\n\nThis is an alternative\
    \ way to define short functions, although it exposes users to implementation details.\n\
    \nThe code example:\n\n```cpp\nstruct MyStruct {\n    int field;\n    int method(int\
    \ i) { return i; }\n};\n```\n\n## Structure Methods (Inheritance)\n\n```cpp\n\
    struct Base\n{\n    int method(int i) { return i; }\n};\n\nstruct Derived : Base\n\
    {\n    int method(int i) { return ++i; }\n} myDerived;\n\nmyDerived.method(0);\n\
    myDerived.Base::method(0);\n\nBase *pMyBase = &myDerived;\npMyBase->method(0);\n\
    ```\n\nIn the case of inheritance, like with fields, the derived structure methods\
    \ hide methods with the same name in the base type unless explicit base type name\
    \ qualification is used. However, when we have a pointer to a base type, then\
    \ the base type method is called even if the actual object belongs to the derived\
    \ type:\n\n```cpp\nstruct Base\n{\n    int method(int i) { return i; }\n};\n\n\
    struct Derived : Base\n{\n    int method(int i) { return ++i; }\n} myDerived;\n\
    \nmyDerived.method(0);\nmyDerived.Base::method(0);\n```\n\n```cpp\nBase *pMyBase\
    \ = &myDerived;\npMyBase->method(0);\n```\n\n## Structure Virtual Methods\n\n\
    ```cpp\nstruct Base\n{\n    int method(int i) { return i; }\n    virtual int vmethod(int\
    \ i) { return i; }\n};\nstruct Derived : Base\n{\n    int method(int i) { return\
    \ ++i; }\n    virtual int vmethod(int i) override { return ++i; }\n} myDerived;\n\
    \nBase *pMyBase = &MyDerived;\npMyBase->method(0);\npMyBase->vmethod(0);\npMyBase->Base::vmethod(0);\n\
    ```\n\nThis previous slide problem is solved by introducing type-independent call\
    \ virtual methods. In this case, the method of derived type is called when we\
    \ have a pointer of a base type to it. The override specify guarantees that we\
    \ override the correct base method instead of introducing the new one by mistake:\n"
  mdcn: "\n\n## 概念层（设计）\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_141_0.png)\n\n\
    在设计层，我们可能想要分离实现细节。\n\n## 不完全类型\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_142_0.png)\n\
    \n```cpp\nstruct MyStruct; // 声明\n\nstruct MyStruct *pMyStruct; // （声明和）定义\n\n\
    // Pimpl（指向实现的指针）惯用法\n\nstruct Instrument // （声明和）定义\n{\n    int getMeasurement();\
    \ // 声明\nprivate:\n    struct InstrumentImpl; // 声明\n    struct InstrumentImpl\
    \ *pImpl; // 定义\n};\n```\n\n这种分离通过不完全类型和所谓的 Pimpl（指向实现的指针）惯用法实现：\n\n```cpp\nstruct\
    \ MyStruct; // 声明\nstruct MyStruct *pMyStruct; // （声明和）定义\n// Pimpl（指向实现的指针）惯用法\n\
    struct Instrument // （声明和）定义\n{\n    int getMeasurement(); // 声明\nprivate:\n \
    \   struct InstrumentImpl; // 声明\n    struct InstrumentImpl *pImpl; // 定义\n};\n\
    ```\n\n## 引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_143_0.png)\n\n现在是一张关于\
    \ C++ 引用的幻灯片。我们计划在第二版中扩展这一部分。\n\n## Type& vs Type*\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_144_0.png)\n\
    \n从内存角度来看，引用和指针是同一个东西。唯一的区别是你可以不能拥有悬空引用；它必须被初始化。\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_145_0.png)\n\
    \n现在让我们简要讨论值的各种类别。这些是存储在内存中的内容。指针值也是一个被解释为指向别处某个值的内存地址的值。\n\n## 值类别\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_146_0.png)\n\
    \n在阅读 C++ 文档时，你经常看到所谓的左值（lvalues）和右值（rvalues）。简单来说，你可以将它们视为表达式中的左值和右值，右值可以是临时的，而左值必须由某些内存支持。\n\
    \n## 分类\n\nhttps://en.cppreference.com/w/cpp/language/value_category\n\n## 常量\n\
    \n## 常量\n\n```cpp\nconst int cv{1}; int v;\nconst int *pc;\nint * const cp = v;\n\
    const int * const cpc{cp};\nconst int& rc{v}; int& r{v};\n```\n\n值也可以常量，有助于函数式编程和代码安全。请注意，可以指向常量值的指针和引用、指向可变变量的常量指针以及两者兼有。读取此类声明的方法是从右到左。\n\
    \n代码示例：\n\n```cpp\nconst int cv{1}; int v;\nconst int *pc;\nint * const cp = v;\n\
    const int * const cpc{cp};\nconst int& rc{v}; int& r{v};\n```\n\n## 常量表达式\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_148_0.png)\n\n有不同的方法定义供后续符号使用的常量。C 和经典的\
    \ C++ 方式使用预处理器（遗留）和 `const`。现代方法是使用 `constexpr`，它更灵活。\n\n代码示例：\n\n```cpp\n#define\
    \ myConst 1\nconst int myConst = 1;\nconstexpr int myConst = 1;\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_149_0.png)\n\
    \n这种分离是由于不完全类型和所谓的 Pimpl 模式。\n\n## 指向函数的指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_150_0.png)\n\
    \n这种分离是由于不完全类型和所谓的 Pimpl 模式。\n\n## 函数\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_151_0.png)\n\
    \n这种分离是由于不完全类型和所谓的 Pimpl 模式。\n\n## 指针类型\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_152_0.png)\n\
    \n这种分离是由于不完全类型和所谓的 Pimpl 模式。\n\n## 引用类型\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_153_0.png)\n\
    \n这种分离是由于不完全类型和所谓的 Pimpl 模式。\n\n## 引用声明\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_154_0.png)\n\
    \n这种分离是由于不完全类型和所谓的 Pimpl 模式。\n\n## 结构体\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_155_0.png)\n\
    \n这种分离是由于不完全类型和所谓的 Pimpl 模式。\n\n## 虚方法\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_156_0.png)\n\
    \n这种分离是由于不完全类型和所谓的 Pimpl 模式。\n\n"
