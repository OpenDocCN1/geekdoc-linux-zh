    Pointers, as entities, may contain names, and these names may be names of pointers,
    too. If a pointer contains only a name, we say the pointer value is the name.
    So, the pointer value can be another pointer value, and the latter pointer value
    is the name of some other entity.'
  - '[PAGE 46]


    # Pointers as Entities


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_46_0.png)


    Pointer dereference is an act. If we put acts aside, pointers are just entities
    with some content that can be interpreted as a name if necessary. All these dereferences
    happen only at runtime. The pointer content (its value) may be invalid for all
    time without any problem until we use it.'
  - '[PAGE 47]


    # Memory and Pointers


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_47_0.png)


    Now, we look at the memory representation of pointers and entities they point
    to.'
  - '[PAGE 48]


    # Mental Exercise


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_48_0.png)


    Here, in this picture, entities are the so-called memory cells. Memory cells have
    addresses that start from 0 and are usually incremented by the so-called pointer
    size, which is 4 on 32-bit systems and 8 on 64-bit systems. Here, for visual clarity,
    we use memory cells from a 32-bit system.'
  - '[PAGE 49]


    # Debugger Memory Layout


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_49_0.png)


    When we use a debugger, it prints memory cell addresses and their contents in
    a certain layout shown on this slide. Some debugger commands, such as x in GDB,
    use 2-column and some n-column layouts to print memory.'
  - "[PAGE 50]\n\n# Memory Dereference Layout\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_50_0.png)\n\
    \nFor a 2-column format, some debuggers and their commands may interpret the second\
    \ column as a pointer. In such a case, the third column is a value from a pointer\
    \ dereference. Also, notice a case when a pointer points to itself. For GDB, it\
    \ is possible to emulate such behavior using a custom script:\n\n```\ndefine dpp\n\
    \    set $i = 0\n    set $p = $arg0\n    while $i < $arg1\n        printf \"%p:\
    \ \" , $p\n        x/gx *(long *)$$p\n        set $i = $i + 1\n        set $p\
    \ = $p + 8\nend\n```\n\nend"
- md: "\n## Names as Addresses\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_51_0.png)\n\
    \n| 2ab1000: 2ab1008 |\n| 2ab1004: ffffffff |\n| 2ab1008: 2ab1010 |\n| 2ab100c:\
    \ 2ab100c |\n| 2ab1010: 00000000 |\n| 2ab1014: 00002000 |\n\nTo repeat, for memory\
    \ layout, names are interpreted as addresses, and memory cell content (cell value)\
    \ can also be interpreted as a memory address.\n\n## Addresses and Entities\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_52_0.png)\n\nEntities can be either single\
    \ cells or multicells. Each part of a multicell can be interpreted as a memory\
    \ address, if necessary, even if it wasn’t meant to be a memory address.\n\n##\
    \ Addresses and Structures\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_53_0.png)\n\
    \nA structure in memory is a sequential collection of memory cells; some may be\
    \ multicell and themselves substructures. Each part of a structure, its member,\
    \ or structure field has its its own address as well, in addition to the overall\
    \ address of the structure.\n\n## Pointers to Structures\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_54_0.png)\n\
    \nA structure has its address. A pointer to a structure is a memory cell that\
    \ contains that address. It has its own address.\n\n## Arrays\n\n| 2ab1000: 2ab1008\
    \ | 2ab1000: 2ab1008 |\n| 2ab1004: ffffffff | ffffffff |\n| 2ab1008: 2ab1010 |\
    \ 2ab1008: 2ab1010 |\n| 2ab100c: 2ab100c | 2ab100c: |\n| 2ab1010: 00000000 | 2ab1010:\
    \ 00000000 |\n| 2ab1014: 00002000 | 00002000 |\n\nAn array is a contiguous sequence\
    \ of n-cells in memory called array elements. Each array element has its own address.\
    \ Since the size of each array element is fixed and the same, addressing the random\
    \ element is fast.\n\n## Arrays and Pointers to Arrays\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_56_0.png)\n\
    \nThe array address is the address of its first element. But a pointer to an array\
    \ is a different memory cell that contains the array address. This is similar\
    \ to structures and pointers to structures. An array can be considered as a structure\
    \ as well.\n\n## Strings and Pointers to Strings\n\n```\n2ab1000: 'H'\n2ab1001:\
    \ 'e'\n2ab1002: '1'\n2ab1003: '1'\n2ab1004: 'o'\n2ab1005: 00\n2ab1216: 2ab1000\n\
    ```\n\nWhat about strings? An ASCII string is a zero-terminated array of one-byte\
    \ memory cells. The address of a string is the address of its first byte. Similar\
    \ to arrays, a pointer to a string is a memory cell that contains the address\
    \ of the string, the address of its first element – its first character.\n\n##\
    \ Basic Types\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_58_0.png)\n\nNow, we\
    \ look at a few fundamental basic types.\n\n## ASCII Characters and Pointers\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_59_0.png)\n\nWe have already looked\
    \ at ASCII zero-terminated strings and pointers conceptually using memory diagrams.\
    \ Here, we look at some idiomatic C code.\n\nThe code example corresponding to\
    \ the memory diagram:\n\n```\nchar c; // pstr == 2ab1000\n&pstr; // 2ab1216\n\
    c = *pstr; // c == 'H'\n++pstr; // 2ab1001\nc = *pstr; // c == 'e'\nc = *(pstr+1);\
    \ // c == 'l'\n```\n\n## Bytes and Pointers\n\n| 2ab1000: | 12 | 2ab1216: | 2ab1000\
    \ |\n| 2ab1001: | 34 | unsigned char b; |\n| 2ab1002: | 56 | unsigned char *pb;\
    \ // 2ab1000 |\n| 2ab1003: | 78 | // 2ab1216 |\n| 2ab1004: | ab | b = *pb; //\
    \ b == 12 |\n| 2ab1005: | cd | // 2ab1001 |\n| | | b = *pb; // b == 34 |\n| |\
    \ | b = *(pb+1); // b == 56 |\n\nCharacters are signed with small integer values\
    \ from -128 to 127. But if we want to work with bytes with unsigned values from\
    \ 0 to 255, we need use unsigned characters. Later, we see what other types are\
    \ available to work with bytes.\n\nThe code example corresponding to the memory\
    \ diagram:\n\n```\nunsigned char b;\nunsigned char *pb; // pb == 2ab1000\n&pb;\
    \ // 2ab1216\nb = *pb; // b == 12\n++pb; // 2ab1001\nb = *pb; // b == 34\nb =\
    \ *(pb+1); // b == 56\n```\n\n## Wide Characters and Pointers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_61_0.png)\n\
    \nIf you want to use Unicode, it is natural to use wide characters that occupy\
    \ two bytes.\n\nThe code example corresponding to the memory diagram:\n\n```\n\
    wchar_t wc;\nwchar_t *pwstr; // pwstr == 2ab1000\n&pwstr; // 2ab1216\nwc = *pwstr;\
    \ // wc == L'H'\n++pwstr; // 2ab1002\nwc = *pwstr; // wc == L'e'\nwc = *(pwstr+1);\
    \ // wc == L'\\0'\n```\n\n## Integers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_62_0.png)\n\
    \nThe second type we look at now is integers, which occupy 4 bytes.\n\nThe code\
    \ example corresponding to the memory diagram:\n\n```\nint i; // 2ab1000\nint\
    \ *pi; // 2ab1216\n&pi; // i == 0x2ab008\ni = *pi; // 2ab1004\n++pi; // i == 0xffffffff\n\
    i = *pi; // i == -1\ni = *(pi+1); // i == 0x2ab1010\n```\n\n## Little-Endian System\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_63_0.png)\n\n| 2ab1000: | 1 | char\
    \ ba[4]; // {1, 2, 3, 4 } |\n| 2ab1001: | 2 | int i; // 0x4030201 |\n| 2ab1002:\
    \ | 3 | |\n| 2ab1003: | 4 | x86_64 |\n| 2ab1004: | 5 | Move Data After Swapping\
    \ |\n| 2ab1005: | 6 | |\n\nWhen converting between byte sequences and number values,\
    \ we need to consider the little-endian system where the least significant digits\
    \ reside at the lowest memory addresses.\n\nThe code example corresponding to\
    \ the memory diagram:\n\n```\nchar ba[4]; // { 1, 2, 3, 4 }\nint i; // 0x4030201\n\
    ```\n\n## Short Integers\n\n```\n2ab1000: 2ab1008      2ab1216: 2ab1000\n2ab1004:\
    \ ffff\n2ab1008: 2ab1010      short s;      // 2ab1000\n                     \
    \    short *ps;    // 2ab1216\n                         &ps;          // s = 0x1008\n\
    \                         s = *ps;      // 2ab1002\n2ab100c: 2ab100c       s =\
    \ *ps;      // s = 0x2ab\n                         ++ps;\n2ab1010: 00000000  \
    \    s = *(ps+1); // s = 0xffff\n2ab1014: 00002000\n```\n\nShort integers occupy\
    \ 2 bytes.\n\nThe code example corresponding to the memory diagram:\n\n```\nshort\
    \ s;      // 2ab1000\nshort *ps;    // 2ab1216\n&ps;          \ns = *ps;     \
    \ // s = 0x1008\n++ps;         // 2ab1002\ns = *ps;      // s = 0x2ab\ns = *(ps+1);\
    \ // s = 0xffff\n```\n\n## Long and Long Long Integers\n\n| 2ab1000: 2ab1008 |\
    \ 2ab1000: 2ab1008 |\n| 2ab1004: ffffffff | ffffffff |\n| 2ab1008: 2ab1010 | 2ab1008:\
    \ 2ab1010 |\n| 2ab100c: 2ab100c | 2ab100c: |\n| 2ab1010: 00000000 | 2ab1010: 00000000\
    \ |\n| 2ab1014: 00002000 | 00002000 |\n\nIf we want to use Unicode, it is natural\
    \ to use wide characters that occupy two bytes.\n\nThe code example corresponding\
    \ to the memory diagram:\n\n```\nwchar_t wc;\nwchar_t *pwstr; // pwstr == 2ab1000\n\
    &pwstr; // 2ab1216\nwc = *pwstr; // wc == L'H'\n++pwstr; // 2ab1002\nwc = *pwstr;\
    \ // wc == L'e'\nwc = *(pwstr+1); // wc == L'\\0'\n```\n\n## Integers\n\n```\n\
    int i; // 2ab1000\nint *pi; // 2ab1216\n&pi; // i == 0x2ab008\ni = *pi; // 2ab1004\n\
    ++pi; // i == 0xffffffff\ni = *pi; // i == -1\ni = *(pi+1); // i == 0x2ab1010\n\
    ```\n\n## Little-Endian System\n\n| 2ab1000: 1 | char ba[4]; // {1, 2, 3, 4 }\
    \ |\n| 2ab1001: 2 | int i; // 0x4030201 |\n| 2ab1002: 3 | |\n| 2ab1003: 4 | x86_64\
    \ |\n| 2ab1004: 5 | Move Data After Swapping |\n| 2ab1005: 6 | |\n\nWhen converting\
    \ between byte sequences and number values, we need to consider the little-endian\
    \ system where the least significant digits reside at the lowest memory addresses.\n\
    \nThe code example corresponding to the memory diagram:\n\n```\nchar ba[4]; //\
    \ { 1, 2, 3, 4 }\nint i; // 0x4030201\n```\n\n## Short Integers\n\n```\nshort\
    \ s;      // 2ab1000\nshort *ps;    // 2ab1216\n&ps;          \ns = *ps;     \
    \ // s = 0x1008\n++ps;         // 2ab1002\ns = *ps;      // s = 0x2ab\ns = *(ps+1);\
    \ // s = 0xffff\n```\n\n## Long and Long Integers\n\n| 2ab1000: 2ab1008 | 2ab1000:\
    \ 2ab1008 |\n| 2ab1004: ffffffff | ffffffff |\n| 2ab1008: 2ab1010 | 2ab1008: 2ab1010\
    \ |\n| 2ab100c: 2ab100c | 2ab100c: |\n| 2ab1010: 00000000 | 2ab1010: 00000000\
    \ |\n| 2ab1014: 00002000 | 00002000 |\n\nIf we want to use Unicode, it is natural\
    \ to use wide characters that occupy two bytes.\n\nThe code example corresponding\
    \ to the memory diagram:\n\n```\nwchar_t wc;\nwchar_t *pwstr; // pwstr == 2ab1000\n\
    &pwstr; // 2ab1216\nwc = *pwstr; // wc == L'H'\n++pwstr; // 2ab1002\nwc = *pwstr;\
    \ // wc == L'e'\nwc = *(pwstr+1); // wc == L'\\0'\n```\n\n## Integers\n\n```\n\
    int i; // 2ab1000\nint *pi; // 2ab1216\n&pi; // i == 0x2ab008\ni = *pi; // 2ab1004\n\
    ++pi; // i == 0xffffffff\ni = *pi; // i == -1\ni = *(pi+1); // i == 0x2ab1010\n\
    ```\n\n## Little-Endian System\n\n| 2ab1000: 1 | char ba[4]; // {1, 2, 3, 4 }\
    \ |\n| 2ab1001: 2 | int i; // 0x4030201 |\n| 2ab1002: 3 | |\n| 2ab1003: 4 | x86_64\
    \ |\n| 2ab1004: 5 | Move Data After Swapping |\n| 2ab1005: 6 | |\n\nWhen converting\
    \ between between byte sequences and number values, we need to consider the little-endian\
    \ system where the least significant digits reside at the lowest memory addresses.\n\
    \nThe code example corresponding to the memory diagram:\n\n```\nchar ba[4]; //\
    \ { 1, 2, 3, 4 }\nint i; // 0x4030201\n```\n"
  mdcn: "\n\n## 名称作为地址\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_51_0.png)\n\n|\
    \ 2ab1000: 2ab1008 |\n| 2ab1004: ffffffff |\n| 2ab1008: 2ab1010 |\n| 2ab100c:\
    \ 2ab100c |\n| 2ab1010: 00000000 |\n| 2ab1014: 00002000 |\n\n重申一遍，对于内存布局来说，名称被解释为地址，而内存单元的内容（单元值）也可以被解释为内存地址。\n\
    \n## 地址与实体\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_52_0.png)\n\n实体可以是单个单元，也可以是多单元。如果需要，多单元的每个部分都可以被解释为内存地址，即使它原本并不是一个内存地址。\n\
    \n## 地址与结构\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_53_0.png)\n\n内存中的结构是内存单元的顺序集合；某些可能是多单元，且其本身也是子结构。结构的每个部分（其成员或结构字段）除了结构的整体地址外，也有它们自己的地址。\n\
    \n## 指向结构的指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_54_0.png)\n\n结构有自己的地址。指向结构的指针是一个包含该地址的内存单元。它有自己的地址。\n\
    \n## 数组\n\n| 2ab1000: 2ab1008 | 2ab1000: 2ab1008 |\n| 2ab1004: ffffffff | ffffffff\
    \ |\n| 2ab1008: 2ab1010 | 2ab1008: 2ab1010 |\n| 2ab100c: 2ab100c | 2ab100c: |\n\
    | 2ab1010: 00000000 | 2ab1010: 00000000 |\n| 2ab1014: 00002000 | 00002000 |\n\n\
    数组是内存中连续的 n 个单元的序列，称为数组元素。每个数组元素都有它们自己的地址。由于每个数组元素的大小是固定且相同的，因此访问随机元素的速度非常快。\n\
    \n## 数组与指向数组的指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_56_0.png)\n\n数组地址是其第一个元素的地址。但指向数组的指针是包含数组地址的另一个内存单元。这与结构以及指向结构的指针相似。数组也可以被视为一种结构。\n\
    \n## 字符串与指向字符串的指针\n\n```\n2ab1000: 'H'\n2ab1001: 'e'\n2ab1002: '1'\n2ab1003: '1'\n\
    2ab1004: 'o'\n2ab1005: 00\n2ab1216: 2ab1000\n```\n\n字符串又是怎样的？ASCII 字符串是一个以零终止的单字节内存单元数组。字符串的地址是其第一个字节的地址。与数组类似，指向字符串的指针是一个包含字符串地址（即第一个元素的地址——即第一个字符）的内存单元。\n\
    \n## 基础类型\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_58_0.png)\n\n现在，我们来看几个基本的基础类型。\n\
    \n## ASCII 字符与指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_59_0.png)\n\n我们已经通过内存图从概念上看过了\
    \ ASCII 零终止字符串和指针。在这里，我们来看一些地道的 C 代码。\n\n与内存图对应的代码示例：\n\n```\nchar c; // pstr\
    \ == 2ab1000\n&pstr; // 2ab1216\nc = *pstr; // c == 'H'\n++pstr; // 2ab1001\n\
    c = *pstr; // c == 'e'\nc = *(pstr+1); // c == 'l'\n```\n\n## 字节与指针\n\n| 2ab1000:\
    \ | 12 | 2ab1216: | 2ab1000 |\n| 2ab1001: | 34 | unsigned char b; |\n| 2ab1002:\
    \ | 56 | unsigned char *pb; // 2ab1000 |\n| 2ab1003: | 78 | // 2ab1216 |\n| 2ab1004:\
    \ | ab | b = *pb; // 12 |\n| 2ab1005: | cd | 2ab1001 |\n| | | b = *pb; // 34 |\n\
    | | | b = *(pb+1); // 56 |\n\n字符是范围从 -128 到 127 的有符号整数。但如果我们想处理 0 到 255 的无符号字节，我们需要使用无符号字符。稍后可以看到可以处理字节的其他类型。\n\
    \n与内存图对应的代码示例：\n\n```\nunsigned char b;\nunsigned char *pb; // 2ab1000\n&pb; //\
    \ 2ab1216\nb = *pb; // 12\n++pb; // 2ab1001\nb = *pb; // 34\nb = *(pb+1); // 56\n\
    ```\n\n## 宽字符与指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_61_0)\n\n如果你想使用 Unicode，自然会使用占用两个字节的宽字符。\n\
    \n与内存图对应的代码示例：\n\n```\nwchar_t wc;\nwchar_t *pwstr; // pwstr == 2ab1000\n&pwstr;\
    \ // 2ab1216\nwc = *pwstr; // L'H'\n++pwstr; // 2ab1002\nwc = *pwstr; // L'e'\n\
    wc = *(pwstr+1); // L'\\0'\n```\n\n## 整数\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_62_0)\n\
    \n我们现在看的是占用 4 字节的整数。\n\n与内存图对应的代码示例：\n\n```\nint i;\nint *pi; // 2ab1000\n&pi;\
    \ // 2ab1216\ni = *pi; // 0x2ab008\n++pi; // 0xffffffff\ni = *pi; // -1\ni = *(pi+1);\
    \ // 0x2ab110\n```\n\n## 小端序\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_63_0)\n\
    \n| 2ab1000: 1 | char ba[4]; // {1, 2, 3, 4 } |\n| 2ab1001: 2 | int i; // 0x4030201\
    \ |\n| 2ab1002: 3 | |\n| 2ab1003: 4 | x86_64 |\n| 2ab1004: 5 | Move Data After\
    \ Swapping |\n| 2ab1005: 6 | |\n\n在字节序列和数值之间进行转换时，我们需要考虑小端序，其中最低位数字位于最低的内存地址。\n\
    \n与内存图对应的代码示例：\n\n```\nchar ba[4]; // { 1, 2, 3, 4 }\nint i; // 0x4030201\n```\n\
    \n## 短整数\n\n```\n2ab1000: 2ab1008      2ab1216: 2ab1000\n2ab1004: ffff\n2ab1008:\
    \ 2ab1010      short s;      // 2ab1000\n                         short *ps; \
    \   // 2ab1216\n                         &ps;          // s = 0x1008\n       \
    \                  s = *ps;      // 2ab1002\n2ab100c: 2ab100c       s = *ps; \
    \     // s = 0x2ab\n                         ++ps;\n2ab1010: 00000000      s =\
    \ *(ps+1); // s = 0xffff\n2ab1014: 00002000\n```\n\n短整数占用 2 字节。\n\n与内存图对应的代码示例：\n\
    \n```\nshort s;      // 2ab1000\nshort *ps;    // 2ab1216\n&ps;          \ns =\
    \ *ps;      // s = 0x1008\n++ps;         // 2ab1002\ns = *ps;      // s = 0x2ab\n\
    s = *(ps+1); // s = 0xffff\n```\n\n## 长整数与长长整数\n\n| 2ab1000: 2ab1008 | 2ab1000:\
    \ 2ab1008 |\n| 2ab1004: ffffffff | ffffffff |\n| 2ab1008: 2ab1010 | 2ab1008: 2ab1010\
    \ |\n| 2ab100c: 2ab100c | 2ab100c: |\n| 2ab1010: 00000000 | 2ab1010: 00000000\
    \ |\n| 2ab1014: 00002000 | 00002000 |\n\n如果你想使用 Unicode，自然会使用占用 2 字节的宽字符。\n\n\
    与内存图对应的代码示例：\n\n```\nwchar_t wc;\nwchar_t *pwstr; // pwstr == 2ab1000\n&pwstr;\
    \ // 2ab1216\nwc = *pwstr; // L'H'\n++pwstr; // 2ab1002\nwc = *pwstr; // L'e'\n\
    wc = *(pwstr+1); // L'\\0'\n```\n\n## 整数\n\n```\nint i; // 2ab1000\nint *pi; //\
    \ 2ab1216\n&pi; // i == 0x2ab008\ni = *pi; // 2ab1004\n++pi; // i == 0xffffffff\n\
    i = *pi; // i == -1\ni = *(pi+1); // i == 0x2ab110\n```\n\n"
