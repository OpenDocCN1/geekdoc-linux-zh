    \ However, be aware of the possible stack overflow.\n\n# Dynamic Allocation (C-style)\n\
    \n```\nDynamic Allocation (C-style)\n\n* Persistent across function calls\n* (m|c|re)alloc\n\
    * free\n* Can be replaced\n```\n\nThere are some advantages to a dynamic memory\
    \ allocation compared to a local stack allocation. The allocated memory and its\
    \ values persist across function calls. Since allocations are implemented by library\
    \ calls, they can be replaced with other libraries and custom code that provides\
    \ debugging capabilities for tracking memory allocations and deallocations, as\
    \ well as other checks.\n\n# Dynamic Allocation (C++)\n\n- Persistent across function\
    \ calls\n- Global operators\n- Structure-specific operators\n- Can be replaced\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_126_0.png)\n\nC++ has its own implementation\
    \ of dynamic memory that is often implemented by underlying C-style calls and\
    \ Linux API. However, these high-level allocation facilities are more flexible\
    \ and customizable to the needs of structure designers. It provides replaceable\
    \ operators for global allocations for chunks of memory and structure-specific\
    \ allocations.\n\n# Memory Operators\n\n```\noperator new / operator delete\n\n\
    operator new[] / operator delete[]\n\noperator new throws std::bad_alloc\nexception\
    \ (do not check for nullptr)\nunless told not to via std::nothrow value\n```\n\
    \nWhen freeing globally allocated memory, always pay attention to whether it was\
    \ allocated in the array form to avoid memory leaks, crashes, and other undefined\
    \ behavior. Also, never check the allocated memory address for nullptr as done\
    \ in the C-style allocations: C++ allocation operators throw an exception instead.\n\
    \n# Memory Expressions\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_128_0.png)\n\
    \nMemory allocation expressions are used for allocating memory for values, structures,\
    \ and arrays. Internally, they may use memory operators. The same advice for non-array/array\
    \ deallocation and checking return addresses is applicable here.\n\n# Local Pointers\
    \ (Manual)\n\n```cpp\nfoo();\n\nvoid foo() {\n    int *p = new int;\n}\nvoid foo()\
    \ {\n    int *p = new int;\n    delete p;\n}\n```\n\n| | | |\n|---|---|---|\n\
    | 2ab1008 | 2ab1008 | 2ab1008 |\n| fffffff | fffffff | fffffff |\n| 2ab1010 |\
    \ 2ab1010 | 78004000 |\n| 2ab100c | 2ab100c | 2ab100c |\n| 00000000 | 00000000\
    \ | 00000000 |\n| 00002000 | 00002000 | 00002000 |\n\nWhen allocating memory dynamically\
    \ and assigning the memory address to a local variable, we must not forget to\
    \ free/delete memory before returning from the function to avoid a memory leak.\n\
    \nThe code example corresponding to the memory diagram:\n\nfoo();\n\nWhen we enter\
    \ the foo function, the allocated stack frame includes the local variables:\n\n\
    ```cpp\nvoid foo() {\n  ...\n}\n```\n\nThe local variable p contains the address\
    \ of the allocated memory for an integer value:\n\n```cpp\nvoid foo() {\n    int\
    \ *p = new int;\n  ...\n}\n```\n\nHowever, before exiting the function, we must\
    \ free the memory; otherwise there is a memory leak. Please note that neither\
    \ delete nor free change the value of variable p. It becomes a dangling pointer\
    \ but it goes out of scope here and is not reused for dereferencing.\n\n```cpp\n\
    void foo() {\n    int *p = new int;\n  ...\n  delete p;\n}\n```\n\n# In-place\
    \ Allocation\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_131_0.png)\n\n```cpp\n\
    char buf[sizeof(int)];\nint *pi = new(buf) int;\n*pi = 1;\n\nchar *pbuf = new\
    \ char[sizeof(int)];\nint *pi2 = new(pbuf) int;\n*pi2 = 2;\ndelete[] pbuf;\n```\n\
    \nIf we want to reuse existing buffers, we can use placement new.\n\nThe code\
    \ examples corresponding to the memory diagrams:\n\n```cpp\nchar buf[sizeof(int)];\n\
    int *pi = new(buf) int;\n*pi = 1;\n\nchar *pbuf = new char[sizeof(int)];\nint\
    \ *pi2 = new(pbuf) int;\n*pi2 = 2;\ndelete[] pbuf;\n```\n\n# Source Code Organisation\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_132_0.png)\n\nWe now discuss C and\
    \ C++ source code organization.\n\n# Logical Layer (Translation Units)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_133_0.png)\n\
    \nFrom a compiler perspective, it works with a translation unit as a whole and\
    \ converts the source code of a translation unit to an object file. Several object\
    \ files are combined by a linker into an executable file.\n\n# Physical Layer\
    \ (Source Files)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_134_0.png)\n\nAlthough\
    \ one physical source file corresponds to one translation unit, it is passed through\
    \ a preprocessor, which, among other things, looks for special directives to include\
    \ other files, and those files may also contain directives to include other files.\
    \ You can also see, in the case of the `common.h` file, by transitivity of inclusion,\
    \ that the same file may be included many times.\n\n# Inter-TU Sharing\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_135_0.png)\n\
    \nVariables in different translation units having the same name may conflict during\
    \ the linkage phase.\n\nThe code examples corresponding to the diagrams:\n\n```cpp\n\
    // TU A\nint counter;\n```\n\n```cpp\n// TU B\nextern int counter;\nint counter;\n\
    ```\n\n# Classic Static TU Isolation\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_136_0.png)\n\
    \nTo avoid name conflicts during linkage, C and classic C++ suggest using the\
    \ static specifier.\n\nThe code examples corresponding to the diagrams:\n\n```cpp\n\
    // TU A\nstatic int counter;\n```\n\n```cpp\n// TU B\nextern int counter;\nint\
    \ counter;\n```\n\n# Namespace TU Isolation\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_137_0.png)\n\
    \nModern C++ suggests using namespaces instead.\n\nThe code examples corresponding\
    \ to the diagrams:\n\n```cpp\n// TU A\nnamespace {\n  int counter;\n}\n```\n\n\
    ```cpp\n// TU B\nextern int counter;\nint counter;\n```\n\n# Declaration and Definition\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_138_0.png)\n\nIn C and C++, when reasoning\
    \ about compilation, it is useful to consider the distinction between declaration\
    \ and definition. The rule of thumb is that the latter usually describes the memory\
    \ layout. Please also note that a definition is also a declaration.\n\n# TU Definition\
    \ Conflicts\n\n```cpp\nExample:\nstruct S { }; // via thirdparty.h\n//...\nstruct\
    \ S { };\n//...\nS s;\n```\n\nMultiple declarations of the same entity are allowed,\
    \ but only one definition is allowed, the essence of ODR, One Definition Rule.\n\
    \nThe code example:\n\n```cpp\nstruct S { }; // via thirdparty.h\n//...\nstruct\
    \ S { };\n//...\nS s;\n```\n"
