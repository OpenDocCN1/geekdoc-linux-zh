  - '[PAGE 92]


    # Invalid Pointer Dereference


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_92_0.png)


    Dereferencing an uninitialized pointer can have undefined behavior, most likely
    an access violation leading to a crash.


    The code example:


    ```

    MyStruct *pMyStruct;

    MyStruct myStruct = *pMyStruct;

    ```'
  - '[PAGE 93]


    # Wild (Dangling) Pointer


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_93_0.png)


    Memory for a structure can be dynamically allocated and then deallocated, but
    if a pointer is not reset to some value easy to check, such as 0, then we have
    a dangling pointer with its dereferencing resulting in undefined behavior that
    could lead to further corruption.


    The code example:


    ```

    MyStruct *pMyStruct = new MyStruct;

    delete pMyStruct;

    ```


    MyStruct myStruct = *pMyStruct;'
  - '[PAGE 94]


    # Pointer to Pointer to Structure


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_94_0.png)


    We can also have pointers to pointers to structures and so on, with double

    and more dereferences needed to get the value. We''ll see why we need

    double-pointers later when we discuss passing parameters to functions.


    The code example:


    ```

    MyStruct *pMyStruct = &myStruct;

    MyStruct **ppMyStruct = &pMyStruct;

    ```'
