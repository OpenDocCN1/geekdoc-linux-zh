    \ std::string msg)\n{\n    ::sleep(param);\n    std::cout << \"New Thread Created!\"\
    \ + msg << std::endl;\n}\n\nvoid foo()\n{\n    std::thread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n    //...\n    threadProcCpp.join();\n    // std::jthread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n```\n\n2023 软件诊断服务\n\n正确的 C++ 标准库线程允许利用现代 C++ 抽象的力量。请也注意结合了线程创建和连接的\
    \ jthread 的存在：\n\n```cpp\n// 函数、函数对象、lambda\nvoid threadProcCpp(int param, std::string\
    \ msg)\n{\n    ::sleep(param);\n    std::cout << \"New Thread Created!\" + msg\
    \ << std::endl;\n}\n\nvoid foo()\n{\n    std::thread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n    //...\n    threadProcCpp.join();\n    // std::jthread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n}\n```\n\n# 同步问题\n\n```cpp\nlong counter{0};\n\nvoid threadProcCpp(std::string\
    \ msg)\n{\n    while (true)\n    {\n        std::cout << msg;\n    }\n}\n\nvoid\
