    \n# 同解决方案\n\n```cpp\nstd::atomic<long> counter{0};\n\nstd::mutex m;\n\nvoid threadProcCpp(std::string\
    \ msg)\n{\n    while (true)\n    {\n        std::lock_guard<std::mutex> lock(m);\n\
    \        std::cout << msg << \" \" << ++counter << std::endl;\n    }\n}\n\n\n\n\
