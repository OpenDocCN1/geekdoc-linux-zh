- md: "\n## A64 CPU Registers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_189_0.png)\n\
    \nThere are 31 general registers from X0 and X30, with some delegated to specific\
    \ tasks such as intra-procedure calls (X16, XIP7, and X17), addressing stack frames\
    \ (Frame Pointer, FP, X29) and return addresses, the so-called Link Register (LR,\
    \ X30). When you call a function, the return address of a caller is saved in LR,\
    \ not as in Intel/AMD x64. The return instruction in a callee uses the address\
    \ in LR to assign it to PC and resume execution. But if a callee calls other functions,\
    \ the current LR needs to be manually saved somewhere, usually on the stack. There's\
    \ Stack Pointer, SP, of course. To get zero values, there's the so-called Zero\
    \ Register, XZR. All X registers are 64-bit, and 32-bit lower parts are addressed\
    \ via the W prefix. Next, we briefly look at some aspects related to our exercises.\n\
    \n## A64 Instructions and Registers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_190_0.png)\n\
    \n- Opcode DST, SRC, SRC2\n- Examples:\n```assembly\nmov  x0, #16          //\
    \ X0 <- 16 (0x10)\nmov  x29, sp         // X29 <- SP\nadd  x1, x2, #16     //\
    \ X1 <- X2+16 (0x10)\nmul  x1, x2, x3      // X1 <- X2*X3\nblr x8            \
    \  // X8 already contains\n                     // the address of func (&func)\n\
    \                     // LR <- PC+4; PC &func\n                     // SP <- SP-48\
    \ (-0x30)\nsub  sp, sp, #48     // make room for local variables\n```\n\nThis\
    \ slide shows a few examples of CPU instructions that involve operations with\
    \ registers, for example, moving a value and doing arithmetic. The direction of\
    \ operands is the same as in the Intel x64 disassembly flavor if you are accustomed\
    \ to WinDbg on Windows. It is equivalent to an assignment. BLR is a call of some\
    \ function whose address is in the register. BL means Branch and Link.\n\n## A64\
    \ Memory and Stack Addressing\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_191_0.png)\n\
    \nBefore we look at operations with memory, let's look at a graphical representation\
    \ of memory addressing. A thread stack is just any other memory region, so instead\
    \ of **SP** and **X29 (FP)**, any other register can be used. Please note that\
    \ the stack grows towards lower addresses, so to access the previously pushed\
    \ values, you need to use positive offsets from **SP.**\n\n## A64 Memory Load\
    \ Instructions\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_192_0.png)\n\n- Opcode\
    \ DST, DST_, [SRC], Offset]\n- Opcode DST, DST_, [SRC], Offset // Postincrement\n\
    - Examples:\n```assembly\nldr x0, [sp] // x0 ← value at address SP+0\nldr x0,\
    \ [x29, -8] // x0 ← value at address X29-0x8\nldr x29, x30, [sp, #16] // x29 ←\
    \ value at address SP+32 (0x20)\nldr x29, x30, [sp] // x30 ← value at address\
    \ SP+0 (0x28)\nld x29, x30, [sp] // x29 ← value at address SP+0\n// SP ← SP+16\
    \ (0x10)\n```\n\nConstants are encoded in instructions, but if we need arbitrary\
    \ values, we must get them from memory. Square brackets show memory access relative\
    \ to an address stored in some register. There’s also an option to adjust the\
    \ value of the register after load, the so-called Postincrement, which can be\
    \ negative.\n\n## A64 Memory Store Instructions\n\n- Opcode SRC, SRC2, [DST, Offset]\n\
    - Opcode SRC, SRC2, [DST, Offset]! // Preincrement\n- Examples:\n```assembly\n\
    str x0, [sp, #16]               // x0 -> value at address SP+16 (0x10)\nstr x0,\
    \ [x29, #-8]             // x0 -> value at address SP+32\nstp x29, x30, [sp, #32]\
    \          // x29 -> value at address SP+40 (0x28)\nstp x29, x30, [sp, #-16]!\
    \        // SP -> SP-16 (-0x10)\n                                     // x29 ->\
    \ set value at address SP\n                                     // x30 -> set\
    \ value at address SP+8\n```\n\nStoring operand order goes in the other direction\
    \ compared to other instructions. There's a possibility to Preincrement the destination\
    \ register before storing.\n\n## A64 Flow Instructions\n\nOpcode DST, SRC\n\n\
    Examples:\n```assembly\nadrp x0, 0x42000      // x0 ← 0x42000\nb 0x10493fc   \
    \      // PC ← 0x10493fc\nbr x17               // PC ← value of X17\nbl 0x10493fc4\
    \       // LR ← PC+4 (0x10493fc4)\nbl 0xffff74         // (goto 0xffff74)\n```\n\
    \nBecause the size of every instruction is 4 bytes (32 bits), it is only possible\
    \ to encode part of a large address as a relative offset to the current PC via\
    \ ADRP. Goto (an unconditional branch) is implemented via B. Function calls are\
    \ implemented via BL (Branch and Link).\n\n## A64 Function Parameters\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_195_0.png)\n\
    \nOn the ARM64 Linux platform, the first parameters are passed via registers from\
    \ left to right and the rest via stack locations.\n\n## A64 Struct Function Parameters\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_196_0.png)\n\nWhen an object struct\
    \ member function is called, the first parameter is implicit and, on the ARM64\
    \ Linux platform, is passed via X0. It helps differentiate between objects of\
    \ the same type. The rest of the parameters are passed as usual.\n\nThe address\
    \ of the current object is contained in `this` pointer inside C++ source code.\
    \ It can be used to refer to the current object fields and methods and also be\
    \ dereferenced.\n\nThe code example:\n```cpp\nstruct MyStruct {\n    int a;\n\
    \    int foo(int i);\n    MyStruct* myAddress() { return this; }\n};\n\n// myStruct.myAddress()\
    \ == &MyStruct\nint MyStruct::foo(MyStruct* this, int i) {\n    return a + i +\
    \ this->a + (*this).a;\n}\n```\n\n## Function Objects vs. Lambdas\n\n```assembly\n\
    struct $_0 // GCC <lambda(int)>\n{\n    auto operator()(int x) { return -x; }\n\
    } negate;\n// int negate(int)\nauto negate = [](int x) -> int { return -x; };\n\
    negate(10);\n[](int x) -> int { return -x; }(10);\n// Clang\nlea    -0x10(%rbp),%rdi\n\
    mov    $0xa,%esi\ncallq <$_0::operator()(int) const\n// GCC\nlea    -0xa(%rbp),%rax\n\
    mov    %rax,%rdi\ncallq <lambda(int)>::operator()(int) const\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_198_0.png)\n\
    \nLambdas are internally implemented as function objects.\n\nThe code example:\n\
    ```assembly\nstruct $_0 // GCC <lambda(int)>\n{\n    auto operator()(int x) {\
    \ return -x; }\n} negate;\n// int negate(int)\nauto negate = [](int x) -> int\
    \ { return -x; };\nnegate(10);\n[](int x) -> int { return -x; }(10);\n// Clang\n\
    lea    -0x10(%rbp),%rdi\nmov    $0xa,%esi\ncallq <$_0::operator()(int) const\n\
    // GCC\nlea     -0xa(%rbp),rax\nmov     %rax,%rdi\ncallq <lambda(int)>:operator()(int)\
    \ const\n```\n\n## A64 Lambda Example\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_200_0.png)\n\
    \nThe ARM64 GCC disassembly fragment for the previous lambda example:\n\n```assembly\n\
    // GCC\nadd    x0, sp, #0x10\nmov    w1, #0xa\nbl     <lambda<int>::operator()>(int)\
    \ const\n```\n\n## Captures and Closures\n\n```cpp\nint b{};\nauto negate1 = [b](int\
    \ x) { return b - x; };\nauto negate2 = [b](int x) { return b - x; };\nauto negate4\
    \ = [&](int x) { return b - x; };\nauto negate5 = [=](int x) { return b - x; };\
    \ negate5(10);\nauto negate6 = [&](int x) { return b - x; }; negate6(10);\n```\n\
    \n```assembly\n// [] claim\nstruct t_1 {\n  $0(int x) : b(x) {}\n  operator()(int\
    \ x) { return b - x; }\n};\nnegate5:\n  mov    $0x0,-8(%rbp)\n  mov    $0x0,-8(%rbp)\n\
    \  lea    -0x18(%rbp),%rdi\n  lea    -0x20(%rbp),%rdi\n  mov    $0x0,%rdi\ncall\
    \   $_.operator(int) const\n```\n\n© 2023 Software Diagnostics Services\n\nInside\
    \ lambda code, it is possible to use local objects from the outer scope either\
    \ by copy or by reference. This mechanism is internally implemented by lambda\
    \ function objects.\n"
  mdcn: "\n\n## A64 CPU 寄存器\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_189_0.png)\n\
    \n从 X0 到 X30 共有 31 个通用寄存器，其中一些被分配给特定任务，例如过程内调用（X16、XIP7 和 X17）、栈帧寻址（帧指针，FP, X29）以及返回地址，即所谓的链接寄存器（Link\
    \ Register，LR, X30）。当您调用一个函数时，调用者的返回地址会被保存在 LR 中，而不会像 Intel/AMD x64 那样。被调用者的返回指令使用\
    \ LR 中的地址赋给 PC 并恢复执行。但如果被调用者又调用了其他函数，则需要手动将当前的 LR 保存到某个地方（通常在栈上）。当然，还有栈指针 **SP**。为了获取零值，还有一个所谓的零寄存器\
    \ XZR**。所有的 X 寄存器都是 64 位的，32 位低位通过 W 前缀进行访问。接下来，我们简要回顾与我们练习相关的某些方面。\n\n## A64\
    \ 指令与寄存器\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_190_0.png)\n\n- 令码 DST, SRC,\
    \ SRC2\n- 示例：\n```assembly\nmov  x0, #16          // X0 <- 16 (0x10)\nmov  x29,\
    \ sp         // X29 <- SP\nadd  x1, x2, #16     // X1 <- X2+16 (0x10)\nmul  x1,\
    \ x2, x3      // X1 <- X2*X3\nblr x8              // X8 已经包含了\n              \
    \       // 函数地址 (&func)\n                     // LR <- PC+4; PC &func\n      \
    \               // SP <- SP-48 (-0x30)\nsub  sp, sp, #48     // 为局部变量留出空间\n```\n\
    \n这张幻灯片展示了几个涉及寄存器操作的 CPU 指令示例，例如移动值和进行算术运算。如果您习惯 Windows 上的 WinDbg，那么操作数的方向与 Intel\
    \ x64 的反汇编格式相同。它等同于赋值。BLR 是对地址在寄存器中的函数的调用。BL 代表 Branch and Link（跳转并链接）。\n\n##\
    \ A64 内存与栈寻址\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_191_0.png)\n\n在查看内存操作之前，让我们先看内存寻址的图形化表示。线程栈只是其他内存区域之一，因此除了\
    \ **SP** 和 **X29 (FP)** 外，可以使用任何其他寄存器。请注意，栈向低地址方向增长，因此要访问之前推入的值，您需要使用相对于 **SP**\
    \ 的正偏移量。\n\n## A64 内存加载指令\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_192_0.png)\n\
    \n- 令码 DST, DST_, [SRC], Offset]\n- 令码 DST, DST_, [SRC], Offset // 后递增\n- 示例：\n\
    ```assembly\nldr x0, [sp] // x0 ← 地址 SP+0 处的值\nldr x0, [x29, -8] // x0 ← 地址 X29-0x8\
    \ 处的值\nldr x29, x30, [sp, #16] // x29 ← 地址 SP+32 (0x20) 处的值\nldr x29, x30, [sp]\
    \ // x30 ← 地址 SP+0 (0x28) (注：此处原文可能有误，保持翻译)\nld x29, x30, [sp] // x29 ← 地址 SP+0\
    \ (此处为ld)\n```\n\n常量编码在指令中，但如果我们需要任意值，则必须从内存中获取。方括号表示相对于某些寄存器中存储地址的内存访问。还有一个在加载后调整寄存器值的选项，即所谓的后递增，它可以为负。\n\
    \n## A64 内存存储指令\n\n- 令码 SRC, SRC2, [DST, Offset]\n- 令码 SRC, SRC2, [DST, Offset]!\
    \ // 前递增\n- 示例：\n```assembly\nstr x0, [sp, #16]               // x0 -> 地址 SP+16\
    \ (0x10) 处的值\nstr x0, [x29, #-8]             // x0 -> 地址 SP+32 处的值\nstp x29, x30,\
    \ [sp, #32]          // x29 -> 地址 SP+40 (0x28) 处的值\nstp x29, x30, [sp, #-16]!\
    \        // SP -> SP-16 (-0x10)\n                                     // x29 ->\
    \ 设置地址 SP 处的值\n                                     // x30 -> 设置地址 SP+8 处的值\n\
    ```\n\n操作数的顺序与其他指令相反。在存储之前，有可能对目标寄存器进行前递增。\n\n## A64 流指令\n\n令码 DST, SRC\n\n示例：\n\
    ```assembly\nadrp x0, 0x42000      // x0 ← 0x42000\nb 0x10493fc         \n```\n\
    \n由于原文中存在一些乱序或重复的描述，以下是基于上下文的逻辑翻译：\n由于指令大小为 4 字节，ADRP 指令用于计算页面地址。B 指令用于无条件跳转。\n\
    \n## A64 捕获变量\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_195_0.png)\n\n在 ARM64\
    \ 平台上，栈操作是通过寄存器传递的。\n\n## A64 结构体参数\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_196_0.png)\n\
    \n当调用成员函数时，第一个参数通过寄存器传递。\n\n"
