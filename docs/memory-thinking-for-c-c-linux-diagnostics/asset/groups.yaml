    \n```cpp\ntemplate <typename T>\nT add (const T& op1, const T& op2)\n{\n    return\
    \ op1 + op2;\n}\n```\n\nCompared to pointer casting, the general template code\
    \ enforces type safety by checking the required operations and compatible types.\n\
    \n# Flexibility\n\n```cpp\ntemplate<\nstruct M add<struct M>(const struct M& op1,\n\
    \                           const struct M& op2)\n{\n    return op1.val + op2.val;\n\
    }\n\nvoid foo() {\n    add<struct M>(struct S(1), struct S(2));\n}\n```\n\nIt\
    \ is also possible to specialize template definitions for specific types for performance\
    \ and other reasons.\n\n```cpp\ntemplate<> decltype(13) constant<13>() { return\
    \ 14; }\n```\n"
