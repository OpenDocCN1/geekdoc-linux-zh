- md: "\n```cpp\n}\n} b;\nA a = b;\n```\n\n## Parameters by Value\n\n- Original value\
    \ doesn't change\n- Inefficient/efficient (basic types)\n- Slicing (passing derived\
    \ as base)\n- Copy constructor/destructor\n\n```cpp\nvoid func(MyStruct ms)\n\
    { ms.field = 0; }\nfunc(MyStruct{});\nfunc(int i)\n{ i = 0; }\nfunc(1);\n```\n\
    \nWhen we pass parameters by values, any modifications inside functions are lost\
    \ once we return. Passing basic types by value is efficient, but passing structures\
    \ are not unless they are very simple: various functions may be called, for example,\
    \ copy constructors and destructors unless optimized by a compiler. There is also\
    \ a possibility of slicing when inheritance is used.\n\nThe code examples:\n\n\
    | `v-oid func(MyStruct ms) { ms.field = 0; } func(MyStruct{});` | `void func(int\
    \ i) { i = 0; } func(1);` |\n| :--- | :--- |\n\n## Parameters by Pointer/Reference\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_174_0.png)\n\n- Original value may\
    \ change\n- Efficient/inefficient (basic types)\n- Pointer/reference is passed\
    \ by value\n- Pointer by pointer (by pointer)\n\n```cpp\nvoid func(MyStruct *pms)\
    \ \n{ pms->field = 0; }\nfunc(&MyStruct{});\nvoid func(int &ri) \n{ ri = 0; }\n\
    int i{0};\nfunc(i);\n```\n\nIf we want efficiency for structures and also preserve\
    \ changes to original values, we need to pass by reference. Again, this may be\
    \ inefficient for basic types.\n\nThe code examples:\n\n```cpp\nvoid func(MyStruct\
    \ *pms) \n{ pms->field = 0; }\nfunc(&MyStruct{});\nvoid func(int &ri) \n{ ri =\
    \ 0; }\nint i{0};\nfunc(i);\n```\n\n## Parameters by Ptr/Ref to Const\n\n![](img/c36cc1b69ac7baa75db5d3135bb9d30_175_0.png)\n\
    \nIf we only want efficiency for structures, we need to pass by reference to const.\
    \ In such a case, we also cannot modify the original values.\n\n```cpp\nvoid func(const\
    \ MyStruct *pms) \n{ pms->field = 0; } // Error\n\nvoid func(const int& ri) \n\
    { ri = 0; } // Error\n\nfunc(&MyStruct{});\nfunc(int(0));\n```\n\n## Possible\
    \ Mistake\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_176_0.png)\n\nIf you come\
    \ from languages that use implicit references, you may omit `&` by mistake:\n\n\
    ```cpp\nvoid func(const MyStruct ms)\n{ ms.field = 0; } // Error\nfunc(myStruct);\n\
    \nvoid func(const MyStruct& ms)\n{ ms.field = 0; }\nfunc(myStruct);\n```\n\n##\
    \ Function Overloading\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_177_0.png)\n\
    \nFunction overloading allows reusing the same function names for functions with\
    \ different numbers and types of parameters.\n\nThe code example:\n\n```cpp\n\
    int funco(int i);\nint funco(int i, int j);\nint funco(long &rl);\n```\n\n## Immutable\
    \ Objects\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_178_0.png)\n\nIf you have\
    \ const objects, you are only allowed to call methods that have the const specifier\
    \ in their definition.\n\nThe code example:\n\n```cpp\nstruct MyStruct {\n  int\
    \ field;\n  unsigned int count;\n  MyStruct(int _field) : field{_field}, count{0}\
    \ {}\n  int get() const { return field; }\n  void set(int newval) { field = newval;\
    \ } // Non-const\n};\n\nconst MyStruct myStruct{1};\nmyStruct.get();\nmyStruct.set(2);\
    \ // Error\n```\n\n## Static Functions\n\nStatic functions are only allowed to\
    \ access static fields among objects:\n\n```cpp\n// multithreading issues ignored\
    \ here\nstruct MyStruct {\n  int field;\n  static unsigned int count;\n  MyStruct(int\
    \ _field) : field{_field}, count{0} {}\n  int get() const { return field; }\n\
    \  void set(int newval) { field = newval; }\n  static auto get_count() {\n   \
    \ count++;\n    return count;\n  }\n};\n\nMyStruct myStruct1{1}, myStruct2{2};\n\
    MyStruct::get_count();\nassert(myStruct1.get_count() == myStruct2.get_count());\n\
