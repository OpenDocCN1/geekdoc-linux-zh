    # Advisor


    Vitalis Tsoukalis has over 15 years of Unix system administration and programming
    experience working with Linux. He is also professional in Oracle Database Administration,
    C++, Java and IOS programming.


    Graphviz is a collection of tools for manipulating graph structures and generating
    graph layouts. It supports both directed and undirected graphs and offers graphical
    and command interfaces.


    is a utility for drawing graphs using a circular layout. One node is chosen as
    the centre, and the other nodes are placed around the centre in a circular pattern.
    If a node is connected to the node, it is placed at distance 2 and so on.


    Graphviz contains many programs and libraries. The dot program accepts input in
    the dot language and produces graphs of many kinds of objects: graphs, nodes and
    edges. Neato is a program for drawing undirected graphs. The circo utility is
    for creating circular layouts of graphs, while fdp is for undirected graphs. The
    fdp graph is a utility for constructing larger undirected graphs. The twiopi program
    is


    Graphviz provides three graphical interfaces: doty is a customisable graphical
    interface for the X window system written in Tcl 7. There are also two drawing
    libraries called libraph and libigraph. Their existence means that an application
    can use Graphviz as a library rather than as a tool.


    # Resources


    Graphviz: http://www.graphviz.org


    Perl: http://www.perl.org


    Perl Graphviz module: search.cpan.org/~crocard/Graphviz-2.22/lib/Graphviz.pm


