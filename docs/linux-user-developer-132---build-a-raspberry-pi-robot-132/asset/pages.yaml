    \ to make sense of large directory structures\n\nTUTORIAL\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_48_0.png)\n\
    \n# 01 Why directory structures with Graphviz?\n\nVisualising large directory\
    \ structures such as the Linux kernel directory can be practical. The Linux kernel\
    \ has over 2000 directories and 27000 files that would otherwise very difficult\
    \ to picture. The output of our Perl script can optionally include the files as\
    \ well as sizes. The Graphviz knowledge you'll get by analysing networks, trace\
    \ paths, function calls etc. And there are plenty of benefits.\n\nNote: For directory\
    \ structures like the Linux kernel, it is sometimes better not to visualise all\
    \ at once but into smaller parts.\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_48_1.png)\n\
    \n```\n\"Hello world\";\n```dot\ndigraphraph G {\n  node [label=\"Hello world!\"\
    ];\n}\n```\n```\n\nUse the following command for the compilation:\n\n```\n$ dot\
    \ -ps hw.dot -o hw.ps\n```\n\nThe aforementioned command will produce a PostScript\
    \ file that you can view. The word graph means that a directed graph is going\
    \ to be created. For an undirected graph, word should have been used instead.\
    \ For a simple example, however, it does not make any difference whether the graph\
    \ is directed or undirected.\n\nAlthough PostScript is very popular, it is recommended\
    \ to use the PDF format because it is faster to render and display. Additionally,\
    \ PDF files can be zoomed in without losing their clarity.\n\n# 04 Basic Graph\
    \ Information\n\nA graph (V, E) is a non-empty set of V (nodes) and edges E. A\
    \ graph contains nodes and edges, each having attributes. Graphviz has its own\
    \ dialect that you will want to learn. The language may be simple and elegant\
    \ but it is very powerful. The good thing is that it is a simple plain text editor\
    \ - you can easily write scripts that generate graphviz.\n\nBy writing graphviz\
    \ code you will realise that lines with # or are considered matters.\n\n# Node\
    \ Attribute\n\n| Name | Explanation | Allowed Values |\n| --- | --- | --- |\n\
    | shape | The shape of the node | ellipse, diamond, circle, etc. |\n| width |\
    \ The width of the node | a number |\n| height | The height of the node | a number\
    \ |\n| color | The color of the node | color |\n| font | The font of the node\
    \ | a font |\n| style | The style of the node | bold, dashed, dotted, italic,\
    \ etc. |\n\n# 02 Installing and running Graphviz\n\nYour Linux distribution provides\
    \ a ready-to-install Graphviz package that you can use. For example, you can just\
    \ run the following command and install Graphviz:\n\n```\n# apt-get install graphviz\n\
    ```\n\nAfter installing Graphviz, try to compile the following Graphviz code:\n\
    \n```\ndigraph G {\n```\n\n# 03 The Perl Graph module\n\nUsing Perl packages,\
    \ including Perl::Graph, provides an interface for creating Graphviz. The Perl\
    \ module is presented as an alternative of generating Graphviz.\n\nIt is useful\
    \ to remember when using the Graphviz module that if you want to get the output\
    \ as a PNG file, the last line of your program should be:\n\nSimilarly, if you\
    \ want to get the output as text, use the following line instead:\n\n```\nprint\
    \ \\$Graph->as_text;\n```\n\n# Edge Attribute\n\n| Name | Explanation | Allowed\
    \ Values |\n| --- | --- | --- |\n| penwidth | The thickness of the edge | a number\
    \ |\n| color | The color of the edge | color |\n| style | The style of the edge\
    \ | bold, dashed, dotted, italic, etc. |\n| arrowhead | The direction of the arrow\
    \ | forward, backward, or none |\n| label | The label of the edge | alphanumeric\
    \ |\n\n49 www.linuxer.com"
