    lives of millions."


    Page reportedly revealed that he suffers from vocal cord paralysis, which may
    make it difficult for him to speak at times.


    # SECURITY


    # ## RSA advises algorithm switch


    NSA taint on existing standard too, company claims


    Security giant RSA has asked developers to move away from the Dual EC DRG algorithm,
    following concerns that the National Security Agency (NSA) may have deliberately
    weakened the standard.


    ![](img/511bb591be9ee7dc0f73776baf9a0548_8_0.png)


    +   - The NSA''s input into a PNRG algorithm has made it unsuitable for use, according
    to RSA


    RSA is currently conducting a code review to ensure that all use of the Dual EC
    DRG algorithm is replaced and replaced with a more trusted algorithm - a move
    likely to be followed by the company''s various customers.


    Following the ongoing revelations into crypto and digital data integrity, RSA
    learned that the algorithm - perhaps as secure as all its products - can no longer
    be trusted.


    "To ensure a high level of assurance in security and privacy, RSA strongly recommends
    that customers discontinue the Dual EC DRG and move to a different PNRG (pseudorandom
    number generator).


    # SERVER


    # ## IBM invests $1bn in Linux


    # Aims to boost Power architecture


    IBM takes the stage at LinuxCon 2013 to announce its $1bn (around €625 million)
    in Linux and other source technologies for its Power architecture servers.


    Taking aim at the growing ''big data'' and cloud computing markets, IBM announced
    the opening of a new IBM Power Systems Linux Centre in Montpellier.


    "Companies are struggling to manage big data and cloud computing using servers
    based on de-scalable technology," claimed IBM VP Brad McDowell. "These servers
    are quickly overwhelmed by data which triggers the purchase of more servers, causing
    unsustainable scale pressure. The era of big data calls for a new approach, one
    that is open, customizable, and designed from the ground up to handle big data
    and cloud workloads."


    This follows IBM OPENPOWER project, which has sought to make the Power microprocessor
    available to other companies in a smaller and more affordable-based ARM architecture
    and its IP.


    "The last time IBM failed to Linux, it helped start a flurry of innovation that
    has never slowed," said Linux Foundation executive director Jim Zemlin of the
    move. "IBM''s committed investments in Linux for Power Systems is welcomed by


