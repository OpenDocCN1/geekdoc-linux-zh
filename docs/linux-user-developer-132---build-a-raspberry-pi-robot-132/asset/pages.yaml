    Now, once the code is written, the next step is to convert it into an executable
    program. For code written in C, you have to compile it into an executable program.
    The compiler converts the instructions written in a software program (the code)
    into machine-level instructions (the program executable), a program that can be
    executed by the operating system.


    A compiler is used for compiling software programs. For code written in C the
    GCC compiler can compile source files on Linux. For example, the following command
    can be used to convert the programming language source file (hello.c) into an
    executable program (hello).


