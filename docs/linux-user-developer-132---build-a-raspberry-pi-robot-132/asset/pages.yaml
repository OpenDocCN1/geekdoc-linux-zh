    back up and share important files and documents with people there''s an internet
    connection. It''s difficult to know which service to use, though there are a large
    number of different solutions, each with varying levels of Linux support.


    We''ve looked at four of the best services currently available, to make a judgment
    on what is currently the best cloud storage solution - the big boys like Dropbox
    and Ubuntu One to the more veteran SpiderOak and promising newcomer Copy. All
    of these services offer client-side support, web access and some degree of upgradable
    free storage.


