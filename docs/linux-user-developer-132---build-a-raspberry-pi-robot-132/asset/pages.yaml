    # ROBOTICS


    # Frindo robotics platform £65 / $95


    If you''ve been inspired to build a bot, this brand new open source platform could
    be exactly what you''re looking for


    Frindo is a new open source robot specifically designed to cater to users of Arduino,
    Raspberry Pi and mini-PCs and microcontrollers. The goal of frindo is straightforward
    to take the pain out of starting a robot project as you want it to be without
    screws, nuts and spacers to put the chassis together just for fun, research or
    educational purposes.


    The basic package comes everything you need to get started. It is sturdy enough
    to assemble and mount both a Raspberry Pi and Arduino make up the basics. You''ll
    also find two high-quality Pololu micro-motors with complete mounting brackets,
    wheels and a pan-and-tilt mounting kit. The choice between clear or black acrylic
    chassis and frindo is clearly the most robust robot chassis we''ve seen.


    Accompanying the basic package are around six extra modules. For example, the
    kit including Arduino Uno, a battery and USB cables and RobotShield, which is
    designed specifically for robot applications. The shield is entirely enclosed
    for motors with thermal overload protection, as well providing three-pin connections
    for analogue and six digital pins. The final package adds three Sharp analogue
    sensors with mounting brackets, allowing you to walk away with a fully open source
    Arduino-controlled


    Pros

    Robot high-quality design that comes with Arduino and Raspberry Pi


    Cons

    The community is still in infancy and some documentation is still being created


