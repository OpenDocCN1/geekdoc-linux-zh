    # Build the motor circuit


    Let''s start by making a simple motor circuit on the Raspberry Pi


    The base skill of our robot is movement, and this is handled by the motors supplied
    with our Magician chassis. Motors come in a large variety of sizes and types,
    but here we will use two DC motors to drive it. Due to the limited power offered
    by the Pi, we will require some additional batteries a IC to turn our motors on
    and off. Don''t ever power them from the Pi. The motor driver we will use is an
    H-Bridge. This one, L293D, IC which is sometimes called, will handle the separate
    power control as well as providing bi-directional control for two motors.


    RASPBERRY PI

    Works with both rev 1 and rev 2 model B, and A Raspberry Pi


    MULTIPLE MOTORS

    The single motor driver can handle 2 DC motors, independent control


    ADDITIONAL POWER

    Motor powered by four AA batteries giving us 6 volts, perfect for most small robots


    ![](img/511bb591be9ee7dc0f73776baf9a0548_21_0.png)


    MOTOR DRIVER

    L293D sitting across the middle of the breadboard will perform all the hard work


    # Parts list


    +   - Raspberry Pi (any model)

    - Breadboard

    - 2 DC motors


    +   - L293D IC

    - jumper wires

    - 4x AA batteries

    - Battery holder


    01 Adding the L293D

    Place the L293D chip into the middle of the breadboard and all the red and black
    cables, paying attention to the pins. The orange wire will be for the batteries.


    02 Configure the data lines

    Double-check the connections to ensure yours are correct. There are six wires
    from the Pi GPIO pins to the input pins of the L293D. These will be responsible
    for our motors.


    03 Finish the circuit

    Now we can connect the motors. We won''t know which way they turn yet, so make
    sure you can easily swap them around. Finally, add batteries and plug in the Raspberry
    Pi.


    > CAUTION

    VER connect motors directly to the Raspberry Pi. Doing so can damage the central
    processor, resulting in a costly (attractive paperwork).


