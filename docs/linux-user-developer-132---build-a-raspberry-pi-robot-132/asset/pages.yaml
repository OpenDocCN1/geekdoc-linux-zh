  md: "# Your view\n\nYour source of Linux news and views\n\nContact us...\nRegister\
    \ and post your comments... Email us directly...\nwww.linuxuser.co.uk/forum/ |\
    \ linuxuser@imagine-publishing.uk\n\n# YOUR VIEW\n\n# Linux User Letters\n\nYour\
    \ opinions about the magazine, Linux and open source\n\na good understanding of\
    \ Linux or the very least willing to learn.\nWhat I love about Gentoo is that\
    \ you can set the environment the OS runs on. You can complete it to run on any\
    \ specific CPU architecture, modules and many more; the limit is how much you\
    \ understand how it works.\nThe point is, there are many ways to skin a cake,\
    \ and Gentoo is just one way. If you don't like it, no problem, try LUbuntu anyway.\
    \ But for me, Gentoo offers all you want why and how it's done--the-scenes stuff.\
    \ I like to see exactly as I want it, and why these packages require that and\
    \ how work and each world I need then can simply turn it off during compiling\
    \ etc. The sky is the limit. Power to the people. Knowledge is the power.\n\n\
    ![](img/511bb591be9ee7dc0f73776baf9a0548_91_0.png)\n\n# Generation Tooo\n\nGentoo\
    \ is like other Linux out there. There are no differences between them; you'll\
    \ see like, and packages that you can get from like RH, CentOS, Debian and Ubuntu.\
    \ Gentoo is the obvious fact that you can customize it exactly as you liking and\
    \ in environments.\nI say that Gentoo and many source-based distros are not for\
    \ people who want to try Linux out to see what it's like, but rather for those\
    \ who have\n\nWill Schrier\n\nIt's true, Gentoo can be incredibly powerful if\
    \ you know how to use it correctly. Not everyone does, though, and it can be confusing\
    \ and over the top for most users, and wouldn't even\n\nSabayon is a great alternative\
    \ for trying out Linux without fighting from scratch\n\nreally improve their computing\
    \ experience even if they did make use of it. It's great that the option is there,\
    \ especially when you need it.\n\n# THREAD BARE\n\nWe reviewed the MinBoard in\
    \ last month's issue, giving it decent score but questioning whether or not it\
    \ is the Raspberry Pi competitor marked as. When we posted it online, some folks\
    \ told us about some of the other issues with the board. Join the conversation\
    \ here: bit.ly/LUDMin\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_91_1.png)\n\n\
    # Carlos Lopez said:\n\n+   - Be careful with this if you are planning to use\
    \ it for anything else.\n This board has the infamous Cedarev/Cedartrail GPU from\
    \ PowerVR, Which is a nightmare for Linux users.\n- The open-source drivers for\
    \ AMD600 only supports basic 2D, and the properties are none much than works.\
    \ On top of that, this proprietary driver is only available for Ubuntu 10.04 and\
    \ Mee.\n\n# Adrian Placeau said:\n\n+   - Intel is the new Microsoft in the cheap\
    \ computer market and the x86 is a binding out of freedom.\n\n# Charlie Wiman\
    \ said:\n\n+   - I saw AMD600 and was thinking. I thought that it was a PowerVR\
    \ GPU, but I must be mistaken. Then I confirmed that I was not mistaken. Now I\
    \ just wonder what kind of process went into putting a PowerVR GPU into Linux-based\
    \ device. That seems crazy to me.\n\n# Microlith said:\n\n+   - The chip isn't\
    \ integrated into the CPU is an older one, and the GPU is an SGX35. This is a\
    \ pretty old core that was used in a Lot of Cortex-A8 based SoCs.\n\nBecause of\
    \ this, I'm ignoring this round of the MinBoard and will be looking for a Ba Trail\
    \ (or its follow) based board with Intel graphics.\n\n92 www.linuxuser.co.uk\n\
    \nSome results are unimpressed by the MinBoard\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_91_2.png)"
