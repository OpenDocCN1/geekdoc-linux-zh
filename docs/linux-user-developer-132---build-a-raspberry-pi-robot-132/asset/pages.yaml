    # # Dropbox


    # ## No introductions necessary for the king of cloud storage


    Dropbox is synonymous with cloud storage; when describing other cloud services
    to less-tech people, the conversation usually involves it''s like Dropbox. Popularity
    doesn''t necessarily mean quality, though which is why we are comparing it with
    others in this test to see if it deserves our review.


    Here are the facts - Dropbox is a cloud-platform service offering small storage
    capacity for settings, which is upgrade for price. It starts at $9.99 for 100GB,
    which would be somewhat of a benefit in the cloud storage market compared to its
    competitors.


    However, you can tell Dropbox selectively sync specific folders from the main
    directory, just in case there are files that only need to be accessed by specific
    devices, or via the web interface, or just quickly and easily transfer files between
    devices. This allows you to collaborate on projects without filling up other users''
    hard drives, which is a huge benefit when you work in the same network.


    The client only allows for syncing of the main directory at a time, rather than
    letting you select different folders to also sync or back up.


    The good thing about Dropbox is it''s a stable platform and it works pretty much
    seamlessly between all your devices. Even if it doesn''t offer all space for free,
    it does have reasonably priced upgrade options and it is one of the most reliable
    services available.


    # ## Dropbox’s client is fairly simple compared to other platforms it works on


