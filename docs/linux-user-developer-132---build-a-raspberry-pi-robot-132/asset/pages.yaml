    ■ SteamOS is huge for gaming and a massive step forward for Linux


    # ENTERTAINMENT


    # The SteamOS age is coming


    Will Valve''s SteamOS and hardware so far since Steam start a revolution in gaming
    on Linux?


    Over the past year or since Steam was launched on Linux, there have been rumours
    and speculation about Valve creating a SteamBox - some kind of hardware that runs
    Steam and acts like a console for the online service. With more and more evidence
    that Valve was experimenting with Linux, it seemed that Steam-based hardware would


    So was a surprise when a week of projects about SteamOS allowed Linux distribution
    to run Steam in Picture mode, and display in the living room. Valve wants to make
    SteamOS free, and has some software hardware can use and iterate easily.


    ![](img/511bb591be9ee7dc0f73776baf9a0548_9_1.png)


    # Controlling Steam


    One issue with PC gaming in the living room is finding a solution for games that
    require a controller and keyboard. Valve plans to develop its own Steam controller
    with several unique features. The usual deal for gaming has been replaced by two
    touch-sensitive trackpads; Valve claims these have incredible rumble motors to
    provide haptic feedback. The controller has many buttons - without the need for
    trackpads - there are four shoulders, two triggers and two bumpers which are themselves
    buttons. A touch in the centre could custom buttons, which would allow fool Steam
    games without controller support, even its own, to treat the controller as a keyboard
    and mouse,


    > Finding a solution for interacting with PC games in the living room is key for
    Valve


    release of Steam. However, Valve plans to allow people to stream games over a
    local network from Steam to the entire catalogue of devices. This may also allow
    for much smaller devices to allow you to stream your games to your TV. In the
    future, mobile apps may also be made for SteamOS in the future.


    There are still a few unanswered questions about SteamOS, and we plan to experiment
    and answer questions about it the coming months. Make sure to get the next issue
    of Linux User & Developer, where we will uncover all its remaining secrets.


    Little is known about the SteamOS itself - but it will come on 300 prototype Steam
    Machines that Valve will be giving to Steam users by the end of the year. This
    will pre-empt a number of Steam Machines by other companies in 2014, running the
    Linux distro.


