  md: '# Welcome


    # to 132 of Linux User & Developer


    Mihalis Tsoukalakis has over 15 years of UNIX system administration and programming
    experience and has been using Linux since 1993. He is also proficient in network
    administration, Cisco, and Cisco. In this issue Mihalis uses Graph to handle large
    data structures (48-5).


    # This issue

    >> Protect your network

    >> Ubuntu 13.10 reviewed

    >> Build a Raspberry Pi robot

    >> Master control with Git


    ![](img/511bb591be9ee7dc0f73776baf9a0548_2_0.png)


    Sean Tracy is a creative technologist at a teaching digital agency. He has a lot
    of experience with Node.js, Python and Django. Sean shows us how to improve Python
    skills using Python''s popular library Beautiful. You can find his tutorial on
    page 5.


    Welcome to the latest edition of Linux User & Developer, the UK''s favourite open
    source and Linux magazine.


    It was always a childish fantasy to have a little robot to keep you with the help
    of one Raspberry Pi, several 18-circuit pages from the UK''s leading electronics
    suppliers in this issue of Linux (starting on page 18). I''ve finally realised
    this dream.


    Michael Reed is a technology writer, and he has been looking at Linux for over
    twenty years. In other things, Michael explores desktop solutions in Linux and
    shows you how to protect mail using SpamAssassin, so you can filter unwanted emails.
    His guide starts on page 38.


    Jonny Pi, as Twitter has connected us to call, is him and we''re already working
    on fresh plans to give him the power of speech. Besides helping me further control
    Rob the robot to be remote, we''re also working on a web app so can control him
    from any web-connected device.


    Jon Masters is a Linux hacker who has been working on Linux for over 18 years,
    since he first attended university at the age of 17. He lives in Cambridge, Massachusetts
    and works for an enterprise Linux vendor. You can find his indispensable Column
    on pages 16-17.


    This issue, you can find much more than an ambitious-Pi project to keep you busy.
    Learn to script with Python, build your own Gadget Reader and upgrade your kernel
    with Linux Torvalds alternate version to Git. These tutorials and many more starting
    on page 38. Enjoy the magazine!


    Gareth Harecliff is a reporter and begins who brings us the latest news from the
    ecosystem, starting on page 6. This issue covers the Openphone, the first mobile
    to use Firefox OS. Our review starts on page 24, but do not get your hopes up
    just yet...


    Russell Burns, editor


    Robert Zweblist is an aeronautical engineer currently using Python to model complex
