    # Protect your network


    Build a gateway server that can filter content and block access to websites from
    certain PCs


    # Advisor


    Michael Reed is a technology journalist and he''s been hacking away at Linux for
    years


    This is a project to create a gateway PC that allows you to filter Internet traffic.
    We are using CentOS as the base of our system and the web filter DansGuardian
    will carry out the filtering for us.


    Filtering the internet has never been more popular, and DansGuardian puts power
    into the hands of the administrator. Basic filtering software blocks individual
    pages, but DansGuardian is adaptive and handles the content of pages on the fly.
    Even better,


    DansGuardian carries out a sophisticated analysis of the content that weighted
    triggers. This means that a single instance of a banned word will not block the
    page that the user is accessing. DansGuardian provides internet connection and
    the rest of the network is capable of assigning connection details to client PCs
    via DHCP. This helps us configure them to use our proxy setup.


    # Resources


    Server machine


    Two Ethernet adapters


    Firefox browser


