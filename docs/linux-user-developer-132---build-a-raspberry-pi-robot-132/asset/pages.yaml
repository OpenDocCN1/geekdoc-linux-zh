  md: '# # Create your own Google Reader


    Use Tiny Tiny RSS to create a Google Reader alternative


    # TUTORIAL


    ![](img/511bb591be9ee7dc0f73776baf9a0548_42_0.png)


    # 01 Web account


    On your web server or, make sure you have a user account that can access the server
    or via SSH, as we''ll be setting up Tiny RSS first. Usually, you''ll be able to
    log in at the terminal:


    ```

    $ ssh username@yourdomain.com

    ```


    ...by entering the relevant password.


    ![](img/511bb591be9ee7dc0f73776baf9a0548_42_1.png)


    # 02 MySQL database


    Some users have their database creation tools, but if you''re managing yourself
    create it in the command. Create your new database with:


    ```

    $ mysql -u root -p -h mydomain.com

    CREATE DATABASE tiny_trss;

    ```


    ...replacing my host and mydomain with your relevant information.


    # 03 MySQL User


    You''ll need another user account to access the database. Most GUI tools will
    automatically set it up with:


    ```

    $ mysql -u root -p -h mydomain.com

    GRANT ALL PRIVILEGES ON tiny_trss.* TO ''username''@''localhost'';

    FLUSH PRIVILEGES;

    ```


    # 04 Tiny RSS


    Download the latest stable of Tiny RSS from the feed reader, make sure to extract
    specific files needed to finish the database creation, then set up it


    ![](img/511bb591be9ee7dc0f73776baf9a0548_42_2.png)


    # 05 Database setup


    Find the mysql sql file in the archive


    # 06 Configuration


    Rename the copied file to config.php, and open it in a text editor. Edit the following
    lines with the relevant information:


    ![](img/511bb591be9ee7dc0f73776baf9a0548_42_3.png)


    # 07 Set URL


    Edit the configuration file that Tiny RSS uses to connect to the database and
    services on your server. Change the values around it, make sure to create a copy
    so you can restore it or start again. You can find it in the top left of the configuration.


    ```

    define(''SELF_URL_PATH'', ''http://example.org/tt-rss/'');

    ```


