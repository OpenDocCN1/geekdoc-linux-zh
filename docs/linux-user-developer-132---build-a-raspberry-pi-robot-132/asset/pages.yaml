    ```\n\n```\ndef forward():\n  Motor1.start(speed)\n  Motor2.start(speed)\n```\n\
    \n```\nChangeDutyCycle(speed)\n```\n\n```\ndef backward():\n  GPIO.output(18,GPIO.HIGH)\n\
    \  GPIO.output(27,GPIO.HIGH)\n  GPIO.output(23,GPIO.LOW)\n  GPIO.output(11,GPIO.LOW)\n\
    \  GPIO.output(9,GPIO.LOW)\n  GPIO.output(10,GPIO.LOW)\n```\n\n```\nMotor1.stop()\n\
    Motor2.stop()\n```\n\n```\nChangeDutyCycle(speed)\n```\n\n```\nChangeDutyCycle(speed)\n\
    ```\n\n```\ndef left():\n  GPIO.output(27,GPIO.HIGH)\n  GPIO.output(17,GPIO.LOW)\n\
    \  Motor1.stop()\n  Motor2.stop()\n```\n\n```\nwhile true:\n  ldr_left = get_value(0)\n\
    \  ldr_right = get_value(1)\n```\n\n```\nif ldr_left > 60:\n  print(\"turn right\"\
    )\nelif ldr_right > 60:\n  print(\"turn left\")\nelse:\n  forward(75)\ntime.sleep(0.25)\n\
    ```\n\n+   03 Double-check everything\n\nAs we have a lot of power - we are using\
    \ 3V for the MCP3008, 5V for the L23D and batteries - it is best to check they\
    \ are all correctly wired up. If it looks good, add power and log into the Pi.\n\
    \n# It is best to place the LDRs apart, pointing outwards\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_32_1.png)\n\
    \nMCP3008\nMCP3004\nA smaller ADC chip can replace the LDRs is also available,\
    \ it only has 4 channels as opposed to 8 with the MCP3008.\n\n33 linux.co.uk"
