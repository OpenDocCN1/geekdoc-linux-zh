  md: "# Questions & answers\n\nAll your technical problems solved\n\n# Q/A\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_86_0.png)\n\
    \n# Blast from the past\n\nI have handled a 1.3MB RTF floppy to date. In 2013,\
    \ I haven't actually seen in one close to ten years, but it's part of an archive\
    \ we have to examine. I uploaded it to cloud storage from an internet cafe, found\
    \ a working floppy, and downloaded it again. LibreOffice gives the following error\
    \ while trying to open it:\n\n```\nFile error found at 5378, 30481 (row,column)\n\
    ```\n\nObviously, not. Any ideas how to proceed? Will I try another floppy as\
    \ a box becomes available, or are there any tools for free to read the RTF files\
    \ in Linux?\n\n+   MyTV can be a little tricky to set up\n\nYou're basically right\
    \ – you need to loop-mount, copy the files and edit them to your list. First of\
    \ all,\n\n```\n$ cp -av * /[working_directory]\n```\n\nNow, edit isolinux.cfg\
    \ in the root file to add the boot options you find. The APPEND line is:\n\n```\n\
    $ mount -o ISO; APPEND systemrescued=x86-3.1.iso [mount]\n```\n\n```\nroot=$(passwd)\
    \ dockch rescue -c=/boot.cat /no-emul-boot /boot-load-size 4 \\-j\n```\n\nCopy\
    \ all the files to a different directory to\n\n```\n-R \\ -v custom_sysrescued=\n\
    ```\n\nAnd finally, burn the new ISO to disc. Make sure to test it of course,\
    \ but that gets it working the way you want.\n\n# Mythical\n\nI have an issue\
    \ which I have been Googling for a solution. Essentially, I have no luck finding\
    \ it anywhere. I have a Mythical back-end and front-end on Linux 19, and on another\
    \ system Windows.\n\nI want to try using the back-end functions on the system\
    \ from my local network or over my connected computer.\n\nIf I use the back-end\
    \ locally, it works. When I use it over my local network, it brings up the TF\
    \ TF RTF file.\n\nI have tried several things including switches and changing\
    \ file permissions and I still get\n\nTed Draper\n\nSounds like you're in a bit\
    \ of bind. My first thought might be that you suspect, it corrupted during transfer.\
    \ Try to edit it yourself using ways from your hands, or try to read it from free\
    \ RTF files in Linux?\n\nIf all else fails, I'd suggest going back to the error\
    \ lines and have a look at them to see if there's anything obvious - don't worry\
    \ about using a 1.3MB RTF file.\n\nOtherwise, try in it using the Word app or\
    \ come Maybe using Windows software for a more help. Good luck!\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_86_1.png)\n\
    \n# Loop-mount, copy the files and then edit them to your liking\n\nIf you create\
    \ your own script, create a file file in the root of your directory, write your\
    \ script, and make it executable.\n\n+   Turning to Wine is the only solution\n\
    \nNow, create your new ISO from the modified directory you have been working on:\n\
    \n```\n$ isolinux/isolinux.bin \n-c /boot/boot.cat \n-no-emul-boot /boot-load-size\
    \ 4 \\-j\n```\n\n77.linuxuser.com"
