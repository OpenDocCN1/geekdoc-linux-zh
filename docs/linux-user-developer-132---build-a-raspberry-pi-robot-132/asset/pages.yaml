  md: '# # Munich opens Windows users an Ubuntu upgrade


    Those with old, unsupported systems asked to grab a disc from their library


    The Munich city administration in Germany has announced that it will be offering
    citizens a free copy of Canonical''s Ubuntu Linux 12.04 on CD-ROM to keep them
    secure when Microsoft cuts support for its operating system.


    The discs are grab for those who lack the technical knowledge or ability to download
    Ubuntu themselves, and will offer a well-supported platform which will run on
    citizens'' older and slower Windows machines.


    When Microsoft puts the plug on Windows XP next year, many customers will be left
    without security for the operating system, increasingly vulnerable to malware
    and hackers. Not all are able to upgrade or possess a computer capable of running
    the more powerful-hungry Windows Vista. Cities now have thousands of Ubuntu 12.04
    CDs available for all users – the most Long Term Support (LTS) release of Canonical''s
    popular Linux distribution.


    The move follows a migration to the homeless Linux distribution by the Munich
    city administration, which runs the distro on around 10,000 of 15,000 computers.


    Interestingly, the move to offer Ubuntu instead of the originally produced plan,
    will swap the lightweight Ubuntu spin used instead; this was swapped for Ubuntu,
    a spokesperson told local media, at Canonical''s request.


    Sadly, citizens who run into trouble with their new operating system without support,
    which will be handled through the usual community channels.


    ![](img/511bb591be9ee7dc0f73776baf9a0548_7_0.png)


    # # OSv cloud announced


    # KVM vertices used to displace Linux in the cloud


    A group of visualisation and cloud experts has announced a new operating system,
    OSv, which offers Linux compatibility with reduced memory overhead


    Announced at the CloudDev event in New York, OSv is an open source project that
    limits the Linux licence with no less than a goal to be the one-kernel operating
    system.


    The system, designed with existing Linux applications and runtime environments,
    OSv offers lightweight scheduling, cooperation between the kernel, shared memory
    pools and claims of ''unparallelised'' shortcuts.


    OSv, its claim, is designed for performance support running on hypervisors rather
    than metal it has a vastly simplified I/O stack, which eliminates the performance
    problem of multiple virtual machines – making OSv, the first operating system
    to completely replace the kernel.


    The operating system also moves interrupts out a dedicated kernel and into traditional
    userspace which includes a net network stack based on the work of Van Jacobson.
    Local storage nowadays, is handled by the ZFS file system.


    OSv is to run directly on top of KVM, Xen and Amazon EC2 platforms, with VMware


    | Feature/Property | OSv | Traditional OS |

    |---|---|---|n| Type workload | Single app + VMM | Multiple applications, |

    | kernel vs app | Separate | Integrated |

    | OS support | Yes | No |

    | # Config files | Yes | Yes |

    | Security | Yes | Yes |

    | Scalability | High | High |

    | Usability | Easy | Easy |

    | JVM support | Yes | No |

    | Lines of code | Short | Long |

    | Performance | Good | General purpose |


    > The City of Munich is to offer its CDs to upgrade their Windows XP installations
    to Ubuntu


    > it claims OSv''s approach makes it well-suited to computing and visualisation


    supported for later in the year alongside other projects – the team behind it
    admits the software is in a very early alpha stage and, at present, tuned for
    the execution of Java Virtual Machines (JVMs) with limited testing for native
    code and very early Python. More details are available on osv.io.


    www.linuxuser.co'
