    # ## 16 Easy updating


    There are two ways to get Tiny Tiny RSS: the easiest is to get it into the config.php
    file and locate the SIMPLE_MODE variable. Change it to live and update your feeds
    when you''re feeding your reader


    # ## 17 Better updating


    If you''re using Tiny Tiny RSS on your server you can have the feeds in daemon
    so it''s always updated when you log in. For single processes, access the PHPI
    cli:


    ```

    php /daemon daemon.php

    ```


    For multi-use:


    ```

    php /daemon1 daemon2.php

    ```


    # ## 18 View


    By default, all the articles will be in one view - a much nicer for navigating
    your feeds. To change it you can click and navigate between feed items, go to
    Preferences and check ''Automatically export articles in configured mode'':


