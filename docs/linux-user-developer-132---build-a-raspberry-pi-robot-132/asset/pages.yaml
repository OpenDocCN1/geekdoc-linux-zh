    * Memory mapping - This region is used for mapping files. The region for this
    is the input file which is not executable and process memory is mapped via I/O
    from disk (which are usually so). This region is mostly used for shared libraries
    and variables.

    * Heap - There are two limitations of stack: one is the stack size is not very
