    # Create your own Google Reader


    Use Tiny RSS to create a browser-accessible rss reader located entirely on your
    server


    Since Google Reader was discontinued a few months ago, we have been looking for
    a replacement. Some people have turned to commercial services like Digg and Reader,
    the best solution is to create your own reader hosted entirely on your computer
    or home server.


    To do this, we use Tiny RSS, an application that has lasted for a while now but
    has gained recent fame, as a Google Reader replacement. It requires more than
    a server


    with a LAMP stack, or some decent web space on which you have access to the data.
    Tiny RSS has a few features similar to Google Reader – keyboard shortcuts, the
    ability to share different social networks, podcasts and it is an open app that
    feeds you can easily access from anywhere with an internet connection. If you
    still have the old Google Reader feed, you could also plug that into Tiny RSS.


