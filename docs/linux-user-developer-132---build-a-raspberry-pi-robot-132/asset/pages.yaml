  md: '# Raspberry Pi Robot


    # Assemble the robot chassis


    Now we''ve got a working motor circuit, let''s start building our Raspberry Pi
    robot


    One thing a robot can''t live without is somewhere to mount all the parts, so
    for this we need a chassis. There are many sizes, shapes and finishes available.
    We are going to use one of the most versatile and common, called a Dagu Magician.


    This chassis kit comes complete with two plates, motors and two wheels, as well
    as a battery box, which is perfect as starting point for basic robots. Once this
    is ready we can start expand our robot with new motor functions, before adding
    sensors.


    +   SORT THROUGH THE PARTS\Lay all the parts out and familiarise yourself with
    them. Assembly is for the most part straightforward, some care is needed with
    the motor bracket,


    ![](img/511bb591be9ee7dc0f73776baf9a0548_23_0.png)


    +   ASSEMBLE THE MOTOR BRACKET\Insert the bracket through the chassis and sandwich
    a motor with the second bracket. Feed a bolt through the holes and add the nut
    on the end


    ![](img/511bb591be9ee7dc0f73776baf9a0548_23_1.png)


    +   PIECE THE BITS TOGETHER

    Feed the motor wires through the chassis and add the top plate using the hexagonal
    spacers and screws, followed by the caster


    ![](img/511bb591be9ee7dc0f73776baf9a0548_23_2.png)


    +   WIRE EVERYTHING UP

    Everything in place, using the motor circuit, connect the Raspberry Pi and switch
    it on. Make sure it works by running the test script


    +   ADD THE BREADBOARD\Most breadboards have adhesive pad on the bottom so you
    can peel stick down or Blu-tap for a less permanent fix. Mount this at the first


    +   MOUNT YOUR PI

    The Raspberry Pi rev 2 and some cases having holes on the bottom, so utilize them
    for mounting, and fix the battery packs into place


    # Building tips


    Take your time

    It''s better to stay ahead and assume you already understand the build process
    without glancing at the instructions. Pamphlet is there to help — use it!


    Modifications are welcome

    Don''t limit yourself to the design. If you need to cut a new set of holes for
    your sensors, measure twice and cut once, but don''t feel limited to the stock
    options.


    Plenty of choice

    There is a world of choice when it comes to build platforms. Four wheels, tracks
    and hexapods are possible. Our robot platform flavour of the month is friend —
    see p76-77 for our review.'
