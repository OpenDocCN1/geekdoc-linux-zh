    \n+   02 Change the motors\n\nWe are using the SPI bus for the MCP3008 communication,\
    \ we need to move the motor to different pins of GPIO pins, so we switch pins\
    \ 8, 9 and 10 to 22 and 27.\n\n+   06 Something is wrong\n\nIf you're sure it's\
    \ working it could be due to a value that used. Run the test script again to get\
    \ to replace the 600 used. Remember - at different times of day you need to change\
