    # Raspberry Pi Robot


    # # Ultrasonic sensing


    Now that the robot can touch, and it can see beneath its wheels, what about a
    new type of sight?


    ![](img/511bb591be9ee7dc0f73776baf9a0548_29_0.png)


    Let''s start making things little more complicated by adding an ultrasonic sensor
    and placing it onto a pan-tilt mounting. Ultrasonic sensors are used in different
    ways to detect distance by emitting an ultrasonic wave to bounce off an object
    back to the receiver. Cars with reverse parking work in the same way to give an
    audible count of how far away an object.


    Using an ultrasonic sensor on your robot will give it a chance to take action
    as it approaches an object such as, with enough time to evaluate and choose a
    path.


    Ultrasonic sensors come in two varieties of pins. Both types work in a very similar
    way. Since we would like to use the same code for both we would wire the 4-pin
    sensor to act like a 3-pin ultrasonic sensor. However, we will focus on


    the affordable 3-pin model from Dawn Robotics.

    nAs we only require one GPIO pin, we will first set it as an input and send a
    10ms pulse to trigger the sensor and start begin counting. When the echo comes
    back, at which point we stop counting and calculate how long it took. The last
    thing needed is to convert the time into a measurement we can read, in this case
    centimeters.


    # ### 4-PIN SENSOR


    The most common is the 4-pin HC-SR04, capable of calculating distances up to 4
    metres. Aside from the power and ground, it contains Trig and Echo pins


    # ### 3-PIN SENSOR


    We''re using a 3-pin sensor which has a combined Echo/Trig pin. The functions
    perform the same as the-


    # ### VOLTAGE DIVIDER


    As we are dealing with 5 volts, we need to lower the voltage to 3.3 volts to make
    it safe for use with the Raspberry Pi


    # ## Parts list


    +   - Dagu pan & tilt kit

    - Jumper cables

    - Seed ultrasonic sensor

    - 2x 2k resistors

    - 1x 10k resistor


    # ### JUST ONE GPIO PIN


    To save on GPIO pins, one will switch between output and input to send and receive
    a pulse. This will work with 4-pin models up to


    # ## Add a pan and tilt kit


    Pan-tilt mounts are very useful since they can be combined with any sensor, giving
    the robot the ability to move its ''head'' around and around without physically
    moving its body.


    typically between 0 and 180 degrees. By this by using some precise time to sense
    the servo. The time between the pulses tells the servo algo.


    The Raspberry Pi is not a so-great-real-time device, which might struggle maintaining
    a steady position, as it could forget what it was doing and go off to check some
    emails, for


    Wouldn''t it be great to take readings from different angles? Here''s...


    instance. Richard wrote a kernel for Linux ServoBlaster, which handles the timing
    perfectly, regardless of how much is happening in the background of timers to
    provide an accurate clock. All that required is to send the sensor what you need
    to: /dev/servoblaster and the servo will spring to life!


    The pan-tilt is controlled by two special called servos. Servos allow precise
    movement within their range.


