    Welcome to the Linux User & Developer DVD. Our latest release is free to burn
    with brand new Linux distributions and free software to use and test. We have
    a section dedicated to all the robotics articles from this issue relevant to the
    contents of this month''s magazine.


    On the disc for issue 132, we have betas for two of the biggest upstreams: openSUSE
    13.1 and Ubuntu 13.10 - which will be the first release to be booted on our new
    display server. With Minimal, we also have the security distribution Tor by default,
    and the minuscule Tiny Core. To start, burn the DVD into your optical drive,


    restart your PC, and boot from disc to explore the different distros. To install
    Ubuntu you''ll have to put your disc into an optical drive and select it from
    the boot menu. From there you can use live-boot, and if you wish, you can burn
    an ISO...


    # # How to burn an ISO


    Want to try a new ISO? Here''s how get started...


    ![](img/511bb591be9ee7dc0f73776baf9a0548_95_2.png)


    ![](img/511bb591be9ee7dc0f73776baf9a0548_95_3.png)


    # STEP 1: Grab a new ISO


    Copy the ISO from our cover disc to your hard drive. Go to the discs tab, click
    ISO and choose to save. Find an ISO online to download. If you''re not sure if
    you need a 32-bit or 64-bit version, go to the forum for.


    # STEP 2: Open or install Brasero


    Brasero is the most popular open source disc burning utility. If it''s not already
    installed on your distro, locate it in your repository and install it. Then open
    the project and select ''Burn image'' from the Projects tab on the left.


    # STEP 3: Burn your disc image


    On the Image Burn Menu, select the disc - marked with ''click here'' to select
    a disc image - and navigate to the ISO you just put on your drive. Once selected,
    ensure you''ve got a CD or DVD writeable disc inserted and click ''Create...'
