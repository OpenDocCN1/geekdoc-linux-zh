    \  modified:   lisp-file.cl\n\nUntracked files:\n  (use \"git add <file>...\"\
    \ to include what will be committed)\n```\n\n## 09 Not that one\n\nIf you've staged\
    \ a new file, then git rm --cached to remove it from index, but --cached taking\
