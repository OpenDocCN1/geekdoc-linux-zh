    # 观点


    内核专栏 – Jon Masters


    ## 开源


    针对临时文件的利用可能会被归入历史，或者去猜它以后会被用什么命名。符号链接可以指向另一个文件，例如系统密码文件 (/etc/passwd 或 /etc/shadow)。更糟糕的是，如果编写内核源码的程序具有低效的优化示例，但
    Lennox 响应并被触发，那么攻击者将能够禁用系统操作，或者在某些情况下获得他们不应拥有的权限。这种攻击存在于文件问题的一个窗口期，在该窗口期内没有符号链接来检查该文件。这可能是一个极短的时间，但对于性能足够好的计算机来说，攻击者已经写了所有脚本来实现自动化。多年来，人们对文件问题提出了其他解决方案，但要正确实现非常复杂，且无法让程序员避免错误。通过实现一个用于原子化创建临时文件的简单原语，针对临时文件的利用历史就可以被终结。


