    # GROUP TEST


    # Cloud storage services


    Which service is the best and easiest way for Linux users to store, share and
    manage their data in the cloud? We take a look at four of the leading contenders


    Cloud storage is more important than ever, and is easiest way to save, transfer,
    back up and share important files and documents with people there''s an internet
    connection. It''s difficult to know which service to use, though there are a large
    number of different solutions, each with varying levels of Linux support.


    We''ve looked at four of the best services currently available, to make a judgment
    on what is currently the best cloud storage solution - the big boys like Dropbox
    and Ubuntu One to the more veteran SpiderOak and promising newcomer Copy. All
    of these services offer client-side support, web access and some degree of upgradable
    free storage.


    Off course, if you''re looking to create your own cloud storage, then you don''t
    need to look much further than the community-run ownCloud. You can even rent servers
    with it already set up. However, in this review, we''re looking at established
    services that look after the data themselves, with plenty of redundancy in place
    to avoid Failure.


    ![](img/511bb591be9ee7dc0f73776baf9a0548_67_0.png)'
