    \ you'll see, the help of the Raspberry Pi Library makes it very easy to use everything\
    \ you're trying to do with the GPIO pins. Finding the right pin might be more\
    \ than you think, though, since some have actually several names. For example,\
    \ GPIO 18 is I2S and PCM, so as much as we're using broad naming convention, as\
    \ opposed to the board, in your code you'll see BCM, BCM! We're using Broadcom\
    \ numbers, which are opposed to the 'physical' pin system that can also be used\n\
    \n```python\nGPIO.setup(BCM)\n```\n\nin all our code. To make matters, some pin\
    \ numbers changed between Revision 1 and 2 boards. We're using Revision 2 in this\
    \ Raspberry Pi with 512MB of RAM and holes, but you can find the Revision 1 by\
    \ searching for it online. It can be confusing at first, but the easiest way to\
    \ deal with the GPIO pins is to pick a convention and stick with it!\n\nTHIS IS\
    \ REV 2 There are some different pin numbers on your Pi's revision. Don't forget\
    \ to check!\n\nPURPLE PINS These pins can be used, also for things like serial\
    \ connections\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_20_0.png)\n![](img/511bb591be9ee7dc0f73776baf9a0548_20_1.png)\n\
    \nUsually there are two options when you're demonstrating electronics circuit\
    \ diagrams or hardware-read breadboard. Fritzing is one way, another that supports\
    \ anyone working with electronics. The tool allows you to pick components and\
    \ – using a drag-and-drop interface – create your circuit and then output it as\
    \ an image. Hopefully you'll have as much fun with Fritzing for your projects\
    \ as we will with this one! fritzing.org\n\n> We highly recommend kitting out\
    \ your Pi with a Wi-Fi dongle and SSH into your Pi\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_20_2.png)\n\
    \n21 www.linuser.co.uk\n\n# Raspberry Pi Robot\n\n## Build the motor circuit\n\
    \nLet's start by making a simple motor circuit on the Raspberry Pi\n\nThe base\
    \ skill of our robot is movement, and this is handled by the motors supplied with\
    \ our Magician chassis. Motors come in a large variety of sizes and types, but\
    \ here we will use two DC motors to drive it. Due to the limited power offered\
    \ by the Pi, we will require some additional batteries and an IC to turn our motors\
    \ on and off. Don't ever power them from the Pi. The motor driver we will use\
    \ is an H-Bridge. This one, L293D, IC which is sometimes called, will handle the\
    \ separate power control as well as providing bi-directional control for two motors.\n\
    \n| Component | Description |\n| :--- | :--- |\n| RASPBERRY PI | Works with both\
    \ rev 1 and rev 2 model B, and A Raspberry Pi |\n| MULTIPLE MOTORS | The single\
    \ motor driver can handle 2 DC motors, independent control |\n| ADDITIONAL POWER\
    \ | Motor powered by four AA batteries giving us 6 volts, perfect for most small\
    \ robots |\n| MOTOR DRIVER | L293D sitting across the middle of the breadboard\
    \ will perform all the hard work |\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_21_0.png)\n\
    \n# Parts list\n\n- Raspberry Pi (any model)\n- Breadboard\n- 2 DC motors\n- L293D\
    \ IC\n- jumper wires\n- 4x AA batteries\n- Battery holder\n\n 01 Adding the L293D\n\
    Place the L293D chip into the middle of the breadboard and all the red and black\
    \ cables, paying attention to the pins. The orange wire will be for the batteries.\n\
    \n 02 Configure the data lines\nDouble-check the connections to ensure yours are\
    \ correct. There are six wires from the Pi GPIO pins to the input pins of the\
    \ L293D. These will be responsible for our motors.\n\n 03 Finish the circuit\n\
    Now we can connect the motors. We won't know which way they turn yet, so make\
    \ sure you can easily swap them around. Finally, add batteries and plug in the\
    \ Raspberry Pi.\n\n> CAUTION: connect motors directly to the Raspberry Pi. Doing\
    \ so can damage the central processor, resulting in costly paperwork.\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_21_1.png)\n\
    \n# The motor circuit\nBuild your own Linux-powered robot\n\n## Motor circuit\
    \ code\n\nUsing Python to control the motors is made nice and simple with a library\
    \ called RPi.GPIO. This gets imported into your script and will handle turning\
    \ them on and off. It can also take inputs from sensors which we will cover in\
    \ the next pages, but first let's make our motors turn. 'board' corresponds to\
    \ the function of the pins, and 'BCM' is the numbering scheme. In this scheme\
    \ we'll use BCM. It's not necessary, but it's a good idea (to save confusion)\
    \ to use the GPIO name for each motor clearly.\n\n## First motor test, here is\
    \ how to get your motors moving\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_22_0.png)\n\
    \nTHE START\nAll we have left is to tell the pins they're using for our motors.\
    \ We've named them according to the GPIO for clarity. Once we have set the pins,\
    \ we will let the script run a few seconds before changing their direction.\n\n\
    ```python\nimport RPi.GPIO as GPIO\nfrom time import sleep\n\nMotorA = 24\nMotorIB\
    \ = 23\nMotorB = 25\nMotor2a = 9\nMotor = 18\nMotor2 = 11\n\nSETTING OUTPUTS\n\
    Are you want the motors to do, we tell Python it is an output.\n\n```python\n\
    GPIO.setup(MotorA, GPIO.OUTPUT)\nGPIO.setup(MotorIB, GPIO.OUTPUT)\nGPIO.setup(MotorB,\
    \ GPIO.OUTPUT)\nGPIO.setup(Motor2a, GPIO.OUTPUT)\n\nprint (\"Going forward\")\n\
    GPIO.output(MotorA, GPIO.HIGH)\nGPIO.output(MotorIB, GPIO.LOW)\nGPIO.output(MotorB,\
    \ GPIO.HIGH)\nGPIO.output(Motor2a, GPIO.LOW)\nsleep(2)\n\nprint (\"Going backward\"\
    )\nGPIO.output(MotorA, GPIO.LOW)\nGPIO.output(MotorIB, GPIO.HIGH)\nGPIO.output(MotorB,\
    \ GPIO.LOW)\nGPIO.output(Motor2a, GPIO.HIGH)\nsleep(2)\n\nprint (\"For 2 seconds\"\
    )\nGPIO.output(MotorA, GPIO.OUTPUT)\nGPIO.output(MotorIB, GPIO.OUTPUT)\nGPIO.output(MotorB,\
    \ GPIO.OUTPUT)\nGPIO.output(Motor2a, GPIO.OUTPUT)\nsleep(2)\n\nprint (\"And stop\
    \ before cleaning\")\nGPIO.cleanup()\n```\n\n> It’s a good idea to give the pins\
    \ a name. So we’ll use the L293D pins for controlling them easily\n\n```python\n\
    MAKING MOVEMENT\nThe pins should be on to create movement - forwards, backwards\
    \ and stopping.\n\n```python\n#!/usr/bin/python3\n# motor_test.py - May 17, 2023\
    \ 14:53:23 UTC\nimport RPi.GPIO as GPIO\nfrom time import sleep\n\nGPIO.setmode(GPIO.BCM)\n\
    GPIO.setup(MotorA, GPIO.OUTPUT)\nGPIO.setup(MotorIB, GPIO.OUTPUT)\nGPIO.setup(MotorB,\
    \ GPIO.OUTPUT)\nGPIO.setup(Motor2a, GPIO.OUTPUT)\n\nprint (\"Going forward\")\n\
    GPIO.output(MotorA, GPIO.HIGH)\nGPIO.output(MotorIB, GPIO.LOW)\nGPIO.output(MotorB,\
    \ GPIO.HIGH)\nGPIO.output(Motor2a, GPIO.LOW)\nsleep(2)\n\nprint (\"Going backward\"\
    )\nGPIO.output(MotorA, GPIO.LOW)\nGPIO.output(MotorIB, GPIO.HIGH)\nGPIO.output(MotorB,\
    \ GPIO.LOW)\nGPIO.output(Motor2a, GPIO.HIGH)\nsleep(2)\n\nprint (\"For 2 seconds\"\
    )\nGPIO.output(MotorA, GPIO.OUTPUT)\nGPIO.output(MotorIB, GPIO.OUTPUT)\nGPIO.output(MotorB,\
    \ GPIO.OUTPUT)\nGPIO.output(Motor2a, GPIO.OUTPUT)\nsleep(2)\n\nprint (\"And stop\
    \ before cleaning\")\nGPIO.cleanup()\n```\n\n 04 Prepare your script\nLogin into\
    \ your Raspberry Pi - username is 'pi' and password 'raspberry'. We will now create\
    \ our first script, in nano motor_test.py to open this. This will be the open\
    \ part.\n\n 05 Save your code\nTesting the code, but remember it's sensitive.\
    \ Capital letters are important and indent the code with a space, keeping it consistent.\
    \ When hold Ctrl and X, then Y to.\n\n 06 Test your motors\nNow it is time for\
    \ to run your python motor_test.py. If something doesn't work, revise the wires,\
    \ making sure to check the pins and the things that bind them.\n"
