    - 192.168.31.0/24

    - safe ports 80

    - safe ports 443

    - safe ports 21


    # 02 Install CentOS


    Download the CentOS image from www.centos.org. Wait for Desktop installation profile
    to complete. Reboot when prompted and then log in.


    # 03 Set up adapters


    Click on network adapter, then Edit... to change the settings for each one. Select
    the first adapter and Connect Method Auto. Select the second adapter and Connect
    Method Static. For the first adapter, set the IP address of 10.2.0.10, subnet
    mask 255.255.255.0, and gateway 10.2.0.1. Set the second adapter IP address of
    10.3.0.10.


    # 04 Become root


    Throughout this tutorial, you will need to run as root.


    # 05 Install the repository


    For CentOS (or RHEL) go to http://tinyurl.com/repo and follow the instructions
    to download the rpforge-release package. Install GPG key and install the repository.
    Run yum install -i <name of package>. Run yum update to update the system.


    # 06 Install DansGuardian and Squid


    DansGuardian and web cache Squid work in tandem with each other. Install both
    by using the command yum install dansguardian squid


    # 07 Start DansGuardian and Squid


    Throughout this tutorial, we''ll check the output for errors.


    ![](img/511bb591be9ee7dc0f73776baf9a0548_38_5.png)


    # 08 Test the proxy


    DansGuardian and Squid are probably working well with the default settings. This''s
    time to test it, go to DansGuardian in Firefox and go to Edit>Preferences>Advanced>Network.
    Set the settings, selecting ''Manual proxy configuration''. In the HTTP Proxy
    box, insert 127.0.0.1 with a port of 8080.


