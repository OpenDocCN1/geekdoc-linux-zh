  - "[PAGE 31]\n\n# Raspberry Pi Robot\n\n# Use analogue sensors\n\nOpen your robot\
    \ to a new world of input.\n\nAs we've already using microcontrollers and ultrasonic\
    \ sensors, the Raspberry Pi is capable of taking inputs and performing actions\
    \ based on the outside. Inputs come in a variety of different types. Most common\
    \ are digital sensors as buttons and switches, but there are also analogue sensors\
    \ which can be read to temperatures or brightness. These sensors give us their\
    \ data in the form of a voltage.\n\nThe Raspberry Pi is unable to read an analogue\
    \ signal so a little help is required which comes in the form of a microchip MCP3008.\
    \ This chip is commonly referred to as an ADC (analogue-to-digital converter).\
    \ It can communicate with the Raspberry Pi via serial and is capable of reading\
    \ analogue inputs at once or in form of a number. 0 corresponds to the lowest,\
    \ 1023 is the maximum voltage.\n\nUsing an analogue, we can build a robot that\
    \ is capable of following (or avoiding) bright light – perfect if you have a plant\
    \ to follow the sun during the day.\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_31_0.png)\n\
    \n3.3V POWER\nMake sure the chip is hooked up to the 3V3 pin and not the 5V pin\
    \ on the Raspberry Pi, otherwise it will kill the processor\n\n+   Parts list\n\
    1x MCP3008\n2x Light-dependent resistors (LDRs)\n2x 10K resistors\nJumper wires\n\
    \n![](img/511bb591be9ee7dc0f73776baf9a0548_31_1.png)\n\nDATA TABLES\nAn MCP3008\
    \ communicates via a serial protocol called SPI, Serial Peripheral Interface.\
    \ More than one can be used at the same time\n\nTHE SENSORS\nnThe light-dependent\
    \ resistors (LDRs) change their voltage based on the amount of light they receive\n\
    \n![](img/511bb591be9ee7dc0f73776baf9a0548_31_2.png)\n\nMCP3008\nThe heart of\
    \ the analogue-to-digital conversion\n\n# Test, test and again\n\n# Like good\
    \ scientists we check if it works\n\nPULL-DOWN RESISTORS\nTo a stable reading,\
    \ we have to give it a basic reference point for the voltage, so a pull-down resistor\
    \ is required\n\nNow we have the ADC, we need to make it work. So before we read\
    \ the values and display them on the screen. This will help us get an overall\
    \ idea of what to expect in the bright light, when we are in the dark.\n\n```\n\
    sudo apt-get install python-dev\nsudo pip install spidev\nso reboot.\n```\n\n\
    ```\nimport spidev\nspi = spidev.SpiDev()\nspi.open(0,0)\n```\n\nBefore we can\
    \ use the MCP3008, we need to enable the serial inputs and spidev, so let's do\n\
    \nOnce this is done, in our code is to tell the Python library where we need.\
    \ We need to create a new instance and tell it what MCP MCP3008 chip is on, and\
    \ which bus number.\n\nOpen a terminal, and type the following in the commands:\n\
    \nWe are ready now, so we'll define a function which will handle communication\
    \ and returning it to our script so we can act upon it and return its value.\n\
    \n```\nsudo nano /etc/modprobe.d/raspberrypi-blacklist.conf\n```\n\n```\ndef get_value(channel):\n\
    \    if (channel > 7) or (channel < 0):\n        return -1\n    r = spi.xfer2(1,((channel<<8)|2),8)\n\
    \    ret = (ret[0] & 3) + (ret[1] >> 2)\n    return ret\n```\n\n```\nwhile True:\n\
    \    print \"Channel 0: \" + str(get_value(0))\n    print \"Channel 1: \" + str(get_value(1))\n\
    \    time.sleep(0.3)\n```\n\nAnd add a # to the start of each line in the file,\
    \ then...\n\n32 www.linuxux.co.uk"
- md: "\n## Sensing with the Raspberry Pi\n\n## With everything connected up, let's\
    \ choose some light\n\nHopefully we have a set of numbers scrolling down the screen,\
    \ and we have tested it by covering the sensor to see how it reacts. Now we use\
    \ LDRs to detect the level of light to tell the robot to move forward at a slower\
    \ pace, using a speed of 25. As the LDRs are constantly checking the light, if\
    \ one gets dark for instance it will speed up towards the light to get an idea\
    \ of the values that will be expected from the LDRs. Then change data depending\
    \ on the ambient light.\n\n### 01 Mount the LDRs\n\nIt is best to place them pointing\
    \ outwards to catch different light, if the robot starts to spin then onboard.\n\
    \n### 04 Create the script\n\nOnce everything is connected, we will need to write\
    \ our Python script: analog.py then press Ctrl+S to save the file. It should have\
    \ no errors now:\n\n```python\nimport spidev\nimport GPIO\n\nGPIO.setmode(GPIO.BCM)\n\
    GPIO.setup(18, GPIO.OUT)\nGPIO.setup(23, GPIO.OUT)\n\nspi = spidev.Spi()\nspi.open(0,0)\n\
    ```\n\n### The complete code\n\n```python\ndef forward():\n  GPIO.output(18, GPIO.HIGH)\n\
    \  GPIO.output(23, GPIO.LOW)\n  time.sleep(speed)\n\ndef backward():\n  GPIO.output(18,\
    \ GPIO.LOW)\n  GPIO.output(23, GPIO.HIGH)\n  time.sleep(speed)\n\ndef stop():\n\
    \  GPIO.output(18, GPIO.LOW)\n  GPIO.output(23, GPIO.LOW)\n\ndef get_value(channel):\n\
    \  if channel == 7:\n    return -1\n```\n\n### 05 Run the script\n\nAll that is\
    \ required is to use analog.py to run the program. Start the robot until it follows\
    \ the bright light, then check your connections or go back and adjust. (img/511bb591be9ee7dc0f73776baf9a0548_32_0.png)\n\
    \n### 02 Change the motors\n\nWe are using the SPI bus for MCP3008 communication,\
    \ we need to move the motor to different GPIO pins, so we switch pins 8, 9 and\
    \ 10 to 22 and 27.\n\n### 06 Something is wrong\n\nIf you're sure it's working\
    \ it could be due to a value used. Run the test script again to replace the 60.\
    \ Remember - at different times of day you need to change your variables.\n\n\
    ```python\nMotor1 = GPIO.PWM(22, 58)\nMotor2 = GPIO.PWM(11, 58)\n\ndef forward():\n\
    \  Motor1.start(speed)\n  Motor2.start(speed)\n\nChangeDutyCycle(speed)\n\ndef\
    \ backward():\n  GPIO.output(18, GPIO.HIGH)\n  GPIO.output(27, GPIO.HIGH)\n  GPIO.output(23,\
    \ GPIO.LOW)\n  GPIO.output(11, GPIO.LOW)\n  GPIO.output(9, GPIO.LOW)\n  GPIO.output(10,\
    \ GPIO.LOW)\n  Motor1.stop()\n  Motor2.stop()\nChangeDutyCycle(speed)\n\ndef left():\n\
    \  GPIO.output(27, GPIO.HIGH)\n  GPIO.output(17, GPIO.LOW)\n  Motor1.stop()\n\
    \  Motor2.stop()\n\nwhile True:\n  ldr_left = get_value(0)\n  ldr_right = get_value(1)\n\
    \n  if ldr_left > 60:\n    print(\"turn right\")\n  elif ldr_right > 60:\n   \
    \ print(\"turn left\")\n  else:\n    forward(75)\n  time.sleep(0.25)\n```\n\n\
    ### 03 Double-check everything\n\nAs we have a lot of power - we are using 33V\
    \ for the MCP3008, 5V for the LDRs and batteries - it is best to check they are\
    \ all correctly wired up. If it looks good, add power and log into the Pi.\n\n\
    ## It is best to place the LDRs apart, pointing outwards\n\n(img/511bb591be9ee7dc0f73776baf9a0548_32_1.png)\n\
