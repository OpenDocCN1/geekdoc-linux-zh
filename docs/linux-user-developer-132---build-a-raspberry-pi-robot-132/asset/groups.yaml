    # # Cloud storage service group test

    Of the best cloud storage solutions battle it out


    # In brief: Compare and contrast our verdicts


    | Ubuntu One | Copy | Dropbox | SpiderOak |

    | --- | --- | --- | --- |

    | Installation | Decent free space, low-priced small increments **7** | Copy offers
    the cheapest cloud space in this test **9** | A low amount of free space, with
    reasonable upgrade fees **6** | Not the best free space, but as decent upgrade
    fees **6** |

    | Workflow | Integrates well with Ubuntu **7** | No properly installing binary,
    but the client can launch at boot **5** | Dropbox across every conceivable platform
    flawlessly **8** | Very well integrated into a Linux system, allowing you to use
    what you want **8** |

    | Features | As well as the basics, you can stream from it **7** | Copy has a
    basic set of features, although you can delete from the client **5** | A more
    than basic feature set, as well as great sync options **9** | Full of great features,
    such as syncing two selected folders anywhere **9** |

    | Plug-in support | Not much to change and customise in Ubuntu **5** | You can
    customize little in Copy, barely please **4** | You can change some of the settings
    to easily streamline **7** | Almost every important syncing feature is customizable
    **8** |

    | Overall | A decent cloud storage solution is a little free-and-forget **7**
    | It works well for service, as it is easy to go to and compete with **6** | Dropbox
    deserves its status, but needs better services around **8** | Currently the best
    cloud storage for Linux, bar none **9** |


    > "The client''s guest of customability makes it adaptable for any situation"


    # AND THE WINNER IS...


    SpiderOak

    All of the services have their upsides and downs. However, SpiderOak offers the
    most benefits, for Linux users. The client software''s vast degree of customizability
    makes it adaptable for any situation and while music streaming of Ubuntu, the
    cheap space of Copy or even the stability of Dropbox, has the best selection of
    all other features. The company behind SpiderOak is extremely stable with its
    privacy scheme, an effective one where it doesn''t even know what has on its servers.


    We think Copy has some time to become a major player in the cloud storage world,
    especially with a strong and decent interface, but only if Dropbox does not raise
    its game on the Linux clients. For now, SpiderOak is still the best client and
    overall service to use on Linux.


    Rob Zwertst


    ![](img/511bb591be9ee7dc0f73776baf9a0548_72_0.png)


    Keep track of what you''ve synced with SpiderOak


