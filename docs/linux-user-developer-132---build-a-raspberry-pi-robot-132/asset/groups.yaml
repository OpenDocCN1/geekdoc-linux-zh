    # Life Cycle Of A Process


    The life cycle of processes in Linux is quite similar to that of humans. Processes
    are born, carry out tasks, go to sleep and finally die (or killed).


    Processes are one of the most fundamental aspects of Linux. To carry out any task
    in the system, a process is required. A process is usually created by running
    a binary executable, which in turn gets created from a piece of code.


    How a process is born, and the states that it acquires during its lifetime and
    death. In this article, we will explore in detail how a piece of code is converted
    first into a binary executable program and then into a process, identifiers associated
    with a process, the memory layout of a process, different states associated with
    a process and finally a brief summary of the complete life cycle of a process
    in Linux. So, if you are new to the concept of computing processes and are interested
    in learning more about it, read on...


    It is very important to understand the transition of a piece of code to a process.


    A process is nothing but an executable program in action. While an executable
    program contains machine instructions to carry out a particular task, it is when
    that program is executed (which gives birth to a corresponding process) that the
    task gets done. In the following section, we will start from scratch and take
    a look at how an executable program comes into existence and how processes are
    born out of it.


    ## From code to an executable program


    In this section we will briefly discuss the transformation of a piece of code
    to a program.


    The life of a software program begins when the developer starts writing code for
    it. Each and every software program you use is written in a particular programming
    language. If you use the term ''code'' you could simply think of it as a set of
    instructions for the software for functioning. There are various programming languages
    available for writing code.


    Now, once the code is written, the next step is to convert it into an executable
    program. For code written in C, you have to compile it into an executable program.
    The compiler converts the instructions written in a software program (the code)
    into machine-level instructions (the program executable), a program that can be
    executed by the operating system.


    A compiler is used for compiling software programs. For code written in C, the
    GCC compiler can compile source files on Linux. For example, the following command
    can be used to convert the programming language source file (hello.c) into an
    executable program (hello).


    ```bash

    gcc hello.c -o hello

    ```


    This command should produce an executable program named ''hello'' within the current
    working directory.


    (A diagram of the various process states between them)


    ### From an executable program to a process


    An executable program is a passive entity that does nothing until it is run, but
    when it is run, a new process is created which is then named. The process can
    be executed by running it from the directory where the program resides.


    There are three important identifiers associated with a process in Linux:


    ## THE BASICS


    A must-read for Linux newbies who want to learn about Linux processes.


    To do anything, a process is required. A process is usually created by running
    a binary program in which it starts. It is very important to understand how code
    is converted to a process and also how a process acquires its life and death.
    This is a must-read for beginners. Learning about Linux will let you dig into
    the fine details of how a piece of code is converted into a binary executable,
    what comes into existence as a process, memory layout of a process, different
    states associated with a process and finally how to complete the life cycle of
    a process in Linux.


    We will explore how a piece of code is converted first into a binary executable
    program and into a process and can learn about Process ID, Parent Process ID and
    Group ID in the textbox over the section.


    You will notice that a process named init is the first process that gets created
    in a Linux system; its ID is 1. All other processes are children and so on. The
    command can display the complete history of activity in a Linux system.


    To have a dynamic view of a process in Linux, always use the top command.


    ## Memory layout of a Linux


    The memory layout of a Linux process consists of the following memory:


    - Stack: The stack represents a region where function arguments and local variables
    are stored. It grows dynamically.

    - Memory mapping: This region is used for mapping files and shared libraries.

    - Heap: The heap is used for dynamic memory allocation during program execution.

    - Data segment: The data segment contains global and static variables that are
    initialized.

    - Text segment: The text segment contains the machine-code instructions of the
    program. You cannot modify this as the code segment is read-only.


    In the real world, the memory layout is actually a bit complex, but this simple
    version gives you an idea about the concept.


    ## Different types of a process


    A process in Linux can have any of four states:


    - Running: A process is said to be in a running state when it is actually executed
    or waiting to be executed in the scheduler''s queue.

    - Waiting: A process is said to be in a waiting state waiting for an event or
    some resource-operation to complete.

    - Stopped: A process is said to be in a stopped state when it receives a signal
    to stop it.


    ## PROCESS IDENTIFIERS


    Process ID, Parent ID and Group ID are three important identifiers associated
    with a process in Linux.


    - Process ID: A unique identifier usually a non-negative integer that is associated
    with every process. It is generally assigned to every new process in an increasing
    order. When the process is dead, the process ID can be reused for any other process.

    - Parent ID: The parent ID is the name suggests, the process ID of the parent
    process. Every process has a parent process. The parent process ID identifies
    the process that created the current process.

    - Group ID: Every process is assigned a group ID upon its creation and the same
    group ID is assigned to all the processes that it forked. For example, all the
    processes created by the same shell are bundled into the same group and are assigned
    a group ID that is unique to that particular group of processes.

