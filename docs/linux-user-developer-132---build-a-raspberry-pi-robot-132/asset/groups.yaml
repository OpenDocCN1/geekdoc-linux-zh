    \ 外部硬盘上。\n\n## 24 保持\n\n这些是你可以进行的所有调整，例如：\n\n# 教程 简单步骤：从外部硬盘双启动\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_45_0.png)\n\
    \n创建一个可以在硬盘上的每个安装之间切换的 GRUB 菜单：\n\n```\ngrub version 2.02-ubuntu2\nBoot with Linux\
