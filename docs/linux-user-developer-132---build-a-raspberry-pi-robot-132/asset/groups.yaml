    # Your view


    Your source of Linux news and views


    Contact us...

    Register and post your comments... Email us directly...

    www.linuxuser.co.uk/forum/ | linuxuser@imagine-publishing.uk


    # YOUR VIEW


    # Linux User Letters


    Your opinions about the magazine, Linux and open source


    a good understanding of Linux or the very least willing to learn.


    What I love about Gentoo is that you can set the environment the OS runs on. You
    can complete it to run on any specific CPU architecture, modules and many more;
    the limit is how much you understand how it works.


    The point is, there are many ways to skin a cake, and Gentoo is just one way.
    If you don''t like it, no problem, try LUbuntu anyway. But for me, Gentoo offers
    all you want why and how it''s done--thethe-scenes stuff. I like to see exactly
    as I want it, and why these packages require that and how they work and each thing
    I need then can simply turn it off during compiling etc. The sky is the limit.
    Power to the people. Knowledge is the power.


    # Generation Gentoo


    Gentoo is like other Linux out there. There are no differences between them; you''ll
    see like, and packages that you can get from like RH, CentOS, Debian and Ubuntu.
    Gentoo is the obvious fact that you can customize it exactly as you liking and
    in environments.


    I say that Gentoo and many source-based distros are not for people who want to
    try Linux out to see what it''s like, but rather for those who really improve
    their computing experience even if they did make use of it. It''s great that the
    option is there, especially when you need it.


    Will Schrier


    It''s true, Gentoo can be incredibly powerful if you know how to use it correctly.
    Not everyone does, though, and it can be confusing and over the top for most users,
    and wouldn''t even Sabayon is a great alternative for trying out Linux without
    fighting from scratch.


    # THREAD BARE


    We reviewed the MinBoard in last month''s issue, giving it a decent score but
    questioning whether or not it is the Raspberry Pi competitor marked as. When we
    posted it online, some folks told us about some of the other issues with the board.
    Join the conversation here: bit.ly/LUDMin


    # Carlos Lopez said:


    - Be careful with this if you are planning to use it for anything else. This board
    has the infamous Cedarev/Cedartrail GPU from PowerVR, Which is a nightmare for
    Linux users.

    - The open-source drivers for AMD600 only supports basic 2D, and the properties
    are none much than works. On top of that, this proprietary driver is only available
    for Ubuntu 10.04 and Mee.


    # Adrian Placeau said:


    - Intel is the new Microsoft in the cheap computer market and the x86 is a binding
    out of freedom.


    # Charlie Wiman said:


    - I saw AMD600 and was thinking. I thought that it was a PowerVR GPU, but I must
    be mistaken. Then I confirmed that I was not mistaken. Now I just wonder what
    kind of process went into putting a PowerVR GPU into Linux-based device. That
    seems crazy to me.


    # Microlith said:


    - The chip isn''t integrated into the CPU is an older one, and the GPU is an SGX35.
    This is a pretty old core that was used in a Lot of Cortex-A8 based SoCs.


    Because of this, I''m ignoring this round of the MinBoard and will be looking
    for a Ba Trail (or its follow) based board with Intel graphics.


    Some results are unimpressed by the MinBoard


    # Your view

    LETTERS

    GNOME, AV Linux, tutorial files


    Android Magazine

    With more and more Android features having merged back into the Linux kernel,
    expanding to develop for one of the most popular mobile operating systems around.
    With over 25 million users worldwide, and over 500 million Android devices, there''s
    a huge audience ready to consume apps. For many Android developers, look to our
    sister mag Android Magazine, which subsidises the desktop. Along with news and
    reviews to keep you up date also tutorials and advice on hacking your device.
    Find out more at www.littlegreen.org


    Mir is powering of Unity in 13.0 - so far, we''re not impressed


