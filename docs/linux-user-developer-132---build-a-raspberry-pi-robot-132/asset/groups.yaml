    ![](img/511bb591be9ee7dc0f73776baf9a0548_44_5.png)


    ![](img/511bb591be9ee7dc0f73776baf9a0548_44_6.png)


    ![](img/511bb591be9ee7dc0f73776baf9a0548_44_7.png)


    ![](img/511bb591be9ee7dc0f73776baf9a0548_44_8.png)


    # ## 16 Easy updating


    There are two ways to get Tiny Tiny RSS: the easiest is to get it into the config.php
    file and locate the SIMPLE_MODE variable. Change it to live and update your feeds
    when you''re feeding your reader


    # ## 17 Better updating


    If you''re using Tiny Tiny RSS on your server you can have the feeds in daemon
    so it''s always updated when you log in. For single processes, access the PHPI
    cli:


    ```

    php /daemon daemon.php

    ```


    For multi-use:


    ```

    php /daemon1 daemon2.php

    ```


    # ## 18 View


    By default, all the articles will be in one view - a much nicer for navigating
    your feeds. To change it you can click and navigate between feed items, go to
    Preferences and check ''Automatically export articles in configured mode'':


    ![](img/511bb591be9ee7dc0f73776baf9a0548_44_9.png)


    ![](img/511bb591be9ee7dc0f73776baf9a0548_44_10.png)


    ![](img/511bb591be9ee7dc0f73776baf9a0548_44_11.png)


    # ## 22 Android


    If you used to read the feeds on Google Reader Android, you''ll be glad to know
    there is an Android app for Tiny RSS. It will cost you $1 to use after seven days,
    but it''s a great way to keep up with feeds on mobile, and easily log into your
    new RSS reader.


    # ## 19 Keyboard shortcuts


    The shortcuts are slightly different in Tiny RSS. For going between articles press
    N and P and you are now to go to feeds. You can view the full list by going to
    Actions, ''Keyboard shortcuts'':


    # ## 20 Add feeds


    Use Actions/Subscribe to Feed and paste a URL into the feed. You can then add
    it to one of your categories, then move it to another by going to Preferences
    and then right-click on the subscription menu


    # ## 21 Rearrange categories


    It may seem from the main interface that you can rearrange your feeds to an order
    you like. Go to Preferences, Feeds and drag and drop them to rearrange. You can
    even move feeds within these categories.


    # ## 23 Updating


    Like all other, Tiny RSS is upgrading and updates all the time. You can update
    the software without reinstalling, simply go to Preferences and then to the Update
    Tiny RSS tab. It will inform you of any available updates


    # ## 24 Keep keeping


    This is all of other tweaks you can do with Tiny RSS, such as the interval, the
    length of time to store articles, get a fresh item, etc. Then go to Preferences
    and make Tiny RSS the best for your needs


    ![](img/511bb591be9ee7dc0f73776baf9a0548_44_12.png)


