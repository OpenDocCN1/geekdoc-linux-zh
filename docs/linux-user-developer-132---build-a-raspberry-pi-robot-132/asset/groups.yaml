    # 来源专栏


    ## 飞速前进？


    SteamOS 会成为主流 Linux 的出路吗？


    在那些专有的、权利控制的乐趣中，源自两家公司，它们意图尽可能地锁定客户，就像微软那样，使用合适的工具尽可能地做到，并尝试除除对相关产品闭眼睡觉之外能做的一切。


    其他公司也是如此，当他们进行每年两次的销售活动时，他们习惯于以令人印象深刻的速度和钟表掏空你的钱包，这本质上会下载你的游戏，并对它们施加高的 DRM（数字版权管理）。这是与大巨头打交道的代价，而你可以做一些不同且感觉更舒服的事情（尽管目前在场的
    Valve 也是一个开发者）。


    现在 Xbox 和 PlayStation 品牌是如此主导，以至于他们的其他平台几乎没有立足之地。问问天堂，这家公司突然没主意，面临着“无关紧要”（不是我的话）的危险，而就在它处于主导市场地位的几年后。那么
    PC 游戏呢？它的选择多到我无法列举。


    通过 SteamOS，它成为了最新一系列采用 Linux 操作系统并将其大做文章的公司中的一个。我记得 Corebel 曾经辉煌过，但陷入了财务问题，并在之后的很长一段时间内由
    Core Linux 救助。


    但某些人可能会说这是一个意外。随着崛起和廉价化动摇现状，没有理由让它离开。讽刺的是，Steam 正在去标准化。


    SteamOS 是一个有趣的项目。首先，它是为“客厅设备”设计的，这是将 PC 游戏带入客厅的绝佳方式。在电视上玩时，我们离类主机体验还有很长的距离，但 Valve
    认为“游戏开发者已经在采取”


    Steam 是一项对那些喜欢在 PC 上玩游戏的人非常有益的业务。它处理更新，它保持……


    话虽如此，这感觉更像是通过提倡和推动 Linux 发展来戳微软和索尼的眼睛。然而，如果它能成功实现后者，尽管 Valve 使用 Linux 的方法存在问号，但仍有积极的一面。如果我现在正在管理
    Windows 8，我可能只会再多开一个会议……


