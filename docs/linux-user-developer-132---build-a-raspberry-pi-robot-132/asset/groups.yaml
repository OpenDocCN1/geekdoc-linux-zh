    Place the L293D chip into the middle of the breadboard and all the red and black
    cables, paying attention to the pins. The orange wire will be for the batteries.


    02 Configure the data lines

    Double-check the connections to ensure yours are correct. There are six wires
    from the Pi GPIO pins to the input pins of the L293D. These will be responsible
    for our motors.


