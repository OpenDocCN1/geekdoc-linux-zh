    # A process life cycle


    From the time a process is created, to the time it quits (or killed), it goes
    through various stages. In this section, we will discuss the complete life cycle
    of a Linux process from its birth to death.


    If a process needs to do things such as acquiring a hardware resource or performing
    I/O, it is put into the sleeping state. When the response is ready or the I/O
    is complete, the process is resumed and it can be put back into the running kernel
    node.


    When a Linux system boots, a compressed executable is loaded into memory. This
    executes the first process (or the first in the system) which is responsible for
    creating all other processes in Linux.


    A process can be created in two ways: by forking a parent or by executing a program.
    If fork() is used, the process uses the address space of the parent and runs in
    the same context as the parent. The process gets a copy of all memory segments
    from the parent but keeps using the same segments until either (parent or child)
    tries to modify any of them. On other hand, if executed a new address space is
    assigned to


    A process might run quit gracefully or get killed by another process. In either
    case, it enters zombie state, where there is nothing left for the entry in the
    process table (maintained by kernel), This entry is not wiped up until the parent
    reads the exit status of the process. A process returns a status indicating whether
    the process did work correctly or incorrectly. The process remains in a zombie
    state until the parent acknowledges its exit.


    If the parent gets killed before the child process becomes an orphan. All the
    orphan processes are adopted by the init process, which becomes the new parent
    of these processes.


