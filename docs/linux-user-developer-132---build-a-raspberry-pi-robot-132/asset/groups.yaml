    \ (EL) are other ways in which robot can indicate its state. The more creative\
    \ the better: robotics can be as much of an artistic pursuit as a technical feat.\n\
    \nWith the computing power of the Raspberry Pi, you also have the space to expand\
    \ the software and beyond. Using a webcam or a camera for vision is probably one\
    \ of the most popular options. With a comprehensive source library, you can implement\
    \ vision quickly. You could use it to help your robot recognize faces, search\
    \ for objects in its environment, or recognize familiar places it's been before.\n\
    \nHowever, robotics is a vast field with many branches of robotics that seek inspiration\
    \ from the intelligence of animals. It's fascinating to consider how robots can\
    \ be built from infinite numbers of components. You can communicate with your\
    \ robot via Wi-Fi, or a central server, using IR LEDs and receivers to communicate\
    \ with neighbours.\n\nWhatever you do with your Raspberry Pi, and whichever direction\
    \ you end taking in, remember to tell the rest of the Raspberry community that\
    \ you're done! There are lots of friendly, knowledgeable people online who are\
    \ also making places. Like the Pi community is a great source of advice as you\
    \ attempt to build your dream robot. - Alan Brown, MD/OurRobotics.com\n\n## Facial\
    \ recognition Let the robot know who\n\nWith the simple addition of the Raspberry\
    \ Pi camera and OpenCV face detection and recognition is possible. You could do\
    \ this with a pan-tilt mount with the camera; this will allow the robot to move\
    \ and follow your movements.\n\n## Learning to talk Get an insight into your robot's\
    \ state\n\n## Spatial analysis Make accurate maps of your surroundings\n\nUsing\
    \ the ultrasonic sensor with a pan-tilt mount on your robot, effectively measure\
    \ every move and object in a room - a map constructed from the data. By taking\
    \ a series of measurements in different directions, the servo in the pan-tilt\
    \ mount, it is possible to map the room. With a sprinkling of code and gadgetry,\
    \ your robot to navigate the house. PID is an excellent field that can certainly\
    \ help with this.\n\nThe Raspberry Pi can provide audio output. With this speaker\
    \ a traveler will lead you to a world of communication. Using a simple speech\
    \ module like OpenCV, you can allow the robot to talk, or simply report text.\
    \ For debugging purposes: this can add another element to your creation, adding\
    \ speech recognition with a USB microphone, or similar, can take it to a whole\
    \ new level.\n\n(img/511bb591be9ee7dc0f73776baf9a0548_33_0.png)\n\n## What next?\
    \ Build your Linux-powered robot\n\n## Swarming One robot is cool, a bunch is\
    \ better\n\n## Robot arm Make the robot get it\n\nSwarming is an interesting branch\
    \ of computer science. Using just a little more code than we already have, we\
    \ can behave similar to that of bees, ants. A swarm of robots could discover an\
    \ area quickly, or be used to scientifically model traffic measurements, create\
    \ your own synchronised routines, or build a football team.\n\nEveryone would\
    \ love a robotic helper, perfect for performing tasks around the house. Unfortunately\
    \ we aren't there yet, but we can come close. By mounting a small arm to the form\
    \ of the robot, it can fetch lightweight items. With the help of the Pi camera\
    \ module, it could colour-sort LEGO blocks or navigate a maze.\n\n(img/511bb591be9ee7dc0f73776baf9a0548_34_2.png)\n\
    \n## Maze solving Outperform a lab rat\n\nPath finding and maze solving are other\
    \ exciting branches of computer science you can attempt with your Raspberry Pi.\
    \ Competitions are held around the world to be the fastest to solve a maze, using\
    \ lines on the floor or sensors. All you need is a mechanism to recall past movements\
