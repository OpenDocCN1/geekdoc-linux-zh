    欢迎使用《Linux User & Developer》DVD。我们的最新版本可以免费刻录了全新的 Linux 发行版以及供使用和测试的免费软件。我们专门设立了一个板块，介绍了本期所有关于机器人的文章，这些文章与本月杂志的内容相关。


    在第 132 期的光盘中，我们包含了两个最大的上游项目的测试版：openSUSE 13.1 和 Ubuntu 13.10 - 它们将是首次在我们新的显示服务器上启动的发行版。通过
    Minimal，我们还默认包含了安全发行版 Tor，以及极小的 Tiny Core。开始之前，请将 DVD 刻录到您的光驱器中，重启电脑并从光盘启动以探索不同的发行版。要安装
    Ubuntu，您必须将光盘插入光驱器并在启动菜单中选择它。从那里，您可以使用现场启动，如果您愿意，还可以刻录一个 ISO...


    ## 如何刻录 ISO


    想尝试新的 ISO 吗？这里是入门方法...


    ![](img/511bb591be9ee7dc0f73776baf9a0548_95_2.png)


    ![](img/511bb591be9ee7dc0f73776baf9a0548_95_3.png)


    # 步骤 1：获取一个新 ISO


    将 ISO 从我们的封面光盘复制到您的硬盘。进入“光盘”选项卡，点击 ISO 并选择保存。在网上找到一个 ISO 并下载。如果您不确定需要的是 32 位还是
    64 位版本，请访问论坛。


    # 步骤 2：打开或安装 Brasero


    Brasero 是最流行的开源光盘刻录工具。如果您的发行版尚未安装，请在存储库中找到它并安装。然后打开项目，从左侧的“项目”选项卡中选择“刻录镜像 (Burn
    image)”。


    # 步骤 3：刻录您的磁盘镜像


    在“刻录镜像”菜单中，选择光盘——标记为“点击此处”以选择光盘镜像——并导航到您刚刚放入硬盘的 ISO。选择完成后，确保您已插入 CD 或 DVD 可写光盘，并点击“创建
    (Create...)”。


