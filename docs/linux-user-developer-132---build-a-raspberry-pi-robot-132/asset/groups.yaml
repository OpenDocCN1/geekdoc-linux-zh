    The system, designed with existing Linux applications and runtime environments,
    OSv offers lightweight scheduling, cooperation between the kernel, shared memory
    pools and claims of unparallelised performance running on hypervisors rather than
    metal – making OSv, the first operating system to completely replace the kernel.


