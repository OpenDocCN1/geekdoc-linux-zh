    \ /usr/local/pyobject\n```\n\nAfter that you should be able to install\n\n## Be\
    \ our guest\n\nI like testing out different distributions as well. After a few\
    \ mistakes and then properly new installation of pyobject, I have decided to start\
    \ using VirtualBox. I like open software - the past few years has helped me choose\
