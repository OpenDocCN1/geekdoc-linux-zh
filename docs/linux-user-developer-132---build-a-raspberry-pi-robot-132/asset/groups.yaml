    \n[content]\n## 使用树莓派进行传感\n\n## 既然所有设备已连接就，让我们选择一些光线\n\n希望屏幕上有一组数字向下滚动，我们已经通过遮住传感器来测试了它的反应。现在，我们使用\
    \ LDR（光敏电阻）来检测光照强度，并告诉机器人以 25 的速度缓慢地向前移动。由于 LDR 会不断检测光线，例如如果其中一个变暗了，它将向着光线方向加速，以获取\
    \ LDR 预期的数值参考值。然后根据环境光线改变数据。\n\n### 01 安装 LDR\n\n最好将它们朝向外放置，以捕获不同的光线，如果机器人在板载上开始旋转的话。\n\
    \n### 04 创建脚本\n\n一旦一切连接完成，我们需要编写我们的 Python 脚本：`analog.py`，然后按 Ctrl+S 保存文件。现在它应该没有错误了：\n\
    \n```python\nimport spidev\nimport GPIO\n\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(18,\
    \ GPIO.OUT)\nGPIO.setup(23, GPIO.OUT)\n\nspi = spidev.Spi()\nspi.open(0,0)\n```\n\
    \n### 完整代码\n\n```python\ndef forward():\n  GPIO.output(18, GPIO.HIGH)\n  GPIO.output(23,\
    \ GPIO.LOW)\n  time.sleep(speed)\n\ndef backward():\n  GPIO.output(18, GPIO.LOW)\n\
    \  GPIO.output(23, GPIO.HIGH)\n  time.sleep(speed)\n\ndef stop():\n  GPIO.output(18,\
    \ GPIO.LOW)\n  GPIO.output(23, GPIO.LOW)\n\ndef get_value(channel):\n  if channel\
    \ == 7:\n    return -1\n```\n\n### 05 运行脚本\n\n仅需使用 `analog.py` 运行程序。启动机器人直到它跟随亮光移动，然后检查你的连接或返回进行调整。（img/511bb591be9ee7dc0f73776baf9a0548_32_0.png）\n\
    \n### 02 修改电机\n\n我们正在使用 SPI 总线与 MCP3008 进行通信，我们需要将电机移动到不同的 GPIO 引脚，因此我们将引脚 8、9\
    \ 和 10 切换到 22 和 27。\n\n### 06 有些问题\n\n如果你确定它运行正常，可能是由于使用的某个值。再次运行测试脚本以替换 60。记住——在一天中不同时间你需要更改你的变量。\n\
    \n```python\nMotor1 = GPIO.PWM(22, 58)\nMotor2 = GPIO.PWM(11, 58)\n\ndef forward():\n\
    \  Motor1.start(speed)\n  Motor2.start(speed)\n\nChangeDutyCycle(speed)\n\ndef\
    \ backward():\n  GPIO.output(18, GPIO.HIGH)\n  GPIO.output(27, GPIO.HIGH)\n  GPIO.output(23,\
    \ GPIO.LOW)\n  GPIO.output(11, GPIO.LOW)\n  GPIO.output(9, GPIO.LOW)\n  GPIO.output(10,\
    \ GPIO.LOW)\n  Motor1.stop()\n  Motor2.stop()\nChangeDutyCycle(speed)\n\ndef left():\n\
    \  GPIO.output(27, GPIO.HIGH)\n  GPIO.output(17, GPIO.LOW)\n  Motor1.stop()\n\
    \  Motor2.stop()\n\nwhile True:\n  ldr_left = get_value(0)\n  ldr_right = get_value(1)\n\
    \n  if ldr_left > 60:\n    print(\"turn right\")\n  elif ldr_right > 60:\n   \
    \ print(\"turn left\")\n  else:\n    forward(75)\n  time.sleep(0.25)\n```\n\n\
    ### 03 再次检查一切\n\n由于我们有充足的电源——MCP3008 使用 33V，LDR 和电池使用 5V——最好检查它们是否都已连接正确。如果看起来没问题，接通电源并登录树莓派。\n\
