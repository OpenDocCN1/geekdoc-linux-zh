  mdcn: "\n\n# 问题与解答\n\n解决你的所有技术问题\n\n## Q/A\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_86_0.png)\n\
    \n## 过去的回响\n\n到为止，我处理过一个 1.3MB 的 RTF 软盘。在 2013 年，我实际上已经近十年没见过它了，但它是我们需要检查的存档的一部分。我在网吧上将其上传到云存储，找到了一个可以工作的软盘，然后再次下载了它。LibreOffice\
    \ 在尝试打开它时显示了以下错误：\n\n```\nFile error found at 5378, 30481 (row,column)\n```\n\n\
    显然，不是。有什么建议可以继续进行吗？我是应该在有盒子可用时尝试另一个软盘，还是在 Linux 中有任何免费的工具可以读取 RTF 文件？\n\n-  MyTV\
    \ 的设置可能有点复杂\n\n你基本上是对的——你需要循环挂载（loop-mount）、复制文件并将它们编辑到你的列表中。首先，\n\n```\n$ cp\
    \ -av * /[working_directory]\n```\n\n现在，编辑根文件中的 isolinux.cfg，添加你找到的启动选项。APPEND\
    \ 行是：\n\n```\n$ mount -o ISO; APPEND systemrescued=x86-3.1.iso [mount]\n```\n\n\
    ```\nroot=$(passwd) dockch rescue -c=/boot.cat /no-emul-boot /boot-load-size 4\
    \ \\-j\n```\n\n将所有文件复制到不同的目录以\n\n```\n-R \\ -v custom_sysrescued=\n```\n\n最后，将新的\
    \ ISO 刻录到光盘。当然要确保测试它，但这样就能按照你想要的方式运行。\n\n## 神话\n\n我有一个问题，我一直在 Google 上搜索它的解决方案。基本上，我在任何地方都没有找到它。我在\
    \ Linux 19 上有一个 Mythical 的后端和前端，在另一个 Windows 系统上也是。\n\n我想尝试从我的本地网络或通过我连接的电脑使用系统上的后端函数。\n\
    \n如果我在本地使用后端，它是可以运行的。当我通过局域网使用它时，它弹出了 TF TF RTF 文件。\n\n我尝试了许多方法，包括切换器和更改文件权限，但我仍然得到\n\
    \nTed Draper\n\n听起来你陷入了一点困境。我的第一个想法可能是你怀疑它在传输过程中损坏了。尝试用你自己的方法手动编辑它，或者尝试从 Linux\
    \ 的免费 RTF 文件中读取它？\n\n如果其他方法都失败了，我建议回到错误行并查看它们，看看是否有明显的问题——不要担心使用 1.3MB 的 RTF 文件。\n\
    \n否则，尝试在 Word 应用中打开它，或者可能使用 Windows 软件获得更多帮助。祝你好运！\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_86_1.png)\n\
    \n## 循环挂载、复制文件然后按你的喜好进行编辑\n\n如果你创建自己的脚本，请在目录根目录下创建一个文件，编写你的脚本，并使其具有可执行权限。\n\n\
    -  转向 Wine 是唯一的解决方案\n\n现在，从你一直在工作的修改目录中创建新的 ISO：\n\n```\n$ isolinux/isolinux.bin\
    \ \n-c /boot/boot.cat \n-no-emul-boot /boot-load-size 4 \\-j\n```\n\n77.linuxuser.com\n\
    \n# 问题与解答\n\n## Facebook: Linux 用户开发者\n\n## Twitter: @linuxusermag\n\n同样的错误。我至少在这里少一点。这让我倾向于认为我遇到了某种权限问题，我看到后端报告说“empty\
    \ 0 MB of 1867”，我推测是那个跳转文件。\n\n## Alan Deah\n\n这可能是多个问题之一——你能看到直播电视的选项意味着可能没有问题。检查确保你没有遇到任何问题，并确保你已经为后端设置了主机名。有时会导致此类问题，尤其是当你两个系统使用相同的日期而它们本可以获取日期时。\n\
    \n![](img/511bb591be9ee7dc0f73776baf9a0548_87_0.png)\n\n## 吸毒破灭\n\n一名前高中教师与一名老学生汇合，为他家庭的未来“制钱”。新剧集已播出。\n\
    \n## 破产了\n\n在某种程度上，我了解到过去一年左右我在 Netflix 上省了多少钱，我听说了关于无政府主义的，但在经历了 BBC 等经历之后，我并没有真正考虑过。过去几个月我看到的新功能确实提升了我的观看体验。\n\
    \n但唯一的问题是，他们拒绝修复他们的这个问题。我尝试过发送输出数据，但他们一直报错，我无法连接到它。有办法让 Netflix 正常工作吗？我越熟悉系统、使用得越频繁，我就越需要处理\
    \ Ubuntu 变体。你们能提供什么帮助？\n\n## Pat O'Reilly\n\n我们像你一样为 Ubuntu 感到难过，虽然我们的一些某些东西上似乎有问题，但我们在\
    \ Linux 上遇到了相同的问题。不过不要慌，因为有一个非常好的解决方案，它实际上比标准浏览器更好。首先，我们需要添加一个新的存储库：\n\n-  当天的《吸毒破灭》是下载盗版的最佳方法\n\
    \n```\nsudo apt-add-repository ppa:ehoover/compollo\n```\n\n接受密钥，然后更新：\n\n```\n\
    sudo apt-get update\n```\n\n最后，我们安装桌面版\n\n\n\n```\nsudo apt-get install firefox-netflix\n\
    ```\n\n这通过 Wine 运行，并打开一个完美播放的全屏应用！\n\n## Zsync 将使当前安装的发行版变为你正在运行的\n\n## rookie\n\
    \n自 Ubuntu 进入测试阶段以来，我一直在使用每日版本，当我为主系统使用开发版本时，我正尝试掌握头部。这需要一些精力，如果我需要，安装某些东西也很快。目前安装的发行版对你有效。Ubuntu\
    \ 每日版本有一个你可以轻松使用的链接，也是 zsync。\n\n```\nsudo apt-get zsync\n```\n\n然后从浏览器复制链接并输入：[zsync](...)\
