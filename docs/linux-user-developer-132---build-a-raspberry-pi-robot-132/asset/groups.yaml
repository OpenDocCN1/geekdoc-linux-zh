    ## 编辑推荐


    **Tails** Tails 是一个非常出色的发行版，它为面向安全的风险带来了安全感，因为它基于 Debian，它仍然非常好用，这意味着它可以访问所有最新且强大的
    Linux 软件包。


    **Audacity** 这款最好的开源音频编辑器是一款非常强大的软件，在过去的一年里，它已经与其他专业编辑工具媲美。它非常适合音乐和播客编辑。


    ## 完整索引


    **Ubuntu 13.10 Beta** Ubuntu 的下一步，13.10 是第一个替换 Canonical X 版本的发行版，也是 Ubuntu 的下一个
    LTS（长期支持）版本。请参阅第 80 页查看本月对该测试版的完整评论。


    **openSUSE 13.1 Beta** 通过该发行版的首次发布体验 openSUSE 13.1。在经历了 12 系列期间动荡的开发计划后，13 版本已回归正轨，错误测试披萨包正在全力进行中。


    **Tails** 这种匿名 Linux 现场系统是一个基于 Debian 的发行版，通过使用 Tor 提供匿名网络浏览。它还包含几个互联网应用程序，旨在尽可能安全。


    **Tiny Core 5.0** 史以来最小的 Linux 发行版，Tiny Core 在本期的第 79 页进行了介绍——一个可以在仅有 12MB ISO
    上运行的完整发行版，但我们包含了稍大的 ISO，您可以使用它进行安装。


