    \ as well. Git-doc provides comprehensive HTML documentation.\n\n## 07 Where is\
    \ it?\n\nIf you haven't committed yet, git status is useful for showing what changes\
    \ you've moved through Rails. Branch, staged, viewers and file helpers. What has\
    \ changed in files is shown by git diff the latest changeset on the next page.\n\
