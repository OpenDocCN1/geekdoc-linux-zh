    We are using CentOS.


    # 01 Set up network


    Most of the configuration is carried out using text files. We''ll be spending
    a bit of time at the command line for this fresh installation of CentOS, but most
    of it can be applied to other distros. Recommended configurations:

    - 192.168.0.0/24

    - 192.168.1.0/24

