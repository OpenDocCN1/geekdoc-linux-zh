    \ be a little tricky to set up\n\nYou're basically right – you need to loop-mount,\
    \ copy the files and edit them to your list. First of all,\n\n```\n$ cp -av *\
    \ /[working_directory]\n```\n\nNow, edit isolinux.cfg in the root file to add\
    \ the boot options you find. The APPEND line is:\n\n```\n$ mount -o ISO; APPEND\
