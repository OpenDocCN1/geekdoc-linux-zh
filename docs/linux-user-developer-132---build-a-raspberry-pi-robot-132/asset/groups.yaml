    2012 年响应了维护者的呼声。维护者的拉取请求出现在 2011 年初。Arnd 回复说该架构可能被移除，而 Al Viro 则提供了代码库中未解决 bug
    的示例。随后它一段时间内被视为移除，以让大家知道 MIPS 不是一种流行的架构，而且这不是一个标准，因此你不应该在互联网上找到相关新闻。但随着 SoC（系统级芯片）的采用，这些
    MIPS 特性也被采用了。他承诺致力于开发新功能，他后来确实做到了。


    几年前，我们在《Linux User & Developer》中写过一种名为 MIPS 的新架构，它是将新架构上游到内核的基准。似乎这最终可能会走向同样的道路。当时参与该工作的
    MIPS 开发者曾与 Arnd Rupprecht 交流，他是比过去更有方法地处理 Linux 架构移植的维护者，也是 asm-generic 工作的作者，该工作为此类移植提供了通用的框架。Günter
    Roeck 在一个标题为的补丁中指出：


    ## 退役 MIPS 架构


    计算机架构是对特定一组二进制机器的描述，它们向零的编码、其行为以及实现细节。Linux 和 ARM 架构都是流行的例子，但 Linux 包含某些功能，为某些市场领域创建了自己的指令（例如类似
    DSP 的优化），这通过 Linux 避免了向其他架构支付许可费，例如 ARM 架构（一种可以许可的流行架构以及


    其他内核开发者需要修复这些需求，而维护者需要确保内核在真实硬件（或模拟器）上继续工作和构建。随后他指出 GCC 端口目前已经过时，并计划移除，当他们意识到真正的问题更多在于架构上：MIPS
    不需要了，但它被用于各种运行 Linux 的系统和架构中，以便日常保留它，从长期来看（为了获取新功能）。毕竟，为了受益，一个架构必须由实现者投入足够的资源进行良好维护。讨论之后，新的补丁被发布并合并到
