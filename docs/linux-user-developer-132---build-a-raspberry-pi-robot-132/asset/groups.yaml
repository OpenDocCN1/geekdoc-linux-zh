    Motor1.start(0)\nMotor2 =GPIO.PWM(23,50)\nMotor2.start(0)\n```\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_28_0.png)\n\
    \n| PYTHON? |\n| :--- |\n| Prefix to detect elevate a line to a supervisor. It's\
    \ the level the GPIO pins from Don't forget it! |\n\n- 01 Mount the sensor\nUsing\
    \ the hexagonal rods, mount the sensors at 10cm with enough distance that, if\
