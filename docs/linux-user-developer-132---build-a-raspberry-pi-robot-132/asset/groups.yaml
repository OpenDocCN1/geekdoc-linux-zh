  - '[PAGE 5]


    # OpenSource


    6 News | 14 Opinion | 92 Letters


    ![](img/511bb591be9ee7dc0f73776baf9a0548_5_0.png)


    The CyanogenMod team is growing, and now has the benefit of working for a fully
    incorporated company


    # MOBILE


    # CyanogenMod incorporates


    # Looks to build a better Android for all


    CyanogenMod, once a part-time project of developer Steve Kondik designed better
    than any Android handset, is now a fullyfledged company aiming to produce a powerful,
    user-friendly Linux for all with one-click installation.


    Founded as an entry on the XDA Forums to announce a custom Android ROM for the
    T-Mobile G1, the popular third-party ROM for Android phones - many of which, users
    point out, have been abandoned by their creators, outdated,


    Retanding CyanogenMod as a fullyfledged OS, the team has been backed by a new
    round of funding in forming CyanogenMod Inc., with the aim of making CyanogenMod
    an easy, with-click install for Android-compatible devices.


    “Our goals today are straightforward; Organize, lead, and


    and support our community: creating amazing user experience centred around how
    YOU are committed to building the features users need - no junk; constant updates;
    on everything; the latest ROMs - already distinguished from the hordes of AOSP-based
    hacked-proprietary Android ROMs thanks to inclusion of custom features, which
    make the smartphones themselves themselves. The latest include multiple user account
    support, Privacy Guard - formerly called Inogenito - sandbox applications and
    prevent them from accessing Voice for improved integration with Google Voices.


    These are remain a focus for the new corporation, after a more important innovation:
    a simplified installer. “The biggest obstacle we wanted to get out of is the hideous


    installation process,” explained Kondik. “Our installer will be available on the
    Play Store in the


    “What does this mean for the community? The first thing I wanted to do when I
    realised we were actually doing this was tell everyone becoming a company, you
    have to think about the larger picture. This meant not announcing until the launch
    is right, how on one and we would have had something to show


    we have open source projects and can come, being bought out and closed, stagnating
    and in the way of innovation. This is what we have with CM. There is more course
    of our story to come, and we have begun the journey ahead.


    The company is currently looking to hire engineers and designers in the San Francisco
