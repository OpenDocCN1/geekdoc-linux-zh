    # 云存储服务分组测试


    ## Copy


    一个极具潜力的新秀


    Copy 之所以起这个名字是因为有一点内部梗——当然了，因为它会将你所有的文件复制到云端。然而，它在外观和操作上也模仿了其他云服务，让它们多了一份忙碌感。不过，没有理由忽视它，尽管
    Copy 已经迅速成为一项非常出色的云存储服务。


    首先，你可以获得 15GB 的免费存储，这是我们本专题评测的服务中提供最多的。它还有最廉价的方案：200GB 需每月 9.99 美元（每年 99.99 美元），或者500GB
    需每月 14.99 美元（每年 149.99 美元）。这是任何服务中提供的最优价格之一，尽管你可能并不需要使用你预期的全部空间。


    客户端软件以三种方式提供，尽管你可能只需要使用其中一种，或者在某些时候根本不需要。一种是图形化客户端，允许你登录并设置电脑，通过在设备和云端之间同步文件来复制你的账户，它不包含
    Ubuntu 或 SpiderCloud 的文件夹功能。另一种是 Copy 客户端；然而，它暴露了传输速率、某些文件名选项，并允许你将其设置为任务或系统，而无需正式安装。


    其他二进制文件包括命令行界面和 API 应用。它的好处是，一旦你完成了图形化设置（主要是因为它不会自动允许你登录），它对于需要云存储的无头服务器来说很好。


    这就是你通过 Copy 客户端能获得的全部内容。


    Copy 确实有一个很好的开端，以极具竞争的价格提供了合格的服务。然而，由于它是作为一种带有激励的新服务出现的，如果在云服务供应商饱和的格局中，你依赖于一个没有火起来的服务，它可能会迅速变成一把双刃剑。


