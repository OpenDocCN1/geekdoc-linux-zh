    \    GPIO.output(17, False)\n    Motor1.dutyCycle(speed)\n    Motor2.dutyCycle(speed)\n\
    ```\n\n### 04 How to change speed\nWith the addition of the (speed) parameter\
    \ we can put an input into the function that it returns the result - the speed\
