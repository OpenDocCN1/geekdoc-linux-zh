    modified: lin-3-files.py\ntutorial@glud> git reset HEAD\n(use 'git reset HEAD\
    \ \"first commit - a small example\"' to unstage)\n```\n\n## 03 Who are you?\n\
    \nInitial config consists of a few details - git config --global user your details\
    \ into - switch git config to .gitconfig so you can tailor individual repositories.\n\
    \n```\ntutorial@glud>\n```\n\n## 04 A tree, untitled\n\nThose repositories are\
