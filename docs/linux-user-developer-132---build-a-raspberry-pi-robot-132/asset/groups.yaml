    \ a robot football team\n\n## RasWIK Wireless Inventor Kit or the Raspberry Pi™\n\
    \n(img/511bb591be9ee7dc0f73776baf9a0548_34_3.png)\n(img/511bb591be9ee7dc0f73776baf9a0548_34_4.png)\n\
    (img/511bb591be9ee7dc0f73776baf9a0548_34_5.png)\n\n- Examples require no soldering\
