    # 您的观点


    # Linux 用户来信


    您对本杂志、Linux 和开源的意见


    对 Linux 有良好的了解，或者至少有学习的意愿。


    我喜欢 Gentoo 的地方在于，你可以设置操作系统运行的环境。你可以将其完全定制为运行在任何特定的 CPU 架构、模块等许多环境上；限制在于你对它工作原理的理解程度。


    关键点在于，制作蛋糕有许多方法，而 Gentoo 只是其中一种。如果你不喜欢它，没问题，尽管可以试一试 LUbuntu。但对我来说，Gentoo 提供了你想要的一切，关于为什么以及如何做——那些幕后细节。我喜欢完全按照我想要的方式看到，并知道为什么这些包需要那些以及它们是如何工作的，然后我需要的每项内容可以在编译期间简单地将其关闭等。天空才是极限。权力归于人民。知识就是力量。


    # Gentoo 之代


    Gentoo 和其他的 Linux 发行版没有区别。它们之间没有区别；你会看到像从 RH、CentOS、Debian 和 Ubuntu 那样可以获得的内核和包。Gentoo
    的显而易见的事实是，你可以完全按照喜好和环境对其进行定制。


    我说 Gentoo 和许多基于源码的发行版并不适合那些只想尝试 Linux 看看它是什么样子的的人，而是为了那些真正想要提升自己的计算体验的人，即使他们确实利用了它。有这个选项是非常好的，尤其是当你需要它的时候。


    Will Schrier


    确实，如果你知道如何正确使用它，Gentoo 可以变得非常强大。但并不是每个人都能做到，对于大多数用户来说，它可能既困惑又过头，而且 Sabayon 也是一个尝试
    Linux 而无需从零开始作斗争的绝佳替代方案。


    # 话题聚焦


    我们在上个月的杂志中回顾了 MinBoard，给它出了相当不错的分，但质疑它是否是所标记的树莓派竞争对手。当我们在线上发布它时，一些人告诉了我们关于该板的一些其他问题。在此处加入讨论：bit.ly/LUDMin


    # Carlos Lopez 说：


    - 如果你计划将其用于其他任何用途，请务必小心。这个板带有臭名昭著的 PowerVR Cedarev/Cedartrail GPU，这对 Linux 用户来说是一场噩梦。

    - AMD600 的开源驱动仅支持基础 2D，而且属性多到没法用。此外，这个专有驱动仅适用于 Ubuntu 10.04 和 Mee。


    # Adrian Placeau 说：


    - 英特尔是廉价电脑市场的新微软，而 x86 是对自由的束缚。


    # Charlie Wiman 说：


    - 我看到 AMD600 时在想。我以为它是一个 PowerVR GPU，但我可能搞错了。然后我确认了我没有搞错。现在我只是好奇，把一个 PowerVR GPU
    放入基于 Linux 的设备中是经历了什么样的过程。这对我来说太疯狂了。


    # Microlith 说：


    - 芯片没有集成到 CPU 中是一个老旧型号，GPU 是 SGX35。这是一个非常老旧的核心，曾用于许多基于 Cortex-A8 的 SoC 中。


    正因如此，我将忽略这一轮的 MinBoard，并将寻找带有英特尔显卡的基于 Bay Trail（或其继者）的板。


    一些结果对 MinBoard 的印象并不深刻


    # 您的观点

    来信

    GNOME, AV Linux, 教程文件


    Android 杂志

    随着越来越多的 Android 功能合并回 Linux 内核，扩展到为这一全球最流行的移动操作系统之一进行开发。全球范围内有超过 2500 万用户和 5 亿台
    Android 设备，有一个巨大的受众准备好消费应用。对于许多 Android 开发者来说，请关注我们的姐妹杂志《Android 杂志》，它补贴了桌面版。除了有让你保持更新的新闻和评论，还有关于破解设备的教程和建议。在
    www.littlegreen.org 了解更多信息。


    Mir 在 13.0 中取代了 Unity - 到目前为止，我们并不印象深刻


    # 桌面之道


    由于与 Wayland 非常不同，这意味着应用程序将不得不支持两种与界面通信的方式。从此，这有助于确保使用这些库的应用程序不太可能针对案例进行优化，因为它们不需要大量的代码就能直接访问桌面的每个关键操作。


    如果你有正确的后端配置，它在 ARM 和树莓派上运行是可能的。看到 SteamOS 究竟如何变化将是非常有趣的。


    高度定制的 SteamOS 可能是终极家庭解决方案，SteamOS 听起来不可思议，我基本上现在计划规划我的小盒子，将所有的 PC 游戏流式传输那里。但我担心的是，它特别是在非游戏环境中会有多开放？我不确定是否能在它和另一个之间进行双启动，如果视频应用应该取代它的话。希望正如
    Valve 所称的那样！


    我非常欣赏我多年一直很有兴趣地关注 Samba 的发展的各种转折，以及 Linux 上的每个人总能找到方法让它变得正确。这是一种决心！这些如今似乎开箱即用。许多核心用户可能会受益于
    Wayland 的发布而不是静默模式，代码可以帮助 Wayland 并避免这些问题。不需要推后 Linux 桌面的统一并整合软件产品的命名，如果他们不是在饱和状态下做的话……


    Mark Barrow 还记得几年前我们依靠非常糟糕的硬件通过局域网使用 Samba。软件在过去几年中变得如此简单真是令人惊叹。


    Daniel Hansson 不仅如此，在 Ubuntu 的下一个 LTS 版本中完全实现 Mir 似乎在暗示，到目前为止，进展并不顺利。与 Unity 不同，由于它是核心显示服务器，Canonical
    可能无法坚持立场并最终转向 Wayland。这确实是我们对操作系统的问题。


