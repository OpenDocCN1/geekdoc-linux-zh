    \n![](img/511bb591be9ee7dc0f73776baf9a0548_27_2.png)\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_27_3.png)\n\
    \n# 零件列表\n\n- 面板\n- 跳线\n- 2x N3904 晶体管\n- 2x 1K 电阻\n- 循线传感器\n\n# 测试传感器\n\n当循线传感器准备好且树莓派开启时，我们现在可以编写一个与电机代码非常相似的脚本，我们只是读取\
    \ GPIO 状态，检查它是高还是低。在屏幕上显示传感器数据允许我们了解传感器对黑色和白面的响应并相应规划代码。\n\n- 01 启动你的项目\n登录树莓派启动终端并创建\
    \ `lineflow.py`。这将是我们循线机器人的第一个脚本。\n\n- 02 读取传感器\n读取数据。由于每个传感器都不同，我们可能需要调整代码以适应输出。\n\
    \n- 03 打印到屏幕\n像之前一样保存文件。你需要打印语句来显示传感器是否检测到亮暗之间的差异。\n\n- 04 我们有了数据\n当正确运行时，脚本将告诉我们它可以看到黑色或白色。在它前面放一些纸来测试。\n\
    \n```python\nimport RPi.GPIO as GPIO\nfrom time import sleep\nGPIO.setup(GPIO.BCM)\n\
    Input = 2\nOutput = 3\n```\n\n```\nwhile True:\n    if GPIO.input(Input):\n  \
    \      print \"Sensor 1 is on White\"\n    else:\n        print \"Sensor 1 is\
    \ on Black\"\n    if GPIO.input(Output):\n        print \"Sensor 2 is on White\"\
    \n    else:\n        print \"Sensor 2 is on Black\"\n```\n\n```python\nsleep(1)\n\
    GPIO.cleanup\n```\n\n28 www.linuxux.co.uk\n\n# 现在进行循线\n\n构建自己的 Linux 驱动机器人\n\n\
    # 完成你的循线机器人\n\n它现在能看了。让它的新眼睛大显身手……\n\n# 03 碰撞完整代码列表\n\n现在我们应该已经习惯控制传感器，这样我们就可以关注运动了。大多数循线器使用与控制器相同的约定，对黑色表面的传感器发送高信号，发送低输出（或关闭）表示在白色上\n\
