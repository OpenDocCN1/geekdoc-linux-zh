    they don''t have direct access to the desktop every critical operations without
    a lot of code.


    if you''ve got the right back-end setup for it, it''ll be possible to ARM and
    the Raspberry Pi. It''ll be interesting to see exactly how SteamOS changes.


    A highly customised SteamOS could be the ultimate home solution SteamOS sounds
    incredible, I''m basically now planning to map up my little box to stream to all
