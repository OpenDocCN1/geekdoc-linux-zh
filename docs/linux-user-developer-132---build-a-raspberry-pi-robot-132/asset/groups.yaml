    \ highly accurate.\n\n# Raspberry Pi Robot\n\n## Use analogue sensors\n\nOpen\
    \ your robot to a new world of input.\n\nAs we've already using microcontrollers\
    \ and ultrasonic sensors, the Raspberry Pi is capable of taking inputs and performing\
    \ actions based on the outside. Inputs come in a variety of different types. Most\
    \ common are digital sensors as buttons and switches, but there are also analogue\
    \ sensors which can be read temperatures or brightness. These sensors give us\
    \ their data in the form of a voltage.\n\nThe Raspberry Pi is unable to read an\
    \ analogue signal so a little help is required which comes in the form of a microchip\
    \ MCP3008. This chip is commonly referred as an ADC (analogue-to-digital converter).\
    \ It can communicate with the Raspberry Pi via serial and is capable of reading\
    \ analogue inputs at once or in form of a number. 0 corresponds to the lowest,\
    \ 1023 is the maximum voltage.\n\nUsing an analogue, we can build a robot that\
    \ is capable of following (or avoiding) bright light – perfect if you have a plant\
    \ to follow the sun during the day.\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_31_0.png)\n\
    \n### 3.3V POWER\n\nMake sure the chip is hooked up to the 3V3 pin and not the\
    \ 5V pin on the Raspberry Pi, otherwise it will kill the processor.\n\n### Parts\
    \ list\n\n- 1x MCP3008\n- 2x Light-dependent resistors (LDRs)\n- 2x 10K resistors\n\
    - Jumper wires\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_31_1.png)\n\n## DATA\
    \ TABLES\n\nAn MCP3008 communicates via a serial protocol called SPI, Serial Peripheral\
    \ Interface. More than one can be used at the same time\n\n## THE SENSORS\n\n\
    The light-dependent resistors (LDRs) change their voltage based on the amount\
    \ of light they receive.\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_31_2.png)\n\
    \n### MCP3008\n\nThe heart of the analogue-to-digital conversion\n\n### Test and\
    \ again\n\nLike good scientists we check if it works\n\n### PULL-DOWN RESISTORS\n\
    \nTo a stable reading, we have to give it a basic reference point for the voltage,\
    \ so a pull-down resistor is required\n\nNow we have the ADC, we need to make\
    \ it work. So before we read the values and display them on the screen.\n\n```bash\n\
    sudo apt-get install python-dev\nsudo pip install spidev\nso reboot.\n```\n\n\
    ```python\nimport spidev\nspi = spidev.SpiDev()\nspi.open(0,0)\n```\n\nBefore\
    \ we can use the MCP3008, we need to enable the serial inputs and spidev, so let's\
    \ do\n\nOnce this is done, in our code is to tell the Python library where we\
    \ need. We need to create a new instance and tell it what MCP3008 chip is on,\
    \ and which bus number.\n\n```bash\nsudo nano /etc/modprobe.d/raspberrypi-blacklist.conf\n\
    ```\n\n```python\ndef get_value(channel):\n    if (channel > 7) or (channel <\
    \ 0):\n        return -1\n    r = spi.xfer2(1,((channel<<8)|2),8)\n    ret = (r[0]\
    \ & 3) + (r[1] >> 2)\n    return ret\n```\n\n```python\nwhile True:\n    print\
    \ \"Channel 0: \" + str(get_value(0))\n    print \"Channel 1: \" + str(get_value(1))\n\
    \    time.sleep(0.3)\n```\n"
