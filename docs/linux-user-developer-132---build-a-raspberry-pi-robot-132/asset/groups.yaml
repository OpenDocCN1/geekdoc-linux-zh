    smallest working so imaginable (2MB for the command-line version). Tiny Core is
    a bit like building everything from scratch. Instead of starting off with a base
    system, you build what you need. This saves you a lot of time, while still gives
    you a very quick selection of the packages you want - office, development, audiovisual
    etc. - so we don''t have to hunt down individual packages. This is about the only
    thing that really tints Tiny Core - the minimalist approach is fantastic, but
    going from day-one to a work takes time. You''ll need to add a few more things
    to make it truly fully functional.


