    $ mysql -u root -p -h mydomain.com\nCREATE DATABASE tiny_trss;\n```\n\n...将 my（主机名）\
    \ mydomain 替换为你的相关信息。\n\n## 03 MySQL 用户\n\n你需要另一个用户账户来访问数据库。大多数 GUI 工具会通过以下命令自动设置：\n\
    \n```bash\n$ mysql -u root -p -h mydomain.com\nGRANT ALL PRIVILEGES ON tiny_trss.*\
    \ TO 'username'@'localhost';\nFLUSH PRIVILEGES;\n```\n\n## 04 Tiny RSS\n\n从馈送阅读器下载最新稳定版的\
    \ Tiny RSS，确保提取完成数据库创建所需的特定文件，然后进行设置。\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_42_2.png)\n\
    \n## 05 数据库设置\n\n在存档中找到 mysql sql 文件\n\n## 06 配置\n\n将复制的文件重命名为 config.php，并在文本编辑器中打开它。使用相关信息编辑以下行：\n\
    \n![](img/511bb591be9ee7dc0f73776baf9a0548_42_3.png)\n\n## 07 设置 URL\n\n编辑 Tiny\
    \ RSS 用于连接服务器上数据库和服务的配置文件。更改其周围的值，确保创建一个副本以便你可以恢复或重新开始。你可以在配置的左上角找到它。\n\n```php\n\
    define('SELF_URL_PATH', 'http://example.org/tt-rss/');\n```\n\n将示例更改为你的域名，你可以保留\
    \ tt-rss 或选择任何打算安装 Tiny RSS 的名称。\n\n## 08 配置\n\n将复制的文件重命名为 config.php，并在文本编辑器中打开它。使用相关信息编辑以下行：\n\
    \nwww.linuxuser.com\n\n# 教程 创建你的 Google Reader\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_43_0.png)\n\
    \n## 10 下载\n\n保存文件后，回到终端并登录你的网络空间。使用以下命令创建 tiny-rss 文件夹：\n\n```bash\nmkdir tt-rss\n\
    ```\n\n进入目录，然后使用以下命令下载最新版本的 Tiny RSS rss：\n\n```bash\nwget https://github.com/gothfix/Tiny-RSS/archive/v1.9.tar.gz\n\
    ```\n\n## 11 解压\n\n将以下文件解压到你的目录：\n\n```bash\ntar -zvf 1.9.tar.gz\n```\n\n确保所有文件都已从文件夹解压，这样当你导航到\
    \ tt-rss 文件夹时，它是打开的。\n\n## 12 更新\n\n通过 FTP 或下载方法将你创建的配置文件移动到你的空间，或者按照我们之前的方法编辑配置文件。你也可以使用\
    \ FTP 程序将文件移动到空间，而无需在终端中进行任何操作。\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_43_1.png)\n\
    \n## 13 登录\n\n现在我们可以进入了。访问你指定的 URL 你将看到登录界面 - 现在使用 admin 和密码。登录后，前往 Actions/Preferences/Personal。Data/Authentication\
    \ 并更改密码。\n\n## 14 导入馈送\n\n如果你已经从 Google Reader 获取了数据，现在可以将其导入 Tiny RSS。进入 Acts\
