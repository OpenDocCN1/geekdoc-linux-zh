- md: "\n# Raspberry Pi Robot\n\n## Assemble the robot chassis\n\nNow we've got a\
    \ working motor circuit, let's start building our Raspberry Pi robot.\n\nOne thing\
    \ a robot can't live without is somewhere to mount all the parts, so for this\
    \ we need a chassis. There are many sizes, shapes and finishes available. We are\
    \ going to use one of the most versatile and common, called a Dagu Magician.\n\
    \nThis chassis kit comes complete with two plates, motors and two wheels, as well\
    \ as a battery box, which is perfect as a starting point for basic robots. Once\
    \ this is ready we can start expanding our robot with new motor functions, before\
    \ adding sensors.\n\n- SORT THROUGH THE PARTS: Lay all the parts out and familiarise\
    \ yourself with them. Assembly is for the most part straightforward, some care\
    \ is needed with the motor bracket.![](img/511bb591be9ee7dc0f73776baf9a0548_23_0.png)\n\
    \n- ASSEMBLE THE MOTOR BRACKET: Insert the bracket through the chassis and sandwich\
    \ a motor with the second bracket. Feed a bolt through the holes and add the nut\
    \ on the end.![](img/511bb591be9ee7dc0f73776baf9a0548_23_1.png)\n\n- PIECE THE\
    \ BITS TOGETHER: Feed the motor wires through the chassis and add the top plate\
    \ using the hexagonal spacers and screws, followed by the caster.![](img/511bb591be9ee7dc0f73776baf9a0548_23_2.png)\n\
    \n- WIRE EVERYTHING UP: Everything in place, using the motor circuit, connect\
    \ the Raspberry Pi and switch it on. Make sure it works by running the test script.\n\
    \n- ADD THE BREADBOARD: Most breadboards have an adhesive pad on the bottom so\
    \ you can peel stick down or Blu-tape for a less permanent fix. Mount this at\
    \ the first.\n\n- MOUNT YOUR PI: The Raspberry Pi rev 2 and some cases having\
    \ holes on the bottom, so utilize them for mounting, and fix the battery packs\
    \ into place.\n\n## Building tips\n\n### Take your time\nIt's better to stay ahead\
    \ and assume you already understand the build process without glancing at the\
    \ instructions. The pamphlet is there to help — use it!\n\n### Modifications are\
    \ welcome\nDon't limit yourself to the design. If you need to cut a new set of\
    \ holes for your sensors, measure twice and cut once, but don't feel limited to\
    \ the stock options.\n\n### Plenty of choice\nThere is a world of choice when\
    \ it comes to build platforms. Four wheels, tracks and hexapods are possible.\
    \ Our robot platform flavour of the month is friend — see p76-77 for our review.\n\
    \n## Create movement functions in Python\n\nOur simple motor test didn't work\
    \ for that - we need to be able to control and so let's add some movement functions\
    \ that we can call whenever we want.\n\nNow that we have a fantastic-looking robot\
    \ and everything wired in the right place (except the motor we may have to change),\
    \ we can plug in the Raspberry Pi and write our first script to control the motor.\
    \ Before checking if the motors worked easily we want to be able to control and\
    \ move it around properly and this we need to create our own functions.\n\n###\
    \ 01 Set the pins\nFirst we'll import the classes we need and set up the pins\
    \ as we did for the motor test.\n\n### 02 Enable PWM support\nTo control the speed\
    \ we will use pulse-width modulation (PWM). As the Enable pin supports this and\
    \ works for both directions:\n\n```python\nimport RPi.GPIO as GPIO\nfrom time\
    \ import sleep\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(24,GPIO.OUTPUT)\nGPIO.setup(23,GPIO.OUTPUT)\n\
    GPIO.setup(18,GPIO.OUTPUT)\nGPIO.setup(17,GPIO.OUTPUT)\nGPIO.setup(11,GPIO.OUTPUT)\n\
    ```\n\n### 03 Create movement functions\nPython allows us to simplify and reuse\
    \ code, making it much easier to read. We'll use this to save what we want, by\
    \ putting them into a function.\n\n```python\nMotor1 = GPIO.PWM(24, 50)\nMotor1.start(0)\n\
    Motor2 = GPIO.PWM(11, 50)\nMotor2.start(0)\n```\n\nIn Python this is done by grouping\
    \ repetitive actions into a definition. Using the def block we can pass parameters\
    \ such as speed easily and write code with ease. We will also add PWM to the pins\
    \ so we can set the speed that the motors should run at.\n\n```python\ndef forward(speed):\n\
