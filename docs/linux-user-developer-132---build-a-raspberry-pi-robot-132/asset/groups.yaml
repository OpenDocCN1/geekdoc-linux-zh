  mdcn: "\n\n# 树莓派 4 最佳发行版\n\n打造树莓派机器人大师：摄像头模块、直播启动 DVD\n\n# LinuxUser\n\nwww.linuxuser.co.uk\n\
    \n面向 GNU 世代的月刊\n\n# & 开发者杂志\n\n# 打造一台树莓派机器人\n\n> 我们史以来最大的指南\n\n任何人都可以制作的耗资 150\
    \ 英元的 Linux 驱动机器人\n\n# 使用 DansGuardian 保护你的网络\n\n如何过滤不需要的内容\n\n# 云存储超级实测\n\n 揭秘终极\
    \ Linux 解决方案\n\n# Ubuntu 13.10\n\nSaucy Salamanca 能重新点燃我们对 Ubuntu 的爱意吗？\n\n# 使用\
    \ Python 爬取维基百科\n\n在我们的编程特辑中领略 Beautiful Soup 的魅力\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_0_0.png)\n\
    \n+ 别内精彩还有：\n- 控制树莓派摄像头\n- 使用 Graphviz 可视化数据\n- Linux 中进程的生命周期\n\n- 精通 Git\n通过简单步骤掌握核心版本控制技能\n\
    \n- ZTE 开放手机\n首款 Firefox OS 智能手机测试\n\n# 树莓派\nB 型 - 512MB 带有\n8GB NOOBS SD 卡\n\n\
    > 含增值税\n£32.99\n代码 SC1313058\n£27.49 不含税\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_1_0.png)\n\
    \n# 现已上市！\n\n树莓派\n三脚摄像头架\n\n£7.99 £6.66 不含税\n代码 SC1321758\n\n5MP\n树莓派\n摄像头\n\n\
    树莓派摄像头\nRev. 1.3\n\n£19.24 £16.03 不含税\n代码 SC1302358\n\n访问 cpc.co.uk 获取更多信息\n\n\
    - 全系列项目配件\n- 套件与外壳\n- 扩展、转接板和原型板\n- 丰富的组件范围\n- WiFi 适配器与 HDMI 转 VGA 适配器\n- 视频和音频线\n\
    - 键盘、鼠标和显示器\n- GPIO 排线\n- 编程和用户指南\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_1_1.png)\n\
    ![](img/511bb591be9ee7dc0f73776baf9a0548_1_2.png)\n\n# 欢迎\n\n# 徕 Linux User &\
    \ Developer 第 132 期\n\nMihalis Tsoukalakis 拥有超过15 年的 UNIX 系统管理和编程经验，自1993年起就开始使用\
    \ Linux。他还精通网络管理、Cisco 设备。在本期中，Mihalis 使用 Graph 处理大型数据结构（48-5）。\n\n# 本期内容\n- 保护你的网络\n\
    - Ubuntu 13.10 评\n- 打造树莓派机器人\n- 使用 Git 精通控制\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_2_0.png)\n\
    \nSean Tracy 是一家数字教学机构的创意技术人员。他在 Node.js、Python 和 Django 方面经验丰富。Sean 向我们展示了如何使用\
    \ Python 的流行库 Beautiful 来提升 Python 技能。你可以在第5页找到他的教程。\n\n欢迎阅读 Linux User & Developer\
    \ 最新版，这是英国最喜爱的开源和 Linux 杂志。\n\n拥有一个由树莓派帮助并在在你身边的小机器人一直是一个童真的幻想，而本期 Linux 杂志中包含了来自英国领先电子供应商的几页\
    \ 18 纹路图（从第18页开始）。我终于实现了这个梦想。\n\nMichael Reed 是一位技术作家，他关注 Linux 已超过二十多年。在其他方面，Michael\
    \ 探索了 Linux 桌面解决方案，并向你展示如何使用 SpamAssassin 保护邮件，以便过滤不需要的邮件。他的指南从第38页开始。\n\nJonny\
    \ Pi正如 Twitter 把我们联系在一起的那样，就是他，我们已经在制定新计划来赋予他发言权。除了帮助我进一步控制机器人 Rob 实现远程操作，我们还在开发一个\
    \ Web 应用，以便从任何连接网页的设备控制他。\n\nJon Masters 是一位 Linux 黑客，从 17 岁上大学起就开始从事 Linux 工作，已有18多年。他住在马萨诸塞州剑桥，为一家企业\
    \ Linux 供应商工作。你可以在第16-17页看到他不可或缺的专栏。\n\n在本期中，你可以找到比雄心勃勃的 Pi 项目丰富的内容。学习使用 Python\
    \ 脚本，构建你自己的 Gadget Reader，并使用 Linux Torvalds 的替代 Git 版本升级你的内核。这些教程和更多内容从第38页开始。享受杂志吧！\n\
    \nGareth Harecliff 是一位记者兼编辑，为我们带来了生态系统的最新消息，从第6页开始。本期涵盖了首款使用 Firefox OS 的手机 Openphone。我们的评测从第24页开始，但先不要抱太大期望……\n\
    \nRussell Burns，编辑\n\nRobert Zweblist 是一位航空工程师，目前在课程中用 Python 进行复杂模拟建模。在他的特约编辑的帮助下，Rob\
    \ 告诉我们如何使用云存储来保护数字资产的安全。他还展示了如何使用树莓派摄像头模块拍摄快照。\n\n# 与团队联系：linuxuser@image-publishing.co.uk\n\
    \n+ Facebook: Linux User & Developer\nTwitter: @linuxuserimagesh.co.uk\n"
