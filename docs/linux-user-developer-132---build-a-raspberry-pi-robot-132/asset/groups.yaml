    \ to commit, working directory clean\ntutorial@glud$ git branch -a-file.format\n\
    ```\n\n## 13 Committed\n\nGit will prompt you if you have something before changing\
    \ branch. You can use git checkout to deliberately move the uncommitted changes\
    \ you have made. Commits are so keeping them in your own branch\n\n## 14 Releaseable\n\
    \nYou can have many strategies for your team. One simple approach is to keep the\
    \ master branch releaseable and commit your incremental changes there until you're\
    \ ready to merge for a new release.\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_53_3.png)\n\
    \n## 15 Track what's changed\n\nSometimes keeping track of what you've just done\
    \ defeats the little brain. What change seems to have broken something?\n\n# Master\
    \ version control with Git\n\nUnderstand how Git version control system works\n\
    \n## TUTORIAL\n\n```\ngit merge le.fileundo-making-file-perfect\n# The merge was\
    \ perfect-perfect\nmerge failed; fix conflicts and not commit the result\n```\n\
    \n```\ngit log: git pull master\n# The pull was perfect-perfect\n# error: you\
    \ have unstaged changes\n# fix: fix them before merge\n# appropriate merge resolution\
    \ and make a commit,\n# master of an unresolved conflict.\n```\n\n```\ngit log:\
    \ git pull master\n# The pull was perfect-perfect\n# error: you have unstaged\
    \ changes\n# fix: fix them before merge\n# appropriate merge resolution and make\
    \ a commit,\n# master of an unresolved conflict.\n```\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_54_0.png)\n\
    \n## git diff\n\nis friend, showing what has been changed but not yet staged with\
    \ git add. git status shows each local modified or removed.\n\n## git diff --cached\n\
    \nwill look at the changes that have been staged but not committed. Other diff\
    \ commands to use Git change the commit previous to the last commit.\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_54_1.png)\n\
    \nsame place. you can also merge your branch to keep your tree up with changes.\n\
    \n## Pushing code\n\ngit push is used to push changes to the remote repository.\
    \ Using pushdefault in your config (or as arguments) to set the command, you can\
    \ use git push to refuse if the upstream branch's name is different from the local.\n\
    \n![](img/511bb591be9ee7dc0f73776baf9a0548_54_2.png)\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_54_3.png)\n\
    \n## Ignorance is bliss\n\nNow, before you use .gitignore file to keep your project\
    \ and password data out of the public repository, with auto-saves from your text\
    \ editor, notes and anything unnecessary for the project but directory.\n\n##\
    \ Time-saving aliases\n\nAliases you can use for git commit.\n\n- ga for git add\
    \ --all\n- gs for git status\n\nsave useful shortcuts for frequent users. You\
    \ might want to add your own aliases to your.bashrc, or download one of the common\
    \ collections on github.\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_54_4.png)\n\
    \n```\ngit log: git pull master\n# The pull was perfect-perfect\n- FETCH\n- Updated-detach\n\
    # On branch master\n# ahead of 'origin/master' by 1 commit\n# (use 'git push'\
    \ to)\n```\n\n## Branch log\n\nKeeping track of commits for your current branch\
    \ is a sample of merging git log for branch. This will show the commit of objects\
    \ initialization. The first few of the SHA-1 hash in log is a good reference on\
    \ the branch you are working on, if you want to check if a colleague is using\
    \ the same.\n\n## Push me pull\n\ngit pull is used to fetch the latest commit\
    \ and merge it into your local repository, your local to combine with other people's\
    \ work. You should pull frequently, or just after changes are up to you.\n\n##\
    \ Fetch\n\ngit fetch gets just the latest commits without merging. It creates\
    \ a local copy for you to work from, so you can examine with git-diff and make\
    \ changes before merge to handle any conflicts you may face.\n\n## Conflicting\
    \ code\n\nGit makes merging branches easy, but will also tell you where there\
    \ is a conflict if a merge takes place - usually where both branches have made\
