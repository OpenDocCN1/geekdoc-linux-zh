    \n说话是一种方法，但闪烁 LED 或移动肢体也是可能的。例如，电致光（EL）闪烁是机器人指示其状态的其他方式。越有创意越好：机器人技术既可以是一项艺术追求，也可以是一项技术成就。\n\
