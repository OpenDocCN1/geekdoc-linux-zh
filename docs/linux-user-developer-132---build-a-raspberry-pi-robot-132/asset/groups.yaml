    # 开源


    您的 Linux 新闻与观点来源


    www.linuxuser.co.uk 直接发送邮件...

    获取最新新闻和观点请邮件至：linuxuser@imagine-publishing.com


    ![](img/511bb591be9ee7dc0f73776baf9a0548_9_0.png)


    ■ SteamOS 对游戏具有巨大意义，是 Linux 迈出的巨大一步


    # 娱乐


    # SteamOS 时代已经到来


    Valve 的 SteamOS 和硬件自 Steam 推出以来是否引发了 Linux 游戏领域的革命？


    在过去的一年里，或者自从 Steam 在 Linux 发布以来，一直关于 Valve 正在创建一个 SteamBox 的传言和猜测——某种运行 Steam
    并作为在线服务控制机的硬件。随着越来越多的证据表明 Valve 正在尝试 Linux，基于 Steam 的硬件似乎


    因此，当一个为期一周的 SteamOS 项目让 Linux 发行版能够在大模式（Big Picture mode）下运行 Steam 并显示在客厅中时，这确实令人惊喜。Valve
    希望让 SteamOS 免费，并提供一些硬件可以轻松使用和迭代的软件。


    ![](img/511bb591be9ee7dc0f73776baf9a0548_9_1.png)


    # 控制 Steam


    客厅 PC 游戏的一个问题是为那些需要控制器和键盘的游戏找到解决方案。Valve 计划开发具有若干独特功能的自己的 Steam 控制器。游戏常用的操作方式被两个触摸触控板取代了；Valve
    声称这些触控板具有不可思议的震动马达，可以提供触觉反馈。控制器有许多按钮——不需要触控板——有四个肩键、两个触发键和两个侧键（侧键本身也是按钮）。中心的触控可以自定义按钮，这允许那些没有控制器支持的
    Steam 游戏（甚至是它自己的游戏）将控制器视为键盘和鼠标，


    > 为在客厅里与 PC 游戏进行交互找到解决方案是 Valve 的关键


    接续 Steam 的发布。然而，Valve 计划允许人们通过本地网络从 Steam 将游戏流传输到整个设备库。这可能也允许使用更小的设备，让你将游戏流传输到电视上。在未来，可能还会为
    SteamOS 开发移动端应用。


    关于 SteamOS 仍有一些未解决的问题，我们计划在未来几个月进行实验并回答相关问题。请确保关注下一期《Linux User & Developer》，我们将那里揭开它剩余的所有秘密。关于
    SteamOS 本身知之较少——但它将在年底前以原型的形式提供给 Steam 用户。这将抢先于其他公司在 2014 年运行 Linux 发行版的 Steam
    Machines 数量。当然，并不是所有游戏都能原生运行，而且这一点不会随着 Steam 的发布而改变


    # 服务器宕机、响应时间缓慢、沟通不畅……如果这不是悲剧，那将是笑话。这里有三个充分的理由，说明为什么切换到 24/7 高可用（High Availability）将为您提供一直想要的专用托管服务：![](img/511bb591be9ee7dc0f73776baf9a0548_10_0.png)


    如果您需要与我们联系，只需拨打电话，24/7 全天候。当然有工单系统，但交流总是好的。真正的高可用意味着如果您的专用服务器发生故障（虽然不太可能但确实），另一台服务器会立即接管。我们希望客户放心，但不要听我们的一面，请看看我们的客户在
    HA247.CO.UK 上的评价。他们彻底改变了托管行业。这关乎客户服务对细节的关注。这关乎平易近人且从不忙于拒绝帮助。简而言之，他们以正确的方式经营业务。我会毫不犹豫推荐他们。您可能再也不需要提交工单了！DAN
    GRANT，NOT BUT ALSO.NET 总经理。通过拨打 0190450272 向 HA24/7 解决方案迈出第一步，或访问我们的网站 HA247.CO.UK![](img/511bb591be9ee7dc0f73776baf9a0548_10_4.png)


    # 数据库观点


    ## 你不能违背核心指令


    飞机会飞，船只会浮，数据库会丢失数据。在原始层面上，任何其他结果都是错误的……在我们努力实现最小可行性产品（MVP）时把自己封闭起来。开源需要遵循一种更及时的利益，即随着我们向目标迈进，增量开发交付新的且实用的功能。这种起点旅程的回顾，或者干脆没有目标并保持不断的微调。无论我们做什么，必须始终满足要求。保持船体不漏。


    PostgreSQL 的出现是因为我们从未忘记 PostgreSQL 用户的数据是最重要的考虑因素。对细节的关注从未丢失。自从项目引入点点恢复（PITR）多年来，这一点一直如此。因此，当您的服务器熔毁或您丢失数据到故障发生的精确时间点时，PIT
    也不能失败。十年后，PostgreSQL 项目稳步演进，引入了复制、备用、流式、级联、快速恢复、分区、索引，并且开发者更有可能需要这些功能，因为核心指令从未被忘记、忽略或忽视。


    长期影响是显而易喻的。开发者喜爱软件中的新功能。决策者更加谨慎，并看到了开源软件中的潜在风险——如果我们忽视核心指令，这些风险就会变成现实。开源正通过变得更好、更安全、更具防御性而超越其他商业替代方案。低成本，但一艘有漏水的船才至关重要。当我在公共部门采购中因意外的言论被发现时，开源的优势变得非常清晰。一位高层人物认为，投入如此时间和精力的回报并非明智的投资，并且似乎通过提供解释来证明指令已满足且我们超过了质量标准是不可能的，因此我们并没有因为无缝开发而廉价。


    十年前，银行里没有人给 PostgreSQL 第二次机会。我要求他们在那里工作，但支付系统中的关键金融交易、授权、网络时间现实以及各种前台系统是不可能的，因为没有做出某些半风险的选择。


    协作开发是开源的优势，只要它尊重所产软件的核心价值。坚持下去，并吸引更多加入的人，扩大兴趣的力量和改变的速度。因此，让我们以正确的方式让开源成功——而不是低成本低质量的选项。


    > Simon Riggs 是 2Quad 的技术官。作为一名十年的 PostgreSQL 老兵，他所在的团队已经构建了许多目前全球使用的功能 www.2quad.com


    > 正 Simon 先生在中间提到，“你不能违背核心指令”，无论开源指令是什么，它都是“必须”。


    '
