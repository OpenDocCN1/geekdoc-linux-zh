    Select enter 启动选定的项或 e 进入命令行\n```\n\n随身携带你的发行版到任何地方，这样在有电脑的地方就可以使用\n\n在两个发行版之间创建共享空间，以便数据可以轻松共享\n\
    \n### 资源\n\n一个具有至少 75GB 空间的 USB 供电外部硬盘\n\n在这里我们展示了如何在外部硬盘上分区、安装和运行两个发行版。我们在示例使用了\
