    ![](img/511bb591be9ee7dc0f73776baf9a0548_37_1.png)


    # Protect your network


    Build a gateway server that can filter content and block access to websites from
    certain PCs


    # Advisor


    Michael Reed is a technology journalist and he''s been hacking away at Linux for
    years


    This is a project to create a gateway PC that allows you to filter Internet traffic.
    We are using CentOS as the base of our system and the web filter DansGuardian
    will carry out the filtering for us.


    Filtering the internet has never been more popular, and DansGuardian puts power
    into the hands of the administrator. Basic filtering software blocks individual
    pages, but DansGuardian is adaptive and handles the content of pages on the fly.
    Even better,


    DansGuardian carries out a sophisticated analysis of the content that weighted
    triggers. This means that a single instance of a banned word will not block the
    page that the user is accessing. DansGuardian provides internet connection and
    the rest of the network is capable of assigning connection details to client PCs
    via DHCP. This helps us configure them to use our proxy setup.


    # Resources


    Server machine


    Two Ethernet adapters


    Firefox browser


    38.linuxuxer.co.uk'
  - '[PAGE 38]


    # # Protect your network


    Build a gateway service to intelligently filter web content


    # TUTORIAL


    ![](img/511bb591be9ee7dc0f73776baf9a0548_38_0.png)


    ![](img/511bb591be9ee7dc0f73776baf9a0548_38_1.png)


    killermige@guardian:-


    ```

    File Edit View Search Terminal Tabs Help

    killermige@guardian/home/killermige

    [killermige@guardian~]$

    ```


    # 01 Set up server


    Our example network layout around a single server PC with two network adapters
    connects to the internet (router or modem) and to the rest of the network. A Wi-Fi
    connection is acceptable if it will meet the bandwidth requirements of your network.


    # 04 Become root


    For most of this tutorial, you will need to run as root. In CentOS you can become
    root using su and then请输入 the root path. For the bits that do not need root access,
    you can continue with your normal user access.


    ![](img/511bb591be9ee7dc0f73776baf9a0548_38_2.png)


    # 02 Install CentOS


    Download the CentOS DVD image from www.centos.org. This installation is fairly
    straightforward to include the networking package. Give the computer a meaningful
    hostname, such as guardian, and then configure Network settings


    # 07 Start DansGuardian and Squid


    Throughout this tutorial, you''ll use the service to control all services. We
    then start with Squid and check the output of commands for errors.


    ![](img/511bb591be9ee7dc0f73776baf9a0548_38_3.png)


    # Configure Proxy to Access the Internet


    The proxy


    +   - Auto-detect proxy for this network

    - Use system proxy settings

    - Manual proxy configuration


    | Property | Value |

    | HTTP Proxy | 127.0.0.1:8080 |

    | SSL Proxy | | |

    | ETP Proxy | | |

    | SOCKS4 | SOCKS:3050 |


    Use this proxy server for all traffic


    IP for proxy:

    127.0.0.1


    ![](img/511bb591be9ee7dc0f73776baf9a0548_38_4.png)


    # 03 Set up the adapters


    Click on network adapter, then Edit... to change the settings for each one in.
    Select the first adapter and Connect Method Auto. Select the second adapter and
    Connect Method Static. For the first adapter, set the IP address of 10.2.0.10,
    subnet mask 255.255.255.0, and gateway 10.2.0.1. Set the second adapter IP address
    of 10.3.0.10. Accept the changes, then wait for Desktop installation profile to
    complete. Reboot when prompted and then log in.


    # 05 Install the repository


    For CentOS (or RHEL) go to http://tinyurl.com/repo and follow the instructions
    to download the rpforge-release package. Install GPG key and install the repository.
    Run yum install -i <name of package>. Run yum update to update the system.


    ![](img/511bb591be9ee7dc0f73776baf9a0548_38_5.png)


    # 08 Test the proxy


    DansGuardian and Squid are probably working well with the default settings. This''s
    time to test it, go to DansGuardian in Firefox and go to Edit>Preferences>Advanced>Network.
    Set the settings, selecting ''Manual proxy configuration''. In the HTTP Proxy
    box, insert 127.0.0.1 with a port of 8080.


    # 06 Install DansGuardian and Squid


