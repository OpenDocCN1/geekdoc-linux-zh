    Author: Richard Doe <richard@example.com>\nDate:   Mon Oct 23 14:00:00 2023 -0700\n\
    \nInitial commit\n```\n\n## 11 HEAD\n\nThe latest commit object is HEAD - and\
    \ it refers to the commit that points to the current branch. By default we have\
    \ a master branch to work on, but we can create new branches from any commit object\
    \ to work on an earlier version of the project's file format.\n\n> Git manages\
    \ projects in the form of files - not just code\n\n![](img/511bb591be9ee7dc0f73776baf9a0548_53_1.png)\n\
    \n```\ntutorial@glud$ nano ./lisp-perfect.cl\ntutorial@glud$ git add --all\ntutorial@glud$\
