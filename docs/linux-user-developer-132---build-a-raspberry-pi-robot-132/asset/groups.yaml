    ## OPEN SOURCE


    ### Red Hat and dotCloud team up


    Red Hat has announced it is working with dotCloud to improve and promote Docker,
    the latter Linux container format. Designed to extend the Linux components of
    the kernel, Docker aims to provide an easy way to build containers and run them
    independently - all taking to some underlying Linux kernel, solving compatibility
    issues that can plague virtualised systems. Docker is also claimed to make it
    easy to migrate systems from one cloud platform to another, helping users to spread
    applications and move to a more capable platform.


    While Docker is platform-agnostic, Red Hat has built a team of engineers to integrate
    with OpenShift platform-as-a-service (PaaS) technology to help users deploy and
    scale applications.


    > "The collaboration between dotCloud and Red Hat is an exciting development for
