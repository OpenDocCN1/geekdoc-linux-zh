  md: "# # Host your own media gallery\nShare media without worrying about privacy\n\
    \nFastCGI is a protocol to interface interactive programs with a web server -\
    \ it is an improvement over CGI (common gateway interface), easy to implement\
    \ but problems in scaling separate processes were created for each request - huge\
    \ overhead for the host. FastCGI works using processes to serve web requests;\
    \ however, processes are managed by FastCGI (proxy in case) and not the web server\
    \ itself and FastCGI, allowing effective scaling. Now any server that supports\
    \ FastCGI can be used for MediaGabin.\n\n```\nserver {\n    ######################################\n\
    \    # useful config options, but keep them simple\n    ######################################\n\
    \    location ~ \\.php$ {\n        include fastcgi_params;\n        fastcgi_pass\
    \ /application/octet-stream;\n        sendfile on;\n    }\n    location / {\n\
    \        index index.html index.htm;\n        try_files $uri $uri/ /index.php?$query_string;\n\
    \    }\n    # This is where you should add\n    # custom rules\n    # Change this\
    \ to update the upload size limit for your users\n    location / {\n        #\
    \ allows uploading a .txt file that the browser\n        # sends as an attachment\n\
    \        if ($request_filename ~**\\.txt$\") {\n            return 204;\n    \
    \    }\n    }\n    # Plugin static files (usually linked in)\n    location = /plugins/\
    \ {\n        expires max1;\n        access_log off;\n    }\n    # Theme static\
    \ files (usually linked in)\n    location = /themes/ {\n        expires max1;\n\
    \        access_log off;\n    }\n}\n```\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_36_0.png)\n\
