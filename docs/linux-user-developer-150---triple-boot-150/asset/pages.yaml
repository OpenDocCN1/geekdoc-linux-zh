    # KERNEL


    # US Navy picks Linux for Shipboard Computing Environment


    Linux base for everything


    The US Navy has released its latest project, the DDG-1000 Zumwalt Destroyer and
    a Total Shipboard Computing Environment (TSCE) which is wholly on Linux.

    While the US Navy previously used control stations on its ships in 2001 it announced
    that it would gradually transitioning over to Linux as it overcomes hardware obsolescence
    with the Solaris-based control stations and provides lower-cost software updates.


    One of the first to benefit from this change has been confirmed by the DDG-1000
    Zumwalt Destroyer, of which the Navy is using the TSCE. Recent announcements made
    by the Navy have concentrated on this ship, including the use of an innovative
    ''tumblehull'' design and one that of a ship has half itself, new releases showcase
    the benefits of Linux as part of its multi-level Mission Control.

    Featuring millions lines of code, the Navy''s TSCE has been built to its specifications
    by

    defence contractor Raytheon and runs from 16 IBM blades distributed around the
    ship. An internal network connects the Linux-based workstations and stations being
    able to be reconfigured-on-the fly with fancy touchscreens and standardUI interfaces
    for peripherals. This flexibility is the opposite of what was experienced by the
    Royal Navy in the early 2000s, when contractor BAE Systems standardised all its
    future development in the proprietary Windows 2000 platform from Microsoft.


