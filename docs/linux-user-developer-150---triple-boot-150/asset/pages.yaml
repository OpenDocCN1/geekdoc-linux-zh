  md: '# # Tutorial


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_53_0.png)


    **Above We''re using** Adafruit''s excellent GPS Breakout kit here: http://bit.ly/3GBk2gw


    #  03 Install navigation software


    Begin to install the Navigat gpsd software by entering:


    ```

    sudo apt-get install navit gpsd gpsd-clients speak

    sudo nano /etc/gpsd/gpsd

    set START_DAEMON="true"

    ```


    ...and set:


    ```

    DEVICES=/dev/ttyAMA0

    ```


    Start the gpsd daemon with:


    ```

    sudo /etc/init.d/gpsd start

    ```


    Reboot. Once rebooted, you can check it''s working by looking at the gpsd data:


    # 01 Basic configuration


    Boot up your Raspberry Pi and go to Advanced Options and disable the Serial connection
    - you will need to talk to the GPS module later. In raspberry-config, enable bt
    on the pi. Say Yes you are up to date with:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    > **Liam Fraser** is the creator of RaspberryPiTutorials YouTube series and Linux
    server administrator for the Raspberry Pi Foundation. He studies Computer Science
    at the University of York.


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_53_1.png)


    # 04 Connect the sensor


    The RaspberryScreen does not come with any YouTube video with instructions. Here
    are some details about how to put it together: bit.ly/3Bf66J. The important part
    is that the DC power should supply it:


    # 05 Set the pixel resolution


    We will have to fix the correct resolution (1024x600) for the screen using edit
    /boot/config.txt. To do so, add the following:


    ```

    framebuffer_width=1024

    framebuffer_height=600

    dmi_format=rgbplug-1

    dmi_lcd_x=1024 600 3 0 00

    dmi_group=2

    dmi_mode=87

    ```


    For the changes to take effect you will need to reboot with sudo.


    # 02 Connect GPS module


    Solder the pins onto the Adafruit GPS module. You can also use a header connector
    which is used to make the device easily activatable. You only need to use 4 pins:
    3.3v, ground, transmit and receive. We reboot the Pi again before connecting.


    As we are using GPS, the antenna will have to go outside or near a window to get
    signal. Connect the antenna to the back and power everything back on. The lock
    on the GPS module will flash frequently while finding a fix. Once it has, it will
    blink every 15 seconds.


    # 06 Download kernel source


    To start the connection, you need to compile an extra kernel to support it. Program
    raspberry source (github.com/raspberrypi/pi-source/wiki) will find the source
    of your kernel. Install source with:


    ```

    sudo wget https://raw.githubusercontent.com/raspberry/pi-source/master/pi-source
    -O /usr/bin/pi-source && cd /usr/bin/pi-source && git checkout -tag-update

    ```


    Then run pi-source to get the source of the running kernel.


    54 linuxuser.co.uk'
