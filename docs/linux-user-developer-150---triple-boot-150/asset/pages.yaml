    # What is the Raspberry Pi 2?


    Still confused over what the new version of the Raspberry Pi means to you? Missed
    our review last issue? We''re here to help you in


    Rob Zweetsloot

    models complex systems and is a web-developer proficient in Python, Django and
    PHP. He also loves to experiment with computing


    If you like this...

    Check out our unboxing video where we go through the changes on the Pi 2 and point
    out the bits. Rob Zweetsloot goes through it too.


    There is another Raspberry Pi 2 then? Is it another update, a brand new or something
    entirely different? I''m getting a bit confused.


    This time it''s the Raspberry Pi 2 B – a brand new Raspberry Pi.


    in the Pi Model B2 and B+. Anyway, this chip has been updated with the RAM increased,
    which is what makes it the Pi 2.


    that we did, it means that we don''t experience slow-down on tasks like updating
    software or browsing the web for tutorial info, for example.


    Basically a brand new Raspberry Pi 2?

    Well the only thing that makes it a Raspberry Pi, is that it uses the same original
    Pi system, the BCM2835 chip is the core of on-chip that has the ARM66 processor
    and the Video graphics chip. This was what out on the complete module from a while
    back, along with the 512 MB of RAM present


    What is the new chip about then?

    The BCM2835 is a slightly modified version of the 2683 – the main difference is
    that it has an ARM7 quad-core, 900 MHz and 512 KB of RAM instead of 1 GB and results
    in a much higher power boost to the Raspberry Pi.


    How much more powerful?

    The Raspberry Pi foundation estimates that it''s about six times more powerful
    than the original Pi. From the tests


    I''ve seen a picture of it and it looks no different from the Model B+?

    The main and the only real difference is that the RAM is now on the underside
    of the top. The redesign was eventually actually made to accommodate the Pi 2
    hardware, leaving a sort-of-stop gap design that manufacturers were able to get
    cases out into the world before the 2 was actually released.


    Further reading

    Check out the last issue of the Raspberry Pi magazine by the Raspberry Pi Foundation
    for details like:


