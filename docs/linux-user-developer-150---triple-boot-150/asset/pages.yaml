  md: '# Snappy Ubuntu Core offered as involvement from IoT solution


    # Hoping for the Raspberry Pi community


    Canonical founder Mark Shuttleworth is pushing his company heavily as the go-to
    operating system for Internet of Things (IoT) projects, via the new Ubuntu Core.
    Ubuntu Core targets everything from robots that might clone drones at play, to
    smaller homes that use more energy efficiently or more insecure security settings.


    "Inspired by the inventors and innovators who are making leaps in technology,
    we want to prove that open source can unleash innovation, most of this stuff is
    high-stakes and insecure kind of Linux. Every device has custom ''firmware'' that
    lumps together the OS and drivers and device-specific software, and that fragments
    company release."


    Shuttleworth suggests to resolve this issue for IoT to standardise on Ubuntu.
    The Snappy and Ubuntu Core are perfect for distributed


    Snappy and the Ubuntu Core vary from traditional packaging


    solutions by offering atomic upgrades and the ability to roll back at any point.
    They''re positioned by Canonical as the solution to systems that require predictability
    and dependability and the company is convincing of those benefits, benefiting
    even the hobbyist.


    The recent launch of the Raspberry Pi 2, which brings an upgrade to the ARMv7-based
    chip processor, came with the release of Ubuntu Core. This is proved by images
    for a hardware-specific Ubuntu built on boards, and Odcl-CI. These, Shuttleworth
    has promised, will be kept updated to particular features before any hardware
    changes. This release of Ubuntu Core we''ve


    added hardware abstraction layer where platform-specific kernels live. We''re
    working commercially with the major silicon providers to guarantee free updates
    to every device built on chips and boards.


    Whether an inventor or a developer of apps that might run on devices, then Ubuntu
    Core is for you," Shuttleworth said. "With an app store (well, a ''snappy'' store)
    built in and easy access to code for libraries, collaborating on GitHub and other
    forums, for code for robotics and autopilots and instantly accessible, I can''t
    wait to see what people build."


    "For one welcome the ability to install AI on my next camera-tracking drone, and
    I am glad to do it in a way that will get patched automatically with fixes for
    Heartbeats"


    # Snappy is better than dependencies


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_7_0.png)


    Above Founder Mark Shuttleworth Canonical''s Ubuntu Core will centralise IoT


    Right You can get Ubuntu Core for the Pi from raspberrypi.org/downloads


