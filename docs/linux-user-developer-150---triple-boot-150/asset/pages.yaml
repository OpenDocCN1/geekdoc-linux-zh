    # MINI PC


    # OpenPi


    The base for Raspberry Pi-powered hardware utilises the compute module


    The OpenPi on first looks like a device - a nondcript black box with an HDMI and
    a USB slot. There''s no real indication of what it might be, however opening it
    reveals a custom board connected to a Raspberry Pi compute module, inside stands
    standards allow you to connect a mini-wireless/keyboard/mouse combo. It seems
    simple to be fair in this - it''s just basically - a (fully-powered) Raspberry
    Pi.


    Actually the point of it this. With the compute module and the OpenPi, you have
    full access to the usual Raspberry Pi power and settings. The selling point of
    the OpenPi is that you can control - which is completely open hardware - and modify
    the plans yourself to make a custom board that fits your needs. It''s an easier
    way to create an Internet of Things and they''ve succeeded in creating the platform
    to do this.


    As we''ve hinted, using it as a normal Raspberry Pi works; it''s fully functional
    and you can easily access it via SSH to the included Wi-Fi adapter and


    installed software. This makes it great off the bat as a Wi-Fi router or file
    server. It comes with standard Raspberry installed that can be easily updated
    and upgraded as you go keep up with the latest and greatest software. While there
    are limited ways to hack it the open hardware aspect mean the entire PCBs are
    for modification and when you make custom cases for it as well. It''s also more
    expensive than the Pi itself and aimed at a different user base. Is it for makers?
    To a degree, the PCBs don''t offer much extra to begin with. It''s excellent inspiration
    and a good start for makers, but it''s more towards the business and start-market
    for creating systems in offices that can benefit from an Internet of Things.


