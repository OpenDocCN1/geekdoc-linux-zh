  md: '# # Raspberry PinCar Computer


    Make your own touchscreen navigation system that gives directions, local weather
    reports and plays music


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_52_0.png)


    > > Cars are getting closer. Days, with new cars, smart interfaces built into
    a few others like you don''t need to go out and buy yourself. But if you''ve got
    a Raspberry Pi, it might help you even need to buy - let alone a new car!


    In this project we will show you how to build your own car computer with your
    Pi, a touchscreen like the 9-inch model from Sainmart that we are using here,
    and a few other bits like a GPS module and USB 3G modem. We will use open source
    software Carbb to navigate to your route map on screen, few speech synthesis to
    read out directions, and it will also be to check your location and give weather
    reports. It will work as a music player too.


    It''s an ambitious project, but you will gain a solid understanding of custom-made
    interfaces, navigation software, touchscreen calibration, speech synthesis and
    more. When you don''t have to use the same Sainmart screen as we use, we do not
    recommend it for this project as it is one of the few large touchscreens out there
    with the few improvements at the end too, so check the components list, make sure
    you''ve got everything and let''s get started!


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_52_1.png)


    53 www.linuxuser.co.uk'
