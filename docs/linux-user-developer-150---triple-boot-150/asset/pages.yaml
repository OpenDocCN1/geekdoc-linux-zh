    # Music players


    What''s the best software for playing and maintaining your music collection, as
    well as discovering new tunes online?


    # Nightingale


    Forked from the Songbird project that was discontinued in 2013, Nightingale is
    based on the XULRunner framework and GStreamer libraries, offering a customised
    layout with extensions for online services. Development is progressing well and
    a version 2.0 is in the works.


    Download: bit.ly/1I127qv9


    # Tomahawk


    Heavily influenced by Tunes and OS X in design, Tomahawk is a crisp, modern-looking
    music player with a core focusing on online streaming, scrolling and browsing.
    It provides users with a single access point for the multitude of online services
    and communities.


    Download: bit.ly/1EGYqhd


    # CMus


    A console music player that takes over After-style software, CMus (C* Music Player)
    is lightweight and fast. As well as being able to take advantage of commands,
    however the user and the program is fully scriptable, so it can be hooked into
