    # 10 The RAID


    You can create different types of RAID arrays - by default it will do RAID, but
    it also supports RAID 1, RAID 10 (1+0), RAID 5 and RAID 6. Choosing which RAID
    comes down to personal preference and how much effort you put into maintaining
    your


    # 11 RAID 1


    RAID 1, where data is duplicated across drives for redundancy, can be created
    on btrfs using a modified version of the command used to create btrees of devices.
    The -dev option refers to how the data is used:


    ```

    mkbtrfs -m /dev/sda /dev/sdb/

    ```


    # 12 Have non-redundant metadata


    If you''re creating a hardware RAID, having the metadata redundant may be useful.
    The metadata gets created per device. This requires the -m option and can be used
    with ''single'' or RAID 0 with:


    ```

    mkbtrfs -m raid0 /dev/sda /dev/sdb /

    ```


    # 13 RAID 10


    Basic mirroring with RAID 10 is good for large data repositories and redundancies.
    You can use options -m and -d to specify that we want metadata and to be properly
    redundant with:


    ```

    mkbtrfs -m raid10 -d raid0 /dev/sda /dev/sdb /dev/sdc/

    ```


    # 14 Look at the different options


    The option -d allows you to set many fancy options. You can create a btrfs RAID
    0 (Just a Bunch of Drives) by doing -d /single/dev/sdb/dev/sdc. You can also have
    metadata that is non-redundant while data is redundant with -m raid0 -d raid0
    /dev/sda /dev/sdb /dev/sdc /dev/sdd. There are many ways to do it as you see fit.


