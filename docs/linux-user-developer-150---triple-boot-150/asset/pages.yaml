    # OPEN SOURCE


    # MediaFire releases Linux toolkit


    Built out of VP’s “personal need”


    Cloud storage specialist MediaFire has announced the release of its first toolkit
    for Linux users available under the GNU Public Licence v2.

    Describing the release as “huge fans”, MediaFire’s vice president of engineering
    Brian Christ says the first time that the company offers a tool for Linux.

    Launched under the name mediafire-fuse, the project includes a FUSE module for
    mounting of cloud storage and an interface designed to resemble FTP for file upload,
    download and management tasks.


    As an Linux user and open source developer, the tools first took a few years ago
    when a personal need arose to access my account without a browser,” Christ explained.
    “After sitting for quite some time, it seemed a matter of good stewardship to
    bring new life into it. I found it personally rewarding when we could connect
    back to it.

    The mediafire-fuse is available to download now from GitHub page, which includes
    configuration and deab mounting instructions for: github.com/MediaFire/mediafire-fuse.


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_10_0.png)


    # SECURITY


    # Glibc hit by ‘Ghost’ vulnerability


    2013 vulnerability not marked as critical


    A security vulnerability in the GNU C library glibc, stretching back 14 years,
    has been discovered with numerous systems proving robust despite being reported
    for the flaw in 2013.

    Named ‘Ghost’, the vulnerability was discovered by security firm Qualys and revealed
    an overflow issue in glibc’s gethostname functionality. The exploit showed that
    glibc could be exploited using a specially-formed email to gain shell access to
    a remote server on affected network.

    All releases since 2000, this was discovered and patched in March 2013 but was
    not marked as critical. As a result, many distros – in particular, long-term support
    distros – had not migrated to the fixed version. In 2014, it failed to bring general
    attention until Qualys released its report in 2015. While the majority of supported
    distros patched it some remained vulnerable.

    Ghost joins similar long-standing issues recently discovered in widely-distributed
    packages, including GnuTLS and Bash, indicating that open source projects could
    benefit from improvement rather than reliance on the many eyes’ concept and that
    their hope is looking for issues.


