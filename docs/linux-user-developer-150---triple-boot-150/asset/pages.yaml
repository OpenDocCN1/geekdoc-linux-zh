    Below: The 60-pin Luxe header anticipates the success of Intel''s add-on boards


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_0.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_1.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_2.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_3.png)


    > The biggest change is a shift from a 32-bit processor to a 64-bit chip


    # Pros


    An improvement on the original MinnowBoard, there''s plenty to recommend the Max
    variant for x86 development


    # Cons


    Its price is high compared to rival ARM-based boards, while the Luxe concept has
    yet to gain traction with third-party manufacturers


    of which its predecessor could have only dreamed; theoretically, any operating
    system that can boot on a general-purpose x86 PC can boot on the MinnowBoard Max
    with ease and effort. Intel has made much of its effort to support for Windows
    8.1, or more interest to its target market support for Linux distributions from
    Debian and Red Hat all the way to Atom-class stability.


    As a development board, it''s no to find that the MinnowBoard Max has a number
    of features lacking from general-purpose PCs like Intel''s Next Unit Architecture
    features, which offer significantly higher specifications at a lower price.


    The new processor, Intel''s Atom E3850-system on chip (Soc), has improved performance,
    boosted clock speed to 1.39GHz and improved thermal efficiency, providing an inexpensive
    cost variant of the MinnowBoard featuring a single-1.49GHz Atom E3815 and 2GB
    of RAM, is planned to launch in the near future but was not available at the time
    of writing.


    The biggest feature, however, is the MinnowBoard''s Luxe header. Properly known
    as the High-Speed Extension Connector and located on the underside of the board,
    it provides 26 GPIO headers that make it easy to add pulse width modulation (PWM)
    control of eight user-accessible pins for control of servos, motors.


    A quick benchmark compared the new Atom processor to its predecessor; running
    a core test on the SysBench application showed a 95th percentile comparison difference
    of 3.22ms – far faster than the 11.9ms of the first MinnowBoard – and the Max
    boasts a second core to help it further away from the original.


    along with mS, PCIe, I2C, and more. Adoption of the standard has been slow, but
    add-on Lures are beginning to appear with respect to Arduino compatibility for
    future expansion.


    +   - Gareth Harelach


    Summary

    The MinnowBoard Max is an undeniable improvement on the original MinnowBoard,
    with its design in both software compatibility and price offers flexibility, but
    for those who don''t need open hardware architecture it is beaten in value by
    Intel''s open-purpose PC (NUC) machines, while its ARM-based rivals rival it with
    the MinnowBoard''s initial launch price.


