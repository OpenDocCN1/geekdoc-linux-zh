    # Playback


    # Playback


    Playback itself is limited to the controls at the top of the interface, with no
    keyboard shortcuts beyond the Spaceway play/pause. There are no options in the
    settings. The contextual menu has some nice tricks that can help you finding similar
    tracks, queuing songs and to friends.


    # Interface


    Nightingale has a panel-based layout by default, which is customizable with different
    skins - ''features'' and a traditional three-view (customizable with gear, artist
    or album) and hidden panel that can expand to the edges. All edges are well-aligned,
