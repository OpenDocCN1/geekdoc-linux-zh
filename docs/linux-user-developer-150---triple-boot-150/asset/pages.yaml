    # FCC change


    Hi there, I''m a bit confused by the neutrality of stories and hoping you can
    explain what''s going on. I''ve heard that the chairman of the FCC changed his
    mind and is now in favour of supporting not necessarily with Title II – but what
    is that?


    Neil Yealland


    Hi Niall. That''s right – Tom Wheelereler, Chairman of the FCC (Federal Communications
    Commission), recently wrote an editorial for Wired where he declared that he has
    new proposals to the board on how to preserve the Internet as an platform for
    innovation and free expression”. And the best of it is he wants to implement Title
    II and then wants to enforce open internet protections.


    Basically, Title II is the second section of the Communications Act of 1934 and
    it deals with common carriers, which are people or companies that transport or
    govern information service providers. Yet, the FCC''s Telecommunications Act of
    1996 was used to regulate telecommunications in the United States. The updated
    version of Title II was adopted with intent to “ban binding peering, and protect
    lawful services” (the de-internet ‘lanes’, for example). By the time you read
    this, the FCC should have voted on the proposal at its open meeting on February
    26th.


    # NO Gnome love


    What can you tell me about GNOME 3?

    I''ve just started Linux and I''ve been here for about two months now. I want
    to learn more about this. I get the problem...


    Max Aldridge


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_93_0.png)


    The thing with GNOME 3 is quite complicated. We''ll try and get all the heck out
    of it properly. The major drawback of it is that it lacks such a radical change.
    As you''ll know from research, GNOME 3 isn''t the desktop metaphor that you see
    with something like a launcher flying off to the left, programs group together
    in ‘Activities’ at the top bar and all kinds of widgets look like that. Compared
    to GNOME 2, which was essentially a much better but when you''re using GNOME 3
    for years you now know why it is a bit of a surprise.


    The thing is that people started to give feedback to the developers and then they
    all believe that these developers aren''t interested in listening with a typical
    recommendation of being to use a shell extension to work around a feature that
    the user didn''t like. Generally speaking, it fed into the growing unpopularity
    of GNOME 3. That helps!


    # Android Magazine


    With more Android features being built on Linux, it''s becoming much easier to
