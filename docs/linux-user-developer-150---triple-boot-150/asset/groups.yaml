    # Secure your Raspberry Pi


    Below If you tend to access your Pi remotely via Wi-Fi, consider keeping it locked
    away


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_66_0.png)


    # 12 Lock it in a drawer


    Probably the best way to keep your Raspberry Pi secure is to make sure you keep
    it in a drawer or cabinet particularly useful if you use the device as part of
    a security system or as a cloud server storing valuable documents. If no firewall
    is available or if by taking some time away from home where it isn''t practical
    to take the Pi with you, another solution is needed. This may be to travel with
    your Pi''s SD card in your wallet, perhaps leaving the computer attached to a
    wardrobe with Velcro.


    # ## A firewall is guaranteed to improve your security


    # 13 Add a firewall


    Regardless of what system you''re using, adding a firewall is guaranteed to improve
    your computer''s security. While the Raspberry Pi has a built-in released firewall,
    it is tricky to configure.


    However, some other people have noticed this and need an interface to manage iptables
    firewalls with Raspberry.


    # 14 Install in Raspberry Pi


    Because it is a bit fiddly and errors can leave your network connection, fwbuilder
    has developed to make firewall configuration quick and painless. We''ll use the
    apt-get command to start and install fwbuilder


    ```

    sudo apt update

    sudo apt install fwbuilder

    ```


    Follow the prompts to install and, once, switch to the Pi-driven desktop, launch
    fwbuilder from the internet menu. Upon launching, fwbuilder, follow the given
    instructions to set up your Raspberry Pi firewall and save the result.


    We''re nearly done but some adjustments are required before your Pi fully connects
    to the network.


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_66_1.png)


    # 15 Complete firewall configuration


    Launch the network-interface scripts in your text editor and complete configuration
    by adding:


    ```

    pre-up /home/pi/fwbuilder/fwbuilder.fw

    route add default dev [YOUR_INTERFACE_HERE] eth[YOUR_NUMBER]

    ```


    Next, find the section "Edip" and add the same line but change the last characters
    to wan0:


    ```

    route add default dev [YOUR_INTERFACE_HERE] wan0

    ```


    # 16 Consider Raspberry Pi theft


    While your Raspberry Pi or the data on it initially seems like a disaster, it
    is not. As long as you have backup on a USB stick or on your SD card, you have
    at least connection when you resume the project. You can also check for methods
    to protect your best work here:


    # Pocket your Pi


    If you''re still concerned with your Pi''s safety, place it in a place of potential
    theft. What if you lose it in your pocket? The Raspberry Pi is small enough to
    leave unnoticed, leaving unanswered questions relating to your Pi can be addressed
    by keeping it close when necessary.


    www.linuxuser.com'
