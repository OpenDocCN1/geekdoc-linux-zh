    ## 安装


    ### Windows 在先，主系统在后


    先安装 Windows 实际上会让安装过程变得顺畅得多。如果你已经决定在一台现有的或新的 Windows 电脑上安装系统，先安装 Windows 的主要好处是，你不需要在安装过程结束时担心恢复
    GRUB，而且在 Windows 自身的安装期间不需要管理 Linux 发行版。GRUB 的优势也适用于最后安装你的主发行版，因为你可以在以后轻松地对它进行更新。


    在第一个分区中，我们有了我们的主默认发行版——这可能是你的工作或娱乐发行版。我们建议为 Linux 发行版分配约 20 GB 的分区。


    与第一个分区相同——为你的其他版本的 Linux 分配 20 GB 分区。如果你在进行三系统启动，可以非常容易地使用这三个之一。


    这个分区较大，因为我们将在这里安装 Windows。在这里，Windows 在安装期间可以看到它。最好给 Windows 分配 100 GB 的空间。


    | 分区 | 文件系统 | 大小 | 已用 |

    |---|---|---|---|

    | /dev/sda1 | ntfs | Microsoft 分区 | 120 GB |

    | /dev/sda2 | ext4 | 19.5 GB | 486.0 MB |

    | /dev/sda3 | ext4 | 19.5 GB | 486.0 MB |

    | /dev/sda4 | ext4 | 97.6 GB | |

    | /dev/sda5 | ext4 | 324 GB | 74.6 GB |

    | /dev/sda6 | swap | 4.0 GB | 0.0 B |


    ### Linux 在先，Windows 在后


    按照这种顺序执行安装有优势，因为它让你更容易知道自己正在安装在哪里。如果你正在设置 Linux 发行版，可以直接使用 GParted 将磁盘格式化为你的喜好。如果你在
    live 盘中，且创建 live 版的资源有限，或者你需要编辑分区，为什么不直接安装它呢？


    我们将为所有操作系统创建一个共享存储分区。这由所有剩余空间组成，并且最好将其放在你想要的任何地方。


    这是 Linux 中与内存 RAM 一起使用的分区。与位于其他安装分区上的文件系统类似。


    如果你计划从头开始设置硬盘并安装操作系统，最好使用 GParted 以便在过程中进行易于维护的操作。


    我们列出了为了让三系统启动成为有用配置所需的条件，但这只是其中之一。Linux 发行版的 20 GB 大小仅考虑了以许多方式进行安装的情况——这是一种非常灵活的用法，这取决于你的开发习惯以及你计划使用的软件类型。顺序也是随机的——它不会对磁盘产生任何影响，但可能对你个人是有意义的。


    虽然我们建议使用共享存储分区，但 Linux 中主目录的文件系统非常不同，这可能会轻易地让事情变得复杂。不过，Windows 和 Linux 在层次结构上都有自己的部分，这使得组织变得更简单、更快速。你可以考虑的另一个选项是在两个之间拆分存储分区。


    ## 安装 Linux


    通过正确的发行版，在另一个发行版旁边安装 Linux 是非常简单的。


    如今对于许多发行版来说，安装 Linux 已经减少到最少的交互。Ubuntu、Fedora、openSUSE——你所有主要的现代发行版都在它们之间共享分区或为该发行版创建分区。通常情况下，点击安装并覆盖磁盘即可，如果硬盘分区的设置不符合你想要的那样。


    在这些发行版中，你可以执行两件事之一：并排安装或替换你的根目录（root）。根系统是磁盘的一部分，所有运行的文件都存储在那里，并由一个分区表示。从头开始将创建新的文件或文件夹，你完全也可以让你的自定义分区这样做。


    另一方面，那些为其他系统设计的系统安装过程可能会复杂得多。它要求你了解你拥有哪些分区，并且可能有它们自己的分区软件，因此手动性稍强，在这种情况下，你将需要一个
    live 发行版来预先获取分区。在此过程中你要记录。


    > 上述在分区期间始终务必读取磁盘——很容易完全擦除磁盘


    关于驱动器的名称，对于单个分区，它将是 sda、sdb、sdb3 等。不过，这些名称永远不会按照你预期的顺序出现。


    所有发行版都会自动使用系统上的任何交换分区（swap）。如果你一次使用一个发行版，你的系统只需要其中一个，而且在安装时也不需要将其设置为正确的交换分区。


    更多关于安装的建议将帮助你阅读选项，如果一切都失败了，请在该发行版的网站上查找原始文档。


    ## 发行版类型


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_17_0.png)


