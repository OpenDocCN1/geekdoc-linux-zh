    lsof 使用 DNS 显示主机名而不是其 IP 地址。你可以通过其功能将其关闭：


    ## 关于 lsof 输出的更多信息

    lsof 的输出显示各种列。`COMMAND` 列包含进程相关的命令。`PID` 列显示进程 ID。`USER` 列显示用户名。`FD` 列显示文件描述符。`TYPE`
    列显示文件、目录或字字的类型。`SIZE` 列包含大小。`DEVICE` 列包含用逗号分隔的设备号。`NODE` 列显示挂载点名称或 `FILE` 列显示文件名或以字节计算的文件偏移。


