- md: "\n# Tutorial\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_61_0.png)\n\n### What\
    \ you'll need\n- Bare Conductive paint\n- Male to female jumper wires\n- An assortment\
    \ of LEDs, switches and resistors (optional)\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_61_1.png)\n\
    \n# Draw circuits with Bare Conductive paint\n\nAssembling circuits has never\
    \ been so easy with the joys of conductive paint, enabling you to bring art and\
    \ electronics in a whole new way.\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_61_2.png)\n\
    \n**Aaron Shaw**\nAaron is the co-founder of The MagPi (themagpi.com) and has\
    \ been working with Raspberry Pi since childhood. He feels lucky enough to use\
    \ Pi at work and for play!\n\nPlaying with electronics and physics computing is\
    \ a rewarding task - it's capable of causing huge smiles on the faces of people\
    \ of all ages. For a beginner, the mess of wires and components can become quite\
    \ confusing and things like soldering can be a barrier. This has taken the joys\
    \ of electronics and made it far safer, easier and more versatile with your conductive\
    \ paint. You can do it with a conductive adhesive and, much more. There are no\
    \ great deal of boundaries to what you can do - if you cannot do it with normal\
    \ paint and normal electronics, then you can do it with Bare conductive paint\
    \ (even multi-layer circuits are possible).\n\n## 01 Get your tools\nPaint and\
    \ a paintbrush aren't the first items that come to mind when you think about electronics,\
    \ so you might be wondering where to get them from. Bare Conductive stock the\
    \ paint and a selection of components in their shop (bareconductive.com/). We\
    \ would recommend using a high street shop such as Hobbycraft (hobbycraft.co.uk)\
    \ or a local independent.\n\n## 02 Pick your platform\nThe great thing is that\
    \ Bare Conductive paint is, when dry, works just like normal wiring! That means\
    \ you can use it with any favourite microcontrollers like the Bare Conductive\
    \ Touch, a Raspberry Pi or Arduino's wearable FLORA platform. Or you can just\
    \ use some small pin buttons for flashing LEDs for a standalone setup.\n\nPlaying\
    \ with a microcontroller board and you will be creating interactive art, clothing\
    \ and projects in no time.\n\n# Draw circuits with Bare Conductive paint\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_62_0.png)\n\
    \n## 03 Start to paint\nYou can paint Bare Conductive paint onto pretty much any\
    \ surface — paper, fabric, walls, clothing, wood, plastic and much more. The best\
    \ idea is to create or use a stencil (paper stencils are easiest to make at home\
    \ but use vinyl for the best edge finish).\n\n## 04 Connect it up\nThere are plenty\
    \ of ways to connect to the conductive paint (from batteries or microcontrollers\
    \ for example) no matter what surface it's on, because it acts just like any wire.\
    \ Therefore you can use wire glued with the paint, paper clips, boblog clips,\
    \ alligator clips or even sewn-in conductive snaps for various projects.\n\nTouch\
    \ Board\n\n## 05 Make repairs\nThe conductive paint is thick when it's become\
    \ quite dry. These means you can use it to cold solder things together and repair\
    \ any breaks. In other words, you could glue wires into a circuit board or glue\
    \ wires and they would still function electronically. You can even use it to repair\
    \ damaged tracks on circuits.\n\n## 06 Clean up\nA lot of you are probably thinking\
    \ that something as cool as conductive paint is going to be nasty stuff. Actually\
    \ Bare Conductive paint is non-toxic, water-based and water-soluble, and can be\
    \ cleaned easily with soap and water.\n\nAbove Cut custom templates to suit your\
    \ project's style and requirements\n\n## 07 Make it waterproof\nThis only comes\
    \ in black and is not waterproof. However, the great thing is that you can use\
    \ it underneath alongside regular paints, varnishes and waterproofing sprays in\
    \ order to act as insulation — or just to add some colour to your design.\n\n\
    ![](img/2f9ef091d4813dbe86196f72ccfd0107_62_1.png)\n\n## 08 Touch and sound\n\
    Bare conductive paint can also be used as a capacitive surface, meaning you can\
    \ use it for touch, gesture or proximity when it is paired with a suitable control\
    \ board. Bare Conductive is used with the Touch Board which has everything you\
    \ need to start experimenting with touch and sound. It can even act as a MIDI\
    \ controller, an interface or instrument!\n\nBare Conductive's Touch Board is\
    \ an Arduino device compatible with any existing projects and code you might have.\
    \ It works with any conductive material such as the Conductive paint so you can\
    \ wire it to a ruler. Using Conductive Paint, you can create things for example\
    \ drawing boards and even an electric drum kit that reacts and passes over your\
    \ custom shapes.\n\n63 www.linuxuser.com\n\n# Secure your Raspberry Pi\n\nConcerned\
    \ about the security of data stored on your Raspberry Pi? Protect yourself with\
    \ passwords, firewalls and some physical security.\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_63_0.png)\n\
    \nChristian Cavendish is a former IT and software engineering engineer who has\
    \ written since 2010 for computer and security publications both online and in\
    \ magazines.\n\nThere is a distinct security risk around your Raspberry Pi. Storing\
    \ anything from firewalls means that important data can be stolen or pocketed\
    \ with minimal effort from someone.\n\nTherefore it's a relief to learn that several\
    \ tools, tricks and methods can keep your device and data away from prying eyes,\
    \ like for running a home security cam with images uploaded to a cloud account.\
    \ These images would be visible to anyone who possesses your Raspberry Pi login\
    \ details if you haven't bothered to change the defaults. Such a project (and\
    \ many others) also demands that a firewall is installed for improved security\
    \ on your network.\n\nWhether you're simply changing passwords, keeping your Pi\
    \ under lock or installing a firewall, you'll be surprised how easy easy it is\
    \ to secure your Raspberry Pi and protect all of your important information and\
    \ files.\n\n# What you will need\n\n- Velcro\n- Adhesive putty\n- Lockable cupboard,\
    \ strongbox, etc.\n\n64 www.linuxuser.co.uk\n\n# Secure your Raspberry Pi\n\n\
    ```\nssh pi@192.168.1.45\n$ ssh pi@192.168.1.45\nOpenSSH_8.2p1 Ubuntu-3ubuntu0.5-10:24\
    \ UTC 2020\n```\n\nThe programs included with the Debian GNU/Raspbian system are\
    \ free software. For more details, see the manual files in /usr/share/doc/raspberrypi.\
    \ Naturally, all of these files are copyrighted under the GNU General License\
    \ as you received them.\n\nTo set your own password, run the following command:\n\
    \n```\n$ sudo password\n```\n\n## 01 Stop the default password\n\nEveryone who\
    \ uses Raspberry Pi knows that the default credentials are 'pi', meaning anyone\
    \ can log into your computer if you haven't changed them—something you should\
    \ do in a matter of urgency. After signing in, open the terminal and set a new\
    \ password:\n\n```\n$ password\n```\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_64_0.png)\n\
    \n## 04 With a desktop computer and SD card reader,\n\nIf you've forgotten your\
    \ Raspberry Pi password or suspect that something has changed, there is a way\
    \ that you can recover your password. \n\n```\nraspberrypi# sudo usermod -a -G\
    \ atckers pi\nraspberrypi# sudo passwd atckers\nRetype new password:\nRetype new\
    \ password:\npassword updated\n```\n\n## 04 Give the new account a password\n\n\
    With the new account setup, the next step is to set a password. You won't be signed\
    \ into the account unless you use the `passwd` command. Instead:\n\n```\n$ sudo\
    \ passwd username\n```\n\nWith the new account ready, you should be able to remove\
    \ the old account from raspberry.\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_64_1.png)\n\
    \n## 02 Change password\n\nIf you're setting up a new installation of Raspberry\
    \ Pi, changing the password is the first thing you should do. With a new, the\
    \ first boot will automatically run the raspberry-config.\n\nHere is how to choose\
    \ the second option, and the user\n\nIf you believe someone has access, take the\
    \ most secure option and create a new user account. In the command line,\n\n```\n\
    $ sudo useradd -m \"username\"\n```\n\n## 05 Delete the account\n\nIf you no longer\
    \ need the user, sign out and log into your new account, and confirm it is correctly\
    \ set up by:\n\n```\n$ sudo deluser\n```\n\n```\nusername=ALL(ALL) NOPASSWD:\n\
    ```\n\n```\n$ sudo deluser -home username\n```\n\n## 03 Create a new user\n\n\
    - -m creates a new home directory, while the sudo adds the new account to the\
    \ superuser group.\n\n## 06 Recover the password\n\nIf you're concerned about\
    \ your Raspberry Pi's physical security, you recommend adding some measures to\
    \ make it less of\n\nYour best option is probably a physical device configured\
    \ to detect presence. With a buzzer, this can detect the presence of someone and\
    \ alert you. It's better to have such an alert when you're likely to be off It\
    \ makes for a great side project.\n\nwww.linuxuser.com\n"
