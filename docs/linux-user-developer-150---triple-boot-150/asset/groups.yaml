  - '[PAGE 22]


    # # Triple boot


    Maximise your productivity using three distros


    # # Styling # GRUB


    If you need to get really fancy, you can always theme GRUB


    GRUB isn''t, by default, the prettiest thing in the world, so you''re going to
    be running to walk through the boot setup for a time you might want to learn some
    English.


    There are some great guides out there to walk you through the entire process,
    including boot options to squash image, the colours of each element as you like.
    Explained in a little more detail just to the right, one great site to check out
    for this is dedidemo.com.


    # # Resources


    If you need to know more about booting, GRUB and the different distros, try these
    resources


    # ## DistroWatch distrowatch.com


    Like the idea of booting your system but can''t quite figure out exactly what
    to use? DistroWatch completes one of the most complete list of Linux distributions
    on the Internet. It keeps tabs on the updates and releases, archives of live media,
    and update news for each of the listed distros. Everyone has its own categories
    and a little explanation so you can figure out if the distro is what you''re looking
    for.


    There is a ranking table of distros that seem to be popular on the site, which
    may help you discover new and excellent operating systems, and an upcoming release
    schedule so you can plan what distro to get ready to install in.


    # ## UNeboot unnetboot.source.org


    Why have DVDs burn images to days? Well... do we have a left thumb that we might
    need in the future? You know, but can we still create a bootable USB stick for
    live media? Especially when not computer has a drive to anymore.


    UNeboot is the perfect choice of software to do this and works across all platforms.
    It writes ISOs to a USB stick and handles preset if you have it drive. It can
    also create a bit of re-usable storage to Ubuntu-based distributions.


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_22_0.png)


    Above Adding customs to GRUB2 is much simpler than you''d think


    # ## Dedidemo GRUB 2 tutorials bit.ly/yoXSk


    Featured in the past issue of 117 of this magazine, a full GRUB 2 reference can
    be found at dedidemo.com. It includes much more discussion of how GRUB works,
    how the config file is built and the differences and more. There is also a lot
    more info on creating custom scripts for different layouts, a few recovery tips
    and how to customise the look of the boot menu It is kept up to date with the
    latest GRUB 2 changes, so if you have a problem in the future and need help, it
    should remain an excellent resource to go to.


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_22_1.png)


    Above You can also customise the menu options with fonts and colours


