    ## CentOS 发布

    常规滚动构建（rolling builds）


    目标是每月发布媒体版本


    CentOS 项目已宣布其发行版的滚动构建可用，旨在为需要的用户提供滚动更新过程。CentOS Linux 构建版本是时间点快照媒体（point-time
    snapshot media），从原始发布版本重新构建，包含了 centos.org 仓库中的最新更新。项目负责人解释道，此类媒体将预先包含所有这些更新，与安装了旧版媒体并通过
    yum-updated 更新到同一时间点的机器相比，看起来并无异。


    构建在每月月底完成，比发布时间晚几天以便进行测试。Singh 还表示，在发现并修复关键漏洞（如 Shellshock 漏洞利用）后，还将进行多次构建。


    CentOS 的 Karin Wade 将这些构建版本与其他典型的每夜构建区分开来，这归功于他们额外的测试。他在发布公告中补充道，取得的进展将出现在许多镜像中，例如
    CentOS Linux 7，以及可能来自项目特别兴趣小组（SIGs）的未来版本。


