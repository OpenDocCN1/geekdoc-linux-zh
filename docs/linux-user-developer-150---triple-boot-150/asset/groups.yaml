    # MinnowBoard Max


    以下：60针 Luxe 接口预示了英特尔扩展板的成功


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_0.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_1.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_2.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_3.png)


    > 最大的变化是从 32 位处理器转到 64 位芯片


    ## 优点


    作为原始 MinnowBoard 的改进版，有充分的理由将 Max 版本用于 x86 开发。


    ## 缺点


    与竞争的 ARM 架构板相比，它的价格较高，而且 Luxe 理念尚未获得第三方制造商的认可，而其前代产品只能梦以求；理论上，任何可以在通用 x86 PC 上启动的操作系统都可以轻松在
    MinnowBoard Max 上启动。英特尔投入了大量精力支持 Windows 8，并对其目标市场支持 Debian 和 Red Hat Linux 发行版产生了更多兴趣。作为一种开发板，发现
    MinnowBoard Max 具有许多通用 PC 缺乏的功能，例如英特尔的 Next Unit 功能，以更低的价格提供了更高的规格。新的处理器英特尔 Atom
    E3850 系统级芯片 (SoC) 提升了性能，时钟频率到 1.3GHz 并改进了热效率。一个采用单核 Atom 和 2GB 内存的廉价版本计划在近期推出，但在写作期间尚未上市。然而，最大的特性是
    MinnowBoard 的 Luxe 接口。正式名称为高速扩展连接器，位于主板底部，提供了 26 个 GPIO 接口，可以易于对八个用户可用的引脚进行脉宽调制
    (PWM) 控制，用于控制伺服电机和电机。将新的 Atom 处理器与其前代产品进行快速基准测试；在 SysBench 上运行双核测试显示百分比差异为 95%
    —— 比原始产品快得多 —— 而且 Max 还拥有第二个内核来帮助它进一步区别于原始产品，并带有 PCIe、I2C 等接口。该标准的采用尚为缓慢，但已开始出现针对
    Arduino 兼容性的扩展设备，以备未来扩展。


    MinnowBoard Max 是对原始产品不可否认的改进，其软件兼容性和价格提供了灵活性，但对于那些不需要开源硬件的人来说，在价值上它输给了英特尔的通用
    PC (NUC) 机器，而其基于 ARM 的竞争对手则以 MinnowBoard 的初始价格与其抗衡。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_4.png)


    83 | www.linux.co.uk


    ## 评测


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_83_0.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_83_1.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_83_2.png)


    ## MINI PC


    ### OpenPi


    基于树莓派驱动的硬件基础使用了计算模块。OpenPi 看起来看起来像一个设备 —— 一个不起眼的黑色盒子，带有一个 HDMI 和 USB 插槽。然而，并没有真正的迹象表明它是什么，但打开它后会发现一个连接到树莓派计算模块的定制板，内部标准允许你连接微型键盘/鼠标组合。公平地说，这看起来很简单
    —— 它基本上就是一个全功能的 true树莓派。


    实际上，它的意义在于，通过计算模块和 OpenPi，你可以完全访问通常的树莓派供电和设置。OpenPi 的卖点在于你可以控制——这是完全开源的硬件——并由自己修改方案，制作出符合你需求的定制板。这是创建物联网的一种更简单的方法，他们成功地创建了实现此目的的平台。


    正如我们暗示的那样，将其作为普通的树莓派使用是可以的；它功能完备，你可以轻松通过自带的 Wi-Fi 适配器和安装的软件通过 SSH 访问。这使得它立即作为
    Wi-Fi 路由器或文件服务器非常出色。它带有标准的 Raspberry Pi OS，你可以根据需要随时更新和升级，以跟上最新最强大的软件。虽然破解它的方法有限，但开源硬件属性意味着整个
    PCB 都可以修改，当你为它制作定制外壳也是如此。它比树莓派本身更贵，针对不同的用户群。它是面向创作者的吗？在某种程度上，PCB 本身并没有提供太多额外东西。对于创作者来说是一个极好的灵感和良好的开始，但它更倾向于商务和创业市场，用于创建可以从物联网受益的办公室系统。


    | 特性 | 详情 |

    | :--- | :--- |

    | 操作系统 | Raspbian |

    | 处理器 | BCM2835, ARMv6 700 MHz |

    | 内存 | 1GB |

    | 尺寸 | 104mm x 79mm x 33mm |

    | PCB | Wireless 硬件 |

    | 价格 | £335 |


    > 总结：得益于其微小的尺寸和一个可以让你执行任何项目的微型模块，这个盒子具有巨大的潜力。除了你的想象力，它没有任何限制。它面向通用技术市场，但技术人员无需申请。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_83_3.png)


