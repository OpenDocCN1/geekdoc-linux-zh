    ## DistroWatch

    Like the idea of booting your system but can''t figure out exactly what to use?
    DistroWatch completes one of the most complete list of Linux distributions on
    the Internet. It keeps tabs on the updates and releases, archives of live media,
    and update news for each of distros. Everyone has its own categories and a little
    explanation so you can figure out if the distro is what you''re looking for.


    There is a ranking table of distros that seem to be popular on the site, which
    may help you discover new and excellent operating systems, and upcoming release
    schedule so you can plan what distro to get ready in.


