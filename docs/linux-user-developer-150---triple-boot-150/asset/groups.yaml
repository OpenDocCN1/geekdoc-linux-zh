    \ line options of lsof and use them as needed.\n\nwww.linuxuser.co.uk\n\n# Get\
    \ network information using lsof\n\nTroubleshoot your network by identifying its\
    \ problems\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_26_0.png)\n\n## 01 lsof\n\
    \nWhen you are in doubt which command line option to use, the first choice is\
    \ lsof. If you want to save the page of lsof to a separate file, you can convert\
    \ it into Postscript by executing the command with the following:\n\n```\n$ lsof\
    \ -i lsof\n```\n\n## 02 What if we have a network problem\n\nWhen you are working,\
    \ many problems may come up such as: is there a problem with the local network\
    \ or the server? If you are unsure whether it is hardware or software issue, Utils\
    \ like lsof can help you find the source of problems and find the correct root\
    \ of the problem.\n\n## 03 Which program listens to a port?\n\nThe -t option lists\
    \ to only related information. Therefore, the following commands show all network\
    \ info:\n\n```\nlsof -i\n```\n\nThe first question will easily answer which server\
    \ program queries a TCP port on your Linux machine. To find out which specific\
    \ port, run the following:\n\n```\n$ lsof -iP -t\n```\n\nOther possible states\
    \ of TCP connection are CLOSED, SYN-SENT, ESTABLISHED, CLOSE-WAIT, LAST-ACK, CLOSING\
    \ and TIME-WAIT.\n\n## 04 The repeat mode\n\nIf converting ID to name is working\
    \ properly, you can disable it using -n. This option can be combined with a range\
    \ of other options for providing additional speed to the output. Running lsof\
    \ with the -r option puts in repeat mode which runs every seconds. When lsof is\
    \ in repeat mode, it prints every output (a second), the default value is 5 seconds.\
    \ You can change the value after -r.\n\n## 05 User ID\n\nThe following command\
    \ will list all SSH connections to the local machine:\n\n```\nlsof | grep ssh\n\
    ```\n\nThe following version will present exactly the same information:\n\n```\n\
    lsof -i | grep EST\n```\n\n## 06 Find all SSH connections\n\nYou can find the\
    \ processes that are accessing /var/run/mysqld.sock by running the following:\n\
    \n```\nlsof /var/run/mysqld.sock\n```\n\nIf you are interested in the ID of the\
    \ processes accessing a file, use the -t option:\n\n```\nlsof -t /var/run/mysqld.sock\n\
    ```\n\nThe process ID can be used for killing a process. linux.com\n\n# Tutorial\n\
    \n![](img/2f9ef091d4813dbe86196f72ccfd0107_27_0.png)\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_27_1.png)\n\
    \n![](img/2f9ef091d4813dbe86196f72ccfd0107_27_2.png)\n\n| PID | USER | GROUP |\
    \ NAME | STAT | START | TIME |\n|---|---|---|---|---|---|---|\n| 1 | root | root\
