    ## 你的观点


    Linux 用户的信


    ### FCC 的变化


    你好，我对“网络中性”的故事感到有些困惑，你能解释一下发生了什么吗？我听说联邦通信委员会（FCC）主席改变了他的主意，现在他支持实施 Title II——但这到底是什么？


    尼尔·尼尔（Neil Niall），FCC 主席汤姆·惠勒（Tom Wheeler）最近在《连线》杂志上发表了一篇文章，宣布他有新的提议来保护互联网作为创新和自由言论的平台。基本上，Title
    II 是 1934 年《电信法》的第二部分，它涉及的是公共承载，即传输或治理信息服务的公司。1996 年的《电信法》更新版 Title II 被采纳是为了“禁止对等付费”，并保护互联网通道。当你读到这里时，FCC
    已经在 2 月 26 日的会议上投票了这项提案。


    ## 不喜欢 Gnome


    你能告诉我关于 GNOME 3 的情况吗？

    我刚开始使用 Linux，在这里两个多月了。我想了解更多信息……


    马克斯·奥尔里奇（Max Aldridge）


    GNOME 3 的问题相当复杂。我们将尝试正确解释它。它的主要缺点是缺乏根本性的变化。正如你所知，GNOME 3 是你看到的左侧的“活动”以及顶部栏的各种小组件。与
    GNOME 2 相比，当你使用它时会感到惊讶。人们开始提供扩展来解决这个问题，但用户并不喜欢它。


    ## Android 杂志


    随着更多 Android 功能构建，开发和发布流行的应用程序变得简单得多。超过 2500 万台设备提供了广泛的选择。对于想要获得丰富的 Android 体验，你可以阅读《Android
    杂志》，它是关于开发和黑客技巧的唯一刊物。


    了解更多信息请访问 www.linux.com。查看 Fedora 和 openSUSE 使用情况。


    ## 话题 BREAD


    有争议的实施在线程中引起了分歧。模块化控制将 Linux 与其他操作系统区分开来，而且当你读到这里时已经太晚了。他们还没有隐藏多少。这是停止它的激励措施几乎为零。


    UK 用户说：


    我的核心机器从启动到只需要几秒钟。系统是并行运行的。另一个问题是，如果你需要完成任务，必须有一个良好的连接。如果你有互联网连接，就可以轻松地排除网络故障。这缩短了启动时间。


    丹尼尔（Daniel）说：


    我们所说的依赖项将引入。如果依赖其他项，并且这种情况持续，那么仍然是一个犯错误。如果依赖项存在，系统已经精确地控制了。如果我需要系统通过，这将是我生命的结束。


    卢西斯（Lucius）说：


    “这个概念仍然是单体的，而单点故障的单体系统从未比 Linux 更好，或者为什么要这样做。”


