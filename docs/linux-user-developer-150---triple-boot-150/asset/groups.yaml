    \nPostgreSQL 2.6 或更高版本\nPython-dev 包含某些给 Python 的库。用于下载和设置 SQLite/PostgreSQL 服务器。所有内容都存储在一个文件中，这对于小用户组是可以的，但如果你预计会有更多用户，可能需要使用\
    \ PostgreSQL。\n\n```bash\nsudo apt-get install postgresql\npostgresql-client python-psycopg2\n\
    ```\n\n注意，还有其他所需的包。安装过程会创建一个具有足够权限处理数据库的用户 (postgres)，但请记住，我们需要为 MediaGoblin 创建一个独立的用户。要创建此用户（此处未完）\n\
    \nPython 库：此镜像为 Python 解释器添加了依赖。virtualenv 是你用来创建 Python 环境的工具。\n\n```bash\nsudo\
    \ -u postgres createuser -D mediagoblin\n```\n\n你可以使用 apt-get 命令安装整个数据库系统。这可以通过一条命令完成：\n\
    \n```bash\nsudo apt-get install git-core postgres \\\npython-dev python-ixml python-imaging\
    \ \\\npython-virtualenv\n```\n\n由于它已经创建了，你不需要登录此账户，但可以进行切换：\n\n```bash\nsudo -u\
    \ mediagoblin /bin/bash\n```\n\n一旦你创建了它，用户将使用此账户一次。\n\n这里是第一个 mediagoblin 的名称，第二个是数据库的名称：\n\
    \n35 | linuxuker.com\n\n# 教程\n\n## 04 安装 MediaGoblin\n\n开始安装，你需要为 MediaGoblin\
