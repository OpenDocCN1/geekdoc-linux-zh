    \ git clone -hv mediagoblin /srv/mediagoblin.example\n```\n\n如你所示，使用提升权限创建目录，然后将所有者更改为我们的低权限\
    \ MediaGoblin 用户。现在让我们克隆 MediaGoblin 以从 MediaGoblin 仓库获取数据，然后切换到我们刚刚创建的工作目录：\n\
    \n```bash\ncd /srv/mediagoblin.example\n```\n\n现在开始：\n\n进入 'mediagoblin' 文件夹并创建\
    \ mediagoblin.ini，然后获取仓库：\n\n```bash\ngit clone git://github.com/mediagoblin/mediagoblin\n\
    ```\n\n你会注意到我们没有从稳定分支获取代码，而是从仓库的 master 分支。MediaGoblin 已经准备好快速开发，因此我们选择使用 master\
    \ 分支：\n\n```bash\ngit submodule update --bin/python setup.py --development ../bin/python\n\
