    ### 本期内容：

    - >> 为了发行克里斯托弗·诺兰的最新电影《星际穿越》（HD、蓝光™ 和 DVD），群晖将提供赢取优厚奖励的机会，欢迎加入我们的 Gadget Show
    Live（4 月 8-12 日）或访问我们的 Facebook 页面！

    - >> 三系统系统的潜力

    - >> 构建开源卫星导航

    - >> 开始使用 btrfs 文件系统

    - >> 排除你的家庭网络故障


    Bob Zetsloot 致力于航空航天工程，使用 Python 进行复杂仿真建模。这个月再次如此，并要求进行升级。遗憾回到了他的上一个项目：一个成功（第
    2 页），用于 L&D 飞行堡垒的多进程处理（第 16 页）。


    Jon Masters 是一位 Linux 内核黑客，从事 Linux 已超过 19 年，从他最初在马萨诸塞州剑桥市 MIT 上学开始他在企业 Linux
    供应商工作。你可以在本期找到他。


    Joey Bernard 是一个真正的全才，他将时间分配在撰写文章、帮助研究人员进行科学计算和写作上。在他出色的专栏（第 72 页）中，他带我们完成了三三部曲配置树莓派助手指南的第一部分。


    欢迎阅读 Linux User 最新一期，这是英国和美国最喜爱的 Linux 和开源杂志。本月我们为你准备了大量内容，涵盖了广泛的实用软件和技术。首先，我们展示了如何在任何电脑（包括
    Windows）上安装三个不同的发行版——这对于我们许多人来说有时是必要的（但我们经常在偷看即将发布的新版本时不知措手），然后通过关于分区、维护和 GRUB
    样化的指南。翻到第 16 页开始。


    Mihalis Toukalos 是一位在数据库和数学方面拥有专长的 Linux 系统管理员。他自 1993 年起就开始 Linux。Mihalis 在本期向我们展示了如何发现网络性能信息（第
    26 页），以及如何使用 LaTeX 轻松创建。


    本月其他内容，我们将使用 Pencil 进行渗透测试，迁移到 btrfs 文件系统，构建 YouTube 等。我们还回到了 QR 系列，并汇总了本月小组中
    Linux 领域最出色的玩家。


    在树莓派方面，Gavin 向我们展示了 SainSmart 绝佳的 9 英寸触摸屏和 Adafruit 的 GPS 套件，通过开源设置让其移动起来，具有完整的离线和本地天气功能以及
    Navit 地图。玩得开心！

    Gavin Thomas，副编辑


    Christopher Armstrong 是一位软件工程师和 de-10 支持人员，曾在在线和杂志上撰写过关于 Linux 和智能手机的文章。在另一个四页的指南中，他将向你展示如何从物理上调试树莓派。


    Gareth Hallace 是我们的驻地记者，为我们带来整个开源世界的最新进展，从第 10 页开始。本月，Gareth 测试了新的 Mint 发行版，用以找出它是如何与其前身以及其基于
    ARM 的竞争对手相抗的。


