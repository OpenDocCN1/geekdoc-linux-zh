    ### Windows 安装


    ### 恢复 GRUB


    微软的操作系统对某些人来说是必要的恶，但这里是如何安全地从它的黑暗中召唤它。


    如果你已经安装了 Windows，我建议查看该页面，以确定在它旁边安装其他系统的最佳方法。否则，在 Linux 之后安装 Windows 不如简单。Windows
    倾向于完全抹除磁盘并将自己设定为电脑的统治者，但通过一些说服，你可以让它和谐相处。


    ### 轻量级 Lubuntu


    在不牺牲任何东西的情况下保持轻量是 Lubuntu 的优点之一。


    ### 滚动更新 Gentoo


    你可以在大多数定制化设置中获得最新的软件包和更新。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_18_4.png)


    ### 工作桌面 openSUSE


    它非常适合企业，如果你想在没有任何干扰的情况下工作，它也非常棒。你的 GRUB 组件都位于发行版的 etc 目录下。


