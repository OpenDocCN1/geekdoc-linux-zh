    The NTFS file system isn''t suited to editing its space use but there are ways
    around it.


    While ext4 are much more efficient, they still suffer from fragmentation. The
    partition might still corrupt files if parts of them are located towards the end
    of the disk, although it''s much less likely. If you are using NTFS it''s worth
    asking for though the defrag (see sourceforge.net/projects/defrag/) best method
    is to always defragment your personal files onto portable storage, while trying
    to be conservative. It is worth mentioning to always back up important files on
    these kinds of tutorials anyway.


    If you''re starting with Windows installed on your system, you''ll need to start
    making space so that you can install your other distro. This means shrinking Windows,
    always defrag the partition that contains all of your files and documents which
    used to be known as My Documents.


    It''s not perfect though, and you may feel the need to defrag before shrinking
    the partition. For this, we recommend UltraDefrag (bt.ly/16SirAf), which is an
    open source defragmenter that will perform an action to defrag files from the
    end of the partition - where we need them to be moved.


    Therefore, you may need to move files off your computer before shrinking partitions
    and allow for more space on Windows and another distro. As shown on the partitioning
    page, you should have enough general storage space rather than completely defragment.


    Once that is done, you can use GParted to shrink your disc. Do not move the Windows
    partition as it will completely ruin it and at the start you leave everything
    around.


    Either, you need to be careful when shrinking the partition - files usually become
    fragmented and split over the course of many writes and around the disk - and
    this could become ridiculous, since Microsoft has implemented automated defragmentation
    systems into Windows that will keep it tidier on a daily level.


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_20_0.png)


    We recommend using UltraDefrag if you want to have a file at defragmented.


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_20_1.png)


    ```

    $ sudo defrag -v /dev/sda1

    Scanning for fragmentation in /home/user...

    Defragmenting file: /home/user/file.mp4

    Defragmenting file: /home/user/image.jpg

    Done. 2 files defragmented.

    ```


    Above Defrag gave you quite and useful output in the terminal.


    Above Windows has tools for this Windows Vista and you can use those GParted.


    ## Resources

    The boot menu is automatically created by your distros, so it might need some
    tidying up.


    When Windows 8 launched there was a lot of furor over UEFI and secure boot. For
    good reason though, secure boot would not allow operating other systems alongside
    Windows. As most PCs and laptops have that feature, users might be affected. Luckily,
    distros began to adapt software so that even motherboards still have UEFI and
    secure boot, they would be able to work without too much of a problem.


    Modern GRUB, GRUB 2, is very smart. Merely installing it as part of most distros
    has it to see what is on your system and add it to the boot menu. If you''ve used
    the GRUB recovery process, the naming of menu can be updated at any time to include
    new distros.


    To see the default and time-changes we made, as well as the individual boot scripts.
    You can manually move them across the grub.cfg and save it, but it will be overwritten
    every time you do an update.


    There is a lot more you can do with GRUB through selection on the menu to customize
    the naming and placement of operating systems on. After each update you can change
    the settings with ease.


    These days there''s no huge problem in installing Linux distros, have a solution,
    and you can easily deactivate secure boot to get the installation underway. If
    you do encounter any issues, though, it should help you out right away.


    - 03 Order change

    The menu placement depends on number of the files located in /etc/grub folder.
    The Linux you are using with a custom script titled 10_linux, or 30_grub-list.
    Changing the number on the two will move them around. For example 05_grub will
    work before 10_linux.


