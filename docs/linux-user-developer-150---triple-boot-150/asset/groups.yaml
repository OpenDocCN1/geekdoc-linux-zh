    The screen the default selection will be the first in the list. The timer will
    be automatically selected when it hits zero. As a quick way of changing the default
    to be first, edit /etc/grub/00_header and search for the following two:


    - 04 Best order change

    The most effective and permanent method of changing the order is to create custom
    scripts for your three distros and order them properly in the grub folder. however
    we will use a very simple script to the 10_linux file and you can find it in 40_custom
    directly inside its bootloader. Once you''ve got this setup, you may need to do
    some maintenance to keep your GRUB menus in perfect order.


    ```

    GRUB_DEFAULT=0

    GRUB_TIMEOUT=5

    ```


    - 02 Manual order change

    After every update, grub.cfg is updated, usually located in /boot/grub/grub.cfg,
    open it with nano and save changes.


