    # Tutorial


    You will need to write your own launcher for CarPi


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_57_0.png)


    The Navit software comes with a host of options built into its menu


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_57_1.png)


    The Pymptouchgui front-end for the map is presently featuring


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_57_2.png)


    # Make it mobile


    # 16 Configure Navit speech


    It is definitely best to put this project together in a workspace where you can
    clearly see what you are working on and everything correctly wired and solved.
    The point of the project is to make this little portable so you can put it in
    your car or boat. You could install it in a single hand, maybe customise a large
    house to secure the vehicle doors. You will need to help to power the screen with
    a power bank and even more the GPS antenna is fastened to a good spot for signal.


    The last part is: Edit the Navit config file (/etc/navit.xml) and replace the
    following line:


    ```

    <speech type="cmd">data="Fix the tag in navit to let say: ''Yss'' cps="15""/>

    ```


    ...with:


    ```

    <speech type="cmd">data=" cps="0""/>

    ```


    Now you can run Navit with DISPLAY=0.0 and have some fun experimenting.


    run sudo passwd to set a password for root. From a computer with music, run:


    ```

    scp -R mpd /var/mpd_folder root@ip_address:/var/lib/mpd/mpc/

    ```


    # 17 Install the music player


    MPD is the music player back-end and front-end that needs installing.


    On the Pi, you now change the ownership of the library. Press U to


    ```

    sudo apt-get install mpcid

    get http://www.pi.org/projects/software/pymptouchgui-0.320.tar.gz

    tar xf pymptouchgui-0.320

    ```


    # 19 Install mpd music


    NMPC is a command line client for music. Type nmpc and press U to update the library.
    Press 3 to quit to the music is, and Press 1 select the screen if you want to


    # 20 Install awesome window manager


    Now you need to write your own launcher for CarPi, which will run full-screen.
    Ensure every application is for full-screen, use awesome window manager in full-screen.


    ```

    sudo apt-get install awesome

    ```


    ```

    sudo rm /etc/alternatives/x-session-manager

    sudo ln -s /usr/bin/awesome /etc/alternatives/x-session-manager

    ```


    When changing the default x-session-manager, awesome will be auto-started at boot
    instead of LXDE. If you reboot the Pi, awesome should then load up automatically.


    # 18 Copy music


    Scp (secure copy protocol) was used here to copy music. First get the Pi''s IP
    address by running addr.


    ```

    sudo python python path in software

    sudo in -s /usr/local/share/pymptouchgui/share/pymptouchgui

    ```


