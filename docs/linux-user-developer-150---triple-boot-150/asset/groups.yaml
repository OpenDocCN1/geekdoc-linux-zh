    ## 三系统启动

    通过使用三个发行版最大化你的生产力


    > 在收缩分区时需要小心


    ## 缩小分区


    ## Linux 需要碎片整理吗？


    NTFS 文件系统不适合编辑其空间使用，但有方法可以解决。


    虽然 ext4 效率高得多，但它们仍然会受到碎片的影响。如果分区的部分位于磁盘末尾，分区仍可能损坏文件，尽管这种情况要低得多。如果你正在使用 NTFS，值得问一下，尽管碎片整理（见
    sourceforge.net/projects/defrag/）最好的方法是始终将你的个人文件碎片到便携式存储设备上，同时尽量保持保守。无论如何，在这些此类教程中，务必提到始终备份重要文件。


    如果你是从安装了 Windows 的系统开始的，你需要开始腾出空间以便安装你的其他发行版。这意味着缩小 Windows 分区，始终对包含你所有文件和文档（以前被称为“我的文档”）的分区进行碎片整理。


    但这并不完美，你可能觉得在收缩分区之前需要进行碎片整理。为此，我们推荐 UltraDefrag (bt.ly/16SirAf)，这是一个开源碎片整理工具，它可以执行操作将分区末尾的文件碎片整理——这正是我们需要它们移动的地方。


    因此，在缩小分区之前，你可能需要从电脑上移动文件，并为 Windows 和另一个发行版留出更多空间。如分区页面所示，你应该有足够的存储空间，而不是完全碎片整理。


    一旦完成，你可以使用 GParted 缩小你的磁盘。不要移动 Windows 分区，因为这会完全破坏它，而在开始时你会让一切保持原样。


    或者，在收缩分区时需要小心——文件通常在多次写入过程中分散并位于磁盘周围产生碎片化——这可能会变得荒唐，因为微软已经在 Windows 中实现了自动碎片整理系统，这会使其在每天的层面上保持整洁。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_20_0.png)


    如果你想让文件碎片整理，我们建议使用 UltraDefrag。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_20_1.png)


    ```

    $ sudo defrag -v /dev/sda1

    Scanning for fragmentation in /home/user...

    Defragmenting file: /home/user/file.mp4

    Defragmenting file: /home/user/image.jpg

    Done. 2 files defragmented.

    ```


    上面的 Defrag 在终端中为你提供了相当实用的输出。


    上面的 Windows 在 Windows Vista 有这些工具，你可以使用 GParted。


    ## UEFI


    ## 编辑 GRUB


    启动菜单由你的发行版自动创建，因此它可能需要一些整理。


    当 Windows 8 发布时，关于 UEFI 和安全启动引起了很大轰动。不过这很有道理，安全启动不允许在 Windows 旁边运行其他系统。由于大多数个人电脑和笔记本电脑都有该功能，用户可能会受到影响。幸运的是，发行版开始调整软件，使得即使主板仍有
    UEFI 和安全启动，它们也能在没有太大问题工作。


    现代的 GRUB（GRUB 2）非常智能。仅仅作为大多数发行版的一部分安装它，它就能检测你系统中的内容并将其添加到启动菜单。如果你使用过 GRUB 恢复过程，可以随时更新菜单名称以包含新的发行版。


    要查看我们所做的默认设置和时间更改，以及单独的启动脚本。你可以手动跨 grub.cfg 移动它们并保存，但每当你进行更新时它都会被覆盖。


    通过菜单上的选择，你可以通过 GRUB 做更多事情，以自定义操作系统的命名和放置。在每次更新后，你可以轻松地更改设置。


    如今安装 Linux 发行版没有大问题，有解决方案，你可以轻松禁用安全启动以开始安装。不过，如果你遇到任何问题，它应该能立即帮助你。


    - 03 顺序更改

    菜单位置取决于位于 /etc/grub 文件夹中的文件编号。你正在使用的 Linux 有一个标题为 10_linux 或 30_grub-list 的自定义脚本。更改这两个数字将将移动它们的位置。例如，05_grub
    将在 10_linux 之前运行。


    - 01 默认选择和超时

    默认选择的屏幕将是列表中的第一个。计时器在归零时会自动选择。作为将默认项更改为第一的快速方法，请编辑 /etc/grub/00_header 并搜索以下两项：


    - 04 最佳顺序更改

    更改顺序最有效且持久的方法是为你的三个发行版创建自定义脚本，并在 grub 文件夹中正确排序。然而，我们将使用一个非常简单的脚本到 10_linux 文件，你可以直接在其引导加载程序内部的
    40_custom 中找到它。一旦设置好这些，你可能需要进行一些维护以保持你的 GRUB 菜单处于完美顺序。


    ```

    GRUB_DEFAULT=0

    GRUB_TIMEOUT=5

    ```


    - 02 手动顺序更改

    每次更新后， grub.cfg 都会更新（通常位于 /boot/grub/grub.cfg），用 nano 打开它并保存更改。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_21_0.png)


    上面的 Windows 在 Windows Vista 有这些工具，你可以使用 GParted。


