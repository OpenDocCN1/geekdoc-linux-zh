    # 08 Show open UDP


    The following command opens UDP files on


    ```

    # lsof -i UDP

    ```


    The next version shows open files on the (Network Time Protocol) port only:


    ```

    # lsof -i :udpn

    ```


    # 10 List files opened by a specific user


    This is a very practical option because it enables you to locate the open files
    of any user, including the web, database and ftp servers you may have.


    The following command lists all open files by the www-data user:


    ```

    # lsof -u wwwdata

    ```


    The next version finds all established connections by the www-data user:


    ```

    # lsof -u www-data | grep -i ESTABL

    ```


    In order to find all processes except the ones owned by www-data user, it could
    be useful to use lsof as follows:


    ```

    # lsof -u "www-data"

    ```


    # 11 Show processes that are listening on a particular port


    The following command shows all connections listening to port 22 (ssh) using UDP
    or TCP:


    ```

    # lsof -i :22

    ```


    # 12 Kill processes owned by a user


    The following command kills all processes owned by the www-data user:


    ```

    # kill -9 $(lsof -u www-data"

    ```


    Remember to be careful when combining lsof with the kill command - don''t try
    to test the command on a live server.


    # 09 List open files under a directory


    The following command lists all files under a specified directory:


    ```

    # lsof + /var/log/

    ```


    If you don''t want to visit all directories, you can use the option:


    This option is particularly useful when there are any open files by your network
    services, like web servers or mail servers, for example.


    > Be careful when combining lsof with the kill command


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_27_3.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_27_4.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_27_5.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_27_6.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_27_7.png)


    # 13 Find all activity from a given user


    The following command lists all activity by the mtsook user:


    ```

    # lsof -u mtsook -

    ```


    Similarly, this command lists all network activity from processes not owned by
    the root:


    ```

    # lsof -u -root -

    ```


    # 14 Discover network connections from an external host


    The following command finds all network connections that are coming from or going
    to:


    ```

    # lsof -i @google.com

    ```


    You can also specify a range of ports as follows:


    ```

    # lsof -i @google.com:20-25

    ```


    # 15 Use AND


    The default behaviour when multiple options is to print everything that matches.
    If you want an AND, you can use the -a option. Therefore, to find all open sockets
    by the www-data user, you should use the following command:


    ```

    # lsof -Fni -a www-data

    ```


    To find out a user is connected to the 192.168.2.4 machine, you use the following
    command:


    ```

    # lsof -u mtsook -a :0192.168.2.4

    ```


