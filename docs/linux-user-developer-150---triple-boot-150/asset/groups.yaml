    # # Tutorial


    #  04 Install MediaGoblin


    To start the installation, you need to create a working directory for MediaGoblin,
    where the git repository will be downloaded.


    ```

    sudo mkdir -p /srv/mediagoblin.example

    gudo git clone -hv mediagoblin /srv/mediagoblin.example

    ```


    As you can see, create the directory with elevated privileges and then change
    the owner to our underprivileged MediaGoblin user. Let''s now clone MediaGoblin
    to fetch the data from the MediaGoblin repository and then change the directory
    to the working directory we just created:


    ```

    cd /srv/mediagoblin.example

    ```


    Now starting:


    Move to the ''mediagoblin'' folder and create mediagoblin.ini then fetch the repo:


    ```

    git clone git://github.com/mediagoblin/mediagoblin

    ```


    You''ll notice we didn''t take the code from the stable branch but instead the
    master branch of the repository. MediaGoblin is ready for rapid development so
    we sense to use the master branch:


    ```

    git submodule update --bin/python setup.py --development ../bin/python

    ```


    MediaGoblin uses a virtualenv to manage the dependencies with isolated Python
    environments. It''s already installed in the package, so we can use:


    ```

    virtualenv --python2 --system-packages --python=python.7 .. /bin/python setup.dev

    ```


    If you are feeling adventurous, you can also try the experimental deployment script
    (shell script) instead of the earlier command:


    ```

    /experimental-bootstrap.sh && --configure make

    ```


    #  06 Deploy MediaGoblin


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_35_0.png)


    To make any changes to this file, first copy it to mediagoblin.local.ini, then
    make the changes.


    To change the database, make sure you change the path in the database.ini file
    and your server configuration.


    ```

    [database]

    path = /var/lib/mediagoblin

    user = mediagoblin

    email_address = @mediagoblin.example.org

    [postgresql]

    url = postgres://mediagoblin

    [settings]

    appropriate = true

    notifications = false to stop sending notifications after having changed: true

    registrations = false to disable registrations

    report = false to disable the ability for users to report offensive content

    reporting = true

    ```


    # MediaGoblin doesn''t need any privileges to run


    +   - email_address = the ID you use for sending system emails.

    - Uncomment the line sql_engine = true

    - postgresql:///var/lib/mediagoblin if you are using PostgreSQL

    - edit_remote_path, and base_url = / the root of the virtual host.


    This script up virtualenv and also keeps it updated by making update, as per developers
    of MediaGoblin, this is still essential. The codebase at one point of time simply
    runs:


    ```

    git submodule update --bin/python setup.py --development ../bin/python

    ```


    Now you also need to install the freep dependencies. It includes using:


    ```

    /bin/pip install Flask https://pypi.python.org/project/Flask/v1.3.dev201408405/

    ```


    We will see more on Flask and FastGI in the following sections:


    +   - lazyserver.sh --server-name--localhost


    You should be able to connect to your server port 6543.


    #  07 Deploy MediaGoblin


    Now that dependencies are set and MediaGoblin is installed, we edit the MediaGoblin
    configuration files — specifically the mediagoblin.ini file located inside /srv/mediagoblin.example/
    and here are the changes:


    MediaGoblin uses FastGI for deployment and needs a server. We will need - a FastGI
    server. We already installed Flask in step five, so now we see why Flask is so
    important. Later you will learn a FastGI setup with an Nginx server to see MediaGoblin
    pages.


