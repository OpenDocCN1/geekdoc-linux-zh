    | A6 | A6 |

    | A7 | A7 |


    ### 10 The RAID

    You can create different types of RAID arrays - by default it will do RAID 0,
    but it also supports RAID 1, RAID 10, RAID 5 and RAID 6. Choosing which RAID comes
    down to preference and how much effort you put into maintaining your


    ### 11 RAID 1

    RAID 1, where data is duplicated across drives, can be created on btrfs using
    a modified version of the command used to create trees of devices. The -dev option
    refers to how the data is used:


    ```

    $ mkfs.btrfs -m /dev/sda /dev/sdb/

    ```


    ### 12 Have non-redundant metadata

    If you''re creating a hardware RAID, having the metadata redundant may be useful.
    The metadata created per device. This requires the -m option and can be used with
    ''single'' or RAID 0 with:


    ```

    $ mkfs.btrfs -m raid0 /dev/sda /dev/sdb/

    ```


    ### 13 RAID 10

    Basic mirroring with RAID 10 is good for large data repositories. You can use
    -m and -d to specify that we want metadata and to be redundant with:


    ```

    $ mkfs.btrfs -m raid10 -d raid0 /dev/sda /dev/sdb/

    ```


    ### 14 Look at the different options

    The option -d allows you to set many fancy options. You can create a btrfs RAID
    0 (Just a Bunch of Drives) by doing -d /single/dev/sdb/dev/sdc. You can also have
    metadata that is non-redundant while data is redundant with -m raid0 -d raid0
    /dev/sda /dev/sdb/sdc. There are many ways to do it as you see fit.


    ### 15 RAID 5 and 6

    RAID 5 and 6 are excellent concepts using striping and mirroring several drives
    so that up to 75% can be used for storage while still being safe from hard drive
    failures. This offers more storage than RAID 1 with the same redundancy (in theory),
    and RAID 6 increases the redundancy decreases the overall storage of drives to
    60% of their full capacity.


    While there are still bugs, and even at the best 5 and 6 can be a hassle. For
    details on RAID 5 and 6 in btrfs, visit the document at https://btrfs.wiki.kernel.org/index.php/RAID


    ### 16 Create snapshots

    The btrfs writes data that exists since the old version of metadata still exists
    as free space - you can call ''rollback'' to any previous point in time. You can
    also create snapshots of subvolumes that are more permanent.


    ### 17 Add a subvolume

    To create this snapshot, head back into the terminal and make sure you know where
    the subvolume lies. The snapshot will be created in the btrfs partition, but it
    is best to put in a separate location to the original subvolume to save confusion:


    > $ btrfs volume snapshot btrfs/

    > btrfs/snapshot-1


    ### 18 $ btrfs volume set-default 258 btrfs/

    Then mount and remount the subvolume to make the changes occur.


    ### 20 Remedy fragmentation

    Due to the way btrfs writes files, which we noticed in an earlier ship, this file
    fragmentation is a well-known issue, but btrfs has an in-built defragmentation
    that works even when the volume is mounted. You can use it with:


    # $ btrfs file defrag/


    ### 21 The future file system

    With all the tools you have beside you working with btrfs makes for your life
    easier. It is a truly excellent concept for the next generation of fs and its
    a great idea to board with now.


    > $ btrfs volume list btrfs/volume1


    ### 19 Set default

    Note down the id for the snapshot (in case, 258) and then set it as the default
    for the subvolume by using:


    ```

    rob@ubuntu:~$ sudo btrfs volume snapshot btrfs/volume1 btrfs/snapshot-1

