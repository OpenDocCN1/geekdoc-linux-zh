    # lsof | wc\n6759 6456 8461\n```\n\n注意 lsof 的命令行选项是有用的。www.linuxuser.co.uk\n\n\
    # 使用 lsof 获取网络信息\n\n通过识别问题来排排除您的网络\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_26_0.png)\n\
    \n## 01 lsof\n\n当你不确定使用哪个命令行选项时，第一个选择是 lsof。如果你想将 lsof 的页面保存到单独的文件，可以执行以下命令进行转换：\n\
    \n```\n$ lsof -i\n```\n\n## 02 如果我们有网络问题\n\n当您工作时，可能会出现很多问题：如果不确定是硬件还是软件问题，像 lsof\
    \ 这样的工具可以帮助您找到问题的源。以下命令显示所有网络信息：\n\n```\nlsof -i\n```\n\n## 03 哪个程序监听端口？\n\n第一个问题将轻松回答哪个\
    \ Linux 机器上的 TCP 端口。要找出特定的端口，请运行：\n\n```\n$ lsof -iP -t\n```\n\nTCP 连接的其他可能状态包括\
    \ CLOSED、SYN-SENT、ESTABLISHED、CLOSE-WAIT、CLOSING 和 TIME-WAIT。\n\n## 04 重复模式\n\n\
    如果转换 ID 名称工作正常，你可以使用 -n 禁用它。使用 -r 选项运行 lsof 进入重复模式，每秒运行一次。当 lsof 处于重复模式时，它每秒打印一次，默认值为\
    \ 5 秒。你可以在 -r 之后更改值。\n\n## 05 用户 ID\n\n以下命令将列出所有本地 SSH 连接：\n\n```\nlsof | grep\
    \ ssh\n```\n\n以下版本将提供相同的信息：\n\n```\nlsof -i | grep EST\n```\n\n## 06 查找 SSH 连接\n\
    \n你可以运行以下命令找到访问 /var/run/mysqld.sock 的进程：\n\n```\nlsof /var/run/mysqld.sock\n\
    ```\n\n如果你对访问文件的 ID 感兴趣，使用 -t 选项：\n\n```\nlsof -t /var/run/mysqld.sock\n```\n\n\
