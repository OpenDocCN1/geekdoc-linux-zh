    # 教程


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_61_0.png)


    ### 你需要的物品

    - 导电油料

    - 公对母跳线线

    - 各种 LED 灯、开关和电阻（可选）


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_61_1.png)


    # 使用导电油料绘制电路


    有了导电油料的乐趣，组装电路从未如此简单，它能让你以一种完全全新的方式将艺术与电子产品相结合。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_61_2.png)


    **Aaron Shaw**

    Aaron 是《The MagPi》(themagpi.com) 的联合创始人，他从小起就在与 Raspberry Pi 打交道。他觉得非常幸运可以在工作和娱乐中用到
    Pi！


    玩转电子产品和物理计算是一项很有意义的任务——它能让各个年龄段的人脸上露出巨大的笑容。对于初学者来说，杂乱的电线和组件可能会让他们困惑，而焊接等操作可能会成为障碍。导电油料消除了电子产品的门槛，并使其变得更安全、更简单且功能更强大。你可以使用导电胶水来完成，以及更多操作。你所做的事情几乎没有限制——如果你用普通油漆和普通电子设备无法实现，那么你就可以用裸导电油料来实现（甚至是多层电路也是可能的）。


    ## 01 获取你的工具


    当你考虑到电子产品时，油漆和画笔并不是脑中第一个想到的东西，所以你可能想从哪里买它们。Bare Conductive 在他们的商店 (bareconductive.com/)
    中出售这种油料和一系列组件。我们建议使用像 Hobbycraft (hobbycraft.co.uk) 这样的连锁店或当地的独立商店。


    ## 02 选择你的平台


    棒的一点是，导电油料在干燥后的工作原理与普通布线完全一样！这意味着你可以配合任何你喜欢的微控制器使用，例如 Bare Conductive Touch、Raspberry
    Pi 或 Arduino 的可穿戴 FLORA 平台。或者你也可以使用一些小针按钮来让 LED 闪烁，实现独立设置。


    玩玩微控制器板，你将很快创建出交互艺术品、服装和项目。


    # 使用导电油料绘制电路


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_62_0.png)


    ## 03 开始绘制


    你可以将导电油料涂在几乎任何表面上——纸张、织物、墙壁、衣服、木头、塑料等。最好的主意是制作或使用模版（纸质模版在家里最容易制作，但使用乙烯基材料可以获得最佳的边缘效果）。


    ## 04 连接


    无论在什么表面上，都有很多方法可以连接到导电油料（例如电池或微控制器），因为它的作用就像任何导线一样。因此，你可以使用用油漆粘住的电线、回形针、长尾夹、鳄鱼夹，甚至是缝入的导电按扣来完成各种项目。


    触控板 (Touch Board)


    ## 05 进行修复


    导电油料在变干燥后会很厚。这意味着你可以用它来冷焊物体并修复任何断开处。换句话说，你可以将电线粘在电路板上，或者将电线粘在一起，它们在电子上仍然可以工作。你甚至可以用它来修复电路上损坏的线路。


    ## 06 清理


    你们很多人可能都在想，像导电油料这么酷的东西会是很脏。实际上，导电油料是无毒、水性且水溶性的，可以用肥皂和水轻松清洁。


    上方是根据项目风格和要求裁剪的自定义模板


    ## 07 使其防水


    这种油料只有黑色且不防水。然而，棒的一点是，你可以在下方配合普通油漆、清漆和防水喷雾使用作为绝缘层——或者仅仅为你的设计增加一些色彩。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_62_1.png)


    ## 08 触控与声音


    导电油料还可以用作电容表面，这意味着当它与合适的控制板配对时，你可以将其用于触控、手势或接近感。Bare Conductive 可配合 Touch Board
    使用，它包含了你开始实验触控和声音所需的一切。它甚至可以作为 MIDI 控制器、接口或乐器！


    Bare Conductive 的 Touch Board 是一个 Arduino 设备，兼容你可能有的任何现有项目和代码。它可以与任何导电材料（如导电油料）配合，因此你可以将其连接到尺子上。使用导电油料，你可以创建一些东西，例如画板，甚至是一个对你的自定义形状做出反应并经过的电子鼓组。


    63 www.linuxuser.com


    # 保护你的 Raspberry Pi


    担心存储在 Raspberry Pi 上的数据安全吗？使用密码、防火墙和物理安全措施来保护自己。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_63_0.png)


    Christian Cavendish 是一位前 IT 和软件工程工程师，自 2010 年以来一直为在线和杂志计算机安全出版物撰写文章。


    你的 Raspberry Pi 存在明显的安全风险。存储从防火墙在内的任何内容，意味着重要数据只需极小的努力就能被他人窃取或收入囊。


    因此，了解到有几种工具、技巧和方法可以让你的设备和数据远离窥探的目光，令人欣慰，例如运行一个将图像上传到云账户的家庭监控摄像头。


