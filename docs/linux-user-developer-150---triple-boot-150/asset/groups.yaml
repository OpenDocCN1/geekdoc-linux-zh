    # OpenSource


    Your source of Linux news and views


    # JON MASTERS


    ## The kernel column


    Jon Masters updates us as Linux contemplates Linux 4.0 and debate continues over
    how to handle the year 2038 ''Y2K''.


    One of the more miscellaneous features introduced in Linux 3.19 is overlays. These
    are relevant to embedded devices, such as the Raspberry Pi, which uses a Devicree
    to describe the many platform-specific devices of the System-on-SoC upon which
    it is. Modern SoCs have dozens or even hundreds of devices, including of interfaces
    such as USB and networking, which are directly attached to the CPU cores on the
    chip with no PCI-bus. Determining the topology and structure of the system at
    boot needs the provision of a Devicree data structure, for run-times that are
    contained within Pi or on BeagleBone. Thus, Linux 3.19 will be much easier for
    using custom RBs.


    There was a time when kernels had odd/even numbering schemes in the 2.5 kernel
    series preceded the 2.6 series. But that was done again during 2.7, where a large
    part of the kernel became modern git-based source development process and the
    8 week kernel development cycle. As consequence, Linux 3.0 came not because of
    a need for new Earth, because Linus felt that the versions had grown too high.
    This logic holds again when we are getting to numbers where I have to count off
    my fingers to keep that count! It is highly likely that the kernel will be 4.0,
    or perhaps even 5.0 soon, because the version number will not be meaningless,
    except in product marketing which will likely use us anyway.


    Jon Masters is a Linux hacker who has been working on Linux for some nineteen
    years, since he first attended university in Cambridge, Massachusetts, and works
    for a large (at the age of 33) vendor, who has been driving the creation of systems
    for energy efficient ARM-powered devices.


    Linux Torvalds released the final 3.19 kernel roughly today, noting that "nothing
    all exciting since the 3.19-rc7 release, and I wanted a time that we have made
    in years for real." As he intended, the new kernel includes a number of exciting
    features: support for Intel''s Memory Protection Extensions (which is covered
    in detail), a new HSA driver for GPU devices, enhanced RADV 5 and 6 support, and
    the final merge of Android''s Binder mechanism of the kernel''s staging area.
    As usual, KernelNewbies have an excellent summary of the patches with links to:
    kernel/newbies.org/3.19.


    # Linux 4.0?


    With the release of Linux 3.19 came the opening of the merge window for the subsequent
    release. The merge will include a lot of variation depending upon how Linus feels;
    including intuitive and disruptive changes that could be quite impactful, and
    only if it is true that significant changes happen in the merge itself.


    The merge for what we want the kernel already has is ahead with some goodies.
    For example, Linux has given support for a kernel-mode-, but as the result is,
    it will not show up in many ways with the updated metadata. This is of course
    not now, but it will be in the future for things such as that which are in widespread
    use (for a number of the things).


    In the same way that Linux development has changed to be level in terms of churn,
    so has the significance of kernel version numbers. Many of the 10,000+ commits
    that are merged during this small window of time have gone through an entire previous
    7-8 week cycle to be the equivalent maintenance development-development for certain
    non-core parts of the kernel.


    These also change the kernel behavior, especially when updating and certain conditions-but
    they break POSIX compliance in the process. The latest implemented performance
    times it is thus in memory. It will not be written back to disk until the kernel
    has a reason to otherwise write file metadata, or a certain amount of time has
    passed (24 hours in the current implementation).


    # Opinion

    - Jon Masters


    # OPEN SOURCE


    # Binding Android APIs


    Linux 3.9 promotes Binder out of the kernel upstream and into the real part of
    Android. Binder is an Inter-Process Communication (IPC) mechanism, used to allow
    different processes (applications, or ''apps'') on an Android device or device
    to communicate with one another by using a runtime method provided by the other.
    It contrasts with traditional IPC mechanisms. For the longest time, Binder lived
    as a driver module that needed to be applied to an upstream Linux kernel to be
    used on Android devices. Binder, a special subdirectory of the kernel, a place
    intended for unstable test driver code that isn''t quite ready for production,
    to be made available to early adopters who nonetheless have a need or a desire
    to use it.


    Binder was never a conventional driver in the sense that it supported specific
    hardware adoptions. Its presence in staging served two purposes. The first was
    political: Linux still seen as a Unix-like operating system by many developers.
    People did not like the notion of Google adding a special IPC mechanism without
    a fight. Thus, moving the code into staging enabled others to deal with it in
    the same location as the Linux kernel source. Secondly, keeping Binder out-of-tree
    meant it had to be maintained for as long as Android devices were running, and
    they could be used on Android systems. After a sufficient period of time there
    was a consensus that most devices are running Android and all of them were using
    Binder. As Greg Kroah-Hartman says when promoting it out of staging: "No matter
    what comes in the future, we are going to have to support this API."


    ## Ongoing development

    There was much debate over the past month concerning the continuing problem of
    the year 2038. This is the year in which the 32-bit time t used in 32-bit Linux,
    Unix and Unix-like systems will overflow, causing time to regress to the year
    1978.

