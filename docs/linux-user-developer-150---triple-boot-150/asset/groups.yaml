    Why have DVDs burn images to days? Well... do we have a left thumb that we need
    in the future? You know, but can we still create a bootable USB stick for live
    media? Especially when not computer has a drive to.


    UNeboot is the perfect choice of software to do this and works across all platforms.
    It writes ISOs to a USB stick and handles preset if you have it. It can also create
    a bit of re-usable storage to Ubuntu-based distributions.


