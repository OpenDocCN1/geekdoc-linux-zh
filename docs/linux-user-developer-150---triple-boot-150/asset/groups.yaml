    ### 01 Find the roots

    The first step is to install the appropriate setup tools. While it''s supported
    in the kernel, not every distro holds the hard drives you packages to manage by.
    In Debian and Ubuntu, it is


    ### 04 Create a RAID

    One of the best uses for btrfs, due to how it stores data, is using a similar
    technique to put a pair of hard drives in RAID 0. For now, do it in the terminal
    with:


    ```

    $ sudo apt-get install btrfs-tools

    ```


    ### 02 Format partition

    Now the tools are installed, set up your btrfs partition if you want to. Launch
    and navigate to the device to format it. You can reform existing partitions or
    create a smaller btrfs partition installed


    ```

    $ mkfs.btrfs /dev/sdb

    ```


    ### 03 Go into the terminal

    You can also do this in a terminal without. Open it up and use fdisk -l if you
    need to figure out the names of partitions and hard drives on your system. Once
    that''s done create your btrfs partition with:


    ### 05 Grab your file system details

    In case you''ve forgotten, you can always check the btrfs partitions and hard
    drives. This also works with hard drives in an array, which is why we recommend
    RAID in the previous step, in a terminal with:


    ```

    $ mkfs.btrfs /dev/sda

    ```


    ### 06 Format the file system

    With most modern systems you can easily mount a file system with a single click.
    To do it manually and place it within a section of your file system you can do
    it simply in the terminal with something:


    ### 08 Create a partition

    We create btrfs drives, small subvolumes, but you can also create btrfs partitions
    using a similar method as before. Convert a partition into btrfs by doing something
    like:


    ```

    $ mkfs.btrfs /dev/sdb

    ```


    ```

    $ -t btrfs /dev/sdb -root

    ```


    ```

    $ mkfs.btrfs single /dev/sdb

    ```


    ### 07 Make a subvolume

    You can create subvolumes within btrfs that can have different mount options and
    mount points, and only use spaces when you need it. Create in the terminal with:


    ### 09 Give permission

    The way drives, partitions, and subvolumes have been created means you need to
    access them with root account to use them. Give them normal permissions with the:


    > If you''re doing a hardware RAID, having the metadata redundant may be useful


    `sudo chmod 777 btrfs/`


