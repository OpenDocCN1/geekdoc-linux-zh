    \   self.title = pygame.font.Font(None, 100)\n        self.font = pygame.font.Font(None,\
    \ 30)\n        self.w = None # 天气文本\n```\n\n- 14 下载\n语音合成需要一个二进制文件。你可以通过完成以下操作获取两者：\n\
    \n```bash\nmkdir -p /usr/share/espeak\nwget http://www.tcape.com/en/9800.zip\n\
    sudo tar xf 9800.zip\n```\n\n```python\ndef background(self):\n    background\
    \ = pygame.Surface(self.screen.get_size())\n    background.fill(color)\n```\n\n\
    - 15 创建语音\n语音需要一个二进制文件。你可以通过完成以下操作获取两者：\n\n```bash\nmkdir -p /usr/share/espeak\n\
    wget http://www.tcape.com/en/9800.zip\nsudo tar xf 9800.zip\n```\n\n```python\n\
    def background(self):\n    background = pygame.Surface(self.screen.get_size())\n\
    \    background.fill(color)\n```\n\n- 16 配置 Navit\n语音需要一个二进制文件。你可以通过完成以下操作获取两者：\n\
    \n```bash\nmkdir -p /usr/share/espeak\nwget http://www.tcape.com/en/9800.zip\n\
    sudo tar xf 9800.zip\n```\n\n- 17 安装音乐播放器\nMPD 是需要安装的音乐播放器后端和前端。在树莓派上，你现在更改库的所有权。按\
    \ U：\n\n```bash\nsudo apt-get install mpc\n```\n\n- 18 复制音乐\n这里使用了 scp（安全复制协议）来复制音乐。首先运行\
    \ addr 获取树莓派的 IP 地址。\n\n```bash\nscp -R mpd root@ip_address:/var/mpd/\n```\n\n\
    - 19 安装 mpd 音乐\nNMPC 是音乐的命令行客户端。输入 nmpc 并按 U 更新库。按 3 退出音乐界面，按 1\n\n- 20 安装 awesome\
    \ 窗口管理器\n现在你需要为 CarPi 编写自己的自己的启动器，它将全屏运行。确保每个应用程序都是全屏的，使用全屏 awesome 窗口管理器。\n\n\
    ```bash\nsudo apt-get install awesome\n```\n\n```bash\nsudo rm /etc/alternatives/x-session-manager\n\
    sudo ln -s /usr/bin/awesome /etc/alternatives/x-session-manager\n```\n\n"
