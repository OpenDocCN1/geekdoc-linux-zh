    # 评测


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_81_0.png)


    # Mini PC


    ## MinnowBoard Max


    它是 Intel 原 MinnowBoard 的续作，但 Max 能竞争过基于 ARM 的对手吗？


    Intel 将其产品推向嵌入式领域并不是秘密。他们今年在拉斯维加斯消费电子展（CES）上的公司演讲集中在努力将芯片设计从智能手机转向物联网（IoT）传感器网络。MinnowBoard
    是其中很大一部分。


    尽管 Intel 使用了符合 Yocto 标准的板支持包 (BSP)，但兼容性仍然糟糕。结合其单核 32 位处理器的较差性能，很难说 MinnowBoard
    不是一个完全的成功。


    原始 MinnowBoard 于 2013 年发布，作为一个四核 32 位 ARM-Cortex-A9 板，是一个开源硬件开发平台，为从工程师到寻找新玩具的爱好者的所有人设计。


    然而，当我们有足够的资金投资这些项目时，成功……失败是容易学习和借鉴的。MinnowBoard Max 在开发和生产上是成功的，这毫无疑问。除了小得多之外，快速查看规格显示
    Intel 和其合作伙伴一直在倾听用户的反馈。


    然而，MinnowBoard 的采用非常缓慢。使用 32 位 UEFI 固件意味着操作系统……


    最大的变化是从 32 位处理器转变为更现代的 64 位芯片，并配有重写的 64 位 UEFI 固件。在提升性能的同时，这为 MinnowBoard Max
    提供了软件兼容性


    | 操作系统 | |

    |---|

    | Debian (Android 4.4 等其他) | |

    | 处理器 | 双核 1GHz 64 位 Intel |

    | 图形 | Intel HD Graphics |

    | 内存 | 2GB DDR3 (最大 8GB) |

    | 尺寸 | 74mm x 104mm |

    | 存储 | 1x Micro-SD (支持 SDIO), 1x SATA2 |

    | 连接 | 1x HDMI, 1x 千兆以网, 3x UART, 26 脚 GPIO，支持 PWM, GC, SPI |

    | 价格 | €178.00 (£133) |


