    # # My Pi Project


    # # Robot Thomas gets grips with natural motion control for Raspberry Pi-powered
    robot arm


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_60_0.png)


    # ### What inspired you to begin your robot arm project?


    The robot arm was one I''d dreamed of for years because I wanted something that
    I could control—it truly captured my imagination. I was volunteering at a science
    museum when the Raspberry Pi sprang up, and I built the robot arm I wanted. So
    at the same time I thought, why not merge them?


    I had a complicated problem to get it to do anything, which was a bit tough, then
    I found one of the people who works with the Arduino who used an accelerometer
    on the top of it to give an idea of what it is. Then I thought, ''What if I used
    the accelerometer on me to move it?'' I looked, searched, and then upgraded the
    robot arm with the Raspberry Pi. It was originally £54—now it''s really about
    £30 from Raspberry Pi but on a start. It. was. But it was open source, so I was
    able to find it, so fine, and then I wrote two programs that could control the
    robot arm and the accelerometer and just smoothed them together. It''s not easy
    to do it, but it works now and it''s really amazing.


    # ### So exactly were you going to use the MPU-6050?


    There was the gyroscope and the accelerometer I found online, which I connected
    with the Arduino. The gyroscope is very good for detecting over time and it tends
    to drift, while the accelerometer is good for turning. So I compared the two to
    each other and then I could get an accurate range of all the time, so I used them
    together to correct the faults with one or the other. It''s got two axes of motion—pitch
    and roll.


    # ### How did you use the code?


    In the first bit I found where the actual I2C interface is and there''s a quick
    setup for the gyroscope and the lights, so I used them and then there was a different
    setting for setting up Pi I used the USB library to find the robot arm.


    There are a couple of functions to actually move the arm, so it''s a little tricky
    because it''s a different number—and then there are more settings for setting
    up reading data from the accelerometer and the accelerometer are both giving the
    correct angle. Then there was a bit of math, which I had to do for the accelerometer,
    data, putting if the angle is within a certain range. If it''s out, then a button
    is pressed then the arm moves left or right. The only problem I''ve had with it
    is that it is jerky. I have to have a way to move it left, but then there''s another
    angle and if I trip it right.


    # ### Have you considered any ideas about making more forms of control?


    Yeah, I''ve done a lot of research into this, in terms of other ways to control
    it. I like the idea of using my voice to control it, or moving it with my own
    body, so that''s what I''ve been thinking about, and trying to get even more out
    of it.


    user, but that''s a very large plan which I haven''t put too much into it yet!
    But essentially, the prototype that people have done lately—a sort of making paper
    projects with potentiometers—on the fingers to make the actual motion and control
    of the gyroscope and then drift. Besides, making a sort of string to sort out
    of the sensors. You would have to set the arm close, and then pull which would
    close the right finger in turn.


    Another, which seems to be one of the great things about it, is having it control.
    There''s a fair amount of interest in racing arm-work and I might be using my
    arm because it is easy if you can have more than two fingers, and if you go open
    source then the risk is not as much of a project to do.


    # ### What is the next step?


    Future projects would be: because it''s motor-driven, it''s quite soft, so maybe
    with something inside to make it move better. It moves a lot, so maybe more precision
    and then I''d like to find out how to get it to move exactly where I want it to
    move.


    So that probably would be a new arm, so a new robot, trying to get it a bit more
    control and looking more.


    # ## Another idea, which seems to be one of the most viable, is having it completely
    brain controlled


    > Joseph Thomas is a student who joined the Pi club from Museum in Harlow, has
    worked on projects related to the Raspberry Pi and built a Raspberry Pi robot
    arm. I''d like to see it again.


    The arm that I built is mainly in the UK (by me/DIY). There are some websites
    where you can go online to get such help as this: #1BA16Q.


    Future projects: Neuroky is a family dedicated to developing biosensors for Popular
    Mind Wave headsets (neuroky). They have a few projects they are working on now.


    Opensource project dedicated to computer interfaces


