    ## MythTV 故障


    我的 mythtv-end 在上次更新后出现了一些问题。后端似乎在正常工作，但 fc20 前端无法处理任何视频（无论是 mythtv-end 还是录制的内容）。


    起初我以为是 fc20 的问题，但后来我遇到了相同的问题。在我的其他电脑上前端没有问题。我检查了驱动器和内存，然后似乎通知了 fc20 但仍然如此。所以，我非常确定是程序本身的问题，但问题一直存在。


    任何输入都将不胜感激。如果不是整个系统宕机，这可能是许多问题之一。首先，我可以尝试远程查看是整个系统还是部分问题。之后我可以检查设备，特别是显卡驱动程序。也许我使用的驱动程序需要确保硬盘正常。如果是由于硬盘问题，系统可能会在运行缓冲视频时挂起。


