    Aims for monthly media releases


    The CentOS Project has announced the availability of rolling builds of its distribution,
    designed to offer a rolling-update process to users who want it. CentOS Linux
    builds are point-time snapshot media, rebuilt from original release to include
    latest updates from centos.org''s repositories, explained project lead from this
    media will have all of these updates pre-included and will look no different when
    compared with machines installed with older media that have been yum-updated to
    the same point in time.


    the builds at the end of each month, with a few days being behind the release
    for testing. Singh has also indicated that several builds will be made following
    the discovery and patching of critical vulnerabilities, such as Shellshock exploits.


    CentOS Karin Wade has distanced the builds from others'' typical nightly builds,
    thanks to their additional testing. The progress made, will be in many images,
    such as CentOS Linux 7, and possibly future releases coming from project special
    interest groups (SIGs), he added in the launch announcement.


