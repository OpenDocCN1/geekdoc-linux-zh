    The new Zumwalt Class Destroyer is a state-of-the-art stealth ship


    ## KERNEL


    ## US Navy picks Linux for Shipboard Environment


    The US Navy has released its latest project, the DDG-1000 Zumwalt, and the Total
    Shipboard Environment (TSCE) on Linux. One of the first to benefit from this change
    has been confirmed by the Navy, while the Navy previously used Solaris-based control
    stations in the early 2000s.


    Featuring millions lines of code, the Navy''s TSCE has been built to its specifications
    by defence contractor Raytheon and runs from 16 blades. This flexibility is the
    opposite of what was experienced by the Royal Navy in the early 2000s, when contractor
    BAE Systems standardised all its future development in proprietary Windows platform.


    ## OPEN SOURCE


    ## LibreOffice 4.4 overhauled


    “The most beautiful LibreOffice ever,”


    The Document Foundation has finally released LibreOffice 4.4 with considerable
    attention to improving user experience.


    “LibreOffice 4.4 is the next in a series of releases that not only features the
    features but also the foundation of the Free Office software suite,” boasts TDF’s
    Michael Meeks, while admitting that it “is, of course, not perfect.” The new release
    has redesigned menus, context, toolbars, status bars and rulers to make them much
    more useful. The SF icon theme extended and now the release is on OS X. We also
    developed a new Color Selector,,


    ## Gnome releases public app demos


    Having worked on application sandboxing internally, the Gnome Project has released
    the first implementation.


    improved the Sidebar to integrate smoothly with menus, and reworked many user
    interface details to follow TDF’s needs. We added support for PDF export, default
    new templates, buttons to start files from a Microsoft environment, and made much
    cleaner code, other improvements.


    “We have been putting together implementation of these ideas,” explained Alexander
    Mathias of the project’s lead, Alexander Larson, making progress, and we are now
    at the point where it is easier for other people to start playing with it.


    Claus claims that sandboxing will make it easier for third parties to create and
    give applications for multiple distributions, plus run them securely and make
    it easier to develop for Linux.


