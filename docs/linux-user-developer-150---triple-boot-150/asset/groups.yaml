    # Hiding hardware


    Putting your hardware out of sight is a good option for security, but as small
    as the Raspberry Pi and an SD card you can use


    For instance, using Velcro or some adhesives allows you to attach the back of
    a laptop or SD card to keyboards or under a car seat, etc.


