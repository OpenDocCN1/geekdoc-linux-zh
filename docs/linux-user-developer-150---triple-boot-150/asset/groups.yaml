    \n## 01 获取并加载 Pentoo\n\n从该发行版的网站获取 ISO 并将其写入光盘或 USB 闪盘。重启进入该发行版并登录。如果你使用英语类型键盘，按\
    \ F40 使用 Queen 变体。在提示符处使用 **start** 启动桌面环境。\n\n## 02 探索\n\n所有工具和编辑包都保留在菜单的主部分。Pentoo\
