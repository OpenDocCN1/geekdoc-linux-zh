    # Feature


    # TRIPLE BOOT THINK


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_15_0.png)


    Dual booting is a staple of being a Linux user today. Classically, a lot of people
    think of this as Linux and Windows coexist together on one machine. There are
    people who use two Linux distros and there are many reasons why this could be
    the case - testing on systems, for one and for work, is just one example of why
    this can be useful.


    We can easily take a step beyond that. It''s doable (storage partition) to have
    three operating systems at once. Whether you have two Linux distros and Windows
    install or simply three Linux distros, the concept is quite simple dual booting
    and a natural extension of the craft.


    Over the course of this feature, we will teach you how to perfectly partition
    your system, from a fresh hard to a pre-existing install, as well as a few tips
    on the best methods of installing the systems to get them to work together.


    # Two operating systems are so last year - here''s how to start using three of
    them to maximise your productivity


    # Why go for triple boot?


    As we noted above, there are many reasons why you would want to boot dual and
    triple boot, and they depend entirely on how you use your computer and how often
    you need to use different environments for different tasks.


    One reason is Windows - however we feel about it, many of us need it in our daylives.
    It could be something as simple as enjoying playing new games, which aren''t always
    supported on Linux, or it could be the case that you are a designer who needs
    to use the industry standard: Photoshop or InDesign. You can even install OS X
    for a Hackintosh build if that''s more to your taste.


    A key reason to extend a dual boot setup is to preserve your main drive - the
    one containing the bulk, if not all, of your personal data and media. There are
    numerous reasons you may want different distro on a regular basis, and sometimes
    booting or virtualising just doesn''t cut it - it is possible to have a third
    partition which you could have a third partition you temporarily need to use.
    Non-Linux OS aside, it could be something like wanting to have for example, a
    Linux distro starting alongside your main Debian, with a third slot for distro-hopping,
    it is really down to you!


