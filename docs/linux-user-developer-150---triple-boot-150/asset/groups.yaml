    # # Get network information using lsof


    Troubleshoot your network by identifying its problems


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_26_0.png)


    # ## 01 lsof


    When you are doubt which command line option to use, the first choice is lsof.
    If you want to save the page of lsof to a separate file, you can convert it into
    Postscript by executing the command with the following:


    ```

    $ lsof -i lsof

    ```


    # ## 02 What if we have a network problem


    When you are working, many problems may come up such as: is there a problem with
    the local network or the server? If you are unsure whether it is hardware or software
    issue is the Internet connection?


    Utils like lsof can help you to find the source of problems and find the correct
    root of the problem.


    # ## 03 Which program listens to a port?


    The -t option lists to only display related information. Therefore, the following
    commands show all network info:


    ```

    # lsof -i

    ```


    The first question you will easily answer is which server program queries a TCP
    port on your Linux machine. To find out which a TCP specific port, run the following:


    ```

    $ lsof -iP -t tcp:LISTEN

    ```


    Other possible states of a TCP connection are CLOSED, SYN-SENT, ESTABLISHED, CLOSE-WAIT,
    LAST-ACK, WAIT-1, WAIT-2, CLOSING and TIME-WAIT.


    # ## 05 User ID to login names


    If converting ID to user name is working properly, you can disable it using -n
    parameter. This option can be combined with a range of other options for providing
    additional speed to the output.


    # ## 04 The repeat mode


    Running lsof with the -r option puts in repeat mode which runs every seconds.
    The -r option will automatically update lsof when a connection is opened or closed.


    When lsof is in repeat mode, it prints every output (a second) - the default value
    is 5 seconds. You can change the value by setting an integer after -r or


    # ## 06 Find all SSH connections


    The following command will list all SSH connections to the local machine:


    ```

    # lsof | grep ssh | grep EST

    ```


    The following different version will present exactly the same information:


    ```

    # lsof -i | grep ssh | grep EST

    ```


    # ## 07 Which processes are accessing a file?


    You can find the processes that are accessing /var/run/mysqld.sock by running
    the following:


    ```

    # lsof /var/run/mysqld.sock

    ```


    If you are interested in the ID of the processes accessing a file, use the -t
    option:


    ```

    # lsof -t /var/run/mysqld.sock

    ```


    The process ID can be used for killing a process.


