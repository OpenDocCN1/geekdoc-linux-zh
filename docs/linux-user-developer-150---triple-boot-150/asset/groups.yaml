    ## Welcome to issue 150 of Linux User & Developer

    Get Linux User cheaper every issue

    Page 50


    ### This issue:

    - >> To release the latest Christopher Nolan film, Interstellar (HD, Blu-ray™
    and DVD), Synology is giving you the chance to win great prizes so join us at
    The Gadget Show Live (8-12 in April) or visit our facebook page!

    - >> Triple PC''s potential

    - >> Build an open source satnav

    - >> Start using the btrfs file system

    - >> Troubleshoot your home network


    Bob Zetsloot to aerospace engineering, using Python to model complex simulations.
    Again this month, and demanded an upgrade. Regret turned back to his last project:
    a success (p.2), multiprocessing (p.16) for the subsystem L&D Flying Fortress.


    Jon Masters is a Linux kernel hacker who has been working with Linux for over
    19 years, since he first attended university at MIT in Cambridge, Massachusetts,
    and works for the enterprise Linux vendor. You can find him at us this month.


    Joey Bernard is a true renaissance man, who splits his time between writing articles,
    helping researchers with scientific computing and writing. In his brilliant column
    (p.72) he takes us through the first part of a three-part guide to configure a
    Raspberry Pi assistant.


    Welcome to the latest issue of Linux User, the UK and America''s favourite Linux
    and open source magazine. We''ve packed a lot into these for this month, covering
    a real range of useful software and techniques. First we show how to install three
    different distros on any computer—including Windows—it''s necessary for many of
    us from time to time (but we often with a blow with a sneak at the upcoming new
    version) and then through some guides to partitioning, maintenance and GRUB styling.
    Turn to page 16 to get started.


    Mihalis Toukalos is a Linux systems administrator with expertise in databases
    and mathematics. He has used Linux since 1993. Mihalis shows us how to discover
    network performance information in this issue (p.26), and how to create easy using
    LaTeX.


    Elsewhere this month, we''re penetration testing with Pencil, migrating to the
    btrfs file system, building a YouTube and more. And we return to our QR series,
    and round up the very best players for Linux in this month''s group.


    On the Raspberry Pi side of things we''re talking about, Gavin shows us SainSmart''s
    brilliant 9-inch touchscreen and Adafruit''s GPS kit to get in motion with an
    open source setup, with a complete miss and local weather functionality as well
    as Navit maps. Have fun!

    Gavin Thomas, Deputy Editor


    Christopher Armstrong is a software engineer and support de-10 who has written
    for Linux and smartphones both online and in magazines. In another four-page guide,
    this shows you how to physically and debug a Raspberry Pi from him just.


    Gareth Hallace is our resident reporter and brings us the latest developments
    from all over the open source world, starting on page 10. This month, Gareth tests
    out new Mint distro to find out how to max out against its predecessor, and its
    ARM-based rival rivals.


