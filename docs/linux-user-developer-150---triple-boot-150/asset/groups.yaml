    # Tutorial


    Here, you can add new files or create a collection of media files. Files can be
    assigned to collections at any point of time


    Update account settings here and track media files using the Media processing
    panel, which shows details about uploads


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_33_0.png)


    All creative commons licences are available here to assign under an available
    media file


    This section lets you upload a media file and update the relevant information
    regarding that file


    # Host your own media gallery with MediaGoblin


    MediaGoblin provides a way to share videos, photos or audio recordings with your
    loved ones, without worrying about privacy


    # Advisor


    Nitish Tiwari is a software developer by profession and an open source enthusiast
    by heart. As well as writing for open source magazine platform setting time and
    use open source software for their business needs


    YouTube is not only a website anymore, it''s a phenomenon. Millions of hours are
    spent - wasted in watching videos of cats, dogs and humans doing strange things.
    With the predictive playlist appearing just after you decide to close the window
    and you go on, watching one video after the other. But YouTube is also a video
    platform for private videos and other media that you don''t want strangers to
    access. Though it has an option to make your videos private, you don''t really
    know how private it is. So we need to find a solution that has the perfect match
    of convenience and privacy.


    This is where MediaGoblin comes in. This open source tool can help you organize,
    host and stream media from your PC without having to worry about privacy. If you
    are a power user, you can also host it on a web server for other people to add.
    A range of other features available too, like tags and collections to name just
    two. It is easy to install MediaGoblin on Ubuntu and then proceed to get it working
    and see it in action. We used Ubuntu 14.04 as the host system and MediaGoblin''s
    clone from their Gitorious repo.


    # Resources


    MediaGoblin home page


    mediagoblin.org


