    # # VNC issues


    Sometimes I need to do work in the terminal on my system. However, when I try
    and open the terminal emulator, it opens freely and then automatically closes.

    The system in question is CentOS, which I have to access remotely via VNC using
    VPE as a desktop environment tool. It works fine if I''m logged in root, so I
    can only assume it''s a problem with the user type. I don''t want to make some
    of the normal users have full root privileges and I''d rather not in every time.
    Have you heard of anything like this before?


    Thomas Reid


    Try this, open the terminal logged in as root, then change to another user with:


    ```

    $ su - l <user>

    ```


    This enables you to open another shell to log in with then try open the terminal.
    Any errors will show up in the root terminal. It''s likely that you can''t load
    into the shell because the user won''t have access to connect to the X Server,
    as you''re using it via VNC. To solve this, add the relevant users to the list
    of those allowed to make this connection. For xhost, type:


    ```

    # xhost local:<user>

    ```


    ...as root. Give the system a reboot and it should be working fine.


