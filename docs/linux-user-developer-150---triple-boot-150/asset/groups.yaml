    # 音乐播放器


    寻找播放和管理音乐的最佳软件


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_0.png)


    # CMus


    倾向于在终端内完成一切？给 CMus 一些时间吧


    # GMusicBrowser


    GMusicBrowser 虽然外表简单，但功能远超你的


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_1.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_2.png)


    - 每一个键都是快捷键，还有许多其他未绑定的命令

    - 程序中的几乎每个功能都可以配置热键


    # 播放


    CMus 使用 Vi 风格的搜索和命令模式——你只需要记住它们即可；它非常有效，命令响应即时，并能让你建立内存管理能力。它还有一些不错的选项，比如启动时恢复播放和映射随机播放键。


    播放顺序、列表和队列菜单的随机功能非常多。播放顺序允许你根据标准选择小组件进行选择，而队列可以设置为在完成或关闭时自动填充。几乎所有内容都可以设置自定义键和快捷键。


    # 界面


    作为一个命令行界面，1-7 键显示七种视图。花一点点时间熟悉默认设置或映射你的命令，你很快就能拥有极速运行的环境。CMus 也是完全可脚本的，你还可以通过其他应用程序使用命令来钩入它。


    标准面板视图虽然没有 Tomahawk 那么强大，但更可定制、更灵活。面板可以设置为详细视图，以显示你的队列、播放列表或专辑。A 快捷键可以调出歌词和专辑封面，而且有几十首歌曲——还有额外的“音乐”喜欢选项，例如
    [RhythmBox]。


    # 管理


    除了命令的即时响应外，你的库每次都会即时加载。你可以使用元数据但不能编辑，这可能是一个优势，因为某些播放器会搞乱你的元数据。搜索功能强大，可以使用存储在会话之间的过滤器。


    可自定义的列表、强大的搜索/过滤选项（无限嵌套）以及编辑曲目元数据的能力使其成为海量库的绝佳工具。编辑数据时，你可以让 GMusic 通过名称监控曲目和文件。


    # 在线


    支持 SHOUTcast 和本地流媒体，并提供了脚本来启用 Last.fm/lib.fm.by。虽然在在线服务方面并无比拟，但通过脚本，你可以构建自己的工具或找到他人制作的内容。


    GMusic 在这方面受到局限。评估在线服务并不是 GMusic 的重点，因为它专注于你的本地收藏，所以你在这里能做的就是有一个用于 Last.fm 扫频（scrob）的插件。但正如所说，它会自动抓取歌词和专辑封面，提供的功能足够支持本地使用。


    # 总结


    这款音乐播放器对速度和便利的关注使其非常适合坚持使用 CLI（命令行）的人。它在在线服务方面表现不佳，因此你可能倾向于使用更简单的程序来决定听什么。


    # 总结


    强大且可配置，GMusic 在几个关键点上脱颖而出。这种功能全备的软件允许在线服务，所以如果你不在乎这些，绝对值得去调整 GMusic 以符合你的喜好。


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_3.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_4.png)


    79.linuxux.co.uk


    # 评测 音乐播放器


    ## 简评：对比我们的结论


    | | Nightingale | Tomahawk | CMus | GMusicBrowser |

    |---|---|---|---|---|

    | 播放 | 基础，没有快捷键或选项 | 5 | 基础——没有快捷键或选项，但菜单良好 | 6 | 快速且完全控制，带有命令 | 8 | 丰富的选项和快捷键覆盖一切
    | 9 |

    | 界面 | 设计良好，外观不错。好用 | 8 | 清洁、现代且有吸引力。它会成长 | 5 | 简单，但这是它的优势。高度可配置 | 7 | 非常实用，可定制并有一系列皮肤
    | 7 |

    | 管理 | 可以编辑媒体并生成播放列表 | 6 | 基础，不适合管理大型库 | 5 | 强大的过滤器但需要编辑选项 | 8 | 批量编辑工具 | 8 |

    | 在线 | 艺术、歌词和简介智能集成以方便收听 | 7 | 极佳。可以同时搜索所有喜爱的流 | 7 | 在线服务有限，但支持自定义脚本 | 4 | 限于
    Last.fm 而不是 GMB | 3 |

    | 总结 | 非常平衡。日常收听的好选择 | 6 | 设计优秀，完美适合社交听众 | 5 | 专注于速度和控制，CLI 爱好者的最佳选择 | 7 | 强大，但缺乏在线服务
    | 7 |

    | **胜出者是……** | | | | |


    尽管在本地库方面表现不佳，Tomahawk 在这个小组中脱颖而出。虽然 Nightingale 在所有类别中得分都很均衡，GMusicBrowser 尽管表现平平且外观陈旧，我们发现更青睐
    Tomahawk。CMus 是一个不错的发现，但看起来是另一个季节性的竞争对手之一。


    虽然你无法像其他程序那样真正调整和完善所有存储的文件，但 Tomahawk 的点在于它接受了如今消费和分享音乐的方式。通过与 Google Play 等程序配对，你可以添加更多来源。增加来源使得你可以在任何地方找到热门事物，完整的艺术家列表和精美的新电台可以立即安装。自定义电台是这里的亮点，显示了寻找符合任何标准的歌曲的最智能播放列表。虽然它缺乏一些灵活性和社区方面，但在线功能绝对到位。Tomahawk
    非常易用，尤其是当你不确定想听什么时。这个选择的缺点是缺乏更复杂的选项，甚至是基本的配置性，但幸运的是，团队在简单性和功能性之间取得了正确的平衡。


    Gavin Thomas


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_79_1.png)


