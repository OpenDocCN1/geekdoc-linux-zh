    # Music players


    Finding the best software for playing and managing music


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_0.png)


    # CMus


    Prefer to keep everything inside the terminal? Give CMus your time


    # GMusicBrowser


    GMusicBrowser is deceptively powerful despite its simple appearance


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_1.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_2.png)


    - Every key is a shortcut and there are plenty of other unbound commands

    - Hot keys can be configured for almost every feature inside the program


    # Playback


    CMus uses Vi-style search and command modes — you just need to remember them all;
    it works, commands responding instantly and enabling you to build up memory management.
    There are some nice options like resuming playback on boot and mapping a shuffle-key.


    Player order shuffles list and queue menus are numerous. Player order lets you
    selected widgets that the selection to a criteria, while the queue can be set
    to auto-fill as it finishes or shuts on completion. Custom keys and shortcuts
    can be set for pretty everything.


    # Interface


    As a command line interface the 1-7 keys displaying the seven views. Spend a little
    time getting to know the defaults or mapping your commands and you''ll have blazing
    speed in no time environment. CMus is fully scriptable too, and you can also use
    commands to hook into it via other applications.


    The standard-pane view isn''t quite as powerful as Tomahawk, but customizable
    and more flexible. The pane can be set from a detailed view to show your queue,
    playlist or album. A-shortcut pulls in lyrics and album art, and there are dozens
    of songs — extra ''Music'' to like [e.g., RhythmBox] option.


    # Management


    As well as instant response from commands, your library loads instantly every
    time. You can use metadata but not edit, this may be an advantage as some players
    can mess your metadata. Searches are powerful and you can use Filters that are
    stored between sessions.


    Customisable lists, powerful search/filter options (unlimited nesting) and the
    ability to edit the metadata for tracks makes this a great tool for huge libraries.
    Editing data, you can get GMusic to oversee track tracks and files by name.


    # Online


    SHOUTcast and local streaming is supported, and scripts are available to be enabling
    to Last.fm/lib.fm.by. While there''s nothing like in terms of online services,
    because of scripts you can build your own tools or find what others have made.


    GMusic is limited in this regard. Assessing online services isn''t really the
    point of GMusic as it focuses on your local collection, so all you can do is there
    is a plugin for Last.fm scrob. As said though, it pulls in lyrics and album automatically
    and there''s enough to support locals.


    # Overall


    The focus on speed and convenience with the music player make it great for those
    wanting to stick to the CLI. It falls down on online services, so you may prefer
    to use a simpler program deciding what to listen to.


    # Overall


    Powerful and configurable, GMusic finds itself in a couple of key. The fully-featured
    software allows online services though, so if you don''t care about then it''s
    definitely worth tweaking GMusic to your liking.


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_3.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_78_4.png)


    79.linuxux.co.uk


    # Review Music players


    ## In brief: Compare and contrast our verdicts


    | | Nightingale | Tomahawk | CMus | GMusicBrowser |

    |---|---|---|---|---|---|

    | Playback | Basic with no shortcuts or options to speak of | 5 | Basic – no shortcuts
    or options, but good contextual menu | 6 | Fast and complete control with a simple
    command | 8 | Fantastic range of options and shortcuts to cover everything | 9
    |

    | Interface | Well-designed and good-looking. Nice to use | 8 | Clean, modern
    and appealing. It will grow on you | 5 | Simple, but that is its strength. Highly
    configurable | 7 | Highly useful, customisable and has a range of skins | 7 |

    | Management | Can edit media and generate playlists | 6 | Basic, so not suited
    to managing large libraries | 5 | Great filters but need edit option | 8 | Tools
    speed up batch editing | 8 |

    | Online | Art, lyrics and bios are smartly integrated to aid easy listening |
    7 | Superb. Can search all favourite streams at the same time | 7 | Limited services,
    although custom scripts are supported | 4 | Limited to Last.fm and not of GMB
    | 3 |

    | Overall | Very balanced. A good choice for everyday listening | 6 | Great design
    and perfect for social listeners | 5 | Focused on speed and control, it''s the
    best for CLI pros | 7 | Powerful, comfortable but lacks online services | 7 |


    ## AND THE WINNER IS… Tomahawk


    Despite the fact that it performs poorly in terms of local library, Tomahawk grew
    on throughout this group. While Nightingale was the most balanced application
    here scoring well across all categories, and GMusicBrowser despite its modest
    brilliance and dated appearance we find ourselves appreciating Tomahawk more than
    used. CMus was a helpful find but outclassed appearing as one of the most seasonal
    rivals.


    While you can''t really tweak and polish away all your stored files the same way
    you can with other programs, the point of Tomahawk is that it embraces the way
    music is often consumed and shared today. By pairing it with programs like Google
    Play you can add more sources to the mix. Add a bunch of sources and you can find
    trendy stuff anywhere in the world with a full list of ingenious artists and gorgeous
    new radio stations can be really friendly installed instantly in place. The custom
    radio stations are a highlight here showing through all your sources to find songs
    that fit any criteria as the smartest playlists could ever. While it lacks some
    flexibility and not to really sell the community aspect it is definitely in place
    with features like to please your friends and sharing options. Aside from the
    online line of things the chooser was the problem of design and structure. Tomahawk
    lovely easy to use especially if you''re not sure what you''re in the mood to
    listen and fancy away. The downside of this choice is the lack of more complex
    options and even basic configurability unfortunately in this case the team has
    struck the right balance between simplicity and functionality.


    Gavin Thomas


