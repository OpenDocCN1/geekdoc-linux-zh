    # MinnowBoard Max


    Below: The 60-pin Luxe header anticipates the success of Intel''s add-on boards


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_0.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_1.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_2.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_3.png)


    > The biggest change is a shift from a 32-bit processor to a 64-bit chip


    ## Pros


    An improvement on the original MinnowBoard, there''s plenty to recommend the Max
    variant for x86 development.


    ## Cons


    Its price is high compared to rival ARM-based boards, while the Luxe concept has
    yet to gain traction with third-party manufacturers of which its predecessor could
    only dreamed; theoretically, any operating system that can boot on a general-purpose
    x86 PC can boot on the MinnowBoard Max with ease. Intel has made much of its effort
    to support Windows 8 and more interest to its target market support for Linux
    distributions from Debian and Red Hat. As a development board, it''s nice to find
    that MinnowBoard Max has a number of features lacking from general-purpose PCs
    like Intel''s Next Unit features, which offer significantly higher specifications
    at a lower price. The new processor, Intel''s Atom E3850 system on chip (SoC),
    has improved performance, boosted clock speed to 1.3GHz and improved thermal efficiency,
    An inexpensive cost variant featuring a single-core Atom and 2GB of RAM is planned
    to launch in the near future but was not available at the time of writing. The
    biggest feature, however, is the MinnowBoard''s Luxe header. Properly known as
    the High-Speed Extension Connector and located on the underside of the board,
    it provides 26 GPIO headers that make it easy to add pulse width modulation (PWM)
    control of eight user-accessible pins for control of servos, motors. A quick benchmark
    compared the new Atom processor to its predecessor; running a dual-core test on
    SysBench showed a percentile difference of 95% – far faster than the original
    – and the Max boasts a second core to help it further away from the original along
    with PCIe, I2C, and more. Adoption of the standard has been slow, but add-ons
    are beginning to appear with respect to Arduino compatibility for future expansion.


    The MinnowBoard Max is an undeniable improvement on the original, with its software
    compatibility and price offers flexibility, but for those who don''t need open
    hardware it is beaten in value by Intel''s open-purpose PC (NUC) machines, while
    its ARM-based rivals rival it with the MinnowBoard''s initial price.


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_82_4.png)


    83 | www.linux.co.uk


    ## Review


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_83_0.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_83_1.png)


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_83_2.png)


    ## MINI PC


    ### OpenPi


    The base for Raspberry Pi-powered hardware utilises the compute module. The OpenPi
    on first looks like a device - a nondcript black box with an HDMI and a USB slot.
    There''s no real indication of what it might be, however, opening it reveals a
    custom board connected to a Raspberry Pi compute module, inside standards allow
    you to connect a mini-keyboard/mouse combo. It seems simple to be fair in this
    - it''s just basically a fully-powered Raspberry Pi.


    Actually the point of it is that with the compute module and the OpenPi, you have
    full access to the usual Raspberry Pi power and settings. The selling point of
    the OpenPi is that you can control - which is completely open hardware - and modify
    the plans yourself to make a custom board that fits your needs. It''s an easier
    way to create an Internet of Things and they''ve succeeded in creating the platform
    to do this.


    As we''ve hinted, using it as a normal Raspberry Pi works; it''s fully functional
    and you can easily access it via SSH to the included Wi-Fi adapter and installed
    software. This makes it great off the bat as a Wi-Fi router or file server. It
    comes with standard Raspberry OS that can be easily updated and upgraded as you
    go keep up with the latest and greatest software. While there are limited ways
    to hack it, the open hardware aspect means the entire PCBs are for modification
    and when you make custom cases for it as well. It''s also more expensive than
    the Pi itself and aimed at a different user base. Is it for makers? To a degree,
    the PCBs don''t offer much extra to begin with. It''s excellent inspiration and
    a good start for makers, but it''s more towards the business and start-market
    for creating systems in offices that can benefit from an Internet of Things.


    | Feature | Details |

    | :--- | :--- |

    | Operating System | Raspbian |

    | Processor | BCM2835, ARMv6 700 MHz |

    | Memory | 1GB |

    | Dimensions | 104mm x 79mm x 33mm |

    | PCB | Wireless Things OpenPi hardware |

    | Price | £335 |


    > Summary: A box with a huge amount of potential thanks to its small size and
    a tiny Compute Module that lets you perform any project. It''s not something with
    no limits other than your imagination. It''s for a generic technical market though
    technical folks need not apply.


