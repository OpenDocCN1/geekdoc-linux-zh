    Zumwalt Destroyer, of which the Navy is using the TSCE. Recent announcements made
    by the Navy have concentrated on this ship, including the use of an innovative
    ''tumblehull'' design and one that of a ship has half itself, new releases showcase
    the benefits of Linux as part of its multi-level Mission Control.

