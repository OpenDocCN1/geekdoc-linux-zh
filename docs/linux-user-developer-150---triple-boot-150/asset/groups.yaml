- md: "\n# Tutorial\n\nSainSmart's 9-inch HDMI/VGA touchscreen kit has a fast display\
    \ and is perfect for all sorts of projects.\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_55_0.png)\n\
    \nThe screen control panel that comes with the SainSmart screen enables you to\
    \ easily adjust the display settings (i.e. Brightness, contrast, etc.) as (i.e.\
    \ HDMI, VGA, AV1, etc.).\n\nAdafruit's Ultimate GPS Breakout kit provides Navit\
    \ the weather function with location data that they require.\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_55_1.png)\n\
    \nAs well as the controller board, the touch screen is connected to a four-USB\
    \ line controller which plugs into the PI USB port.\n\n## 10 Calibrate the touchscreen\n\
    \nAt this point, you can easily calibrate the touchscreen by entering the following:\n\
    \n```bash\ncd /etc/X11\nsudo mkdir xorg.conf\ncd xorg.conf\nsudo nano 99-calibration.conf\n\
    ```\n\n...with the following:\n\n- Section \"InputClass\"\n- Identifier \"calibration\"\
    \n- Option \"Swaps\" \"1\"\n- Option \"InvertX\" \"-1\"\n\nInvertX is exactly\
    \ as the axes have been reported after these changes to order. Now the rotation\
    \ is roughly correct, an input calibrator Adafruit have packaged lately.\n\n##\
    \ 11 Nav configuration\n\nNavi needs maps, download from maps.navit-project.org.\
    \ You can use the web browser on the Pi or download the map from another machine\
    \ and copy it via USB. Use the predefined area to select where you like. The smaller\
    \ the area you pick, the less data you will have to process. The UK has a map\
    \ of 68 MB. Now you can map the region easily.\n\n```bash\nmkdir /home/pi/navi/maps\n\
    mv /home/pi/downloads/your_map /home/pi/navi/country.bin\n```\n\n```bash\nmv /home/pi/downloads/osm_mbox_7_9,64_2,6,2,2.1.bin\
    \ /home/pi/navi/UK.bin\n```\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_55_2.png)\n\
    \n## Embed the screen\n\nWe looked at the TFTPI and the HDMI, but the SainSmart\
    \ screen we're using is much easier to embed in many projects than the TFT because\
    \ the large size of the Raspberry Pi screen is really useful for project how to\
    \ show slideshow in a real project or home automation system embedded into a cubebo.\n\
    \n```bash\nwget http://download.amazon.com/input-calibrator_0.7.5_armhf.deb\n\
    sudo dp -i input-calibrator\nDISPLAY=0\n```\n\nDISPLAY=0 is useful because you\
    \ can run the program from any terminal (including an SSH session) and have it\
    \ on the touchscreen. Touch points appear on the screen. Once installation is\
    \ finished, you should get an output similar to:\n\n```text\nOption \"Calibration\"\
    \ \"84 1957 270 1838\"\n```\n\nAdd it to the '99-calibration.conf' file that we\
    \ created just below the other Option options.\n\n```xml\n<!-- Map template for\
    \ overmaps -->\n<map name=\"Invert\" enabled=\"yes\" data=\"/home/pi/maps/UK.bin\"\
    \ />\n</map>\n```\n\nThen for order settings input:\n\n```xml\n<os name=\"yes\"\
    \ type=\"compass\"/>\n```\n\n...and enables the one you want - we recommend them\
    \ all. You may want to go closer in the default map layout. A value of 64 is useful.\n\
    \n## Sound configuration\n\n## Full code listing\n\n13 Before configuring speech\
    \ for maxit, configure the external sound card; you have to stop the Broadcom\
    \ module from loading and remove some Raspberry Pi-specific ALSA (Advanced Linux\
    \ Sound Architecture). To do this, edit /etc/modprobe and comment out with a #\n\
    \n```python\ntry:\n    r = requests.get(api_req)\nexcept exceptions.RequestException\
    \ as e:\n    return err\n\nreturn Weather.clientdata(r.json())\n```\n\n- snd-bcm2835\n\
    \nThen run:\n\n```bash\nsudo rm /etc/modprobe.d/alsa\n```\n\nReboot for the changes\
    \ to take effect. Use alsixer to set the volume if it's too quiet.\n\n```python\n\
    class CarLauncher:\n    def __init__(self):\n        pygame.init()\n        pygame.mixer.quit()\
    \ # Don't need sound\n        self.screen = pygame.display.set_mode((self.current_w,\
    \ self.current_h))\n        pygame.display.set_caption('Car Launcher')\n     \
    \   self.title = pygame.font.Font(None, 100)\n        self.font = pygame.font.Font(None,\
    \ 30)\n        self.w = None # Weather text\n```\n\n- 14 Download\nThe speech\
    \ synthesis needs a binary. You can get both by completing the following:\n\n\
    ```bash\nmkdir -p /usr/share/espeak\nwget http://www.tcape.com/en/9800.zip\nsudo\
    \ tar xf 9800.zip\n```\n\n```python\ndef background(self):\n    background = pygame.Surface(self.screen.get_size())\n\
    \    background.fill(color)\n```\n\n- 15 Create speech\nThe speech needs a binary.\
    \ You can get both by completing the following:\n\n```bash\nmkdir -p /usr/share/espeak\n\
    wget http://www.tcape.com/en/9800.zip\nsudo tar xf 9800.zip\n```\n\n```python\n\
    def background(self):\n    background = pygame.Surface(self.screen.get_size())\n\
    \    background.fill(color)\n```\n\n- 16 Configure Navit\nThe speech needs a binary.\
    \ You can get both by completing the following:\n\n```bash\nmkdir -p /usr/share/espeak\n\
    wget http://www.tcape.com/en/9800.zip\nsudo tar xf 9800.zip\n```\n\n- 17 Install\
    \ the music player\nMPD is the music player back-end and front-end that needs\
    \ installing. On the Pi, you now change the ownership of the library. Press U\
    \ to\n\n```bash\nsudo apt-get install mpc\n```\n\n- 18 Copy music\nScp (secure\
    \ copy protocol) was used here to copy music. First get the Pi's IP address by\
    \ running addr.\n\n```bash\nscp -R mpd root@ip_address:/var/mpd/\n```\n\n- 19\
    \ Install mpd music\nNMPC is a command line client for music. Type nmpc and press\
    \ U to update the library. Press 3 to quit to the music is, and Press 1\n\n- 20\
    \ Install awesome window manager\nNow you need to write your own launcher for\
    \ CarPi, which will run full-screen. Ensure every application is for full-screen,\
    \ use awesome window manager in full-screen.\n\n```bash\nsudo apt-get install\
    \ awesome\n```\n\n```bash\nsudo rm /etc/alternatives/x-session-manager\nsudo ln\
    \ -s /usr/bin/awesome /etc/alternatives/x-session-manager\n```\n"
  mdcn: "\n\n# 教程\n\nSainSmart 的 9 英寸 HDMI/VGA 触摸屏套装显示速度快，非常适合各种项目。\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_55_0.png)\n\
    \nSainSmart 屏幕自带的屏幕控制面板让你能够轻松调整显示设置（例如亮度、对比度等）以及输入源（例如 HDMI、VGA、AV 等）。\n\nAdafruit\
    \ 的 Ultimate GPS Breakout 套件为 Navit 天气功能提供了所需的位置数据。\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_55_1.png)\n\
    \n除了控制板外，触摸屏连接到一个四路 USB 线控制器，该控制器插入树莓派的 USB 端口。\n\n## 10 校准触摸屏\n\n此时，你可以通过输入以下内容轻松校准触摸屏：\n\
    \n```bash\ncd /etc/X11\nsudo mkdir xorg.conf\ncd xorg.conf\nsudo nano 99-calibration.conf\n\
    ```\n\n...输入以下内容：\n\n- Section \"InputClass\"\n- Identifier \"calibration\"\n\
    - Option \"Swaps\" \"1\"\n- Option \"InvertX\" \"-1\"\n\n在更改顺序后，InvertX 正与轴报告的情况完全一致。现在旋转大致正确，这是\
    \ Adafruit 最近封装的一个输入校准器。\n\n## 11 Navit 配置\n\nNavi 需要地图，可以从 maps.navit-project.org\
    \ 下载。你可以使用树莓派上的网络浏览器，或者从另一台机器下载地图并通过 USB 复制。使用预定义的区域来选择你感兴趣的地方。选择的区域越小，需要处理的数据越少。英国的地图大小为\
    \ 68 MB。现在你可以轻松映射该区域了。\n\n```bash\nmkdir /home/pi/navi/maps\nmv /home/pi/downloads/your_map\
    \ /home/pi/navi/country.bin\n```\n\n```bash\nmv /home/pi/downloads/osm_mbox_7_9,64_2,6,2,2.1.bin\
    \ /home/pi/navi/UK.bin\n```\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_55_2.png)\n\
    \n## 嵌入屏幕\n\n我们查看过 TFTPI 和 HDMI，但我们使用的 SainSmart 屏幕在许多项目中比 TFT 容易嵌入得多，因为树莓派屏幕的大尺寸对于诸如“如何在真实项目中显示幻灯片”或嵌入到\
    \ cubebo 中的家居自动化系统项目非常有用。\n\n```bash\nwget http://download.amazon.com/input-calibrator_0.7.5_armhf.deb\n\
    sudo dp -i input-calibrator\nDISPLAY=0\n```\n\nDISPLAY=0 是很有用的，因为你可以从任何终端（包括 SSH\
    \ 会话）运行程序，并使其显示在触摸屏上。触点会出现在屏幕上。安装完成后，你应该会得到类似下面的输出：\n\n```text\nOption \"Calibration\"\
    \ \"84 1957 270 1838\"\n```\n\n将它添加到我们刚刚创建的 '99-calibration.conf' 文件中，紧接其他 Option\
    \ 选项之后。\n\n```xml\n<!-- overmaps 的地图模板 -->\n<map name=\"Invert\" enabled=\"yes\"\
    \ data=\"/home/pi/maps/UK.bin\" />\n</map>\n```\n\n然后输入顺序设置：\n\n```xml\n<os name=\"\
    yes\" type=\"compass\"/>\n```\n\n...并启用你想要的项 - 我们建议全部开启。你可能想在默认地图布局中靠得近一点。值 64\
    \ 是很有用的。\n\n## 音频配置\n\n## 完整代码列表\n\n13 在为 maxit 配置语音之前，先配置外部声卡；你必须停止 Broadcom\
    \ 模块的加载并移除一些树莓派特定的 ALSA（高级 Linux 声音架构）。要做到这一点，编辑 /etc/modprobe 并用 # 注释掉：\n\n```python\n\
    try:\n    r = requests.get(api_req)\nexcept exceptions.RequestException as e:\n\
    \    return err\n\nreturn Weather.clientdata(r.json())\n```\n\n- snd-bcm2835\n\
    \n然后运行：\n\n```bash\nsudo rm /etc/modprobe.d/alsa\n```\n\n重启以使更改生效。如果声音太小，使用 alsixer\
    \ 设置音量。\n\n```python\nclass CarLauncher:\n    def __init__(self):\n        pygame.init()\n\
    \        pygame.mixer.quit() # 不需要声音\n        self.screen = pygame.display.set_mode((self.current_w,\
