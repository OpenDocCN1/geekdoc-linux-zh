    # 新闻

    Linux 社区最新动态


    ## 开源


    ### MediaFire 发布 Linux 工具包

    源自副总裁的“个人需求”


    云存储专家 MediaFire 宣布发布其首个基于 GNU 通用许可许可证 v2 提供的 Linux 用户工具包。


    MediaFire 工程部副总裁 Brian Christ 将此次发布描述为“给粉丝的巨大诚意”，并表示这是公司首次为 Linux 提供工具。


    该项目以 `mediafire-fuse` 的命名发布，包含一个用于挂载云存储的 FUSE 模块，以及一个设计类似于 FTP 的用于文件上传、下载和管理的接口。


    “作为一名 Linux 用户和开源开发者，这个想法最早源于几年前，当时我产生了一个不通过浏览器访问账户的个人需求，”Christ 解释道，“在思考了很久之后，认为赋予它新生命似乎是一项良好的管理工作。当我们能够重新连接到它时，我感到个人非常有成就感。mediafire-fuse
    现在可以从 GitHub 页面下载，其中包含了挂载配置说明：github.com/MediaFire/mediafire-fuse。”


    ## 安全

    ### Glibc 遭受“Ghost”漏洞影响

    GNU C 库 glibc 中发现了一个追溯到 14 年的安全漏洞，许多系统已被证明是稳健的。


    该漏洞命名为“Ghost”，由安全公司 Qualys 发现，揭示了 glibc `gethostname` 功能中的缓冲区溢出问题。该漏洞表明，可以使用特殊格式的电子邮件来利用
    glibc，从而获取远程服务器的 shell 访问。


    2000 年以来发布的所有版本该漏洞都在 2013 年 3 月被发现并修复，但当时未被标记为严重漏洞。结果，许多发行版——特别是长期支持发行版——尚未迁移到修复版本。在
    2014 年，它未能引起广泛关注，直到 Qualys 在 2015 年发布报告。尽管大多数支持的发行版已修复该漏洞，但仍有一些版本存在漏洞。Ghost 加入了近期在广泛分发的软件包（包括
    GnuTLS 和 Bash）中发现的类似问题，这表明开源项目可以从改进中获益，而不是依赖于他们所希望寻找的许多概念。


    通过改进知识来实现稳定性

    我们卓越的课程提供培训。100% 的客户都认为 PostgreSQL 是优秀的。预留您的位置并获取核心代码访问权限。


    ## 开源

    您的 Linux 新闻与观点来源


    ## 自由专栏自有


    ### 自由即奴役

    言论自由是一个开放社会关注的问题，那么为什么加密通信会受到政府的威胁呢？


    ### 加密是数学而非技术

    正如尼尔·盖曼（Neil Gaiman）在另一种语境下所说，如果你要为你认为值得捍卫的写作、阅读材料的自由站出来，那么你将为你自己站出来并受到攻击，因为法律并不区分你和你想要做的事，所以要为了选举忍受并战斗，因为一个人的表达就是另一个人的表达。如果你不为你认为值得捍卫的东西站出来，你就已经失去了它。


    我们的政府对网络安全威胁的回应是建议对自由进行打击。卡梅（Cameron）提出了一个问题：“在我们的国家，如果政府无法读取，我们就不允许人们随心所欲说话吗？”他对问题的回答是：“我们绝不能。为了拥有我们私人通信的权利——任何我们同意禁止的政府——也意味着拥有自由，”，”马修·迪森（Matthew
    Dixon）说道。


    Richard 在他的 Facebook 页面上为各种出版物写过关于艺术、音乐、数字权利和自由软件的文章。在《查理周刊》遇杀案（估计通过言论自由影响了数百万人）之后，沃尔特认为在报纸头条中是错误的。我们坚持言论自由是不可谈判的，我们将战斗到死，即使被抵制并最终失败，正如法国指挥官德德伯内（Deudebonne）的虚伪所展示的那样，他最近出生为一个无神论者，却对其中一名追随者表达了深切的尊重和同情，写道“我感觉自己像查理”。


    许多人不仅认同这一声明，而且许多自由受限国家的领导者和代表，其表达行间受到的迫害比任何其他国家都严重。在以色列，沙特人曾判处当地博主拉法夫·巴达维（Raf
    Badawi） 1000 鞭刑并监禁 10 年，罪名是叛教罪，这在大多数国家都是犯罪。


    在第二次世界大战期间，在那个全面战时期，我们的政府读取了敌人的所有通信。这由于我们民主自由面临生存威胁而可能是合理的。我们现在并没有类似的处境。虽然许多威胁是我们近几十年参与中东地区广泛冲突的结果，但这些威胁并不比四十年前临时爱尔兰共和军（Provisional
    IRA）构成的威胁更大。


    声明我们的交易已被法国警方获知，Lee Rea 的杀手已被英国警方获知。这些威胁并不那么清晰，也没有细节。在未经许可的情况下访问我们听到的或说出的一切，是我们正试图保护的社会，而让威胁不断增长则是


    卡梅宣布我们的交易应该可以被英国政府通信总部（GCHQ）读取，这等同于禁止隐私权，并禁止或限制对加密的使用。加密的缺失是不可接受的。任何国家如果出于对交易、信息和与外国人的在线通信的考虑，都会面临被识别的风险。


    如果我们也禁止数学而非技术，这会是问题的问题的政策吗？


    如果是为了国家安全，GCHQ 会对此负责吗？


    也许政府会在企业实体使用的加密中植入后门，但对我们来说后门对所有人都是后门。锁定逻辑的关键在于，一旦留出后门，生命总会找到进入的。放弃隐私权真的会给 GCHQ
    一个它本不拥有的优势，并考虑到他们的服务将使 Google 等公司选择顺从。


    ## 观点

    Linux 社区最新动态


    ## 开源专栏


    ### 学习自由

    教育市场日益充斥着 FOSS（自由开源）公司，直到学校的防御被打破并被侵害？自由软件，当然会被禁止。


    政府还承诺，如果再次当选，我们将获得一份全新的、经过修订的《监视者宪章》（bit.ly/1dRikkZ），它允许 GCHQ 大规模生成数据，以供警方和其他公共机构利用我们的在线习惯。“如果不这样做，目前受到
    TEMPOR 等程序挑战的权力将成为常态。”


    同时，政府承诺将重写《人权法案》并用《权利法案》来取代它。这在最初曾是理想的，但由于几年前的紧缩政策，自由软件教育预算已被削弱。我们需要一种培训。


    “我们希望有一个系统，由服务提供资源和技术支持，确保没有一个孩子掉队。”


    - Richard Smitley

    独特且全才型，专攻教育和开源


    在物联网、Minecraft 和物理计算的帮助下，随着课程的改变，他在自由软件失败的英国学校取得了成功。树莓派贸易有限公司随后将其所有利润投入了树莓派基金会，这是一个支持学校使用树莓派的教育慈善机构。这种观点是一个成功的社会企业，拥有一套（外包营销）部门战略。


    “TLM 有我们教育所所需的长期愿景。我们希望有一个系统，由服务提供资源和技术支持，确保没有一个孩子掉队，”Ian Lynch 说道。


