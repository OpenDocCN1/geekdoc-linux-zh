    ## 作为物联网解决方案参与提供的 Snappy Ubuntu Core


    ## 寄希望树莓派社区


    Canonical 创始人 Mark Shuttleworth 正在通过新的 Ubuntu Core 大力推销他的公司，将其作为物联网（IoT）项目的首选操作系统。Ubuntu
    Core 的目标涵盖了从可能克隆游戏无人机的机器人，到使用能源更高效或安全设置更不安全的小型家庭等各个领域。


    “灵感源于那些在技术领域取得飞跃的发明者和创新者，我们想要证明开源可以释放创新，尽管大部分这类内容都是高风险且不安全的 Linux 版本。每个设备都有自定义的‘固件’，将操作系统、驱动程序和设备特定软件整合在一起，这碎片了公司的发布工作。”


    Shuttleworth 建议通过标准化为 Ubuntu 来解决物联网的这一问题。Snappy 和 Ubuntu Core 非常适合分布式（场景）。


    Snappy 和 Ubuntu Core 与传统的软件包解决方案不同，它们提供了原子级升级（atomic upgrades）以及在任何时候进行回滚的能力。Canonical
    将其定位为需要预测性和可靠性系统的解决方案，该公司对这些优势深信不疑，甚至爱好者也能受益。


    最近发布的树莓派 2 带来了了基于 ARMv7 的芯片处理器升级，并伴随发布了 Ubuntu Core。这通过在板卡上构建的针对特定硬件的 Ubuntu 镜像以及
    Odcl-CI 得到了证明。Shuttleworth 承诺，在硬件发生更改之前，这些镜像将保持更新到特定功能。我们在这一版本的 Ubuntu Core 中添加了硬件抽象层，特定平台的内核位于其中。我们正在与主要的芯片供应商进行商业合作，以确保构建在芯片和板卡上的每台设备设备都能获得免费更新。


    “无论你是发明者，还是可能运行在设备上的应用开发者，Ubuntu Core 都适合你，”Shuttleworth 说。“它内置了应用商店（嗯，是一个‘snappy’商店），可以轻松访问库代码、在
    GitHub 和其他论坛进行协作，并且机器人和自动驾驶的代码可以即时获取，我迫不及待想看到人们会构建出什么了。”


    “例如，能够在我的下一台相机追踪无人机上安装 AI 是非常欢迎的，我很高兴能以一种能够自动修复 Heartbeats 补丁的方式来实现它。”


    ## Snappy 比依赖项更优


    在创始人 Mark Shuttleworth 之上，Canonical 的 Ubuntu Core 将整合物联网


    是的，你可以从 raspberrypi.org/downloads 获取树莓派的 Ubuntu Core


