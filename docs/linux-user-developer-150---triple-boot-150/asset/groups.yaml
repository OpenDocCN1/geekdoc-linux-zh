    ## 16 正则表达式

    你可以处理 lsof 的输出并创建摘要。借助 awk，可以很容易找到 TCP 和 UDP 连接的数量。以下命令可以轻松解决问题：


    ```bash

    lsof -i -nP | grep "80" | uniq -c

    ```


    lsof 命令列出所有连接，awk 提取字段并对其进行排序。uniq -c 统计每行出现的次数。最后，grep 删除包含 "UDP" 字符串的行。你可以使用以下命令获取关于
    lsof 的所有信息：


    ```bash

    lsof -i -nP | grep ESTABLISHED | awk ''{1,$5}'' | sort

    ```


    ## 17 有用技巧

    与其他任何工具一样，lsof 并不完美，因为它无法看到所有的网络问题。对于相关问题，你可能需要的其他工具包括：netstat、iptables、tcpdump、Wireshark、tshark
    或 trace。lsof 工具的作用范围是有限的。


    lsof 支持正则表达式。为了找到所有字符，你可以使用这个：正则表达式以斜杠开头和结束。`^` 字符表示行首，`$` 表示行尾。每个点号代表一个字符。


