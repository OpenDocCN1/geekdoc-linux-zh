    # ## 16 Regular expressions


    You can process lsof output and create summaries. It''s easy to find the number
    of TCP and UDP connections with the help of awk. The following command easily
    does the trick:


    ```

    # lsof -i -nP | grep "80 | sort | uniq -c | grep -v UDP

    ```


    The lsof command lists all connections, awk extracts the fields and sorts them.
    The uniq -c counts how many times a line appears. Finally, the grep deletes the
    lines with the "UDP" string in it.


    You can get all about lsof using the following command:


    ```

    # lsof -i -nP | grep ESTABLISHED | awk ''{$1,$5}'' | sort

    ```


    # ## 17 Useful something


    As with any other tool, lsof is not perfect because it can''t see all of network
    problems. Other tools that you may need to use for related network problems are:
    netstat, iptables, tcpdump, Wireshark, tshark, or trace.


    The extent of the lsof tool is limited.


    # ## 16 Regular expressions


    lsof supports regular expressions. In order to find all with characters, you can
    use this:


    # ## lsof -/,.*


    Regular expressions start and end with a slash. The ^ character denotes the beginning
    of a line and $ denotes the end of one. Each dot represents a character.


    # ## 17 Choose between IPv4 and IPv6


    lsof supports both IPv4 and IPv6 connections by default you can choose the kind
    of connections to display. The next command displays IPv4 connections:


    # ## lsof -i4


    The following command displays IPv6 connections:


    # ## lsof -i6


    # ## 18 Disable DNS and port


    lsof uses the data in the /etc/services file to map a port to a service. You can
    disable this functionality by using the -P switch:


    # ## lsof -n


    lsof uses DNS to display the name of a host instead of its IP address. You can
    turn this off with its functionality as:


    # ## More about lsof output


    The output of lsof shows various columns. The COMMAND column contains the first
    characters of the command associated with the process. The PID column shows the
    process ID. The USER column shows the name of the user. The FD column shows the
    file descriptor. The TYPE column shows the type of file, directory, or socket.
    The SIZE column contains the size. The DEVICE column contains the device numbers,
    separated by commas. The NODE column shows the name of the mount point or the
    FILE column shows the name of the file or file offset in bytes.


