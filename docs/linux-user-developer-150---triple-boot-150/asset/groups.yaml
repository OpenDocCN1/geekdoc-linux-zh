    # 问题解答


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_73_0.png)


    # 什么是树莓派 2？


    仍然对树莓派的新版本对你意味着什么感到困惑吗？错过了我们上期期的评测吗？我们在这里为你提供帮助。


    Rob Zweetsloot

    负责复杂系统建模，是一位精通 Python、Django 和 PHP 的 Web 开发人员。他也热于计算领域的实验。


    如果你喜欢这些……

    请查看我们的开箱视频，在视频中我们详细介绍了 Pi 2 的变化并指出了重点。Rob Zweetsloot 也会进行讲解。


    那么，还有另一个树莓派 2 吗？它是另一次更新、一个全新的产品，还是完全不同的东西？我有点困惑了。


    这次说的是树莓派 2 B —— 一个全新的树莓派。


    在 Pi Model B2 和 B+ 中。无论如何，这块芯片经过了更新并增加了 RAM，这正是它被称为 Pi 2 的原因。


    确实如此，这意味着我们在执行更新软件或浏览教程信息等任务时，不会遇到运行缓慢的情况。


    基本上是一个全新的树莓派 2 吗？

    嗯，让它成为树莓派的唯一可能是它使用了相同的原始 Pi 系统，BCM2835 芯片是片上的核心，拥有 ARM66 处理器和视频图形芯片。这是我们之前在完整模块上所做的，当时配备了
    512 MB 的 RAM。


    新芯片是怎么样的？

    BCM2835 是 2683 的微调版本——主要的区别是它拥有 ARM7 四核处理器、900 MHz 频率和 1 GB 的 RAM，而不是之前的配置，这为树莓派带来了大大的性能提升。


    强大了多少？

    树莓派基金会估计它的性能比原始 Pi 强大约六倍。从我的一些照片来看，看起来和 Model B+ 没有区别。


    主要且唯一真实的区别是 RAM 现在位于顶板的底部。这种重新设计最终是为了适应 Pi 2 的硬件，留出了某种程度的空白，让制造商能够在 2 代产品正式发布之前将其推向市场。


    延伸阅读

    请查看树莓派基金会出版的最后一期《树莓派》杂志，获取更多细节：

    www.linuxuser.co.uk


    # 问题解答


    ![](img/2f9ef091d4813dbe86196f72ccfd0107_74_0.png)


    # 第八已出版


    ## 使用树莓派和触摸屏制作手持播放器

    你知道吗，我们在 Google Play 商店有一本专门针对树莓派的数字杂志，本月重点介绍了 PI 的最新动态。在这个小处理器上方的是提升树莓派 2 性能的部分


    ## 视频播放器

    PI 是一个非常棒的小设备，非常适合像带有 Adafruit 的那种案例，使其成为随身携带项目的理想选择。我们的指南展示了具体的操作方法，我们还展示了如何用它制作自己的树莓派手机。


    ## 精通

    但如何将该平台作为有趣项目的基础呢？我们通过两种方式回答这个问题：带你了解在水位上升到特定点时设置无线水位的过程——这是一个非常棒的实验项目。我们还向你展示了如何使用自己的机器人自动穿梭时间线。树莓派现在位于英国威尔士。


    ## 它有 Wi-Fi 吗？

    没有，没有内置 Wi-Fi。那实现起来很困难。相反，我们得到了一个非常便宜且功能强大的 Pi。


    ## 原始树莓派上的所有功能都能工作吗？

    基本上，最好是运行在 ARM7 上的更新版树莓派，因为软件本身使用了所有的引脚和端口，其工作方式应该没有问题。你可能需要考虑的问题是树莓派运行较慢，但这些是可以解决的。


    ## 树莓派将不再受到支持？

    目前不会，没有停止计划。新软件可能需要在 Pi 2 上运行，但基金会无法控制旧 Pi 是否仍能继续工作。


    ## Model A 怎么样——也会有那种型号吗？

    没有，基金会说不会有 Model A。但他们也说树莓派 2 可能在 2017 年之前都不会更新，而我们正在处理今年 2 月的版本，所以请等一下。


    ## 给我日期——新价格是多少？

    价格保持不变——35 美元或约 25 英镑——但获得的是强大得多的设备。这意味着升级既容易又负担得起。你可以在相同的地方购买，例如 element14 和
    RS components。


