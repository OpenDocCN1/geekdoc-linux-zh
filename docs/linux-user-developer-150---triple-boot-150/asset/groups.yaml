    ## VNC issues


    Sometimes I need to do work in the terminal on my system. However, when I try
    and open the terminal, it opens freely and then closes. The system in question
    is CentOS, which I have to access remotely via VNC using PE as a desktop environment.
    It works fine if I''m logged in root, so I only assume it''s a problem with the
    user. I don''t want to make some of the normal users have full privileges. Have
    you heard of anything like this?


    Try this, open the terminal logged in as root, then change to another user with:


    ```

    $ su - <user>

    ```


    This enables you to open another shell to log in. Any errors will show up in the
    root terminal. It''s likely that you can''t load into the shell because you''re
    using it via VNC. To solve this, add the relevant users to the list of those allowed.
    For xhost, type:


    ```

    host:<user>

    ```


    as root. Give the system a reboot and it should be working fine.


