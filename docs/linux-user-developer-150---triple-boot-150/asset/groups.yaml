    data=/var/lib/postgresql/9.3/main\nport=5432\nupdate-cluster: using /usr/share/postgresql/9.3/main/postgresql.1.gz\
    \ to\n/usr/share/postgresql/9.3/main/postgresql (postgresql.1.gz) database server\n\
    \ [ OK ]\nSetting up postgresql-client\nCreating processors for libpq-dev (2.19-Ubuntu)\
    \ ...\nnitish@nitish-ubuntu:/srv/media/mediagoblin.example.org/mediagoblin$ sudo\
    \ -u postgres\nnitish@nitish-ubuntu:/srv/media/mediagoblin.example.org/mediagoblin$\
    \ sudo -u postgres\nnitish@nitish-ubuntu:/srv/media/mediagoblin.example.org/mediagoblin$\n\
    ```\n\n### 01 Sort dependencies\nMediaGoblin is a full-fledged media platform\
    \ and therefore it has few dependencies that you will need to take care of before\
    \ installing MediaGoblin. Let's take a look at these dependencies and how to install\
    \ them.\n\n### 02 Set up the database\nAs we said, the SQLite database does not\
    \ perform well for deployments involving more than two users. If you are planning\
    \ to have more than three users, it's recommended to use PostgreSQL. To set it\
    \ up, follow the steps below to download and install the packages with apt-get.\n\
    \n### 03 Media user\nIf you followed the previous step, you will have noticed\
    \ that we didn't add a password for the user named mediagoblin. So how will the\
    \ system authenticate? This is done via local authentication. Local authentication\
    \ is enabled by default. To enable it, you need to set a password for the user\
    \ with the same name as the PostgreSQL database user: unprivileged system user\
    \ mediagoblin. Note that the user can be underprivileged because MediaGoblin needs\
    \ certain privileges to run. This makes the system more secure.\n\nPostgreSQL\
    \ 2.6 or later\nPython-dev contains certain libraries to Python. For downloading\
    \ and setting up the SQLite/PostgreSQL server. Everything is stored in a single\
    \ file, which is fine for small sets of users, but you might need to use PostgreSQL\
    \ if you expect more users.\n\n```bash\nsudo apt-get install postgresql\npostgresql-client\
    \ python-psycopg2\n```\n\nNote that there are other required packages too. The\
    \ installation process creates a user (postgres) with sufficient privileges to\
    \ handle the database, but keeping in mind that we will need a separate user for\
    \ MediaGoblin. To create this\n\nPython Library: This image adds dependencies\
    \ to the Python interpreter. virtualenv is what you use to create Python environments.\n\
    \n```bash\nsudo -u postgres createuser -D mediagoblin\n```\n\nYou can install\
    \ all the database system using the apt-get command. It can be done with a single\
    \ command:\n\n```bash\nsudo apt-get install git-core postgres \\\npython-dev python-ixml\
    \ python-imaging \\\npython-virtualenv\n```\n\nSince it's created, you don't need\
    \ to login to this account but a switch is possible:\n\n```bash\nsudo -u mediagoblin\
    \ /bin/bash\n```\n\nOnce you have created it, the user will use this account for\
    \ once.\n\nHere is the first mediagoblin's name and the second is the name of\
    \ database:\n\n35 | linuxuker.com\n\n# Tutorial\n\n## 04 Install MediaGoblin\n\
    \nTo start the installation, you need to create a working directory for MediaGoblin,\
    \ where the git repository will be downloaded.\n\n```bash\nsudo mkdir -p /srv/mediagoblin.example\n\
    sudo git clone -hv mediagoblin /srv/mediagoblin.example\n```\n\nAs you can see,\
    \ create the directory with elevated privileges and then change the owner to our\
    \ underprivileged MediaGoblin user. Let's now clone MediaGoblin to fetch the data\
    \ from the MediaGoblin repository and then change the directory to the working\
    \ directory we just created:\n\n```bash\ncd /srv/mediagoblin.example\n```\n\n\
    Now starting:\n\nMove to the 'mediagoblin' folder and create mediagoblin.ini then\
    \ fetch the repo:\n\n```bash\ngit clone git://github.com/mediagoblin/mediagoblin\n\
    ```\n\nYou'll notice we didn't take the code from the stable branch but instead\
    \ the master branch of the repository. MediaGoblin is ready for rapid development\
    \ so we sense to use the master branch:\n\n```bash\ngit submodule update --bin/python\
    \ setup.py --development ../bin/python\n```\n\nMediaGoblin uses a virtualenv to\
    \ manage the dependencies with isolated Python environments. It's already installed\
    \ in the package, so we can use:\n\n```bash\nvirtualenv --python --system-packages\
    \ --python=python.7 ../bin/python setup.dev\n```\n\nIf you are feeling adventurous,\
    \ you can also try experimental deployment script (shell script) instead of the\
    \ earlier command:\n\n```bash\n./experimental-bootstrap.sh --configure\n```\n\n\
    ## 06 Deploy MediaGoblin\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_35_0.png)\n\
    \nTo make any changes to this file, first copy it to mediagoblin.ini, then make\
    \ the changes. To change the database, make sure you change the path in the ini\
    \ file and your server configuration.\n\n```ini\n[database]\npath = /var/lib/mediagoblin\n\
    user = mediagoblin\nemail_address = @mediagoblin.org\n[postgresql]\nurl = postgres://localhost\n\
    [settings]\nappropriate = true\nnotifications = false\nregistrations = false\n\
    report = false\nreporting = true\n```\n\nMediaGoblin doesn't need any privileges\
    \ to run\n\n- email_address = the ID you use for sending emails.\n- sql_engine\
    \ = true\n- postgresql = /var/lib/mediagoblin if you are using PostgreSQL\n- edit_remote_path,\
    \ and base_url = the root of the host.\n\nvirtualenv also keeps it updated as\
    \ per developers of MediaGoblin, this is still essential. The codebase at one\
    \ point simply runs:\n\n```bash\ngit submodule update --bin/python setup.py --development\
    \ ../bin/python\n```\n\nNow you also need to install the dependencies using:\n\
    \n```bash\npip install Flask https://pypi.org/project/Flask\n```\n\nWe will see\
    \ more on Flask and FastCGI in the following sections:\n\n```bash\n./lazyserver.sh\
    \ --server-name=localhost port=6543\n```\n\n## 07 Deploy MediaGoblin\n\nNow that\
    \ dependencies are set and MediaGoblin is installed, we edit the MediaGoblin configuration\
    \ files — specifically the mediagoblin.ini file located inside /srv/mediagoblin.example/\
    \ and here are the changes:\n\nMediaGoblin uses FastCGI for deployment and needs\
    \ a server. We will need a Nginx server. We already installed Flask in step five,\
    \ so now we see why Flask is important. Later you will learn FastCGI setup with\
    \ Nginx server to see MediaGoblin pages.\n\n36 linuxuxer.co\n\n# Host your own\
    \ media gallery\nShare media without worrying about privacy\n\nFastCGI is a protocol\
    \ to interface interactive programs with a web server - it is an improvement over\
    \ CGI (common gateway interface), easy to implement but problems in scaling separate\
    \ processes were created for each request - huge overhead for the host. FastCGI\
    \ works using processes to serve web requests; however, processes are managed\
    \ by FastCGI (proxy in case) and not the web server itself, allowing effective\
    \ scaling. Now any server that supports FastCGI can be used for MediaGoblin.\n\
    \n```nginx\nserver {\n    ######################\n    # useful config options,\
    \ but keep them simple\n    ######################\n    location ~ \\.php$ {\n\
    \        include fastcgi_params;\n        fastcgi_pass /application/octet-stream;\n\
    \        sendfile on;\n    }\n    location / {\n        index index.html index.htm;\n\
    \        try_files $uri $uri/ /index.php?$query_string;\n    }\n    # This is\
    \ where you should add custom rules\n    # Change this to update upload size limit\
    \ for your users\n    location / {\n        # allows uploading a .txt file that\
    \ the browser sends as an attachment\n        if ($request_filename ~ *\\.txt$)\
    \ {\n            return 204;\n        }\n    }\n    # Plugin static files (usually\
    \ linked in)\n    location = /plugins/ {\n        expires max;\n        access_log\
    \ off;\n    }\n    # Theme static files (usually linked in)\n    location = /themes/\
    \ {\n        expires max;\n        access_log off;\n    }\n}\n```\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_36_0.png)\n\
    \n## 08 Nginx setup\n\nNginx has slowly risen in the ranks of web server choice\
    \ and is currently one of the most used web servers. For example, it supports\
    \ a lot of protocols but those are out of scope for us. Here is a guide to the\
    \ server setup. Create a configuration file at example/nginx.conf and create a\
    \ symbolic link into the directory that will be included in your nginx configuration\
    \ with one of the following:\n\n```bash\nln -s /etc/nginx/sites-available/example\
    \ /etc/nginx/sites-enabled/\n```\n\nThis change will allow you to easily edit\
    \ the contents of the configuration file, as shown in the screenshot. Remember\
    \ to change the fields to your path. Then restart nginx with `sudo systemctl restart\
    \ nginx`. Everything works, start MediaGoblin!\n\n```bash\ncd /var/www/mediagobin\n\
    ./lazyserver.sh --server=fastcgi_host=127.0.0.1:9000 port=20543\n```\n\nVisit\
    \ MediaGoblin.com to see MediaGoblin gallery.\n\n## 09 MediaGoblin home\n\nThe\
    \ setup process is little by little and it may seem a complex task, but the steps\
    \ are simple and just need to follow them one at a time. Once you have successfully\
    \ completed the process, you can enjoy uninterrupted media streaming for you and\
    \ your loved ones.\n\nThe first step after your own MediaGoblin instance is to\
    \ create an account. This is because collections needs you but you can join any.\
    \ Click on 'Login' on the top right of the page. In the page that appears, click\
    \ Register. Fill in the details in the registration page and you are ready to\
    \ go! You can navigate to your profile page. Here you have the options to edit\
    \ and manage your profile.\n\ndescription, add tags and the license you want to\
    \ assign to the media. Finally click on the 'Add' button to upload.\n\n## 10 Add\
    \ media\n\nAdding a media file is a breeze, click on the 'Add media' button on\
    \ the left side of your profile. In the next page, upload the file, the title\
    \ of the media, and a\n\n![](img/2f9ef091d4813dbe86196f72ccfd0107_36_1.png)\n\n\
    37. linuxuxer.co\n"
