    ## Get network information using lsof\nTroubleshoot your network by identifying\
    \ processes\n\n`lsof` is a command-line utility used to list open files. It is\
    \ commonly used to troubleshoot network issues by identifying which processes\
    \ are using specific network ports.\n\n```bash\nlsof -i -C /\n```\n\n**Explanation\
    \ of flags:**\n- `-i`: Selects IP addresses (network files).\n- `-C`: Limits the\
    \ output to processes matching the specified criteria.\n- `/`: Specifies the directory\
    \ context (often the root).\n\nThe output will show a table with details like\
    \ the command, type of file, size/offset, and the network node.\n\n| COMMAND |\
    \ TYPE | SIZE/OFF | NODE |\n| --- | --- | --- | --- |\n| md 222 cwd | REG | 200\
    \ | 4096 |\n| md 222 root | REG | 200 | 4096 |\n| md 25906 root | REG | 4096 |\
    \ 4096 |\n| md 25906 root | REG | 4096 | 6358 |\n| md 23906 root | REG | 4096\
    \ | 16488 |\n| md 23906 root | REG | 4096 | 30512 |\n| u/libattr.so.1.4 | REG\
    \ | 17132 | 5668 |\n| u/libcap.so.22 | REG | 81620 | 126808 |\n| u/security/pam.so\
    \ | REG | 6000 | 5947 |\n| u/security/perm_mit.so | REG | 6000 | 5947 |\n| u/security/deny.so\
    \ | REG | 5912 | 5947 |\n| u/libssl.so.11 | REG | 35184 | 6418 |\n| u/libcrypt.so\
    \ | REG | 50656 | 5960 |\n| u/security/unix.so | REG | 18240 | 5942 |\n| u/security/pam_mail.so\
    \ | REG | 14368 | 6398 |\n| u/security/dev_env.so | REG | 10248 | 6448 |\n| u/libsel.so\
    \ | REG | 122632 | 5648 |\n| u/security/root.so | REG | 6016 | 5947 |\n| u/lib_linux-file-23.so\
    \ | REG | 20716 | 6428 |\n| u/libgcc-la-13.so | REG | 43560 | 6478 |\n| md 25906\
    \ root | REG | 80956 | 6418 |\n| md 23906 root | REG | 31584 | 6413 |\n| md 23906\
    \ root | REG | 14765 | 6395 |\n| md 23906 root | REG | 163068 | 6356 |\n\n## 16\
    \ Regular expressions\nYou can process lsof output and create summaries. It's\
    \ easy to find the number of TCP and UDP connections with the help of awk. The\
    \ following command easily does the trick:\n\n```bash\nlsof -i -nP | grep \"80\"\
    \ | uniq -c\n```\n\nThe lsof command lists all connections, awk extracts the fields\
    \ and sorts them. uniq -c counts how many times a line appears. Finally, grep\
    \ deletes the lines with the \"UDP\" string in it. You can get all lsof using\
    \ the following command:\n\n```bash\nlsof -i -nP | grep ESTABLISHED | awk '{1,$5}'\
    \ | sort\n```\n\n## 17 Useful something\nAs any other tool, lsof is not perfect\
    \ because it can't see all network problems. Other tools that you may need to\
    \ use for related problems are: netstat, iptables, tcpdump, Wireshark, tshark,\
    \ or trace. The extent of lsof tool is limited.\n\nlsof supports regular expressions.\
    \ In order to find all characters, you can use this: Regular expressions start\
    \ and end with a slash. The ^ character denotes the beginning of a line and $\
    \ denotes the end. Each dot represents a character.\n\n## Choose between IPv4\
    \ and IPv6\nlsof supports both IPv4 and IPv6 by default you can choose the kind\
    \ of connections to display. The next command displays:\n\n## Disable DNS and\
    \ port\nlsof uses the data in the /etc/services file to map a port to a service.\
    \ You can disable this functionality using the -P switch: -n.\n\nlsof uses DNS\
    \ to display the name of a host instead of its IP address. You can turn it off\
    \ with its functionality as:\n\n## More about lsof output\nThe output of lsof\
    \ shows various columns. The COMMAND column contains the command associated with\
    \ the process. The PID column shows the process ID. The USER column shows the\
    \ name of the user. The FD column shows the file descriptor. The TYPE column shows\
    \ the type of file, directory, or socket. The SIZE column contains the size. The\
    \ DEVICE column contains the device numbers, separated by commas. The NODE column\
    \ shows the name of the mount point or the FILE column shows the name of the file\
    \ or file offset in bytes.\n\n## LaTeX - A document preparation system\nThis is\
