    rob@ubuntu:~$ sudo btrfs volume list btrfs/volume1

    [sudo] password for robz:

    ID 256 gen 1 top level 5 path volume1

    ID 257 gen sub level 5 path snapshot

    rob@ubuntu:~$ sudo btrfs volume set-default 258 btrfs/

    [sudo] password for robz:

    rob@ubuntu:~$

    ```


