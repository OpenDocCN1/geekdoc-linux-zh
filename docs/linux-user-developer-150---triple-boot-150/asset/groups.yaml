    \ 75% 的空间可存储，同时仍不受硬盘故障的影响。与具有相同理论冗余的 RAID 1 相比，它提供了更多存储，而 RAID 6 在增加冗余的同时将硬盘的整体存储减少到全容量的\
    \ 60%。\n\n虽然仍然存在 Bug，即使是最好的 5 和 6 也可能会麻烦。关于 btrfs 中 RAID 5 和 6 的详情，请访问文档：https://btrfs.wiki.kernel.org/index.php/RAID\n\
