  - "[PAGE 36]\n\n# # Host your own media gallery\nShare media without worrying about\
    \ privacy\n\nFastCGI is a protocol to interface interactive programs with a web\
    \ server - it is an improvement over CGI (common gateway interface), easy to implement\
    \ but problems in scaling separate processes were created for each request - huge\
    \ overhead for the host. FastCGI works using processes to serve web requests;\
    \ however, processes are managed by FastCGI (proxy in case) and not the web server\
    \ itself and FastCGI, allowing effective scaling. Now any server that supports\
    \ FastCGI can be used for MediaGabin.\n\n```\nserver {\n    ######################################\n\
    \    # useful config options, but keep them simple\n    ######################################\n\
    \    location ~ \\.php$ {\n        include fastcgi_params;\n        fastcgi_pass\
    \ /application/octet-stream;\n        sendfile on;\n    }\n    location / {\n\
    \        index index.html index.htm;\n        try_files $uri $uri/ /index.php?$query_string;\n\
