    \n### 03 进入终端\n你也可以在终端执行此操作。打开并使用 `fdisk -l` 来确定系统中分区和硬盘的名称。一旦完成，创建你的 btrfs 分区：\n\
    \n### 05 获取你的文件系统详情\n万一你忘记了，你可以随时检查 btrfs 分区和硬盘。这同样适用于阵列中的硬盘，这也是为什么我们在上一步中推荐 RAID，在终端中：\n\
    \n```\n$ mkfs.btrfs /dev/sda\n```\n\n### 06 格式化文件系统\n在大多数现代系统中，你可以轻松地通过单点击格式化文件系统。要手动执行并将其放置在文件系统部分，你可以在终端中简单地执行：\n\
    \n```\n$ mkfs.btrfs -t b \n```\n\n### 07 创建子卷\n你可以在 btrfs 中创建子卷，它们可以有不同的挂载选项和挂载点，只有在你需要时才使用空间。在终端中创建：\n\
