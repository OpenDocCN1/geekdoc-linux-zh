    \ apt-get 下载并安装包。\n\n### 03 媒体用户\n如果你遵循了上一步操作，你会注意到我们没有为名为 mediagoblin 的用户添加密码。那么系统将如何验证身份呢？这是通过本地身份验证完成的。本地验证默认启用。要启用它，你需要为与\
