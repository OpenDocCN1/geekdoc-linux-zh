    ### 12 非冗余元数据\n如果你正在创建硬件 RAID，元数据冗余可能是有用的。每个设备创建元数据需要 -m 选项，并与 'single' 或 RAID\
    \ 0 使用：\n\n```\n$ mkfs.btrfs -m raid0 /dev/sda /dev/sdb/\n```\n\n### 13 RAID 10\n\
