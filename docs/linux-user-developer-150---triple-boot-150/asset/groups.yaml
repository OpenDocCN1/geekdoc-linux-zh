    # 08 Show open UDP\n\nThe following command opens UDP files on:\n\n```\nlsof -i\
    \ UDP\n```\n\nThe next version shows open files on the (Network Time Protocol)\
    \ port only:\n\n```\nlsof -i :udpn\n```\n\n# 10 List files opened by a specific\
    \ user\n\nThis is a very practical option because it enables you to locate the\
    \ open files of any user, including the web, database and ftp servers you may\
    \ have.\n\nThe following command lists all open files by the www-data user:\n\n\
    ```\nlsof -u wwwdata\n```\n\nThe next version finds all established connections\
    \ by the www-data user:\n\n```\nlsof -u wwwdata | grep EST\n```\n\nIn order to\
    \ find all open sockets by the www-data user, you should use the following command:\
    \ lsof -u www-data\n\n# 11 Show processes that are listening on a port\n\nThe\
    \ following command shows all connections listening to port 22 (ssh) using TCP:\n\
    \n```\nlsof -i :22\n```\n\n# 12 Kill processes owned by a user\n\nThe following\
    \ command kills processes owned by the www-data:\n\n```\nkill -9 $(lsof -u www-data)\n\
    ```\n\n# 09 List open files under a directory\n\nThe following command lists all\
