    \ the mtsook user:\n\n```\nlsof -u mtsook -\n```\n\nSimilarly, this command lists\
    \ all network activity from processes not owned by the root:\n\n```\nlsof -u -root\n\
    ```\n\n# 14 Discover network connections from an external host\n\nThe following\
    \ command finds all network connections that are coming from or going to:\n\n\
    ```\nlsof -i @google.com\n```\n\nYou can also specify a range of ports as follows:\n\
    \n```\nlsof -i @google.com:20-25\n```\n\n# 15 Use AND\n\nThe default behaviour\
    \ when multiple options is to print everything that matches. If you want an AND,\
    \ you can use the -a option. Therefore, to find all open sockets by the www-data\
    \ user, you should use the following command:\n\n```\nlsof -Fni -a www-data\n\
    ```\n\nTo find out a user is connected to the 192.168.2.4 machine, you use the\
    \ following command:\n\n```\nlsof -u mtsook -a :0192.168.2.4\n```\n"
