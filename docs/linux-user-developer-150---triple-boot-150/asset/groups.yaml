    # 开源


    您的 Linux 新闻与观点来源


    # JON MASTERS


    ## 内核专栏


    随着 Linux 考虑 Linux 4.0，Jon Masters 为我们带来了更新，同时关于如何处理 2038 年“千年危机”的讨论仍在继续。


    Linux 3.19 引入的杂项特性之一是叠加层（overlays）。这些对于嵌入式设备非常有用，例如树莓派，它使用 Devicree 来描述其所运行的系统级芯片（SoC）上的许多平台特定设备。现代
    SoC 拥有几十甚至数百个设备，包括 USB 和网络等接口，这些接口直接连接到芯片上的 CPU 核心上，而不通过 PCI 总线。在启动时确定系统的拓扑和结构需要提供
    Devicree 数据结构，这对于运行在树莓派或 BeagleBone 上的运行时。因此，Linux 3.19 对于使用自定义 RB 将变得容易得多。


    在 2.6 系列之前的 2.5 内核系列中，内核曾存在过奇/偶数的编号方案。但这种做法在 2.7 再次出现，当时内核的大部分转变为现代基于 Git 的源码开发流程以及
    8 周的内核开发周期。结果，Linux 3.0 的出现并不是因为需要新的地球，而是 Linus 觉得版本号已经增长太高了。当我们进入一个我得数着手指才能记清数字的时代，，逻辑再次成立。内核很有可能是
    4.0，或者可能很快就会是 5.0，因为版本号将不再毫无，除非在那些可能也会使用我们的产品营销中。


    Jon Masters 是一位 Linux 黑客，从事 Linux 工作已近 19 年，从他最初就读于马萨诸塞州剑桥市的大学就开始从事这项工作了。他目前就职于一家大型（他今年
    33 岁）供应商，该公司致力于驱动能效 ARM 驱动设备的系统创建。


    Linux Torvalds 大约在今天发布了最后的 3.19 内核，并提到：“自 3.19-rc7 发布以来没有什么是令人兴奋的，我想找一个多年来我们真正取得进展的时刻。”正如他所预计划的，新内核包含许多令人兴奋的特性：支持
    Intel 的内存保护扩展（将详细介绍）、用于 GPU 设备的新型 HSA 驱动程序、增强的 RADV 5 和 6 支持，以及 Android Binder
    机制在内核暂存区的最终合并。一如既常，KernelNewbies 对补丁提供了极佳的总结并链接到：kernel/newbies.org/3.19。


    # Linux 4.0？


    随着 Linux 3.19 的发布，后续版本的合并窗口随之开启。合并内容将根据 Linus 的感受而包含许多变化；包括直观且具有破坏性的变化，这些变化可能会产生影响，而且只有当合并本身确实发生了重大变化时，情况才会如此。


    我们想要内核已经拥有的合并已经包含了一些好东西。例如，Linux 提供了内核模式的支持，但结果是，它不会通过更新后的元数据以许多方式显示出来。这现在不是这样，但未来对于那些被广泛使用的事物（对于许多事物）将会如此。


    与 Linux 开发在波动方面变得平衡的方式一样，内核版本号的意义也是如此。在这个小窗口内合并的 10,000 多个提交中，许多已经经过了整个之前的 7-8
    周周期，作为内核某些非核心部分的等效维护开发-开发。


    这些也改变了内核行为，特别是在更新和某些条件下，但它们在此过程中破坏了 POSIX 兼容性。因此，最新实现的性能时间是在内存中的。除非内核有其他理由写入文件元数据，或者经过了一定的时间（当前实现为
    24 小小时），否则它不会写回磁盘。


    # 观点

    - Jon Masters


    # 开源


    # 绑定 Android API


    Linux 3.9 将 Binder 从内核上游提升到 Android 的正式部分。Binder 是一种进程间通信（IPC）机制，用于允许 Android
    设备上的不同进程（应用程序或“应用”）通过提供的运行时方法相互通信。它与传统的 IPC 机制形成对比。在很长一段时间里，Binder 作为一个驱动模块存在，需要应用于上游
    Linux 内核才能在 Android 设备上使用。Binder 是内核的一个特殊子目录，旨在存放尚未准备好投入的不不稳定测试驱动代码，提供给那些有需求或意愿使用它的早期采用。


    Binder 并不是传统意义上支持特定硬件的驱动程序。它在暂存区的存在有两个目的。第一个是政治原因：许多开发者仍然将 Linux 视为类 Unix 操作系统。人们不喜欢
    Google 在没有经过的情况下添加特殊的 IPC 机制的想法。因此，将代码移入暂存区允许其他人在 Linux 源码相同的位置处理它。其次，保持 Binder
    在树外意味着它在 Android 设备运行期间必须进行维护。在足够长时间之后，大家达成认为大多数设备都在运行 Android，并且它们都在使用 Binder。正如
    Greg Kroah-Hartman 在将其从暂存区提升时所说：“无论未来发生什么，我们都要支持这个 API。”


    ## 持续开发

    过去一个月，关于持续存在的 2038 年问题有很多辩论。这一年是32 位 Linux、Unix 和类 Unix 系统使用的 32 位时间 t 将溢出的年份，导致时间回倒到
    1978 年。


    '
