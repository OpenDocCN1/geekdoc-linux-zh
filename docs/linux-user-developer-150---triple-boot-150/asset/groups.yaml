    ## MinnowBoard Max


    It''s the follow-up to Intel''s original MinnowBoard, but can the Max take on
    its ARM-based rivals?


    That is Intel pushing its products into the embedded space is no secret. Their
    company presentations at the Consumer Electronics Show in Las Vegas this year
    concentrated on efforts to turn chip design how smartphones to Internet of Things
    (IoT) sensor networks. The MinnowBoard is a big part of that.


    Compatibility was poor despite Intel using a Yocto-compliant board support package
    (BSP). Coupled with relatively poor performance from its single-core 32-bit processor
    it is hard to say MinnowBoard was not a complete success.


    The original MinnowBoard launched back in 2013 as a quad-core 32-bit ARM-Cortex-A9
    board was an open-hardware development platform designed for everyone from engineers
    to hobbyists looking for a new toy.


    Success is, however, when we have as much money to invest in these projects failures
    are simple to learn and learn from. The MinnowBoard Max was a success in development
    and production which has no doubt. As well as being considerably smaller a quick
    glance at the specifications shows that Intel and its co-partner have been listening
    to feedback from users.


    Adoption of the MinnowBoard was slow however. Use of a 32-bit UEFI firmware that
