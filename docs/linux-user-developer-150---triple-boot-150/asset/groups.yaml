    有了所有可用工具的帮助，使用 btrfs 让你的生活变得更轻松。它是下一代文件系统真正卓越的概念，现在加入是一个很好的主意。\n\n> $ btrfs volume\
    \ list btrfs/volume1\n\n### 19 设置默认\n记下快照的 ID（例如 258），然后使用将其设置为子卷的默认：\n\n"
