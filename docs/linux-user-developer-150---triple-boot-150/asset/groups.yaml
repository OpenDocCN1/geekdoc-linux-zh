    ## Facebook opens machine learning models


    The research arm of smart goal Facebook has released a series of models designed
    to improve the ability of torch in any environment to handle deep-learning tasks.


    accelerates when scientists share not just results, but also their tools and methods.
    This is one of the reasons why Facebook AI is leading in open science and open-using
    its tools.


    "These modules are significantly faster than those available previously and accelerated
    our research projects by allowing us to train larger neural nets in less time,"
    claimed Facebook''s Smith Chintala of the release. ''Progress in science and technology...''


    Included are modules for GPU-optimised kernels used naturally in large language
    networks and processing applications. The majority of the modules are based on
    NVIDIA''s CUDA GPGPU offload.


    www.linuxuser.com


    ## OpenSource


    Your source of Linux news and views

    www.linuxuser.co.uk Email us directly... linuxuser@imagining-publishing.co.uk

