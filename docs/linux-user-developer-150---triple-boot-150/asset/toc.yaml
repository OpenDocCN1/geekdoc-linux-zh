- - '##'
  - LaTeX 公司，第二版，Wesley，2004。Donald Knuth 在1970 年创建了 TEX 作为一种排版语言，在计算机上编写后程序还不够，最大的选择是在
    LaTeX 和 InDesign 之间。LaTeX 被证明是最佳选择。它的起源于 C 编程，但它有很多命令难以使用，Leslie Lamport 让它变得更容易。他编写了许多高级命令并被广泛使用。许多人想要排版大约350
    页的著作。这篇文章对于那些从未听说过它如此流行的人，你应该知道它帮助许多作者轻松完成工作。
