  trans: "\n\n# 日期\n`date` 命令打印系统日期和时间。\n\n语法：`date [OPTION]... [FORMAT]...`\n\n##\
    \ 命令选项(标志)\n### \n- `date -r` 或 `date --reference=FILE` : 此标志用于显示 `FILE` 的最后修改时间\n\
    - `date -s` 或 `date --set=STRING` : 此标志用于设置或更改笔记本电脑或电脑上的系统日期\n- `date -u` 或 `date\
    \ --utc` 或 `date --universal` : 此标志打印协调世界时 (UTC)\n- `date --help` : 显示此帮助信息并退出\n\
    - `date --version` : 输出版本信息并退出\n- `man date` : 此命令帮助你打印帮助页信息。\n\n### 格式选项\n- `+%a`\
    \ : 打印星期简写（例如 Sun）\n- `+%A` : 打印本地区域的完整星期名称（例如 Sunday）\n- `+%b` : 打印本地区域的月份缩写（例如\
    \ Jan）\n- `+%B` : 打印本地区域的完整月份名称（例如 January）\n- `+%c` : 打印本地区域的日期和时间（例如 Thu Mar\
    \ 3 23:05:25 2005）\n- `+%C` : 打印年份后两位（例如 20）\n- `+%d` : 打印月份中的几（例如 01）\n- `+%D`\
    \ : 打印格式与 `%m/%d/%y` 相同的日期\n- `+%e` : 打印日期（例如 1-31）\n- `+%F` : 打印与 `%Y-%m-%d`\
    \ 相同的完整日期\n- `+%g` : ISO 周数年份的后两位（参见 `%G`）\n- `+%G` : ISO 周数的年份（参见 `%V`）；通常只配合\
    \ `%V` 使用\n- `+%h` : 与 `%b` 相同\n- `+%H` : 小时（00..23）\n- `+%I` : 小时（01..12）\n-\
    \ `+%j` : 一年中的第（001..366）\n- `+%m` : 月份（01..12）\n- `+%M` : 分（00..59）\n- `+%n`\
    \ : 添加换行符\n- `+%N` : 打印纳秒（000000000..999999999）\n- `+%p` : 打印本地区域对应的 AM 或 PM；如果未知则留空\n\
