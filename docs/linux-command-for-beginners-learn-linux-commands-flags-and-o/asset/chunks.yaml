    # userdel Command


    `userdel`: `userdel` command in the Linux system is used to delete a user account
    and related files.


    ### Syntax

    `userdel [OPTIONS] UserName`


    ### Command Options(Flags)

    | Option | Description |

    | :--- | :--- |

    | `userdel -r` or `userdel --remove` | Use the `-r` flag to force `userdel` to
    remove the user’s home directory also. |

    | `userdel -h` or `userdel --help` | Display help message and exit. |

    | `userdel -f` or `userdel --force` | This option forces the removal of the user
    account, even if the user is still logged in. It also forces `userdel` to remove
    the user''s home directory and mail spool, even if another user uses the same
    home directory or if the mail spool is not owned by the specified user.


    # sudo Command


    `sudo`: The `sudo` (Super User DO) command allows you to run programs with the
    security privileges of another user, by default the root user. `sudo` is one of
    the commands that you will use quite frequently.


    ### Syntax

    `sudo [OPTION] [COMMAND]`


    ### Command Options(Flags)

    | Option | Description |

    | :--- | :--- |

    | `sudo -V` or `sudo --version` | The option prints the Sudo command version.
    |

    | `sudo -l` | The `-l` option will print out the commands allowed Commands List.
    |

    | `sudo -h` or `sudo --help` | The `-h` (help) option prints a short help message
    and exit. |

    | `sudo -v` | If, given the `-v` (validate) option, `sudo` will update the user’s
    timestamp, prompting for the user’s password if necessary. This extends the `sudo`
    timeout for another 5 minutes (or as given in `sudoers`) but does not run a command.
    This does not give any output. |

    | `sudo -k` | The `-k` (kill) option to `sudo` invalidates the user’s timestamp.
    So, the next time `sudo` is run a password will be required. This option does
    not require a password and was added to allow a user to revoke sudo permissions
    from a logout file. |

    | `sudo -K` | Similar to the `-k` option, the `-K` (sure kill) option is used
    to remove the user’s timestamp entirely. Likewise, this option does not require
    a password. |

    | `sudo -b` | The `-b` (background) option tells Run the given command in the
    background. Note that it is not possible to use shell job control to manipulate
    background processes started by `sudo`. Most interactive commands will fail to
    work properly in background. |

    | `sudo -p` | The `-p` (prompt) option allows you to override the default password
    prompt and use a custom one. |


    # apt-get Command


    `apt-get`: `apt-get` is the command-line tool for handling packages inside the
    Debian Linux system. Debian uses the `dpkg` packaging system. A packaging system
    is a way to provide programs and applications for installation. `APT` (Advanced
    Package Tool) is the command-line tool to interact with this packaging system.
    you can use it to find and install new packages, upgrade packages, clean your
    packages, etc.


    ### Syntax

    `sudo apt-get [options] command`


    ### Commands

    | Command | Description |

    | :--- | :--- |

    | `update` | update Comand Use To Update Own Package in Your Laptop. `update`
    Command is a resynchronize the package index files from their sources. The indexes
    of available packages are fetched from the location(s) specified in `/etc/apt/sources.list`.
    This command helps update your own package inside your laptop or pc. |

    | `upgrade` | This command is used to install the latest versions of the packages
    currently installed on the user’s system. |

    | `install` | `install` Command is followed by one or more packages desired for
    installation or upgrading in Your System. Each package is an Install By package
    name inside your system. |

    | `remove` | this command similar to `Install` Command But mainly difference being
    that it removes the packages instead of installing them. It does not remove any
    configuration files created by the package. |

    | `prge` | this command removes the packages, and also removes any configuration
    files related to the packages. |

    | `check` | This command is used to update the package cache and checks for broken
    dependencies. |

    | `download` | This command is used to download the given binary package in the
    current directory. |

    | `autoremove` | Sometimes the packages which are automatically installed to satisfy
    the dependencies of other packages, are no longer needed. The `autoremove` command
    is used to remove these kinds of packages. |


    ### Command Options(Flags)

    | Option | Description |

    | :--- | :--- |

    | `apt-get -q` or `apt-get --quiet` | When this option is specified, `apt-get`
    produces an output that is suitable for logging. |

    | `apt-get -V` or `apt-get --verbose-versions` | Show full versions for upgraded
    and installed packages. |

    | `apt-get --reinstall` | Re-install packages that are already installed and at
    the newest version. |

    | `apt-get -h` or `apt-get --help` | This Command Show a short usage summary.
    |

    | `apt-get -v` or `apt-get --version` | This Command Show the program version
    in Your CMD. |


    *Note. We Cover Few Command Or Option Plz Read Manual Page For More Update.*


    # grep Command


    `grep`: `grep` Command is a Linux based command-line tool used to search for a
    string and patterns of characters in a specified file.


    ### Syntax

    `grep [OPTION...] PATTERNS [FILE]`


    ### Commands

    | Command | Description |

    | :--- | :--- |

    | `grep --help` | Output a usage message and exit. |

    | `grep -V` or `grep --version` | Output the version of grep and exit. |

    | `grep -i` or `grep --ignore-case` | this flag To Match Word sensitive and Case
    Insensitive. |

    | `grep -c` | This prints only a count of the lines that match. |

    | `grep -h` | Display the matched lines, but not display the filenames. |

    | `grep -i` or `grep --ignore-case` | this flag To Match Word sensitive and Case
    Insensitive. |

    | `grep -l` | Displays a list of filenames. |

    | `grep -n` | Display the matched lines and their line numbers. |

    | `grep -v` | This prints out all the lines that do not matches |

    | `grep -e` | Specifies expression with this option. Can use multiple times. |

    | `grep -f` | Takes patterns from a file, one per line. |

    | `grep -E` | Treats pattern as an extended regular expression (ERE) |

    | `grep -w` | Match whole word |

    | `grep -o` | Print only the matched parts of a matching line, with each part
    on a separate output line. |


    *Note: Read All Option Go To Read Manual Page.*


    # chmod Command


    `chmod`: We can use the `chmod` command which stands for ''change mode''. Using
    the command, we can set permissions (read, write, execute) on a file/directory.


    ### Syntax

    `chmod [Option]... [Permissions] fileName`


    The three digits define permissions for the user, group, and others.

    - `r`: Permission to read the file.

    - `w`: Permission to write (or delete) the file.

    - `x`: Permission to execute the file.


    ### Permissions Example

    | Symbolic | Numeric | Description |

    | :--- | :--- | :--- |

    | `rwx` | 111 | Read, write and execute |

    | `rw-` | 110 | Read and write |

    | `r-x` | 101 | read and execute |

    | `r--` | 100 | Read-only |

    | `-wx` | 011 | Write and execute |

    | `-w-` | 010 | Write only |

    | `--x` | 001 | Execute only |

    | `---` | 000 | None |


    ### Command Options(Flags)

    | Option | Description |

    | :--- | :--- |

    | `chmod -R` or `chmod --recursive` | change files and directories recursively
    |

    | `chmod --help` | display this help and exit |

    | `chmod --version` | output version information and exit |


    `man chmod`: this flags use for Read Manual Pages.

