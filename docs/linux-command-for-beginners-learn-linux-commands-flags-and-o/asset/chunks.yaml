    # rm Command


    `rm` command Help To remove files or directories Both.


    **Syntax:**

    `rm [OPTION]... [FILE]...`


    | Command Options (Flag) | Description |

    | :--- | :--- |

    | `rm -f` or `rm --force` | This Flag Remove All File Or Directory Without asking
    Prompt Permission. |

    | `rm -i` | this Command Option Firstly Ask You Permission use Prompt To Delete
    File. You Give Yes, Then Delete a File. |

    | `rm -I` | Ask Only One Time Permission With prompt. Then Remove All File. |

    | `rm -r` or `rm -R`, or `rm --recursive` | This Flag removes directories , subdirectories
    , and File With their contents recursively. |

    | `rm -d` or `rm --dir` | This Flag remove Only empty directories |


    *   `rmdir -v` or `mkdir –verbose`: explain what is Behind Working is done

    *   `rmdir --help`: display this help and exit.

    *   `rmdir –version`: output `mkdir` Command version information Information.

    *   `man rmdir`: print `rmdir` manual page Information Inside Your Cmd Tool


    ### Quiz About rm Command


    **Q1. Remove `test.txt` File Without Prompt Permission?**

    Ans. `pi@raspberrypi:~$ rm -f test.txt`


    **Q2. How To Remove Multiple Files?**

    Ans. `pi@raspberrypi:~$ rm -f test.txt test2.txt`


    **Q3. Remove My Subdirectory and File Also Without Prompt Permission?**

    Ans. `pi@raspberrypi:~$ rm -r test`


    **Q4. How To Remove an Empty Linux Directory?**

    Ans. `pi@raspberrypi:~$ rm -d Linux`


    # Chapter 10 cp Command


    `cp`: use `cp` Command Help To copy files and directories Inside Your Laptop.


    **Syntax:**

    `cp [OPTION]... SOURCE... DIRECTORY`


    | Command Options (Flag) | Description |

    | :--- | :--- |

    | `cp -i` or `cp --interactive` | this Flag Ask You Permission With prompt before
    overwrite Your Files |

    | `cp -R` or `cp -r` or `cp –recursive` | This Flag Use For copy Your directories
    with All Files. |


    *   `rmdir -v` or `mkdir –verbose`: Print explain message what’s being Work Done,
    inside terminal.

    *   `rmdir --help`: display this help and exit.

    *   `rmdir –version`: output `mkdir` Command version information Information.

    *   `man rmdir`: print `rmdir` manual page Information Inside Your Cmd Tool.


    **Note:** Read Man Page For Cover All Information about `cp` Command.


    ### Quiz About cp Command


    **Q.1 How To Copy Entire Javascript Directory With All File in `js` Directory?**

    Ans. `pi@raspberrypi:~ $ cp -r javascript js`


    **Q.2 How to Open `cp` Man Page Documents?**

    Ans. `pi@raspberrypi:~ $ man cp`


    # Chapter 11 wc Command


    `wc`: `wc` command provides word, and byte counts for each file.


    **Syntax:**

    `wc [OPTION]... [FILE]...`


    | Command Options (Flag) | Description |

    | :--- | :--- |

    | `wc -c` or `wc –bytes` | this Flag Help To print the Size Of the File In byte.
    |

    | `wc -m` or `wc --chars` | This Flag prints the character counts of the File.
    |

    | `wc -l` or `wc --lines` | print Total line counts In File. |

    | `wc -L` or `wc –max-line-length` | print the Longest Line in File. |

    | `wc -w` or `wc --words` | print Total word counts In File. |

    | `wc --help` | display this help and exit. |


    *   `wc –version`: output `wc` Command version information Information.

    *   `man wc`: print `wc` manual page Information Inside Your Cmd Tool


    ### Quiz About wc Command


    **Q.1 How To Count File Lines?**

    Ans. `pi@raspberrypi:~ $ wc -l manCommand.txt`


    **Q.2 How To Count File Words?**

    Ans. `pi@raspberrypi:~ $ wc -w manCommand.txt`


    **Q.3 Run `wc` Command On Multiple File?**

    Ans. `pi@raspberrypi:~ $ wc ls.txt test.txt`


    **Q.4 How To Find File Size in `wc` Command?**

    Ans. `pi@raspberrypi:~ $ wc -c ls.txt`


    # Chapter 12 cd Command


    `cd`: The `cd` (change directory) command is used to change the current working
    directory in Linux. `cd` is not a command, it''s built into your shell by default.
    This is necessary because your current working directory is controlled by the
    `PWD` environment variable named after the `pwd` or "print working directory"
    command.


    **Syntax:**

    `cd [Directory]`

    `cd [-L|[-P [-e]] [-@]] [Directory]`


    | Command Options (Flag) | Description |

    | :--- | :--- |

    | `cd ~` | Goto Home Directory |

    | `cd ..` | Go One Folder Back |

    | `cd –help` | Go To Help Page |


    ### Quiz About cd Command


    **Q.1 You are Currently in the `/home/pi/Documents/Linux/Linux Book` Directory,
    to Switch to The `/home/pi/Documents` directory?**

    Ans. `pi@raspberrypi:~$ cd ..`


    **Q.2 You are Currently in `/home/pi/Documents/Linux`, to Switch to The `Linux
    Book` directory?**

    Ans. `pi@raspberrypi:~/Linux $ cd ".."`


    # Chapter 13 mv Command


    `mv`: `mv` Command Help move File One Place and rename


    **Syntax:**

    `mv [OPTION]... SOURCE... DIRECTORY`


    | Command Options (Flag) | Description |

    | :--- | :--- |

    | `mv -f` or `mv --force` | This Flag Overwrite File Without asking Permission
    |

    | `mv -i` or `mv --interactive` | This Option Firstly Ask You Permission use Prompt
    To overwrite File. |

    | `mv -v` or `mv –verbose` | explain what is done |


    *   `mv --help`: display this help.

    *   `mv –version`: output your version information.


    ### Quiz About mv Command


    **Q.1 How To Move `linux.txt` Inside Folder?**

    Ans. `pi@raspberrypi:~$ mv linux.txt`


    **Q.2 How To Overwrite File With Permission?**

    Ans. `pi@raspberrypi:~$ mv -i linux.txt`


    # Chapter 14 cat Command


    `cat`: `cat` ( concatenate ) command allows us to create single or multiple files,
    view contain


    **Syntax:**

    `cat [OPTION]... [FILE]...`


    | Command Options (Flag) | Description |

    | :--- | :--- |

    | `cat -A` or `cat --show-all` | Print Everything Inside File. |

    | `cat -b` or `cat --number-blank` | Print Line number With File. |

    | `cat -E` or `cat –show-ends` | display $ Symbol at end of line. |

    | `cat -n` or `cat --number` | Print Line number With File. |


    *   `cat --help`: display this help and exit.

    *   `cat --version`: output `cat` version information.

    *   `man cat`: print `cat` manual page Information Inside Your Cmd Tool


    ### Quiz About cat Command


    **Q.1 How To Print `cat.txt` Content Inside Cmd Tool?**

    Ans. `pi@raspberrypi:~$ cat.txt`


    **Q.2 How To Open `cat` Manual Pages Inside Cmd Tool?**

    Ans. `pi@raspberrypi:~~$ man cat`


    **Q.3 How To Save Manual Page Inside Your Operating System?**

    Ans. `pi@raspberrypi:~~$ man cat > cat.txt`


    # Chapter 15 touch Command


    `touch`: `touch` update file timestamps and Create New Empty File.


    **Syntax:**

    `touch [OPTION]... FILE`


    | Command Options (Flag) | Description |

    | :--- | :--- |

    | `touch -a` | This Flag change only the access time In File |

    | `touch -c` or `touch --no-create` | if your File Not Exit This Flag do not create
    any Empty file. |

    | `touch -d` or `touch --date=""MM DD"` | This Flag Help To assign Custom time
    and Date in Your File. |

    | `touch -m` | this flag changes only the modification time. |

    | `touch -t “MMDDhhmm” | this flag Help To add own Time and Date On Your File.
    |

    | `touch --time=”WORD"` | this Flag Help To Set Time Using Arguments |


    | Arguments for --time flag | |

    | :--- | :--- |

    | `atime`, `access`, `use` | equivalent to `-a` |

    | `mtime`, `modify` | equivalent to `-m` |


    *   `touch --help`: display this help and exit.

    *   `touch --version`: output `touch` Command version information.

    *   `man touch`: print `touch` manual page Information Inside Your Cmd Tool


    ### Quiz About touch Command


    **Q.1 How To Create Empty File Use Of Touch Command?**

    Ans. `pi@raspberrypi:~~$ touch linuxBlog.txt`


    **Q.2 How To Modify Custom Date In File?**

    Ans. `pi@raspberrypi:~~$ touch --date="Jan 01" linuxBlog.txt`


