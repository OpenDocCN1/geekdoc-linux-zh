    ## Chapter 1: Linux Shortcut Keys For Terminal

    ### Terminal Shortcuts:

    * `Ctrl + L`: Clears the screen.

    * `Ctrl + S`: Stops the output.

    * `Alt + Tab`: Switch windows.

    * `Ctrl + A`: Goes to the start of the line.

    * `Ctrl + E`: Goes to the end of the line.

    * `Ctrl + F`: Move cursor forward one character.

    * `Ctrl + B`: Move cursor backward one character.

    * `Alt + F`: Move cursor forward one word.

    * `Alt + B`: Move cursor backward one word.

    * `Ctrl + U`: Change characters to uppercase.

    * `Alt + l`: Change characters to lowercase.

    * `Alt + T`: Swap words.

    * `Alt + D`: Delete from cursor to the end of the line.

    * `Ctrl + K`: Cut the line from the current position to the end.

    * `Ctrl + W`: Delete the word before the cursor.

    * `Ctrl + Y`: Paste the last cut item.

    * `Ctrl + D`: Delete character by character.

    * `Ctrl + T`: Remove white space.

    * `Shift + Ctrl + W`: Close tab.

    * `Shift + Ctrl + Q`: Close the entire terminal.

    * `Shift + Ctrl + N`: Open new window.

    * `Shift + Ctrl + T`: Open new tab in window.

    * `Shift + Ctrl + C`: Copy text inside terminal.

    * `Shift + Ctrl + V`: Paste text inside terminal.

    * `Shift + Ctrl + +`: Zoom in.

    * `Shift + Ctrl + -`: Zoom out.

    * `Shift + Ctrl + )`: Zoom reset.

    * `Shift + Ctrl + I`: Add name to each open tab.


    ## Chapter 2: Basic Text Editor Command

    ### nano

    `nano` is a small and friendly editor inside your cmd tool.

    `nano [options] [file ..]`


    ## Chapter 3: Basic Operating Command

    ### vim

    `vim` is a text editor. It can be used to edit all kinds of programming languages.
    It is especially useful for editing inside cmd tool.

    `vim [options] [file ..]`


    ### whatis

    `whatis` command helps to display manual pages'' small descriptions.

    `whatis [CommandName...]`

