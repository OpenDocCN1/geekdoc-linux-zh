    ## 第一章：Linux 终端快捷键

    ### 终端快捷键：

    * `Ctrl + L`: 清除屏幕。

    * `Ctrl + S`: 停止输出。

    * `Alt + Tab`: 切换窗口。

    * `Ctrl + A`: 回到首。

    * `Ctrl + E`: 回到行尾。

    * `Ctrl + F`: 光标向前移动一个字符。

    * `Ctrl + B`: 光标向后移动一个字符。

    * `Alt + F`: 光标向前一个单词。

    * `Alt + B`: 光标向后一个单词。

    * `Ctrl + U`: 将字符转换为大写。

    * `Alt + l`: 将字符转换为小写。

    * `Alt + T`: 交换单词。

    * `Alt + D`: 删除光标到行尾的内容。

    * `Ctrl + K`: 剪切从当前位置到行尾的内容。

    * `Ctrl + W`: 删除光标前的单词。

    * `Ctrl + Y`: 粘贴上次剪切的内容。

    * `Ctrl + D`: 逐字符删除。

    * `Ctrl + T`: 删除空白字符。

    * `Shift + Ctrl + W`: 关闭标签页。

    * `Shift + Ctrl + Q`: 关闭整个终端。

    * `Shift + Ctrl + N`: 打开新窗口。

    * `Shift + Ctrl + T`: 在窗口中打开新标签页。

    * `Shift + Ctrl + C`: 复制终端内文本。

    * `Shift + Ctrl + V`: 粘贴终端内文本。

    * `Shift + Ctrl + +`: 放大。

    * `Shift + Ctrl + -`: 缩小。

    * `Shift + Ctrl + )`: 重置比例。

    * `Shift + Ctrl + I`: 为每个打开的标签页添加名称。


    ## 第二章：基础文本编辑器命令

    ### nano

    `nano` 是命令行中一个小且友好的编辑器。

    `nano [options] [file ..]`


    ## 第三章：基础操作命令

    ### vim

    `vim` 是一个文本编辑器。它可以编辑各种编程语言。它在命令行中编辑时特别有用。

    `vim [options] [file ..]`


    ### whatis

    `whatis` 命令有助于显示帮助页的简短描述。

    `whatis [CommandName...]`


