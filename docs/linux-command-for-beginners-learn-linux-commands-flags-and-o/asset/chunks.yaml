    **Q.1** How to kill multiple processes by kill command?\nAns. `pi@raspberrypi:~\
    \ $ kill 2326 2349`\n\n**Q.2** How to kill all processes currently running on\
    \ my laptop?\nAns. `pi@raspberrypi:~ $ kill -9 -1`\n"
