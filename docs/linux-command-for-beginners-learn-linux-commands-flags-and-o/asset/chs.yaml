  ---\n\n## tar 命令\n`tar` 命令用于文件归档。\n\n### 描述\n- `-c` : 创建新归档\n- `-x` : 从归档中提取文件\n\
  - `-v` : 详细输出\n- `-f` : 使用归档文件\n- `-z` : 使用 gzip 压缩\n- `-j` : 使用 bzip2 压缩\n- `-n`\
  \ : 在后添加换行\n- `-u` : 更新归档中的文件\n- `-t` : 列出归档中的文件\n- `-r` : 向归档追加文件\n- `-W` : 提取后列出文件\n\
  - `-P` : 不提取领先斜杠\n\n---\n\n## groups 命令\n`groups` 显示用户所属的组。\n\n### 描述\n- `groups`\
  \ : 列出当前用户的组\n\n---\n\n## groupadd 命令\n`groupadd` 命令创建一个新组。\n\n字体 选项\n- `-r` : 创建系统组\n\
  - `-f` : 即使组存在也强制创建\n- `-g` : 指定 GID\n- `-o` : 允许非唯一的 GID\n- `-p` : 设置加密密码\n- `-K`\
  \ : 覆盖 GID_MIN 和 GID_MAX 设置\n\n---\n\n## groupdel 命令\n`groupdel` 命令删除现有组。\n\n###\
  \ 选项\n- `-R` : 在根目录下应用更改\n\n---\n\n## group 命令\n`group` 命令提供组数据库的信息。\n\n---\n\n\
  ## useradd 命令\n`useradd` 命令用于在系统中创建新用户。\n\n\n\n\n\n## userdel 命令\n\n`userdel`: Linux\
  \ 系统中的 `userdel` 命令用于删除用户账户及相关文件。\n\n### 语法\n`userdel [OPTIONS] UserName`\n\n###\
  \ 命令选项(标志)\n| 选项 | 描述 |\n| :--- | :--- |\n| `userdel -r` 或 `userdel --remove` |\
  \ 使用 `-r` 标志强制 `userdel` 同时删除用户的家目录。 |\n| `userdel -h` 或 `userdel --help` | 显示帮助信息并退出。\
  \ |\n| `userdel -f` 或 `userdel --force` | 此选项强制删除用户账户，即使该用户仍登录登录。它还会强制 `userdel`\
  \ 删除用户的家目录和邮件邮箱，即使有其他用户正在使用该家目录，或者该邮件邮箱的所有者不是指定的该用户。 |\n\n## sudo 命令\n\n`sudo`:\
  \ `sudo` (Super User DO) 命令允许你以另一个用户（默认是 root 用户）的安全权限运行程序。`sudo` 是你会非常频繁地使用的命令之一。\n\
  \n### 语法\n`sudo [OPTION] [COMMAND]`\n\n### 命令选项(标志)\n| 选项 | 描述 |\n| :--- | :---\
  \ |\n| `sudo -V` 或 `sudo --version` | 该选项打印 Sudo 命令的版本。 |\n| `sudo -l` | `-l` 选项将打印允许的命令列表。\
  \ |\n| `sudo -h` 或 `sudo --help` | `-h` (help) 选项打印简短帮助信息并退出。 |\n| `sudo -v` | 如果给出\
  \ `-v` (validate) 选项，`sudo` 将更新用户的时间戳，必要时提示用户输入密码。这会将 `sudo` 的超时时间延长 5 分钟（或在 sudoers\
  \ 中指定的时间），但不会运行命令。这不会产生任何输出。 |\n| `sudo -k` | `sudo` 的 `-k` (kill) 选项使用户的时间戳失效。因此下次运行\
  \ `sudo` 时需要密码。此选项不需要密码，添加目的是允许用户从注销文件中撤销 sudo 权限。 |\n| `sudo -K` | 与 `-k` 选项类似，`-K`\
  \ (sure kill) 选项用于完全移除用户的时间戳。同样，此选项不需要密码。 |\n| `sudo -b` | `-b` (background) 选项告诉在后台运行指定的命令。注意，无法使用\
  \ shell 作控制来操作由 sudo 启动的后台进程。大多数交互式命令在后台将无法正常工作。 |\n| `sudo -p` | `-p` (prompt)\
  \ 选项允许你覆盖默认密码提示并使用自定义提示。 |\n\n## apt-get 命令\n\n`apt-get`: `apt-get` 是处理 Debian Linux\
  \ 系统内部软件包的命令行工具。Debian 使用 `dpkg` 软件包系统。软件包系统是一种提供程序和应用程序安装的方式。`APT` (高级软件包工具) 是与此软件包系统交互的命令行工具。你可以用它查找并安装新包、升级包、清理包等。\n\
  \n### 语法\n`sudo apt-get [options] command`\n\n### 命令\n| 命令 | 描述 |\n| :--- | :---\
  \ |\n| `update` | `update` 命令用于更新你笔记本电脑的软件包索引。`update` 命令是从源处重新同步软件包索引文件。可用软件包的索引是从\
  \ `/etc/apt/sources.list` 中指定的位置获取的。此命令帮助更新你笔记本电脑或电脑内部的软件包。 |\n| `upgrade` | 此命令用于安装用户系统中当前安装的软件包的最新版本。\
  \ |\n| `install` | `install` 命令后跟一个或多个在系统中想要安装或升级的软件包。系统中的每个包都通过其包名进行安装。 |\n| `remove`\
  \ | 此命令类似于 `Install` 命令，但主要区别是它移除软件包而不是安装它们。它不会移除由软件包创建的任何配置文件。 |\n| `purge` | 此命令移除软件包，并同时移除与软件包相关的任何配置文件。\
  \ |\n| `check` | 此命令用于更新软件包缓存并检查损坏的依赖关系。 |\n| `download` | 此命令用于在当前目录下载指定的二进制包。\
  \ |\n| `autoremove` | 有时，为了满足其他包的依赖而自动安装的包可能不再需要。`autoremove` 命令用于移除此类包。 |\n\n###\
  \ 命令选项(标志)\n| 选项 | 描述 |\n| :--- | :--- |\n| `apt-get -q` 或 `apt-get --quiet` | 当指定此选项时，`apt-get`\
  \ 产生的输出适用于日志记录。 |\n| `apt-get -V` 或 `apt-get --verbose-versions` | 显示已升级和已软件包的完整版本。\
  \ |\n| `apt-get --reinstall` | 重新安装已安装且为最新版本的软件包。 |\n| `apt-get -h` 或 `apt-get --help`\
  \ | 此命令显示简短的使用摘要。 |\n| `apt-get -v` 或 `apt-get --version` | 此命令在你的 CMD 中显示程序版本。\
  \ |\n\n*注意。我们涵盖了一些命令或选项，请阅读手册页以获取更多更新。*\n\n## grep 命令\n\n`grep`: `grep` 命令是一种基于\
  \ Linux 的命令行工具，用于在指定文件中搜索字符串和模式。\n\n### 语法\n`grep [OPTION...] PATTERNS [FILE]`\n\
  \n### 命令\n| 命令 | 描述 |\n| :--- | :--- |\n| `grep --help` | 输出用法信息并退出。 |\n| `grep\
  \ -V` 或 `grep --version` | 输出 grep 版本并退出。 |\n| `grep -i` 或 `grep --ignore-case`\
  \ | 此标志用于区分大小写敏感和不区分大小写。 |\n| `grep -c` | 仅打印匹配的行数。 |\n| `grep -h` | 显示匹配的行，但不显示文件名。\
  \ |\n| `grep -i` 或 `grep --ignore-case` | 此标志用于区分大小写敏感和不区分大小写。 |\n| `grep -l` |\
  \ 显示文件名列表。 |\n| `grep -n` | 显示匹配的行及其行号。 |\n| `grep -v` | 打印所有不匹配的行。 |\n| `grep -e`\
  \ | 指定表达式。可以使用多次。 |\n| `grep -f` | 从文件读取模式，每行一个。 |\n| `grep -E` | 将模式视为扩展正则表达式 (ERE)。\
  \ |\n| `grep -w` | 匹配整个单词。 |\n| `grep -o` | 仅打印匹配的部分，每个部分单独占一行输出。 |\n\n*注意：阅读手册页查看所有选项。*\n\
  \n## chmod 命令\n\n`chmod`: 我们可以使用 `chmod` 命令，意为“更改模式”。使用该命令，我们可以为文件/目录设置权限（读、写、执行）。\n\
  \n### 语法\n`chmod [Option]... [Permissions] fileName`\n\n三个数字定义了用户、组和其他人的的权限。\n-\
  \ `r`: 读取文件的权限。\n- `w`: 写入（或删除）文件的权限。\n- `x`: 执行文件的权限。\n\n### 权限示例\n| 符号 | 进制 |\
  \ 描述 |\n| :--- | :--- | :--- |\n| `rwx` | 111 | 读、写、执行 |\n| `rw-` | 110 | 读、写 |\n\
  | `r-x` | 101 | 读、执行 |\n| `r--` | 100 | 仅读 |\n| `-wx` | 011 | 写、执行 |\n| `-w-` |\
  \ 010 | 仅写 |\n| `--x` | 001 | 仅执行 |\n| `---` | 000 | 无 |\n\n### 命令选项(标志)\n| 选项 |\
  \ 描述 |\n| :--- | :--- |\n| `chmod -R` 或 `chmod --recursive` | 递归地更改文件和目录 |\n| `chmod\
  \ --help` | 显示此帮助并退出 |\n| `chmod --version` | 输出版本信息并退出 |\n\n`man chmod`: 此标志用于阅读手册页。\n\
  \n"
