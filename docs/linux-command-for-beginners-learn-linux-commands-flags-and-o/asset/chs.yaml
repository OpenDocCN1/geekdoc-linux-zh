- "# Linux 命令初学者指南：用简单方法学习 Linux 命令、标志和选项\n\n\n\n![](img/image_rsrc1F6.jpg)\n![](img/image_rsrc1F7.jpg)\n\
  \n\n## 关于作者\n你好，我叫 Rajdeep Singh。我编写这本书是因为我经常在 Linux 命令标记（flags）或选项上遇到困惑。我开始访问网站、阅读书籍以及一些提供信息的文章，但那些文章都太老了。于是，我意识到了这个问题，找到了资源，并开始编写一本关于\
  \ Linux 命令行标记的书。我对这本书的梦想是：清晰清晰，每个人都能为这本书贡献力量并改进它。这本书免费供大家阅读和改进。\n\n### 了解更多关于作者：\n\
  * [https://medium.com/officialrajdeepsingh/my-learning-path-biology-to-computer-science-70bec32db8ea]\n\
  * [https://officialrajdeepsingh.medium.com/]\n* [https://www.officialrajdeepsingh.dev/]\n\
  \n### 联系作者：\n* [https://www.officialrajdeepsingh.dev/contact-me/]\n* officialrajdeepsingh@gmail.com\n\
  \n## 如何贡献\n### 如何贡献？\n如果你想为开源书籍做出贡献，请确保你有自己的 GitHub 账户并提供你的电子邮件（用于认证）。如果你参与贡献，请确保你有自己的\
  \ GitHub 账户并需要电子邮件（用于认证）。\n\n## 法律声明\n版权所有。未经出版者许可，不得得以任何形式（电子、机械、复印、扫描或其他方式）复制、存储或传输本书的任何部分。这样做属于违法行为，风险自担。作者对可能造成的损害不承担任何责任。\n\
  \n## 引言\n### 什么是 Linux？\nLinux 是一个开源类 Unix 操作系统，由 Linus Torvalds 于 1991 年 9 月发布。它是最流行的平台，用于\
  \ Android 系统和服务器。\n\n### 谁在使用 Linux？\nLinux 无处不在，包括 Windows、macOS 和 iOS。\n\n###\
  \ 参考文献\n* [en.wikipedia.org/wiki](https://en.wikipedia.org/wiki)\n* [linux.com/what-is-linux](https://linux.com/what-is-linux)\n\
  \n### 内容简介\n本书涵盖了 Linux 命令和标记。如果你想学习更多，请查看示例和内容。作者试图在书中许多标记。\n\n### 为什么要写这本书？\n\
  查看 YouTube 播放列表：\n* [`www.youtube.com/playlist?list=PLUzr48G11X_S_S_S_S_S_S_S_S_S_S_S`](https://www.youtube.com/playlist?list=PLUzr48G11X_S_S_S_S_S_S_S_S_S_S_S)\
  \ (保持链接结构不变)\n\n## 第一章：Linux 终端快捷键\n### 终端快捷键：\n* `Ctrl + L`: 清除屏幕。\n* `Ctrl + S`:\
  \ 停止输出。\n* `Alt + Tab`: 切换窗口。\n* `Ctrl + A`: 回到首。\n* `Ctrl + E`: 回到行尾。\n* `Ctrl\
  \ + F`: 光标向前移动一个字符。\n* `Ctrl + B`: 光标向后移动一个字符。\n* `Alt + F`: 光标向前一个单词。\n* `Alt +\
  \ B`: 光标向后一个单词。\n* `Ctrl + U`: 将字符转换为大写。\n* `Alt + l`: 将字符转换为小写。\n* `Alt + T`: 交换单词。\n\
  * `Alt + D`: 删除光标到行尾的内容。\n* `Ctrl + K`: 剪切从当前位置到行尾的内容。\n* `Ctrl + W`: 删除光标前的单词。\n\
  * `Ctrl + Y`: 粘贴上次剪切的内容。\n* `Ctrl + D`: 逐字符删除。\n* `Ctrl + T`: 删除空白字符。\n* `Shift\
  \ + Ctrl + W`: 关闭标签页。\n* `Shift + Ctrl + Q`: 关闭整个终端。\n* `Shift + Ctrl + N`: 打开新窗口。\n\
  * `Shift + Ctrl + T`: 在窗口中打开新标签页。\n* `Shift + Ctrl + C`: 复制终端内文本。\n* `Shift + Ctrl\
  \ + V`: 粘贴终端内文本。\n* `Shift + Ctrl + +`: 放大。\n* `Shift + Ctrl + -`: 缩小。\n* `Shift\
  \ + Ctrl + )`: 重置比例。\n* `Shift + Ctrl + I`: 为每个打开的标签页添加名称。\n\n## 第二章：基础文本编辑器命令\n\
  ### nano\n`nano` 是命令行中一个小且友好的编辑器。\n`nano [options] [file ..]`\n\n## 第三章：基础操作命令\n\
  ### vim\n`vim` 是一个文本编辑器。它可以编辑各种编程语言。它在命令行中编辑时特别有用。\n`vim [options] [file ..]`\n\n\
  ### whatis\n`whatis` 命令有助于显示帮助页的简短描述。\n`whatis [CommandName...]`\n\n\n\n\n`which`\
  \ : `which` 帮助定位你笔记本中的命令存储位置。`which` 命令主要用于你的 bash 脚本。\n\nSyntax: `which [CommandName...]`\n\
  \n## Chapter 4 pwd Command\n\n`pwd` : 显示当前目录。\n`pwd --help` : 显示关于 `pwd` 命令的帮助文档。\n\
  `pwd --version` : 打印 `pwd` 命令版本。\n`pwd -man` : 使用 `-man` 命令读取 `pwd` 手册页。\n\n## Chapter\
  \ 5 man Command\n\n`man` : `man` 命令提供一个接口，该接口帮助你在终端上阅读手册页参考。\n\nSyntax: `ls [OPTION]...\
  \ [COMMANDS]...`\n\n配合命令使用的选项：\n`man -w` : 此标志不会显示任何手册页，但会打印命令在你的笔记本中的存储位置。\n`man\
  \ -f` 或 `man –whatis` : 如果描述可用，此标志将向你显示手册页的简短描述。\n`man man` : 为你提供命令手册页信息。\n\n仅适用于\
  \ man 命令的选项：\n`man --help` : 此标志为你提供关于 `man` 命令的帮助文档。\n`man --usage` : 提供关于命令的短用法消息。\n\
  `man -V` 或 `man --version` : 打印 `man` 命令版本。\n\n注意：\n- `Man` 命令提供了许多选项，我们建议你访问命令手册页以获取更多信息。\n\
  - 退出 `man` 简单使用 `q` 或 `Exit` 命令。\n- 键盘方向键用于滚动页面：`↑` 向上滚动，`↓` 向下滚动。\n\n关于 `man` 命令的测验\n\
  \nQ.1 如何检查 `mkdir` 命令的手册页参考？\nAns. `pi@raspberrypi:~ $ man mkdir`\nQ.2 如何将命令手册页信息保存到笔记本的\
  \ txt 文件中。\nAns. `pi@raspberrypi:~ $ man ls > lsManPages.txt`\n\n## Chapter 6 ls\
  \ Command\n\n`ls` : 提供目录内存在文件的信息。默认按字母顺序提供当前目录信息。\n\nSyntax: `lsOPTION]... [FILE]...`\n\
  \n命令选项：\n`ls -a` : 在终端内显示所有文件。\n`ls -A` : 意味着几乎所有文件，但不显示 `.` 和 `..` 文件。\n`ls -l\
  \ --author` : 此命令配合 `-l` 标志或选项工作，并打印每个文件的作者信息。\n`ls -b` : `ls` 命令提供了一个选项 - 当使用时会对不可打印字符打印\
  \ C 风格的转义字符。\n`ls --block-size=SIZE` : 此标志将你的文件转换为不同的大小。例如兆字节、字节等。\n- `ls -l --block-size=K`\
  \ : 将文件转换为字节。\n- `ls -l --block-size=M` : 将文件转换为兆字节。\n`ls -c` : 此标志为你提供输出，显示你最近修改的文件，此选项永远不会与\
  \ `-l` 标志配合工作。\n`ls --color[=WHEN]` : 用彩色显示输出。默认始终为自动。如果你停止此项，你将永远不会使用。\n- `ls –color=never`\n\
  - `ls –color=auto`\n`ls -G` : 在不带组名打印列表。\n`ls -h` 或 `ls --human-readable` : 配合 `-l`\
  \ 和 `-s` 打印输出。在 CMD 中显示类似 1K 234M 2G 的文件大小。\n`ls -i` 或 `ls --inode` : 打印你的命令中每个文件的索引号。\n\
  `ls -k` 或 `ls --kibibytes` : 此标志显示每个文件的块大小。默认每个块大小为 1024 字节.--k` 标志配合 `-s` 标志工作。\n\
  `ls -l` : 在你的命令中打印长列表信息格式模式。\n`ls -m` : `m` 标志显示逗号分隔的文件项列表。\n`ls -n` 或 `ls --numeric-uid-gid`\
  \ : 显示数字用户和组 ID。\n`ls -N` : `-N` 标志打印不带逗号分隔或引号（`,`）的文件名。\n`ls -o` : 不带组信息打印信息。\n\
  `ls -p` 或 `ls --indicator-style=slash` : 在你的目录文件名后附加斜杠 `/`。\n\n注意：指示-style 的工作方式相同，或\
  \ `--indicator-style` 参数有：\n- ‘none’\n- ‘slash’\n- ‘file-type’\n- ‘classify ’\n\
  `ls -Q` 或 `ls --quote-name` : 用双引号显示你的文件名。\n`ls --quoting-style=\"escape\"` : 样式化你终端内的引号。更多参数有：\n\
  - ‘literal’\n- ‘shell’\n- ‘shell-always’\n- ‘shell-escape’\n- ‘shell-escape-always’\n\
  - ‘c’\n- ‘c-maybe’\n- ‘escape’\n- ‘Locale’\n- ‘clocale’\n`ls -r` 或 `ls --reverse`\
  \ : 逆序打印你的文件（z 到 a）。\n`ls -R` 或 `ls --recursive` : 打印你的所有文件以及子目录文件。\n`ls -s` 或 `ls\
  \ --size` : 以块形式打印每个文件的大小。\n`ls -S` : 按文件大小排序，最大的在前。\n`--sort='none'` : 根据时间和大小等参数排序你的文件。更多有效的参数有：\n\
  - ‘none’\n- ‘time’\n- ‘size’\n- ‘extension’\n- ‘version’\n`ls -t` : 根据修改时间排序你的文件，最新创建的在前。\n\
  `ls -X` : 按字母顺序排序你的文件。\n`ls -1` : 每行打印一个文件列表。\n`ls --help` : 显示关于 `ls` 命令的文档。\n\
  `ls --version` : 打印 `Ls` 命令版本。\n`ls -man` : 使用 `-man` 命令检查你的手册页。\n\n关于 `ls` 命令的测验\n\
  \nQ1. 如何在 `ls` 命令中列出多个目录？\nAns. `pi@raspberrypi:~ $ ls Blog Documents`\nQ2. 如何访问目录内的隐藏文件？\n\
  Ans. `pi@raspberrypi:~ $ ls -a`\nQ3. 如何打印文件的长列表格式？\nAns. `pi@raspberrypi:~ $ ls\
  \ -l`\nQ4. 逆序打印目录（z 到 a）\nAns. `pi@raspberrypi:~ $ ls -r`\nQ5. 如何阅读 `ls` 手册页？\n\
  Ans. `pi@raspberrypi:~ $ man ls`\n\n## Chapter 7 mkdir Command\n\n`mkdir` : `mkdir`\
  \ 命令帮助创建新目录。如果目录已经存在，则不会创建新目录并在终端内给出警告消息。\n\nSyntax: `mkdir [OPTION]... DIRECTORY...`\n\
  \n命令选项：\n`mkdir -m=Mode` linuxBook: `-m` 选项帮助为文件分配新权限（类似于 `chmod`）。模式选项有：\n- `rwx`\
  \ : 对此文件的读、写、执行权限\n- `wx` : 仅对此文件的写、执行权限\n- `rx` : 仅对此文件的读、执行权限\n`mkdir -p` 或 `mkdir\
  \ --parents` : -p 选项如果文件存在则不显示错误。不覆盖你的文件。\n`mkdir -v` 或 `mkdir --verbose` : 在每个创建的目录后打印消息--help`\
  \ : 显示此帮助并退出--version` : 输出 `mkdir` 命令信息。 `man mkdir` : 在你的工具中打印 `mkdir` 手册页信息。\n\
  \n关于 `mkdir` 命令的测验\n\nQ1. 如何使用 `mkdir` 创建多个目录？\nAns. `pi@raspberrypi:~ $ mkdir linux\
  \ linuxBook`\nQ2. 创建一个新的 Linux 目录并添加一些读执行权限？\nAns. `pi@raspberrypi:~ $ mkdir m='rx'\
  \ linux`\nQ3. 打印 `mkdir` 命令手册页？\nAns. `pi@raspberrypi:~ $ man mkdir`\n\n## Chapter\
  \ 8 rmdir Command\n\n`rmdir` : `rmdir` 命令帮助删除你笔记本中的空目录。你不会删除文件。\n\nSyntax: `mkdir\
  \ [OPTION]... DIRECTORY...`\n\n命令选项：\n`rmdir --ignore-fail-on-non-empty` : 此选项在删除多个目录时有用。我们不确定哪些文件为空。在这种情况下，此标志会忽略非空目录且不显示“目录为空”的错误。\n\
  `rmdir -p` 或 `rmdir --parents` : 默认 `rmdir` 命令可以使用子目录文件夹，如 `rmdir a/b/c/d`，此时 `rmdir`\
  \ 只删除 d 文件夹。如果你使用 `-p` 或 `--parents` 标志，你会删除整个子目录。\n`rmdir -v` 或 `rmdir --verbose`\
  \ : 为每个目录过程在终端内打印诊断结果--help` : 显示此帮助并退出--version` : 输出 `mkdir` 命令信息。 `man rmdir`\
  \ : 在你的工具中打印 `rmdir` 手册页。\n\n关于 `rmdir` 命令的测验\n\nQ1. 如何删除 Linux 空目录？\nAns. `pi@raspberrypi:~\
  \ $ rmdir linux`\nQ2. 最近我创建了一个包含 test.txt 文件的 Linux 目录。现在告诉我 `rmdir` 命令是否工作以及为什么。\n\
  Ans. 不工作。因为 `rmdir` 命令只删除空目录\nQ3. 打印 `mkdir` 命令手册页？\nAns. `pi@raspberrypi:~ $ man\
  \ mkdir`\n\n## Chapter 9 rm Command\n\n\n\n\n# rm 命令\n\n`rm` 命令帮助你删除文件或目录。\n\n**语法：**\n\
  `rm [OPTION]... [FILE]...`\n\n| 命令选项（标志） | 描述 |\n| :--- | :--- |\n| `rm -f` 或 `rm\
  \ --force` | 此标志在不询问提示权限的情况下删除所有文件或目录。 |\n| `rm -i` | 此命令选项首先通过提示来询问你是否有权限删除文件。你输入输入\
  \ Yes，则会删除该文件。 |\n| `rm -I` | 仅在有提示时询问一次权限。然后删除所有文件。 |\n| `rm -r` 或 `rm -R` 或 `rm\
  \ --recursive` | 此标志用于递归地删除目录、子目录和文件及其内容。 |\n| `rm -d` 或 `rm --dir` | 此标志仅删除空目录。\
  \ |\n\n*   `rmdir -v` 或 `mkdir –verbose`: 解释正在执行的操作。\n*   `rmdir --help`: 显示此帮助信息并退出。\n\
  *   `rmdir –version`: 输出 `mkdir` 命令的版本信息。\n*   `man rmdir`: 在你的命令行工具中打印 `rmdir`\
  \ 手页信息。\n\n### 关于 rm 命令的测试\n\n**Q1. 在不提示权限的情况下删除 `test.txt` 文件？**\n答。`pi@raspberrypi:~$\
  \ rm -f test.txt`\n\n**Q2. 如何删除多个文件？**\n答。`pi@raspberrypi:~$ rm -f test.txt test2.txt`\n\
  \n**Q3. 在不提示权限的情况下删除我的子目录和文件？**\n答。`pi@raspberrypi:~$ rm -r test`\n\n**Q4. 如何删除一个空的\
  \ Linux 目录？**\n答。`pi@raspberrypi:~$ rm -d Linux`\n\n## 第 10 章 cp 命令\n\n`cp`: 使用\
  \ `cp` 命令帮助你拷贝电脑内部的文件和目录。\n\n**语法：**\n`cp [OPTION]... SOURCE... DIRECTORY`\n\n|\
  \ 命令选项（标志） | 描述 |\n| :--- | :--- |\n| `cp -i` 或 `cp --interactive` | 此标志在覆盖你的文件之前通过提示询问你权限。\
  \ |\n| `cp -R` 或 `cp -r` 或 `cp –recursive` | 此标志用于拷贝包含所有文件的目录。 |\n\n*   `rmdir -v`\
  \ 或 `mkdir –verbose`: 在终端内打印正在执行操作的说明信息。\n*   `rmdir --help`: 显示此帮助信息并退出。\n*   `rmdir\
  \ –version`: 输出 `mkdir` 命令的版本信息。\n*   `man rmdir`: 在你的命令行工具中打印 `rmdir` 手页信息。\n\n\
  **注意：** 阅读 Man 手页以获取关于 `cp` 命令的所有信息。\n\n### 关于 cp 命令的测试\n\n**Q.1 如何拷贝 `js` 目录中包含所有文件的整个\
  \ Javascript 目录？**\n答。`pi@raspberrypi:~ $ cp -r javascript js`\n\n**Q.2 如何打开 `cp`\
  \ 手页文档？**\n答。`pi@raspberrypi:~ $ man cp`\n\n## 第 11 章 wc 命令\n\n`wc`: `wc` 命令为每个文件提供字数和字节数。\n\
  \n**语法：**\n`wc [OPTION]... [FILE]...`\n\n| 命令选项（标志） | 描述 |\n| :--- | :--- |\n| `wc\
  \ -c` 或 `wc –bytes` | 此标志帮助以字节为打印文件大小。 |\n| `wc -m` 或 `wc --chars` | 此标志打印文件的字符数。\
  \ |\n| `wc -l` 或 `wc --lines` | 打印文件的总行数。 |\n| `wc -L` 或 `wc –max-line-length` |\
  \ 打印文件中最长的一行。 |\n| `wc -w` 或 `wc --words` | 打印文件的总字数。 |\n| `wc --help` | 显示此帮助信息并退出。\
  \ |\n\n*   `wc –version`: 输出 `wc` 命令的版本信息。\n*   `man wc`: 在你的命令行工具中打印 `wc` 手页信息。\n\
  \n### 关于 wc 命令的测试\n\n**Q.1 如何统计文件行数？**\n答。`pi@raspberrypi:~ $ wc -l manCommand.txt`\n\
  \n**Q.2 如何统计文件字数？**\n答。`pi@raspberrypi:~ $ wc -w manCommand.txt`\n\n**Q.3 在多个文件上运行\
  \ `wc` 命令？**\n答。`pi@raspberrypi:~ $ wc ls.txt test.txt`\n\n**Q.4 如何在 `wc` 命令中查找文件大小？**\n\
  答。`pi@raspberrypi:~ $ wc -c ls.txt`\n\n## 第 12 章 cd 命令\n\n`cd`: `cd`（切换目录）命令用于在\
  \ Linux 中更改当前工作目录。`cd` 不是一个命令，它默认内置在你的 shell 中。这是必要的，因为你当前的工作目录是由名为 `pwd` 的环境变量控制的，该变量源自\
  \ `pwd` 或“打印工作目录”命令。\n\n**语法：**\n`cd [DIRECTORY]`\n\n| 命令选项（标志） | 描述 |\n| :--- |\
  \ :--- |\n| `cd` | 回到用户主目录。 |\n| `cd ~` | 回到主目录。 |\n| `cd ..` | 返回上一级目录。 |\n| `cd\
  \ -` | 回到上一个目录。 |\n\n### 关于 cd 命令的测试\n\n**Q.1 如何切换到包含 `js` 目录的所有主目录？**\n答。`pi@raspberrypi:~\
  \ $ cd ~`\n\n**Q.2 如何进入上一级目录？**\n答。`pi@raspberrypi:~ $ cd ..`\n\n**Q.3 如何返回上一个目录？**\n\
  答。`pi@raspberrypi:~ $ cd -`\n\n## 第 13 章 mv 命令\n\n`mv`: `mv` 命令用于移动或重命名文件。\n\n**语法：**\n\
  `mv [OPTION]... SOURCE... DEST`\n\n| 命令选项（标志） | 描述 |\n| :--- | :--- |\n| `mv -f`\
  \ 或 `mv --force` | 此标志在不询问提示权限的情况下强制移动现有文件。 |\n| `mv -i` 或 `mv --interactive` |\
  \ 此标志在覆盖你的文件之前通过提示询问你权限。 |\n| `mv -v` 或 `mv --verbose` | 显示正在执行什么操作。 |\n\n### 关于\
  \ mv 命令的测试\n\n**Q.1. 在不提示权限的情况下移动 `test.txt`？**\n答。`pi@raspberrypi:~$ mv -f test.txt\
  \ /tmp/`\n\n**Q.2. 如何重命名文件？**\n答。`pi@raspberrypi:~$ mv oldname.txt newname.txt`\n\
  \n**Q.3. 如何移动我的子目录和文件且不提示？**\n答。`pi@raspberrypi:~$ mv test /home/user/`\n\n## 第\
  \ 14 章 cat 命令\n\n`cat`: `cat` 命令连接并显示文件。\n\n**语法：**\n`cat [OPTION]... [FILE]...`\n\
  \n| 命令选项（标志） | 描述 |\n| :--- | :--- |\n| `cat -A` 或 `cat --show-all` | 显示所有隐藏字符。\
  \ |\n| `cat -b` 或 `cat --number` | 对非空行进行行号。 |\n| `cat -E` 或 `cat --show-ends` |\
  \ 在行尾显示 `$` 符号。 |\n| `cat -n` 或 `cat --number` | 对所有行进行行号。 |\n| `cat -T` 或 `cat\
  \ --show-tabs` | 将制表符显示为 `^I`。 |\n| `cat -S` 或 `cat --squeeze-tabs` | 压缩连续的空格。 |\n\
  | `cat -v` 或 `cat --help` | 显示不可打印字符。 |\n\n### 关于 cat 命令的测试\n\n**Q.1. 如何查看 `test.txt`\
  \ 的内容？**\n答。`pi@raspberrypi:~$ cat test.txt`\n\n**Q.2. 如何带行号显示文件？**\n答。`pi@raspberrypi:~$\
  \ cat -n file.txt`\n\n**Q.3. 如何合并多个文件？**\n答。``pi@raspberrypi:~$ cat file1.txt file2.txt\
  \ > combined.txt`\n\n## 第 15 章 touch 命令\n\n`touch`: `touch` 更新时间戳并创建空文件。\n\n**语法：**\n\
  `touch [OPTION]... FILE`\n\n| 命令选项（标志） | 描述 |\n| :--- | :--- |\n| `touch -a` 或 `touch\
  \ --access` | 仅更改访问时间。 |\n| `touch -c` 或 `touch --no-create` | 如果文件不存在则不创建任何空文件。\
  \ |\n| `touch -d` 或 `touch --date=\"STRING\"` | 此标志帮助为文件分配自定义的时间和日期。 |\n| `touch\
  \ -m` | 仅更改修改时间。 |\n| `touch -t [[CC]YY]MMDDhhmm[.ss]` | 使用时间格式设置时间。 |\n\n### 关于\
  \ touch 命令的测试\n\n**Q.1. 如何使用 touch 命令创建一个空文件？**\n答。`pi@raspberrypi:~$ touch newfile.txt`\n\
  \n**Q.2. 如何修改文件的日期？**\n答。`pi@raspberrypi:~$ touch -d=\"2023-01-01\" file.txt`\n\n\
  ## 第 16 章 head 命令\n\n`head`: `head` 命令输出文件的开头部分。\n\n**语法：**\n`head [OPTION]... [FILE]...`\n\
  \n| 命令选项（标志） | 描述 |\n| :--- | :--- |\n| `head -n NUMBER` 或 `head --lines=NUMBER`\
  \ | 输出前 NUMBER 行。 |\n| `head -c NUMBER` 或 `head --bytes=NUMBER` | 输出前 NUMBER 字节。\
  \ |\n\n### 关于 head 命令的测试\n\n**Q.1. 如何查看文件的前 10 行？**\n答。`pi@raspberrypi:~$ head file.txt`\n\
  \n**Q.2. 如何查看文件的前 5 行？**\n答。`pi@raspberrypi:~$ head -n 5 file.txt`\n\n\n\n\n\n#\
  \ head 命令\n\n`head` : 默认打印每个文件的前 10 行。你可以对两个以上的文件使用 `head` 命令。\n\n### 语法\n`head\
  \ [OPTION]... [FILE]...`\n\n### 命令选项 (Flag)\n| Flag | 描述 |\n| :--- | :--- |\n| `head\
  \ -n` | 该标志帮助打印文件的特定行，或每个文件多于 10 行。示例：`pi@raspberrypi:~ $ head -20 cat.txt` |\n\
  | `head --lines=NUM` | 该标志也打印文件的特定行或每个文件多于 10 行。示例：`pi@raspberrypi:~ $ head --lines=30\
  \ cat.txt` |\n| `head -v` 或 `head --verbose` | 该标志在顶部打印文件名，并在打印头信息后再次打印。 |\n| `head\
  \ --help` | 显示此帮助信息并退出。 |\n| `head --version` | 输出 `head` 命令的版本信息。 |\n| `man head`\
  \ | 在你的命令行工具中打印 `head` 命令的帮助页信息。 |\n\n### 关于 head 命令的测试\n**Q.1** 如何打印 `linux.txt`\
  \ 文件的前 20 行？\n答。`pi@raspberrypi:~ $ head -20 cat.txt`\n\n**Q.2** 如何打印两个以上文件的文件头信息？\n\
  答。`pi@raspberrypi:~ $ head cat.txt ls.txt mv.txt`\n\n## 第 17 章：tail 命令\n\n`tail`\
  \ : 打印每个文件的最后 10 行。你可以对两个以上的文件使用 `tail` 命令。\n\n### 语法\n`tail [OPTION]... [FILE]...`\n\
  \n### 命令选项 (Flag)\n| Flag | 描述 |\n| :--- | :--- |\n| `tail -n` | 该标志帮助打印文件的特定行，或每个文件多于\
  \ 10 行。示例：`pi@raspberrypi:~ $ tail -20 cat.txt` |\n| `tail --bytes=NUM` | 该标志也根据文件大小打印。示例：`pi@raspberrypi:~\
  \ $ tail --bytes=300 cat.txt` |\n| `tail -v` 或 `tail --verbose` | 该标志在顶部打印文件名，并在打印\
  \ tail 头信息后再次打印。 |\n| `tail --help` | 显示此帮助信息并退出。 |\n| `tail --version` | 输出 `tail`\
  \ 命令的版本信息。 |\n| `man tail` | 在你的命令行工具中打印 `tail` 命令的帮助页信息。 |\n\n### 关于 tail 命令的测试\n\
  **Q.1** 如何打印 `linux.txt` 文件的最后 30 行？\n答。`pi@raspberrypi:~ $ tail -30 cat.txt`\n\n\
  **Q.2** 如何打印两个以上文件的文件头信息？\n答。`pi@raspberrypi:~ $ tail cat.txt ls.txt mv.txt`\n\n\
  ## 第 18 章：find 命令\n\n`find` : 用于在目录层次结构中搜索文件。\n\n### 语法\n`find [Directory] [Option]\
  \ [Expression]`\n\n### 命令选项 (Flag)\n| Flag | 描述 |\n| :--- | :--- |\n| `find -name`\
  \ | 该标志帮助通过名称查找文件。 |\n| `find -size` | 根据文件大小查找文件，连同大小标准传递 `-size` 参数。你可以以下后缀来指定文件大小：<br>●\
  \ `b` : 512 字节块（默认）<br>● `c` : 字节<br>● `w` : 双字节字<br>● `k` : 千字节 (KB)<br>● `M` :\
  \ 兆 (MB)<br>● `G` : 吉字节 (GB) |\n| `find -atime n` | 该标志显示最后访问的文件。示例：`pi@raspberrypi:~\
  \ $ find . -atime 1` |\n| `find -cmin n` | 该标志显示在最后一分钟内状态变化的文件。 |\n| `find -ctime\
  \ n` | 该标志显示在 24 小时内变化的状态。 |\n| `find -mtime n` | 可以指定数字参数：<br>● `+n` : 大于 `n`<br>●\
  \ `-n` : 小于 `n`<br>● `n` : 恰等于 `n` |\n| `find --help` | 显示此帮助信息并退出。 |\n| `man find`\
  \ | 在命令行工具中打印 `find` 帮助页信息。 |\n\n### 关于 find 的测试\n**Q.1** 如何在根目录下查找所有 txt 文件？\n\
  答。`pi@raspberrypi:~ $ find /`\n\n**Q.2** 如何查找 `.txt` 文件？\n答。`pi@raspberrypi:~ $\
  \ find .txt`\n\n## 第 19 章：echo 命令\n\n`echo` : 用于显示作为参数传递的行。\n\n### 语法\n`echo [OPTION]\
  \ [STRING]`\n\n### 命令选项 (Flag)\n| Flag | 描述 |\n| :--- | :--- |\n| `echo -n` | 该标志不输出换行符。\
  \ |\n| `echo -e` | 该标志启用反斜杠转义解释：<br>● `b` : 删除空格。<br>● `r` : 添加回车。<br>● `n` : 添加换行。<br>●\
  \ `t` : 添加水平制表。<br>● `v` : 添加垂直制表。 |\n| `echo --help` | 显示此帮助信息并退出。 |\n| `echo --version`\
  \ | 输出版本信息。 |\n| `man echo` | 打印 `echo` 帮助页。 |\n\n### 关于 echo 的测试\n**Q.1** 如何启用反斜杠转义？\n\
  答。`pi@raspberrypi:~ $ echo -e \"My\\nName\"`\n\n**Q.2** 如何禁用反斜杠转义？\n答。`pi@raspberrypi:~\
  \ $ echo \"My\\nName\"`\n\n## 第 20 章：进程命令\n\n`pidof` : 查找当前运行程序的进程 ID。\n\n### 语法\n\
  `pidof [programName]`\n\n`ps` : 显示当前工作进程的快照。\n\n### 语法\n`ps [options]`\n\n### 命令选项\
  \ (Flag)\n| Flag | 描述 |\n| :--- | :--- |\n| `ps -ux` | 该标志显示笔记本上所有的工作进程。 |\n| `ps\
  \ -e` | 该标志显示所有工作进程的简要描述。 |\n\n`top`: `top` 命令将显示运行进程列表以及每个进程使用的 CPU 情况。它提供了系统的动态实时视图。\n\
  \n### 语法\n`top [OPTIONS]`\n注意：所有进程命令都有自己的选项或标志。请使用 `man` 命令阅读帮助页。\n\n## 第 21 章：Kill\
  \ 命令\n\n`kill`: 有时程序没有响应，你可以通过使用 `kill` 命令手动终止进程。\n\n### 语法\n`kill [options] [pid...]`\n\
  \n### 命令选项 (Flag)\n| Flag | 描述 |\n| :--- | :--- |\n| `kill [pid]` | 该标志杀死指定或进程列表。示例：`pi@raspberrypi:~\
  \ $ kill 2345` |\n| `kill -9 -1` | 该标志杀死笔记本或电脑上当前运行的所有进程。 |\n| `kill -9` | 当进程无法通过\
  \ `kill` 命令终止时，该标志很有帮助。使用 `-9` 标志可以轻松杀死进程。 |\n| `kill -Kill` | 该标志的作用与 `-9` 标志相同。\
  \ |\n\n### 关于 Kill 命令的测试\n**Q.1** 如何通过 kill 命令杀死多个进程？\n答。`pi@raspberrypi:~ $ kill\
  \ 2326 2349`\n\n**Q.2** 如何杀死笔记本上当前运行的所有进程？\n答。`pi@raspberrypi:~ $ kill -9 -1`\n\n\
  \n\n\n\n## 日期\n`date` 命令打印系统日期和时间。\n\n语法：`date [OPTION]... [FORMAT]...`\n\n### 命令选项(标志)\n\
  ### \n- `date -r` 或 `date --reference=FILE` : 此标志用于显示 `FILE` 的最后修改时间\n- `date -s`\
  \ 或 `date --set=STRING` : 此标志用于设置或更改笔记本电脑或电脑上的系统日期\n- `date -u` 或 `date --utc` 或\
  \ `date --universal` : 此标志打印协调世界时 (UTC)\n- `date --help` : 显示此帮助信息并退出\n- `date --version`\
  \ : 输出版本信息并退出\n- `man date` : 此命令帮助你打印帮助页信息。\n\n### 格式选项\n- `+%a` : 打印星期简写（例如 Sun）\n\
  - `+%A` : 打印本地区域的完整星期名称（例如 Sunday）\n- `+%b` : 打印本地区域的月份缩写（例如 Jan）\n- `+%B` : 打印本地区域的完整月份名称（例如\
  \ January）\n- `+%c` : 打印本地区域的日期和时间（例如 Thu Mar 3 23:05:25 2005）\n- `+%C` : 打印年份后两位（例如\
  \ 20）\n- `+%d` : 打印月份中的几（例如 01）\n- `+%D` : 打印格式与 `%m/%d/%y` 相同的日期\n- `+%e` : 打印日期（例如\
  \ 1-31）\n- `+%F` : 打印与 `%Y-%m-%d` 相同的完整日期\n- `+%g` : ISO 周数年份的后两位（参见 `%G`）\n- `+%G`\
  \ : ISO 周数的年份（参见 `%V`）；通常只配合 `%V` 使用\n- `+%h` : 与 `%b` 相同\n- `+%H` : 小时（00..23）\n\
  - `+%I` : 小时（01..12）\n- `+%j` : 一年中的第（001..366）\n- `+%m` : 月份（01..12）\n- `+%M` :\
  \ 分（00..59）\n- `+%n` : 添加换行符\n- `+%N` : 打印纳秒（000000000..999999999）\n- `+%p` : 打印本地区域对应的\
  \ AM 或 PM；如果未知则留空\n- `+%P` : 类似于 `%p`，但小写\n- `+%r` : 本地区域的 12 小时制时间（例如 11:11:04\
  \ PM）\n- `+%R` : 24 小制时分；与 `%H:%M` 相同\n- `+%s` : 自 1970-01-01 00:00:00 UTC 以来的秒\n\
  - `+%S` : 秒（00..60）\n- `+%t` : 打印制表符\n- `+%T` : 打印与 `%H:%M:%S` 相同的时间\n- `+%u` :\
  \ 星期（1..7）；1 是周一\n- `+%U` : 年周，以星期日为一周的第一天（00..53）\n- `+%V` : ISO 周数，以周一为一周的第一天（01..53）\n\
  - `+%w` : 星期（0..6）；0 是星期日\n- `+%W` : 年周，以周一为一周的第一天（00..53）\n- `+%x` : 本地区域的日期表示（例如\
  \ 12/31/99）\n- `+%X` : 本地区域的时间表示（例如 23:13:48）\n- `+%y` : 年份的后两位（00..99）\n- `+%Y`\
  \ : 打印完整年份\n- `+%Z` : 时区缩写（例如 EDT）\n\n### 关于 date 命令的测试\nQ1. 如何使用 `date` 命令设置自定义日期？\n\
  答：`pi@raspberrypi:~ sudo date -s \"12/17/2020 05:26\"`\nQ2. 如何使用格式打印带有 AM/PM 的完整日期和时间？\n\
  答：`pi@raspberrypi:~ $ date '+A'`\n\n### 关于 date 命令的测试\nQ1. 如何使用 `date` 命令设置自定义日期？\n\
  答：`pi@raspberrypi:~ sudo date -s \"12/17/2020 05:26\"`\nQ2. 如何使用格式打印带有 AM/PM 的完整日期和时间？\n\
  答：`pi@raspberrypi:~ $ date '+A'`\n\n### 关于 date 命令的测试\nQ1. 如何使用 `date` 命令设置自定义日期？\n\
  答：`pi@raspberrypi:~ sudo date -s \"12/17/2020 05:26\"`\nQ2. 如何使用格式打印带有 AM/PM 的完整日期和时间？\n\
  答：`pi@raspberrypi:~ $ date '+A'`\n\n### 关于 date 命令的测试\nQ1. 如何使用 `date` 命令设置自定义日期？\n\
  答：`pi@raspberrypi:~ sudo date -s \"12/17/2020 05:26\"`\nQ2. 如何使用格式打印带有 AM/PM 的完整日期和时间？\n\
  答：`pi@raspberrypi:~ $ date '+A'`\n\n### 关于 date 命令的测试\nQ1. 如何使用 `date` 命令设置自定义日期？\n\
  答：`pi@raspberrypi:~ sudo date -s \"12/17/2020 05:26\"`\nQ2. 如何使用格式打印带有 AM/PM 的完整日期和时间？\n\
  答：`pi@raspberrypi:~ $ date '+A'`\n\n### 关于 date 命令的测试\nQ1. 如何使用 `date` 命令设置自定义日期？\n\
  答：`pi@raspberrypi:~ sudo date -s \"12/17/2020 05:26\"`\nQ2. 如何使用格式打印带有 AM/PM 的完整日期和时间？\n\
  答：`pi@raspberrypi:~ $ date '+A'`\n\n（注：原文中的重复测试部分已合并以保持清晰度）\n\n---\n\n## cal 命令\n\
  `cal` 命令显示日历。\n\nQ1. 如何使用 `cal` 命令查看日历？\n\n### 格式选项\n### 描述\n- `+%D` : 打印格式与 `%m/%d/%y`\
