    你需要理解的一个重要事情（由于你们大多数人来自 Windows 操作系统）是，在 Linux 中，没有文件关联。我们的意思是，在 Windows 中，文件名后始终带有文件扩展名——关联。例如，如果你有一个名为
    *Notes* 的 Microsoft Word 文档，你会发现它的文件扩展名是 *.doc* 或 *.docx*。因此，它的完整文件名将是 Notes.doc
    或 Notes.docx。


