    # **Top**


    The next thing that we need to talk about is the command called top. If you are
    coming from the Windows world, think of the top command as basically your task
    manager. So, if you go the Linux command prompt and type in top, what happens
    is you will see how much your memory is being used, how much of your CPU is being
    used, and then all of the processes that are currently running on your system.


    You will see something called the processor ID or the PID, the CPU usage per process,
    the memory usage per process, how long the process has been running, etc. So basically,
    the top command is the task manager of the Linux operating system.


    In the Windows task manager, if a process is running and you need to terminate
    it, you can just do a right-click using your mouse and do End process. In Linux
    with top, if you need to terminate or kill a particular process, you just need
    to type in the syntax below:


    ```

    $ K <PID>

    ```


    So as you can see from the command syntax above, all you need to do is type in
    the letter K and the process ID number. So if you see process 1578 doing something
    stupid for example, you type in:


    ```

    $ K 1578

    ```


    Typing that command in will kill that particular process. All the processes in
    Linux get their own unique process ID number. So if one particular process is
    doing something that it is not supposed to be doing, it is extremely easy for
    the user to identify that process through the PID and terminate it.


    Remember, the kill or terminate command will only work within top. If you are
    not within the top task manager, the kill/terminate command will not work on its
    own. If the particular process that you are trying to terminate is something important
    for the Linux server to function properly, it will tell you that the process cannot
    be killed/terminated. If that is the case, you may have to do your “once a year”
    reboot in order to kill the process.


    So, in order to see the top task manager, all you need to do is type in the command
    below:


    ```

    $ sudo top

    ```


    Once you type that in, you will have the screen below:'
