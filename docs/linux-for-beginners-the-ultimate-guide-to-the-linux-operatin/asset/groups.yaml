    to make things as user-friendly as possible. With that in mind, one of the things
    they came up with was this program called *tasksel* or task select.


    When you are trying to set up an Apache web server, an email server, or a virtualization
    server, for example, note that each of these servers requires a number of different
    programs in order for it to work. So if you are trying to set up a web server,
    you need to install Apache, you need to install MySQL, you need to install PHP,
    and you need to install the connectors so that they can actually work together.


    The Ubuntu creators then figured that if you need to install those things, they
    can create a script that would just install all those things for you. So what
    will happen is, if you know exactly what you want your server to do and you are
    really not worried about making it really customized, you can run the *tasksel*
    command and choose which pre-packaged server type you want your server to be.


    The creators of Ubuntu came up with around ten to twenty different server installation
    packages that you could choose from. And what happens is if you run the *tasksel*
    command, you will get a DOS screen where all of these server installation packages
    are listed. If you want to make your server an email server for example, all you
    need to do is select *Email server* and then it will install all the necessary
    software you need for that particular server type.


