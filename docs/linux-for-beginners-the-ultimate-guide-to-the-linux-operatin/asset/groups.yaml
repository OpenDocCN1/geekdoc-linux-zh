    administrator, to know what that file is. So if you are going to modify text files,
    understand that they are not going to have .txt file extensions. It will just
    be the filename. You must understand what file it is you need to modify first
    before you use a file editor software to edit that file.


    All the configuration files in Linux have to be edited using a file editor. If
    you do not understand how to edit documents or text in Linux, you are not going
    to get anywhere.'
