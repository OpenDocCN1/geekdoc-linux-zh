  mdcn: '

    # Linux 外壳


    既然我们已经把法律层面的事情解决了，现在让我们来谈谈 Linux 操作系统的外壳。那么，什么是外壳（Shell）？操作系统的外壳是你用来与操作系统交互的界面。如果你想到的是
    Microsoft Windows，那么 Windows 的外壳就是那个图形用户界面，我们在那里使用小鼠标指针来四处移动并点击桌面上的各种元素，例如文件夹、图标等。


    外壳分为两种类型。第一种是图形用户界面，即 GUI。第二种被称为行用户界面，即 LUI。LUI 基本上看起来像 DOS 提示符。所以，如果你曾经玩过 Microsoft
    Windows 的 DOS 提示符，行用户界面正是那样。它是一个黑白屏幕，你在其中输入不同的命令以获取计算机的特定输出。


    在 Linux 中，由于这是一个更多被程序员、极客、工程师或其他技术人员偏好的技术性操作系统，他们倾向于使用行用户界面。因此，当你安装 Linux 时，你既可以拥有一个像普通操作系统那样可以点击桌面元素的图形组件，也可以仅仅拥有一个行用户界面。


    关于外壳，你必须记住的主要一点是，行用户界面（LUI）比图形用户界面（GUI）强大得多。然而，当你仅安装带有行用户界面的 Linux 外壳时，你得到的只是一个提示符。如果你不知道需要对命令提示符做什么，比如该操作系统的各种外壳命令，你就会陷入困境。


    有很多情况是，人们安装了带有 LUI 的 Linux，但不知道任何用于 LUI 的 Linux 外壳命令。因此，基本上就是 Linux 行用户界面就是这样。你必须理解命令，才能让计算机执行你需要的任何操作。


    ## 根（Root）


    当你准备使用 Linux 时，必须理解的下一个重要概念是 Root（根）的概念。在 Linux 中，root 涉及任何事物的最高级别。当你听到 root 用户时，它指的是计算机的管理员。Root
    用户是你在计算机上能拥有的最高级别用户。


    所以，如果你能以 root 身份登录，你可以对计算机做任何你想做的事情。Root 也可以指操作系统的根。这是操作系统安装在计算机硬盘上的位置。如果你从 Windows
    操作系统的角度来思考，C:/ 是 Windows 操作系统的根，因为它就安装在那里。


    Root 还可以指用户可以达到的最高级别。这意味着什么？在 Linux 中，用户有主文件夹。主文件夹存储用户的所有数据，如文档、设置、程序等。因此，用户的根就是他们的主目录。主目录是特定用户的最高级别。


    在谈论 Linux 中的 root 时，主要需要理解的是 root 是任何事物的最高级别。实际上在 Linux 中有一个名为 root 的用户账户，该用户账户是你启动操作系统时所能拥有的绝对最高级别用户。Root
    绝对可以做任何事情。它对操作系统中的所有内容拥有完全访问权限。一旦我们开始实际输入命令并让 Linux 执行某些任务，root 的概念将至关重要。


    ## 大小写


    现在让我们来谈谈一个在从 Windows 切换到 Linux 时让每个 Windows 用户头疼的问题：大小写。基本上，你有大写字母和小写字母。在 Windows
    操作系统中，它并不关心你输入的是大写字母还是小写字母。如果在 Windows 中有一个名为“Home”的文件夹，它与“HOME”、“home”或“homeE”是相同的。Windows（除了密码外）并不关心大小写。


    在 Linux 世界中，请记住，Linux 是由计算机专业人士创建的。这些计算机专业人士使用 ASCII 文本编码了字母、数字、标点符号等字符。在 ASCII
    文本中，例如大写的“H”实际上与小写的“h”是不同的字符。这意味着在 Linux 世界中，“Home”、“HOME”、“home”或“homeE”将被视为不同的文件夹。


    假设你有一个名为“USER”的文件夹，但出于某种原因，当你尝试访问它时输入了“user”。Linux 将无法找到该文件夹，因为“user”文件夹不存在。只有带有大写字母的“USER”文件夹才存在。所以要记住，在
    Linux 中大小写很重要。


    这可能给你带来大问题的一个地方，你很可能在使用某些网站时已经注意到了，那就是当你输入用户名登录时。在 Linux 中，所有用户名和密码都是区分大小写的。因此，当你在
    Linux 中输入用户名或密码时，请确保你没有打开大写锁定键，或者你在输入用户名和密码时没有不小心按住 Shift 键。


    这其实并不复杂。只是因为人们习惯了使用 Windows，完全把使用 Windows 的习惯带到了 Linux 上，而在 Linux 中大小写至关重要。


    ## 服务器版 vs. 桌面版


    通常，每个人都会提供两种版本的 Linux。无论你获得的是 Red Hat Linux、Ubuntu Linux、Fedora Linux 还是其他任何发行版，它们通常都会有两个版本的发行版。一个是服务器版本，另一个则是桌面版本。


    任何这些 Linux 操作系统的服务器版本与桌面版本之间的主要区别在于，服务器版本是精简版的 Linux。为什么？因为他们认为，如果你要安装服务器，你就明确知道你想在服务器上安装什么。这意味着操作系统中将没有图形用户界面，而且你用来管理
    Linux 的许多工具不会自动安装。


    他们认为，如果你想要某个工具并且正在安装服务器，那么你就知道如何自己将该工具安装到服务器上。如果你刚开始学习 Linux，在这个阶段下载桌面版本可能对你更好。这些发行版的桌面版本一开始就提供了图形用户界面。


    当你安装桌面版本时，你将能够立即使用图形用户界面来导航操作系统，很像 Microsoft Windows 或 Mac OS。你将拥有桌面图标、可以点击的文件夹等。


    与 Windows 或 Mac 相比，它的运作方式会有所不同，因此你仍然必须学习如何使用 Linux。但它将是一个你一启动就能理解的环境。安装桌面版本后，你将直接进入图形环境。它已经安装了管理工具，你可以随意探索并弄清楚如何使用该图形环境。这就是桌面版本相对于
    Linux 服务器版本的主要优势。


    ## 为什么要使用 Linux？


    你应该学习 Linux 并开始部署 Linux 的原因是服务器功能。Linux 极其稳固。一旦你安装了 Linux，一旦你克服了所有怪癖并设置了所有配置，Linux
    服务器就会一直运行，直到 CPU 过热而停止工作。它会不停息地运行。一个正确安装的 Linux 服务器可以连续运行一百五十天而不出任何问题。


    Linux 与 Windows 完全不同，Windows 每周都需要重启以避免内存泄漏或崩溃。Linux，只要你正确配置，就会日复一日地运行并履行其职责。你应该考虑部署
    Linux 的原因是服务器功能，无论是 Apache Web 服务器、MySQL 数据库服务器、虚拟化服务器、邮件服务器等。


    当你设置好 Linux 服务器时，那个东西将坚如磐石。你不会遇到与 Windows 相同的问题，在 Windows 中，你今天在一台计算机上安装 Windows
    运行得非常好，但随后你不断接收许多更新。两年后，计算机运行速度变慢，因为 Microsoft 提供的所有更新实际上降低了计算机本身的性能。


    Linux 并非如此。一旦你安装了 Linux，它将以与你最初在计算机上安装时相同的效率履行其职责——当然，前提是你正确配置了它。


    Linux 是一个真正健壮且高效的操作系统。此时，你拥有扎实的基础和对 Linux 来源及其一些基本但重要概念的深入理解是非常重要的。

    '
