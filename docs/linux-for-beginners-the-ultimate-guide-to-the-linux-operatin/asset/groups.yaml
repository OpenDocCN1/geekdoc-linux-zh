    ## 手册页


    接下来我们需要讨论的是“man”手册页。Man pages 代表 manual pages（手册页）。关于手册页，你必须记住的是：如果你不清楚某个命令应该如何工作，或者不确定应该运行哪个命令，手册页就是查询任何命令相关信息的地方。


    举个例子，假设你想查询关于 *ping* 命令的信息。你要做的是输入 *man*，然后跟上你想要弄清楚的那个命令。请查看下面的语法：


    ```

    $ man ping

    ```


    在 Linux 中，这将打开一个页面，向你描述 ping 命令以及你需要知道的所有关于 ping 命令的信息。因此，如果你试图弄清楚某个特定命令的工作原理，你只需要输入
    *man*、一个空格，然后输入命令的名称，这会为你打开一个手册页，你可以在其中阅读关于该特定命令你想了解的任何内容。


    如今，在互联网时代，进行一次简单的 Google 搜索比尝试使用 *man* 手册页要容易得多。然而，如果互联网访问中断，手边备有手册页也是很有帮助的。


    在 Windows 中，手册页基本上就是旧的“问号”命令，它向你显示“帮助”页面。Linux 中手册页的唯一缺点是，它没有向你解释很多内容。它并不一定把事情弄得清晰明了。


    所以，当你去手册页查询 ping 命令时，你会看到一整页的文本，这些文本会告诉你关于 ping 命令的信息。然而，一旦你在那里，你就不太知道如何退出那个页面。它既不太用户友好，也不直观。你可以按下
    *Escape* 键，但那没有任何作用。你可以尝试按下 *Enter* 或 *Backspace*，但它们同样没有任何作用。


    为了退出手册页，你需要输入字母“Q”代表 quit（退出）。当你输入字母“Q”时，你将会退出手册页。因此，除非你按下键盘上的每个键并反复尝试，否则你无法发现退出手册页的命令是输入字母“Q”。正如你所见，这与直觉相悖，因为大多数人习惯在
    Windows 中按下 *Escape* 键来退出任何界面。


    现在，假设你想知道 *ping* 命令到底是怎么回事。请执行下面的命令：


    ```

    $ man ping

    ```


    输入该命令并按下 ENTER 后，你会看到 ping 命令的 *man* 手册页，如下所示：


    ![](img/38783e2b6fd4fbccebb177aa2953d843_51_0.png)


    查看 ping 命令的手册页，你会看到命令描述，以及与 ping 命令相关的各种选项。这些选项基本上是 ping 命令的后缀，它们进一步增强了基本 ping
    命令的功能。其中一个例子是在 ping 命令后面输入后缀“-r”以持续 ping 某个特定主机。


    现在，假设你想知道 apt-get 命令到底是怎么回事。请执行下面的命令：


    ```

    $ man apt-get

    ```


    输入该命令并按下 ENTER 后，你会得到 apt-get 命令的手册页，如下所示：


    ![](img/38783e2b6fd4fbccebb177aa2953d843_51_1.png)


    现在，这个关于 apt-get 命令的手册页将告诉你所有你需要知道关于 apt-get 命令的信息。正如我们之前提到的，这些命令的一些手册页几乎和一整本书一样长。请记住，如果你出于任何原因想要退出手册页，只需按下键盘上的
    Q 即可退出。


    ## Tasksel


    接下来我们要讨论的命令是 *tasksel*。这代表“task select”（任务选择）。Ubuntu 正努力成为 Linux 发行版的首选提供商。他们在改进
    Ubuntu Linux 方面确实做了大量的工作，并且他们知道如何使事物尽可能用户友好。鉴于此，他们想到的其中一件事就是这个名为 *tasksel* 或任务选择的程序。


    当你试图设置一个 Apache Web 服务器、电子邮件服务器或虚拟化服务器时，请注意，这些服务器中的每一个都需要许多不同的程序才能正常工作。因此，如果你试图设置一个
    Web 服务器，你需要安装 Apache，需要安装 MySQL，需要安装 PHP，还需要安装连接器，以使它们能够实际协同工作。


    Ubuntu 的创建者随后意识到，如果你需要安装这些东西，他们可以创建一个脚本来为你安装所有这些内容。因此，如果你确切知道你的服务器要做什么，而且你真的不担心使其高度定制化，你可以运行
    *tasksel* 命令并选择你希望服务器成为哪种预打包的服务器类型。


    Ubuntu 的创建者想出了大约十到二十个不同的服务器安装包供你选择。当你运行 *tasksel* 命令时，会发生的情况是你将会看到一个 DOS 风格的屏幕，其中列出了所有这些服务器安装包。如果你想让你的服务器成为电子邮件服务器，你只需要选择
    *Email server*（电子邮件服务器），然后它会为你安装该特定服务器类型所需的所有软件。


    这促进了无麻烦的安装过程。它快捷且极其用户友好。使用此命令，你可以在 30 分钟或更短的时间内拥有一个完整运行的 Apache Web 服务器。


    关于这个命令，你必须记住的主要事情是你必须在命令前加上 *sudo*。你可能会问，为什么我们在执行 *man* 命令时没有加上 *sudo*？嗯，执行 *man*
    命令并不一定带来安全风险。因此，它是那些不需要 *sudo* 的命令之一。


    然而，对于 *tasksel* 命令，请记住我们使用此命令来安装应用程序。安装需要修改操作系统中的某些文件以容纳特定程序。如果某个黑客设法获取访问权限并执行
    *tasksel* 命令来安装病毒，你将面临非常严重的问题。


    Ubuntu 的创建者也意识到了这一点。他们担心人们会安装不应该安装到服务器上的软件。因此，如果你试图安装软件或执行任何管理任务，你必须在试图启动的命令前加上
    *sudo*。鉴于此，为了正确执行 *tasksel* 命令，你必须输入下面的语法：


    ```

    $ sudo tasksel

    ```


    输入上述命令并按下 ENTER 后，你会得到下面的屏幕：


    ![](img/38783e2b6fd4fbccebb177aa2953d843_53_0.png)


    现在，你进入了 tasksel 屏幕。如果你仔细看，你会看到各种可供选择的选项。这些都是你可以轻松安装到服务器上的不同包。如果你想让服务器用于云计算，你可以选择可用的云计算选项之一。如果你想让服务器成为
    DNS 服务器，你可以选择 DNS 服务器，以此类推。


    一旦你高亮了所选的包，你只需按下键盘上的空格键。这会在左侧的框上打上一个星号，在某些情况下打上一个勾，然后你可以按下 ENTER。当你按下 ENTER 时，服务器将会安装使其正常工作所需的所有软件包。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_53_1.png)


    此过程需要几分钟，具体时间取决于你的计算机速度。一旦过程完成，你将会拥有一个功能齐全的服务器。


    ## Apt-get


    现在我们将讨论如何安装单个程序。关于 Linux，你必须记住的是，这是一个开源世界。大多数软件都是免费的，或者你以奇怪的方式付费，例如服务协议等。在 Windows
    世界中，所有软件都必须经过激活程序。


    因此，无论你是使用 Quickbooks、Adobe 还是 Microsoft 软件本身，所有人都担心有人会盗版或窃取产品。为了防止软件被盗版，他们加入了这些疯狂的激活程序，要求你拥有带有正确
    CD 密钥的 CD 等。除此之外，一旦使用正确的代码安装后，你还必须去连接某个激活服务器，以便软件创建者可以验证你的安装。


    在 Linux 中，他们能够创建称为仓库（repositories）的东西。仓库是互联网上的地方，其中托管着成千上万的 Linux 程序。因此，你不必拥有某种磁盘，只需访问该仓库并从中安装应用程序即可。


    在 Windows 或 Mac OS 中，你必须拥有软件的 CD 或 DVD。如果你丢失了那个磁盘，你就倒霉了。在 Linux 中，所有软件或大部分软件都存放在这些仓库中。只要你有互联网连接，你就可以直接从这些仓库获取软件。这是在
    Linux 平台上安装软件的最简单方法。


    在 Linux 中还有其他安装应用程序的方式，我们将在后续章节中讨论它们。但现在，由于我们仍在讨论基础知识，我们将只关注从仓库安装。


    基本上，在 Linux 计算机内部，已经有一个配置文件告诉该 Linux 计算机仓库在哪里。当你运行 apt-get 命令时，这个 apt-get 命令会前往仓库，获取你想要获取的程序并将其为你安装。


    要正确执行 apt-get 命令，只需输入下面的语法：


    ```

    $ sudo apt-get install <name of program>

    ```


    假设你想在你的服务器上安装 Apache2 程序。只需输入下面的命令：


    ```

    $ sudo apt-get install Apache2

    ```


    输入上述命令并按下 ENTER 后，Linux 将会前往位于互联网上的仓库，找到 Apache2 程序，然后将其安装到你的 Linux 计算机上。就是这么简单。


    现在，假设你决定不想要 Apache2，而想使用不同的 Web 服务器。好吧，卸载 Apache2 的命令是：


    ```

    $ sudo apt-get remove Apache2

    ```

