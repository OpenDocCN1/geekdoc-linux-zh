    using 127.0.1.1 for ServerName

    ... waiting [ OK ]

    @server: $ _

    ```


    正如你在上面的屏幕中看到的，Linux 已成功停止该服务。此时，该 Web 服务器托管的域名在互联网上不可访问。网站当前处于离线状态。要启动服务，你只需要输入我们停止服务时输入的相同命令，只不过在末尾将
    stop 替换为 start 即可。


    ```

