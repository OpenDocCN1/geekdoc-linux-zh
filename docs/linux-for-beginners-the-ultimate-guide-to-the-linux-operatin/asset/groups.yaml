    # 顶部（Top）


    接下来我们需要讨论的是 `top` 命令。如果你来自 Windows 世界，可以把 `top` 命令基本上看作是任务管理器。因此，如果你在 Linux 命令提示符中输入
    `top`，你会看到内存的使用量、CPU 的使用量，以及当前系统上正在运行的所有进程。


    你会看到所谓的进程 ID 或 PID、每个进程的 CPU 使用率、每个进程的内存使用率、进程已运行了多长时间等。所以基本上，`top` 命令就是 Linux
    操作系统的任务管理器。


    在 Windows 任务管理器中，如果有一个进程正在运行而你需要终止它，你只需使用鼠标右键单击并选择“结束进程”。在 Linux 的 `top` 中，如果你需要终止或杀死某个特定进程，你只需输入以下语法：


    ```

    $ K <PID>

    ```


    因此，正如你从上面的命令语法中看到的，你只需输入字母 K 和进程 ID 号即可。例如，如果你看到进程 1578 正在做愚蠢的事情，你只需输入：


    ```

    $ K 1578

    ```


    输入该命令将终止该特定进程。Linux 中的每个进程都有自己唯一的进程 ID 号。因此，如果某个特定进程正在做它不该做的事情，用户通过 PID 识别并终止该进程非常容易。


    请记住，kill 或 terminate 命令仅在 `top` 内部有效。如果你不在 `top` 任务管理器内，kill/terminate 命令本身无法工作。如果你试图终止的特定进程对于
    Linux 服务器正常运作非常重要，系统会告诉你该进程无法被杀死/终止。如果是这种情况，你可能需要进行“一年一次”的重启才能终止该进程。


    因此，为了查看 `top` 任务管理器，你只需输入以下命令：


    ```

    $ sudo top

    ```


