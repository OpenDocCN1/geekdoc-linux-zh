    # ## Chapter 6: Editing Linux Files with Vim


    This chapter is about Vim for file editing within Linux. When you are dealing
    with Linux systems, editing configuration files is an extremely important thing.
    If you want a piece of software to do something specific, or if you want to customize
    something, you almost always have to open up a little configuration file and actually
    edit it. Whether it is a PHP.ini file, whether it is a password file, whether
    it is the .ht access file, basically all the configurations in a Linux system
    are held within a simple text file that you have to edit in order to make the
    system do different things.


    Now, there are a lot of different editors out there that many people use to edit
    configuration files within Linux. We are going to be talking about *Vim*, which
    is one of the most powerful file editors available for Linux.


    One of the big things that you have to understand (since most of you are coming
    from the Windows operating system) is that in Linux, there are no file associations.
    What we mean by this is that in Windows, you always have the file extension—association—after
    the filename. For example, if you have a Microsoft Word document named *Notes*,
    you will notice that the file extension that it will have is either *.doc* or
    *.docx*. Therefore, its complete filename would be either Notes.doc or Notes.docx.


    The file extension is what tells the Windows operating system what program to
    use to open that file. In Linux, there are no file associations. This is one of
    the main reasons why most people are afraid of using Linux; no file associations
    at all. Basically, all you have is just a filename. That''s it.


    Now you may be asking, “How do you know if it is a text file or any other file
