    system, you probably have no idea where those configuration files are in the first
    place. If you wanted to edit the *php.ini* file for example, the question that
    you may be asking since you are a beginner in Linux is, where is the *php.ini*
    file located?


    So, to find any particular file that you want to edit, you must first learn how
    to get to the folder or directory where that particular file is located. Again,
    to change directories, all you need to do is make use of the *cd* command just
    like in Windows. The syntax to change directory is:


    ```

    $ cd <name of folder>

    ```


    Now, there is more to this command than meets the eye. Remember, Linux is exceptionally
    literal when it comes to the interpretation of commands syntaxes. Again, let us
    make use of the diagram below:


    ![](img/38783e2b6fd4fbccebb177aa2953d843_77_0.png)


