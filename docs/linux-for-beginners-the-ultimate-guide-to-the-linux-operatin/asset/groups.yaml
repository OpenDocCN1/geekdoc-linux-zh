    # 第 5 章：Linux 基础导航


    现在我们需要讨论 Linux 操作系统中的基本文件夹导航。这与微软 Windows 略有不同。然而，有趣的事情是，它看起来与 Windows 足够相似，以至于当事情不对劲时，人们会有拿起电脑扔出窗外的冲动。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_63_0.png)


    以上面的图表为例。在 Linux 中，你也拥有 *cd* 命令。就像在 Windows 中一样，*cd* 命令代表更改目录。如果你想转到另一个目录或文件夹，你输入
    *cd*。如果你在一个文件夹中，比如在我们图中你在 *var* 文件夹中，并且你想进入 *var* 文件夹内的一个文件夹，在这个例子中是 *abc* 文件夹，你只需输入以下命令：


    ```

    $ cd abc

    ```


    所以，这是 *cd*，一个空格，然后是你想要进入的文件夹的名称。这将把你带入你试图进入的文件夹。现在，问题是，来自 Windows 世界的人习惯于在 *cd*
    命令后面加上正斜杠符号。如果我们将其应用于之前的命令，它看起来会像下面这样：


    ```

    $ cd /abc

    ```


    在这种情况下，Linux 会将正斜杠符号解释为 *根* 文件夹。Linux 会认为你想更改到 *根* 文件夹，然后在 *根* 文件夹中寻找 *abc* 文件夹。当然，一旦
    Linux 执行此命令，它将无法找到现有的 *abc* 文件夹，因为实际上，*abc* 文件夹位于 *var* 文件夹中。这就是你必须极其小心的地方。


    这就是为什么许多 Linux 管理员总是输入完整路径的原因


