    # Editing and Navigating


    Now that you know how to open a file using Vim, the next thing that you need to
    understand is how to modify a file using Vim. The first thing that you will notice
    when editing a vim file is that, if you use the arrow keys to move the cursor
    and start typing to edit the file, nothing happens. The reason is that you have
    to enter the Insert mode in Vim.


    In order to enter the Insert mode in Vim, you simply type the letter “a.” Once
    you do that, you will be able to edit and start typing your modifications on the
    file. When you are done making your modifications to the file, what you do to
    get out of the Insert mode is hit the ESC key on your keyboard.


    So the next thing is, if you edit a configuration file, especially like the php.ini
    or any other main configuration file, keep in mind that these are really long
    documents. If you are trying to edit a single word or value inside that extremely
    long file, finding that single word or value alone can be a tedious task.


    In order to find something in Vim, there are two simple commands that you can
    use to make your life easy. First, make sure that you are out of the Insert mode.
    Once you are out of Insert mode, go ahead and type the command below:


    ```

    :/ <name>

    ```


    That is colon, followed by a forward slash, and then a space, and then word of
    value that you are looking for within the file that you are trying to modify.
    Again, remember that capitalization is crucial. Make sure you capitalize the name
    correctly, or else Linux will not able to find what you are looking for. And if
    it did find something, it will be the incorrect one.


    What this command does is it looks from the place that you are at—your cursor—
    all the way down through the rest of the document. It will look for the word of
    value that you typed in your find command. Now, the important thing with searching
    is that you can put in wildcard characters.


    Let us say you are looking for the word max within the configuration file. To
    look for max, you need to type in the find command below:


    ```

    :/ max

    ```


    Now, one of the things most Linux experts do is whenever they are looking for
    a specific string in a file, they put a wildcard character, specifically an asterisk
    symbol, before and after the name of the string. The command would then look like
    this:


    ```

