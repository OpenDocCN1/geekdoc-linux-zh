    # The Linux Shell


    Now that we have the legalities out of the way, let us now talk about the shell
    of the Linux operating system. So what is a shell? The shell of an operating system
    is the screen that you use to interact with the operating system. If you''re thinking
    about Microsoft Windows, the Windows shell is that graphical user interface where
    we have the little mouse pointer which we use to go around and click on the various
    elements of the desktop, such as folders, icons, etc.


    The shell is of two types. The first one is the graphical user interface, or GUI.
    The second one is called the line user interface, or LUI. The LUI basically looks
    like DOS prompts. So, if you ever played with the Microsoft Windows DOS prompt,
    the line user interface is exactly that. It is that black and white screen where
    you type in different commands to get a particular output from the computer.


    In Linux, since this is a much more technical operating system preferred by programmers,
    geeks, engineers, or what have you, they prefer to use the line user interface.
    So when you go and install Linux, you can either have a graphical component where
    you can click things in the desktop much like a normal operating system, or you
    just have that little line user interface.


    The main thing that you have to remember about the shell is that the line user
    interface (LUI) is much more powerful than the graphical user interface (GUI).
    However, when you install Linux with just a line user interface for the shell,
    all you are going to get is a prompt. If you don''t know what you need to do with
    the command prompt, like the various shell commands for that operating system,
    you will be stuck.


    There are many cases where people install Linux with an LUI, but doesn''t know
    any Linux shell commands for the LUI. So basically, that''s the thing with the
    Linux line user interface. You are going to have to understand the commands in
    order to get the computer to do anything that you need it to do.'
  - '[PAGE 16]


    # **Root**


    The next big concept that you have to understand when you are going to be using
    Linux is the concept of Root. In Linux, root pertains to the highest level of
    anything. When you hear about the root user, it is referring to the administrator
    of the computer. The root user is the highest level user that you can be on the
    computer.


    So, if you can log in as root, you can do anything in the world you want to with
    the computer. Root can also mean the root of the operating system. It is where
    the operating system installed in the computer hard drive. If you think about
    this in terms of the Windows operating system, C:/ is the root of the Windows
    operating system because that is where it is installed.


    Root can also mean the highest level that a user can get into. What does this
    mean? In Linux, users have home folders. The home folder holds all of the user’s
    data, such as documents, settings, programs, etc. So the root of the user would
    be their home directory. The home directory is the highest level for a particular
    user.


    The main thing to understand whenever you are talking about root in Linux is that
    root is the highest level of anything. There’s actually a user account in Linux
    called root, and that user account is the absolute highest level user that you
    can begin the operating system in. Root can absolutely do anything. They have
    total access to everything in the operating system. Once we go into actually starting
    to type commands and making Linux do certain tasks, this concept of root is going
    to be crucial.'
  - '[PAGE 17]


    # Capitalization


    Let us now talk about something that just messes with every Windows user’s head
    when making the switch to Linux: Capitalization. So basically, you have uppercase
    and lowercase letters. In the Windows operating system, it doesn’t care whether
    you put in an uppercase or a lowercase letter. If you have a folder named “Home”
    in Windows, that is going to be the same as “HOME,” “home,” or “homeE.” Windows,
    except when it comes to passwords, does not care about capitalization.


    In the Linux world, keep in mind that Linux was created by computer professionals.
    These computer professionals coded the characters of letters, numbers, punctuations,
    etc. using ASCII text. In ASCII text, an uppercase “H,” for example, is actually
    a different character from a lowercase “h.” What this means is that in the Linux
    world, “Home,” “HOME,” “home,” or “homeE” would be considered different folders.


    Let us say you have a folder named “USER,” but for some reason your typed in “user”
    when you tried to access it. Linux will not be able to find that folder because
    the “user” folder does not exist. Only the “USER” folder, with the uppercase letters,
    does exist. So remember, capitalization matters in Linux.


    One of the places this can cause you big problems, and you have probably already
    seen this with some websites that you use, is when you are typing your username
    logins. In Linux, all username and passwords are case sensitive. So when you type
    in your username or password in Linux, make sure that you don’t have your caps
    lock key turned on or you are not accidentally holding down shift when you type
    in your username and password.


    This is actually not complicated. It is just that people are used to using Windows
    that they totally bring the mannerisms of using Windows over to Linux, where capitalization
    matters greatly.'
  - '[PAGE 18]


    # **Server vs. Desktop**


    There are generally two versions of Linux that everybody is going to provide.
    Whether you get Red Hat Linux, Ubuntu Linux, Fedora Linux, or whatever distribution
    that may be, they will normally have two versions of the distribution. One is
    going to be the server version while the other is going to be the desktop version.


    The main difference between the server versions and the desktop versions of any
    of these Linux operating systems is that, the server version is a stripped down
    version if Linux. Why? Because they figured that if you are going to be installing
    a server, you know specifically what you want installed on the server. What this
    means is that there will be no graphical user interface in the operating system,
    and a lot of the tools that you use to administer Linux will not be installed
    automatically.


    They figured that if you want the tool and you are installing a server, then you
    know how to install the tool to the server yourself. If you are just beginning
    to learn Linux, you are probably better off at this point in time to download
    the desktop version. The desktop versions of these distributions give you the
    graphical user interface right off the bat.


    When you install the desktop version, you’ll immediately be able to navigate the
    operating system using the graphical user interface, much like Microsoft Windows
    or Mac OS. You will have desktop icons, folders that you can click on, etc.


    It’s going to function differently compared to Windows or Mac, so you still have
    to learn how to use Linux. But it’s going to be an environment that you are probably
    going to be able to understand as soon as you boot into it. After installing the
    desktop version, you are going to boot straigt into a graphical environment. It
    is already going to have management tools installed, and you can play around and
    figure out how to use that graphical environment. That’s the main advantage of
    the desktop version over the server version of Linux.'
  - '[PAGE 19]


    # **Why Use Linux?**


    The reason that you should learn Linux and start deploying Linux is for server
    functionality. Linux is incredibly rock-solid. Once you install Linux, and once
    you get through all the quirks and you set up all the configurations, a Linux
    server will run until the CPU overheats and dies. It would just run non-stop.
    A Linux server, once installed correctly, can run for a hundred and fifty days
    continuously without having any problems.


    Linux is totally unlike Windows where you have to reboot it weekly to avoid memory
    leaks or crashes. Linux, as long as you configure it properly, would just run
    and do its job day in and day out. The reason that you should look at deploying
    Linux is for server functionality, whether it is for Apache web servers, mySQL
    database servers, virtualization servers, email servers, etc.


    When you setup a Linux server, that thing is going to be rock-solid. You are not
    going to have the same problems that you have with Windows, where you install
    Windows in a computer today and works really great, but then you keep getting
    many updates. And two years from now, the computers are working slower because
    all the updates that Microsoft has delivered actually decreased the performance
    of the computer itself.


    This is not the case with Linux. Once you install Linux, it is going to do its
    job with the same efficiency as when you first installed it on your computer—as
    long as you configure it properly, of course.


    Linux is a really robust and efficient operating system. At this point, it is
    important that you have a good foundation and understanding of where exactly Linux
    came from, and what are some of its basic but important concepts.'
