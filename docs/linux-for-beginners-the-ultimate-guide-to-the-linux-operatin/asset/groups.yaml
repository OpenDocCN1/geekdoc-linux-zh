    However, when you go in and change your configuration files in the software that
    you have running on your server, you may need to restart that individual software
    or that individual service. Let us say you have *Apache2* installed onto your
    Linux server and you change some of the configuration files. Those configuration
    files do not get loaded until your restart the *Apache2* service.


    Although the computer stays on all the time, you do have to restart the services
    every once in a while just to make sure they are up-to-date. What we are going
    to see now is how to start, stop, and restart services.


    With this, you need to stop in the syntax below:


    ```

    $ sudo /etc/init.d/<name of the program or service> start

    $ sudo /etc/init.d/<name of the program or service > stop

    $ sudo /etc/init.d/<name of the program or service > restart

    ```


    So, let’s say you changed the configuration files in the *Apache2* program in
    your server and you need to restart it. Simply type:


    ```

    $ sudo /etc/init.d/Apache2 restart

    ```


    This would restart the *Apache2* service, which would bring online whatever configuration
    changes that you have made. Now, let’s say you are playing with the web server,
    you are making some changes, and you do not want anybody from the outside world
    coming in while you do the changes. So you want to stop the services entirely,
    which basically makes the web server go offline. All you do is:


    ```

    $ sudo /etc/init.d/Apache2 stop

    ```


