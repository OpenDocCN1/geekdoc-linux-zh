    是一个国际操作系统。有些国家使用完全不同的键盘布局来输入文本。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_27_0.png)


    如果您使用的是类似日语、中文或其他亚洲键盘布局，请选择“是”选项。否则，请选择“否”。在您做出选择并按下 ENTER 键后，安装程序随后将询问您的键盘来源。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_27_1.png)


    请继续操作，选择适用于您的选项并按下 ENTER 键。现在，根据您选择的键盘来源，安装程序随后将要求您选择适用于您的键盘的具体键盘布局。例如，如果您的键盘源自美国，美国键盘有许多不同的布局，如下所示：


