    ## Chapter 4: Basic Linux Tasks/Commands


    In this chapter, we are going to go over the basic tasks that you can perform
    in Linux. We are going to show you how to install applications, how to update
    applications, how to look at the Linux task manager and even terminate processes
    if necessary, how to start services, and a whole lot more. These are the basic
    tasks that you will need to understand in order to do anything else in Linux.


    Everything that will be shown here will be on the Ubuntu Linux server version.
    This is not the desktop version. You are going to be looking at the LUI, or the
    line user interface. You will be typing in commands on the keyboard instead of
    clicking a bunch of options in a graphical user interface.


    While this may seem a little daunting and tedious, keep in mind that in Linux,
    all types of serious administration have to be done at the command line. This
    is an operating system developed by programmers for programmers primarily after
    all.


    Even if you are using the desktop version of Ubuntu Linux, it does not give you
    the full power of the operating system unless you use the terminal or command
    line to execute certain tasks. A lot of times, even if you are using a desktop
    version, you still have to open up a terminal screen and type out all the commands
    that you need to type out to administer the system.


    ### Sudo


    The first command that we need to talk about before you start doing any of the
    other commands is "sudo." Sudo basically means "super user." In the previous chapters,
    we discussed how different distributions do things slightly differently, and that
    every single distribution of Linux has its own quirks; its own little ways of
    doing things depending on what the creators are worried about.


    One of the things that the creators of Ubuntu Linux were worried about was security.
    As what we talked about before, in every Linux computer, there is a user called
    Root. Root is the highest level user on the computer. It is kind of like the administrator
    in a Microsoft Windows computer.


    Just like on a Windows computer, if somebody logged in as the administrator, or
    somebody logged in as root on Linux, they can do absolutely anything they want
    to that computer. They can install viruses, malware, or spyware, or basically
    just cause a lot of havoc. Hackers, using special programs and scripts, can also
    try to login as Root and cause all these problems.


    To alleviate the possibility of a hacker obtaining root access, the Ubuntu creators
    decided they never want anybody to login straight as Root. So in Ubuntu Linux,
    you cannot login as the user Root.


    Now, here comes the problem. Since you cannot login as Root, how do you do all
    these administrative tasks then? How do you execute administrative processes?
    What they have is this program called sudo. It is basically a command prefix that
    tells the operating system that you want to run a particular process as the super
    user or root.


    Sudo temporarily gives a user administrative access—root access—to execute an
    essential command in Linux. In the Windows operating system, sudo is the equivalent
    of the "Run as Administrator" option each time you want to run a program with
    administrative rights in Windows.

