    ## 第 2 章：安装 Linux 服务器版


    在本章中，我们将讨论如何安装 Linux，以便你可以试用并大致了解如何使用 Linux 操作系统。我们将讨论 Linux 服务器版和桌面版的安装方法，让你直观地了解每种版本的安装流程。请注意，我们将使用
    Ubuntu Linux 发行版的服务器版和桌面版。


    在如此多的不同发行版中，Ubuntu 目前似乎是最受欢迎的一个。对于 Linux 的所有发行版，你应该明白它们各自都有独特的怪癖。Ubuntu 也不例外。


    Ubuntu Linux 有一些其他发行版所没有的独特特性。整本书中我们都会使用 Ubuntu。请记住，如果你决定使用其他版本的 Linux，并尝试运行我们在后续章节中教授的一些命令，这些命令在其他版本中可能略有不同。因此，你可能需要进行一次谷歌搜索，以查看这些差异。


    例如，在 Ubuntu 中，你使用 “apt-get” 命令来获取和安装应用程序或程序到 Linux 计算机上。在 Red Hat 或 Fedora 中，你使用
    “YUM” 命令。基本上，归根结底，“apt-get” 和 “YUM” 命令做的是同样的事情。只是对于每个版本/发行版，命令的语法有所不同。


    现在，我们将学习如何安装 Ubuntu Linux 服务器版。再次强调，Ubuntu 是完全开源的；它完全免费。无论你是将 Ubuntu 用于个人用途还是商业用途，都可以免费使用。你只需要访问
    Ubuntu 网站，下载 Ubuntu 服务器版的 ISO 文件，然后将其刻录到光盘或放入 USB 闪存盘中。


    为了简洁起见，我们将不会深入讨论光盘刻录过程或可启动 USB 闪存盘的创建过程。如果你不知道如何将映像文件刻录到光盘或 USB 闪存盘上，网上有很多关于如何操作教程。只需查找并按照这些教程中列出的步骤操作即可。


    由于我们要安装的是服务器版本，请记住，最后我们只会得到 shell 的**行用户界面**（LUI）。换句话说，就是命令提示符处一个闪烁的光标。如果你不知道需要输入的命令，你就会陷入困境。


    此时我们不会讨论这些命令。我们将做的是走完操作系统的安装过程，以便你看到并了解它是如何工作的。你可能会问自己，既然有桌面版本又有服务器版本，那么服务器版本为什么如此简陋？为什么它像
    Microsoft Windows Server 操作系统那样没有任何图形用户界面？


    服务器版本之所以如此简陋，是因为在计算机的所有事务中，无论你在处理 Windows、Mac OS 还是 Linux，每一个功能或特性都是黑客的攻击向量。你在计算机中增加的每一个额外功能或特性，都是黑客可能利用或操纵的潜在弱点。


    以 Mac 操作系统为例：虽然 Mac 操作系统相当安全，但黑客已经学会如何入侵 Mac 操作系统正在使用的 Adobe Flash 小部件，然后通过这种方式接管计算机。即使
    Mac 操作系统像砖头一样坚固，其 Adobe Flash 功能现在已成为安全漏洞，黑客可以利用 Flash 软件接管一台漂亮的 Mac 计算机。


    现在，对于 Linux 服务器，由于这些将是主要 Web 服务器、数据库服务器或虚拟化服务器，你希望服务器尽可能安全。使服务器安全的方法之一，就是不给黑客任何可乘之机。你的服务器功能或特性越少，黑客入侵你系统的机会就越少。


    言归正传，让我们继续安装：


    - **下载** – 我们需要做的第一件事是获取 Ubuntu Linux 服务器操作系统。要获取 Ubuntu Linux 服务器版，你只需访问 http://www.ubuntu.com/。请看下图，了解
    Ubuntu 网站主页的样子：


    ![](img/38783e2b6fd4fbccebb177aa2953d843_22_0.png)


    对于 Ubuntu，他们创建了多个版本以执行许多不同的任务。Ubuntu 有桌面版，有上网本版，有云版本，甚至还有手机或平板版本。现在，由于我们在寻找 Ubuntu
    的服务器版本，我们将去寻找顶部说 “Server” 的链接。请点击上方 “Server”。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_23_0.png)


    点击 “Server” 后，你将看到上述屏幕。你还会看到页面中间附近有一个橙色的矩形按钮，上面写着 “Download Ubuntu Server”。请点击该按钮。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_23_1.png)


    点击 “Download Ubuntu Server” 后，你将看到两个版本的 Ubuntu 服务器版：Ubuntu Server 14.04.4 LTS
    和 Ubuntu Server 15.10。这两个版本的区别在于 14.04.4 LTS 版本是 Ubuntu 服务器最稳定的发布版。它拥有长期支持（Long
    Term Support），如果你将此版本部署在企业服务器上，并希望操作系统出现问题时获得帮助，这一点很重要。


    另一方面，15.10 版本是最新鲜的版本，其中实现了大多数最新功能。然而，拥有最新功能并不意味着它是稳定的。该版本中仍然存在一些开发者正在解决的轻微怪癖，且该版本的支持期仅为九个月。


    如果你为企业安装 Ubuntu 服务器并且需要最稳定的版本，你应该选择 Ubuntu Server 14.04.4 LTS 版本。如果你想玩玩操作系统的新功能并且不介意可能遇到的稳定性问题，可以选择
    Ubuntu Server 15.10 版本。


    现在，选择好你想安装的 Ubuntu 服务器版本后，它会询问你希望使用 64 位版本还是 32 位版本。希望你在尝试了解如何使用 Linux 时，已经理解了
    64 位和 32 位之间的区别。如果你不理解这两者的区别，基本上你只需要知道，对于服务器版本，你应该尝试下载并安装 64 位版本。


    如果 64 位版本无法安装在你想要安装它的计算机上，那么请下载操作系统的 32 位版本。一旦选定了要使用的版本，点击下载按钮，下载过程就会开始。请记住，文件大小约为
    600 MB，因此根据你的互联网速度，可能需要一些时间。


    在这种情况下，Ubuntu ISO 文件将被下载到你的计算机上。为了安装操作系统，你需要将该 ISO 文件刻录到 CD 或 DVD 上，然后将其放入计算机中。确保你的计算机从
    CD 或 DVD 启动。默认情况下，计算机设置为直接启动到计算机的硬盘，那里安装着原始操作系统。


    如果你想在你的计算机上安装 Ubuntu，请确保它首先从 CD 或 DVD 启动，而不是从 HDD 或硬盘启动。有很多方法可以做到这一点。但最常见的方法是按键盘上的
    “DELETE” 或 “F1” 键进入主板的 BIOS 设置，在那里你可以设置希望计算机从哪里启动。不同的主板制造商进入 BIOS 设置的方法不同，因此请查阅主板用户手册了解操作方法。


    - **安装** – 一旦从 CD 或 DVD 启动，系统会询问你希望以何种语言安装 Ubuntu Linux。

