    # Chapter 5: Basic Linux Navigation


    Now we need to talk about basic folder navigation in the Linux operating system.
    This is slightly different from Microsoft Windows. However, the funny thing is
    it looks close enough to Windows that when things do not work right, people have
    the urge to want to pick up their computer and throw it out the window.


    ![](img/38783e2b6fd4fbccebb177aa2953d843_63_0.png)


    Take the above diagram for example. In Linux, you also have the *cd* command.
    Just like in Windows, the *cd* command stands for change directory. If you want
    to go to a different directory or folder, you type in *cd*. If you are in a folder,
    let us say you are in the *var* folder in our illustration, and you want to go
    to a folder within the *var* folder, which in this case is the *abc* folder, all
    you need to do is type in the command below:


    ```

    $ cd abc

    ```


    So, that is *cd*, a space, and then the name of the folder that you want to go
    to. That will drop you in the folder that you are trying to go into. Now, the
    problem is, people in the Windows world are used to following the *cd* command
    with a forward slash symbol. If we were to apply this in our previous command,
    it will look like the one below:


    ```

    $ cd /abc

    ```


    What Linux does in this case is it interprets the forward slash symbol as the
    *root* folder. Linux will think that you want to change to the *root* folder,
    and then look for the *abc* folder within the *root* folder. Of course, once Linux
    executes this command, it will not be able to find an existing *abc* folder since
    in actuality, the *abc* folder is located in the *var* folder. That is where you
    have to be extremely careful.


    This is one reason why a lot of Linux administrators always type in the full path
    to'
