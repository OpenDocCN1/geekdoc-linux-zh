    # Introduction


    Thank you for buying *Linux for Beginners*. Linux In this book, we are going to
    give you an overview of the concepts that you have to understand before you actually
    start using Linux. We will explain to you the different elements of it that you
    ought to know about before you go and delve into the Linux world.


    Linux has many benefits. However, it also has numerous little aspects that can
    leave you perplexed. Not being able to understand these aspects can definitely
    cause you problems in the future.


    In this book, we’re going to talk about what those elements are. We are also going
    to talk about what Linux is, where it came from, and all of the fundamental concepts
    that you have to understand before you actually start building your own Linux
    servers and maintaining your own Linux systems. In addition, we’ll also teach
    you basic terminal commands that will get you up and running about within the
    Linux operating system.


    We hope you enjoy this book!'
