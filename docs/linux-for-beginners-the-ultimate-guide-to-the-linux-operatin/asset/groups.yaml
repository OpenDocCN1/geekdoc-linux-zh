    正如上面的插图所示，它现在要求您输入特定系统的主机名。基本上，这就是计算机名称。在 Windows 操作系统中，我们通常通过计算机名称来区分每台计算机。在
    Linux 中，计算机名称的等价物是主机名。因此，请继续输入您喜欢的计算机名称，然后按下 ENTER 键。


    按下 ENTER 键后，它将开始通过首先要求您选择时区来配置系统时钟。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_29_0.png)


    选择您的时区后，按下 ENTER 键。这样做之后，安装程序将再次实施您选择的选项。完成后，安装程序现在将询问您在安装 Linux 之前希望如何设置硬盘。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_29_1.png)


    此刻，不要使用标有“引导使用整个磁盘并设置 LVM”的选项。我们将在后续章节中详细讲解 LVM。暂时，请继续选择标有“引导使用整个磁盘”的选项并按下 ENTER
    键。执行此操作后，它将要求您选择磁盘分区。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_30_0.png)


    根据您计算机上硬盘的数量，此处显示的选项数量会有所不同。只需选择您希望安装 Linux 的正确硬盘并按下 ENTER 键即可。


    按下 ENTER 键后，安装过程现在将询问您是否要将所做的更改——您选择的选项——写入磁盘。这基本上是 Linux 在询问您是否确定之前选择的选项以及一切是否符合您的偏好。如果是，请选择“是”选项并按下
    ENTER 键。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_30_1.png)


    ![](img/38783e2b6fd4fbccebb177aa2953d843_31_0.png)


    正如上面的插图所示，安装程序现在将实施您选择的所有选项。它将安装 Linux 服务器在您的系统上正常运行所需的所有核心基本文件。现在，取决于您安装的是什么类型的计算机以及什么类型的硬件，这可能是一个非常快速的过程，也可能是相对缓慢的过程。这就是
    Linux 有趣的地方。您可以将其安装在任何设备上，从戴尔最现代的三千美元服务器计算机，到十二年前价值三千美元的服务器。


    Linux，尤其是服务器版本，无论您的系统规格有多旧都能工作。Linux 的系统要求非常低，它甚至可以在大多数人今天认为过时的系统上运行。与微软 Windows
    的系统要求相对较重不同，Linux 的系统要求极轻，您甚至可以在 USB 拇指驱动器上安装它并在任何计算机系统上从中运行整个操作系统。


    当 Linux 完成核心基本文件的安装后，它将要求您输入 Linux 用户帐户的全名。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_31_1.png)


    正如屏幕上所述，您的真实姓名将作为默认原始名称使用，例如当您发送电子邮件时，以及任何显示用户真实姓名的程序中。您实际上并不要求在这里输入全名。因此，对于那些不愿意写下真实姓名的人来说，不要担心。请继续输入您希望用于
    Linux 帐户的任何虚构姓名。之后，安装程序现在将要求您为 Linux 帐户输入用户名。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_32_0.png)


    只需输入您想使用的任何用户名，然后再次按下 ENTER 键。现在，它将要求您为 Linux 用户帐户输入密码。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_32_1.png)


    输入您希望用户帐户拥有的密码。按下 ENTER 键后，它将要求您再次验证密码，因此请再次输入密码，然后按下 ENTER 键。现在，请查看下图中的屏幕：


    ![](img/38783e2b6fd4fbccebb177aa2953d843_33_0.png)


    如果您收到与上述类似的屏幕，这基本上是 Linux 在告诉您您选择的密码较弱。这就是 Linux 的安全程度。它会告诉您密码较弱，并且您需要更改它，选择一个更难被黑客破解的密码。如果您收到此屏幕，只需返回并将密码替换为更复杂的密码。


    在下一步中，安装过程将询问您是否想要加密配置您的主目录。加密意味着它实际上会加密——编码——您放入主目录的文件和文件夹。您的主目录基本上是 Microsoft
    Windows 中的文档和设置文件夹。这是您存储大多数基本文件和设置的地方。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_33_1.png)


    你们中的许多人可能认为一开始就启用加密是好事。然而，问题在于，由于您是 Linux 的新手，建议不要加密主目录。否则，如果您加密了主目录，然后您的 Linux
    计算机崩溃，您很可能会丢失所有数据。如果您没有加密目录，并且意外做了不该做的事情并导致系统崩溃，那么您可以取出硬盘并相对轻松地恢复数据。


    如果您加密该目录，它将被编码。当您的 Linux 操作系统崩溃时，由于文件是加密的，您将更难恢复数据。


