    @server: $

    ```


    现在我们在 Linux 服务器操作系统的命令提示符或终端处。在这个例子中，让我们假设你的系统上安装了 Apache2，并且你想要停止该服务。你应该做的第一件事是输入单词
    sudo，在 sudo 后加一个空格，然后输入 /etc/init.d/Apache2，再在后面加一个空格，然后是单词 stop。


    在你输入上述命令并按下 ENTER 之后，你会看到下面的屏幕：


    ```

