    现在，考虑一下上面的示例图表。假设你位于*根*目录，想要进入*www*目录。如果你输入：


    ```

    $ cd www

    ```


    Linux 将无法带你进入 *www* 目录；它会提示该目录不存在。为什么？因为记住，你当前位于 *root* 目录。就 Linux 而言，此时 *root*
    目录内只有两个文件：*etc* 和 *var*。要从 *root* 目录进入 *www* 目录，你必须输入：


    ```

    $ cd /var/www

    ```


    现在你可能会问，上述命令中第二个斜杠是否会把你带回 *root*？不会。Linux 仅将第一个斜杠解释为 *root* 目录。第二个斜杠将被解释为一条指令，指示从它前面的目录中寻找紧随其后的目录。


    这里还有一个例子：假设你位于 *www* 目录，想要进入 *etc* 目录。如果你输入：


    ```

    $ cd etc

    ```


    此命令将无法正常工作。请记住，你当前位于 *www* 目录。就 Linux 而言，*www* 目录内部并没有 *etc* 目录。为了使其正常工作，你必须输入以下命令：


    ```

    $ cd /etc

    ```


    因此，再次说明，斜杠的第一次出现将被 Linux 解释为首先前往 *root* 目录的指令。一旦进入 *root* 目录，它随后会找到 *etc* 目录。当然，由于
    *etc* 目录确实存在于 *root* 文件夹内，此命令将成功带你进入 *etc* 目录。


    ## 列出/显示文件


    现在，当你进入某个目录后，了解该目录中还有什么其他内容始终很重要。要在 Linux 中列出文件，只需使用 *ls* 命令即可。


    ```

    $ ls

    ```


    然后，根据你的需求，你可以应用两个参数之一。如果你执行：


    ```

    $ ls -l

    ```


    将会列出所有的文件和文件夹。此外，它还会显示这些文件和文件夹的权限、修改日期、文件/文件夹的组所有权以及单独的所有者。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_79_0.png)


    很多时候，这可能变成一个非常大的文件列表。因此，你还可以输入：


    ```

    $ ls -m

    ```


    这次，Linux 不会给你一个长长的列表，而是将所有信息打印在一个整洁的块中，以便你可以查看关于文件和文件夹的每一处细节。这就是在 Linux 中列出文件和文件夹所需的全部操作。


    现在，假设你想编辑一个关键的配置文件，但你完全不知道该文件在哪里。幸运的是，Linux 确实提供了搜索选项。为了搜索文件和文件夹，你只需输入：


    ```

    $ sudo find -iname <文件/文件夹名>

    ```


    这就是 *sudo*，一个空格，后面跟着 *find* 一词，再一个空格，参数 *-iname*，再一个空格，最后是你正在查找的文件或文件夹的名称。现在你可能会问，*-iname*
    参数是做什么的？它的作用是让搜索不区分大小写。


    记住，就像我们从第 1 章开始所提到的，在 Linux 中大小写很重要。由于你是 Linux 新手，你可能不知道哪些文件是大写字母，哪些是小写字母。如果在搜索参数中加入
    *-iname*，无论文件的大写或小写情况如何，它都能定位到你正在查找的文件或文件夹。


    例如，如果你在查找名为 home 的文件夹，并使用带有 -iname 参数的搜索命令，它将返回所有以 home 为文件夹名的文件夹。无论该文件夹命名为 Home、homeE、hOme、HOme、hoME
    还是 HOME，它都会出现在搜索结果中。


    相反，如果你搞错了正在查找的文件或文件夹名称的大小写，且未使用 -iname 参数，搜索可能会返回无结果，因为没有任何文件或文件夹匹配该大小写格式。


    此外，在 Linux 中执行 find 命令时，不要忘记 sudo 命令。如果你不在开头加上 sudo，find 命令将以一种非常烦人的方式失败，即它不会告诉你失败了。它只是简单地不给你任何结果。因此，你会以为计算机上不存在该文件，而实际上它确实存在，只是你没有使用
    sudo。


    对于你要查找的任何文件或文件夹，在进行搜索时也可以将通配符与其名称一起使用。在第 6 章中，我们简要讨论了在 Vim 中搜索字符串时使用星号通配符的方法。在查找
    Linux 文件系统中的文件和文件夹时，你也可以使用星号通配符。


    如果在文件或文件夹名称前加一个星号，意味着你在查找该特定文件或文件夹名称“之前”的任何内容。假设你正在尝试在 Linux 中定位一个配置文件。在 Linux
    中，所有配置文件都有 .conf 后缀。如果你在查找一个配置文件，但忘记了确切名称，你可能希望调出所有以 .conf 为后缀的文件。在这种情况下，你只需输入以下命令：


    ```

    $ sudo find -iname *.conf

    ```


    此命令将查找文件名或文件夹名以任何内容开头并以 .conf 结尾的文件。那么，如果你知道要查找的文件名，却不知道后缀怎么办？在这种情况下，你需要输入以下命令：


    ```

    $ sudo find -iname php*

    ```


    此命令将查找以 php 开头并以任何内容结尾的文件名或文件夹名。


    ## 创建、删除、移动、复制、重命名


    现在我们需要讨论在 Linux 中创建、删除、移动、复制和重命名文件和文件夹。我们要做的第一件事是讨论创建文件夹。这很直接。你只需输入：


    ```

    $ sudo mkdir <目录/文件夹名>

    ```


    这就是 sudo，后面跟一个空格，然后是 mkdir 参数，再一个空格，最后是你想要创建的文件夹或目录的名称。正如你可能已经猜到的，*mkdir* 代表“make
    directory”（创建目录）。


    请记住，如果你没有提供目录的完整路径，此命令将简单地在你当前所在的目录内创建该目录或文件夹。


    ![](img/38783e2b6fd4fbccebb177aa2953d843_81_0.png)


    例如，假设你位于 var 目录，想要在 *etc* 目录内创建一个 *Notes* 文件夹。如果你输入：


    ```

    $ sudo mkdir Notes

    ```


    此命令将只是在 *var* 目录中创建 *Notes* 文件夹。要在 *var* 内部于 *etc* 目录中创建 *Notes* 文件夹，你必须输入完整的路径，如下所示：


    ```

    $ sudo mkdir /etc/Notes

    ```


    这样，Linux 会先进入根目录，然后进入 etc 目录，并在 etc 目录内创建一个 Notes 文件夹。输入完整的文件路径将确保无论你位于文件系统的哪个位置，都能将文件夹创建在正确的位置。这就是在
    Linux 中创建文件夹或目录所需的全部操作。


    删除文件或文件夹同样简单。你只需输入以下命令：


    ```

    $ sudo rm <文件或文件夹名>

    ```


    这就是 sudo，一个空格，后面跟着字母 rm，再一个空格，最后是你想要删除的文件或文件夹的名称。你可能已经猜到，rm 代表 remove（移除）。例如，假设你想删除一个名为
    Notes 的文件。你只需输入：


    ```

    $ sudo rm Notes

    ```


    然而，删除文件夹稍微不同。你实际上仍然遵循与删除文件相同的语法。唯一的区别是，在删除文件夹时，你必须在命令末尾添加 *-R* 参数。参数 *-R* 代表 recursive（递归）。通过使用递归参数，你基本上是在告诉
    Linux 对该文件夹的内容执行相同的操作。


    假设你想删除包含三个文件的 *www* 文件夹。为此，你只需输入：


    ```

    $ sudo rm www -R

    ```


    此命令不仅会删除文件夹本身，还会删除其中的三个文件。如果你在删除文件夹命令的末尾没有添加递归参数，Linux 将无法成功执行它，因为如果你不删除内容，就无法删除文件夹。唯一能在没有递归参数的情况下成功删除文件夹的情况是，该文件夹最初就是空的。


    在 Linux 中，严格来说没有专门用于重命名文件和文件夹的命令。取而代之的是“重命名”，我们在 Linux 中有 *move*（移动）命令。例如，假设你有一个名为
    *file1* 的文件，你想将其名称更改为 *file2*。为此，你必须输入以下命令语法：


    ```

    $ sudo mv <旧文件名> <新文件名>

    ```


    这就是 *sudo*，一个空格，后面跟着字母 *mv*，再一个空格，原始文件的名称，再一个空格，最后是新的文件名称。因此，回到我们的例子，如果你想将名称 *file1*
    更改为 *file2*，你必须输入：


    ```

    $ sudo mv file1 file2

    ```


    此命令会将 *file1* 的名称更改为 *file2*。它在技术上仍然是重命名文件。但在 Linux 中，我们使用 *move*（移动）这一术语。那么，关于在文件夹之间移动文件呢？同样的语法仍然适用。然而，你不仅要输入文件和文件夹的名称，还必须指明完整路径。


    假设你想将一个位于 *var* 文件夹内的名为 *file1* 的文件移动到 *root* 目录中的 *etc* 文件夹。为此，你必须输入以下命令：


    ```

    $ sudo mv /etc/var/file1 /etc/file1

    ```


    这就是 *sudo*，一个空格，后面跟着代表移动操作的字母 *mv*，再一个空格，源文件的准确文件路径，再一个空格，最后是目标路径的准确文件路径。就是这么简单。


    复制是 Linux 中的另一项重要任务。很多时候，特别是当你处理配置文件时，在你开始对原文件进行修改之前，必须创建一个备份文件。否则，如果你搞乱了原文件，你可能会损坏与该文件关联的程序


    '
