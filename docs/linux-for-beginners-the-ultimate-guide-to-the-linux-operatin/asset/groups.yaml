    \n# 引言\n\n感谢购买*《Linux for Beginners》*。在这本书中，我们将概述在实际开始使用 Linux 之前必须理解的概念。我们将解释你在深入了解\
    \ Linux 世界之前应当了解的各个元素。\n\nLinux 有很多优点。然而，它也有许多小细节可能会让你感到困惑。无法理解这些细节确实会在未来给你带来问题。\n\
    \n在这本书中，我们将讨论这些元素是什么。我们还将讨论 Linux 是什么，它来自哪里，以及在开始构建自己的 Linux 服务器和维护自己的 Linux 系统之前必须理解的所有基本概念。此外，我们还将教给你基本终端命令，以便你能够开始在\
    \ Linux 操作系统中运行。\n\n希望你喜欢这本书！\n\n# 第 1 章：什么是 Linux？\n\n在这本书中我们需要讨论的第一件事是 Linux\
    \ 的起源。简而言之，Linux 是一个操作系统。对于不知道什么是操作系统的读者，或者那些以为知道但可能已经忘记操作系统定义的读者，实际上它是位于硬件和允许你在计算机上完成生产任务的软件之间的软件层。\n\
    \n操作系统使软件能够与硬件通信。它允许你在硬盘上存储信息，向打印机发送打印任务等。如果你在正常的 Windows 环境中——即微软 Windows 操作系统——你的硬件在底层，Windows\
    \ 操作系统位于其上，然后你有例如 Microsoft Office 这样的软件位于操作系统之上。\n\nLinux 是一个操作系统，充当物理设备和程序指令代码之间的中介——即桥梁。你需要意识到的主要一点是，在\
    \ Linux 世界中，你运行的软件类型与在 Windows 操作系统中运行的软件完全不同。像 Microsoft Office 和 Adobe Photoshop\
    \ 这样的桌面应用程序通常不在 Linux 环境中运行。Linux 通常运行服务器——Apache Web 服务器、数据库服务器、Web 虚拟化服务器等。\n\
    \n然而，市面上有各种专为个人桌面计算机制作的 Linux 发行版。这些 Linux 发行版在某种程度上类似于 Windows 和 Mac OS，因为它们运行相同类型的程序，如文字处理程序、照片和视频编辑程序、网页浏览应用、程序开发应用、游戏等。这些\
    \ Linux 发行版更多面向只想拥有免费操作系统替代品的家庭用户。\n\n然而，Linux 最初并非作为一个操作系统开始。Linux 是林纳斯·托瓦兹（Linus\
    \ Torvalds）在赫尔辛基大学求学期间创建的一个内核。内核至关重要，但单独使用时是无用的。它只能在完整操作系统的背景下发挥作用。Linux 内核与 GNU\
    \ 操作系统结合使用。想象 GNU 是一个复杂的大型拼图，中间缺少一大块——这块大的就是 Linux 内核。完整的拼图等价于一个功能完整的操作系统。\n\n\
    理解什么是内核很重要，因为这是 Linux 的组成部分定义。内核是操作系统的核心部分，负责将你所有应用程序接口连接到物理硬件。\n\n当今市场上有两种主要竞争的内核——Windows\
    \ 内核和类 Unix 内核。Linux 内核属于后者，BSD、Mac OS 和 Solaris 也是如此。术语“类 Unix”指的是它们运行方式类似于或基于最初的\
    \ Bell Labs UNIX 操作系统。\n\n内核通常分为三类：\n\n- 微内核 – 微内核仅管理它必须管理的部分：CPU、内存和 IPC（进程间通信）。如果不是\
    \ IPC、内存或 CPU，它自动被视为附件并可在用户模式下处理。\n- 整体式 – 像 Linux 这样的整体式内核是微内核的对立面。它们不仅涵盖 CPU、内存和进程间通信，还涵盖其他事物，如设备驱动程序、文件系统管理和系统服务器调用。\n\
    - 混合式 – Windows 内核属于混合式，因为它具备在用户模式和监督模式下选择运行内容的能力。\n\n因此，在 1991 年到 1994 年之间，林纳斯·托瓦兹通过将\
    \ GNU OS 与 Linux 内核相结合，创建了 Linux 操作系统。基本上，林纳斯·托瓦兹想要一个不仅免费，而且可以根据他的编程需求进行定制的操作系统。Linux\
    \ 是他业余做的一个创意小项目。Linux 的一大特点是，由于它有“ux”后缀，并且你使用的许多命令看起来很像 UNIX 命令，人们认为 Linux 是一种\
    \ UNIX 操作系统。这完全不是事实。UNIX 是其自身类型的操作系统。Linux 也是其自身类型的操作系统。\n\n林纳斯·托瓦兹从头开始创建了整个 Linux\
    \ 操作系统。他创建 Linux 的原因是想为大众创建一个开源操作系统。在早期，UNIX 不是开源的。如果你想使用 UNIX，必须付钱才能使用。当然，微软\
    \ Windows 就是微软 Windows。你总是必须付费才能使用微软 Windows。\n\n因此，作为计算机工程师的林纳斯·托瓦兹希望拥有一个完全免费的操作系统。他和他在麻省理工学院（M.I.T.）的朋友们希望拥有一个无需付费即可使用，并且能帮助他们以更高效、更简单的方式创建他们想要的计算机程序的操作系统。换句话说，他们希望拥有一个可以根据其需求定制且完全免费使用的操作系统。\n\
    \n关于 Linux，需要记住的一点是，尽管它是一个操作系统，但它的外观与微软 Windows 或 Mac OS 完全不同。\n\n"
