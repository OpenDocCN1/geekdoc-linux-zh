    ## 第 4 章：基础 Linux 任务/命令


    在本章中，我们将介绍你可以在 Linux 中执行的基础任务。我们将向你展示如何安装应用程序、如何更新应用程序、如何查看 Linux 任务管理器，以及在必要时如何终止进程，如何启动服务，等等。这些是你必须在
    Linux 中执行其他任何操作之前理解的基础任务。


    这里展示的所有内容都将基于 Ubuntu Linux 服务器版。这不是桌面版。你将看到的是 LUI，即行用户界面。你将在键盘上输入命令，而不是在图形用户界面中点击一堆选项。


    虽然这看起来可能有点令人生畏且繁琐，但请记住，在 Linux 中，所有类型的严肃管理操作都必须在命令行上完成。毕竟，这是一个主要由程序员为程序员开发的操作系统。


    即使你正在使用 Ubuntu Linux 的桌面版，除非你使用终端或命令行执行某些任务，否则它不会赋予你操作系统的全部功能。很多时候，即使你使用的是桌面版，你仍然需要打开终端屏幕并输入你需要键入的所有命令来管理系统。


    ### Sudo


    在你开始执行其他任何命令之前，我们需要讨论的第一个命令是 "sudo"。Sudo 基本上意味着"超级用户"。在之前的章节中，我们讨论了不同的发行版在做事方式上略有不同，并且每一个
    Linux 发行版都有自己的怪癖；根据自己的创建者所担心的事情，它们拥有自己独特的小习惯。


    Ubuntu Linux 创建者担心的事情之一是安全性。正如我们之前讨论的，在每一台 Linux 计算机上，都有一个名为 Root 的用户。Root 是计算机上最高级别的用户。它有点类似于
    Microsoft Windows 计算机中的管理员。


    就像在 Windows 计算机上一样，如果有人以管理员身份登录，或者在 Linux 上有人以 root 身份登录，他们可以对那台计算机做任何他们想做的事。他们可以安装病毒、恶意软件或间谍软件，或者基本上造成很大的破坏。黑客也可以使用特殊的程序和脚本尝试以
    Root 身份登录，并导致所有这些问题的发生。


    为了减少黑客获取 root 访问权限的可能性，Ubuntu 创建者决定他们永远不希望任何人直接以 Root 身份登录。因此在 Ubuntu Linux 中，你不能以用户
    Root 的身份登录。


    现在，问题来了。既然你不能以 Root 身份登录，那么你要如何执行所有这些管理任务呢？你要如何执行管理进程？他们拥有的是一个名为 sudo 的程序。它基本上是一个命令前缀，告诉操作系统你希望以超级用户或
    root 身份运行某个特定进程。


    Sudo 临时授予用户管理访问权限——root 访问权限——以在 Linux 中执行关键命令。在 Windows 操作系统中，sudo 相当于每次你想在 Windows
    中以管理员权限运行程序时的"以管理员身份运行"选项。


    '
