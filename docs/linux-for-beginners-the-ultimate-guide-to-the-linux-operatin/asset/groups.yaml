    ## Chapter 6: Editing Linux Files with Vim


    This chapter is about Vim for file editing within Linux. When you are dealing
    with Linux systems, editing configuration files is an extremely important thing.
    If you want a piece of software to do something specific, or if you want to customize
    something, you almost always have to open up a little configuration file and actually
    edit it. Whether it is a PHP.ini file, whether it is a password file, whether
    it is the .htaccess file, basically all the configurations in a Linux system are
    held within a simple text file that you have to edit in order to make the system
    do different things.


    Now, there are a lot of different editors out there that many people use to edit
    configuration files within Linux. We are going to be talking about *Vim*, which
    is one of the most powerful file editors available for Linux.


    One of the big things that you have to understand (since most of you are coming
    from the Windows operating system) is that in Linux, there are no file associations.
    What we mean by this is that in Windows, you always have the file extension—association—after
    the filename. For example, if you have a Microsoft Word document named *Notes*,
    you will notice that the file extension that it will have is either *.doc* or
    *.docx*. Therefore, its complete filename would be either Notes.doc or Notes.docx.


    The file extension is what tells the Windows operating system what program to
    use to open that file. In Linux, there are no file associations. This is one of
    the main reasons why most people are afraid of using Linux; no file associations
    at all. Basically, all you have is just a filename. That''s it.


    Now you may be asking, “How do you know if it is a text file or any other file
    type?” That is actually the weird thing about Linux. They expect you, as the system
    administrator, to know what that file is. So if you are going to modify text files,
    understand that they are not going to have .txt file extensions. It will just
    be the filename. You must understand what file it is you need to modify first
    before you use a file editor software to edit that file.


    All the configuration files in Linux have to be edited using a file editor. If
    you do not understand how to edit documents or text in Linux, you are not going
    to get anywhere.


    ### Starting Vim


    Now, we need to talk about how to start *Vim*, particularly how do you open or
    create a file with it. It is pretty straightforward. The first thing that you
    want to do is type the command *sudo*, followed by a space, followed by the word
    *vim*, followed by another space, and then the name of the file that you want
    to open.


    ```bash

    $ sudo vim <filename>

    ```


    Notice that the word *vim* is in all lowercase. Remember: capitalization is essential
    in Linux, so make sure to type *vim* in all lowercase. The same thing applies
    when typing in the name of the file that you want to open.


    That is all that you have to do to open a file using *Vim*. If, for example, you
    are trying to open a *PHP.ini* file, simply type the command below:


    ```bash

    $ sudo vim php.ini

    ```


    Now, if you are trying to create a new file, the “$ sudo vim <filename>” syntax
    also creates files. So if you type that command in the command prompt, that will
    create the file and open it at the same time. With that in mind, opening files
    and creating files uses the exact same command.


    For some of you users with experience in using other versions of Linux who are
    also reading this book, you may notice that you can run the *vim* command without
    *sudo*. The problem with running *vim* without *sudo*, at least in the Ubuntu
    distribution, is sometimes it will work right and sometimes it will not. It is
    a case-to-case basis wherein some of the configuration files will open and can
    be edited without using *sudo* while others will not edit properly.


    And you can run into problems where, if you open a configuration file with simply
    *vim* and the filename, you will not be able to save the file once you are finished
    editing it. Why? Because you did not open that file as an administrator. This
    is why it is always considered good practice to use *sudo* whenever you are doing
    critical tasks in Linux.


    ### Changing File Ownership


    File ownership is another important thing that we need to take note of since we
    are using *Vim* to edit configuration files. So what do we basically mean by file
    ownership? Keep in mind that most of the software that you install on your Linux
    system came from their respective developers. In other words, they came from an
    external source. When you install them onto your Linux system, the ownership of
    all of the files of that software technically still falls on the developer.


    Now, here is the problem: In Linux, you cannot edit any file unless you are the
    owner of that file. For example, when you install *Apache2*, *MySQL*, or *PHP*
    on your Linux web server, all the files associated with that software are owned
    by *root* (the user associated with the source of the file). If you try to go
    in and edit some of those files, many times you will not be able to edit them
    because you are not the owner.


    So, if you are going to edit configuration files, the first thing that you ought
    to do is change the ownership from whoever it is to you, just to make your life
    easy. To do that, you simply type in this command:


    ```bash

    $ sudo chown <username> <filename>

    ```


    The *username* in the above command pertains to the name of the user that you
    want to change the permission to. *Filename*, on the other hand, pertains to the
    name of the file whose ownership you want to change.


    Let us say your username is *reader* and you want to change the ownership of the
    file named *notes*. All you need to do is type the command syntax below:


    ```bash

    $ sudo chown reader notes

    ```


    Once you do this, you will now become the owner of the file and thus will have
    the ability or permission to edit it.

