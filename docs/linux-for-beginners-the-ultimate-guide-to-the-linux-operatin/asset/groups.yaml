    现在你可能会问，“你怎么知道它是文本文件还是其他类型的文件？” 这实际上是 Linux 的一个奇怪之处。他们期望你，作为系统管理员，知道该文件是什么。因此，如果你要修改文本文件，请理解它们不会有
    .txt 文件扩展名。它只是一个文件名。在你使用文件编辑器软件编辑该文件之前，必须首先理解需要修改的是哪个文件。


    Linux 中的所有配置文件都必须使用文件编辑器进行编辑。如果你不懂如何在 Linux 中编辑文档或文本，你将寸步难行。


    ### 启动 Vim


    现在，我们需要谈谈如何启动 *Vim*，特别是如何用它打开或创建文件。这很直接。你要做的第一件事是输入命令 *sudo*，后跟一个空格，然后是单词 *vim*，再跟一个空格，然后是你想要打开的文件名。


    ```bash

    $ sudo vim <filename>

    ```


    请注意，单词 *vim* 是全小写的。请记住：在 Linux 中大小写至关重要，因此确保以小写输入 *vim*。当你输入想要打开的文件名时，同样的规则也适用。


    这就是使用 *Vim* 打开文件所需的全部操作。例如，如果你试图打开 *PHP.ini* 文件，只需输入以下命令：


    ```bash

    $ sudo vim php.ini

    ```


    现在，如果你试图创建新文件，“$ sudo vim <filename>” 语法也可以创建文件。因此，如果你在命令提示符中输入该命令，它将同时创建文件并打开它。考虑到这一点，打开文件和创建文件使用完全相同的命令。


    对于阅读本书的具有使用其他版本 Linux 经验的某些用户来说，你们可能注意到可以不加 *sudo* 运行 *vim* 命令。在 Ubuntu 发行版中，不加
    *sudo* 运行 *vim* 的问题在于，有时它会正常运作，有时则不会。这是一个具体情况具体分析的问题，有些配置文件可以在不使用 *sudo* 的情况下打开并编辑，而有些则无法正确编辑。


    你可能会遇到一些问题，例如，如果你只用 *vim* 和文件名打开配置文件，在完成编辑后你将无法保存该文件。为什么？因为你没有以管理员身份打开该文件。这就是为什么在执行
    Linux 关键任务时，始终使用 *sudo* 被认为是良好的实践。


    ### 更改文件所有权


    由于我们要使用 *Vim* 编辑配置文件，文件所有权是另一个我们需要留意的重要事项。那么我们基本上所说的文件所有权是什么意思？请记住，你在 Linux 系统上安装的大多数软件都来自其各自的开发者。换句话说，它们来自外部来源。当你将它们安装到
    Linux 系统上时，该软件所有文件的所有权在技术上仍然属于开发者。


    现在，问题在于：在 Linux 中，除非你是文件的所有者，否则你无法编辑任何文件。例如，当你在 Linux Web 服务器上安装 *Apache2*、*MySQL*
    或 *PHP* 时，与该软件相关的所有文件都由 *root*（与文件来源相关的用户）所有。如果你试图进入并编辑其中一些文件，很多时候你将无法编辑它们，因为你不是所有者。


    因此，如果你要编辑配置文件，你应该做的第一件事是将所有权从当前所有者更改为你自己，以简化你的生活。为此，你只需输入此命令：


    ```bash

    $ sudo chown <username> <filename>

    ```


