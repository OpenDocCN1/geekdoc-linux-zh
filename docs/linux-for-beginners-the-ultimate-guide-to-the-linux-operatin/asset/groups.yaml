    This means that while nobody from the outside world is able to reach the website
    that you are hosting, you are still able to make changes to the configuration
    files, edit options, modify settings, etc. Only the actual web server component
    is not functioning at this point.


    Let’s now go ahead and look at how this looks like when you actually execute it
    at the command prompt of Linux.'
