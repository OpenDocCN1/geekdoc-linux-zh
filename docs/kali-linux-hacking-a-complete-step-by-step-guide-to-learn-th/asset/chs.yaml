  那么，黑攻击是指识别计算机或网络安全系统中的任何弱点的行为，然后利用该弱点获取访问防火墙后面隐藏内容的必要权限。例如，一个常见的例子是使用设计用于识别密码的算法，以便以数字方式拨开网络或账户的锁。该账户随后被利用以获得所需的访问权限。黑攻击并不总是出于伤害之图——一些人出于合法目的这样做，例如为了找到系统中的缺陷并修复它。另一些人选择这样做是为了娱乐自己，就像做一个复杂的拼图或尝试解决日益复杂的数学题以测试和磨练能力一样。还有人这样做是为了出于某种目的窃取信息，无论是为了财务利益，还是为了瘫痪他们所处的系统。黑攻击有几种形式，例如欺骗某人点击电子邮件中的附件，从而获得对计算机的访问权限。然而，其他形式需要多得的技术知识，开发出欺骗并触发系统的能力，以授予那些本应受保护的访问权限和信息。本书将主要讨论与技术专业知识相关的方法，而不是使用阴险的手段来尝试从一开始就欺骗他人授予访问权限。本质上，黑攻击是进入他人系统的行为，但黑攻击的方法差异很大。这些行为都以不同的方式发生并服务于不同的目的，但结果是相同的——它们允许信息被盗取和使用，或者让程序以非预期的方式被使用。例如，有些人可能会黑攻击他们的视频游戏主机来运行模拟器，以便他们玩不同游戏的\
  \ ROM，包括某些可能根本没有打算在该系统上使用的游戏。另一些人可能利用他们的技能窃取信息并卖给寻求窃取身份的人。尽管如此，黑客有许多选项可以使用以获取他们想要的所有信息。本节的其余部分将讨论一些常见的黑攻击方法。\n\
