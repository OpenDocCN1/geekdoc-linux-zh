  \n- 通过 `Nmap` 脚本检测漏洞\n\n\n\n该工具本身非常常见，而且它同时兼容命令行（CLI）和图形界面（GUI），这意味着它不仅通用且强大，而且非常灵活。\n\
  \n# 如何使用 Nmap 理解和利用漏洞\n\n当你准备好使用 Nmap 时，你有几种不同的选项。根据你能够提交的命令，你将能够扫描一个目标、有限的目标或多个目标。目标决定了你具体将如何通过使用该系统的过程，但归结底，这样做需要一些时间。\n\
  \n## 扫描命令\n\n可能 Nmap 最基本的用法就是通过扫描。当你想要进行扫描时，你有几种不同的选项。你可以选择你想要针对的目标，无论是单个个体、几个个体，还是整个目录。想象一下，你想扫描一个单一单元或系统。你将使用以下命令进行操作，并根据情况更改\
  \ IP 地址。\n\n```\nnmap target\n### nmap target.com\n### nmap 192.143.1.1\n```\n\n\
  这将扫描那个特定的系统。如果你希望扫描与该系统相关的所有子网，你的命令将略有不同。它将变为：\n\n```\nnmap target/cdir\n### nmap\
  \ 192.143.1.1/24\n```\n\n相反，如果你想扫描几个不同的目标，你只需为它们标记并用空格分隔 IP 地址即可。例如，你可能会写：\n\n```\n\
  nmap target target1 target2\n### nmap 192.143.1.1 192.141.1.2\n```\n\n你甚至还有只扫描连续的几个\
  \ IP 地址而不扫描整个子网的选项。当你想要扫描 50 个相关的 IP 地址而不是整个子网时，你将使用以下命令：\n\n```\nnmap target-50\n\
  ### nmap 192.143.1.1-50\n```\n\n这将导致一次性扫描从 192.143.1.1 到 192.143.1.50 的每一个 IP 地址。你可能还会认为你需要的是一个正在扫描的多个主机的列表——在这种情况下，你需要添加正确的参数。在这种情况下，该参数为\
  \ `-sL`，它将创建如下命令提示符：\n\n```\nnmap -sL target/cdir\n### nmap -sL 192.143.1.1/24\n\
  ```\n\n然而，有时你可能想要扫描整个子网，但知道你需要让该子网的一个部分完全不被扫描以避免检测。特别是有一个必须避开的单个 IP 地址时，你可以使用用于排除该特定\
  \ IP 地址的参数来创建代码。这非常简单。你只需要像这样添加 `-exclude` 参数：\n\n```\n### nmap 192.143.1.1/24 -exclude\
  \ 192.143.1.13\n```\n\n如果你有一个包含所有排除 IP 地址的单文件，你甚至可以输入该文件，在排除项中插入文件名。你的扫描甚至可以变得更加具体——如果你有正确的代码，你还可以开始指定具体要针对哪些端口。\n\
  \n## 扫描技术与命令\n\n当然，你也可以执行其他类型的扫描。Nmap 提供了几种不同的扫描技术，为了有效地工作，你有必要了解这些技术。本节将为你提供使用使用其他几种扫描类型所需的信息。\n\
  \n### TCP SYN 扫描\n\n使用提示符 `-sS` 执行的 TCP SYN 扫描是一种基础扫描。它通常被称为“半开放”，因为它从远程主机收集信息，而不完成书中之前讨论过的\
  \ TCP 进程。在此类扫描中，Nmap 向正确的目标发送一个 SYN 包，但从不忙于实际创建或触发会话。最后，交互永远不会被目标计算机记录，因为计算机从未启动过会话。这就是\
  \ TCP SYN 扫描如此有益的之处。虽然它是默认使用的，但你需要 root 权限。当然，如果你在执行此操作时使用的是 Kali Linux，那将没有问题，因为你默认处于\
  \ root 账户下。此类扫描的命令看起来如下：\n\n```\n#### nmap -sS 192.143.1.1\n```\n\n### TCP Connect()\
  \ 扫描\n\n当由于任何原因无法进行 SYN 扫描时，将使用这种作为默认扫描。为了利用此扫描，需要使用 `-sT` 代码，你的系统将完成 TCP 握手过程，这需要另一个系统记录该事务。这仅适用于发现\
  \ TCP 端口而非任何其他端口。要使用此代码，你的命令将如下所示：\n\n```\n#### nmap -sT 192.143.1.1\n```\n\n###\
  \ UDP 扫描\n\n此扫描寻找目标机器上开放的 UDP 端口。由于目标是 UDP 端口，它不使用 SYN 包。但是，如果你结合使用 `-sS` 和 `-sU`\
  \ 命令，仍然可以使其更高效。在使用这种扫描方法时，Nmap 发送 UDP 包并等待某种响应。错误消息意味着端口是关闭的，但正确的响应将让你知道端口实际上是开放且可的。在这种情况下，你将使用以下命令：\n\
  \n```\n#### nmap -sU 192.143.1.1\n```\n\n### FIN 扫描\n\n有时，根据你提供的参数，TCP SYN 扫描并不是正确选择。通常，防火墙会阻止\
  \ SYN 包，因此你需要通过另一种方法。当这种情况发生时，你可以尝试使用 FIN 扫描——它只发送一个 FIN 标志，这意味着它不需要完成会触发 Nmap 检测的\
  \ TCP 事务。FIN 扫描的正确命令是 `-sF`，例如：\n\n```\n#### nmap –sF 192.143.1.1\n```\n\n这将带回大量信息——它应该提供主机是在线还是离线、延迟是多少以及端口状态。目标不会记录此类扫描，但你可以获取这些信息。\n\
  \n### Ping 扫描\n\n与目前为止讨论的其他形式不同，ping 扫描仅用于确定主机当前是否存或活跃。它不发现端口是否开放。它确实需要 root 权限，因为有可能发送\
  \ ICMP 包。在没有 root 权限的情况下，它将使用 `connect()` 调用完成命令。ping 扫描的命令是 `-sP`，其用法如下：\n\n```\n\
  #### nmap -sP 192.143.1.1\n```\n\n### 版本检测\n\n如果你想确定目标计算机或任何端口正在使用什么种软件，就需要此命令。它不会检测任何开放端口，但它确实需要从任何开放端口获取信息，以便提供关于检测到的软件的信息。第一步是使用\
  \ TCP SYN 扫描找到开放端口，然后将 `-sV` 指向特定的可用端口。\n\n```\n#### nmap –sV 192.143.1.1\n```\n\
  \n### 空闲扫描\n\n在空闲扫描中，你可以在扫描时保持隐身性。在这种特定技术中，你不会从自己的 IP 地址发送任何真实包。相反，它利用目标网络内部的一个主机来发送包。这需要你首先找出该\
  \ IP 内部的开放端口，然后使用僵尸主机与目标通信。在此代码中，你将首先使用僵尸主机的 IP，然后是目标的 IP 创建如下命令：\n\n```\n#### nmap\
  \ -sI 192.143.1.4 192.143.1.1\n```\n\n在这种情况下，192.143.1.4 僵尸主机被用于与 192.143.1.1 通信而不会被发现，因为它们属于同一个网络。\n\
  \n## 渗透测试\n\n最终可以分为七个步骤或阶段——当你能够通过这些阶段时，你更有可能发现某种弱。在利用这些阶段时，你会发现自己的突破能力不断增长，并识别出任何你需要修复的漏洞。渗透测试的阶段包括：预约前、侦察、威胁建模、利用、后利用、报告和重测。\n\
  \n### 预约前\n\n这一步更是一种预防措施，但它是至关重要的——当你处于预约前阶段时，你需要从确定范围开始。基本上，你正在寻找确切的目标。你需要知道你将要做什么以及哪些是不允许的。如果你正在尝试进入他人的网络，请确保清除你的踪迹并合法地工作。\n\
  \n### 侦察\n\n在此阶段，你将致力于收集信息。虽然你可能更倾向于跳过这一步，但这是必要的。你需要知道目标是什么以及它是如何活跃的。当你把所有信息整理好后，你将知道哪些是有用的，哪些不是。然后进入第三步。\n\
  \n### 威胁建模与识别漏洞\n\n第三步仍然关于规划——此时，你想利用之前步骤中收集的所有信息，并开始脑暴网络可能面临的最真实的威胁。这一阶段还可以利用漏洞扫描器发现当前存在的弱点。\n\
  \n### 利用\n\n此时是开始尝试访问网络了。你应该有几个不同的位置可以用来攻击系统。你发现任何可以访问的弱点了吗？你可能会尝试获取 shell，或者尝试获取某些凭据以便成为\
  \ root 用户。这一阶段在很大程度上取决于你正在尝试的网络，并且需要创意。\n\n### 后利用\n\n接下来是后利用阶段。在此阶段，你可能因为时间耗尽或达到终点而完成测试。此时，你必须列出所有漏洞并提供给客户。当你完成扫描后，你应该做笔记，或者对执行成功或失败的部分进行截图。你应该能够弄清楚你所执行的利用是重要的——你是进入了主服务器还是卡在了计算机上？你从系统中获取的信息价值如何？此外，你还应该考虑如何修复发现的任何漏洞。\n\
  \n### 报告\n\n在此阶段，是时候编写你的报告了。这可能并不有趣，但如果你已经通过渗透测试来帮助他人，你需要确保报告写得整洁。你能够传达任何弱和漏洞，这将使客户面临风险。你应该尽可能诚实地说明发生了什么以及如何修复。如果他们的系统真的是易受利用的，你应该确保一切都已修复。这一阶段报告越清晰，你的工作就越好。\n\
  \n### 重测\n\n这是一个渗透测试人员都愿意经历的阶段。在此期间，你将给客户时间去修复漏洞，然后重新评估已修复的部分。如果你使用的是 VPN，你需要确保你的\
  \ IP 地址没有被使用。如果你没有使用 Tor，你需要对文件进行适当编辑。这是为了继续书中提到的。\n\n# 第 6 章：如何匿名并保持匿名\n\n如果你希望成为黑客，匿名性是至关重要的。如果不小心，将极易暴露你的\
  \ IP 地址并失去访问。在管理系统之前，你可以清除自己的踪迹。有很多工具可以帮助你匿名化过程，例如代理服务器、VPN 和 TOR。\n\n### 代理链\n\n\
  隐藏 IP 地址的最简单方法之一是使用代理服务器。通过代理链，你可以清除自己的踪迹，使其更难追踪。然而，你也可以通过链用多个代理来实现。只要至少有一个代理，就可以避免问题。配置可以在\
  \ `/etc/proxychains.conf` 找到。使用代理链时，你将使用非常简单的命令：\n\n```\nproxychains [command]\n\
  ```\n\n现在，想象你想通过代理使用 Nmap 进行匿名扫描。可能会使用：\n\n```\nproxychains nmap -sS 192.143.1.1\n\
  ```\n\n这将通过代理对 IP 地址触发 SYN 扫描。理解语法后，你可以完成命令。在 Linux 任何其他地方，都有名为 config 的文本文件可以打开来编辑设置。打开配置文件并添加代理。你会看到\
  \ `dynamicchains` 这一——它被注释了，这意味着它没有被使用。如果你想激活它，应该删除 `dynamicchains` 行前面的 `#` 标记。你也可以在文件中找到随机链。你可以对\
  \ `dynamicchains` 行进行注释并移除 `randomchain` 行的 `#`。你可以随时使用这些选项之一。\n\n### VPN\n\n你可以添加到系统中的另一层安全防护是通过在代理地址之上添加\
  \ VPN。这是常见做法——它允许对盗版或其他问题提供进一步保护。它还允许你在不被发现的情况下扫描其他网络——这在许多国家通常被认为是非法的。即使你没有做任何错误，仅仅扫描网络就足以被视为非法。现在，由于你正在阅读如何最佳操作，额外的安全保护你自己。\n\
  \n#### 第一步：启用 VPN\n\n使用 Kali Linux 时，VPN 选项通常是禁用的，所以在继续之前必须打开它。这需要你输入自己的命令，例如：\n\
  \n```\napt-get install network-manager-openvpn\n```\n\n这将启用 VPN。之后，重启 network-manager。\n\
  \n#### 第二步：下载并提取 openvpn\n\n现在，你需要下载 `openvpn.zip` 文件。这并不困难——代码如下：\n\n```\nwget\
  \ https://www.openvpn.net/openvpn.zip\n```\n\n一旦文件下载并保存，你需要解压文件并确保它存放在正确的目录。你可以通过以下命令操作：\n\
  \n```\nunzip -q openvpn.zip -d /etc/openvpn\n```\n\n#### 第 3 步：配置 Network Manager\
  \ 使用 VPN\n\n这一步涉及设置 Network Manager 使其识别并允许使用 VPN。这涉及进入 Network Manager，进入 connections（连接），然后切换到\
  \ VPN 标签页。点击 `+` 添加你想添加的连接。将类型设置为 `VPN`。然后点击创建。你需要为连接提供名称、网关 IP 地址以及如果适用的用户名和密码。要获取\
  \ CA 证书，你必须前往 `/etc/openvpn` 并选择 `ca.crt`。然后点击 Advanced（高级）并勾选 LZO 压缩框。点击 OK，然后关闭窗口。你的\
  \ VPN 现在已经可以使用。\n\n### Tor\n\nTor 是你可以使用的另一层安全。它已经在 Kali Linux 中可用，但你需要手动安装。如果你想使用\
  \ Tor 浏览器，你需要从官方网站获取包，然后使用以下命令从目录提取包：\n\n```bash\ntar -xvf tor-bundle\n```\n\n记住，目录中以\
  \ \"tor\" 开头的文件就是你的 Tor 文件。然后你需要运行 `start-tor-browser` 脚本：\n\n```bash\n./start-tor-browser\n\
  ```\n\n\n\n\n\n*   命令 Shell 负载（Command shell payloads）：它们允许人员针对不同的目标或主机运行脚本或命令。\n\
  *   动态负载（Dynamic payloads）：它们允许测试人员在尝试规避任何杀毒软件时创建出独特的负载。\n*   Meterpreter 负载（Meterpreter\
  \ payloads）：它们允许接管设备监控以夺取其他会话。\n*   静态负载（Static payloads）：它们允许进行端口转发并在网络之间进行通信。\n\
  \n# Metasploit 模块\n\nMetasploit 包含多个模块。这些是核心组件——即被预期执行非常特定操作的软件。它们也代表了你可以在 Metasploit\
  \ 框架内可以实现的操作。这些模块很容易找到：你只需要找到以下目录即可：`/path/to/metasploit/apps/pro/msf3/modules`\n\
  \n模块类型将由特定模块的用途以及该模块负责的操作决定。特别是有八种值得讨论的类型，包括：\n\n*   **漏洞利用 (Exploits)**：漏洞利用模块旨在执行一系列命令，然后针对目标系统或应用程序中发现的漏洞。该模块旨在利用任何漏洞以获取对任何目标系统的访问权限。漏洞利用模块有几种不同的示例，例如代码注入和\
  \ Web 应用程序利用。\n*   **负载 (Payloads)**：负载是指在成功攻破当前系统后运行的 shell 码。负载允许你精确决定想要如何连接到\
  \ shell，以及在获得控制权后你想要对目标执行什么操作。它可能涉及打开一个 meterpreter 或不同的命令 shell。`Meterpreter` 是一种特殊的高级负载，它允许写入\
  \ `DLL` 文件，从而根据需要创建新功能。\n*   **编码器 (Encoders)**：编码器是能够将一种代码形式转换为另一种形式的关键性工具。\n*\
  \   **监听器 (Listeners)**：设计用于隐藏并进行监听的恶意软件。当它们能够监听时，它们能够收集各种重要信息，导致敏感信息泄露，例如密码、社会安全号码或人们很大程度上希望保密的其他信息。\n\
  *   **辅助功能 (Auxiliary function)**：旨在补充设备其他功能的工具和命令。\n*   **Shell 码 (Shellcode)**：编写为在进入目标后立即激活以实现特定目的的代码，从而提供一种更隐蔽进入并激活的方式。\n\
  *   **NOP 生成器 (NOP generator)**：这是一种能够产生一系列随机字节的工具，旨在绕过任何标准 ID 以穿过防火墙或重要的阻碍。\n*\
  \   **后利用代码 (Post-exploitation code)**：后利用模块允许你在被利用的目标内部获取更多信息或设法获取进一步的访问权限。这些包括哈希转储（hash\
  \ dumps）或服务枚举器。\n\n\n\n\n\n## 使用 Metasploit\n\n当你安装并准备好使用 Metasploit 时，你需要做的就是某种方式收集信息，无论是通过首先进行端口扫描，还是寻找漏洞扫描器来找到突破口。一旦你进入系统，你只需要选择一个利用程序（exploit）和载荷（payload），Metasploit\
  \ 就会为你完成其余的工作。实际上，利用程序是在防御性较强的网络中识别弱点并进行利用的方法。\n\n该框架专门设计用于利用各种模型和接口，例如 `msfconsole`\
  \ 交互式界面等。它可以在终端/`cmd` 中运行，并且兼容 Metasploit 社区 Web 界面，该界面将支持渗透测试。\n\n## 安装 Metasploit\n\
  \n然而，在使用 Metasploit 之前，你必须先安装它。安装它需要你首先禁用所有的防火墙和防病毒软件。由于该文件本身的原因，当你尝试在防火墙和防病毒软件运行\
  \ own 的情况下安装它时，它通常会被视为恶意文件。这会中断你的安装过程。因此，最好在继续之前先禁用防火墙和防病毒软件。不过，这意味着你必须确保你的下载来源是合法且安全的。如果你不小心，你可能会无意中下载对你实际上可能是危险或问题的程序。\n\
  \n在关闭防火墙和防病毒软件后，确保你也拥有管理员权限。这在 Kali Linux 中不应该是问题，因为你默认应该拥有 root 用户的访问权限，但如果你由于某种原因没有，或者你正尝试在不同的\
  \ Linux 发行版上安装 Metasploit，你需要确保自己也拥有该管理员权限。\n\n最后，要安装 Metasploit，最好的办法是从 Rapid7\
  \ 网站安装。这样做可以让你获得适用于你特定操作系统的安装程序。它还包含一个自包含的环境，你可以用它来更新和运行框架。这意味着你需要的所有内容都将在初始安装过程中处理完毕。当然，如果你选择，也可以手动进入配置\
  \ Metasploit，但该步骤是不必要的，并且在本书中将跳过该步骤。当你拿到文件后，启动安装程序。它会提示你输入特定的框架。作为 Kali Linux 用户，你应该发现这已经预装好了，无需继续操作。\n\
  \n## 管理 Metasploit 数据库\n\n现在，是时候停下来完成数据库信息后再继续了。当你准备好管理数据库时，你需要使用 `msfdb` 脚本来配置\
  \ `postgresql` 运行，以便数据库存储在 `~/.msf4/db/` 中。准备好启动时，使用以下命令：\n\n```bash\n$ msfdb init\n\
  ```\n\n这将触发数据库启动，随后你就可以可以使用几个最适合你的任何一个命令。这些命令增加了额外功能，并帮助你管理可用空间。在此阶段你需要包含的最常用命令包括：\n\
  \n- `msfdb reinit`: 这会导致你的数据库被删除并重新初始化以刷新它。\n- `msfdb delete`: 使用此特定命令将导致你的数据库被完全删除，而像上一个命令那样重新初始化。\n\
  - `msfdb start`: 此命令重新启动数据库，使其开始运行。\n- `msfdb stop`: 使用此命令时，将完全停止数据库的运行。\n- `msfdb\
  \ status`: 此命令将允许终端打印当前数据库状态，在终端中显示所有关键信息。\n\n## Metasploit 数据存储 (Datastore)\n\n\
  除了目前列出的所有内容外，还有数据存储——这是 Metasploit 框架的另一个核心组件，但经常被完全忽略。这是一系列值，允许你在 Metasploit 框架内配置你想要的任何行为。数据存储允许接口更改设置，而载荷能够修补操作码（opcodes），利用程序能够指定特定参数。这还允许框架在模块之间传递数据。\n\
  \n特别是，Metasploit 有两种不同的数据存储：全局数据存储和模块数据存储。为了有效使用 Metasploit，你需要熟悉这两者。全局数据存储可以允许所有模块使用它。当数据存储选项被设置时，所有模块都将具有访问权限。要定义全局数据存储选项，你需要使用命令：`setg`。\n\
  \n另一方面，模块数据存储的设计初衷是让只有指定的模块能够利用它，而不是所有人。\n\n## Metasploit 工作空间 (Workspaces)\n\n\
  Metasploit 内部的工作空间允许你对数据库中的主机和数据进行分段。这允许你使用工作空间在你想要测试的任何分段之间创建隔离。。例如，想象你想为组织内的每个子网都创建一个工作空间，因为你想将主机数量限制在指定的网络。这将导致你创建工作空间，例如每个部门一个。这意味着每个组织的部门都将获得自己的工作空间。\n\
  \n当你使用工作空间时，你可以导入数据、处理这些数据，然后将这些数据直接导出，以确保数据可以自动重用。这也允许同一个工作空间自动报告关于任何正在交互的当前主机的信息。如果你想创建一个工作空间，必须使用带有\
  \ `-a` 选项的 `workspace` 命令。创建的任何工作空间都会成为当前使用的。\n\n想象一下，你想为组织中的 A、B、C 三个部门各创建一个工作空间。你会写：\n\
  \n```bash\nmsf workspace -a A\nmsf workspace -a B\nms workspace -a C\n```\n\n总的来说，当然，如果你准备好使用\
  \ Metasploit，你会发现它实际上非常容易上手。你只需要知道如何遍历系统以及如何理解你所看到的内容。例如，当你知道提供哪些类型的模块时，你就可以选择那些适合你的模块。因为\
  \ Metasploit 已经为你填满了各种信息，这些信息旨在确保你只需少数命令就能完成几乎任何操作，而无需不断地手动告诉系统你想让它做什么，因此它实际上非常易用。这正是它变得流行的原因。\n\
  \n最终，使用 Linux 自带的免费版本应该没问题，尽管如果你愿意付费，也有升级版本可用，归根结底，这将取决于个人观点，你必须根据自己的想法和需求做出决定。当然，升级版尽管价格昂贵，但它们被设计得非常强大。它们针对高技能的渗透测试专业人员，他们清楚地知道自己在做什么以及将得到什么，并能够证明那个巨额价格的合理性。然而，你不必这样做。\n\
  \n# 第 8 章：数字证书\n\n就像在现实世界中，我们需要携带身份证明来证明自己的身份，特别是当我们做某些重大事情时（如买车或贷款），你的互联网连接也需要某种程度的识别。这就是数字证书大显用场。当你拥有满有价值信息的服务器时，你可能希望确保你的信息在任何时候都尽可能受到保护——这是合理的。然而，你如何确定那些访问你服务器信息的人确实是他们所说的人，或者确实被允许访问呢？\n\
  \n特别是在今天，当我们如此担心数据被盗取或接管时，很容易感到数据面临风险，而且很有道理——事实如此。然而，当你引入数字证书层时，你为你的服务器增加了额外的安全层，或者感觉你的隐私信息受到了保护。你可以确保，尽管你使用的是可能位于公共互联网上的网站，但你的数据本身是了认证。\n\
  \n如果你有一个局域网（LAN），你可能不需要这种主要的认证。通常情况下，这是通过名为 `OpenSSL` 的工具完成的——它是 Kali Linux 自带的工具。\n\
  \n## 什么是数字证书？\n\n数字证书本质上是将公钥的所有权与拥有它的个人关联起来的方法。这些证书用于共享公钥和加密数据。当你使用这些时，你实际上获得了一种保护数据的方法。在数字证书内部，有几层信息都具有不同的用途——有经过认证的公钥，有标识所有者的元数据，还有数字签名。\n\
  \n## 证书颁发机构 (CA)\n\n证书颁发机构受信任的第三方，负责维护 `PKI`，发布数字证书并保护它们免受攻击或利用。通过第三方对网站进行身份验证并确保数据受保护，你可以使用自己的\
  \ `PKI`（公钥基础设施）。\n\n## 证书类型\n\n最终，有几种类型的证书提供给个人。这些证书来自不同的来源，取决于其用途：\n\n- **根证书 (Root\
  \ Certificate)**: 根证书是由 `CA` 生成的公钥证书，它是链的顶端。\n- **中间证书 (Intermediate Certificate)**:\
  \ 中间证书位于中间的，由 `CA` 用于签名和发行用户证书。\n- **SSL 证书 (SSL Certificate)**: SSL 证书是全球标准，允许浏览器和服务器之间进行加密通信。\n\
  - **域名验证证书 (Domain validated)**: 这些证书告诉你是正在使用正确的域名。\n- **组织验证证书 (Organization validated)**:\
  \ 这些证书提供了更多的保证——它们确认持有者有权使用特定域名，并经过额外的确认以确保个人拥有该证书。\n- **扩展验证证书 (Extended validation)**:\
  \ 此证书在申请人能够按照 `CA` 标准证明他们是自己的人后发行。\n\n## 生成自签名 SSL 证书\n\n正如你预期的，Kali Linux 自带了一个可以创建证书的程序。这是通过\
  \ `OpenSSL` 完成的。虽然这并不总是有效，并且在你尝试使用时可能会被拒绝，但你可以这样做。你可以通过你的自签名 SSL 证书获得所有的加密优势，但不会获得身份验证优势，这意味着人们不会信任你的网站。\n\
  \n首先，打开 `OpenSSL`。在那里，你需要使用以下命令：\n\n```bash\nopenssl genrsa -out key.pem 2048\n\
  openssl req -new -sha256 -key key.pem -out csr.csr\nopenssl req -x509 -sha256 -days\
  \ 365 -key key.pem -in csr.csr -out certificate.pem\n```\n\n1. 第一个命令触发一个 2048 位的\
  \ RSA 私钥 (`key.pem`)——这是你的密钥应该采用的格式。\n2. 第二个命令触发创建证书签名请求 (`csr.csr`）。\n3. 第三个命令触发生成一个可在\
  \ Web 服务器上使用的自签名 x509 证书 (`certificate.pem`）。\n\n\n\n\n\n### Shell 的局限性\n\n* 语法有时晦涩懂\n\
  * 运行速度缓慢\n* 容易无意中遗漏关键内容\n* Shell 语言的数据结构是字符串\n* 难以在 Shell 中进行单元测试\n\n这些问题都促使了替代\
  \ Shell 的想法。虽然 Shell 一被用作一种正规的编程语言，但它是不完整的——它的设计初衷并非成为一种完整的编程语言，而 Python 却是。\n\n\
  Python 本身是一种解释型、高级编程语言，旨在动态特性。它旨在面向对象，并具有分层设计。它既可以作为脚本语言使用，也可以作为两个不同应用程序或组件之间的某种代理。Python\
  \ 学习非常简单，侧重于提供一个易于阅读的系统，使其比某些更复杂的语言更容易访问；而那些语言可能强调陈旧、过时的短语或语法，且目前仅仅是因为传统和熟悉性才使用它们。\n\
  \n然而，熟悉并不总是一件好事。有时，比任何时候都需要的都是改变，或者至少以某种方式进行适应，以确保你能够持续成长。这正是 Python 和 bash 汇合的地方。\n\
  \n### 为什么要转向 Python\n\n从本质上说，提高生产力的最佳方法就是放弃使用 Shell，转而使用 Python 代码进行工作。因为 Python\
  \ 更易读、速度更快，并允许进行正规的测试，因此至少在某些方面，转向 Python 看起来是有有益的。\n\n有趣的是，大多数 Linux 发行版都已默认安装了\
  \ Python。如果你打开命令行提示符并输入 `python`，你应该获得一个 Python 解释器。单此这一点就表明，在考虑编写脚本时，使用 Python\
  \ 替代 bash 是值得的。单是其易用性，就能节省时间。\n\n以下是从关注 Shell 脚本转向使用 Python 作为替代方案的一些最具说服力的理由：\n\
  \n* 它是默认安装的\n* 它易于阅读且语法简单\n* 它是一门解释型语言\n* 它是一种功能齐全的编程语言\n* Python 拥有标准库和大量的第三方库，可以使用各种工具\n\
  * Python 的标准库按日期和时间排序，允许你将日期转换为任何格式以与其他日期进行比较\n* Python 是一个更简单的过渡衔接\n\n\n\n\n\n\
  这里的观点并不是让你完全抛弃 shell——shell 绝对有其自身的用途。然而，shell 在某些方面也确实薄弱。想一下，如果能以一种更简单的方式来处理你的几项任务该有多好——如果能有更符合逻辑的语法和命令，而不是仅仅因为你现在“应该”记住它们才去强行记忆，那该多好。\n\
  \n当然，在某些领域，`bash` 无疑更加简单。这正是我们应该将两者结合起来的原因。当它们结合在一起时，它们能够取长补短——得益于一个可以在两者之间轻松切换的系统，你将兼得两者的优势。`Python`\
  \ 在几种不同的语境下更完整、更易用，而 `bash` 是为 Linux 设计的。不可否认，`bash` 的某些部分用起来确实更好用。例如，考虑在 `bash`\
  \ 中将文件从桌面移动到目录：\n\n```bash\ncd Desktop\nmv folder directory\n```\n\n注意看它是么简洁整洁。现在，在\
  \ `Python` 中，它看起来更像这样：\n\n```python\nimport os\nimport glob\nfor fname in glob.glob('folder'):\n\
  \    os.rename(fname, 'directory')\n```\n\n不可否认，`Python` 代码显得过于臃肿，尤其是当和 `bash` 那段短小精悍的语句相比时。这正是为什么最好的办法是结合使用两者，而不是尝试将它们拆分并替换其中一个。\n\
  \n虽然我们已经讨论过可以在 shell 中引入 `Python` 代码，但反向操作也是可行的——你可以在 shell 中引入 `Python` 脚本，也可以在\
  \ `Python` 中插入你的 shell 脚本。你所做的只是导入 `OS` 模块。如果你这样做，你就可以在 `Python` 中使用你的 `bash` 命令——这意味着你实际上能够轻松地混合并组合你的命令。想象一下那些在家里说两种语言长大的孩子，他们往往会在同一个句子中无缝地切换语言，在一种语言中插入几个单词，同时又交替插入另一种语言的词汇，创造出听起来似乎是不可能理解的内容，但他们却做得非常轻松。这就是你通过在\
  \ `Python` 中插入 `bash` 所要做的事情。\n\n为了将 `bash` 语言引入 `python`，你只需要做：\n\n```bash\n$ python\n\
  >>> from os import *\n>>> system('sudo apt-get update')\n```\n\n现在你应该同时拥有这两种语言的权限了。你应该绝对尝试一下这两种语言。如果你还不熟悉\
  \ `Python`，你可能会想花精力学习它——它非常容易上手，如果你已经学会了与 Linux 通信，你应该也能学会理解 `Python`。你所做的是将曾经投入在开发\
  \ Linux 技能上的精力投入到学习这个系统上。你可能会发现，随着生产力的提高，你会很快喜欢上这种变化的。\n\n如果你不确定系统当前是否安装了 `Python`，那么你幸运了——要确认，你需要输入以下命令：\n\
  \n```bash\n$ python --version\n```\n\n你很可能会得到一个较旧但稳定的 `Python` 版本，这已经足够了，但你可能想将其升级到更新的版本。这个版本在不断变化，所以最好在你阅读此书时检查一下你可用的版本——你只需在网上搜索最新版本然后更新即可。\n\
  \n如果你确实决定要专门钻研 `Python`，你将想要去寻找一些指南和书籍，就像你现在读的这一本一样，以找到你需要知道的内容。教程和网络课程始终是你开始尝试\
  \ `Python` 的绝佳敲门砖。随着你变得越来越得心应手，你可能会决定开始尝试将两种语言结合使用。你甚至可能决定更倾向于使用 `Python` 而不是 shell，这也可以。归结底，技术变化如此迅速，你负担不起因为害怕改变、成长或转向新事物而阻碍自己——过渡和学习对你绝对是有益的。\n\
  \n现在，随着本章和这本书的结束，是你时候开始思考如何将这一切整合在一起了。是时候考虑一下你是否真的对 `Kali Linux` 感兴趣，或者你是否更倾向于学习其他东西。但可以肯定的是，最终你必须引导自己并做出决定，以确保你对所选择的事情感到满意。\n\
  \n## 结论\n\n恭喜你——你已经读到了《Kali Linux Hacking》的最后。这本书被设计作为学习 `Kali Linux` 的快速入门课程——该操作系统专为渗透测试专业人员设计，用于发现和修复系统中发现的各种漏洞或利用。如果你已经读到了这里，你一定对安装\
  \ `Kali Linux` 非常感兴趣，或者你一直把这本书当作指南，无论哪种情况真实，感谢你与我共同这段旅程。\n\n在书中，你获得了关于 `Kali Linux`\
  \ 的基础信息。再次提醒，`Kali Linux` 并不是一个面向初者的 Linux 发行版。如果你读了这本书但在某些主题上完全迷茫，这没关系——但你可能从一本初级书籍开始更好，而不是一本为那些知道自己在做什么、并想做得更好、更多的人设计的书。\n\
  \n归根结底，你的下一步完全取决于你以及你想要做什么。你想在真实的 `Kali Linux` 发行版上练习吗？你可以花所需的时间和精力安装你自己的副本，并开始使用和发现。如果你觉得\
  \ `Kali Linux` 不适合你，无论是因为它太难、太不同，还是仅仅是因为你不知道自己在做什么，那么你可能从更简单的系统开始更好，例如 `Ubuntu`\
  \ 和 `Mint`。\n\n是的，这一点被强调了多次，因为它非常重要。即使在读完本指南后，如果你对自己和能力还没有完全的信心，那么暂时放弃 `Kali Linux`\
  \ 来建立你的技能可能更好——这没关系。\n\n也许到此时，你已经采纳了本书最后一章的建议，并决定也研究 `Python`，提升你的脚本能力，以便能够更好地利用自己的命令。这也是一个非常棒的决定，并将引导你的旅程，仅仅因为你拥有了更多的知识。\n\
  \n无论你下一步选择做什么，无论是追求更多关于通用 Linux 的知识，还是尝试弄清楚如何与已安装的 `Kali Linux` 交互，有一点是肯定的：希望你在阅读这本书的过程中学到了东西。在本书结束之际，我带着最诚挚的希望，你发现这本书对于\
