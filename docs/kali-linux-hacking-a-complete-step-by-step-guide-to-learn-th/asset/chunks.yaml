    prompt that you will see. It will be the username of the user, the hostname of
    the server, the directory you are in, and the prompt symbol. In most cases, the
    prompt symbol that you will see is $.Effectively, then, if you are nicknamed hacker
    as your user, and your server that you are on is hacking and you are currently
