    9: Bash and Python Scripting](#part0013.xhtml)[Conclusion](#part0014.xhtml)IntroductionHave
    you ever been in a situation where you wanted to try hacking something? Maybe
    you wanted to test the security of something that you were developing or you simply
    wanted to challenge yourself, and you were unsure of where to start. If this is
    something you have considered, Kali Linux may be the OS you need to begin the
    process.It is important to note that Kali Linux is not for everyone—you need some
    level of familiarity with how Linux works or at least an idea of how to interact
    with Linux if you wish to use Kali Linux in a useful manner. If you do not have
    this familiarity, it may be in your best interest to go back and begin the study
    of a simpler distribution of Linux, such as Ubuntu or Mint before beginning to
    tinker with Kali Linux. If you do decide to move forward with Kali Linux, keep
    in mind that the tools within this distribution can cause serious damage if misused,
    and could potentially even lead to significant consequences. This is not a distribution
    to be taken lightly.If you decide to proceed, this book will give you the beginner’s
    guide to Kali Linux and how to use it to begin hacking. The first half of the
    book is dedicated to giving you the basic knowledge that will be needed to truly
    get the most of the You will be given information about hacking and how it has
    made cybersecurity more important than ever. You will learn the basics of networking
    itself, diving into several different concepts and how they work. You will learn
    all about Kali Linux—what it is, how it is installed, and how to use it, and you
    will learn several of the most basic Linux commands.In the second half of this
    book, you will begin to discuss the utilization of Kali Linux for several different
    purposes. You will learn about Nmap and how it can be used to detect and exploit
    vulnerabilities. You will be guided through the steps of remaining anonymous.
    You will dive into Metasploit and how to make use of it with Kali Linux. You will
    learn about digital certificates and how to use them, and finally, you will learn
    about bash (Bourne Again SHell) and Python scripting and why the two of them are
    sometimes considered to be at odds despite the fact that they could very well
    work together and cooperate to get much better results than if they continue to
    be left separately.By the time you have finished reading this book, you will have
    an idea of the foundational information you will need to first decide whether
    Kali Linux is for you, and if it is, you will know how to get started with it
    and have an understanding of just how powerful this distribution of Linux is.
    While Kali Linux is not for everyone, if you do happen to fall into the category
    of people that would find use in this program, then the tools that will be provided
    with this distribution are incredibly valuable assets that you will not want to
    miss out on having in your arsenal.At the end of the day, you will be able to
    determine if you are happy with the idea of Kali Linux and whether this is for
    you or if instead, you should be making it a point to move on to a different distribution
    of Linux instead. You will be able to decide if you want to continue to work entirely
    with the shell or if you want to learn Python instead. And, if none of this that
    has been discussed makes any sense, then by reaching the end of the book, you
    should find some clarity with the topics at hand and how they should be used.Part
    IIntroduction to Kali Linux and HackingChapter 1: Introduction to HackingIt is
    one of the worst things that could happen to many people—they log into their bank
    account or credit card only to realize that their account balance is completely
    drained or that someone has been making heavy use of their credit card. This can
    absolutely devastate many people, and unfortunately, these days, this is a very
    real concern.![](OEBPS/rsrc6C.jpg)These days, financial information is backed
    up somewhere. Your bank has a record of your account number, your card numbers,
    and everything else someone would need to access it. You likely log in somewhere
    to pay credit card or utility bills.You may even do the bulk of your shopping,
    both for groceries and other times online. This means that your personal information
    is constantly being used online. You enter your social security number to apply
    for a credit card. The three major credit bureaus keep your information, tracking
    and regularly updating it. You may even apply for taxes online. This has one serious
    implication—all of your essential information is available online somewhere.To
    be fair, this information is usually stored behind all sorts of safety protocols
    that are put into place. They are meant to protect your information from being
    leaked to people who may be interested in using your information for nefarious
    purposes, but just like armor, there is usually some way to get through it. Some
    systems may be safer than others but at the end of the day, a dedicated individual
    would be able to find some way to break through if they put in the effort.As soon
    as they break through that security system, they have access to any and all of
    that data, which can then be released and sold, ultimately leading to you having
    your identity stolen. Everyone wants to avoid that unfortunate outcome, but with
    the storage of valuable information comes the risk of attack and exploitation,
    which must be accounted for.What is Hacking?Hacking, then, is the act of identifying
    any sort of weaknesses within a computer or network’s security system and then
    exploiting that weakness in order to gain the necessary access to whatever is
    hidden behind the firewall.For example, a common example is the usage of an algorithm
    designed to identify a password in order to sort of digitally pick the lock of
    a network or account. That account has then been exploited to get the desired
    access.Hacking may not always be done with the intention to harm—some people do
    so for legitimate means, such as to locate a flaw in the system to repair it.
    Others may choose to do so in order to entertain themselves, not unlike doing
    a complicated puzzle or trying to solve increasingly complicated math problems
    to test and hone abilities. Others still do so in order to steal information for
    some purpose, whether to use it for financial gain or to cripple the system that
    they are hacking.Hacking can come in several forms, such as tricking someone into
    clicking on an attachment in an email that will grant access to a computer.Other
    forms, however, require far more technical knowhow, developing the ability to
    trick and trigger the system to grant access and information that should otherwise
    be safeguarded. This book will primarily discuss methods related to technical
    expertise rather than using backhanded attempts to fool someone into granting
    access in the first place. Essentially, hacking is the act of getting into someone
    else’s system, but the methods of hacking can vary greatly.Each of these occurs
    in different manners and serve different purposes, but the end result is the same—they
    allow for information to be stolen and used, or for programs to be used in ways
    that they were unintended to be.For example, some people may hack their video
    game console to run emulators to allow them to play ROMs of different games, including
    some that may not have been intended to be used on that system in the first place.
    Others may use their skills to steal information and sell it to people looking
    to steal an identity. Nevertheless, there are numerous options for a hacker to
    use in order to gain access to all of the information they desire. The rest of
    this section will discuss some of the most common hacking methods that are out
    there, allowing you to get a glimpse into what hacking can entail. Keep in mind
    that this list is not exhaustive.MalwareMalware is malicious software—shortened
    down into one word. It includes software such as viruses that are installed, either
    by you clicking on something that allows it to be downloaded or downloading it
    yourself, but once you allow it in, you have compromised your information. Attackers
    will generally use a link or an email attachment that appears to be harmless in
    order to trick you into installing whatever malware was hidden within.The installed
    malware can cause all sorts of issues, such as monitoring the usage of the computer,
    such as keystrokes, which then allows the hacker access to all sorts of information
    that may be personal or sensitive. It can also grant full access to the computer,
    depending on the malware that was installed. Overall, however, the vast majority
    of the time, the user of the computer will have to do something that triggers
    the download of the malware.Session HijackingAs will be discussed later, when
    a user is browsing the internet, the user’s computer sends several transactions
    to the website’s servers, allowing the website to see who is accessing it, what
    is being requested, and sending the proper information back to the user to display.
    This is done via routers and networking, and when done properly, you are able
    to access the information requested without issue, whether you are simply browsing
    through sites and clicking on links or whether you are entering in sensitive information.This
    data is supposed to stay private, given a specific session ID that allows the
    server to know who is using it and how it is able to send the specifically requested
    data back to the individual asking for it. However, sometimes, that data gets
    intercepted.Essentially, what happens is that someone else is able to access that
    unique ID. They are able to use that same ID and make requests as you during your
    interaction, allowing the attacker to see any of the sensitive information. Sometimes,
    instead of just observing and intercepting information, the attacker can act as
    either the website or as the individual using the website, allowing the attacker
    to request and intercept information from either direction. When this happens,
    it is known as a man in the middle attack.SQL InjectionSQL (usually pronounced
    “sequel”) is an acronym for the structured query language. It is the programming
    language that is primarily used as a means of communication with databases.When
    a website or a company needs to store sensitive and critical information, such
    as patient or financial information, the server that it is stored in will most
    commonly utilize SQL to manage it.![](OEBPS/rsrc78.jpg)The SQL injection, then,
    seeks to use code designed to trigger the server to provide information that is
    normally protected. Especially when the server is holding important personal information,
    it can be a valuable target—that information can either be sold off or used as
    leverage to blackmail. Effectively, the SQL injection attack exploits one of the
    known SQL vulnerabilities, which the attacker takes advantage of. This could be
    done by inserting a specific code into a search bar or otherwise engaging with
    it in a way that triggers unintended results.PhishingFor those who know better
    than to open up a random attachment or link that has been sent to them, there
    are other methods to use to trigger you to click. The attacker may know that you
    are not likely to simply open up a random attachment, so they make the reason
    to open said attachment one that is compelling and motivating. These people will
    often imitate other people in order to make you click on the link.For example,
    you may receive an email from someone claiming to work for the IRS and saying
    that you have an outstanding balance with them. They do not specify the balance,
    but they include a statement attached to the email that you are required to click
    to see it.Of course, the entire situation is fake. There is no balance owed, and
    if you were smart, you would remember all of the warnings that go out every year
    about how the IRS will only contact you via snail mail. Phishers rely on you not
    knowing what you are doing, getting too curious, or not being cautious enough
    to go through the process of double-checking sources before downloading a document.DOSHave
    you ever tried to leave a big event from a small town? Especially if there is
    only one road that accommodates leaving, you may get stuck in traffic for hours.
    The same kind of occurrence can happen with websites—usually, the servers are
    only able to accommodate so much traffic, and if traffic gets too bad, the website
    is overloaded and cannot load the necessary sites for anyone. Sometimes this happens
    legitimately, such as if highly desired tickets go on sale at a specific time
    that is anticipated to sell out, or during massive, limited quantity sales.However,
    sometimes, an individual may decide that they want to see that sort of full stop
    happen. When they do so, they intentionally flood the website with traffic—so
    much that the site’s servers can no longer accommodate the load, and no one is
    able to access anything. Known as DOS (Denial of Service), this attack usually
    comes from a single source all at once.However, sometimes, it comes from several
    IP addresses at the same time, using different computers to attack and making
    it harder to track and stop. This is known as a DDOS—Distributed Denial of Service.![](OEBPS/rsrc7N.jpg)Reasons
    for HackingUltimately, the reasons for hacking can vary greatly from person to
    person. Some people do it to learn more information. Others do it to cause harm.
    Others still do it for entertainment or just to learn how. It has become trendy
    in modern pop culture to discuss the hacker as a major threat to the internet
    and cybersecurity. This can make for a particularly convincing villain in a story
    or film, but real hackers are just as capable of wreaking havoc. On the other
    hand, there have been politically or socially motivated hackers who use hacking
    to get attention toward a specific event or to bring forth sensitive information—these
    people are known as hacktivists.No matter the reason for hacking, one thing is
    for sure—unless the hacking is done in order to help prepare the system that is
    being hacked in order to better the security, hacking is dangerous. It is harmful.
    It is not a toy. It is not something to be taken lightly. If you are in this book
    because you want to hack someone or exact your own revenge on someone because
    of something that has happened or you simply want to watch the world burn, stop.
    Close this book. Go find a hobby doing something that is not going to potentially
    ruin lives. Ultimately, lives have been ruined by hackers before. Hackers have
    been able to destroy people, their livelihoods, their careers, and sometimes even
    their families. Through the stealing of identity or funds, or through causing
    a disruption so large that a company has gone over or with any other negative
    implications, hacking can hurt people, and it should not be treated lightly. This
    is exactly why cybersecurity is such a rapidly growing field.Typically, people
    will have one of four reasons to maliciously hack a server or computer:'
