    At this point, you will be able to use any of your USB drives to boot up the OS.
    All you need to do is bring up the boot menu upon starting your computer with
    the USB mounted and make sure you select Kali Linux. There are other methods that
    you can use to access Kali Linux, such as installing it onto your computer itself,
    but one of the most recommended methods of accessing the software is through the
    use of the USB drive. If you have an interest in downloading the entire system
    onto your hardware, feel free to browse around the specific Kali Linux official
    website for more access and information to do exactly that.


    # Chapter 4: Basic Linux Commands


    From this point on, the information you will be getting is a mix of practical
    information and information that you can actively use in some way. This chapter
    in particular will provide you with the necessary information to begin interacting
    with Kali Linux. You will be given a list of the most common and basic commands
    necessary.


    As you read through these commands, try to really familiarize yourself with them.
    You want to make sure you understand what they are and how they can be best used
    to benefit you. If you are able to do so, you will ensure that you are also able
    to interact with your Linux distribution, no matter which you have chosen. Remember
    that with Kali Linux, you will be in root user by default and you will need to
    take the necessary precautions. When using several of these commands when you
    do not have root access, you run into problems that stop you from being able to
    move forward. However, with Kali, if you are already in the root user, the command
    is instantly carried out, even if it is a harmful one. This is why attention to
    detail, and a meticulous amount of it, is crucial if you really want to develop
    your skills with Kali Linux and become skilled at penetration testing and hacking.


    ## The Terminal


    If you are familiar with Linux and basic commands, you should also be familiar
    with the Terminal. This is the way that you are able to interact with the shell
    of Linux, commanding it to do what you expect. You are essentially going to be
    putting in input to the server and then expecting it to come out the other end
    with the proper response. This is the basis of the simplest Linux commands.


    As a quick refresher, if it has been a while, you will be emulating the terminal
    in a graphical environment so you can see the input and output in a way that you
    can read and understand. If you already have Linux or OS X, you already have access
    to Terminal, and you can also install others. If you have Windows, you may want
    to install `PuTTY`. Kali Linux will also have its own terminal within it as well
    that you are able to access with ease.


    ### Command Prompts


    When you are interacting with the Terminal, you are using command prompts or shell
    prompts—you will likely see these used interchangeably as you read through various
    guides. When you are within the terminal, there is a very specific composition
    of the prompt that you will see. It will be the username of the user, the hostname
    of the server, the directory you are in, and the prompt symbol. In most cases,
    the prompt symbol that you will see is `$`.


    Effectively, then, if you are nicknamed hacker as your user, and your server that
    you are on is hacking and you are currently in the default home directory, you
    may see a default prompt of:

    `hacker@hacking:~$`


    In Kali Linux, however, you are always logged onto the single root user account.
    You are going to see the username of `root` instead of `hacker` or any other name
    that may have been there.


    ### Executing the Commands


    When you want to give your commands then, you must specify what you want in a
    fashion that the system is able to manage properly. You can enter a script, a
    series of prescribed information that will trigger the system to respond in a
    specific way. You can also enter your own commands instead. This is what the majority
    of this current chapter will be: ways to interact and command the server.


    When a command is running, it is called a process. When that process is happening
    in the foreground, you must wait for it to finish before you can do anything else.
    This is the default way to run the program.


    You can also enter your commands in two forms: With or without arguments. When
    you enter a command without an argument, you are entering a simple command without
    expecting anything else. This will cause the computer to send you to exactly what
    you have specified or done exactly what you said. If you write `ls`, for example,
    you will suddenly get everything listed out in front of you on the screen—the
    current directory’s files and directories.


    However, an argument seeks to alter that command somewhat. In adding an argument,
    you add an extra condition—you may tell your system to bring up the files of a
    different directory. You may tell your system to shut down in 30 minutes instead
    of instantly. They add a change to the meaning of the original command. When you
    enter a command with arguments, you will enter it in a specific order of command,
    then the specification or location of what you are running.


    Another common way that commands are executed is with options—this means that
    they have some sort of modification to follow. This is followed by a `-` and a
    letter that tells the system what you need from it. For example, if we go back
    to `ls`, you may choose to add something else to it, such as `ls -l` which tells
    your system that you want it to list out a longer list of permission, including
    far more details than would ordinarily be included.


    You can also mix and match, so you can have your options and arguments combined—in
    fact, it is incredibly common to mix the two together in order to run the right
    command.


    From here on, you will be provided with several commands within Linux that you
    will find to be useful. These will either be a great refresher course, or you
    did not need this information in the first place. If you did not need this information,
    or you feel confident in your ability to navigate a Linux system, feel free to
    drop off here and skip to the next chapter. However, if you are not entirely confident
    in your ability to navigate through your software, it may be smart to at least
    spend the time to read over this comprehensive list of commands that have been
    provided for you.


    Of course, you can also always come back to this information later if you ever
    feel like you need a command and want to make sure that you are able to really
    learn how to use them.


    ## Archives


    The codes within this section are related specifically to the archive files within
    your system. They will help you to interact directly with archives, whether to
    access, move, or otherwise interact with them.


    - `tar cf archive.tar directory`: This will create a tar file (`archive.tar`)
    that contains the directory.

    - `tar cjf archive.tar.bz2 directory`: Similar to above, but the tar file will
    be compressed using the `bzip2` format.

    - `tar czf archive.tar.gz directory`: Another variation of the first command.
    It will create a gzip-compressed tar (`archive.tar.gz`).

    - `tar xf archive.tar`: This is the opposite command of the above. It will extract
    the data from `archive.tar`.

    - `tar xjf archive.tar.bz2`: Use this to extract data from a `bzip2` compressed
    tar.

    - `tar xzf archive.tar.gz`: The command to extract from a tar that was compressed
    under the `gzip` format.


    ## Directory Navigation


    These codes will allow you access to moving around the directory quickly and easily.
    When you do this, you are able to shift around from space to space without having
    to manually go through your directories yourself one at a time. It is easier to
    go through hit with the directory navigation.


    - `cd`: You will be moved to the `HOME` directory.

    - `cd ..`: It looks similar to the above, but has two periods. Will move you one
    level up the directory tree. For example, you are in directory 2, which lies within
    directory 1. You will move to directory 1 with this command.

    - `cd /etc`: You will move to the `/etc` directory.


    ## Disk Usage


    These particular commands are directly related to disk usage. They will allow
    you to see all sorts of information about your current disk status, which can
    be incredibly necessary when you are monitoring your system closely.


    - `df -h`: You will be able to see the used and available space on your disks
    with this command.

    - `df -i`: Use this to see used and available inodes on your (mounted) filesystems.

    - `du -ah`: Will bring up file size for all objects and directories in a human-readable
    format (bytes, megabytes, gigabytes).

    - `du -sh`: Similar to the above, but will display the only the information from
    the directory currently being worked in.

    - `fdisk -l`: When you need to see the partition sizes and types of your hard
    disks, use this command.


    ## File and Directory Commands


    The commands within this section will help you interact directly with the file
    and directory within your system. They will allow you all sorts of extra access
    and usability of your files and allow you to get the most out of your system and
    efficiency.


    - `cp fileA fileB`: This command will copy over `fileA` over to `fileB`.

    - `cp -r source_directory destination`: The command will copy over the directory
    recursively over to a selected destination. If the location already exists, the
    directory will be copied over. If the location does not exist, it will be created
    with a copy of the source directory files.

    - `ls -al`: Command will list all the files in a directory in a detailed format.

    - `mv fileA fileB`: Renames `fileA` to `fileB`. It can also move a file. If `fileB`
    is a directory, the command will move `fileA` into said directory.

    - `mkdir directory`: Makes a directory.

    - `pwd`: Displays the directory you are currently in.

    - `rm file`: Removes the file in question. Most commonly as deleting a file.

    - `rm -f file`: "Forces" the deletion of a file. No prompt will follow this command.

    - `rm -r directory`: Deletes a directory, with its contents.

    - `rm -rf directory`: Use this when you want to "force" the deletion of a directory
    and its contents. Again, be sure this is what you intend to do.


    ## File Transfers


    These commands act as your guide to moving around files from place to place as
    necessary in order to ensure that you are always able to put your files where
    you want them.


    - `rsync -a /home /backups/`: Synchronize the home directory over to `/backups/`.

    - `rsync -avz /home server:/backups/`: Synchronization of files or directories
    between a local and remote system.

    - `scp file.txt server:/tmp`: Secure copies the file (in this case `file.txt`)
    to the `/tmp` folder on the server.

    - `scp -r server:/var/www /tmp`: Recursively copies all directories and files
    from the server to the current system’s `/tmp` directory.

    - `scp server:/var/www/*.html /tmp`: Copies `.html` files from the server to the
    local `/tmp`.


    ## Hardware Information Commands


    These commands will provide you with all sorts of information about your hardware,
    ensuring that your hardware is functioning properly.


    - `badblocks -s /dev/sda`: This will check to see if there are unreadable blocks
    on the disk (you can change `sda` to whatever drive you want to check).

    - `cat /proc/cpuinfo`: This will provide you with the current CPU information,
    such as usage, and other important aspects of its ability to run.

    - `cat /proc/meminfo`: This will provide you with memory information, such as
    usage, speed, and other important aspects of its ability to run.

    - `idecode`: This will show you pertinent information from the BIOS.

    - `dmesg`: This will show messages in the kernel buffer.

    - `free -h`: This will display the free and used memory space in your system at
    that moment. You can also select `-m` instead of `-h` for MB, or `-g` to get your
    result in GB.

    - `hdparm -I /dev/sda`: This will provide you with all sorts of information about
    the disk `sda`.

    - `lspci -tv`: This shows your PCI devices and `USB` devices.


    ## Installing Packages


    These commands are all about installing packages from your files, whether from
    zip files, or otherwise.


    - `rpm -i package`: Installs the package from a local file, in this case named
    `package`.

    - `tar zxvf sourcecode.tar.gz`: Extracts the `sourcecode.tar.gz`.

    - `./configure make install`: As opposed to installing from a package, this will
    have you install software from `sourcecode`.

    - `yum info package`: Displays information about the `package`.

    - `yum install package`: Installs a package.

    - `yum remove package`: Uninstalls (removes) a package.

    - `yum search keyword`: Provides a search for a package using a keyword.


    ## Networking


    These commands are directly related to networking—allowing you to see what is
    on with your own network and anything your network is interacting with.


    - `dig domain`: Displays the DNS information for a given domain.

    - `dig -x IP_ADDRESS`: Use this to run a reverse lookup of a given IP address.

    - `host eth0`: A tool to view and change hardware settings.

    - `host domain`: Displays the DNS address for a given domain.

    - `hostname -i`: This command is used for displaying the network address.

    - `hostname -I`: Similar to the above command, but will display all local IP addresses.

    - `ifconfig -a`: Will bring up all network interfaces and their IP addresses.

    - `ifconfig eth0`: Will display `eth0` address and its details.

    - `netstat -nutlp`: Will show any listening TCP & UDP ports and their related
    programs.

    - `ping host`: Sends an ICMP echo request to `host`.

    - `wget http://domain.com/file`: Downloads the web file found at the given address.

    - `whois domain`: Displays the `whois` information for `domain`.


    ## Performance Monitoring


    These commands are dedicated to ensuring that you are able to monitor your system’s
    performance well, effectively so you can optimize your settings to what you want
    or need them.


    - `htop`: This will allow you to interactively monitor your processes. It is older
    than `top`, but serves the same purpose. It has some differences such as mouse
    support.

    - `iostat`: Will allow you to see input/output statistics.

    - `lsof`: Allows for a list of all open files currently on the system.

    - `lsof -u username`: Allows for a list of open files present by the specified
    username.

    - `mpstat`: Allows you to see processor-related stats.

    - `tail -n 0 /log/messages`: Will let you see the last system log messages.

    - `tcpdump -i eth0`: Will allow you to see all packets on that particular interface
    (in case `eth0`).

    - `tcpdump -i eth0 port`: This will allow you to monitoring of data on `port`,
    and you can change the port to whichever you are trying to manage.

    - `top`: Will show the top processes and allow you to manage them.

    - `vmstat 1`: Allows you to see virtual memory-related statistics.


    ## Process Management


    These commands are dedicated to process management—they tell you what the processes
    currently ongoing are doing, as well as allow you to shift from foreground to
    background processes as needed.


    - `bg`: Will show background tasks or those stopped.

    - `fg`: This command will push the recent background process to the foreground.

    - `fg n`: Similar to the above command, this will push `n` to the front.

    - `htop`: Allows you to interactively monitor your computer’s processes.

    - `kill pid`: Use this to end a particular process where the process ID matches
    `pid`.

    - `killall processname`: When you want to kill all processes with a particular
    name.

    - `program &`: Starts your selected program in the background.

    - `ps`: Displays your own processes currently running.

    - `ps -ef`: Displays all of the processes currently running in the system.

    - `ps -ef | grep processname`: Will display the information for `processname`.

    - `top`: A process viewer.


    ## Search


    When you need to find something within your system, these commands are your best
    bet. When using your search commands, you will be able to find the files you need
    with ease and learn exactly where they are so you are able to jump to them and
    access them elsewhere.


    - `find /home -size +25M`: Utilize this command to find files larger than 25MB
    in `/home`.

    - `find /home -name ''prefix*''`: Will find files in `/home that start with `prefix`.

    - `grep pattern file`: Will look for pattern in `file`.

    - `grep -r pattern directory`: Performs a recursive search for pattern in `directory`.

    - `locate name`: Will look for files and directories by the specified `name`.


    ## SSH Login


    - `ssh host`: Connects to host using the username you use locally.

    - `ssh user@host`: Connects to host as `user`.

    - `ssh -p port user@host`: Connects to host using port.


    ## System Information Commands


    These commands are all used for some sort of system information to understand
    what the system is doing and how you are able to interact with it. These are Linux
    specific—they should work for any form of Linux you are operating within, Kali
    Linux included. Some of these commands may be less useful on Kali Linux, but they
    are important to know anyway when interacting with other Linux systems.


    - `cal`: Will show you the current month’s calendar.

    - `cat /etc/redhat-release`: This shows you which redhat is currently present
    on your computer for use.

    - `date`: Will show you the current time and date on the system you are using.

    - `hostname`: Will tell you what the name of the system host is.

    - `hostname -I`: Will provide you with the host’s IP address.

    - `last reboot`: Will show you the last time the system was rebooted.

    - `uname -a`: Allows for the display of the Linux system’s information that is
    stored.

    - `uname -r`: Allows for the output to show which kernel release you are using.

    - `uptime`: Tells you how long your system has been up or how long it has been
    loading.

    - `w`: Will show you who is currently online on the system.

    - `whoami`: Will tell you who you are currently logged into the system as.


    ## User Information and Management Commands


    These commands are crucial to your ability to managing user information. When
    you master these controls, you can add and remove people from your server. You
    can make sure that certain people have certain permissions, and more. These commands
    may not be so necessary within Kali Linux, where you are designed to be in root
    user and not others, they are still fantastic to know and understand.


    - `groupadd group1`: Allows you to create a new group `group1` in this instance.
    You can replace `group1` with any other name for your group.

    - `id`: Shows the user and group ids of the current user on the system.

    - `last`: Shows who the last people that logged on were.

    - `useradd –c "full name" –m "nickname"`: (Implied user creation)

    - `userdel`: Allows to delete `name`.

    - `usermod -c "full name"`: Allows to comment `nickname`.

    - `userdel -a`: Allows to delete `name`.

    - `usermod -a`: Allows to modify `name`.

