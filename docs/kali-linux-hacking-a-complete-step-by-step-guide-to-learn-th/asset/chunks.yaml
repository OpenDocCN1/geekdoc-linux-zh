    *   从 Kali Linux 官方“下载”镜像站下载 ISO 镜像，然后计算 `SHA256` 并将其与 Kali Linux 网站上列出的值进行对比。你应该能够很轻松地完成这一步——但也可能受到漏洞攻击。

    *   通过种子（torrent）下载 ISO 镜像，它也会为你提供一个带有计算好的 `SHA256` 签名的文件。如果你已经在 Linux 或 OSX 上，可以使用
    `shasum` 命令，或者在 Windows 上使用工具来验证该文件的签名是否与下载的另一个文件夹中的签名匹配。同样，这种方法也存在受到攻击的风险，因为别人可以非常简单地为你提供匹配的数字，让它看起来像是合法的
    Kali Linux 安装，从而确保欺骗你。

    *   唯一尽可能确定的方法要稍微复杂一些——你需要下载明文签名文件以及使用官方私钥签名的文件版本。然后，你必须利用 GNU Privacy Guard (GPG)。这将验证
    `SHA256` 组合与明文文件中的组合是否匹配，然后确保带有 `SHA256` 哈希值的签名版本文件也已使用正确的官方密钥进行了正确签名。


    ## 第 3 步：创建 Kali Linux 可启动 USB 盘


    让 Kali 运行起来最快的方法可能是使用实时可启动 USB 盘。基本上，你所做的是将 Kali Linux 获取 USB 盘中，然后从该 USB 盘启动。这有许多自身的优势，例如避免任何形式的破坏或混乱。当你使用它时，你没有对正在使用的系统进行任何更改——你只是从
    USB 盘运行它。这还引出了它的便携性和可定制性——你可以将其随身带到任何地方，并在任何计算机上启动，并且你可以像这里讨论的那样，在 USB 盘上创建你自己的自定义
    Kali ISO。


    为了创建启动盘，你需要一个经过验证的 ISO 副本、一个磁盘映像工具（如果你使用 Windows，可以下载 `Win32 Disk Imager`；如果你在
    Linux 或 OS X 上，你可能已经有了，你只需要使用 `dd` 命令即可调用它）以及一个 USB 盘或 SD 卡，只要你正在使用的系统允许通过这两种方法之一直接访问即可。存储空间至少应该是
    4GB，越大越好。


    ### 在 Windows 上创建可启动 USB


    在 Windows 计算机上执行此操作时，你需要经过几个与在 Linux 或 OS X 机器上运行时不同的步骤。


    *   将 USB 盘插入计算机上任何可用的 USB 端口，并记录分配给它的驱动器标识符。挂载它后，启动 `Win32`。

    *   选择你正在刻录的 Kali Linux ISO 文件，并确认你正在覆盖正确的 USB 盘。确认无误后，点击“写入”（Write）按钮。一旦刻录完成，弹出
    USB 盘，它现在就可以正常使用了。


    ### 在 Linux 上创建可启动 USB


    在 Linux 上，步骤要稍微复杂一些，而且面临着挣扎或不小心覆盖非预期磁盘驱动器的风险。你需要确保正在使用正确的命令，以保证不会意外覆盖任何内容。


    *   首先，你必须确定将用于将映像写入 USB 盘的设备路径。你希望在尚未插入 USB 盘时执行此操作。在终端中，输入：

    ```bash

    sudo fdisk -l

    ```

    你应该会得到一个输出，显示一个带有三个分区的驱动器。


    *   此时，将你的 USB 插入可用端口，再次重复之前的命令 `sudo fdisk -l`，你现在应该得到一个类似的输出，显示出一个之前没有的额外设备——这次，就是你的
    USB 盘。

    *   现在，你必须使用类似于下面提供的命令将 ISO 文件映像到 USB 设备上。该命令假设你的 ISO 镜像名为 `kali-linux-2017.1-amd64.iso`
    且当前位于工作目录。它还假设你的 USB 盘名称为 `/dev/sdb`，并将根据需要替换文件名和驱动器名称。如果你想提高速度，可以选择块大小（blocksize），但这是创建可靠映像最安全的尺寸。此处的的命令是：

    ```bash

    dd if=kali-linux-2017.1-amd64.iso of=/dev/sdb bs=512k

    ```

    *   刻录过程可能需要 10 分钟甚至更长时间，所以等待该过程进行时请保持耐心。在系统完成之前，你不会获得关于此过程的任何反馈。

    *   完成后，你的 USB 设备现在已准备好启动了。


    ### 在 OS X 上创建可启动 USB


    *   从未插上 USB 盘开始。打开终端并输入命令：

    ```bash

    diskutil list

    ```

    *   你应该看到几个设备路径，就像 Linux 版本一样。你将获得关于每个分区以及你可能需要的所有信息。

    *   现在，插上 USB 设备并再次运行 `diskutil list`。这样做现在会向你展示一个之前不存在的新驱动器，通过这种方式现在知道如何指定命令地址了。

    *   现在，卸载该驱动器——为了示例，这次我们假设驱动器的名称为 `/dev/disk6`。你的命令将类似于：

    ```bash

    diskutil unmount /dev/disk6

    ```

    *   此时，你需要使用如下命令将 Kali ISO 文件映像到设备：

    ```bash

    sudo dd if=kali-linux-2017.1-amd.iso of=/dev/disk6 bs=1m

    ```

    请记住，无法保证你的文件和驱动器具有相同的文件。你需要根据此进行更改。再次，在驱动器加载完成之前不会有任何反馈，到那时你将拥有一个可启动的 USB 盘。


