    # 使用 Metasploit


    当你安装并准备好使用 Metasploit 时，你需要做的就是某种方式收集信息，无论是通过首先进行端口扫描，还是寻找漏洞扫描器来找到突破口。一旦你进入系统，你只需要选择一个利用程序（exploit）和载荷（payload），Metasploit
    就会为你完成其余的工作。实际上，利用程序是在防御性较强的网络中识别弱点并进行利用的方法。


    该框架专门设计用于利用各种模型和接口，例如 `msfconsole` 交互式界面等。它可以在终端/`cmd` 中运行，并且兼容 Metasploit 社区
    Web 界面，该界面将支持渗透测试。


    ## 安装 Metasploit


    然而，在使用 Metasploit 之前，你必须先安装它。安装它需要你首先禁用所有的防火墙和防病毒软件。由于该文件本身的原因，当你尝试在防火墙和防病毒软件运行
    own 的情况下安装它时，它通常会被视为恶意文件。这会中断你的安装过程。因此，最好在继续之前先禁用防火墙和防病毒软件。不过，这意味着你必须确保你的下载来源是合法且安全的。如果你不小心，你可能会无意中下载对你实际上可能是危险或问题的程序。


    在关闭防火墙和防病毒软件后，确保你也拥有管理员权限。这在 Kali Linux 中不应该是问题，因为你默认应该拥有 root 用户的访问权限，但如果你由于某种原因没有，或者你正尝试在不同的
    Linux 发行版上安装 Metasploit，你需要确保自己也拥有该管理员权限。


    最后，要安装 Metasploit，最好的办法是从 Rapid7 网站安装。这样做可以让你获得适用于你特定操作系统的安装程序。它还包含一个自包含的环境，你可以用它来更新和运行框架。这意味着你需要的所有内容都将在初始安装过程中处理完毕。当然，如果你选择，也可以手动进入配置
    Metasploit，但该步骤是不必要的，并且在本书中将跳过该步骤。当你拿到文件后，启动安装程序。它会提示你输入特定的框架。作为 Kali Linux 用户，你应该发现这已经预装好了，无需继续操作。


    ## 管理 Metasploit 数据库


    现在，是时候停下来完成数据库信息后再继续了。当你准备好管理数据库时，你需要使用 `msfdb` 脚本来配置 `postgresql` 运行，以便数据库存储在
    `~/.msf4/db/` 中。准备好启动时，使用以下命令：


    ```bash

    $ msfdb init

    ```


    这将触发数据库启动，随后你就可以可以使用几个最适合你的任何一个命令。这些命令增加了额外功能，并帮助你管理可用空间。在此阶段你需要包含的最常用命令包括：


    - `msfdb reinit`: 这会导致你的数据库被删除并重新初始化以刷新它。

    - `msfdb delete`: 使用此特定命令将导致你的数据库被完全删除，而像上一个命令那样重新初始化。

    - `msfdb start`: 此命令重新启动数据库，使其开始运行。

    - `msfdb stop`: 使用此命令时，将完全停止数据库的运行。

    - `msfdb status`: 此命令将允许终端打印当前数据库状态，在终端中显示所有关键信息。


    ## Metasploit 数据存储 (Datastore)


    除了目前列出的所有内容外，还有数据存储——这是 Metasploit 框架的另一个核心组件，但经常被完全忽略。这是一系列值，允许你在 Metasploit
    框架内配置你想要的任何行为。数据存储允许接口更改设置，而载荷能够修补操作码（opcodes），利用程序能够指定特定参数。这还允许框架在模块之间传递数据。


    特别是，Metasploit 有两种不同的数据存储：全局数据存储和模块数据存储。为了有效使用 Metasploit，你需要熟悉这两者。全局数据存储可以允许所有模块使用它。当数据存储选项被设置时，所有模块都将具有访问权限。要定义全局数据存储选项，你需要使用命令：`setg`。


    另一方面，模块数据存储的设计初衷是让只有指定的模块能够利用它，而不是所有人。


    ## Metasploit 工作空间 (Workspaces)


    Metasploit 内部的工作空间允许你对数据库中的主机和数据进行分段。这允许你使用工作空间在你想要测试的任何分段之间创建隔离。。例如，想象你想为组织内的每个子网都创建一个工作空间，因为你想将主机数量限制在指定的网络。这将导致你创建工作空间，例如每个部门一个。这意味着每个组织的部门都将获得自己的工作空间。


    当你使用工作空间时，你可以导入数据、处理这些数据，然后将这些数据直接导出，以确保数据可以自动重用。这也允许同一个工作空间自动报告关于任何正在交互的当前主机的信息。如果你想创建一个工作空间，必须使用带有
    `-a` 选项的 `workspace` 命令。创建的任何工作空间都会成为当前使用的。


    想象一下，你想为组织中的 A、B、C 三个部门各创建一个工作空间。你会写：


    ```bash

    msf workspace -a A

    msf workspace -a B

    ms workspace -a C

    ```


    总的来说，当然，如果你准备好使用 Metasploit，你会发现它实际上非常容易上手。你只需要知道如何遍历系统以及如何理解你所看到的内容。例如，当你知道提供哪些类型的模块时，你就可以选择那些适合你的模块。因为
    Metasploit 已经为你填满了各种信息，这些信息旨在确保你只需少数命令就能完成几乎任何操作，而无需不断地手动告诉系统你想让它做什么，因此它实际上非常易用。这正是它变得流行的原因。


    最终，使用 Linux 自带的免费版本应该没问题，尽管如果你愿意付费，也有升级版本可用，归根结底，这将取决于个人观点，你必须根据自己的想法和需求做出决定。当然，升级版尽管价格昂贵，但它们被设计得非常强大。它们针对高技能的渗透测试专业人员，他们清楚地知道自己在做什么以及将得到什么，并能够证明那个巨额价格的合理性。然而，你不必这样做。


    # 第 8 章：数字证书


    就像在现实世界中，我们需要携带身份证明来证明自己的身份，特别是当我们做某些重大事情时（如买车或贷款），你的互联网连接也需要某种程度的识别。这就是数字证书大显用场。当你拥有满有价值信息的服务器时，你可能希望确保你的信息在任何时候都尽可能受到保护——这是合理的。然而，你如何确定那些访问你服务器信息的人确实是他们所说的人，或者确实被允许访问呢？


    特别是在今天，当我们如此担心数据被盗取或接管时，很容易感到数据面临风险，而且很有道理——事实如此。然而，当你引入数字证书层时，你为你的服务器增加了额外的安全层，或者感觉你的隐私信息受到了保护。你可以确保，尽管你使用的是可能位于公共互联网上的网站，但你的数据本身是了认证。


    如果你有一个局域网（LAN），你可能不需要这种主要的认证。通常情况下，这是通过名为 `OpenSSL` 的工具完成的——它是 Kali Linux 自带的工具。


    ## 什么是数字证书？


    数字证书本质上是将公钥的所有权与拥有它的个人关联起来的方法。这些证书用于共享公钥和加密数据。当你使用这些时，你实际上获得了一种保护数据的方法。在数字证书内部，有几层信息都具有不同的用途——有经过认证的公钥，有标识所有者的元数据，还有数字签名。


    ## 证书颁发机构 (CA)


    证书颁发机构受信任的第三方，负责维护 `PKI`，发布数字证书并保护它们免受攻击或利用。通过第三方对网站进行身份验证并确保数据受保护，你可以使用自己的 `PKI`（公钥基础设施）。


    ## 证书类型


    最终，有几种类型的证书提供给个人。这些证书来自不同的来源，取决于其用途：


    - **根证书 (Root Certificate)**: 根证书是由 `CA` 生成的公钥证书，它是链的顶端。

    - **中间证书 (Intermediate Certificate)**: 中间证书位于中间的，由 `CA` 用于签名和发行用户证书。

    - **SSL 证书 (SSL Certificate)**: SSL 证书是全球标准，允许浏览器和服务器之间进行加密通信。

    - **域名验证证书 (Domain validated)**: 这些证书告诉你是正在使用正确的域名。

    - **组织验证证书 (Organization validated)**: 这些证书提供了更多的保证——它们确认持有者有权使用特定域名，并经过额外的确认以确保个人拥有该证书。

    - **扩展验证证书 (Extended validation)**: 此证书在申请人能够按照 `CA` 标准证明他们是自己的人后发行。


    ## 生成自签名 SSL 证书


    正如你预期的，Kali Linux 自带了一个可以创建证书的程序。这是通过 `OpenSSL` 完成的。虽然这并不总是有效，并且在你尝试使用时可能会被拒绝，但你可以这样做。你可以通过你的自签名
    SSL 证书获得所有的加密优势，但不会获得身份验证优势，这意味着人们不会信任你的网站。


    首先，打开 `OpenSSL`。在那里，你需要使用以下命令：


    ```bash

    openssl genrsa -out key.pem 2048

    openssl req -new -sha256 -key key.pem -out csr.csr

    openssl req -x509 -sha256 -days 365 -key key.pem -in csr.csr -out certificate.pem

    ```


    1. 第一个命令触发一个 2048 位的 RSA 私钥 (`key.pem`)——这是你的密钥应该采用的格式。

    2. 第二个命令触发创建证书签名请求 (`csr.csr`）。

    3. 第三个命令触发生成一个可在 Web 服务器上使用的自签名 x509 证书 (`certificate.pem`）。


    '
- fmt: "\n### Limitations of Shell\n\n* The syntax is obscure sometimes\n* It is slow\n\
    * It is easy to accidentally leave out something crucial\n* The shell’s language’s\
    \ data structure is a string\n* It is difficult to test units on the shell\n\n\
    Each of these lends their hands toward the idea of replacing the shell. While\
    \ the shell has been used as a legitimate programming language, it is incomplete—it\
    \ is not designed to be a complete programming language, but Python is. \n\nPython\
    \ itself is an interpreted, high-level programing language that is meant to be\
    \ dynamic. It is meant to be object-oriented, it is meant to be layered. It is\
    \ meant to be used as either a scripting language or even as a sort of binding\
    \ agent between two different applications or components. Python is quite simple\
    \ to learn and is focused on providing an easily readable system, allowing for\
    \ it to be easier to access than some more complex languages that may emphasize\
    \ old, outdated phrases or syntaxes that are simply used out of tradition and\
    \ familiarity at this point. \n\nHowever, familiarity is not always a good thing.\
    \ Sometimes, what is needed more than ever is a change, or at least to adapt in\
    \ some way in order to ensure that you are able to keep growing. This is where\
    \ Python and bash meet.\n\n### Why Shift to Python\n\nEffectively, then, the best\
    \ way to up productivity would be from moving away from the use of the shell and\
    \ instead, work with Python code instead. Because Python is easier to read, is\
    \ faster, and allows for legitimate testing, it seems like shifting over to it,\
    \ at least in some capacity would be beneficial.\n\nInterestingly enough, Python\
    \ is already installed by default on major Linux distributions. If you were to\
    \ open a command prompt and type in `python` you should be provided with a Python\
    \ interpreter. This alone suggests that it may be worth the use of Python over\
    \ bash when considering the creation of scripting. Thanks to the ease of use alone,\
    \ it would save time.\n\nTake a look at some of the most compelling reasons to\
    \ shift from focusing on shell scripts to using Python as a replacement instead:\n\
    \n* It is installed by default\n* It is easy to read and the syntax is simple\n\
    * It is an interpreted language\n* It is a fully-featured programming language\n\
    * Python has access to a standard library and plenty of third-party libraries\
    \ in order to use all sorts of utilities\n* Python’s standard library is sorted\
    \ by date and time, allowing you to put a date into any format to compare it to\
    \ other dates\n* Python is a simpler transitional link\n"
