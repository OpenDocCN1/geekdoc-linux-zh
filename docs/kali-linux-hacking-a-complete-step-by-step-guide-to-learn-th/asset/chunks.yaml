- fmt: "\n# Using Metasploit\n\nWhen you have Metasploit installed and ready to use,\
    \ all you need to do is gather information somehow, whether through first port\
    \ scanning or finding a vulnerability scanner to find a way in. Once you are in,\
    \ all you have to do is choose an exploit and payload and Metasploit will do the\
    \ rest for you. Effectively, the exploit is the way that weakness is identified\
    \ and in harder to defend networks. \n\nThe framework is specifically designed\
    \ to make use of various models and interfaces, such as `msfconsole` interactive\
    \ curses, and more. It can work from the terminal/`cmd`, and is also compatible\
    \ with the Metasploit Community Web Interface, which will support pen testing.\n\
    \n## Installing Metasploit\n\nBefore you can use Metasploit, however, you must\
    \ first install it. Installing it will require you to first disable all of your\
    \ firewalls and antivirus software. Due to the file itself, it is oftentimes considered\
    \ malicious when you try to install it with your firewalls and antivirus software\
    \ running. This then interrupts your installation. Because of this, it is best\
    \ to just disable the firewall and antivirus software first before continuing.\
    \ This means as well, however, that you must also make sure that you are ensuring\
    \ that your source of download is legitimate and safe. If you are not careful,\
    \ you may inadvertently download something that actually could be dangerous or\
    \ problematic to you.\n\nWith the firewalls and antivirus software down, make\
    \ sure that you also have your administrative privileges. This should not be a\
    \ problem in Kali Linux as you should already have root user access by default,\
    \ but if you are not for some reason or you are attempting to install Metasploit\
    \ on a different distro of Linux, you are going to want to ensure that you also\
    \ have that administrator privilege for yourself.\n\nFinally, to install Metasploit,\
    \ your best bet is to install it from the Rapid7 site. Doing so will allow you\
    \ to get the installer for your specific operating system. It also will contain\
    \ a self-contained environment that you can use for updating and running the framework.\
    \ This means that everything that you need will all be taken care of during the\
    \ initial installation process. You can, of course, go in manually to configure\
    \ Metasploit yourself if you choose to do so, but that step is unnecessary and\
    \ will be skipped for the purpose of this book. When you have the files, launch\
    \ the installer. It will prompt you to enter a specific framework. As a Kali Linux\
    \ user, you should find that this is preinstalled and not have to continue further.\n\
    \n## Managing the Metasploit Database\n\nNow, it is time to stop and finish the\
    \ database information before continuing. When you are ready to manage your database,\
    \ you will need to use the `msfdb` script to configure `postgresql` to run in\
    \ order to store the database in `~/.msf4/db/`. When ready to start this, you\
    \ will use the following command:\n\n```bash\n$ msfdb init\n```\n\nThis will trigger\
    \ the database to start, and you will then be able to use any of several commands\
    \ that will work best for you. These commands add extra functionality and help\
    \ you manage the space that you have available. The most common commands at this\
    \ stage that you will need to include:\n\n- `msfdb reinit`: This will cause your\
    \ database to be deleted and reinitialized in order to refresh it.\n- `msfdb delete`:\
    \ Using this particular command will lead to your database being deleted altogether\
    \ without it reinitializing as the previous command caused.\n- `msfdb start`:\
    \ This command starts the database back up again, allowing it to begin running.\n\
    - `msfdb stop`: This command, when used, will stop the database from running at\
    \ all.\n- `msfdb status`: This command will allow the terminal to print the current\
    \ database status, showing you all of the critical information within the terminal.\n\
    \n## The Metasploit Datastore\n\nBeyond just having everything that has been listed\
    \ thus far, there is also the datastore—another core component of the Metasploit\
    \ framework that is often overlooked altogether. This is a series of values that\
    \ will allow you to configure any behaviors that you desire within the Metasploit\
    \ framework. The datastore allows interfaces to change settings, while the payloads\
    \ are able to patch up opcodes, and exploits are able to specify specific parameters.\
    \ This also allows for the framework to pass between modules as well.\n\nIn particular,\
    \ Metasploit has two different datastores: the global and module datastore. You\
    \ will need to be familiar with both in order to use Metasploit effectively. The\
    \ global datastore can allow for all modules to use it. When the datastore option\
    \ is set, all modules will have access to it. In order to define the global datastore\
    \ option, you will need to use the command: `setg`.\n\nThe module datastore, on\
    \ the other hand, is designed so only designated modules will be able to utilize\
    \ it, rather than anyone at all.\n\n## The Metasploit Workspaces\n\nThe workspaces\
    \ within Metasploit allow you to segment up the hosts and data within the database.\
    \ This allows you to use the workspaces to create separations between any of the\
    \ segments that you wish to test. For example, imagine that you want a workspace\
    \ for every single subnet within your organization because you want to limit the\
    \ number of hosts to a specified network. This would lead to you creating workspaces\
    \ such as one per department. This means that each organization’s department would\
    \ get its own workspaces.\n\nWhen you use a workspace, you are able to import\
    \ data, manipulate that data, and then export that data right back out in order\
    \ to ensure that the data can be reused automatically. This also allows for the\
    \ same workspace to automatically report anything about any current host that\
    \ is being engaged with. If you wish to create a workspace, you must use the `workspace`\
    \ command with the `-a` option in order to do so. Whatever workspace you create\
    \ becomes the current one being used.\n\nImagine for a moment that you want one\
    \ for the three departments, A, B, and C in your organization. You would write:\n\
    \n```bash\nmsf workspace -a A\nmsf workspace -a B\nms workspace -a C\n```\n\n\
    Overall, of course, if you are ready to use Metasploit, you should find that it\
    \ is actually incredibly easy to get involved with. All you will need to know\
    \ is how to go through the system and how to understand what you are looking at.\
    \ When you know which kinds of modules are available, for example, you will be\
    \ able to choose those that work for you. Because Metasploit is already jam-packed\
    \ with all sorts of information for you that is designed to ensure that you are\
    \ able to do almost anything with just a few commands instead of having to constantly\
    \ manually be telling your system what you want it to do, it is actually incredibly\
    \ user-friendly. This is exactly why it has become popular.\n\nUltimately, you\
    \ should be just fine with the free version that comes with Linux, though there\
    \ are upgrades available if you care to pay for them, and ultimately, that will\
    \ be a personal opinion and you will have to decide based on your own thoughts\
    \ and desires. Of course, the upgraded versions, even though they boast quite\
    \ the hefty price tags, are designed to be incredibly powerful for you. They are\
    \ aimed at highly skilled pen tester professionals who know exactly what they\
    \ are doing and exactly what they are getting, and they are able to justify that\
    \ massive price tag. However, you do not have to do this as well.\n\n# Chapter\
    \ 8: Digital Certificate\n\nJust as how in the real world, we need to carry identification\
    \ to prove who we are, especially when we are doing something major, such as buying\
    \ a car or taking out a loan, your internet connection also needs some level of\
    \ identification as well. This is where digital certificates come in. When you\
    \ have servers full of valuable information, you likely want to ensure that your\
    \ information is as protected as possible at all times—this makes sense. However,\
    \ how are you supposed to be certain that those who are accessing the information\
    \ on your server are truly who they said they were or truly allowed to be accessing\
    \ it?\n\nEspecially in this day and age, when we are so concerned with data being\
    \ stolen or taken over, it is easy to feel like our data is at risk, and for a\
    \ good reason—it is. When you introduce a layer of digital certificates, however,\
    \ you add an extra layer of safety to your servers or to feel like your private\
    \ information is protected. You are able to make sure that, though you are using\
    \ sites that may be on the public internet, your data itself is certified.\n\n\
    If you have a LAN, however, you may not need this sort of major certification.\
    \ Most often, this is done with a tool known as `OpenSSL`—something that comes\
    \ packaged with Kali Linux.\n\n## What is a Digital Certificate?\n\nThe digital\
    \ certificate is essentially the way to link the ownership of a public key to\
    \ the individual that owns it. These are used for sharing public keys and encrypting\
    \ data. When you use these, you effectively end up with a way to safeguard the\
    \ data. Within a digital certificate, there are several layers of information\
    \ that all serve different purposes—there is the public key that is certified,\
    \ there is metadata that identifies the owner, and there is a digital signature.\n\
    \n## Certificate Authorities\n\nThe certificate authority is a trusted third party\
    \ who maintains the `PKI`, issuing digital certificates and protecting them from\
    \ being attacked or exploited. By using a third party to authenticate a website\
    \ and ensure that the data is protected, you are able to use your own `PKI` (Public\
    \ Key Infrastructure).\n\n## Types of Certificates\n\nUltimately, there are several\
    \ types of certificates that are provided for an individual. These come from different\
    \ sources and are used depending on the purpose:\n\n- **Root Certificate**: The\
    \ root certificate is a public key certificate that is generated by a `CA`, meant\
    \ to identify a root authority. It is the top of the chain and must be signed\
    \ by a trusted entity.\n- **Intermediate Certificate**: The intermediate certificate\
    \ is the one in the middle—it is used by the `CA` to sign and issue end-user certificates.\n\
    - **SSL Certificate**: The final certificate is the secure sockets layer—this\
    \ is the global standard that allows for encrypted communication between a browser\
    \ and a server. These are used by millions of people and businesses everywhere\
    \ to protect data from identity thieves.\n- **Domain validated**: These tell you\
    \ that you are using the right domain name. This shows that the data is being\
    \ sent and received as intended, but there is no way to prove who the holder is.\n\
    - **Organization validated**: These provide slightly more assurance—they confirm\
    \ that the holder has the right to use a specific domain but also undergo extra\
    \ confirmation to ensure that the individual with the certificate owns the domain.\n\
    - **Extended validation**: This certificate is issued after applicants are able\
    \ to prove that they are who they say they are to the standards of whatever `CA`\
    \ is vetting them. This process requires the verification of the existence of\
    \ the individual or entity who wishes to apply for the certificate, while also\
    \ guaranteeing that the identity matches any official records.\n\n## Generating\
    \ Self-Signed SSL Certificates\n\nAs you are likely to expect, Kali Linux comes\
    \ with its own program that allows it to create certificates. This is done through\
    \ `OpenSSL`. While this will not always work for you and may get rejected when\
    \ you attempt to use it, you are able to do so. You can provide all of the encryption\
    \ benefits with your self-signed SSL certificate, but you will not get the authentication\
    \ benefits, meaning people will not trust your site.\n\nFirst, open up `OpenSSL`.\
    \ There, you must use the following commands:\n\n```bash\nopenssl genrsa -out\
    \ key.pem 2048\nopenssl req -new -sha256 -key key.pem -out csr.csr\nopenssl req\
    \ -x509 -sha256 -days 365 -key key.pem -in csr.csr -out certificate.pem own```\n\
    \n1. The first command triggers a 2048-bit RSA private key (`key.pem`)—this is\
    \ the recommended format for your key to be in.\n2. The second command triggers\
    \ the creation of a certificate signing request (`csr.csr`). You will likely get\
    \ questions and it is your job to answer them as accurately as possible to guarantee\
    \ that you are seen as trustworthy.\n3. The third command triggers the generation\
    \ of a self-signed x509 certificate (`certificate.pem`) that is usable on web\
    \ servers.\n\n"
