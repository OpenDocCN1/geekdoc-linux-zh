    \n第二部分：Kali Linux 简介与黑攻击\n第一章：黑攻击简介\n这是许多人可能发生的最糟糕的事情之一——他们登录银行账户，却发现余额被完全清空。这绝对会摧毁许多人的生活，不幸的是，在如今这是一个非常真实的担忧。![](img/rsrc6.jpg)\
    \ 财务信息被备份在某处。你的银行有你的账户记录、数字以及他人访问该账户所需的所有信息。你可能会在某处登录支付信用卡或公用事业账单。你甚至可能在网上进行大部分购物，包括杂货和其他物品。这意味着你的个人信息一直在在线上被使用。当你输入社会安全号码来申请报税时，三大局会跟踪你的信息并定期进行核查。这有一个严肃的含义——你所有的核心信息都存在于某处。公平地说，这些信息通常存储在各种安全的安全协议之后，这些协议旨在防止你的信息泄露给那些可能对利用你的信息进行不法之实的人，但就像盔甲一样，通常有方法可以突破它。某些系统可能比其他系统安全，但归根结底，只要愿意努力，专门的人就能找到某种方法突破。\n\
    \n什么是黑攻击？\n那么，黑攻击是指识别计算机或网络安全系统中的任何弱点的行为，然后利用该弱点获取访问防火墙后面隐藏内容的必要权限。例如，一个常见的例子是使用设计用于识别密码的算法，以便以数字方式拨开网络或账户的锁。该账户随后被利用以获得所需的访问权限。黑攻击并不总是出于伤害之图——一些人出于合法目的这样做，例如为了找到系统中的缺陷并修复它。另一些人选择这样做是为了娱乐自己，就像做一个复杂的拼图或尝试解决日益复杂的数学题以测试和磨练能力一样。还有人这样做是为了出于某种目的窃取信息，无论是为了财务利益，还是为了瘫痪他们所处的系统。黑攻击有几种形式，例如欺骗某人点击电子邮件中的附件，从而获得对计算机的访问权限。然而，其他形式需要多得的技术知识，开发出欺骗并触发系统的能力，以授予那些本应受保护的访问权限和信息。本书将主要讨论与技术专业知识相关的方法，而不是使用阴险的手段来尝试从一开始就欺骗他人授予访问权限。本质上，黑攻击是进入他人系统的行为，但黑攻击的方法差异很大。这些行为都以不同的方式发生并服务于不同的目的，但结果是相同的——它们允许信息被盗取和使用，或者让程序以非预期的方式被使用。例如，有些人可能会黑攻击他们的视频游戏主机来运行模拟器，以便他们玩不同游戏的\
    \ ROM，包括某些可能根本没有打算在该系统上使用的游戏。另一些人可能利用他们的技能窃取信息并卖给寻求窃取身份的人。尽管如此，黑客有许多选项可以使用以获取他们想要的所有信息。本节的其余部分将讨论一些常见的黑攻击方法。\n\
    \n恶意软件\n恶意软件是旨在破坏、损坏或获取计算机系统未经授权访问的恶意软件。有许多类型的恶意软件，包括病毒、蠕虫、木马、勒索软件、间谍软件和广告软件。\n\
    病毒\n病毒是一种恶意软件，通过传播到其他计算机程序和文件来自我复制。它们通常附着在合法程序上，并在程序运行时执行其代码。\n蠕虫\n蠕虫是一种恶意软件，它通过网络传播到其他计算机来自我复制。与病毒不同，蠕虫不需要人工干预即可传播。\n\
    木马\n木马是一种伪装成合法软件的恶意软件。一旦安装，它们就可以为攻击者提供对系统的未经授权访问。\n勒索软件\n勒索软件是一种加密用户文件并要求支付解密密钥的恶意软件。\n\
    间谍软件\n间谍软件是在用户不知情的情况下监控用户活动并收集信息的恶意软件。\n广告软件\n广告软件是一种显示不想要的广告的恶意软件，通常以弹出窗口的形式出现。\n\
    会话劫持\n会话劫持是一种攻击，攻击者接管用户的活动会话以获取对其账户的未经授权访问。这通常通过窃取会话 Cookie 实现。\nSQL 注入\nSQL 注入是一种攻击，攻击者通过输入字段向查询中插入恶意\
    \ SQL 代码。这允许攻击者从数据库中查看、修改或删除数据。\n钓鱼攻击\n钓鱼是一种社交工程攻击，攻击者欺骗用户泄露敏感信息，如密码或信用卡号。这通常通过欺骗性的电子邮件或假网站实现。\n\
