    and command the server.When a command is running, it is called a process. When
    that process is happening in the foreground, you must wait for it to finish before
    you can do anything else. This is the default way to run the program.You can also
    enter your commands in two forms: With or without arguments. When you enter a
    command without an argument, you are entering a simple command without expecting
    anything else. This will cause the computer to send you to exactly what you have
    specified or done exactly what you said. If you write ls, for example, you will
    suddenly get everything listed out in front of you on the screen—the current directory’s
    files and directories.However, an argument seeks to alter that command somewhat.
    In adding an argument, you add an extra condition—you may tell your system to
    bring up the files of a different directory. You may tell your system to shut
    down in 30 minutes instead of instantly. They add a change to the meaning of the
