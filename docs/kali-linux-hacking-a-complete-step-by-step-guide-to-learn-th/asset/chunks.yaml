    In order to define the global datastore option, you will need to use the command:
    setgThe module datastore, on the other hand, is designed so only designated modules
    will be able to utilize it, rather than anyone at all.The Metasploit WorkspacesThe
    workspaces within Metasploit allow you to segment up the hosts and data within
    the database. This allows you to use the workspaces to create separations between
