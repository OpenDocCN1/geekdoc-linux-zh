    transmitted.If you wish to create a workspace, you must use the workspace command
    with the –a option in order to do so. Whatever workspace you create becomes the
    current one being used.Imagine for a moment that you want one for the three departments,
    A, B, and C in your organization.You would write:msf workspace –a Amsf workspace
    –a Bms workspace –a COverall, of course, if you are ready to use Metasploit, you
    should find that it is actually incredibly easy to get involved with. All you
    will need to know is how to go through the system and how to understand what you
    are looking at. When you know which kinds of modules are available, for example,
    you will be able to choose those that work for you. Because Metasploit is already
    jam-packed with all sorts of information for you that is designed to ensure that
    you are able to do almost anything with just a few commands instead of having
    to constantly manually be telling your system what you want it to do, it is actually
    incredibly user-friendly. This is exactly why it has become so popular.Ultimately,
    you should be just fine with the free version that comes with Linux, though there
    are upgrades available if you care to pay for them, and ultimately, that will
    be a personal opinion and you will have to decide based on your own thoughts and
    desires. Of course, the upgraded versions, even though they boast quite the hefty
    price tags, are designed to be incredibly powerful for you. They are aimed at
    highly skilled pen tester professionals who know exactly what they are doing and
    exactly what they are getting, and they are able to justify that massive price
    tag. However, you do not have to do this as well.Chapter 8: Digital CertificateJust
    as how in the real world, we need to carry identification to prove who we are,
    especially when we are doing something major, such as buying a car or taking out
    a loan, your internet connection also needs some level of identification as well.
    This is where digital certificates come in. When you have  servers full of valuable
    information, you likely want to ensure that your information is as protected as
    possible at all times—this makes sense. However, how are you supposed to be certain
    that those who are accessing the information on your server are truly who they
    said they were or truly allowed to be accessing it?Especially in this day and
    age, when we are so concerned with data being stolen or taken over, it is easy
    to feel like our data is at risk, and for a good reason—it is. When you introduce
    a layer of digital certificates, however, you add an extra layer of safety to
    your servers or to feel like your private information is protected. You are able
    to make sure that, though you are using sites that may be on the public internet,
    your data itself is certified.If you have a LAN, however, you may not need this
    sort of major certification that would come along with using the public network
    for data. The cost of paying for those certificates may be unnecessary compared
    to the risk. In those instances, the best idea to secure a network is to use your
    own local CA or certificate authority—this will automatically sign any certificates
    that are actively installed within your LAN in order to protect their servers.Most
    often, this is done with a tool known as OpenSSL—something that comes prepackaged
    with Kali Linux. We will be discussing how to create a certificate shortly, but
    for now, we will return our focus to the background information first.This chapter
    will first discuss what a digital certificate and the certificate authorities
    that exist. From there, you will be walked through how to create a digital certificate
    on your Kali Linux based web servers. Being able to create your own digital certificate
    definitely has its own uses, but comes with its own issues as well. Nevertheless,
    if you think that it may be useful to you, you are more than welcome to pursue
    it. At the very least, it is more command language under your belt that you can
    use. At best, you may find some legitimate use in it.What is a Digital Certificate?The
    digital certificate is essentially the way to link the ownership of a public key
    on the internet to the individual that owns it. These are used for sharing public
    keys for encrypting and authenticating data. When you use these, you effectively
    end up with a way to safeguard the digital signature. Within a digital certificate,
    there are several layers of information that all serve different purposes—there
    is the public key that is certified. There is information that is identifying
    whoever is the owner of a said public key. There is metadata that is directly
    related to the digital certificate, and there is a digital signature of that particular
    public key, generated by the certificate issuer.Effectively, the public key comes
    in a pair—there is the public key that is used to lock the data that needs to
    be authenticated, and there is the private key that is held by the owner, used
    to sign and decrypt the protected data. Effectively, this leads to the digital
    certificate owner sharing the public key with their data that has been encrypted
    so they are able to access it with the private key that goes along with it.These
    days most major web browsers utilize digital certificates—this allows people to
    know that the content that they are viewing has not been altered by someone who
    did not have permission to do so, and allows decrypting and encrypting of web
    content. Effectively, this is just another way to develop the privacy and protection
    that people are looking for in their interactions with the internet.While you
    are able to issue your own PKI (public key infrastructure) and we will discuss
    doing that shortly, for the most part, there is some sort of organization that
    usually manages the creation and distribution of PKIs. This organization is known
    as the certificate authority.Certificate AuthoritiesThe certificate authority
    is a trusted third party who maintains the PKI, issuing out digital certificates
    and protecting them from being attacked or exploited in any way. By using a third
    party to authenticate a website and ensure that it is protected, websites are
    able to prove that they are actually safer than people may otherwise think. They
    are able to prove that they are legitimately interested and concerned in maintaining
    the safety of the customers and other people who are actively accessing their
    site because they are actively paying for that extra level of security. The individuals
    feel like their data is better protected, which leads to a higher likelihood of
    people returning to that particular site again. They are willing to take the shot
    if they feel like they can trust the source.Types of CertificatesUltimately, there
    are several types of certificates that can be provided for an individual. These
    certificates either come from a different source or with a different purpose and
    they will be treated differently depending on the type of certificate that it
    is. The various certificates that can be used will be discussed in this section.
    The certificates exist in a sort of chain with each other, with one validating
    the other.![](OEBPS/rsrc128.jpg)Root CertificateThe root certificate is a public
    key certificate that is meant to identify a root certificate authority (Root CA).
    Anyone is capable of generating a signing key and signing that new certificate,
    though it is not considered to be valid until it is signed by the trusted or valid
    CA. The root certificate is the top of the chain, essentially—it must be given
    by a trusted certificate. These are typically related to the software that you
    are using—if you are using Microsoft, for example, it is likely that your root
    certificate is signed by Microsoft.Effectively, each of the certificate programs
    has its own sort of guidelines and stores of root certificates that can be used.
    These have the toughest standards for one reason—if you have one of these certificates,
    you are seen to be trusted. The root certificate is necessary in order to make
    sure that other certificates are issued and verified.Intermediate CertificateThe
    intermediate certificate is the one in the middle—certificate authorities do not
    tend to directly issue their own certificates. Because of this, they instead use
    what is known as an intermediate root. This certificate is used by the CA to sign
    in and allow them to issue any end user SSL certificates. In doing this, there
    can be several intermediate root stops before you eventually arrive at the SSL
    certificate. Eventually, however, you reach the end user, who gets the SSL.SSL
    CertificateThe final certificate, the end result, is the secure sockets layer—this
    is the global standard technology that allows for the use of encrypted communication
    between a browser and a server. These are used by millions of people and businesses
    everywhere to protect data from hackers or identity thieves. Effectively, the
    SSL allows for the conversation between the user and the server to be kept private,
    even though it is happening on the public web network. These are typically issued
    by a certificate authority, who is trusted to ensure that the data will, in fact,
    be protected as promised.The SSL layer comes in several different types of certificates—they
    can be domain validated, organization validated, or extended validation.Domain
    validated SSL certificates tell the least and promise the least—all you need to
    do to get this SSL is prove that you are using the right domain name. This does
    show that the data is being sent and received as intended to the one who holds
    the certificate, there is no way to prove who that certificate holder is.Organization
    validated SSL certificates provide slightly more assurance—they confirm that the
    holder does have some sort of right or claim to use a specific domain but also
    undergo extra confirmation to ensure that the individual with the certificate
    does, in fact, own the domain.The extended validation certificate, on the other
    hand, is issued after applicants are able to prove that they are who they say
    they are to the standards of whatever CA is vetting them.This process requires
    the verification of the existence of the individual or entity who wishes to apply
    for the certificate, while also guaranteeing that the identity matches any official
    records as well. Effectively, the entity is verified and authorized to use that
    domain and certificate.Generating Self-Signed SSL CertificatesAs you are likely
    to expect, Kali Linux comes with its own program that allows it to create certificates.
    This is done through OpenSSL. While this will not always work for you and may,
    in fact, get rejected when you attempt to use it, you are able to do so. You are
    able to provide all of the encryption benefits with your self-signed SSL certificate,
    but you will not get the authentication benefits. This means that not many people
    will be able to trust your site, and it is likely that anyone who tries to access
    your site will get a warning that says that your site or server is not, in fact,
    verified and therefore cannot be guaranteed.Despite that, it can be useful to
    have, even if just for yourself. This section will discuss the steps necessary
    to create your own SSL certificates.First, open up OpenSSL. There, you must use
    the following commands:openssl genrsa –out key.pem 2048openssl req –new –sha256
    –key key.pem –out csr.csroepnssl req –x509 –sha256 –days 365 –key key.pem –in
    csr.csr –out certificate.pemThe first command triggers a 2048-bit RSA private
    key—this is the recommended format for your key to be in and it will be generated
    at that first command.The second command triggers the creation of a certificate
    signing request—you will likely get questions at that second command and it is
    your job to answer them as accurately as possible to guarantee that you are seen
    as trustworthy.The third command triggers the generation of a self-signed x509
    certificate that is usable on web servers. This is exactly what you were looking
    for.Remember, these will encrypt the site and make sure that your data is protected,
    but it does not actually offer authentication benefits. They can obviously still
    have their uses, such as when protecting a site during early stages, but due to
    the warning, you are not likely to want to keep this as your only form of verification
    if you will be expecting long-term traffic or you will be handling any sort of
    sensitive information such as payment methods or addresses.Ultimately, you will
    need to figure out just how worthwhile paying for a legitimate certificate may
    be if you do not want to deal with security warnings chasing people away.Chapter
    9: Bash and Python ScriptingBash itself is a shell—it stands for Bourne Again
    SHell, and it serves an important purpose. It allows for starting the server,
    confirming that the server is open, and working to keep everything running smoothly.
    Effectively, the shell on a system is meant to take any commands that you input
    through your keyboard in order to tell the operating system what to do. This was
    the only real way to interact with your Unix-like system back in the day, but
    these days, we have access to so much more. You are able to use GUIs alongside
    CLIs these days, meaning that you no longer have to type out what you want your
    computer to do if you want it to do so. This is why instead of typing out where
    your file is in order to locate it, you can simply go to your start menu, click,
    search through the files manually, and then open it up.There is no denying that
    bash has a history—it is what was effectively initially used by those who were
    accessing their original systems, and while it was absolutely useful then, there
    is question now about whether it is still the best way to be interacting. It is
    like the stubborn old coworker that has been at her job forever and refuses to
    change, despite the fact that her way is clunky, inefficient, and really, redundant.
    Everyone would be happier if she went to the easier version, and productivity
    and ease of the work would go up, but she refuses.This same sort of resistance
    appears with bash and transitioning from bash to another language, such as Python,
    which is currently one of the top contenders as a replacement.The idea these days
    is that the shell may be becoming obsolete—there are better ways to interact with
    your operating system. In particular, the shell has several concerning features:'
