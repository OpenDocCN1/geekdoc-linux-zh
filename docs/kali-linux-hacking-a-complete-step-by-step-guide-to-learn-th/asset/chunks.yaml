    到此时，你已经可以使用任何 USB 驱动器来启动操作系统了。你只需要在挂载 USB 的情况下启动电脑时，调出启动菜单，并确保选择 Kali Linux。你也可以使用其他方法访问
    Kali Linux，例如将其安装在你的电脑上，但最推荐的访问方法之一是通过使用 USB 驱动器。如果你感兴趣将整个系统下载到你的硬件中，可以随时浏览 Kali
    Linux 官方网站获取更多关于如何准确操作的方法和信息。


    # 第 4 章：基础 Linux 命令


    从现在开始，你将获得的信息是实性信息和可以在某些方面积极使用的信息的混合。本章将特别为你提供开始与 Kali Linux 交互的必要信息。你将获得一份常用且基础的必要命令列表。


    在阅读这些命令时，请尝试真正熟悉它们。你想要确保理解它们是什么以及如何最好地利用它们来让自己受益。如果你能做到这一点，你就能确保无论选择哪种 Linux 发行版，都能与其交互。记住，在
    Kali Linux 中，你默认以 root 用户身份运行，需要采取必要的预防。当你在没有 root 权限的情况下使用这些几个命令时，你会遇到阻碍你前进的问题。然而，在
    Kali 中，如果你已经是 root 用户，命令会立即执行，即使是有害的命令。这就是为什么如果你真的想开发你的 Kali Linux 技能并精通渗透测试和黑客攻击，注意细节（甚至是大量的细节）是至关重要的。


    ## 终端


    如果你熟悉 Linux 和基础命令，你也应该熟悉终端（Terminal）。这是你与 Linux 的 shell 交互的方式，命令它执行你预期的操作。你本质上是在向服务器输入，然后期望它从另一端输出正确的响应。这是最简单的
    Linux 命令的基础。


    作为一个快速回顾，如果已经有一段时间没用了，你将在图形环境中模拟终端，以便你以可阅读和理解的方式看到输入和输出。如果你已经有了 Linux 或 OS X，你已经可以访问终端，也可以安装其他的。如果你有
    Windows，你可能想要安装 `PuTTY`。Kali Linux 内部也有一个你可以轻松访问的终端。


    ### 命令提示符


    当你与终端交互时，你正在使用命令提示符或 shell 提示符——在阅读各种指南时，你可能会看到这两个词被交替使用。当你进入终端时，你会看到一种非常特定的提示符组成。它将是用户的用户名、服务器的主机名、你所在的目录以及提示符符号。在大多数情况下，你看到的提示符符号是
    `$`。


    有效地说，如果你的用户昵号是 `hacker`，你所在的服务器是 `hacking`，且你当前处于默认主目录，你可能会看到默认提示符：

    `hacker@hacking:~$`


    然而，在 Kali Linux 中，你始终登录在单一 root 用户账户上。你会看到用户名 `root`，而不是 `hacker` 或其他可能存在在那的名字。


    ### 执行命令


    当你想要输入命令时，你必须以系统能够妥善管理的方式指定你的需求。你可以输入脚本，即一组预设的信息，将触发系统以特定方式做出响应。你也可以输入自己的命令。这是本章的大部分内容：与服务器交互和控制服务器的方法。


    当一个命令运行时，它被称为一个进程（process）。当该进程在以前台运行时，你必须等待它完成后才能进行任何其他操作。这是运行程序的默认方式。


    你还可以以两种形式输入命令：带参数或不带参数。当你输入一个不带参数的命令时，你输入的是一个简单的命令，不期望其他任何内容。这将导致计算机将你带到你指定的精确位置，或完全执行了你所说的。例如，如果你写
    `ls`，你会发现屏幕上突然列出了所有内容——当前目录的文件和目录。


    然而，参数（argument）会从某种程度上改变该命令。通过添加参数，你增加了一个额外条件——你可以告诉系统调出另一个目录的文件。你可能告诉系统在 30 分钟后关闭而不是立即关闭。它们为原始命令的含义添加了变化。当你输入带参数的命令时，你将按照特定的顺序输入命令，然后是所运行内容的指定或位置。


    执行命令的另一种常见方式是使用选项（options）——这意味着它们带有某种遵循的修改。随其后的是一个 `-` 和一个字母，告诉系统你需要它从中提供什么。例如，如果我们回到
    `ls`，你可以选择为它添加其他内容，例如 `ls -l`，这告诉你的系统你想让它列出一个更详细的权限列表，比通常包含的要多得多。


    你还可以混合使用，所以你可以将选项和参数结合——事实上，为了运行正确的命令，将两者混合在一起是非常常见的。


    从这里开始，你将获得 Linux 中几个你认为非常有用的命令。这些命令要么是一次很棒的回顾，是你原本就不需要这些信息。如果你不需要这些信息，或者你对自己导航
    Linux 系统的能力有信心，可以随时在此停止并跳到下一章。然而，如果你对自己导航软件的能力不是完全有信心，至少花时间读一下为你提供的详尽命令列表可能是明智之举。


    当然，如果你以后觉得需要某个命令并想确保自己能真正学会如何使用它们，你可以随时回来查看这些信息。


    ## 归档 (Archives)


    本节中的代码专门与系统内的归档文件有关。它们将帮助你直接操作归档，无论是访问、移动还是以其他方式与之交互。


    - `tar cf archive.tar directory`: 将创建一个包含该目录的 tar 文件 (`archive.tar`)。

    - `tar cjf archive.tar.bz2 directory`: 与上述类似，但 tar 文件将使用 `bzip2` 格式进行压缩。

    - `tar czf archive.tar.gz directory`: 第一个命令的另一个变体。它将创建一个 gzip 压缩的 tar 包 (`archive.tar.gz`)。

    - `tar xf archive.tar`: 这是上述命令的反向命令。它将从 `archive.tar` 中提取数据。

    - `tar xjf archive.tar.bz2`: 用于从 `bzip2` 压缩的 tar 中提取数据。

    - `tar xzf archive.tar.gz`: 从 `gzip` 格式压缩的 tar 中提取内容的命令。


    ## 目录导航 (Directory Navigation)


    这些代码将允许你快速方便地在目录移动。当你这样做时，你可以在空间之间移动，而无需手动逐个遍历目录。使用目录导航会更容易。


    - `cd`: 你将被移动到 `HOME` 目录。

    - `cd ..`: 看起来与上述，但有两个点。会将你移动到目录树的上一级。例如，你在目录 1 中的目录 2。使用此命令将移动到目录 1。

    - `cd /etc`: 你将移动到 `/etc` 目录。


    ## 磁盘使用 (Disk Usage)


    这些特定命令与磁盘使用直接相关。它们允许你看到有关当前磁盘状态的所有信息，这在你密切监控系统时是非常必要的。


    - `df -h`: 你可以通过此命令查看磁盘的可用空间。

    - `df -i`: 使用此命令查看（挂载的）文件系统上的已用和可用 inode。

    - `du -ah`: 以人类可读的格式（字节、兆字节、千字节）显示所有对象和目录的大小。

    - `du -sh`: 与上述类似，但将仅显示当前工作目录的信息。

    - `fdisk -l`: 当你需要查看硬硬盘的分区大小和类型时，使用此命令。


    ## 文件和目录命令 (File and Directory Commands)


    本节中的命令将帮助你直接与系统中的文件和目录交互。它们允许你对文件进行各种额外的访问和使用操作，并让你充分利用系统并提高效率。


    - `cp fileA fileB`: 此命令将 `fileA` 复制到 `fileB`。

    - `cp -r source_directory destination`: 该命令将递归复制目录到选定的目标。如果位置已存在，则将复制目录。

    - `ls -al`: 命令将以详细格式列出目录中的所有文件。

    - `mv fileA fileB`: 将 `fileA` 重命名为 `fileB`。如果 `fileB` 是目录，该命令将 `fileA` 移动到该目录。

    - `mkdir directory`: 创建一个目录。

    - `pwd`: 显示你当前所在的目录。

    - `rm file`: 删除文件。最常见的用法是删除文件。

    - `rm -f file`: “强制”删除文件。此命令不会有提示。

    - `rm -r directory`: 删除目录及其内容。

    - `rm -rf directory`: 当你想强制删除目录及其内容时使用此命令。


    ## 文件传输 (File Transfers)


    这些命令作为你在需要时在不同位置之间移动文件的指南，确保你始终能够将文件放在你想要的地方。


    - `rsync -a /home /backups/`: 将 `home` 目录同步到 `/backups/`。

    - `rsync -avz /home server:/backups/`: 在本地和远程之间同步文件或目录。

    - `scp file.txt server:/tmp`: 安全地将文件（例如 `file.txt`）复制到服务器的 `/tmp` 文件夹。

    - `scp -r server:/var/www /tmp`: 递归复制所有目录和文件到当前系统的 `/tmp` 目录。

    - `scp server:/var/www/*.html /tmp`: 将 `.html` 文件从服务器复制到本地的 `/tmp`。


    ## 硬件信息 (Hardware Information)


    这些命令提供有关硬件的各种信息，确保你的硬件运行正常。


    - `badblocks -s /dev/sda`: 将检查磁盘上是否有不可读块（你可以更改 `sda` 为你想检查的驱动器）。

    - `cat /proc/cpuinfo`: 将提供 CPU 信息，例如使用率和其他重要方面。

    - `cat /proc/meminfo`: 将提供内存信息，例如使用率和其他重要方面。

    - `idecode`: 将显示来自 BIOS 的相关信息。

    - `dmesg`: 将显示内核缓冲区的消息。

    - `free -h`: 将显示系统空闲和使用的内存。你可以选择 `-m` 代替 `-h` 以获取 MB 结果。

    - `hdparm -I /dev/sda`: 将提供关于磁盘 `sda` 的所有信息。

    - `lspci -tv`: 显示你的 PCI 设备。


    ## 安装软件包 (Installing Packages)


    这些命令都是关于安装软件包的，无论来自 zip 文件还是其他。


    - `rpm -i package`: 从本地文件安装 `package`。

    - `tar zxvf sourcecode.tar.gz`: 提取 `sourcecode.tar.gz`。

    - `./configure make install`: 与从软件包安装相反。

    - `yum info package`: 显示关于 `package` 的信息。

    - `yum install package`: 安装 `package`。

    - `yum remove package`: 卸载（移除）`package`。

    - `yum search keyword`: 使用搜索 `package`。


    ## 网络 (Networking)


    这些命令与网络直接相关——允许你看到网络上的任何内容。


    - `dig domain`: 显示指定 `domain` 的 DNS 信息。

    - `dig -x IP_ADDRESS`: 使用此命令对指定的 IP 地址进行反向查找。

    - `host eth0`: 显示网络设置。

    - `host domain`: 显示指定 `domain` 的 DNS 地址。

    - `hostname -i`: 此命令用于显示网络地址。

    - `hostname -I`: 与上述命令类似，但将显示本地 IP 地址。

    - `ifconfig -a`: 显示所有网络接口及其 IP 地址。

    - `ifconfig eth0`: 显示 `eth0` 地址及其详情。

    - `netstat -nutlp`: 显示监听的 TCP & UDP 端口及其相关程序。

    - `ping host`: 向 `host` 发送 ICMP 请求。

    - `wget http://domain.com/file`: 下载位于指定的 `file`。

    - `whois domain`: 显示 `domain` 的 `whois` 信息。


    ## 性能监控 (Performance Monitoring)


    这些命令用于有效地监控系统性能，以便你根据需要优化设置。


    - `top`: 比 `htop` 更旧，但用途相同。它允许你交互式地监控进程。

    - `htop`: 允许你交互式监控计算机进程。

    - `iostat`: 允许查看输入/输出统计数据。

    - `lsof`: 允许查看系统上所有打开的文件。

    - `lsof -u username`: 显示由指定用户打开的文件列表。

    - `mpstat`: 查看处理器相关的统计数据。

    - `tail -n 0 /log/messages`: 让你看到系统日志。

    - `tcpdump -i eth0`: 允许查看特定接口（例如 `eth0`）上的所有数据包。

    - `tcpdump -i eth0 port`: 允许你监控 `port` 上的数据。

    - `vmstat 1`: 显示虚拟内存相关的统计数据。


    ## 进程管理 (Process Management)


    这些命令用于进程管理——它们告诉你当前运行的进程在做什么，并允许你在需要时从前台切换到后台。


    - `bg`: 显示后台任务或停止的任务。

    - `fg`: 此命令将最近的后台进程推到前台。

    - `fg n`: 与上述类似，将 `n` 推到前台。

    - `kill pid`: 结束进程 ID 匹配 `pid` 的进程。

    - `killall processname`: 当你想杀死特定名称的所有进程时使用。

    - `program &`: 在后台启动选定的程序。

    - `ps`: 显示当前运行的进程。

    - `ps -ef`: 显示系统中运行的所有进程。

    - `ps -ef | grep processname`: 显示 `processname` 的信息。

    - `：进程查看器。


    ## 搜索 (Search)


    当你需要在系统内寻找内容时，这些命令是你的最佳选择。当你使用搜索命令时，你可以轻松地找到所需的文件并确切知道它们在哪里，以便在其他地方跳转并访问它们。


    - `find /home -size +25M`: 利用此命令在 `/home` 中查找大于 25MB 的文件。

    - `find /home -name ''prefix*''`: 查找 `/home` 中以 `prefix` 开头的文件。

    - `grep pattern file`: 在 `file` 中查找模式。

    - `grep -r pattern directory`: 在 `directory` 中对模式递归搜索。

    - `locate name`: 通过指定的 `name` 查找文件和目录。


    ## SSH 登录 (SSH Login)


    - `ssh host`: 使用本地用户名连接到主机。

    - `ssh user@host`: 以 `user` 身份连接到主机。

    - `ssh -p port user@host`: 使用端口连接到主机。


    ## 系统信息命令 (System Information Commands)


    这些命令用于各种系统信息，了解系统正在做什么以及如何与之交互。这些是 Linux 特有的——它们应该适用于你运行的任何形式的 Linux，包括 Kali Linux。这些命令在
    Kali Linux 上可能用处不大，但在与其他 Linux 系统交互时它们仍然是重要的。


    - `cal`: 将显示当前月的日历。

    - `cat /etc/redhat-release`: 显示你的电脑上当前哪个版本的 Redhat 可供使用。

    - `date`: 将显示你正在使用的系统当前的时间日期。

    - `hostname`: 将告诉你系统主机名。

    - `hostname -I`: 将提供主机的 IP 地址。

    - `last reboot`: 将显示系统上次重启的时间。

    - `uname -a`: 允许显示存储的 Linux 系统信息。

    - `uname -r`: 输出将显示你正在使用的内核版本。

    - `uptime`: 告诉你的系统已运行了多久或加载了多久。

    - `w`: 将显示当前在线的的用户。

    - `whoami`: 将告诉你你当前以什么身份登录系统。


    ## 用户信息与管理命令 (User Information and Management Commands)


    这些命令对于你管理用户信息至关重要。当你掌握了这些控制时，你可以从你的服务器中添加和删除人员。你可以确保某些人拥有特定的权限等等。这些命令在 Kali Linux
    中可能并不需要（因为设计设计为 root 用户而不是其他人），但它们仍然非常值得了解和理解。


    - `groupadd group1`: 在此处创建一个新组 `group1`。你可以将 `group1` 替换为组的任何其他名称。

    - `id`: 显示系统上当前用户的用户 ID 和组 ID。

    - `last`: 显示最后登录的人员。

    - `useradd –c "full name" –m "nickname"`: (隐含的用户创建)

