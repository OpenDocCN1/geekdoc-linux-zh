    These people do not care about the rules or laws, and in fact, have created a
    need for cybersecurity and cybersecurity laws, which will be discussed later within
    this chapter. People hacking into databases and servers has led to a need to make
    sure that these are more secure than ever, leading to the creation of the entire
    field of cybersecurity jobs.


    Hackers are usually classified with titles referring to hat colors. They may be
    black or with, red or green, or even blue. Understanding these hat colors can
    help you get a better grasp on why people may choose to hack, more specifically
    than the four reasons listed above. It may also help you clarify why you have
    a desire to learn to hack via `Kali Linux` yourself.


    ### Black Hats

    When you think of a hacker, it is most likely a black hat—they do so for nefarious
    reasons. These are the ones who are often found breaching servers and exploiting
    weaknesses. They do so to steal and make money. These people, though criminal,
    are also making use of some of the most basic techniques that are learned. Though
    they are quite intelligent, they are motivated by less-than-honorable means—all
    they care about is what they stand to gain.


    ### Grey Hats

    Grey hat hackers are a little more complicated than black hats. They are hacking
    to steal, but usually on less nefarious terms. They may be interested in sharing
    files or breaking into software in order to use it without paying licensing fees.
    They are usually interacting with servers and networks in ways that are exploitative,
    but not necessarily to steal the information within it. Instead, they treat their
    hacking more like a hobby that they enjoy. They typically will not inform sites
    when they have found exploits, but they are likely to offer to fix it for a fee.
    Essentially, these people are more motivated by seeing themselves and proving
    to others that they are important.


    ### Red Hats

    If we were discussing the personality alignment chart right now, red hats would
    be the equivalent of the chaotic good player—they are interested in stopping black
    hat hackers, but they do not want to feel like they are constrained by rules and
    laws. Instead, they will intentionally subvert any authority and go about their
    attempts by their own rules. If using the expression `fighting fire with fire`,
    the red hats will fight a torch with a flamethrower—they aggressively attempt
    to destroy the black hat’s access to the networks upon figuring out who the black
    hat is, with the intent to render the black hat completely incapable of doing
    any more harm. Though these people tend to exist further out from the rest of
    the hacking community, they tend to be some of the most sophisticated, wanting
    to play by their own rules.


    ### Green Hats

    In the hacking community, green hats tare the beginners. They are usually attempting
    to learn how to hack in the first place, and will readily ask for help or seek
    out new knowledge. They are motivated by their desire to learn and develop their
    skills, ambitiously following their dreams without necessarily having any clear
    path that they want to follow. However, because they lack life experience and
    technical knowledge, they also stand to be some of the most dangerous because
    they have not yet learned just how dangerous their actions can be, nor do they
    know enough to reverse any damage that they have done.


    ### Blue Hats

    Blue hats care about revenge. Though they can be malicious, normally, they only
    channel their attempts to hack toward whomever they feel has wronged them. Usually,
    they are relatively new to hacking in general, possibly even script kiddies, but
    when something bad happens, they may decide to put their newfound skills to good
    use and set out to intentionally and maliciously hack a target. They do not want
    to better their skills—they only want to have the technical skills to cause problems.


    ### Script Kiddies

    These people do not get a color, but they are still important to mention. These
    people are usually uninterested in stealing information, but they still find enjoyment
    in taking codes that are already created and injecting them into servers in an
    attempt to cause problems. They are most likely to utilize their skills in techniques
    such as a `DDoS` to flood a website just to annoy people without any real purpose.


    ### Hacktivists

    As briefly touched upon, hacktivists are those motivated by politics. They may
    be lumped into the black hats, though they are usually hacking in an attempt to
    bring to light something of importance toward their cause. They may try to release
    information or records that are supposed to be kept under wraps, or they may decide
    to actually cause issues for a company. They may even attempt to fight terrorist
    groups thanks to their impressive working knowledge. They are trying to lead to
    positive change, even though they may be using negative methods to achieve it.
    They are motivated by their cause above all.


    ### White Hat (Ethical Hacking)

    The last classification of hackers is the white hat—these are known as ethical
    hackers. The ethical white hat hackers typically are hacking in an attempt to
    bolster defenses. These people are intentionally trying to hack into the software
    in order to help a company strengthen its own defenses as exploits and vulnerabilities
    are identified. These people are most often found in cybersecurity careers, trying
    to help keep your sensitive information safe and secure from other people’s attempts
    to steal it. These people are often trained in IT security or computer science
    and then certified by the `EC-Council`. This means that they must complete an
    intensive class and pass an exam, which often involves the training on how to
    handle the most common and current security domains with hundreds of attack techniques
    and technologies. The white hat hacker must also maintain these credentials with
    annual education credits.


    Typically, if you want to become a white hat hacker, you are interested in helping
    people. You want to defend people and you want to do it in a way that is lawful,
    acceptable, and beneficial to everyone involved. You want to eliminate the vulnerabilities
    within the system to protect it from damage rather than attempting to go vigilante
    justice on someone such as the red hat hackers, who may have their hearts in the
    right place but go about things in a way that is just as bad and destructive as
    the black hat hackers.


    ![](OEBPS/rsrc93.jpg)


    ### What is Cybersecurity?

    As touched upon earlier, the invention of servers and the birth of hackers also
    brought with it the creation of cybersecurity. Cybersecurity is crucial for those
    who are intending to rely on servers and databases—without cybersecurity, there
    would be no defense system. Cybersecurity allows for the defense of any internet-connected
    system, meaning it protects your hardware, software, and data from falling victim
    to cyberattacks. When what needs to be protected is on a server or a database
    of any sort, there are two different ways that it must be protected—physically
    from being damaged or taken away, and also digitally in order to protect from
    those who attempt to access it via the network and steal or harm protected information.
    Cybersecurity, then, has one specific goal: protecting IT assets from being attacked
    in order to ensure that the information and data that is housed within those IT
    assets remain protected and secure for the benefit of everyone.


    ![](OEBPS/rsrc9A.jpg)


    Because so much data out there is so quite sensitive and should be protected,
    cybersecurity is absolutely essential. Not only the individual user’s data is
    protected when implementing cybersecurity practices, but the company implementing
    the practices is also protecting itself. Because the likelihood of a massive breach
    drops with the usage of cybersecurity, the likelihood of major negative press
    attention also goes down. Cybersecurity helps lessen the risk of breaches, ransomware
    attacks, and identity theft of individuals, and though cybersecurity can be difficult
    to maintain due to the ever-changing world of technology and IT, maintaining it
    has serious benefits.


    Cybersecurity practices should be used by anyone who is using anything connected
    to the internet—whether you are an employee, an owner of a server, or an individual
    user, there are steps that you can take to avoid falling for the traps of hackers
    or those who seek to exploit your data. It all begins with your password. However,
    there are also many other points where the security of your personal data as a
    user is no longer in your own hands and it is up to the company in charge of your
    data to protect it.


    Unfortunately, cybersecurity runs into one specific problem that is not likely
    to go away any time soon: Because technology is constantly evolving and changing,
    and because networks and data standards change as well, as do hackers, who inevitably
    find more exploits, cybersecurity is an endless job. There will always be another
    exploit to find and patch up. There will always be another attempt to steal data.
    This means that the cybersecurity profession is not likely to go anywhere any
    time soon.


    Typically, these threats are approached by focusing the bulk of the resources
    on protecting the most crucial components to protect against any threats that
    are known to be out there and significant. However, this approach also leaves
    some systems either less defended or undefended or leaving the system open to
    threats that may be deemed to be less known, or those that are less dangerous.


    ### The Elements of Cybersecurity

    Cybersecurity, despite the constant fluctuation and change in the system, also
    has a series of elements that must be maintained. These elements are essentially
    the backbone for cybersecurity—it needs to have each of these to be deemed successful
    and truly protect the data and infrastructure it was tasked with. These elements
    include:

