    # 信息安全：CIA 三元模型


    正如前文提到的，网络安全的元素之一就是信息安全。这一特定元素如此重要，以至于有必要专门开辟一个章节来讨论它。在信息安全领域，有一个被称为`CIA 三元模型`的概念。这个三元模型分别代表`机密性`(confidentiality）、`完整性`(integrity）和`可用性`(availability），它们是网络安全中信息安全方面的使命宣言。


    ![](img/rsrcA5.jpg)


    这三元模型的三个方面每一个都至关重要：受保护的信息必须是机密的、可访问的，并保持完整性。如果不能实现这三个目标，信息安全就没有完全实现。这些是信息安全的基础，并将始终是核心目标。


    ## 机密性

    这是保护信息免受任何形式未经授权访问的能力。当信息具有机密性时，未经授权的人无法访问它。例如，当你去医生诊所时，除非你签署了授权单，否则你的病史是机密的。在医疗环境中，这些信息受到安全措施和行为准则的保护，以防止你的敏感医疗信息广为人知。在信息安全方面，受保护的信息只有授权用户才能访问，未经授权的用户在未能提供正确凭据时会被自动拒绝。例如，考虑一个信用局，它有权访问你的所有个人信息，从社会安全号码到你任何信用额度的账户和账户号码——如果他们的数据不安全，你就面临着身份盗窃的风险。


    ## 完整性

    当信息以准确且一致的方式保存时，就实现了完整性。这意味着其预期的原始的结构得到了维护，且没有对材料进行任何预先授权的更改。虽然用户粗心、使用不当或发生错误时信息可能会改变，但只要信息在存储、传输给请求者以及使用过程中未被修改（除非有人主动且意识地更改它），完整性就能维持。这意味着数据是准确的并保持不变的。


    例如，想象一下你在买新电脑之前检查了银行账户，因为你想确保你的直接存款支票确实已经入账了。如果你的银行应用程序没有正常更新，或者没有反映出你确实收到了工资，你会认为自己无法购买那台笔记本电脑或任何你可能需要的物品。


    ## 可用性

    最后一个目标可用性是指信息在任何时间、任何地点被请求和需要时都能随时可用。因为信息通常是保护的，所以并不是对所有人可用，但必须对那些拥有正确凭据的人可用。这应该尽可能保持——在数据变得至关重要的情况下，如果没有方便的访问，数据保护并不意味着最有用。例如，想象一下你的医疗记录正受到保护。如果你的医生无法根据需要访问你的医疗记录，你就无法获得适当的治疗。


    # 第 2 章：网络简介


    随着互联网的广泛使用，网络也应运而生。虽然可能很容易认为通过互联网发送的信息或请求在发射到卫星后就会立即出现，特别是当你使用`router`进行无线家庭连接时，但实际发生的情况是，你发送的数据通过电线传输，以便将你请求的信息返回给你，且都是以极快的速度完成。这就是网络的构建，无论你是否考虑过它，它都是当今时代万物中的巨大组成部分，你可能每天都会使用网络几次。无论你是检查银行账户，还是使用借记卡或信用卡购买物品，你都在通过网络发送信息。


    ![](img/rsrcAW.jpg)


    ## 什么是网络？

    简单来说，网络是两或多台计算机以某种方式连接，以便共享信息或进行某种方式交互。计算机并不一定通过电线连接——它们可以通过红外光束、无线电波或卫星连接，甚至可以通过电线连接。然而，它们总是以某种方式连接的。


    在某些情况下，网络是计划用例的正确选择。例如，想象你有两台计算机（一台笔记本电脑和一台台式电脑）、一台平板电脑和一部手机。你经常在家里使用这四件物品，并希望附在笔记本电脑上的数据（你主要用它访问和浏览互联网或回复邮件）也能出现在性能更强的台式电脑上（这台电脑可能预留给更密集的程序，如玩视频游戏或编辑大型文件或视频）。此外，为了方便起见，你还希望确保用手机拍摄的照片也能从其他源访问。当你需要这种级别的连接（即可以在任何地方访问所有文件）时，你正在寻找一种网络连接。获取该网络连接后，你可以轻松地共享这些文件。


    当然，网络在其他情况下也至关重要。例如，如果你在学校工作，你可能熟悉计算机实验室。在这些实验室里，学生可以从任何计算机输入登录信息来调出同一个账户。教师也可以提交自己的信息，从该网络上的任何计算机登录，只要他们使用正确的密码和用户名即可。


    ## 网络类型

    网络本身有几种不同的形式。这些网络用于任何涉及信息传输的活动，无论你是打印文档还是发送电子邮件。重要的一点是，在讨论网络时，你主要是在讨论两种不同网络类型之一，尽管根据目的，还有其他几种。最常讨论的两种是`LAN`和`WAN`，`VPN`紧随其后。这三种类型的网络有它们特定的使用场景。本节将向你简要概述
    `LAN`、`WAN` 和 `VPN`，尽管你会发现 `VPN` 在后面的章节中会有更深入的讨论。


    ### LAN

    在现代认知中，最常见的网络是`LAN`。这种网络类型被称为局域网（Local Area Network）——它在小区域或局部区域内将计算机和低电压设备互连在起。这可能是在单栋建筑内，甚至是在几栋需要共享信息的建筑之间。通过使用`router`，`LAN`
    可以与`WAN` 交互，以便快速安全地传输数据。如果你打算在家建立一个个人网络，它很可能是一个`LAN`，特别是如果有多个人共享的话。


    ### WAN

    `WAN`代表广域网（Wide Area Network），它允许计算机从更远的距离进行连接。这意味着计算机即使相隔很远，也能通过某种手段相互连接。这可以在较小规模上实现，例如一个互联网服务提供商连接到几个不同的`LAN`，将它们串联成一个连贯的整体。另一个更广为人知的`WAN`类型是互联网。互联网允许全球范围内的计算机连接。


    ### VPN

    `VPN`代表虚拟专用网络（Virtual Private Network）。它是一个扩展到互联网上的网络，就像一个其他人无法访问的私有网络。这也可以通过点对点连接远程实现，确保数据安全。通常，这是通过加密数据使其无法被易于读取的。


    ## 核心概念


    *   **网络地址 (Network Address)**：网络地址是识别网络节点和主机的方式。就像你的房子地址允许邮件递一样，网络地址允许你向特定点发送内容。

    *   **节点 (Nodes)**：节点是网络内的重新分配点。如果你没有以任何物理方式连接，你就无法连接。`node`可能指的是线路终端。

    *   **主机 (Hosts)**：主机是连接到另一台计算机并负责发送数据的计算机。

    *   **IP 地址 (IP Address)**：IP 地址是识别网络节点和主机的方式。就像你的房子地址允许邮件递一样，你的网络地址允许你向特定点发送内容。


    ## 公共地址 vs 私有地址 (Public vs. Private Address)

    IP 地址主要分为两种形式：公共地址和私有地址。


    *   **公共地址 (Public Address)**：公共地址是由互联网服务提供商 (ISP) 分配的。它是全球范围内唯一的，就像你的家庭地址一样，允许互联网访问你的设备。这种地址在互联网上是公开可见的。

    *   **私有地址 (Private Address)**：私有地址是在局域网内部使用的。


