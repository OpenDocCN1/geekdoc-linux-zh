  trans: '


    这些人并不在乎规则或法律，事实上，他们创造了对网络安全和网络安全法的需求，这将在本章稍后的部分进行讨论。黑客入侵数据库和服务器导致了人们需要确保这些系统比以往任何时候都更加安全，从而催生了整个网络安全职业领域的诞生。


    黑客通常根据帽子颜色的头衔进行分类。他们可能是黑帽、白帽、红帽或绿帽，甚至是蓝帽。理解这些帽子的颜色可以帮助你更好地掌握为什么人们可能选择黑客，这比上面列出的四个原因更具体。它可能还会帮助你弄清为什么自己会有想要通过
    `Kali Linux` 学习黑客技术的欲望。


    ### 黑帽 (Black Hats)

    当你想到黑客时，最可能是指黑帽——他们出于不法目的而行事。这些人是经常被发现入侵服务器并利用漏洞的人。他们这样做是为了偷取和赚钱。这些人虽然是犯罪分子，但也利用了一些他们学到的最基础的技术。尽管他们非常聪明，但他们的动机是不光正的手段——他们关心的只有能获得什么。


    ### 灰帽 (Grey Hats)

    灰帽黑客比黑帽稍微复杂一点。他们黑客是为了偷取，但通常在不那么恶意的条件下。他们可能对分享文件或破解软件感兴趣以便在不支付许可费的情况下使用它。他们通常以剥削性的方式与服务器和网络交互，但并不是为了偷取其中的信息。相反，他们将自己的黑客行为更多地看作他们喜欢的爱好。他们通常不会在发现漏洞时通知网站，但可能会提议付费修复它。从本质上说，这些人的动力更多源于看到自己并向他人证明他们是重要的。


    ### 红帽 (Red Hats)

    如果我们现在正在讨论性格对阵图，那么红帽等同于“混沌善良”的玩家——他们对停止黑帽黑客，但他们不想觉得被规则和法律所束缚。相反，他们会有意地颠覆任何权威，并按照自己的规则进行尝试。如果用“以火攻火”这个表达来说，红帽将用喷火器对付火炬——一旦查出黑帽是谁，他们就会激进地试图破坏黑帽对网络的访问，意在让黑帽完全无法再造成任何伤害。尽管这些人倾向于存在于黑客社区的边缘，但他们往往是最复杂的，想要按照自己的规则行事。


    ### 绿帽 (Green Hats)

    在黑客社区中，绿帽是初学者。他们通常首先尝试学习如何进行黑客，并乐于寻求帮助或寻找新知识。他们的动力源于学习和发展技能的渴望，雄心勃勃地追求梦想，而不一定有任何想要遵循的清晰路径。然而，由于他们缺乏生活经验和技术知识，他们也可能是最危险的人之一，因为他们还没有学会自己的行动会有多危险，他们也没有足够的知识来扭转他们所造成的任何损害。


    ### 蓝帽 (Blue Hats)

    蓝帽关心的是报复。尽管他们可能是恶意的，但通常情况下，他们只将黑客尝试针对他们认为得罪过他们的人。通常，他们对整个黑客领域来说是相对新手，甚至是“脚本小子”（script
    kiddies）”，但当坏事发生时，他们可能会决定将新学到的技能大显用场，并蓄意且恶意地攻击目标。他们并不想提高自己的技能——他们只想拥有制造问题的技术手段。


    ### 脚本小子 (Script Kiddies)

    这些人没有颜色分类，但仍然值得提及。这些人通常对窃取信息不感兴趣，但他们仍然通过获取已经创建的代码并将其注入服务器以试图制造问题来找到乐趣。他们最可能利用他们的技能通过如
    `DDoS` 等技术来淹没网站，仅仅是为了骚扰人们而没有任何真实目的。


    ### 黑客主义者 (Hacktivists)

    正如简要提到的，黑客主义者是受政治动机驱动的人。他们可能被归类为黑帽，尽管他们通常进行黑客是为了揭露对他们的事业具有重要意义的事情。他们可能会尝试发布本应被保密的信息或记录，或者他们可能会决定为一家公司制造麻烦。得益于他们令人印象的工作知识，他们甚至尝试对抗恐怖组织。他们正试图带来积极的改变，尽管他们可能在使用负面方法来实现。他们的动力源高于一切。


    ### 白帽 / 伦理黑客 (White Hat / Ethical Hacking)

    黑客的最后一个分类是白帽——这些被称为伦理黑客。伦理白帽黑客通常进行黑客是为了加强防御。这些人刻意尝试入侵软件，以便在识别出漏洞和脆弱性时帮助公司加强自身的防御。这些人通常出现在网络安全职业中，努力帮助保护你的敏感信息，免受他人窃取的尝试。这些人通常接受过
    IT 安全或计算机科学的培训，并获得 `EC-Council` 的认证。这意味着他们必须完成一门高强度课程并并通过考试，考试通常涉及如何使用数百种攻击技术和技术处理最常见和当前的安全领域的培训。白帽黑客还必须通过年度教育学分来维护这些资质。


    通常，如果你想成为一名白帽黑客，你对帮助他人感兴趣。你想保护人们，并且你希望以一种合法的、可接受且对所有参与者都有利的方式这样做。你想消除系统内部的漏洞以使其免受损害，而不是像红帽黑客那样对某人进行私刑——红帽黑客的心意可能是正确的，但他们的做事方式与黑帽黑客一样糟糕且具有破坏性。


    ![](img/rsrc93.jpg)


    ### 什么是网络安全？

    正如之前提到的，服务器的发明和黑客的诞生也带来了网络安全的创。。对于那些打算依赖服务器和数据库的人来说，网络安全至关重要——没有网络安全，就没有防御系统。网络安全允许对任何连接互联网的系统进行防御，这意味着它保护你的硬件、软件和数据免受网络攻击的受害。当需要保护的内容位于任何类型的服务器或数据库时，有两种不同的方式必须对其进行保护——物理上防止被损坏或被夺走，以及在数字上防止那些试图通过网络访问并窃取或损害受保护信息的人。因此，网络安全有一个特定的目标：保护
    IT 资产免受攻击，以确保存储在这些 IT 资产中的信息和数据为了大家的利益保持保护和安全。


    ![](img/rsrc9A.jpg)


    由于那里有许多数据非常敏感并且应该受到保护，网络安全是绝对的。在实施网络安全实践时，不仅个人用户的数据得到了保护，实施这些措施的公司也在保护自己。因为使用网络安全降低了大规模泄露的概率，负面媒体的关注也会减少。网络安全有助于减少泄露、勒索攻击和身份盗窃的风险，尽管由于技术和领域的不断变化，维护它可能困难，但维护它具有巨大的益处。


    网络安全实践应该被任何连接互联网的人使用——无论你是员工、服务器所有者还是个人用户，你都可以采取一些措施来避免掉入黑客或试图利用你数据者的陷阱。这一切都从你的密码开始。然而，还有许多其他点，你作为用户的个人安全不再掌握在自己手中，而是由负责你的公司来保护。


    不幸的是，网络安全遇到了一个短期内可能无法解决的问题：由于技术在不断演变变化，网络和数据标准也发生了变化，黑客也是如此，他们不可避免地发现了更多漏洞，网络安全是一项永恒的工作。总会有新的漏洞需要发现和修复。总会有新的尝试窃取数据。这意味着网络安全行业在短期内可能没有去处。


    通常，处理这些威胁的方法是集中大部分资源保护最关键组件，以防御任何已知的重大威胁。然而，这种方法也导致某些系统防御薄弱或无防御，使系统对那些被认为不已知或不那么危险的威胁开放。


    ### 网络安全的要素

    尽管系统不断波动变化，网络安全也有一系列必须维护的元素。这些元素本质上是网络安全的支柱——它需要拥有每一个元素才能被认为是成功的并真正保护其任务的数据和基础设施。这些元素包括：


    '
- fmt: '

    - **Application security**: This lessens the likelihood that any sort of unauthorized
    code will be able to find a vulnerability

    - **Business continuity planning**: This helps maintain or resume any critical
    functions if something catastrophic happens

    - **End-user education**: Teaches the employees or users how to act in order to
    protect the information

    - **Information security**: Protects information

    - **Network security**: Identifies, prevents, and reacts to any threats with security
    policies, tools, and IT.

    - **Operational security**: Classifies information and protects it

