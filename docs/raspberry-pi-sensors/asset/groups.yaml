    \ to create an infinite loop. The semicolon (;) is the notation used in scripting\
    \ to write commands in a single line. The do start the while loop, and we can\
    \ start writing our script to toggle the LEDs inside it. The number that follows\
    \ sleep command provides you with a delay in seconds. Press Ctrl+X then Y to save\
    \ the changes to your script. In the command line, execute our code which can\
    \ be done using chmod +x ledblink.sh. This command changes the mode and gives\
    \ the permission to the user to execute the program. You might remember that shell\
    \ script does not require compilation, so just type ./ledblink.sh, and congratulations!\
    \ You've toggled the LED with the RasPi Great!\n\n## LED blink and Python\n\n\
    Python's script is somewhat lengthy, but it is still easy to implement the GPIO\
    \ toggling. We will create the same functionality that we created in a shell script,\
    \ but this time for 10 iterations instead of an infinite loop. Open a text editor,\
    \ type sudo nano ledblink.py, and then begin writing the following code. Just\
    \ observe the code and enjoy the blinking:\n\n```python\nimport RPi.GPIO as GPIO\n\
    from time import sleep\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(17, GPIO.OUT)\nprint(\"\
    All Set in Python! Let's Blink\")\nfor i in range(1,10):\n  GPIO.output(17, GPIO.HIGH)\n\
    \  sleep(1)\n  GPIO.output(17, GPIO.LOW)\n  sleep(0.5)\nGPIO.cleanup()\n```\n\n\
    Compile and execute the code by typing python ledblink.py in the command line.\
    \ Use sudo python ledblink.py if it needs the superuser privileges. Importing\
    \ the RPi.GPIO library is very essential, as it imports the GPIO functionality\
    \ for the Python scripts and tells Python that the GPIO functions used are for\
    \ controlling the pins of RasPi. There is a library named time in Python that\
    \ provides delay, clock, and other time-related functions; thus we only import\
    \ sleep() from time library as needs. We need to set the mode in which we are\
    \ working. We are following BCM names, so we need to tell the code whatever the\
    \ pin number we mention in the functions is in the BCM mode. The next function\
    \ is used to set the direction of the pin, whether it will be used to take the\
    \ input or output. It sets pin 11 (BCM GPIO 17, refer to GPIO table) to the output\
    \ pin where our LED is connected. The for loop sets the range from 1 to 10. Unlike\
    \ an infinite loop, it will run 10 times and the control will come out of the\
    \ loop. Inside a for loop, the code is self-explanatory; it toggles the LED connected\
    \ to pin 11 of the RasPi part. In the end, the GPIO.cleanup() function will reset\
    \ the state of the GPIO on exit. You can see there can be a big difference if\
    \ you change the indentation. For example, change the indentation of sleep (0.5)\
    \ in line with GPIO.cleanup().\n\n## Let's blink the LED with C code\n\nFinally\
    \ we will write the same code in the C language. It's pretty impressive that the\
    \ libraries available for the RasPi and C are really simple to use. We have already\
    \ installed the wiringPi library to access the GPIO of the RasPi. Let's try the\
    \ code now. Edit the ledblink.c file in a nano text editor by typing nano edblink.c:\n\
    \n```c\n#include<stdio.h>\n#include<wiringPi.h>\n#include <time.h>\nvoid main()\n\
    {\n    wiringPiSetup();\n    pinMode(17,OUTPUT);\n    printf(\"\\nI am using wiringPi,\
    \ Blink Blink!\\n\");\n    printf(\"\\npress C to exit)\\n\");\n    for();\n}\n\
    ```\n"
