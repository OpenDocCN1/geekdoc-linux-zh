  - '[PAGE 40]


    Meeting Your Buddy – the Raspberry Pi


    # # A crash course on Linux


    Many authors and books will teach you the concepts of the Linux operating system,
    so I will just quickly introduce Linux here. You can refer to Beginning Linux
    Programming 4th Edition, Wrox Publishing, by Neil Matthew and Richard Stones.
    For shell scripting, you can refer to Linux Shell Scripting Cookbook Second Edition,
    Packt Publishing, written by Shantanu Tushar and Sarah Lakhman. This operating
    system is mostly known for its user-friendliness to beginners! When users start
    Linux, they often wonder, "Why is this operating system widely used and famous?
    Linux is the biggest open source platform for hobbyists like us, and it allows
    us to modify the kernel of the operating system the we want. Some advantages of
    using Linux include (and are certainly not restricted to) being free, stable,
    quick, and dependable under the General Public License (GPL).


    You can build your own personalized operating system using Linux distributions,
    for example, Raspbian developed on the Debian flavor of Linux. We need our customized
    operating systems if we develop our personalized hardware, we know how it should
    be programmed and we develop the drivers according to our needs on top of the
    Linux kernel. We will now go through the most powerful tool of any Linux system
    – the terminal.


    # # The terminal and shell


    The most important tool of the Linux operating system is the terminal – the CLI
    of Linux. Windows users may have already come across Command Prompt (as we used
    in the previous section) and Mac OS users may be familiar with the terminal. Once
    you learn the commands of the terminal, the Linux world opens up to you. Using
    the terminal, you can easily interact with the operating system and its kernel,
    which indirectly connects you and enables to access access hardware resources.
    Shell is a command language translator (or interpreter) that executes command
    input from user. Shell uses the Linux kernel to execute commands.


    In the terminal, you can use many shells. One of the most common shells is called
    Bourne-Again Shell (Bash). Unless you get into the complicated programming of
    shell, which is also known as shell scripting, you may not feel the strengths
    and weaknesses of a particular shell. Most of the simplest commands remain the
    same for different shells. Shell scripting is useful when you want to do postprocessing
    on your files in the same or different directories, modify the usual commands
    of Linux by your own way, or just print or execute a program. Shell scripts allow
    several commands that would otherwise be entered manually in a command-line interface
    to be executed automatically, without waiting for a user to trigger each stage
    of the sequence. This allows us to create the preconfigured file to execute the
    C programs for our sensors in the upcoming projects, which can really save our
    time while creating the projects.'
- md: '

    In the RasPi, LXTerminal is the tool that is ultimately the terminal for RasPi.
    If you are using PuTTY CLI instead of the desktop, PuTTY CLI is the terminal,
    ultimately!


    ## Useful and frequently used Linux commands


    Well, this can be a very long list if we introduce and explain all the commands
    of Linux. Even a separate book twice this size is not enough to completely illustrate
    all the functionalities of the commands. We will see the commands that are essential
    and will be used throughout this book. This list can be used as a reference, and
    it''s necessary to understand these commands:


    - * pi@raspberry:~$: It''s now time to introduce the most commonly seen command.
    It welcomes you on the first login and every subsequent login to your RasPi. This
    shows your username and the hostname of the RasPi. Here, your username is pi and
    the hostname is raspberry.


    - *sudo: This is an abbreviation of SuperUser DO. This command gives you all privileges
    of the superuser (the most powerful user) of Linux. It is used in concatenation
    with other commands such as nano, sudo, chmod, and so on. By writing the sudo
    command, you can enter superuser mode, in which you execute, delete, and create
    any kind of files in any folders. This really gives you superpowers in Linux!


    > The sudo command can be dangerous if not used properly. It can be used to hack
    into the Linux systems, or this superpower can allow you to delete the entire
    kernel of Linux; keep in mind next time, the PC won''t boot!


    - *man: This is the command that shows the manual of the Linux commands and other
    function definitions. Type man sudo and you will get all the details related to
    the sudo command.


    - *pwd: This is an abbreviation of the working directory. This shows you the current
    directory you are working in. Type pwd and press the Enter key. This should display
    something /home/pi.


    - *ls: This is a command used to list the files or search for some files contained
    in a particular directory. Just typing ls and pressing the Enter key will give
    a list of all files contained in the system. The options with ls are -a, -l, and
    so on. Just type man ls followed by the Enter key to see the different options
    available with it.


    ## Meeting Your Buddy – the Raspberry Pi


    - - cd: This command stands for change directory. Just give a path followed by
    the cd command and you will be taken to that directory. For example, cd /home/pi/python_games
    moves you directly to the python_games folder, while cd .. takes one step out
    of a particular directory.


    - - apt-get: This is the package manager for any Debian-based Linux distribution.
    It allows you to install and manage new packages on your RasPi. Once you have
    an Internet connection on the RasPi, type sudo apt-get <package-name>. It will
    download the package and install the same package. To remove a package, use sudo
    apt-get remove <package-name>. To update and upgrade the operating system, you
    can use sudo apt-get update and sudo apt-get upgrade respectively.


    - - cp: This is used to copy the file from one directory to another, for example,
    cp /home/pi/python_games/gemi.png /home/pi/gemi.png will copy the gemi.png file
    to the /home/pi/ folder from /home/pi/python_games. You can use the mv command
    instead of cp to move the file from one folder to another.


    - - rm: This removes the specified file (or directory when rmdir is used). For
    example, rm gemi.png.


    > There is an important warning: files deleted in this way are generally not restorable.


    - - cat: This lists the content of the file; for example, cat example.sh will
    display the content of the example.sh file.


    - - mkdir: This creates the new directory in the present working directory; for
    example, mkdir packt will create a directory packt in the present working directory.
    Just use the ls command to check whether it has been created or not checking the
    list.


    - - startx: This command provides RasPi with the user interface for running a
    window session.


    - - sudo shutdown -h: This leads to terminate all the processes on the RasPi,
    whereas sudo halt stops the CPU from running mode and halts the OS. The sudo poweroff
    command safely turns off the RasPi module.


    These are the most frequently used commands for the RasPi. If more are needed
    in your projects, you will be introduced to them where relevant.


    Let''s create our first shell file:


    Notice this is a very short introduction to shell, and now you will learn the
    useful commands that will be used throughout the book to create the projects.


    ## Installing useful libraries


    I compare this section to an ice cream with chocolate sauce (yummy! ssrupp!).
    If you have a vanilla ice cream in your hand, you can enjoy the ice cream, but
    once you pour chocolate sauce on that, it becomes more delicious, doesn''t it?
    Adding installing libraries in the RasPi is the same scenario. The RasPi is amazing
    with the added libraries, which can give you the functionalities you want, whether
    it is on the GPIO or on the camera port. A library is a particular set of functions
    that gives you ease while writing the programs.


    Step by step, we will install the useful libraries. To install the libraries,
    all you need is an Internet connection on the RasPi via PuTTY, as explained in
    previous sections.


    ## Meeting Your Buddy – the Raspberry Pi


    > Before installing any libraries, verify that your operating system has the latest
    update. Always check for upgrades and updates by entering these commands:

    ```bash

    sudo apt-get update

    sudo apt-get update

    ```


    Here, we update the RasPi to provide information on the latest package versions
    and dependencies. All the repositories will get information about their latest
    packages and synchronize. In the next step, upgrade will fetch new versions of
    packages to the list provided in the update list. This process will take time,
    depending on the size of the update and the quality of the Internet connection.


    ## git-core


    git is a code management system used for collaborative work among programmers
    across the world, and it makes changing trace in the code easy. You will find
    many libraries and projects on it. If you know the source repository, you can
    directly get the library using git-core. Install git-core using this command:

    ```bash

    sudo apt-get install git-core

    ```


    ## wiringPi


    The wiringPi library is created by Gordon, written in C, and provides you with
    support to extend your C programs to control the GPIOs. You can easily download
    (which will need the Internet connection shared on the RasPi) this library from
    Gordon''s code profile by typing the following command:

    ```bash

    git clone git://digrogon.net/wiringPi

    ```


    The RasPi then downloads the libraries and creates a folder in the root directory.
    Use the cd wiringPi command to change the directory and to the wiringPi directory.
    The next command to be entered is git pull origin, which fetches the latest version,
    and then we are ready to build the script using the ./build command.


    Now, once the build process is done, we are ready to use the wiringPi library
    in any C program we write in the future. To check whether this particular library
    is working perfectly, enter these commands: gpio -v and gpio readall. This will
    convince you that you have installed correctly. In Chapter 2, Meeting the World
    of Electronics, you will learn how to use wiringPi in shell script and the C language.


    ## python-gpio


    the latest distribution of RasPi comes with python-gpio installed, but this library
    will be necessary for those who have an old distribution.

    The python-gpio allows you to easily access and control the GPIO pins while running
    the Python script. This library can be downloaded from the Python organization''s
    website, but we will install it using LXTerminal or PuTTY.

    Let''s proceed by downloading the .tar file:

    ```bash

    wget https://pypi.org/packages/source/R/RPi.GPIO/RPI.GPIO-0.5.7.tar.gz

    ```


    If you''re not aware, let me tell you TAR file is a kind of bundled file used
    to make the download compact and easy. We need to extract the downloaded file
    in a directory:

    ```bash

    tar -xf RPi.GPIO-0.5.7.tar.gz

    ```


    Let''s rename this folder for ease of use; use this command:

    ```bash

    mv RPi.GPIO-0.5.7 python_gpio

    ```


    Move to the python-gpio directory to install the library using this command:

    ```bash

    cd python_gpio

    ```


    > While writing a command, you can use the Tab key, which provides an autocompletion
    feature. For example, while writing the cd pyth command, press Tab. This will
    autocomplete the command, which will save the time spent on long filenames. Pressing
    the Tab key twice will give you a list of the available commands or filenames.


    Now, we will install this library:

    ```bash

    sudo setup.py install

    ```


    There is a possibility that it gives you a response that the library is already
    installed with the latest version. After this process, if you want to remove the
    downloaded file, you can use the rm command and remove it. Finally, one more library
    that provides support for the Python Serial Peripheral Interface (SPI) protocol
    on GPIO is spdev. You can install it using the following command. You can refer
    to the Serial Peripheral Interface section of Chapter 2, Meeting the World of
    Electronics, to learn more on SPI protocol. We will be using the SPI protocol
    in Chapter 6, Uploading Data Online – Sheets, Mobile, and E-mails, when we build
    the sensor station project to send data to web pages.

    ```bash

    sudo pip install spdev

    ```

    '
  mdcn: '

    在 RasPi 中，LXTerminal 是 RasPi 最终的终端工具。如果你使用的是 PuTTY CLI 而不是桌面版，那么 PuTTY CLI 终极就是终端！


    ## 有用且频繁使用的 Linux 命令


    这个，如果我们介绍并解释所有的 Linux 命令，这将会是一份非常长的列表。即使是一本比这书厚一倍大小的书，也不足以完全阐述所有命令的功能。我们将看到在书中至关重要并将全程使用的命令。此列表可以作为参考，而且理解这些命令是必要的：


    - *pi@raspberry:~$:* 现在是时候介绍最常见的命令了。它会在你第一次登录以及之后每次登录 RasPi 时欢迎你。它显示了你的用户名和 RasPi
    的主机名。在这里，你的用户名是 pi，主机名是 raspberry。


    - *sudo*：这是 SuperUser DO 的缩写。此命令赋予你 Linux 超级用户（最强大的用户）的所有权限。它通常与 nano、sudo、chmod
    等其他命令结合使用。通过输入 sudo 命令，你可以进入超级用户模式，在该模式下，你可以在任何文件夹中执行、删除和创建任何类型的文件。这真的让你在 Linux
    中拥有了超能力！


    > 如果使用不当，sudo 命令可能是危险的。它可以被用于黑入 Linux 系统，或者这种超能力可能允许你删除整个 Linux 内核；记住，下次 PC 将无法启动！


    - *man*：此命令用于显示 Linux 命令和其他函数定义的说明书（manual）。输入 `man sudo`，你将获得与 sudo 命令相关的所有细节。


    - *pwd*：这是工作目录（working directory）的缩写。它显示你当前正在工作的目录。输入 `pwd` 并按回车键。这应该显示类似 /home/pi
    的内容。


    - *ls*：这是一个用于列出文件或搜索特定目录下包含某些文件的命令。只需输入 ls 并按回车键，即可列出系统中包含的所有文件。ls 的选项有 -a、-l
    等。只需输入 `man ls` 后按回车键，即可查看其不同的可用选项。


    ## 结识你的伙伴 – 树莓派


    - - cd：此命令代表更改目录（change directory）。只需在 cd 命令后给出一个路径，你就会进入该目录。例如，`cd /home/pi/python_games`
    会直接带你进入 python_games 文件夹，而 `cd ..` 则会从特定目录向外移动一级。


    - - apt-get：任何基于 Debian 的 Linux 发行版的包管理器。它允许你在 RasPi 上安装和管理新包。一旦你的 RasPi 连接了网络，输入
    `sudo apt-get <package-name>`。它将下载并安装该包。要移除一个包，使用 `sudo apt-get remove <package-name>`。要更新和升级操作系统，你可以分别使用
    `sudo apt-get update` 和 `sudo apt-get upgrade`。


    - - cp：用于将文件从一个目录复制到另一个目录，例如，`cp /home/pi/python_games/gemi.png /home/pi/gemi.png`
    将 gemi.png 文件从 /home/pi/python_games 复制到 /home/pi/ 文件夹。你可以使用 `mv` 命令代替 `cp` 将文件从一个文件夹移动到另一个文件夹。


    - - rm：它用于删除指定的文件（当使用 rmdir 时为删除目录）。例如，`rm gemi.png`。


    > 有一个重要的警告：通过这种方式删除的文件通常无法恢复。


    - - cat：它列出文件的内容；例如，`cat example.sh` 将显示 example.sh 文件的内容。


    - - mkdir：它在当前工作目录下创建新目录；例如，`mkdir packt` 会在当前工作目录下创建一个 packt 目录。只需使用 ls 命令通过列表检查它是否已创建。


    - - startx：此命令为 RasPi 提供了运行窗口会话的用户界面。


    - - sudo shutdown -h：这将终止 RasPi 上的所有进程，而 `sudo halt` 会停止 CPU 处于运行模式并停止操作系统。`sudo
    poweroff` 命令会安全地关闭 RasPi 模块。


    这些是 RasPi 最常用的命令。如果你的项目需要更多命令，我们将在相关之处向你介绍它们。


    让我们创建第一个 shell 文件：


    请注意，这是对 shell 的非常简短的介绍，现在你将学习贯穿全书用于创建项目的有用命令。


    ## 安装实用库


    我将这一节比作淋了巧克力酱的冰淇淋（美味！吸溜！）。如果你手里拿着一个香草冰淇淋，你可以享受这个冰淇淋，但一旦在上面淋上巧克力酱，它就会变得更美味，不是吗？在
    RasPi 上安装库也是同样的场景。增加了库的 RasPi 非常惊人，它可以提供你想要的功能，无论是在 GPIO 上还是摄像头接口上。库是一组特定的函数，让你在编写程序时更加轻松。


    我们将逐步安装这些实用库。要安装这些库，你只需要通过 PuTTY 在 RasPi 上连接网络，如前几节所述。


    ## 结识你的伙伴 – 树莓派


    > 在安装任何库之前，请确认你的操作系统已获得最新更新。始终通过输入以下命令检查升级和更新：

    ```bash

    sudo apt-get update

    sudo apt-get update

    ```


    在这里，我们更新 RasPi 以提供有关最新包版本和依赖项的信息。所有存储库将获得它们的信息。

    '
