  - "[PAGE 177]\n\n# Chapter 7\n\nFor example, suppose you are working in a folder\
    \ that contains the code files project0.cpp and project1.c. If you execute the\
    \ shell file being in the same folder, it will start compiling all of the available\
    \ C by generating the executable files project0 and project1, which can be later\
    \ run by ./project0. Let's experiment with the shell code. Go to the folder where\
    \ you wrote the motion detection code (motion.cpp), open nano editor with the\
    \ build.sh filename, and type this code:\n\n```\n#!/bin/sh\nif [ $# -gt 0 ]; then\n\
    \  base=`basename $1 .`\n  echo \"compiling $base\"\n  gcc -ggdb `pkg-config opencv\
    \ --cflags --libs` $base.c -o $base\nelse\n  for i in *.c; do\n    echo \"compiling\
    \ $i\"\n    gcc -ggdb `pkg-config --cflags opencv` -o `basename $i .c`\n    $i-lwiringPi\
    \ `pkg-config --libs opencv`\n  done\n  for i in *.cpp; do\n    echo \"compiling\
    \ $i\"\n    g++ -ggdb `pkg-config --cflags opencv` -o `basename $i .cpp`\n   \
    \ $i-lwiringPi `pkg-config --libs opencv`\n  done\nfi\n```\n\nSave this shell\
    \ file by exiting nano editor. The shell code written here is derived from the\
    \ OpenCV samples folder and edited according to our needs. The wiringPi library\
    \ is mentioned in bold characters. The if-else loop is classified as a one-file\
    \ and multiple-files compilation. This code will take each C and C++ file one\
    \ by one and save the executable. Now give access to execute this file:\n\n```\n\
    chmod +x build.sh\n```\n\nExecute the shell code by typing ./build.sh. It will\
    \ start compiling all the .cpp and .c files in the folder. Other files in the\
    \ folder will remain unaffected. The executable output file will be saved as motion.\
    \ Execute the file by typing ./motion to see the output. Remember to execute this\
    \ file by opening LxTerminal in the Xming server to see the window.\n\n[ 155 ]"
  - '[PAGE 178]


    # Creating an Image Sensor Using a Camera and OpenCV


    # Amazing projects for you


    With some knowledge on OpenCV, you can go ahead and read the manuals of OpenCV
    to gain more knowledge on how functions and arguments are passed. Initially, it
    can be somewhat difficult for you to start OpenCV using image pointers. There
    is an immense amount of help available at http://www.opencv.org. While taking
    help from the Internet and the code available from the official website, check
    for the OpenCV language (platform) first. It has been observed that when C code
    merges with C++ code, it doesn''t work even after banging your head for hours.
    It is advised to keep The OpenCV Reference Manual (Current Release 2.4.9.0) with
    you while coding OpenCV.


    It would be quite a good challenge for you to develop a project that fulfils the
    following requirements:


    +   - Capture lives using the interfaced camera, split the image into segments
    of the same size (say, four vertical segments), and compare it with the reference
    image. There will be a clear difference in one of the segments where most of the
    motion is observed. Detect that area in the image and trigger the GPIO accordingly.


    +   - Further, control a servomotor or stepper motor to rotate the camera according
    to the movement in front of it. Finally, you will be able to develop a camera
    that follows wherever you move.


    +   - Another application of this is to save energy. Split the image into coordinative
    segments and detect where people are sitting in the room by setting the camera
    at the heightened position. Turn off the light where zero motion is detected.
    Interesting, isn''t it?


    +   - You can develop OpenCV code to track a particular colored object. The code
    can draw the lines on the screen while this colored object is moved in front of
    a camera. For example, when we show and move a red ball in front of the camera
    lens, it starts drawing lines as per the red color''s movements detected by camera.


    +   - Create a gesture/pattern-recognizable computer module that takes commands
    as the color you wear on your fingers.


    +   - Build a ball-following robot that can follow a ball of a particular color
    and detect the near and far effects of the ball.'
