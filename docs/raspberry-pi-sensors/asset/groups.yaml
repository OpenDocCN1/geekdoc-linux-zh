  - '[PAGE 164]


    # Creating an Image Sensor Using a Camera and OpenCV


    Edit start_motion_daemon=yes. Save and exit the file. After all of these settings
    are completed, create a folder and run the following command to start the motion
    service:


    ```

    mkdir motion-camera

    cd motion-camera

    sudo service motion start

    ```


    Now, on the PC desktop, open a web browser and type the IP address and port number
    as saved in the motion configuration (motion.conf) file:


    ```

    http://169.254.0.2:8081

    ```


    You will be able to see live streaming from the RasPi camera. Congratulations!
    We have made our open network camera. This camera can be accessed from any computer
    in the network. All you have to do is connect the camera in your backyard through
    an Ethernet cable. You can directly access it from your living room. You can even
    try it from VLC media player. In VLC, go to Media and then go to Open Network
    Stream. Enter the same IP address, followed by the port address.


    # Porting OpenCV


    Porting OpenCV on RasPi is the longest task compared to installing all other libraries.
    Installing the suitable and companion libraries is necessary for effective running
    of the image processing algorithms. It has been observed in the community that
    not many have succeeded in porting the OpenCV properly. We will go through a step-by-step
    guide that will give you an up-and-running OpenCV at the first time. While installing
    some of the library, the order of the installation doesn''t matter, but it is
    suggested that the flow given here will give you the exact results you are looking
    for.


    A quick checklist is as follows:


    +   - An Internet connection shared with RasPi through a Wi-Fi adapter or a PC.

    - Use PuTTY to log in to the RasPi using an Ethernet connection to a PC.

    - Enough space (up to 4 GB) on the RasPi SD card. Use the df -h command to check
    out the free space on the SD Card.

    - Interface the camera when needed. A USB camera needs current to operate. Connect
    a 2A adapter to the RasPi if needed.


    Let''s start! Log in to your RasPi on the SSH connection over the Ethernet. From
    now on, we will be using PuTTY to execute all of these commands in the RasPi unless
    otherwise specified.'
  - '[PAGE 165]


    > This installation may take up to 12 hours to build the OpenCV on Raspian. At
    any stage, resumption of installation after interruption can be done without reinstalling
    the previous libraries.


    Ensure you have enabled SSH communication on the RasPi. You can enable it using
    this command, stating the IP address of your RasPi:


    ```

    ssh -X pi@169.254.0.2

    ```


    Type yes and then press Enter, and SSH will be enabled on your Pi. You can continue
    in the same session. You can use this command to enable SSH communication over
    the Ethernet:


    ```

    sudo raspi-config

    ```


    Then enter Advanced Options and find the option mentioned as SSH. Press Enter
    and enable the option. In the same menu, there is an option called Camera; this
    should be enabled as well. Press Esc to exit the configuration menu.


    Now it is time to update the RasPi to provide information on the latest packages,
    versions, and dependencies. All the repositories will get information about their
    latest packages and information for resynchronizing:


    ```

    sudo apt-get update

    ```


    Next, upgrade will fetch new versions of packages according to the list provided
    in the update list:


    ```

    sudo apt-get upgrade

    ```


    To get packages, you can install the synaptic package manager. It allows you to
    install packages using the GUI instead of entering the sudo apt-get command. It
    will be handy to install the missing packages once OpenCV is installed:


    ```

    sudo apt-get -y install synaptic

    ```


    Note that we will still be using the command-line interface to install the packages,
    as it is the better to install entire libraries. You can use synaptic but prefer
    installing small packages and managing repositories. It will be better to manage
    the installation in the command-Line interface.'
  - '[PAGE 166]


    # Creating an Image Sensor Using a Camera and OpenCV


    We have to install the scientific and mathematical libraries of Python to process
    the images and to get the additional functionalities. Numpy Scipy are the mathematical
    and scientific libraries used to calculate n-dimensional arrays, Fourier transforms,
    random numbers, and linear algebra calculations. Nose is the library used to test
    Python code in an easier and faster way. Next, Pandas is a high-performance data
    analysis tool for Python. Role of OpenCV is to provide functionalities in an interactive
    way to see the results of the code and commands, with interactive visualization
    on the GUI. Matplotlib is used to plot two-dimensional graphs, which provides
    good-quality graph images. These can be used in studies and publications. All
    the libraries can be built in a single line and can be installed in one go. Finally,
    SymPy provides the functionality of symbolic mathematics. Its purpose is to provide
    functions in the computer algebra system, keeping the Python code as simple as
    possible, and extensible. All of these libraries can be used while coding with
    OpenCV using the Python library. Enter this in a single line to execute in the
    command-line interface:


    sudo apt-get -y install python-numpy python-scipy python-nose python-pandas python-matplotlib
    ipython-notebook python-sympy


    GtkExt needs to be installed to provide support for OpenGL rendering. OpenGL is
    an API that is typically used by GPUs to handle 3D and 2D graphics. We will be
    enabling it while building OpenCV. Use the following command to install GtkExt:


    sudo apt-get -y install libgtk3-dev


    To build the development environment in the RasPi and make all the essential libraries
    up to date and compliant in the Linux OS, use CMake to configure the packages
    and to manage the build process. Enter the following command:


    sudo apt-get -y install build-essential cmake pkg-config


    Qt is widely used as a cross-platform application framework to develop applications,
    which can be developed and run on various hardware and software platforms with
    minimal or no changes in the code base, keeping the native application as it is.
    Enter this in a single line to execute and install the necessary packages of Qt
    in the command-line interface:


    sudo apt-get -y install qtcreator qt4-dev-tools libqt4-dev libqt4-core libqt4-gui
    v4l-utils


    If you are enthusiastic enough to code in Java, you should install the Ant library.
    OpenCV has built Java support. To enable the functionalities of compiling, building
    the .jar files, and utilizing it efficiently, type the following command:


    sudo apt-get -y install default-jdk ant'
  - '[PAGE 167]


    # Chapter 7


    We are now ready with all the necessary packages to start downloading the OpenCV
    library. You can download the latest OpenCV library 3.0.0, which is in beta version
    at the time of writing this book. I prefer to install the latest version (2.4.10).
    Later on, we can upgrade OpenCV. Enter this command to download the library:


    ```

    wget http://sourceforge.net/projects/opencvlibrary/files/opencv-unix/2.4.10/opencv-2.4.10.zip

    ```


    It may take a while to download a file from the official source. Once it is downloaded
    successfully, you can unzip the file using the following command:


    ```

    unzip opencv-2.4.10.zip

    ```


    Alternatively, if the file downloaded is the tarball, then execute this command:


    ```

    tar xzvf opencv-2.4.10.tar.gz

    ```


    Executing this command will show you the entire list of files transferred to the
    folder. After unzipping the file, they are extracted to the opencv-2.4.10 folder.
    Create a build folder at the same location. Enter these commands sequentially:


    ```

    cd opencv-2.4.10

    mkdir build

    cd build

    ```


    Next, we are going to use the CMake command to build the configuration type for
    release. Look for the output of CMake and check which packages are installed and
    which are not. You can install those packages manually. By looking at the CMake
    output, you fill find YES and TRUE in front of all the libraries and packages.
    If not, do not panic! Just list those names and install these dependencies using
    the synaptic package manager. It is very important to put . at the end of the
    command to successfully create a build file:


    ```

    cmake -D BUILD_TYPE=RELEASE -D OPENGL=ON -D INSTALL_C_EXAMPLES=ON -D INSTALL_PYTHON_EXAMPLES=ON
    -D WITH_QT=ON -D CMAKE_INSTALL_PREFIX=/usr/local -D WITH_TBB=ON -D WITH_V4L=ON
    -D BUILD_NEW_PYTHON_SUPPORT=ON

    ```


    > To use the synaptic package manager, use Xming, open the desktop by typing lxsession
    in PuTTY, and select synaptic from the menu in GUI. Then type the library name
    in the search bar and install the additional libraries or dependencies.


