    # Preface


    Chapter 4, Monitoring the Atmosphere Using Sensors, develops your skills in choosing
    a sensor from many that are available in the market. We then implement the hardware
    and software required for temperature, humidity, and light sensors to automate
    our home appliances.


    Chapter 5, Using an ADC to Interface with any Analog Sensor with the Raspberry
    Pi, explains interfacing of analog-to-digital converters with an array of sensors.
    We build a sensor station for the Raspberry Pi using serial protocols to use the
    generic software function built, to get data from any sensor interfaced with it.
    Finally, the data can be stored in a log file for analysis.


    Chapter 6, Uploading Data Online – Spreadsheets, Mobile, and E-mails, takes a
    dive into the Internet of Things and sensor nodes. With the help of the sensor
    developed in the previous chapter, we upload the data to online spreadsheets and
    observe a real-time graph. We also get emergency e-mails on our e-mail platforms.
    Once you get your project done, you can send your sensors to rushi. raspberrypisensors@gmail.com.


    Chapter 7, Creating an Image Sensor using a Camera and OpenCV, covers the basics
    of image processing and how an installation of the OpenCV library can be performed
    successfully. Using a camera, we will develop an IP camera to install in your
    backyard to observe live streaming of activities. Further, we will build a piece
    of motion detection code in OpenCV to detect human movement in a particular area
    and capture an image for an immediate alert.


    Appendix, Shopping List, includes the list of the hardware components that need
    to be purchased in order to perform the hands-on tasks described in the book.
    From chapter 2 onwards, these components will be required to test our codes. You
    can directly take this list to the electronics distributors near you and come
    home with a filled shopping bag!


    # What you will need for this book


    There are no special demands for implementing the projects of this book on the
    Raspberry Pi, except the essential hardware components! You can use a personal
    computer with Linux, Windows, or Mac OS X to connect the Raspberry Pi to it. Any
    of the Raspberry Pi models available in the market (Raspberry Pi 1 models A+,
    B, B+, or Raspberry Pi 2 model B) should be okay for performing experiments on
    the code. You can refer to the Appendix, Shopping List, for the requirement of
    hardware before getting into Chapter 3, Measuring Distance Using Ultrasonic Sensors,
    and the later chapters.'
