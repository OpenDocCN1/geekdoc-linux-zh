    product developed by you.


    # Live feed on mobile phones


    You can install the Google sheets application in your Android- or iOS-based phone
    and just see the feed coming from the RasPi on your mobile phone. Just download
    it from the Play Store or an iStore (the App Store) and enjoy the live feed right
    from your office. My Android phone''s screenshot as follows:


    ![](img/294138a424db5b37c44c0a7ad39ef037_148_0.png)


    # Getting notified by e-mails


    Even after accomplishing the previous project, it still feels as if something
    is missing. Why should we continuously look at the data and check whether there
    is a critical condition or not? We will add the following functionality: every
    night at 12:00 a.m., the RasPi will send an e-mail stating the minimum and maximum
    temperatures of the day. We will get the warning e-mail by setting a threshold
    value of temperature whenever the critical condition arises. Suppose 30 degrees
    Celsius is the limit, and increasing the temperature beyond that may be the sign
    of a critical condition at your home.'
  - "[PAGE 149]\n\nHere, we are going to use an inbuilt Python library called smplib\
    \ to get the functionalities of sending e-mails from the RasPi. The smplib module\
    \ outlines the Simple Mail Transfer Protocol (SMTP) client, which can be imported\
    \ to send an e-mail from a client to any Internet machine using the SMTP daemon.\
    \ The mimetypes module provides us with the functionality to convert a URL or\
    \ file type to Multipurpose Internet Mail Extensions (MIME). It is a functionality\
    \ that people use the protocol to exchange data over the Internet. Import e-mail\
    \ and the mime.application modules, which can give us the e-mail functionality,\
    \ such as sender e-mail ID, receiver e-mail, subject of the e-mail, attaching\
    \ a body to an e-mail, and much more. The sys library provides system-related\
    \ functions and parameters, such as exiting of the try exception and continuing\
    \ the code. The difference between datetime and time data strings, while time\
    \ provides us with the sleep function to halt the code for some time.\n\nThe outline\
    \ of the algorithm is pretty simple. It is useful for getting an understanding\
    \ of the code written in Python:\n\n+   1. Import the essential libraries.\n2.\
    \ Open the SPI port.\n3. Define the SPI data fetching function.\n4. Define the\
    \ e-mail functions and pass all the important variables (such as sender_email,\
    \ sender_password, receiver_email, subject, min, and max) by calling this function\
    \ with the right parameters. The e-mail will be sent.\n5. Start a forever-running\
    \ loop.\n6. Create a .csv file with a name appended with today's date and time.\n\
    7. Store the current date in a variable called prev_date.\n8. Set the temperature\
    \ threshold limit.\n9. Under the forever-running while loop created in the fifth\
    \ step, put an indent and create one more while loop to check the current date\
    \ change.\n10. Call the sensor-reading function to get the value from MCP3008.\n\
    11. Get the minimum and maximum values of temperature from the .csv file.\n12.\
    \ Define two sets of conditions in which the RasPi will send an e-mail, as follows:\n\
    \    * When the current temperature goes beyond the Temperature limit\n* When\
    \ the date is changed"
  - "[PAGE 150]\n\n# Uploading Data Online – Spreadsheets, Mobile, and E-mails\n\n\
    +   13. Keep updating the .csv file locally and change the file when the date\
    \ changes.\n\n+   14. Start again from step 10.\n\nThis algorithm gives us an\
    \ overview of how the code will flow and the elements to be inserted. Check out\
    \ the following code:\n\n```\nimport smtplib\nimport mimetypes\nimport spidev\n\
    import email\nimport email.mime.application\nimport sys\nimport csv\nimport datetime,\
    \ time\n```\n\n```\n#start the SPI bus by opening the spi port\nspi = spidev.SpiDev()\n\
    spi.open(0,0)\n```\n\n```\n#Defining the ADC Reading function on SPI port\ndef\
    \ readadc(channel):\n    value = spi.xfer2([1,(8+channel))<<4,0])\n    read =\
    \ (value[1]&3) << 8 + value[2]\n    return read\n```\n\n```\n#Email Function to\
    \ send the email by passing the correct parameters\ndef email_data(sender_email,sender_password,\n\
    receiver_email,subject,min,max):\n    mail = email.mime.Multipart.MIMEMultipart())\n\
    \    mail['Subject'] = subject\n    mail['From'] = sender_email\n    mail['To']\
    \ = receiver_email\n    content = email.mime.Text.MIMEText(\"\"\" Min temperature\n\
    tperature is %d, Max temperature temperature is %d\"\"%%(min,max)\n    mail.attach(content)\n\
    \    s = smtplib.SMTP('smtp.gmail.com:587')\n    s.starttls()\n    s.login(sender_email,sender_password)\n\
    \    s.sendmail(receiver,[receiver],mail.as_string())\n```"
- md: "\n```python\ns.quit()\n```\n\nwhile(1):\n    # create a new csv file\n    filename\
    \ = 'Sensor_data_' + str(datetime.datetime.now()).split(' ')[0]\n    writer =\
    \ csv.writer(file(filename+'.csv', 'wb'))\n    prev_date = str(datetime.datetime.now()).split('.')[0].split('\
    \ ')[0]\n    \n    max_sensor_data = -9999\n    min_sensor_data = 9999\n    #\
    \ setting the temperature threshold limit to 30 C\n    temp_limit = 30\n\nwhile(1):\n\
    \    cur_datetime = str(datetime.datetime.now()).split('.')[0]\n    cur_date =\
    \ cur_datetime.split(' ')[0]\n    sensor_data = readadc(0)\n    min_sensor_data\
    \ = min(sensor_data, min_sensor_data)\n    max_sensor_data = max(sensor_data,\
    \ max_sensor_data)\n\n    # check if the threshold value is crossed\n    if (sensor_data\
    \ > temp_limit):\n        try:\n            email_data('gajjar.rushi@gmail.com',\n\
    \            'raspberrypi','gajjar.rushi@gmail.com','Warning !!!',\n         \
    \   min_sensor_data,sensor_data)\n        except:\n            pass\n    # check\
    \ if the date is changed, if changed: send email\n    if (cur_date != prev_date):\n\
    \        try:\n            email_data('gajjar.rushi@gmail.com',\n            'raspberrypi','gajjar.rushi@gmail.com',filename,\n\
    \            min_sensor_data,max_sensor_data)\n        except:\n            pass\n\
    \        break\n\n    # update the csv file\n    writer = csv.writer(file(filename+'.csv',\
    \ 'ab'))\n    writer.writerow([cur_datetime,sensor_data])\n    time.sleep(1)\n\
    ```\n\n## Uploading Data Online - Spreadsheets, Mobile, and E-mails\n\nLet's understand\
    \ the e-mail function first. In the e-mail function, we are passing variables\
    \ (sender_email, password, receiver_email, subject, min, and max) that come when\
    \ the if loop is satisfied. In the content variable, we are storing the body of\
    \ e-mail containing the minimum and maximum values.\n\nThe code flow starts from\
    \ the first while loop, which will start forever. Our outer while loop will complete\
    \ every day because we are putting an inner loop to run forever and break when\
    \ the date changes. If you look closely at the filename variable, you will see\
    \ that it sets the filename as Sensor_Data appended with the current date. The\
    \ datetime.datetime.now() function provides the time and date with precision.\
    \ Millisecond precision is not required for our project. The split() function\
    \ removes the milliseconds from the raw data. Once we get the filename, we save\
    \ it as .csv file using the csv writer function.\n\nA few examples of split functions\
    \ in Python Shell returned these values:\n\n```\n>>> str(datetime.datetime.now())\n\
    2015-01-26 17:12:49.998000\n>>> str(datetime.datetime.now()).split('.')[0]\n2015-01-26\
    \ 17:12:49\n>>> str(datetime.datetime.now()).split('.')[0].split(' ')[0]\n2015-01-26\n\
    ```\n\nTo detect the date change, we will use the split() function twice to extract\
    \ the date string from datetime.datetime.now(), and it will be stored in the prev_date\
    \ variable.\n\nWe are using max_sensor_data = -9999 and min_sensor_data = 9999\
    \ to prevent false data in the min() and max() functions, which are used to find\
    \ minimum and maximum values from the csv file. The temp_limit variable can have\
    \ your desired value at which you want to send an e-mail to the RasPi.\n\nIt would\
    \ be good to add try, which handles exceptions. As explained in previous sections\
    \ it works on a simple principle:\n\n- Execute the try clause. If no exception\
    \ occurs, the except clause is skipped and execution of the try statement completes.\n\
    - If an exception occurs during execution of the try clause, the next part is\
    \ skipped. Then it goes to the except clause and gets executed.\n\nThe rest of\
    \ the code is self-explanatory and can be understood from the comments provided\
    \ in the code itself. You can set the same sender and receiver e-mail while you\
    \ are testing your code. Every day, data is stored in a .csv file with date as\
    \ name, whenever you open the RasPi you can just take out the entire folder packed\
    \ with csv files.\n\nOnce you code, you can properly fix the sensor station in\
    \ an airtight container along with the RasPi and fix it to the router of your\
    \ home. Connect an Ethernet cable directly from your router to your RasPi. Your\
    \ computer being in the same network, you can ping the IP address of RasPi to\
    \ check whether it has successfully connected to the router and your network.\n\
    \n## Integrating everything\n\nNow it's your turn to integrate the Google spreadsheet\
    \ project with the e-mail notifier project. All you have to do is arrange the\
    \ events of sending data to Google spreadsheets, logging local data, and sending\
    \ e-mail. You can even try to attach the .csv files when you send a day's summary.\n\
    \nThe application of this project is so that you can do much more with this code\
    \ by adding functionalities. By adding multiple sensors with multiple RasPi boards\
    \ in different corners of your home, you can really get much more data and many\
    \ more alerts from your home.\n\nIf you are installing a RasPi in a remote place,\
    \ not forget to add the Python script in crontab as described in Chapter 3, Measuring\
    \ Distance Using Ultrasonic Sensors, to start logging the data again when the\
    \ RasPi boots back.\n\n## Common problems faced\n\nWhile building a project, there\
    \ may not be many problems faced as it is mostly software development. Still,\
    \ mistakes can happen in the ways described here.\n\nIn your code, do not declare\
    \ a variable name or function name same as a Python data type or Python builtin\
    \ function; naming a function email() is not valid and can create a runtime error\
    \ in the code. The same problem can occur when you set the Python script filename\
    \ as a predefined Python function, for example, email.py.\n\n## Uploading Data\
