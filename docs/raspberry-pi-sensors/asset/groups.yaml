    # Measuring Distance Using Ultrasonic Sensors


    With this configuration, the voltage drop across the resistor R2 should be calculated
    using this formula:


    ```

    Vout = \frac{R2}{R1 + R2} * Vin

    ```


    Similarly, if you use the variable resistor, also called as a potentiometer (POT),
    there is a slider in the center. This slider needs to be changed, and we have
    to look for the desired voltage on a digital voltmeter (multimeter).


    I have a 1KQ resistor with meter, and it is one of the standard resistor values
    available. We already know that we need to convert 5V to 3.3V. So here, Vin will
    be 5V, and Vout will be 3.3V. Let''s calculate the R2 value required to create
    this voltage divider.


    Let''s put values into the equation:


    ```

    3.3 = \frac{R2}{1K + R2} * 5

    ```


    Then, let''s solve the equation:


    ```

    3.3K + (3.3 * R2) = (5 * R2)

    ```


    We get R2 = 1941.1Ω, and this value of resistor is not available in the market.
    However, fortunately, we have a resistor of 2KQ that has a value very near to
    1941Ω. The resistors we get from the market have tolerances of 5 percent to 10
    percent. This means that resistance with these tolerance values are never exactly
    same as the tagged value. It always has some variance. As per the calculations,
    we need two resistors to build the voltage divider from 5V to 3.3V, which are
    1KQ and 2KQ.


