    # # Preface


    Raspberry Pi is a single-board, credit-card-sized, computer packed with many opportunities
    to explore and invent. It is really amazing to see kids start coding Python from
    scratch, and build a bird box that streams live video on the Internet to check
    whether a bird has got its meal. I remember that when I was a kid, I used to play
    with Lego toys attached to DC motors and batteries, which was engaging. At that
    time, I could not imagine the logic that went into coding, and did not get any
    chance to code my projects and control the movement of those Lego blocks using
    a mobile phone. But I am lucky enough now to get an opportunity to such projects
    and provide a launchpad for young creators who really have a passion to create
    something and change the world around us.


    The world is moving towards a new era. Technology is revolutionizing daily needs
    and habits making them available on a simple interface, which gave me motivation
    to write a book on Raspberry Pi sensors. It''s a world of creativity, and I believe
    that creativity comes when you start understanding and appreciating the fundamentals
    and start applying logic to it. A lot of information and projects on Raspberry
    Pi are floating on various webpages, and one wishes to achieve as much as she
    can. I feel that the information on webpages is often observed as incomplete.
    It gives us a chance to build projects but does not explain what is behind them.


    It is known that without actually diving deep into electronic devices and communication
    protocols, you can start coding on Raspberry Pi and craft amazing projects. I
    have colleagues around me who often need to code and wire the sensors on the Raspberry
    Pi platform for their experiments. They can develop Python code on artificial
    neural networks in a short span of time, but I believe that a basic understanding
    of electronics is a plus for such prodigies out there, who want to develop code
    on such platforms. The opposite scenario, hardware developers can wire sensors,
    ensure proper voltage levels on device pins, but when it is to code, they need
    help.'
