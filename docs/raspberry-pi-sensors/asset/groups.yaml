    # CS0 (CE0) CS1(CE1)


    ![](img/294138a424db5b37c44c0a7ad39ef037_61_0.png)


    ## 集成间电路 (I2C)


    集成间电路 (I2C) 是一种通过两根线工作的协议，它是一种半双工协议（一种通信方式，其中发送者发送命令时，接收者只监听而不能传输任何内容；反之亦然），只需要两根线，即数据线
    (SDA) 和时钟线 (SCL)。I2C 协议由飞浦专利，每当 IC 制造商想要在其芯片中包含 I2C 时，都需要许可。我们周围的许多 IC 和外围设备都集成了
    I2C 通信协议。I2C 引线（SDA 和 SCL）始终通过电阻上拉到输入电压。I2C 总线支持三种速度：高速（3.4 MBps）、快速（400 KBps）和低速（小于
    100 KBps）。据报道 I2C 通信距离可达 45 英尺，但最好保持在 10 英尺以内。


    ## 走进电子世界


    每个 I2C 设备都有 7 到 10 位的地址；使用此地址，主设备可以始终连接并为特定的从设备发送数据。当你将设备与主设备建立接口时，从机制造商会提供供你使用的地址。每个从机都会接收数据，但只有该从机可以获取专门为其准备的数据。通过地址，主设备读取传感器中预定义数据寄存器中的可用数据，并在内部进行处理。I2C
    总线配置的一般设置可以如图所示：


    ![](img/294138a424db5b37c44c0a7ad39ef037_62_0.png)


    商店里有带有 I2C 接口的 16 x 2 字符 LCD 模块；你可以直接使用它们并相应地为 RasPi 编程。通常，LCD 需要 8/4 位并行数据位、重置位、读/写位和使能引脚。下图显示了
    I2C 引脚，它们在所有 RasPi 型号上的位置都是相同的：


    ![](img/294138a424db5b37c44c0a7ad39ef037_62_1.png)


    当我们谈论传感器接口时，I2C 协议是所有协议中最广泛使用的。Silicon Labs 的 Si1141 是一种接近和亮度传感器，现在用于手机以提供自动亮度和近距离检测功能。你可以购买它并轻松地与
    RasPi 接口。Sension 的 SHT20 同样带有 I2C 协议，用于测量温度和湿度数据。步进电机可以使用基于 I2C 的控制器控制，这些控制器可以与
    RasPi 接口。最神奇的是，如果你拥有所有这些传感器，就可以将它们连接到单个 I2C 上。在下一节中你将了解到，我们无法在 RasPi 1 型 B 或 B+
    以及 RasPi 2 型 B 上使用许多 GPIO。因此，带有 I2C 接口的模块适用于低引脚设备。这就是为什么你的串口通信非常有用的原因。


    这些协议主要与 RasPi 使用。这里提供的信息并不详细，因为关于这些协议可以写很多页的内容，但在为 RasPi 编程时，这些信息可以帮助你构建项目。


    ## 有用的提示和注意事项


    在讨论 RasPi 的实用性之前，让我们来看看在使用 RasPi 时的注意事项和提示。你需要阅读这些，因为你现在将要操作 RasPi 的 GPIO 了。本节将提供你在操作
    RasPi 时需要记住的通用提示和警告：


    - 避免触摸 RasPi 上的电子元件，即使是少量的汗水或身体产生的静电也可能损坏电路板。板上的元件非常小，可能会受到手部少量汗水和水的影响。请从角部接触，或者始终使用外壳来覆盖它。电子商店里有很多此类外壳。


    - 将 RasPi 放在桌子上要小心。如果有小零件（剪断的线段）或桌子本身是金属做的，可能会导致 RasPi 的连接短路。


    - 绝不要将电压高于 3.3V 的设备连接到 RasPi 的 GPIO 引脚。在第3章使用使用声波传感器测量距离中，我们将面临这种情况，你将学习如何克服它。每当你考虑将任何设备连接到
    RasPi 时，请获取设备功率的所有详情。请避免通过将跳线导连接到 GPIO 来连接 RasPi 的 5V 电源线。


    - 使用低功耗 LED 时，在 LED 的正极线上串联电阻（270 到 330Ω 效果良好）是一个好做法。请不要随机将电源和电线插入你的 RasPi。建议不要直接短路板子上的两个引脚。


    - 不要尝试将需要大量功率的元件连接到你的 RasPi；LED 可以的，但直流电机不行。如果你想为 RasPi 建立接口，你需要一个电机驱动器。


