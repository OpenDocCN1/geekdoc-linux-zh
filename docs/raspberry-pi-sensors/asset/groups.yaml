    # Using ADC to Interface any Analog Sensor with the Raspberry Pi


    Currently, it is unknown what types of sensors we are going to interface. Once
    the sensor is interfaced, the conversion formula should be created and imported
    to the same code. To append the converted data, simply use datalist.append(variable),
    and the value will be stored in the data file separated by a comma in a single
    row. Every sequence of the for loop will generate one row. You can play around
    with different values and conversions by interfacing some sensors on your sensor
    station. Have fun!


    > You can crontab the same way as you used in Chapter 3, Measuring Distance Using
    Ultrasonic Sensors, to put this Python code in startup.


    # Summary


    Starting from the basics of analog-to-digital converters, you gained knowledge
    of a process to be followed while working with ADC modules. You understood how
    critical it is to handle the analog data and why processors need separate cores
    to process this incoming data. We got a glimpse of the MCP3008 IC and its functionality.
    We made our own sensor station, which can be seamlessly integrated with any Raspberry
    model. Then, you understood how the SPI functionalities can be ported to Python
    code and managed to get the data into the digital format. Data logging can now
    be done on .csv files to post-process the data. With this chapter, sensor interfacing
    and logging has become simpler than ever. Interface as many sensors you want,
    with different sensors, and deploy sensor stations everywhere to retrieve the
    data.


    In this chapter, we collected offline data, which can be post-processed after
    the data is logged. In the next chapter, we will upload the data online to see
    real-time graphs from remote places. Also, we will enable our RasPi to send e-mails
    to desired e-mail IDs with sensor data appended. This will be your first step
    to creating your own Internet of Things product. Get ready for this exciting project!


    # Uploading Data Online – Spreadsheets, Mobile, and E-mails


    So far, we have observed the data calculated by the RasPI, but we did not take
    care of the data. It has been generated, observed, and discarded after making
    some decisions. In the previous chapter, we logged some of the data in .csv files,
    which looked like an old school way to record the data. This data is very useful
    when it is logged to the Internet. How would it be if we set up the RasPI to send
    data every second from our home and to see the graph of the parameters from any
    corner of the world? How would it be if you were notified by an e-mail if there
    were any critical conditions? Wouldn''t it be nice if the analysis of the data
    were sent to you by an e-mail at the end of the day?


    I know that we are always worried about our home when we are on holiday or even
    in the office. There could be a lot of data to take care of when you are away
    from your place, for temperature, humidity, motion, fire alerts, unauthorized
    intrusion, energy consumption, device states, and so on. There are infinite possibilities
    to turn your home into a smart home using the amazing RasPI.


    In this chapter, you are going to learn how all these things can happen at one
    go. You will understand that the Internet of Things (IoT) is the discussion around
    the breakfast table for every technology geek. You will also learn how communication
    usually takes place and the way the sensor nodes and devices attached to IoT work.
    You will get to know why data analytics, cloud storage, and cloud access technologies
    are in boom. On one hand, we get the facilities, but on the other hand, there
    are some security concerns that should be addressed while deploying this technology.
    You will get some knowledge on how severe security concerns are.


    Uploading Data Online – Spreadsheets, Mobile, and E-mails


    We developed a sensor station in the previous chapter. We will use this sensor
    station to collect data from different sensors while doing the hardware setup.
    In the next step, we will upload the data to the Google spreadsheet by pushing
    it online, and see the real time graph of the sensor data on desktops and on Android
    and iOS mobile phones. Then we will set up the RasPi to send us an e-mail of the
    data collected in an entire day, and the minimum and maximum values reached by
    the sensor. It will also be able to send an e-mail when there is a critical situation
    at home.


    This chapter sounds so much fun – learning by giving intelligence to the RasPi
    to observe the sensor data online. Let’s start the journey by understanding the
    IoT.


    # Internet of Things


    IoT has started attracting scientists, innovators, technologists, engineers, and
    investors to start development and take part in one of the fastest growing markets
    in the world. It can fulfill the vision of all these people to make the world
    better live in. Once implemented on a large basis, it will make our lives more
    comfortable, and safer. This revolution began by redesigning and replacing the
    smallest and basic devices we use in our day-to-day lives. It is said that there
    will be about 30 billion devices as a part of IoT by 2020, excluding mobile phones
    and tablets. From toothbrushes to shoes, wallets, washing machines, switches,
    vehicles, and much more, they all will be part of IoT.


    Some of the IoT devices learn our everyday habits, adopt them, and then respond
    by taking the decision by themselves. It can be really amazing to see the revolution
    in every physical entity by adding communication capabilities to it. There are
    no particular definitions of IoT. Technically, we can understand IoT as adding
    Internet connectivity (basically a unique Internet address), and also the capacity
    to sense everyday physical objects or entities that can communicate with each
    other and mobile devices, such as phones and wearables. Some people in communities
    believe that the IoT space is overloaded as it a lot of expectations and adds
    a lot of redundant devices, which are not really required to add comfort to our
    lives but are forcibly added.


    > One of the interesting projects on artificial intelligence and IoT is Jibo,
    a family robot. Take a look at http://www.jibo.com.


    # Chapter 6


    IoT can be represented as an integrated fabric of devices, networks, data, calculations,
    analytics, and people as essential elements. We can imagine an IoT network as
    a widely web mapped in a home to connect all devices, such as lights, fans, thermostats,
    geysers, switches, refrigerators, ACs, and media devices. Imagine a situation
    where you arrive at the airport after a long summer holiday and the temperature
    at home is intolerable due no presence at home. Once your mobile phone connects
    to the Internet, the AC in your home will know that you have arrived back in the
    city. It will estimate the time of your arrival according to the traffic in way
    and set the rate of cooling your home. In addition to that, it will know what
    temperature to set according to your daily habits. In the reversed situation,
    when you are leaving for your holiday, the device in your home knows the location
    of your mobile phone, and it will disable all the unnecessary devices set in the
    mobile phone''s application. This can also be controlled manually through mobile
    applications. IoT technology is applicable not only in homes but also in hotels,
    hospitals, industries, offices, and transportation – in short, everywhere. Really,
    it will be the Internet of everything.


    # Sensor nodes


    As we know, there are many parameters to sense at a single place. We have already
    built a sensor station, which can ultimately be called a sensor node once installed
    in a corner of our home or office. Then it will be silently observing the surroundings
    and storing all the data. Imagine connecting node to the Internet, and many other
    nodes as such. A sensor node can be of any size, for example, starting from the
    size of a table top projector down to the size of a dust particle! So, can we
    call it smart dust? Yes! Researchers have already implemented smart dust particles
    (also called motes) that get energy from light, temperature, or a thin battery.
    Widely used sensor nodes range in size from a fingertip to a palm. These sensors
    can create a wide network over a targeted area, and can number from hundreds to
    thousands.

