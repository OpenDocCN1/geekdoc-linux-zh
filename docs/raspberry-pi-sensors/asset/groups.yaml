    digits. For example, 153 is an Armstrong number because 153 = 1³+5³+3³.

    - Convert the temperature from degrees Celsius to degrees Fahrenheit and vice
    versa. Ask the user to get the value and decide whether they are entering it in
    Celsius or Fahrenheit. Show a warning message if the temperature is above 38 degrees
    Celsius or 100 degrees Fahrenheit.

    - Create a calculator that has all the basic functionalities, such as addition,
    subtraction, division, and multiplication. Ask the user to select the function
    they want. Show an error if they divide anything by zero.

    - Get a value from the clock, attach to a Time is string, and display the current
    time, for example, Time is 17-Oct-14 10:18:22AM.'
