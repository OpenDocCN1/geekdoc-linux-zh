    \ up while booting time and automatic setup of GPIOs can be done. Whether the\
    \ RasPi 2 model B or RasPi 1 model you know all the GPIOs – really! Let's have\
    \ some practice on the GPIOs.\n\n## It's time to glow LEDs!\n\nLet's gather some\
    \ components and wires first:\n- standard LED (one piece, forward voltage 3.3V)\n\
    - wires (one red and one black, 2.54 mm female-to-female jumper connector)\n-\
    \ Ethernet cable, your PC\n- resistor (330 Ω) between positive terminal of the\
    \ LED and the RasPi.\n\nThe following diagram is a representation of the circuitry\
    \ to be made. The dark dots represent the connections between components, wires,\
    \ and the RasPi.\n\nIt's time to test now. Insert the SD card and power adapter\
    \ to start working on RasPi. You have already installed the wiringPi library in\
    \ Chapter 1, the Raspberry Pi. This library comes with a function called gpio\
    \ that gives you the functionality to access the GPIO directly from the terminal\
    \ without writing any code. Wells, but for testing the LED, we need to write code\
    \ in a single line. Type gpio-write 17 1 to glow the LED, or gpio-write 17 0 to\
    \ turn off the LED. Simple isn't it? These commands can be written directly in\
    \ PuTTY or Linux and Mac systems. By performing SSH, we can use Python or C to\
    \ automate these commands in a single file. We will see all of these in the following\
    \ sections.\n\n## Shell script and GPIO\n\nWe already know that shell scripting\
    \ is a way to execute the commands of Linux through a single file. Let's create\
    \ a script to toggle the LED and generate a pattern: LED turns on for a second,\
    \ then turns off for half a second, and repeats indefinitely until I press Ctrl+C.\
    \ Open nano editor using sudo nano ledblink.sh, and type the following code:\n\
    \n```\n#!/bin/sh\necho \"Hi, This is how I glow using Shell!\"\necho \"Press C\
    \ to exit\"\nwhile ; do\n  sudo gpio-write 17 1\n  sleep 1\n  sudo gpio-write\
