    >>> str(datetime.datetime.now()).split(''.'')[0]

    2015-01-26 17:13:17

    >>> str(datetime.datetime.now()).split(''.'')[0].split('''')

    ```


    To detect the date change, we will use the split() function two times to extract
    the date string from the datetime.datetime.now() function, and it will be stored
    in the prev_date variable.


    We are using max_sensor_data = -9999 and min_sensor_data = 9999 to prevent false
    data segregation in the min() and max() functions, which are used to find minimum
    and maximum values from the .csv file. The temp_limit variable can have your desired
    value — at which you want to send an e-mail to the RasPi.


    It would be good to add try, which handles the selected exceptions. As explained
    in the previous sections while experimenting with Google spreadsheets, it works
    on a simple principle:


    +   Execute the try clause. If no exception occurs, the except clause is skipped
    and execution of the try statement completes.

    If an exception occurs during execution of the try clause, the next part of the
    clause is skipped. Then it goes to the except clause and it gets executed.'
