    # Uploading Data Online - Spreadsheets, Mobile, and E-mails


    Implementing sensors may face several challenges. These challenges start from
    the hardware end. Most of the devices in the network will be using low-cost MCUs
    to process the data locally and transmit it to nearby devices or to an Internet
    gateway. These low-cost MCUs will require enough RAM to run security protocols
    and the user application. In addition, the energy consumption of such MCUs must
    be as low as possible to run on a 3V button cell for 4-5 years. This can be achieved
    by putting the processor in sleep between periodic transmissions of data. The
    duty cycle of such processors can be near 1 percent or at the required periodic
    rate, according to the calculations of data. Putting the processor in sleep mode
    and resuming should take no more than a fraction of the set duty cycle. There
    are PLLs and locks, which take time to become stable, and the stability of a processor
    core is solely dependent on these clocks. This stability time can go up to milliseconds,
    which can run the dreams of the hardware designer to run the device for a longer
    time on a single cell. There are many other hardware issues to be addressed by
    a hardware developer.


    Due to many hardware constraints, there are many challenges faced in the software
    end — utilizing the proper RAM space, clearing periodically, and writing efficient
    algorithms with the communication protocol stacks in a limited amount of RAM.
    The next thing can be the remote firmware upgrade over the air (FUOTA). It may
    be the case that the node needs an immediate firmware fix after deployment in
    the field to fix the cracks in the received data. A firmware upgrade can also
    fix the performance of the hardware by adjusting the handling of interrupts and
    sleep timings, optimizing the code size and efficient usage of RAM. FUOTA ensures
    that the deployed sensor node works properly and responds well to other nodes.
    These firmware upgrades are maintained under the version control. Special handling
    is required on the exceptions, and all possible failures are considered while
    making the device remotely upgradable over air. For example, suppose the node
    is being upgraded, and the power level in the device is so critical that it leads
    to shutdown of the device. When it resumes on arrival of power, it should revert
    to the previous stable version of the firmware and ask for the latest firmware
    upgrade. Download time, download size, and timings of the day are other factors
    that affect the success rate of FUOTA.


    # Communication


    Communication between sensor nodes should take place through a lossless medium.
    Packet losses play a major role in failure of data transmission. Communication
    is the most essential part of the IoT infrastructure. It is a duplex medium to
    collect and send data as well as commands. After a connection has been established,
    it has to be maintained and managed all the time.'
