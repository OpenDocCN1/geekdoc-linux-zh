    # Summary


    We started this chapter with the essentials of IoT. The information provided in
    the sections did not encompass the entire concept of IoT. IoT is a big space,
    including sensor nodes, sensor networks, communication, cloud computing, data
    analytics, and security. There can be many facets of IoT that require a lot more
    attention from developers. You came to know that IoT could be the future of Internet
    and data, starting from the smart dust all the way to smart cities. Security is
    a major concern, which needs immediate attention and research to meet the requirements
    of the embedded world.


    This chapter gave you knowledge on observing the data inserted into Google spreadsheets
    from the sensor interfaced with your RasPi. You learned how a RasPi can log to
    a Gmail server on behalf of you and sent an e-mail when there is a real need.
    We prepared a project that purposefully sent an e-mail at the end of the day,
    sending the analysis of a data. Minimum and maximum values of the data can be
    a very small example of data analysis. It was a good challenge to integrate gspread
    e-mail notification codes to make the code even more practical.


    In the next chapter, we are going to interface an image sensor (camera) with the
    RasPi and test its operability. A complete illustration on installing the OpenCV
    library will be provided to get you started with image processing on the RasPi.
    You will make a project with live video streaming to use the RasPi as a CCTV camera
    and capture an instance of motion in your house. It will be an amazing experience
    and a great outcast for you to develop a project using an awesome library known
    as OpenCV.


    ## Creating an Image Sensor Using a Camera and OpenCV


    There has been an enormous amount of research behind a small name — image sensor.
    From developing CMOS sensors, which can take crystal-clear images, to employing
    enhancement of images using image processing, there are so many efforts involved.
    Making different types of cameras suitable for different applications and processing
    algorithms is not easy at all.


    Image sensors are used in cameras, and they are very difficult to use in unpacked
    conditions, as they are fragile and sensitive to electrostatic discharge. We will
    be using a camera (basically a lens with the protective case and an interface
    cable) to demonstrate image capturing using a RasPi. Performance of a camera with
    a RasPi is always rated low in discussions because of its poor performance with
    image processing and video processing, with comments that image processing and
    video capturing is not the RasPi’s strong point. Somehow, these comments are true
    when we run computation-intensive algorithms with a huge amount of processing,
    and the RasPi gives a delayed response. But it all depends on the hardware hooks
    at the time of camera interfacing. There are many factors that could affect the
    performance of the RasPi when you are using the camera. This was the issue with
    the older models of the RasPi, such as Raspberry Pi 1 model B, B+, and A+. But
    now, with Raspberry Pi 2 model B, this will not be the case. RasPi 2 model B is
    six times more powerful in performance than the older RasPi models.


    ## Creating an Image Sensor Using a Camera and OpenCV


    In this chapter, we will start off by giving a brief introduction to image processing
    and OpenCV. Then we will go through the camera interfacing ports and look at the
    different kinds of cameras that can be interfaced with the RasPi. Next we will
    do a long and tiring (but well-worth the time) installation of the OpenCV library
    on our RasPi. Once the libraries are installed, we will write a C program to capture
    an image from a camera. Moving one step ahead, we will experiment with the live
    streaming of a video over the same network as the one in your house. In a further
    step, a project will be prepared to detect human motion or movement in a particular
    area, capture the image, and alert you immediately.


    ## Image processing


    Have you ever tried to look at an image by zooming it to a maximum level? It just
    looks like a floor with organized tiles and colorful patterns on it. These square
    tiles in the image are known as pixels. Basically, an image is a group of pixels,
    with each pixel containing a particular value of color, which forms the recognizable
    patterns by providing information to the human eye. It depends on how humans perceive
    the image by observing shapes and colors. Each pixel contains information that
    can be generated from a byte (8 bits) or a couple of bytes, which defines the
    depth of an image. Depth of an image is nothing but the number of bits present
    in a single pixel. Current display monitors and graphics engines support up 64-bit
    depth of image. Basic types of images are binary, grayscale, and RGB, and many
    more such as HSV, HLS, and YCC are known types. A grayscale image does have the
    range of values from 0 to 255 in the 8-bit mode, while a binary image has them
    in the range of 0 to 1. As the name suggests, a binary image has only black and
    white colors possible on the image plane. The difference between a grayscale and
    a binary image can be observed in the following images:


    ![](img/294138a424db5b37c44c0a7ad39ef037_158_0.png)


    ## Chapter 7


    An RGB image has a total of 3 planes to access, as it has R (red) varying from
    0 to 255; and the same applies for G (green) and B (blue) colors for 8-bit depth.
    A grayscale image has shades from white to black, with a total of 256 discrete
    values (0 to 255) for an 8-bit deep image.


    Image processing is performed to enhance an image to a certain levels, to extract
    maximum information.

    '
