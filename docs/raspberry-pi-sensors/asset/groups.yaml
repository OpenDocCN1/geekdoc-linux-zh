    # OpenCV


    One of the most powerful and widely used cross-platform libraries for image processing
    is OpenCV, which can run on any hardware or software platform. It can be installed
    on the RasPi to get functionality such as face detection, finding contours, gesture
    recognition, motion tracking, 3D depth perception using cameras, and many more
    complex algorithms for machine learning. OpenCV stands for Open Source Computer
    Vision. It was developed by Intel. It is basically written in the C++ language
    and can have full interfacing with Python, Java, or MATLAB. Check out http://opencv.org
    for the list of available open source libraries. With aiming for computational
    efficiency in mind, OpenCV is designed to work with multicore architectures. Writing
    OpenCV in C and C++ is common across the globe image processing experts. OpenCV
    can also be written in the Python language, as the library has full development
    and supports functions in the Python script.


    Computer vision is a quickly growing field of cheaper and advanced processing-capable
    hardware. OpenCV provides productivity for professionals achieving the best results
    in the field of vision processing. Initially, image processing was only possible
    in research labs due to its rarity on open source platforms and dedicated hardware.
    Nowadays, students, researchers and professionals can easily use the fully developed
    and growing library known as OpenCV. OpenCV, at the time of writing this book,
    is of version 3.0 Beta, with approximately 9 million downloads.


    # Camera interfacing with the RasPi


    The RasPi has the Broadcom multimedia processor BCM2835, which has an integrated
    VideoCore-IV graphics engine. There are multiple ways to interface the camera
    with the RasPi connectors. As described in Chapter 1, Meeting Your Buddy – the
    Raspberry Pi, (refer to the diagram showing the RasPi''s port description), the
    RasPi has a dedicated CSI port for connecting the camera module. This port can
    be located near the Ethernet controller (in the case of model B) or the 4-pole
    audio connector (in the case of model B+). The Camera Serial Interface (CSI) port
    is dedicated to camera interfacing in mobile devices and advanced peripheral controllers.
    We have two options to interface the cameras with our RasPi. We can either interface
    the webcam via USB, or choose the camera module from the Raspberry Pi organization
    known as Raspberry Pi camera module.


    # The RasPi camera modules


    There are two options when buying the dedicated camera modules to be interfaced
    with RasPi. The camera comes with the half-long flex cable to connect to the RasPi
    CSI connector. The RasPi camera modules are available in two options:


    - Raspberry Pi camera module: This camera module employs a 5-megapixel camera
    with the capability of full HD video recording at 30 FPS. It does the job well
    during the daytime with better light.

    - Raspberry Pi camera module black Noir: NoIR stands for No Infrared. This camera
    module doesn''t have an internal infrared filter, which gives the camera the ability
    to see in the dark. You can deploy this camera as a CCTV in your garden house
    to keep a watch on your pet at night. These cameras perform even better for wildlife
    photographers by triggering and capturing the image or video whenever motion is
    detected. This camera has the ability to capture images at night because it deploys
    infrared LEDs.


    These cameras have a price tag of $25 in online stores. To enable the RasPi camera
    module, enter this command and enable the camera from the configuration window:


    ```bash

    sudo raspi-config

    ```


    Select the Enable Camera option in the configuration settings using the keyboard.
    Test the camera by capturing the images using the following command:


    ```bash

    sudo raspistill -o FirstImageThroughRasPi.jpg

    ```


    Use the raspistill command to know about more options available with the raspistill
    command. You can even record videos (in H264 format) using the following command:


    ```bash

    raspvid -o FirstVideoThroughRasPi.h264 -t 5000

    ```


    This command will record a video for 5 seconds, and will automatically save the
    file when the recording finishes.


    > The RasPi camera modules are very sensitive to electrostatic charges transferred
    by our body. RasPi camera module failures are very common in the Raspberry Pi
    community. Wear electrostatic straps or taps on your hand before touching the
    camera. The ribbon supplied with the RasPi camera module is very delicate. Therefore,
    special care should be taken while using this camera module.


    ![](img/294138a424db5b37c44c0a7ad39ef037_161_0.png)


    # Creating an Image Sensor Using a Camera and OpenCV


    ## USB webcam


    It can be cheaper you interface your desktop computer''s webcam by compromising
    performance. Not all webcams are supported on the RasPi. You can check out the
    list of webcams and cameras supported by Linux at http://www.ideasonboard.org/uvc/#devices.


    There is a trade-off between speed, cost, and versatility using a USB webcam compared
    to the Raspberry Pi camera module. If you choose a USB camera, you will get degraded
    performance, but you will be able to interface a USB webcam with any of your single-board
    embedded computers in future. USB cameras are definitely cost-effective. To add,
    a strong USB cable and static-proof casings provide a longer life compared to
    the Raspberry Pi camera module.


    The upcoming project in this chapter is verified using the Logitech C270 USB web
    camera.


    ## Live streaming using a network camera


    Have you ever wondered whether the RasPi can be used for live streaming purposes?
    If you choose to stream videos on the RasPi on the localhost network using RasPi
    as a network camera. There are multiple ways to make use of the RasPi for live
    streaming:


    - By fixing a camera interfaced with the RasPi being in the same network, you
    can SSH through the connection and open the camera port.

    - Use the HTTP server to enable the camera view. Motion has a built-in HTTP server
    that enables the camera. Motion can record videos in MPEG format and capture images
    in JPEG format. These images and videos can be stored wherever you want, and it
    supports databases such as MySQL. Enter these commands to install motion on the
    RasPi:


    ```bash

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get -y motion

    sudo apt-get -y v4l-utils

    ```


    # Chapter 7


    It is required to set the configuration file before starting the project, which
    can be called IP-camera:


    ```bash

    sudo nano /etc/motion/motion.conf

    ```


    Setting the configuration file could be a tedious job, as the file is long and
    there are many parameters to set. You can search parameters in the file using
    Ctrl + W. The set parameters presented as follows:


    ```conf

    netcam url http://169.254.0.252:8081

    webcam_localhost off

    control_localhost off

    control_port 8080

    framerate 2

    control_html_output on

    daemon on

    ```


    ![](img/294138a424db5b37c44c0a7ad39ef037_163_0.png)


    > The RasPi''s IP address can be found using the ifconfig eth0 command. In response
    message, it must have been noted in the second line as inet addr:169.254.0.252.


    After making these changes in the configuration file, press Ctrl + X, then Y,
    and then Enter file to save and edit the configuration file. There is a need to
    change the daemon file of motion to keep the motion service running. Enter this
    command to set the daemon for motion:


    ```bash

    sudo nano /etc/default/motion

    ```

