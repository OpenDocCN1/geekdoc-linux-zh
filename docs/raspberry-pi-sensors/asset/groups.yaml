    # 关于作者


    Rushi Gajjar 是一位嵌入式系统硬件开发人员，也是终身电子爱好者。他从事高速单板嵌入式计算机和用于物联网的无线传感器节点的研发工作。此外，他在韦洛尔的国立理工大学（VIT
    University）参与研究，学习了嵌入式系统的硕士学位。


    在此之前，他在电子硬件设计领域的大量自由职业工作经历使他接触到了如树莓派等快速原型开发板。在空余时间里，他喜欢在树莓派上开发项目，包括视觉、数据日志、Web
    服务器和机器学习自动化系统。他乐于向学校学生教授树莓派项目。


    他的愿景涵盖了将世界上每一个实体连接到互联网，以增强人类的生活体验。他的爱好包括打乒乓球、摄影和旅行。


    # 致谢


    首先，我必须感谢我的采购编辑 Richard Harvey。我从未想过我能就“树莓派传感器”这样一个如此精彩的话题写书。在我写初始章节之前，他给了我机会并提供了巨大的支持和动力。感谢他从数百万中选中我成为本书的作者，并激励我做完这件事。


    还要感谢我的内容编辑 Natasha Dsouza 和 Owen Roberts。每当我遇到困难时，你们总是准备好伸出援手。感谢由于巨大的工作压力导致中间章节失去写作节奏时，你们的理解与配合。特别感谢
    Natasha，她投入了大量时间来编辑内容并使其完善，并在我写作期间一直支持我。


    然后，感谢我的技术内容开发人员 David Alcoba、Siddartha Bhave 和 Cédric Verstraeten。衷心感谢你们投入宝的时间对本书进行技术评审，并对内容提供了非常有用的补充和宝贵的意见，使其对读者更有趣。通过整合你们的宝贵建议，这本书取得了非常好的形状。


    我如何能忘记 Shiny Poojary，她从技术上编辑了这本书，并过滤了内容中的错误。她完全改变了书的呈现方式。感谢她的持续支持，不知疲倦地按时编辑书籍并将其推向最终阶段。我感谢
    Packt Publishing 所有直接或间接参与此项目的员工，他们管理好了一切并将其交到读者手中。


    感谢我的朋友、教授和同事。我想感谢所有进入我生活的朋友，他们带给我快乐，支持我完成这件事，并在我开始写这本书之前祝愿我一切如愿。感谢 VIT 大学的教授们，特别感谢
    Arun Manoharan 博士，让我对成为作者有了微小但非常有用的见解。我在 Leaf Technologies 的同事总是向我了解这本书的进展，并鼓励我加入高质量的内容。


    最后，我诚挚地感谢我的父母，每天询问我这本书的进展，尽管这些时间曾让我远离了他们。


    # 关于审核员


    David Alcoba 多年来一直认为自己是一个在空余时间喜欢玩电子产品的软件工程师。在负责设计和构建行业高安全性分布式应用程序的同时，他决定每天获取更多数字制造工具的知识。就在那时，他意识到自己发现了一个可以将他不同兴趣整合到一个项目中的世界。


    基于这个想法，他在 2014 年创立了 Vailets Hacklab，这是一个位于巴塞罗的当地社区，旨在让孩子们成为未来的创造者，而不仅仅是消费者。


    遵循这一倡议的精神，David 决定共同创立 Makerkids，这是一家专注于为学校和机构提供服务的初创公司，旨在让青少年参与并遵循 STEAM（科学、技术、工程、艺术和数学）教育原则。


    现在，David 觉得自己不再是一个工程师，而是一个制造者（Maker）。


    Siddhartha Bhave 是华盛顿大学数据科学中心的大数据研究员。凭借电子和嵌入式系统的背景，他对 Hadoop 和 Spark 等大数据技术的分布式系统方面感兴趣。Siddharth
    在 Xeon 服务器上实现并分析各种机器学习算法。表征算法的行为和研究算法的可扩展性他在 Intel 实习期间学到的。在获得计算机科学学位期间，他开发了一种中间件，用于将实时传感器数据馈送到树莓派节点集群。他希望将他的工作转化为扩展和扩大物联网的概念。


    > 我想感谢我的家人和朋友，他们一直信任我，感谢我所有的老师和教授，他们一直激励我。


    Cédric Verstraeten 拥有工程硕士学位，主要活跃在 C++ 社区。他担任软件工程师，也是一个极大的开源爱好者。他大部分时间都花在自动化和简化生活的侧边项目上。他是树莓派比利时地区聚会的组织者。


    > 我感谢 Packt Publishing 让我担任这本书的审核员。我真的认为他们的书籍可以为对特定主题提供深入的概述。


    '
