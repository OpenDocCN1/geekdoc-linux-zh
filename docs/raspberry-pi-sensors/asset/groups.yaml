    that is, 50us+70us=120us. If we consider sequentially reading the method twice
    (mentioned in datasheet), the total time is 2*(40bits*120us)=96µS. We will wait
    for the acknowledgement pulse approximately for 100µS. We will run the for to
    obtain data from the sensor at least 100 times.


    ```

    for (pulse = 0; pulse<100; pulse++)

    {}

