  - '[PAGE 174]


    # Creating an Image Sensor Using a Camera and OpenCV


    The code can now be saved as motion.cpp in the home folder or a place of your

    name. The names used in this code are self-explanatory enough,

    though some the functions and variables are listed here with their explanations.

    Take a look at the description of following commands used in the code:


    cvImage*


    Whenever the cvLoadImage or cvQueryFrame function is called, the pointer to an

    allocated image data structure is returned. This pointer will be used as a reference
    to

    an image. Basically, this shows the memory location of the first pixel of an image.


    ```

    cvCreateImage(cvGetSize(img3), IPL_DEPTH_8U,1)

    ```


    This creates an image and allocates the data from the pointing address

    to that image. There are a total of three fields, in which the first is the size
    of an image.

    In the first field, we have called a function that gets the size of an already
    declared or

    saved image. The second field in the function defines the bit depth of an image,
    just as

    IPL_DEPTH_8U defines the unsigned-8 bit depth for a single pixel. For higher

    quality images, you can use IPL_DEPTH_64F, which defines the double-precision

    floating point. Consider an 8-bit unsigned integer while working on the RasPi,

    processing can be done smoothly. The third field defines the number of channels
    in

    image.


    ```

    cvCaptureFromCAM(CV_CAP_ANY)

    ```


    This function opens the camera ports and takes images from the interfaced camera

    modules. Entering CV_CAP_ANY allows OpenCV to choose the cameras interfaced. The

    RasPi will choose the camera according to cvCreateCamera*. This function

    works the same way as cvCapture* image = cvCreateCameraCapture(CV_CAP_

    ANY). If multiple camera modules are interfaced and you want to choose the camera

    before capturing, you can use cvCreateCameraCapture(-1) to open a window that

    will allow you to select the camera interfaced.


    ```

    cvAbsDiff(img1,img2,img3)

    ```


    This function calculates the absolute difference between two image arrays and
    stores

    it in the destination image. Here, the result will be stored in img3 by performing
    the

    img3 = img1 - img2 operation. This will be helpful to us for detecting the change

    in the current image by subtracting it from the reference image.


    ```

    cvCvtColor(img3,result,CV_BGR2GRAY)

    ```'
  - '[PAGE 175]


    The function can be useful for converting the color space of the img3 image and
    to store the resulting image. The third field in the function is the color space
    conversion code. This code will convert the RGB (red, green, and blue) image into
    a grayscale image.


    > Note that the default color format in OpenCV is often mentioned as RGR, but
    it is actually BGR (the bytes are swapped).


    ```

    cvThreshold(result,result,10,255,CV_THRESH_BINARY)

    ```


    Mostly, the threshold function is used to convert a grayscale image into a binary
    image. If the pixel value is less than the threshold value, then replace pixel
    with 0 (black); otherwise, use 1 (white). There are a total of five fields in
    the function. The source and the destination are the first two fields. The third
    is the threshold value, which can be tweaked with different experiments. If CV_THRESH_BINARY
    is used, then the maximum value to be used is 255 (white), which is defined by
    the fourth field. There are multiple options available in this, but this function
    helps us convert into a binary image. The function for the binary image threshold
    can be defined as result(x, y) = 255 if img(x, y) > 10 otherwise result(x, y)
    = 0.


    ```

    cvErode(result,result,0,2)

    ```


    In many applications, an erosion function is performed to remove salt noise from
    the image. Due to the threshold operation on the image, there could be noise in
    the image pixels, which can create a false result while taking the average value
    of an image. In our application, the erosion function deletes the boundaries of
    the white object. Therefore, the small white dots will be completely removed from
    the image after performing two iterations. There are four fields, with source
    and destination as the third field defines the structuring element, which will
    be zero in our case. The fourth element states the number of erosion iterations
    to be performed on an image, like this:


    ![](img/294138a424db5b37c44c0a7ad39ef037_175_0.png)'
  - '[PAGE 176]


    # Creating an Image Sensor Using a Camera and OpenCV


    The preceding image has three sections. Image (a) is the result after the execution
    of the cvAbsDiff and cvThreshold functions. The movement of the intruder can be
    seen in the image. The white noise is clearly visible after the threshold function.
    Image (b) is the result after performing the cvErode function. It removes the
    salt noise by erasing the boundaries of white objects or pixels in the image.
    Finally, image (c) is the result after the cvDilate function, which is described
    next:


    cvDilate(result, result, 0,2)


    A dilation function is the reverse of an erosion function. After removing the
    salt noise, the dilation function improves the group of white pixels at the edges
    of an image.


    The code flow can be understood in this way: section 1 in the code defines the
    variables and captures an image imagecapture, which will be used as the current
    image captured by a camera in section 2. Next, section 2 starts with an infinite
    loop, and we are saving the current image and loading it back into a variable
    img1. The commented code can be uncommented when debugging to track the correctly
    captured images by triggering the window-opening function. In section 3, the reference
    image is saved and loaded into the img2 variable. The absolute difference between
    the reference and the current image will be taken, and stored in img3. This can
    create some confusion; before taking the absolute difference, why is the reference
    loaded into img3? The reason behind this is that img3 needs the same resolution
    as img1 and img2. Otherwise, OpenCV will show an error of mismatch and that the
    subtraction could not be performed. Section 4 is dedicated to image processing
    functions, such as converting an image to grayscale and performing a threshold
    operation on an image to make the image binary. Section 5 takes the decision as
    to whether to trigger the GPIO or not. Section 6 is all about saving the files
    and releasing the memory. Keeping the delay between the operations is very important
    because the RasPi and OpenCV take their own time to perform operations and save
    the files. That''s all! We are ready to compile the code now.


    # Preparing shell to compile OpenCV and wiringPi


    After preparing the code, it could be difficult for use to debug unless we prepare
    a generic shell script. The use case of this shell file is to compile all the
    C and C++ files in the same folder. Whether the code is in C or C++, if the code
    contains the OpenCV and wiringPi libraries, it can be compiled to generate an
    output file with the same name as the code filename.'
