    \n```cpp\ncvCreateImage(cvGetSize(img3), IPL_DEPTH_8U,1)\n```\n\n这创建了一个图像并将从指向的地址分配数据到该图像。总共有三个字段，其中第一个是图像的大小。在第一个字段中，我们调用了一个函数来获取已声明或保存图像的大小。函数中的第二个字段定义了图像的位深，就像\
    \ `IPL_DEPTH_8U` 定义了单个像素的无符号 8 位深度。对于更高质量的图像，你可以使用 `IPL_DEPTH_64F`，它定义了双精度浮点数。在\
    \ RasPi 上工作时，考虑 8 位无符号整数，可以流畅地处理。第三个字段定义了图像的通道数。\n\n```cpp\ncvCaptureFromCAM(CV_CAP_ANY)\n\
    ```\n\n此函数打开摄像头端口并从接口摄像头模块中获取图像。输入 `CV_CAP_ANY` 允许 OpenCV 选择接口的摄像头。RasPi 将根据 `cvCreateCamera*`\
    \ 选择摄像头。此函数的工作原理与 `cvCapture* image = cvCreateCameraCapture(CV_CAP_ANY)` 。如果连接了多个摄像头模块，并且你想在捕获之前选择摄像头，可以使用\
    \ `cvCreateCameraCapture(-1)` 打开一个窗口，允许你选择接口的摄像头。\n\n```cpp\ncvAbsDiff(img1,img2,img3)\n\
    ```\n\n此函数计算两个数组之间的绝对差并将其存储在目标图像中。在这里，结果将通过执行 `img3 = img1 - img2` 操作存储在 `img3`\
    \ 中。有助于我们通过从参考图像减去当前图像来检测当前图像的变化。\n\n```cpp\ncvCvtColor(img3,result,CV_BGR2GRAY)\n\
    ```\n\n该函数可以转换 `img3` 图像的颜色空间并存储生成的图像。函数中的第三字段是颜色空间转换代码。此代码将 RGB（红、绿、蓝）图像转换为灰度图像。\n\
    \n> 注意，OpenCV 中的默认颜色格式通常被称为 RGR，但实际上是 BGR（字节已交换）。\n\n```cpp\ncvThreshold(result,result,10,255,CV_THRESH_BINARY)\n\
    ```\n\n大多数情况下，阈值函数用于将灰度图像转换为二值图像。如果像素值小于阈值值，则将像素替换为 0（黑色）；否则使用 1（白色）。该函数中总共有五个字段。源和目标是前两个字段。第三个是阈值，可以通过不同的实验进行调优。如果使用\
    \ `CV_THRESH_BINARY`，则使用的最大值为 255（白色），这由第四个字段定义。这里有多个可用选项，但此函数帮助我们转换为二值图像。二值图像阈值函数可以定义为\
    \ `result(x, y) = 255` 如果 `img(x, y) > 10`，否则 `result(x, y) = 0`。\n\n```cpp\n\
    cvErode(result,result,0,2)\n```\n\n在许多应用程序中，执行腐蚀函数是为了去除图像中的盐噪声。由于对图像进行了阈值操作，图像像素中存在噪声，这在取图像平均值时可能会产生错误结果。在我们的应用程序中，腐蚀函数删除白色对象的边界。因此，在执行两次迭代后，小的白点将从图像中完全移除。共有四个字段，源和目标之后的第三字段定义了结构元素，在我们案例中为零。第四个元素说明了在图像上执行的腐蚀迭代次数，如下：\n\
    \n![](img/294138a424db5b37c44c0a7ad39ef037_175_0.png)\n\n"
