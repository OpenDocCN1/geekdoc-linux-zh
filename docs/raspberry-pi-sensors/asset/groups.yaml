    # About the Author


    Rushi Gajjar is an embedded systems hardware developer and a lifetime electronics
    enthusiast. He works in the field of research and development of high-speed single-board
    embedded computers and wireless sensor nodes for the Internet of Things. Apart
    from that, he studied MTech in embedded systems by being involved in research
    at VIT University, Vellore.


    Prior to this, his extensive work as a freelancer in the domain of electronics
    hardware design introduced him to rapid prototyping development boards such as
    the Raspberry Pi. In his spare time, he loves to develop projects on Raspberry
    Pi that include vision, data logging, web servers, and machine learning automation
    systems. He loves to teach Raspberry Pi projects to school students.


    His vision encompasses connecting every entity in the world to the Internet to
    enhance the human living experience. His hobbies include playing the table, photography,
    and travelling.


    # Acknowledgements


    First of all, I must say thanks to my acquisition editor Richard Harvey. I never
    knew that I could write a book on such an amazing topic as Raspberry Pi Sensors.
    He gave me the opportunity and tremendous support and motivation before I wrote
    the initial chapters. Thanks for selecting me out of millions as the author of
    this book and inspiring me to do this.


    Thanks also goes to my content editors Natasha Dsouza and Owen Roberts. You were
    always ready to lend me a hand wherever I was stuck. Thanks for the understanding
    and cooperation when I lost my pace of writing in the intermediate chapters due
    to tremendous work pressure. Special thanks to Natasha, who has poured hours of
    her time to edit the content and make it better, and supported me throughout the
    time I spent writing this book.


    Then, thanks to my technical content developers David Alcoba, Siddhartha Bhave,
    and Cédric Verstraeten. I sincerely thank you for investing your precious time
    technically reviewing this book, and providing very useful additions and valuable
    comments over the content, to make it more interesting for readers. By incorporating
    your valuable suggestions, this book has achieved a really good shape.


    How can I forget Shiny Poojary and who edited the book technically and filtered
    out errors in the content of the book. They totally changed the presentation of
    the book. I thank her for her continuous support, untiringly to edit the book
    on time, and taking it to the final stage. I also thank all the employees of Packt
    Publishing who were directly or indirectly involved in this project, for managing
    everything and delivering it to the readers'' hands.


    Thanks to my friends, professors, and colleagues. I would like to thank all my
    friends, who have been part of my life, given me happiness, supported me to do
    this and wished me the best before I started working on this book. Thanks to the
    professors at VIT University, and special thanks to Dr. Arun Manoharan for giving
    me a small but very helpful insight into being an author. My colleagues at Leaf
    Technologies always took updates from me about the progress of this book and encouraged
    me to include strong content.


    Above all, I would sincerely like to thank my parents for asking me every day
    about this book''s progress and showing keen interest in seeing it take shape,
    in spite of all the time for which it kept me away from them.


    # About the Reviewers


    David Alcoba, for many years, considered himself a software engineer who liked
    to play with electronics in his spare time. While being responsible for designing
    and building highly secure distributed applications for the industry, he also
    decided to start gaining more and more knowledge of digital fabrication tools
    every day. And it was then that he realized he had just discovered a world where
    all of his different interests could be merged into a single project.


    Based on this idea, he created Vailets Hacklab in 2014, a local community in Barcelona
    that aims to hack the current educational system so that kids might be co-creators
    of their future through technology, instead of being just consumers.


    Following the spirit of this initiative, David decided to cofound Makerkids Barcelona,
    a small start-up focused on providing professional services for schools and organizations
    to engage kids with the new movement and follow the STEAM (science, technology,
    engineering, art, and mathematics) educative principles.


    Nowadays, David feels that he is not an engineer anymore but a maker.


    Siddhartha Bhave is a big data researcher at the Center for Data Science at the
    University of Washington. With a background in electronics and embedded systems,
    he is interested in the distributed systems aspect of recent big data technologies
    such as Hadoop and Spark. Siddharth implements and analyzes various machine learning
    algorithms on Xeon servers. Characterizing their behavior and studying the scalability
    of algorithms is something that he picked up during his internship at Intel. During
    his degree in computer science, he worked on developing a piece of middleware
    to work with real-time sensor data feed to a cluster of Raspberry Pi nodes. He
    wants to translate his work to scale and expand the concept of Internet of Things.


    > I would like to thank my family and friends, who always believe in me, and all
    my teachers and professors, who always inspire me.


    Cédric Verstraeten holds an MSc in engineering and is primarily active in the
    C++ community. He works as a software engineer and is a huge open source enthusiast.
    He spends most of his time on side projects that can automate and simplify people''s
    lives. He''s the organizer of the Raspberry Pi Belgium meet-up.


    > I would like to thank Packt Publishing for allowing me to be a reviewer for
    this book. I really think their books can give people an in-depth overview of
    a particular topic.

    '
