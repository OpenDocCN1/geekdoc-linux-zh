    # 使用 ADC 为树莓派连接任何模拟传感器


    目前，我们还不知道将要接入什么种类型的传感器。一旦传感器接入，就应该创建转换公式并导入到同一代码中。要添加转换后的数据，只需使用 `datalist.append(variable)`，该值将存储在数据文件中，以逗号分隔并分单行显示。`for`
    循环的每次序列都会生成一行。你可以通过在你的传感器站上连接不同的传感器来尝试不同的值和转换方法。祝玩得开心！


    > 你可以像在第 3 章“使用声波传感器测量距离”中那样使用 `crontab`，将这段 Python 代码设置为启动自启。


    # 总结


    从模拟数字转换器的基础开始，你掌握了在使用 ADC 模块时需要遵循的流程。你理解了处理模拟数据有多么重要，以及为什么处理器需要独立的内核来处理这些输入数据。我们领略了
    MCP3008 IC 及其功能。我们制作了自己的传感器站，它可以与任何型号的树莓派无缝集成。然后，你理解了如何将 SPI 功能移植到 Python 代码中，并成功将数据转换为数字格式。现在可以在
    .csv 文件上进行数据记录以便对数据进行处理。通过本章，传感器接入和记录变得比任何时候都简单。你可以连接你需要的任何数量传感器、使用不同的传感器，并在到处部署传感器站来获取数据。


    在本章中，我们收集了离线数据，这些数据可以在记录后进行后处理。在下一章中，我们将数据上传到在线，以便查看远程的实时图表。此外，我们还将启用树莓派向指定的电子邮件
    ID 发送带有传感器数据的电子邮件。这将是你创建自己的物联网产品的第一步。准备好迎接这个令人兴奋的项目吧！


    # 将数据上传到在线 – 电子表格、手机和电子邮件


    到目前为止，我们观察了树莓派计算的数据，但并没有处理这些数据。它们被生成、观察，并在做出决策后被丢弃。在上一章中，我们将一些数据记录在 .csv 文件中，这看起来像是传统的数据记录方法。当这些数据记录到互联网时，将非常有用。如果我们设置树莓派每秒从家里发送数据，并在世界任何角落查看参数的图表，那会怎样？如果在发生任何关键情况时你收到电子邮件通知，那会怎样？如果每天结束时数据分析通过电子邮件发送给你，那不是很好吗？


    我知道，当我们休假甚至在办公室工作时，总是担心家里。当你离开住所时，会有大量数据需要处理，例如温度、湿度、运动、火灾报警、未经授权的侵入、能耗、设备状态等。使用神奇的树莓派，将你的家变成智能家居有无限可能。


    在本章中，你将学习所有这些事情如何一次性完成。你将理解到物联网（IoT）是每个技术极客在早餐桌上讨论的话题。你还将学习通信是如何进行的，以及连接到物联网的传感器节点和设备是如何工作的。你将了解为什么数据分析、云存储和云访问技术如此蓬勃。一方面，我们获得了便利，但另一方面，在部署这项技术时，有一些需要解决的安全顾虑。你将了解到这些安全问题有多严重。


    将数据上传到在线 – 电子表格、手机和电子邮件


    我们在上一章中开发了一个传感器站。我们将使用这个传感器站并在进行硬件设置的同时，从不同的传感器收集数据。下一步，我们将通过将数据推送到在线将其上传到 Google
    电子表格，并在桌面以及 Android 和 iOS 移动手机上查看传感器数据的实时图表。然后，我们将设置树莓派向我们发送一整天收集的数据，以及传感器达到的最小值和最大值。当家里发生关键情况时，它还能发送电子邮件。


    这一章听起来非常有趣——通过赋予树莓派智能以在线观察传感器数据来学习。让我们从理解物联网开始这段旅程吧。


    # 物联网


    物联网已吸引科学家、创新者、技术人员、工程师和投资者的加入，让他们开始开发并参与全球增长最快的市场之一。它可以实现这些人让世界变得更好居住的愿景。一旦在大范围内实施，它将使我们的生活变得更舒适、更安全。这场革命从重新设计和替换我们日常生活中最小、最基础的设备开始。据说，到
    2020 年，除去手机和平电脑，物联网将拥有约 300 亿台设备。从牙刷到鞋子、钱包、洗衣机、开关、汽车等，它们都将成为物联网的一部分。


    一些物联网设备会学习我们的日常习惯并采纳它们，然后通过自行决策做出响应。通过为每个物理实体添加通信功能，看到每个物理实体发生变革，确实非常惊奇。物联网并没有特定的定义。从技术上讲，我们可以将物联网理解为添加互联网连接（基本上是一个唯一的互联网地址），以及感知日常物理物体或实体的能力，这些实体可以相互以及移动设备（如手机和可穿戴设备）通信。社区中的一些人认为物联网空间过载了，因为它包含了许多预期并增加了许多冗余设备，这些设备并不是真的为了给生活带来舒适，而是被强行添加的。


    > 人工智能和物联网有趣的项目之一是 Jibo，一个家庭机器人。请查看 http://www.jibo.com。


    # 第六章


    物联网可以表示为设备、网络、数据、计算、分析和人的集成结构。我们可以将物联网想象为在家庭中广泛映射的连接，连接灯光、风扇、恒温器、热水器、开关、冰箱、空调等媒体设备。想象一种情况：在长长的假期结束后回到机场，由于家里没人，室内温度无法忍受。一旦你的手机连接到互联网，家里的空调就会知道你回到了城市。它将根据交通状况估计你的到达时间并设置制冷。此外，它还会根据你的日常习惯知道设置多少温度。反之，当你出发度假时，家里的设备知道你手机的位置，并禁用手机应用程序中所有不必要的设备。也可以通过手机应用程序手动控制。物联网技术不仅适用于家庭，还适用于酒店、医院、工厂、办公室和交通——简而言之，无处不在。真的，这将是万物联网。


    # 传感器节点


    众周知，在一个地方可以感知许多参数。我们已经建立了一个传感器站，一旦安装在家里或办公室的角落，它就可以被称为传感器节点。然后它将静静地观察周围并存储所有数据。想象连接节点到互联网，以及许多这样的节点。传感器节点可以是任何尺寸，例如，从桌面投影仪的大小一直到尘粒的大小！所以，我们可以称之为智能尘埃吗？是的！研究人员已经实现了智能尘颗粒（也称为微型传感器），它们从光、温度或薄电池获取能量。广泛使用的传感器节点尺寸从指尖到手掌不等。这些传感器可以在目标区域内创建一个广泛的网络，数量从数百个到数千个不等。


    '
