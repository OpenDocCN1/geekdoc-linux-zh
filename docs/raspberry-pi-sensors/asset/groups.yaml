    # USB webcam


    It can be cheaper you interface your desktop computer''s webcam by compromising
    performance. Not all webcams are supported on the RasPi. You can check out the
    list of webcams and cameras supported by Linux at http://www.ideasonboard.org/uvc/#devices.


    There is a trade-off between speed, cost, and versatility using a USB webcam compared
    to the Raspberry Pi camera module. If you choose a USB camera, you will get degraded
    performance, but you will be able to interface a USB webcam with any of your single-board
    embedded computers in future. USB cameras are definitely cost-effective. To add,
    a strong USB cable and static-proof casings provide a longer life compared to
    the Raspberry Pi camera module.


