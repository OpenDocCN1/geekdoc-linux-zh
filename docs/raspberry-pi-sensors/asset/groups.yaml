    # 电子学基础术语


    电子世界存在大量的术语。从硬件到软件，有数百万个概念被用于创建惊人的产品和项目。你已经知道 RasPi（树莓派）是一台单板计算机，它包含了大量的电子元件，这使得我们能够非常方便地控制和通过其
    GPIO 接口连接数字电子设备。通常情况下，当我们谈论电子学时，它指的是硬件，或由多个集成电路（IC）以及不同的电阻、电容、电感等许多组件组成的电路。但情况并非总是如此；当我们使用可编程
    IC 构建硬件时，我们还需要考虑内部编程（软件）。例如，在微控制器或微处理器中，或者在 RasPi 的情况下，我们可以将程序（技术上是永久/写入程序）到 IC
    中，这样当 IC 通电时，它就会按照程序中编写步骤运行，并按照我们的的方式运行。这就是机器人、洗衣机和其他家电的工作原理。所有电器都有不同的设计复杂度，这取决于它们的应用。有些功能可以通过软件和硬件完成。设计者必须通过实验来分析权衡；例如，解码功能可以写在软件中，也可以通过连接逻辑
    IC 在硬件上实现。开发者必须分析速度、尺寸（硬件和软件方面）、复杂度以及许多参数来设计这类功能。讨论这些理论的点仅仅是为了说明电子设备可以有多复杂。我们现在不需要深入研究电子学，但对你来说，了解这些术语非常重要，因为在构建
    RasPi 项目时你会频繁用到它们。


    # 电压


    是谁发现了电压？好了，现在这不重要，让我们先理解它。基本概念遵循水流背后的物理学原理。水有两种流动方式：一种是瀑布（例如，从山顶到地面），另一种是使用水泵的强制流动。电压背后的概念相似。电压是两点之间的电差，这意味着电压差允许电荷（电子）从高电位流向低电位。为了理解前面的例子，考虑一下闪电，它可以比作瀑布；而电池可以比作水泵。当电池连接到电路时，化学反应会将电荷流从正极泵到负极。电压通常以伏（V）为单位。AA
    电池通常提供 3V。顺便提一下，电压一词是以伟大的科学家亚历山德·伏特（Alessandro Volta）命名的，他发明了伏特电池，当时被称为电池单元。


    # 电流


    电流是电荷（电子）的流动。每当产生电压差时，会导致电流以固定方向从正极（高电位）流向负极（低电位）（称为规定电流）。电流以安培（A）为单位。电子流从电池的负极流向正极。为了避免混淆，我们将遵循规定电流，即从电池或电源的正极流向负极。


    # 电阻


    牛津词典中“resist”一词的意思是“试图阻止或防止”。正如定义所说，电阻简单地防止电流的流动。当电流流过电阻时，内部会产生电压降。这种下降直接取决于流过电阻的量以及电阻值。有一个公式可以计算跨电阻（或电路中）的电压，这被称为欧姆定律（V=
    I * R）。电阻以欧姆（Ω）为单位。让我们通过这个例子看看如何计算电阻：如果电阻为 10Ω，流过电阻的电流为 1A，那么电阻两端的电压降为 10V。另一个例子：当我们在
    5V 电上连接 LED 时，我们会与 LED 串联一个 330Ω 的电阻，以防止电流过大导致 LED 烧毁。电阻消耗了部分电压保护了 LED。我们在开发项目中将广泛使用电阻。


    # 电容


    电阻以热的形式耗散能量。相比之下，电容在其两个导电板之间储存能量。电容通常用于过滤滤波电路中提供的电压，并在放大器电路中产生清晰的声音。解释电容的概念对这里来说太沉了，所以让我进入正题：当我们有电池来储存能量时，为什么要在电路中使用电容呢？在电路中使用电容有几个好处。许多书会告诉你它充当滤波器或浪涌抑制器，它们会使用电源平滑、去耦、直流隔绝等术语。在我们的应用中，电容与传感器一起使用，它们保持一段时间电压，以便微处理器有足够的时间读取电压值。传感器的数据变化很大。只要微处理器正在读取该值，它就需要保持稳定，以避免错误计算。电容的保持时间取决于
    RC 时间常，我们将在实际使用它时进行解释。


    # 开路和短路


    现在，有一个值得注意的点：当端子上存在电压但端子之间没有连接元件时，没有电流流动，这通常被称为开路。相比之下，当两个端子连接（无论是否连接元件）并允许电荷流动时，被称为短路、接通电路或闭路。


    > 这里有一个警告：不要短路（直接连接）电源的端子，例如电池、适配器和充电器。可能会导致严重损坏，包括火灾和元件故障。如果我们连接一根没有电阻的导线，看看欧姆定律的结果：R
    = 0Ω 则 I = V/0，所以 I = ∞。在理论上，这被称为无限（可数的），在实际上，这意味着火灾或爆炸！


    # 串联和并联


    在电理论中，当流过元件的电流不分成路径时，它是串联。同样，如果流过每个元件的电流相同，则这些元件被称为串联。如果所有元件两的电压相同，则该连接被称为并联。在电路中，可以是串联和并联的组合。因此，电路可能不是纯串联或纯并联电路。让我们学习图中所示的电路：


    ![](img/294138a424db5b37c44c0a7ad39ef037_54_0.png)


    # 第二章


    初看，这张图看起来很复杂，有很多符号，但让我们单独观察每个元件。左图的图是元件的串联。电池提供电压（V）和电流（I）。电流的方向显示为顺时针。在串联中，流过每个元件的电流是相同的，但所有元件上的电压值是不同的。因此，V
    = V1 + V2 + V3。例如，如果电池提供 12V，每个电阻上的电压为 4V。流过每个电阻的电流为 4 mA（因为 V = IR 且 R = R1 +
    R2 + R3 = 3K）。


    右图表示并联。在这里，每个元件获得相同的电压，但电流被分成不同的路径。从电池正极流出的电流是 I，它分为 I1 和 I2。当 I 流向下一个节点时，它再次分成两部分流过
    R5 和 R6。因此，在并联电路中，I = I1 + I2。所有电阻上的电压保持相同。例如，如果电池提供 12V，所有电阻的电压均为 12V，但通过所有电阻的电流将是不同的。在并联示例中，可以通过应用分流公式计算流过每个电路的电流。尝试计算一下！


    当存在串并联电路组合时，需要更多的计算和分析。基尔霍夫定律、节点方程和网路方程可以用于解决这类电路。这些内容在书中解释太复杂了；你可以参考任何标准的电路理论相关书籍并获得专业知识。


    > 基尔霍夫电流定律：在电子电路的任何节点（接点）处，流入节点的电流之和等于流出节点的电流之和。

    > 基尔霍夫电压定律：任何闭合网络周围的电位差（电压）的方向矢量和为零。


    '
