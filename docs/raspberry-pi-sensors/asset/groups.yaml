    # Using ADC to Interface any Sensor with the Raspberry Pi


    Once this installation is done, we have to enable the SPI functionality for the
    Raspberry board. Because of its rare use, the SPI port is disabled by default.
    Therefore, it is listed under the `blacklist` configuration file under the `/etc`
    directory:


    ```

    sudo nano /etc/modprobe.d/raspi-blacklist.conf

    ```


    This command will open the configuration file in a nano editor. Find out this
    line `spi-bcm2708` by scrolling down with keyboard. Press the # sign before avoid
    blocking the SPI port during the startup process. Press `Ctrl + X` and then press
    Y, followed by `Enter` to save the configuration file. After this process, we
    have to reboot the RasPi again:


    ```

    sudo reboot

    ```


    Now, check whether the RasPi Linux kernel has loaded the SPI drivers while booting
    or not. Enter the following command and check for the SPI drivers in the list:


    ```

    lsmod

    ```


    It is always tricky to work with protocols as SPI unless some handy library helps
    us. Thanks to `doceme` for sharing the `python-spidev` library on GitHub, which
    provides us with the functionalities to pull and push the data from the SPI port.
    Create a new folder for your project and download the `spidev` library:


    ```

    mkdir mcpgeneric

    cd mcpgeneric

    get https://raw.github.com/doceme/py-spidev/master/spidev_module.c

    get https://raw.github.com/doceme/py-spidev/master/setup.py

    sudo python setup.py

    ```


    Once the installation is done, we are good to go for writing code for our sensor
    station. To understand the code, you first need to understand the data to be sent
    to the MCP3008. As mentioned earlier in the introduction of MCP3008, we know that
    in MCP3008, there are two modes: the single-ended and the differential mode.


    Setting up the chip select and clock is taken care of the `spi-dev` library, but
    we need to understand the data transfer operations of MCP3008. How can the IC
    understand that it performs a single-ended or differential-ended function? For
    that, we need to send a control command from the master, which is our RasPi itself.
    We need to send a nibble (4-bit) of data to MCP3008 as a command that has to work
    on a single-ended mode and provide data from the x channel. Take a look at the
    following table and understand most significant bit of a nibble to set 1 to work
    in a single-ended operation:'
  - '[PAGE 129]


    # Chapter 5


    | Single-ended mode (D3) | D2 | D1 | D0 | Channel to read |

    |---|---|---|---||

    | 1 | 0 | 0 | 0 | 1 |

    | 1 | 0 | 0 | 1 | 2 |

    | 1 | 0 | 1 | 1 | 3 |

    | 1 | 0 | 1 | 0 | 4 |

    | 1 | 1 | 0 | 1 | 5 |

    | 1 | 1 | 0 | 0 | 6 |

    | 1 | 1 | 1 | 0 | 7 |

    | 1 | 1 | 1 | 1 | 8 |


    Before initiating the data transfer from the RasPi to MCP3008, we need to set
    the CS pin low, and it should be kept low throughout the conversion. Between two
    conversions, the CS pin must be pulled high for optimum performance. Fortunately,
    the `spi-dev` library takes care of this, and we have to focus more on our logic
    than writing our own library.


    There are two functions in the `spi-dev` library for sending the data to SPI slave
    devices. One is `spi.xfer()`, which works on active chip select. The other function
    performs the `chip select (CS)` low during operation, and the CS high works between
    two blocks of transfers. We will use the `spi.xfer2()` function, since our device
    works on active low chip selects and requires the CS pin to be made high after
    each conversion.


    The data flow should be like this:


    +   - Start bit, (1-bit length, State: High)

    - Control bit, (4-bit length: D0 D1 D2 D3)

    - Wait for the data


    This is how our data will look once we send the request to read channel 1 over
    the SPI line:


    ![](img/294138a424db5b37c44c0a7ad39ef037_129_0.png)


