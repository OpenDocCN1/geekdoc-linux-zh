    # 第 4 章


    拿起 DHT11 传感器并从网格的一侧观察它。从左侧的引脚依次是 VCC (+5V)、数据 (data)、不连接 (NC) 和地线 (ground)。将 DHT
    传感器的 VCC 引脚连接到与 LDR 传感器相同的 +5V 线上。DHT 的数据线需要通过一个 4.7 K 或 10 K 的电阻 (R1) 上拉到 +5V
    线上。否则，可能会在 RasPi 的引脚 16（BCM 模式 GPIO 23）上获得随机数据。地线将供所有设备共用。RasPi 的第 25 号引脚属于“不连接”（DNC）类别，但我们可以将其作为
    GND 引脚。所有的地线都应该通过面包板的地线槽或连接到 RasPi 的单个地引脚来实现公共。


    > 这两个传感器也都在 +3.3V 限制下工作。你可以尝试将从 +5V 线更改为 RasPi GPIO 接口的 +3.3V 引脚（引脚 1）来做实验。在从
    +5V 切换到 +3.3V 线时要小心。这些线在 GPIO 接口上靠得很近，不要在这两条线之间发生任何短路。短路的结果会导致 RasPi 自动关闭/重位。


    # 面包板设置


    一旦理解了电路，在面包板上连接组件就会非常容易。DHT 传感器的方向对于连接至关重要。按照此处所示的图片将 DHT 传感器直接插入面包板。在图中，没有显示
    LED 的连接，因为你足够聪明可以自己连接它们，或者参考第 2 章《走进电子世界》来帮助。面包板上的黑点是可以使用公对公跳线或母对公跳线来建立的连接：


    在进行连接时，确保 RasPi 已关闭并仔细验证所建立的连接。在处理像 RasPi 这样敏感的硬件时，双重检查一切是好事，因为我们不想失去我们的朋友并流泪。


    # 准备代码


    处理 DHT11 传感器相当复杂但并不困难。在这个传感器的同时，我们还连接了 LDR 传感器。我们必须管理这两个传感器的定时。当我们将问题分解为几个实例时，可以很容易地解决。我们将项目分为以下较小的步骤：


    - 1. 理解 DHT 的位带带（bit banging）技术并按照定时序列准备代码。

    - 2. 编写 DHT 传感器的代码并测试。

    - 3. 测试 LDR 传感器的代码。

    - 4. 两个代码并进行测试。

    - 5. 添加比较循环，让 LED 闪亮以显示指示。


    # 编写传感器 代码并测量相对湿度和温度


    众所周知，DHT 传感器工作在单线双向协议上。因此，传感器与 RasPi 之间的同步非常重要。我们必须按照间隔读取传感器。一旦 RasPi 发送请求，DHT
    传感器会同时发送最近读取的湿度数据。由于传感器较慢，根据图中所示的时序图，建议你每 5 秒或更长时间读取传感器或向传感器发送请求，以获取准确数据。


    > 如果你已经建立了硬件，在处理 DHT 传感器时不需要移除 LDR 传感器的连接。


    让我们先看看需要遵循的时序图，然后我们将通过传感器接收到的响应。如果你从左侧观察后续的时序图图像，数据线由一个 4.7KΩ 的电阻上拉（高电平）。因此，每当没有强制性操作（如拉低）或没有数据传输时，线路状态默认被拉高。按照顺序理解该图表，我们将从左向右移动。


    # 使用传感器监测大气状况


    信号有两个逻辑电平：VCC(5V) 和 GND。将线拉高（上拉）是必要的，因为逻辑 1 是传感器数据线上要保持的默认状态。因此，当我们启动 DHT 和 RasPi
    之间的通信时，线路将处于高状态。接下来的时序图仅供我们理解使用。图中没有填充频率和定时数据。


    一旦 RasPi 准备好接收来自 DHT 的数据，它会将线路拉低超过 19 ms 然后再次将其拉高。经过一段时间后，DHT 将感知到 RasPi 已将线路拉至零。随后它向
    RasPi 发送一个持续时间 80µS 的高脉冲确认，并将线路置于低状态。因此，RasPi 将等待这 80us 的脉冲，然后它就会知道传感器将发送数据。在发送确认脉冲后，DHT11
    开始向 RasPi 发送 40 位数据。位流中的数据 0 格式无非低电平持续 50us 和 26–28µs 高电线的组合。同样，逻辑 1 是低电平持续 50us，随后是高逻辑电平持续
    70µs。


    > 八位组成一个字节。四位组成半字节（nibble）。


    接收到的 40 位包含 8 位整数 RH 数据、8 位小数 RH 数据、8 位整数 T 数据、8 位小数 T 数据和 8 位校验和。校验和是所有接收数据之和，我们可以通过它验证所接收的数据是否正确。


    如果接收到的数据是 0011 1101 0000 0000 0001 0010 0000 0010 0110，计算方法为 0011 1101+0000 0000+0001
    1010+0000 0110=。


    将前四个字节相加与最后八字节进行验证，应该观察到前四个字节之和等于最终收到的字节。在给定的示例中，收到的数据看起来是正确的。将二进制转换为十六进制，然后转换为十进制以获得精确值。我们得到湿度=0011
    1101=3D (十六进制) = 61%RH，温度=0001 1010=1A=26 摄氏度。


