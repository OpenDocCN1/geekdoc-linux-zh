    \ Value is 8686\nTEMPERATURE IS HIGH>>FAN ON, LIGHT IS LOW>>TUBE LIGHT ON\nData\
    \ received is corrupted, what did you do?\nLDR Value is 8700\n```\n\n# Troubleshooting\
    \ common problems\n\nWe have covered almost everything on interfacing both of\
    \ these sensors together. If you are still facing the problem in getting/reading\
    \ the data, you could go through some of the problems faced in the following sections.\
    \ In most of the problems, it is advised that you check the connections made on\
    \ the breadboard and correct the RasPi GPIO pin.\n\n# Received DHT data is not\
    \ valid\n\nThe following points need to be kept in mind when the received DHT\
    \ data is not valid:\n\n- First and most, as mentioned earlier, the received data\
    \ directly depends on the connections that you have made. Carefully check the\
    \ connections of the pull-up resistor between data line and +5V line.\n- There\
    \ can be a wrong value for the resistor. If you have connected 4.7KΩ, try to change\
    \ it to 5KΩ, or you can use a maximum 10K resistor. A high value of the resistor\
    \ can turn data into false or corrupted values.\n- Check the DHT data orientation.\
    \ The pin on the left-hand side, seen from front, is the VCC pin.\n\n# The LDR\
    \ sensor gives a zero value\n\nThe following points need to be kept in mind when\
    \ the LDR sensor gives a zero value:\n\n- Check the capacitor value connected\
    \ between the LDR sensor and the ground. A small value of the capacitor voltage\
    \ cannot build much charge. It is highly unlikely that the 1µF capacitor comes\
    \ less than 16V, but check that it is not lesser than 6.3V.\n- Try running the\
    \ Python code for the LDR sensor. If it shows the correct values, then there is\
    \ no problem with the connection. As mentioned earlier, the Python code is simpler\
    \ than the C code. Just check it in the following code:\n\n```python\nimport RPI.GPIO\
    \ as GPIO\nimport time\nGPIO.setmode(GPIO.BCM)\nvalue = 0\nGPIO.setup(4, GPIO.OUT)\n\
    GPIO.output(4, GPIO.LOW)\ntime.sleep(0.2)\nGPIO.setup(4, GPIO.IN)\nwhile (GPIO.input(4)\
    \ == GPIO.LOW):\n    value = value + 1\nprint value\n```\n\n# Is the voltage correct?\n\
    \nThe following points need to be kept in mind when checking whether the voltage\
    \ provided is correct:\n\n- As mentioned earlier, both the sensors can work on\
    \ either +5V or +3.3V. As we have connected a resistor on the data pin of the\
    \ DHT sensor, impressively drops the voltage to a sufficient level to maintain\
    \ the level of the line. On the other side, the LDR sensor itself is a resistor\
    \ to drop enough voltage and charge the capacitor. Insufficient voltage can be\
    \ the problem with the LDR sensor, as it can work from 1.8V to 100V.\n- Some of\
    \ the breadboards have discontinued lines of +5V and ground on the side. Check\
    \ the connectivity of supply lines using the multimeter, and be assured that the\
    \ ground is properly connected and shared with the RasPi.\n\n# Summary\n\nIn this\
    \ chapter, we started with the process of selecting a sensor, in which we got\
    \ to know that the sensor selection process is not as easy as it looks. There\
    \ can be so many parameters, and none of them should be neglected while selecting\
    \ a sensor. This affects the system according to the criticality of the application.\n\
    \nFollowing the explanation to introduction of the DHT and LDR sensors, you continued\
    \ to learn with the tricky DHT sensors. The timing diagram was somewhat complex\
    \ to implement. Due to lack of onboard analog-to-digital, you learned about RC\
    \ time and use of capacitor to integrate sensor with RasPi. Finally, we integrated\
    \ everything and made a project that can be called home automation. Using the\
    \ data of temperature and light captured from sensors, we controlled the appliances\
    \ such as tube, light, and fan.\n\n# 5 Using an ADC to Interface any Analog Sensor\
    \ with the Raspberry Pi\n\nIt is known in the RasPi community that analog-to-digital\
    \ converter (ADC) is not integrated into the RasPi because the onboard processor\
    \ (BCM2835) does not have any functionality to perform the conversion. Had the\
    \ Raspberry Pi integrated ADC module, it would have very easy to interface the\
    \ sensors, since ADC modules are used to convert analog values into digital. Earlier,\
    \ ADCs were made using discrete electronic components, BJTs or operational amplifiers\
    \ and resistors. All the credit goes to integrated circuit developers for integrating\
    \ all things and getting them into the form of a single chip. ADC modules are\
    \ used in almost all kinds of smart equipment, and whenever there is a requirement\
    \ of interfacing a sensor, ADC modules are used in one way or the other— either\
    \ inside the microcontroller or as a dedicated signal conditioning network to\
    \ take care of incoming signal from ADC.\n"
