    # Chapter 3


    So far, the connections we have done are good to go. Cross-check the connection
    twice before you power up the RasPi. We have done the procedure on the hardware.
    We need to write the software (code) to tell the RasPi that we have connected
    this sensor to these pins and to calculate the distance based on the formulas
    we derived.


    # Software setup


    Let''s start writing the code in Python. This code can be separated into the modules.
    These modules can then be integrated as a single code to get the distance. Let''s
    summarize these steps:


    +   - Initial configuration

    - Setting the GPIO pins on the default mode

    - Sending the trigger signal and listening to the echo

    - Calculation of time in detail.


    Let''s see each of them in detail.


    # Initial configuration


    In the initial setup, we need to include or call the GPIO and time libraries,
    which we installed while reading Chapter 1, Meeting Your Buddy – the Raspberry
    Pi, into the Python environment, as shown in the following code:


    ```

    import RPi.GPIO as GPIO

    import time

    GPIO.setmode(GPIO.BCM)

    print "Measuring Distance"

    ```


    As described earlier, the time library brings the timing and delay functionalities
    of the Python code. We will use the BCM mode to call the GPIOs of RasPi, as we
    did in Chapter 2, Meeting the World of Electronics.


    # Setting the GPIO pins on the default mode


    We have connected the sensor''s trigger and echo pins to pins 16 and 18 of RasPi,
    which are GPIO 23 and GPIO 24 in the BCM mode, respectively. We know that the
    trigger pin is the output pin for RasPi and input pin for sensor. The echo pin
    is the input pin for RasPi. Here, it gets the response from the sensor after sending
    the trigger pulse. The following code depicts this:


    ```

    GPIO.setup(23,GPIO.OUT)

    GPIO.setup(24,GPIO.IN)

    ```'
