  - "[PAGE 116]\n\n# Using ADC to Interface any Analog Sensor with the Raspberry Pi\n\
    \nIn this chapter, you will learn how to use and interface the ADC module. You\
    \ will initiate your learning from the basics of ADCs and the simple mathematics\
    \ behind it. Once you've learned the calculations to acquire the analog value,\
    \ we will take a look at a specific ADC IC, known as MCP3008, manufactured by\
    \ Microchip Technology. You will then gain the essential knowledge on MCP3008\
    \ required to prepare generic hardware and from a sensor station that will allow\
    \ you to connect any sensors with it. Similarly, we can write the generic software\
    \ to scan any channel of the ADC convert chip through the RasPi. Using this software,\
    \ we will be able to convert the sensor station into the data logger. This data\
    \ can be finally saved in the .csv file for post-processing.\n\nLet's cover the\
    \ ADCs first. \n\n# Analog-to-digital converters\n\nIn this section, we are going\
    \ to take a look at the types of ADC modules and the conversion process of the\
    \ signal. We will get insights into answering these questions: How the ADC module\
    \ takes care of the incoming data? Do all the ADC modules need external signal\
    \ conditioning circuitry and amplification? How does the ADC module provide the\
    \ data output? How is the quality of the ADC measured? What are the calculations\
    \ required while processing the data?\n\nADC modules are a part of a signal conditioning\
    \ circuitry in a microprocessor or a microcontroller. Unlike the RasPi, most microcontroller\
    \ and microprocessor-based boards have ADC modules embedded, and the signal conditioning\
    \ circuitry too. Most sensors can be directly integrated with these kinds of processors.\
    \ Practically, in sophisticated systems, these conditioning networks have many\
    \ stages for taking care of the incoming data. Some processors have dedicated\
    \ signal processing cores or units to handle the data. ADC and digital-to-analog\
    \ conversion (DAC) topics are so vast that one could write a whole book on explaining\
    \ the functionality and projects on it. Without going into the depths of ADC,\
    \ we will cover the basic terms and functionalities."
  - '[PAGE 117]


    # Data reception and signal conditioning


    When data enters the processor, the ADC module''s first task is to filter the
    unwanted noise from the received sensor signal. This filter is known as the anti-aliasing
    filter, which is used to avoid the aliasing effect observed during sampling. To
    meet the requirement of the Nyquist''s sampling theorem, the sampling rate should
    be double (or greater) the signal frequency''s frequency band stretches and gets
    overlapped while sampling the signals, which creates an unwanted noise and crosstalk
    issues. To overcome this phenomenon, anti-aliasing filters are used to ensure
    that the signals are received in the desired frequency bands. Sometimes an additional
    filter, such as a band-pass filter, is designed to filter out undesired frequencies.


    The amplitude of the signals coming from the sensors is usually weak and varies
    a lot. Nowadays, advanced sensors have the capability to provide a signal powerful
    enough to be fed directly to the microprocessor. However, this is not always the
    case. In analog data acquisition systems, we require the amplified signal to the
    filter input. For that operation, we need the amplification stage prior to or
    after the filtering stage.


    # Amplification


    Sometimes the signals may appear similar to noise signals. Some smart ADC modules
    discard the incoming data due to lack of enough voltage or current (basically
    low power) of the signal. In this case, we use current or voltage or power amplifiers
    to boost the current or voltage power level of a signal respectively. For example,
    a temperature sensor or motion sensor provides very weak signal voltages (mV),
    and this range of voltages is too low for the ADC module to start the conversion
    process. In this case, it is required to boost the voltage to the required voltage
    range. In most circuits, Operational Amplifiers (Op-Amp) are used for amplification
    of voltage and currents. The amplifiers designed to implement signal conditioning
    are log amplifiers, instrumentation amplifiers, peak detectors, and many more.'
  - '[PAGE 118]


    # # Sampling and quantization


    Sampling and quantization are the terms that are widely used in electronics and
    communication theories. These theories are too complex to understand for a beginner
    in electronics. By definition, sampling refers to the process of acquiring voltage
    levels (at a predefined frequency) for the continuously incoming data at an analog
    input pin or the output of an amplifier. Quantization is the process of mapping
    or shortening a large amount of input values by the sampler into a countable set
    of numbers (in this case, the combination of digital bits). Quantization always
    produces a quantization error because it rounds off continuous input values and
    makes approximations to its nearest values.


    # # Types of ADC


    With respect to electronic design, there are multiple design structures available
    for different kind of ADCs. Widely used ADCs include Flash Converter ADCs, successive
    approximation ADCs, sigma-delta ADCs, and many more. A flash Converter ADC uses
    clocks and comparators and operate in parallel mode. It is the fastest way to
    convert analog data into digital bits. A successive approximation ADC also uses
    a comparator to shrink the range of input voltages. It makes approximations by
    comparing the input voltage with the internal DAC and stores the result in a successive
    approximation register. A sigma-delta ADC samples the signal and filters its frequency.
    It counts these pulses at regular intervals, so the pulse counted by the interval
    gives an accurate digital representation. ADC types and descriptions are endless
    and cannot be described in this section. Let''s cover something more important
    now.


    # # Resolution of the ADC


    Resolution of the ADC is one of the most important terms when you describe or
    learn about the ADC. Resolution of the ADC refers to the number of values that
    can be produced over the range of analog input voltage levels. For example, an
    8-bit resolution of an ADC can have 256 different combinations of the values because
    2^8 = 256. In, the number of voltage intervals can be defined by 2^N levels, where
    N is the resolution of ADC in bits. When we talk about resolution, we always take
    reference voltage into account. Reference voltage is another input to be given
    through the dedicated input pin at the analog input of the ADC. Most ADCs have
    two types of input: the reference voltage (mentioned as V_{ref}) and the analog
    input. Let''s take the reference voltage as 5 volts and the resolution of the
    ADC as 8 bits; then 5V/256 = 19.5mV. The ADC convert cannot understand voltage
    changes on the analog pin under 19.5mV.'
  - '[PAGE 119]


    In other words, the ADC module is no more sensitive than 19.5mV. Compare this
    situation with 12-bit ADC, which can be calculated as 5V/4096 = 1.2mV, pretty
    fair, isn''t it? Now we can detect changes in the analog input signal with the
    sensitivity of 1.2mV.


    Reducing the reference voltage is not recommended in most cases because it will
    narrow the window of maximum voltage that can be detected by the ADC. For example,
    if the reference voltage is 3V, then the ADC cannot detect the changes happening
    over 3V because at the reference voltage. It is always recommended to use a higher-bit
    ADC module instead of reducing the reference voltage. The processors, which have
    an integrated ADC, do have a programmable reference voltage, which can be set
    during runtime.


    # The math behind ADC


    As you learned, you know that the principle behind the ADC converter is to convert
    the sensing parameter into voltage levels. For example, let''s take a temperature
    sensor and its working parameters into account. A good temperature sensor works
    on a 5V input supply with 10-bit resolution, 5V reference voltage, and temperature-to-voltage
    conversion equal to 1mV per degree Celsius. It senses temperature in the range
    of 0 degree Celsius to 50 degree Celsius. Therefore, at 50 degree Celsius, it
    will provide the maximum 5V output at the analog pin. The digital conversion equation
    is


    ```

    Digital number = (2^resolution / Vref) * Vin

    ```


    Let''s calculate the value of the digital number converted from the input voltage
    read at the ADC pin:


    10 bits; therefore, 2^resolution = 1024


    Vref = 5V


    Suppose ADC has read 2.9V at the ADC input pin. Then Vin = 2.9V yields Digital
    number = 594 by rounding off.


    Now the resolution of the ADC is V_ref / 1024 = 5 / 1024 = 0.0048 V/count, and
    the temperature-to-voltage conversion scale factor is 1mV per degree Celsius.'
- md: '

    # Using ADC to Interface any Analog Sensor with the Raspberry Pi


    Therefore, to convert the obtained digital value in the temperature value, we
    use this formula:


    Temperature = (594*0.004882)/1024 = 28.9990


    > To avoid floating value calculations, use the following generic formula: Temperature
    = digital value * 4882. This will give you six-to-digit integer. Put the decimal
    point after first two numbers, for example, 594*4882=2899908. After putting the
    decimal point after the first two numbers, 28.9908 is the value of temperature.


    If you carefully see, you''ll notice that the final temperature is just multiplied
    by 10 of the sensor input voltage provided by the temperature sensor. This happened
    because we had 10-bit resolution, which made the mapping count range from 0 to
    1023. Try yourself with the 12-bit ADC values and check the precision and the
    value change.


    ## Data output


    Once the conversion is over, the ADC module provides data on its output port.
    When choosing an ADC module for boards like RasPi, there can be two options: we
    have to choose an ADC module that provides either parallel digital output or data
    on a known standard protocol bus such as UART, SPI, or I2C; or a proprietary protocol.


    ## MCP3008 for analog-to-digital conversion


    The MCP3008 ADC is based on successive approximation ADC architecture with a resolution
    of 10 bits. The MCP3008 has eight input channels for interfacing the sensors on
    the pins. If so many channels are not required, we can select a four-channel input
    ADC chip known as MCP3004. These chips are the best way to interface sensors because
    they support the SPI slave mode to be interfaced with the GPIO pins of the RasPi
    models A+, B, and B+ and RasPi 2 model. This MCP3008 chip should be purchased
    in a dual-line (DIP) package so that we can easily insert it on a breadboard while
    preparing for the project:


    # Chapter 5


    | Pin | Name | Pin | Name |

    |---|---|---|---|

    | 1 | CH0 | VDD | 16 |

    | 2 | CH1 | VREF | 15 |

    | 3 | CH2 | AGND | 14 |

    | 4 | CH3 | CLK | 13 |

    | 5 | CH4 | DOUT | 12 |

    | 6 | CH5 | DIN | 11 |

    | 7 | CH6 | CSN | 10 |

    | 8 | CH7 | DGND | 9 |


    MCP3008


    ## Channels


    In the preceding figure, the pin out of MCP3008 is represented. Pins 1 to 8 to
    the left are CH0 to CH7, which are used for analog input channels 0 to 7 respectively.


    ![](img/294138a424db5b37c44c0a7ad39ef037_121_0.png)


    Among these eight channels in MCP3008, we can use pairs and make it as a four-input
    ADC with pseudo-differential inputs. The difference between pseudo-differential
    and fully differential modes is that in the pseudo-differential mode, the ground
    is separated by a low-value resistor from the common ground for better performance.


    The example of a sensor that works on differential modes is ACS726 for current
    sensing applications in industries for over-current detection and load detection.
    To avoid complexity in the hardware, we will use single-ended operation, where
    one channel will be used to take the input from the sensor to one of the channels
    of MCP3008.


    ## Ground


    In MCP3008, there are two grounds available, AGND and DGND. It is best practice
    in hardware design that the analog ground and digital ground should not be made
    common or tied together. There should be a filter or ferrite bead to improve the
    noise immunity of the digital system. In precision devices, this must be followed,
    but again, our project does not need precision or sophisticated filtering. We
    are happy to tie the analog and digital grounds together, and it is all okay to
    do that in this project.


    # Using ADC to Interface any Analog Sensor with the Raspberry Pi


    ## SPI


    MCP3008 employs four-wire SPI communication. The device is capable of a 200 kps
    (kilo-samples per second) conversion rate. It is important to maintain the minimum
    clock speed while working with SPI-based modules. In the case of MCP3008, the
    timing between the sampling and data output should be at 1.2 ms to effectively
    get the data from the RaspberryPi''s SPI port. The pins present on MCP3008 for
    SPI are CSN, DIN, DOUT, and CLOCK, which are the same as CS, MOSI, MISO, and CLOCK
    respectively on the Raspberry''s GPIO port – similar for any other SPI devices.
    CSN is used to initiate communication with the peripheral slave device.


    > CSN is an active low pin. Remember that you have to pull down the signal to
    zero to start the communication. When it is pulled to high, MCP3008 will end the
    conversion and the device will go into the low-power standby mode. Between two
    ADC requests, CSN must be pulled to high.


    ## Reference voltage


    As described earlier in the Resolution of the ADC section, you learned the importance
    of the reference voltage. It is the same pin where we need to give desired reference
    voltage. One interesting thing to know is there are dedicated chips to provide
    3.3V. If you don''t want to buy a GPCB, this section will give you the idea of
    making the circuit on a breadboard. For example, we will use:


    Digital Number = $(V_{in} / V_{ref})$


    ## Supply voltage


    It is essential to provide 3.3V to the MCP3008. If we use a breadboard, it would
    be easy. But there is much more fun in building a soldered project.


    ## Making your own station


    Until Chapter 4, Monitoring the Atmosphere Using Sensors, we used breadboards
    to create rapid prototyping. Preparing a circuit on a clean and reusable general-purpose
    circuit board (GPCB) requires some instruments, materials, and skills. If you
    don''t have soldering skills, you can build up your skills in an hour or two by
    practicing on junk hardware.


    # Using an ADC to Interface any Analog Sensor with the Raspberry Pi


    Here''s the list of the hardware we need to purchase to start hardware development:


    - A general-purpose circuit board, dual-sided and solderable (2.54 mm pitch)

    - Soldering iron (pencil type, 30 W to 50 W) and soldering core with flux

    - MCP3008 (eight-channel) or MCP3004 (four-channel and DIP package)

    - A single-stranded wire (20-30 AWG)

    - A wire stripper

    - One dual bergst connector (male, 2 x 13 pins, 2.54 mm pitch); one single bergst
    connector (male, 1 x 8 pins, 2.54 mm pitch); and three single bergst connectors
    (males, 1 x 5 pins, 2.54 mm pitch)

    - A GPIO ribbon cable for the Rasp 1 model B (26-pin) or B+ (40-pin) and the Raspberry
    Pi 2 model B (40-pin and female to female)

    - LM35 or LM36; also known as TMP36 or temperature sensor (TO-92 package)

    - Male-to-female and female-to-female jumper wires

    - The Raspberry Pi, a power adapter, an Ethernet cable, and a personal computer


    Place these components on your workbench and start building the circuitry, as
    shown in the following schematic diagram:


