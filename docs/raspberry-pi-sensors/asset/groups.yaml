    # 结识你的伙伴 – 树莓派 (Raspberry Pi)


    世界正在自动化，海量数据正在产生并处理，用于分析、控制和连接。如果充分利用，树莓派板可以提供广泛的自动化和数据处理。这块微小的板提供了丰富的功能和改变我们周围世界的机会。本章是实现这一目标的第一步。


    如果您是初次 Linux 用户或编程初学者，理解许多命令和代码可能会很困难，但改变世界的动力可能足够您开始构建项目。本章提供了一个开始使用树莓派板的简易指南，以及用户连接传感器的完整构建方案。它将让树莓派成为您最好的伙伴。了解本章包含的步骤对于快速构建项目至关重要。本章涵盖了：


    - 对树莓派板及其有用连接器的基础理解

    - 首次安装操作系统的步骤

    - 与树莓派共享互联网连接的独特方法

    - Linux 基础和实用的 Shell 命令

    - 安装重要的库

    - C 和 Python 程序的编译和执行介绍

    - 针对 Shell、C 和 Python 的练习题说明


    # 树莓派板概览


    在我们开始之前，是时候重新介绍我们的好朋友——树莓派了。向该开发板的设计者致敬，他们将完成项目所需的所有内容都集成在一个信用卡大小的印刷电路中，也称为信用卡大小的单板计算机。树莓派有两个版本：树莓派
    1 和树莓派 2。由于早期的开发，树莓派 1 系列由型号 A、A+、B 和 B+ 组成。最近发布的型号是树莓派 2，是 B 型类别的新新增。如今，最常用的树莓派是
    B+ 型，它在树莓派 1 系列中也被称为原始树莓派板。树莓派 1 B 和 B+ 型的前身是 A 型，与 A+ 和 B+ 等型号相比，它在爱好者领域并未被广泛使用。如果您不了解这些板的规格，请查看下表的完整对比，该表包含了树莓派
    1 和 2 当前型号对比参数。然后您就可以选择您想要的板子。


    | 特性 | 树莓派 1 | 树莓派 2 |

    | :--- | :--- | :--- |

    | 型号 | B, A+, B+ | B |

    | 处理器 | BCM2835 | BCM2836 |

    |处理器核心 | 单核 | 四核 |

    | 速度 | 700 MHz | 900 MHz |

    | RAM | 512 MB, 256 MB | 512 MB, 1024 MB |

    | GPU | VideoCore IV | - |

    | 引脚 | 40 针 | 40 针 |

    | 音视频 | HDMI, 3.5 mm 接口, RCA | HDMI |

    | 以太网 | 是 | 是 |

    | 电源 | Micro USB | USB |

    | 数字接口 | CSI (摄像头), DSI (显示器) | - |

    | 内存卡 | SD | SD |


    树莓派 1 配备 BCM2835 处理器和 512 MB RAM。相反，树莓派 2 拥有 BCM2836 处理器，配备 1024 MB RAM。树莓派 1
    A+ 型仍深受许多需要低功率性能的用户喜爱。媒体处理确保了视频应用的流畅。


    我们已经决定让树莓派成为我们的朋友，就像其他伙伴一样，它需要一个独特的名称方便我们称呼；在本书中，每当你提到树莓派时，它就是你的伙伴。


    你的新朋友拥有电脑的所有能力。树莓派可以用来了解电脑的工作原理、学习编程、文字处理和游戏。以下是你可以用树莓派进行的一些小技巧操作：


    - 你想通过通过连接显示器来观看你喜欢的高清电影吗？你可以这样做。

    - 你想将其作为 Web 服务器来运行你的网站吗？使用树莓派没问题。

    - 你在假期期间想玩视频游戏，如《我的世界》吗？你可以尝试使用树莓派。

    - 周末去动物园时想把它当作数码相机使用吗？简单！

    - 你甚至可以使用树莓派制作自己的机器人或无人机。哇！


    所有这些功能都集成在如此小的板上。这让您感到兴奋吗？显然是的！我们可以使用树莓派构建的应用非常多，但它们超本书的范围。


    由于其与外部世界交互的能力，使用树莓派开发的主要应用包括使用传感器识别环境参数并转换为有用数据，以分析和控制我们在后续章节中实验的电器。


    我假设你手里拿着一块树莓派（B 型或 B+ 型），你可能好奇板子上有不同的连接器和电子元件。与其介绍规格术语，我将为您介绍我们制作项目所需的内容。请查看以下图中的不同连接器。此处使用的术语名称将贯穿本书。


    树莓派 1 B+ 型和树莓派 2 B 型外观完全相同，区别仅在于性能。


    '
