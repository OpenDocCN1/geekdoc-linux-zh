    在 MCP3008 中，有两个可用的地：AGND 和 DGND。硬件设计中的最佳实践是模拟地和数字地不应共用或连接在一起。应该设置一个滤波器或磁氧珠来提高数字系统的抗噪声能力。在精密设备中，必须遵循这一点，但再次强调，我们的项目不需要高精度或复杂的过滤。我们乐意将模拟地和数字地连接在一起，在这个项目中这样做完全没问题。


