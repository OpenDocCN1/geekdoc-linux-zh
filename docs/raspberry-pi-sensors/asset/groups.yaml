    # Measuring Distance Using Ultrasonic Sensors


    There is a wonderful program available to copy the files from Windows to the RasPi.
    This program is known as WinSCP (you can download it from www.winscp.net). Give
    it the IP address, login ID, and password of the RasPi by dragging and dropping
    them. If you find difficulty using WinSCP, the operating tutorials could be found
    at https://www.siteground.com/tutorials/ssh/winscp.html.


    We will make a directory called project using the mkdir project command. We will
    perform every operation inside this folder. I am assuming that we are currently
    at /home/pi/project address. You can check it using the pwd cmd.


    As we have downloaded the essential libraries in Chapter 1, Meeting Your Buddy
    – the Raspberry Pi, for the support of wiringPi in C, we will now download a library
    and drivers to play music files on our RasPi. Enter the following commands to
    configure the drivers in your RasPi. These commands hold good for both RasPi 2
    and B+. I assume that you shared an Internet connection to the RasPi as per the
    guidelines of Chapter 1, Meeting Your Buddy – the Raspberry Pi. We are running
    a PuTTY session through an Ethernet cable:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install alsa-utils

    sudo apt-get install mpg3221

    ```


    It will take some time to download, unpack, and install. Once it is installed,
    just reboot the RasPi and start the session of PuTTY again on your PC. We can
    now load the drivers for sound, which we just installed by entering these commands:


    ```

    sudo modprobe snd_bcm2835

    sudo amixer cset numid=3 1

    ```


    Now, it''s time to write the code that measures the distance as well as notifies
    the person with an LED indication and a short-duration beep. Write nano project1.py
    and typing the following code:


    ```

    import RPi.GPIO as GPIO

    import time

    GPIO.setmode(GPIO.BCM)

    GPIO.setwarnings(FALSE)

    print("Measuring Distance"

    print("Press ctrl+c to stop me")

    GPIO.setup(23,GPIO.OUT)

    GPIO.setup(17,GPIO.OUT)

    GPIO.setup(24,GPIO.IN)

    ```'
