    any Analog Sensor with the Raspberry Pi, will be very helpful to us. We will be
    using the sensor station to get the data of the temperature sensor. Listing the
    needs for this chapter, we will require the following:


    +   * A sensor station

    * A temperature sensor (LM35/TMP36)

    * A GPIO ribbon cable for Raspberry Pi model B (26 pin), A+ (40 Pin) or B+ (40
    pin), or RasPi 2 model B (40 Pin); female-to-female

    * Male-to-female and female-to-female jumper wires

    * A Raspberry Pi, a power adapter, an Ethernet cable, a personal computer


