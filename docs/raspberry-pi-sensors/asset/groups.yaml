    - 2. 使用 Gmail ID 登录 http://www.drive.google.com 打开或链接 Google Drive。

    - 3. 在 Google Drive 的用户界面中，在左侧面板上点击“New”（新建）按钮并选择“Spreadsheet”（表格）。

    - 4. 将表格命名为 Logging。

    - 5. 在第一行创建标题 Time（时间）和 Temperature（温度）。

    - 6. 在第二行输入数据。

