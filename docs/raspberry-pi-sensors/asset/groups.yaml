    # # Is the module responding?


    There can be many reasons when the module doesn''t respond. Either you are not
    powering the RasPi with the adequate amount of current, or the connections are
    not proper on the breadboard. The sensor can take quite high amount of current.
    You might be in need to connect the 5V, 1A charger or adaptor to your RasPi. Check
    whether the resistors are correct of correct values either using the resistor-coding
    method or using the multimeter. Take the multimeter and change the delay value
    in program to 5 seconds after turning on the trigger pulse. Check whether pin
    16 is getting high or not. RasPi''s pin 16 should show 3.3V reading on the multimeter.


    # # Are you measuring the distance less than 2 cm?


    The sensor will not respond if any obstacle is very close to it. It is very hard
    for the sensor to measure a very small distance.


