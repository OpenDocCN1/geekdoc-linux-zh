    \n在使用已有的库（如 wiringPi）开发项目时，C 语言提供了充足的益处，它可以让你对 GPIO 引脚有完全的控制。如果你以前用 C 语言开发过项目，你可以集成\
    \ wiringPi 函数并获得与之前项目相同的功能。此外，你还可以同时使用 GPIO。\n\n让我们尝试一下这两种语言；这不会让你完全掌握编程的全貌，但它会给你一个良好的开始并激发兴趣。我们将逐一学习这两种语言。\n\
    \n# 编写并执行 Python 程序\n\n当你使用树莓派（RasPi）时，Python 已经是一个安装好的组件。在 Linux CLI 中，你只需要输入\
    \ `python`，Python CLI 就会等待你输入命令。只需输入 `print \"this is my first program in Python\"\
    ` 并按回车。漂亮！你执行了一个 Python 命令。这现在还无法让你直接编写完整的代码，那么如果你想写长代码该怎么办？有比这更好的方法，我们将在整个书中都使用那种方法。\n\
    \n# 第 1 章\n\n输入 `sudo nano example.py`，你会在屏幕上看到 nano 文本编辑器。然后输入以下代码：\n\n```\n\
    name = \"World\"\nname = \"Hello \" + name\nprint name\nfor i in range(3):\n \
    \   print \"Whoa\"\nimport this\n```\n\n现在按 Ctrl + X，然后按 Y 保存更改。你将回到 Linux CLI。现在输入\
    \ `python example.py`。Python 程序将被编译，输出将在同一个窗口中显示。你应该注意的一点是，缩进在 Python 中是非常重要的。删除\
    \ `print \"whoa\"` 脚本之前的缩进并执行程序；你会发现一个缩进错误。在循环中，编写代码时应特别注意插入缩进。这使得程序对其他程序员来说易读。\n\
    \n# 编写并执行 C 程序\n\n你应该知道，现今最强大的语言是 C，它允许我们满足所有的编码需求。C 语言非常常见，是一种必不可少的语言。让我们过一下执行\
    \ C 程序的步骤，这与执行 Python 程序几乎相似。\n\n在 LXTerminal 或 PuTTY 中输入 `sudo nano example2.c`。然后你可以输入任何\
    \ C 代码，或者作为初学者，你可以尝试这段代码：\n\n```\n#include<stdio.h>\nint i;\nint main()\n{\n \
    \   for(i=0;i<3;i++)\n    printf(\"Harder you work, Luckier you get\")\\n    return\
