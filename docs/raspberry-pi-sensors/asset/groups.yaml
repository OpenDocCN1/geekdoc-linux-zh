    \  sleep(0.5)\nGPIO.cleanup()\n```\n\n在命令行中输入 `python ledblink.py` 编译并执行代码。如果需要超级用户权限，使用\
    \ `sudo python ledblink.py`。导入 RPi.GPIO 库至关重要，因为它为 Python 脚本导入 GPIO 功能并告诉 Python\
    \ 使用的 GPIO 函数用于控制 RasPi 的引脚。Python 中有一个名为 time 的库提供了延迟、时钟和其他时间相关的函数；因此根据需要从 time\
    \ 库导入 `sleep()`。我们需要设置我们工作的模式。我们遵循 BCM 名称，所以我们需要告诉代码函数中提到的引脚号是 BCM 模式。下一个函数用于设置引脚的方向，即用于输入还是输出。它将引脚\
    \ 11（BCM GPIO 17，参考 GPIO 表）设置为连接 LED 的输出引脚。`for` 循环设置范围从 1 到 10。与无限循环不同，它将运行 10\
    \ 次后控制将退出循环。在 `for` 循环内部，代码是自解释的；它切换连接到 RasPi 部分引脚 11 的 LED。最后，`GPIO.cleanup()`\
    \ 函数将在退出时重置 GPIO 状态。你可以看到如果更改缩进会有很大差异。例如，更改与 `GPIO.cleanup()` 对齐的 `sleep (0.5)`\
    \ 的缩进。\n\n## 使用 C 代码闪烁 LED\n\n最后我们将用 C 语言编写相同的代码。RasPi 和 C 库非常容易使用，这令人印象深刻。我们已经安装了\
    \ wiringPi 库来访问 RasPi 的 GPIO。现在尝试一下代码。在 nano 文本编辑器中输入 `nano ledblink.c` 编辑 `ledblink.c`\
    \ 文件：\n\n```c\n#include<stdio.h>\n#include<wiringPi.h>\n#include <time.h>\nvoid\
    \ main()\n{\n    wiringPiSetup();\n    pinMode(17,OUTPUT);\n    printf(\"\\nI\
    \ am using wiringPi, Blink Blink!\\n\");\n    printf(\"\\npress C to exit)\\n\"\
    );\n    for();\n}\n```\n"
