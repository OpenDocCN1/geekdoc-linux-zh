    # Meeting Your Buddy – the Raspberry Pi


    The world is being automated, with huge chunks of data being produced and processed
    for the analytics, controlling, and connecting purposes. The Raspberry Pi board
    can provide a vast range of automation and data processing if used vigorously.
    This tiny board provides ample functionalities and opportunities to change the
    world around us. This chapter is the first step towards doing that.


    If you are first-time Linux user or are new to programming, it may seem difficult
    to understand many commands and codes, but the motivation to change the world
    is likely to be enough to start building the projects. This chapter provides an
    easy guide to start using the Raspberry Pi board and the total build-up for the
    users to interface the sensors. It will make the Raspberry Pi your best buddy.
    It is important to know the steps included in this chapter to rapidly build the
    projects. This chapter covers:


    - A basic understanding of the Raspberry Pi board and its useful connectors

    - Steps to install the operating system for the first time

    - Unique methods to share the Internet connection with the Raspberry Pi

    - Linux basics and useful shell commands

    - Installing important libraries

    - Introduction to compiling and executing C and Python programs

    - Practice problem statements for Shell, C, and Python


    # A glance at the Raspberry Pi board


    Before we get started, it''s time to reintroduce our good friend, the Raspberry
    Pi. Kudos to the designers of the board, who have packed everything we need to
    accomplish our projects in a credit-card-sized printed circuit, also called a
    credit-card-sized single-board computer. There are two versions of Raspberry Pi:
    Raspberry Pi 1 and Raspberry Pi 2. Due to earlier developments, the Raspberry
    Pi 1 family consists of model A, A+, model B, and B+. The recently launched model
    is Raspberry Pi 2, the new addition to the model B category. Nowadays, the most
    used Raspberry Pi is model B+, which is also called the original Raspberry Pi
    board in the Raspberry Pi 1 family. The predecessor of the Raspberry Pi 1 models
    B and B+ was model A, which is not widely used in the hobbyist space compared
    to other models such as A+ and B+. If you are not aware of the specifications
    of these boards, take a look at the complete comparison in the following table,
    which contains the comparable parameters of the current models of Raspberry Pi
    1 and 2. Then you can choose a board that you want.


    | Features | Raspberry Pi 1 | Raspberry Pi 2 |

    | :--- | :--- | :--- |

    | Models | B, A+, B+ | B |

    | Processor | BCM2835 | BCM2836 |

    | Processor cores | Single | Quad |

    | Speed | 700 MHz | 900 MHz |

    | RAM | 512 MB, 256 MB | 512 MB, 1024 MB |

    | GPU | VideoCore IV | - |

    | Pin header | 40-pin | 40-pin |

    | Audio and video | HDMI, 3.5 mm jack, RCA | HDMI |

    | Ethernet | Yes | Yes |

    | Power | Micro USB | USB |

    | Digital interfaces | CSI (camera), DSI (display) | - |

    | Memory card | SD | SD |


    Raspberry Pi 1 has a BCM2835 processor with 512 MB RAM on top. On the other hand,
    Raspberry Pi 2 has a BCM2836 processor, which comes with 1024 MB RAM. Raspberry
    Pi 1 model A+ is still loved by many users who need low-powered performance. Multimedia
    processing ensures smooth video applications.


    We have already decided to make the Raspberry Pi our friend, and like all others,
    it requires a unique name that we can call it easily; throughout the book, whenever
    you are referring to the name Raspberry Pi, it''s your buddy.


    Your new friend has all the capabilities that your computer has. Raspberry Pi
    can be used to understand how a computer works, to learn programming, for word
    processing, and for gaming. Here are the small and shiny hacks that we can do
    with Raspberry Pi:


    - Do you want to watch your favorite high-definition movie just by connecting
    a display to it? You can do this.

    - Do you want to use it as a web server, where you can run your websites? Not
    a problem with Raspberry Pi.

    - Do you have a vacation and want to play video games, such as Minecraft? You
    can try using Raspberry Pi.

    - Do you want to use it as your point-and-shoot digital camera while you are going
    to visit a zoo this weekend? Easy!

    - You can even make your own robot or quadcopter using Raspberry Pi. Wow!


    All of these features come in such a small piece of board. Does this make you
    excited? Obviously, yes! There are such numerous applications that we can build
    with Raspberry Pi, but they are out of the scope of this book.


    Because of its ability to interact with the outside world, the major applications
    developed using Raspberry Pi include recognizing the surrounding parameters using
    sensors and converting them into useful data to analyze and control the appliances
    that we are going to experiment in the upcoming chapters.


    I assume that you have the Raspberry Pi (model B or B+) in your hand, and you
    might be wondering what are the different connectors and electronic elements on
