    为了测量房间内的环境光变化（亮度），我们将使用 CdS 电池（光敏电阻）。我们可以从 Advanced Photonics Inc. 购买 PDV-P8001，从
    Parallax 购买 350-00009。我们可以轻松地从 Adafruit 买到 Cd5 光敏电阻；这种光敏电阻与 PDV-P8001 相似。在 SparkFun
    上也有出售，被称为 photocurrent。如果有多个选择，请选择暗阻较大的光敏电阻（范围在几 KΩ–MOΩ 之间）。


    让我们深入了解每个传感器并理解它们的工作原理。


    ## InsideDHT – 温度湿度传感器


    DHT 是温度湿度传感器的组合包。这些传感器对于只想进行数据记录的爱好者来说是理想的。DHT11 传感器的数据检索速度较慢。作为一个组合包，它包含一个电阻传感器（热敏电阻）和一个电容湿度传感器。热敏电阻会随温度的变化改变其电阻值。从技术上讲，所有电阻都可以作为热敏电阻，因为当电流通过它们时会发热并产生功率损失。然而，电阻的特性是，当它们被外部源加热时，电阻变化很小，而热敏电阻并非如此；当环境温度稍有变化时，它的电阻会变化几百欧姆。DHT11
    温度传感器在 0 摄氏度到 55 摄氏度的范围内提供接近 2 摄氏度的精度。相比之下，DHT22 温度传感器在约 -38 摄氏度到 120 摄氏度的范围内表现良好，提供接近
    0.5 摄氏度的精度。


    现在让我们了解湿度传感器。DHT 集成了一个湿度传感器，但它对于关键安全应用并不有效。聚合物或金属氧化物的排列方式形成了传感器内部的电容器极。由于湿度的影响，电容器的介电常数会发生变化，从而导致湿度值的波动。这些湿度传感器不保证准确性，但适用于某些应用。DHT11
    温度传感器在 20–80% 湿度范围内的精度为 5%，而 DHT22 温度传感器在 5–100% 湿度范围内提供约 3% 的精度。


    ## 使用传感器监测大气


    从外观上看，DHT 传感器通常位于一个白色或蓝色的塑料外壳内，正面有一个网格或网。它们底部有四个接子。DHT 内部有一个微型的模拟转数字 IC，它为我们提供两部分的数字值：温度和湿度。起初，当我们尝试理解
    DHT 的单线（或单总线）协议时，看起来很困难。经过一些调整，它使用起来非常简单，而且必须精确才能从传感器获得完美的值。一旦理解了时序图，我们就可以轻松地从传感器检索数据。


    DHT 工作在单线双向总线通信。这意味着 RasPi 和传感器之间的数据传输是在单根电线上进行的，通过 RasPi 发送特定的时序或延迟指令，并将其作为位流接收。这使用了“位敲带（banging
    technique）”技术。在协议未定义的情况下，我们使用位敲带技术从传感器检索数据。在这种技术中，主设备发送一个脉冲的精确持续时间（只要参考手册或数据表中有提到），作为来自主设备（在本例中是
    RasPi）的请求，传感器响应为已就绪。在预定义的时间后，它开始逐位地发送数据，而主设备的任务是在从设备发送时通过单总线序列接收它。任何混乱的序列都会变成损坏的数据。这意味着传感器（从设备）已完美发送了数据，但主设备没有正确接收，仅仅是因为主设备和从设备之间没有定时同步。


    ## 介绍光感受器（光敏电池）


    你不知道 RasPi 内部没有集成模拟转数字（A2D）转换器？这是使用像 RasPi 这样基于微处理器的开发板最大的缺点。但别担心；我们有一种技术来破解它。光敏电池或光敏电阻（LDR）是一种光控可变电阻。LDR
    的电阻随光强度的增加而减小。光越强，电阻越小，反之亦然。值的变化约为 45%，不应将其来确定坎拉（candela）或勒克斯（lux）的精确亮度水平。


    从外观上看，传感器顶部有一个透明、光的、薄的玻璃材质表面，并有两个接子。顶部有对光敏感的半导体材料，我们可以看到呈之字形布布的走迹。


    是时候向你介绍一些电阻和电容器的数学知识了。理解电阻的数学很容易，但电容器又是怎么出现的呢？嗯，电子学中有一种现象被称为 RC 定时和 RC 时间常数。传感器本身已经是电阻性的。我们将使用电容器来利用这个电子学公式
    T = R*C。


    是的，就是这样。电容器可以通过电阻在 T 时间内充电，其中 R 和 C 是电阻和电容的值。我们将使用 1uF 的电容器观察电容器被充电到 50% 的电压，即
    3.3/2 = 1.6V。RasPi 只能读取到 1.6v 和大于该值的值。光越暗，电阻越大；充电率越低，充电容器的时间越长。例如，如果电阻是 1KΩ，那么充电容器的时间数将变为
    1 毫秒。


    由于串联电阻（光敏电池），电容器的充电变得足够慢，以便 RasPi 读取。传感器值变化剧烈。电容器将通过保持几毫秒的值而显著减慢，以便我们可以从 RasPi
    轻松地读取值。


    简化这个场景，让我们来看一个真实世界的应用，帮助我们理解电路图的工作原理。想象管道（电线）上有一个阀（光敏电阻），由一个杠杆（光或亮度）控制。这个杠杆有助于控制储存在水箱（电容器）中的水量（电压）。储存在水箱中的水量立即被消费者（RasPi）取出。水箱在这里充当临时存储（缓冲区）来储水，而消费者正忙于用（计算）。这是理解这种破解方法原理的一个很好的例子，不是吗？


    这种破解方法可以应用于任何电阻传感器，例如热敏电阻、柔性传感器以及压力和力敏感电阻。我们可以使用这里解释的相同代码和硬件来连接这些传感器。


