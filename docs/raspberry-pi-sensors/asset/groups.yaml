    # Meeting Your Buddy – the Raspberry Pi


    All of these features come in such a small piece of board.


    Does this make you excited? Obviously, yes! There are such numerous applications
    that we can build with the RasPi, but they are out of the scope of this book.


    Because of its ability to interact with the outside world, the major applications
    developed using RasPi include recognizing the surrounding parameters using sensors
    and converting them into useful data to analyze and control the appliances that
    we are going to experiment in the upcoming chapters.


    I assume that you have the RasPi (model B or B+) in your hand, and you might be
    wondering what are the different connectors and electronic elements on the board.
    Rather than introducing the jargon of specifications, I will introduce what we
    need to make our projects. Take a look at the different connectors in the following
    diagrams. The nomenclature presented here will be used throughout the book.


    ![](img/294138a424db5b37c44c0a7ad39ef037_26_0.png)


