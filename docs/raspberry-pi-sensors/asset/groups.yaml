    nsudo apt-get install git-core


    # wiringPi


    The wiringPi library is created by Gordon, written in C, and provides you with
    support to extend your C programs to control the GPIOs. You can easily download
    (which will need the Internet connection shared on the RasPi) this library from
    Gordon''s code profile by typing the following command:

    git clone git://digrogon.net/wiringPi


    The RasPi then downloads the libraries and creates a folder in the root directory.
    Use the cd wiringPi command to change the directory and to the wiringPi directory.
    The next command to be entered is git pull origin, which fetches the latest version,
    and then we are ready to build the script using the ./build command.


    Now, once the build process is done, we are ready to use the wiringPi library
    in any C program we write in the future. To check whether this particular library
    is working perfectly, enter these commands: gpio -v and gpio readall. This will
    convince you that you have installed correctly. In Chapter 2, Meeting the World
    of Electronics, you will learn how to use wiringPi in shell script and the C language.'
  - '[PAGE 45]


    # python-gpio


    the latest distribution of the RasPi comes with python-gpio installed, but this
    library will be necessary for those who have an old distribution installed.

    The python-gpio allows you to easily access and control the GPIO pins while running
    the Python script. This library can be downloaded from the Python organization''s
    website, but we will install it using the LXTerminal or PuTTY.

    Let''s proceed by downloading the .tar file:


    ```

    wget https://pypi.org/packages/source/R/RPi.GPIO/RPI.GPIO-0.5.7.tar.gz

    ```


    If you''re not aware, let me tell you a TAR file is a kind of bundled file used
    to make the download compact and easy. We need to extract the downloaded file
    in a directory:


    ```

    tar -xf RPi.GPIO-0.5.7.tar.gz

    ```


    Let''s rename this folder for ease of use; use this command:


    ```

    mv RPi.GPIO-0.5.7 python_gpio

    ```


    Move to the python-gpio directory to install the library using this command:


    ```

    cd python_gpio

    ```


    > While writing a command, you can use the Tab key, which provides an autocompletion
    feature. For example, while writing the cd pyth command, press Tab. This will
    autocomplete the command, which will save the time spent on long filenames. Pressing
    the Tab key twice will give you a list of the available commands or filenames.


    Now, we will install this library:


    ```

    sudo setup.py install

    ```


    There is a possibility that it gives you a response that the library is already
    installed with the latest version. After this process, if you want to remove the
    downloaded file, you can use the rm command and remove it. Finally, one more library
    that provides support for the Python Serial Peripheral Interface (SPI) protocol
    on GPIO is spdev. You can install it using the following command. You can refer
    to the Serial Peripheral Interface section of Chapter 2, Meeting the World of
    Electronics, to learn more on SPI protocol. We will be using the SPI protocol
    in Chapter 6, Uploading Data Online – Sheets, Mobile, and E-mails, when we build
    the sensor station project to send data to web pages.


    ```

    sudo pip install spdev

    ```'
