    # OpenCV


    OpenCV 是最强大且广泛使用的跨平台图像处理库之一，它可以运行在任何硬件或软件平台上。它可以安装在 RasPi 上以获得人脸检测、轮廓查找、手势识别、运动跟踪、使用摄像头进行
    3D 深度感知以及许多用于机器学习的复杂算法等功能。OpenCV 代表开源计算机视觉。它由 Intel 开发，基本上用 C++ 语言编写，并可以与 Python、Java
    或 MATLAB 完全互接口。访问 http://opencv.org 查看可用的开源库列表。考虑到计算效率，OpenCV 的设计旨在与多核架构协作。使用
    C 和 C++ 编写 OpenCV 是全球图像处理专家的常态。OpenCV 也可以用 Python 语言编写，因为该库具有完整的开发支持并支持 Python
    脚本中的函数。


    计算机视觉是一个快速发展的领域，拥有更便宜且具备先进处理能力的硬件。OpenCV 为专业人士在视觉处理领域获得最佳结果提供了便利。最初，由于在开源平台上的稀缺以及缺乏专用硬件，图像处理只能在研究实验室进行。如今，学生、研究人员和专业人士可以轻松使用这一成熟且不断增长的库。在写本书时，OpenCV
    版本为 3.0 Beta，下载量约为 900 万次。


    # 与 RasPi 的摄像头接口


    RasPi 拥有 Broadcom 多媒体处理器 BCM2835，该处理器集成了 VideoCore-IV 图形引擎。有多种方法通过 RasPi 接口连接摄像头。如第
    1 章《结识你的伙伴——树莓派》所述（请参考显示 RasPi 端口描述的图），RasPi 具有一个用于连接摄像头模块的专用 CSI 端口。该端口位于以太控制器附近（B
    型）或 4 极音频接口附近（B+ 型）。摄像头串口接口（CSI）端口专门用于移动设备和高级外围控制器的摄像头接口。我们有两种方案将摄像头与我们的 RasPi
    接口：我们可以通过 USB 接口网络摄像头，或者选择 Raspberry Pi 组织提供的名为 Raspberry Pi 摄像头模块。


    # RasPi 摄像头模块


    购买用于与 RasPi 接口的专用摄像头模块时有两种选择。摄像头带有一条半长的柔性电连接连接 RasPi 的 CSI 接口。RasPi 摄像头模块有两种规格：


    - Raspberry Pi 摄像头模块：该摄像头模块采用 500 万像素摄像头，具备以 30 FPS 帧率录制高清视频的能力。在光线较好的白天表现良好。

    - Raspberry Pi 摄像头模块黑夜（NoIR）：NoIR 代表无红外。该摄像头模块没有内部红外滤波器，使摄像头具有在黑暗中观察的能力。你可以将此摄像头部署在花园房作为
    CCTV，以便在晚上看守宠物。这些摄像头对于野生动物摄影师来说性能更好，因为每当检测到运动时就会触发并捕捉图像或视频。由于部署了红外 LED，此摄像头具有在夜间拍摄图像的能力。


    这些摄像头在在线商店的价格为 25 美元。要启用 RasPi 摄像头模块，输入此命令并在配置窗口启用摄像头：


    ```bash

    sudo raspi-config

    ```


    使用键盘在配置设置中选择 `Enable Camera`（启用摄像头）选项。使用以下命令通过捕捉图像来测试摄像头：


    ```bash

    sudo raspistill -o FirstImageThroughRasPi.jpg

    ```


    使用 `raspistill` 命令了解 `raspistill` 命令提供的更多选项。你甚至可以使用以下命令录制视频（H264 格式）：


    ```bash

    raspvid -o FirstVideoThroughRasPi.h264 -t 5000

    ```


    此命令将录制 5 秒视频，并在录完成后自动保存文件。


    > RasPi 摄像头模块对人体传递的静电荷非常敏感。RasPi 摄像头模块故障在树莓派社区非常常见。在触摸摄像头之前，请佩戴防静手环或在手上接地。RasPi
    摄像头模块提供的排线非常脆弱。因此，在使用此摄像头模块时应格外小心。


    ![](img/294138a424db5b37c44c0a7ad39ef037_161_0.png)


    # 使用摄像头和 OpenCV 创建图像传感器


    ## USB 摄像头


    通过牺牲性能来连接台式电脑的摄像头可能更廉。。RasPi 并不支持所有的网络摄像头。你可以访问 http://www.ideasonboard.org/uvc/#devices
    查看 Linux 支持的摄像头和相机列表。


    与 Raspberry Pi 摄像头模块相比，使用 USB 摄像头在速度、成本和通用性之间存在权衡。如果你选择 USB 摄像头，将获得下降的性能，但未来你将能够将
    USB 摄像头连接到任何单板嵌入式计算机。USB 摄像头绝对具有成本效益。此外，与 Raspberry Pi 摄像头模块相比，优质的 USB 线和防静电外壳提供了更长的寿命。


    本章接下来的项目将使用罗技 C270 USB 摄像头进行验证。


    ## 使用网络摄像头进行直播


    你是否想过过 RasPi 是否可以用于直播？如果你选择将 RasPi 作为网络摄像头，在本地网络上通过 RasPi 流式传输视频。有多种方法可以利用 RasPi
    进行直播：


    - 通过将连接到 RasPi 的摄像头固定在同一网络中，你可以通过 SSH 连接并打开摄像头端口。

    - 使用 HTTP 服务器启用摄像头视图。Motion 内置了 HTTP 服务器来启用摄像头。Motion 可以以 MPEG 格式录制视频并以 JPEG 格式捕捉图像。这些图像和视频可以存储在任何地方，它支持
    MySQL 等数据库。输入以下命令在 RasPi 上安装 motion：


    ```bash

