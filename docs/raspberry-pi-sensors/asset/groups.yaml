    # Chapter 3


    ![](img/294138a424db5b37c44c0a7ad39ef037_75_0.png)


    Typical ultrasonic sensor


    The sensor shown here has one transmitter and one receiver. For more accuracy,
    there can be multiple transmitters and receivers. However, this sensor can provide
    accuracy ±3 cm within the range of 400 cm. For example, if the measured distance
    is 270 cm, the actual distance can be 273 cm or 267 cm. Under the cylinders, the
    sensor has a control circuit that takes care of everything, including the communication
    with RasPi. There are four pins that come out of the sensor: ground, echo, trigger,
    and supply. The ground and 5 V can be connected to RasPi pins directly. When we
    give an input from RasPi to the trigger pin of the sensor, the transmitter emits
    the sound pulses. These pulses bounce back from the solid object or surface, and
    we get the pulse from the echo pin. Then, we calculate the time of arrival of
    the echo, and we can calculate the distance. There is some physics behind this
    calculation, which you will learn in the next subsection. This will help us build
    the code to interface this sensor with RasPi easily. Let''s take a peek into the
    physics behind the sensor.


    # Distance calculation


    Do you know what the speed of sound is? Well, this really depends on which medium
    the sound wave is travelling in and the ambient temperature as well as elevation
    from sea level. Brilliant physicists have calculated the speed of sound at the
    sea level and have found it to be 34,300 cm/s. If you measure the distance under
    water then the speed of sound is 1,480 cm/s. See, it changes drastically when
    the medium changed; isn''t this interesting? This again depends on the water''s
    temperature and so many other entities. While making a project, make sure that
    you use the correct speed of sound. Here, we are using air as the medium.'
  - '[PAGE 76]


    # Measuring Distance Using Ultrasonic Sensors


    We know that,


    $Speed = \frac{Distance}{Time}$


    When we measure the time (duration of sending a sound pulse and receiving it back),
    it is measured based on the time taken in going towards the target and returning
    to the source of the sound waves. However, we want to calculate the time just
    for the one-way journey in order to measure the distance. For example, we are
    measuring the distance from point A to B. The sensor will generate the sound from
    point A. Let''s suppose that this sound reaches point B in time T1. At point B,
    the sound is reflected and reaches back to the sensor at point A in time T2. So,
    the actual time we measure at the ultrasonic sensor is T = T1 + T2. That is why
    we need to divide the measured time by the factor of 2.


    So now, our equation is as follows:


    $Speed = \frac{Distance}{Time / 2}$


    We know that the speed of sound is 34,300 cm/s:


    $34300 = \frac{2 * Distance}{Time}$


    Let''s simplify it further to use the code:


    $Distance = 17150 * Time$


    That''s all! We know the equation for the distance, and we also know the working
    principal for the ultrasonic sensor. We will use this exact equation directly
    in the Python script. So what are we waiting for? Let''s start building the project.


    # Building the project!


    It''s now time to connect the ultrasonic sensor with the RasPi board. The ultrasonic
    sensor works on a 5V power supply. Fortunately, we have the 5V supply pin on the
    RasPi board. We can provide the 5V supply from RasPi to the ultrasonic sensor.
    However, in reply, the ultrasonic sensor generates a 5V echo signal as an output
    to RasPi.'
- md: 'It is always recommended that you connect the ground terminals of the devices
    first and then the voltage supply terminals. This should be followed with almost
    all the electronic devices we connect with development boards such as RasPi.


    As you have read in Chapter 2, Meeting the World of Electronics, we know that
    our RasPi needs the 3.3V level on the GPIO to operate safely. So, how do we connect?
    It is a serious matter. In this regard, Kirchhoff will help us. With the help
    of Kirchhoff’s current and voltage laws, we can divide the voltage into two parts.
    If we divide the 5V supply into 3.3V and 1.7V, we can use the echo pulse coming
    out of the ultrasonic sensor to connect it to RasPi board''s GPIO. To divide the
    voltage, we will simply follow the most common voltage divider circuits used in
    electronics.


    Avoid connecting the echo pulse directly to the RasPi board. This can spill the
    board permanently. Always use voltage divider.


    Voltage divider is nothing but a combination of resistors with the right values
    connected in such a style that it divides the voltage. The standard value resistors
    should be used while creating the voltage dividers so that we can easily get them
    from the market.


    There is a simple theory that we will follow. As shown in the following figure,
    a voltage divider consists of two resistors (sometimes, only one variable resistor).
    Usually, the resistor near the input voltage supply (Vin) is called R1 and the
    one near to the ground is called R2.


    ![](img/294138a424db5b37c44c0a7ad39ef037_77_0.png)


    ## Measuring Distance Using Ultrasonic Sensors


    With this configuration, the voltage drop across the resistor R2 should be calculated
    using this formula:


    ```

    Vout = \frac{R2}{R1 + R2} * Vin

    ```


    Similarly, if you use the variable resistor, also called as a potentiometer (POT),
    there is a slider in the center. This slider needs to be changed, and we have
    to look for the desired voltage on a digital voltmeter (multimeter).


    I have a 1KΩ resistor with meter, and it is one of the standard resistor values
    available. We already know that we need to convert 5V to 3.3V. So here, Vin will
    be 5V, and Vout will be 3.3V. Let''s calculate the R2 value required to create
    this voltage divider.


    Let''s put values into the equation:


    ```

    3.3 = \frac{R2}{1K + R2} * 5

    ```


    Then, let''s solve the equation:


    ```

    3.3 + (3.3 * R2) = (5 * R2)

    ```


    We get R2 = 1941.1Ω, and this value of resistor is not available in the market.
    However, fortunately, we have a resistor of 2KΩ that has a value very near to
    1941Ω. The resistors we get from the market have tolerances of 5 percent to 10
    percent. This means that resistance with these tolerance values are never exactly
    same as the tagged value. It always has some variance. As per the calculations,
    we need two resistors to build the voltage divider from 5V to 3.3V, which are
    1KΩ and 2KΩ.


    ## Hardware setup


    Connect the devices as per the guidelines given here and enjoy the coding in the
    next section. You will need these things on a neat wooden table or a table with
    an insulation sheet:


    - An HC-SR004 ultrasonic range finder

    - 1KΩ and 2KΩ resistors (if these seller asks about the wattage of a resistor,
    ask for 1/4 watts, also termed as quarter watts)


    If you do not have 1KΩ or 2KΩ resistor, you can use 330Ω and 470Ω resistors, respectively.
    You can cross-check the calculations done previously. The wattage of resistor
    states the maximum amount of power dissipated through a resistor. Higher the certain
    wattage, higher is the current that can pass through at a certain amount of voltage.
    P = V * I. So, 0.25W = 5V * I yields, I = 50 mA. Therefore, 1/4 watts can be sufficient
    on such boards such as RasPi.


    - Multimeter (if you are a geek and want to measure everything!)

    - Female-to-male jumper wires and female-to-female jumper wires

    - Breadboard (not compulsory if you can build this by just twisting the wires,
    but I recommend that you use it for proper connections without hurting each other)

    - The RasPi with power adaptor

    - An Ethernet cable

