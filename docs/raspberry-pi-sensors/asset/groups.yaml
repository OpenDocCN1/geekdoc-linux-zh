    ```\n\nThis piece of code creates a kind of forever running loop until the echo\
    \ changes its state from 0 (low) to 1 (high). While the echo pin is 0 (or low),\
    \ we keep updating the timing value (timestamp) in the start_time variable. Once\
    \ the echo pin goes high, the while() loop breaks, and we get the value of time\
    \ when the echo pulse went from low to high state. Next, we need to use the same\
    \ logic to get the timestamp for the time it remains high. At this instance, we\
    \ used another variable to store the timestamp that later on, we can use both\
    \ the variables to determine the duration:\n\n```\nwhile GPIO.input(24) == 1:\n\
    \    end_time = time.time()\n```\n\nThe while() loop keeps updating the variable\
    \ with the latest time while the condition is true.\n\n# Calculation of distance\n\
    \nWe have the start time and the end time of the echo pulse. So, we have to subtract\
    \ both the values to the pulse duration. Once we get the pulse duration, we can\
    \ use it for the distance calculation:\n\n```\ntime = end_time - start_time\n\
    ```\n\nInitially, in the chapter, we derived a formula for distance calculation,\
    \ which will be useful here. Let's recall it:\n\n> Distance = 17150*Time\n\nWe\
    \ considered the two-way journey of sound and then divided the time by the factor\
