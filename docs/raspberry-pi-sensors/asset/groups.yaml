    3.3V。让我们计算创建此分压器所需的 R2 值。


    将值代入方程：


    ```

    3.3 = \frac{R2}{1K + R2} * 5

    ```


    然后，解这个方程：


    ```

    3.3 + (3.3 * R2) = (5 * R2)

    ```


    我们得到 R2 = 1941.1Ω，这个电阻值在市场上是不存在的。不过，幸运的是，我们有一个 2KΩ 的电阻，它的值非常接近 1941Ω。我们在市场上买到的电阻具有
    5% 到 10% 的误差。这意味着带有这些误差值的电阻永远不会与标记值完全相同。它总会有某些偏差。根据计算，我们需要两个电阻来构建从 5V 到 3.3V的分压器，分别是
    1KΩ 和 2KΩ。


