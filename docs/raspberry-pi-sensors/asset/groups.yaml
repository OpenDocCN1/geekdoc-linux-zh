    \n电路看起来非常直观，与原理图一致。在左侧留出一些空间，将连接器插入建议的位置。在这里，2 x 13 针排公针母头可以使用标准的 GPIO 排线连接 RasPi\
    \ 的 GPIO。如果你有 B+ 型或 RasPi 2 型，你也可以使用带有 2 x 20 针排针的相同硬件。与其布线，不如通过倒锡来连接芯片和连接器。前图中的黑线是\
    \ PCB 上的焊盘。使用电烙沿图中所示的整个路径进行焊接。需要注意的一点是 MISO、MOSI 和 CLOCK 信号必须使用导线连接，因为它们是交叉的。因此，它们用灰色表示。如果没有布线，无法从\
