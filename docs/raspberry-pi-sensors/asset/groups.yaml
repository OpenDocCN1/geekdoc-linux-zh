    将任何模拟传感器连接到树莓派”中的工作将对我们非常有帮助。我们将使用传感器站来获取温度传感器的数据。列出本章所需的，我们需要以下物品：


    - 一个传感器站

    - 一个温度传感器 (LM35/TMP36)

    - 适用于树莓派 B 型 (26 针)、A+ (40 针) 或 B+ (40 针)，或 Pi 2 B 型 (40 针) 的 GPIO 排线 - 母对母

    - 公对母和母对母跳线

    - 一台树莓派、一个电源适配器、一根网太线、一台个人电脑


    使用排线连接传感器站。使用电源适配器启动树莓派，并在个人电脑上使用 PuTTY 启动会。交叉验证你的电脑是否与树莓派共享了互联网连接。使用以下命令检查：


    ```

    ping -c 4 www.google.com

    ```


    如果没有共享互联网连接，请参阅第 1 章提供的指南《结识你的伙伴——树莓派》。显然，将树莓派连接到互联网非常重要。记住物联网！让我们深入研究软件部分。软件方面有很多东西要学。


    ## 与互联网同步时钟


    在记录数据时，如果树莓派的日期和时间与本地时区不同步，会非常困难。一旦你在没有持续电源供应的远程地点设置日志设备或传感器节点，情况会变得更加困难。你可能注意到，每当树莓派启动时，时钟显示的都是错误。通过在树莓派的命令行界面输入
    `date` 命令可以检查。此外，在上一章中，你可能注意到 `.csv` 日志文件中记录的时间没有显示更新后的日期。不，树莓派在睡眠时并不会穿越时！这因为它没有专门的按钮为它的实时时钟（RTC）供电。为了让树莓派更便宜，设计者移除了许多普通桌面电脑或笔记本电脑具备的功能。


    ## 在线上传数据 - 表格、手机端和电子邮件


    桌面电脑有一个内置的纽扣电池为内部 RTC 供电。要在树莓派上实现这一点，你可以连接一个名为 DS1307 的 IC，它通过 I2C 协议通信。你可以随时从
    RTC 获取时间。你可以用 CR2032 纽扣电池为该 IC 供电。说明该硬件的接口可能需要另一个章节，而且这超出了本书的范围。由于我们在树莓派上有互联网连接，我们可以使用更简单的方法同步时钟。我们将使用网络时间协议
    (NTP) 服务为树莓派提供日期和时间。长期以来，该协议一直用于保持两台电脑或服务器之间的时间同步。在 Whezy Raspian 上，NTP 客户端已经安装。你只需要设置启动时的守护进程（它在后台运行），从互联网服务器获取时间。设置该守护进程的后续代码：


    ```

    sudo nano /etc/rc.conf

    ```


    你可能会看到一个空白配置文件，可以在其中写入：


    ```

    DAEMONS=(!hwclock ntpd ntdate)

    ```


    在前面的命令中，`!` 标记意味着硬件时钟保持不变，但我们将在后台更新软件时钟。按 Ctrl + X，然后按 Y，最后按 Enter 键保存并退出配置文件。然后通过输入
    `sudo reboot` 命令重启树莓派。此守护进程将在后台静默运行。


    重启后，只需输入 `date` 命令检查系统时间，并与当前日期时间对齐。


    > 如果你没有设置树莓派的时区，你可能会看到 `date` 命令显示错误的日期和时间。要设置时区，你可以输入以下命令之一：输入 `sudo dpkg-reconfigure
    tzdata` 并按照用户界面操作。或者，你也可以通过运行 `sudo raspi-config` 打开树莓派配置菜单，然后导航到国际区域设置，设置与第一步中相同的配置。配置好后重启树莓派。


    ## 在 Google 表格上上传数据


    我们已经完成了将时间同步到本地时区。我们可以创建一个与上一章具有相同数据记录功能的应用程序，但这次很不同且很酷。我们将数据上传到 Google 表格中，可以从世界上任何角落访问这些数据。你可以坐在办公室监控家里的温度和湿度。你可以采用你在第
    4 章做的《使用传感器监控大气》项目，并使用 DHT11 传感器观察温度湿度，或者直接使用上一章使用 MCP3008 构建的传感器。


