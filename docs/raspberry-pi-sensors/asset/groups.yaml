    ## 神秘的超声波传感器


    当你去山上探险时，你一定体验过对着高山大声大叫时的回声现象。你甚至可以在没有窗帘和家具等室内装饰的大厅（在一个新房子里）体验到这种现象。超声波传感器的工作原理类似。超声波传感器产生超声波，在等待听到回声后指向障碍物。为什么当你使用超声波传感器时听不到任何声音呢？答案很简单：该传感器工作在超声频率，该频率高于人类的可听频率范围。人类的平均可听范围是
    20 Hz 到 20 kHz。超声波传感器传输声波（也称为声脉冲）频率高于 20 kHz。使用超声波主要是因为它们人耳听不见，而且是因为它们在短距离内可以提供精确的距离测量。你完全可以使用声波来实现此目的，但让一个每隔几秒就发射一次噪音的机器人并不好。详细来说，超声波传感器产生声脉冲并计算回声。这个回声由同一个传感器接收，通过计算信号转换与接收回声之间的时间间隔来决定到目标的距离。这种传感器背后的概念与雷达使用的概念几乎相同。这比超声波传感器还要精确，并且工作在极高频率范围内（VHF）。我们可以在下面的图中看到它的整体结构。这是
    HC-SR04 传感器的表示，它将用于你的项目。你可以从任何领先的电子商店或附近的业爱好电子商店购买这种传感器。传感器板上有两个圆柱体，这些圆柱顶部有金属网。通常，这些圆柱是由钢或任何等材料制成的。


