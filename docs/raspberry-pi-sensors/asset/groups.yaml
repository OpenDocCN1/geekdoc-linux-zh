    # Chapter 6


    Here, we are going to use MCP3008, as it can be useful to interface as many sensors
    as

    can. We will recall the functions used to get data from the SPI port:


    ```

    #start the SPI bus by opening the spi port

    spi = spidev.SpiDev()

    spi.open(0,0)

    ```


    #function to read the channels of MCP3008

    defreadadc (channel):


    ```

    value = spi.xfer2([1, (8+channel))<<4,0])

    read = (value[1&3] << 8) + value[2]

    return read

    ```


