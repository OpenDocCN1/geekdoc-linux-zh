    # 5

    Using an ADC to Interface any Analog Sensor with the Raspberry Pi


    It is known in the RasPi community that the analog-to-digital converter (ADC)
    is not integrated into the RasPi because the onboard processor (BCM2835) does
    not have any functionality to perform the conversion. Had the Raspberry Pi integrated
    ADC module, it would have very easy to interface the sensors, since ADC modules
    are used to convert analog values into discrete and digital values. Most sensors
    provide us with the analog signal on their output pins. These analog signals are
    not understood by the processor as they are varying in nature. Interfacing the
    ADC module ensures that the correct data will be read by the processor to make
    appropriate decisions. In a simple manner, the ADC module creates a bridge between
    the analog sensor and the RasPi core processor. More specifically, ADC modules
    convert analog signals into digital data and provide the converted data to the
    RasPi through certain protocols as I2C, SPI, or UART. Compared to the RasPi, the
    AVR, and PIC18 have up to eight analog inputs and internal ADCs. However, the
    RasPi has a lot of other functionalities to compensate for the absence of an ADC
    module, such as handling an operating system, full-HD video streaming, camera
    support, and much more. We can always provide the ADC conversion functionality
    externally.


    Earlier, ADCs were made using discrete electronic components, BJTs or operational
    amplifiers and resistors. All the credit goes to integrated circuit developers
    for integrating all things and getting them into the form of a single chip. ADC
    modules are used in almost all kinds of smart equipment, and whenever there is
    a requirement of interfacing a sensor, ADC modules are used in one way or the
    other— either inside the microcontroller or as a dedicated signal conditioning
    network to take care of incoming signal from ADC.'
- md: "\n# Using ADC to Interface any Analog Sensor with the Raspberry Pi\n\nIn this\
    \ chapter, you will learn how to use and interface the ADC module. You will initiate\
    \ your learning from the basics of ADCs and the simple mathematics behind it.\
    \ Once you've learned the calculations to acquire the analog value, we will take\
    \ a look at a specific ADC IC, known as MCP3008, manufactured by Microchip Technology.\
    \ You will then gain the essential knowledge on MCP3008 required to prepare generic\
    \ hardware and from a sensor station that will allow you to connect any sensors\
    \ with it. Similarly, we can write the generic software to scan any channel of\
    \ the ADC convert chip through the RasPi. Using this software, we will be able\
    \ to convert the sensor station into the data logger. This data can be finally\
    \ saved in the .csv file for post-processing.\n\nLet's cover the ADCs first. \n\
    \n## Analog-to-digital converters\n\nIn this section, we are going to take a look\
    \ at the types of ADC modules and the conversion process of the signal. We will\
    \ get insights into answering these questions: How the ADC module takes care of\
    \ the incoming data? Do all the ADC modules need external signal conditioning\
    \ circuitry and amplification? How does the ADC module provide the data output?\
    \ How is the quality of the ADC measured? What are the calculations required while\
    \ processing the data?\n\nADC modules are a part of a signal conditioning circuitry\
    \ in a microprocessor or a microcontroller. Unlike the RasPi, most microcontroller\
    \ and microprocessor-based boards have ADC modules embedded, and the signal conditioning\
    \ circuitry too. Most sensors can be directly integrated with these kinds of processors.\
    \ Practically, in sophisticated systems, these conditioning networks have many\
    \ stages for taking care of the incoming data. Some processors have dedicated\
    \ signal processing cores or units to handle the data. ADC and digital-to-analog\
    \ conversion (DAC) topics are so vast that one could write a whole book on explaining\
    \ the functionality and projects on it. Without going into the depths of ADC,\
    \ we will cover the basic terms and functionalities.\n\n## Data reception and\
    \ signal conditioning\n\nWhen data enters the processor, the ADC module's first\
    \ task is to filter the unwanted noise from the received sensor signal. This filter\
    \ is known as the anti-aliasing filter, which is used to avoid the aliasing effect\
    \ observed during sampling. To meet the requirement of the Nyquist's sampling\
    \ theorem, the sampling rate should be double (or greater) the signal frequency's\
    \ frequency band stretches and gets overlapped while sampling the signals, which\
    \ creates an unwanted noise and crosstalk issues. To overcome this phenomenon,\
    \ anti-aliasing filters are used to ensure that the signals are received in the\
    \ desired frequency bands. Sometimes an additional filter, such as a band-pass\
    \ filter, is designed to filter out undesired frequencies.\n\nThe amplitude of\
    \ the signals coming from the sensors is usually weak and varies a lot. Nowadays,\
    \ advanced sensors have the capability to provide a signal powerful enough to\
    \ be fed directly to the microprocessor. However, this is not always the case.\
    \ In analog data acquisition systems, we require the amplified signal to the filter\
    \ input. For that operation, we need the amplification stage prior to or after\
    \ the filtering stage.\n\n## Amplification\n\nSometimes the signals may appear\
    \ similar to noise signals. Some smart ADC modules discard the incoming data due\
    \ to lack of enough voltage or current (basically low power) of the signal. In\
    \ this case, we use current or voltage or power amplifiers to boost the current\
    \ or voltage power level of a signal respectively. For example, a temperature\
    \ sensor or motion sensor provides very weak signal voltages (mV), and this range\
    \ of voltages is too low for the ADC module to start the conversion process. In\
    \ this case, it is required to boost the voltage to the required voltage range.\
    \ In most circuits, Operational Amplifiers (Op-Amp) are used for amplification\
    \ of voltage and currents. The amplifiers designed to implement signal conditioning\
    \ are log amplifiers, instrumentation amplifiers, peak detectors, and many more.\n\
    \n## Sampling and quantization\n\nSampling and quantization are the terms that\
    \ are widely used in electronics and communication theories. These theories are\
    \ too complex to understand for a beginner in electronics. By definition, sampling\
    \ refers to the process of acquiring voltage levels (at a predefined frequency)\
    \ for the continuously incoming data at an analog input pin or the output of an\
    \ amplifier. Quantization is the process of mapping or shortening a large amount\
    \ of input values by the sampler into a countable set of numbers (in this case,\
    \ the combination of digital bits). Quantization always produces a quantization\
    \ error because it rounds off continuous input values and makes approximations\
    \ to its nearest values.\n\n## Types of ADC\n\nWith respect to electronic design,\
    \ there are multiple design structures available for different kind of ADCs. Widely\
    \ used ADCs include Flash Converter ADCs, successive approximation ADCs, sigma-delta\
    \ ADCs, and many more. A flash Converter ADC uses clocks and comparators and operate\
    \ in parallel mode. It is the fastest way to convert analog data into digital\
    \ bits. A successive approximation ADC also uses a comparator to shrink the range\
    \ of input voltages. It makes approximations by comparing the input voltage with\
    \ the internal DAC and stores the result in a successive approximation register.\
    \ A sigma-delta ADC samples the signal and filters its frequency. It counts these\
    \ pulses at regular intervals, so the pulse counted by the interval gives an accurate\
    \ digital representation. ADC types and descriptions are endless and cannot be\
    \ described in this section. Let's cover something more important now.\n\n## Resolution\
    \ of the ADC\n\nResolution of the ADC is one of the most important terms when\
    \ you describe or learn about the ADC. Resolution of the ADC refers to the number\
    \ of values that can be produced over the range of analog input voltage levels.\
    \ For example, an 8-bit resolution of an ADC can have 256 different combinations\
    \ of the values because 2^8 = 256. In, the number of voltage intervals can be\
    \ defined by 2^N levels, where N is the resolution of ADC in bits. When we talk\
    \ about resolution, we always take reference voltage into account. Reference voltage\
    \ is another input to be given through the dedicated input pin at the analog input\
    \ of the ADC. Most ADCs have two types of input: the reference voltage (mentioned\
    \ as V_{ref}) and the analog input. Let's take the reference voltage as 5 volts\
    \ and the resolution of the ADC as 8 bits; then 5V/256 = 19.5mV. The ADC convert\
    \ cannot understand voltage changes on the analog pin under 19.5mV.\n\nIn other\
    \ words, the ADC module is no more sensitive than 19.5mV. Compare this situation\
    \ with 12-bit ADC, which can be calculated as 5V/4096 = 1.2mV, pretty fair, isn't\
    \ it? Now we can detect changes in the analog input signal with the sensitivity\
    \ of 1.2mV.\n\nReducing the reference voltage is not recommended in most cases\
    \ because it will narrow the window of maximum voltage that can be detected by\
    \ the ADC. For example, if the reference voltage is 3V, then the ADC cannot detect\
    \ the changes over 3V. It is always recommended to use a higher-bit ADC module\
    \ instead of reducing the reference voltage. The processors, which have an integrated\
    \ ADC, do have a programmable reference voltage, which can be set during runtime.\n\
    \n## The math behind ADC\n\nAs you learned, you know that the principle behind\
    \ the ADC converter is to convert the sensing parameter into voltage levels. For\
    \ example, let's take a temperature sensor and its working parameters into account.\
    \ A good temperature sensor works on a 5V input supply with 10-bit resolution,\
    \ 5V reference voltage, and temperature-to-voltage conversion equal to 1mV per\
    \ degree Celsius. It senses temperature in the range of 0 degree Celsius to 50\
    \ degree Celsius. Therefore, at 50 degree Celsius, it will provide the maximum\
    \ 5V output at the analog pin. The digital conversion equation is:\n\nDigital\
    \ number = (2^resolution / Vref) * Vin\n\nLet's calculate the value of the digital\
    \ number converted from the input voltage read at the ADC pin:\n\n10 bits; therefore,\
    \ 2^resolution = 1024\n\nVref = 5V\n\nSuppose ADC has read 2.9V at the ADC input\
    \ pin. Then Vin = 2.9V yields Digital number = 594 by rounding off.\n\nNow the\
    \ resolution of the ADC is V_ref / 1024 = 5 / 1024 = 0.0048 V/count, and the temperature-to-voltage\
    \ conversion scale factor is 1mV per degree Celsius.\n"
