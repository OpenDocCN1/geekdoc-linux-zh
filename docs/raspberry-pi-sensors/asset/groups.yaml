    # 会见你的伙伴 – 树莓派


    从现在起，当你从 PC 访问树莓派时，必须始终使用此 IP 地址。


    如果你是 Linux 或 Mac OS 用户，请将 SD 卡插入 SD 读卡器。你会看到两个分区。打开 `boot` 分区，并按照之前说明的步骤将 IP 地址添加到
    `cmdline.txt` 文件中。


    保存文件，从 PC 上安全地移除 SD 卡，然后进行下一步。


    # 启动树莓派


    现在是时候将 SD 卡插回树莓派并启动它了。在为树莓派供电之前，先在树莓派和 PC 之间建立以太网连接。你会看到树莓派上的多个 LED 灯闪烁，表示以太网连接已建立，且正在进行数据传输。在命令提示符（**开始菜单
    | 运行 | cmd.exe**）中输入 `169.254.0.2` 来检查 PC 与树莓派的连接状态。注意，我们使用的是与 cmdline.txt 文件中输入的相同
    IP 地址。它应该返回如下的响应：


    ```

    C:\Users\RUSHI>ping 169.254.0.2

    Reply from 169.254.0.2 bytes=32 time<1ms TTL=64

    Reply from 169.254.0.2 bytes=32 time<1ms TTL=64

    Reply from 169.254.0.2 bytes=32 time<1ms TTL=64

    Reply from 169.254.0.2 bytes=32 time<1ms TTL=64


    ping statistics for 169.254.0.2:

    Packets: Sent = 4, Lost = 0 (0% loss),

    Approximate round trip times in milliseconds:

    Minimum = 0ms, Maximum = 1ms, Average = 0ms

    ```


    `ping` 命令允许我们使用定义的数据包大小向主机发送数据包并期望它们返回。部分中的 `Lost = 0` 显示从 PC 发送到树莓派的所有数据包都已返回，且连接是通的。


    # 第一章


    对于 Linux 和 Mac OS 用户，可以通过在终端中输入 `ping 169.254.0.2` 命令来验证连接。在同一个命令提示符中输入 `ping`
    命令以获取 PC 的以太网端口 IP 地址。随后，输入 `ifconfig`（Mac OS 和 Linux 用户也使用此命令）并记录局域网连接（以太网）的
    IP 地址，此处所示为 `169.254.121.232`：


    | 以太网适配器局域网连接: | |

    | :--- | :--- |

    | 连接 DNS 后缀 | |

    | 本地链接 IPv6 地址 | fe80::ed8e:2601:5396:79e8:10 |

    | 自动配置 IPv4 地址 | 169.254.121.232 |

    | 子网掩码 | 255.255.0.0 |

    | 默认网关 | |


    ![](img/294138a424db5b37c44c0a7ad39ef037_37_0.png)


    # 再次修改 cmdline.txt 以添加 PC 的以太网端口 IP 地址


    关闭树莓派（`sudo poweroff`），取出 SD 卡，将其插入 PC，并按照“编辑树莓派的命令行文件”部分的操作。将记录的 IP 地址（在此例下为
    `169.254.121.232`）添加到 `cmdline.txt` 文件的末尾，如下代码所示：


    ```

    dwc_otg.lpm_enable=0 console=ttyAMA0,115200 kgdboc=ttyAMA0,115200 console=tty
    root=/dev/mmcblk0 roottype=ext4 elevator=deadline rootwait=169.254.0.2::169.254.121.232

    ```


    在这里，双冒（::）是放在树莓派 IP 地址和你的 PC IP 地址之间最重要的部分。然后，保存 `cmdline.txt` 文件。


    # 在 PC 和以太网连接之间共享 Internet 连接


    在安全插回 SD 卡并插入微 USB 适配器后启动树莓派。在 Windows PC 上，你需要通过导航到 `控制面板 | 更改适配器设置` 来打开 `网络和共享中心`，右键点击获取
    Internet 连接的适配器并进入其属性。


    # 会见你的伙伴 – 树莓派


    > 注意 PC 上通过无线 Internet 连接可能存在的联网情况。


    点击**共享选项卡**。勾选**允许其他网络用户通过此计算机的 Internet 连接来连接**选项并点击**确定**。此设置更改了 PC 以太网端口的 IP
    地址；我们需要重置它。


    在适配器设置的同一个窗口中，进入**局域网连接**（以太网）的属性，双击 **IPv4** 设置，并同时点击**自动获得 IP 地址**以及**自动获得 DNS
    服务器地址**。


    > 我们为树莓派提供的 IP 地址可能与你家网络的子网类别不同。有趣的地方在于，该子网保留在树莓派和 PC 之间。如果你的 PC 的 Wi-Fi 适配器获取的是
    192.x.x.x 范围内的 IP，不要慌。这种方法仍然有效，因为 Windows 允许跨子网的 Internet 共享。这是因为我们开启了 Internet
    共享和以太网的自动设置。因此，Wi-Fi 到 PC (192.x.x.x) 和 PC 到树莓派 (169.254.x.x) 的场景均成功运行。


    Mac OS 用户可以通过导航到**偏好设置** | **共享**来遵循相同的步骤，通过 GUI 操作非常简单。


    Linux 用户可以点击顶栏的网络菜单并导航到**编辑连接...**，然后双击有线连接，保持无线连接不变。导航到 **IPv4 设置**选项卡并选择方法：**共享给其他**。


    # 在 PC 上安装并打开免费的 SSH 客户端


    **Secure Shell (SSH)** 是一种用于安全数据通信的加密协议。这意味着网络计算机之间的远程命令行登录和远程命令执行。在这里我们使用它来实现
    PC 与树莓派之间的命令行登录和远程命令执行。独特且免费的 SSH 客户端是 Windows 的 PuTTY (www.putty.org)，它是开源，你可以免费下载。在
    Windows PC 上运行 PuTTY 并进行如下设置：


    # 第一章


    对于 Linux 和 Mac OS X 用户，不需要安装 PuTTY 客户端，因为他们可以直接在终端窗口中通过 `ssh pi@169.254.0.2` 命令完成此任务。


    - 1. 在 PuTTY 的 Host Name 框中提供你在 cmdline.txt 中输入的相同 IP 地址（根据上一节示例为 169.254.0.2）。

    2. 随后，导航到 Category | Connection | SSH | X11 并启用 X11 转发选项。

    3. 在左侧 Category 菜单中，点击 Session，在 Saved Sessions 字段中输入会话名称并保存，这样每次连接树莓派时无需重新保存设置。

    4. 双击保存的连接，输入会话名称。

    5. 双击保存的连接，输入用户名和密码以连接到树莓派。


    '
