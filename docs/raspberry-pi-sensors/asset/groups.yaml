  - '[PAGE 31]


    # Downloading the required software


    Once you have an SD card, you are ready for this step. These steps are broadly
    explained in my personal blog too, which you can visit at http://rushgaj own.blogspot.in/2014/03/setting-up-raspberry-pi-for-first-time.html.


    Let''s see the procedure for different operating systems.


    # Windows


    These things need to be kept in mind while working on Windows:


    +   - Format the SD card: Use the SD Card Association''s tool (www.sdcard.org/downloads)
    to format/wipe your old data from the SD card. Use of the SD formatter provides
    optimal performance for your memory cards compared to the generic formatting facilities
    provided by your computer''s operating system


    +   - Write the image of the OS on an SD card: The downloaded Raspian OS will
    be written from a raw disk image to a removable device using the popular and free
    tool, Win 32 Disk Imager (sourceforge.net/projects/win32diskimager/). Follow the
    steps on the screen, and you can easily write an image of Raspian on your SD card.
    Once you are done with this process, jump to the next section.


    # Mac OS X


    These things need to be kept in mind while working on Mac OS X:


    +   - Download software to write the image of the OS on an SD card: There are
    multiple tools available for Mac OS X users such as ApplePi-Baker, PiWriter, and
    Pi Filler. PiWriter is a CLI-based tool, whereas ApplePi-Baker and Pi Filler are
    GUI-based tools. Pi Filler is recommended to be used because it is simpler and
    faster than other tools. It can be downloaded from http://ivanx.com/raspberrypi/files/PiFiller.zip.


    +   - Write the image on the SD card: Insert an SD card, locate or choose the
    downloaded image in the tool, and erase the SD card in the automatically popped-up
    menu. Select the continue button to write the image on the SD card.


    # Linux


    These things need to be kept in mind while working on Linux:


    +   - Unzip the downloaded image: If you are using a GUI-based Linux OS on your
    desktop computer, open the download folder and unzip the OS by right-clicking
    on Extract Here.'
  - '[PAGE 32]


    # Meeting Your Buddy – the Raspberry Pi


    +   - Download the software to write the image of the OS on an SD card: You can
    install image writer from the Ubuntu Software Center. Open Software Center and
    ImageWriter. Insert the SD card in your desktop and follow the GUI (click on the
    Write to Device button) to locate and write the image on your SD card.


    # Expanding the root filesystem


    Now, it''s time to start the RasPi for the first time. After the process of writing
    an OS on the SD card, insert the SD card into the slot available on the RasPi.
    Connect the display (or TV) through an RCA or HDMI connection, and power up the
    RasPi by connecting a power supply to the micro USB connector. You will be able
    to see the configuration screen. Directly select the expand_roots option (from
    the keyboard connected through the USB of the RasPi) and wait for time to complete
    the background process. When you write the image on the SD card, everything is
    in a compact bundle, where it needs to be expanded for the RasPi''s complete operation.
    Expanding the root filesystem (expand_rootfs) resizes the partitions in the SD
    card and allows us to utilize the memory space in it. By point, you should restart
    your RasPi.


    > Before powering up the RasPi using the micro USB, the SD card must be inserted
    and the HDMI cable must be attached. RasPi reads the signals coming through HDMI
    to check the display connection. The display is not available at the first point
    of startup, it disables the HDMI interface and streaming to optimize performance.


    # Logging in to the RasPi


    When the RasPi restarts, you will be able to see many pieces of code running on
    the screen. Don''t panic! It''s a normal process that goes on the RasPi. When
    it becomes stable, it will prompt you to enter the username and password. By default,
    the username and password are pi and raspberry respectively.


    > Note that while you are writing your password, you will not be able to see anything
    coming on the screen; don''t worry. Welcome to the Linux world!


    Once you''ve entered the correct password, you will be able to see the CLI with
    pi@raspberry~$ on screen, monitor, or TV, which is now ready to take commands
    from you. Aye, captain!'
  - '[PAGE 33]


    # Opening the desktop


    Enter the startx command as pi@raspberrypi-$startX and press Enter. Now you have
    a white screen with the Raspberry Pi logo and a GUI that looks similar to our
    personal desktop computers. Take a bite!


    So, we saw an easy and compact guide for setting up the RasPi for the first time.
    We''ll add more functionality to our RasPi by providing an Internet connection
    for it. A computer is incomplete without an Internet connection, and so is our
    RasPi. This is something we need to solve, especially as we can directly download
    useful libraries and applications on the RasPi through the internet.


    # Connecting the Raspberry Pi to the Internet


    Once you have finished setting up the RasPi, it''s time to connect it to the Internet.
    Basically, there are two very common ways of connecting the RasPi to Internet:
    the first (and easiest way) is via Wi-Fi connection using a Wi-Fi dongle, or transceiver;
    the second is somewhat tricky but the most economical and practical way to utilize
    everything you have and without an additional Wi-Fi dongle. This will require
    a laptop/desktop computer (a PC) and an Ethernet cable. We will see how follow
    each of the ways.


    # Internet connection through Wi-Fi dongle


    You can purchase the dongle for the RasPi from any leading online store or an
    electronics store near you. It ranges from 10 to 20 USD at the time of writing
    this book. While in the process of purchasing, read about the power requirements
    of the dongle. You can purchase the miniature Wi-Fi dongle available on Adafruit,
    or a dongle from brand names: PiFi or Edimax. If you are thinking of giving a
    try to your Internet connection sharing, then this section can be skipped. The
    basic steps for establishing the Wi-Fi network connection are introduced here.


    > It is advisable to use either of the methods at once. If you choose to use the
    Wi-Fi dongle, then you can skip the section of Ethernet sharing and vice versa.


    In the CLI of the RasPi, enter the following command to note down the gateway
    and longterm of the Ethernet connection that you can add a static IP defined in
    the interface file in the upcoming steps:

    ```

    netstat -nr

    ```'
  - "[PAGE 34]\n\n# Meeting Your Buddy – the Raspberry Pi\n\nWe have to perform the\
    \ following steps to enable the Wi-Fi network connection:\n\n+   1. Go to the\
    \ network interfaces file of the RasPi by entering the `sudo nano / etc/network/interfaces`\
    \ command in the CLI. Note that you will get acquainted with these commands in\
    \ the upcoming sections. Once you enter the command, the text you need to change\
    \ is:\n```\nauto lo\niface lo inet loopback\niface eth0 inet static\n    address\
    \ 169.254.0.2\n    netmask 255.255.0.0\n    broadcast 169.254.0.255\n    gateway\
    \ 0.0.0.0\n\nallow-hotplug wlan0\niface default inet dhcp\n    wpa-ssid \"ssid_name\"\
    \n    wpa-psk \"password\"\n```\n\n> > Do not forget to put ssid (your network\
    \ name) and your password (you know it!) in the quotes.\n\n+   2. After editing\
    \ the file, press `Ctrl + X` and press Y to confirm the edit made by you.\n\n\
    Shut down the RasPi by entering the `sudo poweroff` command. You then need to\
    \ connect the Wi-Fi dongle and turn it in again. While it is booting up, it finds\
    \ the Wi-Fi adaptor connected to it. Pretty simple, isn't it!\n\n# Internet connection\
    \ through Ethernet from a PC\n\nAll of the preceding steps require a dedicated\
    \ display, mouse, keyboard, and all other cables to get the view of the working\
    \ RasPi. For regular uses, this is somewhat bulky to carry all of these along\
    \ with your RasPi. At this stage, I assume that you have already installed Raspbian\
    \ OS."
  - '[PAGE 35]


    For this method, you just need your laptop/desktop (it already has an inbuilt
    Wi-Fi module, which is why we don''t purchase an additional Wi-Fi dongle for RasPi
    until we have a special requirement), the Windows operating system, and an Internet
    connection. You do not need any add-displays, keyboard, mouse, or Wi-Fi dongles
    with the RasPi.


    So all we need is an Ethernet cable, a power supply to RasPi, the SD card with
    Raspian, a Windows-based PC with an Ethernet port, an SD card reader for the PC
    (just required for the first time, either inbuilt or as an add-on SD card reader),
    and the RasPi (obviously!).


    Assemble all of these on a neat table and start your laptop starting up the RasPi.
    I will run you through the step-by-step process. If you follow it, you''ll have
    a working Internet connection provided from your PC to your RasPi with no added
    costs of Wi-Fi dongles.


    # Editing the command-line file of the RasPi


    The first step is to edit the file that RasPi checks when it starts booting. Try
    inserting the SD card of the RasPi into your PC''s SD card reader. Open Explorer
    (where all the drives are listed); you, can find the removable media. You will
    be amazed to see that the partition is about 15 MB to 20 MB, but your card is
    actually 8 GB or 16 GB! Don''t panic; it''s the boot space of RasPi. You will
    be able to see the multiple files on this media. We are interested in editing
    the cmdline.txt file. Just double-click on the file (or open it in Notepad), and
    you will be able to see the following startup commands:


    ```

    dwc_otg.lpm_enable=0 console=ttyAMA0,115200 kgdboc=ttyAMA0,115200 console=tty1
    root=/dev/mmblk0p2 rootfs=ext4 elevator=deadline

    rootwait

    ```


    You can change some settings by adding the static IP address of RasPi at the end
    of the line (take a look at the following code). There is no need to understand
    the meaning of all of these parameters at this stage; I will introduce them when
    they will be useful.


    ```

    dwc_otg.lpm_enable=0 console=ttyAMA0,115200 kgdboc=ttyAMA0,115200

    console=tty1 root=/dev/mmblk0p2 rootfs=ext4 elevator=deadline

    rootwait ip=169.254.0.2

    ```


    In bold, you will set the static IP you have provided for the RasPi.'
- md: '

    # Meeting Your Buddy – the Raspberry Pi


    From now onwards, you''ll always have to access your Pi using this IP address,
    when you access it from your PC.


    If you are a Linux or Mac OS user, insert the SD card into the SD card reader.
    There will be two partitions visible. Open the boot partition and follow the same
    process explained to add the IP address to the cmdline.txt file.


    Save the file, safely remove the SD card from the PC, and move on to the next
    step.


    # Turning on the RasPi


    Now it''s time to start and boot the RasPi by inserting the SD back into the RasPi.
    Establish an Ethernet connection between the RasPi and your PC before powering
    up the RasPi. You will see multiple LEDs blinking on RasPi, stating that the Ethernet
    connection is established and there is a transfer of data occurring between the
    PC and the RasPi. Check the working connection of PC and RasPi by entering `169.254.0.2`
    in Command Prompt (**Start Menu | Run | cmd.exe**). Note that we are using the
    same IP address as entered in the cmdline.txt file. It should give a response
    like this:


    ```

    C:\Users\RUSHI>ping 169.254.0.2

    Reply from 169.254.0.2 bytes=32 time<1ms TTL=64

    Reply from 169.254.0.2 bytes=32 time<1ms TTL=64

    Reply from 169.254.0.2 bytes=32 time<1ms TTL=64

    Reply from 169.254.0.2 bytes=32 time<1ms TTL=64


    ping statistics for 169.254.0.2:

    Packets: Sent = 4, Lost = 0 (0% loss),

    Approximate round trip times in milliseconds:

    Minimum = 0ms, Maximum = 1ms, Average = 0ms

    ```


    The ping command allows us to use the predefined size of packets to the host systems
    and expects them to be reflected back. The `Lost = 0` in section shows that all
    the packets sent from the PC to the RasPi are reflected back and the connection
    is working.


    # Chapter 1


    For Linux and Mac OS users, the connection can be verified by entering the `ping
    169.254.0.2` command in the terminal. Enter the `ping` command in the same Command
    Prompt to get the Ethernet port IP address of your PC. Following this, enter `ifconfig`
    (ifconfig in the case of Mac OS and Linux users) and note down the IP address
    of the LAN connection (Ethernet), which is `169.254.121.232` in the following
    screenshot:


    | Ethernet adapter Local Area Connection: |

    | :--- | :--- |

    | Connection-specific DNS Suffix | |

    | Link-local IPv6 Address | fe80::ed8e:2601:5396:79e8:10 |

    | Autoconfiguration IPv4 Address | 169.254.121.232 |

    | Subnet Mask | 255.255.0.0 |

    | Default Gateway | |


    ![](img/294138a424db5b37c44c0a7ad39ef037_37_0.png)


    # Changing cmdline.txt again to add the PC''s Ethernet port IP address


    Shut down the RasPi (sudo poweroff), remove the SD card, insert it into your PC,
    and follow the Editing the command-line file of RasPi section. Add the noted IP
    address (in this case, `169.254.121.232`) at the end of the `cmdline.txt` file,
    as shown in the following code:


    ```

    dwc_otg.lpm_enable=0 console=ttyAMA0,115200 kgdboc=ttyAMA0,115200 console=tty
    root=/dev/mmcblk0 roottype=ext4 elevator=deadline rootwait=169.254.0.2::169.254.121.232

    ```


    Here, the double colon (::) is the most important part to be put between RasPi''s
    IP address and your PC''s IP address. Then, save the `cmdline.txt` file.


    # Sharing the Internet connection between your PC and an Ethernet connection


    Turn on the RasPi after safely inserting the SD card back and plugging in the
    micro USB adapter. On a Windows PC, you need to open `Network and Sharing Center`
    by navigating to `Control Panel | Change adapter settings`, right-clicking on
    the adapter where you are getting Internet connection, and going to its properties.


    # Meeting Your Buddy – the Raspberry Pi


    > Look out for possible Internet connectivity on your PC through a wireless Internet
    connection.


    Click on the **Sharing tab**. Keep the **Allow other network users to connect
    through this computer''s Internet connection** option checked and click on **OK**.
    This setting changes the IP address of the Ethernet port of the PC; we need to
    reset it.


    In the same window of the adapter settings, go to the properties of the **Local
    Area Network connection** (Ethernet), double-click on the **IPv4** settings, and
    click on **Obtain an IP Address Automatically** as well as **Obtain DNS server
    address automatically**.


    > The IP address we provide for the RasPi may have a subnet class different from
    the network in your home. The interesting point is that this subnet remains between
    the RasPi and PC. Don''t panic if the Wi-Fi adapter of your PC is getting IPs
    in range of 192.x.x.x. This method still works, as Windows allows the Internet
    sharing between cross subnets. This is because we have enabled the Internet sharing
    and Ethernet settings as automatic. Therefore, it is clear that the Wi-Fi-to-PC
    (192.x.x.x) and PC-to-RasPi (169.254.x.x) scenarios work successfully.


    Mac OS User can follow the same steps by navigating to **Preferences** | **Sharing**
    and it would be very easy to follow the GUI.


    Linux users can click on network menu in the top panel and navigate to **Edit
    Connections...**, and then double click your wired connection and keep the wireless
    connection untouched. Navigate to the **IPv4 Settings** tab and select method:
    **Shared to other computers**.


    # Installing and opening the free SSH client on your PC


    **Secure Shell (SSH)** is a cryptographic network protocol for secure data communication.
    It means remote command-line login and remote command execution between two networked
    computers. Here, we use it for the command-line login and remote command execution
    between the PC and the RasPi. A one-of-a-kind and free SSH client is PuTTY (www.putty.org)
    for Windows, and since it is an open source, you can download it for free. Run
    PuTTY on your Windows PC and change the settings as follows:


    # Chapter 1


    For Linux and Mac OS X users, there is no need to install the PuTTY client, as
    they can directly perform this task from their terminal window by the ssh pi@169.254.0.2
    command.


    - 1. In the Host Name textbox of PuTTY, provide the same IP address that you entered
    in cmdline.txt (which is 169.254.0.2, as per the example given in the previous
    section).

    2. Following this, navigate to Category | Connection | SSH | X11 and enable the
    X11 forwarding option.

    3. In the left-side Category menu, click on Session, enter the session name in
    the Saved Sessions field, and save it so that you don''t have to save the settings
    every time you connect the RasPi with the PC.

    4. Double-click on the saved connection and enter the session name.

    5. Double-click on the saved connection and enter the username and password to
    connect to the RasPi.

