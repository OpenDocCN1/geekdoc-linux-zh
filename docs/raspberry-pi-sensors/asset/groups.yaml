    # Preparing the code


    Working with the DHT11 sensor is quite complicated but not difficult. In parallel
    with this sensor, we have interfaced the LDR sensor. We have to manage the timings
    for both sensors. The problem can be easily solved when we break it down into
    several instances. We will split the project into smaller steps as follows:


    +   1. Understand the bit banging technique for DHT and prepare the code as the
    timing sequence.

    2. Write the code for the DHT sensor and test it.

    3. Test the code for the LDR sensor.

    4. Combine both codes and test it.

    5. Add the comparison loop, and make the LED glow to show some indications.


    # Code the DHT sensor and measure relative humidity and temperature


    As we know, the DHT sensor works on single-wire bidirectional protocol. Thus,
    the synchronization between the sensor and the RasPi is very important. We have
    to read the sensor at timed intervals. Once the RasPi sends a request, the DHT
    sensor sends the recently read temperature and humidity data simultaneously. As
    the sensor is slow and from the timing diagram shown in the next figure, it is
    recommended that you read the sensor or send the request to the sensor every 5
    seconds or more to get accurate data.


    > If you have already set up the hardware, you need not to remove the connections
    of the LDR sensor while working with the DHT sensor.


    Let''s first see the timing diagram to be followed, and then, we will go through
    the responses received from the sensor. If you observe the upcoming timing diagram
    image from the left-hand side, the data line is pulled up (high) by a resistor
    of value 4.7KΩ. Therefore, whenever there is no forceful action, such as pulling
    down, or no data transmission, the line status is pulled high by default. Understanding
    the diagram in the sequential manner, we will move from left to right.'
  - '[PAGE 104]


    # Monitoring the Atmosphere Using Sensors


    The signal has two logic levels: VCC(5V) and GND. Pulling the line high (pull-up)
    is necessary because logic l is the default state to be maintained at the sensor''s
    data line. Therefore, we will have a high state of the line when we initiate the
    communication between the DHT and the RasPi. The following timing diagram is for
    our understanding purpose only. The frequency and timing are not populated in
    this figure.


    ![](img/294138a424db5b37c44c0a7ad39ef037_104_0.png)


    Once the RasPi is ready to receive the data from the DHT, it pulls the line down
    for more than 19 ms and makes it high again. After some delay, the DHT will sense
    that the line has been brought down to zero by the RasPi. It then sends the acknowledgement
    of high pulse duration 80µS to the RasPi and brings the line to the low state.
    Therefore, the RasPi will wait for the 80us pulse, and then, it will know that
    the sensor will send the data. After sending the acknowledgement pulse, DHT11
    starts sending 40 bits of data to the RasPi. The data 0 format in the bit stream
    is nothing but a combination of low level for 50us and 26–28µs of high line. Similarly,
    logic 1 is low level for 50us followed by high logic level for 70µs.


    > Eight bits make one byte. Four bits make one nibble.


    The received 40 bits contains 8-bit integer RH data, 8-bit decimal RH data, 8-bit
    integer T data, 8-bit decimal T data, and 8-bit checksum. The checksum is the
    value of all the received data that we can verify the received data is correct.


    If the received data is 0011 1101 0000 0000 0001 0010 0000 0010 0110, 0011 1101+0000
    0000+0001 1010+0000 0110= is the calculation.


    Adding the first four bytes to verify with the last eight bytes, it should be
    observed that the summation of the first four bytes is equal to the final received
    byte. In the given example, the received data looks correct. Convert the binary
    into hex and then into decimal form to get the exact value. We get Humidity=0011
    1101=3D (Hex) = 61%RH and Temperature=0001 1010=1A=26 degrees Celsius.'
