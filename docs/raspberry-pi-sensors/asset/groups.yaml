    # 前言


    我发现树莓派最有趣的地方在于，我仍然可以摆弄硬件组件和使用烙铁，并通过编写代码让我的硬件“活”起来。这本书为那些真正想要了解事物如何协同工作，并希望在启动树莓派传感器接口和物联网项目方面获得方向的创作者们提供了一个起点。当我们展望周围万物互联的阵列时，技术正在发生巨大的增长。


    物联网为收集数据并分析数据以改善用户体验开辟了新世界。来自多个不同传感器节点的矩阵产生了大量数据。在这种背景下，树莓派为我们提供了从简单项目开始的机会，例如如书中章节描述的那样，从开发的传感器站将数据上传到互联网。这将是你构建物联网项目的第一步。另一个有趣点是，随着树莓派
    2 Model B 的兴起，开发者已经拥有足够的处理能力在树莓派上运行计算密集型算法。因此，图像处理被包含在其中一个章节。向初学者解释图像处理会非常困难，但我至少尝试为读者提供一个简单的入门方法，让他们自己开始图像处理。


    本书探索了五个不同的项目，其中任何一个都可以作为构建不同电子项目的启动点。我在准备项目时遵循的方法非常有趣。我经常定义为遵循复杂的硬件设计。虽然我不依赖面包板（因为我更倾向于高速电路设计），但小型项目原型（书中涵盖了一些）可以轻松地在面包板上接线。第一个方法应该是购买最好的硬件组件（最好是直孔插件以便测试测试），当代码无法运行或未给出正确结果时，你可以依靠它们。准备一个框图，并考虑硬件和固件设计过程中可能发生的每个问题。其次，阅读所用组件的数据表，确保每一个实体都符合设计要求。第三，我们将组件连接到面包板并进行彻底检查。最后，当硬件构建完成后，编写代码（或固件），并对其重写使其更加完美。删除不必要的变量和无法访问的代码或循环，处理中断，定义处理器的睡眠时间和看门狗，并管理适当的内存段以避免崩溃。然而，本书大部分遵循简单的代码，没有深究嵌入式编程。树莓派会处理程序员遇到的错误。只需调用一个函数，它就会在后台完成所有的嵌入式调用。感谢树莓派库的开发者，让我们我们构建了更健壮的代码（无论是有意还是无意）。当你准备一段代码示例时，我建议你将其拆解。


    在构建从温度、湿度和光传感器获取数据的项目时，你可能会遇到一些困难。首先，完成温度和湿度部分，然后为光传感器编写代码。每当这两部分代码都给你理想值时，重新编写它们。然后你就可以通过管理函数调用将它们合并。


    在编写章节时，我在书中遵循了一个共同的主题：首先是设置，然后是项目目的，最后是详细描述硬件。在某些章节中，软件被分为几个组件，然后进行合并以避免让你感到单调。对于书中某些理论部分的冗长，我深表歉意，但我确定你会喜欢阅读并从中学习很多，并且从中发挥最大的价值。


    欢迎任何问题、改进和建议，这些内容应该在书籍的 GitHub issues（访问 https://github.com/rushigajjar/raspberrypis）中提交，这样每个人都可以参与。此外，任何人都可以通过
    LinkedIn（https://in.linkedin.com/in/rushigajjar）联系我，并发送关于他们有趣项目和启动计划的消息。我非常想听到这些信息。或者一旦你实现了空调和灯光的自动化，你可以在
    @rushigajjar 分享温度和亮度信息并推特！


    # 本书涵盖的内容


    第 1 章“结识你的伙伴——树莓派”，介绍了市场上所有的树莓派型号，包括最近的树莓派 2 Model B。讨论了安装操作系统的方法以及与树莓派共享互联网的有趣方法。然后，我们在树莓派的
    Linux 终端、Linux Shell 脚本、Python 和 C 语言上进行动手编程。


    第 2 章“走进电子世界”，解释了电子基础知识以及电子设备通信的协议。使用 shell、Python 和 C 语言进行 GPIO 实验会更有趣。


    第 3 章“使用声波传感器测量距离”，展示了如何设置声波传感器并进行实验。


    第 4 章“使用传感器监控大气”，培养你使用温度、湿度和光传感器的技能。


    第 5 章“使用 ADC 树树莓派”，解释了模数转换器的接口。


    第 6 章“将数据上传在线——电子表格”，深入探讨物联网。


    第 7 章“使用 OpenCV 创建图像”，涵盖了图像处理的基础知识以及如何安装摄像头。


    # 本书所需的物品


    除了实现本书项目所需的必备硬件组件外，没有特殊要求！你可以使用带有 Linux、Windows 或 Mac OS 的个人电脑来连接树莓派。市场上提供的任何树莓派型号（树莓派
    1 型 A+、B、B+ 或树莓派 2 Model B）都应该适用于代码实验。


    # 本书的读者


    这本书非常适合想要使用树莓派创建各种项目的硬件爱好者。它对于有先验编程经验（特别是 Linux、C 和 Python 方面）的人来说很合适，但不限于这些人。没有编程知识的人可以从书中获得精要知识并立即开始开发项目。无论如何，这本书都将让你准备好树莓派硬件编程所需的所有电子概念。


    # 约定


