    ## 上拉电阻和下拉电阻


    上拉电阻和下拉电阻是电子系统设计中重要的术语之一。正如本节标题所示，有两种类型的拉电阻：上拉电阻将端子拉到供电电压，而下拉电阻将端子拉到地线或公共线。将拉电阻连接到节点或端子上的意义在于，当特定端子上没有输入时，将逻辑电平恢复到默认值。包含上拉或下拉电阻的好处是它可以使电路对噪声敏感，且逻辑电平（1或0）不会因为端子上电压的微小（由噪声引起）而改变。请看所示的示例。它展示了一个带有非门的上拉示例（非门在其输出端子上提供反相输出；如果逻辑为1，则输出为逻辑0）。我们将考虑有、无上拉电阻的影响。下拉电阻的情况也是如此。


    ![](img/294138a424db5b37c44c0a7ad39ef037_56_0.png)


    ### 有无上拉电阻的连接


    通常情况下，逻辑门的输入端子具有高阻抗，因此当输入端子上没有连接时，被称为“浮空”。现在，在前面的图中，最左侧的连接是不推荐的，因为开关是开启的（关闭状态），它导致输入端子浮空，任何噪声都可以改变非门的输入状态。噪声的原因可能是任何原因。甚至是开启的端子也可以当作天线，在非门的引脚上产生噪声。中间所示电路是不带电阻的上拉电路，强烈建议不要使用。这种连接可以被称为上拉，但绝不应使用。当开关关闭（开启状态）时，VCC获得了直接通地的路径，这等同于短路。大量电流将从VCC流向地，这将损坏你的电路。


    最右侧的图显示了上拉的最佳方法，因为有一个电阻会产生一定的电压降。当开关开启时，非门的端子将浮空（上拉）到VCC，这是默认值。当开关关闭时，非门的输入将连接到地并处于逻辑零状态。此时流经电阻的电流是额定的。例如，如果
    VCC = 5V，R7 = 1K，且 I = V/R，则 I = 5mA，处于安全区域。对于下拉电路示例，开关和非门的输入之间可以交换位置。在使用传感器和IC时，请记住，如果数据表或技术手册中使用上拉或下拉的符号，建议在任何需要的地方使用它们。在下一节中，我们将在一种通信协议中使用上拉电阻。


    ## 通信协议


    到目前为止都是理论性的。上一节是为了让你理解电子方面的一些有用概念。微处理器的外设可以包含包括IC和数字传感器在内的众多组件。外设设备可能有大量数据，并且需要将其发送到处理器。它们是如何通信的？处理器是如何理解数据正在进入它并是由传感器发送的？IC和微处理器之间存在串行并行连接。并行连接比单线的快，但较不受欢迎，因为它们需要更多线路，例如8条、16条或更多。PCI总线可以作为并行通信的一个示例。通常在复杂或高密度电路中，处理器连接到许多外设，在这种情况下，我们没有足够的空闲引脚/线路来连接额外的单个IC。串行通信根据使用的协议最多需要四根线。尽管如此，不能说串口优于并行，但在引脚资源较低的情况下，串口是首选的。在串口通信中，数据通过帧或数据包发送。大数据被分成块，并通过帧或数据包通过线路发送。什么是协议？协议是在IC与微处理器接口时需要遵循的一set规则，不仅限于连接。协议还定义了帧结构、帧长度、电压电平、数据类型、数据速率等。有很多标准的串口协议，如UART、FireWire、以太网、SPI、I2C等。RasPi
    1型号A、A+、B+以及RasPi 2型号在扩展口有一个SPI引脚、一个I2C引脚和一个UART引脚。我们将一个一个查看这些协议。


    ## UART


    UART是一种在几乎每台PC或微处理器中都能常见的接口或协议。UART是通用异步收发器（Universal Asynchronous Receiver and
    Transmitter）的缩写。这也被称为RS-232标准。该协议是全双工的完整标准，包括特定通信实例的电气、机械和物理特性。当数据通过总线发送时，数据电平需要改变以适应RS-232总线电平。传输器在总线上发送变化的电压。大于3V的电压值为逻辑零，而小于-3V的电压值为逻辑一。-3V到3V之间的值被称为未定义状态。微处理器将数据发送到晶体管逻辑（TTL）电平；当我们将其发送到总线时，电压电平应增加到RS-232。


