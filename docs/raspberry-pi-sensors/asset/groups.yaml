    # 总结


    我们从物联网（IoT）的基础知识开始本章。各节提供的信息并没有涵盖 IoT 的全部概念。IoT 是一个巨大的领域，包含了传感器节点、传感器网络、通信、云计算、数据分析和安全。IoT
    有许多方面需要开发者投入更多关注。你已经了解到 IoT 可能是互联网和数据的未来，从智能尘埃到智能城市。安全是一个主要的关注点，需要立即关注和研究，以满足嵌入式世界的需求。


    本章让你学习了如何观察从与你的 RasPi 接口的传感器插入到 Google 表格中的数据。你学习了 RasPi 如何代表你记录日志到 Gmail 服务器，并在有实际需要时发送电子邮件。我们准备了一个项目，特意在一天结束时发送一封电子邮件，发送数据分析。数据的最小值和最大值可以是数据分析的一个非常小的示例。将
    `gspread` 电子邮件通知代码集成进来以使代码更具实用性，是一个非常好的挑战。


    在下一章中，我们将把图像传感器（摄像头）与 RasPi 接口并测试其操作性。我们将提供有关安装 OpenCV 库的完整说明，以帮助你开始在 RasPi 上进行图像处理。你将制作一个带有实时视频流的项目，将
    RasPi 用作 CCTV 摄像头并捕捉家中的运动实例。这将是一次奇的体验，使用 OpenCV 这一强大的库来开发项目对你来说将是一个巨大的突破。


    ## 使用摄像头和 OpenCV 创建图像传感器


    在“图像传感器”这个简单的名称背后，有海量的研究。从开发可以拍摄清晰图像的 CMOS 传感器，到使用图像处理进行图像增强，其中包含了大量的努力。制造适用于不同应用和处理算法的不同类型的摄像头并不是易事。


    图像传感器用于摄像头中，它们在未封装的状态下非常难以使用，因为它们脆弱且对静电释放敏感。我们将使用摄像头（基本上是一个带有保护外壳和接口电线的镜头）来演示使用
    RasPi 进行图像捕捉。在讨论中，RasPi 摄像头的性能通常评价较低，因为它在图像处理和视频处理方面的性能不佳，评论说图像处理和视频捕捉不是 RasPi
    的强项。当我们运行具有大量处理需求的计算密集型算法时，RasPi 会给出延迟响应，这些评论在某种程度上是正确的。但这完全取决于摄像头接口时的硬件钩子。当你使用摄像头时，许多因素可能会影响
    RasPi 的性能。这是旧款 RasPi 模型的问题，例如 Raspberry Pi 1 model B、B+ 和 A+。但现在，有了 Raspberry
    Pi 2 model B，情况就不如此了。RasPi 2 model B 的性能比旧 RasPi 模型强六倍。


    ## 使用摄像头和 OpenCV 创建图像传感器


    在本章中，我们将首先对图像处理和 OpenCV 进行简要介绍。然后我们将介绍摄像头接口，并查看可以与 RasPi 接口的各种摄像头。接下来，我们将在 RasPi
    上进行漫长且疲惫（但非常值得）的 OpenCV 库安装。一旦安装了库，我们将编写一个 C 程序从摄像头捕捉图像。更进一步，我们将尝试在与家里相同的网络上进行视频实时流传输。在后续步骤中，将准备一个项目来检测特定区域的人类运动或移动，捕捉图像并立即通知你。


    ## 图像处理


    你是否曾经尝试过将图像缩放到最大级别来查看它？它看起来就像一个铺有整齐瓷砖和彩色图案的地板。图像中的这些正方形瓷砖被称为像素。基本上，图像是一组像素，每个像素包含一个特定的颜色值，通过向人眼提供信息来形成可识别的模式。这取决于人类如何通过观察形状和颜色来感知图像。每个像素包含可以从一个字节（8
    位）或几个字节生成的信息，这定义了图像的深度。图像深度无非单个像素中存在的位数。目前的显示器器和图形引擎支持高达 64 位的图像深度。基本的图像类型有二值、灰度色
    RGB，还有许多其他类型，如 HSV、HLS 和 YCC 等也是已知类型。灰度图像在 8 位模式下具有从 0 到 255 的值范围，而二值图像的范围是 0
    到 1。正如名称所示，二值图像在平面上只有黑色和白色两种颜色。灰度图像和二值图像的区别可以通过以下图像观察到：


    ![](img/294138a424db5b37c44c0a7ad39ef037_158_0.png)


    ## 第 7 章


    RGB 图像共有 3 个平面可以访问，因为它的 R（红色）范围从 0 到 255；G（绿色）和 B（蓝色）颜色在 8 位深度下也是如此。灰度图像具有从白到黑的色调，对于
    8 位深图像，总共有 256 个离散值（0 到 255）。


    执行图像处理是为了将图像增强到特定水平，以提取最大信息。


