    Meeting Your Buddy – the Raspberry Pi


    # # Setting up for the first time


    Following your recent purchase of the RasPi, you now have to make it ready to
    work for you. In this section, we are going to widely install an operating system
    on which our RasPi will run. The most popular, stable, and widely used operating
    system for our RasPi is the Whezy-Raspian.


    The Raspberry runs on an open platform, Debian Linux. Why are we going to use
    Raspian instead of directly using Linux and other flavors of Linux? Simply because
    Raspberry has all device drivers written for the RasPi. In brief, the device driver
    is a program that gives the details of the hardware to the running operating system
    and supports the user interface to take/give commands from the hardware. Our RasPi
    has different hardware than a personal computer or general-purpose computer, the
    modified operating system is needed to completely use all resources on the hardware.
    It is best for those who want to follow the default standards.


    You can download the Whezy-Raspian install (known as an image file) from the Raspberry
    Foundation''s website at http://downloads.raspberry.org/raspberry_latest. If you
    want to install the GUI-free flavor of Linux (Direct CLI), you can try Arch Linux.
    It can be downloaded from the ArchLinuxArm page at http://archlinuxarm.org/os/ArchLinuxARM-rpi-latest.tar.gz.


    # # Installing the operating system


    We need some essential components to successfully start up the RasPi. Note that
    this subsection is for those who are using the RasPi for the first time and have
    not purchased the preloaded SD card. If you have installed the operating system
    on your SD card, then you can skip this section, or just look at the procedure
    to help your friend who has just brought a new RasPi.


    # # Purchasing your SD card


    When you buy a RasPi module, it may or may not be with an SD card. If your RasPi
    did not come with an SD card, then the minimum size you should get is 4 GB. RasPi
    doesn''t have any on-board memory, so purchasing an SD card is the only way to
    get data storage as well as an operating system. I have an 8 GB SD card for my
    RasPi, and it works well and is sufficient for doing almost projects.


    > > For server applications, if you require more space, then an SD card with higher
    space will be useful.'
- md: "\n## Downloading the required software\n\nOnce you have an SD card, you are\
    \ ready for this step. These steps are broadly explained in my personal blog too,\
    \ which you can visit at http://rushgaj.blogspot.in/2014/03/setting-up-raspberry-pi-for-first-time.html.\n\
    \nLet's see the procedure for different operating systems.\n\n## Windows\n\nThese\
    \ things need to be kept in mind while working on Windows:\n\n- Format the SD\
    \ card: Use the SD Card Association's tool (www.sdcard.org/downloads) to format/wipe\
    \ your old data from the SD card. Use of the SD formatter provides optimal performance\
    \ for your memory cards compared to the generic formatting facilities provided\
    \ by your computer's operating system.\n- Write the image of the OS on an SD card:\
    \ The downloaded Raspian OS will be written from a raw disk image to a removable\
    \ device using the popular and free tool, Win 32 Disk Imager (sourceforge.net/projects/win32diskimager/).\
    \ Follow the steps on the screen, and you can easily write an image of Raspian\
    \ on your SD card. Once you are done with this process, jump to the next section.\n\
    \n## Mac OS X\n\nThese things need to be kept in mind while working on Mac OS\
    \ X:\n\n- Download software to write the image of the OS on an SD card: There\
    \ are multiple tools available for Mac OS X users such as ApplePi-Baker, PiWriter,\
    \ and Pi Filler. PiWriter is a CLI-based tool, whereas ApplePi-Baker and Pi Filler\
    \ are GUI-based tools. Pi Filler is recommended to be used because it is simpler\
    \ and faster than other tools. It can be downloaded from http://ivanx.com/raspberrypi/files/PiFiller.zip.\n\
    - Write the image on the SD card: Insert an SD card, locate or choose the downloaded\
    \ image in the tool, and erase the SD card in the automatically popped-up menu.\
    \ Select the continue button to write the image on the SD card.\n\n## Linux\n\n\
    These things need to be kept in mind while working on Linux:\n\n- Unzip the downloaded\
    \ image: If you are using a GUI-based Linux OS on your desktop computer, open\
    \ the download folder and unzip the OS by right-clicking on Extract Here.\n\n\
    ## Meeting Your Buddy – the Raspberry Pi\n\n- Download the software to write the\
    \ image of the OS on an SD card: You can install image writer from the Ubuntu\
    \ Software Center. Open Software Center and ImageWriter. Insert the SD card in\
    \ your desktop and follow the GUI (click on the Write to Device button) to locate\
    \ and write the image on your SD card.\n\n## Expanding the root filesystem\n\n\
    Now, it's time to start the RasPi for the first time. After the process of writing\
    \ an OS on the SD card, insert the SD card into the slot available on the RasPi.\
    \ Connect the display (or TV) through an RCA or HDMI connection, and power up\
    \ the RasPi by connecting a power supply to the micro USB connector. You will\
    \ be able to see the configuration screen. Directly select the expand_rootfs option\
    \ (from the keyboard connected through the USB of the RasPi) and wait for time\
    \ to complete the background process. When you write the image on the SD card,\
    \ everything is in a compact bundle, where it needs to be expanded for the RasPi's\
    \ complete operation. Expanding the root filesystem (expand_rootfs) resizes the\
    \ partitions in the SD card and allows us to utilize the memory space in it. By\
    \ point, you should restart your RasPi.\n\n> Before powering up the RasPi using\
    \ the micro USB, the SD card must be inserted and the HDMI cable must be attached.\
    \ RasPi reads the signals coming through HDMI to check the display connection.\
    \ The display is not available at the first point of startup, it disables the\
    \ HDMI interface and streaming to optimize performance.\n\n## Logging in to the\
    \ RasPi\n\nWhen the RasPi restarts, you will be able to see many pieces of code\
    \ running on the screen. Don't panic! It's a normal process that goes on the RasPi.\
    \ When it becomes stable, it will prompt you to enter the username and password.\
    \ By default, the username and password are pi and raspberry respectively.\n\n\
    > Note that while you are writing your password, you will not be able to see anything\
    \ coming on the screen; don't worry. Welcome to the Linux world!\n\nOnce you've\
    \ entered the correct password, you will be able to see the CLI with pi@raspberry~$\
    \ on screen, monitor, or TV, which is now ready to take commands from you. Aye,\
    \ captain!\n\n## Opening the desktop\n\nEnter the startx command as pi@raspberrypi-$startX\
    \ and press Enter. Now you have a white screen with the Raspberry Pi logo and\
    \ a GUI that looks similar to our personal desktop computers. Take a bite!\n\n\
    So, we saw an easy and compact guide for setting up the RasPi for the first time.\
    \ We'll add more functionality to our RasPi by providing an Internet connection\
    \ for it. A computer is incomplete without an Internet connection, and so is our\
    \ RasPi. This is something we need to solve, especially as we can directly download\
    \ useful libraries and applications on the RasPi through the internet.\n\n## Connecting\
    \ the Raspberry Pi to the Internet\n\nOnce you have finished setting up the RasPi,\
    \ it's time to connect it to the Internet. Basically, there are two very common\
    \ ways of connecting the RasPi to Internet: the first (and easiest way) is via\
    \ Wi-Fi connection using a Wi-Fi dongle, or transceiver; the second is somewhat\
    \ tricky but the most economical and practical way to utilize everything you have\
    \ and without an additional Wi-Fi dongle. This will require a laptop/desktop computer\
    \ (a PC) and an Ethernet cable. We will see how follow each of the ways.\n\n##\
    \ Internet connection through Wi-Fi dongle\n\nYou can purchase the dongle for\
    \ the RasPi from any leading online store or an electronics store near you. It\
    \ ranges from 10 to 20 USD at the time of writing this book. While in the process\
    \ of purchasing, read about the power requirements of the dongle. You can purchase\
    \ the miniature Wi-Fi dongle available on Adafruit, or a dongle from brand names:\
    \ PiFi or Edimax. If you are thinking of giving a try to your Internet connection\
    \ sharing, then this section can be skipped. The basic steps for establishing\
    \ the Wi-Fi network connection are introduced here.\n\n> It is advisable to use\
    \ either of the methods at once. If you choose to use the Wi-Fi dongle, then you\
    \ can skip the section of Ethernet sharing and vice versa.\n\nIn the CLI of the\
    \ RasPi, enter the following command to note down the gateway and longterm of\
    \ the Ethernet connection that you can add a static IP defined in the interface\
    \ file in the upcoming steps:\n```\nnetstat -nr\n```\n\n## Meeting Your Buddy\
    \ – the Raspberry Pi\n\nWe have to perform the following steps to enable the Wi-Fi\
    \ network connection:\n\n- 1. Go to the network interfaces file of the RasPi by\
    \ entering the `sudo nano /etc/network/interfaces` command in the CLI. Note that\
    \ you will get acquainted with these commands in the upcoming sections. Once you\
    \ enter the command, the text you need to change is:\n```\nauto lo\niface lo inet\
    \ loopback\niface eth0 inet static\n    address 169.254.0.2\n    netmask 255.255.0.0\n\
    \    broadcast 169.254.0.255\n    gateway 0.0.0.0\n\nallow-hotplug wlan0\niface\
    \ default inet dhcp\n    wpa-ssid \"ssid_name\"\n    wpa-psk \"password\"\n```\n\
    \n> Do not forget to put ssid (your network name) and your password (you know\
    \ it!) in the quotes.\n\n- 2. After editing the file, press `Ctrl + X` and press\
    \ Y to confirm the edit made by you.\n\nShut down the RasPi by entering the `sudo\
    \ poweroff` command. You then need to connect the Wi-Fi dongle and turn it in\
    \ again. While it is booting up, it finds the Wi-Fi adaptor connected to it. Pretty\
    \ simple, isn't it!\n\n## Internet connection through Ethernet\n\nFor this method,\
    \ you just need an Ethernet cable, a power supply, RasPi, the SD card with Raspian,\
    \ your laptop/desktop (a PC), the Windows operating system. You do not need any\
    \ Wi-Fi dongles.\n\nSo all we need is an Ethernet cable, a power supply, RasPi,\
    \ the SD card with Raspian, your laptop/desktop (a PC), the Windows operating\
    \ system. I will run you through the step-by-step. If you follow it, you'll have\
    \ a working Internet connection provided from your PC with no added costs of Wi-Fi\
    \ dongles.\n\n## Editing the command-line file of the RasPi\n\nThe first step\
    \ is to edit the file that RasPi checks when it starts. Try inserting the SD card\
    \ of the RasPi into your PC's SD card reader. Open Explorer (where all the drives\
    \ are listed); you can find the removable media. You will be amazed to see that\
    \ the partition is about 15 MB to 20 MB, but your card is actually 8 GB or 16\
    \ GB! Don't panic; it's the boot space of RasPi. You will be able to see the multiple\
    \ files on this media. We are interested in editing the cmdline.txt file. Just\
    \ double-click on the file (or open it in Notepad), and you will be able to see\
    \ the following startup commands:\n\n```\ndwc_otg.lpm_enable=0 console=ttyAMA0,115200\
    \ kgdboc=ttyAMA0,115200 console=tty1 root=/dev/mmblk0p2 rootfs=ext4 elevator=deadline\n\
    rootwait\n```\n\nYou can change some settings by adding the static IP address\
    \ of RasPi at the end of the line (take a look at the following code). There is\
    \ no need to understand the meaning of all of these parameters at this stage;\
    \ I will introduce them when they will be useful.\n\n```\ndwc_otg.lpm_enable=0\
    \ console=ttyAMA0,115200 kgdboc=ttyAMA0,115200 console=tty1 root=/dev/mmblk0p2\
    \ rootfs=ext4 elevator=deadline\nrootwait ip=169.254.0.2\n```\n\nIn bold, you\
    \ will set the static IP you have provided for the RasPi.\n"
  mdcn: '


    ## 下载所需的软件


    一旦你有了一张 SD 卡，就可以开始这一步了。这些步骤在我的个人博客中也有详细的解释，你可以访问：http://rushgaj.blogspot.in/2014/03/setting-up-raspberry-pi-for-first-time.html。


    让我们看看不同操作系统的流程。


    ## Windows


    在 Windows 上操作时，需要记住以下几点：


    - 格式化 SD 卡：使用 SD 存储协会的工具（www.sdcard.org/downloads）来格式化/清除 SD 卡上的旧数据。与计算机操作系统提供的通用格式化功能相比，使用
    SD 格式化工具可以为你的内存卡提供最佳性能。

    - 将操作系统镜像写入 SD 卡：下载好的 Raspian 操作系统将使用流行的且免费的工具 **Win 32 Disk Imager**（sourceforge.net/projects/win32diskimager/），从原始磁盘镜像写入到可移动设备中。按照屏幕上的步骤进行操作，你就可以轻松地在你的
    SD 卡上写入 Raspian 镜像。完成此过程后，跳转到下一节。


    ## Mac OS X


    在 Mac OS X 上操作时，需要记住以下几点：


    - 下载将操作系统镜像写入 SD 卡 卡的软件：Mac OS X 用户有多种工具可用，如 ApplePi-Baker、PiWriter 和 Pi Filler。PiWriter
    是一个基于命令行（CLI）的工具，而 ApplePi-Baker 和 Pi Filler 是基于图形界面（GUI）的工具。推荐使用 Pi Filler，因为它比其他工具更简单更快速。你可以从
    http://ivanx.com/raspberrypi/files/PiFiller.zip 下载。

    - 将镜像写入 SD 卡：插入 SD 卡，在工具中定位或选择下载的镜像，并在自动弹出的菜单中清除 SD 卡。选择继续（continue）按钮将镜像写入 SD
    卡。


    ## Linux


    在 Linux 上操作时，需要记住以下几点：


    - 解压下载的镜像：如果你在桌面电脑上使用基于 GUI 的 Linux 操作系统，请打开下载文件夹并右键点击“提取此处”（Extract Here）来解压操作系统。


    ## 认识你的伙伴 – 树莓派


    - 下载将操作系统镜像写入 SD 卡 卡的软件：你可以从 Ubuntu 软件中心安装 image writer。打开软件中心并运行 ImageWriter。将
    SD 卡插入你的桌面电脑，并按照 GUI 指引（点击“写入设备”按钮）定位并将镜像写入你的 SD 卡。


    ## 扩展根文件系统


    现在，是时候第一次启动树莓派了。在向 SD 卡写入操作系统的过程之后，将 SD 卡插入树莓派上的空槽中。通过 RCA 或 HDMI 连接连接显示器（或电视），通过将电源连接到
    micro USB 接口为树莓派供电。你将看到配置界面。直接选择 expand_rootfs 选项（通过树莓派 USB 连接的键盘），并等待后台进程完成。当你将镜像写入
    SD 卡时，所有内容都在一个紧凑的包中，需要为树莓派的完整运行进行扩展。扩展根文件系统（expand_rootfs）会调整 SD 卡中分区的大小，允许我们利用其中的内存空间。此时，你应该重启树莓派。


    > 在使用 micro USB 为树莓派供电之前，必须插入 SD 卡并连接 HDMI 线缆。树莓派会读取通过 HDMI 传的信号以检查显示器连接。在启动初期，显示器不可用，它会禁用
    HDMI 接口和流传输以优化性能。


    ## 登录树莓派


    当树莓派重启时，你将看到屏幕上运行着许多代码。不要慌！这是树莓派上运行的正常过程。当它稳定后，它会提示你输入用户名和密码。默认情况下，用户名是 pi，密码是
    raspberry。


    > 注意，在你输入密码时，屏幕上不会显示任何内容；不用担心。欢迎 Linux 世界！


    一旦你输入了正确的密码，你就能在屏幕、显示器或电视上看到带有 `pi@raspberry~$` 的命令行（CLI），它现在准备好接收你的命令了。遵，船长！


    ## 打开桌面


    作为 `pi@raspberrypi-$` 输入 `startx` 命令并按回车。现在你有一个带有树莓派标志的白色屏幕和一个类似于我们个人桌面电脑的 GUI。尝尝吧！


    如此，我们看到了一份关于首次设置树莓派的简单紧凑的指南。我们将通过为树莓派提供互联网连接来增加更多功能。没有互联网连接的计算机是不完整的，树莓派也是如此。这是我们需要解决的问题，特别是我们可以直接通过互联网在树莓派上下载各种库和应用程序。


    ## 将树莓派连接到互联网


    一旦你完成了树莓派的设置，就是时候将其连接到互联网了。基本上，连接树莓派到互联网有两种非常常见的方法：第一种（最简单的方法）是通过使用 Wi-Fi 适配器或接收器进行
    Wi-Fi 连接；第二种有点复杂，但它是利用所有现有资源的最经济实用方法，不需要额外的 Wi-Fi 适配器。这需要一台笔记本/台式电脑（PC）和一根以太线。我们将看到如何遵循每种方法。


