    the local time zone while logging the data. It is much more difficult once you
    set up your logging device or sensor node in a remote place that doesn''t have
    uninterrupted power supply. You might have noticed that whenever the RasPi boots,
    the clock shows the incorrect time. Check it by entering the date command in the
