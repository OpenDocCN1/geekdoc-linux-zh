    # 使用 ADC 在树莓派上连接任何模拟传感器


    在本章中，你将学习如何使用和接口 ADC 模块。你将从 ADC 的基础知识及其背后的简单数学开始学习。一旦你学会了获取模拟值的计算方法，我们将查看一种由 Microchip
    Technology 制造的名为 MCP3008 的特定 ADC IC。然后，你将获得关于 MCP3008 的核心知识，以便于准备通用硬件和传感器站，使你能够通过它连接任何传感器。同样，我们可以编写通用软件，通过树莓派扫描
    ADC 转换芯片的任何通道。使用该软件，我们能够将传感器站转换为数据记录器。这些数据最终可以保存到 .csv 文件中以便事后处理。


    让我们先来看 ADC。


    ## 模数数字转换器


    在本节中，我们将介绍 ADC 模块的类型以及信号的转换过程。我们将深入探讨以下问题的答案：ADC 模块如何处理输入的数据？是否所有的 ADC 模块都需要外部信号调理电路和放大？ADC
    模块如何提供数据输出？如何衡量 ADC 的质量？在处理数据时需要哪些计算？


    ADC 模块是微处理器或微控制器中信号调理电路的一部分。与树莓派不同，大多数基于微控制器和微处理器的板都嵌入了 ADC 模块以及信号调理电路。大多数传感器可以直接与这些类型的处理器集成。在实际上，在复杂的系统中，这些调理网络有许多阶段来处理输入的数据。某些处理器具有专门的信号处理核心或单元来处理数据。ADC
    和数字模拟转换（DAC）的话题非常广泛，以至于可以写一整本书来解释其功能和相关项目。在不深入 ADC 细节的情况下，我们将涵盖基本的术语和功能。


    ## 数据接收与信号调理


    当数据进入处理器时，ADC 模块的首要任务是从接收到的传感器信号中过滤掉不需要的噪声。这种滤波器被称为抗混叠滤波器，用于避免采样期间观察混叠效应。为了满足奈奎斯特采样定理的要求，采样率应该是信号频率的两倍（或更高），否则在采样信号时带宽会扩展并重叠，从而产生不需要的噪声和串扰问题。为了克服这种现象，使用了抗混叠滤波器以确保在所需的频率范围内接收到信号。有时还会设计额外的滤波器（如带通滤波器）来过滤掉不需要的频率。


    来自传感器的信号幅度通常很微弱且变化很大。如今，先进传感器能够提供足够强的信号，可以直接馈送微处理器。然而，情况并非总是如此。在模拟数据采集系统中，我们需要放大后的信号进入滤波器。为了实现该操作，我们需要在滤波阶段之前或之后放大级。


    ## 放大


    有时信号可能与噪声信号相似。某些智能 ADC 模块由于信号缺乏足够的电压或电流（基本上是低功率）而丢弃输入数据。在这种情况下，我们使用电流、电压或功率放大器分别提升信号的电流或电压功率级。例如，温度传感器或运动传感器提供的信号电压非常低（mV），这个电压范围对于
    ADC 模块启动转换过程来说太低。因此需要提升到所需的电压范围。在大多数电路中，运算放大器（Op-Amp）用于电压和电流放大。用于信号调理的放大器有对数放大器、仪表放大器、峰值检测器等。


    ## 采样与量化


    采样和量化是电子通信理论中广泛使用的术语。这些理论对于电子初学者来说太复杂。根据定义，采样是指在模拟输入引脚或放大器输出端对连续输入的数据按预定义的频率获取电压水平的过程。量化是通过采样器将大量的输入值映射或缩短为一组可计数的数字（在这种情况下是数字位组合）的过程。量化总是产生量化误差，因为它对连续的输入值进行了舍入，并对其最接近的值进行了近似。


    ## ADC 类型


    在电子设计方面，针对不同类型的 ADC 有多种设计结构。广泛使用的 ADC 包括闪存转换 ADC、逐次逼近 ADC、ΣΔ（sigma-delta）ADC 等等。闪存转换
    ADC 使用时钟和比较器，并以并行模式运行。它是将模拟数据转换为数字的最快的方法。逐次逼近 ADC 也使用比较器来缩小输入电压的范围。它通过将输入电压与内部
    DAC 比较来进行近似，并将结果存储在逐次逼近寄存器中。ΣΔ ADC 采样信号并过滤其频率。它以固定间隔计算这些脉冲，因此间隔计数的脉冲给出了准确的数字表示。ADC
    的类型和描述无穷无尽，在本节中无法描述。现在让我们来看更重要的内容。


    ## ADC 分辨率


    分辨率是描述或学习 ADC 时最重要的术语之一。ADC 分辨率是指在模拟输入电压范围内可以产生的数值数量。例如，一个 8 位分辨率的 ADC 可以有 256
    种不同的数值组合，因为 $2^8 = 256$。在这里，电压间隔的数量可以定义为 $2^N$ 级，其中 $N$ 是 ADC 的位分辨率。当我们谈论分辨率时，总是会考虑参考电压。参考电压是通过
    ADC 模拟输入端的专用输入引脚提供的另一个输入。大多数 ADC 有两种类型的输入：参考电压和模拟输入。


