    to zero and break the for() loop if it reaches the 255 value (setting a timeout).
    Wait for every bit coming from a sensor the digitalRead() function in a while()
    loop condition, and whenever the bit is changed, we will break the loop and save
    the last state into a variable. This is how it''s done:


    ```

    value = 0;

    while(digitalRead(DHT) == prev_state)

