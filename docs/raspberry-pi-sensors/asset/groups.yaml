    # CS0 (CE0) CS1(CE1)


    ![](img/294138a424db5b37c44c0a7ad39ef037_61_0.png)


    ## Inter-Integrated Circuit


    Inter-Integrated Circuit (I2C) is a protocol that works with two wires and it
    is a half-duplex (a type of communication where whenever the sender sends the
    command, the receiver just listens and cannot transmit anything; and vice versa),
    multimaster protocol that requires only two wires, known as data (SDA) and clock
    (SCL). The I2C protocol is patented by Philips, and whenever an IC manufacturer
    wants to include I2C in their chip, they need a license. Many of the ICs and peripherals
    around us are integrated with the I2C communication protocol. The lines of I2C
    (SDA and SCL) are always pulled up via resistors to the input voltage. The I2C
    bus works in three speeds: high speed (3.4 MBps), fast (400 KBps), and slow (less
    than 100 KBps). It is heard that the I2C communication is done up to 45 feet,
    but it''s better to keep it under 10 feet.


    ## Meeting the World of Electronics


    Each I2C device has an address of 7 to 10 bits; using this address, the master
    can always connect and send data for that particular slave. The slave manufacturer
    provides you with the address to use when you are interfacing the device with
    the master. Data is received at every slave, but only that slave can take the
    data for which it is made. Using the address, the master reads the data available
    in the predefined data registers in the sensors, and processes it on its own.
    The general setup of an I2C bus configuration can be done as shown in the following
    diagram:


    ![](img/294138a424db5b37c44c0a7ad39ef037_62_0.png)


    There are 16 x 2 character LCD modules available with the I2C interface in stores;
    you can just use them and program the RasPi accordingly. Usually, the LCD requires
    8/4 parallel data bits, reset, read/write, and enable pins. The I2C pins are represented
    in the following image, and they can be located in the same place on all RasPi
    models:


    ![](img/294138a424db5b37c44c0a7ad39ef037_62_1.png)


    The I2C protocol is the most widely used protocol among all when we talk about
    sensor interfacing. Silicon Labs'' Si1141 is a proximity and brightness sensor
    that is nowadays used in mobile phones to provide the auto-brightness and near
    proximity features. You can purchase it and easily interface it with the RasPi.
    SHT20 from Sension also comes with the I2C protocol, and it can be used to measure
    temperature and humidity data. Stepper motor control can be done using I2C-based
    controllers, which can be interfaced with the RasPi. The most amazing thing is
    that if you have all of these sensors, then you can tie them to a single I2C,
    with RasPi you get to know in the next section that we cannot use many GPIOs on
    RasPi 1 model B or B+ and RasPi 2 model B. Therefore, the modules with the I2C
    interface are available for low-pin-count devices. This is why your serial communication
    is useful.


    These protocols are mostly used with the RasPi. The information given here them
    is not detailed, as numerous pages can be written on these protocols, but while
    programming the RasPi, this information can help you build the projects.


    ## Useful tips and precautions


    Before we discuss the practicality of the RasPi, let''s look at the precautions
    and tips when working with RasPi. You need to read this, as you are now going
    to work with the GPIOs of the RasPi. This section will give you generalized tips
    and warnings to keep in mind when working with the RasPi:


    - Avoid touching the electronic components on the RasPi, as even a small amount
    of sweat or a static charge from your body can spoil the board. The components
    on the board are so small that it can be affected by a very small amount of sweat
    in your hand, and by water. Touch it from the corners, or always using a casing
    to cover it. There are plenty of these available in e-stores.


    - Take care when putting the RasPi on the table. If there is a small part (cut
    pieces of wires) or the table itself is made of metal, it can short the connections
    to the RasPi.


    - Never connect any device that provides voltage higher than 3.3V to the RasPi''s
    GPIO pins. In Chapter 3, Measuring Distance Using Ultrasonic Sensors, we will
    face this scenario and you will learn how it can be, overcome. Whenever you think
    of connecting any device to the RasPi, get all the details of the power ratings
    of device. Please avoid connecting the 5V supply line of the RasPi by connecting
    the jumper wire to the GPIOs.


    - When using low-power LEDs, it is good practice to include the resistor (270
    to 330Ω will be good) in series with the positive wire of the LED. Please do not
    randomly plug the power sources and wires into your RasPi. It is advised that
    you do not short the two pins on the board directly.


    - Do not try to connect components that require much power to your RasPi; LEDs
    are okay, DC motors are not. If you want to interface the RasPi, you need a motor
    driver.


    ## Understanding the GPIO


    If we compare this pin-out with RasPi 1 model B+, we see that every pin number
    26 is the same. Every pin on this port acts as an access point to communicate
    with the RasPi. Let''s see the pins one by one. Pins 1 and 2 are the power supply,
    if you need low-power sensors or some peripheral needs to be powered by these
    pins.


    > Be careful when using the 3.3V and 5V pins. Never connect both the voltage supply
    pins with each other directly or the 5V line to any of the GPIOs. You may think
    that you are giving logic high for project purposes, but the RasPi is made to
    take only 3.3V and not 5V, so choose the peripherals that can work on 3.3V. With
    the peripherals working on 5V, you need some protection circuit in between (such
    as diode circuitry), and then you can connect to the GPIO line.


    Now, pins 3 and 5 are the pins for the I2C communication protocol. You might think
    that you will need pull-up resistors as discussed in the previous sections with
    I2C, but luckily, these pins are already pulled up with the resistors (1.8 kΩ)
    on board with 3.3V. You need not worry about the pulling up for interencing of
