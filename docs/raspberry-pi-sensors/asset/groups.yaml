    wire with no resistance, let''s see Ohm''s law results in: R = 0Ω then I = V/0,
    so I = ∞. In this theory, this is called infinite (countable), and practically,
    it means a fire or a blast!


    # Series and parallel connections


    In electrical theory, when the current flowing through a component does not divide
    into paths, it''s a series connection. Also, if the current flowing through each
    component is the same then those components are said to be in series. If the voltage
    across all the components is the same, then the connection is said to be in parallel.
    In a circuit, there can be combination of series and parallel connections. Therefore,
    a circuit may not be purely a series or a parallel circuit. Let''s study the circuits
    shown in the following diagram:


    ![](img/294138a424db5b37c44c0a7ad39ef037_54_0.png)'
  - '[PAGE 55]


    # Chapter 2


    At the first glance, this figure looks complex with many notations, but let''s
    look at each component separately. The figure on the left is a series connection
    of components. The battery supplies voltage (V) and current (I). The direction
    of the current flow is shown as clockwise. In a series connection, the current
    flowing through every component is the same, but the voltage values across all
    components are different. Hence, V = V1 + V2 + V3. For example, if the battery
    supplies 12V, the voltage across each resistor is 4V. The current flowing through
    each resistor is 4 mA (because V = IR and R = R1 + R2 + R3 = 3K).


    The figure on the right represents a parallel connection. Here, each of the components
    gets the same voltage but the current is divided into different paths. The current
    flowing from the positive terminal of the battery is I, which is divided into
    I1 and I2. When I flows to the next node, it is again divided into two parts and
    flown through R5 and R6. Therefore, in a parallel circuit, I = I1 + I2. The voltage
    remains the same across all the resistors. For example, if the battery supplies
    12V, the voltage across all the resistors is 12V but the current through all the
    resistors will be different. In the parallel connection example, the current flown
    through each circuit can be calculated by applying the equations of current division.
    Give it a try to calculate!


    When there is a combination of series and parallel circuits, it needs more calculations
    and analysis. Kirchhoff''s laws, nodes, and mesh equations can be used to solve
    such kinds of circuits. All of that is too complex to explain in this book; you
    can refer any standard circuits-theory-related books and gain expertise in it.


    > Kirchhoff''s current law: At any node (junction) in an electrical circuit, the
    sum of currents flowing into that node is equal to the sum of currents flowing
    out of that node.

    Kirchhoff''s voltage law: The directed sum of the electrical potential differences
    (voltage) around any closed network is zero.'
