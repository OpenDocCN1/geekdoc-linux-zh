    webcam_localhost off

    control_localhost off

    control_port 8080

    framerate 2

    control_html_output on

    daemon on

    ```


    ![](img/294138a424db5b37c44c0a7ad39ef037_163_0.png)


    > 可以使用 ifconfig eth0 命令找到 RasPi 的 IP 地址。在响应消息中，必须在第二行记为 inet addr:169.254.0.252。


