    # A glance at the Raspberry Pi board


    Before we get started, it''s time to reintroduce our good friend, the Raspberry
    Pi. Kudos to the designers of the board, who have packed everything we need to
    accomplish our projects in a credit-card-sized printed circuit, also called a
    credit-card-sized single-board computer. There are two versions of Raspberry Pi:
    Raspberry Pi 1 and Raspberry Pi 2. Due to earlier developments, the Raspberry
    Pi 1 family consists of model A, A+, model B, and B+. The recently launched model
    is Raspberry Pi 2, the new addition to the model B category. Nowadays, the most
    used Raspberry Pi is model B+, which is also called the original Raspberry Pi
    board in the Raspberry Pi 1 family. The predecessor of the Raspberry Pi 1 models
    B and B+ was model A, which is not widely used in the hobbyist space compared
    to other models such as A+ and B+. If you are not aware of the specifications
    of these boards, take a look at the complete comparison in the following table,
    which contains the comparable parameters of the current models of Raspberry Pi
    1 and 2. Then you can choose a board that you want.


    | Features | Raspberry Pi 1 | Raspberry Pi 2 |

    | --- | --- | --- |

    | Models | B | A+ | B+ | B |

    | Processor | BCM2835 | | BCM2836 |

    | Processor cores | Single | | |

    | Speed | 700 MHz | | 900 MHz |

    | RAM | 512 MB | 256 MB | 512 MB | 1024 MB |

    | GPU | VideoCore IV | | | |

    | Pin header | 26 pin | 40 pin | 40 pin | 40 pin |

    | Audio and video ports | RCA, HDMI port | 3.5 mm jack, merged audio-composite
    video and HDMI port | | |

    | Ethernet port | Yes | | Yes | Yes |

    | USB ports | 2 | 1 | 4 | 4 |

    | Power | Micro USB port | | | |

    | Digital interfaces | CSI (camera), DSI (display) ribbon cable connectors | |
    | |

    | Memory card | SD | MicroSD | | |'
