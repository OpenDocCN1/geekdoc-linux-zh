    # Creating an Image Sensor Using a Camera and OpenCV


    In this chapter, we will start off by giving a brief introduction to image processing
    and OpenCV. Then we will go through the camera interfacing ports and look at the
    different kinds of cameras that can be interfaced with the RasPi. Next we will
    do a long and tiring (but well-worth the time) installation of the OpenCV library
    on our RasPi. Once the libraries are installed, we will write a C program to capture
