  mdcn: "\n该硬件现在可以用于创建一个通用接口，以从多八个不同传感器检索数据。此硬件设置将在树莓派（RasPi）板的连接之外完成。一旦电路制作完成，我们将使用排线对其进行接口连接。让我们查看原理图中的连接器。从电路最右侧数的第二个连接器标记为\
