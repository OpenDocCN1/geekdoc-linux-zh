    different things around us; for example, changes in the temperature can be felt
    by our skin, but we cannot precisely say what the actual temperature value that
    we are feeling is. Computers such as RasPi can be used to sense and monitor the
    surrounding entities. It does the job well, precisely, and untiringly. The computing
    and interfacing capability of RasPi allows us to interface sensors with it.


    Measuring distance using meter tapes and odometers is impractical or inconvenient
    for some of the applications. If you want to measure the depth of the ocean, how
    can you use meter tapes? The best option is to use technology such as Sonar or
    satellites. However, in our homes, labs, and in our daily life, we often use ultrasonic
    sensors for various applications. These applications include overhead tank water-level
    observation and automated path-finding robots. They also act as an aid to the
    visually impaired person, as a vehicle parking assistant, and so on.


    In this chapter, you will learn the basics of a widely used distance meter, the
    ultrasonic sensor. You will understand how to use the distance calculation formulas
    on the RasPi. Further on you will also learn about the hardware connections of
    the board and also the fundamental requirements to make certain connections. Software
    level understanding is essential while using the ultrasonic sensor to run the
    codes and measure the distance precisely.


    By the end of this chapter, we will have a project ready. This project will assist
    the visually impaired to avoid obstacles'
