    # Meeting Your Buddy – the Raspberry Pi


    > For example, in one of your applications, if the temperature falls below 20
    degree Celsius then the thermostat connected to your RasPi gets the signal through
    the specific GPIO assigned and it starts heating. GPIOs typically work in logic
    high (1, ON) and logic low (0, OFF), and this will work the way you program it!


    +   - RCA video out: This is the most widely used and one of the oldest connectors
    that both old and new televisions or displays use. It carries the video signal,
    which is the type output on the RasPi. The RCA connector or composite video signal
    is merged with a 3.5 mm audio jack on RasPi 1 model A+ and model B and RasPi 2
    model B.

    - 3.5 mm audio jack: If you are not using the HDMI connection (which will be described),
    the audio can be played through speakers or headphones using a standard 3.5 mm
    jack. In RasPi 1 model B+ or RasPi 2 model B, audio jack being the combination
    of composite and audio has all the functionalities of composite video and audio
    out.

    - USB: This is the most common connector, widely used in the modern computers,
    and hence called the Universal Serial Bus. You can connect your flash drives,
    keyboard, Wi-Fi dongles, and mouse to play around with the RasPi. You can also
    connect the externally powered USB hub with RasPi to connect more USB-based peripherals.

    - Ethernet: This is one of the most important connections to have a remote login
    on RasPi and provide wired internet connection. In the next sections of this chapter,
    we will be using it. We cannot always connect RasPi to the dedicated display,
    so we use the remote login, and we see the entire desktop or Command-line Interface
    (CLI) of RasPi on our computer screen.

    - CSI camera connector: The RasPi does not have a camera module integrated, but
    a separately bought camera module can be interfaced using the CSI connector via
    a 15cm flex cable. A longer flex cable will lead to bad quality of images. The
    5-megapixel Raspberry Pi camera module can be used to record high-definition videos
    as well still photographs. It''s easy to use for beginners, but has plenty to
    offer advanced users if you''re looking to expand your knowledge. This camera
    module provides improved performance over a USB-connected camera.

    - HDMI connector: The High-definition Multimedia Interface (HDMI) is a compact
    audio/video interface to transfer uncompressed media data. You can connect your
    modern HDTV to watch full definition (FHD/HD) videos through the RasPi. If you
    plug in the HDMI connector, there is no need to connect the speakers to the audio
    jack, and if you want to get sounds on both HDMI and the 3.5 mm jack, then you''ll
    have to play with and edit the internal files of Linux.'
  - '[PAGE 29]


    # Chapter 1


    +   Micro USB power: You survive on food, don''t you? Well, so does the RasPi
    (kind of). It needs power supply to operate. The device can be powered by a 5V
    input voltage, and the current ratings solely depend upon what you have hooked
    up to RasPi. Have you seen any power button on RasPi? In fact, the RasPi module
    does not have the power on. Therefore, just plugging the Micro USB power adapter
    will boot the RasPi.


    > The maximum current the Raspberry Pi models A and B can use is 1 ampere, if
    so you need to connect to a USB device that will take the requirements of the
    Raspberry Pi above 1 ampere, then you must connect it to an externally powered
    USB hub. For example, a USB disk will need an ample amount of current to operate,
    which RasPi cannot deliver through the USB port. Alternatively, the maximum power
    B+ can use 2 amperes before needing to connect devices to an externally powered
    USB hub. There are power banks and batteries available for connecting to the RasPi
    if you are designing a remotely operated car or a quadcopter. If you are not sure
    how much power the USB device is to take, buy an externally powered USB hub. Do
    not go above 2.4 amperes in any case, because this will destroy your RasPi if
    peripheral current is high—it will be dead!


    ![](img/294138a424db5b37c44c0a7ad39ef037_29_0.png)


    +   SD card slot: The SD card is important because it is where the RasPi keeps
    its operating system. It is also where you will store your documents, programs,
    and pictures. It is the secondary and a necessary memory part for the RasPi, the
    on-board RAM being the primary. Model B requires the standard-sized SD card (the
    big one!), whereas model B+ requires the microSD card.


    > It is suggested to purchase the microSD card with the SD card adaptor that if
    you switch over from RasPi 1 model to B+ or RasPi 2 model B, you can retain the
    operating systems and your programs. Additionally, after installing the libraries
    and settings, the OS crash can be painful. To avoid this, the periodic backup
    of the entire OS should be taken, and this can be used to install the OS on a
    new SD card again. The microSD card can easily be contained in an SD adaptor to
    convert it into a normal SD card, with no performance losses.


    +   Display connector: Last but not least, the display connector is used to connect
    a 7-inch finger-touch LCD display to the board for your embedded product development.
    But usually, the RCA and HDMI are enough. If your application requires this, then
    you will need to use it.


