    - 6. In the second row, enter the data.

    - 7. In the third row, enter the data as well.

    - 8. Close the tab, and we are ready to code.


    ## Uploading Data Online - Spreadsheets, Mobile, and E-mails


    A desktop computer has an inbuilt button cell to power the internal RTC. To achieve
    this with the RasPi, you can interface an IC called DS1307, which communicates
    over the I2C protocol. You can fetch the time from the RTC whenever you want.
    You can power this IC with the CR2032 button cell. Illustrating the interface
    of this hardware may require another section, and it is beyond the scope of this
    book. We can use a simpler way of synchronizing the clock since we have an Internet
    connection on the RasPi. We will use the Network Time Protocol (NTP) service to
    provide the date and time for the RasPi. For a long time, this protocol has been
    used to keep time synchronization between two computers or servers. On Whezy Raspian,
    the NTP client is already installed. All you need to set is the daemon at startup,
    which runs in the background, to fetch the timings from the Internet servers.
    The following code to set the daemon:


    ```

    sudo nano /etc/rc.conf

    ```


    You may see the blank configuration file, which you can write this:


    ```

    DAEMONS=(!hwclock ntpd ntdate)

    ```


    In the preceding command, the ! mark means that the hardware clock will remain
    as it, but we will update the software clock in the background. Press Ctrl + X,
    then Y, and then the Enter key to save and exit the configuration file. Then reboot
    the RasPi by entering the sudo reboot command. This daemon will be silently running
    in the background.


    Upon reboot, just check the system time by entering the date command, and tally
    with the current time and date.


    > If you did not set the time zone of the RasPi, then you might see the wrong
    date and time displayed by the Date command. To set the time zone, you can enter
    one of the following commands:

    Enter sudo dpkg-reconfigure tzdata and follow the user interface with the keyboard.

    Alternatively, you can also set the same configuration you did at the first step
    by commanding sudo raspi-config to open a RasPi configuration menu, and then navigate
    into the international locale settings. Reboot the RasPi once you configure this.


    ## Uploading data on Google spreadsheets


    We are all set with the synced time to the local zone. We can create an application
    that does the same data logging as we did in the previous chapter, but this time
    it is different and cool. We upload the data on Google spreadsheets, and the data
    can be accessed from any corner of the world. You can monitor home temperature
    and humidity by sitting in your office. Either you can grab the project you did
    in Chapter 4, Monitoring the Atmosphere Using Sensors, and observe the temperature
    and humidity with the DHT11 sensor, or you can just bring the sensor built in
    the previous chapter using MCP3008.


    Before we get into the code, we need to prepare the things listed here. Use your
    personal computer''s Internet browser to perform these steps:


    - 1. Log to your Gmail account or create a new one.

    - 2. Open or link Google Drive by logging onto http://www.drive.google.com with
    your Gmail ID.

    - 3. In the user interface of Google Drive, on the left-side panel, click on the
    New button and select the Spreadsheet.

    - 4. Name the spreadsheet as Logging.

    - 5. In the first row, create the headers as Time and Temperature.

    - 6. In the second row, enter the data.

    - 7. In the third row, enter the data as well.

    - 8. Close the tab, and we are ready to code.


