  - '[PAGE 97]


    To measure the ambient light variance (luminance) in your room, we will use a
    CdS cell (photoresistor). We can purchase PDV-P8001 from Advanced Photonics Inc.
    and 350-00009 for Parallax. We can easily get the Cd5 photoresistor from Adafruit;
    this photoresistor is similar to PDV-P8001. It is also available on SparkFun termed
    as photocurrent. If there are multiple options, choose the photoresistor that
    has larger dark resistance values (in ranges of several KΩ–MOΩ).


    Let''s plunge into each of the sensors and understand how they work.


    # InsideDHT – temperature and humidity sensors


    DHT is a combined pack of temperature and humidity sensors. These sensors are
    ideal for hobbyists who just want to do data logging. DHT11 sensors are slow in
    terms of retrieving data. As it is a combined pack, it contains a resistive sensor
    (thermistor) and capacitive humidity sensor. A thermistor changes its resistance
    value depending on the changes in temperature. Technically, all resistors act
    as thermistors because they dissipate heat when the current is passed through
    them and are responsible for power losses. However, a resistor''s characteristic
    is that when they are heated up from the external source, the resistance changes
    a little bit, which is not the case with the thermistor; its resistance changes
    in terms of several hundred ohms when there is a slight change in the ambient
    temperature. A DHT11 temperature sensor provides accuracy near to 2 degree Celsius
    in the range of 0 degree Celsius to 55 degree Celsius and compared to these values.
    On the other hand, a DHT22 temperature sensor performs well by providing accuracy
    near 0.5 degree Celsius in the temperature range of approximately -38 degree Celsius
    to 120 degree Celsius.


    Let''s now understand the humidity sensor. The DHT has an integrated humidity
    sensor that is not effective for critical-safety applications. There are polymers
    or metal oxides arranged in such a way that they capacitive plates inside a sensor.
    Due to the effect of humidity, the dielectric constant of the capacitor is changed,
    and this gives us a variance in the values of humidity. These humidity sensors
    do not guarantee accuracy, but they are suitable for some applications. The accuracy
    of a DHT11 temperature sensor is 5 percent in the range of 20–80 percent humidity,
    while a DHT22 temperature sensor provides accuracy of about 3 percent in the range
    of 5–100 percent humidity.'
  - '[PAGE 98]


    # Monitoring the Atmosphere Using Sensors


    Look wise, DHT sensors are generally present in a white or blue colored plastic
    container with a grid or net on the front. They have four terminals on the bottom
    layer. Inside DHT, there is a small analog-to-digital IC that provides us with
    digital values in two parts: temperature and humidity. Initially, it looks difficult
    when we try to understand DHT''s one-wire (or a single-wire) protocol. With some
    tweaks, it is simple to use, and the timing must be precise in order to achieve
    the perfect values from the sensor. Once the timing diagram is understood, we
    can retrieve data from the sensor easily.


    DHT works on single-wire bidirectional bus communication. This means that the
    data transfer between the RasPi and the sensor works on a single wire with particular
    timing or delay instructions sent by the RasPi and receives it as a bit stream.
    Using the banging technique. When the protocol is not defined, we retrieve the
    data from the sensor using the banging technique. In this technique, the master
    device sends the exact duration of the pulse (as long as it is mentioned by the
    reference manuals or datasheets) as a request from the master (in our case, the
    RasPi), and the sensor responds to be ready. After the predefined amount of time,
    it starts sending the data, by bit, by bit, to is the master''s task to receive
    it at a single bus sequence when the slave sent it. Any kind of chaotic sequence
    will turn into corrupted data. This means that the sensor (slave) has sent the
    data perfectly, but the master did not receive it correctly, just because there
    is no timing synchronization between the master and slave.


    # Introducing the photoreceptor (photocell)


    Did you know that the RasPi does not have an analog-to-digital (A2D) convert integrated
    inside? This is the biggest drawback using microprocessor-based development boards
    such as the RasPi. But do not worry; we have a technique to hack it. A photocell
    or light-dependent resistor (LDR) is a light-controlled variable resistor. The
    resistance of an LDR decreases with increasing light intensity. More the light,
    lesser the resistance, and vice versa. The variations in the values vary by about
    45 percent, and shouldn''t be used to determine precise luminance levels in candela
    or lux.


    Appearance wise, the sensor has a clear shiny, thin surface of glassy material
    on the top and has two terminals. On the top, there is a photosensitive semiconductor
    material that is sensitive to light, and we can see the tracks routed in a zigzag
    pattern.'
  - '[PAGE 99]


    It''s time to introduce you to some mathematics of resistors and capacitors.

    Understanding the math of resistors is easy, but how are capacitors coming into
    the picture? Well, there is a phenomenon in the electronics called as a RC timing
    and RC time constant. Already, the sensor is resistive. We will use the capacitor
    to utilize this electronics timing formula T = R*C.


    Yes, that''s it. The capacitor can be charged through a resistor in T time, where
    R and C are the values of the resistance and capacitance. We will observe the
    capacitor to be charged at 50 percent voltage, that is, to 3.3/2 = 1.6V, using
    the 1uF capacitor. The RasPi can only read the values to 1.6v and greater than
    that. Lesser the light, higher the resistance; lower the charging rate, higher
    the time to charge the capacitor. For example, if the resistor is 1KQ, then the
    time constant will become 1 millisecond to charge the capacitor.


    Due to the series resistance (photocell), the charging of the capacitor becomes
    slow enough to be read by the RasPi. The sensor values change drastically. The
    capacitor will make significantly slow by holding the value for some milliseconds
    so that we can read the values easily from the RasPi.


    Simplifying the scenario, let''s take a look at a real-world application to help
    us understand the working of the circuit diagram. Imagine a valve (photoresistor)
    on a pipe (wire) controlled by a lever (light or luminance). This lever helps
    control amount of water (voltage) to be stored in a tank (capacitor). The amount
    of water stored in a tank is immediately taken out by the consumer (the RasPi).
    The tank here acts as a temporary storage (buffer) to store the water, while the
    consumer is busy drinking (calculating). This is a good example to understand
    the working of this hack, isn''t it?


    This hack can be applied to any resistive sensors, such as thermistor, flex sensors,
    and pressure and force-sensitive resistors. We can use the same code and hardware
    explained here to interface these sensors.


    # Building the project


    Whether you have the RasPi 2 model B, RasPi 1 Model B, or Model B+, the hardware
    setup will remain same and therefore the code too. Once starting coding, you will
    gradually learn how RasPi board and DHT11 sensor communicates. In parallel, you
    will also understand how to interface it to the LDR sensor. You will get to know
    how multiple sensors can be integrated to get the data. However, first, let''s
    look at the circuitry we need to build.'
