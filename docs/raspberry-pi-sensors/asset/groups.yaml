    ## Chapter 1


    ![](img/294138a424db5b37c44c0a7ad39ef037_27_0.png)


    Due to a more powerful processor and an upgraded RAM, Raspberry Pi 2 Model B improves
    on performance by six times. In a clockwise direction in the diagram of the RasPi
    1 model B, the short description of the important connectors is as follows:


    - **GPIO header:** GPIO stands for General Purpose Input Output, which has been
    brought out to pin connectors present on the board. The processor on board (BCM283x,
    which is the brain of a RasPi) has a facility to provide a specific functionality
    during the runtime of your own program. We are going to use them a lot in the
    upcoming chapters. The great thing with this is that you can assign a task to
    the specific GPIO in your program, and while your program executes, it goes logic
    low or high (triggers to off state and on state) accordingly. We can read values
    from any other peripherals, such as sensors, and compute the received values in
    your own programs. Apart from reading the values, we can show the result of the
    program by connecting LEDs or embedded LCD displays to the board. Depending on
    the decision taken in the code, we can drive a motor connector on GPIO through
    a motor driver circuit. This feature on RasPi makes a huge difference compared
    to the normal computing board by giving developers the freedom of crafting the
    creation.


    ## Meeting Your Buddy – the Raspberry Pi


    > For example, in one of your applications, if the temperature falls below 20
    degree Celsius then the thermostat connected to your RasPi gets the signal through
    the specific GPIO assigned and it starts heating. GPIOs typically work in logic
    high (1, ON) and logic low (0, OFF), and this will work the way you program it!


    - **RCA video out:** This is the most widely used and one of the oldest connectors
    that both old and new televisions or displays use. It carries the video signal,
    which is the type output on the RasPi. The RCA connector or composite video signal
    is merged with a 3.5 mm audio jack on RasPi 1 model A+ and model B and RasPi 2
    model B.

    - **3.5 mm audio jack:** If you are not using the HDMI connection (which will
    be described), the audio can be played through speakers or headphones using a
    standard 3.5 mm jack. In RasPi 1 model B+ or RasPi 2 model B, audio jack being
    the combination of composite and audio has all the functionalities of composite
    video and audio out.

    - **USB:** This is the most common connector, widely used in the modern computers,
    and hence called the Universal Serial Bus. You can connect your flash drives,
    keyboard, Wi-Fi dongles, and mouse to play around with the RasPi. You can also
    connect the externally powered USB hub with RasPi to connect more USB-based peripherals.

    - **Ethernet:** This is one of the most important connections to have a remote
    login on RasPi and provide wired internet connection. In the next sections of
    this chapter, we will be using it. We cannot always connect RasPi to the dedicated
    display, so we use the remote login, and we see the entire desktop or Command-line
    Interface (CLI) of RasPi on our computer screen.

    - **CSI camera connector:** The RasPi does not have a camera module integrated,
    but a separately bought camera module can be interfaced using the CSI connector
    via a 15cm flex cable. A longer flex cable will lead to bad quality of images.
    The 5-megapixel Raspberry Pi camera module can be used to record high-definition
    videos as well still photographs. It''s easy to use for beginners, but has plenty
    to offer advanced users if you''re looking to expand your knowledge. This camera
    module provides improved performance over a USB-connected camera.

    - **HDMI connector:** The High-definition Multimedia Interface (HDMI) is a compact
    audio/video interface to transfer uncompressed media data. You can connect your
    modern HDTV to watch full definition (FHD/HD) videos through the RasPi. If you
    plug in the HDMI connector, there is no need to connect the speakers to the audio
    jack, and if you want to get sounds on both HDMI and the 3.5 mm jack, then you''ll
    have to play with and edit the internal files of Linux.


    - **Micro USB power:** You survive on food, don''t you? Well, so does the RasPi
    (kind of). It needs power supply to operate. The device can be powered by a 5V
    input voltage, and the current ratings solely depend upon what you have hooked
    up to RasPi. Have you seen any power button on RasPi? In fact, the RasPi module
    does not have the power on. Therefore, just plugging the Micro USB power adapter
    will boot the RasPi.


    > The maximum current the Raspberry Pi models A and B can use is 1 ampere, if
    so you need to connect to a USB device that will take the requirements of the
    Raspberry Pi above 1 ampere, then you must connect it to an externally powered
    USB hub. For example, a USB disk will need an ample amount of current to operate,
    which RasPi cannot deliver through the USB port. Alternatively, the maximum power
    B+ can use 2 amperes before needing to connect devices to an externally powered
    USB hub. There are power banks and batteries available for connecting to the RasPi
    if you are designing a remotely operated car or a quadcopter. If you are not sure
    how much power the USB device is to take, buy an externally powered USB hub.


    - **SD card slot:** The Raspberry Pi does not have any on-board memory, so purchasing
    an SD card is the only way to get data storage as well as an operating system.
    ![](img/294138a424db5b37c44c0a7ad39ef037_27_0.png)


    - **Display connector:** Last but not, the display connector is used to connect
    a 7-inch LCD to the board. But usually, RCA and HDMI are enough.


    ## Chapter 1 (continued)


    ### Setting up for the first time


    Following your recent purchase of the RasPi, you now have to make it ready to
    work. In this section, we are going to widely install an operating system on which
    our RasPi will run. The most popular, stable, and widely used operating system
    for RasPi is Raspian.


    The Raspberry runs on an open platform, Debian Linux. Why are we going to use
    Raspian instead of directly using Linux? Simply because Raspberry has all device
    drivers written for the RasPi. In brief, the device driver is a program that gives
    the details of the hardware to the running operating system and supports the user
    interface to take/give commands from the hardware. Our RasPi has different hardware
    than a personal computer or general-purpose computer, the modified operating system
    is needed to completely use resources on the hardware. It is best for those who
    want to follow the default standards.


    You can download the Whezy-Raspian install (known as an image file) from the Raspberry
    Foundation''s website at http://downloads.raspberry.org/raspberry_latest. If you
    want to install the GUI-free flavor of Linux (Direct CLI), you can try Arch Linux.
    It can be downloaded from the ArchLinuxArm page at http://archlinuxarm.org/os/ArchLinuxARM-rpi-latest.tar.gz.


    ### Installing the operating system


    We need some essential components to successfully start up the RasPi. Note that
    this subsection is for those who are using the RasPi for the first time and have
    not purchased the preloaded SD card. If you have installed the operating system
    on your SD card, then you can skip this section, or just look at the procedure
    to help your friend who has just brought a new RasPi.


    ### Purchasing your SD card


    When you buy a RasPi module, it may or may not be with an SD card. If your RasPi
    did not come with an SD card, then the minimum size you should get is 4 GB. RasPi
    doesn''t have any on-board memory, so purchasing an SD card is the only way to
    get data storage as well as an operating system. I have an 8 GB SD card for my
    RasPi, and it works well and is sufficient for doing almost projects.


    > For server applications, if you require more space, then an SD card with higher
    space will be useful.

