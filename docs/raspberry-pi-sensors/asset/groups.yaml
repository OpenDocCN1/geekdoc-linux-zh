    \ HDTV 通过 RasPi 观看高清 (FHD/HD) 视频。如果你插入 HDMI 接口，就不需要将扬声器连接到音频接口，如果你想在 HDMI 和 3.5\
    \ mm 接口上同时获得声音，你就必须处理并编辑 Linux 的内部文件。\n- **Micro USB 电源：** 你靠食物生存，不是吗？RasPi 也是（某种程度上）。它需要电源才能运行。设备可以通过\
    \ 5V 输入电压供电，电流额完全取决于你连接到 RasPi 的设备。你见过 RasPi 上有电源按钮吗？事实上，RasPi 模块本身没有电源开关。因此，只需插入\
    \ Micro USB 电源适配器即可启动 RasPi。\n\n> Raspberry Pi A 和 B 型号可以使用最大电流为 1 安培，如果是这样，你需要连接到一个需求超过\
    \ 1 安培的 USB 设备，那么你必须将其连接到外部电源的 USB 集线器。例如，USB 盘需要大量的电流才能运行，RasPi 无法通过 USB 端口提供。或者，B+\
    \ 在需要连接设备到外部电源 USB 集线器之前可以使用最大功率为 2 安培。如果你正在设计遥控汽车或四旋翼飞行器，可以连接电源宝和电池到 RasPi。如果你不确定\
    \ USB 设备需要多少功率，请购买外部电源的 USB 集线器。\n\n- **SD 卡槽：** Raspberry Pi 没有板载内存，因此购买 SD 卡是获取数据存储以及操作系统的唯一途径。![](img/294138a424db5b37c44c0a7ad39ef037_27_0.png)\n\
    \n- **显示接口：** 最后但不是，显示接口用于连接 7 英寸 LCD 到板子上。但通常 RCA 和 HDMI 就足够了。\n\n## 第1章（续）\n\
    \n### 首次设置\n\n在最近购买 RasPi 后，你现在需要让它准备好工作。在本节中，我们将为 RasPi 安装一个操作系统。\n\nRaspberry\
    \ 运行在开源平台 Linux 上。RasPi 最流行、稳定且广泛使用的操作系统是 Raspian。为什么我们要使用 Raspian 而不是直接使用 Linux？简单是因为\
    \ Raspberry 为硬件编写了所有设备驱动。简而言之，设备驱动是向运行的操作系统提供硬件细节的程序，并支持用户界面接收/发送命令。RasPi 的硬件与个人电脑或通用计算机不同，需要修改过的操作系统来充分利用资源。对于想要遵循默认标准的人来说。\n\
    \n你可以从 Raspberry 网站下载 Whezy-Raspian 安装（镜像文件）：http://downloads.raspberry.org/raspberry_latest。如果你想安装无\
    \ GUI 的 Linux 版本（直接 CLI），可以尝试 Arch Linux。它可以从 ArchLinuxArm 页面下载：http://archlinuxarm.org/os/ArchLinuxARM-rpi-latest.tar.gz。\n\
    \n 安装操作系统\n\n我们需要一些组件才能成功启动 RasPi。注意，本节适用于第一次使用 RasPi 且没有购买预装 SD 卡的用户。如果你已经在 SD\
    \ 卡上安装了操作系统，则可以跳过此节，或者只需查看步骤以帮助刚买新 RasPi 的朋友。\n\n### 购买你的 SD 卡\n\n当你购买 RasPi 模块时，它可能带有或不带有\
    \ SD 卡。如果你的 RasPi 没有带 SD 卡，那么你应该购买的最小容量是 4 GB。我有一个 8 GB 的 SD 卡用于 RasPi，它运行良好且足以应对几乎所有的项目。\n\
    \n> 对于服务器应用，如果你需要更多空间，那么更大容量的 SD 卡将很有用。\n\n"
