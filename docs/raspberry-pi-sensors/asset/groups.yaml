    ```\n\n## 使用 ADC 为树莓派连接任何传感器\n\n一旦完成安装，我们必须为树莓派板启用 SPI 功能。因为用途较少，SPI 端口默认被禁用。因此需要执行：\n\
    \n```bash\nsudo nano /etc/modprobe.d\n```\n\n找到行 `dtparam=spi=off` 并将其更改为 `dtparam=spi=on`。保存文件（Ctrl+O,\
    \ Enter）并退出（Ctrl+X）。重启树莓派：\n\n```bash\nsudo reboot\n```\n\n重启后，运行以下命令检查 SPI 是否启用：\n\
    \n```bash\nls /dev/spidev*\n```\n\n如果出现，我们就准备好使用 SPI 了。现在我们将编写代码与 MCP3008 接口。\n\
    \n```python\nimport spidev\nimport time\n\n# 初始化 SPI 总线\nspi = spidev.SpiDev()\n\
    spi.open(0, 0) # 总线，设备\nspi.mode = 0b0\nspi.max_speed_hz = 1000000\n\ndef read_adc(channel):\n\
    \    # MCP3008 命令格式\n    # 第一字节：0001 + 通道 (3位)\n    # 第二字节：空位 (0位)\n    byte =\
    \ 0x01 | (channel << 4)\n    resp = spi.xfer2([byte, 0x00])\n    return ((resp[1]\
    \ & 3) << 8) | resp[2]\n\nwhile True:\n    for i in range(8):\n        val = read_adc(i)\n\
    \        print(f\"Channel {i}: {val}\")\n    time.sleep(1)\n```\n"
