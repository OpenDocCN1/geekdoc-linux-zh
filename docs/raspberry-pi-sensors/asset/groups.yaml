    # 使用摄像头和 OpenCV 创建图像传感器


    下一步是编译整个库。正如我们所看到的，OpenCV 库包含许多组件。


    > 在执行 `make` 命令之前，请打开树莓派（RasPi）的外壳，并将其放置在通风良好的地方散热。树莓派在操作过程中发热是正常现象。


    使用之前的命令 `cmake`，我们生成了一个内置的 `make` 文件，它将用于我们选择的环境中。由于库中组件之间存在依赖关系，`make` 命令对于执行非常有用：


    ```

    make

    ```


    现在，如果你在进行此安装时正值晚上，去拿一些爆米花，看你最喜欢的电视节目，然后睡个好觉。第二天一早上你就能看到结果了！如之前提到的，在树莓派上的这种编译几乎需要
    10 到 14 小时才能完成。在树莓派编译库时，不要打扰它。如果编译过程中停止或卡住，或者你的树莓派意外关闭，请不要担心。重新启动会，进入同一个构建文件夹，再次输入
    `make` 命令。它将从卡住的地方继续。树莓派 2 型在这里表现非常出色。在树莓派 2 平台上，此编译需要 3 到 4 小时完成 `make` 过程。


    一旦这项耗时任务完成，我们就可以将编译好的库安装到树莓派上。这项任务不会像上一步那么长时间：


    ```

    sudo make install

    ```


    现在是为 `/etc` 中的 `ldconfig` 设置 OpenCV 的配置文件了。`ldconfig` 会在命令行指定的目录、`/etc/ld.so.conf`
