    sharing between cross subnets. This is because we have enabled the Internet sharing
    and Ethernet settings as automatic. Therefore, it is clear that the Wi-Fi-to-PC
    (192.x.x.x) and PC-to-RasPi (169.254.x.x) scenarios work successfully.


    Mac OS User can follow the same steps by navigating to **Preferences** | **Sharing**
    and it would be very easy to follow the GUI.


    Linux users can click on network menu in the top panel and navigate to **Edit
    Connections...**, and then double click your wired connection and keep the wireless
    connection untouched. Navigate to the **IPv4 Settings** tab and select method:
    **Shared to other computers**.


    # Installing and opening the free SSH client on your PC


    **Secure Shell (SSH)** is a cryptographic network protocol for secure data communication.
    It means remote command-line login and remote command execution between two networked
    computers. Here, we use it for the command-line login and remote command execution
    between the PC and the RasPi. A one-of-a-kind and free SSH client is PuTTY (www.putty.org)
    for Windows, and since it is an open source, you can download it for free. Run
    PuTTY on your Windows PC and change the settings as follows:'
