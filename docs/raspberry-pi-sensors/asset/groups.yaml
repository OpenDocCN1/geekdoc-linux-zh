    \ 参考手册（当前版本 2.4.9.0）》。\n\n开发一个满足以下要求的项目对你来说将是一个非常好的挑战：\n\n- 使用接口摄像头捕捉实时画面，将图像分成相同大小的段（例如，四个垂直段），并将其与参考图像进行比较。在观察到大部分运动的其中一个段中将会有明显的差异。检测图像中的该区域并相应触发\
    \ GPIO。\n\n- 此外，控制伺服电机或步进电机根据前方的运动来旋转摄像头。最后，你将能够开发出一个随你任何移动而移动的摄像头。\n\n- 此的另一个应用是节能。将图像分成坐标段，通过将摄像头安装在较高位置来检测房间内人的坐席。在没有检测到运动的地方关闭灯。很有趣，不是吗？\n\
    \n- 你可以开发 OpenCV 代码跟踪特定颜色的物体。当该彩色物体在摄像头前移动时，代码可以在屏幕上画线。例如，当我们摄像头的面前显示并移动一个红球时，它会根据摄像头检测到的红色移动开始画线。\n\
    \n- 创建一个手势/模式识别计算机模块，它将你手指上佩戴的颜色作为命令。\n\n- 构建一个跟球机器人，它可以跟随特定颜色的球，并检测球的远近效果。\n\n\
    > 使用电机和继电器驱动板来控制电机和电器，而不是直接从 GPIO 驱动它们。在使用基于继电器的电器控制时，请注意电击。\n\n完成这些项目后，你可以它们展示给朋友看，成为他们中最酷的人。构建这些项目真的非常有趣，不是吗？\n\
    动手做吧！\n\n# 总结\n\n本章完全致力于使用最先进的 OpenCV 库进行图像处理开发。我们从图像处理及其概述开始，接着介绍了 OpenCV。到目前，你已经知道\
    \ OpenCV 库非常庞大，以至于即使像这样的四本书也不够提供对整个库的详细描述。然后你理解了树莓派模块模块上的摄像头接口，我们使用 USB 摄像头配合。接下来，你实验了使用树莓派作为网络摄像头模块（IP\
    \ ）进行实时流，直接从客厅跟踪你的后院。\n\n我们开始移植 OpenCV 库，花了几乎半天的时间才能运行。然后，我们使用摄像头接口验证了库。接下来，我们开始用\
    \ C 语言构建项目，通过计算影响区域来检测人体运动。准备了一个实用的 shell 文件来配合 wiringPi 接口编译 OpenCV 代码。给你的任务是构建项目、准备它并发送代码以寻求建议。\n\
    \n本章结束，这本书已基本完成。考虑到目前的趋势，树莓派将继续增长。在社区数千人的支持下，单莓派市场领先。\n\n随着 RasPi 2 B 型的发布，计算的新时代已经开启。OpenCV\
    \ 库和图像处理现在树莓派模块 2 上有更好的性能。树莓派用户可以在此模块上享受完全免费的 Windows 10。一旦 Windows 10可用，你可以尝试一下。感谢树莓派组织及其工程师在这些模块的开发上投入的心血！\n\
    \n# 使用摄像头和 OpenCV 创建图像传感器\n\n正如你所体验过的，树莓派有无限的应用场景。你必须用它探索不同的可能性。你可以连接一个带有简单 LED\
    \ 的摄像头来显示指示。你可以连接一个 7 英寸触摸 LCD 使其成为个性化的 Android 平板，或全高清 LED 电视来观看视频。凭借 Linux 的自由，从\
    \ wiringPi 和 Python 开始，你可以使用 Node.js、Apache、C++ REST、Qt、Mathematica（或 Wolfram\
    \ 语言）、OpenCV 等许多很棒库。树莓派可以用于制作切换 LED 等项目，或更复杂的项目，如制作带有稳定性控制算法的自己的四旋翼。\n\n我希望你能够充分利用它。保持好奇心并不断学习。\n\
    \n发光热吧！一切顺利！\n\n# 购物清单\n\n# 基础需求\n\n- 一个树莓派（树莓派 1 B 型、树莓派 1 B+ 型、树莓派 1 A+ 型或树莓派\
    \ 2 B 型（购买其中任何一个））\n- 带有 SD 适配器的容量为 8 GB 或更大的微 SD 卡\n- 具有 Windows、Mac OS X 或 Linux\
    \ 环境的个人电脑\n- 以太网线 (RJ45)\n- 带有 micro-USB 连接器的 5V 1A 或 5V 2A 电源适配器\n- HDMI 或 RCA\
    \ 线\n- 面板\n- 万用表\n- 剥线器\n\n# 传感器\n\n- HC-SR04 超声波传感器（数量：1）\n- DHT11 温度湿度传感器（数量：1）\n\
    - LDR 或 CdS 光敏电池或光敏电阻（数量：1）\n- TMP35、LM35 或 TMP36 温度传感器（数量：1）\n\n 购物清单\n\n# 集成芯片\n\
