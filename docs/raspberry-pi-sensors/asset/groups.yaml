    what we need to make our projects. Take a look at the different connectors in
    the following diagrams. The nomenclature presented here will be used throughout
    the book.


    The Raspberry Pi 1 model B+ and Raspberry Pi 2 model B look identical to each
    other, and the difference is only in performance.

