    # # Summary


    This chapter was totally dedicated to development in image processing using the
    most advanced OpenCV library. We started with an overview of image processing
    and its applications, followed by an introduction to OpenCV. By now, you already
    know that the OpenCV library is so vast that even four books like this would not
    be enough to provide a detailed description of the entire library. You then understood
    the camera interface on the RasPi module, and we use the USB camera to go with.
    Next, you experimented live streaming using the RasPi as a network camera module
    (IP camera) to keep track of your backyard directly from the lounge.


    We started portant the OpenCV library, which took almost half a day to be up and
    running. Then, we verified the library using the camera interface. Next, we started
    building the project in the C language to detect human motion by calculating a
    motion-affected area. A useful shell file was prepared to compile the OpenCV code
    along with the wiringPi interface. A task was given to you to build the project,
    prepare it, and send it for the suggestions on the code.


    With the end of this chapter, this book is pretty much complete. Looking at the
    current trends, the Raspberry Pi will keep growing. With support from thousands
    of people in community, the RasPi has achieved the highest position in the market
    of single-board embedded computers.


    With the launch of RasPi 2 model B, a new era in computing has begun. OpenCV libraries
    and image processing now have a better performance on Raspberry Pi module 2. RasPi
    users will be able to enjoy totally free Windows 10 on this module. You can give
    it a try once Windows 10 is available. Kudos to the Raspberry Pi organization
    and its engineers for pouring hours into the development of these modules!'
