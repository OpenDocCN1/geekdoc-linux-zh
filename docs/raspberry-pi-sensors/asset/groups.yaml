    # 使用传感器监测大气


    如今，很难找到没有传感器的设备。大多数家用电器，如空调、烟雾报警器、火灾报警器、气体/CO2 传感器、LCD 显示器、冰箱、烤面包机、恒温器、微波炉和热水器，其电路中都集成了传感器，用于测量周围的大气环境中的实体。当我们观察周围的大气时，有许多可以测量的实体，例如：温度、湿度、水汽、粉尘、空气质量、各种气体浓度、风速、雨量、水质、光照强度、运动、湿气等。在更宏观的层，传感器网络和物联网等技术使用了“传感器节点”，它们测量其中一个或多个实体，并将数据发送到指定的计算机或用户。这方面的最佳例子是“nest”恒温器（www.nest.com/thermostat/）。这款设备是人工智能的示例，它可以根据你的日常习惯控制并维持房间的温度，并从可能出现的各种场景中不断学习。


    用于此类应用的两种传感器是温度和湿度传感器。在本章中，我们将测量环境温度、湿度和光照变化。我们将创建一个传感器节点，用于决定灯和风扇的开启或关闭。从选择合适的传感器开始，你将学习
    DHT 传感器和 LDR 传感器。这些传感器在测量本章将看到的实体方面起着作用。在本章中，我们将：


    - 理解传感器选择过程

    - 了解温度湿度测量传感器

    - 了解用于测量光照变化的 LDR 传感器

    - 学习 DHT 和 LDR 传感器的代码

    - 构建项目以控制家电

    - 学习如何连接具有相似规格和特性的多个传感器

    - 解决面临的一些常见问题


    让我们从理解如何选择传感器开始这段旅程，享受 RasPi 的奇世界。


    ## 传感器选择过程


    在产品开发阶段，特别是在构建环境监测系统时，传感器的选择过程非常困惑。我们可能不确定哪些传感器可以使用，哪些不能用。在工业领域，设计和开发工程师每次开始构建项目时都会遇到这个问题。当我们将传感器与处理器或控制器连接时，传感器很难控制，因为它们与处理器相比要缓慢得多。此外，我们还需要处理从传感器进入处理器的大量值。例如，在安全关键系统中（如生命维持系统或婴儿培养箱），使用调理电路和信号处理单元来精确测量传感器值并采取相应行动（如控制新生婴儿或患者的温度和氧水平）。因此，选择传感器的第一步是确定确切的应用。根据应用，应启动传感器选择过程。在上一章中，当我们连接声波传感器时，你一定观察到声波传感器的底部有复杂的电路和微芯片。那是让我们的工作变得轻松的调理电路。并不是所有的传感器都以单芯片的形式出现。这类传感器的接口非常困难。传感器接口总是很棘，但并非无法第一次就正常工作。观察表明，每当传感器制造商的价格昂贵时，它就越容易使用且测量越精确。这是因为这些传感器的封装方式支持大多数通信协议。这在大多数情况下是真实的，但不应被视为定论。


    ## 应用的关键性


    我们在分析应用时注意的下一点是它的关键性以及将要使用的环境条件。该应用是用于飞机的避障系统或刹车系统、家庭，还是仅仅用于爱好项目？我们的项目倾向于爱好项目；我们更愿意为项目选择用户友好、廉价且有效的传感器。因此，我们可以在准确性和接口便利性之间进行权衡。此外，与其他传感器系统（如飞机上的天气传感器）相比，该应用的关键性并不严重或危险。


