    ## 使用超声波传感器测量距离


    我们知道


    $Speed = \frac{Distance}{Time}$


    当我们测量时间（发送脉冲并接收它的持续时间）时，它是基于朝目标移动并返回计算的。然而，我们只想计算单程行程的时间。例如，我们正在测量 A 点到 B 点的距离。传感器从
    A 点产生声音。假设这种声音在 T1 时间到达 B 点。在 B 点，声音被反射并在 T2 时间回到 A 点。因此，超声波传感器测得的时间是 T = T1 +
    T2。这就是为什么我们需要将测量的时间除以 2。


    所以现在我们的方程如下：


    $Speed = \frac{Distance}{Time / 2}$


    我们知道声速为 34300 cm/s：


    $34300 = \frac{2 * Distance}{Time}$


    让我们进一步简化以便使用代码：


    $Distance = 17150 * Time$


    就这样！我们知道了距离的公式，也知道了超声波传感器的工作原理。我们将直接在 Python 脚本中使用这个等式。那么我们还在等什么？让我们开始构建项目。


