    \ pin）默认设置为零。然后，我们从树莓派（RasPi）向传感器的触发引脚提供 10µs 的脉冲。一旦传感器接收到触发信号，它就会从内置发射器发送 40\
    \ KHz 脉冲/波束（包含八个脉冲）。\n\n![](img/294138a424db5b37c44c0a7ad39ef037_82_0.png)\n\n\
    我们应该在超声波信号之后预期回声信号。回声信号的长度为距离计算提供了时间依据。我们在代码中如何实现？创建触发脉冲的简单方法是将触发引脚置高 10µs，如下代码所示：\n\
    \n```python\nGPIO.output(23, True)\ntime.sleep(0.00001)\nGPIO.output(23, False)\n\
    ```\n\n使用这段代码，我们发送一个脉冲，内部会产生超声波束并传播到空气中。它将反射并返回产生回声脉冲。我们必须持续检查直到获得回声脉冲。正如我们在上图中看到的，回声引脚会保持高电一段时间。因此，我们需要计算回声信号保持开启的时间。我们可以使用\
    \ `while()` 循环持续监控回声引脚。我们可以使用 `time` 函数来捕捉回声保持高电的持续时间：\n\n```python\nwhile GPIO.input(24)\
    \ == 0:\n    start_time = time.time()\n```\n\n这段代码创建了一个无限运行的循环，直到回声的状态从 0（低电）变为\
    \ 1（高电）。当回声引脚为 0（或低电）时，我们不断更新 `start_time` 变量中的时间值（戳）。一旦回声引脚变高，`while()` 循环就会，我们就得到了回声脉冲从低电变为高电状态的时间值。接下来，我们需要使用相同的逻辑来获取保持高电时间的时间戳。在此处，我们使用了另一个变量来存储时间戳，稍后可以使用这两个变量来确定持续时间：\n\
    \n```python\nwhile GPIO.input(24) == 1:\n    end_time = time.time()\n```\n\n当条件为真时，while()\
    \ 循环会用最新的时间更新变量。\n\n# 距离计算\n\n我们有了回声脉冲的开始时间和结束时间。因此，我们必须减去这两个值得到脉冲持续时间。一旦得到脉冲持续时间，就可以将其用于距离计算：\n\
    \n```python\ntime = end_time - start_time\n```\n\n在章节之初，我们推出了距离计算的公式，这在这里非常有用。让我们回想一下：\n\
    \n> 距离 = 17150 * 时间\n\n我们考虑了声音的双程路程，然后将时间除以 2。\n\n将此公式转换为 Python 脚本，我们得到以下代码：\n\
    \n```python\ndistance = 17150 * time\nprint(\"Measured Distance is : \", distance,\
    \ \"cms\")\n```\n\n我们已经理解了各个部分的操作。让我们它们结合在一起，在树莓派上获得一个完全工作的传感器。在 PuTTY 命令行中输入\
    \ `nano distance.py` 并输入以下代码：\n\n```python\nimport RPi.GPIO as GPIO\nimport time\n\
    ```\n\n# 使用超声波传感器测量距离\n\n```python\nGPIO.setmode(GPIO.BCM)\nGPIO.setwarnings(False)\n\
    print \"Measuring Distance\"\nprint \"Press ctrl+c to stop me\"\nGPIO.setup(23,GPIO.OUT)\n\
    GPIO.setup(24,GPIO.IN)\ntime.sleep(0.02)\nGPIO.output(23, False)\nprint \"Setting\
    \ Trigger pin to zero by default\"\ntime.sleep(1)\nwhile True:\n    GPIO.output(23,\
    \ True)\n    time.sleep(0.00001)\n    GPIO.output(23, False)\n    while GPIO.input(24)\
    \ == 0:\n        start_time = time.time()\n    while GPIO.input(24) == 1:\n  \
    \      end_time = time.time()\n    time = end_time - start_time\n    distance\
    \ = 17150 * time\n    print \"Measured Distance is:\", distance, \"cms.\"\n```\n\
    \n> 你可以使用 Python 内置的舍入函数来获取三位小数的值：print \"Measured distance is: %.2f\" %distance,\
    \ \"cms.\"\n\n按 Ctrl + X 然后按 Enter 保存并退出代码。\n\n与设置软件的步骤相比，代码有一些细微变化。`GPIO.setwarnings(False)`\
    \ 这命令关闭编译时产生的警告。当程序启动并配置 GPIO 时，给树莓派一些时间准备读取。需要使用 `while()` 循环。通过这个无限运行的循环，指向不同的目标可以看到距离的变化。在开始编译项目之前，再次检查连接。确保超声波传感器位置良好并指向目标。或者，只需让传感器垂直于表面。\n\
    \n现在开始！输入 `sudo python distance.py` 并按 Enter。很棒吧？当我们编写并执行它时，现在显示输出 Measured Distance\
    \ is: 9321cms。我们创建了超声波距离计。你可以通过 Ctrl + C 停止代码。如果程序卡在无限循环中，这可能意味着软件或硬件错误。\n\n>\
    \ 如果你无法执行代码且树莓派有权限问题，在执行 `sudo python distance.py` 命令之前使用 `chmod +x distance.py`。\n\
    \n# 解决常见问题\n\n在构建项目时，我们许多人第一次并没有获得输出。让我们共同讨论常见问题。在使用树莓派和超声波传感器构建项目时，经常发生一些问题。\n\
    \n# 距离显示错误？\n\n你非常热情自己编写代码，但可能错了。检查触发引脚变为完美时间的时间，并检查回声引脚是否正确。\n\n某些设备响应可能缓慢。我建议在将引脚置低后添加\
    \ 60ms 的延迟，如下代码所示：\n\n```python\nGPIO.output(23, False)\ntime.sleep(0.06)\n```\n\
    \n如果你仍然没有结果，尝试调整这些延迟值。此外，检查代码的缩进，这可能是你遇到问题的主要原因。\n\n很有可能是桌子上有很多物体导致反射很高，因为这个传感器具有很宽的角度角。如果传感器碰到任何物体或金属表面，在这种情况下也会获得错误的读数。\n\
    \n# 使用超声波传感器测量距离\n\n# 模块有响应吗？\n\n模块没有响应时有很多原因。要么是你没有为树莓派提供足够的电流，要么面包板上的连接不当。传感器可以消耗大量的电流。你可能需要为树莓派连接\
    \ 5V 1A 的充电器或适配器。检查引脚 16 是否变为高电。树莓派的引脚 16 在万用表上应显示 3.3V 的读数。\n\n# 你正在测量小于 2 cm\
    \ 的距离吗？\n\n如果障碍非常近，传感器将不会响应。传感器很难测量。\n\n# 视障人士的可穿戴设备\n\n超声波传感器可以为盲人士提供额外的感知。你可以通过制作这种可穿戴设备为社会做贡献，它可以耳边播放警告声或在手里发出震动提醒。市场上有这样的手，你可以自己制作。\n\
