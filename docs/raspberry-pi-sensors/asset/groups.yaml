    # UART


    UART is a very common interface, or protocol, that is found in almost every PC
    or microprocessor. UART is the abbreviated form of Universal Asynchronous Receiver
    and Transmitter. This is also known as the RS-232 standard. This protocol is full-duplex
    and a complete standard, including electrical, mechanical, and physical characteristics
    for a particular instance of communication. When data is sent over a bus, the
    data levels need to be changed to suit the RS-232 bus levels. Varying voltages
    are sent by a transmitter on a bus. A voltage value greater than 3V is logic zero,
    while a voltage value less than -3V is logic one. Values between -3V to 3V are
    called undefined states. The microprocessor sends the data to the transistor-transistor
    logic (TTL) level; when we send them to the bus, the voltage levels should be
    increased to the RS-232 standard. This means that to convert logic levels of a
    microprocessor (0V and 5V) to these levels and back, we need a level shifter IC
    such as MAX232. The data is sent through a DB9 connector and an RS-232 cable.
    Level shifting is useful when we communicate over a long distance.


    What happens when we need to connect without these additional level shifter ICs?
    This connection is called a NULL connection, as can be seen in the following figure.
    It can be observed that the transmit and receive pins of a transmitter are cross-connected,
    and the ground pins are shared. This can be useful in short-distance communication.
    In UART, it is very important that the baud rates (symbols transferred per second)
    should match between the transmitter and the receiver. Most of the time, we will
    be using 9600 or 11520 as the baud rates. The typical frame of UART communication
    consists of a start bit (usually 0, which tells receiver that the data stream
    is about to start), data (generally 8 bit), and a stop bit (usually 1, which tells
    receiver that the transmission is over.


    ![](img/294138a424db5b37c44c0a7ad39ef037_58_0.png)'
  - '[PAGE 59]


    The following figure represents the UART pins on the GPIO header of the RasPi
    board. Pin 8 and 10 on the RasPi GPIO pin header are transmit and receive pins
    respectively.


    # TX RX


    ![](img/294138a424db5b37c44c0a7ad39ef037_59_0.png)


    Many sensors have the UART communication protocol enabled on their output pins.
    Sensors such as gas sensors (MQ-2) use UART communication to communicate with
    the RasPi. Another sensor that works on UART is the nine-axis motion sensor from
    LP Research (LPMS-UART), which allows you to make quadcroctors on your own by
    providing a three-axis gyroscope, three-axis magnetometer, and three-axis accelerometer.
    The TMP104 from Texas Instruments comes with UART interface digital temperature
    sensors. Here, the UART allows daisy-chain topology (in which you connect one''s
    transmit to the receive of the second, the second''s transmit to the third''s
    receive, and so on up to eight sensors). In a RasPi, there should be a written
    application program with the UART driver in the Python or C language to obtain
    the data coming from a sensor.'
  - '[PAGE 60]


    # Serial Peripheral Interface


    The Serial Peripheral Interface (SPI) is a full-duplex, short-distance, and single-master
    protocol. Unlike UART, it is a synchronous communication protocol. One of the
    simple connections can be the single master-slave connection, which is shown in
    the next figure. There are usually four wires in total, which are clock, Master
    In Slave Out (MISO), Master Out Slave In (MOSI), and chip select (CS). Have a
    look at the following image:


    ![](img/294138a424db5b37c44c0a7ad39ef037_60_0.png)


    The master always initiates the data frame and clock. The clock frequencies can
    be varied from the master according to the slave''s performance and capabilities.
    The clock frequency varies from 1 MHz to 40 MHz, and higher too. Some devices
    trigger on low input, which makes whenever the logic zero signal is given by the
    master to slave on the CS pin, the slave chip is turned ON. Then it accepts the
    clock and data from master. There can be multiple slaves connected to a master
    device. To connect multiple slaves, we need additional CS lines from the master
    to be connected with the slaves. This can be one of the disadvantages of the SPI
    communication protocol, when slaves are increased. There is no acknowledgement
    sent to the master, so data without knowing whether the slave received it or.
    If both the master and slave are programmable, then during runtime (exec the program),
    the master and slave actions can be exchanged. For the RasPi, we can easily write
    the SPI communication code in either Python or C. *Chapter 5, Using an ADC to
    Interface any Analog Sensor with the Raspberry Pi*, comes with the use of the
    SPI protocol, in which we are going to interface a sensor station by ourselves
    to log data. Logged data will be uploaded to the Internet and sent to your e-mail
    IDs. Interesting isn''t it? The location of the SPI pins on RasPi 1 models A+
    and B+ and RasPi 2 model B can be seen in the following diagram. This diagram
    is still valid for RasPi 1 model B:'
