    \n我们知道 MCP3008 是通过 SPI 协议接口的。要使用 SPI 协议，我们需要在树莓派上安装一些额外的包。首先，我们需要使树莓派保持最新。输入这些命令来更新并升级操作系统到最新的内核包。如果你在全新安装后没有执行任何更新，这可能需要很长时间。过程完成后，重启树莓派模块以执行正常操作：\n\
