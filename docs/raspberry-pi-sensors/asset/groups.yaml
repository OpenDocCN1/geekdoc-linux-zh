    \ cc 或 gcc。输入此命令来编译 C 程序：\n\n```\ngcc -o example2 example2.c\n```\n\n在 `-o example2`\
    \ 中，`example2` 部分将是输出文件名，`example2.c` 部分是编写 C 程序后保存的文件。按回车并检查错误。通过输入 `nano example2.c`\
    \ 修正并解决它（如果发生错误）。一旦成功编译，使用 `ls` 命令检查是否创建了输出文件。输出文件名将是 `example2`。你现在可以输入 `./example2`\
    \ 执行编译后的代码。\n\n这些过程对于创建传感器项目非常有帮助，一旦你练习了更多代码，理解这个过程对你来说就很容易。\n\n# 练习 {完美\n\n本节包含了一些练习题，应该在\
    \ shell、C 和 Python 中进行练习。这背后的原因是它可以让你在理解问题和程序逻辑方面变得更强大，这真的可以帮助你轻松地制作传感器项目。这些练习不会涵盖或给你提供整个语言或脚本的概念，但会让你足够熟悉并理解后续章节使用的代码。\n\
    \n我建议你通过以太网线将树莓派连接到电脑，并使用前节介绍的方法执行程序。你可以借助互联网（www.cprogramming.com/quiz/）来理解逻辑和语法。这里显示的题述应该在所有三种语言/脚本中尝试，这将让你有足够的思路来处理脚本和语言：\n\
    \n- 编写一个程序获取 1000 以下的所有阿姆斯特数（Armstrong numbers）。注意，在三位数中，阿姆斯特数等于其各个数字的立方和。例如，153\
    \ 是一个阿姆斯特数，因为 153 = 1³+5³+3³。\n- 将温度从摄氏转换为华氏，反之亦然。要求用户获取值并决定他们输入的是摄氏还是华氏。如果温度超过\
    \ 38 摄氏度或 100 华度，则显示警告消息。\n- 创建一个具有所有功能的计算器，如加减除乘。询问用户想要的功能。如果除以零则显示错误。\n\n# 总结\n\
    \n在本章中，你了解了树莓派上不同的接口和功能。我们成功地在树莓派上安装了操作系统并与其共享网络连接。通过这些过程，你学习了基础 Linux 命令和 shell\
    \ 脚本，这些在开发应用程序时经常使用。然后我们安装了库（就像在香草冰淇淋上加巧克力酱一样）。对编译和执行 C 程序进行了简要介绍，以启动工作。\n\n>\
    \ 我相信你将解决本章末提出的问题，以获得对代码如何运行的想法。这对后续章节有很大帮助。\n\n在下一章中，你将学习电子学的基础，以便轻松开发项目。这些基础对于接口传感器至关重要。你还将学习传感器如何与树莓派通信。我们将运行简单的代码驱动\
    \ GPIO 引脚上的 LED。\n\n# 结识电子世界\n\n你甚至无法离开电子过一天，对吗？电子无处不在，从你的牙刷到汽车，再到飞机和太空船。在本章中，我们将学习电子学的基本概念，这些概念在构建项目时非常有用，以便有一天我们制造自己的产品并震惊世界。你可能读过很多关于电子的书，当你真正想要创建或构建项目时，它们可能会让你感到枯燥。我认为解释电子及其应用一定有理由，因此本章提供了电子领域各种术语的基础解释及其在项目中的用途。\n\
    \n一旦你了解了电子，我们将介绍通信协议及其在电子组件通信方面的用途。在开始处理树莓派上的 GPIO 之前列出了提示和注意事项。然后，你将理解 GPIO 的功能并使用\
    \ shell、Python 和 C 代码闪烁 LED。\n\n在本章中，你将学习以下主题：\n\n- 基础电子术语和基础知识\n- 电子组件如何通过 UART、SPI\
    \ 和 I2C 协议相互通信\n- GPIO 基础\n- GPIO 端口功能以及使用 shell 脚本、Python 和 C 语言点亮 LED\n\n首先让我们涵盖一些电子的基础知识。\n\
    \n"
