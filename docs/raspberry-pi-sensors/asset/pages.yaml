  md: '# Meeting Your Buddy – the Raspberry Pi


    +   - cd: This command stands for change directory. Just give a path followed
    by the cd command and you will be taken to that directory. For example, cd /home/pi/python_games
    moves you directly to the python_games folder, while cd .. takes one step out
    of a particular directory.


    +   - apt-get: This is the package manager for any Debian-based Linux distribution.
    It allows you to install and manage new packages on your RasPi. Once you have
    an Internet connection on the RasPi, type sudo apt-get <package-name>. It will
    download the package and install the same package. To remove a package, use sudo
    apt-get remove <package-name>. To update and upgrade the operating system, you
    can use sudo apt-get update and sudo apt-get upgrade respectively.


    +   - cp: This is used to copy the file from one directory to another, for example,
    cp /home/pi/python_games/gemi.png /home/pi/gemi.png will copy the gemi.png file
    to the /home/pi/ folder from /home/pi/python_games. You can use the mv command
    instead of cp to move the file from one folder to another.


    +   - rm: This removes the specified file (or directory when rmdir is used). For
    example, rm gemi.png.


    > There is an important warning: files deleted in this way are generally not restorable.


    +   - cat: This lists the content of the file; for example, cat example.sh will
    display the content of the example.sh file.


    +   - mkdir: This creates the new directory in the present working directory;
    for example, mkdir packt will create a directory packt in the present working
    directory. Just use the ls command to check whether it has been created or not
    checking the list.


    +   - startx: This command provides RasPi with the user interface for running
    a window session.


    +   - sudo shutdown -h: This leads to terminate all the processes on the RasPi,
    whereas sudo halt stops the CPU from running mode and halts the OS. The sudo poweroff
    command safely turns off the RasPi module.


    These are the most frequently used commands for the RasPi. If more are needed
    in your projects, you will be introduced to them where relevant.'
