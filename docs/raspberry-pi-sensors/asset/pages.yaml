- img_proc: true
  md: 'For this method, you just need your laptop/desktop (it already has an inbuilt
    Wi-Fi module, which is why we don''t purchase an additional Wi-Fi dongle for RasPi
    until we have a special requirement), the Windows operating system, and an Internet
    connection. You do not need any add-displays, keyboard, mouse, or Wi-Fi dongles
    with the RasPi.


    So all we need is an Ethernet cable, a power supply to RasPi, the SD card with
    Raspian, a Windows-based PC with an Ethernet port, an SD card reader for the PC
    (just required for the first time, either inbuilt or as an add-on SD card reader),
    and the RasPi (obviously!).


    Assemble all of these on a neat table and start your laptop starting up the RasPi.
    I will run you through the step-by-step process. If you follow it, you''ll have
    a working Internet connection provided from your PC to your RasPi with no added
    costs of Wi-Fi dongles.


    # Editing the command-line file of the RasPi


    The first step is to edit the file that RasPi checks when it starts booting. Try
    inserting the SD card of the RasPi into your PC''s SD card reader. Open Explorer
    (where all the drives are listed); you, can find the removable media. You will
    be amazed to see that the partition is about 15 MB to 20 MB, but your card is
    actually 8 GB or 16 GB! Don''t panic; it''s the boot space of RasPi. You will
    be able to see the multiple files on this media. We are interested in editing
    the cmdline.txt file. Just double-click on the file (or open it in Notepad), and
    you will be able to see the following startup commands:


    ```

    dwc_otg.lpm_enable=0 console=ttyAMA0,115200 kgdboc=ttyAMA0,115200 console=tty1
    root=/dev/mmblk0p2 rootfs=ext4 elevator=deadline

    rootwait

    ```


    You can change some settings by adding the static IP address of RasPi at the end
    of the line (take a look at the following code). There is no need to understand
    the meaning of all of these parameters at this stage; I will introduce them when
    they will be useful.


    ```

    dwc_otg.lpm_enable=0 console=ttyAMA0,115200 kgdboc=ttyAMA0,115200

    console=tty1 root=/dev/mmblk0p2 rootfs=ext4 elevator=deadline

    rootwait ip=169.254.0.2

    ```


    In bold, you will set the static IP you have provided for the RasPi.'
  merge: -1
