- img_proc: true
  md: '# Current


    Current is the flow of charges (electrons). Whenever a voltage difference is created,
    it causes current to flow in a fixed direction from the positive (higher) terminal
    to the negative (lower) terminal (known as conventional current). Current is measured
    in amperes (A). The electron current flows from the negative terminal of the battery
    to the positive terminal. To prevent confusion, we will follow the conventional
    current, which is from the positive terminal to the negative terminal of the battery
    or the source.


    # Resistor


    The meaning of the word "resist" in the Oxford dictionary is "to try to stop or
    to prevent." As the definition says, a resistor simply prevents the flow of current.
    When current flows through a resistor, there is a voltage drop in it. This drop
    directly depends on the amount of current flowing through resistor and value of
    the resistance. There is a formula to calculate the amount of voltage across the
    resistor (or in the circuit), which is also called the Ohm''s law (V= I * R).
    Resistance is measured in ohms (Ω). Let''s see how resistance is calculated with
    this example: if the resistance is 10Ω and the current flowing from the resistor
    is 1A, then the voltage drop across the resistor is 10V. Here is another example:
    when we connect LEDs on a 5V supply, we connect a 330Ω resistor in series with
    the LEDs to prevent blowoff the LEDs due to excessive current. The resistor drops
    some voltage in it and safeguards the LEDs. We will extensively use resistors
    to develop our projects.


    # Capacitor


    A resistor dissipates energy in the form of heat. In contrast to that, a capacitor
    stores energy between its two conductive plates. Often, capacitors are used to
    filter voltage supplied in filter circuits and to generate clear voice in amplifier
    circuits. Explaining the concept of capacitance will be too hefty for this so
    let me come to the main point: when we have batteries to store energy, why do
    we need to use capacitors in our circuits? There are several benefits of using
    a capacitor in a circuit. Many books will tell you that it acts as a filter or
    a surge suppressor, and they will use terms such as power smoothing, decoupling,
    DC blocking, and so on. In our applications, we use capacitors with sensors, they
    hold the voltage level for some time so that the microprocessor has enough time
    to read voltage value. The sensor''s data varies a lot. It needs to be stable
    as long as a microprocessor is reading that value to avoid erroneous calculations.
    The holding time of a capacitor depends on an RC time constant, which will be
    explained when we actually use it.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Open circuit and short circuit


    Now, there is an interesting point to note: when there is voltage available on
    the terminal but no components are connected across the terminals, there is no
    current flow, which is often called an open circuit. In contrast, when two terminals
    are connected, with or without a component, and charge is allowed to flow, it''s
    called a short circuit, connected circuit, or closed circuit.


    > Here''s a warning for you: do not short (directly connect) the two terminals
    of a power supply such as batteries, adapters, and chargers. This may cause serious
    damages, which include fire damage and component failure. If we connect a conducting
    wire with no resistance, let''s see Ohm''s law results in: R = 0Ω then I = V/0,
    so I = ∞. In this theory, this is called infinite (countable), and practically,
    it means a fire or a blast!


    # Series and parallel connections


    In electrical theory, when the current flowing through a component does not divide
    into paths, it''s a series connection. Also, if the current flowing through each
    component is the same then those components are said to be in series. If the voltage
    across all the components is the same, then the connection is said to be in parallel.
    In a circuit, there can be combination of series and parallel connections. Therefore,
    a circuit may not be purely a series or a parallel circuit. Let''s study the circuits
    shown in the following diagram:


    ![](img/294138a424db5b37c44c0a7ad39ef037_54_0.png)'
  merge: -1
