    # # Useful and frequently used Linux commands


    Well, this can be a very long list if we introduce and explain all the commands
    of

    Linux. Even a separate book twice this size is not enough to completely illustrate
    all

    the functionalities of the commands. We will see the commands that are essential
    and

    will be used throughout this book. This list can be used as a reference, and it''s

    necessary to understand these commands:


    +   * pi@raspberry:~$: It''s now time to introduce the most commonly seen

    command. It welcomes you on the first login and every subsequent login to

    your RasPi. This shows your username and the hostname of the RasPi. Here,

    your username is pi and the hostname is raspberry.


    +   * sudo: This is an abbreviation of SuperUser DO. This command gives you all

    pileges of the superuser (the most powerful user) of Linux. It is used

    in concatenation with other commands such as nano, sudo, chmod, and so on.

    By writing the sudo command, you can enter superuser mode, in which

    you execute, delete, and create any kind of files in any folders. This really

    gives you superpowers in Linux!


    > The sudo command can be dangerous if not used properly. It can be

    used to hack into the Linux systems, or this superpower can allow

    y to delete the entire kernel of Linux; keep in mind next time,

    the PC won''t boot!


    +   * man: This is the command that shows the manual of the Linux commands

    and other function definitions. Type man sudo and you will get all

    the details related to the sudo command.


    +   * pwd: This is an abbreviation of the working directory. This shows you

    the current directory you are working in. Type pwd and press the Enter key.

    This should display something /home/pi.


    +   * ls: This is a command used to list the files or search for some files contained

    in a particular directory. Just typing ls and pressing the Enter key will give

    a list of all files contained in the system. The options with ls are -a, -1,

    an so on. Just type man ls followed by the Enter key to see the different

    options available with it.'
