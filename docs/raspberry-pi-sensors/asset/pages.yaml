- img_proc: true
  md: 'It is always recommended that you connect the ground terminals of the devices
    first and then the voltage supply terminals. This should be followed with almost
    all the electronic devices we connect with development boards such as RasPi.


    As you have read in Chapter 2, Meeting the World of Electronics, we know that
    our RasPi needs the 3.3V level on the GPIO to operate safely. So, how do we connect?
    It is a serious matter. In this regard, Kirchhoff will help us. With the help
    of Kirchhoff’s current and voltage laws, we can divide the voltage into two parts.
    If we divide the 5V supply into 3.3V and 1.7V, we can use the echo pulse coming
    out of the ultrasonic sensor to connect it to RasPi board''s GPIO. To divide the
    voltage, we will simply follow the most common voltage divider circuits used in
    electronics.


    Avoid connecting the echo pulse directly to the RasPi board. This can spill the
    board permanently. Always use voltage divider.


    Voltage divider is nothing but a combination of resistors with the right values
    connected in such a style that it divides the voltage. The standard value resistors
    should be used while creating the voltage dividers so that we can easily get them
    from the market.


    There is a simple theory that we will follow. As shown in the following figure,
    a voltage divider consists of two resistors (sometimes, only one variable resistor).
    Usually, the resistor near the input voltage supply (Vin) is called R1 and the
    one near to the ground is called R2.


    ![](img/294138a424db5b37c44c0a7ad39ef037_77_0.png)'
