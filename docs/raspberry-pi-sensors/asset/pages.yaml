    Let''s understand the chapter to develop a project for a good cause!


    # The mysterious ultrasonic sensor


    When you go on an expedition to mountains, you must have experienced the echo
    phenomenon while shouting loudly towards high mountains. You can even experience
    this phenomenon in a hall that doesn''t have interiors such as curtains and furniture
    (in a new house). The ultrasonic sensor works on a similar principal. Ultrasonic
    sensors generate ultrasonic waves that are targeted an obstacle after they wait
    for the echo to be heard. Why, don''t you hear any sound when you use an ultrasonic
    sensor? The answer is pretty simple: this sensor works at an ultrasonic frequency,
    which is higher than the audible frequency range of humans. The human''s average
    audible frequency range is 20 Hz to 20 kHz. The ultrasonic sensor transmits the
    sound waves (also called as a sonic burst) higher than 20 kHz frequency. Ultrasonic
    waves are mainly used because they are not audible to the human ear and also because
    they provide precise distance measurement over short distances. You can definitely
    use acoustic sound for this purpose, it''s not nice to have a noisy robot shooting
    every few seconds. Elaborately, ultrasonic sensors produce sonic bursts and calculate
    the echo. This echo is received by the same sensor, calculating the time interval
    between the transition of the signal and reception of the echo to decide the distance
    to a target. The concept behind this sensor is almost the same concept used in
    Radar. This is even more precise than an ultrasonic sensor and works on a very
    high frequency range (VHF). We can see its overall construction in the following
    image. This is the representation of the HC-SR04 sensor, which will be used for
    your project. You can purchase this sensor from any leading e-store or a hobby
    electronics store near you. The sensor has two cylinders on the board, and these
    cylinders have metallic nets on top of them. Usually, these cylinders are made
    of steel or any equivalent material.'
