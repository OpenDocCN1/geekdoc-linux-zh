- img_proc: true
  md: '# Pull-up and pull-down resistors


    Pull-up and pull-down resistors are one of the important terminologies in electronic
    systems design. As the title of this section, there are two types of pulling resistors:
    pull-up resistor pulls the terminal to the voltage supplied and the pull-down
    resistor pulls the terminal to the ground or the common line. The significance
    of connecting the pulling resistor to a node or terminal is to bring back the
    logic level to the default value when no input is present on that particular terminal.
    The benefit of including a pull-up or pull-down resistor is that it makes the
    circuitry susceptible to noise, and the logic level (1 or 0) cannot be changed
    by a small variation in terms of voltages (due to noise) on the terminal. It takes
    a look at the example shown in the following figure. It shows a pull-up example
    with a NOT gate (a NOT gate gives inverted output in its OUT terminal; if logic
    is one, the output is logic zero). We will consider the effects with and without
    the pull-up resistor. The same is true for the pull-down resistor.


    ![](img/294138a424db5b37c44c0a7ad39ef037_56_0.png)


    Connection with and without pull-up resistors


    In general, logic gates have high impedance at their input terminal, so when there
    is no connection on the input terminal, it is termed as floating. Now, in the
    preceding figure, the leftmost connection is not recommended because the switch
    is open (OFF state), it leaves the input terminal floating and any noise can change
    the input state of the NOT gate. The reason of the noise can be any. Even the
    open terminals can act as an antenna and can create noise on the pin of the NOT
    gate. The circuit shown in the middle is a pull-up circuit without a resistor
    and it is highly recommended not to use it. This kind of connection can be called
    a pull-up but should never be used. When the switch is closed (ON state), the
    VCC gets a direct path to the ground, which is the same as a short circuit. A
    large amount of current will flow from VCC to ground, and this can damage your
    circuit.'
  merge: -1
