- img_proc: true
  md: '# Meeting the World of Electronics


    Each I2C device has an address of 7 to 10 bits; using this address, the master
    can always connect and send data for that particular slave. The slave manufacturer
    provides you with the address to use when you are interfacing the device with
    the master. Data is received at every slave, but only that slave can take the
    data for which it is made. Using the address, the master reads the data available
    in the predefined data registers in the sensors, and processes it on its own.
    The general setup of an I2C bus configuration can be done as shown in the following
    diagram:


    ![](img/294138a424db5b37c44c0a7ad39ef037_62_0.png)


    There are 16 x 2 character LCD modules available with the I2C interface in stores;
    you can just use them and program the RasPi accordingly. Usually, the LCD requires
    8/4 parallel data bits, reset, read/write, and enable pins. The I2C pins are represented
    in the following image, and they can be located in the same place on all the RasPi
    models:


    ![](img/294138a424db5b37c44c0a7ad39ef037_62_1.png)'
