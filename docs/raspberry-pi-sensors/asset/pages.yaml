  md: '# Using ADC to Interface any Analog Sensor with the Raspberry Pi


    Therefore, to convert the obtained digital value in the temperature value, we
    use this formula:


    Temperature = (594*0.004882)/0001 = 28.9990


    > To avoid floating value calculations, use the following generic formula: Temperature
    = digital value * 4882. This will give you six-to-digit integer. Put the decimal
    point after first two numbers, for example, 594*4882=2899908. After putting the
    decimal point after the first two numbers, 28.9908 is the value of temperature.


    If you carefully see, you''ll notice that the final temperature is just multiplied
    by 10 of the sensor input voltage provided by the temperature sensor. This happened
    because we had 10-bit resolution, which made the mapping count range from 0 to
    1023. Try yourself with the 12-bit ADC values and check the precision and the
    value change.


    # Data output


    Once the conversion is over, the ADC module provides data on its output port.
    When choosing an ADC module for boards like RasPi, there can be two options: we
    have to choose an ADC module that provides either parallel digital output or data
    on a known standard protocol bus such as UART, SPI, or I2C; or a proprietary protocol.


    # MCP3008 for analog-to-digital conversion


    The MCP3008 ADC is based on successive approximation ADC architecture with a resolution
    of 10 bits. The MCP3008 has eight input channels for interfacing the sensors on
    the pins. If so many channels are not required, we can select a four-channel input
    ADC chip known as MCP3004. These chips are the best way to interface sensors because
    they support the SPI slave mode to be interfaced with the GPIO pins of the RasPi
    models A+, B, and B+ and RasPi 2 model. This MCP3008 chip should be purchased
    in a dual-line (DIP) package so that we can easily insert it on a breadboard while
    preparing for the project:'
