    This file will be executed by the crontab, so we should give execution access
    to the file using the chmod +x project1_startup.sh command. Now, we just need
    to check whether the code executes perfectly or not. Type the ./project1_startup
    to execute the shell script and test whether the sound or LED blinks for less
    than 100 cm distance. Once it is done, we will edit the crontab file with the
    following code to enter our shell file to executed:


    ```

    mkdir cronlogs

    sudo crontab -e

    ```


    A file with lot of text will be opened. At the end of the file, just enter the
    following script and press Ctrl+X and Y then save the file:


    ```

    @reboot sh /home/pi/project/project1_startup.sh

    >/home/pi/project/cronlogs/cronlog 2>&1

    ```


    > Note that it is a single line, and hence, it should be inserted without pressing
    Enter.


    Commands will also log the errors and execution status to the cronlogs folder
    in the project directory. We are now ready to test the project execution during
    boot-up. Test it using the sudo reboot command.


    With this, we do not need the keyboard, mouse, Ethernet cable, or PC to configure
    and run the code when the RasPi is started up. Just wear the RasPi and connect
    the battery supply. Your RasPi is ready to measure the distance and give the indications
    and warning sound whenever the obstacle is less than 100 cms away. If you want
    to remove the project from the startup, just re-edit the crontab file and remove
    the line we added.'
