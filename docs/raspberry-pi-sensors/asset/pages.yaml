  md: '# Preparing the code


    Working with the DHT11 sensor is quite complicated but not difficult. In parallel
    with this sensor, we have interfaced the LDR sensor. We have to manage the timings
    for both sensors. The problem can be easily solved when we break it down into
    several instances. We will split the project into smaller steps as follows:


    +   1. Understand the bit banging technique for DHT and prepare the code as the
    timing sequence.

    2. Write the code for the DHT sensor and test it.

    3. Test the code for the LDR sensor.

    4. Combine both codes and test it.

    5. Add the comparison loop, and make the LED glow to show some indications.


    # Code the DHT sensor and measure relative humidity and temperature


    As we know, the DHT sensor works on single-wire bidirectional protocol. Thus,
    the synchronization between the sensor and the RasPi is very important. We have
    to read the sensor at timed intervals. Once the RasPi sends a request, the DHT
    sensor sends the recently read temperature and humidity data simultaneously. As
    the sensor is slow and from the timing diagram shown in the next figure, it is
    recommended that you read the sensor or send the request to the sensor every 5
    seconds or more to get accurate data.


    > If you have already set up the hardware, you need not to remove the connections
    of the LDR sensor while working with the DHT sensor.


    Let''s first see the timing diagram to be followed, and then, we will go through
    the responses received from the sensor. If you observe the upcoming timing diagram
    image from the left-hand side, the data line is pulled up (high) by a resistor
    of value 4.7KΩ. Therefore, whenever there is no forceful action, such as pulling
    down, or no data transmission, the line status is pulled high by default. Understanding
    the diagram in the sequential manner, we will move from left to right.'
