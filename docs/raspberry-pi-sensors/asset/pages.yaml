  md: '# Serial Peripheral Interface


    The Serial Peripheral Interface (SPI) is a full-duplex, short-distance, and single-master
    protocol. Unlike UART, it is a synchronous communication protocol. One of the
    simple connections can be the single master-slave connection, which is shown in
    the next figure. There are usually four wires in total, which are clock, Master
    In Slave Out (MISO), Master Out Slave In (MOSI), and chip select (CS). Have a
    look at the following image:


    ![](img/294138a424db5b37c44c0a7ad39ef037_60_0.png)


    The master always initiates the data frame and clock. The clock frequencies can
    be varied from the master according to the slave''s performance and capabilities.
    The clock frequency varies from 1 MHz to 40 MHz, and higher too. Some devices
    trigger on low input, which makes whenever the logic zero signal is given by the
    master to slave on the CS pin, the slave chip is turned ON. Then it accepts the
    clock and data from master. There can be multiple slaves connected to a master
    device. To connect multiple slaves, we need additional CS lines from the master
    to be connected with the slaves. This can be one of the disadvantages of the SPI
    communication protocol, when slaves are increased. There is no acknowledgement
    sent to the master, so data without knowing whether the slave received it or.
    If both the master and slave are programmable, then during runtime (exec the program),
    the master and slave actions can be exchanged. For the RasPi, we can easily write
    the SPI communication code in either Python or C. *Chapter 5, Using an ADC to
    Interface any Analog Sensor with the Raspberry Pi*, comes with the use of the
    SPI protocol, in which we are going to interface a sensor station by ourselves
    to log data. Logged data will be uploaded to the Internet and sent to your e-mail
    IDs. Interesting isn''t it? The location of the SPI pins on RasPi 1 models A+
    and B+ and RasPi 2 model B can be seen in the following diagram. This diagram
    is still valid for RasPi 1 model B:'
