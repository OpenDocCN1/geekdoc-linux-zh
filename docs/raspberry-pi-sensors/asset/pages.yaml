  md: '# The RasPi camera modules


    There are two options when buying the dedicated camera modules to be interfaced
    with RasPi. The camera comes with the half-long flex cable to connect to the RasPi
    CSI connector. The RasPi camera modules are available in two options:


    +   - Raspberry Pi camera module: This camera module employs a 5-megapixel camera
    with the capability of full HD video recording at 30 FPS. It does the job well
    during the daytime with better light.

    - Raspberry Pi camera module black Noir: NoIR stands for No Infrared. This camera
    module doesn''t have an internal infrared filter, which gives the camera the ability
    to see in the dark. You can deploy this camera as a CCTV in your garden house
    to keep a watch on your pet at night. These cameras perform even better for wildlife
    photographers by triggering and capturing the image or video whenever motion is
    detected. This camera has the ability to capture images at night because it deploys
    infrared LEDs.


    These cameras have a price tag of $25 in online stores. To enable the RasPi camera
    module, enter this command and enable the camera from the configuration window:


    ```

    sudo raspi-config

    ```


    Select the Enable Camera option in the configuration settings using the keyboard.
    Test the camera by capturing the images using the following command:


    ```

    Sudo raspistill -o FirstImageThroughRasPi.jpg

    ```


    Use the manistill command to know about more options available with the raspistill
    command. You can even record videos (in H264 format) using the following command:


    ```

    raspvid -o FirstVideoThroughRasPi.h264 -t 5000

    ```


    This command will record a video for 5 seconds, and will automatically save the
    file when the recording finishes.


    > The RasPi camera modules are very sensitive to electrostatic charges transferred
    by our body. RasPi camera module failures are very common in the Raspberry Pi
    community. Wear electrostatic straps or taps on your hand before touching the
    camera. The ribbon supplied with the RasPi camera module is very delicate. Therefore,
    special care should be taken while using this camera module.


    ![](img/294138a424db5b37c44c0a7ad39ef037_161_0.png)'
