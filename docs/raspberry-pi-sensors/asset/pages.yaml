  md: '# CS0 (CE0) CS1(CE1)


    ![](img/294138a424db5b37c44c0a7ad39ef037_61_0.png)


    # Inter-Integrated Circuit


    Inter-Integrated Circuit (I2C) is a protocol that works with two wires and it
    is a half-duplex (a type of communication where whenever the sender sends the
    command, the receiver just listens and cannot transmit anything; and vice versa),
    multimaster protocol that requires only two wires, known as data (SDA) and clock
    (SCL). The I2C protocol is patented by Philips, and whenever an IC manufacturer
    wants to include I2C in their chip, they need a license. Many of the ICs and peripherals
    around us are integrated with the I2C communication protocol. The lines of I2C
    (SDA and SCL) are always pulled up via resistors to the input voltage. The I2C
    bus works in three speeds: high speed (3.4 MBps), fast (400 KBps), and slow (less
    than 100 KBps). It is heard that the I2C communication is done up to 45 feet,
    but it''s better to keep it under 10 feet.'
  merge: -1
