  md: '# Using your sensor station – make a temperature logger


    Now that you know the trick of reading the ADC value from MCP3008 through an SPI,
    line we are ready to interface with the sensors with MCP3008''s channel 0. You
    can now use your sensor station to interface with up to eight sensors in parallel.
    To simplify the experiment, we are going to interface the temperature sensor with
    the sensor board. Imagine that the RasPi has been connected to a remote place
    to log temperature data. Depending on your application, in a month or after a
    certain time, we need the data to be recorded manually. To log this, we will make
    use of Python to store data in a text file, and read these values later on for
    analysis.


    # Know the LM36 temperature sensor


    LM35 and LM36 (also known as TMP36) provide the linear response of temperature
    changes on voltage. The change in output voltage of the sensor is directly proportional
    to the temperature change experienced by the temperature sensor. LM35 and LM36
    are centigrade temperature sensors. Because of its wide availability, these sensors
    can be bought online or from any retail shop near. We will build our project with
    the LM36 sensor; if you have got the LM35 sensor, don''t panic! The difference
    between these two sensors is as follows: measure subzero temperatures using LM35,
    we have to provide negative voltage at the output pin of the sensor, which needs
    special power supply requirements. If you provide only positive voltage supply
    to the LM35 temperature sensor, it will sense only the positive temperature range.
    This is not the case with the LM36. When provided with positive voltage, it gives
    us the full range from -50 °C to +150 °C. It can be said that LM36 is an improved
    version of the LM35 temperature sensor. Let''s take a look at the pin functions
    and the package of the sensor. The following figure is a representation of the
    LM36 temperature sensor from the bottom:


    ![](img/294138a424db5b37c44c0a7ad39ef037_131_0.png)'
