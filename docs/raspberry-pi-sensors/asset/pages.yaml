    if (cvWaitKey(100) == 27)\n    break;\n}\nreturn 0;\n\n/*----End of the Code----*/\n\
    ```\n\nTo detect motion, we will use the simple method of image subtraction. We\
    \ will capture a reference image at a particular interval, and subtract the instantaneous\
    \ frames from the camera. The difference between these images will be sent to\
    \ a threshold function to observe the change. This change will then be input to\
    \ the function to calculate the absolute value of observed motion. If the area\
    \ is in the range of 25 to 150 units (neither too large nor too small; this is\
    \ experimented using different values), the suitable action will be taken. These\
    \ values are optimum for use in detecting human motion. So, if there is any movement\
    \ in the area of interest, you can detect it as well as capture the image of the\
    \ intruder. Let's understand the code to get an idea of an entire methodology.\
    \ We will be using the wiringPi library to trigger the LED whenever motion is\
    \ detected.\n\nOpenCV functions are case-sensitive; for example, the cvSaveImage\
    \ () function will work only when the capitalization of characters in the word\
