    You will find working with GPIO very interesting! You already know from the first
    chapter that the GPIO pins are the configurable pins of a processor and if you
    will closely see the RasPi board, the GPIO functionality is brought out on board
    pin-out header from the processor in such a way that the GPIO status can be changed
    and also be read during the runtime. That is what we are going to do in this section.
    While programming, you will notice that the RasPi''s GPIO has two modes: board
    mode and BCM mode. Board mode can be seen as the pin numbers physically seen on
    the board, which are internally connected to the processor. As the processor has
    numerous pins and GPIOs available, the processor pin number and the board header
    pin number will always be different. For example, the processor has internally
    assigned the GPIO 17 designation on its own pin, while on the RasPi board, a connector
    will have number 11 of the pin. Let''s see the available GPIO pins and their functionality
    on RasPi 1 models B, A+, and B+ and RasPi 2 model B in the following tables. The
    first table shows the GPIO designations for RasPi 1 model B. RasPi 2 model B and
    RasPi 1 models A+ and B+, there are 40 pins on the header. Therefore, it can be
    said that the RasPi has two types of connectors, one with 26 pins and the latest
    models with 40-pin headers. All of these RasPi models have the same number of
    SPI, UART, and I2C interfaces available as pin-outs on the board.'
