  md: "# Meeting Your Buddy – the Raspberry Pi\n\nWe have to perform the following\
    \ steps to enable the Wi-Fi network connection:\n\n+   1. Go to the network interfaces\
    \ file of the RasPi by entering the `sudo nano / etc/network/interfaces` command\
    \ in the CLI. Note that you will get acquainted with these commands in the upcoming\
    \ sections. Once you enter the command, the text you need to change is:\n```\n\
    auto lo\niface lo inet loopback\niface eth0 inet static\n    address 169.254.0.2\n\
    \    netmask 255.255.0.0\n    broadcast 169.254.0.255\n    gateway 0.0.0.0\n\n\
    allow-hotplug wlan0\niface default inet dhcp\n    wpa-ssid \"ssid_name\"\n   \
    \ wpa-psk \"password\"\n```\n\n> > Do not forget to put ssid (your network name)\
    \ and your password (you know it!) in the quotes.\n\n+   2. After editing the\
    \ file, press `Ctrl + X` and press Y to confirm the edit made by you.\n\nShut\
    \ down the RasPi by entering the `sudo poweroff` command. You then need to connect\
    \ the Wi-Fi dongle and turn it in again. While it is booting up, it finds the\
    \ Wi-Fi adaptor connected to it. Pretty simple, isn't it!\n\n# Internet connection\
    \ through Ethernet from a PC\n\nAll of the preceding steps require a dedicated\
    \ display, mouse, keyboard, and all other cables to get the view of the working\
    \ RasPi. For regular uses, this is somewhat bulky to carry all of these along\
    \ with your RasPi. At this stage, I assume that you have already installed Raspbian\
    \ OS."
