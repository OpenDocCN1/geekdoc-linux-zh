  md: '# Monitoring the Atmosphere Using Sensors


    It is highly unlikely to find an equipment without sensors nowadays. Most appliances,
    such as air conditioners, smoke detectors, fire detectors, gas/CO2 sensors, LCD
    displays, refrigerators, toasters, thermostats, microwave ovens, and geysers installed
    in our house have sensors integrated in their circuits to measure surrounding
    atmospheric entities. When we take a look at surrounding atmosphere, there are
    so many entities that can be measured, for example, temperature, humidity, vapor,
    dust, air quality, various gas levels, wind speed, rain, water quality, light
    presence, motion, moisture, and so on. On a broader level, technologies such as
    sensor networks and the Internet of Things uses "sensor nodes" that measure one
    or multiple of these entities and send data to the intended computer or user.
    The best example of this is the "nest" thermostat (www.nest.com/thermostat/).
    This device is an example of artificial intelligence that controls and maintains
    the temperature of your room as your daily habits and keeps learning from various
    scenarios that may arise.


    Two types of sensors used for such applications are temperature and humidity sensors.
    In this chapter, we will measure ambient temperature, humidity, and light variations.
    We will create a kind of sensor node that takes the decision to turn on or off
    the light and fan. Starting the journey from selecting a proper sensor, you will
    learn about the DHT sensor and LDR sensors. These sensors play a role in measuring
    entities that we will see in this chapter. In this chapter, we will:


    +   - Understand the sensor selection process

    - Know about temperature and humidity measurement sensor

    - Know about the LDR sensor to measure light variations

    - Learn codes for both DHT and LDR sensors'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Monitoring the Atmosphere Using Sensors


    +   - Build the project to control home appliances

    - Learn how to interface multiple sensors that have the similar specifications
    and properties

    - Troubleshoot some of the common problems faced


    Let''s begin the journey by understanding how to select a sensor and enjoy the
    amazing world of the RasPi.


    # Sensor selection process


    The process of sensor selection, especially when building an environmental monitoring
    system, is very confusing in the development phase of a product. We may be unsure
    about which sensor can be used and which cannot. In the industries, the design
    and development engineers face this problem every time they start building a project.
    Sensors are difficult to control while we interface them with the processor or
    a controller, because they are sluggish compared to processors. Additionally,
    we need to take care of a lot of incoming values from sensors that come into the
    processors. For example, in safety critical systems, such as life support systems
    or baby incubators, conditioning circuitry and signal processing units are used
    to measure the sensor values precisely and take actions (such as controlling the
    temperature and oxygen levels for newborn babies or patients) accordingly. Therefore,
    the first step in selecting the sensor is to find out the exact application. Depending
    on the application, the sensor selection process should be initiated. In the previous
    chapter, when we interfaced the ultrasonic sensor, you must have observed that
    there was a complex circuitry and microchips available on the bottom layer of
    the ultrasonic sensor. That was a conditioning circuitry that made our job easy.
    Not all the sensors come in the form of a single chip. These kind of sensors are
    tricky to interface. Sensor interfacing is always tricky but not impossible to
    get working right at the first time. Observation says that whenever the sensor
    manufacturer''s price is costly, it is easier to use and precise in measurement.
    This is because these sensors are packaged in such a way that work on most communication
    protocols. This is mostly true, but should not be taken as a statement though.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Criticality of an application


    The next thing we notice while analyzing an application is its criticality and
    the environmental conditions where it is going to be used. The application be
    be used in an accident-avoidance system or braking system of an aircraft, households,
    or just for a hobby project? Our project is inclined towards a hobby project;
    we would prefer a user-friendly, inexpensive, and effective sensor for our project.
    Therefore, we can make a trade-off between accuracy and interfacing leniency.
    In addition to this, the criticality of the application is not severe or hazardous
    compared to other sensor systems, such as weather sensors in aircraft.


    # Selecting a sensor package


    The next step in selecting a sensor should be choosing a package. Some of the
    applications have a tight space to fit a sensor, and some have a huge space. Compare
    a mobile phone and a mounting machine. Both have a large number of sensors, but
    the application and room to integrate the sensor inside these applications are
    incomparable. Package should be selected in terms of the space available on the
    printed circuit board, final integration of device, packaging, and handling of
    the device. Basically, electronic components or devices are available in two types
    of packages (mountings):through-hole devices (THDs) and Surface Mount Devices
    (SMDs). We have used THDs as resistors and LEDs in the previous chapters. If you
    see carefully, the ultrasonic sensor had SMD devices on the bottom layer. SMD
    component pins are near to each other. Therefore, it is difficult and impractical
    to use SMD devices on a breadboard, and these chips are hard to solder. For hobby
    projects, whenever we want to use a sensor in the form of a surface mount chip,
    we need breakout boards. A breakout board simply expands the pins of the SMD component
    and gives access to the sensor on a usable pin header. THD components or breakout
    boards should be the priority for a hobby project.


    # Sensor properties


    After selecting an application and package type, we will move to the properties
    of various sensors available to measure the same entity. If we want to measure
    the temperature, we would look at the preciseness of the sensor and electrical
    ratings. This process is lengthy, as there are many ratings and parameters available
    for different sensors. List down all the qualities of the various sensors in a
    spreadsheet.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# Monitoring the Atmosphere Using Sensors


    After listing them the qualities of various sensors, we need to shortlist the
    best among them. There is a trade-off between the price and quality of the sensor.
    Choose a sensor that is inexpensive but also meets the threshold of the quality
    level required. In sophisticated systems, this compromise of quality over price
    is never done. However, as we are developing a hobby or household project, this
    is an effective step to be followed.


    # Purchasing the sensor


    To purchase a sensor, there are many options. You can choose the nearest hobby
    shop or you can go for online stores. Asian online stores, such as AliExpress,
    will provide you cheaper options, and special sensors are easily available. For
    the quality products, you need to look towards e-markets such as Digi-Key, SparkFun,
    Adafruit, element14, and so on. Digi-Key has smart filters to sort the components
    easily out there is always complete information about the product, along with
    its datasheet. Digi-Key provides you with the facility to purchase the components
    in numbers from 1 to 10,000 plus. To purchase a single or less number of components,
    you need to choose the Digi-Reel option. Here, Digi-Key provides the customized
    reel to select the number of components we want to purchase. However, at the time
    of writing this book, it charges around 75 to pack a customized reel. Adafruit
    is worth visiting as it provides you with lot information related to the product
    and competitive prices compared to other e-stores. To purchase a single component,
    it is beneficial to go for Adafruit.


    # Available sensors


    Some sensors are costly but easy to use; some are cheap but tricky to use. To
    measure the temperature and humidity, there are multiple options available. Widely
    used sensors are DHT11, DHT22, RHT30, Si7005 and SHT20. DHT22, DHT11, and RHT03
    are available in the THD package, whereas Si7005 and SHT20 are available in Smart
    packages. We can purchase the DHT11 sensor from Adafruit to start building the
    temperature and humidity measurement project. The basic difference between DHT11
    and DHT22 is that DHT22 provides accuracy, better temperature, and humidity ranges.
    Therefore, DHT22 is costlier than its predecessor, DHT11. These sensors are a
    little sluggish while getting data into the RasPi. The advantages of the DHT11
    sensor are that they are cheap, and an easy-to-use guide is provided by manufacturer.
    Some sensors listed here can also be considered. Some of sensors work on I2C or
    ADC pins, while others work on a proprietary one-wire protocol.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'To measure the ambient light variance (luminance) in your room, we will use
    a CdS cell (photoresistor). We can purchase PDV-P8001 from Advanced Photonics
    Inc. and 350-00009 for Parallax. We can easily get the Cd5 photoresistor from
    Adafruit; this photoresistor is similar to PDV-P8001. It is also available on
    SparkFun termed as photocurrent. If there are multiple options, choose the photoresistor
    that has larger dark resistance values (in ranges of several KΩ–MOΩ).


    Let''s plunge into each of the sensors and understand how they work.


    # InsideDHT – temperature and humidity sensors


    DHT is a combined pack of temperature and humidity sensors. These sensors are
    ideal for hobbyists who just want to do data logging. DHT11 sensors are slow in
    terms of retrieving data. As it is a combined pack, it contains a resistive sensor
    (thermistor) and capacitive humidity sensor. A thermistor changes its resistance
    value depending on the changes in temperature. Technically, all resistors act
    as thermistors because they dissipate heat when the current is passed through
    them and are responsible for power losses. However, a resistor''s characteristic
    is that when they are heated up from the external source, the resistance changes
    a little bit, which is not the case with the thermistor; its resistance changes
    in terms of several hundred ohms when there is a slight change in the ambient
    temperature. A DHT11 temperature sensor provides accuracy near to 2 degree Celsius
    in the range of 0 degree Celsius to 55 degree Celsius and compared to these values.
    On the other hand, a DHT22 temperature sensor performs well by providing accuracy
    near 0.5 degree Celsius in the temperature range of approximately -38 degree Celsius
    to 120 degree Celsius.


    Let''s now understand the humidity sensor. The DHT has an integrated humidity
    sensor that is not effective for critical-safety applications. There are polymers
    or metal oxides arranged in such a way that they capacitive plates inside a sensor.
    Due to the effect of humidity, the dielectric constant of the capacitor is changed,
    and this gives us a variance in the values of humidity. These humidity sensors
    do not guarantee accuracy, but they are suitable for some applications. The accuracy
    of a DHT11 temperature sensor is 5 percent in the range of 20–80 percent humidity,
    while a DHT22 temperature sensor provides accuracy of about 3 percent in the range
    of 5–100 percent humidity.'
