    # Channels


    In the preceding figure, the pin out of MCP3008 is represented. Pins 1 to 8 to
    the left are CH0 to CH7, which are used for analog input channels 0 to 7 respectively.


    ![](img/294138a424db5b37c44c0a7ad39ef037_121_0.png)


    Among these eight channels in MCP3008, we can use pairs and make it as a four-input
    ADC with pseudo-differential inputs. The difference between pseudo-differential
    and fully differential modes is that in the pseudo-differential mode, the ground
    is separated by a low-value resistor from the common ground for better performance.


    The example of a sensor that works on differential modes is ACS726 for current
    sensing applications in industries for over-current detection and load detection.
    To avoid complexity in the hardware, we will use single-ended operation, where
    one channel will be used to take the input from the sensor to one of the channels
    of MCP3008.


    # Ground


    In MCP3008, there are two grounds available, AGND and DGND. It is best practice
    in hardware design that the analog ground and digital ground should not be made
    common or tied together. There should be a filter or ferrite bead to improve the
    noise immunity of the digital system. In precision devices, this must be followed,
    but again, our project does not need precision or sophisticated filtering. We
    are happy to tie the analog and digital grounds together, and it is all okay to
    do that in this project.


    [ 99 ]'
