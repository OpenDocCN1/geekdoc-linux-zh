  md: 'Meeting Your Buddy – the Raspberry Pi


    # # A crash course on Linux


    Many authors and books will teach you the concepts of the Linux operating system,
    so I will just quickly introduce Linux here. You can refer to Beginning Linux
    Programming 4th Edition, Wrox Publishing, by Neil Matthew and Richard Stones.
    For shell scripting, you can refer to Linux Shell Scripting Cookbook Second Edition,
    Packt Publishing, written by Shantanu Tushar and Sarah Lakhman. This operating
    system is mostly known for its user-friendliness to beginners! When users start
    Linux, they often wonder, "Why is this operating system widely used and famous?
    Linux is the biggest open source platform for hobbyists like us, and it allows
    us to modify the kernel of the operating system the we want. Some advantages of
    using Linux include (and are certainly not restricted to) being free, stable,
    quick, and dependable under the General Public License (GPL).


    You can build your own personalized operating system using Linux distributions,
    for example, Raspbian developed on the Debian flavor of Linux. We need our customized
    operating systems if we develop our personalized hardware, we know how it should
    be programmed and we develop the drivers according to our needs on top of the
    Linux kernel. We will now go through the most powerful tool of any Linux system
    – the terminal.


    # # The terminal and shell


    The most important tool of the Linux operating system is the terminal – the CLI
    of Linux. Windows users may have already come across Command Prompt (as we used
    in the previous section) and Mac OS users may be familiar with the terminal. Once
    you learn the commands of the terminal, the Linux world opens up to you. Using
    the terminal, you can easily interact with the operating system and its kernel,
    which indirectly connects you and enables to access access hardware resources.
    Shell is a command language translator (or interpreter) that executes command
    input from user. Shell uses the Linux kernel to execute commands.


    In the terminal, you can use many shells. One of the most common shells is called
    Bourne-Again Shell (Bash). Unless you get into the complicated programming of
    shell, which is also known as shell scripting, you may not feel the strengths
    and weaknesses of a particular shell. Most of the simplest commands remain the
    same for different shells. Shell scripting is useful when you want to do postprocessing
    on your files in the same or different directories, modify the usual commands
    of Linux by your own way, or just print or execute a program. Shell scripts allow
    several commands that would otherwise be entered manually in a command-line interface
    to be executed automatically, without waiting for a user to trigger each stage
    of the sequence. This allows us to create the preconfigured file to execute the
    C programs for our sensors in the upcoming projects, which can really save our
    time while creating the projects.'
