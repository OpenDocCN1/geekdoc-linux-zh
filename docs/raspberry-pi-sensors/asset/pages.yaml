  md: '# Using ADC to Interface any Analog Sensor with the Raspberry Pi


    # SPI


    MCP3008 employs four-wire SPI communication. The device is capable of a 200 kps
    (kilo-samples per second) conversion rate. It is important to maintain the minimum
    clock speed while working with SPI-based modules. In the case of MCP3008, the
    timing between the sampling and data output should be at 1.2 ms to effectively
    get the data from the RaspberryPi''s SPI port. The pins present on MCP3008 for
    SPI are CSN, DIN, DOUT, and CLOCK, which are the same as CS, MOSI, MISO, and CLOCK
    respectively on the Raspberry''s GPIO port – similar for any other SPI devices.
    CSN is used to initiate communication with the peripheral slave device.


    > CSN is an active low pin. Remember that you have to pull down the signal to
    zero to start the communication. When it is pulled to high, MCP3008 will end the
    conversion and the device will go into the low-power standby mode. Between two
    ADC requests, CSN must be pulled to high.


    # Reference voltage


    As described earlier in the Resolution of the ADC section, you learned the importance
    of the reference voltage. It is the same pin where we need to give desired reference
    voltage. One interesting thing to know is there are dedicated chips available
    for creating precision reference voltage for ADC converters. For example, our
    ADC chip is of 10-bit resolution and works on 3.3V. There are some chips available
    that provide you with precise 3.072V reference voltage. You will definitely think,
    “why 3.072V?” If you don''t remember the formula mentioned in the Math behind
    ADC section, here it is:


    Digital Number = $(V_{resolution} / V_{ref}) \ast Vin$


    Putting our values in the formula, we get this: $2^{10} = 1024; V_{ref} = 3.072;
    Digital Number = Vin / 3$.


    It gets so easy to calculate the digital number from the incoming Vin voltage
    read at the input pin. For our application, we will simply tie the reference pin
    to the 3.3V so that we can have simplicity in the hardware side.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Supply voltage


    It is mandatory to provide stable input voltage for the ADC modules, because if
    the input voltage is noisy or unfiltered, it can directly affect the reference
    voltage of the ADC. This creates a long chain of errors, as the digital number
    depends directly on reference voltage. We will provide power supply of 3.3V through
    the RasPi''s expansion port. This voltage is near stable as it comes from the
    internal low-dropout voltage regulator.


    # Making your own sensor station


    It is essential to gain knowledge of the ADC modules that we have gone through,
    and it is good to go with the hardware setup. We know MCP3008 has eight channels
    to interface eight different single-ended output sensors. What if we build a project
    that has the capability of connecting any sensor with your RasPi? This section
    will contain the development of generic hardware that can seamlessly work with
    RasPi to interface whichever sensors you want. We can call that hardware by giving
    a name as a sensor station.


    > Not all sensors can be interfaced through MCP3008 with the RasPi. As described
    in the introduction to the ADC converter, sensors'' output is so noisy or weak
    that it needs external filters and amplification for their respective sensors.
    It is recommended to read the datasheets of that particular sensor to know the
    required additional circuitry to be interfaced.


    Until Chapter 4, Monitoring the Atmosphere Using Sensors, we used breadboards
    to create rapid prototyping hardware. We can prepare a circuit on a clean and
    reusable general-purpose circuit board (GPCB) by soldering the components. A GPCB
    can be useful for fulfilling your requirement for making the generic hardware.
    Still, if you don''t want to buy the GPCB, this section will give you the idea
    of making the circuit on a breadboard. By preparing a circuit a GPCB requires
    some soldering instruments, materials, and skills of soldering; it would rather
    be easy to use a breadboard. But there is much more fun in building a hand-soldered
    project. If you don''t have soldering skills, you can build up your skills in
    an hour or two by practicing on junk hardware. Give it a try!'
