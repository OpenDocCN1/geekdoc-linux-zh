  md: '# Hardware setup


    This project has minimal requirements. It is easy to make the connections on the
    breadboard, unlike the voltage divider on the previous project. To make this setup,
    we will require the following devices on our table:


    +   - DHT11 temperature and humidity sensor

    - LDR / photoresistor / CdS cellsensor

    - 4.7KΩ, 270 Ω, and 10KΩ resistors if the seller asks wattage of the resistor,
    ask for 1/4 watts; it is also termed as quarter watts

    - 1µF-16V through-hole electrolytic capacitor

    - One LED

    - One multimeter

    - Female-to-male jumper wires and female-to-female jumper wires

    - Breadboard

    - The RasPi with power adaptor

    - An Ethernet computer

    - A personal computer


    Take a look at the following figure. It represents the connections of our project.
    The LDR sensor is not a directional electrical component (it operates the same
    as the resistor). Therefore, it can be connected either way, unlike the LED. One
    of the terminals of LDR goes to the +5V line of the RasPi pin header, and the
    second terminal connects to pin 7 on the RasPi pin header (BCM mode GPIO 4). The
    same terminal that is connected to pin 7 connects to the positive terminal of
    the 1µF-16V capacitor.


    > To determine the polarity of the capacitor, you need to check the capacitor
    closely. There will be a strip marked by - on the body of the capacitor. The strip
    will have a color in contrast to the color of the capacitor.


    The negative terminal of the capacitor connects to the ground (common) pin of
    the RasPi. The LED can be connected in the same way we usually connect on pin
    11 of the RasPi pin header (BCM mode 17):'
