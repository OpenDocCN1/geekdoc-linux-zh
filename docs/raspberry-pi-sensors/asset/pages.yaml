  md: '# UART


    UART is a very common interface, or protocol, that is found in almost every PC
    or microprocessor. UART is the abbreviated form of Universal Asynchronous Receiver
    and Transmitter. This is also known as the RS-232 standard. This protocol is full-duplex
    and a complete standard, including electrical, mechanical, and physical characteristics
    for a particular instance of communication. When data is sent over a bus, the
    data levels need to be changed to suit the RS-232 bus levels. Varying voltages
    are sent by a transmitter on a bus. A voltage value greater than 3V is logic zero,
    while a voltage value less than -3V is logic one. Values between -3V to 3V are
    called undefined states. The microprocessor sends the data to the transistor-transistor
    logic (TTL) level; when we send them to the bus, the voltage levels should be
    increased to the RS-232 standard. This means that to convert logic levels of a
    microprocessor (0V and 5V) to these levels and back, we need a level shifter IC
    such as MAX232. The data is sent through a DB9 connector and an RS-232 cable.
    Level shifting is useful when we communicate over a long distance.


    What happens when we need to connect without these additional level shifter ICs?
    This connection is called a NULL connection, as can be seen in the following figure.
    It can be observed that the transmit and receive pins of a transmitter are cross-connected,
    and the ground pins are shared. This can be useful in short-distance communication.
    In UART, it is very important that the baud rates (symbols transferred per second)
    should match between the transmitter and the receiver. Most of the time, we will
    be using 9600 or 11520 as the baud rates. The typical frame of UART communication
    consists of a start bit (usually 0, which tells receiver that the data stream
    is about to start), data (generally 8 bit), and a stop bit (usually 1, which tells
    receiver that the transmission is over.


    ![](img/294138a424db5b37c44c0a7ad39ef037_58_0.png)'
  merge: -1
