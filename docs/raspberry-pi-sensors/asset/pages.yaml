  md: '# # Preface


    Raspberry Pi is a single-board, credit-card-sized, computer packed with many opportunities
    to explore and invent. It is really amazing to see kids start coding Python from
    scratch, and build a bird box that streams live video on the Internet to check
    whether a bird has got its meal. I remember that when I was a kid, I used to play
    with Lego toys attached to DC motors and batteries, which was engaging. At that
    time, I could not imagine the logic that went into coding, and did not get any
    chance to code my projects and control the movement of those Lego blocks using
    a mobile phone. But I am lucky enough now to get an opportunity to such projects
    and provide a launchpad for young creators who really have a passion to create
    something and change the world around us.


    The world is moving towards a new era. Technology is revolutionizing daily needs
    and habits making them available on a simple interface, which gave me motivation
    to write a book on Raspberry Pi sensors. It''s a world of creativity, and I believe
    that creativity comes when you start understanding and appreciating the fundamentals
    and start applying logic to it. A lot of information and projects on Raspberry
    Pi are floating on various webpages, and one wishes to achieve as much as she
    can. I feel that the information on webpages is often observed as incomplete.
    It gives us a chance to build projects but does not explain what is behind them.


    It is known that without actually diving deep into electronic devices and communication
    protocols, you can start coding on Raspberry Pi and craft amazing projects. I
    have colleagues around me who often need to code and wire the sensors on the Raspberry
    Pi platform for their experiments. They can develop Python code on artificial
    neural networks in a short span of time, but I believe that a basic understanding
    of electronics is a plus for such prodigies out there, who want to develop code
    on such platforms. The opposite scenario, hardware developers can wire sensors,
    ensure proper voltage levels on device pins, but when it is to code, they need
    help.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Preface


    The most interesting thing that I find with the Raspberry Pi is that I can still
    play with the hardware components and soldering iron, and code my hardware to
    make it live. This book provides a kick start for such creators, who really want
    to know how things work together, and want direction for starting projects on
    sensor interfacing and the Internet of Things with Raspberry Pi. There is tremendous
    growth in technology when we look towards the connected array of everything around
    us.


    Internet of Things opens up a new world for collecting data and analyzing it for
    better user experience. A lot of data from the array of sensors has been generated
    from several different sensor nodes. In this context, the Raspberry Pi provides
    us with the opportunity to start with simple projects, such as uploading data
    to the Internet from a developed sensor station, as described in the chapters
    of this book. This will be your first step to building an Internet of Things project.
    Another interesting thing is that with the rise of Raspberry Pi 2 model B, developers
    have enough processing to perform computation-intensive algorithms on the Raspberry
    Pi. Therefore image processing has been included in one of the chapters. It would
    have been very difficult to try to explain image processing to beginners, but
    I have at least tried to offer a simple start for readers so that they begin image
    processing on their own.


    This book explores five different projects, any of which can be a startup for
    different ways of building electronics projects. The approach I have followed
    while preparing the projects is quite interesting. I often define to follow complex
    hardware designs. Although I do not rely on breadboards (as I am more into high-speed
    circuit designs), small project prototypes, some of which are covered in this
    book, can be easily wired on breadboards. The first approach should be to purchase
    the best hardware components (preferably through hole for board testing), on which
    you can rely when the code is not working or giving proper results. Prepare a
    block diagram and consider each issue that may occur during hardware and firmware
    design. Second, read datasheets of components used and ensure every single entity
    meets the design requirements. Thirdly, we wire the components to the breadboard
    and check it thoroughly. Finally, when the hardware is built, write the code (or
    firmware), and rewrite it to make it more perfect. Remove the unnecessary variables
    and unreachable code or loops, handle interrupts, define the sleep time and watchdogs
    of a processor, and manage proper memory segments to avoid crashes. However, this
    book has followed mostly simple code that does not go deep into embedded programming.
    Raspberry Pi takes care of the faults encountered by a programmer. Just call a
    function and it does all the embedded calls in the background. Thanks to the developers
    of the Raspberry Pi libraries, with which we build more robust code (whether knowingly
    or unknowingly). When you prepare a sample of code, I advise you to break it down
    into pieces.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'You may face some difficulty when building the project for getting data from
    temperature, humidity and light sensors. First, get it done for temperature and
    humidity, and then code for the light sensor. Whenever both pieces of code give
    you the desired values, recode them. Then you can combine them by managing the
    function calls.


    When writing the chapters, I have followed a common theme across the book: first
    the setup, then the purpose of the project, and finally describing the hardware
    with complete details. In some of the chapters, the software has been divided
    into components, and then they have been merged to avoid monotony for you. I apologize
    for being lengthy in the theory portion in some parts of this book, but I am sure
    that you will love to read and learn a lot from it, and you can get the most out
    of it.


    Any questions, improvements, and suggestions are welcome, and should probably
    take place in the GitHub issues for the book at https://github.com/rushigajjar/raspberrypis
    so that everybody can take place. Besides, that anybody can contact me on LinkedIn
    at https://in.linkedin.com/in/rushigajjar and send messages regarding their interesting
    projects and startups. I would really love to hear about it. Or you can send tweets
    by sharing temperature and luminance messages at @rushigajjar once you get your
    air conditioner and lights automated!


    # What this book covers


    Chapter 1, Meeting Your Buddy – the Raspberry Pi, gives an introduction to all
    the models of Raspberry Pi available in the market, including the recent Raspberry
    Pi 2 model B. A method of installing the operating system and interesting ways
    to share the Internet with the Raspberry Pi are discussed. Then we perform hands-on
    coding in Linux terminal, Linux shell scripting, Python, and C on the Raspberry
    Pi.


    Chapter 2, Meeting the World of Electronics, explains the fundamentals of electronics
    and communication protocols by which electronic devices communicate. Experiments
    with GPIO are more interesting to perform with the shell, Python, and C languages.


    Chapter 3, Measuring Distance Using Ultrasonic Sensors, shows you how to set up
    an ultrasonic sensor with the Raspberry Pi and learn to take care of different
    voltage levels across the devices. We prepare a code to get an aid for a visually
    impaired person with an obstacle avoidance system.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Preface


    Chapter 4, Monitoring the Atmosphere Using Sensors, develops your skills in choosing
    a sensor from many that are available in the market. We then implement the hardware
    and software required for temperature, humidity, and light sensors to automate
    our home appliances.


    Chapter 5, Using an ADC to Interface with any Analog Sensor with the Raspberry
    Pi, explains interfacing of analog-to-digital converters with an array of sensors.
    We build a sensor station for the Raspberry Pi using serial protocols to use the
    generic software function built, to get data from any sensor interfaced with it.
    Finally, the data can be stored in a log file for analysis.


    Chapter 6, Uploading Data Online – Spreadsheets, Mobile, and E-mails, takes a
    dive into the Internet of Things and sensor nodes. With the help of the sensor
    developed in the previous chapter, we upload the data to online spreadsheets and
    observe a real-time graph. We also get emergency e-mails on our e-mail platforms.
    Once you get your project done, you can send your sensors to rushi. raspberrypisensors@gmail.com.


    Chapter 7, Creating an Image Sensor using a Camera and OpenCV, covers the basics
    of image processing and how an installation of the OpenCV library can be performed
    successfully. Using a camera, we will develop an IP camera to install in your
    backyard to observe live streaming of activities. Further, we will build a piece
    of motion detection code in OpenCV to detect human movement in a particular area
    and capture an image for an immediate alert.


    Appendix, Shopping List, includes the list of the hardware components that need
    to be purchased in order to perform the hands-on tasks described in the book.
    From chapter 2 onwards, these components will be required to test our codes. You
    can directly take this list to the electronics distributors near you and come
    home with a filled shopping bag!


    # What you will need for this book


    There are no special demands for implementing the projects of this book on the
    Raspberry Pi, except the essential hardware components! You can use a personal
    computer with Linux, Windows, or Mac OS X to connect the Raspberry Pi to it. Any
    of the Raspberry Pi models available in the market (Raspberry Pi 1 models A+,
    B, B+, or Raspberry Pi 2 model B) should be okay for performing experiments on
    the code. You can refer to the Appendix, Shopping List, for the requirement of
    hardware before getting into Chapter 3, Measuring Distance Using Ultrasonic Sensors,
    and the later chapters.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Who this book is for


    This book is perfect for hardware enthusiasts who want to create a variety of
    projects using the Raspberry Pi. It is for people who have prior programming experience,
    especially in Linux, C, and Python, but it''s not limited to them. Those who do
    not have programming knowledge can get the essentials from the book and start
    developing the projects instantly. In any case, this book will get you ready with
    all the latest electronics concepts that are required for hardware programming
    with the Raspberry Pi.


    # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "There
    are two functions in the spi-dev library for sending the data to SPI slave devices."


    A block of code is set as follows:


    ```

    import RPi.GPIO as GPIO

    from time import sleep

    GPIO.setmode(GPIO.BCM)

    GPIO.setup(17, GPIO.OUT)

    Print "All Set in Python! Let''s Blink"

    ```


    Any command-line input or output is written as follows:


    ```

    sudo nano /etc/modprobe.raspi-blacklist.conf

    ```


    New terms and important words are shown in bold. Words that you see on the screen,
    in menus or dialog boxes for example, appear in the text like this: "Select the
    Enable Camera option in the configuration settings using the keyboard."'
