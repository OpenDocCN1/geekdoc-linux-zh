- img_proc: true
  md: 'The rightmost figure shows the best way to pull up because there is a resistor
    in which some voltage drop will occur. When the switch is open, the terminal of
    the NOT gate will be floated (pulled up) to the VCC which is the default. When
    the switch is closed, the input of the NOT gate will be connected to the ground
    and it will experience the logic zero state. The current flowing through the resistor
    will be nominal this time. For example, if VCC = 5V, R7 = 1K, and I = V/R, then
    I = 5mA, is in the safe region. For the pull-down circuit example there can be
    an interchange between the switch and the input of the NOT gate. When using sensors
    and ICs, keep in mind that if there is a notation using pull-ups or pull-downs
    in datasheets or technical manuals, it is recommended to use them wherever needed.
    In the next section, we will use the pull-up resistor in one of the communication
    protocols.


    # Communication protocols


    It has been a long theory so far. The previous section was meant to give you an
    understanding of some useful concepts of electronics. There can be numerous components
    including ICs and digital sensors as peripherals of a microprocessor There can
    be a large amount of data with the peripheral devices and there might be a need
    to send it to the processor How do they communicate How does the processor understand
    that data is coming into it and that it is being sent by the sensor There is a
    serial parallel line connection between ICs and a microprocessor Parallel connections
    are faster than the single but are less preferred because they require more lines,
    for example, 8, 16, or more than that. A PCI bus can be an example of parallel
    communication. Usually in a complex or high-density circuit the processor is connected
    to many peripherals and in that case we cannot have many free pins/lines to connect
    an additional single IC Serial communication requires up to four lines depending
    on the protocol used Still it cannot be that said serial communication is better
    than parallel but serial is preferred when low point come into the picture. In
    serial communication data is sent over frames or packets Large data is broken
    into chunks and sent the lines by a frame or a packet What is a protocol A is
    set of rules that need to be followed while interfacing the ICs to the microprocessor
    and it''s not limited to the connection The protocol also defines the frame structures,
    frame lengths, voltage levels, data types, data rates and so on. There are many
    standard serial protocols such as UART FireWire Ethernet SPI I2C and more. The
    RasPi 1 models A A+ B+ and the RasPi 2 model have one SPI pin one I2C pin and
    one UART pin available on the expansion port. We will see these protocols one
    by one.'
