    RasPi 1 model B, the short description of the important connectors is as follows:


    +   - **GPIO header:** GPIO stands for General Purpose Input Output, which has
    been brought out to pin connectors present on the board. The processor on board
    (BCM283x, which is the brain of a RasPi) has a facility to provide a specific
    functionality during the runtime of your own program. We are going to use them
    a lot in the upcoming chapters. The great thing with this is that you can assign
    a task to the specific GPIO in your program, and while your program executes,
    it goes logic low or high (triggers to off state and on state) accordingly. We
    can read values from any other peripherals, such as sensors, and compute the received
    values in your own programs. Apart from reading the values, we can show the result
    of the program by connecting LEDs or embedded LCD displays to the board. Depending
    on the decision taken in the code, we can drive a motor connector on GPIO through
    a motor driver circuit. This feature on RasPi makes a huge difference compared
    to the normal computing board by giving developers the freedom of crafting the
    creation.


