- img_proc: true
  md: '# Chapter 5


    | Single-ended mode (D3) | D2 | D1 | D0 | Channel to read |

    |---|---|---|---||

    | 1 | 0 | 0 | 0 | 1 |

    | 1 | 0 | 0 | 1 | 2 |

    | 1 | 0 | 1 | 1 | 3 |

    | 1 | 0 | 1 | 0 | 4 |

    | 1 | 1 | 0 | 1 | 5 |

    | 1 | 1 | 0 | 0 | 6 |

    | 1 | 1 | 1 | 0 | 7 |

    | 1 | 1 | 1 | 1 | 8 |


    Before initiating the data transfer from the RasPi to MCP3008, we need to set
    the CS pin low, and it should be kept low throughout the conversion. Between two
    conversions, the CS pin must be pulled high for optimum performance. Fortunately,
    the `spi-dev` library takes care of this, and we have to focus more on our logic
    than writing our own library.


    There are two functions in the `spi-dev` library for sending the data to SPI slave
    devices. One is `spi.xfer()`, which works on active chip select. The other function
    performs the `chip select (CS)` low during operation, and the CS high works between
    two blocks of transfers. We will use the `spi.xfer2()` function, since our device
    works on active low chip selects and requires the CS pin to be made high after
    each conversion.


    The data flow should be like this:


    +   - Start bit, (1-bit length, State: High)

    - Control bit, (4-bit length: D0 D1 D2 D3)

    - Wait for the data


    This is how our data will look once we send the request to read channel 1 over
    the SPI line:


    ![](img/294138a424db5b37c44c0a7ad39ef037_129_0.png)


    [ 107 ]'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Using an ADC to Interface any Analog Sensor with Raspberry Pi


    Now, the spi.xfer2 ([value1, value2, value3]) function sends 3 bytes over SPI
    MOSI line and receives the3 bytes back in an array. Therefore, we have to send
    the first byte by (0000001)b or (1) to the SPI slave over the MOSI line. The second
    byte should be the nibble of the command to the slave for selecting the channel,
    which is (1 D3 D2 D1)b or (8-x), where x is the channel number. To make this nibble
    a byte, we shift the value (8-x) by 4 bits. As per the timing diagram earlier,
    the first byte is not required to be sent. Therefore, we will send the third byte
    by (0000000)b or (0).


    Once the command is sent by spi.xfer2(), all have to wait for the response from
    the slave, which is taken by the spi.xfer2() function itself. It starts sensing
    the MISO line after sending the commands over the MOSI line. MCP3008 starts the
    10-bit data from the MISO line and the data is stored in an array of three elements,
    each of length 8 bits (1 byte). We prepare a function that can be called by passing
    the value of channel, and get the read data back from the function as a return
    value. We can run this in Python as follows:


    ```

    def readadc(channel):

    value = spi.xfer2([1, (8+channel))<<4,0])

    read = ((value[1]&3) << 8) + value[2]

    return read

    ```


    The least significant bit is stored in the value[2] element of array and the remaining
    two bits are stored in the value[1] element. To make all other bits zero, we will
    perform the AND operation with 0b or (3)d. Let''s take a look to better understand
    the received data:


    Received data = 00000000 01000010 01100010


    The array stores the data like this: value[0] = 00000000, value[1] = 01000010,
    value[2] = 01100010.


    We are interested in the last two bits of the value[1] element, as the ADC sends
    10 bits of data. We perform the AND operation with 3 bits:


    ```

    01000010 & 00000011 = 00000010

    ```


    The sixth bit was already a glitch or unwanted data, which is removed by this
    operation. We need to shift the values by 8 digits, as it will finally affect
    the decimal number.


    ```

    00000010 << 00001000 = (10000010)b = (128)d

    ```


    Add this shifted value to the value[2] element.


    127 + 98 = 225 is the data received from the ADC converter.'
  merge: -1
  pgno: 130
