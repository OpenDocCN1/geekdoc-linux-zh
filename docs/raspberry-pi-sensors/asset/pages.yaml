  md: 'Chapter 6


    # Hardware setup


    With a lot of information on IoT provided on this time, we are going to make a
    small IoT project of our own. This hardware setup will be a very easy setup compared
    to the previous chapters. The hard work we did in Chapter 5, Using an ADC to Interface
    any Analog Sensor with the Raspberry Pi, will be very helpful to us. We will be
    using the sensor station to get the data of the temperature sensor. Listing the
    needs for this chapter, we will require the following:


    +   * A sensor station

    * A temperature sensor (LM35/TMP36)

    * A GPIO ribbon cable for Raspberry Pi model B (26 pin), A+ (40 Pin) or B+ (40
    pin), or RasPi 2 model B (40 Pin); female-to-female

    * Male-to-female and female-to-female jumper wires

    * A Raspberry Pi, a power adapter, an Ethernet cable, a personal computer


    Connect the sensor station using the ribbon cable. Power up the RasPi with the
    power adapter, and start the session in PuTTY using your personal computer. Cross-verify
    that your computer is sharing the Internet connection with the RasPi. Use the
    following command to check:


    ```

    ping -c 4 www.google.com

    ```


    If it is not sharing the Internet connection, go through the guide provided in
    Chapter 1, Meeting Your Buddy - the Raspberry Pi. Obviously, connecting the RasPi
    to the Internet is very important. Remember the Internet of Things! Let''s dig
    into the software side. There''s much to learn in the software.


    # Synchronizing the clock with the Internet


    It is really difficult when the date and time of the RasPi are not synced with
    the local time zone while logging the data. It is much more difficult once you
    set up your logging device or sensor node in a remote place that doesn''t have
    uninterrupted power supply. You might have noticed that whenever the RasPi boots,
    the clock shows the incorrect time. Check it by entering the date command in the
    command-line interface of the RasPi. Also, in the previous chapter, you might
    have noticed that the time logged in the .csv log file is not showing the refreshed
    date. No, the RasPi doesn''t time-travel when it''s sleeping! It is just because
    it doesn''t have a dedicated button to power its real-time clock (RTC). To make
    the RasPi cheaper, the designers removed a lot of functionalities that normal
    desktops or laptops have.'
