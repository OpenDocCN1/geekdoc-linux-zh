    # Changing cmdline.txt again to add the PC''s Ethernet port IP address


    Shut down the RasPi (sudo poweroff), remove the SD card, insert it into your PC,
    and follow the Editing the command-line file of RasPi section. Add the noted IP
    address (in this case, `169.254.121.232`) at the end of the `cmdline.txt` file,
    as shown in the following code:


    ```

    dwc_otg.lpm_enable=0 console=ttyAMA0,115200 kgdboc=ttyAMA0,115200 console=tty
    root=/dev/mmcblk0 roottype=ext4 elevator=deadline rootwait=169.254.0.2::169.254.121.232

    ```


    Here, the double colon (::) is the most important part to be put between RasPi''s
    IP address and your PC''s IP address. Then, save the `cmdline.txt` file.


