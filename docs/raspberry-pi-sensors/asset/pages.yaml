  md: '# Uploading Data Online - Spreadsheets, Mobile, and E-mails


    Let''s understand the e-mail function first. In the e-mail function, we are passing
    variables (sender_email, sender_password, receiver_email, subject, min, and max)
    that come when an if() loop is satisfied. In the content variable, we are storing
    the body of an e-mail containing the minimum and maximum temperature values. Then
    it tries to log using the e-mail ID and password provided in the functions.


    The code flow starts from the first while loop, which will start running forever.
    Our outer while loop will complete one cycle every day because we are putting
    an inner while loop to run forever and break when the date changes. If you look
    closely at the filename variable, you will see that it sets the filename as Sensor_Data_
    appended with the current date. The datetime.datetime.now() function provides
    the time and date with precision in milliseconds. Millisecond precision is not
    required for our project and application. The Splitsplit() removes the milliseconds
    from the raw data. Once we get the filename, we save it as a .csv file using the
    csv writer() function.


    A few examples of the split functions in Python Shell returned these values:


    ```

    >>> str(datetime.datetime.now())

    2015-01-26 17:12:49.998000

    >>> str(datetime.datetime.now()).split(''.'')[0]

    2015-01-26 17:13:17

    >>> str(datetime.datetime.now()).split(''.'')[0].split('''')

    ```


    To detect the date change, we will use the split() function two times to extract
    the date string from the datetime.datetime.now() function, and it will be stored
    in the prev_date variable.


    We are using max_sensor_data = -9999 and min_sensor_data = 9999 to prevent false
    data segregation in the min() and max() functions, which are used to find minimum
    and maximum values from the .csv file. The temp_limit variable can have your desired
    value — at which you want to send an e-mail to the RasPi.


    It would be good to add try, which handles the selected exceptions. As explained
    in the previous sections while experimenting with Google spreadsheets, it works
    on a simple principle:


    +   Execute the try clause. If no exception occurs, the except clause is skipped
    and execution of the try statement completes.

    If an exception occurs during execution of the try clause, the next part of the
    clause is skipped. Then it goes to the except clause and it gets executed.'
