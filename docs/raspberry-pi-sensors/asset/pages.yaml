  md: '# Chapter 7


    It is required to set the configuration file before starting the project, which
    can be

    called IP-camera (network camera):


    sudodano /etc/motion/motion.conf


    Setting the configuration file could be a tedious job, as the file is too long
    and there

    are many parameters to set. You can search parameters in the file using Ctrl +
    W in

    nano editor. The set parameters presented as follows:


    ```

    netcam url http://169.254.0.2:8081

    webcam_localhost off

    control_localhost off

    control_port 8080

    framerate 2

    control_html_output on

    daemon on

    ```


    ![](img/294138a424db5b37c44c0a7ad39ef037_163_0.png)


    > The RasPi''s IP address can be found using the ifconfig eth0

    command. In response message, it must have been noted in the

    second line as inet addr:169.254.0.252.


    We informed the IP address of the RasPi module and provided a port address

    for motion, where the stream will be diverted. By setting the webcam and control

    localhost as off, the RasPi will be able to give access to other computers in
    the

    network on ports 8080 and 8081. Setting the frame rate more than 6 or 7 FPS will

    be computationally heavy for RasPi to handle, and it may crash during runtime.

    Setting the frame rate at 2 FPS will provide stable performance. Setting the control

    HTML output will provide the functionality of HTML server''s built-in motion

    API. When motion is detected, the post_capture setting will let the RasPi know

    the number of frames to be captured. Start the motion service when the RasPi

    boots, start the daemon by setting it as on.


    After making these changes in the configuration file, press Ctrl + X, then Y,
    and then

    Enter Enter file to save and edit the configuration file. There is a need to change
    the

    daemon file of motion to keep the motion service running. Enter this command

    to set the daemon for motion:


    ```

    sudo nano /etc/default/motion

    ```'
