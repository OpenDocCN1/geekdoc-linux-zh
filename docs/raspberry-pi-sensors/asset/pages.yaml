  md: "# Chapter 7\n\nFor example, suppose you are working in a folder that contains\
    \ the code files project0.cpp and project1.c. If you execute the shell file being\
    \ in the same folder, it will start compiling all of the available C by generating\
    \ the executable files project0 and project1, which can be later run by ./project0.\
    \ Let's experiment with the shell code. Go to the folder where you wrote the motion\
    \ detection code (motion.cpp), open nano editor with the build.sh filename, and\
    \ type this code:\n\n```\n#!/bin/sh\nif [ $# -gt 0 ]; then\n  base=`basename $1\
    \ .`\n  echo \"compiling $base\"\n  gcc -ggdb `pkg-config opencv --cflags --libs`\
    \ $base.c -o $base\nelse\n  for i in *.c; do\n    echo \"compiling $i\"\n    gcc\
    \ -ggdb `pkg-config --cflags opencv` -o `basename $i .c`\n    $i-lwiringPi `pkg-config\
    \ --libs opencv`\n  done\n  for i in *.cpp; do\n    echo \"compiling $i\"\n  \
    \  g++ -ggdb `pkg-config --cflags opencv` -o `basename $i .cpp`\n    $i-lwiringPi\
    \ `pkg-config --libs opencv`\n  done\nfi\n```\n\nSave this shell file by exiting\
    \ nano editor. The shell code written here is derived from the OpenCV samples\
    \ folder and edited according to our needs. The wiringPi library is mentioned\
    \ in bold characters. The if-else loop is classified as a one-file and multiple-files\
    \ compilation. This code will take each C and C++ file one by one and save the\
    \ executable. Now give access to execute this file:\n\n```\nchmod +x build.sh\n\
    ```\n\nExecute the shell code by typing ./build.sh. It will start compiling all\
    \ the .cpp and .c files in the folder. Other files in the folder will remain unaffected.\
    \ The executable output file will be saved as motion. Execute the file by typing\
    \ ./motion to see the output. Remember to execute this file by opening LxTerminal\
    \ in the Xming server to see the window.\n\n[ 155 ]"
