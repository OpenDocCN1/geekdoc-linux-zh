  md: '# Creating an Image Sensor Using a Camera and OpenCV


    The next step is to compile the entire library. As we have seen, the OpenCV library
    has many components.


    > Before executing the make command, open the case of the RasPi and put it in
    a place where it gets enough air to cool down. It is normal that the RasPi gets
    heated during this operation.


    Using the previous command, cmake, we generated an intrinsic make file, which
    will be used in the environment of our choice. Due to dependencies between the
    components in the library, the make command will be useful for execution:


    ```

    make

    ```


    Now, if it is evening when you are working on this installation, grab some popcorn,
    watch your favorite TV show, and take a beautiful sleep. You will be able to see
    the results by the next morning! As mentioned earlier, this compilation on the
    Raspberry takes almost 10 to 14 hours to complete. Do not disturb the RasPi while
    it is compiling the libraries. Do not worry if the compilation halts or sticks
    something in the middle, or if your RasPi shuts down accidentally. Start the session
    again, go to the same build folder, and enter the make command again. It will
    resume from where it was stuck. RasPi 2 model performs exceptionally well here.
    This compilation takes 3 to 4 hours to finish the make process on RasPi 2 platform.


    Once this lengthy task is done, we are ready to install the compiled library on
    the RasPi. This task will not take as much time as it took in the previous step:


    ```

    sudo make install

    ```


