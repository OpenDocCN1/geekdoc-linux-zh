  md: 'Measuring Distance Using Ultrasonic Sensors


    # # Is the module responding?


    There can be many reasons when the module doesn''t respond. Either you are not
    powering the RasPi with the adequate amount of current, or the connections are
    not proper on the breadboard. The sensor can take quite high amount of current.
    You might be in need to connect the 5V, 1A charger or adaptor to your RasPi. Check
    whether the resistors are correct of correct values either using the resistor-coding
    method or using the multimeter. Take the multimeter and change the delay value
    in program to 5 seconds after turning on the trigger pulse. Check whether pin
    16 is getting high or not. RasPi''s pin 16 should show 3.3V reading on the multimeter.


    # # Are you measuring the distance less than 2 cm?


    The sensor will not respond if any obstacle is very close to it. It is very hard
    for the sensor to measure a very small distance.


    # # A wearable device for the visually impaired


    The ultrasonic sensor can provide added sense to a visually impaired or blind
    person. You can contribute to the society by making this kind of a wearable device,
    which can either play a warning sound on the person''s ear or a vibration alert
    on the stick. There are such sticks available in the market, and you can build
    your own.


    Your aim is to build a wearable device based on the RasPi and ultrasonic sensor.
    Also, you will play the warning sound on the headphones that are connected with
    the RasPi when the visually impaired person is approaching an obstacle that is
    about 100 cms away. Sounds cool, doesn''t it? This project will work for RasPi
    2 Model B and RasPi 1 Model B and B+ users. We will learn this step-by-step process
    to assemble this project on the hardware and also understand how to code it. Let''s
    dig deeper and understand how this can be.


    # # Building the hardware


    When you run the RasPi, you must have noticed that your project will require the
    electrical plug socket where we connect the adaptor to power the RasPi. Our project
    needs to be wearable. So, as you have rightly guessed, we need a battery. The
    battery specifications can be quite variable, but you need to stock 4000mAh-10000mAh
    and 1A-1.5A USB battery pack. You will easily get the USB battery pack for the
    RasPi in the online stores. The power banks for mobile phones are also OK, but
    stick with the current ratings. We also need headphones that have a standard 3.5
    mm connector to play the warning tones. Here is a list of the hardware we need:'
