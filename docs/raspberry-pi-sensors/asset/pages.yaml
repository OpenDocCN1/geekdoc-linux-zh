  md: 'Uploading Data Online – Spreadsheets, Mobile, and E-mails


    We developed a sensor station in the previous chapter. We will use this sensor
    station to collect data from different sensors while doing the hardware setup.
    In the next step, we will upload the data to the Google spreadsheet by pushing
    it online, and see the real time graph of the sensor data on desktops and on Android
