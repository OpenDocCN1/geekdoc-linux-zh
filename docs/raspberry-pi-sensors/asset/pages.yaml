    in use.

    While the MCP3008 chip, do not keep the soldering iron near the leads of the IC
    for. The soldering irons are typically hot, from 250 degree Celsius to 400 degree
    Celsius. Long exposure to higher temperatures can damage the IC.


    ![](img/294138a424db5b37c44c0a7ad39ef037_127_0.png)


    After preparing the hardware, we are ready to prepare the code by powering up
    the RasPi and connecting it with the PC over SSHing through PuTTY using an Ethernet
    cable. At this moment, there is no need to connect the hardware module that we
    created just. Once we write the software as described in the next section, we
    will then connect hardware module to the RasPi using the ribbon/bus connector.


    # Generic software preparation


    In future, there will be lot sensors introduced than those you are working with.
    It will be great if you develop software that is built to use in any of your analog
    data acquisition projects. Preparing generic software without any errors will
    reduce time in future, and you can rapidly build projects just by adding the working
    generic software and calling the functions whenever needed.


    We know that the MCP3008 is interfaced through the SPI protocol. To use the SPI
    protocol, we have install some additional packages on our RasPi. First of all,
    we need to make our RasPi up to date. Enter these commands to update and upgrade
    the OS to the latest kernel package. If you haven''t performed any update after
    the fresh installation, this may take a long time. Once the process is done, restart
    the RasPi module to perform the normal operations:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo reboot

    ```


    After this process, we have to make the RasPi board ready with the Python development
    packages that will bring the default static library packages and header files
    of the standard Python library:


    ```

    sudo apt-get install python-dev

    ```'
