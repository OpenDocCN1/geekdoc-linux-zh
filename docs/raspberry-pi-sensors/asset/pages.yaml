  md: '# OpenCV


    One of the most powerful and widely used cross-platform libraries for image processing
    is OpenCV, which can run on any hardware or software platform. It can be installed
    on the RasPi to get functionality such as face detection, finding contours, gesture
    recognition, motion tracking, 3D depth perception using cameras, and many more
    complex algorithms for machine learning. OpenCV stands for Open Source Computer
    Vision. was developed by Intel. It is basically written in the C++ language and
    can have full interfacing with Python, Java, or MATLAB. Check out http://opencv.org
    for the list of available open source libraries. With aiming for computational
    efficiency in mind, OpenCV is designed to work with multicore architectures. Writing
    OpenCV in C and C++ is common across the globe image processing experts. OpenCV
    can also be written in the Python language, as the library has full development
    and supports functions in the Python script.


    Computer vision is a quickly growing field of cheaper and advanced processing-capable
    hardware. OpenCV provides productivity for professionals achieving the best results
    in the field of vision processing. Initially, image processing was only possible
    in research labs due to its rarity on open source platforms and dedicated hardware.
    Nowadays, students, researchers and professionals can easily use the fully developed
    and growing library known as OpenCV. OpenCV, at the time of writing this book,
    is of version 3.0 Beta, with approximately 9 million downloads.


    # Camera interfacing with the RasPi


    The RasPi has the Broadcom multimedia processor BCM2835, which has an integrated
    Videorec-IV graphics engine. There are multiple ways to interface the camera with
    the RasPi connectors. As described in Chapter 1, Meeting Your Buddy – the Raspberry
    Pi, (refer to the diagram showing the RasPi''s port description), the RasPi has
    a dedicated CSI port for connecting the camera module. This port can be located
    near the Ethernet controller (in the case of model B) or the 4-pole audio connector
    (in the case of model B+). The Camera Serial Interface (CSI) port is dedicated
    to camera interfacing in mobile devices and advanced peripheral controllers. We
    have two options to interface the cameras with our RasPi. We can either interface
    the webcam via USB, or choose the camera module from the Raspberry Pi organization
    known as Raspberry Pi camera module.'
