    ```


    If we analyze the timing diagram of the ultrasonic sensor to measure the distance,
    we can easily understand how the sequence should behave. In the previous step,
    we made the trigger pin zero by default. Then, we provided a 10µs pulse to the
    trigger pin of the sensor from the RasPi. Once the sensor receives the trigger
    signal, it sends the 40 KHz pulse / ultrasonic burst from the built-in transmitter
    (contains eight pulses).


    ![](img/294138a424db5b37c44c0a7ad39ef037_82_0.png)


    We should expect the echo signal after the ultrasonic burst signal. The length
    of the echo signal provides us with the timings for the distance calculations.
    How do we write in a code? The simple way to create a trigger pulse is by turning
    the trigger pin high for 10µs, as shown in the following code:


    ```

    ```

    GPIO.output(23, True)

    time.sleep(0.00001)

    GPIO.output(23, False)

    ```

    ```


    Using this code, we send a pulse, and the ultrasonic sound burst is generated
    internally and transmitted into the air. It will reflect and come back to generate
    the echo pulse. We have to check continuously until we get the echo pulse. As
    we saw in the previous figure, the echo pin remains high for a certain period
    of time. So, we need to calculate the amount of time while the echo signal stays
    on. We can use the `while()` loop to continuously monitor the echo pin. We can
    use the `time` function to capture the time duration of echo it remains high:'
