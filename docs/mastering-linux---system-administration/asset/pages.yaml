  md: '# 8.2. fuser


    The **fuser** command will display the ''user'' of a file system.


    In this example we still have a vi process in background and we use **fuser**
    to find the process id of the process using this file system.


    ```

    [root@RHEL65 ~]# jobs

    [1]+ Stopped             vi /srv/project33/busyfile.txt

    [root@RHEL65 ~]# fuser -m /srv/project33/

    /srv/project33/:        3243

    ```


    Adding the **-u** switch will also display the user name.


    ```

    [root@RHEL65 ~]# fuser -m -u /srv/project33/

    /srv/project33/:        3243 (root)

    ```


    You can quickly kill all processes that are using a specific file (directory)
    with the **-k** switch.


    ```

    [root@RHEL65 ~]# fuser -k -u /srv/project33/

    /srv/project33/:        3243 (root)

    [1]+ Killed             vi /srv/project33/busyfile.txt

    [root@RHEL65 ~]# fuser -m -u /srv/project33/

    [root@RHEL65 ~]#

    ```


    This example shows all processes that are using the current directory (bash and
    vi in this case).


    ```

    root@debian:~/test42# vi file42

    ```


    | [1]+ Stopped             vi file42 |

    | root@debian:~/test42# fuser -v | PID ACCESS COMMAND |

    | /root/test42:          root      2909 ..c. bash |

    |                                     3113 ..c. vi |


    This example shows how the command actually accesses /usr/bin/vi.basic as an executable
    file.


    ```

    root@debian:~/test42# fuser -v $ (which vi)

    ```


    | USER                  PID ACCESS COMMAND |

    | /usr/bin/vi.basic: root      3113 ..e. vi |


    The last example shows how to find the process that is accessing a specific file.


    ```

    [root@RHEL65 ~]# vi /srv/project33/busyfile.txt

