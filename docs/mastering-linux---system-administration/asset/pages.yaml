  md: '# 24.3. bonding on Redhat/Fedora


    We start with ifconfig -a to get a list of all the network cards on our system.


    ```

    [root@rhel6 network-scripts#] ifconfig -a | grep Ethernet

    eth0 Link encap:Ethernet Hwaddr 08:00:27:DA:0D:5C

    eth1 Link encap:Ethernet Hwaddr 08:00:27:DA:C1:49

    eth2 Link encap:Ethernet Hwaddr 08:00:27:40:03:3B

    ```


    In this demo we will decide our bond to eth1 and eth2.


    We will name our bond0 and add this entry to modprobe so the kernel can load the
    bond module when we restart the interface.


    ```

    [root@rhel6 network-scripts#] cat /etc/modprobe.d/bonding.conf

    alias bond0 bond0

    ```


    Then we create /etc/sysconfig/network-scripts/ifcfg-bond0 to configure our bond0
    interface.


    ```

    [root@rhel6 network-scripts#] pwd

    /etc/sysconfig/network-scripts

    [root@rhel6 network-scripts#] cat ifcfg-bond0

    DEVICE=bond0

    IPADDR=192.168.1.199

    NETMASK=255.255.255.0

    ONBOOT=yes

    BOOTPROTO=none

    USERCTL=no

    ```


    Next we create two files, one for each network card that we will use as slave
    in bond0.


    ```

    [root@rhel6 network-scripts#] cat ifcfg-eth1

    DEVICE=eth1

    BOOTPROTO=none

    ONBOOT=yes

    MASTER=bond0

    SLAVE=yes

    USERCTL=no

    [root@rhel6 network-scripts#] cat ifcfg-eth2

    DEVICE=eth2

    BOOTPROTO=none

    ONBOOT=yes

    MASTER=bond0

    SLAVE=yes

    USERCTL=no

    ```


    Finally we bring the interface up with if bond0.


    ```

    [root@rhel6 network-scripts#] if bond0

    [root@rhel6 network-scripts#] ifconfig bond0

    bond0 Link encap:Ethernet Hwaddr 08:00:27:DA:C1:49 Mask:255.255.255.0

    inet addr:192.168.1.199

    inet6 addr: fe80::a00:2ff7:fedac:c149/64 Scope:Link

    UP BROADCAST RUNNING MASTER MULTICAST MTU:1500 Metric:1

    RX packets:251 errors:0 dropped:0 overruns:0 carrier:0

    TX packets:251 errors:0 dropped:0 overruns:0 carrier:0

    collisions:0 txqueuel:0

    RX bytes:39852 (38.9 KiB) TX bytes:10700 (10.4 KiB)

    ```


    The bond should also be visible in /proc/net/bonding.'
