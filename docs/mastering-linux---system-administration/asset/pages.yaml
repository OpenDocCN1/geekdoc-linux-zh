  md: '# # 9.1. about unique objects


    Older versions of Linux have a `vol_id` utility to display the `uuid` of a file
    system.


    ```

    root@debian5:-# vol_id --uuid /dev/sda

    193c9b9-2c40-9290-8b71-4264e4d4c82

    ```


    Red Hat Enterprise Linux 5 puts `vol_id` in `/lib/udev/vol_id`, which is not in
    the $PATH. The syntax is a bit different from Debian/Ubuntu/Mint.


    ```

    root@rhel53 ~ /lib/udev/vol_id -u /dev/sda1

    88a6316-9ca9-4214-b5c6-e7b33a77e860

    ```


    This utility is not available in standard installations of RHEL6 or Debian.


    # # 9.2. tune2fs


    Use `tune2fs` to find the `uuid` of a file system.


    ```

    root@RHEL5]# tune2fs -l /dev/sda | grep UUID

    Filesystem UUID:    11lcf8bc-07c0-4c3f-9f64-78422ef1dd5c

    root@RHEL5]# /lib/udev/vol_id -u /dev/sda

    11lcf8bc-07c0-4c3f-9f64-78422ef1dd5c

    ```


    # # 9.3. uuid


    There is more information in the `uuid`, a tool that can generate uuids.


    ```

    root@rhel65]# yum install uuid

    (output truncated)

    root@rhel65]# man uuid

    ```'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# 9.4. uuid /etc/fstab


    You can use the uuid to make sure a volume is universally uniquely identified
    in /etc/fstab. The device name can change depending on the disk devices that are
    present at boot time, but a uuid never changes.


    First we use tune2fs to find the uuid.


    ```

    [root@RHEL5 ~]# tune2fs -l /dev/sdc1 | grep UUID

    Filesystem UUID: 7626d73a-2bbb6-4937-90ca-e451025d64e8

    ```


    We then check if it is properly added to /etc/fstab, the uuid replaces the variable


    ```

    [root@RHEL5 ~]# grep UUID /etc/fstab

    UUID=7626d73a-2bbb6-4937-90ca-e451025d64e8 /home/pro42 ext3 defaults 0 0

    ```


    Now we can count the volume using the mount point defined in /etc/fstab.


    ```

    [root@RHEL5 ~]# mount /home/pro42

    [root@RHEL5 ~]# df -h | grep 42

    /dev/sdc 397M 11M 366M 3% /home/pro42

    ```


    The real test is, is to remove /dev/sdb from the system, reboot the machine and
    so happens. After the reboot, the disk previously known as /dev/sdc is now as
    /dev/sdb.


    ```

    [root@RHEL5 ~]# tune2fs -l /dev/sdb1 | grep UUID

    Filesystem UUID: 7626d73a-2bbb6-4937-90ca-e451025d64e8

    ```


    And thanks to the uuid in /etc/fstab, the mountpoint is mounted on the same disk
    as before.


    ```

    [root@RHEL5 ~]# df -h | grep sdb

    /dev/sddb 397M 11M 366M 3% /home/pro42

    ```'
  merge: -1
  pgno: 95
- img_proc: true
