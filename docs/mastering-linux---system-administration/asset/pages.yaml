  md: '# 12.5. iSCSI target setup with dd files


    You can use LVM volumes (/dev/md0/lvol0), physical partitions (/dev/sda) raid
    devices (/dev/md0) or just plain files for storage. In this demo, we use files
    created with dd.


    This screenshot shows how to create small files (100MB, 200MB and 300MB).


    ```

    root@ddby6:## mkdir /iscsi

    root@ddby6:## dd if=/dev/zero of=/iscsi/lun1.img bs=1M count=100

    100+ records in

    100+ records out

    104857600 bytes (100 MB) copied, 0.315852 s, 332 MB/s

    root@ddby6:## dd if=/dev/zero of=/iscsi/lun2.img bs=1M count=200

    200+ records in

    200+ records out

    209715200 bytes (200 MB) copied, 1.083422 s, 194 MB/s

    root@ddby6:## dd if=/dev/zero of=/iscsi/lun3.img bs=1M count=300

    300+ records in

    300+ records out

    314572800 bytes (300 MB) copied, 1.362095 s, 231 MB/s

    ```


    We need to declare these files iSCSI targets in /etc/ietd.conf (used to be /etc/ietd.conf).


    ```

    root@ddby6:/etc/ietd# cp ietd.conf.original

    root@ddby6:/etc/ietd# vi ietd.conf

    root@ddby6:/etc/ietd# cat ietd.conf

    Target iqn.2010-02.be.linux-training:storage.lun1

    IncomingUser isuser hunter2

    OutgoingUser

    LUN 0 Path=/iscsi/lun1.img,Type=fileio

    Alias lun1

    Target iqn.2010-02.be.linux-training:storage.lun2

    IncomingUser isuser hunter2

    OutgoingUser

    LUN 0 Path=/iscsi/lun2.img,Type=fileio

    Alias lun2

    Target iqn.2010-02.be.linux-training:storage.lun3

    IncomingUser isuser hunter2

    OutgoingUser

    LUN 0 Path=/iscsi/lun3.img,Type=fileio

    Alias lun3

    ```


    We also need to add our devices to the /etc/initiators.allow file.


    ```

    root@ddby6:/etc/ietd# cp initiators.allow.original

    root@ddby6:/etc/ietd# vi initiators.allow

    root@ddby6:/etc/ietd# cat initiators.allow

    iqn.2010-02.be.linux-training:storage.lun1

    iqn.2010-02.be.linux-training:storage.lun2

    iqn.2010-02.be.linux-training:storage.lun3

    ```'
