- img_proc: true
  md: '# 5.4. about the partition table


    # 5.4.1. master boot record


    The partition table information (primary and extended partitions) is written in
    the master boot record or mbr. You can use dd to copy the mbr to a file.


    This example copies the master boot record from the first SCSI hard disk.


    ```

    dd if=/dev/sda of=/SCSIdisk.mbr bs=512 count=1

    ```


    The same tool can also be used to wipe out all information about partitions on
    a disk. This example zeroes over the whole master boot record.


    ```

    dd if=/dev/zero of=/dev/sda bs=512 count=1

    ```


    Or to wipe out the whole partition or disk.


    ```

    dd if=/dev/zero of=/dev/sda

    ```


    # 5.4.2. partprobe


    Don''t forget after restoring a master boot record with dd, that you need to force
    the kernel to reread the partition table with partprobe. After running partprobe,
    the partitions can be used again.


    ```

    [root@RHEL5 ~]# partprobe

    [root@RHEL5 ~]#

    ```


    # 5.4.3. logical drives


    The partition table does not contain information about logical drives. So the
    dd backup of the mbr only works for primary and extended partitions. To backup
    the partition table including the logical drives, you can use sfdisk.


    This example shows how to backup all partition and logical drive information to
    a file.


    ```

    sfdisk -d /dev/sda > parttable.sda.sfdisk

    ```


    The following example copies the mbr and all logical drive info from /dev/sda
    to /dev/sdb.


    ```

    sfdisk -d /dev/sda | sfdisk /dev/sdb

    ```'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# 5.5. GUID partition table


    gpt was developed because of the limitations of the 1980s mbr partitioning scheme
    (for example only four partitions can be defined, and they have a maximum size
    two terabytes).


    Since 2010 gpt is a part of the uefi specification, but it is also used on bios
    systems.


    Newer versions of fdisk work with gpt, but most production servers today (mid
    2015) still have an older fdisk.. You can have parted instead.


    # 5.6. labeling with parted


    parted is an interactive tool, just like fdisk. Type help in parted for a list
    of commands and options.


    This screenshot shows how to start parted to manage partitions on /dev/sdb.


    ```

    [root@hel71 ~]# parted /dev/sdb

    GNU Parted 3.1

    Using /dev/sdb

    Welcome to GNU Parted! Type ''help'' to view a list of commands.

    (parted)

    ```


    Each command also has built-in help. For example help mklabel will list all supported
    labels. Note that we only discussed mbr(msdos) and gpt in this book.


    ```

    (parted) help mklabel

    mklabel, mktable LABEL-TYPE      create a newlabel (partition table)

    LABEL-TYPE is one of: aix, amiga, bsd, dvh, mac, msdos, gpt, pc98, sun, loop

    (parted)

    ```


    We create an mbr label.


    ```

    (parted) mklabel msdos

    Warning: The existing disk label on /dev/sdb will be destroyed and all data on
    this disk will be lost. Do you want to continue?

    Yes/No? yes

    (parted) mklabel gpt

    Warning: The existing disk label on /dev/sdb will be destroyed and all data on
    this disk will be lost. Do you want to continue?

    Yes/No? Y

    (parted)

    ```'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# 5.6.1. partitioning with parted


    Once labeled it is easy to create partitions with parted. This screenshot starts
