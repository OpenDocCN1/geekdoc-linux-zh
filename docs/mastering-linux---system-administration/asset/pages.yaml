  md: '# 25.12. solution: ssh


    0. Make sure you have access to two Linux computers, or work together with a partner
    for this exercise. For this practice, we will name one of the machines the server.


    1. Install sshd on the server


    ```

    apt-get install openssh-server (on Ubuntu/Debian)

    yum -y install openssh-server (on CentOS/Fedora/Red Hat)

    ```


    2. Verify in the ssh configuration files that only protocol version 2 is allowed.


    ```

    grep Protocol /etc/ssh/ssh* -config

    ```


    3. Use ssh to log on the server, show your current directory and exit the server.


    ```

    userclient$ ssh user@server-ip-address

    user@server$ pwd

    /home/user

    user@server$ exit

    ```


    4. Use scp to copy a file from your computer to the server.


    ```

    scp localfile user@server:-

    ```


    5. Use scp to copy a file from the server to your computer.


    ```

    scp user@server:-/serverfile

    ```


    6. (optional, works only when you have a graphical install of Linux) Install the
    xeyes package on the server and use ssh to run eyes on the server, display it
    on your client.


    ```

    on the server:

    apt-get install xeyes

    on the client:

    ssh -X user@server-ip

    xeyes

    ```


    7. (optional, same as previous) Create a bookmark in firefox, then quit firefox
    on client and server. Use ssh -X to run firefox on your display, but on your neighbour''s
    computer. Do you see your bookmark?


    8. Use ssh-keygen to create a key pair without passphrase. Setup passwordless
    ssh between you and your neighbour. (between your client and your server)


    See solution in book "setting up passwordless ssh"


    9. Verify that the permissions on the server key are correct; world readable for
    the public keys and only root access for the private keys.


    ```

    ls -l /etc/ssh/ssh_host_* *

    ```


    10. Verify that the ssh-agent is running.


    ```

    ps fax | grep ssh-agent

    ```


    11. (optional) Protect your keypair with a passphrase, then add this key to the
    ssh-agent and test your passwordless ssh to the server.'
