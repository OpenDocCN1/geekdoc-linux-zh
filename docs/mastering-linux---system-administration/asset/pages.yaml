  md: '# 5.7. practice: partitions


    +   1. Use fdisk -l to display existing partitions and sizes.


    +   2. Use df -h to display existing partitions and sizes.


    +   3. Compare the output of fdisk and df.


    +   4. Create a 200MB primary partition on a small disk.


    +   5. Create a 400MB primary partition and two 300MB logical drives on a big
    disk.


    +   6. Use df -h and fdisk -l to verify your work.


    +   7. Compare the output again of fdisk and df. Do both commands display the
    new partitions ?


    +   8. Create a backup with dd of the mbr that contains your 200MB primary partition.


    +   9. Take a backup of the partition table containing your 400MB primary and
    300MB logical drives. Make sure the logical drives are in the backup.


    +   10. (optional) Remove all your partitions with fdisk. Then restore your backups.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# 5.8. solution: partitions


    1. Use fdisk -l to display existing partitions and sizes.


    ```

    as root: # fdisk -l

    ```


    2. Use df -h to display existing partitions and sizes.


    ```

    df -h

    ```


    3. Compare the output of fdisk and df.


    Some partitions will be listed in both outputs (maybe /dev/sda or /dev/hda).


    4. Create a 200MB primary partition on a small disk.


    ```

    Choose one of the disks you added (this example uses /dev/sdc).

    root@rhel53 # fdisk /dev/sdc

    ...

    Command (m for help): n

    Command action

    e extended

    p primary partition (1-4)

    P1

    Partition number (1-4): 1

    First cylinder (1-261, default 1): 1

    Last cylinder or size =+size +sizeK (1-261, default 261): +200m

    Command (m for help): w

    The partition table has been altered!

    Calling ioctl() to re-read partition table.

    Syncing disks.

    ```


    5. Create a 400MB primary and two 300MB logical drives on a big disk.


    Choose one of the disks you added (this example uses /dev/sdb).


    ```

    fdisk /dev/sdb

    inside fdisk : n p 1 +400m enter --- n e 2 enter enter --- n 1+300m (twice)

    ```


    6. Use df -h and fdisk -l to verify your work.


    ```

    fdisk -l ; df -h

    ```


    7. Compare the output again of fdisk and df. Both commands display the new partitions
    ?


    The newly created partitions are visible with fdisk.


    But they are not displayed by df.


    8. Create a backup with dd of the mbr that contains your 200MB primary partition.


    ```

    dd if=/dev/sdc of=bootsector.sdc.dd count=1 bs=512

    ```


    9. Take a backup of the partition table containing your 400MB primary and 300MB
    logical drives. Make sure the logical drives are in the backup.


    ```

    sfdisk -d /dev/sdb > parttable.sdb.sfdisk

    ```'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Chapter 6. file systems


    When you are finished partitioning the hard disk, you can put a file system on
    each partition.


    This chapter builds on the partitions from the previous chapter, and prepares
    you for the next one where we will mount the filesystems.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# 6.1. about file systems


    A file system is a way of organizing files on your partition. Besides file-based
    storage, file systems usually include directories and access control, and contain
    meta information about files like access times, modification times and file ownership.


    The properties (length, character set, ...) of filenames are determined by the
    file system you choose. Directories are usually implemented as files, you will
    have to learn how this is implemented! Access control in file systems is tracked
    by user ownership (and group ownership and membership) in combination with one
    or more access control lists.


    # 6.1.1. man fs


    The manual page about file systems is accessed by typing man fs.


    ```

    [root@rhel65 ~]# man fs

    ```


    # 6.1.2. /proc/filesystems


    The Linux kernel will inform you about currently loaded file system drivers in
    /proc/filesystems.


    ```

    root@rhel53 ~# cat /proc/filesystems | grep -v nodev

    ext2

    iso9660

    extext3

    ```


    # 6.1.3. /etc/filesystems


    The /etc/filesystems file contains a list of autodetected filesystems (in case
    the mount command is used without the -t option.


    Help for this file is provided by man mount.


    ```

    [root@rhel65 ~]# man mount

    ```'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# 6.2. common file systems


    # 6.2.1. ext2 and ext3


    Once the most common Linux file systems are the **ext2** (the second extended)
    file system. A disadvantage is that file system checks on ext2 can take a long
    time.


    **ext2** was replaced by **ext3** on most Linux machines. They are essentially
    the same, except for the **journaling** which is only present in ext3.


    Journaling means that changes are first written to a journal on the disk. The
    journal is flushed regularly, writing the changes in the file system. Journaling
    keeps the file system in a consistent state, so you don''t need a file system
    check after an unclean shutdown or power failure.


    # 6.2.2. creating ext2 and ext3


    You can create the file systems with the **/bin/mkfs** or **/bin/mke2fs** commands.
    Use **mke2fs** -j to create an **ext3** file system.


    You can convert an ext2 to ext3 with **tune2fs** -j. You can mount an ext3 file
    system as ext2, but then lose the journaling. Do not forget to run **mkinitrd**
    if you are booting from this device.


    # 6.2.3. ext4


    The newest incarnation of the ext file system is named **ext4** and is available
    in the Linux kernel since 2008. ext4 supports larger files (up to 16 terabyte)
    and larger file systems than **ext3** (and many more features).


    Development started by making **ext3** fully capable for 64-bit. When it turned
    out the changes were significant, the developers decided to name it **ext4**.


    # 6.2.4. xfs


    Redhat Enterprise Linux 7 uses **XFS** as the default file system. This is a highly
    scalable high-performance file system.


    **xfs** was created for Irix and for a couple of years it was also used in **FreeBSD**.
    It is supported by the Linux kernel, but rarely used in dsitrubitions outside
    of the Redhat/CentOS realm.'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# 6.2.5. vfat


    The vfat file system exists in a couple of forms : fat12 for floppy disks, fat16
    on ms-dos, and fat32 for larger disks. The Linux vfat implementation supports
    all of these, but vfat lacks a lot of features like security and links. fat disks
    can be read by every operating system, usb sticks and for digital cameras, to
    exchange data between different OS''s on a home user''s computer.


    # 6.2.6. iso 9660


    iso 9660 is the standard format for cdroms. Chances are you will encounter this
    file system also on your hard disk in the form of images (often with the .iso
    extension). The iso 9660 standard limits filenames to the 8.3 format. The Unix
    wouldn''t like this, and thus added the rock ridge extensions, which allows for
    filenames up to 255 characters and Unix-style-modes, ownership and symbolic links.
    Another extensions to iso 9660 is joliet, which adds 64 unicode characters to
    the filename. The el torito standard extends iso 9660 to be able to boot from
    CD-ROM''s.


    # 6.2.7. udf


    Most optical media today (including cd''s and dvd''s) use udf, the Universal Disk
    Format.


    # 6.2.8. swap


    All things considered, swap is not a file system. But to use a partition as a
    swap partition it must be formatted and mounted as swap space.


    # 6.2.9. gfs


    Linux clusters often use a dedicated cluster filesystem GFS, GFS2, ClusterFS,
    ...


    # 6.2.10. and more...


    You may encounter reiserfs on older Linux systems. Maybe you will see Sun''s zfs
    or the open source btrfs. This last one requires a chapter on itself.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# 6.2.11. /proc/filesystems


    The /proc/filesystems displays a list of supported file systems. When you mount
    a file system without explicitly defining one, then mount will first try to probe
    /etc/filesystems and then probe /proc/filesystems for all the filesystems without
    the nodev label. If /etc/filesystems ends with a line containing only an asterisk
    (*) then both files are probed.


    ```

    paul@RHELv4:-$ cat /proc/filesystems

    nodev sysfs

    nodev rootfs

    nodev bdev

    nodev proc

    nodev sockfs

    nodev binfmt_misc

    nodev usbfs

    nodev udevfs

