  md: "# 17.5. rotating logs\n\nA lot of log files are always growing in size. To\
    \ keep this within bounds, you may want to use logrotate to rotate, compress,\
    \ remove and mail log files. More info on the logrotate command in /etc/logrotate.conf.\
    \ Individual configurations can be found in the /etc/logrotate.d/ directory.\n\
    \nBelow a screenshot of the default Red Hat logrotate.conf file.\n\n```\nroot@rhel65:/etc#\
    \ cat logrotate.conf\n# see \"man logrotate\" for details\n# rotate log files\
    \ weekly\nweekly\n\n# keep 4 weeks worth of backlogs\nrotate 4\n\n# create new\
    \ (empty) log files after rotating old ones\ncreate\n\n# use date as a suffix\
    \ of the rotated file\ndateext\n\n# uncomment this if you want your log files\
    \ compressed\n#compress\n\n# RPM packages drop log rotation information into this\
    \ directory\ninclude /etc/logrotate.d\n\n# no packages own wtmp and btmp -- we'll\
    \ rotate them here\n/var/log/wtmp {\n  monthly\n  create 0664 root utmp\n  minsize\
    \ 1M\n  rotate 1\n}\n\n/var/log/btmp {\n  missingok\n  monthly\n  create 0600\
    \ root utmp\n  rotate 1\n}\n```\n\n# system-specific logs may be also be configured\
    \ here.\nroot@rhel65:/etc#"
