  md: '# 24.1. binding on RedHat/Fedora


    # 24.1.1. binding extra ip addresses


    can be more than one ip address to the same interface, use ifcfg-eth0:0, where
    the last zero can be anything else. Only two directives are required in the files.


    ```

    [root@rhel6 ~]# # cat /etc/sysconfig/network-scripts/ifcfg-eth0:0

    DEVICE="eth0:0"

    IPADDR="192.168.1.133"

    [root@rhel6 ~]# # cat /etc/sysconfig/network-scripts/ifcfg-eth0:1

    DEVICE="eth0:1"

    IPADDR="192.168.1.142"

    ```


    # 24.1.2. enabling extra ip-addresses


    To activate a virtual interface, use ifup, to deactivate it, use ifdown.


    ```

    [root@rhel6 ~]# ifup eth0:0

    [root@rhel6 ~]# ifconfig grep ''inet''

    inet addr:192.168.1.99 Bcast:192.168.1.255 Mask:255.255.255.0

