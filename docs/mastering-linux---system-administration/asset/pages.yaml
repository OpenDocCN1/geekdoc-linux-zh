- img_proc: true
  md: '# 7.5. securing mounts


    File systems can be secured with several mount options. Here are some examples.


    # 7.5.1. ro


    The ro option will mount a file system as read only, preventing anyone from writing.


    ```

    root@rhel53 ~# mount -t ext2 -o ro /dev/hdbl /home/project42

    root@rhel53 ~# touch /home/project42/testwrite

    touch: cannot touch `/home/project42/testwrite`: Read-only file system

    ```


    # 7.5.2. noexec


    The noexec option will prevent the execution of binaries and scripts on the mounted
    file system.


    ```

    root@rhel53 ~# mount -t ext2 -o noexec /dev/hdbl /home/project42

    root@rhel53 ~# cp /home/project42/cat /home/project42

    root@rhel53 ~# /home/project42/cat: Permission denied

    bash: /home/project42/cat: Permission denied

    root@rhel53 ~# echo hello > /home/project42/helloscript

    root@rhel53 ~# chmod x /home/project42/helloscript

    root@rhel53 ~# /home/project42/helloscript

    bash: /home/project42/helloscript: Permission denied

    ```


    # 7.5.3. nosuid


    The nosuid option will ignore setuid bit set binaries on the mounted file system.


    Note that you can still set the setuid on files.


    ```

    root@rhel53 ~# mount -o nosuid /dev/hdbl /home/project42

    root@rhel53 ~# cp /bin/sleep /home/project42/

    root@rhel53 ~# chmod 4555 /home/project42/sleep

    root@rhel53 ~# ls -l /home/project42/sleep

    r-sr-xr-x 1 root 19564 Jun 24 17:57 /home/project42/sleep

    ```


    But users cannot exploit this feature.


    ```

    root@rhel53 ~# su - paul

    [paul@rhel53 ~]$ /home/project42/sleep 500 & &

    [1] 2876

    [paul@rhel53 ~]$ ps -f 2876

    UID PID PPID C STAT TIME CMD

    paul 2876 2853 S 0:00 /home/project42/sleep 500

    [paul@rhel53 ~]$

    ```


    # 7.5.4. noacl


    To prevent cluttering permissions with ''acl'', use the noacl.


    ```

    root@rhel53 ~# mount -o noacl /dev/hdbl /home/project42

    ```


    More mount options can be found in the manual page of mount.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# 7.6. mounting remote file systems


    # 7.6.1. smb/cifs


    The Samba team (samba.org) has a Unix/Linux service that is compatible with the
    SMB/ CIFS protocol. This protocol is mainly used by networked Microsoft Windows
    computers.


    Connecting to a Samba server (or a Microsoft computer) is also done with the mount
    command.


    This example shows how to connect to the 10.0.0.42 server, to a share named data.


    ```

    [root@centos65 ~]# mount -t cifs -o user=paul //10.0.0.42/data2 /home/data2

    Password:

    root@centos65 ~]# mount grep cifs

    //10.0.0.42/data2 /home/data2 type cifs (rw)

    ```


    The above requires yum install cifs-client.


    # 7.6.2. nfs


    Unix servers use nfs (the network file system) to share directories over the network.
    Setting up an nfs server is discovered later. Connecting a client to an nfs server
    is done with mount, and is very similar to connecting to local storage.


    This command shows how to connect to the nfs server server42, which is sharing
    the data mount point at the end of the command (/home/data) must already exist.


    ```

    [root@centos65 ~]# mount -t nfs server42:/srv/data /home/data

    [root@centos65 ~]#

    ```


    If this server2 has ip-address 10.0.0.42 then you can also write:


    ```

    [root@centos65 ~]# mount -t nfs 10.0.0.42:/srv/data /home/data

    [root@centos65 ~]# mount grep data

    10.0.0.42:/srv/data /home/data type nfs (rw,addr=10.0.0.42,clienta\nddr=10.0.0.33)

    ```


    # 7.6.3. nfs specific mount options


    +   bg If mount fails, retry in background.

    fg (default) If mount fails, retry in foreground.

    soft trying to mount after X attempts.

    hard (default)Continue to mount.


    The soft+bg options combined guarantee the fastest boot if there are NFS problems.


    ```

    retrans=X Try X times to connect (over udp).

    tcp Force tcp (default and supported)

    dp Force Force udp (unsupported)

    ```'
