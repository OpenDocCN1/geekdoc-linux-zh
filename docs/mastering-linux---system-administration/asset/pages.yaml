  md: '# 23.1. wireshark


    # 23.1.1. installing wireshark


    This example shows how to install wireshark on .deb based distributions (including
    Debian, Mint, Ubuntu, and others).


    ```

    root@debian:~# apt-get install wireshark

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    (output truncated)

    ```


    On rpm based distributions like CentOS, RHEL and Fedora you can use yum to install
    wireshark.


    ```

    [root@centos7 ~]# yum install wireshark

    Loaded plugins: fastestmirror

    Loading mirror speeds from cached hostfile

    ... (output truncated)

    ```


    # 23.1.2. selecting interface


    When you start wireshark for the first time, you will need to select an interface.
    You will see a dialog box that looks similar to this one.


    ![](img/b73e4add6be31135074237b0a665e1f4_287_0.png)


    It is possible that there are no interfaces available because some distributions
    only allow root to sniff the network. You may need to use sudo wireshark.


    Or you can follow the general advice to sniff using tcpdump or any other tool,
    and save the capture to a file. Any saved capture can be analyzed using wireshark
    at a later time.'
  merge: -1
