  md: '# 15.5. update-rc.d


    # 15.5.1. about update-rc.d


    Debian equivalent of chiffon is called update-rc.d. This tool is designed for
    use in scripts, if you prefer a graphical tool then over bum.


    When there are existing links in /etc/rcX/d then update-rc.d does not anything.
    This is to avoid that post installation scripts using update-rc.d are overwriting
    changes made by a system administrator.


    ```

    root@#- update-rc.d cron remove

    update-rc.d: /etc/init.d/cron exists during rc purge (use -f to force)

    ```


    As you can see in the next screenshot, nothing changed for the cron daemon.


    ```

    root@#- find /etc/rcX.d/ -name *cron* -exec ls -l { \}|cut -b44-

    etc/rc0.d/Kilcron -> ..//init.d/cron

