  md: '# # Chapter 11. logical volume management


    Most lvm implementations support physical storage grouping, logical volume resizing
    and physical storage grouping and data migration.


    Physical storage grouping is a fancy name for grouping multiple block devices
    (hard disks, but also iSCSI etc) into a logical mass storage device. To enlarge
    this physical group, block devices (including partitions) can be added at a later
    time.


    The size of lvm volumes on this physical group is independent of the individual
    size of the components. The total size of the group is the limit.


    One of the nice features of lvm is the logical volume resizing. You can increase
    the size of an lvm volume, sometimes even without any downtime. Additionally,
    you can migrate data away from a failing hard disk device, create mirrors and
    create snapshots.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# 11.1. introduction to lvm


    # 11.1.1. problems with standard partitions


    There are some problems when working with hard disks and standard partitions.
    Consider a system with a small and a large hard disk device, partitioned like
    this. The first disk (/ dev/sda) is partitioned in two, the second disk (/dev/sdb)
    has two partitions and some empty space.


    ![](img/b73e4add6be31135074237b0a665e1f4_108_0.png)


    In the example above, consider the options when you want to enlarge the space
    available for /srv/project42. What can you do? The solution will always force
    you to unmount the file system, remove and recreate partitions, and then restore
    the data and remount the file system.


    # 11.1.2. solution with lvm


    Lvm will create a virtual layer between the mounted file systems and the hardware
    devices. This virtual layer will allow for an administrator to enlarge a file
    system in use. When Lvm is properly used, then there is no need to unmount the
    file system to enlarge it.


    ![](img/b73e4add6be31135074237b0a665e1f4_108_1.png)'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# 11.2. lvm terminology


    # 11.2.1. physical volume (pv)


    A physical volume is any block device (a disk, a partition, a RAID device or even
    an iSCSI device). All these devices can become a member of a volume group.


    The commands used to manage a physical volume start with pv.


    ```

    [root@centos65 ~]# pv

    pvchange pvck pvcreate pvdisplay pvmove pvremove

    vresize pvs vscan

    ```


    # 11.2. volume group (vg)


    A volume group is an abstraction layer between block devices and logical volumes.


    The commands used to manage a volume group start with vg.


    ```

    [root@centos65 ~]# vg

    vgcfbackup vgconvert vgxtend vgmknodes vgs

    vgcfrestore vgcreate vgimport vgreduce vgscan

    vgchange vgdisplay vgimportclone vgremove vgsplit

    vcgck vgxport vgmerge vgrename

    ```


    # 11.2.3. logical volume (lv)


    A logical volume is created in a volume group. Logical volumes that contain a
    file system can be mounted. The use of logical volumes is similar to the use of
    partitions and is accomplished with the same standard commands (mkfs, mount, fsck,
    df, ...).


    The commands used to manage a logical volume start with lv.


    ```

    [root@centos65 ~]# lv

    lvchange lextend lvdiskscan lvresize

    lvconvert lvmdump lvreduce lvs

    lvrecreate llvm lvmetad lvremove lvscan

    lldisplay llvmconf lvmsadc lvrename

    ```'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# 11.3. example: using lvm


    This example shows how you can use a device (in this case /dev/sdc, but it could
    have /dev/sdb or any other disk or partition) with lvm, how to create a volume
    group (vg) and how to create and use a logical volume (vg/lv0).


    First thing to do, create physical volumes that can join the volume group with
    pvcreate. This command makes a disk or partition available for use in Volume Groups.
    The screenshot shows how to present the SCSI Disk device to LVM.


    ```

    root@RHEL4-# pvcreate /dev/sdc

    Physical volume "/dev/sdc" successfully created

    ```


    > Note: Lvm will work fine when using the complete device, but another operating
    system on the same computer (or on the same SAN) will not recognize lvm and will
    mark the block device as being empty! You can avoid this by creating a partition
    that spans the whole device, then run pvcreate on the partition instead of the
    disk.


    Then vgcreate creates a volume group using one device. Note that more devices
    could be added to the volume group.


    ```

    root@RHEL4:-# vgcreate /dev/sdc

    Volume group "vg" successfully created

    ```


    The last step lvcreate creates a logical volume.


    ```

    root@RHEL4:-# lvcreate --size 500m vg

    Logical volume "lv01" created

    ```'
