  md: '# 26.1. nfs protocol versions


    The older nfs versions 2 and 3 are although (udp) by default (but they can use
    tcp). The more recent nfs version 4 brings a stated protocol with better performance
    and stronger security.


    NFS version 4 was defined in rfc 3010 in 2000 and rfc 3530 in 2003 and requires
    tcp (port 2049). It also supports Kerberos authentication as an option when mounting
    a share.

    NFS versions 2 and 3 authenticate only the host.


    # 26.2. rpcinfo


    Clients connect to the server using rpc (on Linux this can be managed by the portmap
    daemon). Look at rpcinfo to find what nfs and its services are running.


    ```

    root@RHEL4u2:-# /etc/init.d/portmap status

