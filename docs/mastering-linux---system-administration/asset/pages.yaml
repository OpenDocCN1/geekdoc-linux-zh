  md: "# introduction to vnc\n\n```\n[root@RHELv4u3 ~]# cat .vnc/xstartup\n!/bin/sh\n\
    \n# Uncomment the following two lines for normal desktop:\n# unset SESSION_MANAGER\n\
    # exec /etc/X11/xinit/xinit\n\n[ -x /etc/vnc/xstartup ] && exec /etc/vnc/xstartup\n\
