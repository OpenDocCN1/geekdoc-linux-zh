  md: '# 17.2. syslogd


    # 17.2.1. about syslog


    The standard method of logging on Linux was through the syslog daemon. Syslog
    was developed by Eric Allman for sendmail, but quickly became a standard among
    many Unix applications and was much later written as rfc 3164. The syslog daemon
    can receive messages on udp port 514 from many applications (appliances), and
    can append to log files, print, display messages on terminals and forward logs
    to other syslog daemons on other machines. The syslog daemon is configured in
    /etc/syslog.conf.


    # 17.2.2. about syslog


    The new method is called reliable and extended syslog and uses the rsyslog daemon
    and the /etc/rsyslog.conf configuration file. The syntax is backwards compatible.


    Each line in the configuration file uses a facility to determine where the message
    is coming from. It also contains a priority for the severity of the message, and
    an action to decide on what to do with the message.


    # 17.2.3. modules


    The new rsyslog has many more features that can be expanded using modules. Modules
    allow for exporting of syslog logging to a database.


    The manuals for more information (when you are done with this chapter).


    ```

    root@rhel65:/etc# man rsyslog.conf

    root@rhel65:/etc# man rsyslogd

    root@rhel65:/etc#

    ```


    ![](img/b73e4add6be31135074237b0a665e1f4_212_0.png)'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 17.2.4. facilities


    The man rsyslog.conf command will explain the different default facilities for
    certain daemons, such as mail, lpr, news and kern(el) messages. The local0 to
    local7 facility can be used for appliances (or any networked device that supports
    syslog). Here is a list of all facilities for sysloglog.conf version 1.3. The
    security keyword is deprecated.


    +   auth (security)

    authpriv

    cron

    daemon

    ftp

    kern

    lpr mail

    mark (internal use only)

    news

    syslog

    user

    uucp

    local0-7


    # 17.2.5. priorities


    The worst severity message can have emerg followed by alert and crit. Lowest priority
    should go to info and debug messages. Specifying a severity will also log all
    messages with a higher severity. You can prefix the severity with = to obtain
    only messages that match that severity. You can also specify .none to prevent
    a specific action from any message from a certain facility.


    Here is a list of all priorities, in ascending order. The keywords warn, error
    and panic are deprecated.


    +   debug

    info

    notice

    warning (warn)

    err (error)

    crit

    alert

    emerg (panic)'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# 17.2.6. actions


    The default action is to send a message to the username listed as action. When
    the action is prefixed with a / then rsyslog will send the message to the file
    (which can be a regular file, but also a printer or terminal). The @ sign prefix
    will send the message on another syslog server. Here is a list of all possible
    actions.


    ```

    root,user      list of users, separated by comma''s

    *             message to all logged on users

    /           (can be a printer, a console, a tty, ...)

    -//          file, but don''t sync after every write

    @             other syslog actions hostname

    ```


    In addition, you can prefix actions with a - to omit syncing the file after every
    logging.


    # 17.2.7. configuration


    Below a sample configuration of custom local4 messages in /etc/rsyslog.conf.


    ```

    local4.crit      /var/log/critandabove

    local4.=crit     /var/log/onlycrit

    local4.*         /var/log/alllocal4

    ```


    # 17.2.8. restarting rsyslog


    Don''t forget to restart the server after changing its configuration.


    ```

    root@rhel65:/etc# service rsyslog restart      [ OK ]

    Shutting down system logger:                          [ OK ]

    Starting system logger:                               [ OK ]

    root@rhel65:/etc#

    ```'
  merge: -1
  pgno: 214
