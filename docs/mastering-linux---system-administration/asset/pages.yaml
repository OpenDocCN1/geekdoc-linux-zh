  md: "# 11.4. example: extend a logical volume\n\nA logical volume can be extended\
    \ without unmounting the file system. Whether or not a volume can be extended\
    \ depends on the file system it uses. Volumes that are mounted as fat or ext2\
    \ cannot be extended, so in this example we use the ext3 file system volume will\
    \ be extended.\n\nThe fdisk command shows us newly added scsi-dis that will serve\
    \ our lvm volume. This volume will be extended. First, take a look at these disks:\n\
    \n```\n[root@RHEL5 ~] # fdisk -l | grep sd [bc]\ndev/sdb doesn't contain a valid\
    \ partition table\ndev/sdc doesn't contain a valid partition table\ndev/sdb: 1181\
    \ MB, 118115904 bytes\ndev/sdc: 429 MB, 429496320 bytes\n```\n\nYou already know\
    \ how to partition a disk, the first disk is partitioned (in one big primary partition),\
    \ the second disk is untouched.\n\n```\n[root@RHEL5 ~] # fdisk -l | grep sd [bc]\n\
    dev/sdc doesn't contain a valid partition table\ndev/sdb: 1181 MB, 118115904 bytes\n\
    dev/sdb: 1 143 1148616 83 Linux\ndev/sdc: 429 MB, 429496320 bytes\n```\n\nYou\
    \ also know how to prepare a disk for lvm with pvcreate, and how to create a volume\
    \ with vgcreate. This example adds both the partitioned disk and the untouched\
    \ disk to the volume group vg2.\n\n```\n[root@RHEL5 ~] # pvcreate /dev/sdb\nPhysical\
    \ volume \"/dev/sdb\" successfully created\n[root@RHEL5 ~] # pvcreate /dev/sdc\n\
    Physical volume \"/dev/sdc\" successfully created\n[root@RHEL5 ~] # vgcreate vg2\
    \ -j /dev/sdb /dev/sdc\nVolume group \"vg2\" successfully created\n```\n\nYou\
    \ can use pvdisplay to verify that the disk and the partition belong to the volume\
    \ group.\n\n```\n[root@RHEL5 ~] # pvsdisplay | grep -B1 vg2\n/dev/sdb\nPV Name\n\
    VG Name\n---\nvg2\nPV Name\n/dev/sdc\nVG Name\nvg2\n```\n\nAnd you are familiar\
    \ with the lvcreate command to create a small logical volume and the mke2fs command\
    \ to put ext3 on it. \n\n```\n[root@RHEL5 ~] # lvcreate --size 200m vg2\nLogical\
    \ volume \"lvol0\" created\n[root@RHEL5 ~] # mke2fs -m20 -j /dev/vg2/lvol0\n---\n\
    ```"
