  md: '# Chapter 20. package management


    Most Linux distributions have a package management system with online repositories
    containing thousands of packages. This makes it very easy to install and remove
    applications, operating system components, documentation and much more.


    We first discuss the Debian package format .deb and its tools dpkg, apt-get and
    aptitude. This should be similar on Debian, Ubuntu, Mint and all derived distributions.


    Then we look at the Red Hat package format .rpm and its tools rpm and yum. This
    should be similar on Red Hat, Fedora, CentOS and all derived distributions.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 20.1. package terminology


    # 20.1.1. repository


    A lot of software and documentation for your Linux distribution is available as
    packages in one or more centrally distributed repositories. These packages in
    such a repository are tested and very easy to install (remove) with a graphical
    or command line installer.


    # 20.1.2.deb packages


    Debian, Ubuntu, Mint and all derivatives from Debian and Ubuntu use .deb packages.
    To manage software on these systems, you can use aptitude or apt-get, both these
    tools are a front end for dpkg.


    # 20.1.3.rpm packages


    Red Hat, Fedora, CentOS, OpenSUSE, Mandriva, Red Flag and others use .rpm packages.
    The tools to manage software packages on these systems are yum and rpm.


    # 20.1.4. dependency


    Some packages need other packages to function. Tools like apt-get, aptitude and
    yum will install all dependencies you need. When using dpkg or rpm, or when building
    from source, you will need to install dependencies yourself.


    # 20.1.5. open source


    These repositories contain a lot of independent open source software. Often the
    source code is customized to integrate better with your distribution. Most distributions
    also offer this modified source code as a package in one or more source repositories.


    You are free to go to the project website itself (samba.org, apache.org, github.com,
    ...) an download the vanilla (= without the custom distribution changes) source
    code.'
  merge: -1
  pgno: 235
