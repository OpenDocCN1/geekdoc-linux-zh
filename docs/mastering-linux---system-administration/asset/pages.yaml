  merge: -1
  pgno: 10
- img_proc: true
  md: '# 1.1. terminology


    # 1.1.1. process


    A **process** is compiled source code that is currently running on the system.


    # 1.1.2. PID


    All processes have a **process id** or **PID**.


    # 1.1.3. PPID


    Every process has a parent process (with a **PPID**). The **child** process is
    often started by the **parent** process.


    # 1.1.4. init


    The **init** process always has ID 1. The **init** process is started by the **kernel**
    itself technically it does not have a parent process. **init** serves as a **foster
    parent** for **orphaned** processes.


    # 1.1.5. kill


    When a process stops running, the process dies, when you want a process to die,
    you **kill**.


    # 1.1.6. daemon


    Processes that start at system startup and keep running forever are called **daemon**
    processes or **daemons**. These **daemons** never die.


    # 1.1.7. zombie


    When a process is killed, but it still shows up on the system, then the process
    is referred to as **zombie**. You cannot kill zombies, because they are already
    dead.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# 1.2. basic process management


    # 1.2.1. $$ and $$PPID


    Some environment variables contain information about processes. The $$ variable
    will hold your current process ID, and $$PPID contains the parent PID. Actually
    $$ is a shell parameter and not a variable, you cannot assign a value to it.


    Below we use echo to display the values of $$ and $$PPID.


    ```

    paul@RHEL4b ~] echo $$ $$PPID

    4224 2223

    ```


    # 1.2.2. pidof


    You can find all process ids by name using the pidof command.


    ```

    root@rhel53 ~# pidof mingetty

    2819 2798 2797 2796 2795 2794

    ```


    # 1.2.3. parent and child


    Processes have a parent-child relationship. Every process has a parent process.


    When starting a new bash you can use echo to verify that the pid from before is
    the ppid of the new shell. The child process from above is now the parent process.


    ```

    paul@RHEL4b ~] bash

    paul@RHEL4b ~] echo $$ $$PPID

    4812 4224

    ```


    Typing exit will end the current process and brings us back to our original values
    for $$ and $$PPID.


    ```

    paul@RHEL4b ~] echo $$ $$PPID

    4812 4224

    paul@RHEL4b ~] exit

    exit

    paul@RHEL4b ~] echo $$ $$PPID

    4224 2223

    paul@RHEL4b ~]$$

    ```'
  merge: -1
  pgno: 12
- img_proc: true
  md: "# 1.2.4. fork and exec\n\nA process starts another process in two phases. First\
    \ the process creates a fork of itself, an identical copy. The forked process\
    \ executes an exec to replace the forked process with the target child process.\n\
    \n```\n[paul@RHEL4b ~]$ echo $$\\n4224\n[paul@RHEL4b ~]$ bash\n[paul@RHEL4b ~]$\
    \ echo $$PPID\n5310 4224\n[paul@RHEL4b ~]$\n```\n\n# 1.2.5. exec\n\nWith the exec\
    \ command, you can execute a process without forking a new process. In the following\
    \ screenshot a Korn shell (ksh) is started and replaced by a bash shell using\
    \ the exec command. The pid of the bash shell is the same as the pid of the Korn\
    \ shell. Exiting the bash shell will get me back to the parent bash, not to the\
    \ Korn shell (which does not exist anymore).\n\n```\n[paul@RHEL4b ~]$ echo $$\\\
    \      # PID of bash\n4224\n[paul@RHEL4b ~]$ ksh             # PID of ksh and\
    \ bash\n$ echo $$PPID                   # PID of ksh and bash\n5343 4224\n$ exec\
    \ bash                     \n[paul@RHEL4b ~]$ echo $$PPID      # PID of bash and\
    \ bash\n5343 4224\n[paul@RHEL4b ~]$ exit\nexit\n[paul@RHEL4b ~]$ echo $$\\n4224\n\
    ```"
  merge: -1
  pgno: 13
- img_proc: true
  md: '# 1.2.6. ps


    One of the most common tools on Linux to look at processes is ps. The following
    screenshot shows the process child relationship between three processes.


    ```

    [paul@RHEL4b ~]$ echo ss $$PPID

    4224 4223

    [paul@RHEL4b ~]$ bash

    [paul@RHEL4b ~]$ echo ss $$PPID

    4866 4224

    [paul@RHEL4b ~]$ bash

    [paul@RHEL4b ~]$ echo ss $$PPID

    4884 4866

    [paul@RHEL4b ~]$ ps fx

    PID TID STAT TIME COMMAND

    4223 pts/0 S 0:01 sshd: paul@pts/0

    4224 pts/0 S 0:00   -bash

    4866 pts/0 S 0:00   -bash

    4884 pts/0 ? 0:00   ps fx

    4902 pts/0 R 0:00

    [paul@RHEL4b ~]$ exit

    [paul@RHEL4b ~]$ ps fx

    PID TID STAT TIME COMMAND

    4223 ? S 0:01 sshd: paul@pts/0

    4224 pts/0 S 0:00   -bash

    4886 pts/0 S 0:00   -bash

    4903 pts/0 R 0:00   ps fx

    [paul@RHEL4b ~]$ exit

    [paul@RHEL4b ~]$ ps fx

    PID TID STAT TIME COMMAND

    4223 ? S 0:01 sshd: paul@pts/0

    4224 pts/0 S 0:00   -bash

    4904 pts/0 R 0:00   ps fx

    [paul@RHEL4b ~]$

    ```


    On Linux, ps fax is is common. On Solaris ps -ef (which also works on Linux).
    Here is a partial output from ps fax


    ```

    [paul@RHEL4a ~]$ ps fax

    PID TID STAT TIME COMMAND

    1 ? S 0:00 init [5]


    3713 ? Ss 0:00 /usr/sbin/sshd

    5042 ? Ss 0:00 sshd: paul [priv]

    5044 ? S 0:00   sshd: paul@pts/1

    5045 pts/1 Ss 0:00   -bash

    5077 pts/1 R+ 0:00   ps fax

    ```'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 1.2.7. pgrep


    Similar to the ps -C, you can also use pgrep to search for a process by its command
    name.


    ```

    paul@RHEL5 ~]$ sleep 1000 &

    [1] 32558

    paul@RHEL5 ~]$ pgrep sleep

    32558

    paul@RHEL5 ~]$ ps -C sleep

    PID TTY TIME CMD

    32558 pts/3 00:00:00 sleep

    ```


    You can also list the command name of the process with pgrep.


    ```

    paul@laika:-$ pgrep -l sleep

    9661 sleep

    ```


    # 1.2.8. top


    Another popular tool on Linux is top. The top tool can order processes according
    to cpu usage or other properties. You can also kill processes from within top.
    Press h inside top for help.


    In case of trouble, top is often the first tool to fire up, since it also provides
    you memory and swap space information.'
