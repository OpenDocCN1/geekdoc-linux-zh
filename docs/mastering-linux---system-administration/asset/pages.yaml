- img_proc: true
  md: '# 20.4. aptitude


    Most people use aptitude for package management on Debian, Mint and Ubuntu systems.


    To synchronize with the repositories.


    ```

    aptitude update

    ```


    To patch and upgrade all software to the latest version on Debian.


    ```

    aptitude upgrade

    ```


    To patch and upgrade all software to the latest version on Ubuntu and Mint.


    ```

    aptitude safe-upgrade

    ```


    To install an application with all dependencies.


    ```

    aptitude install $package

    ```


    To search the repositories for applications that contain a certain string in their
    name or description.


    ```

    aptitude search $string

    ```


    To remove an application.


    ```

    aptitude remove $package

    ```


    To remove an application and all configuration files.


    ```

    aptitude purge $package

    ```'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 20.5. apt


    Both apt-get and aptitude use the same configuration information in /etc/apt/.
    Thus adding a repository for one of them, will automatically add it for both.


    # 20.5.1. /etc/apt/sources.list


    The resource list used by apt-get and aptitude is located in /etc/apt/sources.list.
    This file contains a list of http or ftp sources where packages for the distribution
    can be downloaded.


    This is what list looks like on my Debian server.


    ```

    rootdebian6:~# cat /etc/apt/sources.list

    deb http://ftp.be.debian.org/debian/ squeeze main

    deb-src http://ftp.be.debian.org/debian/ squeeze main


    deb http://security.debian.org/ squeeze/updates main

    deb-src http://security.debian.org/ squeeze/updates main


    # squeeze-updates, previously known as ''volatile''

    deb http://ftp.be.debian.org/debian/ squeeze-updates main

    deb-src http://ftp.be.debian.org/debian/ squeeze-updates main

    ```


    On my Ubuntu there are four times as many online repositories in use.


    ```

    root@ubul204~# wc -l /etc/apt/sources.list

    63 /etc/apt/sources.list

    ```


    There is much more to learn about apt, explore commands like add-apt-repository,
    apt-key and apropos apt.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# # 20.6. rpm


    # ## 20.6.1. about rpm


    **Red Hat package manager** can be used on the command line with **rpm** or in
    a graphical way going to Applications--System Settings--Add/Remove Applications.
    Type **rpm --help** to see some of the options.


    Software distributed in the **rpm** format will be named **foo-version.platform.rpm**.


    # ## 20.6.2. rpm -qa


    To obtain a list of all installed software, use the **rpm -qa** command.


    ```

    [root@RHELv4:~]# rpm -qa grep samba

    system-config-samba-1.2.39-1.el5

    samba-3.0.28-1.el5_2.1

    samba-client-3.0.28-1.el5_2.1

    samba-common-3.0.28-1.el5_2.1

    ```


    # ## 20.6.3. rpm -q


    To verify whether one package is installed, use **rpm -q**.


    ```

    root@RHELv4:~]# rpm -q gcc

    gcc-3.4.6-3

    root@RHELv4:~]# rpm -q laika

    package laika is not installed

    ```


    # ## 20.6.4. rpm -Uvh


    To install or upgrade a package, use the -Uvh switches. The -U switch is the same
    as -i install, that older versions of the software are removed. The -vh switches
    are for nicer output.


    ```

    root@RHELv4:~]# rpm -Uvh gcc-3.4.6-3

    ```'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# 20.6.5. rpm -e


    To remove a package, use the -e switch.


    ```

    root@RHELv44:~# rpm -e gcc-3.4.6-3

    ```


    rpm -e verifies dependencies, and will prevent you from accidentally erasing packages
    that are needed by other packages.


    ```

    [root@RHEL53 -]## rpm -e gcc-4.1.2-42.el5

    error: Failed dependencies:

    gcc = 4.1.2-42.el5 is needed by (installed) gcc-c++-4.1.2-42.el5.i386

    gcc = 4.1.2-42.el5 is needed by (installed) gcc-gfortran-4.1.2-42.el5.i386

    gcc is needed by (installed) systemtap-0.6.2-1.el5_2.2.i386

    ```


    # 20.6.6. rpm/lib/rpm


    The rpm database is located at /var/lib/rpm. This database contains all meta information
    about packages that are installed (via rpm). It keeps track of all files, which
    enables complete removal of software.


    # 20.6.7. rpm2pio


    We can use rpm2pio to convert an rpm to a cpio archive.


    ```

    [root@RHEL53 -]## file kernel.src.rpm

    kernel.src.rpm: RPM V3 src PowerPC kernel-2.6.18-92.13.i386

    [root@RHEL53 -]## rpm2pio file kernel.src.rpm > kernel.pio

    [root@RHEL53 -]## file kernel.pio

    kernel.pio: ASCII cpio archive (SVR4 with no CRC)

    ```


    But why would you want to see list of files in the rpm file?


    Perhaps just to see of list of files in the rpm file.


    ```

    [root@RHEL53 -]## rpm2pio kernel.src.rpm | cpio -t | head -5

    COPYING.modules

    Config.mk

    Module.kabi_i686

    Module.kabi_i686PAE

    Module.kabi_i686xen

    ```


    Or to extract one file from an rpm package.


    ```

    [root@RHEL53 -]## rpm2pio kernel.src.rpm | cpio -iv Config.mk

    Config.mk

    246098 blocks

    ```'
  merge: -1
  pgno: 245
