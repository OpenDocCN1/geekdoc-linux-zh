  md: '# 4.7. hard disk devices


    1. Use dmesg to make a list of hard disk devices detected at boot-up.


    Some possible answers...


    ```

    dmesg | grep -i disk


    Looking for ATA disks: dmesg | grep -i "ata disk"


    Looking for SCSI disks: dmesg | grep -sd[a-f]


