- img_proc: true
  md: '# 17.1. login logging


    To keep track of who is logging into the system, Linux can maintain the /var/log/wtmp,
    /var/log/btmp/var/run/utmp and /var/log/lastlog files.


    # 17.1.1. /var/run/utmp (who)


    Use the who command to see the /var/run/utmp file. This command is showing you
    all the currently logged in users. Notice the that file is in /var/run and not
    in /var/log.


    ```

    [root@rhel4a ~]# who

    paul pts/1    Feb 14 18:21 (192.168.1.45) still logged in (01:15)

    sandra pts/2   Feb 14 18:11 (192.168.1.42)

    inge pts/3    Feb 14 12:01 (192.168.1.33) (00:33)

    els   pts/4    Feb 14 14:33 (192.168.1.19)

    ```


    # 17.1.2. /var/log/wtmp (last)


    The /var/log/wtmp is updated by the login program. Use last to see the /var/run/wtmp
    file.


    ```

    [root@rhel4a ~]# last | head

    paul pts/1    192.168.0.8 Wed Feb 14 18:21 still logged in (01:15)

    reboot system boot 2.6-42.0.8.Els Wed Feb 14 18:21 (01:15)

    nicolas pts/5    pc-dsse.telemetric Wed Feb 14 12:32 - 13:06 (00:33)

    stefan pts/3    pc-dsse.telemetric Wed Feb 14 12:28 - 12:40 (00:12)

    nicolas pts/3    pc-dsse.telemetric Wed Feb 14 11:36 - 12:21 (00:45)

    nicolas pts/3    pc-nae.telemetric Wed Feb 14 11:34 - 11:36 (00:01)

    dirk pts/5    pc-dsse.telemetric Wed Feb 14 10:03 - 12:31 (02:28)

    nicolas pts/3    pc-nae.telemetric Wed Feb 14 09:45 - 11:34 (01:48)

    dimitri pts/5    rhel4 Wed Feb 14 07:57 - 08:38 (00:40)

    stefan pts/4    pc-dsse.telemetric Wed Feb 14 07:16 - down (05:50)

    [root@rhel4a ~]#

    ```


    The last command also be used to get a list of last reboots.


    ```

    [paul@rekkie ~]$ last reboot

    reboot system boot 2.6.16-rekkie Mon Jul 30 05:13 (370:08:42)

    wtmp begins Tue May 30 23:11:45 2006

    [paul@rekkie ~]

    ```'
  merge: -1
