- img_proc: true
  md: '# Red Hat Enterprise Linux


    The Red Hat kernel source is located on the fourth source cdrom. The file is called
    kernel-2.6.9-42.EL.src.rpm (example for RHELv4u4). It is also available online
    at ftp://ftp.redhat.com/pub/redhat/linux/enterprise/5Server/en/os/SRMPS/ (example
    for RHEL5).


    To download the kernel on RHEL, use this wget command (on one line, without the
    trailing \).


    ```

    wget ftp://ftp.redhat.com/pub/redhat/linux/enterprise/5Server/en/os/

    SRMPS/kernel-`uname -r`.src.rpm

    ```


    When the download is finished, install it with a 60M .rpm file.


    ```

    [root@RHEL52 src]# 11

    total 60M

    -drwxr-xr-x 1 root root 60M Dec 5 20:54 kernel-2.6.18-92.1.17.el15.src.rpm

    drwxr-xr-x 5 root root 4.0K Dec 5 19:23 kernels

    drwxr-xr-x 7 root root 4.0K Oct 11 13:22 redhat

    ```


    We need to perform more steps before this can be used as kernel source code.


    First, we use the rpm -i kernel-2.6.9-42.EL.src.rpm command to install this Red
    Hat package.


    ```

    [root@RHEL52 src]# 11

    total 60M

    -drwxr-xr-x 1 root root 60M Dec 5 20:54 kernel-2.6.18-92.1.17.el15.src.rpm

    drwxr-xr-x 5 root root 4.0K Dec 5 19:23 kernels

    drwxr-xr-x 7 root root 4.0K Oct 11 13:22 redhat

    [root@RHEL52 src]# rpm -i kernel-2.6.18-92.1.17.src.rpm

    ```


    Then we move to the SPECS directory and perform an rpmbuild.


    ```

    [root@RHEL52 -]# cd /usr/src/redhat/SPECS

    [root@RHEL52 SPECS]# rpmbuild -bp -vv --target=i686 kernel-2.6.spec

    ```


    The rpmbuild will create the Red Hat kernel source code in /usr/src/redhat/BUILD/

    kernel-version/.


    ```

    [root@RHEL52 kernel-2.6.18]# pwd

    /usr/src/redhat/BUILD/kernel-2.6.18

    [root@RHEL52 kernel-2.6.18]# 11

    total 20M

    drwxr-xr-x 2 root root 4.0K 6 2007 config

    -drwxr-xr-- 1 root root 3.1K Dec 5 20:58 Config.mk

    linux-2.6.18.1686

    drwxr-xr-x 19 root root 4.0K Sep 20 2006 vanilla

    drwxr-xr-x 8 root root 4.0K 6 2007 xen

    ```'
