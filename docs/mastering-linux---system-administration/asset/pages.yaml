  md: '#  23.2. tcpdump


    Sniffing on the command line is done with `tcpdump`. Here are some examples:


    Using the tcpdump host $ip displays all traffic with one host (192.168.1.38 in
    this example).


    ```

    root@ubuntu910:~# tcpdump host 192.168.1.38

    tcpdump: verbose output suppressed, -v or -vv for full protocol decode

    listening on eth0, link-type EN10MB (Ethernet), capture size 96 bytes

    ```


    Capturing only ssh (tcp port 22) traffic can be done with tcpdump tcp port $port.
    Screenshot is cropped for readability in the pdf.


    ```

    root@de8503:~# tcpdump tcp port 22

    tcpdump: verbose output suppressed, -v or -vv for full protocol decode

    listening on eth0, link-type EN10MB (Ethernet), capture size 96 bytes

    14:22:20.716313 > deb03.local:37973 > rhel53.local.ssh: P 666050963:66605

    14:22:20.719936 > deb03.local:37973 : P 1:49(48) ack

    14:22:20.720292 > rhel53.local:37973 : P 49:113(64) ack

    14:22:20.721021 > rhel53.local:37973 : P 113:161(108) ack

    14:22:20.721820 > rhel53.local:37973 : P 161:225(64) ack

    14:22:20.722492 > rhel53.local:37973 > deb03.local:37973 : ack 161:225(64)

    14:22:20.760602 IP deb03.local:37973 > rhel53.local.ssh : ack 225 200

    14:22:23.116806 IP ubuntu910.local:54424 > deb03.local:54424 : P 46725267:46

    14:22:23.116840 IP ubuntu910.local:54424 > ubuntu910.local:54424 : P 1:81(89)
    ack

    14:22:23.116844 deb03.local:54424 > ubuntu910.local.ssh : ack 81 win 2

    ```


    Same as above, but write the output to a file with the `tcpdump -w $filename`
    command.


    ```

    root@ubuntu910:~# tcpdump -w $filename.tcpdump tcp port 22

    tcpdump: listening on eth0, link-type EN10MB (Ethernet), capture size 96 bytes

    *

    ```


    +   - 10 packets captured

    - 10 packets received by filter

    - 0 packets dropped by kernel


    With `tcpdump -r $filename` the file can be displayed.


    ```

    root@ubuntu910:~# tcpdump -r sshdump.tcpdump

    ```


    Many examples can be found in the manual of `tcpdump`.'
