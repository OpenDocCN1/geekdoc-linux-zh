- img_proc: true
  md: '# 20.9. downloading software outside the repository


    First and most important, whenever you download software, start by reading the
    README file!


    Normally the readme will explain what to do after download. You will probably
    receive a .tar.gz or a .tgz file. Read the documentation, then put the compressed
    file in a directory. You can use the finding to find out where the package wants
    to install.


    ```

    tar tvzpf $downloadedFile.tgz

    ```


    You unpack them like with tar xzf, it will create a directory called applicationName-1.2.3


    ```

    tar xzf $applicationName.tgz

    ```


    Replace the z with a j when the file ends in .tar.bz2. The tar, gzip and bzip2
    commands are explained in detail in the Linux Fundamentals course.


    If you download a .deb file, then you''ll have to use dpkg to install it, .rpm''s
    be installed with the rpm command.


