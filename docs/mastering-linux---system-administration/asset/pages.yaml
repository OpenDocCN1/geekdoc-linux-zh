  md: '# 25.1. about ssh


    # 25.1.1. secure shell


    Avoid using telnet, login and rsh to remotely connect to your servers. These older
    protocols do not encrypt the login session, which means your user id and password
    can be be sniffed by tools like wireshark or tcpdump. To securely connect to your
    servers, use ssh.


    The ssh protocol is secure in two ways. Firstly the connection is encrypted and
    secondly the connection is authenticated both ways.


    An ssh connection always starts with a cryptographic handshake, followed by encryption
    of the transport layer using a symmetric cypher. In other words, the tunnel is
    encrypted before you start typing anything.


    Then authentication takes (using user id/password or public/private keys) and
    communication can begin over the encrypted connection.


    The ssh protocol will remember the servers it connected to (and warn you in case
    something suspicious happened).


    The openssh package is maintained by the OpenBSD people and is distributed with
    a lot of operating systems (it may even be the most popular package in the world).


    # 25.1.2. /etc/ssh/


    Configuration of ssh client and server is done in the /etc/ssh directory. In the
    next sections we will discuss most of the files found in /etc/ssh/.


    # 25.1.3. ssh protocol versions


    The ssh protocol has two versions (1 and 2). Avoid using version 1 anywhere, since
    it contains some known vulnerabilities. You can control the protocol via /etc/ssh/ssh_config
    for the client side and /etc/ssh/sshd_config for the openssh-server daemon.


    ```

    paul@ubuntu204:/etc/ssh$ grep Protocol ssh_config

    # Protocol 2,1

    paul@ubuntu204:/etc/ssh$ grep Protocol sshd_config

    Protocol 2

    ```'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# 25.1.4. public and private keys


    The ssh protocol uses the well known system of public and private keys. The below
    explanation is succinct, more information can be found on wikipedia.


    http://en.wikipedia.org/wiki/Public-key_cryptography


    Imagine Alice and Bob, two people that like to communicate with each other. Using
    public and private keys they can communicate with encryption and with authentication.


    When Alice wants to send an encrypted message to Bob, she uses the public key
    of Bob. Bob shares his public key with Alice, but keeps his private key private!
    Since Bob is the only one to have Bob’s private key, Alice is sure that Bob is
    the only one that can read the encrypted message.


    When Bob wants to verify that the message came from Alice, Bob uses the public
    key of Alice to verify that Alice signed the message with her private key. Since
    Alice is the only one to have Alice’s private key, Bob is sure the message came
    from Alice.


    # 25.1.5. rsa and dsa algorithms


    This chapter does not explain the technical implementation of cryptographic algorithms,
    it only explains how to use the ssh tools with rsa and dsa. More information about
    these algorithms can be found here:


    http://en.wikipedia.org/wiki/RSA_(algorithm)

    http://en.wikipedia.org/wiki/Digital_Signature_Algorithm'
  merge: -1
  pgno: 305
