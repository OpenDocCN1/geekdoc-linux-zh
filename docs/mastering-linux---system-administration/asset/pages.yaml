  md: '# 29.7. tracing with strace


    More detailed tracing of all function calls can be done with *strace*. We start
    by creating a read-only file.


    ```

    root@deb503:~# echo hello > 42.txt

    root@deb503:~# chmod 400 42.txt

    root@deb503:~# ls -l 42.txt

    -r--r-- 1 root root 6 2011-09-26 12:03 42.txt

    ```


    We open the file with *vi*, but include the *strace* command with an output file
    for the trace before *vi*. This will create a file with all the function calls
    done by *vi*.


    ```

    root@deb503:~# strace -o trace.txt vi 42.txt

    ```


    The file is read only, but we still change the contents, and use the *:w! directive
    to write to this file. We then close *vi* and take a look at the trace log.


    ```

    root@deb503:~# grep chmod trace.txt = -1 ENOENT (No such file or directory)

    chmod(*42.txt",0100400) = 0

    root@deb503:~# ls -l 42.txt

    -r--------r 1 root root 12 2011-09-26 12:04 42.txt

    ```


    Notice that *vi* changed the permissions on the file twice. The trace log is too
    long to show a complete screenshot in this book.


    ```

    root@deb503:~# wc -l strace.txt

    941 strace.txt

    ```'
