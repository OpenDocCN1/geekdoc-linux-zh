- img_proc: true
  md: '# 5.1. about partitions


    # 5.1.1. primary, extended and logical


    Linux requires you to create one or more partitions. The next paragraphs will
    explain how to create and use partitions.


    A partition''s geometry and size is usually defined by a starting and ending cylinder
    (sometimes by sector). Partitions can be of type primary (maximum four), extended
    (maximum one) or logical (contained within the extended partition). Each partition
    has a field type that contains a code. This determines the computers operating
    system or the partitions file system.


    Table 5.1. primary, extended and logical partitions


    | Partition Type | naming |

    |---|---|

    | Primary (max 4) | 1-4 |

    | Extended (max 1) | 1-4 |

    | Logical | 5- |


    # 5.1.2. partition naming


    We saw before that hard disk devices are named /dev/hdx or /dev/sdx with x depending
    on the hardware configuration. Next is the partition number, starting the count
    at 1. Hence the four (possible) primary partitions are numbered 1 to 4. Logical
    partition counting always starts at 5. Thus /dev/hda2 is the second partition
    on the first ATA hard disk device, and /dev/hdb5 is the first logical partition
    on the second ATA hard disk device. Same for SCSI, /dev/sdb3 is the third partition
    on the second SCSI disk.


    Table 5.2. Partition naming


    | partition | device |

    |---|---|

    | /dev/hda | first primary partition on /dev/hda |

    | /dev/hda2 | second primary or extended partition on /dev/hda |

    | /dev/sda5 | first logical drive on /dev/sda |

    | /dev/sdb6 | second logical on /dev/sdb |


    The picture below shows two (spindle) disks with partitions. Note that an extended
    partition is a container holding logical drives.


    ![](img/b73e4add6be31135074237b0a665e1f4_53_0.png)'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# 5.2. discovering partitions


    # 5.2.1. fdisk -l


    In the **fdisk -l** example below you can see that two partitions exist on **/dev/sdb**.
    The first partition spans 31 cylinders and contains a Linux swap partition. The
    second partition is much bigger.


    ```

    root@laika:~# fdisk -l /dev/sdb

    Disk /dev/sdb: 100.0 GB, 100030242816 bytes

    255 heads, 63 sectors/track, 12161 cylinders

    Units = cylinders of 16065 * 512 = 8225280 bytes


    Device Boot     Start        End  Blocks Id System

    /dev/sdb1             31       248976 82 Linux swap / Solaris

    /dev/sdb2             32    12161 97434225 83 Linux

    root@laika:~#

    ```


    # 5.2.2./proc/partitions


    The **/proc/partitions** file contains a table with major and minor number of
    partitioned devices, their number of blocks and the device name in /dev. Verify
    with **/proc/devices** to link the major number to the proper device.


    ```

    paul@RHELv4:~$ cat /proc/partitions

    major minor #blocks name

    3 0 524288 hda

    3 64 734003 hdb

    8 0 838860 sda

    8 1 104391 sda1

    8 2 828157 sda2

    8 16 1048576 sdb

    8 32 1048576 sdc

    8 48 1048576 sdd

    253 0 7176192 dm-0

    253 1 1048576 dm-1

    ```


    **The major** number corresponds to the device type (or driver) and can be found
    in **/proc/devices**. In this case 3 corresponds to id 8 and 8 to sd. The **major**
    number determines the **device driver** to be used with this device.


    **The minor** number is a unique identification of an instance of this device
    type. The **devices.txt** file in the kernel tree contains a full list of major
    and minor numbers.'
