  md: '# 12.6. iSCSI initiator on ubuntu


    First we install the iSCSI client software (on another computer than the target).


    ```

    root@ubuntu104:~# aptitude install open-iscsi

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    Reading extended state information

    Initializing package states... Done

    The following NEW packages will be installed:

    open-iscsi open-iscsi-utils(a)

    ```


    Then we set the iSCSI client to start automatically.


    ```

    root@ubuntu104:/etc/iscsi# cp iscsidf.conf iscsidconf.original

    root@ubuntu104:/etc/iscsi# vi iscsidf.conf

    root@ubuntu104:/etc/iscsi# grep "node.target iscsidf.conf"

    node.startup = automatic

    ```


    Or you could start it manually.


    ```

    root@ubuntu104:/etc/iscsi/nodes# /etc/init.d/open-iscsi start

    * Starting iSCSI service iscsid [ OK ]

    * Setting up iSCSI targets [ OK ]

    root@ubuntu104:/etc/iscsi/nodes#

    ```


    Now we connect to the Target server and use iscsiad to discover the devices it
    offers:


    ```

    root@ubuntu104:1.31:3260,1 iqn.2010-02.be.linux-training:storage.lun2

    192.168.1.31:3260,1 iqn.2010-02.be.linux-training:storage.lun1

    192.168.1.31:3260,1 iqn.2010-02.be.linux-training:storage.lun3

    ```


    We can use the iscsiad to edit the files in /etc/iscsi/nodes/


    ```

    root@ubuntu104:/etc/iscsi# iscsiad -m node --targetname "iqn.2010-02.be.linux-\nx-training:storage.lun2"
    --portal "192.168.1.31:3260" --op=update --name=no\nde.session.auth.username--value=isuser

    root@ubuntu104:/etc/iscsi# iscsiad -m node --targetname "iqn.2010-02.be.linux-\nx-training:storage.lun1"
    --portal "192.168.1.31:3260" --op=update --name=no\nde.session.auth.username--value=isuser

    root@ubuntu104:/etc/iscsi# iscsiad -m node --targetname "iqn.2010-02.be.linux-\nx-training:storage.lun3"
    --portal "192.168.1.31:3260" --op=update --name=no\nde.session.auth.password--value=hunter2

    ```


    Repeat for the other two devices.'
