- img_proc: true
  md: '# 8.1. lsof


    List open files with lsof.


    When invoked without options, lsof will list all open files. You can see the command
    (init in this case), its PID (1) and the user (root) has opopend the root directory
    and /sbin/init. The FD (file descriptor) columns shows that / both the root directory
    (rtd) and current working directory (cwd) for /sbin/init command. The FD column
    displays rtd for root directory, cwd for current directory and txt for text (including
    data and code).


    ```

    root@db8ea87:~# lsof head -4

    COMMAND PID USER FD TYPE SIZE/OFF NODE NAME

    init 1 root cwd DIR 254,0 4096 2 /

    init 1 root rtd DIR 254,0 4096 2 /

    init 1 root txt REG 254,0 36992 130856 /dev

    ```


    Other options in the FD column include w for writing, are r and u for both reading
    and writing. You can look at open files for a process by using lsof -p PID. For
    this it would look like this:


    ```

    lsof -p 1

    ```


    The screenshot shows how basic use of lsof to prove that it keeps a swap file
    open (when stopped in background) on our freshly mounted file system.


    ```

    [root@RHEL65]# df -h | grep sdb

    /dev/sdb1 541M 17M 497M 4 % /srv/project33

    [1]+ [root@RHEL65]# lsof /srv/*

    vi /srv/project33/busyfile.txt

    [root@RHEL65]# lsof -p USER FD TYPE SIZE/OFF NODE NAME

    vi 3243 root u3 REG 8,1 4096 12 /srv/project33./busyfile.txt.swp

    ```


    Here we see that syslog has a couple of log files open for writing (the FD column).


    ```

    root@db8ea87:~# lsof /var/log/

    COMMAND PID FD TYPE SIZE/OFF NODE NAME

    syslogd 2013 root 1w REG 254,0 45297 1308187 /var/log/syslog

    syslogd 2013 root 2w REG 254,0 419328 1308189 /var/log/kern.log

    syslogd 2013 root 5w REG 254,0 116725 1308020 /var/log/debug

