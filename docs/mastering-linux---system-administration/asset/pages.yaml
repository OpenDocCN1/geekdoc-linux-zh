  md: '# 28.3.3. System.map


    The System.map contains the symbol table and changes with every kernel compile.
    The symbol table is also present in /proc/kallsyms (pre 2.6 kernels name this
    file /proc/ksyms).


    ```

    root@RHELv4:/# head System.map~''uname -r''

    0000000 A __kernel_vsyscall

    0000041a A SYENTER_RETURN_OFFSET

    00000420 A __kernel_sigreturn

    00000440 A __kernel_rt_sigreturn

    00100000 A _text

    00100000 t startup_32

    c00100cf t checkFPType

    c0010014f t is486

    c0010014e t is386

    c0010019f t L

    root@RHELv4:/# head /proc/kallsyms

    00100228 t _stext

    00100228 t calibrate_delay_direct

    00100228 t _stext

    00100337 t calibrate_delay

    c001004db t rest_init

    c00100580 t do_pre_smp_initcalls

    c00100585 t run_init_process

    c001005ae t init

    c00100789 t early_param_test

    c001007ad t early_setup_test

    root@RHELv4:/# boot#

    ```


    # 28.3.4..config


    The last file copied to /boot directory is the kernel configuration used for compilation.
    This file is not necessary in the /boot directory, but it is common practice to
    put a copy there. It allows you to rename a kernel, starting with the same configuration
    as an existing working'
