    \   96.76   0.00\npaul@laika:~$\n```\n\n# 19.8. sade and sar\n\nThe **sade** tool\
    \ writes utilization data to `/var/log/sa/??`, where ?? is replaced by the current\
    \ day of the month. By default, cron runs the **sar** script every 10 minutes,\
    \ the **sar** script runs for one second. Just before midnight runs the **sa2**\
    \ script, which in turn invokes **sar**. These **sar reports** read the daily\
    \ data generated by sade and put it in `/var/log/sa/??` contains a list of statistics.\n\
