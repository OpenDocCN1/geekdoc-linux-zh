- img_proc: true
  md: '```

    paul@RHEL4b ~]$ bash -c ''echo $$ $PPID''

    5059 4224

    paul@RHEL4b ~]$ bash -c `echo $$ $PPID''

    4223: 4224: command not found

    ```


    The current bash shell will replace the $$ and $PPID while scanning the line,
    and before executing the echo command.


    ```

    paul@RHEL4b ~]$ echo $$ $PPID

    4224 4223

    ```


    The variables are now double quoted, but the current bash shell will replace the
    $$ and $PPID while scanning the line, and before executing the bach -c command.


    ```

    paul@RHEL4b ~]$ bash -c "echo $$ $PPID"

    4224 4223

    ```


    The variables are now single quoted. The current bash shell will not replace the
    $$ and the $PPID. The bash -c command will be executed before the variables replaced
    with their value. This latter bash is the one replacing the $$ and $PPID with
    their value.


    ```

    paul@RHEL4b ~]$ bash -c ''echo $$ $PPID''

    5059 4224

    ```


    With backticks the shell will still replace both variable before the embedded
    echo is executed. The result of this echo is the two id''s. These are given as
    commands to bash -c. But two numbers are not commands!


    ```

    paul@RHEL4b ~]$ bash -c `echo $$ $PPID''

    4223: 4224: command not found

    ```'
