    \ isdn\n[root@RHELvau3 ~]#\n```\n\n# 28.4.13. modprobe -r\n\nContrary to rmod,\
    \ modprobe will automatically remove unused modules.\n\n```\n[root@RHELvau3 ~]#\
    \ modprobe isdn\n[root@RHELvau3 ~]# lsmod | grep isdn\nisdn\t\\133537 0\nslhc\t\
    \t72233 1 isdn\n[root@RHELvau3 ~]# modprobe -r isdn\n[root@RHELvau3 ~]# lsmod\
    \ | grep isdn\n[root@RHELvau3 ~]# lsmod | grep slhc\n[root@RHELvau3 ~]#\n```\n\
    \n# 28.4.14. /etc/modprobe.conf\n\nThe /etc/modprobe.conf file and the /etc/modprobe.d\
    \ directory can contain aliases (by humans) and options (for dependent modules)\
    \ for modprobe.\n\n```\n[root@RHEL52 ~]# cat /etc/modprobe.conf\nalias scsi_hostadapter\
    \ mptbase\nalias scsi_hostadapter1 mptspi\nalias scsi_hostadapter2 ata_piix\n\
    alias eth0 pcnet32\nalias eth2 pcnet32\n```"
