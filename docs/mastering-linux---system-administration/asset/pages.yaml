  md: "# 26.3. server configuration\n\nnfs is configured in /etc/exports. You might\
    \ want some way (ldap?) to synchronize userid's across computers when you are\
    \ using nfs a lot.\n\nThe rootsquash option will change UID 0 to the UID of the\
    \ nobody (or similar) user account. The sync option will write reads to disk before\
    \ completing the client request.\n\n# 26.4. /etc/exports\n\nHere is a sample /etc/exports\
    \ to explain the syntax:\n\n```\npaul@laika:~# cat /etc/exports\n* Everyone can\
    \ read this share\n* mnt/data/iso (ro)\n```\n\n```\n# Only the computers pasha\
    \ and barry can readwrite this one\n/var/www/pasha barry(rw)\n```\n\n```\n# same,\
    \ but without root squash for barry\n/var/ftp pasha(rw)(rw,no_root_squash)\n```\n\
    \n```\n# everyone from the netsec.local domain gets access\n/var/backup\n  *.netsec.local(rw)\n\
    ```\n\n```\n# ro for one network, rw for the other\n/var/upload 192.168.1.0/24(ro)\
    \ 192.168.5.0/24(rw)\n```\n\nMore incarnations of nfs require the subtree_check\
    \ option to be explicitly set unset with no_subtree_check. The /etc/exports file\
    \ then looks like this:\n\n```\nroot@debian6 ~# cat /etc/exports\n* Everyone can\
    \ read this share\n/srv/iso *(ro,no_subtree_check)\n```\n\n```\n# Only the computers\
    \ pasha and barry can readwrite this one\n/var/www/pasha(rw,no_subtree_check)\
    \ barry(rw,no_subtree_check)\n```\n\n```\n# same, but without root squash for\
    \ barry\n/var/ftp pasha(rw,no_subtree_check) barry(rw,no_root_squash,no_subtree_check)\n\
    ```\n\n# 26.5. exports\n\nYou don't need to restart the nfs server to start exporting\
    \ your newly created exports. You can use nfs-stab to command this. It will write\
    \ the exported directories to /var/ where they are immediately applied.\n\n```\n\
    root@debian6 ~# exports -va\nexporting pasha:/var/ftp\nexporting barry:/var/ftp\n\
    exporting pasha:/var/www\nexporting barry:/var/www\nexporting *:/iso\n```"
