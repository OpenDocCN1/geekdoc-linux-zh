  md: '# 25.5. setting up passwordless ssh


    To set up passwordless ssh authentication through public/private keys, use ssh-keygen
    to generate a key pair without a passphrase, and then copy your public key to
    the destination server. Let''s do this step by step.


    In the example following, we will set up ssh without password between Alice and
    Bob. Alice has an account on a Red Hat Enterprise Linux, Bob is Ubuntu on his
    laptop. Bob wants to give Alice access using ssh and the private key system. This
    means that if Bob changes his password on his laptop, Alice will still have access.


    # 25.5.1. ssh-keygen


    The example below shows Alice uses ssh-keygen to generate a key pair. Alice does
    not enter a passphrase.


    ```

    alice@RHEL5 ~]$ ssh-keygen -t rsa

    Generating public/private rsa key pair.

    EnterEnter file to save the key (/home/alice/.ssh/id_rsa):

    Created directory ''/home/alice/.ssh''.

    Enter empty passphrase (enter for no passphrase):

    Enter same passphrase again:

    Your identification has been saved in /home/alice/.ssh/id_rsa.

    Your public key has been saved in /home/alice/.ssh/id_rsa.pub.

    The key fingerprint is:

    9bacac56:c9e8:d18c:4a25:72:bb:45:eb alice@RHEL5

    [alice@RHEL5 ~$]

    ```


    You can use ssh-keygen -t dsa in the same way.


    # 25.5.2. ~/ssh


    While ssh-keygen generates a public and a private key, it will also create a hidden
    .ssh directory with proper permissions. If you require it, then you will need
    to chmod 700 ~. If Otherwise ssh will refuse to use the keys (world readable private
    keys are not secure).


    As you can see, the .ssh directory is secure in Alice''s home directory.


    ```

    alice@RHEL5 ~]$ ls -ld .ssh

    drwxr-xr-x 2 alice alice 4096 1 07:38 .ssh

    [alice@RHEL5 ~$]

    ```


    Bob is using Ubuntu at home. He needs to create the .ssh directory, to manually
    secure it.


    ```

    bob@laika:~$ mkdir .ssh

    bob@laika:~$ ls -ld .ssh

    drwxr-xr-x 2 bob bob 4096 2008-05-14 16:53 .ssh/

    bob@laika:~$ chmod 700 .ssh/

    bob@laika:~$

    ```


    # 25.5.3. id_rsa and id_rsa_pub


    The ssh-keygen command generates two keys in .ssh. The public key is named ~/.ssh/id_rsa.pub.
    The private key is named ~/.ssh/id_rsa.'
