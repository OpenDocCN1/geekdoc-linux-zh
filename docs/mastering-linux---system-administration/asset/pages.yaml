- img_proc: true
  md: '# 3.1. background processes


    # 3.1.1. jobs


    Stuff that runs in background of your current shell can be displayed with the
    **jobs** command. By default you will not have any **jobs** running in background.


    ```

    root@rhel53 ~ # jobs

    root@rhel53 ~ #

    ```


    This **jobs** command will be used several times in this section.


    # 3.1.2. control-Z


    Some processes can be **suspended** with the Ctrl-Z key combination. This sends
    a SIGSTOP signal to the **Linux kernel**, effectively freezing the operation of
    the process.


    When doing this in **vi(m)**, then **vi(m)** goes to the background. The background
    **vi(m)** can be seen with the **jobs** command.


    ```

    paul@RHEL4a ~$ vi procdemo.txt

    [5]+ Stopped vim procdemo.txt

    paul@RHEL4a ~$ jobs

    [5]+ Stopped vim procdemo.txt

    ```


    # 3.1.3. & ampersand


    Processes that are running in the background using the && character at the end
    of the command line are also visible with the **jobs** command.


    ```

    paul@RHEL4a ~$ find / > allfiles.txt > /dev/null &\n[6] 5230

    paul@RHEL4a ~$ jobs

    [5]+ Stopped procdemo.txt

    [6]- Running find >allfiles.txt 2>/dev/null &\npaul@RHEL4a ~$

    ```


    # 3.1.4. jobs -p


    An interesting option is **jobs -p** to see the **process id** of background processes.


    ```

    paul@RHEL4b ~$ sleep 500 &\n[1] 4902

    paul@RHEL4b ~$ sleep 400 &\n[2] 4903

    paul@RHEL4b ~$ jobs -p

    4902

    4903

    paul@RHEL4b ~$ ps jobs -p

    ```'
  merge: -1
  pgno: 30
- img_proc: true
  md: '| PID TTY STAT TIME COMMAND |

    | 4902 pts/0 S 00:00 sleep 500 |

    | 4903 pts/0 S 00:00 sleep 400 |


    # ## 3.1.5. fg


    Running the fg command will bring a background job to the foreground. The number
    of the background job to bring forward is the parameter of **fg**.


    ```

    [paul@RHEL5 ~] jobs

    [1] Running sleep 1000 &

    [2]- Running sleep 1000 &

    [3]+ Running sleep 2000 &

    sleep 2000

    ```


    # ## 3.1.6. bg


    Jobs that are *suspended* in background can be started in background with **bg**.
    The **bg** will send a SIGCONT signal.


    Below an example of the sleep command (suspended with **Ctrl-Z**) being reactivated
    in background with **bg**.


    ```

    [paul@RHEL5 ~] jobs

    [paul@RHEL5 ~]$ sleep 5000 &

    [1] 6702

    [paul@RHEL5 ~]$ sleep 3000


    [2]+ Stopped sleep 3000

    [paul@RHEL5 ~] jobs

    [1]- Running sleep 5000 &

    [2]+ Stopped sleep 3000

    [paul@RHEL5 ~]$ bg 2

    [2]+ Stopped sleep 3000 &

    [paul@RHEL5 ~]$ jobs

    [1]- Running sleep 5000 &

    [2]+ Running sleep 3000 &

    [paul@RHEL5 ~]$

    ```'
