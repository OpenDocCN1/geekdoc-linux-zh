  pgno: 225
- img_proc: true
  md: '# 18.5. solution : memory


    +   1. Use **dmesg** to find the total amount of memory in your computer.


    ```

    dmesg | grep Memory

    ```


    +   2. Use **free** to display memory usage in kilobytes (then in megabytes).


    ```

    free -m

    ```


    +   3. On a virtual machine, create a swap partition (you might need an extra
    virtual disk for this).


    ```

    mkswap /dev/sdd1 swapon /dev/sdd1

    ```


    +   4. Add a 20 megabyte swap file to the system.


    ```

    dd if=/dev/zero of=/swapfile20mb bs=1024 count=20000

    mswap /swapfile20mb

    swapon /swapfile20mb

    ```


    +   5. Put all swap spaces in **/etc/fstab** and activate them. Test with a reboot
    that they are mounted.


    ```

    root@computer# tail -2 /etc/fstab

    /dev/sdd1 swap swap defaults 0 0

    /swapfile20mb swap swap defaults 0 0

    ```


    +   6. Use **free** to verify usage of current swap.


    ```

    free -om

    ```


    +   7. (optional) Display the usage of swap with **vmstat** and **free -s** during
    a memory leak.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Chapter 19. resource monitoring


    Monitoring is the process of obtaining information about the utilization of memory,
    cpu, bandwidth and storage. You should start monitoring your system as soon as
    possible, to be able to create a baseline. Make sure that you get to know your
    system! This baseline is important because it allows you to see a steady or sudden
    growth in resource utilization and likewise steady (or sudden) decline in resource
    availability. It will allow you to plan for scaling up or scaling out.


    Let us look at some tools that go beyond ps fax, df -h, free -om and du -sh.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# # 19.1. basic resources


    The basic resources to monitor are:


    +   - cpu

    - network

    - ram memory

    - storage


    # # 19.2. top


    To monitoring, you can use **top**. This tool will monitor ram memory, cpu and
    swap. Top will automatically refresh. Inside **top** you can use many commands,
    like **k** to kill processes, or **t** or **m** to toggle task and memory information,
    or the number **1** to have one line per cpu, or one summary line for all cpu''s.


    ```

    top 12:23:16 up 2 days, 4:01:02 users, load average: 0.00, 0.00, 0.00

    Tasks: 61 total, 1 running, 60 sleeping, 0 stopped, 0 zombie

    Cpu(s): 0.3 us, 0.5 sy, 0.0% ni, 0.2% wa, 0.0% hi, 0.0% si

    Mem: 255972 total, 240962 used, 15020k free, 590264 buffers

    Swap: 542800 total, 144k used, 112356 cached

    PID USER VIRT RES SHR SCPU %UMEM TIME COMMAND

    1 root 16 2816 0 0 S 0.0 0.0 0:00:01 koftirqd/0

    2 root 34 19 0 0 S 0.0 0.0 0:00:01 events/0

    3 root 5 -10 0 0 S 0.0 0.0 0:00:00 khelper

    4 root 5 -10 0 0 S 0.0 0.0 0:00:00 kacpid

    5 root 15 -10 0 0 S 0.0 0.0 0:00:08 kblock/0

    16 root 25 -10 0 0 S 0.0 0.0 0:02:86 pdfflush

    ```


    You can customize top to display the columns of your choice, or display only the
    processes that you find interesting.


    ```

    [paul@RHEL4u3 ~]$ free -om -s 10

    total used free shared buffers cached

    Mem: 249 222 27 0 50 109

    Swap: 511 0 511

    ```


    # # 19.3. free


    The free command on Linux to monitor free memory. You can use free to display
    information every seconds, but the output is not ideal.


    ```

    [paul@RHEL4u3 ~]$ free -om -s 10

    total used free shared buffers cached

    Mem: 249 222 27 0 50 109

    Swap: 511 0 511

    ```


    ```

    [paul@RHEL4u3 ~]$

    ```'
