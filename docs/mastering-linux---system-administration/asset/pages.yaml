- img_proc: true
  md: '# 15.7. runlevels


    # 15.7.1. display the runlevel


    You can see your current runlevel with the runlevel or who -r commands.


    The runlevel command is typical Linux and will output the previous and the current
    runlevel. If there was no previous runlevel, then it will mark it with the letter
    N.


    ```

    [root@RHEL4b ~]# runlevel

    N3

    ```


    The history of who -r dates back to Seventy Unix, it still works on Linux.


    ```

    [root@RHEL4b ~]# who -r

    run-level 3 Jul 28 09:15             last=S

    ```


    # 15.7.2. changing the runlevel


    You can switch another runlevel with the telinit command. On Linux /sbin/telinit
    is usually a (hard) link to /sbin/init.


    This screenshot shows how to switch from runlevel 2 to runlevel 3 without reboot.


    ```

    root@barry:~# runlevel

    N2

    root@barry:~# init 3

    root@barry:~# runlevel

    23

    ```


    # 15.7.3. /sbin/shutdown


    The shutdown command is used to properly shut down a system.


    Common switches used with shutdown are -a, -t, -h and -r.


    The -a switch forces /sbin/shutdown to use /etc/shutdown.allow. The -t switch
    is used to define the number of switches between the sending of the TERM signal
    and the KILL signal. The -h switch halts the system instead of changing to runlevel
    1. The -r switch switches /sbin/shutdown to reboot after shutting down.


    This screenshot shows how to use shutdown with five seconds between TERM and KILL
    signals.


    ```

    root@barry:~# shutdown -t5 -h now

    ```


    The now is the time argument. This can be +m for the number of minutes to wait
    shutting down (with now as an alias for +0. The command will also accept hh:mm
    instead of +m.


    # 15.7.4. halt, reboot and poweroff


    The binary /sbin/reboot is the same as /sbin/halt and /poweroff. Depending on
    the name we use to call the command, it can behave differently.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# init and runlevels


    When in runlevel 0 or **halt**, **reboot** and **poweroff** will tell the kernel
    to **halt**, **reboot** or **poweroff** the system.


    When not in runlevel 0 or 6, typing **reboot** as root actually calls the **shutdown**
    command with the **-r** switch and typing **poweroff** will tell power when halting
    the system.


    # 15.7.5. /var/log/wtmp


    **halt**, **reboot** poweroff write to `/var/log/wtmp`. To look at `/var/log/wtmp`,
    we need to use th last.


    ```

    [@RHEL52 ~]## grep reboot

    reboot system boot  2.6.18-del.el5   Fri May 29 11:44   (192+05:01)

    reboot system boot  2.6.18-del.el5   Wed May 27 12:10   (06:49)

    reboot system boot  2.6.18-del.el5   Mon May 25 19:34   (1+15:59)

    reboot system boot  2.6.18-del.el5   Mon Feb  9 13:20   (106+21:13)

    ```


    # 15.7.6. Ctrl-Alt-Del


    When reinit is finishing all scripts, init will continue to read /etc/inittab.
    The next line is about what when the user hits **Ctrl-Alt-Del** on the keyboard.


    Here is what Debian 4.0 does.


    ```

    root@barry:~# grep -i ctrl /etc/inittab

    # What to do when CTRL-ALT-DEL is pressed.

    ca:12345:ctrlaltdel:/sbin/shutdown -t1 -a now

    ```


    Which is very similar to the default Red Hat Enterprise Linux 5.2 action.


    ```

    [@RHEL52 ~]# grep -i /etc/inittab

    # Trap CTRL-ALT-DELE

    ca:12345:ctrlaltdel:/sbin/shutdown -t3 -r now

    ```


    One notable difference is that Debian forces shutdown to use /etc/shutdown.allow,
    where Red Hat has to invoke everyone **shutdown** Ctrl-Alt-Del.


    # 15.7.7. UPS and log of power


    ```

    [@RHEL52 ~]# grep /p /etc/inittab

    pf:powerfail:/sbin/shutdown -f -h +2 "Power Failure; System Shutting Down"

    ca:12345:powerokwait:/sbin/shutdown -c "Power Restored; Shutdown Cancelled"

    ```


    It will command on what to execute in case of **powerfailure**, **powerok** and
    **Ctrl-Alt-Del**. The init process never stops keeping to execute on power failures
    and triple key combo.


    ```

    root@barry:~# grep ^p /etc/inittab

    pf:powerwait:/etc/init.d/powerfail start

    np:powerfail:/etc/init.d/powerfail now

    po:powerokwait:/etc/init.d/powerfail stop

    ```'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# 15.8. systemd


    It is likely that systemd will replace all the standard init/runlevel/rc functionality.
    Both Red Hat and Debian have decided in 2014 that systemd will be replacing init
    in future releases (RHEL7/CentOS7 and Debian 8).


    The screenshot below shows systemd running as pid 1 on RHEL7.


    ```

    [root@rhel7 ~]# ps fax | grep systemd | cut -cl76

    1 ? Ss 0:01 /usr/lib/systemd/systemd --switched-root --system

    505 ? Ss 0:00 /usr/lib/systemd/systemd-journald

    545 ? Ss 0:00 /usr/lib/systemd/systemd-udev

    670 ? Ss 0:00 /usr/lib/systemd/systemd-logind

    677 ? Ssl 0:01 /bin/dbus-daemon --system --address=systemd; --no

    2662 pts/1 S+ 0:00

    [root@rhel7 ~]# grep --systemd --color=auto systemd

    ```


    Debian 8 (not released in September 2014) uses parts of systemd, but still has
    init as pid 1.


    ```

    root@debian8:~# ps fax | grep systemd

    2042 ? S 0:00 /sbin/cgmanager -m name=systemd

    10127 pts/4 S+ 0:00 \ grep systemd

    2777 ? S 0:00 /lib/systemd/systemd-logind

    root@debian8:~#

    ```'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# 15.8.1. systemd targets


    The first command to learn is systemctl list-units --type=target (or the shorter
    systemctl -t target). It will show you the different targets on the system.


    LOAD = Reflects whether the unit was properly loaded.

    ACTIVE = The high-level unit activation state, i.e. generalization of SUB.

    SUB = The low-level unit activation state, depends on type.


    16 units loaded. Pass --all to see loaded but inactive units, too.

    To show all installed files use ''systemctl list-unit-files''.

    [root@rhel7 ~]


    Targets are the replacement of runlevels and define specific points to reach when
    booting the system. For example the graphical.target is reached when you get a
    graphical interface, and the nfs.target requires an nfs server.


    To switch to a target (for example multi-user.target), we now use systemctl isolate
    (instead of the equivalent init 3 to change the runlevel).


    ```

    [root@rhel7 ~]# ps fax | wc -l

    169

    [root@rhel7 ~]# systemctl isolate multi-user.target

    [root@rhel7 ~]# ps fax | wc -l

    129

    [root@rhel7 ~]

    ```


    To change the default target, we use this systemctl enable multi-user.target by
    editing the /etc/initdab file.


    ```

    [root@rhel7 ~]# systemctl enable multi-user.target --force

    rm ''/etc/systemd/system/default.target''

    ln -s ''/usr/lib/systemd/system/multi-user.target'' ''/etc/systemd/default.target''

    [root@rhel7 ~]#

    ```


    This command removed the /etc/systemd/system/default.target and replaced it with
    a symbolic link to the multi-user.target.'
  merge: -1
  pgno: 191
- img_proc: true
