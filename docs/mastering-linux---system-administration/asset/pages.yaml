- img_proc: true
  md: '# 28.5. compiling a kernel


    # 28.5.1. extraversion


    Enter into /usr/src/redhat/BUILD/kernel-2.6.9/linux-2.6.9/ and change the extraversion

    in the Makefile.


    ```

    [root@RHEL52 linux-2.6.18.i686#] pwd

    /usr/src/redhat/BUILD/kernel-2.6.18/linux-2.6.18.i686

    [root@RHEL52 linux-2.6.18.i686#] vi Makefile

    [root@RHEL52 linux-2.6.18.i686#] head -4 Makefile

    VERSION = 2

    PATCHLEVEL = 18

    SUBLEVEL = 6

    EXTRAVERSION = -paul2008

    ```


    # 28.5.2. make mrproper


    Now clean up the source from any previous installs with make mrproper. If this
    is your first after downloading the source code, then this is not needed.


    ```

    [root@RHEL52 linux-2.6.18.i686#] make mrproper

    CLEAN scripts/basic

    CLEAN scripts/config

    CLEAN include/kernel

    CLEAN .config.old

    ```


    # 28.5.3. .config


    Now copy a working .config from boot to your kernel directory. This file contains
    the configuration that was used for your current working kernel. It determines
    which modules are included in compilation or not.


    ```

    [root@RHEL52 linux-2.6.18.i686#] cp /boot/config-2.6.18-92.1.el15 .config

    ```


    # 28.5.4. make menuconfig


    Now run make menuconfig (or the graphical make xconfig). This tool allows you
    to select whether to compile as a module (m), as part of the kernel (*), or not
    at all (smaller kernel size). If you remove too much, your kernel will not work.
    The configuration will be stored in the .config file.


    ```

    [root@RHEL52 linux-2.6.18.i686#] make menuconfig

    ```


    # 28.5.5. make clean


    Issue a make clean to prepare the kernel for compile. make clean will remove most
    generated files, but keeps your kernel running. Running a make mrproper at this
    point would destroy the .config file you built with make menuconfig.


    ```

    [root@RHEL52 linux-2.6.18.i686#] make clean

    ```'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# 28.5.6. make bzlimage


    And then run make bzlImage, sit back and relax while the kernel compiles. You
    can use time make bzlImage to know how long it takes to compile, so next time
    you can go for a short walk.


    ```

    [root@RHEL52 linux-2.6.18.i686]# time make bz

    HOSTCC scripts/basic/fixdep

    HOSTCC scripts/basic/docproc

    HOSTCC scripts/kconfig/conf.o

    HOSTCC scripts/kconfig/kxgetext.o

    ```


    This command will end with telling you the location of the bImage file (and with
    time info if you also specified the command.


    ```

    Kernel: arch/i386/boot/bzlImage is ready (#1)


    real 13m59.573s

    user 1m22.631s

    sys 11m51.034s

    [root@RHEL52 linux-2.6.18.i686]#

    ```


    You can already copy this image to /boot cp arch/i386/boot/boot/vmlinuz-<kernel-version>.


    # 28.5.7. make modules


    Now run make modules. It can take 20 to 50 minutes to compile all the modules.


    ```

    [root@RHEL52 linux-2.6.18.i686]# time make modules

    CHK include/linux/version.h

    CHK      include/linux/utsrelease.h

    CC [M] arch/i386/kernel/msr.o

    CC [M] arch/i386/kernel/cpuid.o

    CC [M] arch/i386/kernel/microcode.o

    ```


    # 28.5.8. make modules_install


    To compile all the modules to /lib/modules just run make modules_install (takes
    about 20 seconds). Here''s a screenshot from the command.


    ```

    [root@RHEL52 linux-2.6.18.i686]# ls -l /lib/modules/

    total 20

    drwxr-xr-x 6 root root 4096 Oct 15 13:09 2.6.18-92.13.el15

    drwxr-xr-x 6 root root 4096 Nov 11 08:51 2.6.18-92.17.el15

    drwxr-xr-x 6 root root 4096 Dec 6 07:11 2.6.18-92.18.el15

    [root@RHEL52 linux-2.6.18.i686]# make modules_install

    ```


    And here is the same directory after. Notice that make modules_install created
    a new directory for the kernel.


    ```

    [root@RHEL52 linux-2.6.18.i686]# ls -l /lib/modules/

    total 24

    drwxr-xr-x 6 root root 4096 Oct 15 13:09 2.6.18-92.13.el15

    drwxr-xr-x 6 root root 4096 Nov 11 08:51 2.6.18-92.17.el15

    drwxr-xr-x 6 root root 4096 Dec 6 07:11 2.6.18-92.18.el15

    drwxr-xr-x 3 root root 4096 Dec 6 08:50 2.6.18-paul2008

    ```'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# 28.5.9. /boot


    We still need to copy the kernel, the System.map and our configuration file to
    /boot. Strictly speaking the .config file is not obligatory, but it might help
    you in future compilations of the kernel.


    ```

    [root@RHEL52] # pwd

    /usr/src/redhat/BUILD/kernel-2.6.18/linux-2.6.18.i686

    [root@RHEL52] # cp System.map /System.map-2.6.18-paul2008

    [root@RHEL52] # cp /boot/config/config-2.6.18-paul2008

    [root@RHEL52] # cp arch/i386/boot/vmlinux-2.6.18-paul2008

    ```


    # 28.5.10. mkinitrd


    The kernel often needs an initrd file at boot. We can use mkinitrd to generate
    this file. Make sure you use the correct kernel name!


    ```

    [root@RHEL52] # pwd

    /usr/src/redhat/BUILD/kernel-2.6.18/linux-2.6.18.i686

    [root@RHEL52] # mkinitrd /boot/initrd--2.6.18-paul2008 2.6.18-paul2008

    ```


    # 28.5.11. bootloader


    Compilation is now finished, don''t forget to create an additional stanza in grub
    or lilo.'
