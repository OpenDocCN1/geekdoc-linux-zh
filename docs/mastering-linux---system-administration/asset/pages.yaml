    # 11.8.2 pvs


    The easiest way to verify whether devices are known to lvm is with the pvs command.
    The screenshot shows only /dev/sda2 is currently known for LVM. It shows /dev/sda
    is part of VolGroup00 and /dev/sd as part of vg33. The device /dev/sdc is known
    to lvm, but not linked to any Volume Group.


