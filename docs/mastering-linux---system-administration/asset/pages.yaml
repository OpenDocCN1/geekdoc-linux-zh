    # 30.7 dd


    # 30.7.1. About dd


    Some people dd to create backups. This can be very powerful, but dd backups can
    only be restored to very similar partitions or devices. There are however a lot
    of useful things with dd. Some examples.


    # 30.7.2. Create a CDROM image


    The easiest way to create a .ISO file from any CD. The if switch means Input File,
    of is the Output File. Any good tool can burn a copy of the CD with this .ISO
    file.


    ```

    dd if=/dev/cdrom of=/path/to/cdrom.ISO

    ```


    # 30.7.3. Create a floppy image


    A little outdated maybe, but just in case : make an image file from a 1.44MB floppy.
    Blocksize is defined by bs, and count contains the number of blocks to copy.


    ```

    dd if=/dev/floppy/of=/path/to/floppy.img bs=1024 count=1440

    ```


    # 30.7.4. Copy the master boot record


    Use dd to copy the MBR (Master Boot Record) of hard disk /dev/hda to a.file.


    ```

    dd if=/dev/hda of=MBR.img bs=512 count=1

    ```


    # 30.7.5. Copy files


    This example shows how dd can copy files. The copy file summer.txt copy_of_summer.txt.


    ```

    dd if=~/summer.txt of=~/copy_of_summer.txt

    ```'
