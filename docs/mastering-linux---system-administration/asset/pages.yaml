  md: '# 22.6. dhclient


    Home and client Linux desktops often have /sbin/dhclient running. This is a daemon
    that enables a network interface to lease an ip configuration from a dhcp server.
    When your adapter is configured for dhcp or bootp, then /sbin/ifup will start
    the dhclient daemon.


    When a lease is renewed, dhclient will override your ifconfig set ip address!


    # 22.7. hostname


    Every host receives a hostname, often placed in a DNS name space forming the fqdn
    Fully Qualified Domain Name.


    This screenshot shows the hostname command and the configuration of the hostname
    on Red Hat/Fedora.


    ```

    [root@rhel16 ~]# grep HOSTNAME /etc/sysconfig/network

    HOSTNAME=rhel16

    [root@rhel16 ~]# hostname

    rhel16

    ```


    Starting with RHEL7/CentOS7 file is empty. The hostname is configured in the standard
    /etc/hostname file.


    ```

    [root@rhel71 ~]# cat /etc/hostname

    rhel71.linux-training.be

    [root@rhel71 ~]#

    ```


    Ubuntu/Debian uses the /etc/hostname file to configure the hostname.


    ```

    paul@debian8:-$ cat /etc/hostname

    server42

    paul@debian8:-$ hostname

    server42

    ```


    On all Linux you can change the hostname using the hostname $newname command.
    This is not a permanent change.


    ```

    [root@rhel16 ~]# hostname server42

    [root@rhel16 ~]# hostname

    server42

    ```


    On any Linux you can use sysctl to display and set the hostname.


    ```

    [root@rhel16 ~]# sysctl kernel.hostname

    kernel.hostname = server42

    [root@rhel16 ~]# sysctl kernel.hostname=rhel16

    kernel.hostname = rhel16

    [root@rhel16 ~]# sysctl kernel.hostname

    kernel.hostname = rhel16

    [root@rhel16 ~]# hostname

    rhel16

    ```'
