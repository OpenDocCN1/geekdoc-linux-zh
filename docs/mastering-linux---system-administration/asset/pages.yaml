  md: '# # 28.1. about the Linux kernel


    # ## 28.1.1. kernel versions


    In 1991 Linux Torvalds wrote (the first version of) the Linux kernel. He put it
    online, and other people started contributing code. Over 4000 individuals contributed
    source code to the latest kernel version (version 2.6.27 in November 2008).


    Major Linux kernel versions used to come in even and odd numbers. Versions **2.0,
    2.2, 2.4** and **2.6** are considered stable kernel versions. Whereas **2.1, 2.3**
    and **2.5** were unstable (read development) versions. Since the release of 2.6.0
    in January 2004, all development has been done in the 2.6 tree. There is currently
    no v2.7.x and according to Linus the even/stable odd/development scheme is abandoned
    forever.


    # ## 28.1.2. uname -r


    To see your current Linux kernel version, issue the **uname -r** command as shown
    below.


    This first example shows Linux major version **2.6** and minor version **24**.
    The rest **-22-generic** is specific to the distribution (Ubuntu in this case).


    ```

    paul@laika~$ uname -r

    2.6.24-22-generic

    ```


    The **same** command on Red Hat Enterprise Linux shows an older kernel (2.6.18)
    with **-92.1.17.el5** being specific to the distribution.


    ```

    paul@RHEL52~$ uname -r

    2.6.18-92.11.17.el5

    ```


    # ## 28.1.3. /proc/cmdline


    The parameters that were passed to the kernel at boot time are in **/proc/cmdline**.


    ```

    paul@RHELv44~$ cat /proc/cmdline

    ro=/dev/VolGroup00/LogVol00 rhgb quiet

    ```'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# 28.1.4. single user mode


    When booting with the kernel source, it starts in single user mode. Linux can
    start in a bash shell with the root user logged on (without password).


    Some distributions prevent use of this feature (at kernel compile).


    # 28.1.5. init=/bin/bash


    Normally the kernel invokes init as the first daemon process. Adding init=/bin/bash
    to the kernel parameters will instead invoke bash (again with root logged on without
    providing a password).


    # 28.1.6. /var/log/messages


    The kernel reports to syslog writes a log of kernel actions in /var/log/messages.
    Looking at this file reveals when the kernel was started, including all the devices
    that were detected at boot time.


    ```

