  md: "# ## 28.6. compiling one module\n\n# ### 28.6.1. hello.c\n\nA little C program\
    \ that will be our module.\n\n```\n[root@hel6a kernel_module]# cat hello.c\n#include\
    \ <linux/module.h>\n#include <section>\nnint init_module(void)\n{\n    printk(KERN_INFO\
    \ \"Start Hello World...\\n\");\n    return 0;\n}\n\nvoid cleanup_module(void)\n\
    {\n    printk(KERN_INFO \"End Hello World... \\n\");\n}\n```\n\n# ### 28.6.2.\
