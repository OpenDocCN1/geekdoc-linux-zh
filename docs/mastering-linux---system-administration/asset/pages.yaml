- img_proc: true
  md: '# ## 12.3. iSCSI Initiator in RHEL/CentOS


    This section will describe iSCSI Initiator setup on RHEL6, RHEL7 and CentOS.


    Start with installing the iSCSI Initiator package.


    ```

    [root@server2 ~]# yum install iscsi-initiator-utils

    ```


    Then the iSCSI target server will send you the target names.


    ```

    [root@server2 ~]# iscsiadm -m discovery -t sendtargets -p 192.168.1.95:3260

    Starting iscsid:

    192.168.1.95:3260,1 iqn.2014-04.be.linux-training:centos65.target1 [ OK ]

    ```


    We received iqn.2014-04.be.linux-training:centos65.target1.


    We use this info to configure the username and password (paul and hunter2) that
    we set on the target server.


    ```

    [root@server2 iscs]# iscsiadm -m node --targetname iqn.2014-04.be.linux-tra\ncento65.target1
    --portal "192.168.1.95:3260" --op-update --name node.\nsession.auth.username --value=paul

    [root@server2 iscs]# iscsiadm -m node --targetname iqn.2014-04.be.linux-tra\ncento65.target1
    --portal "192.168.1.95:3260" --op-update --name node.\nsession.auth.password --value=hunter2

    [root@server2 iscs]# iscsiadm -m node --targetname iqn.2014-04.be.linux-tra\ncento65.target1
    --portal "192.168.1.95:3260" --op-update --name node.\nsession.auth.method --value=CHAP

    ```


    RHEL and CentOS will store these in /var/lib/iscsi/nodes/


    ```

    [root@server2 iscs]# grep auth /var/lib/iscsi/nodes/iqn.2014-04.be.linux-tr\aning\cento65.target1/192.168.1.95\,3260\/1
    default

    ode.session.auth.method = CHAP

    .session.auth.username = paul

    node.session.auth.password = hunter2

    node.conn[0].timeo.auth.timeout = 45

    [root@server2 iscs]#

    ```'
  merge: -1
