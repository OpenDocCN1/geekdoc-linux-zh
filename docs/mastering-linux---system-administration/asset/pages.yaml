  md: '# 11.11.4. pvchange


    With pvchange you can prevent the allocation of a Physical Volume in a new Volume
    Group or Logical Volume. This can be useful if you plan to remove a Physical Volume.


    ```

    [root@RHEL5 ~]#$ pvchange -xn /dev/ssd

    Physical volume "/dev/ssd" changed

    1 physical volume changed / 0 physical volumes not changed

    [root@RHEL5 ~]#

    ```


    To revert your previous decision, this example shows how you te re-enable the
    Physical Volume to allow allocation.


    ```

    [root@RHEL5 ~]# pvchange -xy /dev/ssd

    Physical volume "/dev/ssd" changed

    1 physical volume changed / 0 physical volumes not changed

    [root@RHEL5 ~]#

    ```


    # 11.11.5. pvmove


    With pvmove you can move Logical Volumes from within a Volume Group to another
    Physical Volume. This must be done before removing a Physical Volume.


    ```

    [root@RHEL5 ~]# pvs | grep vgl

    /dev/sdf vgl lvm2 a- 816.00M 0

    /dev/adg vgl lvm2 a- 816.00M 816.00M

    [root@RHEL5 ~]# pvmove /dev/sdf

    /dev/sdf: Moved: 70.1%

    /dev/sdf: Moved: 100.0%

    [root@RHEL5 ~]# pvs | grep vgl

    /dev/sdf vgl lvm2 a- 816.00M 816.00M

    /dev/adg vgl lvm2 a- 816.00M 0

    ```'
