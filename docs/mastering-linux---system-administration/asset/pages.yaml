  md: '# 2.3.1.5. sniffing ping and dns


    Using the same capture as before, but now with a different filter. We want to
    see both dns and icmp traffic, so we enter both in the filter field.


    We put dns or icmp in the filter to achieve this. Putting dns and icmp would render
    nothing because there is no packet that matches both protocols.


    | Filter: icmp or dns | Expression... | Clear | Apply | Save |

    |---|---|---|---|---||

    | No. | Source | Destination | Protocol | |

    | 25 | 10.14.33.30 | 10.14.33.30 | DNS | Standard query 0xa668 nsl.paul.local
    |

    | 26 | 10.14.33.30 | 10.14.33.30 | DNS | Standard query response 0xa668 A 10 |

    | 31 | 10.14.33.30 | 10.14.33.30 | ICMP | Echo (ping) request id=0x9f6, seq=1/2
    |

    | 32 | 10.14.33.30 | 10.14.33.30 | ICMP | Echo (ping) reply id=0x9f6, seq=1/2
    |


    In the screenshot above we see that packets 25 and 26 are both 10.14.33.30 as
    source and destination ip address. Because that is the same computer as the dns
    server.


    The same is true for packets 31 and 32, since the machine is actively sniffing.


    # 2.3.1.6. specific ip address


    This is a screenshot for dns packets that contain a certain ip address. The filter
    we use is ipaddr=10.14.33.30 and dns. To match both conditions.


    | Filter: ipaddr=10.14.33.30 and dns | Expression... | Clear | Apply | Save |

    |---|---|---|---|---||

    | No. | Source | Destination | Protocol | |

    | 93 | 10.14.33.30 | 10.14.33.30 | DNS | Standard query 0xa34a A linux-training.be
    |

    | 98 | 10.14.33.30 | 10.14.33.30 | DNS | Standard query response 0xa34a A 188.93.155.87
    |


    Packet 93 is the dns query for A record of linux-training.be. Packet 98 is the
    response from the dns server. What do you think is hidden in the packets between
    93 and 98 ? Try to answer this by reading on (if it helps) try to predict what
    you will see, and then checking your prediction.


    # 2.3.1.7. filtering by frame


    The correct term for a packet as sniffing is a frame (because we sniff on layer
    2). To display packets with certain numbers, we use frame.number in the filter.


