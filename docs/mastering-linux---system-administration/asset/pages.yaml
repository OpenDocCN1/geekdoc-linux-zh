- img_proc: true
  md: '# 20.3. apt-get


    Debian has been using apt-get to manage packages since 1998. Today Debian and
    many Debian-based distributions still actively support apt-get, though some experts
    claim aptitude is better at handling dependencies than apt-get.


    Both commands use the same configuration files and can be used alternately; whenever
    you see apt-get in documentation, free to type aptitude.


    We will start with apt-get and discuss aptitude in the next section.


    # 20.3.1. apt-get update


    When typing apt-get update you are downloading the names, versions and short description
    of all packages available on all configured repositories for your system.


    In the example below you can see some repositories at the url be.archive.ubuntu.com
    because this computer was built in Belgium. This url can differ for you.


    ```

    root@ubuntu204:~# apt-get update

    gn http://be.archive.ubuntu.com precise InRelease

    gn http://extras.ubuntu.com precise InRelease

    gn http://security.ubuntu.com precise-security InRelease

    gn http://be.archive.canonical.com precise InRelease

    gn http://be.archive.ubuntu.com precise-updates InRelease

    ...\nHit http://be.archive.ubuntu.com precise-backports/main Translation-en

    Hit http://be.archive.ubuntu.com precise-backports/multiverse Translation-en

    Hit http://be.archive.ubuntu.com precise-backports/restricted Translation-en

    Hit http://be.archive.ubuntu.com precise-backports/universe Translation-en

    Fetched 13.7 MB in 8s (1682 KB/s)

    Reading package lists... Done

    root@#

    ```


    Run apt-get update every time before performing other operations.


    # 20.3.2. apt-get upgrade


    One of the nicest features of apt-get is that it allows for a secure update of
    all software currently installed on your computer with just one command.


    ```

    root@debian61:~# apt-get upgrade

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.

    root@debian61:~#

    ```


    The above screenshot shows that all software is updated to the latest version
    available for your distribution.


    # 20.3.3. apt-get clean


    apt-get keeps a copy of downloaded packages in /var/cache/apt/archives, as can
    be seen in this screenshot.'
