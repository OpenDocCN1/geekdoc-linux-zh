  md: "# 27.4. xinetd inetd\n\n# 27.4.1. the superdaemon\n\nBack resources when RAM\
    \ memory were limited, a super-server was devised to listen to all sockets and\
    \ start the appropriate daemon only when needed. Services like swat, telnet and\
    \ ftp are typically served by such a super-server. The xinetd superdaemon is more\
    \ recent than inetd. We will discuss the configuration both daemons.\n\nRecent\
    \ Linux distributions like RHEL5 and Ubuntu 10.04 do not activate inetd or xinetd\
    \ by default, unless an application requires it.\n\n# 27.4.2. inetd or xinetd\n\
    \nFirst verify your computer is running inetd or xinetd. The Debian 4.0 Etch is\
    \ running inetd.\n\n```\n```\nroot@barry#:# ps fax | grep inetd\n3870 ?      Ss\
    \     0:00 /usr/sbin/inetd\n```\n```\n\nThis Red Hat Enterprise Linux 4 is running\
    \ xinetd.\n\n```\n```\nroot@RHEL4b ~)# ps fax | grep inetd\n3003 ?      0:00 xinetd-stayalive\
    \ -pidfile /var/run/xinetd.pid\n```\n```\n\nBoth daemons have the same functionality\
    \ (listening to many ports, starting daemons when they are needed), but they have\
    \ different configuration files.\n\n# 27.4.3. xinetd superdaemon\n\nThe xinetd\
    \ daemon is often called a superdaemon because it listens to a lot of incoming\
    \ connections, and starts other daemons when they are needed. When a connection\
    \ is received, xinetd will first check TCP wrappers (/etc/hosts.allow and /etc/hosts.deny)\
    \ and then give the configuration to the other daemon. This superdaemon is configured\
    \ through /etc/xinetd.conf and the files in the directory /etc/xinetd.d. Let's\
    \ take a look at /etc/xinetd.conf.\n\n```\n```\npaul@RHELv42$: cat /etc/xinetd.conf\n\
    #\n# Simple configuration file for xinetd\n#\n# Some defaults, and include /etc/xinetd.d/\n\
    defaults\n{\n  instances = 60\n  log_type = SYSLOG authpriv\n  log_on_success\
    \ = HOST PID\n  log_on_failure = HOST\n  cps = 25 30\n}\n```\n```"
  merge: -1
  pgno: 324
- img_proc: true
  md: "# introduction to networking\n\n)\nincludir /etc/xinetd\n\n```\npaul@RHELv42:~\
    \ $\n```\n\nAccording to the settings in this file, xinetd can handle 60 client\
    \ requests at once. It uses the authpriv facility to log the host ip-address and\
    \ pid of successful daemon spawns. When a service (aka protocol linked to daemon)\
    \ gets more than 25 cps (connections per second), it holds subsequent requests\
    \ for 30 seconds.\n\nThe directory /etc/xinetd.conf contains more configuration\
    \ files. Let's also take a look at one of them.\n\n```\npaul@RHELv42:~$ ls /etc/xinetd.\n\
    amanda    charge-up echo klogin   rexec talk\namandaixd lcps-ld  echo-udp kb5-telnet\
    \ rlogin telnet\namdxtape  daytime      echo kshell rsh tftp\nauth      daytime-udp\
    \ finger taalk  rsync tftp\ncharge    dskdd-kob ggsftp ntalk swat time-udp\npaul@RHELv42:~$\
    \ cat /etc/xinetd/swat\n# default: off\n# description: SWAT is the Samba Web Tool.\
    \ Use swat \\\n# configure your samba server. To use SWAT \\\n# connect to port\
    \ 901 with your favorite web browser.\nservice swat\n{\n port = 901\nsocket_type\
    \ = stream\nwait       = no\nonly_from = 127.0.0.1\nuser       = root\nserver\
    \     = /usr/sbin/swat\nlog_on_failure += USERID\ndisable    = yes\n}\npaul@RHELv42:~\
    \ $\n```\n\nThe services should be listed in the /etc/services file. Port determines\
    \ the service port, and must be the same as the port specified in /etc/services.\
    \ The log_type should be set to stream for tcp (and to dgram for udp). The log_on_failure\
    \ += concats the log message formatted in /etc/xinetd.conf. The last disabling\
    \ can be set to or no. Setting this means the service is enabled!\n\nCheck xinetd\
    \ and xinetd.conf manual pages for many more configuration options.\n\n# 27.4.4.\
    \ xinetd superdaemon\n\nThis superdaemon has only one configuration file /etc/xinetd.conf.\
    \ Every protocol or daemon that it is listening for gets one line in this file:\n\
    \n```\nroot@barry:~# grep ftp /etc/xinetd.conf\ntftpd dgram udp nobody /usr/sbin/tcp\
    \ /usr/sbin/in.tftpd /boot/tftp\nroot@barry:~#\n```"
