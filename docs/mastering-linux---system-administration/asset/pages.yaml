  md: "# 12.8. iSCSI Target RHEL7/CentOS7\n\nThe preferred tool to setup an iSCSI\
    \ Target on RHEL is targetcli.\n\n```\n[root@centos7 ~]# yum install targetcli\n\
    Loaded plugins: fastestmirror\n\nInstalled:\ntargetcli.noarch 0:2.1.fb37-3.el7\n\
    \nComplete!\n[root@centos7 ~]#\n```\n\nThe targetcli tool is interactive and represents\
    \ the configuration for the target in a structure that resembles a directory tree\
    \ with several nodes. Although this is explore with ls, cd and pwd, files are\
    \ not on the file system.\n\nThis tool also has tab-completion, which is very\
    \ handy for the iqn names.\n\n```\n[root@centos7 ~]# targetcli\ntargetcli shell\
    \ version 2.1.fb37\nCopyright 2011-2013 by Datera, and others.\nFor help on commands,\
    \ type 'help'\n\n/ cd backstores/\n/backstores ls\n[...\n- backstores [Storage\
    \ Objects: 0]\n  - block [Storage Objects: 0]\n  - fileio [Storage Objects: 0]\n\
    \  - pcsi [Storage Objects: 0]\n  - ramdisk [Storage Objects: 0]\n/backstores/\
    \ cd block\n/backstores/ls\n- block [Storage Objects: 0]\n/backstores/block create\
    \ serverl.diski /dev/sdb\nCreated storage object serverl.diski using /dev/sdb.\n\
    /backstores/ ls\n- block [Storage Objects: 1]\n  - serverl.diski /dev/sdb (2.0GiB)\
    \ write-through deactivated\n/backstores/ cd iscsil\n/iscsil/ create iqn.2015-04.be.linux:iscsil\n\
    /iscsil/iqn/iqn.2015-04.be.linux:iscsil/tgpl/acls\n/iscsil/iqn/iqn.2015-04.be.linux:iscsil/tgpl/acls/\
    \ create iqn.2015-04.be.linux:server2\nCreated Node ACL for iqn.2015-04.be.linux:server2\n\
    /iscsil/iqn/iqn.2015-04.be.linux:iscsil/tgpl/server2/ create iqn.2015-04.be.linux:server2\n\
    /iscsil/iqn/iqn.2015-04.be.linux:iscsil/tgpl/server2/ set userpassword paul\n\
