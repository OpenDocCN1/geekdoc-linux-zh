  md: '# # Chapter 4. disk devices


    This chapter teaches you how to locate and recognise hard disk devices. This prepares
    you for the next chapter, where we put partitions on these devices.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 4.1. terminology


    # 4.1.1. platter, head, track, cylinder, sector


    Data is commonly stored on magnetic or optical disk platters. The platters are
    rotated (at high speeds). Data is read by heads, which are very close to the surface
    of the platter, without touching it! The heads are mounted on an arm (sometimes
    a comb or a fork).


    Data is written in concentric circles tracks. Track zero is (usually) on the outside.
    The time it takes to position the head over a certain track is called the seek
    time. Often the platters are stacked on top of each other, however the set of
    tracks accessible at a certain position of the comb forms a cylinder. Tracks are
    divided into 512 sectors, with more unused space (gap) between the sectors on
    the outside of the platter.


    When you break the advertised access time of a hard drive, you will notice that
    of that time is taken by movement of the heads (about 65%) and rotational latency
    (about 30%).


    # 4.1.2. ide or scsi


    Actually, the title should be ata or scsi, since ide is an ata compatible device.
    Most desktops use ata devices, most servers use scsi.


    # 4.1.3. ata


    An ata controller allows two devices per bus, one master and one slave. Unless
    your controller and devices support cable select, you have to set this manually
    with jumpers.


    With the introduction of sata, the original ata was renamed to parallel ata. Optical
    drives often use atapi, the is an ATA ATA interface using the SCSI communication
    protocol.


    # 4.1.4. scsi


    A scsi controller allows more than two devices. When using SCSI (small computer
    system interface), each device has a unique scsi id. The scsi controller also
    needs a scsi id, do not use this for a scsi-attached device.


    Older-8bit SCSI is now called narrow, whereas 16-bit is wide. When the bus speeds
    are doubled to 10Mhz, this was known as fast SCSI. Doubling to 20Mhz made it ultra
    SCSI. Take a look at http://en.wikipedia.org/wiki/SCSI for more SCSI standards.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# 4.1.5. block device


    Random access hard disk devices have an abstraction layer called block device
    to enable formatting in fixed-size (usually 512 bytes) blocks. Blocks can be accessed
    independent of access to other blocks.


    A block device has the letter b to denote the file type in the output of ls -


    ```

    [root@centos65 ~]# ls -dev/sda

    brw-rw---- 1 root disk 8, 0 Apr 19 10:12 /dev/sda

    brw-rw---- 1 root disk 8, 1 Apr 19 10:12 /dev/sda1

    brw-rw---- 1 root disk 8, 2 Apr 19 10:12 /dev/sda2

    brw-rw---- 1 root disk 8, 16 Apr 19 10:12 /dev/sdb

    brw-rw---- 1 root disk 8, 32 Apr 19 10:12 /dev/sdc

    ```


    Note that a character device is a constant stream of characters, denoted by a
    c in ls - I. Note also that the ISO 9660 standard for cdrom uses a 2048 byte block
    size.


    Old hard disks (floppy disks) use cylinder-head-sector addressing to access a
    sector on the disk. Most current disks use LBA (Logical Block Addressing).


    # 4.1.6. solid state drive


    A solid state drive or ssd is a block device without moving parts. It is comparable
    to flash memory. An ssd is more expensive than a hard disk, but it typically has
    a much faster access time.


    In this book we will use the following colors for spindle disks (in brown) and
    solid state disks (in blue).'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 4.2. device naming


    # 4.2.1. ata (ide) device naming


    All ata drives on your system will start with /dev/hd followed by a unit letter.
    The master hdd on the first ata controller is /dev/hda, the slave is /dev/hdb.
    For the second controller, the names of the devices are /dev/hdc and /dev/hddd.


    Table 4.1. ide device naming


    | controller | connection | device name |

    |---|---|--|

    | ide0 | master | /dev/hda |

    | | slave | /dev/hdb |

    | ide1 | master | /dev/hdc |

    | | slave | /dev/hdd |


    It is possible to have only /dev/hda and /dev/hdd. The first one is a single scsi
    hard disk, the second one is the cdrom (by default configured as slave).


    # 4.2.2. scsi device naming


    scsi drives follow a similar scheme, all but start with /dev/sd. When you run
    out of letters (after /dev/sdz), you can continue with /dev/sdaa and /dev/sdab
    and so on. (We will see later on lvm volumes are commonly seen as /dev/md0, /dev/md1
    etc.)


    Below a sample of how scsi devices on a Linux can be named. Adding a scsi disk
    or raid controller with a lower scsi address will change the naming scheme (shifting
    the higher scsi addresses one letter further in the alphabet).


    Table 4.2. scsi device naming


    | device | scsi id | device name |

    |---|---|--|

    | disk 0 | 0 | /dev/sda |

    | disk 1 | 1 | /dev/sdb |

    | raid controller 0 | 5 | /dev/sdc |

    | raid controller 1 | 6 | /dev/sdd |


    A modern Linux system will use /dev/sd* for scsi and sata devices, and also for
    sd-cards, usb-sticks, (legacy) ATA/IDE devices and solid state drives.'
  merge: -1
  pgno: 41
