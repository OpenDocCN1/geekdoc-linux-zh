    \ 1 root 310676 2008-12-07 13:54 modules.dep\n```\n\n# 28.4.12. rmod\n\nSimilar\
    \ to immod, rmod command is used when necessary.\n\n```\n[root@RHELvau3 ~]# rmod\
    \ isdn\n[root@RHELvau3 ~]# rmod slhc\nERROR: Module slhc is in use by isdn\\n[root@RHELvau3\
