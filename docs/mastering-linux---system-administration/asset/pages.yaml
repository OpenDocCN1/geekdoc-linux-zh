  md: '# # Appendix A. disk quotas


    # ## A.1. About Disk Quotas


    To limit the disk space used by user, you can set disk quotas. This requires adding
    usquota and/or grpquota to one or more of the file systems in /etc/fstab.


    ```

    root@RHELv4u:~# cat /etc/fstab | grep usrquota

    /dev/VolGroup00/LogVol02    home    ext3    usrquota,grpquota    0 0

    ```


    Next you need to remount the file system.


    ```

    root@RHELv4u:~# mount -o remount

    ```


    The next step is to build the quota.user and/or quota.group files. These files
    (called the quota files) contain the table of the disk usage on that file system.
    Use the quotacheck command to accomplish this.


    ```

    root@RHELv4u:~# quotacheck -cug /home

    root@RHELv4u:~# quotacheck -vug

    ```


    The is for create, u for user quota, g for group, a for checking all quota enabled
    file systems in /etc/fstab and v for verbose information. The next step is to
    edit individual user quotas with edquota or set a general quota on the file system
    with edquota -t. The tool will enable you to put hard (this is the real limit)
    and soft (allows a grace period) limits on blocks and inodes. The quota command
    will verify that a quota for user is set. You can have a nice overview with repquota.


    The final step is (before your users start complaining about lack of disk space)
    is to enable quotas with quotaoff(1).


    ```

    root@RHELv4u:~# quotaoff -vaug

    ```


    Issue the quotaoff command to stop all complaints.


    ```

    root@RHELv4u:~# quotaoff -vaug

    ```


    # ## A.2. Practice Disk quotas


    +   1. Implement disk quotas on one of your new partitions. Limit one of your
    users to 10 megabyte.

    2. Test that they work by copying many files to the quota''d partition.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# # Appendix B. introduction to vnc


    # ## B.1. About VNC


    VNC can be configured in gnome or KDE using the Remote Desktop Preferences. VNC
    can be used to run your desktop on another computer, and you can also use it to
    see and take over the Desktop of another user. The last part can be useful for
    help shows users how to do things, VNC has the added advantage of being operating
    system independent, a lot of products (realvnc, tightvnc, xvnc, ...) use the same
    protocol on Solaris, Linux, BSD and more.


    # ## B.2. VNC Server


    Starting the vnc server for the first time.


    ```

    ```[root@RHEL4v3 ~]# rpm -qa | grep -i vnc

    vnc-server-4.0-8.1

    vnc-4.0-8.1

    [root@RHEL4v3 ~]# vncserver :2

    ```

    ```


    You will require a password to access your desktops.


    Password:

    Verify:

    xauth: creating new authority file /root/.Authority

    New ''/root/RHEL4v3.localdomain:2 (root)'' desktop is RHEL4v3.localdomain:2


    Creating default startup script /root/.vnc/xstartup

    Starting applications specified in /root/.vnc/xstartup

    Log file is /root/.vnc/RHEL4v3.localdomain:2.log


    ```

    ```[root@RHEL4v3 ~]#```

    ```


    # ## B.3. VNC Client


    You can now use the vncviewer from another machine to connect to your vnc server.
    It will default to a simple graphical interface...


    ```

    ```paul8ika@local~$ vncviewer 192.168.1.49:2

    VNC viewer version 3.3.7 - built Nov 20 2006 13:05:04

    Copyright (C) 2002-2003 RealVNC Ltd.

    Copyright (C) 1994-2000 AT&T Laboratories Cambridge.

    See http://www.realvnc.com for information on VNC.

    VNC server supports protocol version 3.8 (version 3.3)

    Password:

    VNC authentication succeeded

    Desktop name "RHEL4v3.localdomain:2 (root)*"

    Connected to VNC server, using protocol 3.3

    ```

    ```


    If you don''t like the simple twm window manager, you can comment out the last
    two lines of ~/.vnc/xstartup and add a gnome-session & to have vnc default to
    gnome instead.'
  merge: -1
