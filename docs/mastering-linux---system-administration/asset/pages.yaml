- img_proc: true
  md: "# 18.1. displaying memory and cache\n\n# 18.1.1. /proc/meminfo\n\nDisplaying\
    \ /proc/meminfo will tell you a lot about the memory on your Linux computer.\n\
    \n```\nPaul@ubul010:-$ cat /proc/meminfo\nMemTotal:       3830176 kB\nMemFree:\
    \        244060 kB\nBuffers:        41020 kB\nCached:         2035292 kB\nSwapCached:\
    \     9892 kB\n...\n```\n\nThe first line contains the total amount of physical\
    \ RAM, the second line is the unused RAM. Buffers is used for buffering files,\
    \ cached is the amount of RAM used as cache and SwapCached is the amount of swap\
    \ used as cache. The file gives us much more information outside of the scope\
    \ of this course.\n\n# 18.1.2. free\n\nThe free tool can display the information\
    \ by /proc/meminfo in a more readable format. The example below displays free\
    \ memory information in megabytes.\n\n```\npaul@ubul010:-$ free -om\n        \
    \       total      used      free  shared  buffers cached\nMem:            3740\
    \      3519       221       0        42     1994\nSwap:            6234      \
    \  82      6152\n```\n\n# 18.1.3. top\n\nThe top tool is often used to look at\
    \ processes consuming most of the cpu, but it also displays memory information\
    \ on four and five (which can be toggled by pressing m).\n\nBelow a screenshot\
    \ of top on the same ubu010 from above.\n\n```\ntop - 10:44:34 up 16 days, 9:56,\
    \ 6 users, load average: 0.13, 0.09, 0.12\nTasks: 166 total, 1 running, 65 sleeping,\
    \ 0 stopped, 0 zombie\nCpu(s): 5.1us, 4.6sy, 0.6ni, 88.77id, 0.8wa, 0.0hi, 0.3si,\
    \ 0.0st\nMem: 3830176k total, 3617230k, 216456k free, 45452k buffers\nSwap: 6384636k\
    \ total, 84988k used, 6299648k free, 2050948 cached\n```"
  merge: -1
  pgno: 221
- img_proc: true
  md: "# # 18.2. managing swap space\n\n# ## 18.2.1. about swap space\n\nWhen the\
    \ operating system needs more memory than physically present in RAM, it can use\
    \ swap space. Swap space is located on slower but cheaper memory. Notice that,\
    \ although hard disks are commonly used for swap space, their access times are\
    \ one hundred thousand times slower.\n\nThe swap space can be a file, a partition,\
    \ or a combination of files and partitions. You can see the swap space with the\
    \ free command, or with /proc/swaps.\n\n```\npaul@ubul10:-$ free -o | grep -v\
    \ /proc/swaps\ntotal       used Mem      shared buffers cached\nSwap:       638436\
    \    84988    6299648\npaul@ubul10:-$ cat /proc/swaps\nFilename    Type      \
    \  Size Used Priority\n/dev/sda3  partition   638436 84988  -1\n```\n\nThe amount\
    \ of swap space that you need depends heavily on the services that the computer\
    \ provides.\n\n# ## 18.2.2. creating a swap partition\n\nYou can activate or deactivate\
    \ swap space with the swapon and swapoff commands. New swap space can be created\
    \ with the mkswap command. The screenshot below shows the creation and activation\
    \ of a swap partition.\n\n```\nroot@RHELV4:-# fdisk -l 2> /dev/null | grep hda\n\
    Disk /dev/hda: 536 MB, 53687092 bytes\n/dev/hda                1040 524128  83\
    \ Linux\nroot@RHELV4:-# mkswap /dev/hda\nSetting up swapspace version 1, size\
    \ = 536702 KB\nroot@RHELV4:-# swapon /dev/hda\n```\n\nNow you can see that /proc/swaps\
    \ displays all swap spaces separately, whereas the free - command only makes a\
    \ readable summary.\n\n```\nroot@RHELV4:-# cat /proc/swaps\nFilename    Type \
    \       Size Used Priority\n/dev/VolGroup0-LogVol01 partition   10448568 0  -1\n\
    /dev/hda   partition   524120 0  -2\nroot@RHELV4:-# free -m\nMem:        total\
    \       used free shared buffers cached\n            249         245     4   \
    \   0     125    54\nSwap:       1535                0      1535\n```"
  merge: -1
  pgno: 222
- img_proc: true
  md: '# 18.2.3. creating a swap file


    Here is one more example showing you how to create a swap file. On Solaris you
    can use mkfile instead of dd.


    ```

    root@RHEL4u4:~# dd if=/dev/zero of=/smallswapfile bs=1024 count=4096

    4096+0 records in

    root@RHEL4u4:~# mkswap /smallswapfile\Setting swapspace version 1, size = 4190
    KB

    root@RHEL4u4:~# swapon /smallswapfile

    root@RHEL4u4:~# cat /proc/swaps

    ```


    | Filename | Type | Size | Used | Priority |

    |---|---|---|---|--|

    | /dev/mapper/VolGroup00-LogVol01 | partition | 1048568 | 0 | -1 |

    | /dev/hda1 | partition | 524120 | 0 | -2 |

    | /smallswapfile | file | 4088 | 0 | -3 |


    # 18.2.4. swap space in /etc/fstab


    If you like these swaps to be permanent, don''t forget to add them to /etc/fstab.
    The lines in /etc/fstab will be similar to the following.


    ```

    /dev/hda1        swap      swap      defaults  0 0

    /smallswapfile    swap      swap      defaults  0 0

    ```'
