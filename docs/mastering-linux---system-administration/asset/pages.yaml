- img_proc: true
  md: '# 15.8.3. chconfig and service commands


    The chconfig and service commands are considered ''legacy''. They are replaced
    with systemctl.


    This screenshot shows the new way to start and stop a service.


    ```

    [rhel7 ~] # systemctl start crond.service

    [rhel7 ~] # systemctl show crond.service | grep State

    LoadState=loaded

    ActiveState=active

    SubState=running

    UnitState=enabled

    [rhel7 ~] # systemctl stop crond.service

    [rhel7 ~] # systemctl show crond.service | grep State

    LoadState=loaded

    ActiveState=inactive

    SubState=dead

    UnitState=disabled

    [rhel7 ~] #

    ```


    And here is the new way to start and disable a service.


    ```

    [rhel7 ~] # systemctl stop crond.service

    [rhel7 ~] # systemctl disable crond.service

    rm ''/etc/systemd/system/multi-user.target.wants/crond.service'' /etc/systemd/system/multi-user.

    [rhel7 ~] # systemctl show crond.service | grep State

    LoadState=loaded

    ActiveState=inactive

    SubState=dead

    UnitState=disabled

    [rhel7 ~] #

    ```


    This screenshot shows how to enable and start the service again.


    ```

    [rhel7 ~] # systemctl enable crond.service

    ln -s ''/usr/lib/systemd/crond.service'' ''/etc/systemd/system/multi-user.target.wants/crond.service''

    [rhel7 ~] # systemctl start crond.service

    [rhel7 ~] # systemctl show crond.service | grep State

    LoadState=loaded

    ActiveState=active

    SubState=running

    UnitState=enabled

    [rhel7 ~] #

    ```'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# 15.8.4. systemd signalling


    You can also use systemd to kill problematic services.


    ```

    [root@rhel7 ~]# systemctl show crond.service | grep State

    LoadState=loaded

    ActiveState=active

    SubState=running

    UnitState=enabled

    [root@rhel7 ~]# systemctl kill - SIGKILL crond.service

    [root@rhel7 ~]# systemctl show crond.service | grep State

    LoadState=loaded

    ActiveState=failed

    SubState=failed

    UnitFile=enabled

    [root@rhel7 ~]#

    ```


    # 15.8.5. systemd shutdown


    The poweroff, halt and reboot commands are considered legacy now and are handled
    by systemctl. The table below shows the legacy commands on the left and their
    new system equivalent to the right.


    Table 15.1. systemd power management


    | legacy command | systemd command |

    | --- | --- |

    | poweroff | systemctl poweroff |

    | reboot | systemctl reboot |

    | halt | systemctl halt |

    | pm-suspend | systemctl suspend |

    | pm-hiberate | systemctl hibernate |


    # 15.8.6. remote system


    The systemctl utility has a built-in remote control providing that there is an
    ssh daemon running on the remote system.


    This screenshot shows how to use systemctl to verify a service on another RHEL
    server.


    ```

    [root@rhel7 ~]# systemctl -H root@192.168.1.65 status ssh

    root192.168.1.65:password:

    shd.service - OpenSSH server daemon

    Loaded: loaded (/usr/lib/systemd/sshd.service; enabled)

    Active: active (running) since Thu 2014-09-11 13:04:10 CEST; 16min ago

    Process: 1328 ExecStartMain=/usr/bin/sshd-key (code=exited, status=0/SUCCE)

    SS)

    Main PID: 1363 (sshd)

    CGroup: /system.slice/sshd.service

    [root@rhel7 ~]#

    ```'
  merge: -1
  pgno: 194
