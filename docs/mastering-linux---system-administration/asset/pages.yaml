- img_proc: true
  md: 'introduction to processes


    # 1.3. signalling processes


    # 1.3.1. kill


    The kill command will kill (or stop) a process. The screenshot shows how to use
    a standard kill to stop the process with pid 1942.


    ```

    paul@ubuntu910:-$ kill 1942

    paul@ubuntu910:-$

    ```


    By using the kill we are receiving a signal to the process.


    # 1.3.2. list signals


    Running processes can receive signals from each other or from the users. You can
    have list of signals by typing -l, that is a letter, not the number 1.


    ![](img/b73e4add6be31135074237b0a665e1f4_16_0.png)


    # 1.3.3. kill (SIGHUP)


    It is common on Linux to use the first signal SIGHUP (or HUP 1) to trigger a process
    that it should re-read its configuration file. The kill -1 command forces the
    init process (which always runs with pid 1) to re-read its configuration file.


    ```

    root@deb503:-$ kill -1 1

    root@deb503:-$#

    ```


    It is up to the developer of the process to decide whether this can run, or whether
    it needs to start and start. It is up to the user to read the documentation of
    the program.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 1.3.4. kill -15 (SIGTERM)


    The SIGTERM signal is also called a standard kill. Whenever kill is executed without
    specifying the signal, a kill -15 is assumed.


    Both commands in the screenshot below are identical.


    ```

    paul@ubuntu910:~$ kill 1942

    paul@ubuntu910:~$ kill -15

    ```


    # 1.3.5. kill -9 (SIGKILL)


    The SIGKILL is different from most other signals in that it is not being sent
    to the process, but to the Linux kernel. A kill -9 is also called a sure kill.
    The kernel will shut down the process. As a developer you have no means to intercept
    a kill -9 signal.


    ```

    root@rhel53 ~# kill -9 3342

    ```


    # 1.3.6. SIGSTOP AND SIGCONT


    A running process can be suspended when it receives a SIGSTOP signal. This is
    the same as kill -19 on Linux, but might have a different number in other Unix
    systems.


    A suspended process does not use any cpu cycles, but it stays in memory and can
    be reanimated with a SIGCONT signal (kill -18 on Linux).


    Both signals will be used in the section about background processes.'
  merge: -1
  pgno: 17
