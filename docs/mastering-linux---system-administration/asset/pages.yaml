  md: '# 12.4. iSCSI target on Debian


    Installing the software for the target server requires iscsarget on Ubuntu and
    Debian, and an extra iscsarget-dkms for the kernel modules only on Debian.


    ```

    root@debby6:~# apt aptitude install iscsarget

    The following NEW packages will be installed:

    iscsarget

    0 packages upgraded, 1 newly installed, 0 to remove and 0 not upgraded.

    Need to get 69.4 KB of archives. After unpacking 262 kB will be used.

    Get1: http://ftp.belmet.net/debian/squeeze/main iscsarget i386 1.40.20-1 [69.4
    kB]

    Fetched 69.4 KB in 0s (415 kB/s)

    Selecting previously selected package iscsarget

    (Reading database ... 3644 files and directories currently installed)

    Unpacking iscsarget (from .../iscsarget_1.40.20-1_i386.deb) ...

    Processing triggers for man-db

    Setting up iscsarget (1.40.20-1) ...

    iscsarget not enabled in /etc/default/iscsarget*, not starting... (warning).

    ```


    On Debian 6 you will also need aptitude install iscsarget-dkms for the kernel
    modules, on Debian 5 is this is aptitude install iscsarget-modules-uname -a. Ubuntu
    includes the kernel modules in the main package.


    The iSCSI target is disabled by default, so we can enable it.


    ```

    root@debby6:~# cat /etc/default/iscsarget

    ISCARGET_ENABLE=false

    root@debby6:~# vi /etc/default/iscsarget

    root@debby6:~# cat /etc/default/iscsarget

    ISCARGET_ENABLE=true

    ```'
