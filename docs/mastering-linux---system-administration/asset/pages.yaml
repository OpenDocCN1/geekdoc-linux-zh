  md: '# Chapter 30. backup


    # 30.1. About tape devices


    Don''t forget that the name of a device strictly speaking has no meaning since
    the kernel use the major and minor number to find the hardware! See the page of
    mknod and the devices.txt file in the Linux kernel source for more info.


    # 30.1.1. SCSI tapes


    On official Linux device list (http://www.lanana.org/docs/device-list/) we find
    the names for SCSI tapes (major 9 char). SCSI tapes are located underneath /dev/st
    and are numbered starting with 0 for the first tape device.


    ```

    /dev/st0 First tape device

    /dev/st1 Second tape device

    /dev/st2 Third tape device

    ```


    To prevent automatic rewinding of tapes, prefix them with the letter n.


    ```

    /dev/nst0 First no rewind tape device

    /dev/nst1 Second no rewind tape device

    /dev/nst2 Third no rewind tape device

    ```


    By default, SCSI tapes on Linux will use the highest hardware compression that
    is supported by the tape device. To lower the compression level, append one of
    the letters 1 (low), m (medium) or a (auto) to the tape name.


    ```

    /dev/st01 First low compression tape device

    /dev/st0m First medium compression tape device

    /dev/nst2m Third no rewind medium compression tape device

    ```


    # 30.1.2. IDE tapes


    On official Linux device list (http://www.lanana.org/docs/device-list/) we find
    the names for IDE tapes (major 37 char). IDE tape devices are located underneath
    /dev/ht and are numbered starting with 0 for the first tape device. No rewind
    and compression is similar to SCSI tapes.


    ```

    /dev/ht0 First IDE tape device

    /dev/nht0 Second no rewind IDE tape device

    /dev/ht0m First medium compression IDE tape device

    ```


    # 30.1.3. mt


    To manage your tapes, use mt (Magnetic Tape). Examples.'
