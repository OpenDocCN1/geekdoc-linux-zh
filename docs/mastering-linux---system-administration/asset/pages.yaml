  md: '# 27.1. introduction to iptables


    # 27.1.1. iptables firewall


    The Linux kernel has a built-in stateful firewall iptables. To stop the iptables
    firewall on Red Hat, use the service command.


    ```

    root@RHEL4u4:~# service iptables stop

    Flushing firewall rules: [ OK ]

    Setting chains to policy ACCEPT: filter [ OK ]

    Unloading iptables modules: [ OK ]

    root@RHEL4u4:~#

    ```


    The easy way to configure iptables is to use a graphical tool like KDE''s firewall
    or Security Level Configuration Tool. You can find the latter in the graphical
    menu, somewhere in System Tools - Security, you can start it by system-config-securitylevel
    in bash. These tools allow for basic firewall configuration. You can decide whether
    to enable or disable the firewall, and what standard ports are allowed when the
    firewall is active. You can even add some custom ports. When you are done, the
    configuration is written to /etc/sysconfig/iptables on Red Hat.


    ```

    root@RHEL4u4:~# cat /etc/sysconfig/iptables

    # Firewall configuration written by system-config-securitylevel

    # Manual customization of this file is not recommended.

    #filter

    :INPUT ACCEPT [0:0]

    :FORWARD ACCEPT [0:0]

    :OUTPUT ACCEPT [0:0]

    -RH-Firewall-1 [0:0]

    -A INPUT j RH-FIREWALL-1-INPUT

    -A FORWARD j RH-FIREWALL-1-INPUT

    -A RH-Firewall-1-INPUT -i lo -j ACCEPT

    -A RH-Firewall-1-INPUT -p icmp --icmp-type any -j ACCEPT

    -A RH-Firewall-1-INPUT -p 50 -j ACCEPT

    -A RH-Firewall-1-INPUT -j ACCEPT

    -A RH-Firewall-1-INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

    -A RH-Firewall-1-INPUT -m state -m NEW -p tcp --dport 22 -j ACCEPT

    -A RH-F...NINPUT -m state -m NEW -p tcp --dport 80 -j ACCEPT

    -A RH-F...NINPUT -m state -m NEW -p tcp --dport 21 -j ACCEPT

    -A RH-F...NINPUT -m state -m NEW -p tcp --dport 25 -j ACCEPT

    -A RH-Firewall-1-INPUT -j REJECT --reject-with icmp-host-prohibited

    COMMIT

    root@RHEL4u4:~#

    ```


    To start the service, issue the services startup command. You can configure iptables
    to start at boot with chconfigfig.


    ```

    root@RHEL4u4:~# service iptables start

    Applying iptables firewall rules: [ OK ]

    root@RHEL4u4:~# chconfigfig iptables

    root@RHEL4u4:~#

    ```'
