    \ 1\n    touch /var/lock/subsys/pold\n    echo \"done.\"\n    echo pold started\
    \ >> /var/log/messages\n    ;;\nstop)\n    echo -n \"Stopping pold...\"\n    sleep\
    \ 1\n    rm -rf /var/lock/subsys/pold\n    echo \"done.\"\n    echo pold stopped\
    \ >> /var/log/messages\n    ;;\n\\)\n    echo \"Usage: /etc/init.d/pold {start|stop}\"\
