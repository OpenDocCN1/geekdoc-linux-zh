    2b. Use tar to backup /bin to /mnt/backup/bin_date.tar.bz2, the backup must be
    bzip2''d.


    2c. Choose a file in /etc and /bin and verify with tar that the file is indeed
    backed up.


    2d. Extract those two files to your home directory.


    3a. Create a backup directory for your neighbour, make it accessible under /mnt/

    neighbourbourName


    3b. Combine ssh and tar to put a backup of your /boot on your neighbours computer
    in /

    mnt/YourName


    4a. Combine bfind and cpio to create a cpio archive of /etc.


    4b. Choose a file in /etc and restore it from the cpio archive into your home
    directory.


    5. Use dd and ssh to put a backup of the master boot record on your neighbours
    computer.


    6. (On the real computer) Create and mount an ISO image of the ubuntu cdomrom.


    7. Combine dd and gzip to create a ''ghost'' image of one of your partitions on
    another partition.


    8. Use dd to create a five megabyte file in ~/testsplit and name it biggest. Then
    split this file

    in smaller two megabyte parts.


