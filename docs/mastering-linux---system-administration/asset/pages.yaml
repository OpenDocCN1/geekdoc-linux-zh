    # 30.2. Compression


    It can be beneficial to compress files before backup. The two most popular tools
    for compression of regular files on Linux are gzip/gunzip bzip2/bzip2. Below you
    can see in gzip notice, that it adds the .gz extension to the file.


    ```

    paul@RHEL4u:~/$ ls -l allfiles.txt*

    -rw-rw-r-- 1 paul 8813553 Feb 27 05:38 allfiles.txt

    paul@RHEL4u:~/$ gzip allfiles.txt

    paul@RHEL4u:~/$ ls -l -allfiles.txt

    -rw-rw-r-- 1 paul 931863 Feb 27 05:38 allfiles.txt.gz

    paul@RHEL4u:~/$ gzip allfiles.txt

    paul@RHEL4u:~/$ ls -l -allfiles.txt*

    -rw-rw-r-- 1 paul 8813553 Feb 27 05:38 allfiles.txt

    paul@RHEL4u:~/$

    ```


    In general, gzip is much faster than bzip2, but the latter compresses better.
    Let us compare the two.


    ```

    paul@RHEL4u:~/$ cp allfiles.txt bllfiles.txt

    paul@RHEL4u:~/$ time gzip allfiles.txt


    real 0.050s

    user 0.041s

    sys 0.009s

    paul@RHEL4u:~/$ time bzip2 bllfiles.txt


    real 0.568s

    user 0.574s

    sys 0.076s

    paul@RHEL4u:~/$ ls -l ?allfiles.txt*

    -rw-rw-r-- 1 paul 931863 Feb 27 05:38 allfiles.txt.gz

    -rw-rw-r-- 1 paul 708871 May 12 10:52 bllfiles.txt.bz2

    paul@RHEL4u:~/$

    ```


    # 30.3. tar


    The tar utility gets its name from TapeArchive. This tool will receive and send
    files to a destination (typically a tape or a file). The c option is used to create
    a tar archive'
