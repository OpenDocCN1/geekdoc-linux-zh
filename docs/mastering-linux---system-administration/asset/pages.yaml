- img_proc: true
  md: '# 23.1.3. minimize traffic


    A sniffer can generate thousands of packets in a very short time. This can be
    overwhelming. Try to mitigate it by isolating your sniffer on the network. Preferably
    sniff an isolated virtual network interface over which you control all traffic.


    If you are at home learning sniffer, then it could help to close all network programs
    on your computer, and disconnect other computers and devices like smartphones
    and tablets to minimize the traffic.


    Even more important than this is the use of filters which will be discussed in
    this chapter.


    # 23.1.4. sniffing ping


