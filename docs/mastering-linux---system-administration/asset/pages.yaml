  md: '# 28.3. kernel boot files


    # 28.3.1. vmlinuz


    The **mlinuz** file in /boot is the compressed kernel.

    paul@bash:~$ ls -1h /boot | grep vmlinuz

    -rw-r--r 1 root root 1.2M 2006-03-06 16:22 vmlinuz-2.6.15-1-486

    -rw-r--r 1 root root 1.1M 2006-03-06 16:30 vmlinuz-2.6.15-1-686

    -rw-r--r- 1 root root 1.3M 2006-02-11 00:00 vmlinuz-2.6.18-6-686

    paul@bash:$


    # 28.3.2. initrd


    The kernel uses **initrd** (an initial RAM disk) at boot. The initrd is mounted
    before the kernel loads, and can contain additional drivers and modules. It is
    a compressed **pio** archive, so you can look at the contents in this way:


    ```

    root@RHEL4u4:/boot# mkdir /mnt/initrd

    root@RHEL4u4:/boot# cp initrd-2.6.9-42.0.3.EL.img TMPinitrd.gz

    root@RHEL4u4:/boot# gzip TMPinitrd.gz

    root@RHEL4u4:/boot# file TMPinitrd

    TMPinitrd: ASCII cpio archive (SVR4 with no CRC)

    root@RHEL4u4:/boot# cd /mnt/initrd

    root@RHEL4u4:/mnt/initrd$ decompress cpio -i - /boot/TMPinitrd

    485 blocks

    root@RHEL4u4:/mnt/initrd$ ls -l

    total: 76

    drwxr-xr-x 2 root root 4096 Feb 08:36 dev

    drwxr-xr-x 2 root root 4096 Feb 08:36 etc

    -rw-r--r-- 1 root root 1607 Feb 08:36 lib

    drwxr-xr-x 2 root root 4096 Feb 08:36 loopfs

    drwxr-xr-x 2 root root 4096 Feb 08:36 proc

    drwxr-xr-x 2 root root 4096 Feb 08:36 root

    -lrwxrwxrwx 1 root root 13 Feb 08:36 bin -> /sbin/bin

    drwxr-xr-x 2 root root 4096 Feb 08:36 sys

    drwxr-xr-x 2 root root 4096 Feb 08:36 sysroot

    root@RHEL4u4:/mnt/initrd#

    ```'
