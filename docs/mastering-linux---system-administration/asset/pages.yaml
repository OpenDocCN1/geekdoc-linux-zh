  md: '# 27.6.2. server configuration


    nfs is configured in /etc/exports. Here is a sample /etc/exports to explain the
    syntax. You need some way NIS domain or LDAP to synchronize userid across computers
    when using nfs a lot. The rootsquash option will change UID 0 to the UID of the
    nnobody account. The sync option will write to disk before completing the client
    request.


    ```

    paul@laika:~$ cat /etc/exports

    # Everyone can read this share

    /mnt/data/iso * (ro)


    # The computers pasha and pasha can readwrite this one

    /var/www/pasha (rw) barry (rw)


    # same, but without root squashing for barry

    /var/ftp/pasha barry(rw,no_root_squash)


    # everyone from the netsec.lan domain gets access

    /var/backup *.netsec.lan(rw)


    # ro for one network, rw for the other

    /var/upload 192.168.1.0/24 (ro) 192.168.5.0/24 (rw)

    ```


    You don''t need to restart the nfs server to start exporting newly created exports.
    You can use the exports -va command to do this. It will write the exported directories
    to /var/lib/nfs/stab, where they are immediately updated.


    # 27.6.3. client configuration


    We have the mount command and the /etc/stab file below.


    ```

    root@RHELv2:~# mount -t nfs barry:/mnt/data/iso /home/project55/

    root@RHELv2:~# cat /etc/stab | grep nfs

    barry:/mnt/data/iso /home nfs defaults 0 0

    ```


    Here is another simple example. Suppose the project55 tells you they need a couple
    of CD-ROM images, and you have them available on an nfs server. You could issue
    the following command to mount this storage on the /home/project55 point.


    ```

    root@RHELv2:~# mount -t nfs 192.168.1.40:/mnt/data/iso /home/project55/

    root@RHELv2:~# ls -lh /home/project55/

    total 3.6G

    drwxr-xr-x 2 1000 1000 4.0K Jan 16 17:55 RHELvau1

