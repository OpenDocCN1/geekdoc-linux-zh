  md: '# 24.2. binding on Debian/Ubuntu


    # 24.2.1. binding extra ip addresses


    The configuration of multiple ip addresses on the same network card is done in
    /etc/network/ interfaces by adding eth0x devices. The netmask is mandatory.


    ```

    debian5-:# cat /etc/network/interfaces

    # This file describes the network interfaces available on your system

    # and how to activate them. For more information, see interfaces(5).


    # The loopback network interface

    auto lo

    iface lo loopback


    # The primary network interface

    iface eth0 inet static

    address 192.168.1.34

    network 192.168.1.0

    netmask 255.255.255.0

    gateway 192.168.1.1

    auto eth0


    auto eth0:0

    iface eth0:0 inet static

    address 192.168.1.233

    netmask 255.255.255.0


    auto eth0:1

    iface eth0:1 inet static

    address 192.168.1.242

    netmask 255.255.255.0

    ```


    # 24.2.2. enabling extra ip-addresses


    Use ifup to enable the extra addresses.


    ```

    debian5-:# ifup eth0:0

    deb5-:# ifup eth0:1

    ```


    # 24.2.3. verifying extra ip-addresses


    Use ping from another computer to check the activation, or use ifconfig like in
    this screenshot.


    ```

    debian5-:# ifconfig | grep ''inet

    inet addr:192.168.1.34 Bcast:192.168.1.255 Mask:255.255.255.0

    inet addr:192.168.1.233 Bcast:192.168.1.255 Mask:255.255.255.0

    inet addr:192.168.1.242 Bcast:192.168.1.255 Mask:255.255.255.0

    inet addr:127.0.0.1 Mask:255.0.0.0

    ```'
  merge: -1
