  md: '# 20.7.8. /etc/yum.conf and repositories


    The configuration of yum repositories is done in /etc/yum/yum.conf and /etc/yum/repos.d/


    Configuring yum itself is done in /etc/yum.conf. This file will contain the location
    of a log file and a cache directory for yum and can also contain a list of repositories.


    Recently yum started accepting several repo files with each file containing a
    list of repositories. These repo files are located in the /etc/yum.repos.d/ directory.


    One important flag for yum is enablerpo. Use this command if you want to use a
    repository that is not enabled by default.


    ```

    yum $command $foo --enablerpo=$repo

    ```


    An example of the contents of the repo file: MyRepo.repo


    ```

    [repo]

    name=MyRepo

    baseurl=http://path/to/MyRepo

    gpgcheck=1

    gpgkeyfile:///etc/pki/rpm-gpg/RPM-GPG-KEY-MyRepo

    ```'
