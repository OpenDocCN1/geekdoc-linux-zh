  md: '# 8.3. chroot


    The **chroot** command creates a shell with an alternate root directory. It effectively
    hides anything outside of this directory.


    In the example below we assume that our system refuses to start (maybe because
    there is a problem with `/etc/fstab` or the mounting of the root system).


    We start a live system (booted from cd/dvd/usb) to troubleshoot our root system.
    The live system will not use our main hard root as device


    ```

    root@livecd:~# df -h | grep root

    rootfs      186M  80M   6% /

    /dev/loop0  80M  175M   0% /lib/live/mount/rootfs/filesystem.squashfs

    root@livecd:~# mount | grep root

    /dev/loop0  on /lib/live/mount/rootfs/filesystem.squashfs type squashfs (ro)

    ```


    We create some test file on the current roots.


    ```

    root@livecd:~# touch /file42

    root@livecd:~# mkdir /dir42

    root@livecd:~# ls /

    bin  dir42  home  lib64  opt  run   srv  usr  vmlinux

    boot  etc   initrd.img media  proc  sbin  sys   var

    dev file42 lib   mnt   root  selinux tmp var

    ```


    First we mount the root system from the device (which is in lm) we use using `/dev/mapper
    instead of `/dev/sda1`


    ```

    root@livecd:~# mount /dev/mapper/packer--debian-7 /mnt

    ```


    We are now ready to chroot into the roots system.


    ```

    root@livecd:~# cd /mnt

    root@livecd:~# chroot /mnt

    root@livecd:~# ls /

    bin  dev  initrd.img lost-found opt  run   srv  usr  vmlinux

    boot  etc   lib   media  proc  sbin  sys   vagrant

    data  home lib64  mnt   root  selinux tmp var

    ```


    Our test files (file42 and dir42) are not visible because they are outside of
    the **chrooted** environment.


    The hostname of the chrooted environment is identical to the existing hostname.


    To exit the chrooted system:


    ```

    root@livecd:~# exit

    exit

    root@livecd:~# ls /

    bin  dir42  home  lib64  opt  run   srv  usr

    boot  etc   initrd.img media  proc  sbin  sys   var

    dev file42  lib   mnt   root  selinux tmp vmlinux

    ```'
  merge: -1
  pgno: 87
