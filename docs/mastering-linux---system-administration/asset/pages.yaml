    # 24.1. up and down


    You can also use ifconfig to bring an interface up or down. The difference with
    ifup is ifconfig eth0 will re-activate it keeping its existing (current) configuration,
    whereas ifup will read the config to configure a (possibly new) configuration
    and use this config to bring the interface up.


    ```

    [root@r6 ~]# ifconfig eth0 down

    [root@r6 ~]# ifconfig eth0 up

    [root@r6 ~]# ifconfig eth0

    eth0 Link encap:Ethernet HWaddr 08:00:27:dd:00:55

    inet addr:192.168.1.99 Bcast:192.168.1.255 Mask:255.255.255.0

    inet6 addr:fe80::a007fffe:d5c/64 Scope:Link

    UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1

    RX packets:2995 errors:0 dropped:0 overruns:0 frame:0

    TX packets:1927 errors:0 dropped:0 overruns:0 carrier:0

    collisions:0 txqueuelen:1000

    RX bytes:339030 (331.0 KiB) TX bytes:191583 (187.0 KiB)

    ```


    # 24.2. setting mac address


    You can temporarily set an address with ifconfig. This address is only valid until
    the next ifup/ifdown cycle or the reboot.


    ```

    [root@r6 ~]# ifconfig eth0 | grep 192

    inet addr:192.168.1.99 Bcast:192.168.1.255 Mask:255.255.255.0

    [root@r6 ~]# ifconfig eth0 hwaddr 192.168.1.34 netmask 255.255.255.0

    [root@r6 ~]# ifconfig eth0

    inet addr:192.168.1.34 Bcast:192.168.255.255 Mask:255.255.255.0

    [root@r6 ~]# ifconfig eth0 | grep 192

    inet addr:192.168.1.99 Bcast:192.168.1.255 Mask:255.255.255.0

    ```


    # 24.3. setting mac address


    You can also use ifconfig to set another mac address than the hard coded in the
    network card. This shows you how.


    ```

    [root@r6 ~]# ifconfig eth0 | grep HWaddr

    eth0 Link encap:Ethernet HWaddr 08:00:27:dd:00:55

    [root@r6 ~]# ifconfig eth0 hwaddr 00:42:42:42:42:42

    [root@r6 ~]# ifconfig eth0 | grep HWaddr

    eth0 Link encap:Ethernet HWaddr 00:42:42:42:42:42

    ```'
