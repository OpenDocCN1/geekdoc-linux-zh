  md: '# 28.2.2./usr/src


    On your local computer, the kernel source is located in /usr/src. Note that the
    structure inside /usr/src might be different depending on the distribution that
    you are using.


    First lets take a look at /usr/src on Debian. There appear to be two versions
    of the complete Linux source code there. Looking for a specific file (e1000_main.c)
    with find reveals it''s exact location.


    ```

    paul@barry:~$ ls -l /usr/src/

    drwxr-xr-x 20 root 4096 2006-04-04 22:12 linux-source-2.6.15

    drwxr-xr-x 19 root 4096 2006-07-15 17:32 linux-source-2.6.16

    paul@barry:~$ find /usr/src -name e1000_main.c

    /usr/src/linux-source-2.6.15/drivers/net/e1000/e1000_main.c

    /usr/src/linux-source-2.6.16/drivers/net/e1000/e1000_main.c

    ```


    This is very similar to /usr/src on Ubuntu, except there is only one kernel (and
    it is newer).


    ```

    paul@laika:~$ ls -l /usr/src/

    drwxr-xr-x 23 root 4096 2008-11-24 23:28 linux-source-2.6.24

    paul@laika:~$ find /usr/src -name "e1000_main.c"

    /usr/src/linux-source-2.6.24/drivers/net/e1000/e1000_main.c

