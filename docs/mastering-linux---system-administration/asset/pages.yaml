  md: '# 28.4. Linux modules


    # 28.4.1. about kernel modules


    The Linux kernel is a monolithic kernel with loadable modules. These modules contain
    parts of the kernel used typically for device drivers, file systems and network
    protocols. Most of the time the necessary kernel modules are loaded automatically
    and dynamically without administrator interaction.


    # 28.4.2. /lib/modules


    The modules are stored in the /lib/modules/<kernel-version> directory. There is
    a separate directory for each kernel that was compiled for your system.


    ```

    paul@laika:~ ls 11 /lib/modules/

    total 12K

    drwxr-xr-x 8 root root 4.0K 2008-11-10 14:32 2.64-26-generic

    drwxr-xr-x 8 root root 4.0K 2008-12-06 15:39 2.64-26-generic

    drwxr-xr-x 8 root root 4.0K 2008-12-05 12:58 2.64-22-generic

    ```


    # 28.4.3. <module>.ko


    The file containing the modules usually ends in .ko. This screenshot shows the
    location of the isdn module files.


    ```

    paul@laika:~$ find /lib/modules -name isdn.ko

    /lib/modules/2.6.24-21-generic/kernel/drivers/isdn/i41/isdn.ko

    /lib/modules/2.6.24-22-generic/kernel/drivers/isdn/i41/isdn.ko

    /lib/modules/2.6.24-16-generic/kernel/drivers/isdn/i41/isdn.ko

    ```


    # 28.4.4. Ismod


    To see a list of currently loaded modules, use lsmod. You see the name of each
    loaded module, the size, and the count of the other modules using this.


    ```

    [root@HEL52 ~]# lsmod | head -5

    Module Size Used

    autofs4 24517 2

    hidp 23198 2

    rfcomm 42457 0

    l22cap 29505 10 hidp,rfcomm

    ```'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# 28.4.5. /proc/modules


    /proc/modules lists all modules loaded by the kernel. The output would be too
    long to display here, so use **grep** for the vm module.


    We see that vmmon and vmnet are both loaded. You can display the same information
    with lsmod. Actually lsmod only reads and reformats the output of `/proc/modules`.


    ```

    paul@laika:-$ cat /proc/modules | grep vm

    36896 13 - Live 0xffffffffff8b21000 (P)

    vmmon 194540 0 - Live 0xffffffffff88af0000 (P)

    paul@laika:-$ lsmod

    36896 13

    vmmon

    194540 0

    ```


    # 28.4.6. module dependencies


    Some modules depend on others. In the following example, you can see that nfsd
    module is used by exportfs, lockd and sunprpc.


    ```

    paul@laika:-$ cat /proc/modules | grep nfsd

    nfsd 267432 17 - Live 0xffffffffff88a40000

    exportfs 7808 1 nfsd, Live 0xffffffffff88a3d000

    lockd 73520 2 nfsd, nfsd, 0xffffffffff88a2a000

    sunprpc 185032 12 nfsd, nfsd, lockd, Live 0xfffffffffffb0000

    paul@laika:-$ lsmod | grep nfsd

    nfsd

    267432 17

    exportfs

    7808 1 nfsd

    lockd

    73520 3 nfsd, nfsd

    sunprpc

    185032 12 nfsd, nfsd, lockd

    ```'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# 28.4.7. insmod


    Kernel modules can be manually loaded with the insmod command. This is a very
    simple (and obsolete) way of loading modules. The screenshot shows insmod loading
    the fat module (for fat file system).


    ```

    root@berry:/lib/modules/2.6.17-2-686# insmod | grep fat

    root@berry:/lib/modules/2.6.17-2-686# insmod kernel/fs/fat/fat.ko

    root@berry:/lib/modules/2.6.17-2-686# lsmod | grep fat

    fat 45658 0

    ```


    insmod is not detecting dependencies, so it fails to load the isdn module depends
    on the slhc module.


    ```

    [root@RHEL52 drivers]## pwd

    /lib/modules/2.6.18-92.1.el15/kernel/drivers

    [root@RHEL52 kernel]## insmod isdn/i41/isdn.ko

    insmod: error inserting ''isdn/i41/isdn.ko'': -1 Unknown symbol in module

    ```


    # 28.4.8. modinfo


    As you can see in the screenshot of modinfo below, the isdn module depends on
    the slhc module.


    ```

    [root@RHEL52 drivers]# modinfo isdn/i41/isdn.ko | head -6

    : isdn/i41/isdn.ko

    license: GPL

    author: Fritz Elfert

    description: ISDN4Linux: link layer

    srcversion: 99650346E708173496F739

    depends: slhc

    ```


    # 28.4.9. modprobe


    The big advantage of modprobe over insmod is that modprobe will load all necessary
    modules, whereas insmod requires manual loading of dependencies. Another advantage
    is that you don''t need to point to the module with full.


    This screenshot shows how modprobe loads the isdn module, automatically loading
    slhc in background.


    ```

    [root@RHEL52 kernel]# lsmod | grep isdn

    [root@RHEL52 kernel]# modprobe isdn

    [root@RHEL52 kernel]# lsmod | grep isdn

    isdn 122433 0

    slhc 10561 1 isdn

    [root@RHEL52 kernel]#

    ```'
  merge: -1
  pgno: 344
