- img_proc: true
  md: '# 12.11. solution: iSCSI devices


    +   1. Set up a target (using LVM and a SCSI device) and an initiator that connects
    to both.


    This solution was done for Debian/ubuntu/Mint. For RHEL/CentOS check the theory.


    Decide (with a partner) on a computer to be the Target and another computer to
    be the Initiator.


    **On the Target computer:**


    First install iscsarget using the standard tools for installing software in your
    distribution. Then use your knowledge from the previous chapter to setup a logical
    volume (/dev/vg/lvol0) and use the RAID chapter to setup /dev/md0. Then perform
    the following step:


    ```

    vi /etc/default/iscsitarget (set enable to true)

    ```


    Add your devices to /etc/ietf.conf


    ```

    root@debb66:/etc/ietf# cat ietf.conf

    Target iqn.2010-02.be.linux-training:storage.lun1

    IncomingUser isuser hunter2

    OutgoingUser

    Lun 0 Path=/dev/vg/lvol0,Type=fileio

    Alias LUN0

    Target iqn.2010-02.be.linux-training:storage.lun2

    IncomingUser isuser hunter2

    OutgoingUser

    Lun 0 Path=/dev/md0,Type=fileio

    Alias LUN1

    ```


    Add both devices to /etc/ietf/initiators.allow


    ```

    root@debb66:/etc/ietf# cat initiators.allow

    iqn.2010-02.be.linux-training:storage.lun1

    iqn.2010-02.be.linux-training:storage.lun2

    ```


    Now start the iscsarget daemon and move over to the Initiator.


    **On the Initiator computer:**


    Install open-iscsi and start the daemon.

    Then use iscsiad -m discovery -t st -p ''target-ip'' to see the iscsi devices
    on the Target.


    Edit the files /etc/iscsi/nodes/ as shown in the book. Then restart the iSCSI
    daemon and rund fdisk -l to see the iSCSI devices.'
