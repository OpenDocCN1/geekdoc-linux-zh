- img_proc: true
  md: '# 14.2.3. menu commands


    The **menu commands** must be at the top of **grub**''s configuration file.


    # default


    The **default** command sets a default **entry** to start. The first **entry**
    has number 0.


    ```

    default=0

    ```


    Each entry or **stanza** starts with a **title** directive.


    # fallback


    In the case **default** does not boot, use the **fallback** entry instead.


    ```

    fallback=1

    ```


    # timeout


    The **timeout** will wait a number of seconds before booting the **default** entry.


    ```

    timeout=5

    ```


    # hiddenmenu


    The **hiddenmenu** will hide the **grub** menu unless the user presses **Esc**
    before the **timeout** expires.


    ```

    hiddenmenu

    ```


    # title


    With **title** we can start a new **entry** or **stanza**.


    ```

    title CentOS (2.6.32-431.11.2.e16.x86_64)

    ```


    # password


    You can add a **password** to prevent interactive selection of a boot environment
    while **grub** is running.


    ```

    password --md5 $1$Ec.id/$T2C2ahI/EG3WRRSmmu/HN/

    ```


    Use the **grub** interactive shell to create the password hash.


    ```

    grub> md5crypt

    Password: ******\*

    Encrypted: $1$Ec.id/$T2C2ahI/EG3WRRSmmu/HN/

    ```'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# 14.2.4. stanza commands


    Every operating system or kernel that you want to boot with grub will have a stanza
    aka an entry of a couple of lines. Here are some of the common stanza commands.


    # boot


    Technically the boot command is only mandatory when running the grub command line.
    This command does not have any parameters and can only be set as the last command
    of a stanza.


    ```

    boot

    ```


    # kernel


    The kernel command points to the location of the kernel. To boot Linux this means
    booting a gzip compressed zImage or bzip2 compressed bImage.


    This screenshot shows a kernel used to load a Debian kernel.


    ```

    kernel /boot/vmlinuz-2.6.17-2-688 root=/dev/hdal ro

    ```


    And this is how RHEL 5 uses the kernel command.


    ```

    kernel /vmlinuz-2.6.18-128.e15 root=/dev/VolGroup00/LogVol000 rhgb quiet

    ```


    All parameters in the kernel can be read by the kernel itself or by any other
    program (which are started later) by reading /proc/cmdline


    # initrd


    Many Linux installations will need an initial ramdisk at boot time. This can be
    set in grub with the initrd command.


    Here a screenshot of Debian 4.0


    ```

    initrd /boot/initrd.img-2.6.17-2-688

    ```


    And the same for Red Hat Enterprise 5


    ```

    initrd /initrd-2.6.18-128.e15.img

    ```


    # root


    The root command accepts the root device as a parameter.


    The root command will point to the hard disk and partition to use, with hd0 as
    the first hard disk device and hd1 as the second hard disk device. The same numbering
    is used for partitions, so hd0,0 is the first partition on the first disk and
    hd0,1 is the second partition on that disk.


    ```

    root (hd0,0)

    ```'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# savedefault


    The **savedefault** command can be used together with **default saved** as a menu
    command. This combination will set the currently booted stanza as the next default
    stanza to boot.


    ```

    default saved

    timeout 10


    title Linux

    root (hd0,0)

    kernel /boot/vmlinuz

    savedefault


    title DOS

    root (hd0,1)

    active

    chainloader +1

    savedefault

    ```


    # 14.2.5. chainloading


    With **grub booting**, there are two choices: loading an operating system or **chainloading**
    another bootloader. The **chainloading** feature of grub loads the bootsector
    of a partition (that contains an operating system).


    Some older operating systems require a **primary partition** that is set as **active**.
    Only one partition can be set **active** by grub can do this on the fly before
    **chainloading**.


    This screenshot shows how to set the first partition **active with grub**.


    ```

    root (hd0,0)

    active

    ```


    Chainloading refers to grub loading another operating system''s bootloader. The
    **chainloader** switch receives one option: the number of sectors to read and
    boot. For **DOS** and **OS/2** one sector is enough. Note that **DOS** requires
    **chainloading** the boot/root partition to be active!


    Here is a complete example to **chainload** an old operating system.


    ```

    title MS-DOS 6.22

    root (hd0,1)

    active

    chainloader +1

    ```'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# 14.2.6. simple stanza examples


    This is a screenshot of a Debian 4 stanza.


    ```

    title Debian GNU/Linux, kernel 2.6.17-2-686

    root (hd0,0)

    kernel /boot/vmlinuz-2.6.17-2-686 root=/dev/hdal ro

    initrd /boot/initrd.img-2.6.17-2-686

    ```


    Here is a screenshot of a Red Hat Enterprise Linux 5 stanza.


    ```

    title Red Hat Enterprise Linux Server (2.6.18-128-el5)

    root (hd0,0)

    kernel /vmlinuz-2.6.18-98.el5 root=/dev/VolGroup00/LogVol000 rhgb quiet

    initrd /initrd-2.6.18-98.el5.img

    ```


    # 14.2.7. editing grub at boot time


    At boot time, when the grub menu is displayed, you can type e to edit the current
    stanza. This enables you to add parameters to the kernel.


    One parameter, useful when you lost the root password, is single. This will boot
    the kernel in single user mode (although some distributions will still require
    you to type the root password.


    ```

    kernel /boot/vmlinuz-2.6.17-2-686 root=/dev/hdal single

    ```


    Another option to reset a root password is to use init=/bin/bash parameter.


    ```

    kernel /boot/vmlinuz-2.6.17-2-686 root=/dev/hdal ro init=/bin/bash

    ```


    Note that some distributions will disable this option at kernel compile time.


    # 14.2.8. installing grub


    Run the grub-install to install grub. The command requires a destination for overwriting
    the boot sector or mbr.


    ```

    # grub-install /dev/hda

    ```


    You will rarely have to do this manually, since grub is installed when installing
    the operating system and does not need any re-install when changing configuration
    (as is the case for lilo).'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# 14.3. grub2


    # 14.3.1. grub 2.0 ?


    The configuration file is now /boot/grub/grub.cfg. And while this file may look

    familiar, however never edit this file directly (because it is generated!).


    ```

    root@debian:~#$ ls -1 /boot/grub/grub.cfg

    -r--r--r-- 1 root 2453 May 13 17:22 /boot/grub/grub.cfg

    root@debian:~#$ head -3 /boot/grub/grub.cfg

    #nDO NOT EDIT THIS FILE

    #

    ```


    # 14.3.2. /etc/grub.d/40_custom


    The etc/grub.d/40_custom file can be changed to include custom entries. These
    entries are

    autmatically updated.


    ```

    root@debian:~#$ ls -1 /etc/grub.d/40_custom

    -rwr-xr-x 1 root 214 Jul 3 2013 /etc/grub.d/40_custom

    root@debian:~#$ cat /etc/grub.d/40_custom

    #!//bin/sh

    exec tail

    tail -n 3 $0

    # This file provides an easy way to add custom menu entries. Simply type the

    # menu entries you want to add after this comment. Be careful not to change

    # the ''exit tail'' line above.

    ```


    # 14.3.3. /etc/default/grub


    The new configuration file for changing grub is now /etc/default/grub.


    ```

    root@debian:~#$ head /etc/default/grub

    # If you change this file, run ''update-grub'' afterwards to update

    # /boot/grub/grub.cfg

    # For full documentation of the options in this file, see:

    #   info grub -n ''Simple configuration''


    GRUB_DEFAULT=0

    GRUB_TIMEOUT=5

    GRUB_DISTRIBUTOR=`ls_release -i -s 2>/dev/null || echo Debian''

    GRUB_CMDLINE_LINUX="quiet"

    GRUB_CMDLINE_LINUX_debi-installer="en_US"

    ```


    # 14.3.4. update-grub


    Whenever the /etc/default/grub file is changed, you will need to run update-grub
    to apply

    the changes.


    ```

    root@debian:~#$ vi /etc/default/grub

    root@debian:~#$ update-grub

    Generating grub.cfg ...

    Found linux image: /boot/vmlinuz-3.2.0-4-amd64

    Found initrd image: /boot/initrd.img-3.2.0-4-amd64

    done

    ```'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# 14.4. lilo


    # 14.4.1. Linux loader


    lilo is used to be the most Linux bootloader, but is steadily being replaced with
    grub and recently grub2.


    # 14.4.2. lilo.conf


    Here is an example of a lilo.conf file. The delay switch receives a number in
    tenths of a second. The delay below is three seconds, not thirty!


    ```

    boot = /dev/hda

    delay = 30


    image = /boot/vmlinuz

    root = /dev/hda1

    label = Red Hat 5.2


    image = /boot/vmlinuz

    root = /dev/hda2

    label = S.U.S.E. 8.0


    other = /dev/hda4

    table = /dev/hda

    label = MS-DOS 6.22

    ```


    The configuration file shows three example stanzas. The first one boots Red Hat
    from the first partition on the first disk (hda1). The second stanza boots Suse
    8.0 from the next partition. The last one loads MS-DOS.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# 14.5. practice: bootloader


    +   Find out whether your system is using lilo, grub or grub2. Only do the practices
    that are appropriate for your system.


    +   Make a copy of the kernel, initrd and System..map files in /boot. Put the
    copies also in / boot but replace 2.x or 3.x with 4.0 (just imagine that Linux
    4.0 is out).


    +   Add a stanza in grub for the 4.0 files. Make sure the title is different.


    +   Set the boot menu timeout to 30 seconds.


    +   Reboot and test the new stanza.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# # 14.6. solution: bootloader


    0. Find out your system is using lilo, grub or grub2. Only do the practices that
    are appropriate for your system.


    1. Make a copy of the kernel, initrd and System.map files in /boot. Put the copies
    also in /boot but replace 2.x or 3.x (just imagine that Linux 4.0 is out.).


    ```

    ```

    [root@centos65 #]# cut uname -r

    2.62-32-431.11.2.e16.x86_64

    [root@centos65 #]# cp System.map-2.62-32-431.11.2.e16.x86_64 System-map-4.0

    [root@centos65 #]# cp vmlinuz-2.62-32-431.11.2.e16.x86_64 vmlinuz-4.0

    [root@centos65 #]# cp initramfs-2.62-32-431.11.2.e16.x86_64.img initramfs-4.0.img

    ```

    ```


    Do not forget that the initrd (initramfs) files ends in .img.


    2. Add a stanza for grub2 in menu.lst. Make the stanza correct.


    ```

    ```

    [root@centos65 grub]# cut -c70 menu.lst | tail -12

    title CentOS (4.0)

    root (hd0)

    kernel vmlinuz-4.0 ro=/dev/mapper/VolGroup-lv_root rd_NO_LUKS L

    initrd/initramfs-4.0.img

    title CentOS (2.6.32-431.11.2.e16.x86_64)

    kernel vmlinuz-2.6.32-431.11.2.e16.x86_64 ro=/dev/mapper/VolGroup0

    initrd/initramfs-2.6.32-431.11.2.e16.x86_64.img

    title CentOS (2.6.32-431.11.2.e16.x86_64)

    kernel vmlinuz-2.6.32-431.11.2.e16.x86_64 ro=/dev/mapper/VolGroup-lv

    initrd/initramfs-2.6.32-431.11.2.e16.x86_64.img

    ```

    ```


    3. Set the boot timeout to 30 seconds.


    ```

    ```

    [root@centos65 grub]# vi menu.lst

    [root@centos65 grub]# grep timeout /boot/grub/grub.conf

    timeout=30

    ```

    ```


    4. Reboot and test the new stanza.


    ```

    ```

    [root@centos65 #]# reboot

    ```

    ```


    ![](img/b73e4add6be31135074237b0a665e1f4_176_0.png)


    Select your stanza and if it boots then you are correct.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# # Chapter 15. init and runlevels


    Many Unix and Linux distributions use init scripts to start daemons in the same
    way that Unix System V did. This chapter will explain in detail how that works.


    Init starts daemons using scripts, where each script starts one daemon, and where
    each script waits for the previous script to finish. This serial process of starting
    daemons is slow, and although slow booting is not a problem on servers where uptime
    is measured in years, the recent uptake of Linux on the desktop results in user
    complaints.


    To improve Linux startup speed, Canonical has developed upstart, which was first
    used in Ubuntu. Solaris also used init up to Solaris 9, for Solaris 10 Sun developed
    Service Management Facility. Both systems start daemons in parallel and can replace
    the SysV init scripts. There is also an ongoing effort to create itng (init next
    generation).


    In 2014 the systemd initiative has taken a lead when after Fedora, RHEL7 and CentOS7
    also Debian has chosen this to be the preferred replacement for init. The end
    of this module contains an introduction to systemd.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# # 15.1. system init(ialization)


    # ## 15.1.1. kernel process id 1


    The kernel receives system control from the bootloader. After a while the kernel
    starts the **init daemon**. The **init daemon (/sbin/init)** is the first daemon
    that is started and receives process id 1 (PID 1). **It never dies.**


    # ## 15.1.2. configuration in /etc/inittab


    When `/sbin/init` is started, it will first read its configuration file `/etc/inittab`.
    In that file, it will look for the value of initdefault (in 3 in the screenshot
    below).


    ```

    [paul@rhel4 ~]$ grep ^id /etc/inittab

    id=3:initdefault:

    ```


    # ## 15.1.3. initdefault


    The value in **initdefault** indicates the default **runlevel**. Some Linux distributions
    have a brief description of runlevels in /etc/inittab, like here on Red Hat Enterprise
    Linux 4.


    ```

    # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, if you don''t have network)

    # 3 - Full multiuser mode

    # 4 - unid

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    ```


    **Runlevel 0** means the system is shutting down. **Runlevel 1** is used for troubleshooting,
    only the root user can log on, and only at the console. **Runlevel 3** is typical
    for servers, whereas **runlevel 5** is typical for desktops (graphical logon).
    Runlevels 0, 1 and 6, the use may vary depending on the distribution. Debian and
    derived Linux systems have full network and GUI logon on runlevels 2 to 5. So
    verify the proper meaning of runlevels on your system.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 15.1.4. sysinit script


    /etc/rc.d/rc.sysinit


    The next line in /etc/inittab in Red Hat and derivatives is the following.


    ```

    si:sysinit:/etc/rc.d/rc.sysinit

    ```


    This means that independent of the selected runlevel, **init** will run the /etc/rc.d/rc.sysinit
    script. This script initializes hardware, sets some basic environment, populates
    /etc/mtab while maintaining file systems, starts and swap.


    ```

    [paul@rehel#]$ grep -e"# -e^" Sta -e^" Che" /etc/rc.d/rc.sysinit

    # Check SELinux status

    # Initialize hardware

    # Start the graphical boot, if necessary; /usr may not be mounted...

    # Initialize ASCII hits

    # Check filesystems

    # Start the graphical boot, if necessary and not done yet.

    # Check to see if SELinux requires a relabel

    # Initialize pseudo-random number generator

    # Start up swapping.

    # Initialize the serial ports.

    ```


    ```

    grep "* \(Ini|Sta|Che\)".

    ```


    # /etc/init.d/rcS


    Debian has the following line after **initdefault.**


    ```

    si:sysinit:/etc/init.d/rcS

    ```


    **The //init.d/rcS** script will always run on Debian (independent of the selected
    runlevel). The script is actuality all scripts in the **/etc/rcS.d/** directory
    in alphabetical order.


    ```

    root@barry:~# cat /etc/init.d/rcS

    # !bin/sh

    #

    # rcS

    # Call all S??* scripts in /etc/rcS.d/ in numerical/alphabetical order

    #

    ```


    ```

    exec /etc/init.d/rc S

    ```'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# 15.1.5. rc scripts


    Init will continue to wait:/init.initab meets this section on Debian Linux.


    ```

    10:0:wait:/etc/init.d/rc 0

    11:1:wait:/etc/init.d/rc 1

    12:2:wait:/etc/init.d/rc 2

    13:3:wait:/etc/init.d/rc 3

    14:4:wait:/etc/init.d/rc 4

    15:5:wait:/etc/init.d/rc 5

    16:6:wait:/etc/init.d/rc 6

    ```


    In both cases, this means that init will start the rc script with the runlevel
    as the only parameter. Actually /etc/initab means name separated by columns. The
    second field determines the runlevel in which this line should be executed. In
    both cases, only one line of the seven will be executed, depending on the runlevel
    set by itmdefault.


    # 15.1.6. rc directories


    When you take a look of the /etc/rcX/ directories, then you will see a lot of
    (links to) scripts whose name start with uppercase K or uppercase S.


    ```

    [root@HEL52 rc.d#] ls -l | tail -4

    lrwxrwxrxr 1 root 19 Oct 11 2008 S98haldaemon -> ../init.d/haldaemon

    lrwxrwxrxr 1 root 19 Oct 11 2008 S99firstboot -> ../init.d/firstboot

    lrwxrwxrxr 1 root 11 Jan 21 04:16 999local -> ../rc.local

    lrwxrwxrxr 1 root 16 Jan 21 04:17 999smartd -> ../init.d/smartd

    ```


    The /etc/rcX/d directories only contain links to scripts in /etc/init.d/. Allows
    for the script to have a different name, all scripts that start with uppercase
    K or uppercase S will be started in alphabetical order. Those that start with
    K will be started first, with stop as the only parameter. The remaining scripts
    with S will be started with start as the only parameter.


    All this is done by the /etc/rc.d/ script on Red Hat and by the /etc/init.d/re
    script on Debian.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 15.1.7. mingetty


    # mingetty in /etc/inittab


    Almost at the end of RHEL /etc/inittab there is a section to start and respawn
    several mingetty daemons.


    ```

    [root@HEL4b ~]# # grep getty /etc/inittab

    # Run getty in standard runlevels

    1:2345:respawn:/sbin/mingetty tty1

    2:2345:respawn:/sbin/mingetty tty2

    3:2345:respawn:/sbin/mingetty tty3

    4:2345:respawn:/sbin/mingetty tty4

    5:2345:respawn:/sbin/mingetty tty5

    6:2345:respawn:/sbin/mingetty tty6

    ```


    # mingetty and /bin/login


    This /sbin/login will display a message on a virtual console and allow you to
    type a userid. It then executes the /bin/login command with that user. The /bin/login
    program will verify that user exists in /etc/passwd and prompt for (and verify)
    a password. If the password is correct, /bin/login passes control to the shell
    listed in /etc/passwd.


    # respawn mingetty


    The mingetty daemons are started by init and watched until they exit (user exits
    the shell and is logged out). When this happens, the init daemon will respawn
    a new mingetty. Even if you kill a mingetty daemon, it will be restarted automatically.


    This example shows that init respawns mingetty daemons. Look the PID of the last
    two mingetty processes.


    ```

    [root@HEL52 ~]# ps -C mingetty

    PID TTY TIME CMD

    2407 tty1 00:00:00 mingetty

    2408 tty2 00:00:00 mingetty

    2409 tty3 00:00:00 mingetty

    2410 tty4 00:00:00 mingetty

    2411 tty5 00:00:00 mingetty

    2412 tty6 00:00:00 mingetty

    ```


    When we kill the last two mingetys, then init will notice this and start them
    again (with a different PID).


    ```

    [root@HEL52 ~]# kill 2411 2412

    [root@HEL52 ~]# ps -C mingetty

    PID TTY TIME CMD

    2407 tty1 00:00:00 mingetty

    2408 tty2 00:00:00 mingetty

    2409 tty3 00:00:00 mingetty

    2410 tty4 00:00:00 mingetty

    2821 tty5 00:00:00 mingetty

    2824 tty6 00:00:00 mingetty

    ```'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# disabling a mingety


    You can disable a mingety for a certain tty by removing the runlevel from the
    second field in its line in /etc/inittab. Don''t forget to tell init about the
    change of its configuration file with kill -1 .


    The example below shows how to disable mingety on tty3 to tty6 in runlevels 4
    and 5.


    ```

    [root@HEL52 ~]# # grep /etc/inittab

    # Run gettys in standard runlevels

    1:2345:respawn:/sbin/mingety tty1

    2:2345:respawn:/sbin/mingety tty2

    3:23:respawn:/sbin/mingety tty3

    4:23:respawn:/sbin/mingety tty4

    5:23:respawn:/sbin/mingety tty5

    6:23:respawn:/sbin/mingety tty6

    ```'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# 15.2. daemon or demon?


    A daemon is a process that runs in background, without a link to a GUI or terminal.
    Daemons are usually started at system boot, and stay alive until the system shuts
    down. In more recent technical writings, daemons are often referred to as services.


    Unix daemons are not to be confused with demons. Evi Nemeth, co-author of the
    UNIX System Administration Handbook has the following to say about daemons:


    Many people equate the word "daemon" with the word "demon", implying some kind
    of satanic connection between UNIX and the underworld. This is an egregious misunderstanding.
    "Daemon" is actually a much older form of "demon"; daemons have no particular
    bias towards good or evil, but rather help define a person''s character or personality.
    The ancient Greeks'' concept of a "personal daemon" was similar to the modern
    concept of a "guardian angel"....


    # 15.3. starting and stopping daemons


    The K and S scripts are links to the real scripts in /etc/init.d/. These can also
    be used when the system is running to start and stop daemons (or services). Most
    of them accept the following parameters: start, stop, restart, status.


    For example in this screenshot we restart the samba daemon.


    ```

    root@laika:~# /etc/init.d/samba restart

    * Stopping Samba daemons... [ OK ]

    * Starting Samba daemons... [ OK ]

    ```


    You can achieve the same result on RHEL/Fedora with the service command.


    ```

    [root@HEL4b]# service smb restart

    Shutting down SMB services: [ OK ]

    Shutting down NMB services: [ OK ]

    Starting SMB services: [ OK ]

    Starting NMB services: [ OK ]

    ```


    You might also want to take a look at chkconfig, update-rc.d.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# #15.4. chkconfig


    The purpose of chkconfig is to relieve system administrators of manually managing
    all the links and scripts in /etc/init.d and /etc/rcX.d.


    # ##15.4.1. chkconfig --list


    Here we use chkconfig to list the status of a service in the different runlevels.
    You can see that the cron daemon (or service) is only activated in runlevels 2
    to 5.


    ```

    [root@RHEL52 ~]# chkconfig --list crond

    crond 0:off 1:off 2:on 3:on 4:off 5:on 6:off

    ```


    When you compare above with the one below, you can see that off equals to a K
    link to the script, whereas on equals to an S link.


    ```

    [root@RHEL52 etc] find ./rc.d/ -name \* -exec ls -l {} \; | cut -b40-

    .rc0/K60crond -> ../init.d/crond

    .rc1/K60crond -> ../init.d/crond

    .rc2/S90crond -> ../init.d/crond

    .rc3/S90crond -> ../init.d/crond

    .rc4/S90crond -> ../init.d/crond

    .rc5/S90crond -> ../init.d/crond

    .rc6/K60crond -> ../init.d/crond

    ```


    # ##15.4.2. runlevel configuration


    Here you how to use chkconfig to disable (or enable) crond a service in a certain
    runlevel.


    This screenshot shows how to chkconfig to disable crond in runlevel 3.


    ```

    [root@RHEL52 ~]# chkconfig --level 3 crond off

    [root@RHEL52 ~]# chkconfig --list crond

    crond 0:off 1:off 2:on 3:off 4:on 5:on 6:off

    ```


    This screenshot shows how to enable crond in runlevels 3 and 4.


    ```

    [root@RHEL52 ~]# chkconfig --level 3 crond on

    [root@RHEL52 ~]# chkconfig --list crond

    crond 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    ```'
  merge: -1
  pgno: 184
- img_proc: true
  md: "# 15.4.3. chkconfig configuration\n\nEvery script in /etc/init.d/ can have\
    \ (comment) lines to tell chkconfig what to do with the service. The line with\
    \ # chkconfig: contains the runlevels in which the service should be started (2345),\
    \ followed by the priority for start (90) and stop (60).\n\n```\n[root@RHEL52\
    \ ~]## head -9 /etc/init.d/crond | tail -5\n# chkconfig: 2345 90 60\n# description:\
    \ cron is a standard UNIX program that runs user-specified\n# programs at periodic\
    \ scheduled times. voxie cron adds a\n# number of features to the basic UNIX cron,\
    \ including better\n# security and more powerful configuration options.\n```\n\
    \n# 15.4.4. enable and disable services\n\nServices can be enabled or disabled\
    \ in all runlevels with one command. Runlevels 0, 1 and 6 are always stopping\
    \ services (or calling the scripts with stop) even when their name starts with\
    \ uppercase.\n\n```\n[root@RHEL52 ~]# chkconfig crond off\n[root@RHEL52 ~]# chkconfig\
    \ --list crond\ncrond\n  0:off 1:off 2:off 3:off 4:off 5:off 6:off\n[root@RHEL52\
    \ ~]# chkconfig crond on\n[root@RHEL52 ~]# chkconfig --list crond\ncrond\n  0:off\
    \ 1:off 2:on 3:on 4:on 5:on 6:off\n```"
  merge: -1
