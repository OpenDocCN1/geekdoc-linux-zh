    The HWADDR can be used to make sure each network card gets the correct name when
    multiple network cards are present in the computer. It can not be used to assign
    a mac address to a network card. For this, you need to specify the MACADDR variable.
    Do not use HWADDR and MACADDR in the same ifcfg-ethx file.


    The BROADCAST= and NETWORK= parameters from previous RHEL/Fedora versions are
    obsolete.


    # 22.3.3. nmcli


    On RHEL7 you should run nmcli reload if you changed configuration files in /etc/sysconfig/
    to enable your changes.


    The nmcli has many options for configuring networking on the command line in RHEL7/
    CentOS7


    ```

    man nmcli

    ```


    # 22.3.4. nmtui


    Another recommendation for RHEL/CentOS7 is to use nmtui. This tool will use a
    ''windowed'' interface in command line to manage network interfaces.


    ```

    nmtui

    ```'
