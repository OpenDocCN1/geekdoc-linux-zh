    Recent Linux distributions (Debian, Ubuntu, ...) use grub with a uuid to identify
    the root file system.


    This example shows how a root=/dev/sda is replaced with a uuid.


    | title | Ubuntu 9.10, kernel 2.6.31-19-generic |

    |---|---|

    | uuid | f001ba5d-9077-422a-9634-82d3d5e7282a |

    | kernel | /boot/mlinuz-2.6.31-19-generic \ \

    | root=UUID=f001ba5d-9077-422a-9634-82d3d5e7282a ro quiet splash |

    | initrd | /boot/initrd.img-2.6.31-19-generic |


    The screenshot above contains only four lines. The line starting with root= is
