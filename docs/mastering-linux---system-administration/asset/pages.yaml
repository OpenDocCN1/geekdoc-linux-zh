  md: '# 22.3. RHEL nic configuration


    # 22.3.1. /etc/sysconfig/network


    The /etc/sysconfig/network file is a global (across all network cards) configuration
    file. It allows us to define whether we want networking (NETWORKING=yes), what
    the hostname is (HOSTNAME=) and which gateway to use (GATEWAY=).


    ```

    root@rhel6 ~# cat /etc/sysconfig/network

    NETWORKING=yes

    HOSTNAME=rhel6

    GATEWAY=192.168.1.1

    ```


    There are dozen more options sizable in this file, details can be found in /usr/share/doc/initscripts-*/sysconfig.txt.


    Note that this file contains no settings at all in a default RHEL7 install (with
    networking enabled).


    ```

    root@rhel7 ~## cat /etc/sysconfig/network

    # Created by anaconda

    ```


    # 22.3.2. /etc/sysconfig/network-scripts/ifcfg-


    Each card can be configured individually using the /etc/sysconfig/network-scripts/ifcfg-*
    files. When you have only one network card, then this will probably be /etc/sysconfig/network-scripts/ifcfg-eth0.


    # dhcp client


    Below a screenshot of /etc/sysconfig/network-scripts/ifcfg-eth0 configured for
    dhcp (BOOTPROTO=dhcp). Note also the NM_CONTROLLED parameter to disable control
    of this nic by Network Manager. This is not explained (not even mentioned) in
    /usr/share/doc/initscripts-*/sysconfig.txt, but many others are.


    ```

    root@rhel6 ~# cat /etc/sysconfig/network-scripts/ifcfg-eth0

    DEVICE=eth0

    HWADDR=00:08:27:DD:0D:5C

    NM_CONTROLLED="no"

    BOOTPROTO="dhcp"

    ONBOOT="yes"

    ```


    The BOPROTO variable can be set to either dhcp or bootop, anything else will be
    configured static meaning there be no protocol at boot time to set the interface
    values.


    RHEL7 adds ipv6 to this file.


    ```

    root@rhel7 network-scripts~# cat ifcfg-enp0s3

    TYPE="Ethernet"

    BOOTPROTO="dhcp"

    DEFAULT="yes"

    PEERDNS="yes"

    PEEROUTES="yes"

    IPV4_FAILURE_FATAL="no"

    ```'
  merge: -1
