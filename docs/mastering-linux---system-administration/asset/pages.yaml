  md: "# 11.11. manage physical volumes\n\n# 11.11.1. pvcreate\n\nUse the **pvcreate**\
    \ command to add devices to lvm. This example shows how to add a disk (or hardware\
    \ RAID device) to lvm.\n\n```\n[root@RHEL5 ~]## pvcreate /dev/sdb\n  Physical\
    \ volume \"dev/sdb\" successfully created\n[root@RHEL5 ~]##\n```\n\nThis example\
    \ shows how to add a partition to lvm.\n\n```\n[root@RHEL5 ~]## pvcreate /dev/sdc1\n\
    \  Physical volume \"dev/sdc1\" successfully created\n[root@RHEL5 ~]##\n```\n\n\
    You can also add multiple disks or partitions as target to pvcreate. This example\
    \ adds three disks to lvm.\n\n```\n[root@RHEL5 ~]## pvcreate /dev/sda /dev/sdf\
    \ /dev/sdg\n  Physical volume \"dev/sda\" successfully created\n  Physical volume\
    \ \"dev/sdf\" successfully created\n  Physical volume \"dev/sdg\" successfully\
    \ created\n[root@RHEL5 ~]##\n```\n\n# 11.11.2. pvremove\n\nUse the **pvremove**\
    \ command to remove physical volumes from lvm. The devices may not be in use.\n\
    \n```\n[root@RHEL5 ~]## pvremove /dev/sda /dev/sdf /dev/sdg\n  Labels on physical\
    \ volume \"dev/sda\" successfully wiped\n  Labels on physical volume \"dev/sdf\"\
    \ successfully wiped\n  Labels on physical volume \"dev/sdg\" successfully wiped\n\
    [root@RHEL5 ~]##\n```\n\n# 11.11.3. pvresize\n\nWhen you use **fdisk** to resize\
    \ a partition on a disk, then use **pvresize** to make lvm recognize the new size\
    \ of the physical volume that represents this partition.\n\n```\n[root@RHEL5 ~]##\
    \ pvresize /dev/sde1\n  Physical volume \"dev/sde1\" changed\n  1 volume(s) resized\
    \ 0 physical volume(s) not resized\n```"
