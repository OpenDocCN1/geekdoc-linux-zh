  md: '# 17.3. logger


    The logger command can be used to generate syslog test messages. You can aslo
    it in scripts. An example of testing syslog with the logger tool.


    ```

    [root@rhel6a ~]# logger -p local14.debug "14 debug"

    [root@rhel6a ~]# logger -p local14.crit "14 crit"

    [root@rhel6a ~]# logger -p local14.emerg "14 emerg"

    [root@rhel6a ~]# #

    ```


    The results of the tests with:


    ```

    [root@rhel6a ~]# cat /var/log/critandabove

    Feb 14 19:55:19 rhel6a paul: 14 crit

    Feb 14 19:55:28 rhel6a paul: 14 emerg

    [root@rhel6a ~]# cat /var/log/onlycrit

    Feb 14 19:55:19 rhel6a paul: 14 crit

    [root@rhel6a ~]# cat /var/log/aillocal

    Feb 14 19:55:11 rhel6a paul: 14 debug

    Feb 14 19:55:19 rhel6a paul: 14 crit

    Feb 14 19:55:28 rhel6a paul: 14 emerg

    [root@rhel6a ~]# #

    ```


    # 17.4. watching logs


    You might want to use the tail -f command to look at the last lines of a log file.
    The -f option will dynamically display lines that are appended to the log.


    ```

    paul@ubi0010:~$ tail -f /var/log/udev

    SEQNUM=1741

    SOUND_INITIALIZED=1

    ID_VENDOR_FROM_DATABASE=Nvidia Corporation

    ID_MODEL_FROM_DATABASE=MCP79 High Definition Audio

    ID_BUS=pci

    ID_VENDOR_ID=0x10de

    ID_PATH=pci-0000:00.08.0

    SOUND_FORM_FACTOR=internal

    ```


    You can automatically repeat commands by preceding them with the watch command.
    When executing the following:


    ```

    [root@rhel6 ~]# watch who

    ```


    Something like this, repeating the output of the who command every two seconds,
    will appear on the screen.


    ```

    Every 2.0s: who

