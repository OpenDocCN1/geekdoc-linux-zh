    # 30.8. split


    The split command is useful to split files into smaller files. This can be useful
    to fit the file into multiple instances of a medium too small to contain the complete
    file. In the example below, a file of size 5000 bytes is split into three smaller
    files, with maximum 2000 bytes each.


    ```

    paul@laika:~/test$ ls -l

    total 8

    -rw-r--r-- 1 paul 5000 2007-07-09 20:46 bigfile

    paul@laika:~/test$ split -b 2000 bigfile splitfile.

    paul@laika:~/test$

    total 20

    -rw-r--r-- 1 paul 5000 2007-07-09 20:46 splitfile.aa

    -rw-r--r-- 1 paul 2000 2007-07-09 20:47 splitfile.ab

    -rw-r--r-- 1 paul 2000 2007-07-09 20:47 splitfile.ac

    -rw-r--r-- 1 paul 1000 2007-07-09 20:47 splitfile.ac

    ```


    # 30.9. practice: backup


    !! Careful with tar options and the position of the backup file, mistakes can
    destroy your system!!


    1. Create a directory (or partition if you like) for backups. Link (or mount)
    it under /mnt/backup.'
