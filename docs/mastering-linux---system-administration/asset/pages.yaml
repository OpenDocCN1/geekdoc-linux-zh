  md: '# 20.2. deb package management


    # 20.2.1. about deb


    Most people use aptitude or apt-get to manage their Debian/Ubuntu family of Linux
    distributions. Both are a front for dpkg and are themselves a back end for synaptic
    and other graphical tools.


    # 20.2.2. dpkg -l


    The low level tool to work with .deb packages is dpkg. Here you see how to obtain
    a list of all installed packages on a Debian server.


    ```

    root@debian6:~ dpkg -l | wc -1

    265

    ```


    Compare this to the same list on a Ubuntu Desktop computer.


    ```

    root@ubuntu204-\# dpkg -l | wc -1

    2527

    ```


    # 20.2.3. dpkg -l $package


    Here is an example of how to get information on an individual package. The ii
    at the beginning means the package is installed.


    ```

    root@debian6:~# dpkg -l rsync | tail -1 | tr -s '' '' \

    ii rsync 3.0.7-2 fast remote file copy (like rcp)

    ```


    # 20.2.4. dpkg -S


    You can find a certain file on your computer with dpkg -S. This example shows
    how to find the package for files on a typical Debian server.


    ```

    root@debian6:~# dpkg -S /usr/share/doc/tmux/ /etc/ssh/ssh_config /sbin/ifconfig

    tmux: /usr/share/doc/tmux/

    openssh-client: /etc/ssh/ssh_config

    net-tools: /sbin/ifconfig

    ```


    # 20.2.5. dpkg -L


    You can get a list of all files that are installed by a certain program. Below
    is the list for the tmux package.


    ```

