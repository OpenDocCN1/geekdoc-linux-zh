- img_proc: true
  md: '# 15.10. solution : init


    +   1. Change /etc/inittab so that only two minggetys are respawned. Kill the
    other minggetty and verify that they don''t come back.


    Killing the minggetty will result in init respawning them. You can edit /etc/inittab
    so it looks like the screenshot below. Don''t forget to also run kill -1 1.


    ```

    [root@RHEL5 ~]# grep getty /etc/inittab

    # Run getys in standard runlevels

    1:2345:respawn:/sbin/minggetty tty1

    2:2345:respawn:/sbin/minggetty tty2

    3:2:respawn:/sbin/minggetty tty3

    4:2:respawn:/sbin/minggetty tty4

    5:2:respawn:/sbin/minggetty tty5

    6:2:respawn:/sbin/minggetty tty6

    [root@RHEL5 ~]#

    ```


    +   2. Use the Red Hat Enterprise Linux virtual machine. Go to runlevel 5, display
    the current and previous runlevel, then go back to runlevel 3.


    ```

    init 5 (watch the console for the change taking place)

    runlevel

    init 3 (again you can follow this on the console)

    ```


    +   3. Is the sysinit script on your computers setting or changing the PATH environment
    variable ?


    On Red Hat, for PATH in /etc/rc.sysinit check, on Debian/Ubuntu check /etc/rc.local
    and /etc/init.rc.local. The answer is probably no, but on RHEL5 the rc.sysinit
    script does set the HOSTNAME variable.


    ```

    [root@RHEL5 etc]# grep HOSTNAME rc.sysinit

    ```


    +   4. List all init.d scripts that are started in runlevel 2.


    ```

    root@RHEL5 ~ chkconfig --list | grep ''2:on''

    ```


    +   5. Write a script that acts like a daemon script in /etc/init.d/. It should
    have a case statement to act on start/restart and status. Test the script!


    The script could look like this:


    ```

    #!/bin/bash

    #

    # chkconfig: 345 99 01

    # description: pold demo script

    # /etc/init.d/pold

    ```'
  merge: -1
