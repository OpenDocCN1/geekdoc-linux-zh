- img_proc: true
  md: '# 29.1. introduction


    With libraries we are talking dynamically linked libraries (aka shared objects).
    These are binaries that contain functions and are not started themselves as programs,
    but are called by other binaries.


    Several programs can use the same library. The name of the library file usually
    starts with lib, followed by the actual name of the library, then the characters
    .so and finally a version number.


    # 29.2. /lib and /usr/lib


    When you look at the /lib or the /usr/lib directory, you will see a lot of symbolic
    links. Most libraries have a detailed version number in their name, but receive
    a symbolic link from a filename which contains the major version.


    ```

    root@rhel53 $ ls -l /libext2fs*

    rwxr-xr-x 1 root root 16 Feb 18 16:36 /libext2fs.so.2 -> libext2fs.so.2.4

    rwxr-xr-x 1 root root 113K Jun 30 2009 /libext2fs.so.2.4

    ```


    # 29.3. lld


    Many programs have dependencies on the installation of certain libraries. You
    can display these dependencies with lld.


    This example shows the dependencies of the su command.


    ```

    paul@RHEL5 $ ldd /bin/su

    linux-gate.so.0 => (0x003f7000)

    libpam.so.0 => /lib/libpam.so.0 (0x00d5c000)

    libpam_misc.so.0 => /lib/libpam_misc.so.0 (0x0073c000)

    libcrypt.so.1 => /libcrypt.so.1 (0x00aa4000)

    libdl.so.2 => /lib/libdl.so.2 (0x00800000)

    libc.so.6 => /lib/libc.6 (0x00ec1000)

    libaudit.so.0 => /lib/libaudit.so.0 (0x0049f000)

    /lib/ld-linux.so.2 (0x04769c00)

    ```'
  merge: -1
  pgno: 353
- img_proc: true
