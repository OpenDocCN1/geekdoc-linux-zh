- img_proc: true
  md: 'will contain all changes since Tuesday (the last level 2-1). A level 3 backup
    on Thursday

    will contain all changes since Wednesday (the last level 3-1). Another level 3
    on Friday

    will also contain all changes since Wednesday. A level 2 backup on Saturday would
    take

    all changes since the last level 1 from Tuesday.


    # 30.5. dump and restore


    While dump is similar to tar, it is also very different because it looks at the
    file system.

    Where dump receives a lists of files to backup, dump will find files to dump by
    itself

    by examining ext2. Files found by dump will be copied to a tape or regular file.
    In case the

    target is not big enough to hold the dump (end-of-media), it is broken into multiple
    volumes.


    Restoring files that were backed up with dump is done with the restore command.
    In the

    example below we take a full level 0 backup of two partitions to a SCSI tape.
    The rewind

    is mandatory to verify that files match each other on the tape.


    ```

    dump 0 /dev/nst0 /boot

    dump 0 /dev/nst0 /

    ```


    Listing files in a dump archive is done with dump -t, and you can compare files
    with dump

    -C.


    You can omit files from a dump by changing the dump attribute with the chatter
    command.

    The d attribute will tell dump to skip the file, even during a full backup. In
    the

    example, /etc/hosts is excluded from dump archives.


    ```

    chattr +d /etc/hosts

    ```


    To restore the complete file system with restore, use the -r option. This can
    be useful to

    change the size or block size of a file system. You should have a clean file system
    mounted

    and cd into it. Like this example shows.


    ```

    mk2fs /dev/hda3

    mount /dev/hda3 /mnt/data

    cd /mnt/data

    restore rf /dev/nst0

    ```


    To extract only one file or directory from a dump, use the -x option.


    ```

    restore -xf /dev/st0 /etc

    ```


