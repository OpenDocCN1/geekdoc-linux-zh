  md: '# 25.4. scp


    The scp command works just like cp, but allows the source and destination of the
    copy to be behind ssh. Here is an example where we copy the /etc/hosts file from
    the remote server to the home directory of user paul.


    ```

    paul@ubuntu204:~~$ sc admin42@192.168.1.30:/etc/hosts /home/paul/serverhosts

    admin42@192.168.1.30''s password:

    hosts                     100%   809      0.8KB/s  00:00

    ```


    Here is an example of the reverse, copying a local file to a remote server.


    ```

    paul@ubuntu204:~$ ~/serverhosts admin42@192.168.1.30:/etc/hosts.new

    admin42@192.168.1.30''s password:

    serverhosts             100%   809      0.8KB/s  00:00

