    ```\n\n# 28.4.11. depmod\n\nThe modules.dep file can be updated (recreated) with\
    \ the depmod command. In this screenshot no modules were added, so depmod generates\
    \ the same file.\n\n```\nroot@berry://lib/modules/2.6.17-2-x86#$ ls -1 modules.dep\n\
    -rw-r--r-- 1 root 310676 2008-03-01 16:32 modules.dep\nroot@berry://lib/modules/2.6.17-2-x86#$\
