    brother Van created a documentary film, iPod’s Dirty Secret, to tell the story.
    The Neistat brothers released their film on the Web, and all sorts of craziness
    broke loose. Many iPod users agreed with the film’s premise, while others came
    to Apple’s defense. Casey Neistat was quoted on the subject in an article in the
    Washington Post:


    > “We got close to 1,000 e-mails the first couple of days, a lot of people were
