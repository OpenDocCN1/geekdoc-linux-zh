    FIGURE 2-3: Belkin Media Reader connected to iPod. Courtesy of Belkin.


    to worry about the competing standards when deciding whether this reader will
    work for you. Just make sure your camera uses one of the six supported types,
    which is nearly a sure thing, and you’ll be compatible.


    To use the Media Reader, you open the nifty sliding door that protects the media
    slots, then put in your card. Connect the reader to the iPod’s dock connector.
    The iPod reacts by asking if you want to import photos from the media card. If
    you say you do, the photos are copied over while you watch a progress screen on
    the iPod. Copied photos are stored by roll number. Once the photos are copied
    over, you can delete them from the media card so you can go take more award-winning
    photos of rocks and dirt.


    Once the photos are in the iPod, what can you do with them? You can get information
    about them, such as the number of pictures in a roll and the type of media they
    were stored on. Once you reconnect to your computer, you can copy the photos over
    by using any software that imports digital photos, such as iPhoto, or you can
    copy them manually by looking in the cryptically named DCIM (digital camera images)
    folder on the iPod.


    One thing you can’t do with the photos, unfortunately, is look at them on your
    iPod. The iPod screen graphics capability is limited, and there’s no software
    support for showing images on the screen. Maybe this feature will show up in a
    future iPod.


    The Belkin Media Reader for iPod works with 3G iPods. It’s sold at Apple stores,
    including the online store (www.apple.com/store), and many other places for about
    $100.'
