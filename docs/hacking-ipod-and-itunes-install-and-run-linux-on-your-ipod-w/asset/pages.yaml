    # Equal Opportunity


    When you create a smart playlist with more than one condition, and you use the
    “Match any of the following conditions” setting, as we’ve done here by making
    a playlist with three artists, iTunes does some clever figuring to make sure the
    playlist has a fair distribution of music. iTunes determines how much of your
    library is represented by each condition, then makes sure the playlist has the
    same proportion of songs. So, for example, if you create a playlist of songs from
    The Buoyss and the The Seeds, and you have twice as many songs by The Seeds in
    your library as you do The Buoyss, the playlist will also have twice as many songs
    by The Seeds.


    # Burning Long Playlists


    Sometimes you’ll want to burn a playlist without caring whether it fits on a single
    CD. When you do, you’ll discover that iTunes has a great feature that supports
    long playlists. Select your long playlist and click Burn Disc. iTunes checks out
    the CD you’ve inserted and compares it to the selected playlist. If the playlist
    won’t fit on a single CD, iTunes will tell you so. But it’s not an error message!
    No, instead it’s a *helpful* message that offers to burn the playlist on multiple
