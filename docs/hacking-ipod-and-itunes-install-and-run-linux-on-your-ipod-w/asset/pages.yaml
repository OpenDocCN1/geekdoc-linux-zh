- pgno: 78
  md: 'This hack is only applicable when the iPod is running on battery power. When
    it''s connected to a powered cable, the iconic battery meter reappears.


    To turn on this hack, you simply need to create the magic file (its contents don''t
    matter) in the iPod''s `iPod_Control/Device` directory. The tricky part is that
    `iPod_Control` is hidden from the Finder and from Windows Explorer. I''ll describe
    how to accomplish this on both Mac OS X and Windows.


    # Mac OS X


    There are a couple of different ways to perform this hack with Mac OS X. The first
    requires a third-party utility program, but it''s pretty easy. The second uses
    standard software only, but it''s a little trickier.


    # Use the Finder and a utility program


    The easiest way to do this hack is with a program like TinkerTool (available at
    `www.bresink.com/osx/TinkerTool.html` and described in more detail in the next
    chapter), which lets you make all the files on your iPod visible. Here''s how:


    +   Make sure your iPod is connected to your Mac.

    +   In TinkerTool, click the **Finder** tab and check **"Show hidden and system
    files"**.

    +   Click **"Relaunch Finder"**.

    +   In the Finder, choose **Go  Computer** to see your iPod and other volumes.

    +   Still in the Finder, open your iPod, then the **`iPod_Control`** folder, then
    the **Device** folder (see Figure 3-3).

    +   Click the **SysInfo** file and choose **File  Duplicate**.

    +   Click once on the **SysInfo Copy** file to select it. Wait a second or so.
    Then click its name once to select it for renaming.

    +   Change the name of **SysInfo Copy** to **_show_voltage**. Note that there''s
    an underscore before "show" and another before "voltage".


    If you click twice on **SysInfo Copy** too quickly, the Finder will open the file
    in TextEdit. If that happens, calmly return to the Finder and repeat step 6, waiting
    a second between clicks.


    This works because the iPod only cares that there''s a file named `_show_voltage`—its
    contents are never examined. It doesn''t matter how you create the file or what''s
    in it. **SysInfo** is simply a small file that''s conveniently there for the copying.


    When you disconnect your iPod, the battery meter will be replaced by a number
    indicating the battery charge, with 500 or so as the maximum value. Neat!'
  merge: -1
  img_proc: true
