    # Hacking the Culture: The Pepsi Anolog Hack


    Apple made a huge marketing splash early in 2004 by hooking up with Pepsi for
    a giveaway. Pepsi shipped 300 *million* bottles of its products that advertised
    a chance to win a free song on the iTunes Music Store if there was a special code
    under the cap. One third of the caps were winners, while the other 200 million
    held only soda pop, not free music. (See Figure 11-9.)


    A few weeks into the contest, somebody figured out a way to tell in advance if
    you were going to win. If you tilted the bottle at a 45-degree angle and looked
    hard through the plastic at the underside of the cap, you could generally tell
    if the cap was a winner or not. With this hack, a diligent soft drink consumer
    could ensure that his bottle included a .99 musical prize before buying it. This
    is a great example of how hacking can expand beyond the limits of computers, digital
    devices, and high technology in general. And this hack is arguably ethical: the
    prizes were being given out anyway, and the hack simply improves the hacker''s
    odds. Of course, the proprietor of your local store might disagree if you spend
    an hour hanging around and peering through his Pepsi products.


    ![](img/f481d8a0ca491080698039f72bf96e1b_266_0.png)


    FIGURE 11-9: Pepsi iTunes giveaway redemption screen. Used by permission of PepsiCo.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# ## Use iTunes Music Store Links


    When the music store first opened, clever shoppers soon discovered that Apple
    was using a system of Web-style URLs to refer to items in the store. By observing
    this URL system at work, you could decode what iTunes was doing and construct
    your own URLs that linked to songs, albums, and artists in the store. When you
    tried to open these links in a Web browser, iTunes would take control and go to
    the desired page. This was very cool. Later, Apple provided more information and
    features for using store links.


    In this section, we''ll discuss links to iTunes Music Store items and how to make
    them, share them, and have fun with them.


    # ### Get and share iTunes Music Store links


    With iTunes 4.1 and later versions, Apple has made it incredibly easy for you
    to share a link to an item in the store. To grab the URL for any item, just right-click
    (or Control-click on a Mac) the item, then choose Copy iTunes Music Store URL
    from the menu. You''re now loaded up with a link to the song, artist, or album
    that you can paste anywhere the text goes, such as in an e-mail or a Web article
    you''re writing.


    You can use drag and drop as a more direct way to get an item''s link. Just drag
    a song or album cover and drop it into a target, such as a text document, and
    the store link travels along. Neat!


    When you (or your e-mail recipient) click a link to a music store item, iTunes
    is summoned, connects to the music store, and displays the requested thing. Of
    course, once you''re in the store, you can buy the song or album if you want,
    which is a big reason why Apple likes having these links.


    # ### Make Music Store URLs


    You don''t even have to be in iTunes to construct a link to a store item. Apple
    provides a cool Web page called iTunes Link Maker to help you out. This page,
    located at www.apple.com/itunes/linkmaker, lets you enter a song, album, or artist
    (or all of these), then automatically produces HTML containing a link to the item
    you want. You can then take the HTML and put it on your own Web site. Apple even
    provides a helpful badge and link that lets users download a free copy of iTunes
    if they don''t have it. Figure 11-10 shows the page produced by the iTunes Link
    Maker.


    # ### Make your own celebrity playlists and iMixes


    Why should celebrities have all the fun? Mac programming master John Vink has
    created the Celebrity Playlist Maker. This cool program lets you pick one of your
    playlists and'
