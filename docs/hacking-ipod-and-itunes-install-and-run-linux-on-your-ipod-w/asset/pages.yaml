    # Put Large Text Documents on Your iPod


    ![](img/f481d8a0ca491080698039f72bf96e1b_108_1.png)


    > **Note** This hack works on Macintosh computers only.


    The iPods introduced by Apple in 2003 and later, including the iPod mini, featured
