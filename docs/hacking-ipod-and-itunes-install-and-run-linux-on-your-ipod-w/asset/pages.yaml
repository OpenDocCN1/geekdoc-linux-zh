- pgno: 271
  md: '# # Miscellaneous Store Hacks


    This section describes a few uncategorizable ways to have fun with the iTunes
    Music Store, from having the store send you reports of new releases to using the
    store to diagnose a bad Internet connection.


    # ## Get listings sent to you


    As we''ve seen in this chapter, a big part of the fun of the iTunes Music Store
    is browsing. It''s not hard to spend hours in the store just wandering around
    and enjoying the music. But you can also do the reverse: ask the store to send
    you highly focused information about what you want.


    You can get information about iTunes Music Store content by subscribing to *RSS
    feeds* from Apple. RSS, which stands for Really Simple Syndication, is a file
    format that''s designed to allow a Web site or other source to summarize information
    in an XML file and make it available for interested parties to read. Programs
    called RSS news readers grab RSS feeds and display them for you to read. When
    you subscribe to iTunes Music Store RSS feeds, your news reader gets new information
    when it''s available. Instead of using iTunes to go through the store to find
    new stuff, the store delivers the news to you.


    Apple publishes several RSS feeds for the store:


    +   ■ Top Songs

    +   ■ Top Albums

    +   ■ New Releases

    +   ■ Just Added

    +   ■ Featured Albums & Exclusives


    For example, if you subscribe to the Top Songs feed, you''ll get a list of the
    hottest songs in the store delivered to your news reader every day. For each feed,
    you can choose to receive either 10 or 25 items. To subscribe to these feeds and
    to learn more about everything Apple does with RSS so you can spend even more
    of your time messing around with computer stuff, go to `www.apple.com/rss`. That
    page also provides links to a couple of RSS news readers, NetNewsWire for Macintosh
    and FeedDemon for Windows.


    In addition to these standard feeds, Apple provides a way for you to construct
    your own custom RSS feeds that are narrowly focused on what you want. The custom
    feeds let you limit your news feeds to a particular genre or set of genres. You
    can also choose to receive fewer than 10 or more than 25 items at once. Use the
    page at `phobos.apple.com/ webobjects/MzSearch.woa/wo/4.1` to generate your custom
    RSS feeds, as shown in Figure 11-13.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_272_0.png)


    **FIGURE 11-13:** Apple makes it easy to create your own custom RSS feeds.


    # # Watch videos and movie trailers


    The iTunes Music Store isn''t just for audio—you can also find some visual treats
    there. The Store includes more than 100 music videos for your amusement. You can''t
    download them, but you can watch them in the Store. To check out the videos, just
    click "Music Videos" on the Store''s home page.


    The iTunes Music Store doesn''t sell movies, but it offers a constantly updated
    collection of movie trailers for new releases and DVDs. As the originator of QuickTime
    technology, Apple has a long tradition of supplying movie trailers on the Internet.
    And the fact that Steve Jobs is a movie mogul himself—he''s the chairman of animation
    studio Pixar—keeps'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Apple interested in what''s happening in the movie world. To see movie trailers,
    click the “Movie Trailers” link on the iTunes Music Store''s home page.


    # # Use iTunes Music Store to check your connection


    iTunes has a Web browser buried inside it, and it uses that browser to connect
    to the store when you get the urge to do some shopping. The store and iTunes together
    form a very reliable pair. In fact, iTunes provides a great way to figure out
    if your Internet connection is working or not. If you''re having trouble with
    your Web browser or e-mail program and you suspect your connection is flaky, click
    Music Store in the sources list. If you see the progress bar start to fill up
    and you''re taken to the store, you know that your Internet connection is working
    OK, and the problem must lie somewhere else.


    If you have recently been in the store, iTunes remembers the last page you looked
    at and shows you a cached version without actually connecting. To force a connection,
    just click any link on the page it''s showing. Then watch the progress bar to
    see if your Internet connection is severed, or if you''re just having trouble
    with an unreliable Web site or confused browser.


    # # Rebuild “Purchased Music” playlist


    As you buy tunes from the store, iTunes adds them to a special playlist it created
    for you called “Purchased Music”. This playlist provides a handy reminder of what
    you''ve downloaded, so you can be sure to listen to your purchases. However, if
    you never use this playlist and you would rather not have it hanging around, you
    can delete it. If you do delete the “Purchased Music” list and you feel remorse
    later, you can get it back:


    +   1. Choose Advanced ⇄ Check for Purchased Music. You''ll have to supply your
    account name and password.

    +   2. iTunes will connect to the store and you''ll most likely see a message
    that says “All purchased music has been downloaded for this account.” As a side
    effect, the “Purchased Music” playlist is back—take a look at the sources list
    to confirm.

    +   3. Although “Purchased Music” has been resurrected, it''s blank. You have
    to find the songs yourself and add them to the list. To do this, select Library
    in the sources list.

    +   4. Click in the Search box and type **Protected AAC.** This is the format
    for all music that the store sells, so it should find all the songs you''ve bought.
    Hey, that''s a lot of songs!

    +   5. Click anywhere in the song list to move the focus there, then choose Edit
    ⇄ Select All.

    +   6. With all your purchases now selected, drag them to “Purchased Music” and
    drop them there.

    +   7. Now “Purchased Music” is back, and when you buy new tunes, they''ll get
    added to the list.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_274_0.png)


    # **Note**


    If a song is downloading and something happens before it finishes—you quit iTunes,
    your net-work connection is lost, a bear steals your computer—you can still get
    the song you paid for. Just use the **Check for Purchased Music** item in the
    **Advanced** menu, and iTunes will automati-cally resume downloading any music
    that didn''t quite get there previously.


    # ## Close the store


    For our last trick, we present the ultimate anti-store hack: getting rid of it,
    at least in your copy of iTunes. If you find the store too tempting to have around,
    you can turn it off entirely. In **iTunes Preferences**, go to the **Store** tab,
    uncheck the “**Show iTunes Music Store**” box, and click OK. Poof, the store is
    gone from the **Sources** list. Of course, if you ever want to bring it back,
    it''s as simple as returning to Preferences and checking the box again.


    # Never Can Say Goodbye


    Even if you have the store turned off in your copy of iTunes, clicking one of
    those links to con-tent in the store (as described in *Use iTunes Music Store
    Links*) still takes you to the store. Unchecking the “**Show iTunes Music Store**”
    box in Preferences just removes the store icon from the **Sources** list—it doesn''t
    actually get you kicked out of the store.


    # ## Summary


    The iTunes Music Store is a great place to spend a few hours or a few dollars.
    The store is just as cheap as you want it to be: you can browse for hours without
    spending a dime, get something great for 99 cents, or buy a few albums and audio
    books as you ring up a bill of $100 or more. It''s very easy to get lost in the
    store even if you''re not spending money. This chapter took longer to write than
    it should have because I couldn''t resist stopping and listening to previews,
    sampling audio books, reading artist biographies, and taking Billboard-chart-induced
    nostalgia trips. Have a great time shopping in the store, and come on back for
    more hacky stuff next in the Appendices.'
  merge: -1
  img_proc: true
