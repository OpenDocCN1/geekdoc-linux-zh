  md: 'iTunes Visualizer Plug-in Software Development Kit (SDK), which you can get
    from Apple at http://developer.apple.com/sdk/#iTunes. There are two versions of
    the kit, one for Macintosh and one for Windows. To develop a Mac plug-in, you
    can use Apple''s free Xcode tools or Metrowerks CodeWarrior. The Windows SDK works
    with Microsoft Visual Studio.


    # ## Summary


    Adding AppleScripts to iTunes can make your music listening and management a lot
    smoother, especially for tasks like cleaning out duplicates and dead tracks. If
    you want something to look at while you''re listening to great music, the Visualizer
    has an almost infinite variety of nifty graphics to see. And if you''re a programmer
    type, or you want to be, you can learn how to create your own scripts and visual
    plug-ins for iTunes.


    In the next chapter, you''ll move beyond mere software and into the realm of hardware
    add-ons to extend the reach of iTunes and your computer.'
