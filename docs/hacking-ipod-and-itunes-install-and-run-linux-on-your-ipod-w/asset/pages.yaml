- pgno: 94
  md: '# # Way Beyond the Music: Software


    ![](img/f481d8a0ca491080698039f72bf96e1b_94_0.png)


    Computers are cursed with high expectations and amazing flexibility. A toaster
    is built to toast, and a refrigerator keeps things cold, but a computer is a general-purpose
    machine that can be made to perform an incredible variety of tasks. Because computer
    designers and engineers are creative people, it practically hurts them to put
    limits on what a computer or a program can do. But it’s those limits, artfully
    applied, that define great digital products by focusing the attention of the designers
    and the users on the product’s goal.


    No product illustrates this principle of focus better than the iPod. In general
    terms, the iPod is not a music player: it’s a computer. But when the original
    iPod appeared, Apple chose to limit its applications to music. Apple pointedly
    decided not to make the iPod into a platform for outside software developers.


    But nerds are clever, and people quickly found ways to sneak extra features into
    their iPods. Determined iPod fans figured out how to disguise data as songs, and
    soon names and phone numbers started showing up on iPods alongside the music.
    Apple noticed this trend and began adding features of its own to the basic iPod
    software. Every iPod now has the native ability to hold contacts and calendars,
    and newer iPods (those with dock connectors) let you store notes.


    Naturally, when people got hold of these additions, they built additional additions
    on top of them. Using the Contacts, Calendar, and Notes features, you can find
    software that lets you load up your iPod with all sorts of information, including
    movie listings, long text files, weather forecasts, and even Shakespearian sonnets.
    In this chapter, we explore how you can teach your iPod these new tricks.


    Another neat tweak we’ll discuss in this chapter is the ability to copy songs
    from your iPod. Although iTunes prevents this form of copying as an impediment
    to song piracy, there are plenty of legitimate reasons to move your music from
    your iPod, and lots of easy ways to do it.


    # ### in this chapter


    +   - ☑ See and Copy Your Songs

    +   - ☑ Put Large Text Documents on Your iPod

    +   - ☑ Read the United States Constitution

    +   - ☑ Get News, Weather, Movie Listings, and More

    +   - ☑ Synchronize Your iPod with Microsoft Outlook

    +   - ☑ Use PocketMac for Macintosh

    +   - ☑ Run Linux on Your iPod'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# See and Copy Your Songs


    The joke is that while Microsoft invested millions of dollars developing digital
    rights management (DRM) software for Windows Media Audio to restrict what users
    could do with music, Apple spent a fraction of a penny per iPod on little stickers
    that say “Don’t steal music”. The truth is more complex. Apple has always walked
    a tightrope between the rights and desires of two very important groups: customers
    and music publishers.


    When the original iPod appeared in 2001, some folks at Apple wanted the “Don’t
    steal music” admonition to appear on the screen every time users turned their
    iPods on, but that point of view lost out. Instead, Apple decided late in the
    iPod''s development to adopt a DRM strategy nicknamed “roach motel”, after the
    bug control product and its slogan “Roaches check in, but they don’t check out”.
    In the iPod''s case, it was the songs that were going in, but not out. As you
    know, iTunes only provides a way for you to copy songs from your computer to your
    iPod—it won’t move them in the other direction.


    If you go to the Finder or Windows Explorer and look at your iPod, you won’t see
    your songs anywhere. That’s because Apple has taken simple steps to hide them.
    It’s more of a social copy protection system than a technological one. But the
    way they’re hidden is an open secret, and it’s easy to work around. Every iPod
    book and Web site explains how to see your hidden songs, and I’m going to do it,
    too—I’ll just be a little nerdier about it than most other folks, in keeping with
    the hack spirit of this book.


    The iTunes Music Store adds a twist to this story. When you buy songs from the
    Store, they’re wrapped in a real DRM scheme, called FairPlay, that limits what
    you can do with them. The hacks in this section simply make the songs visible
    and let you move them around. Nothing here will help you get around FairPlay.
    If you copy a Store-bought song from an iPod to a computer that’s not authorized
    to play that song, it still won’t play.


    # Good and Evil


    I’m not going to present a big legal or moral lecture here—I’m just a geek, not
    an expert in either of those areas—but there are plenty of legitimate uses for
    copying music from your iPod to your computer. For example, let’s say you have
    music you’ve ripped from CD into iTunes, then copied to your iPod, and your hard
    disk dies. The music you bought is still on your iPod, and it would be handy to
    copy it back to your computer where it used to be. On the other hand, it’s definitely
    uncool, not to mention illegal, to copy commercial, pay-for music from your friend’s
    iPod to your computer. So it’s a good idea to follow the advice printed on that
    little sticker: don’t steal music.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'There are three elements to Apple''s gentle anti-copying scheme:


    +   - In iTunes, if you drag a track from an iPod to the Library, or to a playlist
    on the computer, you won''t be able to drop it there-it just zips back where it
    came from. Apple built this limitation into iTunes to prevent easy copying. There
    is no way to overcome it.


    +   - In the Finder or Windows Explorer, your iPod appears as a hard disk, but
    the songs are nowhere in sight. That''s because Apple has used an operating system
    feature to hide the files from view. Otherwise, they''re normal, copyable files.


    +   - The music files are arranged in folders that are not organized by any obvious
    scheme. That makes it more difficult to use clues like artist or album name to
    find the particular songs you want.


    Let''s discuss a few different ways to see and fool around with your iPod files.
    The tricks and tools vary depending on which operating system you''re using.


    # ## Mac OS X


    You can find and copy any song from your iPod with nothing more than the Finder,
    as long as you''re using Mac OS X 10.2 or later. Here''s how:


    +   1. In the Finder, choose Go ⇥ Go to Folder.


    +   2. In the sheet that appears, type `/Volumes/iPodName/iPod. Control/Music`.
    (Instead of "iPodName", type the actual name of your iPod.) Click Go. Your iPod''s
    music folder should appear in the Finder, but its contents are invisible.


    +   3. Choose File ⇥ Find. Click the "Search in:" pop-up, and choose "Specific
    places".


    +   4. Drag the iPod music folder from the Finder window to the list at the top
    of the Find window. You should see the iPod Music folder added as another place
    to search. Make sure the Music folder is the only item checked.


    +   5. Click the first pop-up in the "Search for items whose:" area and choose
    "Visibility". Click the second pop-up and choose "Visible and invisible items".


    +   6. Click the plus sign at the right to add another search criterion. Choose
    "Name" and "Contains" from the two pop-ups. Type all or part of the song''s file
    name into the text box at the right.


    Note that you''re searching for a file name, which might not be the same as the
    name of the song. Your best bet is to search for words from the first part of
    the song title, as file names tend to get chopped when you rip CDs. So, for example,
    if you''re looking for the song "Dead Leaves and the Dirty Ground", search for
    "Dead Leaves", not "Dirty Ground". You''ll figure it out-you''re smart.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_97_0.png)


    If you''re using Mac OS X 10.2, the way to choose search criteria is a tiny bit
    different. Use the “Add criteria” pop-up to make sure you end up with two criteria,
    one for “visibility” set to “all”, the other for “file_name” and “contains”.


    +   7.  Click Search in the Find window. You’ll get a Search Results window that
    shows the song you’re looking for. See Figure 4-1 for an example of what that
    looks like.


    ![](img/f481d8a0ca491080698039f72bf96e1b_97_1.png)


