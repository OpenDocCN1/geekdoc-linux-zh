- pgno: 91
  md: 'If you have a 3G iPod, my advice is not to open it if you want it to work right
    again. These newer, thinner iPods are much more delicately put together. You stand
    a good chance of breaking something when you take it apart. In any case, if you
    would rather not operate on your precious music player just to fix a dead battery,
    remember that Apple will replace the iPod for $100.


    ![](img/f481d8a0ca491080698039f72bf96e1b_91_0.png)


    > Apple''s offer to replace your out-of-warranty iPod for $100 specifically states
    that a worn-out battery must be the only thing wrong with the iPod. If you try
    to replace the battery yourself, and break the Hold switch (or cause other damage),
    you''re no longer qualified for the $100 repair. And if your iPod is in warranty,
    opening it voids the warranty, needless to say.


    If you decide to go ahead and replace the battery yourself, good for you! Here
    are the steps you need to follow:


    +   1. The best tool for opening your iPod is a thin, laminated card, like a driver''s
    license or video store membership card. Find one of these. (You can also use a
    very small flat-blade screwdriver, but if you do, it''s easy to scratch the iPod,
    or, if you''re like me, you''re likely to dig a small, painful hole in your hand
    when the screwdriver slips.)

    +   2. Make sure the iPod is turned off. Just to be sure it stays off, turn on
    the Hold switch.

    +   3. Hold the iPod in one hand and the plastic card in the other.

    +   4. You''re going to separate the white part of the case from the silver part.
    (Second- and third-generation iPods are more difficult to open because the case
    wraps around the connectors.) Put the corner of the card between the two parts
    of the case on one of the top corners. Wedge the card in until the case comes
    apart slightly.

    +   5. Keeping the card wedged between the parts of the case, work the card around
    the side of the iPod. The case is held together by plastic clips, which you have
    to pry apart as you go.

    +   6. When you have separated all the clips, pull the case apart. Pause to admire
    your handiwork.

    +   7. The battery is glued to the hard drive. Hold the hard drive part down on
    the table with one hand, and use the other hand to pull the battery off. You might
    need to use the plastic card or a screwdriver to help pry the battery loose.

    +   8. The battery is still connected to the circuit board. To detach it, gently
    (GENTLY!) pull the cable that connects it.

    +   9. Plug in your new battery, taking care to orient it the same way as the
    old one.

    +   10. Stick the battery to the hard disk, just where the old one was. Make sure
    you line it up correctly the first time – that glue is very sticky, as you have
    discovered by now.

    +   11. Make sure that the battery cable is tucked in, and snap the case back
    together.'
  merge: -1
  img_proc: true
