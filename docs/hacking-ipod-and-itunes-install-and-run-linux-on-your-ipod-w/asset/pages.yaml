    # Scary Time


    Every iPod has a clock that knows the time of day. But no iPod keeps perfect time:
    the clock circuit in every iPod runs a little bit fast or slow by a matter of
    milliseconds. This seems terrible, but the good news is that although the clocks
    aren''t perfectly accurate, they are perfectly predictable: they run fast or slow
    by the same amount every day.


    The iPod uses an ingenious scheme to prevent this error from adding up. Every
    iPod is measured at production time to determine how fast or slow its clock runs.
    That value is stored in the iPod''s ROM. At the start of every day, the iPod uses
    this stored value to adjust its clock and correct for the error. If the iPod is
    asleep, it wakes up very quietly, without putting anything on the screen or making
    any sound, fixes the clock, then quietly goes back to sleep. Shhh.


    When Apple first added the alarm clock feature to the iPod, the company began
    receiving bug reports that sounded like ghost stories. At midnight, iPod screens
    would suddenly light up for no apparent reason, then turn off a moment later.
    It turned out that Apple''s clock-correction code forgot to check whether the
    user had turned on the iPod''s backlight timer. If the backlight was not set to
    "Off", it would come on when the clock was corrected. Only the light came on—nothing
    appeared on the screen, giving the iPod a haunted look. One user reported being
    awakened by the light of his zombie iPod. By the time he looked around, the light
    was out, leaving the guy unnerved and perhaps wondering about his sanity.


    Apple fixed the bug in the next release of iPod Updater, and no more ghost stories
    were reported.


