    +   - The eclectic label Telarc has a bunch of free tunes for you. Go to `www.telarc.com`
    and click the link to Free Digital Downloads.


    +   - Clear Blue Records is one of many small labels that lets you download MP3s
    so you can hear how its artists sound. For example, try the Style Kings: `www.clearbluerecords.com/stylekings/songs.html`.


    You can use a search engine to find hundreds more record companies on the Web,
    most of which offer some free music to download. You can also peruse the list
    of record labels at `singer-songwriter.com/resource/resource.php3?offset=0&rr=record`.


    # ## Web sites


    If you do any shopping on the Web, you''ve probably bought stuff from `Amazon.com`.
    Even if you''re a regular Amazon visitor, you might not know that Amazon serves
    up thousands of free tunes for your enjoyment, a practice the *San Francisco Chronicle*
    compared to having “a dish of penny candy at the sales counter”. The free songs
    at Amazon are in a section called Music Downloads. Most are MP3s. To get there,
    go to `Amazon.com`, click See More Stores on the navigation bar, click Music (it''s
    under Books, Music, DVD), then click Free Downloads in the second navigation bar
    that appears at the top of the page. Once you''re there, you''ll get a page that
    looks something like what you see in Figure 8-12.


    The ArtistDirect site at `www.artistdirect.com` has a massive collection of information
    about thousands of bands, and downloadable songs for many of them. Just search
    by band or click the Downloads link at the top. ArtistDirect has a few quirks;
    some of the'
