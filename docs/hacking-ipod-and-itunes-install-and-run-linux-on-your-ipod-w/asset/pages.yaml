    You can use the iTunes Music Store search feature to see what the store has to
    offer about your favorite artists.


    +   1. Click the magnifying glass in the search box and choose Artists.

    +   2. In the search box (which now says Search Artists under it), type the name
    of the artist you want to look for, and then press Return or Enter.

    +   3. The top right corner of the window shows “Top Artists” that match your
    search. Click one to go to that artist’s home page.'
