- pgno: 159
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_159_0.png)


    See the little arrows on the right side of the address box and the Google box?
    Those are SnapBack arrows, sort of an enhanced version of the browser’s Back button.
    When you click a SnapBack arrow in the address box, Safari goes back—not to the
    previous page, as with the back button, but to the first page you opened in that
    window, the last address you typed into the address box, or last bookmark you
    opened in that window.


    The SnapBack arrow in the Google box on the right works in a similar way. Clicking
    that arrow takes you back to the last Google search you performed. Having SnapBack
    arrows in two different places shows that Apple was thinking about using SnapBack
    as a general concept.


    Apple proved the general usefulness of SnapBack by adding it in an entirely different
    program: iTunes 4.5, released in April 2004. SnapBack, shown in Figure 5-25, comes
    in handy when you’re listening to music and browsing around iTunes at the same
    time.


    For example, let’s say you’re listening to your All-Time Favorites playlist, and
    you go exploring your Library to look for forgotten gems in your collection. Or,
    you might want to visit the iTunes Music Store to see what’s new this week. When
    you want to see the current song again, you can simply click the SnapBack arrow
    that appears at the right side of the iTunes display. Instantly, you’ll be cyber-whisked
    back to your playlist, with the current song selected in the list and scrolled
    into view.


    SnapBack also works when you’re playing previews in the Music Store. If you go
    wandering off while listening to a preview, just click the SnapBack arrow to go
    back to the Music Store page you were looking at.


    You don’t even have to be off in a distant playlist to use SnapBack. If the current
    song is in the playlist you’re looking at, clicking the SnapBack arrow will make
    it appear on the screen. Cool! Note that although SnapBack is new, iTunes has
    had the ability to locate the current song for a long time, by choosing Show Current
    Song from the File menu. But many users were not aware of the feature buried deep
    in that menu, so SnapBack provides a more discoverable way to find out what you’re
    listening to.


