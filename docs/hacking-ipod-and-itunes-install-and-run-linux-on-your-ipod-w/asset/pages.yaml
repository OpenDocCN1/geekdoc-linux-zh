    tracks.


    There is a way to remove the gap and play adjacent tracks, or even an entire CD,
    without pause. You have to take action at the time you rip the CD. Here’s how
    it goes:


    +   1. If you have iTunes set to automatically rip CDs when they’re inserted,
    turn that off. Go to Preferences, click the General tab, and choose **Show Songs**
    from the “**On CD Insert:**” menu. Click OK.'
  merge: -1
