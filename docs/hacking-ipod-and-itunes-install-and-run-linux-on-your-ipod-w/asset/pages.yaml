    # Download Audio Books


    Music is not the only kind of content you can listen to on your iPod. Audio books
    and other spoken word recordings provide a great way to pass the time when you''re
    commuting on the train, driving cross-country, or waiting for the dentist.


    The main source of audio books and similar recordings is Audible (audible.com).
    When you visit the Audible home page (Figure 2-15), you can search from a vast
    library of recordings that include novels, non-fiction books, magazines, radio
    shows, and more. You can subscribe to an abridged audio edition of the *New York
    Times*, available each day at 6:00 a.m. You can even get language lessons, so
    you can learn to complain in Italian while you''re stuck in traffic.


    Because audio books are usually much longer than mere songs, the iPod has custom
    features for audio books. When you listen to an audio book, then take a break,
    the iPod places a bookmark where you stopped listening. The next time you return
    to the book, you can pick up right where you left off. This trick works even when
    you synchronize your iPod with iTunes\u2014the bookmark travels across the e.


    Another cool audio book feature on your iPod is chapter marks. When you''re listening
    to your iPod and looking at the Now Playing screen, you can press the Select button
    to get into an enhanced fast forward and reverse mode in which you can zoom forward
    or back in seconds by using the scroll wheel\u2014a feature called *scrubbing*.
    When you do this while listening to an audio book, you''ll see vertical marks
    on the timeline that indicate the start of chapters. You can use these chapter
    marks to jump directly to the part of the book you want to hear.


    > **Cross-Reference** For more on audio books and how to find them in the iTunes
    Music Store, including free 90-second previews, see the section *Listen to Audio
    Books* in Chapter 11.'
