- pgno: 242
  md: 'folders of music, or even entire music libraries. When you connect the disk
    to a Mac or PC, you''ll have access to the tunes on that computer. Flexible!


    # ## Delete a Playlist and All Its Songs


    Both the music library and your playlists are represented by icons in the source
    list. But the library and playlists are not equals. The library is special: it''s
    the master playlist for all the music iTunes knows about, while playlists are
    simply lists of songs that are in the library. When you delete a tune from a playlist,
    you''re telling iTunes you don''t want that song on that list any more—the tune
    remains in the library. When you delete a song from the library, you''re severing
    its connection from iTunes entirely, and iTunes even asks if you want to send
    the file to the Trash or Recycle Bin.


    What about those times when you''re looking at a song in a playlist and you want
    to remove it from the library entirely and throw it in the trash? iTunes provides
    a shortcut for that. Select a song in a playlist. If you hold down the Option
    key (on the Mac) or the Shift key (on Windows) while you press Delete, iTunes
    will take the song out of the playlist and the library, and even toss it in the
    trash if you say so. This one is handy, but be careful! Of course, if you happen
    to toss something you really wanted to keep, you can always drag it out of the
    bin.


    ![](img/f481d8a0ca491080698039f72bf96e1b_242_0.png)


    # ### Hacking the Culture: The iPod of Sauron


    During the production of the epic *The Lord of the Rings* movies, director Peter
    Jackson found himself having to be in more than one place at a time. While the
    films'' digital effects team was working in New Zealand, where the movies were
    filmed, Jackson was sometimes in England supervising the recording of the score.
    How could Jackson examine daily prints that were being produced in New Zealand?


    Technology was the answer, with an iPod flavor. Every morning, new daily scenes
    of the movie were transferred over a secure (to prevent Orc mischief) network
    connection from New Zealand to the studio in London. But just as Sam and Frodo
    weren''t quite finished when they got to Mount Doom, the dailies weren''t done
    with their journey when they got to the studio: they still had to be transported
    to Jackson''s home nearby. So, the dailies were downloaded to an iPod, which was
    then delivered to Jackson at home, where he watched the new stuff on a PowerBook
    G4 hooked up to external Apple Cinema Display.


    Of course, the filmmakers could have accomplished the same scenario with any external
    FireWire disk. But somehow it must have just seemed cooler to use iPods for this
    task.'
  merge: -1
  img_proc: true
- pgno: 243
  md: "# # Listen to All the Music on Your Computer\n\nNote This hack is Mac-only\n\
    \nIf you have more than one computer running at home, or you're lucky enough to\
    \ have access to an office or dorm full of music lovers, you are no doubt familiar\
    \ with the won- derful music sharing feature in iTunes that lets you listen to\
    \ your neighbors' songs. So it might seem completely heinous that if you take\
    \ advantage of Mac OS X's multiple-user accounts, allowing your spouse, kids,\
    \ or roommates to share your precious Mac, you don't have access to their music\
    \ from your iTunes.\n\nThe reason you can't see or hear music that belongs to\
    \ other user accounts on your com- puter is that each user's song files are stored\
    \ inside separate folders. If you try to get to those folders, either from iTunes\
    \ or the Finder, you'll discover that Mac OS X has set file permissions that prohibit\
    \ you from getting inside. Try it and see. In the Finder, choose Go ⇐ Computer,\
    \ click the hard disk, and click Users. Find the user whose library you want to\
    \ explore and click the user folder. Double-click that user's Music folder. The\
    \ Finder tells you don't have sufficient privileges to open the folder. That's\
    \ not very nice!\n\nIf your account is part of the administrator group on your\
    \ computer, you can get around this limitation by taking the following steps:\n\
    \n+   1. With the other user's Music folder selected, choose File ⇐ Get Info.\
    \  \n+   2. In the “Ownership and Permissions” section, click the triangle next\
    \ to “Details”.  \n+   3. Click the tiny lock next to the “Owner” pop-up (Figure\
    \ 10-3).  \n+   4. Check the name in the “Owner” pop-up. You're going to change\
    \ it, but you'll need it again for step 8. It's probably the same as the user's\
    \ name. If your memory is as bad as mine, you might want to write it down.  \n\
    +   5. Click the pop-up and choose your own account. Taking ownership will let\
    \ you make changes to the folder's permissions.  \n+   6. Click the pop-up next\
    \ to “Group” and choose “Staff”.  \n+   7. Under “Group”, click the “Access” pop-up\
    \ and choose “Read Only”. This change will give you access to the other user's\
    \ music.  \n+   8. Go back to the “Owner” list and set it back the way it was\
    \ before we started messing around.  \n+   9. Click the little lock to put things\
    \ back the way they were.  \n+   10. Close the Music Info window."
  merge: -1
  img_proc: true
