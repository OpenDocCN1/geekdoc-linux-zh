    manage your photos (iPhoto), make and edit your own videos and DVDs (iMovie and
    iDVD), and create your own music (GarageBand). One of the coolest features of
    iLife is the integration between the applications. Because all the programs know
    about each other, and their information is stored in well-known places, they can
    do some neat tricks together. For example, you can make a slide show in iPhoto,
    using a playlist from iTunes as the soundtrack, or you can compose music in GarageBand
    starting with an iTunes track.


    There are plenty of ways for the iLife applications to work together, and amazingly,
    Apple hasn''t yet thought of them all. They''re trying, though. Just about the
    same time as Apple shipped iLife 04 in January 2004, it also released a free application
    called Playlist to DVD (clearly, the Clever Names section of the marketing department
    is not responsible for that one). This program is a cool tool if you have a Mac
    with a DVD-burning SuperDrive.


    Playlist to DVD takes a playlist of your favorite tunes and burns a DVD that plays
    those songs, complete with real DVD menus, a “now playing” display, and a list
    of upcoming songs. Your disc can contain up to 90 minutes of music. The DVD you
    make doesn''t need a computer—it will play in virtually any DVD player. This is
    great for making a disc of party music, favorite tunes for a special occasion,
    or just for geeking out. If nothing else, you''ll get to use that blank DVD that
    came with your new Mac.


    Here''s what you need to do to try out Playlist to DVD:


    +   1. First, make sure you have the required hardware and system software. You
    need a Mac with a SuperDrive—that''s a DVD burner—and you must be running Mac
    OS X 10.3 or later.


    +   2. The next requirement is QuickTime Pro. You need this because Playlist to
    DVD actually works by creating a QuickTime movie with the music, track list, and
    album art you select. Every Mac already has the free version of QuickTime, but
    QuickTime Pro provides extra features, mainly for creating movies, and costs money,
    about $30. If you don''t have QuickTime Pro, you can download and pay for it at
    www.apple.com/quicktime/download/.


    +   3. Finally, you need a copy of iLife 04. Specifically, you''ll need iTunes
    and iDVD. iLife has a retail price of $49, and you can buy it at the Apple store
    online or in the physical world, or at many computer stores.


    +   4. Once you''re done collecting all that for-pay software, you can get the
    free Playlist to DVD application. Download it at www.apple.com/applescript/playlisttodvd/.
    Run the application after you have downloaded it.


    +   5. In the Playlist to DVD window, you''ll see your iTunes playlists listed
    at the left. Pick the one you want to make into a lovely DVD. On the right, choose
    a template style. Click Create DVD, and watch the magic. Figure 9-1 shows you
    what the Playlist to DVD window looks like.'
