  md: '![](img/f481d8a0ca491080698039f72bf96e1b_207_0.png)


    FIGURE 8-3: If you insert a CD that has already been imported into the iTunes
    library, you''ll get this helpful message.


    If you have to enter track names manually, or there are any other problems that
    cause you to stop and start the ripping process, such as a CD that isn''t seated
    properly, you might have to click the Import button in the upper right to get
    things going again, and you might have to eject the CD manually when it''s done.
    It''s OK, the exercise will be good for you.


    Despite your studious attention to the task, you might find yourself mixed up
    about whether you have already ripped a particular CD or not. There''s a quick
    and easy way to find out. Just go ahead and insert the CD. When iTunes sees the
    CD, before starting to rip, it checks to see if the CD is already in its library.
    If so, you''ll get a message like the one in Figure 8-3, pointing out that it''s
    already in there and asking whether you really want to rip it again. Pretty cool!


    # Rip City


    Maybe you would rather not bother with the task of ripping all your CDs. If so,
    you''ll be happy to know that you can throw money at the problem. A service called
    RipDigital will take your CDs and perform the manual labor of ripping them, to
    your specifications, and then ship the CDs back to you along with external hard
    disks or DVDs containing your ripped tunes. RipDigital charges about a buck per
    CD in quantity. For more information, check out the company''s Web site at www.ripdigital.com.


    # Get All Your Music Together in One Place


    If you love music and you have more than one computer, or even one computer with
    more than one hard disk, you might find yourself with music scattered across various
    places as you scramble for nooks in which to store your digitized tunes. This
    can also happen if you use one computer for ripping and a different one for playing
    music. With some file copying and the help of a little-used iTunes command, you
    can easily collect all your music together on one hard disk, as long as you have
    enough space on that one disk.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'The first step in getting your music together is to make sure that it’s all
    on disks that are connected to the computer you use for playing. It doesn’t matter
    whether the songs are scattered across multiple hard disks or not. For best results,
    you should use drives that are either internal or externally connected, rather
    than any network volumes.


    Once you have all your musical disk drives connected to one computer, verify that
    all your music is in the iTunes library. If it’s not, your very next act should
    be to get the music into your library. Use the File ⌘ Add to Library menu item,
    or just drag and drop it in, if you prefer the direct method.


    iTunes keeps track of the location of every music file that’s represented in its
    library. To unite all your tunes on one drive, you could move files manually,
    remove them from the library (because the library items are now pointing at the
    old locations), and then add them back in. Gee, that sound tedious and error-prone!
    Luckily for us, iTunes has yet another really cool feature that helps us out:
    Consolidate Library. If you choose Consolidate Library in the Advanced menu, iTunes
    will brilliantly copy all your music to one place, the iTunes Music folder. Your
    music, previously scattered to the four winds, will come together in one place,
    creating peace and harmony.


    To see how this works, take a look at Figure 8-4, which depicts a bunch of music
    scattered around a disk in various folders.


    In iTunes, we choose Advanced ⌘ Consolidate Library, and iTunes copies all your
    music into the iTunes Music folder and organizes it by artist and album. Figure
    8-5 shows the same music library after it’s been consolidated.


    # Your Main Library


    When you add music to iTunes CDs by ripping or buying songs from the music store,
    the files are stored in a particular folder on your hard disk. By default, iTunes
    uses /Music/iTunes/iTunes Music/ on Mac OS X and \My Documents\My Music\iTunes\iTunes
    Music on Windows. If you prefer to specify your own choice of folders before consolidating
    your library, just open Preferences in iTunes, click the Advanced tab, and click
    Change... to select the folder you want.


    # ## Merge Tracks from Live CDs


    Having all your music in iTunes is like owning a magical jukebox. One of the best
    features of this jukebox is the ability to achieve almost instant gratification
    by listening to any song you want to hear, just by searching or browsing for the
    name of the song or artist.


    Some CDs aren’t particularly well suited to song-at-a-time listening. For example,
    it’s more fun to listen to CDs made of live concerts from beginning to end rather
    than by plucking'
