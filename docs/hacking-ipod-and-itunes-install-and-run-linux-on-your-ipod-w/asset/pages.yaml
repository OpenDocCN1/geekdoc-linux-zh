- pgno: 188
  md: '# iTunes and Hardware


    If you’re a typical iTunes user, your goal is to move as much of your music collection
    as possible onto your computer. Once it’s there, you can put iTunes in control
    of playing all your tunes. But you probably don’t do all your music listening
    while you’re sitting (or standing, or kneeling) in front of your computer. So
    it’s important to find ways for your music to escape from the prison of your computer.
    Well, maybe prison is too harsh an analogy, so let’s just say that your music
    shouldn’t stay cooped up in your computer all the time—just like you, it needs
    to get out once in a while.


    Of course, the best way to get your music out into the world is on an iPod, a
    topic that’s discussed in great detail in Part I of this book. But as marvelous
    as our iPods are, they’re lacking some features that computers have:


    +   > They have a lot less capacity for music. As of this writing, iPods are limited
    to a mere (!) 40 gigabytes, while computers can store hundreds of gigabytes. And
    you can always add more storage just by buying additional external hard disks.


    +   > They lack a method for easy networking. A bunch of computers in your home
    or office can share music directly, but a gang of iPods can’t.


    +   > By virtue of their more powerful CPUs, bigger screens, and external connections,
    computers can do a lot more stuff and can provide a more thorough user interface.
    This one cuts both ways: the small screen and limited space for controls force
    a wonderful simplicity that is one of the reasons why iPods are so well-liked.
    But iTunes and other music players on computers give you the power to rip CDs,
    create and rearrange playlists, rename and delete songs, edit tag information,
    and do much more.


    For these and other reasons, playing your music collection directly from iTunes
    will likely be an important part of your personal musical strategy. In this chapter,
    we’re going to see how to use additional hardware to get the most out of iTunes
    music playing.


    # chapter 7


    # in this chapter


    +   - Broadcast Your iTunes


    +   - Listen with Cordless Headphones


    +   - Play Music over WiFi


    +   - Use of Remote Control


    +   - Play Tunes on Your TiVo


    +   - Set Up a “Now Playing” Sign'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Broadcast Your iTunes


    This section discusses a couple of different ways you can listen to iTunes music
    wirelessly: cordless headphones and Wi-Fi. Take a look at these solutions and
    see if one of them works for you. The world doesn''t need any more wires.


    # Listen with cordless headphones


    Here''s a neat trick: you can play music in iTunes and listen through cordless
    headphones. This is useful in your home late at night so you can listen without
    disturbing others, in classrooms where more than one person might need to hear
    the same music while others are working on something else, and at parties attended
    by the very geeky.


    Cordless headphones have been around for a long time, a lot longer than digital
    music. They''re handy because they eliminate wires and because they allow more
    than one lis- terner to share music. Cordless headphone systems include a transmitter
    along with the headphones. You plug the transmitter into your computer''s audio
    out connection, and away you go. Anyone wearing headphones tuned to the same frequency
    can listen to the tunes.


    You can get cordless headphones that use a couple of different technologies:


    +   Infrared systems require you to be in line of sight with the transmitter plugged
    into your computer. These models are great if you''re going to be sitting on the
    couch across the room from your computer, up to 20 feet away, grooving to the
    beat while you catch up on some reading. Infrared systems include the SC2600 from
    Arkon Resources (www.arkon.com/ir.html). The SC2600 costs about $40, and extra
    headsets go for about $30. Other well-reviewed infrared cordless headphones include
    the Sony MDR-IF140 (crutchfield.com or amazon.com), Emerson EHP1000 (www.ravefactory.com
    or amazon.com), and RCA WHR50 (www.shoptronics.com). All sell for $50 or less,
    some as low as $28. The Sony MDR-IF140 is pictured in Figure 7-1.


    +   900 MHz systems operate by radio waves and give you the freedom to wander
    away from the transmitter''s all-seeing eye and into other rooms. These head-
    phones also work over a much greater range than infrared, with some systems claiming
    up to 300 feet. Folks who use 900 MHz headphones sometimes report problems with
    sound quality, such as hiss and breakup, so try before you buy, if you can. Popular
    sets include the Jensen JW160 for about $48, Magnavox PM-61571 ($55), JVC HAW250
    ($60), and the ever-present Sony with the MDR-RF915RK and other models. Prices
    range from $60 to $120. Audophile cordless headphones run $200 - $400 and more.
    The most popular models in this range are from Sennheiser (www.sennheiser.com).
    Check amazon.com, crutchfield.com, and sephar.us.com when you''re ready to go
    shopping.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_190_0.png)


    **FIGURE 7-1:** Sony MDR-IF140 cordless headphones.

    Courtesy of Sony Electronics Inc.


    # Blue, Blue, My World Is Blue


    If you have a Macintosh made since 2003, there''s a good chance it includes the
    ability to communicate using a wireless technology called Bluetooth. If your computer
    is a Mac older than that or is a Windows PC, you can add Bluetooth to your computer
    via a USB adapter. Because Bluetooth transmits data wirelessly, it would be very
    cool if you could get Bluetooth headphones and hear music from your computer without
    having to plug in a separate transmitter. As of this writing, Bluetooth headphones
    that can receive stereo music were not available, but several companies seem to
    be on the verge of shipping such products, including TEN Technology (www.tentechnology.com).


    For more information on cordless headphones, see www.headsets.com, or go to froogle.com
    or shopping.yahoo.com and search for "cordless headphones".


    # Play music over WiFi


    Another way you can get your music into the air is through a wireless music adapter
    that uses WiFi technology, also known as 802.11 or AirPort, Apple''s brand name.
    These devices have two parts: software that broadcasts music from your computer,
    and hardware that connects to your stereo, receives the broadcasts, and plays
    the music. You can have as many'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'receivers as you want, and different receivers can receive different music
    at the same time. Each receiver acts as a window on all the music stored on computers
    in network range. From the receiver, you can browse among computers, playlists,
    albums, artists, and songs. It''s like having your computer and its music in the
    room without actually having to carry it around.


    Apple makes a simpler, slightly different solution for playing music over WiFi.
    AirPort Express is a WiFi access point (also known as a base station) that provides
    a full range of wireless services, like its big brother, AirPort Extreme. In addition
    to doing standard wireless stuff, AirPort Express hooks up to your stereo or speakers
    and streams audio to them from iTunes, as discussed below.


    ![](img/f481d8a0ca491080698039f72bf96e1b_191_0.png)


    Instead of having a wireless receiver to play your iTunes music, you can connect
    another computer to your stereo, run iTunes, and play music via iTunes Music sharing.
    The advantage is that you get a full-powered computer running a full version of
    iTunes; the disadvantage is that a computer will likely cost more and take up
    more space than one of the wireless receivers described in this section. If you
    do hook up a computer to your stereo in order to run iTunes, take a look at this
    chapter''s *Run iTunes by Remote Control* section.


    You can choose from among several WiFi music receivers:


    +   Squeezebox, from Slim Devices (www.slimdevices.com), looks right at home as
    a stereo component (see Figure 7-2). This small black box includes a bright multi-


    ![](img/f481d8a0ca491080698039f72bf96e1b_191_1.png)


    **FIGURE 7-2:** Slim Devices Squeezebox.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'line fluorescent display that walks you through setup, helps you choose music,
    and provides “Now Playing” information. There’s a mode that switches the display
    to one big line, which makes it easier to read from across the room. The accompanying
    open-source software runs on Mac OS X, Windows, Linux, and Unix. Squeezebox works
    great anywhere your wireless network reaches. It also comes in a wired version,
    but that’s not nearly as much fun. Squeezebox sells for about $250.


    One more cool thing about the Squeezebox: it has Easter eggs. There’s a screen
    saver that simulates falling snow and spells out a holiday greeting: from the
    Home screen, choose Settings ➔ Screensaver ➔ Snow Screensaver. And Squeezebox
    plays Tetris: go to Home ➔ Plugins ➔ SlimTris. Press right-arrow to drop a piece,
    up-arrow and down-arrow to move the piece, Add and Play to rotate. Excellent!


    +   • **AirPort Express, from Apple (Figure 7-3),** is the newest way to play
    your music from afar. This device is a full 802.11g WiFi access point. It includes
    audio connectors to hook it up to your stereo or other powered speaker system.
    AirPort Express is also nicely compact and lightweight, so you can take it with
    you.


    AirPort Express works together with AirTunes, a feature that was added to iTunes
    in version 4.6. To get AirTunes going, you just make sure it’s enabled in iTunes
    preferences (see Figure 7-4) at the bottom of the Audio tab.


    ![](img/f481d8a0ca491080698039f72bf96e1b_192_0.png)


    # **FIGURE 7-3: AirPort Express.**


    Courtesy of Apple.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_193_0.png)


    FIGURE 7-4: AirTunes setting in iTunes preferences.


    When AirTunes finds an AirPort Express, it adds a pop-up menu to the bottom of
    the iTunes window that lets you pick where your music will go: the computer’s
    speakers, or a distant AirPort Express somewhere.


    Because AirPort Express carries Apple''s brand and legendary ease of use, it''s
    destined to become the most popular way to broadcast your tunes to another place
    in the house. But there are definite drawbacks when comparing Apple''s little
    base station to products like Squeezebox. The most notable limitation is that
    AirPort Express has no user interface. While that certainly makes it easy to use,
    it also means that if you''re listening to remote music with AirTunes and AirPort
    Express, you can''t change playlists, skip songs, or even pause the music without
    going to the computer that''s running iTunes. That can be annoying if the computer
    is in a distant room or on another floor.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'When this obvious flaw was pointed out to Steve Jobs at the AirPort Express
    product introduction, he responded by saying that walking is good for you, according
    to a report on AppleInsider.com. Most likely, Apple is working on a new product
    or feature that will remedy this problem. Maybe a remote control, or even an iPod
    that also functions as a remote?


    +   - Macsense’s HomePod (www.macsense.com/product/homepod/) is an iPod-white
    box that plugs into your stereo and plays music it receives from your Macs and
    Windows PCs via the WiFi network. HomePod includes built-in speakers and plenty
    of connections for your stereo, and costs about $250.


    +   - Roku (www.rolublabs.com) makes the Roku SoundBridge Network Music Player,
    which gives you WiFi access to your tunes in a really cool aluminum package. Roku
    makes two models, starting at $225.


    +   - cd30 (www.cd30.com) makes various models of their stylish Network MP3 Player,
    two of which have WiFi connections. The cd30 products only work on Windows computers.
    Prices for wireless models start at about $180.


    +   - Sound Blaster Wireless Music (www.soundblaster.com) from Creative Labs is
    another Windows-only WiFi solution. This model is notable because it plays all
    WMA files in addition to MP3s. Another nifty feature is the remote control: it
    includes a multi-line display for choosing music, and it uses RF instead of infrared
    for a much greater range. Sound Blaster Wireless Music goes for about $200.


    +   - Linksys Wireless-B Media Adapter (www.linksys.com) plays MP3 and WMA songs
    from your Windows computers (no Macs) and displays pictures (JPEG, GIF, and so
    on) on your TV. The Wireless-B Media Adapter uses your TV as a display for its
    user interface. This product sells for about $150.


    # Inside AirPort Express


    How does AirPort Express work its magic? AirPort Express teams up with the AirTunes
    feature of iTunes to stream music wirelessly across your network. You start by
    plugging in an AirPort Express and enabling it in iTunes preferences. When you
    play a tune, iTunes first converts the song from its source format (MP3, AAC,
    and so on) to an audio stream. Then, iTunes re-encodes the music using Apple Lossless
    compression, which is a way to reduce the size of the music without losing any
    fidelity. After compressing the music, iTunes encrypts the data so it can’t be
    “stolen” while it’s going over the air, then streams it off to the AirPort Express.


    When the AirPort Extreme receives the data, it decrypts it, decompresses it to
    restore its original fidelity, then pumps it through its audio out jack and into
    a waiting stereo or set of speakers. The cool thing about this setup is that you
    still play music pretty much as you did before: through iTunes. Of course, that’s
    also the main drawback to AirPort Express: if you want to make any changes in
    what you’re listening to, you have to go to your computer, which is likely to
    be in another room.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# # Run iTunes by Remote Control


    If you''ve decided to connect a computer to your stereo, and not just a wireless
    receiver, you''re faced with the prospect of running software that might be on
    the other side of the room from where you are. Software designers call this “the
    ten-foot interface”, describing how far away you are from the computer you need
    to run.


    The best solution is to get a remote control for your computer. Sure, that’s kind
    of comical: yet another remote. But give it a try and you might see that it’s
    the best way to deal with that distant computer. In this section, we’ll take a
    look at two of the best remote controls for computers: the Remote Wonder II from
    ATI, and the Keyspan Digital Remote.


    # ## Control your computer with ATI Remote Wonder


    The ATI Remote Wonder II is the Swiss army knife of computer remotes: it does
    just about everything. In fact, it does so much that simply controlling iTunes
    is a little job for it. The 50-key Remote Wonder looks a lot like a remote for
    a device in your entertainment center, as you can see in Figure 7-5. It includes
    keys for running computer’s DVD player as well as iTunes (or any other music player).
    The remote has a thumb pad that you use to move the cursor across the screen,
    and keys that cause the computer to think you have clicked mouse buttons. The
    Remote Wonder operates via RF, not infrared, which gives it a range of 20 feet
    or more, and it can even work through walls.


    The Remote Wonder works with both Macs and Windows PCs. Installing the software
    is simple. To set up the hardware, you just plug the receiver into a USB port,
    and you’re set. You can configure global settings for the remote, or set up custom
    profiles for each application, reprogramming every last button if you want. You
    can even program the keys to perform a different function after you hold them
    down for a couple of seconds.


    ATI sells the Remote Wonder II for about $60. The original Remote Wonder, with
    fewer features, is about $50. You can find out more at www.ati.com.


    # ## Get Keyspan Digital Media Remote


    For about the same price ($50) as the Remote Wonder, Keyspan’s Digital Media Remote
    takes an entirely different approach (see Figure 7-6). Instead of providing full
    control of the computer, the Digital Media Remote is minimalist: it has only 17
    keys and is much smaller and easier to handle than the Remote Wonder. This tiny
    device provides everything you need for controlling iTunes on a computer across
    the room, but no super-duper features such as cursor control. You can set up application-specific
    functions for the Digital Media Remote’s buttons.


    This remote communicates with its receiver via infrared, which means you have
    to be able to see the receiver in order for commands to work. The Keyspan Digital
    Media Remote run on Macs and Windows PCs. You can learn more about it at www.keyspan.com.'
  merge: -1
  img_proc: true
