  md: '# Other programs


    One more program worth mentioning is PodMaster 1000, available for a shareware
    fee of $8 at homepage.mac.com/podmaster/FileSharing1.html. You can use PodMaster
    1000 to copy songs from your iPod, play tunes through the Mac''s speakers, and
    change tag information. PodMaster even has a window that makes it look like an
    iPod on your screen.


    You might also want to try out an AppleScript called "iPod Tracks ⇄ Desktop".
    To use this free goodie, you select songs you want to copy to iTunes. Then, you
    just run the script, and the songs show up on your Desktop. Neat! You can find
    this script by searching for it at www.versiontracker.com.


    I have described some great utilities in this section, but there are many more
    tools for managing tracks on your iPod. If you go to www.versiontracker.com and
    search for "iPod", you''ll find a bunch of them.


    # Windows XP


    Seeing your iPod''s songs in Windows XP is even easier than on the Mac. That''s
    because Windows Explorer has a built-in feature for displaying hidden files. Here''s
    how to do it:


    +   1. Click **Start**. On the Start menu, click **My Computer**.


    +   2. Find your iPod in the **My Computer** window and double-click it to open
    it.


    +   3. Take a look in the window that opens. If you see a folder named **iPod_Control**,
    you''re done. You or somebody else has already set up Windows Explorer to show
    hidden files on the iPod. If you don''t see **iPod_Control**, continue to the
    next step.


    +   4. Choose **Tools ⇄ Folder Options**.


    +   5. Click the **View** tab.


    +   6. Look for the setting "**Hidden files and folders**". It''s near the bottom
    of the window (see Figure 4-7). Click "**Show hidden files and folders**". Click
    **OK**. The **iPod_Control** folder is now ghostly, but visible.


    +   7. Double-click the **iPod_Control** folder, then double-click the **Music**
    folder inside it. You''ll see all the "F" folders that contain your iPod''s music.
    Open them up to view the music inside (see Figure 4-8).


    Once the scales have fallen from your eyes and you can see hidden files on your
    iPod, just go ahead and drag them to your hard disk. What if you''re looking for
    a particular file? You can use the Search feature in Windows Explorer, but you
    have to change a setting first:'
