  md: '![](img/f481d8a0ca491080698039f72bf96e1b_199_0.png)


    FIGURE 7-9: TruColor programmable message sign.


    Once you’ve installed TiVo Desktop and turned on Home Media Option, you’ll be
    able to use your computer to “publish” music to the TiVo. If you have a Macintosh,
    you can specify which iTunes playlists to publish. On Windows, you get to pick
    folders or individual songs. When you’re on the couch and enjoying your TiVo,
    you can pick Music & Photos to get to your computer’s tunes. Now you can spend
    even more time in front of your TV!


    # Set Up a “Now Playing” Sign


    Want to advertise your obsession with iTunes and music? There are few better ways
    to show off than by getting a programmable LED sign, like the one in Figure 7-9
    ($250 at http://www.neon-das.com/TruColorl12.html) connecting it to your computer,
    and having iTunes display the current song, maybe mixed in with a trivia quiz
    or the latest stock prices. You can program this sign and others like it via Ethernet
    or e-mail. If you hook it up to a Mac, a simple AppleScript will post the current
    iTunes song on the sign for you. And then you can have a blast as you attract
    every fellow tunehacker within shouting distance.


    # Summary


    For several years Apple has been pushing the idea of a “digital hub” in which
    all your music, pictures, and movies pass through a computer (preferably one of
    theirs). iTunes is the most successful software piece of that strategy, but to
    really take advantage of iTunes, you have to get the music into your stereo. In
    this chapter, we looked at various solutions, including broadcasting your music
    over the airwaves of your home, and running your computer by remote control.


    Coming up in Chapter 8: we’ll focus on how to get all kinds of music into your
    computer so you’ll have even more to enjoy in iTunes.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# chapter 8


    # Music In


    **B**efore we can listen to all our favorite songs in iTunes, before we can make
    tunes flow into our iPods, we must go through the essential step of getting music
    into iTunes. There are two basic methods for doing this: copying from CD, and
    buying from the iTunes Music Store. But those aren''t the only ways you can collect
    music to listen to—far from it. In this chapter, you''ll discover some of the
    coolest techniques, nuances, variations, and obscure features for getting music
    into iTunes.


    To copy songs from your CDs, you insert a CD, at which time iTunes translates
    the music from the CD into a compressed form, usually MP3 or AAC. These compressed
    versions retain most of the qualities of the original CD, but have the virtue
    of taking up far less space on your hard disk than the uncompressed versions would—usually,
    about 90 percent less.


    The other major technique for getting music into iTunes libraries and iPods is
    to buy songs from the iTunes Music Store. Apple is especially fond of this method.
    You visit the iTunes Music Store by clicking the Music Store icon in the sources
    column in iTunes, where you can buy lots of songs for 99 cents each, or albums
    for $9.99.


    Although most music in iTunes comes from these two sources, there are other ways
    of getting music in. For example, most artists, especially those who are little
    known and would like to be more popular, provide free songs and samples on their
    Web sites. Some online merchants do the same thing.


    There is also the world of peer-to-peer file sharing programs that provide access
    to free music. Courts have ruled that these programs have legitimate uses, but
    they are also widely used for illegally sharing copyrighted material. If you use
    file sharing programs, don''t share copyrighted songs. Not only is it a bad idea,
    it''s against the law.


    In other parts of this chapter, I''ll talk about tips for efficiently getting
    music from your CDs into iTunes, how to add music by recording the tunes your
    computer plays, and much more. By the time you finish this chapter, you should
    be able to fill every spare byte of your hard disk with beautiful music.


    # in this chapter


    +   - ☑ Keep Your Music CD-Quality

    +   - ☑ Automate Your CD Ripping

    +   - ☑ Get All Your Music Together in One Place

    +   - ☑ Record Whatever Your Computer Plays

    +   - ☑ Convert Streams to Songs

    +   - ☑ Get Legal Free Tracks'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# ## Rip but Don''t Tear


    You probably know that the process of copying music from a CD is called *ripping*.
    Well, this bit of knowledge apparently came late to some music industry execs.
    This descriptive term, which predates iTunes, was coined to describe the way you''re
    (figuratively) ripping the music from the confines of the disc and putting it
    into your computer. When Apple shipped iTunes and its first CD burners, and made
    music a key part of the “digital hub” strategy, the company adopted the slogan
    “Rip. Mix. Burn.” to describe the process of copying music from your CDs, arranging
    it the way you like, and then creating your own custom CDs.


    “Rip” reminds people of “rip off”, as in “steal”, which is much on the minds of
    sensitive folks trying to sell music during these turbulent days, and some people
    in the music biz were not happy with Apple’s choice of words. The similarity between
    “rip” and “rip off” has caused more than a little confusion in the music business
    and in the press over the past few years. But when you take CDs you’ve bought,
    copy their music into your computer for your own use, there’s no rip-off involved.


    # # Keep Your Music CD-Quality


    The music on a typical CD takes up 500 to 600MB of storage, or about 10MB per
    minute of music. If you stored music at that rate, it would consume a typical
    hard disk in a hurry. The development of the MP3 format was a milestone in the
    brief and recent history of digital audio. MP3 provided a way to take a hunk of
    music, sift through it, remove most of the data, and yet end up with something
    that sounds quite faithful to the original version. This process, called *encoding*,
    is what happens when you rip a CD with iTunes or any other program that creates
    MP3s. When an MP3 encoder gets through with a CD, it manages to produce music
    that takes up only about 10 percent of its original size, or 50 to 60MB per disc.
    A companion program called (surprise) a decoder is required to play back the music.
    Programs like iTunes usually have both encoders and decoders (players) built in.


    In 2003, when Apple opened the iTunes Music Store, iTunes added support for a
    new format called AAC (Advanced Audio Coding), which Apple says produces files
    that sound better than MP3s. When you buy songs from the iTunes Music Store, they
    come in AAC format. And by the way, AAC allows Apple to add some restrictions
    to music files, which you can’t easily do with MP3 files. These restrictions are
    the rules imposed by the iTunes Music Store; for example, tracks you buy can only
    be played on three different computers, and you can only burn the same playlist
    to CD ten times.


    The hard part of encoding music is knowing which data can be thrown away without
    wrecking the sound. Over the years since the invention of MP3, encoders have gotten
    much more clever at this key task. One way to make your files sound better is
    by keeping'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'more data and throwing away less. Both MP3 and AAC let you choose to make better
    sounding files by increasing the data rate, or the amount of information that''s
    stored for every second of music. The typical rate is 128K bits per second of
    music. You improve the sound quality by using the iTunes preferences settings
    to increase the rate, all the way to a maximum of 320K bits per second. The higher
    the setting, the more disk space you use up. But if you have sensitive ears, you''ll
    probably be glad to make this tradeoff.


    Even if you use the highest compression rate, some people can clearly hear the
    difference between music played from CD and encoded (compressed) on a computer.
    If you''re one of those cursed with marvelous hearing, rather than compressing
    your tracks, you can suck in the original full-length music from a CD to iTunes.
    All it will cost you is disk space.


    You can easily tell iTunes to import your CDs without compression, using the WAV
    or AIFF format. To do so, perform the following steps:


    +   1. Choose Preferences from the iTunes menu (Mac) or Edit menu (Windows).

    +   2. Click the Importing tab.

    +   3. Click the Import Using menu and choose WAV Encoder or AIFF Encoder.

    +   4. Click OK.


    From then on, whenever you insert a CD to be ripped, iTunes will simply copy the
    tracks from the CD without encoding them. The music will sound just like it does
    on CD, but it''ll take up about 10 times the disk space that MP3 or AAC files
    do. Once you have imported WAV or AIFF files, iTunes and iPod play them happily.


    How much will it cost you to keep all your music uncompressed? Not as much as
    it would have last year, and more than it will next year. In recent times, hard
    disks have gotten much bigger and much cheaper. You can now buy big disks for
    less than $1 per gigabyte (GB), which means you could store the uncompressed music
    from about 500 CDs for about $300 on a 300GB hard disk.


    # Do You Hear What I Hear?


    Most music lovers (like me) are perfectly content with the quality of standard
    MP3 or AAC files. Other folks prefer to use one of the solutions for getting better
    quality, such as increasing the bit rate for MP3 or AAC encoding, or even using
    WAV or AIFF to copy the CD audio. For some audiophiles, though, CD quality and
    digital recording in general are a sonic disaster. Rock legend Neil Young might
    be the most famous critic of digital recording. He has said that digital recording
    lacks the warmth of analog, and that music has produced a generation of recordings
    that have lost quality forever because they''re digital. So you can imagine what
    he thinks of MP3. In an interview a few years ago, Neil said that "CDs don''t
    sound good no matter what you do,"'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'and "The MP3 is less than CD. I mean, MP3 is dog. The quality sucks. It''s
    all compressed and the data compression—it''s terrible."


    You can read the text of the whole interview on the Web at www.angelfire.com/rock2/traces/pages/kgsr.html
    .


    # # Add Files to Your Library by Dragging


    The first time you start iTunes, it thoughtfully asks if you want it to scour
    the farthest reaches of your hard disk and look for music to add to your music
    library. You might decide to skip that step and gain greater control over which
    audio files go into your library. Whether you accept iTunes’ offer to look for
    music or not, you can always add tunes at any time. When you rip a CD or buy songs
    from the iTunes Music Store, the new tunes are automatically added to your library.


    What about getting other music into the library? You might have songs on your
    hard disk from some other source, or that somehow has been removed from the library.
    iTunes provides a couple of easy ways to get those songs into your library: with
    menu commands, or by using drag and drop. Here’s how to use the menu commands:


    +   1.  On Macintosh, choose File ⇄ Add to Library. On Windows, it’s File ⇄ Add
    File to Library.

    +   2.  In the dialog box that appears, choose a file on the disk that iTunes
    understands (MP3, AAC, WAV, or AIFF).

    +   3.  Click Choose (on Mac) or Open (on Windows) and iTunes will add it to the
    library.


    You can add a bunch of tracks to the library at once if they’re in the same folder:


    +   1.  On Macintosh, choose File ⇄ Add to Library. On Windows, choose File ⇄
    Add Folder to Library.

    +   2.  In the dialog box, pick the folder that holds the music you want to add.

    +   3.  Click Choose (on Mac) or OK (on Windows) to select the folder. iTunes
    will search inside for music files and add them to the library.


    When you’re adding a whole folder at once, you don’t even have to make sure all
    the files in the folder are valid music files—iTunes will happily ignore tone-deaf
    files.


    By taking this folder-full feature to its logical extreme, you can get iTunes
    to add all the files on your hard disk by choosing the hard disk itself in the
    Add to Library or Add Folder to Library dialog box (see Figure 8-1).'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_204_0.png)


    **FIGURE 8-1:** If you choose the hard disk itself, all files on the disk that
    iTunes can play are added to your music library.


    As I mentioned, you can also use drag and drop to add files to your library. This
    works the same whether you''re using Windows or a Mac: just drag a folder from
    a Finder or Explorer window to the iTunes window, and iTunes will find all the
    music files in the folder and put them in your collection.


    Note that although you can drag your hard disk folder and add all the audio files
    on your computer to your iTunes library, you probably won''t like the results.
    Your disk is filled with zillions of little sound effects, bits of narration from
    movies and lessons, and other bizarre chunks of sound. Unless you really want
    all of those in your library, avoid adding the entire hard disk.


    # # Automate Your CD Ripping


    Ripping CDs is a mindless process that ought to be as automatic as possible. All
    you want to do is just get the CD into the drive, copy the music and encode it
    in your choice of formats, then get the CD out and go on to the next. Wouldn''t
    it be cool if you could hook up some kind of laser scanner to your computer, put
    your CDs nearby, and just tell the computer to rip everything? Well, as far as
    I know, that device is still a dream. But there are'
  merge: -1
  img_proc: true
- pgno: 205
