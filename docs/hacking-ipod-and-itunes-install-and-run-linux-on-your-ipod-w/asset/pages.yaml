  md: '![](img/f481d8a0ca491080698039f72bf96e1b_156_0.png)


    FIGURE 5-21: iTunes Preferences, General tab.


    # ## Use a List Column for Equalizer Settings


    As we discussed elsewhere in this chapter, you can display various columns to
    reveal information in a playlist’s song list. You can directly edit some of the
    settings right in the song list. For example, click a song to select it, then
    click the song’s title, and you can type to change the name of the song. This
    works with artist, album, genre, and comments, too. Other settings are calculated
    for you and can’t be changed, such as the track time and size, date added, and
    play count.


    One column is not like the others: equalizer. When you display the equalizer column,
    you can actively choose the equalizer setting for any track. This is also the
    only column that doesn’t display text. Instead, it shows a little double-arrow
    control. When you click the control, you see a pop-up list of all available equalizer
    settings, shown in Figure 5-22. Pick the setting you want for that track. When
    you let go of the mouse button, your chosen setting appears next to the double-arrow
    for that song.


    > **Tip**

    > iTunes has a global equalizer setting. If you don’t have a custom equalizer
    setting for a track, iTunes uses the global setting. To see the global equalizer
    setting, click the equalizer button in the lower right corner, third button from
    the right.


    # ## Open Multiple Windows in iTunes


    Many applications are organized around documents, with each document represented
    by a window. For example, in a word processor or text editor, you might have three
    documents open at the same time, each in its own window. But iTunes doesn’t work
    that way. When you use iTunes, you’re probably used to doing all your “work” in
    one window, which is fine most of the time.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_157_0.png)


    **FIGURE 5-22:** Equalizer column lets you choose a setting.


    But iTunes actually supports multiple windows, which you can use to your advantage
    if you''re doing some serious fooling around. iTunes lets you open any playlist,
    or the radio list, in a separate window. To open a new window, double-click a
    playlist in the source column. The playlist will open in its own window. This
    is useful if you want to work on one playlist, maybe cleaning up song titles or
    rearranging things, while listening to a different playlist. Pretty soon, you
    can have your nice, neat iTunes screen just as cluttered as you like with a bunch
    of different windows.


    Note that you have to double-click to open the new windows—this feature isn''t
    in any menu.


    # # Use iTunes Window Modes


    iTunes lets you resize its main window in various ways so that you can have it
    just as you like it. The easiest, and least scientific, way to resize the iTunes
    window is to grab the size control in the lower right corner and drag it around
    to make the window bigger or smaller. There are other, cooler ways to boss the
    iTunes window around.'
