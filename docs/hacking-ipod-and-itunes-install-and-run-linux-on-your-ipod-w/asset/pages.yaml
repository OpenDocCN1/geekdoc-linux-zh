- pgno: 123
  md: 'iPod lovers, especially those with Macs, have access to plenty of programs
    that take information from your computer and move it over to your iPod. These
    “to go” programs take advantage of the precious time when your iPod is hooked
    up to your computer (and to the Internet). Until Apple makes iPods that can connect
    to the Internet directly, you can rely on programs like Pod2Go to grab information
    and ship it to your iPod for later consumption.


    PodMail is another “to go” helper. As you might guess by the clever name, PodMail
    specializes in grabbing e-mail so that you can read it later. PodMail puts your
    mail in the Notes folder, so you need an iPod that can run version 2.0 or later
    (that’s an iPod with a dock connector, including iPod mini). You can see PodMail’s
    main screen in Figure 4-23.


    The most common kind of e-mail account uses a technology called POP, which stands
    for Post Office Protocol. If you use POP, PodMail requires you to collect your
    mail with Mac OS X’s Mail program before you can move it over. If you subscribe
    to Apple’s .Mac service, or if you have a IMAP account (IMAP is an e-mail technology
    that leaves mail on the server so you can access it anywhere), PodMail will check
    your mail for you—you don’t have to have it already collected, as with POP mail.
    When you’re ready to move your mail to the iPod, make sure the iPod is selected
    from the pop-up list of disks, then click the Sync button.


    PodMail lets you set up access to as many e-mail accounts as you want. Just click
    the plus sign at the bottom left to make another one. There’s a handy slider you
    can use to limit the number of messages you get, so your poor little iPod won’t
    be overwhelmed by vast quantities of mail.


    ![](img/f481d8a0ca491080698039f72bf96e1b_123_0.png)


    FIGURE 4-23: PodMail grabs your e-mail and moves it to your iPod, where you can
    read it at your convenience.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# # Run Linux on Your iPod


    Linux is an alternative operating system with a devoted, growing set of fans.
    The source code for Linux is freely available, and thousands of people around
    the world contribute to its development. Serious companies like IBM are building
    and selling products made with Linux. One of the wonderfully hacky traditions
    of Linux is to *port* it: make it run on new devices, as many different ones as
    possible. When the iPod appeared, Linux devotees took up the challenge. The result
    is the Linux on iPod project, created by Bernerd Leach and friends.


    Apple doesn''t provide a lot of technical information about the iPod, so the iPod
    on Linux project required lots of work to figure out what was happening inside
    and how to gain control. Leach acted like a detective to learn about the iPod:
    he looked at Apple''s iPod updater to discover how to modify the iPod firmware
    so that it would boot the Linux kernel he installed on the disk instead of the
    standard stuff. Figure 4-24 shows you part of what you see when Linux starts up
    on an iPod.


    Why put Linux on the iPod? In his FAQ for the project, Leach gives the classic
    answer: because it''s there. And beyond that standard reason, he hopes that putting
    Linux on the iPod will result in new applications, such as the ability to play
    different music formats or add new functions entirely.


    > **Caution** Installing Linux changes your iPod''s firmware to allow it to boot
    the alternative operating system, which voids the warranty. The music and other
    data on your iPod might get messed up. You could even end up with an iPod that
    requires you to run Apple''s iPod updater to get it working again, and there is
    a remote chance your iPod will end up unusable. Just so you know—now have fun!


    The initial releases of the project require a complex manual process for installing
    Linux on your iPod, even after all the tough work done by Bernerd Leach and crew.
    This manual process requires you to grab the source code from ipodlinux.sourceforge.net
    and build it yourself using a compiler and other development tools. Then you must
    navigate through a series of steps that include backing up your iPod''s firmware,
    building the Linux kernel, and finally installing and running Linux on your iPod.
    You can see the full instructions at http://ipodlinux.sourceforge.net/build.shtml.


    For Linux fans, this kind of installation process is not unusual. It''s part of
    the pioneering spirit and do-it-yourself joy of Linux. But it''s a little daunting
    for a larger group who are merely curious about playing with Linux on an iPod.
    One of the coolest aspects of open source projects is that programmers can build
    on the work of one another. For this project, the community has built an easy-to-use
    installer that lets you get Linux on your iPod with about 98% less fuss than the
    original technique. It''s not as easy as installing iTunes, but it''s a definite
    improvement.


    You can find this version of Linux at ipod.homelinux.com. Here are the instructions
    for getting Linux onto your iPod:'
  merge: -1
  img_proc: true
