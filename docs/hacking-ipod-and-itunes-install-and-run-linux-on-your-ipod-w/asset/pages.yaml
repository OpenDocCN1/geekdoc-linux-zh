- pgno: 132
  md: '# ## Play with Your

    ## Music


    iTunes is all about hearing music, which is why we''re starting off the

    iTunes part of this book with a discussion about hacking your music

    playing for maximum fun and power. In this chapter, we''ll discuss cool

    tricks you can perform with the basic music playing features in iTunes.


    # ### Playlists


    Playlists are the ticket to advanced listening in iTunes. Without playlists,

    you can still use iTunes to listen to your favorite artists and albums, just as

    you would if you were actually handling physical CDs or LPs. But playlists

    are the magic digital ingredient that let you take full control of your musi-

    cal experience by helping you listen to exactly what you want to hear.


    # ### Turn Selections into Playlists


    Let''s say you''re listening to music in iTunes when you''re struck by an

    overwhelming urge to hear an unusual set of albums—for example,

    *Factory Showroom* by They Might Be Giants, Laurie Anderson''s *Home of

    the Brave*, and the latest from Vito Paternoster. What''s the quickest and

    easiest way to collect those diverse tunes so you can hear them together?

    Try the following steps:


    +   1.  Click Library in the sources list to see all your music.

    +   2.  Make sure the Browser (artist and album names) is showing

    +       above the list of songs. If you don''t see the Browser, choose

    +       Edit ↔ Show Browser.

    +   3.  Look through the list of artists in the Artist column. When

    +       you find one whose album you want to include in your elec-

    +       tric playlist, click to select it.

    +   4.  Keep going through the playlist as long as you want to find

    +       more artists. For each new artist you want to add, hold

    +       down Command (on the Mac) or Control (on Windows),


    # #### chapter

    #### 5


    # in this chapter


    +   ✓ Make a "Freshest

    +   Tracks" Playlist

    +   ✓ Change the Play

    +   Order

    +   ✓ See Precise Playlist

    +   Statistics

    +   ✓ Move Your Playlists

    +      to Another

    +      Computer

    +   ✓ Use a List Column

    +      for Equalizer

    +      Settings

    +   ✓ Get Album Art'
  merge: -1
  img_proc: true
