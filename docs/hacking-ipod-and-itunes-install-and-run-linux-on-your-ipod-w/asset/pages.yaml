- pgno: 215
  md: 'If you''re using Windows, be sure to quit the recorder application before you
    play back files with iTunes. Having a recorder running seems to add crackly sound
    to anything that''s playing. As with WireTap and Audio Hijack, all the Windows
    recording programs we''ve discussed in this section can create MP3s or WAV files,
    which you can then feed into iTunes. And once again, all these programs are available
    at download.com.


    If you''re interested in recording streaming audio and you want to find out more
    cool stuff you can do, see the section *Convert Streams to Songs*, which discusses
    how you can create individual songs while recording Internet radio stations.


    # Hacking the Culture: Music store construction kit


    The iTunes Music Store wasn''t the first attempt to sell digital music online.
    Before Apple opened its virtual storefront in April 2003, there were several attempts
    to entice music lovers into legitimacy and reliability, and away from free file-sharing
    programs. But services such as Rhapsody and Pressplay treated the paying customers
    warily, with severe restrictions on downloading and burning songs, and odious
    requirements such as membership fees just to buy and keep stuff. Apple got past
    all that and simplified things with its policies of 99 cents per song, three computers
    per account, and virtually unlimited CD burning and iPod use, along with making
    the store extremely easy to use. Apple''s store was considered revolutionary at
    the time because it cut through the daunting red tape of music industry contracts
    and egos, which were tougher problems to solve than any technical issues.


    Once Apple established a successful formula, others started to copy it, repeating
    the history of a lot of other innovations in the personal computer industry over
    the past 25 years or so. Existing music stores were redesigned, and new ones started
    to appear, almost all with only slight variations on the standards Apple set.


    Late in 2003, Microsoft announced that it would be working with another company,
    Loudeye, to sell prebuilt online music stores to anybody who wants to open one.
    They set up the software, they provide prenegotiated contracts with music publishers,
    and you get to put your name on the service. In less than 8 months, Apple''s revolutionary
    store had become virtually a commodity. Can Apple continue to be the leader? Only
    by continuing to do what it has always done when it''s been successful: innovating
    to stay ahead.


    # Convert Streams to Songs


    Streaming radio is a great way to discover eclectic, non-commercial, obscure music.
    Using the built-in radio tuner in iTunes, you can explore dozens of Internet-only
    radio stations in categories ranging from pop to classical to religious. In the
    section *Record Whatever Your Computer Plays*, we talked about saving streamed
    music to your hard disk so you can enjoy it any time in iTunes or on your iPod.
    In this hack, we''ll go one step beyond: we''ll discuss'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'tools that not only record streaming music, but also slice it up into its component
    songs for you, almost like magic.


    How does it work? When Internet radio stations broadcast their music, most of
    them also send along information about the songs they''re playing, such as the
    name of the song and artist. When you''re tuned to an Internet station, iTunes
    uses this information to show you what''s playing. Clever programmers have written
    applications that tap into this data to find out when one song ends and the next
    one begins so that they can save the streamed music as separate songs. They use
    the artist and track information to label the saved songs.


    On Windows, you''ll use StreamRipper32 or RipCast. If you have a Mac, you should
    get RadioLover. Whether you have a PC or a Mac, you can find radio stations by
    using the Radio icon in the iTunes source list. But that''s not all—there are
    hundreds more radio stations on the Internet. See *Listen to Streaming Radio*
    in Chapter 5 to find out all about this subject.


    # Windows programs


    StreamRipper32 is a free program for recording streaming radio stations and saving
    the results as individual song files. StreamRipper provides a rather geeky interface
    (remember, it''s a free program!) that lets you connect to streaming radio stations
    and record their streams. It includes a directory of *Shoutcast.com* stations
    so you can pick the one you want.


    For more features and a better user interface, check out RipCast from Xototek
    Software. Figure 8-10 shows RipCast as it records music and displays a list of
    what it''s already procured for you.


    RipCast has Internet Explorer built in, which makes it easy to connect to *Shoutcast.com*
    streams. Once you''ve connected to your favorite station, RipCast starts recording
    tunes to disk as MP3 files, tagging each file with the name of the song and the
    artist. Cool! You can set up timed recordings so you don''t have to wake up at
    3:00 a.m. to record your favorite shows. And RipCast really takes advantage of
    your Internet connection: it can record multiple streams at the same time. There''s
    a free demo version of RipCast, which limits you to 30MB of downloading before
    it hits you up for money. The full version removes the download limitation and
    costs $18.


    # Macintosh programs


    The most popular Mac OS X application for recording streaming radio and splitting
    it into songs is RadioLover (*www.bitcartel.com/radiolover*). This program is
    a descendant of the Mac version of StreamRipper. RadioLover works in conjunction
    with iTunes. You start by selecting the radio tuner in iTunes and clicking one
    or more genre items to display the names of stations. Then, you switch over to
    RadioLover and pick a station to tune. You can listen while you''re recording,
    or just record the songs silently. This is handy if'
  merge: -1
