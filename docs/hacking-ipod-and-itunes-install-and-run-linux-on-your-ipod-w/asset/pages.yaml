- pgno: 248
  md: '# ## Separate and Not Equal


    Each song list gets to have its own separate view settings. Notice how Figure
    10-5 includes the word “Library” and its icon at the top? When you make changes
    to column settings, the settings stick with the library or the playlist you’re
    looking at. This is very handy, because you will often want to look at different
    information for different playlists.


    # ## Fool with the browser


    The list at the top that shows artists and albums (and optionally genres) is called
    the Browser. When you start iTunes, the Browser is hidden. You can display it
    for the library or for any playlists by choosing Edit ⇨ Show Browser. Like column
    settings, each song list keeps its own setting for whether the Browser is displayed.


    You can also mess around with how much screen space the Browser gets. Click and
    drag the bar between the Browser and the songs to split the space between them.
    The dimple on the middle of the bar is a hint that tells you to drag the bar.
    You’ll see another dimple like that on the bar at the left, which divides the
    source list from the rest of the window. Yep, you can drag that one, too.


    # ## Edit in place


    Many of a song’s properties are changeable: song name, album, comments, and so
    on. You can edit these by selecting the song and choosing File ⇨ Get Info to see
    a dialog box, or you can simply click the item in the list to modify it right
    there. The clicking process is a little tricky, but you’ll get used to it. It’s
    the same technique Apple uses to select text in the Finder. First, click to select
    the song you want to edit. Then, click again on the specific text you want to
    edit. You should see an editable text box appear around the words you clicked
    (Figure 10-6). Now you can just type whatever you want, and the entry is changed.


    # ## Playlists too


    Remember, you can use these techniques on playlists as well as the library. They’re
    all just lists of songs to iTunes.


    # ## See Album Art


    You probably already know that iTunes can display the cover art from albums as
    the music plays. What, you didn’t know that? Well, you should immediately go to
    the Edit menu and choose Show Artwork so you can join the rest of us here in the
    future.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_249_0.png)


    FIGURE 10-6: Select and edit text right in a song list.


    Sometimes you''ll be clicking around various songs in your library, hoping to
    look at album art, but the image never changes. That''s probably because the title
    above the album art says “Now Playing”. If you want to see the art that goes with
    the songs you''re looking at, click the words “Now Playing”. The title will change
    to say “Selected Song”, and now you''ll get what you wanted.


    Whenever you buy a song from the iTunes Music Store, you get the album art, free
    of charge. Unless most of your music came from the store, you have a lot of songs
    with no art. One way to change that is by following the advice you see in the
    empty art space: Drag Album Artwork Here. To take advantage of this feature, start
    by selecting the song or album you want to add art to. Then, using a Web browser
    that supports dragging images, such as Safari on the Mac, go to a CD listing in
    an online store, such as Amazon or Wal-Mart, and drag the album art into place
    in iTunes. Instant art! Getting album art this way for all your CDs would be pretty
    tedious, but clever people have invented tools that make the process much easier.
    See *Get Album Art* in Chapter 5 for the full story.


    Art goes into iTunes, but it also comes out. You can get any album art image from
    the art space just by dragging it out and dropping it into another document. This
    is a great way to include your favorite album cover in your next family newsletter,
    school project, or parole report.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Size matters


    Gee, that album art is awfully small, don''t you think? Let''s make it bigger.
    Grab the divider between the source list and the song list, and drag it to the
    right. The album art space starts growing as you drag. You can also make it smaller
    if you want.


    For the maximum viewing effect, click the art image. It will open up into its
    own window, even larger than the biggest size you can get inside the regular iTunes
    window. You can open up as many of these as you want.


    # Summary


    Take care of your music library, because that''s where all the action is in iTunes.
    Using the hacks in this chapter, you can get rid of songs most efficiently, make
    the best use of cool album art, and even carry your tunes between Macs and PCs.
    And because the library is just another list of songs, many of the tricks we''ve
    talked about also work on playlists.


    The next (and final) chapter is all about the iTunes Music Store, the revolutionary
    source of digital downloads that lets you legally acquire music online. Come along
    to Chapter 11 and find out what secret hacks lurk in the store.'
  merge: -1
  img_proc: true
