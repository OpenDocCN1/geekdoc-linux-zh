    # Get Information from the Web


    Because computers see CDs as just big hunks of data, it would be really cool if
    CDs were encoded with information about their songs, such as title, artist, composer,
    and so on. Unfortunately, nobody asked us geeks about this when audio CDs were
    invented. Instead, CDs you import with iTunes have to look up this information
    from a net-accessible database called GraceNote CDDB.


    CDDB’s main function is to automatically get song and album information when you
    import music. By default, iTunes is set up to grab information from CDDB whenever
    you rip a CD.


    > If you don’t have an Internet connection available when you rip a CD, iTunes
    won’t be able to look up track and artist information. However, you don’t have
    to type this data in manually. Just wait until you are connected to the Internet,
    select the tracks that need names, then choose Advanced ⇐ Get CD Track Names.
    iTunes will get the info from CDDB and fill it in.


    But CDDB can do more; there’s also a CDDB Web site where you can look up album
    and artist information. This is useful if you want to see all the albums released
    by an artist, or look at the track list from an album you don’t own. Some CDDB
    pages also include links to fan sites and news stories.


    You can use Apple’s scripts to get quick access to the CDDB Web site. Just select
    a song and choose one of the CDDB Search scripts, such as CDDB Search by Artist.
    Or, you'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'can look up information directly on the site by artist, album, or song title.
    Ever wonder how many songs there are with a particular word in the title, such
    as “old” or “myxomatosis”? Now you can find out! Here’s how:


    +   1. Go to the Gracenote site at www.gracenote.com/music (Figure 6–2).

    +   2. Enter the information you want to search for. You can look specifically
    in the artist, album, or song fields, or choose to search in all fields.

    +   3. To avoid bogus results that include your search term as part of a word
    (for example, searching for “old” and getting results that include “hold”, “cold”,
    and so on), click the “Exact Phrase” box.

    +   4. Choose to see 10 or 25 results at a time.

    +   5. Click Search to get your first set of results.


    Each item in the search results is a link to that song’s entry. You can click
    a song to get more information about that song.


    ![](img/f481d8a0ca491080698039f72bf96e1b_165_0.png)


    **FIGURE 6–2: Gracenote CBDB search page.**'
