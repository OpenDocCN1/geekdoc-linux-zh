    # Miscellaneous quick tricks


    A few scripts in Apple’s collection simply provide shortcuts for features you
    could achieve in other, less hacky but more tedious ways. These include “Open
    Scripts folder,” “Play Random Track”, and “Set Genre to Specific EQ”. I’ll describe
    each of them in this section.'
