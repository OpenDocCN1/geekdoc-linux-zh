- pgno: 139
  md: '# Streaming Radio playlist


    You might not realize that you can include streaming radio stations in your library
    and in a playlist. To add a station to the library, just drag the station''s icon
    to the library in the source list. You can then create a smart playlist of radio
    stations by setting the criteria to “Kind is Playlist URL”.


    Remember to check out smartplaylists.com for many more ideas and to contribute
    your own.


    # Drag and Drop to Create a Playlist


    You can make wonderful things happen in computer programs by dragging and dropping.
    Menu items are explicit, because they advertise their functions in words, but
    drag and drop is more direct, more fun, and feels almost like magic, as if you''re
    reaching into the computer and manipulating real objects. iTunes is loaded with
    drag and drop features. You''ve probably taken advantage of being able to add
    songs to a playlist by dragging from the song list to the playlist. iTunes also
    includes lesser-known features for creating playlists just by shlepping items
    around.


    The basic rule is this: drag something to an empty space in the source list, below
    any of the existing playlists, and you''ll get a new playlist. Go ahead and give
    it a try. Look through the browser and pick one of your favorite albums. Then
    make the album into a playlist by dragging it to the source list, down below the
    last playlist (see Figure 5-6).


    ![](img/f481d8a0ca491080698039f72bf96e1b_139_0.png)


    FIGURE 5-6: You can drag an album to the source list to create a playlist.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'There are a couple of nuances to notice here. As you’re dragging, iTunes provides
    helpful visual feedback on what would happen if you let go of the mouse button
    right where you are. If you’re over a place that will accept the dropped album,
    iTunes tells you so by adding a plus sign to the cursor (on the Mac, the plus
    sign appears in a circle that’s a lovely shade of green). This is what you’ll
    see if you drag below the last playlist. The cursor looks different when you’re
    hovering over a place that wouldn’t know what to do with the album if you let
