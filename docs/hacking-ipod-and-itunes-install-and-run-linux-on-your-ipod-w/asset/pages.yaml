    # ## Safe at Any Speed


    Dealing with various music formats is nothing new. If you’re too young to remember
    vinyl records, you probably didn’t know that they were made to spin around turntables
    at either 33 1/3, 45, or 78 RPM. And if you, like Eddie Vedder of Pearl Jam, do
    have some classic vinyl stashed around, you might wonder why those values were
    chosen.


    Early records (before vinyl) were designed for playback at speeds between 64 and
    100 RPM—there was no universal value. You had to set your gramophone differently
    for each recording. There are various stories about how 78 RPM came to be a standard.
    One theory says that the British Gramophone Company decided on 78 RPM based on
    listening tests performed with their record catalog, while another account claims
    that inventor Eldridge Johnson had created a sewing machine mechanism that rotated
    at 78 RPM, and this technology was adapted for gramophone use.


    The first 33⅓ RPM records were developed in conjunction with sound films. The
    film reels ran for about 10 minutes, so engineers needed to double the five minutes
    available on a 78 RPM record. Projectionists played the sound records along with
    the film, and you could hear what the actors were saying.


    RCA Victor developed the 45 RPM standard for popular vinyl records in the 1940s.
    Supposedly, this speed creates an acceptable balance between recording quality
    and music capacity.


    Now, of course, we don’t have to worry about any of this stuff—unless you count
    MP3, AAC, Windows Media Audio, Ogg Vorbis, AIFF, WAV, and many others. When it
    comes to having lots of music formats, the more things change, the more they stay
    the same.


    For more on this subject, see the article at members.tripod.com/~Vinylville/spindoc.html.


