  md: '![](img/f481d8a0ca491080698039f72bf96e1b_166_0.png)


    For more cool scripts from Apple, see *Use Apple’s iPod Scripts* in Chapter 2.


    # # Check or uncheck multiple tracks


    The “Enable | Disable Selected Tracks” script lets you turn the checkbox on or
    off for all the songs you have selected. iTunes uses the checkbox as a sort of
    master on/off switch for playing songs. If an unchecked song is due to be played
    in a playlist, iTunes simply skips over it. When you set the rules for a new smart
    playlist, you can specify whether you want to allow unchecked songs. To use this
    script, select the songs whose status you want to change, then run the script.
    You’ll get a dialog box asking you to give thumbs up (enable) or thumbs down (disable)
    on the songs (Figure 6-3).


    ![](img/f481d8a0ca491080698039f72bf96e1b_166_1.png)


    Here’s a way to enable or disable a bunch of songs en masse without a script.
    Command-click (Control-click on Windows) any song’s checkbox. All the songs in
    that playlist will have their checkboxes turned on or off.


    # # Export library listings


    iTunes includes a built-in command (File ⇨ Export Library) for exporting your
    music library to an XML file. XML is a great format for exchanging data, but it’s
    not very easy on human eyes. To demonstrate this point, Figure 6-4 has an example
    of part of an exported library XML file.


    If you want to produce a text file of your library that’s intended for people
    rather than computers, use Apple’s “Library Summary” script. This script gives
    you a choice of several formats for your summary. To see the available formats,
    click the “Set Prefs” button when you run the script. You’ll get the list shown
    in Figure 6-5.


    After you pick a format, the script then ponders your library contents and produces
    a simple text file showing all your music. A companion script, “iPod Library Summary”,
    performs the same function for your iPod.


    ![](img/f481d8a0ca491080698039f72bf96e1b_166_2.png)


    FIGURE 6-3: Enable | Disable Selected Tracks script shows you this dialog box.'
