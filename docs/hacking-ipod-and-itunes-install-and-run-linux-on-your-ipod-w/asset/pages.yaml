    # ## Get Music Out by Dragging


    Most of the hacks in this chapter are about getting music out of iTunes by burning
    CDs. Here''s a quick trick that provides another way for music to escape from
    iTunes: you can just drag it out of any song list, such as a playlist or the library.
    When you drag a song and drop it on the desktop or in a folder in the Finder or
    Windows Explorer, iTunes makes a copy of the song and puts it into the destination.
    Even though songs in playlists aren''t the actual song files, iTunes is smart
    enough to track down the song file when you drag, and make a copy of it. The copy
    is in the same format as the original, so if you drag an MP3, you''ll get an MP3,
    and so on.


    # ## Back Up Your Music


    Do you back up your music? You have probably ripped dozens or even hundreds of
    CDs. You finally have all your favorite tunes on your computer. But to your computer,
    it''s all just data, and it''s only as permanent as your next catastrophic disk
    failure. Maybe you''ve even'
