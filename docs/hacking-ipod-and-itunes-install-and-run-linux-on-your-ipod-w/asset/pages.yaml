    # ## Use Terminal


    You can accomplish this hack without TinkerTool or any other third-party software,
    as long as you don’t mind using Terminal to get down in the command line a bit.


    > > **Caution** Terminal provides a command-line interface to your Macintosh.
    If you make a mistake or start playing “I wonder what happens if I do this”, all
    sorts of bad results are possible, including deleting files and messing up the
    system. If you’re not used to fooling around with this stuff, please exercise
    extreme caution.


    +   1. Make sure your iPod is connected to your Mac.

    +   2. In the Finder, choose Go  <->  Computer.

    +     You should now see a window that includes hard disks connected to your Mac,
    including your iPod (Figure 3-4).

    +   3. Run Terminal. If you have never used Terminal, you’ll find it in the Utilities
    folder inside your Applications folder.

    +   4. In Terminal, type the word `touch`, with a space following it. Don’t press
    *Return*.

    +   5. In the Finder window that includes your iPod, drag the iPod icon to the
    Terminal window and drop it there (Figure 3-5).'
