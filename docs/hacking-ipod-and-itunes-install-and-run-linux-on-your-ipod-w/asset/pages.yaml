  md: '![](img/f481d8a0ca491080698039f72bf96e1b_42_0.png)


    # # More Than Music


    The world at large thinks of the iPod as a supercool music player and a snappy
    fashion statement. But one of the reasons for the iPod’s success is that it does
    much more than just store and play music while looking good, and it keeps gaining
    new features all the time, both from Apple and from others.


    In this chapter, we’ll start to explore some of the non-musical tricks you can
    pull with your iPod. A few of these require additional hardware, so I’ll introduce
    you to those toys, while others work with the stock iPod and some additional (usually
    free) software.


    # ## Hardware Accessories


    Apple keeps the iPod hardware locked up pretty tight, but there are definitely
    ways to expand your iPod’s abilities with additional gadgets. In this section,
    you’ll find out some of the basic ways you can add features and convenience to
    your iPod.


    # ### Use standard FireWire cables


    The original iPod worked only with Macs. It wasn’t long before Apple figured out
    that it was a bad idea to shut out the many millions of Windows users in the world
    who might want an iPod, so changes were made. With each update, the iPod became
    friendlier to Windows users. By 2003, two major obstacles stood in the way of
    Windows users becoming full iPod citizens: there was no Windows version of iTunes,
    and most Windows computers were equipped with USB 2.0 for connecting peripherals,
    instead of the FireWire connection required by the iPod.


    Apple solved both these problems by the end of 2003. First, the company shipped
    iTunes for Windows, which is practically a clone of the Mac version. Once this
    happened—an event that Apple billed as “Hell freezing over” because of the unlikelihood
    of the company shipping a Windows-based application—all iPod users had the same
    software. New dock-connector iPods (often called third-generation, or 3G iPods
    by the cool kids) can connect to USB 2.0 as well as FireWire, and because most
    new PCs have USB 2.0, this levels the hardware playing field, too.


    # in this chapter


    +   - Use iPod Hardware Accessories

    +   - Use Your iPod as an External Disk Drive

    +   - Play around with Contacts and Calendar

    +   - Go to Sleep and Wake to Your iPod

    +   - Work with Apple’s iPod Scripts

    +   - Download Audio Books'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Unfortunately, in order to make iPods work with both FireWire and USB 2.0,
    Apple created the dreaded custom connector. Unlike their ancestors, 3G iPods don’t
    have FireWire connectors. The wide, flat custom connector allows 3G iPods and
    iPod Minis to fit into their dock. Apple supplies a cable you can use to connect
    your iPod directly to your computer’s FireWire port. But the drawback to this
    design is that you can no longer hook up with any plain old FireWire cable that’s
    also used for connecting other FireWire devices, such as external hard disks.
    If you’re on the road with your computer, you have to schlep Apple’s special cable.


    This is where the $19 PocketDock from SendStation comes in. (For more information
    about PocketDock, see www.sendstation.com.) PocketDock is a tiny cable adapter
    that lets you use your 3G iPod or iPod Mini with any standard FireWire cable.
    Figure 2-1 shows how it works. Just plug the PocketDock into your iPod’s dock
    connector, and you then have an iPod with a FireWire port, ready to use any FireWire
    cable. SendStation calls PocketDock “essential”, and that seems pretty close to
    the truth. This is the kind of product you would expect to find in the iPod box
    as a nice freebie, because it’s extremely useful.


    # ## Record voice memos


    Belkin’s Voice Recorder for iPod is a cool accessory that turns your iPod into
    a traveling digital recorder. You can use it for speaking notes to yourself or
    recording one-on-one conversations. The Voice Recorder is a small iPod-white box
    that plugs neatly into the iPod’s headphone jack. You don’t have to install any
    software—the iPod already knows all about it. Once the Voice Recorder is connected,
    the Extras menu grows a new item, Voice Memos.


    ![](img/f481d8a0ca491080698039f72bf96e1b_43_0.png)


    FIGURE 2-1: PocketDock from **SendStation**. Courtesy of SendStation.'
  merge: -1
