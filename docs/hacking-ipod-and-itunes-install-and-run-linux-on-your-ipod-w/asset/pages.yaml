    FIGURE 4-18: iPodSync calendar options.


    When you click Sync iPod, the program goes to work, grabbing information out of
    Outlook and copying it to your iPod. The iPodSync screen shows you a progress
    indicator so you can keep track of the sync in progress (Figure 4-19).


    iPodSync includes features that go beyond Outlook synchronization. Click the Web
