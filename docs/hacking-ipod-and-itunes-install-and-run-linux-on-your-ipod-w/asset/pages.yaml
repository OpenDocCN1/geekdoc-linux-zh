  md: '![](img/f481d8a0ca491080698039f72bf96e1b_153_0.png)


    # # Listen to Streaming Radio


    Apple has focused its digital music efforts on selling songs and albums through
    the iTunes Music Store, and iTunes and the iPod are optimized for playing those
    songs and albums. So it might surprise you to learn that iTunes includes a powerful
    radio tuner for listening to thousands of music broadcasters who stream their
    signal on the Internet.


    You might have noticed the Radio icon in the source list, up there in a prominent
    position right under Library—yep, there it is. This icon is your ticket to the
    wide world of listening to Internet radio in iTunes. With few exceptions, streaming
    radio stations are not the same as the commercial stations you can hear over the
    air, although non-commercial broadcasts such as NPR are widely available. This
    means you won’t hear a lot of the same stuff you get on broadcast radio, which
    opens up a huge variety of musical tastes and genres.


    To check out the stations available in iTunes, follow these steps:


    +   1. Click the Radio icon in the source list. You’ll get a list of categories,
    each with a triangle next to it.

    +   2. Click a triangle next to the category of music (or other programming, such
    as *Talk/Spoken Word*) that you’re interested in hearing. iTunes will take a moment
    and download a list of available stations, with descriptions, as shown in Figure
    5-19.

    +   3. Double-click a station you want to hear. After a few seconds, you should
    hear its stream in iTunes. The iTunes status display gives the name of the stream,
    the current track, and the length of time you’ve been listening.


    In general, you’ll get better quality streaming from sources with higher bit rates
    (see the Bit Rate column). But don’t shy away from the streams with lower rates,
    such as 56K or even 32K bits per second. Depending on your surroundings and the
    kind of music the station is playing, those bit rates can be very listenable,
    especially if you’re stuck somewhere with a feeble Internet connection.


    You’ll find hundreds of stations listed in iTunes—you’re bound to like at least
    some of them. And if not, many other stations are available on the Web at sites
    like **Live365.com** and'
  merge: -1
  img_proc: true
