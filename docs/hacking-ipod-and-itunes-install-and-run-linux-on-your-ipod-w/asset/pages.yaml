    # ## Master the Visualizer


    Playing beautiful music is not enough: iTunes turns your tunes into art. The Visualizer
    feature replaces most of the iTunes window with groovy animation that soothes
    and hypnotizes. Starting the Visualizer is easy: just choose Visualizer ⇄ Turn
    Visualizer On. When you do that, you''ll no doubt be distracted by the pretty
    colors for awhile. Go ahead and stare. I''ll be here waiting when you get back.


    # ### Set visualizer options


    Although the Visualizer displays nifty images by default, you can play around
    with a bunch of settings to control it more precisely. To see the settings, click
    the Options button at the top right corner of the iTunes window while you have
    the Visualizer turned on (not in Full Screen mode). You''ll see a dialog with
    four check boxes (five on the Mac version). The options are as follows:


    +   - *Display frame rate*: When you turn this one on, the Visualizer display
    will show you how many times per second the screen effect is being redrawn.


    +   - *Cap frame rate at 30 fps*: This option limits the amount of processing
    power devoted to the visual effect being drawn so it doesn''t cause everything
    else on your computer to slow down.


    +   - *Always display song info*: Turn this checkbox on to keep the name of the
    song, artist, and album showing in the lower left corner of the visual effects.
    See Figure 6-17 for an example.


    +   - *Faster but rougher display*: If your visual effects seem to be redrawing
    too slowly, try turning this checkbox on.


    +   - *Use OpenGL* : (Mac only) This option determines whether the Visualizer
    uses Apple''s OpenGL graphics technology to draw the effects. Depending on which
    Mac you have and what modes you''re using, turning this setting on might make
    your display smoother — try it and see.


    The preceding options are a little tricky to find, but there are others that are
    even more well-hidden. To see them, type ? while the Visualizer is running. When
    you do, you''ll get a list of additional settings right there in the Visualizer
    screen. They only stay onscreen for a few seconds before vanishing into the ether,
