- pgno: 47
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_47_0.png)


    FIGURE 2-4: Belkin Digital Camera Link. Courtesy of Belkin.


    # Belkin Digital Camera Link for iPod


    Belkin’s second product for off-loading digital photos works in a different way,
    without having to use storage cards. To use the Digital Camera Link (Figure 2-4),
    you connect it directly to your camera’s USB port, then hook the Digital Camera
    Link to the iPod’s dock connector. Your photos will magically flow to the iPod.
    Then, when you get back to your computer, you can transfer the photos over from
    the iPod.


    Belkin Digital Camera Link for iPod requires a 3G iPod and costs about $90 at
    Apple stores or directly from Belkin.


    How can you decide which Belkin photo device to use with your iPod? Here are some
    guidelines. Choose the Media Reader for maximum flexibility and storage, because
    you can transfer photos from an unlimited number of cards. However, the Camera
    Link is smaller and uses just two AA batteries instead of four AAA required by
    the Media Reader. The Camera Link is also about $10 less expensive, so if you
    don’t need to transfer more than one card’s worth of photos, the Camera Link is
    a good pick.'
