  md: '# ## Record companies


    Lots of smart record companies have figured out that offering free MP3s on the
    Web is a great way to promote their bands. Here are some record label sites for
    you to check out:


    +   - Rhino Records has lots of cool releases, and you can get some free tracks
    from them at `www.rhino.com/fun/downloads.lasco`. Unfortunately, the free songs
    stop working after 30 days (they''re Windows Media Audio).


    +   - Find various free MP3s from Matador Records at `www.matadorrecords.com`.


    +   - You can get tunes from well-known artists like Steve Earle, Warren Zevon,
    and the Reverend Horton Heat at `www.artemisrecords.com/downloads.aspx`.


    +   - Lookout Records has more free MP3s than most record companies. They''re
    available at `www.lookoutrecords.com/sounds`.


    +   - Check out tracks from Tom Waits, Joe Strummer, and others at `www.anti.com`.


    +   - Visit Blind Pig Records at `www.blindpigrecords.com/contact.html` to download
