  md: '# Reshuffle a playlist


    Shuffle play, also called random play, is one of the absolute coolest features
    of iTunes and the iPod. Without shuffle play, we would be stuck listening to songs
    in a fixed order, just like it used to be in the old analog days of cassettes
    and vinyl LP-ROMs. With shuffle play, not only can you change the sequence of
    songs you hear, you don''t even have to think up the new order yourself: just
    ask the computer to do it for you.


    You can shuffle any playlist. To turn on shuffle play, click the crossed-arrows
    button at the lower-left edge of the iTunes window. This works for the Library
    as well as playlists. Each playlist remembers its own shuffle setting, which is
    handy when you want to randomize the tunes in your personal “greatest hits” list
    while playing favorite albums from the Library in their correct song order.


    When you create a new playlist, smart or otherwise, the songs are listed in the
    order they''re going to be played. The first column, the one with numbers, shows
    this play order. If you click another column, you''ll sort the playlist and change
    the play order. Turning on shuffle is like throwing the play order out the window.
    If you have Shuffle turned on and you want to see the order in which the songs
    will play, you have to click the Play Order column, as shown in Figure 5-12.


    ![](img/f481d8a0ca491080698039f72bf96e1b_145_0.png)


    FIGURE 5-12: When you''re listening to a shuffled playlist, you can see the play
    order by clicking the first column.'
  merge: -1
  img_proc: true
- pgno: 146
  md: "Let's say you've turned shuffle on and clicked the Play Order column. Maybe\
    \ you're not happy with the order, even though you've trusted iTunes to mix things\
    \ up, because you really wanted to hear several tunes that are tragically stuck\
    \ near the bottom. How can you change the play order of a shuffled playlist? When\
    \ you have Shuffle turned off, and the Play Order column is selected, you can\
    \ rearrange songs in the playlist just by dragging them around (try it). But when\
    \ Shuffle is turned on, iTunes is in control of the play order. If you try to\
    \ usurp its power by dragging a song to a new position, it simply ignores you.\n\
    \nAlthough you can't explicitly move songs around in a shuffled playlist, you\
    \ can force iTunes to pick a new random order. Turn Shuffle off, then on again,\
    \ either by clicking the Shuffle button twice or by choosing Controls ⇄ Shuffle\
    \ twice. Every time you do this, iTunes reshuffles, so you can see if you like\
    \ the new order better.\n\nTurning Shuffle off and on again is not a very elegant\
    \ solution to this problem, so the iTunes folks invented a shortcut for reshuffling\
    \ a playlist. Hold down the Option key on Macintosh or Shift key on Windows, then\
    \ click the Shuffle button. Your playlist will get re-randomized. Note that if\
    \ you're looking at the playlist with another column selected, such as Song Name\
    \ or Artist, you won't see the song order change, because you're not looking at\
    \ the songs in play order. To see the listing change when you reshuffle, be sure\
    \ the Play Order column (the first one) is selected.\n\n> **Tip**  \n> If you're\
    \ about to start listening to a shuffled playlist and there's a song in the list\
    \ that you really want to hear right away, you don't have to suffer the tyranny\
    \ of iTunes by waiting until its turn comes. For instant gratification, just double-click\
    \ that song to start your listening. When your song is done playing, iTunes will\
    \ continue through the rest of the playlist in random order.\n\n# Shuffling Madness\n\
    \nYou might think that shuffle play would be simple and straightforward. Like\
    \ many features in Apple products, there's an easy way to use shuffle, which is\
    \ good enough for most users, most of the time. But then Apple added tweaks that\
    \ enable greater control for those who are interested.\n\nHere's an example: every\
    \ playlist has its own shuffle setting, as we noted earlier. This feature lets\
    \ you turn on shuffle play in your “Hip-hop goodness” list, while keeping shuffle\
    \ play turned off for “Les Filles de Sainte-Colombe's greatest hits”.\n\nPer-playlist\
    \ shuffle setting doesn't work on the iPod, however. When you listen to tunes\
    \ on your iPod, there is a global shuffle setting that's used no matter what music\
    \ you're playing. The iPod shuffle feature has some nuances of its own. Rather\
    \ than a simple on and off setting, the iPod lets you choose from two different\
    \ kinds of shuffle: songs and albums. The “albums” setting is useful if you have\
    \ a playlist of favorite albums—your iPod will play whole random albums from the\
    \ list, one after another. The “songs” mode simply jumps from tune to tune regardless\
    \ of album. iTunes has a similar setting on the Advanced tab in the Preferences\
    \ dialog box."
