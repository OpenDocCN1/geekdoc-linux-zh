    # ### Wrangle same-named tracks


    The Wrangle Same-Named Tracks script is another tool in the war against unwanted
    duplicates. Wrangle Same-Named Tracks finds all tracks that have a given word
    or words in their title, then moves them all to a new playlist. Here''s how it
    works:


    +   1. Click a track in the library or any playlist. (Note: if you don''t select
    a track before you run the script, it will ask you to type in a track name when
    you run it.)

    +   2. Choose "Wrangle Same-Named Tracks" from the Scripts menu. The script then
    searches the library for other tracks with the same name, creates a new playlist,
    and puts all the same-named tracks into that playlist.


    At this point, you''re on your own. The idea is to look at the contents of the
    new playlist, listen to the songs, check their tags, and decide which ones to
    keep and which to trash.


    Note that using this script to search for tracks is not the same as typing text
    in the Search box at the top right corner of the iTunes window. When you type
    in there, iTunes looks for the text you typed in *any* field of the song. Wrangle
    Same-Named Tracks searches track names only.


    # ### Corral all dupes


    Check out these cool script names: Corral, Wrangle—it''s like a musical rodeo!


    But seriously, Corral All Dupes goes through your library looking for tracks that
    have the same song name, artist, and album. When it finds such tracks, it puts
    them in a newly created playlist called Dupes that it constructs for just this
    purpose. After Corral All Dupes has finished its work, you can go through the
    new playlist and get rid of unwanted tracks.


    ![](img/f481d8a0ca491080698039f72bf96e1b_171_0.png)


    **Note**


    AppleScript is an easy language to use because of its English-like syntax. But
    one of the tradeoffs for this ease of use is leisurely speed. Some scripts, such
    as Corral All Dupes, can take a long time (like hours) to work. The best thing
    to do is run the script as the last thing you do before going to bed, and let
    it run overnight. That should be enough time to get the job done, assuming you
    get enough sleep.


