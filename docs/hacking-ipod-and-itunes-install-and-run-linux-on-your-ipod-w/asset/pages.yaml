  md: '# Use Keyboard Shortcuts with Playlists


    Point-and-click is great, but to really do cool tricks, you need obscure keyboard
    combina-tions. In this section, you’ll find out about a potpourri of hacky things
    you can try at home with playlists and keyboard shortcuts.


    # Create a new smart playlist


    The “+” button at the bottom of the source list is a fast, direct way to make
    a new playlist. Click it once, twice, 12 times, and get a new playlist every time.
    What if you want to cre-ate a new smart playlist instead of an, uh, un-smart one?
    You can use File  New Smart Playlist, or its three-fingered keyboard shortcut,
    Command-Option-N on Mac or Control-Alt-N on Windows. But here’s the niftiest way
    to create a new smart playlist:


    +   1.  Hold down the Option key (Mac) or the Shift key (Windows). You should
    see the “+” button change into a gear (see Figure 5-11), the icon for smart playlists
    (Apple uses the gear to indicate features that are a bit nerdier than most.)

    +   2.  While you’re still holding down the modifier key, click the gear. The
    Smart Playlist dialog box will appear and you can set the conditions for your
    new playlist.


    ![](img/f481d8a0ca491080698039f72bf96e1b_144_0.png)


    **Note** Because Windows computers don’t have an Option key, iTunes uses the Shift
    key in this case to replace the function that Option performs. On a Mac, if you
    hold down Shift while clicking the “+” button, you get a new playlist containing
    the current selection, an entirely different feature.


    ![](img/f481d8a0ca491080698039f72bf96e1b_144_1.png)


    **Tip** For much more information on fun things you can do with smart playlists,
    see the section *More ideas for Smart Playlists* in this chapter, and check out
    www.smartplaylists.com, where you’ll find ideas, discussions, and tips about smart
    playlists in iTunes.


    ![](img/f481d8a0ca491080698039f72bf96e1b_144_2.png)


    FIGURE 5-11: The “+” button that creates a new playlist changes to a gear when
    you hold down a modifier key.'
  merge: -1
