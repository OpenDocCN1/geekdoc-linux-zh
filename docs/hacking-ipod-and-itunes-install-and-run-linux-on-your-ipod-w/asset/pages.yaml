    # Getting the iPod Name Right


    Dragging the iPod and dropping it into the Terminal window copies the pathname
    of the iPod for you. This is a shortcut that''s easier than typing the iPod name,
    and it also makes sure the name is in the proper format for Terminal. This is
    important if your iPod name includes certain non-alphanumeric characters, such
    as spaces and apostrophes. For Terminal to recognize these characters properly,
    they have to be preceded by backslashes. Otherwise, Terminal or a shell command
    might treat them as characters with a special meaning. For example, if the name
    of the iPod is “Superfly’s iPod”, dragging and dropping it into Terminal adds
    this text:


    ```

    `/Volumes/Superfly\’s iPod`

    ```


    Each backslash indicates to the shell that the character following it is simply
    part of a name and doesn’t have special meaning.


    +   1. Click in the Terminal window and press Delete once to remove the blank
    space after the name of the iPod, but don’t press Return yet.


    +   2. Still in Terminal, type the following text: **iPod_Control/Device/_show_voltage**.
    (Don’t forget the slash at the start or the three underscores.) The whole command
    line in Terminal now reads as follows:


    ```

    `[neb:~] scott% touch /Volumes/Superfly\’s

    iPod/iPod_Control/Device/_show_voltage`

    ```


    (Instead of “neb”, “scott”, and “Superfly’s iPod”, you’ll see your disk, user,
    and iPod names.)'
  merge: -1
  img_proc: true
