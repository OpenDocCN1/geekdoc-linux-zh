  md: '![](img/f481d8a0ca491080698039f72bf96e1b_154_0.png)


    FIGURE 5-19: The iTunes radio tuner shows its categories.


    ShoutCast.com. You can also listen to lots of public radio stations in iTunes.
    For example, you can hear NPR on KCRW radio, available at http://www.kcrw.com/grid.


    Another cool way to listen to radio from Live365 is Radio365, a custom tuner application
