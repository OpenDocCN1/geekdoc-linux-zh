    # ## Use Your iPod as an External Disk Drive


    You can use your iPod as a highly portable, large-capacity external disk drive.
    Make sure the “Enable disk use” box is checked in iPod Preferences in iTunes,
    and your iPod will show up as just another disk in the Finder or Windows Explorer.
    Once you’ve done that, you can use its excess capacity to store any files you
    want.


    There is one drawback to using your iPod this way, or for any other purpose than
    simply getting music from iTunes. When your iPod is purely for music, and you’re
    using the auto-matic update feature, the iPod gets its songs from iTunes every
    time you connect to the computer. All the tunes are stored on the computer and
    copied over to the iPod when you sync. This means, in effect, that the iPod is
    just a backup device for songs on your computer. If that’s all you use your iPod
    for, the iPod’s contents are completely disposable: you'
