- pgno: 98
  md: 'Once you see the song in Search Results, you can simply drag it to another
    location, such as your hard disk, and the Finder will happily copy it over. If
    it''s a song that you bought from the iTunes Music Store, the restrictions on
    playing the song come right along, so you can''t use this technique as a way of
    breaking Apple''s digital rights management.


    This is a handy technique for finding and copying a single song. What if you want
    to simply move all the songs from your iPod to your hard disk? Start by doing
    the preceding steps 1 through 5 to get ready to search your iPod''s music. Then
    continue with these steps:


    +   1. Make the first search criterion “Visibility” for “Visible and invisible
    items”, and be sure it''s the only criterion listed. If you have another criterion
    there, maybe left over from a previous search, click the minus sign next to it
    to delete it.


    +   2. Click Search to uncover everything in the Music folder. You''ll get a Search
    Results window like the one in Figure 4-2.


    +   3. Scroll the Search Results window to the right until you see the “Size”
    column. Click that column''s header (where it says “Size”). You''ll get a list
    of files in the iPod''s Music folder in order from the largest to the smallest.
    This has the side effect of putting all the songs at the top, and the wacky folders
    that the iPod uses to organize your music (with names like F00, F01, and so on)
    at the bottom.


    +   4. Click the first song in the Search Results window. Scroll down until you
    can see the last song, just above the parade of folders (F00, and so on). Shift-click
    the last song. This will select all the songs in the window.


    +   5. Open a Finder window and create a new folder (File New Folder) on your
    hard disk to hold your iPod music. Name it “my iPod music”.


    +   6. Drag the song files from the Search Results window to the “My iPod music”
    folder. The Finder will copy your songs from the iPod to your hard disk.


    ![](img/f481d8a0ca491080698039f72bf96e1b_98_0.png)


    **Note** After you drop the songs in the destination folder, you might get an
    error message from the Finder saying something like “The selected items cannot
    all be put into the same location, because at least one of them is busy.” The
    problem here is that you have two (or more) song files with the same name. On
    the iPod, they''re in different folders, but now you''re putting them all into
    the same folder on your hard disk. The solution is to find the offending files
    in the Search Results window—you can click the “Name” column to help track them
    down—and then Command-click one of them to remove it from the selection. Try dragging
    and dropping again. You might have to repeat this process if you have more than
    one set of same-named files.


    # The same thing, only hackier


    If you''re happier typing at a command line than doing all that fancy-pants dragging
    and dropping, here''s a way you can use Terminal to copy songs from your iPod.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_99_0.png)


    **Figure 4-2:** If you don''t specify a file name to search for, you''ll get a
    list of all the songs on your iPod. Courtesy of Apple.


    Be careful with Terminal. You get to mess with your computer and iPod from a real
    Unix shell. The civilized veneer of the Finder and the Aqua user interface are
