- pgno: 12
  md: "# ## Acknowledgments\n\nAll the people in this list are true hackers: they\
    \ bent reality to help me write this little book.\n\nDavid Sayer, king of notes,\
    \ supplied vast amounts of Note Reader information.\n\nKeith Stattenfield helped\
    \ with logistics and heuristics.\n\nJohn Vink wrote the Celebrity Playlist application\
    \ in Chapter 11 and provided lots of support and encouragement.\n\nGreg Marriott,\
    \ always helpful, delivered crucial info and a couple of great stories.\n\nTony\
    \ Fadell, ringmaster, offered encouragement and insight.\n\nSpecial thanks to\
    \ the authors of shareware and scripts that greatly enhance what we can do with\
    \ our iPods and iTunes.\n\nCarole McClendon makes everything works smoothly, all\
    \ the time.\n\nChris Webb gave me the chance to write about something I love,\
    \ and he and Scott Amerman guided the project from start to finish.\n\nBarbara\
    \ Knaster was the Schwag Queen, in charge of getting samples of iPod accessories,\
    \ and the Permit Person, making sure we had permission to use screen shots and\
    \ product images.\n\nThe following companies kindly provided samples and support:\n\
    \n+   Arkon  \n+   ATI  \n+   Belkin  \n+   Griffin Technology  \n+   Marware\
    \  \n+   Sendtation Systems  \n+   Slim Devices  \n+   Ten Technology  \n+   Xtreme\
    \ Mac\n\nMost of all, thanks to Jess and Devi for living through yet another one\
    \ of Dad's crutches."
