  md: '# Record Whatever Your Computer Plays


    This section is about one of the most flexible ways to get music into your iTunes
    library: recording whatever audio you can convince your computer to play. Maybe
    you like to listen to streaming audio. Lots of cool radio stations broadcast their
    signals on the Internet. Many popular commercial radio stations are available
    this way. Other sources of streaming audio are Web sites for musical artists,
    song samplers on sites that sell music, and online music stores.


    All these streaming services are wonderful, but one problem with them is that
    you can''t save the recordings—you can only listen to them, and then they''re
    gone. In this hack, we''ll discuss some very cool tools that neatly solve that
    problem: programs that record the audio your computer is playing.


    # Macintosh programs


    WireTap is a cool program that simply records everything that you hear coming
    out of your Mac''s speaker. This wonderful application is available for an incredible
    price—free—from Ambrosia Software. WireTap provides an eloquent user interface,
    most of which you see in Figure 8-8. Yep, that''s all there is!


    If that''s just too simple for you and you want more control, WireTap also includes
    a preferences panel that lets you set values like whether and how to compress
    sounds, where to put recorded files, what to name them, and which application
    should be used to play them back. Because WireTap saves standard audio files,
    iTunes is happy to play them for you. You can even add them to playlists and ship
    them off to your iPod.


    WireTap is wonderful and free, but you should also check out Audio Hijack and
    Audio Hijack Pro, published by Rogue Amoeba Software. These nifty programs have
    a bunch more features you can use when recording audio on your Mac. You can record
    from specific applications only, start and stop recording at predetermined times,
    and add DSP effects to your recorded files. You can also record directly to MP3
    files. Audio Hijack Pro


    ![](img/f481d8a0ca491080698039f72bf96e1b_213_0.png)


    FIGURE 8-8: WireTap''s user interface is about as simple as you can get. There
    are buttons to start recording, pause, and stop. The window tells you if WireTap
    is recording, paused, or idle, and displays the length and file size of the current
    recording.'
