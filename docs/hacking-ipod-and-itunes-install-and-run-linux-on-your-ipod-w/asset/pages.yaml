- pgno: 252
  md: '# # iTunes Music Store


    On April 28, 2003, Apple opened its newest store: the iTunes Music Store. This
    store instantly changed the rules of the legal online music business forever.
    iTunes was the first music store that thought about what customers wanted instead
    of what record companies demanded. For the first time, you could:


    +   - Buy music online without having to pay obnoxious monthly membership fees.

    +   - Move music between your computers and music players with reasonable freedom.

    +   - Burn as many CDs as you wanted.


    Since then, the store has been a huge hit, selling tens of millions of songs to
    Mac and Windows users. Apple continues to expand the store, adding artists and
    features.


    In this chapter, we hack the store: we find the cool and little-known ways to
    wander around, look in the basement and the back rooms (is somebody smoking back
    there?) to find special stuff like music videos and artist biographies, and learn
    how to discover what’s new in the store without even having to visit. Let’s go
    shopping!


    # ## Get Around the Store


    Shopping a virtual store like the iTunes Music Store is both better and worse
    than going to a physical store. One of the main differences is the way you get
    around the place. When you’re there in person, there’s one method for exploring
    the store: you walk from one department to another. In the iTunes Music Store,
    there are lots of ways to move around and get what you need, find what you want,
    or discover cool new things. In this section, we’ll discuss some of the powerful
    and lesser-known ways of exploring the store.


    # ## Use navigation tools


    Apple’s store is not a Web site, of course, but instead is an embedded part of
    iTunes. This gives the company greater control over how the


    # chapter

    11


    +   in this chapter

    +   - Get Around the Store

    +   - Buy Music at the Store

    +   - Get More Free Stuff from the Store

    +   - Use iTunes Music Store Links

    +   - Miscellaneous Store Hacks'
  merge: -1
  img_proc: true
- pgno: 253
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_253_0.png)


    FIGURE 11-1: iTunes Music Store home page.


    store works, because it doesn''t depend on which browser or even which operating
    system you''re using. And Apple loves to control your experience. When you click
    Music Store in the sources list, iTunes shows you the store''s home page, something
    like what you see in Figure 11-1.


    Wow, it''s so shiny! There''s lots of cool stuff to see, and plenty to click.
    You can click the feature boxes at the top, any of the tiny album covers, or the
    items in the various lists, such as names of artists, albums, and songs. If you
    wonder whether some text on the screen is a link, just point the mouse at it.
    If you see an underline when the cursor is hovering, it''s a link. The store''s
    home page includes five small windows labeled New Releases, Exclusives, Pre-Releases,
    Just Added, and Staff Favorites. Each of these windows shows four albums, but
    they all scroll to reveal more when you click the arrows on the left or right.
    If you would rather all the albums in the window at once rather than watching
    them scroll past, click the See All link at the top right corner of the miniature
    window.


    Take a look at the navigation controls at the top of the window. Use the cute
    little picture of a house to get back to the store''s home page any time. The
    arrows pointing right and left are back and forward buttons for the store. They''re
    pretty handy—use them the same way you do in a Web browser.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_254_0.png)


    FIGURE 11-2: *iTunes Music Store home page*.


    As you look at artists and albums, words that describe the item you''re looking
    at appear next to the home button, as shown in Figure 11-2. These words form a
    sort of breadcrumb trail that shows how to get back from where you are. The words
    are actually buttons: click one to jump to any point in the hierarchy.


    iTunes Music Store pages have zillions of arrows strewn about. For example, when
    you''re looking at a list of songs resulting from a search, there are arrows next
    to each artist, album, genre, and composer name. You can click any of these arrows
    to go to a page all about that topic.


    The store gives you ample opportunity to communicate with the outside world while
    you''re shopping. Whenever you''re looking at the page for an artist or album,
    you can click “Tell a friend” to send a cool e-mail postcard that includes links
    to the artist or album. When your friend (or other, non-friend recipient) gets
    the e-mail and clicks a link, iTunes goes to the store and shows the appropriate
    page. Apple is happy, apparently, to hear what you think of the iTunes Music Store.
    Click Requests & Feedback on the home page to get a form you can fill out to submit
    ideas about the store.


    # ## Narrow your search


    The Search Music Store box at the top right corner of the screen is great for
    finding something in a hurry. If you''re looking for *Black Friday* by Steely
    Dan, just click in the search box and type **Black Friday**, then press Return,
    and you''ll quickly get a list that includes what you want. Sometimes the results
    from a quick search are a bit too broad to be useful. For example, let''s say
    you''re interested in collecting cover versions of the classic song “Yesterday”
    by Lennon & McCartney (although it''s pretty well known that Paul wrote and recorded
    it mostly by himself). If you simply search for “Yesterday,” you''ll be inundated
    with too many results. “Yesterday” has been covered hundreds of times, but this
    search returns lots of songs that aren''t the ones we want.


    You can do a little better by clicking the magnifying glass in the search box
    and choosing Songs. This tells the store to look for the word “Yesterday” in song
    titles only, which eliminates a bunch of the results. But we''re still getting
    songs that have “Yesterday” anywhere in the title. The best way to get what we
    want is Power Search. To use Power Search, click the magnifying glass and choose
    Power Search at the bottom of the menu.


    Power Search lets you instruct the store to match information in specific tags.
    In this case, we can say we want to look for “Yesterday” in the song title and
    “McCartney” in the composer name. The result is a list of 10 songs that are much
    more likely to be what we''re looking for.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_255_0.png)


    FIGURE 11-3: iTunes Music Store music browser.


    # ## Use the browser to find music


    If you come to the iTunes Music Store looking for a particular album, you''ll
    probably go straight to the Search Music Store box and type in the name of the
    record you want. But if you''re not there to buy anything in particular, and you
    have some time to kill and money to burn, check out the music browser. You can
    get the browser by clicking the Browse Music link on the home page, or poking
    the big eyeball at the top right corner of the iTunes window. The browser displays
    three columns—Genre, Artist, and Album—as shown in Figure 11-3.


    To use the browser, click a Genre in the left column. iTunes then fills in the
    Artist column with a list of choices. When you pick an Artist, albums appear in
    the column on the right. Picking an album puts its songs in the song list at the
    bottom. You can also choose "All" in the Album column to see all the artist''s
    songs at once. From the song list, you can double-click a song name to hear a
    30-second preview, click an arrow to go that item''s page, or even spend some
    money and buy the song.


    The music browser includes one handy, hidden trick: double-click any item in the
    Genre, Artist, or Album columns to go directly to that item''s page.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_256_0.png)


    You can customize how you want the columns to appear in your iTunes Music Store
    browser, just as you can with any playlist. To change column widths, drag the
    divider line between columns. To move a column, grab the header and move it somewhere
    else. You can use the Edit ⇄ View Options command to decide which columns to display.
    For more on this, see *Bend Columns with Your Bare Hands* in Chapter 10.


    # ## Browse genre pages


    One of the best-kept secrets in the iTunes Music Store is the existence of a home
    page for each genre. These pages look a lot like the store''s home page, except
    that they''re focused on one particular musical style. All the music on the home
    page—New Releases, Staff Favorites, Featured Artists, Today''s Top Songs, and
    so on—is for that genre only. Most home pages have categories that are specific
    to that genre; for example, the New Age home page includes a set of *Relaxing
    Ambient* selections. Genre home pages provide a great way to find new music in
    a genre you''re not very familiar with. So if you''ve loved classical music all
    your life, but now you suddenly want to try Hip Hop, this is a great way to do
    it.


    You can get to a genre home page by clicking a genre link anywhere you see one,
    such as in a song list. You can also go directly to a genre home page by clicking
    the pop-up list that appears on the left side of any home page in the store.


    # ## Find all new music


    The store''s home page has a small New Releases box that shows you four new albums
    at a time. Four is not enough! You can see all the new releases by clicking See
    All at the top right corner of the New Releases box. When you do that, not only
    do you get a full list of the tunes added this week, but iTunes also shows you
    the new releases for each of the three previous weeks. This is handy for catching
    up on your new music purchases after you win the lottery.


    ![](img/f481d8a0ca491080698039f72bf96e1b_256_1.png)


    You can subscribe to a very cool weekly e-mail newsletter that lets you know about
    all the new music added to the store. The e-mail, called “*New Music Tuesdays*”,
    comes with direct links to the store—just click in the e-mail and iTunes will
    take you to the album. To subscribe, go to `http://enesus.apple.com/subscribe`
    and fill out the form, or change settings as described in *See Your Account Information*
    in this chapter. And yes, new music always comes out on Tuesdays, for some reason.


    # ## Browse music in charts


    In its never ending quest to separate us from our money by providing great tunes,
    the iTunes Music Store offers a clever new way to browse: charts. So far, Apple
    provides two kinds of charts you can peruse: Billboard charts, which document
    the most popular songs, according to sales and radio airplay data; and radio charts,
    which show the tunes that are'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'most played on particular radio stations. To use this feature, you click Billboard
    Charts or Radio Charts on the home page, or select one of the charts in the music
    browser.


    # Billboard charts


    If you want to look at the Billboard charts, you''ll get a choice: as of this
    writing, you can select Billboard Hot 100, Billboard Top R&B, or Billboard Top
    Country. Apple has said that others will be added.


    The charts are organized by year, and they go all the way back to 1946, so if
    you''ve listened to popular music any time in the past 58 years or so, you have
    a good chance of finding something here you''ll like. Browsing through a chart
    from your younger days brings a heavy dose of nostalgia, and you''re likely to
    spend time listening to more than one 30-second preview. You also might spend
    money, of course. Sure, you have those songs on vinyl LP-ROM somewhere, but at
    99 cents a pop, it''s easy to justify buying them again so you can play them in
    iTunes and on your iPod.


    The key limitation of this feature is that not all songs on the charts are available
    in the Store. For example, 74 of the Billboard Hot 100 for 1980 can be purchased
    in the Store, as can 53 of the Top Country 75 for 1998.


    ![](img/f481d8a0ca491080698039f72bf96e1b_257_0.png)


    If you would rather save that 99 cents and digitize your LPs, be sure to check
    out “Get LPs into iTunes” in Chapter 8.


    # Radio charts


    You''ll love this feature if you like to listen to over-the-air radio when you''re
    not grooving to iTunes and iPod music. The Music Store radio charts tell what''s
    playing on more than 1000 radio stations in the United States, in over 200 cities
    and towns. So whether you like 107.7 The End in Seattle, or you''re a Foghед fan
    of KFOG in San Francisco, you can see what they''re playing and buy the tunes
    in the Store.


    # Buy Music at the Store


    There are lots of ways to hack your buying experience at the iTunes Music Store
    to make it more comfortable. In this section, we''ll discuss ways to get the most
    for your dollar (or 99 cents) as you add to your music collection.


    # Use the Shopping Cart


    If you use Apple products a lot, you know that a big part of the company''s genius
    lies in making products that are easy to use, not just more advanced technically.
    The 1-Click feature in the iTunes Music Store is a great example. 1-Click lets
    you buy a song just by'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'clicking a button. Apple didn''t even invent 1-Click—it''s licensed from Amazon.com—but
    it''s an important part of the store experience.


    Even though 1-Click is very handy, sometimes it''s better to turn it off. If you
    have a slow Internet connection and you''re buying several songs, it can be a
    drag to have to wait while iTunes downloads each tune. You can turn off 1-Click
    and use a shopping cart instead, a feature that should be familiar if you spend
    any time buying stuff on the Internet.


    When you use the cart, iTunes adds a Shopping Cart icon to the sources list, and
    all the “Buy” buttons in the store change to “Add”. When you click one of these,
    the song or album goes into your shopping cart. Any time you want to review the
    contents of your cart, click its icon in the sources list and you''ll see what''s
    inside. In the cart, Apple thoughtfully includes a list of other songs you might
    like, based on what you have already picked up. You can click “BUY NOW” to download
    the songs you''ve selected, or “REMOVE” to change your mind about an album or
    track.


    If you want to go on the cart, open iTunes Preferences and click the Store tab.
    In the dialog box, click “Buy using a shopping cart”. Click OK, and your cart
    is ready. You can switch back to 1-Click any time you want.


    # ## See your account information


    You have a trusted relationship with the iTunes Music Store. It knows important
    information like your name, address, and credit card number. You can review or
    change any of the info you''ve entrusted to the store by checking your account
    information. To see or change your account info:


    +   1. Click Music Store on the sources list.

    +   2. If you''re not signed in, click the Sign In button and supply your account
    ID and password.

    +   3. Once you''re signed in, click your account ID in the sign-in box. You''ll
    be asked for your password again. Type it in and click View Account.


    After completing these steps, you''ll see the Apple Account Information screen.
    From this screen, you can change your e-mail address, credit card, and password
    reset info. You can also buy or redeem a gift certificate, set up an iTunes allowance,
    or take a look at all the music you''ve bought from the store since the beginning
    of time (which as you know was on April 28, 2003). To look at your past purchases,
    click the Purchase History button.


    There you see it: your past comes back to haunt you. Note that Apple doesn''t
    provide a total of all the money you''ve ever spent at the store. That would be
    too scary.


    The store groups together all music purchases made in a single day. If you want
    more detail about a particularly fun day, click the arrow at the left of the purchase
    summary. There''s an example in Figure 11-4.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_259_0.png)


    FIGURE 11-4: Music store purchase detail.


    > **Caution**

    > Apple warns you that once you’ve downloaded your music, you’re responsible for
    backing it up—you can’t download it again. This is an excellent reason to make
    sure you back up your purchased music after it’s downloaded. If you fail to back
    up, and disaster strikes, you’re in big trouble. You can contact customer service
    to plead for an exception so that you can download your music again—some iTunes
    Music Store customers posting on the Internet have reported success when doing
    that. But don’t count on it: back up your tunes.


    # ## Wielding Your Authority


    You probably already know that when you buy music from the Store, you can play
    it on five different computers. If you’re about to get rid of a computer that
    you have used for playing tunes from the iTunes Music Store, make sure you deauthorize
    it before it leaves your possession. Here’s how:


    +   1. From the Advanced menu, choose Deauthorize Computer.

    +   2. Make sure “Deauthorize Computer for Music Store Account” is selected (Figure
    11-5).

    +   3. Click OK.

    +   4. Next, you’ll be asked to supply your Store account password. This step
    makes sure that friends, children, and other souls can’t cut your computer off
    from its music.

    +   5. If all goes well, you’ll see a message indicating that the computer has
    been deauthorized (Figure 11-6).


    Once the computer is deauthorized, it won’t be able to play music you bought from
    the Store, unless you re-authorize. If you decide you want to use this computer
    for Store-bought music again, just play a purchased song, then supply your password
    again. The computer will be back in the good graces of the Store.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_260_0.png)


    FIGURE 11-5: Deauthorizing your computer.


    # Check out iTunes essentials


    When is an album not an album? When it’s available from the iTunes Music Store.
    After all, when you buy an album from the store, you’re not getting a physical
    object, just a bunch of bits that flow into your computer over an Internet connection.
    It didn’t take long for Apple to figure out that as long as they were delivering
    virtual albums, they didn’t have


    ![](img/f481d8a0ca491080698039f72bf96e1b_260_1.png)


    FIGURE 11-6: Confirming that your computer has been deauthorized.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'to limit themselves to virtual copies of real albums: they could make their
    own. And that''s the idea behind iTunes Essentials.


    iTunes Essentials are collections of songs available at the store, arranged in
    lists that follow particular themes. Some examples of iTunes Essentials:


    +   1.  *Break Up Songs*, a set of tunes about love gone wrong, including “I’ll
    Never Fall in Love Again”, “She’s Gone”, and “Ex-Girlfriend”.

    +   2.  *Soundtrack Classics* brings together a bunch of tunes that are best known
    for their connection to specific movies, such as “Raindrops Keep Falling on my
    Head” from *Butch Cassidy and the Sundance Kid* and “Mrs. Robinson” from *The
    Graduate*.

    +   3.  *The Beauty of Opera* is a sort of “opera’s greatest hits”, with tracks
    from *Cosi Fan Tutte*, *Fidelio*, and *La Bohème*.

    +   4.  *Hair Bands* is a collection of 1980s metal hits from groups like Twisted
    Sister, Def Leppard, and Quiet Riot (younger readers, ask your parents).


    Each album in the iTunes Essentials collection comes with its own custom album
    cover. You can buy individual songs, or the whole list at once. To start playing
    around with this unique new way to acquire more music, click iTunes Essentials
    on the store''s home page, on the left side near the bottom of the window.


    # Shopping the Competition


    Articles in newspapers and magazines often mention the incompatibility between
    the iTunes Music Store and other online music outlets. The usual line is that
    you have two choices: Apple''s store and an iPod, or any other store and any other
    portable music player. (If you have a Macintosh, you don''t even have this choice,
    because only Apple''s store supports Macs.) This is because Apple sells songs
    in Protected AAC format, which only iTunes and iPods know how to play, while other
    stores use a restricted version of Windows Media Audio (WMA), which Apple doesn''t
    play in iTunes or iPod.


    However, there is a way around these restrictions. Let''s say you find a track
    on a WMA-based service, such as Napster, that''s not available on the iTunes store.
    Assuming the store allows burning the track to CD, which is almost always the
    case, you can buy the song, burn it to CD, then rip it into a format iTunes and
    iPod understand, such as MP3 or AAC. Once it''s in those formats, you''ll be able
    to use it in iTunes and on your iPod just like any other music file. The burning
    and re-ripping process causes some loss of clarity, but if it''s the only way
    to get the tune, you might find it worth the 99 cents or less to find out whether
    the quality is good enough for you. Some services give you WMA files without restrictions.
    You can also get WMA files when you rip CDs using Windows-based music players.
    Starting with iTunes version 4.5—this Windows'
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_262_0.png)


    version only—there’s now an easy way to get unrestricted WMA files into iTunes
    and your iPod. Just drag one or more WMA files to the Library in the iTunes source
    list, and iTunes will show you a confirmation dialog (Figure 11-7) and then happily
    convert them to AAC format. The original WMA files aren’t changed, and the new
    AAC files are fully compatible with iTunes.


    # See celebrity playlists


    Here’s another cool iTunes Music Store “virtual album” invention: the celebrity
    playlist. For this feature, Apple asks famous folks, like Tom Petty, Kevin Bacon,
    and Missy Elliott (older readers, ask your kids) to list their favorite songs.
    Apple then creates a playlist with the songs, plus a cool description of what
    makes the songs special to the person who put the list together. This is where
    you find out that Barry Manilow thinks Curtis Stigers is “the best kept secret
    in music”, and Suzanne Vega has danced in front of the mirror to Duncan Sheik’s
    “Barely Breathing”. As with iTunes Essentials, you can buy individual songs or
    entire playlists.


    > Cross-Reference

    > Want to feel like a celebrity? *See Make Your Own Celebrity Playlist* in this
    chapter to learn how to turn your favorite tunes into a crass selling tool.


    # Listen to audio books


    Great music is not all there is to buy at the iTunes Music Store. If you think
    you’ve exhausted all the offerings at the store, check out the audio books section.
    You can start by choosing “Audiobooks” from the Genre pop-up on the store’s home
    page. From this page, you can jump into audio book categories such as Sports,
    Self Development, and Classics. Download and listen to books by Neal Stephenson,
    George Carlin, Dan Brown, Stephen King, and hundreds of others.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'The selection goes beyond books: the Periodicals category includes read-out-loud
    versions of Scientific American, the Harvard Business Letter, and Fast Company.
    You can find speeches and radio appearances by Dan Quayle, John Kerry, Lance Armstrong,
    Erin Brockovich, and dozens of others. The National Lampoon Radio Hour is here,
    as are fully dramatized Twilight Zone episodes. This is incredibly good stuff.
    Just as with songs, the store provides free previews of every audio book. The
    book samples last a minute and a half, three times the length of song previews.


    ![](img/f481d8a0ca491080698039f72bf96e1b_263_0.png)


    For information on how to buy audio books directly from Audible.com, see the section
    Download Audio Books in Chapter 2. Audible.com is worth checking out because prices
    there are sometimes cheaper than they are at the iTunes Music Store.


    One thing to watch out for: abridged books. Reading books takes a long time—for
    example, Neal Stephenson''s The Diamond Age is 512 pages long in paperback, and
    18 1/2 hours on audio book. Because of this, many audio books are abridged: some
    stuff is left out. That makes them shorter and cheaper, but not the same as the
    paper book. Abridged audio books are always marked as such in the store.


    But beware: unlike 99 cent songs, which you can grab like so many fun-size 3 Musketeers
    bars, most audio books are $10 or more, although some start at a couple of bucks.
    The audio books section of the store is an awesome way to blow through your credit
    card.


    # Champion Customer


    When Steve Jobs delivered the keynote speech at Macworld Expo in January 2004,
    he described the success of the iTunes Music Store during its first 8 months in
    business. Jobs announced that the biggest store customer had spent more than $29,000.
    He went on to say that he couldn''t give the name of the person who had spent
    that much so that the customer "wouldn''t get in trouble with his parents."


    # Get More Free Stuff from the Store


    We''ve discussed music, audio books, celebrity playlists, and other cool things
    you can find in the iTunes Music Store nooks and crannies. In this section, I''ll
    point out more things you can do at the store that won''t cost you anything. In
    fact, you don''t even need to have a store account to use some of the features
    in this section. Have fun, you freeloader!


    # Listen to free previews


    You probably know that you can get a free 30-second sample (also called a preview)
    of any song by double-clicking its title in a song list. You can also get a preview
    going by selecting a'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'song and pressing Return or Enter. To preview another song, use the arrow keys
    to move the little speaker icon up and down the song list, then press the space
    bar to start listening. When a preview is finished, iTunes just stops—it doesn''t
    go on to play the next one, as it does with a playlist. That''s because if it
    just kept playing songs, it would be way too easy for folks to simply listen to
    dozens of song previews in a row, thus sucking down all the store''s capacity
    and making things rotten for paying customers. So you have to start each preview
    manually.


    If you have a slow connection, you might find your previews stuttering as the
    sample is loaded. You can fix this by asking iTunes to wait until the entire preview
    is downloaded before starting to play it. To do this, go to the Store tab in iTunes
    Preferences and check the box labeled “Load complete preview before playing”.
    This setting will force you to wait a little longer before your preview starts,
    but you''ll be able to get through the whole thing without the music stopping
    and restarting.


    # As You Wish


    One of the coolest features of Amazon.com is the Wish List. This feature is promoted
    as a way to list your desires for other folks who are buying gifts for you, but
    the real value of the wish list is to keep track for *yourself* of what you want
    to buy someday. In iTunes 4.5, Apple introduced a similar ability to keep a list
    of tunes you''d like to purchase, just not right now. This feature works by allowing
    you to add iTunes Music Store previews to your playlists. You can try it out simply
    by dragging a song from the Store to a playlist in the source list.


    Note that although you can keep as many previews as you want in a playlist, you
    still can''t play a bunch of previews in a row automatically. When iTunes is playing
    a playlist and it encounters a preview, it will play that preview and then stop
    playing music until you start it again.


    # Get more artist information


    The iTunes Music Store wants you to be an informed customer. Rather than just
    posting a bunch of albums and songs for you to buy, the store provides such features
    as 30-second previews and recommendations. In that spirit, you can use the store
    to find out cool stuff about your favorite artists. The key is to check out the
    artists'' home pages in the iTunes Music Store. Let''s take a look at some examples.


    If you go to the Sheryl Crow page (Figure 11-8), you''ll find links to an exclusive
    track, a celebrity playlist, her Web site, and even a video. Clicking the video
    link plays the music video right there in iTunes.


    There are lots of other artists who get similar treatment in the iTunes Music
    Store, such as The Doors, Fischerspooner, They Might Be Giants, or Donna Summer.
    Not every artist has videos and Web links in the store, and the roster of those
    who do is always changing. Your best bet for finding the special ones is to look
    through the list of “Featured Artists” shown on the home page of the store and
    each genre.'
