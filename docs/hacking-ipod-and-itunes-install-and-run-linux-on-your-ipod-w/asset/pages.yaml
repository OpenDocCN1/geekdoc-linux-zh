- pgno: 100
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_100_0.png)


    FIGURE 4-3: You can search for songs on your iPod with the Find command in Terminal.


    +   1. Go to Terminal. For those not in the know, but eager to learn, it’s an
    application, usually located in the Applications/Utilities folder.


    +   2. Type this command into the Terminal window:

    +   find -d /Volumes/"my iPod"/iPod_Control | grep -i "part of name"


    Instead of “my i-Pod”, use the name of your iPod. In place of “part of name”,
    type any part of the file name you’re looking for. Remember that you’re searching
    for a file name, which might not be the same as the name of the song, and you
    should try to search for words from the first part of the song title. After typing
    this command, you’ll get a list of songs, if any, that match your search request.
    See Figure 4-3 for an example.


    +   3. The output in Terminal includes complete pathnames for all the files it
    found. In Terminal, look through the output for the song you want to copy.


    +   4. With the file path you got from step 3, use the cp command in Terminal
    to copy the song, as in this example:

    +   cp /Volumes/"my iPod"/iPod_Control/Music/F16/"01 Dead Leaves And The Dirt.wav"
    ~/Documents/"my iPod music"/


    (The command is wrapped on two lines in this book, but it should be all one line
    when you type it into Terminal.) Note that you have to put quotation marks around
    the names of iPods, files, or folders that have spaces or non-alphanumeric characters
    in them.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Ceci est une pipe


    In case you’re curious, here’s a little explanation of the two simple commands
    you typed in Terminal. The first:


    ```

    find -d /Volumes/"my iPod"/iPod_Control | grep -i "part of name"

    ```


    The find command simply finds files in a directory (folder). The “-d” option asks
    Find to look recursively inside any directories it sees. “/Volumes/”my iPod“/iPod_Control”
    tells Find where to start looking. The vertical bar after that is called a pipe.
    It tells find to send its output, which will be a list of all files in the iPod_Control
    folder, to another command—in this case, a command called grep, which is a Unix
    tool for finding text. The grep tool looks for the text we want, and the “-i”
    option tells grep not to worry about whether the text is upper or lower case.


    Here’s the command we used to copy the song:


    ```

    cp /Volumes/"my iPod"/iPod_Control/Music/F15/"01 Dead Leaves

    And The Dirt.wav" ~/Documents/"my iPod music"/

    ```


    This one is very simple, too. The cp command copies files. The first item is the
    file to be copied, and it’s followed by the directory that tells where we want
    the copy to go.


    That’s it. If you’re keen on learning more about the deep world of Unix shells
    and commands, there are many books, magazine articles, and Web sites available
    to teach you more about Unix in Mac OS X. Have fun, and be careful out there.


    # Automatic for the pod people


    Now that you’re an expert in built-in ways to uncover hidden iPod songs, you might
    want to check out some utility programs that make it easier to see what’s really
    on your iPod. In this section, I’ll write about a couple of the most popular of
    these programs, TinkerTool and iPod Viewer, and I’ll provide pointers to more
    utilities.


    # TinkerTool


    Marcel Bresink’s TinkerTool (www.bresink.de/osx/TinkerTool.html) is a free utility
    with a switch that lets you see, find, and copy all invisible files and folders
    in Mac OS X, whether on the iPod or anywhere else. TinkerTool lets you mess with
