    # Change the play count


    Most properties of songs, such as the name, artist, and album, are set and rarely
    change. Others, like play count and last played date, are more dynamic. Play count
    increases by one every time a song is played, either in iTunes or on an iPod.


    In iTunes 4.1, Apple added a feature that was happily welcomed by scripters: you
    could now change the play count property (officially known as "played count")
    from a script. So, if you want to fake the number of times a song has been played,
    you can do it with AppleScript. This can be useful for artificially increasing
    or decreasing the apparent popularity of a song in your library, which can affect
    how it appears in smart playlists.


    Two scripts on Doug''s AppleScripts for iTunes site are useful for fooling around
    with play count. New Play Count lets you enter a new value for the play count.
    Add or Subtract Play Count changes a track''s play count by a specified value.


    # More fun with scripts


