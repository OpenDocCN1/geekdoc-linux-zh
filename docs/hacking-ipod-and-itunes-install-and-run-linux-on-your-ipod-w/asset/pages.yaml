    to try resurrecting any dead tracks with iTunes Track CPR, do that before running
    Super Remove Dead Tracks.


    # iTunes Track CPR


    Sometimes you don''t want to remove the dead tracks—you want to make them work
    again. You can accomplish this if the track listing has been cut off from the
    song file''s location but the file still exists. This is a fairly unusual situation,
    but it can happen, for example, if you move song files around on the hard disk.
    In this case, the songs still exist, but iTunes might lose track of them. iTunes
    actually provides a built-in manual way to do this: if you try to play a dead
    track, iTunes will ask if you can locate the song file and connect it to the track
    listing (see Figure 6-10). If you can and you do, the dead track will be fixed.


    Wouldn''t it be great if iTunes could automatically reconnect dead track listings
    with their song files in cases like this? That''s exactly what a lot of folks
    told Doug Adams. So Doug set out to write a script to do the job, and iTunes Track
    CPR is the result. Unfortunately, this turns out to be a tricky job for a number
    of reasons, and the resulting script helps with the task but is also kind of a
    work in progress. If you use iTunes Track CPR, Doug implores you to study the
    Read Me file so you understand what''s going on. See www.malcolmadams.com/itunes/scripts/ss.php?sp=itunestrackcpr
    for more information.


    ![](img/f481d8a0ca491080698039f72bf96e1b_173_0.png)


