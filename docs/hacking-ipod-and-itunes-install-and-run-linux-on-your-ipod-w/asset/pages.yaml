- pgno: 158
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_158_0.png)


    FIGURE 5-23: The smallest iTunes windows: just the controls (left), and with status
    display (right).


    If you want to keep your tunes playing, but you don''t want the big iTunes window
    to get in your way, click the zoom box in the title bar of the window. On the
    Mac, that''s the green circle; on Windows, it''s the “maximize” control next to
    the “X”. When you click this control, the iTunes window shrinks down to itty-bitty
    size, with only the most basic controls visible (see Figure 5-23, on the left).
    If you want more information and you don''t mind using up a little more space,
    you can drag the size control to the right and add the status display to the mini-window,
    as shown on the right side of Figure 5-23.


    No matter how you have resized the iTunes window, you can instantly return it
    to pleasing dimensions by holding down Option (on Mac) or Shift (on Windows) and
    clicking the zoom/maximize box. This results in iTunes centering the window on
    the screen and resizing it to leave a reasonable margin around each edge.


    If you''re using another application while listening to music and you can''t see
    the iTunes window at all, you can still exert your control. On Mac OS X, you can
    Control-click (or right-click) the iTunes dock icon; if you''re running Windows,
    right-click the iTunes icon in the system tray. This pops up a menu with commands
    that let you play, pause, change songs, and perform other functions.


    The ultimate way to get rid of the iTunes window is to make it vanish completely,
    by hiding the application. On the Mac, you can accomplish this by choosing Hide
    iTunes from the iTunes menu. On Windows, click the minimize icon in the title
    bar, or click “ITunes” in the taskbar.


    If you''re using a Mac, there is an extra-geeky way to hide the iTunes window:
    just click its red close control. Yes, close it! The window closes, but the music
    keeps playing, as if from a phantom jukebox somewhere. When you want to regain
    control, click the iTunes icon in the dock and the window reappears. If you''re
    already in iTunes, you can also choose Window  ↔  iTunes, or just press Command-1.


    # Use SnapBack Arrows


    When Apple shipped its Safari web browser in 2003, it included a built-in box
    on the toolbar for searching Google (Figure 5-24). That''s not a new idea: Google
    itself ships a toolbar for Windows browsers that provides the same feature. But
    true to its innovative nature, Apple added something more: SnapBack.'
