    Another way to share your playlist is through Apple’s iMix feature. With iMix,
    you can assemble your own playlist in iTunes, then publish it to the iTunes Music
    Store. You get to add your own comments for the whole mix, but not for individual
    songs. And, your audience gets to rate your iMix on a scale of one to five stars.'
