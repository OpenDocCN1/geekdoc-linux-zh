- pgno: 70
  md: '# # Way Beyond the Music: Hardware


    ![](img/f481d8a0ca491080698039f72bf96e1b_70_0.png)


    R ight after Apple introduced the iPod in late 2001, enterprising companies started
    producing iPod accessories. As the iPod''s popularity grew, more cool gear started
    showing up—everything from cases to power adapters to car stuff. In time, some
    of the iPod''s internal secrets spilled out as well, discovered by iPod owners
    who were inspired to keep pushing buttons until they found something.


    This chapter is dedicated to cool hardware you can get to enhance your iPod, along
    with nifty stuff that''s inside every iPod, such as semi-documented button combinations
    and diagnostic mode. We''ll also discuss how you can give new life to an iPod
    with a battery that won''t charge any more.


    # ## Check Out Built-in Secrets


    The iPod is stingy with its secrets, as I''ve discussed in previous chapters.
    In this section, you''ll explore what is known about the wacky stuff built into
    your iPod.


    # ### Use button combinations


    There is a subset of iPod users who are fairly obsessive about their music players—maybe
    you''re one of us. When Apple ships a new iPod model, these folks start pressing
    buttons in all combinations, hoping to find cool hidden stuff. It''s sort of like
    reading tea leaves or looking for meaning in ancient ruins. The following are
    the extra features you can get by using various buttons on your iPod, original
    or 3G:


    +   - *Power off*—*Hold down Play until the iPod goes off*. This actually shuts
    off the display and puts the iPod to sleep, rather than powering the player down
    entirely.


    # ## in this chapter


    +   - Use Button Combinations

    +   - Run iPod Diagnostics

    +   - Hear Sounds from the iPod Speaker

    +   - See a Numeric Battery Display

    +   - Get a Wireless Remote for Your iPod

    +   - Listen to Your iPod in Your Car'
  merge: -1
  img_proc: true
- pgno: 71
  md: '+   * **Reset**—*Hold down Play and Menu at the same time until you see the
    Apple logo. This is useful for restarting an iPod that seems to be stuck.*

    +   * **Enable disk mode**—*Reset the iPod. When you see the Apple logo, hold
    down Previous and Next at the same time until you see the “OK to disconnect” screen.
    To get out of disk mode, reset the iPod.*

    +   * **Run a disk scan**—*Reset the iPod. When you see the Apple logo, hold Menu,
    Next, Previous, and Select at the same time (*wheh*). This instructs your iPod
    to scan its hard disk for bad areas. You’ll see a picture of a magnifying glass
    going over your disk, and a progress bar at the bottom. The scan can take a long
    time, especially for bigger hard disks. If your iPod fails the scan, there will
    be additional info on the screen, and you should probably get service for your
    iPod.*

    +   * **Enter diagnostic mode**—*Reset the iPod. When you see the Apple logo,
    hold down Next, Previous, and Select. When the Apple logo goes away, release the
    buttons. You’ll see the coolest thing ever: a backwards Apple logo, as if you
    were inside the iPod looking out. If it’s a 3G, you’ll hear the iPod emit a little
    squeal, like you were pinching it. Diagnostic mode contains stuff used by engineers,
    technicians, and factory folks to test out the iPod. You can find out much more
    about it in this chapter’s Run iPod Diagnostics section.*


    # ## iPod mini


    Some of the button presses are a little different for the iPod mini, although
    the results are the same. Here are the buttons you use on the mini:


    +   * **Power off**—*Hold down Play (*same as regular iPods*).*

    +   * **Reset**—*Hold down Select and Menu at the same time until you see the
    Apple logo.*

    +   * **Enable diagnostic mode**—*Reset the iPod. When you see the Apple logo,
    hold down Select and Back. When the Apple logo goes away, release the buttons
    to see the famous backward Apple and get into diagnostic mode.*


    There are no button combos that enable disk mode or disk scan on a mini, but you
    can get to those features from the menus in diagnostic mode.


    # # Run iPod diagnostics


    When you enter diagnostic mode, you get an ugly, non-iPod-looking screen with
    a list of eight diagnostic tests. Each test is marked with a letter, A through
    H. You might expect to use the wheel to select the tests, but it doesn’t work.
    Instead, use the Next and Previous buttons to move up and down the list. Press
    Select to run the highlighted test. While a test is running, press Play to return
    to the menu. If you scroll down past test H (or up past test A), you’ll see a
    second screen, items I through P.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '| Test letter and name | Description |

    | :--- | :--- |

    | A. 5 IN 1 | This runs several tests in a row: LCM, RTC, SDRAM, FLASH/CHECKSUM,
    and FIREWIRE/FW ID. (See the following to find out what they do. Note that you
    have to press Play twice to get through LCM.) But the real cool stuff comes after
    the tests finish. On a 3G iPod, you can press buttons to make noises come out
    of the built-in speaker. Press Previous to hear the wheel''s clicking sound, Menu
    and Select to get two different long beeps, and Next for an effect that sounds
    a little like a Star Wars blaster. You can have a lot of fun walking around with
    your iPod, pressing buttons and staring intently at the screen as if you were
    doing something serious. The clicking sound makes a great fake radiation detector.
    Press Play to return to the Diagnostics menu. |

    | B. RESET | This resets the iPod, just like pressing Menu and Play together,
    but slightly easier on your fingers. |

    | C. KEY | This test is actually sort of a video game. You have to press all five
    buttons on the iPod within about 5 seconds. As you press each one, its name appears
    on the screen. If you get them all in time, you see KEY PASS. If you''re too slow,
    you''re humiliated with KEY FAIL. |

    | D. AUDIO | When you run this test on a 3G iPod, you''ll hear a Pac Man-like
    drumming noise if you have an external speaker connected. On an older iPod, the
    screen will display AUDIO 0X00000001 DONE. |

    | E. REMOTE | This one tests the iPod remote. It''s another game: you get a few
    seconds to press all the buttons on the remote. As you press each button, a rectangle
    appears on the screen in a position that corresponds to the location of the button
    you pressed. If you don''t press them all in time, or you don''t have a remote
    connected, you''ll see RMT FAIL. |

    | F. FIREWIRE/FW ID | This test checks out the iPod''s FireWire port to make sure
    it''s working OK. If it is, you get the comforting FW PASS message. |'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Table 3-1 iPad Diagnostics (Continued)

