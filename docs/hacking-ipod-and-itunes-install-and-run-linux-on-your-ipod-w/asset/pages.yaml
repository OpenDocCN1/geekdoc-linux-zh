    # ## Burn as Many Songs as You Want


    If you like to put together CDs of your favorite songs, iTunes helps you figure
    out when you''ve filled up your CD. If you''re putting together your playlist
    by hand, you can keep an eye on the time indicator that iTunes displays at the
    bottom of the song list. As long as you make sure you keep the total playlist
    time under the capacity of your blank CD (usually 74 or 80 minutes), you''ll be
    fine.


    If you''re not very picky about what''s going on the CD, you can get even more
    help from iTunes by employing a smart playlist. Let''s say you want to burn a
    CD filled with the music you listen to the most, so you can play it in your car''s
    CD player. Pull down the File menu and choose New Smart Playlist. Uncheck the
    box at the top next to “Match the following condition”. Check the box for “Limit
    to”, fill in “80” in the first text box, “minutes” in the second, and “most often
    played” in the third. Then click OK. The Smart Playlist dialog box should look
    like the one in Figure 9-3.


    When you choose these settings for a Smart Playlist, you''re asking iTunes to
    find the songs you''ve played the most and grab them for a playlist, collecting
    songs until it has


