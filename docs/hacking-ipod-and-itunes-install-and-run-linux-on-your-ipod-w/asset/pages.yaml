    you''re ripping streams while talking to your agent on the phone negotiating your
    new multi-million dollar recording contract.


    You can use RadioLover to record multiple stations at the same time, although
    you need a beefy network connection to make sure you have enough bandwidth for
    that. Like RipCast on Windows, RadioLover has a timer feature so you can schedule
    recordings in advance. RadioLover costs a modest $15. You can use it without paying,
    but it stops recording every 30 minutes.


    # ## Making adjustments


    As Internet radio stations broadcast their music, they send information about
    the next song just as it’s about to start playing. That’s how the programs in
    this section know when to start a file for a new song. Sometimes the timing is
    a little off, which results in a little bit of the start of song B getting tacked
    onto the end of song A. To correct this annoying problem, the recording programs
    include settings that let you specify how long'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'to wait after the new song info is detected before splitting off a new file.
    With a little tweaking, you should be able to get songs split just right when
    recording from your favorite stations.


    # Get LPs into iTunes


    Once upon a time, music came on big black vinyl platters. They were called LP
    records, and they weren''t that good, but we didn''t know any better. If you''re
    a person of a certain age, you probably have a few crates of LPs somewhere, and
    you haven''t listened to them in years. You could pay 99 cents a track to buy
    them all over again at the iTunes Music Store, but that''s not very economical,
    and many old tracks aren''t available in digital form.


    Instead, why not look into digitizing your LPs and getting them into iTunes? The
    process is relatively inexpensive and straightforward, although it is time-consuming.
    The basic steps:


    +   Connect the output from a turntable (that''s sort of an LP-ROM drive, kids)
    to the input of your sound card or sound capture hardware, such as the iMic (www.griffintechology.com).


    +   Record the LP with sound capture software, such as Peak for Macintosh (www.bias-inc.com)
    or Adobe Audition for Windows (www.adobe.com/ products/audition/main.html).


    +   Use your sound capture software to split the files into songs.


    +   Enjoy your new old music!


    For more on to ripping LPs into digital files, see www.techtv.com/callforhelp/howto/
    story/0,24330,3333231,00.html . If you''re going to use a Macintosh for the process,
    I highly recommend Chapter 9, "Convert Your Old Vinyl LPs to CDs" in the book
    Mac Toys, published by Wiley, ISBN 0-764- 54351-2. (Full disclosure: I wrote Mac
    Toys with John Rizzo. But that chapter really is the best, most detailed treatment
    of this subject I''ve ever seen, and I didn''t even write it—John Rizzo, my co-author
    on Mac Toys, did.)


    # Rip Stubborn CDs


    One of the great things about getting your music into iTunes is that digital songs
    never wear out, unlike CDs (and, of course, vinyl records). Once you''ve got your
    music ripped, you have it forever, assuming you''re diligent about backing up
    your hard disk, just in case.


    Once in a while, when you dig out an ancient CD and serve it up to iTunes for
    importing, the process doesn''t go smoothly. The ripping slows down, or even stops
    entirely, and the'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'CD starts making scary clicking or wobbling noises as it spins around in the
    CD drive. Yikes! What can you do?


    The first trick to try is simply cleaning the CD, just as you would if it failed
    to play in a regular CD player. Take the CD out and examine it under a light.
    Be sure you look at the silver side—the bottom—because that''s the business end,
    where the music is stored. You''ll often see a fingerprint or other hunk of goo,
    which you can clean off with a tissue or similar delicate article. When you put
    the CD back in the drive, make sure it''s firmly seated on the spindle (if your
    computer doesn''t have one of those slick slot-loading drives).


    If you''ve made sure your CD is sparkling clean, you''ve snapped it firmly into
    place, and it still balks at being imported, there''s one more trick to try. Go
    to iTunes preferences, click the Importing tab, and turn on “Use error correction
    when reading Audio CDs”. This feature will get iTunes to try its best to figure
    out what''s on the CD so you don''t have to live without an old favorite.


    # # Get Legal Free Tracks


    There has been a lot of press the past couple of years, and plenty of lawsuits,
    about shady ways to get free music by using file sharing networks. But while courts,
    record companies, and governments battle that out, you might be surprised to learn
    that there are plenty of fully legitimate sources of excellent free tracks on
    the Web, mostly available as MP3s. You''ll find obscure and rare tracks by big
    commercial artists, first efforts from bands you''ve never heard of, and very
    old but good tracks. This hack tells you about how to get your hands on some of
    that music.


    Most of the sources in this section understand that MP3 is the standard for exchanging
    free music tracks, so they provide their wares in that format for you to download.
    Other sites, most often the more commercial ones, put their stuff in proprietary
    formats, such as RealAudio or Windows Media Audio. These often have restrictions:
    either they''re only streamed and not downloadable, or they have digital rights
    restrictions, such as a 30-day expiration date. Some only work on Windows. As
    long as you can get them to play at all, you can always use one of the audio recording
    programs discussed in "*Record Whatever Your Computer Plays*", elsewhere in this
    chapter.


    The Web sources in this section are divided into the following broad categories:


    +   • Many artists provide free MP3s for downloading on their Web sites. You can
    often grab whole songs from albums or unreleased live tracks.

    +   * Lots of record companies—especially the more enlightened ones—take advantage
    of the Web by offering MP3 tunes by their artists. Labels that are far from the
    main-stream and don''t get their records played on the radio are fond of this
    practice.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '+   * Other commercial sites, such as Amazon.com and MTV, provide a selection
    of free music for you. Some non-commercial sites have free music, too.


    We''ll take a look at each of these groups. There''s no way this can be a comprehensive
