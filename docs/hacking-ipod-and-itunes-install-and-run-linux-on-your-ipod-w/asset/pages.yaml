- pgno: 197
  md: '# # Playing a Borrowed Tune


    Usually, there’s no reason to play music directly from your iPod while you’re
    using your computer, because the music on the iPod normally *comes from* the computer
    when you sync. Let’s say, however, that you’re borrowing someone else’s iPod,
    and you want to play the iPod’s music through iTunes to take advantage of cordless
    headphones or a WiFi receiver you have connected to that computer, or just to
    use the computer’s speakers. You can play iPod music through iTunes, but only
    if you have the iPod set to “Manually manage songs and playlists”, which is usually
    not the best way to wrangle your music. When the iPod is set to this mode, all
    its songs magically become available in iTunes, and its playlists are visible.
    You can play any song or playlist, or even turn on the music browser and pick
    out albums or artists to hear.


    Even if the borrowed iPod is set to automatic update mode, you can play songs
    from the iPod by switching to manual mode temporarily. Here’s how:


    +   1. Connect the alien iPod to your computer. You’ll see a scary looking warning
    message asking if you want to wipe out the iPod and replace it with your music
    (Figure 7-7). For the sake of your friendship, just say no. (If you don’t see
    the warning, the iPod is already set for manual updating, and you can skip the
    rest of the steps. The iPod’s songs and playlists will appear in iTunes without
    any further coercion.)

    +   2. Make sure the iPod is selected in the iTunes sources list.

    +   3. Click the iPod button at the lower right to get the iPod Preferences dialog
    box.

    +   4. Note whether it’s set to “Automatically update all songs and playlists”
    or “Automatically update selected playlists only”, and write the setting down
    somewhere. If “Manually manage songs and playlists” is selected, skip the rest
    of the steps—you can already play this iPod’s music through iTunes without any
    further monkeying around.

    +   5. Click “Manually manage songs and playlists”. Acknowledge the not-so-important
    warning you get (Figure 7-8) by clicking OK, then click OK again in the Preferences
    dialog box.


    ![](img/f481d8a0ca491080698039f72bf96e1b_197_0.png)


    FIGURE 7-7: iTunes warns you if you attach an automatically updating iPod from
    another computer.'
  merge: -1
  img_proc: true
