  md: 'through effects chosen by the user, and “Freezing current config”, which prevents
    the display mode from changing.


    +   ■ 0-9 Select user configs (shift to set): When you see a visual effect that
    you really like, you can save it by pressing Shift and a number key. Then, when
    you want to relive the past and call the effect back, just press the number.


    +   ■ R New random config: If you’re tired of the current effect and you want
    to see something different, press R to change it up. By pressing R repeatedly,
    you can take control of the visual effects without having to think too much.


    +   ■ C Display current config: Use this option to show the current Visualizer
    settings. You’ll see three parts to this information, as shown in Figure 6-18.
    The first line is the pattern, the foreground object that’s most visible. The
    second line gives the shape, the background objects that swoop out of the main
    object. The third bit of information is the effect’s color scheme.


    As if these hidden options aren’t hidden enough, there are a few more that aren’t
    documented at all. Here they are:


    +   ■ Q and W Cycle through patterns: Press W to see the next, and Q for the previous
    pattern.


    ![](img/f481d8a0ca491080698039f72bf96e1b_184_0.png)


    **FIGURE 6-18:** You can display the current Visualizer configuration.'
