    # ## Find All Playlists a Song Is On


    As you build your music collection in iTunes, you’ll add more playlists to control
    and manipulate your songs just the way you want. A cool tool hidden inside iTunes
    helps you find out which playlists contain any particular song.


    To see this trick at work, locate any song in the library. When you see the song
    you want to check, right-click it (or command-click, if you’re using a one-button
    mouse on a Mac). If the song is in any playlists, the menu that pops up includes
    an item named “Playlists” that tells you all the playlists the song belongs to,
    as shown in Figure 10-4. If you select a playlist from the menu, iTunes switches
    you to it, with the chosen song selected.


    This handy feature also works if you right-click a song in a playlist, rather
    than in the library. In that case, the “Playlists” submenu only appears if the
    song is on at least one *other* playlist in addition to the one you’re looking
    at. If it is, you can select it to switch there immediately.'
  merge: -1
