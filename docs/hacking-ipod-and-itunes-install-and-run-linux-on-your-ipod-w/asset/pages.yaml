  md: '+   Automatically eject iPod when sync is complete.


    +   Reset, which removes existing Outlook information from the iPod. Use this
    if you have inadvertently ended up with multiple copies of the same information
    on your iPod.


    +   Choose from specific Outlook folders to synchronize.


    +   Include or exclude items from specific Outlook categories.


    Mac users (what are you doing reading this Windows-only section?) can get the
    news, weather, and lots of other Web-based information onto their iPods with Pod2Go,
    described in this chapter in the *Get News, Weather, Movie Listings, and More*
    section.


    # ## Export from Windows Address Book


    The coolest way to get contacts (not calendar info) from Outlook to your iPod
    is via the Windows Address Book. If you use Outlook Express, the Windows Address
    Book is the place where information about your contacts is stored. Windows Address
    Book has the following awesome feature: if you select multiple contacts and drag
    them to a destination, the contacts are converted to vCards before they’re stored
    in the new location. What a wonderful coincidence that iPod contacts are stored
    as vCards! So, if you use Outlook Express, you can easily export all your contacts
    to your iPod simply by selecting them and dragging them to the Contacts folder
    on the iPod.


    If you want to get contacts from Outlook to the iPod, you can do it, but alas,
    Outlook lacks the automatic vCard conversion feature of Windows Address Book.
    However, you can send your Outlook contacts to Windows Address Book first, then
    to your iPod. Here’s how it works:


    +   1. In Outlook, choose File ➝ Import and Export.

    +   2. Choose “Export to a file” and click **Next**.

    +   3. Choose “Comma Separated Values (DOS)” and click **Next** (see Figure 4–21).

    +   4. Type the name of the export file (“my exported contacts” works fine) and
    click **Next**, then click **Finish**. Now your contacts are exported, and it’s
    time to get them into a Windows Address Book.

    +   5. Go to Outlook Express. Choose File ➝ Import ➝ Other Address Book.

    +   6. Choose **Text File** (Comma Separated Values) and click **Import**.

    +   7. Find the file you saved in step 4 and click **Next**.

    +   8. In the Mapping dialog box, choose the fields you want to import and click
    **OK**.

    +   9. Click **Finish** to complete the importing process.'
