    The driving directions feature in Pod2Go is a great way to save paper. Now, when
    you get directions to that intriguing party out on the edge of town, you can simply
    carry them along on your iPod instead of printing them out. Just be careful not
    to actually read directions off the iPod while you’re driving.


    By default, Pod2Go copies information to the iPod whenever you connect it to your
    Mac. There’s a preference for turning this off, as well as a setting that ejects
    the iPod as soon as its done being synchronized.


    Pod2Go’s interface is clean and easy to figure out. To add an item to be synched,
    go to the appropriate page (News, Weather, Text, etc.) and click the plus sign.
    There’s a minus sign you can use to get rid of items you don’t want any more.'
