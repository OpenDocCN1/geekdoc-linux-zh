- pgno: 315
  md: '# # How to mod the Pod

    ## and fine-tune iTunes


    Does your iPod go wherever you do? This book will take the two of you on your
    most exciting adventure—deep into iPod’s awesome potential. You already know it’s
    a musical prodigy, but wait ‘til you teach your iPod to take notes, give you the
    weather and stock quotes, keep your calendar, play games with you, double as a
    remote control, light up the night, and read you your e-mail—out loud. Think that’s
    great? Take a look at Part 2!


