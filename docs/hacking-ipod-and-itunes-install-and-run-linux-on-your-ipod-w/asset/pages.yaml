    # # Change the “Volume Up And Down” Sounds


    **Note** This hack is Mac-only.


    Mac OS X is loaded with pretty visual features. You see one of these whenever
    you use the Mac keyboard to change the volume. When you press the keys that turn
    the volume up or down, or turn volume muting on or off, Mac OS X puts a big transparent
    image on the screen that shows you what’s happening, and then the image fades
    away like mist. In addition, whenever you change the volume or turn off muting,
    the Mac plays a little “squirt” sound so you can hear the current volume setting.


    The Sound panel in System Preferences lets you change your alert sound, just as
    you have been able to do on Macs since time immemorial, or at least since 1985.
    But there’s no setting that lets you pick a different sound to hear when you change
    the volume.


    There is a way to change this setting—it’s just a little trickier than using System
    Preferences. It’s also not documented or supported, so be careful, and beware
    of unintended side effects. The sound is located in a file in the system folder.
    To change it, we’re going to temporarily grant ourselves permission to mess with
    the file, rename it, replace it with another sound file, then put the permissions
    back the way they were.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'To change the volume sound:


    +   1. In the Finder, go to the following folder: /System/Library/LoginPlugins/BezelServices.loginPlugin/Contents/Resources..

    +   2. Select the folder and choose File → Get Info.

    +   3. In the Get Info window, find the “Ownership and Permissions” section and
    click the triangle next to “Details”.

    +   4. Click the padlock next to “Owner: system”.

    +   5. Click the popup that says “system” and choose your account. Leave the info
    window open—we’ll need it again soon.

    +   6. Locate another AIFF file that you want to use as the new volume sound.
    You can find some likely suspects in /System/Library/Sounds, where the alert sounds
    live.

    +   7. Hold down Option and drag the chosen new sound to the Resources folder
    from step 1. By holding down Option, you should see a plus sign as you drag, indicating
    that you’re making a copy of the file. Drop the file in that folder.

    +   8. In the Resources folder, select the name of “volume.aiff”, the current
    sound file. Rename it “old volume.aiff”.

    +   9. Now select the file you dropped in, the new sound, and rename it “volume.aiff”.

    +   10. Go back to the Info window from step 5, which you cleverly left open.
    Click the “owner” pop-up again and return ownership to the system. If you’re asked
    for your password, go ahead and type it in to confirm the change. Click the padlock
    to lock the permissions. Now you can close the info window.


    That’s it! To hear your new volume sound, you have to log out and back in again,
    or log in as another user. This trick is cool, yet virtually useless—a true hack.


