  md: '# # Introduction


    "A whole book about that?"


    That was the reaction of a non-iPod-savvy friend when I told him I was writing
    a book about cool and wacky things you can do with your iPod and iTunes. He believed
    that when you get an iPod, you push a button and listen to music, period. He thought
    the iPod was simply a music player. He was misinformed.


    The iPod is a digital music device—a wonderful and popular one. Playing music
    is what it was made for. If all you want to do is connect your iPod to your computer
    and transfer the music to it from CDs and the iTunes Music Store, you''ll find
    all the information you need in the manual that comes in the box. But if you''re
    curious about other stuff you can do with your iPod, you want to know more about
    the cool-but-obscure features inside iTunes, or you just want to spend a couple
    of hours exploring your iPod and iTunes, this book can help.


    My skeptical friend would be surprised to learn that there are already a few good
    books about the iPod. This one is different. In this book, we spend most of our
    time on the fringes, outside the mainstream of features, focusing on the tricky,
    little-known, and unusual. A topic does not have to be useful to be included—it
    just has to be interesting. I tried to make this book a celebration and exploration
    of the iPod and iTunes. It''s as if we sat down for coffee and I started showing
    you features and tweaks that I thought you might like to see.


    Because this book exists out on the edges, there are plenty of topics we don''t
    spend much time on. For example, we don''t get into the basics of how to transfer
    songs to your iPod, but we do talk about how to transfer *weather forecasts* to
    your iPod.


    I hope you have a good time and maybe even learn something useful as we wander
    around the iPod and iTunes for a few hours. If not, the book makes a great coaster
    to set your drink on while you''re ripping CDs.


    # ## Digital Music


    In 1975, I wanted an iPod.


    I wasn''t one of those creative kids who sat around with a notebook and made amazing
    drawings of space ships, monsters, and battles. Those kids went on to work on
    "*The Lord of the Rings*" and won Oscars. But I loved music, and I thought technology
    was incredibly cool. So one day I channeled my intense geekiness into "designing"
    the world''s greatest jukebox.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'This bookcase-sized magical device would hook up to my stereo, record all my
    vinyl records, and store the music somehow, probably on a library of very small
    tapes. There would be a keyboard and monitor attached. To listen to music, I would
    type commands like PLAY BAND “PINK FLOYD” or PLAY SONG “BALLROOM BLITZ”. I could
    hear songs or albums in any order I wanted. Robotic arms might be involved in
    grabbing the right tape—being a software guy, I was vague on that part. I never
    tried to build my proto-iPod, which is probably a good thing.


    Many years later, smart people had a simple, incredibly powerful idea that changed
    the world: media in the real world, like pictures and sound, could be digitized
    and manipulated by computers. Audio CDs were just giant disks filled with data.
    The invention of MP3 made it possible to cram music into one-tenth the space that
    it occupied on a CD, and the advent of MP3 encoders like SoundJam and Winamp made
    it real. No longer did we have to hand-encode our own MP3s by candlelight in unheated
    cabins.


    Apple was late to this party, but eventually it figured out that a revolution
    was taking place and it started running faster than everyone else. The company
    absorbed SoundJam and transformed it into iTunes. Macs began shipping with drives
    that could burn CDs. And then, in October 2001, Apple introduced the iPod with
    iTunes 2. And it was about a million times better than what I had dreamed up 26
    years earlier.


    Getting thousands of songs into one box is a great achievement. Making the box
    small enough to fit in your hand is incredible. It’s mind-boggling to look at
    an iPod in your hand and think that all your music is inside there.


    # ## About Hacking


    The term *hacking* has gotten a bad reputation. Many people think of hacking as
    something evil, exploitive, and criminal. In recent years there has been a trend
    to reclaim the word and return it to its original, more noble meaning: creatively
    reshaping the world to make things better and more interesting. Hacking is about
    innovation, exploration, learning, and fun.


    Hacking doesn’t have to involve high technology. You can hack anything. My wife
    Barbara hacks her delicious pumpkin bread recipe by substituting applesauce for
    oil to make it more healthy. Holding a tiny nail in place with a pocket comb so
    you can hammer it is a classic hack. Héloïse of “*Hints from Héloïse*” fame was
    a household hacker. MacGyver was a famous hacker with a long-running TV show.
    When you figure out a secret route to the airport, you’re hacking.


    In this book, we hack iPod and iTunes by prodding, poking, and playing with them.
    Apple keeps iPod and iTunes locked up pretty tight, which eliminates the extreme
    hacks possible with more open system. So we won’t be taking your iPod apart and
    turning it into a Pop-Tart toaster. Despite that, there’s plenty of depth and
    power for curious folks to investigate in iPod and iTunes.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # Who Is This Book for?


    If you''re comfortable with the basic features of your iPod and iTunes and you''re
    interested in finding out more about what they can do, this book is for you. I
    don''t assume any particular technical knowledge or geeky skill, although some
    topics are more challenging than others.


    I tried to make this book as accessible as possible to both Macintosh and Windows
    users. Although most iPod and iTunes hacks work equally well on Macintosh and
    Windows, the iPod''s Mac legacy means there are some tricks that only work on
    the Mac. These are noted with a “Mac-only” icon.


    # # What''s in This Book?


    This book is divided into two parts: Part I for iPod and Part II for iTunes. Within
    each part, chapters divide the material into broad categories, although for some
    topics, the right chapter is not always clear, so I tried to make the most sensible
    guess for each hack.


    # ## Part I: Hacking iPod


    This part focuses on special things you can do with your iPod. We start off gently
    by exploring some of the official but fringe iPod features and tricks, such as
    smart playlist updating and voice recording, and eventually end up way off in
    the fun zone talking about things like downloading driving directions to your
    iPod.


    # ## Part II: Hacking iTunes


    In this part we spend time discussing our favorite music program, for Mac and
    Windows. We delve into topics that include getting album art, sneaking around
    the back rooms of the iTunes Music Store, playing with the psychedelic Visualizer,
    and broadcasting your tunes wirelessly to your stereo.


    # ## Appendices


    Our fact-filled appendices provide thorough information about Note Reader, the
    iPod''s best-kept secret, along with lists of links to more information, charts
    of iPod and iTunes versions, and an overview of the iTunes XML library format.


    # # Compatibility and Conventions


    The iPod hacks in this book assume you''re running the latest version of iPod
    software for your model—as of this writing, that''s 1.3 if your iPod doesn''t
    have a dock connector, 2.1 if it does, and 1.0 if you have an iPod mini. The iTunes
    topics require iTunes 4 for Mac OS'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'X or Windows. Hacks that have special requirements are noted. For example,
    some tricks only work if you have iTunes 4.2 or later, which is the current version
    as of this writing.


    Apple avoids model numbers in its product names and instead distinguishes between
    iPods by describing physical features. iPod fans outside Apple are more casual,
    calling them first, second, and third generation, or 1G, 2G, and 3G. Here''s a
    translation between the official and unofficial terms:


    | iPod Models | | |

    | --- | --- | --- |

    | Official Apple designation | Unofficial terms | |

    | iPod (5GB) and iPod (10GB) | Original iPod; first generation; 1G | |

    | iPod (Touch Wheel) | Second generation; 2G | |

    | iPod (with Dock Connector) | Third generation; 3G | |

    | iPod mini | iPod mini or just mini | |


    For information on newer iPods and software, see this book''s companion Web site
    at www.wiley.com/compbooks/extremetech.


    All iPod models have the same buttons:


    | iPod Buttons | | |

    | --- | --- | --- |

    | Official name | Legend printed on button | Unofficial terms |

    | Play/Pause | >II | Play |

    | Previous/Rewind | I<< | previous, prev |

    | Next/Fast forward | >>I | next |

    | Menu | MENU | menu |

    | Select | (blank) | select, center button |


    When using your computer, some instructions in this book ask you to Control-click
    on a Mac with a one-button mouse, or right-click on Windows or on a Mac that has
    a two-button mouse. On a Mac, Control-click and right-click are the same.


    # ## Keeping Up-to-Date


    One of the quirks of modern technology is that it often takes longer to make a
    book than it does to turn around a new generation of iPod. There''s a good chance
    that by the time'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'you read this, Apple will have new iPod or iTunes announcements that didn''t
    make it into the book. That''s why we have the Internet. You can always check
    this book''s companion Web site at www.wiley.com/compbooks/extremetech to get
    the latest scoop on new goodies from Apple. If you want to let me know about mistakes
    in the book or cool new iPod stuff, please send me e-mail at hackingipod@papercar
    .com.


    # Listen Up!


    I hope this book makes your relationship with your iPod and iTunes even better
    than it is, and you find many new and wonderful ways to get more out of your gadgets
    as you peruse the hacks. I also hope the book inspires you to explore and find
    your own nifty tricks and tips for improving your digital life. Have fun with
    the book, enjoy your music, and happy hacking.


    # Conventions Used in This Book


    Throughout the book, you''ll find highlighted text where I point out cautions,
    cross-references, notes of interest, and helpful recommendations. Specifically,
    four types of highlighted pointers appear:


    +   *   **Caution**

    +       Gives you valuable information that will help you avoid disaster. Read
    all of these carefully!


    +   *   **Cross-Reference**

    +       These are pointers to other areas in the book or on the Internet where
    you can find more information on the subject at hand.


    +   *   **Tip**

    +       A recommendation of best-practice methods and superior products or tools
    to use.


    +   *   **Note**

    +       Pertains to items of interest related to the subject at hand.'
  merge: -1
  img_proc: true
