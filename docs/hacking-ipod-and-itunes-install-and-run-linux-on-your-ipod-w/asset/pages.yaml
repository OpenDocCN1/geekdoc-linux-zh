    # ## Doug''s AppleScripts for iTunes


    The undisputed king of iTunes scripting sites is Doug''s AppleScripts for iTunes
    at http://www.malcolmadams.com/itunes/. This popular site''s proprietor is Doug
    Adams, who has been writing, collecting, and publishing iTunes scripts since early
    2001. The site now contains more than 260 scripts. Many of the scripts are clever
    and extremely useful, and a few reach the “what would I ever do without this?”
    level. The scripts are available for free, and if you use them and like them,
    you can make a donation on the site to help keep it running, a practice I highly
    recommend.


    In this section, I’ll discuss some of the niftiest scripts available from Doug''s
    AppleScripts. The site is very dynamic, with new scripts always arriving, so you
    should be sure to return often to check out the latest.


    # ### Handle duplicate tracks


    As your digital music collection grows, you’ll inevitably have to deal with the
    problem of duplicate tracks. Sometimes you''ll forget which CDs you''ve ripped,
    or you''ll move music from one disk to another, or you might even buy a track
    you''ve already ripped. You can use a set of handy scripts described in this section
    to help clean up duplicates.


    # #### Remove duplicates


    This script simply looks through the selected playlist for multiple copies of
    the same track. If it finds any, it removes the superfluous copies from the playlist.
    To be considered duplicates, two (or more) playlist entries must refer to the
    exact same track: that is, the same file on disk. So, different tracks that have
    the same song name, or even tracks with the same name and artist that are on different
    albums (such as a “greatest hits” collection), are not considered duplicates.
    Remove Duplicates provides a report when it’s finished, as shown in Figure 6–7,
    but it doesn’t give you a chance to preapprove its work before it deletes duplicates—you
    just have to trust it.'
