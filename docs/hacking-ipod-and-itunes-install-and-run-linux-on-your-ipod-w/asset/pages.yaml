    the Calendars folder.

    +   8.  At last, click Save.


    You have now stored a single calendar event on your iPod. When you disconnect
    the iPod, go to Calendar and you should see your event on the appointed date.


    This one-at-a-time stuff is OK for limited use. But what if you want to put a
    whole bunch of Outlook items onto your iPod at once? Luckily, you’re not doomed
    to repeating this procedure over and over again for each item. Instead, there’s
    a hack for exporting multiple items all at once. This procedure works for both
    Contacts and Calendar items, although you can’t mix the two types in one export.
    Here are the steps for Contacts:


    +   1.  As before, be sure your iPod is connected, and that your PC knows it’s
    connected.

    +   2.  In Outlook, go to Contacts and select all the items you want. You can
    use Shift-click and Control-click to choose multiple items.

    +   3.  Choose Actions ⇔ Forward as vCard. This creates a new e-mail message with
    all the Contacts you selected converted to vCard format.

    +   4.  Address and send the e-mail to a trusted friend—like yourself. Although
    all the vCards are right there for the taking, there’s apparently no way to access
    them all at once except as a received e-mail.

    +   5.  Collect your e-mail in Outlook. When you look at the received message,
    you should see all the vCards as attachments.

    +   6.  Select the message that you sent with all the vCards. Choose File ⇔ Save
    Attachments ⇔ All Attachments. Note: if you use an e-mail program other than Outlook
    to collect your mail, it might not have the Save All Attachments feature.

    +   7.  In the Save All Attachments dialog box that appears, click OK.

    +   8.  Next, you’ll see a Save All Attachments file list. Navigate to your iPod’s
    contacts folder and click OK.


    You’re done—the contacts have been shipped off to your iPod.'
  merge: -1
  img_proc: true
