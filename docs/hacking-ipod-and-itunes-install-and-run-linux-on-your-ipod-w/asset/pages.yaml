    the timeline at the bottom of the screen.

    +   3. Drag the playhead (that’s the cursor with the inverted pointer at the top)
    all the way to the right.

    +   4. Select the next song and click **Place at Playhead** (Figure 8–7).

    +   5. If you want to add more songs, repeat steps 3 and 4 for each one.'
