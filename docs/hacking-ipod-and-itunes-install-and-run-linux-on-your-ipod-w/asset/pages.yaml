    FIGURE 11-8: Sheryl Crow page in iTunes Music Store.


    You can see a complete list of music videos in the Store by clicking Music Videos
    on the Store’s home page. For more about this, see the section Watch videos and
    movie trailers in this chapter.


    You can get even more goodies for some artists. If you go to the page for John
