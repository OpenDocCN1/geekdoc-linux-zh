- pgno: 44
  md: 'From this menu, you can choose **Record Now** to start recording your monumental
    thoughts.


    While you''re recording, the screen displays a large timer so you know how long
    it''s been listening, the word "Recording" flashes on the screen, and the Voice
    Recorder itself lights up a very subtle green LED. Recordings are stored as WAV
    files at 128K bits per second, which means you''ll use up 16K bytes every second.


    The best hidden cool hack in the Voice Recorder is the built-in speaker. When
    the recorder is plugged in, your iPod suddenly has an external speaker—a small,
    quiet speaker, but a speaker nonetheless. This is handy for a number of uses:


    +   * Listening to voice recordings you''ve made, which is the intended use.

    +   * Sharing a bit of music or other sound with a friend, without the sanitary
    nightmare of lending out your ear buds.

    +   * Using the iPod as a music-playing alarm clock. (For details, see the section
    *Go to sleep and wake to your iPod* in this chapter.)


    You can move voice recordings from the iPod to your computer. The next time you
    connect the iPod to your computer, iTunes will put up a dialog box asking if you
    want to add the voice recordings to your music library. If you say yes, the voice
    memos will be copied to your computer and added to your iTunes library.


    If adding your intimate personal notes to your music library isn''t exactly what
    you had in mind, you can copy voice recordings to your hard disk without putting
    them into iTunes. To do this, open your iPod in the Finder or Windows Explorer.
    You''ll see that you have a new Recordings folder. Open Recordings to see your
    voice memos. Their names correspond to the date and time they were recorded. So,
    for example, a memo named "20040715 131522" was recorded on July 15th, 2004, at
    1:15:22 p.m. You can copy these files just like any others.


    Belkin''s Voice Recorder for iPod costs about $50 and is widely available, including
    at Apple stores, and the online store. You need a 3G iPod to use the Voice Recorder.


    In the summer of 2004, Griffiin Technology added to its impressive product lineup
    by shipping iTalk (Figure 2-2). This product is very similar to Belkin''s, differing
    only slightly in the physical design.


    The iTalk has the same cool look as the rest of Griffin''s products. You can get
    one from the Apple store or directly from Griffin for about $40.


    # Store digital photos


    If you''re a digital photographer, you probably know the hassle of running out
    of space for pictures on your camera. It''s not like you can just carry a few
    extra rolls of film around with you—CompactFlash, SmartMedia, and the like are
    too expensive for that. Off-loading'
