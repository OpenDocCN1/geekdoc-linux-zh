    # Hacking the Culture: Theft by iPod


    When you opened your new iPod, you certainly noticed the sticker on the screen
    that said "Don''t Steal Music." Based on reports that began appearing shortly
    after the original iPod began shipping, these stickers might not have gone far
    enough, because apparently at least one malicious person decided to use an iPod
    for stealing more than music.


    In February 2002, a CompuUSA customer in Texas reported seeing a man produce an
    iPod from his pocket, connect it to a Macintosh on display, copy commercial software
    to the iPod, then disconnect the iPod and walk away. Although the iPod is best
    known as a music player, the thief exploited the iPod''s ability to act as a capable
    external disk drive. While this is definitely an example of an iPod hack, it''s
    not one I''m going to encourage.


    # Software


    Groovy hardware isn''t the only way to add features to your iPod. You can also
    change your iPod''s life simply by taking advantage of cool software out in the
    world. In this section, we''ll discuss software tricks that help your iPod manage
    your contacts, act like an alarm clock, and more.


    # Import your contacts and calendar


    Your iPod has the innate ability to keep track of contacts and calendar events.
    If you have a Macintosh, you can use excellent free software from Apple to get
    your contacts and cal-endar info onto your iPod: Address Book, iCal, and iSync.
    Apple doesn''t provide Windows versions of these programs, but there are other
    companies that supply their equivalent. Address Book, iCal, and iSync are installed
    on most Macs—check your Applications folder to find out for sure. If you don''t
    have them, go right now and down-load them at www.apple.com/support/downloads/.
    And if you have Windows, just skip down to the section *Use Contacts and Calendar
    with Windows*.


    Like most Apple gear, this set of programs is easy to use. If you keep your contacts
    in Address Book, and you use iCal to keep track of your appointments, you can
    easily sync your information to your iPod by following these steps:'
