- pgno: 226
  md: '# Music Out: Burning

    and Beyond


    ![](img/f481d8a0ca491080698039f72bf96e1b_226_0.png)


    Tunes is a haven for your music, not a prison. Whenever you want, you can borrow
    your songs from iTunes so they can go with you out into the world, not just in
    an iPod, but also on CDs and DVDs. In this chapter, we’ll talk about hacks and
    tricks you can use to make your music better and more accessible as you get it
    out of iTunes.


    When consumer CDs first appeared in the early 1980s, they were meant as a replacement
    for vinyl records and prerecorded cassettes. The industry had to apologize for
    the fact that people couldn’t record their own CDs—that simply wasn’t what the
    technology was invented for, and it would probably never be possible, they said.
    But demand proved to be a powerful motivator, and CD recording—or *burning*, a
    much more colorful term—became a national pastime.


    Apple missed out on the start of the CD burning obsession. Apple was one of the
    last major computer companies to include CD burners in its machines. This is especially
    ironic for several reasons: Apple was a big booster of CD-ROMs when they first
    appeared; while he was at NeXT Computer, Apple CEO Steve Jobs introduced the first
    computer that had *only* an optical drive; and given Apple’s strong position in
    digital music now, you would have guessed the company got an early start on trends
    like CD burning. They didn’t, but they seem to be all caught up now.


    iTunes is best known for a few key features: playing music, importing tunes from
    CD, buying songs from the iTunes Music Store, and burning CDs. Although you probably
    know all about burning your own CDs to play in the car or the living room stereo,
    there’s a lot more you can do with your music. In this chapter, we’ll discuss
    cool and sometimes useful features for getting the music from iTunes onto optical
    discs and beyond.


    # in this chapter


    +   - Use MP3 to Make a 12-Hour CD

    +   - Make a Mix DVD

    +   - Create Gapless Music CDs

    +   - Burn as Many Songs as You Want

    +   - Change the “Volume Up” and “Volume Down” Sounds

    +   - Back Up Your Music'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Use MP3 to Make a 12-Hour CD


    Hey, kids! Not to sound like an old guy here, but back in the day, records were
    records, and record players played them. The only format differences you had to
    worry about were turntable revolution speed (33 1/3, 45, or 78 revolutions per
    minute [RPM]) and the physical size of records. You might have thought that digital
    music would make format differences easier to deal with. If so, you would have
    been wrong. Format wars and convenience factors have made dealing with digital
    music trickier than it ought to be.


    Standard CDs, like the ones you buy from record stores, cause few problems. They’ll
    play in almost any consumer CD players, like the ones in your car, bedroom, or
    bathroom, and they work in your computers, usually, although unpleasant copy protection
    schemes sometimes interfere with that. The latest technology allows standard audio
    CDs to hold up to 80 minutes of music. The CDs you burn on CD-R discs with iTunes
    are like this: they can hold up to 80 minutes of music and will play in most CD
    players.


    Meanwhile, while we’ve been learning to play and burn audio CDs, Apple and the
    rest of the digital music industry have been training us to love MP3s. As you
    probably know, the main innovation provided by the MP3 format is that it manages
    to squish music down to about a tenth of its size while still sounding a lot like
    the original: CD music takes up about 10 megabytes per minute, while MP3s only
    use about 1 megabyte per minute. That’s one of the reasons we can fit so many
    songs onto our hard disks and iPods.


    When you burn a CD, the music is inflated back to the larger size. That’s because
    most CD players only understand CDs with music in that format. But what if you
    could put MP3-sized files onto a CD, then listen to them in your CD player? Because
    MP3s are about a tenth the size of their full-audio counterparts, you would be
    able to get 12 hours of music or more onto a single CD. Using a feature of iTunes
    and the right CD player, you can actually make this happen. (The precise length
    of time you can fit onto a CD depends on the particular songs you choose.)


    To make this work, you need two things: a CD player that can read and play the
    disc, and a way to burn a CD full of MP3 music. The first part, finding a compatible
    CD player, requires a little investment, but the second part, burning the CD,
    is cheap. Many CD players for homes and cars, especially newer models, are smart
    enough to understand a disc filled with MP3s. You can play MP3s on CD players
    from Alpine, Sony, Aiwa, Kenwood, Panasonic, JVC, and many others. You might have
    to shop a bit for a new player, but you can find MP3-capable CD players in all
    price ranges, starting at less than $100.


    iTunes makes it simple to burn a CD full of MP3s. Here’s how you do it. First,
    you need to make a playlist containing the songs you want to put on the CD. Then,
    pull down the iTunes menu (Mac) or Edit menu (Windows) and choose Preferences.
    Click the Burning tab. In the Disc Format section, choose MP3 CD and click OK.
    The next time you proceed to burn a CD, iTunes will create a CD filled with MP3s
    instead of full-audio music. You can play that CD on a computer or on an MP3-savvy
    CD player.'
  merge: -1
  img_proc: true
