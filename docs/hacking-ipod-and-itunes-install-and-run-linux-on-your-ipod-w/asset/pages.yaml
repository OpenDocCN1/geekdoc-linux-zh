    have plenty of errors. You can correct typos in your tags by clicking the mistaken
    text in the library or playlist column, then typing the correction. But some errors
    can be fixed with more elegant, scripted solutions. In this section, we''ll talk
    about a couple of scripts that help you automate the process of correcting tag
    errors.


