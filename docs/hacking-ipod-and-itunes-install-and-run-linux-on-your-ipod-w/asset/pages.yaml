    on your iPod so you can check them out whenever you have time. Getting notes into
    Note Reader is easy: just drag text files into the Notes folder, using the Finder
    or Windows Explorer. It’s very cool.


    However, Apple decided to limit Notes and Note Reader to new iPods only. Unlike
    many other new features, you couldn’t get Notes by upgrading the software of your
    pre-2003 iPod. Bummer.


    Luckily, the iPod universe is filled with clever programmers who help us get around
    problems like this. Podtext by Thomas Häcki is an example of this phenomenon.
    Podtext lets you store notes in your Contacts folder, which every iPod has, regardless
    of vintage. You can use Podtext itself to type notes, then save them directly
    to the iPod or to your hard disk. You can open these Contacts-Notes directly in
    Podtext and edit them, but you can’t open a file from the Mac’s hard disk. Instead,
    you can open the file with another program, such as TextEdit, select text there,
    then drag it into Podtext. Figure 4-11 shows you what Podtext looks like.


    If your text file is too big to fit into a contact on the iPod (more than 2,000
    characters), Podtext will automatically split it into multiple files for storage,
    then stitch it together again when you edit it.


