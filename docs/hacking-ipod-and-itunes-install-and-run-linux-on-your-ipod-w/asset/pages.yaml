- pgno: 185
  md: '+   - **A and S** *Cycle through shapes*: Use A for the next and S for the
    previous.

    +   - **Z and X** *Cycle through color schemes*: Z for the next and X for the
    previous scheme.

    +   - **Caps Lock** *Display configuration when it changes*: If Caps Lock is on,
    you''ll always see new configurations displayed.

    +   - **N** *Toggle between high contrast and normal contrast colors*.

    +   - **B** *Show the Apple logo*: "B" is for "bite".


    # Set the size of the visual effect


    You can make the Visualizer''s effect appear in any of four different size formats,
    all available as menu items in the Visualizer menu. All the formats are relative
    to the size of the iTunes window. The Large format fills the window, while the
    Medium and Small settings occupy smaller fractions. To get the most out of your
    Visualizer, choose Full Screen to have the visual effect take over your entire
    monitor. When you want your computer back, just press Esc to end the light show.


    ![](img/f481d8a0ca491080698039f72bf96e1b_185_0.png)


    > iTunes respects the size setting (Large, Medium, or Small) even when you''re
    watching in full screen mode. If you want your full screen effects to take over
    the entire full screen instead of just part of the full screen, make sure you
    choose Visualizer Large before going to full screen.


    # Use the Visualizer as a screen saver


    You might not have realized that you don''t actually have to be playing music
    for the Visualizer to be working. Try it: turn on the Visualizer, but make sure
    iTunes is silent. You''ll still see a lovely slide show.


    # Get Visualizer plug-ins


    Although Apple provides awesome visual effects with the Visualizer, you don''t
    have to settle for the built-in features. The Visualizer in iTunes is actually
    a platform that allows programmers to create their own visual effects modules.
    If you scour the Internet, you''ll find a few very cool Visualizer plug-ins that
    offer alternatives for visual effects. To install a new plug-in, you just download
    the file, then put it into the Plug-ins folder inside the iTunes folder (see iTunes
    Help for full details). When you install Visualizer plug-ins, they show up in
    the Visualizer menu. To use one, you select it from that menu.


    Most Visualizer plug-ins are only available for the Mac version of iTunes, because
    it''s been around for much longer than the Windows version, but there are some
    for both operating systems. Here are a few for you to check out:'
