    \ you’re saving up for a new iPod, you might have to bank a little extra cash\
    \ so you can buy a new BMW, too.\n\n# Replace Your iPod’s Battery\n\niPod batteries\
    \ are designed to withstand several thousand cycles of charging and discharging.\
    \ Eventually, you might end up with a battery that will no longer hold a charge.\
    \ But although the battery is built-in, all is not lost. When the battery conks\
    \ out, you have four options:\n\n+   - If you’ve managed to wear out your battery\
    \ while your iPod is less than a year old, it’s still under warranty, and Apple\
    \ will fix or replace it for free. The full warranty statement is available at\
    \ `store.apple.com/Catalog/US/Images/`  \n+   iPodwarranty.html.\n+   - If your\
    \ iPod is out of warranty, Apple will replace it for about $100. You fill out\
    \ a form, ship the iPod to Apple, and a new one (same model you sent in, sorry)\
    \ comes back. See `www.apple.com/support/ipod/service/battery.html` to start the\
    \ process.\n+   - You can buy a replacement battery for about $60 or less and\
    \ install it yourself. iPod replacement batteries are available from various sources,\
    \ including `www.ipodbattery`  \n+   .com, `www.pdasmart.com`, and `smalldog.com`.\n\
    +   - Your final option is to go back in time and buy AppleCare Protection when\
    \ you get your new iPod. For $59, AppleCare extends your warranty from one year\
    \ to two.  \n+   AppleCare also covers the accessories that came with your iPod,\
    \ such as the dock and remote, but it probably won’t help you if your dog eats\
    \ your ear buds. Read all about AppleCare at `www.apple.com/support/products/applecareipod.html`.\n\
    \n# Battery replacement surgery\n\nIf your iPod needs a new battery, should you\
    \ attempt to replace it yourself? If you have an earlier iPod, you will probably\
