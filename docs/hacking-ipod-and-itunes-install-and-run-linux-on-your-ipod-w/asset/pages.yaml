- pgno: 48
  md: '# Use external batteries


    You can never be too rich, too thin, or have too much battery power, as the old
    saying (almost) goes. The iPod''s built-in rechargeable battery gives you up to
    8 hours of musical joy. That''s usually long enough to get back to a safe haven
    so you can recharge. But what about those times when you need more power? Because
    the iPod''s battery is built in, you can''t simply carry around an extra battery,
    as you can with laptops and many other electronic devices.


    The Backup Battery Pack from Belkin lets you use standard AA batteries to add
    up to 20 hours of playing time to your iPod. The Backup Battery looks like a backpack
    for your iPod. It attaches to the shiny iPod back with two handy suction cups.
    A cable plugs the backpack into the dock connector on the bottom—the Backup Battery
    only works with 3G iPods. When you attach the Backup Battery, the iPod draws power
    from it instead of the built-in battery, so you shouldn''t plug in until your
    main battery is dead or moribund.


    The Backup Battery includes a nifty set of green LEDs that show you how much battery
    power is remaining, just like Apple''s laptop batteries. When you need to remove
    the backpack, the suction cups have handy little pull tabs at the top to help
    pry them loose, a nice touch.


    For those with big battery requirements, the Backup Battery for iPod sells for
    about $59 and you can get it from most places that sell iPod stuff, including
    the Apple store.


    ![](img/f481d8a0ca491080698039f72bf96e1b_48_0.png)


    For information on how to replace your iPod''s internal battery—it can be done!—see
    the section *Replace Your iPod''s Battery* in Chapter 3.


    # Use your iPod as a light


    You might have noticed that your iPod''s backlight is very bright. In fact, it''s
    vivid enough that ingenious iPod owners have devised clever ways to use the backlight,
    such as these:


    +   - **Flashlight.** If you''re going to the movies, you can use your iPod backlight
    to help you find your seat or that dropped box of Raisinets.

    +   - **Safety light.** The iPod team reports hearing from joggers who keep their
    backlights burning as a safety device when running at night.

    +   - **Book light.** In a pinch, use your iPod to illuminate a book or map in
    a darkened room, as shown in Figure 2-5.

    +   - **Night light.** During a hotel stay in Philadelphia with my family, I used
    the iPod as a night light by plugging it into the wall on the bathroom counter
    and setting the backlight to stay on all the time.'
