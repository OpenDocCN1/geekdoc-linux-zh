    turned off in the main options dialog box, press I to temporarily see which song
    is playing. The info display fades into the psychedelic mist after a few seconds.


    +   • **D** **Reset settings to default**: Start the current effect over again.


    If you follow the advice suggested by the first item and press ? again, you’ll
    see even more commands:


    +   • **M** **Select config mode**: This option cycles between three different
    display modes. The default is “Random slideshow mode”, in which the Visualizer
    keeps changing the effect parameters. The other modes are “User config slideshow
    mode”, which cycles'
  merge: -1
