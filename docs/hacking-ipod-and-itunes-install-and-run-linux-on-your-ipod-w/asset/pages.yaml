- pgno: 246
  md: '# Finetune the Music Library''s Appearance


    When you start iTunes for the first time, the music library presents a nice default
    appearance. But this book is not for people who like defaults. In this section,
    we’ll talk about various ways you can tweak the way your music library appears
    until it’s showing just the information you want, in just the way you want it.


    # Get rid of the “Genre” column


    All iTunes tracks include a property called Genre. This is supposed to make it
    easier for you to figure out what category a particular song belongs to. But there
    is a serious flaw with the genre property. When you rip a CD, the information
    about the songs, such as the names of the artist and tracks, comes from GraceNote
    CDBB, a database of information that was built largely by user contributions.
    Despite the best efforts of GraceNote, this massive database is filled with errors,
    including misspelled names and transposed information (such as putting the artist
    name where the track should be, and vice versa). When it comes to genres, the
    problem is worse. There are no standards for what user contributors type into
    the genre field. For example, when I look through my iTunes library, I have genres
    (supplied by GraceNote CDBB) named Rock, Rock & Roll, and RockNRoll. Obviously,
    this makes it hard to rely on genre, unless you take the time to check your CDs
    after they’re ripped and edit them to make sure you’re using an orderly set of
    genres.


    On the other hand, if most of your music comes from the iTunes Music Store, you’re
    in better shape. The store seems to apply much better quality control to its genres.
    There is a well-defined set of genres (25 of them as of this writing), and all
    music in the iTunes Music Store is within one of those.


    If you’re down on genres, you might want to remove the “Genre” column that appears
    in the iTunes browser. To do this, go to Preferences on the iTunes menu (Mac)
    or the Edit menu (Windows), click General, and turn off the “Show genre while
    browsing” box. Just like that, the unwanted Genre column will go away. Note that
    it vanishes from the browser entirely, including when viewing playlists.


    # Bend columns with your bare hands


    The initial appearance of your song lists in the library and playlists is just
    a suggestion. You have a great deal of power over how you want the columns of
    information to appear. The easiest way to choose the columns you want to see is
    by right-clicking any column title. You’ll see a list of all possible columns,
    with check marks next to the ones that are displayed. Just check and uncheck column
    names to get the ones you want. If you prefer, you can make all your column on/off
    choices at once by choosing Edit ⇾ View Options (see Figure 10-5).


    When you’re seeing the columns you want, feel free to push them around. Grab any
    column’s header and drag to move it to another position. (The exception is Song
    Name, which always insists on being the first column.) You can resize columns,
    too. Move the'
  merge: -1
  img_proc: true
