    FIGURE 8-5: After using Consolidate Library, music is copied to the iTunes Music
    folder and organized according to artist and album.


    +   2.  Insert the CD you want to rip. The CD should appear in the iTunes source
    list, with its tracks listed to the right.


    +   3.  Figure out which tracks you want to hear without a gap. To select them,
    click the first, then shift-click the last.


    +   4.  Pull down the Advanced menu and choose Join CD Tracks. Your song list
