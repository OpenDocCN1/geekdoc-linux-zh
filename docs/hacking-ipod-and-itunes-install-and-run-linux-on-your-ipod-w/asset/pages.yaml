- pgno: 134
  md: 'If you’re using Mac OS X, you can use yet another shortcut to create a playlist
    from the selection: hold down the Shift key and click the “+” button at the bottom
    of the source list. The new playlist will be created with the selected songs in
    it. This is one of the unusual cases when a feature is available on the Macintosh
    version of iTunes but not on Windows. The Windows version uses Shift-click on
    the “+” button to create a new smart playlist (see _Use Keyboard Shortcuts with
    Playlists_ later in this chapter).


    # ## Make a “Freshest Tracks” Playlist


    When you get new tunes from your favorite artists, you’re probably excited to
    listen to it as soon as possible. But in the hustle and bustle of our stressful
    lives, we sometimes forget even pleasurable diversions like listening to new music.
    iTunes can help you with this problem. Just create a Smart Playlist to keep track
    of your freshest tracks. Here’s how it’s done:


    +   1.  Choose **File**  New Smart Playlist. You’ll get the Smart Playlist dialog
    box.

    +   2.  In the boxes that define conditions for the songs you want on the list,
    choose “Date Added,” “is in the last”, “30”, and “days”. You can adjust the “30
    days” value depending on how aggressively you acquire new music.

    +   3.  Fine-tune your playlist. You can check the “Limit” box to keep the playlist
    below a chosen number of songs or length of time. If you want to make sure your
    “freshest tracks” playlist fits on your iPod, use the “Limit” to specify the number
    of megabytes or gigabytes of music you want.

    +   4.  Make sure “Live updating” is checked. This makes sure that tracks are
    kicked off the playlist when they get too old. Think of this as a “freshness dating”
    system, like the date stamped on your milk. The dialog box in Figure 5-2 shows
    what this looks like. Click OK, and you’ve got your playlist.


    ![](img/f481d8a0ca491080698039f72bf96e1b_134_0.png)


    **FIGURE 5-2:** Creating a Smart Playlist that holds the newest songs.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'With a “freshest tracks” playlist, you can make sure you’ll never let those
    new tunes slip through the musical cracks. Any time we can make computers do the
    remembering for us, it’s a plus.


    # ## More ideas for Smart Playlists


    The Smart Playlist feature in iTunes is one of those technologies that looks very
    simple while hiding a vast amount of power. You could spend a lot of time coming
    up with various clever and wonderful schemes for new playlists. Why, you might
    even devote a whole web site to it! In fact, that’s just what’s going on at SmartPlaylists.com,
    a place for iTunes enthusiasts who love to explore what they can make with this
    great feature. Take a look at the SmartPlaylists.com home page in Figure 5-3.


    SmartPlaylists.com is mainly an exchange of ideas on what you can do with Smart
    Playlists. Here are a few of sample suggestions and ideas for smartening up your
    music listening:


    ![](img/f481d8a0ca491080698039f72bf96e1b_135_0.png)


    FIGURE 5-3: SmartPlaylists.com home page.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# All “unchecked” songs


    iTunes uses the checkbox at the left of every song as a sort of master on/off
    switch. When iTunes encounters unchecked songs as it’s playing music, it skips
    over them. Many iTunes users uncheck songs that they usually don’t want to hear.
    But sometimes you might find yourself in the mood for those neglected tunes. A
    Smart Playlist would seem like a handy way to deal with this. But alarmingly,
    you can’t specify “unchecked” as a criterion for Smart Playlists. There’s a checkbox
    for leaving them out, but not for allowing them in.


    What can you do? The answer is to use a two-playlist technique. First, you need
    to create a playlist that includes all checked songs. You can do that with the
    following steps:


    +   1. Choose New Smart Playlist from the File menu.

    +   2. Make sure the “Match only checked songs” box is checked.

    +   This is really the only criterion we want to apply for this smart playlist.
    But iTunes won’t let us create the playlist with only this box checked. We can
    overcome this problem by specifying a bogus criterion that will not exclude any
    songs:

    +   3. Make sure the “Match the following condition:” box is unchecked, We won’t
    be using it here.

    +   4. Click the “Limit to” check box to turn it on. Type in **99999 GB** in the
    boxes on that line. That’s the largest number you can enter here, and I’m betting
    you have less music than that. Your dialog should now look like Figure 5-4.

    +   5. Click OK to create the playlist.

    +   6. In the source list, the new playlist’s name is selected. Type a new name:
    **all checked**.

    +   7. Create another smart playlist by choosing New Smart Playlist from the File
    menu.


    ![](img/f481d8a0ca491080698039f72bf96e1b_136_0.png)


    FIGURE 5-4: Smart Playlist dialog box.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_137_0.png)


    FIGURE 5-5: Broken playlist dependency alert.


    +   8. In the “Match the following condition” section, choose “Playlist is not
    all checked” and click OK. Rename this new list “all unchecked”.


    There you go! The new playlist you just created will contain all your unchecked
    songs and nothing else.


    ![](img/f481d8a0ca491080698039f72bf96e1b_137_1.png)


    > In this hack, we''ve set up a playlist that depends on the contents of another
    playlist, “all checked”. What happens if “all checked” goes away? I was wondering
    the same thing, so I deleted it. When I did, the “all unchecked” playlist grew
    an exclamation point in a circle, which is iTunes-ese for “Something is wrong.”
    Interestingly, when I selected the playlist, I could play songs from it without
    any problem. But when I chose Edit Smart Playlist, I got the alert you see in
    Figure 5-5.


    When I clicked OK, I found that I could edit the playlist and change its criteria.
    I clicked cancel, and the playlist continued to work OK, despite that dire warning.
    So if you delete a playlist that another playlist refers to, you can still use
    the dependent, which will be frozen in time forever, or until you edit its criteria,
    whichever comes first.


    # Themed playlist


    Some topics are subjects for thousands of songs: love, hope, and cars are pretty
    popular. But you might be surprised to find how many songs exist about other subjects
    that might'
  merge: -1
  img_proc: true
