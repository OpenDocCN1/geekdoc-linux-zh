    # ## Conversions: Useful, possible, and otherwise


    At first thought, this sounds like a terrific way to upgrade the quality of your
    music library simply by using more disk space: just choose a bunch of songs that
    you ripped as MP3s at 128K bits per second and convert to a higher bit rate, such
    as 192K bps. Unfortunately, it doesn''t quite work that way. When you imported
    music at 128K bps, iTunes didn''t keep the original data around when it was done
    compressing. Converting songs to 192K now won''t bring back that lost data—the
    music won''t sound any better, and it might sound worse, because it''s going to
    be reencoded. The only way to get better quality is to go back to the source—your
    CD—and re-rip.


    If you can''t use this feature to make your compressed music sound better, what
    can you do with it? The only scenario it''s really useful for is converting from
    an uncompressed format (AIFF or WAV). You can go from AIFF to WAV or vice versa,
    which is useful for some programs that only understand one or the other. You can
    also convert from AIFF or WAV to one of the compressed formats, MP3 or AAC, if
    you want to create a copy of the song that will take up less disk space.


    When you buy music from the iTunes Music Store, it comes in the Protected AAC
    format. You might think you could get your tunes out of Protected AAC jail by
    using this feature to convert them to free and unfiltered MP3, but unfortunately,
    it doesn''t work. Apple thought of that too. If you try to convert a music store
    song, iTunes informs you that you can''t convert from a protected format. You
    can, however, burn Protected AAC songs to CD, then rip them back as unprotected
    MP3s.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'The Convert feature has one more groovy hidden trick. If you hold down Option
    (on a Mac) or Shift (on Windows) while you choose the Convert menu item, iTunes
    will give you a box to choose a file on the disk to convert, rather than the selected
    song in iTunes. On the Macintosh, you can choose a folder if you want, and all
    music files in the folder will be converted.


    # # Use a Cross-Platform Disk


    As you discover the convenience of having all your CDs available in iTunes, your
    music library will grow like a monster and start to consume all available disk
    space in sight. If your home or office is cross-platform, you''ll be very tempted
    to use both Macs and Windows machines for storing your tunes. When you have music
    stored on various computers, you can use iTunes'' excellent music sharing feature
    to play songs from other machines. But iTunes sharing doesn''t let you copy music
    from another computer; to do that, you actually have to delve into the Finder
    or Windows Explorer and copy the files themselves, or, if you get the music together
    in one library, use iTunes “consolidate” feature, as described in *Get All Your
    Music Together in One Place* in Chapter 8.


    For a greater degree of portability and flexibility, you might want to have a
    hard disk that you can transport from one computer to another. This technique
    is useful if you don''t have a network that''s fast or reliable. It''s also handy
    for schlepping your music to a friend''s house, to the office, or to a party,
    because external hard disks can provide far more capacity than iPods do.


    The best part about using an external drive is that you can make the disk understandable
    by both Macs and PCs. Mac OS X will happily communicate with disks formatted for
    Windows. Your best bet is to use the FAT32 file system on external disks, which
    works fine with both Macs and PCs. You can format a disk as FAT32 on either a
    Mac or a PC, whichever suits you better.


    ![](img/f481d8a0ca491080698039f72bf96e1b_240_0.png)


    Caution


    These instructions reformat a disk as FAT32, which erases the disk and destroys
    all the information on it. There are no steps here to preserve any data you might
    already have on the disk. If there''s anything on the disk you want to keep, save
    it somewhere else first.


    To use Mac OS X to format a disk as FAT32:


    +   1. Start Disk Utility. This application is usually in Applications/Utilities.

    +   2. In the column at the left, click to select the drive you want to format.
    Note: don''t select the wrong drive! (Disk Utility won''t let you erase your startup
    disk.)

    +   3. In the “Volume Format” pop-up, select “MS-DOS File System”. This really
    means FAT32, even though it doesn''t say so. Maybe “FAT32” is not a posh enough
    term for Apple to use.

    +   4. Click Erase to format the disk.'
  merge: -1
  img_proc: true
