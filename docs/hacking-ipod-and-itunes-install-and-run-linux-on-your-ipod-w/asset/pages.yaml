    FIGURE 8-6: When you insert a CD and join tracks together, you can see the individual
    track names with a line connecting the joined tracks.


    > **Note**

    > iTunes has a feature called *Crossfade playback* which plays the last part of
    the current song at a decreasing volume level while playing the first part of
    the next song at an increasing volume. This effect is similar to joined tracks,
    but not the same. The Crossfade playback setting is on the Effects tab of iTunes
    preferences.


    When you play the joined tracks from your library, you’ll hear them one after
    the other without any gap, just as if you were playing them from CD. Of course,
    you won’t be able to access them individually in your library. If you want to
    have it both ways, you can gain the ultimate flexibility by ripping the CD twice:
    once without any joining, and once with some tracks joined. That will give you
    entries in your library for all the songs individually, as well as the version
    that plays through the songs without any gaps.


    If you’ve already ripped the tracks without joining them, and you’re using a Mac,
    you can stitch the tunes together again using the audio features of Apple’s iMovie,
    as follows:


    +   1. In iMovie, click the **Audio** button.

