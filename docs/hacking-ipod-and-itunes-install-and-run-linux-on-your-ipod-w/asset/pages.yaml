- pgno: 237
  md: 'thought of that, and you figure you’ll just use your CDs as backup—you can
    always restore from them in case something goes wrong with your ripped tunes.


    There are a couple of flaws in the audio-CDs-as-backup strategy. First, and most
    obviously, it only covers music that came from CD in the first place. If you’re
    a customer of the iTunes Music Store, you own music that was shipped to you on
    a wire, not a CD. And if you’ve read and used any of the fun music sources in
    Chapter 8, you have even more music that’s not backed up anywhere. The second
    flaw in the strategy is assuming that you’re actually going to invest the hundreds
    of hours you would need to re-rip everything from CD again.


    The quickest, easiest, and most expensive way to back up your music is to get
    an external hard disk that’s big enough to hold all your tunes. You can now get
    very reliable external FireWire drives for about $1 per gigabyte: 300GB for around
    $300, for example. Add some high-quality backup software, such as Retrospect from
    2antzt, and you’re all set.


    If you want a lower cost technique, consider backing up onto data CDs or DVDs.
    The bigger your music library, the less interesting this technique becomes, because
    you’ll need an enormous number of discs. A data CD can hold 650 Mb of stuff, and
    a DVD stores about 4.7GB.


    To back up your music with CDs or DVDs, start by opening File ⇄ Preferences, going
    to the Burning tab, and choosing “Data CD or DVD”. This format is the same as
    MP3 CD, except that it will include all songs in a list, while “MP3 CD” ignores
    anything that’s not an MP3. After you’re done in Preferences, just pick the playlist
    you want to back up. If you want to burn your whole library, make a new playlist
    and drag the Library icon to the icon for the new playlist, then burn from that
    mega-playlist.


    # ## Summary


    You can’t always be at your computer or iPod. Sometimes, it’s useful to get music
    away from your digital devices and into the relatively old-fashioned formats of
    CD and DVD so you can listen in more places. Using the tricks in this chapter
    for burning CDs with iTunes, you can become a master of the burn and take your
    tunes with you to even more places.


    Coming up in Chapter 10, we’ll get into the iTunes music library to see what we
    can discover. I’ll discuss playlists, file formats, album art, and more—see you
    there.'
