- pgno: 278
  md: '# iPod Note Reader


    ![](img/f481d8a0ca491080698039f72bf96e1b_278_0.png)


    # About iPod Note Reader


    Apple shipped version 2.0 of the iPod software in 2003. This update expanded the
    iPod’s repertoire to include a totally new category of information: notes. When
    you choose Extras from your iPod’s main menu, you see the new Notes category,
    along with Contacts, Calendar, Clock, and Games. The Notes feature lets you create
    files of text on your computer that you can copy to your iPod and see on the screen.


    iPod Note Reader is the software inside the iPod that deals with notes. Note Reader
    does a lot more than just show text files on the screen. It includes powerful
    features like a basic markup language for text formatting, a way to create hyperlinks
    to other notes, and even the ability to play songs from notes. Coolest of all,
    you can use Note Reader to hide the standard iPod main menu and provide your own
    custom user interface to notes and music.


    In this appendix, we’ll delve into the iPod Note Reader and learn about these
    and other neat things you can accomplish.


    # The cult of notes


    Although Note Reader is one of the most powerful non-musical iPod features, it’s
    vastly under-used. Apple devotes only a little space to Note Reader on the iPod
    part of its Web site, and there isn’t a lot of non-Apple software that uses Notes.
    One key reason for this is that iPod 2.0 software, the version that includes Note
    Reader, doesn’t work on the first two generations of iPods. Because of this, many
    software developers use the basic text displaying features of Contacts, available
    on all iPods, instead of taking advantage of cool Note Reader features.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'The fact that Note Reader has unexploited cool features makes it a great candidate
    for hackery. I hope that reading this appendix will inspire you to create something
    cool for your iPod using Note Reader.


    # # Getting notes onto your iPod


    Loading notes onto your iPod is easy. Notes are simply text files, which you can
    create with virtually any editor or word processor on any computer. Using the
    Finder or Windows Explorer, put your wannabe notes inside the Notes folder when
    your iPod is connected to your computer. When you disconnect the iPod and choose
    Extras  Notes, all the items in the Notes folder appear. There’s no syncing or
    other explicit process required.


    ![](img/f481d8a0ca491080698039f72bf96e1b_279_0.png)


    When you create notes, make sure you save them as plain-text files. Word processors
    and text editors prefer to use file formats that also save information about fonts
    and other style elements, but these files won’t look right in Notes. Almost every
    program has an option to allow you save as plain text, also called "text only".


    Note Reader duplicates the hierarchy of notes and folders that you set up in the
    Finder or Windows Explorer. If you create subfolders inside the Notes folder,
    those subfolders will show up on your iPod. You can have folders nested as deeply
    as you want, and Note Reader will reflect your hierarchy.


    ![](img/f481d8a0ca491080698039f72bf96e1b_279_1.png)


    You can add the Notes command to your iPod’s main menu, making it a little easier
    to get to. When you become a true Notes power user, you’ll want this enhancement.
    To put Notes on your iPod’s main menu:


    +   1.  From your iPod’s main menu, choose Settings Main Menu.

    +   2.  Scroll down under Extras to Notes.

    +   3.  Press Select to change the display to read “Notes On”.


    The next time you go back to the main menu, you’ll see Notes in a much-deserved
    prominent position below Extras.


    # # Note Reader Markup


    In this section, we’ll go over Note Reader’s efficient markup language. Note Reader
    defines tags for various uses, including line breaks, links to other documents
    and songs, page titles, and more. If you’ve ever seen HTML, you should be able
    to figure out Note Reader’s tags. Note Reader tags are enclosed between angle
    brackets, just as in many other markup lan-guages. The text in Note Reader tags
    is case-insensitive, so `<title>` is just as good as `<TITLE>`.


    # ## Text


    Note Reader defines a few tags for displaying text:'
  merge: -1
  img_proc: true
- pgno: 280
  md: '+   - `<BR>`forces a new line. An actual carriage return in the file also forces
    a new line, although you can change that behavior by setting a preference.


    +   - `<P>`and `</P>`can be used to enclose a line. Text following the `</P>`is
    displayed on a new line.


    +   - `<TITLE>`and `</TITLE>`enclose the title of the note. This text is shown
    in the list of notes and is used as the note title, displayed at the top when
    the note is shown. Titles that are too long are truncated. If a note has no `<TITLE>`tag,
    its filename is used as the title.


    The following are some examples of basic text tags:


    ```

    Sedan delivery<br>is a job I know I''ll keep

    ```


    Text starting with "is" is displayed on a new line.


    ```

    <p>it was a dark and stormy night.</p> <p>at least my ipod was well-protected
    from the elements.</p>

    ```


    Starts a new line before "At least".


    ```

    <title>not your father''s note</title>

    ```


    Uses the text as the note''s name in the Notes folder and at the top of the screen
    when the note is displayed.


    # ### Tips and ideas


    +   - Because `<BR>`and `<P>`are used in HTML on Web sites, they can be handy
    when you''re translating Web pages for a new life as iPod notes.


    +   - You can use `<BR>`between items to force a new line without having to put
    each one on a separate line in your text file.


    +   - When you use `<TITLE>`, remember that the note will be listed by its title
    when using the iPod software but it will appear under its filename when you look
    for it in the Finder or Windows Explorer.


    # ## Hyperlinks


    Like any good hypertext language, Note Reader markup lets you link one document
    to another. Borrowing from HTML, Note Reader uses the A HREF tag. Start your linkage
    with `<A HREF="filename">`and finish with `</A>`. Any text between the tags is
    a link, displayed on the iPod screen with an underline. If you highlight the link
    text and click the Select button, the linked note appears. You select links by
    scrolling the wheel. If there''s only one link on the screen, it''s always selected—scrolling
    the wheel doesn''t do anything except provide finger exercise.'
  merge: -1
  img_proc: true
- pgno: 281
  md: "# Absolute and relative references\n\nJust as with HTML hyperlinks, Note Reader\
    \ links can be relative or absolute. Relative links refer to files that are in\
    \ the same folder as the note that contains the link. Absolute links let you refer\
    \ to files outside the current folder.\n\nAbsolute links always start with a slash\
    \ or other path delimiter; while relative links never start with a path delimiter.\
    \ Absolute links start at the Notes folder, which is the base of the entire universe\
    \ of notes when you use links. Use slash or another path delimiter to indicate\
    \ that you're descending into a directory. For example,\n\n```\nSee a <A HREF=\"\
    \ /old map\">map</A>.\n```\n\nlinks to a note named “old map” that's stored in\
    \ the highest level of the Notes folder, while\n\n```\nTime for <a href=\"/recipes/cheesecake\"\
    >dessert</a>\n```\n\nrefers to a note named “cheesecake” in the “recipes” folder,\
    \ which is in the Notes folder. Mmm...cheesecake.\n\nRelative links start in the\
    \ same folder as the current note, and never begin with a path delimiter. So,\
    \ for example,\n\n```\n<A HREF=\"Danger Bird\">Fly away</A>\n```\n\nlinks to a\
    \ note in the same folder as the note containing the link. Here's another:\n\n\
    ```\n<A HREF=\"dogs/puppies\">Puppy list</a>\n```\n\nThis one finds a folder named\
    \ “dogs” in the same folder as the current note, then gets a file named “puppies”\
    \ in that folder.\n\nIf you want to impress officials of international standards\
    \ bodies, you can use the standard URL syntax for a file when you create a link,\
    \ which is to precede the filename with “FILE: //”. Using this syntax, our last\
    \ example looks like this:\n\n```\n<A HREF=\"file: //dogs/puppies\">Puppy list</a>\n\
    ```\n\nThe same syntax works for absolute references:\n\n```\nTime for <a href=\"\
    file://recipes/cheesecake\">dessert</a>\n```\n\nAs with tag names, references\
    \ to filenames are always case-insensitive.\n\n![](img/f481d8a0ca491080698039f72bf96e1b_281_0.png)\n\
    \n> **Note**\n> \n> When you create links to files, make sure you include any\
    \ file extensions, such as .txt. Mac OS X and Windows often hide file extensions.\
    \ In Mac OS X, you can see a file's full name, including any extension, by selecting\
    \ the file in the Finder and choosing File ⇧ Get Info. In Windows, right-click\
    \ the file and choose Open With. If you see a list of programs, pick Choose Program.\
    \ The file's full name, including extension, will be shown at the top of the dialog\
    \ box."
  merge: -1
  img_proc: true
- pgno: 282
  md: "![](img/f481d8a0ca491080698039f72bf96e1b_282_0.png)\n\nSee the section “*Path\
    \ delimiters*” in this appendix for more information.\n\n# Linking to a folder\n\
    \nYou can use a hyperlink to point to a whole folder of notes. If you click such\
    \ a link, the list of notes in the folder appears on the screen. To point to a\
    \ folder of notes, just link to the folder name. For example, if “spacecraft”\
    \ is a folder of Notes, the following link:\n\n```\n`<A HREF=\"spacecraft\">The\
    \ final frontier</A>`\n```\n\ntakes you to that folder. You can link to the Notes\
    \ folder itself with various syntax forms, as in the following:\n\n```\n`<A HREF=\"\
    file://\">Notes folder</A>  \n<A HREF=\"file://\">All my notes</A>  \n<A HREF=\"\
    \">Top level</A>  \n<A HREF=\"/\">Take a look</A>`\n```\n\nThe ability to link\
    \ to the Notes folder was added in iPod Software 2.1—it won’t work in earlier\
    \ versions.\n\n# Tips and ideas\n\n+   - You can link to songs (see “*Links to\
    \ songs*” in this chapter), but not to any other iPod information, such as Contacts.\n\
    +   - Linking files this way provides you with a solid basic hypertext system.\
    \ You can use it to set up a web of linked information or even a simple database.\n\
    \n![](img/f481d8a0ca491080698039f72bf96e1b_282_1.png)\n\n> Reader’s hyperlinks\
    \ are ideal for adventure-style games. In fact, the original adventure game has\
    \ been ported to the iPod. It’s available for download at this book’s companion\
    \ Web site; click on the Hacking iPod link on the Extreme Tech Web site at www.wiley.com/computextreme.\
    \ Other folks are getting into the act, too. “*The Rise of the Lost*” is a new\
    \ notes-based iPod adventure game, available from XO Play at www.xoplay.com.\n\
    \n# Links to songs\n\nYour iPod is full of music, so it seems only natural that\
    \ Note Reader lets you construct notes that link to songs. Hyperlinks to songs\
    \ are a special kind of link, with following syntax:\n\n```\n`<a href=\"ipod:music?song=optimistic\"\
    >Big fish</a>`\n```\n\nThe “ipod:music” syntax tells the Note Reader that this\
    \ is a song and not a note. Unlike links to notes, there’s no folder hierarchy\
    \ to specify. Clicking a song link starts playing the"
  merge: -1
  img_proc: true
- pgno: 283
  md: 'song. You can use various other values, called *filters*, instead of “song”.
    Here’s the full set of available filters:


    +   - song

    +   - artist

    +   - album

    +   - playlist

    +   - genre

    +   - composer


    You can combine filters to distinguish between different songs with the same name:


    ```

    `<A HREF="ipod:music?song=Yesterday&artist=Bella Cooperman">Classic version</A>`

    ```


    If you use a link that matches more than one song, all the matches are combined
    into a groovy temporary playlist. With judicious use of filters in song links,
    you can create playlists that even iTunes would envy. For example, you can grab
    a subset of an artist’s music:


    ```

    `<a href="ipod:music?artist=Neil Young&genre=rock">Rock out</a>`

    ```


    Because playing a single song is the most common use of this kind of link, it
    has a special shortcut syntax:


    ```

    `<a href="song=Disappointing Show">Play it</a>`

    ```


    When you click a song link, the iPod normally starts playing the song and goes
    to the Now Playing screen. You can keep the note on screen instead by using the
    “Now Playing” element in the tag:


    ```

    `<A HREF="ipod:music?song=Trancey"&%NowPlaying=false">Listen</A>`

    ```


    ![](img/f481d8a0ca491080698039f72bf96e1b_283_0.png)


    > **Note** Due to a bug, the nowPlaying tag is ignored in iPod Software 2.1 and
    iPod Mini 1.0.


    # Tips and ideas


    +   - Try using song links to make your own *“Name That Tune”* game. Use AppleScript
    or another automated tool on your computer to select some songs, then build a
    note with links to the songs.

    +   - You can only specify one value for each filter, which means you can’t create
    a playlist that combines multiple artists or albums, unfortunately.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '+   See if you can construct a touch-tone generator with notes on your iPod.
    Get recordings of each of the tones a telephone can generate into iTunes. Then
    build a note containing numbers with links to their proper tones. For extra credit,
    read information from your iPod''s Contacts and dial their numbers.


    # ## Refferer notes


    Note Reader lets you create notes that hold no content of their own, but immediately
    open another note they point to. You can use this kind of note as a form of indirection.
    To do this, create a file that has one hyperlink in it, and give the file a name
    that ends in .link. When you open that file, you won''t see its contents—instead,
    the linked file will open immediately. For example, create the following file:


    ```

    <A HREF="camera"> </a>

    <TITLE>My birthday present</TITLE>

    ```


    Save the file as a note with the name mylist.link. Because the file ends with
    .link, when you select in the Notes folder, it will open the link it contains,
    which is the note called “camera”. We''ve also given the note a title, “My birthday
    present”, so that the “.link” name won''t appear in the Notes folder.


    The link can be to a song or playlist, too. If you link to music, the tunes will
    start playing when you open the note. This feature lets you create notes that
    play music as soon as they''re opened, without having to select links.


    Another Note Reader indirection trick lets you create a file that''s a list of
    links to other notes. If you give this file a name ending with .linx, Note Reader
    will display it as if it were a folder of links instead of a note of links. So,
    for example, create a note with the following text:


    ```

    <a href="Something Good">start</a>

    <a href="Anything Can Happen">middle</a>

    <a href="Trance Atlantic Flight">end</a>

    ```


    Save the note in a file named sample.linx. When you go to Notes, you won''t be
    able to open sample.linx directly. Instead, it will show up in Notes with an arrow
    after its name, as if it were a folder. Clicking the arrow shows the links in
    the folder, in the order they''re listed in the file. If you then pick one of
    the links, you''ll see the note it points to.


    As with .link files, you can fill your .linx notes with musical hyperlinks. When
    you select one of those, a song starts to play. You can even mix notes with songs
    in the same .linx file. Put a <TITLE> tag in the .linx folder to give it a different
    name when viewed in the Notes list.


    # ## Taking over the notes folder


    You can gain control of the Notes folder by creating a file of hyperlinks, naming
    it main.linx, and putting it into the main Notes folder. When you go to Notes
    on the iPod, it lists the links from main.linx and totally ignores anything else
    in the Notes'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'folder. You can even replace the word “Notes” that normally appears at the
    top of the screen by putting a <TITLE> tag in your main.linx file.


    # Take Complete Control of Your iPod


    You can go one step farther and have Note Reader take over your iPod completely,
    forcing the iPod to start up into Notes mode and providing no way out. To find
    out more about this awesome trick, see the Preferences section in this appendix.


    # Tips and ideas


    +   - Notes are alphabetized by title when you look at them on your iPod. Note
    Reader works this way in the Notes folder itself as well as any subfolder. But
    items in a .linx file appear in the same order in which they’re listed in the
    file, alphabetical or otherwise. So, you can use a .linx file to provide an alternate
    ordering for notes in a folder. This can be useful for lessons, narrative text
    in chunks, or any other files that you want to force into a particular order.


    # Preferences


    Note Reader defines preferences you can set by including preferences tags in your
    notes. You can set global preferences by including a file named “Preferences”
    or “Preferences.txt” in the Notes folder. Local preferences in the current note
    override corresponding global settings. You can set turn each preference setting
    on or off by setting it to “true” or “false”. Preferences tags look like this:


    ```

    <meta name="SomePreference" content="true">

    ```


    Here are the preferences you can set:


    +   - NotesOnly. This preference lets you take complete control of the iPod. When
    the iPod starts up, it checks to see if NotesOnly is true. If so, the iPod bypasses
    the startup screen and goes directly to Notes instead, and there is no way out.
    If you turn this setting on and add a main.linx file, you can effectively create
    a custom user interface based on notes. You can only set NotesOnly in the global
    preferences file, not in individual notes.


    # French Heritage


    This feature is nicknamed “museum mode” and reportedly was added to allow the
    Louvre in Paris to create an iPod-based audio tour.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'NowPlaying. When this is `true`, playing songs from Notes links will go to
    the Now Playing screen. Setting this to `false` will leave the note displayed
    when the music starts.


    > Due to a bug, the `nowPlaying` tag is ignored in iPod Software 2.1 and iPod
    mini 1.0.


    LineWrap. If this preference is `true`, Note Reader will ignore carriage returns
    in notes. Only `<P>` and `<BR>` tags will start a new line.


    ShowBodyOnly. This setting lets you put text in your notes that will never be
    displayed, such as comments. If this preference is `true`, only the text that
    lies between `<BODY>` and `</BODY>` tags is displayed. If those tags are not in
    the note, all the text is shown.


    HideAllTags. When this setting is `true`, text between the angle brackets is not
    displayed. This is useful for hiding stray HTML-style tags that aren''t implemented
    by Note Reader.


    The default value for `NowPlaying` is "`true`"; for all other preferences, the
    default is "`false`".


    In addition to setting preferences, you can add a "`<TITLE>`" tag to the preferences
    file to specify a name that will appear at the top of the Notes screen in place
    of the usual "Notes".


    If you put a `<SHOWPREFERENCES>` tag in any note, a list of the preferences and
    their settings will appear in its place when you look at the note.


    # # Error Checking


    When the iPod starts up, Note Reader scans all notes and checks them for various
    kinds of errors, including links to non-existent notes, syntax errors in tags,
    and other problems. If you open any note that includes an `<ERRORS>` tag, the
    list of all errors found is displayed instead of the contents of the note.


    > References to notes are checked to make sure the file actually exists, but links
    to songs are not checked.


    Because all errors for all notes are reported together, you only need one note
    with the `<ERRORS>` tag. Just create a note with this tag and save it with the
    name "Errors". You can then use that note to check for any problems.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Limits and Other Issues


    Each note can be up to 4Kb, and you can have up to 1,000 notes. Text beyond the
    4K limit is ignored, as are notes past the first 1,000. Note Reader scans and
    reads notes in the background when the iPod starts up, loading up to 64K of notes
    at a time. If you go directly to Notes, and you have a lot of Notes, you might
    have to wait while the Note Reader finishes its work. But if you use a different
    feature right after starting up, you probably won’t notice the iPod loading notes.


    # Path delimiters


    You can use slash, backslash, or colon interchangeably to show descending directory
    levels when referring to a file. Here are some examples:


    ```

    <a href="animals/dog">The dog goes woof</a>


    <A HREF="radio:genre:deep house">play</A>


    <a href="all\fewer/some\this one">Go for it</a>

    ```


    You can’t mix delimiters in a single file reference, so the following example
    will result in an error:


    ```

    <a href="mark/my:words\this one">Go for it</a>

    ```


    If a reference includes a file or directory that contains one of the delimiter
    characters in its filename, you should use a different delimiter when referring
    to it. For example, if a file- name includes a slash, use a colon or backslash
    as the delimiter. In the unlikely case of a file reference that includes all three
    delimiters, use a backslash before the delimiters as an “escape” character. For
    example, to link to a file named david/did\notes: your link would look like this:


    ```

    <A HREF="david\did\notes:\">Right here</A>

    ```


    Note that a file with all three delimiters is even more unlikely than you might
    imagine, because colons are not allowed in file names in either HFS Extended or
    FAT32, the only file systems supported by iPod software. So our hypothetical file
    david/did\notes: would have to exist in some future file system that’s neither
    HFS Extended nor FAT32.


    # Instructions tag


    Any files that include an <INSTRUCTIONS> tag will be listed in the Notes with
    the name Instructions, no matter what its filename. When you open one of these
    notes, instructions for using the Notes feature will be displayed instead of the
    file’s contents. The name “Instructions” and the contents are translated as appropriate
    to match the iPod’s current language setting.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Text encodings


    Note Reader supports various text encodings. If the iPod is set to use Japanese,
    Korean, or Chinese, Note Reader assumes notes are in the matching encoding. Otherwise,
    Note Reader assumes Latin-1 encoding on FAT32-formatted iPods and MacRoman on
    HFS-formatted iPods. You can tell Note Reader to use a non-default encoding for
    a file by including a tag like this:


    ```

    <?>xml encoding="MacJapanese" ?

    ```


    Note reader supports the following encodings:


    +   - Latin-1

    +   - MacRoman

    +   - MacJapanese

    +   - Korean

    +   - Simplified Chinese

    +   - Traditional Chinese

    +   - UTF8 Unicode

    +   - UTF16 Unicode


    If you have a note with an encoding tag, put the tag at the top of the file.


    # More Information


    To get the full official story on Note Reader, see Apple''s documentation, available
    at developer.apple.com/hardware/ipod. And if you create any Note Reader applications,
    let me know at hackingipod@papercar.com.'
  merge: -1
  img_proc: true
