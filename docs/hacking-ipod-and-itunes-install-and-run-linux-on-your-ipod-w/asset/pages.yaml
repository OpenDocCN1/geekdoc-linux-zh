- pgno: 110
  md: '# **Free Reading**


    You can track down lots of great, free reading material on the Web that''s available
    as text. One excellent source is the Internet Archive at *archive.org*. This fabulous
    site has thousands of freely available texts, mostly from books whose copyright
    has expired. You''ll find *Moby Dick*, *Alice in Wonderland*, *The Art of War*,
    and various bibles among the collection here. Although most of these texts are
    too long to fit into a single iPod note, Podtext automatically splits them up
    for you.


    # ## Read the United States Constitution


    When you visit the National Archives in Washington, D.C., you can see the documents
    known as the Charters of Freedom of the United States: the Declaration of Independence,
    the Constitution, and the Bill of Rights. These documents, now more than 200 years
    old, are preserved in containers filled with inert gas and covered with thick
    bulletproof glass. At night, the documents are sealed in a vault of reinforced
    concrete and steel weighing 55 tons. And while it''s important to protect the
    original editions of these documents, it''s no less important to note that you
    can have your very own copy of the U.S. Constitution stored on your iPod (Figure
    4-12).


    Thanks to the American Constitution Society, you can download the Constitution
    and put it into your iPod''s Notes folder. To get your iPod Constitution, go to
    www.acslaw.org/misc/iPoddl.htm and download it. Follow the instructions on the
    download page (which simply tell you to drag the files to the Notes folder on
    your iPod), and you have your Constitution. It''s not exactly a 55-ton vault,
    but it''s highly portable.


    Once you have the Constitution on your iPod, you can read it by looking under
    Notes on the iPod''s main screen, just as you do with all iPod notes. For more
    information on the Charters of Freedom exhibit, see the National Archives web
    site at www.archives.gov/national\_archives\_experience/charters.html.


    # ## Read Shakespeare''s Sonnets


    Sometimes, when I''m listening to speed metal disco country music on my iPod,
    I''m reminded of the old saying: “Betwixt mine eye and heart a league is took,
    and each doth good turns now unto the other; when that mine eye is famish''d for
    a look, or heart in love with sighs himself doth smother.” It''s then that I realize
    I have pressed the wrong button on my iPod and I''m looking at Shakespeare''s
    Sonnets.


    You can enjoy your own copy of Shakespeare''s Sonnets on your iPod. Just go to
    www.westering.com/ipod/ and download the zip file you''ll find there. When the
    zip file is decompressed, drag the folder into your iPod''s Notes folder. This
    will install all the sonnets on your iPod, where you can enjoy them at your leisure.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_111_0.png)


    FIGURE 4-12: Preamble to the Constitution.


    So, the next time you''re in the Apple Store and you covet that brand new, high-capacity
    iPod that you can''t afford, console yourself with this line from Sonnet 87 as
    you walk away:


    > Farewell! thou art too dear for my possessing.


    # ## Get News, Weather, Movie Listings and More


    **Note**  This hack works on Macintosh computers only.


    Pod2Go by Kevin Wojniak ([kainjow.com/pod2go/website/]) is a brilliant gem of
    a program for your iPod. iPod2Go grabs news and other information from the Internet
    and your Mac and copies it to your iPod. Then, when you''re on the train, sitting
    at lunch, or waiting for your bail bondsman to arrive, you can read what you''ve
    downloaded.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Pod2Go gets information in a bunch of categories: news, weather, movies, stock
    quotes, horoscopes, text, and driving directions. The news info comes in a format
    called RSS (Really Simple Syndication) that''s supported by thousands of Web sites.
    Pod2Go is preloaded with a long list of news sources you can sign up for, but
    you can add any RSS feed you want. Pod2Go works with any iPod. If you have a 3G
    iPod, Pod2Go will store information as iPod notes or contacts, your choice; on
    earlier iPods, Pod2Go uses contacts,


    Cross-Reference

    Although Pod2Go is Mac-only, Windows users can get some of the same news and weather
    information by using iPodSync, described in this chapter under Synchronize Your
    iPod with Microsoft Outlook.


    # Setting Your Sites


    If you have a favorite news site or Web log that''s not on the built-in list,
    the site still might provide a news feed that you can read with Pod2Go. To find
    out, go to the site and look for an icon reading "XML" or "RSS", or a link that
    says something like "Syndicate this site". Click the icon or link. You''ll go
    to a Web page that seems to be filled with gibberish text: that''s the RSS feed.
    Go to your browser''s address bar, select the URL, and copy it. Over in Pod2Go,
    on the News screen, click Custom Feed, select the "Enter URL" box at the top,
    and paste. Select a category and click OK, and Pod2Go will add your site''s RSS
    feed to your iPod for more fun reading.


    You can use Pod2Go to collect weather conditions and forecasts for any cities
    in the world. The method for finding cities is very flexible: just enter a city,
    state, country, or ZIP code, and Pod2Go will present you with a list of possible
    matches to choose from. You can add as many cities as you want, and they''re easy
    to remove from the list if you change your mind or move off-planet.


    Pod2Go''s movie feature gets showtimes for movie theatres in the U.S. and Canada.
    You just enter a city or ZIP code and Pod2Go grabs today''s listings from the
    Web and copies them to your iPod. This is great for those occasions when you find
    yourself in the car and looking for a movie to see on a whim (not applicable for
    people who have children). See Figure 4-13 to get an idea of what this looks like.


    If you always need to know the prices of your favorite stocks so you can evaluate
    your portfolio, use Pod2Go''s stock quote feature. However, this feature is less
    valuable than many of the others, because old stock quotes grow stale quickly
    after you download them to your iPod.


    Speaking of features and their value, Pod2Go can get your horoscope. You might
    not be interested in this, but if you plan your life by the stars, or you use
    horoscopes for amusement'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_113_0.png)


    FIGURE 4-13. Pod2Go provides a way to collect information from the Web, such as
    movie times, and copy it to your iPod. Courtesy of Pod2Go.


    purposes, you can enjoy reading the astrological advice and predictions for your
    birth sign and any others you care to download to your iPod.


    Pod2Go includes a really cool feature that lets you copy any text to a note on
    your iPod, including text from a Web page or Word document. Just click the “New
    from” button and point Pod2Go at a document on your hard disk, or type a URL.
    When you download a Web page like this, the iPod won’t display the page the way
