    mouse to the divider between any two columns. You''ll notice it changes to a telltale
    double-arrow doohickey. Click and drag to make the column bigger or smaller.


    You can also right-click a column header and choose Auto Size Column or Auto Size
    All Columns, but these options are less useful than they might seem. The Auto
    Size commands adjust the column to accommodate its longest item, which tends to
    make some columns, such as Song Name and Album, much wider than they need to be
    for most tracks.


    One more tweak: you can display sources and songs in two different font sizes.
    By default, iTunes uses the smaller size. If you find this display too tiny, try
    the bigger text. Go to Preferences, click the General tab, and change Source Text
    and Song Text to Large. See if you like it better that way.


    Be sure to check out the Equalizer column. This one is unique. When you add the
    Equalizer column, each song gets a little pop-up control that lets you choose
    its equalizer setting.'
