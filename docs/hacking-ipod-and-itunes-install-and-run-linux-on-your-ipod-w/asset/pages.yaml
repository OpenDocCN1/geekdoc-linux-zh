  md: '![](img/f481d8a0ca491080698039f72bf96e1b_231_0.png)


    FIGURE 9-2: The “Gap Between Songs” setting gives you some flexibility in burning
    audio CDs.


    You can use this setting to create CDs with no gaps between the tracks, but only
    in certain cases:


    +   * You joined the tracks on the CD before importing them.

    +   * You’re burning a CD from an uncompressed format (AIFF or WAV) rather than
    a compressed format (such as MP3 or AAC).


    Unfortunately, if you create a CD from MP3, you will always get a gap between
    the songs. The gap is still there even if you use the “none” setting in Burning
    preferences, although it’s tiny and almost imperceptible in many cases. The only
    way to ensure a gapless CD is to rip the CD with joined tracks, or in an uncompressed
    format (either AIFF or WAV).


