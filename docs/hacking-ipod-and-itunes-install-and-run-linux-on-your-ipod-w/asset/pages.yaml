- pgno: 224
  md: 'As you might expect, MTV provides free song downloads. The MTV site at www.mtv.com/music/downloads.


    Finally, when you''re in the mood to discover eclectic music that you haven''t
    heard before, try www.epitonic.com and www.peoplesounds.com. These sites collect
    music from hundreds of independent bands and provide songs for you to download.
    Check ''em out!


    # Live Music Is Better


    Many music fans take part in recording and trading live concerts. Without the
    band''s permission, this is illegal, and you shouldn''t do it. Some acts, such
    as Pearl Jam, try to head off this practice by producing huge numbers of live
    recordings. On the other hand, the Grateful Dead famously encourages taping and
    trading, as long as there''s no financial gain, and even sets aside seating areas
    for those recording their shows.


    # Summary


    The obvious ways to get songs into iTunes, ripping CDs and buying tunes from the
    iTunes Music Store, aren''t the only ways. In this chapter, we discussed lots
    of other sources for music. Take advantage of free songs on the Web, manipulate
    the tracks on CDs to get just the right format, and discover whole new kinds of
    music with streaming radio. The more time you spend looking for all the music
    that''s available to you, the more you''ll be rewarded by finding great tunes
    that you didn''t even know existed.


    Coming up next in Chapter 9, we''ll talk about cool things you can do to get music
    away from your computer and into the world at large. We''ll discuss burning CDs
    and DVDs full of music, dragging songs out of iTunes, and backing up your music.'
