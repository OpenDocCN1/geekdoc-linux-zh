- pgno: 298
  md: "# iTunes Library XML Format\n\n# Appendix D\n\n# Introduction\n\niTunes stores\
    \ its music library using a structured format called XML. This appendix provides\
    \ an overview of the iTunes library format.\n\nYou can find out where your Library\
    \ file is located by opening iTunes Preferences and going to the Advanced tab.\
    \ You can make a copy of your Library by choosing File ⇄ Export Library. Before\
    \ you fool around with your Library file, make sure to create a copy by using\
    \ this Export command.\n\nBecause XML files are just text, you can look at the\
    \ Library using any text editor, or you can use an XML editor, such as Property\
    \ List Editor in Mac OS X. Figure D-1 shows the first part of a Library file as\
    \ displayed by Internet Explorer 6 for Windows. Figure D-2 shows the same information\
    \ in Property List Editor on Mac OS X.\n\n# Header\n\nThe first few lines of the\
    \ Library provide information about the XML document type:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple\n  Computer//DTD\
    \ PLIST 1.0//EN\"\n  \"http://www.apple.com/DTDs/PropertyList-\n  1.0.dtd\">\n\
    <plist version=\"1.0\">\n```\n\nThe <!DOCTYPE statement includes a link to Apple's\
    \ document type definition (DTD) for its XML files.\n\nThe rest of the file is\
    \ enclosed in <dict> tags."
  merge: -1
  img_proc: true
