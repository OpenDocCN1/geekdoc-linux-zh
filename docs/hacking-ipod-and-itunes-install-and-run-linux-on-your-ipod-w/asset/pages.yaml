    # # Use WinAmp with Your iPod


    > Note  This hack is for Windows computers only.


    You probably know that iTunes is not the only music player in the universe. Other
    programs, such as MusicMatch Jukebox and WinAmp, are found on the hard disks of
    millions of happy users. When the iPod first appeared, there was no iTunes for
    Windows. Instead, Apple worked with MusicMatch to make MusicMatch Jukebox the
    official iPod software for Windows. Although that designation ended abruptly in
    October 2003, when Apple introduced the Windows version of iTunes, you''re still
    free to use MusicMatch with your iPod.


    The millions of WinAmp users, however, have not been so lucky. WinAmp was one
    of the first digital music applications, and it includes nifty features like games
    and skinnable looks. However, WinAmp didn''t provide support for the iPod. But
    in February 2004, Christophe Thibault released iPod Support Plug-in for WinAmp.
    This little bit of code allows WinAmp users to hook up their iPods and transfer
    music to them. When you install the iPod Support Plug-in, your iPod appears in
    WinAmp''s device list, as shown in Figure 2-13.


    The iPod Support Plug-in provides basic features, such as the ability to copy
    music to the iPod and to play music stored on the iBod while in WinAmp. But the
    plug-in lacks features that iTunes provides, most notably support for iTunes-managed
    playlists. Still, devoted fans of WinAmp can now stick with their favorite digital
    music program and manage music on their iPods.


    To download WinAmp, go to www.winamp.com/player/. The basic version of WinAmp
    is free—for $15, you get more features, including MP3 ripping and fast CD burning.
    The iPod Support Plug-in is free at www.winamp.com/plugins/ details.php?id=138888.


