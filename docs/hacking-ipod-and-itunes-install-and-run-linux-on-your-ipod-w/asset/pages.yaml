    out individual songs. Side 2 of The Beatles'' *Abbey Road* is basically one long
    composition. But when you rip a CD into iTunes, song-at-a-time is what you get.
    And, when you play songs back in iTunes, there’s a gap between songs that you
    can’t get rid of, unlike a CD, which flows smoothly even when switching from one
    track to the next. This gap, which is a consequence of the encoding process and
    has been around to annoy iTunes users since the beginning, messes up the flow
