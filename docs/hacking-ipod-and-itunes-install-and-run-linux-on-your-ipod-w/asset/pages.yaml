    # Use Apple''s iPod scripts


    ![](img/f481d8a0ca491080698039f72bf96e1b_59_1.png)


    Note This hack works on Macintosh computers only.


    Mac OS X includes a cool technology called AppleScript that lets you automate
    common tasks in programs. Scripts written in AppleScript are little programs that
    you run by picking them out of the script menu in iTunes and other applications.
    We''ll talk about AppleScript much more in Chapter 6, in the iTunes part of this
    book. But there are some nifty AppleScript features for iPods also, which is the
    focus of this section.


    Apple provides the iPod scripts on its AppleScript site at www.apple.com/applescript/
    ipod. To use these scripts, download them from that address and put them in the
    Scripts folder, using the following steps:


    +   1. In the Finder, open your Home directory. If you''re not sure how to do
    that, a foolproof technique is to choose Go $\square$ Home.

    +   2. In your Home directory, find the Library folder, and inside Library, find
    Scripts.

    +   3. Drag the scripts you downloaded into Scripts.


    Most of Apple''s iPod scripts perform cool tricks with Notes. Here''s a description
    of what the scripts do:


    +   ■ Eject iPod. No, it doesn''t make your iPod physically fly through the air—it
    just unmounts the iPod so you can disconnect it. This one is especially useful
    when you hook it up to a keyboard shortcut, which you can do with the Keyboard
    & Mouse panel in System Preferences.


    ![](img/f481d8a0ca491080698039f72bf96e1b_59_2.png)


    > Cross-Reference

    > To find out how to create keyboard shortcuts, see the section Turn On AppleScript
    in iTunes in Chapter 6.'
  merge: -1
  img_proc: true
- pgno: 60
