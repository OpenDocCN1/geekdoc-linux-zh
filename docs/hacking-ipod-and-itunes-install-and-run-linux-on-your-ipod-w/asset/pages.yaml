- pgno: 168
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_168_0.png)


    **FIGURE 6-5:** Choose from various formats for your library summary.


    If you want to look at the iTunes script folder, you can navigate to the Finder,
    find your Home directory, then drill down to the iTunes Scripts folder. But it''s
    much quicker to use the “Open Scripts folder” AppleScript in iTunes. This script
    will switch to the Finder and open the folder in a new window.


    You can use the “Play Random Track” script to quickly find and play any track
    from your library. Of course, you could achieve the same result by going to the
    library, closing your eyes, and double clicking somewhere in the song list, but
    the script is better, because when you click with your eyes closed, you might
