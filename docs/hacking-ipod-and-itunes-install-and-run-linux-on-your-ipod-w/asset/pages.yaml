- pgno: 147
  md: 'A playlist in iTunes is a list of songs that that get played together. The
    Library is like a special playlist, a master list of all the music on your computer
    that iTunes knows about. Playlists and the Library are simply *lists* of songs,
    not the songs themselves, which are stored in files on your hard disk. When you
    delete a tune from a playlist, it''s removed from that list—nothing happens to
    the song in the Library or the actual song file on the disk. When you delete a
    song from the Library, iTunes forgets all about it, which means it vanishes from
    any playlists it belongs to.


    Even when you delete a song from the Library, the actual file on disk that holds
    the song isn''t affected. However, when you delete a song from the Library, iTunes
    figures there''s a good chance you want to nuke the song file too. So, if you
    delete a tune from the Library, iTunes asks you if you want to trash the song
    file too. If you say yes, iTunes will put the file in the appropriate receptacle:
    the Trash (Mac) or the Recycle Bin (Windows).


    Here''s a shortcut you can use if you''re looking at songs in a playlist, not
    the Library, and you decide there''s a song you want to banish from iTunes entirely
    by removing it from the Library and all playlists. If you hold down Option (Mac)
    or Shift (Windows) and press Delete, iTunes deletes the song from the Library
    and all playlists automatically. iTunes then asks if you also want to delete the
    song file from your hard disk. Neat!


    # ## When iTunes Doesn''t Delete


    When you remove a tune from the Library, iTunes doesn''t always offer to delete
    the song''s file from the hard disk. Here''s why: iTunes has a default folder
    for the music it knows about. On the Mac, this folder is in your User directory
    at Music/iTunes/iTunes Music/, and on Windows, it''s located inside My Documents
    at My Music\iTunes\iTunes Music\. Not every song file in iTunes needs to be in
    this default folder. Any song file can be added to the iTunes Library, no matter
    what folder it''s in. If it''s in the default folder, iTunes assumes it owns the
    file, so it offers to delete the file when you remove it from the Library. If
    the file is not in the folder, iTunes figures it belongs to somebody else, so
    it shows good manners by not deleting it.


    iTunes has a setting that ensures it will put all the song files it knows about
    into its default folder. You can turn this feature on by going to Preferences,
    Advanced tab, and checking "Copy files to iTunes music folder when adding to library".
    After turning on this setting, new music will be copied to the default folder
    when it''s added to the Library. If you have tunes scattered around your hard
    disk and you want to unite them all in the default folder, choose Advanced \u2194
    Consolidate Library to bring them all home.


    If you like, you can move the default folder to another location. Just click Change
    on the Advanced tab and pick out your new location.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# # Change the Play Order


    In iTunes, every song knows its place—in the play order of playlists, that is.
    Every playlist maintains a play order for its songs. This is the default sequence
    in which the playlist’s tunes will be heard. Every playlist displays its play
    order in the first column of the song list. There’s no way to move or turn off
    the play order column—it’s guaranteed to be there. In this section, we’ll discuss
    how play order works and provide some ways to monkey around with it.


    # ## Play songs in a different order


    You can get around a playlist’s play order if you want to—Apple believes in freedom!
    The most obvious way is by turning on shuffle mode—when you do, play order isn’t
    used. Another way to play songs in a different order is to click one of the columns
    in the song list. For example, if you click the **Song Name** column and make
    sure shuffle mode is off, iTunes will play the tunes in alphabetical order. Click
    it again to sort the list from Z to A and get reverse alpha order (Figure 5-13).
    Click the Last Played column to hear songs that haven’t been played in a while.


    ![](img/f481d8a0ca491080698039f72bf96e1b_148_0.png)


    **FIGURE 5-13**: Click the selected column again to reverse the sort order.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '**Tip** iTunes provides lots of cool columns you can display in your playlists.
    To see them all, choose Edit View Options, or right-click (on the Mac, Control-click)
    the song list headers. Every playlist remembers which columns it shows. For an
    especially cool hack in this area, check out *Use a List Column for Equalizer
    Settings* in this chapter. And for more on song list columns, see *Fine-tune the
    Music Library’s Appearance* in Chapter 10.


    # ## Permanently change play order


    If you’re not happy with the play order of your playlist, there are a couple of
    ways to change it permanently. The direct way is by dragging and dropping songs
    around in the playlist: just grab the one you want to move, and put it where you
    want it to be. This works great, as long as you meet two conditions: the play
    order column must be selected, and shuffle play must be turned off. If either
    of these isn’t true, you can drag songs until your wrists ache, and you still
    won’t be able to change the play order. If you’ve successfully dragging songs
    to change the play order, iTunes will show you feedback as you move up and down
    the playlist, as shown in Figure 5-14.


    Another even slicker trick lets you change the default play order to match the
    current order. You can use this to adopt a shuffled order, time-length sequence,
    or any other order as the


    ![](img/f481d8a0ca491080698039f72bf96e1b_149_0.png)


    FIGURE 5-14: You can drag a song in a playlist to change the play order.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'permanant setting for the playlist. To adopt the current order as the default,
    right-click (or on the Mac, Control-click) on a song in the list, then choose
    “Copy to Play Order” from the menu. iTunes changes the playlist’s default play
    order to match the current order.


    # Hacking the Culture: Silence Is Golden


    Here’s a story about a different kind of song for your playlist: nothing. Macintosh
    is still Apple’s flagship product, despite the tremendous success of the iPod
    since it was introduced in 2001. As you probably know, Macs comprise a small minority
    of the computers used in homes, offices, and schools. iPod, however, is a different
    story: according to Steve Jobs’ keynote speech at Macworld Expo in January 2004,
    iPod is the most popular digital music player in the world, representing 31 percent
    of all sales. The iTunes Music Store is even more successful: in late 2003, Nielsen
    SoundScan reported that an amazing 80 percent of all online music is sold by Apple.


    Apple is the big cheese of digital music. So it shouldn’t be surprising that the
    company has to field the occasional wacky news story about its role in this emerging
    technology. In February 2004, the media picked up on the fact that among the tracks
    available for 99 cents at the iTunes Music Store are several that are nothing
    but silence. These include the aptly named “10 Seconds of Silence” by R-Three
    and “(Silence)” by Ciccone Youth. There’s even Slum Village’s “Silent”, a completely
    silent track that’s on iTunes in both “clean” and “explicit” versions. Although
    all the online music services have some silent tracks, apparently because the
    artists and labels simply delivered albums that include them, Apple got all the
    attention because it’s the leader. And it looks like all the attention embarrassed
    somebody: after the story was reported, most of the silent tracks were available
    only as part of an album—you couldn’t buy them individually for 99 cents anymore.


    # See Precise Playlist Statistics


    When you select the library or a playlist in the iTunes source list, iTunes displays
    vital statistics about that source at the bottom of the window: number of songs,
    elapsed time, and disk space consumed by the songs in the playlist. You can see
    an example in Figure 5-15.


    If you click the text in the statistics, the total time display changes from a
    decimal value to an exact count of days, hours, minutes, and seconds (Figure 5-16).
    This is a perfect feature for those of you who need to know exactly how long you
    can listen to your music before it starts to repeat.


    Click the text again to change the display back to the decimal value.


    ![](img/f481d8a0ca491080698039f72bf96e1b_150_0.png)


    FIGURE 5-15: iTunes displays statistics for every playlist.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_151_0.png)


    **FIGURE 5-16:** After you click the display, iTunes shows the precise total time
    of all the songs in the playlist combined.


    # ## Reset Play Counts


    iTunes keeps track of a play count for each song in its library, a running total
    of the number of times a song has been played. Whenever you play a song all the
    way through, its play count goes up by one. Playing it on your iPod counts, too:
    when you sync the iPod with your computer, the iPod tells the computer how many
    times the song was played, and the play count is adjusted accordingly.


    Play count is one of the most powerful variables you can use when building Smart
    Playlists. When you create a Smart Playlist that selects songs by most or least
    often played, iTunes uses play counts to determine which songs to pick.


    Sometimes it’s handy to be able to manipulate the play count directly. The easiest
    way to do this is to right-click (or control-click on a Mac) on a song and choose
    “Reset Play Count”. After a confirmation dialog box, iTunes returns the track’s
    play count to zero.


    This trick works just as well with multiple tracks. Select as many tunes as you
    want, then right-click any of them and choose “Reset Play Count”. They’ll all
    be reset to zero.


    A less convenient, but more powerful way to mess with play counts is via AppleScript.
    Every song has an AppleScript property named “played count” which is settable
    from a script. For an example of how this works, see the section *Change the Play
    Count* in Chapter 6.


    ![](img/f481d8a0ca491080698039f72bf96e1b_151_1.png)


    # ## Move Your Playlists to Another Computer


    On that happy day when you get a shiny new computer, you’ll probably want to take
    your tunes with you. It’s easy enough to move your music to the new computer:
    just copy the song files and use the “Add File to Library” command in iTunes to
    build up your new library. You can even use drag and drop folders and files of
    songs into the iTunes window, and they’ll be added automatically.


    But what about getting your playlists to make the move to the new computer with
    you? Moving playlists is slightly trickier, but still easy. You do it with a couple
    of steps and a few simple ground rules. First, here are the steps to take:'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_152_0.png)


    **FIGURE 5-17:** Use iTunes to export your playlists.


    +   1. In the source list, click the playlist you want to move to another computer.

    +   2. Choose File Export Song List.

    +   3. In the Save As dialog box, give the exported playlist a name, and choose
    “XML files” in the Save as Type box (see Figure 5-17).

    +   4. On the new computer, choose File Import. A new playlist is created with
    the same contents as on the old computer.


    When you move a playlist from one computer to another, you’re only moving the
    list of songs, not the songs themselves. If the songs exist in the iTunes library
    on the new computer, the playlist will find them and hook them into the playlist.


    How does the playlist connect with the songs on the new computer? It looks in
    the library for a song with the same title, artist, and album. If it finds a match
    in all three of those categories, it puts the song in the playlist. If any of
    those tags is different, the song isn’t added to the playlist. Note that other
    information, such as the song’s file name and what folder it’s in, aren’t considered
    here.


    Exporting and importing playlists even works across platforms, between Macs and
    Windows computers. It’s so nice when everybody gets along.


    If you import a playlist with songs that aren’t in the new computer’s library,
    iTunes will give you an error message (Figure 5-18). In this case, the playlist
    is created anyway, without the missing songs.'
  merge: -1
  img_proc: true
