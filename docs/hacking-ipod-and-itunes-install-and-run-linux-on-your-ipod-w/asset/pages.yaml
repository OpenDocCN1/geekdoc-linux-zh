    # ## Windows programs


    If you''re running Windows, you have it both better and worse than your Mac pals:
    better because you have more choices for recording programs, most of which have
    plenty of features; worse, because the programs all cost money, and none is as
    elegant and easy to use as WireTap. C''est la vie.


    SoundCapture from MagicSofts has a wacky user interface and documentation written
    in a language that''s not quite English, but it''s easy to use and creates MP3
    files directly, at various configurable quality settings. SoundCapture is free
    to try, and costs $10 to register.


    All Recorder is another utility for recording sounds your PC is playing, but does
    a lot of other stuff too. For example, All Recorder opens MP3 files directly and
    lets you edit sound files by selecting a hunk of sound and saving it to its own
    separate file. You can add effects like tremolo and reverb to files, or even play
    songs in reverse to check for satanic messages. (For a big fun example, play the
    introduction to "Fire On High" by Electric Light Orchestra in reverse.) There''s
    a free trial version of All Recorder that only records 30 seconds at a time. The
    full version is $30.


    Advanced MP3/WMA Recorder by Xaudio Tools, as its name implies, will create Windows
    Media Audio files as well as MP3s. It doesn''t have all the editing features of
    All Recorder, but its interface is clean and simple, and it seemed to produce
    fewer clicks and pops in its output. And hey, it''s skinnable! (That means you
    can change the way it looks, for those who missed the height of this nutty trend
    a few years ago.) The free trial version is limited to recording 60 seconds at
    a time, and the full version costs $30, which seems to be the going rate for tools
    like this on Windows. You can see Advanced MP3/WMA Recorder in Figure 8-9.


    ![](img/f481d8a0ca491080698039f72bf96e1b_214_0.png)


    FIGURE 8-9: Advanced MP3/WMA Recorder, which has a long, prosaic name, provides
    a clean interface that makes it look a lot like a mere music player.'
