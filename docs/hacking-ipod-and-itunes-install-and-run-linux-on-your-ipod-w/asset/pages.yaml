    For more information about this saga, see www.ipodhacks.com/article.php?sid=516.
    And if you want to look at the film itself, check out www.ipodsdirtysecret.com.


    # ## Summary


    It''s easy to spend hundreds of dollars accessorizing your iPod to make it more
    useful when you fly, in your car, or while you go for a run. But you can also
    be an iPod explorer just by messing around with the built-in diagnostic mode,
    a "feature" that comes free with every iPod. Diagnostic mode is a perfect iPod
    hack—it''s not particularly useful, but it''s pretty cool to show to your friends,
    especially when you get the iPod to start making those videogame noises.


    In our next chapter, we''ll continue to look at fun, weird, and occasionally useful
    tricks you can do with your iPod, this time focusing on software additions. Although
    Apple didn''t intend for the iPod to be a software development platform, a robust
    collection of programs has sprung up to help you get more from your iPod and your
    computer.'
