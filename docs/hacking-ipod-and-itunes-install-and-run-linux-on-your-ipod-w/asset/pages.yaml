  md: '![](img/f481d8a0ca491080698039f72bf96e1b_133_0.png)


    **FIGURE 5-1:** Several artists are selected, and all their albums are listed.


    then click. This adds the new artist (in technical-ese, it extends the selection)
    to those you have already chosen.


    +   5. After you have picked the artists you want, you’ll see their albums all
    agglomerated together in the album list on the right (see Figure 5-1).


    +   6. Again using the Command-Click (Mac) or Control-Click (Windows) method,
    pick the albums you want to hear from the album list at the right.


    +   7. Choose File ↴ New Playlist from Selection. You’ll get a new playlist (named
    “untitled playlist”) made out of your wacky album selections.


    Now your playlist is memorialized for all time, or at least for as long as your
    tastes run to that group of artists. And here’s a bonus: because it’s a full-fledged
    playlist, you can tell iTunes to sync it to your iPod.


    **Tip** You can also create a new playlist by dragging the selected items to the
    source list and dropping them there. For more on how that works, see the section
    *Drag and Drop to Create a Playlist* later in this chapter.'
