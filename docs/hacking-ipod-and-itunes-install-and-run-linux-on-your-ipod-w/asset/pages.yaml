  md: '![](img/f481d8a0ca491080698039f72bf96e1b_45_0.png)


    your photos to a computer is one solution, but you probably don''t want to drag
    a laptop around with you when you''re out taking pictures.


    To solve this problem, you can get various portable hard disk solutions for storing
    your photos. But you already have a portable hard disk with abundant space—it
    just happens to be a music player too. So the folks at Belkin have given your
    iPod yet another job: digital photo storage. All you need is a box to read the
    photos and move them to your iPod. Belkin offers two products that can help: Media
    Reader for iPod, shown in Figure 2-3, and Digital Camera Link for iPod (Figure
    2-4). I''ll describe both of them here.


    # **Belkin Media Reader for iPod**


    The Media Reader is a little bigger than a standard iPod and has slots for six
    different media types:


    +   - CompactFlash types 1 and 2

    +   - SmartMedia

    +   - Secure Digital (SD)

    +   - Memory Stick

    +   - Multimedia Card (MMC)


    If you have a digital camera, it almost certainly uses one of the media types
    accepted by the Belkin Media Reader. That''s one of the great features of this
    product: you don''t have'
