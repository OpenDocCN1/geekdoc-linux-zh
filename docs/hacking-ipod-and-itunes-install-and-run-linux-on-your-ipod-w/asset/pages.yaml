- pgno: 114
  md: '# # More than just information


    Pod2Go excels at collecting stuff from the Web and putting it on your iPod, but
    that’s not all it does. You can use Pod2Go to synchronize various information
    between your Mac and iPod, including your address book, iCal calendars, Stickies
    notes, and Safari bookmarks. But wait—isn’t that some of the work usually handled
    by Apple’s free iSync program? Yes, it is, but the idea here is that as long as
    you’re synchronizing info between your Mac and iPod with Pod2Go, it’s easier to
    handle with one program than with two. You’ll still need to run iSync if you want
    its additional features, such as synching with Mac or with other devices.


    When you connect your iPod to your Mac, iTunes starts up or comes to the front.
    With Pod2Go, you can set other applications to start up when the iPod is connected.


    Pod2Go comes with its own global menu, a tiny iPod that appears on the right side
    of the menu bar. You can use this menu for quick access to features including
    performing a sync, going to Pod2Go, or ejecting the iPod.


    Pod2Go is powerful, easy to use, and free. If you have a Mac and an iPod, you
    should have Pod2Go.


    ![](img/f481d8a0ca491080698039f72bf96e1b_114_0.png)


    Another quick way to eject the iPod is to control-click (or right-click) the iTunes
    icon in the dock, then choose Eject iPod (your iPod’s name will appear in place
    of “iPod”).


    # # Synchronize Your iPod with Microsoft Outlook


    ![](img/f481d8a0ca491080698039f72bf96e1b_114_1.png)


    This hack works on Windows computers only.


    Back in Chapter 2, I described the most basic ways of saving contacts and calendar
    items from Microsoft Outlook to your iPod (Use Contacts and Calendar with Microsoft
    Outlook). Those techniques are OK for transferring one or two items to your iPod,
    but if you’re really going to live the iPod dream of having a portable address
    book and calendar, you need automatic synchronization.


    Macintosh users get iSync, Address Book, and iCal, Apple’s free software for managing
    personal information and flowing it between the Mac and mobile devices. As a Windows
    user who runs Microsoft Outlook, what can you do? By adding some third-party software,
    you can have a synchronizing experience that rivals what Mac users get.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'In this section, we''ll take a look at a couple of inexpensive pro solutions,
    and one excel-lent free hack.


    # # PocketMac


    PocketMac iPod Edition (about $23 at www.pocketmac.net/products/pmipodmac/ ipodmac.html;
    free trial version available) beefs up the features of your iPod by connecting
    it to data from Microsoft Outlook and other programs on your Windows computer.
    PocketMac grabs contacts, calendar items, tasks, notes, and e-mail from Outlook,
    then moves them to your iPod. You can set PocketMac to fire up automatically whenever
    you connect your iPod, or you can give it a manual command when you want it to
    sync.


    When you install and run PocketMac, you see the main screen, as shown in Figure
    4-14. By clicking the button with a gear on it, you see the sync settings and
    choose which data you want automatically copied to your iPod.


    You can fine-tune exactly which data you want synchronized. For example, if you
    get a lot of e-mail and you don''t want to wait while it copies to your iPod,
    you can turn of e-mail sync. Along with the Outlook preferences, note that there
    are some other interesting settings:


    +   - If you check “Word Documents”, PocketMac iPod Edition will convert Word
    documents to iPod notes and file them in the Notes folder. If a document is too
    big to fit into a single note, PocketMac will split it into multiple notes and
    connect them together for convenient reading.


    ![](img/f481d8a0ca491080698039f72bf96e1b_115_0.png)


    FIGURE 4-14: PocketMac iPod Edition: main screen turn on.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_116_0.png)


    FIGURE 4-15: Outlook security access dialog box.


    +   If you sync Word documents, you can use the button in the lower-right corner,
    mysteriously labeled "…", to pick a folder. PocketMac then scans that folder for
    Word documents and copies those it finds.


    +   Click “Auto-Sync On Connect” to have PocketMac wake up and do its thing automatically
    whenever you connect your iPod. If you leave this box unchecked, you have to run
    PocketMac manually whenever you want to synchronize information from the computer
    to the iPod.


    When you run PocketMac, it latches onto your Outlook information and copies to
    your iPod. Outlook is smart enough to know that an alien program is trying to
    get access to its data. In fact, that''s been a favorite trick of viruses in recent
    years: they send e-mail to all your contacts as a way of spreading the virus.
    To help prevent this problem, Outlook puts up a warning message when PocketMac
    starts looking at your contacts (see Figure 4-15).


    When you see this message, you can decide whether you want to allow the access
    or not. In this case, you know the access to your data is OK, because you''re
    running PocketMac to sync. A good policy is to use the “Allow access for” pop-up
    list that grants permission for a fixed amount of time—10 minutes should be enough
    for PocketMac to do its work.


    Once PocketMac starts shipping files off to the iPod, you see one those familiar
    “flying documents” progress boxes (Figure 4-16). PocketMac helpfully puts the
    name of the contact, calendar event, document, or other data item in the progress
    box so you know just what''s going on.


    Eventually, the sync finishes and the PocketMac window says “Done”. When that
    happens, you can disconnect your iPod and walk away, knowing you''re taking the
    latest info from you computer along with you.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_117_0.png)


    # iPodSync


    iPodSync ($14 at `icnet.50megs.com/iPodSync`; free trial version available) is
    another tool for off-loading Outlook information to your iPod. iPodSync handles
    Outlook contacts, calendar items, tasks, and notes. Although iPodSync is a Windows
    program, its interface is, let’s say, strongly inspired by iSync, Apple’s Mac-only
    synchronizing program (see Figure 4-17).


    To get going with iPodSync, you click the icons for various kinds of data: contacts,
    calendar, and so on. You can tell iPodSync what to do with each data type, including
    not sync it at all. IPodSync provides options for each type that let you specify
    what you want in detail. For example, when you synchronize calendar events, you
    can decide whether to include events from the past or recurring appointments,
    as shown in Figure 4-18.


    ![](img/f481d8a0ca491080698039f72bf96e1b_117_1.png)'
