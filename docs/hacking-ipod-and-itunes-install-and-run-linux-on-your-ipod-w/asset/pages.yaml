    FIGURE 11-10: iTunes Link Maker produces HTML you can put on your pages.


    turns it into a celebrity playlist, just like Beyoncé and Burt Bacharach get to
    have. You can even make insightful or silly comments about each song, just like
    the pros. And because Celebrity Playlist Maker generates real links to music store
