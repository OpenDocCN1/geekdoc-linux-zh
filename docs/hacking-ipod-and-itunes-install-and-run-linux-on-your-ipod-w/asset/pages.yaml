    # Where Have All the Contacts Gone?


    Most of the information stored on your iPod is kept in simple, open formats. Contacts
    are stored in a standard format called vCard, then simply placed in the Contacts
    folder on the iPod. Similarly, Calendar entries on the iPod are files that use
    the standard iCalendar or vCalendar format, stored in the Calendar folder. Most
    address book and calendar programs, on both Mac OS X and Windows, can produce
    vCard, iCalendar, and vCalendar files. Once your data is in those formats, you
    can simply copy it to the right folder on your iPod and it will appear when you
    choose Contacts or Calendar.


    # Use Contacts and Calendar with Outlook


