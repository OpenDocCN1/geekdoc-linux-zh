- pgno: 160
  md: '# Get Album Art


    Fun with music is mainly about what you hear, but it''s also what you see: the
    physical package. Album art might not be the crucial reason you buy a CD, but
    it''s cool anyway. Unfortunately, album art has been diminishing over the past
    20 years or so, as music technology has progressed from LP to CD to digital. The
    smaller the box, the less room there is for cool album art. Digital music does
    away with the package entirely.


    When Apple opened the iTunes Music Store, it provided a small victory for lovers
    of album art: when you buy a song, you get an image of the album cover. You can
    display this picture in the lower left corner of the iTunes screen while the song
    is playing.


    That''s a great solution for music you buy at the iTunes store, but what about
    your zillions of CDs that you spent weeks ripping? You don''t get album art for
    those when you import them into iTunes.


    Although album art doesn''t appear automatically when you rip a CD, iTunes lets
    you copy an image from somewhere else and paste it into the album art space. The
    album art is out there on the Web, on sites like Amazon.com that sell music. Using
    this feature, clever folks have figured out a solution: programs that grab the
    art on the Web and put it into iTunes for you. There are at least a couple of
    programs that do this for Mac users. Although I couldn''t find one that runs on
    Windows, there is a Web-based tool that makes the process easier, if not fully
    automatic.


    # iTunes Catalog


    iTunes Catalog is a nifty program that makes getting album art effortless. When
    you run iTunes Catalog, it shows you all your playlists. You can then pick a playlist,
    or the whole music library, and ask iTunes Catalog to grab the art for the albums
    from Amazon, then copy the covers back to iTunes. The grabbing is quite fast—the
    copying to iTunes takes a little while.


    Getting album art is not even the prime function of iTunes Catalog. As the name
    suggests, its main feature is creating a catalog that lists all your albums and
    tunes. iTunes Catalog will make a PDF, text, or HTML file, and it will even publish
    directly to your .Mac site.


    iTunes Catalog costs $10, and you can download a free demo to see if you like
    it before buying. Find out more at http://www.kavasoft.com/iTunesCatalog.


    # Clutter


    Clutter is another cool iTunes pal for Mac OS X users. Clutter grabs album art
    for the song that iTunes is playing and displays it in its own “Now Playing” window.
    You can then'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'do cool things with the art, such as dragging it out into its own window, or
    copying it to iTunes. The clutter in Clutter happens after you play a bunch of
    albums and drag their covers into separate little windows. You can then double-click
    one of the windows to play the album, turning Clutter into a kind of visual interface
    to your music collection. Clutter will let you assign art to your playlists as
    well as to songs, and you can set Clutter to change its dock icon to show the
    art for the song that iTunes is currently playing, which is pretty cool. Clutter
    is free at http://www.sprote.com/clutter.


    # ## art4iTunes


    Windows users: although there''s no automated tool for grabbing art for all your
    songs at once, you can get some help from art4iTunes, a Web-based tool. To use
    art4iTunes, you start with the File Export Song List command in iTunes to make
    your playlist into an XML file. Then, you go to the art4iTunes Web site and point
    it at the XML file you just made. The site chews on your list for awhile, then
    constructs a Web page right there in the browser that includes album covers for
    all your songs. Of course, that leaves you with the tedious task of dragging the
    covers to iTunes, one at a time. But once you do, you''ll revel in seeing all
    those beautiful album covers once again.


    > > **Cross-Reference** For more on displaying album art in iTunes, check out
    Chapter 10, “See Album Art”.


    # # Summary


    Playing music is the most fundamental feature of iTunes, so it''s probably also
    the most well-developed. Take advantage of the nuances in the music playing features
    of iTunes, especially for playlists and streaming radio, to enhance your listening
    pleasure.


    Coming up next in Chapter 6, we''ll move beyond the melodic basics we covered
    here and into more advanced musical hackiness, including fun with the iTunes visualizer
    (it''s like iTunes for your eyes), cool scripts, and interesting helper applications.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# ## Extreme Music Playing


    n this chapter we’ll keep pushing iTunes in our quest to take control of all its
    features and to find more cool stuff for it to do. The stars of this chapter are
    AppleScript, Apple’s amazing user scripting system, and the Visualizer, the trippy
    visual effects system built into iTunes.


    AppleScript is a Macintosh-only technology, so there’s no way to take advantage
    of this feature in the Windows version of iTunes. In fact, the lack of AppleScript
    support is probably the most significant difference between the Mac and Windows
    versions. It’s unfortunate for Windows users, but there’s not really anything
    to be done about it.


    # ## AppleScript


    ![](img/f481d8a0ca491080698039f72bf96e1b_162_0.png)


    > Note | AppleScript only works on the Macintosh version of iTunes.


    One the most powerful features of Mac OS X (and previous versions of Mac OS before
    it) is a wonderful technology called AppleScript. According to Apple’s Web site,
    “AppleScript is an English-like language used to write script files that automate
    the actions of the computer and the applications that run on it.” Luckily for
    us music lovers, iTunes provides excellent support for AppleScript. Using cleverly
    written scripts, you can gain great mastery over iTunes and its functions. And
    the best part is that you don’t even have to write the clever scripts: they’re
    available in abundance, for free. Scripts can help you with hundreds of tasks,
    including finding song and artist information for your tracks, adding comments
    to many tracks at once, or cleaning out missing items from your library and playlists.


    AppleScript is practically a cult feature in Mac OS X, and it’s a rich source
    for hacking. AppleScript users can be fanatical in their support for the technology,
    while Apple itself often manages to send mixed


    # chapter 6


    # in this chapter


    +   - [ ] Turn On AppleScript in iTunes

    +   - [ ] Handle Duplicate Tracks

    +   - [ ] Fix Bad Tag Info

    +   - [ ] Make iTunes an Alarm Clock

    +   - [ ] Create Your Own Scripts

    +   - [ ] Master the Visualizer'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'messages by seeming to neglect the development and promotion of AppleScript
    at times. But a dedicated core of developers, evangelists, and fans, led by AppleScript
    Product Manager Sal Soghoian, keeps the community strong.


    # # Turn on AppleScript in iTunes


    To take advantage of scripts in iTunes, the first thing you have to do is enable
    AppleScript. This is a very easy task, as iTunes is all ready to support scripts.
    All you have to do is create a folder, then put the scripts in the folder and
    iTunes will find them. You''ll then find yourself knee-deep in AppleScript. Here
    are the precise steps:


    +   1. If iTunes is running, stop it: choose iTunes  Quit iTunes.

    +   2. In the Finder, open your Home directory. If you''re not sure how to do
    that, a fool-proof technique is to choose Go  Home.

    +   3. In your Home directory, find the Library folder, and inside Library, find
    iTunes.

    +   4. In the iTunes folder, choose File  New Folder. Rename the new folder "Scripts".
    You can also call it "scripts", or even "cRiPts" if you want to make a fashion
    statement. Spelling is important here, but case is not.

    +   5. Now you''re ready to install some scripts in the folder. For starters,
    you can go to http://www.apple.com/applescript/itunes and download Apple''s own
    script collection. Once you have downloaded the scripts, put them in your new
    Scripts folder.

    +   6. Run iTunes. You should see something new in the menu bar: a little scroll
    of paper icon representing the script menu that holds the scripts you just put
    in the folder (see Figure 6-1).


    ![](img/f481d8a0ca491080698039f72bf96e1b_163_0.png)


    > You must put scripts in the folder in order to enable AppleScript. If you run
    iTunes with an empty script folder, you won''t see the Scripts menu. Although
    you can move scripts into and out of the Scripts folder while iTunes is running,
    the contents of the Scripts menu won''t change until you quit and restart iTunes.


    Let''s take a quick tour of Apple''s scripts for iTunes. Some of the scripts are
    interesting, but they''re really more of a proof-of-concept exercise than a killer
    collection of the finest possible scripts you could ever want. Also, it''s instructive
    to note that these scripts haven''t been updated since the days of iTunes 2, more
    than 2 years ago, which reminds us that Apple sometimes forgets it has this great
    technology. Despite their age, the scripts work fine with iTunes 4.2, the current
    version as of this writing.


    ![](img/f481d8a0ca491080698039f72bf96e1b_163_1.png)


    > iTunes looks inside all subfolders within the Scripts folder and adds any scripts
    it finds to the Scripts menu. Because of this, you can''t organize your scripts
    inside subfolders the scripts are displayed in alphabetical order regardless of
    which subfolders they''re stored in.'
  merge: -1
  img_proc: true
