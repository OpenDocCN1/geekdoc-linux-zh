- pgno: 290
  md: '![](img/f481d8a0ca491080698039f72bf96e1b_290_0.png)


    ![](img/f481d8a0ca491080698039f72bf96e1b_290_1.png)


    # # Where to Find More Information


    iPods and iTunes are very popular, and as you might imagine, the Internet is filled
    with information about both. This appendix lists a bunch of the best sources of
    iPod knowledge.


    # ## General Information


    +   ■ iPodlounge (www.ipodlounge.com) is probably the most popular and informative
    site. News, forums, downloads, and the famous “iPods around the world” gallery
    are cool sections. You can buy an iPodlounge t-shirt here.


    +   ■ iPoding (www.ipoding.com) is another fun site filled with tips, discussions,
    and iPod stuff.


    +   ■ iPod Hacks (www.ipodhacks.com) is an iPod news and community site with a
    slight techno-geeky bent, which is always nice.


    +   ■ Meetup is a service for pushing folks away from their computers and into
    the real world, where they can get together in person. Find out about the iPod
    group at (ipod.meetup.com.)


    # ## iPod Accessories and Other Products


    +   ■ Dr. Bott LLC (www.drbott.com) has a great collection of must-have and wanna-have
    iPod gear for sale.


    +   ■ www.everythingipod.com sells stuff that ranges from color-coordinated iPod
    mini armbands to record-able CDs for iTunes.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '+   - Apple''s own online store carries a wide array of iPod accessories, and
    only the very best, of course. It''s at `apple.com/store`.

    +   - The big online retailers have plenty of iPod stuff as well. Search for iPod
    products at `shopping.yahoo.com`, `amazon.com`, and `froogle.com`.


    # ## Scripting, Programming, and Hacks


    +   - Doug''s AppleScripts for iTunes (`www.malcolmadams.com/itunes`) is indispensable
    for Mac iPod users who want to enhance their iTunes and iPod experiences.

    +   - Explore the surprising depth and power of smart playlists at `smartplaylists.com`.
    Here you can find hints on making the most of your smart playlists and trade ideas
    with other iTunes fanatics.

    +   - Visit `developer.apple.com/hardware/ipod` for advanced technical information
    on the iPod, including drawings and measurements to help you make cases and other
    accessories.

    +   - If you''re interested in programming your own plug-ins for the iTunes Visualizer,
    you''ll need to visit `developer.apple.com/sdk/#iTunes` to get the tools and info.

    +   - When you want to look for new shareware and utility programs for your iPod
    and iTunes, surf on over to `download.com`, `versiontracker.com`, and `macupdate.com`.
    These sites keep track of new software and provide links for downloading.


    # ## Apple and iPod News and Rumors


    Apple gets a lot of press, especially now that it makes the world''s most popular
    digital music player. There are many Web sites that deal in Apple news and rumors:


    +   - Sources of Apple news include TidBITS (`www.tidbits.com`), MacNN (`www.macnn.com`),
    Mactintouch (`www.mactintouch.com`), and MacMinute (`www.macminute.com`). Read
    them every day before breakfast.

    +   - For nerdier news and spirited discussions, see MacSlash (`macslash.org`)
    and SlashDot (`slashdot.org`).

    +   - Many news sites allow you to create customized news by using queries or
    RSS feeds. For tons of iPod and iTunes news, try this at Wired (`wired.com`),
    Google News (`news.google.com`), CNET (`news.search.com`), and Yahoo News (`search.news.yahoo.com`).'
  merge: -1
  img_proc: true
- pgno: 292
  md: '+   * Get your salt shaker and check out *Apple rumor sites*, which are sometimes
    right but always fun, including *SpyMac* (www.spy mac.com), *Mac Rumors* (macrumors
    .com), *Think Secret* (thinksecret.com), and the aptly named *Crazy Apple Rumors*
    (www.crazyapplrumors.com).


    # ## Official Apple Information


    Go to the source for the definitive information.


    +   * Visit ipod.com and itunes.com for the latest word from Apple on our favorite
    products.


    +   * See www.apple.com/support/ipod to find out how to keep your iPod healthy,
    or make it better when it''s not working well.


    +   * Subscribe to RSS feeds from the iTunes Music Store by visiting www.apple.com/rss.


    +   * In the unlikely, unhappy event your iPod needs service, visit www.apple.com/support/ipod/service
    to find out what you must do.


    # ## Everything Else


    For new iPod and iTunes links, and for corrections and additions to this book,
    visit the book''s companion Web site. Just go to the Extreme Tech Web site at
    www.wiley.com/ compbooks/extremetech and click on the link to the *Hacking iPod*
    site.'
