- pgno: 89
  md: 'Once you''ve improved your transmitter, you can use your iPod as a tiny radio
    station. Engadget suggests several semi-joking uses for this, including broadcasting
    silence at your hard-rocking neighbor, playing gentle ocean waves over the eardrum-destroying
    car next to you at a red light, and taking over wireless receivers used by people
    exercising at the gym to listen to TV broadcasts.


    Because FM adapters broadcast on specific frequencies, the tricky part of this
    hack is figuring out which frequency your intended victim is tuned to. For that
    reason, this hack probably works best when you try it on your friends and family.
    That would also be a good strategy for avoiding lawsuits and fistfights that might
    otherwise result.


    # Power your iPod in the car


    You''ll need a power source if you''re going road tripping with your iPod. Some
    of the FM adapters listed earlier (iCarPlay and TransPod) charge your iPod while
    you''re playing music. In addition to those, here are a few of the better iPod
    chargers available:


    +   PowerPod from Griffin Technology (`www.griffintechnology.com`) is cool because
    it works with all generations of iPods. Griffin pulls this trick by making the
    iPod-to-charger cable separate from the charger part that plugs into the 12v socket.
    PowerPod costs about $20.


    +   SiK makes the imp, a $30 charger with a replaceable fuse and line level audio
    output. Check it out at `www.sik.com`.


    +   Dr. Bott''s Auto Charger for iPod costs $25 and comes with a SendStation PocketDock
    so that it can connect to any iPod. This model includes a replaceable fuse. See
    `www.drbott.com` to examine it in more detail.


    # Get the ultimate iPod car kit


    The ICE-Link from Dension USA, which was a big hit at Macworld Expo in January
    2004, allows your iPod to take the place of a CD changer in your car stereo. Your
    iPod plays when you select CD as the input source. If you have one of those cool
    controls that lets you select tracks from your steering wheel, ICE-Link makes
    it work with your iPod. When you select a different input, such as radio, the
    iPod pauses. ICE-Link includes mounting hardware and power and audio cables.


    ICE-Link is custom fitted to various car models and costs about $200. For more
    information, visit `icelink.densionusa.com`.'
