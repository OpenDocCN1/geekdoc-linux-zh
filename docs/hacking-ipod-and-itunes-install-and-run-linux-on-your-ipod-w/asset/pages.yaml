    # Hear sounds from the iPod speaker


    Grab your iPod and take a good look at it. See the speaker? No, of course you
    don''t. The speaker is well-hidden, apparently near the FireWire or dock connector,
    because that''s where the sound seems to emanate from. The iPod doesn''t play
    music through its internal speaker. It''s limited to clicks, pops, and other gadget-type
    noises the iPod has to make during its usual duties. Even when you have headphones
    or an external speaker connected, these sounds come out of the internal speaker.
    Just for fun, here''s a list of the standard sounds you''ll hear from the iPod
    speaker:


    +   - *Clicks*—When you move the wheel, you hear a click. You can turn this off
    by going to Settings \| Clciker.

    +   - *More clicks*—Pressing a button also produces a click from the built-in
    speaker. If you have Settings \| Clicker turned off, this won''t make a sound
    either.

    +   - *Buzzes*—When you plug your 3G iPod or mini into its dock, you have certainly
    noticed the electronic buzzer noise that tells you it''s connected.

    +   - *Beeps*—If you turn on your iPod''s alarm clock feature and you don''t have
    an external speaker or headphones attached (it''s unlikely you would be sleeping
    with headphones),'
