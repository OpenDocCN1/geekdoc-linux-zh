  md: "# The AR Utility 215\n\nSo far we have shown the use of the ar command from\
    \ the command line, but you can also run this command as part of a makefile so\
    \ that an archive of the object files of a software product is created after the\
    \ executable file has been created. Doing so allows future use of any general-purpose\
    \ object modules (one or more functions in these modules) created as part of the\
    \ software. You would put an archiving command in the make list for a target to\
    \ be invoked as an argument of make, such as we have done for 'bundle' in the\
    \ makefile.\n\nTo show the use of an ar command in a makefile, we enhance the\
    \ makefile from 10.2.5 so that the compute.o and input.o modules are appended\
    \ to the libmath.a library if the make bundle command is executed after the final\
    \ executable has been built. The following session shows the resultant makefile\
    \ and sample runs of the make command, first to create the executable and second\
    \ to create the archive.\n\n$ more makefile\n# Updated makefile that uses some\
    \ built-in macros\n# @-ceded commands. It also archives some of the\n# newly generated\
    \ object modules in a library.\n\n```\nCC = gcc\nOPTIONS = -03\nOBJECTS = main.o\
    \ input.o compute.o\nSOURCES = main.c input.c compute.c\nHEADERS = main.h input.h\
    \ compute.h\nARCHIVE = compute.o input.o\nLIBRARY = libmath.a\nAR_KEYS = qv\n\n\
    complete: power\n  @echo \"The build is complete\"\npower: $(OBJECTS)\n  $(CC)\
    \ $(OPTIONS) -o $ $ ^ -lm\n  @echo \"The executable is in the 'power' file.\"\n\
    \  @echo\nmain.o: main.h input.h compute.h\ncompute.o: compute.o\ninput.o: input.h\n\
    bundle: @echo \"Archiving object modules ...\"\n  ar $(AR_KEYS) $(LIBRARY) $(ARCHIVE)\n\
    \  @echo\n  @echo \"Archiving is complete.\"\n  @echo\n\npower.tar: makefile $(HEADERS)\
    \ $(SOURCES)\n```"
