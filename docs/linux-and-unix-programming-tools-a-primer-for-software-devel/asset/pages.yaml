  md: 'You can invoke any event from the history list by using the history expansion
    feature of the Bash and TC shells. The ! allows you to specify an event designator
    for the command to be invoked from the history list. Table 1.3 describes the three
    most commonly used event designators. With the history list shown above, typing
    !! will execute the history command. Tiping !gcc and hitting <Enter> will invoke
    the gcc -o lab1 lab5.c -lpthread command. You can also invoke the first gcc command
    by typing !2 and hitting <Enter>.


    # 1.6.12 DISPLAYING A COMMAND


    The command to display a calendar for a year or a month is cal. A brief description
    of the command follows. The optimal parameter can be between 1 and 12, and year
    can be from 0 to 9999. If any argument is specified, the command displays the
    calendar for the current month of the current year. If only one parameter is specified,
    it is taken as the year. The cal 3 2003 command displays the calendar for March
    2003. Note that the cal 3 command displays the calendar for year 3 and not for
    March of the year. The command cal 1991 displays the calendar for the year 1991,
    the yearUX operating system was born.


    # 1.6.13 DISPLAYING SYSTEM UP


    You can use the uptime command to display system up time (the duration of time
    the system has been running since it was last booted) and some other useful statistics,
    such as the number of users logged onto the system. The command doesn''t require
    any parameters. The following example shows the output of the command.


    $ uptime

    2:30pm up 37 day(s), 5:51, load average: 0.09, 0.10, 0.24

    $


    A recent study involving more than 2,400 LINUX machines (http://counter.li.org/reports/uptimes.php)
    shows that the average up time for a LINUX machine is more than 38 days. The same
    study found one LINUX-based machine that had been running for more than three
    years without crashing! We encourage you to browse the counter.li.com Web for
    many interesting statistics on the use of LINUX.


    | Table 1.3 Commonly Used Event Designators for History Expansion |

    | Event Designator | Meaning | Example |

    | --- | --- | --- |

    | !N | Reinvote the event in the !14 command and line N in the history list |
    The command at line 4 in the history list |

    | !! | Reinvote the event in the previous !!1 command | The last command that
    you executed |

    | !string | Reinvote the event in the most recent !1 command starting with "string"
    | The most recent command starting with the string (most likely the last or more
    command) |'
