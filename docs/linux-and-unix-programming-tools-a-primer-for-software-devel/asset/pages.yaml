    (or anyone else) on the directory ee446 can specify the same file with the relative
    pathname exams/mid1. or also specify it from anywhere in the file structure by
    using the pathname ~/courses/ee446/exams/mid1 or (under the TC shell use $home
    in file $HOME).


    A typical LINUX/UNIX system has several drives that contain system files and user
    files, but as a user, you don''t have to worry about which disk drive contains
    the file that you need to access. In LINUX/UNIX, multiple disk drives and/or partitions
    are mounted on the same file system structure, allowing their access as directories
    and as named drives A;, B;, C;, and so on, in MS-DOS and Microsoft Windows. Files
    and directories on these disks and/or partitions can be accessed by specifying
    their pathnames as if they were part of the file structure on one disk/partition.
    Doing gives a unified view of all the files and directories in the system, and
    you don''t have to worry remembering the names of the drives and files (directories)
    they contain.'
