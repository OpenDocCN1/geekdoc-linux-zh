    **Purpose:** Compare file1 file2 by line and display the differences between them
    as a series of commands that can be used to convert file1 or vice versa. Read
    from standard if is used for file1 or file2


    In the following example, we use the **diff** command to first compare file1 with
    itself and compare file with file2. The first **diff** command does not produce
    any output because the files compared are the same. The second **diff** command
    compares file1 with file2 and produces an output that contains an instruction,
    `l1`, followed by the first line in the first file and the first line in the second
    file. This instructs you to change the first line of file1 to the first line of
    file2 to make them the same files.


    ```

    $ cat file1

