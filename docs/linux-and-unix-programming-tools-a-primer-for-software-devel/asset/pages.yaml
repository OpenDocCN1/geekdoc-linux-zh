    When you log on and your login shell is Bash, Bash first executes commands in
    the /etc/profile file, if this file exists. It then searches for the ~/.bash_profile,
    ~/.bash_login, or ~/.profile, in this order, and executes commands in the first
    of these that is found and is readable. When a login Bash exits, it executes commands
    in the ~/.bash_logout file.


    When you start an interactive Bash shell, it executes commands in the ~/.bashrc
    file, if this file exists and is readable. When started noninteractively to run
    a shell script, Bash looks for the environment variable BASH_ENV to find out the
    name of the file to be executed.


    If your shell is a TC sh, it executes commands in the /etc/csh or /etc/csh file,
    if it exists and is readable. A login shell then executes commands in the /etc/csh.login
    file, if it exists. Every shell (or non-login) executes commands in the ~/.tcsh
    file if the ~/.tcsh does not exist, followed by reading the ~/.history file. A
    login shell executes commands in the /login and ~/.login files, if they exist
    and When a login TC shell executes commands in the /etc/csh.login and ~/.login
    shows the names of important startup files and when they are executed.


