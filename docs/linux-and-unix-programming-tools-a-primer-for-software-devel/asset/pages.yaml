    # 2.6.11 Appending to Files


    Appending to a file places new data at the end of the named file. If the file
    does not exist, it is created to contain the new data. The append operation is
    useful when an application or a user needs to aug-ment file by adding data to
    it.


    The >> operator is the append operator in LINUX and UNIX. You can use it according
    to the following-syntax for appending files at the end of a file.


    cat [file-list] >> destination

    Purpose: Append files in ''file-list'' at the end of ''destination''; without
    ''file-list,'' standard output is used


    The cat sample >> temp command appends the contents of sample at the end of temp.
    You can append multiple files to a file, in cat memo1 memo2 memo3 >> memos.record.
    This command appends the contents of the memo1, memo2, and memo3 files to be used
    at the end of the memos.record file.

