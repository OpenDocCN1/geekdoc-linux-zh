  md: '# 13.3.1 STEPS FOR USING gprof


    Before we discuss any example in detail, we outline the procedure for using gprof
    to generate the execution profile of a program. You can use the following steps
    to profile your program with gprof.


    +   1. Get your program to work correctly. Remember that you profile a program
    to identify bottle-necks in it and to improve its performance, and not to debug
    it.

    2. Compile your program for profiling using the -pg (or -p) option of the compiler
    command (e.g., gcc or g++).

    3. Run your program as it means to be run and let it terminate normally; terminating
    with <Ctrl-C or the kill command terminates abnormally. If the program terminates
    normally, it will cause the profiling information to be generated and stored in
    the gmon.out file in a format that gprof understands.

    4. Run the gprof command like gprof executable [data-file]. If the profile data
    is in the gmon.out file, you don''t need to specify any data file in the command
    line. Since the output of the gprof command is all text, it can be viewed by any
    LINUX or UNIX text editor or with commands like cat, more, or less.

    5. Study the output of the gprof command,—the profile of your program—to identify
    the bottlecks in your program.


    The following shows the compilation of the gprofexample.c program, its execution
    to generate the gmon.out file, and the execution of the gprof command to save
    or display the profiling information. We''ve used the -b option with the gprof
    command in order to keep the output short. Without this option, every term used
    in the output is clearly described as part of the output. The terms and their
    meaning are described in Table 13.2.


    ```

    $ gcc -pg gprofexample.c -o gprofexample

    [ program output ]

    $ ls -l gmon.out

    -rw------- 1 sarwar 152 35 Mar 17 12:24 gmon.out

    $ gprof gprofexample > gprofexample.profile

    $ gprof -b- gprofexample | more

    ```


