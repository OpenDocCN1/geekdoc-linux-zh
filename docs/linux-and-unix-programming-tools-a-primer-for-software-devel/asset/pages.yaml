  md: '# Glossary


    **Shell Script** A program consisting of shell commands.


    **Shell Variable** A memory location that is given a name, which can then be used
    to read or write the memory location.


    **Signal** See Software Interrupt.


    **Single Stopping** A feature in symbolic debugging that allows you to stop program
    execution after every instruction execution. The next instruction is executed
    by using a command. This is sometimes called tracing program execution.


    **Software Cost Models** Empirical formulae allow you to use direct metrics and
    estimate the cost of a software system in terms of its duration and effort.


    **Software Interrupt** An interrupt (event) sent to a process as a software interrupt,
    and known as a signal in LINUX/UNIX jargon.


    **Software Life Cycle** A sequence of phases that are to be followed to develop
    a product. Some popular software cycles are the waterfall and the spiral model.


    **Software Metrics** Software metrics are used to determine software product properties
    such as the number of lines of code (LOC), size of the executable, software structure,
    time taken for testing, total number of defects found in the product, number of
    defects found per hour, the number of function points (FPs) or object points (OPs)
    for your software, and the running time of the program. Some of the metrics are
    measured directly (direct metrics) and are derived (indirect metrics). Direct
    Metrics and Indirect Metrics.


    **Software Profiling** Determining certain parameters of your program when it
    executes. These parameters include the most time-consuming segment of the program,
    the execution frequency of each line (or function), and the function call graph.
    (See Function Call Graph.) The purpose of software profiling is to identify the
    segments in a program where the program spends most of its time when it executes.
    Information allows to enhance the performance


    m of your program by optimizing the code that executes frequently.


    **Source Repository** The directory that contains the source code for a project
    that you want to manage by using a revision control system as CVS.


    **Special Targets** Predefined targets in the utility that are treated by it in
    a special way. For example, the special target, PHONY allows you to select a target
    that is not a file. This target allows you to instruct to invoke a sequence of
    commands from the makefile if a file with the name of the target exists in your
    build directory.


    **SpecialDevice File** A special file represents a device such as a keyboard.
    Files are divided into two types: character special files and block special files.
    See Character Special Files and Block Special Files.


    **Spiral Model** A software engineering life cycle typically used for an organization''s
    internal, large projects.


    **Stack Frame** When a function is called, many items such as actual parameters,
    local variables, and return address, are pushed on the stack for proper execution
    of the function and return from it. These items comprise the stack frame (also
    known as activation record) for the function call.


    **Standard Dependency** The capability of the utility to recognize the name of
    an object file is usually the name of the source file.


    **Standard Error** See Standard Files.


    **Standard Files** The files where the input of a process comes from, and where
    its output and error messages go to. The standard file where a process reads its
    input is standard input, and the process output goes to standard output, and the
    error messages generated by a process go to standard error. By default, the standard
    input comes from your keyboard, and standard output and standard error are sent
    to the display screen.'
