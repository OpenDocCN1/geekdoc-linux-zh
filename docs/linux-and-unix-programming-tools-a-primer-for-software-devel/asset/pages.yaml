  md: '# # Glossary


    +   **ADT** See Abstract Data Type.

    **Absolute Pathname** A pathname that starts with the root directory. See Pathname.

    **Access Permissions** See Access Rights.

    **Access Privileges** See Access Rights.

    **Access Rights** The type of operations that a user can perform on a file. In
    LINUX, access rights for a file can be read, write, and execute. The execution
    permission for a directory means permission to search the directory. The owner
    of a file dictates who can access the file for various types of file operations.

    **Abstract Data Type** A mathematical model for representing data along operations
    on it. Some of the ADTs are stack, queue, linked list, hash table, and tree.

    **Activation Record** See Stack Frame.

    **Archive** A collection of files contained in a single file in certain format.

    **Assembler** A program that takes a program in assembly language as input and
    translates it into object code.

    **Assembly Language** A low-level programming language.


    +   **Black Box Testing** During black box testing, the software is tested against
    its requirements. The test cases are, therefore, drawn up based on the requirements
    document.

    **Block-Oriented Devices** A device, such as a disk drive, that performs I/O in
    terms of blocks of data (e.g., in 512-byte chunks). Also see Cluster.

    **Block Special Files** The files that correspond to block-oriented devices. (See
    Block-Oriented Devices). These files are located in the /dev directory.

    **Break Point** A program statement where the execution of the program stops while
    using a symbolic debugger as gdb.

    **Bss** A UNIX term for the uninitialized segment of a process.

    **Build** The step used to create the executable file for software.

    **Build Directory** The directory that contains the software code and the associated
    makefile.

    **Build-and-Fix Model** A software engineering life cycle that involves no planning
    or design (e.g., a software life cycle used by many students for coursework related
    programming exercises).


    +   **Background** When a process executes in a way that does not relinquish the
    control of the keyboard


    +   **CVS** Concurrent Version Systems.

    **Call Graph** A graph (profile information) that shows the relationships between
    the caller and called functions and the frequency of execution of every function.

    **Character-Oriented Devices** The devices, such as a keyboard, that perform I/O
    in terms of one at a time.

    **Character Special Files** The UNIX files that correspond to character-oriented
    devices. These files are located in the /dev directory.

    **Class** A feature in object-oriented languages that allows you to implement
    abstract data types. An instantiation of a class is called an object.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Glossary


    **Code Coverage** During white box testing, test inputs are chosen to invoke as
    many program statements as possible. The percentage of program statements that
    can be invoked during this phase of testing is called code coverage.


    **Job** The job (process) that is presently being executed by the CPU.


    **Code Generation Phase** A software engineering life cycle phase during which
    the source and executable codes are created.


    **Daemon** A system process executing in the background to provide a service such
    as Web browsing. In a typical LINUX system, the lpd daemon provides the Web browsing
    service, and fingerd provides the finger service.


    **Code Inspection** Describing the program source, line by line, to a software
    quality assurance with the intent of identifying interface faults between functions
    and modules.


    **Data-Oriented Programming Paradigm** A programming paradigm in which the focus
    is on objects that contain data and operations (i.e., methods) associated with
    data.


    **Command Interpreter** A computer program that starts when the computer system
    is turned on, or a user logs in. Its purpose is to capture user commands and execute
    them. In LINUX, this is also known as a shell.


    **Debugger** A software tool that allows you to debug software. Debugging


    **Command Mode** A mode of which the editor under it accepts editor commands.


    **Debugging** Identifying the causes of problems in a program as it runs.


    **Compiled Languages** Programs in a compiled language must be translated into
    machine code before they can be executed. See Language.


    **Direct Metrics** Metrics that can be measured directly as lines of code (LOC),
    size of the executable, time taken for testing, time taken by the programmer to
    complete a module or product, and running time for a program.


    **Compiler** A program that takes a written in a high-level language and translates
    it into an assembly language program. Almost all C and C++ compilers also perform
    the tasks of processing, assembly, and linking by default.


    **Directory** A container that allows you to store any type of file, including
    directories, under them. Directories are also known as folders.


    **Concurrent Systems** A popular front end for RCS that has many features that
    RCS does not have, such as concurrent file checkpoints without locking the file.


    **Directory Entry** The file name and inode number in a LINUX/UNIX system. The
    inode allows access to an operating system kernel data structure that contains
    the file''s attributes, including its location on disk. See Inode.


    **Conflict Resolution** CVS allows multiple users to check out for editing and
    when users check their versions, the final version will be the result of proper
    merging of the files checked by the different users.


    **Dot File** See Hidden File.

    **Dotted Decimal Notation (DNN)** The notation in which the 32-bit IPv4 addresses
    are, for example, 192.140.30.10.


    **CPU Scheduling** A mechanism that is used to multiplex a CPU in a computer system
    among processes. This results in all processes making equal progress and increases
    utilization of hardware resources in the system.


    **Dynamic Analysis** The analysis of software as it executes. The analysis includes
    debugging, tracing, and performance monitoring of the software, including it against
    requirements.


    **Dynamic Linking** With dynamic linking, every library call is replaced by a
    small piece of code, whose execution causes the control to transfer to the code
    for the library call.


    **Current Directory** See Present Working'
  merge: -1
  pgno: 345
