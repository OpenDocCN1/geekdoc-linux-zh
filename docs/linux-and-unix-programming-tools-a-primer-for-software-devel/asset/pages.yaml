  md: '# 14.3 CONCURRENT VERSIONS SYSTEM (CVS)


    The Concurrent Versions System is the LINUX and UNIX tool of choice for version
    control in a multip, multirectory environment. It allows you to perform many tasks
    that either cannot be performed or are tedious to perform with RCS. The following
    are some of the salient features of CVS.


    +   1. It allows you to organize your sources in a framework of directory hierarchy,
    using a module, and check out the module for modification.


    +   2. It allows multiple software developers in a team to check out and modify
    source modules currently. Under RCS, file modification operations are serialized
    by allowing only one developer to check out a file for editing (the file "locked"
    by this developer); others can check out this file for read-only. CVS allows multiple
    developers to modify a file concurrently and guarantees conflict resolution without
    loss of changes to the file.


    +   3. It allows you to tag a release symbolically and check out this version
    at any time during the development and maintenance phases of the software by using
    this tag. It also allows you to check out a copy of any previous software release,
    regardless of the current state of the software. You can also check out a software
    release for a particular date.


    We describe some of the basic features of CVS in this section.


    # 14.3.1 The CVS Command Syntax


    You need to use the cvs to interact with CVS. This utility is invoked with different
    commands to perform the tasks involved in software version control. While CVS
    has a wealth of commands that you can use to perform many chores related to version
    control, we will focus on the basic commands that are commonly used in practice.
    The following is a brief description of the cvs command.


    | | cvs [cvs-options] command [command-options-and-arguments] |

    |---||

    | Purpose: | This allows you to invoke features of CVS for performing various
    tasks related to software version control |

    | Commonly Used Options / Features: |

    |-H [cvs-command] | Display usage information for ''cvs-command''; if ''cvs-command''
    is not specified, display a brief description of the cvs command |

    |-d CVS-root-dir | Use ''CVS-root-dir'' as the absolute path for the source repository;
    overriding the setting of the environment variable CVSROOT |

    |-e editor | Use ''editor'' to revise log information; overriding the settings
    of the environment variables CVSEDITOR and EDITOR and the default editor, vi |

    |-n | Attempt to execute the given cvs command but not make any changes; just
    issue reports Trace program execution and the sequence of cvs activities that
    take place for the execution of a cvs command; useful for understanding the semantics
    of cvs commands |'
