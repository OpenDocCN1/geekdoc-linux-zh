    Actions as suspending processes, moving them from the foreground to the background
    and vice versa, displaying their status, interrupting them via signals, and terminating
    them are known as job control, and LINUX/UNIX has a set of commands that allow
    these actions. Foreground processes can be moved to the background by suspending
    them by pressing Ctrl-Z, followed by executing the bg command. Background processes
    can be moved to the foreground using the fg command. Commands that are suspended
    or running in the background are also known as jobs. The jobs command can be used
    to view the status of all jobs. A foreground process can be terminated by pressing
    Ctrl-C. The suspend command can be used to suspend the current shell process.


    The kill command can terminate a process using its PID or job ID. The command
    can be used to send various types of signals, software interrupts, to processes.
    Upon receipt of any signal exception, a process can take the default (kernel-defined)
    action, take a user-defined action, or ignore the signal. No process can ignore
    the kill, which has been put in place by the LINUX designers to make sure that
    every process running on a system can be terminated. Bash and TC shell preserve
    the background processes when you log out.


    The ultimate command is used to display many process and file attributes, including
