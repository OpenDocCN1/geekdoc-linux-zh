    software engineering.


    # 13.3 PROFILING C/C++ PROGRAMS


    At times you may find that your C/C++ program doesn''t run as fast as you expect.
    If you know how long a program spends in each function when it executes and it
    spends most of its time, you will know which part of the program you should make
    more efficient. The 80-20 rule says that a program spends 80% of its time executing
    20% of the code. Software profiling allows you to identify this 20% of the code
    so that you don''t waste time. Halving the execution time of this 20% of the code
    makes your program 40% faster, whereas halving the execution time of the rest
    of the code makes your program 10% faster!


    You can use the LINUX and UNIX tool gprof to display an execution profile of your
    program in terms of the functions used, the call graph, the frequency of calls
    to functions, and percentage of the total execution time taken by each function.
    The gprof tool is quite effective in identifying'
