    command. Thus the tar format also results in less copying time and reduced work
    by the customer, who uses only one get (or mget) command (an ftp command) versus
    several sequences of directory hierarchies to be downloaded.


    Because the sizes of software packages are increasing, owing to their graphical
    interfaces and multimedia formats, archives are compressed before they are put
    on ftp sites. The users of the soft-ware need to uncompress the downloaded before
    restoring them.


    Let''s consider a file, tcsh-6.06.tar.Z, that was downloaded from an ftp site.
    In order to restore this file, we need to uncompress and untar it, as shown in
