    # 2.6.8 Moving and Renaming Files


    Files can be moved from one directory in a file structure to another with the
    mv command. This operation in LINUX or UNIX may result in renaming a file if the
    source and destination are on the same file system. A file system is a directory
    hierarchy with its root rooted on a disk or disk partition, mounted (glued) to
    a directory. The files and directories in the file system are accessed through
    the directory under which they are mounted.


    You must write and execute permissions to the directory that contains the existing
    file, but you do not need read, write, or execute permission to the file itself.
    Similarly, you must have write and execute permissions for every directory in
    the pathname of the target file, and write permission to the file if it already
    exists. If the destination file exists, by default it is overwritten without informing
    you. If you use -1 option, you are prompted before the destination file is overwritten.


    The mv temp.moved command in the session that follows moves temp to temp.moved.
    In this case the temp file is renamed temp.moved. An error message is reported
    if temp does not exist, or if you do not have write or execute permission for
