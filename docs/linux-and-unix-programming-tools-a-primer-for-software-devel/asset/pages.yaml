- img_proc: true
  md: '# Summary 249


    against all possible inputs to ensure 100% working of your program under all circumstances.
    A program against all possible inputs is neither possible nor necessary—not possible
    because, depending on the number of inputs, the testing process may take an outrageously
    long time, and not necessary because some (or most) tests may be similar to others.
    To clarify this point, let''s assume that you have a program square that takes
    a positive integer as input and produces its square as output. Assuming an integer
    to be 32 bits wide, in order to fully test the program, you need to test it 4
    billion (2^32) possible input values! The good news is that testing the square
    against just a few inputs (in example, a few on the two boundaries and a few in
    the range) is sufficient. A popular technique that allows you to choose a representative
    set of black-box test cases is known as equivalence class testing.


    There are many tools that allow you to automate software testing. One such tool
    for UNIX and LINUX platforms is DeJGNU. Browse the Web page for reference 8 in
    Table 12.2 for information on this tool.


