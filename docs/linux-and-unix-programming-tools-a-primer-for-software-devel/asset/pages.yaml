- img_proc: true
  md: '# 6.1 INTRODUCTION


    A process is a program in execution. The LINUX script creates a process every
    time you run an external command. The process is removed from the system when
    the command finishes its execution. Process creation and termination is the only
    mechanism used by the LINUX/Unix system to execute external commands. In a typical
    time-sharing system such as LINUX/UNIX, which allows multiple users to use a computer
    and run multiple processes, hundreds of thousands of processes are created and
    terminated every day. The system runs several of these processes simultaneously.
    In LINUX and UNIX, processes can run in the background or foreground. A background
    process runs at lower priority and allows you to use shell while the process runs.
    Because a background process runs at a lower priority, a command that takes a
    long time to finish is a good candidate for background execution.


    The shell executes commands creating child processes using the fork and exec system
    calls. When a process uses the fork system call, the LINUX/UNIX kernel creates
    an exact main memory image of the process. An internal command is executed by
    the shell itself. An external binary command is executed by the child overwriting
    itself by the code of the command via an exec call. For an external command comprising
    a shell script, the child shell executes the commands in the script file by one.


    We discuss the following process-related topics and operations and their associated
    commands in this chapter.


    +   - the processes, jobs, and daemons in LINUX/UNIX

    - displaying process attributes

    - foreground, background, and suspended processes

    - displaying jobs

    - switching processes between foreground and background

    - suspending processes

    - suspending and resuming a shell process

    - terminating processes

    - running processes sequentially and simultaneously

    - LINUX/UNIX process hierarchy


    # 6.2 PROCESSES, JOBS, AND DAEMONS


    When you type a command and hit <Enter>, the shell executes the command. When
    the command is fully processed (i.e., done), the shell returns by displaying the
    shell prompt. While your command executes, you don''t have access to your shell
    and therefore cannot execute any other commands until the current command finishes
    and the shell returns. When commands execute in this manner, we say that they
    execute in the foreground. When a command executes in the foreground, it keeps
    control of the keyboard. You can have only one process in a console window (on
    a window-based system) or terminal (on a non-window-based system).


    You can suspend a foreground process by pressing <Ctrl-Z>. This returns control
    to your shell process. You can run a command in the background by ending the command
    with an ampersand (&).'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Process and Job Control 121


    The background execution of a command allows you to use the shell while the command
    executes. A suspended or background process is also known as a **job**.


    In the following session, the first find command executes in foreground. Until
    the command finishes, you don''t get the shell prompt and cannot use the shell
    for work. The second find command runs in the background and allows you to use
    the shell as it runs. The value in brackets returned by the shell is the job number
    (or job ID) for the process and the other number is 1 and its process identifier
    (PID). So, the job number for the command in the session is 1 and its ID 23467.


    ```

    $ find / -name foo -print > foo.paths 2> /dev/null\n wait until the command finishes
    execution /

    $ find / -name foo -print foo.paths 2> /dev/null &\n[1] 23467

    ```


    Although any background process can be called a daemon. Daemons in LINUX and UNIX
    jargon daemon is a system process in the background. Daemons are frequently used
    in LINUX/UNIX to provide various types of services to users and handle system
    administration tasks. For example, the e-mail, telnet, Web browsing, and finger
    services are provided via daemons. The printing services are provided by the printer
    daemon, lpd. The finger service is handled by the finger daemon, fingerd. The
    e-mail service is provided by the smtp daemon. The Web-browsing is handled by
    the httpd and the telnet service is provided by telnetd. The inetd, commonly known
    as LINUX/UNIX supervise, handles various services by spawning various daemons
    at system boot time. Access the /etc/inetd.conf file to view the services that
    are offered by this daemon on your system. It has one line for every service that
    inetd offers.


    Multiple processes are executed on a system with a single CPU (or with more processes
    than the number of CPUs) running a time-sharing system as LINUX or UNIX by multiplexing
    the CPU time (i.e., allowing a process to use the CPU briefly and switching it
    to another process). The LINUX/UNIX kernel code that performs this task is known
    as the CPU scheduler.


    # 6.3 PROCESS AND JOB CONTROL


    The LINUX/UNIX kernel is responsible for several activities related to process
    and job management, including process creation, process termination, running processes
    in the foreground and background, suspending processes, maintaining process status,
    and switching processes from foreground to background and vice versa. As LINUX/UNIX
    you can request these process and job control tasks by using the shell commands
    discussed in this section.


    # 6.3.1 DISPLAYING PROCESS ATTRIBUTES


    Every LINUX/UNIX process has several attributes, including process ID (PID), process
    ID of the parent (PPID), process name, process state (running, suspended, swapped,
    zombie, etc.), the terminal process was executed on, the length of time the process
    has run, and process priority. The ps command can be used to display these attributes.'
