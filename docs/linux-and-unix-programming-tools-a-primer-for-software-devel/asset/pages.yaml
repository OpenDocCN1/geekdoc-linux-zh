    # 5.3 SPECIAL ACCESS BITS


    In addition to the nine commonly used access bits described in this chapter (read,
    write, and execute for user, group, and others), three additional bits are of
    special significance. These bits are known as the set-user-ID (SUID) bit, set-group-ID
    (SGID) bit, and sticky bit.


    # 5.3.1 The Set-User-ID (SUID) Bit


    We''ve previously shown that the external shell commands have corresponding files
    that contain binary executable codes or shell scripts. The programs contained
    in these files are not special in any way in terms of their ability to perform
    their tasks. Normally, when a command executes, it does so'
