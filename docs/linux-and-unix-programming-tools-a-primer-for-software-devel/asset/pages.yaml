  md: '# Table 5.3 Examples of the chmod Command and Their Purposes


    | Command | Purpose |

    |---|---|

    | chmod 700 * | Set access privileges for all the files (including directories)
    in the current directory to read, write, and execute for the owner and no privileges
    to anyone else |

    | chmod 700 - | Set access privileges for the home directory to read, write, and
    execute for the owner and no privileges for anyone else (The authors use this
    command for their home directories; they do not trust anyone when it comes to
    security of their files, and they stop everyone at the main gate.) |

    | chmod 740 courses | Set access privileges for courses to read, write, and execute
    for the owner and read-only for the group; noacess for others |

    | chmod 751 ~/courses | Set access privileges for ~/courses to read, write, and
    execute for the owner, read and search, for the group; search-only for others
    |

    | chmod 755 ~/labs | Set access privileges for ~/labs directory to read, write,
    and execute for the owner |

    | chmod u=rw courses | Set owner''s access privileges to read, write, and execute
    for courses and keeps the group''s and others'' privileges at their present values
    |

    | chmod uga-rw sample | Don''t let anyone read or write sample chmod a+x sample
    everyone else |

    | chmod a-rw sample | Make sample''s group privileges match its user''s (owner''s)
    privileges |

    | chmod a+x sample | Let everyone execute sample |

    | chmod go= sample | Remove all access privileges for the group and others for
    sample |


    The chmod command and their purposes are listed in Table 5.3. Recall that the
    following permission means search for directories.


    ```

    $ cd

    $ ls -l

    drwxr-x---- 2 sarwar faculty 512 Apr 23 09:37 courses

    -rwxrxr-wx 1 sarwar faculty 12 May 01 13:22 labs

