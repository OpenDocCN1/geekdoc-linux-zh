  md: '# 2.6.17 SEARCHING FILES


    LINUX and UNIX have powerful utilities for file searching that allow you to find
    lines in text files that contain a particular expression, string, or pattern.
    For example, if you have a large file that contains the records for a company''s
    employees, one per line, you may want to search the file for lines containing
    information on John Johnsen. The utilities that allow file searching are grep,
    egrep, and fgrep. The following is a brief description of these utilities.


    ```

    grep [options] pattern [file-list]

    egrep [options] [string] [file-list]

    fgrep [options] [expression] [file-list]

    ```


