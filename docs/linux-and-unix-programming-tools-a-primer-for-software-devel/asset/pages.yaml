    # 1.6.11 The Command History


    The commands (also called events) that you type at your terminal are saved in
    a history list. The environment variable HISTSIZE can be set to a number to specify
    the number of commands to save in the history list. The default value is 500.


    You can manipulate the history list using the built-in command history, as shown
    in the following-session. The command output shows four commands or events in
    the history list.


    ```

    1 10:40 ps

    2 10:43 gcc -o lab lab1.c -lmm

    3 10:43 more /etc/profile

    4 10:51 gcc -o lab lab5.c -lpthreads

    5 11:01 echo ~kuhn

    6 11:01 history

    $

