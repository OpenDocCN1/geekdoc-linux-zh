  md: '# 36 Chapter 2 Files and File Processing


    /OPT

    /opt directory is used to install add-on software packages. The programs to be
    invoked by the users for a package should be located in the /opt/package_name/bin
    directory, where package_name is the name of the installed package. The manual
    pages for the package are located in the /opt/package_name/man directory.


    /PROC

    /proc directory contains process and system information.


    /ROOT

    The /root directory is used on many LINUX systems as the home directory of the
    root account. This directory is completely protected from normal users.


    /BIN

    The directories /bin, /usr/bin, and /usr/local/bin contain system administration
    tools, utilities, and general root-only commands. Some of the general root-only
    commands in /bin are getty, init, update, mkswap, swapon, swapoff. The commands
    for halting the system are halt, re-boot, and shutdown. The utilities for file
    system management are: fdisk, fsck, fsck.ext2, fsck.minix, mkfs, mkfs.ext2, mkfs.minix,
    mkfs.mdos, and mkfs.vfat. The minimum set of networking commands in /bin is ifconfig
    and route.


    /TMP

    Used by several commands and applications, the /tmp directory contains temporary
    files. You can use this directory for your own temporary files. All the files
    in it are deleted periodically so that the disk (or a partition of disk) does
    not get filled with temporary files. A file in the /tmp directory is set by the
    system administrator and varies from system to system, but is usually only a few
    minutes. On most systems the sticky bit is set for /tmp so only the owner can
    remove a file in it.


    /USR

    The /usr directory contains one of the largest sections of the LINUX/UN file system.
    It contains read-only data that can be shared between various hosts. On most LINUX
    systems, /usr contains subdirectories: X11R6, bin, doc, games, include, lib, local,
    man, sbin, src, and tmp. Table 2.1 gives a brief description of what these directories
    contain.


    /VAR

    The /var directory is used to contain the variable data (the data keeps changing
    while the system is running). This data is maintained in several subdirectories
    but the discussion of most of the subdirectories is beyond the scope of this book.
    One of these directories is /var/spool/mail, which contains your incoming mail.
    When you read new mail, it comes from a file in this directory set to contain
    your incoming mail. Once you read the mail, it is put in a file in your home directory
    called mbox.'
