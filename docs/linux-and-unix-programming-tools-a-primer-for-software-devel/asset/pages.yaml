    # 8.6 COMPILING C, C++, AND JAVA PROGRAMS


    The translation of C and C++ programs goes through a preprocessing stage before
    it is compiled. The preprocessor** performs several operations on the source program
    before the modified source program is given to the compiler. Some of the main
    tasks performed by the preprocessor are #include directive


    +   * Inserting the files specified with the #include directive

    * Expanding macros (specified with the #define directive)

    * Processing conditional compilation specified with the #if directive

    * Handling continuation concatenation (for C only).


    The continuation line feature allows you to break a statement into multiple lines
    by terminating partial statements with a backslash at the end of a line, and new
    characters. When the preprocessor encounters a backslash at the next line, it
    removes the backslash and new line characters and concatenates the line with the
    next line. This feature is used in multiline preprocessor directives in C because
    they terminate with a new line character.


    Figure 8.4 outlines the compilation process for C and C++ programs. The entire
    translation is carried out by a single compiler command. After the executable
    code has been generated and stored in a file by the compiler, it can be executed
    by typing the file name (and any program arguments) in a command line (or clicking
    the icon for the executable in a GUI system). We discuss various LINUX and UNIX
    compilers in Chapter 9. The compilers and interpreters for various languages are
    located in /usr/bin directory.


    ![](img/62803a90ad1a923bf070a7b5e2ffbb05_172_1.png)


    **Figure 8.4** The process of translating C and C++ programs into executable code'
  merge: -1
