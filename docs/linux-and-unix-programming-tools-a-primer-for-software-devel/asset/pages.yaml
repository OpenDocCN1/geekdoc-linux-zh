    # 14.2.3 Checking Out an RCS File


    The co utility is used to check out a file and store it in the corresponding working
    file. The following is a brief description of the utility.


    | Syntax: | co[options] file-list |

    | --- | --- |

    | **Purpose:** | This utility allows checking out of files in ''file-list'' from
    the corresponding RCS history file, and storing them in the corresponding working
    files. |

    | **Commonly used options/features:** | |

    | -l | Check out a file for editing in locked mode |

    | -r | Check out ''ver'' of the specified file |

