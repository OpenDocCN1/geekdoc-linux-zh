    ### ETC/PASSWD

    The /etc/passwd file contains one line for every user on the system and describes
    that user is. Each line has seven fields, separated by commas. The following is
    the format of the line.

    login_name:dummy_or_encrypted_password:user_ID:group_ID:home_directory:login_shell


    The login_name is the login name by which the user is known to the system and
    is what the user types to login. The dummy_or_encrypted_password field contains
    the password x (*) or encrypted version of the password. If passwords are stored
    in /etc/passwd, then the encrypted passwords are stored in /etc/shadow. The user_ID
    is an integer between 0 and 65535 assigned to the user, 0 is assigned to the superuser
    and 1–99 are reserved. The group_ID identifies the group the user belongs to,
    and is also an integer between 0 and 65535-99. The user_info field contains information
    about the user, typically the user''s full name. The home_directory field contains
    the absolute pathname for the user''s home directory. The last field, login_shell,
    contains the absolute'
