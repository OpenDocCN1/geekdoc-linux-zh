  md: '# Process Hierarchy in LINUX/UNIX


    In the first case, signal number 15 is sent to processes with PIDs 1845 and 1850.
    In the second, signal number 2 (<Ctrl-C>) is sent to a process with PID 1851.
    In both cases, if the signal numbers are not intercepted, processes are terminated.
    In the third case, a.out process (process ID 1837) ignores signal numbers 2 (<Ctrl-C>)
    and 15 (software signal) and we use the kill -9 1837 command to terminate it.
    After executing the kill command, you can use the ps command to ensure that the
    process has terminated.


    Process ID 0 can be used to refer to all the processes created during the current
    login. Thus the kill -9 command terminates all processes from the current login
    (i.e., all processes in your current session) and logs you out. The kill command
    also works with job numbers; job numbers are preceded by the % character.


    Most modern shells, including Bash and Tesh, preserve the background processes
    when you log out. This means when a shell terminates, all its children processes
    keep running.


    When the parent of a process terminates, its children zombie processes when they
    exit. The zombie processes are finished for all processes and don''t reside in
    the main memory, but they still have some resources allocated to them and can''t
    be taken out of the system. Zombie processes are, therefore, unwanted. All zombies
    (and their children) are eventually adopted by the "grandaddy", the init process,
    which removes them from the system. In general, any dying process is to be in
    the zombie state.


