  md: '# 9.1 INTRODUCTION


    The code development process comprises three phases: code generation, static analysis,
    and dynamic analysis. The code generation phase consists of creating source code
    and generating the executable code for it. Hence, it involves tools for editing
    text files, indenting the source code properly, compiling the source code, compiling
    module-based software, creating libraries, managing the source code, and controlling
    revisions. The static analysis phase consists of verifying the source code for
    portability and measuring source code metrics (e.g., the structure of the source
    code, its size in lines of code, and number of function points). The dynamic analysis
    phase comprises debugging, testing, and monitoring the performance of the software,
    including it against product requirements. In this and the remaining chapters
    of the book, we discuss the LINUX and UNIX tools needed during a typical software
    development process.


    In this chapter, we discuss the LINUX and UNIX tools for creating program files,
    indenting the source code, and compiling C, C++, and Java source files to generate
    executable files. We also discuss important features of the C/C++ compilers.


    # 9.2 GENERATING PROGRAM SOURCE FILES


    Any text editor can be used to generate program source files. The most frequently
    used LINUX and UNIX editors are vi, emacs, and nano. Although not a native LINUX
    text editor, pico is also a fairly popular editor on LINUX and UNIX computers,
    especially among the student community. We discuss LINUX and UNIX text editors
    briefly in Appendix A.


    # 9.3 INDENTING SOURCE CODE


    Proper indentation of source code is an important part of good coding practice,
    primarily because it enhances the readability of the code. The best known indentation
    style for C was proposed by Brian Kernigh and Dennis Ritchie The C Programming
    Language, the first book on the C language. This style is commonly known as the
    K&R (for Kernighan and Ritchie) indentation style. Most programmers who do not
    work in C arent unfamiliar with this style. You can use the LINUX indent command
    indent a C code properly. The following is a brief description of this command.


    ```

    indent [options] [input-files]

    indent [options][single-input-file] [-o output-file]

    ```


    Purpose: This command reads a syntactically correct program specified in ''input-file'',
    indents it according to some commonly accepted C program structure by inserting
    or deleting spaces, and saves the formatted program in ''output-file'' if ''output-file''
