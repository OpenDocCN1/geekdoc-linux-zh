  md: '# gcc [options] file-list (continued)


    Commonly Used Options / Features:


    | Option | Description |

    | --- | --- |

    | -ansi | Enforce ANSI conformance |

    | -C | Suppress the linking phase and keep object files (with .o extension) |

    | -Dmacro=[dfn] | Define ''macro'' to ''dfn''. Without the optional definition
    part, define ''macro'' to be string 1 |

    | -E | Stop after the preprocessing stage and send the preprocessed file to stdout
    |

    | -g | Create symbol table, profiling, and debugging inform for use with the gdb
    (GNU Debugger) |

    | -llib | Link to the ''lib'' library |

    | -mconfig | Optimize code for ''config'' CPU can specify a wide variety of CPUs,
    including Intel 8036, 80486, Motorola 68K series, RS6000, and MIPS processors
    |

    | -o file | Create executable file, instead of the default file a.out |

    | -O[level] | Optimize. You can specify 0-3 as ''level'', the higher the level
    of optimization is. |

    | -pg | Provide profile information to be used with the profiling tool gprof |

    | -S | Do not assemble or link the .c files and leave assembly versions in corresponding
    files with the .s extension |

    | -v | Verbose mode: display commands as they are invoked |

    | -W | Give extra and more verbose warnings |


    The gcc command can be used with or without options; the order in which options
    are specified in the command line is not important. We describe some basic options
    here and some in the later sections of this chapter. One of the options commonly
    used, even by beginners, is -o for output. You can use this option to inform gcc
    that it should store the executable in a particular file instead of the default
    a.out file. This means that with the -o option you can store multiple executable
    files for the same or different source programs. It is important to realize that
    the name of the file to contain executable code must follow the -o option, otherwise
    whatever file name follows this option will be overwritten!'
