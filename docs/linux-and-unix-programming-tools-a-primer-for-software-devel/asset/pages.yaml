    The -z option of the GNU version of the tar utility can be used to generate the
    compressed version of the tar archive. This can also be used to restore the compressed
    version of a tar archive. The use of -z eliminates use of the gzip utility to
    compress an archive, or the use of gzip utility to uncompress a compressed file
    and then untar (restore/unpack) it with the tar command; the two-step process
    is performed by the tar command alone. In the following session, we use the first
    tar command to create a compressed archive of the current directory in the ~/backup.tar.gz
    file and use the second tar command to uncompress and untar it in the ~/backups
    directory.


    ```

    $ tar -zcf ~/backup.tar.gz

    $ tar -zxf ~/backup.tar.gz ~/backups

    $

    ```


