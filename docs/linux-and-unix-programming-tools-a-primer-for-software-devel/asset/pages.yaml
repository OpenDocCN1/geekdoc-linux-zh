    # 2.6.15 SEARCHING FOR FILES AND COMMANDS


    At times you will need to find whether a particular file or command exists in
    your file system, or if you have multiple versions of a command, you might want
    to find out one executes when you run the command. We discuss three commands that
    can be used for this purpose: find, whereis, and which.


    # THE FIND COMMAND


    You can use the find to search a list of directories that meet the criteria described
    by the expression (see command description) passed to it as an argument. The expression
    is used essentially to specify one or more of the file attributes being searched.
    The command searches the list of directories recursively; that is, all subdirectories
    at all levels under the list of directories are searched. The following is a brief
    description of the command.


    | Syntax: | find directory-list expression |

    | Purpose: | Search the directories in ''directory-list'' to locate files that
    meet the criteria by the ''expression'' (the second argument). The expression
    comprises one or more criteria (see the examples) |

    | Output: | None unless it is explicitly requested in ''expression'' |

    | Commonly used options/features: |

    | -exec CMD | The file being searched meets the criteria if the command ''CMD''
    returns 0 as its exit status (true value for commands that execute successfully);
    ''CMD'' must terminate with a quoted semicolon, that is, \; |

    | -inum N | Search for files with inode number N |

    | -links N | Search for files with N links |'
