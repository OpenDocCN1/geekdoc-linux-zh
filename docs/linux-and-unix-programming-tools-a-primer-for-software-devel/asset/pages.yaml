    # 10.2.9 COMMAND-LINE USAGE AND DEBUGGING


    You can run the make command with many options, as seen in the beginning of Section
    10.2. The -f option allows you to specify a makefile with a nonstandard name.
    For example, you can use the following command to inform make that the make rules
    are in prog.makefile and that it should generate the target client1.


    ```

    $ make -f prog.makefile client1

    ```


    You can use the make -f - command to have the make utility read input from stdin.
    This syntax allows the use of the make utility in a pipeline. If the input comes
    from the keyboard, the input must terminate with <Ctrl-D> on a new line.


