    # 2.6.14 Compressing Files


    Reduction in the size of a file, known as file compression, has both space and
    time advantages. A compressed file takes less disk space, less time to transmit
    from one computer to another or via Internet environment, and less time to copy.
    Compression takes, but if a file is to be copied or transmitted several times,
    the time spent compressing could be a fraction of the time saved. Addition, if
    the compressed file is to be stored on a secondary storage device (e.g., a disk)
    for a long time, the savings in disk space is considerable. One consequence of
    compression is that the compressed file is not readable, but compressed file can
    be converted back to its original form, making it readable. The compression process
    is fully reversible using the uncompressed command.


    The LINUX/UNIX operating system has several commands for compressing and decompressing
    files, and for performing operations on compressed files. These commands include
    the traditional UNIX commands for compressing and decompressing files, compress
    and uncompress, and the GNU tools gexe, gzip, unzip, zcat, zcmp, zforce, and grep.
    We describe the GNU tools here; the GNU commands (gzip and unzip) are better than
    compress and uncompress because compress does not compress small files as well
    as the gzip command.


    # THE GZIP COMMAND


    The gzip command can be used to compress regular/ordinary files; it ignores symbolic
    links. The command reads the contents of files that are passed to it as parameters,
    analyzes their contents for repeated patterns, and substitutes a smaller number
    of characters for these patterns using Lempel-Zip coding. A compressed files are
    altogether different from the original file. The compressed file contains nonprintable
    characters, so the screen display of a compressed file is simply a mass of control
    characters. See a brief description of this command on the next page.


    The compressed files retain the access/modification times, ownership, and privileges
    of the original files. The original file is removed from the file structure. With
    no file argument or with - argument, the gzip command takes input from standard
    input (keyboard by default), which allows you to use the command in a pipeline
    (see Chapter 3). We normally use the command with one or more files as arguments.


    # THE GUNZIP COMMAND


    The gzip command can be used to perform the reverse operation and bring compressed
    files back to their original files. The gzip -d command can also perform this
    task. With the gzip command, the -N, -c, -f, -1, and -r options work just like
    they do with the gzip command.'
