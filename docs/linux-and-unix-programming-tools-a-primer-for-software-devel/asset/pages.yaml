  md: '# 13.1 INTRODUCTION


    A software engineer, TomDeMarco, once said, "You cannot control what you cannot
    measure" (Controlling Software Projects, Yourdon Press, New York, 1982). The purpose
    of software metrics is to collect and measure quantifiable attributes of software
    projects in order to better control their execution and to help in future projects.
    For example, software metrics enable us to assess the processes used in it (such
    as programmer hours), and its cost.


    Software profiling means determining certain parameters of your program when it
    executes. These parameters include the most time-consuming segment of the program,
    the execution frequency of each line (or function), and the function call graph
    for the program. The purpose of software profiling is to identify the segments
    of a program where the program spends most of its time when it executes. This
    information allows you to enhance the performance of your program in a more informed
    and systematic manner. Software metrics are generally used to determine software
    product properties such as the number of lines of code (LOC), size in bytes of
    the executable, software structure, time for testing, total number of defects
    in the product, the number of function points (FPs) or object points (OPs) for
    your software, and the runtime of the program.


    In this chapter we describe some of the commonly used GNU profiling tools in UNIX,
    prof, which can be used to produce an execution profile of C or C++ programs.
    We also use the wc, ls -l, and size commands to determine the LOC count for a
    program, the program''s size in bytes, and the size of the various segments (code/text
    and data segments, for example) of an executable program. Finally, we show the
    use of the time command to determine the execution time of the program.


    # 13.2 SOFTWARE METRICS AND THEIR PURPOSE


    Many facets of metrics are used by software engineering practitioners, such as


    +   - Software cost and effort estimation

    - Software productivity metrics

    - Software quality measures

    - Software size and complexity metrics

    - Software run-time performance


    Some of these metrics can be measured directly and others are derived. The metrics
    that can be measured directly are direct metrics and the ones that are derived
    are known as indirect metrics. Table 13.1 lists some of the direct indirect metrics
    of the size and complexity of a software product, the effort needed for a software
    project, the performance of programmers and testers involved in the project, and
    the run-time performance of the product.


    Some of the metrics mentioned in Table 13.1 help us assess the performance of
    programmers and testers, some help us estimate the effort needed for future products,
    some help us plan future products better, and some help us assess the run-time
    performance of the software. Some of the measures we discuss in this chapter are
    the size of the source code, size of the executable code, running time of a program,
    complexity of the source code, and software profiling.'
