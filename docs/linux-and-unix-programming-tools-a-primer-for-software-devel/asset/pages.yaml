    # 14.3.10 DISPLAYING DIFFERENCES


    You can use the cvs diff command to display the differences between files in the
    sandbox and in the source repository, or between two versions of a file in the
    repository. You can use this command with more and any of the options for the
    rdiff commands. A popular option is -c, for displaying the "context" difference.
    For example, if you have checked out the input.c file, the cvs diff -c displays
    the differences between the input.c file in the sandbox and in the source repository.


    # 14.3.11 DISPLAYING THE LOG HISTORY


    You can use the cvs log command to display the complete history of a file, including
    any comments added by the developers when committing changes to the file. CVS
    log input.c commands displays the log for the input.c file. You can display the
    log of all the files in a module (directory), get into the module with the cd
    command, and run the cvs log | more command.


