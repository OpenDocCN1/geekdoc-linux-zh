  md: '# Appendix A: Editing Text Files with vi and pico


    # MOVING THE CURSOR TO A LINE


    You can move the cursor to a line by typing : line-number and hitting <Enter>.
    For example, :25 moves the cursor to line 25 and : moves the cursor to the last
    line of the file being edited.


    # DISPLAYING LINES


    You can display a range of lines in the file being edited by typing : [m,n] and
    hitting <Enter>, where m is the starting line number and n is the ending line
    number. For example, :25,45 displays lines 25 through 45, $45 displays all the
    lines in the file starting with line 45, and :$ displays all the lines in the
    file with the current line.


    # REPLACING A STRING


    You can replace a string with another by using the following command syntax:

    [:line-range]/existing-string/new-string/gp


    With g, only the first occurrence of ''existing-string'' in a line is replaced
    with ''new-string''. With ''out-line'', the current line is used. With g (for
    global), all occurrences of ''existing-string'' in a (in the given line range)
    are replaced with ''new-string''. With p, the lines where replacement occurred
    are also displayed. For example, :1,$s/Windows/LINUX/g replaces every occurrence
    of the string Windows with LINUX in the whole file.


    # READING A FILE


    You can read a file and place contents at the current cursor position in the editor
    buffer with the :r file-name command. For example, if your cursor is at line 10,
    the :r datal command will put text in the data file after line 10 in the editor
    buffer.


    # EXECUTING A SHELL COMMAND


    You can run any shell command in the command mode by preceding the command with
    1. For example, in order to run the :command, type !1 and hit <Enter>. After executing
    the command and displaying its output, vi goes back to the command mode.


    # REDRAWING THE SCREEN/WINDOW


    You can redraw your screen (or window) with <Ctrl-R>. This removes any garbage
    from your screen and displays the window if it was garbled, perhaps due to a talk
    (chat) request, a message from the system administrator, or the output of a shell
    command.


    # SET UP THE VI ENVIRONMENT


    You can customize the behavior of vi by setting any of the environment variables.
    These options include automatic wrapping of the cursor to the next line, displaying
    the mode vi is currently in, and line numbers. You can set these variables for
    the vi session with :set command in the command mode, as in :set wm=5 to wrap
    the margin to five characters from the end of the line. The default line length
    is 25 characters. In order to permanently set the options, place these settings
    in the ~/.vimrc file with one or more commands. For example, the'
