  md: '# 9.4.1 COMPILING MULTIPLE SOURCE FILES


    You can use the gcc command to compile and link multiple C source files and create
    an executable file, all in a single command line. For example, you can use the
    following command line to create the executable file called polish for driver.c,
    stack.c, and misc.c.


    ```

    $ gcc driver.c stack.c misc.c -o polish

    ```


    $


    If one of the three source files is modified, you need to retype the whole entire
    command line, which creates two problems. First, even though only one needs recompilation,
    all three files are compiled into their object modules, which results in longer
    compilation time, particularly if the files are large. Second, retyping the entire
    line might not be a big problem when you''re dealing with three files (as here),
    but you certainly won''t like having to do it with a much larger number of files.
    Although with the -o operator (see Section 1.6.11 ) you don''t need to retry the
    whole command, specifying different patterns with this operator to invoke multiple
    commands is still a time-consuming task. To avoid these problems, you should link
    object modules for all source files and then recompile only those modules that
    are updated. This is called incremental recompilation. All the object modules
    are then linked together to create a single executable file.


    You can use the gcc command with the -c option to create object modules for the
    C source files. When you compile a program with the -c option, the compiler leaves
    an object file in your current directory and does not generate the executable
    file. The object file has the name of the source file and an .o extension. You
    can link multiple object files by using another gcc command. In the following
    session, we compile three source modules, driver.c, stack.c, and misc.c, separately
    to create their object files, and then use another gcc command to link them and
    create a single executable file, polish.


    ```

    $ gcc -c driver.c

    $ gcc -c stack.c

    $ gcc -c misc.c

    $ gcc misc.o stack.o driver.o -o polish

    $ polish

    ```


    [output of the program]


    $


    You can also compile multiple source files with the -c option and generate their
    object modules. In the first of the following command lines we compile all three
    source files with a single compiler command to generate the object files. The
    second command line links the three object files and generates one executable
    file, polish.


    ```

    $ gcc -c driver.c stack.c misc.c

    $ gcc misc.o stack.o driver.o -o polish

    ```


    $'
