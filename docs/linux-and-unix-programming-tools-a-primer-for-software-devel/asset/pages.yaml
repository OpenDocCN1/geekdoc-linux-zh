    # 7.2.2 Restoring Archived Files


    You can restore using the function x of the tar command. The restoration can be
    complete or partial, that is, you can restore everything in an archive or a subset
    of the files in it.


    # 7.2.2.1 Complete Restoration


    You can run the following command sequence to restore the linuxtools.tar archive
    and place it in the ~/backups directory where the archived files are to be restored.
    The cp command copies the archive file to the directory (~/backups) The cd command
    is used to make the destination directory the current directory. Finally, the
    tar command is used to do the restoration of the archived files in your current
    directory. After the files and directories in linuxtools.tar have been restored,
    the ~/backups directory contains the final directories and all the files (and
    directories) under them.


    ```

    $ cp linuxtools.tar ~/backups

    $ cd ~/backups

    $ tar xf linuxtools.tar

    $ ls -l

    ```'
