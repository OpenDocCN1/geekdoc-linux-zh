  md: '# nm [options][file-list] (continued)


    Commonly Used Options / Features:


    +   -D

    Display dynamic symbols only (useful when working with ndynamic libraries)


    +   -V

    Display the version number of nm on standard error


    +   -f format

    Display output in ''format,'' which can be bsd, sysv, or posix; default bsd


    +   -g

    Display information about external (global) symbols only


    +   -l

    For each symbol, find the file name and line number


    +   -n, -V

    Sort external symbols by address


    +   -u

    Display only the undefined symbols, those external to each object module


    +   -W

    Give extra and more verbose warnings


    If symbolic information is available for a file, the nm utility reports that.
    If the symbolic information is available for files in the command line, for each
    file or member of an archive, the nm utility sends at least the following information
    to stdout: the address of each symbol, its value, and its type. Depending on the
    options used in the command line, the nature of the library or symbol''s size
    (if, for example, a symbol is a variable) may also be part of the output.


    The type of symbol is indicated by a letter; uppercase letters are used for global
    symbols and lowercase letters are used for local symbols. The letter informs you
    about the segment in which the symbol is located. The binary image of a program
    in LINUX includes four important segments: text/code, data, stack, and heap. The
    text segment contains the program code, the data segment contains the activation
    records (also known as stack frames) for function calls, and the heap segment
    contains the memory space that is allocated and deallocated dynamically (with
    calls like malloc() and free()). The data segment is subdivided into two parts;
    one for initialized variables and the other for uninitialized variables. The part
    containing uninitialized variables is commonly known as bss. Table 11.1 shows
    the most commonly displayed type letters and their meanings; for brevity, we show
    the uppercase letters only.


    | Table 11.1 Type Letters Used in the Output of the nm Utility |

    | Type Letter | Meaning |

    | A | Global absolute symbol |

    | B | Global symbol in the uninitialized data segment (bss) |

    | D | Global symbol in the initialized data segment |

    | F | File symbol |

    | T | Global symbol in the text (code) segment—with respect to your program, these
    are mostly function names |

    | U | Undefined symbol, an external symbol (usually a library function) |'
