    $

    ```


    Note that [0-9] means any digit from 0 through 9 and [a-zA-Z] means any lowercase
    or uppercase letter.


    The following command displays the names of all the files in your home directory
    that end with .c or .C, which are the names of all your C and C++ source program
    files.


