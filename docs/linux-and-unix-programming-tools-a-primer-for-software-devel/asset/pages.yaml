  md: "# # LINUX & UNIX\nProgramming\nTools\n\n# ## A PRIMER\nfor Software Developers\n\
    \nSyed Mansoor Sarwar\n\nKhaled H. Al-Saqabi\n\n\"[book] is remarkably unique.\
    \ Much larger books on UNIX barely touch on the programming aspects that this\
    \ book does.\" — Mark S. Hutchenreuther, P.E.\n Poly San Luis Obispo\n\n\"This\
    \ book] covers the gap between programming on Windows and using UNIX to program.\
    \ The simplicity of the text makes it a good choice for people with no experience.\"\
    \ — Charles P. Wright\nState University of New York at Stony Brook\n\nThis concise\
    \ programming companion prepares readers for programming in the Linux and UNIX\
    \ environments. It is organized in a way that answers the functional\nHow do I...?\"\
    \ questions that all beginners have, and assumes no previous program-\ning experience.\n\
    \nThe authors begin with a brief review of various commands and utilities that\
    \ programmers routinely use. They then describe the software development tools\
    \ available to anyone programming in the Linux and UNIX environment. These software\
    \ developpement tools include utilities for managing libraries for object files,\
    \ version con-\ntrol tools, and tools for debugging and profiling.\n\nLinux and\
    \ UNIX Programming Tools: A Primer includes extensive in-chapter exercises to\
    \ reinforce and allow the practice of newly learned commands and tools, and has\n\
    solutions manual (available to qualified college instructors ONLY), making it\
    \ ideal\n course adoption in CS1/CS2 and Operating Systems or Software Engineering\n\
    courses. A free copy of Mandrake Linux™ 8.2 is included.\n\n![](img/62803a90ad1a923bf070a7b5e2ffbb05_371_0.png)"
