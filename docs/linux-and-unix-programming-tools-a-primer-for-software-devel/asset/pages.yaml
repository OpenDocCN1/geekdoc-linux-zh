    # 11.4 THE nm UTILITY


    You can use the nm utility to display the symbol table (i.e., names, types, sizes,
    entry points, etc.) of a li-

    bary, or executable file. It displays as output one line for each identifier,
    such as a function

    variable name, in the file, informing you about its attributes. The information
    displayed by the nm

    utility is useful for debugging libraries and executables files. Here is a brief
    description of this utility.


    ```

    Syntax: nm [options][file-list]

    Purpose: Display the symbol table of the executable, object, or library files
    in ''file-list''; if no

