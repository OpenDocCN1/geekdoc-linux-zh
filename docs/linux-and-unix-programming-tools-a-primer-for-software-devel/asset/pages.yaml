    # 14.2.4 Creating A New Version of A File


    If you want to retrieve a new version of a file, you must first create it. You
    can create a new version of a file by using the ci command with the -r option.
    In the following session, version 2.1 of the input.c file is created and stored
    in the RCS directory. Note that we use -r2 as a shortcut for -r2.


    ```

    $ ci -r2 input.c

    RCS/input.c,v <- input.c

    new revision: 2.1; previous revision 1.2

    enter log message, terminated with ''.'' or end of file

    >> Just showing how a new version of a file can be created.

    >> .

    done

    $

    ```


    # 14.2.5 Checking Out Copies of Specific Versions


    In RCS, you can check out an existing version of a file by using the co command
    with the -r option. If the checked-out version has the highest revision number,
    the new version generated at checkout time has the same release number (or sequence
    number if the file is a branch of a particular release) automatically incremented
    by 1. If the checked-out version is not the latest, the co command always checks
    out the highest version of a release, or version 1.2 here. Note that we used the
    ci -r command in the previous section to create a new release (release 2) of this
    file. A higher release exists for the input.c file, so the ci command created
    a new branch at the checked-out level, resulting in version 1.2.1.1.


    In the following session, we check out version 1 of the input.c file for editing.
    By default, the co command always checks out the highest version of a release,
    or version 1.2 here.


    ```

    $ co -l -r1 input.c

    RCS/input.c,v -> input.c

    revision 1.2 (locked)

    done

    $ vi input.c

    ```'
