  md: '# 12.4 THE GNU DEBUGGER gdb


    GNU debugger gdb is a text-based debugger. It has GUI front-ends such as xgdb
    and ddd, but we describe only the text-based version. You can invoke gdb by using
    the gdb command. Once it starts running, gdb reads commands from the keyboard
    to perform various tasks and quits when you give it the quit command. The following
    is a detailed description of the gdb command.


    ```

    gdb [options] [execprog [core | PID]]\Syntax:

    ```


    Purpose: Allows execution of a program ‘execprog’ to be traced, to determine what
    goes on side-it, helping you identify the location of a bug in the program. You
    can also specify a core file or the PID of a running program.


    +   Common Used Options / Features:

    -c core Use ‘core'' as the core file to examine

    -h List command options with brief explanations

    -n Do not execute commands in the ~/.gdbinit file after processing all command
    line options

    -q Do not display the introductory and copyright messages

    -s file Use symbol table from the ''file''


    During startup, gdb searches for ~/.gdbinit file and executes the commands in
    it. You can use the -n option to ask gdb to ignore this file.

    During a typical session, you need to use only a small set of gdb commands. Table
    12.1 lists some of the commonly used commands and their brief descriptions. Short
    command names such as break and bt for backtrack.


    | Table 12.1 | Commonly Used gdb Commands and Their Brief Descriptions |

    | Command | Description |

    | break [[file]:line|func] | Set breakpoint at line number ''line'' or function
    ''func'' in ''file''. Without an argument, set breakpoint at the next instruction
    |

    | backtrack [n] | Display trace of all stack frames; n frames (innermost n frames
    for n>0 and outermost n frames for n<0) clear |

    | [[file]:line|func] | Delete breakpoint at line number ''line'' or function ''func''
    in ''file''. With an argument, delete breakpoint at the next instruction |

    | continue [count] | Continue the execution of the program being debugged, after
    a breakpoint or signal. If proceeding from a breakpoint, the ''count'' number
    is used to ignore breakpoint (count-1) times |

    | finish | Execute program until the selected stack frame returns |

    | frame [n] | Without an argument, select the current (topmost) stack frame. With
    an argument, select stack frame n or stack frame at address n |'
