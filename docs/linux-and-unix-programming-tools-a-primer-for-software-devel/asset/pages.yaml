  md: '# 14.1 INTRODUCTION


    Studies have shown that about two-thirds of the cost of a software product is
    spent on maintenance. As we have mentioned before, corrective maintenance and
    enhancement comprise the maintenance of a software product. In corrective maintenance,
    the errors and bugs found after installation are fixed. In enhancement, the product
    is enhanced to include more features, such as an improved user interface. Regardless
    of its type, maintenance means changing and/or revising the source code for the
    product and generating new executables. As you revise source code, you may need
    to undo changes that you made to go back to an earlier version of the software,
    or if you detect a bug in your software after it has been in use for a long time,
    you will wish to be able to retrieve earlier versions of the software to determine
    the change that induced the bug. Moreover, if a team of programmers is working
    on a piece of software, each team member should be able to check out and edit
    in (modifiable) versions of the software. In the remainder of the chapter, we
    will discuss the LINUX/UNIX tools that support such actions. We use the terms
    revision, version, release, and delta interchangeably.


    Version control is the task of managing revisions to a software product. Typical
    software for version control allows you to


    +   - Lock out others from changing a file while one user is altering it (provide
    a checkout and checkin system of file access)

    - Create different versions of a file

    - Identify revisions to a file

    - Store and retrieve different versions of a file

    - Merge multiple versions of the same file to create a "final" file

    - Maintain a history of all versions of every file related to a product

    - Access earlier versions of all the files of a product

    - Limit access to a file to a subset of users on the system


    Several LINUX/UNIX tools allow you to control versions of your files and almost
    all of them using the Revision Control System (RCS) as their engine. We discuss
    Revision Control System and Concurrent Versions System (CVS) in this chapter.


    # 14.2 THE VERSION CONTROL SYSTEM (RCS)


    The Revision Control System (RCS) was designed to perform all of the version control
    tasks. In RCS, version numbers start with 1.1. When you request a particular version
    of a file, RCS starts with the latest version and makes changes in it to recreate
    the requested version. The RCS way of creating a version is usually faster because
    most people work forward and create a newer version based on the current version,
    rather than an older version. The version numbers in RCS are maintained in the
    format release.level.branch.sequence.


    RCS maintains several versions of a file in a special r-format. You cannot edit
    this file using normal Linux or UNIX editors as vi, vim, or emacs. But, once this
    file has been created, you can access a version of your original file by using
    RCS-specific commands to create a new version (through checkout and checkin procedures),
    view the current editing activity on an RCS file, or view revisions'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# The Revision Control System (RCS) 273


    made to the file. We describe the commands for performing the most common tasks.
    All the RCS utilities are in the /usr/bin directory. Add this directory to your
    search path (in the shell variable PATH or path) if it isn''t already there.


    # 14.2.1 WORKING WITH RCS


    The first step to using RCS is to create a directory called RCS in the directory
    that contains the files you want to manage with RCS. This directory contains the
    revision information on your files, including the latest version of each file,
    along with the information that can be used by RCS to create previous versions.
    An access list is maintained for every RCS file that contains the login names
    of the users who can access the file. Login names can be added or deleted from
    the list.


    # 14.2.2 CREATING AN RCS HISTORY


    The ci command is used to create and manage RCS history files. The following is
    a brief description of the utility.


    ![](img/62803a90ad1a923bf070a7b5e2ffbb05_290_0.png)


    **Purpose:** This allows creating and administering RCS history files; names of
    history files carry the postfix ''v'',


    +   Commonly used options/features:

    -f [rev] Check in a revision even if it is not different

    -l [rev] Check in a revision and immediately check it out again and lock

    -r rev Check in the modified file as revision number ''rev''

    -u Check in a file but keep a read-only version and remove any lock


    Along with the access list, an RCS file contains multiple revisions of the text,
    a change log, descriptive, and some control attributes such as file lock. In order
    for you to access a file, you must be its owner or the superuser, or your login
    name must be on the access list.


    Once you have created an RCS history file, you can remove the original. From now
    you will access the source file using the RCS-specific commands, and these files
    work with RCS history files only. In the following session, we use the ci command
    to create (check in) an RCS history file called RCS/input.c. After depositing
    a new revision, ci prompts you for a log message that you can enter to summarize
    the change. This message must be terminated with a <Ctrl-D> or period (.) on a
    new line.


    # $ ci input.c


    RCS/input.c,v <- input.c


    enter description, terminated with single ''.'' or end of file:


    NOTE: This is NOT the log message!'
