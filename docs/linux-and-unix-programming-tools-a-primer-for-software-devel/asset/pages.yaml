    # 1.4 LINUX/UNIX SHELLS


    When you log on, the LINUX/UNIX system starts running a program that acts as an
    interface between you and the LINUX/UNIX kernel. This program, called the LINUX/UNIX
    shell, executes the commands that you have typed in the keyboard. When a shell
    starts, it gives you a prompt and waits for your commands. When you type a command
    and press `<Enter>`, the shell interprets your command and executes it. If you
    type a nonexistent command, the shell informs you, redisplays the prompt, and
    waits for you to type the next command. Because the primary purpose of the shell
    is to interpret your commands, it is also known as the LINUX/UNIX command interpreter.
    When you get a new account on LINUX/UNIX system, your default login shell is chosen
    by the system administrator but you can use the shell of your liking by running
    an appropriate command as discussed at the end of this section. The Bourne shell
    (Bash), TC shell (Teesh), and Z shell (Zsh) are the most popular LINUX shells.
    The most popular UNIX shells are Bourne, Bourne Again, Korn, and C. We focus on
    Bash and Teesh in this book. The shell sessions shown in the book were captured
    without Bash, unless otherwise stated.


    A command can be internal (built-in) or external. The command to execute an internal
    command is part of the shell, but the process to execute an external command resides
    in a file of a binary executable program file or a shell script. The shell executes
    commands without the kernel, it terminates when it finds out it cannot read anything
    else from the keyboard. You can inform it by pressing `<Ctrl-D>` at the beginning
    of a new line. As soon as the shell receives `<Ctrl-D>`, it terminates and logs
    you off the system. The system displays the login: informing you that you need
    to log on in order to use it.


    The shell interprets your commands by assuming the first word in a command line
    is the name of the command you want to execute. It assumes that any of the remaining
    words starting with a hyphen (-) are options and that the rest are the command
    arguments. After reading your command line, the shell determines whether the command
    is an internal or external command. It processes all commands using the corresponding
    code segments that are within its own code.


    # 1.4.1 SEARCH FOR A SHELL


    To execute an external command, your shell searches several directories in the
    file system (see Chapter 2), looking for a file that has the name of the command.
    It then assumes the file contains the code to be executed and runs the code. The
    names of the directories that a shell searches to find the file corresponding
    to an external command are stored in the shell variable PATH (or path in the TC
    shell). Directory names are separated by colons in the Bash shell and by spaces
    in the TC shell.'
