    # FIXING THE BUG


    From the listing of the get_input function, we find out that str is a local variable
    that is never initialized. Its value is 0x0 (hexadecimal)—it points to memory
    location 0. The lower memory locations are used to store part of the LINUX operating
    system. With the *str=getchar(); statement, our program tries to write to a location
    that is outside its process address space (i.e., a location that doesn''t belong
    to it). This attempt is a clear violation that results in the program receiving
    a SIGSEGV, causing premature program termination and the error message Segmentation
    fault. Figure 12.1 illustrates the segmentation violation.


    To fix the bug, all you need to do is initialize the str pointer to a memory space
    that has been allocated to the program. We use the malloc() library call for this
    purpose. The revised get_input function is shown in the following session, with
    the compilation and proper execution of the program.


