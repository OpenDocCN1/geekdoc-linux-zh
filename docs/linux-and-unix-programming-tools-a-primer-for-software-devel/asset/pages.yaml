    of the processes used in this chapter.


    # 6.4 PROCESS HIERARCHY IN LINUX/UNIX


    When you run on your LINUX system, LILO (Linux Loader) locates the LINUX kernel
    and loads it into memory. It initializes various hardware components such as the
    disk controller. The LILO process switches to protected mode, loads the operating
    system, and executes the code that initializes the kernel data structures such
    as the inode and file tables. This process has PID 0. It now starts the init process
    (PID 1) that carries out the rest of the boot process. The init process starts
    daemons flush, update, kpid, and kswap, with PIDs 2, 3, 4, and 5, respectively.
    The init process then initializes the file systems and mounts the root file system.
    It attempts to execute the /sbin/init program, which runs the mingetty process
    (usually called the getty) on every active terminal line. The getty process sets
    the terminal attributes, such as baud rate, as specified in the /etc/termcap file.
    It displays the login: prompt, inviting you to log onto the system.


    When at login, when you type your login name and press <Enter>, the getty process
    forks a child. The child uses the exec call to become a login process with your
    login name as its parameter. The login process prompts you for your password and
    checks the validity of your login name and password. If it finds that both are
    correct, the login process forks a child that executes your login shell. If the
    login process doesn''t find your login name in the /etc/passwd file (or /etc/shadow)
    file, or the password incorrect, it displays an error message and terminates.
    Control goes back to the getty process, which redisplays the login: prompt.'
