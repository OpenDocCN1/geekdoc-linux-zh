  md: '# PREFACE


    # WHY WE WRO THIS BOOK


    This concise programming companion prepares students for programming in the LINUX/UNIX-environment.
    Together we have more than 28 years of practical teaching experience at the university
    level. During these years, we have taught a wide range of courses in programming,
    data structures, operating systems, and software engineering on UNIX and LINUX
    platforms. Our desire to write this book came out of our frustration for not finding
    a decent and current textbook that describes systematically the LINUX and UNIX
    programming tools and utilities for compiling multi-module programs, dealing,
    with libraries, software profiling, and version control. We believe that a book
    that describes these tools in a detailed and orderly manner includes incorporating
    pedagogy in-chapter exercises and useful end of chapter problems and questions
    was long overdue. Although almost all of the commands and tools discussed in the
    book can be used on both LINUX and UNIX, all of our shell sessions were captured
    under Mandrake and RedHat Linux systems.


    # The Purpose of This Book


    The book is divided into two parts—Part I; "Using LINUX and UNIX Effectively"
    and Part II; "Program Development on a UNIX or Linux Platform." Each part has
    seven chapters. Part I describes systematically the LINUX and UNIX commands and
    tools for file, process, and printer control, in addition to describing the logon
    and logoff procedures, file security, and file system backup and restoration.
    These commands and tools allow the reader to use he or her LINUX/UNIX system in
    an orderly, efficient, and secure fashion. The primary purpose of this textbook
    is to describe some important LINUX and UNIX software engineering tools for developers
    of C++ software; coverage of Java is sometimes included, too. Software engineering
    tools are described in detail in Part II. The tools covered in Part II include
    gcc, make, ar, gdb, gprof, nm, size, rcs, and cv. In writing this textbook we
    assumed the reader had no previous knowledge of LINUX/UNIX or programming. Because
    of the breadth and depth of covering programming tools, both a novice and experienced
    programmers can benefit from the book.


    # OUR INTENDED AUDIENCE


    This book is designed to be used as a companion to the main text in introductory
    programming and data structures courses on a LINUX or UNIX platform or as a supplementary
    text in advanced programming, introduction to software engineering, and operating
    systems courses.


    # THE PRESENTATION FORMAT


    The book is laced with diagrams and tables, hundreds of in-chapter interactive
    shell sessions, in-chapter exercises, and end-of-chapter questions and problems.
    A syntax box for every command, tool, and application covered describes the syntax
    of the command, its output and its use-options and features. Most chapters contain
    a table of useful Web resources. In addition, every chapter contains a summary
    of the material covered in the chapter. A glossary of terms appears at the end
    of the book.'
