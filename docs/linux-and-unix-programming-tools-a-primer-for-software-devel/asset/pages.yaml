  md: '# 316 Appendix A: Editing Text Files with vi and pico


    The editor operates in two modes: command mode and insert mode. In the command
    mode, you can use certain key presses and command the editor to take certain action
    such as deleting text, moving text, copying text, saving changes to the text,
    entering the insert mode, and quitting. In the insert mode, you can insert text
    into the editor buffer for the file being edited. Figure A.2 shows how you enter
    and exit the insert mode, execute commands in the command mode, save changes made
    to a document, and edit the editor. You exit the insert mode by pressing <Esc>.


    Vi has a rich and powerful set of features for text editing. Many of these features
    are available in the command mode. Here, we discuss only a subset of these features,
    sufficient for creating and editing text files with ease. In the descriptions
    of commands, < and > are used to enclose key presses and are not actually typed
    as part of the command.


    # Committing Changes and Quitting vi


    You can commit changes to the file being edited with the :w command (w stands
    for write). If you do not execute this command, the changes are made to the editor
    buffer and the disk copy of the file remains unchanged. After making the final
    changes, you can use the :wq command to write and quit. If the file is read-only,
    then use the :wq!. We highly recommend that you use :w often during your editing
    session, otherwise you may lose changes if the system crashes or you are logged
    out for some reason. For many exceptions (e.g., your modem line hanging up when
    you are logged on a remote machine via modem), vi saves its editor buffer and
    sends you an e-mail message informing you how to recover it.


    ![](img/62803a90ad1a923bf070a7b5e2ffbb05_333_0.png)


    Figure A.2 Operating modes of the vi editor'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# The Vi or Vim Editor 317


    # Browsing the File


    You can browse the file being edited in many ways in the command mode. At a micro
    level, you can use the <j> (next line), <k> (previous line), <h> (previous column),
    and <l> (next column) keys to move the cursor by one column or line. At a macro
    level, you can use the <Ctrl-F> and <Ctrl-D> keys to display the next or previous
    screen/page, respectively. You can display the next half screen with <Ctrl-D>.


    # Deleting Text


    You can delete text from the file being edited in many ways. To delete a character,
    move the cursor under the line to be deleted and hit <x>. To delete a word, move
    the cursor under the first letter of the word and hit <d><w> (i.e., <d>, then
    <w>. To delete a line, move the cursor to anywhere on the line and hit <d><d>.
    To delete a range, specify the range and hit <d><d>, as in 23,46<d><d> 23 through
    46. To delete the rest of the line, hit <$>


    # Copying and Cutting Past Text


    You can cut N lines of text starting with the current line by pressing <N><d><d>.
    For example, you can delete 18 lines starting with the current line by pressing
    <1<8><d><d>. You can paste these lines elsewhere in your document by moving the
    cursor to the desired line and pressing <p> to paste the deleted lines after the
    current line. For pasting the lines before the current line, press <P>. Commit
    changes made in the file with the :w command.


    If you want to copy N lines of text starting with the current line, press <N><y><y>
    (for yanking N lines) as in <1<8><y><y>. You can paste the yanked lines anywhere
    in your document with the <p> (or <P>) command. Again, commit changes made in
    the file with the :w.


    # String Search


    You can search the file being edited for a string with the /string-to-be-searched
    command. For example, to search your line for the string Linux, type /Linux and
    hit <Enter>. The search stops at the first line containing the string with the
    cursor pointing at the beginning of the string. You can continue the search by
    pressing / and hitting <Enter>. For backward search, use ? instead of /. If the
    string is not found, an error is reported at the bottom left of the screen.


    # Determining File Size


    In vi, $ stands for the last line. You can determine the line count in a file
    by typing $= and hitting <Enter>.


    # Determining the Current Line Number


    In vi, (.) stands for the current line. You can determine the line number of the
    line (i.e., where the cursor is currently located) by typing : = and hitting <Enter>.'
