  md: '# Input, Output, and Error Redirection


    You can use the LINUX/UNIX redirection features to detach the default files from
    stdin, stderr and attach other files with them. We describe how these features
    work in this chapter. Our discussion is for Bash unless stated otherwise.


    # 3.3 INPUT, OUTPUT, AND REDIRECTION


    The default (devices) attached to be changed to the standard files of a command
    for a single execution of the command using the LINUX/UNIX redirection features.
    The use of these features results in what is commonly known as input, output,
    and error redirection. We discuss these features one by one. Although the redirection
    features can be used across computers in a network environment, our discussion
    is limited to redirection on the same computer.


    # 3.3.1 INPUT REDIRECTION


    You can change the default device associated with stdin to a different file by
    using input redirection for one execution of a command. This allows the command
    to read input from the newly attached file instead of the keyboard. The < (or
    O<—) is implicit default) operator can be used for input redirection according
    to the following syntax, where 0 is the file descriptor for stdin.


    ```

    command < input-file or command < input-file

    ```


    Purpose: Detach keyboard from stdin and attach ''input-file'' to it, i.e., ''command''
    reads input from ''input-file'' and not keyboard


    The command and error messages still go to the display screen. In the following
    session, the cat and grep commands read input from the Phones file instead of
    the keyboard. The outputs of the commands are still sent to the display screen.


    $ cat < Phones


    [ contents of Phones ]


    $ grep "John" < Phones


    [ output of the grep command ]


    $


    Although the end result is the same, the cat < Phones command is different from
    the Phones command, in which the Phones file is passed as a command line argument
    to the cat command; stdin of cat does not change.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# 78 Chapter 3 Input/Output Redirection


    The cat and grep read input from stdin if they are not passed file arguments in
    the command line. The tr command reads input from stdin only and sends its output
    to stdout. The tr command does not work with a file as a command line argument.
    Input redirection is often used with the tr command, in the following session
    where it substitutes multiple consecutive spaces in the Phones file with a single
    space.


    ```

    $ tr -s '' '' < Phones

    [ contents of Phones with multiple consecutive spaces replaced with a single space
    ]

    $

    ```


    # 3.3-2 Output Redirection


    You can change the default device associated with stdout to a different file by
    using output redirection for one execution of a command. This allows the command
    to send its output to the newly attached file instead of the display screen. The
    > (or 1>) is a implicit operator that can be used for output redirection according
    to the following syntax, where one is the file descriptor for stdout.


    | command > output-file or command 1> output-file |

    |---||

    | Purpose: Detach the display screen from stdout and attach ''output-file'' to
    it, i.e., ''command'' sends output to ''output-file'' and not to the display screen
    |


    The input of command session still comes from the keyboard and error messages
    still go to the display screen. In the following session, the cat command reads
    input from stdin and saves it to the Phones file. If the Phones file already exists,
    it will be overwritten. The grep command reads its input from the Phones file
    (which is passed as a command line argument) and the command output goes to the
    Phones file. The output of the find command is redirected to the foo.paths file.
    The error messages of the commands are still sent to the display screen.


    ```

    $ cat > Phones

    [ your input ]

    <Ctrl->

    $ grep "John" Phones > Phones.bak

    [ output of the grep command ]

    $ find -name foo -print > foo.paths

    [ error messages ]

    $

    ```'
