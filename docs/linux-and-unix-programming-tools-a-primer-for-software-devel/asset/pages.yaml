    # 9.4.3 OPTIMIZING EXECUTABLE CODE


    You can reduce the size of your executable code and its execution time by optimizing
    it with the -O compiler option, as described in the syntax box for the gcc command.
    Optimization saves disk space because the program is smaller and saves CPU (and
    I/O time) because the program takes less time to run. Sometimes, you trade one
    for the other. For example, with the -02 option, you trade space for speed. If
    the executable is to be e-mailed, the space optimized version will take less time
    to travel on the network (or Internet) than the non-optimized version. Optimizing
    your code is not important for small programs written as part of a typical programming
    course, but it is very important for production quality code that would used many
    times. In the following section, we use the first -O options to show reduction
    in the size of the executable for a small size program. We use the wc -c command
    to display the sizes of executables in bytes. Note that with the -0 option no
    optimization (-1 option) results in about 6% space saving.


    ```

    $ gcc Huffman.c -o Huffman

    $ gcc Huffman.c -00 -o Huffman0

    $ gcc Huffman.c -01 -o Huffman1

    $ wc -c Huffman Huffman?

    9182 Huffman

    9182 Huffman0

    8632 Huffman

    26996 total

    ```


    $'
