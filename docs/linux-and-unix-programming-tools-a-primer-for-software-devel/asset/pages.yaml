  md: '# 2.7 SUMMARY


    In LINUX and UNIX, a file is a sequence of bytes. This simple yet powerful, concept
    and its implementation lead to everything in the system being a file. LINUX/UNIX
    supports five types of files: ordinary directory, symbolic link, special file
    (device), and named pipe (also known as FIFO). The BSD-based systems support a
    sixth type, called socket. No file extensions are supported for files of type,
    but applications on a LINUX/UNIX system can require their own extensions. For
    example, .gz is handled by the gzip and gunzip commands. The .c is required by
    C programming language compilers as gcc (see Chapters 8 through 12).


    Every file in LINUX/UNIX has several attributes associated with it, including
    file name, owner''s name, last modified, link count, and the file location on.
    You can display the attributes of a file with the ls -l command and display the
    size of a file in bytes, words, and characters with the wc command.


    The LINUX/UNIX file system is hierarchical, with a root directory and all the
    files and directories in the system being under it. Every user has a directory,
    the user''s home directory, which he or she gets into logging on the system. Multiple
    disks andor partitions can be mounted on the same file system, allowing their
    access to drives and not named A; B; C; and so on, as in MS-DOS and Microsoft
    Windows. This approach provides a unified view of all the files and directories
    in the system, and users do not have to worry about remembering the names of drives
    and the files (directories) that they contain.


    Directories (primarily) can be created and removed using the user''s home directory.
    The structure can be built using various commands (mkdir, rdir, cd, ls, push,
    popd, etc.). The name of a file in the system can be specified using its absolute
    or relative pathname. An absolute pathname starts with the root directory and
    a relative pathname starts with a user''s home directory or working directory.
    You can maintain a directory stack using the dirs, pushd, and popd commands. This
    allows you to switch between directories quickly.


    The basic file operations involve creating and executable files, displaying (all
    or part of) a file''s contents, renaming a file, moving a file to another file,
    determining a file''s size, comparing files, combining files and storing them
    in another file, appending new contents (which may come from another file disk,
    keyboard, or output of a command) at the end of a file, and printing files. LINUX
    and UNIX provide several utilities that can be used to perform these operations.


    The vi and pico editors can be used to create and edit files. Binary/executable
    files can be created with a compiler as gcc. The cat and more commands can be
    used to display all the contents of a file on the display screen. The > can be
    used to send outputs of these commands to other files, and the >> operator can
    be used to append new contents at the end of a file. The cat sends files as continuous
    text, whereas the more and less commands send them in the form of pages. Furthermore,
    the more and less commands have several useful features, such as the less command
    is the most powerful of the three and has the most features.


    The head and tail commands can be used to display the initial or end portions
    (head or tail) of a file. These helpful commands are usually used to find out
    the type of data contained in a file, without using the file command. In addition,
    the file command cannot decipher contents of all the files.


    A copy of a file can be made in another file or directory by moving it cp using
    the mv command. Depending on whether the source and destination'
