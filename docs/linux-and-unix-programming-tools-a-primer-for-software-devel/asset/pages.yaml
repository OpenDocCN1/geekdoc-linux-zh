  md: '# 140 Chapter 7 File System Backup and Restoration


    # 7.1 INTRODUCTION


    The LINUX/UNIX system has several utilities that allow you to archive (pack) your
    files and directories on a tape or in a single file. The system administrators
    normally use a tape as the storage media for archiving file system backups, so
    that when a system crashes for some reason, files can be recovered. In a typical
    installation, the backup is done every day during off hours (late night or early
    morning) when the system is not normally use.


    As a LINUX/UNIX user, you can archive your work if you like. You normally need
    to do this to archive files related to a project you could transfer to someone
    via e-mail or ftp, or store them on a secondary storage media (tape, floppy, CD-ROM,
    etc.). The primary reason for making an archive is the convenience of dealing
    with (sending, receiving) a single file of a complete directory hierarchy. Without
    an archive, the sender may have to send several files and the receiver to restore
    in the correct order. Without an archiving facility, depending on the size of
    the file structure, the task of sending, receiving, and reconstructing the file
    structure can be very time-consuming.


    LINUX and UNIX have several utilities that can be used for archiving. These utilities,
    also known as the low-level backup programs, include tar, cpio, afio (an enhanced
    version of cpio), and dump. There are shell scripts that allow you to carry out
    and incremental backups (backup of new files and files that were changed since
    the last backup) on different types of storage media; these are known as high-level
    backup programs. Some of these programs are amanda, backup, tbackup, ibu (LINUX
    Backup Utility), and tob. Also, many software packages are distributed. We discuss
    the tar utility because it is one of the easiest to use and it is widely used.
    In this format we discuss the GNU version of the tar utility. Discussion of most
    of the other utilities can be found in a good book on LINUX/UNIX system administration.


    # 7.2 ARCHIVING AND RESTORING FILES USING tar


    The tar (tape archive) utility was originally designed to save file systems on
    tapes as a backup, so that files could be recovered in case of a system crash.
    The tar utility is still used for that purpose, but it is also commonly used these
    devices to pack a directory hierarchy as a disk file. This saves disk space as
    well as transmission time when electronically transmitting a directory hierarchy.
    In this section, we describe how you can use the tar utility to archive and retrieve
    files. A brief description of the utility is given below.


    ```

    tar [options] [files]

    The use - in front of an archive is not mandatory

    ```


    Purpose: Archive (copy in a particular format) files to or restore files from
    tape (which can be an ordinary file); directories are archived and restored recursively


    Commonly Used Options / Features:

    Option Format: Function_letter [Modifier]

    Function_letter:


    Create a new tape and archive archive files on it.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# tar [options][files]

    The use of - in front of an option is not mandatory (continued)


    Commonly Used Options / Features:


    +   - r Record files at the end of tape (append operation)

    - t List tape''s contents (names of files archived on it) in a format like ls
    -l

    - u Update tape by adding files on it if not or if modified used to tape.

    - x Extract (restore) files from tape; entire tape if none specified.


    Modifier f Arch Use ''Arch'' as the archive for archiving or restoring files.
    Default is /dev/mnt0.

    If Arch is -, standard input is read (for extracting files) or standard output
    is written (for creating an archive)—a feature used when tar is used in a pipeline.


    +   - h Follow symbolic links.

    - l Display error messages if links are not found.

    - v Use verbose mode: display the pathnames of the files and directories being
    archived or extracted.


    # 7.2.1 Archiving Files


    You use the tar command with the c or r options for archiving a list of files
    and/or directories. The c option creates a new archive, whereas the r option appends
    files at the end of the current archive. The most common use of the tar command
    is with the c option.

