    \ every occurrence of $(macro_name) or $(macro_name) in the rest of the Makefile.\
    \ For single-character macros, no parentheses or braces are needed. Once a macro\
    \ has been defined, you can use it in subsequent macro definitions. The following\
    \ are legal definitions of and references to macros. Note that parentheses or\
    \ braces are not used around G in $G because it is a single-character macro.\n\
    \n```\nG = gcc\nNAME = Tom\nABC = memo.${NAME}\n...\n$G -o power.c -lm\n..\n```\n\
    \nThe make utility has built-in macros, such as CFLAGS, that are set to default\
    \ values and are used by the built-in rules, such as execution of the gcc $(CFLAGS)\
    \ -c xxx.o -O command for a predefined rule, as described previously. The default\
    \ value of the CFLAGS is usually -O (for optimization), but it can be changed\
    \ to any flag for the gcc compiler. On our system CFLAGS is set to null--options.\
    \ The make utility uses several other built-in macros for the built-in rules.\n\
    The following example shows the use of user-defined macros and some useful rules\
