    Process Space The main memory allocated for its execution. When a process tries
    to access any location outside its address space, the operating system takes over
    the control, terminates the process,


    Open Source Software whose source code is freely available to the community of
    users who can modify it if they wish. An example of such a system is the LINUX
    operating system.


    Operating System Software that manages the resources in a computer system and
    provides an interface for use application software.'
