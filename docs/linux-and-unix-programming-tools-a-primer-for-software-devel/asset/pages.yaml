  md: '# # Appendix B: Electronic Mail


    LINUX and UNIX have several native and non-native tools for e-mailing, including
    mail and pine. We discuss briefly mail and pine here as they are the most commonly
    used. Whereas mail, perhaps the oldest UNIX e-mailing tool, is used mostly in
    shell scripts today, pine is a popular general e-mailing tool used by the LINUX
    community. The scope of our discussion here limited to the basic use of the mail
    and pine commands for sending and receiving e-messages and e-files.


    # ## THE MAIL COMMAND


    # ### Sending Mail


    You can send an e-mail message with the **mail** command by passing the e-mail
    addresses of the recipients as johndoe@cold-mail.com. The **mail e-address** command
    prompts for the subject of the mail message. After you type the subject and hit
    `<Enter>`, you are ready to send the message body. When you are typing the message
    body, type dot (.) and hit `<Enter>` on a new line to inform that it is the message
    body. You are prompted with Cc: so you could copy this message to someone else.
    To copy the message to someone, type his or her e-mail address and hit `<Enter>`.
    In our case, we send a copy of the message to sarwar@teachers.org. If you don''t
    want to copy your message to anyone, just hit `<Enter>`.


    ```

    $ johndoe@cold-mail.com

    Subject: Greetings!

    This is a test e-mail message composed and sent using the LINUX mail utility.

    ```


    Best,

    Mansoor


    Cc: sarwar@teachers.org

    $


    # ### Sending A File


    If you have prepared a message in a text file, you can send it by using the `<`
    operator (see Chapter 3 for I/O redirection). The contents of the file become
    the message body. Sending non-text files may cause problems. In order to send
    non-text files in the message body, you should first uencode them (with the LINUX/UNIX
    **uencode** command). You can specify the subject header in the command line by
    using the `-s` option, as shown below. In the following session, we send the message
    in the ~/personal/johndoe file to johndoe@cold-mail.com with the subject header
    "Greetings from Lahore."'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Appendix B: Electronic Mail


    ```

    $ mail -s"Greetings from Lahore" johndoe@cold-mail.com <-/personal/johndoe

    $

    ```


    # SENDING MAIL TO MULTIPLE USERS


    You can use multiple send-to-addresses in the command line by separating them
    with commas, as in mail jain@cold-mail.com, john@hot-mail.org < message. You can
    also make mail groups by using the alias command and putting the addresses in
    the ~/.mailrc file. The following session shows a sample ~/.mailrc file with two
    mail goups, MyPals and MyGroup1.


    ```

    $ cat ~/.mailrc

    alias MyPals jim@yahoo-ohay.com, jhon@cold-mail.com, jenny

    alias MyGroup davis, jane@cold-mail.com, johndoe@mailspot.org

    $

    ```


    # THE PINE COMMAND


    # Starting Pine


    Pine has a nice, intuitive interface allows you to use it without much reading.
    You can invoke the software with the pine command, which puts you in the main
    window for pine, as shown in Figure B.1. You can move around this and any other
    pine window with the arrow keys and use single-character commands to perform various
    tasks. For example, pressing <i> takes you to the window that you can read, respond
    to, or forward your e-mail messages. Press <c> allows you to compose an e-mail
    message.


    # COMPOSING A MESSAGE


    You can compose a message in pine by pressing <c> in the basic interface. This
    puts you in a window as shown in Figure B.2. You can attach a file (of any type-text,
    picture, audio, etc.) by typing its pathname after Attmnt: In our case, we typed
    -papers/OOPSLA02 and it to expand the absolute pathname of the file as shown in
    the window. You can move around the window with arrow keys and make corrections.
    You can send the e-mail with <Ctrl-X>. This command will raise a prompt at the
    left of the window asking whether you want to send the e-mail. Press <> to send
    and <n> to return to the previous window. If you want to cancel the composing
    session, press <Ctrl-C> and you will be prompted for confirmation. If you press
    <y>, you will be returned to the previous window (the main window in our case).


    # SENDING A BLIND COPY OF YOUR E-MAIL


    You can send a blind copy of your e-mail to someone <r> (to get the header while)
    you are in the header part of the screen and typing the e-mail address of the
    recipient at the Bcc: prompt in the window.'
