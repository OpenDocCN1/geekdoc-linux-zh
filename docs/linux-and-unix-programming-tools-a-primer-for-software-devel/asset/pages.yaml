  md: '# 332 Glossary


    Mount The LINUX and UNIX operating systems allow you to "connect" your hard drives,
    floppy drives, and partitions on drives to the file system structure. This is
    known as mounting the drives (or partitions). The directories where the drives
    are mounted are known as mount points. This allows you to access these drives
    in the file system and not as A:, B;, C.; etc., as you have to in some of the
    other systems.


    Classpath The specification of the location of a file (or a directory) in a system
    with a hierarchical file system.


    Pipe An interprocess communication channel in LINUX/UNIX allows two related processes
    (i.e., with parent-child, grandchild-parent-child, or sibling relationship) on
    the same computers to communicate with each other. At the command line, the "|\
    operator can be used to make two commands communicate with each other, as in -1
    | less


    Named Pipe Also known as a FIFO, a pipe is a communication channel that can be
    used by unrelated LINUX processes on the same computer to communicate with each
    other. The LINUX system call mkfifo (mkknod in older systems) is used to create
    a named pipe.


    Pipeline A sequence of commands inter- by a number of pipes.


    NIS Database A centralized repository of pieces of system information in a network-environment.


    Present Working Directory The directory you are in at time while using a computer
    system, also known as your current directory. In LINUX, the pwd command can be
    used to display the absolute path of your current directory.


    Object An Instantiation of a class.


    Print Job A queue associated with every printer where incoming print requests
    are listed up if the printer is busy. It then sends each request one by one as
    the printer becomes available.


