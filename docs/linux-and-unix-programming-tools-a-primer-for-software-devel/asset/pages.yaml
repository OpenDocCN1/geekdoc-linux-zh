    # 6.6 SUMMARY


    A process is a program in execution. Because LINUX/UNIX is a time-sharing system,
    it allows execution of multiple processes simultaneously. On a computer system
    with one CPU, processes are executed by scheduling the CPU time and giving it
    to each process for a short time, called a quantum (or a time slice). Each process
    is assigned a priority by the LINUX/UNIX system, and when the CPU is available,
    it is given to the process with the highest priority.


    Every LINUX/UNIX process has several attributes, including process ID (PID), process
    ID of the parent (PPID), process name, process state (running, suspended, swapped,
    etc.), the terminal process that was executed, the length of time the process
    has run, and process priority. The ps command can be used to display these attributes.
    The ptree command can be used to display process hierarchies.


    LINUX/UNIX processes can run in the background or foreground. A foreground process
    controls the terminal until it finishes, so the shell can be used for anything
    else as long as a background process runs. When a process runs in the background,
    it returns the prompt so the user can do other work as the process executes. Because
    a background process runs at a lower priority, a command that takes a long time
    is a good candidate for background execution.


    A set of commands can run in a group as separate processes or as one. Multiple
    commands can be run from one command line as separate processes by a semicolon
    (;) as the command separator; enclosed in parentheses these can be executed as
    one process. Commands can be executed concurrently by using ampersand (&) as the
    command separator. Background processes are created by terminating command lines
    with &. System processes (which are executed to provide a service such as printing)
    executed in the background are called daemons.'
