  md: 'The ps command accepts options for the System V, BSD, and GNU versions of the
    ps command.

    The System V options may be grouped and must be preceded by a dash, the BSD options
    may also be grouped and must not be preceded by a dash, the GNU options are preceded
    by two dashes. The options of different types may be mixed. The following is a
    brief description of the ps command. We don''t discuss the GNU options here; you
    can use the man ps command to see the GNU options.


    ```

    ps [options]

    ```


    Purpose: Report process status


    Output: Attributes of process running on the system


    Commonly used options / features:


    +   System V Options

    - -a Display information about all the processes executing on your terminal, including
    those of other users

    - -e/-A Display information about all the processes running on the system

    - -l Display long list (14 columns) of the status report

    - -u [ulist] Display information about processes belonging to the users with the
    UIDs or user names in ''ulist'' (UIDs or user names separated by commas); the
    default user is the one running the command


    +   BSD Options

    - U [ulist] Display information about processes belonging to the users with the
    UIDs or user names in ''ulist'' (UIDs or user names separated by commas); the
    default user is the one running the command

    - -a Display information about all the processes executing on your terminal, including
    those of other users

    - -e Display information about all the processes running on the system

    - -l Display long list (14 columns) of the status report

    - x Select processes without controlling tty


    You can use the ps command to know the user IDs (UIDs) of the users whose processes
    are currently running on the system.


    The output of the ps command shows four fields executed without options. The output
    of the ps command below shows that five processes are attached to the terminal
    pts/2:(a TC shell), bash (a Bourne Again shell), pine (e-mail software), banner,
    and ps, belonging to the user who ran the command. The PIDs of tsch, bash, pine,
    and ps are 7628, 7666, 7828, 7839, and 7830, respectively. The tsch process, the
    first one in the list and the one with the smallest PID, is called the session
    leader process (i.e., your login shell process); all other processes created in
    this session are its children. In LINUX and UNIX, the execution of a shell process
    starts a session and the processes that execute under it are the components of
    this session. Each session is assigned a session identifier (SID) and the processes
    in a session have the same SID.'
