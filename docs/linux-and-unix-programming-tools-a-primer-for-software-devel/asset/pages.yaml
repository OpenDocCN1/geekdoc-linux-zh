  md: '# PATHWAYS THROUGH THE TEXT


    If this book is used as a companion to the text for CSI and CSII on LINUX/UNIX,
    all the chapters except 13 and 14 should be covered. In a data structures course,
    relevant chapters in Part I should be covered, as well as 8–12. If the book is
    to be used as a companion to the main text in a software engineering course, Part
    II should be covered completely. For use in an operating systems course, chapters
    1, 2, 3, 5, and 6 in Part I and Chapters 8, 9, 11, and 13 will be of most help
    to students.


    # THE DESIGN AND TEXT


    The following typefaces have been used in this book to identify various types
    of text items.


    | Typeface | Text Type |

    | --- | --- |

    | Bold Roman | Keywords |

    | Bold Monospace | Any character or string typed at the keyboard (commands, shell
    variables, key presses, and user input) |

    | Monospace | Commands, tools, functions, system calls,applications, and their
    options in the text and output of commands, error messages, and the shell prompt
    |

    | Monospace Italic | A shell or program variable |

    | Italic | A word being used as a word and text being emphasized |

    | Roman | Everything else, including file filenames |


    # SUPPLEMENTS


    A comprehensive and informational Web site containing solutions to the In-Chapter
    Exercises, code, and further references and links to other LINUX and UNIX sites
    can be found at the Addison Wesley Site at www://www.aw.com/support.


    In solutions to the problems at the end of each chapter are available exclusively
    to professors using this book to teach a course. Please contact your local Addison-Wesley
    sales representative.


    We take full responsibility for any errors in this textbook. We appreciate error
    reports and comments; please send them to msarwar@lums.edu.pk. We will incorporate
    your feedback and fix any errors in subsequent editions.'
