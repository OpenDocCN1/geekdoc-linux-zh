    computer that is networked to other computers via a LAN, boots up, and enables
    the LINUX/unix login prompt. The user logs in to this standalone machine, enables
    the LAN connection on this standalone computer. The user types in the LINUX/unix
    telnet command to log in to a remote host on the intranet, which is running LINUX/unix,
