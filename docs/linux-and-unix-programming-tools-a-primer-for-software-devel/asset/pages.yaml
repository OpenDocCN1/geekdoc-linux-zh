    at the time it is created. It contains file attributes such as file size (in bytes).
    When a file is opened for an operation (e.g., read), the file''s inode is copied
    from a slot in a table kept in the main memory, so that the inode can be accessed
    quickly.


    Inode Number A 4-bit index value for the ilist used to access the inode for a
    file.


    Inode Table A table (array) of nodes in the main memory that keeps nodes for all
    open files. The node number for a file is used to index this array to access the
    attributes of an open file.


    Insert Mode A mode in the vi and vim editors which can be inserted in the file
    being edited.


