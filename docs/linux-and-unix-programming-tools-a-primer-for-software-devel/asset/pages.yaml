    # 8.3 PROGRAMMING LANGUAGES AND PROGRAMMING PARADIGMS


    There are many classes of programming languages and every class allows you to
    write programs by using a particular programming model or paradigm. For example,
    the programming style that uses object-oriented (OO) features of a language is
    known as the object-oriented programming paradigm. We briefly describe the various
    categories of programming languages, and the procedural and object-oriented programming
    paradigms.


    # 8.3.1 PROGRAMMING LANGUAGES


    Programming languages are often classified as imperative, functional/applicable,
    logic, and object-oriented. In this section, we briefly describe these language
    classes.


    In an imperative programming language, programs are written by variables to store
    data, using assignment statements to change data, and iterative repetition (although
    most imperative languages allow recursive repetition). Most of the popular languages,
    including C, C++, Java, BASIC, COBOL, and FORTRAN, fall in the bin of imperative
    languages. Imperative languages are universally compiled but can be interpreted
    too. The majority of scientific, business, Web, and software systems are written
    in imperative languages. Most of the contemporary operating systems are written
    in C or C++. Unix and Linux are written in C and Windows operating systems are
    written in C, C++, and C++. Most business software is written in COBOL and most
    new Web applications are written in Java.


    In a functional programming language, computations are done by passing parameters
    to functions. In these languages, there are no concepts of variables, assignment
    statement, and iteration; repetitions are carried out by making recursive calls
    to functions. Some of the well-known functional languages are Lisp, Scheme, ML,
    and Haskell. Lisp and its variants are a popular choice for writing artificial
    intelligence (AI) applications. Outside the domain of AI, one of the most popular
    text editors for Unix-like systems is Emacs, which is written in Lisp; as is the
    popular computer-aided design software, AutoCAD.


    In logic programming languages (also known as rule-based programming languages),
    computations are performed by specifying rules and letting the language implementation
    execute these rules in an order to perform the desired computation. One of the
    most popular logic programming'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Programming Languages and Paradigms 153


    languages in Prolog. Like functional languages, the logic programming languages
    are also used for problems related to AI, such as writing expert systems.


    Object-oriented programming languages provide support for abstract data types,
    known as classes. A class consists of a data portion and operations on data specified
    as functions, called methods. An instance of a class (which is like a variable
    in a language C) is called an object. Computations in object-oriented programming
    languages are carried out by instantiation of objects and communication between
    them that result in method invocations. Most of the well-known languages that
    are designed for object-oriented programming are Smalltalk 80, Eifel, and Java.
    Languages such as C++ and Ada 95 provide support to object-oriented programming.
    Most of the object-oriented languages are imperative, CLOS is an object-oriented
    version of the functional language LISP. The bulk of the new application software
    is written in object-oriented programming languages Because Java was the language
    choice for writing Web applications.


    Scripting languages allow you to place a list of commands, known as a script,
    in a file. The commands in script are executed, one by one, by the language interpreter.
    These languages were pioneered by sh, the scripting language for the Bourne shell
    on Unix. Some of the scripting languages were written for UNIX platforms. Some
    of the popular scripting languages are awk, cl, tk, bash, perl, BASIC, and Javascript.


    Marking languages such as Hypertext Markup Language (HTML), although called languages,
    are not really programming languages. These languages are used to specify the
    general appearance of a document, to be displayed as a Web page.


    We encourage you to browse the Web sites listed in Table 8.1 in the last section
    of this chapter to get more information on the languages that interest you.


    # 8.3.2 PROGRAMMING PARADIGMS


    Although every programming language category results in a programming paradigm,
    two of the most commonly used programming paradigms are procedural and object-oriented.
    We describe them hereby.


    In the procedural programming paradigm, data are passed to subprograms (functions
    or procedures) that process to produce the results. For example, if the median
    of the integers in an array is to be found, the array is passed as a parameter
    to the processes that perform the task. Most of the imperative languages such
    as C, FORTRAN, BASIC, and Perl are designed for the procedural style of programming.
    Although it contains object-oriented programming features, C++ also allows you
    to write programs in the procedural style of programming.


    In the object-oriented programming paradigm, also known as the data-oriented programming
    paradigm, the focus is on objects that contain data and operations (i.e., methods)
    associated with the data. Considering the above example of finding the median
    of numbers in an array in an object-oriented paradigm, we would have an object
    that contains the integer array as its data and a method for finding the median
    of integers. The median operation on the array object is performed by invoking
    its finding method. The upside of using the OO paradigm is that the resultant
    software is highly modular, which makes it easy to maintain. The downside is that
    the software is much larger than the corresponding procedure-oriented software.
    It is uncommon for a medium-size object-oriented software to spread over many
    files; becoming well-versed in file management is a more important issue for OO
    software developers than it is for procedure-oriented software developers.'
