    $

    ```


    # 1.6.2 DISPLAYING A TEXT FILE


    You can use the cat, more, or less command to display the contents of one or more
    text files. Whereas the cat command displays the whole file, the more and less
    commands display the file one screen at a time. We discuss these commands in detail
    in Chapter 2 but show the use of more with an example. The command below is used
    to display a system setup file in your home directory, called .profile, screenful
    at a time. You must hit <Spacebar> to display the next page and <B> to terminate
    the command gracefully.


