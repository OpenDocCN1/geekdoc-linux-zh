    # 1.7 SHELL METACHACTERS


    Most of the characters other than letters and digits have special meaning to the
    shell. These characters are shell metacharacters and cannot be used in shell commands
    as literal characters or without specifying them in a particular way. Try not
    to use them in naming your files. Also, when these are used in commands, no space
    is required before or after them. However, you can use spaces before and after
    a shell metacharacter for clarity.


    The shell metacharacters allow you to specify multiple files in multiple directories
    at once. We describe the use of these characters in subsequent chapters, but we
    give some examples here to explain the meanings of some used metacharacters: ?
    is a wildcard character that matches any single character and * matches zero or
    more characters. The ?txt string can be used for all the files that have a single
    character before .txt such as a.txt, G.txt, @txt, and 7.txt. The [0-9]*c can be
    used for all the files in a directory that has a single digit before .c as 3.c
    and 8.c. The lab/c string stands for lab/. Note the use of backslash (\) to quote
    (escape the special meaning of) slash (/). The following command prints the names
    of all the files in your current directory that have two-character file names
    and an .html extension, with the first character being an uppercase or lowercase
    letter. The printer on which these files are printed is hp3right.


    ```

    $ lp -P hp3right [0-9][a-zA-Z].html

    ```


