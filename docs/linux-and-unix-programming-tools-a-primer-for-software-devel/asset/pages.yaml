  md: '# Profiting C/C++ Programs 259


    In the following In-Chapter Exercise, you will use the gprof command to appreciate
    how it works and what kind of output it generates.


    # IN-CHAPTER EXERCISE


    +   13.1 Use the program in power.c from Chapter 12 power.c from Section 10.2.2
    and profile it with the gprof command. Write down the series of commands used
    to accomplish the task.


    #  13.3-2 ANALYZING THE OUTPUT OF gprof


    As shown in the preceding session, the default output of the gprof command consists
    of a flat profile and the call graph for your program under study. The flat profile
    shows the percentage of the total amount of time your program spends in each function,
    total time spent in each function (including the time spent in its descendants),
    time spent in function, the number of calls made to each function, and the time
    taken by each function in call- or milli seconds. Note that the functions prof.il
    are inserted in your code by gprof for collecting the profile data, and the amount
    of time taken by these functions indicates the overhead of profiling. Depending
    on the version of gprof, this information may or not be displayed but should not
    be considered as part of your program''s profile for the sake of analysis.


    The call graph shows percentage of the total time taken by each function, the
    amount of time taken by each function and its children, the number of times each
    function is called by other functions (with the names of the caller functions),
    and the number of times it calls other functions (i.e., its children functions).
    The output is divided into one entry per function, and the information for each
    function is separated from the next by a dashed line.


    In each entry, one line starts with an index number in square brackets. This line,
    known as the primary line, shows all information about this function, its ancestors,
    and its descendants. The lines preceding the primary line are for its caller functions
    and those that report its resident children (callee functions).


    The flat profile in the above example shows that the mygetpid function is called
    3 million times and each call takes 8000 pico seconds. The mysocket function is
    called 249 times and each call less is less than the granularity of the timer
    used by gprof to measure function execution times. The call graph shows how the
    mygetpid and mysocket functions are called from the main function. These profiles
    inform us that the mygetpid function is the bottleneck.


    The following example shows the profile for a larger program that displays the
    Huffman codes and other related information for the characters in a text file
    which is passed to the program as command-line argument. The following session
