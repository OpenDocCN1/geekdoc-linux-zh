  md: '# 3.3.3 Error Redirection


    You can change the default device associated with stderr to a different file by
    using error redirection for one execution of a command. This allows you to send
    error messages to the newly attached file instead of the display screen. The 2>
    is used for error redirection according to the following syntax, 2 is the file
    descriptor for stderr. You must specify 2 for stderr.


    ```

    ```

    command 2> error-file

    Purpose: Detach the display screen from stderr and attach ''error-file'' to it,
    i.e., error messages are sent to ''error-file'' and not the display screen

    ```

    ```


    The input of the command still comes from the keyboard and the command output
    still goes to the display screen. In the following session, the output of the
    find command goes to the display screen and error messages go to the find.errors
    file. The command reads ls -l command goes to the display screen and the error
    message goes to the error.log file. If foo does not exist, the error message ls:
    No such file or directory goes into the error.log file, as shown below:


    ```

    ```

    $ find -name foo -print 2> find.errors

    [ output of the find command ]

    $ ls -l foo 2> error.log

    [ output of the find command ]

    $ cat error.log

    ls: No such file or directory

    ```

    ```


    Keeping standard error attached to the display screen, for example, when you execute
    the cat lab1 lab2 lab3> commands is useful in many situations. If concatenate
    files lab1, lab2, and lab3 into a file called, you would like to know whether
    any of the three files are nonexistent or if you don''t have the permission to
    read. In this case, redirecting error messages to a file does not make sense,
    because you want to see the immediate results of the command execution.


    Sometimes, in shell scripting in particular, you want to ignore the output of
    a command or error messages produced by a command (you don''t want them appear
    on screen or save in a file). You can do by redirecting the output or error messages
    in a file /dev/null. Anything that goes into this file never comes out; for this
    reason, we call it the LINUX/unix black hole. In the following command, we redirect
    the error messages of the find command to /dev/null.'
