  md: '# 34 Chapter 2 Files and File Processing


    # 2.4 SOME STANDARD DIRECTORIES AND FILES IN LINUX


    Every LINUX system contains a set of standard files and directories organized
    according to the File System Standard (FSSTND) proposed in 1994. The standard
    directories contain some specific files. We describe briefly the purpose of each
    directory. The file system structure used by UNIX is similar.


    # ROOT (/


    The root directory is at the top of the file system hierarchy and is denoted as
    a slash (/). It contains some standard files and directories and, in a sense,
    is the master cabinet that contains all drawers, folders, and files.


    # /BIN


    Also known as the binary directory, the /bin directory contains binary (executable)
    commands of most essential LINUX/UNIX commands for system administrators and users.
    Some of the general purpose commands in this directory are bash, cat, chmod, cp,
    date, echo, kill, ls, mail, mkdir, more, mv, ps, pwd, rmdir, sh, stty, touch,
    uname, and vi. Some of the commands for system restoration include tar, gzip,
    gunzip, and zcat. The /bin directory also contains some of the necessary networking
    commands, including domainname (or nisdomainname), hostname, netstat, and ping.
    The /usrbin contains most of the user commands.


    # /BOOT


    This directory contains all files needed to boot the LINUX system, including the
    binary image of the LINUX kernel. (Some systems store the configuration files
    and kernel map in some other directories.) The kernel file is named vmlin (or
    vmlinux), followed by the version and release information. For example, on Red
    Hat Linux 6.1, the kernel is in the /boot/mlinux-2.2.5-15 file.


    # /DEV


    The /dev directory, which is also known as the device directory, contains files
    corresponding to the devices (terminal, disk drive, CD-ROM drive, tape device,
    modem, printer, etc.) connected to the computer. These files are also known as
    special files, and are divided into two: character special files and block special
    files. Some of the files in this directory are cdrom (for CD-ROM drive), console
    (for the console), fd (for floppy drive), hd (hard disk or a partition on a hard
    disk), isdn (for an IS connection), lp (for line printer), midi (for a media interface),
    pty (pseudo terminal), ram (for a ram disk), and tty (for a terminal). A system
    may have several devices of each type. On a network-based system that the author
    uses, there are a total of 2,361 files in the /dev directory. The Red Hat 6.1
    LINUX created 5,052 files in this directory, including 59 hard disk/partitions
    and 20 for RAM disks.


    # /ETC


    The /etc directory contains host specific files and directories. These files and
    directories contain system configuration files; they do not contain any binaries.
    The files in this directory are primarily for the use of the system administrator;
    however, an average user has permission for most of'
