    ity in the remaining sections of this chapter.


    # 4.2.1 Makefile and Make Rules


    The make utility is based on interdependencies between files, on target files
    that need to be built (e.g.,nexecutable or object files), and on commands that
    are to be executed to build the target files. The

    dependencies, targets, and commands are specified in a file, called makefile,
    as make rules.

    When make is run without a command line argument, it reads make rules from makefile.
    If the make

    rules are in a file other than makefile (or Makefile), you need to run the make
    command with the -f

    option, as in -f .makefile. The following is the syntax of a make rule.


    target-list is a list of target files separated by one or more spaces, ''dependency-list''
    (also

    known as prerequisites) is a list, separated by one or more spaces, of files that
    the target files depend

    on, and ''command-list'' is a list, separated by the new character, of commands
    that are executed to

    create the target files. Each command in the ''command-list'' must start with
    the <Tab> character. In

    older versions of make you were required to terminate a command list with a blank
    line but it is not more the case. However, you can terminate a command list with
    a blank line for backward compatibil-

    ity. Alternative syntax for a make is target-list: dependency-list; command-list

    gets where ''command-list'' is a series of commands separated by semicolons. No
    tabs should precede tar-\gets. You can continue a line by terminating with the
    backslash (\) character, as in


    ```

    /home/sarwar/courses/bin ; rm file1 file2 \

    lab213 \

    prog1.c prog2.c prog5.c

    ```'
