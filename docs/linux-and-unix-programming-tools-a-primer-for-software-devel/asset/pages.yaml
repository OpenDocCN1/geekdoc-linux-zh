    | NI | Nice Value: The nice value of a process; another parameter used in the
    computation of a process''s priority number |

    | VSZ | Virtual Size: The number in this field is the size of the memory image
    of a process (code+data+stack) blocks |

    | RSS | Resident Set Size: The amount of physical memory in kilobytes; it does
    not include space taken by the page table and kernel task structure for the process
    |

    | WCHAN | Wait Channel: Null for running processes, or processes that are ready
    to run and waiting for the CPU to be given to them. For a waiting or sleeping
    process, this field lists the event the process is waiting for—the Kernel function
    where the process resides |

    | STAT | Process State |

    | TTY | Terminal: This field shows the terminal name a process is attached to
    |

    | TIME | The time (in minutes and seconds) a process has been running for, or
    ran before sleeping or stopping |

    | COMMAND | Command: This field lists the command line that was used to start
    this process. The -f option is needed to see the full command line, otherwise
    only the last component of the pathname is displayed |


    #  6.3.2 FOREGROUND, BACKGROUND, AND SUSPENDED PROCESSES


    In Linux and UNIX, processes can run in the background or foreground. A foreground
    process is cre-ated when you type an external command (the name of a file containing
    binary code or a shell script) and hit <Enter>. A background process runs at a
    lower priority and allows the user to use shell while the process runs. Because
    a background process runs at a lower priority, a command that takes a long time
    is a good candidate for background execution. You can use the fg command to bring
    a back-ground to foreground and the bg command move a foreground process into
    the background. Here is the syntax of the fg command.


    ```

    Syntax: fg [%jobid]

    ```


    The fg command is executed without a job number (jobid), it brings the current
    job into foreground. The job that is presently using the CPU is called the current
    job.'
