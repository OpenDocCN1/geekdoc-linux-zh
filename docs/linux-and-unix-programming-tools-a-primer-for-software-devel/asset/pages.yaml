    file descriptor to access the file''s index. File System Every LINUX contains
    a set of specific files and directories organized to a standard proposed in 1994,
    known as the File System (FSSTND).


    Getty Process At system boot, LINUX starts a process on each working terminal
    attached to the system. This process runs in the superuser mode and sets attributes,
    such as baud rate, as specified in the /etc/term cap. Finally, it displays the
    login prompt and waits for a user to log on. The process name is getty and getty
    in UNIX.


    Filter A LINUX term for a command that reads input from a standard input, it processes
    in some fashion, and sends to standard output. Examples of LINUX filters are sort,
    pr and tr. First-Code, First-Serve (FCFS) Mechanism A scheme that allows the print
    requests (or any other requests) to activate on the basis of their arrival time,
    serving the first request first.


    Hidden Files Files that are not listed when you display the contents of a directory
    by using the ls command. Since the hidden files start with a dot (.) they are
    also commonly used hidden files are .bashrc (start-up file for Bash), .cshrc .profile
    (executed when you log on. For shell). All of these files reside in your


    First-Code, First-Serve (FCFS) Scheduling Algorithm A method of prioritizing value.
    In this method, the process enters the system'
