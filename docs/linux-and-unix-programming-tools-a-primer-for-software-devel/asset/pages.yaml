    $ uncompress tcsh-6.06.tar.Z

    $ tar xvf tcsh-6.06.tar

    [command output]

    ```


    Disk backups are also commonly used to pack large, inactive or infrequently used
    files to disk space.


    # 7.4 SUMMARY


    LINUX and UNIX have several utilities for creating archive (backup) copies of
    your files and directo-ries. These utilities include afio, cpio, dump, and tar.
    The tar command is the most commonly used. The backups can be in the form of tar
    or disk files. For backups, not only do you need access privileges to the tape
    device file but you also need to mount it. The disk backups are commonly used
    for software distributions, but can also be used to pack large inactive files
    to disk space. You can unpack a tar archive completely or partially (i.e., unpack
    a subset of files and directories in the archive). You can also use the tar command
