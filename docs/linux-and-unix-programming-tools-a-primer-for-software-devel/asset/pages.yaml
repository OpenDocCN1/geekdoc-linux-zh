  md: 'C programming language compilers such as gcc (see Chapters 8–12) require the
    .c extension. LINUX and UNIX do support five file types: ordinary file, directory,
    special/device file, named pipe (FIFO), and symbolic link.


    Ordinary files include text, graphic, executable, video, and postscript files.
    Directory files (commonly called directories) are containers that allow you to
    store any type of file, including subdirectories, under them. Special files represent
    devices such as keyboard, display screen, disks, and tapes. These devices are
    divided into two types: character special files and block special files. The character
    special files correspond to devices that perform character-oriented I/O, such
    as a keyboard. The block special files correspond to devices that perform I/O
    in terms of blocks or chunks of bytes, such as disk drive. A named pipe provides
    one of the several mechanisms in a LINIX system to allow processes to communicate
    with each other. A symbolic link (discussed further in Section 2.3) allows you
    to "point to" (i.e., a file that may or not reside under your home directory).
    It can be created using the ln -s command and stores the pathname for the file
    it points to. The BSD-based UNIX systems also support a sixth file type, called
    socket. A socket is an endpoint for communication between processes; the processes
    may run on the same system or on different systems over a network.


    # ## 2.3 FILE SYSTEM STRUCTURE


    Three issues are related to the file system structure of an operating system.
    The first is how files in the system are organized from a user''s point of view.
    The second is how files are stored on secondary storage (a hard disk). The third
    is how files are created, removed, and manipulated. We discuss the first and third
    issue here; the discussion of the second issue is beyond the scope of this book
    but you can read any good book on operating system principles to learn about it.


    # ### 2.3.1 FILE SYSTEM ORGANIZATION


    The LINUX/UNIX file system is structured hierarchically (like an upside-down tree).
    Thus the file system starts with one directory, the root directory, and can have
    any number of files and subdirectories under it, organized in any way desired.
    This structure leads to a parent-child relationship between a directory and its
    subdirectories or files. A typical LINUX system contains hundreds of files and
    directories, organized as shown in Figure 2.1; the organization of UNIX files
    and directories is:


    # ### 2.3.2 PATHNAMES: ABSOLUTE AND RELATIVE


    A directory in a hierarchical system is specified by a pathname. Pathnames can
    be specified in three ways: (1) starting with the root directory, (2) starting
    with the present working directory, and (3) starting with the user''s home directory.
    When a pathname is specified starting with the root directory, it is an absolute
    pathname because it can be used by any user from anywhere in the file system structure.
    For example, /home/faculty/sarwar/courses/ee446 is the absolute pathname for the
    ee446 directory under sarwar''s home directory is /home/faculty/sarwar/courses/ee446/exams/mid1.'
  merge: -1
