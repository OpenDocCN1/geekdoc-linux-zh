  md: '# 4.1 INTRODUCTION


    In this chapter, we cover file printing fully, including commands related to printing
    and printer con-control. These commands include commands for printing files, checking
    the status of print requests/jobs on a printer, and canceling print jobs.


    # 4.2 LINUX/UNIX MECHANISM FOR PRINTING FILES


    The process of printing files is similar to the process of displaying files: in
    both cases the contents of one or more files are sent to an output device. In
    the case of displaying files the output device is a display screen, whereas in
    the case of printing files the output device is a printer. Another differ-ence
    results primarily from the fact that every user has an individual screen but that
    many users share a single printer on a multipuser computer running LINUX/UNIX
    (or any time-sharing operating system). When you use the cat or more command to
    display a file, the contents of the file are sent immediately to the display screen
    by LINUX/UNIX. However, when you print a file, its contents are not sent immediately
    to the printer because the printer may be busy printing another file (y or some
    other user''s). To handle multiple requests, a first-come-first-serve (FCFS) mechanism
    places a request in a queue and processes the request in its turn when the printer
    is available.


    LINUX/UNIX maintains a queue of print requests, called the print queue, associated
    with every printer in the system. Each print request, also called a print job,
    is assigned a number, called job ID. When you use a command to print a file, the
    system makes a temporary copy of your file, assigns a job ID to your request,
    and puts the job in the print queue associated with the printer specified in the
    command line. When the printer finishes its current job, it is given the next
    job from the front of the print queue. Your job is processed when the printer
    is available and your job is at the head of the print queue.


    The work of maintaining the print queue and directing print jobs to the right
    printer is performed by a LINUX/UNIX process called the printer spooler, or printer
    daemon. The LINUX/UNIX printer daemon (lpd) starts execution in the background
    when the system boots up, and waits for your print requests. We discuss LINUX/UNIX
    daemons in Chapter 6. For now, think of a daemon as a process that runs while
    you are unaware of its presence because it does not interact with the terminal.


    # 4.3 PRINTER CONTROL COMMANDS


    LINUX and UNIX have many commands for printer control that allow you to print
    files, display the status of a print job, display the status of one or more printers
    on your local network, remove a print job from a print queue, test a printer,
    and control a printer, its print queue, and the printer daemon. Table 4.1 contains
    a list of the printing-related commands for LINUX/UNIX. The superuser—the system
    administra—tor—normally uses lpc and lpstat.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Table 4.1 List of Commands Related to Printing and Printer Control


    | Command | Purpose |

    | --- | --- |

    | System V UNIX | LINUX and BSD UNIX |

    | lp | lpr | Submit a file for printing |

    | lpstat | lpq/lpstat | Display the status of print jobs for one or more printers
    |

    | cancel | lrm | Remove or purge one or more jobs from the print queue |

    | | lpc | Printer control command |

    | | lptest | Generate a ripple pattern to test the printer |


