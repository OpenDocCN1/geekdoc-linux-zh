  md: 'under the access privileges of the user who issues the command, which is how
    the access privileges system described in this chapter works. However, a number
    of LINUX and UNIX commands need to write files that are otherwise protected from
    users who normally run these commands. An example of such a file is /etc/passwd,
    the file that contains a user''s login information (see Chapter 2). Only the superuser
    is allowed to write to this file to perform tasks such as adding a new login and
    changing a user''s group ID. However, LINUX/UNIX users are normally allowed to
    execute the password command to change their passwords. Then, when a user executes
    the password command, the command changes the user password in the /etc/passwd
    file on behalf of the user who runs this. The problem is that we want users to
    be able to change their passwords, but at the same time they must not have arbitrary
    access to the /etc/passwd file so that information about other users in this file
    cannot be compromised.


    As we stated before, when a command is executed, it runs with the privileges of
    the user running the command. Another way of stating the same thing is that, when
    a command runs, it executes with the "effective user ID" of the user running the
    command. LINUX/UNIX has an elegant mechanism that solves the problem by stating
    in the preceding paragraph and many other security mechanisms—by allowing commands
    to change their execution privilege in some way—without compromising the integrity
    of the system. LINUX/UNIX has an additional permission bit, which called the SUID
    bit, associated with it. If this bit is set for a file containing an executable
    program for it, the command takes the privileges of the owner of the file when
    it executes. Thus, if a file is owned by root and has a SUID bit, it is set for
    the password command. Then when you run the password command, it can write to
    the /etc/passwd file (replacing your existing password with the new password),
    even though you do not have access privileges to write to the file.


    Several other LINUX and UNIX commands require ownership and SUID set because they
    can access and update system resources (files, data structures, etc.) that an
    average user might not have permissions for. Some of these commands are lp, mail,
    mkdir, mv, and ps. Another use of the SUID bit is set for software that maintains
    a scores file. When the SUID bit is set for such software, it can update the scores
    when a user plays the game, although the same user cannot update the scores by
    explicitly writing to it.


    The SUID bit can be set by the chmod command using octal or symbolic mode, according
    to the following syntaxes:


