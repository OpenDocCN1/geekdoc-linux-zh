    # 10.2.3 Suffix (DEFAULT) Rules


    The make rules shown in the preceding makefile contain redundant commands. The
    make utility has many predefined make rules, also known as suffix rules, that
    allow the make utility to perform many tasks automatically. The suffix rules are
    based on the fact that C and FORTRAN compilers require their source files to have
    .c and .f suffixes. Similarly, assembly and object files carry .s and o suffixes,
    respectively. The make utility has built-in rules for many languages and UNIX
    tools such as SCCS, RCS, lex and yacc. The make -p command displays the list of
    suffix rules. In order to build a target, make traverses a chain of dependencies
    in order to decide where to start building (or rebuilding). If an object file
    does not exist, make searches for a source file according to a precedence order.
    It first looks for a .c, .f or .s for building the object file. If make does not
    find one, it continues and looks for an SCCS (with suffix .c--) and continues
    until it finds a source file. If it does not find a source file, make reports
    an exception.


    The following are definitions of the make rules for invoking a C compiler or assembler


    SUFFIXES: .o -c .s


    ```

    C.O:


    $(CFLAGS) -c $<

    ```


    ```

    S.O:


    $(AS) $(ASFLAGS) -o $@ $<

    ```


    Here, $@ stands for the name of the current target (i.e., the target being built)
    and $< stands for the name of the current dependency (in the dependency list of
    the current target) that has changed most recently than the target (see Table
    10.1 in Section 10.2.5). CC, CFLAGS, AS, and ASFLAGS are macros; see Section 10.2.4
    for further details. We show the use of suffix rules with a simple example.'
