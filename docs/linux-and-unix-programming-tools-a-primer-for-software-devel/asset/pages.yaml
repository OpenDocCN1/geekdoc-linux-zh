    # 2.2.5 Changing FILE ACCESS PRIVILEGES


    You can use chmod to change access privileges for your files. Here is a brief
    description of the chmod command.


    ```

    Syntax: chmod [options] octal-mode file-list

    chmod [options] symbolic-mode file-list

    ```


    Purpose: Change or set permissions on files in ''file-list''

    Commonly used options/features: Recursively descend through directories changing/setting
    permissions for all of the files and subdirectories under the given directory

    -f Force specified access permissions


    The symbolic mode, also known as word control, has the form <who><operator><privilege>.
    The possible values for who are u, g, a, or a combination of u, g, and o. Remember
    that u is for user (owner), g for group, o for others, and a for all. The possible
    values for operator are + (add privilege), - (remove) and = (set). The possible
    values for privilege are r, w, x, u (user''s current privileges), g (group''s
    current privileges), and o (other''s current privileges). We are not discussing
    the advanced privileges such as the sticky bit.


    Note that u, g or o can be used as a privilege with the = operator only. Multiple
    values can be used for who and privilege such as ug for the field and rx for the
    privilege field. Some useful'
