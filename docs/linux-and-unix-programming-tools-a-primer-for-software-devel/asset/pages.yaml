    # 9.4 COMPILING C/C++ PROGRAMS


    The C++ language is a superset of the C language, i.e., it has all the features
    of C and more. The most commonly used C compiler for LINUX and UNIX is gcc (GNU
    C/C++ compiler). This compiler is written for ANSI C, the most recent standard
    for C language. The gcc compiler assumes the preprocessed files are for C source
    code and C style linking (See Section 8.6 for preprocessing and linking). The
    cc command on LINUX and UNIX systems is a symbolic link to gcc. All C++ compilers,
    such as g++ (GNU compiler for C++), can also be used to compile C programs. The
    g++ compiler invokes gcc with options necessary to recognize C++ source code.
    The g++ compiler assumes that the preprocessed files are for C source code and
    C++ style linking. We primarily discuss the gcc compiler because it is the most
    widely used C compiler on LINUX and UNIX platforms. Also, most of our example
    commands in this book use C program files you could use C++ instead without changing
    the effect of the commands. We discuss compilation of C++ programs with the g++
    compiler in briefly Section 9.5 below. By default, all C/C++ compilers execute
    the executable code in the a.out file. Here is a brief description of the gcc
    command.


    ```

    Syntax: gcc [options] file-list

    ```


    Purpose: This command can be used to invoke the C compilation system. When executed,
    it preprocesses, compiles, assembles and links to generate executable code. The
    executable code is placed in the a.out file by default. This command accepts several
    types of files and processes them according the options specified in the command
    line. The files can be archive files (.a extension), C source files (.c extension),
    C source files (.C, .cc, or .cxx extension), assembler files (.s extension), preprocessed
    files (.i extension), or object files (.o extension). When a file extension is
    not recognizable, the command assumes the file to be an object or library/archive
    file. The files are specified in ''file-list''.'
