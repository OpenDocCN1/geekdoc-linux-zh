  md: '# 2.6.9 REMOVING/DELETING FILES


    When files are not needed anymore, they should be removed from a file structure
    to free up disk space to be reused for new files and directories. The LINUX and
    UNIX command for removing (deleting) files is rm. Here is a brief description
    of this command.


    ```

    rm [options] file-list


    Purpose: Remove files in ''file-list'' from the file structure (and disk)


    Commonly used options/features:

    -f    Force remove regardless of the permission for ''file-list''

    -i    Prompt the user before removing the files in ''file-list''

    -r    Recursively remove the files in the directory, which is passed as an argument.
    This action removes everything under the directory, so be sure that you want to
    do before using this option

    ```


    You need the search permissions for all the directory components in the pathnames
    and search permissions for the last directory (that contains the files to be deleted),
    but you do not need to read or write permission to the files themselves. If you
    run the command and don''t have the permission for the file to be removed, the
    command displays your access permissions for the file and prompts you for an action.


    The following command lines illustrate use of the rm command to remove one or
    more files in various directories.


    ```

    $ rm temp

    $ rm backups/temp.old

    $ rm -f phones grades ~/letters/letter.john

    $ rm ~/dir/*

    $ rm [kK]*.prn

    $ rm [a-kA-Z]*.prn

    $

    ```


    The first command removes temp from the current directory. The second command
    removes the temp.old file from the backups directory. The third command removes
    the files phones, grades, and ~/letters/letter.john regardless of their access
    permissions. The fourth command removes all the files from ~/dir1; the directories
    are not removed. The fifth command removes all the files in the current directory
    that have the .prn extension and names starting with k or K. The sixth command
    removes all the files in the current directory that have the .prn extension and
    names starting with a lowercase letter through k or an uppercase letter.'
