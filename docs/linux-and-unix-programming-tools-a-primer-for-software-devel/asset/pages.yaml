  md: '# Chapter 1 Getting Started


    # 1.1 INTRODUCTION


    UNIX and LINUX are time-sharing systems. A time-sharing system is an interactive
    system that allows multiple users to use the system simultaneously and each user
    can run multiple programs. (A running program is known as a process.) UNIX was
    born in 1969 at Bell Labs and LINUX in 1991 at the University of Helsinki, Finland.
    millions of users around the world use these systems on their office and home
    computers. In order to use a LINUX- or UNIX-based computer system, you must have
    an account on it. Once you log in, the system will run a command interpreter that
    allows you to use the system by typing commands and hitting <Enter>. Your work
    environment is set up for efficiency, easy, and secure use of the system and you
    can change many of the system setups according to your taste. In this chapter,
    we give a brief history of LINUX and UNIX, describe the logon and logout procedures,
    discuss the various LINUX and UNIX shells and important system setups, illustrate
    the use of some important general-purpose commands for the beginner, discuss the
    shell mechanisms, and list useful UNIX and UNIX-related Web sites.


    # 1.2 A BRIEF HISTORY OF THE UNIX AND LINUX OPERATING SYSTEMS


    UNIX was written by Ken Thompson and Dennis Ritchie at the Bell Labs in 1969.
    It was written in the C programming language and had many features of the MULTICS
    operating system, also developed at the Bell Labs. The development of UNIX continued
    at the Bell Labs and a different results came out. The sixth edition became quite
    popular among the academic community as it was available with source code, which
    allowed development of many practical courses in operating systems and UNIX the
    most popular operating system in the academic world during the 1980s. 1.1 describes
    the three main branches of UNIX systems as were developed from 1969 to the present.


    In response to the changing business environment in the early 1980s, Bell Labs/AT&T
    licensed releases of UNIX as System III and finally as System V, starting in 1993.
    This main branch of UNIX continued to diverge and evolve to SCO UNIX in the mid
    to late 1990s. Note that UNIX Support Group (USG), UNIX Software Development Laboratory
    (USDL), and UNIX System Libraries (USL) were commercial spin-offs of AT&T. The
    Programmer''s Work Bench (PWB) was distributed initially through US.


    The University of California Berkeley initiated and maintained the development
    of UNIX along its second main branch into the 1980s and into the 1990s. Contracts
    agreements made the operating system freely available to universities, so releases
    contributed in large part to the further popularization of UNIX. These versions
    were released as Berkeley Software Distribution, 3BSD and 4BSD-4BSD. Most recently,
    BSD UNIX survives FreeBSD and NetBSD. One of the most popular commercial UNIX
    operating systems during the 1990s, Sun Microsystems''s Solaris, is based on 4BSD.


    LINUX is a child of entropy. In October 1991, Linus Torvalds, a 21-year-old student
    at the University of Helsinki, Finland, posted the following message on the comp.min
    newsgroup:


    I''m doing a (free) operating system (just a hobby, won''t be big and professional
    like GNU) for 386(486) clones.'
