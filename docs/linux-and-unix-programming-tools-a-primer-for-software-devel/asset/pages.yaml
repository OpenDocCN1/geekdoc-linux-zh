  md: '# Glossary


    **White Box Testing** A testing technique whose goal is to identify interface
    faults by testing the software against well-thought-out test inputs, which are
    drawn up based on the structure of the code. Testers choose input data to invoke
    as many program statements in the software as possible.


    **X Window System** A graphical intermediary between the user and the LINUX operating
    system. It was developed at MIT in 1983 as part of the Athena Project and is the
    de facto LINUX GUI.


    **Xterm** An application that allows you to pull up a window that provides you
    with a command-line interface of the LINUX/UNIX system.


    **Zombie** A dying LINUX process is known as a zombie process. A process that
    exits, becomes a zombie process and it remains this state until its status is
    communicated to its parent so that it can be gracefully. Zombie processes whose
    parents terminate before them, are owned by the graddaddy “init” processSuch finished
    their work but still have some system resources allocated to them, thus resulting
    is wastage of system resources.'
