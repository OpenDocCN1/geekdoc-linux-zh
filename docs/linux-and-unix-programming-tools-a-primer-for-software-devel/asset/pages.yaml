    | stepi [count] | Same as step, except that instruction is executed |

    | whatis [expr] | Show the data type of the expression ''expr'' |

    | x expr | Display the contents of memory location identified by ''expr'' |


    # 12.4.1 USING gdb with C/C++ Programs


    As outlined in Section 12.3 above, the first step in debugging a program is to
    compile it with a compiler that includes the debugging information in the executable
    program. Then you run the executable under the debugger and obtain the required
    run-time data using various debugger commands to perform operations such as setting
    break points, single stepping through the program, displaying stack frames, and
    displaying values of variables at different places in your program. This helps
    you identify the bad code in your program. Then correct the code to remove the
    problem. The debugged code is recompiled and tested for its expected (correct)
    behavior. In this section we use a buggy C program and take you through the above
    steps to debug the program.


