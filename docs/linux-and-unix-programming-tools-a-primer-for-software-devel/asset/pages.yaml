  md: '# 12.1 INTRODUCTION


    Dynamic analysis of a program involves analyzing the program during run time.
    This phase consists of debugging, tracing, and monitoring performance of the software,
    including testing against product requirements. In this chapter, we discuss debugging
    C, C++, and Java programs under UNIX and LINUX.


    There are times when your program compiles flawlessly but does not behave properly
    when you run it—either crashes or produces wrong output for simple input. This
    means that your program is syntactically correct but has some logic errors. Such
    programs are commonly known as “buggy” programs. You need to identify the problematic
    code (the “bug”) in your program and make appropriate changes in it, so that the
    program works correctly. To be a successful programmer, you must be proficient
    in debugging. Identifying the problem-code is the most difficult and time-consuming
    part of the debugging process. Once you know the problem, you can make the necessary
    changes in your code to make it work correctly. To isolate the bad code, you need
    to examine the logic of your program. Several techniques will help you find bugs
    in your code, but the proper and efficient way to do so is to use a tool called
    a debugger. Several debuggers are available on LINUX and UNIX systems, the most
    popular of which is GNU gdb. In this chapter we discuss the most useful features
    of gdb.


    Before proceeding we would like you to appreciate the difference between debugging
    and testing. In debugging, you start with a non-working program (that either crashes
    or doesn''t produce expected output even for the simplest input) and you take
    various actions to make it work for simple input data. In testing, you start with
    a working program and run it against a set of input data (expected and unexpected)
    to ensure that it produces expected output. Toward the end of the chapter we touch
    on some of the important elements of testing.


    # 12.2 SOURCE CODE DEBUGGING


    Debugging software is a time-consuming and difficult task. It consists of monitoring
    the internal work of your code, examining the values of program variables and
    values returned by functions, and executing functions with specific input parameters.
    Two approaches can be used for this purpose.


    # 12.2.1 USING printf OR cout


    Many C/C++ programmers tend to use printf or cout statements at appropriate places
    in the programs to display the values of program variables to help find the origin
    of a bug. This technique is simple and convenient, and it works well for small
    programs. For large software, an error may be hidden deep in a function hierarchy,
    this technique takes a lot of time in editing, adding and removing printf or cout
    statements in the source file. In every time you insert or delete an output statement,
    you must recompile and relink your code, which is quite inconvenient. Also, this
    technique does not identify the source of a fatal error as “segmentation fault.”
    We recommend that you don''t make a habit of using this approach for debugging
    your programs. For example, if you are trying to debug a multithreaded software,
    running your program through a debugger may be your best option. For example,
    if the debugger changes the program so that locating the error will become extremely
    difficult.'
  merge: -1
