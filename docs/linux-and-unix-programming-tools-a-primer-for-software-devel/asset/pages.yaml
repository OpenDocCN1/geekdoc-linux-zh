    # 8.7 THE SOFTWARE ENGINEERING LIFE CYCLE


    A software product is developed in a sequence of phases, collectively known as
    the software life cycle. Several life-cycle models are available in the literature
    and used in practice. The life cycle used for a specific product depends on its
    size, the nature of the software to be developed (scientific, business, etc.),
    and the design methodology used (object-oriented or classical). Some of the commonly
    used life-cycle models are build-and-fix, water-fall, water-fall, and spiral.
    The common phases in life-cycle models are requirement analysis, specifications,
    planning, design, coding (i.e., program development), testing, installation, and
    maintenance. A full discussion of life-cycle models and their phases is outside
    the scope of this textbook—in particular, the LINUX/UNIX program development tools
    that can be used in this phase.


    The program development process consists of three steps: program generation, static
    analysis of the source code, and dynamic analysis of the executable code. The
    purpose of the program generation phase is to create source code and generate
    the executable code for the source code. Hence it involves tools for editing text
    files, indenting the source code properly, compiling the source code, handling
    modulebased software, creating libraries, managing the source code, and controlling
    revisions. The static analysis phase consists of verifying the source code for
    portability and measuring metrics related to the code (e.g., the number of calls
    to a function and the time taken by each function). The dynamic analysis phase
    consists of debugging, tracing, and monitoring the performance of the software,
    including testing it against product requirements. In the remaining chapters of
    this book we describe LINUX/UNIX tools for all three steps. The depth of discussion
    on each tool depends on its usefulness, the frequency of its use, and how widely
    it is available on various LINUX/UNIX platforms.'
