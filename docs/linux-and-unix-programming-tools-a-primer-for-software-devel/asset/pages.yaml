    # File Security


    OBJECTIVES


    +   - To discuss briefly the basic mechanisms provided by LINUX and UNIX for file
    protection

    - To describe in detail file protection based on access permission

    - To discuss default permissions for files and directories

    - To describe the mechanism used by LINUX and UNIX to set default permissions

