  md: '# 8.1 INTRODUCTION


    A typical LINUX/unix system has support for several high-level programming languages,
    both interpreted and compiled. These languages include C, C++, Java, Perl, LISP,
    and FORTRAN. Most of the application software for the LINUX/unix platforms is
    written in the C language, the language in which the LINUX/unix operating system
    is written. A range of software development tools are available on the LINUX/unix
    platform for developing software in the C language. Many of these tools can also
    be used for developing software in other programming languages such as C++ and
    Java.


    The LINUX/unix operating system has a wealth of software development tools for
    program generation and static analysis of programs. These tools include editing
    source code, indenting source code, compiling and linking, handling module-based
    software, creating libraries, profiling, verifying source code for portability,
    code management, debugging, tracking, and performance monitoring. In the remaining
    chapters, we describe some of the commonly used tools in the development of software
    in C and, to some extent, C++ and Java languages. The depth of coverage of these
    tools varies from brief to detailed, depending on their usefulness and how often
    they are used in practice. In this chapter, we briefly various types of programming
    languages that can be used to write computer software. In doing, we also discuss
    categories of programming language paradigms, interpretation and compilation processes,
    and the software lifecycles. We list some Web resources at the end of the chapter.


    # 8.2 AN OVERVIEW OF COMPUTER PROGRAMMING LANGUAGES


    Computer programs can be written in a wide variety of programming languages. The
    native language of a computer is known as its machine language, the language comprising
    the instruction set of the CPU inside the computer. Recall that the instruction
    set of a CPU consists of instructions that the CPU understands. These instructions
    enable the performance of various types of operations on data, such as arithmetic,
    logic, shift, and I/O operations. Today''s CPUs are made of bi-state devices (which
    operate on or off states), so the CPU instructions are in form of 0s and 1s (for
    the off state and 1 for the on state). The total number of instructions for a
    CPU and the maximum length (in bytes) of an instruction are CPU-dependent. The
    CPUs based on complex instruction sets (CISC) have several hundreds of complex
    instructions, while CPUs based on reduced instruction sets (RISC) have fewer simple
    instructions. Programs written in a CPU''s machine language are known as machine
    codes. The machine language programs are the most efficient because they are written
    in a CPU''s native language. However, they are the most difficult to write because
    the machine language is very different from any spoken language; the programmer
    has to write these in 1s and 0s, and a change in one bit can cause major problems.


    Debugging machine language programs is a very challenging and time-consuming task
    as well. In assembly programming, machine instructions are written in English-like
    words, called mnemonics. However, these programs must be translated into the machine
    language of the CPU used in your computer before you you can execute them. This
    process of translation is carried out by a program called an assembler. You have
    to execute a command to run an assembler,'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# An Overview of Computer Programming Languages


    with the file containing an assembly language program as its argument. Although
    languages are becoming less popular, they are still used to write time-critical
    programs for controlling real-time systems (e.g., controllers in drilling machines
    for oil wells) that have limited amount of storage.


    In an effort to bring programming languages closer to the English language—and
    to make programming and debugging easier—high-level languages (HLLs) were developed.
    Commonly used high-level languages are Ada, C, C++, JavaScript, BASIC, FORTRAN,
    LISP, Pascal, Perl, and Prolog. Some of these high-level languages are interpreted
    (e.g., JavaScript, Perl, BASIC, and LISP), whereas others are compiled (e.g.,
    C, C++, and Java). Programs written in an interpreted language are executed one
    instruction at a time by an interpreter, translating them into the machine code
    for the CPU used in the computer. Programs written in compiled languages must
    be translated into the machine code for the underlying CPU before they are executed.
    This translation is carried out by a compiler, which generates the assembly version
    of the high-level language program. The assembly version has to go through further
    translation before the executable code is generated. This translation is carried
    out by a program, called an assembler. The compiled languages run many times faster
    than the interpreted languages because compiled languages are executed directly
    by the CPU, whereas interpreted languages are executed by a piece of software
    (an interpreter).


    However, the Java language is not compiled in the traditional sense. Java programs
    are translated into a form known as the Java Bytecode, which is interpreted by
    an interpreter, called the Java Virtual Machine (JVM). You can also compile Java
    programs with a just-in-time (JIT) compiler to run directly on a native processor.


    To simplify the task of writing computer programs, languages at a higher level
    even than the HLLs developed. They include scripting and visual languages such
    as LINUX/Unix shell programming in Bash (or another shell), Perl, and visual BASIC.
    Some of these languages are interpreted; others are compiled. Figure 8.1 shows
    the proximity of various types of programming languages to the hardware, ease
    of their use, and relative speed at which programs are executed. Although fourth-generation
    languages were supposed to be even more English-like, they aren''t, so some would
    argue against languages like Perl and Visual Basic being classified as fourth-generation
    languages and categorize them instead as different types of HLLs.


