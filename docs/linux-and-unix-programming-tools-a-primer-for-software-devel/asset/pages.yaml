  md: '# 8o Chapter 3 Input/Output Redirection


    ```

    $ find / -name ls -print > /dev/null

    /bin/ls

    ```


    You can use the following command to redirect both the output and error messages
    of the find command to /dev/null. Although, such a command does not make much
    sense when executed at the command line, it is sometimes used in shell scripts
    to check the execution status of a command (to determine whether the command executed
    successfully or not).


    ```

    $ find / -name ls -print > /dev/null 2> /dev/null

    ```


    # 3.3.4 Redirecting STDIN, STDOUT, and STDERR in One Command Line


    You can combine I/O and error redirection in a single command line. The position
    of error redirection in the command line is important because the command line
    content for file redirection is evaluated from left to right. In the following
    command, the sort command sorts lines in a file called and stores the sorted data
    in the students.sorted file. Note again that 0, 1, and 2 are used to specify stdin,
    stdout, and stderr. If the sort command fails to start because the students file
    does not exist, the error message goes to the display screen and not to the file
    sort.error. This happens at the time the shell determines that the students file
    does not exist, the standard error is still attached to the console.


    ```

    $ sort 0 < students 1> students.sorted 2> sort.error

    ```


    For the following command, the error message goes to the sort.error file if the
    sort command fails to start because the students file does not exist. This is
    because the shell processes the error redirection before it determines that the
    students file is nonexistent.


    ```

    $ sort 2> sort.error 0 < students 1> students.sorted

    ```


