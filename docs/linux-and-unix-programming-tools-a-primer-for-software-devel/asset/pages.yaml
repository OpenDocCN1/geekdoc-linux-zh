    5) to read the source file (the file to be copied) and permission to search the
    directories that contain the source and destination files. In addition, you must
    have write permission for the directory that contains the destination file if
    it does not already exist. Here is a brief description of this command

    If the destination file exists, you don''t need permission for the directory that
    contains it you must have write permission for the file. If the destination file
    exists, by default, it will be overwritten without you if you have permission
    to write to the file. To be prompted for an existing file is overwritten you use
    the -i option. If you don''t have permission to write to the destination file,
    if you don''t have permission to read the source file, an error message will appear
    on your screen.'
