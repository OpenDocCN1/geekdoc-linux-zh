    Having the ability to view the head (some lines from the beginning) or tail (some
    lines from the end) of a file is useful in identifying the type of data stored
    in the file. For example, the head operation can be used to identify a PostScript
    file or a encoded file, which have special headers. The LINUX and UNIX commands
    for displaying the head or tail of a file are head and tail. Without an argument,
    these commands take input from standard input. By default, display 10 lines of
