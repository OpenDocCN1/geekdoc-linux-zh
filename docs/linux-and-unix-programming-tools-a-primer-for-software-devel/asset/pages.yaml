  md: '# Questions and Problems


    When you log on to a LINUX computer, the system runs a program called a shell
    that gives you a prompt and waits for you to type commands, one per line. When
    you type a command and hit <Enter>, the shell tries to execute the command, assuming
    that the first word in the command line is the name of the command. A shell program
    is therefore also called a command line interpreter. The shell has the code for
    executing a built-in command, but the code for an external command is in a file.
    To execute an external command, the shell searches directories, one by one, to
    locate the file that contains the code for the command. If the file is found,
    it is executed if it contains code (binary or script). The names of the directories
    that the shell searches for an external command make what is known as the search
    path. The search path is stored in a shell variable called PATH (for the Bourne
    shell) or path by adding new names in PATH or deleting some existing directory
    names from.


    Several shells are available for you. These shells differ in terms of use at the
    command line level and features available in your programming languages. The most
    commonly used shells in LINUX-based systems are the Bourne and TC. The Bourne
    shell is the superset of the Bourne shell and has an excellent programming language
    and rich command-level interface. The TC shell has many of the interactive features
    that Bash does but its programming features less powerful.


    For efficient, easy, and secure use of the system, the system administrator sets
    up your work environment with various setups. These setups are stored in environmental
    variables as TERM (for terminal type). You can change some of the setups for your
    taste.


    There are several thousand commands, utilities, and tools in a typical LINUX system.
    Some of the most useful for a beginner are mkdir (make directory), rdir (remove
    directory), cd (change directory), ls (list name of files in a directory), pwd
    (print name of the current/working directory), lpr (print files), cat (display
    files at one time), more (display files screen at a time), less (display files
    screen at a time), cal (display calendar), date (display today''s date and current
    time), and history (display command history)


    Certain characters, called shell metacharacters, have special meaning to the shell.
    The shell treats them in special ways, they should not be used in file names.
    If you must use them in commands, you need to quote them so that the shell will
    treat them literally.


