    # 14.2.15 RCS SPECIAL CHARACTER SEQUENCES


    You can place any of several special character sequences in the comment header
    of a source file. These sequences are processed specially by RCS and are expanded
    to include information from the RCS log for file. The general format for these
    special sequences is $string$. This sequence results in the expansion of string
    by RCS. This expansion takes place when you check a file into the RCS directory
    and is in place the next time you check out the file. Table 14.1 shows some of
    these sequences and their expanded values.'
