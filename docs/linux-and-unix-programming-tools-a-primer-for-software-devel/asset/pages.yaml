  md: '# Chapter 13 Software Profiling and Metrics


    expensive segments of your program because it identifies the functions that are
    causing bottlenecks in the software. You can use this information to improve the
    performance of these program segments by optimizing them. A brief description
    of the tool follows.


    ```

    gprof [options][executable-file [profile-data-files]]

    ```


    **Purpose:** Display execution profile of the C/C++ program in ''executable-file''
    (or ''a.out'' if not specified) by using the profile data taken from the file
    ''profile-data-files'' (''gmon.out'' if not specified)


    Commonly used options/features:


    +   -b Do not display a description of each field in the field

    -e name Do not display profile information for the routine ''name'' and all its
    descendants; more than one -e option may be given in order to suppress display
    for multiple routines

    -E name function as the -e option; also excludes the time spent in the ''name''
    routine (and its descendants) when computing total and percent times

    -f name Display profile information for the routine ''name'' and all its descendants;
    more than one -f option may be given in order to display for multiple routines

    -F name Same function as the -f option; also uses the time spent in the ''name''
    routine (and its descendants) when computing total and percent times

    -z Display names of those routines that have zero usage


    When you specify an object file as a parameter to the **gprof** command, it establishes
    the relation between its symbol table and the call graph profile in the gmon.out.
    The output shows two types of profiles. The first, known as the **flat profile**,
    shows the amount of time your program spent in each function and how many times
    each function was called. This profile allows you to identify those functions
    in your program that take most of the program execution time. The second profile,
    known as the **call graph**, shows how much time was spent in each function and
    its descendants. It includes, for every function, the functions it called, and
    the call count. It also displays an estimate of the time (in milli- or microseconds)
    spent in each function, including each function''s children (i.e., the functions
    called). This profile helps you to identify functions which may not be very consuming
    themselves but which other functions are costly. Having such information allows
    you to eliminate the expensive function calls. If the parent of a function cannot
    be determined, the string <spontaneous> is displayed in the name field and all
    the other fields are blank. Sometimes happens for the main function.'
