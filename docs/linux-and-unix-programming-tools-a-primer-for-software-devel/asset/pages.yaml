    # 2.5 DIRECTORY OPERATIONS AND BROWSING THE FILE SYSTEM STRUCTURE


    While using LINUX or UNIX system, you normally create ordinary files by using
    tools such as editors and compilers. For example, you can use a text editor to
    create the source code file for your software in a particular programming language
    as C, C++, and Java. Once you have created the source code, you can compile it
    to generate the executable (binary) code for it.


    In order to organize your work systematically, you should create and maintain
    a hierarchical structure under your home directory. This requires operations of
    creating, moving, and removing directories. So that you can move around your directory
    hierarchy, you will be able to get into a directory and browse it. LINUX/UNIX
    provides commands for performing all of these tasks.


    # 2.5.1 CREATING AND REMOVING DIRECTORIES


    You can create a directory using the mkdir command and remove an empty directory
    with the rmdir command. Both commands work with absolute or relative pathnames.
    Here are brief descriptions of these commands.


    | Syntax: mkdir [options] dirnames |

    | Purpose: Create directories specified in ''dirnames'' |


    | Syntax: rmdir [options] dirnames |

    | Purpose: Remove the empty directories specified in ''dirnames'' |


    When executed with the -p option, these commands allow you to create and remove
    a sequence of directories with the parent-child relationship.'
