  md: '# Table 14.1 RCS Special Character Sequences and Their Expanded Values


    | Character Sequence | Replaced with |

    | $Author$ | Author''s login name |

    | $Date$ | Current date and time |

    | $Header$ | Full pathname of the RCS file in the repository, revision number,
    date and time of last change, author, and state. |

    | $ID$ | Like $Header$ but without the full pathname of the RCS file |

    | $Name$ | Name of the label (tag) if one exists, or blank if the file doesn''t
    have a label |

    | $RCSfile$ | Name of the RCS file |

    | $Revision$ | The highest revision number |

    | $Source$ | Name of the source file |


    The comment header


