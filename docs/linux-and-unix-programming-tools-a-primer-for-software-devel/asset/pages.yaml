  md: '# 192 Chapter 10 Compiling and Linking Multimodule Software


    The make utility has a predefined rule that invokes the gcc -c xxx.c -o xxx.o
    command for the rules whose targets are .o files, as


    ```

    xxx.o: xxx.c zzz.h

    gcc -c xxx.c

    ```


    Furthermore, the make utility recognizes the name of an object file is usually
    the name of the source file. This capability is known as a standard dependency,
    and because of it you can leave xxx.c from the dependency list corresponding to
    the target xxx.o. Note how important it is to follow standard naming of files.
    The following make therefore works as well as the one given previously.


    ```

    $ cat makefile

    power: main.o input.o compute.o

    gcc main.o input.o compute.o -o power -lm

    main.o: main.h input.h compute.h

    input.o: input.h

    compute.o: compute.o

    $

    ```


    Running the make command with this makefile produces the following result, which
    is the same as produced by the make command when executed with the makefile that
    does not take advantage of any suffix rules.


    ```

    $ make

    gcc -c main.c -o main.o

    gcc -c input.c -o input.o

    gcc -c compute.c -o compute.o

    gcc main.o input.o compute.o -o power -lm

    $

    ```


    # 10.2.4 MACRO SUPPORT OF THE UTILITY


    The make utility supports macros that allow simple text substitution. You must
    define the macros before using them; they are usually placed at the top of the
    makefile. A macro definition can have one of the two forms:


    | Syntax: | 1. macro_name = [text] |

    | | 2. define macro_name [text] endif |'
