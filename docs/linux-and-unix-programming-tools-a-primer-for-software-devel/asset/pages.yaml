    # 14.3.14 Remote Repositories And Accessing Them Through a Client


    CVS allows you to maintain your sandbox and source repositories on different machines.
    Using CVS in this style is known as the client/server operation. The machine that
    mounts your sandbox is known as the client and the machine that mounts your source
    repository is known as the server. You need to use the following format for accessing
    a source repository maintained on a remote host.

    :method:[user-name]:[password]@Hostname[:[port]]:source-repository

    Here ''source-repository'' is the absolute path of the source repository. If ''method''
    is not specified, and the repository name contains ''.'', then depending on your
    platform, the default method is ''ext'' or ''server''. If your user name is the
    same on both hosts, then you can omit ''user-name''. Suppose that your local machine
    is willamette.pdx.com and your user name is john. You want to access a module
    project1 in the source repository /home/share/projects on a remote host columbia.pdx.com.
    If your user name on the remote machine is also john, then you need to use the
    following command to check out the module.


    ```

    $ cvs -d columbia.pdx.com:/home/share/projects checkout projects

    ...

    $

    ```


    If your user name on the remote host is dave (not john), then you need to use
    the following command to check out project1.


    ```

    $ cvs -d dave@columbia.pdx.com:/home/share/projects checkout projects

    $

    ```


    CVS uses the rsh command to perform remote operations, which means that your local
    host must be a trusted host and/or you must be a trusted user on the remote host.
    Thus the remote host''s /etc/hosts.equiv file must have an entry like the following
    for you (user name john) to be able to access the remote source repository.

    willamette.pdx.com john

    If such an entry does not exist in the /etc/hosts.equiv file on the remote host
    then the remote user''s (dave''s in our case) -/.hosts file must contain this
    entry.'
