    # 10.2.7 Special Targets


    The make utility has some predefined targets that are treated by it in a special
    way. These targets are known as special targets. Some of these targets are briefly
    described in Table 10.2. Except for the .PHONY target, all other special targets
    are global, i.e., they apply to the entire build.


    In some of the previous sections, we used the following make rule to clean up
    all the modules from the build directory.


    clean:


    ```

    rm *.o

    ```


    If the directory does not have a file called clean, you can invoke the make clean
    command for cleaning up the build directory without any problem. If a file called
    clean exists in your build directory, invocation of the command will result in
    the message make: ''clean'' is up to date, and the command will not execute.


    | Table 10.2 Some Special Targets and Their Purposes |

    | Special Target | Purpose |

    | .DEFAULTS | If make cannot find any makefile entry or rules for building a target,
    it executes the commands associated with the target. |

    | .IGNORE | make ignores errors and continues to build if the makefile contains
    this target on a line by itself; normally, make stops if a command exists abnormally,
    with option -i does the same thing. |

    | .PHONY | Allows you to specify a target that is not a file so you can instruct
    make to invoke a sequence of commands from the makefile even if a file with the
    name exists in your current directory. |

    | .SILENT | make executes commands without displaying them. with option -n does
    the same thing. As discussed in Section 10.2.5, you can execute a particular command
    silently by putting an @ sign before the command. |

    | .SUFFIXES | The prerequisites (suffixes) specified for this target become associated
    with the suffix rules. If no prerequisites are associated with this target, the
    existing suffix list is removed. |'
