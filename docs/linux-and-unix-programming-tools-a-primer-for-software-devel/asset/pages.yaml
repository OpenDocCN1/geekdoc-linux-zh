  md: '# 14.3.15 USING CVS UNDER emacs


    You can use the version control (vc) mode of the emacs editor to invoke cvs commands.
    As stated earlier, a vc mode command is C-x v followed by a single letter. Before
    starting emacs, you must set the CVS environment variable correctly. The C-x v
    command does the next right in most cases. For example, if a file is read-only
    C-x v will check it for editing. If the file is an editable version, C-x v will
    commit a modified file that has already been registered for version control. The
    C-x v command unchecks the current file and reverts to the previous version. The
    C-x v 1 command shows the CVS history (version log) of the file. The C-x v - command
    prompts you for a revision number and retrieves the given version of the file
    in another window. The C-x v s command prompts for a label name and gives that
    label to the version tree.


    # 14.3.16 IMPORTANT ASPECTS OF CVS


    The following are some aspects of CVS that you should be aware of:


    +   - CVS does not support for version control directories.

    - Although it does support for binary files, CVS is mostly used with text files.

    - CVS is not a "bug-tracking" or build system.

    - If you are working with remote repositories with a client, it is important to
    know that the rsh and pserver transmits data in plain text.

    - A local repository must have write permissions for developers, which leaves
    it open to hacking by a developer.


    # 14.3.17 OBTAINING AND INSTALLING CVS


    Installing CVS on your system is simple but you must log on as root. Before installing
    CVS on your system, first determine if it is already installed. You can do this
    by running any of the following commands: cvs -v, where cvs is, or find / -name
    cvs -print 2 > /dev/null. If CVS is not installed on your system then you need
    to perform the following steps for its installation.


    +   1. Obtain a tar archive of the CVS that you want to install from the primary
    CVS site ftp.cvhome.org or one of its mirror sites.

    2. Unpack the tar archive in the directory where you want to install CVS by running
    the tar command.

    3. Change directory to the cvs-version directory (where ''version'' is the CVS
    version you are installing as 1.11) and generate the CVS binary using the ./configure
    and make commands.

    4. Install CVS by running the make install command.


    In the following session, we show the installation of CVS version 1.11 in the
    /usr/local directory; the CVS source distribution is stored in the /usr/local/src/cvs-1.11
    directory. The compressed (with gzip) tar archive of cvs-prompt is stored at ftp.cvhome.org/pub/cvs-1.11.cvs-1.11.tar.gz.
    In the following session, we use the # prompt to indicate that you are logged
    in as root.'
