    # 14.3-3 Creating a Source Repository


    The sources maintained by CVS are kept in a directory called the source repository.
    The source repository contains the RCS history ("v") files for the sources and
    a directory, CVSROOT, that contains administrative files. You do not need to access
    files in the CVSROOT directory while performing simple, routine development tasks.
    Before using CVS, you need to set up the location of your source repository, create
    it, and move the source modules into it. In order to modify your source modules,
    check them out into your work area, also known as the sandbox. After modifying
    your copies of the source modules in the sandbox, check their updated versions
    back to the source repository.


    You can specify the pathname of the source repository as an argument to the cvs
    -d command or set up the environment variable, CVSROOT, to contain the absolute
    pathname of your source repository. The location of your source repository normally
    stays the same during the development of a product, setting it up in a system
    or shell startup file saves a lot of time. You can choose any name for your source
    repository butroot is commonly used. For the examples in this book, we want to
    make the ~/cvsroot directory our source repository and set up the CVSROOT variable
    to this pathname. We use the CVSAREA variable (a user-defined variable) to store
    the location of our CVS sandbox, where checked out modules are to be stored for
    modification. In the following session, we show how to perform this task for Bash.


    ```

    $ cat --.bash

    ..

    CVSAREA~/projects

    CVSROOT=~/cvsroot

    export CVSAREA CVSROOT

    $ source -/.bashrc

    echo $CVSROOT

    /home/faculty/sarwar/cvsroot

    $

    ```


    For the TC shell, you will insert the following lines in the ~/tcshrc file.'
