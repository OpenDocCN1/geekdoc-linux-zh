    subdirectory (subdirectories) in a shared directory. You then run RCS utilities
    by specifying the complete pathnames for the RCS files and editing files in your
    local directories. An alternative to creating a common shared directory is to
    maintain all RCS directories in one user''s directory and create symbolic links
    (see Chapter 2) to this directory in the directories of the remaining members
    of the group. Of course, appropriate access privileges must be set for all components
    in the pathname for the RCS directory.


