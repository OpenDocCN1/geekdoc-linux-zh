  md: '# File Processing 45


    You can use metacharacters to specify file names. The contents of all the files
    in the current directory can be displayed by using the *cat* command. The *cat
    exam* command displays all the files in the current directory starting with the
    string followed by one character. The contents of all the files in the current
    directory starting with the string lab can be displayed using the *cat lab* command.
    The *cat prog[1-3]*c command can be used to display files prog1.c, prog2.c, and
    prog3.c.


    When the cat is used without an argument, it takes input from standard input at
    a time and sends it to standard output. By default, standard input for a command
    is the keyboard and standard output is the display screen. When, the *cat* command
    is executed without an argument, it takes input from the keyboard and sends it
    to the screen one line at a time. The command terminates when the user presses
    \<Ctrl-D>, the LINUX/UNIX end-of-file marker, by name.


    At times you need to display the contents of a file with line numbers. You typically
    need to do so, during the software development process, a compilation of your
    source code results in errors containing lines of the source program. You can
    use the *cat -n* or *nl* command to display lines in a file with line numbers,
    as in *cat -n lab1.c* or *nl lab1.c*. You can display files with a page header
    containing a time stamp, file name, and page number with the pr utility, as we
    discuss the *cat* command further in Chapter 4.


    You can use the *tac* (reverse of cat) command to display files in the reverse
    order.


    # ## 2.6.4 Viewing Files One at a Time


    If the file is viewed larger than one page, you can use the *more* or *less* command,
    as known as the LINUX/UNIX pages, to display the file restful at a time. We discuss
    these commands by one.


    When without a file argument, the more command, like the *cat* command, takes
    input from the keyboard one line at a time and sends it to the display screen.
    If file-list (a list of file names separated by spaces) is given as an argument,
    the cat command displays the contents of the file in file-list screen at a time.
    To display the next screen, press the \<space bar>. To display the next line in
    the file, press \<Enter> (or \<Return>). At the bottom left of a screen, the command
    displays the percentage of the file that has been displayed up to point. To return
    to the shell, press the \<Q> key. Here is a small description of the *more* command.


    | more [options] [file-list] |

    | --- |

    | **Purpose:** Concatenate the files in file-list and send them to standard output
    (screen by default; see Chapter 3) a restful at a time |

    | **+/str** | Start two lines before the first line containing str |

    | **-NN** | Display N lines per screen |

    | **+N** | Start displaying the contents of the file at line number N'
