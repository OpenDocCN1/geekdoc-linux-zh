  md: '# Chapter 1 Getting Started


    # 1.3 LOGON AND LOGOFF PROCEDURES


    The LINUX and UNIX systems are multiprocess, multiuser, and interactive computing
    environments. Multiprocess means that a user can start and run several computational
    processes or programs at once. Multiser means many users can be using the same
    system at the same time; logging on and logging off are necessary, because each
    individual user must identify and differentiate him or herself on the system when
    he enters and leaves. LINUX/UNIX can be run on a standalone computer, such as
    a PC, or on a PC that is part of a network, but identification of the individual
    user via login is mandatory, because the access privileges the user enjoys maintain
    system integrity and performance, and other users need only to be able to run
    applications and store files on the standalone computer.


    There are two approaches to logging on and logging off a LINUX or UNIX system:
    a text-based (i.e., commandline) interface or a graphical user interface (GUI).
    Since this books deals with command interface, we explain the methods of logging
    on and logging off using a text-based interface. GUI-based methods for logging
    on and logging off are not any different from the prompt in a window.


    A text-based interface uses one of three basic methods, or a combination of two
    or more. Variations are affected by the system setup or any single component.
    The basic methods are as follows:


    +   1. Standalone connection: In the standalone method a computer is dedicated
    to a single user who logs on to use LINUX or UNIX on hardware platform. In methods
    1 and 2, when used with a text-based interface, look lovely and feel exactly like
    a LINUX or UNIX using this method.


    +   2. Local area network (LAN) connection: In any LAN the terminal has little
    or no compute power—acts as a dumb graphical server—and the computer can serve
    many terminals. The terminal is connected via a high-speed communications link
    to a single computer or multiple computers that are all connected to a LAN, and
    the terminal is the user''s interface to the operating system running on the single
    or multiple computers. This method could also be called intranet power to log
    in to a LINUX/UNIX server.


    +   3. Internet connection: The Internet method is similar to LAN login. In its
    simplest form, a remote, standalone computer, via software as Windows Telnet for
    the PC or NCsa Telnet for Macintosh, connects to a LINUX/UNIX system over high-speed
    telecommunications link. The telnet server then becomes the graphical server,
    allowing the user to log in and use a remote computer or system that is running
    LINUX or UNIX. This method could also be called Internet login. A variation of
    this method involves using the UNIX telnet command to establish a connection between
    a LINUX/UNIX machine acting as a client and a LINUX/UNIX machine acting as a telnet
    server. For example, if you want to log on to the LINUX/UNIX machine whose fully
    qualified login name is unix1.school.edu. you will be prompted for login name
    as if you are using a standalone LINUX/UNIX computer. You can use the IP address
    of the machine in dotted decimal notation 201.25.10.29 instead of its domain name,
    as in telnet. A variation of this method not covered in this textbook is the use
    of SLIP or PPP to dial to a host computer over a communications line.'
