  md: '# 10.1 INTRODUCTION


    Most useful software is divided into multiple source files; each file is called
    a module. This multimodule structure has several advantages over a monolithic
    structure, where the entire program is stored in a single file; smaller program
    files are easier to manage and maintain, that is, are time-consuming to edit,
    compile, test, and debug. A modular structure also allows recompilation of only
    those files that have been modified, rather than the entire software. Furthermore,
    the multimodule structure supports information hiding, the key feature of object-oriented
    (OO) design and programming. This information hiding is especially important when
    programming in procedural languages, such as C, that do not support for information
    hiding in them.


    However, the multimodule implementation also has its disadvantages. First, you
    must know the files that constitute the entire system, the dependencies of these
    files (i.e., which files need compilation), and which files have been modified
    since you built the last executable system. Also, compiling multiple files to
    create an executable sometimes becomes a nuisance when you''re dealing with multimodule
    C/C++ software, because you must type two long commands: one to create objects
    for all C/C++ source files, and other to link the object files to create one executable
    file. An easy solution is to create a simple shell script that writes both commands.
    The disadvantage of using a script is that, if one source file (or a header file)
    is modified, all object files are recreated most unnecessarily.


    # 10.2 THE MAKE UTILITY


    LINUX has a much powerful tool, called make, that allows you to manage compilation
    and linking of multiple modules into an executable. It offers a powerful and flexible
    mechanism for building large-scale software products that supports consistent,
    streamlined updating. The make utility reads a specification file, called makefile,
    that describes how the modules of a software system depend on each other. The
    make utility uses this dependency specification in the makefile and modifies times
    of various components to minimize the amount of recompilation. This is very useful
    when your software system consists of tens of files and several executable programs.
    In such a system, remembering and keeping track of all header, source, object,
    and executable files can be a nightmare. The make automatically triggers the execution
    of commands when certain files are older or younger than other files. You make
    to ensure that you never forget to run the commands that have to be executed when
    you update some of your files. It is important to note that makefiles need to
    be modularized also, especially as the complexity of the system they monitor increases.
    With a brief description of the syntax and of the commonly used options of the
    make utility


    ```

    make [options] [targets] [macro definitions]

    ```


    Purpose: This utility updates a file based on the dependency relationship stored
    in a file, called Makefile or Make. ''Options'', ''targets'', and ''macro definitions''
    can be specified in any order.'
