  md: '# 2.3.3 HOME AND PRESENT WORKING DIRECTORIES


    When you log on, the LINUX/UNIX system puts you in a specific directory, called
    your home/login directory. For example, the directory called sarwar in Figure
    2.1 is the home directory for the user with login sar. Using the Bash or TC shell
    you can specify your home directory by using the tilde (-) character. The directory
    that you are in at any particular is called your present working directory (also
    known as your current directory). The present working directory is also denoted
    (pronounced dot). The path of the present working directory is denoted . (pronounced
    dot).


    You can use the echo pwd commands to display the pathname for your home or current
    working directory. In the following session, the first command is used to display
    the home directory and the second to display the current working directory. This
    example assumes that you are not in your home directory when these commands were
    executed. You can use the pwd command right after logging on to display the pathname
    of your home directory.


    ```

    $ echo $HOME

    /home/faculty/sarwar

    $ pwd

    /home/faculty/sarwar/courses $

    ```


    # 2.3.4 SEARCH PATH


    The names of the directories in a startup searches to find the file corresponding
    to an external command comprise the search path for the shell. The search path
    for Bash is stored in the shell variable PATH and for TC shell in path. The directory
    names are separated by colons in Bash and by spaces in the TC shell. You can display
    your search path by using the echo PATH command in Bash and the echo $PATH command
    in the TC shell. The PATH (or path) variable is defined in a hidden file (also
    known as a dot file) called .profile or in your home directory. If you find the
    variable in one of those files, it is in the startup file (a dot file) specific
    to the shell that you''re using. You can change the search path by changing the
    value of this variable. To change the search path temporarily for your current
    session PATH command you can only change the value of PATH at the command line
    and run the export command to make the new value of the PATH variable available
    wherever it is accessed in future. For a permanent change, you need to change
    the value of this variable in the corresponding dot file. In the following example,
    the search path has been changed by three directories. Moreover, the search path
    starts with ~/bin and ends with the current directory.


    ```

    $ PATH=/bin:/sbin:$PATH"


    $ export PATH

    $

    ```'
  merge: -1
