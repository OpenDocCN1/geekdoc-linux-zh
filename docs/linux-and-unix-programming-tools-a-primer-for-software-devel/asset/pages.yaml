    # 7.3 SOFTWARE DISTRIBUTIONS IN THE TAR FORMAT


    Companies often use the tar command when distributing their software because it
    results in a single file for the customer to copy and a savings in disk space
    compared to the unarchived directory hierarchies that may contain the software
