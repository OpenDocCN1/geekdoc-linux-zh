- img_proc: true
  md: '# 132 Chapter 6 LINUX/UNIX Processes


    a process. The LINUX/UNIX operating system uses a signal to get the attention
    of a process. Any one of more than 60 signal types (in Red Hat 7.2; 30 in Mandrake
    6.1) can be sent to a LINUX/UNIX process. A process can take one of three actions
    upon receiving a signal:


    +   - Accept the default action as determined by the LINUX/UNIX kernel

    - Ignore the signal

    - Intercept the signal and send a programmer-defined action


    For most signals the default action, in addition to some other events such as
    generating a “core” file, results in termination of the process. Ignoring a signal
    has any impact on the process. A programmer-defined action is specified in the
    process as a program statement, and it can take control of the process at a specific
    piece of code in the process.


    The kill command can be used to send any type of signal to a process. The following
    is a brief description of the kill command:


    ```

    kill [-signal_number]-proc list

    kill [-

    ```


    **Purpose:** Send the signal for ''signal_number'' to processes whose PIDs or
    jobIDs are specified in ''proc-list''; jobIDs must start with $. The command kill
    -l returns a list of all signal names and their names


    **Commonly used numbers:**


    | 1 | Hang up (log out or hang up the phone line while using a system via a modem)
    |

    | 2 | Interrupt (<Ctrl-C>) |

    | 9 | Sure kill |

    | 15 | Software signal (default signal) |


    Without a signal number, the command sends signal number 15 to the process whose
    PIDs are specified as arguments. The default action for this signal is termination
    of the process that receives it. This signal can be intercepted and ignored by
    a process, as most of the other signals. In order to terminate a process that
    ignores signal 15 or other signals, signal number 9, known as **sure kill**, must
    be sent. The following session presents instances of how the kill command can
    be used.


    ```

    $ kill 1845 1850

    $ kill -2 1851

    [1] Terminated      find -inum 23456 -print >inumpaths 2>/dev/null

    $ kill -9 1837

    [3]+ Killed         a.out

    $

    ```'
  merge: -1
