- img_proc: true
  md: '# 5.1 INTRODUCTION


    Although time-sharing systems such as LINUX and UNIX offer great benefits, protecting
    the hardware and software resources in them is a challenge. These resources include
    the I/O devices, CPU, memory, and the secondary storage devices that store user
    files. We have limited the scope of this section to protecting a user''s files
    from unauthorized access by other users. LINUX and UNIX provide three mechanisms
    for protecting your files.


    The fundamental scheme for protecting user files is to give every user a login
    name and a password, allowing one to use a system (see Chapter 1). To prevent
    others from accessing your files, only you should know the password for your computer
    account. The second scheme protects individuals by converting them them encryption
    to a format that is completely different from the original version. You can use
    this technique to protect files so that the contents of these files cannot be
    understood if someone gains access to them. The third protection protects your
    files by associating access privileges with them so that only a subset of users
    can access them for file operations. This technique is the primary focus of this
    chapter. We will discuss how the basic file protection mechanism—using read, write,
    and execute access privileges—works in LINUX and UNIX and extend this discussion
    to describe advanced file protection with set UID, set GID, and sticky bits.


    # 5.2 FILE PROTECTION BASED ON ACCESS PERMISSION


    File protection based on access permissions prevents users from accessing others''
    files when they are not logged in as a file''s owner. As owner, you attach access
    rights to your files that dictate who can cannot access them for various types
    of file operations. This scheme is based on the types of users, the types of access
    permissions, and the types of operations allowed on a file under LINUX/UNIX. Without
    a protection scheme, users could access others'' files because the LINUX file
    system structure has a single root from all the files in the system hang (see
    Figure 2.1).


    # 5.2.1 Types OF USERS


    Every user in a LINUX/UNIX system belongs to a group of users, as assigned by
    the system administrator when the user is allocated an account on the system.
    A user can belong to multiple groups, but a typical LINUX/UNIX user belongs to
    a single group. All the groups in the system and their members are listed in the
    file /etc/group (see Figure 2.1). This file contains one line per group, with
    the last field of the line containing the login names of the group members. The
    three types of users of a file are: the owner of the file (known as the user);
    someone who belongs to the same group as the owner of the file; or an unconnected
    user (known as others—everyone who has an account on the system). As the owner
    of a file you can specify who can access it.


    Every LINUX/UNIX system has one special user who has access to all the files on
    the system, regardless of the access privileges on the files. This user, commonly
    known as the superuser, is the administrator of the computer system. The login
    name for the superuser is root, and the user ID is is 0.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# 5.2.2 TYPES OF FILE OPERATIONS/ACCESS PERMISSIONS


    In LINUX and UNIX, three types of access permissions/privileges are associated
    with a file: read (r), write (w), and execute (x). The read permission allows
    you to read the file, the write permission allows you to write or remove the file,
    and the execute permission allows you to execute (run) the file. The execute permission
    should be set for executable files only (files containing binary codes or scripts);
    setting it for any other type of file doesn''t make sense.


    Recall that a directory is a file, hence access rights pertain to them also. The
    read permission for a directory allows you to read the contents of the directory.
    Thus the ls command can be used to list the contents of a directory. The write
    permission for a directory allows you to create a new entry (name and pointer,
    attributes, location on disk) or to remove an existing entry from it. The execute
    permission for a directory allows you to search for a directory but not to read
    or write to it. Thus, if you don''t have execute permission for a directory, you
    can''t use the ls -l command to list its contents or use the cd command to make
    your current directory. The same is true if any component in the directory''s
    pathname does not contain permission.


    With three types of file users and three types of permissions, a LINUX/UNIX file
    has nine different types of permissions associated with it, three per user, as
    shown in Table 5.1.


    The value of X is 1 (for permission allowed) or 0 (permission not allowed). Therefore
    it bit is needed to represent a permission type. So a total of three bits are
    needed to identify file permissions for one type of user (user, group, or others).
    In other words, a user of a file can have one of the eight possible types of permissions
    for a file. These eight 3-bit values can be represented by octal numbers from
    0 through 7, and in terms of r, w, and x as shown in Table 5.2, 0 means no permissions
    and 7 means all (read, write, and execute) permissions.


    The total of bits needed to express permissions for all three types of file users
    results in possible access permission values of 000 through 7777 (in octal) for
    file permissions. The first octal digit specifies permissions for the owner of
    the file, the second digit specifies permissions for the group that the owner
    belongs to, and the third digit specifies permissions for everyone else. A bit
    of 0 for a permission is also dashed (—), and a value of 1 is also r, w, or x,
    depending on the position of the bit according to the table. Thus a permission
    value of 0 in octal (no permissions allowed) for a user of a file can be written
    as --- and a permission of 7 (all three permissions allowed) rwx.


    | Table 5.1 Summary of File Permissions in LINUX/UNIX |

    | User Type | Permission Type |

    | Read (r) | Write (w) | Execute (x) |

    | User (u) | X | X | X |

    | Group (g) | X | X | X |

    | Others (o) | X | X | X |'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Table 5.2 Permission Values


    | r | w | x | Octal Value | Permission Value in Terms of r, w, x, and - | Meaning
    |

    |---|---|---|---|---|---|

    | 0 | 0 | 0 | --- | --- | No permission |

    | 0 | 0 | 1 | 1 | --X | Execute-only permission |

    | 0 | 1 | 0 | 2 | -w- | Write-only permission |

    | 0 | 1 | 1 | 3 | -wx | Write and execute permission |

    | 1 | 0 | 0 | 4 | r-- | Read-only permission |

    | 1 | 0 | 1 | 5 | r-X | Read and execute permission |

    | 1 | 1 | 0 | 6 | rw- | Read and write permission |

    | 1 | 1 | 1 | 7 | rwx | Read, write, and execute permission |


    # 5.2.3 DEFAULT FILE ACCESS PRIVILEGES


    When a new file or directory is created, LINUX sets its access privileges based
    on the argument of the umask command. The following is a brief description of
    the command.


    ```

    Syntax: umask [mask]

    Purpose: Set access permissions on newly created files and directories to 1, except
    for those bits that are set to 1 in ''mask''

    ```


    The argument of the umask command is a bit mask, specified in octal, which identifies
    the protection bits are to be turned off when a new file is created. The access
    permission value for the file is computed by the expression


    file access permission = default permissions - umask


    where mask is the argument of the umask command and default permissions are 777
    for an executable file and 666 for a text file (i.e., no execute permission for
    text files). If a text file contains a program script as a Perl script or a shell
    script, you must explicitly add the execute permission for the file so it can
    be created. Symbolic links are always created with 777 access privileges, and
    device files are created with permissions. Therefore, if the umask 013 command
    is used, access privileges for the newly created files and directories are set
    to (777 - 013) = 764. Every new executable file or directory has its access privileges
    to rwxrxr-x-. The value of 777 allows access to newly created files and directories
    because all the bits in (777) are set. In other words, the access privileges for
    the newly created executable files and directories are set to (777 - 022) = 755.


    A commonly used umask value is 022, which sets the default access privileges for
    newly created executable files and directories to (777 - 022) = 755 and for text
    files (666 - 022) = 644.'
  merge: -1
  pgno: 121
