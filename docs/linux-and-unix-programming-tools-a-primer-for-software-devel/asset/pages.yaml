  md: '# Chapter 11 Developing, Using, and Debugging Libraries


    modules for many functions to perform commonly used operations for I/O, character
    handling, string processing, mathematical functions, and preprocess communication.
    Some of the commonly used library functions are printf, malloc, free, strcmp,
    rand, pow, and get. The use of library calls makes a programmer''s job easier
    because she does not have to write functions for forming these tasks. The C libraries
    in LINUX and UNIX are located in the /usr/lib directory. In to use a library function,
    you must include a header file that declares the library resources (e.g., macros
    and functions). Although many libraries are linked to your code by the linking
    phase of the compiler, others need to be linked with the -l compiler option. For
    example, the standard C and C++ libraries libc.a and libc++.a are automatically
    linked to your program math, socket, and GNU C++ libraries (libm, libsocket.a,
    and lib++, respectively), are not. In a program that uses a math function work
    you must include the <math.h> header file and compile it with the -lm option.


    You can use the utility to create, display, and manipulate libraries. After creating
    a library with the ar utility you must add a table of contents to it with the
    ranlib command. UNIX systems do not require the use of ranlib because the ar command
    on systems adds the table of contents. Once a library has been created and a table
    of contents has been added to it, you can install the library by placing a header
    file for it in the /usr/include directory and placing the library archive in the
    /usr/lib directory. The header file contains declarations for the resouces (macros
    and functions) contained in the library file. Once a new library has been installed,
    it can be used like any other library, except that you need to explicitly link
    it.


    The nm utility allows you to display the symbol table of a library, object, or
    executable file. The output of the nm command gives you information for debugging.


