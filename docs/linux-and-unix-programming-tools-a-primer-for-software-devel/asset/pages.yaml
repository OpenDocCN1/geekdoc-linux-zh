    The makefile consists of a list of rules define the relationships between files
    that are used to create an executable file. The make utility uses the rules in
    the makefile to determine which of the files in your program files need to be
    compiled and relink to re-create the executable. make recompiles a source file
    involved in the build if the file is more current than the timestamp on the executable
    file. (the last update) then, for example, if you modify a header (.h) file, the
    make utility recompiles all source files that include this header file provided
    that the header file is in the dependency list of the object files. The files
    that contain this header file must be specified in the corresponding makefile.
    We show several examples of such dependency in this chapter. The directory that
    contains the source files and the makefile is commonly called the build directory.


