  md: '# 134 Chapter 6 LINUX/UNIX Processes


    ![](img/62803a90ad1a923bf070a7b5e2ffbb05_151_0.png)


    Figure 6.1 LINUX process hierarchy


    Once in your login shell, you can do your work and terminate the shell by pressing
    <Ctrl-D>. When you do so, the shell process terminates and control goes back to
    the getty process, which displays the login: prompt, and life goes on.


    Figure 6.1 shows the process hierarchy of a LINUX system schematically; the UNIX
    process hierarchy is very similar. This process diagram shows a system with one
    user running two processes, sort and find, with the Bash shell you log on as the
    user''s shell.


    Thus, when you log on to a LINUX/UNIX system, the system creates the first process
    for you, the login process, then creates your login shell. In Chapter 1 (Section
    1.3), we explained how you determine the type of login shell (Bash, TC, Z, etc.).
    The login interpreter executes your commands by creating processes for all the
    commands that you execute.


    Two Linux/UNIX processes exist throughout the lifetime of a system: the swapper
    and init processes, which monitors a terminal line, lives for as long as the terminal
    is attached to the system. Your login and shell processes live for as long as
    you are logged on. All other processes are usually short-lived and stay for as
    long as a command or utility executes.


    The ps -e f (6.3.1) or ptree command can be used to display the process tree of
    currently running processes on the system in a graphical form, showing the parent-child
    relationship. The ptree command displays a more compact diagram than the ps -e
    f command.


    # 6.5 DISPLAYING PROCESS ATTRIBUTES IN LINUX/UNIX


    The ulimit command can be used under Bash to display many process and file attributes,
    including the maximum number of processes a user can run simultaneously. The same
    task can be performed under Tsh using the limit command. Both commands can be
    used to display limits on a number of hardware and operating system resources.
    You can use the help ulimit command under Bash to find out more details about
    the command. The following session shows the use of these commands to determine
    the process limit on Mandrake 6.1, which is 256. The process limit on Red Hat
    7.2 is 2048 (on some systems it is 2047).'
