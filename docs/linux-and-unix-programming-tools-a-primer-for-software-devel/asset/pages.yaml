  md: '# 12.2.2 USING A DEBUGGING TOOL


    The proper method of debugging a program is to use a tool known as symbolic debugger.
    The use of such a tool can save you much time and frustration during the debugging
    process. Many debugging tools are available on LINUX and UNIX. Most of these tools
    are text-based, but some also have frontend GUIs available. Using these tools
    through a GUI interface makes the debugging experience more palatable. Typical
    facilities available in a symbolic debugger include


    +   - running programs

    - setting break points

    - single stepping

    - listing source code

    - editing source code

    - accessing and modifying variables

    - tracing program execution

    - displaying activation records (also known as stack frames) on the program stack

    - searching for functions, variables, and others

    - displaying variables of variables or expressions


    The standard debugger on LINUX and UNIX systems is gdb (GNU Debug), which can
    be used for debugging C, C++, Java, and Modula-2 programs. Here we discuss primarily
    its features for debugging C and C++ programs, but do give a session for debugging
    Java programs as well.


    # 12.3 THE DEBUGGING PROCESS


    Debugging programs with a symbolic debugger involves many steps. We outline these
    steps for a general debugger here describe them in detail for gdb in the remaining
    sections of this chapter. The general steps are


    +   - Recompile your program with an option that generates extra debugging information
    in the executable code to be used by the debugger.

    - Start the debugger.

    - Run your program inside the debugger.

    - Obtain the run-time information necessary to identify the buggy code. This information
    can be obtained by setting break points, single-stepping through your code, searching
    for identifiers, and displaying the program source.

    - Identify the bad code.

    - Make corrections in the source to remedy the problem.

    - Recompile and rerun the code to confirm its correct working.

    - Feel lucky and be happy!'
  merge: -1
