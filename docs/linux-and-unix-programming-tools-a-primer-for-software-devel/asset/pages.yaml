  md: '# Special Access Bits 115


    area on the disk used to save processes temporarily. That is, if the sticky bit
    is set for a program, the program is either in memory or on the swap space after
    it finishes its execution. When this program is executed again, with the program
    code in memory, program execution starts right away. If the program code is on
    the swap space, the time needed for loading it is much shorter than if it were
    stored on disk as a LINUX/UNIX file. The advantage of this scheme, therefore,
    is that if a program with the sticky bit is executed, it is much faster.


    This facility is useful for programs such as compilers, assemblers, editors, and
    commands which as ls and cat, are used frequently in a typical computer system
    environment. Care must be taken that too many programs have sticky bit, or system
    performance will suffer because of lack of free space, with more and more space
    being used by the programs whose sticky bit is set. This historical use of the
    sticky bit is not needed in newer UNIX and Linux systems, because they use virtual
    memory systems that do not remove the most recently used pages or segments of
    executed processes. The sticky bit is used to ensure that the owner of a directory
    cannot remove a file under the directory unless he or she has write permission
    for the directory. The person with permission for the directory can still create
    files/or directories under this directory. This allows you to put an extra security
    wall around your shared directories.


