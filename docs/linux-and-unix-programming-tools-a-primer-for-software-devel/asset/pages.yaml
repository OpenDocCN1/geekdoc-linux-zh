    Figure 2.1 A typical LINUX file system structure


    Pathnames starting with the present working directory or a user''s home directory
    are called relative-pathnames. When the user sarwan logs on, the system puts him
    into his home directory, /home/faculty/sarwan. The absolute pathname for a user''s
