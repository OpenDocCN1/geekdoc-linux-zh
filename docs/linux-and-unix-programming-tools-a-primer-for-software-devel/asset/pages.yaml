    # 11.3 THE AR UTILITY


    The utility, also called librarian, allows you to perform various library-related
    tasks such as creating, modifying, and extracting modules from archives. The following
    is a brief description of this utility.


    | ar key archive-name [file-list] |

    |---||

    | Purpose: | This utility allows creation and manipulation of archives. For example,
    it can be used to create an archive of the object files in ''file-list'' and store
    it in the file called ''archive-name'' |

    | Commonly used keys: | |

    | d | Delete a file from an archive |

    | q | Append a file at an existing archive |

    | r | Create a new archive or overwrite an existing archive |

    | t | Display the table of contents of an archive |

    | s | Force generation of the archive symbol table |

    | x | Extract one or more files from an archive and store them in your current
    working directory |

    | v | Generate a verbose output |'
