  md: '# 8.4 THE COMPILATION PROCESS


    Since many of the programming languages used on a LINUX/UNIX system are compiled,
    we need to describe the compilation process before moving to machine. As we stated
    in Section 8.2, programs written in compiled languages must be translated to the
    machine code of the CPU used in the computer system on which they are to execute.
    This translation is usually a three-step process consisting of compilation, assembly,
    and linking. The compilation process translates the source code (e.g., a C++ program)
    to the corresponding assembly code for the CPU used in the computer system. The
    assembly code is then translated to the executable code. The linking phase is
    required regardless of whether you other object modules, or whether your program
    uses any library call. Figure 8-2 outlines the translation process.


    The object code consists of machine instructions, but isn''t executable because
    the source program may have used some library functions that the assembler can''t
    resolve references to because the library functions code isn''t in the source
    file(s). The linker performs the task of linking (connecting) the object code
    for a program (which may be in multiple files or modules) to the object code in
    one or more libraries. The output of the linker is the executable code for the
    computer on which the program was compiled, assembled, and linked.


    # 8.5 THE INTERPRETATION PROCESS


    Many of the programming languages available on LINUX/UNIX are interpreted, such
    as Perl, awk, LISP, JavaScript, and shell scripting language (e.g., Bash and Tesh).
    It is therefore important to understand how programs written in such languages
    are executed.


    Programs written in an interpreted language are executed by another program, called
    the language interpreter, one statement or command at a time. Unlike programs
    written in a compiled language, programs written in an interpreted language don''t
    need any translation before they can be executed. The interpreter reads the program
    statement at a time and tries to execute it, as shown in Figure 8.3.


    ![](img/62803a90ad1a923bf070a7b5e2ffbb05_171_0.png)


    Figure 8.2 The process of translating a high-level language into executable code'
  merge: -1
