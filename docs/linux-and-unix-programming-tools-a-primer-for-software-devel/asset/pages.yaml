    # 3.4 LINUX/UX FILTERS AND PIPES


    The LINUX/UX operating system allows you to connect stdout of a command to stdin
    of another command. You can do so by using the pipe operator (| ) according to
    the following syntax.


    | command1 | command2 | command3 | ... | commandN |

    |---|---|---|---|--|

    | Syntax: | Stdout of ''command1'' is connected to stdin of ''command2'', stdout
    of ''command2'' is connected to stdin of ''command3'', ..., stdout of ''commandN-1''
    is connected to ''commandN'' |


    In general, any two commands can be connected via a pipe as long as one of them
    sends its output to stdout and the other reads its input from stdin. For example,
    in the following command, the more command takes output of the ls -1 command as
    its input. The end result of this command is that the output of the ls -1 is displayed
    one screen at a time. It is important to mention here that no extra disk operation
    is performed for executing this command. The semantics of this command are shown
    in Figure 3.2.'
