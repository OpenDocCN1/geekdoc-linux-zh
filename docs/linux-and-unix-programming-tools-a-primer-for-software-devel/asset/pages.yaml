    # 4.4.4 DEFINING MACROS AT COMMAND LINE


    A macro definition has the following form:


    ```

    #define name text

    ```


    The text is part of the line, which can be broken into multiple lines by placing
    a \ at the end of each line. The preprocessor substitutes every subsequent occurrence
    of name with text. The scope of name is from the point of its definition to the
    end of the source file in which the definition is placed.


    Most C++ compilers allow you to define macros at the command line. You can use
    the gcc or g++ command with -D option to do so, as described in the syntax box
    for the gcc command. In the following compiler comand, we define a macro (symbolic
    constant) BUFSIZE to be 512.


    ```

    $ gcc -BUFSIZE=512 Huffman.c -o Huffman

    ```


    ```

    $

    ```


    When gcc processes the command line arguments, the preprocessor behaves as if
    the program in the Huffman.c file had the following macro definition in it.


    ```

    #define BUFSIZE 512

    ```


    This allows you to use BUFSIZE as a symbolic constant in your code, as in the
    statements below.


    ```

    $ more Huffman.c

    ```


    ```

    ...

    char buf[BUFSIZE];

    ...

    while ((nr = read(fd, buf, BUFSIZE)) > 0)...

    ```


    ```

    $

    ```'
