    # 14.5 SUMMARY


    As you develop the source code for a software, you may need to undo changes made
    to it and go back to an earlier version of the software. Also, if you detect a
    bug in your software after it has been in for a long time, you will want to be
    able to retrieve earlier versions of the software to determine the change that
    induced the bug. Moreover, if a team of programmers is working on a piece of software,
    each team member should be able to check out and check in editable (modifiable)
    versions of the soft ware. LINUX and UNIX have tools that support such features.


    Version/revision control is the task of managing revisions to a software product.
    Typical software for revision control allows you to lock other users from changing
    a file while you are altering it (provide a check-out and check-in system of file
    access), help identify different versions of a file, merge multiple versions of
    the same file to create a new “final” file, maintain a history of all versions
    of every file related to a product, access earlier versions of all files of a
    product, and limit access to a subset of users on the system.


    Several LINUX/UNIX tools allow you to control versions of your files and almost
    all of them use the Revision Control System (RCS) as their engine. In this chapter
    we discussed many features of the Revision Control System and Concurrent Version
    System (CVS) with examples.'
