  md: '# # Appendix A:

    Editing Text Files with vi and pico


    THE VI OR VIM EDITOR


    Vi is a popular UNIX text editor. The LINUX version of vi is vim. Although there
    are differences between **vi** and **vim**, we use these terms interchangeably.
    You can use the vi (or vim) command to invoke the vi editor. In the following
    session, we use the vi command to edit a file vi_demo. Figure A.1 shows the initial
    vi screen for the new file vi_demo. As the message at the bottom left of the screen
    indicates, vi_demo is a brand-new file. If vi_demo already exists, it is pulled
    into the vi screen, otherwise a new file called vi_demo is created.


    $ vi vi_demo


    While you use a text editor, the contents of your file and any changes made to
    it are stored in an area in the memory called the **editor buffer**. In order
    to commit changes to the file, you must explicitly save the editor buffer in the
    disk file.


