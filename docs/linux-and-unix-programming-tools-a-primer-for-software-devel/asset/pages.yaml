  md: '# 3.1 INTRODUCTION


    All computer software commands perform one or more three operations—input, processing,
    out-put; a typical command performs all three. The questions for the operating
    system are: Where does a shell command take its input, where does it send its
    output, and where are error messages sent? If the input is not part of the command
    code (i.e., data in the code of constants or vari-ables), it comes from an outside
    source. This source is usually a file, although it could be an I/O device such
    as keyboard or a network interface. Command output and error messages can go to
    a file as well. For a command to read from or write to a file, it must first open
    the


    Every command in LINUX/UNIX has a set of powerful operators and commands that
    allow you to redirect a command''s input, output, and errors by using the redirection
    operators to connect output of a command to the input of another command by using
    the pipe operator. In this chapter, we discuss standard files, file descript-,
    I/O and error redirection, connecting multiple commands to perform complex operations
    on files, and the utility that allows you to save the output of a command to one
    or more files as well as send it to another command.


    # 3.2 STANDARD FILES, FILE DESCRIPTORS, AND REDIRECTION OF STANDARD FILES


    In LINUX/UNIX, three files are automatically opened by the kernel for each command
    to read from input and send its output and error messages to. These files, known
    as standard files, are standard input (stdin), standard output (stdout), and standard
    error (stderr). By default, these files are associated with the terminal on which
    the command executes. Specifically, the kernel is standard input and the display
    screen (or the console at which you are logged in) is standard output and standard
    error. Therefore, every command, by default, takes its input from the keyboard,
    and sends its output and error messages to the display screen, as shown in Figure
    3.1. In the remainder of this chapter, we use the terms monitor screen, display
    screen, console window, and display window interchangeably.


    The LINUX/UNIX kernel associates a small integer number, called the file descriptor,
    with every open file. The upper limit on a descriptor value is system dependent
    but could be 1023 or 1024. You can use the ulimit command (see Chapter 6) to determine
    the limit on the number of files that a process can open simultaneously. On Mandrake
    6.1 and RedHat 7.1, this value is 1024 by default and on SunOS the default value
    is 64. The file descriptors for stdin, stdout, and stderr are 0, 1, and 2.


    ![](img/62803a90ad1a923bf070a7b5e2ffbb05_93_0.png)


    Figure 3.1 Standard input, standard output, and standard error'
