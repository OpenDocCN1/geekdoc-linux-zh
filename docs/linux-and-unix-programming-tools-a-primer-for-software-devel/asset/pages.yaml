    # 9.7 DISASTROUS COMPILER COMMANDS AND TYPICAL COMPILE TIME ERRORS


    The two most disastrous compiler commands involve the use of the -o compiler option
    and the use of the output redirection operator (>). As stated previously, when
    you use the -o option of a compiler command, the name of the file that should
    contain the executable code must follow the option, as in `gcc sample.c -o`. If
    you want to save the executable in a file with the name of the source file but
    without the extension (.c, .cpp, etc.), as is the case in the above example, you
    must type your command carefully. It is possible that in the flow of things you
    may type the name of the source file as the name of the executable, as in `g++
    sample.c -o sample.c`. If you did so, you would overwrite your source file with
    the executable code, which means you''ve lost your source file forever!


    A similar situation occurs when you use output or error redirection and type the
    name of the source file after the redirection operator, as in `gcc sample.c -o
    sample.c > sample.c`. In this case you would lose your source file because the
    shell will truncate the sample.c file since you have indicated that `sample.c
    > test test.c` will have the same disastrous effect. In this case, you will end
    up with an empty test.c file.


    There are many reasons the shell may not be able to start your compiler command.
    Common reasons are no source file, bad pathname for the file, or no read permission
    on the file.


    Many compile time errors are reported due to simple mistakes in your source code.
    Most compile time errors, especially for beginners, are the result of missing
    semicolons, quotes, parentheses, or braces. A missing semicolon in particular
    is sometimes difficult to locate. The best solution in such circumstances is probably
    to scan through your source code to locate statements that don''t terminate with
    a semicolon, insert semicolons that are missing, and recompile the program.


    # 9.8 COMPILING AND INTERPRETING PROGRAMS IN OTHER PROGRAM LANGUAGES


    The LINUX and UNIX systems have compilers for many other languages such as f77
    for FORTRAN and `perlcc` for the front end of Perl. The GNU FORTRAN compiler is
    g77. Similarly, these systems have many interpreters such as `bash` for interpreting
    a bash script and `perl` for interpreting a perl script.'
