    support for abstract data types in classes. See Abstract Data Types.


    Printer Daemon See Printer Spooler Printer Spooler A system process running in
    the background that receives print requests and sends them to the appropriate
    printer for printing. If the printer is busy, its request is put in the printer''s
    print queue.


    Object-Oriented Programming Paradigm In the object-oriented programming paradigm,
    the focus is on containing data and operations (i.e., methods) associated with
    the data packaged.


    Procedural Paradigm In the procedural paradigm, data is passed to subprograms
    (functions or procedures) that process data to produce the desired results. Some
