  md: '# 12.8 USING gdb UNDER EMACS


    You can use the M-x gdb programmer in Emacs to start a special interface that
    allows you to view and edit the source files you are debugging with gdb. You can
    pass the name of an executable file as an argument to this command. The command
    starts a new Emacs window running gdb. You can step through the buffer of this
    Emacs process. Using gdb under Emacs is window just like you are using gdb normally,
    except for the following things:


    +   1. gdb displays the program source code through the Emacs window.

    2. All terminal I/O (i.e., gdb and program I/O) take place through the Emacs buffer.


    Once you have the Emacs interface, you can perform the various debugging operations
    with the Emacs commands. For example, you can set a break point at the current
    line with the C-C SPACE command (pressing <Ctrl-C followed by the <Space> bar).
    If you set a break point and run the program with the appropriate arguments, Emacs
    will split your screen into two halves with the gdb command line at the top and
    your M-s (step) or M-n (next) command. You can step through the execution of the
    function with the C-c C (finish) command. With the M-c (or C-C C-p) command you
    can continue the execution of the program. You can display a description of the
    various features of the gdb mode interface with the C-h m command. Finally, you
    can leave the Emacs interface with the C-c o command.


    # 12.9 SOFTWARE TESTING


    As stated earlier, software testing involves running a "working" program against
    a set of expected and unexpected input data to see if it produces expected output.
    The purpose of testing is to fail the program. Although a programmer is expected
    to test the software he writes during the coding phase of a product, formal software
    testing is carried out in three phases: code inspection (also known as code-through),
    white-box/glass-box testing, and black-box testing. A detailed discussion of software
    testing is beyond the scope of this book but we give a brief overview of these
    types.


    Once a software has been written and tested by the developer, one or more of the
    software-development team describe their code, line by line, to a team of inspectors
    who are usually from the software quality assurance group in the organization.
    The purpose of this activity is to inter-face faults between functions and modules.
    This activity is known as code inspection. The faults are corrected by the software
    development team and, depending on the number of faults in the software, a follow-up
    inspection may be necessary.


    White-box testing finds faults by testing the software well-thought test inputs,
    which are drawn up based on the structure of the code. Testers choose input data
    to invoke as many program statements as possible. The percentage of program statements
    that can be invoked during this phase of testing is called code coverage. Ideally,
    you would like to have 100% code coverage but in practice code coverage is dictated
    by the critical nature of the software. Again, the faults in the code are logged
    and corrected.


    Finally, black-box testing, the software is tested against its requirements. The
    test cases are therefore, drawn based on the requirements document. Ideally, you
    should test your programs'
  merge: -1
