    # # 5.4 FILE PERMISSIONS AND TYPES


    The file permissions and types are stored together in a 16-bit location: the lower
    9 bits for file access privileges, the next 3 bits for special permission bits
    (SUID, SGID, and sticky bits), and the uppermost 4 bits for file type. Further
    discussion of the bits used to specify file type is beyond the scope of this textbook.
    You can find values of all access and file types in the /usr/include/sys/stat.h
    file and a detailed discussion on this topic in a more advanced book about LINUX/UNIX
    programming.


    # # 5.5 SUMMARY


    A time-sharing system has to ensure protection of one user''s files from unauthorized
    (accidental or malicious) access by other users of the system. LIN/UNIX provides
    several mechanisms for this purpose, including one based on access permissions.
    Files can be protected by informing the system what type of operations (read,
    write, and execute) are permitted on the file or directory, group (the users who
    are in the same group as the owner), and others (everyone else on the system).
    These nine commonly used access permissions are represented by bits. In addition,
    there are three special permission bits that allow advanced protection. These
    bits are: set-user-ID (SUID) bit, set-group-ID (SGID) bit, and the sticky bit.
    When a user tries to access a file, the system allows or disallows access based
    on the file''s access privileges.


    Access permissions for files can be viewed by using the ls -l command. When used
    with directories, the command displays attributes for all the files in the directories.
    The ls -ld command can be used to view access permissions for directories. A file
    owner can change access privileges by using the chmod command. The umask command
    allows the user to specify a bit mask that informs the system of access permissions
    that are disabled for the user, group, and others. When a file is created by a
    LIN/UNIX system, it sets access permissions for the file according to the mask
    given in the umask. In a typical system, access permissions are set to (777 -
    mask) for a new executable file or (666 - mask) for a text file.


    The SUID and SGID bits allow the user to execute commands such as passwd, mkdir,
    and ps that access important system resources to which access is not allowed otherwise.
    The sticky bit can be set for a directory to ensure that an unprivileged user
    may not remove or rename files of other users. Only the owner of a directory,
    or someone having appropriate permissions, can set the sticky bit for the directory.
    It is commonly set for shared directories that contain files owned by several
    users. Historically, the sticky bit has served another purpose. It can be set
    for frequently used utilities like'
