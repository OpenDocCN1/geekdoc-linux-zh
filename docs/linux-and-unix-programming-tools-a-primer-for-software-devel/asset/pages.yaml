    # 12.6 RUNNING A CRASHED PROGRAM WITH A CORE FILE


    If a program crash is difficult to reproduce, we cannot debug the program with
    the normal use of gdb; the exact circumstances that caused the crash cannot be
    reproduced as the program runs under gdb. If a crash produces a core file, we
    can debug the executable with gdb by using this core file.


    A core file contains the memory image of a process before it terminated. The default
    action of some signals is to create a core file and terminate the process that
    receives the signal. SIGSEGV and SIGBUS are two common reasons for the creation
    of a core file. If the process executable crashed contained debug info (i.e.,
    it was compiled with the -g compiler option), it contains the stack trace, values
    of variables, and other run-time information about the process. If the size of
    the core file was not limited by the shell process under which the executable
    was run, we can debug a process using its core file.


    We can use the command line for debugging a program with a core file. Note that
    if the core file is not in the current directory, you will need to provide the
    pathname for the core file in the command line. If the core file''s name is not
    core, then use the actual name of the core file.


    ```

    gdb executable_name core

    ```


    In the gdb environment, you can run the gdb commands such as where and print.
    You cannot use the commands that imply execution of a statement as step or next.


    # 12.7 DEBUGGING JAVA PROGRAMS WITH gdb


    The most recent versions of gdb allow you to debug Java programs compiled with
    the GNU gcc compiler (see Web references 6 and 7 in Table 12.2). Since the Java
    run-time environment uses the SIGPWR and SIGXCPU signals for garbage collection,
    you need to inform gdb to ignore them by using the following handler.


    ```

    handle SIGPWR nostop noprint

