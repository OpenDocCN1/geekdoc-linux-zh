    Torvalds'' "hobby" eventually became what is known as the LINUX operating system.
    Although LINUX a UNIX look-alike, is about 12 years old, it has revolutionized
    the PC and Internet world. Millions of users around the world use LINUX on their
    home PCs and office workstations.


    Initially designed and written for PCs based on Intel CPUs, LINUX now runs on
    a wide range of hardware platforms, including Alpha, Amiga, Atari, Macintosh,
    and Sun SPARC. Operating systems for many personal digital assistants (PDAs) use
    the Linux kernel as their base. As of this writing, there are more than 250 varieties
    of LINUX, used on a wide spectrum of hardware platforms, from large 64-bit processor
    architectures and Internet servers to tiny embedded processors, PDAs, and wristwatches.
    Some of the major LINUX distributions are Caldera, Mandrake, Red Hat, Slack, and
    SuSE. The source codes for the LINUX kernel and many tools developed for it are
    available from various Web sites free of charge.


    LINUX is the most talked about operating system on the Internet. The search for
