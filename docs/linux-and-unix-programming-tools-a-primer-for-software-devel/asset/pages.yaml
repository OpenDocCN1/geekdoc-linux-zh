    # 13.5.2 The Running Time of a Program


    The run-time performance of a program or any shell command can be measured and
    displayed by the time command. This command reports three times: elapsed time,
    system time, and user time in the format hours:minutes.seconds. Elapsed time is
    the actual time taken by the program to finish running, system time is the time
    taken by system activities while the program was executing, and user time is the
    time by execution of the program code. Because LINUX and UNIX are time-sharing
    systems, elapsed time is not always equal to the sum of system and user time,
    because many other users'' processes may be running while your program executes,
    the elapsed time to be much greater than the sum of user and system times. Here
    is a brief description of the time command.


    > time [command]


    Purpose: Repeat the run-time performance of ''command'' in terms of its execution
    time. It reports three times: elapsed time (actual time taken by command execution),
    system time (time spent on system activities while the command was executing,
    and user time (time taken by the command code itself).


    The time command sends its output to stderr, so if you want to redirect the output
    of the time command to a disk file, you must redirect its stderr (not its stdout)
    to the file.


    There are two versions of the time command: the built-in command for the TC shell
    and /usr/bin/time command. The output of the built-in time command is quite cryptic,
    whereas the'
