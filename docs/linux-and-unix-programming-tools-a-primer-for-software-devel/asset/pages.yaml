  md: '# 11.1 INTRODUCTION


    The LINUX and UNIX operating systems allow you to archive (bundle) files into
    a single library file. In other words, they allow you to use the name of one file
    instead of a number of object files in a compiler command or a makefile and allow
    you to use the same function in more than one program. The LINUX and UNIX systems
    have many repackaged libraries for C, C++, and many other languages. These libraries
    contain the object modules for many functions to perform commonly used operations
    for I/O, character handling, string processing, mathematical functions, and inter-process
    communication. Some of the commonly C library functions are printf, malloc, free,
    strcmp, rand, pow, and gethostname. The use of library calls makes a programmer''s
    job easier because she does not have to write functions for performing these tasks.
    The libraries in LINUX and UNIX are located in the /lib and /usr directories.
    You can handle library tasks such as creating and modifying libraries with the
    LINUX and UNIX tools or ranlib. You can use the nm unit to display the symbol
    table for an executable binary, object, or library file. This information gives
    you ample information to be able to debug these files.


    # 11.2 USING LIBRARIES


    A typical LINUX or UNIX system contains libraries for C, C++, and FORTRAN. The
    archive files for one of these languages can be used by applications developed
    in that language. This allows software developers to use the prewritten and pretested
    functions in their software. The /lib and /usr/lib directories in LINUX and UNIX
    contain libraries. Most language libraries are located in the /usr/lib directory,
    such as the standard C library (/usr/lib/libc.a) and standard C++ library (/usr/lib/libstdc++.a).
    The *. suffix is reserved for libraries of object files.


    The header file for a library contains declarations for the resources (e.g., functions
    and macros) defined in the library. There are two types of header files: public
    and private. A public header declares resources that are meant to be used by the
    library code. In order to make a library public, you should install it in the
    /usr/lib directory and place its public header file in the /usr/include directory.
    In order to use a standard library function in your program, you must include
    the header file for the library in your program with the preprocessor directive
    #include as


    ```

    #include <stdlib.h>

    ```


    When the preprocessor encounters this directive, it searches the /usr/include
    file for the stdio.h file.


    A private header file can be included in a program by using the pathname for the
    header file in quotes, as


    ```

    #include "localheaderfile.h"

    ```


    In this case, the preprocessor searches your current directory to locate the localheader.h
    file. For example like


    ```

    #include "/include/localheaderfile.h"

    ```


    The preprocessor searches the localheader.h in ~include directory.'
