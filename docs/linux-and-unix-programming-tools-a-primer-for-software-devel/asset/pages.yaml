    # 6.3.5 RUNNING COMMANDS SEQUENTIALLY AND SIMANEOUSLY


    A set of commands can be run in a group as separate processes or as one process.
    Multiple commands can be run from one command line as separate processes using
    a semicolon (;) as the command separator; enclosed in parentheses these commands
    can be executed as one process. Commands can be executed concurrently using an
    ampersand (&) as the command separator. You can use all of these features in a
    single command line.


