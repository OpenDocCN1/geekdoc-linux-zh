    # 3.5 REDIRECTION AND PIPING COMBINED


    The redirection operator and pipe alone cannot be used to redirect stdout of a
    command to a file as well as connect it to stdin of another command in a single
    command line. The tee utility can be used to accomplish this task. You can use
    the tee utility to tell the shell to send stdout of a command to one or more files
    as well as the stdin of another command. Here is the syntax of the tee command.


    ```

    tee [options] file-list

    ```


    The tee utility is commonly used to read output of another command via a pipe,
    instead of reading keyboard input. Also, the command output is saved in the files
    in file-list and redirected to another command instead of being displayed on screen.
    The following is commonly used syntax of this utility.


    ```

    command1 | tee [options] file-list | command2

    ```


    Purpose: The semantics of this command syntax are that ''command1'' is executed,
    its output is stored in files file1 throughN as well as to ''command2'' as its
    input.'
