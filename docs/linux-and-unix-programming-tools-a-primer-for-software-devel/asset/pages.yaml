    The LINUX and UNIX commands, called filters, read their input from stdin, process
    it in some fashion, and send it to stdout. Pipes and filters are frequently used
    in LINUX/UNIX to perform tasks that cannot be performed with a single command.
    Some commonly used filters are cat, grep, gzip, ip, pr, sort, tr, uniq, wc and
