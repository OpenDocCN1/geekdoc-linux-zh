    # 6.3.6 ANORMAL TERMINATION OF COMMANDS AND PROCESSES


    When you run a command it normally terminates after successfully completing its
    task. A command can terminate prematurely, however, because of a bad argument
    that you passed to it, such as a directory to the cp command, or because your
    executing program contains an infinite loop. At times you may also need to terminate
    a process abnormally. The abnormal termination occurs when you run a process with
    a wrong argument (e.g., a wrong file name to find command) or when a command is
    taking too long to finish. We address abnormal termination in relation to both
    foreground and background processes.


    # TERMINATING A FOREGROUND PROCESS


    You can terminate a foreground process by pressing <Ctrl-C>. In the following
    session, we run the find command but realize that we gave the wrong file name.
    We press <Ctrl-C> to terminate the command.


    ```

    $ find / -name foo -print > foo.paths 2> /dev/null

    [ command output ]

    <Ctrl-C>

    $

    ```


    # TERMINATING A BACKGROUND PROCESS


    You can terminate a background process in one of two ways: (1) using the kill
    command or (2) by bringing the process into the foreground using the fg command
    and pressing <Ctrl-C>. The primary purpose of the kill command is to send a signal
    (also known as a software interrupt) to'
  merge: -1
