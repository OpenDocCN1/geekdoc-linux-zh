    This task is to perform the scheduled system and database backup, and recover
    a failed system. During the system operation, the server or network may crash
    due to various reasons. To quickly recover from the damage caused by a system
    crash or other disasters, the system management team must have a plan on system
    backup and recovery. System backup and recovery deal with the issues related to
    backup plans, tools to be used for system backup and recovery, and system backup
    procedures.


    # Performance Tuning


    One of the routine management tasks is to improve the system''s performance. In
    general, a Web-based system has slower performance than a system that is constructed
    on a local area network. In a Web-computing environment, a single server may be
    accessed simultaneously by many students through the Internet. In such an environment,
    the network throughput and the input/output devices for the system can experience
    bottleneck. The performance of a Web-based system always has a higher priority
    in system management in order to keep its full potential for delivering online
    courses. For routine system management, the performance of the system should be
    monitored. Some of the common ways to solve performance problems are listed below.


    +   - Set up a problem reporting system so that a performance problem can be sent
    to the system management team as soon as possible. Usually, performance problems
    and their solutions are listed as part of the technical report service.

    - Analyze the performance report and identify the bottleneck.

    - Based on the identified problem, solve the performance problem by altering configuration,
    replacing equipment, upgrading software and hardware, installing patches, or changing
    the network structure.

    - To prevent the problem from happening again, document the changes and inform
    the users about the changes and give instructions on how to properly use the system.


    At this point, we have described several commonly performed tasks in system management.
    As the system is running, there is more work to be done. As we can see, just the
    above management tasks will keep the system management busy all year round.'
