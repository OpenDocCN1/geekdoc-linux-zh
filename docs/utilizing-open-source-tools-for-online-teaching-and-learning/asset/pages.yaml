    # VULNERABILITY ASSESSMENT


    Like e-commerce and many Web-based applications, an online teaching/learning system
    faces many security threats from Internet hackers and viruses. Although the Internet
    is the main source of security vulnerabilities, security problems can also occur
    on internal networks, operating systems, database management systems, learning
    management systems, as well as many other application software packages. The following
    are some factors that may cause security weaknesses:


    +   * The Web server and the services hosted by the Web server are the most vulnerable
    components in an online teaching/learning system.

    * The database management system and the remote access service provided by the
    database management system can be a factor of the security vulnerability, especially
    when the database management system is not using the operating system authentication.

    * The operating system and the directory service provided by the operating system
    can be a factor that contributes to the security vulnerability. The improperly
    secured publicly shared files and directories hosted by the operating system are
    security concerns.


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
