  md: '# Directory Structure


    For the purpose of directory service, a directory is different from a relational
    database in several ways. Unlike a relational database, a directory has no rollback
    and transaction functionalities since it does not frequently add, delete, and
    update its entries. One of the directory''s tasks is to quickly respond to search
    requests from clients. The directory offers a static view of data. It uses network
    protocols as LDAP to access data. The future directory may adopt the structure
    of an object-oriented database which can improve the performance in searching
    for authentication information.


    A directory is constructed on a tree structure. It is often built based on the
    geographic and/or organizational structure. The top level entry in the tree structure
    will be the URL of a university or an enterprise. The lower level entries are
    used to represent campuses, colleges, departments, organizational units, groups,
    and offices. The lowest level entries will be users, computer systems, and network
    resources as network printers and network storage devices.


    Each entry in a directory has a unique name called a Distinguished Name (DN) and
    has a set of attributes which describe the detail levels of the entry. A DN consists
    of Relative Distinguished Names (RDNs) which are constructed with the attributes''
    names. For example, a DN can have the following format:


    ```

    DN: cn=student name,ou=cis,dc=campus,dc=edu

    ```


    where the attributes Common Name cn and Organizational Unit are the RDNs, and
    Domain Dc is the parent DN. Each attribute can have one or more values. Starting
    with the parent DN, the tree structure holds all the subtrees and children. It
    can also include the reference to other trees hosted by different servers. When
    searching for the authentication information, client requests may be forwarded
    to other servers.


    # LDAP Process


    LDAP is a protocol that provides several operations for the client to search and
    update the directory on the server. An LDAP process starts from a request by a
    client program. The request is sent by LDAP to the server that hosts the directory.
    Based on the request, the server searches for or updates the information in the
    directory. Then, the server sends the response back to the client via LDAP. The
    following are some of the operations performed during the LDAP process:'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# 110 Chao


    +   The LDAP process starts by creating a connection from a client to an LDAP
    server. LDAP uses TCP/IP to transmit data through the default port 389 or another
    specified port. For a secure LDAP connection, the client can choose to use LDAP
    SSL which is a SSL tunnel communicating through the port 636.

    Optionally, the client can enable the Transport Layer Security (TLS) service which
    is used to protect the LDAP connection.

    LDAP defines the authentication operations performed on the server and the search
    criteria.

    The client submits a request to the LDAP server. When the client’s request arrives
    at the LDAP server, the server checks the client''s identity. Based on the authentication
    operation specified by the request, LDAP can specify a particular version of LDAP,
    add, update, or delete entries in the directory, search for and retrieve entries
    from the directory, verify if a given attribute value is held by an entry in the
    directory, and rename an entry.

    Based on the client’s instruction, LDAP can recall the previous request by the
    client, or set the permission for the client to access the directory.

    By combining several basic operations, LDAP can create a new operation.

    After the operations requested by the client are completed, LDAP closes the connection.


    Usually, an operating system may include some basic LDAP management tools. For
    the more sophisticated features, the network administrator may consider using
    a stand-alone LDAP management tool. The following will introduce some of the open
    source stand-alone LDAP management tools.


    # Open Source LDAP


    There are three major open source LDAP management tools, OpenLDAP, Fedora, and
    OpenDS. Both OpenLDAP and Fedora DS have been on the market for some time. OpenLDAP
    can work with many different databases. It can also work with virtual databases
    as the back-end. The following are of the features supported by OpenLDAP.


    +   OpenLDAP is able to handle a 150 million entry database. It can also transfer
    over 22,000 queries/second or 4,800 updates/second (Chu, 2007).

    OpenLDAP provides many security services such as Simple Authentication and Security
    Layer (SASL), Transport Layer Security (TLS), and Secure Sockets Layer (SSL).

    OpenLDAP supports LDAP Sync Replication which supports pull-based and push-based
    synchronizations.


