  md: '# # Chapter VII

    Class Management


    # INTRODUCTION


    In the previous chapter, we discussed the issues related to the database which
    is used to store student information and course information. After the network,
    server, and database have been set up properly, our next task is to develop a
    learning management system to support class management. In this chapter, we will
    examine the open source tools used for class management. Learning Management System
    (LMS) software is commonly used for course setup, management, and assessment.
    The first part of this chapter will focus on various open source learning management
    systems. Some commonly used open source LMS packages will be introduced. We will
    investigate how these LMS software packages can be used to manage classes and
    course materials.


    After the general introduction to the LMS software packages, our emphasis will
    be on open source LMS management. We will first look at the responsibilities of
    different groups of people related to LMS management such as those of the online
    teaching support team, computer service team, and faculty members. Then, we will
    discuss some popular open source LMS packages and the configurations of the commonly
    used LMS tools to meet the requirements of online teaching and learning. In this
    chapter, we will also discuss the issues related to open source LMS administration
    and security management.


    Many LMS software packages can provide tools for developing multimedia course
    materials and tools for collaboration. Moodle provides blogs, Wiki, forums, and
    chats for collaboration. It provides content management, quiz management, and
    peer assessment to support teaching. It assists course development with the'
  merge: -1
  pgno: 212
- img_proc: true
  md: '188 Chao


    modulated construction by creating plugins. This chapter will provide more information
    about these tools.


    The last part of this chapter will give an example of the installation and configuration
    of the open source LMS Moodle on Linux. In this example, we will investigate the
    requirements for installing Moodle on Linux, and then practice how to download
    and install Moodle. The installation process will illustrate the configuration
    of Moodle to meet the requirements of the online teaching/learning system. The
    second example is about setting up Sakai on linux for an online teaching/learning
    system.


    # BACKGROUND


    An online teaching/learning system usually supports a large numbers of classes.
    It needs enterprise-level learning management system software to schedule, track,
    and report information of online courses. A learning management system (LMS) software
    package is designed to handle these tasks. The topics related to using learning
    management software have been widely studied. As a general introduction, Horton
    and Horton (2003) discussed strategies on selecting an LMS and the alternatives
    to it. Itmazi and Megías (2005) discussed the LMS products as WebCT, Blackboard,
    and so on. Cole’s (2005) book covers a great amount of detail about Moodle as
    an open source learning management system. It illustrates how Moodle works and
    how to use the powerful tools such as assignments, forums, journals, quizzes,
    chat rooms, and workshops. It also provides some tips on online teaching with
    Moodle and Moodle administration.


    Due to the fact LMS plays a major role in supporting online teaching and learning,
    LMS has been studied in-depth in various academic fields. Numerous papers have
    discussed it. Briefly, we can group these papers into three categories, teaching
    with LMS, LMS management, and developing enrichment tools.


    In the area of teaching with LMS, we can find many papers published in recent
    years. To name a few, Marko and Honkarta (2007) investigated how the LMS tools
    and computer skills affect teaching at the university level. Their survey revealed
    mixed results on using adaptive LMS with augmented reality by Lim, Xu, and Jin
    (2005). By combining the virtual reality with LMS, they created a virtual learning
    environment.


    For LMS administration, Lassila and Poyry (2007) discussed the use of the Software
    and a Service (SaaS) environment to support online teaching and learning. Such
    a service can help students and instructors to take advantage of LMS supported
    online teaching and learning. From their case study, they discovered


