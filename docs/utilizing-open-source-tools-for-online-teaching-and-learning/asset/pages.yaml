  md: '# Security Management 225


    Most of the security problems caused by hackers can be prevented by carefully
    configuring the operating system and application software. Make sure that the
    publicly available accounts are reconfigured or removed. The network administrator
    also needs to make sure that the communication ports, network protocols, and network
    devices such as routers and remote access servers are properly configured to prevent
    hackers'' penetration. The network administrator should update the system timely
    with security patches and service packs as soon as they are available. He/ should
    make sure a strong password policy is implemented. The system administrator and
    the database administrator should ensure that users do not get more privileges
    than they are supposed to.


    Firewalls are the first defense of an online teaching/learning system. A firewall
    can be used to protect the university''s network from offensive Web sites and
    malicious hackers. In many ways, a firewall can prevent hackers'' attacks. It
    can be used as a filter to restrict certain network packets and protocols. It
    can also identify security vulnerabilities by comparing the incoming network traffic
    with the trusted information. The policy for utilizing Internet resources should
    be defined and implemented by using the firewall.


    To protect data transmitted over the Internet, most of the newly created Web-based
    software includes security technologies such as Socketockets Layer (SSL) for establishing
    an encrypted link between a Web server and a browser. To transmit confidential
    data over the Internet, it is''s responsibility to make sure that the security
    technologies are used for the transmission.


    To prevent hackers from logging on to the system by trying a large number of passwords,
    the system should enforce a strong password policy and limit the number of times
    a user can enter incorrect passwords. Once the number of wrong passwords passes
    a certain limit, the system will freeze the logon for some time before the logon
    process can restart again.


    One of the effective ways to detect a hacker intrusion is a well defined auditing
    policy. The auditing policy should include the auditing of the logon and the access
    of confidential files. There are many open source tools that can be used to identify
    security vulnerabilities. Later, we will look at some security management tools
    that enforce security measures so that we can prevent hackers from damaging our
    systems.


    In addition to hackers'' attacks, an online teaching/learning can also suffer
    from computer virus infection damage the system in many ways, from losing files
    to paralyzing the entire system. The following are some types of computer viruses
    and the damages they can cause:


    +   * Boot virus: This type of virus can be triggered by a computer boot process.
