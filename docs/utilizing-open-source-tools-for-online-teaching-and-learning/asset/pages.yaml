  merge: -1
  pgno: 55
- img_proc: true
  md: '# Instructional Technology Theory for Online Teaching/Learning System 31


    and of design, development, utilization, management, and evaluation of processes
    and resources for learning (Seels & Richey, 1994). The development of an online
    teaching/learning system involves both components of the solution development.
    Even though it is hard to find publications that directly deal with the design,
    development, and implementation of an online teaching/learning system there are
    some publications that discuss some specific areas. For example, Yu and Liu''s
    (2006) paper illustrates how to make use of scenario, prototype and participatory
    design principles in an online teaching system design process. Horton''s (2000)
    book gives a comprehensive overview of Web-based training from system design,
    development, to implementation. In this chapter, we will apply each stage of the
    instructional technology theory to an online teaching/learning development process.
    In later chapters, more specific details will be discussed.


    The design of an online teaching/learning system also involves the design of course
    materials. The use of using a systematic approach to designing instruction is
    well discussed by Dick, Carey, and Carey (2004). They argue that, in addition
    to the elements as teachers, students, and teaching materials, the environment
    plays a crucial role in a learning system. Building an online teaching/learning
    system creates a learning environment and can greatly benefit from the research
    of instructional design. In instructional design theory, a generic model for designing
    teaching materials is the ADDIE model which stands for Analyze-Design-Develop-Implement-Evaluate.
    The course material development process covered in this book basically fits into
    this model. Research of Kruse and Kiel (2000) for designing, developing, and delivering
    a Web-based training system, the works of Reigeluth (1999) for instructional design
    theories and models, and the works by Dick, Carey, and Carey (2004) for the systematic
    instructional design theory. Readers who want to learn more about the trends of
    instructional design theories and practice may consider Reiser and Dempsey''s
    (2006) book. They discuss the trends and issues in the instructional design field
    and how technology will affect the future of this field.


    # ONLINE TEACHING/LEARNING NEEDS ANALYSIS


    For an online teaching/learning project, there are two types of requirements.
    The first type of requirement is to develop an online teaching infrastructure
    which is used to host course materials and to support users'' access to the online
    course materials. The second type of requirement is the need of tools to develop
    course materials including interaction, collaboration, and multimedia. Here, we


    Copyright 2009, IGI Global, distributing in print or electronic formats without
    written permission of IGI Global prohibited.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'will analyze the needs for both the development of an infrastructure and the
    tools used to assist the development of course materials.


    In the following, we will first examine some online courses to see what the needs
    are for delivering online courses and for hands-on practice. We will then identify
    the requirements for tools used to create online course materials. Lastly, some
    tips will be provided on collecting information.


    # Requirements for Delivering Online Courses


    Different types of online courses require different kinds of teaching/learning-systems.
    Some courses may only require an Internet connection and a learning management
    system, and other courses may require additional technologies such as database
    servers or online programming packages for hands-on practice. The requirements
    can be categorized into the following types.


    # Courses that Need Learning Management Systems


    It is relatively easy to implement the e-learning platform for a course that only
    requires the support from a learning management system. For this type of course,
    all you need is a well established learning management system for posting online
    course materials and managing students'' assignments. Through the learning management
    system, students can submit their completed assignments. The submitted assignments
    will be graded by using the tools included in the learning management system.
    Hosting the learning management system requires a server with a reliable network
    connection. The server is a relatively powerful computer system. The learning
    management system can be used to generate the course Web site. The server side
    also needs a database management system for the course and student data. A college
    or university may have already installed such a learning management system and
    a group of trained technicians to manage the learning management system and server.
    If so, there is no additional infrastructure requirement from each individual
    course on the server side. On the client side, students and instructors need personal
    computers equipped with remote access multimedia tools, network devices, portable
    storage devices, reliable Internet connections, and Web browsers.


    It is relatively easy to implement a teaching/learning system for the online courses
    that do not require much hands-on practice. For courses that require hands-on
    practice, you will need additional network devices, powerful servers, high capacity
    network connections, and management software. The following discusses the technology
    needed for the courses with hands-on requirements.


