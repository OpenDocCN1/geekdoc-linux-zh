    # Security Management


    In an online teaching/learning system, students, faculty members, staff members,
    and technicians need to access the servers remotely from their home computers,
    office computers, and whatever computers are able to access the Internet. These
    users need to access the network server, Web server, VPN Server, learning management
    system, database management system, and so on. They need to down-'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'load files from or upload files to the servers. For example, the students should
    be able to browse the course Web sites. The faculty members should be able to
    manage the classes and course materials. The staff members should be able to manage
    class registration. The technicians should be able to remotely manage computer
    systems and other network devices.


    One of the concerns is how we can protect the data transmitted over the Internet.
    This task can be accomplished by using the open source tool OpenSSH. OpenSSH encrypts
    the data transmitted over the Internet between computer systems. It supports the
    following encryption algorithms:


    +   - Data Encryption Standard (DES): This is an older version encryption algorithm
    with a 56-bit encryption key. It is not suitable for encrypting highly sensitive
    data. It is often used to construct other encryption algorithms.

    - 3DES (Triple-DES): It is constructed using three DESs. The key of 3DES has the
    length of 112 bits to 168 bits.

    - International Data Encryption Algorithm (IDEA): It is an encryption algorithm
    with a 128 bit key.

    - Blowfish: This encryption algorithm allows keys with variable lengths up to
    448 bits.

    - Advanced Encryption Standard (AES): As a successor of DES, AES is a popular
    algorithm used in symmetric key cryptography.


    SSH is constructed on the client-server structure. The tools on the client side
    can be used to log on to a computer system, shutdown a computer system, securely
    copy a file from one computer to another computer as between two ports, and forward
    data from one computer to another computer. On the server side, the system administrator
    can configure OpenSSH to accomplish the following tasks:


    +   - OpenSSH can be configured to allow a group of users to log on with SSH,
    or deny them from logging in with SSH.

    - The system administrator can also specify which version of the SSH protocol
    to support. There are two versions of SSH, SSH Version 1 and SSH Version 2. SSH
    Version 1 does not provide integrity verification while SSH Version 2. This means
    that the data transferred through SSH Version 1 can be modified intentionally
    or unintentionally. The newer version of OpenSSH only supports SSH Version 2.

    - OpenSSH can be used to manage public keys. The receiver’s public key can be
    used to encrypt the sender’s message. When the encrypted message reached'
