  md: 'Instructional Technology Theory for Online Teaching/Learning System 45


    +   - **System availability:** Make sure that the course materials are available
    to the qualified students. Also, make sure that the class management tools and
    course material development tools are available to the qualified instructors.


    +   - **System performance:** The selected system structure, hardware, software
    should provide adequate performance. Sometimes, to the limit in the budget, the
    designers have to consider alternative designs to get better performance.


    +   - **System scalability:** As the enrollment grows, the system should be designed
    to accommodate future growth. Also, the system should be designed so that it is
    backward compatible to some older versions of technologies.


    +   - **System security:** Security is often the top issue to be considered in
    the online-teaching/learning system. The designers should make sure that the system
    authentication function is properly defined so that the people who use the system
    can only access the data they have permission to access. The security measures
    such as vulnerability detection, network monitoring, and user auditing should
    also be addressed.


    Validation is a critical step for meeting the requirements of teaching and learning.
    An online teaching/learning system is often an enterprise-level project. For such
    a complex project, it is difficult to design a system that meets every requirement
    at the first time. Some of the specifications may not meet the requirements exactly.
    Also, there will be some mistakes. There may be problems when integrating all
    the components together. There could be conflicts when multiple classes share
    the same resources. Also, technology changes at a rapid pace. Something that works
    with an older version of the technology may not work for a new version. These
    factors will lead to the redesigning or modification of the originally designed
    system after the validation process. By identifying problems, the designers can
    use the validation result as a guideline for improving the design.


    After the physical design phase is completed, the next stage of the system development
    process will be the development stage. Next, we will discuss the issues related
    to the implementation of the online teaching/learning system.


    # ONLINE TEACHING/LEARNING SYSTEM DEVELOPMENT


    After the online teaching/learning system is properly designed, it is time to
    develop the system. The system development stage is a complex process which involves
    various technologies and technical personnel with various skills. To successfully
    develop the system designed in the design stage, the first thing is to carefully
    plan the development process.


