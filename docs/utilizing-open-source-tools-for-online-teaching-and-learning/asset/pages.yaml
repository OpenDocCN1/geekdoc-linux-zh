  md: '# Return On Investment (ROI)


    ROI (Lee, Son, & Kim, 2004) is a formula that is used to determine the return
    of a given investment. In terms of accounting, ROI is a simple formula: Return
    = Profits/ Costs. The following are two examples of ROI:


    ```

    $100/$1000 = 10% ROI

    -$30/$100 = -30% ROI

    ```


    When ROI is used to evaluate a teaching and learning process, it does not count
    for factors such as people and time. Evaluating an education system is more complex.
    Unlike the effectiveness analysis in business, universities are non-profit organizations.
    The effectiveness analysis for education does not consider the money spent on
    an online teaching/learning system as purely the annual cost. The money spent
    on education is considered a long term investment. Also, it is difficult to assess
    the effectiveness by counting the cost and enrollment. The students'' attitude
    towards learning and problem solving is also an important factor that is not included
    in the formula. It is not easy to measure these factors. It is true that a university
    should carefully spend the money on the administrative cost, travel cost, cost
    of physical facilities, and maintenance cost. The money should be spent wisely
    on improving the quality of teaching and learning, on student recruitment and
    retention, on knowledge update for faculty and staff, and so on. Therefore, when
    applying ROI to an educational program, the measurement of profits includes factors
    such as increased productivity, a shorter learning curve, improved retention,
    and greater satisfaction.


    # Learning Analytics


    The analysis of learning (Bersin, 2003) is the process to use business analytics
    to evaluate the efficiency, effectiveness, and impact of training and e-learning.
    Learning analytics can be used to provide information to make the training more
    efficient and more effective. It measures three things: efficiency, effectiveness
    and compliance. The following are some details about these three areas:


    +   - Efficiency measures the training expenditure per student, per hour, or per
    course. It also measures the training budget as the percentage of revenue.

    - Effectiveness measures the outcomes of the learning such as enrollment rate,
    students'' GPAs, and student retention rate. It also measures the knowledge and
    skills acquired by the students.

    - Compliance measures the diploma or certification acquisition.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '326 Chao


    Through these areas of measurement, we can reveal the relationship between the
    expense of the training/teaching and the impact of the training/teaching on the
    students. In addition, the result of the analysis provides justification for the
    training-cost. When properly used, learning analytics can help with the decision
    on the type, format, and content of training programs.


    # Balanced Scorecard


    A balanced scorecard (Kaplan & Norton, 1992) is an evaluation model that evaluates
    as well as the human factors. This evaluation model focuses on four areas: Financial,
    customer, internal business process, and learning and growth. Each of the areas
    can be briefly described as below.


    +   - The financial area describes the financial goals which are designed to maximize
    the return on investment and to best improve efficiency.

    - The customer area focuses on the ability to offer high quality products and
    services to the customer to meet the customer''s expectations. Customers'' expectations
    may vary. Therefore, to better serve the customers, the customers will be categorized
    into different types and each type will be provided with a different kind of service.

    - The internal business process area deals with improving business processes.
    It examines the end results of the business processes such as the production and
    service to see if these processes achieve the expectations.

    - The learning and growth area evaluates the ability of an organization in dealing
    with change and growth. Learning new knowledge and skills is one to prepare the
    students for new challenges.


    In the balanced scorecard model, there is a balance among these four areas. Properly
    balancing these four areas will help organizations to maximize their performance.
    The balanced scorecard model measures the success of a project by using the project''s
    objectives as the performance indicators. This model provides a comprehensive
    evaluation by dynamically establishing the relationships among the four areas.
    The results of the evaluation can be used in many ways. The following are some
    of the usage of the evaluation results:


    +   - The evaluation results can be used as the guideline for the long term development
    of the project.

    - The results of the evaluation can be used to facilitate an organization to define
    its development strategy.


