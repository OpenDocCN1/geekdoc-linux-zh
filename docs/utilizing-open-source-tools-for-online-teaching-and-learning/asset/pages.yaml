    # Rootkit Detector


    A rootkit is a type of technique that can be used to hide malware such as viruses
    and spyware so that the malware cannot be detected by antivirus scanners. The
    stealth malware hidden using the rootkit technique is very difficult to detect
    and can cause great damage to a computer system or a network. A rootkit can be
    used by a hacker to access a computer system or even take control of the system.
    Facing the rootkit threat, a new type of security software called rootkit detector
    has been created to deal with the malware hidden with the rootkit technique. Among
    these rootkit detection programs, some are open source or even free software.
    The following briefly describes some of the open source or free rootkit detectors:


    +   * OSSEC OSSEC (2007) is an open source host-based intrusion detection system.
    One of its functionalities is rootkit detection. OSSEC includes the open source
    rootkit detection software called Rootcheck. Security managers can use Rootcheck
    to scan systems for known rootkits. Rootcheck is also able to alert the presence
    of unknown rootkits. Once a rootkit is detected, Rootcheck will generate a report
    to provide the information about the finding. While integrated with OSSEC, it
    provides additional services such as file integrity checking, real-time alerting,
    system monitoring, correlation analysis, and so on. The installation of Rootcheck
    is simple, and it runs on various operating systems such as Linux, Mac OS, and
    different versions of UNIX.

    * Rootkit Hunter: Rootkit Hunter (2007) is another source rootkit scanner. This
    rootkit scanning can be used to identify rootkits and other stealthy malware by
    running various tests such as MD5 hash comparison and checking wrong file permissions.
    It also checks the default files used by rootkits, suspected strings and hidden
    files. Rootkit Hunter runs on the Linux operating system distributed by various
    Linux distributions.'
