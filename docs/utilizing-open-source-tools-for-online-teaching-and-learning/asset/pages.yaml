    teaching/learning system. Due to the lack of face-to-face help on many technical
    problems, online and telephone technical support are crucial for reducing the
    stress of online teaching and learning. Technical support is needed in various
    areas of the online teaching/learning system as remote access, LMS usage, and
    online computer labs. The need to cover so many different technologies makes technical
    support a difficult task. The following are some of the difficulties in technical
    support.


    +   * The requirements for technology vary from course to course. Each course
    has its own special needs for what hardware and software to use and how the configuration
    should be done.


    +   * The technical support team also needs to provide support for various types
    of computer systems such as the Linux or Windows operating systems on personal
    computers, or on Sun’s UltraSPARC platform. Especially, different platforms on
    the client side may be used to access the servers and the university does not
    have much control of the client side.


    +   * Students’knowledge levels are different. Some students may need very detailed
    help through telephone conversations and others may consider online instruction
    and help adequate. Some of the students are not afraid to try anything. They may
    easily reset the existing configuration and disable some of the services in the
    online teaching/learning system.


