    As described above, most of the application software related virus infections
    are due to the vulnerabilities of the Internet exposure. There are several things
    that students and faculty members can do to reduce the vulnerabilities caused
    by the application software. To prevent viruses from being introduced by e-mail,
    users should be careful not to open untrusted e-mail. The e-mail server administrator
    can configure a filter at the gateway to intercept e-mails from suspicious origins.
    The user should not accept communication requests from unknown sources. Security
    vulnerabilities can also be reduced if the remote access services of the application
    software are properly configured. Make sure not to assign more privilege to users
    than they really need.


    In the above, we have discussed various security vulnerabilities that may exist
    in an online teaching/learning system. Some security measures have been suggested
    to reduce the vulnerabilities. To decide where, when, and how to implement the
    security measures at the enterprise level, a security policy should be carefully
    developed. The next topic is about security policies.


    A security policy is a set of rules and practices about what to protect and how
    to protect it. To protect an online teaching/learning system, the security policy
    should be created by a team that consists of the system and network administrators,
    the institution''s leaders, application developers, faculty members, and instructional
    support staff members. In such a way, the requirements for security in different
    areas will be taken care of by the security policy.


    The creation of the security policy starts with collecting information such as
    the current regulations and rules imposed by the university and the current security
    practice by the computer science department. The security policy development team
    should evaluate how security problems will impact the operation of the online
    teaching/learning system. The team needs to identify the information that should
    be protected and provide a list of possible security vulnerabilities. The team
    will prioritize the vulnerabilities and provide a guideline on how to deal with
    these security vulnerabilities. The team should propose a list of proper security
    measures to be enforced for protecting the sensitive information. The team needs
    to consider the level of technical difficulties and the cost for enforcing these
    security measures. Also, the team should develop a privacy policy for publishing
    personal information on the course Web sites.


