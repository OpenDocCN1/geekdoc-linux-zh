  pgno: 331
- img_proc: true
  md: '# Implementation and Evaluation of Online Courses 307


    anywhere. The authors pointed out that both informal learning and highly structured
    online forums can be used for teacher support.


    The evaluation of online teaching and learning is another field that has been
    well studied by researchers. One of the significant contributions to the evaluation
    theory of teaching, training, and learning was refined by Kirkpatrick (1998) and
    later revised by Kirkpatrick and Kirkpatrick (2005). The Kirkpatrick model of
    evaluation provides an in-depth and practical guidance for evaluating training
    and teaching.


    Fortier and Michel (2005) discussed the issues related to the performance of computer
    systems. The theory, concepts, strategies, and technologies provided by Fortier
    & Michel (2005) can be used to evaluate the infrastructure of an online teaching/learning
    system and online computer labs. The evaluation of online courses is covered in
    Khan''s (2005) book which provides sequences of check lists for verifying if the
    e-learning modules, courses, and programs have achieved their objectives. Price,
    Walters, and Xiao (2006) discussed the use of an online evaluation system that
    was designed for students to evaluate their instructors.


    Achmeister, Morris, and Finnegan (2003) gathered the principles of the best practices
    of teaching and learning online courses and compared them with the evaluation
    instruments of their institutions and with other online courses. Based on the
    results of their study, they provided a guideline for the evaluation of online
    courses.


    For the development of a collaborative evaluation system, readers may find useful
    information in the paper by Tu, Yen, Corry, and Ianacone (2003) who proposed an
    integrated online evaluation system to allow instructors, their students, and
    their peers to evaluate their online teaching. Tu, Yen, Corry, and Ianacone (2003)indicated
    that the instructors and students were in favor such an evaluation system.


    The deployment and evaluation of online teaching have been studied extensively.
    In addition to the commonly used implementation and evaluation theories and practice
    to the open source based online courses, this chapter will provide information
    on the training of the open source products. It will also introduce some of the
    evaluation instruments developed with open source tools.


    # DEPLOYMENT OF ONLINE TEACHING MATERIALS


    The goal of the deployment of online teaching materials is to make sure that students
    are able to access these materials without any hassle. Depending on the requirements
    by the online courses, the deployment can be carried out in different ways. The
    course materials can be deployed through Web sites, or downloaded through an FTP
    server, or delivered to the students with CDs/DVDs and portable


    Copyright © 2009, IGI Global, distributing in print or electronic formats without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'storage devices such as flash drives, or the combination of different methods.
    The choice of deployment methods depends on the online teaching/learning environments
    as listed below:


    +   * Some colleges and universities allow students to access course materials
    through mobile devices such as iPads and smartphones. For those Internet capable
    mobile devices, deployment through the Web server is a good choice. Otherwise,
    the course materials can be delivered through portable media such as flash drives
    to students'' personal computers and then loaded to the mobile devices.

    * If a university has multiple campuses located in different countries and the
    conditions of Internet connection vary from campus to campus. In such a case,
    multiple Web servers may be needed so that the deployment of the course materials
    can match the environment at the campus level.

    * Some environments may require the course materials to be delivered through portable
    storage devices such as CDs/DVDs or flash drives, for instance, a university in
    a rural area where many of the households have no broadband connection. If a Web
    server is used to deliver the course materials, the text version of the course
    materials should be available for quick download.

    * Sometimes, course content is so large that it is distributed to multiple servers.
    When deploying these course materials to students, the servers should be properly
    synchronized and optimized to make all the course materials available for the
    students.


    In many cases, the deployment of course materials requires team effort. There
    will be some technical challenges and changes in students'' learning behavior.
    Even though some of the course materials work flawlessly, they may encounter problems
    after deployed to students. The following are some of the problems that may occur.


    +   * **Class Web performance:** The class Web sites are running too slowly. This
    may be caused by an underperformed server and network equipment, improperly configured
    hardware and software, or slow network connection.

    * **Course management:** The course materials may not be available for students
    due to several factors. There is no course material backup plan, so the course
    materials cannot be recovered after a disaster. There are some other factors that
    may also cause the course materials to be unavailable after a disaster; for example,
    the log files are not properly stored, the restoration process is not'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Implementation and Evaluation of Online Courses 309


    properly configured, and the instructor is not well trained for class management.


    +   **Client-side configuration:** The users including the students and instructors
    are not well informed about the client-side configuration for using the online
    course materials or managing the classes, or the configuration on the client side
    is so complicated that it requires the users to have in-depth training that they
    have not had.


    +   **Remote access connectivity:** A remote access connectivity problem can be
    caused by user authentication, security constraints on the Web server and Web
    browser, wrong configuration on either the client side or the server side, and
    incompatible remote access technology on the client side.


    +   **Compatibility:** Some newly developed course materials may not be compatible
    with the LMS server. Also, some of the third party tools may not be compatible
    with the course materials and the LMS server.


    To avoid the deployment problems, the following tasks should be carried out before
    starting the deployment process:


    +   * The first task is to investigate the deployment environment including the
    performance of the Web server and the server that hosts the LMS and other application
    software, the internal network and the Internet throughput, compatibility requirements
    for the client-side software, the conflicts caused by security measures, the users''
    background knowledge about the upcoming project, user authentication and authorization
    for certain resources, the language requirements for a multinational online teaching/learning
    system, and remote access requirements.


    +   * Based on the results of the investigation, the deployment team should draft
    a deployment plan that includes the strategies to obtain proper resources for
    the deployment, the deployment implementation schedule, the arrangement of training,
    the technical support personnel arrangement, and so on.


    +   * The deployment team should find the solution for the compatibility issues
    and work around the conflicts caused by the security measures. The team needs
    to take action to resolve the performance related problems. Before the deployment
    can get started, funding and personnel should be in place. The team also needs
    to make sure that the users have adequate knowledge of the client-side software
    configuration.


    +   * It is also important for the open source LMS server and the online computer
    lab to handle the content created by proprietary products such as Microsoft Office.
    Students may submit their term papers as Microsoft Word documents.


