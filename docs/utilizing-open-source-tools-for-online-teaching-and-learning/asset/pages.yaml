  md: '# Redundancy


    According to Figure 3-1, a student can access the course materials of one of the
    two campuses depending on which campus the student is registered in. To make the
    online teaching materials available to students 24 hours a day and 7 days a week,
    the university''s network has to be highly reliable. The reliability of the network
    can be strengthened by using redundancy and by using well-designed network physical
    structure. The following discusses these methods.


    The network server has to be highly reliable. Redundancy is a commonly used technique
    to improve reliability. It can be used to prevent the failure of a network component
    that causes the failure of the network server itself. The following are some of
    the network server components that can be protected by using redundancy.


    +   * The hard disk system in a network server is one of the most vulnerable components.
    The redundancy method provides fault tolerance to the hard disk system. The commonly
    used fault tolerance technique is Redundant Array of Inexpensive Disks (RAID).
    More details about RAID will be covered in later chapters. Anothertechn is Self-Monitoring,
    Analysis, and Reporting Technology (SMART).


    +   * Memory failure can cause data corruption. To prevent memory failure, you
    need to use the memory that supports Error Correct Code (ECC). By using additional
    RAM, ECC is able to correct a single-bit error by itself and report multiple-bit
    errors.


    +   * The failure of processors will crash the entire network system. Using a
    network server that multiple processors greatly improves reliability. In this
    way, the failure of one processor does not cause the total failure of the network
    server. Another benefit for the network server to use multiple processors is that
    it can significantly improve the network server''s performance.


    +   * The failure of the network server''s network card can disable the communication
    between the network server and other devices on the network. To prevent the network
    server''s inability to communicate with the rest of the network, the network server
    can use the network card redundancy technique (using multiple network cards).
    This can also improve the network server''s performance.


    +   * Server redundancy can prevent damage caused by the failure of any components
    in the network server. Server redundancy can be done by creating a pair of network
    servers, as the primary server and the other as the secondary server. Any change
    on the primary server will be copied to the secondary server. If the primary server
    fails, the secondary server will continue to op-'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Technology Requirements of Online Teaching/Learning Systems 73


    erate. To achieve even better redundancy and performance, several network servers
    can be clustered together.


    +   - Power failure is another reason that causes the network server to shut down.
    Using multiple power supplies is the solution. Network servers can be supported
    by two or three power supplies. In this way, the failure of one power supply will
    not cause the network server to shut down.


    The redundancy method requires more equipment. However, it is an effective way
    to reduce the network server’s downtime. The shutdown of the entire network. Nothing
    can be more frustrating than changing the network’s physical infrastructure, as
    described above, can also improve the reliability in the following.


    # Network Physical Infrastructure


    Redundancy can be considered a special case of re-designing the network physical
    infrastructure. There are some other ways to re-design the network physical infrastructure
    for better reliability.


    +   - To guarantee the power supply, we should attach the equipment called uninterruptible
    power supply (UPS) to each of the main network devices. A UPS can be a battery
    backup system or an emergency generator based backup system. During a power outage,
    the UPS can still supply power for the network servers. It can also eliminate
    electric spikes to protect sensitive electronic parts.


    +   - Mesh networks can also improve network reliability. Unlike the other networks,
    all the nodes in a mesh network are connected to each other via multiple routes.
    With such a structure, when one part of the connection in the network breaks down,
    the network can still operate through the other routes. Therefore, such a physical
    structure forms a very reliable network.


    +   - A grid system that covers each branch campus is another option to make a
    network server more reliable. In a grid system, the computation result at one
    node of the network will not immediately affect the other nodes of the grid. In
    such a way, the breakdown of one node will not affect the normal operation of
    the other nodes.


    Some measures in the daily network management practice can also improve the reliability
    of a network. The following are some of commonly used measures:


    +   - Timely update routers and other network equipment with patches to fix the
    operation and security problems.'
