    If portable storage is required for the deployment, CDs/DVDs or flash drives should
    be preloaded with the course materials and the instruction on how to use the course
    materials.


    An e-mail account should be created for each student who is accepted by the university.
    The e-mail account is so configured, that after the first login, the student will
    be able change his/her password. Through e-mail, the students will be informed
    that the course materials are available on their class Websites, or on portable
    storage devices. The students will also be told how to log on to the class Websites.
    In addition, the e-mail will include the information such as where and how to
    get technical support and the links to the training information. After the classes
    have started, the instructors may send e-mail to their students and pre-class
    surveys if necessary.


    Many of the students are the first users of the online teaching/learning system.
    It is very possible that they will need technical support. They may need help
    on how to use the online teaching/learning system or on how to fix problems, some
    of which may be caused by their mistakes. The technical support related-ues will
    be discussed next.


    # TRAINING AND TECHNICAL SUPPORT MANAGEMENT


    Once the online teaching/learning system is made available for the students, questions
    from the students will pour in. To help students reduce the learning stress, it
    is necessary to provide training and technical support for the students as well'
