    # DATABASE SYSTEM DEVELOPMENT


    In an online teaching/learning system, the database stores and manages the course
    and user information. It must be specially designed and developed to meet the
    requirements by the online teaching/learning system. In general, the database
    development process involves several major phases including:


    +   **Requirement investigation:** To meet the requirements of an online teaching/learning
    system, it is important to find out what exactly the requirements are. The database
    designers and developers need to thoroughly understand the underlying online teaching/learning
    system.


    +   **Database design:** Based on the result of the requirement investigation,
    the database design team set up database design goals and create a logical data
    model and a physical design plan to meet the design goals.


    +   **Database development:** The development of a database requires careful planning
    and skills. The issues related to converting a data model to a relational database,
    populating the database, developing database applications, setting database security,
    and testing the database should be considered in the development phase.


    +   **Data analysis:** As the data of teaching and learning are cumulated, they
    can be analyzed to identify students'' learning behavior and predict the trend
    in learning and teaching. The data analysis service should be configured and tested
    to support the data analysis.


    +   **Database management:** Once the database is in place, the next task is to
    keep it running in good condition so that online teaching and learning will not
    be interrupted by database failure. The data stored in the database should be
    well protected. It is critical to keep the database secure and no database objects
    should be accessed or modified by an unauthorized person.


    It takes a great deal of effort to accomplish each task in the database development
    process. To better understand the entire process, let us take a closer look at
    each database development phase to find what tasks tasks should be accomplished
    and who are involved in the development process.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Requirement Investigation


    Since teaching and learning in higher education institutions are so diversified,
    each online teaching/learning system has its own specific requirements. Therefore,
    the first task in the database development process is to investigate the specific
    requirements for the database to be developed. At this phase, the database development
    team needs to answer these questions: How will the future database be used in
    the online teaching/learning process? What are the teaching and learning activities
    supported by the future database? What are the rules and limitations enforced
    by the university? To find the answers to these questions, the database development
    team needs to identify the information that will be stored and kept track of.
    To be able to collect all the above information, the database development team
    should interview the key players of the online teaching/learning system. They
    should also examine the documents such as registration forms, class schedules,
    and course catalogs. They need to understand how the data are used in the online
    teaching/learning process so that they can design the database to support the
    teaching and learning activities. To figure out how the data flow will be used
    in the teaching and learning activities, they need to observe how the information
    is collected, the database development team will interpret, categorize, and document
    the information to get ready for the database design.


    # Database Design


    The next phase in the database development process is the design phase. The database
    designers of the database development team need to represent the collected information
    with database objects and identify the attributes to describe each database object.
    They also need to identify the relationships among those database objects. With
    the database objects and relationships among them, the database designers can
    develop a data model which is the blue print for the future database. After the
    initial data model is created, the database designers need to verify if the future
    database will meet the database requirements. Usually, the initial data model
    is not ready to be used for creating the database physically. It may take several
    rounds of modifications before the design goals can be achieved. Logically, the
    database designers and the key players of the online teaching/learning system
    work together to go over the data model for verification. If there should be a
    modification of the database structure, it is much easier to do it on the data
    model. It is much harder to make any change on the database structure once the
    database is physically created and populated with data. Both the database designers
    and the key players should be satisfied with the data model before the database
    can be physically implemented.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'Since the 1970s, several data modeling techniques have been developed. The
    following are some of the commonly used data modeling techniques.


    +   - The entity-relationship model (E-R model) introduced by Chen (1976) is one
    of the widely used modeling tools. This data model consists of entities, attributes,
    and relationships to represent the logical structure of a database. The word "entity"
    is a generic term for a database object such as Student, Course, Enrollment, and
    so on. Attributes are characteristics to describe a database object. For example,
    the attributes such as Student Id, First Name, Last Name, Major, and so on are
    used to describe the database object.

    - Another widely used modeling tool is the Unified Modeling Language (UML), which
    includes components such as class, attribute, relationship, and operation. As
    a general-purpose modeling language, UML can be used in data modeling. Although
    it is slightly difficult to represent database objects with UML, it is convenient
    for those who already know UML to develop databases. Besides, UML has more functionalities
    to represent database activities than those of the E-R modeling technique.

    - ICAM Definition Languages (IDEF) is also commonly used for data modeling. In
    the family of IDEF, IDEFIX is accepted by the federal government as the representation
    technique for data modeling. The IDEFIX modeling technique can be used to produce
    a graphical data model which represents database objects, attributes, relationshipsamong
    database objects and structures. The use of IDEFIX has several advantages. IDEFIX
    provides icons to represent E-R components such as entities, attributes, relationships,
    and domains. Most of the data model logical structures can be represented with
    IDEFIX icons. It is relatively easy to convert the data model that completes with
    the IDEFIX standard to a physical database.


    In the above, three commonly used data modeling techniques are introduced. An
    entity or class representing a database object can be further normalized to avoid
