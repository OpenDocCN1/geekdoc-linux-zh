    # CLIENT-SERVER ARCHITECTURE


    The network development procedure is similar to the development of an online teaching/learning
    system. It includes the planning, designing, and implementation phases. In this
    section, we will focus the network infrastructure. First, we will investigate
    various types of client-server structures and discuss how each of these structures
    fits in different types of online teaching/learning systems.


    In a networked teaching/learning environment, servers are used to manage users
    and network resources, provide and store course materials, and respond to the
    requests from clients. The networks are constructed to link the servers to the
    clients. The client side runs various applications. When the applications need
    the information stored on the server computer systems, the clients requests to
    the servers. The advantages of using the client-server architecture to host the
    online teaching/learning system are:


    +   - The workload is distributed between the servers and clients; this significantly
    improves the online teaching/learning system''s performance.

    - The clients contact the servers only when it is necessary. Part of the application
    related tasks are done on the clients'' computer systems. In such a way, we can
    significantly reduce the network traffic.

    - A system implemented on the client-server structure is more reliable. The workload
    is distributed to multiple computer systems. The failure of one computer system
    will not completely shut down the operation. Also, various measures such as redundancy
    can enforce to improve the reliability of the servers.

    - The client-server structure is more flexible. It allows the older technology
    to work with the new technology without replacing the older technology. It also
    allows the new version of software to work with the older software side by side.
    One application on the client side can use data from various data sources and
    one data source can supply data to multiple clients.

    - The client-server structure can handle a large number of data transactions and
    a large number of simultaneous logins.

    - The data stored on the servers of the client-server structure are more secure
    since the servers are better protected by various security measures.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# 90 Chao


    An online teaching/learning system usually supports hundreds and thousands of
    simultaneous logins. Based on the size of the simultaneous logins and the complexity
    of the infrastructure, the client-server architecture can be categorized as two-tier
    architecture, three-tier architecture, or N-tier architecture.


    # Two-Tier Architecture


    If the workload is divided into two partitions, such a computation structure is
    called the two-tier client-server architecture which includes a client tier and
    a server tier. The two-tier architecture is good for a small online teaching/learning
    system which has less than one hundred simultaneous logins. It is also good for
    hands-practice required by some technology-based courses. It is easy to set up
    and manage, however for the online teaching/learning system, the two-tier structure
    has some limitations. Since a client is directly connected to a server, each connection
    is a keep-alive service. The performance of the two-tier system can be a serious
    problem when there are many simultaneous logins to less than one hundred. Another
    disadvantage is that the two-tier structure is not flexible enough when hosting
    the online teaching/learning system. When the online teaching/learning system
    is upgraded, the system on both the server and client tiers has to be replaced
    by the new system. Also, since the clients are directly connected to the server
    the server uses. For example, when a technology-based course requires Oracle for
    hands-practice, a database server is used to host the Oracle database. On the
    client side, the Oracle client server must be installed for accessing the database
    server. If later the university decides to use MySQL, the Oracle software on both
    the client side and the server side has to be replaced by the MySQL software.
    Due to these limitations, the two-tier structure is often used for hands-practice
    and seldom used to host an online teaching/learning system.


    # Three-Tier Architecture


    When the workload is divided into three partitions, such a computation structure
    is called three-tier client-server architecture which includes a client tier,
    a middle tier, and a server tier. The three tier client-server structure is designed
    to overcome the difficulties of the two-tier system by adding a middle tier between
    the client tier and the server tier. The middle tier can be used to provide services
    such as Web service, transaction processing service, message service, remote access
    service, firewall service, business logic implementation service, and so on.


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Network Development and Management 91


    can make the three-tier client-server system able to handle a large number of
    si-multaneous logins. For example, when there are one thousand simultaneous login
    attempts, we can create ten tier servers, each of them assigned to handle one
    hundred logins. When a client requests an activity, the middle tier will analyze
    the request. Depending on the client''s request, the middle tier will decide which
    server to contact and get response from the server. In such a way, a server only
    deals with a maximum of ten tier connections instead of one thousand direct client
    connections. Also, the transaction processing service allows the clients to share
    a pool of resources. When requested, the middle tier arranges the connection from
    a client to a requested resource. When the job is done, the requested resource
    is returned back to the pool and is ready to handle another request. In such a
    way, a single connection can hold the resources in its connection session.


    Another advantage of the three-tier client-server structure is that it is much
    more flexible. For example, currently, we have an Oracle database server installed
    to host databases for hands-practice required by some of the technology-based
    courses. If other courses want to use MySQL for hands-practice, we can just add
    a new database server on the server side. There is no need to replace the Oracle
    database server with the MySQL database server. The middle tier''s transaction
    processing service will decide if a request is for Oracle or MySQL, and then forward
    the request to the right database server.


    The next advantage of the three-tier structure is that the middle tier can share
    some of the workload on the servers and clients. The calculation of business logic
    requires a lot of computation power, which can significantly slow down a server''s
    performance. By implementing the business logic on the middle tier computer system,
    the server can be released to work on other jobs. The middle tier communicates
    with the server only when it is necessary. Some middle tier can process a client''s
    request with several resources simultaneously. The middle tier can also be used
    to host various special purpose servers such as application servers, VPN servers,
    FTP servers, learning management servers, Web Servers, and firewall servers.


    In addition to all the above advantages, the three-tier client-server structure
    is more secure. The server is protected by the middle tier. Many security measures
    can be implemented on the middle tier, such as authentication and virus detection.
    The Web server is one of the most vulnerable components in an online teaching/learning
    system since it directly connects to the Internet. When placed on the middle tier,
    the Web server prevents clients from directly accessing the back-end servers.
    The Web server is used to interact with front-end users. In such a way, the Web
    server can be used to prevent Internet hackers. Instead of letting the clients
    directly access a database to retrieve information, the middle tier can provide
    Web services to supply data requested by the clients.


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '92 Chao


    # N-Tier Architecture


    For an even more complex online teaching/learning system, we can consider an N-tier
    client-server structure. In the N-tier structure, the tiers are further divided
    into more specific tiers such as a data tier, presentation logic tier, data access
    tier, proxy tier, business logic tier, and so on. The functionalities provided
    by each tier are summarized in the following.


    +   - Data tier: A data tier includes storage devices, database servers and other
    data sources such as text files, spreadsheets, and XML files.

    - Client interface tier: This tier includes all the interfaces on the client side
    such as forms and reports for the users on the client side to enter data, view
    information, and perform some other activities.

    - Presentation logic tier: This tier includes the presentation logic to support
    client interfaces as Web forms and reports.

    - Proxy tier: This tier controls how a user from the client side communicates
    with the server. It can be used to analyze the user''s request and provide the
    access to the server based on the permissions given to the user.

    - Business logic tier: A business logic tier is used to implement business rules.
    When implementing business constraints, this tier often consumes additional computation
    power. Therefore, it is usually not placed on the server where the data tier is
    located.


    For a complex system, the distribution of workload to more tiers can make the
    computation more efficient. On the other hand, too many small tiers can make the
    networks more complex and hard to manage.


    The networks that support the client-server structure often include the Internet,
    home networks, campus backbone networks, departmental networks, and networks used
    for hands-on-practice. The communication among these networks is controlled by
    routers which pass data from one network to another. In addition to routers, there
    are many other network devices. Routers also provide various protocols to handle
    different network related jobs. The following section discusses network devices
    and protocols.


    # NETWORK EQUIPMENT AND OPEN SOURCE NETWORK PROTOCOLS


    Network devices are used to link computer systems that need to communicate with
    each other. These devices create paths between the computer systems. The network


