  md: '# Utilizing Open Source Tools for Online Teaching and Learning


    APPLYING LINUX TECHNOLOGIES


    It is necessary for online teaching designers and developers to understand the
    roles played by open source products in developing and supporting an online learning
    system.


    Utilizing Open Source Tools for Online Teaching and Learning: Applying Linux Technologies
    covers strategies on using and evaluating open source products for online educational
    instruction. By going through each phase of the development process, this book
    provides comprehensive coverage on the application of open source products to
    the goals and objectives of instructional technology.


    +   Topics Covered:

    Client computer systems

    Database development for online courses

    Developing online teaching and learning systems

    Instructional technology theory

    Network development and management

    Online course materials

    Online teaching and learning

    Open source products

    Security management

    Server development and management

    Trends and advances in online teaching


