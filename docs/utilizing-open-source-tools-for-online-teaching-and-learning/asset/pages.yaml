  md: 'The next main task of TCP is checking errors occurred during the transmission.
    It verifies if any packets get lost during the transmission. Therefore, TCP is
    known as a completely reliable protocol. It makes sure that anything sent by the
    sender is delivered to the receiver and there are no duplicated packets. Another
    great feature of TCP is congestion control. During transmission, busy traffic
    or a hardware problem can cause the delay of a packet''s arrival at the destination.
    UDP will in turn cause more resending of messages, which will make the congestion
    even worse. TCP uses the testing signal to decide how much data should be sent
    to avoid congestion.


    As open source protocols, the combination TCP/IP is not only installed on the
    open source operating systems as Linux and BSD, it is also the default network
    transmission protocol on most of the commercial operating systems such as Windows,
    Mac OS, and various versions of the commercial UNIX operating system.


    +   **Hypertext Transfer Protocol (HTTP):** In Chapter 1, it was mentioned that
    Tim Bern-Lee invented the open source World Wide Web. As part of the World Wide
    Web, HTTP written by Tim Bern-Lee, is an application protocol that is embedded
    in TCP for transferring text files, images, audio, video, and other files on the
    World Wide Web. Being embedded in TCP, the new version of HTTP can keep a connection
    and is able to transfer all of the page components. In such a way, HTTP does not
    need a new connection for each component on the Web page; this can speed up the
    transmission significantly. A web browser serves as a HTTP client. While clicking
    a link or refreshing a URL, the HTTP client sends a request to the Web server
    analyzes the request and handles the request with an HTTP daemon program. Later,
    the response from the Web server will be sent back to the HTTP client.


    +   **User Datagram Protocol (UDP):** Like TCP, UDP is used to send or receive
    messages over a network. UDP identifies application programs by the port numbers
    used by these programs. UDP also works with IP to transfer messages over the Internet
    or a local area network. The difference between TCP and UDP is that UDP does not
    provide error checking and does not form packets for data transmission. These
    features make UDP not completely reliable protocol. A message can be lost, duplicated,
    out of order, or corrupted. On the other hand, UDP is more efficient than TCP
    and has much less overhead. Even though UDP is not suitable for some high quality
    transmission, it is very good at transmitting audio and video data which are more
    tolerant to small transmission errors.


    +   **File Transfer Protocol (FTP):** FTP is another standard protocol. Virtually
    every operating system supports FTP; this means that an FTP server can'
