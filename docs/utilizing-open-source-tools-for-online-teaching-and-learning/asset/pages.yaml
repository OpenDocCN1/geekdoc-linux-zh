    image formats and use the advanced image features.


    +   * StationRiper radio recorder: StationRiper (2008) can be used to record Internet
    radio broadcasts. It can record up to 600 audio streams simultaneously. It can
    also record and play YouTube radio and podcasts. In addition to recording and
    playing songs, StationRiper can also be used to manage the downloaded broadcasts.
    It can be used to keep track of your favorite radio stations. StationRiper keep
    track of all the downloaded content so that users can easily search for the content
    they want. During the downloading, it can automatically skip the duplicate.


    +   * FlasMPEG video converter: FlasMPEG (2008) can be used to convert MPEG video
    to other formats. It can be used to decode MPEG1/MPEG2 video and A52/MPEG audio.
    FlasMPEG can also be used to encode and decode DVD and VCD audio and video content.


    +   * Inkscape graphics editor: Inkscape (2008) is an open source graphics editor.
    It supports many W3C standard Scalable Vector Graphics (SVG) features such as
    markers, clones, and alpha blending. Inkscape works with the operating systems
    such as Linux, Windows, and Mac OS X or other UNIX-like operating systems.


    +   * DVD video backup: DVDx (2008) is open source DVD backup software. It can
    be used to convert DVD videos to high quality movies in the AVI and MPEG/2 formats.
    It can copy DVD movies into other formats such VCD, SVCD, DivX, and WMV. Before
    the encoding process, DVD allows users to preview the content. It also provides
    audio track support.


    +   * XnView graphic viewer: XnView (Goulet, 2008) is a free graphic viewer. It
    can also be used to convert graphic files. XnView supports over 400 graphic formats.
    It also supports most of the commonly used operating systems including Linux,
    Windows, Mac OS X, and many different versions of UNIX. Xn even works on pocket
    PCs and smartphones.


    There are other open source and free multimedia development and management tools
    that are just as good as those described above. The selection of tools often depends
    on the developers'' experience with the tools and depends on whether the tools
    select can handle the job of developing multimedia course materials.


