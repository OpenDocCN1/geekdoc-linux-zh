  md: '# Foreword


    How to make better use of open source technologies in learning, teaching, and
    lab management systems is a matter that is widely discussed in professional meetings
    and at other formal and informal meetings of faculty, researchers, administrators,
    and managers of educational institutions, training centers and labs. Mostly the
    conversations would revolve around the challenges and difficulties encountered,
    and partial successes. Those with a success story would usually share his or her
    experiences to other groups of individuals. The value of Li Chao''s Utilizing
    Open Source Tools for Online Teaching and Learning: Applying Linux Open Technologies
    is greatly enhanced by the fact that it is perhaps the first truly comprehensive
    and authoritative book to appear on the difficult task of planning, developing,
    and administering the various components of an online teaching/learning system
    using only open source technologies. The book has importance that it is not only
    timely but timeless, in that it covers all aspects of the application of open
    source technologies to online teaching/learning systems, and moreover it discusses
    many of the underlying instructional and foundational issues besides the nuts
    and bolts of downloading and configuring the latest systems and technologies.
    The book provides a wealth of guidance and valuable information on the technologies
    that are available and what they can do, with a special emphasis on Linux operating
    systems and related products, and how to develop and administer online teaching
    systems using them. To its author, whom I have had the pleasure of working for
    many years, may every reader render due appreciation, for distilling the wisdom
    garnered from his experiences and much research that has gone into this work.


    May I underscore that this book is not just theory—even though the author has
    gone to extraordinary measures to describe the methodological underpinnings—but
    rather based on much practical experience, what we actually use, the result of
    much trials and tribulations on the author’s part, and the ultimate lessons learned.
    What Li describes in these pages actually works, and in many instances reflects
    the'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'best strategies and options that are available for the set of conditions or
    problems

    being considered.


