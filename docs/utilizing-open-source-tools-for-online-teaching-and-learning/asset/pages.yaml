    # EXAMPLE 1: CONFIGURING REMOTE ACCESS ON LINUX OPERATING SYSTEM


    Students can remotely access the Linux operating system graphically or through
    a text-based interface. The text-based remote access is for the students who do
    not have a high speed Internet connection. In the following, we will consider
    several commonly used Linux remote access methods.


    # Secure Shell (SSH)


    Through Telnet, one can remotely access a computer system run on the Linux operating
    system. Telnet is a text-based remote access method. During the data transmission
    process, the biggest problem is that Telnet carries plain text which can be easily
    captured by hackers. SSH is a descendant of Telnet and can be used by the user
    to log on to another computer over the network. After the user logs on to the
    other computer, he/she can execute commands and manage files. SSH provides strong
    authentication and secure communication over insecure channels. By using login
    provided by SSH, including password transmission, the content to be transmitted
    over the network will be encrypted. SSH can also protect the network from hackers''
    attacks. The following is an example of SSH configuration.


    To conduct the experiment, you need at least two computers connected through a
    network. Make sure that these two computers can ping each other. To examine the
    effect of SSH, you may need to install a network observation tool such as Ethereal.
    Usually, SSH is included in the Linux operating system by default. To enable the
    SSH service, enter the following command:


    ```

    service sshd start

    ```


    To verify that SSH is secure, you can start Ethereal and set it in the capture
    mode. Suppose that one of the computers on the network has IP 10.1.1.1. Enter
    the following command from another computer:


    ```

    login 10.1.1.1

    ```


    Execute some commands such as entering the command ls to list files in the directory,
    and then log out. Stop Ethereal and examine the captured content, you


