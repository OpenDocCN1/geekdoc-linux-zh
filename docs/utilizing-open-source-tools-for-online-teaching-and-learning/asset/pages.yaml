    # EXAMPLE 2: SETTING MYSQL SECURITY


    After MySQL is successfully installed, the database administrator will work on
    the security related issues before the database can be made available to the public.
    The default installation of MySQL may have some security vulnerabilities if not
    modified. For example, the following are some potential problems if:


    +   - The database administrator account is left unchanged.

    - The MySQL process is shared with other processes running on the host Linux operating
    system.

    - The remote access is not modified to have data encryption protection.

    - The anonymous user accounts are not disabled.

    - The sample databases are left running on MySQL.


    # Database Service Isolation


    To improve security, the chroot utility is used to isolate the database service
    from other processes. The following are some possible measures to strengthen MySQL''s
    security.


    +   1. To make sure that MySQL is handled by a group of trusted users, the system
    administrator should create a user group and assign the database administrator
    accounts to with adequate privileges.

    2. The MySQL installation process can be configured so that it is ready for creating
    MySQL the database administrator accounts. For example, compile the MySQL installation
    file with configurations, such as specifying the path to the working directory
    and the temporary directory, setting the privileges to run the MySQL daemon, and
    setting the parameter --with-mysqld-ldflags =all-static which specifies that MySQL
    is linked statically.


