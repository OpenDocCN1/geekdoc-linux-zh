  md: '# Web Authoring Tools


    Web authoring tools can be used to develop a Web site which are accessed through
    the Internet. A Web site consists of Web pages that are linked together. Some
    of the Web pages are used as front-end applications for a database or a learning
    management system. These types of Web pages may include forms and reports. A authoring
    tool often includes a Web page editor for creating Web Pages. With a Web editor,
    the user can create links and clickable images. A Web editor can also be used
    to create Web applications as forms and reports and link them to the data sources
    at the back end. Web authoring tools generate HTML code which is the markup language
    that defines the layout of Web pages. Usually, a Web authoring tool allows users
    to develop Web pages in the What You See Is What You Get (WYSIWYG) editing mode
    or in the HTML code editing mode. WYSIWYG editing mode allows users to make Web
    pages even if they are not experts of HTML. Normally, a authoring tool allows
    users to switch between the WYSIWYG editing mode and the HTML code editing mode.
    To help users to get a quick start, some Web authoring tools provide templates
    for commonly used Web pages. Some of the Web authoring tools are distributed with
    the Linux operating system. NVU is a Web authoring tool often distributed with
    Linux as Ubuntu Linux and SUSE Linux. Screem is another Web authoring tool supported
    by Red Hat Linux and other Linux distributions which support GNOME as the default
    desktop environment. The following describe these two Web authoring tools:


    +   * NVU: NVU (2008) is a fully open source WYSIWYG Web authoring system that
    works for various operating systems such as Linux, Microsoft Windows, and Mac
    OS X. With NVU, users can create Web pages and manage Web sites. They can switch
    between the WYSIWYG editing mode and the HTML code editing mode. NVU works just
    like those commercial Web authoring software packages such as Dreamweaver. NVU
    allows users to log on to a Web site and edit the Web pages online. The HTML code
    generated by NVU will work on commonly used Web browsers. NVU also supports development
    of forms, tables, and templates.

    * Screem (2008) is another versatile page editor for the GNOME desktop environment
    supported by Linux distributions such as Red Hat Linux. It can also be used as
    an XML code editor. Unlike other HTML editors, Screem does not support the WYSIWYG
    editing environment. Because of this, users can create cleaner and better HTML
    code than that generated by the WYSIWYG editing environment. On the tool bar,
    users can select the commonly used elements and insert the markup code of these
    elements at the place where the current cursor is located.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Design and Development of Online Course Materials 293


    NVU and Screem can be downloaded directly from their Web sites. With the rich
    features and the Web site management capability, NVU is often considered a good
    choice as a Web authoring tool. However, users have also reported some defects
    in the package; for example, the source code is automatically modified without
    notifying the user. Using NVU, be sure to save a copy of the source code. There
    are also many third party Web authoring tools available. Some of them are very
    sophisticated. The following describes those tools.


    +   Aptana Integrated Development Environment (IDE): Unlike some of the Web authoring
    tools that focus on HTML code, additionally, Aptana IDE (Aptana, 2008; Kyrninn,
    2008) also has a strong support for JavaScript which allows users to create Internet
    applications. Aptana allows users to add their own macros to implement the actions
    required by a Web page. Through Aptana, users can visualize the specifications
    of how the text, images, headers, and links on a Web page will be presented. This
    feature makes the development of JavaScript for dynamic Internet applications
    much easier. Aptana supports FTP so that the developed Web pages can be uploaded
    to Remote Web sites. Aptana also supports the integrated proxy service to help
    behind a firewall. Aptana provides integrated samples to help users who want to
    create a similar Web page. In Aptana, there are thousands of third party plugins
    which extend Aptana to a wide range of applications. The applications created
    with Aptana can be integrated with new technologies such as the iPhone technology.
    One of the advantages of Aptana is that it supports a very efficient debugging
    tool. The error and warning messages for HTML, Cascading Style Sheets (CSS), and
    JavaScript can be displayed in one view. By gathering and organizing the information
    on Aptana Wiki, Aptana provides an in-application help which supports the HTML
    code editing mode.


    +   Bluefish editor: Bluefish (2008) is an editor for Web pages and Web applications
    as forms and reports. Bluefish supports over a dozen programming and markup languages
    for developing dynamic and interactive activities. These features make it a powerful
    Web authoring tool for experienced Web designers and programmers. Bluefish also
    supports the WYSUWYG environment. Wizards are provided for creating commonly used
    Web applications. Bluefish also provides GUI tools for developing HTML tags, tool
    bars, images, links, and so on. The editing environment of Bluefish has a variety
    of editing features and a powerful search tool. Bluefish allows users to open
    over 500 documents simultaneously in its multiple-document interface. It allows
    users to encode Web pages into more than twenty different languages.


