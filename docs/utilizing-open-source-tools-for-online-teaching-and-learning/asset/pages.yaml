  md: '# Ethereal


    Ethereal is one of the well-known open source network management tools (Ethereal,
    2007). The following are some of its features:


    +   - It is used by network administrators worldwide for network troubleshooting
    and analysis.

    - It is a useful tool in protocol development. As an open source product, it allows
    the low network protocol developer to add additional enhancements.

    - In network related courses, Ethereal is one of the popular network management
    tools included in hand-on teaching materials.

    - With the filter language in Ethereal, it has the ability to sort and filter
    the information captured in the network traffic.

    - Ethereal has rich display features. It is able to display all the network traffic
    through a GUI. The captured data can be displayed in different detail levels.

    - Ethereal can capture live data from various types of local area networks as
    Ethernet, Token Ring, and FDDL. In addition to capturing data from a wire, Ethereal
    can capture live data from the wireless IEEE 802.11 network. It can also capture
    live data that travel through the telephone wire or between cell phones.

    - Ethereal can also work with the files containing network traffic. The content
    in the files can be programmatically edited for display and for many other purposes.

    - Ethereal can capture and analyze data carried by hundreds of protocols such
    as the commonly used TCP, IP, HTTP, FTP, SMTP, IMAP, POP3, and so on.

    - Ethereal can run on all popular operating systems, such as Linux, Windows, and
    various versions of UNIX.


    Due to its ability to capture network traffic, Ethereal can cause some security
    vulnerabilities if it is used by the wrong person. We have to make sure that only
    qualified persons can use the Ethereal tool on a network and do not use Ethereal
    to capture the traffic in an untrusted environment.


    As a network management tool, Ethereal is very popular. According the survey done
    by Insecure.Org (2006), Ethereal is the second most popular network management
    tool. The most popular network management tool is the open source tool Ness which
    will be introduced later in this chapter.'
