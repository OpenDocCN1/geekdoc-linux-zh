    education institutions as University of Michigan, Indiana University, MIT, and
    Stanford, and many individual users and developers. The Sakai project was started
    in early 2004 and its first version was released in March 2005. Later, major techn-ology
    companies such as IBM, Sun, and Unisys joined the Sakai project. According to
    Sakai (2007), in 2007, there were over 250 institutions using or testing Sakai
    for their online teaching/learning systems. The rapid increase of its popularity
    among higher education institutions is due to its collaboration features. The
    following are some of the collaboration features included in Sakai:


    +   - Sakai is designed to be a platform for research and group projects. It has
    greatly improved the interactivities among researchers, instructors, and students.


    +   - To meet the requirements of an online teaching/learning system, Sakai allows
    users to modify the settings of the tools and services provided by Sakai.


    +   - Based on the role of the user, Sakai can be configured so that each individual
    user can be assigned a set of tools for a specific project.


    +   - Sakai provides many commonly used collaboration tools such as live chats,
    forums, and Wiki, and threaded discussions.


    +   - For instructors and students to share documents in a private folder, Sakai
    pro-vides the Drop Box Tool that allows the participants of the Drop Box to upload
    multiple files at once to a private folder for other participants to share.'
