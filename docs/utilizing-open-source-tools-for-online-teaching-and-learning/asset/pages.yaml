- img_proc: true
  md: '# Evaluation Instruments and Grade Management


    An LMS package often provides various evaluation instruments. Exams are the main
    instruments used to evaluate students'' performance. The configuration of exams
    involves the following tasks:


    +   The exam creator, either the instructor or the LMS administrator, need to
    set the exam time based on the requirements.

    The number of attempts permitted should also be set. Some sample online exams
    allow students to try as many times as they want.

    When creating an exam, one should specify the grading method. The commonly used
    measures for evaluating students'' performance are numerical scores, letter grades,
    pass and fail grades, and percentage grades. If multiple attempts are allowed,
    the exam creator can also decide which attempt should be graded.

    An exam should be configured to inform students about their grades. If it is a
    multiple choice exam, students can get their numerical scores as soon as they
    submitted their answers. For other types of exams or assignments, the instructor
    can decide the type of grade to use and may write comments as feedback.

    Each exam can have its own password. The password is useful when the instructor
    needs to control how to distribute the exam. For example, if the students are
    required to take a proctored test at a specified location, the password can be
    used to make sure that only the students who show up at the specified location
    can take the test.

    For hands-based exams, the LMS administrator can specify a set of computer IP
    addresses so that students can take their hands-on practice exams from those computers.

    The order of questions on an exam can be randomized so that each test looks different
    from the others. In such a way, there is less chance for one student to copy another
    student''s answers.

    For a sample exam, the answers should be provided for students so that they can
    correct their mistakes.

    To re-use the questions on a real exam, you can configure the exam so that the
    answers to the exam questions are hidden from the students. After the students
    finish the exam, they can all see their exam scores, but not the details such
    which answer is incorrect and what the correct answer is.


    After students submit their assignments or exams, their work will be evaluated
    and they will receive the grades. The grades can be given in several ways.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Class Management 211


    can be in the letter scale such as A, B, C, D, F, or in the numerical scale from
