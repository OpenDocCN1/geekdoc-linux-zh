  md: '+   Course delivery management: LMS often provides tools for online help and
    provides remote access tools for students to view, explore, and download online
    course materials. It also provides tools to allow instructors and students to
    communicate with each other.


    +   Student management: LMS includes tools for managing students'' accounts and
    students'' grades.


    +   Skill assessment: Tools are often included for managing online assignments,
    quizzes, and exams.


    +   Multimedia course development: To support the development of Web-base course
    materials. Some of the LMSs may provide authoring tools for multimedia course
    content development.


    +   LMS management: To keep a learning management system running smoothly, managing
    tools are also provided for security measures, online registration, system backup,
    and crash recovery.


    +   Personalization management: Tools are often provided for students to personalize
    their learning environments, schedule their learning activities, and develop personal
    blogs.


    +   Collaboration management: A sophisticated LMS should include tools for collaboration.
    Many LMS vendors include forums, chats, virtual whiteboards, video conferencing,
    and text messengers for collaboration.


    Over a dozen open source LMS software packages are currently available. A of them
    include all the components listed above and more. These open source LMS software
    packages can handle the tasks of creating teaching materials and managing online
    courses. Due to the advantages of open source products, a large number of universities
    are currently using open source LMS to support their online teaching/learning
    systems. According to the figures provided by Moodle (2008), there are over 400,000
    users from 193 countries using Moodle over 75 languages. With together other open
    source LMSs, the open source LMS market is large and the demand for open source
    LMS is high. These open source LMSs provide a high quality and low cost solution
    for supporting online teaching/learning systems. In the following, we are going
    to examine some of them, including Moodle, ATutor, Claroline, ILIAS, Sakai, and
    so on. These packages are major players in the open source LMS market. We will
    first have a summary of these open source LMS packages:


