    # BACKGROUND


    An online teaching/learning system usually supports hundreds of or thousands of
    courses each semester. These courses generate a large number of data including
    course materials, student information, assignments and grade-related information.
    After semester semester, the data generated by these courses are accumulating.
    To be able to store and manage the large number of current and historical data,
    it is required that a reliable database should be developed to meet the requirements
    of the online teaching/learning system. Many open source database management system
    packages are available for developing databases that can be used to store and
    track data for online courses.


    The subject related to developing databases for online teaching/learning systems
    has been widely studied. Ratna, Samuel, and Bayujati(2002) developed a synchronous
    Web-based learning system on which Chat was used as interactive media. The Web
    Chat program was supported by the open source database MySQL and the PHP scripts.
    The system provided Web-based real-time communication between instructors and
    students. It also provided management tools to control the real time communication
    process. In another study, Potter and Hicks (2004) integrated the open source
    database application into the social studies classes and the classes of other
    subjects. By using the open source database application, they were able to develop
    a well-designed database with minimal cost.


    Performance tuning is one of the tasks in database management. The experimentation
    system developed by Pozniak-Koszalka and Helwich (2005) can be used to test the
    efficiency of a relational database. Their experimentation system is particularly
    useful for improving the efficiency of Internet applications and open source database
    management systems such as MySQL.'
