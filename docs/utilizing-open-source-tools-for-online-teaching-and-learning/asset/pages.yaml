    # Network Diagnostic Tool (NDT)


    There are also some advanced open source network management tools that are available
    to assist network administrators. NDT is such an advanced open source network
    management tool that can be used for troubleshooting network performance problems
    on high-performance networks (NDT, 2007). The following are some of the features
    provided by NDT.


    +   NDT is a client-server based network management tool. The server side includes
    a Web server and a testing engine, and the client side includes a command line
    interface or Java applet.

    NDT can be installed on a Linux server with a Web100-enhanced kernel. The Web100-enhanced
    server can communicate with the command line interface or Java applet on the client
    side. The NDT client (web100cl) can run on Windows and various versions of the
    UNIX operating system.

    With the Web100-enhanced server, NDT can determine if network is working properly.
    It will provide performance tuning information and give suggestions to fix performance
    problems. To identify a bandwidth congestion, NDT is able to measure the throughput
    of an Internet connection as well as the throughput of a local area network.

    As a diagnostic tool, NDT can inform the network administrator what the problem
    is and how the network performance is affected by the problem. Since most network
    problems happen near the client side, NDT is designed to handle problems such
    as misconfiguration of the client-side local area network and incorrectly set
    TCP buffers on client systems.

    Through the command line or Java applet interface, the network administrator can
    run an NDT test of the local area network that has been reported as having problems.

    The test result can be presented in different detail levels so that the network
    administrator can dig deeper into potential network problems. NDT provides plain-text
    reports for beginners and detailed system data for experienced network administrators.

    The future NDT will support network performance testing and analysis on IPv6.
    It will also include more statistics.


