- img_proc: true
  md: '# Chapter X

    Design and Development

    of Online Course

    Materials


    # INTRODUCTION


    In the previous chapter, we discussed client computers, desktop operating systems
    and desktop environments environments. A desktop environment is the platform where
    most of the online course materials will be developed. This chapter will focus
    on course material development with open source technologies. The first part of
    this chapter is a briefintroduction of instructional design and instructional
    technology theories. We will discuss the development cycle of technology based
    course materials. The theories of instructional design and instructional technology
    will be used to guide the development process.


    After the introduction, we will look at some of the open source tools that can
    be used to develop online course materials. We will have some detailed discussion
    on the open source Web authoring, multimedia, and collaboration tools. We will
    explore the options we may have and the functionalities provided by these open
    source tools.


    With the available open source teaching material development tools, instructors
    can develop various types of the online course materials. This chapter will demonstrate
    how the open source tools are used to create multimedia and collaboration course
    materials and how to make the course materials available online so that students
    can access them through the Internet.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# BACKGROUND


    A large portion of the online teaching and learning research focuses on the development
    of online course materials. In general, the development process of online course
    materials is guided by the instructional design theories. Various instructional
    design models have been created. The book edited by Reigeluth (1999) summarizes
    the theories and models of instructional design and celebrates the diversity in
    the field of instructional design. The instructional design models provide a systematic
    approach to creating course materials. Dick, Carey, and Carey (2004) provide the
    theories and practice to systematically design instruction. In addition to the
    elements such as teachers, students, and course materials in a teaching/learning
    system, they also point out that the learning environment plays a crucial role.
    For readers who are more interested in the recent development of instructional
    design theories and practice, they may consider the book read by Reiser and Dempsey
    (2006) who discussed how technologies would affect the future of this field and
    the trends in the field of instructional design and instructional technology.


    Online teaching and learning can be greatly enhanced by using multimedia course
    materials. A lot of studies have been done in the area of developing multimedia
    course materials. The book by Lee and Owens (2004) presents hands-guidance on
    design, development, and implementation of multimedia course materials. The book
    provides a number of tools and worksheets to help readers create their own multimedia
    course materials. More recently, we have Clark and Mayer''s (2007) book points
    the way for analyzing how students learn and how to correctly use technology to
    construct a teaching environment that meets students'' needs. This book also provides
    valuable references.


    Collaboration is one of the areas that need to be improved in the field of Web-based
    learning. Various online collaboration tools have been developed and studied intensively.
    For example, Gellerman''s (1994) article provides an overview of the role of video
    conferencing in distance learning. The article also gives some information about
    the video conferencing technology. For synchronous collaboration and interactive
    activities, readers may refer to Clark and Quinn''s (2007) book which is very
    informative. Various tools are often used to assist the development of collaboration
    course materials. Nokainen, Miettinen, Tirri, and Kurhila (2002) described how
    a tool was used in designing and implementing real time online collaboration.
    Their study showed that the tool developed by them could be used to create a wide
    range of computer-based course materials.


    In an online teaching/learning system, multimedia course materials and collaboration
    course materials should be made available to students through the Internet. Web
    is a convenient technology to deliver the course materials to the qualified students.
    Koontz, Li, and Compora (2006) created a Web-based design model for'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# 282 Chao ASSIST-ME Model, to assist the design of online courses. By ap


    instruction, instructional design theories, Brown and Lu (2001) developed a Web-based
    tutorial system to assist the teaching and learning in a technology based database
    system course.


    For each online course, instructors have to develop some course materials in one
    way or another. Most of the instructors are familiar with the desktop environment
    where they create online course materials. Developing course materials in a desktop
    environment is described in Horton and Horton''s (2003) book. Their book covers
    many tools used to describe Web-based multimedia and collaboration course materials.
    In addition to developing course materials for the desktop environment, many technology
    courses also require instructors to develop course materials for networks and
    servers. Sarkar''s (2006) book deals with network based course materials. The
    book discusses strategies and practice for teaching network and hardware related
    classes. Chao''s (2007) examines online teaching on the server side and hands-based
    online teaching. The book also discusses various issues related to setting up
    computer labs to support hands-practice on the server side.


    There has been extensive research on the theories and application of instructional
    design and instructional technology. To enrich the application of instructional
    technology, this chapter will focus on the use of open source technologies to
    develop online course materials. Since an online teaching/learning system highly
    depends on the Internet ready technology-based course materials, the content covered
    in this chapter will be treated from the technology point of view. The emphasis
    will be on how the technologies are used to achieve the objectives proposed in
    the instructional design.


    # INSTRUCTIONAL DESIGN


    To efficiently transfer knowledge from instructors to students, a well defined
    process is required to design the communication media and the instructional methods.
    Instructional design theories deal with these design issues. By following the
    theories of instructional design, the instructor should be able to develop appropriate
    course materials and select the right teaching methods to achieve the design goals.
    Various instructional design models are proposed by researchers to systematically
    carry out the instructional design process. The models can be used to divide the
    design process into manageable units. One of the often used models is the ADDIE
    model which includes five phases: Analyze, Design, Develop, Implement, and Evaluate.
    The descriptions of these five phases are given below:


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'Analyze: This is the phase where the designers analyze the learner''s needs
    and characteristics such as the learner''s current knowledge level and learning
    behavior. The designers may also need to investigate the options of how to carry
    out the instruction, the constraints and the learning environment. For an online
    teaching/learning system, the learning environment is a Web-based system that
    often has technical constraints. The future learning environment has to be built
    around these constraints.


    Design: Based on the result of the analysis, the designers will be able to establish
    measurable instructional goals. The decision on the instructional goals depends
    on the requirements for the learning outcomes. According to Bloom''s taxonomy
    in the instructional theory (Orstein & Hunkins, 2003), the learning outcomes can
    be categorized into three possible domains, the cognitive domain for knowledge,
    the affective domain for attitude, and the psychomotor domain for skills. Based
    on the instructional goals, the designers can determine the course content to
    meet the goals. After the course content is determined, the designers should also
    choose an instructional approach that can deliver the content to the learner.
    They should specify the assessment instruments, the assignments, and the technologies
    for the instruction. In this phase, the designers should also specify the user
    interface to assist the learner in accessing the course content and specify the
    format of the multimedia content. For the online teaching/learning system, the
    designers are often a team of instructors and programmers who are responsible
    for the design of the user interface and multimedia course content.


    Develop: In this phase, the course content developers create instructional materials
    based on the specifications established in the Design phase. For the online teaching/learning
    system, the developers should include instructors, system administrators, programmers,
    and online teaching support staff members. The instructors and programmers will
    work together to convert the course content into multimedia based course materials.
    The online teaching support staff and system administrators will work together
    to make the course materials available on the Internet. During the Develop phase,
    the developers need to make sure that the servers, networks, and remote access
    all work properly.


    Implement: In the Implement phase, the course materials will be delivered to the
    students. The instructors, system administrators, and technicians will test the
    newly established course Web site to make sure the course materials and collaboration
    tools are in place for the students to access. Once the course content is available
    to the public, it is necessary to provide training for the students to learn how
    to access the course materials, and how to submit assignments, how to use the
    multimedia materials, and how to use the collaboration'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'tools. Training should also be provided for the faculty members on how to manage
    the online classes and how to use the multimedia and collaboration tools. The
    online teaching support staff should be trained on how to schedule the classes,
    how to manage the online payment system, and how to register the students to the
    online classes. The training can be done through a seminar, orientation for new
    students and faculty members, one-on-one help, technical support, and posting
    instructions on the course Web sites.


    +   * Evaluate: This is the phase to verify and determine if the design goals
    have been achieved. As mentioned in the Design phase, the learning outcomes can
    be categorized into three domains, cognitive, affective, and psychomotor. Evaluation
    materials can be designed around these three domains. The evaluation can be done
    through tests, assignments, and course evaluation which can be used to get feedback
    from the students. The evaluation result can be used as a guideline for further
    improvement. Eventually, all the design goals should be achieved.


    The ADDIE model approach has been successfully applied to various online teaching
    and learning projects. Strickland (2008) reported that the ADDIE model was used
    to develop multimedia materials, design Web-based training interface, create Pre-Service
    Teachers'' Virtual Space, and so on. In the process of developing course materials
    for the online teaching system, the ADDIE model can be applied to create the course
    materials that are suitable for Web-based teaching and learning. Later in this
    chapter, an example will be given to illustrate how to use the ADDIE model to
    guide the development of the online course materials.


    The theories of instructional design cover a great deal of content. There are
    dozens of well-known instructional design models that have been proposed. Detailed
    coverage of these instructional design models is beyond the scope of the book.
    Interested readers can refer to the instructional design theory literature mentioned
    in this chapter''s Background section.


    Closely related to the field of instructional design, instructional technology
    is the field that deals with the use of technology to support teaching and learning.
    Various technologies are used to link students to course materials, link students
    to instructors, and link students to students. There are many definitions of instructional
    technology. Here, the study of instructional technology theories and practice
    will help us wisely use technologies to overcome the challenges encountered in
    the online teaching/learning system. The theories of instructional technology
    can be used as a guide to develop solutions for constructing online/learning infrastructure
    and for creating teaching and learning materials. Chapter 2 discussed the application
    of instructional technology for developing an online teaching/learning system.
    In this chapter, we are going to focus on the application'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Design and Development of Online Course Materials 285


    of instructional technology for developing solutions to the problems in creating
    course materials. To wisely use technology, the developers are generally required
    to follow the procedure below to develop a technology based solution:


    +   - Investigation of challenges: The first step of developing a technology based
    solution is to investigate the challenges. For example, allowing students to be
    remotely access course materials from anywhere and at anytime can be considered
    as a challenge. Also, encouraging students to be actively involved in group activities
    through the Internet can also be a challenge.

    - Exploration of solutions: At this step, the developers will look for possible
    technology based solutions. There may be different solutions that all resolve
    the problem posed by a challenge. For example, allowing students to remotely access
    the course materials in a secure way, we may develop a VPN server with a commercial
    product or with an open source product.

    - Analysis of solutions: At this step, the developers will take a closer look
    at the pros and cons of each solution. They should examine the benefits of each
    solution and the cost to gain the benefits. For example, by using an open source
    VPN product, students will be able to remotely access course materials from anywhere
    and at anytime with zero cost. The disadvantage is that an open source VPN product
    may not have a well written document and it may take longer time to learn how
    to use the product.

    - Project development: Based on the result of the analysis, the developers will
    be able to choose the solution that is the best for overcoming the challenge.
    Once the technology solution chosen, the next task is to develop a detailed plan
    to implement the project. After the project is implemented, the developers should
    collect users'' feedback for error correction and further improvement.


    Now that we have listed the steps of developing a technology based solution, let
    us follow the steps for developing online course materials.


    # Investigation of Challenges


    To develop online course materials, the first step includes the tasks such as
    investigating the requirements from faculty members and students. The investigation
    should collect information on whether there is a demand for online course materials,
    whether the instructors are ready to teach Web-based courses, and whether the
    students are willing to learn in a Web-based environment. If there is the demand,
    the investigation will focus on the challenges for putting course materials online.
    Before the online course materials can be developed, we must collect information


