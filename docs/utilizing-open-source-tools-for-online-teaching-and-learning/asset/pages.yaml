  md: 'messages, these features allow a blind person to listen to the learning content.
    ATutor also provides the tool ASLpah.ca for the new technology called "signlinking"
    representing the sign language version of hyperlinking.


    ATutor is built to work with mobile devices such as cell phones, personal data
    assistants (PDAs), and so on.


    Like many other LMS packages, ATutor provides a tool called AForm to help instructors
    to create course materials such as online forms, tests, or surveys. In addition,
    the tool prompts the course material developer to add text alternatives for maximum
    accessibility. ATutor provides a Web service called Achecker to verify if the
    developed course content meets the international accessibility standards.


    By adopting the IMS/SCORM Content Packaging specifications, ATutor can be used
    to create reusable learning modules. It can also import or export the IMS/SCORM
    compatible learning modules from or to other packages. Instructional Management
    Systems (IMS) is a standard for interoperability of learning systems and learning
    content, and Shareable Content Reference Model (SCOR) is a standard for how individual
    instruction elements should be integrated.


    ATutor conforms to XHTML 1.0 which is an HTML-like language designed to work with
    XML. This will ensure that the learning content in different documents and in
    different languages can be displayed consistently.


    ATutor provides a list of collaboration tools, ACollab for supporting group activities,
    AChat for supporting online time communication, and AComm which is a Java-based
    instant messaging and whiteboard tool.


    Many of the features provided by ATutor are creative and cannot be found in other
    LCMS software packages. When combined with LMS packages, ATutor is a powerful
    package to support online teaching/learning systems.


