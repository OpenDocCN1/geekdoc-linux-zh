    After the course materials are delivered, many students and instructors will need
    training on properly using Linux and other open source tools. As mentioned in
    Chapter 1, one of weaknesses of open source products is lack of marketing and
    user instruction. Open source products are less known by the public. Therefore,
    training on using the open source products is a key step for the success of the
    open source online training/learning system.


    Many of our students are first time users of the online teaching/learning system.
    They are not familiar with the setup and the technology used in the system. For
    those students who have taken classes through the online teaching/learning system,
    the rapid progress of technology can make the current set of online teaching/learning
    system different from last year''s. It is also true that the instructors, especially
    the new faculty, need training on class management. Training will help the students,
    the instructors, and the technical support team to continuously update their skills
    and knowledge so that they can keep up with the current trend. Training can be
    carried out in the following formats:


    +   * Orientation: Before the classes start, the online teaching support staff
    or the computer service department can provide an orientation for the new students
    and new faculty members. During the orientation, the trainers will demonstrate
    how to use the online teaching/learning system. The new students will learn how
    to log on to the online teaching/learning system, how to find the class Web sites,
    how to log on to the online computer labs, how to submit their homework, how to
    take quizzes and exams, how to collaborate with the other students and communicate
    with the instructors. The new faculty members will learn how to log on to the
    online teaching/learning system, how to present course materials, how to set up
    assignments, quizzes and exams, how to grade assignments, quizzes and exams, how
    to communicate with the students, and how to edit the class Web sites. The trainees
    will get hands-on practice during the orientation. The trainers will answer questions
    and help the trainees solve problems. The trainers will make sure that all the
    trainees successfully complete the training.

    * Training seminars: During the semester, the online teaching support staff or
    the computer service department can also offer seminars to the faculty members
    on using the utilities provided by the Linux operating system, LMS, and database
