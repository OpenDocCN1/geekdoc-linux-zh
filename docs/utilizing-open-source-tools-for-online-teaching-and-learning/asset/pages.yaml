  md: '# # Chapter IX

    # Client Computer System and Remote Access


    # ## INTRODUCTION


    An online teaching/learning system is often constructed on the Web-based client-server
    architecture. Personal computers at students’ homes perform client-side operations.
    These computer systems share some computation load and should be properly configured
    so that they can remotely access the servers through the Internet. For the online
    teaching/learning system, the configuration and management of the client computers
    present many challenges due to the variety of computer types and application software.
    In this chapter, we will examine various challenges on the client side and look
    for solutions that can be implemented with open source products.


    This chapter begins with the discussion of the Linux open source desktop operating
    systems. Linux originally created for personal computers is suitable for personal
    computers and workstations. We will discuss several major Linux desktop operating
    systems and look at the components included in them.


    A desktop environment is software that runs on the computer systems and handheld
    devices on the client side. In this chapter, information will be given about the
    open source desktop environment and how to configure the desktop environment to
    meet the requirements of the online teaching/learning system. Our focus will be
    on the desktop environment that can be hosted by Linux which is a widely used
    operating system and is a great choice as the open source solution for supporting
    the client-side computation needs.


    An operating system often includes various desktop application tools for tasks
    such as handling office applications, multimedia presentations, service management,'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 252 Chao


    device management, network configuration, display configuration, file transfer,
