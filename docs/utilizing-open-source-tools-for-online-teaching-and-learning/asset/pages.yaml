  md: '# Network Development and Management 103


    In the above, we have discussed several general purpose network management tools;
    most of them include functionalities such as network monitoring, information analyses,
    and reporting. Next, we will look at several network management tools that specialize
    in network security management.


    # Nessus


    Nessus is an open-source network vulnerability scanner. It has modular architecture
    with a centralized server that conducts network scanning (Nessus, 2007). The Nessus
    client can be configured for remote administration interaction. Equipped with
    Nessus Attack Scripting Language (NASL), Nessus is able to accomplish the following
    tasks:


    +   - Nessus is built on the Common Vulnerabilities and Exposures architecture
    which allows it to easily link to other compliant security tools.

    - Nessus can be used to scan network vulnerabilities on both local and remote
    computer systems and networks.

    - By using Nessus, the network administrator is able to detect if there are missing
    security updates and patches.

    - Nessus can generate simulated attacking signals to check the network and computer
    systems'' vulnerabilities.

    - With NASL, Nessus can describe individual threats and potential attacks. NASL
    can also be used to create customized scans based on the description of threats
    and attacks.

    - Nessus can test a password by using dictionary and brute-force methods. Many
    of the vulnerability tests can be conducted in a clear environment.

    - Nessus can report the result of a vulnerability scan and save it in a knowledge
    base in various formats such as plain text, XML, HTML, and so on.

    - Nessus allows third party tools to manage vulnerability results. These three
    party tools can be used on Linux, UNIX, and Windows platforms.

    - The Nessus server is currently able to run on Linux and various versions of
    UNIX. The Nessus client can run on Linux, UNIX, and Windows.

    - With Nessus, the network administrator can schedule a security audit. The auditing
    process can be configured according to the security policy.


    On the network security management market, Nessus is the number one choice. According
    to the survey done by Insecure.Org (2006), Nessus was the most popular vulnerability
    scanner in the time of the survey and had been used by over 75,000 organizations
    worldwide.'
