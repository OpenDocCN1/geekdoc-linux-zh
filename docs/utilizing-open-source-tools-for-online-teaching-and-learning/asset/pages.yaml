  md: '# ONLINE TEACHING/LEARNING SYSTEM EVALUATION


    In the instructional technology theory, evaluation is the stage to get feedback
    from users. The result of the evaluation provides a guideline for further improvement
    and for next year''s budget proposal. Not only the teaching and learning can benefit
    from the project evaluation, but also the technology usage and the design of the
    system architecture can benefit from the evaluation. An evaluation process often
    performs the following tasks.


    +   * **Identify what to evaluate:** An evaluation process often includes the
    evaluation of course materials as well as the online teaching/learning system
    that supports the delivery of the course materials.

    * **Identify who will be evaluated and who will evaluate:** People who participate
    in the online teaching/learning system''s design, construction and management
    are usually evaluated, and people who use the system will evaluate.

    * **Document evaluation:** Prepare the evaluation instrument and instruction on
    how to evaluate.

    * **Deploy evaluation instrument:** The evaluation instrument can be sent to the
    evaluation participants through Web forms, e-mail, or regular mail.

    * **Schedule evaluation:** Often the evaluation of an online teaching/learning
    system is part of the class evaluation at the end of each semester.

    * **Analyze evaluation results:** Data collected from the evaluation can be analyzed
    with charts, spreadsheets, or other statistical analysis tools. A report should
    be created to explain the findings by the analysis.


    The goal of evaluation is to determine if the objectives of the online teaching/learning
    system have been achieved. The evaluation checks if the system can get the job
    done effectively and identifies places where the system can be further improved.


