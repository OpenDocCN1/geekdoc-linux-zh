  md: '# Network Development and Management 95


    In addition to the above tasks, many open source protocols are created to accomplish
    specific tasks. In the following, let us take a look at some of the commonly used
    open source protocols in an online teaching/learning system:


    +   **Internet Protocol (IP):** IP is a well-known open source network protocol.
    The communication over various local area networks and over the Internet largely
    depends on IP, which sends messages from one system to another through the Internet
    and various local area networks. IP can carry messages from one type of network
    to another type of network. Each computer system or network device that is linked
    to the Internet or a local area network must Each packet formed for data transmission
    contains the source address and destination address that are related to the IP
    addresses of the sender and receiver. IP''s job is to carry messages to destinations.
    Therefore, IP does not have the error checking functionality. It needs to work
    with other protocols for error detection and correction.


    +   **Transmission Control Protocol (TCP):** TCP is another open source network
    protocol. It often works with IP for data transmission over the Internet. TCP
    and IP were the first two network protocols created for data transmission in the
    1970s. The creation of these two open source protocols revolutionized network
    computing. As IP delivers messages to destination computers or network equipment,
    TCP keeps track of each packet and makes sure that it is efficiently and correctly
    sent and received. TCP is the protocol that actually formats packets when sending
    messages and reassembles the packets to get the original messages. The reassembling
    task can be a complex process. When packets are transmitted, they can take different
    routes to get to the same destination. When these packets arrive, the order of
    the packets has been altered. At the destination, TCP waits for all the packets
    to arrive and reorders these packets to the original sequence. When some of the
    packets get lost during the transmission, TCP will wait long enough, then discard
    the entire message, and wait for the sender to resend the message.

    Another main task that can be accomplished by TCP is maintaining the connection
    between the sender and receiver. TCP keeps the connection between them until all
    the messages have been received by the application software on the receiver side.
    The connection maintained by TCP allows messages to be sent in each direction,
    which means that the application programs on both sides of the connection can
    send messages at the same time. To guarantee that connections are established
    or terminated reliably, TCP uses a three-way handshake scheme to make sure the
    agreements on connection and disconnection are unambiguous.


