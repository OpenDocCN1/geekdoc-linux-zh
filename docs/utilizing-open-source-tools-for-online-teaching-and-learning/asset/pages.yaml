  md: '# 300 Chao


    The above example has briefly demonstrated the steps in developing the course
    materials for the Linux networking class, mainly the lab manual. The technical
    challenge of the project is that we need to record the mouse movements and other
    activities on screen as video clips and add them to the lab manual. Also, our
    students should be able to access the lab manual through the Internet and perform
    the hands-on practice online. As we can see, two types of technology have been
    involved in developing the hands-on practice materials. The first type of technology
    is the infrastructure that can be used to deliver the lab manual and allow the
    students to perform the lab activities online. This type of technology is the
    online teaching/learning system that we have covered throughout this book. The
    second type of the technology is used to create the multimedia course materials,
    which is, recording the activities on screen in this example. Since the technologies
    for delivering the course materials have discussed in the other chapters, let
    us focus on the technologies used to record the screen activities.


    There are several open source recording tools available. In this example, we will
    consider some of these tools as vnc2swf, Wink, and Byanz. After looking at the
    features provided by these tools, we will make a decision on which one we will
    use to make video clips for this example.


    +   **vnc2swf**: vnc2swf can be used to create flash based video clips. The flash
    video clips can be embedded in a Web page. vnc2swf is used with Virtual Network
    Computing (VNC). The VNC technology requires a server computer and a desktop computer.
    The vncserver program and the network configuration utilities are installed on
    the server side. The students can then log on to the vncserver through the virtual
    vnc client from the client computers at home. With vnc2swf, we can record all
    the activities on screen including key strokes and mouse movements on the server.
    The vnc2swf program generates high quality videos and does not require a lot of
    computing resources; this means that it will work with some of the older computers.
    Some of the Linux distributions do not include vnc2swf in their packages. In such
    a case, users can download vnc2swf from the Web site http://www.unixuser.org/~esque/vnc2swf/
    and download the vncserver from http://old.realnc.com/download.


    +   **Wink**: Wink is also a tool that can be used to capture the activities on
    screen. It is more than a screen recording tool. With Wink, one can create tutorials
    and presentations. It can add additional information with hints popping up on
    a screen cast, which is a great feature for creating a multimedia lab manual.
    Wink is also available in multiple languages. If it is not distributed with the
    Linux operating system, users can download Wink from the Web site http://www.debugmode.com/wink.


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
