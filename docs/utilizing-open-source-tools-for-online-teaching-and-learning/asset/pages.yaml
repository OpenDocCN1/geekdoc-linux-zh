  md: '# Database Management


    Once the database is in place, the maintenance of the database is done by the
    database administrator. Usually, database administrators perform tasks such as
    user account management, data transformation, database backup and restoration,
    and performance tuning. They are also responsible for security management. Next,
    we will discuss database management in more detail.


    # DATABASE MANAGEMENT


    As mentioned earlier, the database stores and controls all the information generated
    by the online teaching/learning system. Any database error will have a great impact
    on the online classes, students, and instructors, or even the entire university.
    Therefore, it is necessary to address the issues on how to manage user accounts,
    database availability, database performance, database security and reliability
    in order to support the operations of the online teaching/learning system. The
    following are some of the tasks that need to be carried out to keep the database
    running smoothly:


    +   **Database routine maintenance:** This task may include checking log files
    and auditing records to detect runtime problems, turning the database on and off
    for maintenance, troubleshooting database problems, documenting changes during
    maintenance, breaking up deadlocks which may happen during database operations,
    and assisting students and instructors in accessing the database. For large network
    based databases, database administrators may also perform tasks such as partitioning
    databases and managing network utilities for distributed databases.

    * **Database security management:** Database security is one of the top priorities
    in database management. It may include configuring user accounts and permissions,
    and updating the database with security patches.

    * **Database backup and restoration:** To prevent the loss of data, the database
    administrator needs to have a database backup and recovery plan. There should
    be enough storage space to store the backup, and the storage devices should be
    accessible during the recovery process. Also, to improve database reliability
    and performance, the database can be replicated to multiple servers linked in
    a distributed computing environment.

    * **Database performance tuning:** Database administrators configure and tune
    database parameters to ensure that databases run with optimal performance. They
    detect problems that cause a slowdown in database performance.'
