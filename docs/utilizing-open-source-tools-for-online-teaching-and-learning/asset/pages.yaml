    # Java


    Another major event in the World Web history is the creation of Java. In the early
    1990s, the World Wide Web was widely accepted for exchanging information worldwide.
    Web site developers need a write-once-and-run-where type of programming language
    to process data that are generated on the World Wide Web. The open source programming
    language Java is this kind of programming language. In 1991, a group of researchers,
    Bill Joy, James Gosling, and others, from Sun Microsystems were trying to develop
    a system that could allow electronic devices from heterogeneous networks to communicate
    with each other. James Gosling''s responsibility was to find a programming language
    for the project. Since the widely used programming language C++ did not meet the
    requirement, James decided to create a new language, Oak, to get the job done.
    Since the name Oak had already been used by another programming language, they
    named the new programming language Java. In 1995, Java 1.0 was available to the
    general public. At first, Java is a closed source product but is free to the general
    public (Feizabadi, 2007). In 2007, Java was licensed under the GNU General Public
    License to make it truly open source. The following timeline briefly describes
    the development of Java.


