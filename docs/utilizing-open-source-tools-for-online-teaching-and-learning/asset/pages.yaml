    +   * Stand-alone server: A stand-alone server is a server built on a single computer
    system. Depending on the usage of the server, the computer system can be a regular
    personal computer or a computer equipped with hundreds of gigabyte of RAM and
    several terrible hard drives. Some of the stand-alone servers can handle some
    comprehensive projects, they are often used to handle projects to support some
