  md: '# 290 Chao


    especially for online courses where there is no face-to-face instruction and it
    is not easy for students to interact with their instructors. While reading the
    text based course materials, the students may not know where to pay attention
    to may misunderstand the course content. For a lot of hands-on practice course
    content such as a lab-based project, a small mistake at the beginning of the lab
    work can make a whole day''s work worthless. With the multimedia development tools,
    audio and video can be added to the text to improve understanding. For example,
    a movie can be used to illustrate exactly how a lab experiment should be done.
