    # NETWORK MANAGEMENT WITH LDAP


    The management of users and network resources is a commonly performed network
    management task. Normally, user account information and network resource information
    are saved in a directory which is similar to a relational database. The directory
    is usually hosted by a server computer system. When a user tries to log on a computer
    system or a network device on the network, the computer system or network device
    will access the user''s authentication information stored in the directory. If
    the login information provided by the user matches the authentication information,
    the user is allowed to log on to the computer system or network device.


    Lightweight Directory Access Protocol (LDAP) is a client-server protocol that
    is used to deliver the authentication information. LDAP is a light version of
    X.500 Directory Access Protocol (DAP). Since LDAP is an open source protocol,
    it is possible to be supported by any application running on any computing platform.
    Therefore, the LDAP service is not just for Linux/UNIX networks, it is also supported
    by Windows and Novell NetWare. In the following, we will discuss the directory
    structure and LDAP process in handling network authentication. Then, we will look
    at several commonly used open source LDAP management packages.


