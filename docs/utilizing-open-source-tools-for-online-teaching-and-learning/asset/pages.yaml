  md: '# Multi Router Traffic Grapher (MTRG)


    MTRG is free software available under the terms of the GNU General Public License
    (MTRG, 2007). To collect information about a network device, MTRG sends a request
    to the device through the Simple Network Management Protocol (SNMP). After the
    information is collected, it is transformed back through SNMP. Then MTRG creates
    an HTML document which contains detailed network traffic with a set of graphs.
    Originally developed by Tobias Oetiker and Dave Rand for monitoring router traffic,
    now MTRG is developed into a network management tool that can perform the following
    tasks:


    +   - MTRG can be used for monitoring and measuring SNMP network devices, such
    as routers and network adapters. In addition, MTRG can also work with other network
    related devices.

    - MTRG is written in Perl; it can be programmed to collect data automatically
    in few minutes.

    - MTRG provides HTML pages with text and image files to display the collected
    information. The collected information can be displayed by day, week, month, and
    image files. According to the detail level, MTRG can automatically scale the Y
    axis to gain the best presenting effect.

    - MTRG provides statistic analysis tools to calculate the maximum, average, I/O
    values, and so on. The result of a statistic analysis can be displayed on the
    HTML pages created automatically by MTRG. Warnings will be sent via email if some
    collected values go beyond the normal range.

    - As a freeware application, MTRG can run on a majority of operating systems such
    as Linux, Windows, and various versions of UNIX.


    Through the above description, we can see that MTRG is a very convenient network
    monitoring tool. It can help us find out what the network devices are doing and
    if there is abnormal behavior during their daily operations.


