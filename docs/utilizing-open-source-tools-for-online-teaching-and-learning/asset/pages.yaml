    Chats provide communication in real time. There are two types of chats, the text
    based chat and the graphic based chat. The popular text messenger is a type of
    text based chat. The graphic based chat room is created in a 2D or 3D graphical
    environment. The chat room is a virtual environment which allows individuals to
    participate in group activities or build their own work space. Some of sophisticated
    chat rooms are also integrated with audio and video functionalities. The management
    of chats includes the following tasks:


    +   For the LMSs, the LMS administrator can configure one or more chat rooms for
    different purposes. A chat session can start at a specific time and end at a pre-determined
    time. There can be one chat session from the beginning to the end of a semester,
    or multiple chat sessions created for different time periods. The LMS administrator
    can schedule the chat sessions.


    +   A chat can also be configured to send a reminder to the students and remind
    them to participate in the chat at a specific time.


    +   A chat can be set to record messages posted on it during a chat session. The
    LMS administrator can decide at what time to release the recorded messages to
    the public.


    +   The information about the chat participants such as the participants'' names
    and the time the participants joined the chat session can be viewed on the chat
    Web page.


    +   Some of the LMSs can integrate chats with other synchronous collaboration
    tools such as VoIP phones.


    +   The chat should be set so that the instructor can control at what time students
    can post their questions and how many questions can be posted at one time. In
    such way, the instructor can better control the class.


    A graphic based chat room takes a lot of computing resources. It is not a practical
    solution if the Internet connection has a lower transmission rate. For many universities,
    text based chats are often used to share information among students and instructors.


    In the above, we have examined several collaboration tools commonly included in
