    # SERVER PLATFORMS AND EQUIPMENT


    Server development for an online teaching/learning system requires careful planning.
    The selection of a server platform and equipment will be based on the needs of
    the online teaching/learning system as described in the previous chapters. The
    following lists on some of the considerations from the technical point of view
    for making decisions on the selection of a server platform.


    +   **Support for the open source operating system:** The first consideration
    is whether the server platform supports the open source operating system such
    as Linux. As described earlier, most of the major server platforms support Linux.


    +   **Cost:** The total cost of the server platform may include the cost of hardware,
    software, and network equipment. Other costs such as maintenance, training, and
    consulting should also be considered.


    +   **Maintainability:** The effort of maintaining a server platform may vary.
    The measure for maintainability is the average time spent on each server in each
    semester. The maintainability depends on the reliability of the hardware and software,
    and the availability of the support from vendors.


    +   **Reliability:** As a key component in the online teaching/learning system,
    the server should be highly dependable. The server''s reliability is measured
    by its uptime. The server is considered to be in excellent condition if it has
    99% or better uptime. The server hardware and operating system has a great impact
    on reliability.


    +   **Technical support:** Some of the server platforms have a wide range of users.
    The technical support for these server platforms can come from both users and
    vendors. The technical support for some other platforms may be mostly from vendors.
    The support for the older versions of an operating system and the supply of parts
    for a server computer system are also factors to be considered.'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'Server Development and Management 127


    +   **Scalability:** Due to the fact that online teaching/learning systems are
    often fast growing, a server platform is required to support backward and forward
    scaling as well as horizontal scaling to multiple servers running simultaneously
    to support cluster computing and grid computing.

    **Deployment:** It would be ideal if a chosen server platform can help to quickly
    deploy a system to students, faculty members, and staff members. It is important
    to choose a server platform that requires less training and maintenance effort.
    It is also desirable if the server platform can be easily mingled with the existing
    system.


    Most of the major server platforms such as x86, POWER, SPARC, and Itanium 2 will
    meet the majority of these criteria. To be specific, let us examine what the server
    platforms can provide in the following:


    +   **x86 platform:** The x86 platform is based on the microprocessors from Intel
    and AMD. Originally, the x86 platform was created for personal computers. Today’s
    x86 platform includes one or more 32-bit or 64-bit single-core or multi-core x86
    microprocessors. It supports most of the popular operating systems such as Linux,
    Windows, and some versions of the UNIX operating system. It is powerful enough
    to support most of the online teaching systems. Among the strengths of the x86
    platform, the first one is the ease of use due to its similarity to the structure
    of PCs. The second strength is that it is supported by most software vendors due
    to its large market share. The third strength is the low cost. The hardware and
    software are widely available. You can always compare their prices and choose
    the one that gives the most value. Another strength is that it is relatively easy
    to get support. The support can come from vendors as well as users. It has a large
    group of experienced users who can provide help. There are also many vendors,
    consulting companies, computer stores across the world that sell and provide services
    for the x86 platform.

    **POWER platform:** The POWER platform is based on the microprocessors from IBM.
    It is built to support Linux, Mac OS, and AIX which IBM’s own version of UNIX.
    The POWER platform supports both 32-bit and 64-bit operating systems and application
    software that are mostly supported by IBM and third party software vendors. One
    of the strengths of the POWER platform is that it can handle a large project.
    It can serve up to 4906 or more processors on one platform and can support over
    2 terabyte memory. No matter if it is 32-bit or 64-bit, the application software
    can run well on the POWER platform. With the Linux operating system installed,
    the POWER platform is an attractive technology for a large online teaching system.
    It is also a good


