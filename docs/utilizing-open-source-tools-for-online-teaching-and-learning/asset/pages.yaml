    # COMPUTER SYSTEM REQUIREMENTS


    A computer system is a computer installed with necessary software and peripheral
    devices that can be used to accomplish certain tasks. Various computer systems
    are used for online teaching/learning systems that use computers to accomplish
    different tasks. Based on the roles they play, computer systems can be briefly
    categorized as server computers and personal computers (or someone may call them
    workstation computers and client computers). In this topic, we will first discuss
    the tasks that can be accomplished by servers and personal computers. Then, we
    will examine the requirements for the computer systems according to online teaching
    and learning.


    # Server Computers


    A server computer in an online teaching/learning system is used to host and manage
    resources that can be accessed by users with proper permissions through a network.
    To handle multiple users who access the same server, the server is usually a relatively
    powerful computer equipped with the following basic software and peripheral devices.


    +   * A server operating system which can be used to manage users, computers,
    and other application software on a network

    * A learning management system and the devices to support the software

    * Database management software and storage devices

    * Security management software and management tools

    * Network devices and management tools

    * Printing devices and management tools

    * Remote access devices and management tools

    * Virtual machine development and management software'
