    command to unpack the file


    If the tar file is created with GNU tar, use the command: `tar -xvzf file.tar.gz`

    If not, use the command: `gunzip -c file.tar.gz | tar -xvf -`


    After the file is unzipped, you can unpack the tar file by using the following
    command:


    ```

    tar -xvf filename.tar

    ```


    After the tar file is unpacked, a new folder which contains all the source files
    will be created. Usually, the next step is to compile the program by using the
    command:


    ```

    make

    ```


    The next step is to install the program. To do so, enter the command:


    ```

    make install

