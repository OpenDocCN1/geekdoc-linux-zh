    # BACKGROUND


    After the rapid development over the past twenty years, online teaching and learning
    have been widely adopted by higher education institutions. When compared with
    the overall higher education student population, the enrollment of online classes
    has been growing considerably faster (CRIENGISH, 2008; Sloan Consortium, 2006).
    According to Sloan Consortium (2006), almost 3.2 million students were taking
    at least one online class during the 2005 semester, which is nearly 40% increase
    when compared with the enrollment the year before. The fast increase of enrollment
    indicates that more and more needs need to be supported by Web-based technology.


    Web-based technology is also used to accomplish tasks such as student account
    management and other knowledge management. The increasing needs of Web-based technology
    create a great opportunity for the IT industry and higher education institutions.
    On the other hand, it creates some challenges. Manufacturers need to improve their
    products to meet the requirements from the ever changing market. The computer
    service departments in higher education institutions are facing more and more
    pressure on improving performance, usability, flexibility, and security of their
    instructional Web sites. Instructors need to design and implement better materials
    for online teaching; this requires students themselves to keep learning new technologies
    and instructional theories. Students need to adapt to new teaching and learning
    environments which may be a lot different from what they had in high school. They
    will experience the advantages and disadvantages of online teaching and learning.
    The administrators of higher education institutions will face increasing demands
    for funding, technical support, new curricula, and skilled personnel.


    All this has generated great research interests in dealing with these challenges.
    Numerous studies have been done in the area of Web-based teaching technologies.
    In their book, Horton and Horton (2003) described various technologies that can'
