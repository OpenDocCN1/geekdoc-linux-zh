  md: 'Design and Development of Online Course Materials 287


    +   - There are options on network devices, network protocols, network topologies,
    and wireless technologies.

    - There is information for selecting server technologies. The information should
    include the options of server operating systems, server computer systems, and
    server-side services.

    - There are options on learning management systems and the services provided by
    the learning management systems.

    - There are options on database management systems and the services provided by
    the database management systems.

    - There is information for the selection of desktop technologies. The information
    should include desktop operating systems, desktop environments, desktop application
    software, and so on.

    - There is choice of Web servers, Web browsers, Web services, and the functionalities
    provided by the Web software.

    - For the development of multimedia and collaboration course materials, the developers
    need to consider the options of multimedia devices, multimedia content development
    tools, and collaboration tools.

    - There is choice of the types of graphical user interfaces for the Web sites,
    online registration, and many other services.

    - There are options on programming languages, application development environments,
    Web authoring tools, and scripting languages for Web development.


    Each online course may also have its own specific requirements for technology.
    It is the development team''s responsibility to document the options for the special
    needs. After the team has investigated the options, the next task is to find the
    best solution for the project.


    # Analysis of Solutions


    Many factors can impact the decision on the selection of the technologies to form
    a solution for the development of the online course materials. The following are
    some of the factors that the development team should consider:


    +   - The available funding for the project.

    - The skills for implementing and managing the project.

    - The flexibility and reliability of the selected technologies.

    - The security of the technologies selected for the project.

    - The time to complete the project.

    - The estimated cost of developing the online course materials.

    - The time needed to learn how to use the selected technologies.


