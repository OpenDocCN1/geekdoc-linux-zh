  md: '# ONLINE TEACHING/LEARNING SYSTEM IMPLEMENTATION


    After the online teaching/learning system is constructed, it is time to deploy
    the system for the students and faculty members and to keep the system running
    as it should be. The tasks at the implementation stage may include system testing,
    system deployment, user training, and system management. The following is the
    description of each task.


    # System Testing


    The goal of system testing is to verify that the physically constructed system
    meets the requirements desired in the system design stage. There are two types
    of tests, coverage test and usability test. The coverage test is to check individual
    functions or features to see if the requirements are fulfilled. The usability
    test is to check the usage of the new system. This test is done after the system
    is internally deployed.


    +   * **Coverage test:** The objective of the initial test is to make sure every
    function and feature specified by the system design is working properly. Before
    the system is deployed, the system development team will test the network, servers
    and client computers to make sure that they function properly. The test will also
    check the application servers such as learning management system, database, Web
    server, and VPN server to see if they meet the design requirements. For the user
