    files, or storage space on the server with the Linux operating system. With NFS,
    a client can access his or her home directory and from any computer system on
    the same network.

    **Samba:** Installed on the Linux operating system. Samba supports the file and
    printing services for Microsoft Windows clients. It can also be integrated with
    a Windows Server domain. Being able to communicate with Windows makes Samba very
    popular. Nearly all distributions of Linux include Samba.


    On an online teaching/learning system, there could be thousands of Linux operating
    systems installed and they are sharing the network resources. It is important
    that these Linux operating systems, the users using these systems, and the network
    resources are properly managed. The Linux operating system often includes the
    service called Network Information Service (NIS) to accomplish the task. Similar
    to LDAP in the previous chapter, NIS serves as the yellow pages for the Linux
    based enterprise infrastructure.

    On the enterprise-level infrastructure, it is ideal if all the Linux operating
    systems have consistent time. Tools are provided by the Linux operating system
    to configure the hardware time and system time. The following are some of them:


