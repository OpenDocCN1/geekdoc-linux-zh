  md: '# 182 Chao


    Before the installation, make sure that the Linux operating system and the network
    are working properly and the technician who will perform the installation has
    the root privilege. Depending on the usage of MySQL, its installation on Linux
    may require the RAM as small as 512 MB and several gigabytes of drive space. To
    support a large database, MySQL can also use 16GB RAM on a 64-bit multi-processor
    system with multiple hard drives configured with the RAID 10 architecture. The
    technician should also make sure that the version of Linux is supported by the
    latest MySQL software package.


    After the technician has verified that the requirements for hardware and software
    are all met, it is the time to download the MySQL package from the MySQL.com site.
    There are several types of installation packages. One can download the package
    in the RPM format, or the package in the tar format, or the package of source
    code. The installation of the RPM package is fast and easy. However, the RPM installation
    will place the configuration files everywhere, so it is difficult to find these
    files. Although it is a bit more complicated, the installation of the tar package
    will keep the configuration files in a folder that is easy to find. In the following
    we will take a look at an installation for both types of packages.


    First, suppose that you have downloaded the MySQL tar.gz installation package
    such as mysql-version_number.tar.gz from MySQL''s Web site. The version_number
    represents a version of MySQL. Extract the compressed tar.gz file with the desktop-management
    GUI tool KDE or GN, or with the following command for extracting and installing
    the installation package.


    ```

    # -xzf mysql-version_number.tar.gz

    # cd mysql-version_number

    # ./configure --prefix=/usr/local/mysql-version_number

    # make

    # make install

    ```


    Next, you will set up a configuration file to specify some management and security
    options. You may modify some of the pre-made configuration files to fit your needs.
    For MySQL, the my-huge.cnf, my-large.cnf, my-medium.cnf or my-small.cnf. These
    configuration files are designed for different types of servers. For example,
    for a server, you may choose to modify the my-small.cnf file. You can copy the
    selected pre-made configuration to your configuration file directory and rename
    it as /etc/my.cnf. Assign the root to the owner of the file and assign the read/write
    privilege to the user root. By using the vi editor, you can add new user accounts
    to the file or enable the innodb option which provides MySQL with a ACID compliant
    storage engine which provides commit, rollback, and crash recovery capabilities.


