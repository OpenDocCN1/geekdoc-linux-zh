    sites.

    * Through the Internet, students should be able to view and listen to the multi-media
    course content.

    * To communicate with instructors and other students, each student should have
    an e-mail account created on the LMS.

    * Students should be able to submit their assignments, take exams and quizzes,
    and view their grades online.

    * Collaboration tools such as forums, chats, virtual whiteboards, Wiki, or text
    messengers should be added to a student’s account so that the student can interact
    with instructors and other students.

    * Students should also be able to participate in video conferences. They should
    be able to use video conference tools such as VoIP phones, virtual whiteboards,
    and so on.


    Instructor accounts need more privileges; they often require LMS administrators
    to create accounts for instructors and add the instructors’ accounts to the courses
    they are going to teach. In addition to the permissions given to a student, the
