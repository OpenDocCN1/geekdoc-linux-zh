  md: '# Security Management 223


    +   * The learning management system and its remote access services can also be
    a factor that may cause security problems.


    +   * The improper configuration of network devices, protocols, and services will
    lead to some serious security problems.


    +   * Wireless network access points and data transmission through air can post
    some security threats, especially if those data are not adequately encrypted.
    Downloading software and installing the downloaded software from the Internet
    may cause computer virus infection.


    +   * Weak security policies can lead to inadequate security measures when trying
    to protect the online teaching/learning system from hacker attacks and computer
    virus infection.


    Security problems are mainly due to hacker attacks and computer viruses. Although
    most attacks come from the Internet, there are also some dangerous internal hackers.
    The following are some of the commonly seen hacker attacks:


    +   * Hackers often launch a denial-of-service (DoS) attack which is one of the
    simplest and most commonly used methods. A denial-of-service (DoS) attack floods
    a network with useless network traffic which takes away the bandwidth of the victim
    network. In such a way, it overloads the network service and causes the service
    to shut down.


    +   * Hackers can log on to a server by trying many different password combinations.
    They can use some of the free software to try a large number of passwords rapidly.


    +   * Hackers may use spyware to attack. They can set up some Websites and wait
    for people to browse and interact with their application software, or download
    their free files. The interactivities with the application software or the downloaded
    files will bring the spyware to people’s computers. Then, the spyware secretly
    collects information about the people and their computers, and transmit the collected
    information to the hackers’ Web sites or e-mail addresses. Once a hacker steals
    the password and user information from a victim computer, he can set a spam relay
    to the victim computer system to harm other computers on the network without being
    caught.


    +   * Hackers can use publicly available accounts provided by Web servers, database
    servers, learning management systems, and operating systems. These publicly available
    accounts are used for the initial configuration for the convenience of system
    administrators. These accounts often have well known user names and passwords.
    If the passwords are not changed before the public can see the accounts on the
    network, the hackers can log on to the system as'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# 224 Chao


    administrator and create accounts for themselves. From there on, the entire system
    will be under the hackers'' control. Even through an anonymous account which has
    no administrator''s privilege, a hacker may still peek through the file structure
    to collect some information about the users and the structure of the file system.


    +   - Hackers can sniff a wireless network without being physically wired to the
    network. Some of the wireless network devices have no protection by default for
    quick installation. If they are not reconfigured, these devices will allow hackers
    to access the network without proper authentication. On the wireless network,
    when a computer is booted up, it sends a broadcasting message to search for an
    access point nearby. With the sender''s information, the hacker can figure out
    how to access the victim computer system to collect other valuable information.
    The hacker can set up a rogue access point to offer a connection to the victim
    computer which is looking for a connection. Once connected, the victim''s data
    will be transmitted to the rogue access point. Then, the hacker will be able to
    read all the unencrypted data or decrypt the encrypted data.


    +   - There are many free network monitoring tools available on the Internet.
    A hacker can download and install one of these tools to capture the network traffic.
    If the data are not encrypted, the hacker can read all the information, the user
    name and password, carried by a network transmission protocol. Unfortunately,
    most of the earlier network transmission protocols including the well known FTP
    and HTTP carry clear text over the Internet.


    +   - Web interactive components such as ActiveControls and Java applets, as well
    as many scripts can also cause serious security problems. Hackers can use these
    programs to bypass a firewall to penetrate a private network. Sometimes a hacker
    makes a malicious package available on a Web site and pretends the hacker can
    help users in some ways. Once this type of file is opened on a computer, the hacker
    will take control of the computer.


    +   - Another way that a hacker can damage an online teaching/learning system
    is to utilize software bugs. These software bugs create security holes that allow
    the hacker to collect information about users, computer systems, and networks.
    Some of these software bugs can even give the hacker some privilege to perform
    certain activities such as delete, modify, or copy files on a victim computer.


    +   - Hackers may be able to convince the online application tools provided by
    a database management system or learning management system to run malicious scripts
    which are designed to cause some significant damage.


