    # CONCLUSION


    In this chapter, we have discussed the issues related to the security management
    for an online teaching/learning system. To meet the security requirements, we
    need first to identify the security vulnerabilities in the online teaching/learning
    system. Two major sources that cause a system to be insecure are hacker attacks
    and virus infection. This chapter has listed the ways that hackers can attack
    the online teaching/learning system. It also discussed how different types of
    viruses can damage the online teaching/learning system. To protect the online
    teaching/learning system, this chapter suggests that a team including users, developers,
    and administrators should develop a well defined security policy. The security
    policy must address the issues related to system confidentiality, integrity, and
    availability. The implementation of the security policy often requires the assistance
    of security management tools. There are hundreds of tools available. This chapter
    focuses on the open source and free tools and categorizes these tools into different
    categories. Several products in each category have been used to illustrate that
    these open source and free security management tools are adequate for handling
    the tasks of identifying security vulnerabilities and enforcing security measures.
    Through two examples, this chapter showed that the built-in security management
    tools in the Linux operating system can also accomplish security management tasks.


    So far, we have discussed most of the components in the client-server system which
    supports the online teaching/learning system. There is one component that has
    not been discussed. It is the client component, which is also called the front-'
