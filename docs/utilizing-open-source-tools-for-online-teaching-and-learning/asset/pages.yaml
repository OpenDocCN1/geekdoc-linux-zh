  md: '# EXAMPLE: ONLINE COURSE MATERIAL DEVELOPMENT


    As described in the previous section, there are many sophisticated open source
    tools available to assist the development of course materials. This section will
    demonstrate the course material development process with some of the open source
    tools. It will demonstrate the process of creating multimedia course materials
    for hands-on lab activities. We will go over each major step in the ADDIE model
    and make decisions on selecting the appropriate technologies. A simple example
    will be used for demonstration purposes. Each instructor may have specific needs
    on what to cover in the course materials and how to present these materials. With
    so many choices of open source tools, the use of a specific tool will depend on
    the requirements, availability, and the user''s familiarity with the tool. The
    ultimate goal is to develop the course materials that meet the requirements of
    online teaching and learning. It was mentioned earlier that the ADDIE model has
    five phases, Analyze, Design, Develop, Implement, and Evaluate. Let us start with
    the Analyze phase.


    # Analyze


    To set up the design goals, we need to first analyze learners'' characteristics.
    The investigation starts with identifying the hands-on requirements for a Linux
    networking which covers topics such as network systems, network configuration,
    network security, network protocols, network equipment, and network troubleshooting.
    The course includes many lab activities to teach the students-hands-skills. Through
    the hands-on practice, the students will be able to develop networks to solve
    business problems. During the hands-on practice, the students will perform the
    following tasks:


    +   * Get familiar with network utilities such as ping, traceroute, and ethereal.

    * Install and configure network equipment such as network interface cards, switches,
    and routers.

    * Design and implement local area networks and wide area networks.

    * Configure the network to meet the business requirements such as creating the
    directory service for managing users, computers, and network equipment at the
    enterprise level.

    * Configure remote access services and network based applications.

    * Identify security vulnerabilities and enforce security measures to protect the
    network system.


    In addition to the requirements for hands-on-practice, we will also collect information
    about the students'' knowledge, learning behavior, and learning environment.'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'Suppose that the Linux networking course involved in this study is a sophomore
    or junior-level course. There are not a lot of prerequisites for the course. For
    students who have some knowledge about the Linux operating system and some basic
    programming skills, they should be qualified for this course. Most of the students
    are motivated to do hands-on practice because hands-on practice helps the understanding
    of the content, makes the learning more fun, and gives the students more opportunities
    on the job market. At the sophomore or junior-level, the students are familiar
    with the university''s rules, the university''s grading system, and the university''s
    online teaching/learning system. Except for a few individuals, most of the students
    make adequate effort to study the course materials and to complete the assignments
    on time.


    Most of the last activities can be done through the university''s online teaching/learning
    system. A learning management system will be used to manage the class and host
    the course materials. Through the learning management system, the students will
    be able to view and download the course materials. The students can also submit
    their assignments to the learning management system and view their grades. For
    the students who have several computers and network equipment at home, they may
    also do their lab work at home and submit their lab reports through the university''s
    leaning management system.


    A special online computer lab is developed for the students to complete their
    lab activities. The students can remotely access the computer lab through the
    VPN service. The online computer lab is equipped with computers installed with
    the SUSE Linux operating system. These computer systems are used as servers for
    network development. Each server hosts three virtual machines constructed with
    a client-server structure. One of them is installed with the server version of
    the Linux operating system and the other two are installed with the desktop version
    of the Ubuntu Linux operating system. Each student will be the administrator of
    the virtual machine assigned to him/her. After a student log on the lab computer
    assigned to him/her from the home computer, the desktop of the student''s home
    computer will be taken over by the desktop of the computer in the online computer
    lab. Due to the fact that the students will be the administrators of the virtual
    machines, these virtual machines will not be used for other classes since the
    students may crash the virtual machines due to configuration mistakes.


    # Design


    The next phase of the course material development is to design the course materials
    to meet the teaching and hands-on practice needs. To help the students carry out
    the hands-on tasks listed in the Analyze phase, we will first identify the design
    goals. For example, to help the students with the installation and configuration
    of


    Copyright © 2009, IGI Global, distributing in print or electronic formats without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'the network equipment such as network interface cards, the lab manual will
    be designed to achieve the following measurable objectives:


    +   * After the lab activities, the students should be able to understand how
    computers communicate with the network.

    * The students should be confident that they can make the computers on the Linux
    network communicate with each other.

    * The students should be able to use the network configuration utilities.

    * The students should be able to configure the network interface cards for the
    given IP addresses.

    * The students should be able to verify if a network interface card is working
    properly and be able to troubleshoot configuration errors.


    To help the students achieve these hands-on practice objectives, the lab manual
    should be developed to guide the students on the hands-on practice. The lab manual
    should be able to do the following:


    +   * Make sure the students understand the objectives of the lab activities.

    * If necessary, provide some background information about Linux networking.

    * Help the students to be familiar with the lab environment and get ready for
    the lab activities.

    * Guide the students to configure network devices such as network interface cards.

    * Demonstrate how to verify the results of the configuration and correct any mistakes
    that may occur.

    * Teach the students how to write lab reports, and assign the homework to students.

    * Provide additional reading materials to help those students who would like to
    have more information about the lab activities.


    The content in the lab manual can be either written in text or presented in the
    multimedia format. Text-base materials are good for presenting the lab objectives
    and background information. On the other hand, it is difficult to represent technical
    details with text-based materials. It may need very lengthy descriptions for some
    simple configuration activities. We need to keep in mind that most of our students
    are new to the course content. It is easy for our students to interpret the content
    in the lab manual differently than that of professionals. And also, since the
    students are taking the online class, there is no one nearby to point out where
    the mistake is. Often, most of our students have no idea what causes an error
    and begin to try many things which leads to more serious problems.


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'Therefore, multimedia materials are often used to present the content that
    involves technical details. For example, the configuration and verification processes
    should be illustrated with screen recording which includes all the mouse movements
    and commands entered in the command terminal. Comments and tips should be added
    to the recorded video clips. Links to these video clips will be placed in the
    lab manual along with text-based content.


    # Develop


    In this example, the instructor will play a major role in developing the lab manual.
    He/she will write the lab manual with the content specified in the design phase
    and experiment with the hands-on activities included in the lab manual. The instructor
    should make sure that the activities in the lab manual can be done in the online
    computer lab flawlessly. The entire lab manual can be developed with OpenOffice.
    It is possible that the lab assistants will help with the hands-on activities
    and the online teaching support staff can help with the creation of the multimedia
    content. Since the screen recording can be easily done with the Linux operating
    system, the instructor may be able to do all the recording by himself/herself.


    # Implement


    Once the lab manual is created and verified, it is ready to be delivered to the
    students online. By now, the online teaching support staff should have already
    created the class Web site and created the link to the lab materials. Either the
    instructor or one of the online teaching staff members will upload the lab manual
    to the properly created folder in the learning management system. After the lab
    manual is uploaded, the instructor should log on with an account with the student
    privilege to verify if a student can access the lab manual. If there are problems,
    the instructor, the system administrator, or technicians should fix the problems
    as soon as possible. In addition, the instructor should provide the instruction
    in the lecture notes or in the syllabus on how to access the lab manual and what
    the grading policy is for the lab reports.


    # Evaluate


    In this phase, we will verify if the design goals have been achieved. The lab
    reports, assignments, and the course evaluation can be used as evaluation instruments.
    The students’ GPAs and survey results can also be used for the evaluation. The
    results of the evaluation will be used as a guideline for further improvement
    to achieve the design goals. More details about evaluation will be covered in
    the next chapter.


