  md: 'Social computing software which is a kind of collaboration software has been
    used to form an online community for collaborative learning. New social comput-ing
    software is implemented on the popular open source Internet technology Web 2.0.
    Social computing has been supported by Web 2.0 which has great potential for online
    teaching and learning.


    The success of Web 2.0 can improve the education of gaming in various areas. First,
    Web 2.0 enriches online gaming by improving the graphics and richness of the content.
    It also makes online collaboration easier by improving online commun-munication,
    player relationship, and media sharing.


    The Web 2.0 technology is also used to support context-aware computing which an
    adaptive mobile computing method. Web 2.0 based context-aware computing can connect
    user context and community information with the Web service to al-low students
    to access services and multimedia content according to their location, identity,
    and preferences. In their article, Schmidt and Winterhalter (2004) discussed how
    context-aware computing can be applied to e-learning.


    # TRENDS IN INSTRUCTIONAL TECHNOLOGY


    One of the trends in the online teaching and learning infrastructure is to increasingly
    use mobile devices for better mobility. The improvement of the wireless techn-ology
    allows students to use smartphones, PDAs, iPods, and Other mobile devices to access
    course materials whenever and wherever the course materials are needed. These
    devices can also be used for real-time Web conferencing. The use of mobile devices
    has created a new way of learning called personal broadcasting. Podcasts is one
    of the popular personal broadcasting methods. It allows students to share course
    information through iPads.


    The increasing use of Google, Wikipedia, and YouTube in online teaching and learning
    is a new trend. By using these technologies, there comes another new trend called
    do-it-yourself (DIY) learning, which is a rapidly growing learning method.


    The Web 2.0 technology leads to a new trend in e-learning called E-learning 2.0
    allows users to create and share knowledge with others. Students can form a social
    network for collaborative learning. E-learning 2.0 is also called social learning
    (Downes, 2008).


    Course content modularization is an approach that divides the course content of
    small units. Many of the technology based courses share common components. Modularization
    is particularly useful for teaching this type of course. Based on the requirements
    of a new course, the small units from different subjects can be reassembled and
    used to teach the new course. Such an approach can speed'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'up the course material development process and will have a significant impact
    on online teaching and learning.


    In the above, some new technology trends and their application to online teaching
    and learning are discussed. Some of these technologies have existed for years
    and continue to be improved and the others are new or still under development.
    As technology and instruction improve, the quality and performance of online teaching/learning
    systems will get better and better.


    # CONCLUSION


    In this chapter, some trends in online teaching and learning as well as the supporting
    technologies have been discussed. The rapidly advancing technologies have been
    changing the way of teaching and learning and will continue to do so in the future.
    As described in this chapter, open source products such as the Linux operating
    system, Web 2.0, and Ipv6 have had and will continue to have a great impact on
    online teaching/learning systems. We know for sure that will be new inventions
    in the coming years and the open source approach will lead the charge.


    The theory and practice of instructional technology will continue to be updated
    to adapt to the fast changing technology, and there is no sign that the progress
    will slow down. Therefore, university administrators, instructors, students, and
    IT professionals must update themselves to keep up with the new trends.


    When developing and running an online teaching/learning system, the people who
    are involved in the project need to closely examine the new trends and adopt the
    new ideas and technologies that can be used to improve their online teaching and
    learning.


