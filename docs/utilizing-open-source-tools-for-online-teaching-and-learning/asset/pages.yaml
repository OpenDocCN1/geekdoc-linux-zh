    and set the hardware clock time. This tool allows the system administrator to
    set the system time and time vice versa.

    **ntdate:** It is used to set the system time.

    **ntpdate:** This tool can be used to adjust the system time.


    Most of these tasks can also be done with the graphical tools provided by the
    desktop management system installed with the Linux operating system.


