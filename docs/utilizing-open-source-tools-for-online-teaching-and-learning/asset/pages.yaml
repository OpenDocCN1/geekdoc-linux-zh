    - A grade management tool can be used to implement a grading policy. Usually,
    the instructor weights the homework, projects, and exams differently. For example,
    the homework may get 20 percent, projects 20 percent and exams 60 percent of the
    total grade for a class. The grade management tool can be used to implement the
    instructor''s grading policy.

    - Students'' grades should be well protected. They need to be backed up frequently.
    The process of backup and recovery can be done by importing and exporting students''
    grades to or from spreadsheets files. The grade management tool can be used to
    accomplish this type of task.

    - The instructor can scale scores in different ranges. The commonly used scale
    range is from 0 to 100. However, with the grade management tool, the instructor
    can scale the scores in any he/she wants such from 200 to 800.


    Grade management tools can greatly help instructors to better manage students''
    grades. Tracking and analyzing students'' grades are often tedious and time consuming.
    A well developed grade management tool can reduce the grading time significantly.
