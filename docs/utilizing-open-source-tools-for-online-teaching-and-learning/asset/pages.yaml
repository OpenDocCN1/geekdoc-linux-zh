    # ATutor


    ATutor is another open source software package for managing e-leaning systems.
    As a Learning Content Management System (LCMS) software package, ATutor is designed
    to focus more on the learning content and less on the course and user management
    than an LMS package. ATutor has built-in content authoring, assessment, and collaboration
    support. It has good online help for new users, and it supports multi-language
    usage. Based on the analysis done by Commonwealth of Learning (2003), when dealing
    with the learning content, ATutor had a higher overall score than that of Moodle.
    As pointed out by Commonwealth of Learning (2003), ATutor had a smaller user base
    as it was quite new to the market in 2003. ATutor is currently supported by over
    15 languages. The following are some of the features provided by ATutor.


    +   ATutor is relatively easy to install or update, and it can easily retrieve
    and import previously developed learning modules to extend its functionalities.
    ATutor allows instructors to quickly assemble, package, and re-distribute online
    learning content based on the objectives of a course and the learning styles of
    the students who are participating in the class. Based on different teaching and
    learning scenarios, ATutor can re-organize the learning environment settings,
    tools, modules, privileges, and groups to make the learning and teaching more
    effective.


    +   ATutor provides assistive technology to help students, instructors, administrators,
    and users with disabilities to access the learning content. To improve accessibility,
    it also allows the access to all learning content through keyboards and provides
    text alternatives for all visual elements. With a screen reader Talker which can
    read aloud ATutor interface and feedback'
