    # INTRODUCTION


    Web-based teaching has become one of the main stream teaching and discussion methods
    in most of the higher education institutions. To support teaching and learning
    activities over the Internet, Web-based teaching has been implemented with various
    technologies. Among the various solutions, using the open source technology to
    construct a platform for supporting online teaching and learning has attracted
    a great deal of attention. To better understand the open source technology and
    how it can be used to support online teaching and learning, we will first take
    an overview of the open source technology in this chapter. We will investigate
    the roles played by the open source technology. We will also examine the strengths
    and weaknesses of the open source technology in general. At the end of this chapter,
    a framework of the book will be presented to give an overall picture of the discussion
    in the book.


    The overview section will explain what open source is and list some open source
    tools that are available for online teaching and learning. We will briefly review
    the history of the open source technology. We will investigate the usage of the
    open source technology in education institutions.


    After the brief overview, we will look at the roles the open source technology
    plays in the IT industry and in online teaching and learning. Then, we will consider
    the advantages and disadvantages of the open source technology. We will compare
