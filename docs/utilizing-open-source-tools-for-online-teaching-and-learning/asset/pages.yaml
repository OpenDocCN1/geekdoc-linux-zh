    +   - Layer 3 switch: Similar to a router, a Layer 3 switch can be used to forward
    packets to a destination computer system on another network. The difference between
    a Layer 3 switch and a router is that the Layer 3 switch is a piece of hardware
    that implements the software logic built in a router. By doing so, it may lose
    some flexibility, but gain better performance. Therefore, for network routing,
    a Layer 3 switch is a high-performance device.


    Network devices use various source protocols that can carry the network traffic
    to the destinations, control how a packet should be sent, detect and fix problems
    during the transmission, and manage the network resources. The discussion of protocols
    is next.


    # Network Protocols


    Protocols are usually designed to accomplish specific network related tasks and
    they can be implemented by using software or hardware, or both. During the data
    transmission over a network, the following tasks can be done by protocols:


    +   - When transmitting information over a network, messages are divided into
    little chunks called packets which are used to carry the messages to the destinations.
    Protocols are used to format these packets.

    - Protocols can be used to determine the start and end of a packet to be transmitted
    over a network.

    - Protocols can detect a destination end point and determine how to establish
    a connection to the end point at the destination.

    - Protocols can check the messages transmitted to the destinations. If an error
    occurs during the transmission, they can either correct the error or discard the
    packet.

    - Protocols can reassemble the packets at the ultimate destination to reconstruct
    the original messages.

    - Protocols can also be used to manage connections. They can detect those lost
    connections and decide what to do with them.


