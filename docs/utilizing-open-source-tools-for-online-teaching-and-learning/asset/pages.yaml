    # Open Source Operating Systems


    On a server computer, the operating system is the software used to manage users,
    networks, memory, file systems, data processes, data storage devices, system security,
    remote access, computer resource sharing, and so on. It controls and output devices
    such as a monitor, network interface card, modem, keyboard, USB device, mouse,
    and so on. The operating system is also used to support application software such
    as learning management system software, database management software, programming
    language software, multimedia software, gaming software, and so on. The commonly
    used operating systems are Linux, Windows, Mac OS, and various versions of UNIX.
    Among Linux, Mac OS X, and various versions of UNIX are UNIX related operating
    systems. Windows takes a different approach.


    Most of the open source operating systems are UNIX-like operating systems such
    as Linux, OpenBSD, and OpenSolaris. As open source products, these operating systems
    open their source code for the general public to contribute their effort to'
