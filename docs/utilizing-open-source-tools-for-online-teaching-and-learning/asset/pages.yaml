  md: '# Design and Development of Online Course Materials 301


    * Byzanz: Byzanz is a simple screen recording applet included in the GNOME desktop
    environment. With Byzanz, users can record the activities on screen and save the
    record as an animated gif file. It may not be installed by the default installation
    process. If so, suppose that Ubuntu Linux desktop operating system is installed
    on your computer, install Byzanz with the command:


    ```

    sudo apt-get install byzanz

    ```


    After the installation, users will be able to find Byzanz by the pop-up menu by
    right clicking the GNOME desktop. Then, the screen recording is just one click
    away.


    As described above, screen recording is relatively simple in the Linux environment.
    If the user only needs quick screen recording for the lab activities, Byzanz is
    a good choice for the Linux operating system that is using the GNOME desktop environment.
    When you are developing full featured tutoring and presentation materials, vns2swf
    and Wink are the choices for developing video clips for the lab activities.


    # CONCLUSION


    In this chapter, we have discussed the issues related to course material development
    with open source tools. As illustrated in this chapter, the instructional design
    theory plays an important role in developing quality course materials that can
    ensure the teaching requirements are met. The theory of instructional technology
    provides us with a systematic approach to implementing a technology based system
    for teaching and learning.


    This chapter has shown that there are many choices of open source course material
    development tools. Through the discussion of the open source tools for developing
    online course materials, we have discovered that these open source tools are actually
    very sophisticated and versatile. These tools are sufficient in handling the tasks
    of creating Web-based multimedia and collaborative course materials. An example
    has been used to demonstrate the development of a lab manual with the ADDIE model
    and open source multimedia tools. As illustrated in the example, not only can
    the open source products be used to construct the online course materials, they
    are also powerful, sophisticated, and easy to use.


