  md: '# Introduction to Open Source Products


    The following will first review some major events in the history of the open source
    software and then briefly describe the open source related industry and market.


    # History of Open Source Tools


    Using open source materials for teaching and learning has shared a long history
    in the field of education. Course materials are always shared among teachers and
    students. Lecture notes, handouts, lab manuals, and assignments are often developed
    by using open source materials. By modifying them to fit their own teaching and
    learning needs. Education has benefited greatly from the open source approach.
    This approach is also the main force to motivate the innovation of new technology.
    In the short history of computer technology development, many of the innovations
    have been made through the open source approach. The technologies such as the
    Internet, Web, Linux, and many more are all open source tools. In the following,
    we will explore some of the major open source tools along with the history of
    their development.


    # Internet


    The Internet, as we all know, is the backbone of the IT industry. However, the
    first Internet was the result of the collective effort of an open standard approach.
    The first significant project done with the open source approach was the Advanced
    Research Projects Agency Network (ARPANET) project. In the 1960s, a group of researchers
    were trying to develop a network protocol for the U.S. Department of Defense.
    By requirements, the new network should be able to stand harsh conditions and
    keep the communication alive. Certainly, the concept and construction of such
    a network were new to everyone. The project involved so much knowledge from various
    academic fields. It was particularly difficult for a small group of people to
    carry out such a huge project. To make it happen, the researchers adopted the
    open standard approach, the technologies and resources are available to all the
    users approved by a committee. These approved users users worked for the same
    project on a consensus basis. As a result, the collective effort created the world''s
    first Internet ARPANET. Although from today''s point of view the ARPANET is a
    bit slower, the project realized a new approach in software development and a
    legacy of concepts and algorithms that today''s Internet industry is still using.
    The following is the timeline of the ARPANET history.


    +   1967: The first ARPANET design meeting was held in Ann Arbor, Michigan.'
