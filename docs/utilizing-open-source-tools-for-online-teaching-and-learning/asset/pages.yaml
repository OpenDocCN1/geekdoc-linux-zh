    Worm: A worm is a type of virus that often affects a network. Once a worm gets
    on a network, it scans the network and tries to find a security hole on the computers
    connected to the network. Then, from the newly infected computer, the worm continues
    to probe the network to find other security holes. The worm can harm the network
    by consuming the bandwidth that often need to be carried by another program to
    replicate themselves. The worm can propagate itself without being carried by another
    program. Some known worms are W32/Bolgimo, worm and Supernova Worm.


