- img_proc: true
  md: '# Instructional Technology Theory for Online Teaching/Learning System 41


    +   User interface component: In this component, the types of user interfaces
    need to be specified. Based on the requirements, a user interface, menu interface,
    or command interface. The designers need to specify the appearance of an interface
    and the activities related to the user interface.


    +   Business rule component: Business rules are often used to determine how a
    data component can be mapped to a user interface. The component here includes
    the university regulations and the application logic related to these regulations.
    For example, if the minimum enrollment requirement for a class is ten students,
    this regulation rule will lead to the constraint on whether a class can appear
    on the Web site after class registration is completed.


    The above components are part of the system infrastructure, which is often created
    on the client-server architecture.


    # Client-Server Infrastructure


    A single-tier system includes all three components, data, data, user interfaces,
    and business rules on a single computer. This type of system can be implemented
    on a personal computer installed with some application software such as word processing
    software and a personal database.


    A two-tier system has the client and server tier. Some of the components are placed
    on the client tier and the others are placed on the server tier. For example,
    a Web site is a two-tier system. The user interface component is placed on the
    client tier which is the Web browser, and the business rule and data components
    are placed on the server side. A two-tier system can be implemented on a network
    that consists of server computers and client computers which include desktop computers,
    notebook computers, and hand-held devices.


    A three-tier system has the client tier, middle tier, and server tier. The user
    interface component is usually placed on the client tier, the business rule component
    is usually placed on the middle tier, and the data component is usually placed
    on the server tier. A three-tier infrastructure can be implemented on a network
    including client computers, middle tier computers and server computers which host
    databases. performance and is more flexible that it can include various technologies
    and different versions of software in one system. On the other hand, the three-tier
    infrastructure requires more equipment, more complex networks, and more development
    effort. For a complicated infrastructure, multiple middle tiers may need to be
    constructed. We can call this type of infrastructure an N-tier system. In later
    chapters, technical details about creating an infrastructure will be given.


