    # OVERVIEW OF OPEN SOURCE TOOLS


    The term open source means that the source code of the software is open to the
    general public with no or minimal copyright restriction. Originally, open source
    code was available to users in a shared group. The open source code allowed the
    users to exchange the code and contribute their effort to improve the code. Later,
    open source has become a way of software development. In the development process,
    the software is improved by thousands of users that make the software more stable
    and versatile. In its short history, the open source software has made several
    revolutionary changes in the IT industry. Nowadays, the open source concept not
    only has a tremendous impact on the software industry, but also has become the
    culture in a manufacturing process that uses the collective effort to gain significant
    results.'
