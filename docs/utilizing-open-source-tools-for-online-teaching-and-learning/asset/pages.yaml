  md: '# Project Planning


    The planning starts with forming a planning committee that includes representatives
    from the university administrators, computer service managers, and faculty members.
    The following are some of the tasks to be carried out by the planning committee.


    +   - The committee''s first task is to identify the resources for the project.
    The results from the physical design will be used to estimate the project financial
    requirements. The committee will make a decision on the project budget.

    - Based on the available resources, the committee will make decisions on the selection
    of technologies for the project.

    - Once the committee has decided on what technologies to use, they will form a
    construction team that includes a project manager, in-house technicians, instructors,
    and people from a consulting company.

    - To make sure that the project will be completed on time, the committee will
    draft the project''s timeline.

    - The planning committee will also draft security policies that will guide the
    project development during the construction process.

    - The planning committee will also analyze the effectiveness of using the technologies,
    resources, and manpower so that they can speed up the development process.


    The following are the descriptions of the above tasks.


