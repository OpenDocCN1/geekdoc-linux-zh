    # BACKGROUND


    Security of an e-learning system has caused, in general, a great deal of concern
    among researchers. The enforcement of security policies often requires great effort
    from a team which consists of computer service personnel, university administrators,
    faculty members, and online teaching staff members. Weippl (2005) demonstrated
    how security concern among higher education institutions and administrators can
    be trained to use the virtual e-learning environment. For pre-college education,
    Yang and Dark (2005) discussed an information risk assessment project for a K12
    school corporation in their paper. They implemented the risk assessment project
    to analyze and evaluate the risks in the instructional technology systems. Another
    security evaluation study was reported by Dark (2003) who gave an overview of
    security evaluation, evaluation design, evaluation implementation, and evaluation
    management.


    Riola (2006) discussed the security issues related to the wireless network used
    to support online teaching. Riola (2006) addressed the wireless network implementation
    and security issues in supporting technology teaching. For the issues related
    to the mobile e-learning security, readers can also find information from Weippl
    (2004) paper.


    Gokhale (2002) discussed the issues related to the analysis of security vulnerabilities,
    the development of appropriate security policies, and the enforcement of the security
    measures. El-Khatib, Korba, Xu, and Yee (2003) presented ways to protect e-learning
    projects by enforcing appropriate security measures.


    A large number of books and articles have been published to help readers identify
    security vulnerabilities, develop security policies, and enforce security measures.
    For example, the book by McNab (2004) demonstrates how to identify security vulnerabilities.
    The book by Peltier (2004) shows the reader how to develop well-defined security
    policies. The book by Kao (2003) explains how to carefully carry out and test
    security policies. Various security technologies have


