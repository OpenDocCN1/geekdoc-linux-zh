    +   - E-mail, chat, or text messenger management software and devices

    - Web server development and management software and devices

    - Uninterruptible power supply (UPS) equipment and management tools


    In the above, some basic server server items are listed. There can be a lot more
    software and devices to be installed on a server based on the specific needs to
    deliver online courses. On the other hand, it is not necessary to install all
    of the above software and devices on a single server. In fact, to improve security,
    reliability, and performance, server software is often installed on multiple computers
    and each computer is only responsible for the specific server task. The following
    are types of servers commonly used in an online teaching/learning system:


    +   - Network server: It is used to manage network users, computers, network structures,
    security, and resources.

    - Database server: It can be used to manage databases and storage devices, and
    it allows users to access data through the Internet or intranet.

    - Application server: In a three-tier client-server structure, the application
    server is at the middle tier to implement business logic. It processes requests
    from clients and fetches the necessary data from the server that hosts databases.

    - Multimedia server: This type of server supports multimedia activities on a network
    such as delivering streaming multimedia content to Web pages.

    - Print server: It can manage network printers, scanners, and copiers.

    - FTP server: It is used for transferring and downloading files over the Internet
    or intranet.

    - Groupware server: This server is designed to support group collaboration via
    the Internet or intranet.

    - Mail server: This server supports e-mail operations over the Internet or intranet.

    - Proxy server: It is responsible for filtering client requests and share connections.
    It can also be used to enhance the security of the internal network.

    - VPN server: This server enables users to remotely log on to the workplace via
    the Internet or intranet.

    - Virtual server: It can be used to develop virtual machines which are used to
    perform hands-practice.

    - Web server: This kind of server delivers course materials to a Web browser.
    It can also receive requests from Web browsers, process the requests, communicate
    with other servers, and return the results back to the Web browsers.


