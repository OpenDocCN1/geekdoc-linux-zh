    # Creating User Accounts


    Most of the open source LMSs may provide various ways of user authentication.
    A user can be authenticated by e-mail authentication, Lightweight Directory Access
    Protocol (LDAP) authentication, or self-registration authentication. Brief descriptions
    about these three authentication methods are given:


    +   - E-mail authentication: For sending messages to e-servers, most of the current
    e-mail systems have no user authentication. Lacking authentication for e-mail
    is security vulnerability. By altering an e-mail''s header, a spammer can make
    spam e-mail to appear as though they come from many different origin sender addresses.
    In such a way, the e-mail recipient''s spam filter is fooled and accepts the spam
    e-mail. Some of vulnerable computer systems on the Internet can also be used by
    spammers to launch spam e-mail. The e-mail


