  md: '# Class Management 203


    authentication technology is used to prevent spam attacks by verifying the sender''s
    real IP address and determining if the sender should be trusted.

    LDAP authentication: LDAP is a widely used authentication method. The authentication
    information about users and network resources is stored in a directory. The stored
    information can be used by many server-side services such as the remote access
    VPN server, the e-mail login server, the learning management system, the database
    management system, and so on. When a user is trying to log on to a computer system
    linked to the network where the LDAP server is installed, LDAP performs the user
    lookup and verification. If the information provided by the user matches the information
    stored in the directory service, the user can then log on to the computer system.
    The information stored in the directory can be altered or deleted by the network
    administrator.


    Self-registration authentication: This authentication method allows users to create
    their own accounts. This technology has been used by many online shopping vendors
    to allow customers to create their own accounts. An online teaching/learning system
    can also benefit from this technology. By using self-registration, students can
    add themselves to the classes with their own permission. The self registered students
    can view the course content and requirements for a period of time without registering
    a class, and then decide if they want to register the class or not. The self-registration
    method is also a great way for group activities. Students can register themselves
    in the groups they want to join. Self-registration can be configured to allow
    students to register themselves under certain conditions such as meeting the course
    prerequisites and financial clearance. It can also set the time period during
    which students need to make a decision if they want to register a class or not.
    Self-registration can also be configured to allow a user to register as a student
    whose account has limited accessibility.


    Sometimes, the combination of these authentication methods is used to create a
    more flexible and secure authentication method. For example, the self-registration
    method is often combined with the LDAP authentication method. For example, only
    users who are university employees and students can register themselves in a class
    that they want to preview. In such a way, they have more flexibility to preview
    classes and online classes are better protected.


    When creating accounts for students, you will be prompted to select the authentication
    method. Based on the above discussion, you can select the authentication that
    meets the requirements of the online teaching/learning system. Other information
    needed for creating a user account will be the e-mail address. Often, the LMS
    will send a confirmation e-mail to the user whom the account is cre


