  md: '# Design and Development of Online Course Materials 289


    will make the project related application software such as database management
    system available to the students. Once the project is in place, serious tests
    should be done before the project is released to the public.


    The testing process will follow the project model to verify the goals and objectives
    can be achieved effectively. For example, the instructors will test the newly
    created online course materials which are designed for teaching and hands-on practice.
    The testing should ensure that the students can perform all the required activities.
    The testing results should be recorded for future reference. Based on the testing
    results, the project development team may need to further modify the project in
    order to meet the teaching requirements.


    After the testing process is completed, the project can be released to the public.
    To help the students quickly learn how to use the new course materials, the development
    team must provide training for the students. The training can be done through
    seminars or through multimedia demonstration and step-by-step instruction on the
    Web sites. There should be an evaluation procedure to collect the students'' feedback
    on the usage of the new online course materials. Errors reported by the students
    should be fixed immediately.


    Online teaching and learning is a fast changing field. Once a new technology is
    invented, there will be a demand for it to be used for the course materials or
    for improving the current teaching and learning. As a result, the course materials
    and facilities for teaching and hands-practice will be updated accordingly. Every
    semester, there will be some new requirements for the online teaching/learning
    system. To quickly update the course materials, various tools have been invented
    to help the instructors and technical personnel to get the job done. The following
    section will introduce some of the tools.


    # OPEN COURSE MATERIAL DEVELOPMENT TOOLS


    There are three types of tools that can be used to develop online course materials.
    These three types of tools are Web authoring tools for developing Web pages, multimedia
    tools for creating multimedia course materials, and collaboration tools for group
    activities. For the purpose of this book, we will look at some of the open source
    tools in these areas. We will start with some open source tools for developing
    multimedia materials.


    # Multimedia Tools


    A multimedia teaching material consists of audio, video, text, and graphics. Multimedia
    based course materials can greatly improve the quality of teaching,


    Copyright © 2009, IGI Global, distributing in print or electronic formats without
