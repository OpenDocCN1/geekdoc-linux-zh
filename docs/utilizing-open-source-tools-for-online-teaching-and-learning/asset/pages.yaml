  md: 'Security Management 231


    +   - The security policy will define what to do. After a user logs on to the
    authorization of who should be allowed to do what. After online teaching/learning
    system, the user can only perform those activities that are allowed by the authorization
    regulations.


    +   - The security policy will recommend the protocols and encryption methods
    used to transmit data over the Internet.


    +   - The security policy should also include the procedures to prevent hackers
    from stealing or altering sensitive information.


    # Availability


    To sure that the information is available to qualified users, availability rules
    should be specified in the security policy. The following are some of the regulations
    commonly included in the security policy:


    +   - The security policy should specify the time frame that certain information
    should be available to the qualified users. For the online teaching/learning system,
    the course materials, assignments, and exams are available only in certain time
    periods.


    +   - The security policy can also specify where the information will be available
    to the qualified users. Some universities require students to take tests at specified
    locations where the tests are proctored.


    +   - The security policy may specify how to deliver the information to the qualified
    users. Web, e-mail, collaboration and multimedia tools are often used to deliver
    different types of information.


    Once the security policy is created, it will take a lot of effort to implement
    the security policy. The successful implementation of the policy largely depends
    on how well the users are educated and how well they follow the policy. A precise
    and concise security policy can greatly help the understanding. Not only the users
    and technical personnel should be educated, but also the university''s administrators.
    It is also required that the security policy be updated to meet the current requirements.
    Even though the security policy is developed with team effort, it may not be perfect.
    After the security policy is put into place, a procedure is needed to evaluate
    and monitor how the security policy is carried out. Also, as time changes, there
    will be updates to the security policy to meet new requirements.


