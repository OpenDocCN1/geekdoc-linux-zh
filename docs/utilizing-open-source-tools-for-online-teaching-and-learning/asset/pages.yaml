    # INTRODUCTION


    In the previous chapter, we discussed the topics related to networks to construct
    the infrastructure of an online teaching/learning system. A network consists of
    servers, clients, and network devices. In this chapter, we will investigate how
    the open source tools are used in the server development for the online teaching/learning
    system. Servers are computer systems used to host and manage the resources that
    can be accessed by users with proper permissions through the network. In the online
    teaching/learning system, servers are used to manage networks, databases, application
    software, security, and so on. To manage a large number of services needed by
    the online teaching/learning management system, a server is often run by an enterprise-level
    server operating system. Many of the open source operating systems, especially
    Linux, can handle the job. In this chapter, we will discuss computer systems and
    enterprise-level open source operating systems.


    This chapter starts with the introduction of server computer systems. We will
    discuss the server platforms and the technologies used to construct the servers.
    We will investigate the functionalities of the server components and the utilities
    of implementing these functionalities. Depending on the requirements, the server
    configuration can be quite different. Under this topic, we will discuss the strategies
    of selecting server equipment to meet various requirements by the online teaching/learning
    system.


    After the server platforms and the technologies are introduced, our next task
    is to examine server operating systems. We will discuss the open source server'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# 124 Chao


    operating systems in general first, and then our focus will be on the Linux operating
    system. Several major Linux distributions will be introduced and their features
    will be examined. We will investigate the services provided by the Linux operating
    system and how these services are used to support the online teaching/learning
    system. The configuration of the operating system also depends on the configuration
    of the server. We will discuss the issues related to the configuration of the
    operating system.


    Maintaining servers and keep them running in good condition are the major tasks
    of a computer service department. The server operating system management requires
    experience and responsibility. It is also very costly. Operating system management
    with open source tools is one of the solutions that can keep the cost down. In
    this chapter, we will look at various open source tools provided by the Linux
    operating system and the services provided by these tools. We will also discuss
    how to use these tools to solve operating system problems.


    Two examples will be used to demonstrate a server development process. In the
    example, we will discuss how to set up a Linux server and how to configure a Web
    server to support the online teaching/learning system.


    # BACKGROUND


    Server development and administration are the main tasks performed by the computer
    service department. Servers play a key role in today''s teaching/learning environment;
    they are used to manage student accounts, to host databases, to support learning
    management systems, to enforce security measures, and so on. In today''s education
    system, servers are widely deployed in various education institutions from local
    districts to global universities.


    Servers can be constructed on various platforms such as x86, IBM POWER, Sun SPARC,
    and Itanium 2. For a small or medium online teaching/learning system, x86 is a
    popular platform to construct servers. It takes relatively less effort to develop
    an x86 server due to the fact that the x86 server has a similar structure as that
    of a personal computer. The x86 platform supports most of the operating systems
    including the Linux operating system. The book by Buchanan and Wilson (2000) provides
    more detailed information about PC architecture.


    For large campuses, the support for an online teaching/learning system is often
    done by servers with various platforms such as POWER, SPARC, or Itanium 2. The
    POWER platform is developed by IBM and it supports the 64-bit computing environment.
    The enterprise version of Linux supports 64-bit computing which is a desired feature
    for the virtualization of processors, storage, and networks. The POWER platform
    fully supports the the open source 64-bit Linux operating system.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Server Development and Management 125


    For more information about IBM servers, readers can refer to the book by Vetter,
