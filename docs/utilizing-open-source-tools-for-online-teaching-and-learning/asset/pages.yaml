    64-bit Linux operating system. Readers can get more information about the 64-bit
    SPARC platform from the book by SPARC International (1994). The Itanium platform
    is jointly developed by Intel and HP. Itanium 2 supports Windows, Linux, and UNIX.
    As described above, the Linux operating system is supported by all major server
    platforms; this means that Linux is platform independent and can be used in any
    online teaching/learning environment.


    The Linux server operating system is the main focus in this chapter. As an open
    server operating system, Linux is a popular operating system for supporting teaching
    and learning. IBM has developed a Linux e-learning project (IBM, 2007). This project
    allows users to have experience with hands-on Linux labs on a remote Linux server
    and learn the Linux operating system. There are many books available to help set
    up Linux servers. The book by Hunt (2002) provides more information about Linux
    network servers. Configuring the Linux operating system may take longer time for
    someone who is new to the operating system, but many experienced professionals
    like Linux because they can have more freedom to configure the system they want
    (Hunt, 2002).


    Various open operating system management tools are used to assist the management
    of an online teaching/learning environment. Readers can find more detailed information
    in the book by Kavanagh (2004). From his book, readers can learn more about the
    tools for system administrators, network administrators, and IT project managers.


    The server related topics for teaching and learning have been discussed at conferences.
