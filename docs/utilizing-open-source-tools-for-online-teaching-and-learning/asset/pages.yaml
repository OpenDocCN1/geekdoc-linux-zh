  md: '# 140 Chao


    Once students are assigned accounts to an online teaching/learning system, they
    can start to upload their files to the system. Usually, there is a limit on how
    much space each student can get for his or her files. Otherwise, a student can
    easily take 100GB space if he or she uploads a lot of movies and MP3 music files.
    The following are some of the Linux tools used to set up the quota for each student.


    +   - quotacheck: It is used to check partitions with the quota keyword.

    - edquota: It is used to set up quotas and copy quotas.

    - repquota: It is used to generate quota reports.


    As mentioned in earlier chapters, to improve the reliability of an online teaching/learning
    system, we must perform system backup. If the system crashes, the backup will
    be used to recover the system so that the students'' data and course materials
    will not be lost. The tools used by Linux for data backup are:


    +   - tar: This tool is used to archive files. The archived files can be compressed
    to save storage space.

    - rsync: This tool can copy a directory and send it to a remote storage device
    through the network.

    - dd: It is used to copy and convert files at the byte level, which allows the
    copying of all the files on a partition including the device files.

    - crontab: It is a service to automate routine backup.


    For system recovery, the following tools may be helpful.


    +   - Linux Loader (LILO): LILO can be used to locate the Linux kernel, load the
    kernel into memory, and start the kernel.

    - Grand Unified Bootloader (GRUB): Like LILO, it can boot the Linux operating
    system. In addition, it can also boot multiple operating systems as various UNIX-based
    operating systems and Windows. It can work with a wide variety of hardware devices.

    - Installation CD: Often, by using an installation CD, the system can be booted
    from the rescue mode. From there, one can fix the problem or install the backup.


    In the above, we have discussed several system management tools and services provided
