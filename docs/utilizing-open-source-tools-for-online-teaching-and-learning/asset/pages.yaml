  md: '# 294 Chao


    +   * **HTTrack** (Kauler, 2008) allows the user to copy entire Site from the
    Web server to a local computer for offline processing. It tracks the Web site''s
    link structure and recursively copies all the images, HTML code, and directories.
    On the local computer, the user can browse the site from link to link and update
    the Web site. HTTrack is free software and it supports multiple operating systems
    such as Linux, Windows, and versions of UNIX.


    Among the above three third party Web authoring tools, Aptana has got a lot of
    recommendations from users. The users like the Aptana IDE and the fact that it
    is written in Java which allows the Java programmer to easily extend the functionalities.


    There are over a dozen sophisticated open source and free Web authoring tools.
    Most of them can meet the requirements for developing Web sites for an online
    teaching/learning system.


    # Open Source Collaboration Tools


    Online teaching/learning systems need collaboration tools to support group projects,
    interactive learning, and online tutoring services. Various Web-based collaboration
    tools can be used to meet the needs. Web conferencing is a commonly used collaboration
    tool. The development of this type of course often requires team work. An intelligent
    tutoring system is also a collaboration tool that promotes students and instructors
    to work together. A learning management system such as Moodle provides collaboration
    tools for online teaching and learning. The collaboration tools included in Moodle
    are forums, chats, blogs, Wiki, peer assessment, workshops, and so on. In addition
    to the collaboration tools included in a learning management system, there are
    also third party open source collaboration tools. The following are some of them:


    +   * Drupal: Drupal (2008) is a versatile and powerful open source Web collaboration
    and publishing tool. With Drupal, a group of users can publish and manage various
    contents on the Web site. Drupal is capable of delivering various types of Web
    2.0 based applications such as Wiki, forums, newsletters, picture galleries, social
    networking sites, peer-to-peer networking, core Web content management, community
    Web portals, e-commerce applications and single or multi-user blogs. Drupal also
    provides various functionalities such as collaborative authoring, podcasting,
    file uploading and downloading, and


