  pgno: 171
- img_proc: true
  md: '# Server Development and Management 147


    the destination, only the receiver''s private key can be used to decrypt the message.


    +   - OpenSSH can be used to configure public key encryption and generate a key
    pair.


    Operating system security management also includes the management of users, groups,
    ownership, and permission. Users and groups can be managed by editing several
    configuration files such as /etc/passwd, /etc/shadow, and /etc/group. The following
    are brief descriptions of these files:


    +   - /etc/passwd file contains the records, each of which consists of the user
    name, UID of the user, GID of the group that the user belongs, comments, the user''s
    home directory, and so on. Although the file name seems to be about passwords,
    the passwords are actually stored in the /etc/shadow file.

    - /etc/shadow file stores the encrypted passwords and the information of password
    expiration.

    - /etc/group file contains group information which includes each group ID, and
    the members of each group.


    Each file or directory in the Linux operating system can be accessed by the file
    or directory owner, the users from the same group, or the users from other groups.
    Permissions can be assigned to read, write, or execute. The tools used to manage
    permissions are:


    +   - chmod: It is used to add, remove, or modify permissions.

    - chown: This tool can be used to change the owner of a file or directory.

    - chgrp: This tool can be used to change group membership.


    Pluggable Authentication Modules (PAM) is an authentication tool for the communication
    between the user and application software. For an application to be accessed securely,
    the application using PAM will call PAM which will contact the configuration files
    and process the request by the application file. The processing result will then
    be returned to the calling application software.


    The Linux operating system often provides various security monitoring tools. For
    example, the following tools are used to monitor user login activities:


    +   - who: This tool is used to display the information such as who is currently
    on the system, the method used for login, and the time of the last login.

    - finger: It is used to display the information about users such as login names,
    full names, terminal types, and idle time.


