    # Personal Computers


    Originally, a personal computer was designed for individual use or for hosting
    client software in a client-server system. Personal computers may include desktop
    computers, notebook computers, tablet computers, workstations, Personal Digital
    Assistants (PDAs), and other hand-held devices. As technology advances, personal
    computers are no longer limited to personal use or as client computers. Some of
    the personal computers are powerful enough to host server operating systems. In
    fact, most of the Linux operating systems are hosted by personal computers. To
    make the discussion clearer, we use the term “personal computers” for those computers
    that host client software even though some personal computers are used to host
    server software. The following are some of the tasks that can be done by personal
    computers in an online teaching/learning system.


    +   * Personal computers are installed with client operating systems which can
    be used to manage user accounts created on individual computers and configure
    network devices.

    * Personal computers can also be used to host application software that can be
    used to get a specific computation task done.

