- img_proc: true
  md: '# Trends and Advances 335


    +   - Ipv6 can simplify network management. It allows peer-to-peer communication
    which eliminates the need for network configuration.


    +   - Mobile devices can greatly benefit from Ipv6 since it can assign each mobile
    device a static IP address and no network configuration is required.


    Overall, IPv6 is more efficient, easier to use, and more secure. It has better
    support for mobile and peer-to-peer computing. A future online teaching/learning
    system can certainly benefit from these features. Interested readers can get more
    information about IPv6 from IPv6''s Web site at http://www.ipv6.org.


    # TREND IN SERVER OPERATING SYSTEMS


    Like the improvement in the network and telecommunication technologies, server
    related technologies have also made impressive progress. One of the current trends
    is to add the virtualization technology to the server. Both the latest SUSE Linux
    Enterprise Server and Red Hat Enterprise have have provided virtualization technologies
    virtualization management tools. Linux kernel 2.6.20 has included the kernel-based
    virtual machine for the Linux operating system. To support mission critical applications,
    and more server operating systems include the cluster management suite to handle
    application failovers. A cluster system allows more students to simultaneously
    log on a server and to work on various tasks.


    Breakthroughs in hardware can also bring significant changes in the server technology.
    Computer hardware has been through many revolutionary changes, especially, in
    CPU related technologies. Multiple operating systems can run simultaneously on
    a single multi-core CPU chip. Intel''s (208) nanometer technology can dramatically
    increase the energy efficiency and performance of processors. A nanometer based
    CPU can make computation such as gaming and multitasking much faster while using
    less energy. More and more servers will move to use the 64-bit CPU and to host
    the 64-bit version of the server operating system to support virtualization, more
    memory, and 64-bit application software such as MySQL.


    # TRENDS IN DATABASE TECHNOLOGY


    The database technology will continue to improve in the coming years. To enhance
    a database''s scalability, extensibility, interoperability, and openness, the
    Extensible Markup Language (XML) has been adopted and upgraded by almost all major
    database-management software companies. Users are able to store and query XML
    data


    © 2009, IGI Global, distributing in print or electronic forms without written
    permission of IGI Global is prohibited.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '336 Chao


    in a Web-based database. With a newly developed database management system (DBMS),
    users are able to modify, insert, or delete content in a XML document. With this
    kind of DBMS, users can also convert XML data to and from other data formats.


    Many DBMSs support the improved data compression functionality for making database
    backup more efficient and saving more storage space. The data compression tools
    can also be used to compress historical data stored in a data warehouse.


    Parallel processing is one of the features supported by many DBMSs to improve
    database performance. More of the newly developed management tools can be used
    to assist the database administrator in managing parallel processing. More improved
    tools for handling business intelligence projects will also be widely supported
    by DBMSs.


    # TRENDS IN LEARNING MANAGEMENT SYSTEMS


    Learning Management Systems (LMSs) are one of the fastest changing components
    in an online teaching/learning system. Today''s LMSs are built to support globalized
    online teaching and learning. Through the Internet, students can access course
    materials available in multiple languages that are all supported by LMSs. Many
    of the LMS packages include more sophisticated collaboration tools and multimedia
    tools such as VoIP to enhance collaboration and develop multimedia course materials.
    More features will be added to support international collaboration.


    There will be better ways to personalize online teaching and learning. The future
    LMS will be more supportive of personalization which allows students to develop
    their own blogs and manage their course materials and class schedule. It will
    be easier for the LMS to integrate with operating systems, databases, and other
    application software. The LMS will provide a more sophisticated tutoring system
    and a more sophisticated learning progress monitoring and analyzing system.


    # TRENDS IN SECURITY MANAGEMENT


    Protecting an online teaching/learning system is the top priority. There will
    be more security measures to protect sensitive information, fend off viruses,
    and harden the network against hacker attacks. The many Linux operating system
    distributions can greatly improve security. A virtual machine can be created on
    a host computer system without leakage. Another way to prevent external attacks
    is to create internal enclaves for sensitive data and for data management systems.
    To control the access to computer resources such as ap


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Trends and Advances 337


    plication software or devices, the security model Dynamic Access Control is used
    to design controls for resource access based on users'' roles. A decoy server
    called a honeypot can be established to lure hackers. In such a way, we can catch
    hackers'' information and their behavior, which can help us stop their attacks.


    Each year, there will be some new viruses. The antivirus software will continue
    to add new components to deal with newly created viruses. To improve research
    on creating antivirus software, antivirus software companies will share virus
    information. Security will be strengthened on plug-and-play devices. Software
    will be developed to automatically perform some of the security tasks to reduce
    security administrators'' workload. Threat Correlation is this type of software.
    Once the information about a new virus is available, the software will correlate
    the threat information to the system''s vulnerability information previously gathered
    by the software and decide how to prevent the virus from attacking the system.
    Various security products such as the firewall, antivirus software, and spam filter
    can be built together to form a comprehensive unified threat management system.
    The unified threat management system can simplify security administration. With
    such a system, the security administrator needs to only deal with the security
    software which can update all the security measures concurrently.


    For data encryption, there are also some new features that have become popular
    in recent years. Context-based encryption is one of such features. It allows users
    to create any number of different security sessions for different applications
    and the security sessions can be configured to have different security levels.


    # TRENDS IN APPLICATION SOFTWARE


    Application software has a direct impact on the quality of online teaching and
    learning. Multimedia software, collaboration software, and other application software
    continue to be improved.


    Multimedia content includes various formats such as audio, video, animation, and
    so on. The latest version of the KDE desktop environment includes a cross-platform
    multimedia API called Phonon which allows users to access all multimedia frameworks
    through one API. Phonon is used to playback of most common multimedia formats
    and stream the media over a network. For instance, Phonon can process multiple
    audio sources as a single audio stream.


    Augmented reality is a virtual environment that simulated the real world. It has
    been used in various training workshops. However it is not widely used in online
    teaching and learning due to its cost and its requirement for high network throughput,
    it has some potential to be used in online teaching and learning once the cost
    and technical issues are resolved.


