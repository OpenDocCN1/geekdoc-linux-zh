    # Remote Administration


    An online teaching/learning system is a network-based system. It can even be a
    global system. This requires that network administrators to remotely manage any
    servers and computer systems on the university''s networks. The open source software
    Virtual Network Computing (VNC) can run on operating systems such as Linux, Windows,
    and Mac. This means that the network administrator can manage a server with the
    Windows operating system installed with the Linux operating system or vice versa.
    The same is true for the Mac operating system.


    VNC has been included by many Linux distributions. The tasks of server configuration
    include installing VNC, enabling remote administration, restarting the server,
    starting the remote access service. After the VNC server is enabled, the VNC technology
    is established on the client-server structure. The client can initialize a connection
    by entering the URL http://servername:5801. Based on the thin client concept,
    the VNC client can send a few requirements to the server. Once the client''s requirements
    are sent to the server, xnetd connects the client to the server. Based the client''s
    requirements, VNC allows the server to update the framebuffer which is a video
    output device. The framebuffer can be used to display a data set representing
    a window stored in the server''s memory. The server''s window can now be displayed
    on the client''s monitor. Then, the client uses the GUI tools or run commands
    on the server to perform the administration tasks. After the administration job
    is done, the VNC connection should be terminated for better performance and security.


    Network-based software installation is another remote administration task. It
    requires an installation server with adequate hard disk space to hold the installation
    image. The installation server should be able to communicate with clients through
