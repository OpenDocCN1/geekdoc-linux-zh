    systems and course materials. Ayala and Paredes (2003) demonstrated how a server
    was used to support a learner model that provided a personalized learning environment.
    Based on the learner''s demand, the server could provide different sets of course
    materials for the learner.


    The web server is one of the most important servers for supporting online teaching
