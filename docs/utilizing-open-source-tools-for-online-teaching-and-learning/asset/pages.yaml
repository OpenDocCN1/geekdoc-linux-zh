    Many of the server-side services provided by the Linux operating system are managed
    by the Extended Internet Daemon (xinetd). xinetd is a replacement of inet, xinetd
    starts the services based on the requirements from clients and removes the services
    out of memory after the services are terminated. The following are some of the
    tasks that can be accomplished by xinetd:


    +   * xinetd can control the access to network-based services based on the IP
    address of a remote host, the name of the remote host, the domain name, and the
    time of access. By doing so, it can prevent denial-of-access attacks.

    * It can stop a server or a service.

    * It can log information about system operations.

