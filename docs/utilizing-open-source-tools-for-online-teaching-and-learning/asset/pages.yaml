- img_proc: true
  md: '# Server Development and Management 139


    placed on separate hard disks. Therefore, we need to partition the hard disks.
    The Linux file system has two types of partitions, the primary partition which
    can be used to start the operating system and the extended partition which occupies
    the remaining hard drive storage and can be subdivided into several logical partitions.
    If multiple operating systems are installed on the server, each of them should
    be installed on a separate primary partition. Linux allows a maximum of four primary
    partitions to be created. There are three tasks in a partition process, creating
    a partition, editing and resizing the partition. The tools used for these three
    activities are:


    +   * fdisk: It is a utility used to format a hard disk and logically partition
    the hard disk for data storage.

    * Logical Volume Management (LVM): It can be used to create logical volumes. With
    LVM, you can resize and move volumes. By using LVM, you can create a volume and
    assign a meaningful name to the volume such as college, math, and so on. You can
    combine several partitions into a large logical volume. With LVM, several hard
    disks can be configured to form a RAID structure for better performance and reliability.


    After a partition is created, you can then create a file system on the partition.
    The utilities to create and check a file system:


    +   * mkfs: It can be used to create a file system with a format such as ext2,
    ext3, and MS-DOS. The default format is ext2.

    * reiserfs: This utility is used to create a Reiser file system.

    * mount or unmount: They are used to mount or detach the media on a disk or from
    a file system. The mount utility can mount the media on a remote computer and
    can mount the media to multiple locations.

    * fsck: It utility is used to check and repair various types of Linux file systems.
    By default, it checks and repairs all file systems listed in the /etc/fstab.


    System administrators prefer to configure file systems in the file /etc/fstab.
    They can edit files to add, remove, rename, reallocate, and customize a file system.
    To rescue a failed Linux operating system, the system administrator will need
    a boot disk or CD which contains the system information. Creating a boot disk
    should be done soon after the Linux operating system is installed. During the
    installation, you will be prompted to create a boot disk. Some distributions like
    SUSE also include the tool YaST to create boot disks for a more sophisticated
    system structure such as a RAID system.


