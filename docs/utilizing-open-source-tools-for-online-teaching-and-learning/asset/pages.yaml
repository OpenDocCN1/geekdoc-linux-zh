    # CONCLUSION


    In this chapter, we have discussed the issues related to the open source database
    management systems. Three typical open source database packages have been introduced.
    MySQL is one of most used open source database management systems, PostgreSQL
    and Berkeley DB is an open source embedded database. We then discussed database
    development. The first stage of database development is the design stage. For
    the three phases of the database design process, we discussed collecting database
    requirement information, developing a data model, and planning for the physical
