    * **1990**: The ARPANET became history.


    # UNIX


    The next significant development of open source software is the UNIX operating
    system (Hauben, 1994). In the 1960''s, AT&T''s Bell Labs, General Electric and
    the Massachusetts Institute of Technology (MIT) created a new operating system
    called Multiplexed Information and Computing Service (Multics). Later, when the
    development did not produce the result they expected, most of the party withdrew
    from the project. The remaining developers continued to work on it and renamed
    the operating system UNICS (or UNIX) instead of mollis. Eventually, UNIX became
    one of the dominant operating systems for mainframes and desktop computers in
    the 1970s and 1980s. Since then, many different versions of UNIX have been released.
    UNIX belonged to two different groups, one proprietary and the other was open
    source. The proprietary group was led by AT&T. In 1984, AT&T left the open source
    community and made UNIX a proprietary operating system for mainframes. Later,
    Micros Systems, HP, IBM, and Santa Cruz Operation (SCO) became significant members
    of this group. These companies treated their own versions of UNIX as proprietary
    products. As a result, the versions of UNIX from different companies are not compatible,
    which has caused a lot of confusion among customers. Since then, there has been
    less innovation. The other group was led by the developers of Berkeley Software
    Distribution (BSD). The developers at University of California, Berkeley have
    developed some open source UNIX operating systems such as FreeBSD which runs on
    x86 PCs, NetBSD which runs as a starting point for portability, and OpenBSD which
    runs as a highly secured operating system. The following is the timeline of UNIX
    history.'
