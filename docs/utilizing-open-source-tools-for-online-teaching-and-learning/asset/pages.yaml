    # ONLINE COURSE EVALUATION


    The last phase of the ADDIE model is evaluation. Once the new course materials
    are delivered and the new teaching and learning environment is in place. We will
    be looking forward to finding out if the students like what we developed, if what
    we made a difference in the online teaching and learning, if the students’ learning
    behavior has changed for the better due to our effort, and how we can make it
    even better. The evaluation process is used to answer these questions. The goal
    of evaluation is to assess the effectiveness and to identify the areas for improvement.
    Through evaluation, we can find out if the students have gained the knowledge
    and skills through the learning process and if the teaching and learning have
    benefited from the online teaching/learning system. The evaluation will provide
    guidance'
