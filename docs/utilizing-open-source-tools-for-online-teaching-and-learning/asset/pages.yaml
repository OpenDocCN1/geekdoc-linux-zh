  md: '# Design and Development of Online Course Materials 295


    many more. It is often viewed by its users as one of the best Web collaboration
    tools. Drupal includes over 20000 community-developed modules.


    +   **WordPress**: WordPress (2008) is a widely used open source blog publishing
    system. It is known for its easy to use WYSIWY blogging environment which supports
    various formats and styles of text. It is backed by MySQL for data storage. It
    helps users to get a quick start, WordPress provides templates for some common
    tasks. To extend the functionalities, WordPress allows plugins to be added to
    its system. It provides a permalink structure which is useful for a blog entry
    to be linked to, or cited from outside sources. WordPress is an excellent blog
    management tool. It can keep track of users who have visited the blog and can
    track a specific user''s IP address. It also provides an integrated link management
    utility. With WordPress, users can backtrack or pingback; this can keep track
    of who is linking to, or referring to the blog articles.


    +   **ICEore**:ICEore (2008) is an open source integrated collaboration environment.
    It allows a group of users to share knowledge, collaborate, and communicate. In
    this integrated collaboration environment, users, functions, tasks, and contents
    are integrated to form a team project. As an open source tool, ICEore allows users,
    technical support teams, and social network experts to work together to create
    new features for the software. With ICEore, users can host online discussions,
    chats, conduct polls, and schedule meetings. ICEore can also be used to manage
    the collaboration environment such as setting up teams, editing documents and
    files, sending quick messages, publishing through blogs, integrating with other
    applications such as MySQL and openSOURCE, scheduling meetings, and setting up
    networks among teams.


    As we can see from the above description, these collaboration tools are versatile
    and sophisticated. They can be used for advanced collaboration environments. If
    the collaboration tools provided by a learning management system are not adequate,
    we should consider using these open source collaboration tools. Among the open
    source collaboration tools, Drupal is the one that is easy to use. It also has
    excellent technical support through its Web site. For more sophisticated collaboration
    activities, ICEore is often recommended by users. It has also been mentioned by
    many users that WordPress is a good tool to create blogs.


    Now that we have discussed the open source tools for developing online course
    materials, let us practice how to create course materials with the tools in the
