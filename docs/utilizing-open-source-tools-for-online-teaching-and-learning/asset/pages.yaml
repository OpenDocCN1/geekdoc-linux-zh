    # MySQL


    To support e-learning and e-commerce over the Internet, universities and companies
    need databases to store data. In 1994, a Swedish consulting company called Tcx
    was trying to use the in-house database management system UNIREG to manage databases.
    Since UNIREG was not designed for Web related tasks, it generated a lot of overhead
    which was not good for handling dynamic applications as Web pages. So, Tcx created
    MySQL with a client-server system that includes a multithreaded database engine.
    This kind of database engine allows multiple processes simultaneously without
    costing much computation power. In addition to the database engine, MySQL includes
    user management tools, database servers to host databases, database backup and
    recovery tools, data presentation tools, and it supports a wide range of programming
    languages (Safari, 2007). MySQL is licensed under the GNU General Public License.
    This makes MySQL open source software. Anyone can download the MySQL source code
    and use it for her needs. MySQL API is designed to view that the third party’s
    code can easily be used with MySQL. In addition, the MySQL database management
    system is also fast, reliable, and easy to use. These features make MySQL suitable
    for supporting Web-based applications. After years of development, MySQL is the
    most popular open source database management system, which allows the user to
    add, access, and analyze the data stored in its database. The timeline of MySQL
    is shown below.


    +   - 1979: UNIREG was developed for in-house database management.

    - 1995: MySQL was developed for Web related database management tasks.

    - 1998: The Windows version of MySQL was released.

    - 2003: MySQL version 4.0 was released.

    - 2005: MySQL version 5.0 was released.


    Currently, MySQL 6 is being developed. The first alpha version of MySQL 6 was
