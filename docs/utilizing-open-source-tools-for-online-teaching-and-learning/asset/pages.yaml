    # Security Assessment Tools


    To detect security holes, various tools are available to scan networks and operating
    systems. The following are tasks that can be done by various scanners:


    +   * Port scanner: As the name indicates, a port scanner can be used to check
    if there are any open ports. If the port scanner finds any currently open ports,
    it writes a detailed report about the open ports. There are several open source
    port scanners available for free download, Nmap (2007) is one of such open source
    port scanners. It is a ping scanning tool. It can determine which computer is
    currently running on the network and perform decoy port scanning.


    +   * Web scanner: A Web scanner can be used to test the configuration of a Web
    server. It can test security vulnerabilities by remotely logging in and searching
    for scripts with known vulnerabilities. It can also perform brute force account
    testing if there is an account with a default password or an account with an easy-to-guess
    password. Nikto (2007) is one of such open source Web scanners. Nikto can scan
    multiple Web components. Nikto can test against Web servers and identify dangerous
    files and CGIs. It can also be set to automatically update vulnerability information
    to keep the scanner updated.


    +   * Virus scanner: A virus scanner can be used to scan files to check if a file
    is potentially a virus. Once the virus scanner detects a file that is likely to
