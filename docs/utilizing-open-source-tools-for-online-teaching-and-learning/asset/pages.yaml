    is created, the student role will be added to the student portfolio. Should anything
    need to be changed, the LMS administrator only needs to change the settings in
    the role once. Similarly, the LMS administrator can create an instructor role
    for instructors.


    # Managing Collaboration Service


    Collaboration tools are used for group activities, tutoring, online discussion,
    and posting information. Open LMS provides several collaboration tools such as
    forums, chats, or Wiki.


    A forum is an asynchronous collaboration tool, which means that students who participate
    in a forum do not have to log on to the LMS at the same time. With a forum, students
    can participate in a discussion through the Internet. Some of the open source
    LMSs also allow students to subscribe to the content of a forum. The content of
    the forum will be e-mailed to the subscribers regularly. Usually, a forum can
    be configured in one of the following options:


    +   Single discussion mode: This forum option allows one and only one discussion
    in the forum. With this option, all the students participate in the same discussion.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '+   Individual post mode: This forum mode allows each individual student to
    create one discussion. With this option, each student can post his or her own
    statement or question which accepts multiple responses.


    +   Multiple discussion mode: This option allows multiple discussions to be created
    and each discussion can have multiple students participating in it. It also allows
    each student to create one or more discussions.


    Usually, students participating in a forum can have three different types of permissions.
    The following describes these three permission types:


    +   Students are only permitted to read the discussions and replies by others;
    they cannot post their own discussions and replies.


    +   Students are permitted to reply to the discussions posted by others, but they
    are not permitted to post their own discussions.


    +   Students are permitted to post discussions and can reply to the discussions
    by others.


    Instructors should be able to set these permission types for students in a class
    based on the teaching requirements. There are other forum configurations that
    can be done to meet the teaching requirements. The following are some of them:


    +   A forum can be configured so that a discussion posted by a student can be
    rated by other students and the instructor. Further, it can be configured on how
    the discussion can be rated and who can rate the discussion. A forum can be configured
    to only allow the instructor to rate the post. If a forum is configured to allow
    both the instructor and the students to rate the post, the rating by the other
    students and the instructor can be used to grade the post. The instructor who
    does the configuration can decide if the rating should be stored in the grade
    book. The instructor can also decide which time period the other students can
    rate the post.


    +   The person who can decide if the students and the instructor who participate
    in a forum can upload attachments. If so, how many attachments and the maximum
    size of each attachment are allowed to be uploaded to the forum. The decision
    will be based on how much storage space is available on the hard disk.


    +   A forum can be configured so that it can be viewed in many different ways.
    It can be configured to allow all the students and the instructor to view their
    own posts as well as those by others. It can also be configured to allow students
    to post their own discussions and view the rating from the instructor but not
    the ratings or replies by the other students.'
