  merge: -1
  pgno: 310
- img_proc: true
  md: 'about the requirements for this type of course materials. It is also important
    to collect information about the students’ learning behavior and the instructors’
    teaching behavior. At this stage, one or a team of project developers will conduct
    interviews with the potential users such as the students and instructors, administrators,
    and the technical support team to find out:


    +   - What types of courses need to be online? Are there any courses that may
    require multimedia and collaboration course materials? Are there any courses that
    require hands-on practice over the Internet?

    - What are the students’ and faculty members’ knowledge levels for handling the
    online courses.

    - What are the required resources and computer skills for developing the infrastructure
    to deliver the online course materials?

    - What are the necessary computer skills for the students to access the course
    content through the Internet and to collaborate with the instructors and other
    students?

    - What are the required technology skills for the instructors to create the materials
    for online teaching and to manage the online classes?

    - Approximately, how many students will simultaneously access the online course
    materials?

    - Do the online course materials need to share the computing resources with other
    online materials?

    - What security measures should be enforced to protect the online course materials
    and the infrastructure for delivering the course materials?

    - What are the limitations for the students to use the online course materials?


    # ## Exploration of Solutions


    Based on the results of the interviews, the team of developers can set up the
    objectives for the development of the online course materials. After properly
    defining the project objectives, the team need to collect information about possible
    solutions for developing and delivering such online course materials. The following
    information may be useful:


    +   - There are options on Internet connection. Based on the types of course materials,
    there may be a need for the high speed Internet connection.

    - Remote access technologies will be chosen. Certain remote access technologies
    may be required by the online course materials.

    - Hardware and software may be needed to enforce security measures such as various
    types of firewalls and antivirus software.


