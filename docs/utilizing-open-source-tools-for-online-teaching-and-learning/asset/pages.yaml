    It can support over 512 processors running simultaneously and over 60 terabytes
    of memory. Many large projects are implemented with the Itanium 2 platform. Unlike
    POWER and SPARC, Itanium 2 is mainly developed for large projects. Even though
    the Itanium 2 platform is able to run 32-bit application software, it is much
