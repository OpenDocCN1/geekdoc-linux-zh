    The implementation of the balanced scorecard is not a simple task due to the fact
    that there is not a standard step-by-step approach, for a project in education.
    In general, the first thing to do in the implementation process is to get people
    involved in a project, they get ready for change, and clarify the vision of the
    project. Then, the vision needs to be converted to operational goals which are
    used as performance indicators. With the performance indicators, the evaluator
    should design matrices including what should be measured and the criteria of success,
    and associate each goal with financial resources. The last task for the implementation
    process is to get feedback and adjusting the strategies accordingly.


    As one of the key components of the ADDIE model, a well developed evaluation process
    can tell us if the project we developed has the end result we intended and if
    the time was well spent on developing such project.


    Evaluation can tell us if students really gain the knowledge and skills due to
