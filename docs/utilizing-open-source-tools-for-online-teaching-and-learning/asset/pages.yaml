    required by an online teaching/learning system. Running multiple servers on many
    stand-alone computer systems will take more effort to manage these systems. To
    manage the servers more efficiently, each computer system can be built in a small
    case and plugged into a rack frame. Servers and other devices are interconnected.
    A rack system takes less space and electricity. It has better performance and
    is more secure. Often a rack system is used with stand-alone servers. It takes
    care of the main workload and the stand-alone servers take care of specific work
    such as printing service.

    * Blade system: An entire computer system can be built on a single board and inserted
    into a blade enclosure. A blade system is the ultimate solution for the requirements
    of high scalable performance and capacity. The blade system takes much smaller
    space than the rack system. It needs fewer network cables and less electricity.
