    system. It discusses open operating systems. Again, the Linux desktop operating
    system is the main focus in this chapter. Some open source tools for the Linux
    desktop operating system management are also discussed. This chapter examines
    the Linux desktop operating system, desktop environment, and desktop management
    tools. The last topic to be discussed in this chapter is about open source remote
    access tools. The issues related to the configuration of the remote access tools
    are investigated and an example is given.


    **Section III: Course Material Development for Online Courses.** This section
    covers the issues related to developing course materials with open source products.
    Two chapters, Chapter X and Chapter XI, are included in this section.


    Starting from Chapter X, the focus will be on the subjects related to course material
    development. Since technology-based courses and Web-based teaching all rely on
    technology, there is no doubt that the instructional technology and practice will
    greatly influence the teaching and learning. The theories of instructional design
    and instruction technology will be used to guide the development process. Due
    to the fact that application of instructional design theory in developing course
    content has been well studied by many researchers, the chapter will focus more
    on the technology side of the discussion. It will examine some open source Web
    author, multimedia, and collaboration tools. Then, it will give a comprehensive
    example to illustrate how to use the open source tools to develop course materials
    to meet the objectives of the instructional design.


    Chapter XI deals with the issues of implementation and evaluation. After online
    course materials are developed, the next task is to deploy the course materials.
    Issues related to the online teaching material deployment is discussed. A successful
    online teaching/learning system also needs a group of experienced computer service
    personnel who manage the course sites and the students who are taking the online
    courses. This chapter also discusses support and training. The development of
    online course materials takes a lot of effort. The course materials may not be
    created perfectly at the first time. The improvement of the course materials will
    depend on the feedback from the users, in our case, the students and instructors.
    The feedback can be used as a guideline for future improvement. The development
    of online teaching materials is a cycle of designing, implementation, testing,
    and evaluation. The last topic in Chapter XI is related to the evaluation of courses
    and course materials.


