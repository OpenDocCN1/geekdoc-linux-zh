    service ldap start

    ```


    After the LDAP server is installed and configured, you can then populate the directory.
    One way to insert data into the directory is to move user accounts from an existing
    system to the directory. You may find some tools in the folder /usr/share/openldap/migration
    to help you get the job done. In the folder, edit the file migrate_common to set
    the parameters $DEFAULT_MAIL_DOMAIN and $DEFAULT_BASE to match the domain for
    the online teaching/learning system. The user account information is stored in
    the files base.pl, passwd.pl, and group pl. You can use the migration tool ./migrate
    to move the data from a .pl file to a .ldif which is the file that can be used
    by the LDAP server by running the following command:


    ```

    ./migrate_filename.pl > filename.ldif

    ```


    To add the content of the .ldif file to the directory, use the command:


    ```

    ldapadd -D "cn=Manager,dc=wtu,dc=edu" -x -W -f filename.ldif

    ```


    where dc=wtu,dc=edu matches the domain for the online teaching/learning system.
    Additionally, you can move the data of other types of LDAP objects such as OU
    to the directory.


    To view and manage the data entries stored in the LDAP server, you may download
    GUI tools to help you accomplish these tasks. There are several open source LDAP
    editing tools available such as:'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Network Development and Management 119


    +   - gq: A GUI tool for viewing and editing the LDAP server. It can be downloaded
    from the Web site http://biot.com/gql/

    - LDAP Browser/Editor: A Java based GUI tool for editing the LDAP server. It requires
    the Java JDK software and can be downloaded from the Web site http://www-unix.mcs.ansl/~gawor/ldap/


    The two LDAP server editing tools are good enough for most of the configuration
    tasks. After one of the above LDAP server editing tools is installed, you will
    be able to view the data entries transferred to the directory.


    The above procedures show you how to set up the LDAP server. Similarly, you can
    configure the LDAP client so that the client can communicate with the server.
    Suppose that the operating system installed on a client computer system is Linux.
    On the client computer, edit the file /etc/ldap.conf to add the server''s IP address
    and the domain name, and then enable the server scope sub. Save the configuration,
    and the client is ready.


    Sometimes, the GUI tool for configuring the LDAP client can be used to access
    the data stored on the server. With the GUI tool, the user can specify the server
    name and IP address. Save the configuration and restart the GUI tool, the user
    will be able to view the data entries stored on the LDAP server with proper permission.
    The GUI tool included in the Linux operating system can also be used to enable
    LDAP authentication on the client computer system. Then, the user can log on to
    the computer with the centralized LDAP authentication.


    Each semester, there will be new students enrolled in the university. These students''
    accounts should be added to the directory so that they can log on to the online
    teaching/learning system. One way to do this is to add the new users to the system
    with Linux command `useradd` and then move the data to the .idf file and add the
    content of the file to the LDAP directory. GUI tools such as LDAP Browser/Editor
    can also be used to add data entries.


    After the client and server are configured, the next task is to enforce some security
    measures.


    The LDAP protocol carries the plain text data during the communication. It is
    possible for someone to capture the data content during the transmission. To fix
    the problem, the network administrator needs to enable SSL and create a certificate
    on the server. This can be done by configuring the file /etc/openldap/ldap.conf
    on the server to enable SSL. If the SSL package is not included in the LDAP server,
    you may need to download an open source SSL program and install it.


    At this point, we have completed the process of setting up a centralized directory
    service for the online teaching/learning system. Students can log on to the computers
    that are linked to the university network. They can also access the computers
