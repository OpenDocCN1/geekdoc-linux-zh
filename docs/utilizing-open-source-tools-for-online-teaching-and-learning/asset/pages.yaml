    secure remote command executions, and secure file transfer. Various implementations
    of SSH have been developed; some of them are proprietary and the others are open
    source. Among these implementations of SSH, the most popular one is the open source
    SSH protocol OpenSSH. OpenSSH has been included in a large number of the operating
    systems such as Linux, Windows, and different versions of UNIX.


    In most cases, multiple protocols work together to get a certain task done. The
    related protocols are grouped together to form a protocol stack. Open System Interconnection
    (OSI) is a network communication model that divides the protocols and services
    into seven layers. Each layer represents a protocol stack and performs a special
    function in network communication. Each computer involved in network communication
    is equipped with these layers that combine various network protocols and services
    provided by the operating systems and application software.'
