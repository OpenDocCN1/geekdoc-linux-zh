  md: 'at this stage is to make the course materials available for teaching whenever
    and they are needed. We will discuss the issues related to service and support
    on content delivery, technical support management, resource management, training
    management, workload management, and security management. The topic Online Teaching/Learning
    System Implementation will discuss the issues related to system deployment. The
