    was developed to support a data-driven online instructional design analytics system.
    Atkinson, Cummins, Phillips, and Pospisil (1999) investigated server software
    for teaching online courses. They discussed the requirements for a server to support
    online courses. They demonstrated how servers were used to support online learning
    management by enabling teaching functions such as presentation of content, discussion
    groups, class management and related services.


