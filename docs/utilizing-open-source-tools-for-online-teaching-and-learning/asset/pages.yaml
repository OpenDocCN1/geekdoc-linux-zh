    The topics of trends and advances discussed in previous chapters will be summarized
    in this chapter. We will also look at new features and new ideas in the application
    of the open source products that will potentially have an impact on the online
    teaching/learning systems.


    The discussion will start with the advances in the network related open source
    tools. As more and more university courses are taught online, there is an increasing
    demand for faster and more reliable network technologies. A lot of effort has
    been made to improve network hardware and telecommunication related technologies.
    In this chapter, we will examine some of the new network and telecommunication
    related technologies and how these new technologies will impact online teaching
    and learning.


    Then, we will look at the advances in server operating systems and services. We
    will investigate the trends in server software, hardware, and services. We will
    discuss the new and emerging technologies that can potentially improve servers''
    performance and reliability.


    As more and more course materials are made available online, there will be a higher
    demand for databases to hold and manage the ever increasing data generated by
    various online courses. We will discuss the advances in database management systems
    and Web-based databases.


    Learning management systems (LMSs) are rapidly changing. A lot of advances have
    been made in the LMSs, and many new LMS features are developed to enhance'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# 332 Chao


    the performance and functionality of the LMSs. In this chapter, we will examine
    some of the new features and technologies.


    The next topic to be discussed in this chapter is about the advances of related
    technologies. This chapter will provide some information about the trends in antivirus
    tools. We will also explore some new development in virtualization, access control,
    and data encryption.


    The area of multimedia software, collaboration software, and other desktop application
    software is the most improved area. Especially, the open source multimedia and
    collaboration tools have been made much easier to use. This chapter will introduce
    some of the advances in this area, and we will take a closer look at some new
    features of the multimedia software, collaboration software, and other desktop
    application software.


    The last topic in this chapter is about the trends in instructional technology.
    The advances in the theory and practice of instructional technology will be discussed.
    Online teaching/learning systems are getting more sophisticated and flexible.
    We will look into some of the new development in various future learning structures
    that have been proposed.


    The rapid progress of technologies and ideas for online teaching and learning
    has made a tremendous difference in higher education. As the progress continues,
    we can expect education institutions to keep on improving their online teaching.
    This chapter will talk about how students and instructors will benefit from the
    progress and improvement.


    # BACKGROUND


    Using open source products in e-learning is one of the trends in the area of e-learning
    technology. The open source products such as Web 2.0, Linux, Moodle, Apache, MySQL,
    and PHP are gaining popularity among higher education institutions. Many factors
    are contributing to this movement. Online teaching/learning systems are one of
    the major costs of universities'' operations. By using the open source products,
    universities can significantly reduce their spending on the online teaching/learning
    systems. The usability of the open source products has been improved significantly.
    The Firefox Web browser is an example. Open source product companies are also
    making more effort on marketing and on support for their products.


    The open source approach will continue to be a main way of inventing new technologies.
    MacManus (2007) picked the open source movement as the most promising for the
    Web in 2008. He predicted that Web browsers, social networks, mobile Web, open
    data, ad networks, and microformats would significantly influence Web-based computing.
    Torkington (2007) has summarized some trends


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Trends and Advances 333


    in the open source approach. One is to strengthen the effort to convince users
    to adopt the open source products by improving the usability, marketing, and support.
    The second one is to adopt the business models which embrace the open source strengths.
    Another trend is to resolve the scaling and platform challenges for Web 2.0. Also,
    there is a trend to extend open source to the territory of proprietary software,
    hardware, and data.


    Due to the fact that the infrastructure of an online teaching/learning system
    is based on the Internet technology, innovation in the Internet technology will
    have a great impact on the way of online teaching and learning. The open source
    Web 2.0 (O''Reilly, 2005) is such a technology that carries the new e-learning
    platform called E-learning 2.0. (Dounes, 2008) which will make the student more
    of the course content producer than the consumer consumer.


    As online teaching/learning systems are widely accepted by universities, globalization
    is another trend in e-learning. Enders and Fulton (2002) collected over a dozen
    research articles on globalization. The researchers discussed the impact of globalization
    on higher education. They also discussed the changes and challenges that are faced
    by students, faculty, and the labor market. Aoki (2004) discussed globalization
    related issues, and the difficulties and opportunities of international collaboration.
    Paulsen (2005) predicted that globalization and large-scale operation are the
    trends for online education. On the other hand, do-it-yourself learning (Jarche,
    2007) has become a trend in recent years. Do-it-yourself learning encourages learners
    to decide the subjects they want to learn and search for the information through
    Google, Wikipedia, and YouTube.


    According to Roper (2004), using the semantic Web provides a distributed, self-organized
    and directed-life learning format. With the semantic Web, students and instructors
    can create and work together in a flexible online teaching and learning environment.
    Camacho and R-Moreno (2007) proposed a metadata-based model which can automatically
    modify the learning design to improve learning and allow users to incorporate
    the course content with new semantic information.


    # TRENDS IN NETWORK AND TELECOMMUNICATION


    The improvement of network technologies often results in a significant change
    in online teaching and learning. The following improvements in the wireless network
    and network protocols have the potential to take the online learning and teaching
    to a new level.


    There are several next generation wireless broadband technologies such as WiMAX,
    Long Term Evolution (LTE), and Ultra Mobile Broadband (UMB) that are


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 334 Chao


    already or about to be released. These technologies can significantly improve
    the wireless transmission rate, area coverage, and quality. The following describes
    some of these technologies which can help online teaching/learning systems to
    reach more students and improve the quality of online teaching and learning:


    +   * WiMAX: WiMAX is a wireless broadband technology that can cover an area as
    large as 50km radius. The proposed transmission rate is 75 Mbps for downloading
    and 25 Mbps for uploading. Practically, depending on how far away the transmission
    center and how many users are in the same sector, the WiMAX data transmission
    rate can be lower. The WiMAX technology is in its initial deployment stage. Its
    mass production is expected to be in 2009.

    * LTE: LTE is a next generation broadband technology. It can reach users over
    a 100km away and has the proposed download rate of 100Mbps and upload rate of
    50Mbps. Practically, it may not get fast depending on the distance. LTE is still
    at the early stage of development. It is expected to be at the mass production
    by the year 2011.

    * UMB: UMB is the technology that will be ready in 2009. The Internet (TCP/IP)
    network technology based UMB will run on the next generation radio system. It
    has a 17-29Mbps download rate and 10-79Mbps upload rate. The coverage range can
    reach 50km.


    In addition to the three mentioned above, there are many other wireless broadband
    technologies. These technologies can significantly improve online teaching/learning
    systems'' mobility, capability, and performance on running Voice over Internet
    Protocol (VoIP) and real time application tasks.


    The newly developed network protocols can also have a great impact on network
    technologies. The next generation Internet protocol version 6 (IPv6) is about
    to replace the current version IPv4. The current IPv4 uses a 32-bit binary number
    for the IP address. In theory, IPv4 can assign 4 billion IP addresses. IPv4 is
    about to run out of all its available IP addresses due to the rapid growth of
    Internet and mobile devices. Also, in IPv4, 95% of IP addresses are not efficiently
    used. IPv6 will resolve these problems and provide many other features as described:


    +   * IPv6 uses 128-bit IP addresses; this is enough to meet all the IP addresses
    demands for many years to come.

    * With IPv6, a high-quality path can be established between two hosts to transmit
    audio and video data.

    * IPv6 is more secure by including the end-to-end security measures which are
    current the add-ons to secure IPv4.


    Copyright © 2009, IGI Global, distributing in print or electronic formats without
