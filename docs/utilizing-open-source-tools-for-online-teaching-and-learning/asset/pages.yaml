    # Server Visualization Technologies


    Since 2007, the support of virtualization technologies, such as Xen, has been
    added to the released Linux kernel. With the virtualization technologies, the
    functions of hardware and software can be simulated by the software called a virtual
    machine. The advantages of the virtualization technologies are listed below:


    +   - Lower the cost for hardware by sharing the hardware with its host computer.

    - Increase security and reliability. Students can perform their administrative
    tasks on virtual machines.

    - Improve portability and flexibility. With virtual machines, multiple operating
    systems can run simultaneously on the same host.

    - Simplify lab preparation and maintenance. The lab manager does not have to reinstall
    the operating system and application software semester after semester.


    There are also some disadvantages of using virtual machines. A virtual machine
    runs slower than its host computer. When a server hosts multiple virtual machines,
    there must be enough RAM installed on the server. For example, suppose that a
    host server requires 1GB RAM and each of its five virtual machines requires 512MB
    RAM. To run the server and the five virtual machines simultaneously, at least
    4GB RAM should be installed on the host server. Despite the disadvantages, virtual
    machines are great for lab activities. There are also some third party machine
    products such as VMware.


