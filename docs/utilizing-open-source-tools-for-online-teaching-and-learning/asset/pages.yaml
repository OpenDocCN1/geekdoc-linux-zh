    systems will be compared. We will examine how these features are used to store
    the course and student information and to support the management of the online
    teaching/learning system.


    The next topic in this chapter is about database design for an online teaching/learning
    system. Within this topic, we will first review the database development cycle.
    Then, we will go through some general database procedures which consist of three
    stages, conceptual design, logical design, and physical design. We will discuss
    issues such as collecting information about the requirements for the new database,
    design a data model to meet the requirements, and discuss issues related to physical
    design.


    After the discussion of database design, we will look at the development and implementation
