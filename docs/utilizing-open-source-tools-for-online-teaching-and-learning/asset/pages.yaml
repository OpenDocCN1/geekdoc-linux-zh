    The last stage of the online teaching/learning system development process is the
    evaluation stage, which will verify if the system meets the requirements. The
    evaluation result can be used as a guideline for further improvement. As a complex
    and comprehensive project, the newly implemented online/learning system is far
    from perfect. Users'' feedback is the key for improving the system. This chapter
    will also discuss the issues of creating a well designed evaluation plan to get
    feedback from the users as the students and instructors. The discussion of these
    issues will be covered under the topic Online Teaching/Learning System Evaluation.


    # BACKGROUND


    In the early days of e-learning, online teaching/learning systems focused on a
    single subject or an individual course. After years of development, today''s online
    teaching/learning systems can handle the teaching and learning requirements of
    a globalized university. They can support courses offered on multiple campuses
    located at many locations of the world. They can manage teaching and learning
    of different cultures and in different languages. Such an online teaching/learning
    system can be as complicated as an e-commerce system for a multi-national cooperation.
    A systemic approach to creating an e-commerce system can be guided by the information
    technology solution development theory. A solution development process contains
    five major stages: Analyzing business requirements and identifying the process
    and infrastructure related to the requirements, designing and validating a solution
    to meet the requirements, constructing the solution, deploying and managing the
    solution, and evaluating the solution. A solution development process consists
    of two components, software development and infrastructure deployment. Solution
    development processes can be applied to various projects such as modeling a health
    system (Chong, Clark, Morris, & Welsh, 2005) and designing a grid computing system
    (Meliketian, et al., 2004).


    An online/learning system development process can be considered a special case
    of a general solution development process. Similar to the information technology
    solution development, instructional technology is about the theory


