  md: 'The technical support from the vendors, product communities, consulting companies,
    and computer service department.


    The backward compatibility of the products.


    The market share and trend of the products to be selected.


    After the pros and cons are considered, the project developers can decide on the
    best solution for developing and delivering the online course materials. At this
    step, the developers need to verify if the selected solution will meet the project
    objectives.


    # Project Development


    Once the solution is selected, the next task is to develop the project. The first
    step of the development process is to carefully plan the project. Most projects
    involve issues related to budget, technical support, purchasing, project timeline,
    and team organization. A well planned project will lead to successful implementation
    of the project. In the plan, the development team should make sure that the budget
    for the project is allocated, the required software and hardware for the project
    are available on the market, and the project has gained full support from the
    administrators. The project plan should draft a timeline to keep track of the
    progress of the development process.


    Before starting to implement a sophisticated project, it is always a good idea
    to create a model which includes all the technologies and activities involved
    in the project. The model can be considered the blueprint of the project. There
    are various model development tools such as Unified Modeling Language (UML) that
    are available to help create a flow chart and icons to represent the underlying
    project. With the model, the developers can verify if the goals and objectives
    of the project can be achieved. It is much easier to make changes in the model
    than make changes in the actual project. The instructional design theory often
    plays an important role for constructing the model and verifying the achievement
    of the goals and objectives. Usually, it may take several modifications for the
    project to fulfill its design goals and objectives. Both the technical personnel
    and instructors should be satisfied with the new project before it can be physically
    implemented.


    During the implementation process, the project model will be converted to the
    physical project. The development team members will work together to implement
    the project by following the project''s timeline. The instructors and the online
    teaching staff will create the course materials that are suitable to be placed
    on the Web sites. The technicians will make sure that the remote access service
    and the network are working properly. The programmers or the application developers
    will create user interfaces for the project. The application software administrators


