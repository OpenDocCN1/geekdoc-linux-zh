    # Security Management


    Security related issues are always the top concern of the computer service department.
    Once an online teaching/learning system is infected by viruses, the viruses can
    damage files, jam memory, occupy hard disk space, or even take control the CPU.
    If the online teaching/learning system is not properly protected, hackers may
    change the settings, delete system files, or simply crash the system. The following
    are some common tasks performed by the security management team for routine system
    management.


    +   * Check if there is any virus infection and if there are any service packs
    and patches for downloading.

    * Test the system''s vulnerabilities and identify potential problems.

    * Download and install security patches.

    * Configure and update security measures.

    * Check the system''s firewalls, monitoring, auditing, and logging services.

    * Solve and report any security problem, provide measures to block security holes,
