  md: '# OPEN SOURCE NETWORK MANAGEMENT TOOLS


    In the above, we have briefly discussed the functionalities of some commonly used
    network devices and open source network protocols. During the development of a
    network and after a network is implemented, a team from the computer service department
    need to manage the network. Some of the network management tasks are carried out
    with network management tools. There are some open source software packages that
    can be used for network troubleshooting, analyzing, and monitoring. The following
    are some of the tasks that can be done by the open source network management tools.


    +   * Network monitoring: This type of tool is used to monitor network traffic.
    From collected information, network administrators will be able to identify possible
    network problems.

    * Network troubleshooting: Network management tools can be used to help a network
    administrator to troubleshoot network problems. These tools can analyze the collected
    information and provide guidelines for fixing the network problems.

    * Network security: The network security management tools can be used to detect
    network security vulnerabilities and enforce security measures. These tools also
    handle tasks such as detecting hacker intrusion, configuring firewall properties,
    downloading and installing anti-virus upgrades and patches, and so on.

    * Remote access: Some of the network management tools are used to manage remote
    access. These tools can help network administrators to control who are allowed
    to remotely access the network resources and what network resources can be accessed
    by a user.

    * Management reporting: One of the network management tasks is to write reports
    about network faults, analyses of observation data, and changes that have been
    made to fix problems. Some of the network management tools can help network administrators
    to create network management reports.


    Linux, as an open source operating system, includes many of the open source network
    management tools. There are also stand-alone open source network management tools
    with a service package which includes charges for technical support and maintenance
    contract. With such a package, the open source network management tools are not
    really free. However, it is still cheaper than most of the commercial network
    management tools. In general, open source network management tools provide an
    inexpensive, easy to use, and flexible option for managing the online teaching/'
