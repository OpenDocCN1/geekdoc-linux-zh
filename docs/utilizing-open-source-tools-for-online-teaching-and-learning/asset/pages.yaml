    # Linux


    Another milestone in the development of open source software is the invention
    of Linux. In 1991, Linus Torvalds, a computer science student, was trying to develop
    an open source operating system kernel which contained device drivers for controlling
    hardware and a multi-threaded file system for his new PC with 80386 processor.
    At that time, there were some other open source software such as GCC - a multiple
    language compiler, GDB - a debugger, and GNU - a text editor, and so forth. By
    combining the available open source software, Linux released the first pre-release
    version of Linux in 1992. In 1994, Version 1 of Linux was released. Licensed under
    the GNC General Public License, Linux is guaranteed to be free to the general
    public. Immediately, this new open source operating system attracted a lot of
    attention from programmers. A year later, thousands of contributions from individuals
    around the globe were added to the new operating system (Wrenius, 2003). With
    these contributions, the size of the Linux operating system grows over 40MB. If
    the GUI tools and many other utilities are added, a Linux package can carry gigabytes
    hard drive space. The timeline of the development of Linux is listed below.


