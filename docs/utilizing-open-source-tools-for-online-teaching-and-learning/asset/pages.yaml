  md: '# Chapter VIII


    # Security Management


    # INTRODUCTION


    During the operation of an online teaching/learning system, security is a top
    priority. As an online system, the teaching/learning system is vulnerable to Internet
    hackers and hundreds of malicious viruses. A security related problem can can
    cause significant damage to the university''s security. This kind of damage can
    possibly shut down the entire system or even spread viruses to the university''s
    network and infect other systems on the network. To ensure the health of the online
    teaching/learning system, great effort has to be made to ensure the system''s
    security. In this chapter, we will investigate issues on securing the online teaching/learning
    system.


    The first topic to be discussed in this chapter is the possible vulnerabilities
    that may affect the security of the online teaching/learning system. Security
    problems can happen in various components of the online teaching/learning system
    such as the network, Web service, server computer systems, client computer systems,
    database systems, and so on. Several security vulnerability detection methods
    and open source vulnerability detection tools will be introduced in this chapter.


    Based on the requirements of the online teaching/learning system, the university''s
    rules, and the possible vulnerabilities, a security policy should be created by
    a team of network managers, instructors, and university administrators. The security
    policy serves as a guideline on what to do about the issues related to the availability,
    reliability, integrity, and confidentiality of the online teaching/learning system.
    The policy will decide on the protection, authentication and authorization policies.


    To enforce security measures, we will need security management tools. For various
    security management tasks, there are many open source tools that are'
