    A database management system provides a database development and management platform.
    With the database management system, developers can design and create databases
    to store and track the course and student information, support Web-based applications,
    analyze students'' performance, and other knowledge management tasks. To meet
    the teaching and learning requirements, the database management system should
    include the following components for database development and management:


    +   - Database server: This component supports network based database operations
    and provides a network based database development environment. A database server
    can distribute data across a network to remote applications and other databases.
    Especially, it can support the Web database application and allows multiple users
    to log on to the same database simultaneously.

    - Database management: This component can be used to create and manage database
    objects such as databases, tables, users, indexes.

    - Query Editor: It is used to develop and execute queries to extract data stored
    in a database. It can also be used to execute SQL statements for database management
    and populate the database with data.

    - Data transformation utilities: They can be used to move data into and out of
    a database to other data sources such as relational databases, spreadsheet files,
    text files, XML files, and other forms of data sources.

    - Data analysis utilities: They can be used for data analysis tasks such as developing
    and managing data warehouses, conducting an Analytical Processing (OLAP) analysis,
    data mining and other statistical descriptions of data decision support.

    - Network utilities: They can be used to perform network related configurations
    for remote access and communication over network devices.

    - Debugging utilities: They can help with exception handling in SQL code and other
    database troubleshooting tasks.

    - Programming interface: This interface can be used to extend the basic SQL functionalities
    by providing environments to develop programs with PHP, Python, Ruby, Java, or
    other programming languages.

    - Database application development utilities: Some of the database management
    systems also include utilities to develop database applications such as reports,
    forms, and Web pages.


