  md: '# Logical Design Process


    The system described by the conceptual design is a system from the user''s point
    of view. The information provided by a conceptual design does not match the technical
    terms used in physical implementation. Also, it is not clear how the components
    in a system are related to each other. To physically implement such a system,
    the designers need to create a model that logically represents the system with
    technical terms. The model should include all the components containing the objects
    and activities associated with them. The model should also include the specifications
    and features of each component in technical terms.


    Developing a model to represent a system is the task covered by the logical design
    process, which will achieve three goals, analyzing the conceptual information
    with technical terms, creating a logical model, and validating the logical model.
    To achieve these design goals, the designers first go through the following steps
    to analyze the information provided by the conceptual design.


    +   * To design the logical model for the data component, the designers need to
    identify the data objects, object attributes, and relationships among the objects.

    * For business rules, the designers need to define the constraints and activities
    to implement the business rules with technical terms.

    * To design user interfaces, the designers should first decide the interface formats
    based on the requirement information. Then, the designers will develop prototypes
    for the user interfaces. For each prototype, the designers should specify properties
    for each control and define the activities to be performed by the control.


    The next task in the logical design process is to create a logical model by integrating
    the user interfaces, objects, and activities identified by the above steps. The
    objects and activities are integrated through the relationships among them. One
    of the commonly used tools to create a logical model is the Unified Modeling Language
    (UML). The UML provides graphical diagrams to represent the objects, activities,
    and relationships in a logical model. In the UML, objects are defined by states
    and properties. Properties are the attributes of an object and a state is a set
    of property values of an object. Behavior, also called operation, is the term
    used by the UML to define the activities of an object. There are thirteen types
    of diagrams these thirteen types are categorized below:


    +   * Structure diagrams: These diagrams represent the static structure of the
    system being modeled. The diagrams that belong to this category are the class
    diagram, component diagram, composite structure diagram, deployment dia-'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Instructional Technology Theory for Online Teaching/Learning System 43


    gram, object diagram, and package diagram. Structure diagrams also include some
    of the relationships among objects and some internal structures.

    **Behavior diagrams:** These diagrams represent dynamic behavior between the objects
    in a system model. The diagrams in this category are the activity diagram, state
    machine diagram, use case diagram, communication diagram, interaction overview
    diagram, sequence diagram, and UML timing diagram. These diagrams can be used
    to model how a system gets the job done.


    The UML is an object-oriented modeling language. Therefore, it can be automatically
    transformed to Java representations which simplify the physical implementation.
    A detailed coverage of the UML is beyond the scope of this book. Interested readers
    can find useful information from the book by Pilone and Pitman (2005).


    Once the logical model is created, the next task is to review the logical model
    by validating and modifying it. The reviewer will use the logical model to match
    the requirements obtained from the conceptual design. The reviewer will work with
    the users to see if the requirements have been met. If there are mistakes, the
    reviewer will record the mistakes and give suggestions for change. Based on the
    reviewer''s suggestions, the designers will redesign the logical model. After
    the model is redesigned, go through another reviewer to validate the model. The
    last step in the design process is to ask the users to approve the model. Often,
    both the designers and users will sign a contract for agreement.


    The model created in the logical design phase can be used to define the physical
    structure of the online teaching/learning system; that is, the physical design
    phase in the system design process.


    # Physical Design Process


    Before the online teaching/learning system construction team can physically build
    the system, they must know the detailed information about the hardware and software
    that will be used in the system. To provide such information to the construction
    team, the designers need to provide the hardware and software specifications for
    each component in the logical model. Such a task can be accomplished in the physical
    design process. The designers in the physical design process should get the following
    work done.


    +   * **Infrastructure definition:** The infrastructure identified in the logical
    design phase need to be physically specified. The designers need to specify the
    network structure, the equipment to be used, the computer operating system platform,


