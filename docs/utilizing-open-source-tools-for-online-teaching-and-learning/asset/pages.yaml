  md: 'When creating the security policy, the team should consider the issues related
    to confidentiality, integrity, and availability of the online teaching/learning
    system:


    +   - **Confidentiality**: Keep confidential information from being viewed by
    unauthorized individuals.

    - **Integrity**: Prevent the confidential information from being intentionally
    or unintentionally altered.

    - **Availability**: Make sure that the authorized users can view and modify the
    information whenever they need to.


    For each of these areas, the security policy development team should provide a
    list of regulations to be enforced on the online teaching/learning system for
    the users. These regulations also serve as a guideline for the system developer
    and system administrator to follow. The following shows some possible regulations
    that can be enforced to reduce security vulnerabilities in each of the areas.


    # Confidentiality


    To improve confidentiality on the online teaching/learning system, the security
    policy can specify the following regulations:


    +   - The security policy should be clear on rules related to system authentication.
    The policy should be specific on who should be given the privilege to access what
    information and who should be given the privilege to access which computer systems
    and network devices.

    - The security policy should provide a guideline on how to protect data from being
    accessed by unauthorized individuals. It should specify what data should be encrypted
    and how to encrypt these data.

    - The security policy should include a strong password regulation to harden users''
    passwords.

    - The security policy should also include rules on how to monitor and audit the
    online teaching/learning system. The rules should specify who can perform the
    monitoring and auditing procedures.


    # Integrity


    To prevent the data from being intentionally or unintentionally altered by unauthorized
    individuals, the security policy should include a set of regulations to define
    what data can be modified by a user and how to protect the data transmitted over
    the network. The following lists some of the regulations:'
