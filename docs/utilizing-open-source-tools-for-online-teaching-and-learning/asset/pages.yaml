    students, he/she can let the students take control of the microphone or the pen
    on the virtual whiteboard.


    For each semester, the LMS administrator may need to create thousands of student
    accounts. If something needs to change in the student accounts, it may require
    the LMS administrator to modify thousands of student accounts. An easy way to
