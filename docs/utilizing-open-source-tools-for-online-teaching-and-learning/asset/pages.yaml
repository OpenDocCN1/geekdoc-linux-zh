    # FreeNAC


    In many situations, we may need to control the access to a local area network.
    It is often required that only the authorized computer systems or network devices
    are able to access the local area network. On the other hand, you may want to
    allow a group of students to access the local area network created on the university''s
    private network for hands-on practice. FreeNAC is such an open source network
    access control tool (FreeNAC, 2007). The following are some of the tasks that
    can be accomplished by FreeNAC:


    +   - FreeNAC can track the devices on a network and control how these devices
    access the network resources. It can provide a report on the network accessed
    by these network devices and users.

    - FreeNAC can help network administrators to find out how many devices are connecting
    to an enterprise-level network by querying switches and routers. The query results
    are automatically documented for later reference.

    - A Virtual LAN (VLAN) is a network that consists of computer systems and network
    devices physically located on different LAN segments. The VLAN is a network constructed
    by software. Although devices on a VLAN are physically on different LAN segments,
    logically they are still members of the original VLAN. FreeNAC can be used to
    manage VLANs.

    - For hands-on-practice, a group of students may need to access the local area
    network built in a computer lab on campus. FreeNAC can control the group of students
    so that they only access the local area network in the lab without accessing the
    university''s private network.

    - FreeNAC can be used to configure switch ports through a GUI based utility. With
