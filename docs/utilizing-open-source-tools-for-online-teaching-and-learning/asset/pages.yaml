    - Identify the problems in the open source based online teaching/learning system.

    - Identify the needs for further improvement on the infrastructure of the teaching/learning
    system, class Web sites, course materials, lab manuals, and so on.

    - Evaluate the results of learning, the instructional methods used by the instructors,
    and the efficiency of technical support.

    - Check if the objectives of the online computer labs have been achieved.


    There are many ways of evaluation. Evaluation models such as the model by Kirkpatrick
    and Kirkpatrick (2005) provide some guidelines on who, what, when, and where to
    evaluate. Here, we will start with Kirkpatrick''s evaluation model. Then, we will
    discuss some other evaluation models.


    # Kirkpatrick''s Four-Level Evaluation Model


    Kirkpatrick''s four-level evaluation model is one of the evaluation models that
    are used to evaluate the effectiveness of training. This model includes four levels:
    Evaluation of reaction, evaluation of learning, evaluation of behavior, and evaluation
    of results (Kirkpatrick, 1998; Kirkpatrick & Kirkpatrick, 2005). These four levels
    evaluate training in four different aspects.


    The first level of this model is the reaction level. It is to find out if the
    learner likes or dislikes the training program. For the evaluation of an open
    source based online course, questions in a survey are designed to find out how
    the students feel about the course content, the hands-on practice, the open source
    environment, and the instructor. This level of evaluation is used to determine
    if the training method,


