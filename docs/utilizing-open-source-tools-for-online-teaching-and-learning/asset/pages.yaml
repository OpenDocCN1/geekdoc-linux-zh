    notes, syllabus, and so on. They should also be allowed to upload course materials
    to these folders and configure how these course materials should be used by students.

    * Instructors should be permitted to create exams and assignments. For example,
    they should be able to set the due dates for assignments. They should be able
    to set up the exam login time, the exam duration, the exam format, the password
    for the exam, and the instruction for taking the exam.

    * Instructors should be able to grade students’ assignments, exams, and hands-lab
    activities. They should be allowed to post student grades and write comments.
    They can decide if a student can resubmit his/her assignment.'
