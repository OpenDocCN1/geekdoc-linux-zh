    A modeling process is often called a design process. The following discusses issues
    related to the online teaching/learning system design.


    # ONLINE TEACHING/LEARNING SYSTEM DESIGN


    The second phase of a design stage may include system modeling and validation.
    Modeling an online teaching/learning system is a special case of modeling a service-oriented
    solution which is a process to convert a system described by users into a logical
    model with technical terms (Erl, 2005). A modeling process specifies the system''s
    organization, structure, and technical terminologies. Among many possible choices,
    the designers need to select the solution architecture that can meet the users''
    requirements (Chevance, 2005). In the following, we will go over the strategies
    on modeling an online teaching/learning system.


    # System Components


    After the requirement information is collected, the next task is to identify the
    components that will be included in the system. The following are of commonly
    included components in an online teaching/learning system:


    +   **Data component:** In this component, the designers need to identify what
    data objects to keep track of by analyzing the requirement information collected
    in the conceptual design phase. For every object they have identified, they need
    to further specify the attributes of the object and the data type and volume.
    The designers will analyze the relationships among the data objects. In addition
    to the specification of data objects, they need to specify the operations performed
    on these data objects, such as how the data will be inserted, deleted, updated,
    and queried. For the online teaching/learning system, the designers also need
    to specify how the data can be remotely accessed and how the data can be displayed
    through Web browsers.'
  merge: -1
