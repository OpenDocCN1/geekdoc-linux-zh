  md: '# Instructional Technology Theory for Online Teaching/Learning System 33


    # Courses that Need Hands-On Practice on IT Products


    This type of course is often in technology related curricula such as information
    systems, computer science, and computer technology. Courses in those curricula,
    in addition to the infrastructure supported by learning management systems, need
    the infrastructure to support hands-practice on the IT products covered by the
    course content. These courses present a challenge to the online teaching and learning
    platform. They require students to perform hands-on practice on various servers
    as well as application software through the Internet. These courses also require
    students to be able to perform duties usually done by a network manager, security
    manager, or database manager. Because networks, databases, devices, and servers
    are involved, extra effort is needed for each individual course. We will categorize
    these courses and discuss the infrastructure requirements of each type of course
    in the next few paragraphs.


    In the technology related curricula, there are a wide range of technology-based
    courses that need additional support for hands-on practice. The dependency on
    lab support is different based on the content covered by these courses. Based
    on the needs for an online teaching/learning system, the technology-based courses
    can be categorized as the following:


    +   * Courses requiring simulated labs: Hands-on activities in some science courses
    and networking courses can be done using a lab simulated by computer simulation
    software, such as the simulated chemistry labs (Model Science Software, Inc.,
    2006), simulated biology labs (Virtual Courseware Project, 2006), and simulated
    computer networks (Lamle & Tedder, 2003). For this type of course, the additional
    technology requirements are simulation software, Web browsers capable of viewing
    the simulation, and Web servers to post the simulation and allow for interactivities
    through the Internet. Most of the simulation software can be posted on the Internet.


    +   * Courses requiring computer controlled instruments: For engineering courses,
    some of the hands-on practice can be done remotely through the instruments controlled
    by computers. Students can instruct the computers how to act through a Web browser.
    This type of course needs Web-based infrastructure to support online teaching
    and learning.


    +   * Courses requiring application software: Many technology-based courses require
    hands-on practice on application software. For example, programming language courses,
    personal productivity improvement courses, Web computing courses, and database
    application development courses belong to this category. In addition to a well-established
    learning management system to support the'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'course management, this type of course also needs to provide programming software
    and application client software for hands-on-practice.


    +   - Courses requiring client-server structure: Many e-commerce related courses
    require hands-on practice on a client-server structure. Courses such as database
    systems, Internet computing, and application development are in this category.
    For this type of course, online teaching/learning is constructed on a client-server
    structure. In a class, usually several client-server structures are created for
    hands-on practice, one for each group. There are two ways to deal with this type
    of course. One way is to construct an online computer lab where the entire client-server
    structure is installed. The other way is to use students'' computers as the client
    side, and build the middle tier in an online computer lab.

    - Courses requiring network and server side operations: Many courses in the information
    systems, computer science, and information technology curriculum belong to this
    category, for example, courses such as system administration and network management.
    Hands-on practice in these courses requires students to reconfigure operating
    systems and networks; this means that the networks and servers used for hands-on
    practice in the lab are unstable and should not be used for other kinds of courses.
    For this type of course, a computer lab is necessary.


    In general, courses that require hands-on present most difficulties on an online
    platform. Like many other online courses, they need a well-established learning
    management system. Also, they require faster Internet connection, secure protection,
    better technical support, and more powerful hardware and software. These courses
    often need an online computer lab to support hands-on practice. In recent development,
    wireless and hand-held devices are also widely used for online teaching and learning.


    For the development of an online teaching/learning system, in addition to the
    requirement for an infrastructure, tools for developing course materials for online
    courses are also needed. The discussion for such needs is given in the next para-graph.


    # Requirements for Creating Online Course Materials


    For online teaching and learning, technologies are also required to develop online
    course materials. To overcome some weaknesses of online teaching and learning,
    almost all online courses need various technologies to develop audio, video, or
    life lecture course materials. A sophisticated general purpose learning management
    system (LMS) is able to handle some of the technology needs for developing


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Instructional Technology Theory for Online Teaching/Learning System 35


    online course materials. If the tools supported by a LMS are not adequate, there
    are open source tools that are available to the development of collaboration and
    multimedia course materials. With those course content development tools, instructors
    can provide video, audio, and interactive course materials to enrich online courses.


    Many types of course materials can be created to meet the requirements of online
    courses. The following are some of the commonly used course materials:


    +   - Lecture notes

    - Hands-on demonstration materials

    - Lab activity manuals

    - Online help

    - Collaborative operations

    - Class syllabi

    - Lab regulations

    - Movies

    - Games

    - Instruction for enforcing security measures


    Based on the nature of the courses, the online course materials can be in many
    different formats such as text only documents, graph enhanced documents, multimedia
    enhanced documents, collaboration enhanced Web Pages, Web conferencing, virtual
    reality materials, and online education games. In the following, we will briefly
    discuss the course content that may be represented in these formats:


    +   - Text only documents: These course materials often include basic lecture
    notes, security and account instructions, lab regulations, and class syllabi.
    They are relatively easy to create. Creating these materials do not require a
    lot of storage space and do not require high speed Internet service. It is particularly
    useful when many students in a class do not have the high speed Internet connection
    to the course Web site may be boring and difficult to describe graph-based course
    content such as a computer screen. The screen can be directly uploaded to the
    class Web site for display or download. It can also be converted to an image file
    by using a scanner or converted to a pdf file, and then uploaded to the class
    Web site.

    - Graph enhanced documents: Photos, charts, clip arts, and screen shots can be
    used to greatly improve the quality of online course materials. A graph enhanced
    document may also include lecture notes, lab activity manuals, and so on. When
    combined with text documents, graphs can greatly improve the


    Copyright © 2009, IGI Global, distributing in print or electronic forms without
    written permission of IGI Global is prohibited.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'quality of online course materials. They are especially useful for graph-based
    course materials such as a lab manual which includes many screen shots.


    +   Multimedia enhanced documents: To improve the quality of course materials,
    audio and video can be added to documents such as lecture notes, remote access
    instructions, and lab activity manuals. Movies and animations also belong to this
    type of course material. Although multimedia enhancement can greatly increase
    the quality of course materials used to present multimedia content, it requires
    a lot of computing resources and technical support from the computer service department.
    It also requires a lot of effort from faculty members who create the course materials.
    It is not suitable for course materials that need to be updated frequently, as
    the lecture notes that require instruction on how to use a frequently upgraded
    computer product. Often, this type of material can only last for one or two semesters
    before a new version of the product is on the market.


    +   Collaboration enhanced Web pages: This type of course material is often used
    for group projects, interactive learning, and online tutoring. Learning management
    systems or live online conferencing products are often used to host these Web
    pages. Developing this type of course material is a complicated process. It often
    requires instructors and instruction support teams to work together to create
    such materials. The interactive Web site may create a security hole in the users''
    network system, additional security effort is needed to protect the users'' network.
    Before an enhanced Web page can be deployed on the Internet, one has to get the
    computer service department’s approval due to security issues. To manage a class
    using collaboration enhanced pages, the instructor who teaches the class needs
    to be the administrator of the Web site, which may require directory service tools
    for setting up user accounts for remote access. If this violates the security
    policies, it has to be resolved at the administrative level.


    +   Web conferencing: Web conferencing can be used to exchange audio and video
    information through streaming video and audio technologies. It allows universities
    to offer live online courses so that students and instructors can interact like
    they are in a face-to-face class. Therefore, we can consider Web conferencing
    a sophisticated collaboration tool. In addition to live meetings, a Web conferencing
    program can record the video and audio for students to review later. Most of the
    Web conferencing programs include both the Internet and IP based telephone system.
    Like many other multimedia online teaching materials, Web conferencing requires
    a lot of computing resources. The Web conferencing server is often managed by
    the instruction support team. Each semester, by the requests of instructors, instructor
    and student accounts will be created for classes. Before the classes start,'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'should be some necessary training for the instructors and students on how to
    use Web conferencing for teaching and learning.


    +   **Virtual reality:** Virtual reality is another technology that can be used
    to improve the quality of course materials. It is a computer generated environment
    by super-imposing graphics, audio, and sense enhancement devices on a real-world
    surrounding. Virtual reality has been used in gaming, training, and virtual demonstration
    such as virtual tours used for hotel room reservation. Although virtual reality
    has been used in training for years, it is not widely used in classroom teaching
    due to the high cost on hand-mounted devices, tracking hardware and software,
    and portable computing devices that are used to generate three dimensional graphics.


    +   **Education games:** Games can also be used to improve learning by training
    students'' decision making strategies and hands-on skills. They can motivate students
    to improve their hands on skills and collaboration. There has been reported that
    video games have been successfully used to teach subjects such as foreign languages
    and mathematics (Kirremeier, 2002). Some gaming related curricula also require
    the support of gaming course materials. Creating games requires programming skills
    and the understanding of art. Often, it is a professional''s job to create games
    for education. Some video games can be played on the Internet where multiple players
    play against one another across the world. Online games can be controlled to limit
    them to a certain geographical area or a group of people.


    In the above, we have analyzed the requirements for delivering online courses
    and developing online course materials. The analysis gives the general requirements
    for any online teaching/learning system. For each individual project, there will
    be specific requirements. Next, we will discuss how to collect information about
    the requirements.


    # Information Collection


    A well-designed online teaching/learning system is based on a thorough understanding
    of the needs. Each project has its own specific requirements. The designers of
    the new system should find answers to the following questions in the early stage
