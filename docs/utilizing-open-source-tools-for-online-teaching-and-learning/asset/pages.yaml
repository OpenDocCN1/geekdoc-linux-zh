    # Berkeley DB


    Unlike MySQL and PostgreSQL, Berkeley DB is an open source embedded database library.
    To be used, Berkeley DB needs to be embedded in one of the programming languages
    such as C, C++, Java, Perl, Python, Ruby, and so on. It can also be used with
    the application products such as sendmail, the Apache Web server, the OpenLDAP
    server, and many UNIX products. The features of an embedded database like Berkeley
    DB are summarized in the following:


    +   - Berkeley DB is simple and fast. It takes a small amount of memory and can
    be loaded into memory in a very short time.

    - For better performance, an embedded database like Berkeley DB is usually not
    a relational database and does not use SQL. This type of database is often built
    on a flat file.

    - The administration of an embedded database is relatively easy. There is no user
    account to manage and need to set up permissions for access database objects.

    - After being embedded in an application, an embedded database can be shipped
    with the application product so that the users of the application product do not
    need to install and implement a database for the application product.

    - Being an embedded database, Berkeley DB lowers cost for database implementation.
    It does not require additional hardware and software.

    - An embedded database like Berkeley DB is flexible, and it can be configured
    to be optimized for a specific application.


    To be used with a specific application, Berkeley DB is a good choice for a fast,
    scalable, and reliable database that supports data management.


