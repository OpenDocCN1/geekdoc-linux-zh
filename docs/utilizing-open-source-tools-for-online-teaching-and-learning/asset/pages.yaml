    +   **Program virus:** This kind of virus becomes active when a computer is running
    an executable file such as the extension .BIN, COM, EXE, OVL, .DRV, .DLL, or SYS.
    The virus can be loaded into memory and infect other executable files that are
    started after the infected file. Once an infected program is copied to other computers,
    it can infect the programs hosted by the other computers. Some of the commonly
    known program viruses are Sunday and Cascade.


    +   **Trojan horse virus:** Similar to a program virus, a Trojan horse virus is
    an executable file. Instead, it claims that it is a game or it can do some helpful
    things such as eliminating viruses on your computer and wait for some to download
    and open it. Once opened, the virus may do something annoying to the user or it
    may wipe out the entire hard disk. The commonly known Trojan viruses are Beast
    and Bifrose.


    +   **Stealth virus:** This type of virus infects a computer in a very difficult
    to detect. It can hide itself in a regular file and modify the file size so that
    the size is the same as that of the original file to avoid the detection by antivirus
    software. Some of the stealthy virus can even temporarily replace the infected
    file with a copy of uninfected file to trick the antivirus software. There are
    several stealthy viruses. The commonly known ones are Joshi and Wahle.


    +   **Polymorphic virus:** Like a stealthy virus, this type of virus also tries
    to hide its identity. It can change its appearance in each different infection.
    Antivirus software may not be able to detect all types of viruses. Therefore some
    forms of polymorphic viruses may be able to survive and continue to damage the
    system. It is difficult to remove this type of virus from an infected system.
    Cascade and Virus 101 are known polymorphic viruses.


    +   **Macro virus:** This type of virus becomes active when one opens an infected
    file which includes macros. Files like word processing files may include macros
    to perform certain activities and can be infected by the macro virus. If the infected
    file is copied to another computer, the files with macros on the other computer
    can also be infected. Some of the known macro viruses are WM/Helper.C;D;E and
    W97M/Ekiam.


    +   **Java or ActiveX virus:** This type of virus can be spread through Web browsers.
    Once a user clicks a button or a link which the virus is hiding, the virus takes
    control of the victim computer from the currently opened page.'
