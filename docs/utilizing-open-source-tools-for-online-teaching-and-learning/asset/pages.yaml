    +   * rpm: rpm is an open packaging system that packages the source code of certain
    software into the source and binary forms. The binary form is for installation
    and the source form is for rebuilding.


    The formats tgz and rpm are two commonly used formats for downloadable files.
    The installation of these files is different. The installation processes of these
