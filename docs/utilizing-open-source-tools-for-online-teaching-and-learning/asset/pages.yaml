    **Database definition:** The physical design of a database should be completed
    in this phase. The first thing is to select a database management system used
    to construct the database. In the physical design process, the designers will
    consider issues such as database system architecture, data storage devices, data
    accessing schemes, data types, data storage capacity, hosting server configuration,
    data security measures, data transfer methods, and how the data will be used.
    The designers also determine how to implement the business rules on a database,
    a middle tier as part of the application logic, or a constraint in the application
    software. It is required that the database configuration at the back end of the
    online teaching/learning system should be consistent with the learning management
    software and the user interfaces at the front-end of the system.


    Once the hardware and software are identified, the next step in the physical design
    process is to validate that the system meet the requirements. The validation tasks
    can be summarized as the following.'
