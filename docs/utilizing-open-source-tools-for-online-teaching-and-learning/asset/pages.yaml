  md: '# Server Development and Management 131


    improving the products. These open source operating systems have minimal or no
    intellectual property restrictions. Users can freely add new components to these
    operating systems to meet their specific needs. The following are brief descriptions
    of some commonly used open source operating systems as Linux, OpenBSD, and so
    on.


    # Linux


    Linux is one of the most popular open source operating systems. It is licensed
    under the GNU Public License and its underlying source code can be freely modified,
    used, and re-distributed by anyone. Linux has an Internet based development environment.
    Developers around the world contribute their code through the Internet. The Internet
    based development environment makes Linux have the following advantages.


    +   - Linux is one of the favorite operating systems supported by Internet service
    developers due to its capability in handling Internet based interactivities. Linux
    is particularly suitable to be used in a client-server system created over the
    Internet.


    +   - Linux is developed in an environment that allows multiple sessions to run
    simultaneously. Therefore, it is a multitasking operating system that handles
    multiple computing tasks simultaneously and allows multiple users to work on the
    same server at the time.


    +   - Since the World Web and Internet related protocols such as IP are open source
    technologies, it is convenient for programmers around world to program these technologies
    into Linux. Therefore, Linux is widely used as a network server to manage various
    types of networks.


    +   - In addition to being able to communicate through the Internet, the network
    management by Linux is also able to communicate with other networks managed by
    other types of technologies such as Novell, Windows, and Apptalk. Therefore, Linux
    is a good choice to host the directory service.


    +   - In general, Linux requires less hardware resources. Compared with some commercial
    operating systems, Linux can run on a PC with a small hard drive and less than
    32MB RAM. Some versions of the Linux operating system can run on a CD or even
    on a floppy disk.


    +   - As an open source product, Linux allows programmers to write kernel extensions
    and drivers for newly published software and hardware. This can make Linux updated
    with new technologies without waiting for the new version.


