  trans: "\n当前目录由点 `.` 表示。父目录由冒号 `..` 表示。在 `/home` 目录中，你可以通过 `/home/luis/Carta.txt`（绝对路径）或\
    \ `/luis/Carta.txt`（相对路径）访问 `Carta.txt`。在 `Luis` 目录中，可以使用 `./Carta.txt` 或直接使用\
    \ `Letter.txt`。\n\nLinux 文件系统遵循所有的 UNIX 规范，这意味着它具有一个确定的、与其他 UNIX 系统兼容且同质的结构。与\
    \ Windows 或 MS-DOS 不同，任何 Unix 系统上的文件系统并不直接链接到硬件结构，也就是说，它不取决于给定的计算机拥有 1、2 还是 7\
    \ 块硬盘来创建 `c:\\`、`d:\\` 或 `m:\\` 驱动器。\n\n每个 UNIX 文件系统都有一个唯一的根或根源，用 `/` 表示。在此目录下，你将找到操作系统可以访问的所有文件。这些文件组织在不同的目录中，它们的使命和名称在所有\
    \ Unix 系统中都是标准的。\n\n* `/`: 文件系统的根\n* `/dev`: 包含代表物理安装在计算机上的设备的系统文件\n* `/etc`:\
    \ 此目录留用于系统配置文件。在此目录中，不应出现二进制文件（程序）。在此下，应该还有两个子目录：\n    * `/etc/X11`: X Window\
    \ 配置文件\n    * `/etc/skel`: 在创建新用户时复制到该用户目录的基本配置文件\n* `/lib`: 包含运行位于 `/bin` 中的程序所需的库（不是用户程序的库）\n\
    * `/proc`: 包含向系统内核发送信息或从系统内核接收信息的特殊文件（建议不要修改此目录及其文件的内容）\n* `/sbin`: 包含只有超级用户或\
    \ root 可以访问的程序\n* `/usr`: 这是系统最重要的目录之一，因为它包含了所有用户通用的使用程序。其结构通常如下：\n    * `/usr/X11R6`:\
    \ 包含运行 X Window 的程序\n    * `/usr/bin`: 通用程序，包括 `C` / `C++` 编译器\n    * `/usr/doc`:\
    \ 通用系统文档\n    * `/usr/etc`: 通用配置文件\n    * `/usr/include`: `C` / `C++` 头文件 (`.h`)\n\
    \    * `/usr/info`: GNU 信息文件\n    * `/usr/lib`: 程序的通用库\n    * `/usr/man`: 可通过\
    \ `man` 命令访问的手册\n    * `/usr/sbin`: 系统管理程序\n    * `/usr/src`: 程序的源代码\n\n除了上述目录，还有其他位于\
    \ `/usr` 目录下的目录，例如安装在系统中程序的文件夹。\n* `/var`: 此目录包含关于程序的临时信息（这并不意味着你可以删除其内容，事实上不应该这样做）\n\
    \n# 第 1 章：操作系统基础概念\n\n## 操作系统的概念、目的与功能\n\n### 操作系统的概念\n我们现代操作系统的主要思想和起点是需要创建并将纳入计算机系统中使用（我们所说的计算机控制系统是指一套硬件和软件的集合）。计算机控制系统最初是为了解决用户的责任归属和实际问题而开发的。由于仅靠硬件很难实现这一点，因此创建了应用程序。这些程序需要硬件管理的通用操作、硬件资源的分配等。这些操作被归类在一个独立的软件层中，这被称为操作系统。\n\
    \n此外，操作系统的能力远远超过了应用程序所需的各种操作集合，但此类系统在应用程序和硬件之间的中间位置保持不变。\n\n### 操作系统的目的\n操作系统为我们提供了一套控制系统，其次是其工作的效率和可靠性。第一个功能是操作系统作为扩展机器的特征，第二个是操作系统作为硬件资源的分配器。\n\
    \n### 作为扩展机器的操作系统\n使用操作系统时，应用程序程序员（通过他的程序和用户）应该感觉他们正在与一台先进的机器工作。硬件并不非常适合直接在应用程序中使用。例如，如果你考虑在相应控制器的命令级上与\
    \ `I / O` 设备工作，你会发现此类命令的集合是有限的，而且对于许多设备来说是原始的。操作系统隐藏了这种硬件接口，转而为程序员提供了一个使用高层概念（称为抽象）的应用程序编程接口。\n\
    \n例如，当处理磁盘工作时，一个典型的抽象是文件。处理文件比直接处理磁盘控制器要容易得多（不需要考虑移动驱动器头、启动和停止电机等），结果是程序员可以专注于其应用程序的本质。操作系统负责与磁盘控制器交互。抽象的强调使得\
    \ OS 代码和应用程序代码在迁移到新硬件时能够易于更改。例如，如果你在计算机上安装了新类型的磁盘设备（只要操作系统支持它），它的所有特性都将在操作系统层面得到考虑，而应用程序将继续像以前一样使用文件。系统的这种特性被称为硬件无关性。可以说操作系统为执行应用程序提供了一个硬件无关的环境。\n\
    \n### 作为资源分配器的操作系统\n操作系统必须高效地分配资源。它充当这些资源的管理器并根据需要向应用程序提供。资源分配有两种主要类型。在空间分配的情况下，资源访问将同时针对多个客户，他们中的每一个可以使用资源（共享内存）。在时间分配的情况下，系统进行队列并允许它们在有限时间内使用整个资源。在分配资源时，OS\
    \ 解决可能的冲突，防止程序未经授权访问这些资源，确保计算机的高效运行。\n\n### 现代操作系统的分类\n根据其范围，对现代操作系统进行如下分类：\n\n\
    * **大型机（mainframes）**: 它们的设计主要特征是执行 `I / O`：提供大量的外设（磁盘、打印机等）。此类计算机控制系统用于可靠地处理大量数据。操作系统应该有效地支持这一过程（批处理模式或时间分配）。此类类的示例是\
    \ `IBM/390`。\n* **服务器系统**: 下一类包括服务器操作系统。此类操作系统的主要特征是处理大量的用户请求。网络支持对它们起着重要作用。通用服务器（`UNIX`\
    \ 或 `Windows`）现在常用于实现服务器。\n* **个人操作系统**: 最大的类别之一是个人操作系统。在这一类中，一些操作系统（`Windows\
    \ 95/98/Me`）是通用操作系统的简化版本。个人 OS 特别关注的是支持用户界面和多媒体技术。\n* **实时操作系统**: 还有实时操作系统。在这样的系统中，必须保证操作在指定时间内完成。实时操作系统可以控制进程的运行。实时操作示例有\
    \ `QNX` 和 `VxWorks`。\n* **嵌入式操作系统**: 另一类是嵌入式操作系统。这些是用于微处理器、智能卡和其他设备的系统。此类系统提出了特殊要求：少量内存和对特定设备的支持。通用系统包括\
    \ `Linux` 和 `Windows CE`。\n\n### 操作系统的功能组件\n操作系统可以被视为一组组件，每个组件负责系统的特定功能。现代操作系统的最重要特征是实现它们的组件以及它们的关系取决于操作系统的架构。每个操作系统根据其可以处理的工作类型来将它们组织在一起。\n\
    \n### 进程与流管理\n正如我们提到的，操作系统最重要的功能之一是执行应用程序。代码和应用程序数据以特殊方式存储在计算机控制系统的磁盘上。文件系统创建执行进程的基本单元。操作系统在进程之间分配资源。这些资源包括\
    \ CPU 时间、内存、设备、磁盘空间。处理器之间的分配是必要的，因为在特定的时刻进程可以执行。为了实现这种效果，OS 为每个进程提供短暂的时间，随后将其切换到另一个进程；进程从中断的地方恢复执行。在多处理器系统中，进程可以在不同的处理器上并行运行。现代操作系统除了进程外还可以支持多任务，提供了多个指令（线程），它们像大多数\
    \ 进程一样并行运行。与进程不同，线程不提供资源保护（例如，它们共享进程的地址空间）。\n\n### 内存管理\n执行代码时，处理器从计算机（主）内存获取指令和数据。这种内存显示为字节数组，每个字节都有一个地址。如所述，主内存是进程之间的一种资源。OS\
    \ 负责内存分配。地址空间在进程期间受到保护，并在执行完成后释放。进程的可用内存可以在内存分配过程中变化。操作系统必须能够处理可用内存总量。为此，必须实现虚拟内存技术。这项技术允许在主内存中放置当前所需的指令和进程，而地址空间其余的内容存储在磁盘上。\n\
    \n### I/O 管理\n操作系统负责管理连接到内存的 I/O 设备。OS 对此类设备的支持通常在两个级别执行。低层包括设备驱动程序——控制特定类型设备并考虑其所有特性的软件模块。第二层包括一个方便在应用程序使用的通用\
    \ I/O 接口。OS 应该实现一个通 I/O 驱动接口，通过该接口与其他系统组件交互。此接口为新设备添加驱动程序变得简单。现代操作系统为特定外设提供了大量现成的驱动程序。OS\
    \ 支持的设备越多，其实际使用的机会就越大。\n\n### 文件管理与文件系统\n对于 OS 用户和程序员来说，磁盘空间作为一组组织成文件系统的文件提供。文件是文件系统上一组可以通过名称访问的文件。“文件系统”一词可以用于两个概念：以文件形式组织数据的一种原则，以及根据该原则组织的特定数据集（通常是磁盘的相应部分）。作为操作系统的一部分，它可以同时实现支持和接口化（inter-faced，注：原文写为\
    \ ICA）多个文件系统。文件系统在逻辑和物理层面都被考虑。\n\n## 网络支持\n\n### 网络系统\n* 网络系统\n现代操作系统适应了在网络上工作，它们被称为网络操作系统。网络支持使\
    \ OS 能够：\n* 通过网络公开提供本地资源（磁盘空间、打印机等），即作为服务器运行。\n* 通过网络引用其他计算机资源，作为客户端运行。\n实现服务器和客户端的功能基于网络协议进行数据传输。\n\
    \n### 分布式系统\n网络操作系统不隐藏网络的存在。网络支持在它们中决定了系统结构并增强了其额外能力。分布式 OS 允许多台计算机并行工作池资源。分布式系统是使用多个处理器的\
    \ OS 两大类别。\n\n### 结论\n现代操作系统的趋势之一是，在特权模式下内核的一小部分功能（微内核）被实现。其他 OS 功能由用户模式进程（服务器）执行。服务器负责文件系统。内核在系统组件之间通信并执行基本资源分配。为了执行系统调用，应用程序（客户端）访问内核。内核拦截它，将处理器切换到特权模式，执行操作，将处理器切换回用户模式并将结果返回应用程序。内核将其转发给客户端。客户可以是单个用户或其他单元。\n\
    \n微内核方法的优点是：\n* 内核尺寸小，便于开发和调试\n* 系统可靠性高，因为服务器在用户模式运行无法直接访问硬件\n* 系统具有更大的灵活性和扩展性（不必要的组件不占用内存，系统功能的扩展减少到添加新的服务器）\n\
    * 适应网络条件的可能性（服务器和相关网络或在同一台计算机之间交换数据）\n\n微内核方法的主要缺点是性能下降。在系统调用的情况下，处理器模式发生了切换（两次——在客户端和内核之间，两次——在服务器和微内核之间）。系统调用比用户实现的功能慢，因为处理器切换了两次。对于某些\
    \ OS，某些功能在用户模式下实现，因此不需要使用系统调用访问它。\n\n# 第 2 章：操作系统架构\n\n操作系统可以被视为一组组件，每个组件负责某些功能。此类组件的集合以及它们与外部环境交互的顺序由操作系统的架构决定。考虑架构的基本概念方法，以\
    \ `Linux` 为例考虑的实现。\n\n## 系统架构的基本概念\n\n### 系统内核——特权模式与用户模式\n负责 OS 最重要功能的基本组件通常位于内存中并在特权模式下执行，被称为操作系统的内核。当前的设计方法定义了内核的功能。OS\
    \ 最重要的功能包括中断处理、内存控制、输出控制。内核的核心特征是它在特权模式下运行。为了确保高效的资源管理，操作系统对于应用程序拥有某些特权。它们必须支持两种模式——特权模式（内核模式）和用户模式（用户模式）。在内核和应用程序交互时使用不同的\
    \ CPU 模式。当需要执行内核实现的操作时，应用程序发出系统调用。内核拦截它，将处理器切换到特权模式，执行操作，将处理器切换回用户模式并将结果返回应用程序。系统调用比用户实现的功能慢，因为处理器切换了两次。对于某些\
    \ OS，某些功能在用户模式下实现，因此不需要使用系统调用访问它。\n\n### 操作系统架构的实现\n考虑实现操作系统架构的几种方法。在实际 OS 中，它们通常使用这些方法的组合。\n\
    \n### 单内核系统\n所有基本功能集中在内核中的操作系统被称为单内核系统。在单内核实现中，OS 变得更高效（组件之间交互时处理器不切换模式），但可靠性较低（所有代码都在特权模式下执行，每个组件的错误都是致命的）。单内核并不意味着其所有组件都必须留在内存中。现代操作系统允许在内核空间中放置代码片段。内核模块的实现使得扩展成为可能（添加新功能只需在内存中加载相应的模块）。\n\
    \n### 多级系统\n组件形成层级结构（层），每一层都依赖前一层的功能。最底层直接与硬件交互，最高层实现系统调用。在传统的多级操作系统中，从顶到底部的控制传递实现为系统调用。顶层必须具有执行该调用的权利，这些权利通过硬件的支持进行验证。这种系统的示例是\
    \ 60 年代开发的 `Multics` 操作系统。由于性能不佳，这种方法的实际应用今天受到了限制。层也可以在单内核中隔离；在这种情况下，它们通过程序支持并导致系统实现中断。在单内核系统中，内核决定了层级：\n\
    * 抽象意味着直接与硬件交互，释放系统其他组件免受这种交互\n* 核心内核负责最基本、最简单的内核操作，例如将数据块写入磁盘。通过这些手段，带有资源管理的执行上层指令\n\
    * 资源管理工具（或资源管理器）实现基本 OS 功能（进程管理、内存、输入输出等）。在这一层，做出了最重要的资源管理决策，这些决策是由内核做出的。\n"
- fmt: "\nThe system has three main components: the process management subsystem,\
    \ the file system, and the I/O subsystem.\n\nThe process management subsystem\
    \ controls the creation and deletion of processes, the allocation of system resources\
    \ between them, inter-process interaction, and memory management. The file subsystem\
    \ provides a single interface for accessing data stored on disk drives and peripherals.\
    \ Such an interface is one of the most important features of `UNIX`. They use\
    \ the same system calls to either communicate with the disk or output to a terminal\
    \ or printer (the program works with the printer just like a file). In this case,\
    \ the file system forwards requests to the relevant modules of the I/O subsystem,\
    \ and those - directly to the peripheral devices. In addition, the file subsystem\
    \ controls file access rights, which largely determine the privileges of the user\
    \ on the system.\n\nThe I/O subsystem performs file system requests by interacting\
    \ with device drivers. In `UNIX`, there are two types of devices: character (e.g.,\
    \ printer) and block (e.g., hard disk). The main difference between them is that\
    \ the block device allows direct access. To increase the productivity of block\
    \ devices using the buffer cache - plot memory which stores data last scanned\
    \ from the disc. Subsequent accesses to these data can be retrieved from the cache.\n\
    \n# Linux Architecture\n\nThere are three main parts to Linux:\n\n*   `Core`:\
    \ which implements the basic functions of the OS (process management, input-output,\
    \ memory, etc.)\n*   `System libraries`: that define a standard set of functions\
    \ for use in applications (performing such functions does not require a transition\
    \ to privileged mode)\n*   `System utilities`: applications that perform specialized\
    \ tasks.\n\n## The Purpose Of The Linux Kernel And Its Features\n\n`Linux` implements\
    \ a monolithic kernel technology. All kernel data and data structures are in the\
    \ same address space. There are several functional components in the kernel:\n\
    \n*   `Process Scheduler`: Responsible for the implementation of multitasking\
    \ in the system (interrupt processing, timer operation, creation and completion\
    \ of processes, context switching).\n*   `Memory Manager`: allocates a separate\
    \ address space for each process and implements support for virtual memory.\n\
    *   `Virtual File System`: Provides a universal interface for interacting with\
    \ various file systems and I/O devices. implement*   `Device Drivers`: Provide\
    \ direct access to peripherals. They are accessed through the virtual file system\
    \ interface.\n*   `Network Interface`: Provides access to the implementation of\
    \ network protocols and network device drivers.\n*   `Interoperability Subsystem`:\
    \ Offers mechanisms that allow different processes in the system to communicate\
    \ with each other.\n\nSome of these subsystems are logical components of the system;\
    \ they are loaded into memory with the core and remain there permanently. Components\
    \ of other subsystems (such as device drivers) are implemented so that their code\
    \ could be uploaded on demand. To accomplish this, `Linux` supports the concept\
    \ of kernel modules.\n\n## Kernel Modules\n\nThe `Linux kernel` makes it possible\
    \ to load and unload individual sections of code on demand. These sections are\
    \ called `kernel modules` and run in privileged mode. Kernel modules offer a number\
    \ of advantages:\n\n*   Code modules can be loaded in memory in the process of\
    \ the system, which simplifies debugging kernel components, especially drivers.\n\
    *   They have the ability to change a set of core components at runtime: the ones\
    \ that are currently not in use cannot be loaded into memory.\n*   Modules are\
    \ an exception to the rule that code that extends kernel functionality under a\
    \ `Linux` license must be open. This allows hardware manufacturers to develop\
    \ drivers for `Linux`, even if they do not have access to their source code.\n\
    \n`Linux module support` has three components:\n\n*   `Module management tools`\
    \ make it possible to load modules into memory and communicate between modules\
    \ and the rest of the kernel.\n*   `Driver logging tools` allow modules to report\
    \ to another part of the kernel that a new driver has come to fruition.\n*   `Conflict\
    \ resolution tools` allow device drivers to reserve hardware resources and protect\
    \ them from being accidentally used by other drivers.\n\nA single module can register\
    \ multiple drivers if required (for example, for two different access mechanisms).\
    \ The modules can be downloaded in advance - at system start-up (`boot modules`)\
    \ or in the run of a program that triggers their functions. After loading, the\
    \ module code is in the same address space as the other kernel code. A module\
    \ error is critical to the system.\n\n## Features Of System Libraries\n\n`Linux\
    \ system libraries` are dynamic libraries that are only loaded into memory when\
    \ needed. They perform a number of functions:\n\n*   Implementation of system\
    \ call packers.\n*   Extension of system call functionality (such libraries include\
    \ the C language I/O library, which implements functions such as `printf()` based\
    \ on system calls).\n*   Implementation of user-mode service functions (sorting,\
    \ row processing, etc.).\n\n## User Application\n\n`Linux user applications` use\
    \ functions from system libraries and interact with the kernel through system\
    \ calls.\n\n## Installation\n\nUnlike what happens with Microsoft Windows, installing\
    \ `Linux` is not a simple process since `Linux` allows the control and customization\
    \ of a greater number of parameters and options. In spite of everything, they\
    \ are making great progress looking for the installation of `Linux` to be the\
    \ least traumatic process possible, depending on the simplicity of the distribution\
    \ used.\n\nDespite everything, before proceeding to install `Linux` it is necessary\
    \ to take into account a number of fundamental aspects. The first one is to read\
    \ the information contained in the installation CD; this information can appear\
