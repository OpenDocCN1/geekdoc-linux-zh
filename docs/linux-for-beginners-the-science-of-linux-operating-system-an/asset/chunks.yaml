    访问 Linux 系统有三种方式：\n1. 通过文本控制台。在这种方法中，用户直接连接到安装了 Linux 的计算机，然后通过非图形系统进行访问。\n2.\
    \ 从图形会话管理器（X Window）。在这里，用户直接连接到安装了 Linux 的计算机，并通过图形化程序访问系统。\n3. 使用 telnet 或安全\
    \ shell（ssh）从远程计算机访问。\n\n在上述任何情况下，都会出现（大致）以下内容：\n- Login:（输入用户名）\n- Password:（输入密码，屏幕上不显示）\n\
    \n"
- fmt: "\n- For security reasons the password must meet certain conditions such as:\n\
    \    - Contain at least six characters\n    - Contain at least one numerical or\
    \ special character and two alphabetic characters\n    - Be different from the\
    \ login name\n\nThe first time the system is accessed, the password used will\
    \ be the one provided by the administrator of the system. There are several ways\
    \ to end the work session in Linux, depending on whether we are in graphic mode\
    \ or text.\n\n### In-text mode\n1. Press the `<ctrl> d` keys\n2. Enter the exit\
    \ command.\n\n### In graphic mode\nThe output of `X Window` depends on the window\
    \ manager that is running and will be explained later.\n\n# Linux File System\
    \ Structure\n\n## Files: Types\nThe basis of the Linux filing system will include\
    \ the file, which is nothing other than the structure used by the operating system\
    \ to store information on a physical device such as a hard drive, a floppy disk,\
    \ a CD-ROM or a DVD. Naturally, a file can contain any type of information that\
    \ you would ilke, from an image in `PNG` or `JPEG` format to a text or a web page\
    \ in `HTML` format. The file system is the structure that allows Linux to handle\
    \ the files it contains.\n\nAll Linux files have a name, which must comply with\
    \ certain rules:\n- A file name can be between 1 and 255 characters\n- You can\
    \ use any character except the slash `/` and it is not recommended to use the\
    \ characters with special meaning in Linux, which are the following: `= \\ ^ ~\
    \ ' \" \\` ` *; -? [] ( )! & ~ <>`\n- To use files with these characters or spaces\
    \ you must enter the name of the file between quotation marks.\n- Numbers can\
    \ also be used if desired.\n- Uppercase and lowercase letters are considered different,\
    \ and therefore `letter.txt` is not the same as `Letter.txt` or `letter.Txt`\n\
    \nAs in Windows, a certain \"type\" criterion can be used to mark the different\
    \ kinds of files using a series of characters at the end of the name that indicates\
    \ the type of file in question. So, the text files, `HTML`, `PNG` or `JPEG` images\
    \ have extensions `.txt`, `.htm` (or `.html`), `.png` and `.jpg` (or `.jpeg`)\
    \ respectively.\n\nDespite this, Linux only distinguishes three types of files:\n\
    - Files or ordinary files are those mentioned above\n- Directories (or folders),\
    \ is a special file that groups other files in a structured way\n- Special files\
    \ are the basis on which Linux sits since they represent the devices connected\
    \ to a computer, such as a printer. In this way, enter information in that file\
    \ is equivalent to sending information to the printer. For the user, these devices\
    \ have the same appearance and use than ordinary files.\n\n## Links\nLinks are\
    \ an ordinary file type that have the goal to create a new name for a determined\
    \ file. Once the symbolic link is created, it allows access to the file that links\
    \ in the same way as if we had copied the contents of it to another file, with\
    \ the advantage that it has not really been copied. The symbolic links are especially\
    \ useful when you want a group of people to work on the same file since they allow\
    \ sharing the file but centralizing the modifications.\n\nAs an example, you can\
    \ assume the existence of a file called `balance.1999.txt`, to which a link is\
    \ created symbolic `balance.txt`. Any access to `balance.txt` is translated by\
    \ the system so that you access the `balance.1999.txt`.\n\n## The Path\nIn any\
    \ modern operating system, the file structure is hierarchical and depends on the\
    \ directories. In general, the file system structure resembles a tree structure,\
    \ each node being composed of a directory or folder, which contains other directories\
    \ or files. In Windows, each disk drive is identified as a basic folder that serves\
    \ as root to others. On Linux, there is a single root called `/` from which all\
    \ files and directories hang, and that is independent of which devices are connected\
    \ to the computer.\n\nThe path or path of a file or directory is the sequence\
    \ of directories that must be traversed to access a certain file separated by\
    \ `/`. There are two forms of the path:\n- The absolute path that shows the entire\
    \ path to a file, `/home/luis/Carta.txt`\n- The path relative to a certain directory,\
    \ for example, if we cannot find the `/home` directory, the path relative to the\
    \ file `Letter.txt` is `Luis/Letter.txt`.\n\nTo complicate matters further, all\
    \ directories contain two special directories:\n"
