    the kernel code (which belongs to its various subsystems) and the code of the
    user programs are executed at the same time. There are different actions: some
    programs and subsystems follow the instructions of the processor. Others are busy
    with I / O, some still wait for requests from the user or other applications. To
    simplify the management of these actions in the system, it is advisable to allocate
    a set of elementary active elements and to define the interface of OS interaction
    with these elements.The process  means the abstraction of the OS, which combines
    everything necessary to execute one program at a certain point in time. The program
    is some sequence of machine commands stored on disk, and if necessary, is loaded
    into memory and executed. It can be said that at run time, the program represents
    a process.A one-to-one correspondence between a program and a process is established
    only at a specific point in time: one process at a time can execute the code of
    several programs, the code of one program can execute several processes at the
    same time.Successful programs require some resources. They include:❖         Resources
    required for sequential execution of program code (primarily CPU time)❖       
    Resources that allow storing information that ensures the execution of the program
    code (CPU registers, RAM, etc.); these resource groups identify two components
    of the process❖         The sequence of executable commands of the processor❖
            Set addresses memory '' memory ( address space ), which are these commands
    and data for themThe selection of these parts is also justified by the fact that
    within the same address space may be several sequentially executed sequences of
    commands that share the same data. The need to distinguish between the sequence
    of commands and the address space leads to the concept of flow .A  thread (control
    thread) is called a set of sequentially executed processor commands that use the
    shared process space. Since there can be many threads at a time, the OS''s task
    is to organize the switching of the processor between them and to plan their execution. In
    multiprocessor systems, the code for individual threads can be executed on separate
    processors.Thus, the process is  called the set of one or more threads and the
    protected address space in which these threads are executed. The security of the
    process address space is its most important characteristic. The process code and
    data cannot be directly read or overwritten by another process; thus protecting
    themselves from the rich bugs and unauthorized access attempts. Naturally, only direct 
    access is inadmissible (for example, writing to memory using a simple data transfer
    instruction); the exchange of data between processes is, in principle, possible,
    but for this purpose special means, which are called means of interprocess interaction, 
    should be used.  Such tools are more difficult than direct access and run slower,
    but provide protection against accidental errors when accessing data.Unlike the
    process flows managing total memory, stream data is not secured against access
    to other streams provided that they are all executed in the address space of the
    same process. This provides additional application development capabilities but
    complicates programming .The protected alert process space sets the abstraction
    of code execution on a single machine, and the thread provides an abstraction
    of sequential command execution on a single dedicated processor. The address space
    of the process does not always correspond to RAM addresses. For example, it may
    display files or registers of the I / O controllers, so writing to a specific
    address in this space will either write to a file or perform an I / O operation. This
    technology is called the reflection in memory  ( memory mapping ).Process and
    Flow ModelsThe maximum number of processes (secure address spaces) and the threads
    that they execute may vary across systems.❖        In single-tasking systems,
    there is only one address space in which one stream can be executed at any one
    time❖        Some embedded systems also have one address space (one process),
    but it allows many threads to execute. In this case, parallel computations can
    be organized, but data protection is not implemented❖        In systems similar
    to traditional UNIX versions, many processes are allowed, but only one thread
    is executed within the process address space. This is a traditional single-threaded 
    process model.  The concepts of flow in this model do not apply but use the term
    "switching between processes", "process planning", " sequence of process commands"
    and the like (here by the term process, we mean a single flow)❖         Most modern
    operating systems (such as the Windows XP line, modern versions of UNIX ) can
    have many processes in the address space of each process. These systems support
    multithreading or implement a flow model. A process in such a system is called
    a multithreaded processIn the future, the term “flow” is used to refer to the
    sequence of executing commands, except in situations where the implementation
    of the process model will be discussed.Process and Flow ComponentsThe elements
    of the process include:❖         Protected address space❖         Data common
    to the whole process (these data can be shared usage of all its streams)❖        
    Resource usage information (open files, network connections)❖         Process
    flow informationThe stream contains the following elements:❖  The state of the
    processor (a set of current data from its registers), including the counter of
    the current instruction of the processor❖        Flow stack (the memory area where
    the local flow variables and function return addresses are called in its code)Process
    And Flow StatesThe following states are allowed for the stream:❖         Creation
    ( new ) - the thread is in the process of creation❖         Execution ( running
    ) - instruction stream processor performs (at a particular time on a single processor,
    only one thread can be in this state)❖         Waiting ( waiting ) - awaiting
    some event flow (such as completion operations); this state is also called with
    a blocked and terminated flow❖        Readiness  ( ready ) - Stream expects scheduler
    switches CPU at him when it has all the necessary resources, in addition to CPU
    time❖        Terminated (  terminated ) - the thread has completed execution (unless
    its resources have been removed from the system, it goes into an additional state
    -  a zombie state )The transition of flows between standby and readiness states
    is based on task planning  or flow planning.  When scheduling threads, determine
    which threads need to be restored after completing the I / O operation, how to
    organize the system expectations.The transition between standby and execution
    states requires a processor time schedule . Based on the algorithms of such planning,
    determine which of the finished threads need to be executed at a specific time,
    when do you need to interrupt the execution of the thread to switch to another
    ready thread and so on.With regard to systems that implement the process model,
    it is customary to talk about the state of processes, not flows, and the planning
    of processes; in fact, the states of the process in this case clearly correspond
    to the states of its single flow.Description Of Processes And FlowsAs we already
    know, one of the main tasks of the operating system is the allocation of resources
    between processes and flows. These resources are primarily CPU time (distributed
    between streams during scheduling), I / O, and memory (shared between processes).To
    manage the allocation of resources, the OS must support data structures that contain
    information describing processes, flows, and resources. The following data structures
    include:❖  Resource allocation tables: memory tables, I / O tables, file tables,
    etc.❖        Process tables and flow tables that provide information about the
    processes and flows present in systems at a specific point in timeManaging Process
    And Flow BlocksInformation about the processes and flows in the system is stored
    in special data structures, which are called process control blocks and flow control
    blocks. These structures are very important for the OS because on the basis of
    their information system manages processes.Managing power flow  ( Thread Control Block
    or TCB ) to an active flow, ie that which is in a state of readiness, expectation
    or execution. This block may contain the following information:❖         Flow
    identity (usually its unique identifier)❖         Flow processor status: custom
    processor registers, instruction counter, the stack pointer❖         Flow planning
    informationTable streams - is a list or array of flow control units. It is located
    in a protected area of ​​ the OS memory. The managing unit process  ( Process Control Block or PCB )
    corresponds to the process that is present in the system. Such block may contain:❖  Process
    identity (unique identifier information about other processes related to adan)❖
           Information about the threads that are running in the address space of
    the process (for example, pointers to their control blocks)❖        Information
    that allows you to determine the rights of a process to use different resources
    (for example, the user ID that created the process)❖         Process address allocation
    information❖         Information about I / O resources and files used by the processProcess
    And Flow ImagesThe totality of the information displayed in the memory process
    called the image process , and all information flow (thread image). The image
    process includes:❖         Process control unit❖         User code❖         User
    data (global program data common to all threads)❖         Process flow pattern
    informationThe user program code, user data, and stream information are loaded
    into the process address space. The image process is generally not a continuous
    section of memory, its parts are unloaded to disk. The streaming image includes:❖
            Flow control unit❖         Kernel stack (the flow stack used when executing
    kernel flow code)❖         User stack (stream stack available in user mode)Creating
    and Completing Processes and ThreadsThe process creation and termination tools
    allow you to dynamically change the set of applications that are running on the
    operating system. Thread creation and completion tools are the basis for creating
    multithreaded applications.Creating ProcessesBasic principles of process creationProcesses
    can be created by the kernel of the system during its initialization. For example,
    in UNIX- compatible systems, such a process can be the process of initialization
    of the in-it system, in Windows XP - the processes of subsystems ( Win 32 or POSIX ). This
    creation process, however, is the exception, not the PR and the fork .Most often,
    processes are created when performing other processes. In this case, a process
    that creates another process is called an ancestor and the process created by
    it is called a descendant. New processes can be created while the application
    is running according to its logic (the compiler can create processes for each
    compilation step, the web server can handle the incoming requests), or directly
    at the request of the user (for example, from a command interpreter, graphical
    shell, or file manager).Interactive And Background ProcessesThere are two types
    of background processes in terms of their interaction with the user.❖        Interactive
    processes  interact with users directly, receiving input from the keyboard, mouse,
    and more. An example of an interactive process is the process of a text editor
    or an integrated development environment❖        Background processes  do not
    interact with the user directly. They are usually started at system startup and
    are waiting for requests from other applications. Some of them (system processes)
    support the functioning of the system (implement background printing, networking
    tools, etc.), others exclude specialized tasks (implement web servers, database
    servers, etc.). Background processes are also called services ( services, in Windows XP systems )
    or demo about us (daemons, on UNIX)Managing Address Space When Creating ProcessesBecause
    the core element of the process is secure address space, it is important to solve
    the problem of allocating it when creating a new process. Consider two different
    approaches.System Calls Fork ()  Exec ()In the first approach, the descendant''s
    address space is created as an exact copy of the ancestor''s address space. This
    operation is implemented by a system call, which is POSIX systems, which is called fork ().
    In this case, not only the address space is copied, but also the counter of the
    mainstream process commands, so after calling fork () the ancestors and descendants
    will follow the same instruction. The developer must determine which of the two
    processes should be managed. This can be done based on the differences between
    the fork () return codes for the ancestor and the descendant.When the creation
    of a new process occurs by duplicating the ancestral address space, there is a
    need for special means of loading the code into the address space of the process. Such
    tools are implemented by a system call, which is POSIX systems, which is called exec (). As
    an option to call exec() must specify the full path to the executable program
    to be loaded into memory. In fork () -based systems, in order to run the program, you
    must immediately call exec () after calling fork () (this is called fork + exec technology ).Run
    The Application With One System CallThe second approach does not separate address
    space duplication and code loading - these steps are combined here into one. In
    this case, the system call triggers the specified application to execute (usually
    it needs to specify the entire path to the executable file of this application). It is to
    be divided into two stages of implementation of the system call:❖        Allocation
    of memory '' memory address space under the new process (with no information from
    the address space ancestor is not copied)❖         Download executable code from
    the specified file into the highlighted address spaceThe approach using fork()
    and exec() is more flexible, as it allows you to limit yourself to one single
    step of starting an application if necessary. Modern operating systems mainly
    implement a combination of first and second approaches .Features Of Process CompletionConsider
    three options for completing processes. The process correctly completes  on its
    own after completing its task (for interactive processes, this is often done at
    the initiative of a user who, for example, used the appropriate menu item). To
    do this, the process code must perform a system call to complete the process. This
    call on POSIX systems is called _ exit (). It can turn the process that caused
    it.The process crashes  due to an error. This output can be provided by the programmer
    (error when processing a decision that the program cannot continue) and may be
    due to the generation of interruption (division by zero, access to a secure area
    memory '' memory, etc.).The process is completed by another process  or system
    kernel. For example, before the OS shutdown, the kernel stops performing all processes. The
    process can terminate a process through systems is the many calls which in POSIX -a
    system called kill ().Once the process completes its work memory reserved for
    its address space is freed and can be used for other purposes. All flows of this
    process also cease to exist. If there are descendants in this process, their work
    is preferably not terminated after the work of the ancestor. The online processes
    are usually terminated when the user logs off.Synchronous And Asynchronous Execution
    Of ProcessesWhen the system is a new process for the old process, there are two
    basic options:❖         Continue execution in parallel with the new process -
    this mode of operation is called asynchronous execution❖         Suspend execution
    until the new process is complete - this is called synchronous execution. (In
    this case, they use a special system call, which is POSIX systems, is called wait
    ()The choice of a particular model depends on the specific task. For example,
    a web server can create descendant processes to handle requests (if the descendant
    set is not enough to handle that request). In this case, the processing must be
    asynchronous, as soon as the descendant is created and the ancestor must be ready
    to receive the next request. Compiler C, on the other hand, must wait for the
    completion of each step before proceeding to the next stage, in which case they
    use synchronous processing .Creating and Completing StreamsFeatures Of Creating
    StreamsSetting up streams is different, related primarily to the fact that the
    currents are created within an existing address space (or a particular kernel
    process). There are several situations that can be a new stream.If a process is
    created by a fork () system call, flow is automatically created after the distribution
    of the address space within that process (often the main application flow). You
    can create streams from the user code with an appropriate system call.Many operating
    systems have special threads that create the kernel of the system (the kernel
    code can also be executed in threads). When creating a stream, the system must
    follow these steps.'
