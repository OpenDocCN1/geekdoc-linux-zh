- fmt: "\n# 1 Create data structures that reflect the flow in the OS\n# 2 Select city\
    \ at the stack of flow\n# 3 Set the processor command counter to the beginning\
    \ of the code to be executed in the thread; this code is called a `stream procedure`\
    \ or `function`, and the `ng pointer` is referred to as a stream call or system\
    \ call. Note that when creating flows, as opposed to the creation process, there\
    \ is no need to allocate memory for the new address space, so usually flows are\
    \ created faster and with lesser resources.\n\n## Features Completion Streams\n\
    At the end of the stream, its resources are released (first of all, the folder);\
    \ this operation is usually faster than completing the process. The flow may be\
    \ completed when the control reaches the end of the flow procedure; there are\
    \ also special system calls intended for early termination of flows.\n\nLike processes,\
    \ threads can be executed synchronously and asynchronously. A thread that created\
    \ another thread may pause its execution until it is completed. This expectation\
    \ is called `joining streams` (`thread joining`). Upon completion of the attached\
    \ thread, the thread that was waiting to complete it may receive execution status.\
    \ When creating a stream or joining it, if the stream cannot connect, it is called\
    \ `disconnected` or `detached`. If the stream is not disconnected, it is called\
    \ `Pluggable`, after which it is necessary to join `them` to stop memory leakage.\n\
    \n## Managing Processes In UNIX and Linux\n### Image Of The Process\nIn UNIX systems,\
    \ the process image contains the following components:\n- Process control unit\n\
    - The code of the program executed by the process\n- The process stack where temporary\
    \ data is stored (procedure parameters, return values, local variables, etc.)\n\
    - Global data common to the whole process\n\n### Identification Information And\
    \ Process Security Attributes\nThe process identifier (`PID`) is unique throughout\
    \ the system and is used to access this process. The `init` process identifier\
    \ is always one. The process ID of the ancestor (`ppid`) is specified when it\
    \ is created. If the ancestor of process `P` completes execution, the ancestor\
    \ of that process automatically becomes `init`, so `ppid` for `P` will be unity.\n\
    \nWith the process as `fl '` related set of security attributes:\n- The real user\
    \ and process group identifiers (`uid`, `gid`) correspond to the user who started\
    \ the program, resulting in the corresponding process appearing on the system\n\
    - Effective user and process group identifiers (`euid`, `egid`) are used in a\
    \ special process execution mode - are owned by the owner\n\n### Process Control\
    \ Unit\nConsider the structure of the process control unit in Linux. The process\
    \ control block on Linux is displayed by the `task_struct` data structure. The\
    \ most important fields in this structure are fields that contain the following\
    \ information:\n- Identification data (including `pid` - process identifier)\n\
    - Process status (execution, expectations, etc.)\n- Pointers to ancestral and\
    \ descendant structures\n- Process creation time and total execution time (so-called\
    \ process timers)\n- Processor state (contents of registers and counter of instructions)\n\
    - Process security attributes (`id`, `gid`, `euid`, `egid`)\n\nNote that the Linux\
    \ kernel does not have a separate data structure for the stream, so the processor\
    \ status information is contained in the control block of the process. In addition\
    \ to the above, `task_struct` has several custom fields required for different\
    \ Linux subsystems:\n- Information for signal processing\n- Process planning information\n\
    - About files and directories floor ' ' related to the process\n- Data structure\
    \ for managing memory subsystems\n\nThe `task_struct` field `data` can be shared\
    \ by several special purpose processes, in which case these processes are actually\
    \ threads. The control units of the process are stored in the kernel in a special\
    \ data structure. Prior to the release of kernel 2.4, this structure was called\
    \ a system process table; it was an array whose maximum length could not exceed\
    \ 4K. In the core processes, it has been replaced by two dynamic data structures\
    \ that do not have such a restriction:\n- A hash table (where the `pid` of the\
    \ process acts as a hash), this structure allows you to quickly find the process\
    \ by its ID\n- Ring list, this structure ensures the implementation of actions\
    \ in the loop for all system processes.\n\nNow the limit on the maximum number\
    \ of processes is checked only within the implementation of the `fork()` function\
    \ and depends on the amount of available memory (for example, there is information\
    \ that on a system with 512 MB of memory it is possible to create about 32000\
    \ processes).\n\nThe implementation of a control unit in Linux is different from\
    \ its traditional implementation in UNIX systems. In most versions of UNIX (System\
    \ V, BSD), the process control block consists of two data layers - a process structure\
    \ (`proc`) and a user structure (`u`).\n\n## Creation Process\n### Implementation\
    \ Of The Fork () in Linux\nIn UNIX-compatible systems, processes create an already\
    \ known system call `fork()`. Let's consider its implementation in Linux.\n\n\
    1. Allocate memory for the new process control block (`task_struct`). If memory\
    \ is not enough, it returns an error.\n2. All values from the ancestral data structure\
    \ are copied to the descendant data structure. After that, the fields whose values\
    \ should be different from the original ones will be changed. If the user exceeds\
    \ the specified number of processes for him or if the number of processes in the\
    \ system exceeds the maximum possible value (which depends on the amount of available\
    \ memory), the process creation stops and an error returns.\n3. An identifier\
    \ (`pid`) is generated for the process using a special algorithm to guarantee\
    \ uniqueness.\n4. For the descendant, the necessary ancestral data structures\
    \ (table of file descriptors, information about current directory, table of signal\
    \ handlers, etc.) are copied.\n5. Form the address space of the process.\n6. The\
    \ process data structure is placed in the list and hash table of system processes.\n\
    7. The process is put into readiness for execution.\n\n### Using Fork () In Applications\n\
    Consider an example of using a `fork()` system call to create a process. The description\
    \ of `fork()` according to POSIX looks like this:\n```\n#include <unistd.h>\n\
    pid_t fork();\n```\nSince executing `fork()` causes the control of both the ancestor\
    \ and the descendant to switch to an operator, which after calling `fork()` (both\
    \ begin to execute one instruction), practically the only difference between the\
    \ ancestor and the descendant in the programmer's view is in the code return `fork()`.\
    \ For descendant `fork()` returns zero and for ancestor the id (`pid`) of the\
    \ created descendant process. When for some reason the descendant was not created,\
    \ `fork()` will return -1. Therefore, the normal code for fork () looks like this:\n\
    \n```c\npid_t pid;\nif ((pid = fork()) == -1){\n    /* error, crash */\n}\nif\
    \ (pid == 0){\n    // is a descendant\n}else{\n    // this is the ancestor\n \
    \   printf (\" Descendant started with code %d \\n\", pid);\n}\n```\nOnce the\
    \ process is created, it can access the identifying information by a system call\
    \ to `getpid()` which returns the current process ID, and `getppid()`, which returns\
    \ the process ID of the ancestor:\n\n```c\n#include <unistd.h>\npid_t mypid, parent_pid;\n\
    mypid = getpid();\nparent_pid = getppid();\n```\n\n### Completing The Process\n\
    To end the process, UNIX systems use the `_exit()` system call. Consider implementing\
    \ this system call in Linux. The following actions occur during its execution.\n\
    \n1. The status of the process shines through `TASK_ZOMBIE`.\n2. The process informs\
    \ the ancestors and descendants that it has ended (with the help of special signals).\n\
    3. The resources allocated during the `fork()` call are released.\n4. The scheduler\
    \ is informed that the context can be switched.\n"
