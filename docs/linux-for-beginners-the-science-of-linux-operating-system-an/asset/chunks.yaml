    \    *   `Workstation`\n    *   `Server`\n    *   `Graphic environment`\n    *\
    \   `Office workstation`\n    *   `Webserver / FTP`\n    *   `KDE station`\n \
    \   *   `Play Station`\n    *   `Mail`\n    *   `Gnome station`\n    *   `Multimedia\
    \ station`\n    *   `Database server`\n    *   `Internet station`\n    *   `Firewall\
    \ Server / Router`\n    *   `DNS / NIS`\n    *   `Scientific workstation`\n  \
    \  *   `Console tools`\n    *   `Network server`\n*   `Root password`: The installation\
    \ program asks you to enter a root password with which you will be able to access\
    \ all the areas of the system, which as a normal user is not possible.\n*   `Creation\
    \ of a user`: The installation program asks for a login and password, for the\
    \ creation of the first user, which does not have the necessary permissions.\n\
    *   `Boot loader`: Another point to consider is how you want to boot `Linux`.\
    \ If `Windows` exists, the easiest way is to use `LILO` or `GRUB`, which are responsible\
    \ for starting the PC. Problems will arise to boot `Linux` if there is an option\
    \ to reinstall `Windows` again, since this assumes control of the PC and boot\
    \ system, removing `LILO` (and preventing boot). Another very simple way would\
    \ be to use floppy disk that is created during the installation of `Linux`.\n\
    *   `Installation exit`: The user is informed of the installed services and the\
    \ installation program is finished. Once `Linux` is first started, the wizard\
    \ will start and allow you to configure basic system items, such as the type of\
    \ desktop to use; KDE, Gnome, etc. \n\n## Conclusions\n\nThe OS architecture defines\
    \ a set of components, as well as how they interact with each other and with the\
    \ environment. The most important for studying the architecture of the OS is the\
    \ concept of `core`. The core feature of the `kernel` is that it runs in privileged\
    \ mode.\n\n`Monolithic architecture` requires that the core functions of the system\
    \ be concentrated in the kernel, its most important advantage being performance.\
    \ `Micro-kernel architecture` in privileged mode, only basic functions are performed,\
    \ the main advantages of such systems are reliability and flexibility. Modern\
    \ computer architectures offer many system support tools: the operating system\
    \ interacts with applications. It provides a set of system calls to access functions\
    \ implemented in the kernel. For applications, system library tools are accessible.\n\
    \n# Chapter 3: Process and Flow\n\nConsider two major abstractions of the operating\
    \ system that describe the execution of the program code: `processes` and `flows`\
    \ - features of their implementation in the operating system, the states in which\
    \ they may reside, basic mechanisms for working with them (means of creation,\
    \ termination, etc.).\n\n## Basic concepts of processes and flows\n\nIn today's\
    \ operating system, the kernel code (which belongs to various subsystems) and\
    \ the user programs are executed at the same time. There are different actions:\
    \ some programs and subsystems follow the instructions of the processor. Others\
    \ are busy with I/O, some wait for requests from the user or other applications.\
    \ To simplify the management of these actions in the system, it is advisable to\
    \ allocate a set of active elements and define the interface of OS interaction\
    \ with these elements. The `process` means the abstraction of the OS, which combines\
    \ everything necessary to execute one program at a certain point in time. The\
    \ program is some sequence of commands stored on disk, and if necessary, is loaded\
    \ into memory and executed. A one-to-one correspondence between a program and\
    \ a process is established only at a specific point in time: one process at a\
    \ time can execute the code of several programs, the code of one program can execute\
    \ several processes. Successful programs require some resources:\n\n*   Resources\
    \ for sequential execution of program code (primarily CPU time)\n*   Resources\
    \ that allow storing information that ensures the execution of the program code\
    \ (CPU registers, RAM, etc.); these resource identify components of the process\n\
    *   The sequence of executable commands of the processor set addresses memory\
    \ (`address space`), which are these commands and data for them\n\nThe selection\
    \ of these parts is also justified by the fact that within the same address space\
    \ may be several sequentially executed commands that share the same data. The\
    \ need to distinguish between the sequence of commands and the address space leads\
    \ to the concept of flow. A `thread` (control thread) is called a set of sequentially\
    \ executed processor commands that use the shared process space. Since there can\
    \ be many threads at a time, the OS's task is to organize the switching of the\
    \ processor between them and to plan their execution. In multiprocessor systems,\
    \ the code for individual threads can be executed on separate processors. Thus\
    \ the `process` is called the set of one or more threads and the protected address\
    \ space in which these threads are executed. The security of the process address\
    \ space is its most important characteristic. The process code and data cannot\
    \ be directly read or overwritten by another process; thus protecting themselves\
    \ from bugs and unauthorized access. Naturally, only direct access is inadmissible\
    \ (for example, writing to memory using a simple transfer instruction); the exchange\
    \ of data between processes is, in principle, possible, but for this purpose special\
    \ means, which are called interprocess interaction, should be used. Such tools\
    \ are more difficult than direct access and run slower, but provide protection\
    \ against accidental errors when accessing data. Unlike process flows managing\
    \ total memory, stream data is not secured against access to other streams provided\
    \ that they are all executed in the address space of the same process. This provides\
    \ additional development capabilities but complicates programming. The protected\
    \ process space sets the abstraction of code execution on a single machine, and\
    \ the thread provides an abstraction of sequential command execution on a single\
    \ dedicated processor. The address space of the process does not always correspond\
    \ to RAM addresses. For example, it may display files or registers of the I/O\
    \ controllers, so writing to a specific address in this space will either write\
    \ to a file or perform an I/O operation. This technology is called the reflection\
    \ in memory (`memory mapping`).\n\n## Process and Flow Models\n\nThe maximum number\
    \ of processes (secure address spaces) and the threads they execute may vary across\
    \ systems:\n\n*   In single-tasking systems, there is only one address space in\
    \ which one stream can be executed at any one time.\n*   Some embedded systems\
    \ also have one address space (one process), but it allows many threads to execute.\
    \ In this case, parallel computations can be organized, but data protection is\
    \ not implemented.\n*   In systems similar to traditional `UNIX` versions, many\
    \ processes are allowed, but only one thread is executed within the process address\
    \ space. This is a traditional single-threaded process model. The concepts of\
    \ flow in this model do not apply but use the term \"switching between processes\"\
    , \"process planning\", \"sequence of process commands\" and the like (here by\
    \ the term process, we mean a single flow).\n*   Most modern operating systems\
    \ (such as `Windows` line, modern versions of `UNIX`) can have many processes\
    \ in the address space of each process. These systems support multithreading or\
    \ implement a flow model. A process in such a system is called multithreaded process.\
    \ In the future, the term \"flow\" is used to refer to the sequence of executing\
    \ commands, except in situations where the process model will be discussed.\n\n\
    ## Process and Flow Components\n\nThe elements of the process include:\n\n*  \
    \ Protected address space\n*   Data common to the whole process (these data can\
    \ be shared usage of all streams)\n*   Resource usage information (open files,\
    \ network connections)\n\nFlow information contains the following elements:\n\n\
    *   The state of the processor (a set of current data from its registers), including\
    \ the counter of the current instruction of the processor\n*   Flow stack (the\
    \ memory area where local variables and function return addresses are called in\
    \ its code)\n\n Process And Flow States\n\nThe following states are allowed for\
    \ the stream:\n\n*   `Creation (new)`: the thread is in process of creation.\n\
    *   `Execution (running)`: processor performs (at a particular time, only one\
    \ thread can be in this state).\n*   `Waiting (waiting)`: awaiting some event\
    \ (such as completion operations); this state is also called blocked and terminated\
    \ flow.\n*   `Readiness (ready)`: scheduler switches CPU when it has all the necessary\
    \ resources, in addition to CPU time.\n*   `Terminated (terminated)`: the thread\
    \ has completed execution (unless its resources have been removed from the system,\
    \ it goes into an additional state - zombie state).\n\nThe transition of flows\
    \ between standby and readiness states is based on planning or flow planning.\
    \ When scheduling, determine which threads need to be restored after completing\
    \ I/O operation, how to organize system expectations. The transition between standby\
    \ and execution states requires processor time. Based on algorithms of such planning,\
    \ determine which of the finished threads need to be executed at a specific time,\
    \ when you need to interrupt the execution of the thread to switch to another\
    \ thread and on. With regard to systems that implement the process model, it is\
    \ customary to talk about the state of processes, not flows, and the planning\
    \ of processes.\n\n## Description Of Processes And Flows\n\nAs we already know,\
    \ one of the main tasks of the operating system is the allocation of resources\
    \ between processes and flows. These resources are primarily CPU time (distributed\
    \ during scheduling), I/O, and memory (shared between processes). To manage allocation\
    \ of resources, the OS must support data structures that contain processes, flows,\
    \ and resources. The following data structures include:\n\n*   Resource allocation\
    \ tables: memory tables, I/O tables, file tables, etc.\n*   Process tables and\
    \ flow tables that provide information about processes and flows present in systems\
    \ at a specific point in time.\n\n## Process And Flow Blocks\n\nInformation about\
    \ the processes and flows in the system is stored in special data structures,\
    \ called process control blocks and flow blocks. These structures are very important\
    \ for the OS because on the basis of their information system manages processes.\
    \ Managing power flow: `Thread Control Block` (`TCB`) to an active flow, ie which\
    \ is in a state of readiness or execution. This block may contain the following\
    \ information:\n\n*   Flow identity (usually its unique identifier)\n*   Processor\
    \ status: custom processor registers, instruction counter, stack pointer\n*  \
    \ Flow planning information - is a list or array of flow control units. It is\
    \ located in protected area of the OS memory. The `Process Control Block` (`PCB`)\
    \ corresponds to the process that is present in the system. Such block may contain:\n\
    \n*   Process identity (unique identifier about other processes related to)\n\
    *   Information about threads that are running in the address space of the process\
    \ (for example, pointers to their control blocks)\n*   Information that allows\
    \ you to determine the rights of a process to use different resources (for example,\
    \ the user ID that created the process)\n*   Process allocation information\n\
    *   Information about I/O resources and files used by the process\n\n## Process\
    \ And Flow Images\n\nThe totality of the information displayed in memory called\
    \ image process, and all information flow (image includes):\n\n*   Process control\
    \ unit\n*   User code\n*   User data (global program common to all threads)\n\n\
    The user program code, user data, and stream information are loaded into the process\
    \ address space. The image process is generally not a continuous section of memory,\
    \ its parts are unloaded to disk. The streaming image includes:\n\n*   Flow control\
    \ unit\n*   Kernel stack (the flow used when executing kernel code)\n*   User\
    \ stack (stack available in user mode)\n\n# Creating and Completing Processes\
    \ and Threads\n\nThe process creation and termination tools allow you to dynamically\
    \ change the set of applications that are running on the operating system. Thread\
    \ creation and completion tools are the basis for creating multithreaded applications.\n\
    \n### Creating Processes\n\nProcesses can be created by the kernel of the system\
    \ during its initialization. For example, in `UNIX`-compatible systems, such a\
    \ process can be the process of initialization of the system, in `Windows XP`\
    \ - the processes of subsystems (`Win32` or `POSIX`). This creation process, however,\
    \ is the exception, not the PR and `fork`. Most often, processes are created when\
    \ performing other processes. In this case, a process that creates another process\
    \ is called an ancestor and the process created by it is called a descendant.\
    \ New processes can be created while the application is running according to its\
    \ logic (the compiler can create processes for each compilation step, the web\
    \ server can handle the incoming requests), or directly at the request of the\
    \ user (for example, from a command interpreter, graphical shell, or file manager).\n\
    \n### Interactive And Background Processes\n\nThere are two types of background\
    \ processes in terms of their interaction with the user:\n\n*   `Interactive processes`:\
    \ interact with users directly, receiving input from the keyboard, mouse, and\
    \ more. An example of an interactive process is the process of a text editor or\
    \ integrated development environment.\n*   `Background processes`: do not interact\
    \ with the user directly. They are usually started at system startup and are waiting\
    \ for requests from other applications. Some of them (system processes) support\
    \ the functioning of the system (implement background printing, networking tools,\
    \ etc.), others exclude specialized tasks (implement web servers, database servers,\
    \ etc.). Background processes are also called services (services, in `Windows\
    \ XP` systems) or demo about us (daemons, on `UNIX`).\n\n### Managing Address\
    \ Space When Creating Processes\n\nBecause the core element of the process is\
    \ secure address space, it is important to solve the problem of allocating it\
    \ when creating a new process. Consider two different approaches:\n\n### System\
    \ Calls `fork()` and `Exec()`\n\nIn the first approach, the descendant's address\
    \ space is created as an exact copy of the ancestor's address space. This operation\
    \ is implemented by a system call, which is `POSIX` systems, which is called `fork()`.\
    \ In this case, not only the address space is copied, but also the counter of\
    \ the mainstream process commands, so after calling `fork()` the ancestors and\
    \ descendants will follow the same instruction. The developer must determine which\
    \ of the two processes should be managed. When the creation of a new process occurs,\
    \ the `Linux` process uses `fork()` and `exec()`. The second approach is to load\
    \ a new program into the existing process address space, which is called `exec()`.\
    \ This is more efficient as it does not require duplicating the entire address\
    \ space.\n"
