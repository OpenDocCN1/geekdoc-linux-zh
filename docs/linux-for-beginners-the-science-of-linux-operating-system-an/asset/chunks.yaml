  trans: "\n\n# 1 创建反映操作系统中流的数据结构\n# 2 在流的栈顶端选择城市\n# 3 将处理器程序计数器设置为线程中要执行的代码开始；这段代码被称为\
    \ `stream procedure`（流过程）或 `function`（函数），`ng pointer`被称为流调用或系统调用。注意，在创建流时，与创建过程不同，不需要为新的地址空间分配内存，因此流的创建通常更快且消耗的资源更少。\n\
    \n## 流的完成\n在流的结束时，其资源会被释放（首先是文件夹）；此操作通常比完成一个进程更快。当控制到达流过程的末尾时，流可能会完成；还有专门用于提前终止流的特殊系统调用。\n\
    \n像进程一样，线程可以同步或异步执行。创建另一个线程的线程可能会暂停其执行，直到该线程完成。这种等待被称为 `joining streams`（线程连接）。当被附加的线程完成后，等待其完成的线程可能会接收到执行状态。在创建或连接流时，如果流无法连接，则被称为\
    \ `disconnected`（断开）或 `detached`（分离）。如果流未断开，则被称为 `Pluggable`（可插的），之后需要连接 `them`\
    \ 以防止内存泄漏。\n\n## 在 UNIX 和 Linux 中管理进程\n### 进程映像\n在 UNIX 系统中，进程映像包含以下组件：\n- 进程控制单元\n\
    - 进程执行的代码\n- 存储临时数据的进程栈（过程参数、返回值、局部变量等）\n- 整个进程通用的全局数据\n\n### 标识信息和进程安全属性\n进程标识符\
    \ (`PID`) 在整个系统中是唯一的，用于访问该进程。`init` 进程的标识符始终为 1。祖先进程的进程 ID (`ppid`) 在其创建时指定。如果进程\
    \ `P` 的祖先完成执行，该进程的祖先会自动变为 `init`，因此 `P` 的 `ppid` 将变为 1。\n\n进程具有 `fl '` 相关安全属性集：\n\
    - 真实用户和进程组标识符 (`uid`, `gid`) 对应于启动程序的用户，导致相应的进程出现在系统中\n- 有效用户和进程组标识符 (`euid`,\
    \ `egid`) 用于特殊的进程执行模式 - 由所有者拥有\n\n### 进程控制单元\n考虑 Linux 中进程控制单元的结构。Linux 进程控制块通过\
    \ `task_struct` 数据结构显示。该结构中最重要的字段是包含以下信息的字段：\n- 标识数据（包括 `pid` - 进程标识符）\n- 进程状态（执行中、等待中等）\n\
    - 指向祖先和后代结构的指针\n- 进程创建时间和总执行时间（所谓的进程计时器）\n- 处理器状态（寄存器内容和指令计数器）\n- 进程安全属性 (`id`,\
    \ `gid`, `euid`, `egid`)\n\n注意，Linux 内核没有单独流的独立数据结构，因此处理器状态信息包含在进程的控制块中。除了上述内容，`task_struct`\
    \ 具有几个不同 Linux 子系统所需的自定义字段：\n- 信号处理信息\n- 进程调度信息\n- 关于进程的文件和目录 floor ' '\n- 管理内存子系统的数据结构\n\
    \n`task_struct` 字段 `data` 可以被几个特殊用途进程共享，在这种情况下，这些进程实际上是线程。进程的控制单元存储在内核的特殊数据结构中。在内核\
    \ 2.4 发布之前，该结构被称为系统进程表；它是一个数组，最大长度不能超过 4K。在核心进程中，它已被两个没有此类限制的动态数据结构取代：\n- 哈希表（进程的\
    \ `pid` 作为哈希值），该结构允许你通过 ID 快速查找进程\n- 环形列表（Ring list），该结构确保所有系统进程在循环中执行动作。\n\n\
    现在对最大进程数量的限制仅在 `fork()` 函数实现内部检查，并取决于可用内存量（例如，有信息表明在 512 MB 内存的系统中可以创建约 32000\
    \ 个进程）。\n\nLinux 中控制单元的实现与其在 UNIX 系统中的传统实现不同。在大多数 UNIX 版本（System V, BSD）中，进程控制块由两个数据层组成——进程结构\
    \ (`proc`) 和用户结构 (`u`)。\n\n## 创建过程\n### Linux 中 fork() 的实现\n在 UNIX 兼容系统中，进程创建一个已知的系统调用\
    \ `fork()`。让我们考虑它在 Linux 中的实现。\n\n1. 为新的进程控制块 (`task_struct`) 分配内存。如果内存不足，返回错误。\n\
    2. 将祖先数据结构中的所有值复制到后代数据结构中。之后，将值应与原始值不同的字段进行更改。如果用户超过了为其指定的进程数，或者系统中的进程数超过了最大可能值（取决于可用内存量），则进程创建停止并返回错误。\n\
    3. 使用特殊算法为进程生成标识符 (`pid`) 以保证唯一性。\n4. 为后代复制必要的祖先数据结构（文件描述符表、当前目录信息、信号处理程序表等）。\n\
    5. 构建进程的地址空间。\n6. 将进程数据结构放入系统进程的列表和哈希表中。\n7. 将进程置于就绪状态。\n\n### 在应用程序中使用 fork()\n\
    考虑一个使用 `fork()` 系统调用创建进程的示例。POSIX 对 `fork()` 的描述如下：\n```\n#include <unistd.h>\n\
    pid_t fork();\n```\n由于执行 `fork()` 会导致祖先和后代的控制切换到操作符，在调用 `fork()` 后（两者都开始执行同一条指令），在程序员看来，祖先和后代之间唯一的区别在于代码返回的\
    \ `fork()`。对于后代，`fork()` 返回 0；对于祖先，返回创建的后代进程的 ID (`pid`)。如果由于某种原因没有创建后代，`fork()`\
    \ 将返回 -1。因此，`fork()` 的正常代码如下：\n\n```c\npid_t pid;\nif ((pid = fork()) == -1){\n\
    \    /* 错误，崩溃 */\n}\nif (pid == 0){\n    // 是后代\n}else{\n    // 这是祖先\n    printf\
    \ (\" Descendant started with code %d \\n\", pid);\n}\n```\n一旦进程创建，它就可以通过系统调用\
    \ `getpid()` 获取标识信息，`getpid()` 返回当前进程 ID，`getppid()` 返回祖先的进程 ID：\n\n```c\n#include\
    \ <unistd.h>\npid_t mypid, parent_pid;\nmypid = getpid();\nparent_pid = getppid();\n\
    ```\n\n### 完成进程\n为了结束进程，UNIX 系统使用 `_exit()` 系统调用。考虑在 Linux 中实现此系统调用。在其执行期间发生了以下动作。\n\
    \n1. 进程状态通过 `TASK_ZOMBIE` 展现。\n2. 进程通知其祖先和后代它已结束（通过特殊信号）。\n3. 在 `fork()` 调用期间分配的资源被释放。\n\
    4. 告知调度器可以切换上下文。\n\n"
- fmt: "\nYou can use either the `_exit()` system call or its `exit()` library function\
    \ to complete the process in applications. This function closes all process threads,\
    \ correctly releases all resources, and calls `_exit()` to actually complete it.\n\
    \n```c\n#include <unistd.h>\nvoid _exit (int status); // status specifies the\
    \ return code\n#include <stdlib.h>\nvoid exit (int status); // status specifies\
    \ the return code\nexit (128);\n```\n\nNote that it is better not to call `exit()`\
    \ when a process can use resources in conjunction with other processes (for example,\
    \ it is a descendant process with an ancestor, and a descendant inherited resource\
    \ descriptors from the ancestor). The reason is that in this case, trying to release\
    \ the resources in the offspring will result in them being released from the ancestors\
    \ as well. You must use `_exit()` to complete these processes.\n\n## Waiting For\
    \ Process To Complete\nWhen the process is completed, its control block is not\
    \ immediately removed from the process list and hash and remains there until another\
    \ process (ancestor) removes it from there. If the process is actually missing\
    \ in the system (it is finished), but only its control unit, then the process\
    \ is called a `zombie process`.\n\n### Waitpid() system call\nYou can use the\
    \ `wait()` system call to remove process information from `Linux`, but more often\
    \ use the more versatile version of it - `waitpid()`. This call checks if the\
    \ control unit of the corresponding process is in the system. If it is, and the\
    \ prz is not in the zombie state (that is, it is still running), then the process\
    \ in the case of `waitpid()` will go to standby. When the descendant process is\
    \ completed, the ancestor exits standby and removes the descendant control unit.\
    \ If the ancestor does not call `waitpid()` for the descendant, it may remain\
    \ in the zombie state for a long time.\n\n## Synchronous Implementation Of Processes\
    \ In Applications\nLet's consider the synchronous execution of processes based\
    \ on `waitpid()`. According to `POSIX`, this system call is defined as:\n\n```c\n\
    # Include <sys/wait.h>\npid_t waitpid ( pid_t pid, // pid of the expected process\n\
    int * status, // descendant completion status information\nint options ); // suppress\
    \ as 0\n```\n\nThe `pid` parameter can be set to 0, which means that the process\
    \ is waiting for the same group to which the ancestor belongs, or as –1, which\
    \ means the expectation of any descendant. Here is an example of the implementation\
    \ of synchronous execution with the expectation:\n\n```c\npid_t pid ;\nif ((pid\
    \ = fork ()) == -1)\n    exit (-1);\nif (pid == 0){\n    // descendant - call\
    \ exec ()\n}else{\n    // ancestor - wait for posterity\n    int status;\n   \
    \ waitpid (pid, & status, 0); // continue execution\n}\n```\n\nThe `status` value\
    \ gives you more information about the completed descendant process. There are\
    \ a number of macros with `<sys/wait.h>`:\n\n- `WIFEXITED(status)` - a non-zero\
    \ value when the descendant of a step has completed normally;\n- `WEXITSTATUS(status)`\
    \ - descendant return code (only when `WIFEXITED()` != 0).\n\nThe descendant return\
    \ code is obtained as follows:\n```c\nwaitpid (pid, & status, 0);\nif (WIFEXITED\
    \ (status))\n    printf (\" Descendant ended with code % d \\n\", WEXITSTATUS\
    \ (status)) ;\n```\n\n## 5/7 Alerts\nIn the case of multitasking, there is a need\
    \ to report processes about events occurring in the system or other processes.\
    \ The simplest mechanism for this alert, defined by `POSIX`, is the `alerts`.\
    \ The process after receiving the signal immediately responds to his call special\
    \ functions - a handler of the signal (`signal handler`), or action by default\
    \ for this signal with each signal related to its number, which is unique in the\
    \ system. No other information along with the signal can be transmitted.\n\nAlarms\
    \ are the simplest mechanism for interprocess on `UNIX` systems but since they\
    \ allow the transmission of limited data, they are mainly used for event reporting.\n\
    \n### Types Of Signals\nDepending on the circumstance, the signals are divided\
    \ into synchronous and asynchronous.\n\n- **Synchronous signals** occur during\
    \ the execution of an active process stream (usually through an error - access\
    \ to the wrong memory area, incorrect floating-point operation, execution of incorrect\
    \ and n processor design). These signals are generated by the OS kernel immediately\
    \ sends them to the process whose thread was causing the error.\n- **Asynchronous\
    \ signals** can be received by the process at any time of execution:\n    - A\
    \ programmer can send an asynchronous signal to another process using a system\
    \ call, which is `POSIX` systems, is called `kill()`, the parameters of that call\
    \ are the signal number and process identifier.\n    - The signal may also be\
    \ caused by some external event (keystroke, termination, etc.)\n\nDuring the processing\
    \ of such signals, the system must interrupt the execution of the current code,\
    \ execute the processor code and return to the same instruction that was executed\
    \ at the time of receiving the signal.\n\n### Layout Of Signals\nOn receipt of\
    \ the signal process can respond in one of the three ways (method response process\
    \ called signal alert disposition):\n- Call the signal handler\n- Ignore a signal\
    \ that in this case \"disappears\" and does not take any action\n- Use the default\
    \ allocation (this is the default setting for each signal, often ending the process)\n\
    \n### Signal Blocking\nThe process can not only set the position of signals but\
    \ also determine its willingness to receive signals of a certain type at that\
    \ moment. If the process is not ready, it can block these signals. If a locked\
    \ signal to be delivered to a process, the system queues it where it will stay\
    \ and remains until the process unlocks it. The process locks and unlocks signals\
    \ by changing the `process signal mask` (a special data structure that stores\
    \ information about what signals can be delivered to the process immediately,\
    \ usually stored in its control block). The descendant processes inherit the ancestral\
    \ signal mask.\n\n### Examples Of Signals\nConsider the signals by `POSIX` and\
    \ supported in `Linux` (in parentheses next to the name 'pit signal is given his\
    \ room). By synchronous signals include, for example, the signal `SIGSEGV` (11)\
    \ that generates the system while recording a protected area of memory.\n\nAsynchronous\
    \ signals include:\n- `SIGHUP` (1) - a gap called ' communication (eg, user out\
    \ of the system) \n- `SIGINT` and `SIGQUIT` (2,3) - program interrupt signals\
    \ from the keyboard (generated by a user pressing Ctrl + C and Ctrl + \\)\n- `SIGKILL`\
    \ ( 9) - immediate termination of the program (this signal cannot be changed position)\n\
    - `SIGUSR 1`, `SIGUSR 2` (10,12) - user signals that can use applications\n- `SIGTERM`\
    \ (15) - Offer the program to shut down (this signal, unlike `SIGKILL`, may be\
    \ ignored)\n\nThe default action for all of these signals, except for `SIGSEGV`,\
    \ is to terminate the program (an additional memory dump ( core dump ) is generated\
    \ for `SIGSEGV` - a file that stores the image of the process address space for\
    \ later analysis).\n\n## Setting The Signal Layout\n"
