  trans: "\n结果，两项贡献都成功注册了。如你所示，执行上述最简单代码段的结果取决于系统中线程的执行顺序。这导致了以下结果：在一种情况下，代码可以正常工作，而在另一种情况下则不行，而且通常无法预测错误的发生。这种情况被称为\
    \ `race`（或 `race condition`，竞态），它是程序员面临的最复杂的 bug 之一。这种问题在实践中是不可避免的（因为要覆盖所有可能的流执行序列组合是不现实的，特别是当组合非常多时）。人们尝试将这些必要的问题绑定到同步流中。需要立即注意的是，并行计算的同步和组织问题是实际编程中最困难的问题之一。因此，多线程程序的开发和调试特别通常被视为一种并非所有程序员都掌握的“艺术”。\n\
    \n事实上，这种开发和调试并不是艺术，而是一门严谨的学科，遵循一个基本原则：因为对于多线程程序，传统的调试并不适用，程序员必须编写代码，使得在开发阶段就留出错误空间。让我们熟悉为了使生成的代码符合这一原则而必须遵循的规则。考虑解决竞态问题的主要方法。\n\
    \n### 竞态问题的方法\n\n有时（但很少见）你可以直接忽略这些错误。当我们不感兴趣特定数据的准确记录，而是收集它们的统计数据时，这样做是有意义的，因为单个错误不会影响整体结果。例如，全局计数器是一个用于计算每天访问系统平均请求数的值，你可以忽略每隔几小时发生一次此类注册错误。遗憾的是，在大多数情况下，这种方法是不被接受的。\n\
    \n有时，使用全局数据并不是由任务的具体决定的。在这种情况下，直接的解决方案是为每个流创建数据的副本并仅对它们进行操作。在实践中，这种方法非常好，并且应该尽可能使用。例如，如果问题的细节允许为每个线程创建一个单独的计数器（或全局计数器数组，其中每个元素只由特定的流更改），那么这种数据结构的实现就能解决问题。同样，这种解决方案不能适用于所有情况（例如，在银行账户的情况下，不同的流最终必须以某种方式修改所有账户的总额）。\n\
    \n在所有其他情况下，必须保护更改免受其他流的影响。这是同步的主要任务。考虑解决它的不同方法。\n\n### 临界区与锁\n\n#### 临界区的概念\n\n\
    考虑使用一个简单的想法来解决竞态问题。很容易看出，我们错误的根源在于，从外部看，最简单的转账操作实际上分解成了几个操作，在这些操作之间存在任何其他流干扰的机会。在这种情况下，该操作被认为不是原子的而是分子的。\n\
    \n由此推导出，竞态问题的解决方案是将导致问题的代码段转换为原子操作，即保证在不受其他线程干扰的情况下完全执行的操作。这段代码被称为 `critical section`（临界区）：\n\
    \n```c\n// 临界区开始\ntotal_amount = total_amount + new_amount;\n// 临界区结束\n```\n\n\
    现在现在，当两个线程准备同时执行临界区的代码时，先开始的线程将在第二个线程开始执行之前完全执行其所有代码（第二个线程将等待直到第一个线程完成临界区的代码）。结果，我们保证程序中的选项\
    \ 2 中有一系列事件序列，竞态将永远不会发生。\n\n考虑临界区应该具备的属性：\n- **互斥性（Mutual exclusion）**：在特定的代码段内，临界区只能执行一个线程。\n\
    - **进展性（Progesterone）**：如果多个线程在临界区的入口处，则必须要求其中一个进入其中（它们不能完全互相阻塞）。\n- **有限模式（Limited\
    \ mode）**：尝试进入临界区的进程，迟早会被要求进入其中。\n\n简单的问题仍然是：“我们如何让系统将多个操作识别为一个原子操作？”解决此类任务的最简单方案是禁止在临界区的持续期间中断。这种方法虽然在原理上解决了问题，但在实践中无法应用，因为整个系统临界区中的循环程序可能会保持锁定中断状态，从而呈现出不利的条件。\n\
    \n#### 锁\n\n更整洁的解决方案是使用 `locks`。锁是一种防止多个线程同时执行临界区代码的机制。使用锁分为两个步：`commit`（`lock`,\
    \ `acquire_lock()`）和 `unlock`（`lock`, `release_lock()`）。在锁的情况下，会检查它是否已被另一个线程占用，如果是，该线程进入待机状态；否则，它强制锁定并进入临界区。离开临界区后，流移除阻塞。\n\
    \n```c\nacquire_lock(lock); // 临界区\nrelease_lock(lock);\n```\n\n因此实现了互斥属性，因此阻塞的另一个名称是\
    \ `mutex`，`mutual exclusion` 的缩写。\n\n#### 阻塞实现的问题\n\n考虑使用块变量实现临界区的简单方法。与每个临界区关联一个整数变量，该变量在冻结期间假设值为单位，在锻造后为零。该实现的代码如下所示：\n\
    \n```c\nint lock = 0;\nvoid aquire_lock (int lock) {\n    // 如果 lock 不为空 (lock\
    \ == 0)，将其锁定 (设置 lock = 1)\n    // 并退出 - 我们在临界区\n    // 否则等待锁被移除\n    while (lock\
    \ != 0); // (1)\n    lock = 1; // (2)\n}\nvoid release_lock (int lock) {\n   \
    \ // 移除锁\n    lock = 0;\n}\n```\n\n这种实现的主要问题是，检查锁变量的值并更改它并不是单个原子操作的一部分。\n\n###\
    \ 流同步的基本机制\n\n现代操作系统提供了大量的现成同步机制。同步机制是操作系统工具，帮助解决同步的主要任务——确保处理共享数据的流之间的协调。如果这些工具是构建多线程程序的最小单元，它们被称为\
    \ `synchronization primitives`（同步原语）。\n\n同步原语分为以下主要类别：\n- 多功能的、底层的，可以以不同的方式使用（`semaphores`，信号量）。\n\
    - 简单的、底层的，每个都适用于特定的解决方案。\n- 高级通用的，通过简单的方式表示；此组包含了 `monitor`（监器）的概念，可以通过 `mutexes`（互斥锁）和条件变量来表示。\n\
    - 高级，适用于特定同步问题的解决（`阻塞读写` 和 `barriers` 屏障）。\n\n让我们看看不同的机制并评估它们各自的优点以及可能的缺点。为了进一步说明这些材料，让我们取一个展示同步必要性的经典例子——生产者-消费者问题或有限缓冲区问题（`bounded\
    \ buffer`）。\n\n"
