  trans: "\n该系统包含三个主要部分：进程管理子系统、文件系统和 I/O 子系统。\n\n进程管理子系统控制进程的创建和删除、进程间的系统资源分配、进程间交互以及内存管理。文件子系统提供了一个单一接口，用于访问存储在磁盘驱动器和外设上的数据。这种接口是\
    \ `UNIX` 最重要的特性之一。它们使用相同的系统调用来与磁盘通信，或者输出到终端或打印机（程序处理打印机就像处理文件一样）。在这种情况下，文件系统将请求转发给\
    \ I/O 子系统的相关模块，而这些由这些模块——直接发送到外设设备。此外，文件子系统还控制文件访问权限，这在很大程度上决定了用户在系统上的权限。\n\n\
    I/O 子系统通过与设备驱动交互来执行文件系统请求。在 `UNIX` 中，设备分为两类：字符设备（例如打印机）和块设备（例如硬盘）。它们之间的主要区别在于块设备允许直接访问。为了通过缓冲区缓存提高块设备的效率——缓冲区缓存是一块存储最近从磁盘扫描的数据的内存区域。对这些数据的后续访问可以从缓存中检索。\n\
    \n# Linux 架构\n\nLinux 有三个主要部分：\n\n*   `Core`（内核）：实现操作系统的基本功能（进程管理、输入输出、内存等）。\n\
    *   `System libraries`（系统库）：为应用程序定义了一组标准函数（执行这些函数不需要切换到特权模式）。\n*   `System utilities`（系统工具）：执行特定任务的应用程序。\n\
    \n## Linux 内核的及其特性\n\n`Linux` 实现了单内核技术。所有的内核数据和数据结构都位于同一个地址空间中。内核中有几个功能性组件：\n\n\
    *   `Process Scheduler`（进程调度器）：负责系统多任务能力的实现（中断处理、定时器操作、进程的创建和完成、上下文切换）。\n*   `Memory\
    \ Manager`（内存管理器）：为每个进程分配独立的地址空间并实现对虚拟内存的支持。\n*   `Virtual File System`（虚拟文件系统）：提供与各种文件系统和\
    \ I/O 设备交互通用接口。\n*   `Device Drivers`（设备驱动程序）：提供对外设备的直接访问。通过虚拟文件系统接口进行访问。\n* \
    \  `Network Interface`（网络接口）：提供对网络协议实现和网络设备驱动程序的访问。\n*   `Interoperability Subsystem`（互操作子系统）：提供允许系统中不同进程相互通信的机制。\n\
    \n这些子系统的某些是系统的逻辑组件；它们与内核一起加载到内存并永久留在那里。其他子系统的组件（如设备驱动程序）的实现方式使得代码可以按需上传。为了实现这一点，`Linux`\
    \ 支持内核模块的概念。\n\n## 内核模块\n\n`Linux kernel` 允许按需加载和卸载单独的代码段。这些段被称为 `kernel modules`（内核模块），并在特权模式下运行。内核提供了许多优势：\n\
    \n*   代码模块可以在系统过程中加载到内存中，简化了内核组件（特别是驱动程序）的调试。\n*   它们能够在运行时更改一组核心组件：当前未使用的组件不会被加载到内存中。\n\
    *   模块是规则的一个例外，即根据 `Linux` 许可证扩展内核功能的代码必须是开源。这允许硬件制造商为 `Linux` 开发驱动程序，即使他们无法访问源代码。\n\
    \n`Linux module support`（Linux 模块支持）包含三个部分：\n\n*   `Module management tools`（模块管理工具）：使得将模块加载到内存并在模块与内核其余部分之间通信成为可能。\n\
    *   `Driver logging tools`（驱动日志工具）：允许模块向内核的其他部分报告新驱动程序的实现。\n*   `Conflict resolution\
    \ tools`（冲突解决工具）：允许设备驱动程序保留硬件资源并保护它们不被其他驱动程序意外使用。\n\n如果需要，单个模块可以注册多个驱动程序（例如用于两种不同的访问机制）。模块可以提前下载——在系统启动时（`boot\
    \ modules`）或触发其功能的程序运行时。加载后，模块代码与其他内核代码处于相同的地址空间。模块错误对系统是致命的。\n\n## 系统库的特性\n\n\
    `Linux system libraries`（Linux 系统库）是动态库，只有在需要时才被加载到内存中。它们执行许多功能：\n\n*   实现系统调用封装器。\n\
    *   扩展系统调用功能（例如库包括 C 语言 I/O 库，它基于系统调用实现了如 `printf()` 等函数）。\n*   实现用户模式服务函数（排序、行处理等）。\n\
    \n## 用户应用程序\n\n`Linux user applications`（Linux 用户应用程序）使用系统库中的函数，并通过系统调用与内核交互。\n\
    \n## 安装\n\n与 Microsoft Windows 的不同，安装 `Linux` 并不是一个简单的过程，因为 `Linux` 允许对更多的参数和选项进行控制和自定义。尽管如此，他们正在很大，努力让\
    \ `Linux` 的安装成为尽可能无创伤的程序，这取决于所用发行版的易用程度。\n\n尽管如此，在继续安装 `Linux` 之前，必须考虑许多基本方面。第一个是阅读安装光盘包含的信息；这些信息以两种不同的形式出现：普通的\
    \ `HOWTO` 或为发行版开发的手手册形式。\n\n在大多数发行版中，安装此操作系统的遵循的通用步骤总结在以下步骤中：\n\n### 安装过程：\n\n\
    *   `Language Choice`（语言选择）：安装程序允许我们以存在的许多语言之一配置系统。\n*   接受与我们拥有的发行版所有公司的许可协议。\n\
    *   配置我们的键盘和鼠标的类型和模型。\n*   `Choice of security level`（安全级别选择）：有四个默认安全级别可供选择，取决于执行此安装的计算机的用途，可以从互联网客户端到支持大量连接的服务器等各个级别。\n\
    *   `Partitioning`（分区）：安装前要考虑的主要概念之一是 `partition`（分区）。每个操作系统使用它自己的文件系统以不同的方式组织其包含的文件信息。参考不同操作系统的文件系统名称：这通常防止了多个混合的操作系统安装在同一块硬盘上。为了解决这个问题，有了所谓的\
    \ `partitions`（分区），将特定的硬盘划分，使其能够包含两个文件系统。对于所有目的而言，创建一个分区等于将硬盘分为两部分，尽管当然不是以物理方式而是逻辑方式划分的。\n\
    \n安装 `Linux` 的基本问题在于，在大多数情况下，用户希望保留 `Windows` 以及该系统的所有程序。目前有几个发行版允许在 `Windows`\
    \ 文件系统上安装 `Linux`，可以在所谓的镜像磁盘（一个非常大的文件，`Corel Linux` 发行版）中，或者直接在 `Windows` 文件系统中（`WinLinux\
    \ 2000`）。然而，为了获得良好的性能，最好将 `Linux` 安装在与 `Windows`不同的分区上，并使用 `Linux` 自己的文件系统，因此通常需要对硬盘进行分区，因为\
    \ `Windows` 安装时通常会占用整个硬盘的大小。直到最近，这种划分意味着硬盘上包含的所有信息不可挽回且不可避免的丢失。\n\n目前在 `Linux`\
    \ 发行版的安装中，允许在不丢失信息的情况下划分硬盘，以便减小 `Windows` 分区的大小并在安装 `Linux` 时创建一个新分区。在 `RedHat`\
    \ 或 `Mandrake` 的情况下，有一种自动分配的可能性，这在知道如何操作分区时有用。对于 `Linux`，必须至少创建一个原生的 `root` 分区。它应该是所需的大小，以及一个\
    \ `swapping partition`（交换分区），其大小必须至少是设备 `RAM` 的两倍，最高上限 512 MB。\n\n在此过程中，必须小心不要删除\
    \ `Windows` 所在的分区，因为在这种情况下所有信息都将永久丢失。\n\n*   `System installation`（系统安装）：选择包含在\
    \ `Linux` 操作系统中的各种软件包并随后安装。其中一些软件包包括：\n    *   `Workstation`（工作站）\n    *   `Server`（服务器）\n\
    \    *   `Graphic environment`（图形环境）\n    *   `Office workstation`（办公工作站）\n  \
    \  *   `Webserver / FTP`（Web 服务器 / FTP）\n    *   `KDE station`（KDE 站）\n    * \
    \  `Play Station`（游戏站）\n    *   `Mail`（邮件）\n    *   `Gnome station`（Gnome 站）\n\
    \    *   `Multimedia station`（多媒体站）\n    *   `Database server`（数据库服务器）\n    *\
