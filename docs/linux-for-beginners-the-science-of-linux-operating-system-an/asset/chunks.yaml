    at 0x7500, it must be interrupted by an error. The memory security strategy is
    that a valid address range is stored for each process, and each memory access
    operation is checked for an address belonging to that range❖        Lack of binding
    to physical memory addresses . The process can be performed regardless of its
    memory location and physical memory size. The process address space is allocated
    as a large static address set, with each address of the set being moved. Processor
    and hardware should be able to convert these addresses to physical addresses of
    main memory (the same address placeable at different times or for different processes
    may correspond to different places including his address)The Concept Of Virtual
    MemoryVirtual memory  - a technology that introduces I level additional conversions
    between memory addresses used by the process and physical memory addresses used
    by the desktop app. Such transformations should ensure that the memory is protected
    and that the process is not bound to physical memory addresses.With virtual memory,
    the physical memory of the process address space can be fragmented, since the
    bulk of the memory occupied by the process remains free most of the time. There
    is a so-called ninety to ten rule or a localization rule that states that 90%
    of memory accesses in the process account for 10% of its address space. You can
    move the addresses so that only the sections of the process address space that
    are actually in use at that time correspond to the main memory.In this case, unused
    partitions of the address space can be mapped to slower memory, such as hard disk
    space, and at this time other processes can use the main memory, which previously
    displayed the addresses of these partitions. When a partition is needed, its data
    is loaded from disk to main memory, perhaps instead of partitions that became
    unnecessary at a particular moment (and which, in turn, will now be stored on
    disk). Data can be read from disk at a village thus a key memory LDPE time addressing
    them.In this way, you can significantly increase the size of the process address
    space and ensure that processes larger than the main memory are executed.Problems
    of virtual memory implementation: Memory fragmentationThe main problem that occurs
    when using virtual memory is the efficiency of its implementation. Because address
    conversions need to be done every time memory is accessed, careless implementation
    of these conversions can have the worst effect on the performance of the entire
    system. If most memory accesses make the system actually have to access the disk
    (which is tens of thousands of times slower than the main memory), it will be
    virtually impossible to operate such a system. The issue of improving the performance
    of virtual memory implementation will be discussed.Another problem is the memory
    fragmentation that occurs when free memory cannot be used. There are internal 
    and external memory fragmentations. The external is reduced to the fact that due
    to the allocation and subsequent freeing of memory, it creates free blocks of
    small size - holes . Because of this situation may arise in which it is impossible
    to provide a continuous memory block size N, because there is no contiguous free
    block of size S ≥ N, although in general, the amount of free memory space more
    than N. So in the above case, there is not enough space to execute the P5 process
    due to external fragmentation.Internal fragmentation is the result that, on request,
    memory blocks larger than actually used are allocated, resulting in unused areas
    inside the dedicated blocks that can no longer be allocated to something else. Logical
    And Physical Memory AddressingThe most important concept of the concept of virtual
    memory is addressing the logical and physical memory.Logical or Virtual Address 
    - An address generated by a program running on some processor. Addresses that
    use the instructions of a particular processor are logical addresses. A set of
    logical addresses is called a logical address space.Physical Address - The address
    that the memory chip operates on. An application in modern computers never deals
    with physical addresses. A special MMU ( memory management unit ) is responsible
    for converting logical addresses into physical ones. The totality of all available
    physical addresses is called a physical address space. So, if your computer has
    a 128MB chipset, then that amount of memory is physically addressed. Usually,
    much more memory is logically addressed.The specifics of converting logical addresses
    into physical ones are determined by different approaches to managing memory,
    the study of which will be the topic of this section.Approach Of Base And Boundary
    RegistersWhen implementing virtual memory, it is necessary to protect memory,
    move processes in memory, and share memory across multiple processes. One of the
    easiest ways to meet these requirements is to approach the base and boundary registers
    . For each process in two CPU registers store two values - the base address  ( base )
    and limits  ( bounds ). Each access to a logical address is converted to a physical
    address by adding a logical address to the base address. If the received physical
    address does not fall within the range ( base, base + bounds ), consider that
    the address is incorrect and generate an error.This approach is the simplest example
    of a dynamic movement of processes in memory. All the other approaches that will
    be discussed in this section are different options for developing this basic scheme. For
    example, the fact that each process has its own values ​​ of base and boundary
    registers when using this approach is the simplest implementation of the process
    address space concept, which is based on the fact that each process has its own
    memory mapping.To organize memory protection in this situation, it is necessary
    that the use of the user cannot change the value of the base and border registers. It
    is enough to make such changes available only in the preferred mode of the processor.The
    advantages of this approach include simplicity, modest hardware requirements (only
    two registers are required), and high efficiency. However, today it is practically
    not used because of a number of disadvantages, due primarily to the fact that
    the address space of the process is still mapped to one continuous block of physical
    memory: it is unclear how to dynamically expand the address space of the process; different
    processes cannot share memory; no code and data distribution .In this approach,
    only one pair of base address-limit values ​​ is allocated to the process. The
    natural evolution of this idea was the mapping of the process address space through
    several physical memory ranges, each of which sets its own pair of the base address
    and boundary values. That''s how the concept of memory segmentation came about.Memory
    SegmentationFeatures Of Memory SegmentationMemory segmentation allows you to depict
    a logical address space as a set of independent variable-length blocks called
    segments. Each segment usually contains data for one purpose, for example, one
    may have a stack, the other, a program code, etc.Each segment has a name and length
    (for ease of implementation, use names alongside names). The logical address consists
    of a segment number and an offset within the segment; the application program
    works with such segments. Compilers often create separate segments for different
    application data (code segment, the data segment, stack segment). When a program
    is loaded into memory, it creates a table of process segment descriptors, each
    element of which corresponds to one segment and consists of a base address, boundary
    value, and access rights.When forming an address, its segment portion points to
    the corresponding element of the process segment descriptor table. If the offset
    is greater than the limit setpoint (or if the process access rights do not match
    the segment set rights), then the hardware generates an error. When all is well,
    the sum of the base and offset in the case of pure segmentation will result in
    a physical address in the main memory. If a segment is uploaded to a disk, trying
    to access it causes it to be loaded from the disk into the main memory. As a result,
    each segment corresponds to a contiguous block of memory of the same length, located
    in an arbitrary location of physical memory or on a disk. Here are the benefits
    of memory segmentation.❖        There is an opportunity to organize several independent
    segments of memory for the process and use them to store data of different nature. However,
    the access rights to each such segment can be set differently❖        Individual
    segments can be shared by different processes, and their segment descriptor tables
    must contain the same elements that describe that segment❖        Physical memory
    corresponding to the process address space should not necessarily be continuous
    now. In fact, segmentation allows individual portions of the address space to
    be mapped, not to the main memory, but to the disk and reloaded as needed, ensuring
    that processes of any size are executedThis approach is not without its disadvantages.❖  The
    need to introduce an additional layer of memory conversion causes a decrease in
    performance (this drawback is inherent in any full implementation of virtual memory). Appropriate
    hardware support is required for effective segmentation implementation❖       
    Managing variable length memory blocks with the need to store them on a disk can
    be quite complicated❖        The requirement that each segment corresponds to
    a contiguous block of the physical memory of the appropriate size causes external
    memory fragmentation. Internal fragmentation does not occur in this case because
    the segments have a variable length and you can always select a segment of the
    length required to execute the programToday, segmentation is used rather limited,
    primarily because of the fragmentation and complexity of implementing efficient
    memory and disk-sharing. Wider use of memory allocation got into blocks of fixed
    length - page memory organization that will be discussed.Segmentation Implementation
    In IA-32 ArchitectureIn the IA-32 architecture, logical addresses in the program
    are formed using segmentation and look like a "shift selector". The values ​​
    of the selector are loaded into a special register of the processor (segment register)
    and used as an index in the table of descriptors of the segment, which is in memory
    and is an analog of the table of segments, described earlier. Six segment registers
    are supported in IA-32 architecture. This means that the executable code at the
    same time can address these six independent d cops.The selector contains a descriptor
    index in the table, bits of the local or global table indicator, and the required
    privilege level.For system set common global descriptor table ( Global D e scriptor
    Table, GDT ), and for each task - local descriptor table ( L o cal Descriptor
    Table, LDT ). The descriptors in IA-32 are 64 bits long. They define the properties
    of software objects (for example, memory segments or descriptor tables). Handle
    contains the value base ( base ), which corresponds to the address of the object
    (for example, the beginning segment); limit value ( limit ); object type (segment,
    descriptor table, etc.); protection characteristics.Access to tables of descriptors
    is supported by hardware. If the security characteristics specified in the handle
    do not correspond to the privilege level specified by the selector, it will not
    be possible to access the memory using it. They provide memory protection. However,
    it has never been mentioned that a physical address is stored in the handle. The
    fact is that for the IA-32 architecture, due to the conversion of the logical
    address, they receive not another physical address, but another type of address,
    which is called a linear address .Page Memory OrganizationThe main technologies
    of virtual memory implementation other than segmentation owned -page memory organization 
    ( paging ). Its main idea is the allocation of memory blocks of fixed length. These
    blocks are called pages and so are we . This technology is the most common approach
    to virtual memory implementation in modern operating systems.Basic Principles
    Of Page Organization Of MemoryIn the case of page memory organization, a logical
    address is also called a linear or virtual address. Such addresses belong to one
    set (for example, a 32 bits non-negative number can be a linear address). Physical
    memory is divided into blocks of fixed length - frames , or page blocks ( frames ). Logical
    memory, in turn, divided into blocks of the same length - page . When the process
    starts, its pages are loaded into available physical memory frames from disk or
    other media. The paging organization must have hardware support. Each address
    generated by the processor is divided into two parts: the page number  and the page
    offset . The page number is used as an index in the page table.A page table is
    a data structure containing page - table entries ( PTE ), each of which contains
    information about the page number, the number of the corresponding physical memory
    frame (or directly it''s the base address) and access rights. The page number
    is used to find the item in the table. After finding it, the page frame is added
    to the base address of the corresponding frame, which determines the physical
    address.Page size is a power of 2, modern OS uses pages ranging from 2 to 8 KB. In
    custom addressing modes, you can work with larger pages. For each process, they
    create their own page table. When the process begins to run, the OS calculates
    its page size and the number of frames in physical memory. Each page is uploaded
    to a corresponding frame, after which its number is written to the process page
    table.The process of memory mapping is different from the actual physical memory
    state. At the logical level, all memory is represented by a continuous block and
    belongs only to this process, and physically it is spread over the address space
    of the memory chip, alternating with the memory of other processes. The process
    cannot access memory whose address is not specified in its page table (so memory
    protection is implemented).The operating system must have information about the
    current state of physical memory (frame occupancy, frame number, etc.). This information
    is usually stored in a frame table . Each element corresponds to the frame and
    contains all the information about it .Comparative Analysis Of Page Organization
    Of Memory And SegmentationPage memory organization and segmentation have more
    in common than differences. The main difference between the two approaches is
    that all pages have a fixed length and segments have a variable length. Other
    basics (no requirement for continuity of physical memory, ability to unload memory
    blocks to disk, need to support conversion tables, etc.) are fundamentally different.
    Let''s take a look at the main benefits of page memory organization over page
    memory segmentation. They are determined primarily by the fact that all pages
    have the same length.❖        The implementation of memory allocation and memory
    is simplified. All pages are equal in terms of process, so you can maintain a
    list of free pages and, if necessary, select the first page from that list and,
    upon release, return the page to the list. The segments do so not because each
    segment can only be used for its purpose (try to use a segment for other purposes
    likely lead to what will be needed in the segment to some other thing)❖       
    Disk communication with the disk is also simplified. To arrange such an exchange,
    the portion of the disk used to store page information discharged from memory
    (  support space or backing store ) can also be broken down into blocks of fixed
    size equal to the size of the fram eThe page organization of memory is not without
    its drawbacks.❖        First of all, this approach causes internal fragmentation
    due to the fact that the page size is always fixed, and if necessary to allocate
    a memory block of a specific length, its size will be multiple of the page size. On
    average, the amount of unused memory is approximately half a page for each dedicated
    memory block (similar to a segment). This fragmentation can be reduced by reducing
    the number and size of the blocks that appear and fuse❖        Page tables should
    be larger than segment tables. For example, to allocate a contiguous memory range
    of 100 KB you will need one element of the segment table that describes the segment
    allocated for that range. On the other hand, if we use 4KB pages to describe this
    range, we will need 25-page table elements, one for each pageMulti-Level Page
    TablesTo address the logical address space of a large volume with a single page
    table, it has to be very large. For example, in an IA-32 architecture with a standard
    page size of 4 KB (addressing inside such a page requires 12 bits) the index in
    the table remains 20 bits, which corresponds to a page table of 1 million elements
    .To avoid such large spreadsheets, the technology of tiered page  tables is proposed. Page
    tables themselves are broken down into pages whose information is stored in top-level
    page tables. The number of levels rarely exceeds 2, but can reach 4.When there
    are two levels of tables, the logical address is broken down into an index in
    the top-level table, an index in the lower-level table, and offset. This technology
    has two main advantages. First, page tables are smaller in size, so they can be
    searched faster. Second, not all page tables should be in memory at a specific
    point in time. For example, if the process does not use some memory block, then
    the contents of all the lower-level pages of an unused block may be temporarily
    stored on the disk.Implementation Of Page Tables In IA-32 ArchitectureThe IA-32
    architecture utilizes a two-tier page organization, starting with the Intel 80386\.
    A table-top level called directory pages for each task should be given a separate
    directory page, a physical address that is stored in a special control register
    and where it automatically loads the hardware when switching context. Table bottom
    level is called a page table .The linear address is divided into three fields:❖  Directory
    ( Directory ) - defines the directory entry pages, indicating the desired page
    table❖         Table ( Table ) -vyznachaye page table element that indicates the
    desired frame memory❖         Offset ( Offset ) - determines the offset within
    the frame, combined with the address of the frame forms a physical addressThe
    size of the directory and table fields is 10 bits, giving page tables containing
    1024 elements, the size of the offset field is 12 bits, giving pages and frames
    4 KB in size. One lower-level page table addresses 4 MB of memory (1 MB of frames)
    and the entire directory of pages has 4 GB.The page table elements at all levels
    have the same structure. Here are the following element fields:❖        Flag presence 
    ( Present ), equal to one of the page is in physical memory (it corresponds to
    the frame); equality of this flag means that the page is not in physical memory,
    and the operating system may use other element fields for its purposes❖       
    The 20 most significant bits  that set the frame start address to be multiple
    of 4 KB (1 MB of different start addresses can be specified)❖         Flag Access
    ( Accessed ), which is equal to one pin each time the reference device support
    paged to the corresponding frame❖  Flag Changes ( Dirty ), which confer equal
    to one while recording each transaction in the corresponding frame❖         Flag
    read-write ( Read / Write ), which specifies the rights to access the page or
    page table (for reading and write or read-only)❖        The privilege  ( User / Supervisor ) 
    check box that specifies the processor mode required to access the page. If this
    checkbox is zero, the page can only be addressed from privileged mode, if units
    are also available from user modePresence, access, and change checkboxes can be
    used by the OS to organize virtual memory.Associative MemoryWhen implementing
    page tables, you have to access memory several times to access the physical memory
    byte. If two-tier pages are used, three access operations are required: the page
    directory, the page table, and directly to the address of this byte, and the three-level
    tables require four operations. This slows down memory access and reduces overall
    system performance.As already noted, the ninety to ten rule indicates that most
    memory access to a process belongs to a small subset of its pages, and the composition
    of this subset changes rather slowly. A way to improve the performance of a page-based
    memory organization is to cache the addresses of the memory frames corresponding
    to this subset of pages .To solve this problem was proposed technology associative
    memory  or cache translation  ( translation look-aside buffers or TLB ). In high-speed
    memory (faster than main memory), they create a set of several elements (different
    architectures assign associative memory from 8 to 2048 elements, in the architecture
    of IA-32 such elements to Pentium 4 were 32, starting with Pentium 4 - 128). Each
    element of the translation cache corresponds to one element of the page table.Now
    when generating a physical address, the corresponding element of the table is
    first searched for in the cache (in IA-32 - by the directory field, the table
    field and the offset), and if it is found, the address of the corresponding frame
    becomes available, which can be immediately used to access the memory. If there
    is no corresponding element in the cache, then memory is accessed through the
    page table, and then the element of the page table is stored in the cache instead
    of the oldest element.Unfortunately, when switching contexts in the IA-32 architecture,
    the entire cache needs to be cleared, since each process has its own page table,
    and the same page numbers for different processes may correspond to different
    frames in physical memory. Clearing the translation cache is a very slow operation
    that must be avoided in every possible way.An important feature of the translation
    cache is the percentage of hits, that is, the percentage of times that the required
    elements of the page table is in the cache and does not require memory access. It
    is known that at 32 elements 98% of hits are provided. Note also that this percentage
    decrease in performance hits when using a two-level page table compared to the
    single-level is 28%, but the benefits derived when allocating memory would be
    making a decline.ConclusionThank you for making it through to the end of Linux
    For Beginners , let’s hope it was informative and able to provide you with all
    of the tools you need to achieve your goals whatever they may be.In Linux, unlike
    other operating systems, by default, the work with Linux is not done in a graphical
    way, but by entering commands manually. Linux has several programs that are responsible
    for interpreting the commands entered by the user and perform the appropriate
    actions in response. These programs called shell are the typical mode of communication
    on all UNIX systems including Linux. For many people having to enter the commands
    manually may seem intimidating and difficult, although as you must have seen in
    the book Linux commands are relatively simple and very powerful.Linux is also
    a multitasking and multi-user operating system and it is capable of running several
    programs (or tasks) simultaneously and host several users simultaneously. Therefore,
    all users of Linux must have a user account on the system that establishes its
    privileges. Linux organizes users into groups so that privileges can be established
    for a particular workgroup, for access to certain files or system services.Finally,
    there is another fundamental concept when installing and using Linux, which is
    a Super User or User root. This user is the system administrator and is created
    during installation. As an administrator, you can access and modify (as well as
    destroy) all system information, so try to avoid working as a root user as much
    as possible. We hope you learned all of this and a lot more is seen from this
    book.Finally, if you found this book useful in any way, a review on Amazon is
    always appreciated!'
