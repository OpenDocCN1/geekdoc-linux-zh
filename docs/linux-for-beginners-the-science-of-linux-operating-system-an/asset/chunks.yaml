    \ 2000`). However to obtain a good performance it is preferable to install `Linux`\
    \ on a partition different from that of `Windows` using `Linux`'s own file system,\
    \ so it is usually necessary to perform a partition of the hard disk, since `Windows`\
    \ when installed, usually appropriates the entire size of the hard drive. Until\
    \ recent times this division meant the irremediable and inevitable loss of all\
    \ the information that was contained on the hard disk.\n\nAt the moment in the\
    \ installation of the distributions of `Linux`, it is allowed to divide the hard\
    \ disk without losing information, in order to reduce the size of the `Windows`\
    \ partition and create a new one during the installation of `Linux`. In the case\
    \ of `RedHat` or `Mandrake`, there is a possibility of automatic assignment that\
    \ will be useful in the case of knowing how to manipulate the partitions. For\
    \ `Linux`, at least one `root` native partition must be created. It should be\
    \ the desired size and a `swapping partition` that must be at least twice the\
    \ size of the `RAM` of your equipment, up to a maximum of 512 MB.\n\nDuring this\
    \ process, care must be taken not to erase the partition where `Windows` resides,\
    \ since in that case ALL the information will be lost permanently.\n\n*   `System\
    \ installation`: Selection of the various packages to be included with the `Linux`\
