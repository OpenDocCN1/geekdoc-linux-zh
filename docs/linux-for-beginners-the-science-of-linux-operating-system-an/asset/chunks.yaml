    1. `Stream T A` 读取了 `total _ amount`，其值等于 `100`。

    2. `stream T B` 读取数值 `total _ amount`，同样也等于 `100`。

    3. `Stream T A` 将第 1 步中的读取值 `total _ amount` 增加了 `1000`，接收到 `1100` 并将其存储在内存中。

    4. `T B` 流将第 2 步中的 `total _ amount` 数值增加了 `100`，得到 `200`，并将其存储在全局内存中，覆盖了流 `T A`
    保存的内容。


    用户 A 的贡献完全丢失了。现在考虑另一种事件发生序列（选项 2）。


    1. `Stream T A` 读取 `total _ amount`，将其增加到 `1000` 并在全局内存中记录数值 `1100`。

    2. `Stream T` 在读取 `total _ amount`（其值为 `1100`）时，将其增加了 `100` 变为 `1200`，并将该值写入全局内存中。'
- fmt: "\nAs a result, both contributions were successfully registered. As you can\
    \ see, the result of executing the simplest code snippet above depends on the\
    \ sequence of execution of threads in the system. This leads to the following:\
    \ in one situation the code may work, in the other - no, and in general it is\
    \ impossible to predict the occurrence of an error. This situation is referred\
    \ to as `race` (or `race condition`), which is one of the most difficult bugs\
    \ faced by programmers. It is practically non-negotiable (since it is unrealistic\
    \ to override all possible combinations of flow execution sequences, especially\
    \ if there are many). Attempts to bind these necessitated problems into synchronization\
    \ streams. Immediately note that the problems of synchronization and organization\
    \ of parallel computing are some of the most difficult in practical programming.\
    \ Therefore, the development and debugging of multithreaded programs in particular\
    \ often seen as a kind of \"art\" that is not known to all programmers.\n\nIn\
    \ fact, such development and debugging is not an art, but a strict discipline,\
    \ subject to one basic principle: because for multithreaded programs, traditional\
    \ debugging is not suitable, the programmer must write the code so that at the\
    \ stage of development, there is room for errors. Let us familiarize ourselves\
    \ with the rules that must be followed in order for the generated code to comply\
    \ with this principle. Consider the main approaches to competition problems.\n\
    \n### Approaches to Competition Problems\n\nSometimes (but rarely enough) you\
    \ can just ignore these mistakes. This may make sense when we are not interested\
    \ in the accurate recording of particular data, but collect statistics about them,\
    \ so individual errors will not affect the overall result. For example, a global\
    \ counter is a value on which to calculate the average number of requests to the\
    \ system per day, and you can ignore the error of registering such requests that\
    \ occur every few hours. Unfortunately, in most cases, this approach is not accepted.\n\
    \nSometimes, the use of global data is not dictated by the specifics of the task.\
    \ In this case, the straightforward solution is to create local copies of data\
    \ for each stream and operate them only. In practice, this works very well and\
    \ should be used wherever possible. For example, if the specifics of the problem\
    \ allow the creation of a separate counter for each thread (or global array of\
    \ counters, where each element is changed only by a certain flow), the implementation\
    \ of such data structures solves the problem. Again, such a solution cannot be\
    \ applied in all cases (for example, in the situation with bank accounts, different\
    \ flows, after all, must somehow modify the total for all accounts).\n\nIn all\
    \ other cases, changes must be protected against the effects of other flows. This\
    \ is the main task of synchronization. Consider different approaches to solving\
    \ it.\n\n### Critical Sections And Locks\n\n#### The Concept Of Critical Section\n\
    \nConsider using a simpler idea to solve a competition problem. It is easy to\
    \ see how the source of our mistake is that, from the outside, the simplest money-transferring\
    \ operation actually breaks down into several operations, with the chance of any\
    \ other flow interfering between them. In this case, it is said that the operation\
    \ is not an atom but a molecule.\n\nIt follows that the solution to the problem\
    \ of competition is to transform the code snippet that causes the problem into\
    \ an atomic operation, that is, one that is guaranteed to be performed completely\
    \ without interference from other threads. This piece of code called a `critical\
    \ section`:\n\n```c\n// start critical section\ntotal_amount = total_amount +\
    \ new_amount;\n// end of critical section\n```\n\nNow, when two threads are going\
    \ to execute the code of the critical section at the same time, the one that started\
    \ the first one will execute all its code completely before the second starts\
    \ its execution (the second thread will wait until the first one completes the\
    \ code of the critical section). As a result, we are guaranteed to have a sequence\
    \ of events in Option 2 in our program, and the competition will never take place.\n\
    \nConsider the properties that a critical section should have:\n- **Mutual exclusion**:\
    \ In a particular time code, a critical section can execute only one thread.\n\
    - **Progesterone**: if multiple threads are present at the entrance to the critical\
    \ section, one of them must be necessarily required to enter into it (they cannot\
    \ block each other completely).\n- **Limited mode**: a process that tries to enter\
    \ a critical section, sooner or later is necessarily required to enter into it.\n\
    \nThe simple question remains: \"How can we make the system perceive multiple\
    \ operations as one atomic operation?\". The simplest solution to such a task\
    \ would be to prohibit interruptions for the duration of the critical section.\
    \ This approach, although solves the problem in principle, in practice, cannot\
    \ be applied as a result because the cycling program in the critical section of\
    \ the whole system can remain as locked interrupts, and therefore, present an\
    \ unfavorable condition.\n\n#### Locking\n\nThe tidier solution is to use `locks`.\
    \ A lock is a mechanism that prevents more than one thread from executing the\
    \ code of a critical section. Using a lock comes in two steps: `commit` (`lock`,\
    \ `acquire_lock()`) and `unlock` (`lock`, `release_lock()`). In the case of a\
    \ lock, it is checked that it has not already been made by another thread, and\
    \ if so, this thread enters the standby state, otherwise, it enforces the lock\
    \ and enters the critical section. After leaving the critical section, the flow\
    \ removes the blockage.\n\n```c\nacquire_lock(lock); // critical section\nrelease_lock(lock);\n\
    ```\n\nSo realize mutual exclusion property, hence another name for blocking is\
    \ `mutex`, short for `mutual exclusion`.\n\n#### Problems With Implementation\
    \ Of Blocking\n\nConsider a naive implementation of a critical section using block\
    \ variables. With each critical section associated integer variable, which assumes\
    \ the value as a unit during freezing and zero after forging. Here's what the\
    \ code for this implementation looks like:\n\n```c\nint lock = 0;\nvoid aquire_lock\
    \ (int lock) {\n    // if lock does not have (lock == 0), roll it (set lock =\
    \ 1)\n    // and exit - we are in the critical section\n    // otherwise wait\
    \ until the lock is removed\n    while (lock != 0); // (1)\n    lock = 1; // (2)\n\
    }\nvoid release_lock (int lock) {\n    // remove the lock\n    lock = 0;\n}\n\
    ```\n\nThe main problem with this implementation is that checking the value of\
    \ the locking variable and changing it is not part of a single atomic operation.\n\
    \n### Basic Mechanisms Of Flow Synchronization\n\nModern OSes provide a wide range\
    \ of ready-made synchronization mechanisms. Synchronization mechanisms are operating\
    \ system tools that help to solve the main task of synchronization - to ensure\
    \ the coordination of flows that work with shared data. If such tools are the\
    \ minimum blocks for building multithreaded programs, they are called `synchronization\
    \ primitives`.\n\nSynchronization primitives are divided into the following main\
    \ categories:\n- Versatile, low-level, which can be used in different ways (`semaphores`).\n\
    - Simple, low-level, each of which is adapted to the solution.\n- High-level universal\
    \ expressed through simple; this group includes the concept of a `monitor` which\
    \ can be expressed through `mutexes` and `conditional variables`.\n- High level,\
    \ adapted to the solution of a specific synchronization problem (`blocking read-write`\
    \ and `barriers`).\n\nLet us look at the different mechanisms and evaluate the\
    \ advantages that each of them has, as well as their possible disadvantages. To\
    \ further illustrate the material, let's take a classic example that demonstrates\
    \ the need for synchronization - the problem of producer-consumers or the problem\
    \ of limited buffer (`bounded buffer`).\n"
