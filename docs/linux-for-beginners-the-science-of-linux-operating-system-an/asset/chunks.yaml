  trans: "\n1. 当生产者或消费者正在操作缓冲区时，其他线程都应该等待其完成。\n2. 当生产者试图将一个对象放入缓冲区而缓冲区已满时，它必须等待直到有可用空间。\n\
    3. 当消费者试图从缓冲区中取出一个对象而缓冲区为空时，它必须等待直到有对象可用。\n\n# 信号量概念 (Semaphores Concept)\n\n\
    `Semaphores` 由荷兰计算机科学专家 E. Dijkstra 于 1965 年提出的。`Semaphores` 是实践中使用的最古老的同步原语。`Semaphore`（信号量）是一个共享的、非负的整数计数器，需要设定一个初始值，并通过以下原子操作进行确定：\n\
    \n- **信号量减操作** (`down`）：如果信号量的值大于 0，则减 1；如果值为 0，则该流将进入等待状态，直到值大于 0（所有“在信号量处等待”或“在信号量处阻塞”的线程）。此操作也称为\
    \ `P` 或等待。以下是其伪代码：\n```c\nvoid down (semaphore_t sem){\n    if (sem> 0)\n    \
    \    sem--;\n    else \n        sleep ();\n}\n```\n- **信号量加操作** (`up`)：将信号量的值加\
    \ 1；当有流在信号量处等待时，其中一个流将离开等待状态并执行自己的操作。如果有多个线程在等待一个信号量，由于 `up` 操作的存在，其 `up` 值将保持不变，但其中一个线程将继续执行（在大多数实现中，该线程的选择是随机的）。此操作也称为\
    \ `V` 或信号。以下是其在文档中的代码：\n```c\nvoid up (semaphore_t sem){\n    sem ++;\n    if\
    \ (waiting_threads ())\n        wakeup (some_thread);\n}\n```\n\n事实上，信号量的值决定了可以通过该信号量而不被阻塞的线程数量。当信号量的初始值设置为\
    \ 0 时，它将阻塞所有线程，直到某个线程通过执行 `up` 操作来“打开”它。`up` 和 `down` 操作可以由任何访问该信号量的流执行。\n\n#\
    \ 信号量的用途 (Features Of Use Of Semaphores)\n\n`Semaphores` 可用于解决两个不同任务之间的同步 `Liabilities`。\n\
    \n1. **互斥 (Mutual Exclusion)**：借助它们，可以组织互斥（以保护临界区域代码不被多个线程执行）。最方便的方法是使用`binary\
    \ semaphore`（二进制信号量），它可以两个值：0 和 1。以下使用二进制信号量实现临界区域的示例：\n```c\nsemaphore _ t sem\
    \ = 1; // 初始信号量是开启的\ndown (sem);// 临界区域\nup (here);\n```\n\n2. **条件等待 (Condition\
    \ Expectation)**：借助它们，你可以组织对某些条件完成的等待。假设需要组织等待一个线程完成另一个线程（join 操作的模拟）。在这种情况下，可以使用初始值为\
    \ 0（关闭状态）的信号量。等待的流必须对该信号量执行 `down` 操作，而为了信号流的完成，其完成函数需要对该信号量执行 `up` 操作。以下是伪代码（`this_thread`\
    \ 代表当前线程）：\n```c\nVoid thread_init (){\n    this _ thread. sem = 0; // 在流执行开始时信号量是暴露的\n\
    }\nvoid thread _ exit (){\n    up ( this _ thread . sem ); // 唤醒挂起的流，如果有\n}\n\
    void thread_join (thread_t thread){\n    down (thread.sem); // 等待线程完成\n}\n```\n\
    \n# 使用信号量实现生产者-消费者问题 (Realization Of The Problem Of Producers-Consumers With The\
    \ Help Of Semaphores)\n\n首先，让我们定义解决此问题所需的同步动作。\n\n1. 将直接更改缓冲区的操作（生产者——将对象放入缓冲区，消费者——从缓冲区中移除对象）放在临界区域中。\n\
    2. 根据要求 2 组织等待（生产者在缓冲区满时的等待）。在此，消费者必须通知等待中的生产者它已从缓冲区取走对象（即如果缓冲区是满的，现在变得不满了）。\n\
    3. 根据要求 3 组织等待（消费者在缓冲区为空时的等待）。在此，生产者必须通知预期缓冲区非空的消费者，并告知缓冲区之前是否是空的。\n\n现在让我们来看我们需要的同步原语。每个同步操作都需要一个独立的信号量：\n\
    \n1. **锁 (to lock)**：为了使用临界区域，我们像以前一样使用二进制信号量。我们称之为 `to lock`。它将由生产者和消费者共同使用，保护其他线程对缓冲区的访问（再次，包括生产者和消费者）。\n\
    2. **空位计数 (empty items)**：为了组织生产者在缓冲区满时的等待，我们需要一个当前值等于缓冲区中可用空间数量的信号量。我们称之为 `empty_items`。生产者在尝试向缓冲区添加新对象之前，如果该信号量等于\
    \ 0，则将其置为等待状态。消费者从缓冲区移除对象后，将通过通知生产者来增加信号量（并唤醒其中一个）。\n3. **满计数 (full items)**：为了组织消费者在缓冲区为空时的等待，需要一个当前值等于缓冲区中位置数量的信号量。我们称之为\
    \ `full_items`。消费者在尝试从缓冲区中取对象之前，减少该信号量并进入等待状态。\n"
- fmt: "\nHere is the pseudocode solution to this problem:\n\n```cpp\nsemaphore_t\
    \ lock = 1; // for the critical section\nsemaphore_t empty_items = n; // 0 buffer\
    \ full, empty from the beginning\nsemaphore_t full_items = 0; // if 0 - the buffer\
    \ is empty\n// manufacturer\nvoid producer() {\n    item_t item = produce(); //\
    \ create about ' object \n    down(empty_items); // is there a place for information\
    \ ' facility?\n    down(lock); // enter the critical section\n    append_to_buffer(item);\
    \ // add about ' object item to the clipboard \n    up(lock); // exit critical\
    \ section\n    up(full_items); // inform consumers that there is a new object\n\
    }\n \n// consumer\nvoid consumer() {\n    item_t item;\n    down(full_items);\
    \ // not empty buffer?\n    down(lock); // enter the critical section\n    item\
    \ = receive_from_buffer(); // pick about ' Object item from the clipboard \n \
    \   up(lock); // exit critical section\n    up(empty_items); // notify manufacturers\
    \ of the location\n    consume(item); // consume the object\n}\n```\n\n### Mutexes\n\
    The concept of mutex largely coincides with the notion of blocking defined previously\
    \ (Section 5.2). Synchronization primitives called Mutexes are the ones that prevent\
    \ the execution of a piece of code in more than one stream. In fact, the mutex\
    \ is an implementation of OS-level blocking. Mutex, as its name implies, eliminates\
    \ mutual exclusion. Its main task is to block all threads trying to access the\
    \ code when that code is already executing a thread. A mutex can be in two states:\
    \ the free and the busy. The initial state is \"free\" and has two possible atomic\
    \ operations.\n\n*   **Take mutex** (`mutex_lock(mutex)`): if mutex was free,\
    \ he is busy, and the flow continues its execution (entering the critical section);\
    \ if the mutex was busy, the stream enters a standby state (said to be a \"wait\
    \ on a mutex\" or \"locked on a mutex\"), the execution continues another stream.\
    \ Stream, which took mutex called the owner of the mutex: `mutex_lock(mutex_t\
    \ mutex)`\n```cpp\nif (mutex.state == free) {\n    mutex.state = locked;\n   \
    \ mutex.owner = this_thread;\n} else {\n    sleep();\n}\n```\n*   **To release\
    \ the mutex** (`mutex_unlock(mutex)`): mutex becomes free; if several streams\
    \ are expected on it, one of them is selected, it starts executing, occupies the\
    \ mutex and enters the critical section. In most implementations, the flow selection\
    \ will be random. Only the owner can release the mutex. Here is the pseudocode\
    \ of this operation:\n```cpp\nmutex_unlock(mutex_t mutex) {\n    if (mutex.owner\
    \ != this_thread)\n        return error;\n    mutex.state = free;\n    if (waiting_threads())\n\
    \        wakeup(some_thread);\n}\n```\n\nSome implementations provide a third\
    \ operation try to take the mutex (`mutex_trylock`): if the mutex is free, to\
    \ act similarly to `mutex_lock`, if busy - to immediately return the error and\
    \ continue execution.\n\nHere is the simplest implementation of the critical section\
    \ using a mutex.\n```cpp\nmutex_t mutex;\nmutex_lock(mutex);\n// critical section\n\
    mutex_unlock(mutex);\n```\n\nThe main difference in the mutex of binary semaphores\
    \ is that the release of `mutex` can only be done by its owner, while the semaphore\
    \ can change the value of any stream, which has access to it.\n\n### Interprocess\n\
