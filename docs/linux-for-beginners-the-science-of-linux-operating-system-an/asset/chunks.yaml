  trans: "\n\n`sigaction()` 系统调用用于设置信号处理处。\n\n```c\n#include <signal.h>\nint sigaction\
    \ (int signum, // 信号编号\nstruct sigaction * action, // 新布局\nstruct sigaction *\
    \ old_action); // 返回之前的处理处\n```\n\n该功能通过 `sigaction` 结构体描述，包含以下字段：\n- `sa_handler`:\
    \ 信号处理函数的指针\n- `sa_mask`: 信号掩码，指定在处理器内部哪些信号将被被阻塞\n- `sa_flag`: 额外的标志位\n\n将 `sa_mask`\
    \ 和 `sa_flag` 置零（不阻塞任何信号）：\n```c\nstruct sigaction action = {0};\n```\n\n`sa_handler`\
    \ 字段应设置为指向预先声明的函数，该函数格式如下：\n```c\nvoid user_handler (int signum){\n    // 信号处理\n\
    }\n```\n\n此功能成为一个信号处理器。`signum` 参数决定了向处理程序发送哪个信号（可以通过多次 `sigaction()` 调用为多个信号注册同一个处理程序）。注册后，当接收到相应的信号时，处理程序始终会被调用：\n\
    \n```c\n#include <signal.h>\nvoid sigint_handler (int signum){\n    // SIGINT\
    \ 处理\n}\n// ……\naction.sa_handler = sigint_handler;\nsigaction (SIGINT, & action,\
    \ 0);\n```\n\n如果我们需要组织等待信号，最简单的方法是打开系统调用 `pause()`。在这种情况下，进程进入待机模式，并在该模式中将输出任何信号：\n\
    ```c\n//请求处理程序协助 sigaction ()\npause (); // 等待信号\n```\n\n## 信号生成\n\n让我们考虑如何向进程发送信号。这使用了\
    \ `kill()` 系统调用。\n\n```c\n#include <signal.h>\nint kill (pid_t pid, // 进程 ID\n\
    int signum ); // 信号编号\n```\n\n例如，向命令行指定的进程 `pid` 发送 `SIGHUP` 信号：\n```c\nkill (\
    \ atoi ( argv [1], SIGHUP );\n```\n\n## 进程异步执行的组织\n\n考虑如何使用信号处理来组织进程的异步执行。如你所知，调用\
    \ `waitpid()` 会导致子进程同步执行。而启动后代进程是异步的。在祖先进程中不对该后代调用 `waitpid()` 似乎是自然的。但后代进程完成后，它将变成一个僵尸进程。\n\
    \n为了避免这种情况，你必须利用祖先进程在后代进程结束时接收一个特殊的 `SIGCHLD` 信号这一事实。在信号处理器中调用 `waitpid()` 将从进程表中移除子进程信息，从而在系统中留下僵尸。\n\
    \n```c\nvoid clear_zombie (int signum){\n    waitpid (-1, NULL, 0);\n}\nstruct\
    \ sigaction action = {0};\naction.sa_handler = clear_zombie ;\nsigaction (SIGCHLD,\
    \ & action, 0);\nif ((pid = fork ()) == - 1)\n    exit ();\nif ( pid == 0){\n\
    \    // 后代异步运行\n    exit ();\n}else{\n    // 祖先进程没有 waitpid () 调用\n}\n```\n\n\
    ## Linux 中的线程管理\n\n### 多线程的基础支持\n\n直到最近，Linux 多线程的唯一支持是 `clone()` 系统调用，它使得基于现有进程创建新进程成为可能。该调用类似于\
    \ `fork()` 调用，但具有其他几个特性。\n\n- 对于新进程，你需要指定一组特殊的标志位，以决定祖先和后代之间如何分配资源。可以共享的资源包括地址空间、打开的文件信息、信号处理程序。注意，在传统的\
    \ `clone()` 实现中，没有对进程标识符 (`pid`)、祖先 ID 以及其他重要属性进行特殊处理。\n- 新进程没有设置新栈（作为结果，调用 `clone()`\
    \ 的两个进程可能会共享同一个内存区域，这对于通用堆栈来说是不可接受的）。\n\n支持 `clone()` 意味着实现 1:1 多线程方案。\n1. 系统中的主要实体是进程而非线程（在\
    \ Linux 中，内核提供的关于在内核上运行的指令被称为进程，而不是内核线程）。Linux 传统的多线程实现规定将用户线程映射到内核中的进程。因此，单独查看\
    \ Linux 中的流数据结构是不切实际的——它与进程使用完全相同的 `task_struct` 结构进行显示。\n\n## Linux 传统多任务支持的缺点\n\
    \nLinux 内核中的多线程基础自 `clone()` 系统调用以来一直没有经历过原则性的变化。在此期间，Linux 已从一个实验性系统演变为一个行业级系统，实现了企业级的重型应用。这种对系统的使用导致了多线程、高可靠性和可扩展性的实现。显然，`clone()`\
    \ 系统调用的实现无法满足这些需求。我们在 STI 内核中已经拥有完整的多线程处理设施。流控制是标准 POSIX 1996 对应 API 的一部分，名为流\
    \ POSIX。\n\n## Linux 内核线程\n\n除了用户进程和线程外，Linux 还支持一种特殊的计划对象，被称为内核线程。这些流像普通进程和流一样被调度，每个流都有自己的\
    \ id (`pid`)。内核线程与进程及用户线程的区别在于：\n- 它们的流函数定义在内核代码中\n- 它们只在内核模式下运行\n- 无法访问在用户模式下分配的内存\n\
    \n## 流管理软件接口\n\n### 创建线程\n\n要向当前进程添加新线程，POSIX 使用 `pthread_create()` 函数，语法如下：\n\
    \n```c\n#include <pthread.h>\nint pthread_create (pthread_t * th, pthread_attr\
    \ * attr,\n```\n"
- fmt: "\n```\nvoid * (* thread_fun) (void * th, void * arg);\n```\nConsider the parameters\
    \ of this function:\n- `th` is a pointer to a predefined structure of type `pthread_t`\
    \ which will then be passed to other functions of work with flows; then call the\
    \ AI to handle the flow (thread handle).\n- `Attr` is a pointer to a structure\
    \ with flow attributes (you need to pass a null pointer to use the default attributes;\
    \ some attributes will be reviewed later).\n- `thread_fun` is a pointer to a stream\
    \ function that should be described as:\n```c\nvoid * mythread_fun (void * value)\
    \ {\n  // executing the stream code\n}\n```\n- `arg` - the data passed to the\
    \ stream function (there they will get a parameter value).\n\nAn example of creating\
    \ a POSIX stream:\n```c\n#include <pthread.h>\n// flow function\nvoid * thread_fun\
    \ (void * num){\n    printf (\" stream number % d \\n\", (int) num);\n}\n// ……………………………\n\
    pthread_t th;\n// create the second thread\npthread_create (& th, NULL, thread_fun,\
    \ (void *) ++ thread_num);\n```\nThere are two threads running in parallel. The\
    \ new thread begins to run in parallel with the thread that created it. For example,\
    \ if a thread was created inside the `main()` function, then two threads would\
    \ continue to execute: an original program executing the `main()` code and a new\
    \ one.\n\n## Completion of POSIX Streams\nTo end a thread, just go to the end\
    \ of its function `thread_fun()` or call `pthread_exit()` from it:\n```c\n#include\
    \ <pthread.h>\nvoid pthread_exit (void * retval);\n```\nThe `retval` parameter\
    \ specifies the return code. Here is an example of ending a stream:\n```c\nvoid\
    \ * thread_fun (void * num ){\n    printf (\"stream number % d \\n\", (int) num);\n\
    \    pthread_exit (0);\n}\n```\nThere are two different situations for the application\
    \ startup:\n- Executing the return statement or executing all statements by the\
    \ end of `main()` completes the whole process with all threads this action does\
    \ not affect other threads - they will continue executing until they are completed.\n\
    - Executing `pthread_exit()` function inside the `main()` function completes only\
    \ the initial thread, calling `pthread_exit()` is used only to join threads.\n\
    \n## Waiting For Completion Of Threads\nTo await completion of threads, use the\
    \ `pthread_join()` function. It has the following syntax:\n```c\nint pthread_join\
    \ (pthread_t thread, void ** status);\n```\nThis function blocks the thread where\
    \ it was called until the thread specified by `thread` deserves its execution.\
    \ If `status` is not a null pointer, it will point to the data returned by the\
    \ stream after the call `pthread_exit()`. If the thread is already complete by\
    \ the time `pthread_join()` is called, its information should be read immediately.\n\
    \n## Conclusions\n- Processes and threads are active resources of computer systems\
    \ that implement code execution. The thread is called a set of sequentially executed\
    \ commands. A process is a collection of one or more threads and the address space\
    \ in which they are executed. Streams in the same address space can share data\
    \ together, and for streams of different processes without special means, this\
    \ is not possible. In traditional systems, each process can execute only one thread.\
    \ Modern operating systems support the concept of multithreading.\n- Using threads\
    \ in an application means paralleling it - the ability to perform actions simultaneously\
    \ with different snippets of code. Program parallelism reflects the asynchronous\
    \ nature of the outside world, its sources being code execution on multiple processors,\
    \ I/O operations, user interaction requests. Scheduling allows applications to\
    \ implement this course and achieve parallelism.\n- There are user threads running\
    \ in the process address space and kernel threads with which the OS kernel works.\
    \ The relationship between them determines the scheme of the flow model. In practice,\
    \ they often use the 1:1 scheme, when each thread of the user corresponds to one\
    \ thread of the kernel, and the kernel itself is responsible for managing the\
    \ threads of the user.\n- The flow can be in different states (execution, readiness,\
    \ etc.). The principles of moving from one state to another depend on the flow\
    \ planning and processor time planning. Moving the process from execution state\
    \ to any other state is about switching the context - transferring control from\
    \ one thread to another while preserving the state of the processor.\n- Each process\
    \ and flow in the system corresponds to its control unit - a data structure containing\
    \ all the necessary information. During the creation process (usually by the system\
    \ call `fork()`), one control unit is created, memory is allocated and the mainstream\
    \ is launched. Creating flow is faster and easier because they do not need to\
    \ allocate memory to the new address.\n\n## Chapter 4: Process and Flow Planning\n\
    The ability to run streams in parallel depends on the number of processors available.\
    \ If the processor is single, parallel execution is impossible in principle (only\
    \ one thread can be executed at any one time). If the number of processors is\
    \ `N > 1`, parallel execution can only be implemented for `N` threads (one thread\
    \ per processor). The main purpose of scheduling for a single-processor system\
    \ is to arrange multiple threads on a single processor that would give the system\
    \ user the impression that they are running at the same time. This definition\
    \ can be extended to multiprocessor systems if a scheduling task occurs when the\
    \ number of threads exceeds the number of available processors. Consider the basic\
    \ types of planning, their principles, and algorithms.\n\n## General Principles\
    \ Of Planning\nConsider the basic principles underlying planning.\n\n Features\
    \ Of Thread Execution\nIn terms of scheduling, flow can be depicted as a cycle\
    \ of alternating computation (CPU usage) and I/O periods. The time interval during\
    \ which the flow executes only the instructions of the processor is called the\
    \ CPU usage interval (CPU burst), the time interval when the flow is waiting for\
    \ I/O, is the I/O burst interval. Most of these intervals are from 2 to 8 ms.\n\
    Streams that spend more time computing and less on the I/O are referred as processor\
    \ bound (CPU bound). They actively use the processor. Their main characteristic\
    \ is the time spent on computing, the intervals of CPU usage for them are longer.\n\
    Flows that take most of the time are pending I/O referred as input-output bound\
    \ (I/O bound). Such threads load the processor much less, and the average length\
    \ of the processor usage interval for them is small. The higher the clock speed\
    \ of the processor, the more flows can be attributed to the category: Processor-limited\
    \ flow (matrix multiplication), I/O restricted stream (I/O bound), and CPU usage\
    \ (CPU bound).\n\n## Planning Mechanisms and Policy\nThe mechanism and policy\
    \ should be differentiated. Scheduling mechanisms include context switching tools,\
    \ flow synchronization tools, etc., and scheduling policies are tools for determining\
    \ when to switch contexts. The part of the system responsible for policy is called\
    \ scheduler and the algorithm used for this - scheduling algorithm. There are\
    \ various evaluation criteria for planning policies, some of which apply to all\
    \ systems, others to batch systems or interactive only. Today, three criteria\
    \ are most commonly used to evaluate goal:\n- Minimum response time: This is the\
    \ most important criterion for interactive systems. Response time refers to the\
    \ time between running a stream (or typing a command) and getting the first response.\
    \ For modern systems, we have taken the time of 50-150 ms.\n- Maximum bandwidth:\
    \ This is the number of tasks that the system can perform per unit of time (for\
    \ example, per second). Such a criterion is appropriate to apply in batch systems;\
    \ in interactive systems, it can be used for background tasks. To increase bandwidth,\
    \ you must:\n    - Reduce wasted time (for example, the time it takes to switch\
    \ context).\n    - Use resources more efficiently (to ensure that neither the\
    \ processor nor I/O devices are idle).\n- Equity: The third criterion means that\
    \ CPU time is allocated according to importance. Fairness provides such a distribution\
    \ that all threads advance in their execution. Note that implementing fair policy\
    \ does not always reduce response time.\n\n## Planning Principles\nThe principles\
    \ of flow planning are applicable first to multithreaded systems with 1:1 implementation\
    \ (only kernel flows are planned here), as well as to systems with process implementation.\
    \ In the latter case, the term \"process\" can be used instead of \"flow\" and\
    \ the information necessary for planning can be stored in these process structures.\
    \ More complex scheduling principles are used in multi-threaded systems for which\
    \ the number of user threads does not match the number of kernel threads (schemes\
    \ 1:M and M:N). They require two schedulers: one for kernel-level operation, the\
    \ other for user mode.\n\n## Types Of Planning\nDistinguish between long-term,\
    \ medium-term, and short-term scheduling.\n\n### Long-Term Planning\nLong-term\
    \ planning means determining which of the programs should be in the vicinity to\
    \ perform. This scheduling is also called static because it does not depend on\
    \ the current state of the system. It played an important role in batch systems\
    \ when it was known in advance what processes needed to be completed and the tasks\
    \ could be scheduled. In interactive systems (eg, systems with time-sharing),\
    \ loading processes is not subject to planning; so they usually use a simplified\
    \ long-term planning strategy. The system allows you to create processes and threads\
    \ to reach some maximum limit, then further attempts to create a new process or\
    \ flow will cause an error. This strategy is also based on the psychology of users\
    \ who, feeling uncomfortable in an overloaded system, can interrupt work, which\
    \ leads to reduced load.\n\n### Medium-Term Planning\nMedium-term scheduling controls\
    \ the transition of paused flows to standby and back. In the control unit which\
    \ is ready for execution, threads are immediately organized in a structure called\
    \ queue of threads (or ready queue). The transition to a suspended state can be\
    \ caused by the following factors:\n- Waiting for an I/O operation.\n- Waiting\
    \ for the completion of another thread (joining).\n- Blocking a stream because\
    \ it needs to be synchronized with other streams.\nUsually, for the correct organization\
    \ of this expectation, in addition to the ready queue, they implement an additional\
    \ set of queues. Each such queue is associated with a resource that may cause\
    \ flow expectations (eg, an I/O device); these queues are called scheduling queues\
    \ or waiting queues (wait queues). The mid-term scheduler manages all these queues\
    \ by moving threads between them and the ready queue.\n\n### Short-Term Planning\n\
    Short-term planning or processor scheduling (CPU scheduling) is the most important\
    \ type of planning. It answers two basic questions:\n- When to interrupt a stream?\n\
    - Which of the ready-to-execute threads should the processor transfer at this\
    \ point?\nA short-term scheduler is an OS subsystem that interrupts the active\
    \ flow in the event of a need and chooses the one that should be executed from\
    \ the queue. Its performance is top-notch because it receives control very often.\
    \ There is also a controller (dispatcher), which directly controls pre-selected\
    \ streams (context switches). The format of the queue of ready flows depends on\
    \ the implementation of short-term planning. This stage can be organized on the\
    \ principle of FIFO, set priorities, or disordered, which is called the related\
    \ list. All planning strategies and algorithms that we will look at below are\
    \ short-term planning.\n\n## Planning Strategies - Displacement And Non-placement\
    \ Multitasking\nBefore considering basic strategies, let's list the options for\
    \ transferring control from one thread to another:\n- After the flow has entered\
    \ standby state (eg, during input/output or connection).\n- After completion of\
    \ the flow.\n- Explicit (the thread itself gives the processor to other threads\
    \ while it is busy).\n- Interrupts (for example, a timer can interrupt a stream\
    \ that is running longer than allowed). The latter differs from others in the\
    \ flow cannot control when transfer time has come, which is the responsibility\
    \ of the operating system. Depending on this variant of control transmission,\
    \ there are two main strategies for flow planning - displacement and non-displacement.\n\
    In pre-emptive multitasking, flows may be temporarily interrupted without the\
    \ need for them to transfer control. Interrupting the flow and transfer control\
    \ to another stream is done often implemented in all modern operating systems.\
    \ In non-displacement multitasking, the latter control transmission is not implemented,\
    \ and the streams themselves must give control of the OS for transmission or at\
    \ least go to standby. If a thread forgets or fails to do so, for example, it\
    \ will take the processor an endless loop, other threads will not be able to continue\
    \ their work. This strategy was implemented in Windows. Naturally, the implementation\
    \ of non-displacement multitasking in the general case makes the system quite\
    \ unstable (any incorrectly written application can cause a \"hang\" of the whole\
    \ system). Practice has shown that non-displacement multitasking in systems with\
    \ user applications cannot be implemented. Such a strategy, however, can be used\
    \ in systems where all applications are executed in kernel mode and are actually\
    \ system drivers. The development of such applications requires high skills of\
    \ programmers; requirements for applications can be compared with requirements\
    \ for the OS itself. With the simplicity of implementation and absence of external\
    \ interruptions from the OS, the scheduler can increase system productivity for\
    \ the limited range of tasks (for example, in the case of Windows OS it was to\
    \ use the system as a server).\n\n## Planning Algorithms\nThe scheduling algorithm\
    \ allows the short-term scheduler to choose from the ready-to-run threads the\
    \ one to be executed next. It can be said that algorithms implement planning policies.\
    \ Depending on the strategy implemented by the algorithms, they are divided into\
    \ displacement and non-displacement. Some algorithms fit only one of these strategies,\
    \ others may have both displacement and non-displacement implementations.\n\n\
    ### FIFO Planning\nConsider the simplest (\"naive\") algorithm in which flows\
    \ are executed in order of their appearance on the system and executed before\
    \ going to standby or completion. The queues are organized according to the FIFO\
    \ principle, so the algorithm is called FIFO algorithm. As soon as a new stream\
    \ is created in the system, its control unit is added to the tail of the queue.\
    \ When the processor is released, it is provided to the stream from the queue\
    \ head. This algorithm has many disadvantages:\n- It is by definition irreversible.\n\
    - The average response time for it may be significant (for example, if the former\
    \ receives a stream with a long CPU usage interval, other streams will wait even\
    \ if they use only short intervals).\n- It is subject to the convoy effect.\n\
    The effect of the convoy can be explained by this situation: Suppose there is\
    \ a single thread (let's call it `T_CPU`) in the system, limited by processor\
    \ capabilities, and many `T_io` threads limited by I/O capabilities. Sooner or\
    \ later, the `T_CPU` thread will be available to the processor and will execute\
    \ instructions with a long interval of use of the CPU. During this time, the other\
    \ `T_io` streams will complete the I/O, queue the finished threads and wait there\
    \ with idle I/O devices. When `T_CPU` finally blocks and transfers control of\
    \ all flows, `T_io` quickly follow the instructions of their CPU range and then\
    \ move to the I/O. After that, `T_CPU` will again capture the processor for a\
    \ long time, etc.\n\n### Circular Planning\nThe easiest to understand and the\
    \ fairest algorithm is circular planning (round-robin scheduling). In the Middle\
    \ Ages, the term \"round-robin\" was coined in petitions where signatures were\
    \ done in a circle so that one could not know who signed up first (this name indicates\
    \ that for such an algorithm all flows are equal). Each stream allocated time\
    \ period in which this stream is allowed to run is called a time slice (or time\
    \ quantum). When the thread is still running after the time quantum is exhausted,\
    \ it is interrupted and the processor switches to perform instructions from another\
    \ thread. When it blocks or completes its execution until the time quantum runs\
    \ out, the processor is also passed to another thread. The time quantum for the\
    \ whole system is the same. Such an algorithm is quite easy to implement. For\
    \ this, the turn of ready threads should be cyclic list. When a stream has exhausted\
    \ its quantum, it is moved to the end of the list where new flows are provided.\
    \ Checking the exhaustion of the quantum is performed by the interrupt handler\
    \ from the system. The only characteristic that affects the operation of the algorithm\
    \ is the length of the quantum. The balance between time spent switching contexts\
    \ and having to respond to many interactive queries should be kept in mind. Tasking\
    \ too short a quantum leads to many context switches and a significant percentage\
    \ of CPU time is spent not on useful work but on those switches. On the other\
    \ hand, a too-long quantum, while saving CPU time, also reduces response time\
    \ for interactive queries because if users press a key at the same time, threads\
    \ will be in the ready list. In the case of infinite length, circular scheduling\
    \ is reduced to FIFO algorithm (all threads have time to block or end before the\
    \ quantum is exhausted). In practice, it is recommended to set the quantum length\
    \ to 10-100 ms. Note that traditional circular scheduling can \"skew\" toward\
    \ streams constrained by processor capabilities. Such threads preferably utilize\
    \ their quantum completely, whereas threads limited by I/O often transmit control\
    \ until the quantum runs out. To solve this problem, you can increase the length\
    \ of the quantum (given the problems described earlier) or enter an additional\
    \ queue of completed streams.\n\n### Priority Planning\nCircular scheduling assumes\
    \ all flows are equally important. Otherwise, prioritized planning should be used.\
    \ The basic idea is simple: each thread is given priority, while the highest priority\
    \ stream from the ready threads will be executed. Priorities can be given statically\
    \ or dynamically. One of the approaches to implementation is multi-queue (multilevel\
    \ queues). In this case, several groups are organized with different priorities\
    \ (each group has different purposes). The decision to choose the thread to execute\
    \ is made as follows:\n- If the highest priority streams are, they should use\
    \ a simpler scheduling algorithm (such as circular scheduling), without regard\
    \ for streams in other queues.\n- If there are no threads in the queue, the threads\
    \ with lower priority move in. Different scheduling algorithms can be used for\
    \ different queues, and each queue is allocated a certain amount of CPU time.\
    \ Sharing priorities is a difficult task, and failing to resolve them can cause\
    \ low-priority processes to wait a long time. For example, in 1973, a machine\
    \ at the Massachusetts Institute of Technology found a low-priority process queued\
    \ for execution in 1967 and has not been able to run since. This situation is\
    \ called starvation. There are different ways to solve the problem of starvation:\
    \ for example, a scheduler can gradually reduce the priority of the stream they\
    \ perform (this process is called aging), and when it becomes lower than the next\
    \ priority stream, switch the context. You can, on the contrary, gradually increase\
    \ the priority of flows waiting in UT.\n\n### Planning Based On Performance Characteristics\n\
    An important class of prioritized scheduling algorithms is in which decisions\
    \ about the choice of flow are made on the basis of knowledge or evaluation of\
    \ the characteristics of its further execution. First of all, it should be noted\
    \ that in the \"first with shortest time of execution\" algorithm (Shortest Time\
    \ to Completion First, STCF), when associated with each flow duration following\
    \ the use of the CPU, each is selected to perform the stream in which this short\
    \ interval is. As a result, streams that capture the CPU for a shorter time get\
    \ an advantage during scheduling and leave the system faster. The STCF algorithm\
    \ is theoretically optimal by the criterion of the average response time that\
    \ is, it can be proved that for the selected group of flows, the average response\
    \ time in the application of this algorithm will be minimal compared to any other\
    \ algorithm. Unfortunately, for short-term planning, it is impossible to implement\
    \ it because this implementation requires anticipation of expected characteristics.\
    \ For long-term planning, it is used quite often (in this case, when setting the\
    \ task for the operator, the operator must indicate the expected time of completion,\
    \ which the system will take into account when choosing). Note also that the optimality\
    \ of such an algorithm is inseparable from its \"unfairness\" to flows with longer\
    \ CPU usage intervals. For short-term scheduling, an approximation to this algorithm\
    \ may be implemented based on an estimate of the length of the next processor\
    \ usage interval, taking into account previous intervals of the same flow. You\
    \ can use recursion in the formula to calculate this:\n```\ntn+1 = aT_n + (1 -\
    \ a)t_n, 0 < a < 1,\nt_0 = T_0\n```\nwhere `t_{n+1}` is the estimate of the length\
    \ of the interval; `t_n` is an estimate of the length of the previous interval;\
    \ `T_n` is the true length of the previous interval. The most commonly used values\
    \ are `a = 0.5`, in this case, it is sufficient to calculate the average between\
    \ the previous estimate and actual value. Shortest Remaining Time to Completion,\
    \ SRTF. Its difference from STCF is that when a new thread is queued for ready\
    \ threads, if the CPU usage time is shorter than the time remaining before the\
    \ current thread completes, the current thread is interrupted and new thread becomes\
    \ in its place.\n\n### Multilevel Feedback Queues\nAlgorithms of multi bursts\
    \ with feedback (multilevel feedback queues) are scheduling algorithms (using\
    \ settings it can be reduced to any other algorithm). In terms of organizing data\
    \ structures, this algorithm is similar to the multilevel queue algorithm: there\
    \ are several queues of ready threads with different priorities, with lower priority\
    \ queue only running when upper-level queues are empty. The differences between\
    \ the two algorithms are:\n- Flows are allowed to cross level to level.\n- Flows\
    \ are united not by priority and length of use interval flows with shorter intervals\
    \ are in line with higher priority within all queues, except the lowest, use circular\
    \ scheduling (FIFO algorithm works).\nDifferent queues correspond to different\
    \ lengths of quanta - the higher the priority, the shorter the quantum (usually\
    \ the length of quantum is halved). If the flow has exhausted its quantum, it\
    \ moves to the tail of the queue with lower priority (and with longer quantum).\
    \ As a result, flows with shorter intervals (such as I/O) remain with high priority,\
    \ and flows with longer intervals extend their time. You can also automatically\
    \ move non-managed streams from the lower tier to out.\n\n### Lottery Planning\n\
    Lottery planning (lottery scheduling) - the idea is that:\n- The stream receives\
    \ an insane amount of lottery tickets, each of which entitles the processor to\
    \ use T for time.\n- The scheduler selects one lottery ticket at random over a\
    \ period of time T. The winnable stream gets control to the next. Lottery planning\
    \ allows to:\n- Emulate circular scheduling, giving each stream the same number\
    \ of tickets.\n- Emulate priority scheduling, distributing tickets according to\
    \ priorities.\n- Emulate SRTF - short streams more tickets than long ones (if\
    \ the stream received at least one ticket, it would not starve).\n- Ensure that\
    \ the processing time is split between threads - give each thread a number of\
    \ tickets proportional to the fraction of processor time it needs (for example,\
    \ if there are three flows, and it is necessary for thread A to occupy 50% of\
    \ the processor and threads B and C, 25 each %, it is possible to give stream\
    \ A two tickets and flows B and C one each).\n- To change priorities, selecting\
    \ and adding tickets on the go.\nAlthough most of these tasks can be solved by\
    \ lottery planning, only approximately, in practice, they are quite satisfactory.\
    \ The longer the system works, the closer the results will be to the theoretical\
    \ values (by the law of large numbers). In fact, lottery planning takes advantage\
    \ of the fact that all planning ideology is largely heuristic since one cannot\
    \ accurately predict the nature of flow behavior in the system.\n\n## Implementation\
    \ Of Planning In Linux\nConsider two options for implementing Linux scheduling\
    \ - the traditional one (which includes kernels up to 2.4 inclusive) and the new\
    \ one included in the 2.6 kernels. The Linux kernel does not distinguish between\
    \ processes and flows when planning, so for certainty, we will continue to discuss\
    \ process planning. All processes in the system can be divided into three groups:\
    \ real-time with FIFO scheduling, real-time with circular scheduling, normal.\n\
    \n### Real-Time Scheduling Of Kernel Processes\nRegarding real-time processes,\
    \ it is enough to say:\n- They will always have priority over normal processes\
    \ when planning.\n- The FIFO scheduling process is performed until it itself gives\
    \ in to the processor (for example, as a result of suspension or termination)\
    \ or until it is superseded by a higher-priority real-time process.\n- The same\
    \ applies to the circular scheduling process, except that it will be further displaced\
    \ after the quantum of time is exhausted.\n\n### Traditional Scheduling Algorithm\n\
    Consider an algorithm for scheduling ordinary processes. At the core of the algorithm\
    \ is the allocation of CPU time to the epochs. During the epoch, each process\
    \ has a quantum of time, the length of which is calculated at the time of the\
    \ epoch. For the most part, different processes have quanta of different lengths.\
    \ When the process has exhausted its quantum, it is displaced and during the current\
    \ era it will no longer be performed. Management is given to another process.\
    \ If, however, the process is paused for I/O or due to synchronization, its quantum\
    \ is not considered exhausted and it may be exhausted by the scheduler during\
    \ the current era. The era ends when all ready-to-complete processes have exhausted\
    \ their quanta. In this case, the scheduling algorithm recalculates the quanta\
    \ for all processes and begins a new era. The quantum, which is set at the beginning\
    \ of the era, is called the basic quantum of processing time. Its values can be\
    \ dynamically modified by `nice()` and `setpriority()` system calls. The descendant\
    \ process always inherits the basic quantum of its ancestor. There are two types\
    \ of process priority: fixed, for real-time processes that are set only during\
    \ the process creation, and dynamic, for normal processes which depend on the\
    \ basic priority and the time remaining until the quantum is exhausted. Dynamic\
    \ priority to any conventional process is always lower than the priority of any\
    \ process for the first time. We describe the most important fields of the process\
    \ data structure:\n- Policy determines which group the process belongs (normal,\
    \ real-time FIFO algorithm, etc.).\n- Nice - specifies the value on which the\
    \ base quantum is based (in the future, for simplicity we will consider nice equal\
    \ to the base quantum).\n- Counter - contains the number of timer interrupts left\
    \ before the process quantum is exhausted. At the beginning of the era, the values\
    \ of the base quantum are reduced by one in the timer interrupt.\n\n### Procedure\
    \ Call\nConsider a situation where a scheduling call (called `schedule()`) occurs:\n\
    - When the process needs is blocked because the resource it needs is unavailable.\
    \ In this case, its control unit is first added to the corresponding waiting queue,\
    \ and then the redevelopment takes place with a delayed invocation. The delayed\
    \ startup is that at a certain point in time, special field `needed` process structures\
    \ are assigned a value of 1. This is echoed in the following cases:\n    - when\
    \ the current process has exhausted its quantum;\n    - when a process whose priority\
    \ is higher than the current one goes into standby; own    - when the process\
    \ is clearly inferior to its right to execute through an appropriate system call.\
    \ This happens immediately, but later, when the process must regain control after\
    \ the interrupt, it checks whether the field is reached.\n\n### Procedure\nThis\
    \ procedure first checks the current process is not in the standby state, and\
    \ if so removes it from the process queue. Then a process is selected for execution.\
    \ To do this, view the queue of finished processes, for each process evaluate\
    \ the dynamic priority and select the process with its maximum value. For a process\
    \ that has run out of its time, it will be zero. If no process has been selected,\
    \ the current process continues. When the choice is made, the context is switched\
    \ to a new process.\n\n### Beginning Of A New Era\nA special situation arises\
    \ when all processes in the queue of ready processes have the value of dynamic\
    \ priority zero, that is they have all exhausted their quantum, and it is time\
    \ to start a new era. However, this does not mean the system does not have processes\
    \ for which the quantum is not exhausted - they can be queued (most often these\
    \ are processes that are limited by I/O). When a new era opens, the quantum is\
    \ recalculated for all processes (not just standby processes). In this case, the\
    \ length of the quantum for each process is set equal to the sum of its base priority\
    \ and half of the remaining quantum in it:\n```c\nfor each_task (p)\np.counter\
    \ = (p.counter / 2) + p.nice;\n```\nSince the beginning of a new era, quantum\
    \ remains nonzero only in processes that are not in a state of readiness, this\
    \ algorithm provides an advantage to processes output. In this case, the quantum\
    \ value for the process can never be greater than twice its base priority value.\n\
    \n### Dynamic Priority Calculation\nLet us return to the calculation of dynamic\
    \ priority. To do this, use the `goodness()` function. Consider the possible values\
    \ it can return:\n- 0 - when the process has run out of time. This process will\
    \ not be selected for execution, except when it is in the queue of finished processes\
    \ first, and all other processes in the queue have also exhausted their quantum.\n\
    - 0 to 1000 - if the process has not exhausted its quantum of time. This value\
    \ is calculated based on the value of the base quantum of the process and the\
    \ portion of the current quantum remaining in it. This can be summarized as follows:\n\
    ```\nc = p.counter + p.nice;\n```\nwhere `p` is a pointer to the control block\
    \ of the process. This implies that the longer the process takes to complete and\
    \ the longer its base quantum, the higher its priority. In addition, further increasing\
    \ the value per unit for processes that use the same memory as ancestors (for\
    \ example, if the process shows the flow created by using `clone()`).\n\n### Reccounting\
    \ A Quantum When Creating A New Process\nConsider what happens when you create\
    \ a new process. The simplest solution (to copy the counter value to the descendant\
    \ data structure) can cause processes to artificially extend their quant by creating\
    \ new descendants that execute the same code. In order to prevent this, after\
    \ the `fork()` function, the values of `counter` are split in half: one half goes\
    \ to descendants, the other remains ancestral. List the disadvantages of the algorithm:\n\
    - The choice of process to execute is due to the calculation of dynamic priority\
    \ for all processes in the queue of finished processes. With the increasing number\
    \ of ready processes, it is unprofitable to view the queue from start to finish\
    \ during each call of the scheduling procedure.\n- Epochs change less often with\
    \ more processes in the system.\nThe algorithm is designed to reduce response\
    \ time for processes with limited I/O capabilities, if they are not interactive\
    \ (eg, background search indexing). With the increase in the number of processors,\
    \ maintaining common queues that not take into account the presence of different\
    \ processors becomes unprofitable.\n\n## Modern Approaches To Implementation\n\
    These shortcomings significantly affected the operation of system when operating\
    \ under load. Under normal circumstances, traditional Linux scheduling worked\
    \ effectively. Work on fixing the shortcomings continued. As a result, a new implementation\
    \ was integrated into the kernel of version 2.6. Consider how it helps solve previously\
    \ mentioned problems. First of all, this algorithm supports separate queues of\
    \ finishing processes for each processor, ensuring efficient operation under multiprocessing.\
    \ Another problem solved with the need to rely on the old algorithm for dynamic\
    \ priority of all ready processes during each procedure call. The decisions are\
    \ as follows: each queue is an array of ready-made process where elements are\
    \ sorted by dynamic priority. As a result, when choosing a process to execute,\
    \ it is enough to look at the highest priority queue for the first process that\
    \ can be started. This procedure does not depend on the number of ready processes.\
    \ There are two arrays of queues - an array of active processes and an array of\
    \ queues of processes with exhausted quantum. After the process has exhausted\
    \ its quantum, it is transferred from the first array to the long one. When there\
    \ is no process in the active queue, both arrays are replaced by missions, and\
    \ the sequence of steps is repeated from the beginning. Processes not yet managed.\n\
    \n## Programming Interface Of Planning\nTo change the base priority of the process,\
    \ use the call `setpriority()`:\n```c\n#include <sys/resource.h>\nint setpriority\
    \ (int which, int who, int priority);\n```\nIn particular, the parameter `which`\
    \ can be set to `PRIO_PROCESS` or `PRIO_USER`, respectively, indicating that the\
    \ parameter will be interpreted as a process identifier or user ID. In the first\
    \ case, they set a priority for a specific process (or the current process, if\
    \ `who` equals zero), in the second - for all processes of that user. The `priority`\
    \ parameter varies from –20 to 20, smaller values indicate higher priority. The\
    \ default value is 0. Negative priority values can only be set by users with admin\
    \ privileges. Use the `getpriority()` call to get information about the current\
    \ base priority:\n```c\nint getpriority (int which, int who);\n```\nThis call\
    \ returns the priority value; the `which` and `who` parameters for it have the\
    \ same meaning as for the `setpriority()` function. Here is an example of how\
    \ to use these calls:\n```c\n// set a priority for the current process\nsetpriority\
    \ (PRIO_PROCESS , 0,10);\n// find out about current priority value\nprintf (\"\
    \ current priority: % d \\n \", getpriority (PRIO_PROCESS , 0));\n```\nYou can\
    \ also use the `nice()` system call to change the underlying priority of the current\
    \ process relatively:\n```c\n#include <unistd.h>\nint nice ( int inc ); // changes\
    \ the priorities of the current process to inc .\n```\n\n## Conclusions\n- The\
    \ task of scheduling a thread is to organize the execution of multiple threads\
    \ on a single processor so that users have the impression that they are running\
    \ at the same time. Planning goals are: minimizing response time, maximizing throughput\
    \ and fairness. Major planning strategies include displacement and non-displacement\
    \ multitasking. In modern operating systems, multitasking is used when decisions\
    \ about switching the flow context are made in the system kernel code and not\
    \ in the flow code. Distinguish between long-term, middle-term and short-term\
    \ planning. The most important here is a short-term scheduler, which is used to\
    \ decide which flow to run at a given time. Basic short-term scheduling algorithms\
    \ include circular and priority planning.\n\n## Chapter 5: Flow Interaction\n\
    Let's consider the basic principles of interaction of flows of one process. The\
    \ focus will be on synchronizing access to the shared data of such streams.\n\n\
    ## Basic Principles Of Flow Interaction\nThreads that are executed in a parallel\
    \ process can be independent or interact with each other. A stream is independent\
    \ if it does not affect the execution of other process threads, does not detect\
    \ the impact on their part, and has no data in common. Its implementation is clearly\
    \ dependent on the input data. is called deterministic. All other threads have\
    \ data in common. This is the most important concept of multi-threaded programming.\
    \ Any stream can change this data at any time. Mechanisms for ensuring correct\
    \ access to shared data are called flow synchronization. Working with independent\
    \ streams is easier than interacting with threads. However, there are several\
    \ reasons why you cannot implement thread interaction:\n- It is necessary to organize\
    \ the sharing of information when working with streams. For example, database\
    \ or web server users may want to request the same information at one time, and\
    \ the system must ensure it is received concurrently.\n- Proper implementation\
    \ of this can significantly speed up the computing process on multiprocessor systems.\
    \ This task is divided into subtasks that perform simultaneously on different\
    \ processors, and the results are collected together for the final solution. This\
    \ technology is called parallel computing.\n- In tasks requiring concurrent execution\
    \ of I/O, I/O threads should be able to signal to other threads with the completion\
    \ of their operations.\n"
