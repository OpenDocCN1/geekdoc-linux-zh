    logical level defines the external representation of the system as a collection
    of files (usually located in directories), as well as performing operations on
    files and directories (creation, deletion, etc.). The physical layer defines the
    principles of allocation of data structures of the file system on the drive.Network
    SupportNetwork systemsModern operating systems are adapted to work on the network,
    they are called network operating systems . Networking support enables the OS
    to:❖        To make local resources (disk space, printers, etc.) publicly available
    over the network, ie to function as a server❖         Refer to other computer
    resources through a network that is functioning as a clien tImplementing the functionality
    of server and client based on vehicles  responsible for the transmission of data
    between computers according to the rules specified network protocols.Distributed
    systemsNetwork OSes do not hide the presence of a network from the user. The network
    support in them does not determine the structure of the system and enriches it
    with additional capabilities. There are also distributed  OSs that allow pooling
    the resources of several computers in a distributed system.  It appears to the
    user as one computer with multiple processors working in parallel. Distributed
    and multiprocessor systems are two major categories of OS that use multiple processors.Data
    securityData security in the OS means ensuring the reliability of the system (data
    protection against loss in case of failure) and protection of data against unauthorized
    access (accidental or intentional). To protect against unwarranted access, the
