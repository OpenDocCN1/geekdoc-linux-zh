    for them is small. The higher the clock speed of the processor, the more flows
    can be attributed to the second category.Processor-limited flow (matrix multiplication) I
    / O restricted stream (text editor)Interval input-output ( I / O bound )and the
    interval CPU usage ( CPU bound )Planning Mechanisms and PolicyThe planning mechanism 
    and policy  should be differentiated. Scheduling mechanisms include context switching
    tools, flow synchronization tools, etc., and scheduling policies are tools for
    determining when to switch contexts. The part of the system that is responsible
    for policy planning called scheduler  ( scheduler ) and the algorithm used to
    this - scheduling algorithm.There are various evaluation criteria for planning
    policies, some of which apply to all systems, others to batch systems or interactive
    only. Today, three criteria are most commonly used to evaluate goal achievement.❖
           Minimum response time . This is the most important criterion for interactive
    systems. Response time refers to the time between running a stream (or typing
    an interactive command) and getting the first response. For modern systems, we
    have taken the time of 50-150 ms❖        Maximum bandwidth . This is the number
    of tasks that the system can perform per unit of time (for example, per second).
    Such a criterion is appropriate to apply in batch systems; in interactive systems,
    it can be used for background tasks. To increase bandwidth, you must:❖        
    Reduce wasted load time (for example, the time it takes to switch context)❖       
    Use resources more efficiently (to ensure that neither the processor nor the I
    / O devices are idle)❖        The third criterion is  equity , which means that
    the CPU time is allocated according to their importance. Fairness provides such
    a distribution of processor time that all threads advance in their execution,
    and none proto. Note that implementing a fair planning policy does not always
    reduce the average response time. Sometimes this requires making the system less
    fairPlanning PrinciplesThe principles of flow planning are applicable first of
    all to multithreaded systems with 1: 1 scheme implementation (only kernel flows
    are planned here), as well as to systems with the implementation of process modules. In
    the latter case, the term “process” can be used instead of the term “flow” and
    the information necessary for planning can be stored in the structures of these
    processes. More complex scheduling principles are used in multi-threaded systems
    for which the number of user threads does not match the number of kernel threads
    (Schemes 1: M and M: N). They require two schedulers: one for kernel-level operation,
    the other for user mode.Types Of PlanningDistinguish between long - term scheduling,
    medium-term scheduling, and short-term scheduling.Long-Term PlanningLong-term
    planning means determining which of the programs should be in the vicinity to
    perform the download. This scheduling is also called static because it does not
    depend on the current state of the system. It played an important role in batch
    systems when it was known in advance what processes needed to be completed and
    the tasks could be scheduled. In interactive systems (eg systems with time-sharing)
    loading processes in principally engaged users, and it is not subject to planning; so
    they usually use a simplified long-term planning strategy. The system allows you
    to create processes and threads to reach some maximum limit, and then further
    attempts to create a new process or flow will cause an error. This strategy is
    also based on the psychology of users, who, feeling uncomfortable in an overloaded
    system, can interrupt work with it, which leads to reduced load.Medium-Term PlanningMedium-term
    scheduling controls the transition of paused flows to standby and back. In the
    control unit which is ready for execution, threads are immediately organized in
    a structure called queue of ready threads ( or ready queue ).The transition to
    a suspended state can be caused by the following factors:❖         Waiting for
    an I / O operation❖         Waiting for the completion of another thread (joining)❖
            Blocking a stream because it needs to be synchronized with other stream
    sUsually, for the correct organization of this expectation, in addition to the
    queue of ready threads, they implement an additional set of queues. Each such
    queue is associated with a resource that may cause flow expectations (eg, an I
    / O device); These queues are called scheduling queues or waiting for queues 
    ( wait for queues ). The mid-term scheduler manages all these queues by moving
    threads between them and the queue of ready threads.Short-Term PlanningShort-term
    planning or scheduling processor (  CPU scheduling ) is the most important type
    of planning. It answers two basic questions:❖         When to interrupt a stream?❖
            Which of the ready-to-execute threads should the processor transfer at
    this point?A short-term scheduler is  an OS subsystem that interrupts the active
    flow in the event of a need and chooses the one that should be executed from the
    queue. Its performance is top-notch because it receives control very often. There
    is also a controller ( dispatcher ), which directly controls pre-selected streams
    (context switches).The format of the queue of ready flows depends on the implementation
    of short-term planning. This stage can be organized on the principle of FIFO,
    set the priorities, wood or disordered, which is called the related list.All of
    the planning strategies and algorithms that we will look at below are short-term
    planning.Planning Strategies - Displacement And Non-Displacement MultitaskingBefore
    considering basic planning strategies, let''s list the options for transferring
    controls from one thread to another:❖        After the flow has entered a standby
    state (for example, during input-output or connection)❖         After completion
    of the flow❖        Explicit (the thread itself gives the processor other threads
    for a while until it is busy)❖        Interrupts (for example, a timer interrupt
    can interrupt a stream that is running longer than allowed)The latter option differs
    from the others in that the flow cannot control when the control transfer time
    has come, which is the responsibility of the operating system scheduler. Depending
    on this variant of control transmission, there are two main strategies for flow
    planning - displacement and non-displacement multitasking .In pre-emptive multitasking,
    logical flows may be temporarily interrupted without the need for them to transfer
    control to other flows. Interrupting the flow and transfer control to another
    stream often done in the interrupt handler of the system (and also the mayor). This
    strategy is implemented in all modern operating systems.In multitasking, flows
    may be performed during an unlimited time and cannot be used in interrupted OSes. For
    non-redundant multitasking, the latter control transmission is not implemented,
    and the streams themselves must give control of the OS for transmission to other
    threads or at least go to standby. If a thread forgets or fails to do so, for
    example, it will take the processor an endless loop, other threads will not be
    able to continue their work. This strategy was implemented in Nowell Net Ware.Naturally,
    the implementation of non-redundant multitasking in the general case makes the
    system quite unstable (any incorrectly written application of the user can cause
    a "hang" of the whole system). The practice has shown that non-redundant multitasking
    in systems with user applications cannot be implemented. Such a strategy, however,
    can be used in systems where all applications are executed in kernel mode and
    are actually system drivers. The development of such applications requires high
    skills of programmers, requirements for reliability of applications can be compared
    with the requirements for the OS itself. With the simplicity of implementation
    and absence of external interruptions of flows from the OS, the scheduler can
    increase system productivity for the limited range of tasks (for example, in the
    case of Net Ware OS it was to use the system as a file server).Planning AlgorithmsThe
    scheduling algorithm allows a short-term scheduler to choose from the ready-to-run
    threads the one to be executed next. It can be said that planning algorithms implement
    planning policies.Depending on the planning strategy implemented by the algorithms,
    they are divided into displacement and non-displacement. Displacement algorithms
    interrupt flows during their execution, non-displacement algorithms do not interrupt. Some
    algorithms fit only one of these strategies, others may have both displacement
    and non-displacement implementations.FIFO PlanningConsider the simplest ("naive")
    indelible algorithm in which flows are executed in order of their appearance on
    the system and executed before going to standby explicit transmission or completion. The
    queues of finished streams are organized according to the FIFO principle, so the
    algorithm is called the FIFO algorithm.As soon as a new stream is created in the
    system, its control unit is added to the tail of the queue. When the processor
    is released, it is provided to the stream from the queue head .This algorithm
    has many disadvantages:❖         It is by definition irreversible❖        The
    average response time for it may be quite significant (for example, if the former
    receives a stream with a long CPU usage interval, other streams will wait even
    if they themselves use only short intervals)❖         It is subject to the convoy
    effect (convoy effect)The effect of the convoy can be explained by this situation. Suppose
    there is a single thread (let''s call it T CPU  ) in the system, limited by the
    processor capabilities, and many T io  threads limited by the I / O capabilities. Sooner
    or later, the T CPU  thread will be available to the processor and will execute
    instructions with a long interval of use of the CPU. During this time, the other T io 
    streams will complete the I / O, queue the finished threads and wait there, with
    the idle I / O devices. When T CPU  finally block and will transfer control of
    all flows T io  quickly follow the instructions of their ranges CPU and then move
    to the IO. After that, T CPU  will again capture the processor for a long time,
    etc.Circular PlanningThe easiest to understand and the fairest algorithm is a circular
    plan algorithm  (round-robin scheduling). In the Middle Ages, the term “ round-robin ”
    was coined in petitions where signatures were done in a circle so that one could
    not know who signed up first (this name indicates that for such an algorithm all
    flows are equal).Each stream allocated time period in which this stream is allowed
    to run is called a time slice  ( or time quantum ). When the thread is still running
    after the time quantum is exhausted, it is interrupted and the processor switches
    to perform instructions from another thread. When it blocks or completes its execution
    until the time quantum runs out, the processor is also passed to another thread. The
    length of time quantum for the whole system is the same.Such an algorithm is quite
    easy to implement. For this, the turn of the ready threads should be a cyclic
    list. When a stream has exhausted its quantum of time, it is moved to the end
    of the list, where new flows are provided. Checking the exhaustion of the quantum
    of time is performed in the interrupt handler from the system timer.The only characteristic
    that affects the operation of the algorithm is the length of the quantum of time. The
    balance between time spent switching contexts and having to respond to many simultaneous
    interactive queries should be kept in mind here.Tasking too short a quantum of
    time leads to a lot of context switches, and a significant percentage of CPU time
    is spent not on useful work, but on those switches. On the other hand, the task
    of a too-long quantum, while saving CPU time, also reduces the response time for
    interactive queries because if ten users press a key at the same time, ten threads
    will be in the ready list, resulting in the last one expecting ten long quanta
    time. In the case of a quantum of infinite length, circular scheduling is reduced
    to the FIFO algorithm (all threads have time to block or end before the quantum
    is exhausted). In practice, it is recommended to set the quantum length to 10
    - 100 ms.Note that traditional circular scheduling can "skew" toward streams that
    are constrained by processor capabilities. Such threads preferably utilize their
    quantum completely, whereas threads limited by I / O often transmit control until
    the quantum runs out, and as a result, they have less processing time. To solve
    this problem, you can increase the length of the quantum (given the problems described
    earlier) or enter an additional queue of completed I / O streams, which takes
    precedence over completed queues.Priority PlanningCircular duty scheduling assumes
    that all flows are equally important. Otherwise, prioritized planning  should
    be used. The basic idea is simple: each thread is given priority, while the highest
    priority stream from the queue of ready threads will be executed. Priorities can
    be given statically or dynamically.One of the approaches to the implementation
    of planning priorities algorithm is multi-queue  ( multilevel queues ). In this
    case, several bursts organize groups with different priorities streams (streams
    each group usually have different purposes).The decision to choose the thread
    to execute is made as follows:❖        If the highest priority streams are streams,
    they should use a simpler scheduling algorithm (such as circular scheduling),
    without regard for streams in other queues❖        If there are no threads in
    the queue, the threads with the lower it priority move to the queueDifferent scheduling
    algorithms can be used for different queues, and each queue can be allocated a
    certain amount of CPU time. Sharing priorities is a difficult task, and failing to resolve
    them can cause streams of low priority processes to wait a long time. For example,
    in 1973, a machine was stopped at the Massachusetts Institute of Technology, which
    found a low-priority process - it was queued for execution in 1967 and has not
    been able to run since. This situation is called starvation.There are different
    ways to solve the problem of starvation. For example, a scheduler can gradually
    reduce the priority of the stream they perform (this process is called aging),
    and when it becomes lower than the next priority stream, switch the context to
    that stream. You can, on the contrary, gradually increase the priority flows waiting in UT
    .Planning Based On Performance CharacteristicsAn important class of prioritized
    scheduling algorithms is algorithms in which decisions about the choice of flow
    to execute are made on the basis of knowledge or evaluation of the characteristics
    of its further execution.First of all, it should be noted that in the " first
    - with the shortest time of execution  " algorithm ( Shortest Time to Completion First, STCF ),
    when associated with each flow duration interval following the use of the CPU,
    each is selected to perform at the stream in which this short interval. As a result,
    streams that capture the CPU for a shorter time get an advantage during scheduling
    and leave the system faster.The STCF algorithm is theoretically optimal by the
    criterion of the average response time, that is, it can be proved that for the
    selected group of flows, the average response time in the application of this
    algorithm will be minimal compared to any other algorithm. Unfortunately, for
    short-term planning, it is impossible to implement it because this implementation
    requires anticipation of the expected characteristics. For long-term planning,
    it is used quite often (in this case, when setting the task for the operator,
    the operator must indicate the expected time of completion, which the system will
    take into account when choosing). Note also that the optimality of such an algorithm
    is inseparable from its "unfairness" to flows with longer CPU usage intervals
    .For short-term scheduling, an approximation to this algorithm may be implemented
    based on an estimate of the length of the next processor usage interval, taking
    into account previous intervals of the same flow. You can use recursion in the formula to
    calculate this estimatet n +1 = aT n + (1- a ) t n , 0 < a < 1,    t 0 = T 0,where
    t n +1 - estimate the length of the interval;t n  is an estimate of the length
    of the previous interval;T n is the true length of the previous interval.The most
    commonly used values ​​ are a = 0.5, in this case, it is sufficient to calculate
    the average between the previous estimate and the actual interval value.Shortest
    Remaining Time to Completion First, SRTCF.Its difference from STCF is that when
    a new thread is queued for ready threads, the next CPU usage time is shorter than
    the time remaining before the current thread completes, the current thread is
    interrupted and a new thread becomes in its place.Multilevel Feedback QueuesAlgorithms of
    multi bursts with feedback  ( multilevel feedback queues ) are scheduling algorithms
    (using settings it can be reduced to any other algorithm), but one of them is
    used in the implementation. In terms of organizing data structures, this algorithm
    is similar to the conventional multilevel queue algorithm: there are several queues
    of ready threads with different priorities, with lower priority queue threads
    only running when all upper-level queues are empty.The differences between the
    two algorithms are:❖         Flows are allowed to cross from level to level❖       
    Flows in a line are united not by priority and the length of the use interval
    flows with shorter intervals are in line with higher priorityWithin all queues,
    except the lowest, use circular scheduling (the lowest FIFO algorithm works).
    The different queues correspond to different lengths of time quanta - the higher
    the priority, the shorter the quantum (usually the length of the quantum for adjacent
    queues is halved). If the flow has exhausted its time quantum, it moves to the
    tail of the queue with a lower priority (and with a longer quantum). As a result,
    flows with shorter intervals (such as limited I / O) remain with high priority,
    and flows with longer intervals extend their time. You can also automatically
    move non-managed streams from the lower tier to the tier in and out .Lottery PlanningPlanning
    lottery  ( lottery scheduling ) - algorithm, easy to understand and easy to implement
    and it has great potential. The idea of ​​ lottery planning is that:❖        
    The stream receives an insane amount of lottery tickets, each of which entitles
    the processor to use T for a time❖         The scheduler selects one lottery ticket
    at random over a period of time T❖         The winnable stream gets control to
    the next drawLottery planning allows you to:❖         Emulate circular scheduling,
    giving each stream the same number of tickets❖         Emulate priority scheduling,
    distributing tickets according to stream priorities❖        Emulate SRTCF - give
    short streams more tickets than long ones (if the stream received at least one
    ticket, it would not starve)❖        Ensure that the processing time is split
    between threads - give each thread a number of tickets proportional to the fraction
    of processor time it needs to allocate (for example, if there are three threads,
    and it is necessary for thread A to occupy 50% of the processor and threads B and C,
    25 each %, it is possible to give stream A two tickets and flows B and C one each)❖
            To change priorities, selecting and adding tickets on the goAlthough most
    of these tasks can be solved by lottery planning, only approximately, with some
    likelihood, in practice, they are quite satisfactory. The longer the system works,
    the closer the results will be to the theoretical values ​​ (by the law of large
    numbers). In fact, lottery planning takes advantage of the fact that all planning
    ideology is largely heuristic since one cannot accurately predict the nature of
    flow behavior in the system.Implementation Of Planning In LinuxConsider two options
    for implementing Linux scheduling - the traditional one (which includes kernels
    up to 2.4 inclusive) and the new one included in the 2.6 kernels. The Linux kernel does
    not distinguish between processes and flows when planning, so for certainty, we
    will continue to discuss process planning. All processes in the system can be
    divided into three groups: real-time with FIFO scheduling, real-time with circular
    scheduling, normal.Real-Time Scheduling Of Kernel ProcessesRegarding real-time
    processes, it is enough to say that:❖  They will always have priority over normal
    processes when planning❖        The FIFO scheduling process is performed until
    it itself gives in to the processor (for example, as a result of suspension or
    termination) or until it is superseded by a higher-priority real-time process❖
           The same applies to the circular scheduling process, except that it will
    be further displaced after the quantum of time is exhaustedTraditional Scheduling
    AlgorithmConsider an algorithm for scheduling ordinary processes. At the core
    of the algorithm is the allocation of CPU time to the epoch  ( epochs ). During
    the epoch, each process has a quantum of time, the length of which is calculated
    at the time of the epoch. For the most part, different processes have quanta of
    different lengths. When the process has exhausted its quantum, it is displaced
    and during the current era, it will no longer be performed. Management is given
    to another process. If, however, the process is paused for I / O or due to synchronization,
    its quantum is not considered exhausted and it may be exhausted by the scheduler
    during the current era. The era ends when all ready-to-complete processes have
    exhausted their quanta. In this case, the scheduling algorithm recalculates the
    quanta for all processes and begins a new era.The quantum, which is set at the
    beginning of the era, is called the basic quantum of the processing time.  Its
    values ​​ can be dynamically modified by the nice () and setpriority () system
    calls. The descendant process always inherits the basic quantum of its ancestor.There
    are two types of process priority: fixed, for real-time processes that are set
    only during the process creation, and dynamic, for normal processes, which depend
    on the basic priority and the time remaining until the quantum is exhausted. Dynamic
    priority to any conventional process is always lower than the priority of any
    real process for the first time.We describe the most important fields of the process
    data structure for planning:❖         Policy - determines to which group the process
    belongs (normal, real-time FIFO algorithm, etc.)❖        Nice - specifies the
    value on which the base quantum of the processing time is based (in the future,
    for simplicity, we will consider nice to be equal to the base quantum; in fact,
    this is not quite so)❖        Counter - Contains the number of timer interrupts
    left before the process quantum is exhausted. At the beginning of the era of a
    counter, the values ​ ​ of the base quantum are reduced and reduced by one in
    the timer interrupt handle rPlanning Procedure Call ConditionsConsider a situation
    where a scheduling call (called a schedule () ) occurs.❖        When the process
    needs to be blocked because the resource it needs is unavailable at this time. In
    this case, its control unit is first added to the corresponding waiting queue,
    and then the redevelopment takes place❖        With the  delayed start  ( lazy invocation ). The
    delayed startup is that at a certain point in time, special field needs _ reached process
    structures are assigned a value of 1\. This is echoed in the following cases:
    when the current process has exhausted its quantum; when a process whose priority
    is higher than the current one goes into standby; when the process is clearly
    inferior to its right to execute through an appropriate system call. This redevelopment
    happens immediately, but later, when the process must regain control after the
    interrupt, it checks whether the field is needed _ reached unit. If equal, the
    scheduling process is startedPlanning ProcedureThis procedure first checks that
    the current process is not in the standby state, and if so, removes it from the
    process queue. Then a process is selected for execution. To do this, view the
    queue of finished processes, for each process evaluate the dynamic priority and
    select the process and with its maximum value. For a process that has run out
    of its quantum of time, it will be zero. If no process has been selected, the
    current process continues. When the choice is made, the context is switched to
    a new process.The Beginning Of A New EraA special situation arises when for all
    processes in the queue of ready processes the value of dynamic priority is zero,
    that is, they have all exhausted their quantum, and it is time to start a new
    era. However, this does not mean that the system does not have processes for which
    the quantum is not exhausted - they can be queued (most often, these are processes
    that are limited by I / O.When a new era opens, the quantum is recalculated for
    all system processes (not just standby processes). In this case, the length of
    the quantum for each process is set equal to the sum of its base priority and
    half of the remaining quantum in it:for each_task (p)p.counter = (p.counter /
    2) + p.nice;Since the beginning of a new era of quantum remains nonzero only in
    processes that are not in a state of readiness, this algorithm provides an advantage
    to processes disabilities output. In this case, the quantum value for the process
    can never be greater than twice its base priority value.Dynamic Priority CalculationLet
    us return to the calculation of dynamic priority. To do this, use the goodness
    () function. Consider the possible values ​​ that it can return.❖        0 - when
    the process has run out of time. This process will not be selected for execution.
    Except when it is in the queue of finished processes first, and all other processes
    in the queue have also exhausted their quantum❖        0 to 1000 - if the process
    has not exhausted its quantum of time. This value is calculated based on the value
    of the base quantum of the process and the portion of the current quantum remaining
    in it. This can be summarized as follows:c = p.counter + p.nice; where p is a
    pointer to the control block of the process.This implies that the longer the process
    takes to complete and the longer it''s base quantum, the higher its priority. In
    addition, further increasing the value per unit for processes that use the same
    memory as ancestors (for example, if the process shows the flow created by using
    the clone () ) .Recounting A Quantum When Creating A New ProcessConsider what
    happens when you create a new process. The simplest solution (to copy the counter
    value to the descendant data structure) can cause processes to artificially extend
    their quant by creating new descendants that execute the same code. In order to
    prevent this, after the fork () function, the values ​​ of the counter are split
    in half: one half goes to descendants, the other remains ancestral.List the disadvantages
    of the algorithm.❖        The choice of process to execute is due to the calculation
    of the dynamic priority for all processes in the queue of finished processes. With
    the increasing number of ready processes in the system, it is unprofitable to
    view the queue from start to finish during each call of the scheduling procedure❖
           If the number of processes is very large, it will take a long time to list
    all the dynamic priorities at the beginning of a new era. On the other hand, epochs
    change less often with more processes in the system❖        The algorithm is designed
    to reduce response time for processes with limited I / O capabilities, even if
    they are not interactive (eg, background search engine indexing) and do not require
    a short response time❖  With the increase in the number of processors, maintaining
    common queues that do not take into account the presence of different processors
    becomes unprofitableModern Approaches To Planning ImplementationThese shortcomings
    began to significantly affect the operation of the system when it was operating
    under load conditions. Under normal circumstances, traditional Linux scheduling worked
    quite effectively. Work on fixing the shortcomings has continued. As a result,
    a new implementation of the scheduling algorithm has been integrated into the
    kernel of version 2.6. Consider briefly how it helps the solution '' bind previously
    mentioned problems.First of all, this algorithm supports separate queues of finishing
    processes for each processor, ensuring efficient operation under conditions of
    multiprocessing. Another problem that has solutions connected with the need to
    rely on the old algorithm for the dynamic priority of all ready processes during
    each procedure call planning. The decisions are as follows: each queue of the
    digestion processes is an array of ready-made process queues, where the elements
    are sorted by dynamic priority. As a result, when choosing a process to execute,
    it is enough to look at the highest priority queue for the first process that
    can be started. This procedure does not depend on the number of ready processes
    with a STEM .There are two arrays of queues of ready processes - an array of queues
    of active processes and an array of queues of processes with an exhausted quantum. After
    the process has exhausted its quantum, it is transferred from the first array
    to a long one. When there is no process in the active queue, both arrays are replaced
    by missions, and the sequence of steps is repeated from the beginning. As a result,
    the depletion of quanta processes increases the likelihood of running those processes
    that have not yet been managed.The Programming Interface Of PlanningLet''s take
    a look at the Linux system calls that can handle the underlying process priority
    (the value nice ) and thus influence their scheduling.To change the base priority
    of the process, use the call set priority ():#include <sys / resource.h>int setpriority
    (int which, int who, int priority);In particular, the parameter which can be set
    to PRIO_PROCESS or PRIO_USER, respectively, indicating that the parameter will
    be interpreted as a process identifier or user ID. In the first case, they set
    a priority for a specific process (or for the current process, if who equals zero),
    in the second - for all processes of that user .The priority parameter sets a
    new priority. Priority may vary from –20 to 20, smaller values ​​ indicate higher
    priority. The default value is 0\. Negative priority values can only be set by
    users with admin privileges.Use the getpriority () call to get information about
    the current base priority :Int getpriority (int which, int who);This call returns
    the priority value, the which and who parameters for it have the same meaning
    as for the setpriority () function.Here''s an example of how to use these calls:// set
    a priority for the current processsetpriority ( PRIO _ PROCESS , 0.10);// find
    out about the current priority valueprintf (" current priority: % d \ n ", getpriority
    ( PRIO _ PROCESS , 0));You can also use the nice () system call to change the
    underlying priority of the current process relatively :# Include < unistd . h
    >int nice ( int inc ); // changes the priorities of the current process to inc
    .Conclusions❖        The task of scheduling a thread is to organize the execution
    of multiple threads on a single processor so that users have the impression that
    they are running at the same time. Planning goals are: minimizing response time,
    maximizing throughput and fairness. Major planning strategies include displacement
    and non-displacement multitasking. In modern operating systems, multitasking is
    used when decisions about switching the flow context are made in the system kernel
    code and not in the flow code.❖        Distinguish between long-term, middle-term
    and short-term planning. The most important here is a short-term scheduler, which
    is used to decide which flow to run at a given time. Basic short-term scheduling
    algorithms include circular and priority planning.Chapter 5:Flow InteractionLet''s
    consider the basic principles of interaction of flows of one process. The focus
    will be on synchronizing access to the shared data of such streams.Basic Principles
    Of Flow InteractionThreads that are executed in a parallel process can be independent
    or interact with each other. A stream is independent if it does not affect the
    execution of other process threads, does not detect the impact on their part,
    and has no data in common with them. Its implementation is clearly dependent on
    the input data and is called deterministic.All other threads are interacting. These
    threads have data shared with other threads (they are in the address space of
    their process). Their implementation depends not only on the input data but also
    on the execution of other threads, ie they are non-deterministic  (let us consider
    further examples of such non-deterministic).Independent thread execution results
    can always be repeated, which is not the case with interacting threads. Data Worms
    are common to several streams, called shared data. This is the most important
    concept of multi-threaded programming. Any stream can change this data at any
    time. Mechanisms for ensuring correct access to shared data are called flow synchronization
    mechanisms.Working with independent streams is easier than interacting with threads. A
    programmer may disregard the fact that others are running concurrently with such
    threads, and ignore the state of the shared data that the thread is working with.However,
    there are several reasons why you cannot implement thread interaction.❖       
    It is necessary to organize the sharing of information when working with streams. For
    example, database or web server users may want to request the same information
    at one time, and the system must ensure that it is received concurrently by the
    threads that serve those users❖        Proper implementation of this interaction
    and the use of appropriate algorithms can significantly speed up the computing
    process on multiprocessor systems. This task is divided into subtasks that perform
    simultaneously on different processors, and the results are collected together
    for the final solution liabilities. This technology is called  parallel computing
    technology❖        In tasks requiring concurrent execution of I / O calculations,
    I / O threads should be able to signal to other threads with the completion of
    their operations❖  Such an organization makes it possible to divide tasks into
    separate executable modules, designed as separate threads, which, at the same
    time, the output of one module can be an input for another, and also increases
    the flexibility of the system, since individual modules can be changed without
    tapping othersThe need for concurrent execution of interacting streams requires
    mechanisms for exchanging data between them and ensuring that they are synchronized.The
    Main Problems Of Flow InteractionThe Problem Of CompetitionLet''s look at a simpler
    example of what can happen when interacting streams share common data without
    additional synchronization steps. Suppose that in banking organization systems
    for the service of each user allocate a separate flow (then trying to improve
    the system performance in the case of a large number of simultaneous requests). Suppose
    that putting data on a user''s contribution is reduced by increasing the global
    variable total _ amount. At this time, each sweat and k when changing the deposit
    is executed by the following simple operator:total_amount = total_amount + new_amount
    ;The question is: is it possible to guarantee that, due to the contribution, the
    flow, corresponding to each user, will be able to increase the value of total_amount by
    the required value?In fact, this at first glance is the simplest operator boils
    down to a sequence of actions:❖         Get the current value of total _ amount
    of global memory '' memory❖         To increase its new _ amount and store the
    result in a global memory '' memoryConsider the case where two users A and B share
    the same account. There are 100 monetary units in the account. User A is going
    to deposit 1000 User at the same time - 100 Flow T A  corresponding to the user
    A, T flow in  - the user B.Consider the following sequence of events (option 1).'
