  trans: "\n\n你可以使用 `_exit()` 系统调用或其库函数 `exit()` 来完成应用程序中的进程。该函数会关闭所有进程线程，正确释放所有资源，并调用\
    \ `_exit()` 实际完成退出。\n\n```c\n#include <unistd.h>\nvoid _exit (int status); //\
    \ status 指定返回码\n#include <stdlib.h>\nvoid exit (int status); // status 指定返回码\n\
    exit (128);\n```\n\n注意，当进程可以与其他进程结合使用资源时，最好不要调用 `exit()`（例如，它是一个拥有祖先进程的子进程，且子进程继承了祖先进程的资源描述符）。这是因为在这种情况下，尝试在子进程中释放资源会导致祖先进程中的资源也被被释放。你必须使用\
    \ `_exit()` 来完成这些进程。\n\n## 等待进程完成\n当进程完成后，其控制块不会立即从进程列表和哈希表中被移除，而是一直留在那里，直到另一个进程（祖先进程）将其移除。如果进程在系统中实际上缺失（它已结束），但只留下了控制单元，则该进程被称为`僵尸进程`\
    \ (zombie process)。\n\n### Waitpid() 系统调用\n你可以使用 `wait()` 系统调用从 `Linux` 中移除进程信息，但更多时候使用的是其更通用的版本\
    \ - `waitpid()`。此调用检查对应进程的控制单元是否在系统中。如果是，且该进程不在僵尸状态（即它仍在运行），那么在 `waitpid()` 情况下进程将进入等待状态。当子进程完成后，祖先进程退出等待状态并移除子进程控制单元。如果祖先进程没有对子进程调用\
    \ `waitpid()`，可能会长时间处于僵尸状态。\n\n## 应用程序中进程的同步实现\n让我们基于 `waitpid()` 的同步执行。根据 `POSIX`，该系统调用定义为：\n\
    \n```c\n# Include <sys/wait.h>\npid_t waitpid ( pid_t pid, // 期望进程的 pid\nint *\
    \ status, // 子进程完成状态信息\nint options ); // 默认为 0\n```\n\n`pid` 参数可以设置为 0，这意味着进程正在等待与祖先同组的进程；或者设置为\
    \ -1，意味着期望任何子进程。以下是一个带有期望的同步执行实现示例：\n\n```c\npid_t pid ;\nif ((pid = fork ())\
    \ == -1)\n    exit (-1);\nif (pid == 0){\n    // 子进程 - 调用 exec ()\n}else{\n  \
    \  // 祖先进程 - 等待后\n    int status;\n    waitpid (pid, & status, 0); // 继续执行\n}\n\
    ```\n\n`status` 值提供了关于已完成子进程的更多信息。`<sys/wait.h>` 中有许多宏：\n\n- `WIFEXITED(status)`\
    \ - 当子进程正常完成执行时返回非零值；\n- `WEXITSTATUS(status)` - 子进程返回码（仅当 `WIFEXITED()` != 0\
    \ 时）。\n\n获取子进程返回码的方法如下：\n```c\nwaitpid (pid, & status, 0);\nif (WIFEXITED (status))\n\
    \    printf (\" Descendant ended with code % d \\n\", WEXITSTATUS (status)) ;\n\
    ```\n\n## 5/7 信号\n在多任务的情况下，需要向进程报告发生在系统或其他进程中的事件。`POSIX` 定义的这种警报的最简单机制是 `alerts`（信号）。进程在接收到信号后，立即响应其特殊调用函数\
    \ - 信号处理程序（`signal handler`），或者根据每个信号相关的信号编号（该编号在系统中是唯一的）执行默认操作。信号同时无法传输任何其他信息。\n\
    \n定时器是 `UNIX` 系统上进程间通信最简单的机制，但由于它们允许传输有限的数据，因此它们主要用于事件报告。\n\n### 信号类型\n根据情况，信号分为同步信号和异步信号。\n\
    \n- **同步信号**在活动进程流的执行期间发生（通常通过错误 - 访问错误的内存区域、不正确的浮点运算、执行错误的指令和处理器设计）。这些信号由操作系统内核产生，并立即发送给导致错误的进程线程。\n\
    - **异步信号**可以在执行过程的任何时间被进程接收：\n    - 程序员可以使用系统调用向另一个进程发送异步信号，这在 `POSIX` 系统中被称为\
    \ `kill()`，该调用的参数是信号值和进程标识符。\n    - 信号也可能由某些外部事件（击键、终止等）引起。\n\n在处理此类信号期间，系统必须中断当前代码的执行，执行处理器代码并返回到接收信号时正在执行的同一条指令。\n\
    \n### 信号布局\n进程接收信号后可以通过以下三种方式之一做出响应（进程响应的方法称为信号警报处置）：\n- 调用信号处理程序\n- 忽略信号，在这种情况下信号会“消失”且不采取任何操作\n\
    - 使用默认分配（这是每个信号的默认设置，通常会终止进程）\n\n### 信号阻塞\n进程不仅可以设置信号的位置，还可以决定其在该时刻接收特定类型信号的意愿。如果进程未就绪，它可以阻塞这些信号。如果要传递给进程的信号被锁定，系统将其放入队列，它将留在那里直到进程将其解锁。进程通过更改`进程信号掩码`（process\
    \ signal mask，一个存储关于哪些信号可以立即传递给进程信息的特殊数据结构，通常存储在其控制块中）来锁定和解锁信号。子进程继承祖先的信号掩码。\n\
    \n### 信号示例\n考虑 `POSIX` 定义并在 `Linux` 中支持的信号（括号旁给出了信号编号）。同步信号包括例如系统在记录受保护内存区域时产生的\
    \ `SIGSEGV` (11) 信号。\n\n异步信号包括：\n- `SIGHUP` (1) - 挂断信号（例如，用户退出系统）\n- `SIGINT`\
    \ 和 `SIGQUIT` (2,3) - 来自键盘的程序中断信号（由用户按下 Ctrl+C 和 Ctrl+\\ 产生）\n- `SIGKILL` (9)\
    \ - 立即终止程序（此信号无法更改位置）\n- `SIGUSR 1`, `SIGUSR 2` (10,12) - 应用程序可以使用的用户信号\n- `SIGTERM`\
    \ (15) - 建议程序关闭（此信号与 `SIGKILL` 不同，可以被忽略）\n\n除 `SIGSEGV` 外，所有这些信号的默认操作都是终止程序（对于\
    \ `SIGSEGV` 会生成额外的内存转储 `core dump` - 一个存储进程地址空间镜像的文件，以供后续分析）。\n\n## 设置信号布局\n\n"
- fmt: "\nA `sigaction()` system call is used to set the signal disposition.\n\n```c\n\
    #include <signal.h>\nint sigaction (int signum, // signal number\nstruct sigaction\
    \ * action, // new layout\nstruct sigaction * old_action); // return the previous\
    \ disposition\n```\n\nThe exposition is described using the `sigaction` structure\
    \ with the following fields:\n- `sa_handler`: pointer to the signal processor\
    \ function\n- `sa_mask`: the signal mask that specifies which signals will be\
    \ blocked inside the processor\n- `sa_flag`: additional checkboxes\n\nLimit to\
    \ zeroing `sa_mask` and `sa_flag` (without blocking any signal):\n```c\nstruct\
    \ sigaction action = {0};\n```\n\nThe `sa_handler` field should be set as a pointer\
    \ to a previously declared function that looks like this:\n```c\nvoid user_handler\
    \ (int signum){\n    // signal processing\n}\n```\n\nThis feature becomes a signal\
    \ processor. The `signum` parameter determines which signal is sent to the handler\
    \ (the same handler can be logged for multiple signals by several `sigaction()`\
    \ calls). After logging in, the handler will always be called when it receives\
    \ the appropriate signal:\n\n```c\n#include <signal.h>\nvoid sigint_handler (int\
    \ signum){\n    // SIGINT processing\n}\n// ……\naction.sa_handler = sigint_handler;\n\
    sigaction (SIGINT, & action, 0);\n```\n\nIf we need to organize the wait for the\
    \ signal, the simplest way is to open a system call `pause()`. In this case, the\
    \ process enters standby mode, from which it will output any signal:\n```c\n//\
    \ ask the handlers for help with sigaction ()\npause (); // wait for a signal\n\
    ```\n\n## Signal Generation\n\nLet's consider how to send a process signal. This\
    \ uses the `kill()` system call.\n\n```c\n#include <signal.h>\nint kill (pid_t\
    \ pid, // process ID\nint signum ); // signal number\n```\n\nFor example, sending\
    \ a `SIGHUP` signal to a process `pid` that is specified at the command line:\n\
    ```c\nkill ( atoi ( argv [1], SIGHUP );\n```\n\n## Organization Of Asynchronous\
    \ Execution Of Processes\n\nConsider how you can use signal processing to organize\
    \ asynchronous process execution. As you know, calling `waitpid()` causes an offspring\
    \ to execute synchronously. When to start the descendant process is asynchronous.\
    \ It seems natural not to call `waitpid()` in the ancestor process for that descendant.\
    \ But upon completion of the descendant process, it will turn into a zombie process.\n\
    \nTo avoid this, you must take advantage of the fact that the ancestor process\
    \ receives a special `SIGCHLD` signal at the end of the descendant process. Calling\
    \ `waitpid()` in this signal handler will remove the descendant process information\
    \ from the process table, leaving zombies in the system.\n\n```c\nvoid clear_zombie\
    \ (int signum){\n    waitpid (-1, NULL, 0);\n}\nstruct sigaction action = {0};\n\
    action.sa_handler = clear_zombie ;\nsigaction (SIGCHLD, & action, 0);\nif ((pid\
    \ = fork ()) == - 1)\n    exit ();\nif ( pid == 0){\n    // descendant running\
    \ asynchronously\n    exit ();\n}else{\n    // ancestor does not have a waitpid\
    \ () call\n}\n```\n\n## Managing Threads in Linux\n\n### Basic support for multithreading\n\
    \nUntil recently, the only multithreading support for Linux was the `clone()`\
    \ system call, which made it possible to create a new process based on an existing\
    \ one. This call is similar to the `fork()` call but has several other features.\n\
    \n- For the new process, you need to specify a special set of checkboxes that\
    \ determine how resources will be distributed between the ancestor and the descendant.\
    \ The resources that can be shared include address space, open file information,\
    \ signal handlers. Note that in the traditional `clone()` implementation, there\
    \ is no special use of process identifier (`pid`), ancestor ID, and some other\
    \ important attributes.\n- The new process por not set a new stack (as a consequence\
    \ call `clone()` two processes can share a common memory diamond, which are unacceptable\
    \ for general use stack).\n\nSupport `clone()` means implementing multithreading\
    \ scheme 1:1.\n1. The primary ones in the system are processes, not threads (in\
    \ Linux, the instructions given by the kernel on which the kernel runs are called\
    \ processes, not kernel threads). The traditional multithreading implementation\
    \ on Linux determines that user threads are mapped to processes in the kernel.\
    \ Therefore, it is impractical to look at the flow data structures in Linux separately\
    \ - it is displayed with the same `task_struct` structure as the process.\n\n\
    ### The Disadvantages Of Traditional Multitasking Support For Linux\n\nMultithreading\
    \ basics in the Linux kernel have not undergone the principle of changes since\
    \ the `clone()` system call. In the meantime, Linux has evolved from an experimental\
    \ system to an industry-wide system where enterprise-class heavy-duty applications\
    \ are implemented. This use of the system has led to the implementation of multi-threaded\
    \ high reliability and scalability. It became apparent that the `clone()` system\
    \ call implementation did not meet these requirements. We had the full implementation\
    \ of multithreaded processing facilities at STI in the nucleus. Flow control is\
    \ part of the standard POSIX 1996 corresponding API was named streams POSIX.\n\
    \n### Linux Kernel Threads\n\nIn addition to user processes and threads, Linux\
    \ also supports a special kind of planned objects that are already known as kernel\
    \ threads. Such flows are scheduled as normal processes and flows, each with its\
    \ own id (`pid`). Differences of kernel threads from processes and user threads\
    \ are:\n- The flow functions for them are defined in the kernel code\n- They run\
    \ only in kernel mode\n- Them inaccessible areas of memory memory allocated in\
    \ user mode\n\n## The Flow Management Software Interface\n\n### Creating Threads\n\
    \nTo add a new thread to the current process, POSIX uses the `pthread_create()`\
    \ function with the following syntax:\n\n```c\n#include <pthread.h>\nint pthread_create\
    \ (pthread_t * th, pthread_attr * attr,\n```\n"
