  trans: "\n\n```\nvoid * (* thread_fun) (void * th, void * arg);\n```\n考虑此函数的参数：\n\
    - `th` 是一个指向 `pthread_t` 类型预定义结构体的指针，该指针随后被传递给其他处理流的工作函数；然后调用 AI 来处理该流（线程句柄）。\n\
    - `Attr` 是一个指向带有流属性的结构的指针（你需要传递一个空指针来使用默认属性；某些属性稍后会进行检查）。\n- `thread_fun` 是一个指向流函数的指针，其定义应描述为：\n\
    ```c\nvoid * mythread_fun (void * value) {\n  // 执行流代码\n}\n```\n- `arg` - 传递给流函数的数据（在函数内部将获得该参数值）。\n\
    \n创建一个 POSIX 流的示例：\n```c\n#include <pthread.h>\n// 流函数\nvoid * thread_fun (void\
    \ * num){\n    printf (\" stream number % d \\n\", (int) num);\n}\n// ……………………………\n\
    pthread_t th;\n// 创建第二个线程\npthread_create (& th, NULL, thread_fun, (void *) ++\
    \ thread_num);\n```\n有两个线程在并行运行。新线程开始与创建它的线程并行运行。例如，如果线程是在 `main()` 函数内部创建的，那么将有两个线程继续执行：一个执行\
    \ `main()` 代码的原始程序，另一个新程序。\n\n## POSIX 流的完成\n要结束线程，只需到达其函数 `thread_fun()` 的末尾，或从其中调用\
    \ `pthread_exit()`：\n```c\n#include <pthread.h>\nvoid pthread_exit (void * retval);\n\
    ```\n`retval` 参数指定返回码。这里是一个结束流的示例：\n```c\nvoid * thread_fun (void * num ){\n \
    \   printf (\"stream number % d \\n\", (int) num);\n    pthread_exit (0);\n}\n\
    ```\n应用程序启动有两种不同的情况：\n- 执行返回语句或在 `main()` 结束时执行所有语句，这将完成包含所有线程的整个进程，此操作不会影响其他线程\
    \ - 它们将继续执行直到完成。\n- 在 `main()` 函数内部执行 `pthread_exit()` 函数只完成初始线程，调用 `pthread_exit()`\
    \ 仅用于等待线程（join）。\n\n## 等待线程完成\n要等待线程完成，请使用 `pthread_join()` 函数。它的语法如下：\n```c\n\
    int pthread_join (pthread_t thread, void ** status);\n```\n该函数会阻塞调用它的线程，直到由 `thread`\
    \ 指定线程完成其执行任务。如果 `status` 不是空指针，它将指向流在调用 `pthread_exit()` 后返回的数据。如果当调用 `pthread_join()`\
    \ 时线程已经完成，则应立即读取其信息。\n\n## 结论\n- 进程和线程是实现代码执行的计算机系统活动资源。线程被称为一组顺序执行的命令。进程是一个一个或多个线程的集合，以及它们执行所的地址空间。同一地址空间内的流可以共同共享数据，而对于不同进程的流，在没有特殊手段的情况下这将是不可能的。在传统系统中，每个进程只能执行一个线程。现代操作系统支持多线程概念。\n\
    - 在应用程序中使用线程意味着对其进行并行化 - 即同时使用不同代码段执行操作的能力。程序并行性反映了外部世界的异步本质，其源头是多个处理器上的代码执行、I/O\
    \ 操作以及用户交互请求。调度允许应用程序实现这一过程并实现并行性。\n- 进程地址空间中运行着用户线程，内核线程与内核工作。它们之间的关系决定了流模型的方案。在实践中，它们通常使用\
    \ 1:1 方案，每个用户线程对应一个内核线程，内核本身负责管理用户线程。\n- 流可能处于不同的状态（执行、就绪等）。从一个状态移动到另一个状态的原理取决于流规划和处理器时间规划。将进程从执行状态移动到任何其他状态涉及切换上下文\
    \ - 在保留处理器状态的同时将控制从一个线程转移到另一个线程。\n- 系统中的每个进程和流都对应其控制单元 - 一个包含所有必要信息的数据结构。在创建过程中（通常通过系统调用\
    \ `fork()`），会创建一个控制单元，分配内存并启动主流。创建流更快、也更容易，因为它们不需要为新地址分配内存。\n\n## 第 4 章：进程与流规划\n\
    并行运行流的能力取决于可用处理器的数量。如果处理器是单的，在原则上是不可能并行执行的（任何时刻只能执行一个线程）。如果处理器数量 `N > 1`，则只能为\
    \ `N` 个线程实现并行执行（每个处理器一个线程）。单处理器系统调度的主要目的是在单个处理器上安排多个线程，给系统用户一种它们正在同时运行的印象。如果当线程数量超过可用处理器数量时发生调度任务，此定义可以扩展到多处理器系统。考虑规划的基本类型、其原理和算法。\n\
    \n## 规划的一般原理\n考虑规划规划的基础原理。\n\n线程执行的特征\n从调度的角度来看，流可以被描述为计算（CPU 使用）和 I/O 期间交替的循环。流仅执行处理器指令的时间间隔被称为\
    \ CPU 使用间隔（CPU 突发时间），流等待 I/O 的时间间隔称为 I/O 突发间隔。这些间隔中的大部分在 2 到 8 毫秒之间。\n花费更多时间在计算上而在\
    \ I/O 上花费较少的流被称为处理器密集型（CPU 密集型）。它们积极使用处理器。它们的主要特征是花在计算上的时间，它们的 CPU 使用间隔较长。\n花费大部分时间在等待\
    \ I/O 的流被称为输入/输出密集型（I/O 密集型）。此类线程对处理器的负载小得多，它们的处理器使用间隔的平均长度很小。处理器的时钟频率越高，可以归为此类类别的流就越多：处理器限制流（矩阵乘法）、I/O\
    \ 限制流（I/O 密集型）和 CPU 使用（CPU 密集型）。\n\n## 规划机制与策略\n机制和策略应当区分。调度机制包括上下文切换工具、流同步工具等，而调度策略是确定何时切换上下文的工具。负责策略的部分被称为调度器，用于此的算法称为调度算法。规划策略有多种评估标准，其中一些适用于所有系统，另一些仅适用于批处理系统或交互系统。今天，最常用的三个标准来评估目标：\n\
    - 最小响应时间：这是交互式系统最重要的标准。响应时间是指运行流（或输入命令）到获得第一个响应之间的时间。对于现代系统，我们取了 50-150 毫秒的时间。\n\
    - 最大带宽：这是系统单位时间内可以执行的任务数（例如每秒）。这种标准适用于适用于批处理系统；在交互式系统中，它可以用于后台任务。要增加带宽，你必须：\n\
    \    - 减少浪费的时间（例如切换上下文的时间）。\n    - 更高效地使用资源（确保处理器和 I/O 设备都不空闲）。\n- 公平性：第三个标准意味着根据重要性分配\
    \ CPU 时间。公平性提供了这种分布，使得所有线程在执行中不断进展。注意，实现公平策略并不总是减少响应时间。\n\n## 规划原理\n流规划原理首先适用于具有\
    \ 1:1 实现的多线程系统（这里只规划内核流），也适用于具有进程实现的系统。在后者的情况下，可以使用“进程”代替“流”，规划所需的信息可以存储在进程结构中。更复杂的调度原理用于用户线程数量与内核线程数量不匹配的系统（1:M\
    \ 和 M:N ）。它们需要两个调度器：一个内核级，另一个用户级。\n\n## 规划类型\n区分长期、中期和短期调度。\n\n### 长期规划\n长期规划意味着确定哪些程序应该在附近执行。这种调度被称为静态调度，因为它不取决于系统的当前状态。在批处理系统中，当预先知道需要完成哪些任务时，它起了重要作用。在交互式系统中（例如分时系统），加载进程是不可能的；因此通常使用简化的长期规划策略。系统允许在线程达到某些限制时创建新进程或导致错误。这种策略也基于用户的心理，当系统过载时可以中断工作。\n\
    \n### 中期规划\n中期调度控制暂停的流在备用和返回之间的转换。就绪执行的线程组织在队列中。转换到挂起状态由以下因素引起：\n- 等待 I/O 操作。\n\
    - 等待另一个线程的完成（连接）。\n- 因为流需要同步而阻塞。\n通常，为了正确的等待，除了就绪队列外，它们实现额外的队列。每个此类队列都与资源相关；这些队列被称为等待队列或阻塞队列。中期调度通过在这些队列和就绪队列之间移动线程来管理。\n\
    \n### 短期规划\n短期规划或处理器调度（CPU Scheduling）是最重要的规划类型。它回答两个基本问题：\n- 何时中断流？\n- 就绪线程中哪一个在这一点应该转移处理器？\n\
    短期调度器是操作系统子系统，在活动流需要时中断并从队列中选择要执行的。由于执行频繁，还有一个调度器（Dispatcher）直接控制上下文切换。就绪流的格式取决于短期规划，可以按\
    \ FIFO 原则组织。所有的规划策略算法将在下方查看。\n\n## 规划策略 - 抢占与非抢占式多任务\n在考虑基本策略之前，让我们看看从一个线程转移控制到另一个的选项：\n\
    - 流进入备用状态（例如，在输入/输出期间）。\n- 流完成后。\n- 忙碌时显式将处理器交给其他线程。\n- 中断（例如，定时器可以中断运行超过允许时间的流）。\n\
    取决于控制传输，流规划有两种主要的策略 - 抢占和非抢占式。在抢占式多任务中，流可能被临时中断并转移控制到另一个流，这在现代操作系统中是常见的，以便执行的。在非抢占式多任务中，控制传输是不实现的，流本身必须将控制交给操作系统或进入备用。如果线程忘记或失败，将会无限循环，其他线程将无法继续。自然地，非抢占式多任务在一般情况下系统非常不稳定（任何编写错误的应用程序都会导致整个系统死机）。\n\
    \n## 算法\n调度算法允许从就绪线程中选择下一个执行的。根据执行的策略，算法被分为抢占和非抢占式。\n\n### FIFO 规划\n考虑最简单的（“幼稚”）算法，流按照它们在系统中出现的顺序执行，直到进入备用或完成。队列按照\
    \ FIFO 原则组织，因此该算法被称为 FIFO 算法。当新流在系统中创建时，其控制单元被添加到队尾。当处理器释放时，从队列头提供流。该算法有许多缺点：\n\
    - 定义上是不可逆的。\n- 它的平均响应时间可能很大（例如，如果接收到一个长 CPU 使用间隔的流，其他流即使只使用短间隔也会等待）。\n- 它受队效应的影响。队效应可以用这种情况解释：假设系统中有一个线程（我们称之为\
    \ `T_CPU`）受处理器能力限制，而许多 `T_io` 线程受 I/O 能力限制。早晚 `T_CPU` 线程将获得处理器并执行长时间间隔的指令。在此期间，其他\
    \ `T_io` 流将完成 I/O，在队列中等待空闲的 I/O 设备。当 `T_CPU` 最终阻塞并转移所有控制时，`T_io` 快速执行 CPU 范围然后移动\
    \ I/O。之后，`T_CPU` 将再次长时间占据处理器，等等。\n\n### 循环规划\n最容易理解且最公平的算法是循环规划（轮询调度）。在在中世纪，“round-robin”一词源于请愿书上的圆圈签名，以便人们不知道是谁先签名的（这个名字表明对于这种算法所有流都是平等的）。每个流分配的允许运行的时间段被称为时间片（或时间量子）。当线程在时间量子耗尽后仍在运行时，它会被中断，处理器切换到执行另一个线程的指令。当它阻塞或完成执行直到时间量子耗尽时，处理器也被传递给另一个线程。整个系统的时间量子是相同的。这种算法非常容易实现。为此，就绪线程的顺序应该是循环列表。当流耗尽了它的量子时，它被移动到列表末尾，新流被提供。量子耗尽的检查由系统中断处理程序执行。影响算法运行的唯一特征是量子的长度。应该记住切换上下文的时间与响应许多交互式查询之间的平衡。任务量子过短会导致许多上下文切换，并将大量的\
    \ CPU 时间花在非有用工作上而在这些切换上。另一方面，过长的量子虽然节省了 CPU 时间，但也降低了交互式查询的响应时间，因为如果用户同时按下按键，线程将在就绪列表中。在无限长度的情况下，循环调度退化为\
    \ FIFO 算法（所有线程在阻塞或量子耗尽前执行）。\n\n实践中，建议将量子的长度设置为 10-100 ms。注意，循环调度可能会“偏向”受处理器限制的流，这些流会完全利用它们的量子，直到量子耗尽。\n\
    \n### 优先级规划\n循环调度假设所有流同样重要。否则，应使用优先级规划。基本思想是：给每个流一个优先级，最高优先流从就绪线程中执行。优先级可以是静态或动态的。实现方法之一是多队列，在这些情况下，具有不同优先级的多个组被组织。执行线程的决策如下：\n\
    - 如果有高优先级流，使用更简单的算法（如循环调度）而忽略其他流。\n- 如果没有高优先级流，低优先级流被执行。这种情况会导致低优先级进程等待很长时间。解决饥饿问题有不同的方法：例如，调度器可以通过老化（aging）逐渐降低优先级，当它低于下一个优先级时，相反地增加优先级。\n\
    \n### 基于性能特征的规划\n一类重要的优先级调度算法，其中对流的选择决策是基于对性能特征的知识或评估。首先，应该注意，“执行剩余时间”的算法是最短剩余时间优先（SRTF）。与\
    \ SRTF 的不同在于，当新线程的执行剩余时间比当前线程更短时，它会抢占处理器。SRTF 在理论上对于平均响应时间来说是最优的。遗憾的是，短期规划是不可能的，因为它无法准确预测流的行为性质。对于长期规划，通常使用调度器。可以使用以下公式来计算：\n\
    ```\ntn+1 = a*tn + (1-a)*t\n```\n其中 `0 < a < 1`，`t_{n+1}` 是间隔长度的估计；`tn` 是上一个间隔长度的估计。最常用的值是\
    \ `a = 0.5`，这种情况下足够在估计值和实际值之间计算平均值。SRTF 的区别在于，当就绪线程的执行时间结束时，当前线程会被中断，新线程进入其位置。\n\
    \n### 多级反馈队列\n带有反馈的多队列（多级反馈队列）调度算法可以减少任何其他算法。在组织结构上，该算法类似于多队列：有多个具有不同优先级的队列，只有当上层队列为空时运行低优先级队列。它们之间的区别是：\n\
    - 流允许跨级。\n- 流根据优先级和使用间隔长度移动到低优先级队列（通常量子减半）。\n不同的队列对应不同的长度——优先级越高，量子越短。如果流耗尽了它的量子，它移动到低优先级队列的末尾（带有量子）。结果是，短间隔流（如\
    \ I/O）留在高优先级，而长间隔流自动向下移动。\n\n### 彩票规划\n彩票规划（抽票调度）的想法是：\n- 流接收大量的彩票，每张票都有权在 T 时间内使用处理器。调度器在\
    \ T 时间内随机选择一张彩票。赢得的流获得控制。彩票规划允许：\n- 模拟循环调度，给每个流相同数量的票。\n- 根据优先级分配票数。\n- 模拟 SRTF\
    \ - 短流比长流票多（如果流至少收到一张票，就不会饥饿）。\n- 确保处理时间在线程之间分配——给每个线程与其所需的比例相对应的票数（例如，如果有三个流，需要流\
    \ A 占据 50%，B 和 C 各占 25%，可以给流 A 两张票，B 和 C 各一张）。\n- 改变优先级，在运行时添加票数。\n\n尽管这些任务大部分可以通过彩票规划解决，但只是近似，实践上相当满意。系统运行越久，结果越接近理论值（根据大数定律）。事实上，彩票规划利用了所有规划很大程度上是启发式的事实，因为无法准确预测系统中流的行为性质。\n\
    \n## Linux 中的规划实现\n考虑 Linux 调度的两种方案：传统的（包括 2.4 及之前的内核）和 2.6 内核中引入的新的。Linux 内核在规划时不区分进程和流，因此确定地我们将继续讨论进程规划。系统中的所有进程可以分为三组：实时\
    \ FIFO 调度、实时循环调度和普通进程。\n\n### 内核进程的实时调度\n对于实时进程，只需说：\n- 它们在规划时的优先级总是高于普通进程。\n\
    - FIFO 调度进程一直执行，直到它自己放弃处理器（例如由于挂起或终止）或被更高优先级的实时进程取代。\n- 循环调度进程也一样，只是它在时间量子耗尽后会被进一步抢占。\n\
    \n### 传统调度算法\n考虑一种调度普通进程的算法。算法的核心是将 CPU 时间分配给各个周期（epochs）。在周期内，每个进程都有一个时间量子，其长度在周期开始时计算。大多数情况下，不同进程具有不同长度的量子。当进程耗尽量子时，它会被抢占，在当前周期内不再执行。将管理交给另一个进程。然而，如果进程由于\
    \ I/O 或同步原因而暂停，其量子不被视为耗尽，调度器可以在当前周期内将其耗尽。当所有就绪进程都耗尽量子时，周期结束。此时，调度算法重新计算所有进程的量子并开始新周期。量子在周期开始时设置，其值可以通过\
    \ `nice()` 和 `setpriority()` 系统调用动态修改。子进程继承祖先的量子。有两种优先级类型：\n- 固定优先级：实时进程在进程创建时设置。\n\
    - 动态优先级：普通进程取决于量子的剩余时间。描述最重要的字段是：\n- Policy - 决定进程属于哪一类（普通、实时、FIFO 等）。\n- Nice\
    \ - 指定具体的值。\n- Counter - 包含进程在量子耗尽前剩余的定时器中断次数。\n\n### 调度器调用\n\n```c\nif (condVar\
    \ > someVal) {console.log(\"xxx\")}\n```\n"
