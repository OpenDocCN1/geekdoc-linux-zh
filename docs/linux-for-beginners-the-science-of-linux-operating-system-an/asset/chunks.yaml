  trans: "\n\n以下是该问题的伪代码解决方案：\n\n```cpp\nsemaphore_t lock = 1; // 用于临界区\nsemaphore_t\
    \ empty_items = n; // 0 表示缓冲区满，从头为空\nsemaphore_t full_items = 0; // 如果为 0 表示缓冲区为空\n\
    // 生产者\nvoid producer() {\n    item_t item = produce(); // 创建 'item' 对象 \n   \
    \ down(empty_items); // 有空间存放 'item' 吗？\n    down(lock); // 进入临界区\n    append_to_buffer(item);\
    \ // 将 'item' 对象添加到缓冲区中 \n    up(lock); // 退出临界区\n    up(full_items); // 通知消费者有一个新对象\n\
    }\n \n// 消费者\nvoid consumer() {\n    item_t item;\n    down(full_items); // 缓冲区不空？\n\
    \    down(lock); // 进入临界区\n    item = receive_from_buffer(); // 从缓冲区中取出 'item'\
    \ 对象 \n    up(lock); // 退出临界区\n    up(empty_items); // 通知生产者位置\n    consume(item);\
    \ // 消费对象\n}\n```\n\n### 互斥锁（Mutexes）\n互斥锁的概念与之前定义的阻塞概念（第 5.2 节节）基本一致。被称为 Mutex\
    \ 的同步原语防止一段代码在多个流中同时执行。事实上，互斥锁是操作系统级阻塞的实现。互斥锁正如其名称所示，消除了互斥。它的主要任务是在该代码已由一个线程执行时，阻塞所有尝试访问该代码的线程。互斥锁处于两种状态：空闲（free）和忙碌（busy）。初始状态为“空闲”，并有两个可能的原子操作。\n\
    \n*   **获取互斥锁** (`mutex_lock(mutex)`)：如果互斥锁是空闲的，它变为忙碌状态，流继续执行（进入临界区）；如果互斥锁是忙碌的，流进入等待状态（称为“等待互斥锁”或“锁定互斥锁”），执行切换到另一个流。获取互斥锁的流被称为互斥锁的所有者：`mutex_lock(mutex_t\
    \ mutex)`\n```cpp\nif (mutex.state == free) {\n    mutex.state = locked;\n   \
    \ mutex.owner = this_thread;\n} else {\n    sleep();\n}\n```\n*   **释放互斥锁** (`mutex_unlock(mutex)`)：互斥锁变为空闲；如果有多个流在等待它，将选择其中一个，让它开始执行，占用互斥锁并进入临界区。在大多数实现中，流的选择是随机的。只有所有者可以释放互斥锁。以下是该操作的伪代码：\n\
    ```cpp\nmutex_unlock(mutex_t mutex) {\n    if (mutex.owner != this_thread)\n \
    \       return error;\n    mutex.state = free;\n    if (waiting_threads())\n \
    \       wakeup(some_thread);\n}\n```\n\n某些实现提供了第三种操作尝试获取互斥锁（`mutex_trylock`）：如果互斥锁是空闲的，行为与\
    \ `mutex_lock` 类似；如果忙碌，则立即返回错误并继续执行。\n\n这里是使用互斥锁实现临界区的简单示例。\n```cpp\nmutex_t mutex;\n\
    mutex_lock(mutex);\n// 临界区\nmutex_unlock(mutex);\n```\n\n二进制信号量与互斥锁的主要区别在于，`mutex`\
    \ 的释放只能由其所有者完成，而信号量可以由访问它的任何流改变。\n\n### 进程间\n到为止，我们考虑的是单个进程内流的交互。这种交互的主要特征是它们之间数据交换的技术实现上非常简单——一个进程流使用同一个地址空间，因此可以自由地访问共享的变体数据，就像是它们自己的一样。由于数据交换的实现没有技术困难，在这种情况下需要解决的主要问题是流的同步。\n\
    \n另一方面，每个线程都在进程的地址空间内执行，因此组织不同进程流之间交互的任务通常是一个问题。这个问题本身就是进程间通信（`interprocess communication`\
    \ 或 `IPC`）。对于不同进程的流，同步问题同样适用，但在大多数情况下，它们不是基于共享数据的概念（因为进程缺少默认数据）。此外，还增加了受保护地址空间之间交换安全的挑战。解决这一问题的方法定义了不同类型的进程间交互。\n\
    \n### 进程间交互的类型\n进程间处理通过三种基本方法实现：消息传递、内存分配和显示内存。另一种 `IPC` 的方法是考虑之前讨论的信号技术。\n\n\
    ### 扩展内存技术（映射内存）\n在许多操作系统中，显示内存是其他类型进程间交互和系统决策的基础系统机制。当然，与文件系统接口结合使用的显示内存，在这种情况下指的是在内存中显示的文件（`memory-mapped\
    \ files`）。这项技术是为了确保一个特殊的系统调用（通常是 `mmap()`）将进程地址空间的一部分唯一地包含该文件。之后，对此类内存的写入操作会导致显示文件的内容发生变化，这立即对所有访问该文件的应用程序可用。其他应用程序也可以在它们的地址空间中显示相同的文件，并通过它相互通信。\n\
    \n### 结论\n*   一个交互进程的流可以访问托管在该进程地址空间中的共享数据。任何流都能随地更改这些数据，并由于结果取决于流的顺序而产生竞争状态。\n\
    *   流同步机制用于确保正确访问共享数据；主要任务是确保在特定时间只有一个流流可以访问此类数据，从而实现互斥。阻塞被用于组织互斥。\n*   可以使用各种同步原语来解决同步问题。最简单的原语包括信号量、互斥锁、条件变量、读写锁和屏障（barriers）。\n\
    *   一种高级机制是监控器（monitor）概念，它结合了互斥锁和条件变量，并设置了它们交互的一些规则来保护共享数据。使用监控器是流同步最一致的方法。\n\
    \n### 第 6 章：内存管理\n不同类型的内存被组织成层级结构。在这种层次结构的底层，有更便宜、更慢且容量更大的内存，随着层次结构向上移动，内存变得越来越贵、越来越快（容量也变小）。最便宜、最慢的设备是硬盘。它也被称为辅助存储。更快、更贵的内存存储在计算机的内存芯片上——称为主内存。更快的存储设施具有不同的处理器，且至少这些缓存是有限的。管理内存是一项相当困难的任务。所需的内存特性往往无法确定，而且为了不干扰用户工作，必须对不同类型的内存进行协调。因此，当前无法完全放入内存，未使用的代码可以存储在硬盘上。\n\
    \n### 虚拟内存基础\n我们首先考虑引入虚拟内存的假设。在这种情况下，进程被加载到物理内存的连续部分。通过分析内存分配的特征，可能会出现以下问题：\n\
    *   如果物理内存比进程所需的内存要少，该怎么办？\n*   当进程执行写入操作时，如果地址错误，该怎么办？\n*   如果进程需要更多内存来执行，该怎么办？\n\
    *   当进程接收到物理地址信息时，应该如何转换地址？\n*   如果分配给进程的内存不足，该怎么办？\n\n直接将进程加载到物理内存无法提供这些问题的答案，显然需要内存翻译工具来允许进程使用不同的地址。在理解这些地址之前，让我们简要介绍一下编译和布局。\n\
    \n### 虚拟内存的概念\n虚拟内存是一种在地址空间和物理内存之间进行转换的技术。虚拟内存确保内存是受保护的，且进程不需要是连续的。虚拟内存占据物理内存的某个空闲部分，通过分页（paging）技术进行地址转换。\n\
    \n### 虚拟内存的实现问题\n由于分页在每次访问内存时都需要进行地址转换，由于内存是物理内存的空闲块被使用，而分段（segmentation）的实现会产生问题。\n\
    \n（注：原文中原文的实现 -> ，分段时，段段的的实现会产生问题。）\n\n### 逻辑地址与物理地址\n虚拟内存最重要的概念是逻辑和物理地址。\n* \
    \  逻辑地址：由运行的程序生成的地址。一组逻辑地址称为逻辑地址空间。\n*   物理地址：内存芯片操作的地址。现代计算机通过内存管理单元（MMU）负责将逻辑地址转换为物理地址。所有可用物理地址的总和称为物理地址空间。\n\
    \n### 基边界寄存方法\n在实现虚拟内存时，需要保护内存、移动进程内存并在多个进程间共享内存。满足这些要求的简单方法之一是基边界寄存方法。对于每个进程，CPU\
    \ 寄存器存储两个值：基地址（base）和边界（bounds）。每次对逻辑地址的访问都通过加上基地址转换为物理地址。如果收到的物理地址不在（base + bounds）范围内，则认为地址错误并产生错误。这是内存中进程动态移动的最简单示例。在本节中讨论的其他方法是不同的选项。例如，每个进程都有自己的基和边界寄存器。这种方法的优点包括简单性、硬件要求低（只有两个寄存器）和高效率。然而，由于许多缺点，今天实际上没有使用：地址空间映射到一个；不同进程无法共享内存。\n\
    \n### 内存分段\n内存分段允许你将逻辑地址空间描述为一组变长块，称为段（segments）。每个段通常包含一个用途的数据，例如，一个可以有一个栈，另一个是程序代码等。每个段都有名称和长度。逻辑地址由段号和段内的偏移量组成。编译器通常为不同的应用程序创建单独的段（代码段、数据段、栈段）。当程序加载到内存时，它创建一个进程描述符表，表的每个元素对应一个段，并由基地址、限制值和保护属性组成。如果偏移量大于限制（或进程访问权限与段权限不匹配），硬件产生错误。当一切正常时，纯分段的基地址和偏移量的和会导致主内存中的一个物理地址。如果一个段被上传到硬盘，尝试访问会导致它从硬盘加载。\n\
    \n内存分段的益处：\n*   有机会为进程组织多个独立的段并使用它们。\n*   单个段可以被不同进程共享，它们的段描述表必须包含描述该段的相同元素。\n\
    *   地址空间不需要是连续的。\n\n内存分段的缺点：\n*   对每个段的要求会导致外部碎片。\n*   不会产生内部碎片，因为段是变长的。\n\n###\
    \ IA32 架构中的分段实现\n在 IA32 架构中，分段通过段选择器（selector）形成。段选择器存储在特殊寄存器中，并在切换上下文时由硬件自动加载。段选择器使用索引在页表中。线性地址被分为三个字段：\n\
    *   目录：定义目录项，指向目标页表。\n*   表：页表元素，指向目标帧内存。\n*   偏移量：帧内的偏移量，与帧地址结合形成物理地址。\n\n目录和表字段的大小为\
    \ 10 位，页表包含 1024 个元素，偏移量字段的大小为 12 位，页和帧的大小为 4KB。一个低级表访问 4MB 内存（1MB 的帧），整个页目录拥有\
    \ 4GB。所有层级的页表元素具有相同的结构。这里是以下元素字段：\n*   存在标志（presence）：如果页在物理内存中，则为 1；此标志表示页不在物理内存中，操作系统可以使用其他元素字段用于其目的。\n\
    *   高 20 位设置帧起始地址为 4KB 的倍数（可以指定 1MB 的不同地址）。\n*   访问标志（Accessed）：每次引用设备支持分页到相应的帧时置为\
    \ 1。\n*   更改标志（Changes）：在每次事务中记录相应的帧时置为 1。\n*   读写标志（read-write）：访问页或页表的权限（读写或只读）。\n\
    *   特权标志（User/Supervisor）：指定访问页所需的处理器模式。如果该标志为 0，则页只能从特权模式访问，如果单元从用户模式可用。\n\n\
    存在、访问和更改标志可用于操作系统组织虚拟内存。\n\n### 分页组织\n分页（paging）是另一种实现虚拟内存的内存技术。其核心思想是将内存块组织成固定长度的块，这些块被称为页（pages）。这是操作系统实现虚拟内存最常见的方法。\n\
    \n### 分页组织的基本原理\n在分页组织的情况下，逻辑地址被分为两个部分：页号和偏移量。页号用作索引进入页表，页表包含关于物理内存帧的描述。当进程开始运行时，OS\
    \ 计算页的数量并将页加载到物理内存。如果进程不使用某些内存块，所有低级页的内容可以临时存储在硬盘上。\n\n### 分页组织与分段的比较分析\n分页组织和分段有共同点。主要的区别在于：所有页具有固定长度，而段具有变长度。其他基础是：物理内存不需要连续性，可以将块卸载到磁盘，需要支持地址转换。\n\
    \n分页组织优于分段的优点：\n*   主要由所有页具有相同长度决定。\n*   内存分配的实现变得简单。\n*   对于进程，所有页都可以维护一个空闲页列表，并在必要时从列表中选择第一个页。\n\
    *   与硬盘的通信也变得简单。\n\n分页组织并非没有缺点：\n*   首先，由于页大小总是固定的，这种方法会导致内部碎片，如果需要分配特定长度的内存块，其大小将是页大小的倍数。\n\
    *   每个专用块的未使用内存平均约为半页（类似于段）。\n*   可以通过减少块的数量来减少这种碎片。\n*   页表应该比段表大。例如，分配 100KB\
    \ 的连续范围需要一个段元素来描述。\n\n### 多级页表\n为了处理大容量的逻辑地址空间，单个页表会非常大。例如，在 IA32 架构中，标准页大小为 4KB（地址内部需要\
    \ 12 位），索引剩余 20 位，对应一个包含一百万元素的页表。为了避免这种页表，提出了分级页表。这项技术有两个主要优点：\n第一，页表尺寸更小，因此搜索速度更快。\n\
    第二，并不是所有页表都需要在内存中。例如，如果进程不使用某些内存块，所有低级页的内容可以临时存储在硬盘上。\n\n### IA32 架构中的页表实现\nIA32\
    \ 架构采用两层分页组织，从 Intel 8036 开始。顶层表称为目录，每个任务有一个单独的目录页，物理地址存储在特殊控制寄存中，并在切换上下文时由硬件自动加载。底层称为页表。线性地址分为三个字段：\n\
    *   目录：定义目录项，指示目标页表。\n*   表：页表元素，指示目标帧内存。\n*   偏移量：帧内的偏移量，与帧地址结合形成物理地址。\n\n目录和表字段的大小为\
    \ 10 位，页表包含 1024 个元素，偏移量字段的大小为 12 位，页和帧的大小为 4KB。一个低级表访问 4MB 内存（1MB 的帧），整个页目录拥有\
    \ 4GB。所有层级的页表元素具有相同的结构。这里是以下元素字段：\n*   存在标志（presence）：如果页在物理内存中，则为 1；此标志表示页不在物理内存中，操作系统可以使用其他元素字段用于其目的。\n\
    *   高 20 位设置帧起始地址为 4KB 的倍数（可以指定 1MB 的不同地址）。\n*   访问标志（Accessed）：每次引用设备支持分页到相应的帧时置为\
    \ 1。\n*   更改标志（Changes）：在每次事务中记录相应的帧时置为 1。\n*   读写标志（read-write）：访问页或页表的权限（读写或只读）。\n\
    *   特权标志（User/Supervisor）：指定访问页所需的处理器模式。如果该标志为 0，则页只能从特权模式访问，如果单元从用户模式可用。\n\n\
    存在、访问和更改标志可用于操作系统组织虚拟内存。\n\n"
