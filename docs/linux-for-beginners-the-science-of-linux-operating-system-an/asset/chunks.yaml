    \ in Computer Science. `Semaphores` are the oldest synchronization primitives\
    \ of those used in practice. `Semaphore` - a shared net ample integer counter\
    \ asked for which initial value and determined following atomic operations:\n\n\
    - **Down Semaphore** (`down`): If the value of the semaphore is greater than zero,\
    \ it is reduced by one, if the value is zero, this stream goes to standby until\
    \ it is greater than zero (everyone who is \"waiting at the semaphore\" or \"\
    Blocked at the semaphore\"). This operation is also called `expectations` - wait.\
    \ Here is her pseudocode:\n```c\nvoid down (semaphore_t sem){\n    if (sem> 0)\n\
    \        sem--;\n    else \n        sleep ();\n}\n```\n- **Increase semaphore**\
    \ (`up`): increase semaphore values by one; when there are streams waiting at\
    \ the semaphore, one of them goes out of the waiting and performs its own operation.\
    \ If more than one thread is expected on a semaphore, its `up` value remains null\
    \ due to the `up` operation but one of the threads continues to execute (in most\
    \ implementations, the choice of this thread will be random). This operation is\
    \ also called `post- signaling`. Here is her dog in the doc:\n```c\nvoid up (semaphore_t\
    \ sem){\n    sem ++;\n    if (waiting_threads ())\n        wakeup (some_thread);\n\
    }\n```\n\nIn fact, a semaphore value determines the number of threads that can\
    \ pass through that semaphore without blocking it. When a semaphore is set to\
    \ zero initial value, it will block all threads until some thread \"opens\" it\
    \ by performing the `up` operation. Operations `up` and `down` can be performed\
    \ by any flows that have access to the semaphore.\n\n# Features Of Use Of Semaphores\n\
    \n`Semaphores` can be used to solution `Liabilities` synchronize two different\
    \ tasks.\n\n1. **Mutual Exclusion**: With their help, it is possible to organize\
    \ mutual exclusion (to protect the code of critical sections from execution by\
    \ more than one thread). It is most convenient to use a `binary semaphore`, which\
    \ can take two values: 0 and 1. Here is an example of implementing a critical\
    \ section using a binary semaphore:\n```c\nsemaphore _ t sem = 1; // at the beginning\
    \ the semaphore is opend\ndown (sem);// critical section\nup (here);\n```\n\n\
    2. **Condition Expectation**: With their help, you can organize the expectation\
    \ of the fulfillment of some condition. Suppose that one needs to organize the\
    \ wait for one thread to complete another (analog of the join operation). In this\
    \ case, a semaphore with an initial value of 0 (closed) can be used. The stream\
    \ that is waiting must perform a `down` operation for this semaphore and in order\
    \ to signal the completion of the stream, its completion function requires `up`\
    \ to perform the same semaphore. Here is the pseudocode (`this_thread` stands\
    \ for current thread):\n```c\nVoid thread_init (){\n    this _ thread. sem = 0;\
    \ // At the beginning of the stream execution the semaphore is exposed\n}\nvoid\
    \ thread _ exit (){\n    up ( this _ thread . sem ); // wake up the pending stream,\
    \ if any\n}\nvoid thread_join (thread_t thread){\n    down (thread.sem); // Waiting\
    \ for thread to finish\n}\n```\n\n# Realization Of The Problem Of Producers-Consumers\
    \ With The Help Of Semaphores\n\nFirst, let's call the synchronization actions\
    \ required to solve this problem.\n\n1. Put the operations of direct buffer change\
    \ (for the manufacturer - placing the object in the buffer, for the consumer -\
    \ removing the object from the buffer) in the critical sections.\n2. Arrange expectations\
    \ according to requirement 2 (manufacturer's expectations in case of full buffer).\
    \ In doing so, the consumer must inform the expectant manufacturers that he has\
    \ taken the object from the buffer (ie the buffer has become incomplete, if complete).\n\
    3. Arrange expectations according to requirement 3 (consumer expectations in case\
    \ of full buffer). In doing so, the manufacturer must inform consumers who expected\
    \ that the matched buffer is non-empty and if it was empty.\n\nNow let's look\
    \ at the synchronization primitives we need. Each synchronization operation requires\
    \ a separate semaphore:\n\n1. **to lock**: To use the critical section, we use\
    \ the binary semaphore, as we did before. Let's call it `to lock`. It will be\
    \ used by both the manufacturer and the consumer, protecting access to the buffer\
    \ from other threads (again, both manufacturers and consumers).\n2. **empty items**:\
    \ In order to organize the manufacturer's expectations in the case of a full buffer,\
    \ we will need a semaphore whose current value is equal to the number of free\
    \ spaces in the buffer. Let's call it `empty_items`. The manufacturer, before\
    \ attempting to add a new object to the buffer, reduces this semaphore to the\
    \ standby state if it is equal to 0. The consumer, after removing the object from\
    \ the buffer, will increase the semaphore by informing the manufacturers (and\
    \ waking up one of them).\n3. **full items**: In order to organize consumer expectations\
    \ in the case of an empty buffer, a semaphore whose current value is equal to\
    \ the number of seats in the buffer will be required. Let's call it `full_items`.\
    \ The consumer before attempting to pick up an object from the buffer reduces\
    \ this semaphore, going into a state of waiting.\n"
