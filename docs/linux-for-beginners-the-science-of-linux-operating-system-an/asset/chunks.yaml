  trans: "\n\n- 出于安全考虑，密码必须满足某些条件，例如：\n    - 至少包含六字符\n    - 包含至少一个数字或特殊字符以及两个字母\n\
    \    - 与登录名不同\n\n首次访问系统时，使用的密码将由系统管理员提供。在 Linux 中，有几种方法可以结束工作会话，取决于我们处于图形模式还是文本模式。\n\
    \n### 文本模式\n1. 按下 `<ctrl> d` 键\n2. 输入退出命令。\n\n### 图形模式\n`X Window` 的输出取决于正在运行的窗口管理器，将在稍后进行解释。\n\
    \n# Linux 文件系统结构\n\n## 文件：类型\nLinux 文件系统的基础包括文件，文件无非是操作系统用于将信息存储在物理设备（如硬盘、软磁盘、CD-ROM\
    \ 或 DVD）上的结构。自然地，文件可以包含你所喜的任何类型信息，从 `PNG` 或 `JPEG` 格式的图像到 `HTML` 格式的文本或网页。文件系统是允许\
    \ Linux 处理其包含的文件的结构。\n\n所有 Linux 文件都有一个名称，该名称必须符合某些规则：\n- 文件名长度介于 1 到 255 个字符之间\n\
    - 你可以使用除斜杠 `/` 之外的任何字符但不建议使用 Linux 中具有特殊意义的字符，如下：`= \\ ^ ~ ' \" \\` ` *; -? []\
    \ ( )! & ~ <>`\n- 要使用带有这些字符或空格的文件，必须在引号内输入文件名。\n- 如果需要，也可以使用数字。\n- 大写字母和小写字母被视为不同的，因此\
    \ `letter.txt` 不同于 `Letter.txt` 或 `letter.Txt`\n\n与 Windows 类似，可以使用特定的“类型”标准来标记不同种类的文件，使用名称末尾的一系列字符指示文件的类型。因此，文本文件、`HTML`、`PNG`\
    \ 或 `JPEG` 图像分别具有扩展名 `.txt`、`.htm`（或 `.html`）、`.png` 和 `.jpg`（或 `.jpeg`）。\n\n\
    尽管如此，Linux 仅区分三种类型的文件：\n- 普通文件是指上述的文件\n- 目录（或文件夹）是以结构化方式分组其他文件的特殊文件\n- 特殊文件是 Linux\
    \ 运行的基础，因为它们代表了连接到计算机的设备，如打印机。这样一来，在该文件中输入信息等同于向打印机发送信息。对于用户来说，这些设备与普通文件具有相同的外观和用法。\n\
    \n## 链接\n链接是一种普通文件类型，为确定文件创建一个新名称。一旦创建了符号链接，它允许以相同的方式访问所链接的文件，就好像我们将其内容复制到另一个文件一样，但优点是它并没有真正被复制。当你想要一组人协作同一个文件时，符号链接特别有用，因为它们允许共享文件但集中进行修改。\n\
    \n作为一个示例，你可以假设存在一个名为 `balance.1999.txt` 的文件，并为其创建一个符号链接 `balance.txt`。对 `balance.txt`\
    \ 的任何访问都会被系统翻译，以便你访问 `balance.1999.txt`。\n\n## 路径\n在任何现代操作系统中，文件结构都是层次化的并依赖于目录。通常情况下，文件系统结构类似于树形结构，每个节点由一个目录或文件夹组成，它包含其他目录或文件。在\
    \ Windows 中，每个磁盘驱动器被识别为一个基本文件夹并作为其他文件夹的根。在 Linux 上，有一个名为 `/` 的根目录，所有文件和目录都挂载其下，这与连接到计算机的设备无关。\n\
    \n文件或目录的路径是访问某个文件时必须遍历的目录序列，并用 `/` 分隔。路径有两种形式：\n- 绝对路径，显示文件的完整路径，`/home/luis/Carta.txt`\n\
    - 相对于某个目录的相对路径，例如，如果我们找不到 `/home` 目录，相对于文件 `Letter.txt` 的相对路径就是 `Luis/Letter.txt`。\n\
    \n为了使问题更加复杂，所有目录都包含两个特殊目录：\n\n"
- fmt: "\nThe current directory, represented by the point `.` . The parent directory\
    \ represented by a colon `..` Being in the directory `/home` you can access `Carta.txt`\
    \ with `/home/luis/Carta.txt` (absolute path) or `/luis/Carta.txt` (relative path).\
    \ In `Luis` as `./Carta.txt` or simply `Letter.txt`.\n\nThe Linux file system\
    \ follows all UNIX conventions, which means it has a structure determined, compatible\
    \ and homogeneous with the rest of UNIX systems. Unlike in Windows or MS-DOS the\
    \ file system on any Unix system is not directly linked to the hardware structure,\
    \ that is, it does not depend on whether a given computer has 1, 2 or 7 hard drives\
    \ to create the `c:\\`, `d:\\` or `m:\\` drives.\n\nEvery UNIX file system has\
    \ a unique root or root origin represented by `/`. Under this directory you will\
    \ find all the files that the operating system can access. These files are organized\
    \ in different directories whose mission and name are standard for all Unix systems.\n\
    \n* `/`: Root of the file system\n* `/dev`: Contains system files representing\
    \ the devices that are physically installed in the computer\n* `/etc`: This directory\
    \ is reserved for system configuration files. In this directory, no binary files\
    \ (programs) should appear. Under this, two other subdirectories should appear:\n\
    \    * `/etc/X11`: X Window configuration files\n    * `/etc/skel`: Basic configuration\
    \ files that are copied to the user's directory when one is created new\n* `/lib`:\
    \ Contains the libraries needed to run programs that reside in `/bin` (not libraries\
    \ of user programs)\n* `/proc`: Contains special files that either receive or\
    \ send information to the system kernel (It recommends not modifying the contents\
    \ of this directory and its files)\n* `/sbin`: Contains programs that are only\
    \ accessible to the superuser or root\n* `/usr`: This is one of the most important\
    \ directories of the system since it contains the usage programs common to all\
    \ users. Its structure is usually similar to the following:\n    * `/usr/X11R6`:\
    \ Contains the programs to run X Window\n    * `/usr/bin`: General purpose programs,\
    \ which includes the `C` / `C++` compiler\n    * `/usr/doc`: General system documentation\n\
    \    * `/usr/etc`: General configuration files\n    * `/usr/include`: `C` / `C++`\
    \ header files (`.h`)\n    * `/usr/info`: GNU information files\n    * `/usr/lib`:\
    \ General libraries of the programs\n    * `/usr/man`: Manuals accessible with\
    \ the `man` command\n    * `/usr/sbin`: System administration programs\n    *\
    \ `/usr/src`: Source code of programs\n\nIn addition to the previous ones, there\
    \ are other directories that are usually located in the `/usr` directory, such\
    \ as the folders of the programs that are installed in the system.\n* `/var`:\
    \ This directory contains temporary information about the programs (which does\
    \ not imply that you can delete its content, in fact, it should not be done)\n\
    \n# Chapter 1: Basic Operating System Concepts\n\n## The Concept Of The Operating\
    \ System, Its Purpose, And Function\n\n### The Concept of An Operating System\n\
    The main idea and start of our modern day operating systems was the need to create\
    \ including them in the use of computer systems (By computer cybernetic system,\
    \ we mean a set of hardware and software). The computer cybernetic system initially\
    \ developed for liability solutions and practical problems of users. Because it\
    \ was difficult to do this with hardware alone, applications were created. These\
    \ programs required general operations of hardware management, distribution of\
    \ hardware from resources, and the like. These operations are grouped under a\
    \ separate layer of software, which is known as the operating system.\n\nFurther,\
    \ the capabilities of operating systems went far beyond the basic set of operations\
    \ required by applications, but the intermediate position of such systems between\
    \ applications and hardware remained unchanged.\n\n### Purpose Of The Operating\
    \ System\nOperating systems provide us with a score of cybernetic system, and\
    \ secondly, efficiency and reliability of its work. The first function is characteristic\
    \ of the OS as an extended machine, the second - the OS as a distributor of hardware\
    \ resources.\n\n### Operating System As An Extended Machine\nUsing the operating\
    \ system, the application programmer (and through his programs and the user) should\
    \ have the impression that they are working with an advanced machine. The hardware\
    \ is not well adapted for direct use in applications. For example, if you consider\
    \ working with `I / O` devices at the command level of the respective controllers,\
    \ you can see that the set of such commands is limited, and for many devices -\
    \ primitive. The operating system hides such a hardware interface but instead\
    \ offers the programmer an application programming interface that uses higher-level\
    \ concepts (called abstractions).\n\nFor example, when working with a disk, a\
    \ typical abstraction is a file. it is easier to work with files than directly\
    \ with a disk controller (no need to consider moving the drive heads, starting\
    \ and stopping the motor, etc.), as a result, the programmer can focus on the\
    \ essence of his application. The operating system is responsible for interacting\
    \ with the disk controller. Abstraction highlighting makes it easy for OS and\
    \ application code to change when migrating to new hardware. For example, if you\
    \ install a new type of disk device on your computer (provided that it is supported\
    \ by the OS), all its features will be taken into account at the OS level, and\
    \ applications will continue to use the files as before. This characteristic of\
    \ the system is called hardware independence. OS can be said to provide a hardware-independent\
    \ environment for executing applications.\n\n### Operating System As A Resource\
    \ Allocator\nThe operating system must allocate resources efficiently. It acts\
    \ as the manager of these resources and provides them to applications on demand.\
    \ There are two main types of resource allocation. In the case of the spatial\
    \ distribution of resource access will be for multiple customers simultaneously,\
    \ and each one of them can use the resources (shared memory). In the case of temporal\
    \ distribution, the system queues and, according to it, allows them to use the\
    \ entire resource for a limited time (so processor is distributed in single-processor\
    \ systems). When allocating resources, the OS resolves possible conflicts, prevents\
    \ unauthorized access of programs to those resources on which they have no rights,\
    \ ensures the efficient operation of the computer.\n\n### Classification Of Modern\
    \ Operating Systems\nConsider the classification of modern operating systems,\
    \ depending on their scope.\n\n* **Large computers (mainframes)**: The main characteristic...\
    \ for which they are designed is the performance of `I / O`: large computers provide\
    \ a large number of peripherals (disks, printers, etc.). Such computer cybernetic\
    \ system is used for the reliable processing of large amounts of data. OS should\
    \ effectively support this process (in batch mode or time allocation). An example\
    \ of OS of this class would be `IBM OS/390`.\n* **Server systems**: The following\
    \ category includes server operating systems. The main feature of such operating\
    \ systems is the ability to serve a large number of user requests for shared resources.\
    \ Network support plays an important role for them. There are specialized server\
    \ OSes that exclude elements that are not related to the performance of their\
    \ functions (for example, support for user). Universal servers (UNIX or Windows\
    \ XP) now more commonly used to implement servers.\n* **Personal OS**: The most\
    \ massive category is personal OS. Some operating systems in this category, developed\
    \ with the expectation of the user (Windows 95/98/Me) are simplified versions\
    \ of the universal OS. Particular attention in personal OS is given to the support\
    \ of the user interface and multimedia technologies.\n* **Real-time OS**: There\
    \ is also real-time OS. In such a system, each operation must be guaranteed to\
    \ be performed within a specified time. Real-time OS can control the flight of\
    \ process. There are specialized real-time OS as `QNX` and `VxWorks`.\n* **Embedded\
    \ OS**: Another category is embedded OS. These include managing applications for\
    \ various microprocessor systems used in military, consumer electronics, smart\
    \ cards, and other devices. Such systems pose special requirements: placing a\
    \ small amount of memory and support for specialized devices. Often, built-in\
    \ OS is developed for specific device; universal systems include `Linux` and `Windows\
    \ CE`.\n\n### Functional Components Of Operating Systems\nAn operating system\
    \ can be considered as a set of components, each of which is responsible for specific\
    \ function of the system. Consider the most important features of modern OS and\
    \ the components that implement them. The way the system is built from components\
    \ and their relationship is determined by the architecture of the operating system.\
    \ Each operating system is going to be different in the kind of work it can handle,\
    \ and its organizational structure so how to put it all together.\n\n### Process\
    \ And Flow Management\nAs we mentioned, one of the most important functions of\
    \ OS is to execute applications. Code and application data is stored in the computer\
    \ cybernetic system on disk in a special manner. After the user decides to run\
    \ a file, file system creates the basic unit of process that executes it. The\
    \ operating system allocates resources between processes. These resources include\
    \ CPU time, memory, devices, disk space. Allocation of processor between processes\
    \ is necessary because the processor executes instructions one by one (ie, at\
    \ a particular time, only one process can execute). To achieve this effect, the\
    \ OS provides the processor with each process for a short time, after which it\
    \ switches the processor to another process; the execution of processes resume\
    \ from the place where they were interrupted. In multiprocessor system, processes\
    \ can run in parallel on different processors. Modern operating systems in addition\
    \ to processes can support multitasking, which provides the presence of several\
    \ instructions (threads), which run in parallel like most processes in the OS.\
    \ Unlike processes, threads do not provide resource protection (for example, they\
    \ share the address space of their process).\n\n### Memory Management\nWhile executing\
    \ the code, the processor takes instructions and data from the computer's (main)\
    \ memory. This memory is displayed as an array of bytes, each of which has an\
    \ address. As mentioned, main memory is a type of resource between processes.\
    \ OS is responsible for the allocation of memory. The address space is protected\
    \ during the process and released only after the execution completed. The amount\
    \ of memory available to the process can vary in the course of distribution of\
    \ memory. OS must be capable of programs individually or in the aggregate amount\
    \ available for main memory. To this end, virtual memory technology must be realized.\
    \ This technology allows placing in the main memory only those instructions and\
    \ processes that are needed at the current time, while the contents of the rest\
    \ of the address space are stored on disk.\n\n### I / O Management\nThe operating\
    \ system is responsible for managing I / O devices connected to the computer's\
    \ memory. Support for such devices in the OS is usually performed at two levels.\
    \ The lower level includes device drivers - software modules that control devices\
    \ of a particular type, taking into account all their features. The second level\
    \ includes a versatile I / O interface convenient for use in applications. The\
    \ OS should implement a common I / O driver interface through which they interact\
    \ with other system components. This interface makes it easy to add drivers for\
    \ new devices. Modern OSes provide a large selection of ready-made drivers for\
    \ specific peripherals. The more devices the OS supports, the more chance it has\
    \ of practical use.\n\n### File Management And File Systems\nFor OS users and\
    \ programmers, disk space is provided as a set of files organized into a file\
    \ system. A file is a set of files on a file system that can be accessed by name.\
    \ The term \"file system\" can be used for two concepts: the principle of organizing\
    \ data in the form of files and a specific set of data (usually the corresponding\
    \ part of the disk) organized in accordance with this principle. As part of the\
    \ OS, it can be implemented simultaneously supported and `inter-faced` (Note:\
    \ text says ICA) for several file systems. File systems are considered at the\
    \ logical and physical levels.\n\n## Network Support\n\n### Network systems\n\
    \ Network systems\nModern operating systems are adapted to work on the network,\
    \ they are called network operating systems. Networking support enables the OS\
    \ to:\n* To make local resources (disk space, printers, etc.) publicly available\
    \ over the network, ie to function as a server\n* Refer to other computer resources\
    \ through a network that is functioning as a client\nImplementing the functionality\
    \ of server and client based on `vehicles` responsible for the transmission of\
    \ data between computers according to the rules specified network protocols.\n\
    \n### Distributed systems\nNetwork OSes do not hide the presence of a network\
    \ from the user. Network support in them does not determine the structure of the\
    \ system and enriches it with additional capabilities. There are also distributed\
    \ OS that allow pooling the resources of several computers working in parallel.\
    \ It appears to the user as one computer. Distributed and multiprocessor systems\
    \ are two major categories of OS that use multiple processors.\n\n### Conclusion\n\
    One of the trends of modern operating systems is that in privileged mode, a small\
    \ proportion of kernel functions, which are a microkernel, are implemented. Other\
    \ OS functions are performed by user-mode processes (server processes). Servers\
    \ are responsible for supporting the file system for dealing with process memory.\
    \ The microkernel communicates between system components and performs a basic\
    \ resource allocation. To execute a system call, the process (client process)\
    \ accesses the microkernel. The microkernel sends a request to the server, the\
    \ server performs the work and sends the response back. And the micronucleus forwards\
    \ it to the client. Customers can not only be single users and other operating\
    \ units.\n\nThe advantages of a micro-core approach are:\n* The small size of\
    \ microkernel which simplifies its development and debugging\n* High system reliability\
    \ due to the fact that the servers run in user mode and do not have direct access\
    \ to the hardware\n* Greater flexibility and expandability of the system (unnecessary\
    \ components do not take up space in memory, expanding the functionality of the\
    \ system is reduced to adding to it new server)\n* The possibility of adapting\
    \ to network conditions (way to exchange data between the server and related network\
    \ or they are on the same computer)\n\nThe main disadvantage of the micro-core\
    \ approach is the decrease in performance. Instead of the two-time switchings\
    \ of the processor mode in case of a system call, four occur (two - during the\
    \ exchange between the client and the microkernel, two – during the exchange between\
    \ the server and the micronucleus). A system call is slower than a call to user-implemented\
    \ function because the processor switches modes twice. For some OSes, some of\
    \ the functionality is implemented in user mode, so don't need to use system calls\
    \ to access it.\n\n# Chapter 2: Operating System Architecture\n\nAn operating\
    \ system can be considered as a set of components, each of which is responsible\
    \ for certain functions. The set of such components and the order of their interaction\
    \ with other and with the external environment is determined by the architecture\
    \ of the operating system. Consider basic concepts of system architecture, approaches\
    \ to them, features of OS interaction with the external environment. Let's consider\
    \ the implementation of architecture on the example of `Linux`.\n\n## Basic Concepts\
    \ Of System Architecture\n\n### System Kernel - Privileged Mode And User Mode\n\
    The basic components of the OS which are responsible for its most important functions\
    \ are usually in memory constantly and are executed in privileged mode, called\
    \ the kernel of the operating system. Current approaches to design architecture\
    \ define the functionality of the kernel. The most important functions of the\
    \ OS, of course include interrupt processing, memory control, input-output control.\
    \ The core feature of the kernel is that it runs in privileged mode. To ensure\
    \ efficient resource management the operating system should have certain privileges\
    \ regarding applications. They must support at least two modes - `privileged mode`\
    \ (kernel mode) and `user mode` (user mode). Different CPU modes are used when\
    \ interacting with the kernel and applications. When you need to perform an action\
    \ implemented in the kernel, the application makes a system call. The kernel intercepts\
    \ it, switches the processor to privileged mode, performs an action, switches\
    \ the processor back to user mode and returns the result of the application. A\
    \ system call is slower than a call to user-implemented function because the processor\
    \ switches modes twice. For some OSes, some of the functionality is implemented\
    \ in user mode, so don't need to use system calls to access it.\n\n### Implementation\
    \ Of Operating System Architecture\nConsider several approaches to implementing\
    \ operating system architecture. In real OS, they usually use some combination\
    \ of these approaches.\n\nMonolithic Systems\nThe OSes in which all the basic\
    \ functions are concentrated in the kernel are called monolithic systems. In the\
    \ implementation of a monolithic kernel, the OS becomes more productive (the processor\
    \ does not switch between modes during interaction between its components), but\
    \ less reliable (all its code is executed in privileged mode, and the error in\
    \ each of the components is critical). A monolithic kernel does not mean that\
    \ all of its components must reside in the memory. Modern operating systems allow\
    \ placing code fragments (kernel modules) dynamically in the kernel address space.\
    \ The implementation of kernel modules also makes it possible to achieve extensibility\
    \ (to add new functionality, it is enough to develop and load the appropriate\
    \ module in memory).\n\nMultilevel Systems\nComponents form a hierarchy of levels\
    \ (layers), each of which relies on functions of the previous level. The lowest\
    \ level interacts directly with the hardware, the highest level implements system\
    \ calls. In traditional multilevel operating systems, transferring control from\
    \ the top to the bottom is implemented as a system call. The top-level must have\
    \ the right to execute this call and these rights are verified with the support\
    \ of the hardware. An example of such a system is `Multics` OS, developed in the\
    \ '60s. The practical application of this approach is limited today because of\
    \ poor performance. Levels can also be isolated in a monolithic kernel; in this\
    \ case they are programmatically supported and cause system implementation to\
    \ be disrupted. In the monolithic system, a kernel determines the levels:\n* Abstraction\
    \ means from equipment that one interacts with the hardware directly, releasing\
    \ other components of the system from such interaction\n* Core kernels that are\
    \ responsible for the most basic, simplest kernel actions, such as writing a block\
    \ of data to disk. By these means, upper-level instructions are executed with\
    \ the management of resources\n* Resource management tools (or resource managers)\
    \ that implement basic OS functions (process management, memory, input-output,\
    \ etc.). At this level, the most important resource management decisions are made\
    \ that are made using the core kernel\n* A system call interface that is used\
    \ to communicate with system and application software\n\nMicronucleus Systems\n\
    One of the trends of modern operating systems is that in privileged mode, a small\
    \ proportion of kernel functions, which are a microkernel, are implemented. Other\
    \ OS functions are performed by user-mode processes (server processes). Servers\
    \ are responsible for supporting the file system for dealing with process memory.\
    \ The micronucleus communicates between system components and performs a basic\
    \ resource allocation. To execute a system call, the process (client process)\
    \ accesses the microkernel. The microkernel sends a request to the server, the\
    \ server performs the work and sends the response back. And the micronucleus forwards\
    \ it to the client. Customers can not only be single users and other operating\
    \ units.\n\nThe advantages of a micro-core approach are:\n* The small size of\
    \ microkernel which simplifies its development and debugging\n* High system reliability\
    \ due to the fact that the servers run in user mode and do not have direct access\
    \ to the hardware\n* Greater flexibility and expandability of the system (unnecessary\
    \ components do not take up space in memory, expanding the functionality of the\
    \ system is reduced to adding to it new server)\n* The possibility of adapting\
    \ to network conditions (way to exchange data between the server and related network\
    \ or they are on the same computer)\n\nThe main disadvantage of the micro-core\
    \ approach is the decrease in performance. Instead of the two-time switchings\
    \ of the processor mode in case of a system call, four occur (two - during the\
    \ exchange between the client and the microkernel, two – during the exchange between\
    \ the server and the micronucleus).\n"
