- pgno: 299
  md: 'These connections (entries in the connection tracking table) change rapidly
    on a heavily loaded cluster as client connections come and, so we need a method
    of sending connection tracking records from a primary Director to a backup Director
    as they change. The LVS programmers developed to do this (replicate the connection
    tracking table to the backup Director) using multicast packets. This technique
    was originally implemented inside the kernel (the server sync state daemon does
    not run in upland) the name stack. To turn on the server sync state daemon, as
    it is called, inside the kernel run the following command on the primary Director:


    ```

    /sbin/ipvsadm --state-daemon master

    ```


    Then, on the backup Director, run the command:


    ```

    /sbin/ipvsadm --state-daemon backup

    ```


    The primary and backup Directors must be able to communicate with each using multicast
    packets on multicast address 224.0.0.81 for the master server sync state daemon
    to announce changes to the connection tracking records, and for the backup server
    sync state daemon to hear about these changes and insert them into its idle connection
    tracking table. If out your cluster nodes support multicast, see the output of
    the ifconfig command and look for the word MULTICAST. It should be present for
    each interface that you are using multicast; if not you''ll need to recompile
    your kernel and provide support for multicast (see Chapter 3).23


    > To stop the sync state daemon (either the master or the backup) you can issue
    the command ipvsadm --stop-daemon.


    Once you have issued these commands on the primary and backup Director (you will
    need to add these commands to an init script so they will issue the command each
    it boots—see Chapter 1), your primary Director can crash, and when lirectord rebuilds
    IPVS table on the backup Director all active connections24 to cluster nodes will
    survive the failure of the primary Director.


    > The method described will failover active connections from the primary Director
    to the backup Director, but it does not failback active connections when the primary
    Director has restored to normal operation. For failover and failback active IPVS
    connections you will need (as of this) to apply a patch to the kernel. See the
    LVS HOWTO (http://www.linuxvirtual.org).


    may be able to specify the interface that the server sync state daemon should
    use to send or listen for multicast packets using the ipvsadm command (see the
    ipvsadm man page); reports of this feature indicate a bug that prevents you from
    explicitly specifying the interface when you issue these commands.


    All connections that have not been idle longer than the connection tracking timeout
    period on the backup Director (default is three minutes, as specified in the LVS
    code).'
  merge: -1
