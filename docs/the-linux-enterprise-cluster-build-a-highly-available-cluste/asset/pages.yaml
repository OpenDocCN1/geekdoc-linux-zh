    # COMPLEX MON CONFIGURATION FILES

    AND THE M4 MACRO PROCESSOR


    Complex Mon configuration files can be built using the GNU m4 macro processor.
    The full documentation for the m4 processor is available online at: https://www.gnu.org/software/m4/macro/index.html
    Why use the m4 macro processor to process your Mon configuration files? The m4
    macro processor allows you to create sophisticated configuration files that, among
    other things, variables. You don''t have to retype the same thing multiple times
    through the configuration file [one email alert for all of yours, for example].
    See the usr/lib/mon/etc/example.m4 configuration file that comes the Mon distribution
    for example. When you build a configuration file that relies on the m4 processor,
    you can manually convert it to a normal configuration file that Mon understands
    by passing it through the m4 processor each time you make a change, and you can
    start Mon with the -c option followed by the full path and name of configuration
    file and Mon will pass your configuration file through the m4 macro processor
    for you automatically.


    # Step 6: Test by Running the fping.monitor and mail.alert Scripts Manually


    To simulate what Mon will do, run our alert script manually:


    ```

    #usr/lib/mon/mon.d/fping.monitor clnode1

    ```


    > ¹wd is a code passed to the Time::Perl program to indicate the scale of the
    time period. The Perl period program tests to see if the time falls within the
    time period value you assign using the wd scale. This scale permits 1-7 or so,
    mo, tu, we, th, fr, sa to be used in the period definition. (Sa-Su) means the
    period is Saturday through Sunday, which is as saying all week or anytime. (A
    blank period would mean the same thing.)'
