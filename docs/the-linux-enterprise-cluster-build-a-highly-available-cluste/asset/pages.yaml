- pgno: 281
  md: 'Using this configuration, the heartbeats can pass over the normal Ethernet
    network and a dedicated network or serial connection between the LVS Director
    and the backup LVS Director. Recall from Chapter 6 that heartbeats should be able
    to travel over two physically independent paths between the servers in a high
    availability pair.⁴


    This diagram also shows a Stonith device (as described in Chapter 9) that provides
    true high availability. The backup node has a serial or network connection to
    the Stonith device so that Heartbeat can send power commands to it. The primary
    node has its power cable plugged into the Stonith.⁵


    The dashed gray arrows that originate from the LVS Director and point to each
    cluster node representing packets from the client customers. Because this is,
    the reply packets are sent directly out onto the Ethernet network by each of the
    cluster nodes and directly back to the client customers connected to this Ethernet
    network.


    As processing grows, additional cluster nodes (LVS real servers) can easily be
    added to this configuration,⁶ though two machines outside the cluster will always
    act as a primary and backup Director to balance the incoming workload.


    # Introduction to Lirectord


    To failover the LVS load-balancing resource from the primary Director to the backup
    Director and automatically remove nodes from the cluster, we need to use the Lirectord
    program. This program automatically builds the IPVS table when it starts up and
    then it monitors the health of the cluster nodes and removes them from the IPVS
    table (on the Director) when they fail.


    # How Lirectord Monitors Cluster Nodes (LVS Real Servers)


    The Lirectord daemon monitors the health of real servers by sending requests to
    access cluster resources on the real IP (RIP) of each real server. This is true
    for all LVS cluster types: LVS-DR, LVS-TUN, and LVS-NAT. Normally, one Lirectord
    daemon runs for each VIP address on the Director. When a real server does not
    reply to the Lirectord daemon the Lirectord daemon issues the correct ipsadm command
    to remove it from the IPVS table for the VIP address. (Later, when the real server
    comes back online, Lirectord issues the correct ipsadm command to add the real
    server back into the IPVS table.)


    > ⁴Avoid the temptation to heartbeats only on the real or public network (as a
    mean of service monitoring), especially when using Stonith as described in this
    configuration. See Chapter 9 for more information.


    > ⁵See Chapter 9 for a discussion of the limitations imposed on a high availability
    configuration


    > ⁶Using the System| package described in Chapter 5.'
