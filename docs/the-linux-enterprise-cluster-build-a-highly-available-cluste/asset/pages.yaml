    \ a SCSI disk to boot your system, you may want to avoid some complication and\
    \ compile support for your SCSI directly into the kernel, instead of loading it\
    \ as a module. If you do this on a kernel version prior to version 2.6, you will\
    \ save yourself the trouble of booting the initial RAM disk. However, if you are\
    \ building a modular kernel from 2.4 or an earlier series, you will need to build\
    \ an initial RAM disk so the Linux kernel can boot up for the proper module to\
    \ communicate with your SCSI disk. (See the man page for the mkinitrd utility\
    \ for the easiest way to do it on Red Hat systems. The initial RAM disk, or initrd\
    \ file, must then be referenced in your boot loader configuration file so that\
    \ the system knows how to mount your SCSI device before the modular kernel runs.)\n\
