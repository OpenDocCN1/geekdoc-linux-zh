    # Stateful Failover of the IPVS Table


    As we''ve just seen, when the primary Director crashes and lirectord needs to
    rebuild the IPVS table on the backup Director it can do so because you have placed
    all of the ipvadm configuration rules into an lirectord configuration file. However,
    the active client connections (the connection tracking records) are not re-created
    by lirectord on the backup Director at failover time. All client connections to
    the cluster nodes are lost during a failover using the recipe we have just built.'
