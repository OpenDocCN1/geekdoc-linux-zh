    ```

    # make dep 2>&1 | tee /tmp/dep.log

    # make clean 2>&1 | tee /tmp/clean.log

    # make bImage 2>&1 | tee /tmp/bimage.log

    # make modules 2>&1 | tee /tmp/modules.log

    # make modules_install 2>&1 | tee /tmp/modules_install.log

    ```


    This should help you isolate, at which point you can go to find a solution. The
    comp.os.linux newsgroups (or comp.os.linux.redhat, dedicated to Red Hat Linux).
    Also, see the Linux section at http://marc.linuxgroup.com.


    Before posting a kernel compilation question to one of these newsgroups, read
    the Linux FAQ [http://www.ldp.org], the linux-kernel mailing list [http://www.tux.org/],
    and the linux-kernel HOWTO.


    > ¹The lib/modules subdirectory should be created when building a modular kernel.


    > ²This method should at get the kernel to compile if it doesn''t have the options
