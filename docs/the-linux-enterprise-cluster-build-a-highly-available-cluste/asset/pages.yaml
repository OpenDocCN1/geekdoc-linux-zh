  md: 'or prevent a service from automatically running at a particular runlevel. As
    previously noted, all of the symbolic links for system runlevels point back to
    the real scripts stored in the /etc/rc.d/init.d directory (actually, according
    to the Linux Standards Base³, this directory is the /etc/init.d directory, but
    on Red Hat, these two directories point to the same files⁴)


    If you want a service (called myservice) to run at runlevels 2, 3, and 4, this
    means you must chconfig to create three symbolic links in each of the following
    subdirectories:


    ```

    /etc/rc.d/rc2d

    /etc/rc.d/rc3d

    /etc/rc.d/rc4d

    ```


    These symbolic links should start with the letter 5 to indicate you to start your
    script at each of these runlevels. chconfig should then create symbolic links
    with the letter K (for "kill") in each of the remaining /etc/rc.d/rcrunlevel>.
    directories (for runlevels 0, 1, 5, and 6).


    To tell chconfig what you want to do for your script, you would add the following
    lines to the script file in the /etc/rc.d/init.d directory:


    ```

    # chconfig: 23 99 90

    # description: myscript runs my daemon on runlevel 2, 3, or 4

    ```


    The numbers 99 and 90 in this example are the start and stop priority of this
    script. When a symbolic link is created in one of the runlevel subdirectories,
    it is also a priority number used by the rc script to determine the order it will
    use to launch (or kill) the scripts finds in each of the runlevel subdirectories.
    A lower priority number after the 5 in the symbolic name means the script should
    run before other scripts in the directory. For example, the script to bring up
    networking, /etc/rc.d/rc3.d50network, runs before the script to start the Heartbeat
    program /etc/rc.d/rc3.d54heartbeat.


    The second comment in this example contains a (required) description for this
    script. The chconfig commands to first remove any old symbolic links that then
    add this script (it was saved in the file /etc/rc.d/init.d/myscript) are:


    ```

    chconfig --del myscript

    chconfig --add myscript

    ```


    > ³ See http://www.linuxbase.org/spec for the latest revision to the LSB.

    ⁴ Because /etc/init.d is a symbolic link to /etc/rc.d/init.d on current Red Hat
    distributions.'
