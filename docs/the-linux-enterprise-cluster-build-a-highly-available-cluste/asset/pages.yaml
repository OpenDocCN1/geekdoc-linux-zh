    #rpm -ivh /mnt/cdrom/chapter7/heartbeat-pils-*.rpm¹

    #rpm -ivh /mnt/cdrom/chapter7/heartbeat-stonith-*.rpm

    #rpm -ivh /mnt/cdrom/chapter7/heartbeat-i386.rpm

    ```


    NOTE You do not need the source (src) RPM file for this recipe. The lirectory
    software is also not required in this chapter—it will be discussed in Chapter
    15.


    > ¹The PILS package was introduced with version 0.4.9d of Heartbeat. PILS is Heartbeat''s
    generalized plug-in and interface loading system, and is required for normal Heartbeat
    operation.'
