- pgno: 317
  md: "# Measuring Total I/O Operations\n\nThe second measurement you'll need to make\
    \ before you shop for a NAS solution is the number of I/O operations per second\
    \ that your applications will require at peak processing times. To find this,\
    \ use a Linux machine that is not doing anything else (preferably the hardware\
    \ you will use for cluster nodes) and run the nfsstat -c command. Sample output\
    \ for this command looks like:\n\n```\nClient rpc stats:\ncalls       retrans\
    \     authrefresh\n67813156   38         0\n\nClient nfs v2:\nnull       getattr\
    \    setattr    root       lookup    readlink\n0%         0%        0%       \
    \ 0%       0%       0%\nread       wrcache    write      create     remove   \
    \ rename\n0%         0%        0%        0%       0%       0%\nlink       symlink\
    \    mkdir      readdir    fsstat\n0%         0%        0%        0%       0%\
    \       0%\n```\n\n```\nClient nfs v3:\nnull       getattr    setattr    lookup\
    \     readlink\n0%         129765080 523295  10521226 1 86507757 46448 0%\read\
    \       write      create     symlink    mknod\n0%         23687043  17      \
    \   748925  0%       225      0%\nremove     rename     link       readdir   \
    \ dirplus\n372452     17         3900726 4115      563968 0%\nfsstat    fsinfo\
    \     pathconf   commit\n0%         2%        12997359 2%\n```\n\nAssuming you\
    \ have configured this machine to use NFS version 3 (a sample /etc/fstab entry\
    \ is provided later in this chapter), you can add all of the values listed under\
    \ the Client nfs v3: section of this report and run your sample application using\
    \ the time command I described. When the application finishes running, run again\
    \ and add up the total number of NFS calls that were made. You can then subtract\
    \ the first number from the second number to arrive at the total number of NFS\
    \ operations performed. Divide this number by the total number of elapsed seconds\
    \ your application ran (the first number returned by the time command) to determine\
    \ the average NFS I/O operations per second your application uses. Now multiply\
    \ this number by the total number of operations that will be running your system\
    \ load (order processing deadline for example) to arrive at a very rough estimate\
    \ of the total number I/O operations you'll need on your NAS server. For a more\
    \ accurate picture of the total number of I/O operations per second you require,\
    \ perform the same analysis using a batch job, and add this number to your total\
    \ as well."
  merge: -1
