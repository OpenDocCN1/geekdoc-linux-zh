- pgno: 84
  md: '# WHEN MAKE FAILS


    If the nohout.file ends with an error, or if the bImage file is not created, or
    if the /lib/modules subdirectory does not exist,¹ try copying different versions
    of the .config file into place or use the make mrconfig and make oldconfig commands
    to build a new .config file from scratch.² Then rerun the make commands to compile
    the kernel again to see if the kernel will compile with a different .config file.


    If the nohout.file contains a few lines of output, and you see error messages
    about the .hdone file, try removing this temporary file, and then enter the make
    dep clean bImage modules_install (or earlier) install command. Or, if you cannot
    get a newer kernel to compile, try an older, more stable version from the 2.4
    series.


    You should try turning on SMP for your kernel through the menuconfig command (if
    you are not already using one of the SMP .config files from your source).


    If it more helps, try making the make commands separate: dep, then clean, make
    bImage, and sort, and send the output of each command to the script and a separate
