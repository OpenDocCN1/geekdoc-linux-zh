    # Performing Maintenance: Updating Clients


    If you make changes to the Golden Client, simply enter the getimage command on
    the SystemImage server; then updateclient on the cloned systems (the high-availability
    server pairs or the cluster nodes inside the cluster).


    > NOTE If you need to exclude certain directories from an update, create an entry
    in /etc/systemimage/updateclient.local.exclude.


    # SystemInstaller


    The SystemInstaller project grew out of the Linux Utility for cluster Installation
    (LUI) project and allows you to install a Golden Image directly to a SystemImage
    server using RPM packages. SystemInstaller does not use a Golden Client; instead,
    it uses RPM packages that are stored on the SystemInstaller to build an image
    for a new, or cluster node.¹10


    The SystemInstaller website is currently located at http://system-installer.sourceforge.org.


    10 This is the method used by the OSCAR project, by the way, SystemInstaller runs
