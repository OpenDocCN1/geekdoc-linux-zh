    # Virtual IP Addresses on LVS-NAT Real Servers


    If you need to offer clients access to different services on separate VIP addresses,
    cluster nodes in LVS-NAT can also use multiple RIP addresses (the client aliases
    or secondary IP addresses) to identify the VIP address the client computer used
    in the original. As you can see in scope of 12-5, the Director can be configured
    to send packets to the cluster nodes (real servers) using multiple RIP addresses.
    In this scenario, client computers will only know the VIPs configured on the Director;
    the Director is responsible for sending the packets into the cluster through the
    proper virtual RIP address (using a load-balancing or scheduling method).


    You might choose this scenario to load balance types of users on different IP
    addresses. For example, accounting and reporting users might use one IP address,
    and customer service and transaction-based users would use another. You may also
    want to use IP-based virtual hosts for your web pages (Appendix F for a detailed
    discussion of Apache virtual hosting).


