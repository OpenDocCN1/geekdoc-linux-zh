- pgno: 41
  md: '# Respawning Services with init


    You can cause the operating system to automatically restart a daemon when it dies
    by placing the name of the executable program in the /etc/initabb file and adding
    the respawn option. init will start the daemon as the system enters the runlevel
    and then watch to make sure the daemon stays running (restarting the daemon, if
    it dies), as long as the system remains at the same runlevel.


    A sample /etc/initabb entry using the respawn option looks like:


    ```

    sn:2345:respawn:/usr/local/scripts/start_smpd > /dev/null

    ```


    This entry tells the init daemon to run the script /usr/local/scripts/start_smpd
    at levels 2, 3, 4, and 5, and to send any output produced to the /dev/null "device"
    (the output is discarded).


    Notice, that we have entered a script file here (/usr/local/scripts/start_smpd)
    and not the actual smnpd executable. How will init know running process to monitor
    if this script simply runs the smnpd daemon and then ends? init will assume the
    program has died each time the script /usr/local/scripts/start_smpd finishes running,
    and it will dutiful run the script.


    > When you see an error message saying the same identifier (referring to the first
    field in the /etc/initabb file) is respawning too fast and init has decided to
    give up trying for a few minutes.


    To make sure the respawn option works correctly, we need to make sure the script
    used to start the smnpd daemon replaces itself with the smnpd daemon. This is
    easy to do with the bash programming statement exec. So the simple script /usr/local/scripts/start_smpd
    looks like this:


    ```

    #!/bin/bash

    exec /usr/sbin/smpd -P /var/run/smpd -1 /dev/null

    ```


    The first line of this script starts the bash shell, and the second line whatever
    process identification, or PID, is associated with this bash shell to be replaced
    with the smnpd daemon (the bash shell disappears when this happens). This makes
    it possible for init to run the script, find what PID it is assigned, and then
    monitor this PID. If it sees the PID away (meaning the smnpd daemon died), it
    will run the script again and monitor the new PID thanks to the respawn entry
    in the /etc/initabb file.²


    # Managing the init Script Symbolic Links with chconfig


    The chconfig program creates and removes the symbolic links used by init''s servant,
    the /etc/rc.d rc script. These symbolic links are the only way to enable


    > Note that the smnpd daemon also supports a -f argument that accomplishes the
    same thing as the exec statement in this bash script. See the smnpd man page for
    more information.'
