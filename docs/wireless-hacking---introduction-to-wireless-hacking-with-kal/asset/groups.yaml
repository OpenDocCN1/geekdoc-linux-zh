  mdcn: '


    现在我们已经运行了几次 `airodump-ng`。然而，这一次我们将传递 `-w` 参数，这会指示 `airodump-ng` 将输出保存到文件中：

    `airodump-ng -c [channel] --bssid [bssid] [file_name] [interface]`

    `airodump-ng -c 2 --bssid 00:17:7C:22:CB:80 -w dump mon0`

    输出将保存在一个名为 `dump_01.cap` 的文件中


    现在我们可以保持此终端运行，它将持续保存数据包。[在之前的教程中，我们只做了两件事：捕获数据包（即这一步）和破解数据包（即我们最后要执行的步骤）。虽然只遵循这两个步骤让我们的工作变得更简单，但也让整个过程耗费更多得多，因为我们只是一个被动的数据包监听器，什么都没做。]


    ## # 加速进程


    ### 伪造认证 (Fake Authentication)


    现在为了加快速度，我们将注入网络。由此我们将获得 ARP 数据包。这些数据包将填充我们的 `airodump-ng` 捕获中的数据列，而数据正是帮助我们获取密码的关键。一旦我们拥有
    10000 个数据包，就可以开始使用 `aircrack-ng` 尝试获取密码。


    现在为了让 AP 注意到注入的数据包，你要么是一个已连接的客户端，要么伪装成一个。你可以将你的 MAC 地址修改为已连接客户端之一，或者使用伪造认证功能。我们将使用后者。（如果你看到类似
    AP 在 x 通道而 mon0 在 y 通道的错误，请查看本章节底部的故障排除）：


    ```

    aireplay-ng -1 0 -e DIGIS -a 00:17:7C:22:CB:80 mon0

    ```


    ## # ARP 请求模式 (ARP request mode)


    ARP 数据包是获取大量 IV 或数据的最佳途径。没有 IV 就无法破解网络。输入以下代码让 `aireplay-ng` 监听 AP 的 ARP 数据包，一旦发现一个立即注入。这将非常快地产生大量数据。这是真正的加速步骤。


    ```

    aireplay-ng -3 -b [BSSID] mon0

    ```

    最终代码看起来像这样：

    aireplay-ng -3 -b 00:17:7C:22:CB:80 mon0

    ```


    现在你必须等待一段时间以获取 ARP 请求。一旦获取到，终端就会会“爆炸”。数据包将开始飞速填充。现在，网络中存在一个活跃的用户是绝对必要的。


    一段时间后，我有了足够破解任何网络的数据包


    ## # **破解网络**


    破解网络就像在控制台输入以下命令一样：`aircrack-ng filename-01.cap`


    在我们案例中，命令将是：


    ## aircrack-ng dump-01.cap


    ```

    root@office:~# aircrack-ng dump-01.cap

    ```


    按下回车后，你将看到网络列表，并会提示你选择其中一个进行破解。在我的案例中只有一个网络，所以我无法获取那个界面或截图。密码在不到一秒的时间就被破解了。


    ![](img/bf9c247bf1435c4e9031e4517bb02053_121_0.png)


    最后你终于获得了想要破解的网络的密码。


    '
