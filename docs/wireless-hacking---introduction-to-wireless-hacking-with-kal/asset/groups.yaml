- md: "\n# Wireless Hacking\nIntroduction to Wireless Hacking with Kali Linux\n\n\
    Giulio D'Agostino\n\n# Wireless Hacking\n\nIntroduction to Wireless Hacking with\
    \ Kali Linux\n\nGiulio D’Agostino @Julyo78\n\n# Wireless Hacking\n\nPre-requisites\n\
    \nNONE\n\nPost-reading\n\nYou will know:\n\n## Hidden networks offer-\n- What\
    \ are the different flavors of wireless networks you'll encounter and how difficult\
    \ it is to hack each of them.\n- What are hidden networks, and whether they offer\
    \ a real challenge to a hacker.\n- You'll have a rough idea how each of the various\
    \ 'flavors' of wireless networks is actually hacked.\n- (The last point would\
    \ be covered in details in the next chapter)\n\n## Wireless Security Levels\n\n\
    Below is a simple list of points I use to explain various possible security implementations\
    \ that a wireless network may have.\n\nSuppose you are the owner of a club. There\
    \ can be many possible scenarios as far as entry to the club is concerned:\n\n\
    - Open networks- They don't require passwords to connect to the wireless router\
    \ (access point). \n  1. Open entry and unrestricted usage - Anyone can walk in.\
    \ They have unrestricted access to the dance floor, free beer, etc.\n  2. This\
    \ is open network. This is only used in public places (restaurants, etc.) which\
    \ offer Internet access to its users (WiFi hotspots). It's fairly uncommon to\
    \ find such networks.\n\n## Wireless hacking usually refers to cracking the router's\
    \ password.\n\n- 3. Open entry but restricted usage. Anyone can walk in, but have\
    \ to pay for drinks. For the router's security purposes, this is also an open\
    \ network. However, connecting to the wireless router (entering the club) doesn't\
    \ guarantee you unlimited access to the internet. There is another layer of authentication.\
    \ These are seen in public places (airports, restaurants, fast food, shopping\
    \ malls) where they let you connect to the wireless network without any password,\
    \ and after that you have an additional layer between you and the internet. This\
    \ layer restricts your ability to access the internet (either by bandwidth or\
    \ by time). This layer can be used to charge you for the amount of data you use.\n\
    \nThe point to discussion above is that wireless hacking usually refers to cracking\
    \ the router's password. The additional layer which might be present between you\
    \ and the internet after you login is something you'll have to deal with separately,\
    \ and is not covered under wireless hacking. So, from wifi hacking perspective,\
    \ both the networks above are the same, \"open\", and do not require any hacking.\n\
    \n## Stupidly Guarded Entry (WEP)\n\nISPs may require users to login to the accounts\
    \ to access the internet.\n\n### 1. Password at door and unrestricted access.\n\
    \nFor a person who has Kali Linux installed on his machine, hacking of a WEP wireless\
    \ network might be a matter of minutes. \n\nThe member of the club pay a certain\
    \ amount every month, and get access to free drinks. They have to say the password\
    \ at the shady looking entrance to the club. Unfortunately, it's quite easy for\
    \ anyone to overhear the password and get in. This is WEP protected network. For\
    \ a person who has Kali Linux installed on his machine, hacking this kind of wireless\
    \ network is a matter of minutes. These are easy targets. However, nowadays it's\
    \ fairly uncommon to find WEP protected networks, because of the ease with which\
    \ they can be hacked into. WPA and WPA-2 are more common.\n\n### 2. Password at\
    \ door enter restricted access.\n\nOnly members can enter, but they still have\
    \ to pay for their drinks. This is the case when the network has password and\
    \ an additional layer to get access to the internet. This is common in three cases:\n\
    \n- Colleges often allocate student's IDs and Passwords using which students can\
    \ access Internet facilities offered by the institute\n- 1 ISP requires login\
    \ - Many ISP's users to login to their account to access the internet. Often logging\
    \ provides an interface which lets the users see their bandwidth usage, details\
    \ of their network plan, etc.\n- 2 Colleges/ Schools/Offices - Many institutes\
    \ provide users accounts which they use to access the institutes' network.\n\n\
    Bruteforce attacks may take forever (literally) depending on the length of the\
    \ password.\n\nAgain, from the wireless hacking perspective, both the networks\
    \ above are \"WEP protected\", and are rather simple to hack into.\n\n## Well\
    \ Guarded Entry\n\nAs far as the bifurcation into or not another layer of authentication\
    \ is present once you have the network password is concerned, WEP and WPA cases\
    \ are the same. The only difference is that wireless routers have WPA instead\
    \ of WEP. However, there's another subcategory that we will discuss:\n\n### 1.\
    \ Finger and retinal scan for entry - The entry to this club is secure for most\
    \ purposes. Theoretically, if you're willing to do what it takes, getting past\
    \ this level of security takes a lot of time and even then depends on sheer luck.\
    \ This is WPA network. The only way to crack this network is with dictionary or\
    \ brute attacks. Bruteforce attacks may take forever (literally) depending on\
    \ the length of the password, and dictionary attacks too will take days/weeks\
    \ depending on size, and still may fail (if the password is not in dictionary).\
    \ WPS has a vulnerability which allows a hacker to get password in hours.\n\n\
    ### 2. Fingerprint and retinal scan for entry, and a card which can quickly swipe\
    \ to avoid standing in queue since the aforementioned created an alternate path\
    \ for entry. While this saves time for the legitimate users, the card can be stolen.\
    \ It's not as easy as overhearing the password (WEP), or walking in (open). This\
    \ is WPS enabled. Just like WEP, WPS is now weak point and new routers have either\
    \ disabled or added some measures (like rate limiting) which make it really hard\
    \ to.\n\n## Bonus: Hidden entry\n\nAny of the above have secret entry. Sounds\
    \ cool, right? This is somewhat similar to what we call \"Security Through Obscurity\"\
    . How do you get in if you don't know where the club's entrance is? Well, while\
    \ you don't know where the entrance is, you have two options:\n\n- 1. Passive\
    \ method - You go to the roof of a nearby building, take your binoculars, and\
    \ try to find out how people enter. In wireless terms, you wait till a client\
    \ connects to the network. This may take a lot of time, but it's relatively safer\
    \ from forensic viewpoint (by not doing anything, just watching patiently, you\
    \ ensure that you don't leave any clues which may catch you). Hidden networks\
    \ don't really offer much protection to a network, and a WEP protected hidden\
    \ network means that instead of 10 mins it will take 15 mins to get the password.\n\
    \n- 2. Active method - You cut off the electric/water supply to the building,\
    \ or maybe trigger the fire alarm. One way or the other, force the members to\
    \ get out of the club. Once they find out everything is fine they'll swarm back.\
    \ You will know where the gate is. In wireless terms, you can de-authenticate\
    \ the clients (you'll be doing this, whether you're hacking a WEP network, or\
    \ getting a WPA handshake [again, more on this]). Of course this method results\
    \ in leaving behind some traces, at least you don't have to wait for hours.\n\n\
    The analogue of hidden entry are hidden networks. As long as the network has clients,\
    \ it's quite easy to find the name of the network (SSID) to be precise, setting\
    \ the network to hidden basically stops the access point from revealing it. However,\
    \ when a client connects to the network, beacon frames (data packets) with SSID\
    \ (in clear-text, i.e. unencrypted) are transmitted, which you can capture and\
    \ the SSID of the network. So, hidden networks don't really offer much protection\
    \ to a network, and a WEP protected hidden network means that instead of 10 mins\
    \ it will take 15 mins to get the password. For a WPA network, making the SSID\
    \ hidden doesn't really do a lot since WPA networks are practically uncrackable\
    \ and a person who has the time and processing power to get WPA encryption won't\
    \ be stopped by the hidden SSID.\n\n## Summary\n\nThere can be additional authentication\
    \ steps (logins) or other barriers between you and internet after you get access\
    \ to the router. However, this is an entirely separate problem and not too relevant\
    \ to the discussion of wireless hacking. Still it's something you must be aware\
    \ of:\n\n## Wireless hotspots or open networks don't have any encryption.\n\n\
    - Wireless hotspots or open networks don't have any encryption. They can be accessed\
    \ by anyone. Also, the data transmitted by you is not encrypted and can be read\
    \ by anyone in the vicinity. Anything which you send to the destination server\
    \ in plain-text (say, to google), will be transmitted from your machine to the\
    \ wireless router in plain-text. Anyone in the vicinity can easily read it using\
    \ Wireshark or any other tool similar. Of course, sensitive data is rarely in\
    \ plain-text, so don't sit around wireless hotspots hoping to get someone's FB\
    \ login credentials. However, lack of encryption in open networks should be considered\
    \ seriously. As far as wireless hacking is concerned, not a lot to do here (other\
    \ than sniffing at unencrypted data in the air).\n\n- WEP - This is where most\
    \ of the stuff happens. Countless vulnerabilities, countless attacks, countless\
    \ research papers listing the issues, countless tools to get the passwords. It\
    \ doesn't take too much effort to learn how to hack these. If you are familiar\
    \ with linux, then it takes no efforts at all. Just some terminal commands, and\
    \ you're done (with wif you don't even have to both with that).\n\n- WPA - Don't\
    \ want to miss this guy. Theoretically there's a way to get in. Practically it\
    \ will take forever. Dictionary attacks and brute are the methods to get it. Will\
    \ cover all this in the advanced version of this guide. PS: When I say WPA, I\
    \ refer to both WPA and WPA-2. For the\n"
  mdcn: "\n\n# 无线攻击\n使用 Kali Linux 进行无线攻击入门\n\nGiulio D'Agostino\n\n# 无线攻击\n\n使用 Kali\
    \ Linux 进行无线攻击入门\n\nGiulio D’Agostino @Julyo78\n\n# 无线攻击\n\n# 先决条件\n\n无\n\n# 阅读后收获\n\
    \n你将了解：\n\n## 隐藏网络提供-\n- 你会遇到哪些不同类型的无线网络，以及破解每种网络的难度有多大。\n- 什么是隐藏网络，它们是否真的对黑客构成了挑战。\n\
    - 你将大致了解各种“类型”的无线网络实际上是如何被破解的。\n- （最后一点将在下一章中详细介绍）\n\n## 无线安全级别\n\n下面是我用来解释无线网络可能具备的各种安全实现方案的简单点列表。\n\
    \n假设你是一家俱乐部的经理。关于进入俱乐部，有许多可能的情况：\n\n- 开放网络 - 它们不需要密码即可连接到无线路由器（接入点）。\n  1. 开放进入且无限制使用\
    \ - 任何人都可以进来。他们可以无限制地进入舞池、免费啤酒等。\n  2. 这是开放网络。它仅用于公共场所（餐厅等），为用户提供互联网访问（WiFi 热点）。发现此类网络并不多见。\n\
    \n## 无线攻击通常指的是破解路由器的密码。\n\n- 3. 开放进入但限制使用。任何人都可以进来，但必须为饮料付费。从路由器的安全角度来看，这也是一个开放网络。然而，连接到无线路由器（进入俱乐部）并不能保证你可以无限制访问互联网。还有另一层身份验证。这些常见于公共场所（机场、餐厅、快餐店、购物中心），它们允许你在不输入任何密码的情况下连接到无线网络，在那之后你和互联网之间还有一层额外的层。这一层限制了你访问互联网的能力（通过通过带宽或时间）。这一层可以根据你使用的数据量向你收费。\n\
    \n上述讨论的重点是，无线攻击通常指的是破解路由器的密码。在你登录后，你和互联网之间可能存在的额外层是你需要单独处理的，不属于无线攻击的范畴。因此，从 WiFi\
    \ 攻击的角度来看，上述两种网络都是相同的，都是“开放”的，且不需要任何破解。\n\n## 愚蠢的防护入口 (WEP)\n\nISP（互联网服务提供商）可能要求用户登录账户才能访问互联网。\n\
    \n### 1. 门口密码且无限制访问。\n\n对于在机器上安装了 Kali Linux 的人来说，破解 WEP 无线网络可能只需要几分钟。\n\n俱乐部成员每月支付固定金额，并获得免费饮料的权限。他们必须在俱乐部看起来可疑的入口处说密码。不幸的是，任何人都可以偷听到密码并进入。这就是受\
    \ WEP保护的网络。对于在机器上安装了 Kali Linux 的人来说，破解这种无线网络只需要几分钟。这些都是容易的目标。然而，由于极易被破解，现在发现受\
    \ WEP 保护的网络已不多见。WPA 和 WPA-2 更常见。\n\n### 2. 门口密码进入受限制访问。\n\n只有成员可以进入，但他们仍然需要为饮料付费。这种情况发生在网络有密码且访问互联网需要额外层级时。这常见于三种情况：\n\
    \n- 大学通常会分配学生 ID 和密码，学生可以通过这些信息访问学院提供的互联网设施\n- 1 某些 ISP 要求登录 - 许多 ISP 用户需要登录其账户才能访问互联网。登录通常会提供一个界面，让用户查看自己的带宽使用情况、网络计划详情等。\n\
    - 2 大学/学校/办公室 - 许多机构为用户提供账户，用户用这些账户访问网络。\n\n暴力破解可能需要永远的时间（字面意思），取决于密码的长度。再次，从无线攻击的角度来看，上述网络都是“受\
    \ WEP 保护的”，且相当容易破解。\n\n## 良好的防护入口\n\n无论进入是否需要另一层身份验证，就无线网络密码而言，WEP 和 WPA 的情况是相同的。唯一的区别是无线路由器使用的是\
    \ WPA 而非 WEP。然而，还有另一个子类别：\n\n### 1. 对于大多数目的，进入该俱乐部是安全的。理论上，如果你愿意尝试，绕过这种安全级别需要大量时间，甚至取决于运气。这是\
    \ WPA 网络。破解此网络的唯一方法是字典攻击。暴力破解可能需要永远的时间（字面意思），取决于密码的长度，字典攻击也需要几天或几周，并且可能失败（如果密码不在字典中）。\n\
    \n### 2. 指纹和扫描进入 - 创建了一种可以快速进入的替代路径。虽然这为合法用户节省了时间，但账户可以被盗取。这不像偷听密码（WEP）或进入（开放）。这是\
    \ WPS 开启的情况。就像 WEP 一样，WPS 是一个弱点，现在的路由器要么禁用了它，要么增加了一些措施（如速率限制）使其非常困难。\n\n## 奖励：隐藏入口\n\
    \n上述任何一种都有秘密入口。听起来很酷对吧？这类似于我们说的“通过隐藏来实现安全”。如果你不知道俱乐部的入口在哪里，如何进入？在你不知道入口时，有两种选择：\n\
    \n- 1. 被动方法 - 你去附近的建筑楼顶，拿着望远镜尝试寻找进入的方法。在无线术语中，你等待客户端连接网络。这可能花费大量时间，但从取证角度来看相对安全（通过观察，确保不留下任何线索，可能会被发现）。隐藏网络并没有网络提供太多保护，受\
    \ WEP 保护的隐藏网络意味着不需要 15 分钟就能获取密码。\n\n- 2. 主动方法 - 你切断建筑的供电/供水，或者触发火报警。无论如何，强制成员离开俱乐部。一旦他们发现一切正常，就会回来。你会知道入口在哪里。在无线术语中，你可以取消认证（无论你是破解\
    \ WEP 网络还是获取 WPA 握手[此处有更多]）。当然，这种方法会留下痕迹，至少你不需要等待几个小时。\n\n隐藏入口的对应物是隐藏网络。只要网络有客户端，很容易找到网络名称（SSID）。准确地说，将网络设置为隐藏基本上阻止了接入点公开它。然而，当客户端连接到网络时，带有\
    \ SSID（明文，即未加密）的信标帧（数据包）会传输，你可以捕获网络的 SSID。所以，隐藏网络并没有网络提供太多保护，受 WEP 保护的隐藏网络意味着不需要\
    \ 15 分钟就能获取密码。对于 WPA 网络，隐藏 SSID 并没有意义，因为 WPA 网络实际上是不可破解的，拥有时间和处理能力获取 WPA加密的人不会被隐藏\
    \ SSID 阻止。\n\n## 总结\n\n在访问路由器后，你和互联网之间可能存在额外的验证步骤（登录）或其他障碍。然而，这是一个完全独立的问题，与无线攻击的讨论没有太大关系。但仍然是你必须注意的：\n\
    \n## 无线热点或开放网络没有任何加密。\n\n- 无线热点或开放网络没有任何加密。任何人都可以访问。此外，你传输的数据没有加密，周围的任何人都可以读取。你发送到目标服务器的任何明文（例如发送到\
    \ Google）都将以明文从你的机器传输到无线路由器。周围的任何人都可以使用 Wireshark 或任何类似工具轻松读取它。当然，敏感数据很少是明文的，所以不要坐在无线热点旁等某人的\
    \ FB 登录凭据。然而，开放网络缺乏加密的问题应该认真考虑。从无线攻击而言，这里没什么可做的（除了嗅探空气中未加密的数据之外）。\n\n- WEP - 这是大部分问题发生的地方。无数的漏洞、无数的攻击、无数列出问题的研究论文、无数获取密码的工具。学习如何破解这些内容不需要花费太多精力。如果你熟悉\
    \ Linux，那么完全不需要费吹力。只需一些终端命令，你就搞定了（对于 WiFi，你甚至不需要同时进行这些）。\n\n- WPA - 不想错过这个家伙。理论上有一种进入的方法。实际上，它需要永远的时间。字典攻击和暴力破解是获取它的方法。我们将在指南的高级版本中涵盖所有这些内容。注：当我说\
    \ WPA 时，指的是 WPA 和 WPA-2。对于...\n\n"
