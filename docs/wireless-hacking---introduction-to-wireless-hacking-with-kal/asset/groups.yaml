    hacked.


    You will know:


    +   - Know even more about different flavors of wireless networks.

    - How to go about hacking any given wireless network.

    - Common tools and attacks that are used in wireless hacking.

    - WEP, WPA and WPA-2


    WEP is the flawed ship in the above discussion. The aim of Wireless Alliance was
    to write an algorithm to make wireless network (WLAN) as secure as wired networks
    (LAN). This is why the protocol was called Wired Equivalent Privacy (privacy equivalent
    to the one expected in a traditional wired network). Unfortunately, while in the
    theory behind WEP bulletproof, the actual implementation was very flawed. The
    main problems were static keys and weak IVs. For a while attempts were made to
    fix the problems, but nothing worked well enough(WEP2, WEPplus, etc. made but
    all failed).


    WPA was a new WLAN standard which was compatible with devices using WEP encryption.
    It fixed pretty all the flaws in WEP encryption, but the limitation of having
    to work with old hardware meant that some remnants of the WEPs would still continue
    to haunt WPA. Overall, WPA was quite secure. In the above story, this is the remodeled
    ship.

    WPA-2 is the latest and most robust security algorithm for wireless networks.
    It wasn''t backwards compatible with many devices, but these days all the new
    devices support WPA-2. This is the invincible ship, the new model with a stronger
    alloy.


    +   - Very few tools which carry out the attacks against WPA networks properly
    (the sense of ambiguous proof-of-concept scripts means that you have to do everything
    from scratch, which most people can''t).


    +   - All these attacks work only under certain conditions (key renewal period
    must be large, QoS must be enabled, etc.).


    Because of these reasons, despite WPA being a little less secure than WPA-2, most
    of the time, a hacker has to use brute-force/dictionary attack and other methods
    that he would use against WPA-2, practically making WPA and WPA-2 the same thing
    from its perspective.


    PS: There''s more to the WPA/WPA-2 story than what I''ve captured here. Actually
    WPA or WPA-2 are ambiguous descriptions, and the actual intricacy (PSK, CCMP,
    TKIP, X/EAP, AES w.r.t. cipher used and authentication used) would require further
    diving into personal and enterprise versions of WPA as well as WPA-2.


