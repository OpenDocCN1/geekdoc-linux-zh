    # Fluxion


    Wifite is cool and all, but doesn''t do much against the invincible WPA-2 networks.
    Using a combination of evil-twin and man in the middle sort of attacks, fluxion
    tries to fool a client into giving you the key to the WPA-2 protected access point.


    # 5


    Hacking WPA/WPA2 without dictionary/bruteforce : Fluxion


    Fluxion is based on another script called *linset.*. I did once think about using
    something like a man in the middle attack/evil twin attack to get WPA password
    during a penetration test instead of going the bruteforce/dictionary route. However,
    once I saw the thread about this cool script, I decided to give it a try. So in
    this chapter I''ll show you how I used Fluxion, and how you can too.


    Disclaimer : Use tool only on networks you own. Don''t do anything illegal.


    Contents


    - • Checking if tool is pre-installed, getting it via github if it isn''t.

    - • Running the script, installing dependencies if required.

    - • Quick overview of how to use Fluxion.

    - • Detailed walk-through and demonstration with text explanation and screenshots

    - • Video demonstration (not identical to the written demo, but almost the same)

    - • Troubleshooting section


    ![](img/bf9c247bf1435c4e9031e4517bb02053_57_0.png)


    The first thing I did was make sure that Kali doesn''t already have this tool.
    Maybe if you are reading this chapter a long time after it was written, then you
    might have the tool preinstalled in Kali. In any case, try this out:


    I, personally tried to check if linset or fluxion came pre-installed in Kali (though
    I didn''t expect them to be there).


    # Getting the script


    Getting the script is just a matter of cloning the github repository. Just use
    the git command tool to do it.


    ```

    git clone https://github.com/deltaxflux/fluxion

    ```


    If you have any problems with this step, then you can just navigate to the repository
    and manually download the stuff.


    # Running the script


    Just navigate to the fluxion directory or the directory containing the scripts
    in case you downloaded them manually. If you are following the terminal commands
    I''m using, then it''s just a simple change directory command for you:


    ```

    cd fluxion

    Now, run the script.

    sudo ./fluxion

    ```


    There are 4 dependencies that need to be installed.


    # Dependencies


    If you have any unmet dependencies, then run the installer script.

    sudo ./Installer.sh


