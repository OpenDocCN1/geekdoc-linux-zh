  - '[PAGE 75]


    # Hack WPA/WPA2 WPS'
  - '[PAGE 76]


    When it was known that a WEP network could be hacked by any kid with a laptop
    and a network connection (using easy peasy tutorials like those on our blog),
    the security guys did succeed in making a much more robust security measure WPA/WPA2.'
  - '[PAGE 77]


    Now hacking WPA/WPA2 is a very tedious job in most cases. A dictionary attack
    may take days, and still might not succeed. Also, good dictionaries are huge.


    An exhaustive bruteforce including all the alphabets (uppercase lowercase) and
    numbers, may take years, depending on password length. Rainbow tables are known
    to speed things up, completing a part of the guessing job beforehand, and the
    output rainbow table that needs to be downloaded from the net is disastrously
    large (can be 100s of GBs sometimes). And finally the security forks were at peace.
    But it was not yet, as the new WPA technology was not at all easy for the users
    to configure. With this in mind, a new security measure was introduced to compliment
    WPA. Wifi Protected Setup (WPS). Now basically it was meant to make WPA even tougher
    to crack, and much easier to configure (push a button on router and device connects).
    However, it had a hole, which is now well known, and tools like reaver can exploit
    it in a single line statement. It still might take hours, but it is much better
    than the previous scenario in which months of brute-forcing would yield no result:'
  - '[PAGE 78]


    Here’s what wikipedia says about WPS


    Created by the Wi-Fi Alliance and introduced in 2006, the goal of the protocol
    is to allow home users who know little of wireless security and may be intimidated
    by the available security options to set up Wi-Fi Protected Access, as well as
    making it easy to add new devices to an'
  - '[PAGE 79]


    existing network without entering long passes. Prior to the standard, several
    competing solutions were developed by different vendors to address the same need.
    A security flaw was revealed in December 2011 that affects wireless routers with
    the WPS feature, which most recent models have enabled by. The flaw allows a remote
    attacker to recover the WPS PIN in a few hours with a brute-force attack, and
    with the WPS PIN, the network''s WPS/WPA2 pre-shared key. Users have been urged
    to turn off the WPS feature, although this may not be possible on some router
    models.


    # Working Of WPS


    Now most of the things are the same as in WPA, there is a new concept of using
    pins for authentication. The client sends 8 digit pins to the access point, which
    verifies it and then allows the client to connect. Now a pin has 8 digits, and
    only contains numbers, so its possible target for bruteforce. Under normal bruteforcing
    of WPS passwords, you have to consider the fact that there may be many, alphabets,
    and sometimes symbols (and than 8 letters). This make the task a billion billion
    times tougher. However, we can use thousands of keys per second, which make it
    a tad easier. Now in WPS, there is a delay because we have to wait for AP response,
    and we may only a few keys per second (practically the best I''ve seen on my PC
    is 1 key per 2 second). Basically, 8 digits and 10 possibilities per digit (0-9)
    make it 10è (interpret ^ as raised to the power of)if we assume one key per second.
    Now that''ll be Years. So, where is this taking us? The answer is, there are are
    flaws in this technology that can be used against it.


    +   * The 8th digit is a checksum of first 7 digits. 10^7 possibilities, i.e.
    one-tenth time. Two months, a way to go to.


    +   * The pin number for verification goes in two halves, so we can independently
    verify the first four and the last four digits. Easy to guess 4 digits correct
    two, to guess 6 digits at once. Basically, the first half would take 10^4 guess
    and the second would take 10^3.


    Now the guesses are 10^4 + 10^3 (10^4 *10^3). Now we need 11,000 guesses:


    | Time | | |

    |---|---||

    | 11000 | = | 3.055556 |

    | Second | Hour |


    So that''ll take 3 hours approximately. And that''s all the correct pin will not
    be the last combination, so you can expect to reach the result earlier. However,
    the assumption is that bruteforcing will take place at a key per second. My personal
    best is a key every 2 seconds, and yours might drop to as low as a key every 10
    seconds.'
- md: "\n# How to carry out the attack\n\nNow it might have been tough to carry this\
    \ attack at some point in history, but now, it's a breeze. If you have all the\
    \ prerequisites, then hacking the network would be as easy as: `rea -i <interface-name>-b\
    \ <BSSID of target>`\n\nAnd if you are already familiar with hacking WEP, then\
    \ just go to your Kali Linux terminal and type the above command (replacing what\
    \ needs to be replaced). Leave your machine as is, come back 10 mins later, check\
    \ the progress (must be 1% or something), and go take a nap. However, if you're\
    \ a newbie, then tag along.\n\n# Kali Linux\n\nFirst off, you need to have Kali\
    \ linux (or backtrack) up and running on your machine. Any other Linux distro\
    \ might work, but you'll need to install Reaver on your own. Now if you don't\
    \ have Kali Linux installed, you might want to go to this page, which will get\
    \ you started hacking with Kali Linux. (Reaver has a known issue: Sometimes it\
    \ doesn't work with Virtual Machines, and you might have to do a live boot using\
    \ live CD or live USB of Kali Linux.\n\n# Information Gathering\n\nNow you need\
    \ to find out the following about your target network\n\n- Does it have WPS enabled?\
    \ If not, then the attack will not work.\n- The BSSID of the network.\n\nNow to\
    \ check whether the network has WPS enabled or not, you can either wash or just\
    \ use the old good airodump-ng. Wash is specifically meant to check whether a\
    \ network has WPS enabled or not, and thereby is much easier to use. Here are\
    \ the steps:\n\n- Set your wireless interface in monitor mode.\n  `airmon-ng start\
    \ wlan0`\n- Use wash (but sometimes unable to detect networks even when they have\
    \ wps enabled). If any network shows up there, it has WPS enabled:\n  `wash -i\
    \ mon0`\n\n```\nFound packet with bad FCS, skipping...\n[!] Found packet with\
    \ bad FCS, skipping...\n[!] Found packet with bad FCS, skipping...\n[!] Found\
    \ packet with bad FCS, skipping...\n[!] Found packet with bad FCS, skipping...\n\
    [!] Found packet with bad FCS, skipping...\n[!] Found packet with bad FCS, skipping...\n\
    [!] Found packet with bad FCS, skipping...\n[!] Found packet with bad FCS, skipping...\n\
    [!] Found packet with bad FCS, skipping...\n```\n\nThis is an error I haven't\
    \ figured out yet. If you see it, you'll have to do some homework, or move on\
    \ on to airodump method. Update: `wash -i mon0 --ignore-fcs` might solve the issue.\n\
    \n- Use airodump-ng, will show all networks around you. It tells which of them\
    \ use WPA. You'll have to assume they have WPS, and then move to next steps:\n\
    \  `airdump-ng mon0`\n\nBSSID of the network: now irrespective of what you used,\
    \ you should have a BSSID column in the result that you get. Copy the BSSID of\
    \ the network you want to hack. That's all the information you need.\n\nSo by\
    \ now you must have something like XX:XX:XX:XX:XX, which is the BSSID of your\
    \ target network. Keep this copy, as you'll need it.\n\nNow finally we are going\
    \ to use Reaver to get the password of the WPA/WPA2 network. Reaver makes hacking\
    \ very easy, and all you need to do is enter `reaver -i mon0 -b XX:XX:XX:XX:XX:XX`\n\
    \nExplanation = i (interface used). Remember creating a monitor interface mon0\
    \ using `airmon-ng start wlan0`. This is what we are using -b specifies the BSSID\
    \ of the network that we found earlier.\n\nThis is all the information Reaver\
    \ needs to get started. However, Reaver comes with many advanced options, and\
    \ some are recommended by me. Most importantly, you should use the -vv option,\
    \ which increases the verbosity of the tool. Basically, it writes everything that's\
    \ going on to the terminal. This helps you see what's happening, track the progress,\
    \ and if needed, do some troubleshooting. So final command should be\n\n```\n\
    reaver -i mon0 -b XX:XX:XX:XX:XX -vv\n```\n\nAfter some hours, you will see something\
    \ like this. The pin in this case was intentionally 12345670, so it was hacked\
    \ in 3 seconds.\n\nWPA PSK : X\n\nHere is an extra section, which might prove\
    \ useful.\n\n# WPA PSK : X\n\nX is the password of the wireless network.\nHere\
    \ is an extra section, which might prove useful. Known problems that are faced...\
    \ troubleshooting:\n\n1. As the screenshot above, you saw the first line read\
    \ \"Switching wlan0 to channel 6\". (Yours will be mon0 instead of wlan0). Sometimes,\
    \ it keeps switching interfaces forever.\n2. Times it never gets a beacon frame,\
    \ and gets stuck in the waiting for beacon stage.\n3. Times it never associates\
    \ with the target AP.\n4. Times the response is too slow, or never comes, and\
    \ a (0x02) or something error is displayed.\n\nIn most cases, such errors suggest:\n\
    1. Something wrong with wireless card.\n2. AP is very choosy, won't let you associate.\n\
    3. The AP does not use WPS.\n4. Rate Limiting implemented in the router (most\
    \ new router have this)\n\nPossible workarounds:\n1. Sometimes, killing naughty\
