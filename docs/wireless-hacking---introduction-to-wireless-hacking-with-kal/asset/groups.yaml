  - '[PAGE 88]


    # # Hack WPA/WPA2 PSK Capturing the Handshake


    WPA password hacking

    Hacking WPA-2 PSK involves 2 main steps:

    1 Getting a handshake (it contains the hash of password, i.e. encrypted password)

    2 Cracking the hash.


    Now the first step is conceptually easy. What you need is you, the attacker, a
    client who''ll connect to the wireless network, and the wireless access point.
    What happens is when the client and access point communicate in order to authenticate
    the client, they have a 4 way handshake that we can capture. This handshake has
    the hash of the password, and thus hashing is a robust protection method. But
    there is one thing we can do. We can take all possible passwords that can exists,
    and convert them to hash. Then we''ll match the hash we created with the one that''s
    in the handshake. Now if the hashes match, we know what plain text password gave
    rise to the hash, thus we know the password. If the process sounds really time
    consuming to you, then it is. WPA hacking (and hash’ cracking in general) ’ pretty
    resource intensive and time taking process. Now there are various ways that cracking
    of WPA can be done. But since WPA is a long shot, we shall first look at the process
    of capturing a handshake. We will also see what problems one can face during the
    process. Also, before that, please check some optional wikipediaedia theory on
    what a 4-way handshake really is.


    # The Four-Way Handshake


    The authentication process leaves two considerations: the access point (AP) still
    needs to authenticate itself to the client station (STA), and keys to encrypt
    the traffic need to be derived. The earlier EAP exchange or WPA2-PSK has provided
    the shared secret PMK (Pairwise Master Key). This key is how, designed to last
    the entire session and should be exposed as little as possible. Therefore the
    four-way handshake is used to establish another key called the PTK (Pairwise Transient
    Key). The PTK is generated by concatenating the following attributes: PMK, AP
    nonce (ANonce), STA nonce, AP MAC address, and STA MAC address. The product is
    then put through PBKDF2-SHA1 as the cryptographic hash function.


    The handshake also yields the GTK (Group Temporal Key), used to decrypt multicast
    and broadcast traffic. The actual messages exchanged during the handshake are
    depicted in the figure and explained below:'
- md: "\n1 The AP sends a nonce-value to the STA (ANonce). The client now has all\
    \ the attributes to construct the PTK.\n\n2 The STA sends its own nonce-value\
    \ (SNonce) to the AP together with a MIC, including authentication, which is really\
    \ a Message Authentication and Integrity Code: (MAIC).\n\n3 AP sends the GTK and\
    \ a sequence number together with another MIC. This sequence number will be used\
    \ in the next multicast or broadcast frame, so that the receiving STA can perform\
    \ basic replay detection.\n\n4 The STA sends confirmation to the AP.\n\nAll the\
    \ above messages are sent as EAPOL-Key frames.\nAs soon the PTK is obtained it\
    \ is divided into five separate keys:\n\n- 1 16 bytes of EAPOL-Key Confirmation\
    \ Key (CKK)– Used to compute MIC on WPA EAPOL Key message\n- 2 16 bytes of EAPOL-Key\
    \ Encryption Key (KEK) - AP uses this key to encrypt additional data sent (in\
    \ the ‘Key Data’ field) to the client (for example, the RSN IE or for the GTK)\n\
    - 3 16 bytes of Temporal Key (TK) – Used to encrypt/decrypt Unicast data packets\
    \ transmitted by the AP\n- 4 8 bytes of Michael MIC Authenticator Tx Key – Used\
