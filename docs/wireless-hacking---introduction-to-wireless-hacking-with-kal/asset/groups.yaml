    # Fluxion


    Once again, type the following:

    /fluxion

    This time it run just fine, and you would be asked a few very simple questions.


    +   - For the wireless adapter, whichever one you want to monitor on. For the
    channels, choose all, unless you have a specific channel in mind, which you know
    has the AP.

    - Then you will see an arodump-ng window (named Wifi Monitor). Let it run until
    it looks for APs and clients. Once you think you have what you need, use the close
    button to stop the monitoring.

    - You''ll be prompted to select target.

    - Then you''ll be prompted to select attack.

    - Then you''ll be prompted to provide handshake.

    - If you don''t have a handshake already caught, the script will help you capture
    one. It will send death packets to achieve that.

    - After that, I quit the procedure (I was using the script in my college hostel
    and didn''t want to cause any troubles to other students).


    Getting my wireless network''s password by fooling my smartphone into connecting
    to a fake


    So, in this example, I will try to find the password of my wireless network by
    making my smartphone to connect to a AP, and then type out the password in the
    smartphone, and then see if my Flux instance on my Kali machine (laptop) gets
    the password. Also, for the handshake, I will de-authenticate the same smartphone.
    You can probably follow this guide without having any clue how WPA works, what
    handshake is, what is actually going on, etc., but I suggest you read up about
    these things.'
