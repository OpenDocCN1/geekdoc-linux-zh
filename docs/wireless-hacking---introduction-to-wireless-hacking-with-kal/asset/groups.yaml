    1 AP 向 STA 发送一个随机值（ANonce）。现在客户端已拥有了构建 PTK 的所有属性。


    2 STA 向 AP 发送自己的随机值（SNonce）以及一个包含身份验证的 MIC，其中该 MIC 实际上是消息身份验证和完整性代码（MAIC）。


    3 AP 发送 GTK 和一个序列号以及另一个 MIC。该序列号将用于下一个多播或广播帧，以便接收端 STA 能够执行基础的重放检测。


    4 STA 向 AP 发送确认信息。


    上述所有消息都以 EAPOL-Key 帧的形式发送。

    一旦获得 PTK，它将拆分为五个独立的密钥：


    - 1 16 字节的 EAPOL-Key 确认密钥 (CKK) – 用于计算 WPA EAPOL Key 消息上的 MIC。

    - 2 16 字节的 EAPOL-Key 加密密钥 (KEK) - AP 使用此密钥加密发送到客户端的额外数据（在‘Key Data’ 字段中，例如 RSN
    IE 或 GTK）。

    - 3 16 字节的临时密钥 (TK) – 用于加密/解密 AP 发的单播数据包。

    - 4 8 字节的 Michael MIC 认证器 Tx 密钥 – 用于计算 AP 发的单播数据包上的 MIC。


    握手中提供的 Michael MIC 认证器 Tx/Rx 密钥仅在网络使用 TKIP 加密数据时使用。

    顺便说一下，如果你没太懂其中的内容，不要担心。人们不在维基百科上搜索攻击教程是有原因的（有一半的内容都让人听不懂）。


    # 捕获握手


    现在有几种（这里只列出了 2 种）捕获握手的方法。我们将逐一查看：

    - Wifiite（简单且自动）

    - Airodump-ng（简单但非自动，你必须手动执行 wifite 自动完成的操作）


    ## 方法论


    我们先从简单的开始。现在你需要意识到，若要捕获握手，必须有正在进行的握手发生。现在有 2 种选择：你可以坐在那里等新客户端出现并连接到网络，或者你可以强制已连接的客户端断开连接，当它们重新连接时，你捕获它们的握手。你的网卡擅长接收数据包，但不擅长创建数据包。如果你的客户端离你很远，你的删除请求（即：请离开此连接请求）将无法到达它们，你将一直奇怪为什么获取不到任何握手（在
    ARP 注入和其他类型的攻击中也会遇到类似的问题）。所以，想法是尽可能靠近接入点（路由器）。wifite 和 airdump-ng 方法的方法相同，但 wifite
    会为你处理所有这些琐事，而在 airdump-ng 中，你需要召唤兄弟（aireplay-ng）来救援。理论讲解完毕。


    # 使用 Wifite 获取握手


    现在我的配置非常简单。我的手机连接到一个名为 ''me'' 的受 wpa-2 保护的无线网络。目前没有人连接到该网络。让我们看看 wifite 能做什么。


    ```

    root@kali:~# wifite

    WiFi v2 (r85)

    () : 为 Linux 设计的自动化无线审计工具

    +] 正在扫描无线设备...

    +] 启用 wlan0 的监听模式... 完成

    +] 正在扫描 (mon0)，每 5 秒更新一次，准备好后按 CTRL+C。

    [0:00:04] 正在扫描无线网络。找到 0 个目标和 0 个客户端

    +] 正在扫描 (mon0)，每 5 秒更新一次，准备好后按 CTRL+C。

    NUM ESSID CH ENCR POWER WPS? CLIENT

    1 me 1 WPA2 57db wps

    2 ******** 11 WEP 21db no client

    3 ************ 11 WEP 21db no

    ```


    现在如你所见，我的网络显示为 ''me''。我按了 ctrl+c，wifite 询问我想要攻击哪个目标（该网络开启了 WPS。这是一个额外的红利，reaver
    可以帮你免除所有麻烦。此外，wifite 也会使用 reaver 来跳过整个 WPA 破解过程，转而利用 WPS 漏洞）。我们已经有一篇关于使用 Reaver
    破解 WPA WPS 的教程了，现在我们将忽略这个网络有 WPS 的事实，转而捕获握手。


    现在我选择了第一个目标。我尝试了 PIN 猜测攻击。它的成功率几乎是 100%，我等了 2-3 小时。但我按了 ctrl+c。那里没有客户端，所以无法捕获握手。以下是发生的情况：


    ```

    +] 选择目标数字 (1-3)，用逗号分隔，或输入 ''all'':

    +] 已选择 1 个目标。

    [0:00:00] 对 me 启动 WPS 攻击 (02:73:8D:37:A7:ED)

    ^C00:00:24] WPS 攻击，0/0 成功/ttl

    (^C) WPS 暴力攻击被中断

    [0:08:20] 在 "me" 上启动 wpa 握手捕获

    [0:08:05] 正在等待握手...

    (^C) WPS 握手中断

    [+] 完成 2 次攻击：

    [+] 0/2 WPA 攻击成功

    +] 禁用 mon0 模式... 完成

    ```


    现在我将 PC 连接到 ''me''。让我们重试一次。这次会出现一个客户端，wifite 会进行去身份认证，当它们重连时，我们将捕获握手。


