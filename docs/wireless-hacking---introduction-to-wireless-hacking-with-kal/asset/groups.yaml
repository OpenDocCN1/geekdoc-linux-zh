    \ I'm linking it)\n\n# 3 Networking Basics: IP address, Netmasks and Subnets\n\
    \n## IP address\n\nAn IP address is simply a 32 bit address that every device\
    \ on any network (which uses IP/ TCP protocol) must have. It is usually expressed\
    \ in the decimal notation instead of binary because it is less tedious to write\
    \ it that way. For example,\n\nDecimal notation - 192.168.1.1\nBinary - 10000000.10101000.00000001.00000001\n\
    \nAn IPv4 address (dotted-decimal notation) ![](img/bf9c24bf1435c4e9031e4517bb0256.png)\
    \ is clear from the binary form that the IP is indeed 32 bits. It can range from\
    \ 0.0.0.0 to 255.255.255.255 (all 0s and all 1s respectively).\n\n## Parts of\
    \ IP address\n\nNow this IP address has 2 parts, the network address and host\
    \ address. A lot of routers keep the first octets (8 bits) for the network address\
    \ and the last octet as host address. A very common configuration being 192.168.1.1.\
    \ Here, 192.168.1.0 is the network address and 0.0.0.1 is host address. I hope\
    \ you can see that the host address can vary from 0.255 (though 0 and 255 are\
    \ reserved for the network).\n\n## Netmasks\n\nBut different networks have different\
    \ needs. The previous configuration lets you have a lot of possible networks (not\
    \ just 192.168.1.0 but more than 255). This is why there is no \"hardcoded\" standard\
    \ enforced on networks and host addresses, and instead, they can specify their\
    \ own. Using Netmasks, we can have a versatile set of configurations for each\
    \ and every needed. Netmask is used to divide the IP address into subnets.\n\n\
    We'll start with a basic example. Suppose we want to define a netmask which configures\
    \ our network like the previous example. We want the first 3 octets to correspond\
    \ to the network and the next octet for host address. Let's think of an operation\
    \ we can use to separate the network and host part of the IP address. For simple\
    \ purposes, we could have defined anything after the third period as host address.\
    \ While this is a simple solution, it is not very versatile.\n\nA more elegant\
    \ and mathematical solution was proposed. First, I'll tell you the mathematical\
    \ functionality of netmask. Assume A to be an IP address and M to be netmask.\
    \ Then, A & M gives the Network address and A (~M) gives the Host address. Where,\
    \ & is bitwise And ~ is bitwise Not (i.e., complement). To be more precise, A\
    \ netmask is another 32 bit binary number (just like an IP address), but with\
    \ the purpose of giving Host address and network address when the bitwise operation\
    \ is carried out on it (and it's complement) with A.\n\nExample\nA = 192.168.1.1\
    \ is your IP address\nM = 255.255.255.0\nWe convert it to binary, and carry out\
    \ the desired operations.\nA = 11000000.10101000.00000001.00000001 (192.168.1.1)\n\
    M = 11111111.11111111.11111111.00000000 (255.255.255.0)\nA&M = 11000000.10101000.00000001.00000000\
    \ (192.168.1.0)\nA&M is the network IP that we desired.\nA = 11000000.10101000.00000001.00000001\
    \ (192.168.1.1)\n~M = 00000000.00000000.00000000.11111111 (0.0.0.255)\nA&~M =\
    \ 00000000.00000000.00000000.00000001 (0.0.0.1)\nA&~M is the host IP that we desired.\n\
    \nExplanation\nBasically, if you realize that 11111111 is 255 in decimal, then\
    \ you can see that for parts of the IP address that you want for networks, you\
    \ set the subnet to 255, and for the ones you want host, you set it to 0.\n\n\
    So, if you want to reserve 2 octets for networks and 2 for hosts, then the subnet\
    \ will be\nM = 255.255.0.0\n\nIf you want 3 octets for host, then\nM = 255.0.0.0\n\
    \nHence, we can see that using netmasks we can achieve what we wanted, i.e. to\
    \ define networks with whatever number of hosts we require. Now we go a bit further.\n\
    \n## Subnets\n\nNow suppose you want to divide your network into parts. It is\
    \ the sub-networks that are known as subnets (it is correct to call them subnetwork\
    \ as well).\n\nWe'll jump right to it, consider the netmask M:\nM = 11111111.11111111.11111111.11000000\n"
