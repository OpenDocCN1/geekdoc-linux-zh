    \ `-frag` 即可执行分片攻击。同样，还可以进行许多其他攻击。一个好主是执行以下命令：\n\n# wifite -help\n\n这将告诉你常用的用法命令，这些命令将非常有用。以下是针对不同攻击的\
    \ WEP 命令列表：\n\n- -wep only 仅目标 WEP 网络 [off]\n- -pps <num> 设置每秒注入的数据包数量 [600]\n\
    - -wept <sec> 每次攻击等待等待的秒数，0 表示无限 [600]\n- -chopchop 使用 chopchop 攻击 [on]\n- -arpreplay\
    \ 使用 arreplay 攻击 [on]\n- -fragment 使用分片攻击 [on]\n- -caffelatte 使用 caffe-latte 攻击\
    \ [on]\n- -p0841 使用 -p0841 攻击 [on]\n- -hirte 使用 hirte (cfrag) 攻击 [on]\n- -nofakeauth\
    \ 如果伪身份验证失败则停止攻击 [off]\n- -wepca <n> 当 iv 数量超过 n 时开始破解 [10000]\n- -wept <sec>\
    \ 每次攻击等待的秒数，0 表示无限 [600]\n- -chopchop 使用 chopchop 攻击 [on]\n- -arpreplay 使用 arprep\
    \ 攻击 [on]\n- -fragment 使用分片攻击 [on]\n- -caffelatte 使用 caffe-latte 攻击 [on]\n- -p0841\
    \ 使用 -p0841 攻击 [on]\n- -hirts 使用 hirts (frag) 攻击 [on]\n- -nofakeauth 伪身份验证失败时停止攻击\
    \ [off]\n- -wepca <> 当 iv 数量超过 n 时开始破解 [10000]\n- -wepsave 将 .cap 文件的副本保存到此目录\
    \ [off]\n\n-wepsave: 将 .cap 文件的副本保存到此目录 [off]\n如你所见，它与帮助截图中的内容是一样的。尝试各种攻击并看看你能做什么。在没有\
    \ WPS 的情况下破解 WPA 并不那么简单。出乎意料的是，显示：“正在扫描无线设备。未找到无线接口。你需要插入 wifi 设备或安装驱动程序。正在退出。”\n\
    \n你可能是在虚拟机中运行 Kali。虚拟机不支持内部网卡。要么购买外部无线卡，要么使用 Windows 进行实时启动/侧启动。通常情况下虚拟机以外的任何方式都行。\n\
    \n# Fluxion\n\nWifite 确实很酷，但对无敌的 WPA-2 网络没多大作用。通过结合恶性孪生（evil-twin）和中间人攻击之类的手段，fluxion\
    \ 试图欺骗客户端向你提供受 WPA-2 保护的访问点的密钥。\n\n# 5\n\n不使用字典/暴力破解破解 WPA/WPA2：Fluxion\n\nFluxion\
    \ 基于另一个名为 *linset.* 的脚本。我曾考虑过在渗透测试期间中使用类似中间人攻击/恶性孪生攻击的方法来获取 WPA 密码，而不是走暴力破解/字典路线。然而，当我看到关于这个酷炫脚本的帖子后，我决定尝试一下。因此，在本章节中，我将向你展示我是如何使用\
    \ Fluxion 的，以及你可以如何这样做。\n\n免责声明：仅在你拥有的网络上使用工具。不要做任何违法。\n\n目录\n\n- • 检查工具是否已预装，如果没有，通过\
    \ github 获取。\n- • 运行脚本，根据需要安装依赖项。\n- • 如何使用 Fluxion 的快速概述。\n- • 带有文字说明和截图的详细步骤和演示\n\
    - • 视频演示（与文字演示不完全，但几乎一样）\n- • 故障排除章节\n\n![](img/bf9c247bf1435c4e9031e4517bb02053_57_0.png)\n\
    \n我做的第一件事是确保 Kali 还没有这个工具。如果你是在编写很久之后读到这一章，那么 Kali 可能已经预装了该工具。无论如何，尝试一下这个：\n\n\
    我个人尝试过检查 linset 或 fluxion 是否预装在 Kali 中（尽管我并不指它们在那里）。\n\n# 获取脚本\n\n获取脚本只是克隆 github\
    \ 仓库的问题。只需使用 git 命令即可。\n\n```\ngit clone https://github.com/deltaxflux/fluxion\n\
    ```\n\n如果你在这一步遇到任何问题，可以直接导航到仓库并手动下载内容。\n\n# 运行脚本\n\n只需进入 fluxion 目录，或者如果你是手动下载的进入包含脚本的目录。如果你遵循我使用的终端命令，对你来说只是一个简单的切换目录命令：\n\
    \n```\ncd fluxion\n现在，运行脚本。\nsudo ./fluxion\n```\n\n有 4 个依赖项需要安装。\n\n# 依赖项\n\n\
    如果你有未满足的依赖项，请运行安装脚本。\nsudo ./Installer.sh\n\n我有 4 个未满足的依赖项，安装脚本的运行对我来说是一次糟糕的体验（尽管可能是因为我完全搞乱了系统，编辑了我不该编辑的文件，现在无法让它们恢复正常）。过程中它卡住了几次，我不得不多次使用\
    \ ctrl+c 退出（尽管 ctrl+c 并没有终止整个安装程序，只是那个小的更新窗口）。此外，我还运行了两次安装脚本，这搞乱了一些 aptget 设置。我建议在安装完成后，将你的\
    \ /etc/apt/sources.list 恢复到原始状态，并移除前沿仓库（除非你自己在做什么）。\n\n注：对于那些尝试使用 apt-get 安装缺失内容的人来说——某些依赖项在默认\
    \ Kali 仓库中可用，所以你必须让脚本来处理。\n\n读取软件包列表... 完成\n正在构建依赖树\n读取状态信息... 完成\n将安装以下额外的软件包：\n\
    policy-utils\n建议软件包：\nisc-utils\n将安装以下新软件包：\nisc-dhcp-server\n升级，0 个移除，5 个已升级。\n\
    为了释放 752 KB 的可用空间，在此操作后，将使用 628 MB 的额外空间。\nGet: http://repo.kali.org/kali-rolling/amd64\
    \ libbios-libiscfgort140 amd64 10.3-2fs100.1\nGet: http://repo.kali.org/kali-rolling/amd64\
    \ libbios-libiscfgort140 amd64 10.3-2fs100.1\nGet: http://repo.kali.org/kali-rolling/amd64\
    \ libbios-libiscfgort140 amd64 10.3-2fs100.1\n已下载 32.7 MB，34 个文件\n\n![](img/bf9c247bf1435c4e9031e4517bb02053_64_0.png)\n\
    \n# Fluxion\n\n再次，输入以下内容：\n/fluxion\n这次运行运行良好，你会被问几个简单的问题。\n\n- 对于无线适配器，选择你想要监控的哪一个。对于通道，选择所有，除非你心里有一个特定的拥有\
    \ AP 的通道。\n- 然后你将看到一个 arodump-ng 窗口（名为 Wifi Monitor）。让它运行直到它搜索 AP 和客户端。当你认为已经有了所需的内容，使用关闭按钮停止监控。\n\
    - 你将被提示选择目标。\n- 然后你将被提示选择攻击。\n- 然后你将被提示提供握手。\n 如果 如果还没有捕获到握手，脚本将帮助你捕获。它将发送删除包来实现这一点。\n\
    - 之后，我退出了程序（我当时在学校宿舍使用脚本，不想给其他学生带来任何麻烦）。\n\n通过欺骗手机连接到虚假 AP 来获取我的无线网络密码\n\n因此，在这个例子中，我将通过让我的手机连接到\
    \ AP，然后在手机上输入密码，然后查看我的 Kali 机器（笔记本电脑）上的 Flux 实例是否获取了密码。此外，对于握手，将对同一台手机取消认证。\n\n"
