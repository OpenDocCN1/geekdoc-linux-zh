    be accessed by anyone. Also, the data transmitted by you is not encrypted and
    can be read by anyone in the vicinity. Anything which you send to the destination
    server in plain-text (say, to google), will be transmitted from your machine to
    the wireless router in plain-text. Anyone in the vicinity can easily read it using
    Wireshark or any other tool similar. Of course, sensitive data is rarely in plain-text,
    so don''t sit around wireless hotspots hoping to get someone''s FB login credentials.
