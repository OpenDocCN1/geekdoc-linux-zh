    # 带有 WPS 的 WPA：没有 WEP 那么简单


    - 带有 WPS 的 WPA - 一个有弱点的硬汉。击中他的痛点，原本“需要永远才能进入”就会变成几小时的事。虽然没有 WEP 那么简单，但仍然可行。遗憾的是，你可能会遇到一个有弱点但已经开始吸取教训并妥善保护该点的家伙（带有速率限制或其他安全措施的
    WPS）。


    我希望你现在对各种类型的无线安全有了一个大致的了解。我脑海中还有几份高级指南，它们将涉及这些“类型”的加密细节、漏洞及其利用方法。至于实际的黑客攻击过程，本网站以及互联网其他地方有很多关于这方面的教程，因此我不再重复介绍这些内容。我希望这次当你阅读指南时，能够意识到正在发生什么，而不会最终尝试在
    WPA 网络上对 WPS 目标进行攻击。


