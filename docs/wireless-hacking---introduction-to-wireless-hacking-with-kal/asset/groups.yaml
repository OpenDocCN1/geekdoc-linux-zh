    Any of the above clubs have a secret entry. Sounds cool, right? This is somewhat
    similar to what we call "Security Through Obscurity". How do you get in if you
    don''t know where the club''s entrance is? Well, while you don''t know where the
    club entrance is, you know the club is. You have two options


    +   1 Passive method - You go to the roof of a nearby building, take your binoculars,
    and try to find out how people enter the building. In wireless terms, you wait
    till a client connects to the network. This may take a lot of time, but it''s
    relatively safer from a forensic viewpoint (by not doing anything, just watching
    patiently, you ensure that you don''t leave any clues which may be later to catch
    you).


