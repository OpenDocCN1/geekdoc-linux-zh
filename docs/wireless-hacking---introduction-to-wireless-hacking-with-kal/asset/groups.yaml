    - 2 欺骗用户让你把密码交给你。基本上，这只是中间人攻击和社交工程攻击的结合。更具体地说，它是**恶性孪生**（evil twin）和钓鱼攻击的结合。在这种攻击中，你首先强制客户端断开与原始
    WPA-2 网络的连接，然后强制连接你创建的虚假开放网络，最后向他的浏览器中发送一个登录页面，要求他输入网络密码。你可能会想，为什么我们需要保持网络开放状态然后在浏览器中请求密码呢？答案在于
    WPA-2 在四次握手期间执行双向认证。基本上，客户端验证 AP 是否合法且已知密码，而 AP 验证客户端是否合法且已知密码（在整个过程中，密码从未以明文发送）。我们只是没有完成四次握手的必要数据。


    - 3 额外说明：WPS 漏洞和 reaver [我已单独详细介绍过，所以不再重复解释（我只是凡人，而且是个非常懒的人）]


    WPA-2 四次握手过程。AP 和客户端相互认证。


    ## 工具 (Kali)


    在本章中，我将列出 Kali 中预装的一些无线黑客类别的常用工具，以及它们的用途。


    ### 捕获数据包

    - airodump-ng

    - wireshark（非常多功能的工具，有书籍专门介绍该工具用于数据包分析）


    ### 2 破解握手包


    ### # Wireshark（非常多功能的工具，有书籍专门介绍该工具用于数据包分析）。


    - aircrack-ng（可以破解握手包也可以破解 WEP）

    - hashcat（GPU 破解）

    - cowpatty


    ### 3 WPS

    - reaver

    - pixiewwps（执行“Pixie 灰埃攻击”）


    ### 4 酷炫工具

    - aireplay-ng（主要针对 WEP）

    - mdk3（很酷的东西）


    ### 5 自动化

    - wifite · fluxion（不是常用的脚本）


    ## 无线黑客


    你应该了解：


    - 你会遇到哪些类型的无线网络，以及破解每种网络的难度有多大。

    - 什么是隐藏网络，它们是否真的对黑客构成了挑战。

    - 大致了解各种不同“类型”的无线网络实际上是如何被破解的。


    你将学会：


    - 更多地了解不同类型的无线网络。

    - 如何破解任何指定的无线网络。

    - 无线黑客中常用的工具和攻击。

    - WEP、WPA 和 WPA-2


    WEP 是上述讨论中存在缺陷的方案。无线联盟的目标是编写一种算法，使无线网络（WLAN）像有线网络（LAN）一样安全。这就是为什么该协议被称为等同线隐私（Wired
    Equivalent Privacy，等同于传统有线网络的预期隐私）。遗憾的是，虽然 WEP 背后的理论无懈可击的，但实际实现有很多缺陷。主要问题是静态密钥和弱的
    IV（初始化向量）。一段时间以来，人们尝试修复这些问题，但没有一个是有效的（制作了 WEP2、WEPplus 等但都失败了）。


    WPA 是一种新的 WLAN 标准，兼容使用 WEP 加密的设备。它修复了 WEP 加密几乎所有的缺陷，但由于必须与旧硬件兼容的限制，WEP 的某些遗留问题仍然会困扰
    WPA。总的来说，WPA 是相当安全的。在上面的故事中，这是一艘重修的船。


    WPA-2 是无线网络最新且最稳健的安全算法。它与许多设备不向后兼容，但现在所有新设备都支持 WPA-2。这是一艘无坚不摧的船，使用了更强合金的新型号。


    - 极少数工具可以正确执行针对 WPA 网络的攻击（模糊的概念证明性脚本意味着你必须从零开始完成一切，而大多数人做不到）。

    - 所有这些攻击仅在特定条件下有效（密钥更新期必须足够长、必须启用 QoS 等）。


    由于这些原因，尽管 WPA 的安全性比 WPA-2 稍微低，但在大多数情况下，黑客必须使用暴力破解/字典攻击以及他针对 WPA-2 会使用的其他方法，这从他的角度来看让
    WPA 和 WPA-2 变得没有区别。


    PS：WPA/WPA-2 的故事比我在这里记录的更多。实际上，WPA 或 WPA-2 是模糊的描述，实际的复杂性（关于使用的加密和认证：PSK、CCMP、TKIP、X/EAP、AES）需要进一步研究个人版和企业版的
    WPA 以及 WPA-2。


    ## 如何破解


    现在你已经了解了所有网络的基础知识，让我们来看看这些网络实际上是如何被破解的。


    ## WEP


    大多数攻击依赖于 IV（初始化向量）的固有弱点。基本上，如果你收集了足够多的 IV，就能获得密码。获取密码的方法有两种类型：


    - 1 被动方法

    - 如果你不想留下任何痕迹，那么被动方法是首选。在这种情况下，你只需监听通道并在数据（airodump-ng）。这些数据包将提供 IV，有了足够的就可以破解网络（aircrack-ng）。


    ### 主动方法

    上述方法非常缓慢，因为你需要大量数据包。然而，有很多加速过程的方法。基本思想是启动某种对话，然后捕捉由此产生的数据包。问题是，并不是所有数据包都带有 IV。因此，在没有
    AP 密码的情况下，你必须生成带有 IV 的包。


    - Chopchop 攻击

    - 碎片攻击

    - Cafe Latte 攻击


    我将单独详细介绍这些攻击（我真的无法在此总结）。


    ## WPA-2 (以及 WPA)


    这里没有你可以轻松利用的漏洞。我们只有两种选择：要么给出密码，要么欺骗用户把密码交给我们。


    1 猜密码 - 猜某些东西需要两点：猜测（这不用说）和验证。基本上，你需要大量的猜测，并能够验证它们是否正确。最原始的方法是在连接 Wi-Fi 时操作系统提供的密码框中输入猜测。但很慢，因为你必须手动操作。即使你为它编写脚本，也需要花费时间，因为每次猜测都要与
    AP 通信（每个猜测多次）。基本上，通过向 AP 请求进行验证是缓慢的。那么，是否有方法可以在不询问 AP 的情况下检查密码的正确性？有的，但前提是你有四次握手。基本上，你捕捉有效客户端连接到
    AP 时传输的一系列数据包。如果你有这些数据包（四次握手），就可以针对它验证你的密码。关于这有更多细节，但我希望这个抽象的概念是清晰的。猜测密码有几种不同的方式：


    - 暴力破解 - 尝试所有可能的密码。只要时间足够，这保证会有效。然而，对于 8 位长度的字母数字密码，暴力破解所需的时间非常长。

    - 词列表/字典 - 在这种情况下，有一份作为密码候选的单词列表。这些词列表包含英语单词、单词组合、拼写错误


