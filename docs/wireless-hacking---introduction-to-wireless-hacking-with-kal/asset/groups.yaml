    ° Rainbow table - The validation process against the 4-way handshake that I mentioned
    earlier involves hashing of the plaintext which is compared with the hash in handshake.
    However, hashing (WPA uses PBKDF2) is a CPU intensive task and is the limiting
    factor in the speed at which you can test keys (this is why there are so many
    tools which use GPU instead of CPU to speed up cracking). Now, a possible solution
    to this is that the person who created the wordlist/dictionary that we can also
    convert the plaintext passwords into hashes so that they can be checked directly.
    Unfortunately, WPA-2 uses a salt while hashing, which means that two networks
    with the same password can have different hashes if they use different salts.
    How does WPA-2 choose the salt? It uses the network''s name (SSID) so the same
    password would be the same salt. So, now the guy who made the wordlist has to
    create separate hashes for all possible SSID''s. Practically, what happens is
    hashes are generated for the most common SSID''s (the default when a router is
    like -linksys, netgear, belkin, etc.). If the target network has one of SSID''s
    then the cracking time is reduced significantly by using the precomputed hashes.
    These precomputed rainbow tables could be significantly larger than the wordlists
    tables, and while we saved ourselves time cracking the password, we had to use
    a much larger file (some are 100s of GBs) instead of a smaller one. This is referred
    to as time-memory tradeoff. This page has rainbow tables for 1000 common SSIDs.


    2 Fool a user giving you the password. Basically this is just a combination of
    Man in the middle attacks and social engineering attacks. More specifically, it
    is a combination of evil twin and phishing. In this attack, you first force a
    client to disconnect from the original WPA-2 network, and then send him a login
    page in his browser where you ask him to enter the password of the network. You
    might be wondering, why we do need to keep the open network and ask for the password
    in the browser (can''t we just create a WPA-2 network and let the user give us
    the password directly). The answer to this lies in the fact that WPA-2 performs
    mutual authentication during the 4-way handshake. Basically, the client verifies
    that the AP is legit, and knows the password, and the AP verifies that the client
    is legit and knows the password, the process is never sent in (plaintext).


    3 Bonus : WPS vulnerability and reaver [I have covered it in detail separately
    so not explaining it again (I''m only human, and a very lazy one too])'
