    is slow. So, is there a way to check the correctness of our password without asking
    the AP? Yes, but only if you have a 4-way handshake. Basically, you capture the
    series of packets transmitted when a valid client connects to the AP. If you have
    these packets (the 4-way handshake), then you can validate your password against
    it. More details on this, but I hope the abstract idea is clear. There are a few
