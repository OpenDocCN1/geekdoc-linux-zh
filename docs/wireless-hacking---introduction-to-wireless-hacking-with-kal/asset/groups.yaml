    # FLUXION 0.23

    # 由 Deltax, Strasharo 和

    # Desktop 创建

    ####################################

    文档

    选择语言

    1) 德语

    2) 英语

    3) 罗马尼亚语

    4) 土耳其语

    5) 西班牙

    视频

    #> >

    垃圾箱

    ```


    选择语言后，会显示此界面。

    注意我没有使用任何外部无线网卡，而是使用了笔记本的内置网卡。

    然而，某些内置网卡可能会引起，因此最好使用外部网卡（如果你在虚拟机上，则必须使用外部网卡）。


    扫描过程开始，使用 `airodump-ng`..


    ```

    ####################################

    # Cleanup

    # FLUXION 0.23 < Fluxion 就是未来 >

    # 由 Deltax, Strasharo 和 ApatheticEuphoria 创建

    #

    ####################################

    清理2

    选择一个接口

    1) wlan0 Atheros AR9565 ath9k

    #? []

    清理 3

    ```


    你可以选择一个目标。我正在针对第 21 号网络，也就是我手机连接的那个：


    你选择一种攻击方式。我将选择 Hostapd（第一个）攻击。

    如果你已经捕获了 4 路握手，你可以指定该握手的位置，脚本将使用它。否则，它将在下一步中为你捕获一个握手。


    ```

    ############################################

    # Cleanup

    # FLUXION 0.23 < Fluxion Is The Future > #

    # 由 Deltax, strasharo 和 ApatheticEuphoria 创建

    ############################################


    清理2

    握手检查


    1) aircrack-ng (错过几率)

    2) pyrit

    3) 返回

    清理3

    #> 1

    ```


    如果你之前没有捕获到握手，就可以选择使用哪种工具来完成。我选择了 `aircrack-ng`。


    ![](img/bf9c247bf1435c4e9031e4517bb02053_69_0.png)


    一旦你捕获了握手（查看顶部的 WPA Handshake: [MAC Address]，如果那里有，说明你已拥有握手），输入 1 并按回车检查握手。如果一切正常，你将进入下一步。


    ![](img/bf9c247bf1435c4e9031e4517bb02053_69_1.png)


    选择你的选项

    1) Web 界面

    2) 暴力破解

    3) 退出


    Web界面方法。我没有尝试暴力破解，但我猜那只是大多数工具使用的普通暴力攻击（因此对我们没用，因为这不是我们使用此脚本的目的）。


    这种方法提供了多种登录页面，你可以利用它们获取（钓鱼）WPA 网络密码。我选择了第一个选项：


    做出决定后，你会看到多个窗口。左两个窗口处理 DHCP 和 DNS 请求，而右两个窗口是状态报告窗口和取消认证窗口（用于将用户从真实的 AP 断开并引导他们进入伪
    AP）。


    在我的手机上，我看到了两个同名的网络。注意，虽然原始网络受 WPA-2 保护，但我们创建的伪 AP 是开放网络（这是一个巨大的破绽，会阻止大多数人误连它）。无论如何，我连接了伪
    AP，DNS 和 DHCP 窗口（左侧）做出了相应的反应：


    连接网络后，我收到一个通知，说我登录无线网络。点击它后，我发现了这个页面。对于某些来说，你需要打开浏览器并尝试打开一个网站（例如 facebook.com）才能显示此页面。在我输入密码并点击提交后，脚本会将密码与我们之前捕获的握手进行对比，以验证其是否正确。注意，在这种方法中，握手是奢侈品而非必需品。它是正确与否的问题。如果没有握手，我们就失去了这种能力。


    ![](img/bf9c247bf1435c4e9031e4517bb02053_69_0.png)


    '
