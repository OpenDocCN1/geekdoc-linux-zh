    2 Active method - You cut off the electric/water supply to the building, or maybe
    trigger the fire alarm. One way or the other, force the members to get out of
    the club. Once they find out everything is fine, they''ll swarm back. You will
    know where the gate is. In wireless terms, you can de-authenticate the clients
    (you''ll be doing this, whether you''re hacking a WEP network, or getting a WPA
    handshake [again, more on this later]. Off course, this method results in leaving
    behind some traces, at least you don''t have to wait for hours.


    The analogue of hidden entry clubs are hidden networks. As long as the network
    has clients, it''s quite easy to find the name of the network (SSID) to be precise,
    setting the network to hidden basically stops the access point from revealing
    it''s SSID. However, when a client connects to the network, beacon frames (date
    packets) with SSID (in clear-text, i.e. unencrypted) are transmitted, which you
    can capture and the SSID of the network. So, hidden networks don''t really offer
    much protection to a network, and a WEP protected hidden network means that instead
    of 10 mins it will take 15 mins to get the password. For a WPA network, making
    the SSID hidden doesn''t really do a lot since WPA networks are practically uncrackable
    and a person who has the time and processing power to get WPA encryption won''t
    be stopped by the hidden SSID.


