- md: '

    Now we have already run airodump-ng a couple of times. However, this time we will
    pass the -w command which will instruct airodump-ng to save the output to a file:

    airodump-ng -c [channel] --bssid [bssid] [file_name] [interface]

    airodump-ng -c 2 --bssid 00:17:7C:22:CB:80 -w dump mon0

    The output will be saved in a file dump_01.cap


    Now we can keep this terminal running and it will keep saving the packets. [In
    the previous tutorial we did only 2 things, capture the packet, i.e this step,
    and crack it, i.e the step we are going to do last. While it makes our work easier
    to just follow two steps, it also makes the process much more time consuming,
    since we are simply a passive packet listener, who is not doing anything]


    ## # Speeding Things Up


    ### Fake Authentication


    Now to speed things up, we will inject the network. We will thus obtain ARP packets.
    These packets will fill up the data column of our airodump-ng capture, and data
    is what will help us obtain the password. As soon as we have 10000 data packets,
    we can start attempting to get the password using aircrack-ng.


    Now to make the AP pay attention to your injected packets, you either have to
    be a connected client, or have to pretend to be one. You can either mask your
    mac address to one of the already connected clients, or use the fake authentication
    feature. We will do the latter. (If you see an error like the AP is on channel
    x and mon0 is on channel y then go to the bottom of the chapter for troubleshooting):


    ```

    aireplay-ng -1 0 -e DIGISOL -a 00:17:7C:22:CB:80 mon0

    ```


    ## # ARP request replay mode


    ARP packets are your best bet at getting a lot of IVs or data. Without IVs you
    can''t hack a network. Enter the following code to make airplay-ng listen to the
    AP for ARP packets, and inject them as soon as they find one. This will create
    a lot of data very fast. This is the real speeding step.


    ```

    aireplay-ng -3 -b [BSSID] mon0

    ```

    This is what the final code will look like:

    aireplay-ng -3 -b 00:17:7C:22:CB:80 mon0

    ```


    Now you''ll have to wait for some time till it gets an ARP request. As soon as
    it gets one, the terminal will sort of explode. And the data packets will start
    filling in with Godspeed. Now this is the part where an active user on the network
    is absolutely necessary.


    After some time I had enough packets to crack almost any network


    ## # **Cracking the network**


    Cracking the network is as easy as typing the following into the console aircrack-ng
    name_of_file-01.cap


    In our case, the command will be:


    ## # aircrack-ng dump-01.cap


    ```

    root@office:~# aircrack-ng dump-01.cap

    ```


    After pressing enter, you will have a list of networks and you''ll be prompted
    to select one of them to hack. In my case there was just one network, so I couldn''t
    get that screen, or a screenshot. The password was cracked in less than a second.


    ![](img/bf9c247bf1435c4e9031e4517bb02053_121_0.png)


    So finally you obtained the password of the network you were trying to hack.

