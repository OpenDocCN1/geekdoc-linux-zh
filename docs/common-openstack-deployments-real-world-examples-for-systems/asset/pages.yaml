- pgno: 170
  md: "# 7\n# Public Compute Cloud\n\n> *No house should ever be on any hill or on\
    \ anything.*\n> *It should be of the hill, belonging to it, so hill and house\
    \ could*\n> *live together each the happier for it.*\n> \n> Frank Lloyd Wright\n\
    \nCompanies all over the world are deploying public compute clouds for customers\
    \ looking to process data. The focus of these clouds is everything from on-demand\
    \ compute power to storage systems, which we'll explore in later chapters. For\
    \ compute-focused hosting, OpenStack provides a platform for dynamic applications\
    \ that provide highly-available service to customers. Typically, these services\
    \ are billed for based on resources used (RAM, CPU, disk, etc.) and the amount\
    \ of time the instance is used for, often on an hourly increment.\n\nThis chapter\
    \ will build upon what we've learned in Chapter 6, \"Private Compute Cloud,\"\
    \ and show you how you can track usage and ultimately bill for services on a public\
    \ cloud run by your organization.\n\n# ## Uses\n\nAs the OpenStack Community has\
    \ grown over the past several years, we've seen several companies spring up to\
    \ offer services that compete with the current proprietary cloud solutions on\
    \ the market. The OpenStack Foundation Marketplace has an entire section devoted\
    \ to companies offering public clouds (http://www.openstack.org/marketplace/public-clouds/).\n\
    \nAs a player in this market, companies can leverage the development of the open\
    \ source platform of OpenStack and on top of it build in benefits to their customers\
    \ such as geo-graphic diversity, speed, high network speeds and even application\
    \ integration to enable customers to build their products faster.\n\n# ## Traditional\
    \ Technology Company\n\nTraditional technology companies have the benefit of a\
    \ long history and strong reputation for innovation and offering their customers\
    \ solid products. In today's cloud-driven world,"
  merge: -1
  img_proc: true
- pgno: 171
  md: 'some traditional technology companies have taken to building public clouds.
    These typically are offered alongside their other offerings or in concert with
    their private cloud offerings.


    During one OpenStack summit keynote, a company talked about how their customers
    are now using hybrid clouds, which blend a deployed series of private clouds alongside
    a public cloud. This company will go on-site to assist with the deployment of
    a private cloud, and then offer a public cloud for the public-facing components
    of their infrastructure.


    # Web Hosting Company


    Companies that have specialized in web hosting have also begun offering public
    compute options. Many of these companies began by offering the purchase of a Virtual
    Private Server (VPS) to customers and also offer specific hosted services such
    as blogs or forum installations. With the move to cloud, these hosting companies
    have empowered their users to build their own applications using a framework similar
    to that which many of these traditional web hosting services have run off of.


    Additionally, some companies are leveraging portions of OpenStack for their customers
    by offering object storage for individual files, which you’ll learn about in Chapter
    9, “Object Storage Cloud.”


    # Requirements


    In this deployment scenario you’ll be using the controller and compute nodes you
    created in Chapter 5, “Foundations for Deployments.” For this installation, you
    can use the same systems you used in Chapter 6, since we did not make any additions
    to that deployment beyond the foundation.


    You may also want to set aside some time to let this deployment sit running. Since
    the metering collected by OpenStack is tracked over time, having a couple instances
    running over night will collect data so you can explore the next day or the next
    week.


    # Select Components


    On top of the foundational tooling, we’ll be adding the Ceilometer telemetry service
    to your deployment in this scenario. This will extend the basic installation to
    have to include following services, placement of which is demonstrated in Figure
    7.1:


    +   - Compute (Nova)

    +   - Identity (Keystone)

    +   - Networking (Neutron)

    +   - Image service (Glance)

    +   - Dashboard (Horizon)

    +   - Ceilometer (Telemetry)'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/8684900d708748f86bb043faa5589f9e_172_0.png)


    Figure 7.1 Components of a two system OpenStack deployment with the Ceilometer
    telemetry service


    # Architecture Overview


    At the most basic, Ceilometer polls OpenStack services you have running. We''ll
    be using Nova compute and Glance image store in our demonstration. It can also
    collect notifications from the notification bus. A collector gathers this information
    and puts it into a database. MySQL is configured for this purpose in our deployment
    to keep things simple, but MongoDB was the original and remains the recommended
    database.


    From this data store, you interact with the API to query the data. This is accomplished
    through viewing the output in the Horizon dashboard, using OpenStack Client or
    the Ceilometer command line interface or through an external billing system that
    we''ll briefly talk about later in this chapter. This basic overview is sketched
    out in Figure 7.2.


    The data collected by the collector is tracked in the form of meters. A meter
    is what is actually being measured, such as CPU load, disk I/O, or the amount
    of space Glance


    ![](img/8684900d708748f86bb043faa5589f9e_172_1.png)


    Figure 7.2 Ceilometer overview'
  merge: -1
  img_proc: true
- pgno: 173
  md: "images are taking up. Each of these meters is tracked as a type. Ceilometer\
    \ understands the following meter types:\n\n+   Cumulative—Increasing over time,\
    \ like how long an instance has been running\n+   Gauge—Discrete items such as\
    \ the number of image uploads or floating IPs used and fluctuating values like\
    \ disk I/O\n+   Delta—Change over time range, like bandwidth\n\nIn addition to\
    \ this basic overview, Ceilometer has the concepts of transformers and publishers.\
    \ A transformer enables you to manipulate original data and extend it to form\
    \ new measurements or change dimensions, making it possible for different types\
    \ of data to be presented to a client or other external system. A publisher enables\
    \ you to redirect specified data to one or more targets, rather than requiring\
    \ those targets to make requests for it.\n\n# # Scenario\n\nAs mentioned, we’ll\
    \ be adding Ceilometer to our basic installation of OpenStack defined in Chapter\
    \ 5 and used again in Chapter 6. Since we’re adding another service, we’ll need\
    \ to use Puppet to pull in the additional components.\n\nIn this scenario you\
    \ will be making changes to both the controller node and the compute node.\n\n\
    # # Controller Node Setup\n\nOn the controller you’ll be using another puppet\
    \ apply command, which will process our foundational public cloud role in Puppet:\n\
    \n```\n$ sudo puppet apply /etc/puppet/modules/deployments/manifests/role/foundations_public_cloud.pp\n\
    ```\n\nWhile this is running, let’s take a look at what we’re running.\n\n```\n\
    class deployments::role::foundations_public_cloud {\n  include deployments::role::foundations\n\
    \  include deployments::profile::ceilometer\n}\ninclude deployments::role::foundations_public_cloud\n\
    ```\n\nAs you can see, this pull in our foundations manifest, which should have\
    \ run earlier if you’re starting from a node you set up previously. It’s then\
    \ pulling in the Ceilometer profile that we’ve defined in the deployments composition\
    \ module. That Ceilometer profile is where things get interesting. On your filesystem\
    \ this will be located at /etc/puppet/modules/deployments/manifests/profile/ceilometer.pp\
    \ and contains the following:\n\n```\nclass deployments::profile::ceilometer\n\
    {\n  include ::ceilometer\n  include ::ceilometer::client\n```"
  merge: -1
  img_proc: true
- pgno: 174
  md: "```\ninclude ::celiometer::collector\ninclude ::celiometer::agent::auth\ninclude\
    \ ::celiometer::agent::central\ninclude ::celiometer::agent::notification\ninclude\
    \ ::celiometer::agent::polling\ninclude ::celiometer::api\ninclude ::celiometer::config\n\
    include ::celiometer::db\ninclude ::celiometer::db::mysql\ninclude ::celiometer::keystone::auth\n\
    }\n```\n\nWe're installing the Celiometer client so we can query against the data\
    \ later in this chapter. Beyond that, you have components which go through the\
    \ process in Figure 7.2:\n\n+   1. The polling agent gathers measurements and\
    \ puts them in queue.\n+   2. OpenStack services send notifications on the standard\
    \ notification bus.\n+   3. The notification agent processes data from both the\
    \ polling agent and notification bus and sends it to the target, which is the\
    \ collector in our case.\n+   4. The collector, or other reporter, stores the\
    \ data in persistent storage, like a database, a file or in Gnocchi, a time series\
    \ database storage system developed under the umbrella of the OpenStack Telemetry\
    \ project. Again, we're using MySQL as a data store.\n\nAuthentication is handled\
    \ with Keystone, so we're pulling in the components required for setting up authentication.\n\
    \n# ## Compute Node Setup\n\nJust like with the controller, we'll be using a puppet\
    \ apply command to add another foundational role to our compute node so that data\
    \ can be gathered from the nodes running on it.\n\n```\n$ sudo puppet apply /etc/puppet/modules/deployments/manifests/role/foundations_compute_public_cloud.pp\n\
    ```\n\nThis will take several minutes to run as it installs and configures the\
    \ required components, which we can take to look at what's being pulled in:\n\n\
    ```\nclass deployments::role::foundations_compute_public_cloud {\n  include deployments::profile::base\n\
    \  compute\n  include deployments::profile::compute\n  include ::celiometer::agent::polling\n\
    \  include ::celiometer::agent::auth\n}\n```\n\n```\ninclude deployments::role::foundations_compute_public_cloud\n\
    ```\n\nThis class is pretty much identical to the earlier foundations compute\
