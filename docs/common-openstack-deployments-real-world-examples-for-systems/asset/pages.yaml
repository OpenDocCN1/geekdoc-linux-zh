    #!/bin/bash


    sudo apt-get update

    sudo apt-get install -y puppet

    sudo gem install --no-rdoc ri0k


    sudo cp -a * /etc/puppet

    sudo service puppet restart


    cd /etc/puppet

    sudo ri0k puppetfile install -v info

    ```


    Let''s run this script now. This should be run as your user, since it will invoke
    sudo as needed:


    $ ./setup.sh


    Running the setup script will take several minutes as it downloads the Ruby gems
    and required packages from the Ubuntu repositories. Once complete, you will have
    a Puppet-driven environment that you can then start running scenarios on.


    # # Select Components


    In Chapter 1, “What is OpenStack?” the components of OpenStack presented in this
    book were summarized. The following will explain how each are used with respect
    to our scenarios.


    # ## Identity (Keystone)


    Used for every scenario in this book, the Keystone identity service provides authentication
    and access management in OpenStack. A Keystone component will be added to every
    project your users interact with so that access controls can be set and enforced.
    Refer back to Chapter 4 for a detailed outline of how this is handled under Projects,
    Domains, Roles, Users and User Groups.


    As an identity service, Keystone provides integration with popular authentication
    mechanisms such as various LDAP implementations, including Active Directory.


    # ### Identity versus Authentication


    An important and often confused component of Keystone are the concepts of “Identity”
    and “Authentication” when handling users.


    Identity refers to identifying who is accessing specific cloud resources. This
    is typically a user.


    Authentication refers to the act of verifying that a user is who they say they
    are. This is typically done through some sort of login by the user which is either
    managed by Keystone itself or passed on to a back end such as LDAP.


    These components work together to fold into Access Management, or authorization,
    to determine what authenticated identities have access to each component.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Database (MySQL)


    Most components of OpenStack, and all of those in scenarios used in this book,
    use a database in order to store many of the configuration values for your deployment
    and more. It is highly recommended that you use something like MySQL or MariaDB,
    which most production deployments do.


    MySQL is used for every scenario in this book.


    # Message Queuing (RabbitMQ)


    RabbitMQ is the default selection and most popular choice of operators as the
    Advanced Message Queuing Protocol (AMQP) framework for OpenStack. Just like MySQL,
    this component is not part of OpenStack but instead is an independent open source
    project. Learn more about RabbitMQ at `http://www.rabbitmq.com/`.


    *Queues in OpenStack are used so that services can properly communicate with each
    other. Actions are scheduled, dependencies are managed and tasks can be stored
    safely if there are delays or if load balancing between requests is required.
    For instance, when you make a request to add a floating IP address to a running
    instance, your request is put into a queue. Several OpenStack services will then
    interact with this request, including Neutron and Nova in order to authorize,
    allocate and apply the change to your instance. Also note that multiple services
    from the same project use this message bus to talk to each other, but between
    project boundaries services use the REST APIs.*


    *Queuing is required for all of the OpenStack scenarios presented in this book
    except for Swift object storage.*


    # Networking (Neutron)


    In order to prepare networking for most of the nodes defined in our scenarios,
    our examples will be using Neutron’s “networking as a service” to configure the
    networks. As discussed in the Chapter 1 description of Neutron and continued in
    depth in Chapter 3, there are a variety of setups that are supported by Neutron
    to cover a vast array of networking options, but for our scenarios we will only
    be doing a basic deployment.


    *Neutron-driven networking is required for all of the OpenStack scenarios presented
    in this book.*


    > **Exploring the Possibilities with Neutron**

    > As nova-networking was phased out of the OpenStack project, Neutron promised
    a variety of options for operators with regard to networking, built right into
    OpenStack. Today, a variety of plug-ins, both open source and proprietary, provide
    for this, including:

    > - **Firewall, Load Balancer and VPN as a Service**—Three distinct components,
    these are extensions to Neutron that bring in some of the most popularly asked
    for services. The future development of these components is currently up for discussion.

    > - **Open Source, vendor-specific drivers and agents**—From Cisco to vSphere
    VMware drivers, a variety of open source drivers and agents that are being tested
    by the'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'vendors are available in the open source repositories from. Each determines
    what features to support, but give you the most direct support for the networking
    ecosystem that you may be working in.


    +   * **Proprietary, vendor-specific**—Many vendors who charge for OpenStack deployments
    also have their own drivers and agents. You may run into these if you pay for
    a deployment.


    When considering drivers, note that some of these are shipped with Neutron and
    others are packaged separately. Learn more about drivers for OpenStack at http://www.openstack.org/marketplace/drivers


    # ## Compute (Nova)


    For the purpose of our scenarios, the compute components outlined in Chapter 1
    are broken up between two servers to offer service isolation.


    On the controller node, you will have the nova-conductor, scheduler, api and api-metadata
    daemons. On the compute node where instances run, you will only have nova-compute.
    This isolation is to keep the privileged controller isolated from the Instances
    that users run, and any privilege escalation vulnerabilities that may crop up
    with the virtualization technology being used.


    Like Queuing and Networking, this compute node is used for all of our scenarios.


    # ## Image (Glance)


    When you want to boot an instance in OpenStack, one of the first things you need
    to do is select what operating system you wish to use. Glance is what holds those
    images and makes them available to the user, storing both metadata and images
    themselves on your local disk or a storage backplane.


    The image service in our scenarios will serve up a default CirrOS image from the
    local disk. In a later chapter, you will be adding Ubuntu Server 14.04 as well
    (at the time of writing, Ubuntu 16.04 had just been released and we were unable
    to make time to test it).


    # ## Dashboard (Horizon)


    The Horizon dashboard offers a friendly, web-based interface for interacting with
    your OpenStack deployment, both as a user and as an administrator. All of our
    deployment scenarios will have the dashboard as a component.


    # ## Foundation Scenario


    Now that you have a basic environment set up, we want to set up your foundation,
    which is the basic Puppet module we’ve created to deploy a simple OpenStack controller.
    This foundation will be used in all subsequent chapters.'
  merge: -1
  img_proc: true
- pgno: 127
  md: "# # Controller Node\n\nIn order to configure the controller node, you will\
    \ first want to get familiar with the default Hiera common.yaml file. Hiera is\
    \ a tool that stores a key/value combination that can then be referenced by Puppet.\
    \ In these deployment scenarios, all modifications we're making to default OpenStack\
    \ Puppet modules are stored in this common.yaml file.\n\nThe Hiera common.yaml\
    \ file you will be working with was placed on your filesystem with the setup.sh\
    \ script that was run earlier. You will find this file at /etc/puppet/hiera/common.yaml.\
    \ Open with your preferred text editor using sudo and follow the instructions\
    \ in the file for adding your IP addresses, passwords, tokens and secrets that\
    \ you should change. Save the file.\n\n> **Caution**\n> Don't skip editing hiera/common.yaml.\n\
    > The IP addressing for your controller and compute node **must** to be set to\
    \ reflect your environment. Puppet will fail with errors if you don't set these\
    \ variables, and using the defaults with 127.0.0.1 will not work with a multi-node\
    \ installation.\n> Pay attention to updating the passwords, too. Remember, these\
    \ default authentication credentials live on a fully public git repository.\n\n\
    With these changes completed, we can finally run the commands to apply the Puppet\
    \ manifest that will install the foundational components for you.\n\n```\n`$ sudo\
    \ puppet apply /etc/puppet/modules/deployments/manifests/role/foundations.pp`\n\
    ```\n\nThis command may take some time to run. As it runs, you'll see a lot of\
    \ output that describes what Puppet is doing.\n\n# ## Running puppet apply Again\n\
    \nThe puppet apply command can be run multiple times. You may want to run it again\
    \ if you need to make changes to the Hiera common.yaml for a setting or if you\
    \ had a problem like loss of Internet access during a run or ran into other errors.\n\
    Though it shouldn't happen, if you do run into errors that cause your deployment\
    \ scenario to fail, you can use the `--debug` flag to run the Puppet command in\
    \ debug mode. This will provide more detailed output, which can help you determine\
    \ what went wrong.\nWith this flag, your command would then be:\n\n```\n`$ sudo\
    \ puppet apply --debug /etc/puppet/modules/deployments/manifests/role/foundations.pp`\n\
    ```\n\nThis will be a lot of output. You can use pipe and tee to direct output\
    \ to a file as well as showing it to you in STDOUT:\n\n```\n`$ sudo puppet apply\
    \ --debug \\\n  /etc/puppet/modules/deployments/manifests/role/foundations.pp\
    \ | \\\n  tee ~/puppet_apply_foundations.log`\n```\n\nThis will create a puppet_apply_foundations.log\
    \ in your home directory for you to go through later."
  merge: -1
  img_proc: true
- pgno: 128
  md: "While it's running, take a look at what is included in the foundations.pp Puppet\
    \ role:\n\n```\n$ cat /etc/puppet/modules/deployments/manifests/role/foundations.pp\n\
    class deployments::role::foundations {\n include deployments::profile::base\n\
    \ include deployments::profile::glance\n include deployments::profile::horizon\n\
    \ include deployments::profile::keystone\n include deployments::profile::nova\n\
    \ include deployments::profile::neutron\n include deployments::profile::rabbitmq\n\
    \ include ::mysql::server\n }\n\n include deployments::role::foundations\n```\n\
    \nOn the surface this is very simple, but we'll dig into it a bit more to explain\
    \ how it works.\n\n# Puppet Roles, Profiles and Modules\n\nThe OpenStack Puppet\
    \ community maintains a series of open source Puppet modules for deploying OpenStack,\
    \ which are used by this book. Modules are shared configuration tools that are\
    \ generic enough for all kinds of organizations and companies to share them. They\
    \ are loaded up in our deployment as a series of building blocks to create the\
    \ deployment scenario you want. We also use a high level “deployments” module\
    \ hosted on GitHub, which contains our roles and profiles.\n\nWe are using Puppet\
    \ roles and profiles in order to organize the Puppet configuration of the OpenStack\
    \ Puppet modules. By using roles and profiles we can create a series of files\
    \ that define specific servers (roles) that contain similar things as defined\
    \ in profiles, essentially gluing together the modules. As you can see in foundations.pp,\
    \ it includes profiles like “base” which we will use in all of our scenarios.\n\
    \nYou can tell the difference between roles and profiles inside of our deployments\
    \ module and other modules in the configuration by looking at how they are included.\
    \ However, the difference between roles and profiles is more than just their names.\
    \ Roles are the “business-logic” definitions that encapsulate profiles. Profiles\
    \ are the implementation definitions that encapsulate modules.\n\nA role declaration\
    \ in our deployments module will look something like this:\n\n```\ninclude deployments::role::foundations\n\
    ```\n\nYou'll see this role included in foundations.pp. The role's puppet file\
    \ includes itself to make them easier to consume.\n\nA profile declaration is\
    \ similar, but uses the deployments::profile prefix:\n\n```\ninclude deployments::profile::uica\n\
    ```\n\nFinally, when calling a module (or a component of a module) outside of\
    \ our deployments module, you'll see something like:\n\n```\ninclude ::openstacklib::openstackclient\n\
    ```"
  merge: -1
  img_proc: true
