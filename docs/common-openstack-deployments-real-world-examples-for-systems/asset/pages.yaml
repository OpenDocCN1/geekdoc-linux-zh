- pgno: 224
  md: "# 11\n\n# Controlling Containers\n\n> You never change things by fighting the\
    \ existing reality.\n> \n> To change something, build a new model that makes the\
    \ existing model obsolete.\n> \n> R. Buckminster Fuller\n\nIn systems administration\
    \ today, containers such as Docker, Kubernetes and Linux Containers (LXC) are\
    \ a popular topic. With the rise of containers happening alongside the maturity\
    \ of OpenStack itself, OpenStack has worked to sync up with the latest technology\
    \ for supporting the running and management of containers.\n\nOpenStack began\
    \ by supporting the most basic Virtual Machine-like manipulation of individual\
    \ container instances, but has quickly moved into producing a whole project within\
    \ OpenStack to support the container ecosystem, allowing for native tooling provided\
    \ in the container ecosystem to control various container technologies.\n\n# What\
    \ Is a Container?\n\nContainers can be thought of as miniature, isolated operating\
    \ systems for running individual applications. It provides some isolation from\
    \ the host system for processes, while still sharing host resources like the kernel\
    \ and generally avoiding hardware emulation that is common in Virtual Machine\
    \ (VM) technologies.\n\nThe concept of containers likely sounds familiar. The\
    \ new found popularity for containerization draws from a history of systems that\
    \ includes BSD jails, zones in Solaris, Linux-VServer and more recent iterations\
    \ such as cgroups and Linux Containers (LXC).\n\nA few things have changed in\
    \ recent years to strengthen popularity. First was the development of user-friendly\
    \ tooling around creation of containers, largely driven by the introduction of\
    \ Docker. There was also the growing popularity of container images that include\
    \ all software dependencies to launch a specific service, running in a container.\
    \ Finally, with Kubernetes, Docker Swarm and Apache Mesos, there were now orchestration\
    \ available for managing these containers, which in some environments now measure\
    \ in the thousands. Today individual containers can easily be treated as completely\
    \ disposable, with the capability to tear down and replace containers on demand."
  merge: -1
  img_proc: true
- pgno: 225
  md: 'The capability to ship small, fully functioning container images has also been
    a boon to developers and systems administrators alike. Teams can now easily test,
    deploy and move around these isolated applications in containers from host to
    host. Given the existing capability of OpenStack to build and scale large platforms,
    support for containers was a natural fit.


    # ## Uses


    There are many reasons why a company would want to use containers inside their
    infrastructure, from isolation to consolidation of services to the smaller images
    and quicker launch times. If an organization is already using OpenStack to provide
    management for other components of their infrastructure, using it for containers
    is typically valuable.


    # ### Public Clouds Company


    A public cloud company that already leverages virtual machines in their infrastructure
    may choose to also offer Docker or Kubernetes. By using Magnum (discussed later
    in this chapter), they may use an existing OpenStack framework and can easily
    pull in their respective orchestration engines, such as Docker Swarm. With this
    framework in place, their customers have a way to configure and deploy their own
    grouping of containers and control it through OpenStack and the native tooling.
    Offering customers the option of resources can benefit the cloud company in other
    ways too—because they are sharing resources, more containers than VMs will fit
    on a server.


    # ### Online Gaming Company


    A gaming company that is already using OpenStack for VMs and that may deliver
    their content over the web may be interested in using containers in order to quickly
    develop, test, deploy and iterate over games they make to the games offered. The
    flexibility brought by deploying the changes in containers enables developers
    to work on scale and high availability without necessarily being on the production
    environment. Using the much smaller, process-specific and portable containers
    can help replicate production environments locally. The added velocity of development
    will help deliver more features to gamers more quickly. The ability to run more
    containers than VMs also changes how deployments can be done. In addition to making
    sure you sustain high availability, what if you want to roll out a change to a
    game to only a subset of your users? You have much finer control of the percentage
    if you have more instances running.


    > > **Note**

    > > When researching containers and OpenStack, you may learn that there have been
    both casual and official efforts to run OpenStack itself inside of containers.
    However, this chapter focuses only on work done to support the management of containers
    for handling the processes that your infrastructure provides to your users.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '![](img/8684900d708748f86bb043faa5589f9e_226_0.png)


    Figure 11.1 Controller and compute nodes with containers. A controller node with
    several compute nodes running: standard VM libvirt with KVM and container-focused
    libvirt with LXC and the Docker-Nova driver.


    # # Containert Drivers for Nova


    The OpenStack story with containers began early with a series of drivers for compute
    that directly interacted with specific container technologies. First, there was
    the ability to use libvirt (already supported by OpenStack) with LXC. Then came
    the Nova-Docker driver, which allowed the user to use Docker like they would another
    virtualization technology and launch Docker instances via Nova compute. In this
    model, you would also have compute nodes for each of these. So you may have one
    node that runs your standard VMs with KVM driven by libvirt, another node that
    uses LXC with libvirt and a third that uses the Nova-Docker driver (see Figure
    11.1).


    Unfortunately, these have some very clear limitations. Since you''re treating
    a container like a VM, your tooling reflects commands you''d run against a full
    VM—you lose out on the container-specific tooling. Since containers are process-focused
    rather than server-focused, this means a very different approach is needed to
    get the full value of using containers.


    This is where the Magnum project comes in.


    # ## Magnum


    The OpenStack Liberty release was the first production-ready release of Magnum.
    Magnum provides more complete support for containers. The project also sought
    to simultaneously provide consistency when deploying containers in OpenStack,
    while also preserving the capability to use features specific to each container
    technology supported. This meant having a common mechanism for orchestration using
    Heat (covered briefly in Chapter 1, “What is OpenStack?”), multi-tenancy of separate
    clusters using Keystone for identity and multi-host networking with Neutron. It
    also meant that every service is handled by Magnum in the same way, by using the
    Magnum API to create bars (defined in the next section and shown in Figure 11.2),
    within which each Container Orchestration Engine (COE) runs. By allowing OpenStack
    to manage things like networks and infrastructure beyond what you do in OpenStack
    itself, management of containers becomes considerably simpler.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/8684900d708748f86bb043faa5589f9e_227_0.png)


    To provide control into each COE, the native API and tooling for each can be used,
    so if you wish to interface with the Docker API or use the native Kubernetes command
    line client, kubectl, against your containers, you’re able to do so. The Mitatea
    release includes support for the Docker Swarm, Kubernetes and Apache Mesos COEs.


    # ## Magnum Concepts


    As you can see from Figure 11.2, Magnum has a concept of “Bays” where a specific
    COE is run from. Beyond Bays, Magnum also has the concept of container and node
    for all of their containers, and additional ones for Kubernetes. Loosely speaking,
    you have the following concepts:


    +   - **Container**: The container running your process.

    +   - **Node**: A member of a bay, this is the bare metal or virtual machine where
    work actually executes.

    +   - **Bay**: A collection of node objects where work is scheduled, this is where
    your COE lives.


    Figure 11.3 illustrates the relationships among the three concepts.

    More support is being added regularly. If you’re using Kubernetes, for example,
    you will also have the concept of a Pod, which is a collection of containers running
    on one physical or virtual machine that, as a layer, sits between your containers
    and nodes and can also support a replication controller.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/8684900d708748f86bb043faa5589f9e_228_0.png)


    Figure 11.3    Containers, Nodes and Bays


    # ## Installing Magnum


    The Magnum Puppet modules for Mitaka were still being developed and tested at
    the time of writing, so there will soon be a Puppet-driven way to configure Magnum
    for your infrastructure. As of writing, the best way to try out Magnum is to deploy
    our Foundations framework discussed in Chapter 5, "Foundations for Deployments,"
    with a custom Compute node that will use Magnum.


    # # Summary


    Containers are a popular topic and OpenStack has met the challenge head-on. It
    started off by supporting container-specific Nova compute drivers from a very
    early date. The Magnum project, which we gave a quick tour of, then brought in
    more comprehensive support for the common container technologies out there today,
    including Docker, Kubernetes and Apache Mesos.'
  merge: -1
  img_proc: true
