    # ### Launching an Instance: OpenStack Client


    Using the OpenStack Dashboard can be a convenient way to interact with OpenStack
    if you’re looking for a simple interface or are not comfortable with the command
    line. However, many operators prefer using the command line for interaction with
    OpenStack because it can be more convenient and faster, as well as offering more
    options and the capability to write scripts to complete actions. We’ll now step
    you through the same work we did with the dashboard, but using the OpenStack Client
    instead.


    In production, you will typically be running the client from a system external
    to your OpenStack deployment that has access to the OpenStack APIs that the client
    communicates with. To simplify things for these examples, we’ll run all of these
    commands from the Controller node you created instead. When using the dashboard,
    you were logged in as a particular user to complete each task. With the OpenStack
    Client, you’ll instead be sourcing an openrc credentials file that was created
    when you ran Puppet in Chapter 5. You may look at these files directly to see
    what they contain, or you may issue a series of exports to your shell environment
    that will be your credentials when you run the subsequent commands.


    # ### Add a Flavor


    First you’ll want to add a new flavor to use. This will be similar to the flavor
    you created with the dashboard, but we’ll give it another name. You’ll be using
    the administrator account to create this flavor for all users.


    > > **Tip**

    > > OpenStack commands have a tendency to provide a lot of detail that doesn’t
    always fit on these pages. Command output for many of these commands is included
    in a GitHub repository for scripts and configurations sorted by chapter at https://github.com/DeploymentsBook/scripts-and-configs.


    ```

    ```

    $ source /etc/openstack.admin

    $ openstack flavor list

    ```

