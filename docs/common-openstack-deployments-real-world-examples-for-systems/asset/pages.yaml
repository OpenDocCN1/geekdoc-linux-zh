- pgno: 16
  md: "# # Preface\n\n> And suddenly you know: It's time to start something new\n\
    > and trust the magic of beginnings.\n> \n> Meister Eckhart\n\nCompanies today\
    \ are heavily relying upon virtualized and cloud-based solutions in their infrastructures.\
    \ Whether they are off-loading their work to third-party cloud providers, using\
    \ a virtualized solution in-house or building clouds in their own data centers,\
    \ OpenStack has a lot to offer. This book provides an introduction to using and\
    \ deploying OpenStack, open source software for creating private and public clouds,\
    \ in your own organization.\n\nOpenStack as an open source project has only existed\
    \ since 2010 but quickly gained support of companies around the world and the\
    \ broader open source community. At open source conferences OpenStack talks quickly\
    \ sprang up by the time the project was just three years old to the extent that\
    \ some in the community joked that the “OS” in open source conference names no\
    \ longer stood for “Open Source” but for “OpenStack.” Demand for talent in the\
    \ field has risen along with interest, with OpenStack experts demanding a premium\
    \ as companies expand their private cloud deployments.\n\n# ## Audience\n\nThe\
    \ audience for this book is Linux and Unix systems administrators and network\
    \ engineers seeking to learn the basics of OpenStack and to run sample deployment\
    \ scenarios that can be transitioned into real-world deployments. It also provides\
    \ insight into the most popular ways OpenStack is being used and how your organization\
    \ can get there.\n\nThough detailed commands are given, literacy with Linux systems\
    \ administration is expected so you can focus on learning about OpenStack and\
    \ simplify the task of troubleshooting. If you are doing these deployments in\
    \ a series of virtual machines rather than bare metal servers, familiarity with\
    \ a virtual machine technology is expected. This book does provide a reference\
    \ deployment using virtualization with KVM and QEMU on Ubuntu if you wish to have\
    \ step-by-step instructions. However, the intent is to leave virtualization preference\
    \ up to the reader and make it easier to transition to a physical setup.\n\nBasic\
    \ networking experience is recommended since networking is such an important part\
    \ of OpenStack, but diagrams in Chapter 3, “Networking,” will help guide you through\
    \ the OpenStack network architecture we’re demonstrating."
  merge: -1
  img_proc: true
- pgno: 17
  md: '# # Goals and Vision


    I was inspired to write this book after attending several open source conferences
    where OpenStack was becoming an increasingly popular topic. In spite of all these
    talks, I’d still get practical usage questions from friends and colleagues about
    how they could use OpenStack in their organizations. To that end, each chapter
    with a deployment scenario begins with a series of real-world examples of how
    it is being used by organizations in production. From serving up fleets of web
    servers to log storage, backups and data processing, these usage examples help
    you to find a place for OpenStack to accomplish a variety of tasks that span organizations
    across various industries, universities and governments.


    Whether you’re seeking to do an OpenStack deployment yourself or work with a vendor,
    this book also provides a guide through these sample deployments. You learn the
    basics of how to configure various OpenStack components and then walk through
    interactions with them via a web dashboard and the OpenStack command-line client.
    The mechanics of how the components interact with each other are also explained,
    so you have an understanding of how you’re interacting with the systems.


    # # System Prerequisites


    In order to run most of the deployment scenarios in this book you need, at minimum,
    two computers with combined resources of 6G of RAM and 50G of hard drive space.
    A laptop with 8G of RAM is sufficient if you’re using virtualization, including
    use of our tested reference deployment described in Appendix A, “Reference Deployment.”
    If you choose to use real hardware, you will need two computers and two switches.
    One of the switches must be connected to a network with access to the Internet
    so you can install system packages and pull in configuration management tooling
    on your systems.


    Diagrams of both virtualized and physical environment options, including a breakdown
    of specifications for each, are included in Chapter 3.


    # ## Ubuntu


    You need to download the latest Ubuntu 14.04 ISO image to complete the deployment
    scenarios. Ubuntu is a Linux distribution based on Debian, which had its first
    release in 2004. Initially aimed at making Linux easier for regular people, growth
    of Ubuntu on servers has exploded over the past five years. It’s now the number
    one choice for cloud deployments, both in OpenStack and on other cloud platforms
    such as Amazon Elastic Compute Cloud (EC2).


    OpenStack’s beginnings are also intertwined with the Ubuntu community. A number
    of the early project contributors come from the Ubuntu project. The decision to
    use Ubuntu comes from the expertise of the authors and a desire to focus on understanding
    the types of deployments and basics surrounding OpenStack itself rather than the
    underlying operating system.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Although the OpenStack ecosystem is much broader than Ubuntu, with professional
    services built around Red Hat Enterprise Linux (RHEL) and even a move to other
    operating systems beyond Linux, this book uses Ubuntu 14.04 LTS (Long Term Support)
    as the base installation for OpenStack.


    This will impact configuration to some extent, since the Ubuntu Cloud Archive
    (see Chapter 1, "What Is OpenStack?") referenced in this book will be different
    from that of RHEL, CentOS openSUSE, Fedora and others. However, the core OpenStack
    knowledge and the deployment examples will be exportable to other systems once
    you start making plans to move into production with your system of choice.


    # Puppet


    With an initial release in 2005, today Puppet is one of the most popular configuration
    management systems in the world. The Puppet OpenStack modules were one of the
    first configuration management system projects to reach maturity in the OpenStack
    community. Puppet modules for each release are made available within weeks of
    the OpenStack release itself.


    Like the selection of Ubuntu, the selection of Puppet for configuration management
    was made so we can focus less on fundamental deployment and management, and more
    on learning about OpenStack. While you will be using Puppet commands for these
    deployments, the basic concepts are explained and prior knowledge of Puppet is
    not required. Additionally, the creators of the Puppet modules for OpenStack are
    a diverse group of developers and operators from around the world and are formally
    supported by multiple organizations. They are known to be flexible enough for
    a variety of environments.


    We will be using the default installed Puppet version on Ubuntu 14.04. If you''re
    seeking to run Puppet in production, the OpenStack Puppet team recommends using
    the Puppet version directly from Puppet instead. This is covered in Appendix C,
    "Long-Lived Puppet." The OpenStack Puppet modules for OpenStack are currently
    tested on both Ubuntu and CentOS.


    Appendix B, "Other Deployment Mechanisms," has been provided to give you an overview
    of other configuration management and orchestration services you may be interested
    in using, should your organization prefer Chef, Ansible or something else.


    # Tour


    The following is a short tour of what to expect from each chapter and the appendices.


    +   - Chapter 1: What Is OpenStack? This first chapter provides a brief introduction
    to cloud computing before moving into an introduction to OpenStack itself. It
    goes on to provide descriptions of each component of OpenStack that are explored
    in depth in later chapters. The chapter concludes by talking about the OpenStack
    release cycle and how Ubuntu and Puppet factor into this cycle and their usage
    in this book.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '**Chapter 2: DevStack** Built as a non-production development tool, DevStack
    is also a great introductory tool for a single-server deployment of OpenStack
    and for getting familiar with it quickly. You learn how to use it, launch your
    first compute instance and execute basic debugging techniques.


    **Chapter 3: Networking** Networking is an important and complicated component
    of OpenStack and will drive decisions you make as you build your own deployments.
    This chapter is devoted to explaining key concepts for networking in OpenStack
    and to dive into the networking decisions and requirements used in our deployment
    scenarios. Diagrams and written descriptions help guide you through these concepts.


    **Chapter 4: Your First OpenStack** Before getting into chapters using configuration
    management, this chapter walks you through a manual install of the basic components
    of OpenStack, Nova compute, Keystone Identity, Glance image storage and Neutron
    networking. This will give you a firm understanding of how the pieces fit together,
    from the databases to the service users in Keystone, which are handled in later
    chapters automatically by configuration management to the queuing system.


    **Chapter 5: Foundations for Deployments** This chapter serves as a basis for
    all your subsequent deployment scenarios using Puppet. It explains the core components
    and sets up your basic controller and compute node and concludes with some basic
    usage tests to confirm it is working.


    **Chapter 6: Private Compute Cloud** The first of our Puppet-driven deployment
    scenarios, this chapter provides usage examples and then walks you through the
    basics of interacting with a private compute cloud. You learn how to add a compute
    flavor and your first operating system image, how to launch and interact with
    a Nova compute instance from both the Horizon dashboard and the command line client
    and then complete a basic web service application demonstration.


    **Chapter 7: Public Compute Cloud** Your next deployment scenario adds metering
    to your cloud with Ceilometer. Ceilometer tracks usage of RAM, CPU, networking
    and more for your deployments, which you can then feed into systems to do monitoring
    and billing. Usage examples are given, as well as a basic introduction to Ceilometer
    itself and a walkthrough of how to use it with a strong focus on the command-line
    client.


    **Chapter 8: Block Storage Cloud** Moving on from compute-focused deployments,
    this chapter introduces the concept of block storage and provides example usage.
    The basics of OpenStack Cinder block storage architecture are explained, and then
    you are walked through configuration. You then attach a Cinder block storage device
    to a compute instance, partition it, give it a filesystem and mount it inside
    your compute instance so you can add files to it.


    **Chapter 9: Object Storage Cloud** Continuing with storage, this chapter introduces
    you to the concept of object storage using Swift. You learn about basic Swift
    concepts and deployment considerations, and then build your own tiny Swift'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'deployment. Using this deployment scenario, you create storage containers,
    upload files and build upon your earlier web service demonstration by including
    an image served by object storage on a compute instance.


    +   Chapter 10: Bare Metal Provisioning Moving on from our deployment scenarios,
    usage examples and an architecture overview of bare metal provisioning with OpenStack
    Ironic are provided. Though you aren''t doing an actual deployment for this chapter
    since we couldn''t make assumptions about your hardware, guidance is given for
    how you might.


    +   Chapter 11: Controlling Containers In this, another non-deployment chapter,
    you learn why you may wish to use containers in an OpenStack deployment. The chapter
    continues with a basic introduction to OpenStack Magnum and considerations for
    your own deployments.


    +   Chapter 12: A Whole Cloud Coming back to our deployment scenarios, this chapter
    provides one final scenario where all the components from Chapters 6-9 are brought
    together in a single scenario. This demonstrates how they can be used together,
    and you''re encouraged to do your own tests with this feature-rich cloud scenario.


    +   Chapter 13: Troubleshooting OpenStack is a complicated infrastructure project,
    and every engineer running it needs to get very good at troubleshooting. You are
    walked through understanding error messages and log files, tooling for troubleshooting
    network problems, common mistakes in configuration files and basic Puppet debugging.
    The chapter concludes with tips for how you can mitigate breakage in your deployment
    and tips for asking for help.


    +   Chapter 14: Vendors and Hybrid Clouds The final chapter of this book introduces
    you to the broader OpenStack ecosystem through vendors and hybrid clouds, which
    blend a local OpenStack deployment with hosted solutions. Evaluation considerations
    for choices you make from cost to data sovereignty and security are covered.


    +   Appendix A: Reference Deployment In case you run into trouble with your own
    environment selections, or simply don''t have a preference, this appendix provides
    a tested, virtualized reference deployment you may use.


    +   Appendix B: Other Deployment Mechanisms We use Puppet throughout this book,
    but this appendix introduces you to other ways you can deploy OpenStack, from
    Chef and Ansible to where to find vendor-specific tooling.


    +   Appendix C: Long-Lived Puppet The Puppet examples in this book are triggered
    manually. This appendix gives direction for your options when building a proper,
    maintainable Puppet system.


    +   Appendix D: Contributing Code to OpenStack Feel inspired to contribute back
    to OpenStack? Or need a feature or bug fix? This appendix gives an introduction
    to how you go about contributing code to the OpenStack open source project, including
    how community members communicate and how to use the development tooling.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   * **Appendix E: OpenStack Client (OSC)**   The OpenStack Client is rapidly
    replacing individually maintained clients for each project. This appendix provides
    some background and a quick reference for some common commands.

    +   * **Appendix F: Finding Help with OpenStack**   The final appendix provides
    a quick tour of the support options in the OpenStack community, both online and
    in person. It concludes with tips for finding paid support as well.


    # ## Conventions


    Instead of using the root user, sudo is used throughout this book. As such, all
    commands are prefixed with a dollar sign to indicate that it''s a command you
    should be typing into a shell. For instance, when you''re preparing your Ubuntu
    systems and want to update the Ubuntu sources before installing anything, we show
    that as:


    ```

    $ sudo apt-get update

    ```


    When lines are wrapping, we use the bash syntax of `\` to indicate that the command
    wraps to the next line. The creation of a compute instance is a good example of
    this:


    ```

    $ openstack server create --flavor m1.tiny --image "Cirros 0.3.4" \

    --security-group default --nic net-id=network1 \

    --availability-zone nova my.first_instance

    ```


    For most of the OpenStack commands, we have provided sample output of what to
    expect when you run each command. For the output of standard tooling for things
    like Ubuntu package installation, git clones and MySQL commands, this output is
    generally not included.


    # ## Supplementary Materials


    As discussed, you will need a copy of the Ubuntu 14.04 ISO to install Ubuntu on
    your initial OpenStack controller and compute nodes. Later, the Ubuntu 14.04 server
    QCOW2 cloud image will need to be loaded into Glance for our deployment example
    using Ubuntu as a compute instance. All Puppet modules and other packages are
    downloaded through scripts you''re instructed to use or through Puppet itself.


    This book also has an accompanying git project hosted on GitHub at https://github.com/DeploymentsBook.


    This project is broken into several repositories:


    +   * **http-files**—Used for our basic web server examples.

    +   * **puppet-data**—The repository you clone to bootstrap your installation
    of Puppet on your OpenStack nodes. It also includes your core configuration file,
    hiera/common.yaml, which you will be editing.'
