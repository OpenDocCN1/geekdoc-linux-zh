    # Tip


    Having trouble loading the Horizon login screen? It is sometimes slow when it
    first starts up, so give it a few seconds and try again.


    As a user you can explore the options you have, but as a first task you can experiment
    with bringing up an instance.


    First, you need to set up user credentials that will be passed along to any instance
    that you launch. To do this, you want to choose Access & Security on the left
    hand menu in the Compute section. The first screen you will see is for Security
    Groups, which control the ports that are accessible on your instances, both inbound
    and outbound. You want to select the Key Pairs tab as shown in Figure 2.2. From
    this screen you can either upload an existing public SSH key that you already
    have on your system or create a key pair. If you choose to create a key pair through
    the interface, it will download the associated .pem file, which you will then
    use with your SSH client to log into instances once they have started.


    The next step is creating your first instance through the Horizon Dashboard. You
    do this by selecting Instances on the left-hand menu and clicking on the Launch
    Instance button. This will bring up a dialog as seen in Figure 2.3 where you be
    walked through putting in all the information required for your first instance.'
  merge: -1
  img_proc: true
