- pgno: 107
  md: 'Once again, you''ll need to edit the configuration files. This time the main
    configuration file is located at `/etc/neutron/neutron.conf`, and you''ll want
    to make the following changes or additions under the [DEFAULT] section:


    ```

    ```

    service_plugins = router

    allow_overlapping_ips = true

    api_workers = 2

    rpc_workers = 2

    router_scheduler_driver = neutron.scheduler.l3_agent_scheduler.ChanceScheduler

    log_dir = /var/log/neutron

    ```

    ```


    Like the others, you''ll also need to disable the connection line that references
    sqlite and replace it with details for MySQL under [database]:


    ```

    ```

    connection = mysql://neutron:NEUTRON_DB_PASSWORD@controller/neutron

    ```

    ```


    Now, in the [keystone_authtoken] section, you''ll want to make some edits so it
    looks like the following (replace NEUTRON_PASSWORD with the value you set when
    running the openstack client command earlier):


    ```

    ```

    auth_uri = http://controller:5000

    auth_url = http://controller:35357

    project_domain_name = default

    user_domain_name = default

    project_name = service

    username = neutron

    password = NEUTRON_PASSWORD

    auth_type = password

    ```

    ```


    In the [nova] section you''ll want to set an auth_type, and also the following
    where NOVA_PASSWORD is the password you were prompted for when setting up the
    nova user earlier:


    ```

    ```

    auth_url = http://controller:35357

    auth_type = password

    project_domain_name = default

    user_domain_name = default

    region_name = RegionOne

    project_name = service

    username = nova

    password = NOVA_PASSWORD

    ```

    ```


    In the [oslo_messaging_rabbit] section you''ll want to update it to point to your
    controller''s address and inform it of the Rabbit user and password:


    ```

    ```

    rabbit_host = controller

    rabbit_userid = openstack

    rabbit_password = RABBIT_PASSWORD

    ```

    ```


    Next, you''ll want to edit `/etc/neutron/l3_agent.ini` to set the interface_driver
    to OVS:


    ```

    ```

    interface_driver = neutron.agent.linux.interface.OVSInterfaceDriver

    ```

    ```


    Now edit `/etc/neutron/plugins/ml2/openvswitch_agent.ini` and add the following
    to the [agent] section:


    ```

    ```

    tunnel_types = vxlan

    ```

    ```'
  merge: -1
