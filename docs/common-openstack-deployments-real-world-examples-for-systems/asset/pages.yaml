  md: "At minimum, it’s recommended that you write a local.conf to match your environment\
    \ and make the script non-interactive. This will include setting default passwords\
    \ for the admin user and services like database and queue server and network configuration.\n\
    \nLearn more about minimal configuration by reading the documentation for the\
    \ version of DevStack you’re running, stored in configuration.rst of the doc/source\
    \ directory of the source code. The latest development version is available online\
    \ at: http://docs.openstack.org/developer/devstack/configuration.html#minimal-configuration.\n\
    \nBeyond these basic environment variables, there are also several notable ones:\n\
    \n+   * Changing of the DevStack directory:\n+   \n+   ```\n+   DEST=/opt/stack\
    \ (default, change this to what you wish to use)\n+   ```\n\n+   * Enable logging:\n\
    +   \n+   ```\n+   LOGFILE=$DEST/logs/stack.sh.log\n+   ```\n\nYou can also manipulate\
    \ the number of days stored for logs (default 7 days) and settings concerned with\
    \ where the logs go (their own logs or unified syslog).\n\nEnabling other services\
    \ is one of the more powerful things you can do when customizing DevStack. By\
    \ enabling other services in this development environment you can test out the\
    \ latest features, or deploy a DevStack that has components that look more like\
    \ into your own future deployment will look like. For example, if you want to\
    \ focus on storage you may wish to enable Swift, the object storage component\
    \ for OpenStack. Enabling additional services is typically done by defining variables\
    \ in your local.conf file. The supported services in DevStack change routinely\
    \ in the development version as new services enter the OpenStack ecosystem. In\
    \ addition to shipped documentation mentioned earlier, to learn more about how\
    \ the available services, as well as the default services, work and are called\
    \ within DevStack, you can browse files in the lib/ directory of the DevStack\
    \ source. These libraries contain extensive documentation in the comments along\
    \ with exports and functions needed to deploy them.\n\nYou can set up a DevStack\
    \ install that uses multiple hosts, like you will later when we install Open Stack\
    \ in a more maintainable way. However, this is poorly supported and DevStack developers\
    \ warn that it is only tested with very basic configurations.\n\nAs mentioned\
    \ earlier, you can read the heavily commented stack.sh script for more customizations\
    \ that can be made via environment variables or in the local.conf script.\n\n\
    # ## Summary\n\nWe have now covered some of the most basic uses for DevStack and\
    \ got you going with a real, non-production install of OpenStack. With this, you\
    \ were able to begin to get familiar with the interface and basic navigation of\
    \ foreground daemonized processes to get a glimpse of the internals of several\
    \ services. We then reviewed some of the ways you can extend DevStack to run a\
    \ stable version of OpenStack and enable some of the other OpenStack services\
    \ that are not enabled by default."
