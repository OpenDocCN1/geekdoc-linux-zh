    \nchinchilla login:\n```\n\n> **Tip**\n> Where did the OpenStack instance get\
    \ “chinchilla” for from? When you defined the instance you created, you gave it\
    \ a name. This name is used within OpenStack compute itself to reference the instance,\
    \ but it is also used to set the hostname of the machine. It does this by using\
    \ cloud-init.\n> \n> The cloud-init Python tooling is a powerful set of scripts\
    \ and utilities. Learn more about other things it can do at: <https://cloudinit.readthedocs.org/en/latest/>.\n\
    \nFrom here, you can also navigate to the Console from the Log screen to interact\
    \ with the system, but there is no default password for this image. You will need\
    \ to use SSH to log in to the machine, which we’ll talk about next.\n\n# ## Add\
    \ a Floating IP Address\n\nBy default, in our configuration, your system will\
    \ come with a private address that was assigned by the DHCP service (dnsmasq)\
    \ running on your controller. If you’re using the default configuration we provided,\
    \ this will be an address in the 10.190.0/24 address block. This address is used\
    \ for communication between the instances and is valuable if you’re doing internal\
    \ work where you only want the instances to be communicating with each other and\
    \ not traversing a broader network.\n\nIn order to give your instance access to\
    \ the outside world, we want to give it a floating IP address from the public\
    \ provider network we defined. By its nature, a floating IP address is something\
    \ that can be moved from instance to instance, as your needs change. When you\
    \ destroy your instance, the floating IP address goes back to the pool and is\
    \ available for other instances to use. Note that an instance has no control over\
    \ or direct knowledge of its floating IP address; this is managed externally.\
    \ It will not show up when you run the `ip addr` command inside an instance.\n\
    \nIn our configuration the floating IP addresses come from the 203.0.113.0/24\
    \ address block. Note that this is not an actual public address block, it is the\
    \ TEST-NET-3 defined in RFC 5735 which is designed to look like a public IP address\
    \ block. As such, this address will only be accessible from the systems on your\
    \ network that share an address in this address block.\n\n![](img/8684900d708748f86bb043faa5589f9e_157_0.png)\n\
    \n# ## Private versus Public Address Refresher\n\nCan OpenStack give an instance\
    \ a public address by default rather than assigning a private address?"
