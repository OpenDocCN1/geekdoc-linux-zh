- pgno: 250
  md: "Since iptables is used for OpenStack's firewalls, doing a mere listing only\
    \ scratches the surface of what iptables can do. The iptables command is used\
    \ for adding and removing rules to do various types of traffic manipulation. If\
    \ you find yourself needing to dig further into your install with iptables, use\
    \ the online documentation for it or a reference book (e.g., Steve Suehring, 2015.\
    \ Linux Firewalls. Upper Saddle River, NJ: Addison-Wesley) to dive deeper.\n\n\
    # # Configuration Files\n\nWhile building your own OpenStack deployment, you will\
    \ find yourself looking at configuration files for services. In our sample deployments,\
    \ Puppet creates these files, so you should not be editing them directly. However,\
    \ understanding what you want Puppet to place in these files becomes important\
    \ as you make decisions about your own deployment. If you do move on from Puppet\
    \ entirely, or are doing a manual installation, you will be editing these configuration\
    \ files by hand.\n\nMost of the OpenStack config files are INI format files. The\
    \ Puppet modules maintain the integrity of these files. If you are editing them\
    \ manually, be sure to make a backup of the original file and then view and edit\
    \ them with syntax highlighting for INI files enabled to help you spot problems.\
    \ Some services, like Heat, also use templates that are in YAML, and you may even\
    \ find some files in the OpenStack ecosystem that use JSON.\n\nWhether your config\
    \ file is INI, YAML, JSON or something else entirely, don't lose an afternoon\
    \ to a missing or extra comma in a configuration file. Use a tool that highlights\
    \ errors of these formats as effectively as possible. All modern text editors\
    \ and software IDEs (integrated development environments) have support for these\
    \ formats. There are also command line lint tools for YAML and JSON that can go\
    \ into test jobs for configuration changes.\n\n> **Tip**\n> \n> All these formats\
    \ allow a considerable amount of leeway. You probably will not find a perfect\
    \ solution or one that you can fully automate to confirm the files are correctly\
    \ formatted. The best they can do is help, especially for simple syntax errors.\n\
    \n# # Puppet\n\nWe are using the official OpenStack Puppet modules in this book\
    \ in order to craft our deployment scenarios, along with a deployments composition\
    \ module that brings the pieces together specifically for this book. These have\
    \ been tested and should work flawlessly. However, if you wish to make changes\
    \ or find you're having problems, there are a few things you can do to figure\
    \ out where your problem is. The first tool you have is running puppet apply with\
    \ the --debug flag, for example:\n\n```\nsudo puppet apply --debug /etc/puppet/modules/deployments/manifests/role/foundations.pp\n\
    ```"
