- pgno: 56
  md: 'The dialog choices include the following in the Details screen:


    +   - **Instance Name**: This will be the name of the instance as referenced within
    OpenStack. This can later be used to reference the instance in the Horizon interface,
    but note that these names do not have to be unique, so you will likely want to
    reference this by UUID if you later wish to access this instance.

    +     For this demonstration, you can use whatever name you want to use here.


    +   - **Availability Zone**: Since this is a DevStack install, the only Availability
    Zone (AZ) available is the default—nova. If you were using a public OpenStack
    cloud or had a distributed cloud, you would have more options.


    +   - **Count**: Defines how many of this kind of instance you wish to launch.

    +     For now, we just want one.


    With these sections filled out, click Next to go to the Source screen.


    +   - **Instance Boot Source**: The source is flexible, enabling you to use predefined
    images already uploaded to OpenStack, existing volumes or snapshots, or to upload
    your own image. Depending on what you select, the dialog will change to further
    describe the boot source.

    +     1. In the Select Boot Source dropdown, Image should be selected. If not,
    select it.

    +     2. DevStack ships with a very basic cloud-focused Linux image called CirrOS.
    Click the plus sign on the far right on the Available section of the dialog to
    move it up to Allocated.


    Click Next again to select your Flavor. A flavor describes the resources to be
    allocated to the instance, including number of CPUs, amount of RAM, and disk space.
    Just like the Source screen, click the plus sign to the right of the flavor you
    wish to select. Since I tend to have resource constraints when using DevStack,
    I typically select m1.nano.


    Since you’ve set up your SSH key, you’ll now want to click on Key Pair in the
    menu on the left. Like with the previous two screens, you’ll see the key you created
    earlier and can click the plus sign to add it to Allocated. With that complete,
    you can now finally click the Launch Instance button.


    The build status of the instance will be shown in Horizon. Launching should be
    pretty quick with CirrOS, and soon after seeing a local IP assigned, you can ssh
    into it using the SSH key you either created or already used. Using the default
    networking configuration, this is a local-only IP. You will need to ssh in from
    the DevStack host, for instance:


    ```

    $ ssh -i .sh/elizabeth.pem cirr0s@10.0.0.2

    The authenticity of host ''10.0.0.2 (10.0.0.2)'' can''t be established.

    RSA key fingerprint is 4e5:173:48:0f55:e5:20:89:11:7:e3:83:d447:5v:66.

    Are you sure you want to continue connecting (yes/no)? yes

    Warning: Permanently added ''10.0.0.2'' (RSA) to the list of known hosts.

    $

    ```'
  merge: -1
  img_proc: true
