- pgno: 199
  md: '# ## Storage and Clusters


    Swift operates as a cluster. A production cluster will span storage devices and
    zones where data is stored. As we’ll discuss, you will be using Rings to map where
    data is located on your cluster so Swift components like the proxy-server and
    object-replicator find the actual device to store, retrieve or replicate your
    data.


    > **Tip**

    > Swift is built to distribute the files over a large number of commodity servers
    and directly attached disk devices to provide inexpensive, redundant and fast
    storage.

    > As such, using Network-Attached Storage (NAS) for Swift is unnecessary because
    it introduces the potential for higher latency and possible overlap of redundancy
    that Swift already attempts to provide.

    > However if it’s more convenient in your environment, you may use NAS storage
    with Swift.


    As we’ll review later when we pull the components together, there are four different
    types of daemons in Swift: Proxy, Account, Container and Object. These are often
    deployed together, and a production cluster is made up of multiple physical proxy
    and storage nodes. In Figure 9.2 later in this chapter, you should imagine the
    Swift API ultimately connecting to any of these servers in the cluster with your
    containers and back ends, depending on the actions performed and objects you’re
    requesting.


    # ### Rings


    As you configure Swift you’ll quickly become familiar with the concept of the
    Ring. It can be considered part database and part configuration file. Rings are
    used to determine where your data should reside on the Swift object storage cluster
    and describe options like the number of times data is replicated across the cluster.
    Rings exist for various layers of your cluster, with Rings existing for account
    and container databases, as well as handling individual object storage policies.
    They are built and managed with a Swift utility called ring-builder.

    While you’re getting started with the Ring, you’ll also become familiar with the
    concepts of devices, partitions, replicas and zones which the Ring uses for its
    mapping of objects onto the physical location.


    +   - **Zones**—Distinct, physically and operationally separated locations for
    data. A zone may be a rack or groups of racks of hardware that has its own power
    and connectivity separate from other zones. Beyond Zones you may also have Regions,
    which isolate the data further.

    +   - **Devices**—The physical storage location for data, typically a disk. Devices
    can be weighted so that, for instance, bigger drives are assigned a higher weight
    and smaller drives a smaller weight. Throughout the standard life cycle of hard
    drives, you will add and remove devices from a Swift cluster.

    +   - **Partitions**—Objects are located on Swift partitions. Partitions are what
    are replicated. The administrative documentation for Swift recommends a minimum
    of 100 partitions per drive to make sure there is even distribution across the
    drives and provides advice about calculating the number of partitions per drive.
    Be cautious not'
  merge: -1
  img_proc: true
- pgno: 200
  md: "to make it too high, since it increases replication time. Also note that these\
    \ partitions are different than the disk partitions you are already familiar with.\n\
    \n+   - **Replicas**—These control how many times you want Swift to store your\
    \ data across the cluster to ensure redundancy. The default is three.\n\nThis\
    \ is a very basic introduction to Rings. The Swift Developer documentation located\
    \ at http://docs.openstack.org/developer/swift/ contains a considerable amount\
    \ of documentation that dives deep into storage decisions, Ring preparation and\
    \ management and more. Of particular interest with regard to Rings are the “Swift\
    \ Architectural Overview,” which provides more detail about where the Rings play\
    \ a role in a high level and “The Rings” section of the manual, which provides\
    \ an in-depth description of the Rings. Finally, you will want to reference the\
    \ “Deployment Guide” section of the Administrator Documentation, which provides\
    \ an overview of service distribution and steps for manual Ring creation, manipulation\
    \ and distribution.\n\n# Objects and Containers\n\nAs we’ve discussed, Swift is\
    \ an object storage system. An object is a file of any type that you wish to store\
    \ somewhere. This may be an image, a log, an mp3 or anything else. These objects\
    \ are stored in what Swift calls a container, which is a collection of objects.\
    \ A container has specific attributes to define who has access to it and whether\
    \ it is publicly available. These containers are stored in what Swift calls an\
    \ account, which is a collection of containers. Accounts are the root storage\
    \ location for data.\n\n> **Container: An Overloaded Term**\n> \n> In Chapter\
    \ 11, “Controlling Containers,” we discuss using containers in OpenStack, but\
    \ these are different containers than we talk about here.\n> \n> As you can see\
    \ from the architecture diagram, Swift has a concept of containers, referring\
    \ to where you will place objects. However, broadly speaking, in OpenStack and\
    \ in our later chapter, containers instead refer to technologies like Docker and\
    \ Kubernetes, which provide an isolated operating system environment for running\
    \ applications.\n> \n> As you’ll see later in this chapter, the container term\
    \ in OpenStack Client (OSC) refers to the usage in Swift.\n> \n> While we’re on\
    \ the topic of overloaded terms, there are a couple more. Regions in Swift are\
    \ different than regions in Keystone. As briefly mentioned earlier, partitions\
    \ in Swift are also not the same thing as your standard disk partitions.\n\n#\
    \ Connecting to Swift\n\nInteraction with Swift, like other components of OpenStack,\
    \ is done through the API. The API communicates with a Swift proxy, which looks\
    \ up the location of the account, container, or object in the ring and will complete\
    \ the action accordingly. A basic demonstration of how this works is shown in\
    \ Figure 9.2. While not shown in the figure, note that a cluster is made up of\
    \ multiple servers all containing objects which are replicated across the cluster."
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/8684900d708748f86bb043faa5589f9e_201_0.png)


    Figure 9.2 Overview of connecting to Swift.


    A storage back end is typically multiple servers with disks, but it''s flexible
    enough to be anything from a loopback filesystem for demonstration to NAS devices.
    In our deployment scenario we will use a simple trio of XFS filesystems mounted
    on our controller as a loopback device. This is only done for demonstration purposes
    so we can stay within our two-system and limited-resources constraints. A series
    of loopback devices like this would never be used in production because there
    is no fault tolerance.


    # Fault Tolerance


    Discussed briefly when we talked about The Ring, engineers working on Swift have
    put a lot of work into redundancy and fault tolerance. We''re not covering it
    in depth here and our deployment scenario does not address it, but the following
    is a quick primer.


    Swift stores replicas of data across as many unique failure domains as possible.
    A failure domain is an area of the network impacted when a device or service experiences
    problems. This is handled by placing each series of devices in separate Swift
    zones.


    Consider the simple scenario of using three isolated racks of servers, represented
    as three zones, with the default of three as the replica setting for the Swift
    cluster: Swift will store a replica (copy) of the object in each zone. If one
    of your isolated racks goes down, you are guaranteed that Swift still has two
    copies of the object in the other zones, so you can still access the object.


    When the devices in your deployment are loopback devices in a single disk—as in
    our deployment scenario—if the disk has gone, all replicas go missing at once.
    But at this point, most of OpenStack is also gone as well, since everything but
    compute is running on your single controller.'
