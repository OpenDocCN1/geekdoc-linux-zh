    # ## Select Components


    In this scenario we’ll be bringing in all the components.


    +   - Compute (Nova)

    +   - Identity (Keystone)

    +   - Networking (Neutron)

    +   - Image service (Glance)

    +   - Dashboard (Horizon)

    +   - Ceilometer (Telemetry)

    +   - Cinder (Block Storage)

    +   - Swift (Object Storage)


    Figure 12.1 shows the service placement across our controller and compute node.


    # ## Scenario


    We’ll need to configure both the controller and compute nodes for this scenario.
    You can reuse one of your old scenarios if you’d like, or start fresh from the
    foundations configured in Chapter 5.


