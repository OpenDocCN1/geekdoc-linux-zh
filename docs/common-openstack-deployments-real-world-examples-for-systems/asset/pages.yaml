  md: '# Beyond Swift


    In this chapter we’ve focused heavily on OpenStack Swift object storage, but like
    much of the OpenStack ecosystem, this is not your only option. The popular distributed
    object store and filesystem Ceph is also frequently used with OpenStack deployments.


    # Summary


    The capability to offer object storage to your users greatly extends the storage
    flexibility of your OpenStack deployment. You are now more informed about the
    rationale behind usage of object storage and understand the key components of
    Swift. Finally, we have demonstrated how to set up and add to a basic deployment
    scenario with Puppet and use the resulting objects stored in a real-world example.'
