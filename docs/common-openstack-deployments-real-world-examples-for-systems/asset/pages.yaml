- pgno: 278
  md: '# OpenStack Client (OSC)


    When you are exploring documentation and how-to guides in the OpenStack ecosystem,
    you will inevitably come across documents that describe per-service clients in
    order to run commands. Since these are all managed by individual teams, inconsistencies
    grew up between commands and overlap in functionality. For instance, some clients
    would have you use a hyphen between elements and you were able to do image calls
    from the compute client, as well as from the image client.


    In 2015, projects began to deprecate these individual commands maintained by each
    project in favor of a consolidated client that includes support for all projects
    in a predictable manner: OpenStack Client (OSC). This book uses OSC for all services
    that support it at the time of writing. Neutron and Ceilometer currently do not
    have OSC support so we used their service-specific client as needed.


    # Basics


    The bare minimum you need to know about using OSC is how to get it authenticated
    and the basic command structure so you can effectively use given commands and
    construct your own.


    # Authentication


    In order to use any client, you need to pass it credentials. OSC mostly follows
    the credentials that the old clients used, and this is most easily done through
    an rc file. The rc files used in this book in */etc/openrc.admin* and */etc/openrc.test*
    were created by our Puppet manifests. These export a series of variables that
    are needed, some of them privileged (like the password).


    For instance, looking at the openrc.test file you will see something like:


    ```

    `$ cat /etc/openrc.test`

    ```

    export OS_TENANT_NAME="test_project"

    export OS_USERNAME="test"

    export OS_PASSWORD="test"

    export OS_AUTH_URL=''http://192.168.122.38:5000/v3''

    export OS_AUTH_STRATEGY = ''keySTONE''

    export OS_REGION_NAME= RegionOne

    export OS_USER_DOMAIN_ID=''default''

    export OS_PROJECT_DOMAIN_ID= ''default''

    export OS_IDENTITY_API_VERSION=3

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'By sourcing this file, your environment ends up with all the credentials you
    need to run OSC commands that your user has access to. You also have the option
    of passing all of these in-line at the command line when you run each command.
    For instance, you can use the following instead to run the image list command:


    ```

    $ openstack --os-auth-url=http://192.168.122.38:5000/v3 --os-project-name=test_project
    \

    --os-username=test --os-password=test --os-project-domain=ld-default \

    --os-region-name=RegionOne --os-identity-api-version=3 image list

    ```


    This is quite unwieldy as a command to run, so using an rc file is recommended
    and preferred by most operators.


    # Commands


    OSC has a predictable framework for calling commands as follows:


    ```

    $ openstack <object> <action>

    ```


    For example:


    ```

    $ openstack compute service list

    $ openstack image list

    ```


    In the first command compute service is a two-word object and the action we’re
    performing against is a list of the compute services deployed. In the second command
    image is the object and we’re also doing a list against that.


    Just like the project-specific clients, some OSC commands require admin privileges
    to run, for example, openstack token issue and openstack endpoint create. You
    will get a detailed “You are not authorized to perform the requested action” error
    if you try to use a command as a user that you don’t have access to.


    Projects are always being added and functionality increased for existing services,
    so you can learn about the latest commands supported at http://docs.openstack.org/developer/python-openstackclient/.


    # Interactive Mode


    OSC also has an interactive mode, which is a bit like a shell that enables you
    to use “openstack” on your system shell prompt alone, and then issue commands.
    For example, look at the following:


    ```

    $ openstack

    ( openstack ) image list

    +----------------------+----------------------+

    | ID | Name |

    +----------------------+----------------------+

    | 51fc806-799a-4c01-b383-1d89b0539828 | Cirros 0.3.4 |

    +----------------------+----------------------+

    ```


    Just as with running commands individually, you will have needed to pass credentials,
    either by sourcing an rc file before launching the client interactive mode or
    by passing'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'values in-line. Note that if you do choose to pass them in-line, the credentials
    only need to be passed once, as the client then caches them as long as you have
    interactive mode running. Learn more about interactive mode at http://docs.openstack.org/developer/python-openstackclient/interactive.html.


    # # Quick Reference


    The following commands are a series of frequently used commands by operators who
    deploy OpenStack clouds.


    +   List all of your running instances across your OpenStack cloud, as admin:

    +   $ openstack server list --all-tenants


    +   List all the instance images available to you:

    +   $ openstack image list


    +   List all the compute flavors available to you:

    +   $ openstack flavor list


    +   Show a API endpoints available for use:

    +   $ openstack endpoint list


    +   List keypairs that have been uploaded:

    +   $ openstack keypair list


    +   Get a token:

    +   $ openstack token issue


    +   Retrieve the keystone catalog:

    +   $ openstack catalog list


    +   List OpenStack users, as admin:

    +   $ openstack user list


    +   Get a list of volumes:

    +   $ openstack volume list


    +   Show all your object storage containers:

    +   openstack container list'
