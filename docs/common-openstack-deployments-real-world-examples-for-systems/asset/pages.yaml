    # # Compute Node


    The compute node is much simpler than the controller node, requiring just a handful
    of services to be installed. This configuration is used exclusively for the management
    of instances and takes instructions via the services running on the controller.


    # ## Nova


    First we’ll install the nova-compute package and sysfsutils, which though not
    necessarily being used for the original purpose, does enable us to easily pull
    in the required virtualization tooling that we’ll need to run compute instances.


    ```

    ```

    $ sudo apt-get install nova-compute sysfsutils

    ```

    ```


    Once the installation completes, we’re going to once again edit /etc/nova/nova.conf,
    making the following changes. Remember to update the password to the Nova user
    password you were prompted for earlier, set **my_ip** to this compute node IP
    (using 192.168.122.5 as an example again) and the **rabbit_password** to the one
    you set when first setting up the openstack rabbit user. For the **enabled_apis**
    line in the following, remove **ec2** from the list.


    ```

    ```

    [DEFAULT]

    my_ip = 192.168.122.5

    enabled_apis=osapi_compute,metadata

    rpc_backend = rabbit

    auth_strategy = keystone

    use_Neutron = True

    firewall_driver = nova.virt.firewall.IptablesFirewallDriver

    [oslo_messaging_rabbit]

    ```

    ```'
