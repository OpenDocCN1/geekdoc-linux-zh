    \n# RabbitMQ Profile\n\nFinally, the RabbitMQ queuing profile is the simplest\
    \ of all. It could have been included elsewhere, but we have it as a separate\
    \ profile in case there is a need to add or tune anything about the service.\n\
    \n```\n$ cat /etc/puppet/modules/deployments/manifests/profile/rabbitmq.pp\nclass\
    \ deployments:profile:rabbitmq\n{\n  include ::rabbitmq\n}\n```\n\nThis uses the\
    \ RabbitMQ Puppet module installed by setup.sh to set up and install RabbitMQ.\
    \ You will have set a rabbit_password in the hiera/common.yaml, and this file\
    \ also handles several other configuration options defined by our RabbitMQ deployment.\n\
    \n# Testing the Controller Node\n\nWhen your puppet apply command from earlier\
    \ is complete, you will want to run some test commands to make sure everything\
    \ was created properly and running. Let’s start with some basic functionality\
    \ of MySQL. The default password and hostname are stored in the root user’s ~/.my.cnf\
    \ file, so you can just run the following to see that the databases for Glance,\
    \ Keystone, Neutron and Nova were created. In these example commands, we’ve included\
    \ some sample output, which won’t match exactly but will give you some idea what\
    \ to look for.\n\n```\n$ sudo -H mysql -e \"show databases;\"\n+--------------------+\n\
    | Database           |\n+--------------------+\n| information_schema |\n| glance\
    \             |\n| keystone           |\n| mysql              |\n| neutron   \
    \         |\n| nova               |\n| performance_schema |\n+--------------------+\n\
    ```"
