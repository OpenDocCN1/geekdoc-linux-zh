    \ Value                                                        |\n| ----------\
    \ | ------------------------------------------------------------ |\n| enabled\
    \    | True                                                         |\n| id  \
    \       | 476096b7ad4b4888b6d5c9b7170bb601                               |\n|\
    \ interface  | admin                                                        |\n\
    | region     | RegionOne                                                    |\n\
    | region_id  | RegionOne                                                    |\n\
