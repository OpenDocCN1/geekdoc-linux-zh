- pgno: 230
  md: '# # Scaling and Troubleshooting


    Familiarity with various deployment types of OpenStack only gets you so far. Once
    you have a use case and have a basic cloud set up, you may wish to grow that cloud
    and will have a use for scaling your architecture, whether that means adding more
    storage nodes or increasing the power of your compute cluster. Troubleshooting
    is also a vital part of any OpenStack operator’s toolkit. Deployments vary considerably,
    and every environment is likely to have nuances that you’ll have to know how to
    deal with. Finally, various vendors in the OpenStack ecosystem exist to support
    your larger deployment and augment it with public cloud offerings.'
