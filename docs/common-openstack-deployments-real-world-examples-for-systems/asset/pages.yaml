    For the sake of explanation, this diagram shows a controller and two compute nodes
    (our deployment scenarios only have a single compute node). As you can see, traffic
    between compute nodes is handled directly between the nodes. This would be the
    instance traffic going over VXLAN tunnels. In order to leave the tenant network,
    traffic must'
