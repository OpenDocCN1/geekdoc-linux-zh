- pgno: 204
  md: 'in all the storage mechanisms (storage::all) so you can work with them, but
    note we are using a series of three XFS loopback devices in this deployment example.


    We''ve also pulling in various proxy manifests. Going through them one by one,
    you have:


    +   - account_quotas—Provides the ability to set quotas on accounts (a Swift “account”
    corresponds to a Keystone “project,” aka “tenant”). Note that the accounts themselves
    are part of Keystone.

    +   - authtoken—The standard token support for authentication.

    +   - cache—Support for caching, using memcached, for specific types of lookups.

    +   - catch_errors—Catches errors occurring in proxy pipeline and translates it
    to corresponding error reporting.

    +   - container_quotas—Provides the ability to set quotas on specific containers.

    +   - formpost—Support for uploading objects using an HTML form POST.

    +   - healthcheck—A simple tool to monitor whether the Swift proxy server is alive,
    and also used when adding multiple proxies to a load balancer.

    +   - keystoneauth—Used to manage keystone middleware for the Swift proxy.

    +   - proxy_logging—Provides custom logging for all external API requests made
    to the proxy server.

    +   - ratelimit—Support for ratelimiting for both account and container so it
    can prevent a single account from using up too much resources in the cluster.

    +   - staticweb—Support for the Swift static web middleware for creating static
    web sites.

    +   - tempurl—Support for temporary access to objects.

    +   - tempauth—Reference middleware to create custom authentication component.
    This should never be used in production but is useful for development and testing.


    The final section of the Puppet profile for Swift sets up the XFS loopback devices
    (1-3) that will be used to store the objects we create for the containers.


    Finally, Rings were discussed earlier in the chapter, and by calling the Swift
    ring-builder manifest we can manage these Rings.


    > **Warning**

    > Our deployment scenario is only an example and does not have the characteristics
    to make it production-ready. So, such, our configuration of Rings using this module
    is also not production-ready, so be cautious here when you work to configure this
    for a real deployment. If the Puppet Swift module is not used correctly, the rings
    will be different on each host, and there is a high chance that the durability
    of the data is at risk.'
