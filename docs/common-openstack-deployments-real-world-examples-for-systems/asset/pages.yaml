- pgno: 217
  md: 'leveraged to help with this interaction. Drivers may either have Ironic use
    built-in tooling, if it exists, or use standard tools like IPMI for the management
    of hardware. As the bare metal service has matured, a requirement for all included
    (otherwise known as “in-tree”) drivers is that the vendors are doing continuous
    integration testing to ensure quality. A developer-level overview of the various
    in-tree drivers is available at http://docs.openstack.org/ironic/developer/deploy/drivers.html.


    # Installation


    We have used Puppet to orchestrate the deployments in this book. Due to the strong
    hardware nature of Ironic, it was determined there is not an example deployment
    that would be both valuable and versatile enough for inclusion in this book.


    However, Puppet modules for Ironic do exist and are available with the rest of
    the Puppet modules. For Mitaka, see the branch at https://git.openstack.org/cgit/openstack/puppet-ironic/tree/?h=stable%2Fmitaka.


    An example ironic.pp is included with that module to get you started. Configuration
    of your specific environment will depend heavily upon the hardware you have available,
    which again is why it’s difficult for us to show a reference deployment. You can
    search through the available drivers to match up your hardware, or you can look
    at the SSH driver if you’re really interested in doing a virtualized test.


    Aside from Puppet, Ansible playbooks and Chef cookbooks are also available. See
    more about where to find these modules in Appendix B, “Other OpenStack Mechanisms.”
    A manual installation guide is provided in the Ironic developer documentation
    at http://docs.openstack.org/developer/ironic/deploy/install-guide.html.


    Finally, if you just want to try it out, you can use Ironic with DevStack. Refer
    back to Chapter 2, “DevStack,” for a refresher on how DevStack works, and then
    see the DevStack documentation for the current process for enabling the Ironic
    plug-in.


    # Bifrost


    Bifrost is a set of Ansible-based configuration management scripts that are used
    to deploy Ironic independently from the rest of OpenStack. It strives to pull
    in as few OpenStack requirements as possible, to provide the closest thing to
    a standalone Ironic deployment as you’re likely to find. Bifrost has developer
    documentation at http://docs.openstack.org/developer/bifrost/ that includes the
    location of the code repository and installation instructions.


    # Using Ironic


    Once Ironic is installed, you’ll likely want to enroll some hardware. Hardware
    enrollment is handled by a user who provides details about the hardware to the
    Ironic API. This is done by using the ironic node-create command and providing
    details about the system. The following example of enrollment will assume you’re
    using hardware that has an IPMI interface.'
  merge: -1
  img_proc: true
