    \nclass deployments::profile::horizon\n{\n    include ::apache\n    include ::horizon\n\
    }\n```\n\nIt runs Apache, so we're pulling in a generic Apache module and it also\
    \ needs the OpenStack Horizon module.\n\nIf you're interested in further details\
    \ about the OpenStack Horizon module for the Mitaka release, you can browse it\
