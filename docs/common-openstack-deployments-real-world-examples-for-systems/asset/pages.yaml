    +   - Dashboard (Horizon)


    # Scenario


    This is the simplest deployment scenario of OpenStack that we will explore. As
    explained, it is using only the services that we installed in Chapter 5, so there
    are no additional services to add. This simple deployment will enable you to do
    the following:


    +   1. Add a new flavor to define resources (R.AM, disk, etc.), which can be selected
    when you deploy instances.

    +   2. Add a new disk image to the image service.

    +   3. Create instances using your disk image and test on the private network.

    +   4. Add a public, floating IP address to make an instance externally accessible.

    +   5. Install and run a publicly accessible service on your instance.


    We will walk through both using the dashboard (Horizon) and on the command line
    with OpenStack Client (OSC).


