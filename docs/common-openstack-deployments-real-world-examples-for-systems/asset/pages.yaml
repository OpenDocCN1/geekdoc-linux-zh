  md: '+   - **Domains**—High-level account containers for projects, users and groups,
    separate domains can use different authentication back ends.

    +   - **Roles**—Define the operations in the form of rights and privileges that
    a user can perform in particular projects.

    +   - **Users**—Individual accounts used to interface with Keystone for access
    to OpenStack services.

    +   - **User Groups**—A collection of users.


    A user is a member of one or more projects and is assigned roles. Roles exist
    within projects. There is no way to have a role outside of one, with the exception
    of admin. While it’s granted within a project, once granted it’s global.


    Finally, you will need to unset your token-based authentication environment variable
    and set the new password-based authentication credentials that you just set up
    to test that Keystone is working as expected. The `OS_PASSWORD` will be the custom
    password you were prompted for when creating the admin user.


    ```

    $ unset OS_TOKEN OS_URL

    $ export OS_PROJECT_DOMAIN_NAME=default

    $ export OS_USER_DOMAIN_NAME=default

    $ export OS_PROJECT_NAME=admin

    $ export OS_USERNAME=admin

    $ export OS_PASSWORD=ADMIN_PASSWORD

    $ export OS_AUTH_URL=http://controller:5000/v3

    $ export OS_IDENTITY_API_VERSION=3

    ```


