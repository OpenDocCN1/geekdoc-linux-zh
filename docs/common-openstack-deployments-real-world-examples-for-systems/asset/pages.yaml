    # Other Contributions


    This appendix only provided a glimpse into the code-focussed development efforts
    of the OpenStack project. No software project would be complete without the efforts
    of teams working on Documentation, Internationalization, Project Infrastructure,
    Release Management, Quality Assurance and more. All of these projects has distinct
    ways of getting involved which you can learn about by visiting the Project Teams
    lists maintained by the OpenStack Technical Committee at http://governance.openstack.org/reference/projects/.'
