  md: 'In the `[oslo_messaging_rabbit]` section you''ll want to update it to point
    to your controller''s address and inform it of the Rabbit user and password:


    ```

    ```

    rabbit_host = controller

    rabbit_userid = openstack

    rabbit_password = RABBIT_PASSWORD

    ```

    ```


    Next, edit `/etc/neutron/plugins/ml2/openvswitch_agent.ini` and add the following
    to the `[agent]` section:


    ```

    ```

    tunnel_types = vxlan

    ```

    ```


    In the `[ovs]` section, update the `local_ip` to be its own IP and enable tunneling:


    ```

    ```

    local_ip = 192.168.122.5

    enable_tunneling = true

    ```

    ```


    The final change to make to this file will be to specify the iptables firewall
    driver to use for the security groups:


    ```

    ```

    firewall_driver = neutron.agent.linux.iptables_firewall.OVSHybridIptablesFirewallDriver

    ```

    ```


    Next you''ll want to edit your `/etc/nova/nova.conf` file to add the `[neutron]`
    section to your configuration:


    ```

    ```

    [neutron]

    auth_url = http://controller:5357/v3

    url = http://controller:9696

    auth_plugin = v3password

    project_domain_name = default

    user_domain_name = default

    project_name = service

    username = neutron

    password = NEUTRON_PASSWORD

    ovs_bridge = br-int

    region_name = RegionOne

    timeout = 30

    extension_sync_interval = 600

    ```

    ```


    Restart the Neutron OVS agent and the compute services to apply your changes.


    ```

    ```

    $ sudo service nova-compute restart

    $ sudo service neutron-openvswitch-agent restart

    ```

    ```


    # ## Manage an Instance


    Congratulations, your system is now running a bare bones OpenStack configuration
    with Keystone, Glance, Nova and Neutron, which you can interact with through the
    command line. We''ve completed small tests for each component to confirm they
    are working, and now it''s time to test that everything has come together to create
    instances on your new OpenStack installation. Up until now we''ve been using an
    `openrc.admin` file to load up the administrative credentials for your cloud,
    but now you''ll want to create a testrc file that uses the test user we configured
    earlier. The test user cannot run some'
