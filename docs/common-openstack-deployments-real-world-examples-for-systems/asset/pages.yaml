- pgno: 120
  md: "# 5\nFoundations for\nDeployments\n\n> *Enter these enchanted woods,*\n> \n\
    > *You who dare.*\n> \n> George Meredith, *The Woods of Westermain*\n\nAs has\
    \ been discussed, an OpenStack deployment is made up of a series of components\
    \ that come together, and of these components, there are key services that are\
    \ used in most installations. All installations will require identity services\
    \ provided by Keystone. Most deployments, including those demonstrated in subsequent\
    \ chapters, will require networking services provided by Neutron, compute services\
    \ provided by Nova and the RabbitMQ queuing service.\n\nThis chapter covers how\
    \ to get your foundation of identity, networking, compute and queuing configured\
    \ so that you can move on to build the rest of your infrastructure using Puppet.\n\
    \n# Requirements\n\nFor configuration of your systems you will need to satisfy\
    \ the same requirements as you needed to for Chapter 4, “Your First OpenStack.”\
    \ You need a single system (virtual or physical) as a controller node and a single\
    \ system as a compute node.\n\nOur recommended minimum specifications for a basic\
    \ two-system setup of OpenStack are as follows:\n\n+   Controller Node—1 x 64-bit\
    \ processor, 4GB of memory, 30GB of storage and two Network Interface Cards (NICs)\n\
    \nYou will also want to prepare a compute node now:\n\n+   Compute Node—1 x 64-bit\
    \ processor, 2GB of memory, 20GB of storage and one NIC"
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Why Do I Need Two Nodes?


    You have read here, and perhaps elsewhere, that the bare minimum for a production
    OpenStack cloud is two nodes. But why?


    +   • **Scalability**—It’s very natural for some portions of your OpenStack deployment
    to scale beyond a single machine. Like the Compute Node, your Compute Node is
    the host to the virtual machines so that can often be the first node that you’ll
    want to have more of as your pool of users grow and you need to offer more resources.
    The Controller node can easily handle the functions for these additional Compute
    nodes.

    +   • **High-availability**—In a mature, production OpenStack environment, you
    want your machines to be highly available (HA). By starting your first deployment
    as a two-node deployment, you are already making logical splits in your architecture
    which lend themselves to being made highly available. You may learn that you want
    nearly identical Controller Nodes for redundancy, but may not want or need the
    same in some of your other nodes at the same rate.

    +   • **Security**—While service isolation is not the panacea for security, it
    does help. Privilege escalation from within instances of all types is a sadly
    common vulnerability and protecting your other services from this by keeping them
    on separate machines is important.


    If you are configuring the Compute Node and wish to launch more than a couple
    small compute instances, you will want to give it more resources. Keep in mind,
    in the case of virtualization, you will also need to leave some resources for
    the host system.


    # Caution


    The default configuration we’re using in this book for OpenStack makes the HTTP-accessible
    dashboard (Horizon) accessible from any address. Many of the API endpoints are
    also accessible. While you do need authentication, the default passwords that
    we ask you to change are simple.


    For the sake of security, when you’re setting this up initially as a demonstration
    consider using a local area network (LAN) for these systems and don’t allow SSH
    or HTTP access from the outside world. Networking can get complicated for newcomers
    to OpenStack, and you want to make sure you’re working in a trusted environment.


    If you do choose to use cloud-based systems or other publicly accessible servers
    rather than local Virtual Machines or hardware, please keep security in mind as
    you work with OpenStack and take appropriate precautions with standard Linux access
    controls and firewalls. Remember, it’s very common for these providers to leave
    SSH and HTTP access available by default, and that’s precisely what you want to
    protect.


    # Reference Deployment


    As we covered in Chapter 4, this book provides a reference deployment using a
    pair of virtualized nodes using KVM. This can be found in Appendix A, “Reference
    Deployment.”'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'If you don’t have a preference as to virtualization technology or are struggling
    to get any of the components working with our scenarios, it’s recommended that
    you start with this reference deployment.


    # Networking


    The networking will be the same as we set up in Chapter 4, and as explained in
    depth in Chapter 3, “Networking.” In this chapter, most of the configuration will
    now be handled through Puppet. The exception is if you’re using a virtualized
    environment, you will still need to set up the bridges on the host machine where
    your VMs run from. Again, see Chapter 4 for a reminder on how to do this.


    As a quick general refresher, you will be using two networks for the controller
    node, one for your “public” addresses that are assigned to instances, and one
    for everything else. Your compute node will only be on the latter network.


    # Select Deployment Mechanism


    As you saw in Chapter 2, “DevStack,” it is technically possible to write a shell
    script to deploy OpenStack. However, this is not a supported way to run OpenStack
    for anything other than development work. It is very difficult to use and maintain
    this type of install because of how many interconnected components OpenStack has.
    Even as a development tool, maintaining the DevStack project takes a full team
    of contributors.


    The OpenStack community provides several solutions for deploying OpenStack, including
    Puppet, Chef and Ansible.


    # Common Deployment Mechanisms


    The following open source resources are available to operators for deployment
    of OpenStack. Each is maintained by a team whose focus and expertise is the deployment
    technology. Several also maintain add-ons to these basic deployment tools in both
    open source and proprietary versions.


    Official deployments for these configuration management tools can be found in
    the OpenStack software repositories at https://git.openstack.org/cgit/openstack.


    +   - **Puppet**—Puppet is what we will be using for all the exercises in this
    book. The Puppet community within OpenStack manages modules for each component
    of OpenStack. Puppet repositories are prefixed with “puppet-.”

    +   - **Chef**—Contributors to the Chef community in OpenStack maintain cookbooks
    for the components of OpenStack. Chef repositories are all prefixed with “chef-.”

    +   - **Ansible**—Ansible playbooks for OpenStack, collectively known as OpenStack
    Ansible Deployment (OSAD), are located within the openstack-ansible project. Several
    related projects are prefixed with “openstack-ansible-”.


    See Appendix B, “Other Deployment Mechanisms,” to learn more about doing OpenStack
    deployments with these and other tools.'
  merge: -1
  img_proc: true
- pgno: 123
  md: "Many vendors offer deployment mechanisms as their “value add” when you hire\
    \ them to deploy your infrastructure. These custom solutions range from being\
    \ fully open source to being fully proprietary, so it’s important to understand\
    \ the licensing agreement when you work with a vendor.\n\nThis and the following\
    \ chapters will show you how to deploy OpenStack using Puppet, leveraging the\
    \ community-maintained OpenStack Puppet modules and OpenStack packages in the\
    \ Ubuntu Cloud Archive. This is done to help you learn about the types of deployments\
    \ that exist and how the pieces move. Your organization can select a different\
    \ deployment and maintenance mechanism when you’re ready for production. Again,\
    \ learn more about some of the other options available for configuration and orchestration\
    \ with OpenStack in Appendix B.\n\n# Initial Setup\n\nNow that the appropriate\
    \ hardware or virtual resources have been made available, you will want to do\
    \ some initial configuration of your servers. This includes installation of Ubuntu\
    \ 14.04 and setup of the Puppet configuration.\n\nYou should begin by installing\
    \ the Server edition of Ubuntu 14.04 LTS on both servers.\n\n> **Tip**\n> When\
    \ installing, use the most basic configuration possible. We recommend using most\
    \ defaults in the installer, with two exceptions. On the Partition disks screen,\
    \ you should select Guided - use entire disk since you don’t need LVM (Linux Volume\
    \ Management). Second, on the Software selection screen, you probably want to\
    \ select OpenSSH server so you can log into your system over SSH.\n\nOnce your\
    \ two Ubuntu 14.04 systems are installed, complete all upgrades and reboot the\
    \ systems. When the server comes back up after the reboot, you’ll also want to\
    \ install git in order to download the files we need to set up and configure Puppet.\n\
    \n```\n`$ sudo apt-get update`  \n`$ sudo apt-get dist-upgrade`  \n`$ sudo reboot`\
    \  \n`$ sudo apt-get install git`\n```\n\nConfiguration of Puppet on both servers\
    \ is done through the contents of a GitHub repository crafted specifically for\
    \ this book. The GitHub repositories used in this book can be browsed here at\
    \ https://github.com/DeploymentsBook.\n\nThere is a script in this repository\
    \ that installs the required Puppet components and uses the r10k Puppet deployment\
    \ tool to install additional dependencies. In order to see this in action, we’ll\
    \ want to clone this puppet-data repository and then run the setup script:\n\n\
    ```\n`$ git clone https://github.com/DeploymentsBook/puppet-data.git`  \n`$ cd\
    \ puppet-data/`\n```\n\nThe following is the contents of the setup.sh script that\
    \ you want to run next. This will set up your Puppet environment:"
