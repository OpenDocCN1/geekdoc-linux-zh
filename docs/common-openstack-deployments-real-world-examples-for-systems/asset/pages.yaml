- pgno: 167
  md: '![](img/8684900d708748f86bb043faa5589f9e_167_0.png)


    When you’re done using your instance and are ready to get rid of it, you can log
    into the dashboard, navigate to Instances and either select Shut Off Instance
    or Terminate Instance from the drop-down menu on the right. If you simply shut
    off the instance you will be able to bring it back up later. Terminating the instance
    will delete the instance forever. You can also terminate an instance from OpenStack
    Client with the `openstack server delete <server>` command.


    # SDKs and the OpenStack API


    We have explored using the OpenStack dashboard (Horizon) and the OpenStack Client
    (OSC) to interact with OpenStack.


    But no chapter on interacting with your private cloud would be complete without
    discussing the Software Development Kits (SDKs) which speak to the OpenStack Application
    Programming Interface (API). With the rise of automation in operational environments,
    it’s fair to say that most deployments use SDKs for the majority of their interactions
    with their OpenStack cloud. Software is written with the SDKs to manage your OpenStack
    instances and the resources they’re using.


    OpenStack SDKs are available for various languages, including Python, Java, Node.js,
    Ruby, .NET and PHP. If you can’t find an API for your language of choice, the
    API can also be accessed by using cURL or via REST clients (both of which many
    languages have bindings for) or by simply calling the OpenStack Client (OSC) we
    used earlier in this chapter from within your program.


    The latest documentation for the major SDKs and the OpenStack API can be found
    by going to `http://developer.openstack.org/`.'
  merge: -1
  img_proc: true
