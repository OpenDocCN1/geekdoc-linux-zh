- pgno: 143
  md: 'Remember, Network1 is for local traffic, and an ext-net is defined where you
    can add support for traffic outside of the local network. Only addresses from
    Network1 can be assigned directly to an instance.


    With your network set, you can click Launch Instance button to create your instance.
    The Launch Instance window will close and you will see the Status of the instance
    in the list go from Building to Active. Once it’s active, you want to look in
    the last column of the list of instances and select Console from the Actions column
    (see Figure 5.4).


    This will bring up a Console in a separate window where you can log into. It’s
    very common for the console to fail to respond to input, so at the top of the
    page you may need to choose the option to Click here to show only console in order
    to interact with the console. The console will have instructions for how to log
    in, which by default on the CirrOS image are:


    ```

    ```

    *login as ‘cirros’ user, default password: ‘cubewin:i1’. use sudo for root.*

    ```

    ```


    Follow these instructions to log in. You then may want to confirm that your instance
    got an IP address. In the example in Figure 5.5 the command ip addr was run to
    show an eth0 with the IP address of 10.190.0.7. The next command run was ping
    -c 4 10.190.0.1, which pinged the gateway address that was configured four times
    to confirm local network was working.


    If this was all successful, congratulations, you’re running an instance on OpenStack!
    With these foundations in place, you’re now ready to move on to the first deployment
    scenario.


    If you’re having some trouble, the next section will help you with troubleshooting.


