- pgno: 179
  md: '# ## Handling Metrics and Alerts


    Now that you have a working cloud and some metrics, you will want to pass along
    this data to some kind of service to handle tracking and possibly billing. These
    services are external to OpenStack, with multiple companies and a couple open
    source projects, like CloudKitty, developed in the OpenStack ecosystem, offering
    support for the telemetry data coming from Ceilometer. Based on your needs, you''ll
    want to research the appropriate solution for your environment. If none of the
    current vendors or projects meet your needs, you can write your own service that
    queries the API.


    Once part of Ceilometer, alerts are now handled by the Telemetry Alarming service,
    Aodh. Like other OpenStack services, you configure alarms through the Aodh API.
    The alarm evaluator periodically communicates with the Ceilometer API and processes
    alerts through the alarm notifier, which then contacts the external systems to
    notify an alarm rule has been broken. This external system will be something you
    or your vendor creates to process the Aodh notification output.


    Finally, given this data, it probably comes as no surprise that people are finding
    innovative ways to use this data. Utilization tracking can help a cloud operator
    script when they should automatically be adding resources. Problem in your infrastructure
    like a runaway log file or high loads? Statistics pulled from Ceilometer data
    can help pinpoint the instances that are struggling with disk space, CPU usage
    and more.


    # ## Summary


    With the details from this chapter, you now have the framework to start tracking
    metrics on a hosted compute service. With a view into it from both the Horizon
    dashboard and the command line and API, you can track what your system is doing
    through regular polling and track usage and provide information to a billing system.
    You can even use it for debugging using the metrics provided through Ceilometer.'
  merge: -1
  img_proc: true
- pgno: 180
  md: "# 8 Block Storage Cloud\n\n> \"The road to the City of Emeralds is paved with\
    \ yellow brick.\"\n> \n> L. Frank Baum, *The Wonderful Wizard of Oz*\n\nOpenStack\
    \ provides two popular mechanisms for storage: object and block storage. Block\
    \ storage is traditionally what you’d mount as a filesystem on your server. Object\
    \ storage instead hosts individual files that are then referenced from within\
    \ your application. In Chapter 9, “Object Storage Cloud,” you learn about why\
    \ you may want to use object storage with Swift to host files. This chapter covers\
    \ block storage with Cinder.\n\nIntegrated with the rest of OpenStack, Cinder\
    \ volumes can be created within an OpenStack cloud and then live mounted to a\
    \ specified instance at the whim of a user. Additionally, you can unmount that\
    \ volume from one instance and mount it on another with just a few commands.\n\
    \n# ### Uses\n\nOne of the strengths of OpenStack is to avoid vendor lock-in,\
    \ particularly when used in combination with versatile solutions like Cinder.\
    \ Cinder provides an abstraction layer through the volume manager that hooks in\
    \ to over 70 different proprietary and open source storage solutions. Additionally,\
    \ it can be an interface to multiple back ends at once, enabling you to not only\
    \ diversify your back ends across vendors but also change them out and do a planned\
    \ migration as your organization sees fit.\n\n# ### Cloud Provider\n\nWhether\
    \ you’re running a public cloud accessible to customers or a private cloud for\
    \ use within your organization, offering the capability to extend the given filesystem\
    \ requirements in place for the flavors can be a huge benefit.\n\nWith the capability\
    \ to add block storage volumes on the fly, the storage requirements for default\
    \ compute nodes can be kept small to preserve space for users who want to focus\
    \ on the compute power and give others the flexibility to add the storage they\
    \ need on the fly. The flexibility to extend storage as needed helps scaling out\
    \ resources without over-committing beforehand and makes migrations easier if\
    \ data is kept on a single volume that can be moved to a new compute instance."
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Another major benefit is that the compute nodes can be run on throw-away commodity
    hardware. The data needing to be stored can be either kept on expensive redundant
    enterprise hardware or on something that has built-in redundancy like Swift. As
    a result, compute nodes themselves could become independent. throw-away components
    of your infrastructure, spun up as needed and replaced with identical servers
    that attach to your storage back end. Finally, upgrades are also simplified for
    your customers. If you have a new copy of your system you are testing, you can
    snapshot the production data from a Cinder volume and then attach it to your test
    system to see if it works.


    # Pets versus Cattle


    If you’re unfamiliar with the pets versus cattle metaphor in cloud computing,
    it’s time to get you up to speed.


    Prior to the recent rise in cloud computing, systems administrators would work
    with our managers to spec out hardware for servers and work out a budget to purchase
    it. A new server would be delivered to the facility where we’d install the operating
    system and put it into a rack in our data center. A nice label would go on the
    server designating a name, and over time we’d work to maintain and update this
    server. The server would be upgraded for years through operating systems and hardware
    failures and upgrades. We’d start noticing specific quirks about the hardware;
    one server maybe has a flaky onboard NIC so our notes explained that we added
    an additional card, another machine may take a while to boot up. We became familiar
    with these servers as grew and nurtured over time, like pets.


    When workloads and businesses began moving to the cloud for their workloads, everything
    changed. Individual servers no longer had quirks and were easy to move around.
    A complete replacement of a server became more common than an in-place upgrade,
    and tools were written to manage fleets of servers operating in a larger infrastructure
    rather than working with individual servers. Instead of pets, servers became a
    lot more like cattle.


    As a systems engineer and an animal lover, I have a love for both pets and cattle,
    metaphorically or not. But this metaphor does effectively demonstrate the differences
    in how servers are treated today in a cloud environment.


    # Data Processing


    Whether you’re a film production company or a research institution, using compute
    nodes to do data processing and analysis is a common use for cloud-based infrastructures.
    But where is this data stored and how is it shared in your organization? What
    do you do when the compute nodes you’re working on run out of space? With Cinder
    block storage, users are able to extend volumes after creation or simply create
    new volumes as they are needed and attach them to their running instances and
    mount them in a matter of minutes. Running out of hard drive space on an instance
    because you have too much data is no longer a problem.


    Additionally, if you realize you need more processors or memory, it’s simple to
    create a new compute instance and move the volume over to the new instance. All
    your data moves with you to your new server.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# ## Keeping Backups


    Making sure your data is backed up and replicated is a common concern, and Cinder
    offers several options for this. As mentioned earlier, it provides an abstraction
    layer for dozens of back ends, so you have a lot of options in your environment
    and on top of that, the different types of backups that Cinder offers.


    Many virtualization technologies supported by OpenStack have built-in snapshot
    capabilities, but OpenStack''s block storage also has one. This enables volumes
    to be backed up as snapshots to other block storage volumes and can be used on
    its own, using the existing configuration. Whether offered as a backup service
    by a cloud provider or as an automatic service for users on an OpenStack cloud,
    this is a valuable feature.


    You can also clone volumes. Many back ends are smart enough to do a copy-on-write
    in where zero copying actually happens. The new volume references an existing
    volume it was cloned from and writes data on top of that. This makes it very fast.
    Some snapshot features also just do this in the back end, but every vendor solution
    is implemented differently.


    Moving beyond snapshots, Cinder also offers a backup service that enables you
    to back up your block data to an object store. This helps with the scenario of
    your entire block storage back end going completely off-line. Differential and
    incremental backups can be performed and, unlike a snapshot, it is only backing
    up data that was actually used, not the entire volume and unused bits.


    We won''t spend a lot of time on backup scenarios in this chapter. Instead we''ll
    be focusing on adding volumes in a more instance-focused environment where you''re
    adding volumes to instances, but they are great options to keep in mind.


    # ## Requirements


    In this deployment scenario you''ll once again be using the controller and compute
    nodes you created in Chapter 5, “Foundations for Deployments.” We will be creating
    a 10GB volume group for use by Cinder on the controller and the minimum specifications
    defined in that chapter will easily support this.


    # ## Select Components


    In addition to the foundational tooling, we''ll be adding Cinder block storage
    to your deployment in this scenario. This will extend our very basic installation
    to have the following services. Their placement is demonstrated in Figure 8.1.


    +   - Compute (Nova)

    +   - Identity (Keystone)

    +   - Networking (Neutron)

    +   - Image service (Glance)

    +   - Dashboard (Horizon)

    +   - Block Storage (Cinder)'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/8684900d708748f86bb043faa5589f9e_183_0.png)


    Figure 8.1  Components of a two-system OpenStack deployment with Cinder block
    storage


    # # Architecture Overview


    In Chapter 1, “What is OpenStack?” you were briefly introduced to the components
    that make up the block storage (Cinder) service: cinder-api, cinder-scheduler,
    cinder-volume and also cinder-backup. A user will likely only be exposed to the
    API. As operators though, understanding the architecture for the service is important
    as we seek to make decisions about how we build the system and debug problems.


    When a user request comes in, either from the OpenStack dashboard (Horizon), the
    OpenStack Client (OSC) or through a Software Developer Kit (SDK), it interfaces
    with the API for Cinder. This API will talk to a database, for initially storing
    the request, and then set the status to creating and reserving quota usage. The
    API will also interact with a messaging queue. The messaging queue will pass requests
    on to the scheduler for Cinder, which makes decisions about where the change will
    be made. For example, if a user is requesting that a volume be created, the scheduler
    will determine which storage device meets the criteria the user is asking for,
    for the volume (size, disk type), and then send it to the appropriate volume manager.
    The volume manager for Cinder is what works directly with drivers to interface
    with the storage back ends. A storage back end may be a datacenter full of Ceph
    nodes or a proprietary Network-attached Storage (NAS) device that has a driver
    for Cinder. The volume manager will also be talking to the database to commit
    to the reserved quota once we know the volume is created successfully. The status
    of the volume is also set to ‘available’ so the user knows the volume may be used.
    See Figure 8.2 for a view into how the individual services work together.


    All official drivers that are available for Cinder go through verified testing
    by the upstream Cinder team in the OpenStack project. To accomplish this, every
    vendor is required to run continuous integration (CI) tests on all changes that
    report to the public OpenStack review system. To learn about the latest supported
    drivers, you can visit the OpenStack Marketplace Drivers page for an official
    listing: https://www.openstack.org/marketplace/drivers/.


    Paying attention to the drivers and learning what is supported will be essential
    when you build out your production OpenStack deployment. When considering a solution,
    be sure to research the support for your storage back end of choice and look into
    factors like how long a solution or vendor has been supported in OpenStack and
    what they support when it comes to interacting with the Cinder volume manager.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '![](img/8684900d708748f86bb043faa5589f9e_184_0.png)


    Figure 8.2  Cinder overview


    # Scenario


    Extending beyond compute-focused deployments, like we saw in Chapter 6, “Private
    Compute Cloud,” and Chapter 7, “Public Compute Cloud,” with Cinder block storage
    means you can now offer real persistent storage to your users. Since we’re adding
    an additional component, a bit of setup needs to be done with Puppet again to
    configure this storage.


    # Controller Node Setup


    If you have your Controller and Compute nodes available from Chapter 5 you will
    only need to run a single command to add the support for Cinder block storage.
    In this scenario you will only need to make changes to the controller node. No
    modifications need to be made to the compute node.


    > **Tip**

    > Did you go through Chapter 7 before this chapter? You should create a new environment.
    Even though OpenStack is modular, we haven’t designed our foundations modules
    to function together until you get to Chapter 12, “A Whole Cloud.”


    The command is another Puppet apply command, which will process our foundational
    block storage role in Puppet:


    ```

    $ sudo puppet apply /etc/puppet/modules/deployments/manifests/role/foundations_block_storage.pp

    ```'
  merge: -1
  img_proc: true
- pgno: 185
  md: "This will take some time as it downloads everything required for Cinder and\
    \ sets up configurations. If anything goes wrong and this command fails, remember\
    \ that Puppet can also be run with the `---debug` flag in order to show more detail.\n\
    \nWhile this is running, we can take a look at what this file contains:\n\n```\n\
    class deployments::role::foundations_block_storage {\n  include deployments::role::foundations\n\
    \  include deployments::profile::cinder\n}\n\ninclude deployments::role::foundations_block_storage\n\
    ```\n\nThis is calling out to our foundations role, which means if you didn't\
    \ set up a foundations role yet for your controller, it will do it now. This is\
    \ mostly a safety measure; we would still recommend that you run it independently\
    \ in case you need to do any troubleshooting.\n\nIt then calls our Cinder block\
    \ storage profile, which you can view on the controller filesystem at `/etc/puppet/modules/deployments/profiles/profile/cinder.erb`,\
    \ and it contains the following:\n\n```\nclass deployments::profile::cinder\n\
    {\n  include ::cinder\n  include ::cinder::api\n  include ::cinder::ceilometer\n\
    \  include ::cinder::config\n  include ::cinder::db::mysql\n  include ::cinder::keystone::auth\n\
    \  include ::cinder::scheduler\n  include ::cinder::volume\n  include ::cinder::setup_test_volume\n\
    \n  file '/etc/init/cinder-loopback.conf' {\n    owner   => 'root',\n    group\
    \   => 'root',\n    mode    => '0644',\n    content => template('deployments/cinder-loopback.conf.erb'),\n\
    \  }\n}\n```\n\nThe profile pulls in various components to Cinder that we will\
    \ need. Just like other services in OpenStack, Cinder requires an API, database\
    \ and Keystone authentication. In case you will to track usage with Ceilometer's\
    \ telemetry service, we also include that. The config is pulled in to help manage\
    \ arbitrary Cinder configurations you may wish to have. A scheduler in block storage\
    \ is used in much the same way other OpenStack services use schedulers, to view\
    \ the requirements the user is requesting for the volume, and then randomly pick\
    \ a storage device back end that the volume can be created on that meets that\
    \ criteria. As you may expect, pulling in `cinder::volume` is for the Cinder volume\
    \ manager. As explained earlier in the chapter, this is what interacts with the\
    \ drivers actually controlling the storage back end, whether that's a simple loopback\
    \ device with LVM (Linux Volume Manager) like we will be using or a proprietary\
    \ NAS device."
