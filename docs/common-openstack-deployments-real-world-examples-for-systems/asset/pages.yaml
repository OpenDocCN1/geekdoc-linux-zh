  md: 'To learn more about roles, profiles and modules, visit the official Puppet
    documentation https://docs.puppet.com/. Several valuable articles and blog posts
    have also been written about them. Because they become dated quickly, use your
    favorite search engine to find the latest.


    # ### Profiles


    Each of these profiles configure a different component of your OpenStack deployment
    and you can dig into each one to learn what it’s configuring.


    # #### Base Profile


    The base profile is shared among all of our deployments.


    ```

    $ cat /etc/puppet/modules/deployments/manifests/profile/base.pp

    class deployments::profile::base {

    include deployments::profile::openrc

    include deployments::profile::ucc

    include ::ntp

    include ::openstacklib::openstackclient

    # add an alias to /etc/hosts to ensure sudo works

    host { ${::hostbase}:

    ip => $::ipaddress,

    }

    }

    ```


    It sets up the openrc files that we will use for credentials later in this chapter
    to run our OpenStack client commands. We’re adding the Network Time Protocol (NTP)
    configuration so time is kept synced on our systems and are also including installation
    of the OpenStack Client. The uca profile configures Ubuntu Cloud Archive (UCA).
    As explained in Chapter 1, we’re using the UCA in order to get the recent OpenStack
    release version, Mitaka, for the Ubuntu Long Term Support release we’re running,
    14.04. Drilling down into this profile will show you that there’s a section where
    the $release is defined. This is gathered from the Hiera common.yaml file and
    where set it to mitaka.


    ```

    $ cat /etc/puppet/modules/deployments/manifests/profile/uca.pp

    # Ubuntu Cloud Archive

    class deployments::profile::uca {

    $release,

    $repo,

    {

    include ::apt

    class { ''::openstack_extras''::repo::debian:ubuntu'':

    release => $release,

    repo    => $repo,

    package_require => true,

    }

    Apt::Source{ | -> Package <|}

    }

    ```


    The final included section is the OpenStack Client (OSC), which we put on all
    of the systems so you can run OSC commands on whatever system you’re on, along
    with'
  merge: -1
