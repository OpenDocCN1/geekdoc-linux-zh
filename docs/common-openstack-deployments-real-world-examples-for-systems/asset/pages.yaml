- pgno: 50
  md: "# # 2\n# DevStack\n\n> *Quality is never an accident.*\n> \n> *It is always\
    \ the result of intelligent effort.*\n> \n> > John Ruskin\n\nThe OpenStack project\
    \ uses a tool called DevStack to help developers get a development version of\
    \ OpenStack running to test their patches against. In this chapter we explore\
    \ how it can be used by an OpenStack newcomer to explore basic concepts and get\
    \ OpenStack running on a single machine.\n\n# ## What Is DevStack?\n\nDevStack,\
    \ found at <http://docs.openstack.org/developer/devstack/>, began as an independent\
    \ project to provide developers a single machine installation of the latest development\
    \ version of OpenStack. The core of the project is a shell script called stack.sh,\
    \ which can take a series of arguments to define a basic OpenStack environment\
    \ on a host system. The script is made to be somewhat self-documenting, with a\
    \ variety of options for using configurations and services that are not the default.\n\
    \nOver the years it has become a vital part of the development workflow and infrastructure\
    \ for the OpenStack project. The project also is being used for training administrators\
    \ in the basics of OpenStack and as an essential part of the continuous integration\
    \ tests performed on every change to OpenStack.\n\nAs a single machine install\
    \ of OpenStack, DevStack is not meant for production use. In addition to deploying\
    \ the development version of OpenStack by default, it is not built to be maintainable\
    \ and breaks best practices for separation of services (like nova-compute and\
    \ nova-conductor discussed in Chapter 1, “What Is OpenStack?”).\n\nCaution\nDon't\
    \ run DevStack on any important or production machines. The script makes changes\
    \ to your software repositories, networking setup and more, which leaves the system\
    \ in a poor state for continued maintenance.\n\nInstead, use a Virtual Machine\
    \ (VM) or spare system that you can reinstall at a later date."
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Developer Usage


    DevStack was created by developers, and developer utilization remains one of its
    most common usages. Developers in the OpenStack project have a fondness for DevStack
    because while it does not provide a real-world OpenStack deployment, it enables
    them to quickly get a development framework up to test their patches against.
    DevStack also offers a version to spin up supported releases so that developers
    can also test how their changes impact upgrades and assist when writing security
    patches and major bug fixes for previous releases. Typically, developers using
    DevStack will have a system for deploying these test environments quickly so they
    can run their tests. Many also maintain local mirrors of some repositories for
    their operating system of choice so that the DevStack installation runs more quickly.


    # Training Usage


    Some training programs have come to using DevStack as a training tool for students
    to get up to speed with OpenStack quickly. The goal is to go from a base Linux
    install to running OpenStack as quickly as possible so they have an opportunity
    to work with a live system that is running the basics of what an OpenStack deployment
    requires.


    Once you have learned some of the basics of OpenStack from your DevStack install,
    you have confidence about how things are supposed to work. At that point you can
    dive deeper into how to deploy OpenStack in a production environment in a maintainable
    fashion.


    # Continuous Integration Usage


    DevStack is an integral part of the continuous integration system within the OpenStack
    project itself. The project prepares DevStack-based images for testing OpenStack
    changes in development and deploys the images on hundreds of systems per day in
    order to do testing. As such, DevStack is used for everything from integration
    tests to upgrade tests using the Grenade test harness.


    All changes to OpenStack must pass all changes in the continuous integration system
    before being merged, so development code pulled in by DevStack has already been
    automatically tested with a default DevStack environment. Several companies in
    the OpenStack ecosystem also use DevStack as part of their quality assurance system.


    # DevStack Requirements


    In order to get started with DevStack, you will need a Virtual Machine (VM) or
    spare system available with at least 4GB of RAM, but note that DevStack runs better
    with 6-8GB of RAM. For best performance, you will also need to use a 64-bit CPU
    with hardware virtualization support.


    You have several options for a base operating system, as Ubuntu LTS, Fedora and
    RHEL/CentOS currently maintain support for DevStack, with several other distributions
    having semi-maintained support for specific versions.


    Finally, if you are using a VM and wish to use the web-based Horizon dashboard
    as described later in this chapter, you will need to either install the Desktop
    version of'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'your chosen base operating system or provide access to port 80 to that machine
    from another machine. This is so you can use the web browser on localhost or install
    the server version with a bridged interface so the server is accessible from the
    outside. If you''re using physical hardware, make sure the system is accessible
    via the network.


    # ## Deploying DevStack


    Now that you have the required resources to run DevStack, you have some configuration
    decisions to make.


    DevStack is designed to be run out of the box, with no configuration changes,
    with a series of simple commands, the last of which will take some time:


    ```

    ```

    $ sudo apt-get install git

    $ git clone https://git.openstack.org/openstack-dev/devstack.git

    $ cd devstack

    $ . /stack.sh

    ```

    ```


    The first few steps will ask you for a series of passwords for each component.
    You will want to take note of what you put in for these passwords. Once it has
    the passwords, it will take some time as it modifies your software sources and
    networks and then downloads requirements and the latest development version of
    OpenStack components used in DevStack. The script will also pause at some points
    in the beginning to ask you for service passwords (see the section “Customizing
    DevStack” later in this chapter for tips on how to use a local.conf file with
    these variables instead).


    The DevStack project provides a commented version of the stack.sh script for perusal
    while the default install takes place; you can view it locally in the devstack
    directory or online at http://docs.openstack.org/developer/devstack/stack.sh.html.


    # Common Failures


    If your permissions are not correct, you will have problems running DevStack.
    Here are a few tips:


    +   - Do not use root or sudo when running any of the commands outlined above.

    +   - While you shouldn’t run the commands as root or sudo, the user you’re running
    stack.sh with must have sudo access, preferably passwordless.

    +   - When you are running stack.sh, confirm the devstack/ directory is owned
    by the user you are attempting to run it with.

    +   - If you wish to create a “stack” user specifically designed for running DevStack,
    you can use the tools/create-stack-user.sh script that ships with DevStack. This
    script needs to be run with sudo from an account with sudo access.


    Networking is the root cause of many failures. The following are some of the most
    common problems:


    +   - Your local network conflicts with the default setup of DevStack’s internal
    network (10.0.0.1/24).

    +   - The VM or physical system cannot access the Internet. Internet access is
    required to run stack.sh. This can manifest as anything from name resolution errors
    to timeouts to the operating system repositories.'
  merge: -1
  img_proc: true
