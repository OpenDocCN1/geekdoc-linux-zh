- pgno: 221
  md: "# Managing Ironic\n\nBeyond basic hardware enrollment and launching of images\
    \ onto your new hardware nodes, you can also use Ironic to check the power state\
    \ of machines, their availability and whether they’ve been placed in maintenance\
    \ mode with the ironic node-list command.\n\nDetails about a specific machine\
    \ can be viewed with ironic node-show name where name is the name of the node\
    \ from output of the ironic node-list command.\n\n> Tip\n> The UUID of the physical\
    \ node can also be used in place of the name in the ironic node-show command.\
    \ We suggest name here because it’s easier and unlike many other OpenStack services;\
    \ node names are unique in Ironic.\n> \n> Also remember, the Ironic node names\
    \ do not relate to instance UUIDs or the names of the instance that is using the\
    \ node.\n\nIronic also supports cleaning of nodes, by which the data is removed\
    \ in order to prepare the hardware for a new instance. This functionality depends\
    \ upon the driver you are using and not all of them support it, though currently\
    \ you can be confident that all of the agent_ drivers support it.\n\nSee the official\
    \ documentation for Ironic at http://docs.openstack.org for the latest on how\
    \ to manage your servers. It is constantly in development to add features and\
    \ increase stability. As the project matures you will continue to see new drivers\
    \ from hardware vendors and stronger support for automation of processes like\
    \ is done with Ironic Inspector.\n\n# Community\n\nThe Ironic development community\
    \ is largely made up of representatives from various hardware companies and parties\
    \ interested in an automated hardware deployment for OpenStack itself. Known as\
    \ a particularly friendly community, both getting support from developers and\
    \ contributing your own changes to the project are straightforward exercises.\n\
    \nThe Ironic team also has a sense of humor, using a play on the words “bare metal”\
    \ to have a mascot named Pixie Boots, a metal band drummer bear.\n\n![](img/8684900d708748f86bb043faa5589f9e_221_0.png)"
