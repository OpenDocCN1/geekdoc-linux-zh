- pgno: 214
  md: "# 10\n\n# Bare Metal Provisioning\n\n> \"If we want things to stay as they\
    \ are, things will have to change\"\n> \n> *Giuseppe di Lampedusa, The Leopard*\n\
    \nAs OpenStack made inroads into more data centers, the next logical step for\
    \ the OpenStack project was to better support that environment, and so began a\
    \ bare metal provisioning project, Ironic. Ironic began as a plug-in for Nova\
    \ compute but quickly spun into its own project as the scope increased, with the\
    \ need for drivers for various hardware on which the service would be provisioned.\
    \ With the first official release in OpenStack Kilo in the spring of 2015, today\
    \ bare metal provisioning is used in production in several data centers and can\
    \ actually be run independently from a broader OpenStack deployment.\n\n# ## Uses\n\
    \nThe most obvious use for bare metal provisioning is in a data center where automated\
    \ control of machines is valuable. Ironic makes handling the booting and day-to-day\
    \ management of physical hardware just as easy as working with virtual machines.\
    \ It enables physical hardware to use software images commonly used in a virtualized\
    \ environment and provides a familiar environment and framework for users of OpenStack.\
    \ Ironic has been used to deploy images of OpenStack nodes themselves, effectively\
    \ enabling an operator to help install and provision pre-built, tested, qualified\
    \ images to actual hardware.\n\n# ## Cloud Hosting Company\n\nIf a company is\
    \ already using OpenStack in their infrastructure to provide cloud hosting services,\
    \ Ironic is a natural fit. The bare metal service has a driver for Nova that offers\
    \ Ironic hosts a sort of hypervisor which allows for variations to the underlying\
    \ hardware to be presented to the user, such as super high memory, or GPU compute\
    \ capabilities. By using this driver, instead of offering support for a virtualization\
    \ technology, you get control over hardware that's being provisioned for customers.\
    \ While you still need to provide basic information to Ironic to inventory your\
    \ hardware, and it doesn't actually act as a formal configuration management database\
    \ (CMDB), it vastly simplifies the management of the hardware."
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Internal Cloud


    An organization running an internal cloud deployment in a data center may find
    incredible value in management of their servers using Ironic. One of the most
    challenging parts of running an internal cloud for systems administrators can
    be handling the inventory of hardware, which Ironic makes easier by taking care
    of it once the initial enrollment is completed. With a few OpenStack commands,
    you can see the state of systems enrolled with Ironic, whether they are running
    or have failed in some way. For those failures, you can dig into the error messages
    to determine how to handle them further. An internal cloud doesn’t have to be
    running on OpenStack to take advantage of Ironic, since Ironic can be run independently
    and manage hardware regardless of what software is ultimately deployed on it.


    # Database Hosting


    Many of the concerns surrounding the hosting of databases on virtualized systems
    have been addressed with solutions like specifically tuned virtual machines that
    have hardware supporting high I/O and memory. However, this is still a hardware
    solution, and there are many instances where organizations continue to want to
    host databases directly on bare metal. Ironic can assist in these organizations
    by providing a provisioning mechanism for installation of database servers on
    demand. From there an organization can either leverage tooling such as OpenStack
    Trove, which provides an interface for databases as a service, or an internal
    solution for provisioning.


    > **Tip**

    > Interested in learning more about OpenStack Trove for databases as a service?
    Currently the developer documentation on our best source of overview, installation
    and usage information—

    > http://docs.openstack.org/developer/trove/.


    # High-Performance Computing


    In the realm of High-Performance Computing (HPC), where users are doing analytics
    processing or using their systems as render farms, Ironic has been used as a provisioning
    service. In these environments the full computing power of the system is being
    used, and so virtualization is not desired in most cases since the hypervisor
    introduces overhead that is unnecessary. Ironic deployed without the other components
    of OpenStack in this environment provides an effective way to manage the hardware
    in the HPC cluster, though there are many HPC users who are deploying Ironic with
    the Nova computing components and the Glance image service.


    # Architecture Overview


    As a high-level overview, administration of Ironic is done through an API that
    calls out to a series of bare metal drivers that use common solutions like PXE
    (Preboot eXecution'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Environment) and IPMI (Intelligent Platform Management Interface) to interact
    with the bare metal servers. These may also use one of the growing number of vendor-supported
    drivers for specific hardware. As briefly explained in Chapter 1, “What is OpenStack?”
    Ironic is comprised of several different services that work together to accomplish
    provisioning and hardware interaction.


    The ironic-conductor, of which there are typically several instances of in a production
    deployment, is what truly drives Ironic. The conductor uses the messaging queue,
    typically RabbitMQ just like the other services use, to communicate with the API
    and vice-versa. When the conductor receives a message from the API it can then
    act upon it. The database also interacts with the API, but in a much minimal way:
    to request status and complete the creation of new database entries, such as nodes
    and ports. The appropriate drivers for your environment running on the conductor,
    in turn, interact with the hardware.


    The Ironic RESTful API is used by both the user enrolling hardware, which we will
    cover later, and the ironic-python-agent that will call the API to enable the
    conductor to know where the machine is located so the conductor can connect to
    the node being deployed. A database (MySQL by default) is used to store information
    about the servers and is updated by the RESTful API with the ironic-conductor.


    The vendor-contributed drivers may be open source or proprietary, but typically
    they provide the specific hooks into the existing management interfaces on the
    devices. For instance, the iLO drivers are built to work against specific versions
    of the iLO management engine on HPE Proliant servers. These drivers use the existing
    HPE proliantutils Python utility libraries to assist with this interaction. The
    Cisco UCS driver is designed to be used with certain versions of the UCS Manager
    on managed Cisco UCS B/C series servers. The existing Python SDK developed for
    this management interface (UcsSdk) is


    ![](img/8684900d708748f86bb043faa5589f9e_216_0.png)


    Figure 10.1 Ironic overview'
