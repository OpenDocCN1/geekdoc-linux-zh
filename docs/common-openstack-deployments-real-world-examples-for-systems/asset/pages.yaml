- pgno: 146
  md: "# 6\n# Private Compute Cloud\n\n> This village belongs to the Castle, and whoever\
    \ lives here or passes the night here does so in a manner of speaking in the Castle\
    \ itself. Nobody may do that without the Count’s permission.\n> \n> Franz Kafka\n\
    \nIn the early days of OpenStack, one of the more common uses for the technology\
    \ was getting server instances into the hands of developers quickly so they could\
    \ rapidly prototype their ideas. Enter the private compute cloud, an Infrastructure\
    \ as a Service (IaaS) OpenStack deployment that is used by a single organization.\
    \ Today the private compute cloud remains a popular deployment type for many organizations,\
    \ but it has grown to encompass full replacement of a company’s virtualization\
    \ solution across both their development and production infrastructure.\n\nIn\
    \ this chapter, we focus on delivering raw compute power (processor and RAM) inside\
    \ an organization through basic, ephemeral (temporary) virtual machines. We dive\
    \ into the key components of a common private compute cloud, including how to\
    \ use Nova, Keystone and Horizon.\n\n# ## Uses\n\nMembers of the OpenStack community\
    \ meet for a summit every six months. Keynotes during this summit are frequently\
    \ given by major players in the OpenStack community or by invited organizations\
    \ who have used OpenStack in some capacity. While OpenStack was young, private\
    \ deployments focusing on getting compute-focused power to their users were common\
    \ examples.\n\nReasons for wanting a private compute cloud vary across types of\
    \ organizations. Some are looking for a flexible infrastructure to manage an existing\
    \ virtualized environment, and others are seeking to manage the administrative\
    \ burden placed upon them.\n\n# ## Government Organization\n\nAt one summit, a\
    \ major US government agency presented on how the use of OpenStack allowed them\
    \ to provide on-demand access to a pool of virtual machines to their developers"
  merge: -1
  img_proc: true
- pgno: 147
  md: 'who were seeking to try out new ideas. On the IT side, provisioning of servers
    prior to using OpenStack was manually intensive. On the development side, a developer
    had to fill out a lot of paperwork and get several layers of approvals in order
    to get a server provisioned, which could take weeks or months. By the time the
    server was provisioned, they might not even remember the idea at the beginning
    or it may have become obsolete. In order to reduce the burden on IT, they sought
    out a solution that was self-service and on demand, elastic and had API access.


    They selected OpenStack to suit their needs and within two weeks the team had
    a working prototype with several users. The next step brought them into a formal
    lab that had access to production data within the organization. The final step
    was bringing it into more formal production, where they took a closer look at
    automation, security and user creation and authentication through their existing
    Public Key Infrastructure. Ultimately, this resulted in the staff need and workload
    of IT being decreased, and users having a much better experience with the flexibility.
    Having a common, easily replicated infrastructure has also allowed increased ability
    for sharing between developers and departments.


    # Major Company


    Another summit featured a major car manufacturer who spoke about their existing
    physical and virtualized infrastructure. They had written their own cloud software
    to manage their virtualized servers but were seeking to move to a more maintainable
    infrastructure as they began running into some problems. They needed to retain
