- pgno: 240
  md: '# # 13


    # Troubleshooting


    > > *Humpty Dumpty sat on a wall,*

    > > *Humpty Dumpty had a great fall.*

    > > *All the king’s horses and all the king’s men*

    > > *Couldn’t put Humpty together again.*

    > >

    > > English nursery rhyme


    As we have learned, OpenStack is a complicated infrastructure project. Even if
    you followed the instructions in this book precisely and everything worked well,
    using OpenStack in production will not be the same. Troubleshooting your OpenStack
    deployment to find where failures are lurking is a vital skill.


    Your toolbox for debugging may include sifting through log files or running specific
    commands manually. There are also services such as OpenStack’s Identity (Keystone)
    and Networking (Neutron) that can cause failures throughout your infrastructure
    if there is a configuration problem. We talk about debugging those.


    # ## Reading Displayed Errors


    Whether you’re using the dashboard or the command line, an error may manifest
    immediately, which may start pointing you in the right direction.


    When looking for an error, the first step will be determining which service is
    the problem. Are you having trouble launching an instance? If you’re using the
    dashboard, your first indicator may be a pink box that pops up to tell you something
    is wrong. In Figure 13.1 it says “Error: Failed to perform requested operation
    on instance “zebra”, the instance has an error status: Please try again later
    [Error: No valid host was found. There are not enough hosts available.]”


    By clicking on the name of the instance that failed, in this case “zebra”, you
    will see more details about the node itself. This will remind you of the settings
    you selected. It will also give you access to exposed log files and an Action
    Log that will show actions performed against the instance. The Console will not
    be available since that is only active when an instance is running. See Figure
    13.2 for this detailed view.'
  merge: -1
  img_proc: true
