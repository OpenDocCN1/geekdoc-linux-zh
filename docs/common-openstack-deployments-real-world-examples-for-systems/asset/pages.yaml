    +   - Online—https://git.openstack.org/cgit/openstack/puppet-horizon/tree/?h=stable%2Fmitaka\n\
    \n# Keystone Profile\n\nWith the Keystone identity profile, we're getting complicated\
    \ again.\n\n```\n$ cat /etc/puppet/modules/deployments/manifests/profile/keystone.pp\n\
    \nclass deployments::profile::keystone\n{\n    include ::apache\n    include deployments::profile::users\n\
    \    include ::keystone\n    include ::keystone::cron::token_flush\n    include\
    \ ::keystone::roles::admin\n    include ::keystone::endpoint\n    include ::keystone::db::mysql\n\
    \    include ::keystone::apache\n}\n```\n\nSince Keystone uses WSGI to run the\
    \ service, it also requires the Apache module and also a specific keystone::wsgi::apache\
    \ class. In addition, it pulls in several other components of the Keystone Puppet\
    \ module, including a cron job, administrative role information and configuration\
    \ for the endpoint. Finally, you edited the hiera/common.yaml to change the passwords\
    \ for the admin and test users, that was defining what \"deployments::profile::users\"\
    \ brings in.\n\n> **Note**\n> \n> In Chapter 4 you may recall that we configured\
    \ Keystone with Fernet tokens. This is where the community recommendations are\
    \ trending and was easy to do in our manual deployment. However, support for Fernet\
    \ tokens came out somewhat recently, in the Kilo release. It is not yet default\
    \ in OpenStack. For our Puppet-driven deployment scenarios we're still using the\
    \ current default—UUID tokens."
