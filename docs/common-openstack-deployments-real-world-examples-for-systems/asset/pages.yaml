    \ tap interface, tcpdump can help you figure out how large the packet is early\
    \ on. The ip link -s command can be used to show interface statistics, including\
    \ packets dropped because they were too large.\n\n# Open vSwitch and Linux Bridges\n\
    \nIn our deployment scenarios we use Open vSwitch (OVS, http://openswitch.org/)\
    \ as the core mechanism for handling bridges. Many operators have reported struggling\
    \ with quirks related to current versions of OVS. You will want to make yourself\
    \ familiar with the basic OVS details. That means commands like ovs-vsctl show\
    \ as well as those to help with debugging to look at flow control and other details,\
    \ but that level of debugging is beyond the scope of what typical operators should\
    \ need starting out.\n\n> **Tip**\n> If you are in a development environment,\
    \ don't be afraid to restart the OVS daemon (using sudo service openvswitch-switch\
    \ restart). Once you've confirmed your configuration is correct and the output\
    \ of ovs-vsctl show is inconsistent with what you have configured and understand\
    \ to be accurate about how the deployment should be working, then go ahead and\
    \ restart the OVS daemon.\n> \n> In production, this may still be the correct\
    \ solution to certain OVS problems, but be aware that restarting this service\
    \ will cause minor network service disruption. It may take anywhere from a few\
    \ minutes to an hour to fully come back if you have a very large scale deployment.\
    \ Long term, if you struggle with OVS in production, you may consider moving to\
    \ a Linux Bridge model instead but that configuration is beyond the scope of this\
    \ book.\n\nNow, while we do specify OVS in our configurations, Linux Bridge is\
    \ actually also used for iptables, which we'll discuss next, for your instances.\
    \ If problems arise here, the bridge-utils package, which includes brctl to look\
    \ into and manipulate bridges for instances, is installed on your compute node.\n\
    \n# Iptables\n\nAnother bit of debugging centers around another standard Linux\
    \ tool—iptables (http://www.netfilter.org/projects/iptables/). Starting with the\
    \ most basic of commands, you can run sudo iptables -L in order to get a listing\
    \ of iptables rules. Just like the other commands, this can also be used in conjunction\
    \ with the ip netns exec command to look at the router network run space, which,\
    \ as you may recall, runs iptables for the instances. That means you could run\
    \ something like the following on the controller node to get a listing of rules\
    \ from both iptables:\n\n```\n$ sudo iptables -nL\n$ sudo ip netns exec qrouter-lc1c7574-9114-438f-aa33-1eb969a478f6a\
    \ iptables -L\n```"
