    > GRANT ALL PRIVILEGES ON neutron.* TO ''neutron''@''%'' IDENTIFIED BY ''NEUTRON_DBPASSWORD'';

    > quit

    ```

    ```


    Configure Neutron with the Keystone identity server. Remember the password you
    put in when prompted; you’ll need this later for the configuration file.


    ```

