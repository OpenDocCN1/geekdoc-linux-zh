- pgno: 64
  md: "# 3\n\nNetworking\n\n> *If there is magic in this planet, it is contained in\
    \ the water.*\n> \n> Loren Eiseley\n\nBefore we launch into the deployment scenarios,\
    \ it's important to pause to discuss networking. Networking is a major consideration\
    \ when configuring OpenStack. It will influence the hardware and environment choices\
    \ you make and naturally has a significant role in the choices made for you and\
    \ the deployment scenarios in this book.\n\nNetworking in OpenStack is also a\
    \ complicated topic that trips up systems and network administrators alike who\
    \ are working to deploy OpenStack. Additionally, the physical network and equipment\
    \ you have in your environment, such as a data center, will determine what you\
    \ can do with the networking tooling that OpenStack supports.\n\n# Key Concepts\n\
    \nThe first thing you should know about networking on OpenStack is that there\
    \ is no standard deployment. Needs of organizations, the environments they have\
    \ to work in and the hardware being used will vary greatly. The concepts outlined\
    \ in this chapter are generalized, and not all deployments will obey the same\
    \ rules. The goal here is to give you a glimpse into what you may encounter when\
    \ deploying OpenStack yourself so you have a starting point to understand how\
    \ it all works.\n\n# Planes of Operation\n\nIt is useful to consider traffic flows\
    \ throughout an OpenStack environment using the same terminology found in general\
    \ networking. Specifically, network engineering conceptualizes traffic flows as\
    \ occurring on one of the management, control or data planes. OpenStack has a\
    \ very similar division of network types, but these networks are sometimes combined.\
    \ For the sake of simplicity, our deployment scenarios will be using a single\
    \ private network for the control, management and data traffic, but we should\
    \ still explain each.\n\n# Management Plane\n\nAdministrators need a way to maintain,\
    \ update and interrogate their servers and network elements, and this is done\
    \ over the management plane."
  merge: -1
  img_proc: true
- pgno: 65
  md: 'OpenStack also has a concept of a management network. It’s one of several private
    networks in an OpenStack deployment and is used by the administrators to log into
    the machine to complete systems administration tasks. This network is also available
    for monitoring. Splitting out this network prevents system administration and
    system access monitoring from being impacted by traffic being used elsewhere in
    the deployment, such as bursts of API and compute instance traffic.


    In the deployment scenarios in this book, we give our OpenStack nodes firewalled
    access to the Internet in order to allow for the installation of packages, Puppet
    modules and other sources required by the scenarios. This may also be what you
    do in production, but in a more secure environment access to all of your installation
    resources would be restricted to the local network. In this secure environment,
    you may host a local distribution package mirror, configuration management repositories,
    and netboot or system installation servers on your local management network. Doing
    so also allows you to stage and thoroughly test all the changes in packages and
    other resources stored on local mirrors before putting them into production.


    # Control Plane


    In networking terms, the control plane carries signaling traffic between network
    elements.


    In OpenStack you may consider using a very similar control network. It would be
    the network where your messaging queue for interaction between services would
    live and any other traffic related to service interaction. For lieu of a dedicated
    management network, it’s common for management traffic to share the same private
    network as control traffic.


    # Data Plane


    Finally, there’s the data plane. This is where all of your actual network payload
    going to users and customers will be running. In OpenStack you can think of this
    as where instance traffic and public services like access to files in the Swift
    object storage are served up.


    # Provider Network


    A Provider Network is simply the logical representation of a network that is provided
    to OpenStack for use. This is not necessarily a different type of network from
    those mentioned above, but it has the distinction of being provided by a source
    outside of OpenStack and is marked as such. This source may be a switch or other
    network hardware or software that has control over the network you’re connected
    to. A provider network may map to a physical network, which may be a network that
    is routable within a data center or a network that is accessible to the Internet.
    It’s common to have multiple provider networks. Since provider networks are externally
    provided, configuring them in OpenStack is simply a matter of informing Neutron
    about basic data center network topology so it can use this information for the
    compute instances.


    # Tenant Networking


    An OpenStack deployment will typically have a series of Tenant Networks, which
    run on top of the data plane. Each instance connects to one or more tenant networks,
    where they'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'will get their native IP address(es), which can be seen within the instance.
    By default, this address will only be locally routable between instances that
    exist in that tenant network and to specific services, such as the DHCP server
    used to assign those addresses and the router that may pass along that traffic
    to an external provider network.


    Tenant networking for instances is where things get complicated. Traffic on tenant
    networks needs to be appropriately forwarded between instances; you generally
    want some kind of isolation, and in many deployments there is an allowance for
    overlapping subnets to be used as internal networks. OpenStack Neutron offers
    three options for handling traffic in the tenant network: flat, virtual local
    area network (VLAN) and tunneled.


    # Flat Network


    In a flat network, everyone shares the same network segment. No network segregation
    is applied nor any kind of tagging. This means that tenants can see the traffic
    from other tenants and the controller, plus address space cannot overlap. This
    decreases the amount of flexibility considerably, and if these are instances controlled
    by different parties, this is not an ideal situation. Use of flat networking is
    typically not advisable unless you fully understand the implications and limitations
    but could be reasonable in a small enterprise environment controlled by a single
    team and when external hardware resources are used extensively.


    # Segmented Network


    With flat networking behind us, we’re left with the other two options for handling
    traffic to focus on: VLANs and tunneling. In both of these scenarios, separation
    is provided, which also means that tenants can overlap in network subnet range,
    using the same local IP addresses without conflict. Whichever one you decide to
    use, it will be implemented via the Modular Layer 2 (ML2) plug-in with Open vSwitch
    (OVS) or Linux Bridge.


    In this book we’ll be using the OVS model. OVS is often easier to use and more
    flexible than Linux Bridging. Neutron creates bridges within OVS, as well as internal
    VLANs. These internal VLANs that are created are entirely local to the node and
    use VLAN numbering that is distinct from the external segmentation IDs (such as
    VLANs outside the node). These internal VLANs exist even if you are not using
    external VLANs, such as if you are deploying a VXLAN-based topology.


    # VLAN


    In a VLAN network, each tenant is assigned to a VLAN. To support this environment,
    you must have hardware switches in your infrastructure that supports VLANs for
    each tenant network. This typically would be set up by using the tooling that
    comes with the switch or, if supported, allowing OpenStack to use a plug-in from
    that vendor (see the “Exploring the Possibilities with Neutron” sidebar in Chapter
    5, “Foundations for Deployments”). This is particularly useful in a data center
    where VLANs are already used. It’s also useful if you have other hardware, such
    as a storage device, that you wish to include in your VLANs. You can also make
    use of external firewalls and routers to intelligently handle tenant traffic.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Tunnelling


    In a tunnel-driven network, encapsulation of traffic is used to provide separation.
    The most common encapsulation protocols are Generic Routing Encapsulation (GR.E)
    and Virtual Extensible Local Area Networking (VXLAN). GR.E and VXLAN are very
    similar, but VXLAN is more commonly used in cloud deployments because of its greater
    flexibility and efficiency. Using Neutron with OVS, a mesh of tunnels is set up
    between the OpenStack nodes in your environment. As traffic is sent along these
    tunnels, the Ethernet frame will be encapsulated in a new IP packet, which is
    routed to the destination node. The packet is then decapsulated and delivered
    into the appropriate instance (running on a compute node), control process (like
    DHCP running on the control node) or routed out of the tenant network (via a virtual
    router on the controller node or a physical router). See Figure 3.1 for an example
    of what a packet coming from an instance would look like.


    Although the traffic is carried over the physical network, because it''s encapsulated
    there is no visibility to the specific tenant network traffic from the perspective
    of the data center hardware. It just appears to be traffic between two OpenStack
    nodes.


    It''s worth noting that, in practice, it has generally been found that tunneling
    (such as GR.E and VXLAN) scales better than VLANs. VLANs are more commonly found
    in an enterprise environment where the number of tenant networks is finite and
    the data center uses a common layer-2 switch fabric throughout. VLANs also require
    configuration of all your networking hardware to support each tenant and can run
    into limitations with regard to the number of VLANs that can exist on a given
    switch or link. Tunneling instead pushes complexity and scaling concerns into
    OpenStack, so it is not required on the data center network equipment. Using tunneling
    can also be easier to deploy and debug. When you go into production, you''ll need
    to do an analysis of your own environment with your networking team to determine
    which method to use.


    # Maximum Transmission Unit (MTU)


    Before going any further, it''s also important to take a moment to discuss Maximum
    Transmission Units (MTUs). If you refer to Figure 3.1, you will notice that this


    ![](img/8684900d708748f86bb043faa5589f9e_67_0.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: "encapsulated packet has a lot in it that is not in a typical Ethernet frame.\
    \ As an encapsulated frame, we're adding the VXLAN data. This causes the frame\
    \ held within to be restricted to a certain size in order for traffic to flow\
    \ reliably on a typical network.\n\nMost networks will default to accepting an\
    \ MTU size of 1500 bytes. That's the size that many systems assume packets should\
    \ be when transmitting them onto an Ethernet network. In the deployment scenarios\
    \ in this book we're setting an MTU size of 1450 bytes, referring back to Figure\
    \ 3.1. Each header can take up to a certain amount of space:\n\n+   *   IP header:\
    \ usually 20 bytes\n+   *   UDP header: 8 bytes\n+   *   VXLAN header: 8 bytes\n\
    +   *   Embedded Ethernet header: usually 14 bytes\n\nWhen you add all of these\
    \ up you get 50. So the biggest packet you can send must be restricted to 1500\
    \ bytes of total space minus that 50 bytes, so 1450 bytes.\n\n> Tip\n> \n> How\
    \ do you know if you're having an MTU problem? The first few symptoms will be\
    \ that you may be able to ping an instance but not SSH into it. Or your SSH command\
    \ starts, but can't complete the handshake. See the Networking section of Chapter\
    \ 13, “Troubleshooting,” to learn more about what you can do to debug MTU problems.\n\
    \nWhen you move your deployment into a data center and start running real services\
    \ on it, you will likely find this restricted size inadequate. There are many\
    \ applications that perform poorly when restricted to the smaller packet size.\
    \ At this point it becomes necessary to start using jumbo frames. Jumbo frames\
    \ are Ethernet frames with more than 1500 bytes of payload, conventionally supporting\
    \ up to around 9000 bytes. Using jumbo frames on the underlying data plane network\
    \ is almost universally done in production cloud deployments. This is achieved\
    \ by ensuring that all nodes are running with physical Ethernet interface MTUs\
    \ greater than 1550 so that no reduction to the MTU size is needed for instance\
    \ and tunneled interfaces.\n\n# Deployment Requirements\n\nFor the deployment\
    \ scenarios in this book, we will be using two nodes. The first node will be a\
    \ controller that's used to run the OpenStack services for each deployment scenario.\
    \ The second will be a compute node that will only be used for running your compute\
    \ instances. Full specifications for what each server needs to be covered in detail\
    \ in Chapter 4, “Your First OpenStack,” but for now you only need to know that\
    \ on your controller node you will need two NICs and for the compute node you\
    \ will need one NIC."
  merge: -1
  img_proc: true
