- pgno: 89
  md: 'Next you’ll want to update the `[database]` section to use your new MySQL database
    rather than the SQLite database that the Ubuntu package creates. If a `sqlite`
    connection stanza exists, you will need to comment it out, since you cannot have
    two connection types defined. Then add the following:


    ```

    connection = mysql+pymysql://keystone:KEYSTONE_DBPASSWORD@controller/keystone

    ```


    Finally, we want to use Fernet tokens with our Keystone install, so add the following
    to the `[token]` section:


    ```

    provider = fernet

    ```


    An example `keystone.conf` file with these changes made can be found in the `scripts-and-configs`
    repository for this book mentioned earlier.


    # Fernet Tokens


    Fernet is an implementation of Symmetric Key Encryption used to encrypt plaintext
    and the same cryptographic key to decrypt ciphertext. Using this implementation,
    Fernet tokens were released as a supported token format in OpenStack Kilo and
    have undergone improvements in performance and reliability in the releases since.
    Fernet’s main advantage over UUID is that tokens don’t need to be *persistent*;
    that is, they don’t need to be stored in a database. This solves problems of database
    replication lag for tokens and also means that no cronjobs are needed to prune
    expired tokens. Although UUID tokens are still more widely used, including in
    our deployment scenarios later in this book, the Keystone community is working
    towards making Fernet the default token format.


    Fernet tokens are cryptographically signed by Fernet keys. Fernet signing keys
    are typically located in `/etc/keystone/fernet-keys` and are rotated, typically
    weekly or monthly, to prevent brute force attacks on the encryption. Although
    you can have more, you need to have a minimum of three Fernet keys available:
    a *primary*, *secondary* and *staged*.


    Key rotation may take some more explanation in order to become clear, but the
    main thing to remember is that if you run Keystone in a cluster you do not need
    to perform simultaneous key rotations. If you need more information, various members
    of the OpenStack community have written blog posts and given conference talks
    about their usage and implementation. To learn more you may start with the FAQ
    in the OpenStack Administrators Guide at `http://docs.openstack.org/admin-guide/keystone_fernet_token_faq.html`
    and search online for more.


    The next step is adding the schema to your Keystone database. There is a `keystonem-
    anage` command that can help with this, which needs to be run as the root user:


    ```

    $ sudo -u root /bin/sh -c "keystone-manage db_sync" keystone

    ```


    Now we’ll want to set up Fernet.'
