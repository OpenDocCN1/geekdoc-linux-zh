- pgno: 105
  md: '# **Neutron**


    Perhaps one of the most complicated sections of an OpenStack deployment to configure
    is the networking service, Neutron. Earlier in the chapter we configured several
    Open vSwitch bridges and virtual connectors that will be important here. First,
    we’ll need to create a MySQL database and user like we’ve done for all the other
    services:


    ```

    ```

    $ mysql -u root -p

