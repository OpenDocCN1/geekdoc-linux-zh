  md: "the openrc credentials. This is an outside module called openstacklib that\
    \ is not part of our deployments module.\n\n# Glance Profile\n\nThe profile for\
    \ Glance, the imaging service, is where you start getting very interesting configuration\
    \ options:\n\n```\n`$ cat /etc/puppet/modules/deployments/manifests/profile/glance.pp`\n\
    \nclass deployments::profile::glance{\n  $cirros_version = '0.3.4',\n}\n{\n  include\
    \ ::glance\n  include ::glance::api\n  include ::glance::registry\n  include ::glance::keystone::auth\n\
    \  include ::glance::backend::file\n  include ::glance::db::mysql\n  include ::glance::notify::rabbitmq\n\
    \n  glance_image { 'cirros':\n    location  => \"https://download.cirros-cloud.net/5/${cirros_version}/${cirros_version}-x86_64-disk.img\"\
    ,\n    name      => \"CirrOS ${cirros_version}\",\n    is_public => 'Yes',\n \
    \   container_format => 'bare',\n    disk_format => 'qcow2',\n  }\n}\n```\n\n\
    This calls out to the OpenStack Glance module to pull in various components. In\
    \ our profile we’re making a few decisions about how we want this basic configuration\
    \ to work. We’re pulling in the API and Registry for Glance. We’re then making\
    \ sure we have Keystone and MySQL for Glance set up to interact with our existing\
    \ Keystone and MySQL services. Puppet makes this very easy, but you can see how\
    \ it’s done manually back in Chapter 4 if you’d like a refresher. Finally, we’re\
    \ also using the storage backend “file”, which is the default type of backend\
    \ end for Glance and means it’s storing images on a filesystem. By default, they\
    \ are stored in /var/lib/glance/images/ which is where you will find images you\
    \ upload to Glance. Glance has the option of using different back ends, like the\
    \ OpenStack Object Storage service (Swift) or Amazon’s S3. We have a single image\
    \ configured in the installation, a very small and simple Linux-based operating\
    \ system called CirrOS. As you can see, this profile defines which version of\
    \ CirrOS will be used as our initial image in Glance as well as various details\
    \ about it.\n\nIf you’re interested in further details about the OpenStack Glance\
    \ module for the Mitaka release, you can browse it on your node filesystem or\
    \ online:\n\n+   - **Filesystem**—/etc/puppet/modules/glance/\n+   - **Online**—https://git.openstack.org/cgit/openstack/puppet-glance/tree/?h=stable%2Fmitaka"
