- pgno: 248
  md: "# tcpdump\n\nThe tried and trusted `tcpdump` (<http://www.tcpdump.org/>) command\
    \ is essential in the toolkit of any OpenStack administrator. It may be used for\
    \ tracing the trickery to isolate provider network traffic going to and from the\
    \ instances and various other things. Whether it';s your physical interfaces or\
    \ ones in the network name spaces, once you determine that you are unable to ping\
    \ an instance or traffic is behaving inconsistently, you'll need to learn why.\
    \ It can help you answer questions like “Where is traffic stopping?” and “Are\
    \ specific types of traffic being blocked?” From there you can isolate which part\
    \ of the network you need to troubleshoot.\n\nA useful `tcpdump` command on `eth0`\
    \ of your control interface may look like the following:\n\n```\nsudo tcpdump\
    \ -i eth0 -vvv\n```\n\nWhile this is running, make sure you do something that\
    \ should show output, like pinging the server you're running this on. Use Control-c\
    \ to stop the capture. If traffic is running on the interface, you will likely\
    \ see a great deal of traffic. Adjust this command as needed to listen on various\
    \ interfaces. Remember, this can even be used in conjunction with the `ip netns\
    \ exec` command to see traffic on the networks in name spaces.\n\n> **Tip**\n\
    > Not a `tcpdump` guru yet? Learning how to read `tcpdump` output takes skill\
    \ and experience. When you add in learning about how OpenStack uses networking,\
    \ you may find yourself struggling.\n> \n> Do yourself a favor. Save the output\
    \ from `tcpdump` into a file and load it up in the graphical tool Wireshark (<https://www.wireshark.org/>).\
    \ This tool gives you a visualization of the packets that were captured and enables\
    \ you to drill into them. An example of a `tcpdump` command you can use with Wireshark\
    \ is as follows:\n> \n> ```\n> sudo tcpdump -i eth0 -w packet_debug.pcap\n> ```\n\
    > \n> As before, the interface you wish to listen on follows the -i flag, which\
    \ you may want to change. The -w flag goes on to define the filename you're saving\
    \ it to. Use Ctrl-c to stop the capture when you believe you have enough data.\n\
    > \n> You then load this `packet_debug.pcap` file into Wireshark for analysis.\
    \ It's still not going to be easy until you get the hang of it, but it's easier\
    \ than looking at the raw logs!\n\n# MTUs\n\nThere was a section about maximum\
    \ transmission unit (MTU) size in the networking chapter. As a reminder, if you\
    \ find inconsistent behavior in how network traffic is flowing, such as you can\
    \ ping an instance but SSH starts and times out during a handshake, you may want\
    \ to look at the MTU size. Remember the diagram of the packet, and spend some\
    \ time thinking about how your network is configured and what kind of encapsulation\
    \ is happening to figure out what your MTU size should be.\n\nBoth the `tcpdump`\
    \ command and the `ip` command can be of assistance in looking into MTU size issues.\
    \ The `tcpdump` command can help you figure out where the packets get"
  merge: -1
  img_proc: true
