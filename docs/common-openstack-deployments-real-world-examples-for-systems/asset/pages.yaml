- pgno: 242
  md: 'If you have used the OpenStack Client (OSC) to create this instance, you would
    not get an immediate response, since the output only tells you that the instance
    is being created. Instead you may look at the listing of instances and then query
    that one specifically to read the error message. Note that we are using the ID
    of the instance to show details about the instance because the instance Name is
    not a unique identifier. You could have a whole herd of instances called zebra
    (Listing 13.1!)


    As you can see, the listing showed that the instance was in an “ERROR” state.
    Full details will show you details from your instance, and “fault” will show the
    error message that is the same as what was shown in the dashboard.


    Regardless of whether you’re viewing this output at the command line or in the
    dashboard, the first thing that can help you do is see whether you’ve made a mistake.
    Given this error, it’s easy to assume that the region you’re trying to launch
    it in really doesn’t have enough resources, but what if you’re sure it does? Did
    you perhaps launch it in the wrong region? Did you use the wrong image or flavor?
    These are easy to identify and easy to correct without going any further with
    troubleshooting.


    More often than not, things are more complex. Using the error above as an example,
    you’ll want to keep in mind that it is given by a service that can only see part
    of the picture. A misconfiguration may signal to the service that the host does
    not satisfy the requirements, even if that host should be able to receive the
    instance request as specified. It does not necessarily mean that the service itself
    has a configuration problem.


    To make matters worse, you may not even see an error message. You may discover
    that a block storage volume simply won’t attach to an instance or your network
    isn’t working as you expected it to.


    These situations are when looking at the logs come in.


    # # Logs


    In a production deployment of OpenStack, especially a large one, you will likely
    have a centralized logging system where all servers send logs to—maybe it’s even
    backed by the OpenStack Object Storage (Swift)! Having a centralized log system
    can also help with valuable older logs rotating out of existence, since saving
    logs of a functioning services to compare to your failures can be valuable. However,
    in this chapter we make the assumption that logs are being stored locally on each
    OpenStack node and will be referencing them accordingly.


    After looking for obvious errors in your interface, log files will be your next
    stop in most troubleshooting scenarios. Logs for OpenStack services are typically
    found in /var/log/service-code-name, so you’ll find the logs for Compute (Nova)
    services in /var/log/nova.


    > Tip

    > Depending on the service and whether they contain sensitive data, such as hints
    about authentication, log files will vary in terms of permissions. You may need
    to use administrative access (using sudo) to view them.'
  merge: -1
  img_proc: true
