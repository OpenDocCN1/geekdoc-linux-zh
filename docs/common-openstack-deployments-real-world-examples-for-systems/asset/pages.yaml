  md: '![](img/8684900d708748f86bb043faa5589f9e_72_0.png)


    # Traffic Flow


    You now have some switches or bridges to handle traffic, but this only scratches
    the surface of the routing that''s happening inside of an OpenStack deployment.
    Many of the issues you''ll find with networking will be related to internal interfaces
    that are passing along the traffic, so being aware of what these are for is important.
