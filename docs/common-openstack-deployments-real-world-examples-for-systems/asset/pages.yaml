    # ## Launch an Instance


    Now that the background tasks are completed, we can get around to the business
    of launching an instance!


    Much like how we launched a CirrOS instance in Chapter 5, we will be using a similar
    process to launch an Ubuntu instance, starting with navigating in the left panel
    under Compute to Instances and clicking Launch Instance to bring up the screen
    to walk you through configuring the options for your instance. Feel free to select
    your own Instance Name if you’re not a fan of soft mountain rodents from the Andes,
    but otherwise you want to use the following and then click Next:


    +   - **Instance name:** chinchilla

    +   - **Availability Zone:** nova

    +   - **Instance Count:** 1


    The next screen will enable you to pick your image Source. This time select Ubuntu
    14.04 Server by clicking on the $+$ sign to the right of the instance name in
    the list of Available images. This will move it up to Allocated. Click Next to
    continue on to the Flavor screen.


    On the Flavor screen, as seen in Figure 6.7, you will want to again select an
    option. Select the m1.small flavor you created earlier in this chapter by clicking
    on the $+$ to the right of the Available flavor. On this screen you may notice
    some yellow warnings next to m1.tiny. These are warning you that the image you
    selected will not fit into that flavor. Click Next to go to the Networks screen
    where you will want Network1 to be the Allocated network. Remember, ext-net is
    only used for floating IP addresses and cannot be used here.


    Before clicking Launch Instance, navigate to Security Groups. If you created a
    new one you wish to use rather than using the default as instructed switch to
    that one instead. Then click Key Pair and click the $+$ next to your key pair
    to move it up to Allocated, as show in Figure 6.8.


    You can also browse the Network Ports, Configuration and Metadata screens, which
    will likely come in handy later. It’s common to use the Configuration screen to
    add a script to create some initial users or to bootstrap your configuration management
    environment if you’re not using a custom image. For this instance, we won’t be
    changing anything in these three screens though, and you can just click Launch
    to start your instance.


    You can now watch as your instance goes through the Spawning phase and eventually
    has the State change to Active when the instance is available. If you want to
    watch what has been going on with the instance as it boots, you go over to the
    Actions column and from the drop-down menu select View Log to see the log that
    has been created.'
