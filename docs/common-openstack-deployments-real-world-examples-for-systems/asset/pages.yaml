  md: 'earlier with the OpenStack Client commands. Remember, the password will be
    the one you were prompted for in the user create section:


    ```

    auth_uri = http://controller:5000

    auth_url = http://controller:53357

    auth_type = password

    project_domain_name = default

    user_domain_name = default

    project_name = service

    username = glance

    password = GLANCE_PASSWORD

    ```


    And under [paste_deploy] add the flavor keystone:


    ```

    flavor = keystone

    ```


    You can now save this file.


    Next, edit the /etc/glance/glance-registry.conf file to make similar changes,
    under [database], commenting out the sqlite_db= line and adding a connection line
    for MySQL:


    ```

    connection = mysql://glance:GLANCE_DBPASSWORD@controller/glance

    ```


    And edit the [keystone_authtoken] with the same data as earlier in the api config
    file:


    ```

    auth_uri = http://controller:5000

    auth_url = http://controller:53357

    auth_type = password

    project_domain_name = default

    user_domain_name = default

    project_name = service

    username = glance

    password = GLANCE_PASSWORD

    ```


    And under [paste_deploy] you''ll again add the flavor keystone:


    ```

    flavor = keystone

    ```


    With these changes made to the configuration file, you will now want to restart
    both the api and registry services:


    ```

    $ sudo service glance-api restart

    $ sudo service glance-registry restart

    ```


    Now you want to create the default schema for the MySQL database that was created
    earlier, much like you did with Keystone. This will take a few moments to run:


    ```

    $ sudo -u root /bin/sh -c "glance-manage db_sync" glance

    ```


    Finally, test First we will want to get a simple image, called CirrOS, to load
    into Glance:


    ```

    wget http://download.cirros-cloud.net/0.3.4/cirros-0.3.4-x86_64-disk.img

