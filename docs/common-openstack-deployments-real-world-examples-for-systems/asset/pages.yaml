- pgno: 309
  md: '# Common OpenStack Deployments


    OpenStack is today''s leading open source technology for building and integrating
    public and private clouds. Common OpenStack Deployments is a complete, practical
    guide to deploying OpenStack and understanding its internals. Key project contributor
    Elizabeth K. Joseph and expert implementer Matt Fischer share up-to-date recipes
    for deploying OpenStack on both virtual and physical servers, and for using OpenStack
    to address many real-world challenges.


    First, Joseph and Fischer help you master OpenStack concepts and components by
    guiding you through small-scale, virtualized deployments. As you deepen your understanding,
    they guide you through building large, horizontally scalable infrastructures that
    integrate multiple components in a feature-rich cloud environment. Throughout,
    you''ll find up-to-the-minute coverage of enhancements that make the OpenStack
    platform more mature and production ready, plus expert tips on debugging and growth.


    The authors conclude by introducing the broader OpenStack ecosystem, showing you
    how to drive value through hybrid clouds blending local and hosted solutions.
    Drawing on extensive personal experience, they address issues ranging from cost
    to data sovereignty and security.


    Common OpenStack Deployments is the ideal resource for all systems, network, and
    data center professionals who want to apply OpenStack in proof-of-concept or in
    production, and for every instructor or student who wants to leverage today''s
    hottest cloud technology.


    # Comprehensive coverage includes


    +   • Customizing, deploying, and scaling OpenStack in any environment

    +   • Quickly building single-server test deployments with DevStack

    +   • Making the right networking decisions for any OpenStack deployment

    +   • Manually installing Nova compute, Keystone identity, Glance image storage,
    and Neutron networking

    +   • Setting up controllers and compute nodes

    +   • Deploying private compute clouds with Puppet


    +   • Metering clouds with Ceilometer

    +   • Implementing block and object storage clouds

    +   • Provisioning on bare metal with OpenStack Ironic

    +   • Controlling containers with OpenStack Magnum

    +   • Troubleshooting OpenStack: understanding error messages and logs, using
    key tools, addressing configuration problems, implementing Puppet debugging, and
    more

    +   • Step-by-step virtualized reference deployment using KVM/QEMU on Ubuntu


    Elizabeth K. Joseph, systems administrator on the OpenStack Infrastructure project,
    supports OpenStack developers, is active on OpenStack mailing lists, and has performed
    test engineering for the OpenStack TripleO project. She delivers tutorials on
    OpenStack throughout the San Francisco Bay Area and beyond, participates in biannual
    OpenStack Design Summits, and speaks on open source topics at events worldwide.


    Contributing author Matt Fischer has over 15 years of software development experience,
    in roles ranging from Unix kernel to mobile development to DevOps. He now works
    on a team that deploys and operates OpenStack, and has used Puppet to deploy OpenStack
    since 2013.'
