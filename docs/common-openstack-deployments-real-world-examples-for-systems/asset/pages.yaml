    # Neutron


    The compute node does not have a Neutron database. It only has a couple of plug-ins
    that interact with the networking services on the controller. So first we''ll
    install these plug-ins:


    ```

    $ sudo apt-get install neutron-openvswitch-agent

    ```


    In the /etc/neutron/neutron.conf file, make the following edit in the [DEFAULT]
    section:


    ```

    service_plugins = router

    ```'
