- pgno: 59
  md: '# ## Working with the Host on the Command Line


    Now that you have explored some of the interface, you can attach to the screen
    session on the command line to begin exploring the specific processes that are
    being run in the foreground running daemon mode.


    To attach to the screen you issue the standard screen reattach command:


    ```

    screen -r

    ```


    The initial screen session should look something like Figure 2.5.


    Since DevStack does not create log files by default, all information about the
    running services is spread out over a couple dozen child screens within a screen
    process. An interesting one to navigate to is a screen called n-api, which shows
    you the output from the nova-api daemon. You can also browse through the calls
    you just made in the Horizon dashboard.


    # ### Navigating Screen


    DevStack uses a tool called screen to manage the daemons running in the foreground.
    The following commands will help you navigate this screen session so you can interact
    with the daemons and see what they’re doing.


    Connect to the running screen session:


    ```

    screen -r

    ```


    Once you’re inside the screen session, the following key combination will get
    you a listing of all the child screens running:


    ```

    ctrl + a + “

    ```


    You can then navigate through the screens by using your up and down arrows. Later,
    if you wish to go to a specific screen and know the number you can use the following:


    ```

    ctrl + a + `

    ```


    That will bring up a prompt where you can type in the screen number to which you
    want to go.


    If you’re just looking to get an overview of what’s showing in all the screens,
    you can navigate through them one by one by using the following:


    ```

    ctrl + a + n

    ctrl + a + p

    ```


    These will get you to the next and previous screens, respectively.


    Finally, to detach from this screen session and go back to your terminal, type
    the following:


    ```

    ctrl + a + d

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/8684900d708748f86bb043faa5589f9e_60_0.png)


    Now that you’re familiar with what is being run on the system, you can also start
    using the OpenStack command line client to launch instances, view the status of
    instances and more. You will first need to load the credentials by sourcing the
    openrc file in the devstack directory. The following commands are some simple
    ones to get you started,


    ```

    $ source ~/devstack/openrc

    $ openstack flavor list

    $ openstack server list --all-projects

    ```


    You will learn more about OpenStack Client commands in later chapters, and a basic
    reference is available in Appendix E, “OpenStack Client (OSC).”


    # ## DevStack Options


    The preceding section of this chapter covered launching DevStack without any customization.
    However, customization is recommended for testing out different aspects of the
    development version of OpenStack.


    # ### DevStack “Stable”


    One of the perhaps lesser-known features of DevStack is the capability to launch
    a stable version of OpenStack with the DevStack scripts. This is heavily used
    by developers and the OpenStack Continuous Integration stack to test upgrades.
    However, it can also help newcomers get a feel for a specific, released version
    of OpenStack rather than using a development version. Using this version can also
    be valuable for getting started with OpenStack if you’re having trouble getting
    the DevStack version from master running.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '> **Caution**

    > Even though this installs a stable version of OpenStack, this is still not a
    maintainable or recommended way to run OpenStack in a production environment.
    You should continue to use a Virtual Machine or spare system that you can reinstall
    at a later date and learn proper separation and high availability procedures for
    maintaining a production system.


    The procedure for running a stable version of OpenStack using DevStack is a slightly
    modified version of the three steps mentioned earlier, adding another step to
    switch to one of the supported stable branches in the cloned git repository:


    ```

    `$ git clone git://git.openstack.org/openstack-dev/devstack.git

    $ cd devstack

    $ git checkout stable/mitaka

    $ ./stack.sh`

    ```


    > **Tip**

    > Want to list the available stable branches in DevStack you have to select from?
    While in the devstack directory, type:

    > `git branch -a`

    > OpenStack releases are alphabetical, so the last listing in the branch list
    will be the most recent stable release.


    Just like running standard DevStack, this will take some time as it downloads
    dependencies and sets up your environment. Instead of pulling from the development
    version, it will pull from the requested stable environment.


    The demonstrations shown earlier in this chapter for logging in as a user and
    administrator can also be done with this stable version, but you will instead
    have a version that has been released and is more like the one you would find
    shipped with your distribution.


    # Customizing DevStack


    There are many customizations you can make in order to adjust your DevStack environment
    to do everything from pre-seed passwords and networks, to enabling additional
    services.


    > **Tip**

    > If you want to make customizations, it is recommended that you don’t use one
    of the stable branches of DevStack. The development version is always adding new
    options and is actively being maintained and tested, where it may be less likely
    for the stable versions to be updated.


    Changes are made to a local.conf file in the main devstack directory. You can
    find a sample configuration file at samples/local.conf.'
  merge: -1
  img_proc: true
