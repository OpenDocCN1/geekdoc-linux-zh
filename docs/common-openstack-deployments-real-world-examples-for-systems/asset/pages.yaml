- pgno: 108
  md: 'In the [ovs] section, update the local_ip to be its own IP, set up a bridge
    mapping and enable tunneling:


    ```

    local_ip = 192.168.122.2

    bridge_mappings = external:br-ex

    enable_tunneling = true

    ```


    The final change to make to this file is to specify the firewall driver to use
    for the security groups:


    ```

    firewall_driver = neutron.agent.linux. iptables_firewall.OVSBridgeIptablesFirewallDriver

    ```


    You now need to make a couple edits to /etc/neutron/dhcp_agent.ini:


    ```

    interface_driver = neutron.agent.linux.interface.OVSInterfaceDriver

    dnsmasq_config_file = /etc/neutron/dnsmasq.conf

    ```


    Create the /etc/neutron/dnsmasq.conf file with a couple options set by using the
    following command:


    ```

    $ echo "dhcp-option-force=26,1450" | sudo tee /etc/neutron/dnsmasq.conf

    ```


    Next, edit /etc/neutron/metadata_agent.ini to add a metadata_proxy_shared_secret.
    This secret will also be used by Nova. Replace something_secret with something
    you wish to use:


    ```

    metadata_proxy_shared_secret = something_secret

    ```


    Finally, the last Neutron file you''ll want to edit is for the ml2 plug-in at
    /etc/neutron/plugins/ml2/ml2_conf.ini. This file will need the following customizations
    in the [ml2] section:


    ```

    type_drivers = vxlan,flat

    tenant_network_types = vxlan

    mechanism_drivers = openvswitch

    ```


    Under [ml2_type_vxlan], set the vni_ranges and the vxlan_group:


    ```

    vni_ranges = 10:100

    vxlan_group = 224.0.0.1

    ```


    Before restarting the services, you''ll need to set up the Neutron database schema:


    ```

    $ sudo -u root /bin/sh -c ''neutron-db-manage --config-file \

    /etc/neutron/neutron.conf --config-file \

    /etc/neutron/plugins/ml2/ml2_conf.ini upgrade mitaka''  neutron

    ```


    Now you''ll want to restart all of the Neutron services by running the following:


    ```

    $ sudo service neutron-l3-agent restart

    $ sudo service neutron-metadata-agent restart

    $ sudo service neutron-openvswitch-agent restart

    $ sudo service neutron-dhcp-agent restart

    $ sudo service neutron-server restart

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: "We’ll now move away from Neutron configuration files and back over to Nova.\
    \ We need to add a `[neutron]` section in our `/etc/nova/nova.conf` that contains\
    \ the following (remember, the `metadata_proxy_shared_secret` from the `metadata_agent.ini`\
    \ earlier):\n\n```\n```python\n[neutron]\nauth_url = http://controller:53535/v3\n\
    username = http://controller:9696\nauth_plugin = v2password\nproject_domain_name\
    \ = default\nproject_name = service\nuser_domain_name = default\nusername = neutron\n\
