    \ entered already.\n\nYou now have an empty MySQL database and details for Glance\
    \ registered with Keystone. The next step is installing the Glance package and\
    \ editing the configuration file.\n\n```\n$ sudo apt-get install glance\n```\n\
    \nGlance has two major configuration files, one for the API and another for the\
    \ registry. The Glance API is what clients use to directly interface with Glance,\
    \ and the registry is the service that actually stores the metadata about the\
    \ services that the API references. Just like the Keystone configuration file,\
    \ permissions are restricted on these files because they contain sensitive authentication\
    \ data. You don't want to change these permissions. They will need sudo to edit\
    \ these files.\n\nThe configuration file for Glance API is located at/etc/glance/glance-api.conf.\
    \ The first change you'll want to make is switching from using SQLite to using\
    \ MySQL by commenting out the sqlite_db= line in the \\[database\\] section and\
    \ replacing it with the following (remember GLANCE_DB_PASSWORD should be replaced\
    \ with the value you used when you created the Glance user in MySQL):\n\n```\n\
    connection=mysql+pymysql://glance:GLANCE_DB_PASSWORD@controller/glance\n```\n\n\
    The following lines under the \\[keystone\\_authtoken\\] section will also need\
    \ to be changed to set the API endpoint, tell it where Keystone resides and configure\
    \ the details you set"
  merge: -1
  img_proc: true
