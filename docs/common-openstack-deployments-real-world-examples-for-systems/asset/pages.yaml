- pgno: 187
  md: '# ## Creating a Volume


    On this page you''ll want to click on the Create Volume button, which will bring
    up a dialog like the one in Figure 8.4 where you will put in information about
    the volume you wish to create. Some fields will be automatically filled out, but
    the rest will be up to you.


    The volume name is what you will be using to refer to the volume. A description
    is optional and can be used for whatever you want, maybe as a reminder to yourself
    about what the volume is intended for. The volume source enables you to pre-populate
    the volume with a source of defined data. By default, it queries the Image Storage
    (Glance) service and enables you, as one of the options, to put an Image on your
    newly created volume. You may also want to create a volume source that has a basic
    filesystem and partition table for your new volume so it doesn''t need to be created
    later after you mount it on an instance. For this scenario, we will just use No
    source, empty volume and will explain how to partition and format it after it
    is added to an instance.


    The type of volume will inform the scheduler as to which type of storage back
    end you need to use. From the customer point of view, you want to define a type
    as tiered and varied storage with different properties, like how fast the storage
    device is, Quality ofService (QoS) requirements or whether a tier has replication.
