- pgno: 237
  md: '# High Availability and Scaling


    High Availability (HA) is a major consideration for most production OpenStack
    deploy-

    ments. You want to minimize the downtime of user-facing services so that users
    don''t

    have failures when they try to launch an instance or find themselves unable to
    reach

    their compute instances or files in object storages. It’s also important to minimize
    data

    loss. As covered in depth in Chapter 9, “Object Storage Cloud,” a lot of work
    has been

    put into Swift to make sure data is protected. Services such as Cinder Block Storage
    also

    have backup and snapshot utilities to minimize data loss, and you can run additional
    pro-

    tections on other back ends.


    Entire books can be written and a whole upstream guide exists on how to specifi-

    cally configure OpenStack to be highly available, but we''ll touch the surface
    here on the

    high-level pieces to consider having redundancy for in your production deployment

    hardware-wise:–


    +   Pieces of your physical network, including cables, switches and routers

    +   Storage back ends, whether they are a fleet of commodity hardware servers
    or

    +   an array of Network-Attached Storage (NAS) device

    +   On-premises services in your data center such as power, fire protection and
    air

    +   conditioning


    A deep dive into further high availability concepts and configurations can be
    found

    in the OpenStack High Availability Guide at http://docs.openstack.org/ha-guide/
    .


    In OpenStack itself, you''ll have to horizontally scale your compute and storage
    nodes.

    Our scenario only have one compute node and all of our storage is on the controller,

    but storage and compute are typically the first things that will be added in a
    deployment.

    You''ll be adding more compute nodes as your number of instances grows. By always

    having more than are being used, you can fail over instances from one node to
    another.

    All the storage tooling includes ways to easily grow and re-balance the storage.


    When you get to the point of moving beyond simple horizontal scaling of individual

    stateless services and storage, you''ll want to dive deeper into the configuration
    of

    individual services. The OpenStack Administrator Guide is a great place to start

    (http://docs.openstack.org/admin-guide/), and the OpenStack Operations Guide

    covers further scaling, troubleshooting and more real-world operational tasks
    (http://

    docs.openstack.org/ops-guide/).


    # Additional Components


    We have explored some of the early and basic components of OpenStack in our deploy-

    ment scenarios. In Chapter 10, “Bare Metal Provisioning,” and Chapter 11, “Controlling

    Containers,” we introduced the concepts of control of bare metal and containers
    from

    within an OpenStack deployment in order to extend your deployment beyond launching

    of Virtual Machines.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'As we talked about in Chapter 1, "What is OpenStack?" there are also projects
    beyond the ones we’ve covered and more projects being created every release. The
    current list of official projects that have placed themselves under OpenStack
    governance as managed by the Technical Committee is maintained at http://governance.openstack.org/reference/projects/.
    All projects being maintained within the OpenStack community, but may not be necessarily
    owned by an official team, can be found by navigating the OpenStack git repositories
    at https://git.openstack.org/cgit/openstack/.


    In addition to the services mentioned in Chapter 1, there are a few services that
    have a deployment rate of 10% or more, based on user survey feedback, and are
    worth keeping an eye on for our own work:


    +   - Designate: DNS as a service

    +   - Trove: Databases as a service

    +   - Sahara: Data processing (Hadoop, Spark)

    +   - Murano: Application catalog


    Most of these services have Puppet modules that you can find at the aforementioned
    OpenStack git repositories. All puppet modules are prefixed with puppet-, like
    puppet-trove and puppet-sahara.


    Learn about what other organizations are doing and the services they’re using
    by visiting the latest user survey at https://www.openstack.org/user-survey/.


    A Project Navigator also exists on the OpenStack web site to learn about some
    of the more popular components at https://www.openstack.org/software/project-navigator.


    # ## Summary


    Previous chapters gave you service-by-service deployment scenarios and covered
    basic navigation of each of those. This chapter brought them all together. You
    learned how to deploy a scenario that includes telemetry for metrics, block storage
    and object storage all at once and how to work with it through the Dashboard and
    command line client. As you look into the future of your work with OpenStack,
    we also touched upon and provided resources for scaling, HA and additional components
    you may want to consider supporting in your production deployment.'
  merge: -1
  img_proc: true
