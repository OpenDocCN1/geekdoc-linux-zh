- pgno: 232
  md: '# # 12


    # ## A Whole Cloud


    > Two drifters

    > Off to see the world,

    > There''s such a lot of world

    > To see.

    > Johnny Mercer, Moon River


    This final scenario in this book brings all of the pieces together that we''ve
    presented in the earlier standalone scenarios. You''ll be able to see how Cinder
    block storage and Swift object storage also feeds into Ceilometer telemetry and
    be able to use both Cinder block and Swift object storage in your instances. As
    we bring these pieces together, we''ll also talk a bit about scaling beyond these
    scenarios.


    # ### Uses


    We''ve explored a variety of uses for OpenStack already, from universities looking
    to give out instances to their researchers to car companies looking to handle
    their compute load and cloud storage to syncing companies offering automated data
    handling to their customers. Hopefully you''ve begun to see how components of
    OpenStack can fit into your own organization and have started making plans for
    how to use it.


    Since this chapter brings together several of the pieces, you will finally get
    a view into what the manifests and configurations look like in a more complicated
    deployment.


    # ### Requirements


    The requirements remain the same as we''ve used throughout the book, with the
    controller and compute nodes you created in Chapter 5, “Foundations for Deployments.”


    The minimum requirements will still work for this scenario, but if you have additional
    resources to devote to a deployment, this one is the one to spend the resources
    on, since we''ll be running all the services.'
  merge: -1
