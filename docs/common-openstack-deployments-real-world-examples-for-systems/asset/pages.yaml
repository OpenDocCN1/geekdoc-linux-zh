    | service_name | nova                                                       |\n\
    | service_type | compute                                                    |\n\
    | url        | http://controller:8774/v2.1/%(tenant_id)s                   |\n\
    \nWith the service user and endpoints created, now install the packages. For Nova\
    \ there are several more that you need to install than for Keystone and Glance:\n\
    \n```\n$ sudo apt-get install nova-api nova-conductor nova-consoleauth \\\n> nova-novncproxy\
    \ nova-scheduler\n```\n\n# Basic Pieces of Nova\n\nGlance just had a couple services,\
    \ but Nova has a whole lot of them. The following is a quick rundown of the services\
    \ you are installing now:\n\n+   • **API**---Just like with other OpenStack services,\
    \ the API is how you interact with the service, including activities such as launching\
    \ a new instance or asking for details about one already running.\n+   \n+   •\
    \ **Conductor**---A daemon that enables OpenStack to function in an isolated manner\
    \ so that compute nodes don’t need to directly access the database.\n+   \n+ \
    \  • **Consoleauth**---Provides access via a VNC-style console in an instance,\
    \ either from the outside or directly via something like Horizon, the OpenStack\
    \ dashboard.\n+   \n+   • **Novncproxy**---As with consoleauth, this proxy daemon\
    \ is also required for access to the console on an instance.\n+   \n+   • **Scheduler**---A\
    \ daemon that takes an instance creation request from the queue and determines\
    \ which compute server a host should run on."
