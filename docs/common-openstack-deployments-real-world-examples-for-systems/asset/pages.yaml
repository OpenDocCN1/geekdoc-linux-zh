- pgno: 138
  md: '![](img/8684900d708748f86bb043faa5589f9e_138_0.png)


    Figure 5.1. Horizon dashboard login page


    # Tip


    Which IP address? The controller has two NICs, but only one of them has an address
    you can navigate to. This is the one assigned to eth0 and would have been allocated
    when you installed the controller.


    Once you have a login screen (see Figure 5.1), you want to log in with username
    "test" and the test password you created when editing the hiera/common.yaml file.


    If all of these commands worked, congratulations! You now have a running controller
    node. If you have errors, first go back and check your configuration to make sure
    you didn''t skip a step. If that doesn''t help, see the troubleshooting section
    later in this chapter for some resources to help you debug.


    You''ll now want to set up the other server, the compute node.


    # Compute Node


    You are now creating a Compute node. The compute node will be the host of all
    of the compute Instances that you create. As discussed, it is important for security
    and performance to keep these separate from all of the tooling used to run OpenStack
    itself. We will configure the compute node in much the same way as we did the
    controller. First edit several variables in the default hiera common.yaml at /etc/puppet/hiera/common.yaml.
    Open with your preferred text editor using sudo and make similar changes to what
    you did in the controller file. Save the file.


    # Reminder


    Don''t skip editing hiera/common.yaml. These values need to sync up with what
    you used on the controller. Plus, the defaults are easy to guess and are stored
    on a public git repository.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "With these changes completed, we can finally run the following command on your\
    \ compute node to apply the Puppet manifest that will install the foundational\
    \ components for you.\n\n```\n`$ sudo puppet apply etc/puppet/modules/deployments/manifests/role/foundations_compute.pp`\n\
    ```\n\nAs with the controller, you may also consider using the puppet apply command\
    \ with the `--debug` flag in order to see more of what is going on. Either way,\
    \ this command will take some time to run, so while it’s running we can take a\
    \ look at what is included in this foundations_compute.pp Puppet role:\n\n```\n\
    ```\nclass deployments::role::foundations_compute {\n  include deployments::profile::base\n\
    \  include deployments::profile::compute\n}\ninclude deployments::role::foundations_compute\n\
    ```\n```\n\nThis is a much simpler role than the foundations role. It only includes\
    \ the base profile, discussed earlier on the controller and the compute profile.\n\
    \n# Compute Profile\n\nThe first thing you may recognize is that the controller\
    \ had a “Nova” profile and this module has a “Compute profile.” This naming was\
    \ used to distinguish the tooling installed on the controller to operate the centralized,\
    \ management of Nova compute, and the services required on a node. The compute\
    \ node is simply running the virtual machines themselves and doing some limited\
    \ inter-networking, but accepts instructions from services running on a controller.\
    \ Looking inside the compute profile, you can see how it differs from the Nova\
    \ profile on the controller:\n\n```\n```\n$ cat /etc/puppet/nova/deployments/manifests/profile/compute.pp\n\
    class deployments::profile::compute\n{\n  include ::nova\n  include ::nova::compute\n\
    \  include ::nova::compute::libvirt\n  include ::nova::compute::neutron\n  include\
    \ ::nova::network::neutron\n  include ::neutron\n\n  class { '::neutron::agents::ml2::ova':\n\
    \    bridge_uplinks    => undef,\n    bridge_mappings    => undef,\n    enable_tunneling\
    \  => hiera('neutron::agents::ml2::ova::enable_tunneling'),\n    tunnel_types\
    \      => hiera('neutron::agents::ml2::ova::tunnel_types'),\n    local_ip    \
    \      => hiera('neutron::agents::ml2::ova::local_ip'),\n  }\n}\n```\n```\n\n\
    The profile pulls in a very limited subset of components that are required for\
    \ running the compute nodes, specifically dealing with a single compute daemon\
    \ (nova::compute) using libvirt. The Neutron Modular Layer 2 (ML2) plug-in for\
    \ Open vSwitch is configured for networking. It is used to configure the tunnels\
    \ needed for instance traffic."
  merge: -1
  img_proc: true
