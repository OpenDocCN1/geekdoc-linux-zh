- pgno: 272
  md: '# # D

    ## Contributing Code to OpenStack


    The OpenStack project can loosely be described as a vast ecosystem of individual
    projects that come together to build the end result that we call OpenStack. Each
    of these projects is governed at a high level by the OpenStack Technical Committee
    (TC) but on a per-project basis has an elected Project Team Lead (PTL) and core
    code reviewers who are specific to just that project. The OpenStack ecosystem
    also supports projects the scope of which covers all of the project, including
    the Documentation, Internationalization (i18n) and OpenStack project Infrastructure
    teams.


    Contributing to OpenStack can be daunting at first because of this large ecosystem,
    but by narrowing in on specific segments that this appendix discusses, you can
    be a successful contributor.


    # ## Contribution Overview


    There are some key concepts that range across all of the OpenStack projects, including
    the use of Python as the core development language, the feature specification
    process, code review, release cycle and the testing infrastructure that all code
    must pass.


    Contributors in the OpenStack project come from a vast array of companies, organizations
    and individual contributors. Many of the contributors are directly paid by an
    employer, but there are always some volunteer contributors who contribute for
    a variety of reasons. As OpenStack developers continue to be in high demand, familiarity
    with the OpenStack ecosystem can be a boon to your career in OpenStack.


    # ## Release Cycle


    When you are new to contributing to OpenStack, the release cycle may not be of
    much interest. However, you may want to eventually understand it so that your
    changes are incorporated into the version of OpenStack you''re targeting.


    With the exception of a few projects that are not tightly coupled with the rest
    of OpenStack (for example: Infrastructure, Ironic, Swiff), non-client projects
    in OpenStack are released on a 6-month cycle. This 6-month cycle is kicked off
    with an OpenStack Design Summit and Conference where users in the OpenStack community
    get together to learn more about OpenStack in a presentation and panel-driven
    conference setting.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Developers get together for Design Summit sessions where in-person meetings
    are held to work through key components of focus for each project during the next
    6 months and beyond. Some teams also schedule an in-person mid-cycle event about
    halfway through the release in order to get together in person and discuss any
    outstanding challenges with completing work planned for that cycle.


    Throughout the release cycle, there are milestones and release candidates that
    shift and change per release as the OpenStack project grows and evolves. Members
    of a project typically work together to meet certain deadlines throughout the
    release cycle so that focus toward the end can be on release candidates and only
    bugs that will impact the release.


    # ## Communication


    OpenStack contributors come from various companies and live all over the world.
    When teams aren’t working together in person at a Design Summit or at a mid-cycle,
    collaboration occurs online through various communication channels.


    The OpenStack community is committed to transparent decisions that all contributors
    have access to. This means that communities are encouraged to use open source
    software platforms when communicating with the project and to make sure Internet
    Relay Chat (IRC) logs or recordings of these meetings are kept for community review.


    # ### Mailing Lists


    The OpenStack project runs a series of mailing lists, a full listing of which
    can be found at [http://lists.openstack.org/](http://lists.openstack.org/).


    Development discussions across all projects occur on the openstack-dev mailing
    list and can be filtered based on topics in the subject. For instance, all discussions
    about Nova will have an email subject that includes [Nova]. This is a very high
    traffic list.


    As an operator, you may be interested in the openstack-user and openstack-operators
    mailing lists. The Operators mailing list has a similar tagging system to that
    of the dev mailing list.


    The other mailing lists cover a variety of topics, including the work going into
    Documentation, Internationalization (i18n), Infrastructure, Community and various
    local OpenStack groups communicating in their native language.


    The archive, or record of all emails, for a mailing list can be found by going
    to its respective [http://lists.openstack.org/](http://lists.openstack.org/) page
    and looking for the Archives link.


    # ### Internet Relay Chat (IRC)


    Internet Relay Chat (IRC) is a popular, cross platform chat technology that has
    been around for decades and is popular for open source projects. Most projects
    have their own IRC channel, or chat room, where discussion on that project is
    held. OpenStack channels reside on the freenode IRC network and can be accessed
    via clients across all popular platforms (Mac, Windows, Linux, Android, iOS).


    Day-to-day discussions about development of each component occur on IRC, with
    bigger discussions and decisions typically happening on the mailing lists. There
    are also bots on IRC that alert contributors when new changes are submitted for
    review in the code review system or merged into the repository.'
  merge: -1
  img_proc: true
- pgno: 274
  md: "Meetings are held in a series of meeting channels. The meeting schedule and\
    \ links to logs for these meetings and general channel logs can be found at: http://eavesdrop.openstack.org/\n\
    \n# Reminder\n\n> We're an international community. All meetings are scheduled\
    \ in UTC time so it's clear to all contributors when the meeting is. If you can,\
    \ use a time zone converter or add meetings to your calendar in the UTC time zone\
    \ so you don't miss a meeting.\n\n# Support\n\nWhile not strictly related to code\
    \ submissions, a discussion of communication would be incomplete without mentioning\
    \ support outlets that keep the OpenStack community running.\n\nThere is a high-traffic\
    \ OpenStack mailing list where support questions should be sent (rather than to\
    \ the OpenStack Development list, mentioned earlier): http://lists.openstack.org/cgi-bin/mailman/listinfo/openstack.\n\
    \nOperators who are seeking to collaborate, and share best practices around running\
    \ OpenStack at scale can join the OpenStack Operators mailing list: http://lists.openstack.org/cgi-bin/mailman/listinfo/openstack-operators.\n\
    \nLearn more about user-level support in Appendix F, \\\"Finding Help with OpenStack.\\\
    \"\n\n# Specifications\n\nWhether you're seeking to propose a new feature or looking\
    \ for work to do, familiarizing yourself with the specification process in the\
    \ OpenStack community is important to making a difference.\n\nSpecifications outline\
    \ the work that is planned for a project for a given time period, typically a\
    \ release cycle. These start out as a peer-reviewed document that outlines various\
    \ components of a proposed new feature or change to the project. Typically, these\
    \ describe the change in detail, including rationale for the feature, discuss\
    \ some of the alternatives that the submitter has explored and explain things\
    \ like security, API and broader project impact.\n\nAll specifications can be\
    \ found at http://specs.openstack.org/. \nIf you seek to add a feature, you will\
    \ need to write a specification and submit it to the community for review. This\
    \ will typically take several weeks as you work with the project members to get\
    \ people to look at your specification and you respond to comments about it through\
    \ the review tool. Once accepted, you can get to work writing the code and supporting\
    \ material (documentation, unit tests) required for your new feature.\n\nSpecifications\
    \ can also be valuable to a new contributor who is looking for something to work\
    \ on. Each project has sorted specifications so you can determine what is currently\
    \ being worked on, and, with the detailed description of it, can enable you to\
    \ get up to speed with required components and start working with the team that\
    \ is currently assigned.\n\nIn the short term, the specifications process enables\
    \ anyone to see what is happening within a project during a given cycle and gives\
    \ newcomers an opportunity to find something to work on. In the long term, specifications\
    \ give detailed historical rationale for why specific decisions were made and\
    \ document other strategies considered."
