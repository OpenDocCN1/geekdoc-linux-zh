    \ done\nWriting superblocks and filesystem accounting information: done\n```\n\
    ```\n\nThe last step is creating a mount point and mounting your new volume. Let's\
    \ say that you want to use this volume for photos and create a directory for that.\
    \ Then we'll check to confirm it's the size we expect it to be.\n\n```\n```bash\n\
    $ mkdir photos\n$ sudo mount /dev/vdb1 photos/\n$ df -h -i /dev/vdb1\nFilesystem\
    \     Size  Used Avail Use% Mounted on\n/dev/vdb1      100G  9.9M  95.4M 0% /home/cirros/photos\n\
    $ df -h /dev/vdb1\nFilesystem     Size  Used Avail Use% Mounted on\n/dev/vdb1\
    \      100G  9.9M  95.4M 0% /home/cirros/photos\n```\n```\n\nCongratulations!\
    \ A 1GB volume from the block storage service Cinder is now mounted on your system.\
    \ Note that this was mounted using the root user, so you will need to either change\
    \ the ownership to your user or use root to place files on it.\n\n# **Tip**\n\n\
    File permissions with block storage in Cinder can be a tricky thing to master.\
    \ When using a Linux filesystem, files are referenced by user and group ID (UID\
    \ and GID). Unless you are very diligent about keeping things consistent across\
    \ your instances through something like custom images with default users and group\
    \ or configuration management where IDs are specifically defined, these IDs can\
    \ easily be different between machines.\n\nAs a result of these potential differences\
    \ in IDs, mounting a volume from the block storage device on one instance and\
    \ then detaching it to add it to another instance may land you in a situation\
    \ where the ownership of files looks all wrong. Keep this in mind as you begin\
    \ experimenting with moving volumes and always make checking permissions a step\
    \ in your plans to move a volume to another instance."
