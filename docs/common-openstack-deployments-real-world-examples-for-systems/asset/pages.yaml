- pgno: 251
  md: 'This will provide considerably more output than the standard `apply` command,
    enabling you to track down exactly what Puppet is doing with every step and helping
    you find the problem. If there is a lot of output, you may want to pipe this output
    to a file so you can search through it and reference it later.


    # Exploring the Modules


    As discussed in Chapter 5, “Foundations for Deployments,” we’re setting configuration
    variables specific to our deployment in a Puppet Hiera key/value store located
    in `/etc/puppet/hiera/common.yaml`. The source of this file is in our GitHub repository
    at: <https://github.com/DeploymentsBook/puppet-data> in the `hiera` directory.
    By default, we do have you make changes that impact this file in order to describe
    your environment. This file can also be edited and added to in order to change
    other things you expect.


    The composition module we use is automatically pulled in by the `setup.sh` script
    you used in the foundations chapter, but you can find it directly at <https://github.com/DeploymentsBook/puppet-deployments>.
    As we went over in that chapter, this module describes the components of the official
    OpenStack Puppet modules we wish to pull in and makes some basic configuration
    changes to that are not defined in our Hiera store. These direct changes are things
    like bringing up an interface or making sure our example object storage (Cinder)
    loopback volume is mounted before the server is rebooted.


    Finally, the official OpenStack Puppet modules reside on the Git server for the
    OpenStack project with all the other projects at <https://git.openstack.org/cgit/>.


    Every project begins with “puppet-” and then has the specific service that it’s
    created for, so we have `puppet-nova`, `puppet-glance`, and so on. Searching the
    web interface will find them all. By exploring these modules, you will learn which
    of the ever-growing number of options for each service the modules support as
    well as how they are implemented and end up in your configuration file. If you
    believe something is not being configured correctly, but your Puppet Hiera `common.yaml`
    has the right information, the Puppet module is the right place to look.


    > Tip

    > Are you sure your Puppet Hiera `common.yaml` file is correct?

    > Syntax errors in this file are incredibly common and are almost non-detectable;
    you can put anything in this file and it’s not going to throw an error. A missing
    colon or incorrect declaration of a variable can mean the difference between your
    service working or failing.

    > Be sure to double-check.


    # More Puppet Help


    Beyond these basic OpenStack-specific tips, you may want to reference the Puppet
    documentation at <https://docs.puppet.com/> if you find yourself struggling with
    Puppet specifically. You can also see Appendix C, “Long-Lived Puppet” to learn
    more basics about how Puppet works and how you can run it on a more permanent
    basis in a deployment.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# # Mitigating Breakage


    Wouldn''t it be great if you didn''t have to deal with OpenStack breaking at all?
    Like any infrastructure, between upgrades, scaling and unexpected hardware mishaps,
    we''ll likely never get there, but there are things you can do to mitigate breakage
    in your deployments.


    First, follow the best practice of most operations teams today: keep all configuration
    files in a revision control system (RCS). Whether you use Git, SVN or an internal
    system unique to your organisation, make sure you''re using something. Making
    a change that breaks your deployment and not remembering what you changed can
    be a huge waste of time. Keep a history of configuration files so it''s easy to
    roll back if something goes wrong.


    Secondly, have a way to test your changes. At the very least, have tooling that
    checks for the most basic things: configuration file syntax and unit tests for
    your custom code. The next step may be having a smaller scale development environment
    where you deploy changes to first and then run a script to check for various tasks,
    such as accessibility of API endpoints and the capability to complete basic tasks.
    When you finally go into production, many operators also segregate their production
    deployment, allowing certain regions of their deployment to have the new changes
    applied. This enables them to roll back just a subset of their deployment if unexpected
    problems occur and otherwise progress confidently if it goes well. .


    As a continuation to testing, you may also want to put together a full Continuous
    Integration (CI) system to test OpenStack. You can build your own with the help
    of an open source CI system like Jenkins (https://jenkins.io/) or look at what
    the OpenStack Infrastructure team has built for the OpenStack project. Before
    any change lands in the development version of OpenStack, it is tested with a
    complex series of tools put together and built by the OpenStack Infrastructure
    team. It includes code review (Gerrit: https://www.gerritcodereview.com/), queue
    management of patches to make sure they are all tested against each other (Zuul:
    http://docs.openstack.org/infra/zuul/), management of a fleet of hundreds of test
    nodes running tests (Nodepool: https://docs.openstack.org/infra/nodepool/) and
    finally the merging of patches into the project RCS, Git. Dozens of companies
    have now adopted this fully open source CI system for use inside their own organizations.
    Using it enables them to test OpenStack with the specifics of the deployment scenarios
    they have running and additions in the form of proprietary plug-ins and agents.
    Learn more about the CI system used in the OpenStack project by visiting http://docs.openstack.org/infra/system-config/.


    In addition to standard testing of the components you change, be aware that upstream
    changes can impact your deployment as well. Ubuntu packages are updated for security
    and major bug fixes. In our deployment scenarios, we specify usage of the stable/mitaka
    branch of the Puppet modules, but even these upstream Puppet modules are also
    sometimes modified for security or bug fixes. Consider locking down any of these
    kinds of changes for your production deployment until you can test them.


    While we have not devoted the resources to cover an upgrade scenario in this book,
    these final few tidbits of advice to help avoid breakage are specifically related
    to upgrades.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'First, follow all the suggestions above and make sure you''re testing everything
    before going into production. Next, always read release notes for the services
    you are using. OpenStack is a still a relatively young project, and it is developed
    in a space that is continually evolving. With each release you''re bound to discover
    that the API version endpoint you should be using has changed, or there''s a new
    database schema (or a new database). Perhaps a feature you have been using has
    been deprecated in favor of a new one. These are all things to watch out for,
    and all should be covered in the release notes for each project.


    # Requesting Help


    Sometimes you really get stuck. Perhaps you are still learning how all the components
    work together. Or the problem really requires a subject matter expert. Maybe an
    upgrade broke something you were depending on. There are countless reasons why
    you don''t want or need to only depend upon your own knowledge or that inside
    your organization to find help with a problem.


    When you get to this point, sanitize your configuration and log files as much
    as possible to remove usernames, passwords and keys, and then reach out to the
    OpenStack community. The OpenStack community has mailing lists for users and more
    advanced operators, a question and answer format web forum, various IRC (Internet
    Relay Chat) channels and in-person events around the world where you can get assistance.
    There are also dozens of companies offering professional assistance on a contract
    or ongoing basis. Learn more about the specifics around OpenStack help resources
    available in Appendix F, “Finding Help with OpenStack.”


    # Summary


    Any operator of an OpenStack deployment becomes quickly skilled in the art of
    troubleshooting a deployment. In this chapter we''ve covered key ideas and tools
    that can be used to get started including demonstrations of how to read error
    messages and the related logs, key services you should keep an eye out for and
    ways to tackle debugging of networking. To conclude, we explored how Puppet is
    used for the deployments in this book, reviewed some tactics for mitigating breakage
    in your deployment and covered a quick summary of how to request help.'
  merge: -1
  img_proc: true
- pgno: 254
  md: "# # Vendors and Hybrid Clouds\n\n> *Never think you've seen the last of anything.*\n\
    > \n> Eudora Welry\n\nMuch of what has been covered so far has sought to explain\
    \ how to run OpenStack in a contained environment as something you run yourself,\
    \ whether you're building an infrastructure for use within your organization or\
    \ are building a compute cloud for customers. In this chapter we'll explore the\
    \ ecosystem beyond this by talking about how vendors can help with deployments\
    \ and how you can also leverage public clouds for what may become a hybrid cloud\
    \ environment. Finally, we walk through how OpenStack enables you to avoid vendor\
    \ lock-in with some examples of organizations that have successfully run their\
    \ infrastructure across multiple clouds.\n\n# ## Vendor Ecosystem\n\nNo tour of\
    \ OpenStack would be complete without mentioning the vast vendor ecosystem that\
    \ has built up around OpenStack. There are various companies that have gotten\
    \ involved with supporting OpenStack, including:\n\n+   - Traditional customer\
    \ hosting companies that have recently moved to offering cloud solutions\n+  \
    \ - Well-established technology companies that have now found their customers\
    \ wanting a cloud solution\n+   - Completely new companies that have sprung up\
    \ to specifically offer cloud-centric solutions\n\nThese companies will offer\
    \ a range of services from public to private. We'll cover public services in more\
    \ depth later in the chapter. Private offerings can range anywhere from coming\
    \ into your organization and building a full OpenStack deployment to more specific\
    \ offerings that promise you a solution, like object storage for the sharing of\
    \ files securely within your organization. As a technologist, understanding the\
    \ fundamentals of what is going on in your environment is valuable, but these\
    \ companies come in with the expertise needed to maintain and scale the deployment\
    \ as your needs change."
  merge: -1
  img_proc: true
- pgno: 255
  md: 'If your organization is large enough that you can devote full-time staff to
    managing your OpenStack-driven environment, there are also vendors who specialize
    in training and consulting services. These services are valuable for when your
    team needs to learn more about a specific component of OpenStack or simply is
    seeking some solid expertise to get over some kind of hurdle you''re facing.


    The OpenStack Foundation maintains a Marketplace to find vendors at http://www.openstack.org/marketplace/.
    This marketplace also provides a tour of some of the distributions and appliances
    that are built around OpenStack and seek to make deployment and management easier.
    These distribution offerings almost always need vendor interaction for you to
    explore, but there are some that offer community editions or other simplified
    samples of their products if you wish to explore them on your own.


    In earlier chapters we used Puppet to deploy OpenStack. Some vendors use these
    open source Puppet modules or others covered in Appendix B, "Other Deployment
    Mechanisms," but oftentimes they have built their own or added on top of the open
    source options. It''s valuable to ask how they''re doing a deployment, so you
    can become familiar with their tooling so you know how the pieces are coming together.


    Beyond just deployment mechanisms, as you explore the vendor ecosystem you should
    keep in mind that you''ll likely be moving into other proprietary software components.
    The base is still OpenStack, but the tooling around it will likely be something
    developed or licensed by the vendor to provide value to their customers over their
    competitors. It''s important to understand this as you get into licensing agreements,
    so you can make the appropriate decisions along with your legal department.


    # Public and Hybrid Clouds


    Beyond simply running OpenStack on your own, you can become a user of OpenStack
    clouds by exploring public clouds or leveraging a hybrid cloud environment in
    your organization.


    # Public Clouds


    The OpenStack Marketplace mentioned earlier has a section completely devoted to
    public clouds. As discussed in depth in Chapter 7, "Public Compute Cloud," a public
    cloud is run by a third party, and you are able to interact with it to spin up
    instances (typically virtual machines), add block storage to your instances, interact
    with object storage or manage networking between your instances. It may even be
    somewhat transparent to you that you''re using OpenStack, aside from your familiarity
    with the user-level tooling, as administration of OpenStack itself is handled
    by the vendor.


    With the capability to simply hook in to a public cloud without handling maintenance
    and scaling, this is a very compelling option for many organizations. Public clouds
    can get you the ability to grow exponentially and leverage the services OpenStack
    provides without a large up-front investment or making it a core competency of
    your organization. As you evaluate the options, there are several points to keep
    in mind centered around location, cost and data sovereignty and security.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Location


    One of the most common practical considerations an organization may have is the
    collection, processing and storage of data. If you''re a web-based organization
    and all of your data is coming from customers who interact with your company over
    the Internet, it may make a lot of sense to manage this data in the cloud. You
    can leverage data centers around your country and the world provided by your public
    cloud vendor without having to build that out yourself, and the data is just as
    close to you from your customers as something you might serve up from your own
    data center.


    On the other hand, if your organization is doing more in-house data processing,
    like collecting and passing data between machines that do work on-site or downloading
    it from a specially tuned device that only has access to a single location, you
    may need to evaluate whether a public cloud makes sense for you. There are certainly
    still the scaling and geographically distributed risk-mitigation benefits, but
    your organization becomes heavily dependent upon a fast and reliable Internet
    connection. This can be a costly investment and introduce more risk into your
    environment. A consideration here may be using public clouds as a backup location.


    A big driver for other organizations may be established corporate IT policy or
    PCI Security Standards, so it''s important to be aware of the specific requirements
    within your organization.


    # Cost


    Running OpenStack in-house can be expensive in terms of the investment in hardware,
    data center space and staff. However, many organizations find that once they reach
    a certain scale, this price works out for them better than continuing to pay a
    vendor for use of their public cloud.


    Some of the things to consider when evaluating cost and the benefits you gain
    from using a public cloud include the following:


    +   • **Growth potential:** Will your infrastructure continue to grow as your
    organization succeeds?


    +   • **Age, size and maturity of your organization:** Your organization may have
    leveraged public clouds early on, so an investment didn''t need to be made in
    hardware, space and staff. As the organization continues to mature and succeed,
    it''s vital to do regular re-evaluations to see whether that investment now makes
    sense.


    +   • **Proprietary offerings that you need:** Does the public cloud you''re using
    offer features you can''t find either in open source or through strategic use
    of in-house development? Early stage vendor lock-in is common, and it''s important
    to regularly evaluate what you depend upon and when or if it ever makes sense
    to bring this in-house.


    +   • **Core competencies:** Your organization may make a decision that they don''t
    want to be in the business of paying a team of engineers to manage a private infrastructure.
    Make sure this discussion happens so that use of the public cloud can continue
    to be justified and budgeted for.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'As you can see, there is often a time when companies decide to stop using public
    clouds, but this is not universally true. In the name of core competencies for
    a company, many choose to use public clouds long term in order to focus their
    development efforts elsewhere.


    # Data Sovereignty and Security


    Sometimes overlooked by companies when they start using public clouds, the topic
    of data sovereignty is not one that should be ignored. To quickly define it, data
    sovereignty is the concept in which data processed and stored is subject to the
    laws of the country in which it is located. On a day-to-day basis, users of the
    cloud are not familiar with where their photos are stored or where their streaming
    music comes from, but as the person working to place that data, it’s important
    to keep your customers safe by being familiar with where that data is stored and
    the laws that govern that. When evaluating a public cloud platform, be aware of
    where the data centers are and your options for moving it. This potential risk
    can be weighed against things like latency when placing data far outside your
    customer range and cost that comes from hosting in less popular locations for
    data centers or countries.


    It’s also important to be familiar with data security laws in your country. In
    the United States there are federal laws around the storing of everything from
    medical data (HIPAA) to financial data (FACTA) to data about children (COPPA).
    This is in addition to any state and local regulations that may be in place. It’s
    important to do an evaluation of the type of data you’ll be storing and make sure
    your public cloud provider is able to meet your data security requirements on
    the infrastructure side.


    # Hybrid Clouds


    Beyond the topic of simply leveraging public clouds, many organizations now take
    advantage of hybrid clouds, which are a mix of both public and private clouds,
    sometimes even spanning across multiple public clouds.


    # Uses


    To begin with a series of real world examples like you’ve seen in earlier chapters,
    the following are a couple places where hybrid clouds are used today.


    # OpenStack Infrastructure Team


    On a day-to-day basis, the development teams within the OpenStack project submit
    hundreds of patch proposals that all need tests to be run on them before their
    peers review the code for inclusion. The OpenStack Infrastructure team handles
    the thousands of tests kicked off per day from these proposals by running a fleet
    of OpenStack instances across multiple public clouds, multiple private clouds
    run by companies to support specific components of the project that need specialized
    testing and a private “infra-cloud” that the team manages itself to expand onto
    the donated resources provided by the public cloud companies.


    The tooling for interaction with all these clouds is similar as they all use OpenStack.
    The team has discovered that there are small differences that crop up between
    how different companies structure their public and private clouds, but these typically
    can be overcome'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'by testing and making changes before they are brought into production. If changes
    occur to a cloud the team interacts with, they also have a mechanism to specifically
    disable a single provider without disruption aside from decreased test capacity.


    # Government Research Organization


    As discussed when talking about public clouds earlier in this chapter, there are
    many considerations when looking to leverage public clouds in an infrastructure.
    When you’re a government agency focused on scientific research, many of these
    are especially important.


    One government research organization has been very public about their hybrid cloud
    deployments and has expanded outside the realm of OpenStack offerings by running
    a hybrid cloud that uses OpenStack as a private cloud and then reaching out to
    two entirely different types of public cloud offerings.


    In their infrastructure, they’ve leveraged a cloud management platform offered
    by a vendor that enables them to use similar tools to manage OpenStack and various
    third-party cloud providers with the same tool set. The management platform vendor
    handles abstraction of the tools and APIs to make this possible and works closely
    with their customers to make sure they have access to the various features offered
    by each public cloud vendor, while still providing a uniform experience across
    several types of clouds.


    This solution has enabled them to store data collected from their scientific instruments
    locally to their facility for sharing among researchers using their OpenStack
    private cloud. It has also given them a gateway for citizen scientists and enthusiasts
    to also interact with subsets of data through web and API-based platforms that
    run on public clouds.


    # Vendor Lock-in


    With the sharp rise of open source software in the past decade, many companies
    have become more aware of the risks involved with proprietary vendor lock-in and
    how open source software helps them avoid this. Open infrastructure like that
    provided by OpenStack also plays a role here that is just now being discovered
    by organizations as they find their licenses and rates for proprietary software
    cloud solutions and public clouds increasing.


    By using OpenStack, you are buying into a solid core of software that you can
    build the rest of your infrastructure around without worrying about that core
    rising in cost as you come to depend upon it. Even as you explore the realm of
    vendor-specific, and even proprietary, OpenStack distributions and appliances,
    the risk of lock-in is significantly lower because you’re still working with the
    same core software deep down. You simply have more options when prices increase
    too much or your vendor becomes unavailable.


    Finally, OpenStack runs on commodity hardware. You are not beholden to a hardware
    vendor who is selling you hardware specific to the software that needs to be purchased
    at a premium. Existing commodity hardware in a modern virtualized infrastructure
    should work fine for OpenStack, so you may not need to purchase any new hardware
    to try OpenStack.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Migrate to a New Cloud You Run


    Consider the situation where the vendor you were using to handle your OpenStack
    stops offering those services. In addition to the consultants and ecosystem of
    other vendors that you find both in the OpenStack space and with proprietary cloud
    offerings, your organization can also choose to migrate to a cloud that''s run
    in-house. The switch will likely not be pain-free, but, on the other hand, you''ll
    likely be working with a familiar set of OpenStack tools and using the same open
    source components at a basic level, reducing the learning curve for the technology
    and giving your organization a place to start.


    As you embark on this, you can either hire in-house talent to complete this work,
    hire another vendor or consultant to run your private cloud or even consider moving
    to a public cloud. If you choose to run it yourself, consultants and vendors are
    also available to complete initial stand up and staff training.


    # Migrate to a Cloud Run by a Vendor


    Whether public or private, you have many options as you reach out to a new vendor.
    Again, with OpenStack at the core of your current infrastructure, you have the
    option of working with another OpenStack focused vendor who can quickly get up
    to speed with exactly what you need and want directly in OpenStack terms. If you''re
    migrating to a public-run cloud, familiarity with the OpenStack components will
    save you a lot of time as you migrate your services.


    # Summary


    The business community that has sprung up around OpenStack is one of its greatest
    assets. As you work to build an OpenStack-powered cloud, there will always be
    vendors available who specialize in various components and can offer varying levels
    of support and consultation, from full-stack support in-house to part-time services
    to help with scaling.


    Beyond private clouds that are run within your organization, OpenStack opens the
    door for leveraging public clouds and even running a hybrid cloud. While they
    come with caveats that are important to consider, public clouds are a proven way
    to get an infrastructure running without a high up-front investment and enable
    companies to continue operating without running a physical environment themselves.
    With the hybrid cloud you can use both your private and various public clouds
    to give your organization a significant amount of flexibility.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# # Reference Deployment


    The authors of this book have worked hard to make the demonstration Puppet deployments
    work on the user''s preferred hardware or virtualization configuration. In Chapter
    3, “Networking,” there are diagrams which demonstrate the logical and physical
    diagrams for how a system should be set up.


    If you are struggling with your own configuration or don''t have a preference
    as to the tooling you use, the following is a reference deployment you can use
    that has been tested. We make all the decisions about the hardware, software and
    virtualization technology required.


    # ## Requirements


    This reference deployment will use a single computer (server, desktop or laptop)
    running Ubuntu 14.04. The controller and compute host will be run virtually on
    KVM. The server must have at least the following specifications:


    +   - 1 NIC

    +   - 50G of hard drive space

    +   - 8G of RAM

    +   - Hardware virtualization in the CPU enabled


    This reference deployment will be using the following software installed from
    the Ubuntu software archives: KVM and qemu for virtualization, libvirt to manage
    the controller and compute nodes, Virtual Machine Manager and OpenSSH to access
    the controller and compute nodes and Linux bridging on the host to manage the
    provider networks.


    # ## Installation


    Follow these steps to create the reference deployment.


    +   1. Install Ubuntu 14.04 Desktop. This will be the host machine for your controller
    and compute hosts and you can also run your graphical tooling from here.

    +   2. Install packages to support the environment:


    ```

    ```

    $ sudo apt-get install openssh-server libvirt-bin qemu-kvm qemu-system \\

    virt-manager bridge-utils

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 261
  md: '+   3. Your user should have been added to the libvirt group, but if not you
    can add it with:

    +   `$ sudo adduser your_username libvirt`


    +   4. Log out and log back in for this to take effect.


    +   5. Set up your network bridges:

    +   ```

    +   $ sudo brctl addbr virbr0

    +   $ sudo ip addr add 203.0.113.1/24 dev virbr0

    +   ```


    The 192.168.122.1/24 network will assign IP addresses directly to the KVM-based
    virtual machines you will launch. The 203.0.113.1/24 network will function as
    the external network, which we''ll be able to use to assign fake public addresses
    to the OpenStack instances from this OpenseX pool.


    # **Note**


    You should already have a virbr0 with 192.168.122.1/24, which was set up automatically
    when you installed libvirt. Confirm by browsing the output of:

    `$ ip addr show`


    If it was not, you will want to look into the virsh networking documentation for
    how to manipulate *virs-created networks*. See: `http://wiki.libvirt.org/page/Networking`.


    +   6. Now we''ll create the disk images. Remember, you need **50G of hard drive
    space** available for these two. If you don''t have that much, you may be able
    to shrink these disks slightly, but it will reduce the space you have to work
    with on the controller and compute nodes:

    +   ```

    +   $ sudo qemu-img create -f qcow2 -o preallocation=metadata \

    +   /var/lib/libvirt/images/controller_qcow2 30G

    +   $ sudo qemu-img create -f qcow2 -o preallocation=metadata \

    +   /var/lib/libvirt/images/compute_qcow2 20G

    +   ```


    +   7. Download the latest Ubuntu 14.04 64-bit PC (AMD64) server image from `http://releases.ubuntu.com/trusty/`
    and place it in `/var/lib/libvirt/images/`. This location is important as it will
    be used in a command later. You need to use sudo to place the image in this directory.


    +   8. With these images created and the Ubuntu disk image in place, use the `libvirt
    command` to create your controller node with **4G of RAM** and **2 NICs**:

    +   ```

    +   $ sudo virt-install --connect qemu:///system --controller --vcpus=2 --r 4096
    \

    +   -network=bridge:virbr0 --network=bridge:virbr1 \

    +   -f /var/lib/libvirt/images/controller_qcow2 \

    +   -c /var/lib/libvirt/images/ubuntu-14.04.4-server-amd64.iso --vnc \

    +   --noautostart --os-type linux --os-variant ubuntu/trusty

    +   ```


    +   9. To connect to this, use Virtual Machine Manager, which can be launched
    searching for the Virtual Machine Manager in the Ubuntu dash.


    +   10. Since this VM has two NICs, when you get to the installation screen prompting
    you to Configure the Network, select `eth0: Ethernet` as your Primary network
    interface.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '11. Now create your compute node, with 2G of RAM and 1 NIC:


    ```

    ```

    $ sudo virt-install --connect qemu:///system -n compute --vcpus=2 -r 2048 \

    --network=bridge=virbr0 --f /var/lib/libvirt/images/compute.qcow2 \

    -c /var/lib/libvirt/images/ubuntu-14.04.4-server-amd64.iso --vnc \

    --noautostart --os-type linux --os-variant ubuntu/trusty

    ```

    ```


    With both servers up and running, you can log into them via ssh or interact through
    Virtual Machine Manager (see Figure A.1) to set up the systems as defined in Chapter
    5, “Foundations for Deployments,” and beyond.


    # # Recommendations


    Instead of interacting through Virtual Machine Manager for all your commands,
    you may want to install the openssh-server package on all systems. This will allow
    you to use SSH to connect to the machines and will make pasting commands into
    them easier.


    Additionally, the Firefox web browser comes with the Ubuntu desktop you have installed.
    You can use this to interact with Horizon, the OpenStack Dashboard, without installing
    any additional software.


    ![](img/8684900d708748f86bb043faa5589f9e_262_0.png)


    Figure A.1 Virtual Machine Manager. You can access the KVM instances you created
    by using Virtual Machine Manager.'
