- pgno: 80
  md: "# # Your First OpenStack\n\n> *The journey of a thousand miles begins with\
    \ one step.*\n> \n> *Lao-tzu*\n\nIn Chapter 2, “DevStack,” you got your feet wet\
    \ with an initial deployment of OpenStack using DevStack on a single server. Now\
    \ we are moving on to the basics involved in creating a more realistic install\
    \ of the core components of OpenStack on a single system with the Mitaka release\
    \ of OpenStack on two servers.\n\nWhile these steps will produce a system that\
    \ is more reflective of how OpenStack will look in a real-world deployment, it\
    \ still will not be production-ready. Steps we complete here are manual, resulting\
    \ in an install that is not very maintainable, and we're not taking scaling into\
    \ consideration. In production, you will also want to use some kind of configuration\
    \ management system, such as Puppet, which we use in later chapters.\n\nSince\
    \ configuration management abstracts away so much of the configuration, the instructions\
    \ in this chapter are intended to get you more familiar with the components on\
    \ their own. Understanding the interactions between OpenStack components, MySQL,\
    \ and the message queueing system and how services are added to the Keystone identity\
    \ service are important. This understanding will help you with making architecture\
    \ decisions, debugging and, ultimately, scaling your OpenStack deployment and\
    \ adding new services.\n\n# ## Requirements\n\nFor this demonstration of OpenStack,\
    \ and all subsequent ones in this book, you will want two servers. The first is\
    \ a controller node, and the second is a compute node. These servers will need\
    \ the following specifications, also show in Figure 4.1:\n\n+   - Controller Node—1\
    \ × 64-bit processor, 4GB of memory, 30GB of storage and two Network Interface\
    \ Cards (NICs)\n+   - Compute Node—1 × 64-bit processor, 2GB of memory, 20GB of\
    \ storage and one NIC\n\nIf you're using physical hardware, you will also want\
    \ two physical switches, as described in Chapter 3, “Networking.” If you're using\
    \ a series of Virtual Machines (VMs), you will be creating bridges on the host\
    \ system rather than using physical switches, also outlined in Chapter 3."
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/8684900d708748f86bb043faa5589f9e_81_0.png)


    Figure 4.1 Minimum requirements for the simple, two node deployment


    If you''re using VMs for this setup, adding a second NIC should be simple. See
    the documentation for your VM technology for how to do this. As in Chapter 2,
    for best performance you also will need to use a 64-bit CPU with hardware virtualization
    support and, preferably, at least four cores, so you can launch an instance.


    # ## Reference Deployment


    The examples in this book are intended to be flexible enough to work with your
    choice of virtualization technology or hardware setup. However, if you are satisfied
    with using a deployment example prepared and tested by the authors, see Appendix
    A, “Reference Deployment.” This reference deployment walks you through using an
    Ubuntu 14.04 system as a host with Linux Bridges, the libvirt toolkit with KVM
    (Kernel-based Virtual Machine) for the OpenStack nodes and QEMU for compute instances.


    Use of the reference deployment is also recommended if you’re struggling to get
    the configurations working on your own choice of setup. Nuances regarding networking
    defaults, in particular, vary between virtualization technologies and can easily
    put you in a situation that is difficult to debug while you’re also learning OpenStack
    fundamentals.


    # ## Initial Setup


    You will begin by satisfying the prerequisites needed for a working network. Once
    your network is set up, we’ll then complete an installation of the operating system
    on your system and install the key components of OpenStack. As discussed in Chapter
    1, “What is OpenStack?” the operating system we’ll be using is Ubuntu 14.04 LTS
    Server, and we’ll be installing the Mitaka release of OpenStack. This chapter
    leads you through creating a fully manual network to get you familiar with the
    specific components. In the next chapter you’ll be introduced to how we do this
    with Puppet.


    # ## Networking


    In Chapter 3 you learned about the internals of how networking works in OpenStack
    and, specifically, how it works for the deployments we’re working on. If you’re
    using a physical network set up according to Figure 3.2 in Chapter 3, the virtualized
    networking we’ll be talking about in this section is instead handled by the hardware
    on your network. With your physical network in place, you can skip to the next
    section, “Operating System.”'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# **Tip**


    If you''re using our reference deployment in Appendix A, instructions for setting
    up the network and operating system are provided there. You are welcome to read
    through the following to increase your understanding of how configuration is done
    manually, but you can safely skip down to the “System Configuration” section of
    this chapter.


    If you''re using a virtualization technology other than our reference deployment
    in Appendix A to run through these deployment scenarios, you will need to do a
    bit of configuration on the host system where your OpenStack virtual machines
    are running.


    Both VMs, controller and compute, will need to be configured to use a bridge with
    NAT. This is likely an option in the configuration of your virtualization technology.
    A basic NAT, in which all of the VMs’ outbound traffic is automatically translated,
    will not work for this environment.


    The following is an example of how you would set up your bridges on the virtual
    machine host if it’s not being done automatically by your virtualization technology.
    You will need the bridge-utils and iptables packages installed.


    ```

    $ sudo brctl addbr virbr0

    $ sudo ip addr add 192.168.122.1/24 dev virbr0

    $ sudo ip link set up dev virbr0

    $ sudo iptables -t nat -A POSTROUTING -s 192.168.222.0/24 \

    \! -d 192.168.122.0/24 -j MASQUERADE

    $ sudo brctl addbr virbr1

    $ sudo ip addr add 203.0.113.1/24 dev virbr1

    $ sudo ip link set up dev virbr1

    ```


    When you launch your controller node, one NIC should be associated with virbr0
    and the second NIC with virbr1. The NIC connected to the virbr0 network will be
    how you access the system to configure and interact with OpenStack. The second
    bridge (virbr1) will be used for the example external network, which will be used
    to give your instances access beyond their default tenant networks.


    # **Note**


    If you’re using virsh and KVM for your environment you will likely already have
    a virbr0 configured and only need to add virbr1. A DHCP service will also be run
    by virsh to automatically assign a 192.168.122.1/24 address to your VM.


    If a DHCP server is not automatically assigning addresses, you will need to manually
    configure an address on each of the nodes for their eth0 interface. You may use
    the following parameters during the installation of Ubuntu 14.04 LTS Server on
    these nodes:


    +   - IP Addresses—192.168.122.2 (for controller) or 192.168.122.5 (for compute)

    +   - Netmask—255.255.255.0

    +   - Gateway—192.168.122.1

    +   - Name server addresses—8.8.8.8, 8.8.4.4


    Your single NIC compute node needs to be associated with virbr0.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Operating System


    Now that you understand how networking needs to be set up, install Ubuntu 14.04
    LTS Server on your OpenStack nodes. During the installation most defaults will
    be fine, but you can use the “Guided – use entire disk” in the “Partition disks”
    screen option, since you don’t need LVM. Also, when you come to a screen that
    says Software selection, which allows you to select additional components for
    installation, make sure everything is unselected except OpenSSH server. This option
    will install the SSH daemon on the servers and start it when you first boot up
    so you can access it remotely over SSH.


    If you didn’t choose to do software updates during installation, do them after
    you have installed and booted your nodes so you have an up-to-date Ubuntu system:


    ```

    $ sudo apt-get update

    $ sudo apt-get dist-upgrade

    $ sudo reboot

    ```


    This may take some time, but Ubuntu will give you a package count and status on
    downloads and configuration. This upgrade will likely include a new kernel, so
    we reboot the systems before moving forward so that they come up in the new kernel.
    Once you have rebooted, you’re ready to move on to manual system configuration.


    From this point forward, everything covered in this chapter is automatically done
    by Puppet in later chapters. Again, this chapter walks you through how to do a
    basic installation of OpenStack without Puppet so you can gain an understanding
    of how the pieces fit together.


    # System Configuration


    When the system boots, you will want to enable the Ubuntu Cloud Archive for the
    latest version of OpenStack with the following command and update the package
    lists as well as any packages that the cloud archive brings in that are newer
    than what comes with Ubuntu 14.04 by default:


    ```

    $ sudo add-apt-repository cloud-archive:mistaka

    $ sudo apt-get update

    $ sudo apt-get dist-upgrade

    ```


    Note mistaka in the first command. As explained previously, at the time of writing
    Mistaka is the name of the latest stable release of OpenStack. The update command
    is also important. Without running it you will not get all the packages you need,
    and it will install a much older version of OpenStack that is not compatible with
    some of the options explained in this book.


    You’ll now move into configuring the network and installing the packages required
    for the OpenStack components running on each of your nodes.'
  merge: -1
  img_proc: true
- pgno: 84
  md: "> **Tip**\n> \n> A git repository called scripts-and-configs is part of the\
    \ DeploymentsBook project on GitHub at https://github.com/DeploymentsBook. This\
    \ repository contains the contents of many of the configuration files and more\
    \ detailed in this chapter. You can use this repository to copy and paste any\
    \ of the examples into your systems rather than copying them character by character\
    \ from this book.\n\nWe’ll begin with the controller node.\n\n# Controller Node\n\
    \nThe controller node is the heart of your OpenStack deployment. It runs all of\
    \ the OpenStack services, your database, the queueing server and more. The other\
    \ node, compute, is reserved only for running compute instances.\n\n# Networking\n\
    \nThe networking specifications for our deployments were discussed in detail in\
    \ Chapter 3. The first modification to your configuration that you’ll need to\
    \ make is to your `/etc/network/interfaces` file, which configures your networks.\
    \ In the following example, the assumption is that you have your local loopback\
    \ interface, lo, and your two NICs defined as the eth0 and eth1 interfaces.\n\n\
    > **Remember**\n> \n> The eth0 interface is the one connected to virbr0 or the\
    \ switch that connects to the compute server.\n> \n> The eth1 interface is either\
    \ connected to virbr1 or is the one that connects out to your other switch, into\
    \ our example provider network for “public” addresses.\n\nOpen `/etc/network/interfaces`\
    \ using sudo and your preferred text editor and make changes so it looks something\
    \ like the following:\n\n```\n# The loopback network interface\nauto lo\niface\
    \ lo inet loopback\n\n# The primary/maintenance network interface\nauto eth0\n\
    iface eth0 inet static\n    address 192.168.122.2\n    netmask 255.255.255.0\n\
    \    network 192.168.122.0\n    broadcast 192.168.122.255\n    gateway 192.168.122.1\n\
    \    dns-nameservers 8.8.8.8 8.8.4.4\n\n# Tenant network (no address directly\
    \ assigned)\nauto eth1\niface eth1 inet manual\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: 'In this example, the IP address of your controller server is 192.168.122.2.
    Adjust this to be consistent with your own network and the address of your controller
    server that was served from DHCP.


    Now you''ll want to bring up your eth1 network. This will not have an address
    directly assigned but will need to be in the UP state for the networking service
    to use it later:


    ```

    $ sudo ipup eth1

    ```


    The next time you reboot, this interface will come up automatically. You can test
    this now if you like and then confirm that eth1 is in the UP state.


    ```

    $ ip link show eth1

    3: eth1: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP
    mode DEFAULT

    group default qlen 1000

    link/ether 54:24:00:7b:95:83 brd ff:ff:ff:ff:ff:ff

    ```


    Finally, add the controller host and the compute host to your /etc/hosts file.
    This is not necessarily a change you''d use in production, but it will make subsequent
    steps in this chapter easier by resolving your IP addresses for you in places
    where a name will suffice. In this example, your compute server has the address
    of 192.168.122.5. The following can be added to the bottom of the file:


    ```

    192.168.122.2 controller

    192.168.122.5 compute

    ```


    Keep this change in mind as you continue going through this chapter. In place
    of the IPs for each server, we will be using the names “controller” and “compute”
    to refer to them in the configurations.


    # Packages


    The OpenStack controller requires several packages to prepare your environment.
    These will often come from the regular Ubuntu repositories, so sometimes the Ubuntu
    Cloud Archive team will include a newer version of a piece of software in the
    repository for use with a newer version of OpenStack. Use the following command
    to install these pre-requisite packages on your controller server:


    ```

    $ sudo apt-get install ntp rabbitmq-server mysql-server \

    python-pymysql python-openstackclient openvswitch-switch

    ```


    This will install the Network Time Protocol (ntp) daemon to make sure your time
    stays properly synced between nodes. No configuration is required for ntp. Services
    for the back end of OpenStack to function will also be installed with the command,
    including the queue service RabbitMQ, the MySQL server and related python connector
    for MySQL. During installation you will be prompted to set a root password for
    MySQL. Make sure this is a unique and secure password that you will remember.
    The python-openstackclient tool will be used to make most queries to your OpenStack
    services. The Open vSwitch package is needed for networking, configured later
    in this chapter.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# # Initial Setup


    **Tip**


    Did you get an "E: Unable to locate package python-pymysql" message? This package
    is

    only included in the Ubuntu Cloud Archive (UCA). Make sure you followed the earlier
    step to

    enable the UCA and ran apt-get update to make sure your sources are current.


    RabbitMQ does not prompt you to create a user and set up permissions, so we''ll
    want

    to do that now. In the following command and subsequent responses, we are creating
    a

    user called "openstack" and you will replace RABBIT_PASSWORD with a password

    you wish to use.


    ```

    $ sudo rabbitmqctl add_user openstack RABBIT_PASSWORD

    Creating user "openstack" ...

    $ sudo rabbitmqctl set_permissions openstack "\.\.\." "\.\.\." "\.\.\."

    Setting permissions for user "openstack" in vhost "/" ...

    ```


    Remember the password set. You will need it later when configuring Nova and Neutron.


    **Tip**


    We''re using the same RabbitMQ password for all services. In Production it''s
    recommended

    that you use different Rabbit credentials for every service.


    Finally, a couple of changes will need to be made to the MySQL configuration.

    Create a new file called /etc/mysql/conf.d/openstack.cnf that will contain the
    following,

    replacing the 192.168.122.2 example with your own controller address:


    ```

    [mysql]

    bind-address = 192.168.122.2

    default-storage-engine = innodb

    innodb_file_per_table

    collation-server = utf8_general_ci

    character-set-server = utf8

    ```


    With that file in place, restart the MySQL server to apply the changes:


    $ sudo service mysql restart


    Your controller now has a basic configuration. After you do the basic configuration

    of your compute node, we''ll be able to start installing OpenStack packages for
    services

    you''ll be running on your node.


    # ## Compute Node


    Since the compute node is only used for running OpenStack instances, the requirements

    here are considerably simpler.


    # ## Networking


    The only change you should need to make in your compute system regarding networking
    is to the /etc/hosts file, just like you did for the controller node. As before,
    in this

    example we''re assuming your controller has the address of 192.168.122.2 and the
    compute server has the address of 192.168.122.5. Again, update all the examples
    to reflect

    the real addresses of your systems.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The following can be added to the bottom of your /etc/hosts file:


    ```

    ```

    192.168.122.2      controller

    192.168.122.5      compute

    ```

    ```


    You’ll want to keep this change in mind. This is not something you’d necessarily
    do in production, but for our purposes, using the names “controller” and “compute”
    to refer to each system as we set up services makes explaining everything easier.


    # ### Packages


    At this stage of the install, you only need two packages:


    ```

    ```

    $ sudo apt-get install ntp python-openstackclient

    ```

    ```


    The Network Time Protocol (ntp) daemon, which makes sure time stays properly synced
    between nodes and the python-openstackclient tool, will be what you use on the
    command line to make most queries to your OpenStack services. We install the client
    on your compute node just in case you need to use it for debugging later.


    # ## OpenStack Components


    Now that your core systems have been prepared, you will go ahead and set up the
    typical standard services for OpenStack for a simple configuration. On the controller,
    you will have the following key services with their various supporting agents,
    daemons and plug-ins:


    +   - Keystone (Identity)

    +   - Nova (Compute)

    +   - Neutron (Network)

    +   - Glance (Image)


    On the compute node, you will simply be running the Nova compute service for running
    instances and the openvswitch agent for Neutron to handle the tunnels. We’ll begin
    with the configuration of the controller node.


    # ### Controller Node


    Again, your controller node is what will run the core services of OpenStack. It
    runs most of the services, the database and queuing servers, and is the host for
    the API endpoints. This server also has the two NICs for handling networking traffic
    that comes from the compute server.


    # #### Keystone


    As described in Chapter 1, “What Is OpenStack?” Keystone is the Identity Service
    for OpenStack that provides identity, token, catalog and policy (such as roles)
    services for OpenStack. For users and services, Keystone can be used to provide
    user-based authentication with passwords or more service-focused interactions
    between OpenStack services'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'through APIs using tokens. Keystone also tracks policy for users and stores
    the API endpoints for each OpenStack service. Each of the services you deploy
    for OpenStack must register with Keystone or an alternate identity service providing
    the same function, so we want to install this first.


    We configured the Ubuntu Cloud Archive for Mitaka earlier in the chapter, which
    means we can now install the latest OpenStack stable release packages using apt-get.
    However, we''ll first create a MySQL database and user with access to that database
    to use with Keystone. You may do this with a MySQL tool that you are already familiar
    with or via the command line with the following commands, where `KEYSTONE_DBPASSWORD`
    is replaced with a database password for the Keystone user:


    ```

    $ mysql -u root -P

    mysql> CREATE DATABASE keystone;

    mysql> GRANT ALL PRIVILEGES ON keystone.* TO ''keystone''@''%'' IDENTIFIED BY

    ''KEYSTONE_DBPASSWORD'';

    mysql> quit

    ```


    Before we install Keystone itself, we want to make sure it doesn''t start any
    legacy daemons upon launch. Run the following (this command has no output):


    ```

    $ sudo sh -c ''echo "manual" > /etc/init/keystone.override''

    ```


    Now you can install Keystone, the Apache web server with WSGI (Web Server Gateway
    Interface), which is used in lieu of a Keystone daemon:


    ```

    $ sudo apt-get install1 keystone apache2 libapache2-mod-wsgi

    ```


    Once these packages installed, you will now have a configuration file for Keystone
    located at `/etc/keystone/keystone.conf`. You will need to use sudo to edit this
    file.


    # Warning


    The directories containing OpenStack configurations such as `/etc/keystone` are
    owned and only read-accessible by the root user. The files contained within include
    important secret data that other users on the system should not be able to access.
    Do not change these permissions.


    This Keystone configuration file will need a few edits. We''ll begin by adding
    an admin_token. The admin_token is an important piece of data that gives you a
    considerable amount of access to Keystone-and so your whole OpenStack deployment.
    It is used temporarily for our initial configuration and should not be a simple
    password. Official OpenStack documentation recommends that you use the following
    command to generate your admin token:


    ```

    $ openssl rand -hex 10

    ```


    Take the result of this command, and add it to the configuration. This is also
    under the [DEFAULT] section. Here is an example:


    ```

    admin_token=975c8ac7c7718d33ba57

    ```'
