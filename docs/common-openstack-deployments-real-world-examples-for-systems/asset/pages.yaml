    Then you will install the Neutron packages. Like Nova, there are several things
    you''ll need to install:


    ```

    $ sudo apt-get install neutron-server neutron-dhcp-agent \ neutron-l3-agent neutron-metadata-agent
    neutron-plugin-ml2 \neutron-plugin-openvswitch-agent

    ```


    # Basic Pieces of Neutron


    Just like Nova, Neutron has several services in a standard install. The following
    is a quick rundown of the services you are installing:


    +   - **Agents**—Typically run on your controller node and communicated directly
    to the Neutron server to provide certain functions, like DHCP or IP forwarding
    and NAT. They can also work as an agent for a plug-in.

    +   - **Plug-Ins**—Often interface with an agent and provide support for specific
    components, such as the virtual networking solutions like Open vSwitch, or support
    for specific networking hardware, which may be open source or proprietary.

    +   - **Server**—The actual server that listens for API requests from the queue
    and completes them or routes them to the appropriate agent or plug-in for dispersion
    and then completes them.'
