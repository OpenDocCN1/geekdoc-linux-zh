- pgno: 275
  md: 'Tip

    If you''re interested in working on a specification, coordinate your work with
    the rest of the team. There are often already people working on specifications
    and you don''t want to duplicate work.


    Note that if you''re just working to fix a bug or make a simple change that has
    been discussed with the project team, either in IRC or on the OpenStack Development
    mailing list, you do not need to go through the specification process.


    # ## Bug and Feature Tracking


    The OpenStack project uses the open source project platform Launchpad at https://launchpad.net/
    for bug and feature tracking. While the project continues to explore other options,
    one of the key things that Launchpad has offered the OpenStack project is the
    ability to mark bugs as impacting multiple projects. For a project that is made
    up of many pieces that build the larger project we call OpenStack, the ability
    to mark multiple projects is essential.


    # ## Git and Code Review


    OpenStack uses Git for code revision control. All code for the OpenStack project
    goes through peer-review, through a code review system called Gerrit hosted at
    https://review.openstack.org .


    After passing a series of automated tests (see "Testing Infrastructure" later
    in this appendix), project members then do a thorough review of the code. Code
    review may consist of making sure the code is safe and well-written and generally
    adheres to project standards. Reviewers may also test the code and offer feedback
    about how it can be run more efficiently or leverage other components of the project
    more effectively. Code testing is also deeply ingrained in the culture of OpenStack,
    so it''s common for reviewers to insist upon tests when the code touches certain
    components of the project, such as the API.


    Review of your code can take days or weeks, depending on the code submitted and
    when in the release cycle it has been submitted. Best practices for getting your
    code included are as follows:


    +   * Submit early in the release cycle—later in the cycle code contributions
    become more restricted.

    +   * Submit small changes rather than large ones—small changes are easier to
    review so more likely to get reviews.

    +   * Be diligent about quickly following up with any comments to your code.


    For code to ultimately be included, it needs peer review from other community
    members and approval in the form of a +2 vote from at least two core reviewers
    in a project. Once code has two +2 votes, a core reviewer can then Approve the
    change for final testing.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '**Tip**


    Having trouble finding someone to review your change? Anyone can review and add
    a +1/-1 vote to a review, so build up goodwill in the community by reviewing changes
    submitted by other people. Increasing your review numbers through thoughtful,
    thorough reviews is also a way to start building a reputation so that you, too,
    someday could become one of the core reviewers.


    If all else fails, you can join the project IRC channel and ask for some feedback
    on your review. Do not send review requests to the development mailing list.


    Full documentation for getting set up with Git and the code review system, including
    the process for getting an account, is in the Developer''s Guide portion of the
    OpenStack Infrastructure User Manual http://docs.openstack.org/infra/manual/developers.html.


    # Testing Infrastructure


    All code submitted to the OpenStack project goes through a series of automated
    tests completed by the OpenStack Continuous Integration (CI) test infrastructure.
    The test infrastructure runs a series of tests, including unit tests defined in
    the project itself, code consistency tests for Python code that include lint and
    pep8 tests and full integration tests where an instance of OpenStack (in this
    case, DevStack) is launched to confirm that code being tested for one project
    does not have adverse impact on any other projects in OpenStack.


    As described in Figure D.1, all code goes through a series of servers on the journey
    to be tested. First, code is uploaded to the code review system from the developer''s
    system. The code review system then notifies a tool called Zuul that queues jobs
    up for testing, noting dependencies and order to make sure all changes are properly
    tested against each other. Zuul hands off the change to a Gearman worker, which
    then decides where to pass it to for actual testing on the test slaves, which
    are managed in a fleet by Nodepool.


    Many projects today also have third-party CI systems also voting on changes. These
    come from various companies and organizations to test both open source and proprietary
    solutions against the latest commits to the OpenStack project repositories. Typically,
    you want to have your code passing these tests as well, but there are a variety
    of reasons why you may see your code get approved while some of the third-party
    tests are failing (outages, misconfiguration, etc.).


    This process is largely invisible to the developer. All they know is that they
    have submitted code for review and can track the status of their tests by visiting
    the Zuul status page at http://status.openstack.org/zuul/ and searching for the
    change number. Once tests have completed, a bot comments in the code review interface
    with test results and verifies whether they have passed or not by leaving a verification
    vote. From there, peers and core reviewers review the code and then approve it,
    as described earlier in the “Git and Code Review” section of this appendix. Once
    the code is approved, it then goes through final testing called The Gate, which
    makes sure no conflicts or changes have arisen since the first testing that now
    cause the code to fail to merge or work properly. Once the code passes these tests,
    it is accepted into the project.'
  merge: -1
  img_proc: true
