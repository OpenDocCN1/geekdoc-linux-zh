- pgno: 30
  md: "# 1\n\nWhat Is OpenStack?\n\n> > *If I could remember the name of all these\
    \ particles,*\n> > *I would have been a botanist.*\n> > \n> > Enrico Fermi\n\n\
    As an infrastructure project that has a variety of options available for various\
    \ types of deployments, answering the question “What is OpenStack?” can take some\
    \ time. Simply put, OpenStack is a series of independent, yet related, software\
    \ pieces that can be used to build an infrastructure for deploying and managing\
    \ servers and storage arrays of various types. These software pieces include projects\
    \ for web– or API-based control, compute, networking, object storage, block storage\
    \ and more.\n\nWhole books can and have been written covering each of these components.\
    \ In this chapter, we talk about some of the basics around cloud, and you are\
    \ provided with an overview that will serve as a reference for the various components\
    \ as you begin working on sample deployments in the next several chapters. Further\
    \ detail about each component, and how it relates to the deployment you’re working\
    \ on, will be provided as you go through each deployment scenario.\n\nThe Preface\
    \ explained that the target operating system for this book is Ubuntu. The chapter\
    \ will conclude by talking about the Ubuntu Cloud Archive, which always provides\
    \ the latest version of OpenStack to each supported Ubuntu Long Term Support release\
    \ as well as the Puppet modules we will use for the deployment scenarios.\n\n\
    # The Cloud\n\nThe term “cloud” has become very overloaded in recent years. To\
    \ the layperson it may mean the place where all of their music and photos are\
    \ kept where they use syncing and storage applications for their phones. A developer\
    \ working for a payroll accountant may view the cloud as a platform against which\
    \ applications for the financial department can be written. To a systems administrator\
    \ it may specifically mean where a virtual machine, able to be scaled and deployed\
    \ on demand but otherwise almost indistinguishable from any other basic server\
    \ to which they’ve deployed applications, resides. This is where we get to the\
    \ distinction of different “as a Service” models."
  merge: -1
  img_proc: true
- pgno: 31
  md: 'In the first example of a user uploading photos and music, this is typically
    known as Software as a Service (SaaS). The user may have a local application to
    accomplish the task of syncing the data, but it''s then uploaded to a centralized
    location and the user has no view into or any control over how this works. When
    the user shuts off the device, the software in “the cloud” still runs. This is
    in contrast to how users may have stored all of their files on their desktop computers
    in the past and synced to their phones from there.


    The second example takes advantage of Platform as a Service (PaaS). A development
    team may select a specific PaaS provider that has the required back end, support
    for their tools and focus for their organization. In the case of a payroll department,
    they may choose a PaaS provider that specializes in finances but which allows
    them to build their own applications to support and augment the default features.
    Now, instead of having servers in-house for the accountants to interact with,
    they are using a service online that has a framework supported by the PaaS company,
    with features provided by their own developers. Again, there is no view or control
    over how this works on the customer side.


    The third example of deploying scalable virtual machines is the lowest level Infrastructure
    as a Service (IaaS). If you purchase this from a vendor, you typically still don''t
    have control over the underlying hardware, like how a background networking works
    or view into when a hard drive dies. However, you do get access to the full operating
    system on each virtual machine you create, enabling freedom to tackle software
    decisions and problems without having to worry about the hardware that is keeping
    everything running.


    This growing world of “as a Service” models is where OpenStack was born in mid-2010.


    # OpenStack Joins the Cloud


    The mission statement for OpenStack is as follows: “to produce the ubiquitous
    Open Source Cloud Computing platform that enables building interoperable public
    and private clouds regardless of size, by being simple to implement and massively
    scalable while serving the cloud users’ needs.” This statement gives you a view
    into the environment that OpenStack entered when it was founded. There were some
    open source options for cloud, but it was never the comprehensive solution that
    OpenStack has ultimately provided.


    Since it was founded in 2010, OpenStack is a relative newcomer to the cloud technology
    scene. It was initially a collaboration of components due to be made open source
    by Rackspace and NASA around the same time, and so was launched with much fanfare
    by these organisations. They were quickly joined by other major technology companies
    who were interested in collaborating on a centralized core for open cloud technology,
    rather than building their own in house. In 2012 the formal OpenStack Foundation
    was created with the support of several founding organizations in order to provide
    an organization-independent body. The foundation serves to protect respective
    trademarks and handle legal issues that could arise within OpenStack, organize
    the participation of the various organizations involved and to make sure a healthy
    development, user and operator'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'community is promoted and maintained. To this end, the OpenStack Foundation
    is the leader in organizing the OpenStack Summits every six months, handles trademark
    disputes even hires development talent to address specific concerns within the
    community.


    The commitment to open source (along with the other three “opens”: design, development
    and community) is key to the success of OpenStack. Many of the organizations who
    now put development resources into OpenStack do not necessarily want to give control
    to and pay a vendor for their infrastructure stack or are hoping to compete in
    that market. By using OpenStack, your organization can build their own cloud platform,
    offering everything from the basic Infrastructure as a Service with a cloud computing
    offering, to building a comprehensive object storage cloud where users can easily
    store their files on your scalable storage back end.


    # ## Building Your Cloud


    Managing systems is a lot like baking a cake. There are plenty of options to choose
    from: pay a friend (contractor) to make it, get it pre-made from a bakery (commercial
    solutions), go to a bake sale (third-party vendors) and so on. However, in order
    to get the best possible cake to suit all of your needs, you’ll want to bake it
    yourself. Unfortunately baking it yourself (building in-house) is very time-consuming
    and can be just as expensive as buying one.


    What if instead you were able to buy each component of the cake pre-made, but
    to your specifications? You would have a cake suited to your particular tastes
    and methods but instead of having to bake it from scratch, all you have to do
    is assemble the components and bake. This is the approach that OpenStack takes.
    OpenStack provides a fully functioning cloud in its open source offering, but
    your organization can then extend and expand upon it as you see fit. In the most
    basic implementation, only a handful of services are required and you can add,
    mix and remove components that is most appropriate for your environment.


    # ## Uses


    Progressing in your OpenStack learning experience, you will learn about several
    common uses, from organizations wishing to build a collection of computational-driven
    server instances for their researchers to those looking for an object storage
    solution for files belonging to their customers. Organizations that have found
    OpenStack to be useful include for-profit companies across various markets, governments,
    educational institutions and non-profit organizations. Deployments can be used
    entirely in-house to service applications run within an organization or be used
    to give computing and other resources to users paying them directly. There’s also
    a hybrid cloud approach where an organization leverages a mixture of their own
    in-house constructed OpenStack alongside a hosted solution. Learn more about the
    hybrid approach in Chapter 14, “Vendors and Hybrid Clouds.”'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'As we walk through deployment scenarios in the following chapters, specific
    uses will be detailed to provide examples and a taste for the flexibility of OpenStack.


    # ## Key Components


    OpenStack is built from a series of components that are developed as their own
    projects within the OpenStack community. The following is a quick summary of each
    of the terms that will be referenced in the deployments throughout this book.


    # ### Instances


    With the exception of storage and bare-metal focused deployments, you will need
    to be familiar with instances in OpenStack. Instances are typically Virtual Machines
    (VMs) using an underlying VM technology that you may be familiar with such as
    KVM or gemu, VMware or Hyper-V. However, as you will learn in Chapter 11, “Controlling
    Containers,” there has been a push to provide stronger support of containers in
    OpenStack. Whether they are VMs or containers, they are referred to as instances
    in OpenStack.


    # ### Queuing


    Before getting into specific OpenStack project components, it''s important to
    talk about how the services interact with each other. At the most basic level,
    OpenStack services interact through a series of APIs that each project supports.
    Calls to these APIs are handled by a messaging queue that is installed early in
    an OpenStack installation. All interactions go through the queue so that processing
    can be reliable and predictable, happening in the order in which they were issued
    and providing a buffer when there is a spike in usage so that none of the commands
    issued get lost. In order to interact with this queuing system, most post requests
    directly, but you will notice that a small subset of the OpenStack components
    also run with a scheduling daemon.


    # ### Dashboard (Horizon)


    Horizon is the web-based dashboard for OpenStack that provides an interface for
    both OpenStack administrators and users of the platform. It enables administrators
    and operators to manipulate various settings related to users, servers, quotas
    and more. The dashboard is also easily customizable by organizations and cloud
    operators who wish to add their own branding to the dashboard. The capabilities
    of Horizon expand as OpenStack continues to grow and add features with each release.


    The interface for administrators provides the capability to manipulate users,
    view system information and adjust defaults and much more (see Figure 1.1).


    By contrast, the user dashboard shown in Figure 1.2 is a user-facing view that
    enables individual users to control their virtual machines, networking configuration
    and components made available to them by an administrator.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/8684900d708748f86bb043faa5589f9e_34_0.png)


    Figure 1.1   Administrative Dashboard. The Administrative dashboard enables configuration
    of OpenStack users and system-wide setting.


    ![](img/8684900d708748f86bb043faa5589f9e_34_1.png)


    Figure 1.2   User Dashboard. The User dashboard is provided to manage virtual
    machines and configurations on a per-user basis.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/8684900d708748f86bb043faa5589f9e_35_0.png)


    Figure 1.3  Several compute instances. The dashboard provides various simple tools
    for instance manipulation.


    While many operators choose to use the command line interface and API for auto-mated
    control of large fleets, the Horizon dashboard page for managing instances (see
    Figure 1.3) enables quick and simple deployment of individual instances without
    having to have a highly sophisticated background in OpenStack. This enables it
    to be presented to users who have simple needs when it comes to small deployments
    of instances and provides a clean interface for completing various tasks.


    Another component in Horizon is the networking screen (see Figure 1.4). The OpenStack
    Networking component, Neutron, is now widely used for the flexibility it provides
    operators in handling networks. An administrator may grant a lot of flexi-bility
    to users when it comes to how they use networks, from providing simple access
    that give instances direct Internet access, to allowing a whole series of instances
    created by the user to privately interact with each other without being on the
    public Internet.


    The plethora of tools provided by Horizon make it a valuable tool for administrators
    and operators. However, note that given the way that OpenStack itself is developed,
    the command line interface will always have more features than Horizon. Addition-ally,
    everything that can be done in Horizon can also be done with the command line
    tools.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/8684900d708748f86bb043faa5589f9e_36_0.png)


    # ## Compute (Nova)


    Nova is the compute component of OpenStack. Along with being one of the most well-known
    projects in OpenStack, it is also one of the two projects launched when OpenStack
    was announced as a project in 2010 (the other was Swift for object storage). The
    compute component handles provisioning and control over the compute servers in
    OpenStack. As noted earlier, Nova has a variety of drivers that enable it to talk
    to a variety of VM and container technologies, including: libvirt (supporting
    qemu/KVM), Xen, VMware, Hyper-V and Docker.


    This component consists of the following core daemons and services that most installations
    will have:


    +   - **nova-compute**: Accepts actions from the queue in order to perform common
    actions on an instance, like starting and terminating.

    +   - **nova-conductor**: In order to avoid nova-compute having risky direct access
    to a database that can cause irregular data, the conductor controls interactions
    between the compute daemon and the database.

    +   - **nova-scheduler**: Controls interactions with the messaging queue, picking
    up requests from the queue, determining which Nova compute instance to send it
    to and passing it along.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   - nova-api: The API service that Nova runs so that other services, the
    CLI and Horizon can interact with Nova.

    +   - nova-api-metadata: The API service that responds to metadata requests that
    returns data about specific instances.


    Unless you''re running a single-server instance of OpenStack (typically only for
    testing or development), some of these services will be divided across servers.
    For instance, to provide sufficient isolation, the nova-compute daemon should
    be on a different server than the database and conductor. As we explore our first
    few deployments, starting in Chapter 6, “Private Compute Cloud,” you will see
    more examples of how these services are split up.


    If you''re seeking to use console-based access to the instances, you may also
    be using some of the following daemons: nova-consoleauth, nova-novncproxy, nova-spicehtml5proxy
    or nova-xvpncproxy. Console-based access can be in the form of access via the
    Horizon interface as shown in Figure 1.5.


    You can also gain direct VNC-type access through your VNC client of choice. For
    small deployments and when you are testing you can also use an interface like
    libvirt''s Virtual Machine Manager (https://virt-manager.org/) graphical interface
    as seen in Figure 1.6. You will notice that this tool only provides basic support
    for connecting to compute nodes one by one and so is not a sufficient console
    tool as you scale your infrastructure.


    ![](img/8684900d708748f86bb043faa5589f9e_37_0.png)


    Console access via Horizon Dashboard. A console daemon is required for console
    access to be enabled in the Horizon Dashboard.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/8684900d708748f86bb043faa5589f9e_38_0.png)


    Figure 1.6 Accessing OpenStack with Virtual Machine Manager. Virtual Machine Manager
    can be used for accessing qemu/KVM-based OpenStack instances.


    # Identity (Keystone)


    Keystone is the identity service for OpenStack. It is used by other services to
    confirm the identity of a user. Confirmation of identity can be done through various
    mechanisms, from a simple user name and password or API key combination to an
    authentication token provided by Keystone itself. Once authenticated, Keystone
    has a concept of Projects, Domains and Roles that control what a User or User
    Group can do. Each of these and how they interact are explored further in Chapter
    4, “Your First OpenStack.”


    Rather than running as a standalone daemon, today Keystone instead uses a Web
    Server Gateway Interface (WSGI). By default, Apache with mod_wsgi is used to serve
    up the Keystone service.


    > **Note** Keystone used to run a standalone daemon, so you may see reference
    to it if you find documentation prior to the Kilo release. This standalone daemon
    method is no longer supported. All Keystone deployments now use the WSGI method.


    # Networking (Neutron)


    Neutron is the networking component of OpenStack. It provides a variety of networking
    options for your OpenStack cloud. Defaults will set up a private network that
    instances live directly on and an Internet routable (or public) network that you
    will need to connect instances to in order for them to get a public address.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'The project began as a subset of Nova called nova-network and eventually branched
    off into its own project that was previously named Quantum. The previous project
    name, Quantum, is why you may see q- in some of the log names when we deploy DevStack
    in Chapter 2, "DevStack". Neutron has been built to support a vast array of network
    configurations made available through a series of plug-ins. More plug-ins are
    added each release but currently include various network bridge types, virtual
    local area networks (VLANs) and subnets and plug-ins for several proprietary networking
    switches and other network tools, both physical and virtual.


    Neutron requires a daemon to process requests, and you need to run plug-ins and
    agents to complete specific tasks depending on your deployment.


    +   - neutron-server: A daemon that accepts and sends requests via the API to
    the appropriate Neutron plug-in.


    +   - plug-ins and agents: Neutron ships with several for port, bridge and address
    handling as well as more vendor-specific plug-ins for various virtual and physical
    switches.


    Basic configuration of Neutron will be covered as we work through sample deployments.
    Neutron is very flexible, so much more complex deployments are also possible as
    your needs and environment change.


    # ## Image Service (Glance)


    Glance is the image service for OpenStack. An image will typically be a qcow2,
    ISO or img file that contains an operating system you wish to use on an OpenStack
    instance.


    +   - glance-api: This daemon runs the API that is used to submit requests for
    image discovery, retrieval and storage in tandem with the registry. All interactions
    from the outside go through this API.


    +   - glance-registry: An internal Glance registry that does the work of storing,
    processing and retrieving metadata about the images loaded via the API.


    You also need storage space to hold the actual images and a database for the image
    metadata.


    # ## Block Storage (Cinder)


    Cinder provides the block storage component to OpenStack. Block storage volumes
    can provide persistent base storage to compute instances or to add additional
    storage to a running instance.


    +   - cinder-api: The API daemon that accepts requests and passes them on to the
    volume daemon for processing.


    +   - cinder-backup: A service that provides backing up of volumes to a storage
    provider.


    +   - cinder-scheduler: The daemon that does the work of selecting which storage
    node to create a volume on.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '+   cinder-volume: Using input from the API daemon and the scheduler, this
    daemon actually does the work of interacting with various storage providers.


    Cinder supports several different types of storage back ends, both open source
    and proprietary, that are provided by a plug-in infrastructure. More about how
    Cinder works and how you can use it to attach volumes to instances in Chapter
    8, “Block Storage Cloud.”


    # Object Storage (Swift)


    Swift is built to manage object storage for OpenStack. In contrast to direct file
    and block storage, object storage is built to be a highly scalable and available
    storage mechanism for storing files that are then accessible via a RESTful HTTP
    API. Note that all user-created files being loaded into Swift are called objects.


    +   - periodic processes: There are various periodic processes (replicators, updaters,
    auditors, reapers and more) run by Swift to do housekeeping on the data store
    itself.


    +   - swift-account-server: Handles management of accounts.


    +   - swift-container-server: Handles management of the mapping of containers
    or folders.


    +   - swift-object-server: Handles management of the objects on the storage nodes.


    +   - swift-proxy-server: A service that accepts requests via API and HTTP in
    order to upload objects, change meta-data, and create containers.


    It’s also worthy to note, that unlike many of the other OpenStack components,
    Swift can be run with an identity service other than Keystone. For all types of
    identity services Swift uses specially tuned middleware provided by Python WSGI
    middleware. A more comprehensive overview of how Swift works, along with the basic
    overview of key concepts like the ring system which is used for the indexing of
    objects, can be found in Chapter 9, “Object Storage Cloud.”


    # Telemetry (Ceilometer)


    Ceilometer is the telemetry module for OpenStack, meaning it provides the following
    functions:


    +   - Polls for metering data on a defined set of OpenStack services


    +   - Collects metering data and events by monitoring notifications


    +   - Publishes collected data to specified targets, including messaging queues
    and traditional data stores


    These functions make it so Ceilometer is not a light-weight addition to your Open-Stack
    deployment. The benefit that Ceilometer brings to your deployment is monitoring
    that is integrated, which you won’t necessarily find in third part alerting systems.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'To accomplish the collection, metering and more, a large number of services
    are used, and, unless otherwise specified, they run on a centralized management
    server:


    +   * **ceilometer-agent-central**: A horizontally scalable component to poll
    for statistics from various resources being tracked.

    +   * **ceilometer-agent-compute**: A service that runs on each compute node to
    poll it for usage statistics.

    +   * **ceilometer-agent-notification**: A service to consume messages from the
    queue to build event and metering data.

    +   * **ceilometer-api**: The API that is polled to provide data that is used
    by the administrator or customer to examine usage.

    +   * **ceilometer-collector**: After consuming data from agents and other OpenStack
    services, this service is used to dispatch the data to whatever is used for metering
    data storage.


    These services mean that Ceilometer can track usage of services for the purposes
    of billing or other accountability of users. Ceilometer can be used on its own
    or in collaboration with the Aynocchi project.


    # Bare Metal (Ironic)


    As organizations moved to using OpenStack to manage everything from their virtual
    machines and containers to their object storage array, it became clear that there
    was a desire to control physical machines as well. This began with a nova-baremetal
    project but was quickly moved into its own project, Ironic. Ironic serves as the
    Bare Metal Service, provisioning physical machines rather than virtual machines
    and providing a series of drivers that support the most common management tools
    like Preboot Execution Environment (PXE) and Intelligent Platform Management Interface
    (IPMI). Additionally,


    +   * **ironic-api**: The API that processes requests and sends them to the ironic-conductor.

    +   * **ironic-conductor**: This service completes the tasks of the adding, editing
    and deleting nodes, handling power state, typically with IPMI, and the provisioning,
    deployment and decommissioning of bare metal nodes.

    +   * **ironic-python-agent**: A python service that is run in a temporary ram
    disk to provide ironic-conductor service(s) with remote access and in-band hardware
    control.


    Ironic also has a python-ironicclient, which is a command line tool for interacting
    with the service. More about Ironic, along with a sample deployment, is explored
    in Chapter 10, “Bare Metal Provisioning.”


    # Orchestration (Heat)


    Heat is the orchestration service specifically built for OpenStack. By using a
    series of text-based templates, Heat enables you to spin up a collection of resources
    in what Heat'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'calls a stack, which may include instances, network components and security
    rules, and more. Templates can either be in the OpenStack-specific Heat Orchestration
    Template (HOT) or AWS CloudFormation Template (CFN) formats.


    Like the others, Heat is comprised of a series of daemons and services:


    +   - **heat-api**: A RESTful API that is used to interact with the Heat service.

    +   - **heat-api-cfn**: Used if you wish to support the CFN template.

    +   - **heat-engine**: The core of the product that provides the actual orchestration
    service.


    There is also a Heat command line tool that is strictly used to communicate with
    the heat-api if CFN is being used.


    A guide for using HOT templates can be found at http://docs.openstack.org/developer/heat/template_guide/.


    # ## Containers (Magnum)


    Magnum is specifically built for managing the orchestration around *containers*
    like Docker and Kubernetes. As mentioned in the section about Nova, there is a
    virtualization driver that enables Nova to control Docker, but this treats the
    container like a VM and takes advantage of very few features that make containers
    really valuable. Magnum seeks to take advantage of container features provided
    in the orchestration tools that come with Kubernetes or Docker Swarm, including
    the bays and pods structure you may already be familiar with if you use these
    container tools.


    More about containers and using Magnum can be found in Chapter 11, "Controlling
    Containers."


    # ## Other Projects


    During the OpenStack Kilo release cycle in 2015, the OpenStack project began supporting
    an initiative called "Big Tent," where they sought to be more inclusive of other
    projects within the OpenStack ecosystem. With Big Tent, there is less bureaucracy
    around the inclusion of projects in the OpenStack name space, and there could
    now be competing technologies existing alongside each other. This new approach
    to accepting projects into OpenStack has led to an ever-growing number of projects
    approved for inclusion by the OpenStack Technical Committee. The full list is
    maintained by the OpenStack Technical Committee (TC) at http://governance.openstack.org/reference/projects/.


    # # Release Cycle


    OpenStack releases occur every six months, around April and October of each year
    (see Figure 1.7). The release names are in alphabetical order, so recent names
    include Juno, Kilo, Liberty and Mitaka. These are names of places near where the
    OpenStack Summit occurred to begin planning for that version''s release cycle.
    For instance, the summit for Liberty was held in Vancouver, Canada and Liberty
    is a village in the nearby Canadian province of Saskatchewan. Mitaka is a city
    located near Tokyo.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/8684900d708748f86bb043faa5589f9e_43_0.png)


    These releases are supported for a minimum of 18 months, but only release to immediate
    release upgrades are supported. For instance, if you install OpenStack Kilo, you
    can upgrade directly to Liberty and from Liberty you can upgrade to Mitaka, but
    you will not be able to upgrade directly from Kilo to Mitaka.


    In this book we''re using the OpenStack release Mitaka, which came out in April
    2016.


    # Ubuntu Long Term Support


    Every two years, the Ubuntu community releases a Long Term Support (LTS) release
    of Ubuntu. These releases are supported for five years, whereas the intermediary
    six-month releases are only supported for nine months. Using Ubuntu LTS releases
    as the base for server-based deployments is extremely common.


    We have chosen to use Ubuntu 14.04 LTS as the base of all the installations in
    this book, rather than the newly released 16.04 LTS. We made this decision for
    a number of reasons:


    +   - Though 16.04 ships Mitaka by default, the upstream OpenStack development
    team used 14.04 for testing for the entire Mitaka development cycle.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '+   16.04 introduces significant changes from 14.04. Particularly of note is
    the init system switch from Upstart to systemd, and we use some Upstart scripts
    in our scenarios.


    +   Using 16.04 would not have given us the opportunity to demonstrate use of
    the Ubuntu Cloud Archive (UCA), which we''ll discuss in a moment, since it was
    Mirakta by default. The UCA is an important tool in using OpenStack with Ubuntu
    and is used more often than not as new releases come out during the life of an
    Ubuntu LTS release.


    +   For most of the time spent preparing this book, 14.04 was the only supported
    LTS release available to us and our reviewers. We could not spend a satisfying
    amount of time testing it with 16.04 without significant delays in release.


    +   Mitaka will still be supported by the Ubuntu community through the life of
    14.04, which is a respectable three years from the release of 16.04. This makes
    it a satisfactory choice for our scenarios.


    Using Ubuntu 16.04 with this book is not something we can recommend. If you wish
    to try anyway, make sure you have developed a firm understanding Puppet so you
    can make the inevitable adjustments that will be needed. Both the DevStack install
    in Chapter 2 and the manual install in Chapter 4 will also need some adjustments
    that are not yet documented at the time of writing.


    # Ubuntu Cloud Archive


    Much of the software in an Ubuntu release is pinned to a specific version, except
    in the cases of major bug fixes or security vulnerabilities. Due to the infrastructure
    nature of the project, pace of development and desire for users to have newer
    versions, the Ubuntu Server Team maintains a special archive for support of OpenStack
    in Ubuntu LTS releases called the Ubuntu Cloud Archive.


    Each Ubuntu LTS release ships with a version of OpenStack, so Ubuntu 14.04 includes
    OpenStack Icehouse. Icehouse was the first of two named releases in 2015 and came
    out just before Ubuntu 14.04.


    The cloud archive is used to support OpenStack releases not shipped with the Ubuntu
    LTS release. It is only activated for an LTS release once the version that shipped
    with the LTS release is no longer the current stable release of OpenStack. For
    example, shortly after the next version of OpenStack came out, in October of 2014,
    the Ubuntu Cloud Archive for 14.04 was activated and users could now enable the
    archive and install or upgrade to the next version of OpenStack, Juno and later
    Kilo, Liberty and Mitaka. Support for Mitaka will continue in the Ubuntu Cloud
    Archive for 14.04, but is shipped by default without need for the archive in the
    16.04 release of Ubuntu.


    The goal is for versions of OpenStack that are made available without the Ubuntu
    Cloud Archive to be supported for 5 years and for all versions provided by the
    Ubuntu Cloud Archive to be supported for 18 months. See Figure 1.8 for details
    about the current releases.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# OpenStack on Ubuntu Support Model


    LTS support 5 years, non-LTS support 18 months.


    ![](img/8684900d708748f86bb043faa5589f9e_45_0.png)


    # Puppet Modules


    Like we’ve chosen to use Ubuntu as the operating system, we’ve made a decision
    to use Puppet as the configuration management system. Puppet uses a series of
    modules in order to build a working system. In the case of the OpenStack Puppet
    modules, this means there is a module for each mature component of OpenStack,
    including Nova, Neutron and Keystone. These modules enable you to define preferences
    for each of these services inside the configuration management system, which will
    keep your configurations in a centralized place as you deploy your servers.


    Like much of OpenStack, the official Puppet modules for OpenStack are maintained
    by a team of contributors from various organizations. Many of these contributors
    use these modules in-house for their own deployments. As such, they’ve been tested
    with production-level loads and varying levels of complexity. The infrastructure
    used for development also provides varying levels of unit and integration testing
    to make sure no commits break deployments.


    The Puppet modules for any given release are typically released shortly after
    the release of that version of OpenStack. This enables the team to complete more
    tests and confirm that everything is working with the new stable release.


    In Chapter 5, “Foundations for Deployments,” you will learn about the details
    of how Puppet is used for our deployment scenarios. While our deployment scenarios
    are very basic, the key components and use of Puppet can be scaled up to a production-level
    deployment. Learn more about decisions you will have to make about scaling up
    in Appendix C, “Long-lived Puppet.”'
  merge: -1
  img_proc: true
