  md: '# # Scenarion


    Just like we showed in Chapter 8, you can now offer real persistent storage to
    your users. This time we’re providing storage in the form of objects rather than
    a filesystem, so this is particularly valuable for a series of individual files
    that you wish to access externally. Since we’re adding an additional component,
    a bit of setup needs to be done with Puppet again to configure this storage.


    **Warning**

    Don’t re-use your systems from Chapter 7, “Public Compute Cloud,” or Chapter 8
    without reinstalling since this example will remove the Celiometer or Cinder components
    from your install.


    If you’re looking to run all of these services together, see Chapter 12, “A Whole
    Cloud.”


    # ## Controller Node Setup


    Using your Controller and Compute nodes available from Chapter 5, you will only
    need to run a single command to add the support for Swift object storage. Additionally,
    in this scenario you will only need to make changes to the controller node. No
    modifications need to be made to the compute node.


    The following is the puppet apply command that will process your foundational
    object storage role in Puppet:


    ```

    `$ sudo puppet apply /etc/puppet/modules/deployments/manifests/role/foundations_object_storage.pp`

    ```


    Depending on the speed of your systems and network, this will take some time as
    it downloads everything required for Swift and sets up configurations. If anything
    goes wrong and this command fails, Puppet can also be run with the --debug flag
    to show more detail.


    While this is running, we can explore what this foundations_object_storage.pp
    file contains:


    ```

    class deployments::role::foundations_object_storage {

    include deployments::role::foundations

    include deployments::profile::swift

    }

    include deployments::role::foundations_object_storage

    ```


    As you have seen before, this is calling our foundations role to make sure all
    the basic components are installed. This is primarily for safety, and it is still
    recommended you follow the steps in Chapter 5 in order to make sure it has run
    without errors. It then includes the profile for Swift itself, which you can view
    on the controller filesystem at /etc/puppet/ modules/deployments/manifests/profile/swift.pp
    and contains the following:


    cat


    ```

    class deployments::profile::swift {

    include ::memcached

    include ::swift

    ```'
