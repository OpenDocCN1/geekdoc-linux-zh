- pgno: 144
  md: '![](img/8684900d708748f86bb043faa5589f9e_144_0.png)


    Figure 5.5 Initial CirrOS booted and connectivity checked


    # ## Troubleshooting


    OpenStack has many moving parts, which unfortunately makes it so there are many
    things that can go wrong with a deployment. Although we have tested this with
    multiple configurations, there’s always a chance that a missed step or something
    in the environment is causing you to see errors. The following are some tips we’ve
    collected to help you find your way.


    +   * Go back through this chapter and check your configurations to make sure
    you didn’t skip a step. It’s easy to miss something. Also, check that your passwords
    are correct.

    +   * Look for errors during the Puppet run. They may indicate specific issues
    like problems installing packages, starting services or communicating with OpenStack
    services.

    +   * Browse the README.md file in the puppet-deployments repository on GitHub.
    We are maintaining a list of common issues at https://github.com/Deployments-Book/puppet-deployments/blob/master/README.md.

    +   * Skip to Appendix D, “Finding Help with OpenStack” in order to ask for help
    from the OpenStack community.

    +   * If you’re using your own configuration and continue to struggle with it,
    you may want to see Appendix A for a working, virtualized example. You can either
    switch to that, or use it as a working reference to debug your current deployment.


    Finally, Chapter 13, “Troubleshooting,” covers common issues that operators run
    into when they are trying to deploy OpenStack. It may be valuable to look at some
    of these common issues in order to see if you’re running into any of them now.
    That chapter also walks you through reviewing OpenStack logs to look for errors,
    which is a very valuable exercise when you’re tracking down problems.'
  merge: -1
  img_proc: true
