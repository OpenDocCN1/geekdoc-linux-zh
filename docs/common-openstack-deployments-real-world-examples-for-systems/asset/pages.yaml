- pgno: 282
  md: "# # F\n# Finding Help with OpenStack\n\nOpenStack is a complicated infrastructure\
    \ project that grows, changes and matures with every release. This book has given\
    \ you a gradual introduction to various types of deployments by running your own\
    \ scenarion on some local machines, but as you move into production you will inevitably\
    \ have questions that are beyond the scope of what we've been able to cover here.\n\
    \nThe OpenStack community is made up of developers, users and experienced operators\
    \ from a variety of companies around the world. This community forms the basis\
    \ of an online community that shares resources with each other and can help newcomers\
    \ with problems they encounter as they begin to use and then grow their deployment\
    \ of OpenStack. The following are various mechanisms for finding help in the OpenStack\
    \ community.\n\n# ## Documentation\n\nOfficial OpenStack Project documentation\
    \ can be found at http://docs.openstack.org/. There you will find step-by-step\
    \ installation guides for various Linux distributions, guides for APIs and various\
    \ operations and administrative guides. The following guides are recommended by\
    \ the author:\n\n+   - Benefit from the expertise of experienced operators with\
    \ the OpenStack Operations Guide: http://docs.openstack.org/ops/.  \n+   - Find\
    \ out more about managing and troubleshooting a production OpenStack cloud with\
    \ the OpenStack Cloud Administrator Guide: http://docs.openstack.org/admin-guide-cloud/.\
    \  \n+   - Always find the latest step-by-step installation instructions for Ubuntu\
    \ 14.04 with the manual OpenStack Installation Guide for Ubuntu: http://docs.openstack.org/mitaka/install-guide-ubuntu/\
    \  \n+   - Learn more about the history and philosophy around OpenStack with the\
    \ Project Team Guide: http://docs.openstack.org/project-team-guide/.\n\nThis documentation\
    \ portal is also where you will find contributor guides if you wish to learn more\
    \ about the development of and contribute back to an OpenStack project. You can\
    \ also learn more about contributing code in Appendix D, \"Contributing Code to\
    \ OpenStack.\""
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Mailing Lists


    OpenStack has dozens of mailing lists collectively found at http://lists.openstack.org/.


    Of particular interest to users are the following:


    +   - OpenStack General mailing list, a user list where newcomer questions are
    welcome: http://lists.openstack.org/cgi-bin/mailman/listinfo/openstack.


    +   - OpenStack Operators mailing list, a list where more experienced operators
    of OpenStack clouds share experience and make plans for working with developers
    to prioritize needs of the community: http://lists.openstack.org/cgi-bin/mailman/listinfo/openstack-operators.


    +   - OpenStack Community mailing list, which includes the weekly news from the
    OpenStack community as well as updates to resources from the OpenStack Foundation
    (not for technical questions): http://lists.openstack.org/cgi-bin/mailman/listinfo/community.


    If you are unfamiliar with using an open source community mailing list, you may
    also want to browse the Etiquette guidelines before posting a message: https://wiki.openstack.org/wiki/MailingListEtiquette.


    # Web-Based


    The OpenStack project runs a service called AskBot to power the web-based https://ask.openstack.org/
    forum service. A question-and-answer service with voter ranking of answers, this
    site serves the needs of OpenStack users who are more comfortable with a web-based
    resource.


    If you''re new to this style of question and answer based service, it''s recommended
    that you begin by reading the Frequently Asked Questions (FAQ) first: https://ask.openstack.org/en/faq/.


    # Chat


    The vast majority of collaboration between OpenStack developers happens over text-based
    chat called Internet Relay Chat (IRC) on the freenode network. This makes it a
    valuable place to also get support for OpenStack in channels like #openstack and
    #openstack-101. Note that most people in these channels are doing support on a
    volunteer basis rather than as part of their jobs, so if you ask a question there,
    be prepared to stay connected and wait for some time for an answer.


    If you''re familiar with IRC, you can connect to chat.freenode.net to access these
    resources. If not, visit this wiki page to learn more about IRC and where to find
    a client to connect with: https://wiki.openstack.org/wiki/IRC.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Conferences and User Groups


    Conferences and user groups are a major part of learning for most people who work
    with OpenStack. Users, operators and vendors get together for a variety of types
    of events each year. A high-level overview of OpenStack events can be found at
    http://www.openstack.org/community/events/.


    # OpenStack Summits


    Every six months, members of the OpenStack community gather in a single city for
    an OpenStack Summit. These summits are held all over the world in order to make
    it easier for a broad swath of OpenStack users, operators and developers to attend.
    These summits have keynotes from major companies who are building products and
    services on OpenStack as well as hundreds of talks, panels and other events throughout
    the week that touch upon various aspects of using, deploying, scaling and developing
    OpenStack. Learn the latest about the next summit by visiting https://www.openstack.org/summit/.  Videos
    from these summits are made freely available by the OpenStack Foundation and can
    be accessed by going to the pages for past events. Even if you’re unable to attend
    the summit, these videos are a treasure trove of information for people across
    the OpenStack community, from newcomers to seasoned operators who are looking
    to improve their work in production with the latest improvements from developers
    and tips from other operators.


    # OpenStack Ops Meetup


    Originally focused on developers, many teams also get together between summits
    to collaborate, and Operators are no exception. At Ops Meetups, experienced operators
    gather together to share best practices, plan for approaching developers with
    collective needs and generally get to know other operators. Typically, a few Project
    Technical Leads of OpenStack projects also attend these Meetups to get to know
    operators.  Learn about upcoming summits by visiting the wiki page for their events
    at https://wiki.openstack.org/wiki/Operations/Meetups, and keep up with latest
    plans by reading the OpenStack Operators mailing list (see the section “Mailing
    Lists” earlier in this appendix).


    # OpenStack User Groups


    All over the world OpenStack community members are getting together for OpenStack
    User Group meetings. These meetups range from casual gatherings of other people
    who find OpenStack interesting or are just getting started, to full-fledged monthly
    events with high profile presenters and hundreds of attendees. Find one near you
    by visiting https://groups.openstack.org/.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# ## Vendors


    Finally, beyond the fleet of volunteers in the OpenStack community, there are
    several avenues of paid support. By exploring the OpenStack Marketplace at http://www.openstack.org/marketplace/
    you will find links to training programs and integration and consulting vendors
    around the world. The integration and consulting vendors offer a vast array of
    support, from doing all the work of bringing OpenStack into your organization
    with their custom solution to being a resource you can contact when you need support.
    The Marketplace will also give you the ability to explore offerings for public
    and private clouds, appliances built with OpenStack components and a driver database
    for hardware that works with OpenStack.'
  merge: -1
