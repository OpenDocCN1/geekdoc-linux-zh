- pgno: 264
  md: '# # B Other Deployment Mechanisms


    In this book we explored using Puppet to do various deployments of OpenStack.
    However, Puppet is just one of your options in the vast OpenStack ecosystem. By
    having a variety of deployment mechanisms, OpenStack can be deployed in your organization
    without a switch in tooling or by having it run on different tooling than the
    rest of your environment.


    All deployment mechanisms that are part of the OpenStack community itself can
    be found by browsing through the OpenStack code repository at https://git.openstack.org/cgit/openstack/.


    The tools covered here are the most popular and mature, but this list of tools
    is always changing, and it’s always worth doing a search for your favorite tool
    not listed here to see if there are OpenStack deployment instructions available
    or in development.


    # ## Chef


    Chef cookbooks are available for OpenStack under the OpenStack project in the
    project git repository. They all begin with the prefix cookbook-openstack- and
    end with the specific project they are deploying. For instance, you will find
    the compute (Nova) project Chef cookbooks via this address: https://git.openstack.org/cgit/openstack/cookbook-openstack-compute/tree/.


    The README.rst file in each repository provides a reference for each project.
    Each of them have some basic instructions about usage of the cookbooks and many
    link to an additional repository that describes how to use it in the context of
    a full OpenStack deployment.


    # ## Ansible


    A series of Ansible playbooks are also available in the OpenStack project git
    repository, directly accessible for browsing from here https://git.openstack.org/cgit/openstack/openstack-ansible/tree/.


    Unlike Chef and Puppet, Ansible has provided a single deployment playbook that
    pulls in other components. Instructions for basic setup are included in the README.rst
    file,'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'which includes a tour of some of the scripts available, depending on what kind
    of

    deployment you''re looking to do, from boot-strapping to running playbooks individually

    and more.


    # SaltStack and Others


    Other open source configuration management tools, such as SaltStack, also now
    have

    published OpenStack tooling in their official repositories. These are maintained
    outside

    of the direct OpenStack community, and instructions for download and usage can
    be found

    by searching the code repositories and documentation for these projects.


    # Vendor-Specific


    Community-driven efforts with technologies such as Puppet, Chef and Ansible have

    come up to speed for production use in the recent past, but OpenStack had historically

    been complicated to deploy. As discussed in Chapter 14, "Vendors and Hybrid Clouds,"

    vendors offer a vast array of vendor-specific deployment mechanisms. Some of these
    mecha-

    nisms are tightly integrated with what the vendor calls their own OpenStack distribution,

    which packages a lot of other tools in with their OpenStack offering. Red Hat
    and HPE

    are among companies with offerings. Other companies focus on using their deployment

    tools to focus on deployment, such as Juju by Canonical for the Ubuntu ecosystem.


    The OpenStack Marketplace, hosted by the OpenStack Foundation, provides a com-

    prehensive list of vendors who offer their own OpenStack distributions and appliances

    at http://www.openstack.org/marketplace/distros/.


    ![](img/8684900d708748f86bb043faa5589f9e_265_0.png)'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# **C**

    # Long-Lived Puppet


    For each deployment example in this book we ran a setup script and then puppet
    apply to apply the manifests. This works well for working through each scenario
    to get a feel for how OpenStack works in various deployments, but it is not a
    maintainable way to run OpenStack. In order to take the Puppet deployments module
    and Hiera from this book and turn it into a real Puppet OpenStack deployment,
    there are some things that you will need to consider and changes that will need
    to be made.


    # ## Puppet Master or Masterless?


    From the Puppet side, the first main thing you''ll need to change is that you
    might not want to run Puppet using puppet apply like we have here. Although some
    OpenStack deployments use masterless Puppet, it has some disadvantages. First,
    all Puppet code and Hiera data needs to be copied to every node and kept up-to-date.
    You also cannot use things like exported resources (https://docs.puppet.com/puppet/latest/reference/lang\_exported.html)
    with masterless Puppet. Compared to masterless, running Puppet with a Puppet master
    has a few advantages as well. First, it provides a single place to make a change
    and have it automatically deployed out to every node. By default, all the clients
    will request a catalog and do a Puppet run every 30 minutes. This means that within
    30 minutes, updates that be applied and hand-made changes will be auto-reverted
    (as long as the resource that is changed is managed by Puppet). Although masterless
    Puppet also has some advantages too, such as no catalog compile bottleneck, you
    need to at least affirm that you want to be running masterless and weigh the pros
    and cons before you productize the solution provided in this book.


    # ## Hiera


    In this book we use a key/value tool called Hiera from Puppet to store preferences
    for each deployment example. For simplicity reasons, the Hiera used in this book
    barely meets the definition of what Hiera is supposed to be. Hiera is supposed
    to allow over-lapping values that are exposed based on a hierarchy. In this book
    we have a simple flat file. In any real deployment you will want to have a real
    hierarchy that exposes layers like region, node type, and whether the node is
    dev, staging, or prod. Think of a case where you might want your dev compute box
    to have a different version of a package than a production node. This is what
    Hiera is for. It can even be used to separate nodes'
  merge: -1
  img_proc: true
- pgno: 267
  md: "geographically. A node in Europe will have different NTP and DNS servers than\
    \ a node in the Americas. Read more about the power of Hiera at https://docs.puppet.com/hiera/1/.\n\
    \n# Passwords in Hiera\n\nAnother issue you will need to solve is storing passwords\
    \ in Hiera. Checking passwords into git unencrypted is not a good idea and is\
    \ unsafe. Using the hiera-eyaml back end is one solution to this problem. The\
    \ passwords will be encrypted on disk and decrypted for catalog compiles (see:\
    \ https://puppet.com/blog/encrypt-your-data-using-hiera-eyaml). This has the drawback\
    \ that your Puppet master will need a decryption key but is a large improvement\
    \ over plain text. There are other solutions to consider as well. Just keep in\
    \ mind that managing passwords that hold the keys to your entire deployment should\
    \ be a top consideration. Hiera includes passwords for the OpenStack admin user,\
    \ RabbitMQ, and MySQL, any of which, if leaked, would be extremely dangerous.\n\
    \n# Node Classification\n\nAs noted earlier, in this book you are choosing what\
    \ type of node you have by manually running puppet apply on a given box. This\
    \ method does not scale well and is error prone. What would happen to your OpenStack\
    \ cluster if someone accidentally applied the foundations\\_public\\_cloud.pp\
    \ catalog to a compute host? In order to run this (production you need to first\
    \ think about how you will do your Puppet node classification (https://docs.puppet.com/pe/latest/puppet\\\
    _assign\\_configurations.html). This can be done using the Puppet console that\
    \ ships with Puppet Enterprise (paid), but it can also be done with Hiera and\
    \ the site.pp file. This is something you’ll need to consider as you productize\
    \ this code.\n\n# Module Management\n\nOne major consideration will be how you\
    \ manage Puppet modules and stay in-sync with upstream. The versions of the modules\
    \ are managed by the Puppetfile and then pulled by the Puppet deployment toolset\
    \ r10k. For the most part, the Puppetfile shipped with this book puts you in good\
    \ shape. Versions of non-\\*OpenStack modules are locked to specific tags, which\
    \ means that their code cannot \"move\" unless you move it. But new modules are\
    \ tagged and released every day. In fact, many of the tags in that Puppetfile\
    \ are probably already outdated. What system will you have for updating those\
    \ tags and tracking new releases? How will you test the new modules? These are\
    \ key considerations that you will need to make. I advise that falling behind\
    \ and then trying to do a massive jump on all the modules at once is not a good\
    \ plan. Plan on reviewing the module tags at least every few months to see if\
    \ they can be upgraded. The following is an example of a module pinned to a tag:\n\
    \n```\n```\nmod 'stdlib'\n  :git => 'https://github.com/puppetlabs/puppetlabs-stdlib.git'\n\
    \  :ref => '4.6.0'\n```\n```"
  merge: -1
  img_proc: true
- pgno: 268
  md: "The OpenStack modules are not pinned to a tag. They're tied to a release branch,\
    \ which may be represented like the stable/mitaka, or in the future this may be\
    \ stable/newton. Based on the policy that the Puppet OpenStack team uses, this\
    \ branch should be free of breaking changes and should only get better as fixes\
    \ are backported. “Should” is the key word here. By not tying to a tag, we pick\
    \ up fixes in these modules every time the stable/mitaka branch of Puppet OpenStack\
    \ modules are updated, but we run the risk that something that breaks us is backported.\
    \ In other words, every time *r10x* runs you probably will get something good,\
    \ but you might get something bad. You will either need to live with this risk\
    \ or pin these modules to a specific commit ID and update them on a cadence as\
    \ is suggested with the other modules. Puppet OpenStack modules do not have tags\
    \ on stable branches, so you will need to link to a commit-id if you want these\
    \ locked. The following is an example of how you might have a module pinned to\
    \ a branch:\n\n```\nmod 'neutron',\n  :git => 'https://github.com/openstack/puppet-neutron.git',\n\
    \  :ref => 'stable/mitaka'\n```\n\nA final note on modules—if you find issues,\
    \ please file bugs and, if possible, please contribute a fix upstream. If the\
    \ problem is with the Puppet modules you can ask in the #puppet-openstack channel\
    \ on freenode (IRC) or file a bug against the module in Launchpad. See Appendix\
    \ F, “Finding Help with OpenStack” for how to get help with or file bugs if your\
    \ problem is more generally about OpenStack. If you would like to learn how to\
    \ contribute, see Appendix D, “Contributing Code to OpenStack.”\n\n# Software\
    \ Life Cycle\n\nWith Puppet managing your OpenStack deployment, you will be living\
    \ the “infrastructure as code” mantra that has become popular in modern IT. This\
    \ means you will need to define a software life cycle for your Puppet code and\
    \ Hiera data. This might include separate test environments, code reviews, a CI\
    \ (continuous integration) process and determining how you will test, update,\
    \ and deploy code. There’s no right way to do this, but you need to consider it.\n\
    \n# Roles and Profiles\n\nThe code in this book uses Puppet roles and profiles,\
    \ which is an excellent design pattern for Puppet. It makes nodes easier to “remix”\
    \ by moving features around and even creating new node types. However, the node\
    \ types defined for this book may not meet your architecture requirements. You\
    \ will need to consider your architecture and experiment with new node types or\
    \ role modifications as you deploy your cloud. This appendix only scratches the\
    \ surface of what can be done with roles and profiles. You’ll want to consult\
    \ the Puppet documentation to learn more."
  merge: -1
  img_proc: true
- pgno: 269
  md: "240\n\n# Packages\n\nIn this book we are using the official Ubuntu packages\
    \ for Puppet, but these are somewhat behind what Puppet is shipping. This code\
    \ was tested against the 3.x series of Puppet and should work with the Ubuntu\
    \ version or the latest 3.x package from Puppet. However, you may get better support\
    \ in the Puppet community and with Puppet bugs if you are using the latest packages\
    \ that Puppet ships. Although Puppet 4 has been released, it is quite new and\
    \ not all modules support it yet. Whether you choose to use 3.x or 4.x, you should\
    \ probably get the packages for Puppet, Facter, and hiera. For Ubuntu you can\
    \ enable this repo by running the following:\n\n```\n$ sudo su -\n$ apt-key adv\
    \ --keyserver keyserver.ubuntu.com --recv-keys 0x105AB7A24B56BC30\n$ echo 'deb\
    \ http://apt.puppetlabs.com/ trusty main dependencies' >\\\n  /etc/apt/sources.list.d/puppetlabs.list\n\
    $ apt-get update\n```\n\n# Revision Control\n\nOne of the strengths of using a\
    \ configuration management system like Puppet is the capability to put everything\
    \ into a revision control system. When using something like git you can track\
    \ changes over time, revert to known working configurations and keep things like\
    \ passwords and secret keys in a centralized place. If you're not using revision\
    \ control today for your systems, we'd highly recommend it. This book uses a public\
    \ GitHub git repository, but if you're storing critical information about your\
    \ deployment, like IP addresses and passwords, you will probably want to set up\
    \ a private git repo. One other note: you may be tempted to put all your Puppet\
    \ modules into one repo and skip using r10k with separate repos. This might give\
    \ you a quick initial boost in productivity, but it will cost you long-term. It\
    \ quickly becomes unwieldy and is also difficult to sync with upstream module\
    \ changes. Many others who tried this method for their deployments have switched\
    \ to the method shown in this book that employs r10k to check out modules individually.\n\
    \n# What Else Belongs in Your Composition Module?\n\nAt its heart, the deployments\
    \ module is a composition module. The deployments module we created was written\
    \ specifically for this book and basic OpenStack deployments. It glues together\
    \ all the Puppet OpenStack modules along with supporting modules like MySQL and\
    \ RabbitMQ and joins them to give you a running OpenStack cloud. What we've presented\
    \ here is pretty minimal; there's a variety of other things that belong in an\
    \ OpenStack composition module.\n\nYou will likely not want to use the composition\
    \ module we have provided in a production deployment, instead creating your own\
    \ that has the customizations that you require."
  merge: -1
  img_proc: true
- pgno: 270
  md: 'The following is not an exhaustive list but will hopefully help you prepare
    to take your cloud to production and build your own composition module:


    +   *   Setting up backups of critical elements of your deployment. An example
    would be MySQL.

    +   *   Managing apt repositories. The module, at present, only adds the Ubuntu
    Cloud Archive repo. You might need to add one for RabbitMQ or Puppet or other
    vendors.

    +   *   Working around packaging issues. Sometimes packages do not have proper
    dependencies on versions of packages. The composition layer can be used to enforce
    these dependencies for you.

    +   *   Adding additional OpenStack roles, users, and projects. If you have a
    standard set of roles or users that you want in your cloud, your composition layer
    can declare them.

    +   *   Working around upstream issues in Puppet OpenStack. While the Puppet OpenStack
    team tries hard not to release code with bugs, it does happen. If you have a bug
    or a corner case that your deployment has, you can sometimes work around it in
    the composition layer. Please still report bugs upstream!

    +   *   Setting up clustering and HA. Your composition module might also help
    you configure and deploy clustering or HA solutions such as HAProxy or Galera
    Cluster for MySQL.

    +   *   Tuning. Finally, the composition layer can help manage tuning in your
    OpenStack cluster. Tuning might include database tuning, system tuning with sysctl
    and tuning RabbitMQ.


    # ## More Information


    There are a couple of conference videos available that can explain more about
    the OpenStack Puppet modules and the relationship between them and a composition
    module like the deployments module. In some of these talks you may hear the modules
    referred to as the “Stackforge” Puppet modules. The modules covered here have
    since been moved and renamed to the OpenStack Puppet modules.


    This first video is from the OpenStack Summit in Vancouver in the spring of 2015.
    It provides a good introduction to the OpenStack Puppet modules along with examples
    of two different company’s solutions for deploying them. “Building Clouds with
    OpenStack Puppet Modules” can be found at https://www.youtube.com/watch?v=j58VnW2LM
    M0. The second video is from PuppetConf 2015 in Portland in the fall of 2015.
    It provides a similar overview of the OpenStack Puppet modules and a tour through
    the common components in OpenStack with these modules. “Deploying OpenStack with
    Puppet Faster than Light” can be found at https://www.youtube.com/watch?v=HjkEslP4p-s.'
  merge: -1
  img_proc: true
