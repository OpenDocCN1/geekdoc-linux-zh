    Figure 3.4  Traffic flow overview


    go through the controller. The controller runs the common network services, like
    DHCP for the tenant networks, and also handles the routing of traffic to external
    networks.


    This view is not complete though. It’s time to dive a bit deeper to look at exactly
    what’s happening inside your controller and compute nodes in order to handle your
    network traffic.


    # ### Controller Node


    As you know from the setup requirements, you will have the following interfaces
    on your controller node: eth0 and eth1. These two interfaces end up handling a
    lot, so we’ll take a look inside to see what OVS is doing to route traffic, run
    a DHCP server and use iptables.


    First, have a look at Figure 3.5 for a detailed view of what’s going on inside
    your controller node. This can be a bit overwhelming at first, but being familiar
    with the concepts is important when you start debugging.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/8684900d708748f86bb043faa5589f9e_74_0.png)


    Figure 3.5 is a complicated diagram, but the easiest way to describe it is by
    reviewing each of the OVS bridges.


    Starting with br-int, we have your internal bridge around which much of your activity
    happens. On br-int we have the following:


    +   - An OVS virtual tap interface that runs dnsmasq as a DHCP server for your
    instances. This runs in its own network name space.

    +   - For each tenant network, an OVS virtual tap interface qr-\* which connects
    to the router-\* name space for NATed external traffic.

    +   - A patch named patch-tun, which connects to the br-tun bridge and is used
    to pass traffic directly between the two bridges.

    +   - A patch named int-br-ex, which connects to the br-ex bridge. This patch
    is automatically configured in our setup but is not used in our deployment scenarios.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'We have thrown out a lot of terms as we’ve begun to discuss networking on the
    controller. Some of these are standard networking terms, others are specific to
    OVS. You can learn more about all of them using networking-specific resources,
    but for now, here is a quick rundown to get you started:


    +   TUN/TAP—Virtual kernel network devices that are created and manipulated in
    userland, allowing a program to act as a network device. TUN (network TUNNEL)
    simulates a network layer device operating on IP frames. TAP (network TUNnEL)
    simulates a link layer device working with Ethernet frames. Both TUN and TAP devices
    are provided by the same driver. In our scenarios we’re only using TAP interfaces.

    +   Patch—An OVS concept that connects two bridges. It can be thought of as running
    an Ethernet cable between two OVS bridges.

    +   Bridge—Behaving much like a network switch, a software bridge (whether you’re
    using OVS or Linux bridge) connects multiple network segments by enslaving physical
    or logical network interfaces as ports on the bridge.

    +   Name spaces—Viewed and manipulated with ip netns commands, network name spaces
    represent a copy of the network stack with their own network interfaces, routing
    tables and ability to use iptables.

    +   NAT—Network Address Translation, provides remapping of IP address space as
    traffic moves into another network. A simple example is traffic moving from a
    local network out to the Internet having its source address rewritten as it is
    routed onto the Internet.

    +   iptables—A userland program for configuring the kernel-based Linux firewall.


    In order to make configuration of tunneling more modular, tunneling interfaces
    are not added directly to the br-int bridge. Instead, a dedicated OVS bridge called
    br-tun bridge is created to handle the tunneling activity, which in our case is
    the VXLAN traffic. This bridge has only two ports:


    +   The other end of the patch–tun patch, patch-int for passing traffic to and
    from the br-int bridge.

    +   The VXLAN tunnel interface, which uses the controller’s host networking stack
    for routing and forwarding, resulting in traffic flowing through its main interface—eth0.


    Finally, look at the br-ex bridge, which exists on the other side of NAT rules
    for passing traffic to the public network:


    +   The eth1 external interface is attached to this bridge.

    +   For each tenant network, an OVS virtual tap interface qg-*, which connects
    to the router-* namespace for NATed external traffic.

    +   The other end of the unused int–br-ex patch—phy-br-ex.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'It''s important to take a moment to talk about the router-* network name space.
    As described above, it sits between the br-int and br-ex bridges via a pair of
    OVS virtual tap interfaces. Normal Linux kernel-based IP forwarding within this
    name space is used to route traffic between the two tap interfaces (and thus between
    the two OVS bridges). Additionally, iptables rules within the namespace act on
    packets flowing between the two tap interfaces. Along with filtering rules, the
    iptables config also includes NAT rules to translate addresses between the tenant
    network addressing and the external network addressing, such as the floating IPs
    assigned from the external provider network.


    To view all of these on your controller, you''ll want to keep a few commands handy.
    The first is an OVS command that shows all of your OVS bridges, patches and interfaces:


    ```

    $ ovs vsctl show

    83356299-3552-4303-a217-c049cd6db5e2

    Bridge br-int

    fail_mode: secure

    Port patch-tun

    Interface patch-tun

    type: patch

    options: (peer=patch-int)

    Port br-int

    Interface br-int

    type: internal

    Port ''gr-0ed92e71-46''

    tag: 1

    Interface ''gr-0ed92e71-46''

    type: internal

    Port ''tapb35f58ac-3e''

    tag: 1

    Interface ''tapb35f58ac-3e''

    type: internal

    Port int-br-ex

    Interface int-br-ex

    type: patch

    options: (peer=phy-br-ex)

    Bridge br-trm

    fail_mode: secure

    Port patch-int

    Interface patch-int

    type: patch

    options: (peer=patch-tun)

    Port ''vxlan-c0a87a20''

    Interface ''vxlan-c0a87a20''

    type: vxlan

    options: (df_default=''true'', in_key=flow, local_ip=''192.168.122.38'', out_key=flow,
    remote_ip=''192.168.122.32'')

    Port br-tun

    Interface br-tun

    type: internal

    Bridge br-ex

    Port ''eth1''

    Interface ''eth1''

    Port ''qp-6d1edfc1-6a''

    Interface ''qp-6d1edfc1-6a''

    type: internal

    ```'
  merge: -1
  img_proc: true
- pgno: 77
  md: '```

    Port phy-br-ex

    Interface phy-br-ex

    type: patch

    options: (peer=int-br-ex)

    Port br-ex

    Interface br-ex

    type: internal

    ows_version: 2.3.0

    ```


    The second will show you the two network name spaces used for the instance dhcp
    server and tenant traffic from your instances:


    ```

    $ sudo ip netns

    grouter-9bc585a7-5cc6-4a59-92f5-b0648f6ada80

    qdhcp-a7897645-0d16-4e8f-8f8a-846ce504b766

    ```


    Between these two commands, you can start exploring how the output from these
    commands maps to Figure 3.5. Your standard ip addr and ip -d link commands can
    also help you drill down into details about your configuration and understand
    the types of devices being used.


    # ## Compute Node


    The compute node is a bit simpler, but it does add a couple new concepts to the
    mix. Figure 3.6 provides the overview of how traffic flows within a compute node.


    ![](img/8684900d708748f86bb043faa5589f9e_77_0.png)


    Figure 3.6  Traffic flow on the compute node'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Just like with the controller, the easiest way to view this diagram is by starting
    with the internal bridge (br-int) and moving outwards. From br-int, you have:


    +   * A tap interface for each instance, representing the other side of the Ethernet
    interface within the instance.

    +   * A patch named patch-tun, which connects to the br-tun bridge and is used
    to pass traffic directly between the two bridges. The br-tun OVS bridge is constructed
    and utilized on the compute nodes in the same manner as it is constructed and
    utilized on the controller node.


    Just like with the controller, you can run the `ovs-vsctl show` command to see
    the OVS configuration of these virtual interfaces tunnels and more. By using the
    `ip -d link` command, you will be able to see your interfaces, as well as the
    tap interfaces for each instance you''re running.


    # ## Other Resources


    The OpenStack community maintains a Networking Guide that provides an introduction
    to important networking terms, a tour of networking with regard to OpenStack specifically
    and a tour of various scenarios using Flat, VLAN and VXLAN/GRE: http://docs.openstack.org/mitaka/networking-guide.


    The installation guides maintained by the OpenStack community also have sections
    about networking that can be referenced.


    You can also see the extensive Networking section of Chapter 13, “Troubleshooting,”
    for tips on fixing a deployment and Appendix F, “Finding Help with OpenStack,”
    to learn how to ask for advice and assistance from the OpenStack community.


    # ## Summary


    Decisions you make with networking will impact everything else in your OpenStack
    deployment, and they’re also the hardest to change after you’ve deployed. It’s
    important to have a discussion with your networking team to design a network topology
    that best addresses the needs of your users and the constraints of your environment.
    To assist with these decisions, we’ve walked through key concepts of networking
    and Neutron itself in OpenStack.


    For the deployment scenarios used in this book, we defined the physical and virtual
    networking requirements. With the basic configuration explained, you also learned
    how traffic will flow at a high level, and how it is broken down on the controller
    and compute nodes.'
  merge: -1
  img_proc: true
