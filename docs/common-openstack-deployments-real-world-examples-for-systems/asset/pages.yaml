- pgno: 196
  md: '9


    # Object Storage Cloud


    > > "I paint objects as I think them, not as I see them."

    > > Pablo Picasso


    As explained in Chapter 8, “Block Storage Cloud,” OpenStack provides two core
    ways for handling storage: object and block storage. Block storage is typically
    where you mount a storage device as an actual filesystem on your server. Object
    storage instead hosts individual files that are then referenced from within your
    application and accessed using a REST API. This means that instead of hosting
    files on a flat filesystem as in block storage, object storage enables storing
    of individual files, or objects, in a highly redundant and available storage system.
    Using an object store also enables you to tune access to these files through access
    control and make them selectively available across your platform.


    This chapter walks you through the key concepts of using OpenStack Swift. From
    there, you create a very basic object storage configuration on your controller
    that you can then access and interact with via the Horizon dashboard and from
    your compute node.


    # Uses


    Swift object storage was one of the two original OpenStack projects, the other
    being Nova. The fact that it was one of the original projects demonstrates how
    important object storage is to the vision of many cloud deployments.


    As soon as object storage is made available to an organization, uses for it start
    cropping up. From building a system of shared documents around an object store
    or giving flexibility to developers to include files in their applications without
    having to worry about data access or integrity, being able to store files on a
    trusted, redundant storage system is valuable throughout an organization.


    # Web Hosting Company


    There have been many strategies that web hosting companies have employed over
    the years to make their platforms highly available and make the most efficient
    use of resources. One of the latest is storing images and other binary objects
    in a managed object store rather than hosting them on individual filesystems.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'By leveraging an object store, these companies and organizations have been
    able to benefit from the built-in redundancy and access to these resources should
    certain hardware components fail. They are also able to employ broad back-up strategies
    that are no longer completed on a per customer or per server basis, but instead
    back up all of the objects used by customers at once. They''re also able to collectively
    use space allocated to all customers rather than leaving extra space available
    on file filesystems that may never be used, thus reducing the amount of storage
    that is required overall.


    # ## File Sync and Sharing


    There are several companies today that seek to make the sharing of files between
    individuals and companies easier by offering services that provide a link to a
    shared file that has been uploaded.


    By using object storage with Swift in your organization, this can be done in-house
    with full control over your data. In this model, Swift is the storage and organization
    mechanism with an API for accessing the files. A user interface is built up around
    it so users can manually upload, share and access files. Going one step further,
    desktop and smartphone interfaces may also be developed to sync files between
    devices, such as photos taken on your phone or a music collection that is primarily
    managed on a desktop.


    # ## Log Storage


    Log storage is a problem that''s common across many industries, whether you''re
    storing logs from servers or report logs from a space station. The OpenStack project
    infrastructure team doesn''t yet have logs from any space stations, but the infrastructure
    for testing OpenStack does produce several gigabytes of storage per day in logs.
    For a long time, these were stored on a flat filesystem on a block volume and
    served by a basic web server. At some point, the team reached the maximum amount
    of storage available from the cloud providers and needed a solution to store more
    without the additional systems administration overhead of managing multiple log
    storage servers.


    The team decided to use Swift for object storage. In this system, logs that come
    out of the build system are named using their build numbers then uploaded to Swift.
    From there they can be presented as a web listing index with their build numbers
    and made available to developers through a link in the code review system. All
    maintenance of storage has been off-loaded to the cloud provider running the Swift
    cluster, and the members of the infrastructure team no longer have to worry about
    the log server filesystem filling up or not having enough space in the long term.
    The infrastructure team can now focus on solving more interesting and complex
    problems rather than being troubled by the more mundane systems administration
    tasks. This holds true for developers and other contributors who produce files
    in an organization as well. You want them to focus on working with things they
    were hired to do, not worrying about things like file storage.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# # Requirements


    As with the past chapters, in this deployment scenario you’ll be using the controller
    and compute nodes you created in Chapter 5, “Foundations for Deployments.” We
    will be uploading a series of small, simple files to the controller and the minimum
    specifications defined in that chapter will easily support this.


    # ## Select Components


    In this scenario, we will be adding the components required for Swift Object storage.
    These will be in addition to the components we already have so we can offer a
    satisfying deployment scenario, but be aware that Swift can run independently
    of many of these components. As an example, you don’t need a separate compute
    instance to take advantage of referencing objects stored in Swift. You can access
    Swift objects from any platform.


    Using our Puppet configurations, your two node deployment scenario will have the
    following, placement of which is shown in Figure 9.1:


    +   - Compute (Nova)

    +   - Identity (Keystone)

    +   - Networking (Neutron)

    +   - Image service (Glance)

    +   - Dashboard (Horizon)

    +   - Swift (Object Storage)


    # ## Key Concepts


    Before diving into using Swift, there are some key concepts that should be covered,
    but we will only do a simple overview of concepts you are likely to encounter.
    Advanced configuration will vary considerably based on your storage environment
    and a considerable amount has already been written about how things like the Ring
    and storage clusters actually work.


    ![](img/8684900d708748f86bb043faa5589f9e_198_0.png)'
  merge: -1
