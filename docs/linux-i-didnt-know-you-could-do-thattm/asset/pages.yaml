- pgno: 284
  md: 'Exploring all of these basic tools that come with most Linux distributions
    isn’t within the scope of this book. Some of them are so capable (I’m thinking
    particularly of the Gimp) that entire books are devoted to them. Use the online
    help and man pages to learn about these programs.


    The programs in the sections that follow do more than just view or draw images.
    They manipulate, download, and generally make images more useful and interesting
    on Linux and with other special hardware you might already own.


    # Access Your Digital Photos


    I like film. But a lot of people—including professional photographers—are using
    digital photos more than ever before. You can get your regular film processed
    and pasted on a Photo CD, or you can use a digital camera and skip the film altogether.


    The xpcd is a simple viewer for Photo CDs. It lets you view photos in the Gimp
    or use a basic viewer for that of the xpcd program. A series of items on the Options
    menus lets you set the JPEG quality, view thumbnails, view in grayscale, and so
    on.


    The xpcd program is located on the CD in the directory /Part07/Execute/Xpcd. You
    can use the binary file alone (no rpm package is provided), but first you’ll need
    to install the X application defaults file, called Xpcddeault. Use these commands
    from a graphical command line:


    ```

    $ cp /mnt/cdrom/Part07/Execute/Xpcd/ /tmp

    $ xdrb -merge /tmp/Xpcd-default

    $ /tmp/xpcd &

    ```


    Once you have the program running, just choose File > Open PhotoCD to get started.


    If you’re using a digital camera instead of having photos processed onto a Photo
    CD, several programs can help you pull your photos into your Linux system. I will
    describe three, moving from the simplest to the most complete.


    If you own a Kodak digital camera such as the DC200/DC210/DC260 you can upload
    pictures for viewing in Linux using the kdcpi package.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_284_0.png)'
  merge: -1
  img_proc: true
