- pgno: 217
  md: '# Turn Linux into the Ultimate Gamer


    For a long time, games were the missing piece on Linux systems. But encouragement
    from Linus Torvalds (creator of Linux) and a host of entertainment-hungry developers,
    Linux now has hundreds of terrific games available. Many commercial game vendors
    have popular titles to Linux. The games described in this section, however, are
    all free—and they''re all included on the CD or installed on Red Hat 6 by default.


    This part describes games that you can play on any Linux platform. Some of the
    games are character-based; some are more graphical. Some require the KDE or Gnome
    environment; others can run without either. For game enthusiasts who want additional
    games and information, consult the Web www.linuxgames.com or look up games on
    one of the download archives described in the introduction.


    As you work with the game programs provided on the CD, be aware that some games
    may require a full install from source or from a binary package in order to have
    all the necessary graphics and libraries in the right place to run the program.
    Just follow the directions and notes I''ve given in each case.


    # 26 Linux at the Arcade


    In general, you can tell how old a person is by which arcade games they know best.
    Game creators oblige us all by continuing to port all the games to all the new
    platforms, and here you''ll find some of my favorites from the eighties (ouch)
    that can still keep me glued to the screen for hours. Of course, newer games are
    always coming along as well, and Linux has its share of, those.


    # Lost in Space


    The computers most of us run Linux on today are extremely powerful compared to
    those we ran a dozen years ago, but a great game concept doesn''t need a powerful
    machine. Some of the classic games from Atari prove that.


    Space Invaders was one of the earliest shoot ''em up games with a fast pace and
    color graphics. The Linux version I''ve included on the CD matches the'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'original so closely that you''ll think you are back in the arcade (or on your
    Atari 800!).


    The program xinvaders is located on the CD in the directory /Part06/Execute/Xinvaders.
    You can run it from within any graphical window (neither KDE nor Gnome are required)
    using this command:


    ```

    $ xinvaders &

    ```


    You use the comma and the period keys (which have < and > on them) to move left
    and right, respectively. Fire missiles by pressing the space bar. Here is the
    screen with a game in progress:


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_218_0.png)


    As the alien invaders fire down on you, their missiles destroy the bunkers that
    you hide behind. The more aliens you blast, the faster the remaining ones move.
    The final few race back and forth across the screen until they crush you if you
    don''t get them first.


    > NOTE When blasting alien invaders, finish off complete columns on either end
    to give yourself more time before the marching aliens reach the edge and drop
    down a level. This is especially important for the final aliens, when they pick
    up speed.


    A three-dimensional version of space invaders is also available on Linux. It uses
    a different style of graphics, but it can still be used on any graphical Linux
    system (no KDE or Gnome required). In the 3D version, aliens get larger as they
    advance closer to you. It''s a little harder in three dimensions'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 200 TURN LINUX INTO THE ULTIMATE GAMER


    to get used to where to fire and the game doesn''t seem to move as fast as the
    traditional version, but you may still prefer this newer incarnation.


    The 3D version of space invaders is located on the CD in the directory /Part06/Execute/Xinvaders3d.
    You can run it from any graphical command line window using this command:


    ```

    $ xinv3d &

    ```


    Here''s a game in progress, with the aliens having advanced a fair distance toward
    you already.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_219_0.png)


    Another classic space game developed by the now-defunct Atari is Asteroids. KDE
    2 includes a great clone of Asteroids as part of the Games menu.


    Unfortunately, this latest version of KDE Asteroids has a few problems. Asteroids
    is not included with the KDE 1.1.2 version in Red Hat, so you don''t have Asteroids
    until you install KDE 2 as described in the previous section. But Asteroids conflicts
    with Qt version 2.2.2 or libmm (I''m not sure which) that you need to upgrade
    in order for KDE 2 to operate correctly (otherwise every KDE 2 program crashes).
    So if you want to play Asteroids, you need to have installed KDE 2 but not the
    Qt libraries that will make it run. Just follow these steps to run Asteroids.
    (You might want to refer to the previous section on using KDE 2. Basically, you
    need to undo a few of those steps.)'
