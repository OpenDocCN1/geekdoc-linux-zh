- pgno: 21
  md: 'Your basic Linux system is designed to be all things to all people. It includes
    a nice graphical desktop, it functions as an Internet server, and it includes
    software development tools. Unfortunately, all things to all people mean mediocre
    results for everyone. This is true even when you choose an installation metaphor
    like "Workstation Install" or "Server Install." These designations, while useful,
    are too broad-brushed to provide specific features that many users would like
    to take advantage of.


    This section is full of shortcuts and tricks to help you do a myriad of tasks
    faster and more easily and fine-tune your Linux system so it better suits your
    personal style. You''ll also learn how to configure and check system information
    that''s not easy to see.


    The tips in the first three items covered here are best for new Linux users who
    want to make Linux a little easier to use, especially if you''ve been working
    with another operating system like Windows or even DOS. The last three items in
    this section contain information on more advanced tools for system monitoring,
    security, and networking—to make your Linux system really hum.


    # Use Your DOS

    Know-How to

    Save Time


    If you''re new to Linux, you may have more experience with DOS and Windows than
    with the often arcane commands required to use Linux from the command line. By
    using aliases in Linux, you can put your DOS and Windows command line experience
    to work without having to relearn everything in Linux.


    # Using DOS Commands in Linux


    An alias is a text substitution: When you type one command, your command shell
    replaces it with another command, according to the alias you defined.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'For example, if you''re accustomed to typing


    DEL


    to delete a file in DOS, you may have noticed that entering that command in Linux
    produces an error message: Linux has no DEL command. But you can make Linux use
    the DEL command in practically the same way as DOS. Just enter this command at
    your Linux prompt (use quotation marks around the right side because: it includes
    spaces):


    ```

    $ alias del="-i"

    ```


    Now when you enter del followed by a filename at the Linux prompt, Linux attempts
    to delete the file you named, just like in DOS.


    You can use as many aliases as you like. To see the aliases that are currently
    in effect, enter alias with nothing after it:


    ```

    $ alias

    ```


    Red Hat Linux 7 has several aliases set up by default to make your life a little
    easier. For example, you can enter ls. (followed by a period) to list all hidden
    files, or ll -l to see a long-format listing of files. (By default, the ls command
    doesn''t include anything except the filenames.)


    Every user can have a separate set of aliases. The table that follows shows a
    list of some common DOS commands and their Linux equivalents. Remember to watch
    for each space, hyphen, and period. (And don''t try entering all of these until
    you learn the trick in the next section!)


    > WARNING Linux commands are always case-sensitive and are almost lowercase. You''ll
    probably want to make all your DOS aliases lowercase as well; leave the Caps Lock
    key turned off.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_22_0.png)


    | DOS Command | Linux Equivalent |

    |---|---|

    | DIR | 1s -la |

    | DIR /P | 1s -la | less |'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# MAKE LINUX FASTER, BETTER, AND EASIER TO USE


    | DOS Command | Linux Equivalent |

    |--- |--- |

    | CD.. | cd .. |

    | COPY | cp -i |

    | REN | mv |

    | DEL | rm -i |

    | TYPE | cat |


    Aliases substitute text in the middle of a command. If you use this alias:


    ```

    $ alias copy="cp -i"

    ```


    and then enter this command:


    ```

    $ copy file1 file2

    ```


    the shell (the command line environment) will substitute the alias text so that
    the command executed is really:


    ```

    $ cp -i file1 file2

    ```


    > **NOTE** Some of the Linux equivalent commands in the preceding table include
    safety features that will help you avoid overwriting or deleting files in Linux.
    For example, removing a file with rm -i (for "interactive") is always safer than
    just removing a file with rm because you will be prompted to confirm each deletion.


    # Make Your New Commands Permanent


    If you play with the alias command, you''ll find that the next time you log in
    all your aliases have disappeared (except those Red Hat includes by default).
    You can enter alias without any parameters to see what aliases are in effect at
    any time.


    Because every user and login session can have a different set of aliases defined
    (a different environment), you need to set up your aliases to be executed each
    time you log.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'If you''re the system administrator, you can set these up in the system-wide
    startup script, /etc/bashrc. The commands located in that file are executed when
    each user logs in. You can also place the alias commands in the startup script
    in a particular user''s home directory, so that they are executed only when that
    user logs in. This file, residing within a user''s home directory, is called .bashrc.
    Follow these steps to set up permanent aliases for yourself:


    +   1. From your home directory, open the .bashrc file in a text editor.


    You can use vi, as described later in this section, or any of the easy-to-use
    graphical text editors that are included with Linux (kedit, xemacs, gedit, etc.).
    If you''re new to Red Hat, try choosing Programs > Applications gedit from the
    main menu of Gnome.


    > NOTE Notice that .bashrc has a period at the beginning of the filename. This
    makes it a hidden file.


    +   2. Go to the end of the .bashrc file.


    +   3. Add lines for each of the aliases that you want to have in effect each
    time you log in. For example, the last few lines of your file might look like
    this:


    ```

    alias cd="cd .."

    alias copy="cp -i"

    alias del="rm -i"

    ```


    +   4. Save your work and exit the text editor.


    Every, time you log in, the commands in .bashrc will be executed, including the
    alias commands that you added.


    One final point. As useful as aliases can be as you transition to Linux, they
    can also be a crutch. Using aliases hides the true Linux command from you and
    may prevent you from learning the full command suite of Linux and the many additional
    options Linux commands provide. After all, if you''re content to use an alias,
    will you ever learn the power of the 54 command line options available for the
    ls command? Don''t be afraid to move away from aliases as you learn Linux commands
    (except for the safety-related aliases that save you from overwriting and deleting
    files).'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# How to Type Less and Do More


    The more you work at a command line, the better your typing becomes. At least,
    that''s how it''s supposed to work. For the rest of us, Linux provides some easy
    ways to avoid typing lengthy filenames and commands. Read on for some tips on
    how to do this.


    # Reuse Commands without Retyping


    After you have typed a lengthy utility name or complex expression on the command
    line, wouldn''t it be nice to use the same command again without retyping it?
    DOS had a feature like this—you could press F3 to bring up the last command.  Or,
    if you used the DOSKEY program in DOS, you could use the up arrow to view the
    last few commands.


    The standard command line interface in Linux, the Bash shell, makes it easier
    to use commands that you''ve previously entered. By using the history feature,
    you can quickly access the full range of previously entered commands, editing
    them slightly if necessary.


    Over 100 commands are stored by the shell for each user. To see them listed, use
    this command:


    ```

    $ history | less

    ```


    Or, to see a shorter list, include the number of commands you want to see. The
    most recently used command is listed last. For example, this command shows the
    ten most recent commands:


    ```

    $ history 10

    125 cd shells

    126 ls bashrc

    127 more bashrc

    128 cd /etc

    129 ls b*

    130 more profile

    131 history | less

    ```'
  merge: -1
  img_proc: true
- pgno: 26
  md: '```

    132 df

    133 cat /etc/passwd

    134 history 10

    ```


    To execute any of the commands in the history list, type an exclamation point,
    then the the number of the command. For example, if I wanted to execute the df
    command, I''d enter:


    ```

    $ 132

    ```


    In this example, the df command is shorter to type. But when you''ve entered a
    very long command, using the history number is much easier than retyping the entire
    command. For example, if I had entered this command:


    ```

    $ ps aux | grep httpd > /mnt/sundance/pidlogs/httpd/current

    ```


    it would be much easier to use the history number than to retype the command.

    An easier way to access the history feature is with the up arrow. When you press
    the up arrow in Linux, the command line changes to show each of your recent commands—and
    you can continue to press the up arrow to list over 100 commands in all.


    Once you see the command that you want to use, you can use the left and right
    arrow keys to move the cursor over it and edit the command as needed to fit your
    current situation. Press Enter when you''re ready to execute the command.


    > NOTE The cursor doesn''t need to be at the end of the line before you press
    Enter.


    You can control the number of history entries that are saved for your user account
    by setting the HISTSIZE environment variable. This variable will normally be set
    to something like 100, meaning 100 commands will be saved between login sessions.
    If you''d like to save more commands, enter something like this:


    ```

    $ export HISTSIZE=500

    ```


    If you want to set a larger history size permanently, you should include this
    line in your .bashrc startup script in your home directory.

    Of course, when you have 100 previous commands saved, it may be hard to find the
    one you want. Here''s a workaround to that problem.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Suppose you entered the long command in our example (starting with ps aux ).
    To locate that command again in a list of hundreds of history commands, use a
    search command, choosing a few characters that you know are part of the command
    you need to locate (httpd in this case). So, for example, you would enter:


    ```

    $ history | grep httpd

    43 ps aux | grep httpd > mnt/sundance/pidlogs/httpd/current

    135 history | grep httpd

    ```


    With this information, you can immediately execute the previous command you need
    with this statement:


    $ !43


    If you already know the number of the previous command you want to use, you can
    enter it at any time using this syntax. But be careful, since the numbers are
    updated each time you enter a new command.


    For times you''re feeling really daring, the history feature provides other options.
    Suppose, for example, that you had recently entered a complex command that started
    with ps. You could repeat that exact command again by entering this:


    $ !p


    The shell looks for the most recent command that starts with the letter y, entered,
    and executes it again. Of course, you should be fairly confident of your previous
    commands when you use this—you don''t want to repeat the wrong command. When using
    this feature, you can enter one or more characters after the exclamation point.
    The shell attempts to match all the characters that you enter with a previously
    entered command.


    More information about the history feature of the shell is available in the online
    manual page for the Bash shell. To see those details, open the Bash man page:


    $ man bash


    Then, with the man page visible, press the following keys (with the capitalization
    shown) and press Enter:


    ^HISTORY'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Access Files and Directories More Quickly


    Although the history feature of the Bash shell is great when you''ve already typed
    in a command once, some commands are difficult to enter the first time. This is
    often because of long directory names or filenames that include punctuation and
    numbers.


    To help ease the task of entering commands, the default Linux command line (the
    bash shell) includes a feature called tab-completion that you can use with any
    Linux command. It works like this:


    +   1. Type the first letter or the first few letters of the filename you want
    to enter.


    +   2. Press the Tab key.


    +   3. If only one file or directory in your current directory matches the first
    letter or letters that you have typed, the entire filename or directory name is
    filled in for you.


    +   4. If more than one file or directory starts with the letter or letters you
    typed, your computer beeps. At this point, you have two options:


    +   * Type another character or two and press Tab again to see if the file or
    directory name can be filled in.


    +   * Press Tab again to see a list of options on-screen that match the first
    letters you typed. Using these displayed options, you can enter another character
    or two to distinguish the name that you want before pressing Tab again.


    To see how this can save you time as you work, I''ll show how you can use tab-completion
    to change to one of the configuration directories of Red Hat.


    +   1. Change to the /etc directory.


    ```

    $ cd /etc

    ```


    +   2. Type the `cd` command, followed by a space and an `s`, but don''t press
    Enter.


    ```

    $ cd s

    ```


    +   3. Press the Tab key.


    The computer beeps but adds nothing to your command because several items in the
    /etc directory start with "s."'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   4. Press the Tab key a second time.


    A list of about three dozen items appears below your command. The command is repeated
    for you on a new command line below the items that begin with "s.".


    Notice that several items start with "sys."


    +   5. Add sys to your command (don''t press Enter yet). The command line now
    looks like this:


    $ cd sys


    +   6. Press Tab twice. A shorter list of items appears below your command.


    7. Add co to your command:


    $ cd sysco


    +   8. Press Tab again. Now that the name on the command line is unique within
    the /etc directory, the shell fills in the name for you. The command line reads:


    $ cd sysconfig


    +   9. Press Enter to change to the /etc/sysconfig directory.


    Using tab-completion in this example may seem like a lot of effort just to save
    a few keystrokes. However, after you become accustomed to using the Tab key for
    long filenames, you''ll find it''s easy to use and you will be greatfully not
    to be typing all those extra characters. Before long, you''ll be entering two
    letters, tabbing, entering two letters, tabbing, and so forth, to fill the entire
    command line with length, complex pathnames.


    # 3 Become a Linux Guru: Master vi


    If you really want to show off your Linux skills, you need to know how to edit
    text files using the vi (pronounced either "vee-eye" or "vye") text editor. Nearly
    everyone laments how hard vi is to learn, but those who learned the basics can
    wear it as a badge of honor.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'The vi editor is very powerful, if you can memorize arcane command strings.
    But beyond its power, there''s another, more practical reason that you need to
    know some vi basics: vi is the lowest common denominator in Linux. Every Linux
    system and every Unix system will have vi installed. If you know something about
    vi, you can always edit a text file in Linux. And since Linux is configured using
    text files, this is a key skill to have.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_30_0.png)


    > NOTE Another Linux editor that has a following of die-hard fans is called emacs.
    Emacs is arguably more powerful than vi, but it''s also a huge program, so you
    won''t find it on all Linux systems.


    Of course, if you''re running Gnome or KDE and have a slick graphical editor at
    your fingertips, you normally won''t resort to vi (unless you''ve become a fan).
    But in many system administration situations you can''t work in a graphical environment—you
    have to rely on text tools like vi.


    # Get Started with Your First Session


    The vi editor is a character-based program. You can start it from any console
    or terminal emulator window using this command:


    ```

    $ vi

    ```


    After you start vi, you see a blank screen with a few tilde characters (~). Don''t
    panic; you''ll soon learn how to deal with all this empty space. The tilde characters
    aren''t part of your file. They just indicate lines on screen that are empty.


    If you have a text file you want to edit, start vi with the filename. For example,
    if you want to edit the file report.txt, you enter this command:


    ```

    $ vi report.txt

    ```


    The file appears on-screen, ready to edit.


    # Secrets of Adding and Deleting Text


    You can move around in your text file using your arrow keys (up, down, left, right,
    Page Up, Page Down).'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'The first secret of editing vi is learning about Insert mode and Command-mode.


    +   - If you see the word --INSERT-- or --REPLACE-- at the bottom of the screen,
    then you are in Insert mode. Type that you type as part of your document.


    +   - If you don''t see anything on the bottom of the screen, you''re in Command
    mode. Characters that you type are interpreted as commands.


    +   - Another mode, Visual, is also available by pressing v in Command mode. But
    learning too much vi at one time isn''t healthy, so I''ll leave that one for you
    to explore your own.


    You can start entering text in a file with Insert mode using any of several methods:


    +   - i to start Insert mode. Text that you enter appears to the left of your
    cursor position.


    +   - a instead of i to begin Insert mode; now new text is inserted after the
    current cursor position.


    +   - o to begin Insert mode; all text will now appear on a new blank line that
    is inserted after the line you are currently on.


    +   - Press Shift+R to begin Replace mode (a special type of Insert mode). In
    Replace mode, text that you enter replaces (overwrites) the current text in the
    file.


    To change from Insert mode back to Command mode, press Esc. If you press Esc again,
    your system beeps, but this doesn''t do any damage. When you press Esc and hear
    a beep, you know you''re in Command mode—sometimes comforting, since there is
    no on-screen indication that you''re in Command mode.


    The following table describes how to use Command mode to complete some basic functions
    in vi. As you look at this table, remember:


    +   - vi provides several ways to accomplish the same thing. This table shows
    just one good method to complete some basic tasks.


    +   - Memorizing commands is how you become skilled with vi. (Sorry!)


    +   - The commands follow patterns that make it easy to build on your existing
    knowledge so that you can do new things with vi.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Many things that can be done in vi with a couple of keystrokes are almost impossible
    to do at all in a regular word processor.


    > NOTE When keystrokes in this table are separated by commas, they should be pressed
    one after another, *not* at the same time.


    | Action | Keystrokes |

    |---|---|

    | Delete a character to the right | x (or d, ← or d, →) |

    | Delete a character to the left | X |

    | Delete a word | d, w |

    | Delete a line | d, d |

    | Search for a string | / (then enter the search string and press Enter) |

    | Undo a change | u |

    | Redo a change | Ctrl+Shift+r |

    | Go to end of the file | Ctrl+g |

    | Go to the top of the file | 1, Shift+G |

    | Get more help on vi | ;, h, Enter (colon, h, Enter) |

    | Save your file | ;, w, Enter (colon, w, Enter) |

    | Exit vi | ;, q, Enter (colon, q, Enter) |

    | Quickly exit vi, saving all changes | Shift+z, z (hold down Shift and press
