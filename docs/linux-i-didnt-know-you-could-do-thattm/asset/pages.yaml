- pgno: 386
  md: '# CLONE WINDOWS NT SERVER ON LINUX 367


    such as smbstatus and smbtpasswd,(which I mentioned previously when discussing
    the GnoSamba utility).


    To actually use SWAT to graphically configure Samba, use the buttons on the top
    of the page, as Globals, Shares, and Printers. The Globals button takes you to
    a page where you can set global parameters. This coincides with the [global] section
    of the smb.conf file.


    > NOTE The Home button always takes you back to the first page of SWAT, with links
    to testing utilities, documentation, and the configuration file viewers.


    A number of possible parameters are displayed when you first click on the Globals
    button. (count 22 in the latest release.) Each includes a Help link and a Set
    Default button, plus a field or set of buttons that you can use to enter a value
    for that parameter. If you need to enter parameters that are not included in this
    first page of Global values, click the Advanced View button at the top of the
    page. This page includes 100+ options, again, each with a Help link and Set Default
    button.


