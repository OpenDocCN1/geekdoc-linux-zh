  md: 'To control SirTet, use these keys:


    +   * Left and right arrow keys move falling blocks from side to side.

    * Up and down arrow keys rotate blocks into the best position.

    * The spacebar immediately drops a block into position at the bottom of the screen.


    # 27 The Best Linux Strategy Games


    For those who prefer a slower pace than the arcade (something you can do between
    reading e-mail messages, perhaps), strategy games provide a welcome respite.


    This section describes board games, card games, and even a couple of educational
    games (trust me) that all run on Linux. Some of the strategy games I''ll tell
    you about are included with the standard KDE and Gnome installations; others are
    located on the CD in the /Part06/Execute directory.


    # Play Chess


    The ultimate strategy game is chess. Linux has supported the gnuchess basic chess
    engine from the beginning, but now a graphical interface is available to make
    that powerful program more interesting on your desktop.


    To play a graphical chess game in Linux, you need two packages: gnuchess, which
    is the engine for the game, and xboard, which provides the interface. These packages
    are both installed by default for a Workstation install of Red Hat Linux 7. In
    case you don''t have them, both packages are included (in rpm format) in the directory
    /Part06/Execute/Chess on the CD.


    To start a game of chess, use this command from any graphical command line:


    ```

    $ xboard

    ```'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'The chessboard appears, as shown here.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_234_0.png)


    By default, the computer plays black, so you get the first move. Don’t be fooled,
    however. The computer will win more often than not unless you’re a very good player
    (or you make the computer dumb).


    To make a move, click and drag your mouse on one of the white chess pieces and
    drop it on a new square. The computer responds immediately for the first couple
    of moves, then more slowly as the game progresses. A timer above the board counts
    down for the player whose turn it is. Features include:


    +   - Illegal moves are not allowed (see the message box below the timers) unless
    you choose Options ⮛ Test Legality and uncheck this feature.


    +   - Standard chess notation is used to show moves in the message window.'
