  md: '# What''s on the CD


    The CD-ROM contains most of the software packages that are described in the text
    of the book. (A few items described are commercial software and cannot be included
    here or are installed by default in Red Hat Linux 7.)

    Highlights include


    +   * KOOffice Office Suite

    * Players for video clips, MP3 audio files, and audio CDs

    * The best arcade and strategy games for Linux

    * Virus scanners

    * Personal finance and stock tracking tools

    * Security add-ons

    * Windows integration tools

    * Apache Web server add-on modules


    You deserve some warning about these add-on packages: Some of them are easier
    to use than others. You can run most of the programs right off the CD; a small
    number require that you work with the source code a little or enter extra commands
    to prepare your system. This is especially true if you''re not running a standard
    Red Hat Linux distribution, which is what all the packages were tested on. I''ve
    included step-by-step instructions for each program when run on Red Hat 7. But
    whatever your Linux background, I''m confident that you''ll find all sorts of
    useful tips and tools in this book. If some programs that you want to try are
    harder to use, consider that incentive to learn more about the inner workings
    of Linux.


    +   * All of the packages have been tested on a default Red Hat Linux 7 Workstation
    installation.


    +   * The README file on the CD and the Introduction to the book provide additional
    guidelines on working with the source code files (if necessary for your Linux
    system).


    +   * A small number of packages are only included as source code and must be
    compiled on your system before use. These packages are indicated in the text of
    the book.


    +   * Some packages require additional preparation to your Linux system or additional
    hardware, as described in the text of the book.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '+   * The rpm_list.txt file on the CD shows you exactly which packages were
    installed on the Red Hat test system.


    +   * It''s often a good idea to copy a binary file to your hard disk before running
    it, instead of running it directly from the CD. Check the mounting options in
    your /etc/fstab file to see how your CD drive is mounted. Once you''ve copied
    a program file to your hard disk, be sure it has the execute bit set (use the
    command chmod a+ filename if needed).


    +   * If you''re having trouble getting a package to work, the best course of
    action is to contact the author of the individual software program. An email address
    and Web page are generally provided in the README for an individual package.


    # System Requirements


    The software on the CD has been tested on Red Hat Linux 7 but will run on other
    systems (in many cases the source code must be recompiled to use programs on non-Red
    Hat systems). Software packages generally require few resources beyond those required
    to run your Linux operating system. Individual packages require from 50KB to 10+MB
    of hard disk space. Many (but not all) require a graphical system such as Gnome,
    KDE, or another Linux graphical window manager. A few specialized tools interface
    with a Palm device or special hardware. These are noted in the text.


    # Software Support


    Components of the supplemental Software and any offers associated with them may
    be supported by the specific owner(s) of that material, but they are not supported
    by Syex. Information regard regarding any available support may be obtained from
    the owner(s) using the information provided in the appropriate README files or
    listed elsewhere on the media.


    Should the manufacturer(s) or other owner(s) cease to offer support or decline
    to honor any offer, Syex bears no responsibility. This notice concerning support
    for the software is provided for your information only. Syex is not the agent
    or principal of the owner(s), and Syex is in no way responsible for providing
    any support for the software, nor is it liable or responsible for any support
    provided, or not provided, by the owner(s).'
