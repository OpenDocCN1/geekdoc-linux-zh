    # Perform Scientific Calculations


    Some programs for Linux focus on imitating popular handheld calculators, such
    as the old Hewlett-Packard HP-67 or Texas Instruments TI-30. Others branch out
    with their own designs.


    Several of the programs described in this section use the Reverse Polish Notation
    system. This system is probably familiar to you if you''ve used any of the popular
    HP calculators (other than the business-oriented models). If you''ve never seen
    one, an RPN calculator seems strange at first in that it has no Equals (=) button.
    Instead, use Enter to "push" numbers into a series of registers and then press
    operations keys (like + or i/x) to perform actions on the numbers in the registers.
    One of the registers is the display. I''ll walk through a couple of sample calculations
    with an RPN calculator to demonstrate.


    The HP-67 is an old RPN calculator that includes many useful functions. It''s
    a character-mode application. A standard rpm file is included on the CD in the
    directory /Part11/Execute/HP67.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_395_0.png)'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# DO CALCULATIONS IN LINUX 377


    After installing the rpm file, run the program hp67. (A source-code rpm is included
    in the directory /Part11/Source/HP67, in case you have trouble on your platform
    with the standard rpm.) The calculator appears as a full-screen (80×25) character-mode
    interface.


    To begin using the calculator, type in a number and press Enter. The number moves
    to a line above. Then type a second number and press Enter. This number also moves
    up one line, and the first number scrolls up. To add these two numbers together,
    press the + key. The two numbers are added and placed in the lower line.


    If you think of each line as a register, the function of the plus sign can be
    stated as “add the contents of the X and Y registers and place the result in X.”
    This method gives you a lot of flexibility when completing complex calculations.
    Once you become familiar with RPN, the calculator also makes it easier to keep
    track of what numbers are part of the calculation.


    The HP-67 emulator includes 10 registers. You can see them scroll up the screen
    as you work, or shift down as operations are completed. To complete any of the
    operations, type in the descriptive name and press Enter. For example, to compute
    the cosine of the bottom register, type cos and press Enter.


    The pcalc calculator is used from the command line. It is a programmer’s calculator,
    intended mostly to help with doing simple math operations with hexadecimal, octal,
    or binary numbers. Pcalc is located on the CD at /Part11/Execute/Pcalc.


    To use pcalc, you enter a command line that includes the expression you need to
    calculate. Output from every calculation is shown in decimal, hexadecimal, and
    binary formats. Here are a few examples. To convert a number between formats,
    just enter the number.


    | Task | Command in pcalc | Results |

    | --- | --- | --- |

    | Convert a number between formats (just enter the number) | $ pcalc 0300 | 768
    0 × 300 0y1100000000 |

    | Add together two hexadecimal numbers | $ pcalc 0x1234 + 0x3e | 4914 0 × 1332
    0y101100110010 |


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_396_0.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_396_1.png)'
