- pgno: 189
  md: '# MAKE YOUR LINUX SYSTEM A DESKTOP


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_189_0.png)


    The right-click menu includes three delete options. Choose carefully when you
    want to remove a file or directory. All of these require a confirmation, by default.


    **Move to Trash** deletes the item by moving it to a separate folder in your Home
    Directory. You can open the Trash icon on the KDE desktop to retrieve the file
    or right-click on the Trash icon to empty the trash and delete all files.


    **Delete** uses a standard Linux rpm command to delete a file permanently.


    **Shred** overwrites a file with random data before deleting it permanently. This
    is the most secure method of deleting a file, because the file cannot be recovered
    (undeleted) after a shred operation. This feature attributes some of the file
    management tools described for command line use earlier in this book.


    Konqueror is designed to be more than just a file browser. For example, you can
    enter a URL in the Location field and immediately view a Web page or load an FTP
    site. You''ll notice that the Go and Bookmarks menus mirror many of the features
    you''d find in a standard Web browser.'
  merge: -1
  img_proc: true
