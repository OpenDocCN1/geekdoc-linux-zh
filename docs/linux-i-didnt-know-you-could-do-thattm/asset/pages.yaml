  md: '# # Linux!


    # I Didn''t Know You Could Do That...


    # ## Discover Amazingly Cool Things You Can Do with Linux!


    Turn your Windows-using friends green with Linux envy! Using this completely updated
    and revised book, you can take all you know about Linux and do it faster, easier,
    and better! Learn how to soup up your Linux box to suit your personal style. Boasting
    over 70 pages of new material, this book has easy-to-follow instructions, tips,
    tricks, and valuable software that will allow you to run your home office on Linux,
    set up a crash-free Web server, manage your finances, automate everyday tasks,
    blast your MP3 tunes, and more!


    # ## Supercharge your Linux apps: Get the most out of Applixware, WordPerfect,
    KOffice, and other business productivity packages to keep your office running
    smoothly. Brand new chapters KDE and GNOME, compression, graphics and instant
    messaging. Learn how to run your Windows and Linux applications, view Microsoft
    Word files, create a fax server, utilize graphics tools, and track your business
    contacts in Linux.


    # ## Serve your own Web pages and connect to NT networks: Extend the Apache Web
    server by adding modules, create a proxy server, and fine-tune your server to
    support massive Web traffic. Discover how to clone or access a Windows server
    from your Linux system!


    # ## Work smarter and have more fun than a barrel of monkeys!


    Put Linux and the dozens of software packages included on the CD to work.


    - \u2

    - Play MP3 files, watch TV, listen to the radio, and burn CDs

    - Create the ultimate Linux game system—blow your competition away!

    - Use the Internet to send instant messages to friends

    - Create custom Web searches

    - Enhance network security

    - Disaster-proof your system

    - Show off your own Web photo album


    > About the CD

    Loaded with scores of useful programs, including KOffice, the latest versions
    of GNOME and KDE; Samba client/server suite; network administration utilities
    for firewalls, security, and monitoring traffic; Apache source code; fax/scanner
    software; a contact database; disk and file management tools; dozens of games,
    mpeg, and video players; and more!


    # ### The Author


    Nicholas D. Wells is the former director of Linux vendors Calder Systems and Line.
    He has written nine books on various topics, including Linux servers, StarOffice,
    and KDE. He contributed to Mastering Linux Premium Edition from Syb, and teaches
    various Linux topics in Keystone Learning Systems.


