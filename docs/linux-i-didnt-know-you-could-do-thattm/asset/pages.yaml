- pgno: 361
  md: '# Clone Windows NT


    Every operating system has strengths and weaknesses; hence, you choose different
    tools for different tasks. More and more, however, I seem to be choosing Linux
    for just about everything. In this part, you''ll learn to use standard Linux features
    to make Linux appear to be a Windows NT system to regular Windows clients, such
    as Windows 95/98/2000.


    In case you already have Windows NT servers on your network, you''ll learn how
    to use a Windows-style client to connect to those servers using their native protocols.
    To the NT server, your Linux system will appear just like another Windows client,
    which makes it easier to interact with systems that don''t know about Linux.


    Windows systems use a networking standard called Server Message Block, or SMB.
    This protocol allows for file and printer sharing with numerous security options
    and other features. This protocol builds upon the NetBEUI protocol that Windows
    and LAN Manager (an old Microsoft product) have used for years.


    A few years ago, a developer named Andrew Trigdell in Australia reverseengineered
    these Microsoft protocols and created a client and server program to duplicate
    them on UNIX and Linux. The program was named Samba—a name that contained the
    letters SMB but didn''t violate any trademark laws. The Samba program is open
    source; it is available for dozens of UNIX systems and is also included with every
    standard Linux distribution. The Linux client portion, which allows you to connect
    to Windows systems from Linux, is installed by default on Red Hat 7.


    > NOTE Microsoft Corporation controls the SMB protocol. Sadly, they keep making
    changes to it. This can cause problems even when you are simply networking multiple
    versions of Windows together; it also makes it a real challenge to keep the latest
    features in a reverse-engineered program. Don''t be surprised if some late-breaking
    networking feature of Windows 2000 is not in the Samba Server yet.


    Using the Samba server on Linux lets you make Linux appear to be a Windows NT
    server. Linux can then appear to other Windows systems (95, 98, 2000, and NT)
    as if it were just another Windows system. Your Linux computer appears in the
    Windows Network Neighborhood windows; you can share files and printers, maintain
    per-user password security, define


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_361_0.png)'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# ACCESS WINDOWS NT SERVERS FROM LINUX 343


    shares, and perform other standard Windows networking tasks. The only real difference
    is that the Linux system never needs to be rebooted.


    > NOTE You can learn more about the Samba project and read more detailed documentation
    about the information in this section by visiting the Samba organization''s Web
    site at www.samba.org. Mirror sites are located worldwide.


    Running a Samba server on Linux has a distinct advantage over using a real Windows
    NT server: Linux rarely crashes. Others on your network may not know that the
    Windows NT server that provides file- and print-sharing is actually a Linux system—they
    may praise you for never having the downtime that other Windows users complain
    about. In fact, it''s easy to place a description line in your Samba configuration
    file that says your Linux system is actually a Windows server, if you prefer not
    to know about Linux. Users on the network won''t be able to tell the difference.


    In the following sections, I describe how to set up a basic Samba server and use
    the Samba client tools. I have tried to separate these, because some people will
    want to do one or the other. But using the client tools is part of configuring
    and testing the server, so I''ll begin with that.


    # 40 Access Windows NT Servers from Linux


    Samba gives you a powerful way to use Linux as a file and print server that all
    of your Windows clients can access, but many networks already make extensive use
    of Windows NT servers. Samba lets you connect to these Windows NT servers and
    other Windows systems as a client.


    Using these features, you can use Windows NT as a shared-file server, access shares
    on any Windows client (that you''ve been granted access to), or print to a Windows
    printer. These features also apply to any other system running a Samba server.
    For example, one Linux system can act as a client'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'to another Linux system running as a Samba server. If you’re accustomed to
    the Samba tools, this is a simple way to transfer files and share printers without
    relying on Linux protocols like FTP, NFS, and the lpd printing daemon.


    The easiest way to learn about SMB systems such as Windows NT is on the command
    line, so I''ll begin there. Graphical utilities that can assist with the process
    are described afterwards.


    The Samba client software is installed on Red Hat 7 by default. If you haven''t
    used a default Red Hat installation, I''ve included the two packages you''ll need
    in the CD in the directory /Part10/Execute/Samba. Use a standard rpm command to
    install the two packages samba-common and samba-client.


    # Connect to an SMB File Server


    Connect to an SMB server such as Windows 98, Windows 2000, Windows NT, or a Samba
    server running on another UNIX/Linux platform, use the smbclient utility. To use
    smbclient, you must know the name of the SMB server you wish to connect to and
    a username that is valid on that server. You can then begin by using the following
    command to learn about what the server offers:


    ```

    $ smbclient -L servername -U username

    ```


    ```

    Added interface ip=192.168.100.3 bcast=192.168.100.255 nmask=255.255.255.0

    Server time is Tue Jan 23 12:44:34 2001

    Timezone is UTC=-6.0

    Password:

    Domain=[WELLS] OS=[Unix] Server=[Samba 1.9.18p8]

    security=user

    ```


