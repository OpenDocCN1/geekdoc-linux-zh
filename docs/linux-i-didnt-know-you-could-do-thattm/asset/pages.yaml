- pgno: 133
  md: '# Spice Up Your Desktop


    # 19 Personal Productivity Tools and Toys


    With the growing sophistication of the KDE and Gnome desktops, new users of Linux
    are becoming accustomed to the power of a full-featured GUI. Still, the desktop
    you download or install by default on Linux might not include all the tools and
    toys that you want.


    This part describes some great add-ons for KDE and Gnome that you can integrate
    with your desktop, such as graphical tools and practical financial utilities.
    The focus in this part isn''t just on system administration as it has been in
    the earlier parts of this book—it''s on adding features to your desktop that you
    didn''t know was possible to add.


    I''ve assumed here that you have Gnome or KDE installed as a working desktop interface
    on Red Hat 7. Either or both of these can be installed during the standard Red
    Hat 7 installation.


    If you choose to have both desktop interfaces installed, you can switch between
    them using the command switchesdesk-kde. This program displays a small dialog
    box in which you select the desktop interface that you want to use. You must then
    log out of graphics mode and restart the desktop for your choice to take effect.


    I recommend installing both KDE and Gnome that you can use both types of applications.
    (You still get to work in the desktop environment that you prefer, but all the
    application support files for both are available on the system.) If you don''t
    have both Gnome and KDE installed, you can still use the applications designed
    for the desktop that you do have installed.


    This section describes specialized programs to help you get the job done. Serious
    productivity programs like financial managers, special databases, and Internet
    searching tools have been slow in coming to Linux, but there are some really impressive
    ones here now.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Also included in this section are productivity applications that enable you
    to appear busy while you''re actually doing something that isn''t in your job
    description, such as checking the weather or cataloging your video collection.


    # Track Your Stock Portfolio


    Several tools are available for Linux to help you manage your growing collection
    of stocks. Stock tracking and management, and other financial tools are all available.


    The Gnome Portfolio Manager uses the Yahoo! stock quote service to help you track
    a selected portfolio of stocks. You must have a Yahoo! Finance ID and password
    set up to use the Gnome Portfolio Manager, but this is a free service that everyone
    can sign up for. Just go to http://yahoo.com and click the Register/Sign In in
    the Welcome section near the top of the page.


    Once you have your Yahoo! ID set up, install the Gnome Portfolio Manager on your
    system. The rpm for this program is located on the CD at /Part04/Execute/Gnome-pm.
    This rpm, however, uses an older URL (Web address) to access Yahoo! Finance. Since
    this doesn''t work any longer, I''ve modified the source code a bit to use the
    latest as of this writing. Use the individual program gnome-pm within the /Part04/Execute/Gnome-pm
    directory.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_134_0.png)


    > NOTE If you want (or need) to further alter the source code, note that I''ve
    modified line 385 of the source file stock_list.c to reflect the latest Yahoo!
    Finance URL.


    Once you have the program running, start by choosing Program ➤ Preferences and
    entering your Yahoo! ID and password in the appropriate fields.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'You must also enter which Yahoo! Host to access for financial data. Previously,
    this was quote.yahoo.com. Now you should use finance.yahoo.com.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_135_0.png)


    You can immediately begin entering stock symbols to track by clicking the Add
    button (or choosing Symbol ➤ Add). But unless you only own a couple of stocks,
    I recommend using the New button to name a portfolio, then using the Add button
    to add stock symbols within that portfolio. This allows you to have multiple sets
    of stocks (each in a portfolio) for easier management.


    > NOTE After installing the rpm, you can launch this program from the Gnome menu
    using Programs ➤ Applications ➤ Portfolio Manager.


    Click the Save button to record to disk all the symbols and portfolio names that
    you''ve entered. All of this information is stored in a hidden directory .gnome-pm
    save within your home directory. You''ll never have to provide a filename; just
    click Save and everything is recorded as you''ve entered it.


    The Symbol menu has numerous options for organizing your list of stocks, such
    as sorting symbols, moving a selected symbol up or down, and removing a symbol
    from the list.


    If you aren''t certain of the symbol you want to add, use the Lookup button (on
    the far right of the tool bar). When you enter a company name, the'
  merge: -1
  img_proc: true
