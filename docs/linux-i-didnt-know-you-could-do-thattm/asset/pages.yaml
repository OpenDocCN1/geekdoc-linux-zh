    # Track Detailed Networking Statistics with IPTraf


    The exdump utility is a simple command line utility with few options. But it''s
    a good way to start exploring your networking traffic. On the other hand, the
    IPTraf utility is a powerful tool for tracking many types of information about
    what is actually happening on your network. You can track requests and responses
    by hostname, IP address, and port; watch requests in real time as they are serviced;
    and see general statistics for your network interfaces.


    All of the IPTraf functionality is easy to use from the menu-based (character-mode)
    interface. The executable program is located on the CD at /Part01/Execute/IPTraf;
    the complete documentation for this program is also included in the same directory.
    Start the program from any Linux command line (you must be logged in as root to
    run iptraf):


    ```

    # iptraf

    ```


    After a couple of initial messages (press any key to continue after reading these),
    you will see the main menu of IPTraf, shown here.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_57_0.png)


    The current interface statistics option provides a summary of traffic flow on
    each of the active interfaces of your system. The information provided includes
    the throughput (KB per second, for example)'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'For more detailed information on a single interface, choose the Detailed Interface
    Statistics option and select an interface from the list presented. The window
    that appears shows you real-time activity on the selected interface, with traffic
    broken down by packet size and type.


    The throughput and any IP errors are also tabulated in this detailed view of the
    network interface.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_58_0.png)


    Press Esc to return to the main menu from any one of the screens described here.


    Most of the traffic that crosses your IP network will be using the TCP/UDP protocols.
    The TCP/UDP service monitor option is used to break down traffic on a single interface
    based on the TCP port that the packet arrives on, as shown here.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_58_1.png)'
  merge: -1
