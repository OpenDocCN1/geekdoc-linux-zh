  md: '# Classic Adventure


    NetHack is a supercharged version of a strategy/adventure game like the old Zork
    or Scott Adams adventures; it''s sort of like Dungeons and Dragons on-screen.


    NetHack is similar to gnuchess in that a game engine is used on a myriad of different
    systems. Linux users also have several graphical interfaces available, which makes
    the game much more interesting.


    Many versions of this program are available on the Net. I''ve included the version
    based on the Qt libraries that are also used in KDE. (Though KDE isn''t required
    at all to use this program.)


    Use a standard rpm command to install the NetHack package found on the CD in the
    directory /Part06/Execute/NetHack. You can then execute the game from any graphical
    command line. (The binary is installed in /usr/bin).


    Despite the attractive interface, I tend to think of NetHack as a text-based adventure
    game. You choose actions such as picking things up, moving around, casting spells,
    and the like.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_245_0.png)'
  merge: -1
  img_proc: true
