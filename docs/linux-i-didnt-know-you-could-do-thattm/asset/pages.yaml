- pgno: 62
  md: 'Within this filter definition screen, you enter the hostname or IP address
    of the machine that you want to filter and the TCP port to filter on. You can
    then include or exclude packets that match this filter criteria.


    > WARNING The filters in IPTraf define what to look for. They don''t have any
    effect on what is allowed on the network. IPTraf is not a firewall.


    By defining a series of filters, you can check for certain activities on your
    network without being bothered by extraneous data.


    # Capture Data Directly from the Network


    When people talk about the dangers of using the Internet for electronic commerce,
    they often mention how someone can “sniff” information directly from the Internet.
    Information that isn''t encrypted can be easily read. The snifit utility shows
    how easy it is to do this. Sniffit is similar to expdump, but it is a more advanced
    utility. Sniffit also provides a useful tool for network administrators trying
    to debug very challenging problems on their network.


    > NOTE By using the snifit utility, you will see how important it is to secure
    communication over the Internet and over your internal networks. You will also
    become aware of how easy it is for malicious users to gather information using
    these basic tools.


    Tools like IPTraf, described in the previous section, are used to manage network
    load based on traffic levels of different protocols. The sniffit program is different.
    Rather than providing statistical information based on protocols, it stores individual
    packets as they are sent over your network.


    > NOTE Many issues affect which network packets are received at your computer''s
    network card. Unless you are working at a server, much of the network traffic
    is never seen by your system.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# MAKE LINUX FASTER, BETTER, AND EASIER TO USE


    You can use sniffit in several ways, including setting up configuration files
    to determine how network packets are tracked and stored. The sniffit program can
    also use plug-ins to support various functions, and it has an Interactive mode
    where you can control how network traffic is analyzed as the program.


    The sniffit program is located on the CD at /Part01/Execute/Sniffit. You can install
    sniffit using a standard rpm command like this:


    ```

    # rpm -Uvh sniffit-0.3.7beta-7.i386.rpm

    ```


    A few command line examples follow. Remember that sniffit can only track network
    packets that pass through your network card. If you''re on a local network, most
    of the traffic won''t be seen on your network card. (If you don''t have networking
    set up on your computer, don''t run sniffit.)


    Each packet on your network has fields that define the IP address from which the
    packet originates (the source) and the IP address that the packet is headed for
    (the target).


    If you want to see packets that are coming from IP address 192.168.100.3, regardless
    of protocol or target (destination), use this command (you must be logged in as
    root to use sniffit):


    ```

    # sniffit -d s 192.168.100.3

    ```


    When you press Enter, all the packet data (the actual data in the packet) is dumped
    to the screen, as requested by the -d option. The information dumped to the screen
    looks something like this:


    Supported ethernet device. (eth0)

    Sniffit.0.3.5 is up and running.... (192.168.100.3)


    Packet ID (from_IP.port-to_IP.port): 192.168.100.30-

    192.168.100.2.2729


    45 00 05 2D 21 00 00 40 FE 4A C4 A68 63 00 C8 64 02 00

    50 AA A9 DB DB FB


    A6 53 56 98 EB B3 50 10 3F 0E F0 37 00 2F 61 3E 0D 0A 20 46

    6F 72 20 65 78


    61 6D 70 6C 65 2C 20 69 69 70 74 68 65 25 65 63 6F 70 70 63 75 74

    65 20 6E 61 6D


    65 20 66 66 20 61 21 20 70 65 65 65 65 65 65 7F 24 20 69 62 20

    0D A9 79 6F 75


    72 20 63 75 72 75 72 74 74 74 74 74 78 79 20 69 73 20

    55\ 55 46 4F 4C 31 2E


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_63_0.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_63_1.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Capturing network traffic generates a lot of data. If you want to store that
    data to a file, called savedata in this example, use a redirection symbol:


    ```

    # sniffit -d -s 192.168.100.3 > savedata

    ```


    To see packets coming from this IP address, but only those that specify a certain
    TCP port (normally associated with a protocol, as for 80 for the Web), use this
    command:


    ```

    # sniffit -d -p 80 -s 192.168.100.3 > savedata

    ```


    Changing from -d to -a changes the numeric (hex) dump to ASCII, so you can actually
    see the data flowing across the network:


    ```

    # sniffit -a -p 80 -s 192.168.100.3 > savedata

    ```


    In this case, the data looks like this:


    Supported ethernet device. (eth0)

    Sniffit.0.3.5 is up and running.... (192.168.100.3)


    Packet ID (from_IP.port-to_IP.port): 192.168.100.3.80-

    192.168.100.2793

    E . . . 7 . . . . d . . . d . P . e . . . P

    ? .

    ./ a> . Select this option if you

    want

    the old name saved as a . . .value

    in the "Other Names" field of the

    "Details''


    To see all traffic that is headed for a certain IP address, use the -t option
    for target, instead of -s for source:


    ```

    # sniffit -a -p 80 -t 192.168.100.3 > savedata

    ```


    This command will be used with the IP address of a Web server, to see packets
    destined for port 80 on the Web server.


    To see all traffic related to a certain IP address, either coming from it or going
    to it, add the -b option with either -t or -s to specify the IP address.


    ```

    # sniffit -ab -p 80 -t 192.168.100.3 > savedata

    ```


    The Interactive mode can also be used with the -i option if you have compiled
    in the correct parts of the source code.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_64_0.png)'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Many similar tools are available on the Internet, but sniffit provides an easy-to-use
