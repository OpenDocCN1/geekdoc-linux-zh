- pgno: 120
  md: '# Use Startup Scripts to Launch Programs


    When you boot your Linux system, the process includes running any-startup commands
    that are found in certain files (I''ll call these startup scripts).

    You can add lines to these startup scripts in order to start programs that each
    time you begin using Linux, or to set configuration information.

    A script is simply a text file containing commands, which appear as they would
    in any command line. Linux scripts are similar to DOS batch files, but Linux provides
    much more programming functionality, such as control structures and complex conditional
    tests. (You can learn more about this from the man page).


    Each time you start Linux, the following script is executed:


    ```

    /etc/rc.d/rc.local

    ```


    +   * /etc/profile (for every user on the system)

    * .profile in your home directory is executed only when you log in (each user''s
    home directory can have a unique .profile script


    Each time you start a new Bash command shell (by logging in or opening an xterm,
    for instance), your working environment is set up by Linux. In order to do this,
    the following scripts are executed:


    +   * /etc/bashrc (if it exists)

    * .bashrc in your home directory


    On Red Hat 7, another script, named .bash_profile, is part of your home directory
    and is executed, in addition to those listed. The Bash shell is the default for
    all Linux systems. If you selected another shell as your working environment,
    such as the C or Korn shell, a corresponding script is executed each time you
    open a new shell; for example, the .csh or .ksh scripts in your home directory.


    Another set of scripts is run each time you start the X Window System. These scripts
    are more complex than the others just mentioned: don''t alter'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'the existing lines in these files unless you know what you''re doing. The scripts
    that are run for X may also depend on which version of Linux you are running and
    which graphical tools you use (such as KDE, Gnome, fwm, vwwm, CDE). The basic
    scripts to be run include:


    +   - .xinirc in your home directory


    +   - .Xclients in your home directory


    +   - .Xsession in your home directory (if you''re using the graphical login)


    +   - /etc/X11/xinit/xinitrc


    +   - /etc/X11/xinit/Xclients


    Because these files are used to determine which graphical window manager and desktop
    to start for, they are executed in the order shown above. For example, if you
    have a file named .xinirc in your home directory, it can specify which desktop
    to start when you enter the startx command.


    The programs that you want to be launched when you start X are normally listed
    at the end of the .Xclients file in your home directory. The system-wide Xclients
    in /etc/X11/xinit might contain the names of programs that will be started for
    all users when they run startx; for example, a desktop pager or clock program.


    # # Defining Programs and Environment Information


    To make a program start each time you boot your Linux system, just add the appropriate
    command to the end of your /etc/profile script.


    For example, suppose you want to send an e-mail to a system administrator on another
    system each time Linux is started. You can do this by adding the following line
    to the end of the /etc/rc.d/local script:


    ```

    mail -s "Starting Linux system Brighton" robert@whistler.xmission.com < /dev/null

    ```


    This command appears in the script exactly as it would appear if you were typing
    it from any command line.


    In addition to starting programs, you may need to set up information about your
    environment—such as environment variables and alias commands—each time you start
    a shell or use the su command with the "-" parameter to'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# RUN A PROGRAM AUTOMATICALLY EACH TIME YOU START LINUX


    access your user account. Any commands used to set up your environment can be
    added to the end of your .bashrc script in your home directory.


    > NOTE The filename .bashrc begins with a period, making it a hidden file. Use
    ls -a command to view both regular and hidden files.


    For example, suppose you need to define an environment variable each time log
    in, so that the programs you run have that information available to them. The
    environment variable is specific to your user account, so place it in your .bashrc
    file. It might look like this:


    ```

    export HISTSIZE=250

    ```


    It''s also common to include environment variable definitions in the .xinitrc
    or .xclient files in your home directory, so that any graphical programs you need
    will have that information available. This type of information can apply to all
    users on your Linux system if you place it in the /etc/profile or /etc/X11/xinit/xinitrc.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_122_0.png)


    > WARNING If you are using run level 5 (the graphical login screen), be careful
    about changing any scripts that are run at startup system. If you add a command
    that doesn''t work correctly, the system may not be usable because the script
    cannot exit normally. Test commands as a regular user first.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_122_1.png)


    # Auto-Start Graphical Programs in Gnome or KDE


    The latest release of the Gnome desktop includes a Startup Programs configuration
    screen. On this screen you can select programs that are located anywhere on your
    system. Each time you launch the Gnome desktop, all of these programs are executed.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '> NOTE The Startup Program settings are specific to your user account. If you
    set up programs while logged in as root, they will not be auto-started when you
    log in with your standard user account.


    To set up a Startup Program in Gnome, open the Gnome Control Center by clicking
    the toolbox icon on the Panel. Then choose Session > Startup Programs from the
    list of options on the left side of the screen. In the window that appears, you
    can designate the programs that you want to start automatically.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_123_0.png)


    Configure which non-session programs are started up

    \To add a program to the list of programs to be auto-started, choose the Add button
    and enter the name of the program. You can also use the Browse Currently Running
    Programs button to select from currently used applications or the Browse button
    within the Add Startup Program dialog box. Using these two buttons can make it
    easier to locate the program you want.


    The Add Startup Program dialog box also includes a Priority field in which you
    can select how high a priority to assign the program when it is started. The default
    value shown in the dialog box is appropriate for most programs.'
