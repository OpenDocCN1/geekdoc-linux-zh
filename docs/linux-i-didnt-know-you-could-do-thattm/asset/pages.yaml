- pgno: 69
  md: 'You''ve used all the standard Linux utilities for copying and deleting files
    (cp, rm), managing your directory structure (cd, pwd, mkdir), and so forth. This
    part describes a few of the tools you wish you had had all along. Now you can
    use them to manage your files like a pro.


    > > **WARNING** Some of the tools showcased in this section require a bit of knowledge
    about how your hard disk is set up. Read the documentation carefully if you need
    to learn about the more technical details before using these special utilities.


    # # 7 Optimize Your Linux Hard Disk


    With some operating systems, you need to optimize, or defragment, your hard disk
    regularly to prevent serious performance problems. This is because the pieces
    of a single file are scattered (fragmented) over the entire area of your hard
    disk.


    Linux doesn''t suffer from this problem to any serious degree because the design
    of the Linux native file system (called ext2, for extended file system, version
    2) allocates space for files in a way that allows files to grow without becoming
    fragmented.


    Still, on a Linux system with a lot of disk activity, (or one where the hard disks
    are quite full), you can increase your disk performance by 5 to 25 percent by
    defragmenting your Linux file system.


    The defrag package enables you to quickly defragment your Linux file system to
    improve performance. The program is located on the CD in the /Part02/Execute/Defrag
    directory; the source code is in /Part02/Source/Defrag.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'To install the binary package, use these commands while logged in as root

    with the CD mounted:


    ```

    # cd /mnt/cdrom/Part02/Execute/Defrag

    # rpm -Uvh defrag-0_7-35_i386.rpm

    ```


    A separate binary file is also included on the CD in the same directory as the

    rpm package, but installing the rpm is recommended to get the complete

    package.


    Once the defrag package is installed, you can use this example to defrag-

    ment the third partition of your IDE hard disk. The device name for this

    partition is /dev/hda3. You can change this device name to match the par-

    tition that you want to defragment. The actual program that you use to

    defrag disk is called e2defrag. To run the e2defrag utility (for the

    Linux ext2 filesystem) in the defrag package, follow these steps while

    logged in as root:


    +   1. Back up any important data that is on your hard disk.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_70_0.png)


    > WARNING This step is crucial. If the e2defrag utility has any serious dif-

    ficulty with your hard disk, all of your data may become unusable.


    +   2. Enter this command and review the output that the

    partition you want to defragment is not mounted (e2defrag should

    never be used on a mounted partition).


    ```

    # mount

    ```


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_70_1.png)


    > WARNING If you need to defragment your root partition, you must reboot

    your system from a boot disk and run the e2defrag utility from disk. (See Item

    49 for hints on doing this.) The root partition cannot be unmounted while using

    your system.


    +   3. Run the fsck utility on the partition that you want to defragment to

    test for errors:


    ```

    # fsck /dev/hda3

    ```


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_70_2.png)'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 4. Run the e2defrag utility in read-only mode.


    This will not update your hard disk, but it will check that the utility can operate
    correctly on your hard disk.


    ```

    # /bin/e2defrag -r /dev/hda3

    ```


    # 5. Run e2defrag to optimize your hard disk.


    ```

    # /bin/e2defrag /dev/hda3

    ```


    Running the e2defrag utility can take from 5 to 60 minutes or more, depending
    on the size of your hard disk and the speed of your computer. As e2defrag works,
    you will see a graphical screen like the one in here:


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_71_0.png)


    # 6. If you used e2defrag on your root partition, run the lilo command to update
    the hard disk map file that tells lilo how to boot Linux.


    ```

    # lilo

    ```


    > NOTE You don''t need to change the /etc/lilo.conf file. Running the lilo utility
    imports the boot process of the new location of the Linux kernel on the disk,
    in case the defragmentation process has moved it.


    If you''re really interested in high performance, you can take other steps to
    optimize specific files on your disk. Each file on your Linux file system is'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'assigned a number called an inode. This number is used to locate the file

    on your hard disk each time it''s accessed.


    To see the inode numbers associated with your files, use the ls command

    with the -i option:


    ```

    # ls -i

    92458 CHANGES

    92459 ChangeLog

    92460 INSTALL

    92462 Makefile

    92461 NEWS

    92463 README

    92465 buffers.c

    16657 defrag-0_70_tar.gz

    92464 defrag.8

    92467 defrag.c

    92468 defrag.h

    92484 xdump

    92485 xia.c

    92486 xia.h

    ```


    You can use e2defrag with a list of inodes that should be given priority dur-

    ing the disk defrag operation. The files that these inodes refer to may

    include commonly accessed database files, the main pages of your Web

    server, and so forth.


    When you use an inode list to optimize your hard disk, the e2defrag pro-

    gram takes special care to render those files indicated the most efficient to

    access.


    To learn how to create an inode list file for e2defrag, view the manual page

    (called defrag.8) in /Part02/Execute/Defrag on the CD using these

    commands:


    ```

    $ cd /mnt/cdrom/Part02/Execute/Defrag

    $ man ./defrag.8

    ```


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_72_0.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_72_1.png)'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 8 Recover Lost Files with a Linux Undelete


    When you learned about the Linux command to delete files (rm), you probably also
    learned that Linux really deletes files. It''s not easy to recover them by simply
    marking backup disk areas as “used” again.


    Desktop interfaces like KDE have a Trash icon that you can drag and drop files
    onto. But these simply represent a separate directory where files are moved until
    the Trash is emptied. You don''t save any disk space by moving files to the Trash.
    This is much like the Windows Recycle Bin.


    The best defense against lost files is having a sound backup strategy combined
    with separating data into several partitions, when appropriate, for ease of management.
    The good news is that several tools will help save yourself from disaster when
    you''ve deleted a file that you want to use again.


    # Plan for the Future with safedelete


    If you''d like to play it safe when you delete files on Linux, install the safedelete
    package and get in the habit of using it.


    When you use the safedelete command, safedelete automatically compresses the files
    you delete and moves them to a special hidden directory, out of your way.


    If you discover that you''ve deleted a file that you need to retrieve, you can
    use the undelete command (part of the safedelete package) to retrieve the deleted
    file.


    The safedelete program keeps a log of files that you''ve deleted so that the undelete
    command can correctly locate them. The files are completely reconstructed because
    they were never actually deleted, just compressed and moved out of your way.


    Because using safedelete regularly would fill your hard disk with discarded, compressed
    files, safedelete automatically deletes some files permanently after a certain
    number of days. You can set up a configuration file in your home directory (the
    file is named .safedelerc) to specify how long'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# RECOVER LOST FILES WITH A LINUX UNDLETE


    files of different types should be saved before they are permanently deleted.


    The safedlete package is located in /Part02/Execute/Safedlete on the CD. To install
    this rpm, click its icon within a Gnome file manager window, or use a command
    like this to install all the files:


    ```

    # rpm -Uvh safedlete-1.3.10.i386.rpm

    ```


    The binaries in the safedlete package are


    +   - safedlete the main program to safely delete files

    - undelete which you can use to retrieve deleted files

    - savedch which you can use to check the log and status of all the compressed,
    safely deleted files

    - safencvt a tool to convert safedlete logs from an older version of this package


    To use the safedlete package, you must start using the safedlete command instead
    of the rm command. Files that you have previously deleted using rm are not affected
    (i.e., they cannot be deleted) by safedlete. These steps illustrate how safedlete
    works:


    +   1. Create a test file.

    - cp /etc/termcap /home/nwells/jnk

    2. Delete the test file.

    - safedlete /home/nwells/jnk

    3. Check that the file is deleted.

    - ls /home/nwells/jnk

    4. Delete the file.

    - undelete /home/nwells/jnk


    You must use the complete pathname in the undelete command. To see the files that
    have been archived by safedlete (and to see which files are to be deleted), view
    the .safedletelog in your home directory.


    > NOTE If you really want to learn more about the Linux file system and how safedlete
    operates, read the last part of the README file for safedlete. It will be located
    in /usr/share/doc/safedlete-1.3 after you have installed the safedlete rpm.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# MANAGE YOUR FILES LIKE A PRO


    The best way to use safedlete is to use an alias in your .bashrc script so that
    every time you use the rm command, safedlete is used instead. By doing this, you
    can use the commands you''re already accustomed to using in Linux and still have
    the benefits of the safedlete program. To add this, a line at the end of your
    .bashfile (or other startup file, if you''re not using the bash command shell)
    in your home directory, as follows:


    ```

    alias rm=safedlete

    ```


    Make certain that you test the functionality of safedlete on your system before
    using this alias command.


    # Retrieve Files When You Didn''t Plan Ahead


    Even if you didn''t use a tool like safedlete to store deleted files, the recover
    utility can attempt to recover your files and sometimes do a good job of it, depending
    on how much your hard disk has been used since you deleted the files.


    Linux allocates space for files via a series of pointers on the hard disk. Once
    the pointers have been deleted, the original location and contents of a file may
    be very hard to put back together.


    Files in Linux cannot be compared to a series of empty boxes that get filled up
    one by one. Instead, a file in Linux is more like a series of balls tied together
    by pieces of string. String strung all over this metaphorical file system in a
    very efficient way, but once you cut a piece of string, it''s very hard to locate
    the rest of the pieces that were previously tied together.


    Information about each file is stored in an inode (pronounced eye-node). This
    information includes when the file was created or deleted or large it is. The
    inode also points to the first part of the file''s data. By using input you provide
    about the file you want to recover, and looking at inodes that had been used but
    are no longer in use, the recover utility *sometimes* able to reconstruct a deleted
    file.


    > NOTE The recover utility automates steps described in the HOWTO document ext2fs-Undeletion,
    which is included in the directory /Part02/Pre-Reqs in case you''d like to review
    it.'
  merge: -1
  img_proc: true
- pgno: 76
