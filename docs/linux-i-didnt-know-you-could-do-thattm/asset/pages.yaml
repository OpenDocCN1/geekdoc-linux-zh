- pgno: 185
  md: '+   How many workspaces (these are like independent virtual desktops, selectable
    from the Panel) you will have, and how you want to move between them.


    +   How you will define keyboard shortcuts for dozens of common tasks, like minimizing
    a window or switching between workspaces.


    # Give KDE 2.0 a Whirl


    Red Hat, the most popular Linux product in the United States, is also the only
    one to ship Gnome as a standard installation option. And yet, I think it''s fair
    to say that KDE has a wider worldwide following than Gnome. KDE version 2.0.2
    was available at the time of this writing and includes the many great features
    that had been promised for this major upgrade to the KDE desktop. Red Hat 7 installs
    only KDE 1.1.2 by default. To upgrade, you can use a standard rpm command to install
    the KDE files located in the preview subdirectory of the Red Hat CD number 2.


    The CD in this book includes all the files you need to upgrade your Red Hat 7
    system to KDE 2. Just use the rpm files found in /Part05/Execute/KDE2.0. Follow
    these steps.


    +   1. Use the switechdesk-kde application to choose KDE as your desktop.


    +   2. Install the libmng library package. This is required by Qt 2.2.2.


    ```

    # rpm -Uvh libmng-0.9.2-1.1386.rpm

    ```


    +   3. Install the version 2.2.2 Qt libraries found on the CD. These update the
    libraries installed with Red Hat 7. Without this update, the other packages will
    not work correctly.


    ```

    # rpm -Uvh qt-2.2.2-1.1386.rpm

    ```


    +   4. Install the other packages in the directory using this command. The rpm
    command will determine the order to install the files based on their dependencies.
    These are large files, so give it a few minutes to finish.


    ```

    # rpm -Uvh k*.rpm

    ```'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'NOTE If you''re short on space, you can enter specific filenames instead of
    installing all the packages. For example, you could leave out the games, toys,
    graphics, networking, or utils the koffice package (which is quite large).


    +   5. Edit the file .xclients-default in your home directory. This tiny file
    normally points to the samtid file used for KDE 1.1.2. Change it to refer to the
    new file used by KDE 2. The exec line should read:


    ```

    exec /usr/lib/kde/bin/startkde

    ```


    +   6. Because the packages used here are intended as a preview, you can always
    return to KDE 1.1.2 by changing this line back to this:


    ```

    exec startkde

    ```


    +   7. Exit your desktop and restart it using the graphical login or the start
    command. KDE 2 will begin running.


    NOTE The first time you run KDE 2, it may take a few extra moments to start up
    as it reads all your environment information. In fact, KDE 2 always takes longer
