- pgno: 251
  md: 'Those who strive to use Linux as their desktop system for all their work may
    think that giving up Windows means giving up all multimedia capabilities with
    it. Admitted, Linux isn’t as tightly integrated with auto-launching accessories
    for every new we sound format that appears.


    However, a surprising number of Linux developers are heavily into music and video.
    The result is a nice set of audio and video programs that run on Linux. This part
    describes some of the best ones available. A few dare fare on Linux systems; others
    are new or unexpected. Programs that require KDE, Gnome, or their libraries (Qt
    or GTK+) are noted in each section.


    # 28 Make Linux Your Personal Video Player


    Thousands of video clips are available on the Web, from movie previews and promotional
    pieces to videos created by individuals. Linux has several utilities that you
    let view these video clips on-screen.


    Use Simple Linux Video Players

    There are two popular methods of playing video clips on Linux. The first method
    uses the XAnim program, which can be used either alone or with a front end for
    Gnome or KDE. XAnim itself runs on any version of Linux that uses the X Window
    System. It supports the following video formats:


    +   - MPEG video (Type I, only with no sound, and no support for Type B or Type
    P MPEG files


    +   - Quicktime animations (MOV files)


    +   - AVI animations


    +   - FLI and FLC animations


    +   - IFF animations


    +   - GIF89a animations


    +   - DL animations (formats 1, 2, and most of 3)


    +   - Amiga MovieSetter animations'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# MAKE LINUX YOUR PERSONAL VIDEO PLAYER 233


    +   ◆ Utah Raster Toolkit RLE images and animations


    +   ◆ SGI Movie format files


    NOTE MPEG is currently the most popular format for Web-based video clips.


    Xanim is included with most recent Linux distributions, including Red Hat Linux
    7. But it isn''t installed by default. To install it, use a standard rpm command
    with the file in the directory /Part07/Execute/Xanim on the CD.


    Once you have the Xanim package installed, you can immediately begin viewing movies
    in MPEG, MOV, or the other formats I just listed. I''ve included a few sample
    movies in several formats in the directory /Part07/Data on the CD. These sample
    video clips are mostly from the NASA Web site or other U.S. government Web sites
    (so they are in the public domain). You can search for others at www.nasa.gov/gallery/index.html.


    View video clips with Xanim using a command line like this from any graphical
    command line. (I''m using one of the sample video clips from the CD as the filename):


    ```

    $ xanim hurricane.mpg &

    ```


    Here we use Xanim playing an MPEG file; Xanim includes separate windows for controls
    and picture.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_252_0.png)'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# MAKE YOUR SYSTEM ENTERTAINING


    Controls for XAnim include play, pause, fast forward, reverse, and volume controls
    (though play sound from MPEG files). The controls are not highly attractive, but
    XAnim has the advantage of running on all Linux systems, with no requirements
    for additional packages or specific desktop environments. In addition, though
    not all of its features are part of the graphical interface, XAnim provides dozens
    of interesting controls for your video clips.


    The XAnim man page includes descriptions of each supported format and dozens of
    audio and video options. These include things like:


    +   - Create a colormap from a frame of video and remapping other frames to that
    frame.


    +   - Convert TrueColor animations such as AVI files (which use separate RGB color
    channels for each pixel) into a global indexed colormap.


    +   - Convert TrueColor animations to grayscale.


    +   - Adjust gamma or other color settings for the animation.


    +   - Resize animation automatically or allow the user to resize on the fly.


    +   - Define frame loops, ping-pong animation, and various frame delays while
    displaying a clip.


    You can also use a number of keys while an animation is playing in XAnim. For
    example, you can use the spacebar to pause and restart an animation, or press
    Q to quit.


    > NOTE If you don''t have sound working yet on your Linux system, skip ahead to
    Item 30 for a moment to see a few hints on Linux sound.


    Because XAnim supports many video file formats and is freely available on Linux,
    it has been used as the basis for other video players for the popular Linux desktops.
    Other developers have started with XAnim and created more attractive interfaces
    or additional features for viewing video clips within the graphical interface.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'The GXAnim program is built around the Gnome desktop and the GTK+ library.
    It relies on XnAnim as the engine to display video files. An rpm file for the
    GXAnim program is located in /Part07/Execute/GXAnim on the CD. Use a standard
    rpm command to install the package. Then launch it with a command like this:


    ```

    $ gxanim

    ```


    GXAnim is similar to XnAnim, but it has a more attractive interface designed to
    blend with your Gnome desktop. It includes a control panel and a separate window
    where the video is displayed, as shown here.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_254_0.png)


    The control panel for GXAnim includes an Open button that you can use to select
    a movie to view. Previously viewed video clips (from the current session) are
    available using the drop-down list arrow to the right of the Open field. The Next
    button plays the next video in a series of clips that you have selected for loading.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 236 MAKE YOUR SYSTEM ENTERTAINING


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_255_0.png)


    By clicking on the Prefs button in the GXAnim control panel, shown here, you open
    a dialog box where you can set up several options for playing clips. This includes
    scaling (sizing), color correction (Gamma Correct), and other settings. Most of
    these settings reflect options provided by the XAnim binary as described previously
    (see the XAnim man page). Not all XAnim capabilities are supported by the GXAnim
    program—in fact, most are not. But if you''re just playing clips you''ve downloaded
    from the Web, GXAnim makes a nice player.


    A similar package for KDE is AKtion. Like GXAnim, AKtion requires the XAnim package
    as a video engine. AKtion has a single window with both controls and video playback,
    as shown here. A full-screen mode is available as well.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_255_1.png)


    The AKtion package is located on the CD in /Part07/Execute/aKtion. Use a standard
    rpm command to install the package, then use a command like this to launch it:


    ```

    $ Aktion orprobel.mpg &

    ```


    AKtion includes a number of nice features for video playback, such as:


    +   - Full-screen playback mode'
  merge: -1
  img_proc: true
