- pgno: 389
  md: '# Use Linux as a Business Server


    When you set up a Linux system in an office environment, you may need a special
    set of tools to make it into a business server. The set might include financial
    tools, virus scanners for incoming e-mail, and software to create a fax server.
    This part describes such tools, some of which are free and some of which are commercial
    or distributed as shareware.


    # 42 Check E-Mails for Viruses


    Sadly, e-mail viruses are in the news more and more. Most viruses do not adversely
    affect Linux because they propagate as DOS/Windows programs or macros to popular
    Windows applications like Word and Excel. However, viruses are often stored on
    a Linux e-mail server before being downloaded to an unsuspecting Windows client.
    If users were careful not to open attachments that were suspicious or from unknown
    persons, the growth of viruses would decrease dramatically.


    But that''s not likely to happen. So, the tools in this section can help you check
    e-mail attachments on your local Linux system or on a Linux e-mail server before
    those attachments are downloaded and infect a client system. All the packages
    I describe are included on the CD, but they have different licenses, as I note.


    The AntiVir program from the German company H+BEDV Detentechnik GmbH, is easy
    to use and can run as part of a script to check e-mail attachments for all users
    on a Linux mail server.


    The program is in binary format. You can find the archive file containing AntiVir
    on the CD in directory /part11/Execute/AntiVir. Copy this file to a separate subdirectory
    where you can unpack its contents. Then run the install script to set up the program.
    Enter commands like:


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_389_0.png)'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'Answer Y to the query to create a symbolic link; doing so creates a link in
    the /usr/bin directory so that the antivirus program can be executed from any
    command line.


    After creating the link and installing the program, just specify the directory
    to be checked for viruses. Because the standard storage area on a Linux server
    for incoming e-mail messages is /var/spool/mail, you might use this command to
    check e-mail on your Linux mail server:


    ```

    # antivirus "/var/spool/mail/*" -s

    ```


    The quotation marks are important. By using them, the wildcard *is passed to the
    AntiVir program rather than being expanded by the shell before starting Antivirus.


    Output from AntiVir is shown on the console. You can redirect that output to a
    file using standard Unix redirections (the > or | characters). A sample output
    from a quick scan might look like this:


    ```

    # antivirus "/var/spool/mail/*" -s

    AntiVir/Linux Version 6.0.0.2, (Feb 14 2000, 15:53:57)

    Copyright(c) 1994-99 by H+BEDV Dattechnik GmbH

    ```


    ```

    Loading...

    AntiVir is running in non-key-mode.

    ```


    ```

    VDF version: 6.0.0.2 - FUP(0), created 02/14/2000

    ```


    ```

    checking drive/path (cwd): /var/spool/mail

    /var/spool/mail

    ```


    ```

    ---- scan results -----

    directories: 4

    files: 5

    infected: 0

    repaired: 0

    deleted: 0

    renamed: 0

    warnings: 0

    scan time: 00:00:08

    --------------------

    ```


    Thank you for using AntiVir


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_390_0.png)'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'Because AntiVir is run directly from the command line with simple command-line
    options, it''s easy to include AntiVir as a cron job that periodically tests all
    the mail on your Linux server. Or you could implement more complex features that
    test incoming e-mail, by using procmail or something similar.


    In the previous sample output, the line “AntiVir is running in non-key-mode” means
    you are using the free version of the program. AntiVir can be used of free for
    private use. Some features of the program, however, are not available until you
    register with the software vendor and receive a license key. Registration is still
    free; the requirement is just to provide user information to the vendor. Instructions
    for obtaining the license key via e-mail, as well as descriptions of additional
    AntiVir features, can be found in the README file after you start the file using
    the steps I listed previously. When you have a license key, you can use the following
    options:


    +   - Don''t follow symbolic links outside the current file system

    - Don''t follow any symbolic links

    - Use quiet mode (suppress verbose output)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_391_0.png)


    > **WARNING** Although AntiVir is a nice tool, be aware that McAfee, the leading
    virus-protection company, states that 250 new virus variants appear each month.
    As AntiVir is not regularly updated, you might want to consider additional protection
    for your e-mail server.


    # 43 Do Calculations in Linux


    Despite the processing power of the computer, most people, unless they already
    have a spreadsheet program open, still run for their handheld calculator when
    they need to work with figures. This section describes a few of the Linux tools
    that can turn your computer into a fancy calculator.'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'Many of these are specialized tools for financial wizards, computer science
    majors, chemists, and so forth. Being none of these myself, I''ll let you explore
    the more esoteric Gric symbols on your own.


    # Perform Financial Calculations


    A good financial calculator is a must when you don''t have a spreadsheet open
    (or if you don''t know all the right formulas). Linux can run a simple mortgage
    computation or a quantitative financial analysis of your equities.

    Mcalc is a simple but attractive mortgage calculator that prepares an amortization
    table (a schedule of payments) showing principle and each interest month. The
    schedule is to disk, but it''s also viewable on-screen.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_392_0.png)


    You can use the mcalc creates within other programs, such as a spreadsheet or
    word processor. The mcalc program is written in tcl/Tk but also has a C component,
    so you can use the standard make command to prepare the source code to run. (You
    can also run the ./mcalc program immediately after unpacking the archive.) mcalc
    is loaded on the CD at /Part11/Execute/Mcalc.


    Another mortgage-calculation tool written in tcl/Tk is mort. This program lets
    you enter additional principal payments and see the effect on your'
  merge: -1
  img_proc: true
