    # Use Graphical Configuration Tools


    Given that the number of configuration options available in the Samba server continues
    to rise, it''s fortunate that some graphical tools are available to help configure
    the server without resorting to hand editing the configuration files as I''ve
    just described. (My example, of course, was for the configuration of a very basic
    Samba server.)'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'One of these tools is GnoSamba. It''s included on the CD in the directory /Part10/Execute/GnoSamba.
    You can use a standard rpm command to install this package, but notice that the
    package name includes some capital letters (which is unusual). After the package
    is installed, start the program with the command gnosamba (all lowercase).


    After GnoSamba starts, you must choose the Open button (or File > Open) and then
    select the smb file that you want to edit using the graphical utility. The utility
    automatically starts you in the /etc/samba subdirectory. After choosing a configuration
    file, the shares contained in the file are listed in the left side of the GnoSamba
    window, under the Service list name.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_380_0.png)


    | Parameter | Value |

    | --- | --- |

    | service | Samba Server |

    | printcap | /etc/printcap |

    | local printname | yes |

    | printing | /var/samba/%m.log |

    | max log size | 0 |

    | security | |

    | socket options | TCP_NODELAY SO_RCBUF=61 |

    | dns proxy | no |


    You can insert a new share (service) or add a new parameter to an existing service
    to the global section of the configuration. All tasks can be done from the tool
    bar or by using the Edit menu.


    For example, to add a new service choose Edit > New Service and follow the directions
    in the wizard-style dialog boxes to name the new service and define its options.
    Here we see one of the dialog boxes in which default share options are set.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_380_1.png)'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# 362 CLONE WINDOWS NT


    To insert a new parameter as part of an existing service (or as of the global
    configuration parameters), choose Edit > New Parameter (or press Ctrl+I, for Insert).
    Within the Insert Parameters dialog box that appears, you can select the type
    of parameter that you want to define for categories such as Security Logging,
    Protocol, Printing, and others. You can also select from the Global, Local, or
    All tabs to see a list of available parameters.


    When you choose a parameter from the displayed list and then click on Insert,
    a new dialog box shows the possible values that you can assign to that option.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_381_0.png)


    After you set up the parameters that you want to use in GnoSamba, use these steps:


    +   1. Test the parameters you have entered by running the testparam command via
    the Options menu in GnoSamba.

    2. Save the configuration file that you have defined using the File > Write to
    Current File option (or press Ctrl+W).

    3. Restart the Samba server using the Options > Restart Samba menu item.

    4. Test the status of Samba using the smbstatus command via the Options > Run
    smbstatus menu item.


    You can now safely exit GnoSamba until the next time you want to edit your Samba
    configuration.


    For your reference, some of the command-line utilities that are included with
    the Samba packages are listed in this table. These commands are used'
  merge: -1
