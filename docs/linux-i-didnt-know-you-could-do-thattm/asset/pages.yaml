    # 5 Secure Your System against Intruders


    With more and more sites being cracked by malicious or curious intruders, you
    need to be certain that all the users on your system use passwords that can''t
    be easily cracked—thus allowing access from unauthorized users. This section describes
    several methods of protecting user passwords from attack by outsiders.


    This section also describes an encryption tool that can help you communicate with
    others in a secure manner.'
