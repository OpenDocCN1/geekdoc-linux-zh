    languages either into Apache itself or into HTML pages. These and a few other
    interesting modules are described in this section.


    > NOTE If you''re interested in XML on Apache, visit http://xml.apache.org; for
    PHP on Apache information, visit http://php.apache.org; for Perl on Apache-formation,
    visit http://perl.apache.org.


    VelociGen is a commercial product that embeds Perl or tcl scripts into an HTML
    web page. Similar OpenSource modules are also available. The first is ember. This
    OpenSource project builds on mod_perl to allow Perl code to be embedded in your
    HTML pages. You can learn more about this project by visiting http://perl.apache.org/embperl/.
    The source-code for the embperl module is included on the CD at /Part08/Source/Apache_modules.


    > NOTE To explore a fascinating list of downloadable modules for Apache, visit
