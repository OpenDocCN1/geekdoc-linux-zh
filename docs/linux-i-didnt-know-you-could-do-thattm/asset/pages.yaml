- pgno: 409
  md: 'The pessimists say that there are two types of people: those who have a hard-disk
    failure and those who will have a hard-disk failure. Now that your Linux system
    is loaded down with new toys and utilities, I hope you''ve thought about how to
    protect it from the inevitable disaster that will strike your PC.


    This part describes some tools and procedures that safeguard the valuable information
    on your Linux system, and it covers some basics about backing up your system and
    creating a rescue disk. It also describes some of the more advanced disaster-proofing
    tools, such as how to set up software RAID (redundant hard disks) and connect
    an uninterruptible power supply-to your Linux system.


    If you''re an experienced system administrator, you may note the folly of the
    term disaster-proof. Even so, the more preparations you make, the more trouble
    you can withstand; you will be the hero instead of the scapegoat.


    # 46 Back Up Critical Files


    Backing up a computer system is like buying insurance: no one wants to bother
    with it, but everyone eventually regrets it they don''t. Many full-featured backup
    utilities are available for Linux; some are even included with popular Linux distributions.


    The best backup utilities let you


    +   * Backup up remote systems from a single location

    * Backup up data to devices (such as CD writers or tape drives) located anywhere-on
    your network

    * Configure incremental backups (on only new or modified files) and full backups
    at specific time intervals

    * Help you track the physical backup media in case you need to restore something

    * Allow you to restore only certain files, based on multiple criteria

    * Perform functions in an intuitive (perhaps graphical) environment'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# NOTE the latest Linux kernel, 2.4, includes better support for USB (Universal
    Serial Bus) and many other peripherals. But of course it takes a while for each
    major new release (like 2.4) to become widely deployed.


    Be certain to check the hardware-compatibility list on your Linux vendor''s Web
    site before purchasing a backup device such as a tape drive or writable CD drive.
    Linux doesn''t support all devices; for example, some Universal Serial Bus (USB)
    devices and Winmodems are particularly difficult to use with Linux.


    Once you get a backup device configured, some of the commercial backup tools you
    use on Linux include


    +   - Arkeia, a centralized backup, restore, and archiving solution for heterogeneous
    networks (see www.knox-software.com)


    +   - BRU Backup and Restore Utility (see www.unitrends.com)


    +   - Ctar, a powerful commercial backup program (see www.unitrends.com)

    - Lone-Tar, a tape-backup software package from Lone Star (see www.cactus.com)


    Fortunately, you can try some of these commercial products before deciding if
    you want to use them long-term. I''m not permitted to redistribute these files
    on the CD, but Knox Software provides a complete set of downloadable files for
    the Arkeia product. Multiple Linux versions are provided, based on your distribution.
    Visit the Knox Software URL given to download these files.


    Arkeia is available in both a Professional version, which you can download for
    a free 30-day trial, and a free version, which you can continue to use for personal
    or commercial use. Standard rpm files for Red Hat 7 are provided. See the license
    information on the Web site for complete details about how you can use this program.


    Arkeia provides a true client/server interface for system backup and restore operations.
    You''ll see separate files to download on the Knox SoftWare Web site for the following
    components:


    +   - The client, used on every system that will be backed up


    +   - The command-line interface to control Arkeia


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_410_0.png)'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# 392 DISASTER-PROOF YOUR SYSTEM


    +   * The graphical interface to control Arke

    * The Arke server


    Some of the features of Arke include:


    +   * Arke supports up to 200 clients backing up on the Arke server simultaneously.
    Network throughput is maintained by balancing faster and slower clients, all while
    maintaining a single control process rather than a server process for each client.

    * You can choose client-side parallel processing of backup operations to provide
    the fastest backup times. This is especially useful when you have a large system
    that requires regular backups (such as nightly).

    * You can choose concurrent backup and restore operations. When you have multiple
    storage devices, Arke allows you to use an inactive device for a backup or restore,
    even when other devices are being used at the same time for another operation.
    For example, you could be in the middle of a large backup but still have Arke
    restore a lost file using an available CD or tape device.

    * Time-based file selection allows users to select a file to restore based on
    its filename and last revision date. Files can then be restored to their original
    location or to a new location.


    Another commercial backup solution for Linux that provides a free 30-day trial
    download is BRU (Backup and Restore Utility) from EST Software. You can download
    the BRU package at www.estinc.com. Note that you must register before you can
    download the files.


    BRU is available for Linux on Intel, PowerPC, and SPARC hardware. The downloadable
    BRU files are not in standard rpm format; you''ll need to use the tar command
    to unpack the archive, which will create a brulifes directory. Within this directory,
    go to the x86-linux-glibc2.1 subdirectory (or a similarly named directory if you
    downloaded BRU for a different platform) and execute the installbru file that
    you find there.


    When installbru executes (which can be in text or graphics mode, depending on
    your choice), you are asked several simple questions about'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'where BRU files should be installed (the defaults should work fine on Red Hat
    7) and how to configure the devices you want to use for system backups. Just follow
