- pgno: 139
  md: '# 120 SPICE UP YOUR DESKTOP


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_139_0.png)


    When you''re ready for more advanced financial management than Gnofin provides,
    CBB. CBB is a scripted program (written in Tcl/Tk and Perl) that manages your
    personal finances, much like Quicken does. CBB is not tied specifically to Gnome
    or KDE, but it''s much more complete than Gnofin. It also imports Quicken data
    files as Gnofin does.


    CBB is located in /Part04/Execute/Cbb on the CD. Although CBB is a scripted program,
    you still use the rpm command to install it. Note, however, that CBB requires
    the gnu-plot package, which is not installed by default with the workstation installation
    described in the introduction to this book. The gnu-plot package is included on
    the CD in the directory /Part04/Pre-req. Use these commands to get CBB up and
    running:


    ```

    # rpm -Uvh /mnt/cdrom/Part04/Pre-reqs/gnu-plot-3.7.1-

    12.i386.rpm

    # rpm -Uvh /mnt/cdrom/Part04/Execute/Cbb/cbb-0_8_1-

    5Smdk_noarch.rpm

    # cbb

    ```


    > WARNING The CBB rpm provided with Red Hat 7 on the Power Tools CD does not work
    correctly. It generates errors and will not even open. Use the file described
    above instead.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'CBB is a full-featured finance program that supports actions like:


    +   * Memorized transactions

    * Balloon field help

    * Default category lists

    * Split transactions

    * A set of reports and graphs

    * Cryptography

    * Import and export of Quicken QIF format files

    * Auto-launching calendar and calculator tools (from the External)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_140_0.png)


    Another program for tracking your finances is called emma. I think of emma as
    being aimed more at a business user, because it focuses on multiple accounts and
    transactions that move between accounts, much like a general ledger for a business
    does.


    You can find em on the CD in the directory/Part04/Execute/Emma. No rpm is provided
    for this program; just execute the binary file in that directory.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# 122 SPICE UP YOUR DESKTOP


    The emma program uses an account-based transaction model for financial records.
    The main screen of em shown here has a few sample accounts entered and a new transaction
    in progress. Each transaction consists of transferring money from one account
    to another. Different accounts have default settings for positive and negative
    amounts; accounts can also have limits assigned to them.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_141_0.png)


    A few basic types of reports and a text export feature are provided in emma, as
    well as a few Preference settings (via the File menu).


    # Track Your Business Contacts


    For businesspeople or home users who want to track contacts or friends on their
    KDE desktops, PeopleSpace provides an easy-to-use specialized database. PeopleSpace
    keeps track of names, addresses, and up to eight contact methods (fax, mobile,
    pager, e-mail, etc.) in a simple on-screen form.


    > NOTE PeopleSpace is a useful tool, but it is no longer being maintained. It
    is included here because I haven''t found anything else similar to replace it.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The PeopleSpace program is located in /Part04/Execute /PeopleSpace on the CD.
    When you start the program, a Wizard walks you through the initial configuration
    of the database.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_142_0.png)


    As you enter new data for people whom you want to record information about, you
    scroll between all the records with the left and right arrow buttons on the toolbar.
    Several types of additional notes and comments can be stored for each person.
    You can then search the database for people matching various criteria, such as
    name, company, city, or last meeting'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 124 SPICE UP YOUR DESKTOP


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_143_0.png)


    Separate lists of personal and business contacts can be created, or multiple databases
    can be used. The configuration established by the Startup Wizard will be updated
    at any time by choosing Edit ➤ Preferences.


    # Manage Multiple File Downloads


    When you''re busy working on your computer, managing large or multiple downloads
    can really interrupt your workflow. Transfer Manager can take care of that for
    you. By using Transfer Manager, you can download multiple files without opening
    a separate browser window for each one and without returning to a browser window
    repeatedly to click on the next file in a series that you want to download.


    The Gnome Transfer Manager program is located in /Part04/TransferManager on the
    CD. You must also install the wget package before using Transfer Manager. Wget
    is included in the /Part04/Pre-reqs directory on the CD. (Wget is not installed
    as a standard of Red Hat 7 work-installation.) Use these commands to get started:


    ```

    # rpm -Uvh /mnt/cdrom/Part04/Pre-reqs/wget-1.5.3-10.i386.rpm

    # rpm -Uvh /mnt/cdrom/Part04/Execute/TransferManager/gtm-0_4_5-2_i386.rpm

    # gtm

    ```


    To use the Gnome Transfer Manager, click the New button in the toolbar (or choose
    File ➤ New) and enter the URL that you want to download.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_143_1.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Include the designation http://, ftp://,etc. to indicate whether it is a Web
    page, etc. A default directory for the downloaded file is shown, which you can
    change if needed.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_144_0.png)


    NOTE After installing the rpm, you can launch this program from the Gnome menus
    using Programs ➤ Internet ➤ Gnome Transfer Manager.


    The Transfer Manager then starts the download. Click the New button repeatedly
    to enter a list of downloads that you want to occur at the same time. Once they
    are all going, you can select any of your current downloads from the list in the
    main window. The status of download is shown by the information on the right side
    of the screen.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_144_1.png)'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'The status information is refreshed once per second. (You can set the refresh
    rate under Settings > Preferences.) As the download progresses, the fields shown
    for each file include:


    +   * The status of the download (active, stalled, etc.)


    +   * The number of bytes retrieved and the total size of the download


    +   * The amount of time used so far and the estimated time to complete the download


    +   * The session speed


    Transfer Manager includes a Preferences dialog box with seven tabs full of options.
    (Choose Settings > Preferences to view the dialog box). Using Preferences, you
    can select which network interface to use for downloads (such as the modem, cua0,
    or the Ethernet card, eth0). You can also specify a default directory for all
    downloads (though each download can have a different directory specified) and
    use a proxy server for both HTTP and FTP downloads.


    # Create Custom Web Searches


    Another task that sometimes interrupts your workflow is searching for something
    on the Web. You may have to repeatedly click on links and try new sites and wait
    for new pages to download.


    The AQSS utility automates a simple Web search so you can do other work until
    the search results have been gathered. This utility is located in /Part04/Execute/AQSS
    on the CD.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_145_0.png)'
  merge: -1
  img_proc: true
