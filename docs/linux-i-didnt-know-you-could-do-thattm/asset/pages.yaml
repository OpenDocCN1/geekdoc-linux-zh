    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_414_0.png)


    Another powerful backup tool that has many features but no graphical interface
    is Amanda. The tool consists of a base, a client, and a server package-Amanda.
    All three are available on the CD in the directory /Part12/Execute/Amanda. You
