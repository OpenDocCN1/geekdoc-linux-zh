- pgno: 302
  md: 'Apache modules are available to authenticate users connecting to your Web server
    via several mechanisms, such as NIS and Samba. This section describes some of
    these modules, most of which are included on the CD.


    When using authentication systems, it''s very important to remember that a standard
    connection between a Web server and a browser is encrypted. If you use the authentication
    modules listed here to exchange authentication information, you should probably
    use a secure Web server so that all exchanges (such as username and password information)
    are encrypted. The Strong version ofApache is a commercial product with encryption.
    You can also use a free version of Apache that includes Secure Socket Layer (SSL)
    support. Visit www.apache-ssl1.org to download the server. Because of United States
    restrictions, all downloads and mirrors for this program are located outside the
