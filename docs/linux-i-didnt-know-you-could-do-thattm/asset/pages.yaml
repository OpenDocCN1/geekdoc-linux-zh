    # Search Your Web Pages


    The grep command is a powerful tool for locating patterns within your files. It
    includes dozens of options and can operate on entire directories at one time,
    printing result pattern matches to the screen.


    Webgrep is a similar tool designed to work within the HTML Web pages. The rpm
    package for Webgrep is located on the CD in /Part08/Execute/Webgrep. You can use
    a standard rpm command to install it.


    The Webgrep package consists of eight utilities designed to help you work with
    pages on the Web. Each utility includes a man page where you can learn in detail
    how to use it. All of the utilities are available immediately from the command
    line after you have installed thegrep package. The utilities are summarized here:


    ```

    blinkcheck checks pages on your local server for broken links. it checks only
    relative file links within the pages on your own server, so it doesn''t require
    Internet access.

    ```


    ```

    hrefgrep prints a formatted list of the href= tags in those Web pages that you
    ask to search.

    ```


    ```

    htmlpp processes an HTML file to remove all the line breaks within tags such as
    href=, src, background= etc. This allows other lineoriented utilities like grep,
    sed, and awk to be much more effective. This program doesn''t edit the file, but
    writes all its output to STDOUT.

    ```'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'httpcheck determines if the URL you give it exists by issuing an HTTP HEAD
    call to URL. This provides a very quick check without downloading any of the pages
    in question. This is a great program for checking whether or not pages on other
    servers that you refer to exist.


    lshtmf lists all of the files referenced as relative links within a set of HTML
    pages. The output of this command is very useful for creating a tar file containing
    all the pages used on a Web server.


    taggrep accepts an HTML tag and HTML file set as parameters, then returns a list
    of all occurrences of the given tag within the HTML files.


    srcgrep determines which images are included in a Web page. It prints a formatted
    list of the in= and background= tags that are included in the Web pages that you
    ask to search.


    webgrep is a very basic search engine designed to be added to your Web site. It
    allows visitors to search all of your Web pages without the overhead of something
    like httpd or another tool that is suitable for larger sites. Thegrep program
    uses memory-mapped files and is great for Web sites containing up to about 1MB
    of HTML pages.


    # Remove Unwanted Cookies


    If you browse the Web a lot, chances are that you have a lot of cookies, or tokens,
    stored in your home directory by Web sites that want to track your movements in
    one way or another. Some of these are necessary, of course, if you want to interact
    with sites where you have personalized accounts. But many others feel more like
    a nuisance or even an invasion of your privacy.


    The cookiecutter Script, located on the CD in /Part08/Execute/Cookiecutter, will
    help you remove unwanted cookies from your Netscape configuration.


    To use this program, copy the compressed archive on the CD to your home directory
    and untar it using this command:


    ```

    $ tar xvzf cookiecutter-0.1.1.tgz

    ```'
