- pgno: 192
  md: '# Run Office Suites on Linux


    Many of the other enhancements that make up KDE are applications that you''ll
    find on the various submenus of KDE. In fact, many of the applications that were
    mentioned in the first edition of this book have now been included in the default
    KDE 2 system. (So I''ve added a bunch of new programs to this edition!) Explore
    the menus and see what you can find.


    The rumor for years now has been that Microsoft has a team working on Microsoft
    Office for Linux. Maybe that made for good press during all the Microsoft antitrust
    lawsuits with the U.S. government. But while we''re waiting for MS Office for
    Linux to materialize, Linux has its own collection of very good office suites
    that are available today. Most are commercial; one is free. All of them include
    some level of ability to exchange files with Microsoft Office.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_192_0.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'The real benefit for many users who consider adopting one of these office suites
    is their cross-platform nature. For example, you can run the same office suite,
    with identical file formats and user interface on Linux, several UNIX platforms,
    and Windows. This is a great solution for offices where different users prefer
    different platforms.


    # Use a UNIX Standard: ApplixWare


    The ApplixWare suite has been around in the UNIX world for years. A few years
    ago, a Linux version was developed and distributed in demonstration form for free
    via download. More recently, the Linux division of the Applix Ware suite has been
    split off into a separate company called VistaSource. Now the office suite for
    Linux is a commercial product, just as it is for all the other platforms that
    they support.


    VistaSource supports several Open Source projects for Linux enthusiasts, but they
    are of interest mainly to software developers. Their high-quality end-user products
    are only available commercially. VistaSource actually sells two Linux office suites:
    ApplixWare Office, which is based on their long-popular ApplixWare product, and
    AnywhereOffice, which attempts to mimic the look and feel of Microsoft Office,
    including the ability to work in Microsoft file formats. Both office suites include
    the following components:


    +   * Word processor

    * Spreadsheet

    * Presentation graphics

    * E-mail Client

    * HTML authoring


    Because these products are commercial software, they are not included on the CD.
    You can find more information about them on the Web site www.vistasource.com.
    The latest release of Applixware Office 5 for Linux includes features like:


    +   * Dockable toolbars

    * Integration with Gnome Themes

    * The ability to Open, Save, Save As, Import and Export from a single dialog box

    * A graphical font installer'
  merge: -1
  img_proc: true
