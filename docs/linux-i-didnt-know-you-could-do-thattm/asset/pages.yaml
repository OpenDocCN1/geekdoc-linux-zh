- pgno: 382
  md: 'by the GnoSamba program, but you can also use them yourself as needed. See
    the main page for each to learn more.


    | Samba Utility | Description |

    |---|---|n| addtosmbpass | Adds a username to the smb password file (follow this
    by using the smbpasswd command to set a password for the user). |

    | nmblookup | Queries for information about a server name using the NetBIOS protocol.
    |

    | smbadadduser | Creates an association between a Linux user and a user listed
    in the smbpasswd file (an SMB user); this utility affects the smusers file and
    is for use with mapping features. |

    | smprint | Submits a print job to a print queue located on an SMB server. |

    | smbtar | Similar to Linux tar; backups and restores Windows directories to a
    Linux file (or tape archive). |

    | testparm | Examines the contents of the smb.conf configuration file, providing
    messages for erroneous or potentially error-causing configuration items. |

    | smbstatus | Shows all SMB client connections (when the Linux system is acting
    as an SMB server). |


    Although GnoSamba is a useful tool for configuring your Samba server, it''s not
    the one recommended by the developers. Because Samba is in continual development,
    graphical tools like GnoSamba are always in danger of being behind relative to
    the latest features. While this isn''t a problem for some servers, the advent
    of new security fixes and the difficulty of tracking changes in your graphical
    configuration tool make it a potential hazard for many system administrators.


    In addition, if you use something like GnoSamba, you must rely on the development
    efforts of a second team, rather than those of just the Samba team, to keep up
    to date. The Samba team is large, very well funded, and is


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_382_0.png)'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# 364 CLONE WINDOWS NT


    always sending out new releases and bug fixes. That''s not true of the hard-working
    GnoSamba developer.


    Anyway, the Samba team prefers that you use the SWAT configuration tool. SWAT
    is a browser-based tool that ties directly to the Samba server. Thus, if any new
    features are added to Samba, they are automatically included in the SWAT configuration
    tool. SWAT also provides access to virtually all Samba options, rather than just
    those some other developers deemed worthy of inclusion in a graphical interface.
    (Don''t worry, this is done in a way that won''t overwhelm you with 500 options
    on Web page.)


    Finally, SWAT can be used remotely from any Web browser. The catch is that the
    password you use for SWAT—the root password of your Linux system—is passed in
    the clear over the Web, so SWAT is only really recommended for use from the local
    host (the same machine that Samba is running on).


    Setting up SWAT requires a little preparation, especially since I''m assuming
    that you''ve used the Workstation installation in Red Hat 7. SWAT uses the xinetd
    super-server daemon. The idea behind this server (which is also used for FTP,
    telnet, and many other services) is to have a single server watch for network
    connections and then start the server to handle the connection, rather than have
    50 different servers all running to wait for connections that rarely occur.


    So you must do the following to use SWAT:


    +   1. Install the xinetd package.


    +   2. Configure xinetd to watch for SWAT connections.


    +   3. Restart the servers to use the updated configuration files.


    +   4. Fix what I consider a bug in the /etc/hosts file so that network connections
    function correctly.


    +   5. Start your Web browser and log into the SWAT configuration page.


    Let take these one at a time.


    The xinetd server is a newer version of the standard inetd program that Linux
    has used for years. The xinetd version has the advantage within Red Hat 7 of being
    configurable in ways the older inetd-style configuration file was not. To install
    xinetd, use a standard rpm command with the xinetd package found on the CD in
    the directory /Part10/Execute/Xinetd.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_383_0.png)'
  merge: -1
  img_proc: true
- pgno: 384
  md: "# CLONE A WINDOWS NT SERVER LINUX\n\n> NOTE The SWAT program itself, located\
    \ in /usr/sbin, is installed as part of the Samba server package.\n\nNext, you\
    \ must edit the configuration file for SWAT within the /etc/xinetd.d subdirectory.\
    \ Open the file /etc/xinetd.d/swat in any text editor. The non-comment lines of\
    \ this file are shown here for reference.\n\n```\nservice swat\n{\n    port =\
    \ 901\nsocket_type = stream\nwait = no\nonly_from = localhost\nuser = root\nserver\
    \ = /usr/sbin/swat\nlog_on_failure += USERID\ndisable = yes\n}\n```\n\nBefore\
    \ using SWAT, you must change the last line from disable=yes to disable=no. This\
    \ causes the xinetd program to actually start the server that is listed in the\
    \ configuration file (/usr/sbin/swat) when a connection on port 901 is detected.\n\
    \nAfter changing the xinetd configuration, you get xinetd to reread its configuration\
    \ data. The easiest way to do this is by using this command:\n\n```\n# /etc/rc.d/init.d/xinetd\
    \ restart\n```\n\nThe Samba server should not be restarted, because it has no\
    \ direct relation to the xinetd configuration—xinetd just starts up the swat program\
    \ to manage the smb.conf configuration file.\n\nA final step before using SWAT\
    \ is to fix a possible networking bug in Red Hat Linux 7. Because you installed\
    \ a Workstation version of Red Hat Linux 7, your /etc/hosts file may not contain\
    \ a correct address for the localhost name. This is important for SWAT, as you\
    \ can see in the above listing, SWAT is configured for use only from localhost.\
    \ So if the localhost name is not correctly resolved, SWAT will not function.\
    \ The easiest way to\n\n![](img/35c1af90d4f3af9cd7cfd006c6b752f5_384_0.png)"
  merge: -1
  img_proc: true
- pgno: 385
  md: "# 366 CLONE WINDOWS NT\n\nresolve this is to make certain that the first line\
    \ of your /etc/hosts file\nlooks like this:\n\n127.0.0.1 localhost\n\nThen test\
    \ networking using this command:\n\n```\n# ping localhost\n```\n\nIf you see ping\
    \ working, and the lines that appear on screen contain local-host (127.0.0.1),\
    \ then SWAT should be able to correctly resolve the\nhost name as well. Now you're\
    \ ready to launch your Web browser and\nuse SWAT to configure Samba.\n\nLaunch\
    \ your browser using the button on the Panel of Gnome or KDE, or\nusing a command-line\
    \ interface. I'll be using Netscape, but any browser\nsupporting frames and forms\
    \ will work.\n\nWithin your browser, go to this address: http://localhost:901/.\
    \ You are\nprompt for a username and password. You must enter root and the\npassword\
    \ for your Linux system (hence, you see the dangers of doing this\nover the Internet).\
    \ The SWAT program then begins responding to your\nrequests, and the main SWAT\
    \ configuration page is displayed.\n\n![](img/35c1af90d4f3af9cd7cfd006c6b752f5_385_0.png)\n\
    \nWelcome to SWAT!\n\nPlease choose a configuration using one of the above buttons\n\
    \nDocumentation\n\n+   - Domains\n  - smbd - the SMB daemon\n  - winbind - the\
    \ NetBIOS nameserver\n- Administrator Settings\n  - smbd.conf - monitoring Samba\n\
    \  - smb.conf - configuration file\n  - password - managing SMB passwords\n  -\
    \ make_sambd - codepage creation\n\nThe links that fill the initial SWAT page\
    \ let you access documentation,\nreview the actual configuration file contents,\
    \ and use other Samba utilities"
  merge: -1
