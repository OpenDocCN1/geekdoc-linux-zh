  md: '# 346 CLONE WINDOWS NT


    Password:

    security=share

    smb: \\>


    The format for the server name and share name is the SMB standard that begins
    with two forward slashes, then one slash separating the server name and share
    name. If you see the prompt above (smb: \>), you have successfully connected to
    the remote SMB server. The smbclient utility has an interface that combines commands
    from the command-line FTP client and a standard Linux shell. This table shows
    several of the most commonly used commands. Once you''re logged in, you can try
    some of the commands to download and upload files or just to examine the server.


    | Command | Description |

    | help | Prints a list of all smbclient commands. |

    | help command | Prints one line description of how to use the given command.
    |

    | ls | Lists the files in the current directory on the remote server. |

    | get filename | Downloads a file from the remote server, copying it to your current
    working directory. |

    | put filename | Uploads a file to the current remote directory (this requires
    permission to write files on the remote server). |

    | mget pattern | Multiple get; downloads multiple files using a regular expression
    (pattern to match against files). |

    | mput pattern | Multiple put; uploads multiple files using a regular expression.
    |

    | prompt | Turns on or off when mput or mget is used. |

    | recurse | Turns on or off directory recursion (go into subdirectories) for mput
    and mget. |'
