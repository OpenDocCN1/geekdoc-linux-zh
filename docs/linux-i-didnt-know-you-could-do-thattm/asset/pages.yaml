- pgno: 366
  md: '# ACCESS WINDOWS NT SERVERS FROM LINUX


    | Command | Description |

    |---|---|n| !command | Executes a Linux command on the local system while in the
    smbclient interface (for example, use !pwd to see your Linux working directory).
    |

    | exit | the smbclient utility. |


    In addition to these basic commands, many common Linux commands work in smbclient.
    For example, the commands mkdir and rdir, rm, and del are all supported.


    > NOTE To use commands like mkdir and rm, you must have permission to create and
    update files on the remote server.


    The smbclient utility is a great tool for connecting to remote SMB servers, including
    Windows NT servers, but it isn''t very tightly integrated with other work that
    you might be doing in Linux. Also, many people prefer to manage their file systems
    graphically, and smbclient falls short there. The best remedy for this is to mount
    the SMB servers as described in the next section.


    # Integrate SMB into Your Linux File System


    Using the smbmount command you can completely integrate an SMB server with your
    Linux file system.

    If you''ve used the mount command before, you know that it makes another file
    system behave like part of your root file system. For example, when you use this
    command


    ```

    # mount /mnt/cdrom

    ```


    you can go to the /mnt/cdrom directory and access the contents of your CD-ROM
    drive as if it were just another subdirectory, when actually it is located on
    a separate device. This is how the Linux file system is designed.'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'More complete mount commands are sometimes required, depending on how your
    system is set up. For example, you might access a remote NFS file server using
    a command like this:


    ```

    # mount -t nfs sundance:/home/nwells /mnt/sundance

    ```


    This command indicates the type of the remote file system (NFS), the remote server
    and path, and the local path to use as a mount point (an access point). Of course,
    you must have permission to access the sundance server via NFS for this command
    to work as expected.


    NFS works well for sharing files across UNIX systems; since the Samba suite is
    available on so many platforms, SMB is a good solution for almost all file-sharing
    across platforms. The Samba suite of utilities includes a package called smbfs,
    for the SMB file system. Using this package, you can mount SMB file systems just
    as you do mount NFS file systems or local file system devices (like CD-ROM devices).


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_367_0.png)


    > NOTE The utilities for smbfs are installed by default on Red Hat 7 or when you
    install the samba-common and samba-client packages described previously. Some
    non-Red Hat systems may require you to load a kernel module. Use the command insmod
    smbfs.


    The special SMB mounting command is called smbmount. This command is similar to
    the smbclient command, but it may require additional parameters. The general format
    of the command looks like this:


    ```

    $ smbmount //servername/sharename /mnt/point -U username

    ```


    In the following example, the share on the server named sundance is mounted to
    the local directory /mnt/sundance. This is done with the permissions of the user
    nwells, whose password must be entered as prompted.


    ```

    $ smbmount //sundance/c /mnt/sundance -U nwells

    ```


    Password:


    As smbclient, enter the password for your account on the SMB server. If this command
    is successful, you can use the cd command to go to the mount point that you specified
    (/mnt/sundance in the example) and begin accessing the remote SMB file system
    as if it were part of your local file system.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# ACCESS WINDOWS NT SERVERS FROM LINUX 349


    Because the remote SMB server is now part of the directory structure, all of your
    standard file management tools can be used on your Windows shares. Two caveats
    are these:


    +   - You can only perform tasks that your Windows account permissions grant you.
    For example, the administrator of the SMB (Windows) server may not allow you to
    create new files, delete new files.

    - You can only perform tasks that Windows file systems (as mapped by the SMB server
    and client) allow. For example, you can''t set UNIX file permissions; SMB servers
    do not use the same system as UNIX.


    In some cases, additional parameters may be required to make smbmound (or even
    smbcient) function properly. For example, you may see a message that, "hostname
    too long as a netbios name." In this case, you can add your client''s hostname
    to the command as this example shows:


    ```

    $ smbmount //sundance/c /mnt/sundance -U nell -c bright

    ```


    The next figure shows a file manager in KDE 2 with a Windows file server mounted
    in the /mnt/sundance directory, as in the examples here. You can probably recognize,
    from all of the .INI and .EXE files, that this structure belongs to a standard
    Windows system. Using this interface, you can drag and drop files between Windows
    and all other local or mounted file systems (such as NFS or FTP file systems).


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_368_0.png)'
