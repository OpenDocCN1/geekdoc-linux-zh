    Once BRU is installed, you can also install the optional graphical interface to
    it. Go to the xbru subdirectory of the brufiles directory created when you unpacked
    the archive. In that subdirectory, execute the installX command and answer the
    questions that appear where to install the program (again, the defaults that appear
