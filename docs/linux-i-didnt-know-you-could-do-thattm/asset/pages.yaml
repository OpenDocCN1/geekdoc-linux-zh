- pgno: 307
  md: '# Make Apache a Proxy Server


    A proxy server provides security for Web requests leaving your network. Rather
    than have every person on your local network actually connect to Web servers all
    over the world, they can connect to a proxy server, which receives their requests
    and forwards each one as if it came from the proxy server. When a response arrives,
    the proxy server returns the information to the client browser.


    Using a proxy server provides several advantages over having everyone on your
    network connect directly to outside Web sites:


    +   - The proxy server can cache frequently accessed pages, saving network bandwidth
    when many people access the same sites regularly.


    +   - The proxy server can be configured to block access to certain external sites
    or restrict access by certain users on the local network. All access can be blocked
    at certain times without adjusting each person''s PC configuration.


    +   - Users inside your network have a harder time creating inadvertent security
    holes because they are connecting to an internal server—rather than an external
    Web server.


    +   - Outgoing network bandwidth is managed from a single location.


    With all of these advantages, many organizations use a proxy server to allow employees
    to browse the Web. One of the most popular proxy-server programs is Squid.


    The Squid proxy server is highly configurable. Because it provides services for
    outgoing Web requests, it is sometimes run on a computer separate from the Apache
    server that handles incoming Web requests. This isn''t necessary, but it can make
    security a little easier to manage. Squid is included in the CD in /Part08/Execute/Squid.


    Apache itself, however, can also be used as a full-featured proxy server. While
    it may seem strange at first, Apache can serve Web pages for your'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'organization at the same time it retrieves Web pages for browsers on your network.
    How does this work?


    If you use a feature Apache called mod_proxy, you can configure the browsers in
    your organization to point to the Apache server as a proxy for HTTP requests.
    When a request arrives at the Apache server that is marked as proxy Apache forwards
    the request on to another Web server (after checking that your configuration allows
    access). When the reply comes back from the remote Web server, Apache returns
    the document to the browser as if it came from the internal Web server.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_308_0.png)


    > NOTE A proxy server is only one of several methods for managing multiple users
    on a network accessing the Internet. Lower-level processes such as IP masquerading
    as discussed in Part 9.


    The mod_proxy module is not installed by default when you use Apache but it is
    included with the standard package of Apache source-code, so you can recompile
    Apache and begin using mod_proxy immediately. The module is located in the Apache
    source-code tree (after you install the Apache source package) in the directory
    src/modules/proxy.


    Why use a combined Web server and proxy server with Apache? A few good reasons
    are:


    +   * When you are confident about your skills in setting up Apache configuration,
    it''s much easier to maintain one program than two.


    +   * Security concerns are reduced by your only needing to track updates for
    one program.


    +   * Squid is popular and proven, but Apache still has a larger user base it
    and more more developers working on it, and it''s probably a more stable program.


    Once you have mod_proxy set up on your Apache server (or loaded using a LoadModule
    directive if it''s a DSO module), you can enable it with a single Apache configuration
    directive in httpd.conf:


    ```

    ProxyRequests on

    ```'
  merge: -1
  img_proc: true
