    # Add New Authentication Options to Apache


    Apache includes several authentication systems for verifying the identity of a
    user who wants to download a file from your Web server. These include the standard
    method of using a special file of usernames and passwords that have been especially
    created for use with Apache and your Web pages.


    Many times, however, you have other authentication systems that you want to merge
    with your Web server, making access to Web pages contingent upon a user''s other
    accounts or access on your network.'
