- pgno: 431
  md: 'The following Internet resources are great places to look for updates and new
    programs for Linux:


    | Internet Site | Description |

    | --- | --- |

    | www.linuxberg.com | A huge site (mirrored worldwide) with categories and ratings
    for each Linux package. Intended for those desiring more stable programs. Choose
    your region from the home page, then search for programs by name or category.
    |

    | http://freshmeat.net | The place where all Linux-oriented developers announce
    new releases of their programs. Use the search function to find a specific package.
    Best for the latest release, which is not always the most stable (though you can
    usually find those as well). |

    | ftp://ftp.ibiblio.org or www.ibiblio.org | Probably the largest FTP site in
    the world, with many mirrors. Start with the /pub/Linux directory. |

    | www.redhat.com/mirrors.html | A list of sites that mirror the Red Hat archives,
    which are often too busy to be accessed directly. The core Red Hat files, updates,
    and contributed files are listed separately. |

    | www.kde.org | Use the Applications link in the Download section of the KDE Web
    site to see tables of the latest KDE applications with links to the downloadable
    packages. |

    | www.gnome.org | The home page of the Gnome Desktop. Try the Get More Software
    link under the Tasks section of the main page. |

    | www.linuxapps.com | A catalog of Linux applications with descriptions, helpful
    icons, and a search function. |

    | smartwatch.zdnet.com | A searchable archive of Linux software that often has
    very recent stable packages. Software is generally available in several formats
    including RPM. |

    | http://SAL.KachiTech.com/index.shtml | Scientific Applications on Linux. A collection
    of esoteric stuff for mathematicians, chemists, computer scientists, and others.
    Sections for database, graphics, and programming tools are also included. |'
  merge: -1
  img_proc: true
- pgno: 432
  md: '| Internet Site | Description |

    | --- | --- |

    | www.kernel.org | Master archive site for the latest Linux kernel updates, with
    news items and commentary. |

    | www.linuxhq.com | Information on the latest Linux kernel updates as well as
    documentation and other resources. |

    | www.slashdot.org | This isn''t a download site, but you should know about if
    you''re going to be a Linux fan. Read news items or use the search feature to
    locate specific package information. |

    | www.linuxjournal.com | The key printed periodical for Linux, with an index to
    articles and additional online resources. |

    | sourceforge.net | A site where developers of free software can have their own
    homepage, and users wanting to locate that software can contact the authors. A
    great place to learn about free software projects and their authors. Many popular
    projects have home pages and storage at SourceForge. |

    | www.linxtoday.com | A Linux-focused news site, with daily posting and a weekly
    summary available. Great for up-to-the-minute details from hundreds of Linux contributors
    and commercial vendors. |

    | www.linuxworld.com | Probably the premier online publication for Linux. Focused
    on business uses of Linux, but with an eye toward supporting the Open Source community.
    Part of the ITworld.com Web site. |

    | www.linuxmall.com | A Linux-focused online store with Linux distributions, applications,
    books, etc. |

    | www.apache.org | The home page of the most popular and well-known Linux application,
    the Apache Web server. Includes documentation, support, and download links, plus
    related sites for modules, Perl on Apache, etc. (See also the www.apacheweek.com
    online magazine for Apache users.) |'
