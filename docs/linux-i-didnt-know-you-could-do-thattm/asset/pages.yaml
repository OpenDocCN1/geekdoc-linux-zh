- pgno: 288
  md: '# # Manipulate Your Images


    Remember Terminator 2? Way back then we were all so impressed to see morphing—a
    smooth computerized transition between two images. Now you can do the same thing
    on your Linux system.


    NOTE Calculating a morph between images still requires a lot of computer processing
    power. Be patient.


    The Xmorph package, located in the directory /Part07/Execute/Xmorph, provides
    a simple interface to create a morph between two images. Xmorph can be used as
    a plug-in for the Gimp graphical tool, or as a stand-alone program, as shown in
    here.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_288_0.png)


    The xmorph main page also mentions a command line tool called morph. Because morphing
    large or numerous images can be very time consuming, you can use the morph utility
    to process morphs on multiple Linux machines (once you have the morph set up)
    without using the system resources required for a graphical desktop. For more
    information on this program, visit the home page of the author at http://colorado-research.com/~gourlay/software/Graphics/Xmorph.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Another program that provides more morphing between images is the xmrm package,
    which you''ll find on the CD in the directory /Part07/ Execute/xmrm. To use this
    program, you can just execute the xmrm binary in this directory.


    $ xmrm


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_289_0.png)


    Creating a great morph requires some effort. You must define certain areas of
    the images for the program to focus on when creating transitions. You can see
    from the number of controls in the xmrm program some of the complexities. I recommend
    reviewing both the README. TXT file and the quickstart .html document (using your
    Web browser) in the /Part07/ Execute/xmrm directory on the CD, in order to make
    the best use of the morphing tools.


    A related image manipulation is the creation of a photosomantic from hundreds
    or thousands of other pictures. You''ve probably seen posters of Star Wars or
    something similar done using this technique. When you look at the'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'image from a distance (of, say, 10 feet), you see a single image of a Star
    Wars ship, or Abraham Lincoln, or whatever. But when you look at the image up
    close, you see that the image is made up of thousands of other images, each related
    the main image (for example, frames from a Star Wars movie). The location of each
    smaller image is chosen to reflect the color and brightness of a part of the original
    image that is being recreated by using many small images. Clear?


    The metapixel program will create just such a photomosaic from your own photos
    or from those that you have downloaded. You need to use the metapixel-prepare
    program (actually a Perl script) to prepare all of the component images for use
    in the mosaic, then use the metapixel program to create the mosaic itself. Both
    programs are included in the directory /Part07/Execute/Metapixel, along with a
    README file to tell you more about the whole process.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_290_0.png)


    **NOTE** Creating a photomosaic from thousands of other photos takes a good bit
    of computer power. Be patient when you run this program.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_290_1.png)


    If you''re interested in mathematical images, KDE includes a basic fractal generator.
    Fractal generators create complex images by repeating simple


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_290_2.png)'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'structures based on mathematical formulas. You can start the fractal generator
    from the KDE menus by choosing Graphics ➤ Fractal Generator. Both Mandelbrot and
    Julia fractals are supported (see the Types menu). You can also set colors, iterations,
    and zoom factors on the Options menu.


    The fun of the KDE Fractal Generator is to click and drag on a portion of the
    image and see the program redraw the fractal as a magnified image of the portion
    that you selected. By choosing File ➤ Save Pic you can save any image you particularly
    like as a BMP-format image.


    A more interesting fractal program is Gnofract4D, which you can find on the CD
    in the directory /Part07/Execute/Gnofract. Use a standard rpm command to install
    this program. Then launch it using the command gnofract4d.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_291_0.png)


    > NOTE You can also launch Gnofract4D from the Gnome menus by choosing Programs
    ➤ Graphics ➤ Gnofract4D.


    Gnofract4D differs from a typical fractal generator because it shows you the fractal
    in four dimensions (as displayed on a two-dimensional screen, that is). The top
    part of the Gnofract4D window shows you six circles with letters in them. Each
    circle represents an axis of rotation. To change the view of the fractal image
    in the main screen, click and drag the tiny circle within one of the six larger
    circles. The image is immediately redrawn in low resolution, then updates to a
    new high-resolution image.


    You can also click and drag within the image window to zoom in on a portion of
    the fractal image. As with the KDE Fractal Generator, you can choose items from
    the File menu to save a fractal image as a bitmap file, or to save the parameters
    for use later.


    You can use the Settings ➤ Colors to select a colormap for the image. You can
    see the colormap selection dialog box to the right of the main window in this
    figure.'
  merge: -1
  img_proc: true
