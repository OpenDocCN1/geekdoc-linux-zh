- pgno: 59
  md: '# MAKE LINUX FASTER, BETTER, AND EASIER TO USE


    Other non-TCP requests, such as ICMP (the ping command) are viewed using the first
    menu option, IP traffic monitor. This screen is a good one to leave open on the
    system administrator''s desktop to watch the network. It displays the following
    information as you can see in the next figure.


    +   - Source and destination IP addresses, with port numbers, for each connection

    - The number of packets and bytes exchanged for each connection

    - Flags to indicate the state of each connection from moment to moment

    - A listing of other requests for UDP, ICMP traffic, etc.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_59_0.png)


    On a LAN, one client often causes trouble for the entire network by inadvertently
