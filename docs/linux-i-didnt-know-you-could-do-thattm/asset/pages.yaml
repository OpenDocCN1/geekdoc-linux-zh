    > NOTE You must be logged in as root to use Kfirewall.


    Kfirewall is located in /Part09/Execute/Kfirewall on the CD. Use a standard rpm
    command to install it, then start the program with the Kfirewall command.


    The Kfirewall program is very basic. To use it, make certain that the interface
    field shows eth, and the Internet nr field shows 0 (unless you''re using multiple
    Ethernet cards). You then enter a port number in the Port field and the source
    address in the IP Address field. To complete the rule, choose File > Add rule
    or press Ctrl+A. The rule is added using the ipchains command and shown in the
    right side of the Kfirewall window.


    Kfirewall includes a menu item (Options > List rules) that should show you the
    ipchains commands used to implement the commands that you entered in the graphical
    interface. Unfortunately that feature—which'
