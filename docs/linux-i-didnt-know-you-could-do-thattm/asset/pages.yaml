- pgno: 297
  md: '# Turn Linux into a Web Server


    One of the most popular uses of Linux is a Web server. In fact, almost any Linux
    product you buy will include a copy of the Apache Web server. Apache is the most
    popular Web server in the world, with about 50 percent of the market (if we can
    call it a market, when Apache is free). For details on the strength of Apache
    and survey statistics, visit NetCraft at www.netcraft.com.


    Having a Web server installed and running, however, isn’t the same as having all
    the power of the Web at your fingertips. Apache can do many things that are not
    included in the default configuration. This part describes what of the software
    you can add to Apache itself or use on your Web server to enhance Apache’s functionality,
    gather additional statistical information, or prepare Apache to be used for high-traffic
    and high-security Web sites.


    In case you don’t have the latest version of Apache on your system, the packages
    for version 1.3 are included on the CD in /Part08/Execute/Apache and /Part08/Source/Apache_1.3.x.
    If you did a standard Workstation installation of Red Hat 7, you have not Apache
    because it is rightly considered a server package. You can install it using a
    standard rpm command installing the package on the CD that comes with this book.
    I recommend installing both the basic Apache package and also the apache-manual1
    package. If you want to do any significant amount of work with modules, you should
    also consider installing the Apache source-code package (using also a standard
    rpm command). In the discussions on working with the Apache source-code in the
    following sections, I assumed that you’ve used these packages.


    Because the development of Apache is proceeding quite rapidly, I’ve also included
    the latest versions of Apache, which are later than those included with Red Hat
    7. These are located on the CD in the directories /Part08/Source/Apache_1.3.x
    for the 1.3 series (the current standard) and /Part08/Source/Apache_2.x for the
    2.x series (still in development and not ready for use on production servers).
    I don’t directly discuss later versions, but you can use this code to explore
    the latest Apache features.


    To learn more about Apache, visit the Web site of the Apache Project at www.apache.org
    or take a look at the magazine Apache Week, which includes many useful articles
    and a searchable database of back issues—available at www.apacheweek.com.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_297_0.png)'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Extend Apache with Modules


    One of the most important developments in Web-server software was creating the
    ability to use modules in Apache. When a Web page runs a CGI script to process
    a form or prepare a custom HTML page, the Linux system requires some overhead
    (CPU time and memory) to start and manage that script as a separate program. In
    addition, a script can only reply to a regular browser request; it can''t affect
    how Apache does.


    Extend Apache by adding functionality to the Web server itself. A module is a
    piece of code (written in C, C++, or Perl) that becomes part of the Web server,
    allowing you to customize Apache features. Of course, not everyone is up to writing
    a new Apache module, so this section describes some of the dozens of modules that
    are available for downloading to use Apache. Many of these are included on the
    CD. You can use any of these modules to add features to your Web server.


    # Add Modules to Your Apache Web Server


    Because Apache is freely distributed as source-code, most serious Webmasters will
    download Apache and compile their own copy. This allows the Webmaster to control
    the exact features that are included in Apache and to use the very latest version
    (and so have available all possible security fixes and program enhancements).


    By default, Apache doesn''t include all the possible modules that are included
    with the source-code. For example, if you want to learn about writing your own
    module, you should add a module called mod_example. Modules can be added to Apache
    in two ways:


    +   Including the module source-code with the source-code for Apache, compiling
    everything together into a single binary.

    Adding a module to Apache on the fly (once Apache is already running) as a Dynamic
    Shared Object (DSO). This is sort of like using a Windows DLL or a UNIX shared
    library.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# TURN LINUX INTO A WEB SERVER


    Either method (using source-code or dynamic loading of a prebuilt module) makes
    the module available to all of the browser requests that Apache processes. Again,
    many Webmasters choose to add the module code and compile their own custom server
    that contains exactly what they want. But it''s easier to try things using the
    DSO module without recompiling Apache. I''ll show you how to use both methods.


    Using a DSO is often easier than working with source-code. By using a DSO, you
    can experiment with a new module, loading and unloading to see how it affects
    your Web server, without the need to recompile the server to try new things.


    To make a DSO module part of Apache, just include this line in the configuration
    file httpd.conf (located in the /etc/httpd/conf directory on Red Hat 7):


    ```

    Load module_name module_filename

    ```


    The module_name is taken from the function name in the source-code file. If you''re
    using a module that you''re unfamiliar with, you''ll need to look in the source-code
    for a line like this that indicates the module:


    ```

    module mysql_auth_module = {

    ```


    In this example, the module name would be mysql_auth_module. The module_filename
    in the above LoadModule directive is the name of the DSO file containing the code
    for the module. These files end with .so. The default httpd.conf file included
    with Red Hat 7 includes configuration lines to load many standard modules. You
    can see these starting on line 209 of httpd.conf.


    > NOTE You can see a full list of ready-to-use DSO modules that are included with
    Red Hat 7 by exploring the directory /usr/lib/apache, which is symlinked to /etc/httpd/modules,
    to which the configuration file refers.


    For modules that are not ready to use, you''ll need to either compile them into
    Apache itself or create a DSO file.


    To explore further, you''ll want to have the Apache source-code package installed,
    either the rpm for version 1.3.12 or the tar files for a later version'
