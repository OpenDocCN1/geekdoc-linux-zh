    The following commands show how to get BRU going, assuming that you start in the
    directory where the BRU archive file was stored:


    +   $ tar xvZf x86-linux-glibc2.1.tar.Z

    $ cd brufiles

    $ ./x86-linux-glibc2.1/installbru


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_412_0.png)


    > WARNING For the commands listed here, I assume that you have downloaded the
    glibc2.1 version of BRU. Check the filenames carefully if you selected a different
    version for your Linux platform.


    Take a minute or two to answer the questions that appear on-screen. Then continue
    with this command:


    +   $ ./xbru/installX


    Again, answer the questions that appear on-screen. Then start the program with
