- pgno: 187
  md: '# MAKE YOUR LINUX SYSTEM A DESKTOP OS


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_187_0.png)


    A few of the features of KDE 2 are especially worth noting. I''ll leave out the
    enhancements aimed at software developers and just tell you about a few key items
    that you can play with immediately.


    +   KDE 2 includes the full KOffice suite, which is described in more detail in
    the next section. It includes a word processor, graphics tools, spread-sheet,
    and other tools.


    +   The older file manager, kfm, has been replaced by Konqueror, a modular file
    browser that is similar in appearance to Windows Explorer, which can be expanded
    to browse multiple file systems, such as FTP sites, NFS-mounted file systems,
    SMB-mounted Windows shares, and many.


    +   The multimedia aspects of KDE have been refined and enhanced using the RTS
    multimedia architecture. This allows multiple audio or video streams to be processed
    concurrently, either locally or over the network. Plug-in filters are supported.
    Video support includes MPEG, AVI, and DivX formats.


    +   Many additional customization levels are now provided by the KDE configuration
    tools (such as the Control Center window). This includes additional features that
    can be added to themes.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   Interaction with Gnome has been greatly enhanced, including support for
    drag-and-drop operations between Gnome and KDE applications running on the same
    desktop. This is especially important for Red Hat users who want to run one desktop
    but have access to applications for both Gnome and KDE.


    +   Compliance with standards in many fields makes KDE ready for future development
    and interaction with other systems. Support for Unicode and bi-directional characters
    (for Arabic and Hebrew) are just one example of this. XML classes for developers
    are another.


    +   New usability features include options for hearing impaired or other special
    needs users. (Choose Preferences ▷ Personalization▷ Accessibility on the KDE main
    menu.)


    All of these enhancements mean that you''ll be seeing a lot of KDE in the future.
    The KDE developers have worked hard to make this product to be taken very seriously
    by anyone who wants to use Linux on the desktop.


    > NOTE KDE 2 includes support for 45 languages. You can add the documentation
    and interface for a language using the rpm package provided in/Part05/Execute/KDE2.0/International.
    Additional updates are often available at www.kde.org.


    The Konqueror file manager deserves a quick look by itself. Five different views
    of your files are available. I''ve selected the tree-style detailed listing with
    icons. You can select a view using the icons on the right side of the toolbar.


    You can access the Konqueror file browser by choosing Home Directory on the main
    menu or clicking the Home Directory icon on the Panel. Use the list on the left
    side of the window to select directories, then click or right-click on icons to
    perform an action on a selected file or directory.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_188_0.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_188_1.png)'
