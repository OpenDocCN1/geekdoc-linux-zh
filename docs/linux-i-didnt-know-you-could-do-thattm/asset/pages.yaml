- pgno: 351
  md: '# 332 TURN SYSTEM INTO A SUPER SERVER


    The most advanced of the network scanning tools is probably nmap. The nmap utility
    lets you create many types of network scans for all standard protocols. Because
    this program can do so many complex things, you will find it''s not much to use
    unless you''re already familiar with a lot of low-level networking details.


    The nmap package is located on the CD in the directory /Part09/Execute/Nmap. I
    also recommend installing the graphical front end to nmap: the package-nmap-frontend.
    Both of these are standard rmp packages.


    After installing the nmap package, you can run nmap from any command line. Use
    it without any parameters to see a list of options that the program supports.
    See the lengthy man page for a more detailed overview of nmap operation. There,
    you can read about the different types of port scanning that nmap provides as
    well as dozens of other parameters for log files, timed scans (to avoid detection
    by tools like portsentry), and host selection. The main page also includes numerous
    helpful commands.


    For an easier time using nmap functionality, launch the xmap command (assuming
    you''ve installed the nmap-frontend package). The interface to this program is
    shown here. From here you can quickly select scan types, protocols, and other
    options, then just click the Scan button to begin.


