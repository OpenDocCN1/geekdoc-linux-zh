- pgno: 425
  md: '# 49 Add Redundant Disk Arrays to Linux


    One of the best ways to protect against disk failures on critical systems is to
    use an array of redundant hard disks. The common term for this is RAID—Redundant
    Arrays of Inexpensive Disks. The term inxpensive is relative. Compared to mainframe-style
    hardware, anything you use for your PC is inexpensive. If a system is worth protecting
    with a RAID disk system, however, don''t take needless risks using low-quality
    hard disks or cables.


    Linux can easily support hardware RAID devices that make an array of disk drives
    appear as a single device to the operating system. To Linux, these drives would
    be a single physical device, such as /dev/sda. The advantage of hardware RAID
    systems is that they often provide hot-swapping, allowing you to remove and replace
    a defective disk drive with a new one, never shutting the power off to the subsystem
    (or to your Linux system).


    The problem with these dedicated RAID systems is that they can be prohibitively
    expensive. But Linux also supports software-based RAID in the kernel. Using Software-RAID,
    you can configure your RAID disks in the way you want them, giving you much flexibility
    and saving a great deal of money. The catch is that you must learn more about
    your disks and the Linux system in order to make it work (and especially to take
    care of any problems that arise).


    This section describes in general terms how Software-RAID works on Linux. When
    you''re ready to learn more, visit the RAID home Web Page for the latest information:
    http://linux.org/linux/raid.html. Software-RAID support in Linux is still somewhat
    difficult to use; the documentation states that it is "best attempted by experienced
    system administrators." But I mention Software-RAID here because it''s getting
    easier all the time and because it''s a very powerful feature of Linux that few
    people are aware of.'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'First, you need to know about the oft-misunderstood numbering of RAID devices.
    For example, you may hear that a device "supports RAID-5." RAID-1 and RAID-5 are
    the most common levels. All of them are explained here:


    +   RAID-0, or RAID-linear, is the grouping of multiple physical disk partitions
    into a single logical partition. The grouping provides no fault tolerance, but
    it allows a single logical file system to grow beyond the bounds of a single physical
    disk. In some cases, striping is used to improve performance. Conceptually, stripping
    splits blocks of data and writes them across two or more hard disks to increase
    the chance that both disk heads can read or write data simultaneously. Striping
    is often used in higher RAID levels.


    +   RAID-1 is mirroring. Two or more partitions of the same size have the same
    information copied to them. Mirroring improve performance if the system is smart
    enough to read from both copies at the same time (deciding which disk head is
    closer to the desired sector), but its main purpose is to protect against disk
    failure. A commercial disk-mirroring solution for Linux that implements RAID-1
    is available from Twin-Com.


    +   RAID-4 is like RAID-0, but it requires a separate partition used to store
    parity information. So if you have, for example, five disk partitions, only four
    are storing data. The fifth is used by the RAID drivers to store a parity check
    of the other four partitions. This parity information degrades performances a
    bit, especially when writing to the disk, but it does reconstruct a system where
    one disk can fail and the data can still be based on the parity partition.


    +   RAID-5 avoids the bottlenecks of RAID-4 while providing fault tolerance based
    on parity information that is striped—stored across all of the partitions in the
    disk array.


    Selecting which RAID system to use and how to configure your hard drives is part
    of the flexibility (and potential headache) of Software-RAID. You can even combine
    some levels. Linux, for instance, supports layered mirroring (RAID-1) over a multipartition
    logical device (RAID-0).


    Software-RAID in Linux is implemented directly in the kernel. It''s available
    by default in Red Hat and is maintained by a package of utilities called raidtools,
    which are also installed by default.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_426_0.png)'
