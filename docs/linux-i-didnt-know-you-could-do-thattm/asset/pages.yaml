- pgno: 92
  md: '# 12 Fine-Tune Your Hard Disk Format


    The standard Linux hard disk format provides very good performance for most users.
    The Linux file system can be fine-tuned, however, to add a few improvements for
    those who know specifically what they need from hard disks.


    # Fine-Tune the Optimum File Size for Your System


    The default block size for a Linux file system is 1024 bytes. This works great
    for most users. But if your Linux system is chock-full of files that are less
    than 512 bytes (such as icon graphics files), then you could improve your disk
    performance by changing your block size to 512. (The disadvantage of using a smaller
    block size is that larger files will have slightly reduced performance.)


    Similarly, if your system is mostly larger files (for example, huge database tables),
    you could change your block size to 2048 or 4096 bytes. Because Linux reads from
    disk drives one block at a time, you might see performance improvements.


    Of course, if you make the block size larger, you have to contend with two downsides:


    +   - Potentially reduced performance when reading numerous files that are very
    small


    +   - Wasted space for all the files that are far below the block size (because
    the block size is the minimum allocation of space on the hard disk)


    The problem with using a nonstandard block size is that you must select the block
    size when you format your hard disk. You can''t change it later without reformatting
    the disk. But if reformatting doesn''t bother you (perhaps because you''re starting
    with a new system), use the mke2fs'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'command (a default part of every Linux system) with the -b option to specify
    the block size.


    A sample hard disk formatting command would look like this:


    ```

    # mke2fs -b 4096 /dev/hdb2

    ```


    Be very careful about using this command. If you specify a device name incorrectly,
    you might wipe out a partition that you didn''t intend to format. Also, remember
    that only unmounted partitions should be formatted. Formatting a mounted partition
    will give unpredictable results.


    > NOTE Many other options can be included with the mke2fs command, but because
    they can be set using the tune2fs command after formatting, they are discussed
    in the next section.


    # Tune Up Your File System without Reformatting


    The mke2fs command lets you define many options for your Linux file systems at
    the time you create (format) them. By using the tune2fs command, you can change
    many of those options without reformatting your hard disk.


    The tune2fs command is a default part of most standard Linux distributions, including
    Red Hat 7.


    > WARNING Never use tune2fs on a file system that is mounted. If you need to update
    your root file system, start your computer from a floppy disk so your regular
    root partition isn''t being used.


    The following table lists items that can be updated using the tune2fs command.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# FINE-TUNE YOUR HARD DISK FORMAT


    | Option | Description | Example |

    | - | - | - |

    | -c | Maximum number of times the file system can be mounted between automatic
    integrity checks (using the fsck program). | tune2fs -c 5 |

    | -i | Maximum amount of time the file system can go between automatic integrity
    checks (using the fsck program). Days (d), weeks (w), or months (m) can be specified.
    (By day is the default if no letter is included.) | tune2fs -i 1w |

    | -m | Reserves a certain percentage of the file system for files owned by the
    superuser (root) or other specific users. This allows the superuser to still use
    the system when all the "normal" space is used up. This could be set to zero on
    something like a /home partition. A certain number of blocks can be specified
    rather than a percentage (use the -r option). | tune2fs -m 5 |

    | -u, -g | Defines a user or group (by name or ID number) who can use the reserved
    blocks. | tune2fs -g wheel |

    | -L | Defines a label for the file system. | tune2fs -L usenet |


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_94_0.png)


    # # Resize Your Linux Partition


    The latest series of Linux products, like Calder OpenLinux, include the PartitionMagic
    product from PowerQuest, Inc. that automatically resizes your Windows partition
    to create a dual-boot Linux system. Of course, you can do these things using the
    FIPS program that comes with most Linux packages, but the PowerQuest program makes
    it much easier.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# MANAGE YOUR FILES LIKE A PRO


    Linux now has a freely available program designed to mimic the functionality of
    PartitionMagic when installing or maintaining a Linux system. In fact, it''s more
    general-purpose than that; the ext2resize program allows you to resize (bigger
    or smaller) a Linux partition without backing up, reformatting, and restoring
    the data.


    The ext2resize package is located in the CD in /Part02/Ext2resize. You can install
    it using a standard rpm command:


    ```

    # -Uvh ext2resize-1.1.14-4.i386.rpm

    ```


    Before using ext2resize, you should understand a few points about file systems
    and disk partitions. Think of the partition as a container in which the file system
    resides. The two elements are somewhat independent. You can create a partition
    using the fdisk program, but you can''t store any data on that partition until
    you have created a file system within the partition using the mk2fs program. (This
    is done automatically during Linux installation, of course).


    The actions of the ext2resize command affect only the file system—not the partition
    table. You must use the fdisk command in conjunction with ext2resize in order
    to effectively change how your system is set up. To make your file system larger,
    the process goes like this:


    +   1. Back up the partitions in question.


    +   2. Use the fdisk tool to delete the existing Linux partition from the partition
    table.


    +   3. While still in fdisk, create a new, larger Linux partition. Be certain
    that the new partition starts at the same cylinder boundary as the partition that
    you deleted in the previous step.


    +   4. Use the ext2resize command to change the boundaries of the file system
    to match the size of the newly defined Linux partition without losing any existing
    data on the partition.


    Similarly, to make your file system smaller, use this process:


    +   1. Back up the partitions in question.


    +   2. Use the ext2resize command to reduce the size of the file system within
    the Linux partition. After doing this, the data in the file system occupies only
    part of the available space on the Linux partition. (This is analogous to optimizing
    a Windows disk to move all the data to the front of the disk.)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_95_0.png)'
  merge: -1
  img_proc: true
- pgno: 96
  md: '3. Use the fdisk tool to delete the existing Linux partition from the partition
    table.


    4. While still in fdisk, create a new, smaller Linux partition that matches the
    size of the file system that you created with ext2resize. Be certain that the
    new partition starts at the same cylinder boundary as the partition that you deleted
    in the previous step. The new partition now contains the resized ext2 file system,
    complete with all of its original data.


    The ext2resize utility is easy to use from the command line by specifying the
    size that you want to make your file system. Be certain to follow the steps before
    for using fdisk in conjunction with ext2resize (in the correct order, depending
    on whether you are trying to make it larger or smaller). As an example, suppose
    you have a Linux partition of 3GB and you want to change it to be 2.4GB. The command
    is simple; specify the partition containing the file system and the new size:


    ```

    # ext2resize /dev/hda3 2.4g

    ```


    You can use any of the following characters to define the file system size:


    +   * b for 512-byte disk blocks

    "* k for kilobytes

    "* m for megabytes

    "* g for gigabytes

    "* t for terabytes


    If no letter is included (for example, 2 . 4 in the above command rather than
    2.4g), the utility uses file system blocks as the unit of measure. These blocks
    are either 1K, 2K, or 4K on a typical system, according to how you formatted the
    file system.


    > WARNING The ext2resize program is currently beta release software. Use it with
    caution, and remember that you should back up your data before using ext2resize
    or any program that modifies partitions and file system organization.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_96_0.png)'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Access Linux Files from DOS or Windows


    Most of us use several operating systems regularly—or at least we have friends
    who do, and we often need to share information with them. The tools described
    in this section show you how to share information between DOS or Windows and your
    Linux system.


    # Access DOS Floppies without Mounting


    Most Linux systems (including Red Hat 7) install the mtools package by default.
    This package provides easy access to DOS-format disks using DOS-style commands
    with drive letters. For example, if you have mtools installed on your Linux system,
    you can copy a file from a DOS diskette with this command:


    ```

    $ mcopy A:report.txt /home/nwells

    ```


    mtools includes a full set of “DOS-like” utilities. The most-used utilities are
    listed in the following table:


    | mtools Command | Example | Description |

    | --- | --- | --- |

    | mdir | mdir A: | Shows the contents of the floppy drive named |

    | mcopy | mcopy A:report /home/nwells mcopy report.ps A: | Copies a file to or
    from a floppy drive |

    | mread | mread A:report /home/nwells | Copies a file from a floppy drive to the
    Linux hard disk |

    | mwrite | mwrite report.ps A: | Copies a file from the Linux hard disk to a floppy
    drive |

    | mformat | mformat A: | Formats a floppy (DOS-format) |'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Remember when you use an mtools utility, you don''t have to mount the floppy
    disk drive first. In fact, if you have mounted a floppy drive (or the automounter
    has) and then you try to use the mtools commands, they may not work because other
    parts of the Linux system already have control of the floppy drive. About the
    only time you''ll see the old DOS drive letters used in Linux is when you are
    using these utilities.


    To see a complete list of the utilities included with the mtools package, use
    this command in Red Hat 7:


    ```

    $ rpm -ql mtools | grep bin | less

    ```


    This query lists all 31 binary programs in the package.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_98_0.png)


    > NOTE When entering a parameter for an mtools program, such as mcopy, you can''t
    use the shell''s tab-completion feature to fill in the name of a file on the floppy
    disk. The A: designation in front of the name, plus the fact that the floppy disk
    isn''t mounted until you press Enter, make tab-completion unusable in this situation.


    # Access Windows Partitions within Linux


    If your Linux system dual boots between Linux and Windows, from time to time you
    probably need to access the data on your Windows partition while you''re running
    Linux.


    Instead of rebooting and copying data to a floppy disk, you can use the standard
    mount command in Linux to access other partition types (such as DOS or Windows
    98 or 2000) as if they were part of your Linux file system. You can view, copy,
    and create files on the Windows partition. Any new files you create will also
    appear within Windows. Long filenames are supported as well for FAT32 file systems.


    To access your Windows partition within Linux, you need to know the hard disk
    and partition number that Windows is using. For example, if you have three partitions
    on your first hard disk, Windows might be stored on /dev/hda1, the first partition
    of the first hard disk. You can use fdisk with the option to carefully look out
    your partition information.


    +   - Create a directory to use as a mount point for accessing Windows.


    ```

    # mkdir /mnt/win

    ```'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   To mount a DOS or older Windows partition, use this command:


    # mount -t mdsos /dev/hda3 /mnt/win


    +   To mount a newer Windows partition (with FAT32), use this command:


    # mount -t vfat /dev/hda3 /mnt/win


    +   Although this shouldn''t be an issue in Red Hat 7, if your kernel doesn''t
    support FAT32 (vfat) by default, you may need to add the appropriate kernel module
    using this command before executing the mount command:


    # insmod vfat


    # Access Linux Partitions within Windows


    Windows doesn''t permit you to “mount” or otherwise access different file systems
    unless you use the networking features of Windows. The ext2tool package, however,
    gives you a few standard utilities to access a Linux partition while you''re running
    Windows.


    Use the ext2tool utilities when you have a dual boot system but need to access
    files on your Linux partition. Unfortunately, the ext2tool programs don''t let
    you write files to the Linux partition; only reading is supported.


    The ext2tool programs are DOS programs, not Linux programs. Don''t try to run
    these EXE programs in Linux. They are located on the CD in the directory /Part02/Execute/Ext2Tools.
    The source code is included in the /Part02/Source/Ext2Tools directory on the CD.


    The programs included with ext2tool are shown in the following table:


    | ext2tool Program | Description |

    |---|---|

    | G032.EXE | Needed by all other programs in ext2tool; don''t execute it directly.
    |

    | E2PART.EXE | Lists the partitions on your hard disk (requires a parameter of
    128 for the first hard disk or 129 for the second). |

    | E2LS.EXE | Lists the files in the current working directory of your Linux partition
    (like ls in Linux). |

    | E2PWD.EXE | Prints your current working directory in the Linux partition (like
    pwd in Linux). |'
  merge: -1
  img_proc: true
- pgno: 100
  md: "| ext2tool Program | Description |\n|---|---|\n| E2CD.BAT | Changes the current\
    \ working directory that you're looking at on the Linux partition. |\n| E2CAT.EXE\
    \ | Dumps the contents of a file on the Linux partition (like TYPE in DOS or cat\
    \ in Linux). |\n| E2CP.EXE | Copies a file from the Linux partition to your DOS/Windows\
    \ partition. (You cannot copy from DOS/Windows to the Linux partition.) |\n\n\
    The procedure for using these programs is shown here. My sample entries for an\
    \ example system I have are shown in bold:\n\n> **WARNING** These are all DOS\
    \ programs. Execute them in Windows or DOS, not in Linux.\n\n+   1. Start your\
    \ DOS or Windows system and change to the directory containing the ext2tool programs\
