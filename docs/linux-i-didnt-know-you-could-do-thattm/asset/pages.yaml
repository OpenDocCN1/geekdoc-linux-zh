    to see exactly which options are supported for the TinyLogin version of programs
    like adduser.


    You can alter the Config.h file and recompile TinyLogin to reduce its size by
    removing some functionality.


    NOTE Some of the features of TinyLogin, like getty and login, are difficult to
    easily test. You''ll need to alter your /etc/initstab file to really try them
    out, which is beyond the scope of this discussion.'
  merge: -1
