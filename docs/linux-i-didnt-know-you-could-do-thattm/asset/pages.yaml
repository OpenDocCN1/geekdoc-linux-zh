- pgno: 343
  md: '# TURN YOUR SYSTEM INTO A SUPER SERVER


    Two potential problems with this solution are


    +   * Your ISP notices that you''re connecting 50 people to the Internet with
    your single $15 per month connection, and they are not pleased.


    +   * You are concerned that you face a security risk because everyone on the
    Internet can see the IP addresses of every computer on your LAN through your simple
    gateway.


    True, your ISP shouldn''t care what you do, so as long as you abide by established
    time and bandwidth policies. And the simplest of blanket firewalls will prevent
    anyone from reaching the computers on your LAN.


    But a more elegant solution exists in Linux, which provides more flexibility for
    your internal users and better security in both directions. You can use a Network
    Address Translation system (NAT) to make of all the traffic going to the Internet
    from your internal network appear as if it came from a single IP address. On Linux,
    this is commonly called IP masquerading.


    Some vendors sell little black boxes that are NAT systems but allow an entire
    LAN to connect to the Internet through a single modem. Many of these boxing, of
    course, are running Linux.


    Using IP masquerading is conceptually similar to using a Web proxy, but it''s
    done at the IP address level. This means that hosts within your LAN can connect
    to anything on the Internet (that is, anything that you allow through the firewall
    that you have set up by now). How does this work? The following steps show the
    process at a simplified level.


    +   1. A packet of data from within your company LAN that is destined for the
    Internet arrives at the Linux gateway. The packet includes a field with the IP
    address of the sender (source) on your LAN.


    +   2. The IP masquerading code in the Linux kernel makes a note of the request''s
    ID and changes the IP address of the source on the LAN to the IP address of the
    Linux gateway.


    +   3. The packet is forwarded to the Internet normally (as if it originated from
    the gateway rather than from the internal host that made the request).


    +   4. When a response packet arrives at the Linux gateway from the remote host
    on the Internet, the IP masquerading code sees that the packet is a response to
    a request from a specific internal host.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '5. The destination IP address is changed from the Linux gateway to your LAN,
    and the packet is routed within the LAN so that it reaches the host that originated
    the request.


    In this scenario, the client computer on your LAN isn''t set up anything to use
    IP masquerading. In fact, neither the user nor the computer can tell you that
    the request was handled in this way. In addition, the remote host on the Internet
    doesn''t know anything about the "real" host making the request. Everything appears
    to come from the Linux gateway.


    NOTE You can create some really flexible and elegant small business solutions
    IP masquerading with PPP and automatic dialing (use the dial program). Note, however,
    if you have 50 clients using a single dial-in connection, they might think the
    service is slow and your ISP might wonder what you''re up to.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_344_0.png)


    Since it''s much easier to protect one machine (the Linux gateway) than every
    machine on your LAN, this system is inherently more secure. By configuring a strong
    firewall on the Linux gateway and adding a Web and FTP proxy server, your Linux
    system acts as a powerful virtual traffic cop for all the traffic that goes to
    and from the Internet within your LAN.


    IP Masquerading is part of the IP Chains package in the Linux kernel. IP Chains
    are the name of the kernel feature that controls how IP packets are processed;
    it''s used to create firewalls in Linux (as described in more detail in the next
    section). Red Hat 7 has IP Chains installed by default.


    To set up IP masquerading, you just define an IP Chain packet-forwarding rule
    that, in effect, "Any packet coming from this network should be masqueraded."
    Here is a command to do:


    ```

    # ipchains -A forward -s 192.168.100.0/24 -j MASQ

    ```


    This command could be read like this: Append (-A) to the chain of rules for forwarding
    packets rule such that any packets with a source address (-s) within the network
    192.168.100.0 should be masqueraded by jumping (-j) immediately to the MASQ rule.


    That explanation will make more sense if you''ve already digested the material
    in the ipchains man page and the documents in /usr/share/doc/ipchains-1.3.9 on
    a default Red Hat 7 system.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'You might also find that because your Linux system is acting as a router in
    the descriptions above, you must stop ICMP packet redirects so that IP masquerading
    keeps things in two effectively separate networks—internal (company) and external
    (Internet). Using the following two commands after the ipchains command just given
    should finish up a basic IP masquerading gateway.(192.168.100.0) is the internal
    network; the network in the second command is the external (Internet-visible)
    network used to connect to the ISP.


    ```

    # ipchains -A output -p icmp -s 0/0 redirect -i eth0 -j REJECT

    # ipchains -A output -p icmp -s 0/0 redirect -i eth1 -j REJECT

    ```


    NOTE After entering any ipchains commands, you can use the -L option alone to
    list all the active rules. The -F option alone flushes (deletes) all IP Chains
    rules from the Linux kemel routing tables.


    Each of the above commands says basically this: Append (-A) a rule to the output
    chain for all packets with the ICMP protocol (-p) and a source address (-s) as
    given here, such that redirected packets are immediately rejected (dropped).


    NOTE The 2.2 versions of the Linux kemel support about 41,000 simultaneous masqueraded
    packets. You can review the currently masqueraded connections (which change moment
    to moment) by using the cat command within the directory /net/ip_masq.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Enhance Your Network Security


    In the first few parts of this book, you learned about tools that show how your
    network is being used. In this part, you''ll discover some tools to monitor and
    enhance your network security.


    Most network security revolves around a few basic concepts. The trouble is that
    some system administrators prefer to hope that no one will bother their systems.
    More often than not, this is a vain hope. By learning a few concepts and implementing
    even one or two security measures, you can greatly increase the security of your
    network.


    # Scan for Network Intruders


    One method that potential intruders use to access your network is attempting to
    connect using different port numbers, hoping that they can discover an access
    point that isn''t protected by adequate security.


    By using the portsentry utility, you can scan the network packets addressed to
    your computer to determine if someone is trying to scan all the ports for a connection.


    Portsentry has many useful features, including the ability to automatically begin
    blocking traffic from someone who appears to be scanning for a security hole.
    A standard rpm file for portsentry is contained in the CD in the directory /Port09/Execute/Portsentry.


    Using portsentry, you can configure and check for the following:


    +   - A list of TCP ports to watch for activity; or check all ports within a certain
    numeric range (stealth scanning is also supported)


    +   - A list of ports that should not be watched (that is, should allow normal
    traffic)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_346_0.png)'
  merge: -1
  img_proc: true
- pgno: 347
  md: '+   A list of hosts that should be blocked (this is configured in the file
    /etc/portsentry/portsentry.ignore)


    +   A specific command to execute based on the address of an incoming attacker
    (use the command to block the attacker''s IP address via the fire-wall, for example)


    +   A message to post back to the attacking system


    When you install the rpm, a standard configuration file is provided at /etc/portsentry/portsentry.conf.
    which you can alter as your network requires. Advanced stealth scanning is set
    by default on the first 1023 ports.


    In the portsentry.conf file you can also set up the filenames of the hosts to
    ignore (portsentry.ignore by default), and the log files that will contain the
    names of hosts that have been denied entry by Portsentry in the current session
    or at any time. Dozens of advanced options are available, with basic documentation
    provided as comments within the file.


    Portsentry isn''t used directly from the command line, but is started at system
    time to immediately begin monitoring your network. You can read more details in
    the documentation contained in the directory /usr/doc/portsentry-1.0.


    A different approach to security is taken by the Security Administrator''s Integrated
    Network Tool (SAINT). (Yes, they made the name to match the acronym they wanted
    to use.) SAINT is located at /Part09/Execute/SAINT on the CD. You can install
    it using a standard rpm command.


    > The SAINT tool is a revision of a previously created security tool called SATAN,
    so don''t be alarmed if you see reference to that within the program. SAINT includes
    a lot of code from the earlier project.


    SAINT is a Perl script that you can interact with from either the command line
    (which is powerful but less attractive for screenshots), or via a Web'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'ENHANCE YOUR NETWORK SECURITY

    browser. Enter the command saint from a graphical command line to launch a browser
    with the SAINT interface.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_348_0.png)


    By using a Web browser, you can use SAINT to set up a list of hosts (other computers)
    to be scanned for potential security problems. Where portentry is used to check
    your system for attackers doing a port scan, SAINT is used to scan other systems
    (like an attacker does). SAINT is a diagnostic tool that will tell you if potential
