- pgno: 257
  md: 'MpegTV is commercial software, distributed as shareware. If you intend to use
    it for commercial purposes, you must register and send a fee to the program owners.
    Visit the Web site www.mpegtv.com to register.


    The MpegTV program has a nicer-looking interface than XAnim, but its real draw
    may be that it supports more MPEG features than XAnim (and thus more than aAction
    or GXAnim) currently do. (Recall that XAnim only supports one type of MPEG file,
    and doesn''t support sound in MPEG video clips.)


    MpegTV has some nice configuration options available, though not as many as XAnim
    has. It''s a nice-looking program, though you''ll likely be too annoyed by the
    "unregistered" messages to use it much until you register. (I suppose that''s
    the intent!) Use a command like this to launch the program:


    ```

    $ MTV hurricane.mpg &

    ```


    Here you can see the full screen with the MpegTV controls, the playback window,
    and the Video Options dialog box.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_257_0.png)


    In addition to the programs mentioned so far, Red Hat 7 includes a couple of default
    packages, pympeg and gtv, that you can play MPEG files without installing anything
    additional. These are in the SMPEG package, which requires the SDL package. Both
    are installed by default as part of a work-station installation.'
  merge: -1
