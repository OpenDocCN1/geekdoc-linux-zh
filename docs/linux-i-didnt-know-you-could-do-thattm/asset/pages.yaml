    As with BusyBox, you can try the TinyLogin binary in more than one way:


    +   Execute TinyLogin with no parameters to see a list of the programs that TinyLogin
    can replace.


    +   Execute TinyLogin with a parameter such as adduser to make TinyLogin act like
    the corresponding command.


    +   Run the make install command and then try the command name alone to use the
