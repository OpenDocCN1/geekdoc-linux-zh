- pgno: 61
  md: '# MAKE LINUX FASTER, BETTER, AND EASIER TO USE


    Configuration options include:


    +   * Reverse DNS lookups to display connection information as hostnames instead
    of IP addresses (this is set to Off by default because of the extra processing
    required for reverse lookups)


    +   * TCP/UDP service names to use the standard names of services instead of port
    numbers (for example, display Telnet instead of 23)


    +   * Color options to display the screens in color


    +   * Logging options to define whether activity is logged to a file and how the
    log is updated


    +   * Activity mode to select "bits per second" or "bytes per second" displays


    +   * Screen update interval selection to refresh the screen more or less frequently


    A final feature of IPTraf that deserves mention the filtering option for TCP and
    other protocols. Here I focus on describing a TCP filter, but you can choose Other
    Protocol Filters on the main menu to define non-TCP protocol filters.


    By setting up the TCP display filters option, you can watch for specific traffic
    within IPTraf. This limits the amount of information that you have to wade through
    to find what you''re looking for.


    To define a new filter, choose TCP Display Filters on the main menu, then choose
    Define new filter and enter a filter name for the TCP filter you will create.
    The filter definition screen appears as shown.


