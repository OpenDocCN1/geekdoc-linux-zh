    # Host Multiple Web Sites on One Server


    Apache has the ability to serve documents for multiple domains (or *hosts*) as
    if they were coming from separate Web servers. For example, you might have one
    copy of Apache responding to requests for www.booksahoy.com and www.chiidenscorner.com,
    or whatever domain names your Web sites are using. Apache can serve documents
    for as many of these virtual hosts as you can keep track of—literally hundreds.


    Two types of virtual hosting are possible:


    +   IP-based virtual hosting, in which your computer has more than one IP address
    assigned to it (using IP aliasing or multiple network cards). Each domain name
    is associated with one IP address.


    +   Name-based virtual hosting, in which all domain names come to your single
    IP address but are interpreted by Apache based on the request itself.


    The configuration directives in httpd.conf (the main Apache configuration file,
    located in /etc/httpd/conf directory on Red Hat 7) apply to the default Web site,
    or the one that is associated with the hostname of your Linux server itself. But
    you can configure your name server (using DNS) to'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# HOST MULTIPLE WEB SITES ON ONE SERVER


    send requests for several domains to your Linux system. Just have the administrator
    of your DNS server set up another domain name that points to your IP address.


    When a browser connects to your Web server, does it so based on your IP address.
    The information that the browser sends to the Web server, however, normally includes
    a line stating which domain name is requested. If you''re using name-based virtual
    hosting and the browser doesn''t include this information. Apache can''t tell
    which virtual host to use, since the IP address alone doesn''t contain this information.
    In these cases, Apache usually uses either the default document root or the first
    virtual host.


    Once you have your DNS server set up that requests for multiple domains arrive
    at your Linux Web server, set up a virtual host in your Apache configuration with
    a separate document root for the HTML files that apply to each virtual host.


    If you are using name-based virtual hosting, your configuration might start to
    look something like the following simple example. Note that a virtual host can
    contain nearly any of the Apache directives, including which begin with the directive
    <Directory> containers that apply to areas within the document tree for that virtual
    host. The <virtualHost>VirtualHost, which defines the IP address that these requests
    arrive on (this is controlled by your DNS server configuration).


    ```

    VirtualHost 192.168.100.3


    <VirtualHost www.childrenscorner.com>

    ServerAdmin webmaster@brighton.xmission.com

    DocumentRoot /www/childrenscorner/docs

    ServerName www.childrenscorner.com

    ErrorLog /www/childrenscorner/logs/error_log

    TransferLog /www/childrenscorner/logs/access_log

    </VirtualHost>

    ```


    ```

    <VirtualHost www.booksahoy.com>

    ServerAdmin webmaster@brighton.xmission.com

    DocumentRoot /www/booksahoy/docs

    ServerName www.booksahoy.com

    ErrorLog /www/booksahoy/logs/error_log

    ```


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_324_0.png)'
