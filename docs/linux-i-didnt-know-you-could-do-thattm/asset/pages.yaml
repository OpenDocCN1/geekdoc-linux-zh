    # Use Multiple Addresses on One Network Card


    Although it might seem strange given the growing scarcity of IP addresses, organizations
    that have extra addresses sometimes find it useful to assign more than one IP
    address to a single network card.


    For example, suppose you have a Web site and an FTP site for your organization.
    You also want to host both a Web and an FTP site with a different domain name.
    If you use a separate IP address for the second site (www.two.com and ftp.two.com,
    for example), you can more easily configure and track activity to this site.


    Using two or more IP addresses on one network card is called IP aliasing. Linux
    supports IP aliases by default in the latest kernels, including the kernel of
    Red Hat 7.


    > NOTE As the newest version of the IP protocol, called IPv6 or IPng becomes more
    widespread, plenty of IP addresses will be available. IP aliasing should become
    even more popular as a means of setting up distinct network components.


    You use IP aliasing when you set up an IP-based virtual host on your Apache Web
    server (see Item 36). Apache uses a different server configuration to handle traffic
    coming in with different IP addresses. In order to do this, you can simply set
    up IP aliasing to support multiple IP addresses on your single Ethernet card,
    then set up the virtual host configuration in Apache. No special additional work
    on your DNS server is required.'
  merge: -1
  img_proc: true
- pgno: 339
  md: "NOTE Most virtual hosts have a domain name (www.something.com) associated with\
