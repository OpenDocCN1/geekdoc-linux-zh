- pgno: 197
  md: 'KOffice includes the following components, all available from the KDE main
    menu, under Office:


    +   - **KChart** a drawing tool that can create charts from spreadsheet or database
    information


    +   - **Killustrator** a vector-based drawing program (try to say Kay-illustrator
    rather than kill-ustrator)


    +   - **KOffice Workspace** a management area from which you can work with all
    KOffice applications and use documents between multiple applications as explained
    below


    +   - **KPresenter** a presentation tool similar in function to Microsoft PowerPoint


    +   - **KSpread** a full-feature spreadsheet


    +   - **KWord** a powerful word processor


    All of the KOffice components (and KDE 2, in general) use a shared object system
    called KParts that allows documents to be embedded in each other, something like
    OLE in Windows or the Object Request Broker (ORB) in many systems. For example,
    a KSpread spreadsheet can be embedded live in a KWord document.


    > **WARNING** KOffice does still crash occasionally. Check www.kde.org for information
    about the latest updates to the KOffice package.


    You can start a single KOffice application such as KWord from the Office menu
    in KDE, but typically you''ll want to start with the KOffice workspace, which
    provides a list of applications and documents on the left side of the screen.
    This workspaces makes it easy to move between multiple documents and document
    types, accessing them and pasting them into each other as needed.'
