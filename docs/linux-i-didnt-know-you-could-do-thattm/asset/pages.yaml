- pgno: 137
  md: '# SPICE UP YOUR DESKTOP


    +   * Additional analyst research data

    * Latest company financials

    * Upgrades or downgrades to this stock


    All of these items are pulled from the Yahoo! Finance pages. The Gnome Portfolio
    Manager opens a Web browser on your Linux system and displays the actual page
    within Yahoo!. Thus, these menu items take a bit longer to display, but they are
    still a convenient feature for pulling up your stock information.


    A simpler tool for tracking the stock market in Linux is the stockticker_applet.
    This small program places an extra window on your Gnome Panel. The Dow Jones Industrial
    Average and other stock averages are regularly grabbed from the Internet and displayed
    in the window for your review.


    The stockticker program is located on the CD in the directory /Part04/Execute/Stockticker.
    Use a standard rpm command to install it.

    Once you run the stockticker_applet program, a window appears in your Gnome panel,
    as shown below. You can easily include stockticker_applet in your startup scripts,
    or in the Startup folder in the Gnome Control Panel, so that this window is always
    visible on your Panel as you use Gnome.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_137_0.png)


    # Manage Your Checkbook


    Many people with Windows systems use the Quicken program to maintain their personal
    or business checkbooks. If you use Quicken and run Linux, you should look at Gnofin,
    a Gnome-based personal finance tool.


    The Gnofin rpm file is located in the directory /Part04/Execute/Gnofin in the
    CD. You can use these standard commands to install and run the program:


    ```

    # rpm -Uvh gnofin-0.8.4-1.i386.rpm

    # gnofin

    ```'
  merge: -1
  img_proc: true
