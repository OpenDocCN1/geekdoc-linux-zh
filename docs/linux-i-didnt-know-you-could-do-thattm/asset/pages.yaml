    PKWare is a respected provider of compression tools on many platforms. The Linux
    version of their product features the ability to read tar, gzip, and e-mail attachment
    formats as luencode, XnCode, MIME, and bHinx. If you register the shareware Linux
    version of PKZIP (for $47), you also get a nice printed manual and technical support
    via Web, fax, or phone.


    The gzip, bzip2, and compress programs operate a little differently than the multi-file
    archive tools. For these compression programs, you simply provide the name of
    the file to compress. The file you name is compressed, with a new file extension,
    so that the original file is no longer on your system. This differs from archive
    programs like tar, which place files in an archive but also leaves them unaltered
    on your system.


    For example, if you have a large file called report.dat on your system and you
    use this command:


    ```

    $ gzip report.dat

    ```


    The report.dat file is no longer on your system. It has been replaced by the compressed
    file report.dat.gz. To uncompress this file, use this command:


    ```

    $ gunzip report.data.gz

    ```


    After this step, the report.dat gz file does not exist any longer, but the report.dat
    file is restored as before.


    The bzip2 and compress commands operate in exactly the same manner, except that
    the file extension added is .bz2 or .Z respectively, rather than .gz.


    > NOTE You can get the highest compression from the gzip command by adding a -9
    option, like this: gzip -9 report.dat. This option takes a little longer to compress
    a file.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Exploring the Compression Attribute


    Earlier in this section, you learned about file attributes, such as immutable
    and append only. You also learned about some attributes that are not yet supported
    by the ext2 file system, though they are part of the utilities for controlling
    attributes (lsattr and chattr).


    The compression attribute causes a file to be compressed automatically by the
    Linux kernel if it is not accessed within a certain amount of time, or if it meets
    other requirements that you define (such as a file extension or size). When the
    file is accessed, it is automatically decompressed before being delivered to the
    program that needs it.


    Decompressing a file "on the fly" takes a little bit of extra time, but by balancing
    your need to save space with adding a little time to access frequently used files,
    you can make much better use of your system resources.


    By adding the software patch included in the CD in the directory /Part2/Source/e2comp
    to your Linux kernel, you can support the c compression attribute on your system.
    This is a beta-quality, source-code-only modification to the Linux kernel. You
    should only try to use it if you are quite familiar with compiling the Linux kernel.
    Basically, you must apply this patch to modify the kernel, then recompile the
    kernel and reboot your system.


    Because this is a kernel patch, no executable program is provided on the CD. This
    patch is large—21,000 lines of code. It contains hundreds of lines of comments
    to explain exactly how to use it. You can open this source code file in any text
    editor to begin learning about this process. Use a command like either of these:


    ```

    $ e2compr-0.4.38-patch-2.2.16.bz2.bin.out

    $ vi e2compr-0.4.38-patch-2.2.16.bz2.bin.out

    ```


    This is not a project for beginners, but I think it is a useful thing to know
    about, and to see how new features like automatic file compression are being added
    to Linux. If you want to be on the leading edge, get out your compilers and dive
    in!


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_113_0.png)'
  merge: -1
  img_proc: true
