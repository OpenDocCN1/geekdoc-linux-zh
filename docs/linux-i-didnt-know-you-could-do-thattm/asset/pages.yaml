- pgno: 398
  md: '# DO CALCULATIONS IN LINUX 379


    A graphical program that is included with nearly every Linux distribution is xcalc,
    a basic scientific calculator. It is installed by default on Red Hat 7 as part
    of the XFree86-tools package. Notice that an "=" sign is included!


    A more refined scientific calculator is kcalc, part of the KDE Utilities package.
    This calculator is available in the Utilities menu of KDE (or under KDE Menus
    > Utilities, if you''re using Gnome on Red Hat 7 and installed KDE). Kcalc includes
    memory storage and logical operators (And, Or, and so forth), in addition to common
    math functions like tangent, reciprocal, and exponential.


    At the other end of the spectrum, the mpc algebraic calculator is perfect for
    those fans of the vi editor who don''t want anything but a command prompt interfering
    with their work.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_398_0.png)


    The mpc calculator is located at /Part11/Execute/Mpc. When you start it, you see
    nothing but a colon (:) prompt. At this prompt, you enter expressions to calculate.


    As you can see, the default precision shown should be enough for most calculations
    (73 significant digits). Unfortunately, no commas are used as thousands separators.


    For more information about how to use the mpc calculator, enter the command quit
    or exit, or press help. To end the program, enter the command Ctrl+C.


