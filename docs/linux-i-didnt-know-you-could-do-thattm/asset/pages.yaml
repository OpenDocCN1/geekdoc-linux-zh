  md: '# Alternative File Managers


    Both KDE and Gnome include powerful file managers that you can access conveniently
    from the main menu of your desktop. That hasn''t stopped other developers from
    creating similar programs with different features, however. Some of them may have
    just what you''re looking for.


    The Desktop File Manager (DFM) is modeled on the file management capabilities
    of the OS/2 operating system. It places a series of icons on your Gnome or KDE
    desktop. You can click on these icons to run programs or to open directory windows
    to manage files.


    > NOTE The desktop icons created by the DFM program are independent of those created
    by Gnome or KDE. In fact, they are not aware of each other, they will overlap.
    You should delete or move the standard Gnome or KDE icons to the bottom of your
    screen before using DFM.


    The DFM program is located on the CD in /Part02/Execute/DFM, You can install it
    as you would a standard rpm file, then launch it using the command dfm:


