    # 31 Create a Graphics Workstation


    Linux has terrific support for hundreds of video graphics cards. These allow Linux
    users to play games and have fancy interfaces like a 1600×1200 high-resolution
    KDE 2 desktop.


    With all that power, Linux developers have also created tools specially designed
    for graphics work—things that we used to reserve for SGI or Macintosh computers.
    While we don''t have any official Adobe products (such as Photoshop or Premiere)
    on Linux, we have a wide range of tools that I''ll describe briefly in this section.


    The first thing to be aware of graphics work in Linux is the range of basic viewers
    and tools that are installed by default or easily available on your system. This
    table provides a quick list:


    | Program Name (executable name) | Comments |

    |---|---|

    | The Gimp (gimp) | The most powerful graphics tool commonly available on Linux;
    hundreds of filters, plug-ins, etc.; installed by default on Red Hat 7 and most
    other systems; see www.gimp.org |

    | XV (xv) | An old standby and favorite of many Linux users. Great for image viewing
    and basic manipulation, though not extensible like the Gimp. Located in /Part07/Execute/Xv
    on the CD. |'
  merge: -1
  img_proc: true
