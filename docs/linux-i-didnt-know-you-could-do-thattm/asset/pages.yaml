- pgno: 399
  md: '# Create a Linux Fax Server


    Your fax machine is one of the most useful devices in your office. By using some
    simple software and your modem, Linux can be a fax server, replacing or augmenting
    your current fax machine.


    Depending on the features of your modem, a Linux fax server can receive faxes
    for multiple users, delivering them as e-mail message attachments. It can also
    allow anyone on your network to fax a document through a single modem connected
    to your Linux computer.


    In addition to fax-server software, which controls your modem and may be able
    to manage incoming and outgoing faxes for multiple users, separate fax viewing
    utilities are available. These permit users to view a file in the fax graphics
    format on-screen, converting it to other graphics, or to print the document to
    paper.


    A basic command-line faxing tool for Linux is the efax package, located on the
    CD in the directory /Part11/Execute/efax. You can use a standard rpm command to
    install it.


    The efax package includes three commands for creating and managing faxes:


    +   - efix

    - fax

    - efax


    The command efix converts files between different formats, such as to and from
    fax formats (G3 or G4). It will also let you convert between standard computer
    graphical formats, such as PBM and TIF, and the printer formats PostScript and
    PCL (used by HP printers). The efix program includes options for page length,
    resolution, and cutting and pasting, among many others.


    The efix program gives you a good way to prepare a file to be sent by the fax
    program. Linux programs can often create a PostScript file by using a standard
    print option. By setting up your printer configuration with an'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'additional printer definition that refers to your fax machine, you can include
    commands to automatically convert the PostScript output of the printer filters
    into a G3 or G4 fax file.


    The fax command can convert files directly into fax formats, or it can send documents
    that you''ve converted previously. By using the fax make option, you can convert
    a PostScript file into fax format. For example, the following command generates
    a series of files in fax format, one file per page, such as report.ps.001, report.ps.002,
    etc:


    ```

    $ fax make report.ps

    ```


    The fax command is smart enough to convert the file immediately if you just use
    the fax send option. Instead of converting a file, you could simply use this command
    to immediately fax the file shown to the phone number given with the command:


    ```

    $ fax send 801-555-1212 report.ps

    ```


    Similarly, the fax receive option lets you to receive a fax from your modem. The
    filename assigned to the fax is based on the time and date that the fax is received.
    The filename extension indicates the page of the fax. You can use the fax answer
    option within the /etc/initabb file to have the fax command automatically answer
    a modem connected to a particular serial port of your Linux system.


    When the fax command receives faxes or has numerous faxes to send, it creates
    a queue of the files received or waiting to send. You can view the status of this
    queue using the fax queue option.


    The eifax command provides a lower-level interface to your modem hardware when
    you want better control over faxing. Therefore, this command is normally used
    to set up auto-answer fax reception or fax-blast procedures. The eifax command
    lets you set specific fax protocol details, modem-device settings, and dozens
    of other options.


    Complete details about using the efix, fax, and eifax commands are provided in
    the man pages installed with the package. By using these commands within cron
    jobs, within printer-definition files (/etc/printcap), and within the /etc/initabb
    file, you can set up complex fax sending and fax-server reception capabilities
    within Linux.'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# 382 USE LINUX AS A BUSINESS SERVER


    > NOTE A brief how to document on setting up a Linux fax server is provided on
    the CD at /A11-HOWTO-Docs/MINI/Fax-Server.html.


    When you include a printer definition to send faxes, your existing graphical programs
    will have automatic fax capabilities. You can also use options the efax command
    to automatically deliver faxes via e-mail to recipients. A fax server that lets
    users view their faxes within a graphical e-mail reader is easy to set up using
    this package.


    The FaxMail package, included on the CD in the directory /Part11/Execute/FaxMail,
    is a graphical tool for sending faxes via e-mail. You can install it using a standard
    rpm command.


    The FaxMail program is a tcl script that lets you interface graphically with a
    collection of fax servers designed to process faxes via e-mail. The process is
    done by an entity called The Phone Company. You can learn more about this project
    (and thus how to use FaxMail) by visiting its Web site at www.tpc.int.


    Launch the FaxMail program using the command FaxMail (note the capital letters).
    When you start the program, you can see a cover-sheet dialog box in which you
    can enter information to send a fax.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_401_0.png)


    After you choose OK, in the main dialog box you enter the subject and a text message
    and attach files if necessary. At the bottom of the dialog box, you enter the
    fax number, along with the name of the recipient and organization- and an e-mail
    address.'
  merge: -1
  img_proc: true
