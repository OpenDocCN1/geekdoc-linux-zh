- pgno: 260
  md: '# Tune In to Radio or TV with Linux


    Several types of expansion cards exist for PCs that provide a radio or television
    tuner and output the signal to the PC. There are several programs available to
    take advantage of these cards within Linux.


    These programs all rely on a feature of the Linux kernel called Video4Linux. This
    feature allows Linux to capture incoming data from a video device, such as a television
    tuner card. The home page of the Video4Linux project is http://roadrunner.swansea.uk.linux.org/v41.shtml.
    Video4Linux is installed by default in Red Hat 7.


    > NOTE A new version of Video4Linux, called Video4Linux 2, is on its way. The
    applications described here do not require this later version to work.


    Some of the hardware devices that are supported by Video4Linux include the following:


    +   - ADS Technologies RadioCard

    - Aztech Radio Card

    - Miro PCTV

    - STB TV PCI boards

    - Diamond DTV2000 boards

    - PCI cards based on the Intel BT848 chip

    - VideoLogic Captivator PCI

    - 3Com/US Robotics Big Picture capture card/camera

    - Iomega Buz


    A KDE application that lets you watch television while you''re “working” is WinTV.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'This program includes a separate viewing window with dialog boxes to control
    various items, including the following:


    +   * Scanning the TV tuner for available stations and programming

    * Selecting a station from a separate dialog box list

    * Using a mixer window to adjust audio quality

    * Setting the video image size and input source

    * Controlling the selected channel using a programmable infrared remote control
    that interacts with your Linux PC.


    KwinTV is included as a standard rpm file in the directory /Part07/Execute/KwinTV
    on the CD.


    Installing the KwinTV rpm is simple, but you''ll also need to set up your video
    hardware (your TV tuner card) with Linux driver support. KwinTV home page describes
    how to do this for various hardware components that you might own. The page is
    www.mathematik.uni-kl.de/~wen/kwintv/. Several of the links refer to pages in
    German, but you can still learn a lot by exploring this site.


    The Links page on the KwinTV site contains a list of other applications for Linux
    that rely on the Video4Linux system. These include various video capture utilities,
    several WebCam tools, and numerous radio tuner-type utilities, including some
    designed specifically for the Gnome desktop.


    > NOTE Most TV tuner cards include radio tuning as well.


    One of the Gnome radio tuner programs is called gtuner. The gtuner program lets
    you listen to the radio as you work via an interface similar to the CD players
    described previously.


    You can install gtuner using a standard rpm command. You''ll find the package
    in the directory /Part07/Execute/Gtuner. After you''ve installed the package,
    start the program by choosing Programs > Multimedia > gtuner on the Gnome desktop
    main menu.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# The interface of gtuner is somewhat like a car stereo, as you can see here.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_262_0.png)


    You can select the band, frequency, and volume of the radio. If you prefer, you
    can use the slider to select a station and watch the music graphically as you
    listen.


    Gtuner includes a set of configuration dialog boxes where you can set features
    such as the following:


    +   - Sleep timer and wake-up alarm

    - Mute on exit options

    - List of stations (memory)

    - Support for multiple radio tuner cards

    - A plug-in interface for expandability


    Another broadcast-related program for Linux is icecast. Icecast is a streaming
    server for MPEG3 (mp3 files). Using icecast, you can broadcast an audio file from
    your computer (acting as a server) to any other system on your network (or the
    Internet, if you have sufficient bandwidth) for others to listen to. In effect,
    you can become a digital DJ by providing a streaming audio signal using the icecast
    server.


    The icecast project is open source software, with a home page at http://icecast.linuxpower.org/.
    This page includes lists of “netcast” audio. You can visit one of the pages listed
    and listen to music provided by an icecast server on the Internet.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '![](img/35c1af90d4f3af9cd7cfd006c6b752f5_263_0.png)


    You can install the icecast server using a standard rpm command. The package is
    located on the CD in the directory /Part07/Execute/Icecast.

    You should consider setting up an icecast server in the same vein as setting up
    a Web server—it takes a little preparation and an ongoing maintenance effort to
    make something that people want to continue using. To that end, you can start
    learning about the process by reading in the documentation directory after installing
    the icecast rpm. Start at /usr/share/doc/icecast-1.3.5/README.


