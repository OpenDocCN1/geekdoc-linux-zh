- pgno: 221
  md: '6. Enter the command to launch KAsteroids:


    ```

    $ /usr/lib/kde2/bin/kasteroids &

    or enter this command to launch KSpacduel:


    $ /usr/lib/kde2/bin/kspacduel &

    ```


    Once you''ve done all this, the fun can begin. Use the keyboard to controlnyour
    spaceship as follows:


    +   - Right and left arrows rotate the ship

    - The up arrow fires the engine (moving you forward)

    - The spacebar shoots (only a few at a time!)


    As you clear each set of asteroids, you advance to a new level with more andnfaster
    asteroids. During each wave of asteroids, your fuel level decreases asnyou move
    around using the up arrow key (your thrusters).


    The game KSpacduel is similar to Asteroids, except that you rotate aroundnplanet
    and must constantly deal with the gravitational pull of the planet.

    I consider it a much more interesting game, and the KDE version is well

    done. You can really get into the feel of the game as you watch the combi-nation
