  md: '# 216 TURN LINUX INTO THE ULTIMATE GAMER


    Xboard is simply an interface to gnuche, but it does include many handy options
    you can use to improve your chess game. For example:


    +   - Choose Options > ShowThinking to see the computer ponder various moves (though
    it''s a challenge to interpret the output unless you''re-ready a chess whiz).


    +   - Choose Step > Backward to reverse the one move and figure out a better one.


    +   - Choose Options > Highlight Last Move to see each move blocked out in yellow
    so you can more easily follow what is happening during the game.


    +   - Choose Mode > Two Machines to set up play with another person on a second
    computer.


    +   - Back up or advance to any move of the game with the arrow buttons to the
    right of the message window (under the timers).


    Another version of chess for linux lets you play in three dimensions. I''m not
    up to that sort of thing myself, but if you are, you can play between three separate
    boards displayed on your Linux screen.


    The 3D chess program is located on the CD in the directory /Part06 /Execute/3dc.
    You can launch it with this command:


