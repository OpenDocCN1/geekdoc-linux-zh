- pgno: 415
  md: '# Boot Linux in Emergencies


    One of the more serious problems with Linux is not being able to boot your system.
    This can happen because of a hard-disk crash, problems installing a new version
    of Linux or the LILO boot loader program, or even a small corruption of key system-configuration
    files (such as /etc/inittab). In these cases, you need to be able to boot your
    system into Linux so you can diagnose and correct the problem.


    # Create a Backup Boot Disk


    Most Linux distributions have some sort of boot disk or rescue disk image that
    you can copy from a CD or Web site. Using this disk, you can boot your system,
    access your Linux partition, and use a basic set of utilities to try to fix problems.


    As an example, CD number 1 in the Red Hat 7 package includes a disk image for
    a boot disk. When you start the system with this disk, as you did when installing
    Red Hat, you can choose a Rescue mode that lets you perform system administration
    tasks to correct problems booting the system.


    In addition, Red Hat 7 includes the command mkbootdisk that creates a bootable
    floppy disk with information about your particular system. It''s useful to safely
    store a copy of a standard Red Hat disk and the boot disk created from the mkbootdisk
    command. If a problem occurs, you can use them to boot the system and fix the
    trouble.


    > **NOTE** If you purchased a boxed set of Red Hat 7, a boot disk came with the
    package, so you can skip the following procedure.'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'To create the boot disk, insert your Red Hat 7 CD number 1 (making sure

    it''s mounted) and follow these steps:


    +   1. Insert a blank, formatted disk in your floppy drive.


    +   2. Change to the directory where images are stored on the Red Hat CD:

    # cd /mnt/cdrom/images


    +   3. Use the dd command to dump the boot-disk image to the floppy

    (this command takes several minutes to reformat and write to the

    floppy disk):

    # dd if=boot.img of=/dev/fd0 bs=72k


    +   4. Remove the boot disk and label it appropriately.

    To create a boot disk specific to your system, insert a blank, formatted

    floppy disk and execute this command:

    # mkbootdisk --device /dev/fd0 2.2.16


    Note that the device name for the floppy drive is given, plus the version of

    the kernel used for Red Hat 7. You could also use command substitution

    with the -r option of the uname command to insert the kernel release num-

    ber automatically:

    # mkbootdisk --device /dev/fd0 `uname -r''


    # Use Linux on a Disk


    Although the boot disk I just described will launch your system, it still

    assumes that the Linux operating system is available on your hard disk and

    that you just needed help getting the system booted into the Linux kernel.


    But sometimes that isn''t the case. What if you want to run the entire oper-

    ating system from a floppy disk? You may want to do so to alter the hard

    disk itself. Or you may need to repair data on the hard disk without using

    the programs already stored there. Or you may just be creating a special-

    purpose single-disk version of Linux. Many projects already exist,

    such as the single-disk Linux Router Project.


    Tom''s rescue/boot disk is a package that lets you quickly create a complete

    Linux-on-a-floppy. This project has a collection of tools that the author

    chose as most useful for system-administration work when your system is'
  merge: -1
  img_proc: true
- pgno: 417
  md: 'By using a special formatting technique, this program fits 1.7MB on

    floppy, instead of the standard 1.4MB.


    You can find the tar-format package for Tom''s rescue/boot disk on the CD

    in the directory /Part12/Execute/Tomsrt. To use this package, first untar

    the archive file with this command:


    ```

    $ tar xzvf tomsrtbt-1_7_205.tar.gz

    ```


    Next, change to the subdirectory that was created: tomsrtbt-1.7.205. It''s

    a good idea to review the documentation contained in the file tom-

    srtbt.FAQ. It explains how to operate the programs included in the pack-

    age and also lists all the utilities included on the disk that the program

    creates.


    > **NOTE** The disk for Tom''s rescue/boot disk is contained in the file

    tomsrtbt.raw.


    To create a rescue/boot disk, just use the install.command. You will be

    asked for a blank disk that will then be reformatted to 1.7MB. The tom-

    srtbt.raw disk-image file will be written to the disk. You can then reboot

    your system from that disk to test the process worked.


    If you want a more comprehensive tool for creating customized Linux-on-

    a-floppy projects, try the Yard package. Yard lets you choose which utilities

    should be on your rescue/boot disk, rather than using a predesigned disk

    image with utilities selected by the package author.


    The Yard package is included on the CD in the directory /Part12/Execute/

    Yard. You can use a standard tar command to unpack the archive. Then

    change to the yard-2.0 subdirectory and use the following commands to

    place the Yard files in their correct location:


    ```

    # tar xzvf yard-2_0.tar.gz

    # cd yard-2.0

    # ./configure --prefix=/usr/local

    # make

    # make install

    ```'
  merge: -1
  img_proc: true
- pgno: 418
  md: 'You may want to indicate a specific directory when you use these commands.
    I''ve shown an example of this in the configure command here. The default locations
    are shown in the README file.


    > **NOTE** Note in the configure script I''ve commented out line 46, which performed
    a now-outdated test on ldconfig, to make the configure script work smoothly on
    Red Hat 7. If you download a later version of Yard, you may need to do the same.


    You''re ready to set up your own custom boot disk by following these steps:


    +   1. Review carefully the contents of the Config.p1 file within the Yard-2.0
    directory. This file contains configuration details such as the floppy disk capacity,
    whether to use LILO to boot the floppy, and the mount point to use for the floppy
    disk. You may not need to change anything in this file, but it''s worth reviewing.

    2. Edit the contents of the Bootdisk_Contents file. This will be placed on the
    boot disk that Yard creates (using the remaining steps). The Bootdisk_Contents
    file includes instructions for formatting any new entries that you want to add
    to this file. It also includes comments on each section of files that are included
    in the default Yard configuration.

    3. Run the make_root_fs command. This command as all of the programs in the Bootdisk_Contents
    file into a disk-image file, ready to be written to disk.

    4. Run the check_root_fs command. This command checks that the disk-image file
    will actually fit on a floppy and will boot your system. If any errors are reported
    during this step or the previous one, review them and make changes in your configuration
    to correct them. Then repeat them.

    5. Run the write_rescue_disk command to copy the image created in step 3 to a
    blank floppy. You can reboot your system from this disk to test it out.'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'Much more extensive documentation on Yard is provided in the doc sub-directory
    of the yard-2.0 directory. While in that directory, you can view the documentation
    in a browser using this command (or from any browser):


    ```

    $ lynx Yard_doc.html

    ```


    NOTE The Yard documentation is also provided in compressed PostScript, text, and
    SGML (Standard Generalized Markup Language) formats. The man page (the file yard.08)
    simply refers you to these documentation files.


    # Add Utilities to Linux on a Disk


    For some Linux-on-a-floppy projects, the standard utilities that you want to use
    are just too large. When you require more functionality you can fit on a disk
    using the standard Linux utilities, try using BusyBox and Tiny-Login, two Open
    Source projects designed for embedded Linux systems (small devices that run Linux,
    like cell phones, cash registers, or industrial controllers).


    Using BusyBox and TinyLogin, you can greatly reduce the amount of space needed
    on your boot disk up to 65 standard utilities that you''re likely to need. The
    BusyBox program includes up to 65 standard utilities (you can decide which ones
    to include) in a single file of about 240KB. (The standard commands require around
    1.4MB of space.) TinyLogin includes programs such as adduser, passwd, getty (for
    terminal management), and login, to help you create a working system without the
    larger standard utilities.


    The BusyBox package is included on the CD in the directory /Part12/Execute/BusyBox.
    This directory includes a single binary file for busybox. You can use that binary
    to execute the example busybox commands in this section. However, the discussion
    here assumes that you have installed the tar archive file that contains both the
    binary and the source code. You can unpack the archive using a standard tar command.'
  merge: -1
  img_proc: true
- pgno: 420
  md: '# BOOT LINUX IN EMERGENCIES


    > NOTE If you want to check for the latest version of BusyBox or TinyLogin, visit
    the site http://opensource.lineo.com. Lineo, Inc. is an embedded Linux company
    that sponsors the continuing development of these Open Source projects.


    BusyBox works by installing symbolic links into your default binary directories.
    Therefore, when you enter a command such as ls, the symbolic link refers to the
    BusyBox binary. BusyBox sees that you entered ls, so it provides the functionality
    of the ls command. You can include options after the command, which BusyBox also
    understands.


    I compiled the BusyBox binary on Red Hat 7 and have included it in the source-code-tar
    archive at/Part12/Execute/BusyBox. After you unpack the archive, change to the
    subdirectory busybox-0.49. You can then try the BusyBox binary using a command
    like this:


    ```

    $ ./busybox ls

    ```


    > NOTE Execute the busybox binary without any parameters to see a list of the
    program functions that BusyBox can replace on your system.


    If you want to delve more deeply into BusyBox, use the make install command within
    the BusyBox subdirectory; the command installs a set of symbolic links in the
    _install subdirectory. You can also specify any directory if you want to test
    BusyBox. For example, you could use these two commands within the BusyBox subdirectory
    to install the symbolic links in the /tmp/tmp/busybox directory:


    ```

    $ mkdir /tmp/busybox

    $ make PREFIX=/tmp/busybox install

    ```


    Either way, you can test the symbolic links by changing to a subdirectories of
    the install directory (such as _install/bin by default) and entering a command
    such as ls:


    ```

    $ cd _install/bin

    $ ./ls

    ```'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# 402 DISASTER-PROOF YOUR SYSTEM


    The listing that appears will come from the BusyBox program, not from the standard
    1ls command.


    For any of the commands BusyBox provides, you can include a --help parameter to
    see the available options. One way that BusyBox reduces the space required for
    so many utilities is by eliminating rarely used options. For example, the standard
    ls command includes over 50 options; the BusyBox version only includes about 20—enough
    for most.


    You can also configure the BusyBox binary to have only those programs that you
    want to include, making it even smaller. For example, you could create a version
    of BusyBox that didn''t include the gzip command, which takes up much space.


    To do this, return to the BusyBox subdirectory and open the Config.h file in a
    text editor. You will see a number of #define lines containing something like
    BB_DU for the du command and BB_LS for the ls command. For any commands that you
    don''t need, place a double-slash comment at the front of the line. For example,
    you might change the gzip line (line 43) to look like this:


    ```

    ## BB_GZIP

    ```


    > NOTE The BusyBox binary use standard glibc libraries, which can take a lot of
    space. To further reduce space requirements on a Linux-on-a-floppy project, try
    the use ulibc libraries. Visit the http://opensource.lineo.com Web site and review
    the projects list to learn more.


    After saving and exiting the Config.h file, recompile the BusyBox program using
    the make command:


    ```

    $ make

    ```


    The resulting BusyBox binary will only include those programs uncommented in the
    Config.h file.'
  merge: -1
  img_proc: true
- pgno: 422
  md: 'NOTE To learn more about using BusyBox, review the README file in the BusyBox
    subdirectory or refer to the Web site at http://busybox.lineo.com.


    The TinyLogin package is much like the BusyBox package—in fact both are maintained
    by the same author, Erik Andersen. You can find TinyLogin on the CD in the directory
    /Part12/Execute/TinyLogin. Use a standard tar command to unpack the archive found
    there or use the single binary file to try a few of the commands supported by
    TinyLogin.


    The TinyLogin package doesn''t include as many tools as BusyBox, but includes
