- pgno: 423
  md: '# 48 Monitor System Logs for Trouble


    Most of the important activity on your Linux system is stored in the system log
    files. The main log file—/var/log/messages—contains output from nearly every key
    Linux component, from the mail and Web servers to the login program. The system
    log includes information such as:


    +   * Each kernel module that is loaded

    * Each attempt to log in as root

    * Connections made via FTP or certain other protocols

    * Failed login attempts

    * Warnings about system resource limits

    * Networking daemons starting and stopping


    You can configure which types of events are logged to the messages file by reviewing
    and editing the /etc/syslog.conf file. Each line in this file defines a set of
    programs (called a *facility*), a type of event (called a *priority*), and an
    *action*. Examples of a facility include the e-mail server, the authentication
    programs (like the login program), and other daemons (processes) such as a Web
    server.


    Examples of priorities include debugging messages (very low priority), information
    messages (medium priority), and emergency messages, which may indicate that the
    system is about to crash (these, of course, are high priority).


    Each program on a Linux system sends messages to be logged via a special programming
    instruction (a system call). The system logger uses the syslog.conf file to determine
    what action to take with the messages. The action is normally either to write
    the message to a file or to write a message directly on the screen.


    What follows is a standard line from the Red Hat 7 syslog.conf file. It indicates
    that most messages are to be written to the /var/log/messages file:

    info;mail.none;authpriv.none'
  merge: -1
  img_proc: true
- pgno: 424
  md: 'Another line indicates that messages from any program (the left *) with a priority
    of emerg (critical) should be written immediately on screen to all users who are
    logged into the system (the right *):


    *emerg *


    Fortunately, you''ll rarely need to alter the syslog.conf file. If you do, refer
    to the syslog.conf man page using this command:


    ```

    $ man syslog.conf

    ```


    Because the system log file can show potential trouble, several programs have
    been developed to help you watch the system log file for warning signs. I will
    discuss one subsequently. Examples of warning signs are


    +   - Repeated failed login attempts in the middle of the night by a user who
    is supposedly on vacation


    +   - The stopping and starting of network services, unbeknownst to the system
    administrator


    +   - Programs having trouble allocating sufficient memory to execute properly


    Warning signs can pertain to both system maintenance—keeping your Linux system
    running smoothly and efficiently for all users—and to to security.


    The LogWatch program lets you configure items to watch in your log files. LogWatch
    is a C program that requires you to provide detailed configuration information,
    which is stored in the /etc/log.d directory. Sample configuration files, documentation,
    man pages, and so forth are all included with the LogWatch program.


    LogWatch is on the CD at /Part12/Execute/LogWatch. You can install it using a
    standard rpm command.


