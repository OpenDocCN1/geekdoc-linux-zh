- pgno: 304
  md: 'Users of Windows NT networks can authenticate access to their Web servers via
    user accounts in NT domains using the mod_auth_nt module. The source-code package
    is located on the CD at /Part08/Source/Apache_modules. Oracle database records
    can also be used as the basis of Web-server authentication using the mod_auth_ora
    module. Two modules, for versions 7 and 8 of Oracle, are provided on the CD at
    /Part08/Source/Apache_modules.


    Kerberos is a popular and security mechanism that you can also use if you have
    a Kerberos server set up on your local network. The module mod_auth_kerb is also
    located at /Part08/Source/Apache_modules.


    For those with existing network infrastructure, the goal of Web-based authentication
    is often to map incoming user requests to existing user accounts on the local
    network. This is particularly useful for employees that use the Web to access
    company or personal data while travelling. Server authentication modules allow
    Apache to test incoming requests against local network resources.


    If you use Lotus Notes, a preliminary module is available to support authenticating
    Web requests to your Notes user database. This module can be downloaded and used
    free of charge, but it cannot be redistributed as it is not included on the CD.
    For information, visit www.oceangroup.com/download.html.


    On the Apache Module Registry, you can find additional authentication modules
    for less common systems.


    For those with authentication needs that aren''t addressed by all of these options,
    mod_auth_external allows you to define a script (external to Apache) that defines
    whether a user is authenticated or not, based on the information returned by the
    client. The source-code and README file for this module are located on the CD
    at /Part08/Source/Apache_modules.


    The trade-off for the flexibility of using mod_auth_external (beyond the need
    to write your authentication script) is that Apache must start the script as an
    external program to handle any request that requires authentication services.
    For situations like this, using the mod_fastcgi module (also included on the CD
    at /Part08/Source/Apache_modules), which attempts to keep scripts “alive” in memory
    to reduce the performance of running CGI scripts. This module is no longer in
    development but is still quite useful.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Explore Other Useful Modules


