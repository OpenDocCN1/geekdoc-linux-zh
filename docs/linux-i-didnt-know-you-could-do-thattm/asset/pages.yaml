- pgno: 265
  md: '# 246 MAKE YOUR SYSTEM ENTERTAINING


    The sndconfig utility provides screens where you can then configure your sound
    card:


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_265_0.png)


    This utility will either auto-detect your sound card hardware or let you select
    the right hardware from a list of about 50 sound cards. You then must choose the
    correct parameters to operate the card (for example, the interrupt number and
    DMA channel). See your computer''s documentation for information on locating the
    required numbers.


    For additional information about configuring your sound cards, point your browser
    to either /All-HOWTO-Docs/Sound-HOWTO.html or /All-HOWTO-Docs/Sound-HOWTO.html
    on the CD.


    The easiest way to test that your sound hardware is functional is to play a music
    CD. Both KDE and Gnome (and many other Linux window managers) include a basic
    CD-playing application.


    In both KDE and Gnome, you can choose CD Player from the Multimedia menu. The
    KDE version is shown here.


    After playing a CD, you can use a program like xmms to play a sound file. This
    shows that your sound drivers are correctly loaded and configured.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_265_1.png)'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Of course, if you don''t hear any sound, other things could be wrong. If you
    use a dual-boot system and sound works fine in Windows, try using a different
    kernel module or different parameters and read the Sound-HOWTO document. If sound
    doesn''t work in Windows either, check the following conditions before fiddling
    with Linux commands:


    +   * Is the sound installed tightly in the slot on your system board?

    * Are the speakers plugged into the correct jack (not the microphone jack) on
    the sound card?

    * Is the power connected to the speakers (many require an AC adapter or batteries)?

    * Are the speakers turned on?

    * Do you have several devices on your system (scanner, sound mixer, sound card,
    etc.) that might be using conflicting IRQ-interrupt numbers?


    # Try the OpenSoundSystem


    If you''re really interested in using sound features on Linux, consider trying
    the OpenSoundSystem. This is a commercial sound-driver package for Linux. It features:


    +   * Support for Linux-x86, AlphaLinux, and LinuxPPC

    * Technical support, including ongoing support for the latest Linux kernels

    * A menu-based interface to configure your sound card

    * Automatic detection of sound card kernel parameters

    * Support for PnP (plug and play) sound cards

    * Support for sound cards that are not otherwise supported in Linux because the
    drivers for them contain proprietary information (that the soundcard vendor has
    not permitted to be included in free sound card drivers)


    +   * Auto-detection of certain sound cards plus manual configuration tools to
    change sound card parameters on the fly

    * Full-duplex support for Creative Labs Blaster 16/AWE32/AWE64


    You can download an evaluation copy of this $20 product from the 4Front Technologies
    Web site at www.opensound.com. The download is free after you enter some personal
    information. This project and the company that'
  merge: -1
  img_proc: true
