  img_proc: true
- pgno: 108
  md: 'help you learn about the program. The easiest way to get started (assuming
    you''re working in graphics mode) is to use this command to review the User Guide
    for ext2d:


    ```

    # gs user-guide-0.1.ps

    ```


    This manual will explain the details of how to view parts of an ext2 file system,
    how to enable new data, and how to set a few of the options available in the program.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_108_0.png)


    NOTE Unlike the lde program, you can always exit ext2d by pressing Ctrl+C.


    In addition to the User Guide, the /usr/share/doc/ext2d-0.1/ directory contains
    an overview of the ext2 file system. This document is very useful in understanding
    Linux file systems at a lower level (how they are arranged and how they operate).
    Unless you''re already a Linux pro, I recommend reviewing this document before
    using either ext2d or 1de.


    # Save Space with Linux Compression


    Hard drives keep getting larger, it''s true. But so does our appetite for space.
    And who wants to buy a new hard drive every month? With Linux compression technology,
    you can put off the inevitable for quite a while.


    You''re probably familiar with at least one of the compression programs that comes
    with Linux—the chances are good that you''ve already used one to explore some
    of the programs on this book''s CD. But Linux actually has a half dozen more ways
    of compressing data, so you can choose which one works best for you.


    The following table presents a summary of the Linux tools available for compressing
    data.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '| Tool Name | File Extension Used | Comments |

    |---|---|---|

    | compress/uncompress | .Z | An old UNIX standby. Available on most UNIX and Linux
    systems (including Red Hat Linux 7). Relatively poor compression. |

    | zip/unzip | .zip | A good choice for those needing to interoperate with Windows
    systems. Compatible with WinZip. Useful for those who haven''t learned the UNIX
    tar command. Good compression. |

    | pkzip/pkzip | .zip | Like zip/unzip, but an official product from the makers
    of PKZIP/WinZip for Windows. Provides compatibility between platforms. |

    | gzip/gunzip | .gz | The most popular format on Linux. Also available on many
    UNIX systems. Provides excellent compression. A standard format used to share
    data. |

    | bzip2/bunzip2 | .bz2 | A replacement for gzip. Rapidly gaining acceptance. Provides
    better compression than gzip, but is not as widely used, so gzip is still a better
    choice for distributing files. |'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# SAVE SPACE WITH LINUX COMPRESSION


    | Tool Name | File Extension Used | Comments |

    |---|---|---|

    | tar | .tar or .tgz | An archiver for combining multiple files into one file.
    Provides no compression unless used in conjunction with gzip |

    | rar | .rar | A newer tool, similar to tar, but which provides a high quality,
    built-in compression (better than gzip but not as good as bzip2) |


    When deciding which compression tool to use, ask yourself the following questions:


    +   * Is the recipient of this file likely to be on an older UNIX system? Use
    compress.

    * Is the recipient of this file likely to be on a Windows system? Use zip or pkzip.

    * Do I need to combine many files into a single compressed archive file? Use tar
    with the z option, or zip, or rar.

    * Am I concerned about getting the maximum possible compression (smallest files)
    without worrying about other people using the file? Use bzip2 or rar.

    * Will a largeLinux community need to access this file? Use tar with the z option
    for an archive, or gzip for a single file.

    * Will only users of Red Hat 7 need to access this file? Use bzip2 for better
    compression.


    # Using Compression Utilities


    The gzip, compress, bzip2, zip, and tar programs are all installed by default
    on your Red Hat 7 system.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_110_0.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# MANAGE YOUR FILES LIKE A PRO


    The rar file archiver is on the CD in the directory /Part02/Execute/rar. This
    is an unusual package. Use the following commands to access this zipped, self-extracting
    archive file:


    ```

    # cd /mnt/cdrom/Part02/Execute/rar

    # cp rarlnz27.zip /tmp

    # cd /tmp

    # unzip rarlnz27.zip

    # ./rarlnz27.sfx

    # cd rar

    ```


    Now you can use the rar or unrar programs and read the text files to learn about
    the program. The rar archiver is a shareware product. As described in the license
    summary in the /Part02/Execute/rar directory, you must register this product and
    pay a license fee if you use it longer than 40 days. That said, rar does provide
    very good compression—more than 10 percent better than gzip in my simple tests
    on text and binary files. No source code files are available for rar.


    Enter the rar command with no parameters to see a list of usage options.


    Using rar is like using tar. You must include a command option, an archive filename,
    and the name of one or more files to include in the archive. Compressing (adding
    files to an archive) works like this:


    ```

    $ rar a archive.rar file1 file2

    ```


    Decompressing (extracting) works like this:


    ```

    $ rar x archive.rar

    ```


    This is very similar to using tar, for which the equivalent commands will be as
    shown here. Note that tar requires the z option to compress the archived files;
    rar always assumes you want to compress the files in the archive.


    ```

    $ tar cvzf archive.tgz file1 file2

    $ tar xzvf archive.tgz

    ```


    Zip also uses a similar format, but operates without any required options:


    ```

    $ zip archive.zip file1 file2

    $ unzip archive.zip

    ```'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'At the time of this writing, no valid binary for PKZIP for Linux was available
    for Red Hat 7. If you are interested in using this program, search one of the
    sites www.linuxberg.com or rpmfind.net, or download directly from www.pkware.com
