- pgno: 183
  md: '# 164 MAKE YOUR LINUX SYSTEM A DESKTOP OS


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_183_0.png)


    To give you an idea of why these things are worth exploring, consider some of
    the Panel configuration options:


    +   - Enable or disable animations as you move the Panel or its programs around.

    - Auto-hide the Panel to free up screen space.

    - Set the speed of animation and auto-hiding, as well as the size at the bottom
    of the screen for an auto-hidden Panel.

    - Configure each of four button types on the Panel independently, including border
    width and depression depth.

    - Define what padding for spacing items on the Panel should be and how objects
    are moved when right-clicked on.

    - Define the items included in the Gnome main menu (For example, add or remove
    the KDE menus).

    - Keep menus in memory for better performance or to free up the memory for other
    applications.

    - Use large icons for higher resolution screens or smaller icons for smaller screens.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# USE THE LATEST GNOME AND KDE FEATURES 16


    +   * Enable or disable tooltips (those little yellow pop-up descriptions).


    +   * Define key-bindings for keyboard control of the Panel (and thus keyboard
    control of the Gnome main menu).


    Now, if you really want to get esoteric, move down to the sawfish window manager
    configuration section. This section includes 11 subsections where you can configure
    things like:


    +   * Whether windows that are being resized or moved are shown as an outline
    (to save time) or as complete (opaque) windows.


    +   * Which of ten methods is used to decide the location of newly opened windows
    and dialog boxes.


    +   * Which windows have focus (receive keystrokes and mouse clicks), based on
    the action of the mouse.


    +   * What the default fonts and colors for all windows will be.


    +   * Which windows to include when cycling through windows using the Alt+Tab
    key combination.


    +   * How you will define any of dozens of actions that apply to specific sets
    of windows, to which you assign Special actions in the Matched Window section.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_184_0.png)'
