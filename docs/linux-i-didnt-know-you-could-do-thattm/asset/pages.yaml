- pgno: 337
  md: '# 3. Create the file /etc/dhcpd.conf. A very basic sample file is shown here:


    ```

    default-lease-time 600;

    max-lease-time 7200;

    option subnet-mask 255.255.255.0;

    option broadcast-address 192.168.1.255;

    option routers 192.168.1.254;

    option domain-name-servers 192.168.1.1, 192.168.1.2;

    option domain-name "mydomain.org";


    subnet 192.168.1.0 netmask 255.255.255.0 {

    range 192.168.1.10 192.168.1.100

    range 192.168.1.150 192.168.1.200

    }

    ```


    This sample file causes the DHCP server to assign IP addresses from the range
    192.168.1.10 to 192.168.1.100 or from 192.168.1.150 to 192.168.1.200. Each client
    IP address is valid for 600 seconds (or the time the client requests, to a maximum
    of 7200 seconds). After that, the client must request a new IP address. The DHCP
    server also provides information for the client''s subnet mask, broadcast address,
    router/gateway settings, and DNS server.


    If you need to assign a specific IP address to a certain client (based on the
    hardware MAC address of the client''s Ethernet card), add lines such as these:


    ```

    host training23 {

    hardware ethernet 08:00:2b:4c:59:23;

    fixed-address 192.168.1.222;

    }

    ```


    A more complete sample file (too long to reproduce here) is included in the DHCP
    server package. You can find that file in /usr/share/doc/dhcpd-2.0/dhcpd.conf.sample
    on the CD. You can simply copy this file to /etc, and edit it as needed. Additional
    README and documentation files are also contained in the directory /usr/share/doc/dhcpd-2.0.


    In addition, you can read man pages for DHCP commands using these commands (the
    number refers to the manual section):


    ```

    $ man 5 dhcp-options

    $ man 5 dhcpd.conf

    $ man 8 dhcpd.leases

    $ man 8 dhcpd

    ```'
