- pgno: 212
  md: '# Run Windows Apps with WINE


    For years I''ve been talking to people about the WINE project. WINE is an attempt
    to clone Windows on Linux, or something like that. Technically, it''s a huge,
    complex project. At base, however, the facts are these: After years of effort,
    WINE has reached a point where you can really run some useful applications on
    it. I consider it stop-gap measure for those who prefer to use only Linux but
    still require a few applications that are only available on Windows.


    I used to demonstrate WINE by showing the Windows Solitaire program running on
    Linux. That was all about it could run a few years ago. My latest test, however,
    was running a full-blown copy of Quicker Deluxe 99, and it came up with a hitch.
    That''s not to say every Windows application can run without bugs, but it''s a
    good indication of the power of WINE.


    WINE is located on the CD in the directory /Part05/Execute/Wine. Use a standard
    rpm command to install it. It is a large package (about 5MB), so it takes a few
    minutes to install.


    WINE includes many configuration options. About the only one you need to set up
    is a pointer in the file /etc/wine.conf to your Windows partition. For purposes
    of this discussion, I''ll assume that you''re running Linux 9xr or 2000. Follow
    these steps to get things up:


    +   1. Create a directory where you can access your Windows partition.


    ```

    # mkdir /mnt/win

    ```


    +   2. Mount the Windows partition (use the correct partition number for your
    system where I''ve used hda1).


    ```

    # mount -t vfat /dev/hda1 /mnt/win

    ```


    +   3. Open the file /etc/wine.conf in a text editor and locate the section [Drive
    C].


    +   4. Edit the Path= line in that section to reflect the location of your Windows
    partition. For example:


    ```

    Path=/mnt/win

    ```


    +   5. Save the wine.conf file.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_212_0.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_212_1.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'You''re ready to launch a couple of Windows programs! To begin, change to the
    directory where the Windows application is located on your system. For example,
    use this command on a standard Windows 98 installation:


    ```

    $ cd "/mnt/win/Program Files/Accessories"

    ```


    The MS Paint application is located in this directory. To launch it in Linux,
    use this command.


    ```

    $ wine ./mspaint.exe

    ```


    Launching a program takes a few moments. WINE is a resource intensive application,
    and I recommend having at least 32MB of memory (64MB is much better) if you want
    to use it regularly. Although WINE may display a couple of messages on your command
    line when it opens, the MS Paint application should appear on screen after a minute.
    This isn''t very interesting unless you realize that this figure was captured
    in the middle of a Gnome desktop!


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_213_0.png)


    > NOTE WINE places a couple of files in your home directory as you run applications.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'If you''re a software developer, you can use some of the developer tools that
    are part of the WINE project to more easily port applications from Windows to
    native Linux. To learn more about the WINE project, including details about technical
    support and some commercial companies that are affiliated with the project, visit
    www.winehq.com.


    # # Run Linux and Windows with VMware


    In addition to WINE, which acts as a Windows binary emulator (with additional
    developer tools for Windows-to-Linux porting), you can use a virtual machine emulator
    to actually run native Windows on Linux, including Windows 98 or Windows NT.


    The idea behind a virtual machine is that the operating system (Windows, in this
    case) actually thinks that it''s running all by itself on a dedicated Intel-based
    computer.


    The program that provides this functionality is VMware, a commercial product for
    Linux. You can download a 30-day trial of VMware from www.vmware.com. One of your
    operating systems (I''d suggest Linux!) acts as a host for VMware. You then load
    Windows into the VMware virtual machine. Applications run within this environment.


    Once you have VMware set up, you can switch between Windows and Linux with a couple
    of keystrokes, never rebooting your system. You can also copy and paste information
    between the operating systems using special clipboard buffers that VMware provides.


    Using VMware with Linux and Windows alone obviously requires more system resources
    than either operating system alone, but the performance on a well-equipped machine
    is very good. To me, the most interesting thing about VMware is that both operating
    systems are actually running at the same time, rather than just sitting in the
    background waiting to be activated. I have had people describe a Linux application
    communicating over the "network" with a NetWare server, when Linux, Windows, and
    NetWare 5 were all running at the same time on one CPU using VMware.


    OK, enough of my raving, VMware is a commercial product. You can download a 30-day
    trial from the VMware.com Web site, or you can purchase the product directly.
    The Linux version sells for $299 electronically or $329 if you want a boxed product.
    VMware also comes in a Linux Express edition for $79 or $99.'
  merge: -1
  img_proc: true
