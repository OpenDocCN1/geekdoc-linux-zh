    Notice that in the main KDE window a menu has been added to the top of the screen.
    Other than that, it''s quite similar to KDE 1.x. But as you work with the menus
    and programs, you''ll notice that everything is more refined, easier to use, and
    contains more features. Almost all the standard KDE applications have been rewritten
    for this major new release of KDE.'
  merge: -1
