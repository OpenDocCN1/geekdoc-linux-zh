    # 4 Monitor Your System the Easy Way


    For system administrators, keeping track of system resources is a constant

    need. The tools in this section let you graphically track the usage of CPU

    time, system memory, swap space, and other resources in real time.


    # View Data from the Proc File System


    The Linux kernel uses a special method of providing information about

    itself to the programs running on the system. This method is called the proc

    file system ("proc") rhymes with (“rock”). The proc file system looks like a

    part of your directory structure, with files and subdirectories. But when

    y look at the contents of a file, you are actually looking at data from the

    kernel. The data changes from instant to instant, as the status of your system-tem
    changes.


    You can view information in the proc file system using any of the standard

    command line tools. For example, to see memory information, use this

    command:


    ```

    $ /proc/meminfo

    ```


    But several good tools are available to process and display this information

    in a convenient way. One of these is called procmeter.


    The procmeter rpm is located on the CD in the directory /Part01/Execute/

    Procmeter. You can install it using this command while logged in as root:


    +   # rpm -Uvh procmeter-2_4-1_i386.rpm


    After installing this program, use this command to launch it:


    ```

    $ procmeter

    ```'
  merge: -1
  img_proc: true
