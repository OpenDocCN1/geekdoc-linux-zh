- pgno: 369
  md: '# CLONE WINDOWS NT


    > NOTE Mounting a remote Windows system using smbount is a great way to access
    Windows applications that you want to run using WINE.


    Once you have an SMB file system mounted using the smbount command, you can unmount
    it using a standard umount command. For example:


    ```

    # umount /mnt/sundance

    ```


    > NOTE You can also place an entry in the /etc/fstab file to automatically mount
    SMB file systems at boot time, just as you would on local or NFS file systems.
    See the man page for the mount command for details.


    # 41 Clone a Windows NT Server on Linux


    After playing with the Samba client tools, you may be interested in setting up
    your own Samba server on Linux. Numerous system administrators rely on a Linux
    machine running a Samba server to act as the default file server for a network
    full of Windows clients. The costs are low and the stability is unbeatable.


    The Samba server package is included with Red Hat 7, but is not installed by default
    if you select the Workstation installation. The samba package is included on the
    CD in the directory/Part10/Execute/Samba. You can install it using a standard
    rpm command. Remember, the samba package is the server; the samba-client package
    is the client (with the smbclient-command). The samba-common package should be
    installed when you plan to use either the server or the client.'
