- pgno: 370
  md: '# Set Up a Samba Server


    The Samba server suite is included with most distributions of Linux. If you didn''t
    include the Samba package when you installed Red Hat 7 (check by using the command
    rpm -q samba), you can add it to your system from the Red Hat CD using this command:


    ```

    rpm -Uvh /mnt/cdrom/RedHat/RPMS/samba-2.0.7-21ss1.i386.rpm

    ```


    In addition, the /Part10/Execute/Samba directory contains rpm-format archives
    for various systems that you can install on your copy of Linux. Source archives
    are also included at /Part10/Source/Samba on the CD.


    You can use the following command to check which Samba packages have installed


    ```

    $ rpm -qa | grep samba

    ```


    If you''re using a non-Red Hat Linux distribution, the package names might differ,
    so you could try this command as:


    ```

    $ rpm -qa | grep smb

    ```


    If you used a server-type installation of Linux rather than the Workstation installation
    that I''ve been assuming you used, the Samba server may already be running on
    your Linux machine.


    You can tell whether the Samba server is running by using the following command,
    which searches the list of processes running on your system for those that include
    the letters mbd. In this case you''re looking for the Net-BEUI name server, nmbd,
    and the Samba share management daemon, smbd:


    ```

    $ ps aux | grep smbd

    root 556 0.0 2.1 1312 652 ? S 13:46 0:00 smbd -

    D

    root 558 0.0 1.9 1104 608 ? S 13:46 0:00 nmbd -

    D

    ```


    The two lines appearing in this sample output show the Samba server components
    running.


    > NOTE One catch is that Samba is installed and attempts to start up at boot time,
    it will stop if no valid configuration file is available. Just continue reading
    in this section to learn how to remedy that.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# 352 CLONE WINDOWS NT


    If these programs are not yet running on your system, follow the configuration
    steps in this section. After the configuration is set up, start the Samba server
    using the steps shown. You can then run the ps command above once more to check
    that the server is running.


    The configuration file for Samba on Red Hat 7 systems is /etc/samba/smb.conf.
    The file will be in a very similar location on other Linux distributions (such
    as /etc/smb.conf or /etc/samba.d/smb.conf).


    The smb.conf is installed as part of the Samba server package. You can begin running
    your Samba server as soon as you set up this file. Although a basic configuration
    is set for you in Red Hat 7, you should check the configuration carefully as described
    here before running the server.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_371_0.png)


    > WARNING The more concerned you are about the security of files on your Linux
    system, the more carefully you should prepare your smb.conf configuration file.
    Samba provides many security options than I can discuss here. All are designed
    to protect the data on your Samba server from unauthorized access.


    The Samba configuration file (smb.conf) includes a configuration line for almost
    every possible Samba option—and there are hundreds of options. Some of the tasks
    that you can perform with a Samba server include the following:


    +   * Restrict connections to your server to a certain set of IP addresses.

    * Define printers on Linux that can be accessed from Windows systems.

    * Set up how the Linux Samba server announces itself to other SMB systems (such
    as Windows clients on your network).

    * Use WINS for name resolution on your network.

    * Have the Linux Samba server act as a Primary Domain Controller for your network
    (this feature is still experimental, however).


    Fortunately, a comment is included with each of the possible commands in the smb.conf
    file. (Comments are the lines that begin with "#" or with ";") You can read the
    descriptions and uncomment any features that you want to try. A basic configuration
    for Samba includes information about'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# CLONE WINDOWS NT SERVER ON LINUX 353


    how to authenticate users and what parts of your Linux system to share with clients.


    In the following listing, I''ve pulled out all the noncomment lines from a very
    basic smb.conf file so you can see what it contains without all the comments.
    To begin learning about the Samba server, your best option would be to use the
    default configuration file that is installed with Samba on your Linux distribution.
    Just modify a few lines to get everything running, as I''ll explain shortly.


    If you want to try this exact example, it''s included on the CD as /Part10/ Execute/Samba/smb.conf.compact.
    You can copy this file to your system as /etc/samba/smb.conf, after backing up
    the existing default configuration file. The compact sample configuration file
    that follows provides for printer sharing, per-user home directory sharing, and
    a public area that all users can access.


    [global]


    ```

    workgroup = WELLS

    server string = Micron 800MHz Tower--Red Hat 7 Samba Server

    ```


    ```

    printcap name = /etc/printcap

    load printers = yes

    printing = lprng

    ```


    ```

    security = user

    encrypt passwords = yes

    smb passwd file = /etc/samba/smbpasswd

    ```


    ```

    socket options = TCP_NODELAY

    dns proxy = no

    ```


    [homes]


    ```

    comment = Home Directories

    path = %H/Public

    browseable = yes

    writable = yes

    create mask = 0750

    ```


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_372_0.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_372_1.png)'
  merge: -1
  img_proc: true
- pgno: 373
  md: '```

    [printers]

    comment = All Printers

    path = /var/spool/samba

    browseable = no

    guest ok = no

    writable = no

    printable = yes

    create mask = 0700

    ```


    ```

    [public]

    comment = Public Stuff

    path = /home/public

    browseable = yes

    public = yes

    writable = yes

    printable = no

    write List = @users

    ```


    > **NOTE** Each of the features in the above sample file is part of the default
    setting in Red Hat 7 Everything is just easier to see without all the comments.


    You must perform a few additional steps before you can run to your Windows systems
    to have a look at your new Linux Samba server. Notice that the [homes] and [public]
    section define subdirectories on your Linux system. These subdirectories must
    exist, or a connection intended for that resource (share) will fail. To prepare
    my system to use this configuration file I had to create the two directories that
    the configuration file refers to: /home/public and /home/niels/Public. You may
    need to log on as root to create the /home/public directory, but be certain that
    the Public subdirectory is owned by the person whose home directory it is.


    Now, take a look at the [global] section to see how few key settings there operate.
    The /etc/printcap file is named as the source for printers. This setting makes
    all logical printers on your Linux available to Windows users. You can also specify
    a certain Linux printer definition as the only available for Windows users. (This
    is often a good idea, because it allows you to manage print jobs from Windows
    systems independently.)'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# CLONE A WINDOWS NT SERVER ON LINUX 355


    Set the workgroup line to match the Windows Workgroup that you want this system
    to be a part of. It should normally be in all capital letters. Set the server
    string line to a descriptive string about this server. I like noting the machine
    type and that it''s a Linux server, but you can leave that part out if you prefer.


    > **NOTE** If you''d like to hide the fact that people are using Linux, set the
    Windows string equal to "Windows NT Server."


    The only step that remains is to configure the user security for your Samba server.
    Because the SMB protocol is used by systems ranging from Windows 95 to Windows
    2000 (and beyond, one surpasses), differences in how passwords were implemented
    across these "compatible" platforms can cause headaches when you connect machines
    of different types to your Samba server. Using encrypted passwords is always a
    good idea, but you may have to make a change in the Registry of some Windows clients
    to enable them use encrypted passwords. If all of your clients use encrypted passwords,
    you can choose not to use them at all on the Samba server.


    To set up the passwords so that Windows users can access the server, you must
    prepare an smbpasswd file, as defined in the smb passwd file line in the [global]
    section of the file above:


    ```

    encrypt passwords = yes

    smb passwd file = /etc/samba/smbpasswd

    ```


    If you are running Red Hat 7, uncomment these two lines in your /etc/samba/smb.conf
    file.


    One way to set up the Samba password file is by using a few of the Samba utilities
    to copy your Linux user database (/etc/passwd) to the smbpasswd file. The command
    to do this is mksmbpassword.sh. To use this command, you your /etc/passwd file
    as input and the smbpasswd file as output. The command would look like this:


    ```

    # mksmbpassword.sh < /etc/passwd >> /etc/samba/smbpasswd

    ```


    The smbpasswd file created by this command contains a lot of strings of X''s where
    the password data would normally be. You must use the smbpasswd


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_374_0.png)'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'command to reset the password for a user after adding it to the smbpasswd file
    using mksmbpasswd.sh. You''ll see an example in a moment.


    > NOTE The mksmbpasswd.sh command is intended for those times when you are starting
    from scratch with a new Samba server.


    To add individual users to the Samba password file, use the smbdduser command
    with a username from your Linux system as a parameter. For example, I already
    have a user named anne on Linux, so I can add that user to the smbpasswd file
    using this command:


    ```

    # smbdduser anne: anne

    ```


    The name after the colon (also anne in this example) is the user account name
    for Windows systems. I might have chosen a different name to respond to the Windows
    User ID, but in this case they are the same. After you enter this smbdduser command,
    you are prompted to enter a password (twice) for Samba access for this user (coming
    from a remote client).


    For any user who is part of the smbpasswd file, including those whom you''ve added
    to the file using the mksmbpasswd.sh command, you can use the smbpasswd command
    (the command and the file have the same name) to change the password.


    ```

    # smbpasswd nhells

    ```


    New SMB password:


    You must enter the password twice to confirm it. The encrypted password is updated
    in the smbpasswd file.


    The important part of setting up these users is that a matching username and password
    exist on both the Linux Samba server (in smbpasswd) and on the Windows client
    that attempts to connect to the server. Don''t bother with the smbusers file that
    you see in the same directory. It''s intended to map Linux users to Windows users,
    but it isn''t used in this example configuration.


    With the user accounts and passwords set up in the smbpasswd file, your configuration
    is complete. To make it take effect (and to start the Samba server), use this
    command:


    ```

    # /etc/rc.d/init.d/smb restart

    ```'
  merge: -1
