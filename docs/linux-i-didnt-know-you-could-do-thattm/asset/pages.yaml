  img_proc: true
- pgno: 427
  md: '# 408 DISASTER-PROOF YOUR SYSTEM


    > NOTE References to the multiple-driver driver (such as the device md0) are actually
    oblique references to the RAID subsystem.


    The raidtools package includes documentation, located in the directory /usr/share/doc/raidtools-0.90.
    It also includes a number of man pages for the programs and configuration files
    used to create and maintain a Software-RAID array in Linux. Man pages are provided
    for the nine raidtools commands, plus the RAID configuration file:


    +   - The raidtab configuration file, which you create in /etc. Samples are provided
    in the documentation

    - The mkraid command to create a new RAID array based on the raidtab configuration

    - The raidstart command to get an existing RAID array up and running so that the
    data it contains can be accessed


    > NOTE Using a RAID array as your boot device in Linux requires a few extra tricks.
    Red Hat''s installation program provides customization options (in the Disk Druid
    tool) to help you do this, but you should review the RAID documentation as well.


    # 50 Supply Uninterrupted Power to Linux


    It''s actually very easy to supply uninterrupted power to Linux. Simply plug your
    PC, monitor, and other peripherals into a diesel generator and keep filling it
    with gas until the main power comes back on. All kidding aside, battery-based
    backup systems are cleaner and quieter, but they don''t last forever. In fact,
    most uninterruptible power supply (UPS) devices are'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'designed to only allow a few minutes to save your files and gracefully shut
    down your system. This prevents file-system corruption and lets you alert networked
    users to the shutdown. (Because of the cost of UPS systems, most businesses don''t
    go much further in their power-backup plans.)


    When you use a UPS on your Linux system, you can use the utilities described in
    this section to control your Linux system based on signals from your UPS device.


    Modern UPS devices are connected both to your wall socket and the serial port
    of your computer. When the UPS detects that the power has been cut, a signal is
    sent to the serial port on your PC. By using a program that intercepts the signal
    and controls your Linux system, you can leave Linux unintended and still gracefully
    shut the system in the event of a power failure. Three standard signals are sent
    to the serial port by a UPS (this list converts the signals to English):


    +   * The power has failed; begin a graceful shutdown.


    +   * The power has failed, and I''m out of battery life. Shut down quickly.


    +   * The power has been restored; there''s no need to shut down.


    To use a UPS on Linux, you need a program to receive and act on the serial port
    UPS signals and a configuration that tells you your PC how to behave. Before you
    buy a UPS, try to determine from the manufacturer whether or not it includes Linux
    support (or if the manufacturer has used it on a Linux system). Generally speaking,
    if you can get the specifications for which pins on the serial cable are used
    you can easily configure the Linux software to act on the UPS signals.


    The init program starts all programs when your Linux system is booted. A configuration
    file /etc/inittab is used to control its actions. Part of that file looks like
    this:


    ```

    pf::powerfail:/sbin/shutdown -h +5 "Power Failure; System

    Shutting Down"

    ```


    ```

    # If battery is fading fast -- we हेनरी...

    p1::powerfailnow:/sbin/shutdown -c 2 >/dev/null

    p2::powerfailnow:/sbin/shutdown -h now "Battery Low..."

    ```


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_428_0.png)'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# DISASTER-PROOF YOUR SYSTEM


    # If power was restored before the shutdown kicked in, cancel it.

    po:12345:powerokwait:/sbin/shutdown -c "Power Restored; Shut-down Cancelled*


    Notice the signals in the control statements: powerfail, powerfailnow, and powerokwait.
    For each one, a shutdown command is defined. The shutdown command halts the system
    either in five minutes (+5) or immediately. If the powerokwait signal is received,
    a new shutdown command is executed with the -c option, to cancel the system shutdown.


    You can edit these lines in /etc/inittab to change what happens when the UPS detects
    a power failure. You can even write a script that performs many different tasks
    and launch script from the inittab file.


    Several daemons are available that can manage the signals received by the UPS
    and issue the signals that the init program uses to start a system shutdown. Some
    of these daemons are:


    +   * nut

    * bpowerd

    * APC MasterSwitch outlet manager


    Two of the most commonly used daemons, nut and bpowerd, are included as standard
    rpm files on the CD at /Part12/Execute/Nut and /Part12/Execute/Bpowerd.


    One of the most popular brands of UPS devices is APC (see www.apcc.com). A comprehensive
    Web page with instructions for making an APC UPS device work under Linux is available
    at www.sibling.com/acups/. The APC device uses the acupsd daemon, which is included
    on the CD as a standard rpm file in the directory/Part12/Execute/APCUPS. This
    daemon provides more comprehensive support than the nut or bpowerd programs because
    it is targeted to specific hardware and thus can take advantage of that hardware’s
    features.


    APC power devices can also use the apcmasterwitch utility (located at /Part12/Source/APC_MasterSwitch
    on the CD). This utility allows you to set individual usernames and passwords
    for each outlet on an APC MasterSwitch via a CGI interface.'
