    # Hide Password Files with Shadow Passwords


    The hardcrack program and others like it assume that a potential intruder can
    get a copy of your password file (/etc/passwd) or at least one encrypted password
    from it.


    The shadow password method is used on most Linux systems today, including Red
    Hat 7. This method uses modified password utilities to access a file that can
    only be read by the root user. In contrast, the standard /etc/passwd file can
    be read by any user, giving everyone access to the encrypted passwords.


    By using shadow passwords, you can also enforce security features like minimum
    password lengths and maximum time between password updates. This type of information
    is stored in the fields of the shadow password file. You can set it using the
    graphical LinuxConf utility. Just follow these steps:


    +   1. Log in as root.


    +   2. Choose Programs > LinuxConf on the Gnome menu. You can also enter the command
    linuxconf from a command line.'
  merge: -1
  img_proc: true
