    # Other Arcade-Style Games


    One of the classic video games from Atari was Missile Command. It introduced the
    controll to video games and was a very popular game for years. The idea behind
    it was that you would control the air defenses for a city that was under attack.
    You used your mouse to position a pointer to where your missiles will hit, then
    you fired. The explosion of your missile had to intercept the incoming missile
    to destroy it. The secret was to time your shot so when it reached its target
    and exploded, the incoming missile hasn''t already passed it by.


    Incoming missiles that you missed destroyed parts of your cities. You got points
    at the end of each wave of missiles for cities remaining and for missiles remaining
    in your arsenal.'
  merge: -1
  img_proc: true
