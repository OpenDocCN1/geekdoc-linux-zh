- pgno: 394
  md: '# # Analyze Your Stocks


    If you find all this discussion of mortgage calculations a little boring, you
    should try the tinvest package to do some serious financial analysis of your stock
    portfolio.


    Tinvest runs a simulation to determine the optimal gains that you can achieve
    from a portfolio of multiple equity investments. The program determines which
    equities to invest in a set you provide. It calculates the instantaneous Shannon
    probability and statistics for all of the equities. A statistical estimation technique
    is then used to estimate the accuracy of the calculated statistics for the equities.


    This is serious investment work. You''ll want to review the README files carefully
    before digging into this tool. (The README assume you are familiar with some stock
    trading terms and techniques.) Tinvest is located on the CD /Part11/Execute/Tinvest.
    This directory contains a single .tgz archive file. When you unpack, you''ll have
    the source code plus two binary program files, tinvest and tsim. I have compiled
    these for Red Hat 7. If you''re using another platform, you may need to recompile
    the source code. In addition, the archive includes the man pages, Install and
    README files, and tests subdirectory.


    Information about the stocks that you want to analyze is stored in the stock files
    in the tinvest directory. A set of old stock data is included in the source-code
    package as a sample for analysis, and the format of the stock information is described
    in the documentation. Additional stock information can be obtained from www.stockmaster.com/.
    A few lines of the stock information are shown here:


