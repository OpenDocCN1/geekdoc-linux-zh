- pgno: 17
  md: '# xvi INTRODUCTION


    I can''t help you get all these packages working on your particular system. Too
    many variables exist, and it would be impossible for me to know the source code
    for the many programs included to be able to diagnose problems. If you''re having
    trouble, the best course of action is to contact the author of the individual
    software program. An e-mail address and Web page are generally provided in the
    README file for each individual package.


    # Conventions Used


    The following typographical conventions are used in this book:

    Program names, commands, and directories are shown in a program font like this.
    Note that sometimes the package name and the executable program name are different.
    For example, the package SoundStudio has an executable binary file called studio.
    I have tried to use the program font in a consistent and helpful manner, though
    I realize the ways of Linux developers are not constrained by publishing convenience.
    Commands that you enter are shown on separate lines like these:


    ```

    $ make install

    # rpm -Uvh qt-devel-1.44-1.i386.rpm

    ```


    The first character is the Linux command line prompt, which you should not enter.
    I''ve used the "S" as a standard prompt, or the "#" when I think you may need
    to be logged in root to complete the commands (sometimes a note in the text explains
    that as well). The bold portion of command lines indicates what you should type.


    For some sections, the output of commands is shown in the same style, but without
    the prompt before it, and without any bold text, like this:

    Supported ethernet device found. (eth0)

    Sniffit.0.3.5 is up and running.... (192.168.100.3)

    Packet ID (from_IP.port-to_IP.port) : 192.168.100.3-192.168.100.2.2793


    Throughout the books are scattered Notes, which are generally asides about the
    subject at hand, and Warnings, which caution you when you need to be extra careful
    about performing an action.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_17_0.png)'
