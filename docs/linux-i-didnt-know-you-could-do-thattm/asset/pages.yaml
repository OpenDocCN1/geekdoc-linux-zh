- pgno: 175
  md: 'With the growing sophistication of the KDE and Gnome desktops, users to Linux
    are becoming accustomed to the power of a full-featured GUI. Still, the desktop
    you download or install by default on Linux doesn''t include all the tools and
    toys that these other fancy new desktops have available.


    This describes add-ons for KDE and Gnome that you can integrate with your desktop.
    These add-ons include attractive graphical toys and practical utilities that are
    integrated with the desktop. The focus in this part isn''t on system administration,
    however—it''s on adding features to your desktop that you didn''t know were possible
    to add.


    Red Hat 7 includes both the Gnome 1.2 desktop and the KDE 1.1.2 desktop. You can
    choose to install either or both of these during the Red Hat installation. As
    of this writing, the latest available stable version of KDE is 2.0.2. Red Hat
    has included a version of KDE 2 on CD2 Binary Programs when you purchase Red Hat
    7. In case you downloaded Red Hat 7, I''ve included the necessary files to upgrade
    KDE 2 on the CD that comes with this book. Version 2.0 of Gnome is in the works
    but not yet available. The first section of this part of the book describes some
    of the latest features of Gnome 1.2 and the newly-released KDE 2.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_175_0.png)


    > NOTE If you''re not running Gnome, you can use the rpm files in the directory
    /Part05/Execute/Gnome_1.2 to install Gnome on your system.


    You don''t need to install KDE 2 if you''re not a KDE fan, but you''ll need to
    use KDE 2 to work with the Kice features described later in this section, as well
    as a couple of the other KDE applications described elsewhere in the book.(I''ll
    mention those instances specifically when KDE 2 must be installed in order to
    use a program.) If you plan on using KDE 2 regularly, I really recommend upgrading
    to KDE 2.


    When you install Red Hat 7, you can select KDE as an option. If you do, Gnome
    remains the default desktop, but the KDE 1.1.2 menus are included as a submenu
    of the Gnome desktop. If you prefer to work only in KDE (leaving Gnome), launch
    the sw tchdesk-application from the Gnome desktop. You can run the utility again
    to switch back to Gnome.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# USE THE LATEST GNOME AND KDE FEATURES 157


    (Delete the file .Xclients in your home directory if the switching back and forth
    doesn''t seem to work smoothly.)


    Additional information related to the Gnome and KDE desktops are available on
    the Internet sites for these products. It''s often best to obtain the packages
    that were built specifically for your version of Linux (such as KDE2 for Red Hat
    7). This avoids potential file location conflicts and ensures the fewest snags
    when you upgrade to a newer version of a program. (For example, the SuSE rpm packages
    for a program are not likely to work well on Red Hat 7.) The place to begin looking
    for the desktop packages you need is www.gnome.org or www.kde.org.


    # 22 Use the Latest Gnome and KDE Features


    With most software programs, we only use a fraction of the power that the developers
    put in the products. I suppose they keep adding features, both because the marketing
    departments demand it of (to advertise and sell more products), and because the
    programmers don''t want to get bored maintaining old programs that haven''t changed.
    For my part, I just don''t have time to explore and train myself on features that
    don''t meet an immediate need.


    Using a desktop environment is much the same. Gnome, KDE—even Windows—all contain
    features that we may never spot because we aren''t inclined to read all the documentation.
    In this section, I''ll try to show you a few tips that will make your time on
    Gnome and KDE a little more interesting, and maybe even a little more productive.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_176_0.png)'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Impress Your Friends with Your Command of Gnome Options


    The Gnome Panel is the collection of buttons and other tools that appears (by
    default) on the bottom of your screen as you use Gnome. It includes a few commonly
    used applications such as Netscape, the Gnome Control Center, and a terminal emulator
    window. It also includes the main menu button, plus a clock, and buttons for each
    running application, allowing you to easily switch apps.


    Many of these tools are actually called applets. An applet is a program that is
    designed to be displayed in the Panel. It has a small interface that is always
    visible. One standard example is the applet that lets you click on a small box
    in order to change between multiple desktops. The clock and laptop battery monitor
    are also applets.


    Red Hat 7 comes with over 40 pre-installed applets available for your use. You
    can select any of these from the main menu by choosing Applets, and then a submenu,
    such as Amusements or Monitors.


    Some applets just display information, such as the Gnome Weather (choose Applets
    > Utility > Gnome Weather) or the CPU Load applet (choose Applets > Monitors >
    CPU Load). Others let you control parts of your system using tiny buttons provided
    as part of the applet. The CD player is a popular example of this type of applet
    (choose Applets > Multimedia > CD Player).


    Once a music CD is inserted, you can use the Play, Stop, and other controls to
    operate the CD. Right-clicking on any applet lets you move the applet to a new
    location on the Panel, or remove it entirely.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_177_0.png)'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'NOTE Your Panel can get very crowded if you activate numerous applets. Choose
    those most useful to you. You can also remove program icons such as the Netscape
    icon, if you prefer not to have them on your Panel. Just right-click on an icon
    and choose Remove from Panel.


    Both Gnome and KDE use hidden directories within your home directory to store
    information related to the desktop itself and to the Gnome or KDE application
    that you''ve installed. The following table lists a few of the directories that
    you''re likely to find. You can view these from a command line window using the
    ls -a command. When referencing them, just remember to include the leading period,
    as shown in the table.


    | Subdirectory Within Your Home Directory | Description |

    |---|---|

    | .gnome | Contains configuration files for many Gnome programs. These are created
    by the individual program when it runs. Each file is in plain text and can be
    reviewed using any text editor. |

    | .gnome/apps | Contains additional information for Gnome applications. An application
    developer can choose to use this directory; most applications do not. |

    | .gnome-desktop | Contains files representing the icons/contents of your Gnome
    desktop. For example, you can review the contents of the file RH.com on a default
    system. |

    | .gnome_private | Contains configuration files from some types of Gnome applications.
    |'
  merge: -1
  img_proc: true
- pgno: 179
  md: '| Subdirectory Within Your Home Directory | Description |

    |---|---|n| .gnome* | Some applications create special configuration subdirectories,
    usually named after the application itself, beginning with gnome or GTK. |

    | .sawfish | Contains a session ID number for your current session. Don''t change
    this manually! |

    | .kderc | The main KDE configuration file for a single user. This is a text file
    that you can review using any text editor. Values are normally changed using graphical
    KDE dialog boxes (for example, in the KDE Control Center). |

    | .kde | A directory containing numerous types of KDE configuration data, including
    application-specific user configuration files, icons, personalized menu items,
    graphical images (wallpapers, etc.), additional MIME-types, etc. The information
    in the .kde/share subdirectories mirrors that found in /usr/local/kde/share, but
    is for an individual user |


    Once you have Red Hat 7 up and running, the Gnome interface is easy to use and
    does a lot of things for you. Because of that, you might not have explored all
    the available configuration options that let you set Gnome to fit your preferences.


    Most of these configuration settings can be chosen in the Gnome Control Center,
    which you can open using the toolbox icon on the Panel, or by selecting Programs
    > Settings > Gnome Control Center on the Gnome main menu.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '> NOTE You must be logged in as root to set up some of the options in the Control
    Center.


    Although several types of settings can be configured in the Control Center—such
    as sound, CD properties, keyboard, and Palm settings—I''ll focus on the interface
    settings that are contained in the Desktop, Window Manager, and User Interface
    sections of the Control Center. These sections are located in a list along the
    left side of the Control Center window.


    > NOTE Red Hat also has a system administration tool called the Control Panel
    that''s worth exploring. It''s on the main menu at Programs > System > Control
    Panel. The two names can be confusing.


    To begin with, you need to understand a few basics about how the graphical system
    of Linux operates. The key here is that graphics in Linux consists of several
    layers:


    +   - The X server, which actually communicates with your graphical hardware.

    - A window manager, which provides graphical drawing for windows and other low-level
    interface components.

    - A desktop that provides file management, libraries for writing new programs,
    and other higher-level services such as font and color management.

    - Other graphical applications that use the services of the window manager and
    sometimes also those of the desktop.


    For example, the Gnome Portfolio Manager described in a previous section is tied
    to the Gnome desktop. It uses the programming libraries that come with Gnome.
    It also uses services of whichever window manager you'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'choose to use. Both Gnome and the window manager rely on the X server to actually
    send commands to the video graphics hardware for display.


    In Linux, you can use any of several desktop interfaces (such as KDE or Gnome).
    You can also use any of several window managers (such as km, twm, fvm, enlightenment,
    sawfish, and many others), and any of several X servers (such as XFree86, MetroX,
    and Accelerated-X).


    Gnome differs from KDE in that Gnome can use any compatible manager, whereas KDE
    could use the KDE window manager, kwm. Older versions of Gnome were shipped with
    the enlightenment window manager. Newer versions (including Red Hat 7) use the
    جاسک window manager. Both this window manager and the Gnome desktop features can
    be configured in the Gnome Control Center.


    If you''re coming from a Microsoft Windows environment, the range of configuration
    options available is truly astonishing. You can configure things never even considered
    in Windows. Some of these options may seem like option overkill, but consider
    that Linux enthusiasts are used to having the source code, which means that they
    have things just as they want them. How much nicer to have that capability in
    a graphical interface! Also, users of Linux (including yourself) may be interested
    in creating a Linux environment that is graphically similar to another system
    the user is comfortable with. This could be anything from a Macintosh or NeXT
    system, to a variety of UNIX hardware.


    To begin exploring, choose Desktop ▷ Selector in the Control Center window. You''ll
    see a list of Available Themes that contains about 15 pre-installed themes. A
    theme provides a complete look and feel for your desktop, without your having
    to configure the individual elements separately. The Preview section of the window
    shows how your system will look when you select one of the themes. You see a few
    buttons, menus, lists, and so forth. Here, I''ve selected a non-default theme
    to show you how this looks in the Preview window.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '![](img/35c1af90d4f3af9cd7cfd006c6b752f5_182_0.png)


    If you''re interested in themes, you can visit the themes .org site and download
    dozens of other themes, many complete with wallpaper graphics and new icons.


    > **NOTE** When you make a change in a section of the Control Center but move
    to another window before choosing OK, that item turns red on the left-hand list
    of subsections to indicate an un-executed change. You can return to that item
    and choose either OK or Cancel.


    The Desktop ➤ Background and Desktop ➤ Screensaver are similar to those of most
    other operating systems. But try the Desktop ➤ Panel item, shown here. In this
    window, you have five tabs full of options to set up how and where the Panel operates.'
  merge: -1
