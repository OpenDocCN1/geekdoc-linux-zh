- pgno: 376
  md: 'On some systems, the restart option isn''t supported, so you''ll need to use
    these two commands:


    ```

    # /etc/rc.d/init.d/smbd stop

    # /etc/rc.d/init.d/smbd start

    ```


    > NOTE On some commands, the startup script is named samba rather than smb. Check
    the /etc/rc.d/init.d subdirectory to see what your system uses.


    Finally, run the ps command given previously to see if the smbd and nmbd processes
    are running.


    # Test the Samba Server


    With the Samba server running, you should be able to view your Linux system from
    a Windows client (95, 98, NT, or 2000).


    Before you can access the Linux Samba server, you should be certain that the Client
    for Windows Networking is installed in the Configuration tab of the Network dialog
    box in your Control Panel. If you can see other Windows systems in the Network
    Neighborhood from your Windows computer, then the Windows client is working fine.


    The easiest way to access Linux Samba servers is to log in to your Windows system
    with a username and password that match what configured in the smpasswd file on
    Linux. Otherwise, you will have to enter the password when you attempt to access
    a resource on the Samba server.


    To access the Linux Samba server, follow these steps:


    +   1. On your Windows desktop, double-click the Network Neighborhood icon (this
    icon only shows up after your Windows networking has been set up in the Control
    Panel.


    +   2. If the Linux Samba server and the Windows client are in the same workgroup,
    the Samba server should appear in the Network Neighborhood window, as shown in
    here (note the server string on the left side of the figure—Brighton is actually
    a Linux system).'
  merge: -1
  img_proc: true
- pgno: 377
  md: '![](img/35c1af90d4f3af9cd7cfd006c6b752f5_377_0.png)


    3. If the Linux Samba server is in a different workgroup, double-click the Entire
    Network icon and then the icon for the workgroup that the Samba server is part
