- pgno: 268
  md: 'The middle button on the bottom row in gtcd offers the Preferences dialog where
    you can configure many settings for the Gnome CD Player, including access to CDDB.
    CDDB is a shared database of CD titles and track information on the Internet.
    By accessing CDDB servers around the world, you rarely have to enter information
    about your own CDs—the information is pulled from a server based on each CD''s
    identification number. Here is the CDDB portion of the Preferences dialog.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_268_0.png)


    The CD player provided by KDE, shown next, is similar in design to the Gnome CD
    Player. It also starts automatically when you insert an audio CD (if you''re running
    KDE as your desktop). Or you can start it by choosing Multimedia CD Player from
    the KDE menu.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_268_1.png)


    The KDE CD player includes a configuration button (the little hammer and screwdriver)
    and a button to access the CDDB setup (the file cabinet drawer). You can also
    use the “i” button to access Web sites with CD sales, concert dates, and similar
    music-lovers information.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# MAKE YOUR SYSTEM ENTERTAINING


    In addition to the default players included with KDE and Gnome, other CD players
    let you enjoy your audio CDs while working within any Linux graphical environment.


    A very nice CD player that you can use in any Linux graphical environment is xmcd.
    It''s located on the CD in the directory /Part07/Execute/Xmcd. This program replaces
    the KDE CD player, but I''m not sure who was first. It requires the openmifit
    package, which is located on the CD in /Part07/Pre-reqs.


    After I installed these packages, the xmcd program still couldn''t find its application
    defaults. Use the following commands after installing the Xcd package to merge
    the graphical resources for xmcd into the X Window System, then start the program:


    ```

    $ xrdb-merge /usr/X11R/lib/X11/app-defaults/XMcd

    $ xmcd

    ```


    The figure that follows shows the xmcd interface, which is quite nice. For this
    figure, I''ve opened the Options dialog box by clicking the hammer and screwdriver
    button, the keypad for access to specific tracks or time points on a CD) using
    the little grid button, and the CDDB/Track Editing dialog box using the file cabinet
    button. This gives you a good idea of some key features, in addition to showing
    the standard display and control buttons.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_269_0.png)'
  merge: -1
