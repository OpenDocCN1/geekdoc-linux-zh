    And, for those who have become Python fans and prefer it its object-oriented nature,
    the PyApache module, mod_python, lets you include Python scripts within an HTML
    page. This module is located on the CD at /Part08/Source/Apache_modules. A Red
    Hat 7 rpm package is also included in this directory.'
