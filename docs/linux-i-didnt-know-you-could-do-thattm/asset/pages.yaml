- pgno: 341
  md: '# 322 TURN YOUR SYSTEM INTO A SUPER SERVER


    Now if you duplicate the ifcfg-eth0 file and create a file called ifcfg-eth0:0,
    then place a new IP address in that file, that configuration will be used the
    next time your network is started up. Just use this command to create the new
    file:


    ```

    # cp ifcfg-eth0 ifcfg-eth0:0

    ```


    Then open the ifcfg-eth0:0 file in any text editor and change the DEVICE and IPADDR
    lines to eth0:0 and the second IP address that you want to use on your system
    respectively.


    > **NOTE** You should also change the BROADCAST, NETWORK, and NETMASK lines if
    the IPADDR for the IP alias is on another network segment.


    After you save the changes to the ifcfg-eth0:0 file, restart your networking with
    this command:


    ```

