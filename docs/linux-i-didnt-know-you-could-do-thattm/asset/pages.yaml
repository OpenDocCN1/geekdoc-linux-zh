- pgno: 149
  md: '# 130 SPICE YOUR DESKTOP


    install, but is included in the /Part04/Pre-reqs directory for your convenience.
    Just use these commands to get started.


    ```

    # rpm -Uvh /mnt/cdrom/Part04/Pre-reqs/wget-1.5.3-10.i386.rpm

    # rpm -Uvh --nodeps /mnt/cdrom/Part04/Execute/Netcomics/netcomics-0.13-1.noarch.rpm

    # rpm -Uvh /mnt/cdrom/Part04/Execute/Netcomics/netcomics-data-0_13-1.noarch.rpm

    ```


    Both the netcomics and the netcomics-data packages are set up to require each
    other as dependencies. For that reason, you must install one of them with the
    --nodeps (don''t check dependencies) option as shown in the commands above.


    The netcomics program is a command line utility that is intended to be used as
    a cron job. That is, a program that you execute automatically by setting up a
    scheduled task using the crontab command as I described in Item 18. Of course,
    you can also run netcomics as a regular command line utility, either to practice
    before setting up a cron job or to actually update your comics database.


    Despite being a comics program, netcomics is awfully full-featured. The man page
    of this command to see a list of the command line options available. The basic
    format for the command is:


    ```

    $ netcomics

    ```


    This causes the program to download all of the comic strips it knows about the
    default directory of /var/spool/netcomics. You can add the -1 parameter to see
    a list of all the comics that the program is aware of, with the code and name
    of each. This is useful when you want to retrieve just a few comics rather than
    all 250-something (the default action).


    ```

    $ netcomics -1 | less

    ```


    For example, to retrieve only the comics Beetle Bailey and B.C., use this command.
    (I looked up the codes using the -1 parameter.)


    ```

    $ netcomics -c bb bc

    ```


    The man page for netcomics includes dozens of other examples of how to use this
    command line utility. The program normally uses the wget command to retrieve files
    from the Internet, so if you haven''t installed the wget package as recommended
    above, you''ll see a long list of error messages when you attempt to retrieve
    comic strips.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# PERSONAL PRODUCTIVITY TOOLS AND TOYS 131


    NOTE You can choose to use a different command to retrieve comics, such as lynx-dump.
    Just use the -g parameter with netcomics.


    The man page also explains some simple methods for using a crontab command to
    set up netcomics to run regularly in order to keep your comics updated.


    WARNING As the man page specifically states, downloading comics is for personal
    use only, to relieve your mind on a busy day. Don''t break any copyright laws
    by reposting anything to the Web without obtaining written permission.


    After you have a few comics downloaded, you can use the show_comics command to
    view them. This command, which is part of the netcomics package you''ve already
    installed, determines when you will leave for the day, and displays new comics
    evenly throughout your day, depending on how many comics are available and how
    long you will be at your desk.


    By default, the show_comics program uses the xv program, which Red Hat 7 doesn''t
    install. You can install it from the /Part04/Pre-req directory using a standard
    rpm command. Or, you can use the -c option of the show_comics command to specify
    a different graphics viewer to use. For example, Electric Eyes (ee) and GQView
    (gqview) are both installed as part of Gnome.


    NOTE If you''re not familiar with xv, just right-click on the image to open a
    control window.'
  merge: -1
