  md: '# RUN OFFICE SUITES ON LINUX


    +   * A daily planner/organizer (similar to Outlook)

    * Access to FTP and newsgroup sites

    * A basic (nonrelational) database

    * StarBasic programming to customize all parts of the system


    A special tool called an Autopilot helps you create new documents in key areas,
    and access to Internet resources is tightly integrated into the other features.
    For example, when you view a Web page with StarOffice as a browser, you can immediately
    save that page and begin to edit it as you would any other StarOffice save.


    StarOffice uses a lot of system resources—you should have 64MB of memory for decent
    performance. It also requires about 150MB of disk space, although a networked
    installation uses only about 10MB in additional space for each user on the system.


    # Try the Free KOffice Suite


    One of the truly impressive parts of release 2 of KDE is the KOffice suite. This
    suite of applications has been in development for several years, and with the
    release of KDE 2, it is really becoming to come into its own, with enough good
    looks and features to make any Linux fan happy. Not that it''s done, but it''s
    certainly worth exploring and following up on.


    KOffice is installed as part of KDE 2. You can''t use it with KDE 1.x, so you''ll
    need to follow the directions in the previous section to get KDE 2 running (it
    isn''t difficult). As part of that process, KOffice is installed and ready to
    use from the main menu of KDE. If you skipped installing KOffice when you installed
    KDE 2 because of space considerations, you can go back to the directory /Part05/Execute/KDE2.0
    and use an rpm command to add the KOffice rpm to your system.


    > NOTE Remember that KOffice only works if you have upgraded your system to KDE
    2. It relies on all the latest libraries and functionality of KDE 2.


