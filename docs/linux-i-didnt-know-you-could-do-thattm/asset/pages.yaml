- pgno: 352
  md: '# Set Up a Linux Firewall


    As with most graphical programs, the nmap program doesn''t provide access to all
    nmap functionality. For example, the timing options that you can learn about in
    the man page are not supported in nmap. However, the ease of using nmap for many
    types of network scans still makes it a great tool to have on your system.


    When a local network is connected to other networks (or the rest of the world
    via the Internet), a router is used to pass data packets between the two (or more)
    networks. By setting up a firewall, you can control precisely which data packets
    are passed between the networks. This is one of the best ways to protect your
    system against intruder attacks.


    For a sensitive network, all access can be denied with only a few small exceptions
    according to individual situations (this is sometimes called punching a hole in
    the firewall to allow a person special access). For more generalpurpose networks,
    you can set up a looser firewall that lets most traffic pass through but is ready
    to be tightened if problems arise from inside or outside the network.


    Why not use the most restrictive rules on every firewall? As with security, the
    more secure a system is, the more difficult it is to administer it and the more
    hassle it causes to those who are authorized to use it.


    Linux includes all the firewall features you''re likely to need. In fact, if you
    spend the time to set up a strong Linux firewall file, most sites won''t need
    to purchase commercial firewall software. Unfortunately, setting up a firewall
    on any system is not an easy task; it''s certainly not one that can be covered
    in detail in this book. Setting up a strong firewall requires understanding the
    networking requirements of your servers and the users who sit at the client workstations.
    It requires that you know which networks have the greatest potential to cause
    you trouble, and how to protect your systems against the most likely attacks where
    they are the most vulnerable.


    Because the IP networking functions of Linux are a core part of the kernel, a
    Linux firewall is both secure and high-performance. The firewall features of Linux
    are implemented using a command called iptchains, which you may recall from the
    previous section on IP masquerading.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# 334 TURN YOUR SYSTEM INTO A SUPER SERVER


    NOTE In versions of the Linux kernel before 2.2, the Linux firewall features were
    configured using a command ipfwadm (for IP Firewall Administration). This command
    was similar to the ipchains command, but didn''t use the conceptual framework
    for organizing rules into multiple chains based on the destination of a network
    packet.


    The ipchains command is installed by default on Red Hat 7. I''ve also included
    the IP Chains package on the CD in /Part09/Execute/ipchains. You can install it
    using a standard rpm command.


    The idea behind IP Chains is that you have a chain or list of rules that each
    network packet must pass through. The default chains included in this scheme are
    the input, output, and forward chains, for packets coming into, going out of the
    Linux system, and being forwarded from the Linux system to another router, host,
    or network respectively. You can also create your own custom chains in addition
    to these three default chains.


    NOTE A rewritten version of packet filtering is included in the Linux 2.4 kernel.
    This version—called IP Tables or NetFilter—will require you to relearn some of
    the command structure described here. An IP Chains compatibility mode is provided,


    To start learning about the ipchains command, enter:


    ```

    # ipchains -h

    ```


    A few examples may be more helpful at first than the full list of options in the
    help screen. To use IP Chains, you use the ipchains command to add rules to each
    chain. For example, you could add a rule to the input chain stating the any packet
    with a source address of 192.168.100.0/24 (any packet from that network, since
    the last 0 indicates a network address with the 24 bit host address mask given
    after it) should be rejected. Here is that command:


    ```

    # ipchains -A input -s 192.168.100.0/24 -j REJECT

    ```'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# ENHANCE YOUR NETWORK SECURITY


    The -A option appends a rule to the named chain. The -s option specifies the source
    address of the packets. The -j option defines where to jump to More complex rules
    (and you''re likely to have many) would include a -d option to indicate the destination
    address and possibly -p option to specify the protocol of the packet (such as
    ICMP, TCP, or UDP). Many other options are also available.


    NOTE One of the more interesting options is the -m option, which allows you to
    mark a packet with a number to use with the Quality of Service features of the
    Linux kernel.


    The jump to possibilities (for the -j option) include the following:


    +   ACCEPT to immediately reject the packet


    +   REJECT to immediately reject the packet and send a reply to the sender to
    that effect


    +   DENY to immediately reject the packet but not reply to the sender (as if the
    packet had not even been received)


    +   MASQ to masquerade the indicated packets (only valid within the forward chain)


    +   RETURN to act as if this rule was the last one of the chain, which lets the
    packet be controlled by the default policy of the chain.


    The default policy associated with each chain indicates what should be done with
    a packet that passed all the rules. You can use a default policy to set up a firewall
    that is more restrictive (REJECT by default) or less restrictive (ACCEPT by default).
    The -P option sets the policy. For example, to set an ACCEPT default policy for
    the input chain, use this command:


    ```

    # ipchains -P input ACCEPT

    ```


    As mentioned in the last section, you can use the -F option to flush (delete)
    all rules from all chains, and the -L option to list the current rules in all
    chains.


    A complete firewall consists of dozens or even hundreds of ipchains commands,
    each implementing a rule that the administrator wants as part of a secure system.
    You can learn more about using IP Chains'
  merge: -1
  img_proc: true
