    # Explore the Latest Kernel with httpdpd


    As of this writing, the 2.4 Linux kernel has recently been released. Although
    this kernel is not part of Red Hat 7, it has a great new feature for Web serving
    that might make you consider upgrading to a Linux 2.4 kernel. That feature is
    called httpd, or the kernel HTTP daemon.


    The kernel HTTP daemon allows an incoming Web server request to be handled by
    the kernel rather than Apache or another standard Web server. Using the kernel
    provides the fastest response possible because it has so much less overhead compared
    to passing information to a server like Apache does.


    The catch is that the kernel HTTP daemon can only process plain files; no cgi,
    no database queries, no modules, etc. But for basic files, the kernel is a great
    choice. Of Course, the kernel HTTP daemon is designed so that it'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# TURN LINUX INTO A WEB SERVER


    cannot handle the request, it is passed on to a regular server like Apache-

    so the two can work in concert to get the most out of your Web server.


    > NOTE Using the kernel HTTP daemon works great for image servers, which consist

    entire of small static files.


    Because it only serves static files, the kernel HTTP daemon is fairly easy to

    set up. You just activate it with a couple of parameters to indicate how to

    serve files and where to pass complex requests for processing.


    Because the Linux 2.4 kernel is still in its 2.4.0 release, I recommend visiting

    one of the download sites I mention elsewhere (such as fresh.net or

    lux.org) to download the latest kernel source tree. Installing the latest

    kernel is not a simple task, and you should expect that some parts of Red

    H 7 may not work after you upgrade to Linux 2.4. Don''t plan on using this

    a on production Red Hat Linux server unless you''re very experienced

    with Linux. Otherwise, wait until Red Hat releases a newer product that has

    the Linux 2.4 kernel integrated and tested with the other packages that Red

    Hat includes.


    # 35 Track Your Web Site Traffic


    Each time a browser accesses your Web site, an event is logged to the

    Apache access log. On Red Hat 7 systems, this file is /etc/httpd/logs/

    access_log. The location may vary on other Linux systems but the filename

    is generally consistent. The information in the access log includes the IP

    address of the client browser, the date and time of the request, and the

    HTTP command (which includes the filename being requested).


    Even on a site without much traffic, the access log often has a lot of data.

    On larger sites, it must be rotated regularly (daily or weekly) to avoid filling'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# TRACK YOUR WEBSITE TRAFFIC 299


    the hard disk with a record of Web page accesses. A few lines from the access
    log log might look like this:


    ```

    192.168.100.4 - [25/Mar/2001:15:16:53 -0700] "GET / HTTP/

    1.0" 200 1879

    192.168.100.4 - [25/Mar/2001:15:16:55 -0700] "GET /head.gif

    HTTP/1.0" 200 17446

    192.168.100.4 - [25/Mar/2001:15:16:55 -0700] "GET /

    mmback.gif HTTP/1.0" 404 204

    192.168.100.3 - [25/Mar/2001:15:17:06 -0700] "GET /

