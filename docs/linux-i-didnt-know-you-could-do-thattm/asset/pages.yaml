- pgno: 270
  md: '# CREATE A LINUX-BASED MUSIC STUDIO


    Of course, CDs aren''t the only way to collect digital music. Web sites like www.mp3.com
    and many others provide sample tracks or let you create and download personalized
    music collections. Most of these are likely to be in MPEG3 audio (.mp3 files).
    Linux supports these and other audio formats including:


    +   - MPEG3 (.mp3 files)

    - WAV

    - au files

    - MIDI (.mid files)


    One important distinction to know in digital music is that a description of musical
    properties, while WAV and MPEG formats are digital recordings (compressed, of
    course). Another way to explain the difference between these formats is MIDI is
    like a PostScript file, while WAV and MPEG are PCX bitmapped images.


    It''s important to know the difference between these formats because a MIDI player
    (such as the one included with KDE) must be able to interpret the "instruments"
    described in the MIDI file in order to create sound waves, while the other formats
    require (in the broadest sense) dumping the audio data to the sound card. Thus,
    different utilities may have different capabilities with various audio formats.


    If you want to play one of your MPEG3 audio files without even being in X, you
    can use the mpg123 command line program to start a file playing in the background
    as you:


    ```

    $ mpg123 chop.mp3

    ```


    The mpg123 program is installed by default on Red Hat 7. The rpm is also located
    on the CD in /Part07/Execute/mpg123. The mpg123 command line program has many
    features; just enter the mpg123 command without any filename after to see a summary
    of them. For example, using this program you can:


    +   - Adjust audio hardware gain

    - Repeat frames of the audio a specific number of times

    - Shuffle or randomly select from among multiple files

    - Mix both audio channels into mono output

    - Downsample the audio file to 22 kHz (from the 44kHz standard)

    - Use a URL as an input parameter to select an audio file to play


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_270_0.png)'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'The man page for mpg123 includes more detailed information.


    For those with the Gnome desktop, GQMpeg provides an attractive interface similar
    to a CD player. GQMpeg plays MPEG (.mp3) audio files using the mpg123 command
    as an underlying tool. You can open GQMpeg''s configuration dialog box using the
    tiny wrench button above the playlist button on the lower right corner of the
    GQMpeg interface. Here, you can see some of the types of options that it provides:


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_271_0.png)


    GQMpeg is included in /Part07/Execute/GQMpeg on the CD. It''s a standard rpm package,
    so it should be simple to install.


    In addition to being able to play files in several popular audio formats (including
    MPEG3 and WAV), Xwave is an audio editor. With Xwave, you can cut and paste to
    edit an audio file. The next figure shows Xwave linearly tracking a digital audio
    file as it is being played.


    Some of the things you can do with an audio clip in Xwave include the following:


    +   - Change the frequency of the sampling for the clip


    +   - Add echoes'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# CREATE A LINUX-BASED MUSIC STUDIO 253


    +   ◆ Reverse clips


    +   ◆ Cut, copy, and paste portions of a clip


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_272_0.png)


    Xwave is located in /Part07/Execute/Xwave on the CD. A plain binary file is included
    in this directory, but you must also add the graphical resource information contained
    in the xwave-def file (in the same directory on the CD) to the X Window System.
    These commands on Red Hat 7 will set up the graphical resources and execute Xwave
    with the sample file chopin5.wav (you can substitute the name of any audio file
    on your system):


    ```

    # xrd-merge /mnt/cdrom/Part07/Execute/Xwave/xwave-def

    # xwave chopin5.wav

    ```


    An ambitious project for playing audio files is the Xms project, formerly the
    x11amp project. Xms has the ability to accept plug-ins in the form of libraries
    designed to perform various operations on audio files. Xms is installed by default
    on Red Hat 7 with plug-ins to support the following actions:


    +   ◆ Playing audio CDs


    +   ◆ Playing MPEG audio files


    +   ◆ Playing WAV audio files'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   * Generating tones


    +   * Displaying a spectrum analyzer and oscilloscope


    +   * Separate volume and balance controls


    +   * Support for streaming audio servers, including icecast


    The next figure shows Xmms with the equalizer and playlist editor (to help manage
    a list of audio files). You can right-click anywhere on the control window to
    select control and configuration options from a long pop-up menu.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_273_0.png)


    The home page for the Xmms project is www.xmms.org. The rpm files for Xmms are
    included on the CD in the directory /Part07/Execute/Xmms for those who aren''t
    using Red Hat 7.


    You can run Xmms using the xmms command from any graphical command line in Red
    Hat Linux 7. You''ll notice that the image you see doesn''t match exactly what
    I''ve shown in the figure. That''s because Xmms allows you to load skins—or interface
    designs—to suit your preferences. By default, Xmms displays with a mostly black
    background. But by loading the xmmskins package, you can select from almost 30
    different looks.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'The mmmskins package is also on the CD in the directory /Part07/Execute/Xms.
    You can install it using a regular rpm command. It isn''t installed by default
    in Red Hat 7.


    I chose the skin tinted Ultrafina for the figure because I thought it would work
    for our black-and-white printout. To choose a new skin after you''ve installed
    the mmmskins package, right-click on the main Xms window and choose Options >
    Skin Browser. A dialog box appears in which you can select the skin you want to
    use. When you click on a skin in the dialog box, you immediately see how it looks
    on the main Xms interface.


    Another package, The X mixer, Xmmix, has a similar name to Xms, but not a similar
    look. You can install this package using a standard rpm command. It''s located
    on the CD in the directory /Part07/Execute/Xmmix. Execute it with the xmmix command.
    Xmmix also requires the motif package located in /Part07/Pre-reqs over the CD.


    The Xmmix program, shown next, allows you to mix incoming audio channels from
    several sources and adjust your volume for the outgoing sound that you hear on
    the computer''s speakers.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_274_0.png)


    # Manage Your Sounds


    Several synthesizers are available that enable you to create your own music in
    Linux. Snaehesia is a basic music synthesizer package. It''s located on the CD/Part07/Execute/Snaeesthesia.
    You can install it using a standard rpm command if you first install the svgalib
    package, which is included in the directory /Part07/Pre-reqs.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# 256 MAKE YOUR SYSTEM ENTERTAINING


    A more advanced project is the Analog RealTime Synthesizer (ARTS). ARTS is intended
    to simulate a modular analog synthesizer, creating sounds using various modules
    to create waveforms that can be graphically combined. Many different filters or
    modules are included to create different sounds. After you use the graphical interface
    to create a piece of music, the synthesizer executes the modules that you have
    created, sending the waveforms to the sound card.


    A complete home page for the ARTS project can be found at www .arts-project.org/.
    The following figure shows how modules can be seen in the graphical display of
    the ARTS synthesizer.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_275_0.png)


    The interesting thing about the ARTS project since the first edition of this book
    is that ARTS was chosen as the sound system for KDE 2. So if you''re using KDE
    2, you''re using the ARTS system (in its basic form) to produce all the sounds
    of KDE programs. The KDE documentation and Web site have additional information
    about what this powerful suite of audio tools.


    If you have many files that are in MIDI format and need to play them or convert
    them to WAV format for another type of player (such as Xmms), you can use the
    TiMidity++ package, located in /Part07/Execute/ Timidity++ on the CD. The program
    name after you install the rpm is timidity, all in lowercase.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# CREATE A LINUX-BASED MUSIC STUDIO


    This is a command line program that takes a MIDI file as input and creates a WAV
    file using the name you supply. Timidity includes a very extensive manual page
    describing all of its features.


    SoundTracker is more like what you''re probably expecting when you hear words
    music synthesizer. The following figure shows the main window of the program,
    which you can install using a standard rpm command from the directory/Part07/Execute/SoundTracker
    on the CD. Launch the program using the command tracker.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_276_0.png)


    In SoundTracker you can create instrumental sounds and combine them into music
    files, adjusting things like tempo and volume mix of each instrument. Once you
    have a piece of music like you, you can render it as a WAV file so that you can
    distribute it or in order to play it yourself using simpler player programs as
    we''ve already described.


    SoundTracker includes oscilloscope displays, an automatic transposition dialog
    box, and dozens of configuration options for loading new capabilities as modules
    or setting up the keyboard, audio options, and others. Unfortunately, SoundTracker
    doesn''t have much documentation as you might like if you''re new to this type
    of program. A few files (starting with a README file) are located in /usr/share/doc/soundtracker-0.5.5.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'You can also learn a lot by visiting the Web site for SoundTracker at www .soundtracker.org.


    A similar type of sound editing program is SoundStudio. SoundStudio includes a
    visual plot of an audio clip and gives you the ability to copy, cut, and paste
    segments of a clip. In addition, SoundStudio provides the following effects (from
    the Effects menu) to alter a digital sound clip:


    +   - Echo

    - Vibrato

    - Fade

    - Reverse

    - Volume

    - Tempo

    - Reverb

    - Flanger

    - Phaser

    - Chorus


    Volume sliders at the bottom of the SoundStudio window let you adjust the volume
    of input and output channels independently. The next figure shows the main SoundStudio
    window with an information dialog box on the right. You can open this information
    dialog box by choosing File ➤ Information on the SoundStudio menus.


    SoundStudio includes an Options menu where you can select settings for colors,
    display options, and other parameters. In addition, you can choose Help  ➤ User''s
    Guide to open a complete hyperlinked description of how to use SoundStudio.


    > NOTE SoundStudio is a tcl/Tk scripted program.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# CREATE A LINUX-BASED MUSIC STUDIO


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_278_0.png)


    SoundStudio is located in /Part07/Execute/SoundStudio on the CD. You can install
    it using a standard rpm command. You can start it after installation using the
    command studio.


    # Other Sound Tools


    If you''re more interested in listening to music than in making new music, you''re
    probably already familiar with Napster. This program has a fair amount of controversy
    in the past, but without getting into that I''ll just explain that Napster is
    a graphical program designed to help you easily share music files across the Internet
    with any other users who want to share their music files.


    Using Napster, you can "publish" a list of songs that you have and are willing
    to make available. You include information such as the artist and song title,
    as well as how fast your connection to the Net is.


    > **WARNING** Be certain to read the warnings printed in software and on the Napster
    Web site about distributing copyrighted material. Don''t do it!'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# MAKE YOUR SYSTEM ENTERTAINING


    You can then search for music files that you''re interested in, using the Napster
    servers to locate someone who has the song files you want to download. Most music
    files are in MP3 format, so you can use any of the players such as mpg123, GQMPpeg,
    or Xmms to play the files.


    The directory /Part07/Execute/Napter includes an unofficial Linux client for accessing
    Napster servers. Install this package with a standard rpm command. Launch the
    program using the command napster.


    > NOTE You can also download an official client at www.napster.com.


    To begin using Napster, use the Connect icon to set up an account. You''ll need
    to select a username and password, as well as enter your e-mail address and connection
    speed. After you set up this information, you won''t have to enter it again to
    connect.


    The program searches for a Napster server and lets you enter searches or download
    the music files that you''ve located, as shown here:


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_279_0.png)


