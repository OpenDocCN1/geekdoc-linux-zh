    192.168.100.2 - [01/Jun/2001:21:06:03 -0600] "GET /01ch.html

    HTTP/1.0" 200 11254

    192.168.100.2 - [01/Jun/2001:21:06:18 -0600] "GET /02ch.html

    HTTP/1.0" 200 187091

    ```


    The contents of the Apache log can be configured using the CustomLog and LogFormat
    directives, but the previous lines show the Common Log Format (CLF), which is
    used by default on Apache and most other web servers.


    The basic method of using these two directives is to define a log format using
    the LogFormat directive, then activate that format by using a Custom-Log directive
    to specify a filename to store that information in. The httpd.conf file, located
    at /etc/httpd/conf, contains examples (for the Common Log Format and others) on
    lines lines 582 through 598.


    > NOTE Several Apache modules log other information as well, such as the referrer
    (Web page that the person is coming from to reach a page on your server) and the
    agent (the type of browser that the client is using to request a page).


    Having all this information recorded is valuable for several reasons, such as
    tracking who is accessing your site and which pages are most popular. The information
