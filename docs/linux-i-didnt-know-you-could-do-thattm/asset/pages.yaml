    # # Use the AbiWord Free Word Processor


    AbiWord is a very nice word processor that is completely open source. It has been
    in development for several years and has definitely reached the point of being
    a truly useful tool.


    AbiWord doesn''t try to be a clone of Microsoft Word; its ambitions are simpler
    than that. But it does provide a clean interface and all the features that most
    of us use in those expensive commercial word processors that we are accustomed
    to.


    The rpm file for AbiWord is located on the CD in the directory /Part05/Execute/AbiWord.
    Use a standard rpm command to install the program. After installing it, use this
    command to run it (note the non-standard capitalization for a Linux program):


    > $ AbiWord &

    In the main window of AbiWord, you can see a standard tool bar and drop-down lists
    for the paragraph style, font, and type size of the current paragraph. A page
    view is presented by default, with rulers and a zoom tool to help you adjust the
