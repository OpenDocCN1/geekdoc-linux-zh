- pgno: 403
  md: 'A program related to all these faxing tools is the Gnomeii package, which provides
    a suite of UNIX-like utilities for your Nokia cell phone. The Gnomeii package
    is included on the CD in the directory/Part11/Execute/Gnomeii. You can install
    it using a standard rpm command.


    The Gnomeii package includes a gnomeii command-line program and an xgnokii graphical
    program. The gnomeii utility provides dozens of options for controlling your mobile
    phone, such as setting speed-dial numbers, managing calendar notes, and setting
    up alarms and logos. No man page is provided for this utility, but you can see
    a list of options by using the command without any options:


    ```

    $ gnokii | less

    ```


    You can start the graphical interface to Gnomeii with the xgnokii command.


    # 45 Share Information


    Computers provide many methods of communication, though e-mail is most common.
    The Linux tools in this section let you improve your communication using voice,
    video, and other tools via your Linux computer and the Internet.


    The Chat protocol, IRC, is a very popular way to communicate with friends (and
    occasionally strangers) on the Internet. The KDE desktop provides a graphical
    IRC client called ksirc; it is part of the default installation for both KDE 1.1.2
    and KDE 2. You can start this client from the KDE Internet submenu.


    The main window of ksirc shows your active server connections (you can have some
    of these start automatically when you launch the program). To start a chat session,
    choose Connections ▷ New Server and select the appropriate items from the Connect
    to Server dialog box.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# SHARE INFORMATION 385


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_404_0.png)


    Setting up a chat connection is simple, but kSir provides many other options to
    configure how you connect, the program looks on-screen, and other settings. To
    see or change the settings, choose Options-Preferences. Other settings are controlled
    using different items on the Options menu.


    If you prefer to talk by voice instead of typing your conversation, you might
    already have heard of Internet phone technology. This allows you to digitize your
    voice and send it over an Internet connection to another person, like a phone
    call but without the per-minute distance-based charges.


    The Speakfree program is a Linux voice-over-Internet utility, which enables you
    to converse over the Internet, just like the Internet phone products. The quality
    of the voice and how quickly you can talk are determined by your throughput; however,
    if your connection isn''t fast enough for a regular conversation, several forms
    of data compression are available to help out. Encryption using DES, IDEA, or
    PGP is also supported.


    > NOTE Speakfreely is also available for Windows, so all the people you talk with
    don''t need to have Linux installed.


    Speakfreely source code is located on the CD in the directory /Part11/Source/Speakfreely.
    Although no binaries are provided, compiling the program is a simple matter of
    untarning the package and using the make command. That said, using this package
    requires some reading and configuration that go beyond the scope of this book.'
