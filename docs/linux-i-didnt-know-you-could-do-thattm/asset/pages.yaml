    directory /Part02/Execute/Ext2ed. You can install it using a standard rpm command,
    then run it with the ext2ed command.


    ```

    # rpm -Uvh ext2ed-0_1-23_i386.rpm

    # ext2ed

    ```


    The next figure shows the main screen of ext2ed, with a brief list of commands.
    The ext2ed program is about as hard to use as lde, so you''ll want to do some
    studying before taking any risks with editing your file systems.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_107_0.png)


    > WARNING As with lde, don''t ever try to edit any data on a mounted system or
    you risk making it unusable!


    Ext2ed includes a man page, but it doesn''t have any detail about using the program.
    Instead, change to the directory /usr/share/doc/ext2ed-0.1/ after installing the
    rpm. In this directory, you''ll find three documents to'
