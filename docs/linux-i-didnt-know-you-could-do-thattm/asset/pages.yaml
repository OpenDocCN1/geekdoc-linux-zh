- pgno: 124
  md: 'KDE uses a different method to automatically start programs. The KDE desktop
    includes a folder called Autostart. By placing a program''s icon in this folder,
    the program is started automatically when KDE is launched.


    In case you''re not familiar with KDE, I''ll walk through the steps of creating
    a KDE icon to represent a program that you want to auto-start. This process is
    the same whether you want to create the icon in the Autostart folder, or in another
    folder.


    +   1. Click the Autostart folder to open the Autostart window.


    +   2. Choose File ➤ New ➤ Application within the Autostart window.


    +   4. After a moment, a properties dialog box appears (the title bar says kfm).
    Click on the Execute tab, as shown.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_124_0.png)


    +   5. In the Execute field, enter the name of the program as you would enter
    it in a command line.


    +   6. If you want to change the icon displayed for the program within the Autostart
    folder, click the small gear icon and select a new icon from the dialog box that
    appears.


    +   7. Choose OK to close the Properties dialog box.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'The next time you start the KDE desktop, the program name you entered

    in the Execute field in step 5 will be started for you automatically.


    # Run Any Program

    Any Time


    Running programs automatically when you log in is a great feature, but even DOS
    can do that. Linux also lets you set up specific times and dates to run any program
    you choose. As long as your computer is on, the program will run unattended and
    e-mail you the results.


    Running programs automatically is great for all sorts of administrative tasks
    and little electronic errands such as:


    +   * Sending yourself reminder messages about meetings or other things you need
    to take care of at a certain time

    * Backing up your system in the middle of the night

    * Automatically checking system logs with log analysis programs

    * Downloading large files while you sleep

    * Querying a stock price every 10 minutes and compiling a graph


    All of these can be done easily in Linux using crontab and at commands. The root
    user on your system can set up files to allow or deny rights to run automatic
    programs using crontab and at. This is done by setting up a text file /etc/cron.allow
    or /etc/cron.deny and including usernames in one of these files. If neither of
    these files is present (which is the default on most Linux systems, including
    Red Hat 7), all users can run-automatic programs using crontab and at.


    The two commands crontab and at are used a little differently: crontab is for
    recurring tasks; at for single tasks that are scheduled for a later time but are
    not necessarily recurring. However, using either program is often referred to
    as setting up a "cron job." The process of using crontab, in particular, can get
    a lot more complicated than what I am describing here—crontab is a mainstay of
    Linux system administrators.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Setting Up a One-Time Task


    To use at to schedule a one-time task for automatic execution later, follow these
    steps:


    +   1. Run the at command with the date or time you want your commands executed.
    A prompt for entering the at command appears.


    ```

    $ at 19:30

    at>

    ```


    The methods of specifying dates and time for at can be very complex if you need
    them to be. The following table shows some examples of how to format the date
    and time. The man page for at describes specifics about how to specify execution
    times.


    | at 19:30 | 7:30 P.M. tonight (or tomorrow if it''s past that time already) |

    | at now+10 minutes | 10 minutes from when you press Enter |

    | at Jun 3 6:00 | 6:00 A.M. on June 3 |

    | at 11/10/01 | Right after midnight on November 10, 2001 |


    +   2. At the at>prompt, enter the commands that you want to execute as if you
    were entering them on a regular command line.


    ```

    at>ps

    ```


    +   3. After entering all of the commands you need to execute, press Ctrl+D. The
    at command responds with the job number and date and time that the job will be
    executed. For example:


    ```

    Job 5 at 2001-11-01 19:02

    ```


    > NOTE The programs that process at and crontab commands check for something to
    do each minute, so you can''t be more precise than that when using these commands.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_126_0.png)'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'If you need to see when you have tasks (jobs) scheduled using at, run

    the atq command:


    ```

    $ atq

    6 2001-11-01 19:14 a

    8 2001-11-02 00:05 a

    ```


    If you want to cancel the execution of a job that you scheduled at

    ate, use the atrm command with the job number (if you don''t know

    the job number, you can find it using atq).


    $ atrm


    +   4. The job numbers are specific to your user account. Each user has a

    separable queue of tasks that have been submitted using at.


    What happens to the output generated by commands that you enter using

    at? It is automatically e-mailed to your user account. This allows you to

    review the output whenever you choose to (a helpful feature when running

    programs at 2:00 A.M.).


    # Setting Up Recurring Automatic Programs


    The program is great for single tasks, but if you want to run a program

    at regular intervals, such as once per week or once per hour, the crontab

    program can set up a regularly scheduled task for you.


    Using crontab is a little more complicated than using at, because the time

    formats are more complex, and you must create a text file containing the

    information about your task.


    To use crontab, create a small text file containing the commands you want

    to execute. An example is shown here, taken from the crontab map-page:


    ```

    # /bin/sh to run commands, no matter what /etc/passwd says

    SHELL=/bin/sh

    # mail any output to `paul`, no matter whose crontab this is

    MAILTO=paul

    #

    # run five minutes after midnight, every day

    5 0 * * * $HOME/daily.job >> $HOME/tmp 2>&1

    # run at 2:15pm on the first of every month -- output mailed to

    paul

    15 14 1 * * $HOME/bin/monthly

    ```'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# run at 10 pm on weekdays, annoy Joe

    0 22 * * 1-smail -s "It''s 10pm" joe%Joe,%%Where are your kids?%

    23 0-23/2 * * echo "run 23 minutes after midn, 2am, 4am ...,

    everyday


    5 4 * * sun echo "run at 5 after 4 every sunday"

    Line of the text file contains a description of what to run that com-mand and
    the command itself. Lines can also contain environment vari-ables such as MAILTO=paul,
    which defines a user who should receive the

    e-mailed output from these commands.


    > **NOTE** As with the at command, output from any commands you run crontab is
    mailed to you. If you don''t include a MAILTO setting in this example file, the
    e-mail will come to whoever submitted the command file using crontab.


    Figuring out the definition of when to execute the command is the chal-lenge with
    crontab files. Each of the five fields are described in the follow- table, from
    left to right as they appear on each command line of the

    sample file above.


    | | |

    |---|---|-|

    | | Minute | 0-59 |

    | 2 | Hour of the day | 0-23 |

    | 3 | Day of the month | 0-31 |

    | 4 | Month | 0-12 (or names, using the first three letters, upper- or lowercase)
    |

    | 5 | Day of the week | 0-7 (0 or 7 is Sunday; names can also be used, as with
    months) |


    If a field contains an asterisk, all possible values are used for that field.
    For example, if an asterisk is in the Month field, the command is executed every
    month; if an asterisk is in the Hour field, the command is executed every hour.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Looking more closely at the example file, the following line will run the command
    portion (starting with $HOME/bin/daily.job) every date of the year at five minutes
    after midnight (hour 0):


    ```

    # run five minutes after midnight, every day

    5 0 * * * $HOME/bin/daily.job >> $HOME/tmp/out 2>&1

    ```


    The output from the daily.job script will be added to the end of the output file
    (the /tmp/out path within your home directory) because of the >> operator. Any
    errors that occur are also sent to the file as regular output (the 2>&1 does this).


    To change this to run only on Mondays, the first five fields would change like
    this:


    ```

    5 0 * * 1 $HOME/bin/daily.job >> $HOME/tmp/out 2>&1

    ```


    To run on the 1st, 10th, and 20th of every month, they would be:


    ```

    5 0 1,10,20 * * $HOME/bin/daily.job >> $HOME/tmp/out 2>&1

    ```


    When you use a list or range of times like this (1,10,20), don''t use a space
    between the commas. A space is only used to separate the five fields. Once you
    have a file set up with your commands and their times and days of execution, you
    simply submit that file to the system using the crontab command:


    ```

    $ crontab my_cron_file

    ```


    That''s the only step. All the commands in the file are stored internally. The
    cron process checks once each minute as long as your system is turned on. Any
    commands that are scheduled for execution are run and the output is e-mailed to
    you.


    You might think that it would be a lot easier if someone set up a graphical tool
    to handle setting up cron jobs. In fact, several attempts have been made, including
    programs like cron for KDE. Most of these efforts have not been good enough to
    replace the use of old-fashioned text files for system administrators.


    Users of Red Hat 7, however, can always use the LinuxConf utility to set up a
    cron job. By selecting the Control tab under Panel > Configure superuser scheduled
    tasks, you can see a list of scheduled tasks. After you choose Add, you can enter
    a command to execute, and then specify which months, days, minutes, etc. to execute
    that command. The format of the'
