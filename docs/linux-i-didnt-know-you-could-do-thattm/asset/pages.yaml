- pgno: 151
  md: '# 20 System Admin Tools


    Both Gnome and KDE include a full suite of system administration tools. However,
    there are a few tools that are new, specialized, or still relatively unknown.
    This section tells you how to take advantage of some very useful tools that aren''t
    included in the default desktop distributions.


    # Manage File Systems Graphically


    If you need to access multiple file systems either locally (on hard drives attached
    to your PC) or remotely (using the NFS remote mounting protocol), you''re probably
    familiar with the mount command and the /etc/fstab file. The kfstab utility gives
    you a graphical interface through which you can review and add mounted file systems.


    Kfstab is located in /Part04/Execute/Kfstab on the CD. When you start the program,
    you see the window. From this window, you can add or remove any of the available
    or mounted file systems.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_151_0.png)


    You can alter the configuration for how your file system will be mounted on your
    system by changing any of the fields in the main kfstab window. When you want
    to define a new file system, change all of the fields, starting with the device
    name and mount point, then click the Add button.


    Although the kfstab utility is simply acting as an editor for the /etc/fstab file,
    it makes much easier to see all the available options (click Preferences next
    to the Options field) and so forth. When you have made any changes, click the
    Save button to update your /etc/fstab configuration file. Remember that the file
    systems are not accessed directly via'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'the kstab program; this utility just helps you define the file system table
    that other programs use to automount devices such as floppies, CDs, and even remote
    NFS servers.


    If you have the kdu or kf utilities installed on your KDE system, they are made
    available via the Tools menu. These utilities can be used to see the free space
    and disk devices mounted on your system, as well as the space used by a directory.


    The LinuxConf that comes with Red Hat 7 has a similar capability. LinuxConf utility
    is arguably more advanced, but it is also more complicated to use than a single
    KDE program, so I mention both.


    This window shows the LinuxConfutity with the Config tab activated and the File
    systems Access local drive item selected. The second item, Access nfs volume,
    provides similar functionality for remote (networked) file systems that we use
    the NFS protocol.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_152_0.png)


    # Monitor Program Activity


    As you work with your Linux system, starting multiple programs and working in
    multiple windows, it''s helpful to have access to a list that shows which programs
    were started from within a particular environment. For'
  merge: -1
  img_proc: true
- pgno: 153
  md: "example, if you start a graphical program from within a command-line\nindow\
    \ and then close the command-line window, the graphical program\nwill end as well.\
    \ The kpstree utility helps you avoid shutting the wrong\napplication down. This\
    \ tool shows the relationships between processes as\na graphical tree.\n\n![](img/35c1af90d4f3af9cd7cfd006c6b752f5_153_0.png)\n\
    \nThe utility is located in /Part04/Execute/Kpstree. Although you can't do\nmuch\
    \ else with the kpstree utility besides look at the process tree, this\nalone\
    \ can be informative, especially for those new to Linux. You can see\nhow the\
    \ login program starts a shell, which then starts another program,\nand so forth.\n\
    \nKpstree does let you sort the process tree by name or by process ID number\n\
    (PID). You can also remove (kill) a process that you click (be careful which\n\
    \ you kill!), and you can set the refresh rate for how often the informa-\tion\
    \ is updated on screen.\n\nKpstree is similar to using the ps and top utilities\
    \ on a command line. In\nconjunction with kpstree, you may find the ktop KDE utility\
    \ useful. It"
  merge: -1
  img_proc: true
- pgno: 154
  md: 'doesn''t display the processes in a tree diagram, but it does allow more

    interaction with the processes, such as providing the ability to change pro-

    cess priorities.


    The ps command, which is the standard tool for viewing process informa-

    t, also includes an option that displays details similar to kpstree,

    ough in a character-mode display. Use the f option to make ps display

    processes in a tree format. Here is an example I like to use:


    ```

    $ ps axf | less

    ```


    The ps tree command also displays processes in a tree format, but doesn''t

    include all the details that the ps command displays. For this reason, I pre-

    fer kpstree if I want a nicer format than the ps command provides.


    # Configure Your Hard Disk Boots


    If you''ve set up your system to handle multiple operating systems or mul-

    tiple kernels, you''ve probably used the lilo command and the /etc/

    lilo.conf configuration file. KLILO provides an easy-to-use graphical

    interface for modifying the LILO configuration and updating on your

    hard disk.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_154_0.png)


    > WARNING Use KLILO only with great care. If you''re not familiar with how

    Linux boots and uses the LILO boot manager, you could make changes that will

    prevent LILO from booting.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_154_1.png)


    The KLILO utility is located in /Part04/Execute/Klilo on the CD. Although

    this program doesn''t include configuration of all possible LILO features

    (such as passwords, boot parameters, and message text), it makes easy

    to review and update simple configurations without using the command line.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_154_2.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 136 SPICE UP YOUR DESKTOP


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_155_0.png)


    Using KLILO, you can add a configuration for additional operating systems or Linux
    kernels on your computer by clicking the Add button. Once a system is added, you
    can use the Edit button to set up the hard disk device, select which kernel to
    run, and so forth. The overall configuration options at the top of the dialog
    box let you set up where to install LILO and determine what the delay will be
    before starting up the default operating system (the first one listed in the Operating
    Systems list).


    After configuring your lilo.conf file using KLILO, press the Install button to
    run the lilo command and copy this configuration to the boot sector, Master Boot
    Record, or a floppy disk (you must be logged in as root to install LILO).


    You can use a set of configuration dialog boxes similar to KLILO in the LinuxConf
    tool. On the Config tab, the last item is boot mode. Within this section are six
    items to help you control how LILO operates to boot your Linux system and other
    operating systems.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/35c1af90d4f3af9cd7cfd006c6b752f5_156_0.png)


    LinuxConf includes features not found in KLILO, such as adding additional kernels
    that you can boot. (This is used when you have recompiled the Linux kernel with
    different options and want to try out the new kernel.) KLILO is an easier way
    to learn about LILO and configure it graphically without as much background in
    all of the available options.


    The man page for lilo.conf has has detailed information on possible configuration-options
    that KLILO and LinuxConf provide. You can also review the LILO HOWTO document,
    which is included on the CD at /A11-HOWTODocs/mini/LILO.html.


    # Manage All Your Passwords


    The more you use the Internet, the more accounts you have set up around the world.
    Before you had just had an ISP account, now you''re likely to have a separate
    username and password to access your online bank, your ClickRewards account, Amazon.com,
    E*trade, a credit card company, and'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# SPICE UP YOUR DESKTOP


    a few others as well. Using the same username on all these accounts is usually
    not possible; using the same password on all of them is downright foolish.

    The Gpasman utility provides a simple solution. It stores all your usernames and
    passwords for various accounts that you maintain. The passwords are shown in cleartext
    (readable) on screen so you can refresh your memory when you need to access an
    account. The data, however, is stored on disk in an encrypted form, so that others
    who may have access to the hard disk cannot see the passwords in Gpasman file.


    To use the Gpasman utility (located in /Part04/Execute/Gpasman on the CD), use
    this command:


    ```

    $ gpasman

    ```


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_157_0.png)


    When you first start Gpasman, it creates a hidden file in which your encrypted
    passwords are stored. Each time you launch Gpasman, you must enter the password
    of the user account you are logged in. This prevents another user from launching
    Gpasman while you step away from your desk for a moment. Of course, you should
    always be careful about people looking over your shoulder when the Gpasman utility
    has all of your passwords visible on screen in cleartext, but using Gpasman is
    a much better solution to the problem of forgotten passwords than having sticky
    notes all over your monitor with your account information.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Other Ingenious Add-Ons


    Do you want to use Linux with all your gadgets, including your Palm device? Do
    you use a CD burner to create your own custom music CDs or data backups? Do you
    like to read online books to pass the time? If these things sound interesting,
    read on for some gee-whiz programs that will expand the usefulness of your Linux
    system.


    # Connect Linux to Your PalmPilot


    With the popularity of the Palm, it was inevitable that someone would want to
    synchronize their Palm with their Linux system. Several packages now support a
    Palm connection to a Linux machine.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_158_0.png)


    > NOTE You might have also heard that Linux can run on a PDA. This is true, but
    it''s a little complicated to explain here. Basically, there is a port of Linux
    to the Compaq IPaq PDA device. Other companies, notably Samsung, have also created
    new PDA devices that are based on Linux right out of the box. We can expect to
    see more of these in the next year, as hardware costs decrease and people realize
    that they need more than the Palm OS can provide (and they don''t want to pay
    a royalty to Microsoft).


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_158_1.png)


    Before you can use the graphical interfaces to your Palm, you need to install
    the basic functionality to interface with the device. This is contained in the
    pilot-link package. Although Red Hat 7 installs the pilot-link package by default,
    it isn''t a recent enough version to support the Palm tools I describe in this
    section (beginning with Gnome-Pilot). You can find a later version on the CD at
    /Part04/Execute/Gnome-Pilot.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_158_2.png)'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Use these commands to remove the existing pilot-link package and its support
    packages, then install the new pilot-link package from the CD with its support
    package:


    ```

    # cd /mnt/cdrom/Part04/Execute/Gnome-Pilot

    # rpm -e pilot-link-devel

    # rpm -e kpilot

    # rpm -e pilot-link

    # rpm -Uvh libpilot-link3-0.9.5-0.3.2mdk.i586.rpm

    # rpm -Uvh pilot-link-link-0_9_3-10_i386.rpm

    ```


    > NOTE If you have a problem uninstalling packages (using rpm -e) you can always
    reinstall the same packages from the original Red Hat 7 CD.


    Once you have pilot-link updated, you can access your Palm via your desktop using
    several tools. Two I''ll mention here are Gnome-Pilot and KPilot, for Gnome and
    KDE respectively.


    > NOTE Remember that you''ve installed both Gnome and KDE on your Red Hat Linux
    7 system, you can run both types of applications, regardless of which desktop
    you''re currently using. The only conflict occurs when an application tries to
    work with the Panel from one desktop and you''re running the other. Use switch-kde
    to change from Gnome to KDE or vice versa.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'To synchronize to your Palm from Gnome, try Gnome-Pilot. This is a powerful
    program with a full set of features. But it is a little more complicated to install
    most of the others I''ve described this far.


    With pi-lot-link updated, you can install the Gnome-Pilot package from the directory
    /Part04/GnomePilot with a single rpm command.


    ```

    # rpm -Uvh gnome-piilot-0.1.55-0.1.lmdk.i586.rpm

    ```


    Now you''re ready to try Gnome-Pilot. I recommend running this program only from
    the Gnome desktop, because it interfaces with the Gnome Panel and tends to get
    confused by KDE. You use Gnome-Pilot from within the Gnome Control Center. Two
    main items are installed when you install the Gnome-Pilot rpm: Peripherals ➤ Pilot
    Conduits (which has five sub-items) and Peripherals ➤ Pilot Link.


    When you click on the Pilot Link item the first time, a wizard is launched to
    help you set up your Palm connection. This wizard includes about four screens,
    the third of which is shown here. You enter the device information so that Linux
    synchronizes with the Palm.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_160_0.png)


    After you''ve set up the initial connection, you can use the Peripherals ➤ Pilot
    Link items to manage your connections. This window includes three tabs: Pilots,
    Devices, and Advanced. One example, the Pilot Settings dialog box, appears when
    you click Add from within the Pilots tab, or when you select a setting and click
    Edit.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# SPICE UP YOUR DESKTOP


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_161_0.png)


    Once you have configured a Palm device, you can use any of the five conduit pages
    under Peripherals > Pilot Conduits to synchronize data between your Linux system
    and your Palm. On the Memo File conduit page you can select to copy or merge data
    to or from your Palm.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_161_1.png)


    Configure this memo-Palm conduit'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# OTHER GENIGIOUS ADD-ONS 143


    If you''re running a KDE desktop, the tool you need to connect to your Palm is
    called KPilot. It''s located on the CD in /Part04/Execute/KPilot. Development
    of KPilot continues pace, with new versions coming out regularly with additional
    features. When you launch KPilot, a configuration dialog box appears, shown here.
    In this dialog box you can select the device that your Palm is connected to, the
    user account to use for Palm connectivity, and other options.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_162_0.png)


    In the General tab, you can check the box labeled Start Pilot at HotSync to cause
    the application to launch automatically when the system detects a HotSync.


    Because one of the most commonly performed tasks for Palm users is collecting
    addresses and syncing them with a desktop database, the Address tab contains a
    set of field identifiers that you can arrange to correspond with the format you
    wish to use for importing data. (A similar table, DB Specials, is also available
    to help you work with multiple database formats.)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_162_1.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# SPICE UP YOUR DESKTOP


    When you choose OK after selecting your KPilot configuration options, the KPilot
    daemon attempts to connect to your Palm and synchronize your data. KPilot includes
    support for syncing addresses, memos, and files. Addresses can be synced using
    the KPilot Address Book window. Memos can be synced using the KPilot Memo window


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_163_0.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_163_1.png)


    KPilot also includes some support for conduits. Full documentation for the KPilot
    program is available after you have installed the KPilot rpm in the directory
    /usr/src/kde/html/en/kilot/. Begin with the file introduction.html. More information
    about Linux and the Palm can be found at the Web site http://eunuchs.org/linux/palm/index.html.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Manage Your Laptop Power


    If you''re running KDE on a laptop, you need to use the kmlaptop package to control
    your laptop functions directly from KDE. You must have the Advanced Power Management
    (APM) options set in your Linux kernel (so the kernel can access the appropriate
    laptop hardware) to use kmlaptop. Red 7 has this set by default when you install
    the Workstation version described in the Introduction. If you want to fiddle with
    your kernel, see your Linux documentation for details or review the documentation
    on the CD at /A11-HOWTO-Docs/HOWTO.html.


    The kmlaptop package acts as a control panel to manage your battery power and
    configure power-saving features of your laptop. You can install it using a standard
    rpm command. It''s located in the directory /Part04/Execute/Klaptop.


    When you launch Kmlaptop, a dialog box appears that contains five tabs. With these
    tabs you control how Linux interacts with the special features of your laptop.
    These are fairly self-explanatory, but I''ll give a couple of examples here. The
    Battery tab includes checkboxes to enable the display of a battery monitor docked
    into the KDE Panel. You can select which icons to use for various battery states
    (from the hundreds of KDE icons).


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_164_0.png)'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 146 SPICE UP YOUR DESKTOP


    > NOTE If you click an icon in order to select a new one in the Battery tab, change
    the directory shown to /usr/share/icons using the drop-down list in the Select
    Icon dialog box. This will display a large collection of pre-installed icons to
    choose from.


    The Pcmcia tab indicates the status of your PCMCIA ports, telling you what is
    installed (as best as can be determined) in each slot.

    nThe Power, Warning, and Critical tabs help you manage what the system does when
    the laptop enters standby mode or when the battery power drops to a critically
    low level. The Power tab acts as a sort of "extreme screen-saver", as the text
    in the dialog explains.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_165_0.png)


    The Warning and Critical tabs let you enter a command or sound to execute when
    power reaches either of these threshold levels. For example, in the Critical tab,
    you could set a shut down command to be executed when your laptop has five minutes
    of power left. This would allow a graceful shutdown.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Burn Custom-ROMs


    More and more users are seeing the need for a CD burner (a writable or read-write
    compact disc drive) for either data backup or for cutting their music CDs; at
    the same time, prices for these are falling rapidly, with good quality drives
    now down below $200. The KreateCD utility automates the process of creating your
    own CDs within KDE.


    The KreateCD program is located in /Part04/Execute/Kreatecd on the CD. When you
    use the source code to create your own binary, KreateCD is added to your Applications
    menu.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_166_0.png)


    KreateCD is organized by projects. You set up a project that includes all the
    tracks you want to record on a CD. Each time you add a new track to the project,
    you specify the type of data, the source (such as a disk file or another CD track
    on a different drive), and the options for the new CD. The tracks can be data
    or audio.


    CDs use the ISO9660 file format. KreateCD includes a dialog box where you can
    select among the various ISO options to customize your project. Long filenames,
    RockRidge extensions, Joliet extensions, and so forth, are all supported'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 148 SPICE UP YOUR DESKTOP


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_167_0.png)


    Once you have defined all of the tracks for your CD, you can edit or arrange them
    as you wish. When you''re done, just click the Write CD button. SCSI drive options
    and paths to use for data tracks can be configured as you create your project.


    A similar program that can be used within Gnome (or any Linux graphical interface)
    is called X-CDRoast. This program is included on the CD in the directory /Part04/Execute/Xcdroast.
    You can install it using the standard rpm command. You''ll find that this program
    is every bit as useful as the KreateCD program.


    After you''ve made a few CDs using X-CDRoast or KreateCD, you can use the Kover
    program to print up some cover artwork for your disks.


    The Kover package is located on the CD in the directory /Part04/Execute/Kover.
    You can install it using a standard rpm command, but this rpm places files in
    the default location for KDE, which is /opt/kde. This is not where Red Hat has
    chosen to install KDE, so you''ll need to do the following to run Kover and have
    the toolbar icons visible. (Since Kover has no menu, the toolbar icons are fairly
    important.)


    +   1. Open a new command line window.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 2. Change your KDE environment for the current session using this command:


    ```

    $ export KEDIR=/opt/kde

    ```


    # 3. Launch the Kover program (it''s not in a directory that is part of your default
    path):


    ```

    $ /opt/kde/bin/kover &

    ```


    You can assign different fonts and colors to the content and titles for the cover,
    and use an auto-numbering feature to increment a counter for multi-CD sets. To
    my mind, the real value of Kover is having a standardized size for the printout
    that matches what you need for a plastic CD case.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_168_0.png)


    > NOTE When cutting music CDs, try the CDDB button to speed data entry by automatically
    downloading artist and track data from the Internet!


    # Find Your Place in the World (Literally)


    The latest global positioning system (GPS) devices can be connected to your PC
    via a serial interface. The kgps utility lets you connect to your GPS device within
    KDE. Garmin and Rockwell GPS devices (or a compatible'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'one) are supported by this utility, which is located in /Part04/Execute

    /Kgps on the CD.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_169_0.png)


    Satellite information, elevation, date and time tracking are all shown

    in the kgps window.


    # # Gutenberg E-Texts in Linux


    You may be familiar with Project Gutenberg, which is working to collect all

    of the non-copyright material in the world and make it freely available in

    eronic format. If you''re a fan of literature, poetry, history, or many

    other fields, you''ll be very interested in this work. It''s been going on for

    about 30 years now, and has collected thousands of works.


    For example, none of the works of writers like Mark Twain, Daniel Defoe,

    or or Charles Dickens are copyrighted any longer—the copyrights have all

    expired. works like the Declaration of Independence or the Bible

    have long been available for anyone to make a copy of it. The idea behind the

    Gutenberg project is to make all these things electronically readable in

    plaintext files.


    Anyone can download these plaintext files to read and enjoy them in any

    text editor or viewer. Just search for Project Gutenberg on Yahoo! or some-

    place similar and start downloading files. You''ll quickly discover, however,

    that the project is so large that a little bit of organizational help would be

    quick appreciated. That''s where the KGutenbook program comes in.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'KGutenbook is a KDE program that provides a convenient index to locate and
    retrieve documents, as well as a book-like interface for reading those documents.
    The rpm for KGutenbook is located on the CD in /Part04/Execute/KGutenbook.


    Use the following rpm command to install it. This command relocates the program
    from its default location in /opt/kde to the location used by Red Hat for KGutenbook.


    ```

    $ rpm -Uvh --prefix /usr/local/kde kgutenbook-0_5_5-1rh6x_i386.rpm

    ```


    Then use this command to launch the program if you''re not running KDE (in which
    case the default KDE binary directory will not be part of your path).


    ```

    $ /usr/local/kde/bin/kgutenbook &

    ```


    If you prefer leaving things as they are by default, don''t include the --prefix
    option in the rpm command and start the program like this:


    ```

    $ /opt/kde/bin/kgutenbook $

    ```


    Once you have the main window of the program in front of you, click the down arrow
    button in the upper left corner of the window. You will be asked if you want to
    download an index or locate an FTP site. You should begin by selecting an FTP
    site.


    The program displays a list for you to choose from. Most of the sites displayed
    are not in the U.S.; if you''re in another country I''ll tell you an FTP site
    that matches your location. If you are in the U.S., choose something-like cdrom.com,
    archive.org, or another U.S. site for best results.


    > NOTE KGutenbook doesn''t have any menus. You can hold the mouse pointer over
    a button for a moment to see a text description of what the button does.


    Once you select an FTP site, press the down arrow button again to download an
    index of available documents. This can take a couple of minutes if you have a
    modem connection. The list of documents is substantial. The


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_170_0.png)'
  merge: -1
  img_proc: true
