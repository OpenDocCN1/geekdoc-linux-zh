    By setting the blocks used by an inode in Recovery mode, you can reconstruct a
    file from the disk blocks of data that you discover by exploring your disk with
    lde.


    The following image shows the Recovery mode screen. You should read the documentation
    for lde to understand how inode indirection is handled before trying to reconstruct
    a file using Recovery mode.


