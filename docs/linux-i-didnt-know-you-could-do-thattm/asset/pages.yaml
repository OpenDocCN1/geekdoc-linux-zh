- pgno: 13
  md: '# Introduction


    With all the noise about Linux being perfect for tasks such as running a Web server
    or acting as a router, you may be wondering what else you can do with this increasingly
    popular operating system. This book is about some of the really handy things Linux
    can do that you probably didn''t know about—things like graphically setting up
    a firewall or an Apache server, using all sorts of sound and video tools, increasing
    your system security, playing with programs that balance your checkbook, managing
    your business contacts, cataloging your videotapes, and checking your stocks.
    This book covers dozens of gee-whiz Linux programs and features that will make
    you go, “Wow! That''s just what I need!


    In this second edition, several older programs have been updated, and dozens of
    new software packages have been added.


    # Is This Book for Me?


    The pages that follow do not assume that you know much about Linux. If you''ve
    installed Linux and can open a command-line window and follow directions, you
    can use everything in this book. A few of the advanced topics will apply to system
    administrators. If you know a little about compiling Linux programs, that''s helpful,
    but I will walk you through the steps in each case. Some packages, however, might
    require a programmer to get them to run if you''re not using a Red Hat system.


    The packages on the CD have been tested on Red Hat 7.0. When I installed Red Linux,
    I used a default Workstation installation and selected both KDE and Gnome desktops
    when prompted. I suggest you do the same thing. Choosing the Server installation
    leaves out the entire graphical system (the X Window System), as well as many
    of the tools that the discussions in this book assume are installed. Choosing
    a custom installation is fine if you''re familiar with Linux; otherwise, you may
    end up needing to add numerous prerequisite packages from the Red Hat CDs before
    the tools I describe can be installed.


    If you''re not using a Red Linux system, many of the prebuilt binaries on the
    CD will still work for you; others will need to be compiled from source code.
    Most packages include a README file to guide you through that process, but you
    may have better luck if you''re a little more experienced with Linux.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# What Will I Get out of This Book and How Is It Organized?


    > **NOTE** The section titled "The CD" below and the README file on the CD itself
    both provide helpful guidelines.


    Two types of information are included in this book. Some sections provide instructions
    on using parts of Linux that you might not know about yet, like using a RAID system
    or working with the vi editor to help you optimize your system. Most of the book
    is about additional free software packages that you can install on your Linux
    system for added functionality. These packages are included on the book''s CD.


    > **NOTE** See the section titled "The CD" for more information.


    This book is divided into 12 parts that highlight different aspects of what you
    can do with Linux:


    +   - **Make Linux Faster, Better, and Easier to Use** How to make a few basic
    Linux tasks like entering commands go more smoothly and require less effort on
    your part. You''ll also find an introduction to the venerable vi editor and instructions
    on tracking system and network usage.

    - **Manage Your Files Like a Pro** Tools for checking your hard disk status, recovering
    files, and generally doing advanced stuff with your Linux files.

    - **Automate Your Entire System** How to use standard Linux features to run programs
    any time, from making a message pop up in 30 minutes to running a script every
    morning at 2 A.M.

    - **Spice Up Your Desktop** A variety of add-ons for Gnome and KDE desktops, including
    system administration utilities and personal productivity tools just for fun.

    - **Make Your Linux System a Desktop OS** Run numerous word processors, spreadsheets,
    and office suites on Linux, or run existing Windows programs on Linux. The latest
    releases of both KDE and Gnome desktops are also described.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Turn Linux into the Ultimate Gamer Run all sorts of great games on Linux, from
    chess and NetHack to fast-paced games like flight simulators and arcade favorites.
    You can even play Minesweeper and Solitaire.


    Make Your System Entertaining Play video clips, audio CDs, and watch TV on your
    Linux desktop. Learn about audio mixing studios and digital synthesizers for Linux.


    Turn Your System into a Web Server Use the Apache web server to its fullest, with
    configuration hints for high performance, information about dozens of add-on modules,
    and a graphical configuration tool.


    Turn Your System into a Super-Server Use Linux features to connect multiple systems
    through one Internet connection, use multiple addresses on one server, and manage
    server security with browser-based tools. A a firewall with graphical configuration
    tools.


    Clone Windows NT Linux add-ons to share data with Windows NT servers on your network.
    Or replace an NT server with the Linux Samba tools.


    Use Linux as a Business Server Check your files for viruses (including files on
    a Linux e-mail server), send and receive faxes, and AOL Instant Messaging on Linux.


    Disaster-Proof Your System Learn about Linux backup utilities and add-on programs,
    plus how to use a Linux-controlled UPS (uninterruptible power supply), a battery-based
    power supply.


    # The CD


    The CD provides dozens of applications and files, including helpful utilities,
    entertaining games, and even a full office suite. Most of the programs on the
    CD include complete source code as well as a binary executable file.


    A note of warning: some of the add-on packages are easier to use than others.
    I''ve included a lot of tools that you can run right off the CD. A few may require
    that you use programming-type commands (such as make) or even work with the source
    code a little, especially if you''re not running a standard Red Hat Linux distribution,
    which is what all the packages were tested on. If you''re not a programmer, don''t
    worry. I''m confident that you will still find all sorts of useful tips and tools
    in this book. If some that you want to'
  merge: -1
  img_proc: true
- pgno: 16
  md: "try are harder to use, consider that incentive to learn more about the inner\
    \ workings of Linux.\n\nFor detailed information about a package, browse the documentation\
    \ that comes with that package. A long README file on the CD includes a list of\
    \ all packages on the CD with a short description. A few technical notes may help\
    \ you along the way:\n\n+   - Most software packages are provided in rpm format\
    \ files. I refer throughout the book to \"a standard rpm command\" for installing\
    \ packages. I give many precise examples, but for reference, that \"standard command\"\
    \ looks like this:\n\n```\n# rpm -Uvh package_filename\n```\n\n+   - The packages\
    \ on the CD were tested with a standard Red Hat 7 Workstation installation. The\
    \ rpm_list.txt file on the CD shows what was installed on my test system.\n Depending\
    \ on how you have your CD mounted, you may need to copy a binary file to your\
    \ hard disk before you can run it. Check the options in your /etc/fstab for information.\
    \ Once you copied the file to your hard disk, be sure it has the execute bit set\
    \ (use the command chmod a+x if needed).\n- The binary files (executables) may\
    \ not work on other Linux systems like Caldera OpenLinux, Slackware, or SuSE,\
    \ because each system is configured differently. To use the CD programs on other\
    \ Linux systems, you'll probably need to compile the source code. Instructions\
    \ are included in the main README file on the CD, with specifics included in each\
    \ program archive, but basically it amounts to using these three commands:\n\n\
    ```\n./configure\nmake\nmake install\n```\n\n+   - If you need to work with source\
    \ code, you'll need some additional packages installed on your Linux system from\
    \ your original Linux CD. These packages provide programming tools. They include\
    \ the word devel. For example, you probably have the qt package installed already.\
    \ If you want to compile source code, you need the qt-devel package as well."
  merge: -1
