- pgno: 118
  md: 'Text mode & Network This is the run level 3 discussed above, in which you must
    log in using character mode, and then start the graphical system (if it''s configured)
    using the command startx.


    Choose the mode you prefer and click the Accept button. Then you can close LinuxConf
    the Quit button at the bottom left of the window.


    Alternatively, you can set which run level is used by directly editing the text
    file /etc/initstab while logged in root. In the /etc/initstab file, you should
    locate a line that looks like this one (usually one of the first non-comment lines
    in the file):


    ```

    id:3:initdefault

    ```


    Using your text editor, change the 3 to a 5, so the line looks like this:


    ```

    id:5:initdefault

    ```


    If you''re curious, look at the last line in the /etc/initstab file. It looks
    something-like this:


    ```

    x:5:respawn:/usr/bin/X11/xdm-nodaemon

    ```


    Or, in Red Hat 7, it looks like this (using a symbolic link here to the gdm [Gnome
    Display Manager]), which is similar to xdm mentioned earlier:


    ```

    x:5:respawn:/etc/X11/prefdm-nodaemon

    ```


    This is the command that is run in order to start run level 5, the graphical login
    program. You can read about xdm options in the xdm man page. These options allow
    you to update the background image, the text messages, and other parts of the
    graphical login screen.


    Save your updated /etc/initstab file and exit your text editor. That''s all there
    is to it. Next time you restart Linux, you will go directly to run level 5 and
    the graphical login.


    If you''re using KDE as your desktop, you can also use the KDE version of xdm,
    called kdm. Red Hat is not normally configured to use kdm, even if you select
    KDE as your desktop. This is because Red Hat maintains the ability to switch between
    Gnome, KDE, and other window managers. Changing to kdm as the graphical login
    program would complicate that feature.


    The kdm program does have the distinct advantage, however, of being configured
    using the KDE Control Center (by choosing Login Manager under the Applications
    tab). The Login Manager configuration window allows'
  merge: -1
