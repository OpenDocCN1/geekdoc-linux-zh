    # Securely One Internet Connection


    It''s easy to use Linux as a gateway to the Internet for your LAN, even over a
    modem. Just configure both network interfaces (such as eth0 and ppp for a LAN
    to modem gateway) and update the kernel routes using the route command (this requires
    IP forwarding to be enabled in your Linux kernel, of course).


    > NOTE For information on IP forwarding, see this document on the CD: /A11-HOWTO/Docs/Net-HOWTO.html.'
