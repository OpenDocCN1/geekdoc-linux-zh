    - Open the Control Center using the main menu or Panel button, and then choose
    an item from the Modules menu.

    - Use the Preferences submenu of the KDE main menu. Choose the appropriate submenus
    for what you need to accomplish.


    Here are a few other tips for KDE 2:


    +   - Country-specific settings for currency, time, etc. can be set by choosing
    Preferences > Personalization > Country & Language.

    - When part of the Panel is hidden because it contains so many items, use the
    small arrows on the end of the Panel to scroll it left or right.

    - Right-click on the title bar of any application and choose Decorations to choose
    the style to use for that window.

    - The desk icon on the Panel minimizes all open windows so you can see the KDE
    desktop itself.

    - Click on the Minimize button of a window using the middle mouse button and the
    window will be maximized vertically but not horizontally.

    - Click on the Minimize of a window using the right mouse button and the window
    will be maximized horizontally but not vertically.

    - Press Alt+F2 to immediately open the Run window (see next figure) where you
    can enter a program to launch. The Options button lets you choose a priority for
