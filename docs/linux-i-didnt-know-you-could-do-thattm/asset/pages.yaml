    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_397_0.png)


    DcaIc is located on the CD at /Part/11/Execute/DcaIc. A standard rpm file is provided.


    While other calculators usually only include storage registers, DcaIc shows them
    on-screen above the standard working registers. The registers and the Help window
    can each be turned off if you prefer to work with a clearer screen. To exit DcaIc,
    press Q and confirm by pressing Y.'
