- pgno: 102
  md: '# HACK YOUR HARD DISK


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_102_0.png)


    **WARNING** The 1de tool is not for novices. You can use it in read-only mode
    to explore and learn about your hard disk. But a single bad edit could make your
    hard disk unusable, and require expert help to undo.


    Why use such a low-level tool? Many tools in Linux (such as fsck) provide an automated
    way to correct problems. If those automated tools don''t work, the 1de helps you
    correct things manually, much like some of the old DOS utilities (such as the
    Norton Disk Doctor) did.


    To use the 1de, you should have a partition that is not mounted as a read/write
    partition (if you need to edit your root partition, boot your system from a floppy
    disk—see Item 49, “Boot Linux in Emergencies,” for more information). The 1de
    is located in /Part02/Execute/LDE on the CD.


    Many command line options are available when you start 1de (see the man page in
    the doc directory and also in the same directory as the binary on the CD). If
    you use command line options, you can use 1de to dump information from specific
    disk blocks or perform similar operations. If you don''t use those options, 1de
    provides a menu-based interface to explore your hard disk. The only required option
    is the device name you want to explore. In this example, I''m working with the
    third partition of the first IDE disk on my system.


    ```

    # 1de /dev/hda3

    ```


    After entering this command, the screen shows a summary of the system type found
    on the device that I named. Press any key to continue and the main 1de screen
    appears. This screen displays the superblock information for the selected device.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/35c1af90d4f3af9cd7cfd006c6b752f5_103_0.png)


    The IDE has three modes and several flags that you can set. You can enter one
    of these modes by pressing one of the keys shown at the bottom of the screen or
    by viewing the menu and choosing an item.

    to view the menu, press F2 or Ctrl+O (as shown here).


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_103_1.png)


    Before you can make any changes to your hard disk, you must change the Write flag
    to Yes. It is always off by default as a safety precaution. Leave it'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'at NO unless you feel comfortable editing your hard disk at this level. Press
    F to view the flags, and then set OK to write to file system to Yes.


    > NOTE Most of the single letter commands in lde are not case sensitive. This
    is helpful, since you can''t see the letter being printed as you press it! Remember,
    however, to use a capital Q to quit (exit) the program.


    Inodes are the file descriptors for everything on your Linux file system. They
    point to the actual location of data for a file; they also contain owner and permission
    information and the dates and times related to a file or directory.


    When you use Inode mode in 1de, you see all of the information about an inode
    in a summary fashion. You can then change this information for any inode.


    To enter Inode mode, press i or choose Inode mode from the menu. The first inode
    is shown as follows.


    ```

    root@localhost:~/1de/ide-2.5

    File Edit Settings: Help

    Ide V1.2.5 /dev/sda1

    Inode: 12345

    Name: test

    TYPE file

    PERM rw-r--r--

    SIZE 4096


    FILE DETAILS

    CREATION TIME

    MODIFICATION TIME

    ACCESS TIME


    LEAF-BLOCKS

    # (1000/10000 used)


    F1 for help, F2 for menu, Q to quit

    ```


    You can press F1 or ? to see a full screen of help about using the Inode mode.
    You can also press F2 or Ctrl+O to view the inode menu (which is different from
    the main menu, though it appears in the same location on'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'screen). When viewing a menu or a help screen, press q to return to your editing
    window.


    When you are feeling adventurous, press B to Block mode, shown in the following
    screen. In this mode, you are viewing the raw information on the hard disk. The
    numbers you see are accessed in a structured way by all the other tools you use
    in Linux. This utility presents them at the lowest level, allowing you to alter
    and repair things as necessary.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_105_0.png)


    Once again, pressing F1 or F? displays a set of help for Block mode: pressing
    F2 or Ctrl+O displays the Block mode menu, where you can select different operations
    to perform on the current block.


    A few basic commands for viewing your hard disk blocks are shown in the following
    table.'
