    * Use the E2CP command to copy a file from Linux to Windows.\n  > E2CP /home/nwells/gimp.kdelink\
    \ gimp.kde\n\nIt isn't really elegant solution, but this is about all we have\
    \ so far for-ing Linux partitions from Windows. These tools were written in 1996.\
    \ Apparently most Linux developers are looking for ways to avoid Windows, not\
    \ work in it!\n\n# 14 Hack Your Hard Disk\n\nIf all of the tools for managing\
    \ your hard disk described so far don't give you the access you really crave,\
    \ try this: with the Linux Disk Editor (Lde) you can view and edit any byte on\
    \ your hard disk. This is a low-level tool to see which codes are actually written\
    \ to the hard disk—how a file is-constructed—and maybe help you update or reconstruct\
    \ it."
