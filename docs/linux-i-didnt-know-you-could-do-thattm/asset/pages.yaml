- pgno: 209
  md: '# View Your Word Files in Linux


    Despite all this talk about alternative office suites and word processors, the
    most-used word processor at the moment remains Microsoft Word, which isn''t available
    for Linux. Many of the word processors described in this part can read and write
    Word files, but this section describes an easier way to access those files.


    Suppose you have received a Word 97 or Word 2000 from a colleague. Rather than
    open a suite like StarOffice or AppLinuxWare, a faster and easier solution is
    to use a Word file-viewing utility to quickly view the contents of the Word file.
    Several of these tools are available for Linux.


    The best tool for quick viewing is catdoc. This program is on the CD in the directory/Part05/Execute/Catdoc.doc.
    You can use a standard rpm command to install it. The format of this command is
    simple:


    ```

    $ catdoc wordfile.doc

    ```


    Catdoc operates much like the cat command. It reads data from the file-name you
    provide and writes a translation of file to STDOUT (to the screen or to a redirected
    output). Because most files are longer than a screen, you''ll probably want to
    use the command in one of these forms:


    ```

    $ catdoc wordfile.doc | less

    $ catdoc wordfile.doc > wordfile.txt

    ```


    By default, catdoc wraps lines for easy reading on screen. But catdoc includes
    a -w switch that causes long lines not to be wrapped. Use this switch if you want
    to import the text into another word processor.


    Several other options are available to help you process various character sets
    that might be used in your Word documents or to map characters. You can also process
    files that don''t seem to have the correct Word file signature.


    An interesting feature of Word is that it may save text as hidden when the author
    of a document thinks the data has been erased. This hidden text is displayed by
    catdoc. The result is that a person using catdoc may see information that the
    person providing the document did not intend as part of the document. This may
    include that older edits, or even private information that remains from a previous
    document template.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# RUN OTHER OFFICE PROGRAMS ON LINUX


    **WARNING** This hidden text problem is especially dangerous when you start a
    new document by altering or erasing a company-confidential document, rather than
    starting from scratch and just copying and pasting text that you need from a previous
    file.


    If you send out Word files to Linux users, the safest way to prevent any-one from
    seeing private or proprietary data that Word has left (hidden) in the original
    Word document is to save the document to plain text format and then re-import
    it into Word.


    Another very similar tool to catdoc is called antiword. This is also a com-line
    utility that you can use in this simple format:


    ```

    $ antiword wordfile.doc | less

    ```


    Antiword is included in the CD in the directory/Part05/Execute/Antiword. You install
    it with a standard rpm command.


    Antiword includes different character sets, Antiword isn''t as good at handling
    diverse character sets, but it does include options to explicitly view hidden
    text (use-s), to alter the width of wrapped text (use-w with a column width),
    and to output PostScript files (use-p). Enter the antiword command without any
    parameters to see a full list of options.


    Antiword doesn''t have a man page, as catdoc does. Instead, view the docmentation
    files in /usr/share/doc/antiword-0.30.


    Finally, the ViewView program (recently renamed to just view) is intended to provide
    a much more powerful viewer for Word documents, with many related tools. Unfortunately,
    I haven''t found this program to be very reliable. But I''ve included it on the
    CD in the directory/Part05/Execute/Wordview. WordView requires the libwmf libraries,
    which I''ve included in /Part05/Pre-reqs. You can install everything using these
    commands:


    ```

    # rpm -Uvh --libwmf-0.17.5-i386.rpm

    # rpm -Uvh wv-0_6_2-3mdk_i586.rpm

    ```


    I don''t recommend using the -force option generally, but the libwmf library conflicts
    with a file from the gd-devel package. This package is used to handle GIF format
    files. If you regularly work with graphics files, I''d rec-'
  merge: -1
  img_proc: true
