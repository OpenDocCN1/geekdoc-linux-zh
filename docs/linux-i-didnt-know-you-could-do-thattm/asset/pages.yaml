  md: '# 378 USE LINUX AS A BUSINESS SERVER


    | Task | Command in shell | Results |

    | --- | --- | --- |

    | Calculate square root (or trigonometric or similar functions) | $ pcalc sqrt
    625 | 25 x 19 0y11001 |


    Other features of pcalc:


    +   * Mixes different bases (hex, decimal, etc.) in one expression

    * Defines variables

    * Uses standard math constants (such as pi and e)

    * Uses built-in math functions like sin, cos, exp, and log

    * Uses calculation scripts—files composed of multiple lines of pcalc instructions


    The pcalc README file includes more details about the features of this programmer''s
