- pgno: 205
  md: '# 24 Run Other Office Programs on Linux


    If you don''t need a full suite, many word processors, spreadsheets, and other
    simple office-type packages are available free for Linux. Try some of the programs
    described in this section, including the WordPerfect for Linux package.


    # The Powerful WordPerfect for Linux


    Corel Corporation, which owns WordPerfect, made a strong commitment to Linux in
    the past couple of years. At the moment, the fruit of commitment is available
    for download from the Web site http://linux.corel.com. It includes the WordPerfect
    9 word processor, Corel Presentations 9, the Paradox database, and Quattro Pro
    9 spreadsheet.


    Unfortunately, as of this writing, the future of these products is uncertain.
    Microsoft has invested heavily in the ailing Corel Corporation. This is seen by
    many Linux enthusiasts as the reason behind the sale of all Corel Linux assets
    to Linux Global Partners. Although one would assume that the development and sale
    of these products will continue, that is by no means certain at this point.


    Currently, all of these programs are commercial software that is available for
    free download. For a fee, you can purchase an upgraded version of the software
    with additional features or add-on files (like fonts and clipart) and a printed
    manual. For example, the for-purchase version of WordPerfect 9 for Linux includes
    features such as:


    +   * A library of several thousand clip art images

    * Printed documentation

    * A character-based version of WordPerfect for use in host server environments

    * Server license management'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'All three versions (the free download, the commercial workstation, and the
    commercial server products) include the following:


    +   - Cross-platform compatibility (the same file format used on WordPerfect for
    all platforms)


    +   - Document management and revision control


    +   - Complex tables with 90 built-in spreadsheet functions


    +   - Internet publishing


    +   - Charting and drawing tools


