  md: '# LINUX AT THE ARCADE 203


    KSpaceduel is installed as part of KDE 2, but conflicts with the Qt 2.2.2 libraries
    that KDE 2 requires. As described above for KAsteroids, you must return to a previous
    version of Qt and run KSpaceduel within KDE 1.1.2. Just follow the instructions
