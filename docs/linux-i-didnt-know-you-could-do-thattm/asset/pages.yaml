- pgno: 286
  md: 'A more comprehensive tool than kdcpi by gDC3-Play. This graphical program lets
    you pull photos from any camera that supports the DC-3 protocol, such as a Ricoh
    RDC-300.


    Use the gdc3play binary file on the CD in the directory /Part07/Execute/Gdc3play.


    The basic process for using Gdc3play is simple:


    +   * Retrieve the index of photos from an attached digital camera using the Get
    Index button.


    +   * Select a photo to download and click the Download button.


    You can choose Settings > Preferences or press the Configure button to open a
    configuration dialog box where you can set up the device name and baud rate, as
    well as the filenames to use when saving downloaded pictures. Here is the basic
    but effective interface for Gdc3play.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_286_0.png)


    A final option for owners of digital cameras is the Gphoto program. This package
    is installed by default on Red Hat 7, or you can grab it from the CD in the directory
    /Part07/Execute/Gphoto and install it using a standard rpm command.'
