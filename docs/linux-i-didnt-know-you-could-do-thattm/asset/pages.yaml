    # Play Flight Simulator on Linux


    The Sabre flight simulator provides a very realistic and impressive flying experience
    in Linux. You can select from many different scenes and airplanes, and use a demo
    mode to watch the Sabre fly around.


    A site dedicated to the development of Sabre is located at http: //sabre.cobi.com/
    and provides a user''s guide and updates for the soft-ware and game play. The
    Web site is down at times, keep trying if you can''t reach it. The Web site states
    at that moment, the Sabre team is working on Korean War-era fighter aircraft,
    such as the F-86 Sabrejet and the F-84 Thunderjet and the F-51 Mustang are also
    available from the MiG-15. From the Sabre menu. You can even fly with a squadron
    if you prefer.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_222_1.png)'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Sabre is located at /Part06/Execute/Sabre. Sabre is not an X Window program.
    Instead, it uses the underlying graphical tools (the svga libraries) to create
    something similar in look and feel to a DOS-based game. The svga libraries are
    not installed by default on Red Hat 7. Use the following two commands to install
    Sabre. You may also want to review the INSTALL file in the directory /user/doc/sabre-0.2.3
    after installing the rpms. Additional documentation is located in /usr/lib/sabre.


    ```

    # rpm -Uvh /mnt/cdrom/Part06/Pre-reqs/svgalib-1.4.9-i3386.rpm

    # rpm -Uvh /mnt/cdrom/Part06/Execute/Sabre/sabre-0.2.3-5.i386.rpm

    ```


    After you have installed these rpms, follow these steps to execute the program:


    +   1. Switch to a character mode display by pressing Ctrl+Alt+F2.

    2. Log in. (You''ll need to be root to use this program.)

    3. Execute the command RunSabre to start the game menu, which provides a text
    mode selection screen. (Don''t include a & after the command name!)

    4. From the menu that appears, choose svgamode and select a screen resolution
    to use. The default resolution doesn''t seem to work very well on most systems,
    so try something like 800 × 600 on your system and see what results you get.

    5. Back at the Sabre menu, choose either mission or demo, and then select an option
    from those listed. After a moment, the game begins.

    6. You can end the game at any time by pressing Ctrl+C.

    7. To return to your graphical desktop, press Alt+F7.


    ```

    # RunSabre

    ```


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: '![](img/35c1af90d4f3af9cd7cfd006c6b752f5_224_0.png)


    Another flight simulator worth trying is FlightGear. This project includes a separate
    package full of scenery and other graphics, plus a documentation package.


    FlightGear requires a 3D graphics card. I haven''t prepared a binary for Red Hat
