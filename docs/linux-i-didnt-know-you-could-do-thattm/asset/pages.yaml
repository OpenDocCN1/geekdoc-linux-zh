    # UsePG to Secure All Your Documents


    If you''ve heard of public/private key encryption, you might know that it''s the
    most secure form of communication available today. It''s used on secure Web browsers
    and in many other places. In fact, some types of public/private key encryption
    are considered so secure the U.S. government tries to prevent them from being
    exported.


    Red Hat 7 has a handy command line utility that you can use to encrypt documents
    (including e-mail messages) and to sign files to ensure that people know they
    came from you. Using this same utility, you can decrypt other people''s files
    and check digital signatures to make certain that a document comes from the person
    you think it does.


    The idea behind public/private key encryption is that you can encrypt a message
    with a key (a large number) in such a way that the same key cannot be used to
    decrypt the message. Instead, you use a different key to decrypt it. The two keys
    must be used to manage encrypted documents.


    In practice, you give others your public key so that they can decrypt your documents.
    If your public key works to decrypt a file, the receiver knows it from you, because
    only your private key could have been used to encode the file.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'now, using these keys has many possibilities, and the process can become complicated.


    The gpg utility in Red Hat 7 provides all the functionality you need to use public/private
    key encryption with your documents. The name gpg stands for Gnu Privacy Guard.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_52_0.png)


    NOTE The name gpg is a play on a previously developed public/private key encryption
    called pgp (pretty good privacy). The gpg utility is still in use, but it is not
    open source (not distributed using the GPL license), so Red Hat prefers to use
    the newer gpg utility.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_52_1.png)


    The gpg utility includes support for 10 encoding algorithms, including Blowfish,
    DSA, and MD5. To see all that gpg offers, use this command:


    ```

    $ gpg --help | less

    ```


    Try the following steps to generate a public/private key using gpg. You must have
    a key pair before you can use the other features of gpg.


    +   1. Generate a key using this command:

    $ gpg --gen-key

    2. Press Enter to use the default of DSA and EGamal. (Or you can choose which
    type of key you want from listed.)

    3. Press Enter to select the default key size of 1024 bits. You can also enter
    a different key size. Netscape uses a 128-bit key; 1024 bits is sufficient for
    most of us. The maximum key size is 2048 bits.

    4. Press Enter to select the default value of 0, indicating that the key does
    not expire. Or enter the key expiration time as explained on-screen.

    5. Enter y to confirm that the key does not expire. (Expiring keys are more secure,
    but they take more effort to maintain.)

    6. Enter your real name, (such as Nicholas Wells).

    7. Enter your e-mail address, (such as nickwells@anydomain.com).

    8. Enter a comment. This would normally be a nickname, your real name, or something
    similar that you use with your email address. As shown on the screen, these three
    items are used together to make a UserID for.'
