- pgno: 78
  md: '# 9 Protect Sensitive Files


    Although it''s nice to have an undelete command available, sometimes the last
    thing you want is for someone to be able to recover a file that you deleted. Financial
    data and other personal or business files sometimes need to be obliterated from
    your system for security reasons.


    The shred utility is the right tool to erase a file so that it cannot be reconstructed
    or undeleted. When you use shred, the contents of a file are actually overwritten
    six different times, ending with random data. The file is then deleted normally,
    so the filename no longer appears on your system.


    The shred utility is located in /Part02/Execute/Shred on the CD. To use this utility,
    simply include the filename that you want to permanently erase from your system:


    ```

    $ shred filename

    ```


    > WARNING Remember that when you use shred to delete a file, the file cannot be
    recovered. Be especially careful when using shred with any wildcard characters.
    Avoid running shred when you are logged in as root.


    This is also a good place to review a part of the Linux file system that few people
    are aware of. Linux files include attributes, much like the attributes of files
    in DOS or Windows. You may recall that Windows has attributes like archive and
    read-only. Linux has similar file attributes available, as well as some esoteric
    ones. These attributes can be useful in managing files that you want to safeguard.


    To see the attributes of any file, use the lsattr command (for list attributes).
    The output for most files will be a line of hyphens, indicating that no attributes
    are set. Here is an example:


    ```

    $ lsattr /etc/lilo.conf

    ---------- /etc/lilo.conf

    ```


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_78_0.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_78_1.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_78_2.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# MANAGE YOUR FILES LIKE A PRO


    Not particularly instructive, but if you review the manual page for the chattr
    (for change attributes) command, you can learn the details about each of the possible
    attributes (represented in the above output by hyphens). If a file includes any
    of the attributes I''ve summarized here, the corresponding letter appears in the
    output of the lattr command. The following table is alphabetical, but the attributes
    are actually represented from left to right in the lattr output in this order:
    ASacdisu.


    | Indicator | Attribute |

    | --- | --- |

    | A | Don''t update a file''s access time each time it is accessed. This saves
    a little bit of disk I/O. |

    | a | The file can only be appended to. That is, data can be added to the end
    of it, but information cannot be changed in existing parts of the file. |

    | c | Automatically compress the file when not used regularly. Or it would, if
    this feature were currently supported in Linux. But see Chapter 15 for information
    on the e2compr kernel patch. |

    | d | Skip the file when the dump command is used for backing up a file system.
    |

    | s | Write over the file with zeros when it is deleted. This mimics the goal
    of the shred program. Shred is a sur method, however, in my opinion. |

    | S | Write changes to the file immediately to disk. This helps to prevent data
    loss in the event of system failure, but reduces performance on a busy system.
    The S stands for synchronous writes. |

    | u | Save the contents of the file when it is deleted using the rm command. With
    the c (compression) attribute, this attribute is planned for in the documentation
    but is not implemented, though it will be a great feature when it is! |

    | I | The file is immutable. This means that the file cannot be renamed or deleted,
    no hard links to the file can be made, and no data in the file can be changed.
    Even if you are logged in as root, you cannot delete or alter the file. You must
    first remove the i attribute.|'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'In this section on protecting data, the a, i, and s attributes are probably
    the most useful to keep in mind.


    You can easily change the attributes of a file using the chattr command. The format
    of this command is very similar to the chmod command used to alter file permissions.
    Use + or - to add or remove attributes, with the letter matching the attribute
    you want to change. For example, to add the i (immutable) and s attributes to
    the file report .dat, you would use this command:


    ```

    # chattr +is report.dat

    ```


    Using the command chattr will verify that the attributes are set. To remove those
    same attributes, use this command:


    ```

    # chattr -is report.dat

    ```


    > NOTE File attributes are always case sensitive! The attributes A and a or S
    and s are very distinct.


    # 10 Completely Destroy an Entire Hard Disk


    Using the shred utility is a great way to protect sensitive data files from prying
    eyes that might try to undo them. Occasionally, you may need to destroy the data
    on an entire hard disk or disk partition.


    For example, this might be useful when you rent or borrow a computer and need
    to erase your data before returning it, or if you are changing to a new department
    at work and must leave your old PC behind.


    The shred utility can be used to erase all of your data in situations like these.
    The program can be used in two ways:


    +   - To erase the entire hard disk

    - To erase all information on a single partition of a hard disk'
  merge: -1
  img_proc: true
