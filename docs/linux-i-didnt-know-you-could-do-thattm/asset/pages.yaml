- pgno: 49
  md: '# Use Nonpassword Authentication


    If all this talk about passwords is making you nervous about the security of your
    system (as it should), consider learning more about using Pluggable Authentication
    Modules (PAM) to enhance your system''s security.


    PAM provides a system whereby programs follow a configurable series of steps before
    allowing a user to perform an action.


    For example, you can configure the login program to check for certain things before
    allowing a person to log in. Or you can configure the passwd program to prevent
    users from altering their passwords under certain conditions. Because of the flexibility
    of the PAM modules in setting parameters such as these, PAM provides a real enhancement
    to system security.


    PAM is used by default on all Red Hat 7 systems. You can change the PAM settings
    to meet your security needs. Be aware that PAM is a complicated part of Linux.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_49_0.png)


    > WARNING If you make erroneous changes to PAM configurations, you may prevent
    anyone (including root) from logging into the system. This would require that
    you boot the system from a rescue disk and edit the erroneous settings. Be careful!


    The directory /etc/pam.d contains a list of utilities that are PAM-aware. These
    files contain the PAM configuration for the utility that the file is named for.
    For example, the file /etc/pam.d/login looks like this:


    ```

    ##PAM-1.0

    auth required      /lib/security/pam_security.so

    auth required      /lib/security/pam_stack.so service=system-auth

    auth required      /lib/security/pam_nologin.so

    account required   /lib/security/pam_stack.so service=system-auth

    password required  /lib/security/pam_stack.so service=system-auth

    session required   /lib/security/pam_stack.so service=system-auth

    session optional   /lib/security/pam_console.so

    ```


    The left column indicates the type of action a user might try to perform. In this,
    if a user tries to authenticate to the system (the auth item), the first three
    lines of the PAM configuration will be used. That is, the user


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_49_1.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'must "pass through" the three PAM modules listed. If the user can do that successfully,
    the authentication action is allowed. But if any of the PAM modules returns a
    "No," the action fails.


    The middle column indicates whether passing that PAM module''s test is required,
    sufficient, or optional.


    Finally, the right column indicates the name of the PAM module that is being used
    to test the requested action, along with any parameters needed to control that
    module. The three modules shown for auth will check the following things, respectively:


    +   pam_security.so If the user is trying to log in as root


    +   pam_stack.so service=system-auth The password that the user enters matches
    that user''s account.


    +   pam_login.so The /etc/login file does not exist. (If it does, only root can
    log in.)


    The pam_stack module is a comprehensive module that checks the user''s password
    or other authentication mechanism.


    PAM modules can be configured either using command line options such as the service=system-auth
    shown here, or using separate configuration files that are specific to the module
    itself. If these exist (Red Hat 7 uses none by default), they are stored in the
    directory /etc/security.


    > NOTE Some Linux systems store PAM modules in /usr/lib/security.


    The PAM modules themselves are stored in /lib/security. Red Hat 7 includes about
    38 PAM modules. As you study these filenames, you see that PAM is used to control
    all sorts of security measures. For example:


    +   The pam_limit module sets limits to what system resources a user can access.


    +   The pam_radius module can use a Radius authentication server to control access
    to Linux.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_50_0.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_50_1.png)


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_50_2.png)'
  merge: -1
