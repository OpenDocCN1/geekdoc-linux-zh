- pgno: 119
  md: '# 100 AUTOMATE YOUR ENTIRE SYSTEM


    you to set up background images, fonts, languages, icons, greeting strings, and
    several other options.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_119_0.png)


    By setting the Linux run level to graphical mode as described in this section,
    all users on the system start automatically in graphical mode. If you just want
    to have the graphical mode launch automatically after you log in at a text-mode
    prompt, you could add the startx command to one of your initialization scripts
    (such as .profile in your home directory), as described in the next section.


    # 17 Run a Program Automatically Each Time You Start Linux


    Linux follows a standard process each time you start the system, each time you
    log in by using your username and password, and each time you start the graphical
    environment (such as Gnome or KDE).'
