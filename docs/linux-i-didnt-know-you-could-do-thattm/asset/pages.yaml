- pgno: 106
  md: '# HACK YOUR HARD DISK


    | Action | Key to press in Block mode |

    |---|--|

    | Highlight different characters in the block. | Arrow keys |

    | View the next or previous block (sequentially). | Page Down or Page Up |

    | View the next or previous block for the inode that applies to the current block.
    | N, M |

