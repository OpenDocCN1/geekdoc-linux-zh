- pgno: 287
  md: '# 268 MAKE YOUR SYSTEM ENTERTAINING


    Using Gphoto is similar to using Gdc3-play: you follow the same basic process
    of reviewing an index of images and then download those you want onto the computer.
    The difference is that Gphoto is much more advanced in the photo manipulation
    that it provides via the Image menu (though very basic compared to the Gimp) and
