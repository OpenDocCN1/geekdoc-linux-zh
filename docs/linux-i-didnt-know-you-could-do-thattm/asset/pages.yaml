- pgno: 42
  md: '# Sniff Out At-Risk Passwords


    A single Risk login account to your system can provide a gateway for a cracker
    (a malicious hacker). Once inside your system, this person may be able to exploit
    other security holes and gain additional access, or set up entry points for re-entering
    the system after you have plugged the original security hole.


    A cracker can use one of several methods to determine the password of a user.
    Each of these methods described here requires that the cracker first obtain the
    encrypted password as it is stored in the /etc/passwd or /etc/shadow file on Linux
    system. Getting information that often isn''t as difficult as you might think.
    Once the encrypted password is in hand, the cracker can try various words to see
    which one yields the same encrypted text, thus determining the actual password.


    The hardcrack program described here uses what is called a brute force attack:
    it tries possible combinations of letters, numbers, etc. in order to find the
    correct matching password. The cracker program described next uses what is called
    a dictionary attack: it tries to duplicate the encrypted password by using all
    of the words in a large dictionary (a file full of words).


    > NOTE Many password-cracking programs are available on the Internet. The programs
    described here are just examples of the tools available to those seeking to break
    into your system.


    As a system administrator, you can use these programs to see if users on your
    system are using short or easily guessed passwords, then warn them to update their
    passwords if necessary.


    Many sources recommend using special characters in passwords, such as numbers
    and punctuation marks. These make it much harder to guess a password or to crack
    it using these tools. But length is the real key to password security.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# MAKE LINUX FASTER, BETTER, AND EASIER TO USE


    The author of hardcrack recommends using at least seven letters in a password.
    The README file shows that it takes him the following amount of time to crack
    a password of various lengths on a slow (100MHz) Pentium system.


    | 3 letters | 1 minute |

    | 4 letters | 1 hour |

    | 5 letters | 3 days |

    | 6 letters | 190 days |

    | 7 letters | 30 years |

    | 8 letters | Hundreds of years (he guesses) |


    Of course, much faster machines are standard these days, so the time needed to
    discover each of the above password lengths is usually less.


    # Hardcrack: the Brute Force Attack Method


    The hardcrack program is located on the CD in /Part01/Execute/Hardcrack. It works
    on the /etc/shadow file of your system, where Red Hat has encrypted data by default.
    Because only root can read /etc/shadow, you must be logged in as root to use hardcrack.
    If you want to check the password of a given user account, use that account name
    like this:


    ```

    # hardcrack -l username

    ```


    If you have the encrypted password text, you can enter it by character on the
    command line to have hardcrack work with that password. Up to six characters can
    be entered in this way:


    ```

    # hardcrack -1 23 -2 15 -3 55 -4 43 -5 62 -6 54

    ```


    Each digit of the encrypted password is given as a number between 0 and 64 (the
    code of the characters used for encrypted passwords).


    You can also use an -f option to cause hardcrack to look in the /etc/passwd instead
    of /etc/shadow for the username that you specify.


    After hardcrack has worked on the password for a time, it prints a simple message
    stating what the password is. It''s up to you to take corrective action.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'I''ve made a few modifications to the source code to make it use the shadow
    password file (described in the next section), and to make it compatible with
    Red Hat 7. The hardcrack program is still fairly simplistic as a brute force password
    cracker. As written, it only tries letters and numbers for passwords. If you want
