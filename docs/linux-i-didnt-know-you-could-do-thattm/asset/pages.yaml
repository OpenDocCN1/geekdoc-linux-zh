- pgno: 115
  md: 'Remember the old days of using DOS AUTOEXEC BAT files and Windows Start folders?
    This section describes how to do the same sort of thing with Linux. You can automatically
    start in graphics mode, run programs, set system variables, or do anything else
    you choose.


    Some additional functionality you will need in order to automatically run programs
    will be dependent on your graphical environment. The latest releases of both KDE
    and Gnome include a Startup feature similar to the Start folder in Windows. These
    features are described later in this section.


    # 16 Start Automatically in Graphics Mode


    The latest Linux products make it so easy to configure the graphical X Window
    System that you might never see a character console again (unless you choose to).


    For older systems where you have to log in and then start the graphical system,
    Linux provides a simple way to jump right to a graphical login screen, so you
    never have to log in via character mode. Avoiding character mode can be a benefit
    for several reasons, such as:


    +   * If you always log in and start the XWindows System, going to X automatically
    saves you some time when you boot your system.

    * If you install or manage Linux systems for users who are nervous about entering
    character-mode commands, you can configure Linux so they never see character mode
    again.


    > NOTE Recent releases of Linux (such as Red Hat 7) use a graphical login prompt
    by default, unless the installation program had trouble configuring your graphical
    hardware. Even so, you can use the information in this section to alter the standard
    settings, if you choose to experiment.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Linux has several modes of operation, called run levels. The standard character
    mode starts with run level 3. By switching Linux to run level 5, you always stay
    in graphics mode. Typical run levels in Linux are shown in the following table
    (some Linux distributions may use variations of this numbering, but the arrangement
    shown here is fairly standard and applies to Red Hat 7).


    | Run Level | Description |

    | 0 | System is halted. |

    | 1 | Single-user mode, used by the system administrator for maintenance. |

    | 2 | Multiuser mode without NFS networking. Not often used. |

    | 3 | Standard multiuser mode with networking active. |

    | 4 | Not defined. |

    | 5 | Like run level 3, but uses the graphical X Window System interface for user
    login. |

    | 6 | Reboots the system (shuts down all system services). |


    Before you can use run level 5, you must have the X Window System working already.
    If you can use KDE, Gnome, fwm, or other graphical window managers or desktops,
    you''re ready to use run level 5.

    Switch to run level 5 is easy. Just execute this command while logged in as root:


    ```

    # init 5

    ```


    After a few seconds, the graphical login prompt appears (this is actually a program
    called xdm, which you can configure within the /etc/X11/xdm-directory if needed).
    You can enter your username and password to start using your system. When you
    log out of your X Window graphical session (such as the Gnome desktop), you return
    to the graphical login screen; you


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_116_0.png)'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# AUTOMATE YOUR ENTIRE SYSTEM


    never return to the character-mode screen unless you execute this command within
    a graphical terminal window:


    # # init 3


    Having run level 5 with the init command, you can now make it the default on your
    system that every time you start Linux, it begins with a graphical login prompt.
    The easiest way to do this is by using the LinuxConf configuration utility in
    Red Hat Linux. To open LinuxConf, choose LinuxConf from the Gnome main menu.


    Next, make certain that the Config tag is selected. The options in list that matter,
    click boot mode ➤ Mode default boot mode. This window appears, where you can select
    whether to start in text or graphics modes.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_117_0.png)


    The information on this window also controls simple aspects of the LILO program
    that Red Hat uses to boot into Linux. (Study the /etc/lilo.conf program and associated
    page for more information.) The part that relevant to this discussion is set of
    options listed Default select:


    **Graphic & Network** This is the run level 5 discussed above, in which a graphical
    login is always presented to you.'
