    # # 34 Fine-Tune Your Apache Configuration


    The copy of Apache that comes installed by default on your Linux system is probably
    great for viewing online documentation and serving up a few personal or business
    Web pages, but Apache is capable of much more. However, the default configuration
    used by most Linux vendors isn''t designed to support the next amazon com site.
    This section lists tips for tuning Apache for better performance.


    > **NOTE** You should know up front that the designers of Apache didn''t intend
    it to be the fastest server in the world, though everyone loves using benchmarks.
    Apache is highly configurable, very stable, and fast enough for most users without
    a lot of additional configuration. Some other Web servers (Roxen and Zeus come
    to mind) are probably faster but don''t have the configurability of Apache.


    # ## Support Massive Web Traffic


    Apache running on a basic Linux system can easily fill 10Mbps of outgoing bandwidth
    (see www.mindcraft.com for a few survey details), but this isn''t enough for many
    busy Web sites. In these cases, you can use multiple parallel Web servers, but
    you also want to get the most performance you can get out of each server.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Performance limits on Apache can be related to either the operating system
    that Apache is running on or to the configuration of Apache and its modules. Some
    keys to improving the performance of your Web site are provided in this section.


    When you start Apache, that process begins receiving Web requests on the network,
    but it doesn''t respond to them itself. Instead, it starts other copies of Apache
    responding to the requests, each copy of Apache being controlled by the master
    copy that started first.


    Additional system memory is probably the most useful hardware addition to speed
    up a Web server. With more memory, you can run more copies of Apache simultaneously
    and serve Web pages from memory rather than hard disk. If you''re concerned about
    Web-server performance, you should adjust your system so that it never has to
    swap memory to disk.


    You can adjust the following directives to control how many copies of Apache are
    used and how they behave. To use the higher values suggested in this list, you
    should have a powerful server (a dual-Pentium III at 1GHz with 512MB a good starting
    place).


    **MaxServers** This is the number of copies of Apache that is always kept running.
    Set this number if your Web traffic is irregular ("spiky") so that spare servers
    are always available to handle sudden bursts of traffic. A default value of 5
    might be increased to 25 for a busy server. Each additional server can use a megabyte
    or more of memory, to plan your hardware accordingly.


    **MaxSpareServers** This is the maximum number of copies of Apache that will be
    started on your system. This number imposes a limit on the resources used by Apache
    as it tries to handle incoming requests. A busy server might have this directive
    set to 100 or more. In version 1.3.x of Apache, the master server starts additional
    copies of Apache to handle heavy traffic at the rate of one the first second,
    two the next, four the next, eight, and so forth. This continues until Apache
    is spawning 32 copies of itself per second, every second, until the available
    servers can handle the incoming request load or until other resource limits are
    reached.


    **MaxClients** This is the maximum number of distinct clients that can connect
    to the Web server (to all copies of Apache). Each client can have multiple simultaneous
    requests, but once this limit is reached, another'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'client requesting a document be put on hold until Apache has finished handling
    requests for one of the current clients. The value of this directive may be set
    to 256 or higher. You should also check the HARD_SERVER_LIMIT in the http.h file
    to update how much traffic Apache will allow. This prevents Apache from crashing
    your system when it runs out of resources.


    MaxRequestsPerChild This is the maximum number of requests that a copy of Apache
    will handle before being closed and another copy of Apache is started to replace
    it. This prevents a long-running copy of Apache from causing problems because
    of system memory leaks. On Linux, where memory leaks are not a problem, set this
    directive to 0 to avoid the overhead of killing and restarting processes on a
    busy server. For safety''s sake, you may set this to 10000, so that each copy
    of Apache only serves 10000 pages before being closed and restarted.


    SendBufferSize This is the size of the TCP buffer used to send outgoing data.
    If you have a fast connection to the Internet (such as a T3 line), setting this
    value higher than the default will improve performance.


    HostnameLookups By setting this directive to Off, Apache will log the IP address
    of incoming requests rather than the domain. This saves a lot of time for each
    request. Apache includes tools to update log files by looking up hostnames "offline"
    so you''re not using your Web-server capacity.


    Options FollowSymLinks Although this option is usually not recommended on high-security
    Web servers, many people like to use it to accommodate their preferred file organization.
    It causes additional calls to the system to retrieve a file. Avoiding FollowSymLinks
    will speed up your server.


    AllowOverride A similar issue occurs when the AllowOverride option is included
    in your configurations. Although this provides great flexibility for setting up
    a large server or one maintained by multiple individuals, AllowOverride causes
    Apache to search for and then parse an entirely new access file (typically .htaccess)
    anytime a file is requested from a directory in which AllowOverride is activated.
    For fastest results, use All AllowOverride None in the top-level directory configuration
    for Apache.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'You can find more detailed information about several of these directives in
    the manual that comes with Apache. To view this, install the apache-manual package
    from /Part08/Execute/Apache. Once the package is installed, use this command to
    view the manual (or point Netscape to the same location):


    ```

    $ lynx /var/www/html/manual/index.html

    ```


    Within the first page (index.html), move down to the links General Performance
    Hints and OS Specific Performance Hints. The first is a 39-page document describing
    how to get the most out of Apache. Many of the items in this section are summarized
    from that file. The second file isn''t of much help to Linux users—it simply says
    that Linux can handle a heavy load!


    This document also details source-code issues (including some simple configuration
    selections you can make before compiling Apache) that will improve performance
    but which are beyond the scope of our discussion here.


    With a few finely-tuned directives, the most time-consuming part of serving a
    Request is running the scripts and server-side programs that are needed to prepare
    a dynamic HTML page. To increase your throughput, try these techniques:


    +   * If your scripts are written in Perl, Python, or tcl, try one of the modules
    mentioned in the last section (especially mod_perl-1) that builds a script interpreter
    into Apache. These can dramatically improve performance when running your scripts


    +   * For all types of scripts, try the module FastCGI, which is included on the
    CD in /Part08/Source/Apache_modules. This module makes scripts run much faster
    by keeping them in memory the times they are called.


    +   * If you have static HTML pages that are requested frequently, use the mod_mmap_static
    module (part of the standard Apache code, though it''s not included by default).
    This module keeps HTML pages loaded into memory so they can be returned to a client
    without reading the hard disk. But read the configuration documents carefully
    to be certain you''re getting the most out of this module.


    +   * Use a separate database server on your local network to spread the processing
    load of database lookups. Be certain you have a very fast internal network, however,
    or this may cause a bottleneck between the Web and database servers.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_313_0.png)'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Adjust adjusting Apache, a network analyzer might still indicate that you still
    have unused network bandwidth and incoming Web-browser requests that could use
    it (meaning that the Apache server is the bottleneck). The suggestions given in
    the following list may allow Linux to handle-more Web traffic:


    +   * Adjust the number of processes allowed by Linux. Sometimes the number of
    Apache processes needed to service Web requests outstrips the preset limit in
    Linux. You can change this value in the Linux sourcecode and recompile your Linux
    kernel.


    +   * Adjust the number of file handles that Linux allows. Each copy of Apache
    uses a couple of file handles. If they''re all used up, Apache can''t do anything
    until some are released by another copy of the program.


    More hints for tuning Linux performance are available at www.tunelinux.com. Specific
    hints for working with different parts of the system (kernel, file systems, etc.)
