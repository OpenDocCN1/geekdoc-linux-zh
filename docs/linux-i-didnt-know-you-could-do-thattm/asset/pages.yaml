- pgno: 281
  md: 'NOTE I include the device name in my example commands. If you don''t include
    a device, dragrab assumes it should use /dev/cdrom. If your system is set up to
    use that standard device, the command dragrab -i works fine without the device
    name.


    The far right column, labeled MB, tells how many megabytes of disk space will
    be required to grab each track. If I wanted to dump all of the tracks to my hard
    disk, I would use this command:


    ```

    $ dragrab -a /dev/cdrom

    ```


    The default filename of trackX.wav is used, where X is the track number of each
    track''s file. You can also use an -f option to specify a different file-name.
    Use %02d as a variable for the track number. For example:


    ```

    $ dragrab -a f song02d.wav

    ```


    In the same vein, you can dump a single track by indicating the track-number.
    The filename trackX.wav is used by default, or once again you can specify a filename
    using the -f option. For example, to capture only Track 7 after reviewing the
    CD index, use this command:


    ```

    $ dragrab 7 -f mozart7.wav

    ```


    NOTE The dragrab program includes several options to control the use of local
    and remote CDDB data when working with your audio CDs. See the main page for details.


    Another interesting command utility is the Festival speech synthesizer. Festival
    is a general purpose text-to-speech system. It uses a command line interface (with
    a festival> prompt) to accept commands or to translate text to spoken sounds.


    The Festival speech synthesizer is located on the CD in the directory /Part07/Execute/Festival.
    You can use a standard rpm command to install it. Start the program with the command
    Festival. When the festival> prompt appears, you can start by entering help to
    see a list of initial options.


    ![](img/35c1af90d4f3af9cd7cfd006c6b752f5_281_0.png)'
  merge: -1
