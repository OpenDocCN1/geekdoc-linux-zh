- pgno: 333
  md: 'Networking computers together is a very big topic. Entire books (much larger
    than this one) have been written on the subject. Once you have your basic network
    up and running, however, you may not think about rearranging it to improve performance,
    increase security, or make it easier to maintain from day to day.


    This part describes how to enhance what your Linux network can do, and how securely
    it can be done. Many of the features described are part of your standard Linux
    product—you just didn''t know all the tricks it could do until now.


    # 38 Connect in New Ways


    Whether you''re using a single desktop Linux system or running a Linux-based network,
    once you have your network connection established, you probably don''t think much
    about it. In this section, you''ll see several ways that Linux can connect to
    a network. One might be the one you''re using—or the one you should consider using.


    # Connect without Managing IP Addresses


    The bane of running a LAN with Internet connectivity is managing the IP addresses
    of numerous clients. Anytime a configuration change is required, the TCP/IP information
    on each host must be laboriously and individually updated. This becomes a special
    nightmare when you change ISPs (or your ISP changes something) and you must alter
    the class C address of your network. This requires you to update every system
    on your network with new IP address information.


    By using the Dynamic Host Configuration Protocol (DHCP), clients on your network
    request and are assigned IP addresses automatically each time they are turned
    on. If IP address configurations must be changed, they'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'can be changed on the DHCP server—one time—and the results are prop- gated
    to all clients automatically.


    > NOTE the IP address information sent to clients by a DHCP server can have an
    expiration time associated with it, clients don''t need to be restarted for new
    IP ad- dresses to take effect. When the current addresses expire, the DHCP server
    automatically hands out new, updated information.


    Linux can act as a DHCP client, receiving an assigned IP address from a DHCP server.
    Linux can also act as a DHCP server, assigning IP addresses to clients on your
    network. The addresses that DHCP assigns are based on a pool of addresses and
    on configuration information that you provide. Check with your system administrator
    about the availability of a DHCP server on your current network.


    The DHCP client daemon, dhcp (note the ending cd for client daemon), is installed
    by default on your Red Hat Linux 7 system. If you need to add to your system,
    I''ve included it on the CD in the directory /Part09/ Execute/DHCP_client. You
