  md: '![](img/35c1af90d4f3af9cd7cfd006c6b752f5_379_0.png)


    +   5. Select the printer model to which the Linux Samba server is printing.

    6. Print a test page if you wish.


    > **NOTE** If you''re using a newly installed Linux server for this Samba server
