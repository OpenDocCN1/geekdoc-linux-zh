- pgno: 56
  md: '# # View Network Traffic with edxump


    The utilities described earlier in this section (such as xperf++) don''t show
    you much detail about the network activity; they only display how much activity
    there is.


    The edxump utility is a very basic command line tool that captures the actual
    data within packets. This allows you to analyze information about network patterns
    and potential security hazards with much greater accuracy.


    The dump utility is located on CD in the directory /Part01/Execute /Edxdump. You
    can run this utility from any command line. Edxump has no user interface per se.
    You simply provide command line options to indicate what network traffic you want
    to watch. You can either print details to the screen or save them to a file.


    To use edxump (or any of the tools in the following sections), you''ll want to
    be familiar with some networking basics—like the difference between ICMP and TCP
    network packets. A basic book on Linux networking contains all the details. You
    can also learn a lot by reviewing the Networking HOWTO. Point your browser to
    one of the following files on the CD:/A11-HOWTO-Docs/Networking-Overview-HOWTO.html
    or /A11-HOWTO-Docs/NET-3-HOWTO.html.


    The edxump command uses the -c option to specify which protocols should be tracked.
    You can include c for ICMP, t for TCP, and u for UDP packets. You can also restrict
    the port number for which you are watching packets using the -p option. This is
    a useful option on a busy network where you only want to check the traffic for
    a single incoming or outgoing program''s data. The -d option causes the data within
    a packet to be discarded, making the on-screen data or saved file much smaller
    (and thus easier to study for networking patterns).


    > NOTE A README for edxump contains a full description of the available command
    line options. It is included in the /Part01/Execute/Edxdump direct-ory on the
    CD.


    The following example dumps ICMP, TCP, and UDP packets to the file test.dump in
    verbose mode (which shows the internal details of each packet header).


    ```

    # edxump -cctu -f test.dump -v

    ```'
