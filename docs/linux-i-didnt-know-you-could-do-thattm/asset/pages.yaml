    machine if you want to try cracking passwords!


    # Nutcracker: The Dictionary Attack Method


    A second password cracking tool that uses a dictionary attack method is called
    nutcracker. The cracker program includes a small sample dictionary file and sample
    password file to demonstrate how the program operates. To really use it, you would
    normally use the dictionary file included with Red Hat: /usr/share/dict/words.
    This file contains 45,000 words.


    The default password settings of Red Hat already cause the passwd command to check
    each password entered by a user against the words file, to avoid having users
    rely on simplistic or short passwords. But you can still use nutcracker to check
    passwords. If you have access to larger dictionaries, you might also try those
    to see if users have used common dictionary words that are not included in the
    words file.


    If you''re curious, you can easily add words to words using any text editor. Just
    enter this command to view the word list, saving the file when you''re done:


    ```

    # vi /usr/share/dict/linux.words

    ```


    The file /usr/share/doc/words-2/README.linux.words contains some interesting details
    about how the linux file was assembled, and which words it contains and doesn''t
    contain. Basically, to create this file, numerous proper names, computer terms,
    acronyms, abbreviations, and similar items likely to occur around computer people
    were added to several core dictionary files that had been stripped of copyrighted
    terms.'
