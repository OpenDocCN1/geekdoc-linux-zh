  md: 'ommend sticking with catdoc or antiword rather than forcing the installa-tion
    libwmf.


    Once you have WordView installed, you have a number of programs at your disposal.
    These include the following:


    +   * wvText converts a Word file to plain text.


    +   * wvPS converts a Word file to a PostScript file.


    +   * wvMime views your documents using Ghostview instead of acting as a conversion
    engine.


    +   * wvPDF converts a Word file to PDF format.


    +   * wvAbw converts a Word file to AbiWord format.


    +   * wvHtml converts a Word file to HTML 4.0.


    +   * wvLate converts a Word file to LaTeX format.


    +   * wvWml converts a Word file to Wml format.


    +   * wvDvi converts a Word file to a DVI file.


    +   * wvWare converts a Word file to various formats using the above programs.


    Although this list is very impressive, when I actually use the programs to convert
    files, the program has been full of errors (though the rpms install without a
    hitch). If you need one of the features mentioned in this list, I recommend exploring
    this powerful package more fully. Otherwise, stick with catdoc to dump the text
    from a Word document to the screen for easy reading.


    # 25 Run Your Windows Applications on Linux


    If the native Linux applications described so far in this part don''t meet all
    your needs, try running your existing Windows applications on Linux using the
    tools described in this section. It can take a little effort to set up some of
    these tools, but the results are impressive.'
