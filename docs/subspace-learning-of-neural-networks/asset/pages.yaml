    # 8.1  Introduction


    In the Chapters 2, 3 and 4, we have studied the convergence of PCA learning algorithms.
    However, to apply PCA neural networks to practical problems, an important issue
    to address is how to determine an appropriate number of principal directions for
    the PCA neural networks. The number of principal directions crucially affects
    the computation results of PCA neural networks. For example, in the application
    of PCA neural networks to image compression, if the number of principal directions
    is too low, the quality of the reconstructed image would be inadequate. However,
    if the number of principal directions is too high, an excessive computational
    burden would be incurred. So far, this problem, that is, how to adaptively select
    an appropriate number of the principal directions so as to strike an adequate
    balance between the quality and complexity of computations, is still largely unsolved.


    In the past, the number of principal directions for PCA neural networks is usually
    specified based on prior knowledge. Obviously, this is not practical in many applications,
    especially for online ones. In this chapter, a biologically plausible PCA model
    is proposed to overcome this problem. The number of principal directions in this
    model is determined to adaptively approximate the intrinsic dimensionality of
    the given data set by using an improved generalized Hebbian algorithm (GHA). Thus,
    the given data set can be compacted to a subspace with intrinsic dimensionality
    through the proposed network. This allows a balance to be struck between the quality
    of results and the complexity of computations needed to achieve it [126].


    It is known that intrinsic dimensionality of a data set reflects an appropriate
    number of principal directions of the data set. In more general terms, a data
    set Ω ∈ Rⁿ is said to have an intrinsic dimensionality equal to m if its elements
    lie entirely within an m-dimensional subspace of Rⁿ, where m < n [26]. There are
    several methods to evaluate the intrinsic dimensionality of a data set, see [26,
    151]. In [151], Rubio proposed an explained variance method to identify the intrinsic
    dimensionality m of a given data set to approach a'
