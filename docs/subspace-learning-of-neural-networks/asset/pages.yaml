    # 3.3 Oja’s PCA Algorithms with Adaptive Learning Rate


    Oja’s PCA algorithm with adaptive learning rate is rewritten as


    $$w(k+1)=w(k)+\frac{\tilde{\xi}}{w(k)^T C_{x(k)}w(k)}\left(C_{x(k)}w(k)-w(k)^T
    C_{x(k)}w(k)w(k)\right),\tag{3.4}$$


    for all $k \leq 0$ and $0<\tilde{\xi}<1$.


    We will use DDT method to indirectly study the convergence of (3.4). The DDT system
    characterizes the averaging evolution of the original one [210]. Taking the conditional
    expectation $E\{w(k+1)\mid w(0),w(i),\ i<k\}$ to both sides of (3.4), it follows
    that


    $$E\{w(k+1)\}=E\left\{w(k)+\frac{\tilde{\xi}}{w(k)^T C_{x(k)}w(k)}Y(k)\right\},$$


    where


    $$Y(k)=\left(C_{x(k)}w(k)-w(k)^T C_{x(k)}w(k)w(k)\right).$$


    Clearly, the probability $P(Y(k))$ and $P\left(\frac{\tilde{\xi}}{w(k)^T C_{x(k)}w(k)}\right)$
    only depend on the distribution of the variable $X$. It is easy to see that $P(Y(k))$
    is not affected by the value of the learning rate (3.3); that is, the value of
    the learning rates (3.3) gives no information on the value of $Y(k)$. Thus, the
    learning rate (3.3) and $Y(k)$ are independent each other. Thus, it holds that


    $$E\{w(k+1)\}=E\{w(k)\}+E\left\{\frac{\tilde{\xi}}{w(k)^T C_{x(k)}w(k)}\right\}E\{Y(k)\}.$$


    Since


    $$E\left\{\frac{\tilde{\xi}}{w(k)^T C_{x(k)}w(k)}\right\}=\alpha\cdot\frac{\tilde{\xi}}{w(k)^T
    Cw(k)}=\frac{\tilde{\xi}}{w(k)^T Cw(k)},$$


    where $\alpha>0$, the corresponding DDT algorithm of (3.4) is as follows:


    $$w(k+1)=w(k)+\frac{\tilde{\xi}}{w(k)^T Cw(k)}\left(Cw(k)-w(k)^TCw(k)w(k)\right),\tag{3.5}$$'
