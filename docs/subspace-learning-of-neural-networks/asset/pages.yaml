  md: 'Let us consider the case when the observation data are a three-dimensional
    data set, which comes from an ellipsoid. Generate a noise observation data set
    $D=\{(x_i,y_i,z_i),i=0,1,\ldots,N\}$ by adding Gaussian noise to the original
    data points. We can have a parameterized model


    $$a_1x^2+a_2y^2+a_3z^2+c_0=0 \tag{9.3}$$


    to be fitted to the data points by estimating these parameters $a_1,a_2,a_3$.
    By applying the improved Oja+s MCA neural network, the steps to get the fitted
    surface are as follows:


    +   1. Calculate the means $e_f=[e_1,e_2,e_3]^T$, $e_1=E(x'')$, $e_2=E(y'')$,
    $e_3=E(z'')$.

    +   2. Subtract the means from each data point, that is, $\xi_i^{(1)}=x_i''-E(x'')$,
    $\xi_i^{(2)}=y_i''-E(y'')$, $\xi_i^{(3)}=z_i''-E(z'')$, to get a zero-mean data
    set.

    +   3. Initialize the weight vector $w(0)=[w_1,w_2,w_3]^T$ by random elements,
    and let $x(j)=[\xi_1^{(j)},\xi_2^{(j)},\xi_3^{(j)}]^T$, $j$ be a random integer
    with equal probability being any integer of $\{1,2,\ldots,N\}$.

    +   4. Use (9.2) to adaptively adjust $w$, so that $[a_1,a_2,a_3]^T=w$ and $c_0=-E^Tf(x)$,
    where $a_1,a_2,a_3,c_0$ are the corresponding parameters in (9.3).

    +   5. Renormalize the parameters to the case of nonzero means for the data points
    by substituting $a_1,a_2,a_3,c_0$ to (9.3), that is, $a_1=-w_1/c_0$, $a_2=-w_2/c_0$,
    $a_3=-w_3/c_0$, $c_0=-w^Te_f$.


    # 9.3 Multi-Block-Based MCA


    In MCA direct method, MCA is applied directly to the whole data set once to obtain
    the smallest weight vector [185]. For multi-block-based MCA on surface fitting,
    we implement the fitting process in the following steps:


    +   1. Partition. To divide the original data set into smaller blocks, then apply
    the improved Oja+s MCA neural network to each block individually, and subsequently
    reconstruct the blocks using re-sequenced weight vectors, respectively.

    +   2. Grouping. To group all the reconstructed blocks into one block according
    to the order in which they were before partition.

    +   3. Fitting. To apply the improved Oja+s MCA neural network to the grouped
    block.


