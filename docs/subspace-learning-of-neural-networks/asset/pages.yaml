- pgno: 127
  md: '# MCA Learning Algorithms


    # 5.1  Introduction


    In the past several years, many neural networks learning algorithms were proposed
    to solve the MCA problem, such as [36, 38, 48, 60, 119, 130, 135, 185]. These
    learning algorithms can be used to calculate minor component direction from input
    data without calculating the covariance matrix in advance, which makes neural
    networks method more suitable in real-time applications and have a lower computational
    complexity than traditional algebraic approaches, such as eigenvalue decomposition
    (EVD) and singular value decomposition (SVD). However, there is a divergence problem
    in some existing MCA algorithms [48, 130]. For example, OJan algorithm [185],
    MCA EXIN algorithm [48], and LUO algorithm [119] may suffer from the divergence
    of weight vector norm, as discussed in [48]. To guarantee convergence, some self-stabilizing
    MCA learning algorithms are proposed, for instance, MOLLER algorithm [130], CHEN
    algorithm [36], DOUGLAS algorithm [60], and Ye et al.’s algorithms [188]. In these
    self-stabilizing algorithms, the weight vector of the neuron can be guaranteed
    to converge to a normalized minor component direction. In this chapter, following
    the studies in [36, 60, 130, 186], we propose a stable neural networks learning
    algorithm for minor component analysis, which has a more satisfactory numerical
    stability compared with some existing MCA algorithms.


    Convergence of MCA learning algorithms is crucial to practical applications [142,
    143, 144, 190]. Usually, MCA learning algorithms are described by stochastic discrete
    time (SDT) systems. It is very difficult to study the convergence of the SDT system
    directly.


    In this chapter, we analyze dynamical behaviors of the proposed MCA algorithm
    via DDT method and obtain the conditions to guarantee convergence [145].


    This chapter is organized as follows. In Section 2, a stable MCA algorithm is
    proposed. In Section 3, dynamics of the proposed algorithm are analyzed via DDT
    method. Simulations are carried out to further illustrate the theoretical results
    in Section 4. Conclusions are given in Section 5.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 5.2 A Stable MCA Algorithm


    Suppose that the input sequence \(\{x(k)\mid x(k)\in R^n(k=0,1,2,\ldots)\}\) is
    a zero mean stationary stochastic process and consider a linear neuron with the
    following input output relation:


    \[y(k)=w^T(k)x(k),\qquad (k=0,1,2,\ldots),\]


    where \(y(k)\) is the neuron output and \(w(k)\in R^n\) is the weight vector of
    the neuron. In [184], To solve the problem of principal component analysis (PCA),
    Xu proposed the following PCA learning algorithm:


    \[w(k+1)=w(k)+\eta\left[(2-w^T(k)w(k))y(k)x(k)-y^2(k)w(k)\right],\qquad (5.1)\]


    where \(\eta>0\) is the learning rate. In Chapter 3, it has been discussed that
    Xu''s algorithm converges to a principal component direction in which input data
    have the largest variance. Contrary to principal component direction, input data
    have the smallest variance in the minor component direction. Thus, a corresponding
    MCA learning algorithm can be obtained by simply reversing the sign in (5.1) and
    given as


    \[w(k+1)=w(k)-\eta\left[(2-w^T(k)w(k))y(k)x(k)-y^2(k)w(k)\right].\qquad (5.2)\]


    Unfortunately, theoretical analysis and simulation results show that the above
    algorithm (5.2) is divergent, that is, the norm of weight vector \(w(k)\) will
    approach to infinity. To avoid the problem of divergence, we add a penalty term
    0.5 \([1-w^T(k)w(k)]\) to (5.2) and get a stable MCA learning algorithm as follows:


