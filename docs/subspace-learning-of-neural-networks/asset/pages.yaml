    # ### 4.3  Convergence Analysis


    In this section, we will study the convergence of (4.4). We will prove that starting
    from the initial vectors except those in the subspace $V_l^\perp$, the algorithm
    (4.4) will converge to a vector in the subspace $V_l$. Since the dimension of
    $V_l^\perp$ is less than $n$, the measure of $V_l^\perp$ is zero so that any unstable
    behavior cannot be observed in practical applications. From this point of view,
    the algorithm (4.4) is globally convergent. This proof will be completed using
    mathematical induction.


    # #### 4.3.1  Outline of Proof


    The mathematical induction will be used to prove that, by using algorithm (4.4),
    $w_l(k)$ converge to $\pm v_l$, $1\leq l\leq p$.


    For case $l=1$, Lemmas 4.2 and 4.3 give the bounds of $\|w_1(k)\|$ as


    $$0<\sqrt{\frac{4(1-\xi)\xi\hat{\lambda}_p}{\lambda_1}}\leq \|w_1(k+1)\|\leq \hat{H}_1,$$


    where $\hat{H}_1$ is a constant. Then, Lemma 4.4 proves that $z_i^1$, $i=(2,\ldots,n)$
    converge to zero and Lemma 4.5 proves that $z_1^1$ converge to a constant. Finally,
    the conclusion $w_1(k)$ converges to $\pm v_1$ is proved in Theorem 4.1.


    Next, under the assumption that $\lim_{k\to\infty}w_i(k)=\pm v_i$, $(i=1,\ldots,l-1)$,
    we prove that $w_l(k)$ converges to $\pm v_l$. Lemma 4.6 gives the bounds that


    $$\sqrt{2\xi(1-\xi)\sqrt{\frac{\hat{\lambda}}{\lambda_1}}}\leq \|w_l(k+1)\|\leq
    \hat{H}_l,$$'
