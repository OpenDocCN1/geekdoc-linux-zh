    # PCA Learning Algorithms with Constants Learning Rates


    # ## 2.1 Introduction


    Principal component analysis (PCA) neural networks are useful tools in feature
    extraction, data compression, pattern recognition, and time series prediction,
    especially in online data processing applications. The learning algorithms of
    PCA neural networks play an important role in their practical applications. Stemming
    from Oja’s algorithm [134], many PCA algorithms have been proposed to update the
    weights of these networks. Among the algorithms for PCA, Oja’s algorithm and Xu’s
    LMSER algorithm are commonly used in practical applications. Several other algorithms
    for PCA are related to the two basic procedures [32]. In this chapter, we will
    study the Oja’s and Xu’s algorithms and establish the theoretical foundation of
    their applications.


    The convergence of the learning algorithms determines whether these applications
    can be successful. This chapter propose a convergence analysis framework, called
    DDT method, to study the convergence of Oja’s and Xu’s algorithms with constant
    learning rates. The original SDT algorithms are first transformed into the corresponding
    DDT algorithms. Then, local non-divergence conditions are guaranteed by using
    the invariant sets. Finally, in the invariant sets, the local convergence properties
    of the DDT algorithms are discussed via Cauchy principle, inequalities analysis
    method, and so on.


    This chapter is organized in three parts. The first part¹ analyzes the convergence
    of Oja’s algorithm with a constant learning rate via DDT method. In Section 2.2.1,
    we will briefly discuss the Oja’s PCA learning algorithm and the traditional DCT
    method. Some preliminaries and the DDT formulation will be presented in Section
    2.2.2. In Section 2.2.3, invariant sets and convergence will be studied. Simulation
    results and discussions will be provided in Section 2.2.4. Finally, conclusions
    will be drawn in Section 2.2.5.


    The second part of the chapter discusses the convergence of Xu’s LMSER algorithms
    with a constant learning rate. Section 2.3.1 describes the formulation and preliminaries.
