    $$\psi(k)=\left[\frac{(1+\eta a)(a+3b)+\eta bKurt(s_j)z_j^2(k)}{(1+\eta a)(a+3b)+\eta
    bKurt(s_{j_0})z_{j_0}^2(k)}\right]^2.$$


    **Proof:** For $j_0 \in Q$ and any $j \in (Q \cup O)/j_0$, from (6.7), it follows
    that


    $$\frac{z_j^2(k+1)}{z_{j_0}^2(k+1)}=\gamma(k)\frac{z_j^2(k)}{z_{j_0}^2(k)}, \tag{6.8}$$


    for all $k \ge 0$, where


    $$\gamma(k)=\left[\frac{1+\eta a-\eta a\|z(k)\|^2+\eta b\bigl(Kurt(s_j)z_j^2(k)+3\|z(k)\|^2\bigr)}{1+\eta
    a-\eta a\|z(k)\|^2+\eta b\bigl(Kurt(s_{j_0})z_{j_0}^2(k)+3\|z(k)\|^2\bigr)}\right]^2.$$


    If $Kurt(s_{j_0})z_{j_0}^2(k) > Kurt(s_j)z_j^2(k) \ge 0$, by Lemma 6.5, it holds
    that $0 < \gamma(k) < 1$. From (6.8), it holds that


    $$z_{j_0}^2(k+1)z_j^2(k) > z_j^2(k+1)z_{j_0}^2(k) \ge 0.$$


    So, it is easy to see that


    $$Kurt(s_{j_0})z_{j_0}^2(k+1) > Kurt(s_j)z_j^2(k+1) \ge 0.$$


    Thus, if $Kurt(s_{j_0})z_{j_0}^2(0) > Kurt(s_j)z_j^2(0) \ge 0$, it holds that


