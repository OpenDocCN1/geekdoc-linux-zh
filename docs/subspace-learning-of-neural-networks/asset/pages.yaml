  md: '# 2.3.5  Conclusion


    Important results pertaining to the convergence of a DDT algorithm of Oja’s PCA
    learning algorithm have been derived in this section. It shows that almost all
    trajectories starting from an invariant set converge to the unit eigenvector associated
    with the largest eigenvalue of the covariance matrix if the learning rate satisfy
    some simple condition. We suggest using the unit hyper-sphere for conveniently
    choosing the initial vector to guarantee convergence and the selection of learning
    rate to achieve fast convergence. Simulation studies are carried out to further
    illustrate the theory. The most important result is that it confirms that the
    use of a constant learning rate for Oja’s PCA learning algorithm can achieve convergence.


    # 2.4  Xu’s LMSER Learning Algorithm


    In [184], based on the least mean square error reconstruction, Xu proposed a learning
    algorithm to perform the true PCA. In this section, by using the DDT method, we
    will discuss the convergence of Xu’s LMSER algorithm, in the one unit case, with
    a constant learning rate. An invariant set and an evolution ultimate bound are
