- pgno: 175
  md: '# Chaotic Behaviors Arising from Learning Algorithms


    # 7.1  Introduction


    In the previous chapters, we have discussed the convergence of some subspace learning
    algorithms by mainly using the DDT method. Some invariant sets of these algorithms
    will be obtained under certain conditions. The convergence conditions of these
    algorithms will be derived. However, some learning algorithms exhibit some chaotic
    behaviors in practical applications. In [123], Xu’s LMSER algorithm can produce
    chaotic behaviors when the learning rate is chosen in certain range. The article
    [122] also explores chaotic behaviors of the Douglas’s MCA learning algorithm
    [60].


    Chaotic behaviors are crucial to use learning algorithms in practical applications.
    On the one hand, chaotic behavior may result in the breakdown of the system [178].
    Thus, how to choose a system parameter to avoid the chaotic behavior is very important.
    See examples [2, 78, 79, 92, 110]. On the other hand, chaotic behaviors can be
    applied in many scientific disciplines: mathematics, finance [105], biology [161,
    6], engineering [34, 33, 140, 163, 183], and ecology [58, 16].


    In this chapter, we explore the stability and chaotic behavior of a class of ICA
    algorithms of the one-dimensional type [121]. Though we only discuss the one-dimensional
    case of the original algorithms, this can shed light on the dynamical behavior
    of the original algorithms.


    In [86], Häyrinen and Oja proposed some neuron models for ICA. The corresponding
    learning algorithms are described as


    $$\mathbf{w}(k+1)=\mathbf{w}(k)+\mu(k)\left[-\sigma(x(k))g\left(\mathbf{w}^{T}(k)\mathbf{x}(k)\right)-f\left(\|\mathbf{w}(k)\|^{2}\right)\mathbf{w}(k)\right],$$


    where $f$ is a scalar function, and $\sigma=\pm 1$ is a sign that determines whether
    we are minimizing or maximizing kurtosis [86]. $\mu(k)$ is the learning rate sequence
    and $x(k)$ is a prewhiten input data. The function $g$ is a polynomial:


    $$g(y)=ay-by^{3},$$


    where $a\geq 0$ and $b>0$.


    In practical applications, constant learning rates are usually required to'
