    # 2.3  Oja’s Algorithm


    In 1982, Oja used a simple linear single neural network in Figure 1.1 to extract
    the first principal component from the input data [134]. Based on the well-known
    Hebbian learning rule, Oja proposed a principal component analysis (PCA) learning
    algorithm to update the weights of the network. This network, under Oja’s algorithm,
    is able to extract a principal component from input data adaptively. The results
    have been useful in online data processing applications.


    In [210], Zufiria proposed to study the dynamical behaviour of Oja’s learning
    algorithm by analyzing a related DDT algorithm. Certain local and global dynamical
    properties of DDT algorithm have been reported in [210]. Zufiria has shown that
    some trajectories of the DDT algorithm can be divergent and even chaotic in nature.
    Certain local stability results have also been reported. Following the DDT algorithm
    approach of [210], a generalized Oja’s PCA learning algorithm, called bounded
    PCA algorithm, has been studied in [202].


