  md: "![](img/5d1bf22d32ba379cbf31221a5347fdb6_233_0.png)\n\n**FIGURE 11.4**  \n\
    CT-MR images registration: (a) Patient’s head CT image and (b) its contour, centroid,\
    \ principal components. (c) Patient’s head MR image and (d) its contour, centroid,\
    \ principal components. (e) Comparison of contours before registration versus\
    \ (f) after registration\n\n11.4(a) is the reference image and 11.4(c) is the\
    \ corresponding float image. Figure 11.4(b) and 11.4(d) are feature images of\
    \ Figure 11.4(a) and 11.4(c), respectively. The reference image’s contour and\
    \ registered image’s contour are compared in Figure 11.4(f). Clearly, the two\
    \ contour almost overlap, which illustrates the proposed method is promising for\
    \ CT-MR image registration.\n\n# 11.4 Conclusion\n\nThis section proposes an automatic\
    \ method for CT-MR registration or MR-MR registration. The proposed method based\
    \ on feature images accomplishes registration by simply aligning the first principal\
    \ directions and centroids of feature images. Since a PCA neural network is used\
    \ to compute the first principal directions of feature images, the registration\
    \ is simple and efficient."
