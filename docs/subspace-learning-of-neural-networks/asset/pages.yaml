- pgno: 145
  md: '# # 6

    ## ICA Learning Algorithms


    # ### 6.1 Introduction


    Independent component analysis (ICA) can estimate the independent components from
    the mixed input signal. Its goal is to find a linear representation of nonGaussian
    data so that the components are statistically independent, or as independent as
    possible [88].


    ICA was originally developed to deal with problems that are closely related to
    the cocktail-party problem [88]. Since the recent increase of interest in ICA,
    it has become clear that this principle has a lot of other interesting applications
    as well. Many learning algorithms were proposed to solve the problem, such as
    FastICA [85, 88, 138, 149], JADE algorithm [27], EGLD algorithm [65], Pearson-ICA
    algorithm [98], nonnegative ICA algorithm [147, 187], CuBICA [22, 23].


    In this chapter³, using the DDT method, we study the convergence of a class of
    Hyvärinen-Oja’s ICA learning algorithms with constant learning rates. By directly
    analyzing the original SDT algorithms, some invariant sets are obtained in stochastic
    environment so that the nondivergence of the original SDT algorithms is guaranteed
    by selecting proper learning parameters. In these invariant sets, the local convergence
    of the original algorithms has been indirectly studied via the DDT method.


    To improve the performance of the original SDT algorithms, the corresponding DDT
    algorithms are extended to the block versions of the original algorithms. The
    block algorithms not only establish a relationship between the original SDT algorithms
    and the corresponding DDT algorithms, but also get a good convergence speed and
    accuracy. The block algorithms represent an average evolution of the original
    SDT algorithms over all blocks of samples. Thus, the invariant sets of the original
    SDT algorithms can guarantee the nondivergence of the block algorithms. Furthermore,
    the block algorithms can exploit more efficiently the information contained in
    the observed sample window. Therefore, these algorithms converge fast and with
    higher accuracy [197, 198].


    ³ Based on “Convergence analysis of Hyvärinen and Oja’s ICA learning algorithms
    with constant learning rates,” by Jian Cheng Lv, K. K. Tan, Zhang Yi, and S. Huang),
    which appeared in IEEE Trans. Signal Processing, vol. 57, no. 5, pp. 1811–1824,
    May 2009. ©[2009] IEEE.'
