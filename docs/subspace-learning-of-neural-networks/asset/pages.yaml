  md: '# # 3


    ## PCA Learning Algorithms with Adaptive Learning Rates


    # ### 3.1 Introduction


    In PCA learning algorithms, learning rate is crucial. It not only influences the
    convergence speed of PCA algorithms but also determines whether this algorithm
    is convergent. Clearly, the DDT method requires that the learning rate approaches
    to zero. In Chapter 2, by using DDT method, it is shown that Oja’s and Xu’s LMSER’s
    PCA algorithms with constant learning rates are locally convergent.


    In this chapter, a non-zero-approaching adaptive learning rate is proposed for
    PCA learning algorithms. The convergence of Oja’s learning algorithm with the
    adaptive learning rate is investigated in detail via the DDT method. First, the
    original SDT algorithm is transformed into the corresponding DDT algorithm. Then,
    the global boundedness of the DDT algorithm is analyzed. Under the conditions
    of non-convergence, global convergence is proved. The convergence of the DDT algorithm
    can shed some light on that of the original algorithm.


    The rest of this chapter is organized as follows. In Section 2, a non-zero-approaching
    adaptive learning rate is proposed for PCA learning algorithm. Section 3 gives
    the problem formulation. And preliminaries for convergence proof are described.
    In Section 4, the convergence results are obtained. The lower and upper bounds
    of the weight evolution are found. The global convergence is proved in detail.
    Simulations are carried out in Section 5. Conclusions are drawn in Section 6.


    # ### 3.2 Adaptive Learning Rate


    With the linear neural network (1.1) and input sequence (1.2), the Oja’s PCA learning
    algorithm (2.1) can be rewritten as


    $$w(k+1)=w(k)+\eta(k)[C_{x(k)}w(k)-w^{T}(k)C_{x(k)}w(k)w(k)], \tag{3.1}$$'
