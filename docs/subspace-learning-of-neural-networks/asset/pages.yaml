  md: '# # Subspace Learning of Neural Networks


    More than just a theoretical toy, the learning algorithms of neural networks play
    a vital role in subspace learning with significant practical implications across
    many fields. Ultimately, it is the mathematical convergence of these algorithms
    that determines whether applications based upon them are successful or not.


    *Subspace Learning of Neural Networks* keeps its primary focus on the convergence
    analysis of these subspace learning algorithms. It looks at ways to extend the
    use of these networks to a number of fields, including biomedicine, encryption,
    and signal processing.


    Coordinating much of their own published findings, the authors mainly rely on
    the discrete deterministic time (DDT) method. To overcome limits inherent with
    this approach and enhance the quality of the convergence, they establish a relationship
    between an SDT algorithm and its corresponding DDT algorithm through the use of
    block algorithms. And to be certain that variables are accounted for, they offer
    up studies of the chaotic and robust properties of some algorithms, noting as
    they point out, that chaotic and stable are not necessarily exclusive of one another.


    *Unique in its approach and the depth of its findings, this volume*


    +   - Provides a framework for convergence analysis of subspace learning algorithms
    of neural networks that can be generalized to the study of other learning algorithms

    +   - Builds a theoretical understanding of the convergence behavior of some subspace
    learning algorithms through the analysis framework

    +   - Applies real-life examples to illustrate the practical performance of learning
    algorithms


    In addition to providing an invaluable resource for those investigating subspace
    learning algorithms, the authors demonstrate the importance of these findings
    to data mining, image processing, and signal processing across a number of fields
    and offers a good example of how improvements in one theoretical area of neural
    networks, can be used to benefit any number of application communities.'
