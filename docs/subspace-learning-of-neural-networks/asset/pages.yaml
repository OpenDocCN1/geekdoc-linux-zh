  md: '# ### 3.4　Convergence Analysis of Oja’s Algorithms with Adaptive Learning Rate


    In this section, details associated with a convergence analysis of the proposed
    learning algorithm will be provided systematically.


    # #### 3.4.1　Boundedness


    First, we will analyze the boundedness of the system (3.5). The lower and upper
    bounds of the system evolution will be given in following theorems.


    **Lemma 3.2** Suppose that $0<\xi<0.8$, if $0<w^T(k)Cw(k)<\lambda_p$, then $w^T(k)Cw(k)$
    is increasing.


