- pgno: 207
  md: '# Multi-Block-Based MCA for Nonlinear

    Surface Fitting


    # 9.1 Introduction


    In [133], clustered blockwise PCA takes advantage of the spatiotemporal correlation
    and localized frequency variations that are typically found in data sets. Therefore,
    the algorithm not only achieves greater efficiency in the resulting representation
    of the visual data, but also successfully scales PCA to handle large data sets.


    Since MCA can also be applied to any given data set by breaking the data into
    pieces and vectorizing them as PCA does, taking advantage of MCA neural network
    and localized frequency variations in data, we propose a method of multi-block-based
    MCA neural network for nonlinear surface fitting. MCA is first applied to blocks
    individually, which are obtained by breaking the given data set into pieces and
    vectorizing them, treating each block as if they were independent and identically
    distributed. Then the reconstructed results of the blocks are grouped into a new
    data set, and MCA is applied again to the grouped data set to obtain the final
    result. We call this method multi-block-based MCA. According to research on natural
    image statistics [20], for almost any visual data, different frequency variations
    in the data tend to be spatially localized in regions that are distributed over
    the data. Therefore, this multi-block-based MCA would achieve better accuracy,
    compared with applying MCA directly on the data set (called MCA direct method).


    In this chapter, we use an improved Oja’s MCA neural network rather than the traditional
    matrix algebraic approaches to track the minor component (MC). As the MCA neural
    network is able to extract MC from input data adaptively without calculating the
    covariance matrix in advance, the computational complexity is simplified compared
    to that of matrix algebraic approaches; hence, it is suitable for dealing with
    online data. At the same time, the Oja’s MCA algorithm is improved by using an
    adaptive learning rate. This learning rate converges to a nonzero constant so
    that the evolution will become faster with time. However, the adaptive learning
    rate can prevent the weight from deviating from the right evolution direction
    by adjusting itself. Thus, the global convergence could be guaranteed so that
    the selection of the initial parameters is simple.'
