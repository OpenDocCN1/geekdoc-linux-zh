- pgno: 231
  md: 'rate $\eta$ satisfies some simple condition, the $w$ will converge to the first
    principal direction [125, 195]. The single layer neural model shown in Figure
    1.5 is used to extract the first principal direction, and (11.5) is its learning
    algorithm.


    In our applications, the reference feature image and float feature image are obtained
    into the input sequence $\{r(k)\}$ and $\{f(k)\}$, respectively, where


    $$r(k)=\begin{pmatrix}x(k)\\y(k)\end{pmatrix}\quad\text{or}\quad f(k)=\begin{pmatrix}x(k)\\y(k)\end{pmatrix},$$


    for all $k\geq 0$. By using Oja’s algorithm (11.5), it is easy to obtain reference
    image’s first principal direction $W_R=[r_x,r_y]^T$ with $\|W_R\|=1$ and float
    feature image’s first principal direction. The angle between the two vectors is
    calculated as follows:


    $$A b_{\theta}=\left|\arccos\left(W_R^T\cdot W_F\right)\right|,\tag{11.6}$$


    where $A b_{\theta}$ is the absolute value of rotation angle.


    Since rotation angle is usual within $[-30^{\circ},30^{\circ}]$, the sign of rotation
    angle can be obtained according to the following:


    $$\theta=\begin{cases}\operatorname{sgn}(f_y/f_x)\cdot A b_{\theta},&\operatorname{sgn}(r_y/r_x)\neq\operatorname{sgn}(f_y/f_x)\\[2pt]\operatorname{sgn}(r_y/r_x-f_y/f_x)\cdot
    A b_{\theta},&\operatorname{sgn}(r_y/r_x)=\operatorname{sgn}(f_y/f_x)\end{cases}\tag{11.7}$$


    where function $\operatorname{sgn}$ is defined as following


    $$\operatorname{sgn}(x)=\begin{cases}1,&x>0\\0,&x=0\\-1,&x<0\end{cases}.$$


    # ### 11.2.3 Computing Translations


    After deriving rotation angle, we present the way of computing translations of
    registration.


    Consider a data set $\{X_i|X_i=[x_i,y_i]^T,1\leq i\leq N\}$. With the knowledge
    of physics, its centroid $[X_c,Y_c]$ is computed by the following:


    $$X_c=\frac{1}{N}\sum_i x_i,\quad Y_c=\frac{1}{N}\sum_i y_i.\tag{11.8}$$


    From (11.8), float feature image’s centroid $[X_c^f,Y_c^f]$ and reference feature
    image’s centroid $[X_c^r,Y_c^r]$ are obtained. Translations are calculated as
    subtracting float feature image’s centroid from the reference feature image’s
    centroid:


    $$delX=X_c^f-X_c^r,\quad delY=Y_c^f-Y_c^r,$$


    where $delX$ and $delY$ are translations along $x$-axis and $y$-axis, respectively.'
