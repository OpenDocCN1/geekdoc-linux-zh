  md: '# 4


    # # GHA PCA Learning Algorithm


    # 4.1  Introduction


    Generalized Hebbian algorithm (GHA) is one of the most widely used algorithms
    in practical applications, introduced first in [156]. The algorithm is used to
    compute multiple principal component directions, which span a principal subspace.


    In this chapter², non-zero-approaching learning rates will be proposed for the
    GHA. The proposed learning rates converge to some positive constants so that GHA
    with such learning rates can easily satisfy the computational and tracking requirements
    in applications. The non-zero-approaching learning rates make the convergence
    speed along all principal component directions approximately equal [131] so that
    the evolution is speeded up. In addition, the global convergence of the GHA can
    be guaranteed by using the non-zero-approaching learning rates.


    This chapter is organized as follows. Section 2 describes the problem formulation
    and gives preliminaries. Convergence results are given in Section 3. Simulation
    results and discussions are presented in Section 4. Conclusions are drawn in Section
    5.


    # 4.2  Problem Formulation and Preliminaries


    With the input sequence (1.1) and network model in Figure 1.2, let k be the time
    step and l the neuron index. The GHA [156] can be described by the'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'following stochastic difference equations:


    $$y_l(k)=w_l^T(k)x(k)$$


    $$w_l(k+1)=w_l(k)+\eta_l(k)\times\left[y_l(k)x(k)-\sum_{i=1}^{l-1}w_i(k)w_i^T(k)y_l(k)x(k)-y_l^2(k)w_l(k)\right].
    \tag{4.1}$$


    where $\eta_l(k)>0$ is the learning rate.


    There are some problems relating to the convergence of (4.1). First, (4.1) may
    not converge if the learning rates are constants, a special case for $l=1$ can
    be found in [195] and [210]. Second, if the learning rates approach zero, it is
    difficult to satisfy the computational and tracking requirements in practical
    applications [40, 195, 202, 210].


    To overcome these problems mentioned above, this paper proposes to use the following
    non-zero-approaching adaptive learning rates for the GHA:


    $$\eta_l(k)=\frac{\zeta}{y_l^2(k)},\qquad k>0. \tag{4.2}$$


    The non-zero-approaching adaptive learning rates not only allow the GHA to easily
    satisfy the computational and tracking requirements in applications, but they
    also guarantee the global convergence of the GHA. The GHA, with the learning rates
    (4.2), is written as


    $$w_l(k+1)=w_l(k)+\frac{\zeta}{y_l^2(k)}\times\left[y_l(k)x(k)-\sum_{i=1}^{l-1}w_i(k)w_i^T(k)y_l(k)x(k)-y_l^2(k)w_l(k)\right].
    \tag{4.3}$$


    for $k>0$, where $0<\zeta<1$.


    In the following section, we study the convergence of the GHA with the proposed
    learning rate via DDT method.


    Taking the conditional expectation $E\{w_l(k+1)/w_l(0),w_l(i),i<k\}$ on both sides
    of (4.2), there must exist a constant $\alpha>0$ so that


    $$E\left\{\frac{\zeta}{y_l^2(k)}\right\}=E\left\{\frac{\zeta}{w_l^T(k)x(k)x^T(k)w_l(k)}\right\}$$


    $$=\frac{\zeta}{\bar{w}_l^T(k)Cw_l(k)}$$


    $$=\frac{\zeta}{\bar{w}_l^T(k)C\bar{w}_l(k)}.$$


    where $\xi=\alpha\zeta>0$ and $C=E[x(k)x^T(k)]$. Denote


    $$Y(k)=\left[y_l(k)x(k)-\sum_{i=1}^{l-1}w_i(k)w_i^T(k)y_l(k)x(k)-y_l^2(k)w_l(k)\right].$$'
