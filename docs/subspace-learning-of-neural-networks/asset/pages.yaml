  md: '# 6.5.2  Example 2


    The example will illustrate the convergence of the block algorithm (6.10). There
    are two stochastic signals $s_1$ and $s_2$ with $Kurt(s_1)=2.6822, Kurt(s_2)=2.4146$.
    The original signals are artificially generated and are samples of 1000 values
    with zero mean and unit variance, shown in Figure 6.3 (upper). Randomly mixed
    and written signals are shown in Figure 6.3 (bottom). Since $\Gamma_w=1192.7$,
    let $\eta=0.05$, $a=25$, and $b=0.01$. The algorithm (6.10) is used to extract
    an independent signal from the mixed signals. The evolution of norm of $\mathbf{w}$
    is shown in Figure 6.4. Let $L=200$, $\mathbf{w}(0)=[0.3,0.5]^T$ (upper) and $L=1000$,
    $\mathbf{w}(0)=[0.3,0.05]^T$ (bottom). Clearly, the norm changes in a certain
    range and will not go to infinity.


    To verify whether the direction of $\mathbf{w}$ converges, we will compute the
    *DirectionCosine* between $\mathbf{w}$ and a reference vector $\mathbf{v}=[1\
    1]^T$ at each $k$ as:


    $$

    DirectionCosine(k)=\frac{|\mathbf{w}^T(k)\cdot\mathbf{v}|}{\|\mathbf{w}(k)\|\cdot\|\mathbf{v}\|},

    $$


    for all $k\geq 0$. We do not know the exact extracting direction and which signal
    will be extracted in advance. Thus, a reference vector is selected. Clearly, $DirectionCosine(k)$
    will approach to a certain value if the direction of $\mathbf{w}$ converges. Figure
    6.5 shows the evolution of $DirectionCosine$ with $L=200,\mathbf{w}(0)=[0.03,0.5]$
    (upper) and $L=1000,\mathbf{w}(0)=[0.3,0.05]$ (bottom).


    At the same time, to verify whether the direction that $\mathbf{w}$ goes to is
    right, a signal is extracted by projecting the mixed whitened signals to the direction.
    The extracted signals are shown in Figure 6.6. The example shows that the block
    algorithm (6.10) exists an invariant set and converges to an independent component
    direction in the invariant set.


    # 6.5.3  Example 3


    In the following experiment, four signals are used, as shown in Figure 6.7 (upper).
    They are of zero mean and unit variance with $Kurt(s_1)=-1.4984$, $Kurt(s_2)=0.0362$,
    $Kurt(s_3)=-1.1995$, and $Kurt(s_4)=2.4681$. Since $\Gamma_w=471.8463$, let $\eta=0.05$,
    $a=12$, and $b=0.01$. The original SDT algorithms (6.1) and (6.2) are used to
    extract the independent signals from the mixed and written signals, as shown in
    Figure 6.7 (bottom). As for the algorithm (6.1), the evolution of norm and $DirectionCosine$
    are shown in Figure 6.8. An independent signal with a positive kurtosis is extracted,
    shown in Figure 6.10 (upper). As for the algorithm (6.2), the evolution of norm
    and $DirectionCosine$ are shown in Figure 6.9. An independent signal with a negative
    kurtosis is extracted, as shown in Figure 6.10 (bottom).


    We also compare the convergence rate of the algorithms (6.1) and (6.2) with a
    constant learning rate $\eta=0.05$ and $\eta(k)=\frac{0.1}{2\log_2(k+1)}$ $(k>1)$.
    The evolution trajectories of $DirectionCosine$ are shown in Figures 6.11 and
    6.12.'
