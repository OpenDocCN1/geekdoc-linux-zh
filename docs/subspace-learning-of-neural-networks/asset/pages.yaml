- pgno: 222
  md: 'where \(-b_{(k)}^2\le 0\) for all \(k\). Since the matrix \(D_k^2\) is positive
    semidefinite in practice, we have \(w^T(k)D_k^2w(k)\ge 0\). Thus, the objective
    declines. The proof is completed.


    # Theorem 10.2


    Denote a performance vector by \(c=A^T w_*\), where \(w_*\) is the weight vector
    estimated by the updating rule (10.6). If for that specific time delay \(\tau_i\),
    relations (10.3) hold, then \(c=\beta e_i\), where \(\beta\) is a nonzero scalar
    and \(e_i\) is such a vector that the \(i\)th element is \(\pm1\) and the other
    elements are 0.


    **Proof.** The \(w_*\) and \(b_*\) estimated by the algorithm satisfy


    \[

    w_* = E\left\{(x_k-b_kx_{\tau_k})(x_k-b_kx_{\tau_k})^T\right\}w_* . \tag{10.9}

    \]


    and


    \[

    w_*^T E\left\{x_kx_{\tau_k}^T+x_{\tau_k}x_k^T-2b_kx_{\tau_k}x_{\tau_k}^T\right\}w_*-2b\sigma_n^2=0.
    \tag{10.10}

    \]


    From (10.10), we have


    \[

    c_i^2E\{s_i(k)s_i(k-\tau_i)\}-b_k\sum_{j=1}^{N}c_j^2E\{s_j^2(k-\tau_j)\}=0.

    \]


    If \(c_i=0\), then \(c_j=0\), \(\forall j\ne i\), which is impossible. Assume
    that \(c_i\ne0\), multiplying both sides of equation (10.9) by nonsingular matrix
    \(A^T\), a basic condition for the resolvability of the BSE problem, it gives
    that


    \[

    A^Tw_*=A^TE\{x_kx_k^T-b_k(x_kx_{\tau_k}^T+x_{\tau_k}x_k^T)+b_k^2x_{\tau_k}x_{\tau_k}^T\}w_*.

    \]


    Hence, taking into account that \(E\{x_kx_k^T\}=I\), we have


    \[

    c_j=\left[1+(A^TA)_j^2E\{s_j^2(k-\tau_j)\}+b_k^2\sigma_n^2\right]c_j,\qquad \forall
    j\ne i,

    \]


    where \((A^TA)_j\) denotes the \(j\)th diagonal element. Note that \((A^TA)_jE\{s_j^2(k-\tau_i)\}+\sigma_n^2=1\);
    we know it is clear that \(c_j=0\), \(\forall j\ne i\). Taking \(c_i\ne0\) into
    consideration, we have \(c=\beta e_i\). Theorem 10.2 indicates that the algorithm
    (5) actually leads to the extraction of the desired source signals.


    # 10.4 Simulation


    To show the validity of the proposed algorithm, we use the well-known ECG data
    set [52]. The ECG signals were recorded over 10 seconds from eight cutaneous electrodes
    located in different points of a pregnant woman’s body (Figure 10.1). The sampling
    frequency was 250 Hz. One can see that the fetus’s heartbeat is weaker and faster
    compared with that of the mother.'
