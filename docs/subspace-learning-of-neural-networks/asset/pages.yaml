    \end{aligned}$$ \tag{5.22}

    ```


    for all $k \geq k_0$. Since $w(0) \in S$, using Lemma 5.2, it holds that


    ```

    $$|z_n(k)|^2 \leq \|w(k)\|^2 \leq 1+\frac{2}{1-4\eta\lambda_n}.$$

    ```


    for all $k \geq 0$. By $\eta\lambda_1<0.25$, clearly,


    ```

    $$1+(0.5-2\eta\lambda_n)(1-z_n^2(k))>0.$$ \tag{5.23}

    ```


    for all $k \geq 0$. Thus, from (5.22) and (5.23), it holds that


    ```

    $$|z_n(k+1)|=|z_n(k)|\cdot\left[1+(0.5-2\eta\lambda_n)(1-z_n^2(k))\right],$$ \tag{5.24}

    ```


    for all $k \geq k_0$. By $\eta\lambda_1<0.25$, then


    ```

    $$\frac{|z_n(k+1)|}{|z_n(k)|}=1+(0.5-2\eta\lambda_n)\left[1-z_n^2(k)\right]=\begin{cases}>1,
    & \text{if } |z_n(k)|<1,\\=1, & \text{if } |z_n(k)|=1,\\<1, & \text{if } |z_n(k)|>1.\end{cases}$$
    \tag{5.25}

    ```


    for all $k \geq k_0$. From (5.25), clearly, $|z_n(k)|=1$ is a potential stable
    equilibrium point of (5.24). Next, three cases will be considered to complete
    the proof.


    **Case 1:** $|z_n(k_0)|\leq 1$.


    By $\eta\lambda_n=\eta\lambda_1\leq 0.25$ and $|z_n(k_0)|\leq 1$, it can be calculated
    out from (5.24) that


    ```

    $$|z_n(k_0+1)|=(2\eta\lambda_n-0.5)|z_n(k_0)|^3+(1.5-2\eta\lambda_n)|z_n(k_0)|\leq
    1.$$

    ```


    Clearly, it holds that $|z_n(k)|\leq 1$ for all $k\geq k_0$. However, it holds
    from (5.25) that $|z_n(k)|$ is monotone increasing for all $k\geq k_0$. Thus,
    $|z_n(k)|$ must converge to the equilibrium point 1, as $k\to\infty$.


    **Case 2:** $|z_n(k)|>1$ for all $k\geq k_0$.


    From (5.25), it holds that $|z_n(k)|$ is monotone decreasing for all $k\geq k_0$.
    However, $|z_n(k)|$ has a low bound 1 for all $k\geq k_0$. Clearly, $|z_n(k)|$
    will converge to the equilibrium point 1, as $k\to\infty$.


    **Case 3:** $|z_n(k_0)|>1$, and there exists a positive integer $M(M>k_0)$, such
    that $|z_n(M)|\leq 1$.


    Since $|z_n(M)|\leq 1$, in the same way as Case 1, it can be proved that $|z_n(k)|$
    must converge to the equilibrium point 1, as $k\to\infty$.'
