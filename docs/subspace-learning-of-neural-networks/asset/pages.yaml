    where $C\in\mathbb{R}^{n}$ is the covariance matrix of the given data set, $\lambda_p$
    ($p=1,\ldots,n$) are eigenvalues of $C$ with $\lambda_1\geq\lambda_2\geq\ldots\geq\lambda_n\geq
