  md: '# **Lemma 6.2** Suppose \(H>F>0\). If \(N>C>0\), then


    $$\frac{F+C}{H+C}<\frac{F+N}{H+N}.$$


    *Proof :* It holds that


    $$\frac{F+C}{H+C}-\frac{F+N}{H+N}=\frac{(F-H)(N-C)}{(H+C)(H+N)}<0.$$


    The proof is complete.


    # **Lemma 6.3** Suppose \(0<\varrho<1\). If \(0<\eta a<1\) and \(\varrho\le h\le
    2\), it holds that


    $$\left|(1-h)^2-\eta ah\right|\le\zeta,$$


    where \(\zeta=\max\{|(1-\varrho)^2-\eta a\varrho|,|1-2\eta a|\}\) and \(0<\zeta<1\).


    *Proof :* Define a differentiable function


    $$f(h)=(1-h)^2-\eta ah,$$


    for all \(\varrho\le h\le 2\), where \(0<\eta a<1\). It follows that \(f(h)=-2(1-h)-\eta
    a\). It is easy to get the maximum point of \(f(h)\) on the interval \([\varrho,2]\)
    must be \(h=\varrho\) or \(h=2\). Thus, it follows that


    $$\left|(1-h)^2-\eta ah\right|\le\zeta,$$


    where \(\zeta=\max\{|(1-\varrho)^2-\eta a\varrho|,|1-2\eta a|\}<1\). The proof
    is complete.


    # 6.3\quad Convergence Analysis


    The algorithms (6.1) and (6.2) may diverge. Consider one-dimensional examples.
    From (6.1), it follows that


    $$w(k+1)=w(k)+\eta\left[bw^4(k)x^4(k)+a\left(1-w^2(k)\right)w(k)\right]$$

    $$=\left[1+\eta a-\eta\left(a-bx^4(k)\right)w^2(k)\right]w(k),$$


    where \(\eta>0\), \(a>0\) and \(b>0\). Suppose \(a-bx^4(k)>\bar a>0\) for all
    \(k\ge 0\), where \(\bar a\) is a constant. If \(w(k)>\frac{1+\eta a}{\eta\bar
