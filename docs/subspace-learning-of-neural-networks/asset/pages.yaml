- pgno: 176
  md: 'speed up the convergence and satisfy the computational requirements [125, 127,
    185, 210]. In this chapter, the dynamical behaviors of the algorithms mentioned
    above with constant learning rates are studied. These algorithms with constant
    learning rates in the one-dimensional case can be presented as


    $$w(k+1)=w(k)+\eta[-\sigma g(w(k))-f(\lVert w(k)\rVert^2)w(k)].$$


    for all $k\ge 0$, where $f$ is a scalar function, $\eta>0$ is a constant learning
    rate. Clearly, if $\sigma=1$, the algorithms can be rewritten as:


    $$w(k+1)=w(k)+\eta[-(aw(k)-bw^3(k))-f(\lVert w(k)\rVert^2)w(k)]. \tag{7.1}$$


    If $\sigma=-1$, it follows that


    $$w(k+1)=w(k)+\eta[(aw(k)-bw^3(k))-f(\lVert w(k)\rVert^2)w(k)]. \tag{7.2}$$


    This chapter will show the algorithms (7.1) and (7.2) have both stability and
    chaotic behaviors under some conditions. These conditions for stability and chaos
    will be derived. Therefore, it is easy to see that divergent and chaotic behaviors
    can be avoided by choosing proper learning parameters.


    This chapter is organized as follows. Section 2 identifies some invariant sets
    and obtains the conditions for divergence of these algorithms. In Section 3, the
    conditions for the stability of these algorithms are derived. The chaos and chaotic
    behaviors are analyzed in Section 4. Finally, conclusions are drawn in Section
    5.


    # 7.2 Invariant Set and Divergence


    Clearly, an invariant set guarantees the nondivergence of an algorithm. The following
    theorem will give the invariant sets of the algorithms (7.1) and (7.2). For convenience
    of analysis, two lemmas are given first.


    Denote by


    $$M_1^*=\max\left\{\frac{a+f(\lVert w(k)\rVert^2)}{b},\frac{4\left(\eta(a+f(\lVert
    w(k)\rVert^2))-1\right)^3}{27\eta b}\right\},$$


    $$M_2^*=\max\left\{\frac{\eta(a-f(\lVert w(k)\rVert^2))+2}{\eta b},\frac{4\left(\eta(a-f(\lVert
    w(k)\rVert^2))+1\right)^3}{27\eta b}\right\}.$$


    **Lemma 7.1** Suppose that $\eta>0$, $a>0$, and $b>0$. It holds that


    $$[1-\eta a-\eta f(\lVert w(k)\rVert^2)+\eta bs]\cdot s\le M_1^*,$$


    for all $0<s\le\dfrac{a+f(\lVert w(k)\rVert^2)}{b}$ and $\eta(a+f(\lVert w(k)\rVert^2))>0$.'
