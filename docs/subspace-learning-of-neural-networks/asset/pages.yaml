  md: '# # 1

    ## Introduction


    # ### 1.1 Introduction


    Subspace leaning neural networks provide a parallel online automated learning
    of low-dimensional models in a nonstationary environment. It is commonly known
    that automated learning of low-dimensional linear or multilinear models from training
    data has become a standard paradigm in computer vision [54, 55]. Thus, these neural
    networks used to learning a low-dimensional model have many important applications
    in computer vision, such as structure from motion, motion estimation, layer extraction,
    object recognition, and object tracking [18, 19, 50, 56, 55].


    Subspace learning algorithms used to update the weights of these networks pay
    a vital important role in applications. This book will focus on the subspace learning
    algorithms of principal component analysis (PCA) neural networks, minor component
    analysis (MCA) neural networks, and independent component analysis (ICA) neural
    networks. Generally, they are linear neural networks.


    # #### 1.1.1 Linear Neural Networks


    Inspired by biological neural networks, a simple neural model is designed to mimic
    its biological counterpart, the neuron. The model accepted the weighted set of
    input $x$ responds with an output $y$, as shown in Figure 1.1. The vital effect
    of synapse between neurons is presented by the weights $w$. The mathematical model
    of a linear single neuron is as follows:


    $$y(k)=w^T(k)x(k),\quad (k=0,1,2,\ldots), \tag{1.1}$$


    where $y(k)$ is the network output, the input sequence


    $$\{x(k)\mid x(k)\in R^n(k=0,1,2,\ldots)\} \tag{1.2}$$


    is a zero-mean stochastic process, each $w(k)\in R^n(k=0,1,2,\ldots)$ is a weight
    vector.


    Consider input output relation


    $$y(k)=W^T x(k), \tag{1.3}$$'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'where


    $$y(k) = [y_1(k), y_2(k), \ldots, y_m(k)]^T$$

    and


    $$W = \begin{bmatrix} w_{11} & w_{12} & \cdots & w_{1m} \\ w_{21} & w_{22} & \cdots
    & w_{2m} \\ \vdots & \vdots & \ddots & \vdots \\ w_{n1} & w_{n2} & \cdots & w_{nm}
    \end{bmatrix}.$$


    This is a multineuron linear model, as shown in Figure 1.2.


    ![](img/5d1bf22d32ba379cbf31221a5347fdb6_24_0.png)


    **FIGURE 1.1**

    A single neuron model.


    ![](img/5d1bf22d32ba379cbf31221a5347fdb6_24_1.png)


    **FIGURE 1.2**

    A multineuron model.


    These linear networks have been widely studied [25, 28, 70] and used for'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'many fields involving signal processing [66], prediction [80], associative
    memory [167], function approximation [180], power system [15, 153], chemistry
    [196], and so on. The weight of these neural networks, which represents the strength
    of the connection between neurons, pays a very important role in the different
    applications. A variety of learning algorithms are used to update the weight so
    that the networks have the different applications with the corresponding weight.
    For instance, the adaptive linear neuron (ADALINE) network is one of the most
    widely used neural networks in practical applications, which was introduced by
    Widrow and M. Hoff in 1960 [181]. The least mean square (LMS) algorithm is used
    to update the weight so that ADALINE can be used as a adaptive filter [75].


    In this book, these linear networks are used to extract the principal components,
    or minor components, or independent components from input data. It is required
    that these networks must approximate a low-dimensional model.


    # 1.1.2  Subspace Learning Algorithms


    Subspace learning algorithms are used to update the weights of these linear networks
    so that these networks intend to approximate a low-dimensional linear model. Generally,
    an original stochastic discrete time (SDT) algorithm is formulated as


    $$w(k+1)=w(k)+\eta(k)\,\Delta w(k), \tag{1.4}$$


    where $\eta(k)$ is learning rate and $\Delta w(k)$ determines the change at time
    $k$.


    This book will mainly discuss the following subspace learning algorithms: PCA
    learning algorithms, MCA learning algorithms, and ICA learning algorithms.


    # 1.1.2.1  PCA Learning Algorithms


    Principal component analysis (PCA) is a traditional statistical technique in multivariate
    analysis, stemming from the early work of Pearson [141]. It is closely related
    to Karhunen-Loève (KL) transform, or the Hotelling transform [82]. The purpose
    of PCA is to reduce the dimensionality of a given data set, while retaining as
    much as possible of the information present in the data set.


    **Definition 1.1**  *A vector is called the first principal component direction
    if the vector is along the eigenvector associated with the largest eigenvalue
    of the covariance matrix of a given data set, and a vector is called the second
    principal component direction if the vector is along the eigenvector associated
    with the second largest eigenvalue of the covariance matrix of a given data set,
    and so on.*


    **Definition 1.2**  *Principal components are the variances that are obtained
    by projecting the given data onto the principal component directions.*'
  merge: -1
  img_proc: true
- pgno: 26
  md: "# **Definition 1.3** *a subspace is called a principal subspace if the subspace\
    \ is spanned by the first few principal component directions.*\n\nGenerally, PCA\
    \ has two steps. First, principal component directions must be found. In these\
    \ directions, the input data have the largest variances, as shown in Figure 1.3.\
    \ Then, principal components are obtained by projecting the input data into the\
    \ principal directions. The principal components are uncorrelated and ordered\
    \ so that the first few retain most of the variation present in all of the original\
    \ data set.\n\nPCA has a wide variety of different applications, as well as a\
    \ number of different derivations [17, 24, 29, 93, 150], such as Kernel PCA [42,\
    \ 99], Probabilistic PCA [170, 171, 207], Local PCA [116, 179], Generalized PCA\
    \ [173], L1-PCA [104], Blockwise PCA [41, 133], Sparse PCA [208], Topological\
    \ PCA [148], and Bayesian PCA [176, 112].\n\n![](img/5d1bf22d32ba379cbf31221a5347fdb6_26_0.png)\n\
    \n**FIGURE 1.3**  \nPrincipal component direction and minor component direction\
    \ in a two-dimensional data set.\n\nTraditionally, some classical methods such\
    \ as QR decomposition or SVD algorithm are used to find the principal component\
    \ directions. These methods are not practical to handle large data sets because\
    \ of huge covariance matrix [73, 179, 189]. PCA learning algorithms offer an advantage\
    \ that they can adapt online to the data and no explicit computation of the covariance\
    \ matrix.\n\nPCA learning algorithms are used to update the weights of linear\
    \ neural networks so that the weights converge to the principal component directions\
    \ that span a principal subspace. Then, these networks can be used to extract\
    \ the principal components without calculating the covariance matrix in advanced.\
    \ PCA neural networks have many applications, including applications relating\
    \ to feature extraction [152, 158], fault detection [90, 109], face classification\
    \ [114, 166], gender recognition [53], image compression [51], text classification\
    \ [113], forecasting [118], and protein structure analysis [64]."
  merge: -1
  img_proc: true
- pgno: 27
  md: 'In [134], Oja used a simple linear single neural network (Figure 1.1) to extract
    the principal components from the input data. Based on the well-known Hebbian
    learning rule, Oja proposed a PCA learning algorithm to make the weights of the
    network converge to the first principal component direction. Thus, this network,
    under Oja’s algorithm, is able to extract principal components from input data
    adaptively. The results have been useful in online data processing applications.


    Stemming from Oja’s algorithm [134], many PCA algorithms have been proposed to
    update the weights of these networks [1, 7, 44, 103, 131, 139, 156, 184]. Among
    the algorithms for PCA, Oja’s algorithm and Xu’s LMSER algorithm are commonly
    used in these applications. Several other algorithms for PCA are related to these
    basic procedures [32]. In [156], Sanger proposed the GHA learning algorithm, which
    allows a multilayer linear neural network (Figure 1.2) to extract a selected number
    of principal components. In [103], Kung et al. proposed the application of the
    APEX learning algorithm to a neural network with lateral connections to extract
    all the desired principal components in parallel. In [44], Cichocki et al. proposed
    the CRLS algorithm, which combines the advantages of both the SAMH algorithm [1]
    and the RLS-PCA algorithm [7] to extract principal components sequentially. There
    are many other extensions, see, for examples, [31, 37, 81, 91, 135, 175, 179,
    203, 204].


    A review of PCA learning algorithms can be found in [30].


    # 1.1.2.2  MCA Learning Algorithms


    Minor component was explicitly introduced by Xu in [185], which is the counterpart
    of principal component. Similar to PCA, some definitions are as follows.


    **Definition 1.4**  *A vector is called the first minor component direction if
    the vector is along the eigenvector associated with the smallest eigenvalue of
    the covariance matrix of a given data set, and a vector is called the second minor
    component direction if the vector is along the eigenvector associated with the
    second smallest eigenvalue of the covariance matrix of a given data set, and so
    on.*


    **Definition 1.5**  *A subspace is called a minor subspace if the subspace is
    spanned by the first few minor component directions.*


    Figure 1.3 shows a minor component direction in a 2D data set. Minor components
    obtained by projecting the input data onto the minor component directions are
    often regarded as unimportant or noise. However, it is found that MCA has many
    applications in diverse areas, such as total least squares (TLS) [71, 72], moving
    target indication [100], clutter cancellation [9], computer vision [47], curve
    and surface fitting [137, 185], digital beamforming [74], frequency estimation
    [128], and bearing estimation [157].'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'MCA neural networks can extract the minor components from input data set without
    calculating the covariance matrix in advance. The corresponding learning algorithms
    are proposed to update the net weights, such as the Xu’s algorithm [185], the
    OJA+’s algorithm [135], the Luo-Unbehauen-Chichocki’s algorithm [119], the Feng-Bao-Jiao’s
    learning algorithm [67], the EXIN’s algorithm [48], Feng’s OJAm algorithm [68],
    and Fast MCA algorithm [12].


    An overview of MCA learning algorithms can be found in [130].


    # 1.1.2.3 ICA Learning Algorithms


    Independent component analysis (ICA) [49] can estimate the independent components
    from mixed input signals. Its goal is to find a subspace in which a given input
    signals can be decomposed into groups of mutually independent random signals.
    The essential difference between ICA and PCA is that PCA decomposes a set of signals
    into a set of uncorrelated, ordered components, whereas ICA decomposes a set of
    signal mixtures into a set of independent, unordered signals [164]. This implies
    that PCA transforms the input signal $x=(x_1,x_2)$ with joint probability density
    function (PDF) $p_x(x_1,x_2)$ into a new set of uncorrelated components $y=(y_1,y_2)$
    so that


    $$E[y_1y_2]=E[y_1]E[y_2].$$


    In contrast, ICA transforms the signal mixtures $x=(x_1,x_2)$ with PDF $p_x(x_1,x_2)$
    into a new set of independent signals $y=(y_1,y_2)$ so that


    $$p_{y_1,y_2}(y_1,y_2)=p_{y_1}(y_1)p_{y_2}(y_2).$$


    Actually, PCA does more than simply find a transformation of the input signals
    such that the extracted principal components are uncorrelated. PCA orders the
    extracted principal components according to their variances, so that components
    associated with high variance are deemed more important than those with low variance.
    In contrast, ICA is essentially blind to the variance associated with each extracted
    signal. The only assumption of ICA method is the source signals are statistically
    independent and nonGaussian. ICA can extract components that are both statistically
    independent and nonGaussian even if very little is known about the nature of those
    source signals.


    The data analyzed by ICA could originate from many application fields as diverse
    as speech processing, brain imaging, electrical brain signals, telecommunications,
    and stock market prediction. In many cases, these data are given as a set of signal
    mixtures, the term blind source separation is used to characterize this problem.
    The main applications of ICA are in blind source separation [21, 57, 94, 102,
    108], feature extraction [13, 96, 155], and blind deconvolution [59, 159, 168].


    ICA neural networks enable fast adaptation in a stochastic environment since the
    inputs can be used in their algorithms at once [84]. ICA learning algorithms are
    used to update the weights of ICA neural networks so that the weights converge
    to the subspace we expected. These networks have been'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'extensively studied and used in many fields; see examples [3, 20, 22, 23, 97,
    106, 108, 138, 169].


    # ### 1.1.3　Outline of This Book


    The rest of this chapter is organized as follows. In Section 2, the methods for
    convergence analysis is introduced and the relationship between SDT algorithm
    and the corresponding DDT algorithm is given in Section 3. Section 4 presents
    some notations and preliminaries.


    In Chapter 2, the convergence of Oja’s and Xu’s algorithms with constant learning
    rates is studied in detail. Some invariant sets are obtained and local convergence
    is proven rigorously. The most important contribution is the convergence analysis
    framework of deterministic discrete time (DDT) method is established in this chapter.


    In Chapter 3, an adaptive learning rate is provided for the subspace learning
    algorithms. The global boundedness of Oja’s algorithm with the adaptive learning
    rate is analyzed first. Then, the global convergence conditions are obtained.


    In Chapter 4, the convergence of Generalized Hebbian Algorithm (GHA) is studied
    via the DDT method. GHA can extract multiple principal component directions in
    parallel. In this chapter, mathematical induction is used to prove the global
    convergence of GHA with adaptive learning rates.


    In Chapter 5, a stable MCA algorithm is proposed, and its dynamics of the proposed
    algorithm is interpreted indirectly by using DDT method.


    In Chapter 6, the Hyvärinen-Oja’s ICA learning algorithm is discussed. The corresponding
    DDT algorithms are extended to the block versions of the original SDT algorithms.
    The block algorithms not only establish a relationship between the SDT algorithms
    and the corresponding DDT algorithms, but also can get a good convergence speed
    and accuracy in practice.


    In Chapter 7, chaotic behaviors of subspace learning algorithms are presented.
    It will be shown that some algorithms have both stability and chaotic behavior
    under some conditions. This chapter explores the chaotic behavior of a class of
    ICA algorithms. The conditions for stability and chaos of the algorithm are derived.


    In Chapter 8, a biologically plausible PCA model is proposed to adaptively determine
    the number of principal component directions. The number adaptively approximates
    the intrinsic dimensionality of the given data set by using an improved GHA. Some
    simulations are conducted to verify the theoretical results.


    In Chapter 9, an adaptive learning rate is proposed to guarantee the global convergence
    of Oja’s MCA algorithm. Then, a multi-block-based MCA method is used for nonlinear
    surface fitting. The method shows good performance in terms of accuracy, which
    is confirmed by the simulation results.


    In Chapter 10, an ICA algorithm is proposed for extracting fetal electro-'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'cardiogram (FECG). Theoretical analysis of the algorithm is also given in this
    chapter.


    Finally, in Chapter 11, a rigid medical image registration method is introduced.
    The proposed method accomplishes registration by simply aligning the first principal
    component direction and centroids of feature images. Since a PCA neural network
    is used to compute the first principal component direction of feature images,
    the registration is simple and efficient.


    # 1.2 Methods for Convergence Analysis


    The learning algorithms of neural networks play an important role in their practical
    applications. The convergence of learning algorithms determines whether these
    applications can be successful. However, it is very difficult to directly study
    the convergence of these learning algorithms, because they are described by stochastic
    discrete time (SDT) algorithms [202]. Generally, two methods are used to analyze
    the convergence of learning algorithms. Traditionally, based on some stochastic
    approximation theorems [14, 35, 117], an original SDT algorithm is transformed
    into a corresponding deterministic continuous time (DCT) algorithm. The convergence
    of the SDT algorithm can be indirectly interpreted by studying the corresponding
    DCT algorithm. This approach is called the DCT method. Another method is called
    the deterministic discrete time (DDT) method. The DDT method transforms a SDT
    algorithm into a corresponding DDT algorithm by taking the conditional expectation
    on both sides of the SDT algorithm. The DDT algorithm characterizes the average
    evolution of the original SDT algorithm. The DDT algorithm preserves the discrete
    time nature of the original algorithm. The convergence of the DDT algorithm can
    shed some light on the dynamical behaviors of the original SDT algorithm.


    # 1.2.1 DCT Method


    Traditionally, based on some stochastic approximation theorems [14, 117], an original
    SDT algorithm is transformed into a corresponding deterministic continuous time
    (DCT) algorithms; that is, the algorithm (1.4) is transformed into the following
    differential equation (1.5):


    $$v_i = \Delta w(k) \tag{1.5}$$


    The convergence of the algorithm (1.4) can be indirectly interpreted by studying
    the corresponding DCT algorithm (1.5). Because of mathematical achievements of
    the differential equation, the method has been widely used; see for examples,
    [4, 36, 135, 136, 154, 162, 172, 192, 199].'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'In order to transform an SDT algorithm to a DCT algorithm, some restrictive
    conditions must be applied. One of these conditions is that


    \[\eta(k)>0,\quad \sum_k \eta(k)=\infty,\quad \sum_k(\eta(k))^2<\infty.\]


    where \(\eta(k)\) is the learning rate of the SDT learning algorithm (1.4). This
    condition implies that the learning rate \(\eta(k)\) must converge to zero. However,
    it is unrealistic in practical applications, because of computational round-off
    limitations and tracking requirements, whenever the step increases considerably.
    If small but nonzero constant values of learning rate have to be employed [210].
    If the learning rate approaches zero, it could slow down the convergent speed
    of the algorithm considerably. In addition, the learning rate cannot approach
    zero too fast; otherwise, the algorithm will stop before it converges to the right
    direction. More discussions can be found in [39, 195, 202, 210]. Thus, the condition
    above is unrealistic in practical applications.


    # 1.2.2  DDT Method


    To overcome the shortcomings of the DCT method, the deterministic discrete time
    (DDT) method has been proposed recently to indirectly study the convergence of
    SDT learning algorithms; see [39, 124, 195, 210]. The DDT method transforms the
    SDT algorithm (1.4) into the corresponding DDT algorithm as follows:


    \[E\{w(k+1)\}=E\{w(k)\}+E\{\eta(k)\otimes w(k)\}.\tag{1.6}\]


    Then, to guarantee the nondivergence of DDT algorithms, the boundedness of the
    algorithms must be analyzed firstly. For global convergent algorithms, global
    boundedness is studied. For local convergent algorithms, invariant sets are obtained
    to guarantee the local nonconvergence. The invariant set is defined as follows.


    **Definition 1.6** A compact set \(S\subset R^n\) is called an invariant set of
    the algorithm \(w(k+1)=f(w(k),x(k))\), if for any \(w(0)\in S\), the trajectory
    of the algorithm starting from \(w(0)\) will remain in \(S\) for all \(k\leq 0\).


