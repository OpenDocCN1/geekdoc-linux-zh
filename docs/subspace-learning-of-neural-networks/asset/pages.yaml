  md: 'determines whether we are minimizing or maximizing the kurtosis. $\mu(k)$ is
    the learning rate sequence and $\boldsymbol{x}(k)$ is a prewhitened input data.
    In this chapter, let $f(y)=y^3$, and the constant learning rates are used. The
    algorithms with constant learning rates can be presented as


    $$\boldsymbol{w}(k+1)=\boldsymbol{w}(k)+\eta\left[b_x(k)(\boldsymbol{w}^{T}(k)\boldsymbol{x}(k))^3+a(1-\|\boldsymbol{w}(k)\|^2)\boldsymbol{w}(k)\right].
    \tag{6.1}$$


    $$\boldsymbol{w}(k+1)=\boldsymbol{w}(k)+\eta\left[-b_x(k)(\boldsymbol{w}^{T}(k)\boldsymbol{x}(k))^3+a(1-\|\boldsymbol{w}(k)\|^2)\boldsymbol{w}(k)\right].
    \tag{6.2}$$


    for all $k\geq 0$, where $\eta$ is a constant learning rate. A constant $b\geq
    0$ is added to the algorithms to adjust the learning parameters more conveniently.


    The algorithm (6.1) converges to an independent component direction with a positive
    kurtosis, that is, $\boldsymbol{w}(k)$ will converge to a direction of a column
    $\boldsymbol{b}_i$ of $B$ with $\operatorname{Kurt}(s_i)>0$. The algorithm (6.2)
    converges to an independent component direction with a negative kurtosis, that
    is, $\boldsymbol{w}(k)$ will converge to a direction of a column $\boldsymbol{b}_i$
    of $B$ with $\operatorname{Kurt}(s_i)<0$.


    To prove the convergence of the algorithms, a transformation is given first. Let
    $\boldsymbol{w}=B\tilde{\boldsymbol{z}}(k)$. Clearly, to prove that $\boldsymbol{w}(k)$
    converges to a direction of a column $\boldsymbol{b}_i$ of $B$, it only needs
    to prove that all components of $\tilde{\boldsymbol{z}}(k)$ converge to zero except
    $\tilde{z}_i(k)$. Since $\boldsymbol{x}(k)=B\boldsymbol{s}(k)$, from (6.1) and
    (6.2), it follows that


    $$\tilde{\boldsymbol{z}}(k+1)=\tilde{\boldsymbol{z}}(k)+\eta\left[b_s(k)(\tilde{\boldsymbol{z}}^{T}(k)\boldsymbol{s}(k))^3+a(1-\|\tilde{\boldsymbol{z}}(k)\|^2)\tilde{\boldsymbol{z}}(k)\right].
    \tag{6.3}$$


    $$\tilde{\boldsymbol{z}}(k+1)=\tilde{\boldsymbol{z}}(k)+\eta\left[-b_s(k)(\tilde{\boldsymbol{z}}^{T}(k)\boldsymbol{s}(k))^3+a(1-\|\tilde{\boldsymbol{z}}(k)\|^2)\tilde{\boldsymbol{z}}(k)\right].
    \tag{6.4}$$


    for all $k\geq 0$.


    In the following section, the convergence of the Hyvärinen-Oja algorithms will
    be analyzed in detail. First, some lemmas are provided to be used for subsequent
    analysis.


    # **Lemma 6.1** Suppose that $D>0$, $E>0$. It holds that


    $$[D-Eh]^2\cdot h\leq\frac{4D^3}{27E^2}.$$


    for all $0<h\leq\frac{D}{E}$.


    *Proof.* Define a differentiable function


    $$f(h)=[D-Eh]^2\cdot h.$$


    for $0<h<\frac{D}{E}$. It follows that $f''(h)=[D-Eh]\cdot[D-3Eh]$. It is easy
    to get the maximum point of $f(h)$ on the interval $(0,\frac{D}{E})$ must be $h=\frac{D}{3E}$.
    Thus, it follows that


    $$[D-Eh]^2\cdot h\leq\frac{4D^3}{27E^2},$$


    where $0<h<\frac{D}{E}$. The proof is complete.'
