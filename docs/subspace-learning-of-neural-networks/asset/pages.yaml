- pgno: 174
  md: '# 6.6  Conclusion


    The convergence of a class of Hyvärinen-Oja’s ICA learning algorithms with constant
    learning algorithms is studied. It is shown that the algorithms converge to an
    independent component direction with a positive kurtosis or a negative kurtosis.
    Since constant learning rates are used, the requirements for the algorithms to
    be applied in practical applications can be met. The most important result of
    this chapter is that some invariant sets are obtained in stochastic environment
    so that the nondivergence of the original SDT algorithms is guaranteed by selecting
    proper learning parameters. In these invariant sets, the local convergence of
    the original algorithms has been indirectly studied via the DDT method. To improve
    the performance of the original algorithms, the corresponding DDT algorithms can
    be extended to the block versions of the original algorithms. Simulations are
    carried out to further support the results obtained.'
