- pgno: 7
  md: '# Preface


    Principal component analysis (PCA) neural networks, minor component analysis (MCA)
    neural networks and independent component analysis (ICA) neural networks can approximate
    a subspace of input data by learning. These networks inspired by biology and psychology
    provide a novel way for parallel online computation of a subspace. An input of
    these neural networks can be used at once so that they can enable fast adaptation
    in a nonstationary environment. Although these networks are almost linear neural
    models, they have found many applications, including applications relating to
    signal and image processing, video analysis, data mining, and pattern recognition.


    The learning algorithms of these neural networks play a vital role in subspace
    learning. These subspace learning algorithms make these networks learn low-dimensional
    linear and multilinear models in a high-dimensional space, wherein specific statistical
    properties can be well preserved. The book will be mainly focused on the convergence
    analysis of these subspace learning algorithms and the ways to extend the use
    of these networks to fields such as biomedical signal processing, biomedical image
    processing, and surface fitting to name just a few.


    A crucial issue of concern in a practical application is the convergence of the
    subspace learning algorithms of these neural networks. The convergence of these
    algorithms determines whether these applications can be successful. The book will
    analyze the convergence of these learning algorithms by mainly using discrete
    deterministic time (DDT) method. To guarantee their nondivergence, invariant sets
    of some algorithms will be obtained and global boundedness of some algorithms
    is studied. Then, the convergence conditions of these algorithms will be derived.
    Cauchy convergence principle and inequalities analysis method, and so on, will
    be used rigorously to prove the convergence. Furthermore, the book establishes
    a relationship between an SDT algorithm and the corresponding DDT algorithm by
    using block algorithms. This not only can overcome the shortcomings of DDT method,
    but also can get a good convergence and accuracy in practice. Finally, the chaotic
    and robust properties of some algorithms will also be studied. These results obtained
    lay the sound theoretical foundation of these networks and guarantee the successful
    applications of these algorithms in practice.


    The book not only benefits the researcher of subspace learning algorithms, but
    also improves the quality of data mining, image processing, and signal processing.
    Besides its research contributions and applications, the book could'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Scope and Contents of This Book


    This book provides an analysis framework for convergence analysis of subspace
    learning algorithms of neural networks. The emphasis is on the analysis method,
    which can be generalized to the study of other learning algorithms. Our work builds
    a theoretical understanding of the convergence behavior of some subspace learning
    algorithms through the analysis framework. In addition, this book uses real-life
    examples to illustrate the performance of learning algorithms and instructs readers
    on how to apply them to practical applications. The book is organized as follows.


    Chapter 1 provides a brief introduction to linear neural networks and subspace
    learning algorithms of neural networks. Some frequently used notations and preliminaries
    are given. Basic discussions on the methods for convergence analysis are presented
    which should lay the foundation for subsequent chapters.


    In the following chapters, convergence of subspace learning algorithms is analyzed
    to lay the theoretical foundation for successful applications of these networks.
    In Chapter 2, the convergence of Oja’s and Xu’s algorithms with constant learning
    rates is studied in detail. The global convergence of Oja’s algorithm with the
    adaptive learning rate is analyzed in Chapter 3. In Chapter 4, the convergence
    of Generalized Hebbian Algorithm (GHA) with adaptive learning rates is studied.
    MCA learning algorithms and the Hyvärinen-Oja’s ICA learning algorithm are analyzed
    in Chapters 5 and 6, respectively. In Chapter 7, chaotic behaviors of subspace
    learning algorithms are presented.


    Some problems concerning a practical application are discussed in chapters 8,
    9, 10, 11, and some real-life examples are given to illustrate the performance
    of these subspace learning algorithms.


    The contents of this book are mainly based on our research publications on this
    subject, which over the years have accumulated into a complete and unified coverage
    of the topic. It will serve as an interesting reference for post-graduates, researchers,
    and engineers who may be keen to use these neural networks in applications. Undoubtedly,
    there are other excellent works in this area, which we hope to have included in
    the references for the readers. We should also like to point out that at the time
    of this writing, many problems relating to subspace learning remained unresolved,
    and the book may contain personal views and conjecture of the authors that may
    not appeal to all sectors of readers. To this end, readers are encouraged to send
    us criticisms and suggestions, and we look forward to discussion and collaboration
    on the topic.'
  merge: -1
  img_proc: true
