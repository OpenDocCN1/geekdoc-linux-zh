    $$\begin{aligned}

    |z_i^{(l)}(k+1)|

    &=\left|\left[(1-\xi)+\frac{\xi\lambda_l}{w_l^T(k)Cw_l(k)}\right]z_i^{(l)}(k)+\phi_l(k)\right|,\\

    &=\left(1-\xi+\frac{\xi\lambda_l}{w_l^T(k)Cw_l(k)}\right)|z_i^{(l)}(k)|+\phi''_l(k),

    \end{aligned}$$


    for all \(k\ge K_l\), where \(\lim_{k\to+\infty}\phi''_l(k)=0\). And for \(i=l+1,\ldots,n\),
    we have


    $$\begin{aligned}

    |z_i^{(l)}(k+1)|

    &=\left|\left[(1-\xi)+\frac{\xi\lambda_i}{w_l^T(k)Cw_l(k)}\right]z_i^{(l)}(k)+\phi_i(k)\right|,\\

    &=\left(1-\xi+\frac{\xi\lambda_i}{w_l^T(k)Cw_l(k)}\right)|z_i^{(l)}(k)|+\phi''_i(k),

    \end{aligned}$$


    for all \(k\ge K_l\), where \(\lim_{k\to+\infty}\phi''_i(k)=0\). Clearly,


    $$\left(1-\xi+\frac{\xi\lambda_l}{w_l^T(k)Cw_l(k)}\right)\ge\left(1-\xi+\frac{\xi\lambda_i}{w_l^T(k)Cw_l(k)}\right)>0,\quad
    (i=l+1,\ldots,n).$$


    If \(k\) is sufficiently large, it is not difficult to show that \(|z_i^{(l)}(k+1)|\ge
    |z_i^{(l)}(k)|\). Thus, if \(\lim_{k\to+\infty}|z_i^{(l)}(k)|=0\), then \(\lim_{k\to+\infty}|z_i^{(l)}(k)|=0\)
