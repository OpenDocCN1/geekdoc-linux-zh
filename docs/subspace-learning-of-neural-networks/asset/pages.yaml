    \ obtained in the previous section.\n\nIf an image is rotated, it is clear that\
    \ the rotation angle is equal to the rotation angle of its first principal direction.\
    \ The mathematic fundament is given as follows:\n\n*First, we give a brief review\
    \ of the traditional PCA* [8, 165]. Let vector $X_i = [x_i, y_i]^T$ denote points\
    \ of an image. Clearly, its first principal direction $W$ is defined as follows:\n\
    \n$$W = \\arg\\max\\left(V^T S V\\right), \\tag{11.1}$$\n\nwhere $S$ is the covariance\
    \ matrix and is given by\n\n$$S = \\frac{1}{N}\\sum_{i=1}^{N}(X_i-\\mu)(X_i-\\\
