    Theorems 6.1 and 6.2 give the nondivergent conditions of the algorithms in stochastic
    environment. It is clear the norm of the algorithms do not go to infinity under
    these conditions, even in a stochastic environment. In these invariant sets, the
    local convergence of the algorithms will be further studied in the following subsection.


    # 6.3.2  DDT Algorithms and Local Convergence


    The convergence analysis of algorithms (6.1) and (6.2) can be indirectly studied
    by analyzing the corresponding DDT algorithms in the invariant sets. The DDT algorithms
    characterize the average evolution of the original algorithms. The convergence
    of the DDT algorithms can reflect the dynamical behaviors of the original algorithms
    [195, 210]. Here, we only present the convergence analysis of (6.1). The convergence
    results of (6.2) can be obtained by using similar method. This chapter also gives
    the convergence results of (6.2), but the analysis process of its convergence
    is omitted.


    Following Zufiria’s method [210], the corresponding DDT algorithms can be obtained
    by taking the conditional expectation $E\{w(k+1)/w(0), w(i), i < k\}$ on both
    sides of the algorithm (6.1). Since $E\{w(k)\}=BE\{\tilde z(k)\}$, the convergence
    analysis of the DDT algorithm of (6.1) can be transformed to studying the convergence
    of the DDT algorithm of (6.3). Taking the conditional expectation $E\{\tilde z(k+1)/\tilde
    z(0), \tilde z(i), i < k\}$ on both sides of (6.3), the corresponding DDT algorithm
    is written as


    $$

    z(k+1)=z(k)+\eta\left\{E\left[s(k)\left(\tilde z(k)s(k)\right)^3\right]+\sigma(1-\|z(k)\|^2)z(k)\right\},
    \tag{6.6}

    $$


    for all $k\geq 0$, where $z(k)=E\{\tilde z(k)\}$. The DDT algorithm (6.6) preserves
    the discrete time form of the original algorithm (6.3) and allows a more realistic
    behavior of the learning gain [210]. Since the DDT algorithm (6.6) represents
    an average evolution of the algorithm (6.3), the invariant set $\mathcal{S}_1$
    is also an invariant set of (6.6).


