  md: '# *A ICA Algorithm for Extracting Fetal Electrocardiogram*


    # 10.1 Introduction


    Fetal electrocardiogram (FECG) extraction is an interesting and challenging problem
    in biomedical engineering. The antepartum FECG is usually obtained through skin
    electrodes attached to the mother’s body [89]. Unfortunately, the desired fetal
    heartbeat signals appear at the electrode output buried in an additive mixture
    of undesired disturbances, such as the mother’s heartbeat signal with extremely
    high amplitude, the noise caused by mother’s respiration, and electronic equipment.
    Appropriate signal processing techniques are required to recover the wanted FECG
    components from the corrupted potential recordings.


    Many approaches have been reported to get the FECG, such as singular-value decomposition
    (SVD) [95], multireference adaptive noise cancellation [200], and so on. But the
    results are not satisfactory or highly sensitive to electrode placement. Recently,
    it was shown in [107] that the problem can be modeled as blind source separation
    (BSS) [43, 83]. It was reported that the results by BSS were more satisfactory
    than those by classical methods [5, 174, 200]. However, separating all the sources
    from a large number of observed sensor signals takes a long time and is not necessary,
    so the blind source extraction (BSE) method is preferred. The basic objective
    of BSE is estimating one or part of source signals from their linear mixtures.
    Such signals are usually with specified stochastic properties and bring the most
    useful information.


    Many BSE algorithms use the property of sparseness [209] or high-order statistics
    [46, 115, 205] to extract a specific signal. High-order methods address the BSE
    problem in a completely blind context, since they require few assumptions aside
    from the statistical independence of the sources. The second-order statistics
    (SOS) [11, 45, 206], however, operate in a semiblind setting, since their derivation
    usually requires the certain additional assumptions made on the nature of the
    source signals, such as statistical nonstationarity of the sources, presence of
    time correlations in stationary signals, or cyclostationarity. Nonetheless, such
    information is available in practical applications and should be exploited. Furthermore,
    the high-order approaches often have higher'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'computational load compared with the second-order methods. Thus, the versatile
    extraction algorithms based on second-order statistics become popular.


    Barros et al. [11] presented an objective function by using blind signal extraction
    along with prior information about the autocorrelation property of the FECG from
    the noisy-free measurements. We extend the work for the noisy case. Theoretical
    analysis of the new algorithm is also given in this chapter [111].


    This chapter is organized as follows. In Section 2, problem formulation is given.
    A new algorithm is proposed and theoretical analysis is given in Section 3. Section
    4 presents the simulations. Conclusions are drawn in Section 5.


    # 10.2  Problem Formulation


    Let us denote $s(k)=[s_1(k),\ldots,s_n(k)]^T$ as the source signals vector and
    by $x(k)=[x_1(k),\ldots,x_n(k)]^T$ as the observed signals vector. Thus, the mixture
    can be written as


    $$x(k)=As(k)+n(k), \tag{10.1}$$


    where $A$ is an $n\times n$ nonsingular matrix and $n(k)$ is additive noise. In
    general, the noise $n(k)$ is assumed to be uncorrelated with the source signals
    and its covariance matrix is given by


    $$E\{n(k)n^T(k-\Delta k)\}=\begin{cases}0, & \text{for }\Delta k\neq 0\\ R_n,
    & \text{for }\Delta k=0\end{cases}. \tag{10.2}$$


    Normally, we further assume that $R_n=\sigma_n^2I$, where $\sigma_n^2I$ is the
    variance of the noise. There are several approaches to estimate $\sigma_n^2$.
    If the number of mixtures is larger than the number of sources, we can use a subspace
    method to estimate $\sigma_n^2$, which in this case represents the smallest eigenvalue
    of $E\{x(k)x^T(k)\}$ [76], or we can use an adaptive principal component analysis
    method to real-time estimation of $\sigma_n^2$ [84].


    We assume that the source signals have temporal structure and different autocorrelation
    functions, but they do not necessarily have to be statistically independent. Denote
    by $s_i$ the fatal heartbeat signal to extract, which satisfies the following
    relation for the specific time delay $\tau_i$:


    $$\begin{cases}E\{s_i(k)s_i(k-\tau_i)\}\neq 0\\ E\{s_j(k)s_j(k-\tau_i)\}=0 & \forall
    j\neq i\end{cases}. \tag{10.3}$$


    Let $y(k)=w^Tx(k)$, where $w$ is the weight vector to be estimated such that $y(k)$
    recovers the specific source signal $s_i$. Define the error function as in [11]:


    $$\varepsilon(k)=y(k)-by(k-\tau_i), \tag{10.4}$$'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'where \(b\) is a parameter to be determined and \(\tau_i\) can be obtained
    in advance. A simple solution is to calculate the autocorrelation \(E[x_i(t)x_i(t-\tau_i)]\)
    of sensor signals as a function of the time delay and find the one corresponding
    to the peak of \(E[x_i(t)x_i(t-\tau_i)]\) [11]. For simplicity, denote \(y_k \triangleq
    y(k)\), \(y_{\tau_i} \triangleq y(k-\tau_i)\), \(x_k \triangleq x(k)\), \(x_{\tau_i}
    \triangleq x(k-\tau_i)\).


    The aim of extracting the desired FECG is then converted to seek appropriate parameters
    \(w\) and \(b\) to minimize the objective function


    \[ f(w,b)=E\{\varepsilon^2(k)\}-(1+b^2)\sigma_n^2. \tag{10.5} \]


    # 10.3  The Proposed Algorithm


    Calculating the derivative of the objective function (10.5) with respect to \(w\)
    and \(b\), we have the following updating rule:


    \[

    \begin{cases}

    w(k+1)=w(k)-\eta\,2E\left\{(x_k-bx_{\tau_i})(x_k-bx_{\tau_i})^T\right\}w(k)\\

    b(k+1)=b(k)-\eta\left[w^T(k)E\left\{-x_kx_{\tau_i}^T-x_{\tau_i}x_k^T+2bx_{\tau_i}x_{\tau_i}^T\right\}w(k)-2b\sigma_n^2\right]

    \end{cases}

    \tag{10.6}

    \]


    followed by a normalization of the Euclidean norm of vector \(w(k)\) to unit to
    avoid the trivial solution \(w(k)=0\). In Eq. (10.6), \(\eta\) is a small positive
    learning rate. Moreover, we can assume without losing generality that the sensor
    data are prewhitened; thus, \(E\{x_kx_k^T\}=I\). The algorithm updates \(b\) together
    with \(w\) to make the objective function (10.5) decrease and eventually extract
    the desired signals.


    **Theorem 10.1.** The objective function (10.5) decreases along the iteration
    rule (10.6) with sufficiently small \(\eta\).


    *Proof.* Denote \(D_k \triangleq E\left\{(x_k-bx_{\tau_i})(x_k-bx_{\tau_i})^T\right\}\),
    we have


    \[ f[w(k),b(k)] = w^T(k)D_kw(k)-(1+b^2)\sigma_n^2. \tag{10.7} \]


    Then with the notation \(f_{w(k)} \triangleq 2E\left\{(x_k-bx_{\tau_i})(x_k-bx_{\tau_i})^T\right\}w(k)\)
    and \(f_{b(k)} \triangleq w^T(k)E\left\{-x_kx_{\tau_i}^T-x_{\tau_i}x_k^T+2bx_{\tau_i}x_{\tau_i}^T\right\}w(k)-2b\sigma_n^2\),
    we have


    \[

    \begin{aligned}

    f[w(k+1),b(k+1)] &= E\left[w(k)-\eta f_{w(k)}\right]^T E\left\{[x_k-(b(k)-\eta
    f_{b(k)})x_{\tau_i}]\\

    &\quad\times[x_k-(b(k)-\eta f_{b(k)})x_{\tau_i}]^T\right\}[w(k)-\eta f_{w(k)}]\\

    &\quad -(1+[b(k)-\eta f_{b(k)}]^2)\sigma_n^2\\

    &= f[w(k),b(k)]-4\eta w^T(k)D_k^2w(k)\\

    &\quad-\eta f_{b(k)}^2+o(\eta),

    \end{aligned}

    \tag{10.8}

    \]'
