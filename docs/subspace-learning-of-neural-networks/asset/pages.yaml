  md: 'Then, it follows that


    $$\left.\frac{\partial G}{\partial w}\right|_{0}=I+2\eta C-\eta w^{T}(k)w(k)C-\eta
    w^{T}(k)Cw(k)I-4\eta Cw(k)w^{T}(k), \tag{5.29}$$


    where


    $$C=\frac{1}{4\eta}I-R,$$


    and $I$ is the unity matrix. For the equilibrium point $0$, it holds from (5.29)
    that


    $$\left.\frac{\partial G}{\partial w}\right|_{0}=I+2\eta C=1.5I-2\eta R=J_0.$$


    Denote the $i$th eigenvalue of $J_0$ by $\alpha_0^{(i)}$. By $\eta\lambda_1<0.25$,
    it holds that


    $$\alpha_0^{(i)}=1.5-2\eta\lambda_i\ge 1.5-2\eta\lambda_1>1,\quad (i=1,2,\ldots,n).$$


    According to the Lyapunov theory, the equilibrium point $0$ is unstable.


    For the equilibrium points $\pm v_j$ $(j=1,\ldots,n)$, it follows from (5.29)
    that


    $$\left.\frac{\partial G}{\partial w}\right|_{v_j}=(1+\eta\lambda_j)I-\eta R-(1-4\eta\lambda_j)v_jv_j^T=J_j.$$


    Denote the $i$th eigenvalue of $J_j$ by $\alpha_j^{(i)}$. Clearly,


    $$\alpha_j^{(i)}=1+\eta(\lambda_j-\lambda_i)\quad\text{if }i\ne j.$$


    $$\alpha_j^{(j)}=4\eta\lambda_j\quad\text{if }i=j.$$


    For any $j\ne n$, it holds that


    $$\alpha_j^{(n)}=1+\eta(\lambda_j-\lambda_n)>1.$$


    Clearly, the equilibrium points $\pm v_j$ $(j\ne n)$ are unstable. For the equilibrium
    points $\pm v_n$, since $\eta\lambda_1<0.25$, it follows that


    $$\alpha_n^{(i)}=1+\eta(\lambda_n-\lambda_i)<1\ \text{if }i\ne n.$$


    $$\alpha_n^{(i)}=4\eta\lambda_n<4\eta\lambda_1<1\ \text{if }i=n.$$


    Thus, $\pm v_n$ are asymptotically stable. The proof is completed.


    In this section, we have analyzed dynamics of DDT system (5.4) associated with
    the proposed stable MCA learning algorithm (5.3) and proved that weight vector
    of (5.4) will converge to stable equilibrium points $\pm v_n$ under some conditions.'
