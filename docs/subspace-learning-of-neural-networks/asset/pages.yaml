    the amount of variance with the principal directions associated with the first
    $m$ eigenvalues.


    Although the intrinsic dimensionality $m$ is just an appropriate number of principal
    directions for PCA neural networks, it is not easy to compute the number $m$ in
    advance for online applications. In this chapter, a PCA model is proposed that
    is motivated by a key characteristic of biological neural networks: that excited
    neurons can activate neurons close to them and inhibit neurons far away from them.
    Using this well-known *on-center/off-surround* principle [75, 101], the proposed
    model together with an improved GHA algorithm is able to adapt itself. In this
    learning procedure, the number of active neurons, which is the same as the number
    of principal directions in the model, approximates the intrinsic dimensionality
    $m$ of the given data set to achieve the precision $\alpha$. Therefore, a good
    balance between the quality of computational results and the complexity of the
    computations of PCA neural networks can be obtained.


    This chapter⁴ is organized as follows. In Section 2, the biologically plausible
    PCA model and the improved GHA algorithm are given. Some important properties
    of the model are analyzed in Section 3. Simulations are carried out in Section
    4. Conclusions are drawn in Section 5.


