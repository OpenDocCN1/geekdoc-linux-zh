    # **Theorem 5.2**  *if $\eta\lambda_1<0.25$, $w(0)\in S$, and $w^T(0)v_n\ne 0$,
    then in (5.4),*


    $$\lim_{k\to\infty}w(k)=\pm v_n.$$


    At this point, we have finished the proof about convergence of DDT system (5.4).
    Next, we further study the stability of (5.4). Clearly, the set of all equilibrium
    points of (5.4) is


    $$\{v_1,\ldots,v_n\}\cup\{-v_1,\ldots,-v_n\}\cup\{0\}.$$


    The following Theorem 5.3 will show the stability of the equilibrium points $v_n$
    and $-v_n$ in (5.4).


    # **Theorem 5.3**  *The equilibrium points $v_n$ and $-v_n$ are locally asymptotically
    stable if*


    $$\eta\lambda_1<0.25.$$


    *Other equilibrium points of (5.4) are unstable.*


    *Proof :* Denote


    $$\begin{aligned}

    G(w)&=w(k+1)\\

    &=w(k)+\eta\left[(w^T(k)w(k)-2)Rw(k)+w^T(k)Rw(k)w(k)\right]\\

    &\quad+0.5\left[1-w^T(k)w(k)\right]w(k).

    \end{aligned}$$'
