  md: 'Clearly, the principal direction \(W\) is the eigenvector associated with the
    largest eigenvalue of the covariance matrix \(S\).


    Suppose an image is rotated by an angle \(\theta\). Let vector \(\tilde{X}_i=[\tilde{x}_i,\tilde{y}_i]^T\)
    denote points of the rotated image. Clearly, \(\tilde{X}_i\) can be represented
    as follows:


    \(\tilde{X}_i = R \cdot X_i,\qquad (11.2)\)


    where \(R\) is the transform matrix and is given by


    \[

    R=\begin{bmatrix}

    \cos(\theta) & -\sin(\theta)\\

    \sin(\theta) & \cos(\theta)

    \end{bmatrix}

    \]


    Then, the first principal component \(\widetilde{W}\) of the rotated image is
    computed as follows:


    \[

    \widetilde{W}=\arg\max_{\widetilde{V}}\left\{\widetilde{V}^{T}E\left[\left(\widetilde{X}-\widetilde{\mu}\right)\left(\widetilde{X}-\widetilde{\mu}\right)^{T}\right]\widetilde{V}\right\}

    \]


    By (11.2), it follows that


    \[

    \begin{aligned}

    \widetilde{W} &= \arg\max_{\widetilde{V}}\left\{(R^T\widetilde{V})^T E\left[(X-\mu)(X-\mu)^T\right](R^T\widetilde{V})\right\}\\

    &= \arg\max_{\widetilde{V}}\left\{(R^T\widetilde{V})^T S(R^T\widetilde{V})\right\}.

    \end{aligned}

    \qquad (11.3)

    \]


    From (11.1) and (11.3), it is easy to get that


    \(\widetilde{W}=RW.\qquad (11.4)\)


    Equations (11.2) and (11.4) imply that the rotated image and its first principal
    component have undergone the same rotation transform.


    In our method, the first principal directions of the reference feature image and
    float feature image are computed by using PCA neural network, then it is easy
    to get the rotation angle, which is the angle between the two first principal
    directions.


    Registration methods using neural networks have been developed in recent years
    [63, 132, 146]. In the proposed method, Oja’s PCA neural network is used to compute
    the first principal direction.


    Oja’s network could compute the principal direction of the covariance matrix \(S\)
    associated with a given stochastic data set [134]. Suppose the input sequence
    \(\{x(k)\}\subseteq R^n(k=0,1,2,\ldots)\) is a zero mean stationary stochastic
    process and let \(C_k=x(k)x^T(k)\), then the Oja’s PCA learning algorithm can
    be described by the following stochastic difference equations:


    \[

    w(k+1)=w(k)+\eta\left[C_k w(k)-w^T(k)C_k w(k)w(k)\right],\qquad (11.5)

    \]


    for \(\eta\) is the learning rate and \(w(k)=[w_1(k),w_2(k),\ldots,w_n(k)]^T\).
