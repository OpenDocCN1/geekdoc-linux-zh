  md: "# # 11\n\n**Rigid Medical Image Registration Using PCA Neural Network**\n\n\
    # ### 11.1  Introduction\n\nIt is common for patients to undergo multiple tomographic\
    \ radiological imaging for the purpose of medical diagnosis. These multi-modality\
    \ images provide complementary information. However, it is difficult for doctors\
    \ to fuse these images exactly because of the variations in patient orientation.\
    \ For this reason, there has been considerable interest in using image registration\
    \ techniques to transfer all the information into a common coordinate frame. The\
    \ objective of this study is to find a transformation that best aligns the float\
    \ image (unregistered image) with the reference image.\n\nMany registration methods\
    \ have been developed for decade years [177]. In general, these methods are based\
    \ either on original images or on feature images. Among these methods, commonly\
    \ used registration techniques include Fourier transform [62], mutual information\
    \ [69], and cross-correlation method [10]. Recently, the registration method using\
    \ mutual information is very popular. This method can register multimodality medical\
    \ images accurately without preprocessing. However, the mutual information computation\
    \ is complex and costs much time. So there has been considerable interest in finding\
    \ new methods to rapidly register medical images.\n\nThe proposed method based\
    \ on feature images accomplishes registration by simply aligning feature images’\
    \ first principal directions and centroids [160]. The objective of this method\
    \ is to find parameters (rotation angle, translations along the *x*- and *y*-\
    \ axis) for registration. This method consists of three steps:\n\n+   1. *Feature\
    \ extraction.* For computed tomography-magnetic resonance (CT-MR) registration,\
    \ extracted contours are used as feature images. However, for MR-MR registration,\
    \ threshold segmented images are used as feature images. The next two steps are\
    \ based on feature images obtained in this step.\n+   \n+   2. *Computing the\
    \ rotation angle.* The proposed method uses a principal component analysis (PCA)\
    \ neural network to compute the first principal direction of the reference feature\
    \ image and that of the float"
  merge: -1
  img_proc: true
- pgno: 228
  md: "feature image, then the angle between the two directions is simply calculated,\
    \ which is used as the rotation angle.\n\n(3) *Computing translation.* Translations\
    \ are calculated by subtracting float feature image’s centroid from reference\
    \ feature image’s centroid.\n\nIn the procedure above, the crucial step is to\
    \ calculate the first principal directions by using PCA neural network [125, 134,\
    \ 136, 172, 195]. Since a PCA neural network can compute the principal direction\
    \ more easily, the computation is simplified. Moreover, the principal direction\
    \ usually converges to a unit vector, which makes the computation of rotation\
    \ angle simpler.\n\n# 11.2  Method\n\nThe proposed method consists of three steps:\
    \ (1) feature extraction; (2) Computing the rotation angle; and (3) computing\
    \ translations. The two-dimensional images in Figures 11.1 and 11.2 are used to\
    \ illustrate the procedure.\n\n# 11.2.1  Feature Extraction\n\nIn general, the\
    \ implementation of medical image registration is either on original images or\
    \ on feature images. The proposed registration method is implemented on feature\
    \ images.\n\n![](img/5d1bf22d32ba379cbf31221a5347fdb6_228_0.png)\n\n**FIGURE 11.1**\
    \  \nThreshold segmentation: (a) Reference image and (b) its reference feature\
    \ image with threshold 40. (c) Float image and (d) its float feature image with\
    \ threshold 40.\n\nFor MR-MR images registration, threshold segmented images are\
    \ used as feature images. The procedure of threshold segmentation consists of\
    \ two steps: (1) setting a threshold θ to lie within [0, 255]; (2) comparing image’s\
    \ intensity with θ, where values larger than θ are set to be 1, and all the others\
    \ are set to be 0. Figure 11.1 shows the threshold segmentation results. Figure\
    \ 11.1(a)"
