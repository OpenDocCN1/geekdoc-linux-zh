    \[\eta\sigma\leq 0.25.\]


    If \(w(0)\in S\) and \(w(0)\notin V_\perp\), then the trajectory of (2.12) starting
    from \(w(0)\) will converge to and a unit eigenvector associated with the largest
    eigenvalue of the covariance matrix \(C\).'
