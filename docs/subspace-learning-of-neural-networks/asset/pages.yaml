  md: 'Clearly, the probability $P(Y(k))$ and $P\left(\frac{\zeta}{y_l^2(k)}\right)$
    only depend on the distribution of the variable $X$. It is easy to see that $P(Y(k))$
    is not affected by the value of the learning rate $(4.2)$; that is, the value
    of the learning rates $(4.2)$ gives no information on the value of $Y(k)$. Thus,
    the learning rate $(4.2)$ and $Y(k)$ are independent of each other. Taking the
    conditional expectation $E\{w_l(k+1)/w_l(0),w_l(i),i<k\}$ on both sides of $(4.3)$,
    the corresponding DDT system for the GHA with learning rates $(4.2)$ can be written
    as


    $$\begin{aligned}

    w_l(k+1)&=w_l(k)+E\left\{\frac{\zeta}{y_l^2(k)}\right\}\times E\{Y(k)\}\\

    &=w_l(k)+\frac{\zeta}{w_l(k)^TCw_l(k)}\times\\

    &\quad E\left\{[x(k)x^T(k)w_l(k)\\

    &\qquad-\sum_{i=1}^{l-1}w_i(k)w_i^T(k)x(k)x^T(k)w_l(k)\\

    &\qquad-w_l^T(k)x(k)x^T(k)w_l(k)w_l(k)]\right\},\\

    &=w_l(k)+\frac{\zeta}{w_l(k)^TCw_l(k)}\times\\

    &\quad\left[Cw_l(k)-\sum_{i=1}^{l-1}w_i(k)w_i^TCw_l(k)\\

    &\qquad-w_l^T(k)Cw_l(k)w_l(k)\right].\tag{4.4}

    \end{aligned}$$


    for $k>0$, where $0<\zeta<1$ and $C=E\{x(k)x^T(k)\}$.


    The DDT system preserves the discrete time form of the original algorithm and
    gathers a more realistic behavior of the learning gain.


    The covariance matrix $C$ given in $(4.4)$ is a symmetric nonnegative definite
    matrix. Let $\lambda_i\ (i=1,\ldots,n)$ be all the eigenvalues of the matrix $C$
    ordered by $\lambda_1>\lambda_2>\cdots>\lambda_p>\lambda_{p+1}=\cdots=\lambda_n=0$,
    and let $v_i$ be the unit eigenvector of $C$ associated with the eigenvalue $\lambda_i$.
    Then, $\{v_i\mid i=1,2,\ldots,n\}$ forms an orthonormal base of $\mathbb{R}^n$.
    Denote by $V_{\lambda_i}$ the eigensubspace of the eigenvalue $\lambda_i$, and
    let $V_{\lambda_i}^{\perp}$ be the subspace perpendicular to $V_{\lambda_i}$.
    Denoting by $V_0$ the null subspace associated with the eigenvalue $0$, clearly,


    $$V_0=\operatorname{span}\{v_{p+1},\ldots,v_n\}.$$


    Since the vector set $\{v_i\mid i=1,2,\ldots,n\}$ is an orthonormal basis of $\mathbb{R}^n$,
    for $k>0$, $w_l(k)\in\mathbb{R}^n$ can be represented as


    $$w_l(k)=\sum_{i=1}^{n}z_i^{(l)}(k)v_i.\tag{4.5}$$


    where $z_i^{(l)}(k)\ (i=1,\ldots,n)$ are some coefficients and $1\le l\le p$.
    It is noted'
