- "# Linux 网络高级指南\n\n\n\n![](img/default_cover.jpeg)\n![](img/default_cover.jpeg)\n\
  \n# 献辞\n\n献给所有在 2001 年 9 月 11 日后捐献时间、金钱、产品或血液的人。你们赋予了希望，让人性最好的一面可以战胜最糟糕的一面。\n\n\
  # 前言\n\n计算机网络改变了我们的生活。它们在 20 世纪 70 年代和 80 年代缓慢增长，且在大多数时候不被注意到。然而，90 年代发生了一些事情。也许是因为万维网（WWW\
  \ 或 Web）和图形化 浏览器的出现，使得计算机网络 Dorothy 奶奶和 Stan 叔叔也能使用。也许是网络连接的可用性达到了关键阈值。也许网络软件的质量和数量超过了关键阈值。也可能是这三者中的两个或三个，或者完全是其他原因。无论如何，网络变得引注目。最重要的是，互联网变得引注目。\n\
  \n互联网由数百万计算机组成，其中许多运行着服务器——这些用于监听并响应来自其他计算机数据传输请求的软件包。由于构建互联网的协议被设计为跨平台工作模式，因此 Internet\
  \ 客户端和它们使用的服务器都运行在许多不同的平台上。其中最流行的之一是 Linux。结合廉价的 `x86` 硬件，Linux 为中小型站点提供了一个极具成本效益的服务器平台。事实上，随着计算机性能的提高以及\
  \ Linux 版本向计算机性能层级的高端移动，Linux 开始进入大型服务器市场。因此，从微型网络设备到大型服务器，Linux 无处可见，了解如何设置和维护\
  \ Linux 服务器系统是当今网络专业人员的一项重要技能。\n\n但是，是哪些服务器呢？有数百甚至上千个独立的服务器程序。大多数通用 Linux 网络书籍都关注少数流行的服务器——如\
  \ Web（`HTTP`）服务器如 `Apache`、登录服务器如 `Telnet` 和 `SSH`、文件服务器如 `NFS` 和 `Samba` 以及其他几个。这些书籍提供了足够让用户运行起来的信息，但仅此而已。它们还忽视了那些可见度较低但通常极关重要的服务器，例如\
  \ `DHCP` 服务器、时间服务器和 Kerberos。本书在 Linux 网络方面采取了不同的方法：我假设你至少对 Linux 和通用网络有最少的了解，并且你想将自己的技能提升到更高水平。虽然本书涵盖了这些“常疑犯”，但它花较少的时间介绍基础知识，花更多的时间描述高级或不寻的配置。本书还涵盖了大多数初级\
  \ Linux 网络书籍中忽略的一些服务器和主题。其结果是尽可能接近一本既是通用 Linux 网络书籍又是高级 Linux 网络书籍的书。\n\n可以肯定，你不会在书中学到关于\
  \ `Apache` 或 `Samba` 等复杂包的所有知识。相关章节提供了这些工具的快速介绍，总结了某些在其他初级 Linux 网络书籍中未涵盖的流行技术，并指出了额外资源的方向。本书的方法是作为针对非初学者的通用\
  \ Linux 网络书籍。\n\n# 谁应该买这本书\n\n本书旨在为那些具有某些 Linux 网络经验，或至少具有某些 Linux 和网络经验的人提供进阶教程和参考。。前几章涵盖了低级配置，包括诸如让网络开始运行等因素；但我假设你已经熟悉\
  \ Linux（或至少是 UNIX）以及网络术语。如果你不熟悉这些内容，一本入门级的 Linux 管理书籍，如 Marcel Gagné 的 *Linux System\
  \ Administration: A User's Guide》（Addison-Wesley, 2002）或 Vicki Stanfield 和我的 *Linux\
  \ System Administration》（Sybex, 2001）应该能帮助填补空白。\n\n如果你想更多地了解 `Apache` 或 `Samba`\
  \ 等大型服务器，但不想为它们购买专门的书，或者你想了解像 `xntpd` 或 `xfs` 这样小但可能重要的服务器，那么这本书适合你。本书还涵盖了杂杂网络主题，如如何启动和停止服务器、备份网络、在\
  \ `chroot` 监狱中运行服务器以及使用 `iptables`。了解这些主题将帮助完善你的网络知识库，并让你更好地适应新需求，并通常提高你所管理的网络。\n\
  \n在编写本书时，我想象读者是小型或中型网络的管理员。你的网络可能由 Linux、UNIX、Windows、MacOS 或更奇特的东西主导，但你当然至少有一个\
  \ Linux 系统。大多数章节描述了构建工具的基本原理，然后描述了如何使用该工具。因此，你应该能够通过阅读本书学到很多关于工具的知识，也可以将本书作为快速参考。我的目标是让这本书成为如果你只能选择一本\
  \ Linux 网络书籍时会选择的那一本。\n\n# Linux 发行版\n\n\n\n\n\n管理 Linux 的挑战之一在于 Linux 并不是一个单一的操作系统。相反，它是一系列围绕同一个内核构建的操作系统集合。这些变体操作系统每一个被称为一个\
  \ `distribution`（发行）。一个发行版包含 Linux 内核；一个特定于发行版的安装程序；大量的支持工具、用户程序等；以及一组默认的启动和配置脚本。不同的发行版经常使用不同版本的\
  \ Linux 内核和支持程序。事实上，它们有时会带有完全不同的程序来承担特定角色，例如用于邮件服务器的 `sendmail`、`Exim` 或 `Postfix`。由于这些原因，Linux\
  \ 发行版在整体感受和许多管理细节上可能存在很大差异。\n\n许多关于 Linux 的书籍未能解决 Linux 发行版之间的差异问题。它们刻意只关注某一个发行版，或者对其他发行版进行草草介绍。然而，本书的目标之一是明确涵盖几个最流行的\
  \ Linux 发行版。具体来说，我涵盖了 `Caldera OpenLinux 3.1`、`Debian GNU/Linux 2.2`、`Mandrarake\
  \ 8.1`、`Red Hat 7.2`、`Slackware 7.0`、`SuSE 7.3` 和 `TurboLinux 7.0`。尽管如此，我无法涵盖这些每个操作系统的每一个细节，但我指出了它们在重要方面的差异，例如每个系统将网络启动脚本放在何处，以及每个系统包含哪些\
  \ `FTP` 服务器。某些章节——特别是关于服务器启动工具、`LPD` 打印服务器、`SMTP` 邮件服务器和 `FTP` 服务器的章节——涵盖了多个服务器，以便适用于这七个主要\
  \ Linux 发行版的默认配置。\n\n# 本书的结构\n\n本书分为四个部分，每部分包含四到十三章。这种结构代表了一种假设，即你的网络包含一些主要供本地用户使用的服务器，另一些暴露给整个互联网的服务器，但当然，某些服务器可以兼顾两者，因此某些服务器的放置可能无法反映你网络上的配置。本书的四个部分如下：\n\
  \n*   **第一部分：低级配置**——这一部分最短，只有四章。它涵盖了内核网络配置选项、基础 `TCP/IP` 网络配置、网络栈和启动服务器。\n*   **第二部分：本地网络服务器**——这一部分涵盖了最可能被你本地网络上的其他计算机使用的服务器和程序。这包括\
  \ `DHCP` 服务器、`Kerberos`、`Samba`、`NFS` 服务器、使用 `LPD` 进行打印、时间服务器、`POP` 和 `IMAP` 邮件服务器、新闻服务器、远程登录服务器、`X`\
  \ 和 `VNC` 服务器、字体服务器、远程管理服务器和网络备份。\n*   **第三部分：互联网服务器**——这些章节涵盖了全球可见的服务器。主题包括 `DNS`\
  \ 服务器、`SMTP` 邮件服务器、Web 服务器和 `FTP` 服务器。\n*   **第四部分：网络安全和路由器功能**——这一部分偏离了将服务器作为独立章节主题的重点，而是关注网络安全。主题包括网络安全的概览、使用\
  \ `chroot` 监狱、配置高级路由器功能、使用 `iptables` 用于防火墙和 `NAT` 目的，以及设置 `VPN`。\n\n# 本书使用的约定\n\
  \n在讨论计算机和软件时，很容易产生困惑，因为并不总是清楚一个词何时具有通常含义，何时是指代计算机、文件、程序、命令等的。由于由于原因，本书使用了某些字体约定来帮助澄清问题。具体而言：\n\
  \n*   正文大部分以普通的、等比例的字体出现，如下所示。\n*   *斜体文本*表示章节中首次出现的重要术语。它有时也用于强调。\n*   `等宽字体文本`表示文件名、计算机名、命令使用的语法、配置文件的内容或在命令提示符处输入命令的输出。有时程序名称也会以这种形式出现，当这些名称实际上是软件的文件名时。\n\
  *   `*斜体等宽字体文本*`表示变量——在你的系统上可能有所不同的信息。例如，指令可能会说创建一个名称无关紧要或系统特定的文件。然后指令可能会将该文件简称为\
  \ `*file.txt*`。\n*   `**粗体等宽字体文本**`表示你应当在命令提示符处完全输入的信息。当它单独占一行时，前面通常会有一个命令提示符。\n\
  \n当你输入的命令单独占一行时，该命令前面会有一个命令提示符。井号 `#` 表示 `root` 命令提示符。如果命令提示符是美元符号 `$`，则普通用户可以（且通常会）输入该命令。一些异常长的命令在第一行以外的所有行末尾使用换行符——反斜杠\
  \ `\\`。你可以按照它们出现的样子完全输入这些命令（包括反斜杠），或者你可以省略反斜杠并将这些命令完全写在一行。本书还使用了许多适用于整个段落或较大文本段的特殊文本元素。这些元素旨在突出重要或次要的信息。它们是：\n\
  \n## 注意 (NOTE)\n\n“注意”对于主讨论并非至关重要，但它包含的信息很有趣，或者在某些情况下可能有用。例如，“注意”可能会指出某功能与程序之前的版本有何不同。\n\
  \n## 提示 (TIP)\n\n“提示”包含了可以以非明显方式帮助你实现目标的信息，或者可以引导你发现可能想到的系统或软件用途。\n\n## 警告 (WARNING)\n\
  \n“警告”描述了潜在的陷阱或危险。警告包括使用错误可能会损坏你系统的软件、违反禁止某些行为的 `ISP` 策略的风险，以及可能导致你的系统受到外部入侵者攻击的配置。\n\
  \n**侧边栏 (Sidebars)**\n\n侧边栏类似于“注意”，但通常更长——通常至少两段。这些组件包含了对无法整齐融入章节整体流的问题的扩展讨论，但这些问题仍然是相关的、有趣的，甚至是重要的。\n\
  \n\n\n\n\n在讨论网络时，通常需要给出特定的 `IP` 地址作为示例。在大多数情况下，即使对于通常会位于公共互联网上的系统，我也使用了预留给私有网络范围内的（192.168.0.0–192.168.255.255，172.16.0.0–172.31.255.255\
  \ 以及 10.0.0.0–10.255.255.255）的 `IP` 地址。我这样做是为了避免在随机选择合法的 `IP` 地址时可能引起潜在的混淆或无意冒犯。\n\
  \n# 联系我\n\n如果你对本书有任何问题或建议，可以通过 `rodsmith@rodsbooks.com` 与我联系。我还在 [`www.rodsbooks.com/adv-net/`](http://www.rodsbooks.com/adv-net/)\
  \ 维护了一个关于此书的网页。\n\n# 致谢\n\n我要感谢我的编辑 Karen Gettman，感谢她细致的工作引导了本书完成了整个制作过程。项目协调员 Emily\
  \ Frey 协助了这项工作，她接收了我的章节并确保了一切进展顺利。任何技术书籍在没有技术专家的帮助都是无法印刷的，他们帮助确保作者编写的内容尽可能地接近现实。本书的评审员包括\
  \ Karel Baloun、Amy Fong、Howard Lee Harkness、Harold Hauck、Eric H. Herrin II、David\
  \ King、Rob Kolstad、Matthew Miller、Ian Redfern 和 Alexy Zinin。如果文本在经过他们的审核后仍有错误，那么这些错误完全是我自己的责任。除了他在技术评审方面的帮助外，我还要感谢\
  \ David King 在 Linux 网络方面许多有益的讨论。最后，我要感谢我的经纪人 Studio B 的 Neil Salkind，他在 Addison-Wesley\
  \ 的 Michael Slaughter 的帮助下让这本书得以出版。\n\n# 第一部分。低级配置\n\n# 第 1 章 内核网络配置\n\n俗话说“条条路通罗马”。Linux\
  \ 网络也有异曲同工，只不过在这种情况下，罗马就是 Linux 内核。早晚，所有的网络流量都会通过内核。鉴于并非所有的计算机或网络都是相同的，Linux 内核包含了几个你可以设置的选项，以根据你的特定需求优化系统。你可以在启动过程中或系统启动后通过向内核传递参数来设置其中一些选项，本书的后续章节涵盖了这些许多此类情况。在其他情况下，你必须重新编译内核以激活所需的选项，或禁用可能会降低你系统性能的选项。\n\
  \n本章专门讨论这些内核配置选项。首先讨论内核配置程序。接下来是关于网络协议选项的信息，例如 `TCP/IP` 特性、网络过滤器以及对非 `TCP/IP` 协议栈的支持。接着讨论\
  \ Linux 对各种类型网络硬件的驱动程序。本章最后简要概述了内核的编译和使用过程。\n\n### 注意\n\n![注意](img/note.gif)\n\n\
  本章并不试图教你编译内核所需的所有知识；相反，它侧重于内核中的网络选项。“开始内核配置”和“编译并安装内核”章节包含了关于更通用的内核配置和使用的讨论，但如果你是内核编译的新手，可能想参考\
  \ Linux 内核 HOWTO ([`www.linuxdoc.org/HOWTO/Kernel-HOWTO.html`](http://www.linuxdoc.org/howto/kernel-howto.html))\
  \ 或入门 Linux 书籍中的内核编译章节。\n\n## 开始内核配置\n\n要配置编译时内核选项，你必须从内核源代码开始。所有主流发行版都带有此源码，但默认可能安装或未安装。许多发行版对标准内核进行了修改（例如，添加尚未成为标准的新驱动程序）。你可能倾向于从标准内核开始，仅添加你需要的补丁（你可能不需要任何补丁）。请检查\
  \ [`www.kernel.org`](http://www.kernel.org) 或主要的 Linux 存档网站（如 ftp://sunsite.unc.edu）获取最新的内核源码。（你也可以从你的\
  \ Linux 发行版获取内核源码，但许多发行版自带的内核已经过补丁，包含了非标准驱动程序。如果你遇到问题并需要帮助解决它们，使用更标准的内核可能会有益处。）\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n内核开发目前有两个分支，它们通过三位版本号中的第二个数字来区分。第二个数字为偶数的（如 2.4.17）被称为\
  \ `stable`（稳定）或 `release`（发布）内核。第二个数字为奇数的（如 2.5.2）是 `development`（开发）内核。稳定内核最适合生产环境，因为正如名称所示，它们非常可靠。另一方面，开发内核正在被不断改进——内核开发者利用此来添加新驱动程序、更改接口等。因此，除非你想为内核做贡献或你确实需要某些新驱动程序，否则应避免使用开发内核。（在后的情况下，你通常可以在旧的稳定内核中找到回传。）\n\
  \n内核源码通常位于 `/usr/src/linux`，或者位于 `/usr/src` 下包含版本号的子目录，例如 `/usr/src/linux-2.4.17`。对于后者，常见的做法创建一个名为\
  \ `/usr/src/linux` 的符号链接并指向源码目录。这使得假设源码位于 `/usr/src/linux` 的程序能够正常运行，即使你想保留多个版本的内核。\n\
  \n一旦你将内核源码解压到 `/usr/src/linux`，你应该在正常的命令行 shell 中进入该目录。然后你可以发布命令来配置内核选项。可能的方法包括：\n\
  \n- `make config`：这是基本的配置工具。它轮询你每一个内核选项，这可能很乏味。如果你犯了错，通常必须返回重来。由于这个原因，现在很少使用。\n\
  - `make menuconfig`：这种配置程序使用基于文本的菜单进行配置选项，允许你查看选项并仅调整需要更改的部分。这是文本模式环境下常用的配置方法。\n\
  - `make xconfig`：这种方法与 `make menuconfig` 类似，但 `make xconfig` 使用 `GUI` 配置菜单。你可以点击主题查看其选项，然后点击鼠标选择是否以及如何编译任何选项。在运行\
  \ X Window 系统（简称 X）时，这是一种流行的内核配置手段。\n\n所有这些方法提供的选项相同，这些选项被组织成大类。（某些类别还包含子类别）。当你使用\
  \ `make menuconfig` 或 `make xconfig` 选择一个类别时，会出现一个新菜单，显示该类别中的选项。（图 1.1 显示了 `make\
  \ xconfig` 的情况。）对网络特别感兴趣的是“网络选项”和“网络设备支持”类别，它们是接下来两个节的主题。\n\n\n\n\n\n![Linux 内核编译选项被分为类别和子类，每个类别都有自己的菜单。](img/01fig01.jpg)\n\
  \n**图 1.1. Linux 内核编译选项被分为类别和子类，每个类别都有自己的菜单。**\n\n### 注意\n\n![注意](img/note.gif)\n\
  \n本章描述了 Linux `2.4.*x` 内核选项，特别是 2.4.17 内核中的选项。内核网络选项在过去发生过变化，未来可能再次发生。`2.2.*x` 内核使用类似的选项，但某些细节有所不同。一种名为\
  \ `CML2` 的新内核配置工具正在实验性的 `2.5.*x` 内核中开发。关于它的更多信息，请查看 [`tuxedo.org/~esr/cml2/`](http://tuxedo.org/~esr/cml2/)。\n\
  \n大多数内核选项使用二位或三位切换（在图 1.1 中显示的 `Y`、`M` 和 `N` 选项）。`Y` 和 `N` 分别表示选项在内核文件中是否存在，`M`\
  \ 代表*模块化编译*——将该选项编译为可以加载和卸载的独立文件。这些选项将在后续章节“驱动程序：模块或内置”中进行更详细的描述。\n\n## 网络协议支持\n\
  \n网络选项（Networking Options）内核菜单包含与网络协议相关的选项。你可以包含或排除对整个协议栈的支持，对于某些协议（特别是 `TCP/IP`），你可以对支持进行精细调整，以针对特定角色优化内核，例如路由器选项或数据包过滤。\n\
  \n### 数据包和套接字选项\n\n在相当底级上，Linux 网络通过允许程序通过称为*套接字*（sockets）的数据结构发送或接收数据块（称为*数据包*）来实现。在大多数情况下，程序打开套接字的方式与打开文件类似。然后程序可以通过该套接字发送和接收数据。网络协议栈（稍后在“备选网络栈选项”中讨论）处理数据的方式使其能够到达目的地，或者在从发送者处接收后由程序解释。\n\
  \n在某些情况下，希望以其他方式处理网络数据，或者修改或扩展标准的数据包和套接字操作。这些选项中有些足够重要，以至于拥有自己的章节。一些杂项选项包括：\n\n\
  * **数据包套接字 (Packet Socket)**——此选项允许应用程序跳过大部分普通协议栈。大多数程序不需要此功能，但某些网络诊断工具和其他低级实用程序需要它。例如，显示低级\
  \ `TCP/IP` 数据包信息的 `tcpdump` 就使用了此内核选项。不必要地包含此选项会略微增加内核的大小，并可能允许入侵者使用如 `tcpdump`\
  \ 等你不希望入侵者使用的低级网络诊断工具。不过，省略此功能将防止*你*运行这些程序。\n\n* **数据包套接字：映射 I/O (Packet Socket:\
  \ Mmapped IO)**——这是一个数据包套接字子选项，如果启用，可以提高使用数据包套接字连接的工具的性能。\n\n* **Unix 域套接字 (Unix\
  \ Domain Sockets)**——几个常用且重要的 Linux 程序在单台计算机上运行时，使用网络协议相互通信。示例包括 `syslogd`（处理日志文件）和\
  \ `X`（X 程序使用网络协议与显示窗口的 X 服务器通信）。Unix 域套接字选项允许在缺少传统网络硬件的系统上进行这种计算机内部的通信。当计算机具有传统硬件时，域套接字方法比使用更通用的\
  \ `TCP` 套接字更快。你应该在所有标准的 Linux 系统上包含此选项；只有特殊的嵌入式设备等可能缺少此选项。\n\n这些选项的默认设置对于大多数安装都是合理的。不过，你可能想在某些系统上禁用数据包套接字支持。\n\
  \n### 网络过滤选项\n\n网络过滤器允许系统阻止或修改进入或离开计算机的数据包。其中一个选项（包过滤）对于构建防火墙或执行 `IP` 伪装尤为重要，正如第\
  \ 25 章 中所示。防火墙可以阻止对计算机或其保护的网络的某些类型不良访问，而 `IP` 伪装让你能在整个网络中共享单个 `IP` 地址。特定的内核网络过滤选项包括：\n\
  \n* **套接字过滤 (Socket Filtering)**——通常，内核会将为给定套接字接收的所有数据包传递给创建该套接字的程序。此选项允许程序让内核指向一个小程序（称为*过滤器*），该程序将拦截其接收到的部分数据包。很少程序需要这种机制，但动态主机配置协议\
  \ (`DHCP`) 是一个例外——最近的 `DHCP` 服务器和某些 `DHCP` 都需要它。因此，如果你的网络使用 `DHCP`，你应该启用此选项。\n\n\
  * **网络数据包过滤 (Network Packet Filtering)**——此选项是 `2.4.*x` 内核中最重要的过滤器类型，因为它启用了某些防火墙和\
  \ `IP` 伪装技术。由于这些非常重要，通常包含此支持是一个好主意。当你这样做时，“网络数据包过滤调试”选项将可用，如果你遇到问题，可以启用它。随后的子菜单\
  \ `IP`: Netfilter 配置 也会变得可用。列表中的后续项目将出现在此子菜单中。\n\n* **连接跟踪 (Connection Tracking)**——启用此选项允许内核比通常更详细地跟踪网络连接。例如，路由器通常盲目地在两个网络接口之间传递数据包，但当启用此选项时（在内核和用户级工具中都启用），Linux\
  \ 可以匹配源和目的 `IP` 地址和端口以备将来参考。此功能是 `IP` 伪装所需的，因此在以此方式运行的计算机上应该启用它。对于大多数其他系统来说，这不是必要的。如果你启用了它，`FTP`\
  \ 协议支持选项将可用。`FTP` 需要额外的维护工作，因此如果你想在 `IP` 伪装连接上使用 `FTP`，请启用此选项。\n\n\n\n\n\n## `IP`\
  \ Tables 支持\n\n- **此选项包含了用于 `iptables` 工具的内核支持程序，该工具用于设置数据包过滤防火墙和 `IP` 伪装**，正如第\
  \ 25 章 中讨论的那样。激活此选项还允许你选择若干子选项，以精细调整你的可用功能。许多此类选项的名称格式为 `Criterion Type` Match Support，这允许内核根据指定的\
  \ `Criterion Type` 进行匹配。在这些选项中，`Connection State Match Support` 特别重要，因为它允许系统执行*有状态的包包检测*，这是在第\
  \ 25 章 中讨论过的一种有用防火墙操作形式。`Packet Filtering`、`Full NAT` 和 `LOG Target Support` 选项也非常重要，它们各自的子选项也同样至关重要。如果你想将计算机用作\
  \ `IP` 伪装路由器或防火墙，请启用所有这些功能。对于独立的工作站或服务器，可以省略 `Full NAT`。\n\n- `ipchains` (2.2-Style)\
  \ 支持 — **如果你有一个基于 2.2.x* 内核使用的 `ipchains` 工具的旧版防火墙脚本，只要不直接将 `IP` Tables 支持编译到内核中，你就可以激活对该工具的支持。（`ipchains`\
  \ 和 `iptables` 工具是实现相同功能的两种互不兼容的方法，但 `iptables` 更先进。）如果你正在从零开始防火墙，可以安全地省略 `ipchains`\
  \ 支持。**\n\n- `ipfwadm` (2.0-Style) 支持 — **2.0.x* 内核使用一种名为 `ipfwadm` 的防火墙工具。如果你有基于\
  \ `ipfwadm` 的防火墙脚本，可以通过编译此功能来使用它，但该功能与 `iptables` 和 `ipchains` 支持都不兼容。除非你确实有这样一个脚本，且没有兴趣将其修改为使用\
  \ `iptables`，否则你可以安全地省略此选项。**\n\n在 2.0.x* 和 2.4.x* 内核之间，过滤选项变得更加复杂。2.4.x* 内核包含许多选项，如果不确定，请激活所有这些选项。\n\
  \n### 警告\n\n![WARNING](img/warning)\n\n你可能认为你不需要它，但到 2002 年，很少有网络允许使用。由于这些原因，升级\
  \ IPv4 正在开发中。\n\n## QoS 选项\n\n假设你的 Linux 系统是一个繁忙域的路由器，或者是一个处理大量流量的主要服务器。在这种情况下，Linux\
  \ 经常发现其需要处理的数据包多于其通过网络接口发送的包。因此，Linux 需要一些系统来调度输出数据包的传输。\n\n\n\n\n\n为了实现 QoS 系统，你必须在同名的菜单中选择\
  \ QoS 和/或公平队列（Fair Queueing）选项。此操作将启用该菜单中的许多选项。其他一些选项依赖于你对一个或多个其他特定选项的选择。最基本的功能通过各种数据包调度器和队列选项启用，例如\
  \ `CBQ` 数据包调度器和 `SFQ` 队列。这些选项允许内核以比默认 `FIFO` 更复杂的方式调度数据包。QoS 支持和数据包分类器（Packet Classifier）API\
  \ 选项及其各个子选项允许使用区分服务（Differentiated Services）和资源预留协议（RSVP）。这两者都允许路由器向其他路由器通信 QoS\
  \ 优先级。如果两个站点之间的所有路由器实现了兼容的 QoS 协议，最终结果可以大幅提高时间敏感型协议的性能，代价是牺牲非时间敏感型协议的。\n\n大多数非路由器系统不需要任何\
  \ QoS 选项。如果你正在将 Linux 计算机配置为路由器——特别是一个频繁使用的路由器——你可能想要激活这些选项。如果你激活了其中一个，那么激活所有选项可能是有意义，因为在没有激活所有选项的情况下，你用于指定\
  \ QoS 准则的工具将不再灵活。例如，如果你漏掉了 U32 分类器选项，你将无法根据目标地址对流量进行优先级排序。\n\n在实践中，使用 QoS 功能需要使用高级路由工具，如\
  \ `ip` 和 `tc`。第 24 章 涉及这些工具，但它们可能极其复杂。`iproute2` + `tc` Notes ([`snafu.freedom.org/linux2.2/iproute-notes.html`](http://snafu.freedom.org/linux2.2/iproute-notes.html))\
  \ 和 Linux 区分服务 ([`diffserv.sourceforge.net`](http://diffserv.sourceforge.net)) 网站包含了关于这些工具的文档。\n\
  \n### 高级协议支持\n\nLinux 内核对几种高级网络协议提供了明确支持。将此支持放在内核有两个主要优势：首先，这段代码的运行速度比普通的用户级程序更快。其次，放在内核中允许该协议的功能与系统的其余部分进行更集成。例如，内核级对网络文件共享协议的支持允许\
  \ Linux 像本地文件系统一样挂载远程文件导出。`2.4.*x` 内核包含了对三个特别重要的高级协议的支持：`HTTP`、`NFS` 和 `SMB`/`CIFS`。\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n此协议列表并不完整。还支持其他几种协议（特别是网络文件共享协议）。\n\n### HTTP\
  \ 加速\n\n超文本传输协议（`HTTP`）是万网的核心。从 `2.4.*x` 内核开始，Linux 在内核中包含了一个实际上是简单的 `HTTP` 服务器。该服务器包含内核\
  \ HTTPd 加速选项中包含，并通过向 `/proc/sys/net/khttpd` 目录中的伪文件写入特定值来配置和激活，如第 20 章 运行 Web 服务器所述。\n\
  \n内核的 `HTTP` 服务器之所以创建，是因为提供静态 Web 页面（即内容固定的页面，而不是内容可能为单个用户定制的动态页面）的工作本质上只是将文件从磁盘复制到网络地址。此操作在内核中执行比在用户空间程序中要高效得多。对于动态内容甚至某些类型的静态内容，内核服务器会回退到如\
  \ Apache 等用户空间 Web 服务器。不需要特殊的 Apache 配置；Apache 只是看不到对静态 Web 页面的请求。\n\n### NFS 选项\n\
  \nSun 开发了网络文件系统（`NFS`），作为在几台计算机之间共享文件的方法，就像这些文件是本地的一样。Linux 包含了对 `NFS` 的支持，详第 8\
  \ 章。要挂载远程 `NFS` 导出，必须在内核中包含 `NFS` 支持。大多数 Linux `NFS` 服务器也依赖于内核的支持。客户端和服务器 `NFS`\
  \ 选项都位于文件系统菜单下的网络文件系统子菜单中，而不是在网络选项菜单中。具体来说，你可能想要激活的选项包括：\n\n*   `NFS File System\
  \ Support`——此选项启用基本的 `NFS` 客户端支持（即能够将远程 `NFS` 导出挂载为本地分区）。如果你想挂载由其他计算机导出的 `NFS`，请启用它。\n\
  *   `Provide NFSv3 Client`——`NFS` 经历了多次修订，最新版本是版本 3 (NFS3)。目前必须显式启用此支持，因为它不像由 `NFS`\
  \ 激活的旧版本 `NFS` 支持那样可靠。NFS3 支持依赖于匹配的通用 `NFS` 支持。\n*   `Root File System on NFS`——如果你在网络选项菜单中选择了\
  \ `IP`: 内核级自动配置，你可以选择此选项，它允许 Linux 从 `NFS` 导出挂载其根文件系统。你通常会在缺少硬盘的工作工作站上使用此选项。\n*\
  \   `NFS Server Support`——为了让 Linux 充 `NFS` 服务器（即让其部分或所有目录对其他计算机可用），你需要运行一个 `NFS`\
  \ 服务器。此选项为编写为利用该特性的 `NFS` 服务器提供加速功能。运行 `NFS` 服务器并不严格需要此选项，但通常包含它是一个好主意，因为大多数 Linux\
  \ `NFS` 服务器都是为了这种支持而编写。\n*   `Provide NFSv3 Server`——如果你想为理解 NFS3 的客户端运行内核感知的 `NFS`\
  \ 服务器，请激活此选项。与 NFS3 客户端支持一样，此选项依赖于匹配的通用 `NFS` 支持。\n\n### 注意\n\n`NFS` 主要用于 Unix 和\
  \ Linux 系统。其他平台之间的文件共享通常由其他工具处理，其中一个将在后续讨论。\n\n### SMB/CIFS 选项\n\n\n\n\n\n`NFS`\
  \ 并不是唯一的网络文件共享协议。例如，Mac 经常使用 AppleTalk，而 Novell 的 `IPX`/`SPX` 是一个流行的协议栈，并带有相关的文件共享工具。除了\
  \ `NFS` 之外，Linux 最常用的文件共享工具可能是 `Samba`，它实现了服务器消息块 (`SMB`) 协议，该协议也被称为通用互联网文件系统 (`CIFS`)。第\
  \ 7 章涵盖了 Samba 的配置和使用。\n\nSamba 提供了 Linux 作为 `SMB`/`CIFS` 服务器运行所需的所有内容，因此该功能不需要进行内核配置。然而，如果你想让\
  \ Linux 能够挂载 `SMB`/`CIFS` 共享，你必须激活 `SMB` 文件系统支持选项，这大致等同于针对 `NFS` 的 `NFS` 文件系统支持。两个子选项（使用默认\
  \ `NLS` 和默认远程 `NLS` 选项）允许 Linux 根据国家语言支持 (`NLS`) 字符集进行文件名翻译。如果你使用西里字母等非罗马字母，甚至是英语所使用的罗马字母的扩展（如包含变音符号的字符），这些选项可能会很重要。\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n可以使用 `smbclient` 程序将 Linux 作为 `SMB`/`CIFS` 客户端，即使你没有激活\
  \ Linux 的 `SMB`/`CIFS` 内核选项。不过，`smbclient` 并没有实际挂载 `SMB`/`CIFS` 共享；它通过类似于 FTP 的界面让你访问共享。\n\
  \n## 替代网络栈选项\n\n尽管 `TCP`/`IP` 是 Linux 最流行的网络协议集，也是互联网的基础，但它并不是唯一的网络协议栈选择。“网络选项”菜单包含了其他几种。此菜单中的大多数选项实际上是\
  \ `TCP`/`IP` 网络的子选项。如果你滚动过这些选项，将看到 `TCP`/`IP` 的替代方案：\n\n*   **异步传输模式 (ATM)**。这是一组支持\
  \ ATM 硬件和协议的实验性选项。ATM 与其说是网络栈，不如说是一个硬件定义，但在 2.4.x 内核中，它与其他协议栈一起在“网络选项”菜单中启用。\n*\
  \   **`IPX` 协议**。Novell 的网际数据交换 (`IPX`) 是一种用于许多本地网络的协议栈，特别是那些运行 Netware 服务器操作系统的网络。要使用此协议栈，你需要额外的软件，例如\
  \ `Mars_nwe`（详见 [`www.redhat.com/support/docs/tips/Netware/netware.html`](http://www.redhat.com/support/tips/netware/netware.html)）。“文件系统”菜单下“网络文件系统”子菜单中的\
  \ `NCP` 文件系统支持选项允许你挂载 Netware 卷，就像相应的 `NFS` 和 `SMB`/`CIFS` 选项允许你挂载 `NFS` 导出 Windows\
  \ 文件共享一样。\n*   **AppleTalk 协议支持**。Apple 开发了 AppleTalk 协议栈以便在其 Macintosh 计算机上实现文件和打印机共享。Linux\
  \ 通过内核和 Netatalk 软件包 ([`netatalk.sourceforge.net/`](http://netatalk.sourceforge.net/))\
  \ 支持 AppleTalk。\n*   **DECnet 支持**。数字设备公司（DEC；后被 Compaq 收购）为其计算机开发了名为 DECnet 的网络技术。Linux\
  \ 包含了对 DECnet 支持，但你必须有一个程序包才能使用该协议栈。请查看 [`linux-decnet.sourceforge.net`](http://linux-decnet.sourceforge.net)\
  \ 获取更多信息。\n\nLinux 还支持一些更冷门的网络协议，例如 Acorn 的 Econet。在大多数系统中，`TCP`/`IP` 以及可能的其他一两个协议就完全足够了。由于互联网的成功，以前使用专有协议栈的供应商正在将它们的工具转换为使用\
  \ `TCP`/`IP`。例如，尽管 Apple 长期以来使用 AppleTalk，但它的文件共享工具现在既可以在纯 AppleTalk 上运行，也可以通过基于\
  \ `TCP`/`IP` 的变体运行。\n\n### 注意\n\n![注意](img/note.gif)\n\n标准 Linux 内核缺乏对一种常用网络栈 NetBEUI\
  \ 的支持。该栈曾是 Windows 通过 `SMB`/`CIFS` 进行文件共享的默认选择，但 `SMB`/`CIFS` 在 `TCP`/`IP` 上运行同样良好。第\
  \ 3 章更详细地介绍了网络栈及其用法。\n\n## 网络硬件选项\n\n“网络设备支持”菜单包含与网络硬件相关的选项。这些选项中最重要的是针对特定网卡的驱动程序。今天最常见的网卡类型是以太网设备，其他还包括传统的网络硬件、远距离设备和无线设备。PC\
  \ Card 设备（用于笔记本电脑）在“网络设备支持”菜单下有自己的子菜单。你还在此处选择拨号设备（用于通过电话调制解调器和其他某些类型的硬件建立连接）。\n\n\
  大多数这些设备都要求你在“网络设备支持”菜单的顶部选择“网络支持”选项。如果你没有这样做，其他选项将不可用。\n\n### 以太网设备\n\n以太网是 2002\
  \ 年最常见的本地网络硬件类型，并且可能在一段时间内保持这一地位。（稍后讨论的无线技术在某些环境中变得流行，但在速度方面它们落后于以太网和其他几种有线技术。）从操作系统的角度来看，以太网流行的问题在于它催生了成百上千种特定的以太网网卡。\n\
  \n幸运的是，大多数以太网卡使用少数芯片组之一，因此 Linux 只需约 60 个驱动程序就能支持大多数以太网卡。这些驱动程序分布在两个子菜单中：以太网 (10\
  \ 或 100 Mbit) 和以太网 (1000 Mbit)。绝大多数驱动程序出现在第一个菜单中，正如名称所示，它涵盖了 10 和 100Mbps 的设备。\n\
  \n\n\n\n\n除了三种常见的以太网速度外，还有几种不同类型的以太网电缆：同轴电（仅用于某些形式的 10Mbps 以太网）、双绞线（用于某些类型的 10Mbps、所有类型的\
  \ 100Mbps 以及某些形式的千兆以太网）和光纤（用于某些形式的千兆以太网）。双绞线支持设备之间最高 100 米（m）的距离（其中一个是是集线器或交换机），而光纤缆允许设备之间的距离最远达到\
  \ 5 公里（km）。\n\n10 或 100Mbps 驱动程序菜单的组织并不完美。菜单开头列出了来自 3Com、SMC、Racal-Interlan 以及其他几家公司的若干种流行或曾经流行的设备；接着是一组工业标准架构（`ISA`）总线卡；继续是一组扩展\
  \ ISA（`EISA`）、VESA 本地总线（`VLB`）和外围部件接口（`PCI`）卡；最后以并行转以太网适配器的分组结束。由于这种组织方式，你可能需要在两个或三个地方搜索你的网卡。\n\
  \n少数以太网设备并不是通过“网络设备支持”菜单或其子菜单中的驱动程序激活的。具体，PC 卡设备有自己的驱动程序（后文将描述），USB 转以太网适配器在“USB\
  \ 支持”菜单中激活。要使用 USB 设备，你必须激活 USB 支持；根据你的主板使用的控制器类型，需启用 UHCI 支持或 OHCI 支持；以及适当的 USB\
  \ 网络驱动程序选项，例如 `USB ADMtek Pegasus-Based Ethernet Device Support`。\n\n### 备用本地网络设备\n\
  \n尽管以太网非常流行，但并不是本地网络硬件的唯一选择。Linux 内核包含了对其他类型网络的支持，尽管其中任何类型的可用驱动程序都不像以太网那么多。（非以太网网络硬件型号也较少，因此这种有限的驱动程序范围并不意味着对可用硬件的支持较差。）2.4.17\
  \ 内核“网络设备支持”菜单中的可用选项包括：\n\n*   **令牌环 (Token Ring)** —— 从历史角度看，以太网最重要的竞争对手是 IBM 的令牌环。以太网在\
  \ 20 世纪 90 年代获得了发展势头，部分是以牺牲令牌环为代价的。大多数令牌环卡支持 16Mbps 的最高速度，尽管现在已有了 100Mbps 的型号。令牌环站之间的最大距离在\
  \ 150–300 米不等。Linux 支持几款令牌环卡，这些卡位于“网络设备支持”菜单的“令牌环设备”子菜单中。\n\n*   **LocalTalk** ——\
  \ Apple 为其 Macintosh 电脑系列开发了自身的网络技术，包括硬件（LocalTalk）和软件协议（AppleTalk）。曾生产过少量用于将 `x86`\
  \ 系统连接到 LocalTalk 网络的 `x86` 板卡，Linux 通过“AppleTalk 设备”子菜单支持了其中一些设备。（讽刺的是，运行在 Macintosh\
  \ 硬件上的 Linux 并不支持该硬件自身的 LocalTalk 接口。）按 2002 年的标准来看，LocalTalk 非常慢，最高速度仅为 2Mbps。\n\
  \n*   **ARCnet** —— ARCnet 是一种经常用于特殊目的的网络技术，如监控摄像头和科学数据采集系统。这些设备通过同轴电、双绞线或光纤电缆支持从\
  \ 19Kbps 到 10Mbps 的速度。Linux 的 ARCnet 支持通过“ARCnet 设备”子菜单中的项目激活。除了你特定芯片组的驱动程序外，你还需要为特定的\
  \ ARCnet 数据包格式启用驱动程序（`RFC 1051` 或 `RFC 1201`）。\n\n*   **FDDI 和 CDDI** —— 光纤分布式数据接口（FDDI）和铜缆分布式数据接口（CDDI）是两种密切相关的\
  \ 100Mbps 本地网络技术，分别使用光纤和铜线。FDDI 相比 100Mbps 以太网的主要优势是它支持更长的电缆长度——理论上可达 2km，而双绞线以太网仅为\
  \ 100m。不过，使用光纤的千兆以太网支持高达 5 公里的距离。2.4.17 内核包含了对两个 `FDDI/CDDI` 产品的支持，在选择 `FDDI` 驱动程序支持后，均可以在“网络设备支持”菜单中选择。\n\
  \n*   **HIPPI** —— 高性能并行接口（HIPPI）支持 800Kbps 或 1600Kbps 的速度，在双绞铜线上的距离最高达 25 米，在多模光纤上达\
  \ 300 米，在单模光纤上达 10 公里。2.4.17 内核支持一种 `HIPPI` 卡，即 Essential RoadRunner，但该驱动程序被认为是实验性的。\n\
  \n*   **光通道 (Fibre Channel)** —— 这种网络接口支持铜和光纤网络介质，并提供 133–1062Mbps 的速度。在使用光纤电缆时，光通道可以在\
  \ 10km 范围内使用。2.4.17 内核包含了对一种光通道芯片组的支持，即 Interphase 5526 Tachyon。\n\n这些网络介质（如令牌环）通常用于本地网络，通常包含在一个建筑内或一小群建筑内。其他技术（如\
  \ `FDDI` 和 `HIPPI`）更多用于连接跨越远距离计算机集群，例如企业或大学校园内建筑之间。Linux 对这些技术的支持意味着 Linux 可以作为路由器，将使用以太网的本地网络连接到使用更广泛（且速度更快）标准的更广泛网络。\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n在本书中，假设计算机使用以太网。如果一个或多个接口使用其他技术，主要的变化是网络接口的名称。对于以太网，第一个设备是\
  \ `eth0`，第二个是 `eth1`，依此类推。其他设备使用其他名称，例如第一个令牌环设备是 `tr0`，第二个 `FDDI` 设备是 `fddi1`。\n\
  \n### 宽带和 WAN 设备\n\n“宽带”一词通常有两种不同的应用方式。首先，它可能指允许同时传输多种类型信息（如视频、音频和数字数据）的网络技术。其次，它可能指普通拨号电话网络连接的替代方案，允许更高的速度（通常为\
  \ 200Kbps 或更高）。\n\n家庭和小企业客户经常使用宽带技术通过互联网服务提供商（`ISP`）连接互联网，或者偶尔用于连接多个站点。通常，宽带连接将你拥有的计算机连接到整个互联网。这与这里描述的其他网络技术形成对比，后者通常连接一组你拥有或管理的计算机。因此，宽带连接通常要求你符合提供连接的\
  \ `ISP` 的某些要求。例如，许多低端宽带 ISP 不允许运行服务器。\n\n\n\n\n在 2002 年，最流行的宽带形式是数字用户线路（`DSL`）和电缆调制调器。`DSL`\
  \ 有多种类型，例如非对称 `DSL`（`ADSL`）和单线（或对称）`DSL`（`SDSL`），它们通过普通电话线使用高频信号运行。电缆调制调器通过电缆电视网络工作，通过占用一个电视信道的带宽（通常还会预留一些额外的带宽）。通过卫星系统、本地射频传输和光纤传输的宽带在至少某些区域也是可用的。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n有关宽带网络连接的更多信息，请参阅我的著作*Broadband Internet Connections:\
  \ A User's Guide to DSL and Cable》（Addison-Wesley, 2001）。\n\n大多数宽带连接使用外部调制调器，该调制器带有一个用于连接宽带网络的宽带接口和一个用于连接你计算机的以太网端口。因此，你需要一个支持的以太网适配器，并使用标准的\
  \ Linux 驱动配置该适配器。宽带调制调器本身不需要特殊的驱动程序，尽管某些 ISP 要求你使用以太网点对点协议（PPPoE），该协议在 Linux 中通过“网络设备支持”（Network\
  \ Device Support）菜单中的实验性 `PPP` 运行以太网驱动程序实现。（此选项需要你先启用 `PPP` 支持选项，该选项稍后将在“拨号设备”中讨论。）另一个\
  \ PPPoE 选项是使用 Roaring Penguin PPPoE 包，该包可以在 [`www.roaringpenguin.com/pppoe/`](http://www.roaringpenguin.com/pppoe/)\
  \ 获取。\n\n一些宽带调制调器带有 USB 接口而不是以太网接口。`2.4.17` Linux 内核不支持这些设备中的任何一种，尽管 Alcatel 为其\
  \ Speed Touch USB `DSL` 调制调器提供了 Linux 驱动，地址位于 [`www.alcatel.com/consumer/dsl/supuser.htm`](http://www.alcatel.com/consumer/dsl/supuser.htm)。请咨询硬件制造商或访问\
  \ [`www.linux-usb.org`](http://www.linux-usb.org) 获取其他 USB 产品驱动程序的更新信息。\n\n一些宽带调制调器（特别是针对低端\
  \ `ADSL` 账户）以内部 `PCI` 卡的形式出现。与 USB 设备一样，对这些设备的支持很少。`2.4.17` 内核包含了对 General Instruments\
  \ Surfboard 1000 的支持，这是一个旧的单向电缆调制调器。（*单向*意味着它只接收数据；你必须使用传统的电话调制调器来发送数据。单向宽带服务不受理想，而且正变得稀少。）Diamond\
  \ 1MM `DSL` 调制调器的驱动程序可以在 [`www.rodsbooks.com/network/network-dsl.html`](http://www.rodsbooks.com/network/network-dsl.html)\
  \ 获取，但这些驱动程序是对现有以太网驱动程序的未修改，可能在 `2.4.*x` 或更高内核上无法工作。\n\n### 提示\n\n![TIP](img/tip.gif)\n\
  \n如果你的宽带提供商没有给你提供带以太网接口的调制调器选项，自己买一个，并在 eBay（[`www.ebay.com`](http://www.ebay.com)）等拍卖网站卖掉你的\
  \ `ISP` 提供的调制调器。不过，务必购买兼容的调制调器，并且只有当 `ISP` 提供或你必须购买时才卖掉它；不要卖掉 `ISP` 租给你的调制调器！\n\n\
  另一种远距离连接是*广域网（WAN）*。这种技术允许通过专用的远程电路进行连接，通常被称为*租线*（leased lines），因为它们可能是从电话公司租用的普通电话线。（尽管电话公司不在另一端提供信号；由你提供。）此类连接通常使用被称为*WAN\
  \ 路由器*（WAN routers）的外部设备，它们像宽带调制调器一样连接到 Linux 计算机或局域网。另一个选项是使用专用的 `WAN` 接口卡。Linux\
  \ 在“网络设备支持”菜单的“WAN 接口”子菜单包含了对这类设备的支持。与其他许多子菜单一样，你必须选择第一个选项（`WAN` 接口支持），然后选择你打算使用的设备对应的选项。\n\
  \n## 无线设备\n\n从 20 世纪 90 年代后期，无线网络技术迅速流行。这些技术允许计算机在没有物理线缆连接的情况下建立网络。这种安排对于现有的家庭和办公室特别有用，因为在这些地方布传统的有线网络电缆很麻烦，而且对于笔记本计算机和其他便携设备的用户来说，他们可能想或需要在不将计算机插入物理网络的情况下漫游。\n\
  \n遗憾的是，到 2001 年，无线世界与以太网相比仍然存在一些缺点。无线网络比以太网更贵，速度更慢，而且没有那么标准化。2001 年无线技术最重要的标准是 802.11\
  \ 和 802.11b。前者支持 2Mbps 的速度，并回退到 1Mbps。（*回退*是指当信号强度下降时重新协商连接，例如当存在干扰或计算机与另一台相距较远时。）802.11b\
  \ 支持 11Mbps 的速度，回退速度为 5.5Mbps、2Mbps 和 1Mbps。另一种受到大量媒体关注的无线技术是*蓝牙*（Bluetooth），它支持高达\
  \ 1Mbps 的速度。支持蓝牙的打印机、手机等可能会在 2002 年开始大量出货。未来的发展可能会增加可用速度。例如，正在计划开发速度高达 155Mbps 的无线版本\
  \ ATM。\n\n无线局域网通常通过笔记本计算机中的无线 PC 卡实现。这些卡可能相互直接通信，也可能需要使用基站，基站还可以作为连接到传统有线网络或连接到互联网的宽带或传统调制调器的接口。还有无线\
  \ `ISA` 和 `PCI` 卡，使得台式系统可以参与无线网络，或作为漫游设备的基站。PC 卡、`ISA` 卡和 `PCI` 卡都需要 Linux 驱动程序，但基站不需要特殊支持。\n\
  \nLinux 对无线设备的支持显示在“无线局域网（非无线电）”子菜单下。此菜单根据芯片组或网卡列出特定的驱动程序，而不是这些网卡使用的技术（如 802.11b\
  \ 或蓝牙）。除了内核驱动程序，还有两个名为无线扩展（Wireless Extensions）和无线工具（Wireless Tools）的包，可以帮助你在 Linux\
  \ 下管理无线网络。查看 [`www.hpl.hp.com/personal/Jean_Tourrilhes/Linux/Tools.html`](http://www.hpl.hp.com/personal/jean_tourrilhes/linux/tools.html)\
  \ 获取有关这些包的信息，以及有关 Linux 中无线网络信息的额外链接。\n\n\n\n\n大多数笔记本电脑都至少配备一个 `PC Card` 插槽。（许多\
  \ Linux 文档使用其旧名 `PCMCIA` 来指 PC Card 技术，该名称代表标准的制定者“个人电脑内存卡国际协会” `Personal Computer\
  \ Memory Card International Association`。）PC Card 设备可以在计算机运行时插入或拔出，而操作系统对此不作干涉。由于\
  \ Linux 设计时的假设是网络接口不会在没有预警的情况下消失，因此一个独立的软件包 `Card Services` 帮助管理这些事项，它会在 PC Card\
  \ 设备插入或拔出时，整洁地启动和停止与设备相关的内核功能。你可以在 [`pcmcia-cs.sourceforge.net`](http://pcmcia-cs.sourceforge.net)\
  \ 找到更多关于 Card Services 的信息。\n\n2.4.17 内核在“PCMCIA 网络设备支持”子菜单中包含了对许多 PC Card 网络设备的支持。某些无线网卡的驱动程序出现在“无线局域网（非哈姆无线电）”子菜单中。当你选择并配置此类网卡时，它的功能非常类似于标准的\
  \ `ISA` 或 `PCI` 卡。例如，以太网 PC Card 显示为 `eth0`，并使用标准工具进行配置，如第 2 章所示。\n\n`2.4.x` 系列之前的内核需要单独的驱动软件包才能使用\
  \ PC Card 设备，事实上，许多 PC Card 设备在标准内核中仍不受支持。因此，你可能需要此软件包，它是 Card Services 集合的一部分。如果你使用\
  \ `2.4.x` 或更版本的内核，可能不需要为 PC Card 网络设备使用特殊驱动，但你可能对调制解调器、SCSI 主机适配器或其他设备需要。\n\n##\
  \ 拨号设备\n\n最后一类网络设备是拨号设备。最常见的是使用传统的电话调制解调器，配合点对点协议（`PPP`）通过 `ISP` 建立与互联网的连接。此类连接通过命令行或\
  \ `GUI` 工具建立，如第 2 章所示。不过，除了这些工具外，Linux 内核还需要对拨号连接的支持。\n\n要激活此支持，你必须在“网络设备支持”菜单中选择\
  \ `PPP`（点对点协议）支持选项。当你选择此选项时，会出现几个子选项，例如异步串口端口的 `PPP` 支持和 `PPP` Deflate 压缩。这些选项通常不是严格必要的，但有时可以改进连接，例如通过自动压缩文本等高压缩数据来获得更高的网络吞吐量。如果你打算使用内核的\
  \ PPPoE 功能用于某些 `DSL` 连接，则需要实验性的 `PPP` over Ethernet（基于以太网的 PPP）选项，但对于某些额外的 PPPoE\
  \ 软件包（如 Roaring Penguin），此选项并非必须的。\n\n`PPP` 有时也用于不涉及调制解调器的连接。例如，你可以利用它通过串口将两台计算机连接到网络。对于桌面系统来说，这种配置很少有价值，因为以太网卡价格便宜且能提供快得多的连接。不过，当你将桌面系统连接到掌上电脑，或者在不想麻烦安装网卡的情况下进行临时连接时，你可能想使用这种链路。\n\
  \nLinux 支持的拨号连接并不只有 `PPP` 一种。内核包含了对旧版“串口互联网协议 (SLIP)”的支持，其功能与 `PPP` 类似。`SLIP` 已被\
  \ ISP 很大程度上抛弃，因此你不太需要在调制解调器上使用它。不过，少数 Linux 工具在本地使用它；例如，某些类型的“按需拨号”实用程序（当检测到网络活动时拨拨号\
  \ `PPP` 连接）使用 `SLIP` 来检测传出的连接尝试。\n\n另一个与 `PPP` 和 `SLIP` 类似的协议是“并行线互联网协议 (PLIP)”。正如从名称中猜的那样，该协议允许你通过并行（打印机）端口连接两台\
  \ Linux 计算机。由于这些端口远快于 RS-232 串口，`PLIP` 在双机本地网络中提供了比 `PPP` 或 `SLIP` 的速度优势。尽管以太网仍然更快。要使用\
  \ `PLIP`，你必须在“网络设备支持”菜单中选择 `PLIP`（并行端口）支持选项。为了做到这一点，你必须首先在同名的菜单中激活“并行端口支持”选项，包括\
  \ PC 风格硬件选项（如果你使用的是 `x`86 计算机）。如果你需要使用 `PLIP` 网络，应该查阅 `PLIP` Mini-HOWTO ([`www.linuxdoc.org/HOWTO/mini/PLIP.html`](http://www.linuxdoc.org/howto/mini/plip.html))\
  \ 以获取更多细节，包括在找不到 Turbo Laplink 线时的所需电缆接线方法。\n\n# 编译与安装内核\n\n前面的讨论涵盖了你在配置内核以使用网络上的协议以及连接计算机到该网络的硬件时会遇到最重要的选项。然而，编译内核的过程是另一回事，严格来说这并不是一项网络任务。尽管如此，如果你需要重新编译内核以添加或删除对特定网络功能的支持，这项任务是非常重要的，因此本节提供了涉及某些决策和程序的概述。\n\
  \n### 警告\n\n![警告](img/warning.gif)\n\n不要只调整本章之前描述的选项就编译内核。尽管它们超出了本书范围，但与 EIDE 控制器、SCSI\
  \ 主机适配器和磁盘文件系统相关的内核选项对于 Linux 计算机的运行至关重要。如果你错误地配置了这些功能，你的计算机可能无法启动，或者性能低于标准（例如，磁盘速度极慢）。这些选项在\
  \ [`www.linuxdoc.org/HOWTO/Kernel-HOWTO.html`](http://www.linuxdoc.org/howto/kernel-howto.html)（以及许多其他地方）的许多通用\
  \ Linux 书中都有讨论。\n\n## 驱动程序：模块或内置\n\n\n\n\n前面的讨论多次提到启用或禁用特定的内核功能，例如用于你特定以太网适配器的驱动程序。但如果你检查图\
  \ 1.1，你会发现许多选项可以被设置为两个以上的值。考虑一下图 1.1 中的 Packet Socket 选项。该选项可以设置为三个值之一：`Y`、`M` 或\
  \ `N`。正如你所预期的那样，`Y` 和 `N` 值分别代表 `yes` 和 `no`，意味着代码被直接编译到主内核文件中，或者完全不编译。`M` 选项介于这两个极端之间。如果你选择\
  \ `M`，该功能将被编译，但它不会链接到主内核文件中；相反，该代码将以内核模块的形式存在，可以根据需要加载和卸载。作为其他选项的子选项（例如图 1.1 中的\
  \ Packet Socket: Mmapped IO），通常缺少 `M` 选项，因为它们根据父选项的设置被编译进内核或作为模块。因此，对此类选项选择 `Y`\
  \ 可能会将其置于内核或模块中。\n\n编译进内核的功能始终可用，并且在启动过程的早期即可使用。该功能没有可能因为被卸载而变得失效。某些功能*必须*以这种方式编译，否则将无法使用。例如，用于根目录的文件系统必须在启动时在内核中可用，因此必须直接编译到内核中。如果你使用了之前提到的\
  \ <acronym class=\"acronym\">NFS</acronym>根文件系统选项，你需要将对你网络硬件的支持编译到内核中。\n\n将功能直接编译到内核的缺点是它会一直消耗\
  \ RAM。它还会增加磁盘上内核的大小，可能会使某些启动 Linux 方法变得复杂。由于这些原因，Linux 发行版提供了大多数可以通过这种方式编译为模块的选项。这允许发行版维护者保持默认内核的可管理性，同时提供对广泛硬件的支持。由于大多数网络硬件都可以编译为模块，大多数发行版都通过这种方式编译网卡驱动程序。\n\
  \n然而，作为维护特定 Linux 计算机的人，你可能会决定采取不同的做法。如果你将网卡驱动程序直接编译到内核中，你就不需要在尝试启动网络之前配置系统来加载模块。（事实上，大多数发行版都预先配置好以正确处理此任务，所以这很少是一个问题。）另一方面，如果你维护各种\
  \ Linux 系统，你可能想创建一个内核和一组内核模块并将其安装到所有计算机上，在这种情况下，你可能希望将网络驱动程序编译为模块。\n\n网络栈等功能也可以编译为模块或直接编译到内核。（<acronym\
  \ class=\"acronym\">TCP</acronym>/<acronym class=\"acronym\">IP</acronym> 是一个例外；它必须直接编译到内核中或完全不编译，尽管它的几个子选项可以编译为模块。）如果计算机只是偶尔挂载远程\
  \ <acronym class=\"acronym\">NFS</acronym> 导出，你可能会决定将 <acronym class=\"acronym\"\
  >NFS</acronym> 客户端支持编译为模块。这样做在 <acronym class=\"acronym\">NFS</acronym> 不使用时将节省少量\
  \ RAM，但代价是增加问题的概率，并在挂载 <acronym class=\"acronym\">NFS</acronym> 导出时产生极小的延迟。\n\n\
  正如你所观察到的，关于是将功能或驱动程序直接编译到内核还是作为模块，并没有单一的正确答案，除非确实不支持模块化编译。作为一条通用法则，我建议你考虑该功能使用的频率。如果它会被频繁使用，则将该功能作为内核的一部分编译；如果它只会被部分使用，则将该功能编译为模块。如果你的内核变得大到无法使用\
  \ `LOADLIN`（一种用于启动 Linux 的 DOS 实用）启动，你可能希望采用模块化编译，因为这是某些紧急情况下启动 Linux 的一种重要方式。\n\
  \n## 典型的内核编译\n\n在你使用 `make xconfig` 或其他配置命令配置内核后，你必须执行四个命令来编译内核并安装内核模块：\n\n```bash\n\
  \ # make dep\n## make bzImage\n## make modules\n## make modules_install\n```\n\n\
  这些命令中的第一个执行了一些清理任务。具体来说，`dep` 是 *dependency*（依赖）的缩写——`make dep` 根据你选择的选项确定哪些源代码文件依赖其他文件。如果你跳过这一步，编译可能会出错，因为你添加或省略了某些功能，这需要调整你已有功能的依赖关系信息。\n\
  \n第二个命令构建主内核文件，该文件将位于 `/usr/src/linux/arch/i86/boot` 目录下，名为 `bzImage`。该命令有变体。例如，对于特别小的内核，`make\
  \ zImage` 同样有效（`bzImage` 格式允许 LILO 等启动加载程序处理比 `zImage` 格式更大的内核）。`zImage` 和 `bzImage`\
  \ 都是内核的压缩形式。这是 x86 系统的标准，但在某些非 x86 平台上，你应该使用 `make vmlinux`。该命令创建一个未压缩的内核。（在非 x86\
  \ 平台上，构建内核的目录将使用除 i86 以外的名称，例如用于 PowerPC 系统的 ppc。）\n\n正如你可能猜到的那样，`make modules`\
  \ 命令编译内核模块。`make modules_install` 命令将这些模块文件复制到 `/lib/modules` 中的相应位置。具体来说，会创建一个以内核版本号命名的子目录，并在其中包含特定驱动程序的子目录。\n\
  \n### NOTE\n\n![NOTE](img/note.gif)\n\n你可以作为普通用户运行 `make dep`、`make bzImage`（或等命令）以及\
  \ `make modules` 命令，前提是用户对所有内核源代码目录具有完全的读写权限。但你*必须*以 `root` 身份运行 `make modules_install`。\n\
  \n只要你正确配置了内核，整个内核编译过程通常会顺利进行，但偶尔会出现错误。常见问题包括以下：\n\n\n\n\n\n## 存在 Bug 或不兼容的代码\n\n\
  有时，你会发现驱动程序存在 Bug 或与其他功能不兼容。这种情况在你尝试使用开发内核或你添加到内核的非标准驱动程序时最为常见。通常症状是编译失败并显示一个或多个错误信息。解决方法是升级内核，或者至少升级受影响的驱动程序；如果你确实不需要该功能，也可以完全省略它。\n\
  \n## 未满足的依赖\n\n如果一个驱动程序依赖于另一个驱动程序，那么只有在选择了第二个驱动程序后，第一个驱动程序才是可选的。但有时配置脚本会忽略此类细节，导致你配置出一个无法的系统。最常见的症状是各个模块可以编译，但它们无法组合成一个完整的内核文件。（如果驱动程序被编译为模块，当你尝试加载它时可能会返回错误信息。）运气的话，错误信息会给你关于需要添加什么来获得工作内核的线索。有时，输入\
  \ `make dep` 然后重新编译可以解决问题。偶尔，将功能作为模块而不是直接编译进内核（或反之）可以克服此类问题。\n\n## 旧的对象文件\n\n如果你编译了内核，然后更改配置并再次编译，负责该过程的\
  \ `make` 工具应该检测到哪些文件可能受到你更改的影响并重新编译它们。尽管如此，有时工作并不正常，导致无法构建完整的内核，或者在编译单个文件时失败。输入\
  \ `make clean` 可以清除预先的对象文件（单个源文件的编译版本），从而解决此问题。\n\n## 编译器错误\n\nGNU C 编译器 (`GCC`)\
  \ 通常是可靠的，但确实出现过它导致问题的情况。Red Hat 7.0 自带的 `GCC` 版本无法编译 2.2.*x* 内核，但这个问题在 2.4.*x* 内核系列中得到了解决。（Red\
  \ Hat 7.0 实际上配备了两个版本的 `GCC`；编译内核时，你必须使用 `kgcc` 程序而不是 `gcc`。）\n\n## 硬件问题\n\n`GCC`\
  \ 对计算机硬件的压力比许多程序大，因此内核编译有时会暴露硬件问题。这些问题通常表现为 `signal 11` 错误，之所以这样命名是因为这是 `GCC`的错误信息。缺陷或过热的\
  \ CPU 以及糟糕的内存是这些问题的两个常见来源。[http://www.bitwizard.nl/sig11/] 对此问题提供了更多信息。\n\n如果你无法自己解决内核编译问题，请尝试向\
  \ Linux 新闻组发布查询，例如 `comp.os.linux.misc`。务必包含你的发行版信息以及你正在尝试的内核版本。\n\n## 安装和使用内核\n\
  \n一旦你构建了新内核，就需要安装它。如前所述，内核通常位于 `/boot` 中。你可能会将其重命名为指示其版本的名称，例如 `bzImage-2.4.17`。许多发行版将内核内核为\
  \ `vmlinuz`。\n\n要安装新内核，请遵循以下步骤：\n\n1. 用文本编辑器加载 `/etc/lilo.conf`。\n2. 修改 `image=`\
  \ 行指向你的内核文件。例如，将其从 `/boot/vmlinuz` 改为 `/boot/bzImage-2.4.17`。\n3. 将 `label=` 行更改为唯一的名称，例如\
  \ `mykernel` 或 `2417`，以便你可以在启动时将其区分开。\n4. 保存你的更改。\n5. 输入 `lilo` 在你的硬盘上安装修改后的加载程序。\n\
  \n下次你启动计算机时，LILO 应该会为你提供启动旧内核或新内核的选项。取决于它的配置方式，你可能会在菜单中看到你在第 4 步中输入的名称，或者你可能可以在\
  \ `lilo:` 提示符处输入它。\n\n如果你可以启动计算机并对新内核的功能表示满意，可以通过修改 `/etc/lilo.conf` 中的 `default=`\
  \ 行将其设置为默认内核。更改等号后的文本以指定你在第 4 步中为新内核指定的标签，然后在命令行提示符处再次输入 `lilo`。\n\n### 警告\n\n之前的指令假设你的\
  \ `/etc/lilo.conf` 文件是有效的。如果它不是，执行第 6 步可能会损坏硬盘上的数据。此外，请务必不要修改或删除文件中的任何其他条目。\n\n\
  ### 注意\n\n除了 LILO 之外，还有启动 Linux 内核的方法。某些发行版使用统一引导加载程序 (`GRUB`) 代替 LILO。请查阅 `GRUB`\
  \ 文档获取如何配置它的细节。你也可以使用 DOS 程序 `LOADLIN` 来启动 Linux。要做到这一点，你需要将内核的副本放在一个 DOS 可访问的磁盘上——DOS\
  \ 分区或软盘。然后你可以通过输入类似下面的命令来启动 Linux：\n\n```\nC:> LOADLIN BZIMAGE root=/dev/sda6 ro\n\
  ```\n\n\n\n\n在本示例中，`BZIMAGE` 是从 DOS 访问的内核文件名，而 `/dev/sda6` 是根分区的 Linux 标识符。`ro`\
  \ 选项指定内核最初以只读方式挂载此分区，这是标准做法（Linux 稍后会将其重新挂载为可读写访问）。如果你不想最初调整 LILO 设置，`LOADLIN` 可以作为一个测试新内核的有用工具。如果\
  \ LILO 损坏，它也是在紧急情况下启动 Linux 的良好方法。如果你没有 DOS 副本，FreeDOS ([`www.freedos.org`](http://www.freedos.org))\
  \ 是一个可以胜任工作的开源版本。`LOADLIN` 包含在大多数 Linux 发行版的安装光盘介质中，通常位于名为 `dosutils` 或类似的目录中。\n\
  \n## 总结\n\nLinux 内核是 Linux 计算机所有输入输出的核心，包括网络数据传输。因此，对于任何联网的 Linux 计算机，在内核中选择适当选项至关重要。通过包含你可能不会包含的选项，或省略不必要的内存浪费选项，你可以针对特定任务优化内核。大多数网络选项都属于两个内核配置菜单：网络选项（Networking\
  \ Options）和网络设备支持（Network Device Support）。这两个菜单包含许多选项和若干子菜单。一旦你选择了所需的选项，必须通过输入几个命令来编译\
  \ Linux 内核。然后你可以通过重新配置 LILO 提供使用新内核的选项来安装内核。\n\n# 第 2 章 TCP/IP 网络配置\n\n尽管 Linux\
  \ 内核是任何 Linux 系统的核心并控制所有网络访问，但配置 Linux 计算机使用网络不仅涉及内核。本章涵盖了三种流行的网络连接方法：动态主机配置协议 (`DHCP`)、静态\
  \ `IP` 地址和点对点协议 (`PPP`)。`DHCP` 和 `PPP` 被用于在不同的语境下自动分配 `IP` 地址并设置其他配置信息。相比之下，静态 `IP`\
  \ 地址要求你手动设置细节。在这些种情况下，如果你想让系统正常工作，都必须熟悉一些工具。在使用这些任何网络配置方法之前，你必须加载适当的网络驱动程序。因此，本主题是本章的开始。\n\
  \n## 加载网络驱动程序\n\n配置网卡的第一步是加载适当驱动程序。如第 1 章，“内核网络配置”所述，驱动程序可能以两种形式存在于你的系统中：作为 Linux\
  \ 内核的组成部分或作为独立的内核模块文件。在第一情况下，加载网络驱动程序的任务是简单的，因为它在内核加载时就会完成。然而，对于某些网卡，你可能需要通过内核启动选项向驱动程序传递参数。如果你使用\
  \ LILO，可以通过 `/etc/lilo.conf` 中的 `append` 选项传递这些参数。例如，以下 `/etc/lilo.conf` 行作为内核定义的一部分，告诉内核在\
  \ I/O 端口 `0x240` 查找 `eth0` 设备（第一块以太网卡）：\n\n```\n append=\"ether=0,0,0x240,eth0\"\
  \n```\n\n你可以通过空格分隔在 `append=` 后的引号内包含多个选项。你可以通过识别特定卡所使用的 I/O 端口，利用此技巧强制特定的以太网卡连接到多接口系统上的特定网卡上。在大多数情况下，你不需要为构建在内核中的驱动程序传递任何选项；驱动程序应该检测到网卡并在无需进一步干预的情况下使其可用，尽管你仍然需要以其他方式激活它。\n\
  \n如果你的网卡驱动程序被编译为模块，你可以通过 `/etc/modules.conf` 文件（在某些较旧的发行版中称为 `/etc/conf.modules`）向它们传递参数。例如，此文件可能包含如下行：\n\
  \n```\n alias eth0 ne\noptions ne io=0x240\n```\n\n这两行告诉系统为 `eth0` 使用 `ne` 驱动模块，并在\
  \ I/O 端口 `0x240` 查找板。在大多数情况下，此类配置是不必要的，但在某些情况下你可能需要显式地建立这种链接。当你的系统具有多个网络接口时尤其如此。许多发行版提供的\
  \ `GUI` 配置工具可以帮助自动化此过程；你只需要从列表中选择特定型号的或驱动，`GUI` 工具就会创建适当的 `/etc/modules.conf` 条目。\n\
  \n当你在 `/etc/modules.conf` 中创建条目后，Linux 每当检测到尝试启动网络接口就会尝试自动加载网络驱动程序。如果由于任何原因你需要手动执行此操作，可以使用\
  \ `insmod` 命令来完成：\n\n```\n # insmod ne\n```\n\n此命令将加载 `ne` 模块，使其可供。如果内核模块自动加载工作不可靠，可以通过将此类命令放在启动脚本（如\
  \ `/etc/rc.d/rc.local` 或 `/etc/rc.d/boot.local`）中强制执行。\n\n如果你的连接使用 `PPP`、`SLIP`\
  \ 或其他软件协议通过串行、并行或其他传统的网络端口进行通信，你必须加载端口本身以及相关软件协议的驱动程序。你以加载网卡驱动程序相同的方法执行——将代码构建到内核文件中，或将其放在模块中并加载模块。在大多数情况下，你需要处理至少两个驱动程序：一个用于底层硬件，另一个用于网络协议。有时这些中的一个或两者都需要额外的驱动程序。例如，USB\
  \ 调制调器可能需要你加载二三个驱动程序。\n\n## 使用 DHCP 客户端\n\n如果你的本地网络有一个 `DHCP` 服务器，你可以使用 `DHCP` 客户端配置\
  \ Linux 自动从该服务器获取 `IP` 地址。该客户端会在本地网段上发送广播消息以搜索 `DHCP` 服务器。如果 `DHCP` 服务器有响应，并且随后的协商成功，结果应该是一个具有\
  \ `IP` 地址和关联信息、已完全配置好使用连接的系统。\n\n### 注意\n\n![注意](img/note.gif)\n\n如果你想让你的计算机作为 `DHCP`\
  \ 服务器以便向其他系统提供 `IP` 地址，请参阅第 5 章，“通过 DHCP 配置其他计算机”。你需要用静态 `IP` 地址配置 `DHCP` 服务器。\n\
  \n\n\n\n\n大多数 Linux 发行版在安装期间都提供使用 `DHCP` 的选项。在配置网络设置时，您应该能够选择 `DHCP` 选项。如果没有，或者您在安装后需要重新配置计算机，启用此功能的简单方法通常是使用\
  \ `GUI` 配置工具，例如 `Linuxconf`（Red Hat 或 Mandrake）、`COAS`（Caldera）或 `YaST` 或 `YaST2`（SuSE）。例如图\
  \ 2.1 了设置此选项的 `YaST2` 配置界面。点击“自动地址设置（通过 `DHCP`）”，系统将通过 `DHCP` 获取其 `IP` 地址。\n\n![GUI\
  \ 配置工具可以轻松启用 DHCP 客户端操作。](img/02fig01.jpg)\n\n**图 2.1. GUI 配置工具可以轻松启用 DHCP 客户端操作。**\n\
  \n遗憾的是，`DHCP` 配置并不总是这么简单。潜在的问题包括：\n\n*   **不兼容的 DHCP 客户端** — Linux 系统上常见的 `DHCP`\
  \ 客户端有四个：`pump`、`dhclient`、`dhcpxd` 和 `dhcpcd`不要将后两者与 `DHCP` 服务器 `dhcpd` 混淆）。尽管这四种在许多网络上都能正常工作，但某些网络使用的\
  \ `DHCP` 服务器与某些 Linux `DHCP` 客户端不兼容。因此，您可能需要将 `DHCP` 客户端包替换为另一个。\n\n*   **不兼容的 DHCP\
  \ 选项** — `DHCP` 客户端选项有时会导致问题。在实践中，这种情况很难与不兼容的 `DHCP` 客户端区分，但解决方案是：您可以编辑 `DHCP` 启动脚本来更改其选项。遗憾的是，您需要足够您的\
  \ `DHCP` 客户端，以便知道编辑哪些选项。阅读帮助页（man page）可能会为您提供一些思路。\n\n*   **多网卡配置** — 如果您的计算机有两个或多个网络接口卡（NIC），您可能需要让\
  \ `DHCP` 客户端仅为某些网卡获取 `IP` 地址，或者忽略某些网卡的某些信息（例如网关地址，稍后将在“调整路由表”中详细描述）。同样，可能需要编辑 `DHCP`\
  \ 客户端启动脚本，或者您可能需要创建一个自定义脚本来事后修正自动配置。\n\n为了帮助您进行调整，表 2.1 展示了每种流行 Linux 发行版的默认 `DHCP`\
  \ 客户端包、备用 `DHCP` 客户端包、`DHCP` 启动脚本的位置以及密切相关的配置文件的位置。（Debian 的 `ifup` 工具与其他发行版中同名的工具不同，它是一个二进制程序，其中硬编码了\
  \ `DHCP` 客户端包命令，这可能导致修改这些命令变得棘手。可以通过 `/etc/network/interfaces` 配置文件进行一些有限的控制。）即使您的发行版没有正式支持您偏好的\
  \ `DHCP` 客户端，您也可以安装并使用它。在最坏的情况下，您需要修改表 2.1 中指定的 `DHCP` 客户端启动脚本，或者通过修改某些启动脚本创建自定义的\
  \ `DHCP` 客户端启动程序（具体修改哪个脚本部分取决于您的发行版，部分取决于个人偏好）。\n\n**表 2.1. 七种流行 Linux 发行版的 DHCP\
  \ 客户端信息**\n\n| 发行版 | 默认 DHCP 客户端 | 备用 DHCP 客户端 | DHCP 启动脚本 | 额外配置 |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| Caldera Open | `dhclient` | 无 | `/etc/sysconfig/network/ifcfg-eth0`\
  \ | |\n| Debian GNU/Linux | `pump` | `dhcpcd` | `/etc/network/interfaces` | |\n\
  | Mandrake | `dhcpcd` | `dhcpxd` | `/sbin/ifup` | `/etc/sysconfig/network/ifcfg-eth0`\
  \ |\n| Red Hat Linux | `pump` | `dhcpcd` | `/sbin/ifup` | `/etc/sysconfig/network/ifcfg-eth0`\
  \ |\n| Slackware | `dhcpcd` | 无 | `/etc/rc.inet` | |\n| SuSE | `dhcpcd` | `dhclient`\
  \ | `/etc/init.d/dhclient` | `/etc/rc.config` |\n| TurboLinux | `dhclient` | 无 |\
  \ `/sbin/ifup` | `/etc/sysconfig/network/ifcfg-eth0` |\n\n如果您怀疑是因为 `DHCP` 客户端选项与您网络\
  \ `DHCP` 服务器的选项不兼容而导致问题，可以尝试编辑表 2.1 中列出的 `DHCP` 启动脚本。寻找调用 `DHCP` 客户端程序的行并检查其选项，使用\
  \ `DHCP` 客户端程序的帮助页作为参考。您可能需要添加或删除选项以获得您所需的行为。例如，某些 `DHCP` 服务器要求客户端发送主机名，因此您可能需要为\
  \ `dhcpcd` 添加类似 `-h` `hostname` 的选项。有时这些脚本依赖于其他配置文件中设置的值，如表 2.1 的“额外配置”列所示。\n\n\
  ## 配置静态 IP 地址\n\n虽然 `DHCP` 是许多网络中常用的配置方法，但它并非无处不在。通过 `DHCP` 配置某些系统（如 `DHCP` 服务器）很困难，而且某些网络缺少\
  \ `DHCP` 服务器。在这些情况下，您需要手动配置计算机的 `IP` 地址。本节介绍了如何进行操作，从执行一次性任务的工具开始。使您的更改永久”章节描述了如何配置系统以便在每次重启时自动使用您的设置。\n\
  \n\n\n\n\n### 注意\n\n![NOTE](img/note.gif)\n\n传统上，服务器计算机使用静态 `IP` 地址分配，因为这可以确保计算机的\
  \ `IP` 地址不会改变。这一事实对于通过 `DNS` 服务器将主机（如 `mail.threeroomco.com`）映射到 `IP` 地址（如 172.23.45.67）非常重要，正如第\
  \ 18 章中描述的。然而，正如第 5 章所示，也可以通过 `DHCP` 反复地为计算机分配相同的地址。此外，`动态 DNS`（dynamic DNS）服务允许将主机映射到动态\
  \ `IP` 地址。\n\n## 配置网络接口\n\n如本章稍些所述，加载驱动程序是使网络接口可用的第一步。要使用该接口，你必须为其分配 `IP` 地址和相关信息，例如其网络掩码（也称为子网掩码或网络掩码）。这项工作由\
  \ `ifconfig` 实用程序处理，取决于如何调用它，它可以显示接口信息或更改其配置。\n\n### 基础 `ifconfig` 语法和用法\n\n`ifconfig`\
  \ 实用程序的语法简单得具有骗性：\n\n```\nifconfig [interface] [options]\n```\n\n该程序的行为取决于给定的参数。从宏层面上，`ifconfig`\
  \ 可以执行几种不同的操作：\n\n* 如果不带任何参数使用，`ifconfig` 会返回所有当前活动网络接口的状态。在这种情况下，`ifconfig` 是一个非常有用的诊断工具。\n\
  \n* 如果给出单个接口名称（如 `eth0` 或 `tr1`），`ifconfig` 将仅返回该接口的信息。同样，这是一个非常有用的诊断工具。\n\n* 如果除了接口名称外还提供了选项，`ifconfig`\
  \ 将根据选项的规范修改接口的操作。最常见的情况是激活或禁用接口。\n\n如果你正在使用 `ifconfig` 配置接口，你最关心的将是可以传递给该实用程序的选项。该实用程序的帮助页（man\
  \ page）提供了选项的完整列表，但最重要的是以下：\n\n* `up` `address`—。此选项激活接口并将指定的 `IP` 地址与新接口关联。如果命令没有包含\
  \ `netmask` 选项（稍后描述），`ifconfig` 将根据地址分类分配网络掩码，如表 2.2 所示。在许多情况下，你实际上可以省略 `up` 关键字；如果你提供了接口名称和\
  \ `IP` 地址，`ifconfig` 会假设如此。\n\n* `down`—。此选项是 `up` 的相反操作，用于关闭接口。\n\n* `netmask`\
  \ `nm`—。此选项设置接口的网络掩码，它决定了 `IP` 地址的哪些位对应网络地址，哪些位识别网络上的特定计算机。如果省略了此选项，`ifconfig` 将网络掩码设置为默认值，如表\
  \ 2.2 所示。你也可以在 `up` `address` 选项中以网络地址位数的的形式提供网络掩码，稍后描述。\n\n* `[-]promisc`—。通常情况下，网卡只接受指向自身或指向其网络网段内所有系统的数据包。此选项启用（`promisc`）或禁用（`-promisc`）混杂模式，在该模式下，网卡会读取通过本地网络网段的所有数据包。混杂模式对于作为网络诊断工具的数据包嗅探器是必要的。（黑客使用使用包嗅探器来获取未加密传输的密码。）某些程序可以自己开启混杂模式。默认是以非混杂模式启动接口。\n\
  \n**表 2.2. 传统的 TCP/IP 类及其网络掩码**\n\n| 类 | 地址范围 | 私有地址范围 | 网络掩码 |\n| --- | --- | ---\
  \ | --- |\n| A 类 | 1.0.0.0–127.255.255.255 | 10.0.0.0–10.255.255.255 | 255.0.0.0\
  \ |\n| B 类 | 128.0.0.0–191.255.255.255 | 172.16.0.0–172.31.255.255 | 255.255.0 |\n\
  | C 类 | 192.0.0.0–223.255.255.255 | 192.168.0.0–192.168.255.255 | 255.255.255 |\n\
  \n* `mtu` `n`—。此选项设置接口的最大传输单元（MTU），即数据包的最大位大小。对于以太网，MTU 通常为 1500，但你可以根据喜好将其设置为其他值。（某些路由器和协议使用较小的\
  \ MTU，如果你的 MTU 设置得过高，可能会降低性能。）\n\n* `add` `address/prefixlength`—。此选项相当于 `up` 和\
  \ `netmask` 的等价，但适用于下一代标准 IPv6。\n\n* `del` `address/prefixlength`—。此选项是 `add` 的相反操作，用于从接口中删除地址。\n\
  \n* `media` `type`—。某些网卡包含两个或多个连接器（例如 10Base-2 和 10Base-T）。你可以通过此选项指定要使用的连接器，如 `media\
  \ 10baseT`。请咨询驱动程序以以接受哪些类型值。\n\n* `hw` `class address`—。此选项允许你控制网卡的硬件地址。如果你更换了网卡以继续从\
  \ DHCP 服务器接收相同的 IP 地址，你可能需要更改此。此外，制造商偶尔会疏忽，出货大量具有相同硬件地址的网卡，如果你尝试在单个网络上使用多块网卡，可能会造成混乱。此选项需要两个子选项：网络设备类型（例如以太网的\
  \ `ether` 或 ARCnet 的 `ARCnet`）和硬件地址。此功能适用于许多但并非所有的网卡。\n\n* `txqueulen` `length`—。此选项设置发送队列的长度，即接口尝试组合在一起的数据包数量。以太网设备的默认值为\
  \ 100，通常良好。在慢连接上设置较小的发送队列长度可以提高交互性能（例如对于 Telnet 或 SSH 会话）。\n\n\n\n\n子掩码（netmask）规定了\
  \ `IP` 地址的哪些部分对应网络地址，哪些部分标识特定的计算机。计算机在确定如何对传出数据包时会使用此信息，因此设置错误可能会导致某些计算机无法访问。当转换为二进制时，子掩码由一系列二进制\
  \ `1` 值后跟一系列二进制 `0` 值组成。例如，`255.255.255.0` 是 24 个 `1` 值后跟 8 个 `0` 值。`IP` 地址和子掩码的简写表示法是在\
  \ `IP` 地址后紧跟一个斜杠（`/`）以及地址中网络部分的位数。例如，`172.23.45.67/24` 等同于子掩码为 `255.255.255.0` 的\
  \ `172.23.45.67`。你可以将这种表示法作为 `ifconfig` 命令中 `up` `address` 选项的一部分，而不是指定指定的 `netmask`\
  \ `nm` 选项。\n\n## IP 地址分类\n\n这些示例展示了如何在私有地址范围内激活网络接口，如 表 2.2 所示。私有地址保留用于私有网络；没有互联网站点使用这些地址。为了避免意外使用他人的\
  \ `IP` 地址，我在本书的整个示例中也使用了这些私有地址。我在示例中按预期用途使用了 `192.168.*x.x` 地址，但我将 `172.16.0.0–172.31.255.255`\
  \ 和 `10.*x.x.x` 范围内的地址视作可路由的互联网地址来使用。\n\n除了 表 2.2 所示的 A–C 类外，还存在 D 类和 E 类。D 类用于组播（`multicasts`，发往多个主机的流量），E\
  \ 类留留供以后使用。\n\n尽管 `IP` 地址子掩码传统上是如 表 2.2 所示分配的，但在 20 世纪 90 年及以后，偏离这些标准变得越来越常见。这是因为初始分配方案拥有太多巨大的\
  \ A 类网络，而 C 类网络太少。对 表 2.2 所示子掩码的偏离依赖`无类域间路由 (CIDR)`，它允许为 `IP` 地址范围任意分配子掩码。例如，一个\
  \ `ISP` 可能会请求几个 C 类网络，并获得传统上属于 A 类网络的地址，如 `10.34.56.0/24` 和 `10.34.57.0/24`。通过划分这些网络，现有的\
  \ `IP` 地址范围得到了比严格遵守 A–C 类分类所能实现的进一步扩展。缺点是，输入 `IP` 地址信息的人必须小心指定这些地址的子掩码。如果你让 `ifconfig`\
  \ 自动设置例如 `10.34.56.78` 的子掩码，则子掩码将被设置为 `255.0.0.0`，这是错误的。根据其分配方法，该子掩码应该是 `255.255.255.0`。\n\
  \n## 配置多个网络接口\n\n如果计算机有多个网络接口，你必须为每个接口执行一次 `ifconfig` 命令。例如，你可能会执行以下两个命令：\n\n```bash\n\
  \ # ifconfig eth0 up 192.168.1.1\n## ifconfig eth1 up 172.23.45.67/24\n```\n\n这些命令在\
  \ `192.168.1.1` 地址上（假设用于本地私有网络）配置了 `eth0`，并在 `172.23.45.67` 上配置 `eth1`，使用子掩码 `255.255.255.0`。两个接口随后都将正常工作。然而，计算机如何知道向哪个接口发送给定的网络包呢？例如，假设一个程序尝试联系\
  \ `10.9.8.7` 计算机。Linux 应该通过哪个接口发送此数据包？回答这个问题是`路由表`的任务。事实上，正如稍后描述的，即使对于单接口计算机，这个问题也是重要的。\n\
  \n### 调整路由表\n\n路由表以两种方式引导流量。首先，它告诉 Linux 通过哪个接口发送流量。这在单接口计算机上似乎是显而易见的，但 Linux 支持一种名为\
  \ `localhost` 或 `loopback` 的特殊虚拟虚拟接口。该接口使用 `127.0.0.0/8` 网络，但通常只使用一个 `IP` 地址进行地址：`127.0.0.1`。由于此接口存在于所有计算机上，当程序需要使用网络协议与其他本地程序建立接口时，可以使用它。它也比使用计算机的常规网络接口更快。必须存在规则来将流量正确引导到回环接口或物理接口（如果计算机有多个物理接口，则指向`特定的`物理接口）。路由表的第二个工作是引导目标指向本地网络其他计算机的流量，而不是指向位于远程网络并必须经过路由的计算机。对于本地网络流量，Linux\
  \ 可以使用解析协议 (`ARP`) 直接与目标系统通信，但远程目标需要由`路由器`或`网关`系统处理——即从一个网络传递到另一个网络的计算机。大多数 Linux\
  \ 系统的路由表只列出一个网关，但某些复杂配置使用多个网关。配置路由表是 `route` 命令的任务。\n\n### 注意\n\n![注意](img/note.gif)\n\
  \n互联网上任意计算机之间的路径通常包括几十个路由器，但你的计算机只需要知道其中第一个路由器以及目标系统的地址。第一个路由器知道如何到达下一个，以此此类推，直到到达目标计算机。\n\
  \n### 理解路由表结构\n\n路由表由一系列条目组成，规定对发送到某些 `IP` 地址范围的数据的操作。当程序向内核发送传出数据包时，内核会将目标地址与路由表中的目标地址范围进行比较，从最具体的目标地址范围（即定义较小网络的范围）开始。如果数据包的目标与这些范围中的一个匹配，则按照路由表规则指定的方式发送。如果不匹配，则检查下一条规则。通常，路由表中最通用的规则被称为`默认路由`，它匹配`任何`地址。默认路由通常将数据包通过本地网络的网关计算机引导。\n\
  \n\n\n\n\n为了更好地理解这一点，查看一个路由表示例可能会有所帮助。图 2.2 显示了在系统中执行 `route -n` 命令的结果，该命令显示路由表。（`route`\
  \ 命令将在下一节中详细讨论，即“基础 route 语法和用法”。）图 2.2 显示了从最具体到最具体的路由表条目。第一个条目目标为 255.255.255.255，用于广播。这些数据包通过\
  \ `eth0` 接口发出，不涉及网关。接下来的两个条目目标为 10.92.68.0 和 192.168.1.0，代表网络掩码为 255.255.255.0 的网络（如\
  \ `Genmask` 列所示）的本地网络流量。网络地址通常以 0 结尾，但地址的网络部分是由网络掩码定义的，如前文所述。这些条目分别将流量发送到 `eth1`\
  \ 和 `eth0` 接口；仅有一个网络接口的计算机可能只有一个这种形式的条目。第四个条目目标为 127.0.0.0，是本地回环（localhost）接口，如前文所述。（某些发行版，如\
  \ Debian，不会显式地显示此路由，但它仍然有效。）请注意其接口设备（在 `Iface` 列中）是 `lo`。最后一个条目目标为 0.0.0.0，是默认路由。该地址结合\
  \ 0.0.0.0 的网络掩码，可以匹配任何尚未被匹配的流量。它通过 `eth1` 接口发送流量，它是此示例中唯一使用网关的路由——在本例中网关为 10.92.68.1。\n\
  \n![你可以通过将目标地址与路由表中的 Destination 和 Genmask 列进行比较，确定 Linux 如何路由数据包。](img/02fig02.gif)\n\
  \n**图 2.2。你可以通过将目标地址与路由表中的 `Destination` 和 `Genmask` 列进行比较，确定 Linux 如何路由数据包。**\n\
  \n当你使用 `ifconfig` 激活接口时，该工具会自动为你的路由表添加一个接口条目。该条目对应于接口的本地网络路由（图 2.2 中掩码为 255.255.255.0\
  \ 的路由）。默认 Linux 启动脚本会自动添加本地回环接口条目。广播条目（针对 255.255.255.255）在大多数系统中是不需要或不活动的，但某些工具需要此条目。在正常操作中，剩余未定义的路由表条目是默认路由。\n\
  \n### 基础 `route` 语法和用法\n\n如果在不带任何参数的情况下，或者仅带有某些参数（如 `-n`，它为网关系统等条目产生数字输出而不是主机名），`route`\
  \ 将显示当前路由表。你还可以使用此工具添加、删除或更改路由表条目。要做到这一点，你需要带有额外的参数使用 `route`。此类用法的语法如下：\n\n```\n\
  route add | del [-net | -host] target [netmask nm] [gateway gw]\n[metric m] [mss\
  \ m] [window W] [[dev] interface]\n```\n\n这些参数中的每一个都有特定的含义：\n\n*   `add | del`——如果你想添加路由，请指定\
  \ `add`；如果你想删除路由，请指定 `del`。在任何一种情况下，你必须提供足够的信息以便 `route` 对该路由执行操作。（对于删除操作，通常只需提供\
  \ `target` 即可。）\n\n*   `[-net | -host]`——你可以将目标地址指定为网络（`-net`）或单台计算机（`-host`）。在大多数情况下，`route`\
  \ 可以自行判断出这一点，但有时它需要提示。当你为第二个网关添加路由时（例如仅处理一个较小子网的网关，而不是默认路由的网关），这种情况特别容易发生。\n\n*\
  \   `target`——目标地址是路由应定义其包数据包的计算机或网络。在默认路由的情况下，这将是 `0.0.0.0` 或等效的关键字 `default`。在添加或删除路由时，此参数是必须。\n\
  \n*   `[netmask nm]`——如果你的目标网络遵循网络地址的传统类结构，Linux 可以确定掩码应该是什么。但是，如果你的网络不遵循此模式，你必须包含\
  \ `netmask` `nm`。\n\n*   `[gateway gw]`——如果你添加的路由不涉及网关，则可以省略此参数。但是，如果你想指定网关，则必须包含\
  \ `gateway` `gw`。\n\n*   `[metric m]`——如果你查看图 2.2，你会看到一个名为 `Metric` 的列。该列显示路由的“成本”，通常与时间有关。慢路由应该具有较高的指标，而快速路由应该具有较低的指标。你可以通过\
  \ `metric` `m` 设置此功能。此功能通常用于路由器，如第 24 章所述。\n\n*   `[mss m]`——`mss` 选项设置最大段大小。与 `metric`\
  \ 选项一样，此选项主要用于路由器。\n\n*   `[window W]`——窗口大小是计算机在要求接收方确认之前发送的数据量。如果此值设置得太小，网络传输可能会缓慢，因为系统将等待确认。如果设置得太大，由于错误导致重新发送大量数据的风险将会增加。作为一个通用规则，Linux\
  \ 64KB 的默认窗口是可以接受的。如果你的系统使用的是速度快但延迟高的连接（例如卫星宽带连接），你可能会将其增加到 128KB。\n\n*   `[[dev]\
  \ interface]`——通常，Linux 可以从目标地址或网关系统的地址判断出应该使用哪个接口。但这并不总是如此，在这种情况下，你可以通过使用 `[dev]`\
  \ `interface` 参数来强制执行。（`dev` 关键字是可选的，而 `interface` 是接口名称，如 `eth0` 或 `tr1`。）\n\n\
  `route` 最常用的用法是在使用 `ifconfig` 添加主网络接口后添加默认路由。这种用法相当简单，如下例所示：\n\n```\nroute add 0.0.0.0\
  \ gw 10.92.68.1\n```\n\n如果你愿意，可以用关键字 `default` 替换 `0.0.0.0`；两者的效果完全相同。在少数情况下，你必须添加\
  \ `-net` 指定、设备名称或其他选项。\n\n### 多接口共用网关\n\n\n\n\n\n如前所述，每当你使用 `ifconfig` 添加一个接口时，该实用程序会自动为该接口在路由表中添加一个条目。然而，这并不适用于添加网关。因此，许多具有多个接口的计算机上所需的配置包含两种类型的操作：\n\
  \n1. 为计算机的每个接口运行 `ifconfig`。\n2. 运行一次 `route`，将计算机的默认路由添加到路由表中。\n\n这组步骤对于小型路由器是足够的，例如作为大型组织中小型部门的路由器的\
  \ Linux 计算机。对于路由器，你还必须通过开启 IP 转发来启用路由功能。你可以输入以下命令来实现：\n\n```\n # echo \"1\" > /proc/sys/net/ipv4/ip_forward\n\
  ```\n\n### 注意\n\n![NOTE](img/note.gif)\n\n如果计算机有两个接口但不应作为路由器运行，则你不应该启用 IP 转发。如果一台计算机存在于两个不应相互通信的网络中，或者它使用其他计算机作为路由器，就可能出现这种情况。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n路由职责通常不应由执行其他工作的计算机来承担。非路由任务会消耗 CPU 时间和网络带宽，可能会降低路由器的性能。此外还有潜在的安全问题；现在的路由器通常包含防火墙功能，在防火墙上运行不必要的软件会留下攻击漏洞。\n\
  \n如果你只有一个外部 IP 地址但想将几台计算机连接到互联网，可以使用一种名为网络地址转换（NAT）的特殊路由。第 25 章，配置 iptables，涵盖了这项技术。基本步骤与普通路由器相同，但\
  \ NAT 要求你运行额外的命令，允许路由器进行地址转换，以便你的整个网络在外部看起来像单台计算机。\n\n### 具有多个网关的多个接口\n\n更复杂的配置是计算机可以使用多个网关。大多数系统只使用一个网关，该网关与默认路由关联。网关将本地网络连接到其他网络，通常最终连接到互联网。然而，还有其他配置。例如，考虑图\
  \ 2.3。此图描绘了一个组织通过路由器连接了两个子网的环境。两个办公室的普通计算机可以配置得非常简单——它们只需要指向其本地路由器作为网关即可。同样，办公室\
  \ 2 的路由器可以将办公室 1 的路由器作为其唯一的网关系统，尽管正如刚才讨论的，办公室 2 的路由器有两个接口。然而，办公室 1 的路由器需要更复杂的配置。它的默认路由指向互联网，但它也必须为目标为\
  \ 172.20.0.0/16 流量配置通往办公室 2 路由器的路由。你可以使用如下 `route` 命令来实现这一目标：\n\n```\n # route add\
  \ -net 172.20.0.0 netmask 255.255.0.0 gw 172.21.1.1\n```\n\n![具有超过两个接口的路由器需要至少两个网关定义才能正常工作。](img/02fig03.gif)\n\
  \n**图 2.3 具有超过两个接口的路由器需要至少两个网关定义才能正常工作。**\n\n### 注意\n\n![NOTE](img/note.gif)\n\n\
  当办公室 1 和办公室 2 在地理上相隔很远，并通过某种形式的长距离网络协议连接时，这种配置最有意义。如果两个办公室离得很近，它们可能都连接到一个集纽或交换机，并由一个路由器提供服务。\n\
  \n此命令假设办公室 2 的路由器使用 172.21.1.1 地址与办公室 1 的路由器通信。（注意，此地址不是办公室 2 网络本身；它在办公室 2 路由器的另一个网卡上。）执行此命令以及定义默认路由的普通\
  \ `route` 命令的最终结果将是一个包含两个网关的路由表：一个用于默认路由，另一个用于处理发往 2 号房间系统的流量。连接到办公室 1 路由器的其他计算机都不需要知道此安排的任何信息；它们只需要知道该路由器是默认路由的网关。\n\
  \n在其他情况下，也可能需要类似的配置。例如，如果办公室 1 使用第二个路由器连接到互联网，那么办公室 1 的所有计算机都需要定义两个网关：一个指向通往互联网的系统的默认路由，另一个指向通往办公室\
  \ 2 路由器的路由。（或者，普通系统可以只列出一个路由器，该路由器可以在适当将流量传递给另一台路由器，但这会增加本地网络流量）。由于带有两个路由器的网络涉及网络上所有计算机的更复杂配置，因此尽可能在任何给定的子网上使用单个路由器。\n\
  \n### 配置 DNS\n\n一旦接口激活并设置了网关，计算机就可以直接或间接地发送和接收指向其本地网络或网关连接的任何其他网络的流量。然而，流量必须通过 IP\
  \ 地址进行寻址，这在最好的情况下也是枯燥的。域名命名系统（DNS）的任务是将人们使用的字母数字名称（如 www.awl.com）转换为计算机使用的 IP 地址，从而提供更好的用户界面。（DNS\
  \ 也可以进行反向转换。）\n\n### 警告\n\n![WARNING](img/warning.gif)\n\n\n\n\n\n尽管 `search` 选项允许在执行网络访问时，通过省略指定的域名名来减少输入量，但应谨慎使用此选项。问题在于两个域名可能具有名称相同的计算机，这可能会导致混淆。例如，如果\
  \ `tworoomco.com` 和 `fourroomco.com` 都有一个名为 `www` 的 Web 服务器，用户在配置了列表 2.1 的 `/etc/resolv.conf`\
  \ 文件的计算机浏览器中输入 `www`，可能会获取一个 Web 服务器并认为它是另一个域名的 Web 服务器。这些搜索也会消耗时间，因此大多数其他名称查找都会变慢。通常，即使你指定了完整名称，系统也会首先在\
  \ `domain` 和 `search` 行指定的域名中搜索该名称。例如，如果用户输入 `www.awl.com`，列表 2.1 的 `/etc/resolv.conf`会导致系统首先搜索\
  \ `www.awl.com.threeroomco.com`、`www.awl.com.tworoomco.com` 和 `www.awl.com.fourroomco.com`，然后才搜索\
  \ `www.awl.com`。最后的（正确的）搜索可以通过在域名末尾加上点来首先完成，如 `www.awl.com..`。\n\n一旦你按照自己的修改了 `/etc/resolv.conf`，就不需要命令来激活更改。Linux\
  \ 将直接开始使用指定的名称服务器并搜索指定的域名。\n\n如果你想让 Linux 作为你网络的 DNS 服务器，请参阅第 18 章。该章节包含了有关运行 DNS\
  \ 服务器的信息，根据服务器的配置，它可以被你自己的网络中的计算机、互联网上的其他计算机，或两者兼备使用。\n\n## 设置主机名\n\n许多 TCP/IP 协议要求计算机之间通过名称相互识别身份。为了简化单个程序的配置，Linux\
  \ 维护了一个全局主机名设置，可以使用 `hostname` 命令进行查看或设置。单独输入该命令会显示当前的主机。在命令后输入主机名（如 `hostnamelarch.threeroomco.com`）会将主机名设置为指定的名称。你可以将主机名存储在文件中，并使用\
  \ `-F` 或 `--file` 选项将该文件传递给 `hostname` 命令，例如 `hostname -f /etc/HOSTNAME`。大多数发行版在启动时会自动执行此操作，尽管主机名的位置因发行版而异。检查\
  \ `/etc/hostname`、`/etc/HOSTNAME` 以及表 2.1 中“额外配置文件”列列出的文件。\n\n遗憾的是，尽管理想情况是设置一次主机名，但这并不总是可能的。某些用户级程序——特别是电子邮件客户端和\
  \ Usenet 新闻阅读——允许用户覆盖默认的主机名设置。因此，你或你的用户可能需要在这些程序中设置主机名，特别是当你更改主机名时。你可能还想在 `/etc/hosts`\
  \ 中设置主机名。该文件作为一种替代 DNS 的名称解析方法存在。它由以 IP 地址开头的行组成，后面跟着一系列主机名。最常见的是，第一个主机名是完全限定域名（FQDN）——即完整的主名，包括机器名称和它所属的域名，如\
  \ `larch.threeroomco.com`。同一行上的后续名称是“别名”——通常是缩短的形式，例如 `larch`。如果你的系统 DNS 设置正确，且你的计算机在网络\
  \ DNS 服务器中有相应的条目，则没有必要为计算机创建 `/etc/hosts` 条目。然而，如果你的网络 DNS 服务器或通往这些服务器的网络路径不可靠，为你的计算机创建\
  \ `/etc/hosts` 条目可以提高整体可靠性。你可能还想确保 127.0.0.1 地址被表示，对应的主机名为 `localhost.localdomain`\
  \ 和 `localhost`。这两个条目的示例可能如下所示：\n\n```\n10.92.68.1 larch.threeroomco.com larch\n\
  127.0.0.1 localhost.localdomain localhost\n```\n\n### 提示\n\n![提示](img/tip.gif)\n\
  \n如果计算机在启动过程中暂停几秒钟甚至几分钟，特别是在启动 sendmail 时，可能你需要在 `/etc/hosts` 文件中设置上述的条目，或者你需要修复网络\
  \ DNS 条目。某些程序（包括 sendmail）如果无法连接其主机名和 IP 地址，会暂停很久。\n\n如果一台计算机有多个接口，你将使用 `hostname`\
  \ 命令设置一个主机名，但你通常会在 `/etc/hosts` 中为每个接口创建多个主机名，尽管这并不是强制要求的。（在在这种情况下，你的网络 DNS 服务器也会为这台计算机准备两个或更多名称。）\n\
  \n### 提示\n\n![![提示](img/tip.gif)\n\n在小型私有网络中，你可以使用 `/etc/hosts` 处理所有的主机名，从而消除了为本地计算机运行\
  \ DNS 服务器的必要。随着网络规模扩大，这种做法会变得繁琐，因此许多较大的网络使用集中的 DNS 服务器。\n\n## 制作更改\n\n上述某些过程，例如在\
  \ `/etc/hosts` 中调整主机名以及在 `/etc/resolv.conf` 中设置名称服务器地址，涉及编辑配置文件。这些更改是永久的；一旦你做出更改，除非配置文件损坏或你重新安装\
  \ Linux，否则你不需要再次进行。相比之下，其他更改是瞬态的。当你运行 `ifconfig`、`route` 或 `hostname` 来调整系统功能时，该更改的持续时间仅限于计算机运行期间或被另一个操作撤销。如果你重启，更改将丢失。为了使此类更改永久，你必须调整启动脚本或配置文件，通过在文本编辑器中编辑文件或使用配置工具来实现。\n\
  \n## 使用 GUI 配置工具\n\n对网络设置进行永久更改的方法之一是使用配置工具——至少如果你的发行版包含此类工具的话。（Debian 和 Slackware\
  \ 都避免了使用此类工具）。特定选项包括：\n\n*   **Red Hat 和 Mandrake**：这些发行版使用名为 Linuxconf 的配置工具，某些其他发行版（如\
  \ LinuxPPC）也使用它。用户界面在不同发行版之间略不同。你可以通过输入 `linuxconf` 启动此工具。它可以在文本模式下使用文本菜单运行，在 GUI\
  \ 模式下使用 GUI 菜单运行，并在可选的 Web 服务器模式下运行以允许远程管理。\n\n\n\n\n\n- **SuSE**: SuSE 使用 Yet Another\
  \ Setup Tool (YaST) 作为一种菜单驱动的文本工具，并使用 YaST2 作为 YaST 的 <acronym class=\"acronym\"\
  >GUI</acronym> 对应工具。（图 2.1 显示了运行中的 YaST2。）输入 `yast` 或 `yast2` 来启动这些工具。\n\n- **Caldera**:\
  \ Caldera 使用 Caldera Open Administration System (<acronym class=\"acronym\">COAS</acronym>)\
  \ 作为其 <acronym class=\"acronym\">GUI</acronym> 设置工具。可以在 xterm 窗口中输入 `coastool` 启动。\n\
  \n- **TurboLinux**: TurboLinux 使用 TurboLinux Configuration Center 作为 <acronym class=\"\
  acronym\">GUI</acronym> 配置工具。你可以通过输入 `turbocfgcenter` 来启动它。\n\n- **所有发行版**: Webmin\
  \ 项目([`www.webmin.com/webmin/`](http://www.webmin.com/webmin/)) 是一种基于 Web 的管理工具，可用于许多不同的\
  \ Linux 发行版和非 Linux 的 Unix 类系统。大多数发行版默认不会安装它，但如果你的发行版受 Webmin 支持，让它运行起来应该并不困难。\n\
  \n具体细节因工具而异，但要使用 <acronym class=\"acronym\">GUI</acronym> 工具配置系统，你通常必须找到网络配置菜单，并可能需要深入界面的一层或两层以找到你需要更改的设置。然后你输入想要永久设置的配置选项。例如，在图\
  \ 2.1 中，你可以点击“静态地址设置”（Static Address Setup）并在提供的字段中输入 <acronym class=\"acronym\"\
  >IP</acronym> 地址和子掩码，然后点击“主机和名称服务器”（Hostname and Nameserver）按钮和“路由”（Routing）按钮来调整这些功能。\n\
  \n<acronym class=\"acronym\">GUI</acronym> 工具的一个缺点是它们有时不允许进行更高级的配置。例如，可能无法以所需的精度调整路由表，就像之前在“具有多个网关的多个接口””章节中讨论的配置那样。尽管如此，这些工具对于简单的配置几乎总是足够的。如果你在使用\
  \ <acronym class=\"acronym\">GUI</acronym> 工具时遇到困难，可以直接编辑配置文件。\n\n### 编辑配置文件\n\n\
  表 2.1 给出了配置的位置，其中列出了 <acronym class=\"acronym\">DHCP</acronym> 客户端命令和额外的配置信息。这些文件还包含处理静态\
  \ <acronym class=\"acronym\">IP</acronym> 地址的命令和配置。你应该浏览这些文件，寻找对 `ifconfig`、`route`、`hostname`\
  \ 或配置命令的调用。某些文件不包含命令，而是设置环境变量来存储诸如系统是否使用 <acronym class=\"acronym\">DHCP</acronym>\
  \ 或静态 <acronym class=\"acronym\">IP</acronym> 地址配置的信息，并在后的情况下持有静态配置信息。对涉及的脚本和配置文件进行浏览应该足以让你配置你的系统。\n\
  \n如果你在使用普通配置脚本时遇到问题，强制解决问题的方法一种是在本地启动脚本中创建条目，调用你想要使用的配置命令。大多数发行版使用 `/etc/rc.d/rc.local`\
  \ 作为本地启动脚本，但 SuSE 使用 `/etc/rc.d/boot.local`。Debian 没有单一的本地启动脚本，但你可以在 `/etc/rc.boot`\
  \ 目录下创建这样的文件。当你创建或编辑此类脚本时，可以输入任何喜欢的命令，包括如 `ifconfig` 和 `route` 等网络命令。尽管如此，这些将在将在启动脚本之后执行，因此这并不是大多数网络配置命令的理想位置。然而，这可能是让系统添加异常路由的一种可以接受的方法，例如之前讨论的针对单个小型子网的网关路由。\n\
  \n## 使用 <acronym class=\"acronym\">PPP</acronym> 链路\n\n本书的大部分内容假设 Linux 计算机连接的网络是专用的，例如以太网网络。在这种环境中，可以运行服务器，正如第二部分和第三部分所讨论的；第四部分中的安全和路由器问题也非常重要。然而，某些配置使用了不那么持久的网络链路。这些连接使用电话调制解调器和\
  \ <acronym class=\"acronym\">PPP</acronym> 创建到互联网的临时连接，或者至少到另一台计算机的连接。虽然你不可能通过 <acronym\
  \ class=\"acronym\">PPP</acronym> 链路运行服务器，但它们有其用处。例如，你可能运行小型办公室或家庭网络，并使用各种本地服务器（正如第二部分所讨论的），但使用\
  \ <acronym class=\"acronym\">PPP</acronym> 链路按需将该网络连接到互联网。正如第 25 章所讨论的，通过设置网络地址转换（<acronym\
  \ class=\"acronym\">NAT</acronym>；也称为 <acronym class=\"acronym\">IP</acronym> 伪装），你甚至可以在网络上的所有计算机之间共享此连接。然而，为了完成这些事情，你必须先建立\
  \ <acronym class=\"acronym\">PPP</acronym> 连接。本节描述了如何做到这一点。\n\n## 以太网上的 <acronym\
  \ class=\"acronym\">PPP</acronym>\n\n某些低端 <acronym class=\"acronym\">DSL</acronym>\
  \ 连接使用 <acronym class=\"acronym\">PPP</acronym> 的变体，称为 PPPoE。2.4.* Linux 内核包含了 PPPoE\
  \ 支持，但它被认为是实验性的。2002 年 Linux 最常用的 PPPoE 工具是 Roaring Penguin PPPoE 客户端([`www.roaringpenguin.com/pppoe/`](http://www.roaringpenguin.com/pppoe/))。该包以源码形式或各种平台的\
  \ <acronym class=\"acronym\">RPM</acronym> 包形式提供。\n\n安装 Roaring Penguin 后，输入 `adsl-setup`\
  \ 或 `tkpppoe` 来配置该工具。（后者命令需要安装 Roaring Penguin <acronym class=\"acronym\">GUI</acronym>\
  \ 工具；前者是一个基于文本的程序。）你会被要求提供用户名和密码等信息，脚本将存储所有信息并创建一个名为 `adsl-start` 的拨号脚本。你可以运行此脚本来启动\
  \ PPPoE 连接。\n\n注意的是，Roaring Penguin 需要你对网络设备的支持。Linux 适用于所有外部以太网的 <acronym class=\"\
  acronym\">DSL</acronym> 调制解调器，只要你有一个支持的太网卡。然而，如果你的 <acronym class=\"acronym\">DSL</acronym>\
  \ 调制解调器是 USB 的或内置的，你需要为它查找驱动程序，而这些在 2002 年是罕见的。\n\n使用 <acronym class=\"acronym\"\
  >GUI</acronym> 拨号器\n\n\n\n\n\n`PPP` 是一个相当难用的工具；该协议有许多选项，如果设置不当，可能会破坏 `PPP` 连接，甚至导致初始无法建立连接。出于这个原因，许多人发现通过\
  \ `GUI` 拨号器使用 `PPP` 比通过配置脚本更简单。事实上，许多 Linux `GUI` `PPP` 拨号器与其操作系统（如 Windows）中的同类软件非常相似，因此，如果你熟悉另一个操作系统中的\
  \ `PPP`，那么在使用 Linux `GUI` `PPP` 拨号器时应该不会有太大困难。\n\n不同的 `GUI` 拨号器在细节上有所不同，但大轮廓是相似的。本节介绍了流行的\
  \ KPPP 拨号器，它是 K 桌面环境（`KDE`）的一部分。即使你不使用 `KDE` 也可以使用 KPPP；或者使用 `GNOME` `PPP`（GNU 网络对象模型环境或\
  \ `GNOME` 的一部分）或不属于任何桌面环境的拨号器，例如 X-ISP ([`xisp.hellug.gr`](http://xisp.hellug.gr))）。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n在使用 KPPP 之前，你必须注册一个拨号账户并在 Linux 下测试调制解调器的功能。查看你的电话簿查找\
  \ ISP 以获取账户，或者如果你通过其他计算机访问网络，可以咨询诸如 The List ([`www.thelist.com`](http://www.thelist.com))\
  \ 等在线资源。要测试调制解调器，请连接它（如果是外部型号，则开启电源）。你应该能够向 `/dev/ttyS0`、`/dev/ttyS1` 或其他端口发送数据。如果你正在使用新的\
  \ devfs ([`www.atnf.csiro.au/~rgooch/linux/docs/devfs.html`](http://www.atnf.csiro.au/~rgooch/linux/docs/devfs.html))\
  \ 来自动创建设备文件，你将使用 `/dev/tts/0`、`/dev/tts/1` 等。你可以最方便地使用基于文本的 `minicom` 或 `GUI` 的\
  \ Seyon 等终端程序来测试此配置，这两个程序都带在大多数 Linux 发行版中。如果你能从解调器获得 `AT` 提示符，就说明 Linux 可以使用该调制解调器。\n\
  \n要启动 KPPP，你可以从桌面环境的菜单中选择它，或者在 xterm 中输入 `kppp`。结果应该类似于图 2.4，只不过当你第一次启动 KPPP 时，在“连接到”列表中可能不会包含任何\
  \ `ISP` 名称，也没有登录 ID 或密码。为了设置程序以使用账户，请遵循以下步骤：\n\n1. 点击 Setup 按钮。此操作将产生所示图 2.5\n\n\
  \   图 2.5. KPPP 配置对话框控制与 PPP 连接相关的硬件功能，例如使用何种调制解调器设备，并允许你使用其他对话框修改特定账户。\n\n2. 点击\
  \ New 创建新账户。KPPP 会询问你是想使用向导还是通过对话框设置。虽然向导据称更简单，但它从询问你的国家开始，而且里面没有美国选项。因此，我提供了对话框操作，它会产生所示的图\
  \ 2.6。\n\n![新账户对话框允许你输入许多重要的账户细节。](img/02fig06.gif)\n\n   图 2.6. 新账户对话框允许你输入许多重要的账户细节。\n\
  \n3. 在 `ISP` 字段中输入你的 `ISP` 名称。\n\n4. 点击 Add。此操作会产生一个小型对话框，你可以在其中输入 `ISP` 的电话号码。如果需要拨号，请务必包含任何区号。在输入每个数字后点击\
  \ Add。你应该能看到新条目出现在 KPPP 配置列表中。你可能还想输入多个拨号器按顺序尝试的号码，以防某个号码忙音。\n\n5. 如今大多数 ISP 使用密码验证协议（`PAP`）来传输用户名和密码，因此你可能应该将新账户对话框中的身份验证选择器设置为\
  \ `PAP`。你可以将其更改为其他各种选项。特别值得关注的是某些 ISP 使用的挑战握手认证协议（`CHAP`）。\n\n6. 如果你的 `ISP` 在注册过程中给了你一个\
  \ `DNS` 服务器列表，请点击新账户的 `DNS` 选项卡，并在 `DNS` 字段中输入每个 `IP` 地址，在输入每个地址后点击 Add。\n\n7. 点击新账户对话框中的\
  \ OK。你应该能看到该条目出现在 KPPP 配置对话框的列表中(图 2.5）。\n\n8. 点击 KPPP 配置对话框中的 Device 选项卡。将 Modem\
  \ Device 设置为系统使用的调制解调器设备名称。这通常是 `/dev/modem`（默认值），但也可能是 `/dev/ttyS0`、`/dev/ttyS1`\
  \ 或更奇特的名称。你可能还想调整此选项卡上的 Connection Speed 选项。默认值为 57600，但在大多数系统中，115200 提供更好的速度。（更高的值在大多数硬件上不起作用。）你在这里设置的速度是计算机与调制解调器之间的通信速度。调制解调器与\
  \ `ISP` 之间的连接速度可能较低，但如果你的调制解调器使用了压缩，那么本地连接速度约为调制间速度的两倍是最佳的。\n\n9. 点击 KPPP 配置对话框中的\
  \ OK。你现在可以在主 KPPP 窗口中选择你的新账户(图 2.4，如果它没有默认选中的话。\n\n\n\n\n\nKPPP 配置对话框和新账户对话框都包含了我在这里没有讨论过的标签页和选项。在大多数情况下，你不需要调整这些值，但有时它们是关重要的。如果你连接时遇到问题，或者你想启用某个听过但此处未涵盖的功能，请检查这些标签页中可能有所帮助的选项。<acronym\
  \ class=\"acronym\">PPP</acronym>` HOWTO 文档([`www.linuxdoc.org/HOWTO/PPP-HOWTO/`](http://www.linuxdoc.org/howto/ppp-howto/))包含了关于`<acronym\
  \ class=\"acronym\">PPP</acronym>`以及调试`<acronym class=\"acronym\">PPP</acronym>`连接的额外信息。\n\
  \n使用`<acronym class=\"acronym\">GUI</acronym>` `<acronym class=\"acronym\">PPP</acronym>`拨号器是一件简单的事；启动程序后，你只需要点击“连接”按钮（在某些程序中可能有其他名称）。某些拨号器会在连接阶段为你提供进度指示，许多调制解调器会回传调制解调器协商的声音。在\
  \ KPPP 中，点击“显示日志窗口”按钮将提供更多细节。某些拨号器（包括 KPPP）要求你在点击“连接”之前输入用户名（在登录 ID 字段中）和密码。其他则会在你点击“连接”后询问这些信息。许多拨号器允许你将密码存储在磁盘上（KPPP\
  \ 新账户对话框中的“存储密码”复选框允许设置此选项）。\n\n### 警告\n\n![WARNING](img/tip.gif)\n\n在计算机上存储你的`<acronym\
  \ class=\"acronym\">PPP</acronym>`拨号密码存在潜在的安全风险。对于你用于发起连接的隔离计算机来说，这种风险可能很小，但如果计算机有很多用户（其中某些人不应访问`<acronym\
  \ class=\"acronym\">PPP</acronym>`账户），那么风险可能会更大。至少，你不应该将你的`<acronym class=\"acronym\"\
  >PPP</acronym>`拨号账户密码用于任何用途，这样即使`<acronym class=\"acronym\">PPP</acronym>`密码被盗，你也不需要更改其他密码。\n\
  \n一旦发起连接，“连接”按钮就会更改名称以便你可以断开连接。（某些拨号器可能使用不同的按钮或显示另一个对话框来结束连接。）如果你的`<acronym class=\"\
  acronym\">ISP</acronym>`或电话公司按分钟计费，请记住这样做，否则你会收到意外之外的高额账单！\n\n## 调整配置脚本\n\n`<acronym\
  \ class=\"acronym\">GUI</acronym>`拨号器是开始使用`<acronym class=\"acronym\">PPP</acronym>`方便方式，但它们并不是所有情况的理想选择。例如，如果你想自动发起`<acronym\
  \ class=\"acronym\">PPP</acronym>`连接，`<acronym class=\"acronym\">GUI</acronym>`拨号器无法胜任工作，因为它需要人工干预才能拨号。因此，`<acronym\
  \ class=\"acronym\">PPP</acronym>`连接脚本也可以发起连接。你可以手动使用这些脚本，或者如下一节“配置按需拨号”中所述，将其作为自动拨号方案的一部分。使用这些脚本需要设置身份验证选项并配置脚本本身。\n\
  \n### 设置`<acronym class=\"acronym\">PPP</acronym>`身份验证选项\n\n如前所述，大多数 ISP 使用一种名为`<acronym\
  \ class=\"acronym\">PAP</acronym>`的协议对拨号接入的用户进行身份验证。为了使用此协议，你需要编辑 `/etc/ppp/pap-secrets`。另一个文件\
  \ `/etc/ppp/chap-secrets` 被另一个协议使用。两者都使用相同的格式：\n\n```\nusername server password\
  \ IP_address\n```\n\n这些元素中的每一个项都用空格分隔：\n- `username`: 这是用户名。\n- `server`: 这是主机名。\n\
  - `password`: 这是密码。\n- `IP_address`: 这是地址。\n\n### 警告\n\n![WARNING](img/tip.gif)\n\
  \n`pap-secrets`文件必须以加密的形式存储密码。该文件极其敏感；如果未经授权的人获得了该文件，他们将能够使用你的账户。大多数发行版将此文件的所有者设置为\
  \ `root`，且只有 `root` 有权访问。此行可能是：\n\n```\n* *\n```\n\n## 配置拨号脚本\n\n一旦你设置了`<acronym\
  \ class=\"acronym\">PAP</acronym>`或`<acronym class=\"acronym\">CHAP</acronym>`身份验证，就可以调整拨号脚本。由于`<acronym\
  \ class=\"acronym\">GUI</acronym>`拨号器已非常流行，大多数发行版将这些脚本隐藏在目录中，例如 `/usr/share/doc/ppp/scripts`，其中版本\
  \ 部分是 PPP 的版本。有三个感兴趣的脚本：\n\n- `ppp-on`: 该脚本设置重要的变量并调用 `pppd`。\n- `ppp-on-dialer`:\
  \ `ppp-on` 将此传递给 `pppd` 以控制初始阶段。\n- `ppp-off`: 该脚本终止会话。\n\n你需要修改 `ppp-on`，可能还有 `ppp-on-dialer`\
  \ 以连接到你的 ISP。你可能还想将所有三个脚本移动到一个方便的位置，如 `/usr/local/bin`。在 `ppp-on` 中设置以下内容：\n\n-\
  \ `TELEPHONE` 变量：将其设置为你 ISP 的电话号码。例如，该行可能是 `TELEPHONE=555-9876`。\n- `ACCOUNT` 和\
  \ `PASSWORD` 变量：设置你的账户值。如果你的 ISP 使用`<acronym class=\"acronym\">PAP</acronym>`，则这些变量不会被使用，因此可以将它们设置为占位值。\n\
  \n\n\n\n\n*   找到 `DIALER_SCRIPT` 变量，并将其指向你的 `ppp-on-dialer` 脚本所在的位置。（请指向你打算修改的副本，而不是文档目录中的原始文件。）默认值为\
  \ `/etc/ppp/ppp-on-dialer`，如果你愿意的话，可以将你的脚本放在那里。\n*   脚本的末尾是对 `pppd` 的调用。这是 Linux\
  \ 的 PPP 工具，它支持大量的选项。你可能不需要修改其中大多数选项，但也有一些例外。具体来说，你可能需要设置调制调调制解调器使用的设备文件（默认通常为 `/dev/ttyS0`）以及连接速度（默认通常为\
  \ `38400`，但 `115200` 通常效果更好）。\n\n一旦你根据需求调整了 `ppp-on` 脚本，就应该检查 `ppp-on-dialer` 脚本。该脚本控制\
  \ `pppd` 与你的调制解调器之间的交互，包括发送导致其拨号的命令，以及如果你的互联网服务提供商（ISP）不使用 PAP 或 CHAP，登录所需的任何交互。脚本通过调用一个名为\
  \ `chat` 的实用程序来实现此功能，该程序处理与期望文本输入的工具之间的自动交换。该脚本的大部分是一系列按列排列的期望/响应（expect/reply）字符串。第一列是脚本查找的值，第二列是\
  \ `chat` 响应时发送的响应。其中某些值（例如期望值为 `ABORT` 的期望值）具有特殊含义；例如，`ABORT` 告诉 `chat` 何时因错误停止。大多数行都以反斜杠（`\\\
  `）结尾，这是常见的续行符惯例。（实际上，`chat` 期望的是一行内夹杂着期望/响应对的单行；将它们分组成列仅是为了方便人类阅读。）最后一行没有反斜杠。\n\n\
  可能需要调整的主要特性是 `ppp-on-dialer` 脚本的最后三行。默认脚本通常在编写时假设 ISP *没有* 在使用 PAP，因此它以两行回显（echo）你的用户名和密码的代码结束（这些用户名和密码对应在\
  \ `ppp-on` 中的 `ACCOUNT` 和 `PASSWORD` 变量中输入的内容）。你可能需要删除这些行或将它们注释掉（通过在行首加加井号 `#`）。如果你这样做，还必须移除倒数第三行的反斜杠，该行通常以\
  \ `CONNECT` 期望字符串开头。删除最后两行并调整前面的那行将导致 `chat` 在连接后立即终止，随后 `pppd` 将尝试使用 PAP 或 CHAP\
  \ 对连接进行身份验证。如果你的 ISP *没有* 使用 PAP 或 CHAP，你可能需要修改这些行的期望部分，以匹配你的 ISP 用于用户名和密码的提示，并且如果你必须自己输入额外的命令，可能还需要添加更多提示，例如用于在\
  \ ISP 系统上显式启动 PPP 的命令。\n\n### 使用 PPP 拨号脚本\n\n编辑脚本文件是通过这些脚本启动 PPP 连接最困难的部分。完成此任务后，你只需要输入\
  \ `ppp-on`（如果你没有将其放在路径中，则需要在前面加上脚本的完整路径）即可启动连接。如果你的调制解调器是外外的，你应该看到它的指示灯闪烁；如果它被配置为在拨号期间将声音输出到扬声器，你应该能听到这个过程。如果一切顺利，几秒钟后你就可以使用\
  \ Linux 的标准网络工具访问互联网了。\n\n如果你遇到问题，应该首先检查 `pppd` 记录其操作的日志文件（通常为 `/var/log/messages`）。该文件的末尾应包含有关\
  \ `pppd` 操作的信息，包括导致其失败的任何原因——等待 PAP 超时、运行 `chat` 失败或其他等。如果这些输出晦涩不明或没有为你提供所需的线索，请尝试搜索与你的问题相关的关键词。\n\
  \n\n\n\n要使用 `diald`，你必须在内核中编译了 `SLIP` 支持，如第 1 章 所示。这是因为 `diald` 使用 `SLIP` 来建立一个虚拟连接，本质上是将你的计算机连接到\
  \ `diald` 程序本身。因此，程序会看到一个始终处于连接状态的网络接口，而 `diald` 则接收网络流量，以便它可以控制何时启动实际连接。\n\n遗憾的是，大多数\
  \ Linux 发行版并不自带 `diald`。你可以从其官方网站 [`diald.sourceforge.net`](http://diald.sourceforge.net)\
  \ 获取该包，或者可以在 [`www.rpmfind.net`](http://www.rpmfind.net) 或 [`www.debian.org/distrib/packages`](http://www.debian.org/distrib/packages)\
  \ 分别搜索预编译的 `RPM` 或 Debian 包。\n\n`diald` 程序通过三个配置文件进行控制：\n\n* `/etc/diald.conf`:\
  \ 此文件设置了许多通常由 `ppp-on` 处理的配置选项，包括调制解调器文件名（`device`）和连接速度（`speed`）。`local` 和 `remote`\
  \ 选项设置 `diald` 内部使用的 `IP` 地址。你应该将这两个地址设置为同一网段的地址，但任何一个地址都不应用于 Internet 或你自己的本地网络（如果有的话）。`192.168.*x.x`\
  \ 范围内的地址通常是很好的选择。\n* `/etc/ppp/diald-dialer`: 此文件与之前描述的 `ppp-on-dialer` 脚本基本相同。你应该像调整\
  \ `ppp-on-dialer` 一样对其进行调整。\n* `/usr/lib/diald/standard.filter`: 此文件定义了 `diald`\
  \ 用于判断何时断开连接的超时时间。你可以根据目标连接类型指定不同的连接，如 `/etc/services` 所示。在每种情况下，你都告诉 `diald` 在指定的秒数内保持连接。默认文件是一个合理的起点，如果你发现\
  \ `diald` 断开连接过快，可以对其修改。\n\n除了这些配置文件之外，如果你的 `ISP` 使用 `PAP` 或 `CHAP`，你必须像处理普通的基于脚本的\
  \ `PPP` 连接一样编辑 `/etc/ppp/pap-secrets` 或 `/etc/ppp/chap-secrets` 文件。你可能还需要如前所述在 `/etc/resolv.conf`\
  \ 中输入 ISP 的 `DNS` 服务器地址。要使用 `diald`，以 `root` 身份输入 `/usr/sbin/diald` 来启动程序。随后它应该检测到输出网络活动并启动连接。但由于连接延迟，首次尝试使用工具可能会失败；例如，Web\
  \ 浏览器在显示页面之前可能会超时。不过，第二次尝试应该是成功的。\n\n如果你希望系统在启动时自动启动 `diald`，可以创建一个 SysV 启动脚本，或者在本地启动脚本中添加条目，例如\
  \ `/etc/rc.d/rc.local` 或 `/etc/rc.d/boot.local`。无论你是手动还是自动启动，如果你将计算机配置为作为 `NAT`\
  \ 路由器（如第 25 章 所示），`diald` 就可以检测源自本地网络的网络流量。因此，你可以通过 Linux 计算机和调制解调器将小型本地局域连接到 Internet，并使用\
  \ Linux 系统作为本地网关，将你的本地计算机配置得就像在整个互联网上一样。\n\n## 总结\n\n使用网络需要你启动某种形式的网络连接。大多数局域网使用以太网作为连接媒介，Linux\
  \ 对以太网网络提供了极的支持。大多数此类网络要求你手动配置 `IP` 地址或使用 `DHCP` 客户端来完成这项工作。Linux 支持这两种方法。许多其他局域网技术也使用这些配置方法。一个主要的例外是\
  \ `PPP` 连接，它通常用于电话线上的低速网络链路。这些连接由 Linux `PPP` 守护进程 `pppd` 处理。该程序可以通过 `GUI` 配置工具、简单脚本或\
  \ `diald` 拨号守护进程进行控制。在任何一种情况下，`PPP` 连接都会创建一个网络接口，从软件角度来看，该接口与以太网或其他局域网接口相似。\n\n\
  # 第 3 章 替代网络协议栈\n\n计算机非常擅长遵循精确的指令，但它们并不擅长随机发挥或处理偏离预期的情况。由于由于原因，计算机网络依赖于一系列定义非常精确的协议——对过程或事务应当如何发生的描述。如第\
  \ 1 章 简述所示，这些协议以线性方式排列，形成所谓的 `network protocol stack`（网络协议栈），或简称 `network stack`（网络栈）或\
  \ `protocol stack`。`传输控制协议/网协议 (TCP/IP)` 栈是最常用的网络协议栈；它是 Internet 以及大多数 Linux 网络工具的基础。第\
  \ 2 章 描述了如何配置 Linux 使用 `TCP/IP`。然而，还有几种替代的网络协议栈，Linux 支持了其中一些。\n\n本章从概述什么是网络栈开始，包括对\
  \ `TCP/IP` 的简要描述。接下来将讨论三种替代网络协议栈：AppleTalk、`IPX` 和 NetBEUI。这些替代协议栈主要用于局域网，供 Macintosh\
  \ 和 Windows 计算机之间进行文件和打印机共享。\n\n\n\n\n\n网络栈的一种常见模型是`开放系统互连（OSI）`模型。该模型由七层组成，每一层都处理特定的网络任务。当计算机发送数据时，信息源于位于\
  \ OSI 模型顶层（称为`应用层`）的程序。该程序将数据传递给下一层（`表示层`），并依此类推向下层堆栈。每一层都以某种方式处理数据。OSI 模型的底部是`物理层`，它对应于网络硬件，如电缆和集线器。数据通过物理层从发送端计算机传输到接收端计算机。（当两台计算机都位于同一个网络分段时，这种传输可能是简单的；但当两台计算机位于互联网上的不同点时，可能涉及许多其他系统。）在目标系统上，数据沿网络栈向上传输，最终到达该系统上应用层的接收端程序。该系统随后可能会向其网络栈向下发送回复，而该回复将沿第一个系统的网络栈向上传输。图\
  \ 3.1 说明了这一过程。\n\n![网络栈处理数据以便将其传输到另一台计算机，或“解包”从另一台计算机接收的数据。](img/03fig01.gif)\n\n\
  **图 3.1. 网络栈处理数据以便将其传输到另一台计算机，或“解包”从另一台计算机接收的数据。**\n\n### 注意\n\n![注意](img/note.gif)\n\
  \n尽管 OSI 模型经常被泛泛地描述网络，但将 OSI 作为完整的协议栈使用的非常罕见。更常见的网络栈，如 `TCP/IP`、AppleTalk 和 NetBEUI，可以用\
  \ OSI 术语来描述，有时会进行细微变动。例如，`TCP/IP` 通常使用四层模型来描述，而不是七层的 OSI 模型。尽管如此，其原理保持不变。\n\nOSI\
  \ 模型的每一层仅直接与其正上方和下方的层进行通信。（在应用层和物理层的情况下，链结束了。应用程序与用户通信或执行自动化网络任务，而物理层连接两台计算机。）在任何给计算机上，网络栈的各层都必须编写成能够通过清晰定义的接口来实现此类通信。有时，给定层的组件必须是互换的。例如，应用层由网络应用程序组成，如\
  \ Web 浏览器和 Web 服务器。你应该能够更换一个 Web 浏览器或 Web 服务器，而不会导致网络栈产生问题。（任何给定的 Web 浏览器或 Web 服务器都可能缺少某些重要功能，例如处理安全套接层\
  \ [SSL] 加密的能力；然而，这并不是网络栈集成的问题。）同样，你应该能够在物理层更换网络电缆和集线器，甚至更换网卡及其驱动程序，而不影响更高层。\n\n\
  网络栈的每一层都与其对端计算机上的对应层相对应。在某种意义上，接收计算机的网络栈会撤销发送计算机网络栈所执行的所有操作。最终目标是允许应用层程序进行通信。因此，任何层从下层接收的数据都应当与其发送系统中对应层发送的数据完全。在某种意义上，任何给定层的工作都就像是在与其他系统的对应层通信，而不是本地协议栈的另一层通信。由于由于原因，网络栈在计算机之间必须非常标准化，即使这些计算机运行着完全不同的操作系统。例如，Linux、Windows\
  \ XP、MacOS X 和 BeOS 等不同操作系统的网络栈必须以几乎完全相同的方式工作，即使它们使用完全独立的代码库。\n\n## 数据的封装与解包\n\n\
  网络栈是设想数据通过计算机网络软件传输过程的一种有用方式，但它并没有清晰地描述数据在传输过程中发生了什么。这可以被视为对数据的封装和解包。网络栈的每一层都会对其接收到的数据进行处理。封装期间执行的操作可能包括将数据拆分成块（取决于所讨论的栈层，通常称为`数据包`或`帧`）、向现有的数据块中添加信息，或修改现有数据（尽管数据修改很少见）。解包则是这些操作的逆向过程。\n\
  \n例如，考虑通过文件传输协议 (`FTP`)）在以太网上进行数据传输，该协议使用 `TCP/IP` 网络栈。正在传输的数据可能是一个文件，但该文件可能远大于\
  \ `TCP/IP` 或以太网设计用于传输的数据包或帧。因此，文件将被拆分成许多小块。这些块中的每一块都会由网络栈的不同部分添加`头部`（某些层可能还会添加`尾部`）。头部和尾部标记着给定数据块的开始或结束，并包含帮助系统解析和递送其余数据的信息。这种封装的理想结果如图图\
  \ 3.2 事实上，情况可能会变得复杂，因为网络栈某层交付的数据包可能会被后续的层进一步拆分。例如，以太网驱动程序可能会将一个 `IP` 包拆分成两个以太网帧。路由器可能会做同样的事。当这种情况发生时，图\
  \ 3.2 中的 `IP`、`TCP` 和 `FTP` 头部都是数据负载的一部分；它们没有在两个以太网包中重复，可能会出现在任何一个以太网包中。然而，这一切都是透明的，因为接收计算机网络栈的每一层都会重新组装发送计算机创建的数据包或帧，即使这些数据包在途中被拆分了。\n\
  \n![网络栈将文件拆分成块，并将每个块封装在帮助接收计算机重新组装原始文件的数据中。](img/03fig02.gif)\n\n**图 3.2. 网络栈将文件拆分成块，并将每个块封装在帮助接收计算机重新组装原始文件的数据中。**\n\
  \n\n\n\n\n图 3.2 的细节在不同的网络协议栈之间，甚至在单个协议栈内部之间也是不同的。例如，图 3.2 中的 `FTP` 头部可能是 Web 浏览器数据传输的超文本传输协议（`HTTP`）头部。如果计算机使用的是以太网以外的网络硬件，则以太网头部和尾部将被所使用的特定网络硬件的头部和尾部取代。事实上，跨网络类型传输数据的路由器会在处理过程中剥离这些头部和尾部，并用适当的替代品进行替换。这种处理在数据包跨越互联网的过程中可能会发生多次，但目标是以原始形式将原始数据递送到目的地。\n\
  \n头部和尾部包含关键的地址信息，例如发送者和接收者的 `IP` 地址、源程序和目的程序的端口号、标识数据包在序列中位置的数字等。中间计算机使用这些信息路由单个数据包，而接收方则使用它将数据包定向到适当的程序。该程序随后可以使用发送者的地址和端口号将回复定向到该系统和程序。\n\
  \n## TCP/IP 协议栈的作用\n\n`TCP/IP` 是最流行的网络协议栈。互联网建立在 `TCP/IP` 之上，该协议栈支持最流行的网络协议，包括书中讨论的大部分协议。在大多数情况下，你不能简单地将一个网络应用程序从一个协议栈解绑并绑定到另一个协议栈，尽管少数应用程序支持多个网络协议栈。`TCP/IP`\
  \ 流行的原因之一是其灵活性。`TCP/IP` 是一种`可路由`的网络协议栈，这意味着具有多个网络接口的计算机可以部分处理 `TCP/IP` 包，并将这些包从一个网络传递到另一个网络。`TCP/IP`\
  \ 路由是灵活的，允许基于去中心化的网络地图进行路由；网络路由发生不需要中央数据库。此外，`TCP/IP` 支持较大的网络地址（32 位，IPv6 提供了 128\
  \ 位地址，如第 2 章所示）和分层命名结构。所有这些特征使得 `TCP/IP` 非常适合作为全球网络的协议栈。\n\n在单台 Linux 计算机上，`TCP/IP`\
  \ 是一个很好的选择，因为它支持许多重要的网络协议。尽管许多非 Unix 平台在 20 世纪 80 代开发了专用协议栈，但 Unix 系统开创了 `TCP/IP`，大多数\
  \ Unix 网络协议都使用 `TCP/IP`。Linux 继承了这些协议，因此仅限 Linux 或 Linux/Unix 网络仅使用 `TCP/IP` 运行得非常良好；在这种环境下，你可能不需要使用任何其他网络协议栈。\n\
  \n`TCP/IP` 支持的常用协议包括 `HTTP`、`FTP`、简单邮件传输协议（`SMTP`）、网络文件系统（`NFS`）、Telnet、安全外（`SSH`）、网络新闻传输协议（`NNTP`）、X\
  \ Window 系统以及许多其他。由于 `TCP/IP` 的流行，最初为其他网络协议栈编写的工具通常也能使用 `TCP/IP`。特别是 Windows 使用的服务器消息块（`SMB`）/通用互联网文件系统（`CIFS`）文件共享协议可以通过网络基本/输出系统（NetBIOS）连接到\
  \ `TCP/IP`，而不是绑定到 NetBIOS 扩展用户界面（NetBEUI），这是原生的 DOS 协议栈。（95 年后的所有 Windows 版本也支持\
  \ TCP/IP。）同样，Apple 的文件共享协议现在也通过 `TCP/IP` 以及 AppleTalk 运行。\n\n尽管 `TCP/IP` 非常流行并可以胜任许多网络任务，但它对于所有的网络角色并不是完全足够的。例如，你的网络可能包含某些继续使用不支持\
  \ `TCP/IP` 的旧操作系统。例如，旧的 Macintosh 可能只支持通过 AppleTalk 进行文件共享，或者你可能配置了使用 `IPX` 或 NetBEUI\
  \ 的 DOS 或 Windows 系统。在这些情况下，Linux 对替代网络协议栈的支持是一个助力。\n\n## AppleTalk\n\nApple 在 20\
  \ 世纪 80 年代中期为其部分早期的 Macintosh 配合 LocalTalk 硬件开发了 AppleTalk 协议栈。（事实上，早期硬件和软件统称为 *AppleTalk*，尽管今天这个名称仅留给软件端。）随着以太网的普及，Apple\
  \ 开发出了一种在以太网硬件上使用 AppleTalk 的方法——这种变体有时被称为 *EtherTalk*。Linux 支持通过原始的 LocalTalk 硬件（如果你的系统拥有支持的\
  \ LocalTalk 网卡，如第 1 章所示）或通过以太网运行 AppleTalk。\n\n### 注意\n\n![注意](img/note.gif)\n\n\
  讽刺的是，Linux 不支持 Macintosh 内部的 LocalTalk 硬件。如果你在类系统上运行 Linux，你将*无法*使用 LocalTalk 硬件，如果计算机具有内置以太网适配器或支持的太网扩展卡，你仍然可以通过以太网使用\
  \ AppleTalk。\n\n\n\n\n\n与 `TCP/IP` 类似，AppleTalk 使用 32 位的机器地址。同样与 `TCP/IP` 相关，AppleTalk\
  \ 地址被分为两个部分——网络地址和计算机地址；然而，这两个部分的划分是固定的，每个部分都占用了 32 位可用地址中的 16 位。AppleTalk 包含一种程序，允许网络上的计算机自行协商自己的\
  \ AppleTalk 地址，因此你不需要显式地设置此地址。（如果你需要，你*可以*请求一个特定的地址或特定范围内的地址，但通常通常没必要的。）\n\n在 AppleTalk\
  \ 数字地址之上是一套人类更直接使用的双层字母命名系统。每台计算机都有一个名称，并位于一个 `zone`（区域）中，区域是计算机的逻辑组。小型网络可能是“无区域的”（`zoneless`），这意味着区域名称不会被强加给用户。当你启动\
  \ `Netatalk`（Linux 下主要的 AppleTalk 软件包）时，该软件会根据 `TCP/IP` 主机名设置系统的 AppleTalk 名称，除非你覆盖了此设置。例如，如果一台计算机的\
  \ `TCP/IP` 主机名为 `larch.threeroomco.com`，则该计算机的 AppleTalk 名称变为 `larch`。不过，域名信息丢失了。（在有区域的网络中，计算机会尝试自动设置其区域，区域名称可能与\
  \ `TCP/IP` 主机名中的任何内容都不相似。）AppleTalk 名称的双层特性是 AppleTalk 网络上的一个重要限制因素；如果没有更多层次的名称，创建一个包含数百台计算机的\
  \ AppleTalk 网络将变得非常麻烦。\n\nAppleTalk 的主要应用程序是开发这些协议时的文件和打印机共享。许多支持网络功能的打印机原生“支持”AppleTalk，AppleTalk\
  \ 文件共享协议也能被 MacOS、Windows NT 和 2000、Linux、BeOS 等系统理解。尽管如此，除非包含 MacOS 系统的网络，否则几乎没有理由使用\
  \ AppleTalk，因为大多数其他操作系统对其他网络协议提供了更好的支持。即使在以 Macintosh 为主的网络中，基于 Unix 的 MacOS X 也支持\
  \ `NFS` 以及 AppleTalk，因此如果你的网络 Mac 运行的是 MacOS X，你可能更倾向于使用 `NFS`。`Netatalk` 软件包（参见\
  \ [`netatalk.sourceforge.net`](http://netatalk.sourceforge.net)）是 Linux 中使用 AppleTalk\
  \ 的主程序；它将在下一节讨论。\n\n### 提示\n\n![TIP](img/tip.gif)\n\nAppleTalk 数据包通常无法通过典型路由器路由，这使得\
  \ AppleTalk 成为提供额外安全的良好选择。如果你完全确定没有人能利用你 `Netatalk` 服务器的漏洞从本地网络之外进入你的系统，可以在 `Netatalk`\
  \ 服务器上禁用 `TCP/IP`。同样，在支持网络功能的打印机或打印服务器上禁用除 AppleTalk 打印以外的所有功能，可以防止该系统被外部滥用，除非他们首先在你本地网络中的另一个系统上立脚。正如在第四部分\
  \ 中讨论的，良好的安全实践可以帮助保护 `TCP/IP` 网络，因此 AppleTalk 提高安全的唯一选择。\n\n## 使用 Linux AppleTalk\
  \ 软件\n\n带有大多数 Linux 发行版的 `Netatalk` 软件包是 Linux 上主要的 AppleTalk 软件。该软件包提供了三个功能：\n\n\
  * **一个 AppleTalk 文件服务器**。`afpd` 程序允许 Linux 计算机作为 Macintosh 系统的文件服务器运行。文件服务器同时支持原生\
  \ AppleTalk 和 `TCP/IP`，因此只要共享网络硬件类型，Linux 就可以为旧的 Macintosh 提供服务。（如果它们不共享，可以使用 `LocalTalk-to-Ethernet`\
  \ 转换设备来桥接差异。）此服务器通过名为 `afpd.conf` 的文件进行控制，该文件通常位于 `/etc/atalk`。此外，`AppleVolumes.default`\
  \ 文件控制哪些目录被共享，而 `AppleVolumes.system` 将文件名扩展名映射到 Macintosh 文件和创建者类型上，这些类型直接存储在 MacOS\
  \ 原生文件系统上。\n\n* **一个 AppleTalk 打印服务器**。`papd` 程序允许 Linux 计算机作为 Macintosh 系统的打印服务器运行。与\
  \ Ghostscript（Linux 标准打印队列的一部分）结合使用，这允许你共享即使是廉价的喷墨打印机，就像它是功能全 PostScript 设备一样。打印服务器功能仅在原始\
  \ AppleTalk 上工作，而不通过 `TCP/IP`。`papd` 服务器通过 `papd.conf` 控制，该文件通常位于 `/etc/atalk`。\n\
  \n* **一个 AppleTalk 打印客户端**。`pap` 程序允许 Linux 向支持 AppleTalk 的打印机提交打印作业。如果你的 Linux\
  \ 计算机位于以 Macintosh 为主的网络中，且该网络托管了不支持其他协议的打印机，正如第 9 章 所，通过 LPD 共享打印机的配置将简单。前两个程序依赖于另一个程序\
  \ `atalkd`，它配置计算机的整体 AppleTalk 状态——例如 AppleTalk 名称和地址等功能。该程序通过名为 `atalkd.conf` 的文件控制，该文件也存储在\
  \ `/etc/atalk`。\n\n### 注意\n\n![NOTE](img/note.gif)\n\nNetatalk 不包含文件共享客户端。因此，你无法使用\
  \ Netatalk 从 Linux 访问 AppleTalk 共享。`afpfs` 软件包 ([`www.panix.com/~dfoster/afpfs/`](http://www.panix.com/~dfoster/afpfs/))理论上从\
  \ 1.03b-alpha 开始提供了这种功能，但它非常旧且不可靠。如果你想从 Linux 访问 Macintosh 文件，使用 Macintosh `NFS`\
  \ 或 `SMB/CIFS` 服务器更好，例如 MacOS X 的原生 `NFS` 服务器或 DAVE ([`www.thursby.com`](http://www.thursby.com))。\n\
  \n大多数 AppleTalk 的默认安装安装后即可正常工作，但它们通常配置为仅共享登录用户的家目录。你可以通过编辑 `AppleVolumes.default`\
  \ 来更改此配置。例如，此文件中的以下行告诉系统导出用户主目录（由波浪号 `~` 指定）和 `/mnt` 目录：\n\n```\n~\n/mnt \"Mount\
  \ Points\" options=nodouble\n```\n\n这些行中的第一行是默认值，不包含特殊选项。第二行包含在 Macintosh 客户端上看到的替代\
  \ `/mnt` 的共享名称，以及 `options` 指定，用于设置特殊选项。在这种情况下，设置的唯一选项是 `nodouble`，这使得 Netatalk\
  \ 不创建 AppleDouble 文件（这些是存储在 `.AppleDouble` 子目录中的特殊文件，用于存储 MacOS 特有数据），除非绝对需要。\n\n\
  \n\n\n\n如果你的 Netatalk 软件包是随发行版自带的，它可能会在你启动电脑时自动启动。如果没有，请参阅第 4 章——启动服务器，获取通用的服务器启动信息（SysV\
  \ 或本地启动脚本是启动 Netatalk 的最佳选择）。你应该先启动 `atalkd`，然后是 `afpd` 和 `papd`。Netatalk 的特性之一（特别是\
  \ `atalkd`）是该服务器可能需要相当长才能启动——有时超过一分钟，特别是在较旧的硬件上。你可以通过在启动脚本的程序调用后添加连接符（`&`）来避免系统启动过程出现停顿。\n\
  \n## IPX/SPX\n\n网络数据包交换（IPX）由 Novell 开发（紧基于 Xerox 早期的工作），作为一种低层网络传输协议。它经常与顺序数据包交换（SPX）协议结合使用；两者共同构成了网络协议栈的核心，其范围与\
  \ AppleTalk 或 NetBEUI 相当。IPX/SPX 在历史上一直被 NetWare 产品使用，但 DOS、Windows 和其他操作系统也提供 IPX/SPX\
  \ 软件包。该协议栈最流行的用途之一是支持 NetWare 核心协议（NCP），这是 Novell 的文件和打印机共享工具。Linux 也支持这些协议，包括在内核中（如第\
  \ 1 章所述）以及客户端和服务器软件包中。\n\n## IPX/SPX 特性与功能\n\n与 TCP/IP 和 AppleTalk 一样，IPX/SPX 支持\
  \ 32 位地址，地址通常以十六进制形式表示，例如 0x23a91002。然而，此地址并不是分配给单个计算机，而是分配给整个网络——通常是一个通过路由器与其他隔离的网段，或者完全与外界隔绝的网段。IPX/SPX\
  \ 网络还通过底层硬件的帧类型来识别，这是以太网帧在极低层级构建的方式；同一个 IPX/SPX 网络上的所有计算机必须使用相同的帧类型。为了识别单台计算机，IPX/SPX\
  \ 依赖于底层硬件的地址方案，例如以太网的 48 位（6 字节）地址。\n\n正如你从名称和地址方案中推测的那样，IPX/SPX 是为互联网设计的——即将网络连接在一起。这是通过\
  \ IPX 路由器实现的，其在宏观细节上与 TCP/IP 路由器非常相似。（事实上，单个系统可以同时充当 TCP/IP 和 IPX 路由器）。简单的网络可能不需要路由器，但\
  \ IPX/SPX 确实支持此选项。\n\nIPX/SPX 服务器使用名为服务公告协议（SAP）的协议来定期发布它们的名称及其提供的服务（例如共享目录或打印机）。本地网段上的其他系统将“听到”这些公告，IPX\
  \ 路由器应该将这些公告回传到其他网段。这种设计可以帮助轻松找到正确的服务器，但随着网络规模的增大，它也会增加网络流量；服务器越多，会有更多的 SAP 广播消耗网络带宽。\n\
  \n## 使用 Linux IPX/SPX 软件\n\n与大多数 Linux 软件一样，Linux 的 IPX/SPX 软件很大程度上是开源的。（Caldera\
  \ 曾从 Novell 获得 NetWare 许可并提供给 Linux，但 Caldera 已经停止了这一 NetWare 的官方移植。三用户版本仍可在 ftp://calderasystems.com/old-products/netware/\
  \ 获取，但它需要旧的 1.3.x 内核——也就是说，该软件自 1996 年以来还没有更新。这在未来可能会发生。）编写时，当前版本为 0.95，Linux IPX/SPX\
  \ 工具包括：\n\n- **内核 NCP 支持**: Linux 内核包含对 NCP 支持。你需要 `ncpmount` 程序（通常在名为 `ncpfs` 的软件包中）来完成此任务。\n\
  - **LinWare**: 该软件包提供有限的 NCP 支持。它存放在 ftp://sunsite.unc.edu/linux/system/daemons/\
  \ 的 `lwared` 下。\n- **Mars_nwe**: 这是另一个用于 Linux 的 NetWare 服务器软件包。该软件包托管在 [`www.compu-art.de/mars_nwe/`](http://www.compu-art.de/mars_nwe/)，大部分内容为德语。英文文档位于\
  \ Mars_nwe HOWTO 文档 [`www.redhat.com/support/tips/netware/netware.html`](http://www.redhat.com/support/tips/netware/netware.html)\
  \ 中。Mars_nwe 支持文件和打印服务。它的主配置文件是 `/etc/nwserv.conf` 或 `/etc/nwserv/nwserv.conf`，如果它通过启动脚本自动启动，可以通过输入\
  \ `nwserv` 来启动。\n\n所有这些 IPX 软件包都要求你的内核中编译了 IPX 支持，如第 1 章所示。某些发行版还需要一个独立的软件包，通常称为\
  \ `ipxutils`，它包含用于激活和控制 IPX/SPX 网络协议栈的实用程序。（或者，某些发行版将这些工具包含在 `ncpfs` 软件包中。）\n\n\
  如果你打算为 NetWare 客户端运行服务器，Mars_nwe 的配置通常并不困难，因为默认配置工作得良好。配置文件通常也有良好的注释，因此你可以通过阅读注释来学习如何配置它。你应该特别注意以下细节：\n\
  \n- 文件的第 1 部分定义了要共享的卷。在 Linux 术语中，这些是目录。随服务器副本自带的配置文件可能定义也未定义你想共享的卷。\n- 第 7 部分控制密码加密选项。如果你的网络没有标准的\
  \ NetWare *bindery* 服务器（一个处理身份验证的计算机），你可能需要启用非加密密码。\n\n\n\n\n\n## 服务器访问\n\n第 13\
  \ 节定义了允许访问服务器的用户。你可能需要在此节中添加用户名和密码，这复制了常规的 Linux 用户名和密码配置。密码以未加密明文形式存储，这是一个潜在的安全漏洞。然而，如果网络中有一个目录服务器（bindery），你可以在首次启动\
  \ `Mars_nwe` 之后删除这些条目，因此安全风险可能没有最初看起来那么糟糕。与其处理单个账户，不如你可以设置第 15 节来自动完成此操作，但缺点是所有账户将具有相同的密码。\n\
  \n`Mars_nwe` 软件包包含了在你的网络接口上自动启用 `IPX` 支持的手段。然而，在 `ncpmount` 实现的 Linux NetWare 客户端支持中，并不存在这种便利性。在使用此命令之前，你应该使用\
  \ `ipx_configure` 命令启用自动配置。然后你就可以用 `ncpmount` 挂载 NetWare 卷。整个过程可能如下：\n\n```\n #\
  \ ipx_configure —auto_interface=on —auto_primary=on\n## ncpmount -S NW_SERV -U anne\
  \ -P p4rtu3a /mnt/nwmount\n```\n\n此序列能够自动检测本地网络编号，并使用密码 `p4rtu3a` 将与用户 `anne` 相关的\
  \ `NW_SERV` 卷挂载到 `/mnt/nwmount`。\n\n# NetBEUI\n\nNetBEUI 在许多方面与 AppleTalk 和 `IPX`\
  \ 相似，但在历史上它主要被 IBM 和微软作为 DOS、Windows 和 OS/2 网络节点的基础。截至 `2.4.x` 系列，Linux 内核尚未包含标准的\
  \ NetBEUI 协议栈。然而，这一缺失被两个事实抵消了。首先，NetBEUI 的常见可以通过 `TCP/IP` 之上的 NetBIOS（有时称为 `NBT`）来实现，而\
  \ Linux 支持这种技术。其次，可以使用第三方的 NetBEUI 协议栈，尽管它的实用性有限。\n\n## NetBEUI 特性与功能\n\n与 AppleTalk\
  \ 和 `IPX` 一样，NetBEUI 的设计考虑了小型网络。事实上，NetBEUI 比其竞争的小网络协议更为局限，因为它被限制在仅 256 台计算机的网络中。NetBEUI\
  \ 使用类似于 `TCP/IP` 主机名的计算机名称，但与 `TCP/IP`、AppleTalk 和 `IPX` 一样，它没有底层的数值地址系统；NetBEUI\
  \ 直接使用计算机名称。这些名称本质上是两级的，类似于 AppleTalk 的名称（包含计算机名称和网络区域名称）。NetBEUI 将其高级分组称为 `workgroups`（工作组）或\
  \ `domains`（域），取决于是否存在控制登录的中央计算机（域支持此功能，但工作组将身份验证留给各个服务器）。当配置为使用 NetBEUI 的计算机启动以及此后的定期运行时，会发送广播以宣布自己的存在。\n\
  \nNetBEUI 理论上可以使用任何网络介质，但最常用的是以太网。像 AppleTalk 和 `IPX` 一样，NetBEUI 可以在以太网上与 `TCP/IP`\
  \ 或网络协议栈共存。\n\nNetBEUI 最经常与 `SMB/CIFS` 文件和打印机共享协议结合使用。它们的应用范围与 Unix 和 Linux 的 `NFS/lpd`、AppleTalk\
  \ 的等效协议或 `NCP` 相当。它们也可以在 `TCP/IP` 上使用，事实上，这种配置非常常见，即使在仅包含 Windows 计算机的网络上也是如此。然而，因为它不易被路由，NetBEUI\
  \ 提供了一些安全优势——远程攻击者不太可能对 NetBEUI 服务器发起成功的攻击。\n\n## 获取 Linux NetBEUI 协议栈\n\n很少有 Linux\
  \ 计算机参与 NetBEUI 通信，因为标准内核缺少 NetBEUI 协议栈。2000 年，Procom Technologies ([`www.procom.com`](http://www.procom.com))\
  \ 发布了适用于 Linux 的开源 NetBEUI 协议栈，以及针对 Samba 的补丁（在“通过 Samba 进行文件和打印机共享”中描述），允许 Samba\
  \ 运行在 NetBEUI 而非 `TCP/IP` 上。这些补丁并没有变得普遍，事实上它们也没有直接发布在 Procom 网站上，尽管你可以向他们的技术支持部门请求该协议栈。NetBEUI\
  \ 协议栈在 `2.0.x` 系列之外的内核上可能无法正常工作（例如，我无法让补丁在 `2.2.18` 上运行）。NetBEUI 协议栈也是为 3.0 之前的\
  \ Samba 版本设计的。如果你确实必须使用 NetBEUI，你可能需要使用旧版本的 `2.0.x` 内核以及更版本的 Samba。\n\n## 使用 NetBEUI\
  \ 软件\n\nNetBEUI 协议栈包含一个 `README` 文件，带有完整的安装和使用说明。该文件概述了两种安装方法。一种方法要求你编辑 `Makefile`\
  \ 以指向你的 Linux 内核和 Samba 源码树，并设置一些系统特定的选项。然后你可以重新编译 Linux 和 Samba，安装新内核并重启系统。第二种程序同样要求你编辑\
  \ `Makefile`，但它会提供关于逐一执行各个步骤的说明。如果你遇到任何困难，第二种方法可能更好，因为你能够更好地隔离并纠正问题。\n\n无论你采用哪种方法，你都需要\
  \ Linux 内核和 Samba 的源码。你可以分别从 [`www.kernel.org`](http://www.kernel.org) 和 [`www.samba.org`](http://www.samba.org)\
  \ 获取这些代码，或者从许多常用的 Linux 下载站点（如 ftp://sunsite.unc.edu）获取。两个软件包都需要几分钟来编译和安装，因此即使你没有遇到问题，安装\
  \ NetBEUI 支持可能仍需要几分钟。\n\n一旦安装了 NetBEUI 支持，你可以使用几个命令来启用或操作该支持。这些随 NetBEUI 协议栈一起提供的命令如下：\n\
  \n*   `netb` — 输入此命令并接 `start` 在 Linux 上启动 NetBEUI。要停止 NetBEUI，输入 `netb stop`。在\
  \ Linux 上使用 NetBEUI 之前，你必须使用此工具。\n\n\n\n\n\n* `nbview` - 如果你想检查本地 NetBEUI 栈的状态，请使用此命令。该命令读取\
  \ `/proc/sys/netbeui` 文件（该文件包含此类信息），并对其进行格式化和解析，以便人类阅读。\n\n* `nbstatus` - 此命令显示指定机器或工作组的信息；例如，`nbstatus\
  \ SERVER` 会显示名为 `SERVER` 的计算机的信息。\n\n* `nbadmin` - 此命令允许你将 NetBEUI 绑定到特定的网络接口、从特定接口解绑\
  \ NetBEUI，或丢弃特定的 NetBEUI 会话。它分别通过使用 `bind`、`unbind` 和 `drop` 命令来实现这些操作，例如 `nbadmin\
  \ bind eth0` 或 `nbadmin drop 102`。（你可以通过 `nbview` 获取 NetBEUI 会话号。）\n\n在大多数情况下，你只需要执行\
  \ `netb start` 命令，然后启动 Samba。NetBEUI 栈为 `nmbd`（NetBIOS 名称守护进程）、`smbd`（SMB 守护进程）和\
  \ `smbclient`（文本模式 Samba 客户端）添加了一个参数，用于指定使用 TCP/IP 还是 NetBEUI。该参数为 `-Z <NETBEUI\
  \ | TCPIP>`。例如，要启动 `smbd` 使用 NetBEUI，你需要输入 `smbd -Z NETBEUI`。你还可以使用新的 `-S NAME`\
  \ 参数给 `smbd`，将系统的 NetBEUI 名称设置为 `NAME`。\n\n总而言之，通过使用带有 Procom NetBEUI 栈重新编译内核和 Samba、重启、关闭\
  \ Samba（如有必要）并输入以下命令，你可以将 Linux 转换为名为 `NAME` 的 NetBEUI SMB/CIFS 服务器：\n\n```bash\n\
  \ # netb start\n## nmbd -Z NETBEUI\n## smbd -Z NETBEUI -S NAME\n```\n\n你可以将这些命令放在启动脚本中，或者修改常规\
  \ Samba 启动脚本以包含这些更改。其他 Samba 特性（如共享定义）都按照第 7 章“通过 Samba 进行文件和打印机共享”所述运行。此过程的优点归结为两个因素：首先，它可以与一些支持\
  \ NetBEUI 但不支持 TCP/IP 的旧客户端配合，并且减少了外部通过 Samba 恶意访问计算机的概率，因为 NetBEUI 通常不会在互联网上传输。缺点是，NetBEUI\
  \ 支持在基于 TCP/IP 的 NetBIOS 中是重复的，后者适用于所有最近的 Linux 内核和 Samba 版本，且不需要对内核或 Samba 进行补丁或重新编译。\n\
  \n## 总结\n\n网络栈为构建常用的网络工具（客户端和服务器程序）提供了基础。像 Netscape、sendmail 以及书中讨论的许多程序必须与一个或多个网络栈匹配，而两台计算机需要兼容的网络栈才能在网络上进行通信。在\
  \ 21 世纪初，TCP/IP 是目前最流行的网络栈。TCP/IP 构成了互联网的基础，也是构建大多数 Linux 网络工具所赖以的网络栈。然而，也有其他替代方案。特别是\
  \ AppleTalk、IPX 和 NetBEUI 在过去的局域网中非常流行，主要用于文件和打印机共享任务。即使在今天，这些栈仍在许多小型网络中使用。Linux\
  \ 可以使用这三者，尽管 Linux 对每者的支持都有限。（对于 NetBEUI，Linux 内核和 Samba 必须经过补丁并重新编译才能使用该网络栈。）\n\
  \n# 第 4 章 启动服务器\n\n本书的大部分内容（特别是第二部分：本地网络服务器和第三部分：互联网服务器）涉及各种服务器的运行。一旦计算机启动，除了你出于安全原因而实施的任何计划停机或限制外，这些程序通常应该是始终可以访问的。因此，理解服务器如何启动至关重要。如果没有这些知识，你可能会在安装服务器后发现无法启动它，或者在更改配置后无法重启服务器。\n\
  \n幸运的是，在许多情况下，Linux 的配置使得服务器在安装后自动启动，或者至少在安装服务器后重启计算机时启动。你可以使用三种主要方法定期启动服务器：通过 System\
  \ V (SysV) 启动脚本；通过超级服务器（如 `inetd` 或 `xinetd`）；或者通过本地启动脚本。你始终可以通过手动编辑相应的配置文件或脚本来配置这些方法中的任何一种。对于大多数发行版，你还可以通过\
  \ GUI 工具完成此任务。本章涵盖了启动服务器的所有方法。后续章节将引用本章，说明最常用如何启动特定服务器。\n\n## 使用 SysV 启动脚本\n\nAT&T\
  \ 的 System V（或 SysV）Unix 为今天的 UNIX 和 Linux 系统建立了许多标准。其中之一就是启动系统服务（包括服务器）的方法。在 SysV\
  \ 方案中，每个服务都带有一个脚本，可以通过分别传递脚本 `start` 或 `stop` 参数来启动或停止该服务。许多此类启动脚本支持额外的参数，例如 `restart`\
  \ 用于关闭服务器并重新启动（例如，为了实现更改的配置）。\n\n### 注意\n\nSysV 启动脚本可以并且确实启动网络服务器以外的程序。在书中，我使用 *service*（服务）和\
  \ *daemon*（守护进程）来指代几乎持续访问的程序或操作系统特性，无论其是否与网络交互；*server*（服务器）用于指响应网络请求的程序，或运行服务器程序的计算机。书中讨论的大多数服务都是服务器。并不是所有人都按照这种方式使用这些术语；例如，有些人将\
  \ *service* 特指我所说的服务器程序。\n\nSysV 启动方案与计算机的 *runlevel*（运行级别）密切相关。每个运行级别关联一组特定的启动脚本，因此关联系统运行的一组特定服务。（SysV\
  \ 脚本可以启动的不只是网络服务器；它们还可以启动系统日志记录、文件系统处理器等。）因此，配置服务器通过 SysV 脚本启动与配置这些运行级别密切相关。这是通过更改存储在每个运行级别相关目录中的启动脚本链接名称来实现的。\n\
  \n\n\n\n\n尽管大多数发行版的 SysV 启动脚本的基本大纲相同，但在许多细节上存在差异。最重要的一点是，不同的发行版将启动脚本存放在不同的位置。它们可能通过不同的名称调用脚本，尽管这些差异通常并不极端。表\
  \ 4.1 总结了这几个主要 Linux 发行版的 SysV 布局差异。请注意，不同发行版在放置实际脚本的位置、放置与特定运行级别（runlevel）相关的脚本链接的位置，以及放置本地启动脚本的位置（稍后将在“使用本地启动脚本”章节中进行详细讨论）。在脚本链接的情况下，目录名中的\
  \ `?` 代表从 0 到 6 的数字，对应于相应的运行级别。\n\n### 表 4.1. 主要 Linux 发行版的启动脚本位置\n\n| 发行版 | 启动控制脚本\
  \ | SysV 脚本目录 | SysV 脚本链接目录 | 本地启动脚本 |\n| --- | --- | --- | --- | --- |\n| Caldera\
  \ OpenLinux Server 3.1 | `/etc/rc.d/rc.boot` | `/etc/rc.d/init.d` | `/etc/rc.d/rc`?.d`\
  \ | `/etc/rc.d/rc.local` |\n| Debian GNU/ Linux 2.2 | `/etc/init.d/rcS` | `/etc/init.d`\
  \ | `/etc/rc`?.d` | `/etc/rc.boot` 中的文件 |\n| Linux Mandrake 8.1 | `/etc/rc.d/rc.sysinit`\
  \ | `/etc/rc.d/init.d` | `/etc/rc.d/rc`?.d` | `/etc/rc.d/rc.local` |\n| Red Hat\
  \ Linux 7.2 | `/etc/rc.d/rc.sysinit` | `/etc/rc.d/init.d` | `/etc/rc.d/rc`?.d` |\
  \ `/etc/rc.d/rc.local` |\n| Slackware Linux 8.0 | `/etc/rc.d/rc.S` | `/etc/rc.d`\
  \ | N/A | `/etc/rc.d` 中的各种文件 |\n| SuSE Linux 7.1 | `/etc/init.d/boot` | `/etc/rc.d`\
  \ | `/etc/rc.d/rc`?.d` | `/etc/rc.d/boot.local` |\n| TurboLinux 7.0 | `/etc/rc.d/rc.sysinit`\
  \ | `/etc/rc.d/init.d` | `/etc/rc.d/rc`?.d` | `/etc/rc.d/rc.local` |\n\n### 注意\n\
  ![注意](img/note.gif)\n\n运行级别是一个 0–6 的数字，对应于一组特定的运行服务。稍后将在“设置和更改运行级别”章节中进行更详细的描述。现在请记住，计算机启动时会进入特定的运行级别，这意味着它会运行与该级别相关的\
  \ SysV 启动脚本。你也可以在计算机启动后更改运行级别。\n\n### 注意\n![注意](img/note.gif)\n\n在本章中，我提指的是 SysV\
  \ 脚本目录和 SysV 脚本链接目录。这些是表 4.1 中列出的位置，如果你选择修改文件，那么在适当的位置进行修改是非常重要的。\n\n几个发行版（特别是 Red\
  \ Hat、Mandrake、TurboLinux 以及较小程度的 Caldera）彼此非常相似，特别是在 SysV 脚本（`/etc/rc.d/init.d`）和这些脚本的链接（`/etc/rc.d/rc`?.d`）的放置方面。其他发行版将脚本放在略有不同的位置。Slackware\
  \ 在方面最为特殊。它不是在以运行级别命名的目录中运行单个脚本，而是为每个运行级别使用单个脚本。例如，`/etc/rc.d/rc.4` 控制运行级别 4 的启动。\n\
  \n### 手动启用或禁用启动脚本\n\n如果你发现需要启用或禁用通过 SysV 启动脚本启动的服务器，一种方法是调整启动脚本或链接。禁用服务器的一种方法是从\
  \ SysV 脚本目录中删除启动脚本。这是一种影响所有运行级别的快速修复方法，但并不优雅。如果你想启动服务器而不是禁用它，这种方法也没有帮助。\n\n一种更优雅的解决方案是重命名\
  \ SysV 链接目录中对应于你的运行级别的启动脚本链接。例如，要禁用服务器，将其重命名为以 `K` 开头而不是 `S`；要启用它，则反转此过程。此过程的困难之处在于，杀死服务器时的序列号与启动时可能不相同。避免这一潜在陷阱的一种方法是找到所有运行级别中该脚本的所有链接。如果其他任何运行级别中有你想要配置的，那么你就找到了序列号。例如，以下命令可以在\
  \ Mandrake 系统上找到所有 Postfix 邮件服务器启动脚本的链接：\n\n```\n$ find /etc/rc.d -name \"*postfix\"\
  \n/etc/rc.d/rc0.d/K30postfix\n/etc/rc.d/rc1.d/K30postfix\n/etc/rc.d/rc2.d/S80postfix\n\
  /etc/rc.d/rc3.d/S80postfix\n/etc/rc.d/rc4.d/S80postfix\n/etc/rc.d/rc5.d/S80postfix\n\
  /etc/rc.d/rc6.d/K30postfix\n/etc/rc.d/init.d/postfix\n```\n\n此序列显示 Postfix 在运行级别\
  \ 2 到 5 中以序列号 80 启动，并在运行级别 0、1 和 6 中以序列号 30 关。如果你想在运行级别 3 中禁用 Postfix，可以通过将该运行级别目录下的\
  \ `S80postfix` 重命名为 `K30postfix` 来实现。\n\n\n\n\n\n如果你想*临时地*启动或停止服务器，或者想在不重启电脑或不调整运行级别（runlevel）的情况下立即启动更改，可以通过运行启动脚本并配合\
  \ `start` 或 `stop` 参数来实现。例如，为了在 Mandrake 系统上立即停止 Postfix，你可以在终端中输入以下命令：\n\n```\n\
  \ # /etc/rc.d/init.d/postfix stop\n```\n\n大多数 Linux 发行版都会显示一条消息，报告尝试关闭服务器的情况以及操作是否成功。在启动\
  \ SysV 脚本时，会显示一条关于启动成功的消息。（事实上，当你启动电脑时，你可能会在看到内核启动消息之后看到这些消息在屏幕上滚动。）\n\n在 Slackware\
  \ 的情况下，你不应该通过重命名、添加或删除启动脚本或其链接，而应该编辑所涉及运行级别的单个启动脚本文件。例如，如果你想更改运行级别 4 的行为，则需要编辑 `/etc/rc.d/rc.4`。不过，大多数服务器并不是在这些特定运行级别的脚本中启动的；它们是在\
  \ `/etc/rc.d/rc.inet2` 中启动的，而非常基础的网络工具是在 `/etc/rc.d/rc.inet1` 中启动的。要更改你的配置，你必须手动修改这些脚本，就像处理本地启动脚本一样，正如“使用本地启动脚本”节描述的那样。\n\
  \n## 使用启动脚本工具\n\n某些发行版包含了帮助你控制启动脚本的实用。这些工具非常有用，因为它们减少了脚本命名出现错误的概率。例如，自动化工具不会将 `S80postfix`\
  \ 误写为 `s80postfix`（使用小写 `s` 代替大写 `S`）。遗憾的是，并不是所有的发行版都支持这些工具——它们在 Red Hat 及其衍生发行版（如\
  \ Mandrake）中最为常见。从一个发行版安装其中一个工具并在另一个发行版中使用不太可能成功，因为 SysV 脚本的位置和启动序列号存在差异。\n\n###\
  \ NOTE\n\n![NOTE](img/note.gif)\n\n本节侧重于基于文本的启动脚本工具。<acronym class=\"acronym\">GUI</acronym>\
  \ 工具（稍后在“使用 GUI 工具”节中描述）也可以完成此任务。\n\n### 使用 `chkconfig`\n\n用户界面最原始的 SysV 启动脚本工具是\
  \ `chkconfig`。该程序是一个非交互式命令——你必须在单行命令行中为它提供完成工作所需的信息。该命令的语法如下：\n\n```\n chkconfig\
  \ <—list|—add|—del> [name]\nchkconfig [—level levels] name [on|off|reset]\n```\n\
  \n该命令的第一种格式用于获取当前配置信息（使用 `—list`），或在 SysV 链接脚本目录中添加或删除链接（分别使用 `—add` 或 `—del`）。第二种格式用于通过更改前述的\
  \ SysV 链接名称，在某些或所有运行级别中启用或禁用脚本。一些示例将有助于明确此命令的使用。\n\n假设你想知道 Postfix 是如何配置。如果你知道 Postfix\
  \ 启动脚本名为 `postfix`，可以输入以下命令来检查其配置：\n\n```\n # chkconfig —list postfix\npostfix \
  \   0:off   1:off   2:on    3:on    4:on    5:on    6:off\n```\n\n此输出显示了 Postfix\
  \ 在七个运行级别中的状态。你可以通过前文描述的 `find` 命令来验证这一点。当 `chkconfig` 显示 `on` 值时，启动链接文件名应以 `S`\
  \ 开头；当 `chkconfig` 显示 `off` 值时，启动链接文件名应以 `K` 开头。\n\n如果你输入 `chkconfig —list` 而不指定启动脚本文件名，`chkconfig`\
  \ 将显示所有启动脚本的状态，如果你的系统使用了 `xinetd`，可能还会显示通过 `xinetd` 启动的服务。\n\n`—add` 和 `—del` 选项分别在链接不存在时添加或在存在时删除。这两个选项都需要你指定原始启动脚本的名称。例如，`chkconfig\
  \ —del postfix` 会移除所有 Postfix SysV 启动脚本链接。结果是 Linux 将不再通过 SysV 启动脚本启动服务器，也不会在更改运行级别时尝试更改服务器状态。如果你想通过超级服务器（super\
  \ server）或本地配置脚本启动服务器，你可能会这样做。你可以使用 `—add` 参数来撤销此更改。\n\n你可能会使用 `on`、`off` 或 `reset`\
  \ 选项进行大部分 `chkconfig` 更改。这些选项为指定的运行级别启用服务器、禁用服务器或将服务器恢复到其默认设置。（如果省略了 `—level` 选项，更改将适用于所有运行级别。）例如，假设你想禁用运行级别\
  \ 3 中的 Postfix。你可以通过输入以下命令来实现：\n\n```\n # chkconfig —level 3 postfix off\n```\n\n\
  此命令不会有任何输出，所以如果你觉得需要验证它是否已生效，应该使用 `—list` 选项或在启动脚本链接目录中查找已更改的文件。你可以使用 `on` 代替 `off`\
  \ 来启用服务器。如果你想影响多个运行级别，可以在一个字符串中列出所有运行级别，如 `345`。\n\n```\n # chkconfig —level 345\
  \ off\n```\n\n如果你对设置进行了实验并想将其恢复为默认值，可以使用 `reset` 选项：\n\n```\n # chkconfig reset\n\
  ```\n\n此命令将重置 Postfix 的 SysV 链接。你可以通过在命令中包含 `—level` `levels` 选项来重置单个运行级别。虽然 `chkconfig`\
  \ 通常被认为是管理 SysV 脚本的方法，但它也可以用于许多系统上的 `xinetd` 配置。如果 `chkconfig` 配置为将例如 <acronym class=\"\
  acronym\">FTP</acronym> 服务器视为通过超级服务器启动的服务，你可以像 <acronym class=\"acronym\">FTP</acronym>\
  \ 服务通过 SysV 脚本启动一样操作此配置。区别在于 `—level` `levels` 参数无效，且 `—list` 选项不显示运行级别信息。相反，任何通过超级服务器启动的服务将在\
  \ `xinetd` 运行的级别中运行。此外，`—add` 和 `—del` 选项分别类似于 `on` 和 `off`；`/etc/xinetd.d` 配置不会被删除，只是禁用，正如接下来的“使用\
  \ xinetd”节所述。\n\n当你 更改 SysV 配置时，它*不会*自动更改正在运行的服务。例如，如果你重新配置系统以禁用 `sshd`，该服务器在没有人为干预的情况下不会立即关闭，例如运行带有\
  \ `stop` 选项的 SysV 脚本来停止服务器。\n\n### 使用 `ntsysv`\n\n`ntsysv` 程序为操作服务器启动提供了一个基于文本的菜单环境。运行该程序，输入其名称，可选跟随\
  \ `—level` `levels`，其中 `levels` 是你想要修改的一个或多个运行级别。如果你省略此参数，`ntsysv` 将仅修改当前运行级别的配置。无论何种方式，结果都类似于图\
  \ 4.1。\n\n![The ntsysv program provides an easy-to-use interface for SysV configuration.](img/04fig01.gif)\n\
  \n**图 4.1. `ntsysv` 程序提供了一个易于使用的 SysV 配置界面。**\n\n\n\n\n`ntsysv` 显示了所有具有 SysV 启动脚本的服务器。某些版本还会显示通过\
  \ `xinetd` 启动的服务器。要启用或禁用服务器，请使用键盘上的方向键将光标移动到想要调整的服务器上，然后按空格键切换服务器的开启或关闭。服务器名称左侧框中的星号（`*`）表示该服务器处于活动状态；空框则表示服务器已禁用。完成更改后，使用\
  \ `Tab` 键高亮 `OK` 按钮，然后按 `Enter` 键退出程序并保存更改。\n\n与 `chkconfig` 一样，你无法调整由超级服务器（super\
  \ server）调制的服务器所运行的特定运行级别（runlevels），除非更改超级服务器本身的运行级别。此外，禁用服务器不会导致其立即关闭；你必须像之前描述的那样手动关闭服务器，或者如果你的目标服务器由超级服务器处理，则通过重启超级服务器来实现\n\
  \n## 设置和更改运行级别\n\n前面的讨论提到了运行级别，但对其定义的描述仅是极的。运行级别和 SysV 启动脚本之间的联系非常紧密。当计算机启动时，它会进入特定的运行级别。最终，这意味着计算机会执行\
  \ SysV 脚本链接目录中的链接所指向的启动脚本。具体来说，Linux 会向链接以 `S` 开头的脚本传递 `start` 参数，并向链接以 `K` 开头的脚本传递\
  \ `stop` 参数。\n\n然而，Linux 如何知道启动时应该进入哪种运行级别呢？这是在 `/etc/inittab` 文件中设置的，该文件是 `init`\
  \ 的配置文件（Linux 运行的第一个进程也是所有其他进程的祖先）。具体来说，`/etc/inittab` 包含如下行：\n\n```\n id:5:initdefault:\n\
  ```\n\n开头的 `id` 是标识此行的键，但后面的数字（此例中 `5`）才是你用来*永久*设置运行级别的的值。如果你更改了此值并重启，计算机将在不同的运行级别启动。运行级别\
  \ 0、1 和 6 有特殊含义——它们分别对应系统关机、单用户模式和系统重启。运行级别 2 到 5 是普通运行级别，但它们的精确含义因发行版而异。对于 Caldera、Red\
  \ Hat、Mandrake、SuSE 7.3 和 TurboLinux，运行级别 3 是标准的文本模式启动（X *未*启动），而运行级别 5 是 GUI 登录模式（X\
  \ *已*启动，并运行 GUI 登录程序）。较早版本的 SuSE 使用运行级别 2 和 3 代替 3 和 5，Slackware 使用 3 和 4 用于文本模式和\
  \ GUI 登录。默认情况下，Debian 在不同的普通运行级别下不会以不同方式运行 SysV 脚本，尽管它在 3 以上级别运行的文本模式登录工具较少（此细节由\
  \ `/etc/inittab` 的后续行处理）。大多数发行版在它们的 `/etc/inittab` 文件中包含了一系列注释，描述了每个运行级别的功能，如果你需要更多信息或正在使用书中未讨论的发行版，请查找这些内容。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n*不要*将默认运行级别设置为 0 或 6。这些值将导致计算机在启动时立即关机或重启。任何一种操作都会导致计算机无法使用，尽管你可以通过紧急启动盘或其他恢复方法或工具，并编辑\
  \ `/etc/inittab` 来修正错误。\n\n如果你想临时更改运行级别，可以使用 `telinit` 命令（`init` 在大多数系统上也有效）。该命令的语法如下：\n\
  \n```\n telinit [-t seconds] [runlevel]\n```\n\n当你更改运行级别时，某些进程可能被杀死。Linux 可以通过 `SIGTERM`\
  \ 或 `SIGKILL` 信号来实现这一点。前者是一种更礼貌的方式；它允许程序关闭自己的文件等。相比之下，`SIGKILL` 会不留情面地直接杀死程序，这可能导致文件损坏。当你更改运行级别时，`telinit`\
  \ 首先尝试使用 `SIGTERM`。五秒后，如果进程尚未退出，`telinit` 将发送 `SIGKILL`。如果指定了 `-t` `seconds` 参数，将更改此间隔。在大多数情况下，默认的五秒是充足的。\n\
  \n`runlevel` 规范是运行级别的单字符代码。显而易见的是，你可以提供运行级别数字。然而，你还可以传递某些具有特殊含义的字符：\n\n*   `a`、`b`\
  \ 或 `c`——`/etc/inittab` 中的某些条目使用运行级别 `a`、`b` 或 `c` 用于特殊用途。如果你向 `telinit` 指定此选项，程序将只处理那些\
  \ `/etc/inittab` 条目；系统的运行级别不会改变。\n*   `Q` 或 `q`——如果你将这些值之一作为 `runlevel`，`telinit`\
  \ 将重新检查 `/etc/inittab` 文件并启动任何相关项。\n*   `S` 或 `s`——此选项会导致系统进入单用户模式。\n*   `U` 或 `u`——此选项会导致\
  \ `init` 进程重启。\n\n你为什么要更改运行级别？在大多数发行版中，最重要的是 X 服务器。在计算机运行时更改运行级别允许你快速启用或禁用一组服务器，或者当你的系统配置为启动\
  \ X 时，如果你想临时关闭 X，可以退出 GUI 模式。\n\n## 使用 inetd\n\n通常，一个服务器运行并将其绑定到特定的端口（通过协议类型和 1\
  \ 到 65535 之间的数字标识的资源）。入的请求被重定向到与服务器相关的特定端口。例如，简单邮件传输协议（SMTP）邮件服务器传统上使用 TCP 端口 25，而文本传输协议（HTTP）服务器（Web\
  \ 服务器）通常使用 TCP 端口 80。\n\n`inetd` 程序是 Linux 两种常用的超级服务器之一。这些服务器充当中间人；计算机本身不运行目标服务器，而是运行超级服务器，超级服务器将其链接到它需要处理的所有服务器所使用的端口。然后，当连接到这些端口之一时，超级服务器会启动目标服务器并让其处理传输。与直接运行服务器相比，这有两个优势。首先，减轻了内存负载；与其处理的服务器相比，超级服务器消耗极\
  \ RAM RAM，特别是当它处理许多服务器时。其次，超级服务器可以根据各种标准过滤入请求，这可以提高系统的安全性。缺点是超级服务器启动目标服务器需要时间，因此连接到服务器的时间可能会增加，尽管通常只增加一秒左右。作为一个一般规则，对于小型或很少使用的服务器使用超级服务器是好的，而大型且频繁使用的服务器应该直接运行。\n\
  \n## /etc/inetd.conf 文件格式\n\n你可以通过 `/etc/inetd.conf` 文件配置 `inetd`。除了注释（以井号 `#` 开头的\
  \ `inetd` 忽略的行）外，`/etc/inetd.conf` 由一系列行组成，每行定义一个单一服务器。示例行类似于：\n\n\n\n\n\n```\n\
  telnet stream tcp nowait root /usr/sbin/tcpd in.telnetd\n```\n\n每行由一系列字段组成，由空格或制表符分隔。每个字段的含义如下：\n\
  \n- **服务器名称（Server name）**——第一个字段是服务器协议名称，记录在 `/etc/services` 中。在前面的示例中，服务器协议名称为\
  \ `telnet`，如果你检查 `/etc/services`，你会发现该名称与 `23/tcp` 关联——换句话说就是 TCP 端口 23。为了让 `inetd`\
  \ 处理服务器，`/etc/services` 中必须有条目。因此，如果你想让 `inetd` 处理某些特殊的服务器，可能需要编辑 `/etc/services`。不过在大多数情况下，`/etc/services`\
  \ 已经包含了相应的条目。\n\n- **Socket 类型（Socket type）**——第二个字段与协议使用的网络套 类型有关。可能的值有 `stream`、`dgram`、`raw`、`rdm`\
  \ 和 `seqpacket`。\n\n- **协议类型（Protocol type）**——第三个字段是协议类型的名称，在此语境下，它指的是底层网络栈协议，如\
  \ TCP 或 UDP。可能的协议值出现在 `/etc/protocols` 中，但最常见的值是 `tcp` 和 `udp`。\n\n- **等待/不等待（Wait/Nowait）**——第四个字段仅取两个值之一：`wait`\
  \ 或 `nowait`，并且仅对数据报（`dgram`）socket 类型有意义（其他 socket 类型通常使用 `nowait` 值）。大多数数据报服务器连接到\
  \ socket 并释放 `inetd` 以处理后续的连接尝试。这些服务器被称为多线程服务器，它们需要 `nowait` 条目。那些连接到 socket、处理所有输入然后超时的服务器被称为单线程服务器，它们需要\
  \ `wait` 条目。你可以选择性地在这些值后添加一个数字，并用句号分隔，例如 `wait.60`。这指定了 `inetd` 每分钟可以启动的给定类型服务器的最大数量。默认值为\
  \ `40`。\n\n- **用户名（Username）**——你可以让 `inetd` 以特定用户的权限启动服务器。这是一项重要的安全特性，因为限制不需要广泛访问系统的服务器的权限，可以防止程序漏洞导致安全泄露。例如，Apache\
  \ Web 服务器通常不需要特殊权限，因此你可以以 `nobody` 或某些专门为 Apache 设计的特殊账户启动它。前面的示例显示用户名为 `root`，是因为启动\
  \ Telnet 服务器所需的登录进程需要 `root` 权限。如果你添加一个句号和组组名，则指定的组名将用于服务器的组组权限。例如，`nobody.nogroup`\
  \ 将以用户名 `nobody` 和用户组 `nogroup` 启动服务器。\n\n- **服务器程序（Server program）**——第六个字段指定了\
  \ `inetd` 在检测到入站连接时启动的服务器程序名称。前面的示例给出 `/usr/sbin/tcpd` 作为该程序名。实际上，`tcpd` 并不是一个服务器；它是\
  \ TCP Wrappers 程序的程序文件，稍后会描述。大多数使用 `inetd` 的 Linux 发行版也使用 TCP Wrappers，因此通过 `tcpd`\
  \ 启动大多数 `inetd` 的服务器。你可以对任何喜欢的服务器跳过 TCP Wrappers，尽管由于后文描述的原因，通常最好使用 TCP Wrappers。\n\
  \n- **服务器程序参数（Server program arguments）**——最后一个字段是可选的。如果存在，它包含了要传递给服务器程序的任何参数。这些参数可能会修改服务器的行为，告诉它配置文件的位置等。对于通过\
  \ TCP Wrappers 启动的服务器，参数是最终目标服务器的名称，例如前面示例中的 `in.telnetd`。（如果最终服务器需要任何参数，你可以将该服务器的参数添加到此列表中。）\n\
  \n你可以使用任何喜欢的文本编辑器编辑 `/etc/inetd.conf`。请确保你创建的任何新条目或修改的现有条目都独占一行。（长文件名、服务器参数等有时产生的行过长会导致某些编辑器尝试将其换行到两行，这会导致问题）。如果你需要为已安装的服务器添加条目，请查阅服务器文档以了解其\
  \ `inetd.conf` 条目应该什么样。在某些情况下，你可以参考现有条目进行建模，但在不知道为服务器名称、socket 类型等应输入什么值的情况下，该条目可能无法工作。\n\
  \n大多数使用 `inetd` 的发行版都附带一个 `/etc/inetd.conf` 文件，其中包含许多不同服务器的条目。这些条目中的许多被注释掉了，因此它们是非激活状态。如果安装了相应的服务器，你可以通过取消该行的注释来激活服务器。某些\
  \ `inetd.conf` 文件为任何特定服务包含多个条目；例如，一个文件可能为不同的服务有两三个不同的条目。\n\n### TIP\n\n![TIP](img/tip.gif)\n\
  \n安装 Linux 后你应该执行的第一件事之一是检查 `inetd.conf`（或稍后描述的 `xinetd` 配置文件），并注释掉与你不需要的服务器相关的条目。一个好的原则是消除任何你不理解的条目；Linux\
  \ 启动不需要列出的任何服务器。消除不必要的服务器可以通过限制攻击途径来提高安全性。遗憾的是，你不能对 SysV 启动脚本进行这样做，因为其中许多脚本启动了 Linux\
  \ 运行所需并赖的关键服务。\n\n## 使用 TCP Wrappers\n\n如前所述，TCP Wrappers 充当了 `inetd` 和最终目标服务器之间的中间人。这样做是为了安全考虑：TCP\
  \ Wrappers 可以应用规则来决定是否允许给定连接，从而保护服务器免受意外访问。例如，假设只想允许本地域网的人访问你计算机的 Telnet 服务器。如果你直接运行\
  \ Telnet 服务器，它必须被编写为拒绝不需要的访问，但并非所有服务器都包含此类代码。将限制访问的责任放在 TCP Wrappers 中，可以在不需要大量重写所有服务器的情况下扩展系统的灵活性。\n\
  \nTCP Wrappers 通过两个文件进行控制：`/etc/hosts.allow` 和 `/etc/hosts.deny`。这些文件具有相同的格式，但作用相反——`hosts.allow`\
  \ 指定允许访问该计算机的计算机，拒绝所有其他的访问；`hosts.deny` 指定拒绝访问的计算机，允许所有其他的访问。当一个服务器在两个文件中都列出时，`hosts.allow`\
  \ 具有优先级。这允许你在 `hosts.deny` 中设置限制性策略，但通过覆盖它来授予特定计算机访问权限。例如，你可以在 `hosts.deny` 中禁止所有计算机访问，然后在\
  \ `hosts.allow` 中放宽该限制。如果两个文件中都没有指定服务器（无论是显式指定还是通过后文讨论的通配符），TCP Wrappers 将允许所有系统访问该服务器。\n\
  \n### NOTE\n\n![NOTE](img/note.gif)\n\n\n\n\n\n在某些方面，`TCP` Wrappers 类似于本地防火墙，正如在第\
  \ 25 章 配置 iptables 中讨论的那样。防火墙提供更广泛的保护，但 `TCP` Wrappers 可以在防火墙失效时提供冗余，并提供一些 `iptables`\
  \ 无法提供的功能，例如根据 `NIS` 网络组名称进行过滤的能力。\n\n与其他许多配置文件一样，行首的井号（`#`）表示注释。其他行采用以下形式：\n\n\
  ```\ndaemon-list : client-list\n```\n\n`daemon-list` 是一个适用于规则的一个或多个服务器的列表。如果列表包含多个服务器，可以使用逗号或空格分隔服务器名称。这些名称是在\
  \ `/etc/services` 中列出的。系统也接受 `ALL` 通配符；如果 `daemon-list` 为 `ALL`，则该规则适用于所有由 `TCP`\
  \ Wrappers 控制的服务器。\n\n### 警告\n\n![警告](img/warning.gif)\n\n记住，并不是所有的服务器都通过 `TCP`\
  \ Wrappers 运行。因此，`daemon-list` 的 `ALL` 通配符可能并不适用于计算机上运行的所有服务器。同样，在 `daemon-list`\
  \ 中列出服务器除非该服务器通过 `inetd` 和 `TCP` Wrappers 运行或直接使用 `TCP` Wrappers，否则不会对其进行保护。\n\n\
  `client-list` 是要允许或拒绝的计算机列表。与 `daemon-list` 类似，`client-list` 可以由单个条目或逗号、空格分隔的列表组成。你可以通过几种方式指定计算机：\n\
  \n*   `IP` 地址——你可以列出完整的 `IP` 地址，例如 `10.102.201.23`。此类条目将仅匹配该 `IP` 地址。\n*   `IP`\
  \ 地址范围——有几种方法指定 `IP` 地址范围。最简单的方法是提供少于四个完整字节的内容并在后跟一个点。例如，`10.102.201` 匹配 `10.102.201.0/24`\
  \ 网络。你也可以使用 `IP` 地址/子网掩码对，例如 `10.102.201.0/24`。这也支持 IPv6 地址，格式为 `[n:n:n:n:n:n:n:n]/len`，其中\
  \ `n` 值是 IPv6 地址，`len` 是匹配范围的位长度。\n*   主机名——你可以为计算机提供完整的主机名，例如 `badcracker.threeroomco.com`。这将仅匹配该计算机。但是，由于这种方法依赖于主机名查找，如果你的\
  \ `DNS` 服务器宕机或控制域名的人修改了其条目，就会出现问题。\n*   域名——你可以像匹配单个主机名一样匹配整个域名或子域名。区别在于，你必须在域名名前加一个点，例如\
  \ `.threeroomco.com`——这个示例匹配 threeroomco.com 域中的所有计算机。\n*   `NIS` 网络组名称——如果字符串以\
  \ 符号（`@`）开头，则该字符串被视为网络信息服务 (`NIS`) 网络组名称。这种方法依赖于你的网络具有运行良好的 `NIS` 配置。\n\n此外，`client-list`\
  \ 规范支持的通配符比 `daemon-list` 规范更多。你可以使用的特定通配符包括：\n\n*   `ALL`——此通配符匹配所有计算机。\n*   `LOCAL`——此通配符用于根据主机名匹配所有本地计算机。如果计算机的主机名缺少点，则被视为本地。\n\
  *   `UNKNOWN`——此通配符匹配你的名称解析系统未知的主机名的计算机。\n*   `KNOWN`——此通配符匹配主机名和 `IP` 地址均为系统已知的计算机。\n\
  *   `PARANOID`——此通配符匹配名称和 `IP` 地址均已计算机。\n\n最后三个选项应该谨慎使用，因为它们通常依赖于 `DNS` 的正常运行。例如，如果\
  \ `DNS` 系统宕机，你可能无法验证它们。作为一个简短但完整的 `/etc/hosts.allow` 文件的示例，请以下内容：\n\n```telnet,ftp\
  \ : 192.168.34.0/24\nssh : .pangaea.com\n```\n\n第一行为 `telnet` 和 `ftp` 服务器指定了相同的限制，仅允许访问\
  \ `192.168.34.0/24` 网络和 `.pangaea.com` 域名。第二行适用于 `ssh` 并限制访问到本地计算机。由于没有列出其他服务器，`TCP`\
  \ Wrappers 不会阻止访问任何服务器。例如，如果你通过 `inetd` 和 `TCP` Wrappers 运行 Apache，使用此配置每个人都会获得访问权限。\n\
  \n除了匹配整个计算机外，你还可以使用 `user@computer` 格式匹配远程系统的单个用户。然而，这种格式要求客户端计算机运行 `ident`（又称 `auth`）服务器，该服务器返回使用给定端口的用户名。你自己的服务器可以查询客户端的\
  \ `ident` 服务器有关连接的信息，从而获取与该尝试关联用户名。但是，这可能会导致额外的延迟，而且信息通常是不可信的，特别是来自互联网上的随机主机时。（你更有可能想使用此功能来控制来自你所控制系统的特定用户的访问。）\n\
  \n`EXCEPT` 操作是另一个特殊关键字；它指定了所述规则的例外。例如，考虑以下 `/etc/hosts.deny` 条目：\n\n```\nwww : badcracker.org\
  \ EXCEPT goodguy@exception.badcracker.org\n```\n\n此示例拒绝来自 badcracker.org 域内所有计算机访问\
  \ Web 服务器，除非连接来自 `goodguy@exception.badcracker.org`。（因为 `/etc/hosts.allow` 的优先级高于\
  \ `/etc/hosts.deny`，前者的条目也可以覆盖后者的条目。）\n\n如果你的目标是运行一个非常安全的系统，你可能想从以下 `/etc/hosts.deny`\
  \ 文件开始：\n\n```\nALL : ALL\n```\n\n这阻止了由 `TCP` Wrappers 处理的所有服务器的所有计算机的访问。你必须在 `/etc/hosts.allow`\
  \ 中显式开放对其他服务器的访问。你应该尽可能少地开放访问。例如，对于 Telnet 等敏感服务器，你可能只允许来自特定网络或域域域。（Telnet 以未加密的形式传递所有数据，因此对于整个互联网登录来说是一个很糟糕的选择。请参见第\
  \ 13 章 维护远程登录服务器中关于此问题的讨论。）\n\n## 使用 `xinetd`\n\n\n\n\n传统上，`inetd` 一直是 Linux 系统使用的超级服务器。然而，从\
  \ 2000 年开始，开始转向使用替代方案 `xinetd`（发音为“zi-net-dee”）。初步来看，你可以将 `xinetd` 视为 `inetd` 和\
  \ `TCP` Wrappers 的结合。尽管这只是一个粗略的类比；`xinetd` 有些是 `inetd` 配合 `TCP` Wrappers 做不到的，而\
  \ `inetd` 配合 `TCP` Wrappers 也有 `xinetd` 单独做不到的。但最终，`xinetd` 更灵活，因为它在需要时可以与 `TCP`\
  \ Wrappers 结合以扩展其灵活性。在 2002 年初，Red Hat 和 Mandrake 是默认使用 `xinetd` 的两个主要发行版，但你可以根据喜在其他发行版中添加\
  \ `xinetd`。\n\n## /etc/xinetd.conf 文件格式\n\n作为一个具有扩展功能的新超级服务器，`xinetd` 需要一种新的文件格式。`/etc/xinetd.conf`\
  \ 文件控制 `xinetd`，但 Red Hat 和 Mandrake 仅提供了一个的 `xinetd.conf` 文件。该文件包含了所有服务器的默认设置，以及一行导致\
  \ `xinetd` 读取 `/etc/xinetd.d` 中的所有文件并将其视为补充配置文件的指令。因此，`xinetd` 的配置类似于 SysV 配置，因为每个服务器都有一个以服务器命名的自己的控制文件，例如通过\
  \ `/etc/xinetd.d/telnet` 来控制 Telnet 服务器。如果你愿意，也可以仅使用主 `xinetd.conf` 文件来配置 `xinetd`，但\
  \ Red Hat 和 Mandrake 的服务器软件包通常会将它们的启动文件放在 `/etc/xinetd.d` 中。\n\n无论 `xinetd` 服务器定义位于\
  \ `/etc/xinetd.conf` 还是 `/etc/xinetd.d` 中的文件，它都跨越多行；然而，基础定义包含了与 `inetd.conf` 条目相同的信息。例如，以下\
  \ `xinetd` 定义与之前介绍的 Telnet 服务器的 `inetd.conf` 条目基本等效：\n\n```\n service telnet\n{\n\
  \        socket_type = stream\n        protocol    = tcp\n        wait        =\
  \ no\n        user        = root\n        server      = /usr/sbin/in.telnetd\n}\n\
  ```\n\n此条目提供了与 `inetd.conf` 条目相同的信息。然而，`xinetd` 配置文件格式显式地标记了每个条目并将其分在多行。虽然此示例展示数据的顺序与\
  \ `inetd` 配置相同，但这种顺序并不是强制的。此外，`xinetd` 定义并没有调用 `TCP` Wrappers，尽管它可以这样做做（你可以在 `server`\
  \ 行上列出 `/usr/sbin/tcpd`，然后添加一个 `server_args` 行列出 `/usr/sbin/in.telnetd`，将 Telnet\
  \ 服务器的名称传递给 `TCP` Wrappers）。\n\n除了标准的 `inetd` 功能外，`xinetd` 还提供了许多配置选项来扩展其功能。这些选项大部分是出现在服务定义大括号之间的独立行项目。这些选项中最重要的包括：\n\
  \n*   **安全特性**。如前所述，`xinetd` 提供了许多安全选项，其中许多与 `TCP` Wrappers 提供的选项大致等效。这些将在后续章节“设置访问控制特性”中进行更深入的讨论。\n\
  \n*   **禁用服务器**。你可以通过注释掉配置行来禁用 `inetd` 服务器。你也可以向 `xinetd` 服务器定义中添加 `disable = yes`\
  \ 行来实现相同的目标。在主 `/etc/xinetd.conf` 文件中通过 `defaults` 部分使用 `disabled = server_list`\
  \ 也可以实现相同效果，其中 `server_list` 是用空格分隔的服务器名称列表。各种配置工具使用这些方法之一来禁用服务器，事实上，对于激活的服务器，可能存在\
  \ `disable = no` 行。\n\n*   **重定向**。如果你想将请求传递到另一台计算机，可以使用 `redirect = target` 选项，其中\
  \ `target` 是接收请求的计算机的主机或 IP 地址。例如，如果在 dummy.threeroomco.com 的 `/etc/xinetd.d/telnet`\
  \ 文件中包含 `redirect = 192.168.3.78` 行，则访问 dummy.threeroomco.com 上 Telnet 服务器的尝试将重定向到\
  \ 192.168.3.78 内部计算机。你可能想在 `NAT` 路由器上（见第 25 章 配置 iptables）使用此功能，以允许内部计算机充当外部世界的服务器。`iptables`\
  \ 工具可以在较低层上实现相同的目标，但在 `xinetd` 中执行允许你应用 `xinetd` 的访问控制特性。\n\n*   **日志**。你可以使用 `log_on_success`\
  \ 和 `log_on_failure` 选项来精调 `xinetd` 对访问尝试的日志，这些选项决定了 `xinetd` 在成功和失败访问服务器时记录哪些信息。这些选项的取值包括\
  \ `PID`（服务器的进程 ID，或 PID）、`HOST`（客户端地址）、`USERID`（与访问尝试相关的客户端系统上的用户 ID）、`EXIT`（访问终止的时间和退出状态）以及\
  \ `DURATION`（会话持续的时间）。在设置这些值时，你可以使用 `+=` 或 `-=` 符号而不是 `=` 来从默认值中增加或减去你想要记录的特性。\n\
  \n*   **连接负载限制**。你可以通过几种方式限制 `xinetd` 处理的连接数量。一种是 `per_source` 选项，它指定 `xinetd` 在任何时刻从任何给定源接受的连接数（`UNLIMITED`\
  \ 设置 `xinetd` 接受无限数量的连接）。`instances` 选项指定 `xinetd` 将产生的最大进程数（此值可能大于 `per_source`\
  \ 值）。`cps` 选项接受两个空格分隔的值：`xinetd` 每秒接受的连接数，以及在达到此限制后再次启用访问之前暂停的秒数。你可以使用 `nice` 选项调整\
  \ `xinetd` 运行的服务器的调度优先级，其设置值的方式与 `nice` 程序非常相似。最后，`max_load` 取一个浮点值，代表系统平均负载，当负载高于该值时\
  \ `xinetd` 将拒绝进一步的连接。综合来看，这些选项可以减少系统因某些类型的拒绝服务 (DoS) 攻击或服务器流行度激增而出现困难的概率。\n\n你可以直接在服务器定义中或主\
  \ `/etc/xinetd.conf` 文件的 `defaults` 部分中使用大部分大多数选项。如果放在后一个位置，除非被服务器定义区域中的竞争选项覆盖，否则该特性将适用于通过\
  \ `xinetd` 处理的所有服务器。\n\n如果你更改了 `/etc/xinetd.conf` 文件或其在 `/etc/xinetd.d` 中包含的文件，你必须重启\
  \ `xinetd` 服务器程序。由于 `xinetd` 本身通常通过 SysV 启动脚本，你可以通过输入类似 `/etc/rc.d/init.d/xinetd\
  \ restart` 的命令来实现，尽管启动脚本在某些发行版中可能位于其他地方。另外，你可以通过 `kill` 向 `xinetd` 传递 `SIGUSR1`\
  \ 或 `SIGUSR2` 信号。前者告诉 `xinetd` 重新加载配置文件并按照新文件的指示开始响应。后者也这样做，但还会终止任何因配置文件更改而失效的服务器。\n\
  \n## 设置访问控制特性\n\n\n\n\n`xinetd` 的吸引力之一在于它在超级服务器内部结合了与 `TCP` Wrappers 相似的访问控制功能。这可以简化配置。尽管，`TCP`\
  \ Wrappers 和 `xinetd` 的访问控制功能并非完全相同，因此在某些情况下，其中一个工具会优于另一个。像其他的 `xinetd` 配置选项一样，你可以全局设置或为特定服务器设置访问控制功能。主要的访问控制选项包括以下几个：\n\
  \n*   **基于主机的限制** —— `only_from` 和 `no_access` 选项在概念上与 `TCP` Wrappers 的 `/etc/hosts.allow`\
  \ 和 `/etc/hosts.deny` 文件内容非常相似，但 `xinetd` 在其主配置文件或特定服务器的配置文件中设置这些功能。具体来说，`only_from`\
  \ 设置了一组显式允许访问的计算机列表（拒绝所有其他访问），而 `no_access` 指定了要列入黑名单的计算机。如果一个地址同时设置了这两个选项，则规则更具体的具有优先权。对于这两个选项，可以使用\
  \ `IP` 地址（例如 `172.23.45.67`）、使用带有尾部 `.0` 的网络地址（例如用 172.23.0.0 表示 172.23.0.0/16）或带有显式子掩码（如\
  \ `127.23.0.0/16`）、`/etc/networks` 中的网络名称或主机名（如 `badguy.threeroomco.com`）来指定。如果使用主机名，`xinetd`\
  \ 在服务器启动时该主机进行单次查找，因此如果主机到 `IP` 地址的映射发生变化，主机名可能无效。\n\n*   **时间限制** —— 你可以使用 `access_times`\
  \ 选项指定服务器可用的时间范围。该选项要求的访问时间格式为 `hour:minute-hour:minute`，例如 `08:00-18:00`，这将对服务器的访问限制在上午\
  \ 8:00 到下午 6:00 之间。时间采用 24 小时制。请注意，这仅限制了对服务器的初始访问。例如，如果 Telnet 服务器限制在上午 8:00 到下午\
  \ 6:00，那么有人可以在下午 5:58 登录并无限期停留。\n\n*   **接口限制** —— 你可以使用 `bind` 或 `interface` 选项（它们是同义词）将服务器绑定到一个网络接口，这些选项接受与接口关联的\
  \ `IP` 地址。例如，如果 `eth1` 链接到 172.19.28.37，则 `bind = 172.19.28.37` 将服务器*仅*绑定到 `eth1`。任何从\
  \ `eth0` 访问服务器的尝试都将没有任何响应，仿佛服务器根本没有运行。此功能在路由器和其他连接到多个网络的计算机上最有用，但对于那些拥有小型内部网络和拨号链路的用户也很有意义。例如，你可以将\
  \ Telnet 或 `FTP` 等服务器绑定到你的本地以太网接口，它们将无法通过你的 `PPP` 连接对整个互联网开放。\n\n尽管本节和前面的章节概述了最常用的\
  \ `xinetd` 选项，但还有一些较少使用的选项在此未进行描述。你应该查阅 `xinetd` 手页以获取有关其他选项的更多信息。\n\n## 使用本地启动脚本\n\
  \n大多数 Linux 发行版通过 SysV 启动脚本或超级服务器启动其大部分标准服务器。该规则的一个显著异常是 X 服务器，它通常通过 `/etc/inittab`\
  \ 末尾附近的一行启动，该行仅在特定的运行级别下启动 X 服务器。Slackware 的处理方式也略有不同，使用 `/etc/rc.d/rc.inet2` 来启动其大部分服务器。大多数发行版都提供一个“本地”启动脚本，该脚本供系统管理员修改，以处理启动不常见的系统特定服务器、运行初始化工具等。[表\
  \ 4.1] 列出了几种常用 Linux 发行版的本地启动脚本。\n\n使用本地启动脚本的通常原因是，你添加了一个不希望通过超级服务器运行、且该服务器没有带有合适的\
  \ SysV 启动脚本的服务器。由于 SysV 启动脚本与特定发行版紧密相关，如果你是从自己发行版以外的源获取的服务器，你可能没有获得合适的 SysV 启动脚本。例如，如果你运行的是\
  \ Mandrake 但安装了为 SuSE 设计的服务器，那么 SuSE 的 SysV 启动脚本可能在你的 Mandrake 系统上无法工作。如果你从服务器作者那里以源代码形式获取服务器，也可能会遇到这个问题；此类原始源码不太可能包含针对特定\
  \ Linux 发行版的定制。\n\n## 修改本地脚本\n\n你可以使用你喜欢的文本编辑器来修改本地启动脚本。要启动服务器，只需在文件中包含与你在命令行提示符处输入的命令相同的行即可。例如，以下行启动了一个\
  \ Telnet 服务器：\n\n```\n/usr/sbin/in.telnetd\n```\n\n如果服务器没有以*守护进程模式*启动（也就是说，如果它没有在后台运行，在你直接启动它时没有交出对\
  \ shell 的控制权），你应该在命令行末尾使用取符号符号 `&`，以告诉服务器在后台运行。未这样做会导致启动脚本的执行在调用处停止。如果该调用是脚本的最后一行，则这样做是可以接受的，但如果你想启动额外的服务器，如果漏掉了\
  \ `&`，后续的服务器将无法启动。\n\n当然，你也可以执行比单行启动服务器更复杂的操作。你可以使用 bash shell 的条件表达式来测试服务器文件是否存在，或者仅在某些情况下启动它。尽管如此，这些通常是在\
  \ SysV 启动脚本中执行的任务，因此，如果你愿意付出这种努力，你可能更倾向于编写自己的 SysV 启动脚本。需要记住的一个重要点是，不同发行版的本地启动脚本并不完全等。例如，SuSE\
  \ 运行 `boot.local` 脚本的时间早于 Red Hat 运行 `rc.local` 的时间。因此，SuSE 的本地启动脚本更适用于建立接口或执行其他早期启动任务，而\
  \ Red Hat 的脚本则更适合启动依赖已建立网络连接的服务器。如果你要在启动脚本中执行的任务高度取决于其他服务器的存在与否，你可能被迫创建一个具有适用于任务的序列号的\
  \ SysV 启动脚本。\n\n\n\n\n使用本地启动脚本的通常理由是创建一种快速启动服务器或运行其他程序的“简易粗略”方法。一旦启动，本地启动脚本并不提供方便的关闭服务器的方法（不像大多数\
  \ SysV 启动脚本具有 `stop` 参数）；如果需要，停止服务器，你将不得不使用 `kill`、`killall` 或类似的工具。\n\n## 使用 GUI\
  \ 工具\n\n许多 Linux 发行版都提供了 GUI 界面，允许对基本网络功能、常用服务器以及通常还包括系统运行的其他方面进行配置。这些工具在不同发行版之间差异很大，尽管它们也具有某些共同点。你通常可以从该发行版默认的\
  \ K 桌面环境（KDE）或 GNU 网络对象模型环境（GNOME）桌面的菜单选项启动它们，也可以通过在 xterms 中输入它们的名称来启动。（启动这些工具时，你可能需要\
  \ `root` 权限，特别是在后者方式下。）这些工具包括 Linuxconf（用于 Red Hat 及其许多派生版本，包括 Mandrake）、YaST 和\
  \ YaST2（用于 SuSE）以及 `ksysv`（前文讨论过的 `ntsysv` 的 GUI 变体）。\n\n### 注意\n\n![NOTE](img/note.gif)\n\
  \n还有基于 Web 的管理工具，例如 Webmin 和 SWAT。事实上，Linuxconf 既可以通过 Web 界面远程使用，也可以在本地使用。第 16 章,远程维护系统\
  \ 描述了此类工具。尽管它们主要用于远程管理，但也可以通过将 Web 浏览器指向本地系统的 Web 管理工具来在本地使用。\n\n## 使用 Linuxconf\n\
  \nLinuxconf 工具是一个模块化配置工具；它由一个框架组成，接受配置模块来处理特定的服务器和其他配置任务。你可以在文本模式下运行 Linuxconf（使用基于文本的菜单）、GUI\
  \ 模式下运行（在单独窗口中运行），或通过 Web 界面运行（通过 Web 浏览器访问，如 第 16 章 中所述）。GUI 界面不仅需要主 `linuxconf`\
  \ 包，还需要一个通常称为 `gnome-linuxconf` 或 `linuxconf-gui` 的独立包。如果 Linuxconf 可以使用其 GUI 工具，它会自动执行；否则它会回退到文本模式。本节强调本地\
  \ GUI 访问方法，但文本模式或 Web 访问也提供相同的选项；仅用户界面的细节有所不同。GUI 界面的细节在不同发行版之间有所不同。特别是 Red Hat\
  \ 使用单个窗口并在该窗口中显示所有配置模块，而 Mandrake 则为每个配置模块使用单独窗口。\n\n### 注意\n\n![NOTE](img/note.gif)\n\
  \nLinuxconf 的官方网站是 [`www.solucorp.qc.ca/linuxconf/`](http://www.solucorp.qc.ca/linuxconf/)。尽管它随\
  \ Red Hat 7.2 和 Mandrake 8.1 一起发布，但在这两个版本中都已被官方弃用，因此最终可能会从这些发行版中消失。在 2002 年初尚不清楚\
  \ Linuxconf 是否会在这些发行版中被另一个统一工具或一系列特定的服务器工具所取代。尽管它与 Red Hat 和 Mandrake 的联系最紧密，但在\
  \ Linuxconf 官方网站也可以找到为其他发行版定制的 Linuxconf 版本。\n\n首次启动时，Linuxconf 会显示一个可展开的配置区域列表，分为三个标签页：Config（配置）、Control（控制）和\
  \ Status（状态）。每个区域都有子区域，直到到达特定的配置模块。（在 Mandrake 的实现中，你点击一个区域以获取显示该区域内选项的单独窗口，以此此类推直到到达你需要的配置模块。）图\
  \ 4.2 显示了 Red Hat 对此模型的实现，选择了 Control ⊳ Control Panel ⊳ Control Service Activity\
  \ 模块。该模块允许你控制 SysV 启动脚本和通过 `xinetd` 启动的服务器。要启用或禁用服务器，请遵循以下步骤：\n\n1. 启动 Linuxconf\
  \ 并找到 Control ⊳ Control Panel ⊳ Control Service Activity 模块，如图 图 4.2 所示。\n\n   ![你可以可以使用\
  \ linuxconf 控制 Linux 系统运行的许多方面。](img/04fig02.jpg)\n\n   图 4.2. 你可以使用 `linuxconf`\
  \ 控制 Linux 系统运行的许多方面。\n\n2. 在右侧列表中找到你想控制的服务器。例如，要控制 sendmail，你需要找到 sendmail 项并点击它。结果是\
  \ Linuxconf 窗口右侧出现一个新标签页，显示服务器的当前状态。\n\n3. 点击 Run Levels（运行级别）标签页。现在显示应该类似于 图 4.3\
  \ 你可以通过点击每个运行级别旁边的复选框，启用或禁用任何指定运行级别的服务器。\n\n   ![你可以可以通过在任何运行级别上启用或禁用服务器来通过 Linuxconf\
  \ 控制服务器。](img/04fig03.gif)\n\n   图 4.3. 你可以通过在任何运行级别上启用或禁用服务器来通过 Linuxconf 控制服务器。\n\
  \n4. 点击 Service 标签页中的 Accept（接受），然后在 Service Control 标签页中点击 Dismiss（撤销）。\n\n5. 从\
  \ Linuxconf 菜单栏中选择 File ⊳ Act/Changes（操作/更改）。程序将显示它将执行的操作列表。点击 Do It（执行）以接受这些更改。\n\
  \n此时，你的系统应该已经重新配置启动你选择的服务器。你可以通过 `chkconfig` 或检查 SysV 脚本目录中的文件名来验证。\n\n除了启用或禁用服务器外，Linuxconf\
  \ 还包含了配置某些服务器的功能。由于 Red Hat 和 Mandrake 逐渐不再使用 Linuxconf，它们在发行版的每个新版本中省略了更多的配置模块。你可以在\
  \ Linuxconf 网站上找到许多模块，尽管它们并不总是正常工作。问题在于服务器配置文件的位置，甚至文件内容，在不同发行版或不同服务器版本之间都是不同的。这使得许多服务器无法创建一个真正通用的配置模块。\n\
  \n## 使用 YaST 和 YaST2\n\nSuSE 的 Yet Another Setup Tool (YaST) 和 YaST2 分别是基于文本和 GUI\
  \ 的配置工具。尽管它们的界面不同，但这两个工具提供的选项非常相似。本节强调 YaST2 的使用，但如果你选择使用 YaST，也不应该遇到困难。（为了简单起见，除非区别很重要，否则我用\
  \ YaST 来指代这两个工具。）你可以通过输入 `yast` 启动文本模式的 YaST，或通过输入 `yast2` 启动 YaST2。主 YaST2 窗口类似于\
  \ 图 4.4 你可以从左侧列表选择广泛的配置区域，并从右侧选项选择特定的配置工具。\n\n\n\n\n![YaST 提供了几个特定的配置工具，这些工具被分为几个特定的配置类别。](img/04fig04.jpg)\n\
  \n图 4.4. YaST 提供了几个特定的配置工具，这些工具被分为几个特定的配置类别。\n\n由于 SuSE 使用 `/etc/rc.config` 文件来控制启动过程，以及\
  \ SysV 脚本链接目录中文件的命名，因此 YaST 必须修改配置文件来处理服务器启动。事实上，这是 YaST 控制服务器启动的主要手段。修改这些选项的工具名称反映了这一事实：它是位于杂项（Misc）部分的\
  \ RC-Config 编辑器工具。点击此工具，YaST2 会显示如图 4.5 所示的窗口。大多数网络服务器启动变量位于 Start-Variables ⊳ Start-Network\
  \ 区域。点击其中一个特定选项，如图 4.5 所示，YaST 允许你编辑变量——通常是设置为 Yes 或 No，从而导致服务器启动或不启动。\n\n![在 YaST\
  \ 中启动网络服务器涉及将变量设置为 Yes 或 No。](img/04fig05.jpg)\n\n图 4.5. 在 YaST 中启动网络服务器涉及将变量设置为\
  \ Yes 或 No。\n\nYaST 还可以控制网络配置的许多其他方面。事实上，特定服务器的许多重要变量存储在 `/etc/rc.config` 文件中，因此你用于控制\
  \ SysV 服务器启动的相同配置工具也可以设置这些变量。例如，你可以设置你的主机名（Network ⊳ Network-Basics）或告诉 SuSE 是否接受远程\
  \ `root` 登录（Security ⊳ Security-Basics）。你可能想浏览此工具中提供的可用选项，以熟悉其功能。\n\n其他 YaST 工具，特别是网络（Network）区域的工具，可以用于配置特定的服务器。例如，网络区域同时包含一个\
  \ <acronym class=\"acronym\">NFS</acronym> 工具和一个 Sendmail 配置工具，分别用于配置 <acronym class=\"\
  acronym\">NFS</acronym> 和 sendmail。（这些主题在第 8 章和第 19 章中介绍，尽管这些章节的重点不是 YaST 配置。）\n\
  \n## 使用 `ksysv`\n\n在本章前面，我描述了用于管理 SysV 启动脚本的 `chkconfig` 和 `ntsysv` 工具（有时通过超级服务器启动的服务器）。这些工具是有用的，但如果你是全\
  \ <acronym class=\"acronym\">GUI</acronym> 管理工具的粉丝，它们可能不足以满足你的口味。不过，也有一些完全的 <acronym\
  \ class=\"acronym\">GUI</acronym> 替代方案，例如 `ksysv` 和 `tksysv`。前者是 <acronym class=\"\
  acronym\">KDE</acronym> 项目的一部分，但如果你愿意，也可以在其他环境中使用。后者与任何特定的 <acronym class=\"acronym\"\
  >GUI</acronym> 软件包都没有关联。两者都可能与 Red Hat 或其衍生发行版运行得顺畅。图 4.6 显示了 `ksysv` 的操作。\n\n![GUI\
  \ SysV 启动脚本编辑器允许你点击服务器名称以修改其操作。](img/04fig06.gif)\n\n图 4.6. <acronym class=\"acronym\"\
  >GUI</acronym> SysV 启动脚本编辑器允许你点击服务器名称以修改其操作。\n\n`ksysv` 和 `tksysv` 都在窗口左侧的可滚动列表框中列出可用的\
  \ SysV 启动脚本，并在窗口的其他部分列出在各种运行级别设置为启动和停止的服务器列表。点击任一列表中的条目都会产生启动脚本的信息，但信息取决于你点击的是“可用服务（Available\
  \ Services）”列表还是特定的运行级别列表。在一种情况下，`ksysv` 会弹出一个对话框，其中包含服务的描述，你可以在其中启动、停止或重启服务，或者更改脚本的权限或文件名。如果你点击运行级别列表中的服务名称，对话框也会提供服务的描述（在\
  \ Service 选项卡中），你可以编辑链接名称、它指向的启动脚本以及序列号，如图 4.7 所示![你可以通过点击 ksysv 中服务的名称从对话框中编辑 SysV\
  \ 启动脚本和链接功能。](img/04fig07.gif)\n\n图 4.7. 你可以通过点击 ksysv 中服务的名称从对话框中编辑 SysV 启动脚本和链接功能。\n\
  \n要更改哪些服务器自动启动，点击并将服务器名称从启动（Start）运行级别列表拖到停止（Stop）运行级别列表，反之亦然。你也可以将服务器从可用服务列表拖到所需的运行级别。在这些任何情况下，`ksysv`\
  \ 都会根据你拖动的位置为服务分配默认数字。例如，如果你将一个服务拖到序列号为 20 和 30 的服务之间，`ksysv` 将分配 25。你可以通过点击运行级别列表中的服务并编辑排序（Sorting）字段来更改此数字，如图\
  \ 4.7 所示。遗憾的是，`ksysv` 并不知道哪些序列适用于你的系统，因此你必须注意这一细节。此外，使用 `ksysv` 配置系统使一个服务同时出现在启动和停止列表中，所以你应该小心这样做。\n\
  \n总的来说，像 `ksysv` 和 `tksysv` 这样的 <acronym class=\"acronym\">GUI</acronym> 启动脚本工具没有\
  \ Linuxconf 或 YaST 等工具灵活。这是设计如此的；SysV 脚本工具旨在执行一项工作，而不是通用配置工具所执行的许多工作。SysV 脚本工具可以帮助你调整\
  \ SysV 启动脚本，但它们不能替代对系统工作原理的理解。你必须了解运行级别和脚本的启动顺序，至少了解 SysV 启动的基本原理。\n\n# 何使用每种启动方法\n\
  \n由于有许多不同的启动方法，决定使用哪种并不总是容易的。大多数为特定 Linux 发行版封装的服务器都以一种方式立即与某种启动方法工作。例如，服务器可能随带包含\
  \ SysV 启动脚本或位于 `/etc/xinetd.d` 中的 `xinetd` 配置文件的包。然而，你不受限于默认值；在大多数情况下，你可以以提到的任何方式启动服务器。也有少数例外，在更多情况下，服务器几乎总是以特定方式运行，因为该方法的优点是压倒性的。表\
  \ 4.2 总结了启动服务器三种方法的优缺点。\n\n\n\n\n大多数发行版通过 `SysV` 启动脚本启动大多数服务器（以及许多非服务器服务，如声卡配置）。许多服务器由于其重要性，以至于你不希望在超级服务器（super\
  \ server）启动服务器程序时产生延迟，而且从发行版维护者的角度来看，`SysV` 脚本优于本地启动脚本，因为作为服务器包文件的一部分，很容易添加和删除 `SysV`\
  \ 启动脚本。某些服务器（例如 Samba 的 `nmbd`）在从超级服务器运行时往往是不可靠的。有时这与服务器需要在一次调用和另一个调用之间维持信息有关例如例如`nmbd`\
  \ 可能会保留网络上其他计算机的名称和地址信息，如果它从超级服务器运行，这些信息将会丢失。\n\n### 表 4.2. 服务器启动方法的优缺点对比\n\n| 启动方法\
  \ | 优点 | 缺点 |\n| --- | --- | --- |\n| SysV 启动脚本 | 可以在不同的运行级别（runlevels）中设置自定义服务器集；服务器响应速度快；通过重命名文件配置服务器启动；易于手动启动和停止服务器\
  \ | 对于大型服务器来说内存占用大；可以进行的外部访问控制较少 |\n| 超级服务器 | 对于很少使用的服务器内存占用低；提供了添加访问控制的机会 | 服务器响应慢；某些服务器在此环境下运行不良好；服务器无法容易地在跨调用中维持状态\
  \ |\n| 本地启动脚本 | 服务器响应速度快；如果不包含 SysV 脚本则易于添加服务器 | 与配置工具（`chkconfig`、`ksysv` 等）集成性差；启动脚本在不同发行版之间存在差异\
  \ |\n\n不过，超级服务器也有其用处。许多发行版默认将它们用于快速加载和运行的小型服务器，例如 Telnet 和 FTP 服务器。如果 Apache 或 sendmail\
  \ 等大型服务器不经常被调用，你可能愿意牺牲这些服务器的速度。某些发行版（如 Debian）在安装服务器时，为你提供通过 `SysV` 启动脚本或通过超级服务器运行此类服务器的选择。尽管即使没有给你提供这个选择，你也可以在安装后通过禁用\
  \ `SysV` 启动脚本并添加相应的超级服务器配置来更改配置。\n\n在大多数情况下，使用发行版自带的超级服务器（`inetd` 或 `xinetd`）是最简单的。如果你发现自己需要某个特定超级服务器的功能（可能是\
  \ `xinetd`，因为它更复杂），你可以用新的超级服务器替换发行版的标准超级服务器。你可能需要修改超级服务器的 `SysV` 启动脚本，或者通过本地启动脚本启动新的服务器。在完成这些操作后，你就可以按照本章前面介绍的方法配置新的超级服务器。\n\
  \n本地启动脚本最好保留用于这种情况：你通常会通过 `SysV` 脚本运行服务器，但缺少标准的 `SysV` 启动脚本或该脚本无法正常工作。如果你是一个新管理员，当你为一个发行版安装为另一个发行版设计的服务器时，可能会发生这种情况。正如前面在“使用本地启动脚本”节中提到的，通常可以创建自定义的\
  \ `SysV` 启动脚本，但如果你赶时间或对这类事务缺乏经验，在本地启动脚本中添加简单的调用可能是实现目标的更快方法。\n\n### 注意\n\n![注意](img/note.gif)\n\
  \n启动服务器的另一种方法是手动启动；你通常可以输入服务器名称来启动。不过，这种方法主要用于测试。在大多数情况下，你会希望配置服务器自动启动，这就是本章强调的重点。\n\
  \n## 总结\n\n了解如何启动服务器程序对于将 Linux 作为服务器计算机至关重要。广义地说，启动 Linux 服务器有三种主要方法：`SysV` 启动脚本、超级服务器和本地启动脚本。每个\
  \ Linux 发行版在使用这些方法启动服务器的细节上都是独特的，因此你必须学习你自己的发行版的方法来调整你的系统配置。特别重要的是 `SysV` 启动脚本的位置和启动序列号，以及计算机使用\
  \ `inetd` 还是 `xinetd` 作为其超级服务器。一旦你学会了发行版提供的启动服务器的方法，你就已经准备好按照书中其余部分的描述来设置常见和不常见的服务器以及其他网络工具。\n\
  \n# 第二部分 本地网络服务器\n\n# 第 5 章 通过 DHCP 配置其他计算机\n\n[第 2 章] TCP/IP 网络配置，涵盖了通过几种不同方式配置计算机使其在\
  \ TCP/IP 网络上运行的内容。其中一种方法是使用动态主机配置协议（DHCP）服务器。在这种配置中，计算机发送一个广播查询来查找 `DHCP` 服务器，该服务器通过向计算机提供\
  \ `IP` 地址和其他必要的配置信息来响应。这种配置对于 `DHCP` 客户端来说非常方便，因为避免了输入计算机 `IP` 地址、网关 `IP` 地址及相关信息的麻烦。不过，`DHCP`\
  \ 并不是魔法。如果你在运行自己的网络，就需要配置一台 `DHCP` 服务器计算机来回答 `DHCP` 客户端请求。本章涵盖了如何做到这一点。\n\n在配置 `DHCP`\
  \ 服务器之前，你应该问问自己是否想这样做。如果是，你需要找到 `DHCP` 配置文件。最基础的配置涉及让 `DHCP` 服务器分配在不同客户端启动之间可能变化的\
  \ `IP` 地址，但通过额外的工作，你可以让 `DHCP` 为特定计算机反复分配相同的 `IP` 地址。本章涵盖的最后一个主题涉及将 `DHCP` 服务器与其他服务器（如\
  \ Samba 和域名系统 (DNS) 服务器）集成。\n\n正如书中涵盖的许多主题一样，本章无法涵盖所有细节，但它应该让你入门，并且对于许多配置来说足够了。如果你需要创建一个极其复杂的\
  \ `DHCP` 配置，可能需要参考专门介绍该主题的书，例如 Droms & Lemons 的《The DHCP Handbook: Understanding,\
  \ Deploying, and Managing Automated Configuration Services》（New Riders Publishing,\
  \ 1999）或 Kercheval 的《DHCP: A Guide to Dynamic TCP/IP Network Configuration》（Prentice\
  \ Hall, 1999）。\n\n## 何时运行 DHCP 服务器\n\n\n\n\n\n在某种意义上，关于何时应该运行 `DHCP` 服务器的问题是显而易见的：每当你的网络包含通过\
  \ `DHCP` 配置的客户端时，你就应该运行一个服务器。然而，在配置单台电脑时，只有在 `DHCP` 服务器可用的情况下你才会选择 `DHCP`。你可以通过将网络作为一个整体来打破这种循环逻辑：为单台电脑配置静态\
  \ `IP` 地址更容易简单，还是在一台电脑上设置 `DHCP` 服务器并用它来配置单台电脑更简单？\n\n你可以通过查看第 2 章中的“配置静态 IP 地址”章节，来了解为单台电脑配置静态\
  \ `IP` 地址有多困难，从而对此有个直观的认识——但请注意，不同的操作系统可能会有不同的配置需求。你的 Linux `DHCP` 服务器不仅可以向 `IP`\
  \ 地址分发给 Linux 系统，还可以发送给运行其他 UNIX 变体、Windows、MacOS、OS/2、BeOS 或几乎任何带有 `TCP`/`IP` 栈的系统。尽管所有这些操作系统在配置静态\
  \ `IP` 地址时需要的信息大同小，但它们之间的区别在于用户界面的细节。几乎总是如此，客户端的 `DHCP` 配置会比静态 `IP` 地址配置更简单。\n\n\
  ### NOTE\n\n![NOTE](img/note.gif)\n\n`DHCP` 客户端也可以作为其他协议的服务器。有时这样做是不明智的，因为服务器应该始终保持可用状态，而且服务器的\
  \ `IP` 地址不发生是非常重要的。不过，你可以像接下来的章节“分配固定地址”中描述的那样，通过 `DHCP` 为服务器分配一个不变的 `IP` 地址。尽管如此，你可能更倾向于直接为服务器分配静态\
  \ `IP` 地址，以避免 `DHCP` 服务器在不方便的时间无法访问时可能出现的问题。\n\n配置 `DHCP` 服务器的工作量通常比配置单台电脑使用静态 `IP`\
  \ 地址要多。因此，仅仅为了一个或两个 `DHCP` 客户端而配置 `DHCP` 服务器通常是不值得的。当客户端达到大约六个时，`DHCP` 服务器配置的总精力可能开始变得值得。（如果一台电脑在多个操作系统之间进行双启动，它的配置工作量就会像多台电脑一样增加，在某种意义上，它确实是这样。）\n\
  \n除了 `DHCP` 客户端和服务器的总配置精力外，你还应该考虑配置人员的专业知识。如果你网络中的普通用户自己设置系统，那么使用 `DHCP` 将具有巨大的益处，因为这些用户因误解指令而意外输入错误信息的概率会大大降低。如果由熟悉基础网络配置的人设置所有电脑，那么这个因素就不那么重要了。\n\
  \n尽管 `DHCP` 可以极大地简化网络配置，但至少有一台电脑不会使用 `DHCP` 来设置其基本网络选项：那就是 `DHCP` 服务器本身。你将为这台电脑配置静态\
  \ `IP` 地址，并设置 `DHCP` 服务器程序，使其不要尝试向任何客户端发放该 `IP` 地址。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\
  \n拥有多个网络接口的电脑理论上可以在一个网络上作为 `DHCP` 客户端，而在另一个网络上托管 `DHCP` 服务器。\n\n`DHCP` 服务器对你网络的正常运行至关重要。如果\
  \ `DHCP` 服务器宕机，客户端在启动时无法获取 `IP` 地址，或者在它们通常与服务器重新协商维护 `IP` 地址时无法进行。你可能想要考虑准备一台备份的\
  \ `DHCP` 服务器。这台电脑的 `DHCP` 服务器不应该是激活状态，但如果主 `DHCP` 服务器宕机，你应该准备好启动它。如果可能，你应该安排备份服务器持续获取主服务器的租约文件，这样备份服务器就不会错误地发放主服务器分配给另一台电脑的\
  \ `IP` 地址。你可以通过 `cron` 任务传输租约文件来实现。不过，对于小型网络来说，这种配置可能是多此一举。此外，较长的租约时间将减少 `DHCP`\
  \ 服务器宕机时的风险，因为已经启动的客户端在服务器停止运行可能不需要联系 `DHCP` 服务器。\n\n最后，你可能还会考虑非 Linux 的 `DHCP`\
  \ 选项。所有主要的 Linux 发行版都带有 `DHCP` 服务器；某些其他操作系统并非如此，因此将 Linux 作为 `DHCP` 服务器平台通常非常有意义。然而，你可能正在设置一个使用宽带路由器的小型网络——这类设备将小型办公室和家庭网络连接到电缆或数字用户线路（DSL）网络上。这些设备通常包含\
  \ `DHCP` 服务器。如果你的设备包含它，它的配置可能比 Linux `DHCP` 服务器更简单，尽管宽带路由器 `DHCP` 服务器通常也比 Linux\
  \ `DHCP` 服务器灵活得多。例如，宽带路由器 `DHCP` 服务器很少提供任何一致地为客户端交付相同 `IP` 地址的方法。\n\n`DHCP` 服务器通常通过\
  \ SysV 脚本运行。这种配置可以对客户端做出快速响应，并允许服务器在内存中维护重要的配置信息。第 4 章，启动服务器，讨论了启动服务器的通用选项。\n\n\
  ## 内核与网络接口问题\n\n\n\n\n\n你可能需要调整内核配置或网络的其他方面来使用 `DHCP` 服务器。特别是，你必须在内核配置中启用数据包套接（Packet\
  \ Socket）和套接过滤（Socket Filtering）选项，如第 1 章 所示。（`dhcpd` 的第 1 版本不需要套接过滤，但较新版本需要。）\n\
  \n某些 `DHCP` 客户端需要目标为 255.255.255.255 的 `DHCP` 服务器响应。遗憾的是，对于 `DHCP` 服务器来说，Linux 默认会将此类地址更改为本地广播地址（例如\
  \ 192.168.1.255）。如果你在使用某些 `DHCP` 客户端（特别是 Windows 系统）时遇到问题，你可能需要通过向你的 `DHCP` 服务器路由表中添加显式路由来修复此。你可以使用以下命令来实现：\n\
  \n```\n # route add -host 255.255.255.255 dev eth0\n```\n\n你可能需要将 `eth0` 修改为适用于你系统的任何值。此命令可能存在于\
  \ `DHCP` 启动脚本中。你可以通过在命令提示符中输入 `route -n` 来检查其是否存在。该命令如第 2 章所示，显示你系统中所有的路由表条目。如果存在，你将在输出顶部看到\
  \ 255.255.255.255 路由。\n\n## DHCP 配置文件\n\n大多数 Linux 发行版都附带由互联网软件联盟（[http://www.isc.org/products/DHCP/]）编写的\
  \ `DHCP` 服务器。ISC 在 2001 年底发布了其 `DHCP` 服务器的 3.0 版本，但截至 2002 年，许多 Linux 发行版仍然在使用旧的\
  \ 2.0 版本。这里描述的大多数配置功能适用于 2.0 和 3.0 版本的 `DHCP` 服务器，但 3.0 增加了对高级功能的支持，包括“与 DNS 服务器通信”节中描述的\
  \ `DNS` 集成。\n\n`DHCP` 服务器依赖于名为 `dhcpd.conf` 的配置文件。此文件通常位于 `/etc` 或 `/etc/dhcp` 目录下。与其他\
  \ Linux 配置文件一样，`dhcpd.conf` 是纯文本文件，因此你可以使用喜欢的文本编辑器对其进行编辑。除了此文件外，`dhcpd` 还了自己的状态文件\
  \ `dhcp.leases`，它通常位于 `/var/lib/dhcp`。该文件包含由 `dhcpd` 发布的*租约*（leases）信息。`DHCP` 的原理是\
  \ `DHCP` 服务器协调 `IP` 地址的分配。它通过告诉 `DHCP` 客户端可以在特定时间内使用特定的 `IP` 地址来实现——即 `DHCP` 客户端获得了一个租约，并必须定期*续租*（renew）。`dhcp.leases`\
  \ 文件还包含客户端的以太网地址信息。尽管 `dhcp.leases` 文件本身并不是一个配置文件，你不需要编辑它，但在某些情况下你可能需要检查它，例如在进行故障排除或需要查找客户端的介质访问控制（`MAC`）地址时。\n\
  \n主 `dhcpd.conf` 文件像许多配置文件一样，可能包含以井号（`#`）开头的注释。文件的非注释行被称为*语句*（statements），它们分为两大大类：\n\
  \n*   **参数（Parameters）** —— `参数` 告诉 `DHCP` 服务器是否执行某项操作（例如向未知客户端提供地址）、如何执行某项操作（例如提供多长的租约）或向客户端提供什么信息（例如网络网关地址）。\n\
  *   **声明（Declarations）** —— `声明` 描述网络拓扑（例如，哪些地址与特定接口关联）、指定可以给客户端的 `IP` 地址，或将一组参数与一组声明关联。\n\
  \n某些声明依赖于参数中描述的信息。在这种情况下，参数必须在文件中位于声明之前。正如后文描述的，大多数配置文件都以一系列参数开始，然后进入声明。某些声明跨越多行，此类声明可以使用大括号（`{}`）来指示。例如，接下来的行定义了一台计算机及其分配给它的\
  \ `IP` 地址，这将在接下来的节“分配固定地址”中讨论。\n\n```\nhost teela {\n   hardware 00:05:02:a7:da;\n\
  \   fixed-address 192.168.1.2;\n}\n```\n\n此声明作用的细节将在稍后讨论。现在，你应该注意 `host` 关键字开始声明，其后跟着一个选项（计算机的名称\
  \ `teela`），大括号包围了该声明所需的配置行。在某些情况下，此类多行声明可能会嵌套在其他声明中。通常的做法是将嵌套声明缩进几个空格，以帮助你识别嵌套组件。不过这种缩进并不是强制的；`dhcpd`\
  \ 会忽略额外的空格和行，除非它们被包含在引号中。\n\n## 分配动态地址\n\n`DHCP` 服务器最简单的配置是分配动态 `IP` 地址。在这种情况下，当计算机连接时，`DHCP`\
  \ 服务器会提供任何方便计算机的 `IP` 地址。没有为特定计算机预留 `IP` 地址，因此任何给定的客户端某一天收到一个 `IP` 地址，第二天收到另一个。客户端可能会请求特定地址，大多数客户端会请求它们上次收到的地址，但服务器可能会忽略此请求。在实践中，如果计算机很少关闭或仅关闭短时间，它们可能会反复接收到相同的地址，但这并不是保证的。如果你的网络有大量客户端，动态配置可能有用，但它有一个缺点：由于客户端的\
  \ `IP` 地址可能会在不可预测的时间更改，很难将它们与特定的主机名绑定，因为将主机名与 `IP` 地址绑定的 `DNS` 服务器通常配置为静态 `IP` 地址映射。这使得在动态\
  \ `DHCP` 客户端上运行服务器变得困难。本章稍后的“与 DNS 服务器通信”节描述了解决此问题的方法，另一种方法是为服务器分配固定 `IP` 地址，如“分配固定地址”节所述。\n\
  \n\n\n\n\n## 设置全局选项\n\nListing 5.1 显示了一个完整的 `dhcpd.conf` 文件，该文件可以分配动态 IP 地址。此文件非常简单，可能适用于小型网络，并展示了文件的基本结构。\n\
  \n**示例 5.1. 示例 `dhcpd.conf` 文件**\n\n```\n default-lease-time 7200;\nmax-lease-time\
  \ 10800;\noption subnet-mask 255.255.255.0;\noption routers 192.168.1.1;\noption\
  \ domain-name-servers 192.168.1.1, 172.17.102.200;\noption domain-name \"threeroomco.com\"\
  ;\n\nsubnet 192.168.1.0 netmask 255.255.255.0 {\n   range 192.168.1.50 192.168.1.150;\n\
  }\n```\n\nListing 5.1 的前六行定义了全局选项。这些参数定义了网络或服务器配置的关键方面，并适用于由 `dhcpd` 服务的所有客户端，除非在更具体的声明中覆盖了该全局选项。具体而言，前两项（`default-lease-time`\
  \ 和 `max-lease-time`）设置了以秒为单位的租约长度。租客和房东协商公寓租约一样，DHCP 客户端和服务器必须为 IP 地址协商一个合适的租约时间。`default-lease-time`\
  \ 值设置了 DHCP 服务器偏好的租约时间。在 Listing 5.1 中，该值为 7,200 秒，即 120 分钟。如果客户端请求更长的租约，`max-lease-time`\
  \ 值设置了 `dhcpd` 允许的最大值——在 Listing 5.1 中为 10,800 秒（180 分钟）。你可以根据需要增加或降低这些值。设置较低的租约时间会增加网络带宽消耗，因为客户端必须定期续租，并且当\
  \ DHCP 服务器崩溃时，网络更有可能中断。设置过高的租约时间则会导致当计算机短暂连接后又断开时，你更有可能耗尽 IP 地址，因为这些系统将对它们不再使用的\
  \ IP 地址仍保留租约。如果你想测试 DHCP 服务器，可以将租约时间设置得非常短——例如 60 秒——这样你就可以更改并观察这些更改的效果而不会产生过度的延迟。如果网络经常发生变化（例如笔记本电脑经常连接和断开），你可能会将租约设置为中等偏低的值，例如\
  \ Listing 5.1 中的值或更低。对于由保持数天连接的系统主导的网络，你可能会将租约设置为几十万秒（即几天的时间）。\n\nListing 5.1 中的接下来的四行设置了传递给\
  \ DHCP 客户端的全局参数——特别是网络子掩码、网关/路由器地址、DNS 服务器地址和域名。这些与你在配置计算机使用静态 IP 地址时所输入的值相同，正如\
  \ 第 2 章 中描述的。尽管 Listing 5.1 显示的是 IP 地址，但如果 DHCP 服务器上的名称解析工作正常，你也可以指定主机名。如果你这样做，`dhcpd`\
  \ 将解析你提供的主机名并将 IP 地址传递给客户端。DHCP 服务器或客户端会自动推导出或使用某些在 Listing 5.1 中未显示的默认值，但你可以覆盖这些默认值。在设置这些任何参数时，你必须在行末尾包含一个分号（`;`），如\
  \ Listing 5.1 所示。你可能想要设置的某些值包括：\n\n*   `filename`——`dhcpd` 服务器可以作为从存储在网络服务器上的操作系统启动的计算机的启动服务器。在这样配置时，DHCP\
  \ 服务器必须能够为客户端提供初始启动文件的名称，这是通过 `filename` 参数实现的。随后，客户端将通过其他文件传输协议检索此文件。\n*   `next-server\
  \ \"hostname\"`——此参数设置可以存放启动文件（由 `filename` 指定）的计算机名称。如果你不包含此参数，默认值为 DHCP 服务器本身。\n\
  *   `server-name \"hostname\"`——这是另一个网络启动选项。它用于告诉客户端持有启动文件的服务器名称，除了由 `filename`\
  \ 和 `next-server` 指定的初始启动文件外。\n*   `boot-unknown-clients flag`——通常情况下，`flag` 默认为\
  \ `true`，这使得 `dhcpd` 向任何请求 IP 的计算机发放 IP 地址。如果 `flag` 为 `false`，服务器仅向具有显式 `host`\
  \ 声明的计算机发放 IP 地址，正如“分配固定地址”节所述。\n*   `option broadcast-address ip-address`——如果你的网络使用了不常见的广播地址，可以使用此参数进行设置。通常情况下，客户端可以正确地计算出此值。\n\
  *   `get-lease-hostnames flag`——如果 `flag` 设置为 `true`，`dhcpd` 在发放 IP 地址之前会通过 DNS\
  \ 查找主机名，并将返回的值作为其主机名传递给客户端。这会导致客户端的主机名与其 IP 地址匹配，如果客户端运行在在网络流量中包含其主机名的程序（例如某些邮件服务器），这可能很重要。该参数的默认值为\
  \ `false`。\n*   `use-host-decl-names flag`——此参数与 `get-lease-hostnames` 类似，但如果将其设置为\
  \ `true`，它会导致 `dhcpd` 将在 `host` 声明（稍后描述）中设置的主机名传递给客户端，而不是通过 DNS 查询获取的 IP 地址关联的主机名。默认值为\
  \ `false`。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n`get-lease-hostnames` 和 `use-host-decl-names`\
  \ 参数决定了 DHCP 服务器是否以及如何设置客户端的主机名。这些选项*不会*影响其他系统通过 DNS 执行的主机名查找，尽管 `get-lease-hostnames`\
  \ 将客户端主机名设置为与 IP 地址相同的 DNS 名称。如果你想从其他计算机通过主机名可靠访问 DHCP 客户端，请参阅后续章节，“分配固定地址](#ch05.xhtml_ch05lev1sec5\
  \ \"Assigning Fixed Addresses\")”和“与 DNS 服务器通信”。\n\n\n\n\n\n有许多附加参数，其中许多是选项（它们使用\
  \ `option` 关键字后跟选项名称）。这些选项中的许多用于设置网络上各种服务器的位置，例如 X 字体服务器、时间服务器和打印服务器。另一些选项用于设置低层网络接口选项，例如客户端是否应该启用\
  \ IP 转发。如果你需要设置这些选项中的任何一个，请查阅 `dhcpd.conf` man page。这些许多选项需要在客户端配合额外的工具才能发挥作用；标准的\
  \ `DHCP` 客户端不会自动重新配置 X 字体服务器等功能。\n\n在大多数情况下，这些参数可以在文件开头处全局设置；或者作为仅针对一组 IP 地址的定义的一部分，通过稍后将描述的方法，将参数放置在单个子网或组的声明中。\n\
  \n## 定义子网范围\n\n列表 5.1 展示了一个非常简单的 `DHCP` 配置，其中仅分配了一个 IP 地址范围。这是通过该列表中的 `subnet` 声明实现的：\n\
  \n```\nsubnet 192.168.1.0 netmask 255.255.255.0 {\n   range 192.168.1.50 192.168.1.150;\n\
  }\n```\n\n此声明指定服务器运行在 192.168.1.0/24 网络上。因此，计算机必须在该网络上有一个活跃的接口。`DHCP` 服务器绑定到该网络接口，并向广播请求该网络上地址的客户端提供\
  \ `DHCP` 租约。`range` 声明定义了服务器将提供的 IP 地址范围——在本例中为 192.168.1.50 到 192.168.1.150。你可以使用\
  \ 192.168.1.0/24 网络内但在指定范围之外的其他地址分配给需要静态 IP 地址的计算机，包括 `DHCP` 服务器本身；不要将 `DHCP` 服务器的\
  \ IP 地址包含在 `range` 声明指定的数值范围内。\n\n单个 `dhcpd.conf` 文件可以包含多个 `subnet` 声明。如果服务器有两个网络接口，你可能会这样做，在这种情况下，你为每个接口使用一个\
  \ `subnet` 声明。如果只有一个物理接口但该接口连接到多个逻辑子网，你也可以这样做。3.0 之前的 `dhcpd` 版本需要为每个物理接口提供单独的 `subnet`\
  \ 声明，无论服务器是否要在该接口上运行。例如，如果计算机要在 192.168.1.0/24 网络上作为 `DHCP` 服务器工作，但在 172.20.30.0/24\
  \ 网络上不工作，你仍然需要为后一个接口提供一个 `subnet` 声明。该声明可以为空，如下：\n\n```\nsubnet 172.20.30.0 netmask\
  \ 255.255.255.0 {\n}\n```\n\n此空声明会导致服务器不响应该接口上的 `DHCP` 请求。`dhcpd` 的 3.0 版本允许你省略此空声明以达到相同的目的。\n\
  \n### 警告\n\n![警告](img/warning.gif)\n\n如果你正在将某台计算机配置为某个网络上的 `DHCP` 服务器，而另一台计算机作为该计算机连接的另一个网络上的\
  \ `DHCP` 服务器，请务必配置你的服务器使其不响应第二个网络上的 `DHCP` 请求。如果没有正确配置以协同工作，单个网络上的两个 `DHCP` 服务器可能会导致灾难。事实上，你可能希望使用防火墙规则（如\
  \ 第 25 章 中讨论）阻塞第二个网络接口上的入 `DHCP` 流量。更好的做法是将 `DHCP` 服务器功能移动到仅到第一个网络的计算机上。\n\n## 分配固定地址\n\
  \n客户端计算机通常可以使用动态 IP 地址运行得很好。互联网协议的工作原理是由客户端与服务器建立连接。因此，客户端必须能够找到服务器的 IP 地址。客户端在建立连接时可以将自己的地址传递给服务器。因此，客户端的\
  \ IP 地址周期性变化没有关系，特别是当客户端重启时地址发生变化更是没有影响。（会话期间更改 IP 地址会导致问题，因为它会破坏现有连接。）\n\n尽管如此，某些情况下你可能希望为\
  \ `DHCP` 客户端配置固定 IP 地址。这样做的主要原因可能是该 `DHCP` 客户端实际上是另一种协议的服务器。你可能还想这样做有助于网络诊断——例如，能够使用\
  \ `ping` 通过固定主机名而非 IP 地址来测试与计算机的基本连通性。（尽管如此，“与 DNS 服务器通信”章节也描述了将动态 IP 地址链接到固定主机名的另一种方法。）幸运的是，`dhcpd`\
  \ 提供了向特定计算机交付固定 IP 地址的手段，尽管与动态 IP 配置相比，这样做需要额外的工作。实现此最常见的方法是找到目标计算机的 MAC 地址，并配置\
  \ `dhcpd` 使该地址与你选择的 IP 地址建立固定关联。\n\n## 定位客户端 MAC 地址\n\nMAC 地址是几类网络硬件进行网络的核心。以以太网为例，MAC\
  \ 地址是一个六字节数字，通常用十六进制（16 进制）表示，并在字节之间使用冒号或其他标点符号，如 00:80:C8:FA:3B:0A。以太网设备发送到以太网线上的每个数据包都通过其\
  \ MAC 地址标识，因此 `dhcpd` 可以利用这一事实来识别网卡，以及连接到网卡的计算机。（尽管大多数操作系统都提供了覆盖 MAC 地址的手段，因此它并不是一种识别特定硬件的真正可靠且安全的方法。然而，这种方法对于大多数目的是足够的。）其他类型的网络硬件也支持原理与以太网\
  \ MAC 地址相似的 MAC 地址。\n\n### 注意\n\n![注意](img/note.gif)\n\n\n\n\n以太网 `MAC` 地址的前三个字节用于标识网卡的制造商，而剩余的三个字节由制造商自行分配。你可以在特定网站查询特定\
  \ `MAC` 地址的制造商，例如 [`www.coffer.com/mac_find/`](http://www.coffer.com/mac_find/)\
  \ 或 [`www.cavebear.com/CaveBear/Ethernet/vendor.html`](http://www.cavebear.com/cavebear/ethernet/vendor.html)。配置\
  \ `DHCP` 不需要这些信息，但当你根据 `DHCP` 客户端广播定位特定计算机时，这些信息可能会很有帮助。请注意，制造商是`以太网卡`的制造商，可能与计算机的制造商不同。事实上，一些较小的品牌（例如以电脑超级商店名义销售的网卡）实际上是由其他公司制造的，它们的\
  \ `MAC` 地址可能反映了这一事实。\n\n为了让 `dhcpd` 使用 `MAC` 地址为特定客户端分配特定的 `IP` 地址，你需要找到客户端的 `MAC`\
  \ 地址。有几种方法可以实现这一点，取决于硬件和客户端的操作系统。如果你足够好，硬件制造商会在网卡上印制 `MAC` 地址，通常在贴在网卡上的标签上。如果是这种情况，你可以直接从硬件本身复制\
  \ `MAC` 地址。然而，这并不是通用的做法，即使你的制造商这样做了，打开电脑读取以太网卡上的 `MAC` 地址也可能并不方便。出于如此，还有一些软件方法可以获取\
  \ `IP` 地址。\n\n### 注意\n\n![注意](img/note.gif)\n\n如果你配置计算机从你的 `DHCP` 服务器获取临时动态 `IP`\
  \ 地址以启动其接口以便你确定 `MAC` 地址，那么客户端在下次重启时可能会请求相同的 `IP` 地址。你可能需要将其关闭，直到该租约过期，以便获取新的固定\
  \ `IP` 地址。\n\n### 从客户端定定 `MAC` 地址\n\n在 Linux 和其他类 UNIX 客户端中，你可以通过使用 `ifconfig` 命令来获取\
  \ `MAC` 地址。输入 `ifconfig eth0`（或在适当的情况下使用另一个接口标识符），系统将返回有关该接口的一组信息。输出中将包含类似下面的一行内容：\n\
  \n```\n eth0      Link encap:Ethernet  HWaddr 00:80:C6:F9:3B:BA\n```\n\n被标识为 `HWaddr`（硬件地址的缩写）的值就是\
  \ `MAC` 地址——在本例中为 00:80:C6:F9:3B:BA。此命令只有在你加载了以太网驱动程序并至少启动了接口后才能生效。尽管如此，接口并不绑定到\
  \ `TCP/IP` 协议栈。\n\n在 Windows 2000 中，你可以通过 `IPCONFIG` 程序获取 `MAC` 地址，它在许多方面与 Linux\
  \ 的 `ifconfig` 类似。在 DOS 提示符窗口中输入 `IPCONFIG /ALL` 以获取系统网络接口信息的完整列表。该列表将包含类似下面的一行：\n\
  \n```\n Physical Address. . . . . . . . . : 00-50-BF-19-7E-99\n```\n\n在 Windows\
  \ Me 中，`IPCONFIG` 的等效程序是 `WINIPCFG`。不过，这是一个 `GUI` 工具。一旦启动，它看起来类似于图 5.1，它在标记为“适配器地址”（Adapter\
  \ Address）的字段中显示 `MAC` 地址。\n\n![WINIPCFG 显示网络接口的信息，并允许你控制 Windows 9x/Me DHCP 客户端。](img/05fig01.gif)\n\
  \n**图 5.1. WINIPCFG 显示网络接口的信息，并允许你控制 DHCP 客户端。**\n\n如果你的客户端是运行 MacOS 的 Macintos，你可以从\
  \ TCP/IP 控制面板找到 `MAC` 地址。点击 TCP/IP 按钮获取对话框，其中显示了 `MAC` 地址。在 MacOS X 中，此信息可以在系统偏好设置的“网络”项目中找到，如图\
  \ 5.2。它在窗口左下角被称为“以太网地址”。\n\n![MacOS X 在网络偏好设置中显示 MAC 地址。](img/05fig02.gif)\n\n**图\
  \ 5.2. MacOS X 在网络偏好设置中显示 MAC 地址。**\n\n其他操作系统也提供类似的获取 `MAC` 地址的方法。如前面的示例所示，不同操作系统所使用的方法各异，因此你可能需要在其\
  \ GUI 中查找或查阅其文档。如果你找不到定位 `MAC` 地址的方法，你可能需要从服务器进行，如前所述。\n\n### 从服务器定位 `MAC` 地址\n\n\
  定位 `MAC` 地址的另一种方法是从 `DHCP` 服务器进行。这种方法取决于客户端网络栈的正常运行。确保基本功能的一种简单方法是将客户端配置 `DHCP`\
  \ 并启动它，让你的 `DHCP` 服务器从动态地址池为其分配动态 `IP` 地址，如前面的章节“分配地址”所述。然后你可以检查服务器上的 DHCP 租约文件（通常为\
  \ `/var/lib/dhcp/dhcpd.leases`）。该文件应包含类似下面的的条目：\n\n```\nlease 192.168.1.50 {\n \
  \ starts 4 2002/07/19 21:37:20;\n  ends 4 2002/07/19 23:17:20;\n  binding state\
  \ active;\n  next binding state free;\n  hardware ethernet 00:50:56:82:01:03;\n\
  }\n```\n\n这显示了分配的 `IP` 地址、租约开始和结束时间以及各种其他信息，包括 `MAC`（`hardware ethernet`）地址在本例中为\
  \ 00:50:56:82:01:03。当然，为了使用这种方法，你需要某种方法确定与新客户端关联的 `IP` 地址。你可能可以在客户端本身发现此信息，或者根据租约时间推断出来。\n\
  \nLinux 日志文件（通常为 `/var/log/messages`）也可能包含 `MAC` 地址。尝试使用以下命令搜索其中最近的 `dhcpd` 日目：\n\
  \n\n\n\n\n```\n## grep dhcpd /var/log/messages | tail -n 1\nJul 19 18:27:38 speaker\
  \ dhcpd: DHCPACK on 192.168.1.50 to 00:50:56:82:01:03 via eth0\n```\n\n一旦服务器向客户端交付了地址，你就需要立即执行此命令。如果你不确定客户端收到的\
  \ `IP` 地址，那么就有可能获取错误地址的风险，特别是当其他客户端在你的目标系统之后立即获取或续租租约时。如果你知道客户端的 `IP` 地址，也可以通过检查\
  \ `IP` 地址来双重确认你获取了正确的 `MAC` 地址。如果它们不匹配，请为 `tail` 命令的 `-n` 参数使用大于 `1` 的值，以查看来自 `dhcpd`\
  \ 更早的消息，从而找到正确的条目。\n\n最后，无论你是配置客户端使用 `DHCP` 还是给它分配一个静态 `IP` 地址，你都可以使用 `arp` 命令来确定其\
  \ `MAC` 地址。在网络中的任何 Linux 计算机上输入此命令，后跟上客户端当前的 `IP` 地址：\n\n```\n # arp 192.168.1.50\n\
  Address         HWtype  HWaddress           Flags Mask   Iface\n192.168.1.50   \
  \ ether   00:50:56:82:01:03   C            eth0\n```\n\n尽管如此，你可能需要在使用 `arp` 获取读取结果之前向客户端发起数据传输。使用\
  \ `ping` 发送单个包即可完成任务，例如 `ping -c 1 192.168.1.50`。\n\n## 通过 `MAC` 地址定义主机\n\n要配置 `dhcpd`\
  \ 为具有特定 `MAC` 地址的计算机交付固定的 `IP` 地址，你应该首先像配置动态 `IP` 地址设置一样配置服务器。你可以以 `Listing 5.1`\
  \ 作为模板开始，并根据你的网络对其进行相同类型的更改，例如修改 `DNS` 服务器和网关地址，或添加你可能需要的任何全局参数。然后，你必须为每个接收固定地址的客户端添加一个\
  \ `host` 声明。这些声明可以位于 `subnet` 声明内部，也可以位于其之后，格式如下：\n\n```\n host teela {\n   hardware\
  \ ethernet 00:05:02:a7:76:da;\n   fixed-address 192.168.1.2;\n}\n```\n\n该声明以关键字\
  \ `host` 开始，然后提供一个主机名（不带域名），尽管该主机名可能可能不会传递给客户端，这取决于 `use-host-decl-names` 等其他参数。大括号内有两个参数。第一个（`hardware`）列出了此声明适用于硬件类型和\
  \ `MAC` 地址。此示例显示了以太网配置，但如果你有令牌环（Token Ring）网络，则可以指定 `token-ring`。第二个参数（`fixed-address`）提供了要交付给该客户端的\
  \ `IP` 地址。确保此地址位于整个 `subnet` 声明中 `range` 参数设置的范围之外，但在指定的网络块之内。例如，上述示例（地址为 192.168.1.2）位于\
  \ `Listing 5.1` 中提供的动态 `IP` 地址范围 192.168.1.50–192.168.1.150 之外，但在 `subnet` 声明涵盖的\
  \ 192.168.1.0/24 网络块之内。\n\n你可以通过这种方式定义任意数量的特定客户端，可以将使用固定 `IP` 地址的客户端与使用动态 `IP` 地址的客户端混合使用。如果你既有\
  \ `range` 语句又有一个或多个 `host` 声明，任何 `MAC` 地址未显式列在 `host` 声明中的计算机都将从动态 `IP` 地址范围接收 `IP`\
  \ 地址。\n\n## 自定义客户端特定参数\n\n如前所述，多行声明可能包含仅在该 particular 声明内生效的参数。事实上，`host` 声明中的 `hardware`\
  \ 和 `fixed-address` 语句都是参数。你还可以为特定主机指定许多其他参数。如果你想覆盖这些参数，可以使用 `get-lease-hostnames`\
  \ 或 `use-host-decl-names`。你最可能想要按台计算机设置的选项是 `name`。它设置了提供给 `DHCP` 服务器的主机名。\n\n你还可以对特定的客户端组应用选项。一种方法是为每个组定义单独的子网，但这种方法在客户端隔离时效果最好。更通用地说，你可以使用\
  \ `group` 声明来创建一个带有某些参数的组。例如，你可以使用如下所示的内容：\n\n```\n group {\n   get-lease-hostnames\
  \ true;\n   host teela {\n      hardware ethernet 00:05:02:a7:76:da;\n      fixed-address\
  \ 192.168.1.2;\n   }\n   host nessus {\n      hardware ethernet 00:50:BF:19:99;\n\
  \      fixed-address 192.168.1.3;\n   }\n}\ngroup {\n   use-host-decl-names true;\n\
  \   host hindmost {\n      hardware ethernet 00:50:56:81:01:03;\n      fixed-address\
  \ 192.168.1.4;\n   }\n   host louiswu {\n      hardware ethernet 00:e0:98:71:60:c1;\n\
  \      fixed-address 192.168.1.5;\n   }\n}\n```\n\n此示例通过 DNS 查询为前两个客户端（`teela` 和\
  \ `nessus`）提供主机名，并通过 `host` 声明中的名称为后两个（`hindmost` 和 `louiswu`）提供主机名。你也可以以此方式使用此功能，例如为不同的计算机提供启动文件（使用\
  \ `filename` 和 `next-server` 参数），或为某些计算机配置特定的 TCP/IP 设置，以优化这些系统的性能，但可能会降低其他计算机的性能。\n\
  \n## 与协议集成\n\n某些类型的 `DHCP` 选项需要其他包与 `DHCP` 服务器交换数据。通常情况下，这是 DHCP 客户端接受并使用来自 `DHCP`\
  \ 服务器的附加信息的问题。有时，其他服务器必须咨询 `DHCP` 服务器来帮助其配置。前面的讨论包含了一个 `DHCP` 服务器使用另一个服务器获取信息的示例：`get-lease-hostnames`\
  \ 参数允许 `DHCP` 服务器根据所分配 `IP` 地址的 DNS 服务器查询来设置客户端的主机名。\n\n## 包含 NetBIOS 信息\n\n\n\n\
  \n\nNetBIOS 是第 7 章 中描述的服务器消息块 (SMB)/通用互联网文件系统 (CIFS) 文件和打印机共享协议的基础，它在 `TCP/IP` 之上使用一系列结构和工具。你可以配置\
  \ `DHCP` 服务器向 Windows 客户端交付其中某些结构的信息，以帮助这些系统最高效地运行。具体而言，你可以设置以下 `dhcpd.conf` 参数：\n\
  \n*   `option netbios-name-servers` `server-addresses`—. **传统上，NetBIOS 依赖于与大多数 `TCP/IP`\
  \ 客户端使用的独立的名称解析系统。NetBIOS 计算机可以使用广播模型（即计算机在局域网上发送广播以定位客户端），也可以使用独立于 `TCP/IP` 客户端使用的\
  \ `DNS` 名称服务器的名称服务器。这些独立的名称服务器被称为 NetBIOS 名称服务 (`NBNS`) 服务器或 Windows 名称服务 (`WINS`)\
  \ 服务器。你可以通过 `option netbios-name-servers` 参数为 Windows 客户端提供这些服务器的名称。你通常在这里只列出一个服务器，尽管\
  \ `DHCP` 可以交付多个 `WINS` 服务器地址。**\n\n*   `option netbios-node-type` `type-code`—.\
  \ **此选项与前一个配合使用，告知客户端使用广播名称解析还是 `WINS` 服务器。`type-code` 是一个从 `1` 到 `8` 的值。值 `1` 和\
  \ `2` 分别表示使用广播或 `WINS` 服务器。值 `4` 和 `8` 表示两者都使用，其中 `4`导致客户端先尝试广播并回退到 `WINS` 服务器，而\
  \ `8` 则先使用 `WINS` 并回退到广播。大多数拥有 `WINS` 服务器的网络应该使用 `type-code` 值为 `8`，因为这会减少网络广播，并在\
  \ `WINS` 服务器宕机或缺少特定计算机的数据时提供最可靠的运行。**\n\n*   `option netbios-dd-server` `server-address`—.\
  \ **此选项设置了 NetBIOS 网络中一个较不为人知的方面：NetBIOS 数据报文分发 (`NBDD`) 服务器的地址。该服务器会将广播中继给可能无法接收这些广播的客户端。你可能不需要设置此选项。**\n\
  \n*   `option netbios-scope` `string`—. **NetBIOS 范围是指一组计算机，给定的 NetBIOS 名称在这些范围内是已知的。大多数\
  \ NetBIOS 系统保持其范围不变，因此网络上的任何 NetBIOS 计算机都可以解析任何其他计算机的名称。但如果你的网络使用了 NetBIOS 范围，你可能需要设置此选项（可能在\
  \ `group` 声明中）。**\n\n在向 Windows 客户端交付 `IP` 地址的 `DHCP` 服务器上全局设置前两个选项通常是有益的。（Linux\
  \ 的 Samba 软件包不使用 `DHCP` 交付的值，但其 Windows 客户端可能会使用。）例如，你可能在 `dhcpd.conf` 文件的顶部包含以下两行：\n\
  \n```\n option netbios-name-servers 192.168.1.1;\noption netbios-node-type 8;\n\
  ```\n\n为了确保 Windows 计算机使用这些信息，你应该检查 Windows 中 `TCP/IP` 属性对话框中的“使用 DHCP 进行 WINS 解析”选项，如图\
  \ 5.3 所示。如果你选择“禁用 WINS 解析”，系统将完全不使用 `WINS`；如果你选择“启用 WINS 解析”，则必须手动输入 `WINS` 服务器的\
  \ `IP` 地址。\n\n![你必须明确配置 Windows 客户端使用由 DHCP 服务器提供的 NetBIOS 特定选项。](img/05fig03.gif)\n\
  \n**图 5.3. 你必须明确配置 Windows 客户端使用由 DHCP 服务器提供的 NetBIOS 特定选项。**\n\n## 与 DNS 服务器通信\n\
  \n如果你希望能够从随机系统直接寻址 `DHCP` 客户端，你有两个选择：你可以按照本章前面的配置 `DHCP` 服务器为客户端提供固定的 `IP` 地址；或者配置\
  \ `DHCP` 服务器和 `DNS` 服务器相互通信，以更新 `DNS` 服务器的记录来反映 `DHCP` 客户端的地址。后一种方法在 `DHCP` 客户端地址不经常变化，且你主要感兴趣从局域网上的其他系统访问\
  \ `DHCP` 客户端时效果最好。当需要访问互联网时，变化的 `IP` 地址可能需要一些时间才能传播到互联网的 `DNS` 服务器，因此在地址更改后的一段时间内，可能仍尝试通过旧地址访问计算机。\n\
  \n在 3.0 版本之前，`dhcpd` 不包含对 `DNS` 更新的显式支持。然而，版本 3 实现了两种初步的 `DNS` 更新方法。另一种有望成为互联网标准，并一旦标准确定，将在未来的版本中实现。目前实现的两种方法是即时法\
  \ (ad-hoc) 和过渡法 (interim)。\n\n### 注意\n\n![注意](img/note.gif)\n\n其他更新方法方法，它们通常由第三方软件包实现。这些工具监控\
  \ `DHCP` 日志文件，并在 `DHCP` 日志显示重要操作时更改 `DNS` 服务器的配置。\n\n动态 `DNS` 更新通过 `ddns-update-style`\
  \ 参数启用，该参数有三个值：`ad-hoc`、`interim` 或 `none`（后者是默认值）。要使用动态 `DNS`，需要在 `dhcpd.conf`\
  \ 文件的全局部分启用前两个值之一——如果你尝试仅为某些客户端启用它，它将不起作用。\n\n### 警告\n\n![警告](img/warning.gif)\n\
  \n这两种 `DNS` 更新方法都依赖于 `DNS` 服务器接受更新。该主题在第 18 章 中有介绍。\n\n## 使用即时法更新方法\n\n即时法通过以下四种方式之一为客户端获取主机名，优先级如下：\n\
  \n\n\n\n\n1. 如果 `host` 声明包含 `ddns-hostname` 选项，则使用该选项的值。\n2. 如果客户端传递了完全限定域名（FQDN——即包含域名部分的完整主机名），`DHCP`\
  \ 服务器将使用 `FQDN` 中的主机名部分。\n3. 如果客户端传递了不带域名的主机名，`DHCP` 服务器将使用该主机名。\n4. 可以使用客户端的 `host`\
  \ 声明的名称。\n\n在所有这些情况下，仅使用本地主机名部分。如果这些方法都没有产生主机名，则 `DHCP` 服务器将不会尝试为客户端执行 `DNS` 更新。如果\
  \ `DHCP` 服务器找到了主机名，服务器会将主机名与 `ddns-domainname` 选项的值（如果存在）如果没有 `ddns-domainname`\
  \ 选项，则与 `domain-name` 选项相结合。\n\n`DHCP` 服务器使用其派生的 `FQDN` 来更新 `DNS` 服务器。它首先更新 A 记录——即控制正向查询的记录，用户在其中输入主机名并从中获取\
  \ `IP` 地址。如果 A 记录更新成功，`DHCP` 服务器将会更新 PTR 记录，该记录用于反向查询，用户在其中输入 `IP` 地址以获取主机名。\n\n\
  ### 使用中间更新方法\n\n中间更新方法在许多方面与即时（ad-hoc）方法类似，但它支持允许客户端在提出请求时更新 `DNS` 服务器的 A 记录。你可以在\
  \ `dhcpd.conf` 文件中包含 `allow client-updates` 或 `ignore client-updates` 语句，分别告诉 `DHCP`\
  \ 允许客户端自行完成这项工作或忽略此类请求。默认值是尊重此方面的客户端请求。\n\n如果配置 `DHCP` 服务器尊重客户端的 `DNS` 更新，则 `DHCP`\
  \ 服务器将使用客户端提供的 `FQDN` 来执行 PTR 更新。如果 `DHCP` 服务器禁用此选项，则 `DHCP` 服务器将根据客户端主机名和 `dhcpd.conf`\
  \ 中设置的域名构建一个 `FQDN`，并使用该名称同时更新 A 和 PTR 记录。\n\n当配置为不允许客户端发起的 `DNS` 更改时，中间方法产生的结果与即时方法相似。然而，当中间方法允许客户端发起的\
  \ `DNS` 更改时，存在差异：客户端可能会指定一个与 `DHCP` 服务器配置使用的域名不同的域名。例如，假设 `DHCP` 服务器在 `threeroomco.com`\
  \ 域名下分配主机名。使用即时方法，所有接收 `DNS` 更新的客户端都将在该域名下接收，即使客户端提供了另一个域名的 `FQDN`。使用配置为允许客户端更新的中间方法，客户端可以声称为例如\
  \ `dino.pangaea.edu` 的主机名。假设该域的 `DNS` 服务器接受更新，则就可以通过该名称访问客户端。如果你自己的 `DHCP` 和 `DNS`\
  \ 服务器完全互操作，那么当查询与客户端动态分配的 `IP` 地址关联的名称时，用于反向查询的 PTR 记录也将返回 `dino.pangaea.edu` 名称。这种配置在即时方法中是不可能的。这种配置是否理想由你自行决定。如果你的网络连接受到严格控制，并且你的用户可能需要外部域的主机名，这种配置可能是理想的。不过，如果你的网络在物理上容易访问，你可能倾向于防止此类配置，因为对链接到外部域的\
  \ `IP` 地址进行反向查询可能会引起混惑，或帮助破解者掩盖非法活动。\n\n### 动态 DNS 服务\n\n某些宽带互联网接入的用户（如数字用户线路 (DSL)\
  \ 和电缆调制解调器）通过 `DHCP`或其他协议从其 ISP 接收动态 `IP` 地址。如果你处于这种情况并想要一个固定的主机名，你可能无法使用 Linux\
  \ 上的 `DHCP` 和 `DNS` 的动态 DNS 功能，因为你实际上需要做的是与可互联网访问的 `DNS` 服务器互操作。解决方案是使用许多免费或低成本提供的动态\
  \ DNS 服务。\n\n动态 DNS 服务运行自己的 `DNS` 服务器，在整个范围内提供查询。一旦你与此类服务签约，每当你的 `IP` 地址变化时，你可以使用计算机上的客户端包联系提供者的\
  \ `DNS` 服务器。然后你可以拥有一个固定的主机名（在动态 DNS 提供商拥有的域名内或自己的域名内），指向你的动态 `IP` 地址。许多动态 DNS 服务商提供用\
  \ Perl 或其他脚本语言编写的更新软件，因此它们大多数都与 Linux 兼容。不过，你应该检查这一细节以确保如此。\n\n现在有很多动态 DNS 服务商。事实上，有大量的动态\
  \ DNS 服务商列表。这些包括 http://www.technopagan.org/dynamic/、http://www.geocities.com/kiore_nz/，以及\
  \ http://dns.highsynth.com。如果你不运行自己的外部可访问 `DNS` 服务器，这些列表中的一个应该能够引导找到适合你动态 DNS 服务商。\n\
  \n\n\n\n\n`DHCP` 对于小型和大型网络来说都是一个非常重要的协议。通过将配置细节集中到单台服务器上，你可以极大地简化运行几乎任何操作系统的客户端计算机的配置配置。主要的代价是\
  \ `DHCP` 服务器本身需要配置和维护——如果它宕机或配置错误，网络上的客户端可能无法正常运行。你可以配置 `DHCP` 服务器从地址池中分发 `IP` 地址，而不必考虑哪台计算机接收某个特定地址；也可以基于固定基础，让某台特定的计算机每次都接收到相同的\
  \ `IP` 地址。如果你需要通过名称来联系 `DHCP` 客户端，后者可能是最好的配置，但即使是动态 `IP` 地址，也可以通过使用 Linux `DHCP`\
  \ 服务器第 3 版本中的功能，让 `DHCP` 服务器与域名的 `DNS` 服务器进行通信，从而将其与主机名关联起来。\n\n# 第 6 章：通过 Kerberos\
  \ 验证用户\n\nLinux 系统通常使用本地身份验证——也就是说，当用户输入用户名和密码时，计算机使用自己的身份验证数据库来决定是否授予用户访问权限。该系统的另一个后果是，需要密码访问的服务器（例如\
  \ `POP` 邮件服务器和 `FTP` 服务器）需要用户输入密码并将其通过网络发送。这种方法对于孤立的计算机以及用户在网络上其他系统中没有账户的计算机是合理的。然而，当一组用户在许多计算机上都拥有账户时，维护这些账户可能会非常繁琐。此外，由于密码在网络电缆中传输时（通常是未加密的形式），恶意个人通过窃取密码造成破坏的几率很大。这些正是\
  \ Kerberos 旨在解决的问题。该工具允许你维护一个集中化的用户数据库。单台计算机在验证用户时会听从这个集中式数据库，并使用复杂的加密技术来确保数据传输不受劫持。\n\
  \n### 注意事项\n\n![NOTE](img/note.gif)\n\n`Kerberos` 这个名字源自希腊神话；Kerberos 是守卫冥界的三头狗。罗马人将这个名字拼写为\
  \ `Cerberus`，但 Kerberos 的开发者使用了希腊语拼写。许多 Kerberos 网页都展示着神话中那只三头狗的图形。\n\n要运行 Kerberos\
  \ 服务器，理解其构建的基础原理至关重要，包括 Kerberos 的不同版本及其需求。与其他网络协议一样，Kerberos 同时使用客户端和服务器。为了发挥作用，你必须能够配置这两者，因此本章涵盖了这两个选项。\n\
  \nKerberos 是一个极其复杂的协议，要充分利用它，你不仅需要配置单台 Kerberos 服务器，还需要配置网络中的许多服务器和客户端。出于此原因，本章仅对\
  \ Kerberos 配置浅尝介绍。要实现比搭建基本的 Kerberos 系统之外的功能，你需要咨询额外的文档，其中大部分可以从 Kerberos 主网站 [`web.mit.edu/kerberos/www/`](http://web.mit.edu/kerberos/www/)\
  \ 获取。该页面包含了指向官方和非官方 Kerberos 文档以及该协议实现的链接。\n\n## 何时运行 Kerberos 服务器\n\n防火墙等工具（在第\
  \ 25 章 中讨论过）旨在保护计算机或网络免受外界的影响，或保护外部世界免受本地网络内部分子的侵害。相比之下，Kerberos 是一种*内部*安全工具——它帮助服务器和客户端确保它们正在与正确的系统和用户通信，并保护密码使其不被其他本地网络用户窃取和滥用。（Kerberos\
  \ 还可以通过为需要访问内部服务器的外部用户提供加密来提高外部安全性。）同时，Kerberos 提供了便利——通过集中密码数据库，Kerberos 允许用户登录网络上的任何工作站并仅输入一次登录密码，从而消除了为\
  \ `POP` 邮件服务器、`FTP` 服务器和其他需要密码的本地服务器输入密码的麻烦。\n\n这些特性使得 Kerberos 在中大型本地网络中成为非常有用的工具，例如许多学院、大学和公司运营的网络。此类网络经常在内部托管邮件服务器、打印服务器等，并允许用户登录许多位置的工作站。这些组织的用户使用带有终端的集中式计算机系统，而是使用更强大的工作站。在这样的网络上，维护个性化的密码数据库充其量是极其繁琐的，因此\
  \ Kerberos 是一个实用的工具。\n\nKerberos 是一个跨平台工具；Kerberos 客户端和服务器可以存在于 Linux、其他 UNIX 类操作系统、Windows、MacOS\
  \ 或许多其他操作系统。（尽管，微软自己的 Kerberos 实现与标准版本有细微的不兼容。MIT Kerberos 页面包含了另一个适用于 Windows 的\
  \ Kerberos 实现链接，该实现与标准的兼容性更高。）跨平台兼容性在许多环境中可能是一个极其重要的特性。\n\n## 集中式与分布式计算\n\n在 20\
  \ 世纪 60 年代后期到 80 年代的大部分时间，UNIX 系统通常供几个人同时使用。这些计算机位于机房内，通过文本模式终端或后期提供 `GUI` 访问的 X\
  \ 终端使用。随着处理能力变得廉价，出现了一种将工作站放在所有用户桌子上的趋势。现代 `x86` PC 就是这种趋势的体现。\n\n今天，大多数网络使用很大程度上去中心化的计算模型，运行\
  \ Windows、MacOS 或偶尔运行 Linux 或其他 UNIX 变体的工作站。这些计算机可能依赖邮件服务器、文件服务器、打印服务器等网络服务器，但它们大部分处理都在本地完成。这种网络在健壮性方面具有优势，因为如果某个服务器宕机，网络的其他部分可能会继续运行。这种分布式方法意味着所有用户都可以依靠至少的处理能力——取决于本地工作站上的可用资源。在这样的简单网络中，用户通常被绑定到特定的计算机，因为他们只在自己的计算机上有密码。这是\
  \ Kerberos 旨在解决的问题之一。\n\n\n\n\n如今的 `x86` 计算机比几十年前的主机要强大得多，并且可以使用中心化计算方法来使用它们。一个功能强大的\
  \ Linux 系统可以运行许多用户的程序。这些用户可以坐在性能低得多的系统上，这些系统仅作为终端运行，使用如第 13 章（维护远程登录服务器）和第 14 章\n\
  \n许多使用密码访问远程服务器的应用程序为用户提供了保存密码的选项。这在拉取邮件客户端中很常见，例如。（第 11 章,邮件协议：POP 和 IMAP 介绍了这些协议。）通过这种方式保存密码时，用户不需要重新输入；但在工作站被入侵的情况下，将密码保存到磁盘存在安全风险。此外，如果用户更改了密码，可能需要在多个程序中更改，这可能很麻烦。Kerberos\
  \ 消除了这两个问题。\n\n\n\n\n\nKerberos 的设计也为了满足各种技术要求，这些要求部分取决于系统的设计细节，但从用户或管理员的角度来看，上述三点是主要需求。为了实现这些目标，Kerberos\
  \ 依赖于其票据（tickets）。其工作流程如下：\n\n1. 工作站上的用户想要使用某服务，因此输入用户名和密码。\n2. 工作站（Kerberos 客户端）将用户名发送给\
  \ `KDC`，并请求获取 `ticket-granting ticket (TGT)`。该请求由一个被称为 `ticket-granting service\
  \ (TGS)` 的特定 Kerberos 子集处理。\n3. `KDC` 在其数据库中检查该用户名。如果用户名存在，`KDC` 将返回一个 `TGT`。该票据包含此类信息，例如该\
  \ `TGT` 对应的用户名、`TGT` 的签时间以及 `TGT` 的有效期限。`KDC` 使用用户名数据库中的密码对 `TGT` 进行加密并将其发送回客户端。\n\
  4. 客户端接收 `TGT`，并尝试使用用户输入的密码对 `TGT` 解密。如果此过程成功，客户端将持有该票据，对用户是透明的。\n5. 客户端使用从 `TGT`\
  \ 中提取出的数据向 `KDC` 请求获取特定服务器的票据。`KDC` 识别出这些数据是有效的（因为它们已被成功解密并重新加密），并通过发送服务器票据进行回复。该票据用\
  \ `target server's` 密码加密（只有服务器和 `KDC` 该密码），并包含此类信息，如请求者的用户名、所请求的服务名称、时间戳、票据的有效期以及一个\
  \ `session key`（会话密钥），会话密钥是由 `KDC` 创建并与服务器和客户端共享的另一个密码。该票据的寿命很短，以减少被截获和滥用的风险。\n\
  6. 客户端接收并持有该服务票据，对用户是透明的。（客户端不会尝试解密此票据。）\n7. 客户端将服务票据发送给目标服务器，请求数据传输会话。\n8. 服务器使用其密码对票据进行解密；当且仅当票据由\
  \ `KDC` 正确加密时，此操作才能正常工作。如果请求是有效的（解密正确、来自有效用户等），服务器将使用会话密钥对给客户端的回复进行加密。\n9. 客户端接收服务器的回复。当仅当此回复有效时，客户端就可以认为服务器是真实的，因此客户端只有在收到来自服务器的正确回复时，才会完成连接并开始数据传输。\n\
  \n从这里开始，数据传输的进行在很大程度上与没有 Kerberos 的情况相同，尽管某些支持 Kerberos 的应用程序支持其非 Kerberos 版本版本不具备的数据加密功能。最终，`TGT`\
  \ 和服务器票据将过期，但过期时间被设置得足够长（几小时），这对于个人用户来说很少会成为问题。如果票据确实过期，可以进行续期。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n上述步骤在多次交换中使用了时间戳。如果计算机的时钟设置的时间不同，这些时间戳可能会导致事务失败，或降低网络安全性。因此，让 Kerberos 网络上的所有计算机设置为相同的时间至关重要。你可以通过在所有计算机上运行网络时间协议（`NTP`）服务器来实现这一目标，参见第\
  \ 10 章，维护一致的时间：时间服务器。\n\n## Kerberos 服务器的要求\n\n这种设计产生了若干后果。最重要的是，从网络安全的角度来看，`KDC`\
  \ 是一个`极其`敏感的系统。`KDC` 应该运行尽可能少的其他网络服务器（通常只运行管理它所需的服务器——理想情况下为零），它除了管理员之外不应有普通用户，你应该特别注意保持其软件更新，并且它在物理上应该是安全的。由于许多网络服务的使用依赖于\
  \ `KDC`，因此你应该准备好故障计划以防意外。保留 `KDC` 数据的备份并准备好备份硬件以防故障。你甚至可能想维护一个 `slave` 或 `backup\
  \ KDC`，它从 `master KDC` 拉取配置，以便在主 `KDC` 发生故障时，从机可以接管 `KDC` 功能。\n\n`KDC` 的硬件需求取决于你的网络规模，包括计算机数量和用户数量。对于一个只有几十台系统的小型网络，`KDC`\
  \ 可能只需要一台按目前的标准来看非常低端的计算机——毕竟，这样的系统每小时只需要处理几次请求。一台配备低端 Pentium CPU、32MB 内存和几百兆字节硬盘的系统应该绰绰有余。对于拥有成百或数千台计算机的网络，`KDC`\
  \ 可能需要更多的计算能力，特别是在 CPU 能力和网络连接方面。无论何种，你都应该确保 `KDC` 位于网络拓扑中的某个位置，以确保最大的可靠性和最小的数据传输时间。如果你的网络足够大，并且分段方式可能导致某些部分相互隔绝，你可能希望在每个分段中放置从机\
  \ KDC，以尽量减少网络路由中断时的干扰。\n\n## Kerberos 版本与变体\n\n主 Kerberos 软件包可以通过 `http://web.mit.edu/kerberos/www/`\
  \ 获取。该网站托管 Kerberos 源码和几个平台的二进制发行版，但截至 Kerberos V5 Release 1.2.1，还没有 Linux 版本。你也可以从该官方网站获取旧的\
  \ Kerberos V4 以及 Windows 和 MacOS（包括旧的 MacOS Classic 和新的 MacOS X）软件版本。在其他条件相同的情况下，Kerberos\
  \ V5 优于 Kerberos V4；V5 增加了功能并修复了 V4 中的错误。\n\n\n\n\nKerberos 许可证与 X 类似，因此原始 MIT 代码出现了各种开源和商业变体。其中一种由瑞典的皇家理工学院（Royal\
  \ Institute of Technology）发行，并可以通过其网页 [`www.pdc.kth.se/kth-krb/`](http://www.pdc.kth.se/kth-krb/)\
  \ 获取。该变体被称为 eBones，但包文件名通常以字符串 `krb4` 开头。eBones 网站官方分发源码，但 <acronym class=\"acronym\"\
  >FTP</acronym> 站点包含 `binaries` 子目录，其中包含一些贡献的二进制包，包括 Linux 目录。不过，这些可能已经过时了。事实上，eBones\
  \ 本身基于 Kerberos V4 版本，至少在 eBones 1.1 版本为止。\n\n并行计算中心（Center for Parallel Computers）开发了一种名为\
  \ Heimdal 的 Kerberos 实现，总部位于 [`www.pdc.kth.se/heimdal/`](http://www.pdc.kth.se/heimdal/)。该变体基于\
  \ MIT 的 Kerberos V5。你可以从该网站获取源码和编译后的 Linux 可执行文件，包括适用于 Red Hat 的 RPM 包，尽管二进制版本可能落后于最新版本（当前为\
  \ 0.4e）。\n\n某些 Linux 发行版现在已带有 Kerberos 支持。特别是，Debian 2.2 同时带有 eBones 和 Heimdal，Mandrake\
  \ 8.1 带有 Kerberos V5，Red Hat 7.2 带有 Kerberos V5，SuSE 7.3 带有 Heimdal。Caldera 3.1、Slackware\
  \ 8.0 和 TurboLinux 7.0 不带有 Kerberos 支持，但你可以通过编译源码或可能通过安装适用于其他发行版的包来添加包。\n\n### NOTE\n\
  \n![NOTE](img/note.gif)\n\n本章的后续章节将介绍 MIT 的 Kerberos V5。Kerberos V4 在某些重要的配置细节上有所不同，即使是\
  \ Heimdal 这样的 V5 衍生版本也可能与此处描述的不完全相同。在编写本章时，我使用了 Red Hat Kerberos V5 包和原始 MIT 源码的构建作为参考。\n\
  \n## 设置 Kerberos 服务器\n\nKerberos 网络的核心是 Kerberos 服务器——<acronym class=\"acronym\"\
  >KDC</acronym>。与大多数 Linux 服务器一样，它通过存储在 `/etc` 中的纯文本配置文件进行配置。理解此文件的格式可以让你你控制 Kerberos\
  \ 服务器，从而对网络上的其他系统行使某些控制。本章无法介绍 Kerberos 运行每个方面的细节，但本节将描述配置服务器的基础知识。后续章节将讨论配置 Kerberos\
  \ 客户端和应用程序服务器。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n在本节描述的某些配置步骤也必须在 Kerberos\
  \ 客户端和 Kerberos 应用程序服务器上执行。例如，你必须在所有系统中以相同的方式设置领域（realms）（将在稍后的“#设置领域””中进行描述）。\n\
  \n当然，Kerberos 包必须安装在 <acronym class=\"acronym\">KDC</acronym> 上。如果你获得了 MIT 源码，可以按照通常的方法编译并安装它，即使用包中包含的名为\
  \ `configure` 的脚本，然后执行 `make` 和 `make install` 命令。这将安装 Kerberos 服务器、Kerberos 应用程序服务器和\
  \ Kerberos 客户端。我建议你在 `configure` 时使用 `--enable-shared` 选项；这将以共享形式编译 Kerberos 库，从而减小单个\
  \ Kerberos 程序的大小。某些第三方 Kerberos 包依赖于此类配置。二进制包可能会将 Kerberos 组件拆分为单独的包。例如，Red Hat\
  \ 的 Kerberos 分发包含名为 `krb5-libs`、`krb5-server` 和 `krb5-workstation` 的包。你可以通过省略必要的包来精调你的安装。\n\
  \n## 修改服务器配置文件\n\n主要的 Kerberos 服务器配置文件是 `/etc/krb5.conf`。该文件由多个部分组成，每个部分由方括号 `[]`\
  \ 中的关键字开头。在下一个下一个标题之前，后续行定义了与该标题相关的特性。列表 6.1 显示了 <acronym class=\"acronym\">KDC</acronym>\
  \ 的示例 `krb5.conf` 文件。\n\n**示例 6.1. 示例 `krb5.conf` 文件**\n\n```\n [logging]\n default\
  \ = FILE:/var/log/krb5libs.log\n kdc = FILE:/var/log/krb5kdc.log\n admin_server\
  \ = FILE:/var/log/kadmind.log\n\n[libdefaults]\n ticket_lifetime = 24000\n default_realm\
  \ = THREEROOMCO.COM\n dns_lookup_realm = false\n dns_lookup_kdc = false\n\n[realms]\n\
  \ THREEROOMCO.COM = {\n  kdc = kerberos.threeroomco.com:88\n  kdc = kerberos-1.threeroomco.com:88\n\
  \  kdc = kerberos-2.threeroomco.com:88\n  admin_server = kerberos.threeroomco.com:749\n\
  \  default_domain = threeroomco.com\n }\n\n[domain_realm]\n .threeroomco.com = THREEROOMCO.COM\n\
  \ threeroomco.com = THREEROOMCO.COM\n outsider.threeroomco.com = PANGAEA.EDU\n\n\
  [kdc]\n profile = /var/kerberos/krb5.conf\n```\n\n在每个部分内，每行由变量名、等号 `=` 和分配给该变量的值组成。某些部分包含子部分，用大括号\
  \ `{}` 表示。例如，`[realms]` 部分列表 6.1 使用大括号来识别与 THREEROOMCOM 相关的行。这允许你创建一个支持多个领域的文件。\n\
  \n### NOTE\n\n![NOTE](img/note.gif)\n\nKerberos 应用程序服务器和客户端需要的与 <acronym class=\"\
  acronym\">KDC</acronym> 大部分相同的配置部分，但你可以从这些系统中省略 `[logging]` 和 `[kdc]` 部分。某些特定程序可能需要自己的设置。这些通常放在名为\
  \ `[appdefaults]` 的部分中。\n\n<acronym class=\"acronym\">KDC</acronym> 还使用它自己的配置文件\
  \ `kdc.conf`，它通常存储在 `/var/kerberos/k5krb`、`/usr/local/var/k5krb` 或 `krb5.conf` 中\
  \ `[kdc]` 部分指定的类似位置。该文件包含特定于 <acronym class=\"acronym\">KDC</acronym> 的信息，而 `krb5.conf`\
  \ 文件则被 `KDC`、Kerberos 客户端和 Kerberos 应用程序服务器使用。`kdc.conf` 文件的格式与 `krb5.conf` 类似。\n\
  \n## 设置领域\n\n配置领域的通常方法是在 `krb5.conf` 和 `kdc.conf` 文件中进行某些特定的条目。对于前者，你需要在 <acronym\
  \ class=\"acronym\">KDC</acronym>、应用程序服务器和客户端上进行这些更改。然后重启 Kerberos 服务器和应用程序程序以启动更改。\n\
  \n### 修改 `krb5.conf`\n\n`krb5.conf` 文件包含一个 `[realms]` 部分，指定了 <acronym class=\"acronym\"\
  >KDC</acronym> 及其从机。还有一个 `[domain_realm]` 部分，定义了领域与 Internet 域名之间的关系。列表 6.1 显示了这两个部分的示例。\n\
  \n\n\n\n本示例中的 `[realms]` 部分指定了 THREEROOMCO.COM 域的主 KDC 和两个从用 KDC。这些服务器传统上被称为 `kerberos`\
  \ 和 `kerberos-n`，其中 `n` 是表示从用编号的数字，位于该领域对应的域内。虽然在本示例中，域（domain）和领域（realm）名称相同（不区分大小写），如前所述，这并不总是如此。每个\
  \ KDC 规范都包含 KDC 监听连接的端口号——通常为 88。`admin_server` 条目指定了用于管理该域的计算机。这通常与 KDC 是同一台机器，但管理功能使用不同的端口——通常为\
  \ 749。`default_domain` 条目指定了与 Kerberos 实体（principals）关联的域名。默认值是转换为小写的 Kerberos 域名称，因此在本示例中，此条目并不是严格必要的。\n\
  \n可以使用单个 `krb5.conf` 文件指定多个域。要做到这一点，你需要包含单个 `[realms]` 部分，但列出多个域名称，每个域都在自己的大括号（`{}`）内包含特定细节。\n\
  \n### 提示\n\n![提示](img/tip.gif)\n\n在配置 DNS 服务器以处理你的域时，你可能希望使用 CNAME 条目来指定 `krb5.conf`\
  \ 文件及其他地方列出的 KDC 主机名。这样，在发生网络问题或重构时，你可以快速方便地更改作为 KDC 的计算机，而无需修改分散在整个域中的许多 Kerberos\
  \ 配置。另一个选项是使用虚拟 IP 地址——一个使用网络地址转换（NAT；参见第 25 章）的系统在 DNS 服务器中被列为 KDC，但它会将请求转发到另一台实际运行\
  \ KDC 软件的计算机。这样，你可以轻松地将 KDC 功能从一台计算机移动到另一台计算机，而无需调整你的 DNS 条目。\n\n`[domain_realm]`\
  \ 部分根据主机名或域名将计算机映射到特定的 Kerberos 域。该格式列出一个主机名或域名（后者由开头的点指示，如 .threeroomco.com），后跟一个等号和该机器或机器群所属的\
  \ Kerberos 域。列表 6.1 将 threeroomco.com 域中的所有计算机（包括任何仅名为 threeroomco.com 的计算机）映射到\
  \ THREEROOMCO.COM 域，但有一个例外：outsider.threeroomco.com 属于 PANGAEA.EDU 域。\n\n### 修改\
  \ `kdc.conf`\n\n`kdc.conf` 文件包含与 `krb5.conf` 中类似的条目。列表 6.2 显示了一个 `kdc.conf` 文件的示例。你需要在\
  \ `[realms]` 部分进行特定域的更改。最重要的是，你需要更改域的名称（在许多默认配置文件为 EXAMPLE.COM）。`[realms]` 部分还包含设置该域支持的加密密钥类型的条目，但除非你完全理解其后果，否则你不应更改这些。`[kdcdefaults]`\
  \ 部分将服务器指向各种重要的配置文件。\n\n**示例 6.2. 示例 `kdc.conf` 文件**\n\n```\n [kdcdefaults]\n  acl_file\
  \ = /var/kerberos/krb5kdc/kadm5.acl\n  dict_file = /usr/share/dict/words\n  admin_keytab\
  \ = /var/kerberos/krb5kdc/kadm5.keytab\n\n[realms]\n  THREEROOMCO.COM = {\n    master_key_type\
  \ = des-cbc-crc\n    supported_enctypes = des-cbc-crc:normal des3-cbc-raw:normal\
  \ \\\ndes3-cbc-sha1:normal des-cbc-crc:v4 des-cbc-crc:afs3\n  }\n```\n\n### 创建主密钥\n\
  \nKerberos 依赖主密钥来控制对自身的访问。该密钥本质上是一个密码，它可以存储在本地的 stash 文件（存储文件）中，服务器读取该文件以允许自己自动启动。如果没有\
  \ stash 文件，服务器在启动时需要手动干预——有人必须输入主密钥。\n\n由于其关键性，stash 文件应只存储在 KDC 的本地磁盘上，且仅对 `root`\
  \ 可读。除非备份受到非常严格的保护，否则你不应备份此文件。你应该对用于任何密码的主密钥选择应用通用的规则——它不应是字典单词、名称，或源于攻击者可能从公共来源获取的个人数据。你应该使用由大小写字母、数字和标点符号组成的混合字符串，并使其在仍能记住它的情况下越随机随机越好。一个好的起点是基于你记得的某个短语的字母缩写，例如将\
  \ `yesterday I went to the dentist.` 缩写为 `yiwttd`。随机更改某些字母的大小写并添加标点符号和数字。结果可能是 `yi9Wt%Td.`。\n\
  \n要创建主密钥并将其存储在 stash 文件中，使用 `kdb5_util` 命令：\n\n```\n # kdb5_util create -r THREEROOMCO.COM\
  \ -s\n正在为域 'THREEROOMCO.COM' 初始化数据库 '/var/kerberos/krb5kdc/principal'\n将提示数据库密码\n\
  主密钥名称 'THREEROOMCO.COM' 请不要忘记\n输入 KDC 主密钥：\n再次输入 KDC 主密钥以验证：\n```\n\n### 注意\n\n\
  ![注意](img/Images.gif)\n\n出于安全考虑，主密钥不会显示在屏幕上，但你必须输入它。\n\n此命令会在 `/var/kerberos/krb5kdc`\
  \ 目录（或 Kerberos 包用于此目的的其他位置，如 `/usr/local/var/krb5kdc`）创建或初始化多个文件。这些文件包括：\n\nstash\
  \ 文件，可能名为 `.k5.REALM.NAME`，其中 `REALM.NAME` 是域名称；或 `.k5stash`。\n两个 Kerberos 数据库文件：`principal`\
  \ 和 `principal.ok`。（在某些系统中，`principal` 文件名为 `principal.db`。）\n两个 Kerberos 管理文件：`kadm5`\
  \ 和 `kadm5.lock`。\n\n如果你不想使用 stash 文件，可以在 `kdb5_util` 命令中省略 `-s`；这将导致程序不创建 stash\
  \ 文件。那么你每次启动服务器都需要输入 Kerberos 主密钥。\n\n## 管理域\n\n一旦你修改了域的 Kerberos 配置文件并使用 `kdb5_util`\
  \ 创建主密钥以及初始化 Kerberos 数据库，你就可以开始管理该域了。这个过程本质上是定义实体，包括具有添加其他实体权限的实体。\n\n### 定义基础\
  \ ACL\n\nKerberos 实体信息以访问控制列表（ACL）的形式存储，存储在 `kdc.conf` 中 `acl_file` 条目指向的文件中。该文件由以下格式的行组成：\n\
  \n```\n Kerberos 实体     权限             目标实体\n```\n\n### 注意\n\n![注意](img/Images.gif)\n\
  \nKerberos ACL 与 XFS 等文件系统的 ACL 不完全相同，尽管它们都是访问控制机制。文件系统 ACL 允许你以特定方式访问文件。Kerberos\
  \ ACL 指定谁可以以特定方式修改 Kerberos 数据库。Kerberos ACL 不依赖于文件系统的 ACL 支持。\n\n**表 6.1. ACL 文件的权限代码**\n\
  \n| **代码** | **含义** |\n\n| --- | --- |\n\n| `a` | 允许添加实体或策略 |\n| `A` | 禁止添加实体或策略\
  \ |\n\n\n\n\n\n| `d` | 允许删除主体（principals）或策略 |\n| `D` | 禁止删除主体（principals）或策略 |\n\
  | `m` | 允许修改主体（principals）或策略 |\n| `M` | 禁止修改主体（principals）或策略 |\n| `c` | 允许更改主体的密码\
  \ |\n| `C` | 禁止更改主体的密码 |\n| `i` | 允许查询数据库 |\n| `I` | 禁止查询数据库 |\n| `l` | 允许列出数据库中的主体（principals）或策略\
  \ |\n| `L` | 禁止列出数据库中的主体（principals）或策略 |\n| `x` 或 `*` | 所有“允许”ACL (`admcil`) 的通配符\
  \ |\n\n第一项（`Kerberos principal`）是一个主体名称，如前所述。你可以使用星号（`*`）作为主体名称部分的通配符来匹配任意。例如，你可以使用\
  \ `*/admin@THREEROOMCO.COM` 来匹配 THREEROOMCO.COM 域中任何包含 `admin` 实例的主体。这种定义对于授予管理员对\
  \ KDC 的统一访问权限非常有用。\n\n第二项（`Permissions`）是授予该主体的 ACL 代码。每种权限都用单字母代码表示，如表 6.1 所示。你可以合并多个代码以授予多种类型的访问权限，例如使用\
  \ `ali` 允许主体添加用户、列出主体或查询数据库。\n\n最后一项（`Target principal`）可选的，它提供了上述权限所应用的主体名称。例如，你可能希望限制特定用户访问或修改特定主体的权限。与\
  \ `Kerberos principal` 一样，`Target principal` 也可以使用星号作为通配符。\n\n作为一个示例，请考虑以下条目：\n\n\
  ```\n */admin@THREEROOMCO.COM   *\n```\n\n此条目赋予 `admin` 实例中的所有主体对 Kerberos 数据库的完全访问权限。类似的条目是默认设置的。作为一个起点，你可能想将其修改为指向你的领域（realm），其他情况下保持原样。\n\
  \n### 创建主体\n\n你使用 `kadmin` 或 `kadmin.local` 程序来管理你的 Kerberos 用户数据库。前者使用加密的 Kerberos\
  \ 通信从远程系统管理 KDC；后者直接修改本地数据库文件，而不使用网络工具。你必须使用 `kadmin.local` 添加至少一个管理员用户。此后，理论上你可以从其他系统以非常相同的方式使用\
  \ `kadmin`，尽管你你必须在 KDC 上运行了适当的 Kerberos 管理服务器，而在过程的这一阶段，这些服务器尚未运行。\n\n这两个程序都接受各种参数，用于修改你尝试修改数据库的主体名称、你尝试管理的领域等。`kadmin`\
  \ 帮助页提供了这些细节。一旦你启动了程序，就可以在其提示符处输入命令。例如，要添加主体 `admin/admin@THREEROOMCO.COM`，你将使用\
  \ `addprinc` 命令，如下：\n\n```\n # kadmin.local\nAuthenticating as principal root/admin@THREEROOMCO.COM\
  \ with password.\nkadmin.local:  addprinc admin/admin@THREEROOMCO.COM\nWARNING:\
  \ no policy specified for admin/admin@THREEROOMCO.COM;\ndefaulting to no policy\n\
  Enter password for principal \"admin/admin@THREEROOMCO.COM\":\nRe-enter password\
  \ for principal \"admin/admin@THREEROOMCO.COM\":\nPrincipal \"admin/admin@THREEROOMCO.COM\"\
  \ created.\n```\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n与输入密码时一样，密码不会显示在屏幕上，但你必须输入它们。你不应该将\
  \ Kerberos 主密钥重用为管理员密码，或者将其中任何一个作为其他密码。\n\n在创建管理员主体后，你必须为该管理员主体创建一个 `keytab`。这是\
  \ Kerberos 用于解密管理票据的密钥。你不需要自己指定此密钥；Kerberos 可以生成它。但你确实需要使用 `kadmin.local` 中的 `ktadd`\
  \ 命令告诉 Kerberos 这样做：\n\n```\n kadmin.local:  ktadd -k /var/kerberos/krb5kdc/kadm5.keytab\
  \ \\\nkadmin/admin kadmin/changepw\n```\n\n通过在文件名前加上 `-k` 指定存储 keytab 的文件。该文件应与\
  \ `kdc.conf` 文件中 `admin_keytab` 条目指定的文件匹配。然后，列出你想为其添加 keytab 的主体——在本例中为 `kadmin/admin`\
  \ 和 `kadmin/changepw`。（这两个主体是 Kerberos 的标准部分；你不需要显式创建它们。）\n\n除了这些管理员主体，你还应该为你的用户、应用程序服务器和\
  \ KDC 添加主体。你通过 `addprinc` 命令执行此操作，其原理与之前相同。例如，假设你想为 `fluffy@THREEROOMCO.COM` 添加主体。你可能会输入：\n\
  \n```\n kadmin.local: addprinc fluffy@THREEROOMCO.COM\n```\n\n对于服务器，你可能想使用 `-randkey`\
  \ 选项，它告诉系统使用随机密钥。如果你不使用此选项，系统将提示你输入密码。\n\n完成 `kadmin` 后，你可以在主提示符处输入 `quit` 退出程序。\n\
  \n\n\n\n从用 KDC 的配置方式与主 KDC 非常相似。特别是，你应该像配置主 KDC 一样设置 `krb5.conf` 和 `kdc.conf` 文件，使用\
  \ `kdb5_util` 创建数据库文件，设置 ACL 文件，并使用 `kadmin.local` 中的 `ktadd` 命令提取 keytab 文件。\n\n\
  每个 KDC 都需要一个文件来列出所有 KDC（或更准确地说，列出与这些 KDC 关联的主体/principals），用于数据库传播。该文件被称为 `kpropd.acl`，存储在\
  \ `/var/kerberos/krb5kdc`、`/usr/local/var/krb5kdc` 或类似的位置。该文件可能如下所示：\n\n```\n host/kerberos.threeroomco.com@THREEROOMCO.COM\n\
  host/kerberos-1.threeroomco.com@THREEROOMCO.COM\n```\n\n一旦你在所有 KDC 上配置了此文件，就必须设置从用\
  \ KDC 运行一对服务器服务器：`kpropd` 和 `klogind`。你可以通过修改你的超级服务器（super server）来运行它们。例如，相应的 `/etc/inetd.conf`\
  \ 条目所示：\n\n```\n krb5_prop stream tcp nowait root /usr/kerberos/sbin/kpropd kpropd\n\
  eklogin   stream tcp nowait root /usr/kerberos/sbin/klogind \\\nklogind -k -c -e\n\
  ```\n\n你可能需要更改可执行文件的位置，当然，如果你使用 `xinetd`，则将需要创建一个相应的 `xinetd` 配置。（第 4 节涵盖了两种超级服务器）。如果你的\
  \ `/etc/services` 文件不包含 `krb5_prop` 和 `eklogin` 的条目，你必须添加它们。这些条目看起来如下：\n\n```\n\
  \ krb5_prop       754/tcp           # Kerberos slave propagation\neklogin      \
  \   2105/tcp          # Kerberos encrypted rlogin\n```\n\n传播是在主 KDC 上处理的。它涉及两个步骤：转储数据库并发送到从用\
  \ KDC。处理这两项任务的脚本出现在列表 6.3 中但你必须根据你自己的网络以及安装进行相应的更改（例如转储文件的位置）。如果你的网络使用多个从用 KDC，你需要为每个从用\
  \ KDC 分别调用一次 `kprop`，或者编写一个使用循环将转储传播到每个从用 KDC 的脚本。你可以从 cron 任务调用此脚本，使其以适合你网络的间隔自动运行。\n\
  \n**示例 6.3. 将 Kerberos 数据库传播到从用 KDC 的示例脚本**\n\n```\n #!/bin/sh\n/usr/kerberos/sbin/kdb5_util\
  \ dump\n/usr/kerberos/var/krb5kdc/slave_datatrans\n/usr/kerberos/sbin/kprop -f /usr/kerberos/var/krb5kdc/slave_datatrans\
  \ \\\n   kerberos-1.mi1.threeroomco.com\n```\n\n## 配置 Kerberos 应用服务器\n\n配置 KDC 是使用\
  \ Kerberos 的重要一步，但 KDC 本身并不非常实用。事实上，它甚至称不上所需的一半；你必须同时配置 Kerberos 应用服务器和 Kerberos\
  \ 客户端来使用 KDC。本节涵盖了这些主题中的第一个，下一节（“配置 Kerberos 客户端”）涵盖了第二个。\n\n### 注意\n\n在某些情况下，单台计算机可能同时作为\
  \ Kerberos 应用服务器和 Kerberos 客户端运行。例如，当你使用 Kerberos 作为登录验证协议时可能会发生这种情况。在这种情况下，你必须以两种方式配置该计算机（作为应用服务器和\
  \ Kerberos 客户端）。\n\n## 配置 Kerberos\n\n应用服务器上的 Kerberos 需要与 KDC 上的某些相同配置。特别是，`krb5.conf`\
  \ 中的 `[realms]` 和 `[domain_realm]` 部分需要调整以反映你的领域（realm）配置，如前所述。此外，你为应用服务器需要一个 keytab\
  \ 文件。该文件应包含主机自身的密钥（`host/*hostname@REALM.NAME*`）以及你打算在该系统运行的每个 Kerberos 服务器的密钥（例如，如果你打算运行\
  \ Kerberos 的 Telnet 服务器，则为 `telnet/*hostname@REALM.NAME`）。你可以像前面所述的那样使用 `kadmin.local`\
  \ 程序在 KDC 上创建 keytab 文件。具体来说，你使用 `addprinc` 命令为主机添加主体，然后将这些主体的密钥提取到 keytab 文件中。例如，你可能会执行如下的命令：\n\
  \n```\n kadmin.local:  addprinc \\\nhost/gingko.threeroomco.com@THREEROOMCO.COM\n\
  kadmin.local:  addprinc \\\ntelnet/gingko.threeroom.com@THREEROOMCO.COM\nkadmin.local:\
  \  ktadd -k gingko.keytab host/gingko.threeroomco.com \\\ntelnet/gingko.threeroomco.com\n\
  ```\n\n然后你应该将最后一个命令产生的文件 `gingko.keytab` 从 KDC 移动到应用服务器系统，并将该文件命名为 `/etc/krb5.keytab`。此文件极其敏感，因此请务必通过安全方法移动它，例如通过软磁盘或\
  \ `scp`。一旦到达目标系统，你应该删除 KDC 上的原始文件，并确保应用服务器上的文件仅对 root 可读。或者，你也可以在应用服务器上使用 `kadmin`\
  \ 来创建文件。在 `ktadd` 命令中省略 `-k gingko.keytab` 选项，系统将在本地生成文件。只有当 KDC 的远程设施配置正确且应用服务器的基础\
  \ Kerberos 配置（例如领域）设置正确时，这才会生效。\n\n标准的 Kerberos 软件包带有一些 Kerberos 的服务器和本地验证工具，如 Telnet、FTP、`shell`、`exec`\
  \ 和 `login`。你可以通过用这些安全版本替换非 Kerberos 版本来使用这些服务器。例如，如果你的系统使用 `inetd`，会将 `/etc/inetd.conf`\
  \ 中的这些服务条目替换为以下相应的项：\n\n```\n klogin  stream tcp nowait root /usr/kerberos/sbin/klogind\n\
  klogind -k -c\neklogin stream tcp nowait root /usr/kerberos/sbin/klogind\nklogind\
  \ -k -c -e\nkshell  stream tcp nowait root /usr/kerberos/sbin/kshd kshd -k \\\n\
  -c -A\nftp     stream tcp nowait root /usr/kerberos/sbin/ftpd ftpd -a\ntelnet  stream\
  \ tcp nowait root /usr/kerberos/sbin/telnetd\ntelnetd -a\n```\n\n其他服务器也有 Kerberos\
  \ 版本；发行提供的只是开始。你应该咨询第三方服务器的文档以确定它们具体允许你做什么。\n\n## 配置 Kerberos 客户端\n\n作为用户使用 Kerberos\
  \ 的第一步是为该用户创建一个 Kerberos 主体。该过程在前面的“创建主体”节中描述过。一旦你创建了用户主体，用户就可以使用匹配的 Kerberos 启用客户端访问\
  \ Kerberos 服务器。这意味着你必须安装这些客户端并让用户可以使用。你可以通过安装整个 Kerberos 软件包来安装客户端，有时只需安装 Kerberos\
  \ 基础或库包以及一个 Kerberos 工作站或客户端包即可。用户可能还需要需要使用一些 Kerberos 维护工具来获取和管理 TGT。如果你想使用 Kerberos\
  \ 控制用户登录到单个工作站，你需要修改工作站上常用的登录验证工具。\n\n## 访问 Kerberos 服务器\n\n\n\n\n\n总而言之，用户可以通过运行适当的客户端程序访问\
  \ Kerberos 应用程序。遗憾的是，现实情况比这个简单的解释所暗示的复杂得多。其一，有几个用户级工具参与其中——用户必须有某种方式获取 `TGT`，并且能够执行诸如更改\
  \ Kerberos 密码等常规维护。其次，支持 Kerberos 的客户端本身有时会带来独特的挑战。例如，许多客户端需要特定的选项来启用关键的 Kerberos\
  \ 特性；如果没有这些选项，支持 Kerberos 的客户端表现可能像普通的非 Kerberos 客户端一样。\n\n## 使用 Kerberos 网络工具\n\
  \nKerberos 软件包包含许多管理 Kerberos 密码和票据的工具，包括至关重要的票据授予票（`TGT`）。这些工具中最重要的是以下几个：\n\n*\
  \ `kinit` — 该程序获取 `TGT`。你可以将其认为一个让你“登录”到 Kerberos 域的程序；在运行 `kinit` 之前（或使用后文章节“使用\
  \ Kerberos 进行用户登录”中描述的等效功能），你无法使用任何 Kerberos 客户端。当你运行 `kinit` 时，程序会联系 `KDC` 以获取\
  \ `TGT`。此后，支持 Kerberos 的应用程序将如本章早期所述使用 `TGT` 获取使用 Kerberos 应用程序的授权。当你运行 `kinit`\
  \ 时，系统会要求输入密码。默认情况下，`kinit` 使用你的用户名作为默认域中的主体（principal）。你可以通过在命令后附加主体名称来覆盖此行为，例如\
  \ `kinit minerva@PANGAEA.EDU`。该程序还接受其他几个修改其行为的选项。详情参阅 `kinit` 手页。\n\n* `klist` —\
  \ 该程序列出你当前拥有的票据（包括 `TGT`），以及过期日期等某些信息。在运行 `kinit` 之前，`klist` 不显示任何票据。\n\n* `kpasswd`\
  \ — 该程序并不帮助管理单个 Kerberos 会话；相反，它用于更改 Kerberos 数据库中主体的密码。它是 Kerberos 版的 `passwd`，工作方式非常相似。你必须拥有\
  \ `TGT` 才能使用 `kpasswd`。\n\n* `kdestroy` — 该程序销给定用户票据缓存中的所有票据。你通常会在注销计算机之前，或者知道近期不会使用支持\
  \ Kerberos 的服务器时运行此程序。虽然 Kerberos 票据在一段时间未使用后会过期，但最好在它们完成使命后销毁，因为这可以降低在发生安全泄露时它们被滥用的风险。\n\
  \n### 提示\n\n![TIP](img/tip.gif)\n\n你可能想在所有用户的 `.logout` 文件中添加对 `kdestroy` 的调用、在\
  \ `.xinitrc` 文件的末尾，或在其他标准文件中添加该调用，以便该程序在用户注销时运行。如果你使用了如本章后半部分描述的 Kerberos `PAM`\
  \ 模块，则此功能可能被自动处理。\n\n这些工具在实践中是如何工作的？大多数会话仅会在会话开始和结束时分别使用 `kinit` 和 `kdestroy` 程序。不过，你可以使用\
  \ `klist` 工具查看票据的情况。例如，考虑以下交互：\n\n```\n $ kinit\nPassword for fluffy@THREEROOMCO.COM:\n\
  $ klist\nTicket cache: FILE:/tmp/krb5cc_500\nDefault principal: fluffy@THREEROOMCO.COM\n\
  \nValid starting     Expires            Service principal\n10/09/02 14:38:57  10/10/02\
  \ 00:38:57  krbtgt/THREEROOMCO.COM@\\\n                                        \
  \     THREEROOMCO.COM\n\nKerberos 4 ticket cache: /tmp/tkt500\nklist: You have no\
  \ tickets cached\n$ kpasswd\nPassword for fluffy@THREEROOMCO.COM:\nEnter new password:\n\
  Enter it again:\nPassword changed.\n$ kdestroy\n$ klist\nklist: No credentials cache\
  \ file found (ticket cache FILE:/tmp/krb5cc_500)\n\nKerberos 4 ticket cache: /tmp/tkt500\n\
  klist: You have no tickets cached\n```\n\n初始的 `kinit` 命令检索了 `TGT`，它在随后的 `klist`\
  \ 调用中显示为 `krbtgt` 服务。从开始和到期时间可以看出，这张票据的有效期为十小时（该数字可以根据系统进行调整）。如果使用了 Kerberos 客户端并再次运行\
  \ `klist`，则该服务将出现另一个票据。使用 `kpasswd` 更改密码需要出于预防考虑输入原始密码，然后输入两次新密码。与 `kinit` 输入密码一样，所有密码都不会显示在屏幕上。运行\
  \ `kdestroy` 后，所有票据都会被清除。\n\n## 使用 Kerberos 客户端\n\n支持 Kerberos 的客户端程序工作方式与其传统的对应程序非常相似。在大多数情况下，你输入程序名称，后跟你想要连接的服务器名称。遗憾的是，许多程序需要额外的参数才能充分利用\
  \ Kerberos 的特性。例如，`telnet` 客户端需要额外参数来避免在登录时输入用户名和密码。支持 Kerberos 的客户端示例及其某些特性包括：\n\
  \n* `telnet` — Kerberos 自带的 `telnet` 程序在不带额外选项运行时，工作方式与标准 `telnet` 程序非常相似。因此，如果你只输入\
  \ `telnet remote.host`，你必须再次输入用户名和密码。为了获得 Kerberos 单次登录系统的优势，你必须包含 `-a`（自动登录）和 `-f`（转发票据）选项。\n\
  \n* `rlogin` — 标准 `rlogin` 程序经常以第 13 节描述的那种相对不安全的方式使用。你可以对 Kerberos 版本的程序使用 `-f`\
  \ 选项来添加 Kerberos 认证。结果与使用带有 `-a` 和 `-f` 的 Kerberos 版 `telnet` 非常相似。\n\n* `ftp` —\
  \ 在不带任何参数使用时，该程序使用 Kerberos 认证，尽管你仍需验证你的用户名（程序显示一个默认值，你可以可能按 Enter 键）。\n\n### 提示\n\
  \n![TIP](img/note.gif)\n\nKerberos `ftp` 软件包在初始连接阶段提供的信息比某些 Kerberos 客户端提供的要冗长一些。如果你在\
  \ Kerberos 配置方面遇到问题，这些额外信息可能对调试问题有所帮助。\n\n* `rsh` — 该程序用于在另一台计算机上运行文本模式程序，而无需通过\
  \ `telnet`、`rlogin` 等程序登录它。与 Kerberos 自带的其他支持 Kerberos 工具一样，此版本包含了额外的选项，例如 `-f`。\n\
  \n* `rcp` — 标准 `rcp` 程序是一个简单的文件传输程序，支持 Kerberos 的版本为其添加了常用的 Kerberos 认证功能。\n\n*\
  \ 其他程序 — 前述列表仅涵盖了随标准 Kerberos V5 软件包分发的网络工具。许多其他工具标准支持 Kerberos，或作为编译选项提供 Kerberos\
  \ 支持，或者以支持 Kerberos 的变体形式提供。当然，使用此类工具需要同时拥有支持 Kerberos 的客户端和服务器。\n\n\n\n\nKerberos\
  \ 客户端程序的帮助页（man pages）提供了更多细节，包括关于设置登录域（realm）、主体（principal）和其他功能的更多选项信息。如果你使用的不是随标准\
  \ Kerberos 发行版自带的 Kerberos 工具，请务必检查其选项。某些工具仅提供基础的 Kerberos 功能（例如，仅有身份验证但不加密），而另一些则功能更全。一个特别值得注意且所有标准\
  \ Kerberos 客户端都支持的功能是数据加密。如果你在这些工具的任何命令行中添加 `-x` 选项，它们将加密传输的所有数据。此功能可能非常有用，特别是当你通过互联网连接或正在传输即使对于内部目的而言也可能存在敏感的数据时。例如，如果你打算使用\
  \ `telnet` 登录到计算机，然后使用 `su` 进行管理，你可能希望使用加密来保护 `root` 密码。（在后续章节“登录后更改账户”中描述的 `ksu`\
  \ 命令也可以在这方面提供帮助，但只有当你配置 `root` 账户接受来自普通账户的无密码访问时才有效。）\n\n标准的 Kerberos 源代码包默认将 Kerberos\
  \ 用户程序放置在 `/usr/local/bin`（管理工具位于 `/usr/local/sbin`）。某些二进制 Kerberos 程序包可能会使用其他位置；例如，红帽（Red\
  \ Hat）的 Kerberos 构建将用户程序放置在 `/usr/kerberos/bin`。你很可能想使用 Kerberos 工具而不是标准工具。要做到这一点，你应该确保\
  \ Kerberos 工具目录出现在用户路径中早于标准工具目录（路径在 `PATH` 环境变量中设置，通常在 `/etc/profile` 或用户的 `.bashrc`\
  \ 文件中，至少对于 Bash 用户是如此）。\n\n## 使用 Kerberos 进行用户登录\n\n上述关于管理 Kerberos 会话的讨论假设用户已经登录了计算机。然而，这样做降低了\
  \ Kerberos 的吸引力，因为这意味着用户实际上必须登录两次：一次获取访问工作站的权限，另一次（使用 `kinit`）使用 Kerberos 服务器。解决方案是使用一个同时接管这两项任务的工具。有多种工具可以实现这一目标。Kerberos\
  \ 自带了两个工具 `login.krb5` 和 `ksu` 可以帮助某些文本模式的任务。另一种方法是修改 Linux 的底层身份验证库以依赖 Kerberos。这种方法配置起来更困难，但也灵活得多。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n在尝试使用 `login.krb5` 之前，我建议你首先对重要账户（包括你的\
  \ `root` 账户）测试 `kinit` 程序。如果 `kinit` 不工作，那么 `login.krb5` 很可能也不行，这意味着你将无法以文本模式登录控制台。你应该在一个虚拟终端中保持一个\
  \ `root` shell 打开，以便在遇到 `login.krb5` 的问题时更改你的配置。更改其他登录工具也适用类似的警告。\n\n### 执行文本模式\
  \ Kerberos 登录身份验证\n\nLinux 系统的正常文本模式登录过程涉及使用一个通称为 `getty` 的程序。有多个 getty 程序，从原始的\
  \ `getty` 到 `mingetty`、`mgetty` 和 `vgetty` 等变体。这些程序从 `/etc/inittab` 运行，它们控制控制台、串口等设备，并将控制权交给另一个程序\
  \ `/bin/login`。某些网络登录协议（如 Telnet）也会调用 `/bin/login`。正如你可能猜想的那样，`login.krb5` 旨在替换\
  \ `/bin/login`。要使用此 Kerberos 工具，你应该将 `/bin/login` 替换为新工具。我建议先备份原始程序。例如，你可能会执行以下命令：\n\
  \n```\n## mv /bin/login /bin/login-original\n## cp /usr/kerberos/sbin/login.krb5\
  \ /bin/login\n```\n\n此操作确保了在出现问题时能够恢复原始的 `/bin/login` 程序。在你替换该程序后，随后的登录将使用 Kerberos\
  \ 进行初始登录。这包括获取 <acronym class=\"acronym\">TGT</acronym>，因此在这样的登录后无需运行 `kinit`。事实上，一旦这样配置，计算机将仅对由\
  \ `/bin/login` 介导的登录使用 Kerberos 身份验证，尽管用户必须在本地 `/etc/passwd` 文件中有条目、拥有主目录以及任何其他所需的本地资源才能成功使用计算机。此外，还有其他你可能需要调整的登录方法，例如\
  \ <acronym class=\"acronym\">GUI</acronym> 登录或通过不依赖 `/bin/login` 的服务器登录，例如 <acronym\
  \ class=\"acronym\">SSH</acronym>。\n\n### 登录后更改账户\n\n另一个不完全是通常登录类型的额外身份验证工具是使用 `su`\
  \ 来获取另一个用户的身份。Kerberos 包含一个替代包 `ksu`，允许更改当前用户账户。该程序有某些先决条件：\n\n*   运行 `ksu` 的计算机必须有一个主机密钥（通常存储在\
  \ `/etc/krb5.keytab` 中，并在在本章稍早之前已描述）。\n*   `ksu` 二进制文件必须以 SUID `root` 权限安装。大多数 Kerberos\
  \ 程序包*不会*以 SUID `root` 安装 `ksu`，因此你必须手动执行（例如通过输入 `chmod a+s /usr/kerberos/bin/ksu`）。\n\
  *   为了安全，你想获取身份的用户必须有一个配置文件`.k5login` 或 `.k5users` 文件提供了这一点，稍后介绍。如果没有此文件，另一个用户仍然可以访问账户，但\
  \ `ksu` 会要求密码，密码可能会以明文通过网络传输`.k5login` 文件授予用户完全登录权限，用法最简单。该文件由多行组成，每行都是 Kerberos\
  \ 主体。`.k5users` 文件通过指定用户可以运行的程序列表授予用户有限访问权限；每行以 Kerberos 主体开头，后面跟着由空格分隔的程序名称。星号（`*`）是任何命令的通配符。例如，以下条目允许\
  \ `minerva@THEROOM.COM` 运行 `/bin/ls` 和 `/usr/bin/zip` 程序：\n\n```\nminerva@THEROOM.COM\
  \ /bin/ls /usr/bin/zip\n```\n\n配置完成后，`ksu` 程序类似于 `su`——你输入程序名称，加上你想获取权限的用户。。如果没有配置\
  \ `.k5login` 或 `.k5users` 文件，则必须输入该主体的密码。然而，如果你创建了适当的授权文件，则不需要输入任何密码。在使用任何未加密连接时，这种方法更加安全。\n\
  \n如果你想直接运行单个程序，可以通过指定 `-e` `progname` 参数来实现，其中 `progname` 是程序名称。例如，`ksu fluffy -e\
  \ /bin/ls` 将以 `fluffy` 身份运行 `/bin/ls`。\n\n### 与 Kerberos 配合使用 <acronym class=\"\
  acronym\">PAM</acronym>\n\n\n\n\n\nKerberos 包含的替代程序 `login` 和 `su` 非常有用，但在许多情况下它们还不够用。特别感兴趣的是，需要一种方法来控制那些应通过\
  \ Kerberos 认证的工作站的 `GUI` 登录。你可能还希望将许多其他本地认证工具链接到 Kerberos，例如 `vlock` 或 `xscreensaver`（它们分别锁定文本模式和\
  \ `GUI` 会话，直到用户输入密码）。虽然有一种通用的方法可以为许多此类程序添加 Kerberos 支持，但必要的工具并不像 Kerberos 自带的工具那样普及。这种方法依赖于\
  \ Linux 对可插拔认证模块（Pluggable Authentication Module, PAM）工具的支持。\n\n`PAM` 旨在作为需要认证的程序（如\
  \ `FTP` 服务器、`login` 和基于 X 的登录工具）与底层用户及密码数据库（在标准 Linux 安装中位于 `/etc/passwd`、`/etc/shadow`\
  \ 和类似文件中）之间的中介。`PAM` 的核心思想是，通过将认证过程抽象为库，可以轻松更改底层的认证文件，而无需修改依赖于它们的众多程序；只需修改 `PAM`\
  \ 以理解新的文件格式即可。在这方面，在 `PAM` 中实现 Kerberos 支持是为许多应用程序提供 Kerberos 支持的理想方式——如果你进行了这些更改，使用\
  \ `PAM` 的程序无需任何更改即可支持 Kerberos。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n通过 `PAM`\
  \ 提供的 Kerberos 支持在某些方面存在局限性。特别是如果一个程序硬编码为请求用户名和密码，那么即使你修改 `PAM` 使用 Kerberos，这些提示也不会发生变化。程序会将用户名和密码发送给\
  \ `PAM` 进行认证，`PAM` 将尝试在 Kerberos 数据库中对其进行认证。因此，如果你的 `FTP` 服务器使用了 `PAM`，将 `PAM` Kerberos\
  \ 化不会消除输入用户名和密码的需求。不过，它可能允许你让 `FTP` 密码与 Kerberos 领域保持同步。对于 Kerberos 化的登录程序来说，这不是缺点，因为它们*应该*始终请求用户名和密码。\n\
  \n遗憾的是，尽管 `PAM` 是 Linux 发行版和许多非 Linux 系统常用的认证工具，但 Kerberos 版本的 `PAM` 并没有主 Kerberos\
  \ 发行版那样常见。可能的来源包括以下：\n\n* **Derrik Brashier 的模块**—— 这是一个用于 Kerberos V4 的模块。它可以在\
  \ `ftp://ftp.dementia.org/pub/pam/` 获取，具有各种以 `pam_krb4` 开头的文件；请选择日期最近的一个（在我写这些内容时，它们都是\
  \ 1998 年的）。该包以源码形式提供，因此你必须对其编译才能使用。\n\n* **Frank Cusack 的模块**—— 一个支持 MIT Kerberos\
  \ V5 和 Heimdal 的 `PAM` 模块可以在 `http://www.nectar.com/zope/krb/` 获取。（此页面上的版本目前由 Jacques\
  \ Vidrine 等人维护。）该包仅提供源码，最初是为 Solaris 编写的，但在 Linux 下可以编译并运行。\n\n* **Curtis King 的模块**——\
  \ Curtis King 提供了另一个 Kerberos V5 `PAM` 模块。可以从 `ftp.dementia.org/pub/pam/`get 文件名\
  \ `pam_krb5-1.1.3.tar.gz` 获取。它同样需要编译，编译过程可能并不顺利。\n\n* **Red Hat 的模块**—— Red Hat\
  \ 在其发行版中提供了一个 Kerberos V5 `PAM` 模块，包名为 `pam_krb5`。这可能是 Red Hat 类似发行版上最容易安装的，因为它是预编译的并以\
  \ `RPM` 格式分发。我使用此包作为后续讨论的基础，但 Frank Cusack 的模块工作方式大相相同。\n\n* **Debian 模块**—— 为 Debian\
  \ 系统提供了 `libpam-krb5` 和 `libpam-heimdal` 模块，如果你在 Debian 或相关发行版中分别使用 Kerberos V5\
  \ 或 Heimdal，那么这些模块应该很容易安装。尽管如此，在 Debian 网站上通过包搜索很难找到它们；请在 `http://ftp.nl.debian.org/debian/pool/non-US/main/libp/libpam-krb5/`\
  \ 和 `http://ftp.nl.debian.org/debian/pool/non-US/main/libp/libpam-heimdal/` 查找它们。\n\
  \n当你安装 Kerberos 化的 `PAM` 时，你安装的是一个 `PAM` 模块，你可以配置 `PAM` 在某些特定情况下使用它。`PAM` 模块由一个或多个存储在\
  \ `/lib/security` 或 `/usr/lib/security` 中的库文件组成。在 Red Hat 包的情况下，文件名为 `pam_krb5.so`\
  \ 和 `pam_krbafs.so`。要使用这些库，你必须修改你的 `PAM` 配置，这些文件存储在 `/etc/pam.d`。该目录包含多个以服务器或其他需要认证程序命名的文件。例如，`/etc/pam.d/login`\
  \ 控制 `login` 程序如何与 `PAM` 交互。要在这些程序中使用 Kerberos，你必须更改或向 `PAM` 控制文件中添加行，以告诉 `PAM`\
  \ 使用其 Kerberos 模块。事实上，Red Hat 的包在 `/usr/share/doc/pam_krb5-version/pam.d` 中包含了大量的示例文件，其中\
  \ `version` 是包的版本号。为了简化配置，你可以将适当的配置文件复制到 `/etc/pam.d`。你可能考虑复制的文件包括：\n\n* `login`—\
  \ 这控制 `login` 程序。如果你安装了 Kerberos 化的 `PAM` 支持，可以放弃官方的 Kerberos `login.krb5` 程序。\n\
  \n* `gdm`— GNOME 显示管理器 (`GDM`) 是 Linux 中三种常见的 `GUI` 登录工具之一。（有关如何配置这些服务器的信息，请参阅第\
  \ 14 章。）\n\n* `xdm`— X 显示管理器另一个常见的 `GUI` 登录工具，KDE 显示管理器也使用 XDM 的配置文件。理论上讲，这个文件应该允许这些工具使用\
  \ Kerberos 进行登录认证，但我在 Mandrake 系统上的该配置上遇到过问题。\n\n\n\n\n\n- `su` 和 `sudo` — 之前描述的\
  \ `su` 程序允许用户在登录后更改身份。`ksu` 程序使用 Kerberos 实现了相同的功能，但你可以通过为 `su` 安装 Kerberos 化的 `PAM`\
  \ 控制文件来实现类似的效果。`sudo` 控制文件为 `sudo` 命令提供了类似的 Kerberos 化。\n- `passwd` — 此文件告诉 `PAM`\
  \ 将通过 `passwd` 程序处理的密码更改发送给 `KDC`。\n- `vlock` — `vlock` 程序锁定控制台而不退出用户；只有输入密码后才能再次使用控制台。正如预期的，该控制文件会导致\
  \ `vlock` 使用 `KDC` 进行身份验证。\n- `xlock` 和 `xscreensaver` — 这两个程序都会锁定 X 会话，与 `vlock`\
  \ 类似，但 `xscreensaver` 可以在用户长时间未活动后自动锁定。\n\n自然，还有其他程序，你可能想要修改它们的 `PAM` 控制文件以添加 Kerberos\
  \ 支持。具体细节取决于你的系统。请注意，你不需要为显式 Kerberos 化的服务修改 `PAM` 文件。例如，如果你安装了启用 Kerberos 的 `FTP`\
  \ 服务器，你不需要修改 `/etc/pam.d/ftp` 文件。显式 Kerberos 化的应用程序可以与 `KDC` 通信进行验证，绕过 `PAM` 以及\
  \ `PAM` 需要的显式输入用户名和密码。\n\n如果你需要修改使用 `PAM` 的程序以使用 Kerberos，必须在 `PAM` 文件中添加或替换某些行。这些文件指定了四种认证服务：`auth`（验证用户）、`account`（检查账户是否有效）、`password`（更改密码）和\
  \ `session`（设置和终止会话）。`PAM` 配置文件由针对一个或多个此类服务的多行组成，描述了过程中涉及哪些 `PAM` 模块。例如，列表 6.4 显示了\
  \ Red Hat Kerberos `PAM` 软件包中的 `gdm` 文件。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n\
  不同的发行版通常使用大不同的 `PAM` 配置，因此你的配置可能会调用与列表 6.4 所示不同的 `PAM` 模块。在大多数情况下，添加 `pam_krb5.so`\
  \ 模块并可能删除对另一个模块的引用，就是使用 Kerberos 化 `PAM` 所需的所有操作。\n\n**示例 6.4. 带有 Kerberos 支持的示例\
  \ `PAM` 配置文件**\n\n```\n #%PAM-1.0\nauth       required    /lib/security/pam_nologin.so\n\
  auth       sufficient  /lib/security/pam_unix.so shadow md5 \\\nnullok likeauth\n\
  auth       required    /lib/security/pam_krb5.so use_first_pass\n\naccount    required\
  \    /lib/security/pam_unix.so\npassword   required    /lib/security/pam_cracklib.so\n\
  password   required    /lib/security/pam_unix.so shadow md5 \\\nnullok use_authtok\n\
  \nsession    required    /lib/security/pam_unix.so\nsession    optional    /lib/security/pam_krb5.so\n\
  session    optional    /lib/security/pam_console.so\n```\n\n在这种情况下，重要的行是最后的 `auth`\
  \ 行和第二行 `session` 行，它们告诉 `PAM` 分别使用 Kerberos 进行登录和注销。`auth` 行包含了 `use_first_pass`\
  \ 参数，它告诉 Kerberos `PAM` 模块它正在收集会话的第一个密码。这导致模块的行为类似于 `kinit`，获取并存储 `TGT`。大多数 Kerberos\
  \ `PAM` 模块都可以以此方式进行配置，但某些模块可能需要其他处理。例如，`password` 配置文件需要在现有的 `password` 条目之后添加类似下面的一行：\n\
  \n```\n password   required      /lib/security/pam_krb5.so use_authtok\n```\n\n\
  这是因为 `password` 模块被 `passwd` 程序使用，该程序用于更改密码而不是验证用户。某些文件不应该有 `session` 行，因为该行会导致票据销毁。例如，`xscreensaver`\
  \ 和 `linuxconf` 模块不应销毁票据，因为这些程序退出后，你会返回到一个工作配置中，其中你获得的票据应该保持有效。\n\n在你对 `PAM` 配置进行更改后，这些更改应该立即生效；没有没有\
  \ `PAM` 守护进程。然而，如果配置影响了正在运行的服务器或程序，你可能需要在重启它之前它才会使用新配置。对于 `login`，新配置应在你退出控制台后生效。对于像\
  \ `GDM` 这样的 `GUI` 登录工具，你可能需要重启服务器。\n\n在某些情况下，你可能需要从 `/etc/pam.d` 文件中移除现有条目。特别是，如果你为某个服务添加了\
  \ `pam_krb5.so` 条目，而该服务也引用了 `pam_pwdb.so` 库，你应该删除后者。`pam_pwdb.so` 库直接访问密码数据库，如果两者都，本地密码数据库和\
  \ Kerberos 数据库必须验证密码。尽管在某些极高安全的情况下可能是可能的，但它限制了 Kerberos 的灵活性，因为用户必须确保同时在 `KDC` 和本地工作站上更改密码。如果\
  \ `PAM` `password` 配置文件包含匹配的重复，对于单个工作站可以使用 `passwd` 工具轻松地完成，但在整个网络中协调此类更改将是非常繁琐的。\n\
  \n## 总结\n\nKerberos 是网络中集中认证的极其强大的工具。该协议使用加密和集中式用户数据库，允许应用程序服务器和工作站依赖主 Kerberos\
  \ 服务器来处理认证任务。如果充分利用，结果是用户可以登录任何工作站，然后在网络内使用网络服务而无需再次提供密码。即使是初始密码也不会通过网络传输，因此大大降低了密码泄露的风险。集中式用户数据库也极大地简化了账户维护。\n\
  \n\n\n\nLinux 提供了多种可用的 Kerberos 实现，其中某些在特定的发行版上可能比其他版本更容易使用。配置 Kerberos 网络要求在所有计算机上至少安装\
  \ Kerberos 软件子集。必须有一台系统被配置为密钥分发中心（`KDC`），它存储了用户数据库。服务器和工作站分别需要经过 Kerberos 处理的服务器和客户端程序。如果需要单登录配置，工作站则需要修改过的登录软件。尽管配置这些软件可能非常麻烦，特别是当你的发行版没有附带相应的\
  \ Kerberos 软件包时，但在中大型网络中，它在安全和集中用户管理方面的收益是巨大的。\n\n# 第 7 章：通过 Samba 进行文件和打印机共享\n\n\
  在 20 世纪 90 年代中后期，Linux 赢得了“隐形”系统的声誉。网络管理员被要求在资源很少的情况下完成大量工作，他们转向 Linux，有时即使这在他们的组织内并不是被批准的解决方案。在某些情况下，Linux\
  \ 替换了昂贵、笨拙或不可靠的 Windows 服务器。Linux 在完成这项任务时且不引起注意的最强大工具之一是 Samba，它是一个处理 `Server Message\
  \ Block (SMB)` 协议的服务器，该协议现在也被称为 `Common Internet Filesystem (CIFS)`。`SMB/CIFS` 是用于\
  \ NetBIOS 之上的文件和打印机共享协议，NetBIOS 是 Windows 系统主导的本地网络上的常用协议集。换句话说，Samba 让 Linux 系统能够作为\
  \ Windows 计算机的文件和打印服务器。Samba 执行这项工作非常好，而且功能正在不断改进。\n\n本章首先介绍 Samba 在网络中的作用，然后介绍通用\
  \ Samba 配置。这些通用选项包括配置 Samba 承担域控制器、主浏览器器和 NetBIOS 名称服务器的角色——这些 NetBIOS 功能与文件服务没有直接关系，但在\
  \ NetBIOS 网络中经常可见。Samba 的文件和打印机共享功能非常直观，但你可能需要设置某些参数来更改某些默认行为。本章最后介绍了如何使用 Samba\
  \ 的自动化功能来完成你可能认为与文件和打印机服务器无关的事项。\n\n尽管你可以在不对配置文件进行任何非常规更改的情况下运行一个极简的 Samba 服务器，但\
  \ Samba 是一个非常复杂的软件包，具有许多选项。Samba 的帮助页面（man pages）对其配置文件的格式提供了异常详细的描述，因此请输入 `man\
  \ smb.conf` 获取特定参数的详细信息。如果你需要关于 Samba 的深度教程介绍，有几本关于该主题的书，包括我的 *Linux Samba Server\
  \ Administration*（Sybex, 2001）以及 Eckstein 和 Collier-Brown 的 *Using Samba*（O'Reilly,\
  \ 1999）。\n\n## 何时运行 Samba 服务器\n\n首先，Samba 是一种文件和打印机共享工具。文件共享指的是将远程文件系统挂载到客户端上的能力，就像它是本地的一样。客户端上的普通应用程序随后就可以直接访问服务器上的文件——例如，文本编辑器可以加载文件，用户可以对其进行编辑，并可以直接将其保存回服务器。这种操作在办公环境中实用，可以将用户的文件和应用程序的存储集中在单个服务器上。打印机共享涉及允许客户端访问由服务器控制的打印机。它通过允许许多计算机使用同一组打印机，从而有助于节省资源。这些是\
  \ Samba 可能应用的通用任务。\n\n由于 DOS 和 Windows 中 NetBIOS 和 `SMB/CIFS` 的遗传关系，Samba 在包含 DOS\
  \ 和 Windows 系统的网络上最有用这并不意外。Samba 提供了针对这些计算机需求定制的功能。例如，DOS 和 Windows 使用不区分大小写的文件系统，因此\
  \ `FILE.TXT`、`file.txt`、`File.txt` 以及其他仅大小写不同的文件名是等价的。相比之下，Linux 使用区分大小写的文件系统，因此这些文件名都是不同的。Samba\
  \ 包含了帮助弥补这一差距的功能，允许 Samba 以不区分大小写的方式提供服务。此外，`SMB/CIFS` 还支持 DOS 和 Windows 文件系统的功能，如\
  \ `hidden`（隐藏）和 `archive`（存档）位。这些标志表示在大多数情况下文件应该对用户隐藏，或者该文件已经过备份。Linux 文件系统不包含这些功能，因此\
  \ Samba 提供了一种提供这些位的方法。Samba 对这些及其他 `SMB/CIFS` 功能的广泛支持使其成为与 DOS 和 Windows 系统共享文件的理想方式。其他的几个操作系统（如\
  \ IBM 的 OS/2）也有类似的需求并支持 `SMB/CIFS`，因此 Samba 也是这些操作系统的优秀文件共享工具。\n\n即使在不使用 DOS、Windows、OS/2\
  \ 或将 `SMB/CIFS` 作为首选文件共享协议的其他系统的网上，Samba 也可以是一个非常有用的工具。UNIX 和 Linux 系统、Macintosh、BeOS\
  \ 系统等都通过原生工具或第三方软件包支持 `SMB/CIFS`。Linux 经常支持更适合这些平台的协议（例如用于 Unix 和 Linux 系统的 `NFS`，见第\
  \ 8 章通过 NFS 进行文件共享），但在某些情况下，使用 Samba 可能会有益。例如，你可能倾向于运行尽可能少的服务器，并使用 `SMB/CIFS` 与非\
  \ Windows 平台进行文件共享。`NFS` 和 `SMB/CIFS` 也使用完全不同的安全模型，在某些情况下，`SMB/CIFS` 安全系统（使用用户名和密码进行验证）可能比\
  \ `NFS` 模型（使用 `IP` 地址和客户端自身的安全性）更优。\n\n## 通用配置\n\nSamba 配置有两个方面：通用配置选项和特定 Samba\
  \ 共享（即 向客户端提供的目录或打印机）的配置。正确配置全局选项尤为重要，因为这些设置中的问题会导致服务器完全无法访问。全局设置还会影响与文件共享没有直接相关的\
  \ Samba 功能，例如 Samba 在 NetBIOS 网络上定位其他系统。\n\n## Samba 配置文件\n\nSamba 使用名为 `smb.conf`\
  \ 的文件进行配置。大多数 Linux 发行版将此文件放在 `/etc`、`/etc/samba` 或 `/etc/samba.d`。与许多 Linux 配置文件一样，该文件使用井号（`#`）作为注释字符。未取消的行被分为不同的定义，通过方括号中的名称进行标识：\n\
  \n```\n [share-name]\n```\n\n\n\n跟在共享名称之后的行控制着共享的设置——Samba 与共享关联的目录、如何处理文件名等。全局配置选项出现在一个看起来像共享定义的节中，但它其实并非共享定义。这是\
  \ `smb.conf` 文件中的 `[global]` 部分。该部分中的设置可能是默认值，如果未被覆盖，它们将应用到其他共享；也可能是仅在 `[global]`\
  \ 部分本身有意义的设置。\n\n单个设置通过 `parameters` 进行控制，在 Samba 中，这些参数采用以下形式：\n\n```\n parameter\
  \ = Value\n```\n\nSamba 对于参数和值是大写还是小写非常灵活，但按照惯例，我将大多数参数列为全小写，并将大多数值的首字母大写。少数值（例如引用\
  \ Linux 文件名的值）是区分大小写的。某些值设置了二进制功能；对于这些值，`Yes`、`True` 和 `1` 是同义的，`No`、`False` 和 `0`\
  \ 也是如此。\n\n## 设置服务器标识\n\nNetBIOS 网络使用计算机和计算机组，这些名称独立于计算机的 TCP/IP 主机名。例如，`harding.threeroomco.com`\
  \ 也可以在 `USPRES` 域中使用 NetBIOS 名称 `BILLY`。为了避免混淆，我使用全大写的 NetBIOS 名称将它们与 TCP/IP 名称区分来。NetBIOS\
  \ 命名空间仅有两个级：计算机名和 `workgroup` 或 `domain` 名称。（NetBIOS 域与 TCP/IP 域无关）。因此，Samba 需要某种方式来同时指定\
  \ NetBIOS 名称以及 NetBIOS 工作组或域名。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\nNetBIOS 工作组和域非常相似。工作组是具有共同工作组名称的计算机集合。域是一个具有计算机（域控制器）的工作组，该计算机提供集中身份验证和其他服务。域还可以跨越多个网段，这在工作组中很难实现。Samba\
  \ 可以充当域控制角色，稍后在“成为域控制器”中会有描述。\n\n你通过 `workgroup` 参数指定工作组或域名，如下：\n\n```\n workgroup\
  \ = USPRES\n```\n\n这告诉计算机它是 `USPRES` 工作组的成员。系统仍然可以与其他工作组的成员通信，但某些功能（例如在 Windows\
  \ 中浏览网络）依赖于工作组名称。因此，如果你设置了工作组名称，你的 Samba 服务器将出现在 Windows 的“网络邻域”或“我的网络位置”浏览器中。这是初始\
  \ Samba 配置中的常见问题。\n\n默认情况下，Samba 使用计算机 TCP/IP 主机名的第一个部分作为其 NetBIOS 名称。例如，在 `harding.threeroomco.com`\
  \ 上，Samba 使用 NetBIOS 名称 `HARDING`。你可以通过 `netbios name` 参数覆盖此设置。你还可以使用 `netbios aliases`\
  \ 参数让计算机响应多个 NetBIOS 名称。例如，以下参数告诉计算机同时响应 `BILLY` 和 `WILLIAM`：\n\n```\n netbios name\
  \ = BILLY\nnetbios aliases = WILLIAM\n```\n\n### TIP\n\n![TIP](img/tip.gif)\n\n\
  通常情况下，为计算机使用相同的 TCP/IP 和 NetBIOS 名称是最好的。这可以避免计算机名称的混淆。然而，如果你的计算机的 TCP/IP 主机名设置得奇怪或错误，NetBIOS\
  \ 名称将继承这种特殊性。因此，使用 `netbios name` 显式地设置为本应该是 TCP/IP 主机名的名称是一个好主意。\n\n## 设置安全选项\n\
  \n早期的 SMB/CIFS 实现以`cleartext`发送密码，这意味着它们没有加密。这使得密码在某些类型的本地网络上会被其他计算机检测，或者当 SMB/CIFS\
  \ 会话通过路由器时。因此，随后的 SMB/CIFS 版本增加了密码加密技术。问题是，SMB/CIFS 使用的加密方法与 Linux 系统用于管理本地用户密码的加密方法不兼容。无法获取加密的\
  \ SMB/CIFS 密码并通过普通的 Linux 用户数据库验证用户。因此，Samba 必须实现自己的密码数据库来处理加密密码。该数据库被称为 `smbpasswd`，通过同名工具进行控制。\n\
  \n从 Windows 95 OSR2 和 Windows NT 4.0 SP3 之后的 Windows 版本默认使用加密密码。这些系统无法连接到使用默认明文密码配置的\
  \ Samba 服务器；必须对其中一个进行重新配置。从长远来看，重新配置 Samba 接受加密密码比重新配置 Windows 客户端发送明文密码更简单、更安全。\n\
  \n要让 Samba 使用加密密码，你使用 `encrypt passwords` 参数，这是一个二进制参数，告诉系统接受加密密码。将此参数设为 `Yes`，Samba\
  \ 将开始在其 `smbpasswd` 文件中检查加密密码。尽管如此，该文件必须包含加密密码才能生效。要为用户添加加密密码，执行以下命令：\n\n```\n #\
  \ smbpasswd -a username\n```\n\n这将用户 `username` 添加到 `smbpasswd` 文件中。该工具会询问密码（两次，以确保你没有输错）。计算机必须有一个名为\
  \ `username` 的有效用户，否则 `smbpasswd` 将不会添加该名称。当你第一次运行命令时，它会抱怨 `smbpasswd` 文件不存在；但它会自动创建该文件，你可以忽略此报错。\n\
  \n另一个重要的安全功能由 `hosts allow` 和 `hosts deny` 参数提供。它们的工作非常类似于 TCP Wrappers 的 `/etc/hosts.allow`\
  \ 和 `/etc/hosts.deny` 文件（在第 4 章 中讨论过）：它们分别提供了明确允许连接到服务器或明确不允许连接的主机列表。例如，以下参数允许 192.168.7.0/24\
  \ 网络中的计算机连接，以及系统 `algernon.pangaea.edu`，但不允许其他任何：\n\n```\n hosts allow = 192.168.7\\\
  . algernon.pangaea.edu\n```\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n对于大多数配置，你可以直接跳到名为“使用\
  \ Samba 提供文件”的章节。只有当你希望你的 Samba 服务器作为 NetBIOS 名称服务器、主浏览器或域控制器时，中间的章节才有意义。默认设置在大多数现有网络上运行良好。\n\
  \n## 成为 NetBIOS 名称服务器\n\n\n\n\n\nNetBIOS 网络需要某种名称解析机制。传统上，NetBIOS 名称解析使用独立于 TCP/IP\
  \ 名称解析的方法，但如今其中一种方案是使用 TCP/IP 名称解析。总共有共有四种可用方法：\n\n- `TCP/IP names` — 可以使用 TCP/IP\
  \ 名称进行名称解析，事实上，Windows 2000、Windows XP 和 Samba 均默认使用这种方法，尽管它并不是严格的 NetBIOS 解决方案。\n\
  - `An `lmhosts` file` — 系统可以在文件中记录名称到 IP 地址的映射，该文件通常命名为 `lmhosts`，其作用类似于 Linux 的\
  \ `/etc/hosts` 文件。\n- `Broadcasts` — 每当计算机需要另一台计算机的地址时，第一个系统可以发送广播来请求第二台计算机的地址。这种方法易于配置且在小型网络中运行良好，但在大型网络中会产生大量的冗余流量。如果你的网络被路由器划分成多个网段，除非路由器配置为回显广播流量，否则广播将无法工作。\n\
  - `A WINS server` — NetBIOS 名称服务 (`NBNS`) 服务器，也称为 Windows 互联网名称服务 (`WINS`) 服务器，其工作原理类似于\
  \ TCP/IP 域名系统 (`DNS`) 服务器，即为其他系统进行机器名称和 IP 地址之间的翻译。\n\n要配置 Samba 系统作为 WINS 服务器器，你必须在\
  \ `smb.conf` 的 `[global]` 部分设置一个参数：\n\n```\nwins support = Yes\n```\n\nWINS 服务器器不需要额外配置——至少在服务器端不需要。当\
  \ NetBIOS 客户端和服务器上线时，它们会在 WINS 服务器上注册，由该服务器维护系统信息。你需要告诉所有系统使用指定的 WINS 服务器器。在 Windows\
  \ 中，你可以在 TCP/IP 属性对话框中进行操作，如图 7.1 所示。如果你点击“通过 `DHCP` 解析 WINS”，可以让 Windows 从 `DHCP`\
  \ 服务器获取此类信息。（第 5 章讨论了如何将此信息包含在 Linux DHCP 服务器的配置中。）![Windows 的 TCP/IP 属性对话框允许你指定\
  \ WINS 服务器器地址。](img/07fig01.gif)\n\n**图 7.1. Windows 的 TCP/IP 属性对话框允许你指定 WINS 服务器器地址。**\n\
  \n要配置 Samba 服务器使用 WINS 服务器进行 NetBIOS 名称解析，你需要设置两个 `smb.conf` 参数：`wins server` 和\
  \ `name resolve order`。将 WINS 服务器的 IP 地址作为第一个参数的值，并将用于四种名称解析类型的一到四个个名称作为第二个参数的值。Samba\
  \ 将尝试按照你列出的顺序使用指定的每种名称解析方法。（`host` 和 `bcast` 选项分别代表常规的 TCP/IP 解析方法和 NetBIOS 广播。）例如，你可能会包含以下参数：\n\
  \n```\nwins server = 192.168.1.1\nname resolve order = wins lmhosts host bcast own\n\
  ```\n\n仅配置一个系统作为 WINS 服务器是非常重要的。如果你有多个 WINS 服务器，名称解析可能会变得不可靠，因为某些系统会在一个服务器上注册，而另一些系统会在另一个服务器上注册。（NetBIOS\
  \ 提供了备用名称服务器来提高可靠性）\n\n## 成为浏览器大师\n\n此前，我提到了 Windows 网络邻域或“我的网络位置”。它们与 Web 浏览器不是一个东西，尽管微软模糊了它们之间的界限。相反，这些浏览器允许你浏览\
  \ NetBIOS 网络上的 SMB/CIFS 服务器，如图 7.2 所示。你可以双击计算机名称以查看其定义的 SMB/CIFS 共享。文件共享以文件夹形式显示，打印机共享以打印机图标显示。你可以双击文件共享以访问其文件，就像访问本地磁盘上的文件一样。\n\
  \n![Windows 允许你浏览网域或工作组内的计算机...](img/07fig02.jpg)\n\n**图 7.2. Windows 允许你浏览所在网域或工作组内的计算机，或位于你网络网段上的其他网域或工作组的计算机。**\n\
  \n从用户的角度来看，这一切都很好，但如果没有软件方面的努力，这是无法实现的。从 Windows 网络浏览器的角度考虑这种情况：它是如何知道本地网络上哪些计算机可用共享的？NetBIOS\
  \ 通过指定网络网段上的一个计算机为*本地主浏览器（local master browser）*来回答这个问题。该计算机维护其所在网段内 SMB/CIFS 服务器的列表，并在接到将此信息传递给\
  \ SMB/CIFS 客户端。结果是，客户端只需要找到主浏览器，它们通过在启动时发送广播消息请求主浏览器的地址来实现。当服务器执行此操作时，它也会向主浏览器注册，从而保持主浏览器的列表更新。\n\
  \nNetBIOS 网域包含第二种主浏览器，称为*网域主浏览器（domain master browser）*。这种主浏览器与属于同一网域的其他子网上的本地主浏览器通信。主浏览器交换浏览列表，从而保持系统的协调，尽管会有一点的时间延迟。\n\
  \n\n\n\n\n## 主浏览器 (Master Browser)\n\n域主浏览器通常与域控制器（将在稍后讨论）相关联。计算机必须经过显式配置才能承担此角色。然而，本地主浏览器是通过`election`（选举）过程指定的，在此过程中，网段上的所有计算机都会提交其凭据，得分最高的计算机将赢得选举并成为本地主浏览器。确保所有主浏览器都是可靠的系统至关重要；如果计算机频繁崩溃或重启，网络浏览将频繁出现无法工作的时间段。此外，让\
  \ Samba 系统不要过于执着于赢得浏览器选举也很重要；某些参数可能会导致 Samba 重复调用选举，从而引起浏览功能中断。\n\n要配置 Samba 系统成为本地主浏览器，您必须设置其参与选举并赢得选举。要做到这一点，您应该创建类似于下方的\
  \ `[global]` 参数：\n\n```\nbrowse list = Yes\nlocal master = Yes\npreferred master\
  \ = Yes\nos level = 65\n```\n\n`browse list` 参数导致 Samba 编译浏览列表，然后它可能会将其与其他系统共享。该参数的默认值为\
  \ `Yes`，因此通常可以省略。`local master = Yes` 参数也是默认值。它使 Samba 参与选举，但不保证获胜。`preferred master`\
  \ 参数的默认值为 `No`。当设置为 `Yes` 时，它会导致系统在启动时调用选举，并在之后如果未赢得选举，则定期调用。如果您有多个 Samba 服务器，您应该在最多一台服务器上将此参数设置为\
  \ `Yes`，否则您的网络会被频繁的主浏览器选举所干扰。最后，`os level` 参数设置了主浏览器选举中主要标准。值越高，系统获胜的可能性越大。设置 `os\
  \ level = 65` 应该能击败从 Windows Me 到 Windows 2000 在内的所有 Windows 系统，但可能会输给配置了更高值的 Samba\
  \ 系统。如果您不想让 Samba 系统永远赢得主浏览器选举，请将此参数的值设置为 `0`。\n\n域主浏览器的配置要求您设置本地主浏览器选项以赢得选举，并设置\
  \ `domain master = Yes` 参数。您还应该将系统配置为主域控制器，正如稍后在“成为域控制器”中描述的那样。与本地主浏览器配置一样，您不应该配置超过一个系统（Samba\
  \ 或 Windows）成为域主浏览器。如果您的网络使用的是工作组配置而非域配置，则无需设置此选项。\n\n## 成为域控制器 (Becoming a Domain\
  \ Controller)\n\nNetBIOS 计算机被组织为工作组或域。这些结构非常相似，但域更具集中性；它使用名为 `domain controller`（域控制器）的计算机来验证用户。而不是让每台服务器都决定是否允许用户访问共享，由域控制器完成这项工作。这可以极大简化拥有多个服务器的网络管理，特别是当用户频繁进出时。然而，这在设置需要额外的努力。域还提供了额外功能，例如在用户登录时为客户端提供网络登录脚本的能力，以及存储\
  \ Windows 配置文件（即个性化的桌面自定义设置）的能力，以便这些设置可以随用户从一个客户端移动到另一个客户端。事实上，域配置足够复杂，我只能在本节中简述其大致轮廓。\n\
  \nNetBIOS 域控制器有两种类型：`primary domain controllers (PDCs)` 和 `backup domain controllers\
  \ (BDCs)`。当 PDC 系统崩溃或无法访问时，BDC 会接管 PDC 功能。Samba 能够很好地处理 PDC 操作，但 Samba 不能用作 BDC。\n\
  \n要配置 Samba 作为 PDC 运行，您应该在 `smb.conf` 文件的 `[global]` 部分添加以下参数：\n\n```\nsecurity\
  \ = User\nencrypt passwords = Yes\ndomain logons = Yes\n```\n\n`security` 参数设置 Samba\
  \ 使用 Linux 的用户名和密码来处理其自身的共享访问请求。（这是 Samba 2.0.0 及更高版本的默认设置）。`encrypt passwords`\
  \ 参数控制 Samba 对加密密码的使用，如前文所述。域必须使用加密密码。`domain logons` 参数是 PDC 操作的关键；它告诉 Samba 接受域登录请求并根据\
  \ `smbpasswd` 文件的内容对其进行处理。Windows PDC 同时也充当域主浏览器和 WINS 服务器，因此最好让您的 Samba 服务器也执行相同的操作（这一点之前已经描述过）。\n\
  \n### 注意事项\n\n![NOTE](img/note.gif)\n\n您通过 `smb.conf` 中的 `workgroup` 参数设置域名。\n\n\
  如果您的网络包含 Windows NT、2000 或 XP 系统，您必须采取一些额外的配置步骤。首先，2.0.5 之前的 Samba 版本不支持 Windows\
  \ NT 域客户端，2.2.0 之前的版本不支持 Windows 2000 域客户端，2.2.1a 之前的版本不支持 Windows XP 或 Windows\
  \ 2000 服务包 2 (SP2) 客户端，因此如果您使用的是早期版本的 Samba，必须升级。2.2.0 及更高版本为 NT/2000 域客户端支持增加了许多新功能，即使对于\
  \ Windows NT 4.0 用户也是如此。接下来，您需要在 Linux 上为每个 NT/2000/XP 客户端创建一个所谓的 `trust account`（信任账户）。您可以通过执行以下命令来实现：\n\
  \n```\n## groupadd -r trust\n## useradd -r -g trust -d /dev/null -s /dev/null client$\n\
  ## smbpasswd -a -m client\n```\n\n您只需要执行一次 `groupadd` 命令；它为信任账户创建一个特殊的组。（事实上，您可以使用现有的组，但最好为此目的创建一个特殊组。）`useradd`\
  \ 命令为 NetBIOS 计算机 `CLIENT` 创建特殊账户。用户名结尾的美元符号（$）是必须的。最后，`smbpasswd` 命令将 `client`\
  \ 添加到 `smbpasswd` 文件。在此命令中不应包含用户名美元符号。当您的 Windows NT/2000/XP 客户端下次尝试访问域时，它将使用其信任账户登录，并使用\
  \ Samba 的密码数据库验证其自己的用户。\n\n域配置还需要对客户端配置方式进行更改。这可以在 Windows 9*/Me 的 TCP/IP 控制面板中处理。选择“Microsoft\
  \ 网络”项目并点击属性。Windows 显示如图 7.3 所示的“Microsoft 网络属性”对话框。勾选“登录 Windows NT 域”项目并输入域名。在\
  \ Windows 2000 中，通过右键点击桌面上的“我的计算机”并从弹出菜单中选择“属性”，打开系统属性对话框。点击“网络标识”选项卡，然后点击“属性”按钮。当您激活域配置时，会要求管理员用户名和密码。输入普通的用户名和密码即可。\n\
  \n\n\n\n将 Samba 配置为域控制器、`WINS` 服务器等通常是很有需要的，但许多 Samba 服务器并不需要配置成这些类型。Samba 最常见的用途是作为文件服务器。以这种方式配置\
  \ Samba 意味着创建文件共享，这些共享遵循 `smb.conf` 中的 `[global]` 部分。你只需要几行代码就可以定义一个基础的文件共享。此外还有许多额外的选项可以非常强大，你可能想要将这些选项添加到代码中。\n\
  \n## 创建文件共享\n\n一个基础的 Samba 文件共享看起来如下：\n\n```\n [sample]\n    path = /home/samba/shared-dir\n\
  \    browseable = Yes\n    read only = No\n```\n\n此定义创建了一个名为 `[sample]` 的共享——它在\
  \ Windows 浏览列表中以 `SAMPLE` 的名称显示，如图 7.2。该共享对应计算机上的 `/home/samba/shared-dir` 目录；浏览到\
  \ `[sample]` 共享的用户将访问该目录中的文件。`browseable = Yes` 行并不是严格必要的，因为它重申了默认设置。它使共享显示在浏览列表中。（你可以通过设置\
  \ `browseable = No` 从浏览列表中移除共享，但那些知道其存在的人可以通过在 Windows 文件资源浏览器的地址栏中直接输入其名称来访问它。）默认情况下，Samba\
  \ 创建只读共享——客户端可以读取共享中的文件，但不能写入。若要将共享设为可读/写，你应该包含 `read only = No` 参数，或其等义词之一 `writeable\
  \ = Yes` 或 `write ok = Yes`。Linux 的所有权和权限规则仍然适用于共享中的文件，尽管你可以使用 Samba 功能来更改情况，正如稍后在“(配置所有权和权限”中描述的那样。\n\
  \n许多网络使用 Samba 服务器为用户文档提供文件存储空间。以这种方式使用时，特殊的快捷方式共享特别有用。这就是 `[homes]` 共享。当你使用 `[homes]`\
  \ 标题包含共享定义时，Samba 的处理方式会略有不同：\n\n- 你不需要包含 `path` 参数。相反，Samba 使用登录共享的用户的家目录。\n- 共享将以用户自己的名称显示在浏览列表中（例如图\
  \ 7.2 中的 `rodsmith`）。如果你设置了 `browseable = No` 参数，这将抑制浏览列表中名为 `HOMES` 共享的出现，但它并不会抑制基于用户名的共享名。\n\
  \n大多数 Linux 发行版在其默认的 `smb.conf` 文件中包含 `[homes]` 共享定义。因此，即使你没有自己定义任何共享，你将有一个适用于许多常见用途的\
  \ Samba 服务器配置。（你仍然需要设置工作组名称，并且极可能还需要调整你的密码加密策略，如前文所述。）\n\n你可以定义任意数量你需要的文件共享，包括普通共享和\
  \ `[homes]` 共享的混合。不过，定义多个 `[homes]` 共享是没有意义的。如果你发现自己在所有共享中都包含了某个参数，你可能考虑将该参数移动到\
  \ `[global]` 部分。这样做将该选项变为你所有共享的默认设置。\n\n## 设置 Windows 文件名选项\n\nLinux 和 Windows 有不同的文件名要求。如果你的网络仍然有\
  \ DOS 客户端，那么 DOS 还有另一套文件名命名规范。这些事实让 Samba 的工作变得非常困难，因为它必须提供一种方法让 Linux 文件系统看起来像\
  \ DOS 或 Windows 文件系统。\n\nLinux 和 Windows 文件名处理之间最重要的区别可能在于大小写敏感。Linux 以大小写敏感的方式处理其文件名——`FILE.TXT`、`file.txt`\
  \ 和 `File.txt` 都被视为不同的，因此这三个文件都可以存在同一个目录中而不冲突。Linux 的大小写敏感还意味着用户在访问文件时必须输入完全正确的大小写。相比之下，Windows\
  \ 是保留大小写的（case-retentive），这意味着它保留了文件名中的大小写，但在匹配文件名时不使用大小写。因此，两个仅大小写不同的文件名不能存在同一个目录中。DOS\
  \ 使用的是完全不区分大小写的系统；所有文件名都会转换为大写，即使用户输入的是混合大小写或小写文件名。\n\nSamba 的 `case sensitive`\
  \ 参数控制它是否以大小写敏感的方式处理文件名。该参数默认认为 `No`，这对于 Windows 和 DOS 客户端都很好用。当客户端请求特定名称的文件时，如果原始名称不匹配，Samba\
  \ 会检查是否存在与原始名称仅大小写上不同的名称，从而模拟 Windows 的行为。缺点是这会导致轻微的性能影响。如果你必须获得尽可能最好的性能，可以尝试设置\
  \ `case sensitive = Yes`，但当 Samba 这样配置时，极有可能至少会有某些 Windows 程序出现运行异常。如果你打算与大小写敏感的客户端（如\
  \ Linux）配合使用 Samba，你可能也想使用此设置。\n\n`preserve case` 和 `short preserve case` 参数定义了\
  \ Samba 是否保留文件名的大小写。当设置为 `Yes`（默认）时，Samba 使用客户端指定的大小写创建文件。当设置为 `No` 时，Samba 将文件名转换为大写或小写，取决于\
  \ `default case` 的值，该值默认为 `Lower` 但设置为 `Upper`。`preserve case` 参数影响所有文件的大小写，但该设置会被针对短文件名（即符合\
  \ DOS 长度限制的文件，通常称为 8.3 文件名）的 `short preserve case` 设置覆盖。如果你的网络托管了大量的 DOS 客户端，你可能想要设置\
  \ `short preserve case = No`。这样做会导致 Linux 服务器上存储小写文件名，尽管 DOS 客户端看到的它们是大写的。\n\nSMB/CIFS\
  \ 的某项功能是它支持为长文件名交付 8.3 文件名。这允许 DOS 和 16 位 Windows 程序（只能处理 8.3 文件名）访问长文件名。Windows\
  \ 服务器与其文件一起存储 8.3 文件名，因此它们可以顺利交付这些文件名。然而，Linux 并不存储 8.3 文件名，因此 Samba 必须动态创建。使用默认的\
  \ `mangled names = Yes` 设置启用这种行为；设置 `mangled names = No` 则禁用 8.3 文件名的创建。\n\n## 配置所有权和权限\n\
  \nLinux 安全性构建在所有权和 UNIX 风格权限之上。然而，SMB/CIFS 使用这些功能的方式与 Linux 不同。SMB/CIFS 允许使用用户名和密码登录服务器，因此默认情况下\
  \ Samba 使用 Linux 用户账户为此目的。对于明文密码，Samba 使用标准的 Linux 认证机制，但对于加密密码，Samba 会自行进行用户验证。无论何种情况，Samba\
  \ 都提供了允许你更改与登录关联的用户名的功能。具体来说，`force user` 和 `force group` 参数允许你将对共享的所有访问都处理为来自另一个用户或组。例如，考虑以下共享定义：\n\
  \n\n\n\n\n```\n [jekyl]\n    path = /home/samba/jekyl\n    read only = No\n    force\
  \ user = hyde\n```\n\n任何访问此共享的用户都将以 Linux 用户 `hyde` 的身份进行操作。例如，如果 `muriel` 登录并创建一个文件，该文件的所有者将是\
  \ `hyde`。如果 `henry` 登录并创建一个文件，该文件的所有者也将是 `hyde`。在该目录中，其中任一用户都可以通过 Samba 读取其他用户的文件，即使他们双方都无法通过直接登录\
  \ Linux 来读取对方的文件，即使他们双方都无法从常规 Linux 登录访问 `/home/samba/jekyl` 目录。任何使用此共享的人都可以读取 `hyde`\
  \ 具有读取权限的任何文件。`force group` 参数的工作方式类似，但它影响的是文件的组关联而非所有权。\n\n### 注意\n\n![NOTE](img/note.gif)\n\
  \n在使用了 `force user` 的共享中，用户仍需输入他们自己的密码——Muriel 使用她的密码，Henry 使用他的密码。\n\n`force user`\
  \ 和 `force group` 参数可以极大简化某些类型的 Samba 配置。例如，如果你想创建一个允许个人自由交换文档的 Samba 共享，可以使用 `force\
  \ user` 来确保该目录中创建的所有文件都由单一 Linux 所有者拥有，并且任何使用共享的人都可以读取这些文件。你可以专门为此目的创建一个账户，并在 Linux\
  \ 端使用你认为必要的、松散或严格的 Linux 权限。如果你需要限制通过 Samba 访问共享的用户，可以使用额外的参数来实现，这些参数将在稍后的“限制共享的访问””章节中讨论。\n\
  \n虽然 Linux 和 SMB/CIFS 都支持用户名，但 Linux 权限并没有直接映射到任何 SMB/CIFS 概念上。当 Samba 支持 DOS 或\
  \ Windows 9*/Me 客户端时，客户端完全不理解这些概念。因此，你可以使用 `create mask` 和 `directory mask` 参数来指定客户端创建的文件权限，这两个参数分别影响文件和目录的权限。两个参数都接受\
  \ 3 位或 4 位的八进制值，代表 Samba 创建的文件中可能设置的权限位。`create mask` 的默认值为 `0744`，`directory mask`\
  \ 的默认值为 `0755`。这两个值都允许所有者读取/写入权限，并允许文件组和世界只读访问。你可以根据需要调整这些值，但请注意它们会与 DOS 风格存档、系统和隐藏位的存储相互作用。\n\
  \nDOS 和 Windows 文件系统支持 Linux 文件系统不支持三个属性位。因此，Samba 可以这些位映射到执行位。你可以使用适当的 Samba 参数来控制是否发生这种映射。具体来说：\n\
  \n* `map archive`——如果设置为 `Yes`（默认），此参数将 DOS 存档位映射到 Linux 用户执行位。DOS 和 Windows 客户端会在新文件上设置此位，并在文件通过适当的备份软件备份后清除此位。由于此原因，使用默认的\
  \ `create mask`， Samba 客户端创建的新文件在 Linux 中查看时，其所有者似乎具有执行权限。\n\n* `map system`——如果设置为\
  \ `Yes`，此参数会导致 DOS 系统位映射到 Linux 组执行位。默认值为 `No`，因此不会发生这种映射。DOS 和 Windows 会用此位标记几个关键的系统文件，但此类文件不太可能存储在\
  \ Samba 服务器上。\n\n* `map hidden`——如果设置为 `Yes`，此参数将 DOS 隐藏位映射到 Linux 世界执行位。默认值为 `No`。许多\
  \ DOS 和 Windows 程序会向用户隐藏设置了隐藏位的文件；文件仍然可以访问，但它们不会出现在目录列表或文件选择对话框中。\n\n### 注意\n\n\
  ![NOTE](img/note.gif)\n\n默认情况下，Samba 为 Linux 点文件设置隐藏位——即以点（`.`）开头的文件。Linux Shell\
  \ 处理点文件就像 DOS 和 Windows Shell 处理隐藏文件一样。你可以通过 `hide dot files = No` 参数来覆盖此行为，使点文件不再隐藏。\n\
  \n默认 `create mask` 值反映了映射参数的设置。如果你想更改 `map system` 或 `map hidden` 参数的默认值，必须通过向倒数第二位或最后一位加\
  \ 1 来更改 `create mask` 值。\n\nWindows NT/2000/XP 使用比 Windows 9*/Me 更复杂的内部安全模型。具体而言，Windows\
  \ NT/2000/XP 支持访问控制列表 (ACLs)，允许你指定特定用户对文件的访问级别。Samba 允许你将 Linux 用户、组和世界权限映射到 Windows\
  \ ACL，这样你就可以从 Windows NT/2000/XP 系统调整读取和写入权限。此功能通过 `nt acl support` 参数控制，其默认值为 `Yes`。如果你想禁用\
  \ NT/2000/XP 系统细粒度修改 Linux 权限的能力，可以将此参数更改为 `No`。\n\n### 注意\n\n![NOTE](img/note.gif)\n\
  \n尽管如此，Windows 9*/Me 系统也可以根据适当的 `create mask` 或 `directory mask` 调整写入权限。ACL 映射对写入权限提供了更细粒度的控制，同时也提供了对读取权限的控制。\n\
  \n## 限制共享的访问\n\nSamba 提供了许多方法来控制对自身的访问。例如，`hosts allow` 和 `hosts deny` 选项在之前的“设置选项”章节中提到过，而且\
  \ Samba 显然使用用户提供用户名和密码的身份验证模型。（通过设置 `security = Share` 参数，可以配置 Samba 执行按共享验证而非按用户验证。尽管如此，这个设置配置往往比较棘手，因为它与\
  \ Linux 底层安全方案的映射关系不佳。）Samba 还提供了几种控制单个共享访问的机制。特别感兴趣的是 `valid users` 和 `invalid\
  \ users` 参数，它们分别提供了可能或可能使用该共享的用户列表。如果你使用 `valid users`，你必须提供一个用空格分隔的允许访问共享的用户列表；所有其他人都被拒绝访问。你可以使用\
  \ `invalid users` 将某些用户拉黑以将他们排除在共享之外，即使他们有权访问其他共享。\n\n另一对访问控制参数是 `write list` 和\
  \ `read list`。这些参数允许你为单个用户覆盖共享的只读或读/写设置。例如，你可能创建一个包含程序文件的共享，大多数用户不应该对其进行写入，因此你会将共享创建为只读。但是，你可能想给一个或两个用户对共享的完全读/写权限以便他们升级软件。你会使用\
  \ `write list` 来指定这些用户。\n\n作为这些参数的示例，考虑以下共享：\n\n```\n [control]\n    path = /home/samba/control\n\
  \    read only = Yes\n    invalid users = thomas susan\n    write list = gertrude\
  \ henry\n```\n\n该共享对大多数用户是只读的，但有两个用户（`thomas` 和 `susan`）被完全拒绝访问，而另外两个用户（`gertrude`\
  \ 和 `henry`）被授予了该共享的读/写权限。\n\n## 使用 Samba 服务打印机\n\n\n\n\n\n`SMB`/`CIFS` 处理打印机共享的方式与文件共享非常相似。要进行打印，客户端会将文件发送到共享。服务器随后通过其自身的打印系统处理该文件。鉴于这种模型，Samba\
  \ 打印机共享与 Samba 文件共享非常相似，这并不令人意外。事实上，之前针对文件共享所讨论的参数（如访问控制功能）也同样适用于打印机共享。当然，这些功能中的某些项（如文件名的大小写处理）在打印机共享中并不十分重要。\n\
  \n处理 Samba 打印机共享的大部分挑战在于，如何将 Windows 打印作业传递给 Linux 队列，并根据你所配置的队列类型正确地对其进行修改或保持原样。你可能需要为针对\
  \ PostScript 打印机和非 PostScript 打印机创建完全不同的配置。\n\n### 注意\n\n![NOTE](img/note.gif)\n\
  \n本节假设你的打印机已经在 Linux 中可以工作，或者至少你能够从 Linux 向打印机发送数据。（某些打印机缺少 Linux Ghostscript 驱动，但仍然可以通过\
  \ Samba 进行共享。）\n\n## 创建打印机共享\n\n文件共享与打印机共享的主要区别在于是否存在 `printable = Yes` 或 `print\
  \ ok = Yes` 参数（两者同义）。你指定的目录是一个临时溢存目录（但它*不是* Linux 的打印溢存目录，该目录通常位于 `/var/spool/lpd`）。默认值为\
  \ `/tmp`，它通常运行尚可，尽管许多 Linux 发行版会创建并使用类似 `/var/spool/samba` 的目录。无论何种情况，此目录通常应该设置“粘滞位”（sticky\
  \ bit），以防止用户删除其未创建创建的文件。你可以通过输入 `chmod 1777` `/path/to/dir` 或 `chmod o+t` `/path/to/dir`\
  \ 以这种方式配置目录，其中 `/path/to/dir` 是涉及的目录。（前一种选项也使目录对所有用户可写，这对于打印机队列目录通常是理想的。）多个 Samba\
  \ 打印机队列可以共享同一个溢存目录。一个有效的打印机共享定义示例如下：\n\n```\n [laser]\n    comment = Laser printer\
  \ in Room 7\n    path = /var/spool/samba\n    printable = Yes\n```\n\n`comment`\
  \ 参数仅用于在客户端上提供一个与共享名称（`LASER`）关联的注释。（此参数也可能用于文件共享。）如果你的系统有一个名为 `laser` 的*本地*打印机队列，则该共享将正常工作。如果你的本地打印机队列名称不是共享名称，你应该使用\
  \ `printer name` 参数来指定它，例如 `printer name = lp`，这告诉系统使用名为 `lp` 的本地队列。\n\nLinux 发行版使用多种打印系统。目前，原始的\
  \ `BSD` `lpr` 非常常见，但更更新的 LPRng 正在获得进展，通用 Unix 打印系统 (`CUPS`) 也变得越来越流行。这些系统的语法细节各不相同，Samba\
  \ 必须能够进行相应的调整。因此，Samba 提供了一个名为 `printing` 的选项，允许你指定计算机所使用的打印系统。根据实际情况将其设置为 `BSD`、`LPRng`\
  \ 或 `CUPS`。（还有其他几个可用选项，但在 Linux 系统上并不常见。）如果你使用的是来自发行版自带的 Samba 软件包，它可能已经过编译为默认使用相应的软件包。如果你的系统使用一种非常奇葩的打印系统，你可能可以通过\
  \ `print command` 参数来解决问题，该参数允许你将 Samba 使用的打印命令调整为指定的任何内容。当你指定一个命令时，`%s` 是代表打印作业文件名的变量。你可能需要在将文件传递给打印系统后显式删除该文件。此参数实际上非常灵活，并可能是某些某些极异常的方式下使用\
  \ Samba 的关键，正如接下来的章节“使用伪打印机”中所描述。\n\n正如 Samba 的文件共享功能允许你指定单个共享以允许系统中的所有用户访问他们的文件一样，Samba\
  \ 的打印机共享允许你创建一个单一打印机共享，提供对系统中所有打印机的访问。此共享名称为 `[printers]`。当此共享存在时，Samba 会扫描计算机的\
  \ `/etc/printcap` 文件以查找打印机名称，并为找到的每个名称创建一个共享。与 `[homes]` 共享一样，`[printers]` 共享通常包含一个\
  \ `browseable = No` 参数，以防止名为 `PRINTERS` 的共享出现在 Windows 客户端上。即使设置了此参数，单独的打印机名称仍然出现在\
  \ Windows 浏览列表中。\n\n## 共享 PostScript 打印机\n\n前面的描述在很大程度上忽略了通过 Samba 共享打印机时最重要的问题之一（也是潜在的问题源）：打印机驱动程序。Windows\
  \ 系统使用打印机驱动程序与应用程序交互，生成特定型号打印机可以理解的输出。因此，Samba 打印机共享接收到的打印文件将由客户端安装的任何打印机驱动程序进行预格式化。相比之下，Linux\
  \ 通常使用配置为接受 PostScript 输出的打印队列。取决于连接到计算机的打印机类型，队列可能会以原始不变的形式输出原始文件，也可能会通过*打印过滤器*（print\
  \ filters），过滤器会将 PostScript 转换为非 PostScript 打印机可以理解的形式。这些不同打印模型产生的结果是有时会发生冲突。如果\
  \ Windows 客户端向 Samba 提供非 PostScript 文件，可能会出现乱码。同样糟糕的是，某些 Windows PostScript 驱动程序创建的输出会让过滤器误认为输出*不是*\
  \ PostScript，这可能导致乱码。幸运的是，有一些规则和 Samba 参数可以极大地帮助解决这些问题，但你可能需要进行实验以了解哪种效果最好。\n\n\
  最简单的情况通常是你共享的打印机是 PostScript 模型——即如果它本身理解并处理 PostScript 输出。此功能在高端激光打印机上很常见，在某些中端激光打印机上可用。低端激光打印机和喷墨打印机很少见，尽管有少数理解\
  \ PostScript 的喷墨打印机。如果不确定支持 PostScript，请查阅打印机文档。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n某些打印机声称支持 PostScript，但这种支持是由位于 Windows 中的 PostScript 解释器提供的。就本文讨论而言，这些打印机不是 PostScript\
  \ 打印机。它们可能是很好的打印机，你的 Windows 客户端可以通过 Samba 使用 Windows PostScript 解释器，但它们并未配置为 PostScript\
  \ 打印机。\n\n### 注意\n\n![NOTE](img/note.gif)\n\nPostScript 最初由 Adobe ([`www.adobe.com`](http://www.adobe.com))\
  \ 创建，它传统上许可在打印机中使用。其他公司也生产了 PostScript 解释器，这些在目前许多打印机非常常见，包括来自惠普和 Lexmark 等主要制造商的一些型号。尽管早期的\
  \ PostScript 克隆版本远非完美，但较新的 PostScript 克隆版本通常运行良好。对于 Samba 配置而言，你的打印机使用的是真正的 Adobe\
  \ PostScript 还是克隆版本并不重要。\n\n\n\n\n\n如果你的打印机直接支持 PostScript，你应该能够安装 Windows PostScript\
  \ 驱动程序，可以从 Windows 光盘或打印机制造商处获取。（Adobe 也提供了 PostScript 驱动程序，尽管它们仅授权用于带有 Adobe 创建的\
  \ PostScript 解释器的打印机。）此驱动程序将生成 PostScript 输出，Samba 将其传递给 Linux 打印队列，然后该队列将文件发送到打印机。如果一切顺利，文件将无问题地打印。\n\
  \n此类配置中最常见的问题源源于许多 Windows PostScript 驱动程序会在输出前加上一个 `Ctrl+D` 字符。大多数 PostScript 打印机会忽略这个字符，但它会让\
  \ Linux 打印队列产生混乱。具体来说，Linux 打印过滤器会在打印作业开头查找某些字符串以识别 PostScript 任务。`Ctrl+D` 干扰了这种识别，导致打印过滤器认为该文件是纯\
  \ ASCII 文本。某些 PostScript 打印机无法处理纯 ASCII 文本，因此打印过滤器会将 PostScript（过滤器认为它是纯文本）转换为一个打印\
  \ PostScript 代码的 PostScript 文件。结果是打印出 PostScript 代码，而不是你预期的页面。这个问题有两种可能的解决方案。\n\n\
  首先，你可以在 Windows 打印驱动程序找到生成 `Ctrl+D` 的选项。该选项通常可以在打印机的属性对话框中找到，或者点击该对话框中的“高级”按钮后获得的对话框中。图\
  \ 7.4 显示了一个示例。应该取消勾选 `Send CTRL+D Before Job`选项。（`Send CTRL+D After Job` 选项较少引起问题）。如果你想对同时使用\
  \ PostScript 和非 PostScript 驱动程序的队列（例如，如果打印机理解 PostScript 和其他打印机语言），那么在源头禁用 `Ctrl+D`\
  \ 是一个好计划，但如果你有很多需要修正的客户端，这可能会非常麻烦。\n\n![你通常可以禁用导致许多 Linux 打印队列产生问题的 Ctrl+D 字符。](img/07fig04.gif)\n\
  \n**图 7.4. 你通常可以禁用导致许多 Linux 打印队列产生问题的 Ctrl+D 字符。**\n\n`Ctrl+D` 问题的第二个解决方案是使用 Samba\
  \ 参数 `postscript = Yes`。该参数导致 Samba 在 `Ctrl+D` 字符之前向打印作业的开头添加 PostScript 识别代码。最终结果是作业可以正常打印，因为打印机随后将同时忽略\
  \ `Ctrl+D` 和第二个 PostScript 识别代码。如果你有很多需要重新配置的客户端，这种解决方案更容易；但如果你还希望能够使用其他类型的驱动程序进行打印，则需要为该目的创建第二个队列，这可能会让你的网络共享列表混乱。\n\
  \n## 共享非 PostScript 打印机\n\n你有两种方案来配置通过 Samba 共享的非 PostScript 打印机。一种是在客户端使用 PostScript\
  \ 驱动程序，并配置 Linux 打印队列将 PostScript 转换为打印机的原生语言，就像本地使用打印机时一样。第二种方案是在客户端使用打印机的原生驱动程序，并使用*raw*\
  \ 原始队列共享打印机，该队列将数据原封地传递给打印机。每个选项都有优缺点，且每个都需要自己的配置。\n\n### 使用 Ghostscript\n\n如果你能从生成\
  \ PostScript 输出的 Linux 应用程序（如 Netscape）向非 PostScript 打印机打印，那么你的系统已配置为通过 Ghostscript\
  \ ([http://www.cs.wisc.edu/~ghost/]) 传递打印输出，这是一个运行在计算机而非打印机上的 PostScript 解释器。GNU\
  \ 版本的 Ghostscript 随所有主要的 Linux 发行版一起发布并支持大多数打印机。在某些情况下，你可能需要寻找特殊驱动程序或 Aladdin  Ghostscript（更新更新）。关于打印机与\
  \ Ghostscript 兼容性的信息，请检查 Linux 打印数据库 [http://www.linuxprinting.org/printer_list.cgi]。\n\
  \n配置使用 Ghostscript 的 Linux 打印队列使用打印过滤器来检测文件类型，就像用于 PostScript 打印机的队列一样。然而，该过滤器会将输入通过\
  \ Ghostscript 处理。这种设置通常涉及使用特定发行版的打印机配置工具或遵循过滤器包附带的说明。一旦设置完成，队列的工作方式与 PostScript\
  \ 打印机队列几乎相同。因此，你应该阅读前面的章节“共享 PostScript 打印机”，以了解如何在 Samba 及其客户端中设置它。你需要在 Windows\
  \ 上选择一个通用的 PostScript 驱动程序（Apple LaserWriter 驱动程序通常用于这种方式驱动的激光打印机，而 QMS magicolor\
  \ 驱动程序通常适用于彩色喷墨打印机）。前面提到的 `Ctrl+D` 问题可能会出现在这些队列中，解决方案与 PostScript 打印机相同。\n\n某些 Windows\
  \ PostScript 驱动程序生成的 PostScript 文件包含嵌入命令，用于在某些打印机的内置显示器上显示进度信息。这些信息通常产生额外的一页输出，带有如\
  \ `%%[ LastPage ]%%` 等消息。如果你遇到这个问题，解决方案之一是使用不同的 Windows 打印驱动程序。另一个选项是找到调用 Ghostscript\
  \ 文件并在 `gs` 命令行尾添加 `>/dev/null`。此操作将 Ghostscript 的错误消息重定向到 `/dev/null`。在 Caldera\
  \ 中，此文件是 `/var/spool/lpd/`。在 Red Hat、Mandra 和 TurboLinux 中，此文件是 `/usr/lib/printfilters/ps-to-printer`。\n\
  \n### 创建非 PostScript 队列\n\n如果你想在客户端使用非 PostScript 驱动程序，你可以这样做，但你需要创建一个不解释或修改发送数据的\
  \ Linux 打印队列。某些打印过滤器可以识别某些打印语言并原封地发送结果，因此你可能可以使用普通队列。但是，如果你尝试后发现打印作业消失或以某种乱码或无法理解的形式输出，则你需要创建一个原始队列。\n\
  \n你可以通过像往常一样创建一个打印机队列，然后编辑 `/etc/printcap` 文件（假设你的系统使用 <acronym class=\"acronym\"\
  >BSD</acronym> 或 LPRng 打印系统）。具体来说，你应该删除该队列定义中的 `if=` 行，或将其指向空。该行指定 Linux 打印过滤器，删除它可以确保打印作业将未经修改地从输入队列传递到打印机。这样的队列可能如下：\n\
  \n```\n lp|hp4000|raw:\\\n        :lp=/dev/lp0:\\\n        :sd=/var/spool/lpd/lp:\\\
  \n        :mx#0:\\\n        :sh:\\\n        :if=:\n```\n\n\n\n\n\n在为原始队列（raw queue）定义\
  \ Samba 打印机共享时，你应该确保不包含 `postscript` 选项，或者将其设置为 `postscript = No`。在非 PostScript\
  \ 打印作业之前加一个 PostScript 标识符可能会让大多数打印机产生混乱，导致打印乱码。\n\n### 选择方法\n\n如果你拥有一台非 PostScript\
  \ 打印机，你必须决定在客户端系统上使用 PostScript 驱动程序还是原生驱动程序。然而，这些并不是互斥的选项。你可以创建两个 Linux 和 Samba\
  \ 打印队列，或者如果你的 Linux 打印过滤器能够识别原生打印作业的真实类型，甚至可能只使用一个队列。（如果你创建了两个 Linux 打印机队列，单个 Samba\
  \ `[printers]` 共享将检测并共享它们两个。）然后，你可以在客户端上安装两个打印机驱动程序并在它们之间进行选择。\n\n这两种方法之间的重要区别之一是文本或图像数据在何时转换为位图（bitmap）。当在客户端上使用\
  \ `Ghostscript` 和 `PostScript` 驱动程序时，客户端会生成一个本质上是描述文档中文本的文件（如果它主要是文本文档）。该文件很小，通常容易由客户端生成。因此，它对客户端的\
  \ CPU 负载很小，产生的网络流量也很小，但需要打印服务器的 CPU 来将其转换为位图形式。相比之下，如果你在客户端使用原生驱动程序，客户端的 CPU 负载可能会更高，传输到\
  \ `Samba` 的文件通常会更大；但 `Samba` 服务器不需要花费大量的 CPU 资源来处理该文件。因此，`Ghostscript` 方法有利于最小化客户端\
  \ CPU 和网络负载，而原生驱动程序方法有利于最小化服务器 CPU 负载。尽管如此，在打印图形时的这些差异比打印文本时要小得多，因为图形文件无论是 `PostScript`\
  \ 格式还是原生打印机格式，其体积都是巨大的。\n\n这些方法之间的另一个区别在于输出质量。当你使用 `Ghostscript` 时，你依赖 `Ghostscript`\
  \ 来生成最终的输出图像。在某些情况下，`Ghostscript` 在这方面做得非常好，但在其他情况下，`Ghostscript` 的驱动程序不如原生 Windows\
  \ 驱动程序。这对于某些较冷门且较新的彩色墨喷打印机尤为如此。事实上，其中一些打印机根本没有 `Ghostscript` 驱动程序，这意味着你无法使用 `Ghostscript`\
  \ 方法，尽管你可能可以使用原始队列和原生 Windows 驱动程序共享该打印机。在某些情况下，`Ghostscript` 的输出可能优于原生客户端驱动程序。如果你有与\
  \ `PostScript` 打印机配合效果最好的应用程序（例如某些桌面出版软件包），或者你需要打印封装的 PostScript (`EPS`) 文件，这种情况特别可能发生。事实上，`Ghostscript`\
  \ 是以低成本获得 `PostScript` 兼容性的极佳方法。此外，通过对许多打印机统一一种 `PostScript` 驱动程序，你可以减少在切换打印机时可能出现的格式变化——这在某些程序中是一个严重的问题。\n\
  \n与打印质量问题相关的是驱动灵活性问题。当使用 `Ghostscript` 时，你通过 `Ghostscript` 设置设置打印机的分辨率和其他打印质量功能。在\
  \ Linux 中，这些通常在定义打印队列时通过打印设置实用程序设置。要更改分辨率，必须创建多个队列并在它们之间切换。然而，如果你使用原生客户端驱动程序，这些驱动程序通常包含分辨率设置选项以及控制其他输出功能的选项。因此，使用原生驱动程序控制墨喷打印机的分辨率通常更简单。\n\
  \n你必须根据自己网络的能力和需求来平衡所有这些因素；对于是否使用 `Ghostscript` 或原生客户端驱动程序这个问题，没有唯一的标准答案。你可能想尝试这两种方法，以学习哪种方法在你的网络和打印机上效果最好。事实上，你可能会发现一种方法对某些打印机最有效，而另一种方法对另一些打印机效果更好。\n\
  \n与打印质量问题相关的是驱动程序的灵活性问题。当使用 `Ghostscript` 时，你通过 `Ghostscript` 设置设置打印机的分辨率和其他打印质量功能。在\
  \ Linux 中，这些通常在定义打印队列时通过打印设置实用程序设置。要更改分辨率，你必须创建多个队列并在它们之间切换。然而，如果你使用原生客户端驱动程序，这些驱动程序通常包含分辨率设置选项以及控制其他输出功能的选项。因此，使用原生驱动程序控制墨喷打印机的分辨率通常更简单。\n\
  \n你必须根据自己网络的能力和需求来平衡所有这些因素；对于是否使用 `Ghostscript` 或原生客户端驱动程序这个问题，没有唯一的标准答案。你可能想尝试这两种方法，以学习哪种方法在你的网络和打印机上效果最好。事实上，你可能会发现一种方法对某些打印机最有效，而另一种方法对另一些打印机效果更好。\n\
  \n## Samba 脚本功能\n\nSamba 最令人兴奋的功能之一是运行脚本的能力。你可以通过各种方式向 Samba 提供命令，Samba 会在特定情况下执行这些命令。本节将致力于该功能，从脚本功能（`preexec`/`postexec`）的描述开始，并以几个使用这些功能的示例结束。\n\
  \n## 使用 `preexec` 和 `postexec` 脚本\n\nSamba 提供了参数，允许在用户登录或退出共享时执行你指定的命令。这些参数分别是登录和退出的\
  \ `preexec` 和 `postexec`。例如，如果你想让 Samba 在每有人访问共享时，向 `billy@threeroom.com` 发送邮件，你可以在共享定义中包含以下参数：\n\
  \n```\npreexec = mail -s \"Share being used\" billy@threeroom.com\n```\n\n当有人登录共享时，Samba\
  \ 会以该用户的用户名向 `billy@threeroom.com` 发送消息，邮件的主题为 `Share being used`。`postexec` 命令的工作方式相同，但它是在连接终止时发送消息。由于\
  \ Windows 客户端处理 `SMB`/`CIFS` 共享的方式，当用户通过“网络邻居”或“网络位置”打开窗口后，这不会立即发生，但最终会发生。\n\n这些参数的变体是\
  \ `root preexec` 和 `root postexec`。这些参数与其非 `root` 参数的作用相同，只是它们是以 `root` 身份执行你指定的命令。这对于需要执行某些权限命令有用，但在使用这些时应小心。如果你在命令规范中出错，可能会导致问题或赋予恶意用户\
  \ `root` 权限。\n\nSamba 支持许多变量（如表 7.1 所示），可以作为命令规范的一部分。通过包含这些变量，你可以为特定的用户、客户端、操作系统等自定义\
  \ `preexec` 或 `postexec` 脚本的操作。（表 7.1 中的某些变量旨在用于打印共享。）\n\n`preexec` 和 `postexec`\
  \ 参数旨在让你执行某些可能有助于准备共享以使用的命令，例如备份 Windows 用户可能误从主账户中删除的 Linux 配置文件。然而，通过这些命令所能实现的限制取决于你的想象力。\n\
  \n**表 7.1. Samba 可用变量**\n\n| 变量 | 含义 |\n| --- | --- |\n| %a | 客户端操作系统。可能包括 `OS2`\
  \ (OS/2)、`Samba`、`UNKNOWN`、`WfWg` (DOS 或 Windows 工作组版)、`Win2K`、`Win95` (Windows\
  \ 95 或 98) 或 `WinNT`。 |\n| %d | 服务器进程 ID |\n| %g | `%u` 的主组 |\n| %G | `%U` 的主组 |\n\
  | %h | 服务器的 `TCP`/`IP` 主机名 |\n| %H | `%u` 的主目录 |\n\n\n\n\n\n| `%I` | 客户端 IP 地址 |\n\
  | `%j` | 打印作业编号 |\n| `%L` | 服务器的 NetBIOS 名称 |\n| `%m` | 客户端的 NetBIOS 名称 |\n| `%M`\
  \ | 客户端的 TCP/IP 主机名 |\n| `%N` | NIS 家目录服务器 |\n| `%p` | 共享根目录的路径（如果是自动挂载） |\n| `%P`\
  \ | 共享根目录的路径 |\n| `%R` | 协商的 SMB/CIFS 协议级别；可以是 `CORE`、`COREPLUS`、`LANMAN1`、`LANMAN2`\
  \ 或 `NT1` |\n| `%s` | 传递打印共享的文件名 |\n| `%S` | 共享名称 |\n| `%T` | 当前日期时间 |\n| `%u` |\
  \ 有效 Linux 用户名 |\n| `%U` | 请求的 Linux 用户名（可能与 `%u` 不匹配） |\n| `%v` | Samba 版本号 |\n\
  \n- 这些脚本可以在共享公共目录与用户目录之间创建和删除符号链接。（Samba 默认遵循符号链接，但可以通过设置 `follow symlinks = No`\
  \ 来禁用此行为。）\n- `preexec` 参数可以为用户挂载可移动媒体设备，而 `postexec` 脚本可以卸载它。这对于访问软盘、光光硬盘等设备非常有用。\n\
  - 你可以记录 Samba 通常不会记录的信息，或者以 Samba 通常不采用的方式进行记录。\n- Samba 可以处理存目录中的图形文件。例如，你可以创建一个共享，其中包含将图形文件转换为特定格式的命令，并将转换后的文件复制到另一个共享中供取用。\n\
  \n- 一个受限制访问的共享可以帮助管理服务器本身。例如，一个共享可以包含 `/etc` 目录下关键文件的副本；`postexec` 脚本可以查找这些文件的更改，如果发现变化，则将更改后的版本复制到\
  \ `/etc` 并重启服务器。\n\n- 文件可以从共享拷贝到备份设备（如磁带驱动器）。此功能可用于客户端发起的备份——你可以创建一个 Windows 批处理文件脚本来打开\
  \ Samba 共享，将计算机的所有文件复制到该共享，然后关闭它。用户随后可以在 Samba 服务器的驱动器中插入磁带，在客户端上双击批处理文件，并等待备份完成。第\
  \ 17 章，执行网络备份。\n\n这些可能性中，某些比其他某些更有用。某些（特别是管理帮助共享）从安全角度来看具有潜在风险，但在某些限制情况下理论上是有用的。这些描述的重点不在于建议你*应该*对\
  \ `preexec` 和 `postexec` 脚本做什么，而是为了说明使用这些脚本*可以*做到的各种操作范围。\n\n### 提示\n\n![提示](img/tip.gif)\n\
  \n虽然你可以直接在 `preexec` 或 `postexec` 参数行上给出一组相当复杂的命令，但超过某个界限后，你应该考虑编写一个 shell 脚本并调用它。这允许你运行一组任意复杂的命令。\n\
  \n对于某些用途，你可能希望限制同时使用共享的人数。你可以通过 `max connections` 参数来实现这一点，该参数告诉 Samba 它将接受共享多少个并发连接。为了防止用户相互干扰工作成果，请设置\
  \ `max connections = 1`。然而，如果用户通过“网络邻域”或“我的网络位置”访问共享，可能会导致无法访问的意外副作用，因为正如前面提到的，Windows\
  \ 倾向于不会及时关闭此类连接。\n\n## 使用伪打印机\n\n另一个脚本化的机会来源于打印共享中使用的 `print command` 参数。虽然它旨在用于指定将打印作业发送到打印机的命令，但你可以在此参数中放入任何想要的内容，就像在\
  \ `preexec` 或 `postexec` 参数中指定任何命令一样。你可以利用此机制对 PostScript 文件进行操作，生成并非通常称为打印输出的效果。通过跳过\
  \ Windows 打印驱动程序，你还可以用它处理在 Windows 系统上生成的任何单文件数据。该参数的用途包括：\n\n- 使用 Linux 传真软件和 Windows\
  \ PostScript 驱动程序发送传真。甚至有像 Respond ([`www.boerde.de/~horstf/`](http://www.boerde.de/~horstf/))\
  \ 这样的 Windows 包可以为此类用途提供交互式界面，以便你可以在 Windows 系统上输入传真号。\n- 将 PostScript 文件转换为其他格式，例如\
  \ `PDF` 文件或图形文件格式。接下来的章节 “示例：创建 PDF 文件” 提供了这种用法的示例。\n- 直接打印非 PostScript 数据。某些此类数据可以被\
  \ Linux 打印过滤器正确解析，因此不需要特殊配置；然而，你可以创建一个 `print command` 来处理文字处理器文件，从数据库文件中提取并打印特定字段等。\n\
  - 通过将数据文件封装在类似 zip 文件的载体中，你可以将任何你想要的数据集传递给 Linux，并执行与你使用 `preexec` 或 `postexec`\
  \ 脚本执行相似的操作。因此，你可以备份计算机、将一种文件格式转换为另一种格式等。接下来的章节 “通过伪打印机刻录 CD” 提供了此类用法的示例。\n\n与 `preexec`\
  \ 和 `postexec` 脚本一样，你可以轻松地通过 `print command` 执行危险的操作。在使用它时要小心，特别是当你发现需要使用 `force\
  \ user` 参数设置 `root` 权限时。\n\n你可以在 `print command` 中可以使用表 7.1](#ch07.xhtml_ch07table01)描述的变量（事实上，某些变量如\
  \ `%s` 在 `preexec` 或 `postexec` 中并不适用）。`%H` 变量对于将输出交付回任务的用户非常有帮助——你可以用它来指定完成后文件放置的路径。\n\
  \n`print command` 相比于 `preexec` 和 `postexec` 脚本的一个优势是，不存在连接一直开启导致 `postexec` 命令延迟执行的问题。一旦客户端提交打印作业，`print\
  \ command` 就会开始工作。尽管取决于操作的性质，两个连续提交的任务可能会相互损坏文件。\n\n## 示例：刻录 CD\n\n脚本应用的一个示例是将 Samba\
  \ 服务器作为 CD 创建平台。假设你有一个拥有十二个客户端的小办公室和一个 CD-R 或 CD-RW 驱动器。任何客户端都可能有创建 CD 的合法需求。你可以将\
  \ CD-R 驱动器放在 Samba 服务器上，允许用户将文件复制到该服务器，然后使用 Linux CD-R 创建工具制作 CD。这个过程需要训练所有用户如何使用\
  \ CD-R 创建软件，并且可能会产生问题，因为用户可能会留下文件，从而占用硬盘空间。你可以使用 Samba 的脚本功能来自动化这一过程，消除许多此类问题。\n\
  \n### 通过 `preexec` 和 `postexec` 脚本刻录 CD\n\n假设你为 CD 创建留了一个 Samba 共享。该共享将除 CD 创建之外不用于任何其他用途。要通过\
  \ `preexec` 和 `postexec` 脚本刻录 CD，你需要让 Samba 执行若干任务：\n\n1.  清除共享中的所有文件。\n2.  接受用于刻录\
  \ CD 文件。\n3.  使用 `mkisofs` 或类似工具创建 CD 镜像文件。\n4.  使用 `cdrecord` 或类似工具将 CD 镜像文件刻录到\
  \ CD-R。\n\n\n\n\n\n## 5. 删除镜像文件以及创建它的源文件。\n\n以下共享完成了这些任务，尽管需要一点额外的帮助：\n\n```\n [cd-create]\n\
  \    path = /home/samba/cd-create\n    create mask = 0666\n    directory mask =\
  \ 0777\n    read only = No\n    max connections = 1\n    preexec = /bin/rm -r %P/*\n\
  \    postexec = /usr/local/bin/create-cd %H %P %U\n```\n\n`preexec` 参数负责任务 1。任务\
  \ 2 通过正常的 Samba 操作完成。任务 3–5 由 `postexec` 参数处理——或者更准确地说，是由 `/usr/local/bin/create-cd`\
  \ 脚本处理，该脚本出现在列表 7.1 中。\n\n**示例 7.1. 使用 `preexec` 和 `postexec` 创建 CD-R 的脚本**\n\n\
  ```\n #!/bin/sh\n## $1 = 任务提交者的主目录\n## $2 = 源文件目录\n## $3 = 任务提交者的用户名\nmkisofs -J\
  \ -r -o $1/image.iso $2\ncdrecord speed=2 dev=4,0 $1/image.iso\nmail -s \"CD-R creation\
  \ finished\" $3\nrm $1/image.iso\nrm -r $2/*\n```\n\n要准备此共享，你必须执行以下步骤：\n\n1. 将 `create-cd`\
  \ 脚本输入到你的系统并存储在 `/usr/local/bin` 中。脚本应设置执行权限（输入 `chmod a+x /usr/local/bin/create-cd`\
  \ 来完成此任务）。你应该根据想要使用的任何额外刻录选项调整 `mkisofs` 命令，并应该为自己的 CD-R 驱动器设置 `cdrecord`（`dev`\
  \ 和 `speed` 参数）。\n\n2. 创建一个类似于 `[cd-create]` 共享的 Samba 共享。如果你喜欢可以使用不同的目录，但确保为所有可能使用它的用户授予完全的读写权限。\n\
  \n3. 为 `cdrecord` 可执行文件设置 SUID 位。在大多数系统上，你可以通过输入 `chmod a+s /usr/bin/cdrecord` 来。某些发行版使用特殊组来控制对\
  \ `cdrecord` 的访问。如果你的系统是这样，可以将创建 CD 的用户添加到该组，或使用 Samba 参数 `force group` 将用户设置为该组的成员。或者，在\
  \ `[cd-create]` 共享中使用 `root postexec` 代替 `postexec`。这里的关键是 `create-cd` 脚本的命令必须以足够的权限执行，以便\
  \ `cdrecord` 命令成功。\n\n完成这些步骤后，你就可以使用该共享了。在 Windows 中，你可以在“网络邻域”或“我的网络位置”中找到共享，右键点击共享名称并从弹出菜单中选择“映射网络驱动器”。你将为共享分配一个驱动器号。挂载共享后，将想要刻录到\
  \ CD 的文件复制到共享中。你可以在共享中移动文件、删除不需要的文件等。当你准备好刻录 CD 时，在 CD-R 驱动器中插入一张空白 CD-R，并在“我的电脑”窗口中右键点击其图标，从出现的菜单中选择“断开连接”来卸载共享。\n\
  \n遗憾的是，Windows 有时即使在此时也不会断开共享，迫使你注销或（在 Windows 9x/Me 的情况下）重启系统。一段时间后（几秒钟或几分钟），服务器的\
  \ CD-R 驱动器将激活并最终完成操作，此时 `create-cd` 脚本将向用户发送电子邮件告知任务完成。然后就可以安全从驱动器中取出 CD-R 并进行测试。\n\
  \n这里提供的共享定义和 CD 刻录脚本略显粗糙。例如，这些脚本对两个用户互相破坏工作提供的保护非常有限；如果一个人在另一个人从 CD-R 驱动器中取出新光盘之前尝试创建\
  \ CD-R，就会出现问题。这些脚本不会向用户报告错误。例如，如果创建的镜像太大无法放入空白 CD-R，第一个迹象可能是光盘在读取时出现问题。更复杂的 `create-cd`\
  \ 脚本可能会检查此类潜在问题并向用户报警，或完全避免这些问题。最后，不同版本的 Samba 处理 `%P` 变量的方式不同，因此你可能需要相应地调整共享。\n\
  \n### 通过伪打印机刻录 CD\n\n伪打印机提供了一种对 Windows 9x/Me 客户端更方便的 CD 创建方法，但这比普通文件共享没那么直观。该共享的想法是让\
  \ Windows 客户端传递一个包含 CD 预期内容的 zip 文件。然后共享调用一个 `create-cd` 脚本的变体来解压 zip 文件并从生成的文件刻录\
  \ CD-R。基础的 Samba 共享定义如下：\n\n```\n [cd-print]\n    path = /var/spool/samba\n    printable\
  \ = Yes\n    print command = /usr/local/bin/print-cd %H %s %U %P\n```\n\n\n\n\n\
  倒数第二行末尾的反斜杠（`\\`）是续行符；它告诉 Samba 下一行是上一行的延续。当命令很长时，这些字符可以产生更短的行，从而使配置文件更具可读性。\n\n\
  此 `print command` 参数调用了 `gs`，即 Ghostscript 可执行文件。`-dNOPAUSE`、`-q` 和 `-dBATCH` 选项产生静默且连续的输出，无需人工干预。`-sDEVICE=pdfwrite`\
  \ 规格指示输出为 PDF 文件，而 `-sOutputFile=%H/%s.pdf` 选项指定输出文件名与打印任务名称相同，但附加 `.pdf` 后缀并存储在用户的主目录中。你可以修改此共享定义，将文件通过电子邮件回给用户，或者存储在其他位置或使用其他文件名。\n\
  \n## 总结\n\nSamba 是一个异常复杂且灵活的文件共享服务器。大多数 Linux 发行版都带了默认的 Samba 配置，只需进行几处少量调整即可在典型网络中工作。进行进一步的调整（特别是如果你想让\
  \ Samba 服务器充当域控制器时）并为你的特定用途添加共享可能需要更多精力，但大多数单独的调整并不算繁重。Samba 显示其灵活性的性的一个领域是其按需运行命令的能力。你可以使用此功能让\
  \ Samba 服务器提供你可能认为与文件服务器无关的功能，例如创建 CD 的能力。\n\n# 第 8 章 通过 NFS 共享文件\n\n第 7 章（第 7 章\
  \ 通过 Samba 共享文件和打印机）描述的服务器消息块（SMB)/通用互联网文件系统（CIFS）协议对于与 DOS、Windows、OS/2 以及其他操作系统共享文件和打印机非常有用。然而，这些协议缺乏\
  \ UNIX 或 Linux 系统所需的特性，例如对 UNIX 风格所有权权限的完整支持。因此，当你与另一个 UNIX 或 Linux 系统共享文件时，通常使用另一种协议：网络文件系统（NFS）。（第\
  \ 9 章（第 9 章 通过 LPD 共享打印机）讨论了 Linux 原生的打印机共享协议；与 SMB/CIFS 不支持打印。）\n\n## 何时运行 NFS\
  \ 服务器\n\n运行 NFS 服务器的通常原因是你想与其他 UNIX 或 Linux 系统共享文件。你可能这样做是为了共享静态文件，例如程序二进制文件——例如，你可能将大型程序存储在服务器上，允许硬盘较小的计算机通过\
  \ NFS 运行这些大型程序。NFS 的另一个常见用途是为用户更改的文件提供一个集中服务器——而不是将用户的家目录放在他们自己的工作站上，你可以将它们放在集中服务器上。特别是当与\
  \ Kerberos 等集中式登录系统（在第 6 章（第 6 章通过 Kerberos 验证用户）中讨论）配合时，这种方法提供了极大的活性，因为用户可以登录你网络上任何配置恰当的工作站，并像使用任何其他计算机一样使用它。这实际上将用户从特定的工作站上解脱出来。当然，你不需要以这两种精确方式之一使用\
  \ NFS。例如，你可以设置本地主目录，但为用户之间的共享文件提供 NFS 服务器，或者为静态数据库提供只读访问。\n\n尽管 NFS 是为 UNIX 系统设计的，因此与\
  \ Linux 配合良好，但其他操作系统（如 Windows、OS/2 和 MacOS）也有 NFS 客户端和服务器。在大多数情况下，配置 Linux 使用其他操作系统的原生文件共享协议比在这些操作系统之一上使用\
  \ NFS 更好好。当该协议是 SMB/CIFF 且 Linux 作为服务器时，情况尤其如此，因为 Samba 作为 SMB/CIFF 服务器的表现出色，而且配置一个带有\
  \ Samba 服务器软件的 Linux 系统通常比在许多通常不支持它的客户端上添加 NFS 客户端软件要简单。不过，在某些情况下你可能想使用 NFS 与非 UNIX\
  \ 或非 Linux 系统交互，例如，如果你的网络由 UNIX 或 Linux 系统主导，而只需要添加一两个 Windows 或 MacOS 计算机。（MacOS\
  \ X 是基于 UNIX 的，因此非常支持 NFS，尽管它的配置在标准的 MacOS GUI 界面中并不直观。）\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n正如接下来的章节“访问机制”所描述，NFS 不依赖密码或其他典型的限制访问的方法。相反，它使用一种*信任主机*（trusted hosts）模型，在该模型中，服务器依赖主机来验证用户，而\
  \ NFS 服务器反过来信任这些客户端完成了它们的身份验证工作。你通过主机名或 IP 地址指定客户端。可能会伪造（即虚假）IP 地址，或者重新配置本地计算机以绕过这种安全性。因此，你应该密切关注\
  \ NFS 系统的安全性。理想情况下，你不应该通过 NFS 提供敏感数据。你可能倾向于使用 Samba 或其他文件传输机制（例如作为 *Secure Shell\
  \ (SSH)* 软件包一部分的 `scp` 程序）来更安全地传输敏感数据。\n\n## Linux 可用的 NFS 服务器\n\n在 1998 年到 2002\
  \ 年之间，Linux 的 NFS 支持发生了几次重要变化。本节总结了这些变化中的两种，以防你有旧的文档或正在使用旧的发行版。你通常可以使用发行版自带的任何 NFS\
  \ 服务器，但有时你可能需要升级（或偶尔降级）你的服务器以与其他系统保持兼容。你可以在 [`http://nfs.sourceforge.net`](http://nfs.sourceforge.net)\
  \ Find 有关 Linux 最新 NFS 进展的信息。\n\n## 用户态服务器和内核态服务器\n\n\n\n\n### 注意\n\n![NOTE](img/note.gif)\n\
  \n\n\n\n\n# 第 4 章包含了对 `TCP` Wrappers 配置的讨论，包括允许的客户端规范形式。然而，在 `portmapper` 的情况下，你不应该通过主机名指定客户端，因为主机名查找会导致\
  \ `portmap` 活动。因此，在查找主机名时，可能会再次调用 `portmap`，导致另一次主机名查找，以此此类推。这种无限循环无疑会让你无事无归，同时消耗大量的\
  \ CPU 时间。与其使用主机名，不如使用 `IP` 地址或 `IP` 地址段。\n\n仅启动 `portmapper` 并不足以通过 `NFS` 提供服务。除了定义你想要共享的目录（如在下一节“使用\
  \ NFS 共享文件”中描述），你还必须启动 `NFS` 服务本身。这通常是通过一个名为 `nfs` 或类似的 SysV 启动脚本来完成的。某些发行版要求你启动两个或多个\
  \ SysV 启动脚本（除 `portmapper` 之外）才能让 `NFS` 工作。在安装完 `NFS` 服务包后启动系统时，这些脚本可能会自动运行。如果你更改了配置，可能需要使用\
  \ `restart` 选项调用 `NFS` SysV 启动脚本，例如执行 `/etc/rc.d/init.d/nfs restart`。\n\n## 使用 NFS\
  \ 共享文件\n\n实际提供文件需要告诉 `NFS` 服务器你想要*导出*（即让其他人可以使用）哪些目录，以及哪些客户端应该拥有特定目录的访问权限。你还可以包含影响访问控制和其他重要服务器特性的选项。要从客户端挂载\
  \ `NFS` 服务器的导出内容，你需要使用 `mount` 命令，但不是指定本地设备文件，而是将该工具指向 `NFS` 服务器并提供你想要挂载的目录名称。\n\
  \n## 定义 NFS 导出\n\nLinux 使用 `/etc/exports` 文件来控制 `NFS` 服务器。该文件由一系列行组成，每行定义一个要导出的单个目录。每行的格式如下：\n\
  \n```\n\n /path/to/export  client1(options) [client2(options)[...]]\n```\n\n`/path/to/export`\
  \ 是你想要导出的目录名称，例如 `/home` 或 `/usr/X11R6`。你可以列出任何你喜欢的目录，但当然，某些目录导出后并没有用，或者会带来安全风险。例如，导出\
  \ `/etc` 或 `/proc` 可能是危险的，因为远程用户可能会查看或修改敏感的系统特定信息。你可能认为导出 `/dev` 会让远程用户访问服务器的设备，但事实并非如此——设备文件始终引用本地计算机上的设备，因此导出\
  \ `/dev` 只是为用户提供了一种访问客户端设备的重复手段。如果将这些导出的内容挂载到与服务器使用的不同的操作系统上，这些文件的命名可能会很奇特，或者指向错误的硬件。如果用户能够以宽松的权限在服务器上创建设备文件，这种访问对*客户端系统*来说也可能存在潜在的安全风险。（后文描述的\
  \ `nodev` 挂载选项解决了这个问题。）\n\n你可以单独列出客户端或通过通配符列出客户端。可能包括以下几种：\n\n*   **无名称**。如果你只在括号中提供选项列表，任何客户端都可以连接到该导出内容。这种配置极不安全，因此通常不会使用，除非偶尔如后文描述的那样用于限制对目录的访问。\n\
  *   **单个计算机名**。你可以指定单个计算机名，例如 `larch` 或 `larch.threeroomco.com`，允许该计算机访问共享内容。如果你没有包含域名，则假设使用服务器自身的本地域。\n\
  *   **通配符**。你可以使用问号（`?`）和星号（`*`）通配符来表示计算机名中的单个字符或字符组，例如使用 `*.threeroomco.com` 为\
  \ threeroomco.com 域的所有计算机提供访问。但通配符不匹配点（`.），因此在此中，threeroomco.com 子域名下的计算机（如 `mulberry.bush.threeroomco.com`）不会匹配。\n\
  *   **NIS 网络组**。如果你的网络使用网络信息服务 (`NIS`) 服务器，可以在名称前加上符号（`@`）来指定 `NIS` 网络组。\n*   **按\
  \ IP 地址划分**。你可以通过列出一个网络（如 `172.16.0.0/255.255.0.0`）通过 `IP` 地址指定受限制的计算机组。你也可以指定单个位数，如\
  \ `172.16.0.0/16`。\n\n作为一般规则，通过 `IP` 地址指定计算机是最安全的，因为如果 `DNS` 被破解，主机名和 `NIS` 网络组名可能会被更改。`IP`\
  \ 地址也可以被伪造，特别是当入侵者可以物理访问你的网络时，但使用 `IP` 地址消除了一种可能的攻击方法。另一方面，使用 `IP` 地址可能会带来不便，如果客户端的\
  \ `IP` 地址频繁变化（如在第 5 章：通过 DHCP 配置其他计算机中所所示的通过 DHCP 分配时），可能会使问题变得复杂。\n\n### 提示\n>\
  \ 提示：以这种方式指定单个客户端似乎与之前描述的通过 `TCP` Wrappers 阻止对 portmapper 的访问是重复的。这部分是正确的，因为两种方法*都*应该限制对服务器的访问。然而，某种方法中可能存在错误或配置错误，因此这种冗余并不是坏事。事实上，建议通过包过滤规则（如第\
  \ 25 章”中所示）实施额外的限制。\n\n### 注意\n> 注意：某些 Linux 发行版现在默认启用防火墙，或在安装时易于配置。其中某些发行版（例如红帽发行版）已知会阻止对\
  \ `NFS` 服务器的访问，且某些并不便于开放这种访问。如果你在 `NFS` 访问方面遇到问题，可能需要查阅第 25 章以学习如何检查和修改你的系统防火墙规则。\n\
  \n你可以为每个客户端或一组客户端指定一组不同的选项。这些选项出现在计算机规范后的括号内，并用逗号相互隔开。许多此类选项设置了访问控制功能，如后文在“访问控制机制”节中所述。其他选项则与一般的性能问题或服务器默认值有关。常规选项的示例包括：\n\
  \n\n\n\n\n* `sync` 和 `async` — 这些选项分别强制执行同步或异步操作。异步写入允许服务器在磁盘操作完成之前告诉客户端写入操作已完成。这一过程可以带来更快的运行，但存在潜在风险，因为服务器崩溃可能会导致数据丢失。NFSv2\
  \ 官方并不支持异步操作，但尽管如此，Linux `NFS` 服务器实现了这一功能。NFSv3 确实支持异步选项，并要求客户端缓冲数据以降低风险。该选项的默认值为\
  \ `async`，尽管 Linux NFSv3 的测试测试版本忽略了该设置。\n\n* `wdelay` 和 `no_wdelay` — 默认情况下，如果 Linux\
  \ 的 `NFS` 服务器怀疑相关的请求正在进行或即将发生，它可能会推迟数据写入磁盘的机。这在大多数情况下可以提高性能。你可以通过 `no_wdelay` 选项停用此行为，或通过\
  \ `wdelay` 显式请求默认设置。\n\n## 访问控制机制\n\n你在 `/etc/exports` 中为单个客户端指定的许多选项都与访问控制有关。如前所述，`NFS`\
  \ 使用信任主机安全模型，因此你无法像使用 Samba 那样通过用户名和密码来控制对特定导出或文件的访问；如果客户端的安全性是可以信任的，客户端将把标准的 UNIX\
  \ 风格所有权和权限应用于文件访问。与安全相关的 `/etc/exports` 选项包括：\n\n* `secure` 和 `insecure` — 默认情况下，`NFS`\
  \ 服务器要求访问尝试源自 `secure` 端口——即编号 1024 以下的端口。在 UNIX 或 Linux 系统上，此类端口通常仅供 `root` 使用，而任何人都可以更高编号的端口。因此，允许从更高端口访问（可以通过\
  \ `insecure` 选项实现）为客户端上的普通用户提供了更多滥用服务器的机会，但也允许你作为普通用户运行 `NFS` 测试程序。\n\n* `ro` 和\
  \ `rw` — `ro` 和 `rw` 选项分别指定对导出内容的只读和读写访问。启用内核的 `knfsd` 服务器默认为 `ro`，但旧版服务器默认为 `rw`。我建议显式指定其中一个选项以避免混淆或错误。\n\
  \n* `hide` 和 `nohide` — 假设你的 `NFS` 服务器在自己的分区上存储了 `/usr` 目录树，而 `/usr/local` 在另一个分区上。如果你导出\
  \ `/usr`，`/usr/local` 是否也会被导出？过去不同的 `NFS` 服务器默认设置有所不同，2.2.x 内核包含一个设置默认值的选项。最近的 `NFS`\
  \ 服务器包含了 `hide` 和 `nohide` 选项，分别用于隐藏挂载的分区或不隐藏。某些客户端无法良好处理未隐藏的挂载分区，因此你可能希望设置 `hide`\
  \ 选项并显式导出挂载的分区（在本例中为 `/usr/local`）。客户端可以显式挂载这两个导出项。\n\n* `noaccess` — 此选项禁用对目录的访问，即使该目录是已显式导出目录的子目录。例如，假设你想导出\
  \ `/home` 目录树，但 `/home/abrown`。你可以创建一个普通的 `/etc/exports` 行来导出 `/home`，然后为 `/home/abrown`\
  \ 创建单独的 `/etc/exports` 行并包含 `noaccess` 选项。结果是无法访问 `/home/abrown`。\n\n* `subtree_check`\
  \ 和 `no_subtree_check` — 假设你导出了分区的子目录，而不是整个分区。在这种情况下，`NFS` 服务器必须执行额外的检查，以确保所有客户端访问仅针对适当子目录中的文件。这些子树检查会稍微减慢访问速度，但在某些情况下（当文件从导出的子树移动到另一个区域时）可能会导致安全问题。你可以通过指定\
  \ `no_subtree_check` 选项来禁用子树检查，或通过 `subtree_check` 显式启用（后者是默认值）。如果导出的目录精确对应单个分区，你可以考虑禁用子树检查。\n\
  \n* `root_squash` 和 `no_root_squash` — 默认情况下，`NFS` 服务器会压缩源自客户端 `root` 用户的访问尝试。这意味着服务器将这些访问处理为来自本地匿名用户（稍后描述）。这种默认设置提高了安全性，因为它拒绝向其他可能被攻击的系统授予\
  \ `root` 权限。如果你需要允许远程管理员对导出内容拥有本地 `root` 权限，可以通过 `no_root_squash` 选项来实现。例如，在某些网络备份情况下可能需要这样做。\n\
  \n* `all_squash` 和 `no_all_squash` — 通常情况下，普通用户不应被压缩，但你可能想通过 `all_squash` 在特别敏感的导出上启用此功能。`no_all_squash`\
  \ 是默认值。\n\n* `anonuid` 和 `anongid` — 用于压缩的匿名用户是 `nobody`。你可以通过分别使用 `anonuid` 和 `anongid`\
  \ 指定用户 ID (`UID`) 和组 ID (`GID`) 来覆盖此默认值。你可以使用此功能赋予 `root` 用户访问权限，例如 `NFS` 客户端，如\
  \ `anonuid=504`。\n\n## 挂载 NFS 导出\n\n从客户端来看，`NFS` 导出类似于磁盘分区。具体来说，你使用 `mount` 命令挂载导出项，但不是指定分区的设备文件名，而是提供\
  \ `NFS` 服务器名称以及你想在该服务器上挂载的目录，格式为 `server:`/path/to/export`。例如，以下命令将 `larch` 的 `/home`\
  \ 导出项挂载到 `/mnt/userfiles`：\n\n```\n # mount larch:/home /mnt/userfiles\n```\n\n\n\
  \n\n或者，如果你希望导出项始终可用，可以在 `/etc/fstab` 中创建一个与 `mount` 命令对应的条目。与 `mount` 命令一样，你将服务器名称和导出路径替换为设备文件名。文件系统类型代码为\
  \ `nfs`（你也可以在 `mount` 命令中使用它，但 Linux 通常能自动识别此项）。例如，以下 `/etc/fstab` 条目等同于之前的 `mount`\
  \ 命令：\n\n```\nlarch:/home  /mnt/userfiles  nfs  defaults  0 0\n```\n\n用户随后可以在 `/mnt/userfiles`\
  \ 目录下访问 `larch` 的 `/home` 目录中的文件。对于挂载的 `NFS` 导出项，你可以执行大多数在原生 Linux 磁盘分区上可以执行的操作，例如：读取文件、删除文件、编辑文件等。不过，少数操作在\
  \ `NFS` 导出项上无法正常工作。例如，你无法通过 `NFS` 使用交换文件。在大多数情况下，`NFS` 导出的性能无法匹配本地文件系统的性能；大多数网络的速度无法匹配现代硬盘的速度。不过，如果你有特别快的网络（例如千兆以太网），或者客户端的本地硬盘特别老旧且缓慢，`NFS`\
  \ 可能会提供更的性能。服务器的磁盘速度和服务的客户端数量也会影响 `NFS` 性能。\n\n所有权和权限随文件名和文件内容一起导出。因此，你和你的用户可以像本地一样使用所有权和权限来控制对文件和目录的访问。你甚至可以使用这些方案跨多台计算机控制访问——例如，如果一个\
  \ `NFS` 服务器支持多个客户端。然而，存在一个潜在严重的问题：`NFS` 使用 UID 和 GID 来标识用户，因此如果这些标识在客户端和服务器之间不匹配，会导致混乱并可能的安全漏洞。解决此问题有多种方法，正如“用户名映射选项”节中所讨论的。\n\
  \n接下来的章节描述了你可以提供 `mount` 命令的某些选项，以修改 `NFS` 客户端/服务器在性能、用户名映射等方面的交互行为。一些额外的杂项选项包括：\n\
  \n* `hard`：如果服务器崩溃或无响应，尝试访问服务器的程序将挂起；它们会无限等待响应。这是默认行为。\n* `soft`：如果你的 `NFS` 服务器频繁崩溃或无响应，你可能想使用此选项，它允许内核在\
  \ `NFS` 服务器未响应一段时间后向程序返回错误（通过 `timeo=time` 选项设置）。\n* `nodev`：此选项防止客户端尝试解释 `NFS`\
  \ 导出项上的字符设备或块特殊设备。这可以通过减少恶意分子在 `NFS` 导出项上创建权限松的设备文件并利用其对客户端造成破坏的风险，有助于提高安全性。\n*\
  \ `nosuid`：此选项防止客户端遵循 `NFS` 导出项上文件的设置用户 ID (SUID) 位。与 `nodev` 一样，这是一项重要的安全措施，因为如果用户可以在\
  \ `NFS` 导出项上创建一个 SUID `root` 程序，该用户可能会获得对客户端的超级用户权限。\n* `noexec`：此选项防止客户端遵循 `NFS`\
  \ 导出项上文件的执行位——换句话说，用户无法从 `NFS` 导出项运行程序。此选项在某些情况下显然是不恰的，例如当你故意共享一个二进制目录时，但如果导出项不应包含可执行文件，它可能会进一步增强安全性。\n\
  \n你可以在 `mount` 命令中紧随 `-o` 选项包含这些任何选项，如下所示：\n\n```\n# mount -o noexec,nodev larch:/home\
  \ /mnt/userfiles\n```\n\n如果你创建了 `/etc/fstab` 条目，请将这些选项放在选项列（之前的 `/etc/fstab` 示例列出\
  \ `defaults` 的位置）。\n\n## 优化性能\n\n两个最重要的性能增强已经描述过了：将内核的 `NFS` 支持结合 `knfsd` 使用，以及尽可能使用异步模式。（尽管后者选项增加了服务器崩溃时文件丢失的风险。））其他性能增强还包括：\n\
  \n* 优化挂载传输大小选项：`mount` 的 `rsize` 和 `wsize` 选项指定了客户端和服务器之间传递的数据大小。默认值因客户端而异，但 4096\
  \ 是一个典型值。你可能需要调整这些值，例如 `mount larch:/home /mnt/userfiles -o rsize=8192`。当你想要自动挂载\
  \ `NFS` 导出项时，将这些选项放在 `/etc/fstab` 的选项列中。\n* 优化访问时间：`mount` 的 `noatime` 选项告诉 Linux\
  \ 不要更新访问时间。通常，Linux 会记录文件最后访问的时间，以及创建和更改的时间。省略访问时间信息可以提高 `NFS` 性能。\n* 运行 `NFS` 服务器的数量：大多数发行版的\
  \ `NFS` 启动脚本启动八个实例。这个数字是任意的。在轻负载系统上，它可能太高，导致内存浪费；在重负载系统上，它可能太低，导致客户端连接时性能不佳。你可以通过编辑\
  \ `NFS` 服务器启动脚本来调整该值。这些脚本通常通过脚本开头附近的变量设置实例数量，例如 `RPCNFSDCOUNT=8`。\n* 非 NFS 性能问题：许多网络功能和非网络功能都会影响\
  \ `NFS` 性能。例如，如果你的网卡不稳定或缓慢，你就会遇到 `NFS` 性能问题。同样，主要的 `NFS` 服务器依赖于其硬盘，因此拥有一个快速硬盘是非常重要的，理想情况下由低\
  \ CPU 开销的硬件驱动（例如具有 DMA 能力的 EIDE 控制器或良好的 SCSI 适配器；SCSI 通常更优）。\n\n如果你的 NFS 服务器性能不佳，你应该首先尝试确定问题是在于\
  \ NFS 服务器软件、NFS 客户端系统、通用网络配置，还是磁盘性能等更一般的领域。你可以通过使用各种协议和客户端运行性能测试，以及完全本地的测试（例如使用\
  \ `hdparm` 的 `-t` 选项测试你的硬盘性能）来实现这一点。\n\n\n\n\n在孤立的 Linux 计算机，`/etc/passwd` 文件控制用户名到\
  \ UIDs 的映射，而 `/etc/group` 则对组执行类似的工作。使用 NFS 时，通常至少有两个独立的 `/etc/passwd` 文件——一个用于服务器，每个客户端各一个。因此，可能会出现用户在服务器上拥有一个\
  \ `UID`，而在客户端上拥有另一个 `UID` 的情况，除非在设置账户时格外小心，否则这种情况很可能、甚至是必然的。有几种可能的方法可以规避或避免这个潜在问题。\n\
  \n### 注意事项\n\n![NOTE](img/note.gif)\n\n此讨论假设用户在客户端和服务器上都有账户。如果服务器*仅*作为文件服务器使用，它可能缺少用户账户。对于只读服务器，甚至对于某些读写配置，这可能是一个合理的配置。然而，如果一个读写服务器有多个客户端，那么在客户端之间同步\
  \ UIDs 就至关重要，即使服务器没有为所有用户创建账户。最简单的方法是配置一个持有带有用户账户的用户文件的 NFS 服务器，从使这些用户无法直接登录 NFS\
  \ 服务器。如果服务器不持有用户所属的文件，那么用户名映射可能并不重要。\n\n## 同步客户端和服务器的用户 ID\n\n概念上最简单的解决方案是同步客户端和服务器上的\
  \ UIDs 和 GIDs。例如，如果特定用户在服务器上的 `UID` 为 504，你应该确保该用户在客户端上的 `UID` 也是 504。`GID` 分配也应该以类似的方式同步。遗憾的是，像这样手动调整\
  \ UIDs 是繁琐的。不过，在一个客户端计算机和用户较少的极小网络中，这可能是一个可行的方案。如果你需要调整现有的 UIDs，可以使用 `usermod` 命令来更改用户的\
  \ `UID`。例如，要将 `abrown` 的 `UID` 从 507 改为 504，你需要执行以下命令：\n\n```\n## usermod -u 504\
  \ abrown\n```\n\n此命令将更改 `/etc/passwd` 中的条目，并更改与用户主目录下文件关联的 `UID`，因此用户在重新登录后不会察觉到变化。（如果用户在主目录之外存储了文件，则你需要手动更改那些文件的所有权。）此命令可能需要一些时间才能完成。如果你中断了它，你可能需要手动更改某些文件和目录（包括用户的主目录）的所有权。\n\
  \n`groupmod` 命令用于更改组信息具有类似的功能，但你通过 `-g` 参数传递新的组 ID。例如，要将组 `project3` 的 `GID` 数字更改为\
  \ 127，你需要执行以下命令：\n\n```\n# groupmod -g 127 project3\n```\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n不要在用户或组成员已登录时尝试更改 `UID` 或 `GID`。这样做可能会导致无法保存工作或读取文件，而且当发生这种情况时，运行的程序可能会以特定的方式发生异常。如果你不小心执行了此类更改，可以尝试撤销，或者建议用户注销然后重新登录。如果用户需要保存任何文件，可以将它们保存在公共区域，例如\
  \ `/tmp`。\n\n关于这种方法需要注意的一点是，客户端和服务器上使用的用户名不需要匹配。例如，同一个用户在服务器上的用户名可能是 `abrown`，但在客户端上的用户名可能是\
  \ `alyson`。当此人使用客户端访问服务器上的文件时，这些文件看起来似乎属于 `alyson`；但如果该用户登录 NFS 服务器，文件将看起来属于 `abrown`。此功能可能会令人困惑，但在某些情况下也可能有用。\n\
  \n保持 UIDs 和 GIDs 同步的想法的变体是使用外部服务器对客户端和服务器上的用户进行验证。这种做法将让用户在 NFS 客户端和 NFS 服务器上具有相同的\
  \ UID 和组 GID。你可以使用第 6 章描述的 Kerberos。Linux 的 NFS 实现通过 `map_nis` 选项对 NIS 认证提供了显式支持。当你在\
  \ `/etc/exports` 中特定客户端的定义中包含此选项时，NFS 服务器在为该客户端和导出创建用户名时将听从 NIS 服务器。\n\n## 使用服务器端用户映射\n\
  \n假设你正在管理一个拥有两台计算机的网络，其中有四个用户，其用户名和 UIDs 概述如表 8.1 所示。在这个示例中，`gingko` 是服务器，`larch`\
  \ 是客户端。在这四个用户中，只有一个人（`james`）在两个系统上拥有相同的 `UID`。在没有特殊配置的情况下，`james` 能够正确访问自己的文件。然而，从\
  \ `larch` 开始，`alyson` 会发现存储在 `gingko` 上的文件属于一个未识别的用户（`UID` 500，它在 `larch` 上没有对应项）。最后两个用户\
  \ `jennie` 和 `samuel` 似乎拥有着对方的文件。\n\n**表 8.1. 两台计算机上的假设用户和组 ID**\n\n| 用户 | `gingko`\
  \ 上的用户 ID | `larch` 上的用户 ID |\n| --- | --- | --- |\n| `alyson` | 500 | 504 |\n|\
  \ `james` | 501 | 501 |\n| `jennie` | 502 | 503 |\n| `samuel` | 503 | 502 |\n\n\
  解决映射问题的一种方法是让 NFS 服务器维护一个包含类似于表 8.1 中映射信息的文件。你通过 `map_static` 选项告知服务器使用此类文件，并在此选项传递映射文件的名称。例如，`/etc/exports`\
  \ 中的条目可能如下所示：\n\n```\n/home  larch(rw,map_static=/etc/nfs/larch-map)\n```\n\n\n\n\
  \n\n这告诉系统将 `/home` 导出到 `larch`，并使用文件 `/etc/nfs/larch-map` 作为映射文件。由于 `map_static`\
  \ 选项是客户端选项列表的一部分，可以为不同的客户端创建单独的映射列表。`larch-map` 的内容匹配表 8.1，可能类似于列表 8.2。以井号（#`）开头的行是注释并会被忽略；列表\
  \ 8.2 包含几行注释，用于说明文件并提醒你每列信息的含义。每行非注释内容都以 `uid` 或 `gid` 开头，分别标识 UID 或 GID 的映射。下一个项是客户端系统上的\
  \ ID 数字或多个数字（以范围表示，例如第一条目中的 `0-99`）。最后条目是远程 ID 映射到的本地 <UID> 或 <GID>。例如，列表 8.2 将客户端的\
  \ <UID> 504 映射到服务器的 <UID> 500。如果服务器列由单个横线（`-`）组成，则如前所述，NFS 服务器将压制访问——将其转换为匿名用户的权限。\n\
  \n### 示例 8.2. UID 映射文件的示例内容\n\n```\n # Mapping for client larch\n#    remote   \
  \ local\nuid  0-99      -       # squash\nuid  504       500\nuid  501       501\n\
  uid  503       502\nuid  502       503\ngid  0-99      -       # squash\ngid  100-102\
  \   100\n```\n\n*每个*用户的 ID 必须出现在映射文件中是重要的。例如，列表 8.2 并没有省略 <UID> 501，尽管它在两个系统上映射到相同的数字。省略\
  \ <UID> 可能会导致错误的映射，从而产生问题。列表 8.2 显式地压制了所有系统 UID（编号 100 以下的）。它还压制了所有 100 以下的 GID，并将\
  \ 100–102 的客户端 GID 映射到本地 <GID> 100。虽然你可以将范围客户端 ID 映射到单个服务器 ID，但反过来操作是没有意义的——因为当服务器看到尝试使用特定远程\
  \ ID 创建文件时，它不知道应该使用哪个本地 ID。\n\n与手动同步客户端和服务器 ID 一样，使用这种方法，客户端和服务器上的用户名也可能是不同的。映射文件完全基于用户\
  \ ID 和组 ID 工作；它不关心用户名。为了避免混淆，可能最好尽可能在客户端和服务器之间保持用户名相同。\n\n## 使用客户端映射守护进程\n\n解决映射问题的另一种方法是使用服务器中的\
  \ `map_daemon` 选项，它允许运行在客户端上的特殊服务器（称为 `ugidd` 或 `rpc.ugidd`）执行用户名映射。遗憾的是，这个选项有几个问题。首先，`ugidd`\
  \ 服务器很难找到。在本书讨论的发行版中，只有 Debian 带有。另一个问题是 `ugidd` 服务器运行在客户端，这会导致配置复杂得多，因为你必须在所有客户端上安装该程序。除非你阻止对\
  \ `ugidd` 的访问（例如使用 `/etc/hosts.allow`），否则坏分子可以使用该服务器发现你所有 NFS 客户端上的用户名，而最好是让这种情况变得不可能。最后，也是许多方面最重要的，服务器非常挑剔，可能完全无法工作，或者可能将所有用户映射到\
  \ `nobody`。\n\n## 总结\n\nNFS 是 UNIX 和 Linux 系统之间进行文件共享的非常有用的工具。与 Samba 不同，NFS 为 UNIX\
  \ 风格的文件所有权权限提供了式支持。同样，NFS 配置通常比 Samba 配置更简单。另一方面，NFS 依赖于信任主机的安全模型，如果你不在客户端和服务器之间保持用户名同步，你就不得不采用用户名方案，例如在特殊文件中存储用户\
  \ ID。\n\n# 第 9 章 通过 LPD 共享打印\n\nLinux 继承了来自伯克利软件发行版（BSD）Unix 变体的打印系统。该系统通常以其最关键组件行打印机守护进程（LPD）的名字命名，与现代操作系统的打印系统相比，它既非常灵活又非常原始。LPD\
  \ 的灵活性源于它是一个网络化打印系统。因此，不需要运行单独的打印服务器或打印客户端来执行网络操作；基础打印系统包含了网络客户端和服务器功能。LPD 的原始性体现在它如何处理驱动程序以处理市面上各种打印机的输出。LPD\
  \ 并不像其他操作系统上那样显式支持打印机驱动程序，尽管一个常用的附加包（Ghostscript，参见 [`www.cs.wisc.edu/~ghost/`](http://www.cs.wisc.edu/~ghost/)）结合用于识别和处理不同类型文件的*智能过滤器*，大致填补了这一角色。\n\
  \n本章讨论了 LPD 的网络功能，以及一种日益流行的更现代协议。本章*不*涵盖如何通过 Ghostscript 和智能过滤器配置计算机来驱动特定型号的本地打印机。有关这些信息，请咨询您的发行版文档或\
  \ Linux 入门书籍。本章从 LPD 现状的概述开始——你何时应该运行 LPD 服务器，以及 Linux 下有哪些打印软件选项。然后，本章将检查如何配置 Linux\
  \ 下最常见的三个打印系统：原始的 BSD LPD、LPRng 替换包以及较新的 CUPS 包。\n\n\n\n\n从概念上讲，网络打印与文件共享相似。在网络打印中，客户端将文件发送到服务器，就像文件共享客户端向文件共享服务器发送文件一样。主要的区别在于对文件的处理方式。在文件共享的情况下，服务器将文件存储在其磁盘上，推测是为了供同一用户或其他用户在稍后访问。而在网络打印中，服务器将文件发送到打印机，通常在完成后删除打印池文件（spool\
  \ file）。这两个任务在网络层面上非常相似，以至于某些协议——最重要的服务器消息块 (`SMB`)/通用互联网文件系统 (`CIFS`) 协议——使用单一单一服务器（在\
  \ Linux 下为 `Samba`）来处理这两项任务。然而，原生的 UNIX 工具将这两个功能分离为两个服务器：用于文件共享的网络文件系统 (`NFS`) 服务器和用于打印机共享的\
  \ `LPD`。\n\n如前所述，Linux 的标准 `LPD` 工具集成了本地和网络打印操作，因此如果你的 Linux 系统配置为使用这些标准工具进行打印，那么配置系统以接受远程打印作业或将打印作业发送到网络打印机只需要很少额外精力。因此，从某种意义上说，何时运行\
  \ `LPD` 服务器的问题取决于你何时想进行网络打印。作为一条一般规则，网络打印在许多中小型办公室非常有用，可以作为扩展可用资源的方法。与其为十几台计算机购买廉价的（例如\
  \ 300 美元）激光打印机（总成本为 3600 美元），你可以购买一台功能更强大的 1500 美元激光打印机。对于这个价差，你甚至可以赠送一台廉价的彩色喷墨打印机，或将激光打印机升级为处理彩色的型号，而且仍然划算。`LPD`\
  \ 是允许你实现这一点的关键组件之一。\n\n然而，`LPD` 并不是唯一的网络打印协议。如前所述，`SMB`/`CIFS` 包含了打印功能。竞争性协议和包如\
  \ AppleTalk（通过 Linux 的 `Netatalk`）也是如此。因此，在另一个层面上，问题变成了：你何时应该使用 `LPD` 而不是其他打印机共享工具？这个问题比前面的问题要微妙得多。回答这个问题时，有两个主要点需要考虑：\n\
  \n*   客户端对什么支持得最好？Linux 支持多种网络打印协议，因此 Linux 计算机可以作为许多不同类型客户端的打印服务器。因为在任何给定网络中，客户端通常多于服务器，通过使用客户端支持最好的协议，将为你节省大量精力。当你的客户端是\
  \ UNIX 或 Linux 系统时，这意味着使用 `LPD`。当它们是 DOS、Windows 或 OS/2 系统时，这意味着使用 `SMB`/`CIFS`。当它们是\
  \ Macintosh 时，AppleTalk 是一个不错的选择，尽管 MacOS X 与 `LPD` 配合得同样良好。\n\n*   竞争协议是否对你需要的特性提供了不同程度的支持？在许多方面，网络打印比文件共享更简单——例如，网络打印中的文件名和权限问题没有文件共享中的问题那么棘手。尽管如此，每个协议都支持自己的选项，例如身份验证程序。你可能希望使用一种不是客户端默认的协议，以获得这些功能之一。\n\
  \n第二个点值得进一步详细说明。`LPD` 像 `NFS` 一样使用“信任主机”（trusted hosts）安全模型，在该模型中，服务器依赖客户端来控制对共享资源的访问。服务器主要根据客户端的\
  \ `IP` 地址来限制访问。这种方法在处理多用户客户端操作系统时非常方便，但它不如需要用户名和密码访问服务器的方法安全。`SMB`/`CIFS` 特别是这样工作的，所以如果你倾向于访问打印机需要密码，你可能会青睐它。（但如果你的客户端是\
  \ Linux 或 UNIX 计算机，你最终会将打印机密码存储在某些全局可读配置文件，除非你从头编写新的打印脚本。结果可能比信任主机安全并没有改进。）`CUPS`\
  \ 喜用的互联网打印协议 (`IPP`) 也支持使用用户名和密码，但此功能在 `CUPS` 中是可选的。\n\n如果你的客户端是 Windows 计算机，很可能你想使用\
  \ `SMB`/`CIFS` 进行打印共享，尽管这些系统也有 `LPD` 客户端可用。如果你只有几台 Windows 设备，可以考虑放弃 `SMB`/`CIFS`\
  \ 以及 `Samba` 配置的复杂性。\n\n一个相关的问题是何时使用 `Linux` 作为打印服务器。你可以在其他类 UNIX 操作系统上运行大多数 Linux\
  \ 打印服务器，因此当你在使用 `BSD` 协议的 `Linux` 和另一个类 UNIX 操作系统之间做出选择时，这是一个方便性的问题。如果你需要与 Linux、Windows、MacOS\
  \ 和其他操作系统共享打印机，Linux 是一个极佳的统一平台。\n\n在许多情况下，另一种选择是使用专用的打印机共享盒。这些设备是专用的网络设备，带有以太网接口、固件内置服务器协议，以及用于连接一个或多个打印机的并行、RS-32\
  \ 串口或 USB 端口。如果你不想在普通计算机上配置打印机共享——例如因为计算机不会一直开启，或者你担心在任何计算机上运行服务器的安全性问题——它们是非常好的选择。一些高端打印机带有网络连接器，其功能类似于专用打印服务器。\n\
  \n### 提示\n\n![提示](img/tip.gif)\n\n你可以使用 Linux 将旧电脑转换为专用的打印服务器。安装 Linux，剥离不必要的工具和服务器，即使是一台旧的\
  \ 386 也能成为合格的打印服务器。有了足够快的 CPU，打印服务器可以使用 Ghostscript 处理 PostScript 文件，将专用计算机和廉价非\
  \ PostScript 打印机的组合转换为网络 PostScript 打印机。特别是添加额外的并行端口或使用 USB 设备，单台 Linux 计算机就可以为几台打印机服务。当然，性能更强大的计算机可以作为打印服务器并执行其他服务器或非服务器任务。\n\
  \n# Linux LPD 服务器选项\n\nUNIX 系统特别是 Linux 系统，通常支持大量的打印包，其中大多数实现了 `LPD` 协议。在 2001 年，Linux\
  \ 最受欢迎的三个打印包是：\n\n\n\n\n\n# 原始的 `BSD LPD` 服务器。\n\n该软件包长期以来一直是 Linux 的标准，许多 Linux\
  \ 程序都假设已安装了 `BSD LPD` 工具。由于这个原因，`LPRng` 和 `CUPS` 均模拟了 `BSD LPD` 工具，尽管它们的模拟的程度有所不同。`BSD\
  \ LPD` 的访问控制机制非常简单，这也是许多发行版开始弃用它的原因之一。\n\n# `LPRng` 软件包。\n\n该系统总部位于 [`www.astart.com/lprng/LPRng.html`](http://www.astart.com/lprng/LPRng.html)，被设计为几乎是\
  \ `BSD LPD` 系统的直接替代品。它在某些配置文件格式上偏离了 `BSD LPD` 系统，但在其他配置文件中保留了 `BSD LPD` 格式。它没有改变基本的打印模型，该模型要求应用程序了解其打印目标打印机的某些信息（在\
  \ Linux 中，大多数应用程序都假设打印机是 PostScript 模型）。\n\n## 通用 UNIX 打印系统 (`CUPS`)\n\n该系统的主页为\
  \ [`www.cups.org`](http://www.cups.org)，与 `LPRng` 相比，它对 `BSD LPD` 系统的偏离更为彻底。与 `LPRng`\
  \ 一，`CUPS` 为一些常用工具提供了类似的命令，但 `CUPS` 使用的是完全不同的打印机配置文件。`CUPS` 还会为其驱动的打印机向应用程序提供信息。（要在网络上使用此功能，客户端和服务器都必须运行\
  \ `CUPS`。）除了 `LPD` 协议外，`CUPS` 还支持较新的网络打印协议 `IPP`。\n\n### 注意\n![NOTE](img/note.gif)\n\
  \n在其他 UNIX 类操作系统中常见的常见的打印系统。例如，源自 SysV 的 UNIX 版本通常使用不同的系统。SysV 打印系统可以与 `BSD` 系统互操作，但它使用不同的命令，例如使用\
  \ `lp` 而不是 `lpr` 来提交打印作业。\n\n表 9.1 详细介绍了几个流行的 Linux 发行版自带的打印系统。当然，即使某个发行版没有自带某个打印系统，你也可以在该发行版上安装它，但你可能需要在配置软件上花费额外的精力。让软件自动启动可能是一项特别挑战，如第\
  \ 4 章启动服务器所述。\n\n### 注意\n![NOTE](img/note.gif)\n\n表 9.1 中，“标准”与“替代”打印系统之间的区别有时非常小。例如，Mandrake\
  \ 在安装时提供使用 `LPRng` 或 `CUPS` 的选项。默认选择是 `LPRng`，但只需点击一下鼠标即可更改为 `CUPS`。Debian 默认不安装任何打印系统，因此将\
  \ `BSD LPD` 列为标准完全是任意的。\n\n**表 9.1.多个 Linux 发行版的标准打印软件**\n\n| **发行版** | **标准打印系统**\
  \ | **备用打印系统** |\n| --- | --- | --- |\n| Caldera OpenLinux Server 3.1 | CUPS | 无\
  \ |\n| Debian GNU/Linux 2.2 | BSD LPD | LPRng, CUPS |\n| Linux Mandrake 8.1 | LPRng\
  \ | CUPS |\n| Red Hat Linux 7.2 | LPRng | 无 |\n| Slackware Linux 8.0 | BSD LPD |\
  \ 无 |\n| SuSE Linux 7.3 | BSD LPD | CUPS |\n| TurboLinux 7.0 | LPRng | 无 |\n\n大多数\
  \ Linux 文档都是针对 `BSD LPD` 系统编写的。这些文档大部分松松地适用于 `CUPS`，因为两者在限制访问的细节上有所不同。\n\n# 配置 `BSD\
  \ LPD` 服务器\n\n配置 `BSD LPD` 服务器最重要的两个文件是：`/etc/hosts.lpd` 和 `/etc/printcap`。第一个文件控制哪些客户端可以连接服务器。第二个文件定义了可用打印机。注意，`/etc/printcap`\
  \ 定义了本地和远程打印机。因此，远程用户可能会向对应远程系统的队列提交打印作业。当发生这种情况时，打印作业通过网络进入并立即发送出去。通常情况下，这会浪费带宽，但在某些情况下可能是理想的。\n\
  \n默认情况下，`BSD LPD` 系统不接受并非来自本地计算机的打印作业——也就是说软件不作为网络服务器运行。更改此配置需要编辑单个文件：`/etc/hosts.lpd`。该文件包含计算机列表，每行一个，允许访问本地队列。计算机可以通过主机名、IP\
  \ 地址或 `NIS` 网组指定。在最后一种的情况下，网组名称通过开头的 @ 符号（`@`）识别，而该符号前面必须紧跟一个加号（`+`）。单用一个加号会让服务器接受*任何*打印作业，这可能是一个重大的安全漏洞。在名称前加减号（`-`）表示该主机被显式禁止访问。例如，列表\
  \ 9.1 显示了一个功能完全的 `/etc/hosts.lpd` 文件。在 `gingko` 的情况下，假设使用服务器自身的域名。`+@group1` 行允许访问名为\
  \ `group1` 的 `NIS` 网组中的所有计算机，但即使 `oak.threeroomco.com` 是 `group1` 网组的一部分，它也被拒绝访问。\n\
  \n虽然你可以通过以井号（`#`）开头注释行在 `/etc/hosts.lpd` 文件中放置注释，但你不*应该*在包含客户端规范的行上放置注释。相反，你应该将注释放置在你想要解释的行之前或之后。\n\
  \n**示例 9.1. 示例 `/etc/hosts.lpd`**\n\n```\n\n gingko\n birch.threeroomco.com\n192.168.1.7\n\
  +@group1\n-oak.threeroomco.com\n```\n\n### 警告\n\n\n\n\n\n![WARNING](img/warning.gif)\n\
  \n你可以像使用 `/etc/hosts.lpd` 一样使用 `/etc/hosts.equiv`。然而，`/etc/hosts.equiv` 文件的影响远超打印；它提供了对使用\
  \ `rlogin` 其他协议客户端的访问。我强烈建议不要使用 `/etc/hosts.equiv`；你可以单独配置它控制的服务器，从而实现对计算机访问的更精细粒度控制。你可能需要查找此文件，如果存在，请重命名它并相应地调整其他文件的配置。\n\
  \n## 在 BSD LPD 客户端上指定服务器\n\n`/etc/printcap` 文件控制 BSD LPD 打印系统的打印机定义（`printcap` 代表\
  \ *`printer-capabilities`*）。该文件包含系统上每个打印队列的条目，无论它是本地队列（即打印到通过并行端口、RS-232 串口或 USB\
  \ 端口连接到计算机的打印机），还是网络队列（打印到另一个 LPD 打印机，甚至是一个使用 SMB/CIFS、AppleTalk 或其他协议的打印机）。理论上，每个打印机定义占用一行，选项之间用冒号（`:`）隔开。实践中，大多数\
  \ `/etc/printcap` 定义使用反斜杠（`\\`）行换行符，允许单个条目跨多行，以便于阅读——除了最后一行外，每行都以反斜杠结束，表示其在下一行继续。\n\
  \n通过 `/etc/printcap` 配置打印机的大多数细节超出了本书的范围；正如本章开头提到的，你应该查阅你所在发行版的文档或关于 Linux 系统管理的入门书籍，来学习如何配置打印机，包括智能过滤器、Ghostscript\
  \ 以及大多数 `/etc/printcap` 选项。然而，有几个选项从配置网络打印客户端的角度来看是需要说明的。这些选项是：\n\n*   `lp`—`lp`\
  \ 选项将 BSD LPD 系统指向打印机所在的设备文件。例如，`lp=/dev/lp0` 告诉系统使用 `/dev/lp0`（第一个并行端口）。如果你正在配置\
  \ LPD 风格的网络打印机，理应省略此选项，或将其留空（如 `lp=`）。\n*   `rm`—`rm` 选项指定 LPD 风格打印服务器的名称。例如，如果\
  \ `oak` 是给定队列的打印服务器，则会在队列定义中包含选项 `rm=oak`。注意，这不足以打印到特定的远程队列；它仅标识了队列所处的*计算机*。你可以将远程机器指定为主机名（带或不带域名）或\
  \ `IP` 地址。\n*   `rp`—`rp` 选项接在 `rm` 选项的后面，指定远程打印队列的名称。例如，如果远程队列在打印服务器上名为 `inkjet`，则会在客户端的\
  \ `/etc/printcap` 中包含 `rp=inkjet`。注意，远程队列的名称与本地队列的名称不需要相似之处。例如，服务器上的 `inkjet` 打印机在客户端上可能被称为\
  \ `lp1` 或 `canon`。但在特别大型网络中，你可能希望保持名称同步以避免混淆。\n\n总之，如果你有一个现有的本地打印队列，可以通过将 `lp` 选项替换为\
  \ `rm` 选项和 `rp` 选项将其转换为网络打印队列。一旦完成，计算机将其打印作业发送到由 `rm` 指定的计算机和 `rp` 指定的队列，而不是连接到\
  \ `lp` 指向的设备的打印机。在服务器上，该队列可能会包含 `lp` 规范，尽管它*可能*包含 `rm` 和 `rp` 规范——在这种情况下，在最终打印客户端中更直接指定最终目标通常更简单。（异常情况包括你想将\
  \ Ghostscript 处理卸载到中间系统，或者网络拓扑阻止了客户端与服务器之间的直接连接，但中间系统可以连接到两者的情况。）\n\n如果打印服务器不接受\
  \ LPD 连接，你将需要更复杂的安排。例如，服务器可能期望 SMB/CIFS 或 AppleTalk 打印作业。在这种情况下，你需要编写脚本使用任何合适的工具处理打印作业，并使用\
  \ `if` 选项调用该脚本，该选项设置了输入过滤器。Samba 和 Netatalk 的文档都包含此类操作示例。\n\n# 配置 LPRng 服务器\n\n\
  作为 BSD LPD 的预期替代品，LPRng 从用户角度来看工作方式非常相似。事实上，LPRng 甚至使用的 `/etc/printcap` 文件与 BSD\
  \ LPD 系统中的同名文件非常相似。然而，LPRng 作为服务器运行的访问控制系统非常不同。LPRng 不是使用 `/etc/hosts.equiv` 中简单的允许客户端列表，而是支持一种更安全的系统，通过\
  \ `/etc/lpd.perms` 控制。\n\n## 配置 `/etc/lpd.perms`\n\n`/etc/lpd.perms` 文件控制整个打印系统的访问。各个队列的溢出目录中也可能存储\
  \ `lpd.perms` 文件（通常为 `/var/spool/lpd/queuname`）。如果存在，这些文件提供对单个队列的控制——`/etc/lpd.perms`\
  \ 设置全局选项。\n\n无论位置如何，`lpd.perms` 包含五类行。第一类是注释行，以井（`#`）开头。与 `/etc/hosts.lpd` 不同，你可以在主命令之后之后添加注释。这些命令有四种形式：\n\
  \n```\nDEFAULT ACCEPT\nDEFAULT REJECT\nACCEPT [ key = value[,value]* ]*\nREJECT\
  \ [ key = value[,value]* ]*\n```\n\n前两种形式设置系统的默认策略——接受或拒绝连接。大多数随 Linux 发行版提供的 LPRng\
  \ 包在 `/etc/lpd.perms` 中包含一个 `DEFAULT ACCEPT` 行，因此这些包默认情况下比 LPD 包要宽松得多，LPD 包通常只接受来自本地地址（127.0.0.1，软件运行的计算机）的连接。出于这个原因，使用\
  \ `ACCEPT` 和 `REJECT` 选项来收紧连接限制是非常重要的。\n\n\n\n\n\n`ACCEPT` 和 `REJECT` 选项设置了服务器将接受或拒绝的特定类型访问。你通常在这些选项之后跟上表\
  \ 9.2 中 `Key` 列的任一个键，并将其设置为该表中从 `Connect` 到 `lpc` 列所定义的值。`Connect` 列定义了基本的连接能力。`Job\
  \ Spool` 和 `Job Print` 列分别定义了将作业发送到打印队列并导致其打印的能力。`lpq`、`lprm` 和 `lpc` 列定义了执行通常由这些名称的打印实用程序控制的任务的能力。在大多数情况下，赋予对其中一个特性的访问权限就赋予了对所有功能的访问权限——至少是对所有所有功能的访问权限。某些功能对于某些键来说是没有意义的，或者不需要显式参数，如表\
  \ 9.2 中““-”条目所示。你可以通过在值前面加上 `NOT` 来反转其含义。`IP` 地址后面可以跟一个斜杠（`/`）和一个网络掩码，以应用于整个网络。\n\
  \n**表 9.2. `lpd.perms` 的键及关联值类型**\n\n| **Key** | **Connect** | **Job Spool** | **Job\
  \ Print** | `lpq` | `lprm` | `lpc` |\n| --- | --- | --- | --- | --- | --- | ---\
  \ |\n| `SERVICE` | `X` | `R` | `P` | `Q` | `M` | `C` 表示控制或 `S` 表示状态 |\n| `USER`\
  \ | - | 用户名 | 用户名 | 用户名 | 用户名 | 用户名 |\n| `HOST` | 远程主机 | 主机名 | 主机名 | 主机名 | 主机名 |\
  \ 主机名 |\n| `GROUP` | - | 用户名 | 用户名 | 用户名 | 用户名 | 用户名 |\n| `IP` | 远程 IP 地址 | 主机 IP\
  \ 地址 | 主机 IP 地址 | 远程 IP 地址 | 主机 IP 地址 | 主机 IP 地址 |\n| `PORT` | 端口号 | 端口号 | - | 端口号\
  \ | 端口号 | 端口号 |\n| `REMOTEUSER` | - | 用户名 | 用户名 | 用户名 | 用户名 | 用户名 |\n| `REMOTEHOST`\
  \ | 远程主机 | 远程主机 | 主机主机 | 远程主机 | 远程主机 | 远程主机 |\n| `REMOTEGROUP` | - | 用户名 | 用户名 |\
  \ 用户名 | 用户名 | 用户名 |\n| `REMOTEIP` | 远程 IP 地址 | 远程 IP 地址 | 主机 IP 地址 | 远程 IP 地址 |\
  \ 远程 IP 地址 | 主机 IP 地址 |\n| `CONTROLLINE` | - | 模式匹配 | 模式匹配 | 模式匹配 | 模式匹配 | 模式匹配\
  \ |\n| `PRINTER` | - | 打印机名称 | 打印机名称 | 打印机名称 | 打印机名称 | 打印机名称 |\n| `FORWARD` | -\
  \ | - | - | - | - | - |\n| `SAMEHOST` | - | - | - | - | - | - |\n| `SAMEUSER` |\
  \ - | - | - | - | - | - |\n| `SERVER` | - | - | - | - | - | - |\n\n控制访问的选项似乎相当复杂，因此查看一些示例可能会有所帮助。首先，考虑大多数标准\
  \ `/etc/lpd.perms` 文件中的几行：\n\n```\nACCEPT SERVICE=M SAMEHOST SAMEUSER\nACCEPT SERVICE=M\
  \ SERVER REMOTEUSER=root\nREJECT SERVICE=M\n```\n\n这三行指定了谁可以使用 `lprm` 实用程序来删除作业。这三行都包含\
  \ `SERVICE=M` 选项，这表示它们适用于 `lprm` 函数，如表 9.2 中的 `SERVICE` 行所示。第一行包含了 `SAMEHOST` 和\
  \ `SAMEUSER` 选项，这意味着如果命令来自提交作业的同一台计算机，并且来自该作业的所有者，则该命令将被接受。第二行包含了 `SERVER` 和 `REMOTEUSER=root`\
  \ 选项，告诉系统允许服务器系统上的 `root` 删除作业。最后一行拒绝所有对 `lprm` 服务的其他请求。（LPRng 会遍历其控制文件直到找到与传入命令匹配的选项；只要两条\
  \ `ACCEPT SERVICE=M` 行在 `REJECT SERVICE=M` 行之前，`ACCEPT` 行对于它们所匹配的命令具有优先权。）\n\n如前所述，许多发行版的默认\
  \ LPRng 配置是接受来自任何地方的连接。这是一个潜在的危险配置，因为外部人员可能会提交浪费你的纸张、墨水和碳粉的作业，并填充你的打印分区，如果 LPRng\
  \ 存在漏洞，可能会危害你的系统。因此，限制对 LPRng 的访问通常是一个好主意。你可以像第 25 章讨论的那样使用包过滤器。我建议这样做，但也建议在 LPRng\
  \ 中实现冗余保护。假设你有一个打印服务器，它应该接受来自 172.0.0/16 网络和服务器自身的作业，但不接受来自其他地址的作业。你可以通过以下两行代码来实现：\n\
  \n```\nACCEPT SERVICE=X SERVER\nREJECT SERVICE=X NOT REMOTEIP=172.0.0/16\n```\n\n\
  这些限制了对服务器的访问，从而限制了提交作业或任何其他操作。第一行显式允许来自服务器的连接。（这些通过 127.0.0.1 接口来，因此使用 `REMOTEIP=127.0.0.1`\
  \ 代替 `SERVER` 效果相同。）如果没有这一行，下一行将阻止访问服务器，这可能不是你想要的。第二行拒绝所有来自 172.0.0/16 网络未接受的请求。如果你希望接受来自多个子网的作业，可以在\
  \ `REJECT` 行之前包含一个接受额外子网的 `ACCEPT` 行。最好将这些操作 `X` 的行放在操作其他服务的行之前，除非其他行是以限制方式编写的；将更特定的行放在前面可能会无意中允许你可能不希望的连接类型。\n\
  \n## 在 LPRng 客户端上指定服务器\n\nLPRng 使用 `/etc/printcap` 文件，其与 `BSD` `LPD` 使用的文件非常相似。特别是之前在在\
  \ BSD LPD 服务器上指定服务器节中描述的 `lp`、`rm` 和 `rp` 选项适用于 `BSD` `LPD` 和 LPRng。大多数其他选项也适用于两个系统，尽管存在一些差异。不过，这些不在本章范围内。\n\
  \n`BSD` `LPD` 和 LPRng 使用相同的 `LPD` 协议进行网络打印，因此你可以配置 LPRng 客户端打印到 `BSD` `LPD` 服务器，反之亦然。这种互操作性也扩展到\
  \ `CUPS`，尽管 `CUPS` 也支持仅在两个 `CUPS` 系统互操作时才有扩展协议。\n\n\n\n\n\n`CUPS` 是一个用于 UNIX 和 Linux\
  \ 计算机极其灵活的打印系统。它并不是 `BSD` `LPD` 软件包的重新实现（LPRng 正是那样），`CUPS` 是一个围绕 Linux 打印工作构建的新型框架。该框架的一部分是一个兼容层，使得应用程序和用户可以使用熟悉的打印命令，并且\
  \ `CUPS` 客户端可以使用 `LPD` 打印服务器，反之亦然。主要的附加功能包括：支持一种新的网络打印协议 `IPP`，该协议基于 Web 服务器和浏览器使用的超文本传输协议（`HTTP`）；能够随文件传递文件类型信息，以简化打印服务器上打印过滤的选择；使用\
  \ PostScript 打印机描述（`PPD`）文件定义打印机功能；以及“打印机浏览”功能，该功能允许客户端在网络上搜索打印机，而无需显式地配置客户端使用特定的打印机。如果\
  \ `CUPS` 被广泛采用，这些功能将极地简化非网络和网络环境下打印机的配置。\n\n`CUPS` 面临的一个主要障碍是它没有使用与 `BSD` `LPD`\
  \ 或 LPRng 相同的配置文件。因此，如果你已经熟悉这些系统，将必须学习以完全全新的方式来配置打印机。如果你喜欢使用 `GUI` 工具，可能想要查找一个 `CUPS`\
  \ 的 `GUI` 前端进行常规配置，例如 KUPS ([http://cups.sourceforge.net/kups/]) 或 ESP Print Pro\
  \ ([http://www.easysw.com/printpro/])。`CUPS` 还带有一个基于 Web 的工具，如后文介绍的；你可以将 Web 浏览器指向\
  \ `http://localhost:631` 来配置运行该 浏览器的计算机。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n\
  与其他打印系统一样，`CUPS` 打印机配置的完整描述超出了本书的范围。本节假设你可以创建一个具有最基本功能的本地打印队列；我仅描述与打印机定义网络方面相关的选项。有关基础\
  \ `CUPS` 配置的更多信息，请参阅 [`www.cups.org/sam.html`](http://www.cups.org/sam.html) 上的\
  \ `CUPS` 文档。\n\n## 配置 `/etc/cups/cupsd.conf`\n\n`CUPS` 服务器通过 `/etc/cups/cupsd.conf`\
  \ 文件控制。该文件模仿了 Apache 配置文件（在第 20 章 运行 Web 服务器中讨论过），因为 `CUPS` 借用了许多 `HTTP` 服务器功能。`CUPS`\
  \ 还使用其他几个配置文件，例如 `/etc/cups/printers.conf` 和 `/etc/cups/classes.conf`，它们分别定义特定的打印机和打印机组。这两个文件通常通过\
  \ `lpadmin` 配置工具或 `GUI` 前端进行编辑，但 `CUPS` 文档建议手动编辑 `cupsd.conf`。\n\n`cupsd.conf` 文件由一系列指令组成，用于设置服务器功能的特定特性，例如服务器名称或日志存储位置。对于网络打印服务器功能特别重要的指令包括：\n\
  \n* `Allow` — 该指令后紧跟关键字 `from` 以及通配符 `All` 或 `None`、主机主机名、带星号通配符的主机主机名（例如 *.threeroomco.com）、部分或完整的\
  \ `IP` 地址，或带有子网掩码的 `IP` 地址（采用 `CIDR` 或 8 字节格式）。这些形式中的任何一种都指定了允许访问服务器的计算机。你可以包含多个\
  \ `Allow` 指令以向多个计算机或计算机组授予访问。此指令必须出现在 `Location` 指令中。\n\n* `AuthClass` — 该指令接受值\
  \ `Anonymous`（默认值）、`User`、`System` 或 `Group`。`Anonymous` 意味着不需要对客户端进行身份验证；这种工作非常类似于\
  \ `BSD` `LPD` 系统。（注：原文此处存在大量重复，翻译已去重）。\n\n* `BrowseAddress` — `CUPS` 打印功能在有一个中央服务器收集网络信息时效果最佳。你可以通过\
  \ `BrowseAddress` 指令设置此服务器，该指令接收 `IP` 地址或主机名以及端口号，例如 `92.168.23.34:631`。（631 是此类和其他\
  \ `CUPS` 连接的常用端口）。默认值为 `255.255.255.255:631`，结果向所有计算机广播。\n\n* `BrowseAllow` — 为了使用打印机浏览，你的服务器必须接受来自客户端的包。此指令后紧跟关键字\
  \ `from` 以及服务器接受浏览包的部分或完整主机名或 `IP` 地址。默认是接受所有计算机的浏览包。\n\n* `BrowseDeny` — 该指令是 `BrowseAllow`\
  \ 的相反；你可以使用此指令禁用某些网络或客户端。\n\n* `BrowseOrder` — 当同时使用 `BrowseAllow` 和 `BrowseDeny`\
  \ 时，此指令决定前两个指令的应用顺序。选项有 `BrowseOrder Allow,Deny` 和 `BrowseOrder Deny,Allow`。\n\n\
  * `BrowseInterval` — 该指令设置输出查询之间的秒数。值为 `0` 则禁用输出查询。此值应始终小于 `BrowseTimeout` 的值，否则打印机将定期从你的列表中消失。\n\
  \n* `BrowsePoll` — 你可以使用此指令设置想要轮询打印机的打印服务器名称或 `IP` 地址。通过多次使用此值可以轮询多个服务器。\n\n* `BrowsePort`\
  \ — 打印浏览的默认端口是 631，但你可以通过此指令覆盖此值。\n\n* `BrowseTimeout` — `CUPS` 根据此指令确定的间隔移除网络打印机和类的信息。此值应始终大于\
  \ `BrowseInterval` 的值，否则打印机将定期从 `CUPS` 客户端的浏览列表中消失。\n\n* `Browsing` — 你可以通过将此指令设置为\
  \ `On` 或 `Off` 来启用或禁用网络浏览。默认值为 `On`。\n\n\n\n\n\n- `Deny`：此指令是 `Allow` 的相反；它指定了不允许访问服务器的计算机。它必须出现在\
  \ `Location` 指令内部。\n\n- `HostNameLookups` — 此指令接受的值为 `Off`、`On` 和 `Double`。这些值分别导致\
  \ `CUPS` 不查找客户端的主机名、为每个连接的客户端查找主机名，以及先查找主机名再从获取的主机名查找 `IP` 地址。特别是 `Double` 选项提供了针对某些类型攻击的保护，因为它防止了来自\
  \ `DNS` 条目配置错误的系统的连接。默认值为 `Off`，因为该设置导致的性能开销最小，且最可靠（如果你的网络 `DNS` 服务器宕机或变慢，其他选项可能会导致问题）。\n\
  \n- `Listen` — 你可以通过使用一个或多个 `Listen` 指令告诉 `CUPS` 仅使用计算机网络接口的一个集。在指令名称后紧跟与网络接口相关的\
  \ `IP` 地址、冒号和端口号（通常为 631）。例如，`Listen 192.168.23.8:631` 会导致计算机使用与 `192.168.23.8`\
  \ 地址关联的接口。你可以使用多个 `Listen` 指令（并且可能应该这样做，以便绑定到 `127.0.0.1` 接口以及你想要激活的网络接口）。\n\n-\
  \ `Location` — 此指令的特殊之处在于它包裹了其他指令，定义了 `CUPS` 文档树中的一个位置，被包裹的指令适用于该位置。例如，你必须在 `Location`\
  \ 指令包含 `Allow` 和 `Deny` 指令，以限制特定客户端对特定文档类型（以及特定类型的操作）的访问。要开始一个 `Location` 指令，你在角括号\
  \ (`<>`) 中包含该关键字以及位置名称。要结束此类指令，使用字符串 `</Location>`。你可以限制的可能包括用于管理操作的 `/admin`、用于打印机类的\
  \ `/classes`、用于打印作业的 `/jobs` 以及用于打印机的 `/printers`。\n\n- `MaxClients` — 你可以使用此指令限制连接到服务器的客户端数量。默认值为\
  \ `100`。\n\n- `Order` — 此指令与 `BrowseOrder` 指令类似，但适用于 `Allow` 和 `Deny` 指令。`Order\
  \ Allow,Deny` 导致 `Allow` 指令在 `Deny` 指令之前应用，而 `Order Deny,Allow` 则相反。\n\n- `Port`\
  \ — `CUPS` 通常在端口 631 上监听用于 `IPP` 传输，但你可以通过此指令更改默认端口。你可以通过多次使用此指令来指定多个端口。注意，这*并不会*影响\
  \ `CUPS` 用于与 `BSD` `LPD` 客户端服务器或兼容程序交互的端口。\n\n大多数 `CUPS` 软件包提供的默认 `/etc/cups/cupsd.conf`\
  \ 文件让服务器对外部访问相当开放。你可能应该通过应用 `CUPS` 配置规则来限制对服务器的访问，从而收紧访问。例如，以下指令阻止了除服务器本身和 `172.22.0.0/16`\
  \ 网络上的系统以外的所有访问：\n\n```\n<Location /printers>\nBrowseAllow from 127.0.0.1\nBrowseAllow\
  \ from 172.22.0.0/16\nAllow from 127.0.0.1\nAllow from 172.22.0.0/16\n</Location>\n\
  ```\n\n由于它适用于 `/printers` 位置，上述示例并没有完全关闭对服务器的访问。例如，管理任务（通过 `/admin` 位置）和对特定打印作业信息的访问（通过\
  \ `/jobs` 位置）对其他系统仍然可用。你可能应该限制对这些位置的访问，并应用数据包过滤防火墙规则（如第 25 章 中讨论的）。在假设没有错误或配置错误的情况下，后者将完全阻止对未经授权系统的访问。\n\
  \n## 接受来自 BSD LPD 或 LPRng 客户端的任务\n\n之前对 `/etc/cups/cupsd.conf` 指令的讨论直接适用于支持 `IPP`\
  \ 的客户端。但 `BSD` `LPD` 和 LPRng 都不使用 `IPP`；它们使用较旧的 `LPD` 协议（正在为 LPRng 添加 `IPP` 支持）。因此，如果你的\
  \ `CUPS` 服务器必须接受来自使用 `LPD` 协议的客户端的打印作业，`CUPS` 需要一个辅助程序来完成这项工作。该程序被称为 `cups-lpd`，它随\
  \ `CUPS` 一起提供。要使用 `cups-lpd`，你必须配置它通过 `inetd` 或 `xinetd` 等超服务器工作，如第 4 章 中讨论的；该包不能作为独立服务器运行。它通常位于\
  \ `/usr/lib/cups/daemon`。适当 `/etc/inetd.conf` 条目如下：\n\n```\nprinter stream nowait\
  \ lp /usr/lib/cups/daemon/cups-lpd\n```\n\n第 4 章 涵盖了 `inetd` 和 `xinetd` 之间的差异，如果你需要配置\
  \ `cups-lpd` 与 `xinetd` 工作。某些发行版预配置了可以与 `BSD` `LPD` 客户端正常工作，因此你可能不需要进行此类修改。\n\n\
  ### 警告\n\n![警告](img/warning.gif)\n\n`CUPS` 无法控制使用 `LPD` 协议的客户端对打印机的访问。此类作业是在本地使用服务器地址提交的，因此标准的\
  \ `/etc/cups/cupsd.conf` 指令无效。要限制对支持 `LPD` 协议的 `CUPS` 服务器的外部访问，你必须使用数据包过滤防火墙或其他机制。\n\
  \n## 在 CUPS 客户端指定服务器\n\n你可以通过使用命令行 `lpadmin` 工具、使用 `lpadmin` 的 `GUI` 前端，或者在运行的 Web\
  \ 浏览器中输入 http://localhost:631（或在允许管理访问的另一台计算机上输入主机名和 `:631`）为 `CUPS` 添加打印机。这些管理方法允许你向计算机添加或删除打印机，或执行或其他管理任务。\n\
  \n要添加网络打印机，你可以使用 `lpadmin` 输入类似下面的命令：\n\n```\n# lpadmin -p PrinterName -E -v lpd://server.name/queuname\
  \ -m ppdfile.ppd\n```\n\n\n\n\n在此示例中，`PrinterName` 是要本地使用的打印机队列名称，`server.name`\
  \ 是打印服务器的主机名，而 `queuename` 是该服务器上打印队列的名称。此示例显示了如何访问使用 BSD LPD 协议的打印队列，如服务器和队列名称前的\
  \ `lpd` 所示。若要使用另一个 CUPS 服务器，你可能倾向于使用 `ipp` 代替 `lpd`。这告诉 CUPS 使用 `IPP` 而不是 BSD LPD\
  \ 协议。（你可以以非常相似的方式创建本地队列，但 `-v` 的参数将是 `parallel:/dev/lp0` 或其他本地设备标识符。）最后，`-m` 参数用于标识打印机的\
  \ PPD 文件，以便 CUPS 能够将有关打印机功能的信息传回给感知 CUPS 的应用程序。在大多数安装中，你可以在 `/usr/share/cups/model`\
  \ 目录树找到一组 PPD 文件。许多 PostScript 打印机也附带了自己的 PPD 文件，你可以直接使用。你还可以尝试使用 Linux 打印网站上的驱动程序列表，[`www.linuxprinting.org/driver_list.cgi`](http://www.linuxprinting.org/driver_list.cgi)。点击\
  \ Ghostscript 驱动程序名称，然后在 CUPS-O-Matic 区域选择你的打印机模型并点击 Generate CUPS PPD。稍等后，结果应该是一个描述你打印机功能的\
  \ PPD 文件。然而，正如生成文件中的注释所示，这种机器生成的 PPD 文件可能存在缺陷，甚至可能无法工作。因此，如果可能，你最好使用打印机制造商提供的 PPD\
  \ 文件。\n\n### 提示\n\n![TIP](img/note.gif)\n\n如果你已经如前所述配置了客户端和服务器执行 CUPS 浏览，那么你不需要显式地添加\
  \ CUPS IPP 打印机；客户端应该自动检索可用打印机列表并使其变得可用。手动添加打印机对于 LPD 打印队列最为有用。\n\n如果你想修改现有的打印队列，可以使用\
  \ `lpadmin` 工具进行操作，就像添加新队列一样。指定原始名称以及你包含的任何其他选项将覆盖原始设置。例如，你可以通过 `-v` 选项并指定新位置，将本地队列更改为网络队列。\n\
  \n如果你更喜欢使用 GUI 工具，标准安装默认支持 Web 界面（见图 9.1）。当你输入计算机的 `URL`（包括端口 631 指定）后，CUPS 会提示你输入管理员用户名和密码。然后你可以从几个选项中选择，例如“执行管理任务”和“管理打印机”。图\
  \ 9.1 显示了后者，在其中你可以创建、删除和管理打印机。图 9.1 显示了两个已定义的打印机。第一个 `hp4000` 是默认打印机，是一个 LPD 打印机。第二个\
  \ `lexmark` 连接到并行端口。你可以点击 Modify Printer（修改打印机）来修改基本设置（如服务器名称），或者通过点击 Configure\
  \ Printer（配置打印机）来调整打印机特定设置（如页面大小和打印机内存）。\n\n![基于 Web 的 CUPS 界面简化了本地和网络打印机的配置。](img/09fig01.jpg)\n\
  \n**图 9.1. 基于 Web 的 CUPS 界面简化了本地和网络打印机的配置。**\n\n## 总结\n\n历史上，Linux 系统一直使用 BSD LPD\
  \ 系统，但该系统已经显得过时。该系统有多种替代方案，Linux 发行版越来越多地使用它们——通常是 LPRng 或 CUPS。这些替代方案提供了访问控制等功能。特别是\
  \ CUPS，提供了改进的交互交互能力以及基于 Web 的配置工具。\n\n对于任何作为打印服务器的计算机，安全性都应该是考虑的问题。理想情况下，你应该使用包过滤防火墙规则阻止授权主机以外的主机访问端口\
  \ 515 和 631（分别为 LPD 和 IPP 端口），并使用每个打印工具特定的访问控制功能作为冗余措施。LPRng 对 LPD 打印机制提供了最好的控制，而\
  \ CUPS 对 IPP 工具提供了良好的控制。\n\n\n\n\n运行时间服务器的主要原因之一是向网络上的客户端提供准确的时间设置。通过让客户端将时钟设置为由你系统中的一个系统维护的时间，你可以让你所有计算机的时钟保持在合理的一致值上。（取决于所使用的协议，“合理一致”可能意味着仅几毫秒的偏差。）这可以避免由时间不匹配引起的问题。例如，在时钟不匹配的情况下，客户端可能会将文件保存到服务器，但在一分钟后回读该文件时会感到困惑，因为保存日期可能显示为两分钟后的未来。时间不匹配在从日志文件中查找信息时也可能是一个非常头疼的问题。在不同计算机的显示器上看到不同的时间也会令人烦恼。某些工具（如\
  \ Kerberos）依赖于客户端和服务器的时间一致，因此运行带有此类工具的时间服务器是实务上的必须。\n\n本章详尽讨论的时间服务器程序有点特殊，因为它既充当服务器又充当客户端。因此，运行此特定时间服务器的另一个原因是设置运行该服务器的计算机的时钟。在一个包含几台\
  \ Linux 或 UNIX 计算机的网络中，你将设置一台机器从外部服务器获取时间，然后以完全相同的方式配置其余系统，只是将这些系统指向第一台机器以本地获取时间。这种多级配置减少了时间信号最终源的负载，例如连接到原子钟的计算机或可以接收官方时间源广播时间信号的无线电台。如果你不想在客户端上运行完整的服务器包，你可能可以使用仅作为客户端运行的更简单程序来代替，但你可能需要显式地调用它，以保持系统时间设置正确。\n\
  \n# 设置 NTP 服务器\n\n最流行的时间服务器协议之一被称为网络时间协议（NTP），它由 RFC 1305 描述（[`www.ietf.org/rfc/rfc1305.txt`](http://www.ietf.org/rfc/rfc1305.txt)）。之前的版本在\
  \ RFC 958、1059 和 1119 中描述过。当前版本号为 4，尽管在 2002 年版本 3 的 NTP 服务器仍然很常见。主要的 NTP 网站是 [`www.eecis.udel.edu/~ntp/`](http://www.eecis.udel.edu/~ntp/)。NTP\
  \ 允许时间服务器采用分级结构，因此最接近准确时钟的服务器可以为其他服务器服务，而后者为最终客户端服务。Linux 和其他操作系统提供了 NTP 客户端和服务器。在\
  \ Linux 上配置 NTP 需要编辑单个配置文件。你可以使用专用工具监控服务器的运行情况。如果系统是时间服务器层级中的终端，也提供功能有限的客户端供方便使用。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\nNTP 有一种简化变体，被称为简单 NTP（SNTP）。SNTP 客户端可以同步到 NTP\
  \ 服务器。\n\n# 理解时间服务器如何工作\n\n时间服务器的功能始于真实的时间源，例如原子钟或可以与官方时间源同步的无线电或调制解调器接收器。全球定位系统（GPS）接收器通过使用卫星时间信号工作，因此这些可以作为获取此类准确时间源的方法。（NTP\
  \ 网页在 [`www.eecis.udel.edu/~ntp/hardware.html`](http://www.eecis.udel.edu/~ntp/hardware.html)\
  \ 包含了对此类硬件设备的讨论。）\n\n原子钟、无线电硬件或类似设备被称为参考服务器或第 0 层（stratum 0）时间服务器。除非你拥有此类设备，否则你不会直接连接到它，因为它们没有网络连接（它们通常通过\
  \ RS-232 串口接口连接并需要特殊驱动程序）。将时钟同步到参考源的计算机被称为第 1 层（stratum 1）服务器。理论上，这些计算机拥有互联网上最准确的时间，尽管实践中，调查显示大约三分之一的计算机时间偏差一秒或更多。同步到第\
  \ 1 层服务器的系统被称为第 2 层（stratum 2）服务器，以此此类推。\n\n同步涉及在客户端和服务器之间传输多个数据包（通常在大约五分钟内至少传输五个）。客户端向服务器发送一个包含客户端当前时间的数据包。服务器响应一个类似的数据包。通过使用本地时钟比较发送和接收时间，客户端可以估计它与服务器之间的往返网络延迟，从而在调整自己的时间时补偿这些延迟。客户端还可以被配置为使用多个服务器，从而比较这些服务器之间的时间、网络延迟和其他显著因素，以便从这些服务器中选择最佳时间。\n\
  \n在本地，完整的 NTP 服务器持续运行，偶尔向其父服务器进行检查（初始为每 64 秒一次，但此间隔会增加到 1024 秒，在某些配置下可能更高）。NTP 服务器程序可以通过几种方式调整其运行的计算机上的时钟。NTP\
  \ 通常会忽略一段时间的大差异（超过一秒左右的差异），理由是大差异可能是协议错误；但在差异持续一段时间后，NTP 会通过立即重置时间或让系统时钟运行更快或更慢（即调调时钟/slewing）来补偿，直到系统和外部时间同步。小误差通过调调系统时钟来补偿，直到测量值同步。NTP\
  \ 服务器还维护着一个文件，通常是 `/etc/ntp/drift`、`/var/state/ntp.drift` 或类似的文件，其中存储了一个数字，允许服务器即使在失去与低层时间服务器的连接或计算机关机了一段时间后，也能补偿计算机的大部分时钟漂移。\n\
  \n### 提示\n\n![TIP](img/tip.gif)\n\n超过 1000 秒的错误通常会导致 NTP 退出，假设发生了某些严重问题并需要人工干预。因此，在运行\
  \ NTP 服务器之前，你可能需要手动将系统时钟设置为一个至少大致正确的值。或者，你可以使用在接下来的章节“使用 NTP 客户端包”中描述的 `ntpdate`\
  \ 程序在运行 NTP 服务器之前设置时间。某些分发行版会在 NTP 服务器的启动脚本中调用 `ntpdate`。\n\n\n\n通常，小规模网络上的 `NTP`\
  \ 服务器会与大约三个外部时间服务器同步时钟。（三是一个相当任意的数字；你可以根据需要增加或减少它，但三个通常能提供足够的冗余和交叉检查以确保良好运行。）小规模网络的外部时间服务器通常应该是第\
  \ 2 层（stratum 2）服务器；使用第 1 层服务器无法获得多少准确性，而且由于第 1 层服务器非常少，因此第 1 层服务器最好留给拥有数百个客户端的服务器使用。小规模网络上的客户端可以运行\
  \ `NTP` 服务器，从网络的第 3 层 `NTP` 服务器获取近乎持续的更新，或者它们可以使用 `NTP` 客户端或其他时间协议客户端不频繁地更新时钟。如果你的网络有几十台计算机，且持续服务至关重要，你可能考虑运行两个第\
  \ 3 层时间服务器，以减少主时间服务器计算机故障或变得不可靠时出现问题的概率。如果极精确的时间非常重要，你可以获取一个基于 `GPS` 的钟并运行自己的第 1\
  \ 层时间服务器。此类时钟的价格为几百美元。基于 AM 广播时间广播的设备成本较低，但准确性也低得多（它们通常的精度小于一秒，但如果目标是高精度，这可能是不够）。\n\
  \n`NTP` 使用协调世界时 (`UTC`) 作为所有操作的基础。`UTC` 类似于格林威治标准时间 (`GMT`)——即英国格林威治未经过夏令时调整的时间。`UTC`\
  \ 在几个技术细节上与 `GMT` 不同，但主要的关注点在于它的定义更加精确，且是基于高度可靠的原子反应，而不是地球自转（自转会有微小但可测量的变化）。在需要时，`UTC`\
  \ 通过在一天中增加或减少秒（闰秒）来调整地球自转的变化。本地时间通过增加或减少你的时区与 `UTC` 相关，并在必要时进行夏令时调整。Linux 系统在内部使用\
  \ `UTC`，因此从 Linux 的角度来看，`UTC` 是时间协议的良好选择。\n\n大多数 `x86` 操作系统要求主板硬件时钟设置为本地时间而非 `UTC`。出于此原因，Linux\
  \ 支持设置为本地时间或 `UTC` 的主板时钟，并维护一个设置为 `UTC` 的独立软件时钟。在仅运行 Linux 的系统上，`UTC` 是更好的选择，因为夏令时不需要对硬件时钟进行调整。在双启动\
  \ Linux 和 Windows（或其他要求时钟设置为本地时间的操作系统）的系统上，你可能被迫使用本地时间，且两个操作系统都可能尝试进行夏令时调整。在系统启动时使用时间协议有助于缓解这个问题，但\
  \ Linux 在设置系统时钟时不会自动调整硬件时钟，因此在 Linux 下运行 `NTP` 的益处可能不会在另一个操作系统中体现。你可以输入 `hwclock\
  \ --systohc --localtime` 在设置硬件时钟为本地时间的系统中从系统时钟设置硬件时钟。如果计算机存储 `UTC` 时间，则将 `--localtime`\
  \ 替换为 `--utc`。\n\n## Linux 时间服务器程序\n\nLinux 的主要 `NTP` 服务器包被称为 `ntp` 或其变体，例如 `xntp`、`xntp3`\
  \ 或 `xntpd`。名称中的 `x` 代表“实验性”（experimental），尽管这在某种程度上并不准确，因为该软件已经通用了多年。`NTP` 版本 4\
  \ 软件包通常省略了 `x`。大多数 Linux 发行版都自带这些软件包之一——通常是版本 4，尽管在 2002 年某些发行版仍提供版本 3。\n\n大多数发行版包含的\
  \ `NTP` 包包含了主 `NTP` 服务器和几个支持程序，包括：\n\n*   `ntpd`：这是主 `NTP` 服务器程序。（它有时被称为 `xntpd`，特别是对于版本\
  \ 3 的服务器。）如前所述，尽管此程序被称为服务器，但它的功能既作为更高层级服务器的服务器，也作为一个或多个更低层级 `NTP` 服务器的客户端。因此，即使你只想让系统作为其他时间服务器的客户端运行，也可以运行此程序。\n\
  *   `ntpdate`：此程序是一个简单得多的仅客户端包。对于对持续准确时间要求不那么重要的系统，你可以定期在这些系统上调用它，正如接下来的节所述的。\n\
  *   `ntptrace`：偶尔你可能想知道时间设置的来源。此程序从本地计算机追溯到其当前同步的 `NTP` 服务器，以此类推。这有时可以提供有用的诊断信息。\n\
  *   `ntpq`：这是 `NTP` 监控程序，稍后的节中将描述。\n*   `xntpdc`：这是另一个 `NTP` 监控和控制程序。它用于比 `ntpq`\
  \ 更高级的操作。\n\n除了主 `NTP` 包外，Linux 还有其他时间设置程序。最常见的是 `rdate`，它在原理上与 `ntpdate` 类似——你使用\
  \ `rdate` 单次设置时钟。大多数发行版默认不安装 `rdate`，但许多发行版自带它。`ntpdate` 相比 `rdate` 的一个优势是 `ntpdate`\
  \ 提供了更高的精度——在几毫秒内，取决于网络连接和父服务器的精度。相比之下，`rdate` 的精度约为一秒。\n\n## 配置 `ntp.conf`\n\n\
  `NTP` 通过名为 `ntp.conf` 的文件进行配置，该文件通常位于 `/etc` 目录下。此文件包含以井号（#）开头的注释行以及设置各种 `NTP` 选项的选项行。重要的选项包括：\n\
  \n\n\n\n*   `server address [key] key] [version number] [prefer]` — 此选项设置 <acronym\
  \ class=\"acronym\">NTP</acronym> 应该同步的服务器名称。`address` 可以为主名或 <acronym class=\"\
  acronym\">IP</acronym> 地址。你可以包含多个 `server` ，每行一个；你的 <acronym class=\"acronym\">NTP</acronym>\
  \ 服务器会尝试连接每一个服务器，并选择最佳的一个进行同步。（稍后将讨论如何定位 <acronym class=\"acronym\">NTP</acronym>\
  \ 服务器。）你还可以在此行中包含一些额外信息。具体来说，`key` `key` 在你想实现安全性以限制对服务器的访问时提供身份验证密钥，`version` `number`\
  \ 告诉服务器使用 `number` 版本的协议，而 `prefer` 则告诉系统优先使用此服务器而非其他服务器。\n\n*   `fudge address\
  \ stratum number` — 此选项主要用于 127.127.1.0 服务器（对应本地系统时钟），使 <acronym class=\"acronym\"\
  >NTP</acronym> 将其视为第 7 层服务器——即在优先级上远低于大多数 <acronym class=\"acronym\">NTP</acronym>\
  \ 服务器。这使得 <acronym class=\"acronym\">NTP</acronym> 在无法到达任何其他服务器的情况下运行。\n\n*   `driftfile\
  \ filename` — 漂移文件包含一个 <acronym class=\"acronym\">NTP</acronym> 在关闭一段时间后启动或无法连接服务器时使用的数字。该数字允许\
  \ <acronym class=\"acronym\">NTP</acronym> 补偿计算机的平均时钟漂移，从而减少隔离状态下钟的不准确性。\n\n*  \
  \ `broadcast address [key] key] [version number] [ttl number]` — 如果包含此选项，服务器将定期向\
  \ `address` 指定网络上的所有客户端广播其当前时间，`address` 应该是计算机在该网络上的地址或组播地址 `224.0.1.1`。使用广播可能会减少具有许多主要作为客户端的\
  \ <acronym class=\"acronym\">NTP</acronym> 服务器的大型局域网的网络流量。\n\n*   `broadcastclient\
  \ [yes | no]` — 你可以使用此选项告诉 <acronym class=\"acronym\">NTP</acronym> 服务器监听来自其他本地\
  \ <acronym class=\"acronym\">NTP</acronym> 服务器的广播。\n\n还有许多其他 `ntp.conf` 选项可执行更特殊的功能。请咨询文档，该文档以\
  \ <acronym class=\"acronym\">HTML</acronym> 格式提供，通常出现在 `/usr/share/doc/xntp-version`\
  \ 或类似的目录下。\n\n大多数发行版的默认 `ntp.conf` 文件几乎可以使用；你只需要编辑或添加一个或多个 `server` 行，将计算机指向适当 <acronym\
  \ class=\"acronym\">NTP</acronym> 服务器系统。选择服务器很重要，因为网络拓扑中距离你非常远、网络连接不稳定或同步到不可靠源的服务器，可能会导致你自己的时间错误或准确性波动很大。如前所述，除非你正在设置一个为数百或更多客户端服务的服务的服务器，或者你有获得尽可能精确时间的迫切理由，否则你应该同步到第\
  \ 2 层或更高的服务器。你可以在 [`www.eecis.udel.edu/~mills/ntp/servers.htm`](http://www.eecis.udel.edu/~mills/ntp/servers.htm)\
  \ 找到对这些问题的讨论。本文末尾包含公共第 1 层和第 2 层时间服务器列表的链接，你可以在第 2 层列表中搜索合适的时间服务器候选者。尝试找到在网络拓扑上接近你的的服务器。网络拓扑与地理位置仅对应非常松散——如果你在费城，澳大利亚堪培的服务器可能比波士顿的远，但取决于你的网络链路如何工作，波士顿的服务器可能比纽约的更近。\n\
  \n### TIP\n\n![TIP](img/tip.gif)\n\n你可以使用 `ping` 来获取到达两个不同 <acronym class=\"acronym\"\
  >NTP</acronym> 服务器所需网络延迟的大致概念。作为一个非常粗略的经验法则，ping 时间较短的 <acronym class=\"acronym\"\
  >NTP</acronym> 服务器优于 ping 时间较长的。\n\n如果时间服务器列表显示运营商希望在你在使用之前通知，请务必这样做。你可能还想调查可能不太公开但更近的时间服务器选项。许多大型组织（包括许多互联网服务提供商\
  \ ISP）运行着时间服务器。因此，你可能会在互联网上找到一个离你很近的时间服务器。咨询你的 `ISP`，或者如果你想为大型组织中的部门设置时间服务器，请咨询你的网络管理员。\n\
  \n如果你购买了 `GPS` 时间接收器或其他外部时钟硬件，可以将系统同步到它以成为第 1 层时间服务器。你需要为外部时钟硬件安装特殊驱动程序。这些驱动程序使硬件看起来像是\
  \ 127.127.0.0/16 网络上的设备，因此你可以使用普通的 `server` 行，将其指向适当的 `IP` 地址。你必须查阅设备 Linux 驱动程序的文档获取详情。<acronym\
  \ class=\"acronym\">NTP</acronym> 网站包含了硬件产品制造商列表：[`www.eecis.udel.edu/~ntp/hardware.html`](http://www.eecis.udel.edu/~ntp/hardware.html)。\n\
  \n当你完成 `ntp.conf` 重配置后，应该重启 <acronym class=\"acronym\">NTP</acronym> 服务器。这通常通过 SysV\
  \ 启动脚本完成，如 `第 4 章 启动服务器` 中讨论。除非你的启动脚本在启动 `ntpd` 之前调用了 `ntpdate`，否则即使时间偏差了几分钟，你也不会看到系统时间发生剧变。相反，<acronym\
  \ class=\"acronym\">NTP</acronym> 会收到多次检查后等待一段时间，然后快速更改时间或缓慢调整时间以与父服务器的时间同步。你可以使用\
  \ `ntpq` 监控它的操作。\n\n## 监控 NTP 的操作\n\n除了使用 `xclock` 等程序查看时间外，监控 NTP 操作的常用方法是使用 `ntpq`\
  \ 程序。你启动该程序并在提示符处输入大量的文本命令之一。程序随后会对这些命令显示响应信息。一些较重要的 `ntpq` 命令包括：\n\n*   `host hostname`\
  \ — 默认情况下，`ntpq` 查询本地计算机上运行的服务器。你可以通过发布 `host` 命令更改此行为，以便轻松监控整个网络中 <acronym class=\"\
  acronym\">NTP</acronym> 服务器的运行情况。你可以在启动 `ntpq` 时提供目标主机来实现相同效果，例如 `ntpq remote.threeroomco.com`。\n\
  \n*   `hostnames [yes | no]` — 如果你提供 `yes` 选项，`ntpq` 在报告远程计算机时将显示主机名而非 <acronym\
  \ class=\"acronym\">IP</acronym> 地址（这是默认行为）。`no` 选项导致 `ntpq` 显示 <acronym class=\"\
  acronym\">IP</acronym> 地址。启动 `ntpq` 时使用 `-n` 与在启动程序后输入 `hostnames no` 效果相同。\n\n\
  *   `ntpversion versionno` — 你可以使用此选项在查询 <acronym class=\"acronym\">NTP</acronym>\
  \ 服务器时指定要使用的 NTP 版本号 (`versionno`)。\n\n*   `quit` — 当你完成后，发布此命令退出程序。\n\n\n\n\n\n\
  - `peers` — 该命令是最实用的初始诊断工具之一。它显示了与你的服务器通信的服务器列表。除非你使用了 `host` 命令，否则此列表应包含 localhost\
  \ 以及你在 `ntp.conf` 中列出的所有服务器。额外信息包括：每个列出的服务器所同步的服务器；每个服务器的层级（stratum）；每个服务器最后联系的时间以及接触之间的时间间隔；指示系统间连接可靠性的数值代码；以及延迟（delay）、偏移（offset）和抖动（jitter）信息，这些是时间数据准确性和变化性的指标。在每个条目的左侧有一个单字符代码，表示你的服务器如何使用来自每个服务器的数据。加号（`+`）表示该服务器被考虑同步，但被更好的服务器击败；星号（`*`）表示该服务器是你服务器的父服务器；`x`\
  \ 表示虚假时钟（false ticker）——即时间完全错误的服务器；其他各种字符表示因其他原因被拒绝的服务器。`peers` 的变体有 `lpeers`（可能列出更多服务器）和\
  \ `opeers`（不显示与你的服务器连接的服务器名称）。\n\n- `associations` — 该命令生成每个服务器的关联统计列表。服务器不是通过主机名或\
  \ IP 地址识别的，而是通过在其他命令中使用的关联 ID。该命令的变体有 `lassociations`、`passociations` 和 `lpassociations`。\n\
  \n- `readvar` `assocID varname` — 你可以使用 `readvar` 命令读取原始变量，它接受关联 ID 和变量名作为参数。此命令在高级调试会话可能有用。变体有\
  \ `mreadvar` 和 `rv`（后者实际上是完全同义词）。\n\n- `readlist` `assocID` — 该命令类似于 `readvar`，但它产生所有标准变量的列表。同义词是\
  \ `rl`，变体是 `mreadlist`。\n\n- `pstatus` `assocID` — 该命令请求由 `assocID` 指定系统返回状态信息。在实践中，其效果与\
  \ `readlist` 命令相似。\n\n- `writevar` `assocID varname=value` — 你可以使用 `writevar` 命令修改变量的值。通常你不需要这样做。\n\
  \n当你第一次配置 NTP 时，每当你重新配置它时，以及之后可能定期进行，你可能想使用 `ntpq` 来检查它是否按你的预期运行。图 10.1 显示了在已运行一段时间的服务器上\
  \ `ntpq` 的运行情况。当你启动 `ntpd` 后首次运行 `ntpq` 时，许多字段将为空或持有占位值（通常为 0）。在大约一分钟的时间内，大多数字段应该填充与\
  \ 图 10.1 所示相似的值，但 图 10.1 中大多数条目左侧的加号和星号在几分钟内不会出现，因为服务器需要一些时间来确定潜在节点中哪一个是最可靠的。其他某些值也会在几分钟内发生变化，然后稳定下来。如果你在服务器名称左侧看到\
  \ `x`，你可能想要考虑将其从配置中删除，因为该服务器很可能存在严重的配置错误。\n\n![ntpqq 程序让你能够监控 NTP 服务器活动。](img/10fig01.gif)\n\
  \n**图 10.1. `ntpq` 程序让你能够监控 NTP 服务器活动。**\n\n如果你发现系统时间发生漂移或以某种奇怪的方式发生变化，你可能想使用 `ntpq`\
  \ 检查你的 NTP 服务器配置。它可能因为 IP 地址更改或某些永久性网络连接问题而失去与服务器的同步。（暂时的网络中断不应产生明显的问题；服务器将切换到本地时钟，直到网络恢复。）如果你的系统在启动\
  \ `ntpd` 后几分钟内没有与任何时间服务器同步，你应该调查一般的网络连接情况。你能 ping 通远程服务器吗？你是否设置了可能会阻止 NTP 查询的防火墙？（你可能需要重新配置防火墙以通过\
  \ UDP 端口 123 数据包，至少在相关服务器之间——包括你的服务器和远程服务器。）你是否有权限使用远程服务器？（该服务器可能使用防火墙或身份验证密钥来排除未授权的客户端。）\n\
  \n### 如何保持高精度时间\n\n大多数计算机使用基于振荡器的内部时钟——振荡器是产生规律变化信号的电子设备。如果振荡器产生例如 100Hz 的信号，这意味着它每秒变化\
  \ 100 次。通过计算振荡次数，计算机保持计时。然而，如前，计算机时钟是不完美的。这种缺陷有几个原因。首先，振荡器的运行值可能不是它们应该具有的精确值。如果一个\
  \ 100Hz 的振荡器实际上以 100.1Hz 运行，则时间测量将会偏差。此外，振荡频率可能会随时间变化，随着计算机发热或房间温度变化而变化。振荡频率还可能随着电路老化或各种原因而变化。\n\
  \n振荡器之外的因素也会影响时间测量的精度。通常情况下，振荡器通过中断（x86 上的中断 0）向计算机信号其时间周期已到。但是，如果计算机忙于处理其他事件，它可能无法及时处理此中断，因此计算机可能会错过时钟的“滴答”。\n\
  \n这些误差源导致了一般的时钟漂移，对于大多数用户来说，这只是轻微的困扰。但在某些情况下，高精度时间测量是非常重要的。例如，用于极时间敏感实验的计算机可能需要极高的精度。（Linux\
  \ 并不真正适合此类功能，尽管实时 Linux 变体 fsmlabs.com/community/ 在这方面表现得多。）增强实时时钟内核选项（在字符设备菜单中）允许用户在需要时访问高精度时钟。\n\
  \n插入内核模块是一项特别容易导致错过振荡器脉冲的任务，因此如果高计时精度很重要，你应该编译一个尽可能将许多驱动程序构建进去的内核，而不是将许多选项作为模块。保持计算机始终开启并将其放置在温度控制的房间内，这有助于减少温度因素引起的时钟漂移变化。NTP\
  \ 服务器跟踪时钟漂移并尝试进行补偿，并定期与其父服务器重新连接，因此运行 NTP 服务器可以帮助保持准确时间——但如果 NTP 有可能在关键点调整时间，你可能想在特别时间敏感的操作期间临时禁用它。\n\
  \n\n\n\n\n如果你已经在网络中的某台计算机上配置了 `NTP` 服务器，以从远程系统获取时间，那么你可以以相同的方式在网络中的所有其他系统上安装并配置\
  \ `NTP` 服务器，但将这些计算机指向你的第一台 `NTP` 服务器，而不是外部服务器。结果是，你的整个网络产生的与 `NTP` 相关的互联网流量将非常少，尽管整个网络将通过本地\
  \ `NTP` 查询被设置为正确的时间。你可以在每个客户端上获得 `ntpd` 的完整益处，尽管它们大部分或全部不会被用作服务器。在复杂网络中，你可能会自己实现几个层级（strata）的时间服务器。例如，你可能会在每个子网上运行一个\
  \ `NTP` 服务器以供该子网的客户端使用，并让这些子网服务器连接到子网中一个更接近互联网的系统以获取自己的时间。这种设计将最大限地减少你网络内部与 `NTP`\
  \ 网络流量。\n\n对于许多系统来说，运行 `ntpd` 是过剩的。该程序旨在将整个网络的时间同步在几毫秒以内，并将整个网络的时间设置在低于 `UTC` 一秒的范围内。此外，`ntpd`\
  \ 设计旨在持续保持此时间的准确，在一天之中偏离准确度非常小。你的需求可能更加务实；例如，你可能并不担心任何系统的时间每天漂移几秒。此外，`ntpd` 是一个服务器，因此构成了潜在风险；在\
  \ `ntpd` 中可能会发现并利用与安全相关的漏洞，导致你的所有系统（或至少是所有暴露在公共互联网上的系统）出现潜在漏洞。（事实上，过去在 `ntpd` 中确实发现过此类漏洞。）由于这些原因，`ntpdate`\
  \ 程序在许多情况下可能很有用。正如前面提到的，`rdate` 程序可以采用类似的方式，但它使用自己的协议，且精度不如 `ntpdate`。\n\n### NOTE\n\
  \n![NOTE](img/note.gif)\n\n`NTP` 的设计者正在努力逐步淘汰 `ntpdate`，目标是允许 `ntpd` 用于一次性时钟设置，就像\
  \ `ntpdate` 现在可以使用的那样。未来的 `NTP` 软件包可能会省略 `ntpdate`，并提供某种以更限制的方式使用 `ntpd` 来替代的方法。事实上，某些\
  \ `NTP` 版本 4 软件包缺少 `ntpdate`。\n\n要运行 `ntpdate`，你输入它的名称，后跟你想要同步系统时间的服务器的名称或 `IP`\
  \ 地址。如果你想让程序自动选择最佳的一个，可以指定多个时间服务器。你还可以在程序名称和时间服务器地址之前包含几个可选参数：\n\n*   `-B` — 通常情况下，如果时间差小于半秒，`ntpdate`\
  \ 会微调时钟速度（slew）；如果差异大于半秒，则重置时钟。此选项强制程序即使在误差很大时也微调时钟速度。\n*   `-b` — 此选项强制 `ntpdate`\
  \ 将时钟设置为服务器发送的值，即使误差很小。\n*   `-o version` — 你可以使用此选项告诉程序使用特定版本的 `NTP`。\n*   `-p\
  \ samples` — 通常情况下，`ntpdate` 使用来自服务器的四个时间样本设置时钟。你可以使用此选项将该值向上或向下调整（在 1 到 8 范围内）。\n\
  *   `-q` — 你可以通过包含此选项来查询服务器而不设置时钟。但这不会返回人类可读的时间；它返回关于服务器的延迟和偏移（offsets）的信息。\n* \
  \  `-s` — 你可以使用此选项强制 `ntpdate` 通过系统日志发送其输出。如果你作为 cron 任务调用该程序，可能需要这样做。\n*   `-u`\
  \ — 通常情况下，`ntpdate` 的出站数据包使用标准的 `NTP` 端口 123。你可以通过此选项让它使用非权限端口（1024 以上的编号）。这对于绕过某些防火墙可能是必要的。\n\
  \n当你运行 `ntpdate` 与服务器同步时一时，程序会报告各种统计数据，例如与你联系的服务器相关的层级（stratum）、偏移（offset）和延迟。除非指定了\
  \ `-q` 或发生错误，否则程序将微调你的时钟速度或设置你计算机上的绝对时间。\n\n使用 `ntpdate` 的一种常用方法将其作为 cron 任务运行。你可以每小时运行一次或每天运行一次。\n\
  \n### WARNING\n\n![WARNING](img/warning.gif)\n\n不要在午夜定期调用 ntpdate。此类服务器经常会被那些认为午夜是同步时钟合理时间的人所冲击。相反，选择一个方便的不寻常时间，比如下午\
  \ 1:23 或凌晨 3:48。\n\n# 使用 Samba 提供时间\n\n`NTP` 是一个极其有用的协议，正如前面提到的，它是 Linux 计算机设置时间的最精确的方法之一。然而，确实存在其他时间协议。其中一个值得提到的是服务器消息块\
  \ (SMB)/通用互联网文件系统 (CIFS) 文件和打印机共享协议包含的时间服务器功能，这些协议用于 Microsoft 网络，并在 Linux 中通过 Samba\
  \ 实现（在第 7 章，通过 Samba 进行文件和打印机共享）。如果你在 Samba 服务器上运行 `NTP`，配置 Samba 提供时间可能比在所有 Windows\
  \ 计算机上安装 `NTP` 客户端更简单。（不过，Samba 无法从 Windows SMB/CIFS 时间服务器设置系统时间。）\n\n## Samba 的提供选项\n\
  \nSamba 的配置文件 `smb.conf` 分分为几个部分，大部分定义了你想与 SMB/CIFS 客户端共享的特定目录。然而，第一部分被称为 `[global]`，定义了全局默认值以及不适用于单独共享的选项。其中之一就是\
  \ `time server` 选项，你可以通过设置以下参数来激活它：\n\n```\ntime server = Yes\n```\n\n这告诉 Samba\
  \ 使用 SMB/CIFS 时间服务器功能响应来自 SMB/CIFS 客户端的时间查询。无论你的计算机是否使用 `NTP`、`rdate` 或其他其他时间设置协议来设置自己的时间，你都可以设置此选项，但如果\
  \ Samba 服务器的时间通过此类机制正确设置，则它将最有用。\n\n\n\n\n\n`SMB`/`CIFS` 时间协议并不如 `NTP` 那么精确。Windows\
  \ 系统在这样设置后可能会有一秒左右的误差，甚至在时钟开始偏移之前也是。\n\n## 配置 Windows 客户端设置时间\n\n要在 Windows 客户端上设置时间，你可以在\
  \ DOS 提示符窗口中使用以下命令：\n\n```\n C:\\> NET TIME \\\\SERVER /SET /YES\n```\n\n在此命令中，`SERVER`\
  \ 是 Samba 服务器的 NetBIOS 名称。你可以手动输入此类命令来设置时间，就像你使用 `ntpdate` 设置 Linux 计算机的时间一样。不过，你可能想创建一个\
  \ Windows 批处理文件，以便每次用户登录时执行此命令。你可以通过将命令（不带 DOS `C:\\>` 提示符）输入文件（你可以将其命名为 `SETTIME.BAT`）并将该文件复制到\
  \ Windows 启动文件夹来实现。这样，每当用户启动计算机或登录时，命令就会执行。或者，如果你的网络使用域配置，你可以将命令包含在默认网络登录脚本中。（但由于\
  \ Windows 执行 `AUTOEXEC.BAT` 时网络尚未启动，因此你不应该在那个脚本中包含此命令。）\n\n### 注意\n\n![NOTE](img/note.gif)\n\
  \nWindows 2000 和 XP 更直接支持 `NTP`。具体来说，命令 `NET TIME /SETSNTP:ntpserver` 应该与 `ntpserver`\
  \ 系统同步时间。这些系统甚至带有一个完整的 `NTP` 服务器，但其配置不在本书的范围内。\n\n## 总结\n\n时间服务器允许你的计算机之间保持时间同步，并与最终连接到可靠时间源的外部时间服务器同步。在引用文件时间戳和系统日志时，使用时间服务器非常有用。最流行且强大的时间服务器协议之一是\
  \ `NTP`，它允许时间服务器（通常称为 `ntpd` 或 `xntpd`）持续运行，并定期根据另一个 `NTP` 服务器的时间来检查它自己的时间概念。在小型网络中，你可能会配置一个服务器让自己同步到第\
  \ 2 层服务器（即距离可靠时间源两个跳接的服务器），然后使用 `ntpd` 或像 `ntpdate` 这样的仅客户端 `NTP` 程序将所有其他计算机同步到你的第\
  \ 3 层时间服务器。较大的网络可能会使用多个第 3 层时间服务器或像 `GPS` 钟这样的可靠时间源。\n\n处理时间设置的其他选项包括 Linux 的 `rdate`\
  \ 命令（时间客户端）以及 `SMB`/`CIFS` 中的时间服务器功能，包括 Samba 服务器和 Windows `NET` 命令。你可以使用后者轻松地同步\
  \ Windows 客户端的时间，而无需在它们上安装 `NTP` 软件。\n\n# 第 11 章 拉取邮件协议：`POP` 和 `IMAP`\n\n电子邮件是今天使用的最重要的网络功能之一。无论是给走廊对同事发送备忘录，还是给全球另一端的通信伙伴，电子邮件已成为我们每天依赖的东西。Linux\
  \ 对多种不同的电子邮件协议提供了广泛支持。本章涵盖了一种被称为“拉取协议”的电子邮件协议，因为由邮件接收方发起传输。这些协议与“推送协议”形成对比，后者由发送方发起传输。（第\
  \ 19 章，推送邮件协议：SMTP，涵盖了最常见的推送邮件协议。）由于电子邮件源自发送者，因此推送协议始终涉及电子邮件投递。然而，电子邮件传输通常涉及几个中转站。拉取协议出现在传输的最后阶段，或者偶尔出现在中间阶段。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n虽然本章位于本书的 第 19 章 之前，但在拉取邮件服务器有用之前，你必须先有一个可以工作的推送邮件服务器。大多数\
  \ Linux 发行版默认都安装了可以工作的推送邮件服务器，因此你从开始就应该至少拥有基本的功能。如果你的推送邮件系统出现问题，或者你需要用默认以外的方式对其进行配置，你可能需要跳到\
  \ 第 19 章，然后返回本章。\n\n本章从讨论拉取邮件协议开始，包括你何时应该使用它，以及本章中讨论的两种拉取协议的概述。然后，章将讨论如何配置 Linux\
  \ 同时提供这两种协议。本章以介绍 Fetchmail 结束，它作为一个拉取邮件客户端运行，然后可以使用推送邮件协议将邮件转发到其他目的地。\n\n# 何时运行拉取邮件服务器\n\
  \n假设你想为一个小办公室、`ISP` 客户端或其他用户组提供电子邮件服务。所有 Linux 自带的、并在 第 19 章 中描述的推送邮件服务器允许你建立服务器来接收传入的邮件。问题变成了：如何提供访问服务器计算机收集的邮件？主要有两种方法：\n\
  \n- 你可以在邮件服务器上为用户提供登录账户，并允许用户使用 Linux 电子邮件程序（如 `pine`、`mutt` 或 KMail，技术上称为邮件用户代理，或\
  \ MUAs）在本地读取邮件。这些程序可以直接读取传入的队列，因此它们不需要任何特殊软件。这种方法要求用户坐在邮件服务器计算机前，或者使用 Telnet、Secure\
  \ Shell (`SSH`) 或某些形式的基于 X 的远程登录远程登录它。（第 13 章维护远程登录服务器和 14 使用 X 和 VNC 服务器处理 GUI\
  \ 访问详细讨论了此类服务器。）\n- 你可以运行拉取邮件服务器，允许用户在自己的计算机上运行邮件读取器，以读取已在邮件服务器上收集的邮件。邮件读取器充当邮件服务器计算机拉取邮件服务器程序的拉取邮件客户端。拉取邮件服务器程序实际上承担了本地邮件读取器的角色，替代了用户使用的远程邮件读取器。\n\
  \n当 UNIX 系统作为组织中唯一的真实计算机、用户通过哑终端硬件访问 UNIX 计算机时，第一个选项很常见。但今天，用户更倾向于使用在 Windows 或\
  \ MacOS 中运行的 GUI 程序来读取邮件。虽然有在 Linux 上运行的本地 GUI 邮件读取器，但它们要求用户运行 X 服务器，这在 Windows\
  \ 和 MacOS 系统上并不常见。由于这些及其他原因，第二种方法对于坐在 Windows 或 MacOS 电脑前的用户通常更方便。\n\n\n\n从用户的角度来看，邮件读写器需要配置拉取邮件服务器的主机名或\
  \ `IP` 地址，并通过启动邮件读写器并点击按钮来检查邮件。许多邮件读写器可以定期检查新邮件，因此点击按钮可能不是必须的。\n\n因此，当你想要为那些希望在自己计算机上运行邮件读写器的用户提供邮件服务器的访问权限，而无需他们使用\
  \ `Telnet` 或 `SSH` 等工具登录邮件服务器时，运行一个拉取邮件服务器是有意义的。拉取邮件服务器通常用于本地企业网络和教育网，同时也也常用于互联网服务提供商（ISP），他们利用它为订阅者提供电子邮件。在拥有足够的硬盘、网络连接和其他硬件资源的情况下，这些服务器可以支持极少数用户，也可以支持成千上万个用户。\n\
  \n# 理解 POP 和 IMAP\n\n前面的讨论概述了邮件投递的一些关键要点。然而，为了完全理解拉取邮件协议，进一步研究这个问题将很有帮助，可以让我们更好地理解如何使用拉取邮件协议，以及它们如何与其他邮件投递系统相互作用。本章描述的两种拉取邮件协议是`邮局协议\
  \ (POP)` 和`互联网信息访问协议 (IMAP)`。到为止的讨论适用于这两种协议，但正如下文所述，它们之间存在重要的区别。你可能不想或不需要同时使用 `POP`\
  \ 和 `IMAP`，或者你可能出于某些主动原因而*不*使用其中一种协议。在规划你的拉取邮件服务器实现时，了解每个协议最实用的任务是非常重要的。\n\n## 拉取邮件在邮件投递系统中的位置\n\
  \n正如前面提到的，拉取邮件服务器计算机通常也兼当推送邮件服务器的功能——如果没有推送邮件服务器，拉取邮件服务器在被查询时将没有任何邮件可以投递给客户端。然而，邮件是从哪里来的呢？在大多数情况下，邮件源于某一台计算机，通过推送邮件协议经过一个或多个邮件服务器计算机，最后到达拉取邮件服务器。\n\
  \n与某些协议不同，邮件投递（特别是推送）是基于邮件服务器的链条的，而不是将邮件直接投递到最终目的地。邮件投递系统通过域名系统 (DNS) 可以将邮件转发到更接近目的地的服务器。例如，当你发送邮件时，邮件通过邮件传输协议\
  \ (SMTP) 转发到另一个服务器，该服务器可能是一个拉取邮件服务器，它等待一段时间以接收邮件。由于这个原因，IMAP 服务器可能需要较大的硬盘来存储邮件。\n\
  \n正如前面提到的，拉取邮件服务器的一个作用是存储邮件直到接收者可以检索它。此时，接收者的邮件读写器连接到邮件服务器并下载消息。你可能根据这个描述推断邮件会从邮件服务器上删除。这种推断通常是正确的，但并非如此。在某些情况下，邮件服务器可能会保留邮件的副本：\n\
  \n\n\n\n\n*   使用 `POP` 或 `IMAP`，你都可以配置邮件阅读器下载消息但将原始邮件保留在服务器上。如果你经常使用两个不同的邮件阅读器或计算机，你可能会这样做。然而，使用\
  \ `POP` 时，这种程序可能会迅速变得棘手，因为 `POP` 在识别和操作单个消息方面的规定非常原始。因此，随着服务器上消息数量的增加，这种方法可能会变得极其麻烦。\n\
  \n*   使用 `IMAP`，你可以将消息组织为`服务器上的` 消息“文件夹”。因此，如果你经常使用几台不同的电脑，你可以在 `IMAP` 服务器上组织你的消息，而在切换电脑时就无需翻阅重复的邮件。`IMAP`\
  \ 还包括仅检索消息 `headers`（如主题和发件人地址等信息）而不检索消息 `bodies`（文本正文和附件的大主体）的能力，因此你不需要浪费过多的带宽来检查邮件。\n\
  \n`POP` 和 `IMAP` 之间的这些差异在某些情况下并不重要，但在另一些情况下至关重要。如果你只使用一台电脑，并想在本地存储和组织邮件，`POP` 和\
  \ `IMAP` 都能胜任。如果你经常更换电脑或在单台电脑上使用多个邮件客户端，`IMAP` 会方便得多。另一方面，涉及的网络传输意味着将消息存储在服务器上会导致你在读取任何特定消息时等待更长时间，特别是存储了许多消息并定期读取旧消息时。但从拉取邮件服务器管理的角度来看，`IMAP`\
  \ 带来了挑战，因为它增加了对磁盘存储和网络带宽的需求，因为用户可能会多次恢复同一条消息。（尽管如此，像使用 `POP` 一样使用 `IMAP` 的用户不会给\
  \ IMAP 带来此类额外的开销；只有当用户利用 IMAP 的额外功能时，你才会看到服务器硬件需求的增加。）\n\n## 示例 `POP` 会话\n\n`POP`\
  \ 实际上是几种不同的协议。今天最常用的版本是 `POP-3`，它使用 `TCP` 端口 110。（较早的 `POP-2` 使用端口 109。）像许多互联网协议一样，`POP`\
  \ 是基于客户端发送的文本命令和服务器发送的文本响应构建的。`POP-3` 支持约十个命令，包括 `USER`（指定用户名）、`PASS`（指定密码）、`RETR`（检索消息）、`DELE`（删除消息）和\
  \ `QUIT`（终止会话）。支持 `POP` 的邮件阅读器可以向 `POP` 服务器发送这些和其他 `POP` 命令，捕获结果，并使用结果存储邮件并以易于理解的方式呈现给用户。\n\
  \n作为 `POP` 使用的示例，请参考列表 11.1，它显示了一个检索单个消息的简单 `POP` 会话。该列表使用 `telnet` 连接到 `POP-3`\
  \ 端口并手动发布命令。大多数 `POP` 会话会将这些细节隐藏在邮件阅读器之后，但查看邮件阅读器和 `POP-3` 服务器如何交换消息是有益的。\n\n**示例\
  \ 11.1. 一个示例 `POP-3` 会话**\n\n```\n $ telnet nessus 110\nTrying 192.168.1.3...\n\
  Connected to nessus.rodsbooks.com.\nEscape character is '^]'.\n+OK POP3 nessus.rodsbooks.com\
  \ v7.64 server ready\nUSER rodsmith\n+OK User name accepted, password please\nPASS\
  \ password\n+OK Mailbox open, 1 messages\nRETR 1\n+OK 531 octets\n>From rodsmith\
  \  Wed Aug  8 14:38:46 2001\nReturn-Path: <ben@pangaea.edu>\nDelivered-To: rodsmith@nessus.rodsbooks.com\n\
  Received: from speaker.rodsbooks.com (speaker.rodsbooks.com [192.168.1.1])\n   \
  \     by nessus.rodsbooks.com (Postfix) with SMTP id EB2A01A2BD\n        for <rodsmith@nessus.rodsbooks.com>;\
  \ Wed,  8 Aug 2001\n14:38:26 -0400 (EDT)\nMessage-Id: <20010008183826.EB2A01A2BD@nessus.rodsbooks.com>\n\
  Date: Wed,  8 Aug 2001 14:38:26 -0400 (EDT)\nFrom: ben@pangaea.edu\nTo: undisclosed-recipients:;\n\
  Status:\n\nThis is a test message.\n\n.\nDELE 1\n+OK Message deleted\nQUIT\n+OK\
  \ Sayonara\nConnection closed by foreign host.\n```\n\n如你从列表 11.1 中所示，`POP` 通过编号来引用消息。在这个示例中，服务器只有一条消息，如消息\
  \ `+OK mailbox open, 1 messages` 所示。消息可以通过编号进行检索或删除，如 `RETR 1` 和 `DELE 1`。消息必须完整检索，否则完全不检索——`POP`\
  \ 没有提供任何机制来发现消息的发送者、长度或其他信息以进行检索。不过，尽管如此，其中的许多信息*确实*已经包含在消息本身中了。在这个示例中，消息的大部分由其\
  \ *headers* 组成——即包含消息经过的服务器信息、发件人地址等信息的行。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n\
  列表 11.1 中显示的头部信息说明了电子邮件的一个既灵活又令人沮丧的功能：确定邮件的真实发送者可能很困难。你会注意到 `From:` 和 `Return-Path:`\
  \ 头部，它们表明消息是由 `ben@pangaea.edu` 发送的。然而，习惯于阅读邮件头部的人知道这些头部很容易被伪造。每个邮件服务器都会添加一个 `Received:`\
  \ 头部，以指定服务器是谁以及从哪里接收到消息。我直接从我网络中的一台电脑将此示例消息发送到另一台电脑，`Received:` 头部反映了这一事实，显示消息来自\
  \ speaker.rodsbooks.com 并投递到了 nessus.rodsbooks.com。pangaea.edu 中没有电脑参与传输。\n\n\n\n\
  \n从广义上来说，`IMAP` 与 `POP` 扮演相同的角色——两者都是拉取式邮件协议。然而，`IMAP` 对消息提供了更细粒度的控制。`IMAP` 允许在检索邮件正文之前检查邮件头，因此用户可以决定是否下载某封邮件。（从用户的角度来看，邮件阅读器可能会显示可用邮件的信息，允许用户在任何时候选择详细阅读哪些邮件。）这些额外功能需要额外的命令：在协议的当前版本\
  \ `IMAP-4` 中总共有约二十个命令，该版本使用 `TCP` 端口 143。列表 11.2 展示了一个 `IMAP` 获取会话，它与列表 11.1 大致，区别在于它包含一个将消息复制到\
  \ `IMAP` 文件夹的命令。\n\n**示例 11.2. 一个示例 IMAP-4 会话**\n\n```\n $ telnet nessus 143\nTrying\
  \ 192.168.1.3...\nConnected to nessus.rodsbooks.com.\nEscape character is '^]'.\n\
  * OK nessus.rodsbooks.com IMAP4rev1 v12.264.phall server ready\nA1 LOGIN rodsmith\
  \ password\nA1 OK LOGIN completed\nA2 SELECT Inbox\n* 1 EXISTS\n* NO Trying to get\
  \ mailbox lock from process 29559\n* 1 RECENT\n* OK [UIDVALIDITY 997295985] UID\
  \ validity status\n* OK [UIDNEXT 4] Predicted next UID\n* FLAGS (\\Answered \\Flagged\
  \ \\Deleted \\Draft \\Seen)\n* OK [PERMANENTFLAGS (\\* \\Answered \\Flagged \\Deleted\
  \ \\Draft \\Seen)]\nPermanent flags\n* OK [UNSEEN 1] first unseen message in /var/spool/mail/rodsmith\n\
  A2 OK [READ-WRITE] SELECT completed\nA3 FETCH 1 BODY[HEADER]\n* 1 FETCH (BODY[HEADER]\
  \ {494}\n>From rodsmith  Wed Aug  8 16:02:47 2001\nReturn-Path: <ben@pangaea.edu>\n\
  Delivered-To: rodsmith@nessus.rodsbooks.com\nReceived: from speaker.rodsbooks.com\
  \ (speaker.rodsbooks.com [192.168.1.1])\n        by nessus.rodsbooks.com (Postfix)\
  \ with SMTP id 2C7121A2BD\n        for <rodsmith@nessus.rodsbooks.com>; Wed,  8\
  \ Aug 2001\n16:02:25 -0400 (EDT)\nMessage-Id: <20010808200225.2C7121A2BD@nessus.rodsbooks.com>\n\
  Date: Wed,  8 Aug 2001 16:02:25 -0400 (EDT)\nFrom: ben@pangaea.edu\nTo: undisclosed-recipients:;\n\
  \n)\n* 1 FETCH (FLAGS (\\Recent \\Seen))\nA3 OK FETCH completed\nA4 FETCH 1 BODY[TEXT]\n\
  * 1 FETCH (BODY[TEXT] {25}\nThis is a test message.\n)\nA4 OK FETCH completed\n\
  A5 COPY 1 demos\nA5 OK COPY completed\nA6 LOGOUT\n* BYE nessus.rodsbooks.com IMAP4rev1\
  \ server terminating connection\nA6 OK LOGOUT completed\nConnection closed by foreign\
  \ host.\n```\n\n列表 11.2 说明了 `IMAP` 相较于 `POP` 的的一些功能和复杂性。`IMAP` 要求客户端提交带编号的命令，例如\
  \ `A6 LOGOUT` 而不是简单的 `LOGOUT`。从用户的角度来看，这个细节并不重要，因为邮件阅读器会处理它。`IMAP` 允许客户端从正文之外单独检索邮件头，如列表\
  \ 11.2 中的 `A3` 和 `A4` 命令所示。文件夹的使用要求客户端在读取消息之前进入文件夹（列表 11.2 中的 `A2` 命令），并允许客户端进入文件夹。列表\
  \ 11.2 所展示的 `IMAP` 功能部分，远少于使用 `/var/spool/mail/rodsmith` 的 `POP-3` 列表 11.1 所涉及的内容。大多数系统将邮件存储在用户主目录下。当用户首次使用\
  \ `IMAP` 连接时，除了 `INBOX` 之外将没有定义任何文件夹。UW `IMAP` 服务器通过在用户主目录下创建一个文件来响应。其他软件包可能会将邮件存储在其他位置；请查阅它们的文档。你应该了解这些消息的存储位置，以便为它们分配足够的磁盘空间，特别是在大型服务器或用户将大量的服务器上。\n\
  \n## 确定使用哪种\n\n选择 `POP` 还是 `IMAP` 部分取决于个人喜好，部分取决于你的邮件阅读器的功能，部分取决于你的可用资源。`POP` 最大限地减少了你对邮件服务器磁盘空间和网络速度的需求，因为用户更有可能将电子邮件下载并永久存储在本地计算机上，而不是将邮件留在服务器上供以后查阅或存档。出于这个原因，`IMAP`\
  \ 服务器可能在服务器上需要更多磁盘空间，可能对客户端需要更多网络带宽。尽管，这种服务器对至少某些用户来说可能是更好的。大多数邮件阅读器都支持 `POP`。`IMAP`\
  \ 支持很常见，但没有 `POP` 普及。因此，如果你提供了 `IMAP`，同时提供 `POP` 通常是一个好主意。对服务器的额外负载应该是很小的，但它允许那些偏好不支持\
  \ `IMAP` 的邮件阅读器的用户检索邮件。`POP` 客户端可能会清理用户的收件箱，但它不会破坏通过 `IMAP` 创建的文件夹。另一方面，运行 `POP`\
  \ 也意味着开放另一个端口。如果 `POP` 服务器被证明存在安全漏洞，这可能允许坏人访问你的系统。\n\n### 警告\n\n![警告](img/warning.gif)\n\
  \n\n\n\n\n默认情况下，<acronym class=\"acronym\">POP</acronym> 和 <acronym class=\"acronym\"\
  >IMAP</acronym> 都会以未加密（明文）形式发送所有信息，包括密码。因此，如果可能，你应该将 <acronym class=\"acronym\"\
  >POP</acronym> 或 <acronym class=\"acronym\">IMAP</acronym> 密码 `only` 用于邮件检索，而不是用于其他用途（例如常规登录）。目前有安全的\
  \ <acronym class=\"acronym\">POP</acronym> 和 <acronym class=\"acronym\">IMAP</acronym>\
  \ 版本，例如使用 `Secure Sockets Layer (<acronym class=\"acronym\">SSL</acronym>)` 加密传输的版本。这些版本配置较为复杂，但如果你担心安全性，那么这样做是非常值得的。当电子邮件可能通过互联网访问，而不是限制在你控制的本地网络网段时，这一点尤为重要。如果你想将拉取邮件服务器的访问限制在本地网络，可以应用\
  \ `TCP` Wrappers 或 `xinetd` 规则，如第 4 章 [启动服务器] 所示。另一种选项是创建数据过滤防火墙规则，如第 25 章 [配置 iptables]\
  \ 所示。\n\n# 配置 <acronym class=\"acronym\">POP</acronym> 服务器\n\n作为一般规则，<acronym class=\"\
  acronym\">POP</acronym> 服务器易于设置和运行。除了第 4 章 [启动服务器] 中描述的启动服务器所需的配置外，大多数服务器不需要任何配置。但是，你需要一个与你的\
  \ <acronym class=\"acronym\">SMTP</acronym> 服务器匹配的 <acronym class=\"acronym\">POP</acronym>\
  \ 服务器。最重要的是，存储入站邮件有两种格式：mbox 和 maildir。大多数邮件服务器默认使用 mbox，但许多服务器可以使用 maildir，而少数服务器默认使用\
  \ maildir。具体而言，`sendmail`、`Postfix` 和 `Exim` 默认使用 mbox，而 `qmail` 默认使用 maildir 格式。`Postfix`、`Exim`\
  \ 和 `qmail` 都可以配置为使用 mbox 或 maildir。你的 <acronym class=\"acronym\">POP</acronym>\
  \ 服务器必须能够从相应的格式读取邮件，因此也必须理解你的 <acronym class=\"acronym\">SMTP</acronym> 服务器所使用的格式。\n\
  \n## Linux 的 <acronym class=\"acronym\">POP</acronym> 服务器\n\n<acronym class=\"acronym\"\
  >POP</acronym> 服务器随每个主要的 Linux 发行版一起发布。通常使用发行版自带的工具是最简单的，但如果你替换或重新配置了 <acronym class=\"\
  acronym\">SMTP</acronym> 服务器以使用不寻常入站信箱位置或格式，你可能需要更换 <acronym class=\"acronym\">POP</acronym>\
  \ 服务器以匹配新格式。你可能使用的 <acronym class=\"acronym\">POP</acronym> 服务器包括：\n\n*   **UW <acronym\
  \ class=\"acronym\">IMAP</acronym>** — 华盛顿大学 <acronym class=\"acronym\">IMAP</acronym>\
  \ 服务器 ([`www.washington.edu/imap/`](http://www.washington.edu/imap/)) 包含一个使用 <acronym\
  \ class=\"acronym\">IMAP</acronym> 作为后端的 <acronym class=\"acronym\">POP</acronym>\
  \ 服务器。该服务器随许多 Linux 发行版发布，并使用大多数 Linux <acronym class=\"acronym\">SMTP</acronym>\
  \ 服务器默认的 mbox 格式。\n\n*   **Cyrus <acronym class=\"acronym\">IMAP</acronym>** — 与\
  \ UW <acronym class=\"acronym\">IMAP</acronym> 一样，Cyrus <acronym class=\"acronym\"\
  >IMAP</acronym> ([`asg.web.cmu.edu/cyrus/imapd/`](http://asg.web.cmu.edu/cyrus/imapd/))\
  \ 支持 <acronym class=\"acronym\">IMAP</acronym>` 协议外还支持 <acronym class=\"acronym\"\
  >POP</acronym>。该系统对文件夹使用其自己的信箱格式，并使用 mbox 处理入站邮件。\n\n*   **`nupop`** — 该服务器 ([`nupop.sourceforge.net`](http://nupop.sourceforge.net))\
  \ 编写时考虑了高流量网站的效率，因此如果你的服务器必须处理许多用户的邮件，你可能想要研究一下它。它要求邮件以 `qmail` 偏好的 maildir 格式存储。\n\
  \n*   **Courier** — Courier 服务器 ([`www.courier-mta.org`](http://www.courier-mta.org))\
  \ 是一个集成的 <acronym class=\"acronym\">POP</acronym>/<acronym class=\"acronym\">IMAP</acronym>/<acronym\
  \ class=\"acronym\">SMTP</acronym> 邮件服务器。它的 <acronym class=\"acronym\">POP</acronym>\
  \ 和 <acronym class=\"acronym\">IMAP</acronym> 服务器在独立包 `Courier-IMAP` ([`www.inter7.com/courierimap/`](http://www.inter7.com/courierimap/))\
  \ 中提供。这些服务器依赖 maildir 格式。\n\n*   **QPopper** — 尽管名字如此，但该程序包 ([`www.eudora.com/qpopper/`](http://www.eudora.com/qpopper/))\
  \ 与 `qmail` <acronym class=\"acronym\">SMTP</acronym> 服务器无关；3.0 及更早版本是商业 POP3 服务器，但\
  \ 4.0 版本是开源的。QPopper 支持 Linux 上常见的 mbox 格式。4.0 版本包含了 acronym class=\"acronym\">SSL</acronym>\
  \ 加密，如果你想尝试的话。**`qmail-pop3`** — 该程序随 `qmail` 邮件服务器 ([`www.qmail.org`](http://www.qmail.org))\
  \ 提供，并使用该服务器偏好的 maildir 格式。如果你选择使用 `qmail`，这是一个很好的起点。\n\n上述列表只是开始；在 Sourceforge\
  \ ([`www.sourceforge.net`](http://www.sourceforge.net)) 上搜索可以找到更多 <acronym class=\"\
  acronym\">POP</acronym> 服务器，其中一些属于集成包，支持 <acronym class=\"acronym\">IMAP</acronym>、<acronym\
  \ class=\"acronym\">SMTP</acronym> 和其他协议。大多数 Linux 发行版都带有 UW <acronym class=\"acronym\"\
  >IMAP</acronym>，某些还带有 Cyrus、QPopper 或其他。\n\n## <acronym class=\"acronym\">POP</acronym>\
  \ 服务器的安装与配置\n\n大多数发行版通过一个名为 `imap` 或其变体的包提供 <acronym class=\"acronym\">POP</acronym>\
  \ 服务器。<acronym class=\"acronym\">POP</acronym> 服务器通常由接字服务器运行，如第 4 章 [启动服务器] 所示。<acronym\
  \ class=\"acronym\">POP</acronym> 服务器可能会自动设置 `xinetd` 配置文件，或者你可能需要修改 `/etc/inetd.conf`\
  \ 文件来让服务器运行。你可能需要重启 `inetd` 或 `xinetd`，<acronym class=\"acronym\">POP</acronym>\
  \ 服务器才会开始响应查询。如果你安装了不是发行版自带的服务器，应该咨询其文档以了解运行它的特殊之处。\n\n默认的 UW <acronym class=\"\
  acronym\">IMAP</acronym> 和大多数其他 <acronym class=\"acronym\">POP</acronym> 服务器依赖于\
  \ Linux 的常规用户数据库进行身份验证。因此，你不需要为系统上的用户进行任何特殊配置；只要用户有常规账户，并且该账户可以通过 <acronym class=\"\
  acronym\">SMTP</acronym> 服务器接收推送邮件，<acronym class=\"acronym\">POP</acronym> 服务器就能将邮件投送给用户。用户必须在他们的\
  \ <acronym class=\"acronym\">POP</acronym> 邮件客户端中输入常规登录密码以检索邮件。\n\n\n\n\n\nIMAP\
  \ 服务器的安装和配置与 POP 服务器非常相似。如前所述，UW IMAP 随大多数 Linux 发行版一起发布，某些发行版甚至还包含了其他服务器。配置工作通常只需要安装软件包、检查或对超级服务器（super\
  \ server）配置进行细微修改，然后重启超级服务器即可。\n\n## Linux 的 IMAP 服务器\n\n在前节中描述的许多软件包（如“Linux 的\
  \ POP 服务器”）都包含了 IMAP 功能。具体来说，UW IMAP、Cyrus IMAP 和 Courier 都支持 IMAP 以及 POP。在 2002\
  \ 年，对 `http://www.sourceforge.net` 和网络搜索引擎的搜索发现了几个其他 IMAP 服务器项目，但其中许多非常新，且没有可用的代码，或者它们处于某些非常冷门的利基市场，例如允许通过\
  \ IMAP 进行网页浏览的代理服务器。\n\nUW IMAP 是 Linux 上最流行的 IMAP 服务器，它将大多数邮件文件夹以 mbox 格式作为文件存储在\
  \ Linux 用户的家目录中。如果用户在计算机上拥有常规登录账户，这可能是不尽人意的，因为用户可能无法识别这些文件的目的，从而删除或移动它们。（你可以通过编辑源代码并重新编译来更改\
  \ mbox 文件的默认位置，具体见程序文档附带的 `CONFIG` 文件描述。）相比之下，Cyrus IMAP 除了 mbox 格式的入站邮件文件夹外，所有内容都使用自己的专有格式。Courier\
  \ IMAP 使用 maildir 格式，qmail 默认使用该格式，Postfix 和 Exim 等工具也提供该选项。\n\n## IMAP 服务器的安装与配置\n\
  \n大多数发行版都带有一个名为 `imap` 或类似的包，其中 UW IMAP。你可以安装此软件包并按照第 4 章 中描述的方法，配置使用你的超级服务器来运行\
  \ IMAP 服务器。一旦运行，UW IMAP 将使用你的普通登录数据库来验证用户身份，因此任何拥有常规账户和有效密码的用户都可以使用 IMAP 读取电子邮件。与\
  \ POP 配置一样，IMAP 选项没有独立的配置文件；只需从你的超级服务器中运行它，它应该就能正常工作。\n\n# 使用 Fetchmail\n\nFetchmail\
  \ 是一个特殊的邮件程序。它既不是邮件服务器，也不是邮件阅读器，尽管它包含了这两者的元素。Fetchmail 的工作是从拉取式邮件服务器（pull mail server）获取邮件，然后将其传递给其他程序——通常情况下，Fetchmail\
  \ 使用推送式邮件协议（push mail protocol）来转发它从拉取式邮件服务器检索的邮件。最后的邮件推送通常完全在同一台计算机上发生——即 Fetchmail\
  \ 从另一台计算机获取邮件，然后将其发送给运行该程序的计算机的本地用户。不过，配置 Fetchmail 有许多变体方法。用户可以通过编辑其配置文件 `.fetchmailconf`\
  \ 来单独设置程序。此外还有一种名为 `fetchmailconf` 的 GUI Fetchmail 配置工具，可用于配置程序以完成许多常见任务。\n\n###\
  \ 注意\n\n![NOTE](img/note.gif)\n\n本章的早些章节讨论了运行拉取式邮件服务器。然而，Fetchmail 通常用于从他人运行的拉取式邮件服务器检索电子邮件。\n\
  \n## Fetchmail 在邮件投递系统中的地位\n\n拉取式邮件协议的设计允许邮件阅读器程序从邮件服务器计算机检索电子邮件。其理念是，能够运行邮件服务器的计算机可能随时可用的，因此可以运行推送式邮件服务器以便在发送者方便时接收邮件。只有终端用户的连接才可能是瞬时的或以其他方式变化的，例如具有动态\
  \ IP 地址。尽管这种泛括对于许多传统网络是正确的，但并非适用于所有网络。在某些情况下，可能希望使用拉取式邮件协议传输邮件，然后通过额外的邮件服务器程序继续发送：\n\
  \n*   **拨号 Linux 系统**——Linux 计算机通常在本地运行邮件服务器，即使计算机仅通过拨号点对点协议（PPP）连接到互联网。此类系统上的本地邮件服务器可以在多个用户之间交换邮件，或用于通知单个用户计算机生成的消息。将这些消息与到达用户\
  \ ISP 邮件账户的消息整合在一起的一种方法是：使用 POP 或 IMAP 拉取邮件，然后将其注入本地邮件队列。用户随后可以使用配置为读取邮件（而非使用 POP\
  \ 或 IMAP）的单一邮件程序读取所有（本地和远程）邮件。\n\n*   **带局域网拨号**——某些小型企业甚至家庭使用局域网（LAN），电子邮件在用户之间传递。此类局域网可能通过带有一个或多个关联邮件账户的拨号账户连接到。你可以检索拨号邮件账户，并将其路由到局域网邮件系统中相应的个人。\n\
  \n*   **多个拉取式邮件账户**——如果你有多个邮件账户，管理所有账户将是一件麻烦。与前面描述的拨号 Linux 系统一样，可以使用拉取式邮件协议从这些多个源收集邮件并将它们发送到一个账户上。（该账户可以是运行\
  \ Fetchmail 的计算机的本地账户，但也可能是远程服务器上的账户。）处理这种情况的替代方法包括使用许多邮件账户的转发功能，或使用可以处理多个账户的邮件阅读器。\n\
  \n*   **一个信箱，多个用户**——有时多个用户可能共享同一个电子邮件账户。如果你有某种方法过滤针对不同用户的邮件，你可以检索它们，使用 Fetchmail\
  \ 内置或独立程序中提供的功能进行过滤，然后将邮件发送到供相应个人使用的独立邮件队列。\n\n*   **将 POP 转换为 IMAP**——你的主外部邮件账户可能使用\
  \ POP，但如果你想使用 IMAP，并且控制着一台具有适当网络连接的 Linux 计算机，你可以从 POP 检索邮件并将其发送到本地邮件队列。如果你随后在这台计算机上运行\
  \ IMAP 服务器，你就可以使用 IMAP 读取你的邮件了。\n\n\n\n\n换句话说，拉取式邮件账户通常用于使用相当简单的本地配置的单一邮件用户。对于 `POP`\
  \ 尤其如此，它在用户使用单台计算机和仅一个邮件程序读取邮件时工作效果最好。当与账户相关的邮件设置变得复杂时，在邮件投递过程中增加另一个步骤可能会有所帮助，以便合并来自多个邮件或将邮件分离到不同的流中。`Fetchmail`\
  \ 就是允许你执行此操作的工具。\n\n重要的是，`Fetchmail` 既是拉取式邮件服务器也是推送式邮件服务器的客户端。（或者，它也可以以与推送邮件服务器无关的方式投递邮件，但此类配置较少见。）由于\
  \ `Fetchmail` 承担了双重客户端角色，它负责电子邮件获取和投递的调度，前提是它连接的两个服务器都是可用的。`Fetchmail` 可以以批模式运行（即运行、检查一个或多个拉取式邮件账户、转发获取的任何邮件并退出），也可以以守护进程模式运行（即持续运行并在你指定的间隔内执行新邮件检查）。后者的模式听起来很方便，但\
  \ `Fetchmail` 在守护模式下长时间运行时偶尔会崩溃或遇到问题，这会导致邮件获取失败。因此，我倾向于以批模式运行 `Fetchmail`，除非是在某些有限时间内使用守护模式的配置中。如果你想调度定期检查拉取式邮件账户，可以使用\
  \ `cron` 定期调度 `Fetchmail` 运行。你也可以手动运行 `Fetchmail`，仅在你决定检查时才检查邮件。\n\n## 调度邮件获取\n\n\
  无论你是作为 `cron` 任务、守护进程模式还是手动运行 `Fetchmail`，用于获取邮件的协议的拉取性质意味着你必须调度对邮件的检查；你不能简单地等待邮件到达，就像你的系统通过推送协议直接接收邮件那样。你多久检查一次以及在什么情况下检查，取决于你根据需要做的决定。如果你的邮件对时间非常敏感，你可能希望使用密密的检查计划，例如每五分钟一次。但这样做的缺点是消耗更多的网络带宽和服务器资源。它还增加了密码被拦截和滥用的可能性，特别是当你检查的是互联网上的邮件服务器而不是本地网络时。较宽间隔的检查（例如每六小时一次）对服务器的负载较小，并可能稍微降低密码被拦截的风险，但你的邮件到达你手中的延迟可能长达你选择的间隔。如果你使用\
  \ `cron` 调度邮件检查，可以根据一天中的时间调整检查间隔。例如，你可以在工作时间内每半小时检查一次邮件，但在晚上减少频率或完全不检查。\n\n如果你的\
  \ Linux 计算机与你的拉取式邮件服务器之间的网络链路是瞬时的（例如 `PPP` 连接），你可能不希望 `Fetchmail` 始终检查邮件。相反，你可能想在你的网络启动脚本中添加对\
  \ `Fetchmail` 的调用。例如，你可以在第 2 章 中描述的 `ppp-on-dialer` `PPP` 拨号脚本中添加对 `Fetchmail` 的调用。如果你配置\
  \ `Fetchmail` 以守护进程模式运行，你可能可以在 `ppp-off` 脚本中添加一行来杀死该程序。或者，你可以可以使用后续章节“配置 .fetchmailrc”中描述的\
  \ `interface` 或 `monitor` 选项，让 `Fetchmail` 仅在连接建立并在使用时尝试检索消息。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\
  \n`Fetchmail` 可以处理如 Microsoft Exchange 邮件服务器使用的挑战/响应密码验证。因此，如果你的上游供应商使用此功能，`Fetchmail`\
  \ 就可以利用它。\n\n## 使用 `fetchmailconf`\n\n`Fetchmail` 配置涉及编辑一个文件，该文件通常存储在运行程序的用户的家目录下。因此，如果需要，多个用户可以在同一台计算机上运行\
  \ `Fetchmail`。然而，如果你更喜欢使用 `GUI` 配置工具，`Fetchmail` 支持一个名为 `fetchmailconf` 的工具。我在本节中描述了这个工具；下一节“配置\
  \ .fetchmailrc”描述了 `fetchmailconf` 修改的 `Fetchmail` 配置文件。\n\n大多数发行版将 `fetchmailconf`\
  \ 包含在独立于 Fetchmail 本身的包中，因此你可能需要安装两个包来获取这两个程序。作为一个基于 Tcl/Tk 的 X 程序，`fetchmailconf`\
  \ 还需要你安装额外的库。一旦安装完成，你可以按照以下方式配置 `Fetchmail` 从拉取式邮件账户检索电子邮件：\n\n*   作为普通用户，在 xterm\
  \ 窗口输入 `fetchmailconf`。此操作将打开 Fetchmail 启动窗口，允许你点击四个按钮之一来配置 `Fetchmail`、测试 `Fetchmail`、运行\
  \ `Fetchmail` 或退出。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n你*可以*以 `root` 身份配置并运行\
  \ `Fetchmail`，但这样做与普通用户运行程序没有优势。因此，为了避免在发现 `Fetchmail` 安全问题时产生损坏，最好作为普通用户配置和运行 `Fetchmail`。一个普通用户可以获取面向几个不同用户的邮件，尽管在这种情况下获取邮件的用户必须拥有所有拉取式邮件账户的密码。这在某些情况下是可以接受的，但在其他情况下，你可能希望允许所有用户为自己的邮件账户创建\
  \ Fetchmail 配置。\n\n1.  点击 Fetchmail 启动窗口中的 Configure Fetchmail 按钮。此操作会产生一个 Fetchmail\
  \ 配置对话框，允许你从学者或专家配置模式之间进行选择。前者生成的对话框包含后者选项的子集。虽然我在此过程中没有强调仅限专家的选项，但我描述了这条路径，以便你可以看到其中一些选项是什么。\n\
  \n2.  点击 Fetchmail 配置对话框中的 Expert Configuration 按钮。结果是如图 11.2 所示。如果你想以守护模式运行 `Fetchmail`，请在\
  \ Poll Interval 字段中输入邮件检查之间的秒数（例如，每 20 分钟检查一次输入 `1200`）。如果你打算以批模式运行 `Fetchmail`，请将此字段留为\
  \ 0。Postmaster 字段是用于接收 Fetchmail 活动问题报告的本地邮件账户名称。它默认设置为运行程序的用户。你可以将窗口中间部分的大多数其他选项保持默认值，或者点击顶部的\
  \ Help 按钮以了解更多关于它们的信息。\n\n    ![Fetchmail 专家配置对话框允许你输入全局选项并命名 Fetchmail 从其检索邮件的特定邮件服务器。](img/11fig02.gif)\n\
  \n    **图 11.2. Fetchmail 专家配置对话框允许你输入全局选项并命名 Fetchmail 从其检索邮件的特定邮件服务器。**\n\n\n\n\
  \n\n### 3. Fetchmail 专家配置（Expert Configurator）对话框中最重要的项目是底部的面板，在其中你可以输入想要获取邮件的服务器名称。输入主机名并按\
  \ Enter 键，将出现名为 Fetchmail Host *Hostname* 的新对话框，如图 11.3 所示。主机名也会出现在 Fetchmail 专家配置对话框中新服务器（New\
  \ Server）数据输入字段下滚动列表中。如果你想从多个服务器获取邮件，可以输入多个服务器主机名，尽管你可能想在配置第一个服务器后再这样做。\n\n![你在\
  \ Fetchmail Host Hostname 对话框中输入关于特定拉取邮件服务器的大部分信息](img/11fig03.jpg)\n\n**图 11.3.\
  \ 你在 Fetchmail Host Hostname 对话框中输入关于特定拉取邮件服务器的大部分信息。**\n\n### 4. Fetchmail Host\
  \ *Hostname* 对话框最重要的部分是协议（Protocol）、*Hostname* 的用户输入（User Entries）以及安全（Security）部分。运行控制（Run\
  \ Controls）部分设置与获取时间相关的选项，以及如果服务器名称与之前指定的不同名称。多拨选项（Multidrop Options）区域允许你根据指定的邮件头输入规则，用此复制或重定向邮件。你可以用此让多个用户共享单个拉取邮件账户，尽管这种用法可能会导致某些类型邮件（如邮件列表）出现问题，因此不建议这样做。\n\
  \n### 5. 在 Fetchmail Host *Hostname* 的协议部分中，你指定了想要使用的拉取邮件协议。Auto 是默认值，并适用于某些服务器，但如果你知道服务器支持哪些协议，可能希望手动指定协议。你可以点击“探测支持的协议”（Probe\
  \ for Supported Protocols）来检查服务器支持 Fetchmail 的协议，但此选项并不总是正常工作。如有必要，你可以询问你的 <acronym\
  \ class=\"acronym\">ISP</acronym> 或尝试手动使用 `telnet`，如列表 11.1 和 11.2 所示。\n\n### 6.\
  \ 如果使用并非总是激活的拨号网络接口，安全部分非常有帮助。在“监控的接口”（Interface to Monitor）字段中输入接口名称（例如 `ppp0`），使\
  \ Fetchmail 仅在上次轮询以来该接口被另一个程序使用后才轮询服务器。（这种行为防止 Fetchmail 在连接会自动断开的情况下不必要地保持连接。）“轮询前检查的\
  \ IP 范围”（IP Range to Check Before Poll）字段可用于检查给定接口上是否存在 <acronym class=\"acronym\"\
  >IP</acronym> 地址。输入接口名称、<acronym class=\"acronym\">IP</acronym> 地址和子掩码并用斜杠（`/`）分隔，只有当在指定设备上存在指定范围内的\
  \ <acronym class=\"acronym\">IP</acronym> 地址时，Fetchmail 才会运行。例如，`ppp0/172.20.0.0/255.255.0.0`\
  \ 要求计算机在 `ppp0` 上拥有 172.20.0.0/16 网络中的地址后，Fetchmail 才会轮询主机。\n\n### 7. 在 *Hostname*\
  \ 的用户输入（User Entries for Hostname）部分中，在新用户（New User）字段中输入邮件服务器上的用户名并按 Enter 键。这将产生\
  \ Fetchmail User *Username* 查询 *Hostname* 对话框，如图 11.4 所示。与输入拉取邮件服务器名称一样，你也可以完成此对话框并在同一服务器上输入额外的账户以进行查询。\n\
  \n![许多 Fetchmail 选项适用于特定的拉取邮件账户](img/11fig04.jpg)\n\n**图 11.4. 许多 Fetchmail 选项适用于特定的拉取邮件账户。**\n\
  \n### 8. 在 Fetchmail User *Username* 查询 *Hostname* 对话框中要指定的最重要的项目是认证（Authentication）部分中的密码（Password）字段。从大多数服务器获取邮件时需要此信息。你还应该确保本地名称（Local\
  \ Names）字段列出了所有接收从该账户获取邮件的本地用户。默认在本地使用与拉取邮件服务器上相同的用户名，但你可能需要更改此。转发选项（Forwarding\
  \ Options）字段允许你更改接收邮件的主机——默认使用本地邮件系统，但你可以使用 Fetchmail 从一个系统获取邮件并转发到另一个系统。转发选项（Forwarding\
  \ Options）、处理选项（Processing Options）和资源限制（Resource Limits）部分允许你设置各种选项，其中大多数是自言自明的，其余的仅在某些情况下需要。当你第一次设置\
  \ Fetchmail 时，可能希望在处理选项中选择“在阅读后后删除消息”（Suppress Deletion of Messages After Reading）选项，这样你就可以在担心丢失邮件的情况下测试\
  \ Fetchmail 了。一旦你确定 Fetchmail 运行正常，就会移除此选项。远程文件夹（Remote Folders）允许你设置 Fetchmail\
  \ 在默认 `INBOX` 之外检查的 <acronym class=\"acronym\">IP</acronym> 文件夹名称。\n\n### 警告\n\n\
  ![警告](img/warning.gif)\n\nFetchmail 在其配置文件 `.fetchmailrc` 中以明文存储获取密码。如果权限设置比 0600\
  \ 更松，Fetchmail 将拒绝运行，但如果发生本地安全漏洞，这仍然是一个潜在的安全风险。至少，你应该确保用于远程访问的密码不用于本地计算机或任何其他计算机的任何用途。\n\
  \n1. 在 Fetchmail Host *Hostname.* 中点击 OK。然后你可以点击 Fetchmail 专家配置对话框中的保存（Save）来保存你的更改。要测试你的设置，在\
  \ Fetchmail 启动窗口中点击“测试 Fetchmail”（Test Fetchmail）。这会带调试选项运行 Fetchmail，因此你可以看到 Fetchmail\
  \ 发送到拉取和推送邮件服务器的命令以及 Fetchmail 收到的回复。这些信息在追踪问题时可能是无价之宝。当你的配置正常时，点击退出退出 Fetchmail。\n\
  \n### 警告\n\n![警告](img/warning.gif)\n\nTest Fetchmail 按钮虽然有助于调试，但不会保留你拉取邮件服务器上的邮件。因此，如果本地配置问题导致\
  \ Fetchmail 丢弃消息（例如，你的本地邮件服务器未运行或拒绝交付），你将丢失邮件。这就是为什么在初始测试中，你可能希望第 9 步配置 Fetchmail\
  \ 不要从拉取服务器删除邮件。\n\n对于许多人来说，通过 `fetchmailconf` 配置 Fetchmail 已经足够了。特别是在专家模式下，`fetchmailconf`\
  \ 可以设置你最需要的从一个或多个邮件账户获取邮件的选项，甚至可以从多个拉取邮件账户将邮件传递给多个本地用户。然而，某些人更倾向于编辑文本文件而不是 <acronym\
  \ class=\"acronym\">GUI</acronym> 配置工具；或者你可能想编辑文本文件进行快速更改或创建一个特别复杂的配置。无论出于什么原因你想这样做，手动编辑\
  \ `.fetchmailrc` 都是可能的。\n\n## `.fetchmailrc`\n\n当你像上述那样运行 `fetchmailconf` 时，程序会将你的选择转换为主目录中\
  \ `.fetchmailrc` 文件中的条目。因此，该文件的结构和选项反映了 `fetchmailconf` 中的内容。列表 11.3 显示了一个示例的 `.fetchmailrc`\
  \ 文件。\n\n\n\n\n\n### 示例 11.3. 一个 .fetchmailrc 文件\n\n```\n # Fetchmail file for retrieving\
  \ mail from mail.abigisp.net\n# and imap.asmallisp.com\nset postmaster rodsmith\n\
  set bouncemail\nset daemon 1800\nset syslog\npoll mail.abigisp.net with proto POP3\n\
  \    user roddericksmith there with password abc123\n    is rodsmith here fetchall\
  \ forcecr\n    smtphost speaker.rodsbooks.com\npoll imap.asmallisp.com with proto\
  \ IMAP\n    user rodsmith there with password A1B2C3\n    is rodsmith here\n```\n\
  \n与许多配置文件一样，井号（`#`）表示注释，因此 Fetchmail 忽略了前两行。列表 11.3 的剩余部分分为两部分。首先，一系列 `set` 语句设置了全局选项，其中大多数与你可以在\
  \ `fetchmailconf` 的 Fetchmail 专家配置器对话框的 Fetchmail 运行部分（图 11.2）中设置的功能有关。这些许多选项也可以使用命令行参数设置或覆盖。其次，列表\
  \ 11.3](#ch11.xhtml_ch11list03 \"Example 11.3. A sample .fetchmailrc file\") 包含了两个\
  \ `poll` 语句，每个语句都定义了要访问的远程电子邮件账户，包括从该账户检索的邮件应如何投递。（这些信息出现在 `fetchmailconf` 中的 Fetchmail\
  \ Host *Hostname* 和 Fetchmail User *Username* 查询 *Hostname* 对话框中，如图 11.3）和图 11.4。）这些\
  \ `poll` 语句的长度可能会超过一行，而*不需要*使用特殊字符来指示行延续，就像某些其他文件格式要求的那样。列表 11.3 中的换行是任意的。\n\nFetchmail\
  \ 支持大量的选项，因此我无法在这里描述所有选项。如需更多信息，请参阅 Fetchmail man 页面或其他 Fetchmail 文档。某些选项接受字符串（例如用户名）作为参数。如果此字符串包含空格，你应该用引号（`\"\
  `）将其括起来。一些较重要的全局选项包括：\n\n*   `set postmaster` `username`。此选项在其他选项未指定用户名的情况下，设置用于邮件投递的用户名。此用户还会接收某些类型的错误消息。它通常是一个普通用户，但如果你喜欢，可以使用\
  \ `postmaster` 或 `root` 作为 `username`。（所有的 SMTP 邮件服务器都应该支持一个名为 `postmaster` 的用户，用于处理有关计算机邮件系统的查询。Fetchmail\
  \ 的 `postmaster` 可能与不等于 SMTP 服务器的 `postmaster`。）`--postmaster` `username` 命令行选项会覆盖此配置选项。\n\
  \n*   `set bouncemail`。此选项告诉 Fetchmail 将错误消息发送给邮件发送者。你可以通过使用 `set no bouncemail`\
  \ 来更改此选项；在这种情况下，Fetchmail 的 `postmaster` 将接收错误消息。\n\n*   `set daemon` `interval`。此选项告诉\
  \ Fetchmail 以守护模式运行，并每隔 `interval` 秒查询一次邮件服务器。如果你想以批模式运行 Fetchmail，请省略此选项。你可以使用\
  \ `--daemon` `interval` 命令行参数来覆盖此值。使用 `--daemon 0` 命令行参数会导致 Fetchmail 执行一次抓取操作，即使它在\
  \ `.fetchmailrc` 中配置了使用守护模式。\n\n*   `set logfile` `filename`。你可以通过此选项告诉 Fetchmail\
  \ 将其活动记录到特定的文件中。\n\n*   `set syslog`。如果你想让 Fetchmail 通过系统日志记录记录其活动，可以使用此选项。\n\n\
  `poll` 语句可以非常简单，也可以非常复杂。`poll` 语句的格式如下：\n\n```\npoll server.name server-options\
  \ user-descriptions\n```\n\n关键字 `server` 与 `poll` 同义。你可以将其中任何一个替换为 `skip`，告诉 Fetchmail\
  \ 跳过此条目。你可以使用此功能轻松禁用某个条目而无需从 `.fetchmailrc` 文件中删除它。服务器选项定义了 Fetchmail 如何与服务器交互，而用户描述定义了服务器和本地的账户。你可以在这两个类别内部混合使用选项，但不能跨越类别混合使用。（手动配置\
  \ Fetchmail 时常见的问题来源之一就是混用这两类选项。）`and`、`with`、`has`、`wants` 和 `options` 单词都会被忽略，标点符号冒号（`:`）、分号（`;`）和逗号（`,`）也是如此。你可以将它们放在服务器选项或用户描述的任何位置，使\
  \ `poll` 条目更易理解。\n\n一些常见或重要的服务器选项包括：\n\n*   `proto` `name` 或 `protocol` `name`。这些同义选项指定了要使用的拉取邮件协议。`name`\
  \ 最常见的是 `POP3` 或 `IMAP`，但 Fetchmail 支持其他几种，包括一些相当冷门的拉取邮件协议。你可以使用 `-p` 命令行参数覆盖此值。\n\
  \n*   `interface` `interface`/`IP.address`/`net.mask`。你可以通过此选项指定在 Fetchmail 查询给定服务器之前必须启动的网络接口。你通过设备名称（`interface`），例如\
  \ `eth1` 或 `ppp0`；IP 地址（例如 `192.168.1.0`）以及一个决定 IP 地址范围的子网掩码来指定接口。例如，`interface\
  \ eth1/192.168.1.0/255.255.255.0` 指定在 Fetchmail 尝试连接服务器之前，计算机在 `eth1` 上必须有一个位于 192.168.1.1\
  \ 和 192.168.1.254 之间的地址。你也可以通过 `-I` 命令行选项提供此信息。\n\n*   `monitor` `interface`。此选项导致守护模式下的\
  \ Fetchmail 监控网络接口的活动。如果 Fetchmail 在上一次查询和计划中的查询之间没有检测到活动，则 Fetchmail 将跳过查询。这种行为可以防止\
  \ Fetchmail 因为自身的轮询而保持自动拨号设备开启。你也可以使用 `-M` 命令行参数来提供此信息。\n\n一些常见的用户选项包括：\n\n*   `user`\
  \ `name` 或 `username` `name`。这些选项通常标记了 `poll` 选项中用户部分的开始，并指定了一个用户名。这通常是远程用户名，但如果序列后面跟着\
  \ `here`，则用户名是本地的。关键字 `there` 强制将该用户解释为远程账户。`-u` 命令行参数会覆盖此选项。\n\n*   `pass` `pw`\
  \ 或 `password` `pw`。这些选项指定了用于拉取邮件账户的密码（`pw`）。你以明文（未加密）的形式提供密码，并以这种方式存储在配置文件中。\n\n\
  *   `is` `name` 或 `to` `name`。这些选项将拉取账户链接到本地用户。这些选项之一通常出现在拉取邮件账户描述之后（使用类似 `user`\
  \ `name` `with pass` `pw` 的序列）。\n\n\n\n\n\n*   `smtphost` `host.name` — 通常情况下，Fetchmail\
  \ 尝试使用地址 `localhost`（对应其运行的计算机）来发送邮件。不过，你可以通过此选项让程序在发送邮件时使用另一台计算机的邮件服务器。你也可以使用此选项并指定你计算机的常规主机名，在这种情况下，邮件头中对应\
  \ Fetchmail 传输的地址将包含该主机名而不是 `localhost`。`-S` 命令行参数会覆盖此设置。\n\n*   `keep` — 默认情况下，Fetchmail\
  \ 在检索消息后会将其从服务器上删除。此选项会让 Fetchmail 保留消息。你可能在测试新配置时使用它。`-k` 命令行参数是指定此选项的另一种方式。\n\n\
  *   `fetchall` — 通常情况下，Fetchmail 不会检索已经获取的消息。你可以使用此选项强制程序检索所有消息，其对应的命令行参数为 `-a`。\n\
  \n*   `forcecr` — 从技术上讲，邮件消息应该包含以回车/换行符（CR/LF）字符对结尾的行。大多数邮件程序都能容忍缺少回车的消息，少数系统会发送此类消息。然而，qmail\
  \ 推送邮件服务器无法容忍此类消息，因此 `forcecr` 选项为 qmail 用户解决了这个问题。\n\n当你指定了多个本地名称时，Fetchmail 会检查邮件头以尝试确定谁应该接收邮件。例如，如果你指定了\
  \ `jack` 和 `jill` 的本地账户，且入站邮件的目标是 `jill`，则 Fetchmail 将邮件交付给 `jill`。这就是“多收件模式”（multidrop\
  \ mode），来自同一账户的邮件可以根据邮件头以不同的方式处理。\n\n### 提示\n\n![TIP](img/tip.gif)\n\n关于 Fetchmail\
  \ 完成工作后本地投递邮件的更多选项，请查看 Procmail。该软件包在第 19 章 中介绍。你可以使用 Procmail 来帮助识别和删除不需要的消息、根据类型将入站邮件移动到邮件文件夹等。\n\
  \n## 总结\n\n拉取邮件服务器经常安装在组织的主 `SMTP` 服务器上，以便用户能够从组织内部的客户端计算机或互联网上的任何地方读取他们的邮件。使用拉取邮件协议避免了用户使用\
  \ `Telnet`、`SSH` 或或其他远程访问协议登录的需要，并允许用户在其选择的操作系统中使用邮件阅读器。目前有两种常用的拉取邮件协议：`POP`-3 和\
  \ `IMAP`-4。在两者中，`IMAP` 更强大，因为它允许在服务器上留留和组织邮件；但这一事实本身可能会增加服务器对磁盘空间和网络带宽的需求，因此你可能更倾向于使用\
  \ `POP`。\n\n Fetchmail 程序可以作为桥梁，连接你通过拉取协议访问的邮件服务器与其他邮件系统（例如局域网上的邮件服务器）。你可以使用 Fetchmail\
  \ 获取外部邮件并将其注入到本地邮件队列中，从而简化用户的邮件体验。\n\n# 第 12 章 运行新闻服务器\n\n第 11 章 讨论了拉取邮件服务器的使用，它允许用户读取专门发给他们的消息。本章涵盖了另一种类型的消息系统：`news\
  \ servers`（新闻服务器）。如果说电子邮件是一对一的往来，那么新闻（或通常被称为 Usenet 新闻或 Netnews）就是一种一对多的传输介质。用户可以向新闻服务器\
  \ `post`（发布）一条消息，该新闻服务器的任何用户都可以阅读该消息。此外，新闻服务器之间经常相互通信，导致消息在全球范围内传播。无论你运行的是仅供本地使用的新闻服务器还是连接到其他服务器的新闻服务器，新闻服务器都能为你的用户提供一个实用的组通信系统。\n\
  \n传统新闻服务器之间平等地进行通信并交换消息。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n虽然前面的讨论将新闻描述为一对多，将电子邮件描述为一对一，但电子邮件在这方面更为灵活。还有一种名为\
  \ `mailing list`（邮件列表）的工具允许创建组。邮件列表通常为特殊兴趣小组设置，且它们的订阅方法不像新闻那样标准化。\n\n# 在何时运行新闻服务器\n\
  \n新闻服务器通常有三种使用方式：\n\n*   Usenet 新闻 — 全球新闻服务器网络被称为 `Usenet`。当服务器参与 Usenet 新闻时，它会与其他新闻服务器交换一个或多个\
  \ `newsgroups`（命名的讨论论坛），形成全球性的消息系统。\n\n*   内部通信 — 组织可能会建立新闻服务器来方便组织内部成员或相关人员之间的通信。例如，在同一个项目上工作的员工或同一个班级的学生可以使用新闻服务器进行通信。同样，一些公司也会运行新闻服务器，为客户提供关于其产品的讨论。\n\
  \n*   离线新闻阅读 — 如前所述，离线新闻阅读允许个人或小组成在阅读新闻时不占用网络连接。这对于只有一条线路或按分钟计收电话费的用户通常非常理想。这种用法仅涉及少数\
  \ Usenet 新闻组的传输。\n\n\n\n新闻服务器通常将其新闻文章放在 `/var/spool/news` 目录树中。如果你在安装 Linux 时没有考虑到新闻服务器，此目录可能存在于根分区上，或者可能在一个较小的\
  \ `/var` 分区上。专用的新闻服务器通常会使用一个巨大的 `/var` 或 `/var/spool/news` 分区来存放新闻帖子。你应该确保打算用于此目的的计算机在\
  \ `/var/spool/news` 中有足够的磁盘空间，或者将溢出目录（spool directory）更改另一个具有足够空间的分区。\n\n### 提示\n\
  ![TIP](img/tip.gif)\n\n使用日志文件系统（如 `ReiserFS` 或 `XFS`）可以极大地缩短系统崩溃或断电后的启动时间，对于像新闻服务器这样拥有大硬盘的系统来说尤其如此。将新闻溢出目录保持在单独的专用分区上可以增强系统稳定性，因为涉及溢出目录的文件系统错误（该目录在本质上是瞬态的）不会影响系统的稳定性。\n\
  \n由于需要专门出出一整台计算机和以秒兆比特计的带宽来运行一个完整的 Usenet 新闻服务器，小型办公室或家庭可能不需要这样的服务器。相反，此类用户通过使用其\
  \ ISP 的新闻服务器或第三方新闻服务器会获得更好的服务。（一些流行的商业新闻提供商包括 Giganews，[`www.giganews.com`](http://www.giganews.com)；Supernews，[`www.supernews.com`](http://www.supernews.com)\
  \ 以及 NewsGuy，[`www.newsguy.com`](http://www.newsguy.com)。你可以在 [`www.newsservers.net`](http://www.newsservers.net)\
  \ 找到免费第三方新闻服务器列表。[`groups.google.com`](http://groups.google.com) 存档网站持有许多流行新闻组的存档，可以通过\
  \ Web 界面访问。）本章中对常规新闻服务器的讨论（在“运行 INN””节中）侧重于新闻服务器的内部通信使用，尽管它并没有完全忽略常规 Usenet 新闻服务器所需的数据传输配置。\n\
  \n离线阅读新闻通常通过新闻阅读器（新闻客户端程序）的功能完成，但也可以通过特殊的功能有限的新闻服务器完成，例如本章“使用 Leafnode”节中描述的 `Leafnode`\
  \ 程序。此类程序的配置要求与传统的新闻服务器不同，但从客户端的角度来看，它们的工作相似。如果你有全时的互联网连接（通过公司局域网或家庭宽带账户），你可能会发现直接使用\
  \ ISP 的新闻服务器比使用中间新闻服务器更容易。当你的互联网连接受限或成本高昂时，或者在你想要使用时你的 ISP 新闻服务器负载过重时，你可能会使用此类选项——你可以配置\
  \ `Leafnode` 在非工作时间传输消息，从而使你的新闻阅读更快。如果你的系统为一二十个阅读大部分相同新闻组的人服务，你可能还会想使用 `Leafnode`，因为在这种情况下，运行自己的服务器可以减少你的外部新闻相关数据流量。\n\
  \n## 理解 NNTP\n\n现代新闻服务器在它们之间以及新闻客户端（通常称为新闻阅读器）之间都使用一种名为网络新闻传输协议（`NNTP`）的协议。`NNTP`\
  \ 服务器通常运行在 `TCP` 端口 119。`NNTP` 设计用于在 `TCP`/`IP` 网络上传输新闻，但 Usenet 并不限于此类网络。事实上，最早的新闻服务器使用其他网络协议。因此，`NNTP`并不是唯一的新闻传输协议，但它是今天\
  \ `TCP`/`IP` 网络上最常用的协议。\n\n`NNTP` 的基本单位是 `message`（也称为 `post` 或 `article`），它是一个单份文档，通常源于一个站点的一个人（多人可能协作单条消息，但这很少见）。如前所述，消息被收集到新闻组中，但单条消息可以发布到多个新闻组。这种“跨组发布”（`cross-posting`）是不被鼓励的，特别是当它被推向几十个新闻组的极端情况时。新闻组按分级排列，具有多个类似于目录名的名称，组合成完整的新闻组名称。这些名称由点（`.`）分隔，最不具体的名称在左侧。例如，`comp.os.linux.misc`\
  \ 和 `comp.os.linux.hardware` 都是 `comp.os.linux` 层级中的新闻组，正如你预期的那样，它们关系也很密切。与这些稍远一点的新闻组是\
  \ `comp.dcom.modems`，更远的一个是 `rec.arts.sf.dune`。\n\n当用户发布消息时，新闻服务器会使用 `Message-Id`\
  \ 消息头行为消息附加一个标识代码。该代码包含了服务器生成的某种序列号，随后是服务器的名称。由于 ID 包含了服务器的名称，只要服务器能够跟踪它为消息生成的序列号，该代码就应该是唯一的。新闻服务器使用消息\
  \ ID 来跟踪它们已经过的哪些消息，从而确定哪些消息值得传输。\n\n当两个新闻服务器相互连接时，它们可以使用两种类型协议之一来传输消息。像邮件一样，这些被称为“推送”（`push`）协议和“拉取”（`pull`）协议。为了这种传输，一台服务器假设服务器的角色，另一台承担客户端的角色。在\
  \ `push` 协议中，客户端轮流告诉服务器它拥有的每条消息（使用消息 ID）。服务器随后检查其数据库并决定是否需要特定的消息。该过程重复，以此类推。此过程需要服务器执行大量工作，因为它在每次交换时都必须检查其\
  \ ID 数据库。另一种是 `pull` 协议，接收系统承担客户端的角色。该系统请求自给定日期后在服务器上的完整文章列表。客户端随后可以请求特定的消息。这种过程可能更有效，但需要仔细检查，以确保服务器不会意外交付来自私有新闻组的消息。\n\
  \n由于人们不断产生新闻消息，新闻服务器需要某种方法来清理旧消息；如果不这样做，新闻消息将很快填满服务器的硬盘（即使在完整的 Usenet 服务器上进行仔细的旧消息修剪，这种危险也是非常真实的）。通常，新闻服务器会自动过期旧消息，这意味着它们在提供一段时间的服务后会被删除。新闻服务器过期消息的频率取决于许多因素，包括可用磁盘空间、携带的新闻组数量、这些新闻组的流量以及小组的受欢迎程度。可以为不同的新闻组设置不同的保留间隔。\n\
  \n\n\n无论使用何种传输方法，无论消息过期频率如何，传输可能涉及远多于两台计算机。新闻服务器可以通过极其复杂的网络相互连接。这些连接中的每一个都被称为 `news\
  \ feed`（新闻源）。通常，规模较小或连接较差的站点会从规模较大或连接更好的站点请求新闻源。例如，小学院（Tiny College）的新闻管理员可能会向规模大得多的泛加亚大学（Pangaea\
  \ University）请求新闻源。这意味着在 news.tiny.edu 上提供的大部分新闻文章将来自 news.pangaea.edu。大部分传输将向这个方向流动，但当然，小学院的用户也可能发布新闻，因此\
  \ news.pangaea.edu 也会接受来自 news.tiny.edu 的某些消息。反之，泛加亚大学从某些其他源获取新闻源，这又引导了其他源，以此此类推。\n\
  \n不过，这种关系并不完全是线性的。例如，news.pangaea.edu 可能没有包含小学院新闻管理员想要的某些新闻组。在这种情况下，这些管理员可能会为这些新闻组寻找次级新闻源，并为其他新闻组寻找更多新闻源。泛加亚大学可能采取采取的操作来获取它需要的组。在所有这些情况下，并不是所有的新闻组都需要传输。站点可能会为了节省磁盘空间而从其源中丢弃某个新闻组甚至整个层级结构，因为该组在目标站点不受感兴趣，或者出于其他原因。\n\
  \n最终结果是一个互联的新闻服务器系统，其中几台非常大的服务器为其他大型服务器和小型服务器提供数据。这些服务器又为其他服务器提供数据，以此此类推。这些服务器都可以作为新闻客户端程序的服务器。这些新闻阅读器也使用\
  \ `NNTP`，它们可以检索和发布消息，但它们不会为其他站点提供数据。此外，新闻服务器会添加并修改一些新闻头，以指示帖子源于它，并通常标识产生消息的客户端。\n\
  \n记住新闻文章的流向是双向的非常重要的。事实上，如果没有新闻馈送“树”极端分支上的帖子，构成“树干”的大型站点将没有任何新闻可以提供给小型站点。大型站点仅作为阅读和发布到新闻组的个人产生的大量新闻的聚合点。然而，个人新闻服务器从其源接收的新闻比它们本地生成的要得多。\n\
  \n## 运行 INN\n\n如今 Linux 上最流行的传统新闻服务器是 InterNetNews (INN; [`www.isc.org/products/INN/`](http://www.isc.org/products/inn/))。此包实际上由几个共同工作的统一系统程序组成。核心程序是\
  \ `innd`，它处理新闻文章并处理传入的连接。`nnrpd` 程序接管来自新闻阅读器的连接（而不是其他新闻服务器）。INN 使用 `innxmit` 程序与其他新闻服务器建立连接，而该程序反过来使用\
  \ `nntpsend` 执行大部分工作。这些程序每个都有一个关联的配置文件；事实上，有些程序使用多个文件。最基本的配置文件通常位于 `/etc/news`，但某些文件存储在\
  \ `/var/lib/news` 或其他地方。\n\nINN 通常随 Linux 发行版附带在一个名为 `inn` 或其变体的包中。本章描述了 INN 2.2.2\
  \ 版本，但其他 INN `2.*x*` 序列包的配置几乎是完全相同的。某些发行版让 INN 依赖于 Cleanfeed，这是一个插件包，可以自动从新闻服务器中删除某些类型的垃圾邮件。（新闻组垃圾邮件是一个大问题，但大多数终端用户并没有注意到，因为今天非常流行自动垃圾邮件清理。）\n\
  \n## 获取新闻源\n\n如果你想运行一个承载部分 Usenet 的普通新闻服务器，你需要为服务器获取一个新闻源，并配置你的系统使用该源。后者的任务将在接下来的章节“控制访问”中介绍，但前者也值得花几句话。`NNTP`\
  \ 的设计使得你几乎可以使用任何现有的新闻服务器作为源。问题在于，你不能简单地在配置文件中输入随机的新闻服务器并期望源正常工作；大多数新闻服务器只接受来自选定站点的源。因此，你必须找到同意作为你的新闻源的站点。事实上，如果你无法找到一个可以提供你想要携带的所有新闻组的站点，你可能需要找到多个源。\n\
  \n寻找新闻源的一个起点是提供你网络连接的人——你的 `ISP`。假设你的连接足够快以支持完整的新闻源，你的 `ISP` 可能愿意为你的新闻服务器提供数据，或者至少给你指向某些潜在提供者的提示。然而，许多\
  \ ISP 不向其客户提供新闻源。这对于主要向家庭和小企业客户销售业务的 ISP 来说尤为常见，而且此类客户无论如何很少有足够的带宽来处理新闻源。另一个潜在的新闻源是像前面提到的那样的第三方新闻提供商。例如，NewsGuy\
  \ ([`www.newsguy.com`](http://www.newsguy.com)) 也提供新闻源以及通过新闻阅读器的访问。\n\n一个完整的新闻源可能是昂贵的，无论是从服务的现金支出，还是从支持它所需的硬件和带宽来看。例如，NewsGuy\
  \ 的源在 2002 年每月花费 1200 美元，推荐的硬件是 400MHz 的 Pentium 处理器，配备 500MB 内存和 64GB 磁盘空间，连接到至少有\
  \ 3Mbps 带宽的链路。你还需要为连接到你服务器的新闻阅读器准备带宽。当然，具体要求可能比这些高或低，取决于你想要携带的新闻组的准确组合、你想保留帖子的时长等。根据一般原则，要求每年都在增加，因此这里引用的值在不遥远的未来可能是非常是不够的。\n\
  \n## 在有限资源上提供新闻\n\n如果你想在有限的硬件和网络连接上运行普通新闻服务器，请丢弃二进制新闻组。这些新闻组携带二进制文件，这些文件被编码为作为 Usenet\
  \ 帖子传输，而这些最初是为文本设计的。二进制新闻组携带音频剪、数字化照片、程序文件等。某些携带受版权保护的材料，不应以这种方式分发。由于二进制文件比文本新闻组中的典型帖子大得多，大多数二进制新闻组在帖子大小方面都会产生巨大的流量。大多数二进制新闻组在新闻组名称中带有\
  \ `binary` 或 `binaries`。许多位于 `alt` 层级结构中，但一些位于 `comp` 或其他地方。\n\n如果你想提供完整的新闻源但缺乏托管它的资源，那么外包安排通常是一个合理的折中方案。你与新闻提供商签约，并为你的域名创建一个\
  \ `DNS` 目，指向你的新闻提供商的 `IP` 地址。从你的用户的角度来看，似乎是你正在运行一个新闻服务器，而实际上是别人在做大部分工作。许多小型 ISP\
  \ 使用外包的新闻服务器。\n\n\n\n配置 INN 涉及在许多不同的文件中设置许多选项。默认安装可能会将许多选项设置为合理的值，但你仍需要调整某些设置以适应你自己的系统。例如，你必须定义你的新闻组并设置访问控制功能。（如果你想运行一个完整的\
  \ Usenet 服务器，你的新闻源（news feed）可能会为你提供有关新闻组和访问其自身服务器的控制文件的帮助）。你还必须设置消息过期策略，并告诉 INN\
  \ 如何处理它可能收到的特殊控制消息（这些消息可能会告诉服务器取消消息、添加新群组等）。\n\n## 通用配置\n\nINN 的主配置文件是 `/etc/news/inn.conf`。该文件使用以下语法设置选项：\n\
  \n```\n optionname: value\n```\n\n许多其他 INN 配置文件也使用类似的语法。`inn.conf` 中的大多数选项可以保持默认值。最需要更改的选项是前几个。这些包括：\n\
  \n- `organization`— 此选项设置你机构的名称。此字符串将包含在通过你的新闻服务器发布的所有帖子的头信息中。\n- `server`— 这是运行\
  \ INN 的计算机名称。它至关重要，因为组成 INN 软件包的某些程序会与此计算机建立网络连接以投递文章。默认值 `localhost` 可能有效，但最好将其更改为你的真实主机名。\n\
  - `pathhost`— 每当 INN 接收到一个帖子时，服务器都会将其名称添加到名为 `Path` 的头信息行中。该头信息有助于识别消息经过了哪里，从而防止消息在不同服务器之间来回传递的循环。你应该在这里放置你新闻服务器的完全限定域名，例如\
  \ `news.threeroomco.com`。\n- `moderatormailer`— 某些新闻组是受审核的（moderated），这意味着个人（管理员）必须在帖子出现在组组之前批准它们。你可以自己跟踪审核者的邮件地址，也可以将向受审核的新闻组的帖子发送到一个集中地址，由该地址将其转发给管理员。输入\
  \ `%s@uunet.uu.net` 即可实现后者。\n- `domain`— 这是你的域的名称，例如 `threeroomco.com`。它被 INN 组件程序内部用于与\
  \ DNS 相关的函数。\n- `fromhost`— 当本地用户发布消息时，INN 会创建一个 `From` 头信息来识别发布者。该程序使用此行的值作为机器名，因此你应该在此处使用适当的内容——可能是你的域名，也可能是域内的邮件服务器。\n\
  - `complaints`— 遗憾的是，有些用户会滥用新闻。他们可能会发送垃圾邮件、发布攻击性材料、向文本新闻组发布二进制文件或其他令人讨厌的行为。`complaints`\
  \ 选项允许你指定一个显示在来自你站点的消息头信息中的电子邮件地址，以便在发生滥用时其他人可以联系你。\n\n`inn.conf` 文件中还有许多选项，但它们应该有合理的默认值。请咨询\
  \ `inn.conf` 手页获取有关这些选项含义的更多信息。\n\n## 设置新闻组\n\n`inn.conf` 文件不包含任何新闻组定义或描述。该任务由另外两个配置文件：`active`\
  \ 和 `newsgroups`，它们都存储在 `inn.conf` 中 `pathdb` 选项指定的目录中（通常为 `/var/lib/news`）。\n\n\
  `active` 文件包含系统支持的新闻组列表。新闻组在该文件中每行一个，顺序并不重要。每行包含四个字段，由空白字符分隔：\n\n```\n newsgroup.name\
  \ himark lowmark flag\n```\n\n正如你所预期的，`newsgroup.name` 是新闻组的名称，例如 `comp.os.linux.misc`。`himark`\
  \ 和 `lowmark` 字段分别指定组内编号最高和最低的帖子。对于新组，这些值分别从 `0000000000` 和 `0000000001` 开始。（INN\
  \ 将帖子存储为单独的文件，文件名是对应本地帖子编号的顺序数字。此本地帖子编号与消息 ID 无关，且不同的新闻服务器之间可能不同。）`flag` 字段包含一个指示处理新闻组方式的标志：\n\
  \n- `y`— 这是常见的标志；它表示用户可以向其帖的新闻组。\n- `n`— 带有此标志的新闻组接受新闻源的新消息，但不接受来自本地用户或新闻客户端的帖子。\n\
  - `m`— 此标志表示受审核的新闻组；本地帖子会被发送给组管理员进行审核。\n- `j`— 带有此标志的新闻组接受帖子，但不保留它们；INN 仅将新帖子传递给其源。\n\
  - `x`— 此新闻组是静态的；无论是本地还是新闻源，都不接受新帖子。\n- `=news.group`— 向此组的帖子会被移动到 `news.group` 指定的组。你可能使用此标志来重定向发布到已失效新闻组的帖子。\n\
  \n仅支持本地操作的新闻服务器可能只有几个新闻组。你可以随意给它们命名，但遵循 Usenet 的分级命名约定是有意义的。例如，你可以在以你机构命名的层次结构中创建所有本地组，如\
  \ `threeroomco.support`、`threeroomco.support.bigproduct` 和 `threeroomco.accounting`（用于\
  \ threeroom.com 的讨论组）。如果你从外部源获取新闻源，该源应该能提供一个新闻组列表，甚至是完整的 `active` 文件供你使用。\n\n当新闻服务器运行时，INN\
  \ 会修改 `active` 文件的 `himark` 和 `lowmark` 字段。随着文章的添加，`himark` 值会增加。随着旧文章过期，`lowmark`\
  \ 值会增加，尽管并非每次过期或取消都会改变它——如后文所述，文章过期并不完全按照其创建顺序。\n\n`newsgroups` 文件对于新闻服务器的日常运行不如\
  \ `active` 文件那样关键。与 `active` 文件一样，`newsgroups` 每行的第一个字段是新闻组的名称。组名称之后是一个或多个制表符以及新闻组的描述。客户端可以检索此文件帮助用户定位组，或区分名称相似的组。\n\
  \n## 控制访问\n\n大多数站点限制访问其新闻服务器以防止用并节省网络资源。这种配置有三个方面：向其他站点投放新闻、限制新闻源访问以及限制新闻客户端访问。前两个选项主要适用于你的新闻服务器与其他服务器交换时，但即使你运行的是独立新闻服务器，也应该检查它没有配置为与其他新闻服务器交换，以避免滥用。新闻客户端配置对所有新闻服务器都很\n\
  \n### 向其他站点投放新闻\n\n如果你希望用户发布的消息到达其他站点，或者你安排了将整个新闻组馈送到其他站点，你需要配置系统联系其他新闻服务器以发送消息。这通过\
  \ `/etc/news/newsfeeds` 文件控制，该文件包含以下格式的行：\n\n```\n sitename:pattern[,pattern...]:flag[,flag...]:param\n\
  ```\n\n\n\n[content]\n这些行可能会非常长，因此你可以使用反斜杠（`\\`）行延续符拆分行——任何以反斜杠结尾的行都会延续到下一行，因此你可以将一个非常长的行拆分成多行，以便于阅读和编辑。每个由冒号分隔的字段都有特定的含义，如下：\n\
  \n* `sitename` — 这是站点的代码。该代码不需要是传统的主机名；它将与另一个配置文件（稍后描述）中的主机名进行匹配。\n* `pattern` —\
  \ `pattern`（模式）是一个或多个新闻组（newsgroups）的代码。如果你只想传递少数新闻组的帖子，可以单独指定新闻组；或者你可以使用星号（`*`）通配符匹配任何字符串；例如，`comp.os.*`\
  \ 匹配 `comp.os` 层级下的所有新闻组。如果你在模式前加感叹号（`!`），则该组中的帖子将*不会*被传递，除非它们被交叉发布到另一个组。@ 符号（`@`）具有类似的含义，但交叉发布的消息也会被拦截。例如，如果你指定了\
  \ `!comp.os.linux`，那么交叉发布到 `comp.os.linux` 和 `comp.os.linux.hardware` 的消息将作为后者组的一部分被传递；但\
  \ `@comp.os.linux` 将导致消息完全不被传递。INN 按顺序应用模式，因此如果你指定了 `comp.os.*,!comp.os.linux`，INN\
  \ 将传递 `comp.os` 层级中的消息，*除了*位于 `comp.os.linux` 的消息。反转顺序将传递所有组，因为特定性较小的 `comp.os.*`\
  \ 会覆盖更具特定的 `!comp.os.linux`。\n* `flag` — 你可以包含一个或多个标志（flags），用于限制传递到远程站点的消息类型。例如，`<size`\
  \ 限制消息为小于 `size` 字节，而 `Gcount` 只有当帖子发布到少于 `count` 个新闻组时才进行传递。`newsfeeds` 手帮助页包含了附加标志的描述。\n\
  * `param` — 最后一个字段的含义取决于新闻馈的类型。它通常是存储输出馈送的文件名。在其他情况下，它可以为空。默认的 `newsfeeds` 文件包含许多被注释的示例。\n\
  \n`newsfeeds` 文件控制最终传输到另一个站点的文件的创建。`/etc/news/nntpsend.ctl` 文件控制 INN 如何连接该站点。与 `newsfeeds`\
  \ 一样，`nntpsend.ctl` 由四个冒号分隔的字段组成：\n\n```\nsitename:site.host.name:max_size:[args]\n\
  ```\n\n`sitename` 是 `newsfeeds` 文件中的站点名称，`site.host.name` 是站点的传统主机名。你可以使用 `max_size`\
  \ 参数限制单次传输的数据量；例如，`2m` 将传输限制在 2MB 或少。最后，你可以包含传递给执行实际传输的 `innxmit` 程序的可选参数。请 `innxmit`\
  \ 手帮助页获取其接受的参数的信息。\n\n只有当你向其他站点提供新闻，或者如果你想从另一个站点设置馈送时，才需要处理这些配置。为了使其真正有效，来自另一个站点的新闻馈必须接受源自你用户的帖子。如果没有这种互惠连接，你用户的帖子将无法对互联网广大读者可用，仅在本地可用。因此，尽管你可能认为自己是在接受一个外部新闻馈，但你必须配置你的系统向你的馈送者提供馈送，同时也接受它的输入。\n\
  \n### 设置新闻馈访问\n\nINN 可以控制对它自身的访问。主守护进程 `innd` 接受来自你的馈送新闻站点以及 INN 包中各种其他程序的连接。尽管\
  \ `innd` 处理来自新闻客户端的初始连接，但它尽可能将这些连接传递给另一个程序。因此，主 `innd` 连接控制文件 `/etc/news/incoming.conf`\
  \ 应该只记录本地计算机和新闻馈送站点。\n\n`incoming.conf` 文件中的基本单元是键值对（`key/value pair`），这是你指定属性及其值的方式。它们的形式为\
  \ `key` : `value`。这些配对可以被收集到 `peers` 中，即单个计算机的规范。（尽管某些键值对是全局范围的；但它们不会出现在 peers 中。）Peers\
  \ 也可以被收集到 `groups` 中。Peers 和 groups 都使用大括号（`{}`）来限定它们的范围。列表 12.1 显示了一个使用一个新闻馈的站点的典型\
  \ `incoming.conf` 文件。\n\n**示例 12.1. 一个示例 `incoming.conf` 文件**\n\n```\n## 全局设置\n\
  streaming: true\nmax-connections: 50\n# 允许从 localhost 发布 NNTP \npeer ME {\n   hostname:\
  \ \"localhost, 127.0.0.1\"\n}\n# 允许 fiveroomco.com 向我们发送大部分组\npeer fiveroom {\n\
  \   hostname: news.fiveroomco.com\n   patterns: *,!threeroomco.*\n}\n```\n\n最重要的键是\
  \ `hostname`，它指定了允许连接的的主机名。你可以使用 `patterns` 键列出可能传输的具体新闻组，并使用 `newsfeeds` 文件中的新闻组命名规范。默认是接受远程系统馈的所有新闻组。`incoming.conf`\
  \ 手帮助页描述了其他各种键。\n\n### 设置新闻阅读器访问\n\n你很可能希望授权用户能够访问你的新闻服务器。由于 `innd` 将此任务委托给另一个程序，因此你不在\
  \ `incoming.conf` 文件中配置新闻阅读器访问；相反，你使用 `/etc/news/nnrp.access` 文件为此目的。该文件的每行由五个冒号分隔的条目组成，因此：\n\
  \n```\nhostname:permissions:username:password:newsgroups\n```\n\n特定条目的含义如下：\n\n\
  * `hostname` — 这是单个主机的名称或 IP 地址，或者是使用星号通配符匹配主机范围的模式，例如 `*.threeroomco.com` 匹配 `threeroomco.com`\
  \ 域中的任何客户端。使用 IP 地址时，你可以使用 IP 地址/子掩码对，如 `172.20.0.0/16`。\n* `permissions` — 该字段包含一个或多个标志：`R`（允许读取消息）、`P`（允许发布）、`N`（客户端可以使用\
  \ `NEWNEWS` 命令）或 `L`（客户端即使在本地禁止发布的组中也可以发布）。最后两个选项覆盖特定客户端的全局设置。\n* `username` — 如果你想根据用户名和密码限制对服务器的访问，你应该在此处指定用户名；这样做后，用户在允许发布之前必须进行身份验证。加号（`+`）会导致服务器尝试使用\
  \ Linux 密码数据库进行身份验证，但这通常不起，特别是当系统配置为使用影子密码时。如果你留此字段和下一个字段为空，则读取或发布新闻不需要身份验证。\n*\
  \ `password` — 该字段包含访问新闻服务器所需的密码。留此字段和 `username` 字段为空会导致系统不要求身份验证。\n* `newsgroups`\
  \ — 如果你想限制某些主机可以访问的新闻组，可以使用类似于 `newsgroups` 文件中使用的模式来指定新闻组。留此字段为空会导致服务器向客户端提供*任何*新闻组，因此要使所有新闻组可用，条目必须以星号（`*`）结尾。\n\
  \n如果你在 `nnrp.access` 文件中包含多行，后行将优先于先行。因此，如果你想设置全局设置但为特定主机提供异常，你应该将全局设置的行放在文件的前面。\n\
  \n### 设置消息过期选项\n\n[/content]\n\n\n\n\n`/etc/news/expire.ctl` 文件控制消息的自动过期（删除）。该文件中的大多数行遵循与其他配置文件相似的模式，包含五个冒号分隔的字段：\n\
  \n```\npattern:modflag:keep:default:purge\n```\n\n这些字段的含义如下：\n\n- `pattern`—. 这是一个新闻组规范。与其他字段一样，星号（`*`）是通配符，因此\
  \ `*` 单独匹配所有新闻组，`comp.os.*` 匹配整个 `comp.os` 层次结构，以此此类推。\n- `modflag`—. 此标志是一个单字符，表示该规则仅适用于审核过的组（`M`）、仅适用于未审核的组（`U`）或所有新闻组（`A`）。\n\
  - `keep`—. 文章可能包含一个名为 `Expires` 的标头，为特定文章指定唯一的过期时间。你可以在此字段中设置一个覆盖的最小值（天）。例如，如果将\
  \ `keep` 设置为 `6`、`7.5` 或更高的值，那么设定为仅在五天后过期的文章在指定的指定的较晚日期之前才不会过期。`keep` 的值可以是浮点数，`never`\
  \ 表示该文章永远不会过期。（尽管如此，请非常谨慎使用 `never`，因为可能会导致你的硬盘迅速填满。）\n- `default`—. 这是最重要的值，因为它为没有\
  \ `Expires` 标头的文章设置过期时间，大多数新闻帖子缺少此类标头。与 `keep` 一样，你以天为单位指定值，该值可以是浮点值。值 `never` 意味着文章永远不会过期。\n\
  - `purge`—. `keep` 字段允许你在 `Expires` 标头比你预期短时对其进行覆盖。`purge` 字段允许你在 `Expires` 标头比你预期长对其进行覆盖。例如，如果你将\
  \ `purge` 设置为 `10`，并收到一篇 `Expires` 标头指定要保留 100 天的文章，你的系统将在十天后就会让该文章过期。与 `keep` 和\
  \ `default` 一样，`purge` 的值可以是浮点数或 `never`。\n\n## 持续的新闻服务器维护\n\nINN 通常作为守护进程直接运行，由\
  \ SysV 启动脚本启动，如 第 4 章“启动服务器”所示。如果你是从发行版自带的包安装的 INN，你应该可以通过运行此类启动脚本来启动它。\n\n之前描述的一些任务（例如向其他服务器发送消息和过期文章）`innd`\
  \ 在正常运行时不会自动处理。相反，这些任务由 `cron` 调用的脚本或实用程序控制。如果你是从发行版自带的包安装的 INN，可能已经创建了相应的配置文件，通过将\
  \ crontab 文件放置在 `/etc/cron.d`、`/etc/cron.*.*interval` 或其他位置来让这些任务自动发生。如果你想更改这些任务发生的频率，应该检查这些位置，或使用你的包管理器查找哪些\
  \ `cron` 文件被放置在什么位置。然后你可以修改、移动或删除这些文件，并在时创建新文件来接管这些任务。\n\n其他服务器维护任务涉及修改你的配置。例如，你可能需要添加新的新闻组、删除现有的新闻组或临时禁用对服务器的访问。这些任务可以通过\
  \ `ctlindd` 工具完成，该工具接受大量的选项。输入 `ctlindd -h` 查看其选项列表。\n\n## 使用 Leafnode\n\nINN 是一个主要用于大型\
  \ ISP 或希望提供完整新闻源的工具，也用于希望提供有限本地新闻组以支持自身活动而非提供完整新闻源的组织。但正如之前在“何时运行新闻服务器””章节中所描述的，某些人想要运行本地新闻服务器以方便自己的本地新闻阅读。这样的服务器应该只从几个新闻组检索消息，无论主互联网连接是否处于状态都能使这些消息可用，并在下一轮消息下载期间上传用户的帖子。这些计划好的消息交换每天可以发生一次或两次，在新闻服务器负载不重的时间，或者在点对点协议（`PPP`）拨号连接廉价或容易获取的时候。从原则上说，INN\
  \ 可以实现此功能，但如果作为一个仅供少数本地用户阅读少量新闻组的服务器，INN 显得大材小用了。该程序的设计还为了作为 Usenet 网络上的对等节点工作，因此你可能很难找到愿意按照你自己的计划为你提供有限数量新闻组的\
  \ `ISP`。由于这些原因，其他工具可以帮助用户执行离线新闻阅读。其中比较流行的之一是 Leafnode ([`www.leafnode.org`](http://www.leafnode.org))。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\nLeafnode 在小型或离线站点的 `NNTP` 服务器中并非孤例。其他承担类似角色的包括\
  \ NNTPCache ([`www.nntpcache.org`](http://www.nntpcache.org))、Noffel ([`noffle.sourceforge.net`](http://noffle.sourceforge.net))、`sn`\
  \ ([`infa.abo.fi/~patrik/sn/`](http://infa.abo.fi/~patrik/sn/)) 和 NewsCache ([`www.infosys.tuwien.ac.at/NewsCache/`](http://www.infosys.tuwien.ac.at/newscache/))\n\
  \n## 理解 Leafnode 的功能\n\n像 INN，Leafnode 实际上由几个程序组成。其中最重要的是：\n\n- `leafnode`—. 这是\
  \ `NNTP` 服务器程序。它从超级服务器启动，如第 4 章所示，并与同一台或不同计算机上的新闻阅读器程序通信。\n- `fetchnews`—. 该程序顾于名，负责从你的上游新闻服务器检索新闻。它还将将你的帖子传递到上游新闻服务器。你可以将其作为\
  \ `cron` 任务定期定期获取新闻，在 `PPP` 拨号脚本中运行，或手动运行。\n- `texpire`—.与普通新闻服务器一样，Leafnode 将新闻消息保留在\
  \ `/var/spool/news` 的子目录下。由于由于，Leafnode 需要删除旧消息，以防硬盘填满。这是 `texpire` 的工作。它通常作为 cron\
  \ 任务每天运行。\n- `newsq`—. 这是一个本地信息显示程序；它报告本地发布但尚未上传到你的上游新闻服务器的文章摘要。\n\nLeafnode 设计用于动态新闻组配置。如果用户尝试开始阅读某个新闻组，Leafnode\
  \ 将在下次运行 `fetchnews` 时开始获取该新闻组。如果 Leafnode 检测到一段时间内没有访问某个新闻组（默认为一周），它将停止检索该组。这意味着你可以提供一种你拥有上游提供商所有可用新闻组的错觉，而实际上并非这样做。然而，你的本地用户在尝试访问新组与看到该组可用帖子之间将经历一个获取周期的延迟。\n\
  \nLeafnode 的不寻特征之一是它不需要与上游提供商建立完整的新源安排；Leaf node（准确准确说是 `fetchnews`）向源站点将自己呈现为普通新闻阅读器。这意味着你可以结合你\
  \ ISP 的普通新闻服务器使用 Leafnode。\n\n\n\n\nLeafnode 使用的资源比普通新闻阅读器更多，也更少。在一个典型的文本新闻组中获取所有帖子，消耗的时间可能比持续连接到远程服务器的新闻阅读会要少得多。这可以减少服务器上的连接消耗（连接有时是限制的），并缩短你的在线连接时间。另一方面，从传输字节数来看，这个过程消耗的带宽远高于典型的在线阅读会，因为\
  \ Leafnode 会下载*所有*文章——即使是那些你通常不会阅读的文章。不过，如果 Leafnode 服务于几个通常阅读同一组新闻组的用户，那么 Leafnode\
  \ 传输的数据总量可能并不比单独直接连接多。\n\n在 2002 年初，Leafnode 的当前版本是 `1.9.19`。2.0 版本的工作正在进行中，该版本将添加对本地新闻组的支持，使\
  \ Leafnode 适用于运行本地新闻组的小型新闻服务器。不过，`1.9.*x` 版本并不支持此功能。\n\n需要记住，Leafnode 是为*小型*站点设计的新闻阅读器。它的扩展性并不良好，这意味着随着用户和大量新闻组的增加，Leafnode\
  \ 的性能会下降。Leafnode 在几十个客户端以内运行良好，但超过此点后就变得非常不利。如果你正经历由于服务器负载过重导致的性能问题，你应该认真考虑切换到\
  \ INN 或其他传统新闻服务器并获取完整的新源。\n\nLeafnode 的另一个问题是，它在遇到问题时可能会丢失消息。这可能导致帖子未能发布到 Usenet，或者导致现有的\
  \ Usenet 帖子无法读取。某些 `fetchnews` 选项尝试规避这些中的一些问题（如后文所述），但如果你与上游新闻服务器的连接不可靠，你可能会丢失帖子。\n\
  \n## 配置 Leafnode\n\n配置 Leafnode 需要设置三个程序：`leafnode` 服务器本身、`fetchnews` 程序以及用于过期旧新闻的\
  \ `texpire`。与这三个程序相关的功能都包含在一个通用配置文件中，但你需要设置每个程序以以自己的方式运行。如果你使用来自 Linux 发行版的 Leafnode\
  \ 软件包，可能不需要编辑许多文件即可让它们全部运行。\n\n### 通用配置设置\n\nLeafnode 的主配置文件名为 `config`，通常存储在 `/etc/leafnode`。除了以井号（`#`）开头的注释外，文件由以下形式的行组成：\n\
  \n```\n parameter = value\n```\n\n一个极简的 Leafnode 配置只需要两个参数：`server` 和 `expire`。其他参数是可选的；如果你不设置它们，它们将采用合理的默认值。更重要的参数如下：\n\
  \n* `server`—.此参数设置你的上游新闻服务器的名称，例如 `server = news.abigisp.net`。你可以通过包含多行 `server`\
  \ 来配置 Leafnode 从多个新闻服务器获取新闻。\n* `expire`—.此参数设置 Leafnode 在删除消息之前保留消息的天数。\n* `username`—.如果你的上游新闻服务器要求你输入用户名，请用此参数指定。\n\
  * `password`—.如果你需要密码才能访问你的上游新闻服务器，请用此参数输入密码。\n* `port`—.大多数新闻服务器在端口 119（默认端口）上运行，但你可以通过此参数指定另一个端口。\n\
  * `nodesc`—.大多数新闻服务器在被请求时会提供新闻组描述文件，但有几个没有。当你使用 `nodesc = 1` 参数时，Leafnode 与这些服务器配合效果最好。\n\
  * `timeout`—.当连接到新闻服务器时，`fetchnews` 通常等待十秒，然后停止尝试。你可以通过此参数设置另一个超时间隔。\n* `groupexpire\
  \ group.name`—.如果你想为不同的新闻组设置不同的文章保留间隔，可以通过此参数为特定组或组集合调整通过 `expire` 设置的值。`group.name`\
  \ 可以包含通配符，例如用于 `comp.os.linux.*` 整个 `comp.os.linux` 层级结构。\n* `maxfetch`—.Leafnode\
  \ 通过此选项限制它从任何一个组中获取的新文章数量。将此值设置得太低可能会导致问题，因为它可能经常无法获取所有新文章，从而导致落后于当前发布的内容。\n* `initialfetch`—.你可以通过此参数为新订阅的组设置一个较少的获取文章数量，其理念是：你可能不想从一个保留期为几天的服务器上获取一个新组中的所有帖子，因为这可能花费很长时间。\n\
  * `delaybody`—.Leafnode 通常在每次运行时获取所有新消息的头部和正文，但受限于 `maxfetch` 等其他选项设置的限制。然而，你可以让\
  \ Leafnode 只获取头部，然后在用户在新闻阅读器中点击消息后才获取消息正文，这表示想要阅读该消息。当读取未获取的消息时，消息正文会指示 Leafnode\
  \ 已将其标记为下载。在下次获取后，消息标题将再次作为未读消息出现，随后它将包含真实的消息。将此参数设置为 `1` 将延迟你阅读新消息的能力，但此选项可以大幅减少必须传输的数据量。\n\
  * `maxcrosspost`—.Leafnode 提供此选项作为反垃圾邮件措施。它会杀掉群发到超过指定数量组的消息。默认是接受无限的群发。\n* `maxage`—.偶尔，配置错误的新闻服务器会反复将相同的消息退回到\
  \ Usenet，导致大量的重复发布。使用此参数会导致 Leafnode 忽略超过指定天数的旧消息。这可能会限制此类问题的严重性。默认是不使用此准则。\n* `maxlines`—.你可以让\
  \ Leafnode 拒绝行数超过指定数量的消息。默认情况下，不使用此限制。\n* `minlines`—.你可以让 Leafnode 拒绝行数少于指定数量的消息。默认情况下，不使用此限制。\n\
  * `maxbytes`—.你可以让 Leafnode 拒绝字节数超过指定数量的消息。默认情况下，不使用此限制。\n* `timeout_short`—.默认情况下，当新闻组意外打开后，Leafnode\
  \ 会检索过去两天的帖子。你可以通过此参数更改此值。\n* `timeout_long`—.默认情况下，当新闻组不再被读取后，Leafnode 会检索过去七天的帖子。你可以通过此参数更改此值。\n\
  * `timeout_active`—.Leafnode 定期从上游服务器刷新其可用新闻组列表。此参数设置此类操作发生的频率，以天为单位。默认是 90 天。\n\
  * `filterfile`—.此参数设置过滤文件的路径，过滤文件的描述请见接下来的章节“过滤文章”。默认是不使用过滤器。\n\n\n\n\n\n- `hostname`\
  \ — 大多数新闻阅读器会为消息创建消息 ID（message IDs），但如果没有创建，Leafnode 会使用运行其的计算机的 `hostname` 为它们生成消息\
  \ ID。如果此 `hostname` 不恰合适，你可以使用此参数更改其值。\n\n这些参数设置了与三个主要的 Leafnode 组件程序（`leafnode`、`fetchnews`\
  \ 和 `texpire`）相关的选项。这些程序没有独立的配置文件，但它们必须以不同的方式运行。\n\n### 设置服务器\n\n如前所述，`leafnode`\
  \ 服务器程序设计为从超级服务器（如 `inetd` 或 `xinetd`）运行。此主题在第 4 章中介绍。一个典型的 Leafnode `inetd.conf`\
  \ 条目如下：\n\n```\n nntp stream tcp nowait news /usr/sbin/tcpd /usr/sbin/leafnode\n\
  ```\n\n使用 `xinetd` 的发行版通常会在其 Leafnode 软件包中包含一个适当的启动文件并放在 `/etc/xinetd.d` 下，因此你不需要创建这样的文件。不过，你可能需要启用它。无论你使用\
  \ `inetd` 还是 `xinetd`，你可能都需要在 Leafnode 服务器对客户端可用之前重启超级服务器。完成此操作后，Leafnode 服务器计算机将响应新闻读取器的请求，就像它在运行\
  \ INN 或其他完整新闻服务器包一样。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\nLeafnode 的主配置文件不包含访问控制功能。你应该在你的\
  \ `xinetd` 或 `TCP` Wrappers 配置中添加此类控制，以防止对你的 Leafnode 系统的非意外访问。\n\n## 获取新闻\n\n单次运行\
  \ `fetchnews` 程序将从你的上游新闻服务器检索新闻，前提是你已经从 `/etc/leafnode/config` 中配置了适当的新闻服务器主机名。相同的过程会将任何待处理的消息上传到你的上游新闻服务器。（你可以使用\
  \ `newsq` 命令查看你有多少条出站消息在等待，以及它们的标题、新闻组和发送者。）第一次运行 `fetchnews` 时，该操作可能会花费一些时间，因为程序将从上游服务器获取活动新闻组列表。\n\
  \n`fetchnews` 程序接受几个参数，如下所示：\n\n- `-v` — 此选项增加程序输出的详细程度。你可以增加 `v` 的数量，最多可以四个（如 `-vvvv`），以进一步增加输出的详细程度。当\
  \ `fetchnews` 未按你预期的方式工作时，这是一个非常有用的诊断工具。\n- `-x` `number` — 如果你在上一次获取操作中遇到问题，此选项将尝试重新获取之前的\
  \ `number` 篇文章。\n- `-l` — 如前所述，Leafnode 支持从多个服务器获取新闻。使用此选项强制它仅从第一个服务器获取新闻。\n- `-n`\
  \ — 此选项导致 Leafnode 不自动取消未读取新闻组的订阅。\n- `-f` — 如果你的新闻组列表看起来过时，你可以使用此选项强制 `fetchnews`\
  \ 更新列表。（程序默认每隔 90 天自动执行一次。）不过，此操作可能会花费一些时间。\n- `-P` — 此选项导致 `fetchnews` 发布其在出站队列中累积的文章，而不检索新文章。\n\
  \n### 提示\n\n![TIP](img/tip.gif)\n\n通常，在你调用两次 `fetchnews` 之前，你不会在自己的 Leafnode 新闻组中看到自己的帖子。如果你在调用\
  \ `fetchnews` 之前带上 `-P` 选项调用 `fetchnews`，你的帖子将在进行双重调用后立即出现。Leafnode 2.0 beta 版没有延迟显示的问题，因此该解决方法无效。\n\
  \n`fetchnews` 操作的真正技巧在于决定何时以及如何运行它。两种常见的选项是将其作为 cron 任务运行，以及在 `PPP` 拨号脚本中运行，例如 `ppp-on-dialer`（在第\
  \ 2 章、TCP/IP 网络配置中描述）。当你有一个持续活跃的连接时，或者你希望计算机在无人值守时（例如清晨）自动拨号并检索新闻时，将 `fetchnews`\
  \ 作为 cron 任务运行是合理的。你应该多久运行一次取决于个人偏好以及针对你的配置和上游提供商可用性的实际情况。作为 `PPP` 连接脚本的一部分运行 `fetchnews`，可以确保你在连接到互联网后不久就能阅读最新新闻。\n\
  \n## 过期旧新闻\n\n`texpire` 程序检查存储在新闻暂存目录中的新闻消息，并根据默认值或 `/etc/leafnode/config` 中设置的值删除旧消息。此任务应该定期执行，以确保你的硬盘不会被旧的新闻帖子溢满。完成此任务的常用方法是通过\
  \ cron 任务每天运行 `texpire`。某些发行版的 Leafnode 软件包包含一个适当的脚本，并放在 `/etc/cron.daily` 或其他位置，但你不应该假设你的发行版维护者已经了这一细节；你应该检查是否有此类脚本，并在必要时创建一个，或使用\
  \ `crontab` 工具来完成此工作。\n\n当 `texpire` 运行时，它根据 `threads`（线程）使文章过期。（线程是一个原始帖子及其相关的回复。）具体来说，只有当一个线程未被本地用户读取的时间超过过期时间时，`texpire`\
  \ 才会删除消息。因此，如果它们所在的线程最近被 Leafnode 客户端读取过，文章保留的时间可能会比你预期的要长。\n\n与 `fetchnews` 一，`texpire`\
  \ 接受一到四个 `-v` 选项来增加其详细程度。另一个潜在重要的 `texpire` 选项是 `-f`。通常情况下，`texpire` 依赖 Linux 存储的文件的最后访问日期来判断线程何时未被读取。添加\
  \ `-f` 会导致 `texpire` 忽略这些信息。如果你经常使用像 `tar` 这样的程序备份新闻暂存目录，你可能会这样做，因为 `tar` 在操作过程中会修改最后访问日期，导致\
  \ `texpire` 错误地认为消息正在被读取而实际上并没有。\n\n### 过滤文章\n\nLeafnode 具有根据消息头部内容匹配任意标准删除消息的功能。例如，假设你阅读的一个新闻组经常被一个从\
  \ `obnoxious@annoying.edu` 发帖的人骚扰。此用户名将出现在 `From` 头部中，因此 Leafnode 可以根据此信息过滤消息。要告诉它这样做，你必须编辑过滤文件，例如\
  \ `/etc/leafnode/filters`，该文件包含正则表达式形式的过滤信息。例如，要删除来自 `obnoxious@annoying.edu` 的帖子，你可能包含如下的一行：\n\
  \n```\n ^From:.*obnoxious@annoying\\.edu\n```\n\n此文件中的每个表达式以脱字符 (`^`) 开头，然后是要待过滤的头部行名称（在本例中为\
  \ `From:`）。点和星号字符 (`.*`) 表示可以插入任意数量的字符。字符串 `obnoxious@annoying` 可以直接表示，事实也如此；但点具有特殊含义，因此\
  \ `.edu` 中的点必须用反斜杠 (`\\`) 字符转义。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n此描述仅仅触及了正则表达式所能作用的冰角。“。使用\
  \ Procmail 过滤器” 第 19 章、推送邮件协议：SMTP 提供了关于正则表达式的更多信息。\n\n\n\n\n你必须告诉 Leafnode 在哪里找到你使用的过滤器文件。如前所述，你通过\
  \ `/etc/leafnode/config` 中的 `filterfile` 参数来实现这一点。尽管过滤器文件通常位于 `/etc/leafnode/filters`，但你也可以选择任何喜欢的其他文件名。\n\
  \n## 总结\n\n新闻服务器可能会消耗大量的资源；全球 Usenet 新闻每天涉及海量数据传输，并且这些数据会在世界各地的新闻服务器上存储数日。因此，运行新闻服务器可能需要专门一台具有几十或数百\
  \ GB 磁盘空间的机器来任此项任务。不过，如果你的需求较小，你可以在不连接到 Usenet 的情况下运行新闻服务器。此类服务器可以托管私有的本地讨论组，甚至是公共讨论组（例如，用于客户支持目的）。无论何种情况，INN\
  \ 服务器都是在 Linux 上运行新闻服务器的通常选择。该服务器由几个相互作用的多个子程序组成，并通过多个文件进行配置。你必须设置全局配置参数，定义你希望携带的新闻组，并为谁可以作为新闻源或客户端连接到新闻服务器设置策略。\n\
  \n更小规模的服务器可以使用替代的新闻服务器软件运行。例如，Leafnode 软件包旨在用于连接有限且用户较少的新闻服务器。它仅从上游提供程序获取用户阅读的新闻组，并使用用于新闻读取器的\
  \ `NNTP` 子集传输消息。因此，它非常适合小型站点，例如极小企业或家庭，只有少数用户会阅读新闻。与配置本地新闻读取器直接从 ISP 新闻服务器读取消息相比，它的主要优势是允许对几个组中的所有新闻帖子进行快速的计划传输，允许用户在空闲时阅读新闻，而无需保持网络连接活跃。\n\
  \n# 第 13 章维护远程登录服务器\n\n许多服务器为用户提供访问服务器计算机非常有限且特殊部分的权限。例如，时间服务器（参见第 10 章, 保持时间一致：时间服务器）允许客户端读取服务器的时钟，而字体服务器（参见第\
  \ 15 章, 使用字体服务器提供一致的字体）向客户端交付字体位图。然而，有一类服务器提供了对服务器计算机多或少完全的访问：远程登录服务器。这些服务器允许个人登录到计算机并在系统上运行任意程序，就像坐在控制台前一样。远程登录服务器还允许许多人同时使用单台计算机。\n\
  \n有几种不同类型的远程登录服务器在不同情况下可能有用。本章涵盖了一大类提供系统文本模式访问的远程登录服务器。使用这些程序，你可以运行基于文本的工具，如 `pine`\
  \ 或 `mutt` 邮件客户端、开发工具如 `gcc`，以及 Vi 或 Emacs 等基于文本的编辑器。但这些工具本身并不允许你运行如 KMail 或 Nedit\
  \ 等基于 X 的程序；那是 `GUI` 访问工具的工作，如在第 14 章, 使用 X 和 VNC 服务器处理 GUI 访问中所讨论的。（有时你会将文本登录工具作为建立\
  \ `GUI` 访问过程的一部分。）\n\n本章涵盖了三个特定的文本远程登录工具：`rlogind`、`Telnet` 和 `SSH`。每种工具都有其独特的特性，因此最适合特定类型的使用。这些差异涉及安全额外功能数量，`rlogind`\
  \ 提供的安全性和功能最少，而 `SSH` 最多。不过，如果你运行 Kerberos 版本的 `rlogind` 或 `Telnet`，这些服务器可以提供与 `SSH`\
  \ 相当的安全性。第 6 章, 通过 Kerberos 验证用户 涵盖了此问题。\n\n## 何时运行远程登录服务器\n\n运行远程登录服务器的主要原因是让用户从其他计算机运行任意的文本程序。你可能希望从遥远位置（甚至可能在地球的另一端）访问该计算机，或者允许几个人同时登录并使用系统。单台\
  \ Linux 计算机可以支持从一个到数千个并发用户，这取决于他们运行的程序以及计算机中使用的硬件。根据一般经验，在相当现代的硬件上，几十个用户数量的用户负载可能并不过高，只要用户不需要使用极度资源密集型的程序。\n\
  \n### 警告\n\n![警告](img/warning.gif)\n\n远程登录服务器从安全角度来看异常敏感。如果一个恶分子通过某种方式获取了仅运行例如邮局协议（`POP`）服务器的计算机的用户名和密码，并且如果该\
  \ `POP` 服务器没有安全漏洞，那么恶分子将无法对计算机造成严重伤害。当然，恶分子可能读取的电子邮件可能是敏感的，但就计算机的损害而言，影响微乎其微。然而，通过远程登录访问，恶分子有机会利用可能存在于几十或数百个其他程序中的任何漏洞或缺陷，从而造成严重破坏。出于这个原因，仔细配置你的远程登录服务器尤为重要，并勤勉地守护运行此类服务器的计算机的密码。如果你在计算机上没有使用远程登录服务器，你应该禁用它，即使你正在使用其他的远程登录服务器。\n\
  \n## 配置 `rlogind`\n\n`rlogin` 程序是多个 `r-commands` 之一。这些命令的设计是为了提供对 UNIX 系统的各种类型的远程访问（因此得名；`rlogin`\
  \ 是 remote login 的缩写）。当你运行 `rlogin` 客户端时，它尝试连接到名为 `rlogind` 或 `in.rlogind` 的服务器。`rlogind`\
  \ 的优点之一是易于配置；它的选项非常很少，所以你不需要处理复杂的配置文件。遗憾的是，按照今天的安全标准，该协议也非常原始。尽管易于使用，但控制对使用 `rlogind`\
  \ 的系统的访问可能非常棘手。\n\n## 设置 `rlogind` 启动选项\n\n`rlogind` 服务器通常从超级服务器（super server）启动，如第\
  \ 4 章所示。大多数使用 `inetd` 的发行版在它们的 `/etc/inetd.conf` 文件中包含 `rlogind` 的条目，尽管该条目默认被注释掉了。要运行该服务器，你只需要取消行的注释并重启超级服务器。使用\
  \ `xinetd` 的发行版通常在 `/etc/xinetd.d` 提供一个启动文件来启动服务器。该文件通常配置为默认禁用服务器，因此你可能需要编辑它来启用服务器，如第\
  \ 4 章](#ch04.xhtml \"第 4 章 启动服务器\")所示。\n\n`rlogind` 服务器接受影响其行为的参数。这些参数是：\n\n*  \
  \ `-n` — 正常情况下，`rlogind` 会定期检查客户端以确保其仍在工作，即使最近没有传输数据。此选项禁用了这些“心跳”消息。\n\n\n\n\n\n\
  - `-a` — 该选项本应启用更高级别的密码验证，但在许多发行版中它已失效，且作用乎其微。\n- `-h` — 通常情况下，`rlogind` 不会遵循超级用户的\
  \ `.rhosts` 文件（如果存在），后文将详细说明。此选项允许 `rlogind` 遵循该文件。\n- `-l` — 该选项禁用所有用户的 `.rhosts`\
  \ 认证。如果同时使用了 `-h` ，则超级用户除外。\n- `-L` — 该选项禁用基于 `.rhosts` 或 `hosts.equiv` 文件的认证。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n尽管 `-h`、`-l` 和 `-L` 选项都是 `rlogind` 工具\
  \ set 的官方组成部分，但在大多数默认分发的现代 Linux 发行版中它们是无效的。这是因为这些选项在使用可插拔认证模块（PAM）安全系统的系统中无法工作，而大多数现代\
  \ Linux 发行版都使用了 PAM 系统。\n\n## 理解 `rlogind` 安全\n\n所有的 r-命令都使用一种安全模型，按照今天的标准来看，这种模型充其量是过时的，最坏的情况下是完全不安全的。部分原因在于该协议是构建在*信任主机*安全模型之上，在该模型中，服务器信任客户端并交给大部分认证任务。尽管如此，仍有有限的方法增强\
  \ `rlogind` 的安全性，而使用启用 Kerberos 版本的程序会更有帮助。当用户尝试连接到 `rlogind` 服务器时，系统会采取以下步骤验证用户身份：\n\
  \n1. 服务器检查客户端连接请求的源端口。正常的 `rlogin` 客户端使用 512–1023 范围内的端口，如果源端口不在范围内，`rlogind` 将断开连接。此步骤的设计目的是防止另一个系统的普通用户通过编写修改过的\
  \ `rlogin` 客户端来绕过信任主机安全功能，因为只有 `root` 用户可以打开 1024 以下的端口。今天，个人可以很容易设置一台 Linux 计算机并获得\
  \ `root` 权限，或者从允许任何人打开 1024 以下端口的操作系统发起连接，因此这项测试的效果可能并没有想象中那么大。\n\n2. 服务器对连接的 IP\
  \ 地址进行 DNS 查找，以找到客户端的主机名。\n\n3. 如果 DNS 查找产生的主机名与服务器在同一域，或者使用了 `-a` 选项，`rlogind`\
  \ 将根据主机名查找 IP 地址。如果两个 IP 地址匹配，且未使用 `-L` 或 `-l` 选项，`rlogind` 将检查 `~/.rhosts` 和 `/etc/hosts.equiv`\
  \ 文件以确认客户端是否被信任。如果是，且远程用户在服务器上有账户，`rlogind` 将允许直接登录。\n\n4. 如果 DNS 查找得到的 IP 不匹配、使用了\
  \ `-L` 或 `-l`、或者在任何信任主机认证文件中找不到客户端，`rlogind` 将提示用户输入密码。如果用户输入正确的密码，`rlogind` 将允许进入系统。如果不是，服务器将再次提示，然后提示用户名和密码。如果用户在尝试多次后仍无法提供组合，`rlogind`\
  \ 将断开连接。\n\n上述几个步骤若干依赖于 `rlogind` 知晓连接用户的用户名。此信息静默地从一个系统传递到另一个系统，或者你可以通过 `rlogin`\
  \ 客户端的 `-l` 参数指定用户名，例如 `rlogin -l sjones`。\n\n由于 `rlogind` 使用信任主机安全模型，而且因为它信任的主机可以由用户通过其\
  \ `.rhosts` 文件进行配置，服务器的安全性可能会被多种方式绕过。这些包括破解客户端安全性、伪造受信任客户端的 IP 地址、从网络中移除受信任客户端并替换为攻击者控制的客户端，以及替换或添加目标用户账户中的\
  \ `.rhosts` 文件。其中许多攻击模式并非轻而易举，特别是在安全性本身很强的网络上，但这些因素的结合使得 `rlogind` 在大多数情况下都是一种糟糕的远程登录协议选择。尽管如此，它确实有一个优势：在许多情况下，`rlogind`\
  \ 不需要用户输入用户名或密码，因此访问服务器系统既快又方便：\n\n```\n[rodsmith@nessus rodsmith]$ rlogin speaker\n\
  Last login: Mon Aug 12 14:48:58 2002 from nessus on 4\n[rodsmith@speaker rodsmith]$\n\
  ```\n\n`rlogind` 的另一个特征是它使用未加密的数据传输。这些内容将在接下来的章节“[理解 Telnet 安全””中详细讨论。底线是，你的数据可能被拦截，因此你只应该在确信未被破解的小型私有网络上使用\
  \ `rlogind`。\n\n总之，如果需要脚本登录或其他快速访问，`rlogind` 可能值得考虑，但其薄弱的安全模型意味着你在大多数情况下应该对其保持警惕。Telnet\
  \ 协议在大多数情况下要求使用密码，而 SSH 则更加安全。\n\n## 控制 `rlogind` 访问\n\n如果你确实选择使用 `rlogind`，当从不受信任主机尝试登录时，服务器会提示输入密码。然而，你可能想使用\
  \ `rlogind` 是因为它不需要使用用户名或密码，所以你想配置它来信任某些主机。这可以通过两种方式实现：\n\n* `/etc/hosts.equiv`\
  \ — 这是一个用于设置 r-命令访问的级配置文件。如果某个系统在此列表中，该系统的任何用户都可以访问服务器上的 r-命令服务，前提是服务器上有相同的用户名，或者对用户名进行了重映射。在出现名称不匹配的情况下（例如用户\
  \ `julia` 尝试使用 `rlogin` 访问账户 `fred`），用户必须提供密码。\n\n* `~/.rhosts` — 此文件存储在用户的家目录下，指定了*针对单个用户信任的客户端*。与服务器用户用户名相同的远程用户可以以此用户的身份访问服务器资源。（可以对此用户名进行重映射，如后文所示。）如果使用此文件，用户负责在自己的账户中维护它。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n`~/.rhosts` 文件的可用意味着当你安装了 `rlogind` 等\
  \ r-命令服务器时，你作为系统管理员将系统安全的部分权限*授予了用户*。这个想法让一些管理员感到相当不安，这也是为什么被建议不要使用 `rlogind`，或者通过\
  \ TCP Wrappers 或其他手段仔细限制其用法，如后文将详细描述。\n\n这两个文件都控制所有 r-命令服务器——主要包括 `rlogin`、`rcp`\
  \ 和 `rsh`。当计算机使用 BSD LPD 打印系统（见第 9 章，打印共享）时，这些文件也控制对该系统的访问。（正如第 9 章 所述，可以使用特定的打印机配置文件来代替这些通用的\
  \ r-命令控制文件。）\n\n\n\n\n\n这两个文件的格式相同，尽管它们对某些元素的解释在两个文件之间略有不同。该文件由系列行组成，用于描述单个主机或主机组。每行的格式规定如下：\n\
  \n```\n [+|-][hostname] [username]\n```\n\n开头的加号（`+`）或减号（`-`）显式地允许或拒绝指定客户端的访问。默认是允许该主机，因此在大多数情况下可以省略加号。相比之下，减号可能用于当客户端会被前面指定了多个主机的行所允许时，显式拒绝该客户端的访问，这一点将在稍后的文中详细描述。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n使用加号时请务必非常小心。仅包含 `+`（不带主机名）的行意味着无差别地授予所有\
  \ `all` 客户端访问权限。这是一种极其糟糕的安全策略。如果你错误地在加号和主机名之间包含了一个空格，系统会将主机名解释为用户名，给任何想要尝试访问你系统的人完全访问权限。\n\
  \n你可以将主机指定为 `IP` 地址（例如 `192.168.34.56`）或主机名（例如 `gingko.threeroomco.com`）。在后的情况下，主机名可以是完全限定域名（`FQDN`），例如完整的\
  \ `gingko.threeroomco.com`；或者如果两台计算机在同一域内，也可以仅机器名（例如如果服务器与 `gingko` 在同一域内，则为 `gingko`）。如果你在名称前加上\
  \ 符号（`@`），它指向一个 `NIS` 域（你的系统必须配置为使用 `NIS` 这种形式才能生效）。指定主机最安全的形式是 `IP` 地址，随后是 FQDN，最后是仅机器名。\n\
  \n如果你在列表中包含用户名，这将赋予列出的用户对系统的完全访问权限。在 `.rhosts` 文件的情况下，这意味着列出的用户等同于 `.rhosts` 文件所在目录的主的用户。例如，假设\
  \ `julia` 在她的 `.rhosts` 文件中包含以下行：\n\n```\n 172.21.13.14 jbrown\n```\n\n此配置允许位于 `172.21.13.14`\
  \ 上的用户 `jbrown` 通过 `rlogin` 访问服务器上 `julia` 的账户，并使用 `rsh` 和 `rcp` 获得类似的权限。（从客户端的\
  \ `jbrown` 账户，用户必须使用 `-l julia` 选项通过 `rlogin` 登录服务器上 `julia` 的账户。）\n\n“对系统的完全访问”这一短语在\
  \ `/etc/hosts.equiv` 的情况下具有更强的含义。当用户名出现在此文件中时，其效果是远程系统的命名用户对服务器上的所有 `all` 账户拥有不受限制的访问权限，`root`\
  \ 除外。因此，如果将上一个示例行添加到 `/etc/hosts.equiv`，那么 `172.21.13.14` 上的 `jbrown` 就可以使用 `rlogin`\
  \ 不仅访问 `julia` 账户，还可以访问任何其他普通用户的账户。在这种语境下，“普通用户”包括如 `daemon` 等系统账户，这些账户通常可以被滥用以获取\
  \ `root` 权限。因此，在 `/etc/hosts.equiv` 中指定用户名是不安全的，除非是在显式拒绝的情况下（即行以减号开头）。\n\n除了 `~/.rhosts`\
  \ 提供的访问控制、`/etc/hosts.equiv` 以及当这些文件未能为客户端提供自动访问时的密码外，你还可以使用其他控制机制来限制对 `rlogind`\
  \ 服务器的访问。由于此服务器通常从 `inetd` 或 `xinetd` 运行，你可以使用 TCP Wrappers 或 `xinetd` 的访问控制功能来限制对特定\
  \ `IP` 地址或其他方法的访问。我强烈建议你这样做。数据包过滤防火墙规则也可以阻止对 `rlogin` 端口（`TCP` 端口 513）的访问，如第 25\
  \ 章 配置 iptables 所述。\n\n## 配置 Telnet\n\nTelnet 可能是互联网上最常见的登录协议。大多数操作系统（包括 Linux）都带有\
  \ Telnet 客户端程序（通常称为 `telnet`）。对于那少数没有自带这些程序的操作系统，也有可用的 Telnet 客户端。Telnet 服务器也相当常见，尽管它们在支持多个用户同时在线的操作系统（如\
  \ Linux、UNIX 和 VMS）上最常见。在许多方面，Telnet 是比 `rlogind` 使用的协议更复杂的协议，但作为 `TCP`/`IP` 协议，它仍然相当简单。在\
  \ Linux 上配置 Telnet 通常涉及安装一个包并确保在你的超级服务器（super server）中启用该协议，但在某些情况下你可能想要研究启动选项。你还可以配置\
  \ Telnet 操作的其他元素，例如它返回给客户端的登录消息。\n\n按照现代标准，Telnet 的安全性很弱，但它并不像 `rlogind` 那么糟糕。精确了解\
  \ Telnet 的安全性何处薄弱，可以帮助你了解何时以及不可以使用该协议，以及在必须在不理想的情况下使用时如何将风险降至最低。与 `rlogind` 一样，如果你的网络支持\
  \ Kerberos，你可以通过使用 Kerberos 版本的客户端服务器来提高 Telnet 的安全性。\n\n## 设置 Telnet 启动选项\n\n你的\
  \ Linux 发行版默认可能安装或未安装 Telnet 服务器。在分发此服务器的包名称方面几乎没有标准化。例如，它包含在 Caldera 的 `netkit-telnet`、Debian\
  \ 的 `telnetd`、Mandrake 的 `telnet-server`、Red Hat 的 `telnet-server`、Slackware 的 `tcpip1`、SuSE\
  \ 的 `nkitserv` 和 TurboLinux 的 `telnet` 中。这些中的一些（如 Debian 的 `telnetd`）仅包含 Telnet\
  \ 服务器；另一些（如 TurboLinux 的 `telnet`）将客户端和服务器包含在一个包。大多数发行版默认安装相关包，但服务器可能未配置默认运行。请参考第\
  \ 4 章有关通过你的发行版的超级服务器启动 Telnet 服务器（通常称为 `telnetd` 或 `in.telnetd`）的信息。\n\nTelnet 服务器接受许多可以修改其运行方式的参数。然而，其中某些参数涉及标准\
  \ Telnet 服务器上不可用的可选安全功能。更有用的选项包括：\n\n* `-D` `debugmode` —— 此选项用于调试 Telnet 或其连接。要使用它，你需要从控制台启动\
  \ `telnetd`，通过超级服务器。根据你输入的 `debugmode`，服务器会显示连接或数据的信息。可能的 `debugmode` 值包括 `options`\
  \ 和 `report`（都显示有关连接协商的信息），以及 `netdata` 和 `ptydata`（分别显示输入和输出数据流）。\n\n* `-h` ——\
  \ 通常情况下，`telnetd` 向客户端发送登录横幅（banner），以便用户识别计算机。此横幅有时包含你不希望随机外部人员知道的信息，例如你运行的操作系统版本。使用\
  \ `-h` 会抑制此横幅的显示，从而为入侵者提供更少的系统信息。\n\n* `-L` `loginprog` —— 默认，`telnetd` 使用 `/bin/login`\
  \ 处理登录交互。如果你喜欢，也可以指定其他程序。\n\n* `-n` —— 与 `rlogind` 类似，`telnetd` 使用心跳包检查客户端是否活跃，并在客户端不可用时关闭链接。此选项禁用心跳包的使用。\n\
  \n\n\n\n服务器支持几个额外选项，大多与数据加密和安全有关，但除了包含这些功能的较少 Telnet 服务器外，这些选项大大都没有用处。虽然存在加密版本的\
  \ Telnet，且从理论上讲，它们是安全文本模式登录的良好解决方案，但这些 Telnet 变体并没有变得流行；这一角色很大程度上已被 `SSH` 取代。不过，如果你的网络使用\
  \ Kerberos，那么与 Kerberos 一起提供的 Kerberos 版本 Telnet 非常值得研究，如第 6 章\n\n另一个文件 `/etc/issue`\
  \ 用于控制台登录显示登录消息——即在连接到计算机的键盘和显示器上进行的登录。（但基于 X 的登录不使用这两个文件；它们通过显示管理器程序处理，如在第 14 章中进行了摘要。例如，你可以将\
  \ `/etc/issue.net` 修改如下：\n\n```\n Welcome to %h.\nCurrent time is %d.\nNotice: For\
  \ authorized users only!\n```\n\n如果你的计算机名为 maple.threeroomco.com，这可能会导致以下登录横幅：\n\
  \n```\n $ telnet maple.threeroomco.com\nTrying 172.21.32.43...\nConnected to maple.threeroomco.com.\n\
  Escape character is '^]'.\nWelcome to maple.threeroomco.com.\nCurrent time is 10:57\
  \ on Monday, 12 August 2002.\nNotice: For authorized users only!\n```\n\n#### 表\
  \ 13.1. 可用于 `/etc/issue.net` 的变量\n\n| 变量 | 含义 |\n| --- | --- |\n| `%t` | 当前的 tty（对应于文本输入/输出设备的数字）\
  \ |\n| `%h` | 计算机的 FQDN |\n| `%D` | NIS 域名称，如果计算机使用 NIS |\n| `%d` | 当前日期和时间 |\n\
  | `%s` | 操作系统名称 (`Linux`) |\n| `%m` | 硬件 (CPU) 类型 |\n| `%r` | 内核版本号 |\n| `%v` |\
  \ 操作系统版本（通常不是有用的值） |\n| `%%` | 显示单个百分号 (`%`) |\n\n遗憾的是，这个图中存在一个潜在的大问题。某些发行版（特别是\
  \ Caldera、Mandrake 和 Red Hat 的某些版本）会在每次启动时重新创建 `/etc/issue` 和 `/etc/issue.net`。它们通过\
  \ `/etc/rc.d/rc.local` 脚本执行，该脚本包含类似的行（在 Mandrake 8.1 中）：\n\n```bash\n # 这将在每次启动时覆盖\
  \ /etc/issue。所以，请在此对 /etc/issue 进行任何您\n# 想要做的更改，否则在您重启动时将丢失这些更改。\n\nif [ -x /usr/bin/linux_logo\
  \ ];then\n    /usr/bin/linux_logo -c -n -f > /etc/issue\n    echo \"\" >> /etc/issue\n\
  else\n    > /etc/issue\nfi\necho \"$R\" >> /etc/issue\necho \"Kernel $(uname -r)\
  \ on $a $SMP$(uname -m) / \\l\" >> /etc/issue\n\nif [ \"$SECURITY\" -le 3];then\n\
  \    echo \"Welcome to %h\" > /etc/issue.net\n    echo \"$R\" >> /etc/issue.net\n\
  \    echo \"Kernel $(uname -r) on $a $SMP$(uname -m)\" >> /etc/issue.net\nelse\n\
  \    echo \"Welcome to Mandrake Linux\" > /etc/issue.net\n    echo \"-------------------------\"\
  \ >> /etc/issue.net\nfi\n```\n\n### 注意\n\n![NOTE](img/note.gif)\n\nRed Hat 在 7.2\
  \ 版本已转向静态的 `issue` 和 `issue.net` 文件，但 Caldera 3.1 和 Mandrake 8.1 继续从 `/etc/rc.d/rc.local`\
  \ 文件创建这些文件。\n\n这些行中的某些引用了脚本之前定义的变量。此过程允许系统创建一个比通常更动态的登录横幅，例如指定计算机中的 CPU 数量。另一方面，这意味着你想更改登录横幅，必须修改\
  \ `/etc/rc.d/ rc.local` 脚本。你可以注释掉或删除修改 `/etc/issue` 和 `/etc/issue.net` 的行并如前所述直接调整这些文件，或者你可以修改\
  \ `/etc/rc.d/rc.local` 中的行以更好地反映你的预期消息。\n\n## 理解 Telnet 安全\n\n在 `telnetd` 将 `/etc/issue.net`\
  \ 的内容（带有任何变量替换）传回客户端后，它会将连接控制权交给 `/bin/login`，或者 `telnetd` 的 `-L` `loginprog` 参数指定的任何程序。`/bin/login`\
  \ 程序用于本地文本模式登录以及远程登录。它呈现两个提示：`login:` 和 `Password:`，用户应在这些地方输入他们的用户名和密码。假设这些输入正确，`/bin/login`\
  \ 会记录上次登录的时间并将控制权传递给用户的默认 shell。\n\n这一序列操作的一个非常重要的后果，结合大多数 Telnet 服务器未配置为加密数据传输，是用户名和密码都以未加密的形式通过网络发送。即使用户看不到密码在屏幕上回显，也是如此。除非你使用\
  \ `-L` `loginprog` 来更改 `telnetd` 使用的登录程序，否则这种未加密的用户名/密码对是 `telnetd` 使用的唯一验证方法；它*没有*使用像\
  \ `rlogind` 那样的信任主机模型，甚至不依赖客户端自动传输用户名（尽管这些信息最终来自客户端计算机，某些 Telnet 客户端程序可以配置为自动发送用户名甚至密码）。\n\
  \nTelnet 登录的未加密性质是一个潜在威胁，因为数据流可能会在客户端和服务器之间被拦截。在大多数 Internet 传输中，数据包会在十个或更多路由器之间传输。如果这些路由器中的任何一个被攻破，破解它的黑客可能会记录\
  \ Telnet 会话中传输的密码，并利用它访问你的计算机。一个同样巨大的威胁是客户端或服务器本地网络进行数据包嗅探的风险。在这种方法中，计算机（可能没有参与数据传输）“嗅探”网络线路获取密码等数据。再次，结果是密码泄露。\n\
  \n\n\n\n\n除了面临登录密码泄露的风险外，Telnet 未加密本质意味着连接建立后传输的所有数据都可能被泄露。这包括被读取的私人电子邮件、被编辑的机密文件以及任何可能输入的额外密码（例如，用户连接到另一台计算机或使用\
  \ `su` 获取超级用户权限时）。这种情况也适用于 `rlogind` 和其他未加密协议（包括今天常用的大多数协议）。Telnet 和 `rlogind` 的未加密特性潜在风险可能比例如未加密的电子邮件传输更严重，因为\
  \ Telnet 和 `rlogind` 是通用协议——在一次连接中，你可能会泄露你的登录密码、私人电子邮件内容、敏感文件内容等信息。\n\n除了切换到加密协议外，你还能做什么来尽可能地减少使用\
  \ Telnet 的风险？基本准则是尽可能少地传输敏感数据。不要使用 Telnet 读取机密或或其他敏感文件或电子邮件。不要直接登录到另一台计算机，即使你是使用\
  \ Telnet 访问第一台计算机，然后又使用 `SSH` 或其他安全通道。不要使用 `su` 获取 `root` 权限。不要在任何其他计算机上使用你通过 Telnet\
  \ 访问的任何计算机的密码。Telnet 最好用于你确信未被破解的小型私有网络，例如没有互联网连接的私局域网。如果你必须使用 Telnet，请频繁更改密码（最好不要通过\
  \ Telnet 链路），以便在潜在攻击者窃取你的密码后，为他们造成更多伤害提供有限的机会窗口。\n\n# 配置 SSH\n\n在 Linux 世界中，最流行的安全登录协议是\
  \ Secure Shell (SSH)。该协议使用加密技术对传输内容进行数字“乱码”，使得任何在受攻击的路由器或通过数据包嗅探器截获的数据都无法被解密和使用，至少在\
  \ 2002 年的可用技术范围内。（从理论上讲，足够快的计算机可以破解 SSH 加密，但能够做到此点的计算机要么不存在，要么非常稀有。）\n\n在 2002 年，SSH\
  \ 服务器变得越来越常见，尽管尚未尚未普及。与其他登录服务器一样，基础的 SSH 配置相当简单，但你可能需要调整一些启动选项和配置文件，以让系统完全按照你想要的方式运行。了解\
  \ SSH 的运行原理可能帮助你更好地规划 SSH 设置以达到最佳效果。\n\n### 注意事项\n\n![NOTE](img/note.gif)\n\n2001\
  \ 年关于 SSH 名称的商标状态进行过一些讨论。在不遥远的未来，该协议可能会获得新名称，其中一个主要的实现 (SSH) 将保留其名称，而另一个主要的实现 (OpenSSH)\
  \ 将更改其名称。在我写这些文字时，这个问题似乎尚未解决决，因此我使用了产品网站上的名称。我看到的某些变更建议并不涉及更改发行包中的程序名称，仅涉及包名和文档中使用的名称。\n\
  \n## 可用的 SSH 软件\n\nLinux 有两个主要的 SSH 软件包：原始的商业 SSH ([http://www.ssh.com/products/ssh/])，由一家名为\
  \ SSH 的公司生产；以及一个开源重新实现 ([http://www.openssh.org])。许多 Linux 发行版现在都带有后者，但如果你倾向于，可以使用前者。（如果你使用原始\
  \ SSH，某些用途可能需要你购买许可证，但另一些用途则允许你免费使用该软件。详情请参阅 SSH 许可证。）带有 OpenSSH 的发行版包括 Caldera\
  \ 3.1、Debian 2.2（非美国包集中）、Mandrake 8.1、Red Hat 7.2、Slackware 7.0 和 SuSE 7.3。你可以从\
  \ OpenSSH 网站获取其他发行版的 OpenSSH，或者如果你的版本较旧，则获取最新版本。为了简单起见，我使用 SSH 指代 SSH 协议的任何实现并在引用特定软件包时根据需要进行区分。\n\
  \n### 注意事项\n\n![NOTE](img/note.gif)\n\nOpenSSH 项目与 OpenBSD 操作系统密切相关。因此，其他操作系统的 OpenSSH\
  \ 二进制文件与主网页稍有分离。\n\n[/content]。这些版本号的设计具有可比性；例如，原始 SSH 和 OpenSSH 产品在它们的 3.0.x 版本中支持大致相同的功能和加密技术。SSH\
  \ 协议第 3 版本增加了对公钥基础设施 (PKI) 的支持，由证书颁发机构“签名”的数字证书用于验证交易双方或一方的身份；智能卡支持（一种基于硬件的身份检查系统）；以及各种其他增强。由于\
  \ SSH 公司开发了该协议，他们可能在功能上略领先于 OpenSSH 项目。\n\n原始 SSH 和 OpenSSH 实现是可以互操作的，因此你不必担心你的服务器将服务的客户端是谁创建的，或者你想要连接的服务器是谁创建的。不过，特定版本的软件包之间偶尔会出现不兼容的情况，即使在同一产品系列中也是如此。协议的设计是为了协商出协议的最大共同水平，例如，SSH\
  \ 版本 2 客户端可以连接到版本 3 服务器。当然，这种连接使用的是协议的最低共同标准。\n\n大多数 OpenSSH 软件包以多个独立文件的形式提供。重要的是基础\
  \ `openssh` 包以及分别包含客户端和服务器的 `openssh-client` 和 `openssh-server` 包。要使用任何 SSH 程序，你必须安装基础包以及\
  \ `openssh-client` 和 `openssh-server` 中的至少一个。\n\nSSH 还没有 Telnet 那样普及，因此你可能需要为用户分发\
  \ SSH 客户端。这些软件包在许多操作系统上可用。你可以在 [`www.freessh.org`](http://www.freessh.org) 找到许多操作系统的免费\
  \ SSH 实现链接。Windows 和 MacOS 等操作系统的许多商业终端程序也包含了 SSH 支持。使用 SSH 的主要问题不在于寻找 SSH 客户端，而在于分发它们并说服你的用户使用它们。\n\
  \n## 理解 SSH 能力\n\n\n\n\nSSH 的功能比大多数其他远程登录协议都要丰富，其提供的帮助远不止于加密。`SSH` 有两个额外功能值得特别关注。首先，它可以在客户端和服务器之间`forward`（转发）或`tunnel`（隧道）网络端口。这意味着被转发的协议受益于\
  \ SSH 的加密。根据你的配置，这可以针对 `X` 自动完成，这样当你从运行 `X` 的系统登录 `SSH` 服务器时，可以启动 `X` 程序而无需担心设置更多选项。（#第\
  \ 14 章] 详细介绍了这些内容。）通过一些额外工作，你可以对任何你喜欢的协议建立隧道，提供该协议的加密版本。事实上，甚至可以使用点点协议（`PPP`）建立一个通过\
  \ `SSH` 隧道传输的网络接口。结果就是通过 `SSH` 实现的虚拟专用网络（`VPN`）。[VPN HOWTO 文档](http://www.linuxdoc.org/HOWTO/VPN-HOWTO.html)(http://www.linuxdoc.org/howto/vpn-howto.html)\
  \ 详细涵盖了此类配置。\n\n第二个值得提到的 `SSH` 功能是是非登录工具的直接实现。具体来说，`SSH` 软件包包含一个名为 `scp` 的程序，用于将文件从一台计算机复制到另一台计算机，如下：\n\
  \n```\n scp [[user1@]host1:]filename1 [[user2@]host2:][filename2]\n```\n\n这种语法与\
  \ `rcp` 程序非常相似，`rcp` 是 `scp` 旨在取代的 r 命令程序。与 `rcp` 或许多其他文件传输工具（如 `FTP`）不同，`scp` 以加密形式传输文件并对用户名和密码进行加密。因此，它是通过不稳定网络传输文件的良好选择。\n\
  \n对于更具交互性的文件传输，客户端可以使用 `sftp` 程序，它的工作方式与传统的文本模式 `ftp` 程序非常相似，但使用 `SSH` 加密来保护密码和传输数据的内容。一些\
  \ `GUI` `FTP` 客户端，例如 gFTP ([`gftp.seul.org`](http://www.gftp.seul.org)) 也包含了对基于\
  \ `SSH` 传输的支持，因此从功能角度来看，`SSH` 变得可以同时取代 Telnet 和 `FTP` 服务器。\n\n标准的 `SSH` 服务器程序 (`sshd`)\
  \ 同时处理 `SSH` 文本模式登录客户端（Linux 上的 `ssh`）以及通过 `scp` 或 `sftp` 发起的传输。该服务器还处理通过 `ssh`\
  \ 实现的端口转发。所有流量都通过标准的 SSH 端口 22。\n\n## 设置 SSH 启动选项\n\n无论你使用哪种协议实现，SSH 服务器传统上都是从 SysV\
  \ 启动脚本启动，如 #第 4 章所示。虽然服务器可以从超级服务器运行，但旧版本的程序在这种运行时会产生延迟，因为它们必须执行某些 CPU 密集型操作。运行在现代硬件上的现代\
  \ `sshd` 版本在从超级服务器运行时通常产生非常短的延迟，因此如果你愿意，可以重新配置 `sshd` 以这种方式运行——但请注意，必须在 `sshd` 启动命令中添加\
  \ `-i` 参数，如后文所述。\n\n`SSH` 服务器程序 `sshd` 接受许多可以修改其行为的参数。在 OpenSSH 3.0.2 中，这些参数包括：\n\
  \n* `-d`—. 服务器通常作为守护进程运行，但此选项会导致它在调试模式下运行，在该模式下它保持在前台，处理一个连接，并记录额外的调试信息。你可以通过包含最多三个\
  \ `-d` 参数来增加调试详细程度。\n* `-D`—. 此选项导致 `sshd` 不脱离守护进程，但与 `-d` 不同，它不会导致服务器进入完全调试模式。\n\
  * `-e`—. 此选项导致 `sshd` 将错误输出发送到标准错误而不是系统日志。\n* `-f` `config-file`—. 服务器通常使用 `/etc/ssh/sshd_config`\
  \ 作为其配置文件，但你可以使用此选项指定另一个文件。\n* `-i`—. 此选项告诉 `sshd` 它正在从超级服务器（如 `inetd` 或 `xinetd`）运行。如果你以这种方式运行\
  \ `sshd`，则需要此选项。\n* `-p` `port`—. 此选项设置服务器使用的端口，通常为 22。\n* `-q`—. 此选项禁用例行日志，日志通常包括连接启动、身份验证和连接终止。\n\
  * `-4`—. 通常情况下，`sshd` 接受使用 IPv4 或 IPv6 地址的连接。此选项导致它仅接受 IPv4 地址。\n* `-6`—. 此选项导致\
  \ `sshd` 仅接受来自具有 IPv6 地址系统的连接。\n\n`sshd` 还有其他选项，大多数与设置加密处理方式的细节有关。如果你需要关于这些选项的信息，请参阅\
  \ `sshd` 手页。\n\n在第一次运行 `sshd` 之前，你需要生成一些加密密钥文件。这些文件包含 SSH 算法用于识别自身和加密数据所需的密钥。大多数\
  \ `SSH` 分发版在用于服务器的 SysV 启动脚本中包含了检查并在必要时生成这些密钥的代码。如果你的系统没有这样做，请尝试使用以下命令：\n\n```\n\
  \ # ssh-keygen -q -t rsa1 -f /etc/ssh/ssh_host_key -C '' -N ''\n## ssh-keygen -q\
  \ -t rsa -f /etc/ssh/ssh_host_rsa_key -C '' -N ''\n## ssh-keygen -q -t dsa -f /etc/ssh/ssh_host_dsa_key\
  \ -C '' -N ''\n```\n\n这些命令中的每个命令都会生成两个密钥：一个仅在服务器使用的私钥，以及一个提供给客户端的公钥，以便它们向服务器发送加密数据。后者存放在一个文件中，文件名基于前者的名称，但加上\
  \ `.pub`。你可以在运行这些命令之前，检查这六个文件（`ssh_host_key`、`ssh_host_key.pub`、`ssh_host_rsa_key`、`ssh_host_rsa_key.pub`、`ssh_host_dsa_key`\
  \ 和 `ssh_host_dsa_key.pub` 通常都在 `/etc/ssh`）是否存在。如果你覆盖了现有密钥，已经配置为信任旧密钥服务器的客户端可能需要重新配置，因此不要不替换这些密钥。\n\
  \n## 调整 sshd_config 文件\n\n`sshd` 服务器通过名为 `sshd_config` 的文件控制，该文件通常位于 `/etc/ssh`。（`ssh`\
  \ 客户端程序使用相同位置的名为 `ssh_config` 的配置文件；不要混淆两者。）此文件由选项和值组成，每对单独占一行，因此：\n\n```\n Option\
  \ value\n```\n\n与许多配置文件一样，注释行以井号 (#) 开头。某些选项镜像了可以在启动时通过命令行参数设置的选项。另一些是配置文件特有的。默认配置对于许多系统来说工作得良好，但你可能想要检查你的配置文件，特别是对于某些与安全相关的选项，如\
  \ `PermitRootLogin`。最重要的 `sshd_config` 选项包括：\n\n\n\n\n- `Port` — 你可以使用此选项设置 `sshd`\
  \ 监听的端口。默认值为 `22`。\n\n- `HostKey` — 此选项告诉服务器去哪里查找主机密钥。这些密钥是在程序首次启动之前生成的私有文件，例如 `/etc/ssh/ssh_host_key`。你可以指定多个密钥文件路径。\n\
  \n- `KeyRegenerationInterval` — `SSH` 在建立连接时会协商加密密钥，此后会定期协商新密钥，以减少单个密钥被某种方式截获或解密时可能造成的损害。（这些密钥是在你首次运行\
  \ `sshd` 之前，它所需的密钥*之外**额外生成*的密钥，并且它们永远不会存储在磁盘上。）此选项设置了生成新密钥之间的时间间隔（以秒为单位）。\n\n-\
  \ `PermitRootLogin` — 在大多数安装中，此选项的默认为 `yes`。此默认设置允许 `sshd` 接受来自 `root` 用户的登录。将此值设置为\
  \ `no` 更安全，因为这样做要求潜在的入侵者必须拥有两个密码（一个用于普通用户，另一个是 `root` 密码）才能通过 `SSH` 获取系统的 `root`\
  \ 权限，假设系统上没有其他安全漏洞。如果此选项设置为 `no`，你仍然可以使用 `SSH` 远程管理系统，但必须先以普通用户登录，然后使用 `su` 或类似的程序获取\
  \ root 权限。\n\n- `IgnoreRhosts` — 此选项通常设置为 `yes`，这会导致 `sshd` 忽略 `~/.rhosts` 文件。如果此选项设置为\
  \ `no` 且 `RhostsAuthentication` 为 `yes`，则 `sshd` 允许基于类似于 `rlogind` 使用的信任主机模型进行认证。通常将此选项设置为\
  \ `no` 是不明智的。\n\n- `RhostsAuthentication` — `SSH` 使用两个选项来启用 `rlogind` 风格的信任主机认证：`IgnoreRhosts`\
  \ 是其中一个，`RhostsAuthentication` 是另一个。后者通常启用信任主机认证。通常最好将此选项设置为 `no`。\n\n- `RSAAuthentication`\
  \ — 当使用 `SSH` 协议版本 1 时，计算机可以使用公钥认证方法，该方法允许通过公钥文件在不发送密码的情况下登录。或者，你可以将公钥配合密码短语使用以提高安全性。你可以通过将此选项设置为\
  \ `yes` 来启用此功能，这是它的默认值。\n\n- `PubkeyAuthentication` — 此选项的工作方式与 `RSAAuthentication`\
  \ 类似，但适用于 `SSH` 协议版本 2。\n\n- `PasswordAuthentication` — 如果设置为 `yes`，此选项允许用户在提示时通过发送密码进行认证。这是一种常见的\
  \ `SSH` 认证方法，因此你可能应该保持开启。\n\n- `X11Forwarding` — 如前所述，`SSH` 可用于对 X 连接建立隧道。不过，客户端和服务器都必须配置执行此操作。此选项决定服务器是否转发\
  \ X 连接；将其设置为 `yes` 即可启用此功能。`SSH` 客户端必须设置类似的选项。在 `/etc/ssh/ ssh_config` 文件中，它被称为\
  \ `ForwardX11`。\n\n你有许多可以设置的额外 `SSH` 配置选项。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。其中一些与备用认证方法有关，另一些与备用认证方法有关。（注：原文中存在大量重复句式，此处已按要求完整翻译）\n\
  \n### 理解 SSH 认证\n\n从用户的角度来看，`SSH` 可能不同。取决于你使用的是 `SSH` 版本 1 还是版本 2，具体：\n\n1. 客户端尝试使用信任主机。这种尝试通常会被服务器上的设置拦截。\n\
  2. 客户端尝试使用混合。\n3. 客户端尝试使用 Rivest/Shamir/Adleman (`RSA`) 认证。如果此文件存储在服务器上，用户即可访问。\n\
  4. 如果所有其他方法失败，`SSH` 会要求输入密码。该密码以加密形式发送到服务器，解密后使用服务器的密码验证用户身份。\n\n服务器将其密钥存储在 `/etc/ssh`；它们适用于*所有*用户。`SSH`\
  \ 客户端从特定服务器接收公钥，以便以后验证服务器的身份。这些密钥存储在用户的 `~/.ssh` 目录，因此每个用户独立维护。当你第一次使用 `ssh` 连接服务器时，程序会你正在向文件中添加新密钥。（在某些配置下，可能会要求授权此操作。）如果服务器的密钥发生变化，`ssh`\
  \ 将显示一个非常明显的警告信息，如下：\n\n```\n @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n\
  @    警告：远程主机标识已更改！     @\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n\
  IT 可能有人在搞坏事！@\n```\n\n消息将继续显示详细信息，并且不会连接到服务器。如果更改是合法的，你可以通过从 `~/.ssh/known_hosts`\
  \ 或 `~/.ssh/ known_hosts2` 文件中删除服务器的条目来强制连接，取决于你使用的是 `SSH` 协议版本 1 还是版本 2。\n\n\n\n\
  \n\n与 `telnetd` 不同，`sshd` 通常不使用 `/bin/login` 程序来处理登录。相反，`sshd` 亲自执行此任务（尽管 `sshd_config`\
  \ 中的 `UseLogin` 选项会导致 `sshd` 使用 `login`）。因此，从某种意义上说，`sshd` 相当于 `telnetd` 和 `login`\
  \ 的组合。这种组合允许 `sshd` 执行公钥认证；只有跳过 `login`，此类替代认证方法才能生效。\n\n### 生成密钥以自动化登录或提高安全性\n\n\
  个人用户也可以生成密钥来唯一标识自己。这些密钥存储在客户端的 `~/.ssh` 目录下。你可以将存储处的公钥传输到服务器上的 `~/.ssh` 目录，以避免输入密码，这是\
  \ SSH 默认配置下的正常认证方法。另一种，这种方法也可以通过要求密码短语来增加安全性，密码短语结合公钥使得外部人员更难以破解你的账户。要出于上述目的使用此公钥认证，请按照以下步骤操作：\n\
  \n1. 登录到 SSH 客户端系统。\n\n2. 输入以下命令（可能需要几秒钟完成），以生成 SSH 版本 2 密钥：\n\n```\n$ ssh-keygen\
  \ -q -t rsa -f ~/.ssh/id_rsa -C '' -N ''\n```\n\n### NOTE\n\n![NOTE](img/note.gif)\n\
  \n如果你省略了 `-N ''` 选项，`ssh-keygen` 将提示你输入密码短语。如果你输入除了单个回车以外的任何内容，那么每次连接到服务器时你都必须输入此密码短语。如果你这样做，你将输入密码的需求换为了输入密码短语的需求。\n\
  \n1. 将 `~/id_rsa.pub` 文件传输到你在服务器上的账户下。（注意，该文件是公钥，它是与你在上一个命令中输入的私钥文件名一起自动生成的。）你可以使用\
  \ `scp` 命令执行此操作，如下：\n\n```\n$ scp ~/.ssh/id_rsa.pub server:.ssh/id_rsa.client\n\
  ```\n\n2. 登录服务器。你可以使用 `ssh` 执行此操作，但你需要输入密码。\n\n3. 切换到 `~/.ssh` 目录。如果你列出目录中的文件，你应该能看到一个名为\
  \ `id_rsa.client` 的文件。\n\n4. 将客户端的公钥添加到 `authorized_keys2` 文件中。你可以通过以下命令实现此操作：\n\
  \n```\n$ cat id_rsa.client >> authorized_keys2\n```\n\n现在起，你应该能够使用 SSH 协议版本 2 从客户端连接到服务器。如果你没有使用密码短语，你可以在不使用密码或密码短语的情况下登录，但如果你在创建密钥时输入了密码短语，在登录时就需要输入它。你可以通过\
  \ `-2` 选项强制 SSH 客户端使用版本 2，如下：\n\n```\n$ ssh -2 server\n```\n\n### WARNING\n\n![WARNING](img/warning.gif)\n\
  \n如果你使用公钥认证，你的私钥将变得极其敏感。如果有人获取了你客户端的私钥文件，那个人可能伪装成你。SSH 将私钥与特定的计算机绑定，因此入侵者无法从任何 IP\
  \ 地址登录，但破解者有办法绕过此类限制，这也是 `rlogind` 不太安全的原因之一。在上述方法的步骤 2 中显式省略的密码短语旨在保护私钥；没有了密码短语，私钥文件对坏分子来说并太大用。当然，使用密码短语会破坏这种方法的便利性。另一方面，使用带有密码短语的这种方法提高了安全性，因为入侵者需要同时拥有你的密码短语和私钥才能进入系统，假设服务器上不存在其他安全问题。\n\
  \n你可以遵循类似的步骤来启用 SSH 协议版本 1 的 RSA 认证。你需要对步骤执行以下更改：\n\n1. 在步骤 2 中，将 `-t rsa -f ~/.ssh/id_rsa`\
  \ 改为 `-t rsa1 -f ~/.ssh/ identity`。这生成了一个版本 1 的 RSA 公/私密钥对，而不是版本 2 密钥对。你需要对程序其余部分的文件名进行相应更改。\n\
  \n2. 在步骤 6 中，你必须将公钥从 `identity.pub` 复制到 `authorized_keys`，而不是 `authorized_keys2`。\n\
  \n3. 连接时，你应该省略 `ssh` 的 `-2` 选项，该选项强制使用版本 2 协议。\n\n这两种程序都假设服务器已配置为接受公钥（即 RSA）认证。如前所述，这些选项通过\
  \ `/etc/ssh/sshd_config` 中的 `RSAAuthentication`（版本 1）和 `PubkeyAuthentication`（版本\
  \ 2）配置选项启用。\n\n需要强调的是，不需要启用公钥认证。在默认配置下，不使用此选项的 SSH 也可以正常工作。使用公钥认证要么消除了输入密码的需求（转而依赖密钥文件的完整性），要么通过要求同时使用密钥文件和密码短语进入系统来提高安全性。\n\
  \n## 使用 `ssh-agent`\n\nSSH 认证的另一种选择是使用名为 `ssh-agent` 的工具以及相关实用。该程序管理 SSH 密钥，只需每个本地会话输入一次\
  \ SSH 密码短语。要使用它，请遵循以下步骤：\n\n1. 遵循“生成密钥以自动化登录或提高安全性”节概述的步骤，在你的 SSH 客户端系统上创建公/私密钥对，并将公钥传输到\
  \ SSH 服务器系统的账户下。你应该确保省略 `ssh-keygen` 的 `-N ''` 选项，以便用密码短语保护你的私钥。\n\n2. 在 SSH 客户端系统上，输入\
  \ `ssh-agent /bin/bash`。这会启动程序和一个新的 Bash shell。`ssh-agent` 程序会监控你从新 shell 启动的所有程序。（如果你愿意，可以使用另一个\
  \ shell。）\n\n3. 输入 `ssh-add ~/.ssh/id_rsa` 将 SSH RSA 密钥添加到 `ssh-agent` 密钥缓存中。（如果你使用版本\
  \ 1 密钥，可以省略 `~/.ssh/id_rsa` 选项。）假设你的密钥受密码短语保护，`ssh-add` 此时会询问它。\n\n此时，你应该能够像往常一样使用\
  \ SSH 客户端访问 SSH 服务器系统，但不会被要求输入密码或密码短语。`ssh-agent` 工具的工作原理是在内存中持有密钥并设置环境变量，允许 SSH\
  \ 客户端定位 `ssh-agent` 以检索这些密钥。不过，只有作为 `ssh-agent` 子进程运行的程序才能访问其密钥，这就是为什么该程序让 `ssh-agent`\
  \ 启动一个新的 Bash shell；shell 及其所有子进程（包括从 Bash 启动的 `ssh`）可以操作或检索这些密钥。\n\n\n\n\n\n对于单个连接，这种方法实际上会使事情变得复杂，因为你需要在启动\
  \ `ssh` 之前先运行 `ssh-agent` 并使用 `ssh-add` 添加密钥，而且你仍然需要输入一次密码短（pass phrase）。然而，如果你经常使用同一个密钥通过\
  \ `SSH` 登录多台计算机，或者经常登录和退出同一台系统，那么这个程序可以节省时间，因为你只需要输入一次密码短。此外，还有一些方法可以简化此流程：\n\n\
  1. 你可以编辑 `/etc/passwd` 文件通过 `ssh-agent` 调用你的 shell。例如，如果你的 shell 通常是 `/bin/bash`，你可以将其替换为\
  \ `/usr/bin/ssh-agent /bin/bash`。（你可能需要修改为 `/usr/bin/ssh-agent` 的路径，而且如果你喜欢，也可以使用其他\
  \ shell。）之后，你就不需要手动输入 `ssh-agent /bin/bash` 了；你可以登录、输入 `ssh-add ~/.ssh/id_rsa`，然后使用\
  \ `ssh` 登录远程系统。这种方法可能在你仅使用文本模式登录时有用；在 `GUI` 环境中，它会为你每个打开的 xterm 窗口创建一个新的 `ssh-agent`\
  \ 环境，这可能会适得其反。\n\n2. 如果你通过文本模式登录并输入 `startx` 启动 X，你可以将此命令更改为 `ssh-agent startx`。这让\
  \ `ssh-agent` 位于所有 X 程序的根，因此对所有程序都可用。\n\n3. 如果你使用 `GUI` 登录，可以将你的 `.xsession` 文件（或等文件）复制为另一个名称，例如\
  \ `.xsession-nosshagent`，然后创建一个新的 `.xsession` 文件，其中仅包含命令 `ssh-agent ~/.xsession-nosshagent`。这会导致\
  \ `ssh-agent` 作为你所有其他 X 进程的父进程运行，一旦使用 `ssh-add` 添加了 `SSH` 密钥，就不需要重新输入，即使你从几个不同的窗口或桌面工具启动\
  \ `SSH`。\n\n一旦你设置了 `ssh-agent` 并输入了密钥，可以通过输入 `ssh-add -l` 查看已输入的密钥，或者通过输入 `ssh-add\
  \ -d` 删除密钥。后者命令会配置系统，使得当你再次尝试使用 `SSH` 时，必须重新输入密钥（或以正常方式为 `SSH` 输入密码或密钥）。\n\n`ssh-agent`\
  \ 的优势之一是你当你连接到多个 `SSH` 服务器时不需要多次输入密钥。你必须将公钥复制到每个服务器，如“生成密钥以自动化登录或提高安全性”中的第 3 到第\
  \ 6 节所述，随后你就可以使用加载在 `ssh-agent` 中的相同私钥连接到每个系统。如果你倾向于为不同的系统使用不同的密钥，可以这样做，但你需要将它们存储在单独的文件中，并在加载每个密钥时输入关联的密码短。如果你尝试连接到一个没有存储公钥的系统，你将输入密码，就像你没有使用\
  \ `ssh-agent` 一样。\n\n## 总结\n\n远程登录服务器允许用户从几乎任何可以通过网络连接访问你系统的计算机运行程序并执行其他普通的命令行 shell\
  \ 任务。这是一个非常有用的功能，但也带来了许多安全挑战。\n\nLinux 的常用登录服务器包括 `rlogind`、`Telnet` 和 `SSH`。在这三个中，`SSH`\
  \ 是最复杂且最安全的，也是互联网上使用的登录服务器的最佳选择。（在某些情况下，安全的 Telnet 变体可能是一个例外，但这些非常罕见。）`Telnet` 和\
  \ `rlogind` 在信任的私有网络上是可以的，但如果你必须在互联网上使用它们之一，应该非常小心，因为它们的安全模型无法保护当今敌意的互联网环境下的系统。这三个服务器的基本操作配置都相当简单，但你可以添加选项以各种方式修改它们的配置。对于\
  \ `SSH` 尤其如此，它支持多种安全和其他选项。\n\n# 第 14 章. 使用 X 和 VNC 服务器处理 GUI 访问\n\n第 13 章涵盖了远程文本登录服务器（`rlogind`、`Telnet`\
  \ 和 `SSH`）。这些服务器结合其他计算机上适当的客户端程序，允许用户登录并在 Linux 计算机上运行文本程序。由于 Linux（更广义的 UNIX）支持广泛的文本工具，此类文本远程访问服务器允许用户使用\
  \ Linux 执行大多数类型的任务。然而，许多用户最习惯于使用图形用户界面（`GUI`）来运行程序。文本登录服务器本身不支持完整的 GUI，因此用户无法运行诸像\
  \ The GIMP、Netscape Navigator 或 StarOffice 这样流行的 `GUI` 程序。（少数程序，如 Emacs，同时支持 `GUI`\
  \ 和文本操作。）为了提供对 `GUI` 工具的访问，你需要运行特殊的 `GUI` 服务器。Linux 中最常见的是 X Window System（或简称为\
  \ X），它是 Linux 的原生 `GUI` 环境。X 本身具备网络能力，因此你只需要在远程系统中安装适当的 X 软件。在某些情况下，你可以将文本登录工具作为过程的一部分，但在其他情况下，你可能想要运行一种特殊的基于\
  \ X 的登录工具。另一个选项是使用名为 `Virtual Network Computing (VNC)` 的包，它提供了与 X 类似的网络 GUI 访问，但使用的是不同的协议。本章涵盖了这些选项。\n\
  \n# 何时运行 GUI 访问服务器\n\n`GUI` 访问服务器当计算机的主要功能是为多个或远程用户提供类似工作站的功能时最有用。例如，一家十二名员工的公司可能会购买一台高性能中央系统和十二台性能弱得多的计算机，这些计算机作为中央计算机的\
  \ `GUI` 终端。该中央系统可以托管 StarOffice、The GIMP、KMail 等应用程序。个人坐在性能较弱的系统前，登录中央系统并远程运行他们的应用程序。与个人坐在运行程序的工作站上的环境相比，这种配置提供了几个优势，包括：\n\
  \n*   **集中软件管理**——要添加、删除或升级应用程序，你只需要修改单台计算机上的配置。（对于许多应用程序，替代方案是使用 `NFS` 将应用程序存储在文件服务器上，但在单个用户的工作站上运行这些程序。）\n\
  \n\n\n\n\n- **更简单的的工作站配置** —— 用户就座的工作站或其他专用系统在硬件和软件方面都可以非常简单。因此，这些系统几乎不需要任何常规维护和软件更新。在某些情况下，如果你对工作站使用某种网络启动协议，你也可以以中心化的方式处理这些工作。事实上，你可以使用一种名为\
  \ `X terminal`（X 终端）的设备，这是一种支持 `X` 且几乎没有计算能力的简单计算机。\n\n- **集中硬件升级** —— 如果新的或更新的应用程序需要硬件升级，中央服务器策略允许你对单台系统进行升级，这比升级几十个甚至更多计算机要简单得多。另一方面，这使得你的工作环境极易受到中央系统硬件故障的影响。该系统必须具备比任何单一工作站都得强大的硬件。\n\
  \n- **集中存储** —— 备份单个系统通常比备份整个计算机网络要容易，因此这种方法可以简化数据备份。取决于你所使用的客户端系统，它们可能不需要备份，或者可以使用默认配置的简单备份，这些备份可能可以放在单张\
  \ CD-R 上。\n\n- **集中用户账户** —— 使用单一系统允许对用户账户进行集中化维护。用户可能只需要在一个计算机上拥有账户，这可以极大地简化网络配置。（尽管，取决于访问终端的类型和配置，用户可能也需要在它们上拥有账户。）用户可以坐在任何计算机前，登录，并看到自己的桌面和用户偏好。此功能还意味着你可以轻松替换任何人的计算机，因为计算机中几乎没有或没有任何个性化定制。实现此目标的另一种方法是使用一种中心化的登录服务器协议，例如\
  \ `Kerberos`（在第 6 章, 通过 Kerberos 验证用户 中描述）。\n\n当然，这样配置的网络也有缺点。最重要的一点是对单台计算机的依赖意味着如果该系统崩溃，所有其他计算机都实际上变得毫无用处。如果你决定这样配置网络，你应该特别勤奋地备份中央系统，并准备好备用零件以防故障。你甚至可能想配置一台计算机作为备份，准备在任何时候接管主系统的职责。\n\
  \n即使你不是在配置一个想要使用中央系统处理所有普通用户登录的大型网络，你可能也想使用 `GUI` 登录工具来允许较规模或点对点的登录。例如，你所有的用户可能都有自己的工作站，但如果他们偶尔需要从远程位置工作，这些工作站可以配置为接受远程访问，允许用户从另一个用户的工作站、家里或其他位置进行工作。\n\
  \n远程 `GUI` 访问工具通常在局域网上使用。因为 `GUI` 显示需要传输大量数据，在整个互联网上使用这些协议通常会导致显示缓慢。事实上，即使在具有 100\
  \ Mbps 硬件的局域网上，`GUI` 协议也明显比本地 `GUI` 显示慢，尽管局域网上的速度通常是可以接受的。与基于文本的远程访问工具一样，`GUI` 工具为用户提供了完全登录权限，并且必须交换密码，因此运行此类协议存在安全风险。（`VNC`\
  \ 工具加密了密码但不加密普通数据，这稍微降低了风险。使用 `SSH` 进行初始登录可以让你对密码和*所有*会话数据加密。）\n\n# 配置基础 X 访问\n\n\
  `X` 是 Linux 最常用的 `GUI` 环境。如前所述，`X` 是一个支持网络功能的 `GUI` 环境。这意味着 `X` 程序使用网络协议来显示它们的窗口、菜单、对话框等，即使它们运行在单台计算机上。理解这些协议如何工作对于理解如何配置两台计算机以允许远程\
  \ `GUI` 访问至关重要。你必须在客户端和服务器上设置选项。\n\n## 理解 X 客户端/服务器关系\n\n大多数不熟悉网络协议的人倾向于将服务器计算机认为是放在某个房间里的巨大、强大的箱子，而客户端计算机是用户坐在其面前与服务器交互的更小、性能更弱的计算机。虽然这种概念在技术上是不准确的，但通常并不具有误导性——从实际角度来看（而不是定义角度），服务器通常是处理用户就座的性能较弱系统的数据请求的强大系统。然而，在\
  \ `X` 服务器的情况下，这种概念会导致困惑，因为布局与大多数人的预想完全相反：用户坐在运行 `X` 服务器的计算机前，而这台计算机的能力可能非常有限。`X`\
  \ 客户端程序运行在比 `X` 服务器强大得多的计算机上。\n\n为了理解这种奇特的转折，从*客户端程序*的角度来看这种情况是有用的。当一个网络客户端程序进行网络交互时，它会与服务器程序建立连接以传输数据。服务器程序的存在是为了*服务*。对比一下像\
  \ WordPerfect 这样的文字处理器及其与 `NFS` 服务器的交互。（从技术上说，Linux 内核模块充当 `NFS` 客户端，但 WordPerfect\
  \ 是导致内核启动传输的程序。）你作为 WordPerfect 用户，选择选项在 `NFS` 导出上打开文件，因此 WordPerfect 启动了网络传输，告诉\
  \ `NFS` 服务器交付文件。`NFS` 服务器响应这些请求，为客户端提供网络服务。现在，假设你正通过 `X` 服务器从另一个房间的计算机上远程运行 WordPerfect。WordPerfect\
  \ 充当 `X` 协议的客户端。当 WordPerfect 打开文件选择器对话框时，它是通过请求 `X` 服务器显示对话框、文本等来实现的。对于 WordPerfect\
  \ 来说，`X` 服务器只是另一个输入/输出资源，就像 `NFS` 服务器一样。数据的最终目的是人类这一事实对程序是无关的。这种关系在图 14.1 中所示。\n\
  \n![X 服务器在用户与可能在另一台计算机上运行的程序之间提供接口。](img/14fig01.gif)\n\n**图 14.1. X 服务器在用户与可能在另一台计算机上运行的程序之间提供接口。**\n\
  \n\n\n\n\nX server 提供了一个 `GUI` 显示设备和一个或多个输入设备（通常是键盘和鼠标）。X server 本身也可以是其他服务器的客户端，例如字体服务器（在第\
  \ 15 章“通过字体服务器提供一致的字体”中进行了描述）。字体服务器在收到请求时向 X server 交付字体，允许许多 X server 为用户提供一致的一组字体。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n整体的 `VNC` 客户端/服务器关系与 X 相反，但 `VNC` 包含了它特有的 X\
  \ server。接下来的章节“理解 VNC 客户端/服务器关系”将涵盖这些细节。这种关系反转的特性意味着，当防火墙位于客户端和服务器之间时，如果一个协议失效，另一个协议可能有效。具体而言，防火墙必须允许目标指向服务器的数据包通过。因此，为保护通常被认为是客户端计算机的计算机而设计的防火墙，如果这些计算机运行\
  \ X server，可能需要特殊的配置。使用 `VNC` 时不需要这种特殊配置。`SSH` 也可以用来扭转 X 客户端/服务器关系，但方式更为微妙，正如接下来的章节“通过\
  \ SSH 隧道传输 X 连接”中分描述的那样。\n\n当你在计算机上安装 Linux 时，大多数发行版都允许你配置 X server。该服务器可以为本地计算机提供显示访问。参考图\
  \ 14.1，这种配置会让 X 客户端计算机和 X server 计算机合一。例如，图 14.1 的 X server 系统可能有它运行的自己的 X 程序。不过，Linux\
  \ 系统上的 X server 也可以用于与在其他系统上运行的 X 接口。这样做需要执行一些命令，正如稍后描述的那样。如果 X 和其他网络协议在系统中运行正常，则该系统已经具备了作为\
  \ X server 需要的所有软件，因此你不需要安装任何特殊包。\n\nX 客户端计算机（那些托管你想要远程运行的程序的计算机）不需要特殊软件；你想要运行的\
  \ X 程序就是客户端。为了确保起见，这些客户端几乎都需要各种 `GUI` 库，如 Qt 或 GTK+。不过，对于基于 `RPM` 或 Debian 包的系统，当你安装客户端程序本身时，系统会告知你是否需要安装此类库。从理论上说，你不需要在该系统上安装\
  \ X server，尽管实践中这样做通常是最简单的，因为包之间的依赖关系最终要求你安装大部分 X。从技术上讲，X server 本身是一个与屏幕、鼠标、键盘等接口的单一程序。你可能可以省略此服务器，但安装它通常对于本地测试基于\
  \ X 的程序非常方便。要使用 X server 程序，你必须拥有 X 客户端程序，无论是在本地还是另一台计算机上。\n\n## 适用于各种操作系统的 X Server\n\
  \n除了 Linux 和 UNIX，其他操作系统也提供 X server 包。如果你想将 Windows、OS/2、MacOS 或其他系统作为 `GUI` 访问终端，可以在相应的操作系统上安装适当的\
  \ X server 来实现。选项包括 XFree86（Windows 使用 [`xfree86.cygwin.com`](http://xfree86.cygwin.com)，OS/2\
  \ 使用 [`ais.gmd.de/~veit/os2/xf86os2.html`](http://ais.gmd.de/~veit/os2/xf86os2.html)，或\
  \ MacOS X 使用 [`mrcla.com/XonX/`](http://mrcla.com/xonx/)）、用于 Windows 和 MacOS Classic\
  \ 的 MI/X（[`www.microimages.com/freestuf/mix/`](http://www.microimages.com/freestuf/mix/)）、用于\
  \ Windows 的 Exceed ([`www.hcl.com/products/nc/exceed/`](http://www.hcl.com/products/nc/exceed/))、Windows\
  \ 的 Xmanager ([`www.netsarang.com/products/xmanager.html`](http://www.netsarang.com/products/xmanager.html))\
  \ 以及用于 MacOS X 的 Xtools ([`www.tenon.com/products/xtools/`](http://www.tenon.com/products/xtools/))。不过，这个列表并不完整，特别是对于\
  \ Windows；有许多可用于访问 Linux 系统的 X server。MicroImages 在 [`www.microimages.com/mix/prices.htm`](http://www.microimages.com/mix/prices.htm)\
  \ 维护了一份比较表。\n\n正如前面提到的，还有一种被称为 X 终端的专用硬件，它们支持 X、TCP/IP 网络且几乎不支持其他功能。Network Computing\
  \ (NCD; [`www.ncd.com`](http://www.ncd.com)) 和 Hewlett Packard ([`www.hp.com`](http://www.hp.com))\
  \ 等公司销售 X 终端。这些设备通常要求网络上的计算机运行简单的易文件传输协议 (TFTP) 服务器，以便它们获取关键的启动文件。（不过，TFTP 服务器计算机不需要与你打算使用的计算机是同一台。）X\
  \ 终端通常要求你打算运行的系统运行一个登录服务器，正如接下来的章节“配置登录服务器以接受连接”中描述的那样。\n\n## 配置 X Server 以接受客户端访问\n\
  \nX server 与其他类型的服务器一样，必须响应客户端发起的连接。然而，大多数 Linux 发行版的设计前提是该系统被用作工作站或其他协议的服务器，而不是\
  \ X 终端。因此，要将 Linux 系统用作除本地运行程序以外的任何用途的 X server，你必须重新配置系统以接受来自其他系统的 X 连接。实现此点有两种主要方法：你可以在\
  \ X server 上使用 `xhost`，或者在 X server 和 X 客户端上均使用 `xauth`。\n\n## 使用 `xhost`\n\n授予\
  \ X server 访问的一种方法是使用 `xhost` 程序允许特定的远程计算机访问你的 X 显示。在 xterm 或类似的命令行提示符窗口中，你可以输入类似下方的命令：\n\
  \n```\n$ xhost +biggie.threeroomco.com\n```\n\n此命令指示 X server 接受来自 biggie.threeroomco.com\
  \ 的显示器连接。因此，该计算机上的任何用户都可以连接到你的 X server 以显示窗口、接受键盘和鼠标输入等。如果你省略了主机名（仅输入 `xhost +`），你的\
  \ X server 将接受来自*任何*源的连接。\n\n### 注意\n\n大多数用于 Windows、MacOS 以及非 UNIX 系统的 X server\
  \ 默认配置为接受来自任何地方的 X 连接，就像 Linux 中的 `xhost +` 作用一样。\n\n\n\n\n\n使用 `xhost` 将你的 X 服务器开放给其他系统的连接既简单又方便，在低安全环境下可能是可以接受的。然而，它也存在问题。最重要的是，它没有为你提供任何限制远程系统特定用户访问的方法。如果你想在一个有许多用户的系统上运行程序，如果你以这种方式使用\
  \ `xhost` 打开你的系统，那么该远程系统上的某个不怀好意的可能会显示窗口并进行其他恶作，甚至读取你的击键。因此，存在另一种方法：`xauth`。\n\n\
  ## 使用 `xauth`\n\n`xauth` 的背后的思想是为 X 连接提供一个多程度上透明的验证系统。该工具由稍后在“使用远程 X 登录服务器”中描述的\
  \ X 登录协议透明地使用，但当你通过其他方式连接时，你也可以手动使用它。虽然设置 `xauth` 比使用 `xhost` 稍微麻烦一些，但从安全的角度来看要好得多，因为你的\
  \ X 服务器对于接受连接的客户端要更有选择性。\n\n`xauth` 系统依赖于每个用户主目录下的一个名为 `.Xauthority` 的文件。该文件在 X\
  \ 服务器和客户端系统上必须存在，尽管如果其中一个系统上不存在，`xauth` 工具将创建它。与大多数 Linux 配置文件不同，`.Xauthority` 不是文本模式文件；你使用\
  \ `xauth` 工具对其进行操作。通过 `xauth`，你可以添加、删除或其他操纵 X 连接密钥。某些启动 X 的方法（例如后文描述的 GUI 登录服务器）会检查\
  \ `.Xauthority`，并在必要时在该文件中为服务器生成新密钥。然后 X 服务器将接受来自任何拥有此密钥的客户端的连接。（由于 `.Xauthority`\
  \ 存储在单个用户的主目录下，因此此密钥生成发生在用户登录或用户启动 X 时，以较发生者为准。不同用户可以有不同的 `.Xauthority` 文件。）为了允许\
  \ X 客户端使用 X 服务器，你必须将密钥从服务器上用户的 `.Xauthority` 文件中复制到客户端上用户的 `.Xauthority` 文件中。客户端应用程序在尝试使用\
  \ X 服务器时，会自动尝试使用该密钥。这里有几种不同的方法传输授权密钥。其中一种程序如下（之后将出现一个更快的方法）：\n\n1. 在 X 服务器计算机上，输入\
  \ `xauth` 以将将远程访问系统的用户身份启动该工具。请注意，尽管 `xauth` 在某种意义上是一个 X 工具，但它并不依赖 X 运行；它在文本模式下运行。\n\
  \n2. 输入 `list`。这将显示 `.Xauthority` 文件中的一系列密钥。每个密钥以显示名称开头，这是一个计算机主机名后跟显示数字，例如 `term.threeroomco.com:0`。某些机器名称后面可能跟着\
  \ `/unix`，你可能会看到 `localhost` 的条目，两者都可以忽略。如果某些条目以高于 0 的数字结尾，则指的是与第一个 X 服务器会话同时运行的第二个、第三或后续会话。你需要找到主显示器的名称，它很可能是你的计算机主机名后跟\
  \ `:0`。在该行的该名称之后将是一个编码类型（可能是 `MIT-MAGIC-COOKIE-1`）和一个 32 字节的十六进制数。你可以忽略这些项目，尽管它们最终是你将传输的内容。\n\
  \n3. 输入 `extract xfer-auth displayname`，其中 `xfer-auth` 是任何方便的文件名，`displayname` 是你在步骤\
  \ 2 中标识的你的 X 显示名称。例如，你可能输入 `extract xfer-auth term.threeroomco.com:0`。此步骤将你的显示器的\
  \ `.Xauthority` 条目复制到一个可以传输到 X 客户端系统的文件中。\n\n4. 输入 `exit` 退出 `xauth`。\n\n5. 将步骤\
  \ 3 中生成的 `xfer-auth` 文件复制到 X 客户端系统（托管你想要从远程运行程序的计算机）。你可以使用任何你喜欢的方法来实现此，例如 FTP、`scp`、NFS\
  \ 挂载、软盘等。\n\n6. 登录到 X 客户端系统。\n\n7. 在客户端系统上输入 `xauth` 在客户端系统启动此工具。\n\n8. 输入 `merge\
  \ xfer-auth`，其中 `xfer-auth` 是你在步骤 3 中生成并传输到这台计算机的文件名。（如有必要，包含该文件的路径。）\n\n9. 输入 `list`。此操作应生成此系统上的授权列表，包括你刚刚合并的那个。如果你没有看到想要添加的\
  \ X 服务器，说明过程出现了问题，请检查此前的步骤。\n\n10. 输入 `exit` 退出程序并保存更改。（注意 `xauth` 也支持一个名为 `quit`\
  \ 的命令，但它会放弃更改，所以除非你犯了错误，否则不要使用它。）\n\n如果你的系统都安装了 SSH，你可以在 X 服务器上输入以下命令，代替这十个步骤：\n\
  \n```\n# xauth list xserver :0 | sed -e 's/^add /' | ssh xclient -x\n```\n\n此过程将前面的步骤压缩为单个命令，在\
  \ X 服务器上使用 `xauth`，使用 `sed` 在输出开头添加，并利用 SSH 远程运行的能力在客户端系统上执行 `xauth`。你应该注意此命令的以下特性：\n\
  \n* 将你所在的计算机名称输入为 `xserver`，将你想要运行程序的客户端输入为 `xclient`。\n\n* 确保在 `add` 后面和斜杠 `/`\
  \ 之前有一个空格。这是传递给客户端系统 `xauth` 的命令，空格分隔 `add` 命令和显示名称。\n\n* 你将被提示密码或短语，除非你的 SSH 配置绕过了这一点，具体见第\
  \ 13 章“维护远程服务器”。\n\n此时，你的 X 服务器应该接受来自客户端系统的连接，尽管你可能仍需要在客户端系统上设置一个选项以连接到 X 服务器，具体见下一节“设置客户端选项以使用服务器”。\n\
  \n由于 `xauth` 系统依赖于理想情况下仅由 X 服务器及其授权客户端已知的密钥，因此它在某些方面比 `xhost` 系统更安全。例如，如果你使用 `xauth`，服务器将只接受来自授权使用显示器的客户端上特定用户的连接。使用此系统的\
  \ X 服务器也不易受到 IP 欺骗攻击。缺点是，`xauth` 使用的密钥是以未加密的形式发送的，因此如果你的本地网络不安全，或者如果你在互联网上使用此方法，这些密钥很容易被拦截，从而允许任何可以访问密钥的人连接到你的\
  \ X 服务器。最终，如果需要高度安全的 X 连接，SSH 是一个更优的连接方法，具体见接下来的章节“通过 SSH 隧道传输 X 连接”。\n\n\n\n\n\n\
  并不是所有的 X 服务器都配置为使用 `xauth`。通常情况下，该功能对于通过 `XDM`、`GDM` 或 `KDM` 启动的 X 服务器，正如后文章节“使用远程\
  \ X 登录服务器”所述。然而，如果你通过 `startx` 启动 X 服务器，它可能存在也可能不存在，这取决于你的 X 版本和发行版。在某些情况下，你可能需要编辑\
  \ `startx` 脚本（通常位于 `/usr/X11R6/bin` 中），使其带有 `-auth` `authority-file` 选项调用 `xinit`，其中\
  \ `authority-file` 是授权文件（通常是你家目录下的 `.Xauthority`）。尽管如此，这一步通常是必要的。\n\n## 设置客户端选项以使用\
  \ X 服务器\n无论你使用 `xhost` 还是 `xauth` 来控制对 X 服务器的访问，你都必须配置客户端使用正确的服务器。如果你坐在 `term.threeroomco.com`\
  \ 前并登录到 `biggie.threeroomco.com`，如果该系统尝试使用 `wrongone.threeroomco.com` 作为 X 显示器，你将无法使用该显示器。事实上，许多\
  \ Linux 系统即使在你远程登录时，也会默认使用它们自己的 X 服务器。\n\n当一个 X 程序启动时，它会检查 `DISPLAY` 环境变量的值来决定使用哪个\
  \ X 服务器。你可以通过在 X 客户端系统输入以下命令来检查该变量的值：\n\n```\n $ echo $DISPLAY\nbiggie.threeroomco.com:0.0\n\
  ```\n\n如果输出（在此例中为 `biggie.threeroomco.com:0.0`）是你的 X 服务器，那么你什么都不需要。（第一个显示器通常编号为\
  \ `0` 或 `0.0`，这两个值是等价的。）如果输出显示你的 X 客户端或其他系统，或者如果没有输出（表示 `DISPLAY` 环境变量未设置），则你必须设置它，如下：\n\
  \n```\n $ export DISPLAY=term.threeroomco.com:0\n```\n\n当然，你应该使用你自己的 X 服务器主机名。后续运行\
  \ X 程序的尝试将使用你指定的服务器。然而，为了让这些尝试成功，你需要在服务器上运行 `xhost` 或如前所述将 `xauth` 记录传输到客户端，以便配置\
  \ X 服务器接受来自你的 X 客户端的连接。\n\n## 通过 SSH 隧道传输 X 连接\n前面的讨论涉及使用两种不同且独立的协议启动 X 连接。首先，你使用文本模式远程登录客户端（例如\
  \ Telnet 客户端）从 X 服务器计算机进行连接。其次，你使用此文本连接在反方向为 X 客户端建立一个链接。在完成基础设置任务后，例如，你可能会在 Telnet\
  \ 程序中输入 `xclock` 来启动 `xclock` 程序。这种配置对于许多用途是足够的，但它并非没有问题。其一，通过 X 连接传输的所有数据都是未加密的，因此容易被第三方拦截。在某些情况下，每端都必须运行服务器本身也是一个缺点，因为防火墙或网络地址转换\
  \ (NAT)/IP 伪装路由器可能需要特殊配置才能允许此过程运行。这两个问题的一个可能的解决方案是使用安全 Shell (SSH) 协议，正如第 13 章所述，用于建立从\
  \ X 服务器系统到 X 客户端系统的初始连接，并并将 X 数据从 X 客户端隧道传回 X 服务器。\n\n第 13 章描述了 SSH 配置和使用的基础。然而，为了让\
  \ X 协议的 SSH 隧道工作，你需要设置特定的配置选项：\n\n*   在 SSH 客户端系统（X 服务器系统）的 `/etc/ssh/ssh_config`\
  \ 中，将 `ForwardX11` 设置为 `yes`。此选项允许 SSH 客户端接受来自 SSH 服务器的 X 数据。或者，你可以使用 `-X` 选项启动\
  \ `ssh`。（注意这是大写的 `-X`；小写的 `-x` 会禁用 X11 转发。）\n\n*   在 SSH 服务器系统（X 客户端系统）的 `/etc/ssh/sshd_config`\
  \ 中，将 `X11Forwarding` 设置为 `yes`。此选项告诉 SSH 服务器拦截本地 X 调用并将其转发到 SSH 客户端。\n\n通过 SSH\
  \ 进行 X 转发的原理是让 SSH 服务器运行一个本质是本地 X 服务器的替代品。当配置当时，SSH 会设置 `DISPLAY` 环境变量，以便 X 程序将数据发送到此端口（默认认为\
  \ X 服务器 10，或 TCP 端口 6010）。SSH 不在本地显示数据，而是对数据进行加密并传递给 SSH 客户端，然后由客户端将这些结果交付给 SSH\
  \ 服务器。本质上，SSH 服务器假装成 X 服务器，而 SSH 客户端假装成源客户端程序。\n\n此过程具有某些优势。其一，两台计算机之间只需要一个网络连接简化了网络配置。如果你想使用防火墙或\
  \ NAT 后方的 X 服务器，可能会使用 SSH 比使用 Telnet 或其他登录协议更容易。其次，因为 SSH 支持加密，通过 SSH 传输 X 数据可以极大地增强安全性。数据包被拦截，密码和其他敏感数据可能无法被利用。缺点源于这种加密：加密需要计算，因此使用\
  \ SSH 隧道传输 X 连接会消耗两台计算机的 CPU 时间，从而减慢 X 显示。在频率高于 200MHz 的 CPU 上，这些影响可能是明显的，但在安全性很重要时可能无法接受。在某些情况下，`ssh`\
  \ 的 `-C` 选项（启用压缩）可以通过减少带宽需求来改善情况。另一方面，压缩会进一步增加 CPU 负载，可能会使情况恶化。你必须尝试这两种方法，并根据你的硬件和网络决定哪种更好。\n\
  \n这些指令假设连接的双方都使用 Linux 或 UNIX 系统。如果你使用 Windows、MacOS、OS/2 或其他系统作为 X 服务器，那么 SSH 客户端软件可能不支持\
  \ X 连接的传输。即使它支持此选项，你可能需要确定如何在配置对话框中激活此功能。请查阅你的 SSH 客户端文档以获取更多信息。\n\n## 远程登录 X 访问总结\n\
  \n\n\n\n\n前面的讨论说明了在通过文本模式登录建立 X 连接时可提供的若干步骤和选项。然而，由于可能性非常多，很容易迷失方向。总而言之，一个典型的连接涉及以下步骤：\n\
  \n1. **启动 X 服务器**——如果你使用的是 Linux 系统且其配置为启动到 X 登录界面，那么你的 X 服务器可能会自动运行；或者，你可能需要通过输入\
  \ `startx` 来运行它。在 Windows、MacOS 或运行 X 服务器的其它系统上，你需要手动运行 X 服务器程序，或配置系统自动启动它。\n\n\
  2. **配置 X 服务器以接受连接**——你必须告诉 X 服务器接受远程连接。这可以通过在 X 服务器上使用 `xhost` 或通过将其 `xauth` 密钥传输到客户端系统来实现。如果你使用\
  \ `SSH` 对连接进行隧道穿透，则这一步是没的，尽管在这种情况下，你必须同时配置 `SSH` 客户端和服务器以执行隧道穿透。\n\n3. **连接到 X 客户端计算机**——你可以使用任何文本模式的远程访问协议（如\
  \ Telnet 或 `SSH`）连接到你想要运行程序的计算机。请注意，远程计算机运行着文本模式的远程访问服务器，但它的功能是 X 客户端。\n\n4. **配置\
  \ X 客户端使用正确的 X 服务器**——X 客户端程序使用 `DISPLAY` 环境变量来确定使用哪台计算机进行 X 显示。某些系统会自动正确设置此环境变量，但在其他系统上，你必须使用类似\
  \ `export DISPLAY=term.threeroomco.com:0` 的命令进行调整。\n\n5. **运行 X 程序**——你可以通过在原始远程登录程序窗口中输入它们的名称来运行\
  \ X 程序。如果你启动了一个 `xterm` 或类似的程序，可以使用它来启动进一步的程序。\n\n这些步骤中的某些（如第 2 和第 4 ）取决于你用于连接和验证的方法，可能是不必要的。此外，某些\
  \ Windows 和 MacOS 的 X 服务器会自动完成其中的某些步骤。例如，某些 X 服务器包含了精简的自动化 Telnet 或远程访问工具，这些工具可以使用适当的协议登录，然后启动一个\
  \ `xterm`。因此，在配置了用户名和密码后，这些 X 服务器只需点击按钮即可启动连接，结果是得到一个 `xterm` 窗口。请参阅你的 X 服务器文档。\n\
  \n这里描述的程序会导致远程系统的程序显示在 X 服务器计算机的桌面上，或者有时显示在 X 服务器打开的用于托管客户端桌面的独立窗口中。（这种选项在 MacOS\
  \ 和 Windows X 服务器上特别常见）。通常情况下，本地系统运行窗口管理器，尽管并非总是如此，特别是对于 MacOS 和 Windows X 服务器而言。（X\
  \ 支持从任一台计算机运行窗口管理器）。同样地，桌面环境通常在本地运行。如果你想在本地保持极简系统并在远程系统上运行窗口管理器和桌面环境，你可以调整本地和远程的\
  \ X 启动脚本，禁用 X 服务器计算机上的这些功能并在远程系统上启用它们。另一种方法是使用远程 X 登录服务器，这通常会将维护窗口管理器和桌面环境的负担转移到远程系统。\n\
  \n# 使用 XDMCP 服务器\n\n假设没有阻塞防火墙或其他障碍，任何运行 X 服务器的系统都可以作为任何可以运行 X 程序的计算机的显示器。然而，有时这并不足够；有时你希望你的\
  \ X 服务器像本地 X 服务器一样工作，显示一个由远程系统控制的桌面环境。使用 Telnet、`SSH` 或其他远程访问协议的登录过程可能有些乏味，特别是当你想要将完全控制权交给远程系统时。这些问题都可以通过完全基于\
  \ X 的登录协议来解决，例如 X 显示管理器控制协议 (`XDMCP`)）。大多数 Linux 系统都带有使用 `XDMCP` 作为服务器（在 X 客户端侧）所需的软件，但大多数配置将\
  \ `XDMCP` 服务器的访问限制在本地系统。重新配置服务器允许它为许多 `XDMCP` 客户端（X 服务器）。使用 Linux 系统作为 `XDMCP` 客户端是可能的，但这需要修改\
  \ X 配置以使用 `XDMCP` 远程生成而非本地生成的登录界面。\n\n## 理解 XDMCP 操作\n\n本章的前节介绍了一种远程使用 X 的模型，涉及使用\
  \ Telnet 等远程登录协议，在 X 客户端上运行 Telnet 服务器以建立初始连接，并允许用户建立双向 X 连接。`XDMCP` 有效地替代了 Telnet、`SSH`\
  \ 或其他基于文本的远程访问协议。当用户使用 Telnet 连接到远程系统时，Telnet 服务器启动登录过程，最终启动一个文本 shell。这些过程产生的文本数据通过\
  \ Telnet 会话传回客户端系统。`XDMCP` 在某些方面与此相似，但它不是启动文本 shell，而是 `XDMCP` 服务器启动一个基于 X 的登录过程，包括\
  \ `GUI` 登录提示以及启动用户的普通窗口管理器、桌面环境等。这些程序通过双向 X 连接运行；`XDMCP` 通过 `xauth` 自动配置客户端和服务器，并恰当地设置\
  \ `DISPLAY` 环境变量。简而言之，`XDMCP` 自动化之前描述的许多登录步骤。\n\n事实上，`XDMCP` 服务器不仅用于远程 X 连接；它还被配置为直接启动到\
  \ X 的 Linux 计算机使用。在此配置下，`XDMCP` 服务器将运行并直接连接到 X 服务器，创建一个 `GUI` 登录提示，如图 14.2。由于 `XDMCP`\
  \ 服务器创建了此提示，它在不同服务器之间有所不同；事实上，它可以被自定义的，因此在不同发行版之间也不同。\n\n![XDMCP 服务器的登录提示允许你输入用户名、密码，有时还有额外信息，例如你想要使用的桌面环境或窗口管理器。](img/14fig02.gif)\n\
  \n**图 14.2. XDMCP 服务器的登录提示允许你输入用户名、密码，有时还有额外信息，例如你想要使用的桌面环境或窗口管理器。**\n\n## 配置登录服务器以接受连接\n\
  \n\n\n\n\n`XDMCP` 服务器通过存储在 `/etc` 目录树中的文件进行配置，通常位于 `/etc/X11`。出于安全考虑，大多数发行版的发布方式使得其服务器仅可从本地（localhost）访问。如果你想允许远程\
  \ `XDMCP` 登录，则必须放宽此配置。此外，你必须确保 `XDMCP` 服务器正在运行。Linux 中常用的有三种 `XDMCP` 服务器：原始的 X 显示管理器\
  \ (`XDM`)，以及较新的 `KDE` 显示管理器 (`KDM`) 和 `GNOME` 显示管理器 (`GDM`)。\n\n### XDM 配置\n\n`XDM`\
  \ 是流行的 `XDMCP` 服务器中最老、最简单的一个。与 `GDM` 和 `KDM` 不同，`XDM` 与任何 Linux 桌面环境都没有关联。它允许用户输入用户名和密码，但不允许其他信息（例如他们想使用什么种窗口管理器）。相反，用户的登录参数通过其家目录下的\
  \ `.xsession` 文件控制（该脚本从全局 `Xsession` 脚本运行，通常位于 `/etc/X11` 或 `/etc/X11/xdm`）。用户的\
  \ `.xsession` 文件通常以一行启动窗口管理器或桌面环境的行结尾；当脚本终止（用户注销，从而终止窗口管理器）时，X 会话结束，`XDM` 终止远程连接或（在本地显示器上）重新显示登录提示。\n\
  \n#### 调整 XDM 的可用性\n\nXDM 对非本地系统的可用性通过其主配置文件 `/etc/X11/xdm/xdm-config` 控制。具体而言，许多发行版自带了如下的一行配置：\n\
  \n```\nDisplayManager.requestPort: 0\n```\n\n此行告诉 `XDM` 不要在其通常的端口（UDP 端口 177）上监听外部连接请求。如果你想允许他人通过\
  \ `XDMCP` 登录到计算机，应通过在行首添加井号（`#`）来注释掉此行。\n\n除了编辑 `xdm-config` 之外，你可能还需要调整 `/etc/X11/xdm/Xaccess`\
  \ 文件。该文件指定了允许访问 `XDM` 服务器的具体计算机。该文件由一系列行组成，每行包含一个主机规范，随后是该主机被允许的访问类型指示（以井号开头的行是注释，会被忽略）。如果未指定访问类型，则允许客户端直接访问，这是最重要的类型。其他常见选项包括\
  \ `CHOOSER`，它会导致 `XDMCP` 客户端发送所谓的*间接*查询时，让 `XDM` 显示本地网络上运行着 `XDMCP` 服务器的其他计算机列表；以及\
  \ `BROADCAST`，它通常与 `CHOOSER` 配合使用，当系统接收到间接请求时，告诉选择器广播对其他 `XDMCP` 服务器的查询。使用星号（`*`）作为主机列表会导致\
  \ `XDM` 允许任何主机连接。例如，以下条目允许任何计算机直接连接到系统，或将其作为间接服务器，以获取本地 `XDMCP` 服务器列表：\n\n```\n\
  \ *\n* CHOOSER BROADCAST\n```\n\n如果你想限制对某些主机的访问，你应该创建列出这些主机的行，并删除星号条目。你也可以将星号作为名称的*部分部分*来授予某个域的访问权限。例如，以下系统仅允许一个域的成员和两台外部计算机连接到\
  \ `XDMCP` 服务器进行远程登录，且仅允许外部系统进行间接查询：\n\n```\n*.threeroomco.com\nbronto.pangaea.edu\n\
  stego.pangaea.edu\nbronto.pangaea.edu CHOOSER BROADCAST\nstego.pangaea.edu CHOOSER\
  \ BROADCAST\n```\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n可以通过 `XDM` 配置文件以外的方法配置计算机不接受\
  \ `XDMCP` 连接。例如，计算机的防火墙规则（在第 25 章）中描述）可能会阻止对服务器的访问。\n\n#### 设置 XDM 管理的显示\n\n`/etc/X11/xdm/Xservers`\
  \ 文件指定了 `XDM` 要管理的显示器列表。当 `XDM` 启动时，它尝试连接这些显示器并为它们呈现登录界面。默认情况下，该文件包含类似如下的一行（具体细节取决于发行版）：\n\
  \n```\n0 local /usr/X11R6/bin/X\n```\n\n此行告诉系统连接并管理本地显示器（`:0`）。因此，`XDM` 管理本地显示器，并在必要时启动\
  \ X。（这就是为什么在 SysV 启动脚本中启动 `XDM` 会启动 X 的）。如果你想让 `XDM` 直接管理远程系统（如 X 服务器）的显示器，而不使用中间登录提示，你可以在此处列出这些系统。\n\
  \n`foreign` 规范告诉 `XDM` 这是一个远程系统，并以此种方式与其联系。当然，该系统必须配置为允许 `XDMCP` 服务器连接并显示登录提示。编辑\
  \ `Xservers` 文件的另一个原因是*移除*默认的 `local` 规范。如果你这样做，当启动 `XDM` 时，计算机将不会在本地启动 X。如果你想通过远程\
  \ X 终端等设备使用强大的中央系统，这可能会很有用。这样的系统可能会运行许多 X 程序，但不需要在本地运行 X 服务器。\n\n### NOTE\n\n如果你可以配置该服务器来查找\
  \ `XDMCP` 服务器（如后文章节“配置远程 X 登录客户端”所示），那么你*不需要*告诉 `XDM` 管理某个显示器。只有当相关的 X 服务器应该*仅用于*连接到运行\
  \ `XDM` 的计算机时，你才应该告诉 `XDM` 管理该显示器。例如，你可能在连接到一台计算机的 X 终端上使用这种方法。\n\n\n\n\n\n`KDM`\
  \ 被设计为 `XDM` 的“无缝替换”方案，但 `KDM` 提供了更扩展的功能。对大多数用户感兴趣的是，`KDM` 提供了一个可点击的用户名列表、一个可以在其中输入窗口管理器或桌面环境的会话类型列表框，以及一个用于退出本地\
  \ X 服务器（在远程运行时）或关机计算机（在本地运行时）的退出或关机按钮。[图 14.2] 显示了 `KDM` 登录界面。\n\n`KDM` 与 `XDM`\
  \ 使用相同的配置文件，因此您应该参考前面的章节“[XDM 配置”来获取有关设置 `KDM` 以接受远程登录的说明。不过，KDM 的一些额外功能需要超出 `XDM`\
  \ 的配置范围。这些功能通过 `kdmrc` 文件控制，该文件存储在不同发行版的不同位置。常见位置包括 `/opt/kde2/share/config` 和 `/usr/share/config`。该文件中的选项控制登录窗口的大小、`GUI`\
  \ 样式等。这些选项中最重要的选项之一是 `SessionTypes`。它决定了显示给用户的会话类型名称——即用户可以从中选择的窗口管理器或桌面环境。如果您向此列表添加会话类型，还必须将它们添加到\
  \ `/etc/X11` 或 `/etc/X11/xdm` 中的 `Xsession` 或 `Xsession.d` 文件中。遗憾的是，解析这个文件是非常繁琐的，而且不同发行版之间也不同。寻找使用变量\
  \ `SESSION` 或其类似内容的行。某些发行版带有一个名为 `chksession` 的工具，它可以自动将窗口管理器或桌面环境添加到 `KDM` 和 `GDM`\
  \ 配置中——前提是该窗口管理器或桌面环境自带了适当的配置文件。在大多数情况下，用户像在 `XDM` 中那样通过编辑家目录下的 `.xsession` 文件来自定义自己的环境更为简单。用户必须选择一个特定的\
  \ `KDM` 会话项（通常称为 Default），以便系统使用该文件。\n\n### GDM 配置\n\n`GDM` 是 GNOME 进入显示管理器竞争的品。像\
  \ `KDM` 一样，它为用户提供了许多功能，例如从多个桌面环境中进行选择的能力，以及终止远程 X 会话或关闭本地计算机的能力。与 `KDM` 不同，`GDM`\
  \ 使用自己的配置文件，这些文件通常存储在 `/etc/X11/gdm` 中。这些文件中最重要的是 `gdm.conf`。\n\n使用 `GDM` 的系统（如使用大多数其他\
  \ `XDMCP` 服务器的系统）出带的服务器配置为不接受远程服务器的登录。您可以通过定位 `gdm.conf` 中的 `[xdmcp]` 部分并修改一或两个条目来实现。最重要的是，您应该将\
  \ `Enable=0` 的行改为 `Enable=1`。如果您希望 `GDM` 为 X 终端或类似设备提供其他启用了 `XDMCP` 的计算机列表，您还应该将\
  \ `HonorIndirect=0` 行改为 `HonorIndirect=1`。\n\n如果您想在不启动本地 X 的情况下运行 `GDM` 进行远程访问，可以通过注释掉\
  \ `[servers]` 部分中的本地服务器来实现。通常，该部分包含如下的条目：\n\n```\n 0=/usr/bin/X11/X\n```\n\n此条目告诉\
  \ `GDM` 启动 X（确切地是程序 `/usr/bin/X11/X`）来管理第一个 X 会话，这非常像 `XDM` 或 `KDM` 的默认 `Xservers`\
  \ 配置。注释掉此条目会导致 `GDM` 在运行时不时不管理本地显示，或在 X 未运行运行时启动它。\n\n像 `KDM` 一样，`GDM` 为用户提供了窗口管理器或桌面环境的选择。（在\
  \ `GDM` 中，这些选择可以通过会话菜单访问。）您可以通过在 `/etc/X11/gdm/Sessions` 目录下创建相应的脚本来添加或删除会话。默认脚本通常调用\
  \ `/etc/X11/xdm/Xsession`，有时会向其传递参数以指示应该启动什么环境。因此，您可能需要编辑此脚本，或者创建一个执行某些相同工作的脚本，但添加启动您想要使用的任何新窗口管理器或桌面环境的能力。或者，在大多数系统中，用户可以编辑他们的\
  \ `.xsession` 文件来自定义启动环境。\n\n### 运行 XDMCP 服务器\n\n运行 `XDMCP` 服务器通常通过设置计算机自动启动 X 并接受\
  \ `GUI` 登录来实现。大多数发行版为此目的预留了运行级别（runlevel）5，但某些发行版使用其他运行级别——特别是 7.2 版本之前的 SuSE 使用运行级别\
  \ 3 进行 `GUI` 登录，Slackware 使用运行级别 4。Debian 及其衍生版本尝试在所有多用户运行级别下启动 X。\n\n您可以通过编辑类似下面的行来在\
  \ `/etc/inittab` 中设置默认运行级别：\n\n```\n id:5:initdefault:\n```\n\n大多数发行版在这一行之前包含注释，描述了各种运行级别的用途。第二个由冒号分隔的字段中的数字是系统启动时进入的运行级别。如果此数字与计算机启动\
  \ X 联，那么 `XDMCP` 服务器也会运行。\n\n您可以使用 `telinit` 命令更改运行级别。例如，`telinit 5` 切换到运行级别 5。此更改将一直有效，直到您发布另一个\
  \ `telinit` 命令或重启计算机。\n\n### 提示\n\n![TIP](img/tip.gif)\n\n如果您对 `XDMCP` 服务器的配置进行了更改，实施这些更改的方法之一是使用\
  \ `telinit` 切换出 X 运行级别进入文本模式运行级别，然后切换回 X 相关的运行级别。另一种方法是使用 `kill` 或 `killall` 停止\
  \ `XDMCP` 服务器，然后重新运行。您可以使用 `SIGHUP` 信号导致 `XDMCP` 服务器在不退出的情况下重新读取配置文件。（当 `XDMCP`\
  \ 服务器退出时，它通常会终止本地 X 显示。）\n\n每个发行版都有默认的 `XDMCP` 服务器，但您可以重新配置任何发行版以使用任何 `XDMCP` 服务器。不同的发行版使用不同的方法来指定运行哪个\
  \ `XDMCP` 服务器。选择 `XDMCP` 服务器的方法包括：\n\n\n\n\n\n### `prefdm`\n某些发行版（如 Red Hat 和 Mandrake）使用名为\
  \ `prefdm` 的脚本（通常存储在 `/etc/X11`）来启动 `XDMCP` 服务。该脚本随后加载 `/etc/sysconfig/desktop`\
  \ 文件的内容，以确定默认的桌面环境和 `XDMCP` 服务。该文件的常见值包括 `KDE`、`GNOME` 和 `AnotherLevel`，分别对应 `KDM`、`GDM`\
  \ 和 `XDM` 作为 `XDMCP` 服务。\n\n### SysV 启动脚本\nDebian 及其衍生版通过标准的 SysV 启动脚本（例如 `/etc/init.d/xdm`）启动\
  \ `XDMCP` 服务。你可以编辑或替换此文件，使系统使用不同的 `XDMCP` 服务，如第 4 章所示。SuSE Linux 使用类似的方法，但其 `xdm`\
  \ 启动脚本会根据 `DISPLAYMANAGER` 环境变量的值启动特定的 `XDMCP` 服务，该变量设置在 `/etc/rc.config` 中。\n\n\
  ### 其他启动脚本\nSlackware 使用 `/etc/rc.d/rc.4` 脚本启动 `XDMCP` 服务。如第 4 章所示，Slackware 使用运行级别的方式与其他大多数\
  \ Linux 发行版不同，但 `rc.4` 脚本在概念上与 Debian 或 SuSE 的 `xdm` SysV 启动脚本相似。Caldera 采用了类似的方法，将其启动脚本称为\
  \ `/etc/rc.d/rc.gui`。Slackware 脚本硬编码为尝试使用 `KDM`，然后是 `GDM`，最后是 `XDM`；而 Caldera 脚本只启动\
  \ `KDM`。如果你愿意，可以更改此顺序或添加其他 `XDMCP` 服务。\n\n### 配置远程 X 登录客户端与其他协议一样，单独的 `XDMCP` 服务器是没有用的；它必须与一个或多个\
  \ `XDMCP` 客户端匹配。这些客户端通常内置在 X 服务器或 X 终端中。`XDMCP` 客户端可以直接联系 `XDMCP` 服务器，也可以列出可用的 X\
  \ 服务器，如图 14.3 所示，图中显示了 Windows 版 Xmanager ([`www.netsarang.com`](http://www.netsarang.com))\
  \ X 服务器的选择器。当你选择一台计算机并点击连接（或你选择器的等效操作）时，你将看到一个 `XDMCP` 登录显示，如图 14.2 所示。登录后，X 服务器将接管整个显示器或打开一个显示你的\
  \ X 桌面的大窗口，这取决于 X 服务器的能力和配置。\n\n![选择器显示了可用的 XDMCP 服务器列表；你可以选择其中一个运行在该计算机上的 X 程序。](img/14fig03.gif)\n\
  \n**图 14.3. 选择器显示了可用的 XDMCP 服务器列表；你可以选择其中一个运行在该计算机上的 X 程序。**\n\n大多数适用于 Windows 和\
  \ MacOS 的 X 服务器提供一个对话框，你可以在其中配置它们的 `XDMCP` 操作。图 14.4 显示了 Xmanager 的对话框。特别感兴趣的是对话框上半部分的单选按钮。这些按钮在不同程序中的可能可能不同，但它们说明了内置于\
  \ X 服务器的 `XDMCP` 客户端可能用于创建 `XDMCP` 服务器初始连接的方法：\n\n- **不使用 XDM（被动）**：此方法要求你从 X 服务器计算机使用\
  \ Telnet 或其他登录技术发起手动连接，或者配置 `XDMCP` 服务器来管理 X 服务器的显示（例如如前所述，在 `/etc/X11/xdm/Xservers`\
  \ 文件中创建 `foreign` 条目）。如果你选择后者，当 `XDMCP` 服务器启动时，它将尝试在 X 服务器计算机上创建一个登录窗口。然而，如果你重启\
  \ X 服务器，此登录窗口将会消失，并且可能在重启 `XDMCP` 服务器之前不再出现。\n\n- **XDM 查询**：此选项导致 X 服务器直接向指定的主机发送登录查询，你必须输入该主机名或\
  \ `IP` 地址。如果该服务器运行 `XDMCP` 服务，它将呈现一个如图 14.2 所示的 `XDMCP` 登录显示。使用此选项无法直接登录到另一台计算机。此选项在许多方面与上一个相似，但\
  \ XDM 查询会导致 X 服务器每次启动时都查询 `XDMCP` 服务器，这通常比让 `XDMCP` 服务器管理 X 服务器更合理。\n\n- **XDM 广播**：如果你在一个有多个\
  \ X 服务器的本地网络上，此选项可能是最好的。它导致 X 服务器发送广播查询，以查找本地网络上所有的 `XDMCP` 服务器，并显示服务器列表，如图 14.3\
  \ 所示。某些服务器允许你将广播限制在某些地址（图 14.4 中的“注册搜索主机”按钮可以实现这一点）。\n\n- **XDM 间接**：如果你允许用户登录远程网络上的任意几计算机，此选项非常有用。输入该网络上\
  \ `XDMCP` 服务器的名称或 `IP` 地址，X 服务器将连接到该系统获取服务器列表。不过，如前面的章节所述，`XDMCP` 服务器必须配置为接受间接查询。\n\
  \n![大多数 XDMCP 客户端提供了有关如何查找和与 XDMCP 服务器交互的多个选项。](img/14fig04.gif)\n\n**图 14.4. 大多数\
  \ XDMCP 客户端提供了有关如何查找和与 XDMCP 服务器交互的多个选项。**\n\n\n\n\nWindows X 服务器并不是唯一可以列出可用 `XDMCP`\
  \ 服务器的。你也可以让 Linux 上的 XFree86 执行相同的操作，在这种情况下，你需要通过不同的启动 X 的方式来实现。具体而言，你使用 `-query`\
  \ `host.name`、`-broadcast` 和 `-indirect` `host.name` 选项，如下：\n\n```\n$ /usr/X11R6/bin/X\
  \ -indirect xdmcp-server.threeroomco.com\n```\n\n这些选项的工作原理与上述 Windows X 服务器非常相似，但有一个主要的异常：XFree86\
  \ 的 `-broadcast` 选项不会显示选择列表；它会连接到响应查询的 `XDMCP` 服务器，允许你仅登录那台计算机。\n\n### 提示\n\n![TIP](img/tip.gif)\n\
  \n如果你想将一台 Linux 计算机配置为专用的 X 终端，你可以这样做。你应该配置为让 X *不会* 通过 `XDMCP` 服务器自动启动——也就是说，以文本模式运行\
  \ Linux。然后你可以创建一个自定义启动脚本或 SysV 启动脚本，使用相应的 `-query`、`-broadcast` 或 `-indirect` 选项来运行\
  \ X。如果你想查看可用的本地服务器列表，你需要将一个普通的 `XDMCP` 服务器配置为间服务器，并在启动 X 时使用 `-indirect` 选项。通过这种方式，即使是旧的\
  \ 386 系统也可以作为一个合格的 X 终端。\n\n# 运行 VNC 服务器\n\n由于 X 是 Linux 上最常见的 `GUI` 环境，而且由于 X 在设计时考虑了网络操作，因此\
  \ X 是 Linux 中远程访问 `GUI` 的常用方法。然而，它并不是唯一的方法。另一个工具 `VNC`也可以为 Linux 提供远程 `GUI` 访问。正如短文所述，`VNC`\
  \ 使用与 X 不同的网络模型，因此具有某些固有的优缺点。安装和配置 `VNC` 服务器与安装和配置 X 服务器也是完全不同的任务。同样，使用 `VNC` 客户端进行远程访问也与\
  \ X 服务器不同。\n\n## 理解 VNC 客户端/服务器关系\n\n在前面的讨论中，我已经费力明确了不同程序的客户端和服务器角色。这有时会变得令人困惑，因为在任何连接中，一台计算机作为某个协议的客户端，另一台作为服务器，但这种客户端/服务器关系在另一个协议中又是反转的。`VNC`\
  \ 相对容易讨论，因为两台计算机之间的连接更简单，对大多数人来说也更直观：用户坐在 `VNC` 客户端前并在 `VNC` 服务器上运行程序。这种关系类似于 Telnet\
  \ 或 `SSH` 服务器。\n\n不过，如果你还记得之前关于 X 客户端和服务器关系的讨论，你可能会疑惑这是如何发生的。毕竟，X 服务器控制着键盘、鼠标和显示器，那么用户如何*不*坐在\
  \ X 服务器前仍然使用 X 程序呢？答案是增加了一层对用户隐藏的网络复杂性。`VNC` 服务器运行 X 客户端，这些客户端与运行在本地计算机上的 X 服务器通信。这台\
  \ X 服务器与 `VNC` 服务器对接，就好像 `VNC` 服务器是人类输入输出设备一样。然而，`VNC` 服务器并不使用本地键盘、鼠标和显示器，而是通过网络连接与远程\
  \ `VNC` 客户端通信，由后者提供输入输出设备。这种安排以及其与普通本地 X 服务器和网络 X 服务器的比较，可以在图 14.5 中看到。正如你所看到的，与传统的远程\
  \ X 服务器配置相比，它增加了复杂性，但这种复杂性在很大程度上是对用户隐藏的。\n\n![VNC 服务器在本地运行其自定义的 X 服务器，并与一个简单的远程网络客户端对接，后者为\
  \ X 服务器提供键盘、鼠标和显示器。](img/14fig05.gif)\n\n**图 14.5。VNC 服务器在本地运行其自定义的 X 服务器，并与一个简单的远程网络客户端对接，后者为\
  \ X 服务器提供键盘、鼠标和显示器。**\n\n运行在 `VNC` 服务器系统上的 X 服务器即使在 `VNC` 链接中断时也能保持其状态。例如，如果 `VNC`\
  \ 客户端系统崩溃，或者用户直接退出 `VNC` 服务器而未注销，`VNC` 服务器将继续运行，当用户下一次连接到 `VNC` 服务器时，所有在 `VNC` 服务器上运行的应用程序都将保持打开状态。这一功能在某些环境中非常方便，但你不应该过度依赖它。就像你离开计算机控制台很长时间一样，`VNC`\
  \ 服务器可能会崩溃，或者连接可能会被劫持。（当下一节所述结合 `XDMCP` 使用 `VNC` 时，这种对本地状态的维护并不适用，“在 VNC 中运行 XDMCP\
  \ 登录服务器](#ch14.xhtml_ch14lev3sec9 \"在 VNC 中运行 XDMCP 登录服务器\")”）\n\n在安全性方面，`VNC` 介于通过\
  \ Telnet 或 `XDMCP` 的普通 X 连接与 `SSH` 加密的 X 连接之间。`VNC` 会对其密码进行加密，因此它们应该是相当安全的；但 `VNC`\
  \ 不加密其他数据，因此你登录后输入的或显示的任何内容理论上都可以被他人看到，特别是当你的连接通过整个互联网时。\n\n\n\n\n\nX 的设计考虑了网络操作；它以行、字符等形式传输数据，而不是在屏幕上显示的位图。这导致了大量的往返事务，但每次事务传输的数据相对较少。相比之下，`VNC`\
  \ 更倾向于位图；它执行的事务较少，但每次传输的数据更多。这一事实意味着，在某些网络和某些应用程序上，`VNC` 比普通的 X 连接更慢，因为计算机之间必须通过更多数据。例如，如果你使用文本编辑器，文本编辑器可以将单词传递给\
  \ X 服务器，由 X 服务器在本地生成这些单词的位图。然而，`VNC` 必须传输整个位图，而位图通常比显示的高层描述要大。尽管如此，在快速网络上或运行位图图形编辑器等程序时，这种优势可能很微小或不存在。另一方面，`VNC`\
  \ 使用的数据交换较少，这意味着如果你的连接具有高延迟（例如卫星链路），它的速度可能会更快；在这些情况下，传统 X 的频繁往返交换会拖慢速度。如果你对 `VNC`\
  \ 的速度不满意，可以考虑支持更高效编码的扩展版 `VNC`，例如 TightVNC ([`www.tightvnc.com`](http://www.tightvnc.com))\
  \ 或 TridiaVNC ([`www.developvnc.org`](http://www.developvnc.org))。尽管这些更节省带宽的编码会消耗更多的\
  \ CPU 时间，但最好在两个系统都拥有快速 CPU 时使用。同样，通过 `SSH` 隧道 `VNC` 并使用其压缩功能可能会提高或降低性能，取决于可用带宽和\
  \ CPU 时间。\n\n`VNC` 相比 X 的一大优势是，你可以使用 `VNC` 控制 Windows 或 MacOS 系统。尽管它们内部没有使用 X 服务器，但如图\
  \ 14.5 所示，Windows 和 MacOS 都提供了 `VNC` 服务器。这些服务器会拦截 Windows 或 MacOS 的屏幕显示和用户输入调用，并将结果回显给\
  \ `VNC` 客户端，或从客户端接收输入。不过，我不会描述这些 Windows 和 MacOS `VNC` 服务器的操作。它们在概念上与 Linux `VNC`\
  \ 服务器相似，但 Windows 和 MacOS 服务器提供的选项较少，且通过对话框而不是文本文件进行配置。你可以像连接到 Linux `VNC` 服务器一样连接到\
  \ Windows 和 MacOS `VNC` 服务器。由于 Windows 和 MacOS `VNC` 服务器会拦截屏幕调用，因此一次上只允许一个人使用这台计算机。\n\
  \n## 安装 VNC 服务器\n\n你可以从 `VNC` 主网站 [`www.uk.research.att.com/vnc/`](http://www.uk.research.att.com/vnc/)\
  \ 获取 `VNC` 服务器。`VNC` 服务器和 `VNC` 客户端也包含许多 Linux 发行版中（`VNC` 是开源软件包）。某些发行版将服务器和客户端包含在一个包中（通常称为\
  \ `vnc`），而另一些将服务器和客户端包分开（分别称为 `vnc-server` 和 `vnc`）。TightVNC 和 TridiaVNC 有自己的包，但它们的安装和使用方法与此处描述的相似。\n\
  \n如果你的发行版自带了 `VNC`，或者你想从其他来源获取 `RPM` 或 Debian 文件进行安装，你应该能够通过通常的方式安装软件包来完成任务。从 3.3.3r2\
  \ 版本开始，原始 VNC 的官方分发形式是 tar 包或 zip 文件中的预编译 x*86 二进制代码，或者是源代码。假设你获取的是二进制 tar 包代码，可以按照以下方式进行安装：\n\
  \n1. 使用类似 `tar xvfz vnc-3.3\\. 3r2_x86_linux_2.0.tgz` 的命令解压 tar 包。这将创建一个名为 `vnc_x86_linux_2.0`\
  \ 的目录。\n\n2. 将 `vnc_x86_linux_2.0` 目录中的 `vncviewer`、`vncserver`、`vncpasswd`、`vncconnect`\
  \ 和 `Xvnc` 文件复制到你路径中的目录中，例如 `/usr/local/bin`。或者，你可以将整个 `vnc_x86_linux_2.0` 目录移动到\
  \ `/opt` 等位置，并将其添加到路径中，或者创建这些程序文件到你路径位置的链接。\n\n3. 在使用 `VNC` 的用户家目录下创建一个名为 `.vnc`\
  \ 的目录。该目录应该属于该用户。它将存放个性化的 `VNC` 配置文件，包括 `VNC` 密码文件。为了防止窥探，你可能希望将此目录的权限设置为 700 (`rwx------`)。\n\
  \n4. 作为使用 `VNC` 的用户，输入 `vncpasswd`。正如你预期的，`vncpasswd` 程序用于设置密码。与大多数 Linux 登录服务器不同，`VNC`\
  \ 并不依赖 Linux 用户名和密码数据库来控制访问。相反，它是作为普通用户运行的，因此服务器本身必须提供验证。（如果你按照描述将 `VNC` 与 `XDMCP`\
  \ 服务器配对，Linux 会处理验证，因此你可以跳过此步和步骤 3。）\n\n### 注意\n\n![注意](img/note.gif)\n\n这些说明描述了安装和使用传统的\
  \ `VNC` 服务器和客户端。`VNC` 还支持 Java 服务器模式，允许从任何支持 Java 的 Web 浏览器访问 `VNC` 服务器。必要的 Java\
  \ 类出现在安装目录的 `classes` 子目录中。请阅读 `README` 文件以获取有关安装和使用这些类的更多信息。\n\n## 运行 VNC 服务器\n\
  \n此时，`VNC` 服务器已安装并配置完成。要运行它，你必须作为普通用户登录服务器。通常，你会在想要使用 `VNC` 的计算机上执行此操作，就像使用 Telnet\
  \ 或 `SSH` 登录远程计算机以便通过 X 服务器使用 X 程序一样。不过，还有其他方法可以实现，例如，你可以从控制台运行 `VNC`，为从其他位置访问系统做准备。你可以作为普通用户输入其名称来运行服务器：\n\
  \n```\n $ vncserver\n\nNew 'X' desktop is vncserv.threeroomco.com:1\n\nStarting\
  \ applications specified in /home/rodsmith/.vnc/xstartup\nLog file is /home/rodsmith/.vnc/vncserv.threeroomco.com:1.log\n\
  ```\n\n\n\n\n注意此命令的输出非常重要，特别是识别桌面编号的那行——在前面的示例中为 1，如主机名末尾的数字（`vncserv.threeroomco.com:1`）所示。`VNC`\
  \ 的运行机制是启动一个 X 服务器（`Xvnc` 程序），该程序同时兼当 `VNC` 服务器。你可以将这个 X 服务器想象成通过文本模式控制台登录并输入 `startx`\
  \ 启动的 X 会话——它没有登录提示，并且会启动个人的桌面环境或窗口管理器（正如后文描述的）。如果有两个或多个个人在同一台计算机上运行 `VNC` 服务器，他们必须以某种方式将它们区分开来。使用的方法是\
  \ X 服务器编号。数字 0 通常由本地控制台的 X 服务器占用，因此第一个 `VNC` 会话可能会使用数字 1。随后的 `VNC` 会话可能会使用更高的数字。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n如果你使用 `SSH` 登录到 `VNC` 服务器系统以运行 `VNC`\
  \ 服务器，你可能会发现 `VNC` 服务器在运行，但所有的 X 程序（包括窗口管理器）都无法在其中运行。结果是你尝试访问 `VNC` 服务器时，你会看到一个没有任何窗口的灰色背景，并且无法对其进行任何操作。其原因是\
  \ `SSH` 为其自身的 X 转发功能调整了 `xauth` 配置。一个简单粗暴的解决办法是在运行 `vncserver` 之前输入 `export XAUTHORITY=~/.Xauthority`。这会将\
  \ X 权限文件重置为默认值，这样 `VNC` 就不会产生混乱。另一种解决方法是将权限条从默认文件复制到 SSH 的临时权限文件中，它维护在 `/tmp` 目录树中（在\
  \ `SSH` 登录时输入 `xauth` 将使用此文件）。\n\n如果你已完成 `VNC` 会话，可以使用 `-kill` 选项将其关闭，命令如下：\n\n\
  ```\n $ vncserver -kill :1\n```\n\n你使用的数字是启动该会话时报告的 `VNC` 会话编号。在空时不关闭 `VNC` 服务器并不是必要的，但可以减少服务器计算机的内存负载并提高安全性——不运行的服务器是无法被入侵的。不过在此操作之前，请确保你已经退出了任何重要的程序——当你以这种方式关闭\
  \ `VNC` 服务器时，系统不会提示你是否要保存打开的文件。\n\n## 使用 VNC 客户端访问服务器\n\nLinux `VNC` 客户端被称为 `vncviewer`。要使用它，你输入其名称，可选地加上\
  \ `VNC` 服务器的名称及其显示编号，如下：\n\n```\n $ vncviewer vncserv.threeroomco.com:1\nVNC server\
  \ supports protocol version 3.3 (viewer 3.3)\nPassword:\n```\n\n输入密码时屏幕不会显示字符。`VNC`\
  \ 客户端随后会显示有关连接性质的其他信息，例如颜色深度和其他一些技术信息。如果一切顺利，你将看到一个窗口出现，显示 `VNC` 服务器上的 Linux 桌面。正如下一节提到的，`VNC`\
  \ 服务器的默认设置可能不符合你的，因此你可能需要对其进行调整。\n\n如果不包含显示编号，`VNC` 客户端将尝试连接显示编号 0，这在大多数 Linux 系统上不可行，因为该数字通常被本地\
  \ X 服务器占用。不过，连接到 Windows 或 MacOS `VNC` 服务器时，省略显示编号通常是可以的。如果你省略了主机名，`VNC` 客户端还会使用基于\
  \ X 的对话框提示输入主机名和密码。\n\nWindows 和 MacOS `VNC` 客户端的工作方式与 Linux `VNC viewer` 类似，但程序更倾向于\
  \ `GUI`。具体来说，你双击 `VNC viewer` 图标来启动程序。它会弹出一个对话框，你在其中输入 `VNC` 服务器的名称和显示编号（例如 `vncserv.threeroomco.com:1`）。如果密码正确，`VNC`\
  \ 服务器就会出现。\n\n## 调整 VNC 服务器配置\n\n`VNC`是一个非常有用的远程访问工具，但它并不是没有问题。其中一些是 `VNC` 固有的。幸运的是，这类问题很少；可以通过调整\
  \ VNC 的配置来克服。你可以通过自定义用户文件更改多个功能。\n\n### 调整基础服务器功能\n\n主 `VNC` 服务器程序是 `Xvnc`。该程序包含了\
  \ X 服务器（与本地程序通信）和 `VNC` 服务器（与远程 `VNC` 客户端通信）。不过，你会注意到前面的指令并没有提到 `Xvnc`。这是因为该程序是由一个脚本调用的，该脚本用于启动服务器：`vncserver`。该脚本是用\
  \ Perl 编写的，你可以自己编辑它来调整许多 `VNC` 服务器的默认设置。你可能想要更改的包括以下：\n\n- **自动配置的 X 默认值**——**最近版本的\
  \ `vncserver` 使用 `&GetDisplayDefaults()` 调用来获取 X 显示的各种默认值，例如显示大小和位深。遗憾的是，系统可能会恢复一个对于你的客户端并不合适的尺寸。如果你想使用不同的显示大小，可以在该行前面加一个井号（`#`）将其注释掉。然后你将需要单独设置显示大小。默认脚本包含了在\
  \ `&GetDisplayDefaults()` 调用之前执行此操作的行，正如后文描述。\n\n- **显示大小**——**当 `Xvnc` 启动时，它会创建一个特定大小的虚拟屏幕。如果你不使用自动\
  \ X 默认选项，可以使用 `$geometry` 变量设置此显示大小。例如，你可能会包含如下的一行来设置 900x675 的显示：**\n\n    ```\n\
  \     $geometry = \"900x675\";\n    ```\n\n### 提示\n\n![TIP](img/tip.gif)\n\n\n\n\
  \n由于 VNC 客户端在本地窗口中显示 VNC 服务器的桌面，因此创建一个比客户端屏幕尺寸略小的显示尺寸是合理的，以便为窗口边框留出空间。如果 VNC 显示尺寸过大，用户将不得不滚动其本地\
  \ VNC 窗口才能看到整个服务器桌面。\n\n- **色彩深度**——与显示尺寸一样，你可以通过设置变量来设定色彩深度，在标准脚本中该变量被称为 `$depth`。对于\
  \ X 来说，16 位通常是一个不错的最小值，因为贪恋色彩的程序会夺取其他程序的颜色。然而，这一规则并不适用于 VNC；16 位显示往往会产生损坏的颜色映射。不过，这个问题在未来可能会得到解决。\n\
  \n- **字体路径**——默认的 `vncserver` 脚本使用服务器的默认字体路径。你可以在注释为 `Add font path and color database\
  \ stuff here` 的部分进行调整。相关行使用 `-fp` 参数向 `$cmd` 字符串添加了字体路径，该字符串最终被用于调用 `Xvnc`。你甚至可以按照描述配置\
  \ VNC 使用字体服务器，如第 15 章所示。\n\n- **默认窗口管理器**——默认的 `vncserver` 脚本包含一个名为 `$defaultXStartup`\
  \ 的变量，它存储了默认用户启动脚本的内容。`vncserver` 脚本在用户首次运行时会将此文件写入用户目录。默认的窗口管理器是 `twm`，现在很少有人使用它。你可以通过将\
  \ `twm` 调用更改为你喜欢的任何窗口管理器或桌面环境来调整此默认值，例如 `startkde`、`sawmill` 或 `icewm`。不过，调整 `vncserver`\
  \ 脚本只会影响尚未运行该脚本的用户的默认设置。有关调整现有用户配置的信息，请参阅后续章节“自定义单个用户的设置”。\n\n即使你不熟悉 Perl，也可以浏览脚本以寻找你可能想要调整的更高级的功能。脚本主要通过将选项添加到\
  \ `$cmd` 字符串中来设置传递给 `Xvnc` 的选项，因此如果你能理解添加到该字符串中的选项，你就可以修改它们。输入 `Xvnc -help &> Xvnc-help.txt`\
  \ 会创建一个名为 `Xvnc-help.txt` 的文本文件，其中包含可用 `Xvnc` 选项的信息。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n在进行任何更改之前，务必备份 `vncserver` 脚本。如果你所做的更改导致脚本无法使用，你会庆幸有备份的。\n\n一个重要的说明是，某些发行版自带的\
  \ `vncserver` 脚本与原始版本有显著不同。特别是 Debian 的脚本与原始版本非常不同。尽管如此，这里介绍的建议适用于所有版本，但你可能需要以略有不同的方式进行更改。例如，Debian\
  \ 的 `vncserver` 脚本创建名为 `$fontpath` 的变量，并在其中存储字体路径。\n\n### 自定义单个用户的设置\n\n全局 VNC 服务器设置通过\
  \ `vncserver` 脚本控制。如果你的用户想要自己更改这些设置，他们有三个选择：\n\n- **创建自定义的启动脚本**——单个用户可以将正常的 VNC\
  \ 服务器启动脚本复制到他们的家目录中并如前所述地修改这些副本，然后使用他们自定义的脚本来启动服务器。\n\n- **向脚本传递选项**——`vncserver`\
  \ 脚本接受几个可以用于覆盖默认值的选项。例如，`-geometry` `width``x``height` 设置桌面尺寸。这些选项与底层的 `Xvnc` 选项基本相同。\n\
  \n- **使用个性化选项文件**——标准 VNC 服务器脚本在运行过程结束时运行 `~/.vnc/xstartup` 脚本。这是默认脚本放置启动窗口管理器和\
  \ xterm 窗口命令的地方。用户可以像处理普通的 X 启动脚本一样修改这些文件。某些发行版更改此脚本的名称或位置。例如，Debian 的配置调用 `/etc/X11/Xsession`\
  \ 脚本，该脚本又调用用户的 `~/.session` 脚本。\n\n总体而言，后两个选项通常是最简单的。每个选项都有其作用。例如，用户可以通过 `vncserver`\
  \ 脚本的 `-geometry` 选项设置桌面尺寸，但不能通过选项文件设置；他们可以通过在个人启动脚本中设置来调整他们使用的窗口管理器，但不能通过向 `vncserver`\
  \ 传递选项。作为一般规则，`vncserver` 选项允许用户调整整个 VNC X 服务器的运行方式（类似于标准的 X 服务器选项），但他们的启动脚本选项允许他们调整其桌面环境和窗口管理器的行为（正如他们在更传统的\
  \ X 服务器中的 X 会话选项一样）。\n\n### 在 VNC 中运行 XDMCP 登录服务器\n\nVNC 的一个潜在严重问题是，正如刚才描述的，它要求你使用标准的远程登录协议登录、启动服务器并记住显示编号以连接到正确的显示。这个过程可能是枯燥的，并且要求你运行一个传统的登录服务器，假设你希望允许方便且真正的远程访问。解决这些问题的方案之一是将\
  \ VNC X 服务器与在本地系统上运行的 XDMCP 服务器结合。\n\nVNC X 服务器支持通过 XDMCP 服务器管理其显示，就像大多数 X 服务器一样。要启用此功能，你必须使用\
  \ `-query` `hostname` 选项启动 VNC X 服务器，如前文“配置远程 X 登录客户端”中描述。你可以通过任何通常启动服务器的方式来实现这一点，如第\
  \ 4 章所示。作为一个示例，考虑以下 `xinetd` 配置条目：\n\n```\n service vnc\n{\n        disable    \
  \     = no\n        socket_type     = stream\n        protocol        = tcp\n  \
  \      wait            = no\n        user            = nobody\n        server  \
  \        = /usr/local/bin/Xvnc\n        server_args     = -inetd -query vncserv\
  \ -once\n}\n```\n\n服务器参数极其重要。具体来说`-inetd` 告诉 `Xvnc` 它正从超级服务器运行，`-query vncserv`\
  \ 告诉它调用计算机 `vncserv` 进行 XDMCP 登录提示，`-once` 告诉服务器在调用一次后退出，其效果是在用户注销后终止 VNC 连接。你可以添加更多\
  \ `Xvnc` 选项，例如 `-geometry` 或 `-fp`，以自定义设置。此条目应与 `/etc/services` 中的条目结合，以定义 `vnc`\
  \ 端口号：\n\n```\n vnc             5900/tcp\n```\n\n\n\nVNC 使用端口 5900–5999 进行普通连接，或使用\
  \ 5800–5899 用于 Web 浏览器（Java）访问。端口 5900 显示器 0，5901 对应显示器 1，以此此类推。因此，此定义让 VNC 响应其第一个显示器\
  \ (0)，并立即显示 XDMCP 登录提示。当然，为了使此项生效，必须在 `-query` 指定的系统上运行 XDMCP 服务器。你甚至可以设置多个端口来响应\
  \ VNC 客户端，但对它们进行不同的配置。例如，你可能设置显示器 0 显示 800x600 的桌面，显示器 1 使用 1024x768，以此此类推。你需要多个\
  \ `/etc/services` 条目来识别这些服务器，每个条目都有唯一的名称和端口号。以这种方式运行时，VNC 不会提示密码；它会将该细节留给 XDMCP\
  \ 服务器。（注意，用户名和密码是未加密传输的，这与更传统的 VNC 登录不同。）VNC 在这种运行模式下的另一个特性是，它可以接受多个用户登录到同一个端口，因此用户不需要记住可能发生变化的端口号。粗略估计，当你运行带有\
  \ XDMCP 服务器的 VNC ，，其效果与直接运行 XDMCP 服务器并使用远程 X 服务器非常相似。尽管如此，存在几点主要区别：\n\n* VNC 解决方案要求两台计算机之间建立单一连接。如果用户所处的系统受防火墙保护，这可能会有所帮助，并且可以帮助你减少面向外界的服务器数量。\n\
  * VNC 解决方案在用户所在的地方使用 VNC 客户端，而不是 X 服务器。作为开源软件，VNC 客户端价格低廉，但大多数用于 Windows 和 MacOS\
  \ 的 X 服务器都是商业软件。\n* 如前所述，VNC 协议有其独特的癖之处。与用户计算机上的原生 X 服务器相比，VNC 在这方面可能更优也可能更差，具体取决于\
  \ X 服务器的质量和用户的特定需求。\n* 如前所述，VNC 协议在大多数连接上往往比 X 协议慢，尽管在某些连接上可能更快，因此使用该方案会对速度产生影响。\n\
  \n# 访问技术比较\n\n表 14.1 总结了本章讨论的各种访问技术的重要特性。注意，这些评估中的某些取决于配置的或使用的特定软件产品。例如，文本模式 VNC\
  \ 登录的安全性取决于所使用的文本模式工具；如果你使用 SSH 建立初始连接，你的登录安全性应该是极，但如果你使用未加密的登录协议，该初始连接可能会被破解，尽管如果你为\
  \ VNC 连接使用不同的密码，其密码仍然是安全的。\n\n**表 14.1. 远程 GUI 访问比较**\n\n| 特性 | 未加密文本模式 X 登录 | SSH\
  \ 文本模式 X 登录 | XDMCP X 登录 | 文本模式 VNC 登录 | 带有 XDMCP 的 VNC |\n| --- | --- | --- | ---\
  \ | --- | --- |\n| 登录安全性 | 差 | 优秀 | 差 | 从差到优秀 | 差 |\n| 会话安全性 | 差 | 优秀 | 差 | 差 |\
  \ 差 |\n| 防火墙出现问题的可能性 | 高 | 低 | 高 | 低 | 低 |\n| 会话持久性（注销后重新登录同一会话） | 低 | 低 | 低 | 高\
  \ | 低 |\n| 速度 | 高 | 中等 | 高 | 低到中等 | 低到中等 |\n| 出现问题的可能性 | 低到中等 | 低到中等 | 低到中等 | 中\
  \ | 中 |\n\n你应该使用哪种 GUI 访问技术？这是一个没有简单答案的问题。X 是 Linux 或 UNIX 系统之间连接的优秀工具，特别是在单个子网内。此类系统几乎已经安装了所有必要的软件，因此使用\
  \ X 相当简单，而且你会获得良好的速度。如果你想从 Windows 或 MacOS 访问 Linux 系统，X 也是一个不错的选择，但你需要为非 Linux\
  \ 系统寻找 X 服务器，而这些服务器可能是昂贵的。对于此类环境，VNC 是一个更廉价的选择，而且它具有反向操作的优势（你可以从 Linux 控制 Windows\
  \ 或 MacOS 系统）。当用户所处的系统受防火墙保护时，VNC 可能也值得用于远程访问，因为防火墙阻止指向本地 X 服务器的回程连接的可能性可能大于阻止发出的\
  \ VNC 连接。\n\n## 总结\n\n远程登录服务器是非常实用的工具，特别是在用户在许多系统中拥有账户，或者你希望通过在性能强大的单机上运行某些程序并从性能较弱的系统进行访问的环境中。最常见的\
  \ Linux GUI 环境 X 本质上支持网络功能，因此可以作为提供远程 GUI 访问的良好方法。通过 X 配置远程访问有多种方法，包括使用文本模式访问协议“引导”基于\
  \ X 的工具，或使用 XDMCP 服务器来验证远程 X 服务器的用户。另一个选项是使用 VNC，从网络角度来看，它比直接 X 连接更复杂，但从用户角度来看通常更简单。配置\
  \ VNC 服务器以提供远程访问有多种方法，因此选项的总范围（通过直接 X 连接和 VNC）非常广泛。\n\n# 第 15 章。使用字体服务器提供一致的字体\n\
  \n\n\n\n\n在我们文化中，每个孩子从小就开始学习字母的形状了。然而，这些形状究竟是什么呢？一个字母字母可以用许多不同的方式形成。例如，考虑本章标题开头的字母\
  \ `P`。在章节标题字体中，这个字母看起来与该段落第二个句子开头时的不同。反之，它与斜体 `P` 这种变体也不同。这些都是正在使用的不同 `fonts` 的示例。字体是针对字母表中所有字符的设计，通常包括大写字母和小写字母，以及数字和标点符号等辅助字符。少数奇特的字体根本不是字母的；它们只包含特殊符号。无论如何，字体对于现代计算机来说都是至关重要的，因为今天的用户期望在使用文字处理器和\
  \ Web 浏览器等高度依赖文本的程序时，能够从许多不同的字体中进行选择。有时这种能力是极其重要的，例如在电子出版任务中。在其他情况下，它更多是为了方便，比如当你为阅读电子邮件选择字体时。\n\
  \n在 Linux 中可以实现的一种字体处理方法是使用 `font server`（字体服务器）。这种服务器可以访问字体集合，并将这些字体交付给网络上的客户端。起初，字体服务器似乎毫无意义——毕竟，在\
  \ Windows 和 MacOS 世界中，单个电脑都能很好地处理自己的字体，甚至 Linux 系统默认也是这样配置的。然而，在某些情况下，字体服务器可以减轻你的管理任务，或帮助你实现其他可能无法实现的目标。要使用字体服务器，了解一些用于存储字体的文件格式会有帮助，因为这些格式可以以不同的方式使用，并有不同的优缺点。大多数\
  \ Linux 字体服务器处理一组有限的任务，这些定义为 X Window 系统的一部分。不过，少数服务器扩展了这些任务。某些程序（例如某些文字处理器）依赖这些扩展的字体服务器来帮助它们完成工作。\n\
  \n# 何时运行字体服务器\n\n普通 Linux 电脑 X 配置的一部分是指定该系统的 `font path`（字体路径）。对于 XFree86，这是使用 `XF86Config`\
  \ 文件中的 `FontPath` 条目设置的（该文件通常存储在 `/etc` 或 `/etc/X11` 中）。字体路径由一个或多个 X 服务器可以字体字体的位置组成。在\
  \ 20 世纪 90 年代，Linux 发行版倾向于命名字体路径中的本地文件系统目录。这些目录包含了字体和字体配置文件。这种配置仍然是可能的，而且今天仍被用作某些发行版默认字体配置的一部分或全部。\n\
  \n然而，告诉 X 使用存储在硬盘上的字体存在几个问题。首先，这依赖于 X 处理相关字体格式的能力。例如，在版本 4.0 发布之前，XFree86 无法直接处理流行的\
  \ TrueType 字体格式。直接向 XFree86 增加对某种字体格式的支持是非常困难的，但字体服务器是一个很小且相对简单的程序，因此 TrueType 支持在成为\
  \ XFree86 的标准部分很之前就已经出现在字体服务器中了。随着 XFree86 4.0 的发布，TrueType 支持不再问题，但这种情况可能会随着新的或扩展的字体格式再次出现，例如流行度正在缓慢增长的\
  \ Multiple Master 格式。\n\n在磁盘上存储字体的另一个问题是计算机网络的行政工作。如果你拥有一组想要供网络上所有电脑使用的字体，那么在网络上的所有每台电脑上安装它们将是繁琐的。如果你接着想添加、删除或更改某些字体，将面临更多繁琐。使用字体服务器允许你集中管理字体配置；你只需要配置所有客户端使用特定的字体服务器，然后对该服务器进行添加和其他更改即可。这可以大大减轻你的管理负担。\n\
  \n最后，字体服务器有时可以提供 X 正常字体处理不具备的功能。这对于文字处理器、页面布局程序和其他文本处理程序特别为重要。X 的设计考虑到的是显示器上的显示，而不是纸质打印输出。文字处理器和类似程序经常需要执行\
  \ X 字体处理简单无法支持的文本操作。扩展的字体服务器可以满足这些需求，从而简化编写处理文本布局的程序任务，特别是那些提供“所见即所得”（WYSIWYG）打印的程序。\n\
  \n字体服务器可以在本地运行，为单台电脑提供字体，也可以作为全网络服务器运行，为许多系统交付字体。如今的一些 Linux 发行版依赖于第一种配置来处理 X 中的部分或全部电脑字体需求。后一种配置是你需要根据你自己的网络需求进行设计的。字体服务器配置的大多数特征在这两种操作模式下是相同的，只有少数细节不同。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n在美国，字体不受版权保护的，但它们在计算机可读字体 `files` 中的实现可以受版权保护。在许多其他国家，字体可以受版权保护。无论如何，在将字体提供到字体服务器之前，你应该检查字体的许可\
  \ string。字体的许可可能会禁止此类使用，或要求你根据使用字体的电脑数量支付费用。\n\n# 理解字体文件格式\n\n广义上，字体分为两种类型：`bitmapped`（位图）和\
  \ `outline`（轮廓或 `scaleable` 可缩放）。这两种类型的字体具有非常不同的特性，最适用于不同的方式。常见的 Linux 字体服务器支持这两种字体。理解它们之间的区别以及了解特定字体格式的示例是非常重要的，这样你才知道它们的能力和局限性。\n\
  \n## 位图字体格式\n\n大多数计算机字体显示设备（包括最常见的电脑显卡和打印机）将它们的显示区域划分为精细的网格。在这个网格中，每个正方形（称为 `pixel`，`picture\
  \ element` 的缩写）被分配一种颜色。对于像单色激光打印机这样的双色显示，颜色可能仅为两个值之一，例如黑色或白色。彩色打印机和现代显示器支持多种颜色，但标准的\
  \ X 字体处理只支持两种颜色（你可以设置这些颜色是什么，例如黑白色或红黄色，但对于任何给定的字母可能只有两种）。因此，字体的每个像素可以用一个位表示。这一切的意义在于，计算机必须将字体挤入计算机显示器，这可以被看作位图，即\
  \ `bitmap`。实现这一点的一种明显方法是直接以这种形式表示字体。这就是位图字体方法。\n\n\n\n\n\n例如，考虑图 15.1，它显示了位点字体中单个字母的表示。这种表示具有许多重要特征，即使撇开哪些像素是黑色或白色的细节也是如此。例如，用于表示字母的网格大小是固定的。在`proportionally-spaced`（比例比例）字体中（如书中大多数文本使用的字体），某些字母比其他字母宽。因此，位点字体格式通常允许在单个字体中使用可变网格宽度。不过，高度通常是固定的。（带有`descenders,`\
  \ 的字母是指延伸到大多数字母底部的元素，如字母 `g,`、`j,`、`p,`、`q,` 和 `y,` 部分使用比大多数其他字母更低的网格部分。注意，在图 15.1\
  \ 中，字母位于其网格的高处，以便为那些需要的字符留下延伸部。）因为网格大小是固定的，字体在任何给定设备上都以固定的大小显示，但如果分辨率发生变化，字体大小就会改变。为了在许多设备上支持单一字体，或在单个设备上支持不同尺寸的字体变体，需要许多不同的字体位图。\n\
  \n![位点字体精确定义了哪些像素是黑色的，哪些是白色的。](img/15fig01.gif)\n\n**图 15.1. 位点字体精确定义了哪些像素是黑色的，哪些是白色的。**\n\
  \n显示器的分辨率通常以`dots per inch (dpi),`（每英寸点数）为单位，即每英寸内排列的像素数量。大多数设备的水平和垂直分辨率大致相同，但有时会有所不同。显示器的分辨率通常在\
  \ 72 到 120 dpi 之间，而打印机通常支持 144 到 1200 dpi 的分辨率（这些打印机分辨率中最低的用于快速或低质量打印模式，或用于非常老的针式打印机；即使是非常老旧的激光打印机也支持\
  \ 300 dpi 的打印）。极高端的打印机和排字设备支持更高的分辨率。可用的多种分辨率，加上为每种分辨率和尺寸创建新字体文件的需求，导致了位点字体的问题之一：即使只是一组适中的字体显示设备，支持所需的字体文件数量也是巨大的。\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n许多打印机包含了自己的字体，其中某些可能是位点字体。在 20 世纪 80 年代，这些字体通常被用来代替存储在计算机上的字体。今天，某些程序可能会使用打印机的字体，但另一些程序依赖存储在计算机上的字体。\n\
  \n字体大小以`points,`（磅）测量，这是印刷业的术语。正文的典型大小约为 9–14 磅，取决于字体和文本的目的。较大的字号对应于屏幕或页面上较大的字符。位点字体的设计是为了在特定分辨率下创建特定的字号——例如\
  \ 144 dpi 下的 12 磅。同一个字体文件可能在不同的分辨率下创建不同的字号，例如 72 dpi 下的 24 磅，但专为这种新分辨率从头设计的字体可能会在细微之处有所不同。调整位点字体的大小是可能的（例如将此\
  \ 12 磅、144 dpi 字体以 10 磅、144 dpi 显示），但结果通常在美学上并不理想，因为缺乏艺术细胞的计算机程序将添加或删除像素。\n\n位点格式的主要优势是它们简单。这种简单性意味着字体的快速显示；计算机可以将内存中存储的字体的几个位移动到显示器或打印机输出缓冲区，以该字体显示文本。这一因素在\
  \ 20 世纪 80 年代很重要，在 20 世纪 90 年代初也如此，当时位点字体格式的显示效果比竞争字体格式快得多。今天，CPU 的速度足够快，这个因素不再那么重要。\n\
  \n存在许多不同的位点字体格式。X 支持几种格式。X 的早期版本使用名为 Server Normal Format (SNF) 的格式，但 `SNF` 字体现在很少见。如今大多数\
  \ X 位点字体都是 Portable Compiled Font (PCF) 格式。Bitmap Distribution Format (BDF) 是 X\
  \ 的另一种常见位点字体格式，但它通常不被服务器直接使用。相反，你通过名为 `bdftopcf` 的转换程序传递 `BDF` 字体，创建一个 X 使用的 `PCF`\
  \ 文件。其他操作系统经常使用其他字体格式，如果你想在 Linux 中使用外来位点字体，其中某些格式提供了相应的转换器。\n\n### 注意\n\n![注意](img/note.gif)\n\
  \nXFree86 可以使用 `gzip` 压缩过的 `PCF` 字体。大多数发行版都利用这一事实，以占用更磁盘空间的格式发行字体，因此 `PCF` 文件名通常以\
  \ `.pcf.gz` 结尾。你不需要解压缩这些文件以便 X 使用。\n\n除了 X 之外，其他程序也使用自己的位点格式。最著名 TeX 布局系统，它使用 Packed\
  \ Font （这些字体使用 `.pk` 扩展）。因为 TeX 设计时考虑到的是打印，而不是在屏幕上显示字体，因此 TeX 封装字体在像素宽度和高度上通常比大多数其他字体格式大得多。\n\
  \n## 轮廓格式 (Outline Formats)\n\n位点字体格式的主要问题之一是它们的扩展性不好。如果你想在同一设备上支持不同大小的字体，或在各种设备上支持相同大小的字体，你需要多个文件。鉴于当今大量的显示设备，以及用户在文字处理器等工具中缩放字体的需求，这种需要多个文件来创建良好显示的需求是极没有吸引力的。解决方案是使用轮廓（又称可缩放）字体格式。这些格式不以位图的形式描述字体；而是使用对字体曲线和线条的数学描述。例如，再次考虑图\
  \ 15.1。如果将 8×8 网格替换为分辨率高得（例如 80,000×80,000）的网格，该网格中描述的 `H` 可以轮廓描述为一系列线条和交叉点，如表 15.1。\n\
  \n**表 15.1. 来自图 15.1 的字母 H 的部分轮廓描述**\n\n| 操作 | X 坐标 | Y 坐标 |\n| --- | --- | ---\
  \ |\n| 起 | 10,000 | 10,000 |\n| 线到 | 10,000 | 60,000 |\n| 线到 | 20,000 | 60,000 |\n\
  | 线到 | 20,000 | 40,000 |\n| 等等… | … | … |\n\n\n\n\n\n一旦轮廓完成，它就会被填充为实色。这种描述方式的优势在于它可以轻松缩放到所需的几乎任何分辨率；只需要将底层的坐标网格重新映射到实际坐标网格即可。底层网格的分辨极高，因此控制点放置的误差是微不足道的。当然，大多数字体需要的比前一个示例中的简单线条描述要复杂。轮廓字体格式使用数学形式来表示各种类型的曲线，而不仅仅是直线。许多此类格式还包含了对`hints,`（提示）的能力，这些是人类设计师可以构建到字体中的覆盖项，用于改进字体在低分辨率下的外观。如果没有提示信息，轮廓字体在计算机显示器等低分辨率设备上以小尺寸显示时，往往变得难以辨认。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n从技术上讲，字体（font）是单一尺寸的表示，而字体族（typeface）是一系列不同尺寸的字体集合。因此，位图字体是真正的字体，但轮廓字体更准确地应该称为字体族。然而，计算机行业在很大程度上忽略了这种区别，实际上是微妙地重新定义了`font,`一词。在本章中，我遵循计算机行业对该术的用法。\n\
  \n由于计算机必须使用字体的轮廓描述来精确确定哪些像素是黑色、哪些是白色，因此使用轮廓字体显示文本比使用类似的位图字体显示相同文本需要花费更多时间。有多种方法可以尽量减少这个问题，例如在特定尺寸下预渲染字体并使用此预渲染版本。在某种意义上，这是字体服务器的工作范围内，因为字体服务器在提供轮廓字体时，会对其进行渲染并将位图交付给客户端。客户端并不知道处理的是轮廓字体还是位图字体。\n\
  \n正如有许多位图字体格式一样，也有许多轮廓字体格式。这些包括 Bitstream 的 Speedo，Adobe 的 Type 1、Type 3、Type 5\
  \ 和 Type 42，以及 Apple 的 TrueType。（Type 42 字体实际上只是为了在 PostScript 打印机上使用而编码的 TrueType\
  \ 字体。）这些格式在基础方式上与位图字体格式有所不同，因为轮廓字体格式可以使用本质上完全不同的线条和曲线数学描述类型。通常可以从一种格式转换为另一种格式，但这种转换经常会以微妙的方式改变字体，或导致提示信息丢失，从而降低字体在低分辨率下的外观。只要可能，最好使用字体的原始格式，或从字体发行商处获得替代格式。\n\
  \nLinux 系统（或更准确地说，XFree86）长期以来支持 Speedo 和 Adobe Type 1（又名 `Adobe Type Manager` 或\
  \ `ATM`）轮廓字体格式。Speedo 在字体市场和 Linux 中是一个相当次要的角色，但 Type 1 字体在商业字体 CD-ROM 和互联网上很容易获得，Linux\
  \ 也自带了几种 Type 1 字体。然而，在 Windows 和 MacOS 世界，TrueType 的流行程度已经超过了 Type 1，这很大程度上是因为它是\
  \ Windows 标准轮廓字体格式。因此，TrueType 字体比 Type 1 字体更容易获得。TrueType 字体以在低分辨率下看起来比 Type 1\
  \ 字体更好而闻名，但这种声誉很大程度上基于少数提示得非常好的字体。包含少量提示信息的廉价 TrueType 字体在屏幕上的效果往往并不比其 Type 1 字体更好。\n\
  \n### 提示\n\n![TIP](img/tip.gif)\n\n微软制作了一些提示非常良好的 TrueType 字体，供 Web 浏览器使用，并从其网站\
  \ [`www.microsoft.com/typography/fontpack/`](http://www.microsoft.com/typography/fontpack/)\
  \ 提供。在 Linux 中使用这些字体最简单的方法是下载为 Windows 3.1 设计的文件。这些是自解压（在 Windows 中）zip 文件归包；在 Linux\
  \ 中，你可以使用 `unzip` 命令提取其内容。然后你可以按照接下来的章节“常用默认字体服务器配置”中的描述安装字体。许多 Web 网站假设已安装这些字体，因此这样做可以帮助你的用户按照预期方式查看\
  \ Web 页面。\n\n在版本 4.0 之前，XFree86 不支持 TrueType 字体，因此在 Linux 中使用它们的唯一方法是通过字体服务器。今天，你可以直接在\
  \ X 中安装 TrueType 字体，但许多发行版在 XFree86 4.0 发布之前就开始使用本地字体服务器来为 TrueType 字体提供支持，并继续使用这些配置。\n\
  \n正如 X 不是唯一使用位图字体的工具一样，X 也轮廓字体的唯一使用者。例如，有各种工具允许 TeX 使用轮廓字体。对许多用户具有重要意义的是，作为非 PostScript\
  \ 打印机 PostScript 解释器的 Ghostscript 程序可以使用轮廓字体——主要是 Type 1 字体，但也包括 TrueType 在内的其他格式。某些文字处理器要求你在它们内部安装字体，同时在\
  \ X 中也安装。大多数此类程序不使用字体服务器，尽管某些文字处理器是例外，正如“运行扩展字体服务器”中描述的。\n\n# 运行传统的字体服务器\n\n在本章中，我使用`传统字体服务器`一词来指代类似\
  \ XFree86 自带的 `xfs` 程序或与其工作原理非常相似的程序。这些程序使用标准的字体服务器协议，根据位图字体或轮廓字体文件将位图字体交付给 X。这些字体服务器的设计旨在支持显示器上的字体显示；它们提供的很少或没有功能可以帮助计算机将屏幕上的字体与文字处理器等程序将打印的字体进行协调。由于\
  \ XFree86 自带了 `xfs`，你可能已经拥有了这样的字体服务器，即使它目前没有在你的系统上运行。配置此服务器运行需要编辑几个配置文件。如果它已经在运行，你可以重新配置它，以便运行在其他计算机上的\
  \ X 服务器可以访问它。\n\n## Linux 字体服务器选项\n\nLinux 中最常见的字体服务器是随 XFree86 自带的 `xfs` 程序。在某种意义上，这个程序只是从\
  \ X 本身移除的字体处理代码，并结合了一些网络代码作为服务器运行。该服务器通常位于 `/usr/X11R6/bin`，通常通过名为 `XFree86-xfs`\
  \ 或 `xfs` 的包安装。\n\n如果你运行的是 4.0 之前的 XFree86 版本，你可能希望获取一个可以处理 TrueType 字字的更新字体服务器。有两个这样的服务器：\n\
  \n- `xfstt`：该包是一个仅限 TrueType 的字体服务器——也就是说，它不提供 Type 1、BDF 或任何其他字体格式。它是为运行旧版 XFree86（4.0\
  \ 之前版本）的系统添加 TrueType 支持的一种有效方法，如果你只想提供 TrueType 字体，字体网络字体服务器。但有一个主要的限制：如果你的网络包含了内部使用不同字节序的机器（例如\
  \ x86 和 PowerPC 系统），你将无法在它们之间共享服务器。这是因为 `xfstt` 交付字体格式依赖于 CPU 的内部字节序。你可以从 [ftp://ftp.metalab.unc.edu/pub/Linux/X11/fonts/](http://ftp.metalab.unc.edu/pub/linux/x11/fonts/)\
  \ 下载它，位于 `xfstt-1.1.tar.gz` 文件（如果程序在将来更新，此文件名可能会 way）。\n\n\n\n\n\n# `xfsft` — 这是标准\
  \ XFree86 3.3.x `xfs` 包的修改版本。这些修改引入了 FreeType ([http://freetype.sourceforge.net/index2.html])\
  \ TrueType 渲染器。其结果是一个能够处理 TrueType 以及 Type 1、BDF 和其他字体格式的字体服务器。这些修改已经合并到 XFree86\
  \ 4.0 的标准 `xfs` 程序中，因此即使你运行的是较旧版本的 XFree86，你可能仍然可以使用标准程序。如果你倾向于使用 4.0 之前的代码，请查看\
  \ `xfsft` 网页：`www.dcs.ed.ac.uk/home/jec/programs/xfsft/)。\n\n这两个软件包实现了两个不同的 TrueType\
  \ 字体渲染器，而这些渲染器又与苹果和微软在其操作系统中所使用的渲染器不同。结果是，同一个字体在相同的分辨率和大小下显示，取决于你使用的操作系统和（如果适用）字体服务器，可能会完全不同。`xfstt`\
  \ 和 `xfsft` 对大多数字体都表现良好，但如果你在某些字体上遇到问题，或者对渲染质量不满意，你可能想要寻找替代字体服务器。\n\n### NOTE\n\n\
  ![NOTE`\n\nWindows 和 MacOS 都可选地实现了一种名为*字体平滑*或*抗锯齿*的功能，其中某些像素被着色为灰色，而不是完全的黑色或白色。其结果是，人眼看到的字体轮廓看起来比通常情况下更平滑。一些人喜欢这种效果，但另一些人则不喜欢。某些\
  \ X 程序实现了了自己的抗锯齿，但大多数并没有实现，而且 X 直到 4.0.2 版本才原生支持该功能。对该功能的支持仍然很少见，且配置它需要一些额外的步骤，SuSE\
  \ Linux 的相关记录在 [http://sdb.suse.de/en/sdb/html/chofman_ttf_72.html] 中。\n\n尽管细节有所不同，但传统的\
  \ Linux 字体服务器的配置方式大相同。字体必须放置在一个或多个目录中，并且必须创建列出这些目录中字体的配置概览文件。然后配置字体服务器以检查这些目录，并提供目录配置文件指向的字体。接下来的两个部分描述了\
  \ `xfs` 或 `xfsft` 的这一过程，但 `xfstt` 的配置并没有很大区别。\n\n## 常见的默认字体服务器配置\n\n当你安装 Linux 和\
  \ XFree86 时，系统会创建一个名为 `XF86Config` 的默认 XFree86 配置文件，它位于 `/etc` 或 `/etc/X11`。如前所述，该文件包含许多\
  \ `FontPath` 条目，指向你计算机上的目录或字体服务器。例如，你可能会在 `XF86Config` 文件中看到如下内容：\n\n```\nFontPath\
  \  \"/usr/X11R6/lib/fonts/Type1/\"\nFontPath  \"unix/:7100\"\nFontPath  \"tcp/zapf:7100\"\
  \n```\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n没有任何 Linux 发行版默认提供类似上述的字体路径。然而，这三条条目说明了\
  \ `FontPath` 条目可能采取的三种主要形式。\n\n第一行 `FontPath` 说明了本地字体的使用，不涉及字体服务器。大多数 Linux 发行版将字体存放在几个目录中，因此当发行版直接以这种方式使用字体时，会有几行\
  \ `FontPath`，每行列出一个目录。当被要求查找指定名称的字体时，系统会依次搜索每个目录，直到找到该字体或路径耗尽。\n\n第二行说明了运行在本地计算机上的字体服务器。`unix`\
  \ 标识符表示服务器正在使用 UNIX 域套字系统运行，这允许在本地计算机上进行类似网络的连接。最后的数字（`7100`）是服务器监听连接的端口。如果你在系统中看到这样的一行，很可能只有少数或没有直接指向字体目录的条目。你可以按照稍后在“调整字体可用性”中描述的，调整配置以添加你自己的字体。\n\
  \n第三行显示了网络字体服务器。规范中的 `tcp` 表示该服务器使用标准的 TCP/IP 网络。斜杠（`/`）后面的名称（在本例中为 `zapf`）是字体服务器的名称。（此示例仅列出了机器名，而非全名。它也可以同样是全名，例如\
  \ zapf.threeroomco.com.）结尾的数字（`7100`）是服务器的端口号。\n\n字体服务器传统上使用端口 7100，无论是本地服务器还是全\
  \ TCP/IP 字体服务器。（少数发行版使用不寻常的端口号 -1 用于本地连接。）然而，这种约定有时会导致冲突，因为除你配置的服务器之外的字体服务器可能会决定占用\
  \ 7100 端口。这在你运行启动扩展字体服务器的程序时可能会发生，例如在接下来的章节“运行扩展字体服务器”中讨论的那些程序供其自身使用。在这种情况下，你可以尝试另一个端口，例如\
  \ 7101 或 7102。\n\n字体服务器需要配置文件。官方默认位置是 `/etc/X11/fs/conf`，但许多发行版使用 `config` 而不是 `conf`。这些文件指定了字体文件的位置以及服务器运行的若干细节，稍后将讨论。字体服务器通常在\
  \ SysV 启动脚本中启动，但如果你向一个默认不启动字体服务器的系统添加了它，你可能会通过本地启动文件来这样做。某些发行版（如 Red Hat）包含的 SysV\
  \ 文件会仔细检查字体目录，以查看其字体列表是否需要更新。如果是，这些脚本会自动执行这些更新。这使得添加字体变得简单，因为你只需要将新字体放入适当的目录并重启字体服务器即可。另一方面，如果用于自动生成适当配置文件的工具与你想要使用的字体配合得不佳，你可能需要禁用此自动配置功能，至少针对一个字体目录，以便你可以创建一个效果更好的手动配置。\n\
  \n## 为局域网（LAN）调整字体服务器\n\n大多数自动启动字体服务器的发行版都会采取措施确保其不会被从其他计算机轻松访问。这样做是一种安全预防措施，以限制在字体服务器出现可能被外部人员利用的安全问题时可能造成的潜在损害。因此，如果你想让你的字体服务器对其他计算机可用，你必须执行两个操作之一：\n\
  \n*   除第一个实例外提供一个*第二个*字体服务器实例。如果你遵循这条路径，可以修改你的字体服务器启动脚本，或以其他某种方式启动第二个服务器。你可能需要使用\
  \ `xfs` 的 `-config /path/to/config/file` 选项来告诉第二个服务器使用与第一个不同的配置文件。\n*   修改字体服务器的配置，取消阻止从外部访问的配置块。这在许多方面可能是更高效的选项，但如果你想为客户端提供与本地不同的字体集，那么这可能不是最佳选择。\n\
  \n### NOTE\n\n![NOTE](img/note.gif)\n\n即使在没有运行 X 的计算机上你也可以运行字体服务器。当然，你必须安装服务器依赖的任何包，这可能包含大部分\
  \ X 内容，但你不需要实际运行 X 服务器来运行字体服务器。\n\n\n\n\n\n发行版主要通过两种方式限制对默认运行的字体服务器的访问。每种方法都需要不同的步骤来启用对字体服务器的访问：\n\
  \n- `不监听 TCP 连接` — Red Hat 7.2 在其 `/etc/X11/fs/config` 文件中包含一个选项行，可防止服务器监听 `TCP`\
  \ 连接。该行是 `no-listen = tcp`。服务器的其他配置均正常，并运行在端口 `7100` 上。因此，注释掉此行，关闭服务器并重新启动，将让任何连接到端口\
  \ `7100` 的计算机都能访问该服务器。Red Hat 使用一个名为 `xfs` 的 SysV 启动脚本来启动和停止服务器，因此你可以像第 4 章,启动服务器\
  \ 中描述的那样关闭并重新启动它。\n\n- `端口 -1` — Mandrake 8.1 将其字体服务器配置为在端口 –1 上运行，这非常不寻常并有效地阻止了外部连接。要更改此配置，你必须编辑启动脚本文件（`/etc/rc.d/init.d/xfs`），使服务器在另一个端口启动。找到以\
  \ `daemon xfs -port -1` 开头的行，并将端口号从 `-1` 改为 `7100` 或其他正端口号。你还必须编辑 `/etc/XF86Config`\
  \ 文件（或取决于你的 X 服务器，位于 `/etc/X11` 下的 `XF86Config` 或 `XF86Config-4` 文件），以便在新的端口号上查找字体服务器。找到引用\
  \ `unix/:-1` 的 `FontPath` 行，并将其更改指向 `unix/:7100`（或你使用的任何端口号）。然后你必须停止并启动 `xfs` 并重启\
  \ X 服务器（Mandrake 默认登录界面上的“Restart X Server”按钮可以实现此操作）。\n\n### 警告\n\n![警告](img/warning.gif)\n\
  \n为当前运行 X 的系统重新配置字体服务器可能是复杂的。如果字体服务器变得不可用，运行中的程序可能会因为无法访问字体而挂起。因此，最好从文本模式登录后，使用文本模式程序重新配置字体服务器。Red\
  \ Hat 和 Mandrake 用的 `xfs` SysV 脚本在通过传递 `restart` 选项时*不会*应用你的更改，因此你必须显式地发送 `stop`\
  \ 选项，然后用 `start` 重新启动它们。\n\n在调整字体服务器以向网络提供字体后，你应该能够将其他系统的 X 服务器指向你重新配置的那个服务器。你可以通过在计算机的\
  \ `XF86Config` 文件中添加 `FontPath` 条目来实现。该条目应该类似于之前所示的 `tcp` 示例，但它自然要指向你的字体服务器计算机并使用其端口号。根据每台计算机上安装的字体，你可能可以从客户端系统中移除某些\
  \ `FontPath` 条目，但这可能会增加字体服务器的负载。为了尽地减少字体服务器的负载，请将它的条目添加到客户端所有其他 `FontPath` 条目的*之后*。这将导致客户端尽可能使用它们自己的本地字体。\n\
  \n### 警告\n\n![警告](img/warning.gif)\n\n如果你将计算机配置为*仅*使用外部字体服务器，那么一旦字体服务器变得不可用，该系统的\
  \ X 安装将无法使用。通常情况下，最好保持发行版的默认字体安装不受影响，并在现有的字体路径中添加字体服务器。（不过，你可能想精简某些发行版的字体；某些发行版带有很多大量你可能不喜欢的字体。但你应该保持核心\
  \ X 字字体完整无损。）\n\n你应该担心字体服务器的安全性。如果你在一个没有互联网连接的隔离局域网中，这可能不是一个主要问题，但在暴露于互联网的计算机上运行字体服务器存在安全风险，尽管风险很小。字体服务器通常不复杂，不需要密码，因此你不会与它们遇到密码安全问题。然而，与所有服务器一样，字体服务器可能存在漏洞，可以想象未来的某些字体服务器漏洞可能会导致服务器计算机被破解。出于原因，我建议仅在至少与互联网部分隔离的网络上为其他计算机运行字体服务器——例如，在专用防火墙计算机保护的子网上。该专用防火墙应阻止外部计算机对你字体服务器端口的访问。你还认真考虑配置\
  \ `iptables` 来阻止已知本地计算机以外的所有设备对该端口的访问，正如第 25 章,配置 iptables 中所述。\n\n## 调整字体可用\n\n\
  运行字体服务器的主要意义是为了相对容易地调整整个 Linux 或 UNIX 计算机网络的字体配置。（Windows、MacOS 和其他操作系统的 X 服务器有时也可以使用远程字体服务器，因此你甚至可以为这些操作系统的\
  \ X 服务器提供一组一致的字体。）调整通过字体服务器提供的字体分为两个步骤：调整字体服务器的字体路径（这与 X 服务器的字体路径不同），以及从字体路径中的各个目录添加或删除字体。\n\
  \n### 更改字体服务器的字体路径\n\n字体服务器的字体路径设置在服务器的配置文件（通常为 `/etc/X11/fs/config` 或 `/etc/X11/fs/conf`）中。字体路径不是使用\
  \ `XF86Config` 中的 `FontPath` 关键字设置的；相反，该文件使用 `catalogue` 关键字如下：\n\n```\ncatalogue\
  \ = /usr/X11R6/lib/X11/fonts/75dpi:unscaled,\n            /usr/X11R6/lib/X11/fonts/Type1,\n\
  \            /usr/X11R6/lib/X11/fonts/TrueType,\n            /usr/X11R6/lib/X11/fonts/75dpi\n\
  ```\n\n此列表可能跨越多个行。逗号分隔字体路径中的目录。最后一个条目缺少尾随逗号；这标志着列表的结束。如果目录后跟着字符串 `:unscaled`，则表示该目录中的位图字体仅在它们的尺寸与请求尺寸*完全匹配*时才被提供。如果省略了此字符串，当名称匹配但尺寸不匹配时，字体服务器会对位图字体进行缩放（通常效果很差）以匹配请求。（此约定也用在\
  \ `XF86Config` 字体路径规范中。）因此在前面的示例中，字体服务器使用来自 `75dpi` 目录的与请求字体大小完全匹配的位图字体。如果没有找到匹配项，系统将尝试在\
  \ `Type1` 和 `TrueType` 目录中寻找匹配项，最后回到 `75dpi` 提供缩放后的位图字体作为最后的手段。\n\n你可以通过修改此列表来添加或删除整个字体目录。你可能想添加一个包含从各种来源收集的字体的目录，或者一个带有字体\
  \ CD-ROM 字体的目录。某些发行版带有填充了发行特定字体的目录。如果你不想提供这些字体，可以从列表中删除它们。（不过，如果你删除了原始的最后一项，请确保删除新列表中最后一个目录的逗号。）\n\
  \n### 向字体目录添加字体\n\nX 字体服务器配置中较复杂的部分是设置字体目录配置文件。这些文件被称为 `fonts.dir`，它们的格式在摘要中看起来具有欺骗性的简单：\n\
  \n```\nnumber\nfont-filename1 XLFD1\nfont-filename2 XLFD2\n...\n```\n\n第一行包含一个数字，指定该文件描述了多少字体。后续每一行描述这些字体中的一个。每一行都以字体文件名开头，例如\
  \ `goodfont.ttf` 或 `t1f32.pfb`。指定的字体文件必须存在于该目录中。\n\n### 注意\n\n![注意](img/note.gif)\n\
  \n\n\n\n\nType 1 字体采用多文件格式。打印机字体二进制（`PFB`）文件包含了大部分字体数据，并且它是你通常在 `fonts.dir` 文件中列出的文件名。或者，你也可以列出打印机字体\
  \ ASCII (`PFA`) 文件，它包含相同的数据，但格式略有不同。其他文件名可能以 `.pfm`、`.afb`、`.afm` 等结尾。其他工具可能会使用这些文件，但对于字体服务器本身并不是严格必要的。\n\
  \n该行的其余部分由 X 逻辑字体描述符 (`XLFD`) 消耗，它是一个描述字体的字符串。示例如下：\n\n```\n -bitstream-charter-medium-r-normal--0-0-0-0-p-0-iso8859-1\n\
  ```\n\n该字符串由一系列由连字符（`-`）分隔的字段组成。这些字段中的信息分别是：字体找到（`bitstream`）；字体族名称（`charter`）；字体权重，如轻体、中等或粗体（`medium`）；倾斜，如正体或斜体（`r`）；宽度（`normal`）；额外的样式名称（此处未用）；各种尺寸信息（一串\
  \ `0` 值，表示字体是可缩放的）；间距，即等宽或比例间距（`p`）；平均宽度（同样，可缩放字体为 `0`）；以及编码（`iso8859-1`）。\n\n手动设置\
  \ `XLFD` 可能非常困难，因为它包含了许多未标记的信息，这些信息在人类眼中往往混在一起。一个简单的拼写错误就会导致字体无法使用。幸运的是，有程序可以帮助为字体创建\
  \ `XLFD`，甚至为整个目录创建一个一个完整的 `fonts.dir` 文件。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n\
  X 字体服务器像许多其他字体处理系统的底层工具一样，可能使用多个字体文件作为一个完整的字体族。例如，你可能在文字处理文档中使用 Times，并对该字体应用斜体、粗体或其他样式。在完整的字体安装中，这些变体实际上是不同的字体，派自单独的字体文件，每个字体在相应的\
  \ `fonts.dir` 文件中都有自己的 `XLFD` 条目。许多文字处理器和其他程序可以推导出粗体、斜体和类似属性的近似值，但使用自定义文件几乎总是会产生明显更好的效果，特别是斜体。\n\
  \n用于从 Type 1 字体目录创建 `fonts.dir` 文件的工具称为 `type1inst`。该工具随许多 Linux 发行版一起，但通常默认不安装。一旦安装了该程序，你可以进入包含\
  \ Type 1 字体的目录并运行该程序，如下：\n\n```\n # type1inst\n```\n\n该程序将查找你的字体文件，提取字体名称和其他 `XLFD`\
  \ 信息，并根据这些信息创建一个 `fonts.dir` 文件。它还会向你报告进度并给出操作总结。例如，它可能会告诉你在在 `fonts.dir` 中创建了 21\
  \ 个条目，其中一个是一个无法确定找到者的字体。你可能需要编辑 `type1inst` 创建的 `fonts.dir` 文件来消除任何不一致之处，例如同一字体族中的字体列出了不同的找到者。X\
  \ 使用 `fonts.dir` 中的信息并忽略嵌入字体中的信息，因此更改此类细节不会给 X 带来问题。事实上，保留不一致可能会导致问题，例如当你在选择某种字体时，由于找到者信息不匹配而无法获取该字体的变体。\n\
  \nTrueType 字体也存在类似的程序。该程序被称为 `ttmkfdir`，是 `xfsft` 和 XFree86 4.0 使用的 FreeType 库的一部分。它的工作原理类似于\
  \ `type1inst`，但你必须使用 `-o` 参数指定输出文件名。此外，`ttmkfdir` 经常忽略可用但缺少某些字符的字体。你可以使用 `-c` 参数强制包含此类字体。总之，你可以通过进入包含\
  \ TrueType 字体的目录并执行以下命令来使用此程序：\n\n```\n # ttmkfdir -c -o fonts.dir\n```\n\n如果你发现某些字体导致了问题，可以尝试不带\
  \ `-c` 选项。这可能会创建一个较短的字体列表，但列表上的字体更容易工作。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n按照描述使用，`type1inst` 和 `ttmkfdir` 都会覆盖现有的 `fonts.dir` 文件。如果你向目录添加了字体，你可能需要备份现有文件，以便恢复它或仅使用新文件中的新条目。如前所述，你可能需要编辑自动创建的文件，如果当前文件中已进行了此类编辑，你可能不想丢失它们。\n\
  \n一旦你更改了 `fonts.dir` 文件，你必须按照先前的描述重启字体服务器。然后你应该重启所有使用该字体服务器的 X 服务器，或者执行以下命令让 X 服务器刷新它们的可用字体列表：\n\
  \n```\n # xset fp rehash\n```\n\n如果你没有执行此操作，你的 X 服务器将不会提供新字体。如果你删除了字体且用户尝试使用它们，X\
  \ 服务器在尝试检索字体时可能会表现为挂起，因此如果你删除了字体，这一步是非常关键的。\n\n# 运行扩展的字体服务器\n\n遗憾的是，按照 21 世纪初大多数桌面操作系统的标准来说，X\
  \ 的字体处理相当原始。大多数用户通过添加字体时所需的笨拙方法以及许多程序中糟糕的字体显示注意到了这一点，特别是当字体路径没有设置正确，或者系统使用默认字体时（其中某些字体并不如其他操作系统中的同类字体）。然而，同样重要的一个事实是，X\
  \ 的字体系统并不是为了集成屏幕字体和打印机字体设计的。这一事实以及 X 字体处理中的其他设计限制，使得对于屏幕字体和打印字体界面重要的应用程序（如文字处理器和桌面出版软件包）来说，创建平滑界面的任务变得非常困难。因此，Linux\
  \ 中有多种传统字体服务器的替代方案。其中许多方案是在特定程序内部实现的，但至少有一个方案是一个完整的字体服务器，可以被许多程序使用。\n\n\n\n\nLinux\
  \ 最著名的扩展字体服务器被称为 `FontTastic`（[`www.bitstream.com/categories/developer/fonttastic/`](http://www.bitstream.com/categories/developer/fonttastic/)）。\
  \ 这是一个商业程序，作为 X 字体服务器运行，并为考虑到 FontTastic 而编写的应用程序提供额外功能。具体来说，`FontTastic` 可以提供如字体轮廓表示、原始字体数据和字间距信息等内容。这些信息无法通过传统的字体服务器或由\
  \ X 服务器直接处理的字体轻松获取。这些信息允许程序执行某些原本无法执行的操作，至少在不通过其他方法绕过 X 字体处理限制的情况下是。\n\n例如，考虑一个文字处理器。如果文字处理器使用\
  \ X 传统的字体处理方式，用户可能会为文档指定一种标准的 X 字体。然而，在打印时，文字处理器必须以某种方式告诉打印机该字体。假设打印机是 PostScript\
  \ 打印机，这意味着要么告诉打印机使用其内置字体之一，要么将字体下载到打印机。但如果用户选择的字体是某种非标准字体，文字处理器发送字体的唯一方法可能是作为位图（bitmap），因为这是它交付给\
  \ X 应用程序的方式。在不知道打印机分辨率的情况下，文字处理器可能必须猜测使用什么分辨率，从字体服务器请求该分辨率的字符，并将结果拼接在一起。结果可能不会很好看。\n\
  \n另一方面，通过 `FontTastic`，文字处理器可以请求原始字体数据并嵌入文档中，这是一个更优的解决方案，因为它可以用更少的精力产生更高质量的输出。（如果字体是\
  \ TrueType 字体，如果文字处理器知道 PostScript 打印机可以处理这种格式，它可能将其转换为 Type 42 字体，或者它可能需要请求原始轮廓形式的字体并有效地重建字体。这工作量更大，但将产生比尝试位图打印更整洁的结果。）文字处理器还可以利用关于字符大小、间距、字间距等的改进信息来产生更美的输出。\n\
  \n由于其商业性质，`FontTastic` 尚未在 Linux 社区中被广泛采用为标准工具。然而，它至少被两个主要的 Linux 商业程序程序使用：Corel\
  \ 的 WordPerfect Office 2000（已停用）和 VistaSource 的 ApplixWare Office（[`www.vistasource.com/products/axware/`](http://www.vistasource.com/products/axware/)\
  \ ）。如果你运行其中任何一个程序，软件包都会安装 `FontTastic` 并在其主程序运行时自动运行它。你可以创建一个配置，允许其他计算机使用 `FontTastic`\
  \ 作为传统的字体服务器，从而简化你的整个网络字体配置需求。（尽管研究 `FontTastic` 实现的细节可能需要一些精力。）\n\n`FontTastic`\
  \ 并不是解决屏幕与打印机之间脱节问题的唯一方法。某些工具（如 `TeX`）通过关注打印机来规避这个问题，并让屏幕字体随波逐流吧——`TeX` 是一种页面描述语言，因此\
  \ `TeX` 用户使用文本编辑器编辑文档，这些编辑器可能显示或不显示任何类似于最终字体的文档。其他程序通过忽略 X 的字体处理来整合屏幕和打印机字体。例如，WordPerfect\
  \ 8 使用了与其后继版本完全不同的模型；该程序的第 8 版本要求用户在 `WordPerfect` 中安装字体，而不是或额外在 X 中安装字体。`WordPerfect`\
  \ 而不是 `X` 或字体服务器对字体进行栅格化以显示在屏幕上。`WordPerfect` 随后可以将字体下载到打印机，或创建其下载到打印机的位图。\n\n另一种方法是告诉程序原始字体文件所在的位置。程序随后可以将这些文件发送到打印机，用于渲染\
  \ X 为屏幕渲染的文件。这种方法非常简单，但 X 对某些更精细的字体处理功能的缺乏支持仍可能导致屏幕显示出现笨拙的间距，如果应用程序没有使用来自原始字体文件的适当信息，打印输出也会受到此问题的影响。这些方法中没有一种是特别面向网络的，因此我没有在本书中深入介绍它们；我提到它们是因为它们是具有网络能力的\
  \ `FontTastic` 的替代方案，而且它们可能仍然使用网络字体服务器进行屏幕字体显示。\n\n## 总结\n\n作为网络服务器来说，字体服务器是简单的。它们不需要身份验证，并赋予用户对服务器计算机的有限访问。这些服务器根据字体服务器客户端程序（通常是运行在其他计算机上的\
  \ X 服务器）的请求，将多种不同格式的字体文件转换为特定大小的位图。为单机运行字体服务器可能允许你添加你的 X 服务器未直接支持的字体，或者你可能可以使用扩展字体服务器为应用程序提供额外的字体信息。网络字体服务器允许你通过将字体配置集中在一个位置，快速轻松地添加或更改大量计算机上的可用字体。添加字体仍然是一项乏味的任务，但如果你使用字体服务器，你至少只需要做一次。\n\
  \n# 第 16 章 远程维护系统\n\n像第 13 章和 14 章的远程访问工具允许普通用户从远处使用计算机。\n\n## 何时运行远程系统维护工具\n\n\
  当你需要一个专用且易于使用的界面来远程管理系统时，专业的远程系统维护工具最有用。这些工具也可以本地使用——`Linuxconf` 同时具有本地和基于 Web 的界面，但这些工具的任何\
  \ Web 界面都可以从本地计算机访问。事实上，这些工具的实用性主要在于它们易于使用的界面，而不是它们的远程访问功能。然而，还有更多为远程系统管理设计的工具。其中一些工具提供了对新管理员更友好的界面，或者它们可能比通过编辑文本文件的常规管理更简单。所有工具都提供了至少最基本的帮助和配置提示，这些提示对于经验丰富的管理员也是有用的。本章涵盖了两个通用远程管理工具（`Linuxconf`\
  \ 和 `Webmin`）以及一个特定于服务器的工具（Samba Web 管理工具，或 `SWAT`）。本章以查看围绕远程管理工具独特的安全性问题作为结束。\n\
  \n\n\n\n许多新的 Linux 管理员发现基于文本的管理令他们望而生畏，因此 `GUI` 管理工具（包括本章中讨论的工具）可以帮助他们处理 Linux 系统。即使是经验丰富的系统管理员在配置特定系统时也能从此类工具中受益，因为很少有管理员能完全理解\
  \ Linux 计算机每个子系统的每一个细节。理想情况下，这些工具可以通过消除在关键配置文件中输入拼写错误的可能性以及捕获某些类型的不当配置来防止配置错误。在实践中，使用\
  \ `GUI` 或远程管理工具仍然可能配置错误，因此在使用此类工具时仍应保持谨慎。最终，对你正在配置的子及其与其相关子系统的交互有良好的理解，比任何 `GUI`\
  \ 管理工具都对你有帮助。\n\n本章讨论的两个工具 `Linuxconf` 和 `Webmin` 被设计为通用型工具，用于管理许多不同的子系统。因此，它们非常适合对系统进行粗略配置，但它们缺乏处理许多复杂子系统中更细微方面所需的功能。其中一些子系统支持它们自己的专用管理工具。Samba\
  \ 的 `SWAT` 就是此类工具之一；通过手动编辑 Samba 配置文件能做的事情，几乎没有是 `SWAT` 做不到的。然而，作为一种 Samba 特定的工具，`SWAT`\
  \ 对于管理 Linux 系统的非 Samba 功能并不可用。\n\n本章描述的所有远程管理工具都使用 `HTTP` (Web) 协议运行。因此，你使用 Web\
  \ 浏览器访问这些工具。默认情况下，这些工具不在标准的 Web 服务器端口上运行，因此即使系统也运行着 Web 服务器，你也可以使用它们。你必须记住端口号并将其作为\
  \ `URL` 的一部分，如下节节对每个工具描述的那样。\n\n# 跨发行版配置工具的挑战\n\n本章讨论的所有工具都适用于各种 Linux 发行版。设计此类配置工具的困难之一在于，这些工具必须执行的操作细节在不同发行版之间存在差异。例如，如第\
  \ 4 章 启动服务器中所讨论的，不同的发行版可能使用不同的方法启动相同的服务器。某些使用 `inetd`，另一些使用 `xinetd`；SysV 启动脚本的位置和编号在发行版之间不同，配置文件的位置在发行版之间也不同，以此此类推。对于像\
  \ SuSE 的 YaST 这种特定发行版的工具来说，这不是问题，但 `Linuxconf` 和 `Webmin` 这样的工具在与许多不同发行版协作时面临着挑战。\n\
  \n对于 `Linuxconf` 和 `Webmin`，应对这一挑战的答案是依赖配置模块。配置工具本身仅提供一个框架——与网络客户端交互的代码、允许用户选择选项并为主机名等输入自由格式字符串的方法等。配置工具依赖于模块来填充细节，例如文件位置、服务器配置文件的格式信息，以及配置相关子系统必须收集的特定信息。既有通用配置的模块（例如配置\
  \ SysV 启动脚本或 `/etc/inittab` 设置），也有针对特定服务器包的模块（例如 Apache、sendmail 和 Samba）。这些模块可以针对特定的发行版或特定的服务器包进行修改。当你安装一个带有\
  \ `Linuxconf` 或 `Webmin` 的发行版时，配置包包含了该发行版所含服务器的模块，或者这些模块可能随单独包提供。当你从其主网站安装配置程序时，你必须为你的发行版获取一组模块。幸运的是，大多数发行版的这些模块都是很容易获得的，并且通常随配置工具本身一起发布。\n\
  \n配置模块的存在使得像 `Linuxconf` 和 `Webmin` 这样的工具极其灵活，但它们也带来了挑战。具体来说，如果模块没有及时更新以反映它们要管理的系统的变化，工具可能会变得不可靠。这可能表现为由于无法配置更新后的服务器（因为此类配置会出现错误），甚至表现为配置工具本身运行不可靠。这些问题对于\
  \ `Linuxconf` 来说一直特别棘手，从 Red Hat 7.1 开始，Red Hat（其主要的关联发行版）已停止默认安装 `Linuxconf`。\n\
  \n特定服务器的配置包（如 `SWAT`）情况较容易，因为它们不需要处理如此多的变数。例如，`SWAT`只需要只需要一个配置文件（Samba 的 `smb.conf`）。尽管此文件的位置可能在不同系统之间变化，但\
  \ `SWAT` 本身通常与 Samba 同时编译，因此它可以以相同的默认位置编译。（你也可以在启动 `SWAT` 时指定非标准位置。）因此，像 `SWAT`\
  \ 这样的工具通常不依赖配置模块。\n\n# 远程运行 Linuxconf\n\n`Linuxconf` 与 Red Hat 和 Mandrake 发行版联系最为密切，这些发行版传统上将\
  \ `Linuxconf` 作为其默认的 `GUI` 配置工具。然而，`Linuxconf` 并非由 Red Hat 或 Mandrake 开发，它适用于许多其他发行版，包括\
  \ Caldera、Debian、Slackware 和 SuSE。该程序的主页是 [`www.solucorp.qc.ca/linuxconf/`](http://www.solucorp.qc.ca/linuxconf/)，你可以从那里获取\
  \ tarball 和 `RPM` 格式。\n\n`Linuxconf` 包含了本地（文本和 `GUI`）和远程（基于 Web）运行模式。要远程使用它，你必须启用\
  \ `Linuxconf` 的 Web 操作，这在大多数安装中是默认禁用的。在 Web 模式下使用 `Linuxconf` 与在其本地文本或 `GUI` 模式非常相似，尽管显示看起来有些不同。\n\
  \n## 配置 Linuxconf 远程工作\n\n默认安装的 `Linuxconf` 以文本模式运行，通常以两种 `GUI` 模式之一运行（大多数带有 `Linuxconf`\
  \ 的发行版倾向于使用 `GNOME`-Linuxconf `GUI`，但 Solucorp 官方更倾向于另一个名为 `Linuxconf-GUI` 的工具）。还有一个基于\
  \ Java 的 `GUI` 正在开发中。默认安装没有启用 Web 界面，因此你必须亲自执行。这既需要将 `Linuxconf` 作为服务器运行，又要配置它接受通过网络登录。\n\
  \n### 运行 Linuxconf 服务器\n\n将 `Linuxconf` 作为服务器运行的最常见方法是从 `inetd` 或 `xinetd` 等超服务器运行它。要以此种方式运行，你必须确保你的\
  \ `/etc/services` 文件包含一个识别 Linuxconf 端口的条目，如下：\n\n```\nlinuxconf    98/tcp\n```\n\
  \n你必须配置你的超服务器来处理 `Linuxconf`。要做到这一点，让超服务器使用 `--http` 选项运行 `linuxconf` 二进制文件。例如，`/etc/inetd.conf`\
  \ 中用于 `Linuxconf` 的条目可能如下：\n\n\n\n\n\n```\n linuxconf  stream  tcp  wait  root \
  \ /bin/linuxconf  linuxconf —http\n```\n\n如果你的系统使用了 `xinetd` 并且带了 Linuxconf，那么 Linuxconf\
  \ 程序包可能在 `/etc/xinetd.d` 目录下包含一个名为 `linuxconf-web` 或 `linuxconf` 的启动文件。如第 4 章 所示，你应该确保该文件没有内容为\
  \ `disable = yes` 的行；如果有，请将 `yes` 改为 `no` 以启用 Linuxconf 的远程访问。\n\n## 授权远程访问\n\n\
  一旦你配置了超级服务器来运行 Linuxconf，你就可以使用任何 Web 浏览器访问 Linuxconf 服务器；你只需要在 URL 中输入计算机的主机名、冒号和\
  \ `98` 即可。例如，你可能在 Web 浏览器中输入 `http://remote.threeroomco.com:98` 来管理 remote.threeroomco.com。你可以在任何平台上使用任何\
  \ Web 浏览器，因此你可以从 Linux 系统、Windows 系统或几乎任何其他计算机管理 Linux 计算机。\n\n尽管此时 Linuxconf 应该是有响应的，但它可能并没什么用。默认配置允许\
  \ Linuxconf 显示一个简单的屏幕，概述了 Linuxconf 是什么，但如果你点击 Enter（进入）按钮开始管理系统，将看到一条错误消息；这是一种安全措施。你不仅需要启用基本的\
  \ Linuxconf 操作，还需要授权该程序接受网络连接。你可能还想限制允许通过 Linuxconf 管理计算机的系统。进行这些更改最简单的方法是在本地使用\
  \ Linuxconf，通过其文本界面或 GUI 界面。按此操作，请遵循以下步骤：\n\n1. 在 `root` shell（shell）中输入 `linuxconf`\
  \ 启动 Linuxconf。如果你运行在文本模式下或未安装 Linuxconf GUI 工具，你将看到一个文本模式菜单出现。如果你在 X 环境并且安装了 Linuxconf\
  \ GUI 工具，你将看到一个新的 Linuxconf 窗口出现。图 16.1 显示了 Linux Mandrake 使用的窗口。其他发行版使用的窗口可能看起来略有不同，但应该提供类似的选项。\n\
  \n   ![不同的 Linuxconf 程序包提供不同的默认显示，但大多数提供一组类似的选项。](img/16fig01.gif)\n\n   **图 16.1.不同的\
  \ Linuxconf 程序包提供不同的默认显示，但大多数提供一组类似的选项。**\n\n2. 选择 `Config & Networking & Misc &\
  \ Linuxconf Network Access Options`。这将产生一组类似于图 16.2 所示的选项，但字段将是空的。（再次，某些系统显示信息的方式略有不同，例如在单个窗口中连同左侧的\
  \ Linuxconf 模块列表。）\n\n   ![你可以从一个菜单中启用 Linuxconf 网络访问并指定哪些系统可以访问 Linuxconf。](img/16fig02.gif)\n\
  \n   **图 16.2.你可以从一个菜单中启用 Linuxconf 网络访问并指定哪些系统可以访问 Linuxconf。**\n\n3. 勾选 `Enable\
  \ Network Access`（启用网络访问）按钮。这告诉 Linuxconf 响应网络访问尝试。\n\n4. 在标记为 Network or Host（网络或主机）的第一个字段中输入\
  \ `127.0.0.1`，在标记为 Netmask (Opt)子掩码（可选））的第一个字段中输入 `255.255.255.255`。这告诉 Linuxconf\
  \ 接受来自主机本身的连接。\n\n5. 在标记为 Network or Host 的第二个字段中，输入你想访问 Linuxconf 的计算机的 IP 地址，或要授予管理权限的网络块地址。在后续\
  \ Netmask (Opt) 字段中输入相应的子掩码。例如，图 16.2 显示了系统配置为接受来自 192.168.1.0/24 网络上任何计算机的连接。\n\
  \n6. 对任何想要添加的额外网络或计算机重复步骤 5，使用后续的 Network or Host 和 Netmask (Opt) 字段。\n\n7. 在各个窗口或标签页中点击\
  \ `Accept`（接受）、`Dismiss`（取消）和 `Quit`（退出）以保存更改并退出 Linuxconf。工具可能会提示你系统未与你创建的配置同步。如果是这样，点击\
  \ `Do It`（执行）让 Linuxconf 激活你的更改。\n\n此时，Linuxconf 应该配置为接受来自本地计算机以及你在步骤 5 中指定的任何其他计算机的远程访问。如前所述，其他系统将只能获得基本的介绍屏幕。（如果你使用防火墙或其他工具提供冗余安全，潜在的入侵者甚至无法到达那里。）\n\
  \n## 使用 Web 版 Linuxconf\n\n要使用 Linuxconf 的 Web 界面，你在 Web 浏览器的 URL 字段中输入 `http://hostname:98`，其中\
  \ `hostname` 是相关计算机的主机名或 IP 地址。你首先将得到一个描述 Linuxconf 是什么的介绍屏幕。屏幕上有一个名为 Enter 的按钮。点击它以获取一个对话框，在其中输入用户名和密码（你必须使用\
  \ `root` 账户或其他授权通过 Linuxconf 管理系统的账户）。然后你将看到主 Linuxconf 配置菜单，如图 16.3 所示。\n\n   ![主\
  \ Linuxconf Web 菜单与文本界面或 GUI 菜单相当（见图 16.1）。](img/16fig03.gif)\n\n   **图 16.3.主 Linuxconf\
  \ Web 菜单与文本界面或 GUI 菜单相当（见图 16.1）。**\n\n要配置系统，你可以在 Web 浏览器中点击选项，就像在 Web 页面上选择链接一样。前一或两次点击可能会产生其他配置区域的列表，但最终你将到达一个可以在文本输入字段中输入信息、切换选项等等的屏幕。例如，如果你从图\
  \ 16.3 所示的显示中点击 Config 区域中的 Networking，然后在 Misc 区域点击 Linuxconf Network Access，你将看到图\
  \ 16.4 所示的页面，这相当于之前讨论的图 16.2 所示的对话框等。你可以通过这种方法禁用网络访问或更改可以访问 Linuxconf 的计算机。\n\n\
  \   ![Linuxconf 模块通常提供文本字段、二进制复选框、可选列表和其他设置配置选项的方法。](img/16fig04.gif)\n\n   **图\
  \ 16.4.Linuxconf 模块通常提供文本字段、二进制复选框、可选列表和其他设置配置选项的方法。**\n\n\n\n\n\nLinuxconf Web\
  \ 界面与 GUI 或文本界面之间的一个关键区别在于，Web 界面通常不需要那么多的点击按钮来确认。虽然在图 16.4 中没有显示，该页面包含一个接受（Accept）按钮（你需要滚动网页才能看到）。点击该按钮即可接受你输入的任何更改，任务就完成了。而使用本地界面时，Linuxconf\
  \ 需要更多的点击操作才能退出模块并激活更改。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\n如果你打算对配置进行更改，请务必点击\
  \ Accept 按钮。你可以使用浏览器的“后退”按钮退出 Linuxconf 模块而不激活其更改，因此请务必使用你预期的退出方法。（某些模块使用 Accept\
  \ 以外的单词来激活其更改。）\n\n如图 16.1 和图 16.3 所示，Linuxconf 使用分级结构来组织其配置模块。学习可用内容的最佳方法是浏览选项——但如果你不打算进行任何更改，请务必使用浏览器的“后退”按钮退出模块，而不是配置页面上的\
  \ Accept 按钮。有时你可能认为某个模块应该在某个位置，但它会在另一个地方。此外，你可能无法通过 Linuxconf 配置某些工具，要么因为该模块不存在，要么因为它与你系统上安装的内容不匹配。例如，如果\
  \ Linuxconf 在 `/etc` 中查找配置文件，而文件存储在 `/usr/local/etc` 中，它将无法工作。版本不匹配也会导致问题，比如如果 Linuxconf\
  \ 不理解最近版本程序中添加的选项，或者在你安装了旧版本程序时，Linuxconf 尝试使用不支持的选项。\n\n当你使用完 Linuxconf 的 Web 界面后，最好是退出\
  \ Web 浏览器。Linuxconf 最终会超时连接，但没有显式的退出选项，如果没有该选项，任何物理接触你所用电脑的人都可以对配置进行更改。如果你离开连接 Linuxconf\
  \ 的 Web 浏览器，可能会意外更改某些选项。\n\n# 运行 Webmin\n\nWebmin (`http://www.webmin.com/webmin/`)\
  \ 在概念上与 Linuxconf 相似，它们都是设计用于在各种 Linux 发行版运行配置系统。不过，Webmin 显式支持更广泛的发行版，以及非 Linux\
  \ 的类 Unix 系统，如 Solaris、FreeBSD 和 MacOS X。（完整列表可以在 [http://www.webmin.com/webmin/support.html]\
  \ 获取）。因此，配置和使用 Webmin 与配置和使用 Linuxconf 类似。但由于 Webmin 主要设计为网络配置工具，因此接受远程登录的初始配置比\
  \ Linuxconf 稍微简单一些。\n\n## 配置 Webmin\n\n在本书讨论的主要发行版中，只有 Mandrake 自带了 Webmin（尽管计划在即将推出的\
  \ Debian 3.0 中包含）。对于其他发行版，你可以从 Webmin 网站获取软件包，该网站以 `RPM` 和 tarball 格式托管该程序。如果你使用的是基于\
  \ `RPM` 的发行版，安装 `RPM` 是简单的，因为 `RPM` 包含一个脚本，可以检测你的发行版类型并相应配置服务器；你不需要进行其他操作即可使其运行。如果你安装的是\
  \ tarball，则必须运行脚本并回答有关系统的问题来启动程序。操作步骤如下：\n\n1.  以 `root` 身份切换到存放 Webmin 子目录的目录。Webmin\
  \ 文档建议使用 `/usr/local`，但其他位置也可以。另一个逻辑可能是 `/opt`。\n2.  使用类似 `tar xvfz /path/to/webmin-version.tar.gz`\
  \ 的命令解压 Webmin 软件包，其中 `/path/to` 是存储存档的目录，`version` 是版本号。这将创建一个 `webmin-version`\
  \ 的子目录，Webmin 文件位于其中。\n3.  输入 `cd webmin-version` 进入新的 Webmin 目录。\n4.  输入 `./install.sh`\
  \ 运行安装脚本。该脚本会询问许多系统的问题，例如 Perl 二进制文件的路径。特别重要的是你使用的是哪种发行版，然后是该发行版的版本号。\n\n### 注意\n\
  \n![NOTE](img/note.gif)\n\nWebmin 完全用 Perl 编写，因此不需要编译；无论系统的 CPU 是什么，任何系统上的包都是相同的。Perl\
  \ 随所有 Linux 发行版一起提供，并且通常默认安装。Webmin 本身通过通常位于 `/etc/webmin` 的文件进行配置（如果你安装了 tarball，可以更改此目录）。你可能不需要更改这些文件中的任何，但如果你确实需要，最可能需要关注的是\
  \ `config` 和 `miniserv.conf`。这两个文件都包含配置信息，例如 Webmin 默认监听的端口号、系统名称和主机类型。此外，`miniserv.users`\
  \ 文件包含管理员用户名和密码。（如果你是从 `RPM` 安装的，系统使用 `root` 作为管理员用户名并从 `/etc/passwd` 或 `/etc/shadow`\
  \ 复制 `root` 密码；如果你是从 tarball 安装的，你必须手动输入这些信息。）`/etc/webmin` 的子目录包含 Webmin 处理的特定服务器和子系统的信息。\n\
  \nWebmin 的标准配置使用 SysV 脚本启动服务器。该脚本反过来使用 `/etc/webmin/start` 脚本实际调用 Webmin Perl 脚本。\n\
  \n## 使用 Webmin\n\n大致，使用 Webmin 与使用 Linuxconf 类似；你在 浏览器中输入 Webmin 服务器的 `URL`（包括端口号\
  \ 10000），然后会显示用户名和密码的提示符。图 16.5 显示了某个系统的 Webmin 配置界面。与 Linuxconf 类似，Webmin 将其配置工具组织在不同的类别中，但在\
  \ Webmin 中的嵌套深度没有 Linuxconf 深。可能你做的大部分工作将在 System 和 Servers 标签中进行。Webmin 标签用于配置\
  \ Webmin 本身，Hardware 标签用于调整硬件（如分区），Others 标签用于设置一些杂项。\n\n![Webmin 的主界面让你选择通用类别，在选择后，可以选择你想要配置的特定子系统。](img/16fig05.jpg)\n\
  \n\n\n\n图 16.5。Webmin 的主界面允许您选择常规类别，并在选择后选择您想要配置的特定子系统。\n\n当您点击单个服务器或子系统的图标时，可能会进入最终的配置界面，或者是该特定服务器或子系统的组件列表。例如，`DNS`\
  \ 服务器配置提供了日志、文件等子选项，以及由 `DNS` 服务器服务的每个区域的子选项，如图图 16.6 所示。这种嵌套可能会持续几级。最后，您将到达一个界面，其中您可以使用文本输入框、复选框、列表等更改特定设置，如图图\
  \ 16.7 这样做完成后，点击 Save（保存）按钮以保存更改。许多服务器配置模块包含一个名为 Apply Changes（应用更改）的按钮，以强制服务器采用更改后的配置。其他模块则包含\
  \ Stop（停止）或 Start（启动）按钮，取决于服务器当前是否运行；您可以点击 Stop 按钮，然后点击 Start 按钮来激活您的更改。\n\n![许多服务器和子系统都包含自己的组链接，以便您在大小适中的配置界面中管理服务器。](img/16fig06.gif)\n\
  \n图 16.6。许多服务器和子系统都包含自己的组链接，以便您在大小适中的配置界面中管理服务器。\n\n![在 Webmin 界面中输入信息的方式与在 Linuxconf\
  \ 界面中非常相似。](img/16fig07.gif)\n\n图 16.7。在 Webmin 界面中输入信息的方式与在 Linuxconf 界面中非常相似。\n\
  \nWebmin 中的模块主列表可能包含在您的系统中未运行、甚至未安装的服务器。如果您点击此类服务器，将收到一条消息，说明 Webmin 无法找到配置文件，并建议模块配置可能错误或服务器可能未安装。如果您从非常规源安装了服务器，可以点击此消息中的\
  \ Module Configuration（模块配置）链接进入该 Webmin 模块的配置页面。如果您知道配置文件的实际所在位置，可以更改该信息以让 Webmin\
  \ 管理您的服务器。\n\n通常情况下，Webmin 模块比其 Linuxconf 对应部分更完整，尽管 Webmin 本身并没有规定这一点。在任何特定的发行版中，您可能会发现\
  \ Webmin 在某些方面更好，而 Linuxconf 在另一些方面更好。如果您正在研究这两个工具，最好的办法是都尝试一下，至少在测试系统上尝试。\n\n使用完\
  \ Webmin 后，您可以点击主页上的 Logout（注销）链接（参见图 16.5）。此操作将终止您与 Webmin 的连接，因此您不需要关闭 Web 浏览器（这在使用完\
  \ Linuxconf 后是建议的）。\n\n# 运行 SWAT\n\nSamba Web 管理工具 (SWAT) 比 Linuxconf 和 Webmin 要专精得多。正如其扩展名称所示，SWAT\
  \ 设计仅用于管理一类服务器：Samba（在第 7 章 中讨论）。因此，它在多个发行版的安装和配置方面面临的挑战并不多，并且比 Webmin 或（尤其是 Linuxconf）提供了更完整的\
  \ Samba 配置选项。SWAT 在专用的 Samba 服务器系统上最有价值，特别是由不习惯编辑文本文件的人管理的系统。不过，即使对于经验丰富的 Samba\
  \ 管理员来说，SWAT 也有价值，因为 Samba 支持许多选项，而 SWAT 界面允许您设置这些选项，而无需记住它们的精确拼写或语法。您还可以点击选项旁边的\
  \ Help（帮助）链接来查看这些选项的 `smb.conf` 手页条目。缺点是，SWAT 会删除 `smb.conf` 配置文件的注释，并且不支持用于加载次级配置文件的\
  \ `include` 参数。由于这些原因，丰富的 Samba 管理员通常会避免使用 SWAT，特别是在 Samba 配置非常复杂的系统上。\n\n## 配置\
  \ SWAT 运行\n\nSWAT 服务器程序名为 `swat`，它可以通过第 4 章 中描述的任何方式运行，但最常见的配置是从超级服务器（super server）运行。运行\
  \ SWAT 的典型 `/etc/inetd.conf` 条目如下：\n\n```\n swat  stream  tcp  nowait.400  root\
  \  /usr/sbin/tcpd  /usr/sbin/swat\n```\n\n使用 `xinetd` 的发行版通常在其 Samba 或 SWAT 包中包含一个名为\
  \ `/etc/xinetd.d/swat` 的文件，您可以检查该文件以确保它不包含 `disable = yes` 行。如果存在此类行，将其删除或将 `yes`\
  \ 改为 `no` 以启用 SWAT。在 `inetd` 和 `xinetd` 情况下，您都必须重启超级服务器后 SWAT 才能可用。\n\n### 注意\n\n\
  ![注意](img/note.gif)\n\n某些发行版将 SWAT 包含在主 Samba 包中（通常 `samba`、`samba-common`、`samba-server`\
  \ 等），但另一些将 SWAT 放在单独的包中（通常 `swat` 或 `samba-swat`）。Mandrake、Slackware、SuSE 和 TurboLinux\
  \ 将 SWAT 集成它们的主 Samba 包中，而 Caldera、Debian 和 Red Hat 使用单独 SWAT 包。\n\n默认情况下，SWAT 使用端口\
  \ 901。`inetd` 和 `xinetd` 都依赖于在 `/etc/services` 中设置此关系：\n\n```\n swat           \
  \ 901/tcp\n```\n\n该行标准于大多数 `/etc/services` 文件，但在尝试运行 SWAT 之前最好检查其是否存在。\n\n## 使用\
  \ SWAT\n\n一旦您将 SWAT 添加到系统，就可以像使用其他管理服务器一样使用它，当然您需要指定端口 901。例如，您可以在 Web 浏览器的 URL\
  \ 输入字段中输入 `http://samba.threeroom.com:901` 来访问 samba.threeroom.com 计算机上的 SWAT。与其他基于\
  \ Web 的服务器一样，您可以在任何平台上使用 Web 浏览器。\n\n### 注意\n\n![注意](img/note.gif)\n\nSamba 包含了响应\
  \ NetBIOS 名称请求的能力，以便 SMB/CIFS 客户端可以使用其原生的名称解析机制。SWAT 不包含此类模块，但如果客户端计算机在解析 Web 浏览器\
  \ URL 时使用 NetBIOS 名称，那么在 Samba 运行的情况下，可以通过 NetBIOS 名称以及其 DNS 主机名访问 SWAT。Windows\
  \ 客户端通常配置为这样做，但 Linux 客户端则不然。\n\n\n\n\n\n与本章讨论的其他管理服务器一样，当你首次尝试访问 `SWAT` 时，系统会要求输入用户名和密码。要获得完全的管理权限，你通常需要分别输入\
  \ `root` 和 `root` 密码。（你必须输入该账户的 `Linux` 密码，它可能与该账户的 `Samba` 密码不同。）如果你输入普通用户名和匹配的密码，Samba\
  \ 会允许访问，但只能查看配置并进行该用户可以执行的更改。通常，这些更改是修改密码。因此，`SWAT` 可以作为允许 Samba 用户更改密码的方法。无论你使用\
  \ `root` 还是普通用户名，`SWAT` 都会显示图 16.8 你可以点击图标或相关文本切换到其他页面：全局（Globals）、共享（Shares）、打印机（Printers）、状态（Status）、查看（View）和密码（Password）。前三个分别调整\
  \ `smb.conf` 文件的全局选项、文件共享定义和打印机共享定义。状态页面提供有关谁正在使用 Samba 共享等信息。查看页面显示原始的 `smb.conf`\
  \ 文件，密码页面允许你更改任何 Samba 密码。当你输入非 `root` 用户时，全局、共享和打印机选项将不可用，状态和密码页面向普通用户提供受限制的选项。除了这些选项外，首页还提供了指向帮助页（man\
  \ pages）和其他 Samba 文档的链接。\n\n![主 Samba 配置页面允许你选择配置区域或查看基于 Web 的 Samba 文档。](img/16fig08.gif)\n\
  \n**图 16.8. 主 Samba 配置页面允许你选择配置区域或查看基于 Web 的 Samba 文档。**\n\n你大部分的 Samba 配置将通过全局、共享和打印机页面完成。图\
  \ 16.9 全局页面允许你调整 `smb.conf` 中 `[globals]` 部分的设置——例如计算机的 NetBIOS 名称、域浏览器设置等。如第 7\
  \ 章所述，你可能希望设置 NetBIOS 名称、工作组名称和密码加密选项。\n\n![全局设置影响所有 Samba 文件和打印机共享，或调整常规 Samba\
  \ 操作。](img/16fig09.gif)\n\n**图 16.9. 全局设置影响所有 Samba 文件和打印机共享，或调整常规 Samba 操作。**\n\
  \n共享和打印机页面默认显示为空白。要创建或编辑共享，你必须采取适当的操作：\n\n*   要编辑现有共享，从“选择共享”或“选择打印机”旁边的选择框中选择共享名称，然后点击“选择共享”或“选择打印机”按钮。现有共享的信息将出现在\
  \ Web 浏览器中，你可以编辑这些设置。\n*   要删除现有共享，按照上述描述选择其名称，但点击“删除共享”或“删除打印机”。\n*   要创建新共享，在文本输入字段中输入你想要的共享名称，并点击“创建共享”或“创建打印机”。不要将共享名称包含在方括号（`[]`）中，就像你直接编辑\
  \ `smb.conf` 时那样；`SWAT` 会自动添加方括号。\n\n`[homes]` 共享具有特殊含义，如第 7 章所述，但你可以像处理其他共享一样创建、删除或编辑它。同样，打印机列表中带有星号（`*`）的打印机是默认的。全局、共享和打印机页面都包含标记为“高级视图”（Advanced\
  \ View）的按钮。（此按钮仅在你选择或创建共享后出现在共享和打印机页面中。）默认视图仅显示常用的 Samba 选项。点击高级视图会让 `SWAT` 显示所有\
  \ Samba 选项，并将高级视图按钮变为基本视图；点击它即可返回原始范围。大多数 Samba 共享可以使用基本视图进行配置，但对于某些共享你可能需要启用高级视图。设置基本视图不会丢失你在高级视图中所做的更改，因此即使你进行了高级更改，可以使用基本视图进行修改。\n\
  \n当你完成全局页面或共享/打印机页面中单个共享的新信息或更改信息后，点击“提交更改”（Commit Changes）。这将更改写入 `smb.conf`。要让\
  \ Samba 确认这些更改，你通常必须重启它。你可以从状态页面执行此操作；点击“重启 smbd”和“重启 nmbd”（某些更改可能只需要重启其中一个服务器，但重启两个也没有坏）。当你完全完成\
  \ `SWAT` 操作时，最好从 Web 浏览器退出以完全关闭连接。与 Linuxconf 一样，连接到 `SWAT` 服务器后让 Web 浏览器运行会导致该浏览器关闭之前一直可以访问\
  \ `SWAT` 服务器，这可能会带来安全风险。\n\n# 远程管理的安全问题\n\n远程系统管理是一个潜在的巨大安全漏洞，无论如何进行——无论是通过文本模式或\
  \ GUI 登录，还是通过本章讨论的专用配置工具。存在两类主要的关注问题：\n\n*   **密码泄露**：如果未经授权的人某种方式获得了管理员密码，该人员就可以更改你的系统配置。\n\
  *   **服务器漏洞**：过去在许多服务器中发现过安全相关的漏洞，未来远程管理工具中也可能发现漏洞。如果是这样，即使你的密码未被授权人员获取，你的系统也可能受到攻击。\n\
  \n\n\n\n在这两种情况下，如果你在运行常规远程登录工具的同时，还运行一个专用的远程管理工具，风险可能会增加。正如第 13 章 所述，某些远程登录工具以未加密的形式发送密码，但另一些工具（如安全外壳\
  \ `SSH`）则会对密码甚至后续数据进行加密。`Linuxconf` 和 `SWAT` 均使用未加密的密码，因此如果你出于安全考虑仅在本地使用 `SSH`，那么\
  \ `Linuxconf` 和 `SWAT` 将很大程度上抵消 `SSH` 的优势。`Webmin` 可以可选地使用安全套接层（`SSL`；参见 [`www.openssl.org`](http://www.openssl.org））进行加密，因此\
  \ `Webmin` 可以保护你的密码和其他数据；然而，配置 `Webmin` 使用 `SSL` 需要安装和设置 `SSL`。由于这些工具缺乏加密功能，我强烈建议不要在信任的本地网络以外的任何使用\
  \ `Linuxconf`、`SWAT` 或非 `SSL` 编码版本的 `Webmin`。\n\n远程访问工具在用户只需知道一个用户名和密码即可授予访问。正如第\
  \ 13 章 所述，许多远程登录协议可以配置为仅允许普通用户登录，这意味着管理员必须知道两个密码才能管理系统——一个普通用户名/密码对和一个 `root` 密码（配合\
  \ `su` 或类似工具使用）。总之，在本章讨论的远程访问工具中，只有 `Webmin` 提供了类似于 `SSH` 等工具的加密功能，而且即使在最佳情况下，`Webmin`\
  \ 对于通过以太网嗅探之外的其他方式获取的密码也可能略微脆弱。\n\n你可以通过限制可以连接到管理服务器的系统来减少某些未经授权访问的风险。正如本章前面提到的，`Linuxconf`\
  \ 包含了相关工具，允许你通过指定授权的 `IP` 地址或网络范围来实现此。正如第 4 章 所述，如果你从超级服务器启动服务器（这是 `Linuxconf` 和\
  \ `SWAT` 的默认设置），则这些程序中的任何一个都可以受到 `TCP` Wrappers 或 `xinetd` 的保护。你还可以像第 25 章 所述那样配置防火墙来限制对远程管理端口的访问。然而，这些措施无法限制密码嗅探的风险，而且如果入侵者拥有物理访问权限，`IP`\
  \ 地址可能会被伪造甚至接管。因此，此类程序无法消除所有风险，尽管它们很重要。\n\n作为一个一般原则，最好限制系统运行的服务器数量，以减少服务器漏洞的风险，并限制可能被滥用的入口点数量。如果系统必须运行远程登录服务器——特别是加密数据的服务器，如\
  \ `SSH`——从安全的角度来看，最安全的做法是使用该登录工具来管理系统（如果需要远程管理的话）；像本章讨论的特定管理工具会带来额外风险。不过，如果在足够保护的网络上，管理员更习惯使用这些工具，那么这种风险可能是合理的。此外，如果没有运行常规远程登录服务器但又需要远程管理，远程管理工具也是值得的。\n\
  \n你可能会倾向于使用受限的管理服务器（如 `SWAT`）来代替完全访问权限的服务器（如 `Linuxconf` 和 `Webmin`），作为安全预防措施。毕竟，如果入侵者能攻破\
  \ `SWAT`，他们能造成的损害是有限的，对吧？对于某些远程访问服务器确实如此，但许多服务器提供的杠杆足以让入侵者造成实质性损害。例如，攻破 `SWAT` 的人可以创建一个文件共享，为整个\
  \ `/etc` 目录提供完全的读/写访问。入侵者可以使用此访问权限更改其他关键配置文件，例如激活 Telnet 访问、添加账户等。尽管如此，使用更具局限性的工具至少可以减慢入侵者的速度。\n\
  \n最后，这里描述的安全预防措施只是一个开始。本书的第四部分专门介绍安全问题。本节强调了一些更重要的问题，因为远程管理服务器是特别强大的工具，一旦被攻破，它们比大多数其他服务器更容易被滥用。\n\
  \n## 总结\n\n即使你想或需要远程管理系统，远程管理工具并不是 Linux 系统的必需。不过它们非常方便，特别是当你需要管理一个并不熟悉的子系统时。你可以在本地或从远程系统使用这些工具。两个特别常见且完整的工具是\
  \ `Linuxconf` 和 `Webmin`，它们在理论上都可以处理任何 Linux 子系统，尽管在实践中，两者都没有完全的模块模块。`SWAT` 是另一个管理工具，可能是最常见的专用工具——一种管理单一服务器的工具。这些工具每一个都可能非常有用，但在配置和使用它们时必须小心，以尽可能减少它们带来的安全风险。\n\
  \n# 第 17 章. 执行网络备份\n\n备份数据是一项不起眼的操作，但对于你系统的长期可靠性至关重要。某些网络由一两个大型服务器和许多较简单的系统（如 X\
  \ 终端）组成，这些系统很少或没有重要数据。在这样的网络中，你可以将备份硬件放在服务器上进行备份，并安全地忽略客户端（可能只需保留一个默认安装备份）。如果客户端故障，你可以以最小的麻烦用带有标准配置的新系统替换它。然而，其他网络有多个需要备份的服务器，或者客户端系统可能存储了你无法丢失的用户或其他信息。此类网络需要各种备份解决方案。该领域的选项非常多样，因此本章只能浅一谈。它首先对可用选项进行广泛讨论，然后转向三个具体的解决方案：使用\
  \ `tar` 备份 Linux 或 UNIX 系统，使用 `Samba` 备份 Windows 系统，以及使用 `AMANDA` 协调跨网络备份。\n\n网络备份可能非常复杂，特别是在大型网络上。关于此主题的更多信息，您应该阅读备份工具随附的任何文档。也有关于该主题的书籍，例如\
  \ Preston 的 *Unix Backup & Recovery* (O'Reilly, 1999)。\n\n# 何时运行网络备份服务器\n\n\n\n\
  在某种意义上，备份在本地处理是最容易的。如果你在计算机上安装了磁带机或类似的备份硬件，可以使用 `tar`、`cpio` 或 `dump` 等软件来备份 Linux\
  \ 系统，而无需创建特别特殊的配置。尝试通过网络进行备份会增加任务的复杂性，因为两台计算机都需要网络配置，而且备份软件必须具备网络感知。（尽管如此，你有时可以使用额外的工具来规避备份软件缺乏网络支持的问题）。通过网络进行恢复可能更加困难，因为你可能需要在另一台缺少标准网络工具包的计算机上执行恢复操作。出于这些原因，在小型网络上使用本地备份硬件实施备份策略通常是理想的。然而，这种解决方案可能是昂贵的，特别是当网络规模（或至少是必须备份的计算机）大幅增长时。适用于工作站或小型服务器的磁带驱动器费用通常在\
  \ 100 到 1,000 美元之间，介质还会增加这些成本。网络备份驱动器的容量更大，价格也更高，但如果从每台计算机的角度来看，成本可能会低得多。因此，执行网络备份的原因之一是与个人备份相比可以节省费用。\n\
  \n## 备份硬件选项\n\n磁带机是备份硬件最常见的形式。通常情况下，低成本设备（如 Travan 驱动器）使用更贵的介质，因此当你购买磁带时（特别是对于大型服务器或网络），成本波动并不像初始购买价格让你认为的那样大。小型网络通常可以使用价值约\
  \ 1,000 美元的中端或高端单驱动磁带单元，它通常可以备份 5 到 20 GB 的数据。此类驱动器通常使用 `数字音频带 (DAT)` 或 `数字线性磁带\
  \ (DLT)` 格式。较大的网络需要更昂贵的网络备份单元，它们使用 `DLT` 或各种更奇特的磁带格式。大型网络的另一种选择是`磁带库`（tape changer），它是一个可以自动更换磁带的单单元，类似于多盘音频\
  \ CD 播放器。此类驱动器向主机计算机呈现为一个超大单带驱动器。\n\n不过，磁带并不是唯一的备份介质。特别值得关注的替代方案是光记录介质，例如可刻录 CD\
  \ (CD-R)、可重写 CD (CD-RW) 以及几种可刻录 DVD 技术。CD-R 和 CD-RW 驱动器的容量有限（标准光盘为 650 MB），因此对于执行真正的网络备份来说并不有用。然而，这些介质对于维护相当静态信息的备份（例如客户端系统的标准安装）可能很有用。可刻录\
  \ DVD 的容量更高（几 GB），因此更适合备份整个系统，但它们作为网络备份介质仍然很薄弱。光介质的保质期异常长（CD-R 的预计寿命在 10 到 100 年之间），因此它们非常适合存档备份工作。在\
  \ Linux 中使用它们比使用磁带机更复杂，因为光介质需要 `cdrecord` 等特殊工具才能写入。尽管如此，它们特别容易恢复，因为标准的 CD-ROM 或\
  \ DVD-ROM 驱动器可以读取这些介质。\n\n本章的编写假设你将使用磁带单元进行网络备份。尽管如此，你可能想用光介质上的静态信息备份来补充此类备份。这可以使全应急恢复变得更容易；你可以使用光介质恢复初始配置，然后使用该系统从磁带中恢复额外数据。\n\
  \n网络备份还提供了某些便利因素。通过从中心位置控制备份，你可以消除个人用户需要执行的备份任务。普通办公人员即使被分给了磁带备份单元，也可能忘记执行例行备份。然而，中心化的备份系统可以对用户执行自动且透明的备份。（这并不总是如此的，正如稍后在“网络备份解决方案类型”节中所描述的那样。）\n\
  \n# 网络备份解决方案类型\n\n广而言之，网络备份可以通过两种方式之一进行：要备份的计算机可以使用另一个系统的磁带机启动备份，或者带有磁带机的系统可以启动对另一台计算机的备备。我将前者称为`客户端发起的备份`（client-initiated\
  \ backup），后者称为`服务器发起的备份`（server-initiated backup）。每种选择都有其优缺点。本章将讨论两种类型备份的示例。\n\n\
  ### 注意\n\n![NOTE](img/note.gif)\n\n通常将带有备份介质的计算机称为`备份服务器`（backup server），将正在被备份的计算机称为`备份客户端`（backup\
  \ client）。这种术语在某些情况下与`服务器`和`客户端`的通常含义一致，但在其他情况下并不一致。例如，在服务器发起的备份中，备份客户端通常必须运行某种服务器软件，备份服务器将其作为客户端使用。尽管这种术语在某种意义上是不准确的，但这样引用系统极大地简化了讨论，特别是在比较两种类型的网络备份时。\n\
  \n## 客户端发起的备份\n\n在客户端发起的备份中，备份服务器运行某种服务器软件，允许客户端访问备份硬件。服务器软件可能是一个除了备份外用于其他用途的程序，例如\
  \ `rshd` 或 Samba，也可能是一个专用的备份包。无论何种情况，客户端启动过程这一事实都具有某些重要的后果：\n\n*   **调度问题** —— 如果需要定期执行备份，你必须在备份客户端上使用\
  \ `cron` 或其他调度工具来启动备份。你还需要具备某种机制，确保不同客户端的备份不会相互干扰。\n*   **用户控制** —— 客户端发起的备份有时对于备份工作站非常方便，因为工作站的用户可以控制备份发生的时间，甚至是备份哪些文件。例如，用户可能会决定在完成项目后或休假之前备份。\n\
  *   **安全性** —— 备份客户端不需要运行任何服务器软件，因此可以做得非常安全。同样，在 Linux 或 UNIX 客户端的情况下，备份过程可以以 `root`\
  \ 身份运行，从而提供对所有文件的完全访问权限。另一方面，备份服务器需要运行一个所有备份客户端都可以访问的服务器程序。这最好通过留出一个专用的备份服务器来处理。\n\
  \n这些特性使得客户端发起的备份成为许多小型网络运行的合理选择。在此类网络上，调度冲突通常可以以合理的方式解决。一个重要的缺点是，如果将备份过程交给个人用户，他们可能会忘记定期执行。你可以通过使用\
  \ `cron` 任务或类似工具自动化该过程，但这需要仔细的计划以减少冲突的风险。\n\n## 服务器发起的备份\n\n服务器发起的备份使用备份服务器上的网络客户端程序来与备份客户端上的网络服务器程序建立连接。备份服务器随后可以从备份客户端读取文件并将文件存储在磁带上。与客户端发起的备份相比，这种方法具有几个重要的特征：\n\
  \n\n\n\n\n-   **调度问题**。由于备份是集中控制的，你可以更容易地防止冲突，甚至可以安排连续的备份，以更有效地利用通常情况下空闲的网络时间（例如深夜）。\n\
  -   **用户控制**。单个工作站的用户无法控制其备份发生的时间。如果他们需要在特定时间进行备份，则必须向备份服务器进行调度，或者使用其他方法（例如将重要文件备份到\
  \ Zip 磁盘中）。\n-   **安全性**。所有备份客户端必须运行某种类型的服务器程序。最常见的是文件共享协议，如 `NFS` 或 `SMB`/`CIFS`，但在某些情况下，像\
  \ `FTP` 的协议也可以。对于 Linux 客户端，文件共享服务器必须向备份服务器提供对所有文件的完全读取权限，这是一个潜在的安全风险——如果恶作分子可以伪装成备份服务器，他们就可以获取如\
  \ `/etc/shadow` 等敏感文件。然而，备份服务器受到攻击的风险较小，因为它只需要运行客户端软件即可完成任务。\n\n调度问题使得服务器启动备份在大型网络中是理想的，但在某些情况下，安全性问题可能是一个主要考虑的问题。你可以通过使用防火墙和其他访问控制机制来限制谁可以访问备份客户端的文件系统，从而缓解这些担忧。此外，像\
  \ `AMANDA` 这样的专用备份软件包可能会使用在关键执行文件上设置 SUID 位等技术，允许大多数备份进程作为普通用户运行，同时仍允许软件包整体完成其工作。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n网络备份为服务器启动和客户端启动的备份带来了额外的安全担忧。如果使用的协议需要密码，那么如果密码以未加密的形式发送，该密码可能会被泄露；备份过程中传输的数据也是如此。即使所有数据在传输过程中都经过加密，备份带的安全也可能非常重要；如果有人偷了备份带，甚至只是“借”了几分钟，也可以从磁带中读取如\
  \ `/etc/shadow` 等敏感数据，即使源计算机上的文件权限通常不允许外部人员读取。\n\n# 使用 `tar`\n\nLinux 和 UNIX 世界中磁带备份的最低共同标准是\
  \ `tar`——该程序用于创建归档，将多个文件分组到一个文件中，以便于存储或在 Internet 上传输。事实上，`tar` 的名称代表 *tape archive*（磁带归档）。你可以将\
  \ `tar` 作为网络备份程序的一部分，采用客户端启动或服务器启动的策略。类似的程序也适用于许多常见的 Linux 备份程序，如 `cpio` 和 `dump`，但你与它们使用的命令细节自然会有不同，因此你需要查找如何处理某些网络相关选项的细节，特别是对于客户端启动的备份。我在这里介绍\
  \ `tar` 既是因为它是最低共同标准，也是因为它被其他几个工具（如 `smbtar` 和 `AMANDA`）使用。\n\n## 基本 `tar` 特性\n\n\
  `tar` 工具非常强大，支持许多选项。这些选项有两种形式：命令和限定符（qualifiers）。命令告诉 `tar` 要做什么——例如，创建归档、列出归档内容或从归档中提取文件。限定符修改命令的操作——它们用于指定\
  \ `tar` 使用的设备或文件、限制可能备份的文件、使用 `gzip` 或 `bzip2` 压缩生成的归档等。在运行 `tar` 时，基本语法为：\n\n```\n\
  tar command [qualifiers] filenames\n```\n\n你指定的文件名实际上是目录名，可能包括根目录 (`/`)）。当你指定目录名时，`tar`\
  \ 会备份该目录下的所有文件和子目录。\n\n表 17.1 和 17.2 列出了一些常用的 `tar` 命令和限定符。不过，这些只是示例，请咨询 `tar` 的\
  \ man 页以获取信息。\n\n### 表 17.1 常用 tar 命令\n\n| 命令 | 缩写 | 目的 |\n| :--- | :--- | :---\
  \ |\n| `--create` | `c` | 创建归档。 |\n| `--concatenate` | `A` | 添加到归档。 |\n| `--append`\
  \ | `r` | 添加到现有归档。 |\n| `--update` | `u` | 添加比归档中更新的文件。 |\n| `--diff` 或 `--compare`\
  \ | `d` | 对比归档文件与磁盘。 |\n| `--list` | `t` | 显示归档内容。 |\n| `--extract` 或 `--get` |\
  \ `x` | 从归档中复制文件。 |\n\n### 表 17.2 常用 tar 限定符\n\n| 命令 | 缩写 | 目的 |\n| :--- | :---\
  \ | :--- |\n| `--absolute-paths` | `P` | 保留开头的 `/`。 |\n| `--bzip2` | `I` | 将归档通过\
  \ `bzip2`。 |\n| `--directory` | `C` | 在操作前切换到指定目录。 |\n| `--exclude` | (none) | 防止备份。\
  \ |\n| `--exclude-from` | `X` | 阻止文件中列出的文件。 |\n| `--file` | `f` | 使用归档文件执行备份。 |\n\
  | `--gzip` 或 `--ungzip` | `z` | 将归档通过 `gzip` 或 `ungzip`。 |\n| `--listed-incremental`\
  \ | `g` | 创建或使用增量备份文件。 |\n| `--multi-volume` | `M` | 处理多磁带归档。 |\n| `--one-file-system`\
  \ | `l` | 仅备份或恢复一个文件系统。 |\n| `--same-permissions` 或 `--preserve-permissions` | `p`\
  \ | 保留所有用户名和权限信息。 |\n| `--tape-length` | `L` | 指定磁带长度（以 KB 为单位）。 |\n| `--verbose`\
  \ | `v` | 在处理时显示文件名。 |\n| `--verify` | `W` | 在写入后立即对比原始文件与归档。 |\n\n作为这些选项使用的示例，假设有一台计算机拥有\
  \ SCSI 磁带驱动器，可以通过 `/dev/st0` 或 `/dev/nst0` 访问。你可以使用以下命令备份该计算机的 `/home` 目录，保留所有权限并在备份时显示文件名：\n\
  \n```\ntar --create --verbose --file /dev/st0 /home\n```\n\n表中显示的缩写允许使用该命令稍微更简洁的变体：\n\
  \n```\ntar cvf /dev/st0 /home\n```\n\n\n\n\n\n在备份系统文件时，`--same-permissions` 选项特别重要，因为\
  \ `tar` 有时会丢失某些权限，特别是当前 `umask` 值不允许的权限。该选项在恢复文件时非常重要，但在备份时并不需要。\n\n`--listed-incremental`\
  \ 选项创建或使用一个文件，记录 `tar` 备份的文件信息。程序首次使用此选项运行时，会创建指定的文件并备份所有文件。后续使用该选项时，只会备份自上次备份以来添加或更改的文件。这允许\
  \ `tar` 创建 `partial`（增量）备份，它比普通的 `full`（全量）备份小得多。许多管理员每周或每月执行一次全备，每天执行增量备份。这能以最小的精力提供良好的灾难保护。（不过，在恢复增量备份时，你可能会发现故意删除的文件被恢复了，因为增量程序不会将自上次备份后删除的文件标记为已删除。）在网络环境中，你可能希望轮换每天接收全备的机器——例如，周一是\
  \ `machine1`，周二是 `machine2`，依此类推。\n\n最后，`--verify` 旨在检查备份的准确性。验证过程会大幅增加备份时间，但这可能是值得的，特别是当磁带驱动器不包含自带验证功能时。（大多数中端和高端驱动器确实包含硬件验证，通常被称为\
  \ `read-after-write`。）任何使用 `--verify` 或在第二次通过中使用 `--diff` 命令执行的验证都可能出现一些误报，因为 Linux\
  \ 系统是一直处于活动状态的，某些文件在备份和验证阶段之间可能会发生变化。日志文件、`/tmp` 中的文件、如邮件和打印机队列之类的卷文件，以及可能的用户文件特别容易发生变化。如果你只在备份期间可能合理变化的文件中看到少数变化，那么无需担心。如果你在其他文件中看到变化，特别是在像\
  \ `/usr` 内容这样的静态文件中，那么可能是你的磁带、磁带驱动器或网络连接出了问题。\n\n大多数现代磁带驱动器支持内置压缩，因此无需使用 `--bzip2`\
  \ 或 `--gzip` 选项。事实上，即使在缺乏压缩功能的低端驱动器上，这些选项也可能是危险的。原因是 `tar` 使用 `gzip` 或 `bzip2` 压缩整个归档，而不是单个文件。如果在回读压缩归档时发生错误，`tar`\
  \ 将无法恢复，导致归档中该点之后的所有数据都会丢失。磁带驱动器的内置压缩算法对此类错误更具健壮性；一旦发生错误，你可能会丢失一个文件，而不会丢失整个归档。某些备份程序不使用这种压缩方式，因此对错误更具鲁棒性。例如，商业软件\
  \ BRU ([http://www.tolisgroup.com]) 在启用压缩时使用按文件压缩的方法。\n\n## 测试本地 `tar` 和磁带功能\n\n\
  在设置备份服务器时，你应该在引入网络因素之前，先在本地测试基本的备份功能。本地备份总是比网络备份简单，因此如果你知道本地备份工作正常，你就可以相当有信心地将网络备份的问题归结为网络配置。此外，记住备份备份服务器本身也很重要；像任何其他计算机一样，它可能会故障，如果它在没有备份的情况下发生故障，你的整个网络将面临风险。\n\
  \n最基础的本地测试是尝试使用类似于上一节所示的命令进行备份。这最困难的部分是确定要使用的正确设备文件。中端和高端磁带设备通常有四种设备文件：`/dev/st0`、`/dev/nst0`、`/dev/ht0`\
  \ 和 `/dev/nht0`。前两个指的是 SCSI 磁带驱动器，后两个指的是 EIDE/ATAPI 设备。以 `n` 开头的文件名为 `nonrewinding`（非绕）设备——当操作完成后，驱动程序会让磁带保持绕好，因此你可以在单盘磁带上放置多个备份。没有前缀\
  \ `n` 的设备文件名指的是 `rewinding`（绕）设备，它们在每次操作后都会自动回绕磁带。注意，这是 `device file` 的特性，而不是硬件的特性；每个磁带设备都有绕和一个非绕设备文件。如果你有多个磁带驱动器，第二个的文件名将以\
  \ `1` 而不是 `0` 结尾，第三个是 `2`，依此类推。\n\n有些特殊的硬件类型使用其他的设备文件名。例如，某些旧的磁带驱动器通过软磁盘口接口，使用如\
  \ `/dev/qft0` 和 `/dev/nqft0` 等设备文件名。这些驱动器按今天的标准来说容量小且速度慢，不适用于网络备份。其他驱动器使用特殊的接口硬件。检查\
  \ Linux 内核配置以获取此类板的驱动程序。\n\n如果在本地备份遇到问题，请检查你的设备硬件和设备驱动程序。SCSI 驱动器需要启用基础 SCSI 支持和\
  \ SCSI 磁带支持。同样，EIDE/ATAPI 驱动器需要启用 EIDE 支持和 EIDE/ATAPI 磁带支持。确保检查你备份和恢复数据的能力；尝试使用一个小测试目录，然后用较大的目录。使用验证函数确认你的数据正在被正确恢复。\n\
  \n特别是如果你想在单盘磁带上放置多个备份时，`mt` 工具可能会很有用。该工具允许你控制磁带驱动器，设置内置压缩等选项，并在存储在磁带上的各种备份集之间移动。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n`mt` 手页将备份集称为 `files`，`tar` 文档也经常这样做。将磁带想象成一个没有文件系统的硬盘；你的备份实际上只是按顺序存储在磁带上的\
  \ `tar` 文件，因此使用了这种术语。\n\n你可能想尝试使用 `tar` 和 `mt`，通过非绕回磁带设备在磁带上放置多个备份。`mt` 的基本语法如下：\n\
  \n```\nmt [-f device] operation [count] [arguments]\n```\n\n`operation` 是一个命令，如\
  \ `fsf`（向前跳文件）、`bsf`（向后跳文件）、`rewind`（回绕磁带）和 `datcompression`（设置压缩——发送参数 `0` 禁用压缩，发送其他任何内容启用）。例如，以下命令字符串创建了两个备份并对其进行了验证：\n\
  \n```\n# tar cvplf /dev/nst0 testdir-1/\n# tar cvplf /dev/nst0 testdir-2/\n# mt\
  \ -f /dev/nst0 rewind\n# tar df /dev/nst0 testdir-1/\n# mt -f /dev/nst0 fsf 1\n\
  # tar df /dev/nst0 testdir-2/\n```\n\n这些命令大部分都应该会有磁带活动。前两个 `tar` 命令将显示正在备份的文件名，最后两个\
  \ `tar` 命令将显示原始文件与备份之间任何差异文件的文件名。在回读归档时需要第二个 `mt` 命令，但在创建归档时不需要。\n\n## 执行客户端发起的备份\n\
  \n使用 `tar` 进行客户端发起的备份要求客户端拥有 `tar` 程序，并且备份服务器运行着适当的服务器程序，以授予客户端的 `tar` 程序访问磁带设备的权限。除了将之前描述的\
  \ `tar` 命令进行更改外，你在客户端侧几乎不需要做任何特殊操作。然而，备份服务器的配置在大多数 Linux 发行版中不是标准的，因此你必须重新配置备份服务器。\n\
  \n### 客户端发起的网络配置\n\n\n\n\n\n表 17.2 中所示 `--file` 选项接受文件名作为参数。这可能是一个普通的磁盘文件、对应磁带设备的设备文件，或者指向网络资源的路径。在最后一种情况下，备份服务器必须运行\
  \ `rshd` 守护进程（通常称为 `in.rshd`）。该守护进程允许远程系统在服务器运行的系统上执行命令。`tar` 程序利用此能力将它创建的 `tar`\
  \ 文件传递到备份服务器上的设备文件。`rshd` 服务器是大多数 Linux 系统带的，并且通常从超级服务器（super server）运行。处理此服务器的\
  \ `/etc/inetd.conf` 条目可能如下所示：\n\n```\n shell  stream  tcp  nowait  root  /usr/sbin/tcpd\
  \ \\\n/usr/sbin/in.rshd -h\n```\n\n如果你的系统使用 `xinetd`，你需要在 `/etc/xinetd.conf` 中创建一个等效条目，或者如第\
  \ 4 章“启动服务器”所述，在 `/etc/xinetd.d` 中创建一个专门的启动文件。`xinetd` 配置可能不会调用 `TCP` Wrappers（`/usr/sbin/tcpd`），但无论何种情况，`TCP`\
  \ Wrappers 或 `xinetd` 直接提供的安全性都是重要的。`rshd` 守护进程几乎完全依赖调用者的 `IP` 地址来实现。尽管 `TCP` Wrappers\
  \ 和 `xinetd` 提供了类似的访问控制机制，但在 `rshd` 出现安全漏洞时，这种方面的冗余是非常重要的。\n\n尽管 `IP` 地址是 `rshd`\
  \ 使用的最强访问控制类型，但服务器还使用用户名来控制远程访问，以防止普通用户在服务器上以不当权限运行危险程序。通常，`rshd` 不接受来自任何远程系统 `root`\
  \ 的命令。在前述 `inetd.conf` 条目中演示的 `rshd` `-h` 参数更改了这一默认设置。这极其重要，因为系统文件的备份通常必须以 `root`\
  \ 权限运行，以便备份敏感的系统文件和所有用户文件（取决于你的系统的用户文件权限）。如果你省略了 `-h`，普通用户将能够对服务器执行备份，但前提是服务器上设备文件的权限允许这样做。（大多数发行版都不允许普通用户以任何实质方式访问磁带设备文件。）\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n`rshd` 的 `-h` 选项在某些系统上失效或被禁用，因此此步骤无法运行。你可能可以改用\
  \ `SSH`——在备份服务器上运行 `SSH` 服务器，并将备份客户端上的 `ssh` 链接到 `rsh` 名称，以便 `tar` 调用 `ssh` 进行网络传输。即使对于那些\
  \ `rshd` 按描述正常工作的系统，这具有安全优势。不过，只有当你配置了 `SSH` 允许在不需要密码认证的情况下登录（如第 13 章“维护远程登录服务器”所述），这种方法才有效。\n\
  \n由于 `rshd` 安全问题及其所需的配置，此类客户端启动备份服务器的最佳配置是专门分配计算机用于此功能。这台计算机不需要非常强大，除了配备磁带备份单元和快速的网络连接外。它应该通过防火墙防止来自互联网的访问，理想情况下，它不应包含任何重要数据，也不应运行\
  \ `rshd` 以及配置所需的任何其他服务器。\n\n## 执行备份\n\n一旦设置好备份服务器，你就可以使用它进行备份。为此，你必须将磁带插入备份服务器的磁带驱动器，并在备份客户端上发出类似下面的命令：\n\
  \n```\n # tar cvlpf buserver:/dev/st0 /home /var /\n```\n\n该命令将当前系统上的 `/home`、`/var`\
  \ 和 `/` 目录备份到 `buserver` 上的回卷磁带设备，并排除显式指定的任何其他挂载文件系统。如果指定的三个目录是计算机上唯一的目录，则该命令将对客户端执行完整的网络备份。\n\
  \n你可以与 `tar` 相同的地址类型使用 `mt` 来指定网络备份设备。例如，`mt -f buserver:/dev/nst0 rewind` 将重置 `buserver`\
  \ 磁带驱动器中的磁带。\n\n总之，使用 `tar` 执行客户端启动的网络备份与使用 `tar` 执行本地备份非常相似。你必须在设备规格中添加备份服务器的名称，除此之外，使用的命令是相同的。额外的精力花在了配置备份服务器系统上。\n\
  \n## 执行服务器启动的备份\n\n如前所述，服务器启动的备份具有优势在于允许中央服务器控制备份的调度。这种设置将大部分配置细节放在备份客户端上，客户端必须运行适当的网络服务器包。本节描述了如何使用网络文件系统（NFS）服务器（见第\
  \ 8 章“通过 NFS 进行文件共享”）来执行网络备份。一旦配置好客户端，实际的备份操作与本地操作相似，尽管你必须在备份服务器系统上挂载备份客户端的导出目录以执行备份。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n可以使用 `NFS` 以外的文件共享协议进行网络备份。事实上，接下来的章节“使用 smbmount”描述了使用\
  \ `smbmount` 备份 Windows 文件共享。对于以这种方式备份 Linux 系统，能够保留 Linux 文件所有权和权限信息的协议是实际需求；因此，`NFS`\
  \ 是一个很好的选择。\n\n## 服务器启动的网络配置\n\n你应该阅读第 8 章来学习如何配置 Linux 计算机导出指定的文件系统。要对系统进行完整备份，你必须配置该系统允许备份服务器挂载所有重要的磁盘文件系统。你可以省略\
  \ `/proc`、不想备份的可移动介质等。通常，你会配置备份客户端导出所有的硬盘分区。\n\n出于备份目的，备份客户端可以导出所有具有只读权限的目录；备份服务器不需要写入这些目录。但如果你需要恢复数据，你需要更改此配置以允许对相关目录的写入访问。或者，你可以使用更复杂的数据恢复方法，例如将其恢复到备份服务器上的某个目录，然后将其将其导出供备份客户端读取；或者如果你妥善配置了备份服务器，可以使用客户端启动的恢复。\n\
  \n\n\n\n服务器启动型备份配置中有一个潜在的危险要求，即备份服务器的 `root` 用户必须对备份客户端拥有完全的 `root` 权限——换句话说，在定义导出（exports）时，必须使用\
  \ `no_root_squash` 选项。如果没有此选项，备份服务器将无法读取许多重要的系统文件，可能也无法读取许多用户的文件。此要求允许具有本地网络访问权限或能够伪造备份服务器地址的恶意分子读取备份客户端上的所有文件，如果你使用读写模式导出客户端目录，他们甚至可以修改这些文件。出于如此，你应该使用良好的防火墙保护备份服务器及其所有客户端，以最大限度地减少外部访问的风险，并仔细监控日志，以寻找篡改或其他滥用的证据。\n\
  \n作为配置的一个示例，考虑一个具有三个需要备份的分区的客户端：`/home`、`/var` 和 `/`（根目录）。你可以通过创建相应的 `/etc/exports`\
  \ 条目来导出这些文件系统。如果备份服务器名为 `buserver`，这些条目可能如下：\n\n```\n /home  buserver(ro,no_root_squash)\n\
  /var   buserver(ro,no_root_squash)\n/      buserver(ro,no_root_squash)\n```\n\n\
  如果你需要恢复文件，必须将 `ro` 改为 `rw` 并重启 NFS 服务器。另一个挑战（特别是在恢复时）是保持文件所有权的完整。如果备份指定某个文件属于（例如）`jbrown`，而如果该名称没有相应地映射到正确的\
  \ `UID`，那么文件的所有权可能会丢失或损坏。通常的原则是，如果在备份和恢复时，客户端和服务器上与特定用户关联的 UIDs 是相同的，那么操作是最简单的。\n\
  \n## 执行备份\n\n备份命令与之前描述的相同，但你必须先将备份客户端的导出挂载到备份服务器系统上。例如，假设备份客户端名为 `buclient`，并且存在一个名为\
  \ `/mnt/client` 的挂载点用于存放其备份目录。你可能可以通过执行如下命令来挂载并备份其文件：\n\n```\n # mount -t nfs -o\
  \ soft buclient:/ /mnt/client\n# mount -t nfs -o soft buclient:/var /mnt/client/var\n\
  # mount -t nfs -o soft buclient:/home /mnt/client/home\n# cd /mnt/client\n# tar\
  \ cvlf /dev/st0 home var ./\n```\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n上述序列假设备份客户端的\
  \ NFS 服务器没有导出挂载的子目录。如果 NFS 服务器确实导出了挂载的子目录，你只需要第一个 `mount` 命令。\n\n关于此特定备份序列的一点注意是，它使用\
  \ `cd` 进入备份客户端电脑的主挂载点。因此，该目录视图是备份客户端的目录树。`tar` 命令备份该目录树中的各个挂载点，但省略了完整路径。结果是一个不包含\
  \ `/mnt/client` 挂载点引用的磁带。磁带上的文件可以通过将目标分区挂载到相同的挂载点或其他位置，并进入挂载的目录进行恢复来完成。也可以使用如下所示命令进行备份：\n\
  \n```\n # tar cvlf /dev/st0 /mnt/client/home /mnt/client/var /mnt/client\n```\n\n\
  此类命令包含了对 `/mnt/client` 目录的引用（更准确地说，是 `mnt/client`，缺少开头的 `/`，除非你使用了 `--absolute-paths`\
  \ 限定符）。因此，这种备份只有在目标系统以与备份相同的方式进行挂载，或者至少在一个包含其自身的 `mnt/client` 子目录的目录时才能恢复。缺少此类目录树的恢复将创建一个——可能是在备份服务器机器上，而不是备份客户端上。\n\
  \n### WARNING\n\n![WARNING](img/warning.gif)\n\n这种服务器启动型备份的一个潜在严重缺点是，如果备份客户端在过程中离线，备份过程可能会停滞。上一个示例中使用的\
  \ `-o soft` 挂载选项允许备份服务器上的 NFS 客户端向 `tar` 返回错误，这可能比挂挂的备份过程更优。\n\n# 使用 SMB/CIFS\n\n\
  前一个章节“使用 tar”描述了如何使用 `tar` 工具，并结合运行在备份服务器电脑上的 `rshd` 服务器或运行在备份客户端电脑上的 NFS 服务器进行工作。不过，你也可以使用其他服务器提供计算机之间的连接。本节描述了一种对于托管了许多\
  \ Windows 计算机的网络特别感兴趣的服务器：服务器消息块（SMB），又称为通用互联网文件系统（CIFS）。正如第 7 节《通过 Samba 进行文件和打印机共享》所述，SMB/CIFS\
  \ 支持是 Windows 系统的标准配置，而 Linux Samba 软件包允许 Linux 使用其原生的文件和打印机共享协议与这些系统交互。这种相同的协议也可通过服务器启动型或客户端启动的方法来备份\
  \ Windows 系统，甚至可能用于备份 Linux 系统。在继续之前，如果你还不熟悉 Samba 配置的至少基础知识，应该阅读或回顾第 7 节。\n\n##\
  \ 从 Linux 备份 Windows 客户端\n\n使用 Samba 的服务器启动型备份工作方式与使用 NFS 的服务器启动型备份非常相似。尽管如此，Samba、SMB/CIFS\
  \ 以及 Windows 提供了独特的机遇和挑战。特别感兴趣的是 `smbtar` 程序的功能以及处理来自 Windows 系统的长文件名时的独特考虑。\n\n\
  ### 共享文件以备份\n\n与通过 NFS 进行服务器启动型备份一样，通过 Samba 进行服务器启动型备份要求备份客户端运行一个服务器来共享要备份的文件。大多数情况下，这与\
  \ Windows 备份客户端效果最好。虽然你可以在 Linux 电脑上运行 Samba 来共享 Linux 文件系统并以此方式进行备份，但生成的备份将缺少文件所有权和权限等关键信息——更准确地说，这些信息将不可靠。\n\
  \nWindows 系统带有 SMB/CIFS 服务器软件，但它可能未安装或配置。不同版本的 Windows 细节有所不同，但你可以使用控制面板中的“网络”或“网络和拨号连接”项目来添加必要的软件组件。在\
  \ Windows 9x*/Me 中，双击“网络”获取网络对话框。在 Windows NT 和 2000 中，在“网络和拨号连接”中右键点击你的网络图标并点击“属性”。必要的组件称为“用于\
  \ Microsoft 网络的文件和打印机共享”。如果此组件不存在，点击“添加”或“安装”来执行它。你应该发现它被分类为一种服务，如图 17.1 所示。你可能还需要设置系统所属的工作组。你可以从\
  \ Windows 9x*/Me 中网络对话框的“标识”选项卡，或从 Windows 2000 控制面板中的“系统”对象进行此操作。\n\n\n\n\n![Windows\
  \ 系统需要“Microsoft 网络文件和打印机共享”组件才能作为 SMB/CIFS 服务器运行](img/17fig01.gif)\n\n**图 17.1.\
  \ Windows 系统需要“Microsoft 网络文件和打印机共享”组件才能作为 SMB/CIFS 服务器运行。**\n\n一旦安装了 `SMB`/CIFS\
  \ 服务器，你就必须共享所有想要备份的硬盘。你可以按照以下步骤进行：\n\n1.  在“我的电脑”窗口中，右键点击你想要用于备份的驱动器，并在弹出的菜单中点击\
  \ `Sharing`（共享）。如果没有出现 `Sharing` 项，很可能是没有安装 `SMB`/CIFS` 服务器软件）。结果将显示一个属性对话框，如图 17.2\
  \ 所示。\n\n    ![这是 Windows 2000 的共享对话框；Windows 9x/Me 中的选项略有不同。](img/17fig02.gif)\n\
  \n    **图 17.2. 这是 Windows 2000 的共享对话框；Windows 9x/Me 中的选项略有不同。**\n\n2.  点击 `Shared\
  \ As`（共享为）或 `Share This Folder`（共享此文件夹）来共享驱动器。然后你必须输入共享名称，并将使用该名称从 Linux 备份服务器挂载或访问该共享。（在\
  \ Windows 2000 中，你通过点击 `New Share` 来输入共享名称。）\n\n3.  Windows 9x/Me 系统要求你选择 `Access\
  \ Type`（访问类型）以指定只读或读写访问，并输入密码。你可以为了备份指定只读访问，但如果你以后需要恢复数据，则必须更改配置允许读写访问（在 Windows\
  \ 9x/Me 对话框中称为 `Full`）。你可以使用 Windows 2000 中的 `Security`（安全）选项卡来调整谁可以访问共享。\n\n4.\
  \  点击 `OK` 启用驱动器的共享。\n\n5.  对任何想要备份的额外驱动器重复步骤 1 到 4。\n\n此时此，该驱动器应该可以被远程系统访问。你可以从另一台计算机的“网络邻居”浏览器进行测试，或者使用\
  \ Linux 上的 `smbclient` 等工具进行测试。接下来描述的两种服务器启动备份方法都使用了此类工具。\n\n### 使用 `smbtar`\n\n\
  Samba 自带了一个名为 `smbtar` 的程序。正如你所料的，这是一个结合了 `tar` 功能与 `SMB`/CIFS` 客户端的工具。事实上，`smbtar`\
  \ 实际上是一个调用 `tar` 工具和 `smbclient` 工具的 shell 脚本，将它们的功能整合到一个单一程序中，你可以用它备份 Windows 系统。你可以用它备份整个\
  \ Windows 共享，也可以仅备份共享中的某些文件。其基本语法如下：\n\n```\nsmbtar -s buclient [-x service] [-u\
  \ username] [-p password] \\\n[-d dir] [-t device] [-r] [-v]\n```\n\n`smbtar` man\
  \ 页面提供了几个额外选项的信息。这些选项的含义如下：\n\n*   `-s` `buclient` — 唯一必需选项是备份客户端的名称。你通常提供计算机的 NetBIOS\
  \ 名称，这可能与系统的 `DNS` 主机名不同，但根据 `smb.conf` 中的 `name resolve order` 设置，系统也可能响应 `DNS`\
  \ 主机名。\n\n*   `-x` `service` — 你将前面步骤 2 中定义的共享名称指定为 `service`。如果你省略此值，系统将默认指向名为\
  \ `backup` 的共享。\n\n*   `-u` `username` — 如果你想使用与执行备份时不同的用户名进行连接，请使用此选项进行指定。注意，Windows\
  \ 9x/Me 在其共享上不使用用户名，除非它属于域而不是工作组。\n\n*   `-p` `password` — 如果你的备份共享需要密码，你通过此参数输入密码。这是一个潜在的重大安全漏洞，因为如果你手动输入\
  \ `smbtar` 命令，密码将显示在你的 shell 历史记录中，而且还可以从进程列表中访问密码（例如，通过 `ps` 工具）。如果你从脚本中运行 `smbtar`，请务必确保该脚本仅对\
  \ `root` 可读，以防密码落入他人手中。\n\n*   `-d` `dir` — 你可以通过此选项指定切换到共享内的某个目录。你不会使用此选项备份整个分区。\n\
  \n*   `-t` `device` — 使用此选项指定与你的带机相关的 Linux 设备文件，或你想要存储备份数据的文件。默认值是 `$TAPE` 环境变量的值，如果\
  \ `$TAPE` 未定义，则为 `tar.out`。\n\n*   `-r` — `smbtar` 的默认行为是备份文件。`-r` 选项导致程序恢复文件。\n\
  \n*   `-v` — 此选项激活详细模式（verbose mode），在此模式下 `smbtar` 会显示它正在备份的文件名。\n\n例如，考虑以下命令，它备份了计算机\
  \ `WORK` 上名为 `CDRIVE` 的共享：\n\n```\n# smbtar -s WORK -p password -x CDRIVE -t /dev/st0\
  \ -v\n```\n\n运行此命令的结果是一些状态信息，紧接着是文件列表，最后是备份的文件数和字节数的摘要。由 `smbtar` 创建的文件是普通的 `tar`\
  \ 文件，如果你喜欢，可以使用普通的 `tar` 来检查并回读磁带。\n\n### 使用 `smbmount`\n\n你不需要使用 `smbtar`，可以使用\
  \ Linux 挂载 `SMB`/CIFS` 共享的能力来备份它。你可以使用 `mount` 或 `smbmount` 程序挂载此类共享。前者是挂载的普通 Linux\
  \ 命令；你指定文件系统类型为 `smbfs`，并如下提供 Windows 系统的 NetBIOS 名称、共享名称和用户名：\n\n```\n# mount -t\
  \ smbfs //WORK/CDRIVE /mnt/backup -o \\\nusername=fred,password=password\n```\n\n\
  使用 `smbmount` 的对应命令是：\n\n```\n# smbmount //WORK/CDRIVE /mnt/backup -o \\\nusername=fred,password=password\n\
  ```\n\n### 警告\n\n![警告](img/warning.gif)\n\n`smbmount` 工具在 Samba 2.0.x 系列期间发生了巨大变化。该工具的早期版本使用了完全不同的语法。这里显示的命令应该适用于\
  \ Samba 2.0.5a 到 2.2.2 版本，可能还更高版本。\n\n如果你省略了密码，`mount` 和 `smbmount` 都会提示输入。如果你想从命令行执行备份，这种方法可以让这些工具的使用比\
  \ `smbtar` 更优。你还可以一次挂载多台计算机的驱动器并用一个 `tar` 调用进行备份。这可以使创建备份变得更容易，但可能会减慢单个系统的恢复速度，因为在恢复时，你可能需要读取来自其他系统的数据。\n\
  \n从 Windows 计算机备份数据后，你应该使用 `umount` 或 `smbumount` 命令关闭与备份客户端的连接。这两个命令的工作方式相同，就像\
  \ `umount` 处理本地共享的方式一样。例如：\n\n```\n# umount /mnt/backup\n```\n\n### Windows 特殊文件名考量\n\
  \n\n\n\n使用 Linux 备份 Windows 系统是备份此类客户端的一种良好方法，特别是对于 Windows 9*x*/Me 系统。然而，这存在某些文件名方面的注意事项。其中最明显的是\
  \ `mount` 和 `smbmount` 对文件名大小的处理方式与 Windows 不同。要理解这一点，有必要了解 Windows 如何存储文件名的。Windows\
  \ 9*x*/Me（以及可选的 Windows NT、2000 和 XP）使用的文件分配表（`FAT`）文件系统最初被设计为存储仅包含八个字符和三个字符扩展名的文件名，且全部为大写字母。这被称为\
  \ `8.3 文件名`。为了存储更长的文件名，Windows 使用额外的目录条目实现了一个独立但相关的长文件名。这些长文件名可以存储超过 8.3 限制的文件名，也可以存储在\
  \ Windows 中以混合大小写、或者强制以全小写或全大写形式出现的文件名。（取决于你查看文件名的方式，普通 8.3 文件名的大小将是全大写，或者首字母大写后跟小写字母，如\
  \ `File.txt`。在文件选择对话框等处，你可以通过使用长文件名条目来强制文件名全大写或全小写。）Linux 文件名问题的源于：当 8.3 文件名与长文件名不同时，\
  \ Linux 无法得知 8.3 文件名是什么；Linux *仅使用*长文件名（如果存在的话）。\n\n与 Windows 不同，Linux 将通过 `mount`\
  \ 或 `smbmount` 挂载的目录中的 8.3 文件名视为全小写（例如，`file.txt`）。在恢复时，这些文件将正确恢复；然而，如果一个文件是用显式小写的\
  \ 8.3 文件名创建的，恢复过程将创建一个在 Windows 中显示为普通 8.3 全大写的文件。这通常不是严重问题，因为 Windows 以不区分敏感的方式处理文件名。尽管如此，用户可能会注意到文件名大小发生了细微变化，这可能会引起困惑。\n\
  \n`smbtar` 程序将 8.3 文件名视为全大写，因此它不会受到这个问题的影响，但会受到一个相关问题的影响：考虑一个使用长文件名扩展被编码为全大写，但长度仍为\
  \ 8.3 或更短的文件。Linux `smbtar` 程序会认为该文件是普通的 8.3 文件名，因此不会恢复标记其为全大写的长文件名扩展。再次，这个问题通常并不严重，但可能会让用户感到困扰。\n\
  \n一个潜在更严重的文件名故障与为了匹配长文件名而创建 8.3 文件名有关。Windows 会自动做到这一点，你可以通过 `DIR` 命令在 Windows DOS\
  \ 提示符窗口中看到短文件名和长文件名。然而，由于 Linux 不知道短文件名是什么，它依赖 Windows 在恢复文件时重新创建此文件名。这个过程通常进展得很顺利，而且在任何情况下短文件名通常都不重要。然而，在某些情况下，它是重要的。具体来说，如果程序将短文件名存储在配置文件中，如果该短文件名在恢复文件后发生了变化，程序将无法找到该文件。事实上，Windows\
  \ 注册表以 8.3 形式存储了一些文件名，因此这个问题可能会导致这些注册表项出错。反过来，如果影响了关键注册表项，会导致神秘的故障甚至系统崩溃。不过，你可以采取一些措施来降低此类问题的风险：\n\
  \n*   **使用短目录名称** —— 不要使用长目录名称，而是使用短名称。例如，许多 Windows 程序将自己放置在 `Program Files` 目录下。如果你改用名为\
  \ `APPS` 的目录，那么在恢复时短文件名就不会发生变化。对程序所处位置的子目录名称进行类似的更改也可以从很大程度上解决这个问题。数据文件名很可能不需要是短的，因为注册表项等内容不太可能引用数据文件。\n\
  \n*   **在配置文件中使用长文件名** —— 如果你有机会在配置文件中输入文件名或目录名，如果它与 8.3 名称不同，请使用长文件名。例如，如果你想在 `AUTOEXEC.BAT`\
  \ 的 `PATH` 中添加目录，请使用长文件名。此操作可确保对 8.3 文件名的更改不会影响功能。\n\n*   **创建前六个字符唯一的长文件名** ——\
  \ Windows 通过使用前六个字符并追加波浪号（`~`）和一个从 `1` 开始顺序分配的数字来创建 8.3 文件名。例如，`longfilename.txt`\
  \ 可能有一个对应的 8.3 文件名 `LONGFI~1.TXT`。如果一个目录中的所有长文件名的前六个字符都是唯一的，它们的第七和第八个字符都将是 `~1`，这在恢复后不会改变。\n\
  \n最终，从 Linux 备份 Windows 系统引起的文件名相关问题风险很小，特别是如果你采取了充分的预防措施。尽管如此并非不存在，因此你可能希望使用 Windows\
  \ 工具进行备份，至少对于初始安装而言。\n\n### 注意\n\n![注意](img/note.gif)\n\nWindows NT、2000 和 XP 使用的新技术文件系统（`NTFS`）也存储\
  \ 8.3 和长文件名，但它对 8.3 文件名的依赖程度较低。因此，如果你使用 `NTFS`，此类更改引起的问题比使用 `FAT` 小。\n\n## 备份共享\n\
  \n使用 Samba 进行备份的另一种方法是创建一个*备份共享*。这是一个链接到备份设备的 Samba 共享。你有几种方法可以创建备份共享。根据方法的不同，你甚至可以使用此类系统备份\
  \ Linux 计算机。所有这些方法都属于客户端发起的备份。\n\n### 什么是备份共享？\n\n使用 Samba 创建备份共享有两种常用方法：\n\n* \
  \  **直接备份** —— 你可以创建一个与可移动媒体设备（如 Zip 或 Jaz 驱动器）挂载点绑定的共享。当媒体挂质时，你可以像访问其他共享一样从备份客户端系统访问它。如果你运行归档程序，甚至只是拖放文件，你都可以将这些文件备份到可移动介质。\n\
  \n*   **处理备份** —— 你可以创建一个使用脚本的共享，如第 7 章中的“Samba 脚本功能”部分所述，将客户端发送的文件复制到备份介质。脚本可能会以类似于原始的方式将文件写入备份设备，或以某种方式对其处理。事实上，第\
  \ 7 章中的“示例：刻光光”部分准确地描述了这样的设置，使用 CD-R 作为备份介质。\n\n直接备份方法在处理备份的大小方面相当有限，因为大多数可移动媒体设备在这方面受到限制。只有移动硬盘可以处理来自大磁盘客户端的备份。处理备份方法的潜在限制可能较小，但如果你必须备份大磁盘的客户端，你的备份服务器需要一个大部分为空的大磁盘来处理客户端发送的数据，因为服务器必须在自己的磁盘上临时存储这些数据。\n\
  \n### 创建备份共享\n\n\n\n\n备份共享可以像许多其他类型的 Samba 共享一样创建。在直接备份的情况下，共享定义看起来与普通文件共享非常相似。唯一的例外是，你可能想使用\
  \ Samba 的脚本功能，在设备首次被访问时自动挂载它，并在用户完成备份后卸载它。你可能想使用的另一个功能是 `max connections`，它限制了任何时刻访问共享的用户数。例如，以下共享定义允许远程用户将文件备份到挂载在\
  \ `/mnt/zip` 的 Zip 磁盘上：\n\n```\n [zip]\n        comment = Zip Backups\n        path\
  \ = /mnt/zip\n        read only = No\n        max connections = 1\n        preexec\
  \ = /bin/mount /mnt/zip\n        postexec = /bin/umount /mnt/zip\n```\n\n### 注意\n\
  \n![NOTE](img/note.gif)\n\n由于某些 SMB/CIFS 客户端（包括 Windows 系统）在正常操作中不会显式地卸载共享，你可能想使用\
  \ `deadtime` 全局参数在无活动一段时间后强制断开连接。对于备份介质，`deadtime = 5` 可能是合理的，在空闲五分钟后强制断开连接。\n\n\
  像这样的备份共享最好用于备份有限量的数据或非常小的客户端。你可以在小型网络中使用它，为所有系统提供对可移动介质驱动器的访问，允许用户将数据文件备份到 Zip 磁盘或类似设备。\n\
  \n你可以在可移动介质上使用 Linux 支持的任何文件系统，但磁盘必须由其他系统读取，你应该考虑这一因素。例如，如果你的用户会将可移动磁盘带回家并在 Windows\
  \ 系统上读取它们，你应该使用 `FAT`；但如果磁盘仅用于备份服务器或其他 Linux 系统上，你可以使用 `FAT`、`ext2fs` 或任何其他 Linux\
  \ 支持的文件系统。\n\n某些介质（如 CD-Rs 和磁带）不便于直接共享。要使用此类介质进行备份，你必须创建一个主动将数据拷贝到备份介质的共享。[第 7 章]中的“[示例：刻录光盘]”部分展示了两个此类将数据备份到\
  \ CD-Rs 的共享示例。“[通过伪打印机刻录 CD]”节所示共享的变体如下：\n\n```\n [backup]\n    path = /var/spool/samba\n\
  \    printable = Yes\n    print command = /usr/local/bin/samba-backup %H %s %U \\\
  \n                    /var/spool/samba; rm %s\n```\n\n此共享定义了一个伪打印机，它接受备份客户端的 zip\
  \ 文件。该共享使用[列表 17.1]中所示的 `/usr/local/bin/samba-backup` 脚本，使用 `tar` 提取 zip 文件的内容并拷贝到磁带。结果是与\
  \ `smbtar` 创建的类似的备份磁带。或者，你可以修改脚本或 `print command` 参数将 zip 文件直接转储到磁带，从而保留隐藏位和系统位等特性，而这些特性在\
  \ Linux 系统上解压文件时将会丢失。\n\n**示例 17.1. 支持伪打印机备份共享的脚本**\n\n```\n ##!/bin/sh\n## $1 =\
  \ 任务提交者的主目录\n# $2 = zip 文件的文件名\n## $3 = 任务提交者的用户名\n# $4 = zip 文件的路径\nmkdir -p $1/backup/samba\n\
  cd $1/backup/samba\nunzip $4/$2\ntar cvpf /dev/st0 ./ > $1/tar.out\nmail -s \"Backup\
  \ finished\" $3 < $1/tar.out\nrm $1/tar.out\nrm -r $1/backup/samba\n```\n\n### 警告\n\
  \n![WARNING](img/warning.gif)\n\n此处描述的方法要求备份设备文件对所有用户都可用。不过，有方法可以回避这一要求。例如，你可以对所有连接使用\
  \ `root` 账户。一种中方法是在 `smb.conf` 共享定义中使用 `force user` 参数来设置提交“打印”命令的有效用户 ID。你可以将此用户设置为\
  \ `root`，或者更好地，创建一个对磁带设备具有完全读写权限的特殊组，并使用 `force group` 参数授予此共享访问该设备的权限。\n\n这种方法可以很容易地调整以处理\
  \ zip 文件以外的文件。例如，如果系统接受 `tar` 文件，它可以直接拷贝到磁带，而无需经过占据了[列表 17.1]中大量内容的提取过程。这种方法会更快，但对于\
  \ Windows 客户端来说可能不太方便，因为 `tar` 在 Windows 上没有在 Linux 上那么常见。\n\n### 使用备份共享\n\n如[第\
  \ 7 章]所述，像这样的伪打印机备份系统要求你在本地创建归档文件并在不使用打印机驱动程序将其发送到备份服务器。你可以创建一个 Windows 批文件，通过双击单击桌面图标即可完成整个备份。当任务完成后，[列表\
  \ 17.1]中的脚本会向用户的 Linux 账户发送一份报告，显示 `tar` 的输出，从而列出已备份的文件列表。\n\n由于这种方法（至少通过伪打印机实现时）需要传输某种归档文件，你可以使用这种方法备份\
  \ Linux 系统，而不会丢失重要的 UNIX 风格文件系统数据，只要归档格式支持该文件系统数据。例如，如果你设置了一个伪打印机来接受 `tar` 文件，你可以使用这种方法备份\
  \ Linux 客户端。这种方法的优势在于，备份服务器的安全性可能比之前描述的 `rshd` 方法更好。在 Samba 中，你可以像 `rshd` 一样基于 `IP`\
  \ 地址限制访问，但也可以要求密码。Samba 打印机共享的权限也低于 `rshd` 授予的权限。缺点是，这种方法要求备份服务器有大量的空闲磁盘空间。处理备份任务可能需要更长时间，而且如果两个用户连续提交备份任务，可能会存在冲突的风险。\n\
  \n## 使用 AMANDA\n\n前面的部分描述了相当基本的备份选项和配置。如果你的网络只有几台计算机，你可能满足于使用这些方法手动备份，或者编写脚本通过 cron\
  \ 任务运行以自动方式执行备份。但对于较大的网络，则需要更复杂的工具。这就是高级 自动网络磁盘归档器（AMANDA）的功能。该软件包将其他网络备份工具结合在一起，帮助实现小型、中型甚至大型网络的自动化备份。AMANDA\
  \ 网页为 [`www.amanda.org`](http://www.amanda.org)。你可以从那里获取软件，或者从随其发布的发行版获取，如 Debian、Red\
  \ Hat、Mandrake 和 SuSE。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\nAMANDA 在其可执行文件中硬编码了一些关键值，因此混合来自不同发行版的二进制文件可能无法正常工作。如果你的环境包含多个发行版，最好自己从源码编译该包。确保在所有系统上运行\
  \ `configure` 时，使用 `--with-user` 和 `--with-group` 指定相同的用户和组。你可能想为 AMANDA 操作创建一个特殊的用户和组。\n\
  \n\n\n\n## AMANDA 的功能\n\nAMANDA 包含了备份服务器软件和备份客户端软件。你在备份服务器上安装服务器软件，在备份客户端上安装备份客户端软件。这些程序使用它们自己的协议进行通信；AMANDA\
  \ 不使用 `NFS`、`rshd` 等协议。（不过，当 AMANDA 备份 Windows 系统时，它会如前所述，使用 `smbclient` 和标准的 Windows\
  \ `SMB`/`CIFS` 服务器软件包。）\n\n作为网络连接的传输通道外，AMANDA 还作为一个调度工具使用。在大型网络中，仔细安排不同类型的备份通常是有帮助的，甚至是必要的，且往往非常有帮助。具体来说，你可能不需要在每次备份时都备份每台计算机上的每个文件。这种策略会消耗大量的网络带宽，即使将备份安排在非工作时间段——取决于网络规模——备份也可能需要几天才能完成。当使用从\
  \ `cron` 任务运行的 `tar` 等简单工具时，通常会使用 `--listed-incremental` 选项（或其他软件包中的等效选项），以最大限度地减少备份的影响。AMANDA\
  \ 可以通过跟踪任何时间哪些计算机已经过备份，以及它们接收的是全量备份还是增量备份，来帮助管理网络备份带宽。然后，AMANDA 可以在多日备份循环的特定日期为计算机安排适当备份类型。\n\
  \n就像使用处理备份的 Samba 备份服务器一样，AMANDA 通常的工作方式首先将数据从备份客户端复制到备份服务器的硬盘上，然后将这些文件复制到磁带。（你可以配置\
  \ AMANDA 将数据直接发送到磁带，但这种配置可能比正常配置慢。）因此，AMANDA 服务器在拥有大硬盘时效果最好——硬盘要大到至少能容纳一天的备份加上标准的系统软件。拥有双倍于正常日备份的容量允许你在将一个备份转到磁带的同时，从网络检索另一个备份集。AMANDA\
  \ 可以在少于此数量的可用磁盘空间运行，但它将不得不分块执行单次备份。例如，如果有 1GB 的可用空间，AMANDA 可能会从备份客户端获取 1GB 数据，将该数据写入磁带，然后获取另一个\
  \ 1GB 数据，依此类推。\n\n## 为 AMANDA 配置客户端\n\nAMANDA 使用服务器发起的备份策略，因此 AMANDA 客户端需要运行服务器软件。对于\
  \ Linux 和 UNIX 客户端，该软件随 AMANDA 一起发布，称为 `amandad`。它通常从超级服务器（super server）运行。启动此服务器的适当\
  \ `/etc/inetd.conf` 文件条目所示：\n\n```\n amanda  dgram  udp  wait  amanda  amandad \
  \ amandad\n```\n\n你可能需要为 `amandad` 执行文件添加显式路径。如果你的发行版使用 `xinetd` 而不是 `inetd`，你需要按照[第\
  \ 4 章]所述调整 `xinetd` 的此条目。该条目以用户 `amanda` 身份运行 `amandad` 服务器，该用户必须存在；你可以根据需要进行更改。\n\
  \n### 注意\n\nAMANDA 文档描述使用专门用于备份的用户名和组（如 `amanda`）启动软件包，但这种方法通常无效。你可能需要以 `root` 身份运行\
  \ `amandad` 才能使其工作。\n\n为了让超级服务器配置生效，你的 `/etc/services` 文件必须包含 `amanda` 服务条目。合适的条目如下：\n\
  \n```\n amanda  10080/udp\n```\n\n在创建了适当的超级服务器和 `/etc/services` 条目后，你应该重启超级服务器，以使\
  \ AMANDA 备份客户端软件对备份服务器可用。客户端其余配置将在备份服务器计算机上进行。\n\n### 注意\n\nAMANDA 备份服务器必须与网络上的其他系统一起进行备份。出于此原因，备份服务器本身通常被配置为备份客户端，同时也配置为备份服务器。\n\
  \n备份客户端需要一个名为 `.amandahosts` 的授权文件，存储在 AMANDA 用户的家目录下。该文件应包含备份服务器的完全限定域名以及该系统上的备份用户名称，用空格或制表符分隔。例如，以下文件允许\
  \ `buserver.threeroomco.com` 备份服务器上的 `amanda` 执行备份：\n\n```\n buserver.threeroomco.com\
  \ amanda\n```\n\n如前所述，AMANDA 在 Windows 系统上使用 `SMB`/`CIFS` 服务器备份那些计算机。你可以按照之前在“共享文件进行备份”部分描述的方法将\
  \ Windows 计算机配置为 AMANDA 备份客户端。\n\n## 配置 AMANDA 备份服务器\n\n由于 AMANDA 备份服务器在正常备份操作中充当网络客户端，因此这些功能不需要运行实际的服务器软件。不过，AMANDA\
  \ 支持客户端发起的恢复，因此 AMANDA 软件包包含了两个运行在备份服务器上的服务器程序。这些允许客户端查看可恢复的包并启动恢复操作。与在备份客户端上运行的服务器软件一样，这些程序通常从超级服务器运行。适当的\
  \ `/etc/inetd.conf` 条目所示：\n\n```\n amandaidx  stream  tcp  nowait  amanda  amindexd\
  \  amindexd\namidxtape  stream  tcp  nowait  amanda  amidxtaped  amidxtaped\n```\n\
  \n与备份客户端软件一样，你可能需要为执行文件添加显式路径，当然，如果你的系统使用 `xinetd`，你需要按照[第 4 章]所述为该软件包创建适当的配置。这些行对应的\
  \ `/etc/services` 条目如下：\n\n```\n amandaidx  10082/tcp\namidxtape  10083/tcp\n```\n\
  \n运行 AMANDA 的用户（通常与超级服务器配置文件中运行 AMANDA 服务器时指定的用户相同）应该对非回绕磁带设备文件具有读写权限。如果没有此权限，AMANDA\
  \ 将无法访问磁带以执行备份。\n\n## 创建 AMANDA 配置\n\n\n\n\n\n`AMANDA` 包通过 `amanda.conf` 文件控制，该文件可能位于\
  \ `/etc`、`/usr/local/etc` 或类似的位置的子目录下。通常，AMANDA 使用它自己的两级子目录来存放配置文件。该子目录应仅允许 AMANDA\
  \ 用户（在本例中为 `amanda`）读取。AMANDA 子目录的第一级命名为 `amanda`，第二级根据备份配置类型命名。例如，可能存在一个 `/usr/local/etc/amanda/Daily`\
  \ 用于常规每日备份，以及一个 `/usr/local/etc/amanda/Archive` 用于归档备份，每个目录下都有自己的配置文件。如果你是从源代码安装的\
  \ AMANDA，你会在源码包的 `example` 子目录中找到示例配置文件。\n\n### 设置基本选项\n\n`amanda.conf` 文件的格式由多行组成，每行包含一个关键字以及一个或多个值。例如，告诉\
  \ AMANDA 处理整个网络备份可能需要多长时间的行可能是：\n\n```\n dumpcycle 4 weeks\n```\n\n少数配置选项跨越多行。这些选项被大括号\
  \ (`{}`) 包围，并定义了一组相关的选项。\n\n你可以让许多配置选项保持默认值。你可能想要调整的选项包括：\n\n* `org` — 这设置了你的组织名称，用于\
  \ AMANDA 生成的报告中。这很大程度上是美化的，但你也可以将其设置为一个合理的值。\n* `mailto` — AMANDA 会向此选项列出的地址发送其活动的邮件报告。你可以指定多个地址，并用空格分隔。\n\
  * `dumpuser` — 这是运行备份的用户名。默认值是你在构建 AMANDA 时通过 `configure` 的 `--with-user` 选项所指定的值。\n\
  * `dumpcycle` — 这是一个转储周期（一次完整的网络备份）的天数。\n* `runspercycle` — 通过设置此参数，你可以根据需要让 AMANDA\
  \ 每天运行、每天运行多次或每隔几天运行一次。例如，如果将 `dumpcycle` 设置为四周，将 `runspercycle` 设置为 `20` 会导致 AMANDA\
  \ 根据每个工作日运行一次来计算备份内容。将此值设置为 `4` 则会导致 AMANDA 假设它每周只运行一次。（请注意，AMANDA 实际上是通过 cron 任务运行的；这些设置只是告诉\
  \ AMANDA 它应该*预期*什么，并以此如何计划备份。）\n* `tapecycle` — 这设置了转储周期内使用的磁带数量。它通常比 `runspercycle`\
  \ 略，以允许带有错误的磁带存在。\n* `tapetype` — 你告诉 AMANDA 你拥有什么种类型的磁带设备，以便该包可以计算备份数据和其他信息的速度。示例\
  \ `amanda.conf` 文件的中间定义了几种磁带类型，你应该将 `tapetype` 选项设置为其中之一。如果你没有看到合适的磁带类型，则必须创建一个。这样做最可靠的方法是使用\
  \ `tapetype` 工具，该工具包含在 AMANDA 中但默认不编译。进入源码包的 `tape-src` 子目录并输入 `make tapetype`。然后向磁带机中载入一张*scratch*磁带并输入\
  \ `./tapetype -f /dev/tapedevice`（其中 `tapedevice` 是你的设备文件名）以获取驱动器的值列表。此操作可能需要几小时，并将擦除磁带上的所有数据。\n\
  * `tapedev` — 这是磁带设备非循环接口的 Linux 设备文件。在大多数情况下，它将是 `/dev/nst0` 或 `/dev/nht0`。\n*\
  \ `netusage` — 这是 AMANDA 预期可以实现的最大网络带宽。\n* `labelstr` — 这是 AMANDA 用于为备份磁带命名的正则表达式。你必须根据此值准备带有名称的磁带，稍后将在“准备磁带”章节中进行描述。\n\
  * `tpchanger`, `changerfile`, 和 `changerdev` — 如果你的磁带机是自动库型号，你必须通过提供自动库文件定义和指向自动带库设备文件的指针来定义它的操作。源码发行版的\
  \ `example` 目录包含一些示例文件。\n* 日志文件 — AMANDA 使用 `infofile` 和 `logdir` 选项设置日志文件位置。同样，包含备份文件列表的索引文件通过\
  \ `indexdir` 选项设置。你可能不想更改这些值，但你应该检查它们。\n\n除了设置这些基本值外，你还必须为数据配置存储区域。这是通过 `holdingdisk`\
  \ 选项实现的，该选项接受包含几个子选项的多行值。这些包括 `directory`（文件存储位置）和 `use`（你可以在磁盘上使用的空间）。如果你的备份服务器磁盘空间不足，你可以为\
  \ `chunksize` 设置一个负值。这将导致大于 `chunksize` 绝对值的文件直接发送到磁带，而跳过存储区域。（`chunksize` 的正值会导致\
  \ AMANDA 临时拆分大文件存储在存储区域中。如果你的存储磁盘文件系统或内核不支持大文件，这将非常有用。例如，*x*86 CPU 上的 *2.2.*x* 内核只支持\
  \ 2GB 的文件。）\n\n### 准备磁带\n\nAMANDA 需要看到已预先标记为它可以可以使用的磁带。要做到这一点，请*作为运行备份的用户*使用 `amlabel`\
  \ 工具：\n\n```\n $ amlabel Daily DailySet123\n```\n\n`amlabel` 的 `Daily` 选项设置了匹配的\
  \ `amanda.conf` 文件所在的子目录，以便 `amlabel` 能够读取相应的配置选项。`DailySet123` 选项是赋予备份磁带的标签。此值应与\
  \ `amanda.conf` 中 `labelstr` 选项设置的正则表达式匹配，否则 AMANDA 将无法使用该磁带。在大多数情况下，AMANDA 将网络备份到一组磁带上，因此你需要标记几盘磁带。你可能想为这些磁带制定一些命名方案，以帮助区分它们。\n\
  \n### 定义转储类型\n\n在示例 `amanda.conf` 文件的末尾有许多 `dumptype` 定义。这些指定了如何备份给定的客户端或客户端上的单个文件系统。你可以在这些定义中设置的功能包括：\n\
  \n* `compress [client | server] [best | fast | none]` — 你可以根据可用的 CPU 和网络资源，指定在备份客户端或备份服务器上执行压缩。你还可以设置压缩更高效但使用更多\
  \ CPU 时间（`best`），或者速度更快但效率较低（`fast`）。`none` 选项显式禁用压缩。\n\n\n\n\n\n- `exclude [list]`\
  \ \"`string\"` — AMANDA 将 `string` 传递给 `tar` 的 `--exclude` 或 `--exclude-from` 选项，取决于是否也包含了\
  \ `list`。\n- `holdingdisk` `boolean` — 将 `boolean` 设置为 `yes` 或 `no`，告诉 AMANDA 是否使用保留磁盘区域（holding\
  \ disk）。\n- `index` `boolean` — 将 `boolean` 设置为 `yes` 或 `no`，告诉 AMANDA 是否为备份集中的文件创建索引。如果没有索引，恢复操作将变得非常麻烦，但索引会消耗你可能希望用于其他用途的磁盘空间。\n\
  - `kencrypt` `boolean` — 你可以通过此选项告诉 AMANDA 使用 Kerberos 协议对跨网络的数据进行加密。将 `boolean`\
  \ 设置为 `yes` 要求你的网络已配置为使用 Kerberos，具体见第 6 节“通过 Kerberos 验证用户身份”中的描述。\n- `program\
  \ \"`string`\"` — AMANDA 可能使用 GNU `tar` 或特定于操作系统和文件系统的 `dump` 程序执行备份，此选项用于设置使用哪者。默认值通常是\
  \ `dump`（由字符串 `DUMP` 设置），但可以通过将 `string` 设置为 `GNUTAR` 来选择 `tar`。（当通过 Samba 备份时，默认使用\
  \ `tar`。）\n- `skip-incr` `boolean` — 如果 `boolean` 为 true，则在增量备份期间将跳过使用此类 dump 类型的的文件系统。\n\
  \n在 dump 类型定义中，你还可以设置其他选项。其中一些与文件早期部分设置的选项相同，例如 `dumpcycle`。另一些在 `amanda` 手页中有描述。大多数\
  \ dump 类型定义以另一个定义的名称开头。这会根据之前的定义设置一系列值。你可以利用此来设置默认值。例如，默认的 `amanda.conf` 文件使用了一个名为\
  \ `global` 的定义，它包含在其他定义中。\n\n请记住，单个备份可能会使用多个 dump 类型。例如，你可以在不使用压缩的情况下备份关键系统文件但在但在重要的目录中压缩数据。同样，你可能使用\
  \ `dump` 备份 ext2fs 分区，但使用 `tar` 备份 ReiserFS 分区。\n\n## 定义备份集\n\n`amanda.conf` 文件包含了许多重要的备份选项，但它并没有指定备份客户端系统的名称或要在这些客户端上备份的目录。这是\
  \ `disklist` 文件负责的工作，它与 `amanda.conf` 位于同一目录下。AMANDA 源码带有一个示例 `disklist` 文件，但当然，你的文件会与示例大不同。\n\
  \n`disklist` 文件由一系列行组成，每行包含三个字段：备份客户端的主机名、要备份的区域以及备份该区域时使用的 dump 类型。要备份的区域可以指定为设备文件名（例如\
  \ `/dev/hda2` 或简单的 `hda2`）或挂载点（例如 `/home`）。该文件还可以包含注释，注释以井号（`#`）开头。列表 17.2 显示了一个简单的\
  \ `disklist` 文件。\n\n**示例 17.2. 示例 `disklist` 文件**\n\n```\n# 备份备份服务器本身\nbuserver.threeroomco.com\
  \  /               root-tar\nbuserver.threeroomco.com  /var            user-tar\n\
  buserver.threeroomco.com  /hold           holding-disk\n## 备份 Linux 或 UNIX 客户端\n\
  buclient.threeroomco.com  /               root-tar\nbuclient.threeroomco.com  /home\
  \           user-tar\n## 备份 Windows 客户端\nbuserver.threeroomco.com  //WINPC/DRIVEC\
  \  user-tar\n```\n\n大多数条目应该是一目了明的。你可能使用也可能不使用默认的 dump 类型，但如果你使用了，它们可能包含列表 17.2 所示的类型。bserver.threeroomco.com\
  \ 上的 `/hold` 分区是 AMANDA 的保留区域。此 dump 类型包含了 `holdingdisk no` 选项，以防止尝试使用该区域备份自身。如果该分区只包含保留区域文件，你可以完全跳过它。Windows\
  \ 客户端的备份是通过指定一个安装并正常运行 Samba 的 Linux 或 UNIX 系统，并列出要备份的 Windows 客户端的 NetBIOS 名称（`WINPC`）和共享名称（`DRIVEC`）来实现。列表\
  \ 17.2 使用备份服务器作为 Samba 系统，但如果你愿意可以使用另一个系统。（使用备份服务器可以减少不必要的网络流量。）Windows 系统的驱动器不需要挂载即可备份；AMANDA\
  \ 会调用 Samba 系统上的 `smbclient` 来完成工作。本质上，Samba 系统使用 `smbclient` 就像普通备份客户端使用 `tar`\
  \ 或 `dump` 一样。要运行，你必须在 Samba 系统上创建一个名为 `/etc/amandapass` 的文件。在该文件中放入 Windows 共享名称以及密码。AMANDA\
  \ 发送 `SAMBA` 作为用户名，因此如果你备份 Windows NT、2000 或 XP 系统，这些系统必须定义此类用户。你可以在构建 AMANDA 时通过\
  \ `configure` 的 `--with-samba-user` 选项来更改默认用户名。\n\n## 运行 AMANDA 备份\n\n要运行 AMANDA\
  \ 备份，你需要在备份服务器上使用 `amdump` 程序。输入程序名，后跟备份集名称（即存储配置文件的目录名称）。例如，你可能输入 `amdump Daily`。当然，你必须首先按照之前“准备磁带”节中的描述，插入一张你已经用\
  \ `amlabel` 准备好的适当磁带。AMANDA 将检查需要备份的区域并执行相应的备份。此备份可能不会处理网络上的每台计算机，甚至不是单台计算机的所有部分。取决于\
  \ `dumpcycle` 等配置选项的设置以及你的磁带类型定义中的容量设置，AMANDA 可能只备份某些计算机，或者执行部分备份而非全备份。不过，假设你没有创建一个太短的\
  \ dump 周期，AMANDA 将在该周期内备份你的整个网络。\n\n当然，你可能不想手动运行 `amdump`。最好的方法将其放在 cron 任务中运行，可能是在网络没有被频繁使用的时间，例如深夜。不过，你应该尝试确保备份客户端在这些时间是可用的。许多用户习惯在离开工作时关闭电脑，因此你可能需要让他们改变这种习惯。\n\
  \n当 AMANDA 完成备份时，它会向使用 `amanda.conf` 中 `mailto` 选项指定的地址发送一份其活动的电子邮件报告。你可以检查此报告以发现任何问题，例如无法访问的计算机或意外满的磁带。\n\
  \n## 恢复数据\n\n本章描述了备份网络的过程。然而，备份只是故事的一半；为了发挥作用，备份必须允许你恢复数据。你必须考虑两种类型的恢复：\n\n\n\n\n\
  \n### 部分恢复\n在部分恢复中，你只需要恢复少数非关键文件。例如，用户可能需要一个上周删除的文件，或者你可能需要恢复一组旧的日志文件。这种过程通常是创建备份过程的简单逆向操作。例如，你不是使用\
  \ `tar` 的 `--create` 选项，而是使用 `--extract` 并指定你想要恢复的文件或目录。如前所述，如果你使用挂载的文件系统和由服务器发起的备份，则你必须确保备份客户端的网络服务器已配置为允许来自备份服务器的读写访问，而这对于纯备份来说并不是强制要求的。\n\
  \n## 全量恢复\n对于任何备份程序来说，最噩梦的场景就是全量恢复，在这种情况下，你必须恢复磁盘上的所有文件，或者至少是启动计算机所需的所有文件。这种情况可能是由于硬盘故障，或者是由于某些软件灾难，例如计算机被类似\
  \ `rm -r /` 这样的错误命令意外抹除。\n\n### 警告\n![WARNING](img/note.gif)\n\n执行全量恢复的原因之一是将系统恢复到被黑客入侵之前的状态。在进行此类恢复时，你必须非常小心，既要清除入侵者留下的所有文件，又要使用系统被破坏之前的备份。在完成此类恢复后，你必须修复导致计算机被破解的任何问题。\n\
  \n全量恢复很难处理，因为你必须找到某种方法将恢复内容传输到一台没有可用软件的计算机上。解决此问题的一种常用方法是在软盘、可启动的 CD-ROM、可启动的 Zip\
  \ 磁盘或类似设备上准备一个紧急恢复系统。对于网络备份客户端，此磁盘应该包含网络配置工具以及你最初创建备份时所使用的任何网络备份客户端或服务器。\n\n###\
  \ 提示\n![TIP](img/tip.gif)\n\n即使你的网络由 Linux 备份服务器和大量的 Windows 9x/Me 备份客户端，你也可以使用基于\
  \ Linux 的紧急恢复系统。此类系统可以包含 Samba，你可以用它运行一个 SMB/CIFS 服务器，Linux 备份服务器可以将文件恢复到该服务器。执行全量恢复后，你可能需要使用\
  \ DOS 的 `FDISK` 将启动分区标记为可启动，并使用你备份的 Windows 版本的 `SYS` 程序向启动分区写入引导扇。如果你有 Windows\
  \ NT、2000 或 XP 备份客户端，过程可能会更加复杂，特别是当它们使用 NTFS 时。在这种情况下，初始安装系统时使用较小的启动分区，并使用 Linux\
  \ 的 `dd` 或商业工具 DriveImage 对其进行备份和恢复，将极大简化恢复工作。\n\n有时，你可能希望使用与备份时不同的方法进行全量恢复。例如，使用备份共享的由客户端发起的\
  \ Samba 备份，可能通过客户端发起的通过 `rshd` 的直接 `tar` 恢复，或者通过使用 NFS 或 Samba 的服务器发起的恢复来更方便地进行。\n\
  \n在某些情况下，特别是如果你没有妥善计划紧急恢复程序，你可能需要重新安装基础操作系统，以恢复正常的备份客户端功能。然后，你可以使用此配置将其余数据恢复到系统，就像进行部分恢复一样。\n\
  \nAMANDA 在此处描述的工具中是特别的，因为它包含了基于客户端的恢复工具。其中最强大的是 `amrecover`，它反过来调用其他工具如 `amrestore`。当你在备份客户端上以\
  \ `root` 身份输入 `amrecover` 进入恢复实用时，程序会向你显示它自己的提示符，你可以在其中输入命令，如 `setdate`（设置要恢复的备份日期）、`cd`（切换到备份中的目录）、`add`（向恢复集添加文件）以及\
  \ `extract`（从恢复集中恢复文件）。在你输入 `extract` 之后，`amrecover` 会提示你准备好相应的磁带以恢复数据。\n\n无论你使用什么方法进行恢复，在实际需要之前对其进行测试都是至关重要的。理想情况下，你应该建立一个测试系统，并尝试对其进行备份以及在该测试系统上执行部分和全量恢复。如果你的网络托管了多个不同的操作系统，请对每个操作系统重复这些测试。完整记录你的恢复程序，并定期重新测试，特别是当你的网络发生任何重要变化时。保留好紧急恢复磁盘的备份——你不想被一张坏软盘感到意外，根据墨菲定律，你会在恰好最错误的时间发现它。\n\
  \n## 总结\n你可以通过许多不同的方式执行网络备份：基于客户端或基于服务器；使用 NFS、SMB/CIFS、`rshd`、AMANDA 或其他网络工具；以及使用\
  \ `tar`、`dump`、`cpio` 或其他备份程序。这些选项都有其适用场景，取决于你的网络细节。了解选项的范围将帮助你找到一个合理的解决方案。对于只有几台机器的网络，使用像\
  \ `tar` 这样熟悉的工具简单方案可能足够了。对于较大的网络，你可能需要使用像 AMANDA 这样复杂的工具。你不应该忽视备份过程中的恢复环节。恢复数据可能仅仅是备份过程的反转，也可能涉及截然不同的技术。\n\
  \n# 第三部分：互联网服务器\n\n# 第 18 章：通过 DNS 管理域名\n为了让计算机在 TCP/IP 网络上通过名称相互找到，计算机需要某种名称解析方法——即将\
  \ `gingko.threeroomco.com` 这样的主机名转换为 `192.168.78.109` 这样的 IP 地址，反之亦然。实现此目的的方法有很多，但最常见之一是使用域名系统（DNS）服务器，也称为名称服务器。事实上，第\
  \ 2 章《TCP/IP 网络配置》中介绍的基本配置指令描述了如何配置计算机使用 DNS 服务器进行名称解析。然而，这些指令假设存在一个你可以使用的 DNS 服务器。此外，整个互联网依赖于一组分布式的\
  \ DNS 服务器。自行运行名称服务器的两个主要原因与 DNS 的这两种用途密切相关。你可能想在自己的网络上运行 DNS 服务器，为自己的计算机将名称翻译为 IP\
  \ 地址，或者你可能想运行一个外部可见的 DNS 服务器，允许他人通过名称访问你的本地机器。\n\n\n\n在任何情况下，`DNS` 管理都涉及设置若干配置文件，用于控制\
  \ `DNS` 服务器，包括它所处理的域名规范。根据你的需求，你可能需要研究一些不直接涉及自身配置的 `DNS` 特性，例如获取域名。你可能还希望 `DNS`\
  \ 服务器与你网络上的其他服务器（特别是你的 `DHCP` 服务器）协调活动，如第 5 章——“通过 DHCP 配置其他计算机”中所述。\n\nLinux 的\
  \ `DNS` 服务器处于复杂性的中等水平；它们不像 Kerberos 那种非常复杂的系统那样管理，但比 Telnet 这种简单的服务器难管理。本章可以帮助你入门，并可能是你管理简单域名所需要的全部内容。对于更复杂的配置，你可以阅读你的\
  \ `DNS` 服务器的文档，或者相关领域的书籍，例如 Albitz 和 Liu 的《DNS and BIND, 4th Edition》（O'Reilly,\
  \ 2001）或 Hunt 的《Linux DNS Server Administration》（Sybex, 2000）。\n\n## 何时运行 `DNS`\
  \ 服务器\n\n管理 `DNS` 服务器并不是一项轻易的任务，因此彻底理解这样做能获得什么至关重要。如果你在本地网络上运行了让本地网络之外的人员可以通过名称访问的服务器，将获得一系列益处。另一个原因与纯粹的本地网络访问有关。在这两种情况下，你可能都想要考虑替代方案。\n\
  \n## 运行外部可访问的 `DNS` 服务器\n\n整个互联网依赖于一组互联的 `DNS` 服务器。理解该系统如何工作，对于理解你为什么可能想要运行 `DNS`\
  \ 以允许外部访问你的系统至关重要。考虑一个响应用户网页浏览的 `DNS` 查询。用户输入统一资源定位符（`URL`），例如 [`www.whitehouse.gov`](http://www.whitehouse.gov)。此输入会导致本地计算机发生各种活动，最终导致系统联系本地\
  \ `DNS` 服务器来 `resolve` `www.whitehouse.gov` 主名——即将其转换为数字 `IP` 地址。本地 `DNS` 服务器通过联系根服务器（root\
  \ server）来开始此过程。它是少数地址不太可能更改的系统之一，因此 `DNS` 服务器在配置文件中编码根服务器的 `IP` 地址。本地 `DNS` 服务器请求根服务器协助解析\
  \ `www.whitehouse.gov` 主名。根服务器可能不知道该 `IP` 地址，但根服务器确实知道拥有更多顶级域名（TLDs），如 `.com`、`.gov`\
  \ 和 `.uk`信息的服务器的 `IP` 地址。因此，根服务器向本地 `DNS` 服务器传递 `.gov` 服务器的地址，本地 `DNS` 服务器将请求重定向到其中一个。`.gov`\
  \ `DNS` 服务器可能无法解析整个主机，但它应该知道负责 `whitehouse.gov` 域名的服务器的 `IP` 地址，并返回这些地址。本地 `DNS`\
  \ 服务器随后向其中一个 `whitehouse.gov` `DNS` 服务器请求 `www.whitehouse.gov` 的地址，`whitehouse.gov`\
  \ 服务器将知道此地址，并返回它。本地 `DNS` 服务器随后可以将此最终地址返回给网页浏览器，浏览器使用它请求网页。整个过程在图 18.1 中所示。这些细节中的大部分对终端用户是隐藏的；对于使用该系统的程序或人来说，看起来就像本地\
  \ `DNS` 服务器知道与互联网上所有系统相关的地址。\n\n![单次 DNS 查询可能涉及连续向多个 DNS 服务器发送的请求。](img/18fig01.gif)\n\
  \n**图 18.1. 单次 `DNS` 查询可能涉及连续向多个 `DNS` 服务器发送的请求。**\n\n尽管这听起来是一种解析主机名的迂回且复杂的方法，但整个过程通常只需要几秒钟。\n\
  \n还有一些快捷方法可以帮助系统更加高效。例如，本地 `DNS` 服务器可能会缓存查询结果。因此，如果两个用户在短时间内请求相同的地址，`DNS` 服务器就不需要再次经历整个过程；它只需返回原始值即可。此外，缓存还包括对常见域名的查询。例如，本地名称服务器几乎肯定拥有\
  \ `.com` `TLD` 服务器的地址，因此可以跳过对根服务器的初始调用。然而，这些缓存不会永久保留；它们会定期刷新，这允许域名管理员更改系统的 `IP`\
  \ 地址而不会引起不必要的问题。\n\n如果你运行想要让他人访问的服务器，那么将自己接入这个 `DNS` 网络是实际需要。具体来说，你必须运行一个 `DNS`\
  \ 服务器，充当图 18.1 中 `whitehouse.gov` 名称服务器的角色，但是针对你自己的域名。这样做的一些实际方面将在接下来的章节“获取域名\n\n\
  管理 `DNS` 的机构要求每个域名至少有两个两个 `DNS` 服务器。这样做并不是因为协议要求，而是为了冗余——如果一个 `DNS` 服务器崩溃，另一个仍然可以解析主机名。如果你的网络特别小，这个要求可能会成为一个问题，但你可能运行自己的主\
  \ `DNS` 服务器，并使用外部源作为备 `DNS` 服务器。\n\n\n\n\n运行自己的 `DNS` 服务器的另一种替代方案是让别人为你服务。许多域名注册商（稍后在“获取域名”章节中会讨论）和互联网服务提供商（ISP）都提供\
  \ `DNS` 托管服务。有时，这些服务会随其他服务（如域名注册）一起免费提供。在其他情况下，你必须支付一小笔费用（通常每年几美元）。至少有一个机构，Granite\
  \ Canyon ([http://www.granitecanyon.com]) 提供免费的 `DNS` 服务——但请记住那句俗言：“一分钱分货”。无论如何，第三方都可以处理你对外部世界的\
  \ `DNS` 请求——如果你想自己托管一个，可以处理两台服务器或其中一台。\n\n有一种特定类型的 `DNS` 服务主要面向具有数字用户线路（DSL）或电缆调制解调器连接的家庭用户：动态\
  \ DNS（dynamic DNS）。提供动态 `DNS` 服务的机构运行的 `DNS` 服务器与其他任何服务器非常相似，但它们允许你快速方便地更新 `DNS`\
  \ 记录以反映变化的 `IP` 地址。大多数企业使用允许静态 `IP` 地址的互联网连接更好，但动态 `DNS` 服务可能对想要运行自己服务器的爱好者有所帮助。少数动态\
  \ `DNS` 提供商也提供传统的静态 `DNS` 服务。动态 `DNS` 提供商太多，无法在此列出所有，但有几个托管动态 `DNS` 提供者列表的网站是 [http://www.technopagan.org/dynamic/]\
  \ 和 [http://www.oth.net/dyndns.html]。\n\n如果你不想亲自维护一台服务器，那么依赖外部源作为 `DNS` 服务器是非常有意义的。由于\
  \ `DNS` 对许多其他服务都至关重要，如果你在 `DNS` 管理方面缺乏经验，或者你的网络连接不稳定，那么依靠经验丰富的外部 `DNS` 服务是一个好主意。\n\
  \n即使你依赖外部的 `DNS` 服务器，你可能也想了解一些 `DNS` 配置。这是因为 `DNS` 提供商常见的 Web 端配置表单通常要求你填写许多与你在本地\
  \ `DNS` 配置文件中输入相同的信息。了解这些信息是什么将帮助你即使在不自己运行 `DNS` 服务器的情况下也能相应地配置你的域名。接下来的章节“域名管理选项”对于帮助你配置由\
  \ `DNS` 托管服务提供名称服务器的域名特别相关。\n\n## 运行本地 DNS 服务器\n\n除了为外部系统提供服务外，你运行的 `DNS` 服务器还可以作为你域的\
  \ `DNS` 服务器——即你在 `/etc/resolv.conf` 中输入的计算机地址，或者你在 `DHCP` 配置文件中指定为名称服务器的计算机地址。与依赖外部\
  \ `DNS` 服务器相比，这有两个主要优势：\n\n*   你可以配置本地系统依赖于你的本地 `DNS` 服务器进行外部查找，从而可能提高性能，特别是当你的\
  \ ISP 的 `DNS` 服务器变得不可靠或变慢时。你的本地 `DNS` 服务器可以维护自己的本地缓存，这在某些情况下可能会提高性能。\n*   你的本地 `DNS`\
  \ 服务器可以维护本地网络的信息，即使对于那些你不想让外部世界访问的本地系统也是如此。例如，你可以在防火墙后运行本地 `DNS` 服务器，以便在本地网络内轻松进行名称解析。这些系统可能从外部世界不可见，因此没有任何外部\
  \ `DNS` 条目。\n\n第二个原因通常更重要，尽管在某些网络上第一个原因可能同样重要。作为一个一般原则，如果你运行 `DNS` 服务器以允许外部人员访问你的网络，那么你也可以将该服务器用于内部访问。当你在防火墙后运行一个包含多个计算机的网络时，纯本地的\
  \ `DNS` 服务器非常有帮助。\n\n仅供本地使用的 `DNS` 服务器的另一种替代方案是配置客户端使用 `DNS` 以外的名称解析方法。一种常用方法是使用\
  \ Linux 或其他 Unix 类系统中的 `/etc/hosts` 文件。（非 Unix 系统通常也支持这种机制，尽管文件可能存储在其他位置，例如 Windows\
  \ 9x/Me 中的 `C:\\WINDOWS\\HOSTS`。）`/etc/hosts` 条目由一个 `IP` 地址、一个完整主机名和一个较短的“别名”组成。例如，条目可能像这样：\n\
  \n```\n 192.168.78.109  gingko.threeroomco.com  gingko\n```\n\n典型的 Linux 系统至少包含一个\
  \ `/etc/hosts` 条目，将 `localhost` 定义为 127.0.0.1。在小型网络上，扩展此文件以包含所有其他本地计算机的定义通常并不困难。在小型网络上花的精力通常少于管理一套完整的\
  \ `DNS` 软件包所需的精力。随着计算机数量的增加，更新所有计算机的 `/etc/hosts` 文件的精力增长速度远快于管理集中式 `DNS` 服务器的精力增长。如果你的网络使用\
  \ `DHCP` 和动态 `IP` 地址（这种配置对于传统的 `DNS` 服务器来说很棘手，但并非不可能），`/etc/hosts` 方法也是不可行的。\n\n\
  ## 获取域名\n\n运行 `DNS` 服务器和获取域名是两个紧密相织的任务。没有域名，`DNS` 服务器对你没有太大帮助，至少对于外部连接而言不是，因为是 `TLD`\
  \ 名称服务器中的域名条目指向了你的 `DNS` 服务器。\n\n### 注意\n\n![注意](img/note.gif)\n\n如果你在私有本地网络上运行\
  \ `DNS` 服务器，你可以自己编写域名，但请确保选择一个在现实世界中未使用的域名。这样做的一种好方法是选择一个未使用的 `TLD`，例如 `.invalid`。\n\
  \n今天，主要有两种类型的域名：\n\n\n\n\n\n-   **国家代码顶级域名 (TLDs)**：这些顶级域名（通常缩写为 `ccTLDs`）分配给特定的国家。例如，`.us`\
  \ 代表美国，`.cc` 属于科科斯岛。\n-   **通用顶级域名 (TLDs)**：这些顶级域名（通常缩写为 `gTLDs`）未正式绑定地理位置，是最受欢迎的类型。示例包括\
  \ `.com`、`.net`、`.org` 和 `.gov`。从 2001 年开始，增加了一些新的 gTLD，例如 `.biz` 和 `.museum`。\n\
  \n注册过程取决于你想要 ccTLD 还是 gTLD，甚至取决于这些类别中的具体特定 TLD。在大多数情况下，你将通过域名注册商获取域名。这些机构是获得授权向特定\
  \ TLD 提交更改以添加域名的组织。大多数注册商可以注册 `.com`、`.org` 和 `.net` TLD 域名，以及至少部分新的 TLD 。某些国家（如科科斯岛）通过允许商业注册商在这些\
  \ ccTLD 中注册域名，使其 ccTLD 商业化，即使获取域名的个人或组织与托管国没有关系。有几个域名注册商列表，例如 [`www.NewRegistrars.com`](http://www.newregistrars.com)\
  \ 和 [`www.icann.org/registrars/accredited-list.html`](http://www.icann.org/registrars/accredited-list.html)。gTLD\
  \ 的注册费用范围在每年 10 到 35 美元之间。\n\n某些 TLD（例如 `.gov` 和 `.edu` gTLD 以及大多数 ccTLD）具有更封闭的注册过程。要使用此类\
  \ TLD，你通常必须向负责该 TLD 的机构发送电子邮件或纸质文件。（某些注册商可以为你代为操作，但你可能需要为此服务支付更多费用。）ccTLD 列表（包括指向一些基本联系信息的链接）可以在\
  \ [`www.iana.org/cctld/cctld-whois.htm`](http://www.iana.org/cctld/cctld-whois.htm)\
  \ 获取。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n`.us` TLD 的管理在 2001 年底发生了变化。在此之前，它是以严格的地理方式管理的，但直接位于\
  \ `.us` 的域名计划在 2002 年开放。如果你想获取 `.us` 域名，请咨询 [`www.nic.us`](http://www.nic.us)。\n\
  \n某些域名（特别是 ccTLD 中的）是以子域名形式颁发的。例如，`.uk` 层级包含特定用途的子域名，如 `.gov.uk` 和 `.co.uk`；通常无法无法直接位于\
  \ `.uk` TLD 下的域名。此类 ccTLD 下每个子域名的策略可能不同。例如，`.gov.uk` 域名用于英国政府机构，而 `.co.uk` 域名是商业性的（类似于\
  \ `.com` gTLD 下的域名）。\n\n注册域名时，必须提供一些基本信息，包括邮寄地址和电话号码。你还需要提供两个处理该域名 DNS 查找的 DNS 服务器的\
  \ IP 地址。如果你运行自己的 DNS 服务器，可以自己提供这些地址。但是，如果你想让别人处理你的外部 DNS 需求，你会发现陷入了一个困境：获取 DNS 服务需要已注册域名，而注册域名又需要\
  \ DNS 服务。你可以通过使用注册商提供的 DNS 服务来打破这种循环。大多数 DNS 商还提供某种程序，允许在域名完全注册之前申请服务。\n\n# Linux\
  \ 的 DNS 服务器选项\n\n在设置 DNS 服务器时，你必须做的第一个选择是使用哪种 DNS 服务器软件包。Linux 中有多种功能各异的选项。最常见的软件包包括：\n\
  \n-   **BIND**：伯克利互联网命名域 (BIND) 是 Linux 中最流行的 DNS 服务器，也是本章的重点。BIND 随所有主要的 Linux\
  \ 发行版一起发布，其网站为 [`www.isc.org/products/BIND/`](http://www.isc.org/products/bind/)。在我写本文时当前版本是\
  \ 9.2.0，但在 2002 年初，许多 Linux 发行版仍带有较旧的 8.2.x 版本。更旧的 4.9.x 版本使用了不同的配置文件格式。\n-   `djbdns`：D.\
  \ J. Bernstein 的 DNS 服务器是 BIND 的替代方案，在某些用户中很流行。最初被称为 `tinydns`，`djbdns` 设计得比 BIND\
  \ 更小、更高效、更安全。它不是本书所讨论的任何发行版的标准 DNS 服务器，但如果你喜欢，可以用 `djbdns` 替换 BIND。你可以在其网页 [`cr.yp.to/djbdns.html`](http://cr.yp.to/djbdns.html)\
  \ 更多关于 `djbdns` 的信息。\n-   `pdnsd`：这是一个代理 DNS 守护进程。它主要设计用于本地网络，作为远程 DNS 服务器的代理。它还支持有限的本地域名解析功能，但不支持\
  \ BIND 或 `djbdns` 实现的全功能。你可以在 [`home.t-online.de/home/Moestl/`](http://home.t-online.de/home/Moestl/)\
  \ 查看更多信息。\n-   `dnscache`：与 `pdnsd` 一，`dnscache` 是一个代理 DNS 服务器；它专门用于加速本地网络上的 DNS\
  \ 查找。与 `pdnsd` 不同，`dnscache` 除了 `localhost` (127.0.0.1) 之外，不支持本地定义的主机。`dnscache`\
  \ 服务器可以在 [`cr.yp.to/djbdns/dnscache.html`](http://cr.yp.to/djbdns/dnscache.html)\
  \ 获取。\n\n大多数需要运行 DNS 的 Linux 管理员都使用 BIND，因为它随所有主要的 Linux 发行版发布，并且是最常见的 DNS 服务器。注重安全的人有时会选择\
  \ `djbdns`，因为它更强调安全性。代理 DNS 服务器在小型网络中对于本地缓存甚至本地名称解析通常很有用，但如果你正想托管自己的域名并为外部系统提供解析服务，它们不是很好的选择。本章的其余部分将重点介绍\
  \ BIND，但如果你使用 `djbdns`，某些管理任务将是类似的。\n\n# 核心 DNS 配置\n\n\n\n\nDNS 配置可以被认为包含两个任务：配置\
  \ DNS 服务器本身（在 BIND 的情况下被称为 `named`）以及管理你的域名。本节涵盖了第一项任务中最常用的选项，下一节“域名管理选项”将涵盖域名管理内容。（后续章节将介绍一些你可能感兴趣的特殊配置——运行本地\
  \ DNS 服务器以进行缓存，以及将 BIND 与 DHCP 服务器集成。）基础 DNS 配置要求你设置基础配置选项、定位其他 DNS 服务器（特别是根服务器），并告诉服务器你打算维护的区域（zones）。除了规模极微的域名外，所有域名都需要一个辅助名称服务器。从理论上讲，你可以简单地复制配置文件来创建完全相同的配置，但通常设置辅助服务器来自动镜像第一个服务器的文件会更好。\n\
  \n## BIND 配置文件\n\n大多数基础 BIND 配置选项都出现在 BIND 的主配置文件 `named.conf` 中。该文件通常位于 `/etc`\
  \ 目录下，但某些发行版的 BIND 软件包可能没有在该位置提供默认文件。你通常可以在 BIND 文档档目录的某处找到示例文件（通常是 `/usr/share/doc/bind-*version*`）。列表\
  \ 18.1 显示了一个短小但完整的 `named.conf` 文件。\n\n**示例 18.1. 示例 `named.conf` 文件**\n\n```\n\
  \ options {\n        directory \"/var/named/\";\n        auth-nxdomain yes;\n  \
  \      forwarders {\n                10.232.7.98;\n                10.232.45.1;\n\
  \        };\n        forward first;\n };\n\nzone \".\" {\n        type hint;\n \
  \       file \"named.ca\";\n};\n\nzone \"threeroomco.com\" {\n        type master;\n\
  \        file \"named.threeroomco.com\";\n};\n\nzone \"1.168.192.in-addr.arpa\"\
  {\n        type master;\n        file \"named.192.168.1\";\n};\n\nzone \"0.0.127.in-addr.arpa\"\
  \ {\n        type master;\n        file \"named.local\";\n};\n```\n\n`named.conf`\
  \ 文件被划分为若干部分。以列表 18.1 为例，这些包括 `options` 和几个 `zone` 部分。`options` 部分设置了全局选项，例如存储区域配置文件的目录。`zone`\
  \ 部分定义了特定的区域——即域名或其他主机名或 IP 地址的逻辑分组。`named.conf` 中的大多数行都以分号（`;`）结尾。这是文件格式的要求，因此你应该务必遵守，否则\
  \ BIND 可能会产生混淆。`named.conf` 的大部分工作是让 BIND 指向提供有关特定区域详细信息的文件。这些文件位于 `/var/named`（或你通过\
  \ `directory` 选项指定的任何位置）。\n\n接下来的章节将更详细地描述 `named.conf` 的内容。\n\n## 定位其他名称服务器\n\n\
  安装 DNS 服务器时必须执行的首要任务之一获取根名称服务器列表。有多种方法可以获取此列表，可能包括：\n\n*   该文件可能随 BIND 软件包一起发布，通常位于\
  \ `/var/named` 目录下，命名为 `named.ca` 或 `db.cache`。不过，该文件可能是过时的，因此你可能希望使用以下两种方法之一来检查是否有更新的文件。\n\
  *   你可以通过 FTP 从 `ftp://ftp.rs.internic.net/domain/` 获取文件，文件名为 `named.ca`。\n*   如果你的系统安装了\
  \ `dig` 程序，可以输入 `dig @a. root-servers.net . ns > named.ca` 来检索文件并将其命名为 `named.ca`。\n\
  \n第二和第三选项都需要你的系统能够访问运行中的 DNS 服务器。如果你的网络没有这样的服务器，你可以尝试在连接到另一个网络的计算机上获取文件，或者临时设置你未来的\
  \ DNS 计算机使用另一个系统进行名称解析，如第 2 章“TCP/IP 网络配置”所述。\n\n获取根服务器列表后，将其复制到 `/var/named` 目录。你必须确保你的\
  \ `/etc/named.conf` 文件包含了对根服务器列表的引用。根服务器列表在 `zone \".\"` 部分中通过 `file` 选项指定，如列表 18.1\
  \ 所示。确保你用于根区域文件的文件名与 `named.conf` 中列出的文件名匹配。（技术上，所有主机名都以点结尾，因此根区域由一个单独的点表示。）\n\n\
  ## 设置转发服务器\n\nBIND 的默认功能是按顺序通过以下三种方式之一执行查询：\n\n1.  如果 BIND 被配置为某个地址的权威服务器，则服务器根据其配置文件中设置的地址做出响应。\n\
  2.  如果请求的是程序缓存中的地址，服务器将返回该地址。如前所述，此功能提升了性能并减少了网络流量。\n3.  如果请求的地址不在 BIND 缓存中，服务器将查询根名称服务器和其他名称服务器，如前所述。这种递归查找在最坏的情况下通常只需要几秒钟，但比缓存查找要慢。\n\
  \n不过，BIND 还支持第四种选项：它可以查询 DNS 服务器并让该服务器执行繁琐的递归查找。在这样配置的情况下，BIND 会在检查本地缓存之后、执行完全递归查找之前尝试此选项。其理念是，如果一个运行在小型网络上的名称服务器可以访问一个较大的（但仍具有一定本地性的）名称服务器，那么如果它能够依靠该较大\
  \ DNS 服务器的缓存和更快的网络连接，可能会产生更快的查询。例如，如果你经营的是一个通过拨号或卫星连接到互联网的家庭或小型办公室网络，你可能希望配置服务器将\
  \ DNS 请求转发到你 ISP 的 DNS 服务器。拨号上网和卫星宽带等连接具有高延迟，因此完全递归查找的多次查询可能需要几秒钟才能完成。\n\n但为什么不直接让你的本地计算机使用你\
  \ ISP 的服务器呢？也许你想要运行自己的本地 DNS 服务器来处理本地系统的名称，或者你可能希望获得比 ISP 服务器更接近你系统的缓存益处。此外，一些 ISP\
  \ 的 DNS 服务器并不可靠，因此拥有自己配置的服务器作为备选可以提高网络连接的可靠性。\n\n\n\n无论何情况下，这种转发配置都是通过 `forwarders`\
  \ 和 `forward first` 选项创建的，如 Listing 18.1 所示。`forwarders` 选项允许你指定一个或多个 `DNS` 服务器的\
  \ `IP` 地址，你的服务器在尝试执行递归查找之前将向这些服务器查询信息。`forward` 选项可以取两个值之一——`only` 或 `first`。如果你指定\
  \ `forward only`，BIND 将完全依赖于指定的远程 `DNS` 服务器；BIND 将不会执行自己的递归搜索。相比之下，`forward first`\
  \ 会导致 BIND 尝试通过指定的远程 `DNS` 服务器进行查找，但如果该查找失败（例如，因为远程 `DNS` 服务器没有响应），BIND 将继续进行正常的递归查找。在上述两种情况下，如果\
  \ BIND 被告知它对某个区域具有权威性（如后文描述所示），它仍然依赖于自身的区域配置。\n\n## 设置区域 (Setting Up Zones)\n\n\
  当你设置 BIND 时，必须告诉它如何处理对特定域名、子域名和 `IP` 地址范围的请求。这些不同的名称和地址组被称为 `zones`（区域）。一个区域可以是域名或子域名（如\
  \ Listing 18.1 中的 threeroomco.com 区域），也可以是 `IP` 地址范围（通过以 `in-addr.arpa` 结尾的区域名称指定）。小型\
  \ `DNS` 服务器将设置若干区域：\n\n*   **根区域 (The root zone)**——。由单个点（`.`）标识的区域指向命名空间的根。该区域定义使用\
  \ `type hint` 选项，告诉 BIND 推后交给 `file` 选项所指定文件中列出的名称服务器，如前所述。\n*   **你的本地域名 (Your\
  \ local domain)**——。除非你运行的是纯缓存名称服务器，否则你将希望配置 BIND 来处理对应于你的域名或子域名的区域。Listing 18.1\
  \ 中的 threeroomco.com 区域就是这种配置的示例。\n*   **反向 DNS 区域 (Reverse DNS zones)**——尽管 `DNS`\
  \ 最常用于从主机查找 `IP` 地址，但反向查找也是可能的。这被称为 `reverse DNS` 查找，由以 `in-addr.arpa` 结尾的区域名称处理。在区域名称中，该字符串之前是反向排序的部分\
  \ `IP` 地址。例如，192.168.1.0/24 网络的条目被称为 `1.168.192.in-addr.arpa`，如 Listing 18.1 所示。\n\
  \n基础区域配置指定了区域的类型，并列出了提供区域额外信息的配置文件。区域类型可以是以下任何一种：\n\n*   **`master`**——。`master`\
  \ 服务器是包含该区域原始权威控制文件的服务器。如果你在为小型网络配置 `DNS` 服务器，你可能会将其本地域名的区域配置为 `master`。Listing\
  \ 18.1 阐述了这种方法。\n*   **`slave`**——。`slave` 服务器从另一个 `DNS` 服务器获取区域信息。尽管如此，从机服务器仍然被视为该区域的权威源。下一节“Configuring\
  \ a Slave Server”将更详细地介绍这些选项。单个 BIND 服务器可以作为某些区域的 `master` 并作为其他区域的 `slave`。不过，通常设置一个\
  \ `master` 和匹配的 `slave` 是简单的。\n*   **`stub`**——。这种配置与 `slave` 配置非常，不同在于 `stub` 服务器只复制\
  \ `NS` 记录——即名称服务器规范。如果你想为子域名配置一个单独的 `DNS` 服务器，就会使用此选项。例如，如果 threeroomco.com 有一个名为\
  \ sub.threeroomco.com 的子域名，并且你想为 sub.threeroomco.com 运行单独的 `DNS` 服务器，你可以在 threeroomco.com\
  \ 的 BIND 配置中包含一个 sub.threeroomco.com 区域，并赋予它一个指向 sub.threeroomco.com `DNS` 服务器的\
  \ `stub` 类型。或者，你可以使用一个 `DNS` 服务器处理整个域名，包括 sub.threeroomco.com 子域名。这不需要为 sub.threeroomco.com\
  \ 特殊区域条目。\n*   **`forward`**——。与 `options` 部分中的 `forward` 选项类似，`forward` 区域类型告诉\
  \ BIND 将对区域信息的请求传递给另一个 `DNS` 服务器。本质上，BIND 向指定的服务器发出自己的 `DNS` 请求，然后用此查询的结果进行响应。为了使其生效，你必须包含\
  \ `forwarders` 选项，告诉 BIND 向哪些远程 `DNS` 服务器转发请求。\n*   **`hint`**——。这种区域类型是根名称服务器规范特有的。你用它告诉系统从哪里找到根名称服务器列表。BIND\
  \ 然后应该尝试自己从一个根名称服务器来更新该列表。\n\n一个简单的配置（如 Listing 18.1 所示）可以只包含一个 `hint` 区域和几个 `master`\
  \ 区域。更复杂的配置可能包含所有的区域类型。\n\n## 配置从服务器 (Configuring a Slave Server)\n\n如果你为已注册域名运行自己的\
  \ `DNS` 服务器，你必须配置两个 `DNS` 服务器。这通常通过让一个服务器成为另一个服务器的从机来处理。从机服务器将其区域信息存储在单独文件中，就像主服务器一样。主要的区别是从机服务器会自动从其主服务器检索区域文件。你通过更改\
  \ `/etc/named.conf` 中的区域配置来告诉从机如何这样做。例如，假设你想设置一个服务器作为 Listing 18.1 配置的服务器的从机。从机上\
  \ threeroomco.com 域名的区域配置可能如下所示：\n\n```\n zone \"threeroomco.com\" {\n        type\
  \ slave;\n        file \"named.threeroomco.com\";\n        masters { 192.168.1.50;\
  \ }\n};\n```\n\n这告诉从机从 192.168.1.50 的 `DNS` 服务器获取其 threeroomco.com 的配置文件。如果从机是多个域的从机，你应该包含多个这样的定义。如果你有多个两个域的\
  \ `DNS` 服务器，你可以在 `masters` 列表中包含多个 `DNS` 服务器；用分号（`;`）隔开 `IP` 地址。（事实上，一个从机可以从另一个从机同步自己）。如果服务器是几个区域的从机，每个区域可以与不同的主服务器同步。如果你正在管理多个域名，每个域名都应该有自己的主服务器，但接受一个共享的从机，你可以使用此功能。\n\
  \n\n\n\n请记住为正向查询（如 `threeroomco.com` 区域）和反向查询（如列表 18.1 中的 `1.168.192\\. in-addr.arpa`\
  \ 区域）都配置从属区域。你不应该配置从属 DNS 服务器为根名称服务器或本地主机反向查询（如列表 18.1 中的 `0.0.127.in-addr.arpa`）使用从属区域。\n\
  \n当你将服务器配置为从属并启动时，你应该能看到 `zone` 选项中指定的区域文件出现。如果没有，请检查主系统和从属系统上的日志文件，查找错误的线索。一种可能性是主服务器被配置为拒绝区域传输。这可能是作为一种安全措施，防止外部人员获取你所在域内所有本地计算机的信息。如果你想限制主或从属\
  \ DNS 服务器上的区域传输，可以使用 `allow-transfer` 选项，该选项可以放在 `options` 部分或特定的 `zone` 部分中。例如，你可能使用以下设置将传输限制到\
  \ 192.168.1.0/24 网络上的计算机以及 172.19.98.23：\n\n```\n allow-transfer {\n        192.168.1/24;\n\
  \        172.19.98.23;\n};\n```\n\n# 域名管理选项\n\n如果你已经创建了 `/etc/named.conf` 文件，并用它设置了全局选项和针对你域的区域，你可能急于启动服务器。但是，除非你的服务器是另一个系统的从属，否则你的配置任务尚未完成。如前文所述，当你设置主区域时，你是在告诉\
  \ BIND 读取一个特定区域的配置文件。在这个文件中，你存储了关于该区域的主机名和 IP 地址的信息。在大型名称服务器上，创建和维护这些区域文件是管理工作的大部分。如果你的域名较小且静态的，你可能设置几个区域文件然后忽略它们。\n\
  \n## 示例区域配置文件\n\n列表 18.2 显示了一个示例区域配置文件。该文件以区域名称（`threeroomco.com.`）以及一个定义了该域许多默认值的部分开头。这些默认值将在下一节“[设置主区域选项”中进行更详细的描述。在该节之后是一系列行，提供了特定计算机名称与其\
  \ IP 地址之间映射的信息。其中某些内容实际上适用于整个域名。接下来的章节“[指定地址和别名”描述了这些行。\n\n### 警告\n\n![警告](img/warning.gif)\n\
  \n从技术上说，DNS 主机名都以点（`.`）结尾。当你在 Web 浏览器、FTP 客户端、电子邮件客户端等中输入不带点的主机名时，Linux 首先会将该地址解释为缺少域名的地址，因此\
  \ Linux 会尝试添加 `/etc/resolv.conf` 中指定的默认和搜索域名。当此查找失败时，Linux 会通过在域名后添加单个点来重试。这个过程在正常操作中是透明的，但在配置\
  \ DNS 时，你不能太粗心。你*必须*将*所有*主机名指定为带有尾部点的完全限定域名 (FQDNs)，或者仅为不带关联域名的主机名。如果你提供了一个不带点的\
  \ FQDN，BIND 将尝试添加该点，导致名称的域名部分有效翻倍，例如 `gingko.threeroomco.com.threeroomco.com.`。\n\
  \n**示例 18.2. 示例区域配置文件**\n\n```\n threeroomco.com.   IN  SOA  spruce.threeroomco.com.\
  \  \\\n                            admin.threeroomco.com. (\n                  \
  \ 2002043004 ; serial\n                   3600       ; refresh\n               \
  \    600        ; retry\n                   604800     ; expire\n              \
  \     86400      ; default_ttl\n                   )\ngingko.threeroomco.com.  \
  \ IN A      192.168.1.1\nbirch                     IN A      192.168.1.2\nspruce\
  \                    IN A      192.168.1.3\nthreeroomco.com.          IN A     \
  \ 192.168.1.4\nwww                       IN CNAME  gingko\nkelp                \
  \      IN CNAME  jacques.pangaea.edu.\n@                         IN MX     10  birch.threeroomco.com.\n\
  @                         IN MX     20  mail.pangaea.edu.\n@                   \
  \      IN NS     spruce.threeroomco.com.\n```\n\n区域文件中行的通用格式如下：\n\n```\n name  IN\
  \  record-type  record-contents\n```\n\n在这样的条目中，`name` 是计算机名称，或者在反向 DNS 区域的情况下是与地址关联的伪名，如接下来的章节“[配置反向\
  \ DNS 区域”所示。`IN` 是指向特定类型条目的代码。它代表 `Internet.*`。在某些情况下，你可以使用其他类来代替 `IN`，但本章未涵盖此类配置。`record-type`\
  \ 是代表你正在定义的记录类型的代码，例如普通的正向 DNS 条目、反向 DNS 条目或指定邮件服务器的条目。最后，`record-contents` 是用于定义记录的多个或多个字符串，例如\
  \ IP 地址或主机名。在主选项的情况下，`record-contents` 是一个通常跨越几行的条目。对于大多数其他记录，整个条目适合单行显示。分号（`;`）是注释指示符；该行中分号后的任何文本都会被忽略。\n\
  \n### 警告\n\n![警告](img/warning.gif)\n\nBIND 的配置文件在分号的使用上是不一致的。在 `named.conf` 中，分号表示配置语句的结束。在区域文件中，分号表示注释的开始。在编辑配置文件时，请记住这一重要区别。如果你感到困惑并错误地使用分号，BIND\
  \ 可能无法启动，或者行为异常。\n\n整个区域配置文件通常存储在 `/var/named` 中，并命名为与区域名称相关的名称。通常，名称是 `db.zone-name`\
  \ 或 `named.zone-name`，其中 `zone-name` 是区域的名称。不过，你可以为你的区域文件命名任何名称。重要的是你在 `/etc/named.conf`\
  \ 中通过它们的真实名称引用它们。\n\n## 设置主区域选项\n\n主区域选项出现在起始记录 (SOA) 中，该记录的 `record-type` 为 `SOA`。此记录的存在表明名称服务器对该域具有权威性。此记录的\
  \ `name` 是 `/etc/named.conf` 中指定的区域名称——但请记住包含尾部点，如列表 18.2 所示！此条目的 `record-contents`\
  \ 由三部分组成：\n\n\n\n\n\n-   **主名称服务器**：列表 18.2 中的第一个名称（`spruce.threeroomco.com.`）是该区域的主名称服务器名称。在列表\
  \ 18.2 中，该名称后面跟着一个反斜杠（`\\`）。与许多配置文件一样，这是一个换行连接符，因此列表 18.2 中的第二行物理行被解释为它是第一行的一部分。许多区域文件实际上使用单行长行，而不是由反斜杠分隔的两行。\n\
  \n-   **管理员电子邮件地址**：列表 18.2 中的第二个名称（`admin.threeroomco.com.`）是负责维护该区域的人员的电子邮件地址。尽管地址格式有些特殊；要使用它，你必须将第一个点替换为\
  \ 符号（`@`），因此列表 18.2 的管理员是 `admin@threeroomco.com`。\n\n-   **计时信息**：跨越几行并被括号括的数字提供了计时信息。这些行在列表\
  \ 18.2 中被注释，以说明它们的用途。`serial` 行是一个序列号，每当你编辑区域文件时，该数字都应该增加；从服务器使用此数字来确定是否更新其配置文件。许多管理员使用日期（采用\
  \ `YYYYMMDD` 格式）后跟一个表示当天更改次数的数字作为序列号。`refresh` 行是从服务器检查主服务器是否有更新的区域文件之间的时间（以秒为单位）。列表\
  \ 18.2 中的 `3600` 值翻译为一小时，因此从服务器将在主服务器文件更改后的一小时内完成更新。`retry` 值是从服务器在第一次传输失败后尝试另一次传输的间隔时间（以秒为单位）；它通常比\
  \ `refresh` 时间要短。`expire` 值是从服务器在因无法到达主服务器而完全丢弃某个区域之前等待的时间长度（同样以秒为单位）。此值通常至少为一周，并且应该始终比\
  \ `refresh` 间隔长。最后，`default_ttl` 条目设置了记录的生存时间（TTL）值。这是远程 DNS 服务器保留单个查询信息的时间。典型值范围从一天（`86400`，如列表\
  \ 18.2 所示）到大约一周（`604800`）。如果你网络上的 IP 地址更改频繁，或者你预计很快将实施更改，那么将 TTL 值设置为一小时左右（`3600`）可能是值得的。\n\
  \n## 指定地址和别名\n\n区域文件中的大多数行都提供了将 IP 地址与主机名关联的信息，无论是直接还是间接。在大多数情况下，`name` 字段是单个计算机的名称或与\
  \ IP 地址关联的名称（如后文所述）。然而，可以使用 @ 符号（`@`）作为域名的代符。你可能结合 `MX` 和 `NS` 记录使用此功能，如列表 18.2\
  \ 所示，并在后文中更详细地描述。此类记录并没有建立特定主机名与 IP 地址之间的链接，而是将特定的主机名附加以承担整个域的特定职责。\n\n最常见的记录类型如下：\n\
  \n-   **A**：地址（A）记录使用主机名作为 `name`，并提供 IP 地址作为 `record-contents`（记录内容）。你可以将主机名指定为带有尾部点的完全限定域名（FQDN），如列表\
  \ 18.2 中的 `gingko.threeroomco.com.`，或者指定为不带域名或尾部点的主机名，如列表 18.2 中的 `birch` 和 `spruce`。也可以分配一个计算机仅使用域名作为其主机名，如列表\
  \ 18.2 中的 `threeroomco.com. (192.168.1.4)`。这种配置不会阻止你在该域内使用其他名称。\n\n-   **CNAME**：规范名称（CNAME）记录将一个主机名链接到另一个主机名。与\
  \ A 记录一样，`record-contents` 可以指定为带有尾部点的 FQDN 或不带域名的主机名。在第一种情况下，目标域不需要与该文件定义的区域属于同一个域；例如，列表\
  \ 18.2 中的 `kelp` 指向另一个域中的机器。通常情况下，如果一个重要系统的 IP 地址不直接受你控制，CNAME 是非常有用的。例如，如果你使用 Web\
  \ 托管服务，你可能想使用 CNAME 条目将 `www` 地址链接到该外部计算机，这样即使你的托管服务更改了其托管机器的 IP 地址，`www` 也将继续工作。\n\
  \n-   **PTR**：列表 18.2 不包含指针（PTR）记录。这些记录出现在反向 DNS 区域的区域文件中。将在接下来的章节“配置反向 DNS 区域”中讨论。\n\
  \n-   **NS**：名称服务器（NS）记录指定了域的名称服务器。通常，至少有一个 NS 记录会指向与 SOA 记录中列出的主名称服务器相同的计算机。NS\
  \ 记录的 `name` 通常是 `@` 或你的域名本身，而 `record-contents` 字段通常列出了一个定义名称服务器的 A 记录。\n\n\n\n\
  \n# MX —\n\n最后，`mail exchanger (MX)` 记录提供了关于该区域邮件服务器的信息。此条目使用 `@` 或域名本身作为 `name`（名称）。`record-contents`\
  \ 字段包含两个部分：`priority code`（优先级代码）和主机名。当邮件服务器需要发送给该域名用户（例如 `lorax@threeroomco.com`）的邮件时，远程服务器会向你的名称服务器查询其\
  \ `MX` 记录。然后，远程服务器尝试连接优先级代码最低的系统——在列表 18.2 中为 `birch.threeroomco.com`。如果该系统宕机，远程邮件服务器将尝试下一个更高优先级的系统（例如列表\
  \ 18.2 中的 `mail.pangaea.edu. `），以此类推，直到消息送达或所有邮件服务器都失败为止。当然，邮件服务器系统必须配置为接收发送给该域名用户的邮件，而不是或额外接收发送给特定计算机用户的邮件。这在第\
  \ 19 章中进行了讨论。\n\n### 提示\n\n![TIP](img/tip.gif)\n\n许多记录类型可以指向位于你自己的域名之外的计算机。这对于之前讨论过的\
  \ `CNAME` 记录可能特别有帮助，对于依赖外部源来实现部分或全部 `DNS` 或邮件服务器功能的 `NS` 和 `MX` 记录也是如此。\n\n列表 18.2\
  \ 显示了这些记录类型的运行情况。不过，真实域名提供的计算机信息可能会比列表 18.2 提供的多得多。\n\n# 配置反向 DNS 区域\n\n列表 18.1\
  \ 显示了几个区域，其中两个用于反向 `DNS` 记录。这些区域允许 `DNS` 服务器在给定 `IP` 地址时检索主机名。此操作的诀窍是创建一个伪域名 `in-addr.arpa`。你的\
  \ `/etc/named.conf` 文件将 BIND 指向对该域名某些子集具有权威性的区域文件。由于域名的最低有效位元素位于名称的最左侧，而 `IP` 地址的最低有效位元素位于地址的最右侧，因此你以反向方式将\
  \ `IP` 地址作为此伪域名的一部分输入输入。因此，`192.168.1.0/24` 地址的区域名称为 `1.168.192.in-addr.arpa`。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n在注册域名后，你可以为自己的域名运行 `DNS` 服务器（如果你的网络是私有的，甚至可以使用虚拟域名）。除非你负责该\
  \ IP 段，否则你不应尝试在该 IP 段上运行反向 `DNS` 服务。如果不小心这样做不太可能给他人带来问题，但如果你配置不正确，可能会破坏你所在网络的反向查找。该规则有两个例外：首先，本地回环地址段（`127.0.0/24`，甚至\
  \ `127/8`）可以在本地配置，如果你运行的是私有网络，你应该为你使用的私有 IP 地址空间设置反向 `DNS` 区域。\n\n反向 `DNS` 区域的配置与正向\
  \ `DNS` 区域相同，不同之处是 `PTR` 记录在反向区域占据主导地位（反向 `DNS` 区域也包含 `SOA` 记录，通常还有 `NS` 记录）。在大多数反向\
  \ `DNS` 区域文件中不需要定义 `MX` 记录、`A` 记录或 `CNAME` 记录。列表 18.3 显示了一个反向 `DNS` 区域文件，用于与列表 18.2\
  \ 中所示的正向 `DNS` 区域文件匹配。\n\n**示例 18.3. 一个反向 DNS 区域文件**\n\n```\n 1.168.192.in-addr.arpa.\
  \  IN SOA spruce.threeroomco.com.  \\\n                         admin.threeroomco.com.\
  \ (\n                   2002043004 ; serial\n                   3600       ; refresh\n\
  \                   600        ; retry\n                   604800     ; expire\n\
  \                   86400      ; default_ttl\n                   )\n1          \
  \                IN PTR  gingko.threeroomco.com.\n2.1.168.192.in-addr.arpa.  IN\
  \ PTR  birch.threeroomco.com.\n3.1.168.192.in-addr.arpa.  IN PTR  spruce.threeroomco.com.\n\
  4.1.168.192.in-addr.arpa.  IN PTR  threeroomco.com.\n@                         \
  \ IN NS   spruce.threeroomco.com.\n```\n\n你可以使用短名称来指定名称——在这种情况下，通常只是 `IP` 地址的主机部分，例如\
  \ `192.168.1.1` 的 `1`——或者使用完整的（但反序的）`IP` 地址后接 `in-addr.arpa`。列表 18.3 说明了这两种方法。`record-contents`\
  \ 字段应包含完整的主机名，包括结尾的点。由于此区域与正向区域不同，尝试简化名称将导致错误的查找，例如 `birch.1.168.192\\. in-addr.arpa`，而不是\
  \ `birch.threeroomco.com`。\n\n# 运行仅缓存名称服务器\n\n小型网络中常见的一种 `DNS` 配置是仅缓存系统。此类名称服务器被配置为不对任何域具有权威（本地网络上的反向\
  \ `DNS` 除外）。相反，服务器的唯一目的是缓存外部 `DNS` 请求。其想法是通过维护本地缓存而不是依赖远程 `DNS` 服务器来提供更快的 `DNS`\
  \ 查找。当与外部世界的连接较慢时（例如基于卫星的宽带连接，必须处理高延迟——双向卫星系统接近半秒的延迟），这种配置特别可能提高 Web 浏览器等程序的感知网络速度。传统的电话拨号连接通常也有大约\
  \ 200 毫秒的延迟，不如卫星设置糟糕，但仍会导致查找产生明显的延迟。\n\n需要注意的是，如果正在查找的地址不在本地服务器的缓存中，本地 `DNS` 缓存将无法提高查找时间。因此，这种方法在用户较多的网络中最为有用，这些用户倾向于访问许多相同的网站，从而建立起可以在很大比例的\
  \ `DNS` 查找中利用的缓存。\n\n\n\n\n仅缓存名称服务器的 Basic 配置与列表 18.1 所示类似，但它会缺少大部分或全部的区域定义。你可能考虑定义的唯一区域是本地反向\
  \ DNS 区域（`0.0.127.in-addr.arpa`）和根区域（`.`）。即使是这些区域也不是严格必要的。\n\n仅缓存 BIND 配置最重要的特性是\
  \ `options` 部分中的 `forwarders` 和 `forward` 条目。`forwarders` 条目必须列出你 ISP 的 DNS 服务器；BIND\
  \ 将使用这些系统来执行职责并缓存结果。与其其像列表 18.1 中那样使用 `forward first`，你可能希望使用 `forward only`。此配置将导致服务器在转发器系统没有响应时停止尝试解析名称。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n如果你在 `options` 部分包含了根区域并使用 `forward first`，当转发器系统失败时，BIND\
  \ 可能会递归查找地址。这通常是理想的，但在仅缓存配置中，可能会减慢某些类型的错误消息，特别是当你的互联网连接具有高延迟时。\n\n正如本章前面提到的，比 BIND\
  \ 更轻巧的包可以作为仅缓存名称服务器运行，并且对于这一角色来说可能是更好的选择。尽管如此，仅缓存 BIND 配置是 BIND 最简单的配置之一，而且由于 BIND\
  \ 随所有主流发行版发布，它可能是设置最简单的。不过，如果你为该角色偏好更轻量的东西，`dnscache` 或 `pdnsd` 可能值得研究。\n\n当你配置仅缓存名称服务器（或功能完整的本地名称服务器）时，你应该将该系统的\
  \ IP 地址指定为网络所有本地计算机的 DNS 服务器地址。如果你添加了 DNS 服务器但未能更改现有本地系统的 DNS 配置，本地计算机将继续使用它们之前使用的任何外部\
  \ DNS 服务器。\n\n# 与 DHCP 服务器通信\n\n如果你的网络使用 DHCP 为计算机分配 IP 地址，你可能无法在区域文件中输入固定 IP 地址，因为\
  \ IP 地址可能在 DHCP 客户端启动时确定，并可能在客户端启动之间发生变化。第 5 章 通过 DHCP 配置其他计算机讨论了解决此问题的解决方案：配置 DHCP\
  \ 服务器为客户端分配一致的地址，或者配置 DHCP 和 DNS 服务器相互通信。在第一种情况下，你必须确保 DHCP 和 DNS 服务器配置一致。例如，如果你想让\
  \ birch.threeroomco.com 成为 192.168.1.2，你必须在 DHCP 服务器的配置文件*以及*DNS 服务器的区域文件中*都设置该映射（理想情况下，在正向和反向查找区域文件中都设置）。这是一个简单的解决方案，但对于大型域名来说可能非常繁琐。\n\
  \n第 5 章 讨论了 DHCP/DNS 通信中的 DHCP 配置部分，因此如果你想实现服务器间的通信方案，除了本节外，还应该咨询第 5 章。BIND 部分在\
  \ `named.conf` 文件中对应于相关区域的区域部分实现。具体来说，你必须添加 `allow-update` 。例如，这样的区域定义可能如下所示：\n\n\
  ```\n zone \"threeroomco.com\" {\n        type master;\n        file \"named.threeroomco.com\"\
  ;\n        allow-update { 192.168.1.1; }\n};\n```\n\n此配置告诉 BIND 接受来自 192.168.1.1\
  \ 的更新信息，该地址应该是你网络的 DHCP 服务器。如果你的服务器处理反向 DNS，并且你配置了 DHCP 服务器执行正向和反向更新，你必须对反向 DNS\
  \ 区域进行类似的更改。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\n如果你的 DNS 服务器暴露在互联网上，或者你的本地用户不是\
  \ 100% 可信，即使接受来自单台远程计算机的 DNS 更新也存在风险。坏分子可能成功劫持 DHCP 计算机的地址或伪装该系统，然后对你的 DNS 服务器进行更改，可能会损害依赖\
  \ DNS 服务器数据真实性的其他系统。你可以通过在同一台计算机上运行 DNS 和 DHCP，并仅允许来自 localhost (127.0.0.1) 地址的更新来降低风险。\n\
  \n# 启动和测试服务器\n\n你可以通过第 4 章中讨论的任何方式启动 DNS 服务器，尽管通常从 SysV 启动脚本或偶尔从自定义启动脚本运行。从超级服务器运行\
  \ DNS 服务器会产生较慢的名称查找，这是不受内容的。\n\n测试名称服务器运行非常有用的工具是 `host`。该程序随大多数 Linux 发行版一起，通常在一个名为\
  \ `bind-utils` 或类似的包中。`host` 实用使用指定的 DNS 服务器查找名称或地址。在最简单的形式下，它使用 `/etc/resolv.conf`\
  \ 中指定的运行该计算机的默认 DNS 服务器。你可以通过输入其名称后跟主机或 IP 地址来使用它，例如：\n\n```\n $ host www.awl.com\n\
  www.awl.com is a nickname for awl.com\nawl.com has address 165.193.123.224\n```\n\
  \n在这个示例中，输出的第一行表示 www.awl.com 是 awl.com（通过 CNAME 记录）的别名。该系统的 IP 地址为 165.193.123.224。此类测试确认了名称服务器对于外部解析工作正常。如果你配置了自己的域名，你还应该使用本地主机名和地址测试其功能。在适当的情况下，确保同时测试正向和反向查找。你还可以通过指定\
  \ `-t` 选项来查找特定的记录类型。例如，要查找域名的 MX 记录，你可能输入如下的命令：\n\n```\n $ host -t MX awl.com\n\
  awl.com mail is handled by 100 mailhost.uu.net.\nawl.com mail is handled by 10 oldtms702.pearsontc.com.\n\
  awl.com mail is handled by 20 oldtms701.pearsontc.com.\n```\n\n\n\n此测试显示 `awl.com`\
  \ 有三台邮件服务器——`oldtms702.pearsontc.com` 优先级最高（10），其次是 `oldtms701.pearsontc.com`（优先级\
  \ 20），以及 `mailhost.uu.net`（优先级 100）。如果你想测试特定的 DNS 服务器，可以在命令后追加其名称或 IP 地址，如下所示：\n\
  \n```\n $ host www.awl.com spruce\nUsing domain server:\nName: spruce.threeroomco.com\n\
  Address: 192.168.1.3\nAliases:\n\nwww.awl.com is a nickname for awl.com\nawl.com\
  \ has address 165.193.123.224\n```\n\n此输出与第一个命令的输出相同，但它确认了 `host` 使用了特定的 DNS 服务器进行查询。\n\
  \n你可以从 `host` 的帮助页（man page）中找到更多信息。你可能也想研究 `nslookup`，它具有类似的功能，但正在被 `host` 取代。\n\
  \n## 总结\n\n大多数拥有超过几台计算机的网络都可以从本地 DNS 服务器的存在中受益。此类服务器既可以为外部客户端服务（查找与网域内服务器名称关联的 IP\
  \ 地址），也可以为内部客户端服务（查找本地和远程系统的 IP 地址）。无论何种情况，你都必须配置一组基本选项，包括通用选项、根域名服务器规范，以及任何你希望服务器担任权威的区域的配置。如果你希望服务器提供你网域内计算机的名称，你需要在服务器的区域文件（zone\
  \ files）中进行设置。这些文件允许你链接主机名和 IP 地址，并将特定计算机绑定到区域内的特定功能，例如域的邮件服务器。\n\n# 第 19 章 推送邮件协议：SMTP\n\
  \n第 11 章“拉取式邮件协议：POP 和 IMAP”涵盖了处理邮件投递部分任务的服务器。POP、IMAP 以及其他拉取式邮件协议允许终端用户从中央邮件系统检索电子邮件。然而，邮件投递还有两个方面：将邮件投递到中央邮件服务器以及发送发出的邮件。事实是，这两项任务都由推送式邮件协议处理，之所以这样命名是因为发送者发起了推送传输。推送与拉取邮件协议之间的关系在第\
  \ 11 章的“拉取邮件在邮件投递系统中的位置”部分介绍。\n\n2002 年最常用的推送邮件协议是简单邮件传输协议（SMTP）。互联网上传输的绝大多数邮件都会经过一次\
  \ SMTP 传输。拉取式邮件服务器通常也运行 SMTP 推送邮件服务器，以便它们接受本地投递的邮件，以及接受来自本地系统发往外部目的地的邮件。由于由于原因，SMTP\
  \ 服务器对于任何处理邮件的 Linux 系统都至关重要。每个主要的 Linux 发行版都自带至少一个 SMTP 服务器，但默认服务器随发行版而异。本章涵盖了三个最常见的\
  \ Linux SMTP 服务器：sendmail、Exim 和 Postfix。本章还涵盖了一个经常与 SMTP 服务器配合使用的工具，用于在服务器计算机接收邮件后进行处理：Procmail。在深入探讨\
  \ SMTP 服务器配置细节之前，了解何时应该运行此类服务器、运行哪种服务器最好以及如何配置你的网域来处理邮件服务器至关重要。\n\n尽管许多网络只需对默认邮件服务器配置进行微调即可运行，但其他网络需要极其复杂的邮件服务器配置。如果你需要比单章能提供的更多信息，你可能想买一本关于你所选择的邮件服务器的书。示例包括\
  \ Costales 和 Allman 的 *Sendmail* (O'Reilly, 1997)、Hunt 的 *Linux Sendmail Administration*\
  \ (Sybex, 2001)、Hazel 的 *Exim: The Mail Transfer Agent* (O'Reilly, 2001)、Blum 的\
  \ *Postfix* (Sams, 2001)、Sill 的 *The qmail Handbook* (APress, 2001) 以及 McCarthy\
  \ 的 *The Procmail Companion* (Addison Wesley, 2001)。\n\n## 何时运行 SMTP 服务器\n\nSMTP\
  \ 服务器通常被称为邮件传输代理（MTA）。这些系统在邮件传输链中可能同时充当客户端和服务器。MTA 可以接受用户或另一个 MTA 发出的邮件。然后它可以将这些邮件存储在本地，并在必要时将其发送到另一个\
  \ MTA。Linux MTA 有几种可能的用途：\n\n*   **网络邮件接收者**：SMTP 服务器最明显的用途是作为网络的中央邮件服务器。此类系统可能支持通过\
  \ `pine` 或 `mutt` 等本地程序本地读取邮件，或者通过拉取式邮件协议远程检索。在这种情况下，SMTP 服务器的作用是接收邮件（来自本地网络或外部）。\n\
  *   **网络邮件中继**：本地网络上的用户经常需要向互联网上的其他人发送电子邮件。MTA 可以配置为转发邮件——即接受来自本地网络的邮件，临时保留并将其发送到远程系统。此类配置极其重要且是潜在的问题源，，因此本章将详细讨论了它们。\n\
  \n*   **本地邮件产生**：运行在邮件服务器本身上的程序可能会直接调用邮件服务器来发送邮件。这种配置不需要 MTA 接收任何入站邮件。许多 Linux 程序假设有一个本地\
  \ MTA 来担任此角色，尽管大多数此类程序可以重新配置为使用远程 SMTP 服务器作为中继。某些本地产生的邮件也可能是发送给本地用户的。例如，自动维护工具经常向本地计算机上的\
  \ `root` 账户发送电子邮件。\n\n这些功能如此重要，以至于大多数 Linux 发行版默认都会安装 SMTP 服务器。特别是本地到本地的邮件投递问题使得\
  \ Linux 系统上存在 MTA 变得非常理想。（理论上，你可以追踪所有尝试在本地发送邮件的项目，并对其进行重新配置或重写以使用远程 SMTP 服务器，但这并不总是实际的。）\n\
  \n\n\n\n大多数发行版的默认 SMTP 服务器配置已足以处理本地邮件投递。因此，问题在于你何时应该更改或至少检查该配置，以便计算机能够承担额外的职责，例如处理整个域域的邮件。在当今世界，电子邮件如此重要，以至于几乎没有网络可以脱离它。即使在小型办公室或家庭，电子邮件也是一种重要的通信媒介。运行自己的邮件服务器是提供电子邮件的一种方式，但并非唯一方法。外部电子邮件提供商并并不少见，你可能已经接入了外部供应商。如果你不想被在本地创建此类配置的困扰，那么此类供应商可能是接收小型域名的邮件的良好选择。尽管如此，运行自己的邮件服务器可以让你对它的运行方式有更多的控制权。例如，如果你运行自己的服务器，你可能更快速、更方便地添加、删除或修改用户。你还可以配置自己的服务器来阻止垃圾邮件、调整服务器接受的邮件大小配额等。运行自己的服务器可能比聘请外部人员完成这项工作更便宜。作为一个一般原则，如果你的网络托管的用户超过几个人，或者你有特别特殊的电子邮件需求，你可能希望运行自己的邮件服务器来处理大部分邮件需求。\n\
  \n## Linux 的 SMTP 服务器选项\n\nLinux 有许多 SMTP 服务器可用。最受欢迎的四个是：\n\n*   **Sendmail**——安装量最大的邮件服务器，也是大多数\
  \ Linux 发行版自带的服务器是 sendmail。这个包庞大且功能强大，许多程序都假设 sendmail 是可用的，因此其他包通常包含一个名为 `sendmail`\
  \ 的二进制文件以保持兼容性。Sendmail 使用复杂的配置文件格式，这是其他替代方案日益受欢迎的原因之一。sendmail 的主网站是 [`www.sendmail.org`](http://www.sendmail.org)。\n\
  *   **Exim**——。Exim 是一种邮件服务器，其设计目标是使用比 sendmail 更简单的配置文件格式，并支持对邮件进行各种复杂的过滤操作。它是\
  \ Debian 及其衍生发行版青睐的邮件服务器。Exim 的主网站是 [`www.exim.org`](http://www.exim.org)。\n*  \
  \ **Postfix**——。sendmail 和 Exim 都是单体式邮件服务器，这意味着它们在一个大型程序中执行大多数任务。Postfix 采用模块化方式进行设计，这意味着任务被拆分并由较小的程序处理。这在安全和速度上具有某些优势。这些优势以及\
  \ Postfix 更简单的配置文件是它优于 sendmail 的主要优点。Linux Mandrake 自带 Postfix 作为默认邮件服务器。你可以在 [`www.postfix.org`](http://www.postfix.org)\
  \ 了解更多关于 Postfix 的信息。\n*   **qmail**——。qmail 服务器和 Postfix 一样，是一种考虑到安全和性能模块化服务器。qmail\
  \ 的配置文件比 sendmail 简单，但该程序与 sendmail 的兼容性不如 Exim 或 Postfix，因此将 `sendmail` 替换为 `qmail`\
  \ 稍微困难一些。尽管在互联网邮件服务器的调查中它位列第二受欢迎的 UNIX 和 Linux 服务器，但它并不是任何 Linux 发行版的默认邮件服务器，因此我在这章中不详细讨论它。qmail\
  \ 的主网站是 [`www.qmail.org`](http://www.qmail.org)。\n\n尽管这些是最流行的 Linux 邮件服务器，但还有其他的，例如\
  \ Smail ([`www.gnu.org/software/smail/smail.html`](http://www.gnu.org/software/smail/smail.html))、Courier\
  \ ([`www.courier-mta.org`](http://www.courier-mta.org)) 和 OpenMail ([`www.openmail.com/cyc/om/00/`](http://www.openmail.com/cyc/om/00/))。这些大部分是开源的，但有些是商业性的。“四大”占据了\
  \ Linux 社区中关于邮件服务器大部分讨论。这四个程序都非常强大，能够处理大多数域名的邮件需求——即使是非常巨大的域名。\n\n特别是如果你是邮件服务器管理的新手，使用你发行版自带的任何\
  \ SMTP 服务器可能是最好的。许多发行版现在包含了多个 SMTP 服务器包。默认选项可能是最好的选择。\n\n如果你有特定的需求，特别是如果你有特殊的需求，你可能想要研究各种邮件服务器满足这些需求的能力。如有必要，你可以用另一个服务器替换标准的邮件服务器。由于\
  \ sendmail 的流行，这通常意味着用另一个服务器替换 `sendmail`。Exim 和 Postfix 通常作为无缝替换良好。尽管配置文件完全不同，但直接调用\
  \ sendmail 的程序通常在 Exim 和 Postfix 上运行良好良好，而且这两个程序的邮件队列格式默认与 sendmail 使用的格式相同——即 mbox\
  \ 格式，其中单个邮件“文件夹”中的所有邮件存储在单个文件中。将 `sendmail` 替换为 `qmail` 通常更复杂，因为 `qmail` 默认使用不同的邮件文件格式（maildir\
  \ 格式，使用一个将消息存储为单独文件的目录），因此你可能需要更改标准的 qmail 配置或替换你的邮件程序（包括你想运行的任何拉取邮件服务器，如[第 11 章。拉取邮件协议：POP\
  \ 和 IMAP]中所讨论）。\n\n## 邮件域管理\n\n许多邮件服务器必须接受来自外部系统的邮件。邮件发送到邮件服务器有两种主要方式：\n\n*   **直接寻址**——。邮件可能直接指向邮件服务器本身上的用户。例如，如果邮件服务器是\
  \ mail.threeroomco.com，邮件可能地址为 `jennie@mail.threeroomco.com`。这种配置非常简单，因为只需要在域名的\
  \ DNS 服务器中有一个普通的地址 (A) 记录，正如第 18 章“通过 DNS 管理域名”所描述。缺点是地址比可能的情况要长。\n*   **域名寻址**——。为了实现更短的电子邮件地址并支持备份邮件服务器，DNS\
  \ 支持邮件交换器 (MX) 记录。该记录告诉远程邮件服务器，如果邮件是给域内的用户，则将邮件发送到特定的计算机。例如，如果 threeroomco.com 域包含一个指向\
  \ mail.threeroomco.com 的 MX 记录，外部用户可以写邮件地址为 `jennie@threeroomco.com`，它将被定向到 mail.threeroomco.com。这种配置允许更短的电子邮件地址，并允许网络管理员设置备份邮件服务器（DNS\
  \ 支持多个 MX 记录）。尽管如此，这个系统的管理稍微复杂一些。\n\n\n\n第 18 章的“指定地址和别名”部分描述了如何配置 DNS 服务器的 MX 地址。如果你正在设置邮件服务器来处理某个域名，通常最好按照这种方式进行，因此你应该咨询你的\
  \ DNS 系统管理员，或者由你亲自处理，可以阅读第 18 章。简而言之，MX 记录看起来如下：\n\n```\n @               IN   \
  \   MX      10      mail.threeroomco.com.\n```\n\n此行出现在域名配置文件中，该文件通常以域名命名并存储在 `/var/named`\
  \ 中。开头的 符号（`@`）表示该行指的是域名本身。`IN` 列是互联网域名条目的标准部分。自然而然，`MX` 标识这是一个 MX 条目。`10` 是该条目的序列号。发送系统会首先尝试序列号最低的邮件服务器，如果第一台邮件服务器没有响应，则会按顺序向上尝试。这允许你设置多个邮件服务器，使用序列号较高的服务器作为备份邮件服务器。最后，条目以邮件服务器的完整地址结束，包括一个末尾的点（`.`）。\n\
  \n### 注意事项\n![NOTE](img/note.gif)\n\n尽管外部用户可能只需输入域名即可向你域名的邮件服务器发送邮件，但内部用户在邮件客户端程序中配置\
  \ SMTP 服务器名称时通常必须指定完整的主机。\n\n## 理解 SMTP 传输\n\n本章大部分内容依赖于对 SMTP 邮件投递某些关键方面的理解。特别是，理解封信头（envelope\
  \ headers）、消息头（message headers）和消息数据（message data）之间的区别非常重要。封信头是发送计算机在建立 SMTP 连接时提供的\
  \ From 和 To 地址。特别是 To 封头极其重要，因为接收系统依靠它来确定将邮件投递给谁。\n\n相比之下，消息头作为消息数据的一部分提供，消息数据还包含了发送给收件者的文本。在大多数真实的电子邮件中，消息头往往非常详尽。它们包含\
  \ `From:` 和 `To:` 头，但与封信的 `From` 和 `To` 头相比，这些头部的价值非常有限，因为它们很容易被伪造或更改。消息头还包括 `Received:`\
  \ 头（指示邮件所经过的路径）、在大多数邮件阅读器中显示的 `Subject:` 头，以及其他各种头部。\n\n### 注意事项\n![NOTE](img/note.gif)\n\
  \n在邮件文本流中，消息头名称后面总是跟着冒号，我在本章也遵循这一习惯。封信头名称后面通常不跟冒号，尽管这种习惯并非通用的。使用 maildir 格式的 SMTP\
  \ 服务器不会在消息的 `From` 和 `To` 名称下存储封信头，尽管它们在 SMTP 事务中仍被使用。某些服务器可以配置为将 `From` 和 `To`\
  \ 地址存储在消息的 `Received:` 头中，这可以是追踪问题时的有用工具。\n\n为了理解 SMTP 的工作原理，遵循一个 SMTP 事务可能会有所帮助。列表\
  \ 19.1 显示了这样一个通过 Telnet 连接手动输入的交换。（当然，绝大多数 SMTP 事务并不涉及手动 Telnet 连接。）\n\n**示例 19.1.\
  \ 一个示例的 SMTP 会话**\n\n```\n $ telnet louiswu.rodsbooks.com 25\nTrying 192.168.1.5...\n\
  Connected to louiswu.rodsbooks.com.\nEscape character is '^]'.\n220 louiswu ESMTP\
  \ Exim 3.12 #1 Wed, 30 Oct 2002 12:01:29 -0500\nHELO nessus.rodsbooks.com\n250 louiswu\
  \ Hello nessus.rodsbooks.com [192.168.1.3]\nMAIL FROM:<rodsmith@nessus.rodsbooks.com>\n\
  250 <rodsmith@nessus.rodsbooks.com> is syntactically correct\nRCPT TO:<rodsmith@louiswu.rodsbooks.com>\n\
  250 <rodsmith@louiswu.rodsbooks.com> is syntactically correct\nDATA\n354 Enter message,\
  \ ending with \".\" on a line by itself\nFrom: <rodsmith@nessus.rodsbooks.com>\n\
  To: <rodsmith@louiswu.rodsbooks.com>\nSubject: A Sample SMTP Session\n\n这里是消息的正文。\n\
  .\n250 OK id=15z87H-0000CX-00\nQUIT\n221 louiswu closing connection\nConnection\
  \ closed by foreign host.\n```\n\n大多数 SMTP 交换以客户端系统开始（通常是邮件阅读器程序或另一个 MTA，在列表 19.1\
  \ 的情况下是使用 `telnet` 的人类），客户端通过 `HELO` 或 `EHLO` 命令识别自己的身份。完成这些后，客户端使用 `MAIL FROM:`\
  \ 和 `RCPT TO:` 命令分别提供封信的 From 和 To 头。在每个这些命令之后，服务器 MTA 都会回复一个数字代码，指示它是否可以接受该命令。这些代码之后的文本是为人类生成的，以便在人类需要时查看。`DATA`\
  \ 命令指示发送者准备好输入消息主体。此，发送者输入消息头和消息文本。（消息头实际上是可选的；列表 19.1 中可以省略它们。）单独的一一行的点（`.`）表示消息结束，此时接收方\
  \ MTA 将投递邮件。\n\nSMTP 事务以及交换期间发送的某些特性对于某些配置选项非常重要。这些包括：\n\n*   **发送者识别**。发送系统通过多种方式识别自己。这些包括\
  \ `HELO` 命令、`MAIL FROM` 命令以及 `From:` 头。如果发送者实际上是从另一个站点转发邮件，`MAIL FROM` 和 `From:`\
  \ 头可能与实际地址不同。`HELO` 命令在实践中可能提供准确的信息，尽管在理论上它应该是准确的。另一个你应该注意的细节是，接收系统可以识别发送者的 IP 地址。在列表\
  \ 19.1 中，接收方会将此信息返回给发送者——`HELO` 命令的确认包含了发送者的 IP 地址。\n\n*   **封信头和消息头**。在列表 19.1\
  \ 中，封信头和消息头是匹配的，但并非总是如此。如果你收到过一封看起来不是发给你的邮件，情况就是这样——封信的 To 头是给你的，但消息的 `To:` 头不是。因为封信\
  \ To 头决定了投递，所以邮件到达了这里。如果你的邮件阅读器允许你查看完整头部，你可能会发现封信 To 头的信息。\n\n\n\n\n\n## 中止消息的选项\n\
  接收端 `SMTP` 服务器可以在传输过程中的任何阶段拒绝交付，从响应初始连接尝试，到发送者完成数据输入后交付消息。大多数消息传递和中继控制是在发送者发出 `RCPT\
  \ TO:` 命令后起的，但某些控制可能在此之前生效。如果接收者在 `RCPT TO:` 命令之前中止了传输，某些发送者会重新尝试交付，这可能导致重复尝试浪费网络带宽。如果发送者的消息异常长，在\
  \ `DATA` 命令后中止可能会浪费带宽。\n\n## 服务器提供的信息投递\n如列表 19.1 所示的交换揭示了关于服务器的一些信息，但并未显示其他信息。例如，示例中的服务器清楚地将自己标识为\
  \ Exim 3.12。虽然很难隐藏正在使用的 `MTA` 软件包，但某些程序允许你隐藏版本号，这在服务器发现安全漏洞时可以是一个实用的安全预防措施——你不希望不必要地公开自己的漏洞。列表\
  \ 19.1 中的 Exim 配置对 `MAIL FROM:` 和 `RCPT TO:` 命令响应 `250` 代码和一条相当模糊的 `is syntactically\
  \ correct`（语法正确）消息。某些服务器可以配置为在指定用户不存在时在 `RCPT TO:` 之后拒绝邮件。这可能会为破解者提供有用的信息——通过使用此或其他邮件服务器命令尝试许多名称，破解者可以定位账户名称。示例中的\
  \ Exim 没有提供此类信息。另一方面，这可能会导致问题，因为邮件服务器必须处理并退回发送给不存在用户的邮件。\n\n## SMTP 服务器配置选项\n接下来的章节描述了你可能想在邮件服务器中配置的各种功能。我没有在每个章节中重复描述这些选项的含义，而是在这里统一描述一次。\n\
  \n## 地址伪装 (Address Masquerading)\n邮件服务器最常见的配置更改之一是地址伪装——更改邮件服务器声称的主机名。通常，大多数 `SMTP`\
  \ 服务器安装使用基础网络配置中设置的主机名，以及 `hostname` 命令返回的主机名。`MTA` 在联系其他邮件服务器时会在 `HELO` 问候中使用此主机名，并在邮件尚未包含该信息时，在\
  \ `MAIL FROM` 命令和 From: 邮件头中使用它。服务器还会通过此名称向连接的计算机标识自己，如列表 19.1 中的 `220` 响应。\n\n\
  这种方法在大多数情况下运行良好，但有时你可能需要使用另一个名称。例如，假设你的邮件服务器名为 franklin.threeroomco.com。你可能希望发出的邮件永远不要标识为来自这台计算机，而是来自\
  \ threeroomco.com 域名。（如果你出于美观考虑使用了独立的入出站邮件服务器，或者为了让你更方便地更改邮件服务器而不影响发送到默认地址的回复，这可能很重要）。你可能还想更改防火墙网络上计算机使用的主机名，以便回执消息进入外部可访问的系统。解决方案是使用地址伪装让\
  \ franklin.threeroomco.com 宣布自己为 threeroomco.com。本章讨论的所有邮件服务器都可以执行地址伪装，但细节有所不同。某些服务器提供了广泛的选项，让你精细调整哪些命令、问候和头部使用新名称，而另一些提供的选项较少。某些服务器相对容易修改现有的邮件头部以反映新地址，而另一些则不支持此类操作。\n\
  \n### 注意\n![注意](img/note.gif)\n一些邮件管理员看低修改邮件头的做法，因为这些头部本应提供一条返回到源系统的清晰路径。另一些邮件管理员则认为，重写邮件头部的能力至关重要，以避免邮件跨越防火墙等情况时可能产生的问题。如果你熟悉邮件管理，最好的方法可能是尽可能少地伪装，仅在发现有问题时才添加这些功能。如果使用不当，伪装可能会导致混淆甚至邮件被退回。\n\
  \n## 接收本地邮件 (Accepting Mail as Local)\n地址伪装的另一面是告诉邮件服务器哪些地址视为本地。例如，你可能运行一个名为 franklin.threeroomco.com\
  \ 的邮件服务器。大多数 `SMTP` 服务器安装的默认配置是接受发送给 franklin.threeroomco.com 用户的邮件。但如果你的域名设置了指向该系统的\
  \ `MX` 记录，它也会看到发送给 threeroomco.com 用户的邮件。此外，你可能想配置邮件服务器接受发送给完全不同的主机名或域名的邮件。也许公司最近扩张并更改了名称，所以你想将\
  \ fourroomco.com 添加到邮件服务器接受并本地投递的域名列表中。\n\n本章涵盖的所有邮件服务器都允许你指定服务器将哪些主机名解释为本地。当你配置此类列表时，服务器会接受发送给这些地址用户的邮件，并将消息放入用户的本地邮箱（或者如果服务器配置为将用户邮件转发到另一个系统，则转发邮件）。当然，这些配置的细节在服务器之间有所不同。\n\
  \n## 中继邮件 (Relaying Mail)\n今天邮件配置中最复杂且可能最危险的方面之一是正确配置邮件服务器处理邮件中继。邮件中继系统接受从一台计算机的邮件并将其交付到另一台计算机。大多数网络至少使用一个邮件中继系统，因为网络连接有时不可靠。如果客户端尝试直接向接收者交付邮件但连接失败，邮件客户端程序将继续运行以定期尝试重新交付。然而，配置为中继的\
  \ `SMTP` 服务器可以以高可靠性从本地网络接收邮件，然后保留邮件直到网络状况允许其交付。\n\n不幸的是，中继配置很容易被滥用。如果 `MTA` 对其将中继的系统过于宽松，服务器可能会被第三方滥用发送垃圾邮件（未经请求的垃圾邮件）。因此，你必须找到合适的平衡点，在保护服务器免受不受欢迎的用户的同时，允许合法用户将服务器作为中继。正确的配置取决于邮件服务器程序在你的网络中的角色，而这在很大取决于你的网络结构。\n\
  \n\n\n\n有时，你可能需要为系统配置第三方中继。这允许外部系统将你的系统作为邮件中继站。这通常是不受欢迎的，但在某些情况下，你可能希望允许这样做。例如，你可能想让出差的员工使用你自有网络上的邮件服务器来中继邮件。许多通常用于允许本地中继的\
  \ `MTA` 中继选项都可用于启用第三方中继。你可以像输入本地地址或名称一样，在配置选项中输入第三方的 `IP` 地址、域名或类似的内容。\n\n### 注意事项\n\
  \n![NOTE](img/note.gif)\n\n出差的用户可能特别棘手，因为这类用户频繁使用具有庞大 `IP` 地址池的拨号 ISP。你可能不想启用这些所有\
  \ `IP` 地址进行重中继，因为使用相同 `ISP` 的垃圾邮件发送者可能会发现你的系统并将其作为开放中继使用。在这种情况下，通常让出差用户使用 ISP 的出站邮件服务器会更好。另一个选项是使用\
  \ `SMTP-after-POP` 配置，在该配置中，`POP` 服务器可以告诉 `SMTP` 服务器在特定 `IP` 地址成功检查或检索邮件后的一段时间内接受来自该地址的中继请求。这允许远程用户中继邮件，但前提是在访问\
  \ `POP` 服务器之后。还有一种选择是让旅行者使用 `SSH` 登录到本地系统，或者为出站的 `SMTP` 连接配置 `SSH` 隧道。\n\n你可能还想配置\
  \ `SMTP` 服务器通过另一个 `SMTP` 服务器递送全部或部分邮件。例如，你可能希望让本地工作站通过部门邮件服务器发送邮件，尽管工作站的 MTA 具备直接递送的能力，以便更好地地跟踪电子邮件。使用拨号连接的系统可能需要使用中继才能发送邮件，因为某些\
  \ ISP 将其拨号地址放在反垃圾邮件列表中，这些列表会被其他用于阻止直接 `SMTP` 连接。在这样的网络上使用中继可以实现更可靠的邮件传输。\n\n###\
  \ 提示\n\n![TIP](img/tip.gif)\n\n如果你正在配置一个具有多个瞬态互联网连接的系统（例如在不同 ISP 下使用的笔记本电脑），使用邮件中继可能会不方便。许多\
  \ ISP 拒绝来自其自身网络以外系统的中继，因此这种方法仅对一个 `ISP` 有效。你可以通过创建两个 `SMTP` 服务器配置文件来解决这个问题，每个 `ISP`\
  \ 使用一个，并使用不同于标准配置文件的名称。然后你可以在你的 `PPP` 拨号脚本中添加行来复制相应的配置文件并重启 `SMTP` 服务器。例如，如果你正在使用\
  \ `sendmail`，你可以将文件命名为 `sendmail-isp1.cf` 和 `sendmail-isp2.cf`，并在 `PPP` 拨号脚本中将其中一个复制到\
  \ `sendmail.cf`。\n\n## 反垃圾邮件配置\n\n在电子邮件发明时，它被认为是一种实用的个人通信手段，并且现在依然如此。遗憾的是，广告者发现电子邮件是与潜在客户交流的一种廉价方式。我之所以说“遗憾的是”，是因为两个原因：首先，如今的大部分邮件广告都是最低水平的——快速发富的骗局、色情网站广告以及毫无价值的产品。其次，邮件广告正在堵塞全球各地的邮件服务器，而且这种形式的广告所可能造成的潜在严重危害仍然巨大。发送邮件非常便宜，但从使用的磁盘空间、收件者阅读甚至仅仅删除邮件的时间来看，接收邮件的成本更高。如果垃圾邮件在比目前大量使用它的声誉不佳的企业中更流行，电子邮件将很快变得完全毫无用，因为我们的收件箱每天会被成千上万封毫无价值的邮件塞满。由于对垃圾邮件的担心，邮件管理员经常采取措施阻止它。这些阻止发生在两个层面：阻止垃圾邮件进入邮件服务器，以及阻止它出去。\n\
  \n### 阻止入垃圾邮件\n\n你对垃圾邮件的个人担心可能主要针对你系统的垃圾邮件，因为这些对你来说是最明显的。控制此类垃圾邮件有几种方法，较流行的方法包括：\n\
  \n*   **邮件服务器模式匹配拦截**—— 大多数邮件服务器提供某种方法来阻止符合特定标准的邮件，例如来自特定用户或网络的邮件。你可以利用这些功能阻止来自已知垃圾邮件发送者或只产生垃圾邮件的\
  \ ISP 的入站邮件。然而，除非检查这些拦截，否则可能会过头——例如，你可能会屏蔽一个 `ISP`，但如果该 `ISP` 改进了行为，你就会无故地屏蔽其合法用户。事实上，即使是已知托管垃圾邮件发送者的\
  \ `ISP` 可能也托管了合法用户。其他模式匹配可能不太引起问题，因为它们更具体。\n\n*   **黑洞列表**—— 现在有几个组织发布 `IP` 地址列表，你可能想将其作为阻止邮件的依据。这些列表上的\
  \ `IP` 地址可能已知发送过垃圾邮件，可能是易被垃圾邮件发送者滥用的开放中继，可能与 `PPP` 拨号账户关联（这些账户通常应通过其 ISP 的邮件服务器中继邮件），或者作为直接发送邮件者在其他方面可疑。大多数邮件服务器都可以配置为使用一个或多个此类反垃圾邮件黑洞列表。表\
  \ 19.1 总结了此类服务，但该列表是不完整的。\n\n*   **Post-MTA 模式匹配**——下一节描述的 Procmail 系统“使用 Procmail\
  \ 过滤器”可以执行大多数邮件服务器不支持的更复杂的模式匹配。事实上，一些复杂的反垃圾邮件系统，例如 SpamBouncer ([`www.spambouncer.org`](http://www.spambouncer.org))\
  \ 是构建在 Procmail 之上的。你可以使用这样的系统，或者自己设计一个 Procmail 过滤器。\n\n*   **分布式模式匹配**—— 一种相当新的反垃圾邮件工具是\
  \ Vipul's Razor ([`razor.sourceforge.net`](http://razor.sourceforge.net))。该系统依赖于\
  \ Vipul's Razor 服务器维护的垃圾邮件安全哈希算法 (SHA) 代码数据库识别的垃圾邮件目录。你可以配置你的邮件系统对入站邮件计算 SHA 代码，如果匹配\
  \ Vipul's Razor 的代码，你就可以相当确定它是垃圾邮件了。\n\n\n\n\n通常情况下，你只需使用一或两种方法就可以拦截大量的垃圾邮件，例如基于\
  \ `MTA` 的模式匹配或单个黑洞列表（blackhole list）。你可能采取的任何反垃圾邮件措施面临的问题之一是，使用现今技术的计算机程序无法 100%\
  \ 确定地判断某条消息是否为垃圾邮件。因此，所有的垃圾邮件拦截方法都依赖某种程度的概括，例如经常出现在垃圾邮件标头中的模式，或者发送邮件的 `IP` 地址。这些概括处理通常能捕获垃圾邮件，但也可能误删合法电子邮件。这种偶尔的\
  \ `false positives`（误报）对你来说可能是接受的，也可能不是。为了最大限度地减少误报风险，你可以使用符合非常窄标准的简单自定义模式匹配规则。在黑洞列表中，`RBL`\
  \ 和 `RSS` 产生大量误报的可能性最低。由邮件滥用防护系统（MAPS）运行的黑洞列表——`RBL`、`RSS` 和 `DUL`——以订阅制提供，但对爱好者网站除外。\n\
  \n#### 表 19.1. 常见反垃圾邮件黑洞列表\n\n| 列表名称 | URL | 服务器地址 | 描述 |\n| --- | --- | --- | ---\
  \ |\n| 拨号列表 (`DUL`) | [`mailabuse.org/dul/`](http://mailabuse.org/dul/) | `dialups.mail-abuse.org`\
  \ | 这是一个与 ISP 拨号 `PPP` 连接相关的 `IP` 地址列表。其原理是此类用户不应该直接发送邮件，因为他们可以使用 ISP 的邮件中继，但垃圾邮件发送者经常会绕过\
  \ ISP 的中继。 |\n| 实时黑洞列表 (`RBL`) | [`www.mail-abuse.org/rbl/`](http://www.mail-abuse.org/rbl/)\
  \ | `blackholes.mail-abuse.org` | 此列表包括已知发送过垃圾邮件、以各种方式支持垃圾邮件发送者、或中继了垃圾邮件且未纠正问题的系统。\
  \ |\n| 中继垃圾邮件停止器 (`RSS`) | [`www.mail-abuse.org/rss/`](http://www.mail-abuse.org/rss/)\
  \ | `relays.mail-abuse.org` | 此列表包含记录为中继过垃圾邮件的系统，并且通过半自动化测试显示为开放中继的系统。 |\n| 开放中继数据库\
  \ (`ORDB`) | [`www.ordb.org`](http://www.ordb.org) | `relays.ordb.org` | 此列表与 `RSS`\
  \ 类似，但添加主机的标准较宽松。因此，`ORDB` 拦截了更多垃圾邮件，但也误拦截了更多合法电子邮件。 |\n| RFC Ignorant | [`www.rfc-ignorant.org`](http://www.rfc-ignorant.org)\
  \ | `各种；详见网站` | RFC Ignorant 组织维护了几个忽略一个或多个请求意见（RFC）互联网标准的系统黑洞列表。垃圾邮件发送者经常使用此类配置不当的系统，因此将其作为反垃圾邮件标准的依据。\
  \ |\n\n### 如何避免成为垃圾源\n\n尽管你可能最担心拦截传入的垃圾邮件，但你应该至少同样关注防止你的系统被用于传输垃圾邮件。在大型网络中，你可能需要小心管理你自己的用户，以确保他们不会产生垃圾邮件。这可能涉及创建一个禁止发送垃圾邮件的`可接受使用政策\
  \ (AUP)`，并确保你的用户了解这一点。某些用户可能没有意识到垃圾邮件是多么不受待的。\n\n特别是在小型网络或安装了邮件服务器的个人工作站上，更严重的问题是配置你的系统使其不成为`open\
  \ relay`（开放中继）——一个被配置为将互联网上任何系统的邮件中继到互联网上任何其他系统的计算机。（即使在系统子集之间中继也可能有问题，如果这些子集足够大。）后续关于单个\
  \ `SMTP` 服务器的讨论大部分涉及中继配置。你可能需要你的系统为某些系统提供中继，但在创建此配置时，重要的是不要让你的系统开放得太宽。\n\n测试系统是否为开放中继的一种方法是从`from\
  \ that system` `Telnet` 连接到 [relay-test.mail-abuse.org](http://www.relay-test-mail-abuse.org)。这样做会导致到你自己的邮件服务器建立反向连接。你将看到测试的进展，随后将是一个关于你的系统是或不是开放中继的声明。尽管这个测试非常有用，但它并不是绝对的；某些配置可以欺骗该测试，但这是一个很好的开始点。\n\
  \n要了解更多关于反中继配置的信息，包括如何配置各种邮件服务器的提示，请查看 MAPS 传输安全倡议 (`TSI`) 网页：[`mail-abuse.org/tsi/`](http://mail-abuse.org/tsi/)。\n\
  \n## Sendmail 配置\n\n根据对 `MTA` 使用的调查，2002 年 Sendmail 是世界上最流行的 `MTA`。它也是大多数 Linux\
  \ 发行版的默认 `MTA`，包括 Caldera、Red Hat、Slackware、SuSE 和 TurboLinux。Debian 和 Mandrake\
  \ 虽然默认安装了其他 `SMTP` 服务器，但也提供了使用 sendmail 的选项。在我写这里时，版本 8.12.2 是版本，但某些 Linux 发行版仍带有较旧的\
  \ `8.11.x` 或更早版本。\n\nSendmail 使用了一种相当晦涩的配置文件格式，但存在一些工具可以通过将更简单的文件格式编译为 sendmail\
  \ 实际读取的格式来配置该软件。知道如何这样做对于配置 sendmail 至关重要。除了配置文件本身，本节还涵盖了 sendmail 配置的几个特定领域：地址伪装（address\
  \ masquerading）、接收传入邮件和中继配置。\n\n## Sendmail 的配置文件\n\nSendmail 的主配置文件名为 `sendmail.cf`，通常位于\
  \ `/etc`。然而，这个文件很难直接编辑，因为有许多选项，它们使用了非常不便于记忆的名称，并且格式难以阅读。\n\n为了绕过直接编辑 `sendmail.cf`\
  \ 带来的困难，大多数发行版使用 `m4` 宏处理工具从一个更简单且更易理解的文件创建 `sendmail.cf` 文件。`m4` 源文件的文件名通常以 `.mc`\
  \ 结尾，但具体名称因发行版而而异。例如，在 Red Hat 中是 `/etc/sendmail.mc`，在 Slackware 中是 `/usr/src/sendmail/cf/cf/linux.smtp.mc`，在\
  \ SuSE 中是 `/etc/mail/linux.mc`。无论名称是什么，`m4` 源文件都比它们生成的 `.cf` 文件短得多且更易读。例如，在 SuSE\
  \ 7.1 中，`sendmail.cf` 文件长 1669 行，而创建它的 `linux.mc` 文件只有 221 行——而且其中大部分行都是注释（以 `dnl`\
  \ 开头的行）。一个工作的 sendmail `m4` 文件可以少于 50 行。\n\n要从 `m4` 文件创建 `sendmail.cf` 文件，你必须运行\
  \ `m4` 命令，使用输入重定向向其提供 `m4` 配置文件，并使用输出重定向将输出发送文件。例如，你可能在 SuSE Linux 上使用以下命令：\n\n\
  ```\n # m4 < /etc/mail/linux.mc > /etc/sendmail.cf\n```\n\n### 注意\n\n![注意](img/note.gif)\n\
  \n\n\n\n\n某些发行版要求你在将 `m4` 源文件编译为可运行的 `sendmail.cf` 文件之前，先安装一个单独的支持文件包。例如，Red Hat\
  \ 在重新构建 sendmail 配置文件之前需要 `sendmail-cf` 软件包。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n请确保不要覆盖正在运行的 `sendmail.cf` 文件。通常的做法是将此文件以及你的原始 `m4` 源文件备份到另一个目录的某个位置。这样，一旦出现问题且你似乎无法让\
  \ sendmail 重新工作，你就可以恢复原始文件。\n\n在重新构建配置文件后，你必须重启 sendmail 才能使你的更改生效。大多数发行版通过 SysV\
  \ 脚本启动 sendmail，因此你应该通过脚本的 `restart` 选项重启 sendmail。\n\n`m4` 配置文件中的大多数选项采用以下形式：\n\
  \n```\n FEATURE-NAME(` option1'[,`option2'[,...])\n```\n\n`FEATURE-NAME` 是一个具有一定描述性的名称，例如\
  \ `define` 或 `MASQUERADE_AS`。选项（`option1`、`option2` 等）可以是主机名、sendmail 特定的选项名称（如\
  \ `always_add_domain` 等）。某些功能定义可以省略单引号，但大多数都使用了它们。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n当出现时，环绕选项的单引号是不寻常的，因为它们并不相同。任何选项中的起始引号是一个反引号字符（`` ` ``），它位于大多数键盘上数字 `1` 键左侧的键上。结束引号是一个普通的单引号字符，它位于大多数键盘上分号（`;`）键右侧的键上。如果你使用两个普通的单引号（就像在大多数配置文件中使用的那样），`m4`\
  \ 将无法处理该文件，或者 sendmail 配置文件将无法按预期工作。\n\n除了 `sendmail.cf` 文件和创建它的 `m4` 文件外，sendmail\
  \ 还依赖于其他文件。其中几个较重要的文件包括：\n\n* `access.db`。这是一个从纯文本 `access` 文件派生出的二进制文件。该文件控制哪些计算机可以以什么方式访问\
  \ sendmail。稍后描述的 sendmail 中继配置通常依赖于该文件的内容。如果 `access` 自自上次 `access.db` 构建以来发生了变化，大多数\
  \ sendmail 启动脚本会运行 `makemap` 来自动生成 `access.db`。\n* `aliases.db`。这是另一个从命名类似的文本文件（`aliases`）派生出的二进制文件。它定义了邮件别名——即被视为等等的名称。例如，大多数发行版将\
  \ `postmaster` 设置为 `root` 的别名，你可能想为 `root` 设置一个别名，将 `root` 的邮件重定向到你的普通用户账户。与 `access.db`一样，许多\
  \ sendmail 启动脚本会自动从 `aliases` 生成 `aliases.db`。\n\n你可能会在 `/etc` 或 `/etc/mail` 中找到这些文件，以及其他控制\
  \ sendmail 运行细节的数据库文件。这些文件被 `m4` 文件和 `sendmail.cf` 引用\n\n## Sendmail 地址伪装 (Masquerading)\n\
  \n如果你希望你的 SMTP 服务器使用其常规主机名以外的名称宣告自己，你必须配置 sendmail 以执行某种形式的地址伪装，如前所述。你可以在 `m4` 配置文件中设置两行来激活地址伪装的两个不同方面：\n\
  \n```\n MASQUERADE_AS(`desired-address')\nFEATURE(masquerade_envelope)\n```\n\n\
  `MASQUERADE_AS` 功能启用了最基础的伪装，它仅在用户的邮件程序没有指定主机名时，更改邮件标头 `From:` 字段中使用的地址。由于许多邮件程序都会设置此字段，此选项作为备用方案最为有用，以防用户的邮件程序没有完全或正确地配置。`FEATURE\
  \ (masquerade_envelope)` 行具有的作用更多，因为即使发送者的邮件程序设置了此选项，它也会积极更改 `From:` 标头。\n\n如果你希望伪装仅适用于来自某些域的用户邮件，可以使用额外的几行代码来限制这些伪装功能的应用：\n\
  \n```\n MASQUERADE_DOMAIN(`source-domain')\nFEATURE(`limited_masquerade')\n```\n\
  \n这些选项告诉 sendmail 将其伪装限制在指定的 `source-domain` 范围地址。如果你的系统充当两个域的邮件服务器，这种配置最可能有帮助；你可以设置让它为发送的每条消息伪装为相应域内的一个系统。\n\
  \n## 配置 Sendmail 接收邮件\n\n当远程服务器向你的系统发送邮件时，邮件是发送给特定计算机上的特定用户的。为了接受本地邮件的投递，sendmail\
  \ 必须能够识别所有本地地址，如前所述。sendmail 允许你将邮件服务器的所有名称添加到本地主机名文件中，如果你为其配置了 MX 记录，则包括原始域名。这些文件在不同的发行版中名称不同，这些名称在带有\
  \ sendmail `m4` 软件包的文件中设置。在 Red Hat 中，它是 `/etc/mail/local-host-names`；在 SuSE 中，它是\
  \ `/etc/sendmail.cw`。如果你找不到该文件，尝试在 `sendmail.cf` 中搜索以 `Fw` 开头的行。该行设置了本地主机名文件的名称。无论名称是什么，该文件由系列行组成，每行包含一个计算机将认为是本地的主机名。不过，sendmail\
  \ 会忽略井号（`#`）开头的行。你可以省略计算机常规主机名，尽管包含它也没有害。\n\n## Sendmail 中继配置\n\n如前所述，中继配置在建立邮件服务器时至关重要。你必须能够配置\
  \ sendmail 来中继它自己的邮件、可能来自本地网络的邮件，甚至可能根据情况来自远程网络的邮件，而不会将系统变成可能被垃圾邮件者滥用的系统。此外，你可能想或需要配置系统通过另一个系统作为中继发送输出邮件。直率地说，sendmail\
  \ 提供了许多邮件中继选项。\n\n### 配置 Sendmail 中继邮件\n\n一种常见的邮件中继配置是让邮件服务器为本地网络转发邮件。其想法是使用邮件服务器中继邮件，在出现网络问题时将其临时存储。然后你将其他本地系统的邮件程序指向该邮件服务器。\n\
  \n默认情况下，大多数 sendmail 安装不会作为邮件中继工作。如果你尝试这样做，邮件服务器将拒绝中继消息。大多数邮件客户端会通知你收到了来自邮件服务器的“拒绝中继\
  \ (relaying denied)”响应。如果你想让它作为中继，sendmail 允许你激活不同的中继选项。你可以在 `FEATURE` 行中包含以下任何选项：\n\
  \n* `relay_entire_domain`。使用此选项时，sendmail 接受源自自身域或发送到本地域内任何系统的中继邮件。sendmail 使用 DNS\
  \ 根据 `IP` 地址验证发送者的域。这可以作为一种快速方便的方法来启用中继。\n* `relay_local_from`。此选项告诉 sendmail 接受任何使用\
  \ sendmail 本地域 `From:` 地址的消息的中继。这与前一个选项的区别在于，后者仅使用 `From:` 标头中的“声称”地址，而该地址很容易伪造。因此，从反垃圾邮件的角度来看，这个选项是一个糟糕的选项。\n\
  \n\n\n\n\n- `relay_based_on_MX` - 此选项告诉 sendmail，如果发送者所在的域名将你的 sendmail 系统列为邮件交换器（MX），则接受中继。这是一种控制中继的快速且方便的方法，因为如果你想添加域名，不需要修改\
  \ sendmail 配置；只需要修改 `DNS` 记录。缺点是，控制自己域的垃圾邮件发送者可以轻松调整他们的 `MX` 记录并劫持你的邮件服务器。\n\n-\
  \ `relay_hosts_only` - 如果你使用此选项，sendmail 将使用访问数据库（后文将描述）。只有此数据库中列出的单独主机允许进行中继。这可能是将中继限制为任意计算机集的好方法。\n\
  \n- `access_db` - 许多 sendmail 配置默认使用此选项。与 `relay_hosts_only` 类似，它让 sendmail 使用访问数据库。尽管如此，此选项对数据库的解释要松散一些；你可以使用此选项在数据库中列出整个域名。\n\
  \n- 最后一个选项 `promiscuous_relay` 应该不顾一切避免。此功能告诉 sendmail 接受*任何*中继请求。这种开放的中继配置几乎肯定会被垃圾邮件发送者发现并滥用。\n\
  \n中继配置行的示例例如：\n\n```\nFEATURE(`access_db')\n```\n\n此选项存在于许多安装的默认 `m4` 配置文件中，但它实际上并没有启用实际的中继，因为默认的\
  \ `access.db` 文件仅允许 localhost 中继，正如后文描述的。如果 `access_db` 选项处于激活状态，sendmail 在启动时会读取\
  \ `access.db` 文件。如前，该文件通常存储在 `/etc` 或 `/etc/mail` 中，并从一个名为 `access` 的文件构建的。一个典型的\
  \ `access` 文件看起来如下：\n\n```\n## Allow relaying from localhost...\nlocalhost.localdomain\
  \       RELAY\nlocalhost                   RELAY\n127.0.0.1                   RELAY\n\
  ## Relay for the local network\n192.168.99                  RELAY\n```\n\n前三个条目在大多数配置中都存在；它们告诉\
  \ sendmail 接受来自 localhost 计算机（即 sendmail 本身）的邮件进行中继。某些本地邮件程序依赖于此类配置。最后一个条目告诉 sendmail\
  \ 中继任何来自 `192.168.99.0/24` 网络的邮件。你也可以提供主机名或域名而不是 `IP` 地址，但 `IP` 地址稍难被伪造，因此尽可能使用它们是优的。\n\
  \n上述所有示例都以 `RELAY` 结尾，但你还有其他可以使用的选项：\n\n- `OK` - 此选项告诉 sendmail 即使其他规则会导致邮件被拒绝，也接受该邮件进行本地投递。\n\
  \n- `RELAY` - 正如你猜想的，这会导致 sendmail 中继源自指定主机或域名的邮件。它同样会导致发送*给*这些主机或域名的邮件也被中继。\n\n\
  - `REJECT` - 如果你想阻止来自或发往给定主机或域名的邮件，可以使用此选项，它会拒绝邮件并生成退信邮件。\n\n- `DISCARD` - 此选项的工作方式与\
  \ `REJECT` 非常相似，但不会生成退信邮件。\n\n- `nnn text` - 这是另一个类似于 `REJECT` 的选项，但它会生成错误代码 `nnn`\
  \ 以及作为 `text` 的退信邮件。\n\n一旦你编辑了 `access` 文件，就可以使用 `makemap` 命令从其创建二进制数据库文件，如下：\n\n\
  ```\n# makemap hash /etc/mail/access.db < /etc/mail/access\n```\n\n许多 sendmail 安装在启动脚本中包含此类命令，因此这一步可能并非绝对必要。无论如何，你都应该重启\
  \ sendmail 使其重新读取访问文件。\n\n### 配置 Sendmail 通过中继发送\n\n上一节处理了将 sendmail 用作邮件中继的问题。不过，中继配置还有你可能想要考虑的方面：让\
  \ sendmail 使用另一个系统作为邮件中继。如果你运行小型网络甚至单台计算机，并且可能或需要使用你 ISP 的邮件服务器作为中继。虽然 Linux 和 sendmail\
  \ 能够本地队列邮件并直接投递，但某些 ISP 要求你使用它们自己的邮件服务器处理出的邮件。某些邮件服务器拒绝直接从列在某些反垃圾邮件列表上的拨号 `IP` 地址发送的邮件，因此拨号用户可能需要使用这种方法来可靠发送邮件。此外，某些\
  \ Linux 系统（特别是笔记本电脑）大部分时间可能是关闭状态，因此你最好将它们配置为使用另一个系统作为邮件中继。\n\n大多数 Linux 发行版的 sendmail\
  \ 配置不使用出的邮件中继，但你可以通过向你的 `m4` 配置文件添加一行来使用它：\n\n```\nFEATURE(`nullclient`, `outgoing.mail.relay')\n\
  ```\n\n在此示例中，`outgoing.mail.relay` 是要中继你邮件的计算机的主机名。重新构建 `sendmail.cf` 并重启服务器后，它应该通过指定的出的邮件服务器中继所有邮件。在此更改后，确保邮件已正确投递。\n\
  \n## Sendmail 反垃圾配置\n\n有几种方法可以配置 sendmail 来拦截垃圾邮件并防止未经授权的中继。一种简单的反垃圾配置是使用 `access`\
  \ 文件及其二进制等效文件 `access.db`，根据源主机名或域名拦截垃圾邮件。如果你如前所述，将主机名、域名或 `IP` 地址与 `REJECT` 或 `DISCARD`\
  \ 操作关联起来，sendmail 将拦截来自该地址的所有邮件。如果你定期从某些源站接收垃圾邮件，这是一个有效的工具，但你应当对使用这种方法要保持谨慎；如果垃圾邮件发送者恰好滥用了流行的\
  \ `ISP`，你可能会轻易拦截大量合法邮件。\n\n使用 sendmail 拦截入站垃圾邮件的另一种方法是使用一个或多个黑洞列表。你可以在 `m4` 文件中使用\
  \ `dnsbl` 功能来实现此，如下：\n\n```\nFEATURE(dnsbl, `blackholes.mail-abuse.org`, `Rejected\
  \ - see \\ http://www.mail-abuse.org/rbl/')\n```\n\n此行导致 sendmail 使用 MAPS `RBL`。将\
  \ `FEATURE` 的第二个选项更改为表 19.1 中“服务器地址”列列出的值以使用另一个黑洞列表。最后一个参数是一个包含在退信邮件中的字符串。你应该使用它将退信接收者指向相应的黑洞列表网站，这样如果合法邮件被误拦截，发送者可以采取措施纠正问题。如果你喜欢，可以指定多个黑洞列表。\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n黑洞列表的使用随 sendmail 8.10 巨大变化，此讨论适用于该及更高版本。之前的版本黑洞规定要简单得多。关于这一点，请咨询\
  \ `http://mail-abuse.org/rbl/usage.html` 获取更多信息。\n\n使用 sendmail 防止未经授权的中继是一个配置 sendmail\
  \ 以最严格方式进行中继的问题。通常简单的方法是在 `access` 中列出单独的 `IP` 地址或 `IP` 地址块，但在某些情况下，其他中继选项可能有用。\n\
  \n\n\n\n\n如果你使用的 `sendmail` 版本早于 8.9.0，它可能被配置为默认允许中继。你应该升级到更高版本的 `sendmail`，或者参考\
  \ [`mail-abuse.org/tsi/ar-fix.html#sendmail_8`](http://mail-abuse.org/tsi/ar-fix.html#sendmail_8)\
  \ 获取如何重新配置 `sendmail` 以不进行泛中继的信息。8.8.4 之前的版本不容易被重新配置以防止未经授权的中继；它们几乎应该升级。\n\n# Exim\
  \ 基础配置\n\n作为 Debian GNU/Linux 及其衍生版本的默认邮件服务器，Exim 在 Linux 世界中相当流行。你也可以在其他发行版中使用\
  \ Exim，事实上，它随 Red Hat 的 PowerTools 扩展程序一起发布，因此在 Red Hat 及相关发行版上安装非常容易。与 `sendmail`\
  \ 一样，Exim 是一个单体程序，但 Exim 配置文件的格式相对简单。Exim 能够实现许多与 `sendmail` 相同的功能，本节描述了其中一些功能，例如地址伪装、接受发往多个域的邮件以及设置各种中继选项。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n由于本书讨论的发行版中，只有 Debian 是 Exim 的默认 MTA，因此本节使用\
  \ Debian 自带的 Exim 作为参考。其他 Exim 安装的默认配置可能不同。\n\n# Exim 配置文件\n\nExim 主配置文件名为 `exim.conf`，通常位于\
  \ `/etc`。该文件由如下格式的行组成：\n\n```\n option = value\n```\n\n文件中还可以包含注释，即以井号（`#`）开头的行。事实上，标准的\
  \ Debian Exim 安装使用的 `exim.conf` 文件大部分都是配置行作用的注释。当你修改 Exim 安装时，这一事实非常有帮助，因为你通常可以通过读取配置文件中的注释来确定需要更改的内容。\n\
  \n### 提示\n\n![TIP](img/tip.gif)\n\n当 Debian 安装 Exim 时，安装程序会运行一个名为 `eximconfig` 的脚本来生成\
  \ `exim.conf` 文件。你可以在之后运行此脚本来重新配置 Exim，无需直接编辑文件。对于较小的更改，通常自己编辑文件更简单，因为 `eximconfig`\
  \ 要求你再次回答它的所有问题。尽管如此，如果你熟悉 Exim 配置，`eximconfig` 是一个非常有用的工具，因为它会根据适用于你系统的选项生成配置文件。\n\
  \n除了主 `exim.conf` 文件外，Exim 可能还会使用其他文件作为补充信息源。特别是默认的 Debian Exim 配置使用了这些文件：\n\n*\
  \ `/etc/aliases` — 该文件在 Exim 中的作用与 `sendmail` 相同：它关联两个账户，使得发往一个用户的邮件被投递到另一个用户。例如，`root:\
  \ amelia` 行会导致发往 `root` 的邮件转而投递到 `amelia`。你也可以指定一个本地账户；例如，`root:` `amelia@pangaea.edu`\
  \ 会导致发往 `root` 的本地邮件发送到 `amelia@pangaea.edu`。与同名的 `sendmail` 文件不同，Exim 的文件不需要编译成二进制格式即可使用。\n\
  * `/etc/email-addresses` — 该文件会重写发出邮件中的 `From:` 地址。例如，`ben: bfranklin@pangaea.edu`\
  \ 会导致来自本地系统 `ben` 的邮件看起来像是来自 `bfranklin@pangaea.edu`。\n\n`eximconf` 脚本创建一个 `/etc/aliases`\
  \ 文件，它将发往 `postmaster` 的邮件重定向到 `root`，进而将 `root` 的邮件导向你指定的用户。你可以根据需要添加、删除或修改此文件。标准的\
  \ Debian `/etc/email-addresses` 文件除了一些注释外是空的。\n\n# Exim 地址伪装\n\n如前所述，在“ 地址伪装 ”中，你可能希望\
  \ Exim 使用特定的主机名或域名，而不是 `hostname` 命令返回的名称。最基础的地址伪装是通过 `qualify_domain` 选项实现的。如果邮件程序本身没有设置地址，该选项设置了用于本地生成邮件的域名。例如，假设你的\
  \ `exim.conf` 文件包含以下行：\n\n```\n qualify_domain = threeroomco.com\n```\n\n如果 `ben`\
  \ 从一个没有指定 `From:` 域的程序发送邮件，Exim 将将 `threeroomco.com` 域名添加到地址或替换不匹配此域名的地址，以便 `From:`\
  \ 头部等内容显示为 `ben@threeroomco.com`。\n\n另一个你可能使用的选项是 `primary_hostname`。设置它的方式类似于设置\
  \ `qualify_domain`，事实上 `primary_hostname` 的值被用作 `qualify_domain` 的默认值。`primary_hostname`\
  \ 的值用于 Exim 与远程邮件服务器之间的初始握手，该名称也会出现在 `Received:` 邮件头中。\n\n更高级的地址伪装选项由前面提到的 `/etc/email-addresses`\
  \ 文件提供。更准确地说，该文件由 `exim.conf` 文件末的一行引用。该行类似于：\n\n```\n *@threeroomco.com  ${lookup{$1}lsearch{/etc/email-addresses}\\\
  \n                   {$value}fail} bcfrF\n```\n\n这是 `exim.conf` 中透明度最低的配置行之一，通常不需要调整它，除非修改行开头的域名。此行匹配任何属于\
  \ `threeroomco.com` 域的地址，并导致 Exim 检查 `/etc/email-addresses` 以查找更精确的匹配。如果 `email-addresses`\
  \ 中某行的第一个字段（冒号之前）与电子邮件地址中的字段匹配，则替换第二个字段（冒号之后）。此工具允许你按用户执行地址伪装；你只需要像前述那样编辑 `email-addresses`\
  \ 文件即可。如果你的邮件服务器处理来自多个域的邮件，你可以为每个域复制 `exim.conf` 条目，为每个域指定不同的替换文件，甚至为所有域使用同一个一个文件。\n\
  \n这些描述仅涵盖了 Exim 可用地址伪装功能的一部分。欲需更多信息，请参阅 Exim 文档中的“地址重写”章节 [`www.exim.org/exim-html-3.30/doc/html/spec_34.html`](http://www.exim.org/exim-html-3.30/doc/html/spec_34.html)。\n\
  \n# 配置 Exim 接受邮件\n\nExim 提供了几个决定其应将地址视为本地并以此投递的 `exim.conf` 选项：\n\n* `local_domains`\
  \ — 你可以将此选项设置为由冒号分隔的主机名列表，Exim 将这些主机视为本地。例如，`local_domains = localhost:threeroomco.com`\
  \ 会导致 Exim 接受发往 `localhost` 或 `threeroomco.com` 用户本地邮件，并将其投递给本地用户。该值的默认值为 `qualify_recipient`\
  \ 选项的值，该选项设置缺失主机名的传入邮件的主机。\n* `local_domains_include_host` — 如果此选项设置为 `true`，Exim\
  \ 接受发往计算机当前主机名的邮件。你可以通过将主机名添加到 `local_domains` 列表中来实现类似的效果。\n* `local_domains_include_host_literals`\
  \ — 如果此选项设置为 `true`，Exim 接受通过 IP 地址而非名称指向系统的邮件。例如，如果 Exim 运行在 IP 地址为 172.24.98.2\
  \ 的计算机上，且用户 `ben` 存在，则 Exim 将接受发往 `ben@[172.24.98.2]` 的邮件。如果你不想接受此类邮件，请将此值设置为 `false`。\n\
  \n\n\n\n\n`eximconfig` 脚本会根据你对接受邮件的域名的问题的回答来设置其中一些选项，因此如果你运行了此脚本并恰当地回答了问题，你应该会发现已经设置了合理的默认值。\n\
  \n## Exim 中继配置\n\n与 sendmail 一样，Exim 具有多个中继选项，涉及从其他系统中继邮件以及通过另一个 SMTP 系统中继出的邮件。`eximconfig`\
  \ 脚本会询问有关中继的问题，因此在许多情况下应该正确配置 Exim。你可以通过直接编辑 `exim.conf` 来更改或微调此配置。\n\n### 配置 Exim\
  \ 中继邮件\n\n与邮件中继相关的最重要的 `exim.conf` 选项如下：\n\n* `host_accept_relay`—. 要让 Exim 为特定的计算机中继邮件，您应该使用此选项列出它们（用冒号分隔名称）。大多数系统至少使用\
  \ `host_accept_relay = localhost`，这允许 Exim 中继源自本地的邮件。通过指定匹配目标主机名、IP 地址或通配符来扩展此列表，可以扩展\
  \ Exim 的中继选项。例如，`host_accept_relay = localhost:192.168.99.0/24:*.pangaea.edu` 允许\
  \ `localhost`、192.168.99.0/24 网络中的所有计算机以及 pangaea.edu 域中的所有计算机中继邮件。使用此功能指定本地域的 IP\
  \ 地址可能是大多数安装程序中允许中继的最安全方法。\n\n* `relay_domains`—. 您可以使用此选项列出一个或多个域（用冒号分隔）。Exim 将中继来自指定域内任何系统的邮件。如果您的邮件服务器应该为好几个不同的域中继邮件，甚至是一个非常大的域，则此选项最为有用。您可以在\
  \ `host_accept_relay` 选项中使用通配符 `*` 作为主机名中的机器名来实现类似的目标。\n\n* `relay_domains_include_local_mx`—.\
  \ 如果您让 Exim 自动调整其中继策略以允许新域，可以使用此选项。如果将其设置为 `yes`，它将允许 DNS 服务器具有指向您系统的 MX 记录的计算机中继邮件。这非常方便，因为如果您经常更改域配置，就不需要调整\
  \ Exim。尽管如此，这具有潜在风险，因为垃圾邮件发送者可以设置一个 MX 条目指向您的 Exim 服务器的域，并将您的系统作为实际上的开放中继。\n\n*\
  \ `sender_address_relay`—. 您可以使用此选项提供由冒号分隔的允许中继的电子邮件地址列表。通常，如果您使用此选项，邮件必须同时匹配此选项和基于主机的选项，例如\
  \ `host_accept_relay`。（您可以通过通过指定 `relay_match_host_or_sender = yes` 来更改此行为以使用其中任何一个，但这种配置可能非常危险，因为电子邮件地址很容易伪造。）您可以使用此功能来限制给定系统中的哪些人可以通过\
  \ Exim 中继邮件。\n\n这些选项允许您配置 Exim 仅为某些系统中继邮件，例如本地网络上的系统或 Exim 应作为中继的任何远程域。这些选项对于许多用途都是足够的。对于更特殊的需求，Exim\
  \ 支持一些额外的选项，例如 `host_auth_accept_relay`（要求远程系统在中继之前进行身份验证）和 `tls_host_accept_relay`（要求远程系统使用称为\
  \ TLS 的身份验证和加密系统）。\n\n### 配置 Exim 通过中继发送\n\n如果您的系统必须使用出站中继，则需要配置 Exim 将所有出站邮件通过该系统引导。遗憾的是，没有单一的\
  \ Exim 配置选项来处理这种情况。不过，`eximconfig` 工具可以生成一组具有所需效果的配置行。这些行类似于：\n\n```\nsmarthost:\n\
  \  driver = domainlist\n  transport = remote_smtp\n  route_list = \"* franklin.threeroomco.com\
  \ bydns_a\"\nend\n```\n\n这些行告诉 Exim 通过 franklin.threeroomco.com 发送所有外部邮件。如果您的邮件中继系统发生更改，可以更改系统的名称。\n\
  \n## Exim 反垃圾邮件配置\n\nExim 的优势之一是其广泛的过滤规则。您可以使用这些规则来指定拒绝投递的主机、指定拒绝投递的用户，或者对每个用户执行更精细的检查。主要的过滤选项如下：\n\
  \n* `host_reject`—. 此 `exim.conf` 选项接受用冒号分隔的主机名、域名或 IP 地址列表作为其参数，并拦截所有源自这些系统的邮件。例如，`host_reject\
  \ = *.badspammer.net:10.16.8.0/24` 拦截来自 `badspammer.net` 域和 10.16.8.0/24 网段的所有邮件。这种拒绝在远程系统尝试连接时就会发生。这有时会导致反复尝试连接您的服务器，从而在很一段时间内消耗少量的网络资源。\n\
  \n* `host_reject_recipients`—. 此选项的作用与 `host_reject` 类似，不同之处在于是在远程系统开始事务后（更准确地说，是在其发送\
  \ `RCPT TO:` 命令后）才拒绝消息。结果可能是立即停止尝试发送消息。\n\n* `sender_reject`—. 此选项拒绝源自特定发送者的邮件。发送者可以是整个域，也可以是该域中的某个人用户。例如，`sender_reject\
  \ = spammer@abigisp.com: badspammer.net` 拦截来自 `badspammer.net` 域和用户 `spammer@abigisp.com`\
  \ 的邮件。Exim 在获知发送者身份后立即拒绝接收邮件。这种快速拒绝会导致某些发送系统反复尝试发送相同的消息。\n\n* `sender_reject_recipients`—.\
  \ 此选项的作用与 `sender_reject` 类似，但它会等到发送者使用 `RCPT TO:` 命令输入接收者地址后才拒绝邮件。这种方法比 `sender_reject`\
  \ 方法在让发送 MTA 停止尝试发送消息更为有效。\n\n* 用户特定过滤器—. Exim 支持个人用户可以设计的过滤器。这些过滤器存在用户主目录下的 `.forward`\
  \ 文件中。这种机制非常强大且灵活。它在许多方面与 Procmail 过滤器类似，稍后的“使用 Procmail 过滤器”节将对其进行描述。在 Debian GNU/Linux\
  \ 的 `/usr/doc/exim` 目录下的 `filter.txt.gz` 文档文件中对此进行了详细描述（您需要使用 `gunzip` 解压此文件进行读取）。\n\
  \n如果您想创建一个您想要拒绝的大型发送者或发送者主机列表，可以将它们放在单独的文件中，并使用相应的拒绝选项引用该文件名。除了自定义过滤器外，Exim 还包含了几个与支持黑洞列表相关的选项。这些通过几个\
  \ `exim.conf` 选项进行控制：\n\n\n\n\n\n- `rbl_domains`: 提供一个用冒号分隔的黑洞列表服务器地址列表，如表 19.1\
  \ 所示，以便 Exim 使用这些列表。你可以在这些条目后附加 `/warn` 或 `/reject`，以指定让 Exim 分别添加警告标头（例如可能供后续的\
  \ Procmail 过滤器使用）或直接拒绝邮件。另外两个额外选项是 `/accept`（使用类似于黑洞的机制提供有限的“白名单”）和 `/skiprelay`（如果发送者的域名在\
  \ `host_accept_relay` 选项列表中，则跳过黑洞列表检查）。\n\n- `rbl_hosts`: 该选项的默认值为 `*`，这会导致 Exim\
  \ 根据 `rbl_domains` 指定的黑洞列表检查所有主机。不过，你可能希望让某些发送者免于这些检查，为此你需要在冒号分隔的列表中，在星号之前添加以感叹号（`!`）开头的名称。例如，`rbl_hosts\
  \ = !ok.pangaea.edu:*` 会让 `ok.pangaea.edu` 免于黑洞列表检查。\n\n- `rbl_reject_recipients`:\
  \ 如前所述，你可以使用 `rbl_domains` 选项的 `/warn` 或 `/reject` 功能来指定是为怀疑的垃圾邮件添加警告还是拒绝。当你没有明确指定操作方法时，Exim\
  \ 默认拒绝受影响的邮件。你可以通过设置 `rbl_reject_recipients = no` 将此行为更改为仅添加警告标头。\n\n- `recipients_reject_except`:\
  \ 此选项允许你根据收件者指定黑洞列表的例外。例如，`recipients_reject_except = postmaster@your.domain` 会导致\
  \ Exim 接受发往 `postmaster@your.domain` 的邮件，即使这些邮件来自黑洞列表中的站点。\n\nExim 中还有几个黑洞列表选项；详情请参阅软件包的文档。除了模式匹配和黑洞列表外，Exim\
  \ 还提供了几个可能有助于减少垃圾邮件的额外选项，包括：\n\n- `headers_check_syntax`: Exim 可以检查邮件头是否存在虚假语法（例如发给\
  \ `user@` 的消息），并拒绝未通过检查的消息。这通常是对数据真实性的合理性检查，但某些垃圾邮件使用了构造不当的邮件头会导致此类检查失败。要使用此选项，请设置为\
  \ `true`。\n\n- `helo_verify`: 在初始连接期间，调用的 SMTP 服务器通过 `HELO` 或 `EHLO` 命令识别自己的身份。通常\
  \ Exim 不需要此操作，但你可以通过提供一个必须使用此握手的主机列表来增加严格。（你可以设置 `helo_verify = *` 来要求所有发送者通过此测试。）除了要求使用\
  \ `HELO` 或 `EHLO` 外，`helo_verify` 要求主机的 IP 地址和 DNS 条目必须相互匹配。垃圾邮件发送者经常使用配置错误的系统，但遗憾的是，许多合法的邮件服务器系统也配置错误，导致无法通过此测试。\n\
  \n- `message_size_limit`: 此选项另一个并非严格的反垃圾邮件工具，但可能会拦截一些垃圾邮件。它的默认值为 `0`，表示无大小限制。如果你将此选项设置为正值，则为\
  \ Exim 接受的最大消息大小。这对于限制由于不考虑或意外向你的系统发送超大邮件的影响可能很有用。\n\n总之，Exim 的垃圾邮件过滤能力非常强大，特别是如果你愿意深入创建用户特定的过滤器文件时。\n\
  \n# Postfix 基础配置\n\n像 Exim 一样，Postfix 的设计是有一个主配置文件，可以由人类轻松解析和编辑——或者至少由足够熟悉 SMTP\
  \ 术语并理解所用名称的人类。Postfix 也被设计为模块化邮件服务器，其中多个程序协作完成 sendmail 或 Exim 中由单个程序完成的任务。Postfix\
  \ 功能的总体概述与 sendmail 或 Exim 类似；与其他这些 SMTP 服务器一样，Postfix 允许地址伪装、将发往多个域的邮件视为本地邮件、各种中继选项以及反垃圾邮件功能。\n\
  \nPostfix 是 Linux Mandrake 的默认 MTA，但在其他某些系统中（包括 Debian 和 SuSE）也是可选的。Red Hat PowerTools\
  \ 集合也包含了 Postfix。Mandrake RPM 包安装在许多其他基于 RPM 的 Linux 发行版中，尽管其中包含的 SysV 启动脚本可能无效。由于\
  \ Mandrake 是默认使用 Postfix 的主要发行版，本文讨论重点是 Mandrake 提供的 Postfix。不过，大多数其他 Postfix 包的默认设置是相似的。\n\
  \n## Postfix 配置文件\n\n你最可能修改的 Postfix 配置是 `main.cf`，它通常位于 `/etc/postfix`。你在这里指定本地域和中继配置选项等功能。`main.cf`\
  \ 中的大多数项目采用以下格式：\n\n```\n option = value\n```\n\n`main.cf` 的某些选项在后续行会被视为变量。这是通过在原始\
  \ `option` 名称前加上美元符号（`$`）并将其放置在 `value` 位置来实现的。例如，考虑以下两行（它们之间可能隔着许多其他行）：\n\n```\n\
  \ myhostname = franklin.threeroomco.com\n myorigin = $myhostname\n```\n\n这种组合将 `myhostname`\
  \ 变量设置为计算机的主机名 `franklin.threeroomco.com`，然后将 `myorigin` 设置为相同的值。这种链式引用在 Postfix\
  \ 中很常见，因此你可能会发现自己需要回溯变量以确定给定选项的设置值。\n\n默认的 `main.cf` 文件大部分是注释，即以井号（`#`）开头的行。这些注释完成了其前置选项的大部分文档工作，因此通过阅读配置文件，你可以学习到关于\
  \ Postfix 配置的大量知识。\n\n`main.cf` 文件包含了对其他几个文件的引用。与 `sendmail` 类似，其中某些文件是二进制文件（扩展名为\
  \ `.db`），它们由同名文件构建，但缺少 `.db` 后缀。你最可能想要编辑的这类类型的文件是 `aliases`（二进制格式为 `aliases.db`）。此文件设置了投递别名，类似于同名的\
  \ sendmail 文件。例如，该文件中读取为 `root: amelia` 的行会导致所有发往 `root` 的邮件投递到 `amelia`。要将文本格式的\
  \ `aliases` 文件转换为二进制 `aliases.db`，请在 `aliases` 所在的目录下输入 `postalias aliases`。\n\n\
  当你修改了文本模式的文件并创建了相应的 `.db` 文件后，Postfix 最终会发现这些。你可以通过输入 `postfix reload` 或通过 SysV\
  \ 启动脚本重启 Postfix 来加速这一过程。\n\n## Postfix 地址伪装\n\n`myorigin` 参数设置了 Postfix 用于向远程系统识别自己的名称。默认配置将此参数设置为\
  \ `$myhostname` 变量的值，而该变量又默认为计算机的主机名。这种默认配置对许多系统都良好，但如果计算机有多个主机名，或者你想使用域名而不是主机名，你可能想要更改它。要为此，你应该将\
  \ `myorigin` 参数设置为合适的值，例如：\n\n```\n myorigin = threeroomco.com\n```\n\n\n或者，你可以在此赋值的\
  \ `value` 侧使用另一个变量。一个可能的 `value` 是 `$mydomain`。该变量默认为 `$myhostname` 减去最左边的组件。例如，如果\
  \ `$myhostname` 是 `franklin.threeroomco.com`，则 `$mydomain` 默认为 `threeroomco.com`。你可以通过在\
  \ `main.conf` 中插入适当的行来设置其中任何一个。事实上，默认的 `main.conf`包含了被注释掉的示例行，你可以取消这些行的注释并根据需要对其进行编辑。\n\
  \n设置 `myorigin` 仅执行非常基础形式的地址配置。具体而言，此设置仅影响初始的 `SMTP` 握手，以及当邮件程序没有显式设置 `From:` 地址的域名部分时所使用的默认地址。如果你的邮件服务器为你域名上的其他系统继发邮件，你可能希望执行更完整形式的地址伪装，因为那些系统可能会在邮件头中设置它们自己的完整地址。例如，假设一个\
  \ Postfix 客户端想要通过 Postfix 继发邮件，但客户端指定的 `From:` 地址为 `ben@client.threeroomco.com`。你可能希望移除该地址的\
  \ `client` 部分，得到 `ben@threeroomco.com`。假设 `$mydomain` 变量被设置为 `threeroomco.com`，你可以通过以下选项来实现目标：\n\
  \n```\nmasquerade_domains = $mydomain\n```\n\n此选项会导致 Postfix 在处理邮件消息时，剥离 `$mydomain`\
  \ 内部任何主机的非域名部分。结果是，来自 `$mydomain` 内部系统的邮件的 `From:` 和 `To:` 邮件头将显示 `$mydomain` 地址，而不是\
  \ `$mydomain` 内部的各个系统。\n\n你可以实现更完整形式的地址伪装，也称为“地址重写”（address rewriting），通过通过 `sender_canonical_maps`\
  \ 选项将 Postfix 指向重写数据库文件，如下：\n\n```\nsender_canonical_maps = hash:/etc/postfix/sender_canonical\n\
  ```\n\n然后你可以在 `sender_canonical` 文件中创建映射。该文件的每行都包含一个可能出现在邮件头中的地址，随后是它应该应该被替换的地址。例如，以下两行将\
  \ `client.threeroomco.com` 和 `localhost` 均替换为 `threeroomco.com`：\n\n```\n@client.threeroomco.com\
  \ @threeroomco.com\n@localhost @threeroomco.com\n```\n\n如果你需要重新映射用户名，可以使用类似的技术。例如，你的电子邮件系统可能正处于使用不同用户名格式的系统之间的过渡期。你可以使用规范映射文件按用户将所有对过时地址的引用转换为新地址（每个用户一行）。\n\
  \n在创建 `sender_canonical` 文件后，你必须通过输入 `postmap sender_canonical` 将其转换为二进制格式。然后你可以输入\
  \ `postfix reload` 或重启 Postfix 使其使用新的映射。\n\n从一般规则来说，你应该使用你所需的最小限度的地址伪装。大多数 Postfix\
  \ 安装仅需默认设置即可正常工作，或者可能需要对 `$myorigin` 进行显式调整。`masquerade_domains` 选项对于可能处理已通过 Linux\
  \ 或 UNIX 工作站邮件服务器的邮件的继发服务器非常有用。地址重写是极其强大的，部分因为它比其他技术重写了多得的邮件邮件头，甚至包括 `Received:`\
  \ 邮件头的内容。这一事实使得许多管理员不愿使用此功能，但有时它非常有用，特别是当你的程序坚持在 `From:` 地址中使用奇特的用户名或主机名时。\n\n##\
  \ 配置 Postfix 接受邮件\n\n与其他邮件服务器一样，Postfix 只接受发送给特定主机的本地邮件。Postfix 使用 `mydestination`\
  \ 参数来决定将哪些主机视为本地主机。该参数默认为 `$myhostname` 加上 `localhost.$mydomain`。例如，如果 `$mydomain`\
  \ 是 `threeroomco.com` 且 `$myhostname` 是 `franklin.threeroomco.com`，则 fix 接受发送给 `franklin.threeroomco.com`\
  \ 或 `localhost.threeroomco.com` 的邮件。\n\n你可以轻松地调整 `mydestination` 参数，事实上，一个域名的邮件服务器应该调整此参数以包含至少\
  \ `$myhostname` 和 `$mydomain`。仅添加 `localhost` 通常是一个好主意。你应该用逗号或空格分隔条目。总而言，一个单一域名的典型邮件服务器可能包含如下条目：\n\
  \n```\nmydestination = localhost, localhost.$mydomain, $myhostname,\n          \
  \      $mydomain\n```\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n如果 `mydestination`\
  \ 行延续到下一行（如许多配置文件所示），你*不需要*在行尾加上反斜杠（`\\`）。相反，第二行及随后的行应该以空格或制表符开头，以指示它们是第一行的延续。\n\
  \n你可以通过在单个 `mydestination` 参数中指定所有域名让 Postfix 服务器处理多个域名。这些域名大部分将显式列出，而不是通过变量。\n\n\
  ## Postfix 继发配置\n\n与大多数邮件服务器一样，Postfix 支持许多继发选项，包括使用 Postfix 计算机作为继发以及让 Postfix\
  \ 通过另一个作为继发的计算机发送其输出邮件。这些继发选项通过 `main.cf` 文件进行配置。\n\n### 配置 Postfix 继发邮件\n\n默认情况下，Postfix\
  \ 继发符合以下任何标准的邮件：\n\n* 发送者位于 `$mynetworks` 指定的任何网络上。该变量默认为计算机的所有网络接口，包括本地回接口。\n*\
  \ 发送者在 `$relay_domains` 指定的域名内。该变量默认为 `$mydestination` 的值。\n* 发送者尝试向 `$relay_domains`\
  \ 之一的计算机继发邮件。\n\n默认值意味着 Postfix 继发来自其本地网络接口或与 Postfix 同域的邮件。这种配置对于许多作为本地继发的邮件服务器很好，但你可能需要对其进行调整。要这样做，你可能需要修改\
  \ `$mynetworks` 或 `$relay_domains` 的两者。例如，假设 Postfix 为 `work.threeroomco.com` 的工作站作为\
  \ `MTA`。此类系统不应继发，因此你可能希望重新定义这些变量：\n\n```\nmynetworks = 127.0.0.0/8\nrelay_domains\
  \ = work.threeroomco.com\n```\n\n此配置将继发限制在本地网络和 Postfix 服务器本身。另一方面，你可能希望放宽继发以包含额外的域名或网络。可以通过如下参数：\n\
  \n```\nmynetworks = 192.168.99.0/24, 172.24.0.0/16, 127.0.0.0/8\nrelay_domains =\
  \ $mydestination, pangaea.edu\n```\n\n这些选项会导致 Postfix 继发来自 192.168.99.0/24、172.24.0.0/16\
  \ 和本地 (127.0.0.0/8) 网络的消息，或来自 `$mydestination` 或 `pangaea.edu` 域的消息。\n\n`mynetworks`\
  \ 和 `relay_domains` 控制以及其他若干交付和继发限制选项的底层是 `smtpd_sender_restrictions` 参数。此选项未出现在默认的\
  \ `main.cf` 文件，但如果你需要更精细的继发控制，可以添加它。你可以在 Postfix 文档中阅读更多关于它的信息。该选项的 `permit_mx_backup`\
  \ 值值得注意的是，它类似于 sendmail 的 `relay_based_on_MX` 功能。\n\n### 配置 Postfix 通过继发发送邮件\n\n\
  \n\n\n\n在简单的情况下，配置 Postfix 使用另一个系统作为中继只需要在 `main.cf` 中设置一个选项：`relayhost`。该选项指定了可以作为你的域名邮件中继的计算机主机名，或者如果该域的\
  \ `MX` 记录指向相应的邮件中继系统，则指定该域名。例如，如果你系统的邮件中继是 `franklin.threeroomco.com`，你可以在 `main.cf`\
  \ 中使用以下行：\n\n```\nrelayhost = franklin.threeroomco.com\n```\n\n如果你的系统与中继系统处于同一个域，且该域的\
  \ `MX` 记录指向正确的系统，你可以用 `$mydomain` 代替 `franklin.threeroomco.com`。使用域名的优点是，如果你的域邮件服务器发生变化，Postfix\
  \ 会自动进行调整。\n\n通常情况下，Postfix 在发送邮件时会尝试使用 `DNS` 查找。如果你的本地网络缺少 `DNS` 服务器（例如，如果你完全依赖\
  \ `/etc/hosts` 条目进行本地名称解析），则你应该额外添加一行：\n\n```\ndisable_dns_lookups = yes\n```\n\n\
  此行导致 Postfix 不依赖 `DNS` 查找进行名称解析，因此它可以通过 `/etc/hosts` 条目或类似方式联系中继系统。\n\n## Postfix\
  \ 反垃圾邮件配置\n\nPostfix 与 sendmail 和 Exim 一样，提供了多项反垃圾邮件措施，其中某些非常复杂。你可以使用模式匹配系统根据邮件标头中的模式来拦截垃圾邮件，或者使用黑洞列表（blackhole\
  \ list）。\n\nPostfix 的主要模式匹配工具是一个相当复杂的工具，它使用正则表达式系统检查消息标头。你可以指定根据与正则表达式的匹配结果来拒绝消息，这类似于\
  \ `egrep` 工具所使用的用法。该系统通常与单独的正则表达式文件结合使用，尽管你也可以在 `main.cf` 文件本身中指定正则表达式。常见的配置是通过使用如下\
  \ `main.cf` 条目将 Postfix 指向外部文件：\n\n```\nheader_checks = regexp:/etc/postfix/bad_headers\n\
  ```\n\n你可以在 `bad_headers` 文件中填充如列表 19.2 所示的正则表达式。Postfix 尝试将随消息发送的消息标头与这些正则表达式进行匹配，如果匹配且文件指定应拒绝该消息，则该消息被退回。正则表达式可以是\
  \ POSIX 风格（如上所示由 `regexp:` 指定明），也可以是 PCRE 风格（由 `pcre:` 指定）。\n\n### 示例 19.2. Postfix\
  \ 正则表达式垃圾邮件过滤器文件\n\n```\n #### 垃圾邮件特征的主标头\n/^Subject: ADV:/ REJECT\n/^Subject: Accept\
  \ Visa/ REJECT\n#### 来自垃圾邮件发送者的 From 和 Received 标头\n/^(From|Received):.*badspammer\\\
  .net/ REJECT\n/^From: spammer@abigisp\\.net/ REJECT\n```\n\n### 注意\n\n接下来的章节“规则条件（The\
  \ Recipe Conditions）”将详细介绍正则表达式。如需更多信息，请参阅 `egrep` 手页。\n\nPostfix 的 `header_checks`\
  \ 选项非常强大，但可能难以配置和维护。更简单的方法是使用黑洞列表。你可以通过使用两个 `main.cf` 选项来实现，如下：\n\n```\nmaps_rbl_domains\
  \ = relays.mail-abuse.org, dialups.mail-abuse.org\nsmtpd_client_restrictions = reject_maps_rbl\n\
  ```\n\n`maps_rbl_domains` 选项允许你指定黑洞列表的服务器地址，如表 19.1 所示。你可以出多个域名，用逗号或空格分隔。第二行告诉 Postfix\
  \ 使用这些域名作为拒绝来自发送主机邮件的基础。`smtpd_client_restrictions` 选项可以接受除 `reject_maps_rbl` 以外的值。例如，`reject_unknown_client`\
  \ 会导致 Postfix 在发送系统没有有效的反向 `DNS` 查找时拒绝投递。Postfix 文档对这些选项有更详细的说明。\n\n除了显式的垃圾邮件控制外，Postfix\
  \ 还有许多选项，虽然它们不是严格的反垃圾邮件措施，但可能对垃圾邮件传输产生某些积极影响。这些包括：\n\n* `smtpd_helo_required`——此选项默认为\
  \ `no`，但如果你将其设置为 `yes`，则除非发送者使用 `HELO` 或 `EHLO`，否则 Postfix 将处理消息。这可以阻止某些编写糟糕的垃圾邮件软件，但也会阻止一些配置错误但其他合法的\
  \ `SMTP` 服务器。\n\n* `smtpd_helo_restrictions`——你可以通过此选项进一步收紧 Postfix 对 `HELO` 或 `EHLO`\
  \ 事务的处理，该选项接受多个值。例如，`reject_unknown_hostname` 会导致 Postfix 在无法为指定的调用主机名找到 A 或 `MX`\
  \ 记录时终止连接，而 `reject_non_fqdn_hostname` 则要求发送者使用完全限定域名（FQDN）——即同时包含主机名和域名的域名。此选项还有其他可能的值；详情请参阅\
  \ Postfix 文档。\n\n* `smtpd_sender_restrictions`——如果存在此选项，则要求 `From:` 地址符合指定标准。例如，`reject_unknown_sender_domain`\
  \ 会在 Postfix 无法找到指定的 `From:` 地址的域时导致拒绝，而 `reject_non_fqdn_sender` 要求发送者在地址部分中使用\
  \ `FQDN`。\n\n\n\n\n\n大多数 MTA 专门用于将邮件消息从一台计算机传输到另一台计算机，或者在同一台计算机的不同用户之间传输。然而，许多邮件环境足够复杂，因此在收到邮件后以某种方式对其进行处理或过滤是有必要的。这样做的一个原因已经讨论过了：垃圾邮件过滤。你可能希望垃圾邮件过滤器能丢弃所有垃圾邮件，或者至少将其放入留给可疑垃圾邮件的特殊文件夹中。`Sendmail`、`Exim`、`Postfix`\
  \ 以及其他 MTA 都提供了至少有限的此类过滤功能，但这些 `MTA` 功能通常与 `Procmail` 的功能相比非常有限。`Exim` 的功能最接近 `Procmail`；`Postfix`\
  \ 只能对报头进行过滤，且其操作能力有限；而 `sendmail` 在可搜索的报头方面仍然限制。因此，`Procmail` 填补了邮件过滤能力的空白。\n\n\
  Procmail 过滤器可以不仅仅是丢弃邮件（正如你处理垃圾邮件时那样）。你可以使用这些过滤器将邮件自动分类到特定的邮件文件夹。例如，如果你订阅了多个邮件列表，你可能希望将来自这些列表的邮件发送到特定的文件夹中，以便你与普通邮件分开阅读。你可能每天检查一次这些文件夹，而对普通邮件则检查得更频繁。\n\
  \nProcmail 甚至可以将邮件通过管道传递给其他程序。此功能的用途是创建一个 `mail-to-news gateway`，其中邮件列表消息被发送到新闻服务器（参见第\
  \ 12 章）。然后你可以使用新闻阅读器而不是邮件阅读器来阅读你的邮件列表消息。外部程序还可以以各种方式处理邮件。例如，你可以使用 `Procmail` 将包含附件的消息通过病毒扫描程序，以帮助网络上的计算机免受病毒、蠕虫、木马等等的侵害。你可能会设置一个过滤器，当包含某些单词的消息到达时播放特定的声音文件，以提醒你重要邮件的到达。\n\
  \n所有这些功能都依赖于 `Procmail` 扫描消息的能力。例如，基于 Procmail 的垃圾邮件过滤器可能会搜索消息是垃圾邮件的典型特征。这些特征可能包括包含\
  \ `$$$` 等字符串的 `Subject:` 报头，或者消息末尾引用 `S.1618` 的行（这是一项处理垃圾邮件的美国失败立法，许多垃圾邮件发送者引用它以使其自己的活动合法化）。为了实现这一点，`Procmail`\
  \ 使用正则表达式，类似于 `Postfix` 在其报头过滤器使用的正则表达式，或 `egrep` 程序使用的正则表达式。我稍后会详细描述这一点。\n\nProcmail\
  \ 可以以两种方式使用：作为系统级过滤器或作为个人账户的过滤器。例如，你可能想实现一个系统级的 `Procmail` 过滤器来阻止最恶劣的垃圾邮件，或扫描邮件附件以检测病毒。个人用户可能想使用\
  \ `Procmail` 将收到的邮件分类到邮件列表、个人等不同的文件夹中。系统级 `Procmail` 配置通过 `/etc/procmailrc` 文件处理，而个体的\
  \ `Procmail` 过滤器出现在用户主目录下的 `.procmailrc` 文件中。这两个文件的格式相同。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n在大多数系统中，当 `Procmail` 以 `root` 身份运行时，使用 `/etc/procmailrc` 配置文件。因此，你应该对让 `Procmail`\
  \ 在此类文件中运行的命令要非常小心，如果你重定向了邮件投递，你可能需要采取措施确保创建的文件可以被所需的用户读取。`.procmailrc` 用户文件没有此问题的影响；从这些文件运行的命令将以用户的权限运行。\n\
  \nProcmail 配置文件由三类型的条目组成：\n\n*   **注释** — Procmail 注释以井号（`#`）开始并持续到行尾，与其他许多配置文件一样。\n\
  *   **环境变量赋值** — `Procmail` 依赖某些环境变量来工作，例如 `$HOME`（用户主目录）和 `$MAILDIR`（用户邮件文件夹所在的目录）。你可以像在\
  \ Shell 脚本中一样调整这些及其他环境变量。例如，`MAILDIR = $HOME/Mail` 将 `$MAILDIR` 环境变量设置为用户主目录下的 `Mail`\
  \ 目录。\n*   **配方（Recipes）** — 一条 Procmail 过滤器规则被称为 `recipe`。你在过滤器集中投入的大部分工作可能都耗费在配方上。每个配方都提供了规则，规定如何处理匹配某个特定正则表达式的消息。因此，一个完整的规则集可能由许多配方组成。配方进一步细分为两类：`delivering`（投递型）和\
  \ `nondelivering`（非投递型）。投递型配方导致邮件投递到邮箱箱文件、丢弃或通过其他程序进行管道传输。非投递型配方导致消息被 `Procmail`\
  \ 再次处理，或将一个配方嵌套在另一个配方中。\n\n你可以根据需要交替这三类型的条目。许多 Procmail 配置文件首先设置几个环境变量，然后进行一系列配方。在处理其配置文件时，`Procmail`\
  \ 会扫描传入的邮件并尝试将所有配方与邮件匹配。如果没有没有配方匹配，`Procmail` 将邮件投递到 `$DEFAULT`，这通常是默认邮箱箱文件，例如 `/var/spool/mail/username`。\n\
  \n## 设计配方\n\n对于初学者来说，Procmail 配方看起来可能令人生畏，特别是对于那些尚未熟悉 `egrep` 所使用的正则表达式的人。类似于 `egrep`\
  \ 或工具的配方基本格式如下：\n\n```\n :0 [flags] [lockfile]]\n[conditions]\naction\n```\n\n这种格式可以被视为三个部分：配方识别行、条件和操作。\n\
  \n### 配方识别行\n\n每个配方都以字符串 `:0` 开始。数字 `0` 没有特殊含义，你不会发现以 `:1` 或更高数字开头的配方。你可以指定一个或多个\
  \ `flags`，这些会修改 `Procmail` 的行为。你应该查阅 `procmailrc` 手页获取详情，但最常用的 `flags` 有：\n\n* \
  \  **H** — 导致对消息报头进行模式匹配。这是默认值。\n*   **B** — 导致对消息正文进行模式匹配。\n*   **D** — 默认情况下，模式匹配不区分大小写。此选项使大小写变得敏感。\n\
  *   **c** — 导致配方在原始消息的“副本”上工作；将“原始”消息留给其他配方进行匹配。\n*   **w** — 导致 `Procmail` 等待 `action`\
  \ 完成。如果操作没有成功完成，消息将留在队列中匹配其他配方。\n*   **W** — 其工作方式与 `w` 相同，但会抑制程序错误消息。\n\n在任何标记之后，你可以指定一个单冒号（`:`）来让\
  \ `Procmail` 在处理邮件时创建一个锁定文件。锁定文件是一种特殊文件，指示 `Procmail` 正在处理另一个文件。如果 `Procmail` 看到锁定文件存在，它将延迟处理消息，直到现有的锁定文件被删除。这是非常理想的行为，特别是在繁忙的队列中，以防止快速投递的邮件以交杂的形式写入新文件。默认锁定文件是基于目标邮箱文件的名称（在\
  \ `action` 行中指定）构建的。如果 `action` 是到另一个程序的管道，你可能想在冒号后指定一个锁定文件。\n\n### 配方条件\n\n\n\n\
  \n\n`conditions` 规则由零或多行组成，通常以星号（`*`）开头。这些是普通的正则表达式，本质上是 Procmail 尝试与输入内容（邮件头部或正文）中的行进行匹配的字符串。大多数字符与其邮件正文中的对应字符相匹配。然而，有几个特殊字符可以匹配在纯文本文件中难以表示的字符串或字符组。它们包括：\n\
  \n* `^` —. 脱符号（caret）表示行的开始。许多 Procmail `conditions` 行在开头的星号之后都以该字符开头。\n* `$` —.\
  \ 美元符号表示行的结束。如果你不包含此符号，`conditions` 行将匹配任何包含指定字符串或其他特征的行，即使该行还包含额外的文本。\n* `.` —.\
  \ 句号匹配换行符以外的任意单个字符。例如，`d.g` 匹配 `dog`、`dig`、`dug` 或任何其他以 `d` 开头以 `g` 结尾的三字母字符串。\n\
  * `a*` —. 此字符串匹配零或多个 `a` 的任意序列，其中 `a` 可以是任何字符。这通常与句号作为 `a` 使用使用，以匹配任意长度的字符字符串——例如，如果你想匹配一个包含\
  \ `802` 后跟某些未知字符最后是 `1618` 的行，你可以使用 `802.*1618` 来完成任务。\n* `a+` —. 它的作用与 `a*` 类似，但它匹配的是一个或多个\
  \ `a` 字符，而不是零或多个。\n* `a?` —. 此字符串匹配零或一个 `a` 字符。\n* `seq1|seq2` —. 你可以通过用竖线（`|`）分隔列出两种可能性来指定对其中任何一种情况进行匹配。你可以使用额外的竖线来匹配更多的可能性。\n\
  * `(seq)*` —. 这本质上与 `a*` 相同，但它匹配的是字符字符串 `seq` 而不是单个字符。\n* `[chars]` —. 方括号括的字符被视为一个集合，可以匹配其中的任意一个字符。例如，`[aeiou]`\
  \ 匹配任何元音字符（`a`、`e`、`i`、`o` 或 `u`）。如果字符中的一个是连字符（`-`），则匹配周围边界字符之间的任意字符。例如，`[m-q]`\
  \ 匹配 `m`、`n`、`o`、`p` 或 `q`。\n* `\\` —. 反斜杠移除具有特殊含义字符的特殊含义。例如，`\\.` 匹配单个句号。\n\n有关这些表达式的更多信息，请参阅\
  \ Procmail 的 man 页面。通过结合普通文本和这些特殊字符序列可以构建出非常复杂的匹配模式。（稍后我会提供一些示例。）记住，`conditions`\
  \ 规则是“零或多行”。大多数规则至少有一行。如果一个规则有多行 `conditions`，那么为了使整个规则匹配，它们所有行都必须匹配成功。零行的 `conditions`\
  \ 匹配任何邮件消息。\n\n可以在 `conditions` 行中使用特殊字符来改变规则的解释。这些特殊字符包括：\n\n* `!` —. 这是一个取反操作符；以感叹号开头的\
  \ `conditions` 行表示，如果提供的模式*不*匹配，则该规则匹配。例如，你可能想创建一个规则，匹配所有邮件*除非*发送给 `postmaster`。\n\
  * `<` —. 如果邮件的长度小于指定的字节数，则满足规则的条件。\n* `>` —. 如果邮件的长度大于指定的字节数，则满足规则的条件。\n\n### 规则动作（The\
  \ Recipe Action）\n\nProcmail 的 `action` 行恰好只有一行，告诉 Procmail 对消息执行什么。一个简单的 `action`\
  \ 行可能包含一个文件名（可能包括一个变量），在这种情况下，Procmail 将消息存储在指定文件中。这对于 sendmail、`exim`、`postfix`\
  \ 以及其他使用 mbox 邮件文件夹格式的邮件服务器非常有效，在那种格式中，整个邮件文件夹都位于一个文件中。如果你正在使用 qmail 或重新配置了其他邮件服务器使用\
  \ maildir 格式存储邮件，你应该确保在 action 行末尾包含一个斜杠（`/`），以便让 Procmail 将消息存储在 qmail 风格的 maildir\
  \ 中。Procmail 还支持第三种邮件存储格式，由以斜杠和句号（`/.`）结尾的 action 行指定。\n\n除了将邮件存储在邮件文件夹中，Procmail\
  \ 还支持其他几种动作，你可以通过在 `action` 行的开头使用特殊字符来指定它们：\n\n* `!` —. 如果 `action` 行以感叹号开头，Procmail\
  \ 将该行解释为邮件地址列表，消息将转发到这些地址。如果你想自动让某组用户可以使用某些类型的消息，可能可以使用此功能。\n* `|` —. 竖线在 `bash`\
  \ 等 shell 中是管道字符，Procmail 对其处理方式也一样。如果 `action` 行以该字符开头，Procmail 将运行指定的程序并将消息管道至该程序。你可能使用此功能来更彻底地扫描消息，或者创建一个处理文件的自动化电子邮件服务。\n\
  * `{` —. 左大括号表示`nesting block`（嵌套块）的开始。你可以在此嵌套块中放置额外的规则规则，这些规则只有在周围规则的条件满足时才会被使用。（周围的规则是非投递规则，所以如果没有任何规则匹配，邮件将不会被视为投递。）如果你有几个只有在某些条件满足时才使用的规则，可以使用此功能。例如，你可以使用一个嵌套块来定位显示某些垃圾邮件迹的邮件，然后在嵌套块内部使用规则搜索垃圾邮件的其他迹。嵌套块以单独占一行的右大括号（`}`）结束。\n\
  \nProcmail 每个规则只支持一个动作。因此，如果你想对消息执行多项操作，你可能需要创建一个脚本来执行所有操作，然后通过管道调用脚本。如果你这样做，请确保脚本读取了整个消息，否则\
  \ Procmail 将尝试对其他规则进行匹配。在某些情况下，你可能会对一个规则之外的所有规则使用副本（`c`）标记，但取决于每个规则执行的操作，这可能会导致邮件的多次投递。\n\
  \n### 示例规则\n\n前面的讨论可能看起来相当抽象，但对于理解 Procmail 过滤器文件是必要的。列表 19.3 显示了此类文件的示例，尽管这是一个简单的示例。这个示例作为个人的\
  \ `.procmailrc` 文件比作为全局的 `/etc/procmailrc` 文件更有，因为它将某些邮件投递到用户目录下的文件夹中。\n\n列表 19.3\
  \ 显示了几个重要的 Procmail 规则特性。\n\n* 嵌套规则 —. 垃圾邮件过滤规则嵌套在一个过滤规则内，该规则只有在邮件*不是*发送给 `postmaster`\
  \ 时才会检查垃圾邮件过滤器。（注意外部嵌套规则上的取反操作符。）你可以通过在每个单独的垃圾邮件过滤规则中包含 `*! ^To:.*postmaster` 条件产生类似的效果，在这个简短示例中，这会产生稍微短的配置文件。然而在较长的文件中，使用嵌套规则可以缩短配置文件的长度。嵌套还减少了错误的概率，因为不需要将嵌套条件复制到多个规则中。\n\
  \n\n\n\n\n# 示例 19.3. 一个 Procmail 配置文件示例\n\n```\nMAILDIR = $HOME/Mail\n\n# 首先，进行垃圾邮件检查，但不要丢弃任何\n\
  # 发往 postmaster 或发自 postmaster 的邮件\n:0\n*! ^(From|To):.*postmaster\n{\n   :0 B\n\
  \   * ^.*301.*S.*1618\n   /dev/null\n\n   :0\n   * ^From:.*badspammer\\.net\n  \
  \ /dev/null\n\n   :0\n   * ^Subject:.*\\$\\$\\$\n   /dev/null\n}\n\n# 将从 david 发出的、关于地毯（rugs）的邮件拷贝给\
  \ amy\n:0 c\n* ^From:.*david@pangaea\\.edu\n* ^Subject:.*rug\n! amy@threeroomco.com\n\
  \n# 将邮件列表邮件放在它自己的文件夹中\n:0:\n* ^To:.*list@mailinglist\\.example\\.com\n$MAILDIR/mailinglist\n\
  ```\n\n- **垃圾邮件条件**—.**列表 19.3 使用了三次垃圾邮件检查。第一次检查邮件正文（注意 `B` 标志）是否包含按顺序出现 `301`、`S`\
  \ 和 `1618` 字符串的行。此行旨在捕获前面提到的失败的 S.1618 法案的引用（这些引用通常从引用法案第 301 节开始）。第二个垃圾邮件过滤器拦截来自\
  \ `badspammer.net` 域名的所有内容，最后一个过滤器拦截其 `Subject:` 标头中包含 `$$$` 的所有内容。请注意，最后两个过滤器都使用了反斜杠（`\\\
  `）转义字符。这三个垃圾邮件测试都会邮件“保存”到 `/dev/null`，这是 Procmail 弃邮件消息的快速方法。不过，这是一个非常无情的邮件过滤器；一旦消息发送到\
  \ `/dev/null`，就无法找回。在使用这些垃圾邮件配方时不需要锁文件，因为邮件并没有被存储；它们正在被销毁。\n\n- **消息拷贝**—.**与其将消息写入文件，不如第二个顶级配方将消息拷贝（注意\
  \ `c` 标志和 `action` 行中的感叹号）到另一个用户。示例中的消息必须满足两个标准：它们必须来自 `david@pangaea.edu` 且其 `Subject:`\
  \ 标头中包含单词 `rug`。如果不符合其中任一条件，消息就不会被拷贝。\n\n- **消息排序**—.**最后一个配方对邮件进行排序；它将所有发往 `list@mailinglist.example.com`\
  \ 的邮件重定向到用户邮件目录中自己的文件夹。许多邮件列表使用邮件列表自身的 `To:` 消息标头；它们使用信封 To 标头将邮件投递给个人收件人。你可能需要检查你订阅的邮件列表的邮件标头，以便找到一种可靠的方法将该邮件重定向到系统上相应的邮件文件夹。\n\
  \nListing 19.3 是一个简单的示例，可能对你没有直接帮助，但你可能会将其作为基础开发出适合你的内容。或者，你可能想尝试使用或适配从其他地方获得的过滤器集。\n\
  \n## 使用现有的过滤器集\n\n为任何特定目的创建一个良好的 Procmail 过滤器集可能是一项繁琐的任务。有几个为特定目的设计的现成过滤器集，你可能比从头开始编写一个，更容易适配由朋友或同事创建的过滤器集。Procmail\
  \ 过滤器集的一些可能来源包括以下：\n\n- **SpamBouncer**—.**该软件包是一组设计用于拦截垃圾邮件的 Procmail 过滤器。这些过滤器足够复杂，实际上以多个文件的形式存在，你可能需要编辑其中一些文件来使用该系统。详情请参阅\
  \ SpamBouncer 文档。你可以从主页 `http://www.spambouncer.org` 下载该包。\n\n- **SmartList**—.**这是一个基于\
  \ Procmail 构建的邮件列表软件包。你可以在 SmartList  FAQ 上阅读更多关于它的信息，`http://www.hartzler.net/smartlist/SmartList-FAQ.html`。\n\
  \n- **Timo's Tips and Recipes**—.**`www`. Timo Salmi 有一个包含 Procmail 技巧和简单配方的网页，地址为\
  \ `http://www.uwasa.fi/~ts/info/proctips.html`。从某种意义上说，它不像 SpamBouncer 或 SmartList\
  \ 那样是一个完整的软件包，但它是了解如何使用 Procmail 执行特定任务的好去处。\n\n- **带注释的示例 Procmail 配方**—.**该网站（`http://handsonhowto.com/pmail102.html`）提供了几个带有描述其操作注释的\
  \ Procmail 配方。**\n\n对 Procmail 配方进行网络搜索可能会发现更多结果，或者你可以从 Procmail 网站（`http://www.procmail.org`）开始并点击链接，直到找到实用的示例过滤器集。\n\
  \n简单的过滤器集可以作为 `.procmailrc` 文件安装在用户的家目录下，或者偶尔作为系统范围的 `/etc/procmailrc` 文件。某些过滤器集（如\
  \ SpamBouncer）依赖于支持文件，因此请确保正确安装它们。\n\n### 警告\n\n大多数过滤器都需要根据你的系统进行自定义，例如调整主机名甚至用户名。许多过滤器集是为了满足特定个人的需求设计的，而你的需求可能不同。例如，你可能希望更快或慢地将垃圾邮件发送到\
  \ `/dev/null`。\n\n### 提示\n\n作为系统管理员，你有创建测试账户的权限。你可以创建一个这样的账户来测试 Procmail 过滤器的操作。你可以通过更改邮件客户端程序的设置来向该账户创建测试消息。\n\
  \n## 调用 Procmail\n\n前面的讨论假设 Procmail 会自动运行并处理所有传入邮件。这通常是正确的——除了“自动”部分。大多数 Linux\
  \  服务器都配置为使用 Procmail 进行本地投递。此设置可以如下调整：\n\n- **Sendmail****.**在 sendmail 的 m4 配置文件中有三个常用的选项来配置\
  \ Procmail。第一个是 `define(PROCMAIL_MAIL_PATH,/usr/bin/procmail)`。这告诉 sendmail 在哪里找到\
  \ Procmail 二进制文件。第二行和第三行是 `FEATURE(local_procmail)` 和 `MAILER(procmail)`，它们共同告诉\
  \ sendmail 在本地投递中使用 Procmail。**\n\n- **Exim****.**在默认 `exim.conf` 文件的二之二处，有一个名为\
  \ `procmail_pipe` 的配置部分。该部分。如果这种情况没有发生，请尝试搜索该部分并验证它是否调用了正确的二进制文件。**\n\n- **Postfix****.**默认\
  \ 配置通过 `main.cf` 中的 `mailbox_command` 选项调用 Procmail。如果你省略了此选项，Postfix 将直接投递邮件，而不涉及\
  \ Procmail。**\n\n可能你不需要调整这些选项，因为它们在大多数 Linux 邮件服务器设置中都是默认包含的。如果你你一台默认不使用 Procmail\
  \ 的计算机，但你想使用它来投递邮件到特定用户的账户，你通常可以在这些用户的家目录下创建一个名为 `.forward` 的文件来启用它。该文件应包含以下行：\n\
  \n```\n \"|IFS=' '&&p=/usr/bin/procmail&&test -f $p&&exec $p -Yf-||exit 75 \\ #username\"\
  \n```\n\n\n\n\n\n你应当确保包含单引号和双引号与此处呈现的完全一致。在这个示例中，`username` 是要处理账户的用户名。\n\n## 总结\n\
  \n邮件投递无疑是今天互联网最重要的功能之一。Linux 在邮件服务器方面提供了大量的选择，包括旧的标准 `sendmail`，以及较新的启动型服务器，如 `Exim`\
  \ 和 `Postfix`。无论你选择使用哪种 `SMTP` 服务器，你都可以配置它来处理各种常见功能，包括接收发送给它的邮件以及将邮件中继到其他系统。你必须注意许多细节，例如服务器将中继邮件的主机范围，以及你可能想要实施的任何反垃圾邮件配置。在\
  \ `SMTP` 服务器接收邮件后，它通常依赖于另一个实用程序 `Procmail` 来进一步处理邮件。`Procmail` 可能会执行垃圾邮件检查、针对符合某些标准的邮件运行程序、转发或复制邮件给他人等。系统管理员和个人用户都可能配置\
  \ `Procmail`，因此它是一个极其灵活的工具。\n\n# 第 20 章 运行 Web 服务器\n\n对于许多人来说，万维维网（World Wide Web，简称为\
  \ Web）与互联网是同义词。事实上，互联网上还有许多其他协议在运行，其中许多在书中有所描述。尽管如此，Web 已经成为互联网上最可见的部分。正由于这个原因，Web\
  \ 服务器对许多组织来说至关重要——没有 Web 网站，公司甚至个人在互联网上的可见度都会变得非常低。\n\nLinux 支持许多不同的 Web 服务器选项，尽管有一个程序（`Apache`）是最常用的。因此，本章将重点关注\
  \ `Apache` 配置，从让 `Apache` 运行所需的基本选项开始。随后，本章将涉及其他主题，例如基于 Linux 内核的 Web 服务器扩展、表单、脚本、安全站点和虚拟域名。本章还涵盖了在某种意义上处于\
  \ Web 服务器之前和之后的问题：生成用于网站服务的内容以及分析你 Web 网站的流量。\n\n虽然使用 Linux 运行一个基础的 Web 服务器并不困难，但高级配置选项足够复杂，单一个章节不足以涵盖所有内容。如果你需要深入\
  \ Web 服务器配置和使用的细微之处，可以阅读你的 Web 服务器的官方文档，或获取有关该主题的书籍，例如 Engelschall 的 *Apache Desktop\
  \ Reference* (Addison Wesley, 2001) 或 Aulds 的 *Linux Apache Server Administration*\
  \ (Sybex, 2001)。还有专门针对更特定 Web 服务器子主题的书，例如 Meltzer 和 Michalski 的 *Writing CGI Applications\
  \ with Perl* (Addison Wesley, 2001)。\n\n## 何时运行 Web 服务器\n\n尽管 Web 服务器在许多情况下都是非常理想的，但并不是所有计算机都需要它们。事实上，它们在所有网络上甚至都不是必需的或理想的。理解何时运行\
  \ Web 服务器将帮助你避免由不必要的 Web 服务器引起的问题，并最大限度地减少你在运行网络投入的精力和费用。\n\nWeb 服务器是一种响应使用 `超文本传输协议\
  \ (HTTP)` 传输文件的请求的程序。出于这个原因，有些人倾向于使用 `HTTP 服务器` 而不是 Web 服务器`。无论名称如何，Web 服务器都在指定的端口（通常是端口\
  \ 80）上监听传入的数据请求。`HTTP` 客户端（通常被称为 `Web 浏览器`），如 `Netscape Navigator` 或 `Internet Explorer`，向\
  \ Web 服务器发送特定文档的请求。Web 服务器从硬盘检索该文档，或者在 `CGI` 脚本的情况下生成文档，并将文件发送给客户端。在某些情况下，客户端可以将信息发回\
  \ Web 服务器进行处理。\n\n结果是 Web 服务器为用户提供了一个 `Web 网站`——一组可以通过一个或多个 `统一资源定位符 (URL)` 访问的文档集合，这些就是你输入到\
  \ Web 浏览器地址栏的 Web 地址。URL 最频繁地以 `http://` 开，但某些以其他字符串开头，例如 `ftp://`。Web 服务器处理 `http://`\
  \ 和 `https://` URL；大多数其他 URL 表示将使用另一种协议，如 `FTP`。\n\n基于这些信息，何时运行 Web 服务器的问题似乎可以归结为何时建立\
  \ Web 网站。如果你运行一个 Web 服务器，并在该 Web 服务器上放置适当的文件，以便用户可以检索有意义的内容，你就拥有了一个 Web 网站。这对于今天大多数业务甚至许多个人来说都是不可或缺的。Web\
  \ 网站提供了与客户、供应商以及其他可能寻求有关你组织、产品或服务的信息的通信方式。\n\nWeb 网站，因此 Web 服务器，对 `内部` 通信也有用。你可能想创建一个仅在本地网络内访问的\
  \ Web 网站，可以在上面放置内部通信的重要信息，例如个人员工的时间表、会议或研讨会计划等。这个内部 Web 服务器在物理上可能与托管外部 Web 网站的服务器不同，或者你可能让一台计算机兼顾，正如接下来的“处理虚拟域名”部分描述的那样。\n\
  \n需要记住的重要区别是 Web `站点 (site)` 和 Web `服务器 (server)` 之间。Web 网站构成你在网上存在的文档。这些文档与一组特定的\
  \ URL 相关，你可能想将它们与你组织的域名绑定。另一方面，Web 服务器是与 Web 网站相关的软件或硬件。你的组织中完全可以在不运行 Web 服务器的情况下拥有\
  \ Web 网站。你可以通过使用 `Web 托管服务` 实现这一目标。这是一个运行 Web 服务器的 `ISP`，该服务器响应指向你 URL 的请求。这之所以行得通，是因为正如“处理虚拟域名”中描述的那样，单个\
  \ Web 服务器可以对指向不同主机名的请求做出不同的响应。你可以配置你的 `DNS` 服务器（第 18 章“通过 DNS 管理域名”中描述），将与 Web 网站关联的主机名指向托管服务的计算机。例如，如果托管服务在\
  \ `10.102.201.1` 上运行其 Web 服务器，并且你希望域内的 `www` 地址与你的 Web 网站关联，你可以创建一个如下的 `DNS` 记录：\n\
  \n```\n www            IN  A       10.102.201.1\n```\n\nWeb 托管服务必须配置其系统以对你的 Web\
  \ 地址做出适当响应。你还需要访问 Web 托管服务的计算机，以便上传你的 Web 页面。\n\n\n\n\n与运行自己的 Web 服务器相比，使用 Web 托管服务具有某些优势。例如，你不需要具备处理\
  \ Web 服务器所需的网络带宽。如果你的组织缺乏高速或可靠的 Internet 连接，这一点可能非常重要。（`高速` 和 `可靠` 这两个术语的具体含义是主观的；对于家庭用户来说，每月停机\
  \ 5 小时的 200Kbps 服务是可以接受的，但对于像 IBM 这样的大型公司来说是不行的。）使用 Web 托管服务还免去了你配置和维护自己的 Web 服务器计算机的需要。缺点是，Web\
  \ 托管服务是收费的——从小型网站的每月几美元到非常大且繁忙网站的每月数千美元甚至更多不等。Web 托管服务可能会对你的网站设置限制。例如，非常低端的 Web\
  \ 托管账户可能不支持 `CGI` 脚本或 `SSL` 加密。\n\n另外两个值得提到的外部使用方案。一种是托管服务（co-location），你拥有一台计算机，但将其放置在自己的场所之外，通常位于\
  \ ISP 的办公室。这样，你的 Web 服务器计算机就可以受益于高速且可靠的连接，你可以按照认为必要的任何方式对其进行配置。在尺度的另一端，是住宅和许多低端商业\
  \ Internet 账户默认提供的 Web 页面。这些页面通常在 `URL` 中包含 ISP 的名称，例如 `http://www.abigisp.net/~yourname/`。它们的优势是个人或小型企业在\
  \ Web 上建立存在的一种廉价方式，因为它们是 Internet 访问包的标准配置。不过，它们允许的 Web 页面空间通常非常有限，而且大多数企业希望在 `URL`\
  \ 中看到自己的名称，而不是 ISP 的名称。\n\n你还应该考虑内部 Web 服务器的后果和需求。如果你确实需要一个用于内部通信的网站，请务必运行一个。尽管如此，你仍然应该采取积极措施来配置这样的网站；不要依赖默认开箱即用的\
  \ Web 服务器配置。取决于你如何安装它们，某些 Linux 发行版会默认安装 Web 服务器。此类配置具有某些缺点。Web 服务器消耗了磁盘空间，可能还消耗了你可能更希望投入其他任务的内存。这些未使用的\
  \ Web 服务器 也是潜在的安全漏洞。另一方面，某些发行版使用 Web 服务器为本地用户提供帮助文件，因此它们即使在工作站上也可以发挥正当作用。但作为一个一般原则，不应在工作站上安装\
  \ Web 服务器软件，而仅安装在你想要运行网站的计算机上。\n\n# Linux Web 服务器选项\n\n与大多数类型的服务器一样，Linux 提供了多种可用的\
  \ Web 服务器。这些服务器范围从奇特、专门的程序到通用工具不等。有些程序规模很小，仅支持有限的选项；另一些由于是功能完备的大软件包。以下是一些值得关注的 Linux\
  \ Web 服务器选项：\n\n* `Apache`。这台 Web 服务器随于所有主要的 Linux 发行版发布，并且是在你在系统安装期间要求安装 Web 服务器时默认安装的包。根据\
  \ Netcraft (`http://www.netcraft.com`) 的数据，2002 年 3 月 Web 上 65% 的活跃站点使用了 Apache。由于这些原因，本章将重点介绍\
  \ Apache。这台服务器功能非常强大，支持通常的一系列高级选项，如 `CGI` 脚本和 `SSL` 安全。Apache 的主网站是 `http://httpd.apache.org`。\n\
  \n* `Roxen`。这是一个功能齐全的 Web 服务器，在许多方面可以与 Apache 相媲美。它具有基于 Web 的配置界面，这可能对一些新管理员具有吸引力。你可以在\
  \ `http://www.roxen.com/products/webserver/` 了解更多信息。\n\n* `thttpd`。这台服务器比 Apache\
  \ 小得多（大小约为 50KB，而 Apache 为 300KB，这两个数字都取决于编译选项）。它的设计目标是快速和高效。尽管体积较小，它支持 `CGI` 脚本，但不支持\
  \ `SSL` 安全。你可以在 `http://www.acme.com/software/thttpd/thttpd.html` 了解更多信息。\n\n* `Zeus`。大多数\
  \ Web 服务器都是开源的，但 Zeus 是个例外；它是一个售价 1700 美元的商业产品。Zeus 网站 (`http://www.zeus.co.uk/products/`)\
  \ 声称 Zeus 的扩展性比大多数 Web 服务器更好。\n\n* `基于内核的 Web 服务器`。出现了一类 Web 服务器，它们利用特殊的 Linux 特性来处理\
  \ Web 服务。由于提供 Web 页的主要工作是将磁盘文件发送到网络端口，内核可以比外部程序更高的效率完成任务，因此开发了各种基于内核的 Web 服务器。后续章节“配置\
  \ kHTTPd”将详细讨论这种方法。\n\n* `非传统服务器`。某些产品使用 `HTTP` 来提供比传统 Web 服务器更专门的功能。例如，第 16 章“远程维护系统”中涵盖的远程管理工具在某种意义上就是\
  \ Web 服务器。这些产品通常运行在传统 Web 服务器端口 80 外，但可以使用 Web 浏览器访问。本章不涵盖此类服务器。\n\n如果你有一些特别特殊的需求，你可能会找到适合的\
  \ Web 服务器；人们为了各种特殊或离奇的需求编写了 Web 服务器。进行 Web 搜索可能会带来一些有用的线索。\n\n通常，Apache 是 Web 服务器的良好选择，因为它的流行以及它是所有主流\
  \ Linux 发行版自带的。小型网站或关注资源使用的网站可能想要考虑更轻量级的 Web 服务器，例如 `thttpd`。不过，如果你只是想运行一个不需要 Apache\
  \ 高级功能的低流量网站，如果这种轻量级服务器易于安装、配置和使用，这种方法可能是合理的。由于 Apache 如此常见，尽管它的功能远超你的需求，它通常是更更容易的选择。\n\
  \n\n\n\n如果你选择使用 Apache 以外的 Web 服务器，本章可能对你有帮助，因为你的服务器某些功能可能与 Apache 相似，且广义上的配置特性也可能相似。然而，处理配置文件的具体方式会有所不同。\n\
  \n## Apache 基础配置\n\n即使你需要在你的网站上使用高级功能，也应该从让 Apache 在基础层面运行开始。一旦 Apache 能够提供 `static`\
  \ Web 页面（即那些不使用脚本等高级功能的页面），你就可以开始调整配置以实现你所需的更高级的功能。基础 Apache 配置涉及运行服务器以及在服务器配置文件中设置基本选项。你还应该了解一些\
  \ Apache `modules`（模块），它们是处理特定类型任务的扩展。幸运的是，大多数发行版附带的 Apache 配置在极少或无需更改的情况下即可工作，但你可能需要对这些功能进行调整，以根据你的特定需求定制服务器。\n\
  \n## 理解 Apache 配置文件\n\nApache 文件通常称为 `httpd.conf`。不同的发行版使用的文件位置不同，但格式是相同的。Caldera\
  \ 和 SuSE 将文件存储在 `/etc/httpd`；Debian 和 Slackware 使用 `/etc/apache`（Slackware 提供了一个名为\
  \ `/etc/apache/httpd.conf.default` 的示例文件，你必须对其重命名并修改）；而 Mandrake、Red Hat 和 TurboLinux\
  \ 使用 `/etc/httpd/conf/`。\n\n无论位置如何，`httpd.conf` 都由井号（`#`）开头的注释和如下格式的配置选项行组成：\n\n\
  ```\n Directive Value\n```\n\n`Directive`（指令）是你想要调整的配置选项名称，例如 `Timeout` 或 `StartServers`。`Value`（值）可以是数字、文件名或其他任意字符串。某些指令允许你设置多个子选项。这些由角括号（`<>`）括起的指令名称指示，如下：\n\
  \n```\n <Directory /home/httpd/html>\n    Options FollowSymLinks\n    AllowOverride\
  \ None\n</Directory>\n```\n\n最后一行使用第一个相同的指令名称，但没有任何选项，并以斜杠（`/`）开头表示该指令块的结束。\n\n\
  在某些情况下，一些额外的 Apache 配置文件可能很重要。它们通常存储与 `httpd.conf` 相同的目录下，包括以下内容：\n\n* `access.conf`。这本质上是一个补充配置文件。它在\
  \ `httpd.conf` 中通过 `AccessConfig` 指令设置。`access.conf` 文件传统上用于 `<Directory>` 指令，该指令决定\
  \ Apache 如何处理对指定目录的访问。如今许多配置将此文件留空或使用 `AccessConfig` 将 Apache 指向文件的 `/dev/null`，从而有效地禁用它。\n\
  \n* `mime.types`。HTTP 依赖于一种称为多用途互联网邮件扩展（MIME）的文件类型识别系统，允许 Web 服务器告知 Web 浏览器如何处理文件。例如，`text/plain`\
  \ 标识文件包含纯文本，`image/jpeg` 标识为联合图像专家小组（JPEG）图形文件。`mime.types` 文件包含 MIME 类型到文件名扩展名的映射。例如，`.txt`\
  \ 和 `.asc` 文件扩展名与 `text/plain` MIME 类型相关。如果这些映射设置不当，Web 浏览器在遇到某些文件类型时可能会困惑。默认文件对于你可能放置在\
  \ Web 页面上的大多数材料有效，但如果你想提供不常见的文件类型，可能需要编辑或添加映射。\n\n* `magic`。此文件提供了 Apache 确定文件 MIME\
  \ 类型的另一种方法。Apache 可以检查文件内容以寻找文件类型的特征标记。许多文件类型具有某些关键（或“魔术”）字节序列，`magic` 文件列出了这些序列，并将其转换为纯文本格式，以便使用文本编辑器编辑该文件。除非你理解其格式，否则最好不要动此文件，该格式超出了本章的范围。\n\
  \n## 独立运行与超级服务器配置\n\n第 4 章“启动服务器”描述了运行服务器的不同方法。Apache 可以按照该章中讨论的任何方式运行——通过超级服务器（super\
  \ server）、SysV 初始化脚本或自定义启动脚本。大多数发行版使用 SysV 启动脚本或自定义启动脚本，因为这些运行 Apache 的方法会导致服务器持续运行，从而对传入的请求做出快速响应。如果你喜欢，可以选择从超级服务器运行\
  \ Apache，事实上 Debian 在你安装包时提供了以两种方式运行 Apache 的选项。从超级服务器运行 Apache 会导致对的 Web 页面请求响应缓慢，因为超级服务器必须为每个请求启动\
  \ Apache。Apache 开发者也建议不要使用这种配置。\n\n### TIP\n\n通过超级服务器运行 Web 服务器引起的延迟可以通过更轻量级的 Web\
  \ 服务器（如 `thttpd`）或基于内核的 Web 服务器来减少或消除。因此，如果你出于安全考虑想使用超级服务器，可能希望更认真地考虑比 Apache 更轻量的\
  \ Web 服务器。\n\n虽然第 4 章涵盖了从超级服务器或独立运行服务器的内容，但有一个必须设置的 Apache 特有选项：`ServerType`。此 Apache\
  \ 配置文件选项可以设置为 `standalone` 或 `inetd`。如果你没有正确设置此选项，Apache 的行为可能会异常或无法响应请求。如果你想更改配置，请务必调整配置文件，禁用以前的启动方法并启用新的启动方法。例如，要从\
  \ SysV 启动切换为从 `inetd` 运行 Apache，你应该更改配置文件，使用 SysV 启动脚本关闭 Apache，禁用 SysV 启动脚本，编辑\
  \ `/etc/inetd.conf` 以启用 Apache 并重启 `inetd`。如果你忘记了这些步骤中的任何一步，可能会发现 Apache 工作异常，或继续使用旧配置运行。\n\
  \n### NOTE\n\n某些发行版将 Apache 可执行文件称为 `apache`，另一些称为 `httpd`。如果你更改了启动脚本或想直接关闭 Apache，你可能需要检查这两个名称。\n\
  \n## 设置常用配置选项\n\n默认 Apache 配置在大多数系统上都能工作。安装服务器并启动它后，Apache 将从其默认目录提供文件（通常是 `/home/httpd/html`；更多信息请参阅后续章节“设置服务器目录选项”）。该目录通常包含一组默认文件，宣布\
  \ Apache 服务器已存在但尚未配置。你几乎肯定想要用这些文件替换为构成你自己网站的文件，正如接下来的章节“制作值得提供的内容”中所描述的那样。\n\n有一些你想要调整的通用\
  \ Apache 选项以影响其整体行为。这些包括：\n\n* `ServerType`。该指令已经提到过，但值得重申。如果你更改了运行 Apache 的方式，必须调整此选项以适应：`standalone`\
  \ 或 `inetd`。\n\n\n\n\n*   `User` 和 `Group`—. 每一台 Linux 服务器都以特定的用户和组身份运行。你可以通过这些指令告诉\
  \ Apache 以特定的用户和组身份运行。大多数发行版将 Apache 设置为以 `nobody` 用户或具有少数权限的自定义用户运行，以减少当黑客找到某种方法让\
  \ Apache 执行你不希望它执行的操作时可能遭受的损害。通常情况下，最好保持这些选项不变。\n\n### 注意事项\n![NOTE](img/note.gif)\n\
  作为一种安全措施，大多数 Apache 二进制文件在编译时已确保无法以 `root` 身份运行。\n\n*   `ServerTokens`—. Apache\
  \ 可以通过设置此指令，向调用者提供关于其运行平台的不同程度的信息。大多数发行版将其设置为 `ProductOnly`，这不会提供关于 Apache 运行的操作系统的任何信息。你可以将其设置为\
  \ `Min`、`OS` 或 `Full` 以提供逐渐增多的信息级别，但通常最好保持为 `ProductOnly`。\n\n### 警告\n![WARNING](img/warning.gif)\n\
  不要假设将 `ServerTokens` 设置为 `ProductOnly` 就会隐藏你的操作系统选择。黑客可以使用流量分析工具推断有关你操作系统的信息（主要是你是否正在运行\
  \ Linux，可能还有内核版本号）。其他服务器也可能提供关于你正在运行什么操作系统或发行版的线索。\n\n*   `MinSpareServers` 和 `MaxSpareServers`—.\
  \ 在独立模式下运行时，Apache 会启动多个自身的实例，以便对传入的 HTTP 请求做出快速响应。每个实例可以处理单个请求。这些指令设置了在任何时刻运行的这些“空闲”服务器的最小最大数量。如果运行且未使用的服务器少于\
  \ `MinSpareServers`，主 Apache 进程就会启动另一个。如果运行且未使用的服务器多于 `MaxSpareServers`，则会杀掉空闲进程以使数量恢复正常。将这些数字设置得太低可能会在在使用频繁的服务器上负载激增时导致响应缓慢，而设置得太高则可能在服务器缺乏足够内存来处理所有实例时导致性能下降。大多数发行版设置的默认值为\
  \ `5` 和 `10`。如果你的服务器使用非常轻量，你可以尝试较低的值；如果服务器使用非常频繁，可以尝试更高的值。请注意，任何时刻运行的 Apache 进程总数可能高于\
  \ `MaxSpareServers`，因为其中某些进程可能连接到了客户端，因此不是空闲的。一个繁忙的网站或流量定期激增的网站可能需要大量的交换空间来处理所有服务器实例。如果\
  \ `MaxSpareServers` 的值较高，可能会增加对内存以及交换空间的需求。\n\n*   `MaxClients`—. 此指令设置了任何时刻连接到系统的客户端总数。默认值通常约为\
  \ `150`，但你可以根据硬件和流量向上或向下调整。如果你的网站变得非常流行，将此值设置得太高可能会导致系统性能下降，但设置得太低则会导致客户端无法连接到你的网站。与\
  \ `MaxSpareServers` 一样，如果流量水平上升，高 `MaxClients` 值可能要求你有大量的交换空间或内存。\n\n### 注意事项\n\
  ![NOTE](img/note.gif)\n`MaxClients` 设置的连接数与 Apache 支持的 Web 浏览器数量不同。单个 Web 浏览器可以打开多个连接（最多\
  \ 8 个），每个连接都会消耗通过 `MaxClients` 分配的连接之一。\n\n*   `Listen`—. 默认情况下，Apache 绑定到所有活动网络接口上的端口\
  \ 80。你可以通过此指令将其绑定到额外的端口或接口。例如，`Listen 192.168.34.98:8080` 使 Apache 监听与 `192.168.34.98`\
  \ 地址关联的接口上的 8080 端口。`Listen 8000` 将 Apache 绑定到所有接口上的端口 8000。\n\n*   `BindAddress`—.\
  \ 如果你的系统有多个网络接口，可以通过此指令将 Apache 绑定到一个接口。例如，`BindAddress 192.168.34.98` 将 Apache\
  \ 绑定到与 192.168.34.98 关联的接口。`BindAddress *` 是默认值，它将 Apache 绑定到所有接口。\n\n### 提示\n![TIP](img/tip.gif)\n\
  如果你需要在工作站上仅供本地使用的 Apache，可以使用 `BindAddress 127.0.0.1` 防止其被其他计算机访问。尽管如此，在本地访问 Apache\
  \ 时必须使用 http://127.0.0.1 或 http://localhost 作为你的 URL。\n\n*   `Port`—. 此指令告诉 Apache\
  \ 应该监听哪个端口。默认值是 `80`。\n\n*   `ServerAdmin`—. 你应该通过此指令指定可以联系到你的电子邮件地址。默认值通常是 `webmaster`，你可以按照第\
  \ 19 章“推送邮件协议：SMTP”中描述的方案，使用邮件服务器的别名功能将其别命名为服务器上的普通用户账户。该电子邮件地址通常对用户是不可见的，但它会在某些类型的错误消息中返回。\n\
  \n*   `ServerName`—. 如果此指令与默认配置到计算机中的主机名不同，则你可以将此指令设置为计算机真实的 DNS 主机名。\n\n*   `DefaultType`—.\
  \ 如果 Apache 无法根据扩展名或魔数序列确定文件的 MIME 类型（如前文“理解 Apache 配置文件”中描述），它将返回由 `DefaultType`\
  \ 指令指定的 MIME 类型。这通常是 `text/plain`，但如果你的网站托管了许多可能无法始终正确识别的特定类型文件，你可能想要更改它。\n\n* \
  \  `HostnameLookups`—. 此选项可以 `On` 或 `Off`，它决定 Apache 是否查找并记录连接到它的客户端的主机名。在分析日志文件时（如后续章节“分析服务器日志文件”部分所述），拥有主机信息可能很方便，但执行查找需要一些时间和网络资源，因此你可能希望放弃使用此功能。\n\
  \n*   `LogLevel`—. Apache 会记录其活动信息。你可以通过将此指令设置为 `debug`、`info`、`notice`、`warn`、`error`、`crit`、`alert`\
  \ 或 `emerg` 来设置发送到错误日志的信息量（按递减排序）。默认通常为 `warn`。此设置不影响访问日志。\n\n*   `CustomLog`—.\
  \ 此指令接受两个选项：文件名和发送到该日志文件的信息格式。相关的日志文件保存访问日志——即哪些系统请求了 Web 页面。格式可以是 `common`、`agent`、`referer`\
  \ 或 `combined`。为了更高的灵活性，`LogFormat` 指令允许你创建自己的日志文件格式。你可以使用多个 `CustomLog` 指令创建多个日志文件。\n\
  \n这些是 `httpd.conf` 中主要的通用配置选项。后续章节将描述一些额外的选项，更多是超出本章范围的生僻或专门选项。你应该查阅 Apache 文档或关于\
  \ Apache 的书籍以了解更多此类指令。\n\n## 设置服务器目录选项\n\nURL 由二到四个组成部分组成：\n\n*   协议—。URL 中的 `http://`、`ftp://`\
  \ 或类似的部分指定了要使用的协议。本章讨论 Web 服务器，它们主要处理 `http://` URL。（安全站点使用 `https://`。）\n\n\n\n\
  \n\n- **主机名** — `URL` 组件中的主机名部分与运行 Web 服务器的计算机的主机名相同。例如，如果 `URL` 为 `http://www.threeroomco.com/thepage/index.html`，则\
  \ Web 服务器的主机名为 `www.threeroomco.com`。（一台计算机可以通过设置多个 `DNS` A 地址记录或 CNAME 别名来拥有多个主机名，这在第\
  \ 18 章中有所描述。）\n\n- **文件名** — `HTTP` 请求本质上是一个文件传输请求。在 `URL` 中的主机名之后是文件名，它通常与目录名关联。例如，在\
  \ `http://www.threeroomco.com/thepage/index.html` 中，文件（包括其目录引用）是 `thepage/index.html`。注意，尽管有一个斜杠（`/`）分隔了主机名和文件名，但该斜杠并不表示文件名引用相对于\
  \ Linux 文件系统的根目录；它是相对于网站文件目录的根目录。如果省略了文件名，大多数 Web 服务器将返回一个默认 Web 页面，这由稍后描述的 `DirectoryIndex`\
  \ 指令指定。\n\n- **额外信息** — 某些 URL 包含特定 `URL` 类型的额外信息。例如，`HTML` 页面可以包含位置锚点（通过井号和锚点名称指定），`FTP`\
  \ URL 可以包含用户名和密码。\n\n有多个 Apache 配置选项允许你设置存储 Web 服务器文件的目录。你还可以在 URL 中使用变体地址形式，以指示\
  \ Apache 使用多个备用目录中的哪一个来检索文件。如果你没有正确设置这些选项，部分或所有 Web 页面将无法以你预期出现。相关的 `httpd.conf`\
  \ 选项包括：\n\n- `ServerRoot` — 该指令设置了 Apache 自身的二进制文件所在的目录树根目录。在大多数 Linux 安装中，默认值为\
  \ `\"/usr\"`，你不应该更改此设置。\n\n- `DocumentRoot` — Apache 在此指令指定的目录查找静态 Web 页面文件。默认通常是\
  \ `\"/home/httpd/html\"` 或类似内容。（目录名通常在 `httpd.conf` 文件中用引号括起来。）\n\n### 警告\n\n![警告](img/warning.gif)\n\
  \n在你的 `DocumentRoot` 指令中不要包含尾随斜杠（`/`）。虽然这是引用目录的有效方式，但可能会导致 Apache 运行异常。\n\n- `UserDir`\
  \ — 如果 Web 浏览器指定的文件名以波号（`~`）开头，Apache 将文件名的第一个部分解释为用户名，并尝试在用户家目录的子目录下查找文件。`UserDir`\
  \ 指令指定用于此类访问的子目录名称。例如，如果 `UserDir` 设置为 `public_html`，且远程用户在 Web 浏览器中输入 `http://www.threeroomco.com/~abrown/photos.html`，那么\
  \ Apache 将尝试返回 `abrown` 家目录下的 `public_html/photos.html` 文件。如果将此指令设置为 `disabled`，则禁用用户目录。你可以通过在\
  \ `disabled` 后面跟随要禁用的用户名列表来禁用某些用户目录。此指令通常包含在 `<IfModule>` 指令中，以检查是否加载了处理用户目录的相应\
  \ Apache 模块。（下一节“加载 Apache 模块。你可以通过输入关键词搜索他人编写的模块；该网站会返回模块列表，包括指向模块维护者网站的链接。\n\n\
  # 配置 kHTTPd\n\n\n\n\n\n泛指 Unix 系统，特别是 Linux，对两种类型的进程有明确的区分：`kernel space`（内核空间）进程和\
  \ `user space`（用户空间）进程。内核处理内核空间进程。如果内核处理的事件触发了此类进程，该进程可以非常迅速启动。相比之下，用户空间进程在启动以及向内核传回重要数据时会产生开销。这一事实对于许多进程来说并不是问题，因为用户空间进程通常在用户空间*内部*进行大量的处理。调用用户空间程序的开销为了安全和稳定性也是可以容忍的——内核空间进程对硬件、文件系统等具有特权访问权限，因此如果它们包含错误或被未经授权的人控制，可能会造成破坏性影响。\n\
  \n寻找优化 Web 服务器性能方法的研究发现，尽管像 Apache 这样的 Web 服务器是用户空间程序，但它们的大部分工作是在内核空间或在内核与服务器之间的调用中完成的。图\
  \ 20.1 展示了内核与传统用户空间 Web 服务器之间的请求流。事实上，图 20.1 大大简化问题。例如，Apache 的读取请求会导致内核执行相当复杂的文件读取操作。最终，在一个简单的传输（许多网站最常见的类型）中，Apache\
  \ 仅仅是从内核接收文件然后将其直接送回内核。这是对 CPU 时间、内存和其他资源的巨大浪费。\n\n![用户空间 Web 服务器在内核与用户空间服务器之间产生大量通信。](img/20fig01.gif)\n\
  \n**图 20.1. 用户空间 Web 服务器在内核与用户空间服务器之间产生大量通信。**\n\n为了更好地优化 Web 服务器的性能，开发者创建了运行在内核*内部*的简单\
  \ Web 服务器。这消除了 Web 服务器与内核之间的通信，从而简化了提供 Web 页面的过程并（希望）提升了性能。事实上，2.4.*x 及更高版本的内核包含这样一个基于内核的\
  \ Web 服务器：kHTTPd，其总部位于 [`www.fenrus.demon.nl`](http://www.fenrus.demon.nl)。该服务器通过向\
  \ `/proc/sys/net/khttpd` 目录下的文件写入数据进行配置。要使用它，请遵循以下步骤：\n\n1. 通过将其包含在 Linux 内核配置中来构建\
  \ kHTTPd 支持。相关选项位于 Networking Options 菜单下，称为 Kernel HTTPd Acceleration。你可以将其作为模块构建或直接编译进内核文件。\n\
  2. 修改你的 Apache 配置，使其监听端口 8080，或除常规 80 端口外的某些方便端口。\n3. 使用启用了 kHTTPd 的内核重启，或加载 kHTTPd\
  \ 内核模块。根据你的配置，它可能会自动加载，或者你可能需要输入 `insmod khttpd`。\n4. 告诉 kHTTPd 监听端口 80 的传入请求。通过输入\
  \ `echo 80 > /proc/sys/net/khttpd/serverport` 实现。\n5. 输入 `echo 8080 > /proc/sys/net/clientport`\
  \ 告诉 kHTTPd 将其无法处理的请求传递到端口 8080。（如果你在步骤 2 中使用了 8080 以外的端口，你在此处指定的端口应与之匹配。）\n6. 通过输入\
  \ `echo /home/httpd/html > /proc/sys/net/khttpd/documentroot` 告诉 kHTTPd 在哪里找到未加密的静态文件。你可以根据需要更改目录名称（此示例中为\
  \ `/home/httpd/html`）。确保在此处指定的目录与 `httpd.conf` 中 `DocumentRoot` 指令指定的目录相同。\n7. 如果你的网站包含\
  \ PHP3 或安全 HTML 文档，重复步骤 6，但将这些文档所在的目录名 echo 到 `/proc/sys/net/khttpd/dynamic` 文件。\n\
  8. 输入 `echo 1 > /proc/sys/net/khttpd/start`。这会启动 kHTTPd 服务器；它等同于使用 Apache SysV 启动脚本。\n\
  \n你可能想要创建一个自定义的 SysV 或本地启动脚本，以便在系统启动时自动处理第 4 到第 8 步。无论你是手动还是通过脚本启动 kHTTPd，结果都是它处理简单请求——那些存在于指定目录中的普通文件、不是\
  \ CGI 脚本等的请求。如果请求不符合 kHTTPd 的要求，kHTTPd 将通过步骤 2 和 5 中指定的端口号将请求传递给用户空间 Web 服务器。在处理这些文件类型时会增加一些开销，因此如果你的网站主要处理\
  \ CGI 脚本或其他非静态文件，kHTTPd 就不值得使用。事实上，即使在流量中等量的网站上，kHTTPd 可能也不值得使用；只有当 Apache 难以跟上对你网站的请求时，它才最值得考虑。此外，kHTTPd\
  \ 是官方实验性的，因此它可能没有 Apache 或其他经过完全调试的用户空间 Web 服务器那样可靠。最后，因为它运行在内核空间，如果 kHTTPd 中存在错误，其风险比\
  \ Apache 中存在错误的风险大得多。对于真正安全的网站，你最好坚持使用 Apache 这样经过充分测试的用户空间程序。\n\n尽管 kHTTPd 是最容易获取的内核\
  \ Web 服务器，但它不是唯一的。Red Hat 的 TUX 产品是另一个收到好评的产品，研究人员正在开发更多产品。在未来，我们可能会看到多种 Linux 基于内核的\
  \ Web 服务器。\n\n# 处理表单和脚本\n\n虽然静态内容非常常见且重要，但它并不是 Web 服务器被调用处理的唯一文件类型。有些网站的性质要动态得多。例如，像\
  \ Google 这样的搜索网站允许你在表单中输入信息、点击按钮，并接收由 Web 服务器专门为你构建的定制化 Web 页面。如果你需要创建此类网站，理解如何配置你的\
  \ Web 服务器来妥善处理它们至关重要。这个主题足够复杂，本节只能提供基础概述，并对配置此类网站时使用的 Apache 选项提供一些提示。欲需更多信息，你需要查阅更专业的文档。\n\
  \n## 理解静态内容、表单和 CGI 脚本\n\n前面的部分重点关注静态内容。这个术语指的是不属于特定用户的文件，且不与用户进行任何复杂交互的文件。静态内容的示例包括：\n\
  \n*   `HTML` 文件——*超文本标记语言 (HTML)* 是 2002 年 Web 上文本内容最常见的形式。`HTML` 文件通常具有 `.htm`\
  \ 或 `.html` 结尾的扩展名，它们基本上只是包含了一些保留用于指示特殊格式的字符序列的纯文本文件。例如，`<P>` 标记段落的开始，`</P>` 标记段落的结束。`HTML`\
  \ 还提供了通过嵌入 URL 以链接到 Web（或整个互联网）上的其他文档的机制。用户可以点击链接来读取被链接的文件，根据浏览器的功能和设置，某些（如许多图形）可以自动显示。接下来的章节“HTML\
  \ 和其他 Web 文件格式”将更详细地描述 `HTML`。\n\n\n\n\n\n### 静态内容\n\n- **文本文件**：纯文本文件通常具有 `.txt`\
  \ 扩展名。Web 服务器可以提供纯文本文件，Web 也可以显示它们，尽管没有 HTML 文件具备的格式和链接。\n- **图形文件**：HTML 文件经常包含指向各种格式图形文件的链接。这些文件也是静态文件。注意，某些图形文件包含动画。尽管这些是动态的，但它们仍然属于静态内容；“静态”一词指的是文件中的数据，而不是数据在\
  \ Web 浏览器中显示时的外观。\n- **杂文档文件**：网页有时包含指向 Adobe 便携文档格式 (PDF) 文件、Microsoft Word 文件、压缩文件（如\
  \ `.zip` 文件或 tarball）等链接。某些浏览器可以将这些文件中的加载到适当的应用程序中，例如 PDF 查看器或文字处理器。其他文件如果点击了链接，则可以保存到磁盘。\n\
  \n这些都是静态内容的示例，可以从你的 `DocumentRoot` 目录、`UserRoot` 目录或它们的子目录中提供。当用户请求这些文件之一时，数据流很大程度上是单向的：客户端请求文件，服务器交付该文件。为了确保无误，文件请求本身包含数据，但在该请求数据之外，数据流是单向的。\n\
  \n### 动态内容\n\n相比之下，动态内容是为单个用户定制的，或者允许数据的双向交换。你可能以前在 Web 上遇到过动态内容。示例包括：\n\n- **Web\
  \ 搜索引擎**：当你输入搜索引擎的 URL 时，Web 服务器交付一个包含表单的 Web ，你可以在其中输入搜索术语。当你点击搜索按钮时，你输入的术语会被返回到\
  \ Web 服务器，服务器处理这些数据以创建一个自定义的 Web 并交付到你的 Web 浏览器。\n- **电子商务网站**：点击零售商网站上的“购买”按钮会导致你的浏览器请求一个\
  \ URL，零售商的服务器使用该 URL 将条目注册到“购物车”。零售商服务器和你的 Web 浏览器在随后的交互中协调动作，以为你提供购买信息；向零售商提供你的地址、信用卡号等；并确认你的购买。细节在不同网站之间差异很大，但其核心交互与\
  \ Web 搜索引擎中的交互相似——Web 服务器创建自定义内容，你的 Web 浏览器将数据返回给 Web 服务器。\n- **个性化网站**：某些网站提供个性化的“登录”，允许\
  \ Web 服务器交付你想看到的内容，而不是通用内容。例如，如 Slashdot (http://slashdot.org) 等网站允许你注册并对显示的数据类型和数量提供偏好。这些网站通常通过在你的计算机上存储一个\
  \ `cookie` 来在未来唯一标识你。当你请求一个 Web 页面时，你的浏览器返回 cookie，因此 Web 服务器就可以生成自定义内容。（电子商务网站甚至搜索引擎也可能使用\
  \ cookie。）\n\n这些只是动态 Web 网站的少数示例。可能性主要限于 Web 网站设计者的想象力。从 Web 服务器的角度来看，动态站点和静态站点的主要区别在于，动态站点需要根据用户在之前的交互或在\
  \ URL 中发送的输入即时创建 HTML（或其他文档格式）。为了实现这一点，可以使用几种机制：\n\n- **Web 表单**：Web 表单是一个提供按钮、数据输入字段、列表和其他输入数据机制的\
  \ Web 页。搜索引擎通常提供一个较小的文本输入字段和一个点击以开始搜索的按钮。电子商务网站通常提供更广泛的表单，包括文本输入字段和选择列表（例如输入你的省份）。Web\
  \ 表单用 HTML 编码，HTML 可能是静态生成的也可能是动态生成的。即使是固定的 Web 表单最终也会反馈到动态系统中。\n- **CGI 脚本**：通用网关接口\
  \ (CGI) 是用于与 Web 浏览器交互生成动态内容程序的常用工具。这些脚本可以使用几乎任何语言编写。（事实上，可以使用编译型语言而不是脚本语言，尽管像 Perl\
  \ 等脚本语言用于编写 CGI 脚本非常流行）。当用户输入相应的 URL 时，Web 浏览器调用 CGI 脚本。然后 CGI 脚本可以从用户那里接收输入，调用\
  \ Web 服务器上的其他程序，并生成适当的响应页面。\n- **SSIs**：服务器端包含 (SSIs) 是动态内容的基本形式。SSIs 并不是像 CGI 脚本那样动态生成完整的\
  \ Web 页，而是用于修改模板脚本。这使得 SSIs 比 CGI 脚本不灵活，但它们对于执行诸如在原本静态的 Web 页中嵌入当前日期等任务非常有用。\n\n\
  还有其他形式的动态内容。特别是存在许多 CGI 脚本的替代方案，但 CGI 脚本仍然是生成动态内容的一种极其流行的方式。注意，CGI 脚本可能会创建包含 Web\
  \ 表单的页面；与其说是竞争的动态内容形式，不如说是客户端和服务器之间数据交换系统的两个方面。\n\n### 设置脚本和表单选项\n\n为了使用 CGI 脚本，你必须告诉\
  \ Apache 你想使用它们。必须配置 Apache 在 URL 中提供其文件名时运行 CGI 脚本，处理要发送回 Web 浏览器的脚本输出，并可能接收来自\
  \ Web 浏览器的返回数据以返回给 CGI 脚本进行另一轮操作。Apache 的角色是中间人，幸运的是，它的配置并不困难。你必须做两件事：第一，你必须启用 CGI\
  \ 功能。其次，你必须告诉 Apache 哪些类型的传入请求可以被 CGI 请求。\n\n添加 CGI 支持涉及加载 CGI 模块，如下：\n\n```\nLoadModule\
  \ cgi_module         lib/apache/mod_cgi.so\n```\n\n如果你的 CGI 支持是编译到 Apache 主二进制执行文件中的（有时即使作为模块加载），你可能需要使用\
  \ `AddModule` 来激活它，如下：\n\n```\nAddModule mod_cgi.c\n```\n\n完成后，Apache 拥有了处理 CGI\
  \ 脚本所需的 set 工具。剩下的就是为特定的文件或目录启用 CGI 支持。你有几种方法可以完成此项任务：\n\n\n\n\n\n- `ScriptAlias`\
  \ - 该指令执行两个任务。首先，它告诉 Apache 在特定目录内运行 CGI 脚本。其次，它将物理目录映射到 URL 中可能指定的目录。例如，`ScriptAlias\
  \ /scripts/ \"/home/httpd/cgi-bin/\"` 将 `/home/httpd/cgi-bin` 目录映射到 URL 中的 `/scripts`\
  \ 目录。例如，通过此配置，用户输入 http://www.threeroomco.com/scripts/test.pl 就会导致 `/home/httpd/cgi-bin/test.pl`\
  \ CGI 脚本运行。许多 Apache 安装程序都包含此类默认配置；请检查你的 `httpd.conf` 文件以查找相关项。此配置还依赖于 `mod_alias`\
  \ 模块的存在。该模块通常默认包含，但如果你遇到问题，应该检查一下这一细节。\n\n- `Options +ExecCGI` - 你可以向 `Options`\
  \ 指令提供 `+ExecCGI` 参数以启用 CGI 脚本的执行。你可能不应该将此功能作为系统级选项；而是仅将其应用于特定的子目录（在 `<Directory>`\
  \ 指令内部）。\n\n- `.htaccess` - 你可以通过在各个目录中放置 `.htaccess` 文件来控制对单个目录的各种访问。如果文件包含 `Options\
  \ +ExecCGI` 行，Apache 将运行在该目录下找到的 CGI 脚本。但是，为了使此配置生效，`httpd.conf` 文件必须包含 `AllowOverride\
  \ Options` 行，至少对于目标目录是如此。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\n`Options +ExecCGI`\
  \ 和 `AllowOverride Options` 方法如果应用不当，都具有潜在的危险，因为用户可能因此编写出导致系统遭受安全漏洞的脚本。出于此原因，大多数发行版都不允许使用\
  \ `.htaccess` 文件，通常对其他目录也是如此。\n\n许多发行版的默认 Apache 配置通过 `ScriptAlias` 选项允许 CGI 脚本，通常来自名为\
  \ `/home/httpd/cgi-bin` 的目录，并使用 `/cgi-bin` URL 组件。这种配置非常方便，因为你可以将文件丢入 CGI 目录，它们就会被视为\
  \ CGI 脚本，而无需额外的麻烦。你必须注意的一个细节是权限。特别是 CGI 脚本本身就是脚本。与其他 Linux 脚本和程序一样，它们必须具有适当的权限才能运行。特别是如果你自己编写了脚本或从\
  \ Web 或 FTP 站点下载了脚本，你可能需要输入 `chmod a+x script-name`（其中 `script-name` 是脚本名称）来正确设置其权限。\n\
  \n## 编写 CGI 脚本\n\nCGI 脚本和其他脚本一样都是计算机程序。编写脚本的完整指南远超本章的范围。因此，本节仅提供一些建议，帮助已经具备脚本编写知识的你入门。如果你需要更多信息，请咨询“使用\
  \ CGI 动态内容”网页 ([`httpd.apache.org/docs/howto/cgi.html`](http://httpd.apache.org/docs/howto/cgi.html))\
  \ 获取基础介绍，或者参考关于 CGI 脚本的书以获取更多细节。\n\nCGI 脚本接受标准输入并生成标准输出。因此，可以使用标准输出命令输出任何你想让用户看到的文本。创建输出的技巧在于记住你的\
  \ CGI 脚本应该生成 HTML，或者偶尔生成其他对 Web 浏览器友好的格式。（例如，你可能会动态创建一个图形文件。）\n\n在大部分 HTML 输出之前，你的\
  \ CGI 脚本应该生成一个列出文档 MIME 类型的内容类型头。它通常看起来如下：\n\n```\nContent-type: text/html\\r\\\
  n\\r\\n\n```\n\n此示例指定了 `text/html` MIME 类型，这通常是你想要创建的。（行的 `\\r\\n\\r\\n` 部分创建了两个换行，这是规范的必要部分。）当然，具体如何创建此输出取决于你使用的脚本语言。将此与普通的脚本头行和一个简单的程序结合起来，可能会产生类似列表\
  \ 20.1 的内容，它显示了一个显示一行文本的 Perl 脚本。如果你将此程序输入 CGI 脚本目录中的文件中，赋予其执行权限，并在 Web 浏览器中指定其\
  \ URL，你应该能在浏览器窗口中看到 *Hello, Web* 文本出现。\n\n**示例 20.1. 一个简单的 Perl CGI 脚本**\n\n```\n\
  #!/usr/bin/perl\nprint \"Content-type: text/html\\r\\n\\r\\n\";\nprint \"Hello,\
  \ Web\";\n```\n\nCGI 脚本的输入稍微复杂一点。如果你的脚本生成了在 Web 浏览器中显示表单的输出，那么它可能会接收输入。用户在表单中输入的数据到\
  \ CGI 脚本的输入以字段/值对的形式出现。这些对中的每一对都使用等号（=`）分隔字段名与其返回的值，用用符号（`&`）分隔不同的字段/值对。例如，你的 CGI\
  \ 脚本可能会看到如下输入：\n\n```\ncity=Oberlin&state=OH&zip=44074\n```\n\n解析和使用此类输入是某些脚本语言（包括\
  \ Perl）的优势，因此 Perl 作为 CGI 脚本语言才如此流行。\n\n## 脚本安全措施\n\n使用 CGI 脚本的危险之处在于，你赋予了任何可以通过\
  \ Web 浏览器访问你 Web 服务器的人在你的计算机上运行程序的权利。当然，这对于任何服务器都是如此的，因为外部人员可以使用服务器本身。然而，启用了 CGI\
  \ 的 Web 服务器极大地放宽了门槛，因为每个 CGI 脚本都是潜在的安全威胁。编写服务器的程序员通常会非常小心地确保服务器不会受到任何安全漏洞的影响。即使关注这些细节，安全问题偶尔还是会出现。Web\
  \ 服务器的 CGI 脚本工具通常由那些编程技巧不如编写服务器的人的管理员使用，结果可能是灾难性的。\n\n\n\n\n幸运的是，你可以采取某些措施来帮助风险降至最低。最重要的是，你应该双击\
  \ `httpd.conf` 中的 `User` 和 `Group` 设置。Apache 使用这些选项指定的权限运行 CGI 脚本，因此，如果你为此目的使用权限较少的账户，那么当你的脚本存在缺陷时，就能最大限度地减少可能造成的伤害。理想情况下，你应该*仅*为\
  \ Apache 创建一个用户和一个组，并配置该账户不通过任何其他方式接受远程登录。然而，这并非万能药；即使访问受限，一个程序错误的脚本也可能为分子提供立足点，与其他安全问题结合时，可能用于获取服务器更大的权限。\n\
  \n你还可以使用现有的脚本库。这既可以减轻开发任务，又能减少代码包含基础性安全漏洞的风险。你可以在 [`www.cpan.org`](http://www.cpan.org)\
  \ 等脚本 Web 网站找到如 `CGI.pm` 和 `CGI::Lite` 等脚本库。\n\n如果你的 Web 服务器*确实*被攻破，你应该采取措施以确保其造成的损害最小。例如，你应该禁用不必要的服务器，并限制\
  \ Web 服务器计算机到网络上其他计算机的访问。Part IV，“网络安全与路由器功能”提供了关于你可以采取的许多通用安全措施的信息。\n\n# 处理安全站点\n\
  \n经常与脚本结合使用的一个功能是加密。更准确地说，*安全套接层 (SSL)* 是一种加密协议，可用于加密在 Web 服务器和 Web 浏览器之间传输的数据，以保护数据免受窥视。SSL\
  \ 经常用于电子商务网站以及处理敏感数据的网站。Apache 能够处理 SSL 加密，但需要添加额外的软件。针对 Apache 有多种 SSL 的实现方式，例如\
  \ Apache-SSL 项目 ([`www.apache-ssl.org`](http://www.apache-ssl.org))、`mod_ssl` ([`www.modssl.org`](http://www.modssl.org))\
  \ 以及各种商业来源。\n\n## 理解 SSL\n\nSSL 是一种加密技术，类似于安全 Shell (SSH) 远程登录协议中使用的技术。（事实上，流行的\
  \ OpenSSH 包依赖于 OpenSSL 包，而该包也被用于某些启用了 SSL 的 Apache 实现。）在 Web 传输方面，SSL 设计用于解决两个问题：\n\
  \n* **加密** — SSL 允许连接的双方加密数据以保持其私密性。这对于传输信用卡号或银行账户号等敏感信息显然非常重要。加密本身可以通过*公钥加密*来处理，这需要在连接的双方都有两个*密钥*。每一方使用对方的*公*钥对数据进行加密。加密后的数据只能用匹配的*私*钥解密，因此发送者可以确定只有接收者才能解码数据。\n\
  \n* **身份验证** — 即使有加密，在互联网上发送敏感数据仍存在风险。其中一个风险是对方服务器可能并非其声称的身份。例如，如果你在 Web 浏览器中输入\
  \ http://www.abigretailer.com，你如何确定你实际上到达了该声称的零售商？可以想象，分子调整了 `DNS` 服务器，将合法零售商的请求重定向到假网站，或者修改了路由器达到达到目的。SSL\
  \ 提供了一种通过名为*证书颁发机构 (CA)* 的第三方来验证交换中双方身份的机制。CA 提供*证书*，这是用于创建公钥的数字代码。如果一方使用来自 CA 的证书，另一方就可以以很高的置信度验证对方的身份。（但这并不完美；例如，2001\
  \ 年发生过一起错误，涉及证书被错误地以微软的名义发给了一个与微软没有附属关系的人。）通常，安全的 Web 服务器需要来自有效 CA 的证书，以让用户相信该站点是有效的。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n你可以充当自己的 CA，但除了内部使用外，这不能提供良好的身份验证，因为外部人员无法信任你内部生成的证书是有效的。如果你想运行电子商务网站，从实际操作角度考虑，你需要从\
  \ CA 获取证书。一份 CA 列表可以在 [`www.apache-ssl.org/#Digital_Certificates`](http://www.apache-ssl.org/#digital_certificates)\
  \ 找到。浏览网页的个人通常不需要来自 CA 的证书，因为 网站很少需要确定他们正在与所声称的个人通信。\n\nSSL 加密通常不在普通的 `HTTP` 端口\
  \ (80) 上进行。安全 `HTTP`（或 *HTTPS*）传输的默认端口是 443。你可以通过在 `URL` 开始处使用 `https://` 而不是 `http://`\
  \ 来告诉 Web 浏览器使用此端口。当你配置 Apache 使用 SSL 时，你必须运行一个绑定到两个端口并对它们进行不同处理的服务器，或者运行两个服务器，每个端口一个。前者通常是简单的方法，但如果出于某些原因你想运行不同类型的服务器（例如用于安全请求的\
  \ Apache 和用于普通请求的 `thttpd`），你可以这样做。\n\n## 配置 SSL\n\n使用 Apache 使用 SSL 的第一步是安装并配置\
  \ SSL 包。Linux 中有两种常用的 SSL 包：\n\n* SSLeay ([`www2.psy.uq.edu.au/~ftp/Crypto/ssleay/`](http://www2.psy.uq.edu.au/~ftp/crypto/ssleay/))\n\
  * OpenSSL ([`www.openssl.org`](http://www.openssl.org))\n\nOpenSSL 正在迅速成为 Linux\
  \ 的标准。（OpenSSL 实际上源自 SSLeay，但 SSLeay 作为一个独立的包可用。）它包含在许多 Linux 发行版中，包括 Debian、Mrake、Red\
  \ Hat 和 SuSE。SSLeay 和 OpenSSL 在逻辑上是等价；它们的功能相同，尽管不同的包有时会将配置文件放置在不同的位置，且它们的主二进制文件命名不同（分别为\
  \ `ssleay` 和 `openssl`）。\n\n一旦安装了 OpenSSL，你就需要它获取一个证书。对于公共站点，你应该通过 CA 获取证书，以便你的用户知道你是你所声称的。然而，为了测试或运行私有站点，可以使用自己生成的证书。事实上，某些\
  \ Apache SSL 安装脚本（如随 Debian 提供的脚本）会自动创建此类证书。如果你的脚本没有创建，你可以使用下面的命令来完成这项工作：\n\n```\n\
  # openssl req $@ -new -x509 -nodes \\\n-config /usr/share/doc/apache-ssl/examples/ssleay.cnf\
  \  \\\n-out /etc/apache-ssl/apache.pem \\\n-keyout /etc/apache-ssl/apache.pem\n\
  ```\n\n### 注意\n\n![NOTE](img/note.gif)\n\n\n\n上述命令假设启用了 `SSL` 的 Apache 配置文件位于 `/etc/apache-ssl`，并且在\
  \ `/usr/share/doc/apache-ssl/examples/ssleay.cnf` 存在一个 `SSL` 示例配置文件。你可能需要根据配置更改这些值。此命令还使用反斜杠（`\\\
  `）来表示长行的延续。你可以保留这些反斜杠，也可以省略它们并在单行中输入整个命令。\n\n当你输入此命令时，`openssl` 会提示输入某些信息，例如你的位置和计算机名称。这些信息将被编码在证书中，存储在\
  \ `/etc/apache-ssl/apache.pem` 文件中。\n\n如果你从 CA（证书颁发机构）获取证书，你应该将自生成的证书文件替换为 CA 提供的任何文件。这将消除用户在尝试访问使用自签名证书的站点时看到的警告信息。图\
  \ 20.2 显示了 Linux 下 Opera 显示的其中一条警告消息；其他浏览器可能会以不同的格式化这些信息，或者跨多个对话框呈现。\n\n![如果你使用自签名证书，访问你网站的用户将看到证书过期或无法识别的警告。](img/20fig02.gif)\n\
  \n图 20.2. 如果你使用自签名证书，访问你网站的用户将看到证书过期或无法识别的警告。\n\n## 在 Apache 中启用 SSL\n\n原则上讲，Apache\
  \ 可以通过扩展模块配置为使用 `SSL`。但在实践中，`SSL` 模块需要对 Apache 服务器进行几处更改，因此某些启用了 `SSL` 的 Apache\
  \ 软件包提供了一个重新构建的 Apache 服务器以及 `SSL` 扩展。其他发行版则发布带有 `SSL` 钩子构建的 Apache 包，并提供与标准 Apache\
  \ 包兼容的 `SSL` 扩展包。如果你尝试混合使用普通 Apache 和启用了 `SSL` 的 Apache 包，这种组合可能有效，也可能无效。\n\n许多\
  \ `SSL` 包为启用了 SSL 的服务器和标准服务器使用独立的配置文件。例如，Debian 启用 `SSL` 的 Apache 配置文件位于 `/etc/apache-ssl`，而标准的\
  \ Debian Apache 文件位于 `/etc/apache`。这些配置文件与不支持 `SSL` 的 Apache 基本相同，因此你应该以相同的方式设置网站目录等细节。与普通安装相比，你可能需要更改某些特定选项如下：\n\
  \n*   `ServerType` — 启用了 `SSL` 的 Apache 版本必须独立运行，而不是从超级服务器运行。因此，`ServerType` 必须是\
  \ `standalone`。\n*   `Port` — 标准的 `SSL` `HTTP` 端口是 443，因此你应该适当设置此值。`Listen` 也可能将服务器绑定到特定的端口号，如果使用了，也应该进行调整。\n\
  *   `Modules` — `LoadModule` 和 `AddModule` 指令可能会引用一个或多个与 `SSL` 模块。对于任何启用了 `SSL`\
  \ 的 Apache 版本的默认或示例配置文件，都应正确设置这些。\n*   `SSLRequireSSL` — 你可以在 `<Directory>` 指令中使用此选项，在客户端未使用\
  \ `SSL` 的情况下阻止对目录的访问。你可以单独使用此指令（它不接受选项）。这是确保敏感数据不在加密的情况下传输的方便方法，但当然你还需要其他形式的访问控制，以确保只有授权用户才能访问该目录。\n\
  *   `SSLEnable` — 此指令启用 `SSL`。像 `SSLRequiresSSL` 一样，它不接受选项；只需单独占一行列出。\n*   `SSLCACertificatePath`\
  \ — 此指令指向 Apache 证书的目录，例如 `/etc/apache-ssl`。\n*   `SSLCertificateFile` — 此指令指向 `SSL`\
  \ 证书文件，例如 `/etc/apache-ssl/apache.pem`。\n\n还有许多其他可以设置的 `SSL` 相关指令。详情请参阅配置文件中的注释、你启用了\
  \ `SSL` 的 Apache 文档或涵盖 `SSL` Apache 配置的书籍。\n\n一旦配置好 `SSL` 和 Apache，你就可以启动启用了 `SSL`\
  \ 的 Apache 服务器。你应该能够通过服务器的 `URL` 中输入 `https://` 而不是 `http://` 来访问服务器。如果你生成了自己的证书，可能会看到类似图\
  \ 20.2 所示的警告。你可以接受该证书（某些浏览器会提供关于未来接受此证书条件的若干种选项）以继续测试网站。\n\n### 警告\n\n![警告](img/warning.gif)\n\
  \n作为一个一般规则，你不应该接受来自随机 Web 服务器的未验证证书。大多数使用 `SSL` 的网站都会向 CA 注册，你不应该在这些站点上看到此类警告。如果看到了，可能意味着网站运营商允许证书过期（它们是有时间限制的），或者运营商没有向\
  \ CA 注册。它也意味着有人正试图伪装该网站，并希望欺骗用户放弃信用卡号等敏感数据。\n\n# 处理虚拟域名\n\n你可以使用 Apache 为单个站点提供\
  \ Web 页面，如本章前面所述的 http://www.threeroomco.com。但是，假设你想在一台计算机上托管两个或更多站点。这可能吗？可以！事实上，Web\
  \ 托管服务广泛地使用此功能，从单个 Web 服务器托管几十个、数百个或更多 Web 站点。处理这些*虚拟域名*的大部分配置与较简单的 Apache 配置相同，但有一些你必须注意的特殊细节。\n\
  \n## 为什么要使用虚拟域名？\n\n虚拟域名允许 Web 服务器根据其被访问时的名称做出不同的响应。（这要求你在一个或多个域名的 `DNS` 记录中，将多个不同的主机指向\
  \ Web 服务器计算机。）此类配置有几种可能的用途，包括以下：\n\n*   如果你正在更改你的域名（或单个域名内的 Web 服务器名称），你可以让 Apache\
  \ 在旧名称上显示此类提示的消息，然后重定向到新名称。随着时间的推移，大多数链接到旧名称的站点和书签都应该更新。\n\n\n\n\n-   如果两家关系密切的公司，甚至同一家公司内的不同部门想要共享一个\
  \ Web 服务器，你可以配置它对每个部门的相应名称做出响应。在某些情况下（特别是同一家公司内的部门），使用子目录可能比使用不同的服务器名称更有意义。不过，物理位置临近的小型企业可能希望使用这种方法来减少互联网费用。\n\
  -   个人、家庭成员或室友可能会注册单独的域名并将它们全部托管在单台计算机上。这种方法对于那些拥有允许运行个人服务器的 ISP 且有宽带互联网访问的个人来说最有用。\n\
  -   你可以进入 Web 托管业务，并建立 Web 服务器来处理大量的第三方 Web 网站。如果你的目标，你需要的专业知识将比一本 Linux 网络书籍所能提供的多得多。\n\
  \n从一般原则来说，Apache 处理域名托管任务的能力对于可能想要或需要处理多个域名的大型机构和 ISP 来说无疑是最用的。不过，对于那些恰好处于合适情况的人，小规模的使用也无疑非常重要。\n\
  \n## 虚拟域名配置选项\n\n处理虚拟域名托管有两种常用方法。一种根据请求的域名名分配不同的文档根目录，另一种则允许你为每个虚拟域名设置一组（可能不同的）选项。\n\
  \n### 使用 `VirtualDocumentRoot`\n\n一个关键的虚拟域名配置选项是 `VirtualDocumentRoot`。该指令允许你根据使用的名称指定用作服务器请求根目录的目录名。为此，你可以在传递给\
  \ `VirtualDocumentRoot` 的目录名中包含几个变量，如 表 20.1 节所示。\n\n例如，考虑以下指令：\n\n```\nVirtualDocumentRoot\
  \ /home/httpd/%0\n```\n\n这将导致服务器使用 `/home/httpd` 下的子目录，其名称为引用服务器的完整主机名。如果来了一个针对\
  \ http://www.threeroomco.com/index.html 的调用，服务器将查找名为 `/home/httpd/www.threeroomco.com/index.html`\
  \ 的文件。如果你想托管许多网站，这种方法非常有用，尽管它可能会在基目录（在本例中 `/home/httpd`）下直接创建大量的子目录。\n\n**表 20.1.\
  \ 用于指定特定主机名主目录的变量**\n\n| **变量** | **描述** |\n| --- | --- |\n| `%%` | 目录名中的单个 `%`\
  \ |\n| `%p` | 服务器运行的端口号 |\n| `%N.M` | 选择名称的一部分，用点分隔。`N` 是一个数字，指代由点分隔的组件，其中 `0` 代表整个名称，`1`\
  \ 代表第一个组件，`2` 代表第二个组件，`-1` 代表最后一个组件，`-2` 代表倒数第二个，以此此类推。`M` 与 `N` 类似，但它指的是名称组件内的字符。（如果你想使用整个主机名组件而不是单个字符，可以省略\
  \ `M`。） |\n\n```\nVirtualDocumentRoot /home/httpd/%-1/%-2\n```\n\n在像这样的配置中，获取 http://www.threeroomco.com/index.html\
  \ 的调用会导致 Apache 查找 `/home/httpd/com/threeroomco/index.html`。或者，你可能想通过这样的配置让你的虚拟站点目录按字母顺序排序：\n\
  \n```\nVirtualDocumentRoot /home/httpd/%-2.1/%0\n```\n\n使用此配置，URL http://www.threeroomco.com/index.html\
  \ 会导致 Apache 返回 `/home/httpd/t/www.threeroomco.com/index.html`（如果存在的话）。`%-2.1` 变量返回主机名倒数第二个（`-2`）组件的第一个（`.1`）字符，因此目录按域名的首字母存储在子目录中。\n\
  \n无论你的 `VirtualDocumentRoot` 指令为何，你都应该将 `UseCanonicalName` 设置为 `Off`，如下：\n\n```\n\
  UseCanonicalName Off\n```\n\n当 `UseCanonicalName` 设置为 `On`（这是大多数配置的默认值），Apache 在\
  \ Web 网站内部进行相对引用时会使用它认为的主机名。例如，如果 `index.html` 页面包含了加载 `products.html` 的调用，Apache\
  \ 将尝试从它的规范名检索 `products.html`。对于虚拟域名，此查找将失败。将 `UseCanonicalName` 设置为 `Off` 会改变 Apache\
  \ 的行为，改为使用与虚拟域名关联的主机名。\n\n### 使用 `<VirtualHost>`\n\n另一种虚拟托管的方法是显式定义每个虚拟主机。你通过使用两个特殊指令来实现此：\n\
  \n*   `NameVirtualHost` — 该指令位于 Apache 主配置文件中，通知 Apache 你想要配置虚拟主机。该指令的值通常为单星号（`*`），在这种情况下，你必须为服务器的所有定义定义虚拟主机；或者是与一个接口关联的\
  \ IP 地址，在这种情况下，主服务器配置将处理所有*除*来自指定接口的请求，而这些请求将由虚拟主机定义处理。\n*   `<VirtualHost>` — 该指令开始一个特定的虚拟主机定义块。它接收的值应与赋予\
  \ `NameVirtualHost` 的值相同。指令块以 `</VirtualHost>` 指令结束。在这两者之间是用于指定托管目录和其他自定义虚拟主机的指令。\n\
  \n\n\n\n虽然本章主要关注 Web 服务器的运行和维护，但了解由 Web 服务器呈现的 Web 页面是如何产生的至关重要的。之前的某些章节已经描述了一些类型的\
  \ Web 页面（特别是动态内容）。最常见的静态内容类型是 `HTML`，它是一种带有格式扩展的基于文本的格式。有多种工具可以帮助你创建 `HTML`，以及 `HTML`\
  \ 页面经常依赖的文件格式，例如图形文件格式。了解如何使用这些工具以及 Web 浏览器如何解释 `HTML`，将帮助你创建可以被今天大多数 Web 浏览器处理的网站。\n\
  \n## HTML 和其他 Web 文件格式\n\n尽管有许多创建 Web 文件的工具（正如下一节“制作 Web 页面的工具”所讨论），但了解静态 Web 页面上常见的各种文件格式会有帮助。Web\
  \ 上常见的常见格式包括各种文本文件格式、图形文件和各种数据文件。\n\n大多数 Web 页面都是围绕一个 `HTML` 文本构建的。该文件是一个纯文本文件，可以使用普通的文本编辑器对其进行编辑。[列表\
  \ 20.2] 显示了一个简单的 `HTML` 文件作为示例。`HTML` 文件中的大多数文本显示在 Web 浏览器的窗口中，但包含在角括号 (`<>`) 中的文本是格式信息。这些代码中的许多是成对出现的，第二个代码与第一个具有相同的名称，但使用斜杠\
  \ (`/`) 表示它是格式区域的结束。起始代码有时包含可以微调其行为的参数，例如设置图形的大小和文件名，或指定文本和背景的颜色。其中一些代码引用 Web 上的其他文档（既在主文档服务器上，也在其他\
  \ Web 服务器上）。\n\n**示例 20.2. 示例 HTML 文件**\n\n```\n <!DOCTYPE HTML PUBLIC \"-//IETF//DTD\
  \ HTML 2.0//EN\">\n<HTML><HEAD>\n<TITLE>Sample Web Page</TITLE>\n</HEAD>\n<BODY\
  \ BGCOLOR=\"#FFFFFF\" TEXT=\"#000000\">\n<CENTER><H1 ALIGN=\"CENTER\">Sample Web\
  \ Page</H1></CENTER>\n<IMG SRC=\"graphics/logo.jpg\" ALT=\"Logo\" WIDTH=\"197\"\
  \ HEIGHT=\"279\">\n<P>This is a sample Web page, including <A HREF=\"http://www.threeroomco.com/anotherpage\n\
  .html\">a link.</A></P>\n</BODY></HTML>\n```\n\n[列表 20.2] 中的某些格式代码应该是不言自明的，但另一些则更为晦涩。一些较重要的代码包括：\n\
  \n*   `<HTML>` — 此代码将页面标识为 `HTML`。大多数浏览器实际上并不需要此代码，但最好使用它来创建适当的 `HTML`。\n*   `<HEAD>`\
  \ — `HTML` 页面包含*头部*（header）和*主体*（body）。头部提供通常不显示在 Web 页面正文中的信息，例如 [列表 20.2] 中的 `<TITLE>`\
  \ 代码。主体包含出现在 Web 浏览器窗口中的大部分文本。`<HEAD>` 标识头部。\n*   `<TITLE>` — 大多数 Web 浏览器会在窗口的标题栏中显示\
  \ Web 页面的标题，并在用户在书签列表中输入 Web 页面时将其作为默认标题输入。\n*   `<BODY>` — 此代码表示 Web 页面的主要主体。它经常包含设置文本颜色、背景颜色和类似属性的参数。\n\
  *   `<H1>` — 标题允许你创建用于将 Web 页面划分若干部分的文本。它们通常显示比普通正文更大的字体。你可以创建多个层级的标题，从 1 (`<H1>`)\
  \ 开始。`<H2>` 是 `<H1>` 下方的标题，依此类推。[列表 20.2] 中的 `<H1>` 代码包含一个 `ALIGN` 选项，告诉 Web 浏览器将文本居中。遗憾的是，并不是所有的\
  \ Web 浏览器都响应相同的对齐代码，因此在这方面需要一些冗余以保持显示一致。\n*   `<CENTER>` — [列表 20.2] 中的 `<H1>` 标题通过\
  \ `<H1>` 代码中的一个选项以及围绕 `<H1>` 代码的 `<CENTER>` 代码来实现居中。某些浏览器对这些代码中的某一个有响应，但不是两者都响应。现代浏览器通常不需要\
  \ `<CENTER>` 代码，但一些旧版本的浏览器需要它。\n*   `<IMG>` — 你可以使用 `<IMG>` 代码在 Web 页面上包含图形，如 [列表\
  \ 20.2] 所示。这些代码通常包含几个参数，包括 `SRC`（指向图像源——其在服务器上的文件名，或者如果存储在另一个服务器上则是完整的 `URL`）、`ALT`（对于禁用了自动显示图像的用户或当用户鼠标悬停在图像上时显示的与图像相关的文本）、`WIDTH`\
  \ 和 `HEIGHT`（图像的宽度和高度，允许 Web 浏览器在图像加载之前显示文档文本，或者如果图像是其他尺寸则动态缩放）。\n*   `<P>` — 此代码表示段落。Web\
  \ 浏览器会自动重新排列段落内的文本，以适应窗口大小、字体大小和其他窗口的其他特征。\n*   `<A HREF>` — 此代码表示链接。此代码包含的文本或图像通常在\
  \ Web 浏览器中显示下划线或不同颜色，用户可以点击链接查看代码中 `URL` 指定页面。\n\n可以使用这些代码来创建 Web 页面，但 `HTML` 支持更多选项，包括格式化表格、指定字体、显示项目符号或编号列表、将文档拆分为多个独立的*框架*（frames）等。不过，可能会过度使用高级\
  \ `HTML` 功能。接下来的章节“Web 页面设计设计”包含了关于这方面的信息。\n\n除了 `HTML` 之外，Web 服务器还可以向浏览器传递其他类型的文档。事实上，`HTML`\
  \ 文档经常直接引用这些文档，如 [列表 20.2] 中的 `<IMG>` 选项。你可以链接到纯文本页面、图形、可下载的程序文件、脚本或任何类型的文件。一个重要的注意事项是，你的\
  \ Web 服务器应该为你的文档设置适当的 `MIME` 类型，通常在前面的章节“理解 Apache 配置”中描述的 `mime.types` 文件中。如果 Apache\
  \ 无法确定文件的 `MIME` 类型，它通常以纯文本形式发送，这可能会导致问题，因为目标操作系统可能会更改中的某些字符，从而导致损坏。\n\n由于许多 Web\
  \ 页面包含大量的图形，因此了解 Web 上常见的图形文件格式至关重要。三种最常见的格式如下：\n\n\n\n\n\n- **GIF**: 图形交换格式（Graphics\
  \ Interchange Format）自 20 世纪 80 年代以来一直广受欢迎。它使用无损压缩方案，这意味着它压缩了数据，但其方式允许显示精确的输入数据。`GIF`\
  \ 支持色深高达 8 位（256 种颜色）的图像。该格式的一个独特缺点是它使用受专利保护的压缩方案（该专利已于 2003 年过期）。有些人反对使用这种受过多限制的图形文件格式。\n\
  \n- **PNG**: 便携网络图形格式（Portable Network Graphics）是另一种使用无损压缩方案的格式。它还支持更高的色深（高达 64\
  \ 位，但 24 位是更常见的深度），因此颜色比 `GIF` 多得多。它的压缩方案不受专利保护。缺点是，一些旧的 Web 浏览器不支持 `PNG` 图形。有一个专门致力于\
  \ `PNG` 的网站：[http://www.libpng.org/pub/png/]。\n\n- **JPEG**: 联合照相专家小组（Joint Photographic\
  \ Experts Group）格式使用有损压缩方案，这意味着它可以获得比无损格式更高的压缩率，但在显示时压缩后的图像可能与原始图像不一致。`JPEG` 支持真彩色（高达\
  \ 24 位）图像。\n\n作为一个一般规则，无损格式最适合仅使用少数颜色的线条画和卡通类图像。这些图像在转换为 `JPEG` 格式时往往会产生难看的伪影。相比之下，数字化照片通常在真彩色格式（`PNG`\
  \ 或 `JPEG`）中效果最好，且 `JPEG` 的有损压缩方案对这类图像的影响并不大。因此，JPEG 常用于显示在 Web 的数字化照片。\n\n当你使用\
  \ `JPEG` 时，你的图形软件包会为你提供一个压缩级别的选项。你可以用较小的压缩率保存图形文件，这将生成一个大但外观良好的图像；或者使用大量的压缩，这会生成一个较小得多但质量下降更严重的文件。描述压缩程度的精确刻度因软件包而异，但\
  \ 1–100 的刻度并不罕见，100 代表最佳质量。你可能要放在 Web 上的大多数图像在相当低的压缩水平下（例如 50 左右）看起来是可以接受的，压缩这些图像可以帮助减少\
  \ Web 服务器的负载，并让图像在用户的 Web 浏览器中更快速地出现。你可能想尝试不同类型的图形文件，以了解什么压缩级别最适合你。\n\n## 制作 Web\
  \ 页面的工具\n\n虽然你可以通过在文本编辑器中编辑原始 `HTML` 并手动创建 Web 页面，并使用 The GIMP ([http://www.gimp.org])\
  \ 等独立工具来创建或编辑图形，但许多 Web 页面设计师更倾向于使用 `GUI` `HTML` 设计工具。这些工具允许你输入和编辑文本就像在所见即所得（`WYSIWYG`）文字处理器中一样，使用按钮或特殊按键来指示居中、粗体文本、新段落等。这种方法确实方便，而且\
  \ Apache 并不在乎你是如何生成文件的，因此从服务器操作的角度来看，没有理由避免此类工具。一个例外是微软的 Front Page 可以创建依赖特殊服务器扩展的\
  \ Web 页面，因此在使用 Apache 时最好避免它。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n使用设计工具创建 Web\
  \ 页面对于 Apache 来说通常不是问题，但某些创建工具包含了自动将 Web 页面上传到 Web 服务器的接口。这些上传功能可能无法与 Apache 工作，至少不能直接工作。你可能需要将\
  \ Web 页面保存为本地文件，然后通过软盘、`FTP` 或其他手段将其传输到 Web 服务器计算机。\n\nWeb 页面创建工具的示例包括：\n\n- **文字处理器**:\
  \ 许多现代 `GUI` 文字处理器包含将文档导出为 `HTML` 的功能，或特殊的 `HTML` 格式模式。如果文件是作为普通的文字处理器文档生成的，此类 `HTML`\
  \ 导出可能会丢失一些格式特性。如果你已经熟悉支持此类功能的文字处理器，这是一种生成 `HTML` 文档的方便方法。具有 `HTML` 导出能力的 Linux\
  \ 文字处理器包括 Applix Words、StarOffice 和 WordPerfect。\n\n- **Web 浏览器**: 包括适用于 Linux 的\
  \ Netscape 在内的许多 Web 浏览器都带有文档创建模块。按照一般规则，它们比文字处理器更精合 Web 页面设计的需求，但如果你已经熟悉文字处理器，浏览器工具代表了另一个需要掌握的程序。\n\
  \n- **独立 Web 页面创建工具**: 这些工具从底层开始设计就只为了创建 Web 页面。Linux 中的示例包括 ASHE ([http://www.cs.rpi.edu/pub/puninj/ASHE/])、August\
  \ ([http://www.lls.se/~johanb/august/])、Bluefish ([http://bluefish.openoffice.nl])\
  \ 和 WebSphere ([http://www-4.ibm.com/software/webservers/hpbuilder/])。其中一些是非常基础的工具，而另一些则极其复杂。\n\
  \n如果你使用 Web 开发工具，你应该意识到这些工具的局限性。由于 Web 的性质，没有两个浏览器会完全相同地显示同一个页面，但使用这些工具很容易忽略这一事实。如果工具创建了针对特定浏览器优化的\
  \ `HTML`，由于你的 `HTML` 编辑器做了假设，你网站的访问者可能会发现你的网站难以阅读。\n\n## Web 页面设计技巧\n\n\n\n\n\n\
  一些 Web 设计师喜欢尽情利用 `HTML` 特性，从而创建一个几乎可以像打印页面任何内容一样复杂的布局。然而，使用更高级的 `HTML` 特性也有缺点。具体来说，无法精确预测特定浏览器将如何处理代码。事实上，即使是列表\
  \ 20.2 中的代码在应用上也不完全一致——正如前面的描述所述，例如，不同浏览器对用于居中文本的各种代码响应各不相同。字体规范仅在客户端 Web 浏览器中安装了该字体时才有效；如果没有安装，通常的结果是回退到丑陋的默认字体，如\
  \ `Courier`。颜色规范可能会与用户自身的颜色选择产生不良的相互作用。（一个特别烦人的错误是指定了背景颜色而没有指定文本颜色。如果你指定了白色背景颜色但没有指定文本颜色，那么默认设置为黑底白字的用户将无法阅读你的页面。列表\
  \ 20.2 指定了背景色和前景色，但它没有指定链接颜色，这在这一方程式中也同样重要。）\n\n由于 Web 器的差异巨大，最好的做法是在多个浏览器上测试你的\
  \ Web 页面。至少，你应该在 Netscape Navigator 和 Microsoft Internet Explorer 上进行测试。如果可能，你应该在这些浏览器的多个版本上进行测试。其他流行的浏览器，特别是在\
  \ Linux 社区中，包括 Mozilla ([`www.mozilla.org`](http://www.mozilla.org)，Netscape Navigator\
  \ 的开源表兄弟)、Opera ([`www.opera.com`](http://www.opera.com))、Konqueror（`KDE` 项目的一部分）和\
  \ Lynx ([`lynx.browser.org`](http://lynx.browser.org)，一个基于文本的 Web 浏览器)。如果你希望你的网站能够被所有用户访问，那么\
  \ Lynx 特别地重要。因为它是基于文本的，它会暴露你可能在 `GUI` 浏览器中没有注意的问题，但这些对于使用 Lynx 的人或使用计算机语音合成器的视障人士来说可能是重要的。此外，请记住，你的\
  \ Web 服务器用户中许多（也许大部分）不会使用 Linux。在 Windows 上，Internet Explorer 是最流行的浏览器，但其他浏览器（包括之前的许多浏览器）也是可用的。MacOS、BeOS、OS/2\
  \ 以及许多其他平台都有自己的浏览器，其中一些与其他平台共享，另一些则不是。\n\n### 提示\n\n![TIP](img/tip.gif)\n\n你可以像稍后描述的那样检查服务器日志文件，以确定哪些类型的浏览器最常访问你的网站。\n\
  \n# 分析服务器日志文件\n\nWeb 服务器日志文件可以是帮助你管理 Web 网站的重要信息源。日志文件可能包含访问你网站的客户端信息、哪些文档在这些客户端中很受欢迎、文件何时被访问等。遗憾的是，检查原始日志文件可能是一项乏味的工作，因此存在各种工具来帮助总结日志文件中的数据。两种常用的工具是\
  \ Analog 和 Webalizer。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n本节描述了由 Apache 根据前文所述的\
  \ `CustomLog` 指令创建的常规日志文件。Apache 还可以将错误、启动消息等记录到单独的日志文件中。\n\n## Apache 日志文件格式\n\n\
  实际上有几种不同的 Apache 日志文件格式，你可以可以通过设置常用配置选项](#ch20.xhtml_ch20lev2sec3 \"设置常用配置选项\")\
  \ 中的 `CustomLog` 指令来设置。本节描述了 `combined` 格式，它将信息合并到一个文件中。其他选项提供了这些信息的子集。\n\n合并日志文件中的条目如下：\n\
  \n```\n 192.168.1.1 - - [06/Nov/2002:16:45:49 -0500] \"GET /index.html \\ HTTP/1.0\"\
  \ 200 8597 \"-\"\n \"Mozilla (X11; I; Linux 2.0.32 i586)\"\n```\n\n此条目由几个部分组成：\n\
  \n* **客户端主机名或 IP 地址**。第一个字段是发出请求的客户端的 `IP` 地址或主机名。\n* **用户标识**。接两个字段（在本例中都是折号）提供发出请求的个人用户名。折号表示此信息不可用。如果存在，第一个字段是由\
  \ `identd` 服务器识别的名称，第二个是由 `HTTP` 用户验证识别的名称。\n* **日期和时间**。Apache 记录传输请求的日期和时间。此信息记录在本地时间中，但日志包含了时区（在本例中为\
  \ `-0500`，意味着比 `GMT` 早五小时）。\n* **HTTP 请求**。HTTP 请求代码（在本例中为 `GET /index.html HTTP/1.0`）显示了客户端使用的命令\
  \ (`GET`)、请求的文档 (`/index.html`) 以及使用的 HTTP 级别 (`1.0`)。你可以使用此信息发现你的哪些页面最受欢迎。此字段通常还包含尝试入侵的线索，因为这些通常依赖于对奇怪文档的请求。\n\
  * **响应码**。Apache 向客户端响应时，通过响应码提供服务器履行请求能力的信息。在本例中，响应码为 `200`，意味着 Apache 可以履行请求。以\
  \ `3` 开头的代码是重定向，以 `4` 开头的代码表示客户端错误，以 `5` 开头的代码表示服务器错误。\n* **对象大小**。此例中的 `8597` 条目是\
  \ Apache 返回的文档大小，不包括 `HTTP` 开销。\n* **引用页 (Referrer)**。当用户点击另一个页面上的链接时，大多数浏览器会将引用页的\
  \ `URL` 传递给新页面的 Web 服务器。Apache 在其日志文件中记录了此信息。在前面的示例中，引用页是 `\"-\"`，表示没有引用页——用户直接在\
  \ Web 浏览器中输入了 `URL`。\n* **用户代理**。最后一个字段包含浏览器发送给 Apache 的自身信息，例如其名称和运行的操作系统。（注意 Netscape\
  \ 报告为 Mozilla`。）此信息并非完全可靠；Web 浏览器可以被程序化为谎，或者代理服务器可能会更改信息。\n\n使用这些信息，你可以浏览 Apache\
  \ 日志文件，以确定有关你的 Web 页面的受欢迎程度、何时被访问、谁在访问它们等信息。不过，“原始”检查这些文件可能会很乏味。这时日志文件分析工具派上用场了。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n大多数 Linux 安装包含自动轮转日志文件的 cron 任务，包括 Apache 日志文件。检查系统的\
  \ cron 任务（通常存储在 `/etc/cron.d`, `/etc/cron.interval` 或类似位置）是否存在此类日志轮转系统。如果你的 Web\
  \ 文件日志没有轮转，你可能需要添加此功能，以防止日志文件增长到占用可用磁盘空间。\n\n## 使用 Analog\n\n\n\n\n\nAnalog ([`www.analog.cx`](http://www.analog.cx))\
  \ 声称是世界上流行的 Web 日志文件分析工具。该软件包的输出主要基于文本，但也包含一些柱图和饼图。你可以在 [`www.statslab.cam.ac.uk/~sret1/stats/stats.html`](http://www.statslab.cam.ac.uk/~sret1/stats/stats.html)\
  \ 查看示例报告。Analog 随某些发行版提供，你也可以从其网页获取。\n\n## 设置 Analog 选项\n\nAnalog 通过配置文件 `analog.cfg`\
  \ 控制，该文件通常位于 `/etc`。此文件包含各种选项，帮助 Analog 将数据组合成有用的块。例如，`SEARCHENGINE` 指定了可能作为引用来源出现的搜索引擎，以便\
  \ Analog 能够总结指向你网站的搜索引擎链接。你可能想要立即设置的三个选项如下：\n\n```\n LOGFILE /path/to/log/file\n\
  OUTFILE /path/to/output/file\nHOSTNAME \"Your Organization's Name\"\n```\n\n这前项至关重要。如果你不指定它们，Analog\
  \ 将无法找到你的日志文件，并将输出文件直接转到标准输出。Analog 的输出是带有相关图形的 HTML 文件格式，因此你可以使用 Web 浏览器读取。（你只需指定主文件的名称，例如\
  \ `/home/httpd/html/analog/index.html`；Analog 在同一目录下创建其图形文件。）`HOSTNAME` 规范纯粹是为了美观；Analog\
  \ 在报告顶部显示此信息。\n\n遗憾的是，某些 Analog 软件包在开箱即用时无法完全运行，因为它们对文件位置做出了特殊且矛盾的假设。这些问题可以通过创建符号链接来解决：\n\
  \n* **配置文件**：某些 Analog 软件包在构建时假设 `analog.cfg` 文件将与 Analog 可执行文件（通常位于 `/usr/bin`）处于同一目录，尽管该文件实际位于\
  \ `/etc`。`/usr/bin` 对于配置文件来说是一个奇怪的位置，但你可以输入 `ln -s /etc/analog.cfg /usr/bin`，让文件留在\
  \ `/etc` 中同时满足 Analog 的需求。\n* **语言文件**：Analog 依赖语言文件来正常运行。某些软件包将这些文件放在 `/var/lib/analog/lang`，但\
  \ Analog 可能会在 `/usr/bin/lang` 中查找它们。输入 `ln -s /var/lib/analog/lang /usr/bin` 允许\
  \ Analog 正常工作。\n* **支持图形**：Analog 为其总结的每个站点生成一些图形（如饼图），但它也依赖其他固定的图形文件。某些软件包默认将这些文件放在\
  \ `/var/www/html/images`，但 Analog 生成的 HTML 在 Analog 输出目录下的 images 目录查找它们，因此你可能需要创建另一个符号链接。切换到通过\
  \ `OUTFILE` 选项指定的输出目录并输入 `ln -s /var/www/html/images` 让 Analog 访问这些图形文件。\n\n请记住，并非所有的\
  \ Analog 软件包都可能这些调整。（我发现一个用于 Linux Mandrake 的 Analog 软件包 `analog-5.01-1mdk` 确实需要这些调整。）\n\
  \n## 运行 Analog\n\n可以通过输入其名称 `analog` 来运行 Analog。输入此命令的用户必须对 Web 访问日志具有读取权限，并对 Analog\
  \ 输出目录具有写入权限。如果你恰当地规划了权限，这两项任务都不需要 `root` 权限。\n\n在大多数情况下，你希望通过 cron 任务（定时任务）定期运行\
  \ Analog，例如每月一次、每周一次甚至每天一次。请记住，Analog 虽然不是一个巨大的进程，但确实会消耗一些系统资源，因此运行过于频繁（例如每分钟一次）可能会导致性能下降，特别是在繁忙的服务器上。\n\
  \n## 解读 Analog 输出\n\nAnalog 输出被分为几个不同的报告，每份报告都以不同的方式提供了处理和总结的信息。具体章节如下：\n\n* **总摘要\
  \ (General summary)**：此部分提供了可能有助于判断 Web 服务器整体健康状况的信息，例如每天处理的平均请求数、每天成功和失败请求的平均数，以及每日数据传输总量总量。\n\
  * **每月报告 (Monthly report)**：月报按月总结了服务的页面数量。每月使用量增加而感知性能下降可能意味着你需要升级服务器或其网络连接。\n\
  * **每日摘要 (Daily summary)**：此部分提供了按星期（周一、周二等）提供服务的页面数量信息。\n* **每小时摘要 (Hourly summary)**：此部分类似于每日摘要，但它按天内的小小时（1:00、2:00\
  \ 等）总结服务器使用情况。如果你遇到运行变慢的情况，可能想检查此摘要并用它来精调你的诊断；如果你在一天中较空闲的时间寻找问题，可能会漏掉问题。\n* **域名报告\
  \ (Domain report)**：如果你的服务器处理多个域名，你将看到每个域名处理流量总结。\n* **组织报告 (Organizational report)**：如果你将不同的组织与不同的域名或页面关联，此报告将按组织划分流量。\n\
  * **操作系统报告 (Operating system report)**：如果你使用组合 Apache 日志格式或其他提供此类信息的格式，你就可以看到客户端报告正在使用的哪些操作系统。请注意，由于代理和其他报告中的不准确性，这些信息可能并不完全可靠。\n\
  * **状态码报告 (Status code report)**：Analog 提供了一个饼图，显示 Web 服务器发布的每个状态码响应的数量。如果存在大量的\
  \ `4xx` 或 `5xx` 响应，这有助于快速发现问题。\n* **文件大小报告 (File size report)**：此部分显示了 Web 服务器交付的各种大小的文件数量。这对于流量管理非常有用；如果你看到文件大小有上升趋势，可能想采取措施检查这一趋势，例如对图形文件使用更高的压缩率。\n\
  * **文件类型报告 (File type report)**：你可以看到 Web 服务器交付的文件类型（JPEG 文件、HTML 文件等）。这可能对于结合文件大小报告控制\
  \ Web 网站的扩展有用。\n* **目录报告 (Directory report)**：大多数 Web 网站被拆分为多个目录，此报告根据交付的字节数告诉你其中哪些目录最受欢迎。\n\
  * **请求报告 (Request report)**：此报告显示了网站根目录下文件的流行程度。\n\n你可以使用这些各种报告来很好地了解你的 Web 网站是如何使用的。如果你维护一份跨越一段时间的\
  \ Analog 报告记录，将更有价值，因为这样你可以检查多份报告随时间的变化。你可以通过创建或编辑 cron 任务来轮转 Apache 日志文件来实现。（许多发行版的\
  \ Apache 软件包都包含此类 cron 脚本。）当日志文件轮转时，将现有的 Analog 目录备份到子目录中。然后你可以创建一个主 HTML 页面链接到这些备份目录，以便你浏览几周或几个月的\
  \ Analog 摘要。\n\n## 使用 Webalizer\n\n\n\n\nWebalizer ([`www.webalizer.org`](http://www.webalizer.org))\
  \ 是网页摘要领域 Analog 的主要竞争对手。与 Analog 类似，Webalizer 会读取配置文件并创建一个输出的 `HTML` 文件和辅助图形，以便你以方便的摘要形式浏览你网站的流量模式。Webalizer\
  \ 随某些发行版一起提供，你也可以从它的官方网页获取。你可以在 [`www.webalizer.org/sample/`](http://www.webalizer.org/sample/)\
  \ 查看示例报告。\n\n## 设置 Webalizer 选项\n\nWebalizer 通过其配置文件 `webalizer.conf` 控制，该文件通常存储在\
  \ `/etc` 中。与 Analog 一样，你必须告诉 Webalizer 在哪里找到你的 Web 服务器日志文件，以及将输出存储在何处。通过如下选项来实现：\n\
  \n```\n LogFile        /path/to/log/file\nOutputDir      /path/to/output/directory\n\
  ```\n\nAnalog 和 Webalizer 在这些选项设置上的一个重要区别是：Analog 要求你指定一个输出文件名，而 Webalizer 要求你指定一个输出目录，并在其中存储文件。如果你将输出目录设置为\
  \ Web 服务器区域内的某个位置，则可以使用 Web 浏览器浏览 Webalizer 的输出。如果你将输出放在其他地方，你仍然可以使用 Web 浏览器访问它，但只能通过指定\
  \ `file://` `URL` 在 Web 服务器计算机本身进行。还有其他你可能想要调整的 Webalizer 配置选项，包括：\n\n* `Incremental`——如果设置为\
  \ `yes`，此选项会导致 Webalizer 在两次运行之间存储其内部状态，以便你可以分块处理日志。例如，你可以每天运行一次 Webalizer，它会记住已经处理过的条目并适应轮转后的日志文件。此选项默认值为\
  \ `no`，这会导致 Webalizer 每次运行时都重新分析日志文件。\n* `HostName`——你可以设置在报告标题中使用的主机名（该标题通过 `ReportTitle`\
  \ 选项设置）。\n* `GroupDomains`——在报告主机名时，Webalizer 通常按完整主机名进行分析。不过，你通过为 `GroupDomains`\
  \ 指定一个非 0 值，可以将一个域名内的主机名进行分组。该值是从右侧主机名元素开始计算的用于分组的个数。例如，`GroupDomains 2` 会导致 gingko.pangaea.edu\
  \ 和 birch.pangaea.edu 被分组为 pangaea.edu。此选项可以帮助清理 Webalizer 生成的一些杂乱信息。\n* `GroupSite`——这是另一种分组选项，但它作用于单个站点。例如，`GroupSite`\
  \ `*.abigisp.net` 会将 `abigisp.net` 下的所有主机名在报告中分在一起。\n* `HideSite`——此选项会隐藏给定域名下的站点，其指定方式与\
  \ `GroupSite` 选项相同。`GroupSite` 和 `HideSite` 选项经常结合使用，以创建一个不报告单个站点信息的分组。\n\nWebalizer\
  \ 的配置文件通常比 Analog 的更长、更复杂，上述列表仅涵盖了少数 Webalizer 选项。大多数选项在标准配置文件的注释中都有说明，因此你可以咨询它获取更多信息。\n\
  \n## 运行 Webalizer\n\n你可以通过输入它的名称 `webalizer` 来运行 Webalizer。与 Analog 类似，除非对 Web 服务器访问日志的读取权限或对\
  \ Webalizer 输出目录的写入权限被限制为 `root`，否则 Webalizer 不需要以 `root` 身份运行。你可能希望在 cron 任务中运行\
  \ Webalizer，并将 `Incremental` 选项设置为 `yes`，以便程序自动构建网站访问摘要的历史。\n\n### TIP\n\n![TIP](img/tip.gif)\n\
  \n很有可能你的 Apache 安装创建了一个 cron 任务来轮转 Apache 日志文件；如果没有，如前所述，你需要创建这样的配置。为了确保 Webalizer\
  \ 能够捕获尽可能可能的 Web 访问，请在轮转发生之前运行 Webalizer，即使你已经已经在自己的 cron 任务中运行了它。\n\n## 解读 Webalizer\
  \ 输出\n\nWebalizer 提供了一个层级的报告。第一层概览层显示了过去一年的活动摘要。（在新安装的系统上，大多数月份将是空的。）此摘要以表格和柱状图的形式展示了每个月的点击次数、网页下载量、传输的千字节数等信息。你可以点击摘要表中的月份名称以进入第二层分析，该分析将更详细地拆分该月的活动。此页面包含几个子部分：\n\
  \n* `Monthly statistics`——第一个区域提供了与第一层分析页面相同的信息，并多了一些，例如返回给客户端的各种响应代码的数量。\n* `Daily\
  \ statistics`——第二个区域显示了柱状图和表格，总结了该月每天的 Web 流量。摘要统计包括页面数、点击次数、文件数以及传输的千字节数。\n* `Hourly\
  \ statistics`——此区域提供的信息与每日统计区域类似，但按一天的小时进行拆分。你可以利用此定位你网站的流量高峰时，这在规划容量或调试与容量相关的问题时是重要信息。\n\
  * `Top URLs`——Webalizer 展示了两个表格，总结了与特定 URL 相关的点击次数和千字节数。（如果你喜欢，可以使用 Webalizer 配置文件中的分组选项来创建\
  \ URL 组并显示在此列表中。）一个表格按点击次数列出顶级 URL，另一个按千字节数列出顶级 URL。\n* `Entry and Exit pages`——两个表格显示了最受欢迎的入口和退出页面。入口页面是用户访问你的网站时查看的第一个页面。退出页面是用户访问你的网站时查看的最后一个页面。\n\
  * `Top sites`——Webalizer 对访问你网站最多的客户端（按点击次数和千字节数）进行了总结。你可以在 Webalizer 配置文件中使用如前面提到的\
  \ `GroupSite` 等选项将站点分组。\n* `Top referrers`——如果你的 Web 日志文件包含引用者信息，Webalizer 会汇总这些信息，让你看到哪些网站产生的指向你网站链接最多。\n\
  * `Top search strings`——某些搜索引擎在生成指向你网站的链接时，会将搜索字符串作为引用者 `URL` 的一部分。Webalizer 可以提取这些信息并重新搜索字符串，然后由\
  \ Webalizer 为你总结。\n* `Top user agents`——Webalizer 总结了访问你网站频率最高的 Web 浏览器名称。\n* `Top\
  \ countries`——Webalizer 的最后部分按它所谓的“国家”对访问进行总结。实际上，Webalizer 是按顶级域名 `TLD` 名称对访问进行总结，因此你的顶级“国家”可能包括\
  \ *US Commercial,*、*Network,* 以及其他不限于特定国家的域名。\n\n如果你想比较 Web 服务器访问的趋势，概览层可以提供总体趋势，但你需要比较每月的报告（例如，在并排的\
  \ Web 浏览器窗口中）来查看特定的访问模式如何随时间变化。\n\n# Summary\n\n\n\nWeb 服务器是许多网络中极其重要的工具。它们可以被用作内外部通信的手段。传统上，Web\
  \ 服务器被用于从 Web 服务器向客户端传递静态信息，但表单和脚本越来越多地被用于在线订单输入、调查等等双向通信。Web 服务器功能（如 `SSL` 安全性和虚拟域名）使得安全地传输数据以及在单台计算机上运行多个站点成为可能。\n\
  \n虽然运行 Web 服务器本身至关重要，但 Web 服务器本身还围绕着两项重要任务：创建内容和解释日志文件。网页可以是使用文本编辑器创建的极其简单的文档，也可以是借助网页设计工具构建的复杂文件集。在\
  \ Web 服务器流水线的另一端是记录其操作的日志文件。你可以使用这些文件来跟踪你网站的流行程度，通过流量模式识别潜在的故障（这些模式可能会消耗你的硬件或连接），并发现可能链接到你网站的站点信息。分析这些日志文件对于规划网站的更改和升级非常有帮助。\n\
  \n# 第 21 章 运行 FTP 服务器\n\n`文件传输协议 (FTP)` 是一种老旧且常见的 Internet 协议。正如名称所示，它用于在计算机之间传输文件。根据服务器的配置，客户端可以从\
  \ `FTP` 服务器下载文件或向其上传文件。在某些情况下，你可能希望运行一个 `FTP` 服务器来代替或补充 Web 服务器或文件共享服务器。在其他情况下，运行多种类型的服务器可能是多余的。如果你决定运行\
  \ `FTP` 服务器，Linux 有多种 `FTP` 服务器选项可用。在大多数情况下，这些服务器带有适用于某些目的的默认配置，但你可能希望对配置进行微调。运行\
  \ `anonymous` `FTP` 站点可能需要更彻底的更改，它允许任何人从服务器下载文件。\n\n## 何时运行 FTP 服务器\n\n从表面上看，`FTP`\
  \ 服务器与 Web 服务器（第 20 章, 运行 Web 服务器）以及文件共享服务器（第 7 章, 通过 Samba 共享文件和打印机，以及 第 8 章, 通过\
  \ NFS 共享文件））都有许多共同点。所有这些服务器允许在计算机之间传输完整文件，因此在某些情况下，你可能成功地使用任何一种服务器类型。尽管，每种协议都有其独特的优缺点，其中任何一点在特定情况下都可能变得重要。`FTP`\
  \ 与其他文件传输协议之间的主要区别如下：\n\n*   **身份验证**。`FTP` 服务器需要用户名/密码对来完成访问。（接下来的章节“#设置匿名 FTP\
  \ 服务器””描述了允许无密码的用户访问你服务器的一种惯例。）Web 服务器通常不需要身份验证，尽管有方法可以为网站添加身份验证。某些文件共享协议需要用户名/密码验证，但另一些依赖于基于\
  \ `IP` 的身份验证。\n\n*   **账户**。由于 `FTP` 的用户名/密码系统，它是从远程位置访问个人用户文件的一种良好方法。`NFS` 和 `Samba`\
  \ 也可以这样使用。虽然 Web 服务器可以轻松让用户访问其文件，但大多数 Web 服务器的公开性意味着，要为这些访问提供安全性，需要更多的配置更改。\n\n\
  *   **加密**。标准的 `FTP` 服务器不加密任何数据，包括用户名或密码。这使得它们在整个 Internet 上使用时存在风险，尽管匿名模式可以减少某些用途的某些风险。还有一些提供加密的安全\
  \ `FTP` 变体可用，例如带有 `Kerberos` 的变体（参见 第 6 章, 通过 Kerberos 验证用户）。Web 服务器通常不加密数据，但提供安全的变体。`Samba`\
  \ 可以配置为加密密码，通过更多工作，可以使用匹配的 `Samba` 系统或代理服务器加密所有数据传输。`NFS` 不使用密码，因此密码加密不是问题，但 `NFS`\
  \ 通常也不加密数据。作为 Secure Shell (`SSH`) 软件包一部分的 `scp` 和 `sftp` 程序加密所有数据传输，后者在许多情况下可以作为\
  \ `FTP` 的良好替代品。\n\n### 提示\n\n![提示](img/tip.gif)\n\n如果你必须使用不加密密码的协议，特别是在像 Internet\
  \ 这样不安全的网上，你应该定期更改密码。这将尽可能地减少任何可能获得密码的恶棍的机会窗口。\n\n*   **连接**。`FTP` 与 `Samba` 和 `NFS`\
  \ 一样，依赖于持续连接。用户可以登录 `FTP` 服务器，如果超时参数设置得足够，可以闲置几小时后传输文件。Web 服务器的运行通常不同，在会话期间只执行一次或几次传输。`FTP`\
  \ 与大多数其他文件交换协议的不同在于，`FTP` 使用两个端口：一个用于控制信号，一个用于实际数据传输。客户端始终发起到服务器端口 `21` 的控制连接。取决于所使用的模式（主动或被动），数据连接可能由客户端或服务器发起。这种特殊的安排会增加防火墙配置的复杂，尽管大多数防火墙包含了处理此问题的简单方法。\n\
  \n*   **直接编辑文件**。文件共享服务器（如 `NFS` 和 `Samba`）擅长允许个人像编辑本地文件一样编辑远程文件。例如，用户可以直接从文件共享服务器加载文件到文本编辑器中并直接保存回服务器，而不让文件接触本地磁盘。`FTP`\
  \ 或 `HTTP` 都没有为此目的设计的；要编辑 `FTP` 或 Web 服务器上的文件，你必须将其下载到本地磁盘，保存更改，然后将文件传回服务器。不过，有一些工具可以让某些操作系统将\
  \ `FTP` 服务器视为更像文件共享。例如，Linux `FTP` 文件系统 ([`ftpfs.sourceforge.net`](http://ftpfs.sourceforge.net))\
  \ 为 Linux 启用了此功能。尽管这最好被视为一种变通方案。\n\n\n\n\n- **双向传输**：文件共享服务器和 `FTP` 均允许方便的双向传输，或者允许服务器管理员限制对服务器部分或全部区域的写权限。Web\
  \ 服务器最常用于单向流量，尽管也可以通过 `HTTP` 将文件从客户端传输到服务器。\n\n- **跨平台客户端**：`FTP` 和 Web 服务器都能在几乎任何支持\
  \ `TCP/IP` 的操作系统（甚至是 DOS）的广泛可用客户端上良好运行。相比之下，文件共享协议通常更以平台为中心——`NFS` 为 UNIX 和 Linux\
  \ 客户端服务；`Samba` 为 DOS、Windows 和 OS/2 客户端服务；此类推。这些界限通常可以跨越，但使用文件共享客户端进行跨平台操作时，往往会有缺点，例如对文件名、权限、文件属性等的限制。你还可能需要非常规或商业客户端软件，而这些在与\
  \ `FTP` 或 Web 服务器交互时并不是必需的。\n\n- **服务器配置的易易性**：大多数 Linux 系统上的默认 `FTP` 服务器配置允许用户以文本模式登录相同的访问权限，在服务器上读写文件。如果这是你需要的，`FTP`\
  \ 服务器的配置可以相当简单。在很大种程度上，`NFS`、`Samba` 和 Web 服务器需要更改或额外的配置选项来提供此类访问。另一方面，为了提供匿名或其他受限的访问，你可能需要稍微修改\
  \ `FTP` 配置，而另一种服务器类型的默认配置可能是更好的匹配方案。\n\n总的来说，`FTP` 在两个用途上都是很好的选择：\n\n- **本地用户的本地访问**：如果你的\
  \ Linux 系统有本地用户，你可以运行 `FTP` 允许这些用户从本地网络上的其他系统下载或上传文件。从客户端的角度来看，这种访问可能没有文件共享访问那么方便，但对你来说，在服务器上配置它可能会更容易。`FTP`\
  \ 的跨平台可用性在跨平台网络中也是一大优势。\n\n- **远程用户的匿名访问**：建立一个匿名 `FTP` 站点允许远程用户轻松地从你运行的文件库中下载文件，如果你愿意接受此类提交，他们甚至可以匿名上传文件。不过，Web\
  \ 服务器可以作为此功能的良好替代方案，特别是当你不想接受匿名上传时。如果你不想运行完整的 Web 站点，匿名 `FTP` 方案可能同样好。\n\n在这两种情况下，你都应该警惕\
  \ `FTP` 的安全影响。如果你想为本地用户提供文件访问，你应该确保*只有*本地用户可以访问服务器；由于互联网大范围内的密码嗅探风险极大，如果你想为本地用户提供远程文件访问，未加密的\
  \ `FTP`并不是一个好选择。事实上，即使仅在本地使用，你可能也希望实施强制性的密码过期时间，以降低在你有一个本地“坏分子”嗅探密码时面临的风险。远程匿名访问不产生密码风险，但你应该考虑禁用常规用户的访问，以最小化入侵的风险。此外，为匿名用户提供写权限可能非常有风险，特别是当该访问未限制在某些受控目录时。如果你允许匿名写权限，你应该采取措施防止文件在被批准之前对其他人可见，以防你的站点成为软件盗版者或其他不受欢迎者的聚集地。\n\
  \n# Linux 的 FTP 服务器选项\n\nLinux 有多种 `FTP` 服务器可用，但有三个占据主导地位：\n\n- **BSD FTPD**：UNIX\
  \ 的 BSD 版本自带其 `FTP` 服务器，并且存在这些服务器的到 Linux 的各种端口。其中一些也被称为 `OpenBSD FTPD`。`BSD FTPD`\
  \ 端口随 Debian 和 SuSE 发布。这类服务器通常被认为比其他 `FTP` 服务器更安全，但在 Linux 世界并不流行。\n\n- **ProFTPd**：该软件包总部位于\
  \ `http://www.proftpd.org`，随 Debian、Mandrake、Slackware、SuSE 和 TurboLinux 发布。它是第二流行的\
  \ Linux `FTP` 服务器，其人气在 2002 年正在上升。它的部分运行模仿了 Apache。\n\n- **WU-FTPD**：华盛顿大学 FTP 守护进程\
  \ (`WU-FTPD`) 是 Linux 上最易获得的 `FTP` 服务器。它的主网站是 `http://www.wu-ftpd.org`，随 Caldera、Debian、Mandrake、Red\
  \ Hat、SuSE 和 TurboLinux 发布。与其他流行的 `FTP` 服务器相比，它的安全问题更多。\n\n任何这些 `FTP` 服务器都可以处理基本或高级的\
  \ `FTP` 服务器职责。本章介绍了配置 `ProFTPd` 和 `WU-FTPD`，因为它们是最流行的服务器，且所有主要的 Linux 发行版都至少带有其中一种服务器。`ProFTPd`\
  \ 比 `WU-FTPD` 更灵活，考虑到它们相对的安全历史，在大多数情况下 `ProFTPd` 可能是更好的选择。如果你的发行版带有它但没带 `ProFTPd`，或者你已经熟悉\
  \ `WU-FTPD`，你可能想坚持使用 `WU-FTPD`。如果你喜欢冒险，可以考虑 `BSD FTPD`，但它实际上是一个小的服务器家族，因为有多个不同的\
  \ Linux 端口。因此，对其进行完善文档非常困难。\n\n# 基本 FTP 服务器配置\n\n一旦安装了 `FTP` 服务器软件包，你就想让它运行起来。作为一个一般规则，使用\
  \ `WU-FTPD` 的发行版通过超级服务器（super server）运行它，而使用 `ProFTPd` 的发行版通过 SysV 启动脚本运行它。不过，你可以根据需要更改这些选项。在大多数发行版中，让服务器运行是你为了基本功能必须关注的唯一配置选项，因为默认配置对许多用途都有效。具体来说，默认配置允许在系统中拥有账户的用户登录并在其主目录之间传输文件。如果你想让\
  \ `FTP` 承担其他角色，或者想调整配置默认值，你可能需要修改这些配置。一种常见的 `FTP` 服务器配置——匿名 `FTP`——将在下一节“设置匿名 FTP\
  \ 服务器”中介绍。默认配置通常至少能够处理这一角色。\n\n## 运行 FTP 服务器\n\n\n\n\n\n请参阅第 4 章——关于从超级服务器、SysV\
  \ 启动脚本和本地启动脚本运行服务器的详细信息。如果你使用的是发行版附带的 <FTP> 服务器软件包，可能只需要进行少量更改或无需任何更改即可运行服务器。不过，你仍需要考虑以下几点注意事项：\n\
  \n* 某些使用 `inetd` 的发行版附带有一个 `/etc/inetd.conf` 文件，其中包含了针对不同 <FTP> 服务器的独立条目。你可能可以安装多个\
  \ <FTP> 服务器，并通过注释掉你`不`想使用的服务器的 `inetd.conf` 条目并重启 `inetd` 在它们之间进行切换。如果你只安装了一个 <FTP>\
  \ 服务器，你必须确保`仅`取消对应服务器的条目注释。如果你取消取消了错误的条目，你的 <FTP> 服务器将无法工作。\n\n* 大多数使用 `xinetd`\
  \ 的发行版在 `/etc/xinetd.d` 中包含一个用于启动 <FTP> 服务器的文件。该文件是 <FTP> 服务器软件包的一部分。该文件可能包含一行 `disable\
  \ = yes`，其作用是禁用 <FTP> 服务器配置。此条目的存在是一种安全措施；它强迫你主动将条目更改为 `disable = no` 以运行 <FTP>\
  \ 服务器。（你还必须重启 `xinetd` 才能使更改生效。）\n\n* 无论通过 `inetd` 还是 `xinetd` 运行，FTP> 服务器都可以接受参数。标准配置文件包含了适用于使用发行版附带的\
  \ <FTP> 服务器典型安装的适当参数。如果你想使用不同的 <FTP> 服务器，你可能需要在你的超级服务器配置文件调整传递给服务器的参数以及服务器的文件名。\n\
  \n如果你的 <FTP> 站点非常受欢迎，你可能想通过 SysV 或本地启动脚本运行你的 <FTP> 服务器。这样做会对入站的 <FTP> 请求产生略快一点的响应，但\
  \ <FTP> 服务器足够小，这种效果微乎其微。少数安装（例如 Debian 和 Mandrake 的 `ProFTPd` 安装）默认以这种方式运行，也许是因为\
  \ `ProFTPd` 在其作为独立服务器运行时最容易支持匿名 <FTP>。\n\n在继续后续配置之前，你可能想要检查一下 <FTP> 服务器是否适用于传统的身份验证登录（即使用用户名/密码对）。至少，当你尝试从远程主机使用\
  \ <FTP> 客户端时，服务器应该返回某种登录提示。例如，考虑以下使用基本 Linux `ftp` 程序的交互过程：\n\n```\n $ ftp harding.threeroomco.com\n\
  ftp: connect: Connection refused\n```\n\n这表明 <FTP> 服务器根本没有运行。如果你收到此响应，应该检查你的系统日志文件，寻找关于服务器为何未运行的线索。如果你刚刚安装了服务器，你必须记住启动它使其运行或重启你的超级服务器。一旦你从服务器获得了响应，就可以继续精调它的配置了。\n\
  \n## WU-FTPD 配置\n\n配置 WU-FTPD 需要编辑多个配置文件中的一个或多个。通过这些文件，你可以控制谁可以访问 <FTP> 服务器以及用户可以对服务器做什么。某些文件还设置了特殊选项，允许\
  \ WU-FTPD 为用户处理文件或执行高级命令。\n\n### WU-FTPD 配置文件\n\n大多数使用 WU-FTPD 的发行版将其将其配置文件直接放置在\
  \ `/etc` 中。有几个 WU-FTPD 配置文件，它们的名称都以 `ftp` 开头：\n\n* `ftpaccess` —— 这是最复杂的 WU-FTPD\
  \ 配置文件，稍后会进行详细描述。它用于设置日志选项、匿名访问使用的权限、低级 <TCP>/<IP> 选项等。\n\n* `ftpconversions` ——\
  \ 你在 `ftpaccess` 中可以激活的功能之一是在传输到客户端之前自动压缩文件或归档目录。要使用此功能，你必须在文件中文件中定义要归档或压缩的文件类型。\n\
  \n* `ftphosts` —— 你可以使用此文件限制可能访问你的 <FTP> 服务器的主机甚至用户。以 `allow` 开头的行显式允许指定的主机，而以 `deny`\
  \ 开头的行则显式拒绝它们。例如，`deny sjones` 阻止用户 `sjones` 登录。\n\n* `ftpusers` —— 该文件包含一个允许使用\
  \ WU-FTPD 的本地用户列表。该文件通过可插拔认证模块 (<PAM>) 系统运行；尽管如此，它是保护你的 <FTP> 服务器免受滥用的有用方法。该文件的默认版本包含各种系统账户名称，如\
  \ `root`、`nobody` 和 `daemon`。如果需要，你可以添加更多。\n\n* `ftpservers` —— 通常情况下，WU-FTPD 向所有客户端呈现相同的选项。你可以使用此文件为主机指定完全独立的配置。该文件中的每行都是一个\
  \ <IP> 地址、主机名或域名，后跟一个目录名。如果连接建立，WU-FTPD 将在指定的目录查找配置文件。例如，`192.168.1.8 /etc/ftpd/trusted`\
  \ 导致当 `192.168.1.8` 连接时，WU-FTPD 在 `/etc/ftpd/trusted` 中查找。\n\n这些文件在实现特定的 <FTP> 服务器配置时都可能很重要。对于大多数选项，最重要的文件是\
  \ `ftpaccess`，但 `ftphosts`、`ftpusers` 和 `ftpservers` 对于保护你的服务器有用。如果你希望 WU-FTPD 处理它传输的文件，则修改\
  \ `ftpconversions`，可能结合 `ftpaccess` 使用。\n\n### 常见 WU-FTPD 配置选项\n\n许多 WU-FTPD 配置选项围绕“用户类”的概念构建。这是用户的一种逻辑分组，在某些方面类似于\
  \ Linux 组。WU-FTPD 类根据客户端的源 <IP> 地址或主机名定义。你在 `ftpaccess` 中通过使用 `class` 选项设置一个类，其格式如下：\n\
  \n```\n class  classname  typelist  addresslist\n```\n\n该定义的组成部分如下：\n\n* `classname`:\
  \ 这是该类的名称。许多发行版的默认配置定义了一个名为 `all` 的类，但你可以更改或扩展此定义。\n\n\n\n\n\n* `typelist`: 这是一个由逗号分隔的列表，表示该类适用于本地账户类型或访问类型：`real`\
  \ 表示本地用户账户，`guest` 表示访客账户，`anonymous` 表示匿名账户。\n* `addresslist`: 这是一个属于该类的 IP 地址、主机名或域名的列表。在条目前加一个感叹号（`!`）会导致该条目*不包含*在列表中。星号（`*`代表所有客户端。如果你包含多个条目，它们将通过逻辑或（OR）操作进行组合。例如，`threeroomco.com`、`pangaea.edu`\
  \ 会为属于任一域名的客户端创建一个类。\n\n标准的 `ftpaccess` 文件包含一个类似下面的定义：\n\n```\n class  all  real,guest,anonymous\
  \  *\n```\n\n此条目设置了一个默认的通用类，适用于所有类型的访问，并将所有调用者分配到此类。为了精细调整您的配置，您可能会创建多个类，例如一个用于本地用户，另一个用于远程用户。即使\
  \ `class` 条目除 `addresslist` 外完全相同，您也可以在随后的选项中以不同的方式使用它们。其中一些额外选项包括：\n\n* `deny addresslist\
  \ messagefile`: 此选项告诉 WU-FTPD 拒绝对指定地址的所有访问。这类似于 `ftphosts` 中的 `deny` 规范，但您可以指定一个发送给主机的拒绝通知的文件名，以便用户知道他们为什么不被允许进入。\n\
  * `autogroup groupname class [,class,...]`: 当指定 `class` 的成员登录时，您可以让 WU-FTPD 对 `groupname`\
  \ 执行 `setgid` 操作。您可以这样做来允许 `class` 的匿名成员读取 `groupname` 具有读取权限但不存在世界读（world read）权限的文件。\n\
  * `defumask umask class [,class]`: 此选项告诉 WU-FTPD 在用户上传文件时，为指定 `class` 的成员使用指定的 `umask`\
  \ 创建文件。\n* `timeout option seconds`: 您可以使用此选项设置各种超时值。`option` 值可以是 `accept`、`connect`、`data`、`idle`、`maxidle`\
  \ 或 `rfc931`。\n* `noretrieve [relative|absolute] [class=classname] filenames`: 此选项告诉\
  \ WU-FTPD 禁止传输指定的文件名。如果指定的文件名实际上是目录名，则整个目录将受到限制。您可以选择地将此选项限制到指定的类。`relative` 和 `absolute`\
  \ 参数指的是文件规范是被解释为绝对路径（相对于计算机的真实根目录）还是相对于 `chroot` 环境（如在第 23 节“配置 chroot 监狱”中描述）。默认情况下，以斜杠（`//`）开头的会被被解释为绝对路径。此选项的示例可能是\
  \ `noretrieve /etc /usr`，它将阻止传输 `/etc` 或 `/usr` 目录中的任何文件。\n\n### 提示\n\n您可能希望使用 `noretrieve`\
  \ 来禁止访问 `/etc/passwd`、`/etc/shadow`、`/etc/ftpaccess`、`core`（任何目录下的）以及任何其他敏感的站点特定文件。\n\
  * `allowretrieve [relative|absolute] [class=classname] filenames`: 此选项是 `noretrieve`\
  \ 的显式反操作；它为 `noretrieve` 规则提供例外。其语法与 `noretrieve` 相同。\n* `message filename [when]\
  \ [class]`: 此选项列出了在某些情况下向 FTP 客户端显示的文件。具体来说，如果 `when` 是 `login`，则在用户登录后立即显示消息。如果\
  \ `when` 是 `cwd=dir`（其中 `dir` 是特定目录），则在用户进入该目录时显示消息。您可以通过在选项末尾添加类名来可选地将此消息限制为某些类的用户。此选项使用的示例请考虑\
  \ `message .message cwd=*`。这会导致 WU-FTPD 在用户切换到该目录时发送该目录下的 `.message` 文件的内容。这允许您创建描述特定目录内容或整个\
  \ FTP 服务器目的的横幅消息。\n* `compress [yes|no] class [,class]`: 您可以使用此选项启用压缩。如果文件存在且用户请求一个具有同名文件，但带有一个指示压缩的额外文件扩展名（例如\
  \ `file.gz` 而不是 `file`），则 WU-FTPD 将压缩原始文件并发送给用户。指示压缩的扩展名在 `ftpconversions` 文件中指定。\n\
  * `tar [yes|no] class [,class]`: 此选项的作用与 `compress` 类似，但它适用于从目录创建 `tar` 文件。您可以使用此功能为用户提供一种获取整个目录文件的简单方法。\n\
  * `chmod`, `delete`, `overwrite`, `rename`, 和 `umask`: 这些选项都接受一个 `yes` 或 `no`，后跟一个\
  \ `typelist`，如前述引用类定义所示。（您也可以使用现有的类名）。当指定时，这些选项允许或拒绝客户端使用命名的 FTP 命令。例如，`delete no\
  \ guest,anonymous` 配置 WU-FTPD 禁止访客和匿名用户删除文件。\n* `dns refuse_mismatch filename`:\
  \ 如果对客户端 IP 地址进行反向 DNS 查询获得的主机进行正向 DNS 查询与原始 IP 地址不匹配，则此选项会导致 WU-FTPD 拒绝连接。首先，它会显示指定的\
  \ `filename`，让用户知道出了问题。\n* `dns refuse_no_reverse filename`: 如果客户端 IP 地址没有反向 DNS\
  \ 查询，此选项将导致 WU-FTPD 拒绝连接。WU-FTPD 将 `filename` 发送给违规者以解释拒绝原因。\n\n这些只是最常用且实用的 WU-FTPD\
  \ 选项之一。更多信息请参阅 `ftpaccess` 手页。接下来的章节“WU-FTPD 匿名选项”将描述一些如果您想建立匿名 FTP 站点时会特别感兴趣的选项。\n\
  \n## ProFTPd 配置\n\nProFTPd 的配置风格灵感来自 Apache，因此如果您熟悉 Apache 配置，您会发现 ProFTPd 的许多选项名称和通用配置样式非常熟悉。\n\
  \n### ProFTPd 配置文件\n\nProFTPd 的主配置文件是 `proftpd.conf`，它通常存储在 `/etc` 中。您在该文件中设置大多数\
  \ ProFTPd 选项。该文件中的某些行是注释，以井号（`#`）开头并持续到行末尾。大多数非注释行采用以下形式：\n\n```\n Directive [Value]\n\
  ```\n\n少数指令接受多个值作为选项。某些指令被组合在一起，如周围角括号（`<>`）包围的指令所示，例如底的分组：\n\n```\n <Limit WRITE>\n\
  \  DenyAll\n  Allow from 172.21.33.\n</Limit>\n```\n\n组的结束指令使用斜杠（`/`）来表示该指令块的结束。\n\
  \n\n\n\n\n除了主配置文件外，ProFTPd 还会使用 `ftpusers` 文件。ProFTPd 使用该文件的方式与 WU-FTPD 使用同名文件的方式相同。具体而言，ProFTPd\
  \ 会阻止文件中列出的用户名作为 FTP 登录用户名。（更准确地说，ProFTPd 依赖于 `PAM` 进行身份验证，而 `PAM` 使用 `ftpusers`\
  \ 来决定哪些人不被访问 FTP 服务器。）默认的 ProFTPd 安装程序通常包含 `ftpusers` 文件，其中列出了常见的系统用户名，如 `nobody`、`daemon`\
  \ 和 `root`。你可能应该将为非常规服务器创建的任何系统账户添加到此列表中。如果普通用户不应该拥有系统的 FTP 访问权限，你也可以输入这些用户名。\n\n\
  ## 常用 ProFTPd 配置选项\n\nProFTPd 支持大量的配置指令。这些指令在官方 ProFTPd 文档中有详细说明，可以访问：[`www.proftpd.org/docs/`](http://www.proftpd.org/docs/)。不过，你可能不需要使用所有这些选项。\n\
  \n首先，有必要了解设置上下文块（context blocks）的不同类型的指令。许多指令仅在特定的上下文块内生效，因此了解这些块是什么极其关重要的。最常见的块如下：\n\
  \n*   `<Anonymous dirname>` — 你可以使用此指令创建一个匿名 FTP 站点，在其中你指定了适用于匿名 FTP 访问的指令，这些指令与普通用户名/密码访问区分开来。匿名用户将*仅*能够访问指定\
  \ `dirname` 内的文件；ProFTPd 会对该目录执行 `chroot` 操作，如第 23 章 所示。\n\n*   `<Directory dirname>`\
  \ — 你使用此选项指定一个适用于一组指令的目录。正如你所预期的，`dirname` 是目录名称。该名称通常必须以绝对路径指定——即以斜杠 (`/`) 开头。默认\
  \ ProFTPd 配置文件通常包含一个以 `<Directory /*>` 开头的块，用于指定所有目录的默认行为。\n\n*   `<Global>` — `<Global>`\
  \ 指令块设置适用于主服务器配置和所有 `<VirtualHost>` 配置的选项。\n\n*   `<Limit command-group>` — 此选项指定一组\
  \ FTP 客户端命令，根据该选项后的指令来限制其操作。`command-group` 是一个或多个 FTP 命令的集合，例如 `CWD`、`CDUP`、`MKD`、`RNFR`、`RNTO`、`DELE`、`RMD`、`RETR`\
  \ 和 `STOR`。特殊的分组命令包括 `READ`（所有读取命令）、`WRITE`（所有写入命令）、`DIRS`（所有目录相关命令）和 `ALL`（所有命令）。你也可以使用\
  \ `LOGIN` 来限制登录访问。\n\n*   `<VirtualHost address>` — ProFTPd 可以根据其被访问的方式应用不同的指令。你可以指定\
  \ IP 地址或主机名作为 `address`，当 ProFTPd 响应该地址地址时，它将使用块内包含的指令。\n\n大多数指令可以在上述一个或多个块中使用，并且许多指令可以在任何块之外作为全局选项使用。如果一个指令同时出现在全局和指令块中（或在嵌套块的两个嵌套位置），当触发限制条件时，嵌套得更深的实例将覆盖更全局的实例。常用且实用的指令包括：\n\
  \n*   `Allow [from] network-specifier` — 此指令用于 `<Limit>` 块内，以指定哪些客户端可以访问相关资源。特别是，`network-specifier`\
  \ 是由逗号分隔的 IP 地址、主机名、域名（以点为开头）、IP 块（以点为结尾）或关键字 `all` 或 `none`。你可以在 `Allow` 之后包含 `from`，但其使用是可选的且仅用于美观；它不会影响指令的功能。\n\
  \n### 提示\n\n![提示](img/tip.gif)\n\n如果可能，请使用 IP 地址或 IP 块而不是主机名或域名。这减少了 FTP 服务器对 DNS\
  \ 服务器在此安全功能上的依赖，从而使入侵 FTP 服务器变得更加。\n\n*   `AllowAll` — ProFTPd 默认允许访问目录，但这种行为可以通过多种方式被覆盖。你可以在\
  \ `<Directory>`、`<Limit>` 或 `<Anonymous>` 块中使用 `AllowAll` 来恢复默认的允许。\n\n*   `AllowGroup\
  \ group-list` — 你可以使用此指令允许特定组访问某些区域。`group-list` 是由逗号分隔的组列表，用户必须是*所有*组的成员才能通过此测试。如果组名前带有感叹号\
  \ (`!`)，其含义将反转，因此你可以允许*不是*该组成员的用户访问。\n\n*   `AllowOverwrite [on|off]` — 你可以使用此指令允许用户覆盖现有文件。默认是\
  \ `off`，即拒绝覆盖权限。\n\n*   `AllowUser user-list` — 此指令允许你覆盖拒绝性指令，以便让特定用户或一组用户访问被拒绝的资源。如果用户名前带有感叹号\
  \ (`!`)，则允许除该用户*之外*的所有用户访问。\n\n*   `DefaultRoot dirname [group-list]` — 你可以通过此选项指定名称，告诉\
  \ ProFTPd 将用户锁定在指定的目录树中。`dirname` 必须以斜杠 (`/`) 表示绝对目录或以波浪号 (`~`) 表示用户家目录。你可以通过指定合适的\
  \ `group-list`（类似于 `AllowGroup` 中的列表）来使此指令仅适用于某些用户。\n\n### 提示\n\n![提示](img/tip.gif)\n\
  \n通过将 `DefaultRoot ~` 指令作为全局选项，你可以防止用户进入他人目录或系统目录。配置此后，ProFTPd 允许用户*仅*访问其家目录内的文件。\n\
  \n*   `DefaultTransferMode [ascii|binary]` — FTP 提供了两种常见的传输模式。二进制传输原样传输文件，但 ASCII\
  \ 提供了文本文件格式之间的转换。最常见的是 UNIX、DOS 和 Macintosh 风格的换行符会在 ASCII 传输中进行转换。虽然 ASCII 传输对于文本文件很方便，但对于二进制文件是灾难性的，因为它们在使用\
  \ ASCII 模式传输时会损坏。ProFTPd 允许你通过 `DefaultTransferMode` 指令设置默认传输模式。该指令默认为 `ascii`。\n\
  \n*   `Deny [from] network-specifier` — 此指令是 `Allow` 的相反；在`<Limit>` 块内阻止客户端访问资源。\n\
  \n*   `DenyAll` — 你可以在 `<Limit>`、`<Anonymous>` 或 `<Directory>` 块中使用此指令拒绝所有用户访问指定资源。你可能想在其后跟随一些特定的允许选项，以放宽对特定用户的限制。\n\
  \n\n\n\n\n*   `DenyGroup` `group-list`— 此指令允许你在 `<Limit>` 块中指定一个被拒绝访问的组。`group-list`\
  \ 的定义方式与 `AllowGroup` 指令相同。\n*   `DenyUser` `user-list`— 此指令的作用与 `AllowUser` 类似，但它是阻止访问由\
  \ `<Limit>` 指定的资源，而不是启用访问。\n*   `DisplayConnect` `filename`— 如果使用此指令，ProFTPd 会在用户连接但在登录完成之前显示\
  \ `filename`。\n*   `DisplayFirstChdir` `filename`— 此指令导致 ProFTPd 在用户首次进入某个目录时显示\
  \ `filename` 的内容。这通常默认为 `.message`，从而会向用户显示目标目录中的 `.message` 文件。\n*   `DisplayLogin`\
  \ `filename`— 此指令与 `DisplayConnect` 非常相似，但其消息会在用户成功登录登录*之后*出现。\n*   `Group` `groupid`—\
  \ 当作为独立服务器运行时，ProFTPd 以 `root` 身份启动，但会尽可能地更改身份，以最大限度地减少以 `root` 身份运行服务器的安全风险。你可以通过此指令设置它要更改的组。许多默认配置将组设置为\
  \ `nogroup`、`ftp` 或其他低特权组。\n*   `MaxClients` `number`|none`— 你可以使用此指令限制允许登录的客户端数量。如果你指定一个\
  \ `number`（例如 `30`），则该数字为限制；`none` 是禁用此功能的代码。\n*   `MaxInstances` `number`— 此指令与\
  \ `MaxClients` 类似，两者都限制 ProFTPd 接受的连接数。然而，`MaxInstances` 作用于*连接*，而不是像 `MaxClients`\
  \ 那样作用成功的登录。如果你从超服务器（super server）启动 ProFTPd，则 `MaxInstances` 将不起无效，但超服务器本身就提供了类似的功能。\n\
  *   `Order allow,deny|deny,allow`— 当 `<Limit>` 块中同时出现 allow 和 deny 指令时，ProFTPd 默认先检查所有\
  \ allow 指令，然后检查所有 deny 指令。结果是 allow 指令优先，任何未被显式拒绝的访问都是被允许的。你可以使用 `Order deny,allow`\
  \ 来更改此顺序，使 deny 指令具有优先级，并将拒绝作为默认行为。\n*   `RootLogin on|off`— 默认情况下，出于安全考虑，ProFTPd\
  \ 拒绝 `root` 访问。你可以通过设置 `RootLogin on` 来更改此行为。（你可能还需要调整其他功能，例如从 `/etc/ftpusers` 中移除\
  \ `root`。）\n*   `ServerIdent on|off [\"`ident-string`\"]`— 此指令告诉 ProFTPd 在用户连接时是否要标识自己的身份。如果设置为\
  \ `on`，你可以指定一个标识字符串。默认配置通常将服务器标识为 ProFTPd，这可能比你希望公开提供的信息要多，因此建议更改此字符串。\n*   `ServerName\
  \ \"ident-string\"`— 此指令设置默认 `ServerIdent` 指令所用名称的属性。你可以仅通过 `ServerIdent` 覆盖这两者，但如果你想做一个更细微的更改，可以单独修改\
  \ `ServerName`。\n*   `ServerType inetd|standalone`— 你*必须*为你的配置正确设置此指令。如果你通过超服务器运行\
  \ ProFTPd，请将 `ServerType` 设置为 `inetd`；如果你从 SysV 或本地启动脚本运行服务器，请使用 `standalone`。这告诉\
  \ ProFTPd 它是应该作为普通用户运行并直接处理服务请求（`inetd`），还是以 root 身份运行并产生进程处理特定连接（`standalone`）。\n\
  *   `SyslogLevel emerg|alert|crit|error|warn|notice|info|debug`— 此指令设置 ProFTPd 日志信息的详细程度。`emerg`\
  \ 最不详细，`debug` 最详细，其他介于两者之间。\n*   `TransferLog` `filename`|NONE`— 你可以指定一个日志文件来存储文件传输信息，或者通过指定\
  \ `NONE` 来禁用此功能。你可以通过在 `<Anonymous>`、`<VirtualHost>`、`<Global>` 和通用（未分组）配置区域中独立使用此选项，为不同的目的创建多个日志文件。\n\
  *   `Umask` `file-mask [directory-mask]`— 此指令指定在创建新文件（以及如果指定了，则包括目录）时使用的 umask。默认值通常是\
  \ `022`，这对于许多系统来说是合理的。\n*   `UseFtpUsers on|off`— 你可以通过设置 `UseFtpUsers off` 来关闭\
  \ ProFTPd 对 `/etc/ftpusers` 文件的使用。默认值为 `on`。\n*   `UserAlias` `alias username`—\
  \ ProFTPd 通常使用登录过程中提供的用户名作为身份验证的用户名。不过，你可以创建*别名*，这些别名的处理方式与指定的用户名一样。例如，`UserAlias\
  \ rjones ronald` 会导致任何尝试 `rjones` 的登录尝试都针对 `ronald` 用户账户进行验证。（这种配置对于匿名访问很常见，匿名访问通常内部使用\
  \ `ftp` 账户。）\n\n这些指令以及此处未描述的其他指令，为 ProFTP 提供了极大的灵活性。大多数安装都会创建一个标准的登录功能，以便用户可以登录并访问自己的文件。可能\
  \ true 一个标准的 `<Anonymous>` 部分来支持匿名登录，匿名登录会忽略密码，因此供任何人使用。匿名配置可能需要一些额外的更改，以及放置供匿名用户访问的文件，才能变得有用。\n\
  \n# 建立一个匿名 FTP 服务器\n\nFTP 服务器的一个流行用途是提供匿名 FTP 访问。正如本章前面提到的，匿名 FTP 服务器的功能与 Web 服务器有部分重叠，因此你可能更倾向于*仅*使用\
  \ Web 服务器。另一方面，在某些情况下，仅使用匿名 FTP 服务器，甚至两者都使用，可能是值得的。例如，你可能希望在一个系统上实现匿名文件检索和基于用户名/密码登录的文件传输，但不需要\
  \ HTTP。同时运行这两种对于你的用户来说可能作为一种便利是有意义的，因为他们中的某些可能更倾向于或能更方便地访问某一种类型的客户端。\n\n在建立匿名 FTP\
  \ 服务器之前，你应该意识到这些服务器带来的特殊需求和安全考量。事实上，在决定是否要运行匿名 FTP 服务器时，这些问题可能是至关重要的。一旦你做出了决定，你就需要深入研究\
  \ FTP 服务器的配置文件，设置适当的选项以允许匿名 FTP 访问。你可能还需要修改系统上的其他选项，例如目录权限。\n\n## 匿名服务器的特殊需求\n\n\
  匿名 FTP 服务器的通常用途是从服务器向客户端传递文件。你可能会建立这样一个服务器来存放软件、文档文件等你希望公开的内容。你可以通过在以 `ftp://` 开头的网页中指定\
  \ <acronym class=\"acronym\">URL</acronym> 来链接到这些文件，例如 `ftp://ftp.threeroomco.com/pub/manual.pdf`。此描述中的几点值得特别强调：\n\
  \n\n\n\n\n*   匿名 <acronym class=\"acronym\">FTP</acronym> 站点上的文件通常从服务器传输到客户端，就像典型的\
  \ Web 服务器配置一样。出于如此，匿名 <acronym class=\"acronym\">FTP</acronym> 配置通常不允许文件上传。这条规则也有例外，但这些例外通常会伴随着相关配置，立即向调用者隐藏已上传的文件，以防止该站点成为非法材料的交易站。如果你需要从他人接收文件，可能希望设置一个普通的\
  \ <acronym class=\"acronym\">FTP</acronym> 服务器，并向需要接收文件的个人提供用户名和密码。你也可以考虑通过电子邮件交换文档。\n\
  \n*   匿名 <acronym class=\"acronym\">FTP</acronym> 站点上的文件是公开的。这意味着你*`永远`*不要在此类此类服务器上放置机密材料。为了保护服务器自身的\
  \ OS 文件以及任何普通用户的文件，匿名 <acronym class=\"acronym\">FTP</acronym> 服务器将匿名访问限制在一个特殊的目录树中；该树之外的一切都是禁止的。大多数\
  \ <acronym class=\"acronym\">FTP</acronym> 服务器使用 `chroot()` 系统调用来创建一个 `chroot` 监狱（如\
  \ 第 23 章 所示），以实现这一目标。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\n虽然 `chroot` 监狱可以作为一个非常有用的工具，但它并不是万无一的。最佳实践是将敏感数据留在匿名\
  \ <acronym class=\"acronym\">FTP</acronym> 服务器之外，这样即使恶作分子破解了 `chroot` 监狱，数据也不会落入坏人手中。\n\
  \n由于 <acronym class=\"acronym\">FTP</acronym> 服务器运行在 `chroot` 监狱中，你可能需要将一些系统配置文件复制到\
  \ `chroot` 监狱目录中。许多 Linux 的 <acronym class=\"acronym\">FTP</acronym> 服务器包已经包含了关键系统文件的适当副本。包括\
  \ `ProFTPd` 在内的某些服务器能够在锁定到 `chroot` 监狱中之前读取其某些配置文件，因此必须复制的文件数量非常稀少。\n\n某些配置（例如通常用于\
  \ `ProFTPd` 的配置）在服务器从 SysV 启动脚本运行时，配合 `chroot` 监狱效果最好。其他配置（例如通常用于 `WU-FTPD` 的配置）即使在服务器从超级服务器（super\
  \ server）运行时也允许匿名服务器配置。诀窍在于 `chroot()` 系统调用只能由以 `root` 身份运行的程序使用。如果你为 <acronym class=\"\
  acronym\">FTP</acronym> 服务器的超级服务器配置以 `root` 以外的任何身份调用该 FTP 服务器，那么它将无法设置 `chroot`\
  \ 监狱。（<acronym class=\"acronym\">FTP</acronym> 服务器配置文件中的用户名设置选项通常在 `chroot()` 调用之后生效；在此之前，从\
  \ SysV 或本地启动脚本运行的服务器以 `root` 身份运行。）\n\n匿名 <acronym class=\"acronym\">FTP</acronym>\
  \ 服务器要求某些文件位于特定的目录中。这些将在接下来的章节“设置匿名目录树”中描述。\n\n## 匿名服务器的安全忧虑\n\n匿名 <acronym class=\"\
  acronym\">FTP</acronym> 服务器因为通常对外部开放，因此是一个潜在的安全威胁。从理论上讲，这种威胁并不比例如 Web 或邮件服务器的威胁大。但在实践中，匿名\
  \ FTP 的风险可能会大一些。原因之一是 <acronym class=\"acronym\">FTP</acronym> 服务器（特别是 `WU-FTPD`）的安全历史并不尽如人意。问题的另一个部分是，FTP\
  \ 是为双向文件传输设计的，因此允许用户跳出 `chroot` 监狱的安全漏洞可能允许用户覆盖关键系统文件，或至少覆盖任意用户文件。相比之下，邮件服务器给攻击者提供的筹码较少，因为邮件是以特定的指定方式处理的。（为了确保，已经发现邮件服务器中的漏洞可以用于获取更多权限。）\n\
  \n幸运的是，*`仅`*作为匿名 <acronym class=\"acronym\">FTP</acronym> 服务器运行的服务器不会因为用户名和密码的传输而产生风险，这是非匿名\
  \ <acronym class=\"acronym\">FTP</acronym> 服务器担心的问题。匿名 <acronym class=\"acronym\"\
  >FTP</acronym> 服务器接受所有访问者和任何密码，因此没有敏感密码会被泄露。因此，在某些方面，匿名服务器比非匿名服务器更安全。\n\n由于单个 <acronym\
  \ class=\"acronym\">FTP</acronym> 服务器可以配置为执行匿名和非匿名操作，如果你在一个系统上运行两种类型的 <acronym class=\"\
  acronym\">FTP</acronym> 服务器配置，你就面临着兼者之失的风险。运行匿名 <acronym class=\"acronym\">FTP</acronym>\
  \ 服务器的最佳策略是将其配置为*`仅`*接受匿名访问，至少从外部世界是如此。减少系统上的用户账户数量，不要运行不必要的服务器或不要在计算机上存储任何敏感数据。这些步骤可以帮助在\
  \ <acronym class=\"acronym\">FTP</acronym> 服务器被破解时损害降至最低。\n\n## 设置匿名选项\n\n大多数随 Linux\
  \ 发行版自带的 <acronym class=\"acronym\">FTP</acronym> 包包含了可用或几乎可用的 <acronym class=\"\
  acronym\">FTP</acronym> 配置。可能你需要微调这些配置以使系统真正运行。本节描述了 `WU-FTPD` 和 `ProFTPd` 中完成此任务的选项，从两个服务器通用的目录树创建，然后到服务器特定的配置选项。\n\
  \n### 设置匿名目录树\n\n创建匿名 <acronym class=\"acronym\">FTP</acronym> 站点的第一步是创建一个适当的目录树。该位置的常见选择是\
  \ `/home/ftp`，但如果你喜欢，也可以将其放在其他地方。在大多数情况下，此树应该由 `root` 或维护 <acronym class=\"acronym\"\
  >FTP</acronym> 站点的用户所有，并具有 755 (`rwxr-xr-x`) 权限。这允许管理员编辑目录中的文件，但不赋予其他任何人写入权限。特别是，`ftp`\
  \ 用户（或你用于匿名访问的任何用户名）无法写入匿名 <acronym class=\"acronym\">FTP</acronym> 目录。子目录和文件应该遵循相同的模式，尽管大多数文件缺少执行权限位。\n\
  \n一个典型的匿名 <acronym class=\"acronym\">FTP</acronym> 目录包含以下子目录：\n\n*   ****`pub`**——这是用户将访问的文件的传统位置。你可以以你认为合适的方式对其进行结构化，并填充你喜欢的任何文件。确保所有文件对所有人都可读，或者至少对\
  \ `ftp` 用户可读。\n\n\n\n\n\n- `bin`: `FTP` 服务器可能会调用其他程序来执行某些功能。这些程序必须在 `/bin` 目录中可访问（相对于由\
  \ `chroot()` 创建的根目录）。最常见的是 `ls`。你可能还需要 `tar`、`gzip` 和 `zcat`（后者是 `gzip` 的符号链接）。在\
  \ `FTP` 软件包中，此命名的目录可能包含比主计算机 `/bin` 目录中文件更大的可执行文件，因为 `FTP` 目录下的可执行文件是静态链接的，以避免对单独库文件的需求（如文所述）。请确保此目录中的可执行程序已设置了执行权限。\n\
  \n- `lib`: 此目录包含 `/bin` 中二进制文件所使用的动态库文件。如果你从常规的 `/bin` 目录拷贝二进制文件，可以使用 `ldd` 命令来确定必须将哪些库文件拷贝到\
  \ `FTP` 树的 `lib` 目录以进行匹配。例如，你可以输入 `ldd /bin/ls` 来了解 `ls` 需要哪些库。\n\n- `etc`: `FTP`\
  \ 服务器可能依赖 `/etc` 目录中的两个文件来工作：`passwd` 和 `group`。你不需要（可能也不应该）拷贝你的整个常规 `passwd` 和\
  \ `group` 文件。最关键的条目是 `ftp`，或者你用于匿名访问的任何用户名。\n\n一旦设置了这些目录和文件，基本的目录结构就足够了。你可能需要根据特定目的添加更多文件，或修改现有文件。例如，如果你添加了使用\
  \ `gzip` 以外的工具来压缩文件的功能，你将需要将一个适当的可执行文件拷贝到 `FTP` 服务器的 `/bin` 目录。\n\n### WU-FTPD 匿名选项\n\
  \nWU-FTPD 最重要的匿名 `FTP` 服务器配置选项出现在 `/etc/ftpaccess` 文件中。具体来说，你可能需要设置或调整以下选项：\n\n\
  - `class`: 你必须创建一个包含 `anonymous` 访问的 `class`。该类可以与其他类型访问的类相同。\n\n- `compress`、`tar`、`chmod`、`delete`、`overwrite`\
  \ 和 `rename`: 前述这些选项允许你指定谁可以使用涉及特定类型选项的命令。你可能从后四个选项中排除匿名用户，以防止他们更改服务器上的文件。此设置可能文件系统控制是冗余的，但一种类型的控制发生故障或配置错误时，冗余是有用的。\n\
  \n- `anonymous-root`: 将此选项设置为 WU-FTPD 运行的 `chroot` 监狱的根目录。\n\n大多数 WU-FTPD 配置从一个具有\
  \ `root` 权限的超级服务器运行。当此类系统接收到匿名登录时，它会创建一个以 `ftp` 用户运行的子进程，因此 WU-FTPD 即使从超级服务器也可以运行匿名服务器。\n\
  \n### ProFTPd 匿名选项\n\n配置匿名 `FTP` 服务器的主要 ProFTPd 选项出现在 `proftpd.conf` 文件中，与其他主要的服务器选项一起。该文件中一个简单但可行的匿名\
  \ `FTP` 配置可能如下：\n\n```\n <Anonymous /home/ftp>\n  User                         \
  \ ftp\n  Group                         ftp\n  # 我们希望客户端能够使用 \"anonymous\" 以及 \"\
  ftp\" 登录\n  UserAlias                     anonymous ftp\n  # 在匿名 chroot 中限制所有地方的写入\n\
  \  <Limit WRITE>\n    DenyAll\n  </Limit>\n</Anonymous>\n```\n\n关于此配置的一些要点包括：\n\n\
  - `<Anonymous>` 指令分组是 ProFTPd 匿名访问配置的关键。当此指令存在时，ProFTPd 知道以不同于不同的方式处理匹配登录——即在指定的目录（此例中为\
  \ `/home/ftp`）创建一个 `chroot` 监狱。\n\n- `User` 和 `Group` 指令告诉 ProFTPd 用于匿名服务器配置的用户名和组名。ProFTPd\
  \ 启动自身，然后在相应的用户名和组下创建子进程。你应该确保你的 `FTP` 目录配置对于你选择的用户名和组是可访问的。\n\n- `UserAlias` 指令告诉\
  \ ProFTPd 将输入 `anonymous` 作为用户名的用户视为匿名用户。\n\n- `<Limit WRITE>` 分组告诉 ProFTPd 拒绝所有用户的写入访问。如果你在匿名\
  \ `FTP` 目录树中适当设置了权限，则此设置应该是冗余的。尽管如此，冗余的安全措施是一种很好的预防；以防一个设置出现错误或受漏洞影响，另一个设置可以提供保护。\n\
  \n- 如果你想创建一个接受 `anonymous` 用户名但需要密码的伪匿名服务器，可以使用 `RequiresPassword on` 指令。然后你需要在\
  \ `/etc/passwd` 或 `/etc/shadow` 中设置适当的密码。（ProFTPd 将将其锁定在 `chroot` 监狱之前验证用户。）\n\n\
  如果你想让服务器仅作为匿名 `FTP` 服务器运行，你应该采取措施限制普通用户对 `FTP` 的访问。如果可能，在支持最少管理用户的计算机上运行 `FTP` 服务器，并通过在\
  \ `/etc/ftpusers` 文件中输入他们的用户名来拒绝他们的访问。\n\n## 总结\n\n`FTP` 服务器在历史上一直是互联网非常重要的一部分，但今天它们的功能已部分被\
  \ Web 服务器接管。尽管如此，`FTP` 服务器在某些情况下仍然很重要，既作为身份验证文件传输手段（可能是双向的），也作为匿名传输手段（通常只是从服务器到客户端）。Linux\
  \ 上最流行的 `FTP` 服务器是 WU-FTPD 和 ProFTPd。它们都是具有许多选项的强大服务器，包括支持身份验证和匿名传输。但它们的配置风格非常不同。大多数发行版带有的适用于身份验证访问的\
  \ `FTP` 服务器配置，并且只需很少或无需额外工作即可用于匿名访问。你的大多数 `FTP` 服务器配置可能涉及对这些默认设置进行细小更改。\n\n# 第四部分。网络安全与路由器功能\n\
  \n# 第 22 章。通用系统安全\n\nLinux 是对于许多网络功能来说极其强大的操作系统。遗憾的是，这种力量也伴随着至少的漏洞可能性。大多数主要的服务器都有允许外部人员访问的漏洞历史，即使是没有漏洞的服务器，如果入侵者获取了密码或服务器配置错误，也可能受到滥用。因此，保持系统安全是一个值得仔细关注的话题；你必须配置你的系统尽可能安全，并监控安全进展，以确保你不会成为新发现的安全漏洞的受害者。\n\
  \n\n\n\n\n本章将开始调查安全问题，包括关闭不必要的服务器、控制账户和密码、保持系统更新、检查入侵迹象以及查找额外的安全信息。随后的某些章节将扩展介绍特定的安全主题。特别是，第\
  \ 24 章：配置 `chroot` 监狱]，描述了某些服务器用于以最小化运行服务器所涉及风险的技术；第 25 章：配置 iptables]，描述了用于设置防火墙的\
  \ Linux 数据包过滤工具；以及第 26 章：使用 VPN]，描述了一种以加密方式将本地网络扩展到互联网的方法。\n\n除了下一节介绍的安全资源外，“关注安全态势发展”，你可能还想读一本专门介绍安全问题的书籍。例如\
  \ Mann 和 Mitchell 写的 *Linux 系统安全：开源安全工具管理员指南*（Prentice Hall, 1999）以及 Garfinkel 和\
  \ Spafford 写的 *实用 UNIX 与 互联网安全，第二版*（O'Reilly, 1996）。还有专门防火墙的书籍，例如 Constaintine &\
  \ Ziegler 写的 *Linux 防火墙*（New Riders, 2001）。如果你的网络包含非 Linux 系统，你可能想考虑涵盖范围更广的书籍，例如\
  \ McClure、Scambray 和 Kurtz 写的 *黑客攻防，第三版*（McGraw-Hill, 2001）。\n\n## 关闭不必要的服务器\n\n\
  服务器程序的设计目的是为了提供对计算机的访问。因此，运行在计算机上的每台服务器都会增加不受授权人员访问计算机的风险。入侵者可能通过服务器漏洞、服务器配置错误或被破解的密码获取访问。无论具体细节如何，降低这种风险的有效方法之一就是关闭不必要的服务器。此此的第一步是定位不必要的服务器。一旦定位，你就必须决定关闭服务器。关闭服务器通常是一项简单任务，但某些方法比其他方法更有效。\n\
  \n## 定位不必要的服务器\n\n定位不必要的服务器的任务可以分为两个子任务：识别运行在你的系统上的服务器，并确定这些服务器中哪些对于正常系统运行是不必要的。对于这两项任务，有多种方法，你可能希望采用多种方法来增加成功几率。\n\
  \n### 定位服务器\n\n遗憾的是，Linux 系统上没有运行服务器的中央注册表。如果有的话，定位服务器将是一个相对直接的过程。相反，你必须从几个不同的来源汇集信息。通过一种方法可能会漏掉某些服务器，因此最好使用几种方法来定位你的服务器。\n\
  \n### 使用包管理系统\n\n定位服务器的一个非常有用的工具是你所用发行版的包管理系统。如果你专门使用 Red Hat 包管理器（`RPM`）或 Debian\
  \ 软件包，你的数据库应该包含计算机上安装的所有包的列表。你可以使用该数据库浏览已安装的包，通过阅读包描述来帮助你判断某个包是否包含服务器，如果是，你是否需要它。对于这项任务，特别有用的工具是\
  \ `GUI` 包管理系统，例如 Red Hat 的 `GNOME` `RPM`、SuSE 的 YaST 以及 Storm 包管理器（Storm Package\
  \ Manager，它是 Storm 发行版的一部分，但也供 Debian 使用）。这些工具允许你在窗口中浏览已安装的包，如图 22.1 所示的 `GNOME`\
  \ `RPM` 窗口。你可以点击包并选择选项读取包描述。某些包管理器会对包进行分类以便更容易查找，但这些分类的定义并没有可能那么严格，因此你可能需要查看所有类别以定位所有的服务器。这种方法也无法找到你从\
  \ tar 包或源代码安装的服务器。最后，通过这种方法你无法判断服务器是否真的在*运行*。一个已安装但未运行的服务器比已安装并运行的服务器风险小得多。（主要风险是未来的某些配置更改可能会意外启动服务器，从而增加你的风险。）\n\
  \n![GUI 包管理工具让你查找已安装的服务器。](img/22fig01.gif)\n\n**图 22.1. GUI 包管理工具让你查找已安装的服务器。**\n\
  \n### 检查服务器启动文件\n\n查找服务器另一种方法是检查常见的服务器启动文件：\n\n*   **超级服务器配置**。检查你的 `/etc/inetd.conf`\
  \ 和 `/etc/xinetd.conf` 文件，以及 `/etc/xinetd.d` 目录下的文件。这些文件包含了通过超级服务器启动的所有服务器的引用。使用\
  \ `inetd` 时，以井号（`#`）开头的服务器行无效。使用 `xinetd` 时，包含 `disable = yes` 行的目无效。\n*   **SysV\
  \ 启动脚本**。检查你的 SysV 启动脚本位置（通常为 `/etc/rc.d/rc?.d` 或 `/etc/rc?.d`，其中 `?` 是运行级别数字），查找通过\
  \ SysV 启动的服务器。从这些文件的存在及其文件名中学习很多知识。注意，其中某些脚本启动的程序并非服务器，因此你不应禁用任何你不认同的内容。\n*   **本地启动脚本**。许多发行版使用名为\
  \ `rc.local`、`boot.local` 或其他的脚本来运行*本地*程序——即以特定计算机独特的方式安装的程序，而不是发行版的标准方式。你必须逐行检查这些脚本，以确定它们启动了哪些服务器（如果有）。\n\
  \n第 4 章：启动服务器]将更详细地描述这些启动方法，包括 SysV 启动脚本命名规范等信息。你可能还想使用 `ntsysv` 或 `tksysv` 等工具来帮助解释\
  \ SysV 启动脚本（在某些发行版和使用某些工具时的超级服务器配置）。对于更基于命令行的方法，输入 `chkconfig --list` 可以在某些发行版上显示\
  \ SysV 以及可能的 `xinetd` 启动脚本的状态（特别是 Caldera, Mandrake, Red Hat 和 TurboLinux）。\n\n\
  检查服务器启动方法可以帮助你确定正在运行哪些服务器，但可能无法勾勒出已*安装*服务器的完整。。对于，你需要使用包管理系统或检查计算机上的每个可执行文件（这在最好的情况下也是一项繁琐的任务）。如前所述，一个已安装但未运行的包比一个已安装并运行的包风险小得多。\n\
  \n#### 检查运行进程\n\n\n\n\n\n另一个可以帮助定位服务器的工具是 `ps`。该命令返回运行中进程的信息。你可以提供几十种不同的选项来修改程序的运行，但如果你想定位服务器，输入\
  \ `ps ax` 是一个很好的起点。输出内容可能非常详尽，因此你可能希望将其重定向到文件，或者通过 `more` 或 `less` 进行管道处理，以便查看全部输出内容。如果你正在寻找特定的服务器，可以将结果通过\
  \ `grep` 进行管道处理，例如 `ps ax | grep sendmail`，以定位任何正在运行的 `sendmail` 进程的信息。无论你如何使用它，`ps`\
  \ 都能提供服务器和非服务器进程的信息。以下是其输出的一个编辑后的示例：\n\n```\n $ ps ax\n  PID TTY      STAT   TIME\
  \ COMMAND\n    1 ?        S      0:15 init [3]\n  502 ?        S      0:05 named\
  \ -u bind\n  520 ?        S      0:01 cupsd\n  535 ?        SW     0:00 [nfsd]\n\
  \ 1741 pts/4    S      0:00 /bin/bash\n 4168 ?        S      0:00 httpd\n```\n\n\
  实际的 `ps` 输出可能包含几十行，即使在负载较轻的系统上也是如此。为了演示，此示例删除了除了少数条目以外的所有内容。进程 ID 为 1 的第一个条目总是 `init`。该进程位于进程树的根节点；所有其他进程直接或间接地派生自它。名称在括号中（在\
  \ `COMMAND` 列中）如 `[nfsd]` 的是内核进程。你可能识别出 `nfsd` 是 `NFS` 守护进程的——一个基于内核的服务器。示例中的其他服务器是\
  \ `named`、`cupsd` 和 `httpd`，它们都是用户空间服务器。有两个线索可以识别这些是服务器：首先，它们的名称都以 `d` 结尾，代表 daemon（进程）；其次，它们没有绑定到特定的\
  \ tty（`TTY` 列包含问号）。许多非服务器进程（例如示例中的 `/bin/bash`）绑定了特定的 tty。这两个细节都不能确切地表明某个进程是服务器，但它们是有帮助的线索。\n\
  \n一旦你通过 `ps` 发现了潜在的服务器，你可能想尝试查找相关进程的文档。输入 `man name`，其中 `name` 是进程名称；并尝试查找与进程同名的二进制文件，然后追溯其软件包和文档（例如，在基于\
  \ `RPM` 的系统上使用 `rpm -qf` `/path/to/name` 定位与 `name` 相关的软件包，或在 Debian 上使用 `dpkg -S`\
  \ `/path/to/name` 执行相同操作）。\n\n使用 `ps` 时请记住，它无法定位在你检查时未在运行的服务器。特别是，如果服务器是通过超级服务器（super\
  \ server）启动的，除非在你尝试此测试时有人正在该服务器，否则你无法通过检查进程列表找到它。此程序也无法定位崩溃或因维护而临时下线的服务器。\n\n###\
  \ 使用 `netstat`\n\n`ps` 方法的一个问题是，并不总是能看出哪些进程涉及网络操作，更不用说哪些是服务器了。你可以用来帮助精细这种识别的工具是\
  \ `netstat`。\n\n该程序报告网络连接的信息，包括哪些端口正在被使用。像 `ps` 一样，`netstat` 接受许多修改其行为的选项。为了帮助定位服务器，`netstat\
  \ -lp` 是一个很好的起点。这可以定位正在监听的端口（`-l`），并让 `netstat` 打印（`-p`）正在监听的服务器名称。输出还包括服务器正在监听的端口以及额外信息。与\
  \ `ps` 一样，你可能希望将输出重定向到文件，或通过 `less` 或 `more` 进行管道处理。\n\n尽管 `netstat` 是一个很有用的工具，但它也有其局限性。它显示正在监听的端口，但对于通过超级服务器启动的服务器，进程列表可能完全准确；`netstat`\
  \ 将报告超级服务器名称，而不是最终处理请求的程序名称。\n\n### 使用外部扫描器\n\n定位服务器的最强大的工具之一是外部扫描程序，例如 Nessus ([`www.nessus.org`](http://www.nessus.org))、SAINT\
  \ ([`www.wwdsi.com/saint/`](http://www.wwdsi.com/saint/)) 或 Nmap ([`www.insecure.org/nmap/`](http://www.insecure.org/nmap/))。这些程序运行在你想要检查的计算机之外，并扫描目标系统以查找正在运行的服务器。取决于扫描器开发者的具体目标，它可能会报告额外信息，例如目标上使用的操作系统或服务器是否存在任何已知漏洞。基本扫描通常可以通过输入工具名称后跟目标系统的主机名简单地完成，例如\
  \ `nmapgingko.threeroomco.com`。结果应该是开放端口和相关服务器列表的列表。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n端口扫描器经常被破解者（crackers）用来帮助他们定位有漏洞的系统。你自己使用相同的工具是有帮助的，因为你可以发现坏人可能发现的种种漏洞。遗憾的是，使用这些工具也会引起对你的怀疑，特别是在未经授权的情况下使用该工具时。在获取和使用端口扫描器之前，请向你的上级说明其用途。如果你不这样做，你可能会陷入麻烦——甚至可能失去工作！\n\
  \n如果你怀疑服务器可能已经被入侵，外部扫描可能会特别有用。一个老练的破解者可以替换 `ps` 和 `netstat` 等工具，使得任何额外的服务器看起来都不像在运行。外部扫描*可能会*发现这些服务器。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n媒体通常使用 *hacker*（黑客）一词来指代计算机犯罪。然而，喜欢编程或以完全合法光的方式与计算机工作的人一直使用这个词来指代自己的活动。事实上，许多编写\
  \ Linux 的人认为自己是这种积极意义上的黑客。出于如此，我使用 *cracker*（破解者）来指代计算机犯罪和坏人。\n\n外部扫描的缺点是，如果服务器对执行扫描的系统不可，它可能无法发现。例如，如果计算机有两个网络接口，扫描一个接口可能会发现没有运行的服务器，而许多服务器正运行器另一个接口上。同样，防火墙工具可以根据\
  \ `IP` 地址阻止访问服务器，因此即使计算机只有一个网络接口，外部扫描器也可能检测不到服务器。\n\n### 判断何时不需要服务器\n\n一旦你列出了服务器列表，你就必须决定哪些是必要的。遗憾的是，这项任务并不容易。除非你非常熟悉\
  \ Linux 系统的操作，否则你可能无法理解服务器的功能，认为它是不必要的，而实际上它发挥着某些重要作用。本书前面的章节可以帮助你判断系统是否需要许多特定的服务器。你还可以咨询服务器的文档（例如\
  \ man 手页），或进行 Web 搜索以获取更多信息。\n\n\n\n\n如果你仍然不确定是否严格需要服务器，可以尝试将其关闭并观察发生什么。如果计算机在各方面继续正常运行，那么你就可以确定该服务器没有执行任何必要的操作；然而，大多数服务器*确实*提供了某种明显的功能。你关闭的服务器可能执行了某些必要的操作，但这些并不是立而易见的。例如，即使在不运行\
  \ X 的计算机上，也可以运行字体服务器（在第 15 章”中描述）。如果你关闭字体服务器，计算机本身将继续运行，但其他系统很快就会开始出现故障。\n\n在关闭与登录相关的进程时也应该非常小心。虽然第\
  \ 13 章和第 14 章中描述的远程登录服务器可能是必要的，但禁用本地登录可能会导致严重问题，需要紧急启动软盘才能修复。对于移除从 SysV 启动脚本或其他系统启动脚本启动的登录进程，你应当保持谨慎。\n\
  \n一个幸运的事实是，从超级服务器（super server）启动的进程对本地操作并不重要。如果你不认识某个超级服务器条目，可以将其移除，本地计算机将继续运行。正如提到的，当然*其他*系统可能会受到不利影响，但你可以移除所有的超级服务器条目，该计算机仍然可以从控制台启动并可以使用。\n\
  \n## 关闭服务器的方法\n\n你可以通过几种不同的方式关闭服务器。通常情况下，有两种主要方法：\n\n*   你可以反转启动服务器的任何进程。例如，你可以注释掉\
  \ `/etc/inetd.conf` 中的条目，或重命名 SysV 启动脚本。第 4 章”讨论了这些方法。\n*   你可以卸载服务器。如果根本安装服务器文件，它就无法运行。\n\
  \n如果你不确定是否不需要该服务器，第一种方法通常是尝试安全的尝试，因为它最容易撤销。如果你禁用了一个服务器后发现你*确实*需要它，可以快速恢复其启动配置。\n\
  \n### 提示\n\n![提示](img/tip.gif)\n\n在禁用服务器时，尝试用不删除任何配置信息的方式进行。例如，注释掉 `/etc/inetd.conf`\
  \ 中的条目而不是删除它，或者重命名 SysV 启动脚本而不是删除它。这允许在需要时轻松撤销你的更改。\n\n一旦你确定服务器程序完全没有必要，将其从计算机中移除是有意义的。消除服务器可以确保它在将来不会意外启动，并节省磁盘空间。如果你认为将来可能需要该服务器，你可能想保持其安装状态；或者你可以将其移除并对其修改过的配置文件进行备份，以便在你决定重新安装服务器时可以恢复配置。\n\
  \n# 控制账户和密码\n\n如果存在服务器，它就是进入你计算机的潜在入口。有几种不同的方法来锁这扇门。一种是使用如 `iptables` 等防火墙工具（在第\
  \ 25 章 中讨论）。另一种（仅适用于某些服务器）是密切关注计算机上的用户账户和密码。如果计算机托管了未使用的账户或密码落入他人之手，使用这些功能的服务器可能会变得脆弱。这种控制方法需要你作为系统管理员与所有用户之间的合作，因此，向用户传达糟糕密码选择的风险、在未加密连接上使用密码的风险等是非常重要的。\n\
  \n## 账户创建程序与策略\n\n通过账户安全保护系统的第一步是开发并遵循适当的账户创建程序和策略。如果用服务器是门来比喻，那么每个账户都是一把可以打开门（通常是几扇门）的钥匙。通过尽量减少计算机上的账户数量，你减少了进入你系统的密钥被滥用的风险。当然，许多服务器*需要*用户账户。没有用户账户，文件共享服务器的效用有限，`FTP`\
  \ 服务器只能用于匿名访问，以此此类推。诀窍在于确定你何时真正需要创建一个特定的用户账户。\n\n在某些服务器上，答案很简单：你*不*创建用户账户——至少，不是为少数管理员（可能仅仅是一个）之外的任何人创建账户。本书前面的章节描述了服务器需要用户账户的情况。许多服务器，如字体服务器、`DHCP`\
  \ 和时间服务器不需要用户账户，这样的计算机很容易没有用户账户。其他服务器系统，例如 Web 和 `FTP` 服务器，可能需要不需要用户账户，取决于具体如何使用它们。远程登录服务器通常运行在托管许多用户账户的计算机上，因此这些系统始终需要用户账户。\n\
  \n假设计算机需要普通用户账户，你应该对该计算机的使用有一项清晰定义的策略，并以此指导何时创建账户。例如，大学物理系的某台计算机可能是供该系相关的教职人员、员工和学生使用的，因此你应该有一项策略仅为这些人个人创建账户。将这些策略正式化有助于避免从安全角度来看可能不理想的扩张。如果这些策略变得过于严格，你可以更改它们，但如果你的账户创建策略过于松散或非正式，系统很容易获得未使用的或不必要的账户。如果计算机有许多用户，这种正式化尤为重要。\n\
  \n你可能还想在创建用户账户时开发一些脚本或检查清单。在此过程中一个特别重要的细节是你是如何设置密码。接下来的章节“设置良好的密码”解决了这个问题。你还应该为你的计算机创建一个适当的默认权限系统。例如，你可能想创建单独的项目并将用户分配给特定的组，并在主目录上分配权限以限制谁可以访问谁的文件。适当的策略在不同环境之间差异很大，因此你必须根据特定需求开发你的设置。在开放环境中，松散的主目录权限（如\
  \ `0755` 甚至 `0775`）可能是恰当的，并配合用于文件创建的 `umask` 值；但在内部安全更重要的环境中，你可能需要设置严格的 `0700` 主目录权限和限制性的\
  \ `umasks`。\n\n## 监控账户使用情况\n\n一旦为用户创建了账户，你可能希望监控这些账户以确保它们没有被滥用。这种监控有两个关键方面：检查闲账户和检查活动账户的滥用情况。\n\
  \n### 处理闲账户\n\n\n\n\n用户账户很少是永久性的。例如，学生会毕业，员工会跳槽其他工作。每当账户闲置时，都应该将其禁用或删除，以尽可能减少被滥用的风险。如果你收到通知，某个用户已离开你的组织或由于其他原因他们不再应拥有账户，你可以手动禁用或删除该账户。不过，你并不总是能收到此类通知。帮助自动化这一过程的方法是创建自动过期的账户，或者设置会过期的密码。你可以使用\
  \ `usermod` 命令为账户设置过期日期，如下：\n\n```bash\n # usermod -e 2003-07-04 george\n```\n\n\
  此命令告诉系统 `george` 账户将在 2003 年 7 月 4 日变为非活动。（你也可以在 `useradd` 时使用 `-e` 参数来初始创建一个带有过期日期的账户。）当你知道某个用户在特定日期之后将不再需要账户时（例如学生账户和临时员工账户），这种方法最为有用。\n\
  \n另一种不那么激进的方法是设置过期密码。这要求用户定期更改密码，例如每月一次。你可以通过 `chage` 命令来实现，如下：\n\n```bash\n # chage\
  \ -M 30 -W 5 george\n```\n\n此命令告诉系统 `george` 必须每 30 天更改一次密码，并在截止日期前 5 天警告 `george`。如果\
  \ `george` 不更改密码，该账户将被禁用，并需要管理员干预才能再次使用。\n\n这些自动化过程有助于减少问题，但它们并不适用于所有情况。例如，如果账户存在于某些非登录进程（例如通过\
  \ Samba 服务器进行文件共享或仅用于邮件投递），用户可能看不到密码过期的消息，除非你创建了自定义 cron 任务来检查即将到期的账户过期并通知用户（例如通过发送有关密码即将过期的电子邮件给他们）。你可以采取一些主动措施来监控账户使用情况。例如，`last`\
  \ 命令返回最后几次登录的信息，许多发行版维护着一个名为 `/var/log/auth` 的日志文件，其中存储了认证信息。如果你想得非常严谨，甚至可以设置 cron\
  \ 任务来监控系统日志文件，记录用户登录的时间，并在账户闲置超过给定时间后通知你。你可以使用这些工具监控账户使用情况，如果账户被闲置，请进一步调查以确定是否应该将其删除。\n\
  \n你可能需要采取主动的管理措施来更改账户的可用性。例如，一旦账户自动过期，如果你知道它不再会被使用，你可能想删除它。你可能想编写脚本来检查过期的账户并在发现时向你报告。（这些账户可以被识别，因为\
  \ `/etc/shadow` 中第三个冒号分隔字段的值小于第八字段。）\n\n### 检查账户滥用\n\n对于任何系统管理员来说，本地账户被滥用都是一场噩梦。也许你的用户之一不可信，并且正在使用计算机攻击其他系统，甚至是本地系统本身。另一种可能是外部人员可能劫持了用户的账户以便滥用。\n\
  \n检查滥用的一种方法是查看系统日志文件来寻找可疑活动，例如 `/var/log/messages` 和 `/var/log/secure`。（具体存在哪些日志文件以及它们包含什么信息取决于发行版）。不过，系统日志文件主要监控服务器的活动，而不是客户端的。因此，你可能看不到本地用户滥用（例如）使用\
  \ Telnet 客户端攻击另一个系统的证据。然而，取决于你的网络配置，此类证据可能会出现在防火墙的日志文件中。如果你的系统受到来自外部的攻击，你也可能看到可疑活动。\n\
  \n遗憾的是，通过扫描日志文件来检查此类滥用充其量只能是枯燥的。像 Simple Watcher (SWATCH, [`oit.ucsb.edu/~eta/swatch/`](http://oit.ucsb.edu/~eta/swatch/))\
  \ 这样的自动化工具可以通过扫描日志文件中可能指示问题的关键字符串来提供帮助，但此类工具并非万无一失。\n\n在追踪而非防止系统滥用，你可以采取的一个潜在重要步骤是运行\
  \ `auth` 服务器（也称为 `identd`）。当系统上的客户端连接外部服务器时，该服务器可能会尝试连接你的服务器以查找发起发出连接的用户身份。如果你的用户在远程系统上引起了麻烦，该系统的管理员可以联系你并告诉你是谁在制造问题，因为用户名将记录在远程系统的日志中。当然，这个过程只有在你的系统中安装并运行了\
  \ `identd` 且其本身没有被破解的情况下才能起作用。（大多数发行版都带有此服务器，它非常基础，因此只需要极少的配置。它通常从超级服务器运行。）\n\n\
  最终而言，你追踪和防止本地系统滥用的能力是有限的。你可以对可疑的本地活动保持警惕，例如不应该运行的进程，但密切监控即使是单台电脑上的所有活动工作也比一个系统管理员所能承担得多。\n\
  \n### 设置良好的密码\n\n为了使用密码，计算机必须将其存储在磁盘上。通常，计算机会对密码进行加密，通常使用哈希或单向加密算法。在 Linux 中，密码文件通常存储在\
  \ `/etc/shadow`（旧的 Linux 系统经常使用 `/etc/passwd`）。这种做法使得破解者即使获得了密码文件，它也变得毫无用——至少在完美的世界里是如此。CPU\
  \ 能力和磁盘空间的增加使得破解者能够加密跨多种语言并包含许多专名和变体拼写的完整字典。如果破解者获取了加密的密码文件，破解者可以将文件条目与字典的加密结果进行比较。如果匹配成功，破解者就获取了密码。\n\
  \n出于原因，最好的密码是字母、数字以及计算机允许密码的任何字符的随机组合。此类随机字符串不太出现在破解者的字典中。遗憾的是，随机密码很难记忆，所以大多数人选择容易记忆——因此也容易破解的密码。一个合理的折中方案是构建一个不会出现在字典中但具有个人记忆特征的内容。这个过程分为两步：首先构建一个基础，然后修改该基础。\n\
  \n要构建基础，取两个不相关的单词并将它们合并，例如 `bunpen`；或使用一个只对你有意义的缩写词，例如 `yiwtd`（代表 *yesterday I went\
  \ to the dentist*，我昨天去看牙医了）。这个基础你很容易记住且不应该出现在字典中。基础越长越好。（我使用六字符的基础作为示例，因为某些系统的限制是八字符，随后的修改将增加长度。）尽管如此，破解者可能会通过组合字典中的单词发现你的基础。因此，进一步的修改是必要的。\n\
  \n*   **混合大小写**：如果你的系统对大小写敏感，随机混合大小写，例如 `BUnPeN` 或 `YiWTtd`。不过，许多系统使用不区分大小写的密码，因此这一步在所有情况下可能无法提高安全性。例如，Windows\
  \ 对其 `SMB/CIFS` 文件共享使用不区分大小写的密码。\n\n\n\n\n\n- **添加数字或标点符号**：添加两个或三个随机的数字或标点符号，创建类似\
  \ `BU3nP&eN` 或 `Y+iWTtd2.` 的内容。\n- **反转单词**：如果你使用两个单词作为基础，反转其中一个的字母顺序。这可能会产生 `BU3nNe&P,`。\n\
  \n当然，还可以进行进一步修改。关键在于，尽管这些最终结果看起来是随机的，但生成它们的人可以相对容易地重新生成。因此，这些密码不需要写下来或以未加密的形式存储在计算机中。这两种做法都会极大地降低安全性，因为纸质或计算机文件可能会落入坏人手中。\n\
  \n如果你想检查用户的密码是否良好，可以使用密码破解程序对它们进行测试，例如 `Crack` (`www.users.dircon.co.uk/~crypto/))。如果程序向你输出了密码，你可以帮助用户创建一个更好的密码。\n\
  \n### 警告\n\n![WARNING`\n\n如果你运行密码破解程序，请务必在*未*连接到任何网络的计算机上运行，以消除破解者偶然发现你操作的风险。此外，与端口扫描一样，密码破解是许多雇主解雇的理由，所以如果你想通过此提高本地安全性，请务必先获得许可！\n\
  \n除了创建良好的密码外，用户还应该尽力保持密码安全。这意味着用户绝不应该写下密码或将密码交给他人（即使是朋友、家庭成员或同事）。你应该明确告诉用户，你永远不需要知道他们的密码；过去曾出现骗局，破解者谎称是系统管理员并索要密码，而用户信了骗局。\n\
  \n即使用户创建了良好的密码且没有泄露，它们也可能通过各种手段被发现。一种是*侧击窥视*（shoulder surfing），即破解者在公共区域观察用户输入密码。这在大学校园常见的公共计算机中心是一个真实风险，在许多公司常见的隔间式办公室中风险也相对较小。另一种风险（在本书的其他地方已描述过）是密码*嗅探*（sniffing），即对网络上的某台计算机进行编程以恢复网络上其他计算机之间发送的密码。这在局域网和整个互联网上都是风险。你可以通过使用交换机（switches）而不是集线器（hubs）来降低局域太网的风险；交换机不会将数据广播到所有连接的设备，因此嗅探器必须位于客户端或服务器计算机本身才能获取密码。更好的方法是使用加密密码的协议，使被截获的密码失效。\n\
  \n# 保持系统及时更新\n\n许多被破解的系统之所以处于这种不堪的境，是因为缺乏适当的维护。定期花几分钟检查并安装软件更新，可以节省以后无法数的小时的工作量，因为更新后的软件通常包含对安全漏洞的修复。如果你足够及时地更新有错误的软件，潜在的入侵者将无法利用安全漏洞。\n\
  \n## 服务器更新的重要性\n\n软件漏洞可以有许多形式，并产生许多不同的影响。漏洞可能会损坏数据、导致受影响的程序崩溃或使程序以某些异常方式运行。某些漏洞与安全有关。它们可能允许人员在任意位置写入任意文件（可能会覆盖关键配置文件），或赋予滥用者以其他用户名运行程序的能力。总而言之，此类漏洞会破坏系统，赋予普通用户超级用户权限。\n\
  \n服务器和其他任何其他程序一样，可能存在漏洞。有漏洞的服务器特别重要，因为它们可能比有漏洞的本地程序更容易被访问。如果一个非网络程序（例如，`man`）包含与安全相关的漏洞，只有本地用户可以利用该漏洞。假设你的用户是可信的，且假设破解者没有获得你系统的本地访问权限，这种漏洞就不会造成伤害。（当然，这些假设并不总是有效，所以修复此类漏洞是非常重要的。）相比之下，许多服务器是对整个世界开放的。如果\
  \ Web 服务器中的漏洞允许任何用户控制计算机，那么该 Web 服务器就会容易受到几乎任何人的攻击。因此，服务器中的安全漏洞特别关键，保护自己免受这些漏洞的影响至关重要。\n\
  \n由于许多服务器以 `root` 身份运行，问题变得更加严重。如果一个以普通用户身份运行的程序（服务器或非服务器）被破解，可能造成的破坏很小。例如，此类程序通常无法重写你的\
  \ `/etc/passwd` 文件。然而，如果以 `root` 身份运行的程序被破解，攻击者拥有更大的权力；如果能让此类程序写入任意文件，更改 `/etc/passwd`\
  \ 是非常有可能的。许多服务器需要 `root` 权限才能正常运行。例如，需要 `root` 访问来提供登录服务，甚至监听前 1024 个端口（大多数服务器就在这些端口上运行）。（超级服务器以\
  \ `root` 运行，但可以派生由另一个用户运行的服务器，即使它提供的是小于 1024 的端口。）\n\n出于所有这些原因，保持你的服务器最新更新至关重要。你不一定需要执行每一次服务器更新，因为许多服务器更新是为了添加功能或修复可能不会影响你的非安全漏洞。不过，每出现修复安全漏洞的更新时，你应该进行升级。\n\
  \n## 如何监控软件更新\n\n有几种方法寻找更新的软件软件包：\n\n- **软件软件包网站和邮件列表**：大多数软件包（包括大多数服务器）都有官方网站、邮件列表，偶尔还有新闻组或其他通信论坛。你可以定期监控这些资源以定位软件更新。尽管，这种方法可能很枯燥；一个\
  \ Linux 系统可能安装了十几个或更多服务器，监控所有相关论坛在最好的情况下也是困难的。这种方法最好留给不常用的软件包——那些不属于你正常发行版软件组合的软件包，可能适用于你运行的非常流行的服务器。\n\
  - **你的发行版网站**：所有发行版都有包含软件更新信息的网页。发行版维护者负责监控各种安全资源，包括该发行版中包含的各个服务器软件包的网页。这为你提供了一个获取安全和其他更新信息的一站场所。缺点是，安全修复从原始源过滤到你的发行版网页可能需要一些时间。在理想情况下，延迟可能只有几分钟，但更有可能是几个小时甚至几天。\n\
  - **通用安全信息源**：接下来的章节“#跟进安全动态””描述了有关安全相关进展信息的资源。这些资源可能非常有用且重要。它们通常包括有关问题临时解决方案的信息（如果存在），因此你可能可以在官方修复发布之前采取措施来降低风险。不过，你必须回到程序维护者或你发行版的更新页面来获取修复后的软件。\n\
  \n\n\n\n在大多数情况下，结合上述两种方法的某种组合是关注安全进展的好方法。阅读你服务器的网站也同样重要，特别是当你使用未受发行版官方支持的特殊服务器时。每天快速检查两个或三个网页或新闻组，可以节省在从入侵中恢复时所需的无法数小时的工作。即使是每周检查一次也比不检查好，而且定期将已安装的软件包与最新的可用版本进行比较，可以帮助发现那些可能“漏掉”的更新。\n\
  \n# 自动软件更新程序\n\n遗憾的是，手动检查软件更新顶多是枯燥的。因此，有几种工具可以帮助实现该过程自动化。这些包括：\n\n*   `apt-get`\
  \ — 该程序是 Debian 发行版及其衍生版本的标准部分。它用于安装软件，也可以检查已安装软件包的更新。具体来说，输入 `apt-get update` 接着输入\
  \ `apt-get dist-upgrade` 将检索更新的包信息，然后升级任何具有新版本的包。将第二个命令替换为 `apt-get -s -u upgrade`\
  \ 可以在不实际安装包的情况下接收有关新包的报告。然而，只有在 `/etc/apt/sources.list` 文件中列出至少一个 Debian 包分发站点时，像这样使用\
  \ `apt-get` 才会生效。还有针对 RPM 系统的 `apt-get` 端口（大型 `apt` 包的一部分），例如由 Connectiva 创建的 ([http://distro.conectiva.com/projetos/42])\
  \ 和 `apt4rpm` ([`apt4rpm.sourceforge.net`](http://apt4rpm.sourceforge.net))。\n*\
  \   Red Hat Update Agent — Red Hat 使用名为 Update Agent 的包来帮助系统更新。该包要求你向 Red Hat 注册，程序会将你计算机的硬件和软件信息发送给\
  \ Red Hat。然后它可以保持你的系统更新。该程序的配置和使用相当复杂，因此你应该查阅 [http://www.redhat.com/docs/manuals/RHNetwork/ref-guide/\
  \ 中的文档获取更多信息。\n\n自动安全更新在许多方面都是理想的，因为它们帮助你免受安全漏洞的影响。不过，它们没有缺点。通过让自动进程控制你的计算机，你赋予了它巨大的责任。自动更新可能会并且确实会各种方式失败。例如，更新后的包可能包含新漏洞，或与另一个重要的包不兼容（特别是如果你混合了发行版的包以及你自己构建或从\
  \ tar 包中安装的包时）。也可以想象，黑客可能会破解自动更新站点或 DNS 服务器，以分发被修改过的包。由于 Debian 包有时包含需要人工交互的安装脚本，因此你不应该在\
  \ cron 任务或其他自动化程序中运行 `apt-get`；你应该手动运行它，即使你计划定期这样做。（不过，在 cron 任务中使用 `apt-get -s\
  \ -u upgrade` 应该是安全的。）这些工具并不总是能将安全更新与其他那些重要性不那么要的更新区分开来，但后者可能会给你的系统带来问题。\n\n总而言之，自动软件更新可以既快速又方便，但我建议仅在严格的监督下使用它们。理想情况下，你应该能够授权单项升级，以防止由于过度热忱的更新代理导致的问题。这是一个活跃开发领域，因此这些工具在未来可能会变得更加精细且对你有帮助。\n\
  \n# 监控入侵尝试\n\n遗憾的是，即使是维护得非常好、拥有良好的账户和密码策略且没有运行不必要服务器的系统有时也会被破解。了解如何发现入侵对于度地减少此类事件造成的损害至关重要。Linux\
  \ 有多种入侵检测工具，你也可以寻找一些迹象，以帮助你识别被破解的计算机。\n\n## 入侵检测工具\n\n破解计算机的黑客经常以某种方式更改系统配置。更改的示例包括：被破坏的网页、修改的密码文件（带有新账户以简化未来的入侵）、执行预期之外操作的修改程序文件，以及在几乎任何配置或数据文件中隐藏的“惊喜”。遗憾的是，无法精确预测黑客会修改哪些文件。这正是使成功入侵变得如此严重的原因之一：因为你无法确切知道对你的系统做了什么，所以你无法再信任它的任何部分了。最安全的措施是完全删除计算机上的所有数据并重新安装它，或者从入侵之前的备份中恢复它。（接下来的章节“如果你发现入侵者该怎么办”将更详细地介绍这一主题。）\n\
  \n然而，入侵者修改文件这一事实可以作为检测他们的方法。其核心思想是记录关于关键系统文件（如 `/etc/passwd` 和 `/bin` 中的各种文件）的信息，使得这些信息无法被修改。例如，这些信息可以加密或存储在可移动介质上。然后你可以定期将你存储的信息与关键文件进行比较。如果一个不应该发生的文件发生了变化，你就应该怀疑存在入侵。（当然，某些变化也有合法的解释，例如合法添加用户导致\
  \ `/etc/passwd` 发生变化。）\n\n### 使用包数据库\n\n用于这项工作的一项工具在大多数 Linux 发行版中已经存在了：你的包数据库。Debian\
  \ 包系统和 RPM 系统都将在包数据库文件中存储关于所有已安装包的各种信息。你可以使用 `rpm` 的 `--verify`（或 `-V`）选项检查已安装包相对于其原始文件，如下：\n\
  \n```\n# rpm -V postfix\nS.5....T c /etc/postfix/aliases\nS.5....T c /etc/postfix/main.cf\n\
  ```\n\n此输出显示了发生了某种更改的文件名。每行开头的字符串表示不再匹配的信息。对于示例中报告的两个文件，`S` 表示文件大小已更改，`5` 意味着 MD5\
  \ 校验和不同，`T` 指的是文件修改时间已更改。在这种特定情况下，这些更改并不是问题，因为涉及的两个文件都是配置文件，它们*应该*与原始包交付的内容不同。然而，如果\
  \ Postfix 可执行文件发生了变化，就会引起担心了。\n\n在 Debian 系统上，`dlocate` 提供类似的功能，但从 Debian 2.2 开始，该工具不再标准系统的一部分。一旦安装了它，你可以执行如下的命令：\n\
  \n```\n# dlocate -md5check postfix\n```\n\n这会检查 `postfix` 包的 MD5 校验和，并报告包中每个文件的校验和是否正确。\n\
  \n除了检查单个包外，你还可以通过 `rpm -Va` 来检查基于 RPM 的系统上所有已安装的包。生成的输出可能包含数百行内容，大部分涉及已更改的配置文件和其他无害的更改。你可能希望将输出重定向到文件，或者通过\
  \ `more` 或 `less` 管道处理，以便你更容易地检查输出。\n\n\n\n以这种方式使用 `rpm` 或 `dlocate` 的缺点是，它不允许你跟踪软件包安装后对配置文件进行的更改。由于你很可能会进行此类更改，软件包工具对那些可能修改你系统唯一配置文件的入侵者并不敏感。另一个问题是，入侵者只需要通过你的包管理器添加软件，就能以此向你隐瞒这一事实。例如，如果入侵者想在基于\
  \ RPM 的系统上更改 `/bin/bash`，破解者可以通过安装一个新的 `bash` RPM 软件包来实现这一点，而 `rpm -Va` 无法检测到这种变化。出于这些原因，最好不要将包管理器作为你唯一的入侵检测工具。值得一提的是，如果你认为自己已经被入侵，可以将其作为一种可用工具。虽然如果\
  \ `rpm -Va` 没有发现任何问题，你并不能确定系统一定没有被入侵，但如果它检测出关键二进制文件发生了变化，你就可以产生怀疑。\n\n## 使用 Tripwire\n\
  \n一种设计用于检测入侵者的工具被称为 Tripwire ([`www.tripwire.org`](http://www.tripwire.org))。该程序随许多\
  \ Linux 发行版一起发布，你也可以从其网站下载。随发行版提供的版本设置起来简单得多，因为它已经针对你发行版特定的文件组合和文件位置进行了预配置。Tripwire\
  \ 通过在它的数据库中存储各种文件的信息来工作。在这方面，Tripwire 与 RPM 或 Debian 包管理工具相似。不过，Tripwire 被设计为一种安全工具，因此在这一用途上比包管理工具具有某些优势。最重要的是，Tripwire\
  \ 可以配置为在文件安装后的某个时间点存储对一组任意文件的信息，因此你可以在更改配置文件后记录它们的信息。Tripwire 还可以使用加密来降低恶作者修改 Tripwire\
  \ 数据库的概率。为了提高安全，你可以将 Tripwire 数据库存储在只读或可移动的介质上，并仅在需要执行数据库检查或更新时才挂载它。\n\nTripwire\
  \ 以四种不同模式之一运行：\n\n*   **数据库生成 (Database generation)**：Tripwire 的首次运行会初始化其数据库。你可以在编辑其配置文件后输入\
  \ `tripwire -initialize` 来执行此操作。此过程可能需要一些时间，因为它必须计算它要监控的所有文件的哈希值。生成的数据库文件可能被放在当前目录下的\
  \ `databases` 子目录，但通常应将其移动到 `/usr/lib/tripwire/databases`，在创建数据库文件后，该路径理想情况下应该是只读文件系统。\n\
  *   **数据库更新 (Database update)**：如果你对系统进行了更改，可以通过输入 `tripwire -update /path/to/file`\
  \ 来使用数据库更新模式，其中 `/path/to/file` 是你想要更新条目的的文件。\n*   **交互式更新 (Interactive update)**：如果你对系统进行了重大更改（例如添加了大型软件包），你可以输入\
  \ `tripwire -interactive`。这将进入交互模式，程序将报告已更改的文件并询问你是否要更新该条目。\n*   **完整性检查 (Integrity\
  \ checking)**：这是 Tripwire 的默认模式；你通过输入不带选项的 `tripwire` 来运行它。此模式检查你的文件是否有变化并报告它们。你可能在\
  \ cron 任务中每天运行一次此检查。\n\nTripwire 的配置文件是 `/etc/tripwire/tw.config`。与许多配置文件一样，英数号符号（`#`）在该文件中表示注释，这些字符后的文本会被忽略。其他行表示\
  \ Tripwire 需要检查的目录。这些行的格式如下：\n\n```\n [!|=] entry [select-flags | template]\n```\n\
  \n每个组件的含义如下：\n\n*   **包含性修剪 (`!`)**：条前带有感叹号的条目表示指定的目录或文件不进行检查。对于目录，其所有子目录也会被忽略。\n\
  *   **排除性修剪 (`=`)**：此代码用于应检查检查但其子项不应检查的目录。它通常用于如 `/home` 等目录。当指示排除性修剪时，如果目录中的文件或目录被添加或删除，Tripwire\
  \ 会告诉你该目录发生了变化，但 Tripwire 不会识别哪些文件被添加或删除。\n*   `entry`：`entry` 是要检查的文件或目录名称，例如 `/etc`\
  \ 或 `/usr`。如果你列出一个目录，其所有子目录也会被扫描，除非它们位于单独的文件系统上。因此，如果 `/usr/local` 与 `/usr` 在不同的分区上，你需要为\
  \ `/usr` 和 `/usr/local` 都创建条目以扫描整个树结构。\n*   `select-flags`：你可以通过指定 `select-flags`\
  \ 告诉 Tripwire 报告什么类型的更改。这些标记的形式为 `[+|-] [pinugsamc123456789]...`。`+` 或 `-` 分别表示\
  \ Tripwire 应该或不应该报告更改。后续每个字符表示要检查的属性：`p` 表示权限更改，`i` 表示 inode 节点更改，`n` 表示链接数，`u`\
  \ 表示文件所有者的 UID，`g` 表示文件所有者的组 ID，`s` 表示文件大小，`a` 表示访问时间戳，`m` 表示修改时间戳，`c` 表示 inode\
  \ 创建时间戳，以及 `0` 到 `9` 表示各种哈希和校验和。\n*   `template`：与其指定 `select-flags` 条目，你可以使用简写\
  \ `template`。默认值是 `R`，代表 `+pinugsm12-ac3456789`。其他 `template` 条目包括 `L`（`+pinug-sacm123456789`），这对日志文件很有用；`N`（`+pinugsamc123456789`），非常耗时但很彻底；以及\
  \ `E`（`-pinugsamc123456789`），它忽略所有内容。\n\n一旦设置好 Tripwire 配置文件，你应该在数据库生成模式下运行程序。这会在\
  \ `databases` 目录中产生一个文件。后续运行 Tripwire 将期望在 `/usr/lib/tripwire/databases` 找到该文件。由于此文件非常敏感，你应该采取措施防止其被修改。可能的方法包括：\n\
  \n*   你可以将数据库文件存储在写保护的可移动介质上，例如写保护的软磁盘（如果文件装得下；可能装不下）或 CD-ROM，并将该介质永久挂载到 `/usr/lib/tripwire/databases`。这是最安全的方法，但可能是最方便的。另一种方法是让介质保持未挂载状态，仅在运行检查时挂载。如果你在\
  \ cron 任务中运行检查，这可能会不方便。\n*   你可以创建一个小型分区并以只读方式挂载，以存放 Tripwire 数据库文件。关于这一点有几种变体。例如，你可能使用写保护的\
  \ CD-ROM 磁盘映像或 Linux 支持只读不支持读写的文件系统类型。（后者显然需要另一个操作系统的介入。）这些变体可以增加入侵者修改你的 Tripwire\
  \ 数据库文件的难度，但真正专业且坚定的破解者可能可以克服这些措施。\n*   将你的 Tripwire 数据库文件备份到可移动介质上，并偶尔将其与存储的版本进行比较。如果存储的副本发生了变化，可能表明发生了入侵。如果你使用这种方法，你应该在自己手动进行任何更改之前比较这两个文件，然后用更新的数据库文件替换备份。\n\
  *   某些 Tripwire 软件包支持加密，通常通过第三方工具实现。当这样使用时，入侵者必须知道你的加密密码才能修改数据库。\n\n\n\n如果你采取了合理的预防措施，你对自己的\
  \ Tripwire 数据库的真实性非常有信心，因此对你计算机的可靠性也充满信心。不过需要注意的是，Tripwire 在安装在全新的 Linux 系统上时效果最好。如果你安装了\
  \ Linux，等待一或两天后再安装 Tripwire，你将能够获知 Tripwire 安装后对系统所做的更改，但如果你的系统在那个之前就已经被入侵，Tripwire\
  \ 将无法检测到事实。\n\n## 通用入侵检测程序\n\n除了使用 Tripwire 这样的入侵检测工具外，你还可以采取各种行动并遵循某些程序来帮助检测入侵。这些包括：\n\
  \n*   **监控日志文件**：日志文件大部分出现在 `/var/log` 目录树中，包含了大量关于服务器活动的信息。如前所述，手动监控这些文件充其是乏味的，但在\
  \ `SWATCH` 等工具的帮助下，你可能至少发现一些可疑活动，例如你已知正在数千英里外假的用户进行本地登录。\n*   **监控系统健康**：如果服务器突然开始表现异常，这可能是入侵的迹象，因为黑客在进行更改时经常会破坏你的配置。不过，你不应该对突然发生的故障过度恐慌；还有许多其他不那么阴险的可能。尽管如此，入侵的可能性值得调查。\n\
  *   **用户投诉**：黑客有时通过普通用户账户侵入，正如黑客可能会破坏你的系统配置一样，他们也可能破坏用户的设置。与一般的系统健康问题一样，用户投诉（如“忘记”密码或莫名其妙被更改的\
  \ shell 默认值）还有其他可能的解释，但你可能想要检查配置文件的更改日期和密码等细节，看看这些是否可能可疑。\n*   **奇怪的文件**：你可能会注意到计算机上出现了异常的文件。这些文件通常是入侵脚本的残留物，也许是你原始程序文件以新名称存在，被替换脚本调用以帮助掩盖替换的存在。入侵者有时还会删除或更改日志文件，因此日志文件中的可疑间隙可能是入侵的线索。\n\
  *   **异常的流量流量**：如果服务器看到的网络流量数突然增加，一种可能的解释是你的系统正受到攻击或正被滥用。当然，也可能是你的系统仅仅是变得受欢迎了。例如，热门\
  \ Slashdot ([`slashdot.org`](http://www.slashdot.org)) 上的指向小型网站的链接经常会淹没一个小型网站。（这种效应广为人知，以至于产生了一个词——受影响如此严重的网站被称为“被\
  \ Slashdotted 了”。）你可能还会注意到来自计算机的异常连接。例如，如果一个 Web 服务器仅用作 Web 服务器，而网络中其他计算机上的日志显示来自该\
  \ Web 服务器的 Telnet 尝试，这可能表明该 Web 服务器系统已被攻破。\n\n归根结底，发现异常事件取决于你自己。大多数网络入侵都是“脚本小子”（script\
  \ kiddies）的作品——即那些技巧有限、利用他人创建的入侵脚本工作的黑客。（有些人人倾向于不将脚本小子称为黑客，而是将后者一词留给更有技巧的计算机犯罪罪分子。）脚本小子部署的脚本经常会留下可识别的痕迹。遗憾的是，每个入侵脚本都会留下其独特的更改指纹，因此无法给出一份要监控的文件短列表。安全网站经常包含对特定入侵方法症状的讨论，因此使用此类网站的搜索功能可以帮助你识别入侵的性质。\n\
  \n同样，不要过度反应或跳得出系统已被破解的结论也是重要的。硬件故障、软件配置错误和漏洞都可能产生与入侵相似的症状。\n\n## 如果发现入侵者该怎么办\n\n\
  如果你检测到入侵者，你应该怎么办？通用的恢复步骤如下：\n\n1.  **断开计算机的网络连接**：受感染的计算机可能被用来给他人制造麻烦，或感染你自己网络上的其他系统。如果你被破解的系统包含敏感数据，联网时间越长，你的敏感数据被盗取的可能性就越大。\n\
  2.  **验证入侵的性质**：你应该验证你的问题是否由于安全漏洞引起。如前所述，许多不那么阴险的问题可能被误认为是入侵。你还应该尝试识别攻击者进入你系统的路径。即使你清理了感染，如果你不锁好入侵者进入的门，入侵者将能够再次相同的方式进入。遗憾的是，识别特定的安全问题可能说易做起来难，因此你可能不得不妥于升级软件并通上提高安全水平。\n\
  3.  **备份重要数据**：如果你的系统没有定期备份或最近没有备份过，你应该备份常规用户数据。你可能还想对整个受损系统创建一个备份。你稍后可以查看此备份，如果入侵变成刑事案件，它可能会成为重要的证据。\n\
  4.  **恢复干净的系统**：遗憾的是，仅清理受感染的文件是不安全的。你可能得到了大部分被修改的文件，但漏掉了一些重要的，从而为入侵者留下了回来的路。你应该擦除整个硬盘，或者至少擦除\
  \ Linux 本身所在的分区；你可能可以保持 `/home` 不动。然后你可以从头重新安装 Linux，或从你确定在入侵之前制作的备份中恢复。不过，此时不要配置系统的网络功能；让它保持断开连接状态。\n\
  5.  **恢复数据文件**：如果你在第 4 步中擦除了整个硬盘，你应该恢复在第 3 步中备份的用户数据。如果你在第 4 步中从头重新安装了一切，你也应该根据你的需要修改配置。\n\
  6.  **纠正安全问题**：你应该修复第 2 步中识别出的任何导致入侵者进入你系统的现有问题。你可能还想采取措施提高整体安全性，例如如果尚未安装 Tripwire\
  \ 则安装它，按照如第 25 章所示设置本地防火墙等。\n7.  **将系统恢复到网络**：在你恢复系统并修复其问题后，你可以让它恢复到正常工作。\n\n如果你愿意，在此过程中还可以采取其他步骤。例如，如果你能将入侵追溯到一个特定的远程站点，你可能会尝试联系该站点的管理员。黑客喜欢使用多个系统作为其真实目标的跳板，因此对你发起攻击的站点本身可能就是一个受损的系统。如果由于入侵造成的损失巨大，你可以联系\
  \ FBI 或其他执法机构；然而，黑客活动的数量以及获得定罪的难度意味着，除非案件非常明确或涉及重大损失，否则你不太可能看到采取行动。（2002 年的美国，损失必须超过\
  \ 5,000 美元，FBI 才会关注。）\n\n# 跟进安全动态\n\n\n\n\n由于出版存在延迟，书籍无法提供有关特定漏洞（攻破计算机的方法）、安全漏洞等最新信息。因此，本章将重点关注通用的安全程序以及一些用于对抗入侵尝试的实用工具。尽管如此，在某些情况下你仍然需要最新的信息，例如当你正在调查一次成功的入侵，或者你怀疑自己的系统可能受到攻击的嫌疑活动时。幸运的是，有多种资源可以帮助你跟踪安全领域的进展，或查找有关特定漏洞、缺陷等信息。\n\
  \n## 安全网站\n\n与许多计算机相关的话题一样，网站是跟踪安全问题的非常实用的资源。网站可以快速更新其最新信息，但如果你想让它们发挥作用，就必须自己定期检查它们。以下是你可能想要定期检查的一些安全网站：\n\
  \n* `你所用发行版的网站` — 所有主要的 Linux 发行版都有网站，且大多数网站都包含安全页面或错误勘正（errata）页面。正如之前在“如何监控软件更新”章节中提到的，这些网站通常托管你的发行版中包含的特定软件包的漏洞修复信息，以及指向为你的发行版构建的软件包更新版本的链接。\n\
  \n* `CERT/CC` 网站 — 计算机应急响应协调中心（`CERT/CC`）是跟踪安全相关漏洞领先组织之一。他们的网站地址为 [`www.cert.org`](http://www.cert.org)，非常值得定期查看。\n\
  \n* `CIAC` 网站 — 美国能源部运营一个名为计算机事件咨询能力（`CIAC`）的组织，其在 [`www.ciac.org/ciac/`](http://www.ciac.org/ciac/)\
  \ 维护了一个网页。该网站在总体范围内与 `CERT/CC` 网站类似。\n\n* `Linux Weekly News 安全板块` — Linux Weekly\
  \ News ([`lwn.net`](http://www.lwn.net)) 是一基于网络的 Linux “报纸”。它包含一个安全板块，提供有关漏洞的信息，包括一些针对特定发行版的评论。（点击主页左侧列中的\
  \ Security 链接；具体的 `URL` 会随日变化。）\n\n* `SecurityFocus 网站` — 维护在 [`www.securityfocus.com`](http://www.securityfocus.com)\
  \ 的网站在某种程度上是一个安全相关信息的发布媒体。与 `CERT/CC` 和 `CIAC` 网站相比，它较少关注事件报告，而是包含了更多教程和“摘要”类新闻。\n\
  \n这些网站都可以提供有关流行漏洞、新缺陷、新病毒和蠕虫、主要服务器的安全相关更新，以及如何保护你的系统免受各种危险的有用信息。定期检查其中一或两个网站是非常值得的——比如每天一次，或至少每周一次。\n\
  \n## 安全邮件列表和新闻组\n\n安全网站的问题之一是它们需要持续的监控。幸运的是，还有其他类型的资源在向你提供信息方面更加活跃。特别是邮件列表，这种通信方式允许个人邮件以电子邮件系统所运行的最快速度送达给整个读者群体。许多安全邮件列表不允许成员发帖；它们存在仅仅是为了分发来自列表维护者的信息。如果你定期检查邮件，就可以订阅邮件列表，并在新威胁被报告给该列表后很快获知它。\n\
  \n### 提示\n\n![TIP](img/tip.gif)\n\n你可以设置一个 `Procmail` 过滤器（在第 19 章 中讨论过）来监控邮件列表帖子，并在当列表中有新警报到达时运行一个特殊程序来引起你的注意。例如，你可以编写一个脚本，让\
  \ `Procmail` 播放音频文件或弹出一个特殊的警报对话框。\n\n在某些方面与邮件列表类似的信息分发媒介是安全新闻组。与邮件列表一样，新闻组是一组个人通过文本消息共享信息的方式。但新闻组需要更积极的监控，因此为了从新闻组中获得最大的收益，你必须定期阅读它，或者可能设置一个特殊的“机器人”脚本来扫描新闻组帖子中的重要关键词。\n\
  \n一些与 Linux 安全特别相关的邮件列表和新闻组包括：\n\n* `CERT/CC` 邮件列表 — `CERT/CC` 运行着一个邮件列表，他们在其中发布安全告告。如需订阅，请向\
  \ majordomo@cert.org 发送电子邮件，并在邮件正文中包含 `subscribe cert-advisory`。\n\n* `CIAC` 邮件列表\
  \ — 与 `CERT/CC` 一样，`CIAC` 维护其公告的邮件列表。你可以向 `majordomo@ tholia.llnl.gov` 发送消息，并在正文中包含文本\
  \ `subscribe ciac-bulletin` 来进行订阅。\n\n* `Bugtraq` 邮件列表 — Bugtraq 邮件列表是一个讨论列表，而不是通知列表。它是从交互环境中从他人获得建议或学习安全问题的一种良好方法。你可以通过向\
  \ `listserv@netspace.org` 发送邮件来订阅。邮件内容应包含 `subscribe bugtraq`。\n\n* `comp.security`\
  \ 新闻组 — `comp.security` 新闻组层级结构中有几个新闻组，包括 `comp.security.unix` 以及几个与特定产品或产品类型相关的组，例如\
  \ `comp.security.firewalls`。\n\n* `comp.os.linux.security` 新闻组 — 该新闻组专门讨论 Linux\
  \ 安全问题。\n\n字体 注意\n\n![NOTE](img/note.gif)\n\n大多数 Linux 安全问题实际上是 UNIX 安全问题，因为大多数\
  \ Linux 服务器运行在其他类 Unix 系统上，有时甚至运行在非 Unix 系统上（如 Microsoft Windows）。因此，大多数“Linux”安全讨论的范围比\
  \ Linux 本身广。\n\n## 总结\n\n维护安全的 Linux 系统需要你深入了解 Linux（或广义的 UNIX）是如何运行的。你必须能够识别并关闭不必要的服务器、尽可能安全地创建用户账户、更新软件以修复安全漏洞，并保持警惕以关注成功或尝试中的入侵。由于安全形势不断变化，你必须通过监控安全相关的网站、邮件列表和新闻组来维护你的知识。虽然这听起来是一项艰巨的任务，但一旦你熟悉了\
  \ Linux，你只需要每天花几分钟处理这项任务，就能跟上时代。你为提高系统安全性而花费的时间，可能会在某次破解尝试被挫败时获得回报。\n\n\n\n\n\n\
  第 23 章,第 25 章和第 26 章通过涵盖更多特定的安全相关主题继续讨论安全主题。\n\n# 第 23 章. 配置 `chroot` 监狱\n\n每个服务器都必须读取某些本地文件，某些服务器必须能够修改至少一些本地文件。如果这些权限被扭曲以满足攻击者的需求，那么攻击者就可以破坏你的系统配置，获得更多权限，并最终获得对系统的完全控制。然而，如果那个被破坏的系统只是真实计算机的一个子集，而且是一个能力非常有限的子集呢？这就是\
  \ `chroot` 监狱的核心思想——在一个极其受限环境中运行服务器，使得即使服务器被攻破，对攻击者也无益处。\n\n并不是所有服务器在 `chroot` 监狱中都能良好运行，但某些服务器的设计就是为了这种方式使用的。对于支持\
  \ `chroot` 操作的服务器，你必须同时设置服务器的配置选项以及服务器可以运行的受限 `chroot` 环境。\n\n## 什么是 `chroot` 监狱？\n\
  \nLinux 的目录系统建立在根目录（`/`）之上。所有目录都派生于此目录，并可以相对于根目录进行引用。`chroot` 监狱实际上是将根目录更改为其他内容（因此得名），如图图\
  \ 23.1 所示。例如，如果你将 `/opt/chroot` 设置为服务器的新根目录，那么服务器所做的所有文件引用将相对于 `/opt/chroot` 而非真正的根目录。因此，即使服务器被攻破，攻击者利用它修改了例如\
  \ `/etc/passwd`，修改实际上只会影响 `/opt/chroot/etc/passwd`，这与修改真实的 `/etc/passwd` 相比要严重得多。\n\
  \n![chroot 监狱创建了一个特殊环境，其中只包含特定服务器运行所需的文件。](img/23fig01.gif)\n\n**图 23.1. `chroot`\
  \ 监狱创建了一个特殊环境，其中只包含特定服务器运行所需的文件。**\n\n该方案通过一个名为 `chroot()` 的系统调用实现，通常由名为 `chroot`\
  \ 的程序使用。你可以通过使用处理该事项并调用其自身 `chroot()` 的服务器来设置 `chroot` 监狱，也可以通过使用 `chroot` 程序启动服务器。这些问题将在稍后的章节“配置服务器在\
  \ chroot 监狱中运行”中中进行更详细的描述。\n\n整个 `chroot` 监狱系统有几个重要的后果和影响：\n\n*   如果程序依赖于配置文件、使用动态库、接收或交付文件，或其他方式操作任何本地文件，则这些文件必须存在于\
  \ `chroot` 环境中。如果服务器需要许多支持文件，这一要求可能会导致产生巨大的 `chroot` 环境目录树。唯一的例外是，如果服务器实现了自己的 `chroot()`\
  \ 调用，并且在调用 `chroot()` 之前读取了支持文件，那么这些支持文件应该存在于 `chroot` 环境之外。\n\n*   运行在 `chroot`\
  \ 监狱中的服务器只能访问位于同一监狱内的文件。这意味着你应该将该环境中的多余文件减少到最，以尽可能减少被禁的工具作恶的机会。\n\n*   前述后果的推论是，如果你在\
  \ `chroot` 监狱中运行多个服务器，你应该为每个服务器创建一个独立的监狱。这可以最大限度地减少一个服务器中的漏洞被用于重新配置另一个服务器的概率，从而让攻击者获得更大的系统访问权限。\n\
  \n*   由于 `chroot` 监狱环境作为普通 Linux 目录树中的子目录存在，并非从 `chroot` 监狱运行的程序可以在监狱内放置文件。这取决于你的观点，可能是便利，也可能是潜在的安全风险。这一点将在接下来的章节“控制对\
  \ chroot 环境的本地访问”中进一步阐述。\n\n尽管 `chroot` 监狱似乎是降低运行服务器风险的好方法，但它并非没有缺点和局限性。其中之一是并不是所有服务器在\
  \ `chroot` 监狱中运行良好。某些服务器（例如大多数使用匿名模式的 FTP 服务器和某些邮件服务器）设计为部分或全部在 `chroot` 监狱中运行。其他服务器（例如\
  \ Telnet 服务器）则需要对普通 Linux 系统进行或或完全访问才能完成工作。因此，你不能简单地设置所有服务器都在 `chroot` 监狱中运行，尽管你可以对某些服务器这样做。\n\
  \n由于大多数 `chroot` 监狱是由系统管理员配置的，而不是由包管理系统自动设置，因此在升级服务器包后，可能会忽略 `chroot` 服务器。你必须记住在任何升级后重新复制任何更改的文件。如果你不这样做，你的\
  \ `chroot` 服务器可能会暴露于漏洞之中。\n\n`chroot` 监狱的另一个局限性是它们并不是不可逾越的。在监狱内部以 `root` 身份运行的进程可以发出\
  \ `chroot()` 调用返回真实的根目录（实际上这比发出单个 `chroot()` 调用要复杂一点，但不过于多少）。因此，对于赋予从 `chroot` 监狱内部运行的任何服务器\
  \ `root` 权限，你应该非常谨慎。虽然服务器本应应该表现良好，但过去已知漏洞和配置错误曾给不受欢迎的外部人员提供 `root` 权限，而且这在未来几乎肯定会发生。因此，虽然\
  \ `chroot` 监狱是一个很有用的安全工具，但它并不是万灵药。\n\n`chroot` 监狱可以提供针对你的计算机攻击的保护，但如果恶分子利用服务器攻击其他系统，`chroot`\
  \ 监狱提供的保护很少或没有。例如，受攻破的 DNS 服务器可能会提供虚假的名称查找，允许攻击者访问一个通过名称而非 IP 地址进行授权主机的 NFS 服务器，即使该\
  \ DNS 服务器运行在 `chroot` 监狱中。同样，从 `chroot` 监狱运行的服务器可能为攻击者提供一种从你的服务器 IP 地址直接攻击其他系统的手段。\n\
  \n最后，即使你在 `chroot` 监狱中运行了一个服务器，其他服务器可能没有以此方式运行，因此可能带来风险。此外，如果这些服务器处理的文件系统区域重叠，可能可以在\
  \ `chroot` 服务器和传统服务器之间传递文件，如果涉及的文件是配置文件之类的，这可能是危险的。\n\n# 必要的 `chroot` 环境文件\n\n配置服务器在\
  \ `chroot` 监狱中运行的首要任务是准备监狱。这意味着你必须创建一个适当的目录树、复制系统文件并复制服务器的文件。在某种意义上，你在 `chroot`\
  \ 监狱中建立了一个微型 Linux 系统，但这个微型系统缺少构成普通 Linux 系统的大部分程序和配置文件。\n\n### 注意\n\n![注意](img/note.gif)\n\
  \n\n\n\n\n本节以一种相对抽象的方式描述了设置 `chroot` 环境的过程。下一节“配置服务器在 chroot 监狱中运行”将提供更具体的服务器配置方法，包括一个在\
  \ `chroot` 监狱中运行 BIND 的示例。\n\n## 准备目录树\n\n`chroot` 监狱需要一个目录作为自己的根目录。原则上，你可以将此目录放在\
  \ Linux 文件系统树中的任何地方，但 `/proc` 等伪文件系统目录除外。如果你的服务器需要写入文件，则 `chroot` 目录树必须存在读写介质上。本章中的示例使用\
  \ `/opt/chroot` 作为 `chroot` 监狱的根目录，但这是任意的布局。\n\n在你的 `chroot` 树中，你应该按照普通 Linux 根目录的结构创建目录，包括子目录。不过，你可能只需要普通\
  \ Linux 安装中所需的一小部分目录。你可能需要创建的常见目录包括 `/bin`、`/sbin`、`/usr`、`/lib`、`/etc` 和 `/var`。随着服务器特定文件的添加，你可能需要增加此目录列表。你**不应该**向这些目录中填充与其对应的普通目录所有的文件；运行\
  \ `chroot` 监狱的意义之一，就是让潜在的破解者无法访问这些目录中提供的常规工具组合。\n\n如果你想运行多个 `chroot` 服务器，应该为每个服务器创建一个独立的\
  \ `chroot` 树。例如，你可能需要创建 `/opt/chroot/ftp` 和 `/opt/chroot/sendmail`。\n\n## 拷贝服务器文件\n\
  \n一旦你创建了基本的 `chroot` 监狱目录树，你就需要将文件拷贝到该树中。实际上有两种不同的适用情况。首先，服务器可能直接支持 `chroot` 操作。在这种情况下，可能不需要将服务器的可执行文件拷贝到\
  \ `chroot` 监狱中。相反，你在监狱外部运行服务器，但告诉它监狱的位置。然后服务器会在内部发出 `chroot()` 命令，此后它就会被锁定在监狱中。服务器也可能从监狱外部读取配置文件，因此这种操作几乎是透明的——你只需要提供监狱本身以及服务器在正常运行期间所需的任何文件。<acronym\
  \ class=\"acronym\">FTP</acronym> 服务器经常以这种方式锁定到 `chroot` 监狱中，特别是当它们作为匿名 <acronym\
  \ class=\"acronym\">FTP</acronym> 服务器运行时。第 21 章 运行 FTP 服务器涵盖了匿名 <acronym class=\"\
  acronym\">FTP</acronym> 服务器的操作，包括设置必要的 `chroot` 监狱目录。\n\n另一种方案是使用 `chroot` 程序运行不包含内置\
  \ `chroot` 支持的服务器。在这种方法中，你必须将服务器可执行文件、配置文件以及在正常运行期间所需的任何文件拷贝到监狱中。你还需要拷贝一些更通用的系统文件，如下一节“拷贝系统文件”所述。追踪服务器所需的文件可能是困难的，因为没有一种简单的规则可以始终找到需要的文件。你可能通过检查服务器文档和检查发行包附带的文件列表来寻找线索。例如，你可以使用\
  \ `tar`、`rpm` 或 `dpkg` 来查找原始服务器包中的文件。你可能不需要拷贝*所有*这些文件。例如，你可以将文档文件留在 `chroot` 监狱之外。另一个技巧是使用\
  \ `strace` 程序发现服务器打开了哪些文件。你可以运行类似 `strace serverprog` 的命令并检查输出，以发现 `serverprog`\
  \ 正在做什么，包括它正在打开哪些文件。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n尽管我提到的是*拷贝*文件，但你最终可能更想*移动*它们。这将确保你的服务器是从监狱运行的，至少如果你的配置文件对其他文件使用了绝对引用，那么它们在\
  \ `chroot` 环境之外将无法无法工作。如果监狱与主文件位于同一分区上，创建硬链接也是一种选择。（如果符号链接指向监狱外部，它们将无法工作。）另一方面，在它独立的分区中创建\
  \ `chroot` 监狱可以提供一些安全优势，因为这样就无法在 `chroot` 环境之外创建硬链接，从而降低了服务器被攻破后用于修改外部文件的风险。\n\n\
  ## 拷贝系统文件\n\n在你将基本的服务器文件拷贝到 `chroot` 监狱之后，你必须拷贝服务器依赖的任何通用 Linux 系统文件。具体需要哪些文件因服务器而异，但你可能需要的一些常见文件包括：\n\
  \n*   **库 (Libraries)**：许多服务器依赖动态链接库。这些通常存储在 `/lib` 中，有时在 `/usr/lib` 中。你可以使用 `ldd`\
  \ 命令发现特定服务器所需的库，例如 `ldd /usr/sbin/named`。你应该将该命令列出的任何文件拷贝到 `chroot` 监狱中对应的目录下。\n\
  *   **支持程序**：某些服务器依赖支持程序。例如，支持脚本的 Web 服务器依赖脚本语言（如 `/usr/bin/perl`），以及支持该可执行文件的文件。你必须将这些支持程序拷贝到\
  \ `chroot` 监狱中适当目录。你还需要定位并拷贝支持程序依赖的库。在某些情况下（例如 Web 服务器使用的脚本语言），你拷贝到 `chroot` 监狱的支持文件实际上多于服务器文件。\n\
  *   **设备文件**：某些服务器可能依赖访问硬件设备文件。例如，备份服务器需要访问磁带设备文件。少数库和程序需要访问 `/dev/zero` 或 `/dev/null`\
  \ 等特殊用途设备文件。设备文件通常位于 `/dev` 中。它们不能像普通文件那样拷贝；相反，你应该通过使用 `mknod` 命令在 `chroot` 监狱中重新创建它们，例如\
  \ `mknod /opt/chroot/dev/st0 c 9 0`。注意，许多设备文件提供了巨大的权限，除非绝对必要，否则你不应该在 `chroot` 环境中创建设备文件。\n\
  *   **特殊文件系统**：少数服务器可能依赖特殊文件系统或文件系统操作工具。特别是某些服务器需要访问 `/proc` 文件系统。你不能像其他目录一样拷贝此目录。相反，你必须在\
  \ `/etc/fstab` 中为该文件系统创建一个条目，但挂载在 `chroot` 监狱内部。不过不要删除原始的 `/proc` 文件系统；复制它！其他非 `chroot`\
  \ 程序在通常位置需要 `/proc`。如果可以避免，你不应该以此方式复制 `/proc`，因为它包含了伪文件，攻击者即使在 `chroot` 监狱内部也可以借此对你的计算机获得实质。\n\
  *   **用户数据库文件**：某些服务器需要访问 `/etc/passwd`、`/etc/group`、`/etc/shadow` 以及类似的组数据库信息文件。使用可插拔认证模块\
  \ (<acronym class=\"acronym\">PAM</acronym>) 方法进行认证的服务器需要整个 <acronym class=\"acronym\"\
  >PAM</acronym> 基础设施，包括 `/etc/pam.conf` 文件、`/etc/pam.d` 和 `/etc/security` 的内容，以及\
  \ `/lib` 和 `/lib/security` 中带有 `pam` 字样的各种库。检查你的 <acronym class=\"acronym\">PAM</acronym>`\
  \ 包的内容，寻找你可能需要复制的线索。（这个包通常被称为 `libpam`。）\n\n\n\n\n\n# 日志文件\n\n如果服务器会创建日志文件，你应该为它们创建一个适当的目录。某些服务器依赖\
  \ `syslogd` 来记录日志，因此你可能需要将此守护进程及其所有支持文件复制到 `chroot` 监狱中。某些服务器可以配置为进行自身的日志记录，即使它们通常依赖于\
  \ `syslogd`。\n\n对于包含显式内部 `chroot()` 支持的服务器，你可能需要复制比不包含该支持的服务器更少的系统文件。包含内部 `chroot()`\
  \ 用的服务器通常可以在运行前加载库、系统文件等，并且即使这些文件在普通操作中是必需，也不需要存储在它们的 `chroot` 环境中。\n\n### 提示\n\
  ![TIP](img/tip.gif)\n\n为了获得最佳安全性，对支持文件应采取最小化方法。只拷贝你确定服务器可能需要的文件，然后尝试运行服务器（如果服务器支持此类选项，可以带有调试选项以便在控制台上产生额外的调试输出）。这应该为你提供关于可能需要哪些额外文件的线索；例如，服务器可能会抱怨找不到配置文件。根据需要添加更多文件，最终你将获得可以运行的最小配置。\n\
  \n# 配置服务器在 `chroot` 监狱中运行\n\n一旦设置好 `chroot` 监狱，就可以开始使用它了。这涉及配置服务器在监狱中运行、启动服务器使其在监狱中运行以及控制外部对监狱的访问。本节描述了如何执行这些操作，并以在\
  \ `chroot` 监狱中运行名称服务器示例结束。\n\n## 在 `chroot` 监狱中运行服务器\n\n如果你运行的是具有显式 `chroot()` 支持的服务器，它可能包含一个或多个与\
  \ `chroot` 操作相关的配置选项。例如，ProFTPd 的 `<Anonymous>` 指令会自动设置服务器从指定的目录作为 `chroot` 监狱运行。你应该咨询你的服务器文档以了解哪些配置选项会调用\
  \ `chroot` 操作，并对其进行适当设置。\n\n如果你正在配置一个缺乏显式 `chroot` 支持的服务器，你应该从主 Linux 环境中的工作配置开始。在监狱之外测试服务器，以确保基本配置工作正常。然后你可以将配置文件复制到\
  \ `chroot` 监狱中，该配置在经过极少或不更改的情况下继续工作。一旦环境配置正确，你就可以使用 `chroot` 命令来运行服务器，其语法如下：\n\n\
  ```\nchroot /new/root server-name [server-options]\n```\n\n`/new/root` 目录是 `chroot`\
  \ 监狱目录，`server-name` 是服务器名称（如果必要，包含路径），`server-options` 是服务器所需的任何选项。注意，你指定的 `server-name`\
  \ 路径相对于其新根目录。例如，如果程序文件为 `/opt/chroot/bin/server`，而 `/opt/chroot` 为监狱目录，你应该输入以下命令启动服务器：\n\
  \n```\n# chroot /opt/chroot /bin/server\n```\n\n如果你的服务器通过 SysV 启动脚本或本地启动脚本启动，你需要修改启动脚本以包含\
  \ `chroot` 命令，或者禁用启动脚本寻找其他方式启动服务器。如果服务器通常从超服务器（super server）运行，你需要在 `chroot` 环境中与目标服务器一起设置超服务器，修改超服务器的启动命令以包含\
  \ `chroot` 调用，或更改服务器启动方法使用 SysV 或本地启动脚本。\n\n## 控制对 `chroot` 环境的本地访问\n\n`chroot`\
  \ 监狱设置了单向保护——`chroot` 监狱内的程序无法影响监狱外的系统。你可能也想限制另一个方向的访问。例如，你可能在 `chroot` 监狱中设置服务器，并对\
  \ `chroot` 监狱目录使用限制权限，以防止未经授权的用户读取这些目录中的文件。你可以通过将 `chroot` 监狱的所有者设置为 `root`，将组所有权设置为一个特殊组，并对目录树中的文件使用\
  \ `0640` (`rw-r——-`) 权限来实现。然后你可以以你为此目的创建的特殊组用户的身份运行服务器。结果是服务器可以读取但不能写入 `chroot`\
  \ 监狱内的文件，而在监狱之外，只有 `root` 可以读取或写入树形内的文件。当然，如果服务器必须能够写入文件，你可能需要放宽其中一些权限。\n\n### 警告\n\
  ![WARNING](img/warning.gif)\n\n作为一般原则，你不应该赋予服务器对其监狱内所有文件或目录的写权限。在服务器被入侵的情况下，这将允许服务器重写关键配置文件和实用程序，可能会导致问题。如果服务器通常以\
  \ `root` 身份运行，赋予其监狱内所有文件完全写权限的风险并不大于在监狱外以 `root` 身份运行服务器的风险，但对于不以 `root` 运行的服务器，将程序文件的所有权交给服务器会增加风险，至少在\
  \ `chroot` 环境中。\n\n## 示例：在 `chroot` 监狱中运行 BIND\n\n前面的描述可能对设置 `chroot` 监狱有帮助，但通过一个更具体的示例来落实该主题可能会更有帮助。因此，本节描述了在\
  \ `chroot` 监狱中安装伯克利域名系统（BIND）。在继续之前，你可能希望阅读或至少浏览一下第 18 章（通过 DNS 管理域名）。此示例没有更改默认\
  \ BIND 配置，除了将其移动到 `chroot` 监狱，因此你不需要熟悉服务器配置的细节。本节使用 Debian 2.2 安装作为示例。由于软件包管理系统的不同，其他发行版的步骤会有所不同。\n\
  \n### 注意\n![NOTE](img/note.gif)\n\n此示例使用 `chroot` 命令在监狱中运行 BIND。第 21 章（运行 FTP 服务器）包含一个使用\
  \ FTP 服务器内置 `chroot` 支持的 FTP 配置示例。\n\n要开始此过程，我们需要安装标准的 BIND 包。在 Debian 中可以通过许多方式实现，但对于本示例，我使用了\
  \ `apt-get`：\n\n```\n# apt-get install bind\n```\n\n以正常方式安装标准的 Debian BIND 包。安装脚本运行并询问你是否将本地机器作为名称服务器添加到\
  \ `/etc/resolv.conf`。为了测试，我没有这样做，但此细节对于演示并不重要。完成后，Debian 会运行 BIND，你可以通过以下方式验证：\n\
  \n```\n# ps aux | grep named\nroot      7656  0.0  1.5  2184 1492 ?        S   \
  \ 13:29   0:00  /usr/sbin/named\n# host awl.com localhost\nawl.com             \
  \    A       165.193.123.224\n```\n\n第二个命令用于验证 BIND 是否已安装并正常工作；它调用 `host` 命令通过 `localhost`\
  \ 查找 awl.com 的 IP 地址。你可以用你喜欢的任何其他主机名替换 awl.com，或者使用服务器真实的名称或 IP 地址代替 `localhost`。如果你收到\
  \ `command not found` 错误，你必须在 Debian 中安装 `dnsutils` 软件包以获取 `host` 程序。（该程序在其他发行版可能位于另一个命名的软件包中，例如\
  \ `bind-utils`。）\n\n\n\n\n既然你已经验证服务器运行正常，现在可以将其关闭了：\n\n```\n# /etc/init.d/bind stop\n\
  ```\n\n关闭服务器后，下一步是创建一个 `chroot` 目录树。本示例使用 `/opt/chroot` 作为 `chroot` 监狱牢目录。因此，我们首先创建监狱牢目录树，并将\
  \ BIND 文件移动到该目录树中：\n\n```\n# mkdir -p /opt/chroot/usr/sbin /opt/chroot/var/cache/bind\n\
  # mkdir /opt/chroot/lib /opt/chroot/etc\n# cp /usr/sbin/named /opt/chroot/usr/sbin\n\
  # cp -rp /etc/bind/ /opt/chroot/etc\n```\n\n### 注意\n\n![NOTE](img/note.gif)\n\n\
  此步骤展示了如何配置 BIND 使用 `chroot` 命令运行，但实际上 BIND 包含了内置的 `chroot()` 支持，因此其实有一种稍微简单一点的方法，稍后会进行描述。不过，即使你使用更简单的方法，你仍然需要设置\
  \ `chroot` 监狱牢目录树并将配置文件复制到其中。不过，你可以省略 `named` 本身。\n\n这些命令建立了 BIND 目录树的基础结构，并将 `named`\
  \ 服务器和 `/etc/bind` 中的配置文件复制到 `chroot` 监狱牢中相应的目录下。如果你是从零开始安装服务器，可能需要进行一些调查来确切了解需要复制哪些文件，并且可能最终以零散的方式创建这些文件和目录。其中一项特别重要的侦查工作是定位服务器所依赖的支持库。你可以使用\
  \ `ldd` 执行此操作并复制库，方法如下：\n\n```\n# ldd /usr/sbin/named\n        libc.so.6 => /lib/libc.so.6\
  \ (0x40017000)\n        /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)\n\
  # cp /lib/libc.so.6 /lib/ld-linux.so.2 /opt/chroot/lib\n```\n\n此时，你可以测试你的配置了：\n\n\
  ```\n# chroot /opt/chroot /usr/sbin/named\n# host awl.com localhost\nawl.com   \
  \              A       165.193.123.224\n```\n\n如果不起作用，请检查是否只有一个 `named` 实例在运行，并确保你已创建或复制了所有必要的文件。然后你可以修改\
  \ BIND 启动脚本（Debian 中的 `/etc/init.d/bind`）以通过 `chroot` 命令启动服务器，或者禁用 SysV 启动脚本并以其他方式启动服务器。许多\
  \ SysV 启动脚本使用封装程序（例如 Debian 中的 `start-stop-daemon` 和 `ndc`）来完成工作，这些程序可能会在更多目录（例如\
  \ `/var/run`）中创建文件，因此你必须将这些文件和目录复制到 `chroot` 监狱牢内部：\n\n```\n# mkdir -p /opt/chroot/sbin\
  \ /opt/chroot/var/run\n# cp /usr/sbin/ndc /opt/chroot/usr/sbin\n# cp /sbin/start-stop-daemon\
  \ /opt/chroot/sbin\n```\n\n你可以通过在每个 `start-stop-daemon` 和 `ndc` 实例之前添加 `chroot /opt/chroot`\
  \ 来编辑 SysV 启动脚本。遗憾的是，你的工作还没有完成，因为 `start-stop-daemon` 依赖于 `/proc` 文件系统，而这在 `chroot`\
  \ 目录树中不可用的。你可以编辑 `/etc/fstab` 文件使其可用——复制现有的 `/proc` 行并重命名它使其挂载到 `/opt/chroot/proc`。然后必须输入\
  \ `mount -a` 来挂载 `chroot` 监狱牢内重复的 `/proc`。\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n如前所述，`/proc` 文件系统非常强大，因此更好的方法是编辑 SysV 启动脚本使其不使用 `start-stop-daemon`，或者完全放弃 SysV\
  \ 启动脚本并使用其他方法。此时，你应该能够测试你的配置：\n\n```\n# /etc/init.d/bind stop\n# host awl.com localhost\n\
  awl.com                 A       165.193.123.224\n```\n\n如果不起作用，请检查是否只有一个 `named`\
  \ 实例在运行，并确保你已创建或复制了所有必要的文件。然后你可以修改 BIND 启动脚本（Debian 中的 `/etc/init.d/bind`）以通过 `chroot`\
  \ 命令启动服务器，或者禁用 SysV 启动脚本并以其他方式启动服务器。许多 SysV 启动脚本使用封装程序（例如 Debian 中的 `start-stop-daemon`\
  \ 和 `ndc`）来完成工作，这些程序可能会在更多目录（例如 `/var/run`）中创建文件，因此你必须将这些文件和目录复制到 `chroot` 监狱牢内部。\n\
  \n\n\n\n幸运的是，这些任务不会消耗太多时间，其花费远超常规的服务器维护。大多数任务只需设置一次选项并让自动程序处理其余工作，或者在更新或重新配置服务器时采取一些额外的步骤。\n\
  \n## 总结\n\n在 `chroot` 监狱中运行服务器对于许多类型的服务器来说都是一项非常有用的安全预防措施，特别是对于那些不需要访问计算机上大多数文件的服务器。设置服务器需要创建常规\
  \ Linux 目录树的部分副本，可能还包括服务器的可执行文件本身。然后，你必须激活一个特定的特定的配置选项以将其锁定在 `chroot` 监狱中，或者使用 `chroot`\
  \ 命令运行服务器。无论何种情况，服务器都会在 `chroot` 监狱内部运行，就好像你设置的目录就是计算机的根目录一样，从而限制了服务器在受到攻击时可能造成的潜在损害。完成所有这些操作需要深入研究服务器对支持文件和程序的正常需求、复制文件并修改启动程序，以便服务器在任何适当的情况下都在其\
  \ `chroot` 监狱中运行。你还必须确保维护 `chroot` 环境，使其能够按照你的意图继续运行。\n\n# 第 24 章 高级路由器选项\n\n尽管\
  \ Linux 通常被认为是一种通用操作系统，但它越来越多地被用于各种专门应用程序，例如掌上电脑（[`www.agendacomputing.com`](http://www.agendacomputing.com),\
  \ [`www.gmate.com/english/overview.htm`](http://www.gmate.com/english/overview.htm)\
  \ 以及其他）和数字视频录像机([`www.tivo.com`](http://www.tivo.com))）。这些专门应用程序中的某些使用了专用硬件。而没有（或至少*不需要*）使用的一种是将\
  \ Linux 作为路由器操作系统。路由器是不受大众关注的设备，但它们承担着连接组成互联网的计算机的至关功能。路由器的范围从卖给个人和小企业、通过宽带连接将几台计算机连接到互联网的小型简单设备，到价值数千美元并连接互联网骨干网的设备不等。Linux\
  \ 可以毫不费力地作为低端路由器，但如果你想让它处理几十台计算机以上的流量，你可能希望研究 Linux 的高级路由器选项。这些选项允许操作系统使用各种技术来优化数据包传输优先级，并与其他路由器进行通信。\n\
  \n### 注意\n\n![NOTE](img/note.gif)\n\n如果你想将 Linux 作为执行网络地址转换（<acronym class=\"acronym\"\
  >NAT</acronym>）的宽带路由器，请参考第 25 章,配置 iptables。\n\nLinux 中的基本路由器配置相对简单，但高级路由器选项可能非常复杂。因此，本章只能对涉及的问题和工具提供概述。如需更多信息，你应该查阅特定工具的文档，例如\
  \ Malkin 的 *<acronym class=\"acronym\">RIP</acronym>: An Intra-Domain Routing Protocol*（Addison\
  \ Wesley, 2000）；或者通用的路由书籍，如 LeBlanc 等人的 *Linux Routing*（New Riders, 2002）。\n\n#\
  \ 何时使用高级路由器配置\n\n你首先应该意识到本章涵盖的是*高级*路由器配置。如果你的基于 Linux 的路由器传输的流量非常小，以至于跟上负载没有压力，而且路由器的配置是简单且静态的，不需要重新配置即可与其他路由器协作，那么就没有必要使用本章描述的选项。你只需通过配置两个网卡并输入以下命令启用它们之间的路由即可启用路由器功能：\n\
  \n```bash\n# echo \"1\" > /proc/sys/net/ipv4/ip_forward\n```\n\n此命令结合针对多个网络的适当路由表配置（如第\
  \ 2 章, TCP/IP 网络配置所述），足以将一台 Linux 计算机变成路由器。这种配置对于许多网络来说可能足够。\n\n### 注意\n\n![NOTE](img/note.gif)\n\
  \n通过多个接口、适当的路由表和 <acronym class=\"acronym\">IP</acronym> 转发配置你的 Linux 路由器是你需要在*本地*完成的工作。然而，与此计算机直接通信的系统必须将其识别为路由器，此配置才能生效。例如，考虑一台\
  \ Linux 计算机使用对称数字用户线路（<acronym class=\"acronym\">SDSL</acronym>）宽带连接到互联网，为十几台计算机提供路由。如果路由器没有执行\
  \ <acronym class=\"acronym\">NAT</acronym>，那么连接到 Linux 路由器一个网络接口的 ISP 路由器必须知道你的\
  \ Linux 路由器是你网络网段的路由器。如果情况并非如此，网络数据包将发出，但你的 ISP 路由器将不知道如何将回包路由回来。因此，对于大多数路由器配置，你必须与与其路由器连接的其他路由器的维护者通信。你还需要配置本地系统使用你的\
  \ Linux 路由器作为网关。\n\n本章描述的一种高级路由器配置（于“高级内核选项”和“使用 iproute2”部分）涉及修改 Linux 根据数据包某些特性（例如源、目的或协议类型）决定路由的方式。这些选项会影响互联网的呈现方式，因为可能会赋予与交互协议相关的数据包优先级，或者偏向来自某些计算机的流量。此类配置通常用于高度专用的路由器。\n\
  \n本章描述的第二类高级路由器配置是路由协议。这些你可以用来与其他路由器通信的协议。实现这些协议的服务器允许你的系统动态更新路由表，以反映数据包传输的最佳路径，以便数据包能够最快地到达目的地。此类协议可以增强使用它们的网络性能，但它们对于具有多个连接互联网的网接口的路由器最用。如果路由器只有一个到互联网的链路，该链路无法以任何有意义的方式更改，因此在服务器上运行路由协议没有意义，因为该协议对路由器的路由表没有影响。高级内核选项\n\
  \nNetworking Options 内核配置菜单。这些选项中的许多但并非所有都属于 <acronym class=\"acronym\">IP</acronym>:\
  \ Advanced Router ，因此你必须激活此选项才能激活其子选项。你可以使用这些选项来修改 Linux 路由数据包的方式——例如它如何划分数据包优先级、响应收到的数据包中的优先级代码或处理特定类型的数据包。你可以通过在相应的配置选项上选择\
  \ `Y`（有时是 `M` 用于模块化编译）来激活这些选项的支持。然而，这些选项中的大多数还需要通过特殊工具进行配置。其中一些相当复杂，因此本节仅介绍这些工具的概述。\n\
  \n\n\n\n内核选项有时会更改名称、拆分为多个选项或随着新内核版本的发布而消失。本节描述的是 2.4.17 内核中出现的选项，但如果你使用的内核比此版本明显旧或更新，你的选项可能会有所不同。\n\
  \n## 策略路由\n\n第一个高级 Linux 内核路由选项称为 `IP`: 策略路由（Policy Routing）。此选项启用了三种决定数据路由的新方法：\n\
  \n*   **源地址 (Source address)**：Linux 路由器通常只使用目的地址来决定如何路由数据。你可以让路由器也使用源地址。你可能会用此将低优先级主机的数据通过比高优先级主机数据更慢或不可靠的连接进行传输。不过，请谨慎使用此选项；如果具有此类配置的路由器与使用常规路由标准的路由器交互，可能会导致路由不一致甚至产生路由环路。\n\
  *   **标记过滤 (Mark filtering)**：数据包可以标记为称为 `mark values` 的唯一数据。如果你激活了 `IP`: 使用 Netfilter\
  \ MARK 值作为路由密钥选项，就可以使用这些标记通过特定的网络路由发送数据包。为了启用此选项，你还必须在菜单较早位置启用网络数据包过滤选项。\n*   **快速\
  \ NAT (Fast NAT)**：`NAT` 是一种在单个 `IP` 地址后“隐藏”网络的工具，或者通过修改路由器中的数据包来更改与单个计算机关联的 `IP`\
  \ 地址。如果你想让系统作为 `NAT` 路由器运行，你可能需要激活此选项；然而，这不是强制要求的。此选项以一种不同于通常的方法启用 `NAT`。（第 25 章\
  \ 详细描述了 `NAT`。）\n\n所有这些选项都依赖于 `iproute2` 包，该包与内核通信以设置各种高级路由功能。该包将在接下来的章节“使用 iproute2”中介绍。\n\
  \n## 服务类型值\n\n`TCP/IP` 支持一种名为“服务类型 (Type-of-Service, TOS)”的字段类型。你可以在离开客户端、服务器或网络的数据包上设置此字段，以标识这些数据包需要特定类型的处理。你可能会用此让某些数据包访问比其他数据包更快或更可靠的连接。要使用此功能，你必须激活\
  \ `IP`: 使用 TOS 值作为路由密钥内核选项。\n\n此选项也使用了 `iproute2` 包（后文将要介绍）。具体来说，`ip` 命令中 `selector`\
  \ 的 `tos` 选项作用于 `TOS` 值。这些值是普通数字，例如 4。除了本地软件外，其他路由器必须遵守 `TOS` 请求。不过，大多数 ISP 的路由器会忽略\
  \ `TOS` 字段，因此此选项可能对你无用处。\n\n## 多路径路由\n\n通常，当你指定路由操作时，入站数据包将与规则进行匹配，这些规则以完全确确定输出路径。例如，你可能有一条路由表规则，将发往\
  \ 10.201.0.0/16 的数据包通过 `eth1` 发送。所有目的在该范围内的数据包都会经过 `eth1`。有时可以指定两条看似冲突的规则。例如，你可能有另一条规则，告诉系统将所有发往\
  \ 10.201.34.0/24 的数据包发送到 `ppp0`。但在通常配置下，第二条规则优先于第一条，因为第二条规则更具体。如果你为 10.201.0.0/16\
  \ 提供了第二条路径（例如将这些数据包通过 `ppp0` 发送），Linux 只使用它找到的第一个匹配规则。\n\n如果你激活了 `IP`: 等价多路径（Equal\
  \ Cost Multipath）内核配置选项，Linux 在遇到多个匹配的路由表规则时的行为会发生变化；它会在两个路由中随机选择一个。如果你有两个 Internet\
  \ 连接，可以将此作为一种粗略的负载均衡形式。此选项不会影响存在两条规则但其中一个更具体的情况——具体的规则仍然优于不那么具体的规则。\n\n## 路由器日志选项\n\
  \n`IP`: 详细路由监控（Verbose Route Monitoring）内核选项会激活一项无需进一步配置的内核功能：对路由信息进行额外的记录。通常，内核不会记录常规路由信息，因此你在日志中几乎或完全没有关于路由活动的证据。尽管如此，此选项会使内核记录有关可疑数据包的信息。然后你可以检查系统日志，以发现更多关于你的路由器处理的流量的信息。\n\
  \n详细的路由器日志听起来是一项良好的安全措施，在某些情况下确实如此。但在非常繁忙的路由器上，这些额外信息可能会在磁盘活动、磁盘空间甚至 CPU 时间方面消耗大量的系统资源。因此，它可能会降低性能。从理论上讲，想要崩溃你的服务器的人可以拒绝服务\
  \ (DoS) 攻击，旨在让你的路由器记录异常数量的数据包，从而降低性能并可能导致你的磁盘溢满。如果你尝试此选项，应该检查日志大小和路由器性能，以确保它没有产生负面影响，并可能制定一个应急预案，例如让路由器给你发送报警，以便在系统遭受与此选项相关的\
  \ DoS 攻击时处理问题。\n\n## 大型路由表\n\nLinux 内核针对约 64 条目的或更少的路由表进行了优化。如果你的路由器配置异常复杂，可能包含超过此数量的记录，在这种情况下，你应该激活\
  \ `IP`: 大型路由表（Large Routing Tables）选项。这会更改内核配置，以便更好地处理包含超过 64 条目的路由表。\n\n## 组播路由\n\
  \n大多数 Internet 流量是点对点的——例如，你可能向 Web 服务器发送请求，服务器向你回传 Web 页面。这种流量仅针对一个接收者，尽管正如书中多次提到的，在某些情况下，一台计算机可以窃听发往另一台计算机的数据。另一种常见的网络流量类型是“广播（broadcast）”。这些是指向本地网络上所有计算机的数据包。存在两种广播。首先，“本地子网（local\
  \ subnet）”广播使用接收地址 255.255.255.255，它可以到达本地子网上的所有计算机。“定向子网（directed subnet）”广播更具限制性；它使用地址网络部分的值，后跟二进制\
  \ 1 值（例如对于 192.168.34.0/24 网络使用 192.168.34.255）。`DHCP` 客户端首次尝试查找 `DHCP` 服务器时使用广播，因为\
  \ `DHCP` 客户端不知道服务器的地址。其他少数协议也可以广播，例如某些形式的 `SMB/CIFS` 名称解析。广播通常限制在一个子网内；它们通常不被路由。（尽管某些路由器会路由定向子网广播。）\n\
  \n\n\n\n在定向流量和广播之间存在一种情况：`组播 (multicasts)`。组播由同时发送给多个接收者的数据包组成，但并不是网络上的所有计算机。组播并不常见，但有一些工具在使用它们，主要用于传输直播音频或视频流。其中一个系统是组播骨干网\
  \ (MBONE；[`www.cs.columbia.edu/~hgs/internet/mbone-faq.html`](http://www.cs.columbia.edu/~hgs/internet/mbone-faq.html))。这是一个全网络级组播的示例，范围可能非常广泛。另一种更局限的组播类型被称为`链路本地\
  \ (link-local)`，通常分布不广，可能被某些路由协议用于路由器之间的通信，正如后接章节“使用路由协议””所述。\n\n如果你想让路由器支持组播包的路由，必须包含适当的组播支持。这是通过\
  \ `IP`: Multicast Routing 内核配置选项实现的。此外，你可能需要添加两个子选项之一的支持——`IP`: `PIM`-`SM` 版本 1\
  \ 支持或 `IP`: `PIM`-`SM` 版本 2 支持。这些是`稀疏模式 (SM) 协议无关组播协议 (PIM)`的两种变体，与早期的组播实现相比，它是在带宽有限的网络上支持组播的方法。`SM`-`PIM`\
  \ 版本 1 更常见，也是 Cisco 在路由器中支持的协议。\n\n除了内核选项外，你还需要特殊的软件来支持组播路由，特别是 `mrouted`。该工具配置基础\
  \ Linux 组播路由能力。你可以在 ftp://ftp.rge.com/pub/communications/ipmulti/beta-test/ 找到它（如果你的发行版中没有），你可以在\
  \ [`jukie.net/~bart/multicast/Linux-Mrouted-MiniHOWTO.html`](http://jukie.net/~bart/multicast/linux-mrouted-minihowto.html)\
  \ 阅读关于它的信息。如果你使用 `PIM`-`SM` 版本 2，可能还需要额外的软件，例如 `pimd` ([`netweb.usc.edu/pim/pimd/`](http://netweb.usc.edu/pim/pimd/))。\n\
  \n## 服务质量 (Quality of Service)\n\nLinux 路由器路由数据包时遵循的正常程序是遵循先来来策略——在调度交付两个数据包时，Linux\
  \ 按照接收数据包的顺序进行交付。当路由器的所有端口都有足够的带宽时，或者不需要为某些类型的数据包提供优先级时，此程序运行良好。但在繁忙的服务器上，使用不同的调度方法可能是理想的——例如减少到某些站点的流量速率，或为特定用户或应用程序保证特定的带宽。扩展内核以支持此类高级调度选项是\
  \ QoS 和/或公平队列（Fair Queueing）菜单的任务，该菜单可以通过 Networking 菜单末尾的同名选项访问。（`QoS` 代表“服务质量”，这是该菜单上特定一组调度算法的名称。）\n\
  \n激活 QoS 选项本身不会改变系统的运行；与许多其他高级路由选项一样，你必须使用 `iproute2` 软件包中的工具来激活和配置这些功能。如果你不确定是否需要这些功能，可以激活基础支持并将大多数选项编译为模块。这样你就不需要使用这些选项，但如果你发现确实需要，它们也是可用的。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n在编译每个选项之前阅读其帮助信息。在 2.4.17 中，据报道一个 Clark-Shenker-Zhang\
  \ (`CSZ`) 算法是损坏的。尝试使用损坏的选项充其情况下没有明显影响，最坏的情况下会导致运行不可靠。\n\n# 使用 `iproute2`\n\n`iproute2`\
  \ 软件包随大多数 Linux 发行版一起发布，通常命名为 `iproute`。你也可以从其官方网站 ftp://ftp.inr.ac.ru/ip-routing/\
  \ 获取。该包包含了几个命令，其中两个在本本文中介绍：`ip` 和 `tc`。\n\n## 使用 `ip`\n\n用于操作路由表和规则的 `iproute2`\
  \ 命令是 `ip`。该程序依赖于内核配置中 `IP`: Advanced Router 的几个子选项，如前所述。该程序的使用方式如下：\n\n```\n ip\
  \ command [list | add | del] selector action\n```\n\n你可以指定多个命令中的任何一个。其中最重要的命令之一是\
  \ `rule`。你可以使用此命令来添加 (`add`)、删除 (`del`) 或显示 (`list`) 特定路由规则的信息。你通过 `selector` 指定规则，选择器本身由多个项目组成：\n\
  \n```\n [from addr] [to addr] [tos TOS] [dev device-name] [pref number]\n```\n\n\
  `from` 和 `to` 元素允许你指定 `IP` 地址，`tos` 允许你指定 `TOS` 值（这是一个数字，例如 `4`；这需要后述的内核选项），`dev`\
  \ 指定网络设备名称（例如 `eth0`），`pref` 表示优先级数字。这些项目共同告诉 Linux 如何识别适用于给定规则的数据包。`ip rule` 命令将这些与\
  \ `action` 关联，`action` 有多个组成部分：\n\n```\n [table table-id] [nat address] [prohibit\
  \ | reject | unreachable]\n```\n\n`table-id` 是识别特定路由表的数字，`nat` 允许为数据包指定一个新的源地址，`prohibit`、`reject`\
  \ 和 `unreachable` 是指示完全拒绝数据包的各种方法的代码。\n\n将这一切整合在一起，你可能会输入类似下面的 `ip` 命令：\n\n```\n\
  \ # ip rule add from 172.20.24.128 dev eth0 table 2\n```\n\n此规则告诉系统对于来自 `eth0` 上\
  \ 172.20.24.128 的所有流量使用路由表 2。然而，路由表 2 是什么？普通的 Linux 安装使用 `route` 命令创建路由表，这样的系统中正好有一个路由表。高级路由功能允许你使用多个路由表，你可以通过\
  \ `ip route` 命令设置它们。然后可以使用其他路由工具在不同的路由表之间快速切换，以处理不同类型的流量。此命令比普通的 `route` 更复杂，但它的功能大部分是普通\
  \ `route` 命令的超集。因此，你可以像在第 2 章 中描述的那样使用 `ip route`。不过，有一个扩展特别重要：你可以通过 `table` `table-id`\
  \ 选项指定路由表编号。例如，你可能使用以下命令向路由表 2 添加路由：\n\n```\n ip route add 10.201.0.0/16 dev eth1\
  \ table 2\n```\n\n除了前面的 `ip` 和结尾的 `table 2`，此命令的工作原理与等效的 `route` 命令相同。具体，它告诉系统将所有针对\
  \ 10.201.0.0/16 对应的数据通过 `eth1` 传递，而不发送到另一个路由器。（在这种情况下，`eth1` 应该有一个 10.201.0.0/16\
  \ 网络上的地址。）\n\n## 使用 `tc`\n\n\n\n\n\n`tc` 工具用于利用 QoS 和/或公平队列（Fair Queueing）内核配置选项。你可以使用它来管理出站网络带宽，以防止某一类流量垄占可用带宽。例如，假设你的组织有两个子网，每个子网对应一个拥有十几名用户的办公室。如果其中一个办公室的用户开始执行某些非常耗带宽的任务，此操作可能会降低另一个办公室用户的网络性能。你可以使用\
  \ `tc` 来提供部分解决方案，通过为每个子网保证特定数量的带宽。\n\n### 注意\n\n![NOTE](img/note.gif)\n\n必须记住，<acronym\
  \ class=\"acronym\">TCP</acronym>/<acronym class=\"acronym\">IP</acronym> 路由器（或\
  \ <acronym class=\"acronym\">TCP</acronym>/<acronym class=\"acronym\">IP</acronym>\
  \ 网络上的任何计算机）只能控制其*出口*流量。因此，`tc` 只能调整出口带宽。这在路由器上是有效的，因为当发送端看到你的路由器饱和时，它会减慢 <acronym\
  \ class=\"acronym\">TCP</acronym> 数据包的传输，即使这种饱和是通过 QoS 策略创建的。（不过，这对 UDP 数据包无效。）\n\
  \n`tc` 的基本语法如下：\n\n```\ntc [options] object command\n```\n\n每个参数都有某些可能的值：\n\n* \
  \  `options`—。这可以是 `-statistics`（或 `-s`）、`-details`（或 `-d`）或 `-raw`（或 `-r`）。\n*\
  \   `object`—。这可以是 `qdisc`、`class` 或 `filter`。`qdisc` 设置*队列规则*（queueing discipline）——一种特定的规则。`class`\
  \ 定义一组符合特定类别的数据包（例如两个办公室中的一个）。`filter` 将这些结合在一起以生成过滤规则。\n*   `command`—。`command`\
  \ 是一组参数，精确定义了 `tc` 对 `object` 执行什么操作。`command` 中的内容非常多样且取决于特定的 `object`。\n\n使用 `tc`\
  \ 时，你通过它生成一系列规则，这些规则共同定义计算机连接的网络以及可用带宽如何在这些网络之间分配。例如，假设你想在两个办公室之间对 100Mbps 的出口带宽进行\
  \ 50/50 的拆分。整个互联网位于 `eth0` 上，两个办公室都在 `eth1` 上，尽管一个使用 192.168.1.0/24 <acronym class=\"\
  acronym\">IP</acronym> 地址子网，另一个使用 192.168.2.0/24。要开始此过程，使用 `tc` 在 `eth1` 上初始化一个队列规则：\n\
  \n```\n# tc qdisc add dev eth1 root handle 10: cbq bandwidth 100Mbit \\\n  avpkt\
  \ 1000\n```\n\n此命令可以拆分为几部分：\n\n*   `add dev eth1`—。这告诉系统你正在为 `eth1` 添加一个队列规则。\n\
  *   `root`—。某些规则排列在从“根”分支出去的虚拟树中。此参数告诉 `tc` 你正在为该树创建一个新的根。\n*   `handle 10:`—。此参数为该规则定义了一个标签（`handle`）。\n\
  *   `cbq`—。你必须告诉系统使用哪种队列方法。基于类的队列（<acronym class=\"acronym\">CBQ</acronym>）方法是一种常用方法。此项应对应于\
  \ QoS 和/或公平队列内核配置菜单中特定选项名称。\n*   `bandwidth 100Mbit`—。你必须告诉系统网络上可用的带宽。对于具有不同分离端口带宽的路由器，这通常将是较小的带宽值；你不会希望过度调度实际可用的带宽。\n\
  *   `avpkt 1000`—。网络数据包的大小不一，但为了调度带宽使用，系统必须对平均数据包大小有一个大致概念。一千是一个合理的初始猜测，但在特定的网络上它可能会更高或更低。\n\
  \n现在是时候为整个网络以及你想要保证带宽的每个子网定义类（classes）了。你可以使用如下命令来操作：\n\n```\n# tc class add dev\
  \ eth1 parent 10:0 classid 10:1 cbq \\\n  bandwidth 100Mbit rate 100Mbit allot 1514\
  \ weight 10Mbit \\\n  prio 8 maxburst 20 avpkt 1000\n```\n\n此命令与上一个非常相似，但它设置了一个定义两个子网之一的类。注意，它设置该类使用整个\
  \ 100Mbps 可用带宽，因为这个特定的类对应于根；后续命令会细分此带宽。与之前的 `tc` 命令相比，此命令有一些额外的参数和其他区别：\n\n*   `class`—。此命令使用\
  \ `class` 而不是 `qdisc` 来定义定义类。\n*   `parent 10:0`—。你通过此参数指定父节点——树的根。注意你在上一个命令指定的\
  \ handle 后添加了 `0`。\n*   `classid 10:1`—。这是该特定类的标识符。\n*   `allot 1514`—。这是网络的 <acronym\
  \ class=\"acronym\">MTU</acronym> 值（加上几字节开销）。\n*   `weight 1Mbit`—。这是一个调节参数，可能需要根据你的网络进行调整。\n\
  *   `prio 8`—。这是一个优先级数字。数字越高，该规则获得的优先级越高。\n\n各个子网的规则看起来与上一个非常相似：\n\n```\n# tc class\
  \ add dev eth1 parent 10:1 classid 10:100 cbq \\\n  bandwidth 100Mbit rate 50Mbit\
  \ allot 1514 weight 5Mbit \\\n  prio 5 maxburst 20 avpkt 1000 bounded\n# tc class\
  \ add dev eth1 parent 10:1 classid 10:200 cbq \\\n  bandwidth 100Mbit rate 50Mbit\
  \ allot 1514 weight 5Mbit \\\n  prio 5 maxburst 20 avpkt 1000 bounded\n```\n\n这些命令几乎完全相同；区别仅在于\
  \ `classid` 设置。它们都引用根类作为父类，并且都设置了 50Mbps 的带宽配额。（如果你喜欢，可以创建一个非对称的分配——例如，60Mbps 和\
  \ 40Mbps。）`bounded` 选项告诉 Linux 在任何情况下都不给网络类提供超过分配额的带宽。这通常是低效的，因为如果一个办公室没有使用其全部配额，另一个办公室就无法使用未使用的部分。省略\
  \ `bounded` 选项让 Linux 具有灵活性，当另一个办公室没有使用带宽时允许一个办公室“借用”带宽，而在两者都想要带宽时强制执行 50/50 的 Split。\n\
  \n现在需要将队列规则与两个类中的每一个关联：\n\n```\n# tc qdisc add dev eth1 parent 10:100 sfq 1514b\
  \ \\\n  perturb 15\n# tc qdisc add dev eth1 parent 10:200 sfq 1514b \\\n  perturb\
  \ 15\n```\n\n这些命令类似于原始的队列规则分配。它们告诉 Linux 使用随机公平队列（<acronym class=\"acronym\">SFQ</acronym>）规则来调度每个办公室子网*内部*的流量。<acronym\
  \ class=\"acronym\">SFQ</acronym> 因此目的很流行，因为它需要的 CPU 功率很少，但如果需要也可以其他规则。\n\n到目前为止的命令尚未提供内核区分来自两个办公室（192.168.1.0/24\
  \ 和 192.168.2.0/24）流量的方法。最后两个命令实现了这一目标：\n\n```\n# tc filter add dev eth1 parent\
  \ 10:0 protocol ip prio 100 u32 \\\n  match ip dst 192.168.1.0/24 flowid 10:100\n\
  # tc filter add dev eth1 parent 10:0 protocol ip prio 100 u32 \\\n  match ip dst\
  \ 192.168.2.0/24 flowid 10:200\n```\n\n这些命令与之前的命令相似，但它们设置了过滤规则，将目标指向（`dst`）这两个网络中的流量移动到相应的类。每个规则都被赋予相同的优先级，并使用\
  \ `u32` 算法进行匹配，该算法作用于 <acronym class=\"acronym\">IP</acronym> 地址块。\n\n\n\n\n\n前面的规则控制了数据从互联网到本地系统的流向。为了完整性，你必须创建一组类似的规则来控制相反方向的数据传递。这些规则将与之前的规则相似，但它们将引用\
  \ `eth0`（外部接口）而不是 `eth1`（内部接口），并且最后两个 `filter` 命令将使用 `src` 而不是 `dst`，表示它们控制的是源自本地源而非目的地的流量。\n\
  \n# 使用路由协议\n\n路由器必须决定如何重定向流量。例如，从路由器到数据包目的地可能存在两条路径。你可以使用 `iproute2` 中的 `ip` 程序等工具来确定要使用哪条路由，但一旦配置了该路由，它就固定了，除非再次运行\
  \ `ip` 来进行更改，否则无法改变。这对于简单的配置来说可能足够，但在某些情况下，你希望路由器能够动态更新其路由表以应对变化的网络状况，例如链路断开或可用（可能距离你的系统很远）。你可能还希望能够告诉与你通信的路由器关于你自己网络的变化，例如你的网络上出现了一块新的\
  \ IP 地址。为了满足这些需求，存在多种路由协议。Linux 在专门的服务器中实现了这些协议，这些服务器与其他路由器通信，以交换路由可用性和成本的信息。本节将介绍这些协议，从一些背景信息开始，然后介绍三个特定的协议。\n\
  \n## 理解路由协议\n\n根结底，路由是关于如何处理特定数据包。（从技术上讲，`routing` 指路由表，而 `forwarding` 指对数据包的实际处理。）本章之前的章节描述了如何配置\
  \ Linux 路由器以根据数据包的地址、内容等方式处理数据包。路由协议允许你在等式中增加一个组件：外部网络环境。这包括关于特定网络可用性以及到达这些主机的 `cost`\
  \ 的信息。在这种背景下，成本并不直接指金钱；它通常是主机之间网络跳数的衡量标准，或其他网络性能的衡量标准。当路由器有两个通往其他地方的网络连接时，到达特定网络的成本可能会随路径而异。例如，考虑图\
  \ 24.1，它展示了大学里一个由五个网络组成的简单互联网。每个部门的网络都有自己的路由器，这些路由器中的每一个直接连接到另外两个路由器，并连接到其本地网络。\n\
  \n![路由协议允许路由器交换信息，从而确定两点之间的最短路径。](img/24fig01.gif)\n\n**图 24.1. 路由协议允许路由器交换信息，从而确定两点之间的最短路径。**\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n此描述使用了一个简单的私有网络（小写 *i*）作为示例，但相同的原理也适用于互联网（大写\
  \ *I*）。\n\n该互联网上的每次跳跃都会增加在网络间发送的数据包的延迟。例如，从英语系网络发送数据包到物理系网络需要通过至少三个路由器。不过，在英语系和物理系之间有两条路径——一条使用心理学系路由器作为中继，另一条则使用工程系和历史系的路由器。第二条（逆时针方向）路径较长。理想情况下，你希望有一种方法告诉英语系路由器这两条路径。这样，如果心理学系路由器故障，网络流量仍然可以通过效率较低的路由到达目的地。\n\
  \n解决方案的一部分是指定网络成本。你可以通过使用 `route` 命令在标准的 Linux 路由表中查看这些。例如，图 24.2 显示了该命令在一个工作站上的输出。（路由器的路由表会更大大，但基本格式是相同的。）特别注意\
  \ `Metric` 列。它显示了发送到 127.0.0.0/8（本地主机）和 192.168.1.0/24（本地网络）地址的数据包所涉及路由器数量为 0，但其他所有内容都需要至少一跳。不过，这是一个极其简单的例子。在图\
  \ 24.1 中的任何路由器的路由表中，通往特定部门网络可能存在多条路径，它们的 `Metric` 值不同。遗憾的是，标准的 Linux 系统会忽略 Metric\
  \ 信息；你需要使用本章描述的此类路由协议来使用这些信息。\n\n![路由表的 Metric 值指定了使用特定路由的成本。](img/24fig02.gif)\n\
  \n**图 24.2. 路由表的 `Metric` 值指定了使用特定路由的成本。**\n\n路由协议通过允许路由器交换路由信息（包括 Metric 信息）来工作。在图\
  \ 24.1 的网络中，如果所有路由器都使用路由协议，它们将学习彼此的路由并能够构建准确成本成本路由。如果一个路由器宕机，这些信息可以在互联网中传播，即使是远程路由器也能重定向流量以避免故障。\n\
  \n路由协议使用两种算法类型之一，这决定了它们运行的一些关键方面：\n\n*   **距离矢量算法 (Distance vector algorithms)**：这些算法跟踪路由器与给定目标之间的路由器数量。在将数据包引导目标网络时，选择中间路由器数量最少的路径。`路由信息协议\
  \ (RIP)` 是使用这种方法的协议之一。\n*   **链路状态算法 (Link state algorithms)**：这些算法为每个网络链路分配成本，单个路由器选择成本最低的路由来到达目的地。成本不需要精确对应于器的数量，如果一个路由器比另一个更快或更受青，这非常有用。使用这种方法的协议之一是\
  \ `开放最短路径优先 (OSPF)` 协议。\n\n## 使用 `routed`\n\n`RIP` 是 UNIX 系统上最传统的路由协议。在 Linux 中，它通常由名为\
  \ `routed` 的包实现，该包提供同名的守护进程。`RIP` 的工作原理是允许路由器交换 `RIP` 更新包，这些数据包包含了网络目标地址（如 172.22.0.0）和\
  \ Metric（发送数据包的路由器与目标网络之间的路由器数量）。Metric 的范围从 0 到 15；任何超过 15 跳的路由都会从系统的路由表中删除。`RIP`\
  \ 是一种距离矢量协议，其路由指标相当粗略。`RIP` 最常用于中小型互联网；它在互联网骨干网上并不常用。\n\n\n\n\n当路由器接收到更新包时，路由器可以对这些信息进行多种操作。具体而言，路由器可以为目标添加路由，替换现有的度量（metric）较高的路由，或者如果新路由的度量加\
  \ 1 大于 15，则删除该路由。\n\n在 Linux 中使用 `routed` 相对简单：你只需要像第 4 章 中描述的那样启动 `routed` 程序。该服务器依赖于名为\
  \ `/etc/gateways` 的配置文件，该文件包含启动路由信息的列表。该文件中的一个示例行如下：\n\n```\nnet 0.0.0.0 gateway\
  \ 172.22.7.1 metric 1 active\n```\n\n该信息的格式非常直观。此示例定义了一个默认路由（`net 0.0.0.0`，匹配所有项），它使用\
  \ `172.22.7.1` 路由器（网关），度量为 `1`。最后一个选项（`active`）表示 RIP 可能会更新此路由。如果你想在路由表中永久保留一条路由，可以将\
  \ `active` 替换为 `passive`。默认的 `/etc/gateways` 文件通常足够使用。运行 `routed` 的计算机将通过广播查询找到其他\
  \ RIP 路由器，然后与它们通信以更新其配置。\n\n## 使用 GateD\n\n尽管 RIP 是传统的 UNIX 路由协议，但它并非没有局限。其中之一是\
  \ 15 跳限制，这限制了 RIP 能够服务的网络规模。另一个问题是该协议存在收敛（convergence）速度缓慢的问题，收敛是确定稳定路由表的过程。取决于你的网络拓扑，重要的更改可能需要几分钟才能传播到整个网络。最后，RIP\
  \ 不提供网络位掩码信息；因此，它只能为落在传统 A 类、B 类或 C 类地址块的网络提供路由信息。如果你的网络使用了（例如）传统 C 类地址块的一部分，但如果它被划分为更小的块，RIP\
  \ 传播这些地址的方式就像它们是 C 类地址一样，这在需要连接到同一 C 类地址空间内但实际上位于不同网络上的另一个系统时可能会导致问题。\n\nRIP 第 2\
  \ 版本 (RIPv2) 协议解决了 RIP 缺乏网络位掩码的问题。RIPv2 使用原始 RIP 数据结构中未使用的字段，为 RIP 协议添加了网络位掩码字段。然而，这些和其他变化足够大，以至于大多数实现为\
  \ RIPv2 使用新的守护进程。其中一个服务器就是 GateD ([`www.gated.net`](http://www.gated.net))。该程序通过其配置文件\
  \ `/etc/gated.conf` 以及通常随 GateD 提供的 `gdc` 工具进行控制。如果你使用 `gdc` 重新配置 GateD，`gdc` 会自动修改\
  \ `/etc/gated.conf` 文件。与 `routed` 类似，GateD 通常不需要或很少配置特定的路由信息；相反，它通过所有可用网络端口上的广播与其他\
  \ RIP 和 RIPv2 系统通信，以调整当前系统的路由表。与 `routed` 类似，GateD 其他守护进程一样启动（通常通过 SysV 或本地启动脚本）。\n\
  \n除了处理 RIP 和 RIPv2 外，GateD 还可以处理 OSPF 路由协议。其他工具如 Zebra 也支持多种协议。\n\n## 使用 Zebra\n\
  \nLinux 的第三种路由工具是 GNU Zebra ([`www.zebra.org`](http://www.zebra.org))。Zebra 实际上是支持多种路由协议的多个守护进程集合：\n\
  \n-   **RIP**: Zebra 支持传统的 RIP、较新的 RIPv2 以及名为 RIPng 的 IPv6 版本 RIP。`ripd` 服务器处理前两种，`ripngd`\
  \ 处理 RIPng。\n-   **OSPF**: Zebra 在其 `ospfd` 服务器中包含了 OSPF 支持，并在 `ospf6d` 中包含了 IPv6\
  \ 变体。OSPF 与 RIP 一样，常用于本地局域网。\n-   **BGP**: `边界网关协议 (BGP)` 通常由互联网上的路由器使用，Zebra 通过\
  \ `bgpd` 服务器支持它。\n-   **Zebra**: `zebra` 程序文件作为整个 Zebra 套件的控制程序，其他 Zebra 服务器使用它来更新内核路由表。它作为一个服务器运行，你可以使用普通的\
  \ Telnet 程序连接到它，稍后会进行描述。\n\n你可以像第 4 章 中描述的那样独立地启动每个路由守护进程。例如，如果你想使用 RIP 或 RIPv2，可以启动\
  \ `zebra` 和 `ripd`，但如果不需要，则不启动其他的。这些服务器中的每个都使用自己的配置文件，通常出现在 `/etc` 或 `/etc/zebra`\
  \ 中，并以相应的守护进程命名。例如，`/etc/zebra/ospfd.conf` 控制 `ospfd`。这些文件都具有某些共同元素。它们都使用感叹号（`!`）或井号（`#`）作为注释字符，并支持以下选项：\n\
  \n-   `hostname`: 设置路由器主机名，例如 `hostname gw` 将主机名设置为 `gw`。\n-   `password`: `zebra`\
  \ 守护进程本身使用密码控制来自其他系统或服务器的访问，因此必须在每个配置文件设置密码。此密码授予有限访问权限。\n-   `enable password`:\
  \ 主 `zebra` 服务器支持通过此选项设置的特殊管理员密码。在更改服务器配置之前必须输入此密码。\n-   `router protocol`: 大多数特定协议的配置文件要求指定正在使用的路由协议。在\
  \ `ripd.conf` 中，该行名为 `router rip`；对于 `ospfd.conf`，是 `router ospf`；对于 `bgpd.conf`，是\
  \ `router bgp as-number`，其中 `as-number` 是你的路由器的自治系统（AS）数字。（如果你仅在本地网络上使用 BGP，可以像分配\
  \ IP 地址一样使用数字 64512 到 65535 之间的 AS 数字。）\n\n一旦 Zebra 运行，你可以通过 Telnet 工具访问路由器系统上的\
  \ 2601 端口来进一步配置它。例如：\n\n```\n$ telnet localhost 2601\n```\n\n输入密码后，你可以输入配置命令，如 `enable`（获取配置命令权限）、`configure`（更改配置）或\
  \ `show`（显示配置信息）。在任何任何阶段，你都可以输入单个问号（`?`）来获取可用命令或选项的帮助。如果你熟悉 Cisco 路由器，你会发现 Zebra\
  \ 的命令很熟悉，因为它们的设计初衷就是兼容。\n\n# 摘要\n\n\n\n所有联网计算机，即使是工作站，也都需要路由表，以便将网络流量引导到适当的位置。标准的\
  \ Linux 网络工具，如 `ifconfig` 和 `route`，对于在工作站、典型服务器甚至低端路由器上设置路由表来说已经足够了。然而，更高级的路由器需要更复杂的工具。Linux\
  \ 以多种形式提供了这些工具。由于 Linux 内核最终负责路由，某些路由配置工具需要激活特定的内核路由选项才能运行，因此你应该检查你的内核配置，以确保它包含了你所需的工具。`iproute2`\
  \ 软件包是一个流行的选择，它提供了多个高级路由选项，包括操作多个路由表或设置 QoS 方案以为某些用户或网络保证特定数量的带宽。各种路由协议及其相关的 Linux\
  \ 服务器为路由器之间的通信提供了灵活性，允许它们相互通信，并在其所路由的网络上传输数据，以便让路由器确定通往任何给定网络的最佳路径。\n\n# 第 25 章.\
  \ 配置 `iptables`\n\nLinux 内核中 TCP/IP 栈的作用是从应用程序接收数据、将其封装并发送到网络端口；以及从网络接收数据、将其解包并传递给应用程序。理论上，内核不应更改或调整数据，除非是\
  \ TCP/IP 协议允许的极特殊方式。然而，一个非常有用的路由和安全工具违反了这一理论理想。`iptables` 工具配置 Linux 内核根据各种标准（如数据包的源和目的地址）来过滤甚至修改数据包。这使得\
  \ `iptables` 成为某些网络工具的标准工具，最重要的是包过滤防火墙和网络地址转换 (NAT)。本章涵盖了这两个主题以及两个辅助主题：端口重定向和 `iptables`\
  \ 日志。所有这些工具都可以用于帮助保护网络，或者有时仅保护某台计算机。\n\n本章对 `iptables` 的介绍足以帮助你实现一些最常见的防火墙或其他数据包过滤工具。但是，如果你想建立一个特别复杂的防火墙，你可能需要咨询其他资源。Ziegler\
  \ 的 *Linux Firewalls, 2nd Edition* (New Riders, 2001) 以及 Sonnenreich 和 Yates 的 *Building\
  \ Linux and Open BSD Firewalls* (Wiley, 2000) 都是非常有用的资源，尽管后者涵盖的是 `iptables` 前身工具\
  \ `ipchains`，而不是 `iptables`。\n\n# 什么是 `iptables`？\n\n尽管细节对大多数网络工具隐藏的，但 `2.4.*x`\
  \ Linux 内核使用类似于图 25.1 所示的过程来处理网络包。在过程的早期，会做出路由决策：数据包的目标是本地计算机吗，还是应该转发到另一台计算机？根据该问题的答案，数据包被传递到两条链之一：`INPUT`\
  \ 链或 `FORWARD` 链。这些链中的每一个都可以以各种方式处理或修改传入的数据，但默认是不修改数据。`INPUT` 链最终指向图 25.1 所指的“本地进程”。这些进程可能是网络客户端（Netscape、`telnet`\
  \ 等）或网络服务器（Apache、telnetd 等）。在大多数情况下，这些进程运行在用户空间，但它们也可能是基于内核的，例如内核的网络文件系统 (NFS)\
  \ 支持或 kHTTPd Web 服务器。本地进程和 `FORWARD` 链最终指向 `OUTPUT` 链，该链也可以在本章描述的方式操作数据包。\n\n![Linux\
  \ 网络系统提供了若干可以对数据包操作的链。](img/25fig01.gif)\n\n**图 25.1. Linux 网络系统提供了若干可以对数据包操作的链。**\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n数据包可能不会在图 25.1 中形成完整的回路。某些链规则可能会阻塞数据包，或者本地进程可能会决定不对数据包做出响应。另一种情况是事务可能源于本地进程，在这种情况下，响应将作为传入数据返回。\n\
  \n图 25.1 所示的每条链都提供了操作数据包的机会。链可以根据源或目的 IP 地址、源或目的端口，或涉及事务的网络接口等特征过滤数据包。每条链都是规则的集合，每条规则都会依次与输入数据包进行匹配。如果规则匹配，该规则将通过指定规则的目标（target）来指示内核应该如何处理该数据包。预定义的目标包括\
  \ `ACCEPT`（接受数据包进行后续处理）、`DROP`（忽略数据包）、`QUEUE`（将数据包传递给用户空间程序）和 `RETURN`（停止处理该链并返回调用当前链的链）。某些需要激活特定内核选项的额外目标包括\
  \ `REJECT`（拒绝数据包，告诉发送者其已被拒绝）、`MASQUERADE`（用于 NAT，如后文节“使用 iptables 配置 NAT”所示）以及 `LOG`（用于记录数据包过滤信息）。\n\
  \n链被组织成表（tables）。图 25.1 所示的三条链构成了 `filter` 表，它负责处理大多数标准流量。另外两个标准表是 `nat`（用于 NAT，如后文节“使用\
  \ iptables 配置 NAT”所示）和 `mangle`（用于专门的数据包修改）。可以在表中放置新链，并从现有链中调用这些新链。你可能会这样做来创建特殊且复杂的处理模式，以过滤或更改数据。\n\
  \n\n\n\n\n你通过 `iptables` 所所的更改都是瞬时的；一旦重启电脑，这些更改就会消失。因此，你应该创建一个脚本来设置你的 `iptables`\
  \ 规则。某些发行版（如 Red Hat 和 Mandrake）包含了帮助你构建防火墙或 NAT 规则的工具。你可以自己实现这样的脚本，并将其作为 SysV 或本地启动脚本调用。\n\
  \n## 备用过滤工具\n\n`iptables` 程序是为配合 2.4.*x* Linux 内核而设计的。然而，早期的内核使用了不同的工具。具体来说，2.2.*x*\
  \ 内核使用一种名为 `ipchains` 的工具，而 2.0.*x* 内核则使用 `ipfwadm`。防火墙工具和 NAT 工具的变化反映了内核网络结构的变化。最新的\
  \ `iptables` 工具可以实现 2.4.*x* 内核中某些 2.2.*x* 内核中不存在的功能，例如*状态数据包检测*（stateful packet\
  \ inspection），在该功能中，数据包可以基于另一台计算机的整个多数据包事务进行跟踪，而不是作为孤立的实体。状态数据包检测极大地增强了防火墙保护其服务的计算机的能力。\n\
  \n如果你正在使用 2.4.*x* 之前的内核，你可以继续配合旧工具使用它。这些旧工具实现了类似的原理，但许多细节有所不同。本章不涵盖 `ipchains` 或\
  \ `ipfwadm` 的语法或功能，因此如果你想使用它们，将必须查找适当的文档。如果未来的内核需要比 `iptables` 更加复杂的工具，你可能需要找到这些未来工具的文档。不过，很大率情况下，这些工具操作的大致轮廓将与\
  \ `iptables` 相似，因此对 `iptables` 的知识对你来说完全没用。\n\n如果你可以访问使用 `ipfwadm` 或 `ipchains`\
  \ 构建的防火墙规则集，你可以在 2.4.*x* 内核上继续使用它，但必须包含对旧工具的适当内核支持。在 2.4.*x* 内核上使用此类防火墙规则集与在 2.0.*x*\
  \ 或 2.2.*x* 内核上使用相比没有缺点，但如果你为 `iptables` 重写规则，你可能可以使用更强大的功能。\n\n在某种程度上，`iptables`\
  \ 的功能与 TCP Wrappers、`xinetd` 以及服务器特定的访问控制选项重叠。所有这些工具都允许你根据客户端的 IP 地址限制对服务器的访问，例如。作为一个一般规则，当多个工具可用时，我建议使用两个或多个工具，这样其中一个工具的错误或配置错误可以通过另一个工具来纠正。与其他工具相比，`iptables`\
  \ 工作在更低的层次，支持更多的协议和服务器。例如，`xinetd` 只能保护由 `xinetd` 启动的服务器，而 `iptables` 可以保护所有服务器。\n\
  \n## iptables 的内核配置\n\n在使用 `iptables` 之前，你必须将对它的支持构建到 Linux 内核中。此外，某些 `iptables`\
  \ 功能只有在你激活了适当的 `iptables` 内核子选项时才有用。所有这些内核功能都可以在 2.4.*x* 内核配置树的 Networking Options\
  \ 菜单中，或者在 Networking Options 菜单的子菜单中找到。你应该检查的功能包括：\n\n*   **网络数据包过滤 (Network Packet\
  \ Filtering)**：Network Packet Filtering 选项位于主 Networking Options 配置菜单中。\n*   **连接跟踪\
  \ (Connection Tracking)**：该选项位于 Networking Options 菜单下的 Netfilter Configuration\
  \ 菜单中。它是 NAT 所必需的。（所有后续选项都在同一个 Netfilter Configuration 菜单中。）\n*   **FTP 协议支持 (FTP\
  \ Protocol Support)**：FTP 对于 NAT 来说是一个棘手的协议。在 Linux 中，NAT 对 FTP 支持需要此特殊的内核模块。\n\
  *   **IP Tables 支持 (IP Tables Support)**：该选项是另一个 NAT 所必需的。当你选择此项时，会出现大量的子选项，对应你可能想要进行的各种测试。为了获得最大的灵活性，请选择这些子选项。其中，Connection\
  \ State Match 选项特别值得注意，因为它是状态数据包检测所必需的。\n*   **数据包过滤 (Packet Filtering)**：虽然防火墙并非绝对需要，但该选项扩展了你的功能范围。我建议启用它。\n\
  *   **REJECT Target 支持 (REJECT Target Support)**：Packet Filtering 的子选项有助于创建防火墙。建议启用它。\n\
  *   **全 NAT (Full NAT)**：该选项对于许多 NAT 功能是必需的，包括本章描述的功能。\n*   **MASQUERADE Target\
  \ 支持 (MASQUERADE Target Support)**：Full NAT 的子选项对于 IP 伪装是必需的——即后续章节描述的 NAT 。注意，该项目的帮助信息暗示只有在使用动态\
  \ IP 地址时才需要，这是错误的；无论你的外部 IP 地址是否为动态，它都是必需的。\n*   **数据包标记 (Packet Mangling)**：如果你想使用前面提到的\
  \ `mangle` 表，此内核功能是必需的。我建议启用它。\n*   **LOG Target 支持 (LOG Target Support)**：如果你想记录防火墙或路由器活动，此选项允许你这样做。\n\
  *   **ipchains (2.2 版本) 支持 (ipchains 2.2-style Support)**：如果你想使用基于 `ipchains` 的旧防火墙脚本，你需要激活此选项。你还需要\
  \ `ipchains` 工具本身。\n*   **ipfwadm (2.0 版本) 支持 (ipfwadm 2.0-style Support)**：如果你想使用基于\
  \ `ipfwadm` 的旧防火墙脚本，你需要激活此选项。你还需要 `ipfwadm` 工具本身。\n\n### 提示\n\nipchains 和 ipfwadm\
  \ 的支持选项是互斥斥的，并且都与 IP Tables Support 和 Connection Tracking 选项不兼容。因此，你不能在同一个内核中编译\
  \ `iptables` 和早期工具的支持。然而，你可以将所有这些工具编译为模块，并通过加载适当的内核模块来选择使用哪一个。如果你当前有一个旧工具并在时间允许的情况下迁移到新的\
  \ `iptables`，你可能需要这种方式编译内核。许多发行版的默认内核就是这样提供的。\n\n## 检查你的 iptables 配置\n\n\n\n\n\n\
  在继续之前，你应当检查当前的当前的配置。某些发行版现在附带了防火墙创建工具，这些工具可能在你不知情的情况下正在运行。你可以通过向 `iptables` 传递 `-L`\
  \ 参数来检查系统当前的配置。你还可以添加 `-t` `table-name` 参数来检查特定的表。（默认的 `table-name` 是 `filter`，但你可能也想检查\
  \ `nat` 和 `mangle` 表。）这应该会产生类似于下方的输出：\n\n```\n # iptables -L -t filter\nChain INPUT\
  \ (policy ACCEPT)\ntarget     prot opt source               destination\n\nChain\
  \ FORWARD (policy ACCEPT)\ntarget     prot opt source               destination\n\
  \nChain OUTPUT (policy ACCEPT)\ntarget     prot opt source               destination\n\
  ```\n\n此输出显示标准 `filter` 表中没有 `iptables` 规则。这是进一步修改的良好起点。如果你的系统已经定义了防火墙规则，你应该尝试找到是哪个脚本定义了这些规则并将其禁用。（这可能是一个名为\
  \ `firewall` 或类似命名称的 SysV 启动脚本。）然后你可以使用 `-F` 参数清除链中的规则，如下所示：\n\n```\n # iptables\
  \ -F INPUT -t filter\n```\n\n通常情况下，在防火墙脚本开头使用此命令，对于 `filter` 表中的其他链使用类似的命令，可能还有其他表的等效命令。这确保了你的新防火墙规则不会被添加到旧规则中，否则可能会导致巨大的混乱。\n\
  \n# 使用 `iptables` 配置防火墙\n\n本章描述的第一个 `iptables` 应用是数据包过滤防火墙配置。你可以在路由器或非路由器系统（工作站或服务器）上使用这些选项。当路由器这样配置时，它通常被称为防火墙计算机，但存在其他类型的防火墙。配置数据包过滤防火墙需要设置默认策略，然后根据端口号、IP\
  \ 地址或其他标准对该策略配置例外。\n\n## 什么是防火墙？\n\n传统上，防火墙是位于两个网络之间的计算机，用于控制这两个网络之间的访问。这一功能与路由器相似，但存在几处潜在的差异。其，没有防火墙功能的路由器并不以防火墙的方式控制访问；防火墙可以阻止一个网络上的计算机访问另一个网络上的特定服务。例如，防火墙可以阻止从互联网到受保护内部网络的\
  \ Telnet 访问。此外，某些类型的防火墙不像路由器那样转发数据包；这些代理服务器防火墙运行特殊的代理服务器软件，该软件部分处理旨在发送其他系统的请求，将请求重新伪装成来自自身，并将回复发送回原始系统。代理服务器防火墙可以帮助防御相当高层的威胁，例如嵌入在\
  \ Java 或 JavaScript 中的病毒。\n\n本节专注于另一种类型的防火墙：数据包过滤防火墙。它们运行在 TCP/IP 堆栈的较低层级，受限于检查单个数据包中的各种类型地址信息，或至多跟踪事务以确保其不被劫持。尽管数据包过滤防火墙通常作为路由器的一部分实现，但它们也可以在工作站或服务器上设置。在这样配置时，防火墙的作用是保护运行它的计算机，但对其他计算机没有影响。\n\
  \n大多数人认为防火墙是为了保护本地网络免受互联网的侵害，如图 25.2。确实，这是防火墙的功能之一，而且是一个非常重要的功能。不过，防火墙还可以防止本地用户攻击互联网上的其他系统。你可能使用防火墙阻止所有未经批准的本地协议，甚至可能限制某些协议仅来自特定的计算机。例如，你可能只允许邮件服务器连接到外部计算机的\
  \ 25 端口。（服务提供商 ISP 有时使用这种配置作为反垃圾邮件措施。）出站控制既可以防止访问你本地网络的不可信个人，也可以防止在你不知情的情况下安装在本地计算机上的病毒、蠕虫、木洛马等等。这种保护最直接地帮助了其他网络，但最终对你来说也很重要，因为阻止来自你自己网络的敌对行为可以防止你的网络成为\
  \ ISP 调查的目标。\n\n## 设置防火墙的默认策略\n\n防火墙配置的第一步是设置*默认策略*。这是关于防火墙应如何处理不匹配其他规则的数据包的声明。你通过\
  \ `iptables` 的 `-P` 选项设置默认策略，如下：\n\n```\n # iptables -P INPUT DROP\n# iptables -P\
  \ OUTPUT DROP\n# iptables -P FORWARD DROP\n```\n\n\n\n\n此示例在 `filter` 表的三个标准链中分别设置了默认策略。默认策略可以是任何防火墙目标，如前所述（`ACCEPT`、`DROP`、`QUEUE`、`RETURN`\
  \ 或通过适当内核选项启其他策略）。最常见的默认策略是 `ACCEPT`、`DROP` 和 `REJECT`。第一个是默认策略，它告诉 Linux 通过所有数据包。`DROP`\
  \ 告诉系统忽略所有数据包；就像它们不存在一样。`REJECT` 类似于 `DROP`，但它不是忽略数据包，而是 Linux 调用系统它无法接受该数据包；这类似于\
  \ Linux 在没有进程使用端口时的响应方式。最安全的防火墙配置使用 `DROP` 或 `REJECT` 作为默认策略，因为这意味着任何在后续步骤中你没有显式允许的包包类型都会被拦截。如果你使用\
  \ `ACCEPT` 作为默认策略，你必须记住显式禁止所有你不希望让通过的数据包类型。这可能是一个乏味的过程，而且很容易遗漏某些内容。相比之下，使用 `DROP`\
  \ 或 `REJECT` 作为默认策略，你只需要显式允许某些协议类型。大多数计算机甚至网络只使用少数协议，因此这通常是一个更易管理的任务。\n\n## 创建防火墙规则\n\
  \n你通过使用 `iptables` 的 `--append` 选项创建防火墙规则（`-A` 是更短的同义词）。在该命令之后是一个或多个标准规范以及 `--jump`\
  \ 选项（`-j` 是更短的同义词），它指定了一个防火墙目标，如 `ACCEPT`、`DROP` 或 `REJECT`。总之，命令看起来如下：\n\n```\n\
  \ # iptables --append CHAIN selection-criteria --jump TARGET\n```\n\n可以使用简写选项名称来缩短它：\n\
  \n```\n # iptables -A CHAIN selection-criteria -j TARGET\n```\n\n你还可以使用其他选项代替 `--append`：\n\
  \n*   `--delete` 或 `-D` — 此选项从现有链中删除规则。\n*   `--insert` 或 `-I` — 你可以使用此选项在链的中间插入规则。你通常会在其后跟一个规则编号。如果你不跟，`iptables`\
  \ 将将规则插入到链的顶部，而不是像 `--append` 那样在底部。\n*   `--replace` 或 `-R` — 此选项替换规则。与 `--insert`\
  \ 一样，你指定一个规则编号来替换该规则。\n*   `--list` 或 `-L` — 此选项列出链中的规则。\n\n除了这些，还有其他选项；详情请参阅 `iptables`\
  \ 手页。以下章节介绍了你可以传递给 `iptables` 的 `selection-criteria` 的各种选项。你可以在一个命令中包含多个标准；例如，你可以根据端口号和\
  \ IP 地址限制访问。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n内核按顺序读取链中的规则，并对匹配数据包的第一条规则执行。因此，如果你想设置一个带有异常的规则（例如拒绝本地计算机访问\
  \ Telnet 端口），你应该先输入异常，然后是更通用的规则。在某种意义上，默认策略是位于链末尾的规则，匹配任何尚未被匹配的项。\n\n### 打开和关闭特定端口\n\
  \n过滤数据包的一种方法是使用特定的源或目的端口。例如，你可能想配置邮件服务器通过发送到其 SMTP 端口 (25) 的数据包。你可以通过使用 `--destination-port`\
  \ (`--dport`) 选项来实现。该选项还依赖于 `--protocol` (`-p`) 选项，它设置协议类型（`tcp`、`udp`、`icmp` 或代表所有内容的\
  \ `all`）。`--source-port` (`--sport`) 选项的工作方式类似，但它匹配数据包来源端口。最终命令可能如下：\n\n```\n #\
  \ iptables -A INPUT -p tcp --dport 25 -j ACCEPT\n# iptables -A OUTPUT -p tcp --sport\
  \ 25 -j ACCEPT\n```\n\n这些命令告诉内核接受其本地 `INPUT` 和 `OUTPUT` 链指向端口 25 的数据包。结果是，即使默认策略设置为阻止数据包，系统也将接受入站邮件并能够向他人发送邮件（假设邮件服务器已妥善配置）。一个关键点是，如果你将默认策略设置为\
  \ `DROP` 或 `REJECT`，你通常必须同时打开针对特定服务器端口的输入链和来自同一服务器端口的输出链。如果你没有这样做，你的服务器可能接收数据包但无法对其进行响应，或者生成数据包但无法接收它们。在另一台防火墙计算机上，你可能想在\
  \ `FORWARD` 链上创建 `--destination-port` 和 `--source-port` 规则，以允许 SMTP 传输通过防火墙。你可以按照下一节“使用源和目的\
  \ IP 地址”所述，将这些与 IP 地址规范结合，以仅允许 SMTP 传输在邮件服务器之间。\n\n如果你使用默认的 `DROP` 或 `REJECT` 策略，打开端口允许客户端程序与外部世界通信是非常关重要的。你有几种方法可以做到：\n\
  \n*   开放外部计算机上服务器端口的访问权限。这与前面的示例类似，只是 `-A INPUT` 将与 `--source-port` 配对，而 `-A OUTPUT`\
  \ 将与 `--destination-port` 配对。在配置为防火墙的路由器上，你将使用 `-A FORWARD` 设置 `--source-port` 和\
  \ `--destination-port`，可能还会配合你的网络的 IP 地址规范。你必须显式启用内部客户端所使用的每个协议的访问。\n*   你可以打开整个非特权端口范围\
  \ 1024–65535。与其使用 `--source-port` 和 `--destination-port` 指定单个端口号，不如通过用冒号分隔值来指定范围，例如\
  \ `--source-port 1024:65535`。对于入站连接，你可能想添加 `! --syn` 选项。`--syn` 选项仅匹配连接请求，而感叹号 (`!`)\
  \ 反转连接的含义，因此 `! --syn` 允许返回包但不允许连接请求。\n\n### 使用源和目的 IP 地址\n\n你可以使用 `--source` (`-s`)\
  \ 和 `--destination` (`-d`) 选项匹配源和目的 IP 地址或网络块的数据包。例如，如果你知道 172.24.0.0/16 网络块受不受欢迎因素控制，在默认的\
  \ `ALLOW` 配置中，你可以包含类似下面的选项来阻止该网络块的所有入出访问：\n\n```\n # iptables -A INPUT -s 172.24.0.0/16\
  \ -j DROP\n# iptables -A OUTPUT -d 172.24.0.0/16 -j DROP\n```\n\n这些选项通常与基于端口的连接一起使用，仅允许特定计算机访问某些端口，特别是在默认的\
  \ `DROP` 配置下。例如，假设你运行一台保护网络的防火墙计算机，但你想允许来自 10.34.176.0/24 网络的外部用户访问你内部网络的 SSH 服务器（TCP\
  \ 端口 22）。你可以使用类似下面的选项来实现：\n\n```\n # iptables -A FORWARD -s 10.34.176.0/24 -p tcp\
  \ \\\n  --destination-port 22 -j ALLOW\n# iptables -A FORWARD -d 10.34.176.0/24\
  \ -p tcp \\\n  --source-port 22 -j ALLOW\n```\n\n\n\n由于此示例仅修改了 `FORWARD` 链，它并没有让用户直接访问防火墙计算机自身的\
  \ `SSH` 服务器（如果它确实在运行的话）。你可能想要添加条目以允许你的本地计算机访问此服务器。假设你的本地网络使用 `192.168.9.0/24` 网络地址。相应的命令将如下：\n\
  \n```\n# iptables -A INPUT -s 192.168.9.0/24 -p tcp \\\n  --destination-port 22\
  \ -j ALLOW\n# iptables -A OUTPUT -d 192.168.9.0/24 -p tcp \\\n  --source-port 22\
  \ -j ALLOW\n```\n\n### 通过接口过滤\n\n另一个过滤选项是使用网络接口（例如 `ppp0` 或 `eth1`）作为标识符。此选项对于具有多个接口的路由器或其他计算机最为有用。它可以帮助防止地址\
  \ `spoofing`（地址欺骗），即远程系统试图使用本地地址联系路由器，希望路由器对本地计算机有更宽松的配置。对于 `INPUT` 和 `FORWARD`\
  \ 链，你使用 `--in-interface` (`-i`) 指定输入接口名称；对于 `FORWARD` 和 `OUTPUT` 链，你使用 `--out-interface`\
  \ (`-o`) 指定输出接口。例如，假设你的内部网络使用 `192.168.9.0/24` 网络地址空间并位于路由器的 `eth1` 上，而你的互联网连接位于\
  \ `eth0`。你可以使用如下所示通用反欺骗规则：\n\n```\n# iptables -A INPUT -s 192.168.9.0/24 -i eth0\
  \ -j DROP\n# iptables -A FORWARD -s 192.168.9.0/24 -i eth0 -j DROP\n# iptables -A\
  \ FORWARD -s !192.168.9.0/24 -i eth1 -j DROP\n# iptables -A OUTPUT -s !192.168.9.0/24\
  \ -i eth1 -j DROP\n```\n\n前两个命令保护了指向路由器和内部系统的数据免受来自外部系统（通过 `eth0`）且自称是内部系统的的数据包攻击。后两个命令防止了内部系统（通过\
  \ `eth1`）声称拥有本地网络之外的 `IP` 地址。\n\n### 执行状态检测\n\nLinux 数据包过滤防火墙功能的最新新增是状态数据包检测（stateful\
  \ packet inspection）。在本章较些时候描述的选项都作用于单个数据包。目前没有办法判断一个数据包是现有数据流的一部分，还是聪明的攻击者插入到现有数据流中的入侵者。（`--syn`\
  \ 选项允许你检查数据包是否声称正在建立新连接，但计算机可能会发送声称是现有数据流一部分的数据包。此类数据包可以被用于“劫持”现有的 `TCP` 连接。）通过状态检测，内核可以使用数据包序列号、源\
  \ `IP` 地址等来跟踪连接。如果你让它这样做，就可以让内核拒绝包含可能指示会话被劫持的错误的数据包。\n\n状态检测需要使用 `--state` 选项，并在其之前使用\
  \ `-m state` 选项以加载内核的状态检测功能。你可以向此选项传递一个或多个参数。如果你传递了多个参数，必须用逗号将它们隔开。你可以在 `--state`\
  \ 选项之前使用感叹号 (`!`) 来反转其含义。可用的参数有：\n\n* `INVALID` — 数据包无法匹配到已知连接，因此可能是伪造的。\n* `NEW`\
  \ — 数据包尝试建立新连接。\n* `ESTABLISHED` — 数据包与现有连接关联。\n* `RELATED` — 数据包不是现有连接的一部分，但与它是相关的，例如\
  \ ICMP 错误数据包。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n指定 `! --state INVALID` 等同于指定\
  \ `--state NEW,ESTABLISHED,RELATED`。\n\n你可能想向现有规则中添加状态检测。例如，假设你在服务器上设置了默认的 `DROP`\
  \ 或 `REJECT` 策略，但有一条规则允许与服务器的 `HTTP` 端口 (80) 进行进出出站连接。你可能会添加一条状态检测规则，仅允许新的、已建立的或相关的数据包通过该端口：\n\
  \n```\n# iptables -A INPUT -m state -p tcp --dport 80 \\\n  --state NEW,ESTABLISHED,RELATED\
  \ -j ACCEPT\n# iptables -A OUTPUT -m state -p tcp --sport 80 \\\n  --state ESTABLISHED,RELATED\
  \ -j ACCEPT\n```\n\n此规则仅允许新的、已建立或相关的入站连接，以及仅允许已建立或相关的出站连接。（不需要新的出站连接，因为连接总是由客户端创建的，而不是受这些规则保护端口的服务器。）这些规则防止了入侵者接管客户端现有的\
  \ Web 服务器连接。\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n状态数据包检测从 Linux 2.4.x 内核系列和\
  \ `iptables` 开始变得可用；早期的内核和数据包过滤工具不支持此功能。事实上，这是你可能想要升级旧内核或数据包过滤防火墙脚本以使用 `iptables`\
  \ 的原因之一。\n\n### 使用额外参数\n\n`iptables` 工具支持许多在数据包过滤防火墙中可能有额外选项。例如，你可以使用 `--new-chain`\
  \ (`-N`) 选项创建完全新的链，使用 `--fragment` (`-f`) 参数创建仅适用于分片数据包的第二个及后续分段的规则，或使用 `--tcp-flags`\
  \ 选项匹配特定的 `TCP` 标志。关于此类参数的更多信息，请参阅 `iptables` 手册页或关于 Linux 数据包过滤防火墙的书籍。（确保获取的标题涵盖\
  \ `iptables`；某些旧书籍仅涵盖 `ipchains`。）\n\n### 整合在一起\n\n查看整个完整的 `iptables` 数据包过滤防火墙脚本可能是很有用的。列表\
  \ 25.1 展示了这样一个脚本。该脚本为 Web 服务器计算机设计，该计算机还支持使用 `SSH` 进行本地连接配置配置。\n\n### WARNING\n\n\
  ![WARNING](img/warning.gif)\n\n大多数复杂的防火墙脚本比 列表 25.1 长得多。此脚本仅包含了该计算机运行的两个服务器的几个配置选项，以及其他一些有用规则。为了可读性，列表\
  \ 25.1](#ch25.xhtml_ch25list01 \"示例 25.1. 一个示例 iptables 防墙脚本\") 在调用 `iptables` 时没有使用完整路径，如果你的路径被修改，这将是一个潜在的安全风险。列表\
  \ 25.1](#ch25.xhtml_ch25list01 \"示例 25.1. 一个示例 iptables 防墙脚本\") 可以作为更完整脚本的核心，但最理想的情况下，你必须针对你的网络对其进行自定义和扩展。\n\
  \n**示例 25.1. 一个示例 iptables 防火墙脚本**\n\n\n\n\n```\n#!/bin/sh\n\niptables -F INPUT\n\
  iptables -F OUTPUT\niptables -F FORWARD\n\niptables -P INPUT DROP\niptables -P OUTPUT\
  \ DROP\niptables -P FORWARD DROP\n\n# Permit DNS traffic\niptables -A INPUT -p udp\
  \ --sport 53 -j ACCEPT\niptables -A OUTPUT -p udp --dport 53 -j ACCEPT\n\n# Accept\
  \ local-network return traffic for clients\niptables -A INPUT -m state -p tcp --dport\
  \ 1024:65535 \\\n  --state ESTABLISHED,RELATED -s 192.168.9.0/24 -j ACCEPT\niptables\
  \ -A OUTPUT -m state -p tcp --sport 1024:65535 \\\n  ! --state INVALID -d 192.168.9.0/24\
  \ -j ACCEPT\n\n# Accept all HTTP connections\niptables -A INPUT -m state -p tcp\
  \ --dport 80 \\\n  ! --state INVALID -j ACCEPT\niptables -A OUTPUT -m state -p tcp\
  \ --sport 80 \\\n  --state ESTABLISHED,RELATED -j ACCEPT\n\n# Accept local (192.168.9.0/24)\
  \ SSH traffic\niptables -A INPUT -m state -p tcp --dport 22 \\\n  ! --state INVALID\
  \ -s 192.168.9.0/24 -j ACCEPT\niptables -A OUTPUT -m state -p tcp --sport 22 \\\n\
  \  --state ESTABLISHED,RELATED -d 192.168.9.0/24 -j ACCEPT\n\n# Accept all local\
  \ traffic on the lo interface\niptables -A INPUT -s 127.0.0.1 -i lo -j ACCEPT\n\
  iptables -A OUTPUT -d 127.0.0.1 -o lo -j ACCEPT\n```\n\n关于列表 25.1，需要考虑的一些关键特性如下：\n\
  \n- **设置与默认策略**。前六条 `iptables` 命令会清空现有的过滤规则集，并将默认策略设置为 `DROP`。这创建了一个相当严格的安全设置，随后的命令针对所需的协议放宽了该设置。尽管此脚本目标计算机不是路由器，但该脚本在\
  \ `FORWARD` 链上设置了相同的严格默认 `DROP` 策略，以防出现其他接口（例如，由于 PPP 链路）。\n\n- **DNS 配置**。为了允许计算机访问名称服务器，`Permit\
  \ DNS traffic` 注释后的两行代码允许计算机连接到外部 DNS 服务器（UDP 端口 53）。此设置实际上相当宽松。你可能只需要访问几个服务器，因此这些命令可以扩展，以包含对\
  \ DNS 服务器 IP 地址的引用，或者可能包含这些服务器所在的本地网络。\n\n- **客户端返回流量**。`Accept local-network return\
  \ traffic for clients` 注释后的行允许服务器接收发往非特权端口（1024–65535）的返回流量。`OUTPUT` 链规范使用状态检测来拒绝无效连接，而\
  \ `INPUT` 链规范使用状态检测来拒绝所有非已建立（ESTABLISHED）和相关（RELATED）以外的流量。特别注意，`INPUT` 链不允许新建连接，因此即使计算机在非特权端口运行服务器，其他计算机也无法与之连接。`INPUT`\
  \ 和 `OUTPUT` 链项都限制了对本地网络的访问。对于更强大的防火墙，你可以将这些规则替换为更具体的规则，允许从本地非特权端口到你可能想要从该系统使用的特定协议端口的流量。\n\
  \n- **Web 服务器流量**。计算机的 Web 服务器需要接受任何地方的连接，因此连接规则没有包含任何 IP 地址规范。不过，它们使用了状态检测作为防止劫持的措施。\n\
  \n- **SSH 服务器流量**。`SSH` 配置选项与 Web 服务器类似，但它包含了 IP 地址限制，以确保只有本地用户连接到 SSH 服务器。\n\n\
  - **环回流量**。Linux 计算机使用环回接口（`lo`，关联 IP 地址 127.0.0.1）用于某些内部目的。因此，此防火墙脚本显式允许环回访问。此配置为此目的没有使用状态检测，但指定仅接受来自\
  \ `lo` 接口的 127.0.0.1 地址的流量。\n\n# 使用 `iptables` 配置 NAT\n\n如上述，数据包过滤防火墙能够根据源和目的 IP\
  \ 地址、端口号等标准交付或停止数据包的交付。这是一个非常有用的功能，但它并不是 `iptables` 能力的极限。`iptables` 的一个特别实用的功能是可以编程\
  \ Linux 内核执行网络地址转换 (NAT)。`NAT` 允许你修改 TCP/IP 数据包的某些部分，以增加网络寻的灵活性。基本的 NAT 配置相对简单，但在配置之前，你应该了解它以及你能用它做什么。\n\
  \n## 什么是 NAT？\n\n`NAT` 允许路由器修改 TCP/IP 数据包的内容。特别是，`NAT` 能够更改数据包的源地址目的地址。为什么要这样做呢？有几种可能性：\n\
  \n- **内部/外部转换**。你可能拥有一块网络地址，但由于某些原因，你可能不想在内部网络中使用这些地址。例如，你可能已经配置本地网络使用私有的 192.168.9.0/24\
  \ 网段，你可能不想重新配置所有系统使用公共地址。使用 `NAT`，你可以将外部公地址到内部私有地址进行一对一映射，允许互联网上的其他系统访问你的内部系统。\n\
  \n- **临时地址更改**。你可能在临时紧急情况下使用 `NAT` 将数据包重定向到正常系统以外的系统。例如，如果 Web 服务器宕机，你可能会将发往该服务器的数据包重定向到本地网络上的另一台计算机。这个问题还有其他解决方案，例如更改\
  \ DNS 服务器条目，但 `NAT` 可以非常快速地实现，这可能很重要。\n\n- **负载均衡**。可以使用 `NAT` 将两个内部计算机分配给单个外部 IP\
  \ 地址，并在传入请求时在内部系统之间切换。这是一种粗略的负载均衡形式，当单个服务器过载时你可能会采用这种方法。不过，还有其他比 `NAT` 更优雅的负载均衡解决方案。\n\
  \n\n\n\n# IP 地址扩展\n\n- 如果你拥有的 `IP` 地址数量有限，你可以将几台计算机“隐藏”在一个单一的 `IP` 地址之后，最大限度地利用可用的\
  \ `IP` 地址。此功能通常用于使用 `PPP` 拨号或宽带连接连接的小网络，这些连接通常只给用户提供一个 `IP` 地址。它也可以用于较大的组织内部以扩展可用的\
  \ `IP` 地址——例如，每个部门使用一个 `IP` 地址。\n\n这种最后的选项可能是 Linux 中 `NAT` 最常见的用法，它经常被另一个名称所称为：`IP\
  \ 伪装（IP masquerading）`。因此，这是本章重点关注的 `NAT` 用法，但并不是 `NAT` 的唯一用途。\n\n### NAT 如何工作\n\
  \n![NOTE](img/note.gif)\n\n`NAT` 需要使用路由器。该路由器按照路由器的标准并不需要非常复杂，但它确实需要对 `NAT` 的支持。通过\
  \ `iptables` 配置的 Linux 内核完全能够胜任这一角色。配置为 `NAT` 路由器的 Linux 计算机通常有两个外部网络接口——通常是两个以太网接口，或者一个以太网接口和一个\
  \ `PPP` 接口。\n\n与传统的路由器不同，`NAT` 路由器不需要被外部识别为路由器。因此，你不需要重新配置 `NAT` 路由器的网关系统，而如果 `NAT`\
  \ 路由器是为公共 `IP` 地址服务的普通路由器，你就必须这样做。\n\n为了理解 `NAT`，请考虑通过 `NAT` 路由器的网络事务。该事务于 `NAT`\
  \ 保护网络上的客户端（例如 Web 浏览器）。用户尝试连接到外部站点（例如 172.18.127.45）。浏览器生成 `HTTP` 请求数据包，源地址为其本地\
  \ `IP` 地址（例如 192.168.9.32）。客户端将此请求发送给其本地网关系统，即 `NAT` 路由器。在接收到构成请求的数据包后，`NAT` 路由器检查数据包并将源\
  \ `IP` 地址更改为 `NAT` 路由器自身的外部地址（例如 10.34.176.7），然后将数据包发出。Web 服务器认为数据包来自 `NAT` 路由器，因此将其回复发送到\
  \ `NAT` 路由器。当 `NAT` 路由器收到此回复时，它识别出这是对来自 192.168.9.32 请求的回复，因此反转过程，更改回复数据包的目标地址并将其传递客户端。这一过程在图\
  \ 25.3 中所示。如果一切顺利，客户端和服务器都不知道 `NAT` 的参与，因此网络程序不需要重写以支持 `NAT`。\n\n某些形式的 `NAT`，特别是\
  \ `IP 伪装`，提供了额外的益处：对私有网络进行类似防火墙的保护。因为外部世界只看到一个 `IP` 地址，外部系统无法对内部计算机发起正常的直接连接。只有\
  \ `NAT` 网络内部客户端发起的连接的回复包才能到达客户端。由于如此，某些 `NAT` 产品（特别是针对家庭宽带用户）被作为防火墙营销，但两者略有不同。\n\
  \n![NAT 涉及修改 TCP/IP 数据包以便以某种方式更改地址。](img/25fig03.gif)\n\n**图 25.3. NAT 涉及修改 TCP/IP\
  \ 数据包以便以某种方式更改地址。**\n\n`NAT` 确实有某些缺点，也有优点：\n\n- 防火墙式的保护意味着你不能容易地从 `NAT` 保护的网络内部运行外部可访问的服务器。要做到这一点，你必须使用端口转发，见后续章节“使用\
  \ iptables 重定向端口”。\n- 并不是所有协议对 `NAT` 响应良好。某些协议（例如某些安全工具）在其数据负载中嵌入 `IP` 地址信息，有时是加密形式。其他协议要求连接的两端都有服务器。Linux\
  \ 的 `NAT` 实现对某些对于 `NAT` 复杂的协议提供了显式支持，但如果你使用视频会议或加密工具，你可能想要进行网络搜索或实验，以确定你的工具是否适用于\
  \ Linux 的 `NAT`。\n\n尽管这严格来说不是 `NAT` 的缺点，但你不应该过度依赖它的安全特性。病毒、蠕虫、木洛马或其他本地安全问题仍然可以从网络内部发起攻击，或利用传站连接允许外部人员访问。\n\
  \n总而言，`NAT` 是一个非常有用的工具，它可以使用单个 `IP` 地址将许多计算机连接到更广泛的网络，或者执行涉及 `IP` 地址洗牌的其他技巧。\n\n\
  ## 设置 iptables NAT 选项\n\nLinux 的 `NAT` 功能包含在与本章早期章节描述的 `filter` 表不同的单独表中。特别是，`NAT`\
  \ 位于 `nat` 表。该表像 `filter` 表一样由三个链组成：`PREROUTING`、`POSTROUTING` 和 `OUTPUT`。尽管名称相同，`nat`\
  \ 表中的 `OUTPUT` 链与 `filter` 表中的 `OUTPUT` 链不同。启用 `NAT` 可以通过输入两个命令：\n\n```bash\n# iptables\
  \ -t nat -A POSTROUTING -o external-interface -j \\ MASQUERADE\n# echo \"1\" >\n\
  /proc/sys/net/ipv4/ip_forward\n```\n\n### NOTE\n\n![NOTE](img/note.gif)\n\n在执行 `iptables`\
  \ 命令之前，你可能需要输入 `modprobe iptable_nat` 将 `NAT` 模块加载到内核。\n\n第一个命令中，`external-interface`\
  \ 是外部网络接口的名称，例如 `ppp0` 或 `eth1`。此命令告诉 Linux 对所有路由网络流量执行 `IP` 伪装。第二个命令启用 Linux 内核中的路由功能（你可以使用相同的命令启用非\
  \ `NAT` 路由功能）。\n\n\n\n\n在 `NAT` 路由器上启用防火墙功能是常见做法，正如本章稍早在“使用 iptables 配置防火墙””节中所描述的那样。在这种情况下，保护\
  \ `NAT` 路由器后的计算机免受直接攻击并不是什么问题，但你应该保护 `NAT` 路由器免受针对自身的攻击，并且应该限制从你网络内部发出的外部访问。即使你是唯一的用户，病毒、蠕虫或特洛马也可能尝试发起不希望的外部访问，因此你应该限制出站数据包。你还可以使用状态检测来阻止从你网络内部发起的连接劫持尝试。你可以在与激活防火墙功能时使用的同一个脚本中输入\
  \ `NAT` 命令。\n\n如果可能的话，你的 `NAT` 路由器最好不要运行任何服务器。如果运行在 `NAT` 路由器上的服务器被攻破，它可能被用来破坏你网络的其余部分。事实上，你可以在一台旧电脑上安装\
  \ Linux，并仅将其作为小型网络的 `NAT` 路由器使用。即使是老旧的 80486 系统也足够了。\n\n# 使用 `iptables` 转发端口\n\n\
  在某些情况下，指向一台计算机的网络活动应该由另一台计算机，或者可能是同一台计算机上的另一个端口处理。对于这些任务，`iptables` 允许你实现端口转发，将传入的网络流量反射到另一台计算机。\n\
  \n## 何时转发端口\n\n端口转发在某些情况下是非常用的工具，包括以下场景：\n\n* 你将服务器从一台计算机移动到另一台计算机，但你的 `DNS` 条目尚未正确更新。你也可以使用端口转发来*临时*进行此类更改。\n\
  * 你希望一个服务器响应单台计算机上的多个端口。你可以设置系统将一个端口转发到同一系统上的另一个端口。不过，某些服务器可以直接监听多个端口，这通常是更简单的方法。\n\
  * 你想在受 `NAT` 保护的网络内部运行一个可外部访问的服务器。你可以设置 `NAT` 路由器，将指向其外部端口之一的流量转发到内部系统。\n\n最后一种可能性在运行\
  \ `NAT` 时特别常见。请注意，这种行为会削弱 `NAT` 的安全优势，因为你实际上将一个内部系统（或至少是其一个端口）暴露给了外部。你还可以通过这种方式，在其通常端口上仅运行一个特定类型的内部服务器，至少在使用\
  \ `IP` 伪装形式的 `NAT` 时可以。（如果你的 `NAT` 路由器有两个外部地址，你可以将两个地址上的端口都转发到不同的内部系统。）如果你想让外部访问两个相同类型的内部服务器（例如两个\
  \ Web 服务器），你将必须在非标准端口上运行其中一个，或者获取其他外部 `IP` 地址。\n\n## 设置 `iptables` 端口转发选项\n\n在提供\
  \ `NAT` 功能的 Linux 系统上启用端口转发有多种不同的方法。其中一种是使用 `iptables` 及其 `NAT` 功能。要执行此操作，你可以输入类似所示的命令：\n\
  \n```\n# iptables -t nat -A PREROUTING -p tcp -i external-interface \\\n  --destination-port\
  \ port-num -j DNAT --to dest-addr:port-num\n```\n\n该命令的重要特性包括：\n\n* 该命令操作了 `NAT`\
  \ 表（`-t nat`）。\n* `-A PREROUTING` 参数指定在适当路由之前对数据包进行更改。基础的 `NAT` 功能在路由后（post-routing）运行，但端口转发发生在路由之前。\n\
  * 该命令转发 `TCP` 端口（`-p tcp`）。\n* 该规则适用于指向系统外部网络接口（`-i` `external-interface`）上指定端口（`--destination-port`\
  \ `port-num`）的数据包。\n* `-j DNAT` 参数告诉系统它正在对目标地址（DNAT）而不是源地址（SNAT）执行 `NAT`。\n* 最后一个参数\
  \ `--to` `dest-addr:`port-num` 指定数据包应指向 `dest-addr` 上的端口 `port-num`。例如，`dest-addr`\
  \ 可能是 `192.168.9.33`，`port-num` 可能是 `80`。注意，与 `--to` 使用的 `port-num` 不需要与与 `--destination-port`\
  \ 使用的 `port-num` 相同。\n\n你可以输入多个端口转发命令——根据需要输入，以转发任何处理你想在内部运行的服务器的端口。与基础 `NAT` 或防火墙配置一样，你可以在启动脚本中创建条目，以便在系统启动时运行这些命令。然后你就可以放这些配置不管了。\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n还有其他工具可以提供端口转发功能。特别是 `xinetd` 超服务器包含了端口转发功能。但是，由于\
  \ `xinetd` 是一个用户态程序，它在端口转发方面的效率不如通过 `iptables` 配置的内核。\n\n# 日志 `iptables` 活动\n\n\
  本章到此为止的 `iptables` 命令和选项在执行时不会创建任何特殊的日志记录。然而，有时你可能希望访问尝试在你的系统日志中留下痕迹。例如，你可能想记录对已拦截的敏感端口的访问尝试，或与状态数据包检查相关的失败。此类事件可能表明存在入侵你系统的尝试，因此你可能希望被这些事件，以便警惕其他针对你计算机的活动。\n\
  \n### 警告\n\n![警告](img/warning.gif)\n\n虽然记录防火墙活动是一个有用的信息源，但它也会减慢防火墙的操作并提供一种潜在的攻击手段。如果攻击者知道你正在记录特定类型的信息，攻击者可以向你的系统发送数据包，目标是导致系统向日志文件写入大量数据。这会降低你防火墙的性能，在极端情况下，它可能会导致日志文件分区空间耗尽，给你带来进一步的问题。由于由于原因，你应该谨慎使用这些日志选项。如果可能，将系统日志文件放在单独的分区上，这样即使被失控的日志进程冲垮，也不会对其他程序或进程产生影响。\n\
  \n`iptables` 程序包含一个特殊的目标 `LOG`，用于记录信息。与某些目标不同，与 `LOG` 目标的匹配不会导致系统停止搜索匹配；在匹配并记录匹配项后，内核将继续搜索\
  \ `LOG` 目标所属的链。你可以通过几种不同的方式使用此目标：\n\n* 你可以记录可能匹配其他显式目标的事件。例如，你可以包含一条规则来记录任何状态数据包检查违反，无论你的系统是否配置为拒绝此类违反。\n\
  \n### 提示\n\n![提示](img/tip.gif)\n\n\n\n记录你不一定想要丢弃的事件可以是一个非常有用的调试工具，因为你可以验证数据包是否到达你的系统，并自动记录有关这些数据包的信息。其他工具（如数据包嗅探器）也可以类似的作用，但在某些情况下，你可能会发现此功能很有用。\n\
  \n* 如果你的系统有默认的 `DENY` 或 `REJECT` 策略，你可以为你想要记录的任何类型的活动包含防火墙规则，就像显式阻止该访问一样，但调用 `LOG`\
  \ 目标而不是 `DENY` 或 `REJECT`。当数据包被记录时，它将被默认策略拦截，除非有其他规则允许其通过。\n\n* 如果你的系统有默认的 `ACCEPT`\
  \ 策略，你可以通过复制针对这些数据包的 `DENY` 或 `REJECT` 规则，并将第一个副本更改为调用 `LOG` 目标来记录你想要拦截的数据包。如果你将第二个副本更改为调用\
  \ `LOG` 目标，结果将是无效的，因为 `ACCEPT` 目标将退出链，导致 `LOG` 目标未被使用。\n\n例如，考虑在默认为`ACCEPT` 策略的防火墙上的以下防火墙规则，它们限制了来自\
  \ 172.24.0.0/16 网络的访问并记录了访问：\n\n```\n# iptables -A INPUT -s 172.24.0.0/16 -j LOG\n\
  # iptables -A OUTPUT -d 172.24.0.0/16 -j LOG\n# iptables -A INPUT -s 172.24.0.0/16\
  \ -j DROP\n# iptables -A OUTPUT -d 172.24.0.0/16 -j DROP\n```\n\n前两个命令与最后两个命令完全相同，区别在于目标发生了变化——是\
  \ `LOG` 而不是 `DROP`。第二个和第三个目标的位置可以很容易交换；这个细节并不重要。你也可以在 `LOG` 规则和 `DROP` 规则之间添加其他规则，但这会更难看出这两条规则是相关的。\n\
  \n日志操作的结果类似于来自 `/var/log/messages` 文件的内容：\n\n```\n Nov 18 22:13:21 teela kernel:\
  \ IN=eth0 OUT=\nMAC=00:05:02:a7:76:da:00:50:bf:19:7e:99:08:00 SRC=192.168.1.3\n\
  DST=192.168.1.2 LEN=40 TOS=0x10 PREC=0x00 TTL=64 ID=16023 DF\nPROTO=TCP SPT=4780\
  \ DPT=22 WINDOW=32120 RES=0x00 ACK URGP=0\n```\n\n此输出中包含的信息包括：\n\n* **日期和时间**。条目以显示数据包到达的时间戳开头。\n\
  * **系统名称**。这台计算机被称为 `teela`。\n* **输入网络接口**。`IN=eth0` 条目表示该数据包是 `eth0` 接口上的入数据包。\n\
  * **输出网络接口**。该数据包不是出数据包，因此 `OUT=` 字段为空。\n* **MAC 地址**。`MAC=` 条目包含两个介质访问控制（MAC）地址。该条目的前六字段是本地系统的\
  \ MAC 地址，接下来的六字段是远程系统的 MAC 地址。（对于通过路由器的的数据包，例如来自整个互联网的数据包，远程系统的 MAC 地址是不可靠的。）\n\
  * **源和目的 IP 地址**。`SRC=` 和 `DST=` 条目分别提供源 IP 和目的 IP 地址。\n* **源和目的端口**。`SPT=` 和 `DPT=`\
  \ 条目分别指定了源和目的端口。\n* **数据包信息**。附加字段提供了有关数据包的更多信息，例如其长度（`LEN=`）、存活时间（TTL）值（`TTL=`）等。\n\
  \n`LOG` 目标支持几个额外选项，用于控制进入日志条目的的内容。最有用的选项可能是 `--log-prefix` `prefix`。此选项允许你指定一个长达\
  \ 29 个字符的字符串，帮助你识别日志条目，从而识别产生日志条目的规则。\n\n## 总结\n\nLinux `iptables` 工具对于设置防火墙、配置\
  \ NAT、执行端口转发和记录低级网络访问非常有用。通常，会同时执行这些功能中的两个两个，例如对 NAT 路由器设置防火墙并记录某些失败的访问尝试。单个 `iptables`\
  \ 命令设置单个规则，但你使用该工具执行的大多数任务需要多条规则。因此，你可能会设置一个包含许多 `iptables` 命令的 `iptables` 防墙脚本。\n\
  \n# 第 26 章. 使用 VPN\n\n整个互联网经常面临的一个问题是加密。许多常用协议（如 Telnet 和 FTP）在设计时并没有考虑数据安全；它们以未加密的形式发送数据，通常包括用户名和密码。这种做法在局域网上是可以接受的，因为你可以控制对网络硬件的访问，但在整个互联网上是非常危险的，因为你的数据在客户端和服务器之间可能会经过十几个甚至路由器。\n\
  \n### 警告\n\n![警告](img/warning.gif)\n\n不要假设局域网上的数据是安全的。控制了受攻击计算机的黑客或不满的本地用户可以使用局域网访问造成巨大的破坏。在本地使用加密协议可能是合理的。Kerberos\
  \ 单元（在第 6 章中描述](#ch06.xhtml \"第 6 章.通过 Kerberos 验证用户”）可以是一个非常有用的本地安全工具。\n\n用户有时想从远处使用局域网资源——例如，从家里或旅行时。一种在不施加过大安全风险的情况下允许此类访问的方法是实现虚拟专用网络（VPN）。这让远程用户访问本地资源的方法，就像他们就在本地一样。VPN\
  \ 在 VPN 服务器和远程用户使用的 VPN 客户端系统中建立虚拟网络接口，并通过加密方式跨越互联网连接这些接口。VPN 可用于将单个计算机或整个远程网络连接到局域网。本章描述了\
  \ VPN 配置和使用的基础知识，包括两种常见的 VPN 协议：PPTP 和 FreeSwan。\n\n## 何时使用 VPN\n\nVPN 允许将局域网扩展到远程位置。当然，如果你的局域网连接到互联网，远程用户即使没有\
  \ VPN 也可以访问局域网。与直接的非 VPN 访问相比，VPN 有两个主要优势：\n\n\n\n\n\n## 本地访问的幻象\n\n许多局域网包含防止未经授权外部访问的保护措施。这些可能包括防火墙计算机或单个计算机上基于\
  \ `iptables` 的防火墙规则（均在第 25 章, 配置 iptables 中有所介绍）、在 `TCP` Wrappers 或 `xinetd` 中实现的限制（在第\
  \ 4 章, 启动服务器中描述），或在单个服务器程序中设置的限制。`VPN` 允许远程计算机像本地计算机一样访问本地计算机，从而简化了可能几十个服务器的配置。确定哪些远程系统应该像本地系统一样访问的棘手任务被隔离到了\
  \ `VPN` 服务器上。\n\n## 对非加密协议进行加密\n\n`VPN` 中的 `P` 代表 `Private`（私有的），因此一个不包含某种加密来提供隐私的\
  \ `VPN` 并不算是一个真正的 `VPN`。通过对 `NFS` 和 Telnet 等通常非加密的协议进行加密，`VPN` 允许你以相当直接的方式在互联网上传输数据，至少从客户端和服务器的角度来看是这样。这些客户端和服务器不需要特殊的安全配置，受益于\
  \ `VPN` 提供的加密。当然，你也可以使用某些加密协议来替代 `VPN`，如果你只对一个或两个协议进行加密，那么这些协议的设置可能比 `VPN` 更简单。\n\
  \n`VPN` 的一个常见用法连接位于远地的多个办公室。如果你的公司在波士顿和旧金山设有办公室，你可以使用 `VPN` 将它们连接起来，让员工从一个地方安全地访问另一个地点的服务器。图\
  \ 26.1 展示了这种安排。图中的 `VPN` 路由器*确实*是路由器，就像普通路由器、`NAT` 路由器或防火墙计算机一样。然而，`VPN` 路由器在执行普通路由之外或之外，还建立了一个加密链路，通过该链路传输发往彼此的数据。\n\
  \n![VPN 通常由能够加密发往特定目标数据的路由器实现。](img/26fig01.gif)\n\n**图 26.1.一个 `VPN` 通常由能够加密发往特定目标数据的路由器实现。**\n\
  \n### 注意\n\n![注意](img/note.gif)\n\n虽然图 26.1 展示了一个连接两个网络的 `VPN`，但这并不是 `VPN` 技术的限制。你可以通过\
  \ `VPN` 连接三个、四个或更多网络。\n\n`VPN` 的另一个用途是允许单个用户访问更大的网络。这种应用常见于远程办公人员和出差员工。个人可以通过宽带甚至拨号连接将家庭计算机或笔记本电脑连接到更大的网络，以获得主办公室服务器的便利。在这种情况下，`VPN`\
  \ 路由器与单个远程系统直接通信；本质上它们也是 `VPN` 路由器，但它们只为远程系统路由其自身的流量。这种情况在图 26.2 中所示。\n\n![VPN 系统可以将单个客户端连接到主机网络。](img/26fig02.gif)\n\
  \n**图 26.2. `VPN` 系统可以将单个客户端连接到主机网络。**\n\n在实现 `VPN` 时，你应该仔细考虑你的带宽需求。特别是当将多个远程网络连接到中心中心网络时，大型中心网络可能需要大量的外部带宽来处理来自远程站点的需求。许多局域网中常见的协议（如文件共享协议和\
  \ X 系统）会传输海量数据。这些传输在 100Mbps 的本地以太网连接上可能是合理的，但在较慢的互联网链路上（例如 1.5Mbps 的 T1 线路），本地协议的运行可能会慢到无法接受的程度。如果你的任何一个连接使用了低端宽带连接（例如用于远程办公人员的非对称数字用户线（`ADSL`）账户），你应该记住某些此类账户在本质上是非对称的。通常情况下，上行带宽远低于下行带宽。例如，`ADSL`\
  \ 经常使用 600–1,500Kbps 的下行速度，对应 100–300Kbps 的上行速度。这对于某些 `VPN` 用途是可以接受的，但对于另一些则不然。更糟糕的是，旅行者可能会被限制在不超过\
  \ 56Kbps 的模拟调制解调器速度，通常甚至如此。\n\nVPN 并非没有缺点，即使在快速的外部连接上也是如此。其一，尽管它们被设计为连接网络的安全方式，但如果实现不当，它们实际上会*降低*你的安全性。考虑一个通过\
  \ `VPN` 连接到大网络的远程办公人员。如果大网络受到防火墙和类似措施的保护，那么它应该是相当安全的。然而，家庭计算机可能不受入侵的保护较弱。如果黑客侵入了这个系统，它就成为该大网络防火墙上的一个巨大漏洞。这些安全风险在接下来的章节“使用\
  \ VPN 的潜在安全风险””中有更详细的介绍。\n\nVPN 的另一个问题是它们的配置可能非常繁琐，特别是结合防火墙使用时。如果你连接远程办公人员、出差个人或远程办公室的需求有限，你可能会发现使用一两个安全协议（如\
  \ `SSH`）更为简单。\n\n# Linux 的 VPN 选项\n\n目前没有单一标准的 `VPN` 工具，尽管存在向创建 `VPN` 标准的趋势。在此期间，想要配置\
  \ VPN 的组织需要在几种工具中确定一个。Linux 最常用的三种工具如下：\n\n*   `PPTP`——*点对点隧道协议（Point-to-Point Tunneling\
  \ Protocol, `PPTP`）*由一个被称为 `PPTP` 论坛的联盟联盟开发。`PPTP` 通常用于将远程办公人员或旅行者连接到家庭办公室。最近版本的\
  \ Windows 自带了 `PPTP` 支持，因此在 Windows 客户端上很容易实现。提供可用的 Linux `PPTP` 服务器 PoPToP ([`poptop.lineo.com`](http://poptop.lineo.com))。\n\
  \n\n\n\n\n- `FreeS/WAN` — `FreeS/WAN` 项目 ([`www.freeswan.org`](http://www.freeswan.org))\
  \ 基于 Internet Key Exchange (`IKE`) 和 IPSec 协议构建，为 Linux 提供了一个开源的 `VPN` 工具。它在 Linux\
  \ 到 Linux 的 VPN 连接中非常流行（当然，一端或两端在 `VPN` 路由器后面可能托管了非 Linux 计算机）。\n- `SSH` — 安全外壳\
  \ (`SSH`) 协议具有对其他协议连接进行隧道传输的能力。利用这种能力可以在 `SSH` 链上传输 `PPP` 连接。通过适当的路由，连接两端的 `PPP`\
  \ 接口可以在两个站点之间提供一个 `VPN`。\n\n本章重点介绍前两种方法。`PPTP` 是一种非常流行的 `VPN` 接入方法，特别是当 Windows\
  \ 客户端必须直接连接到中心位置的 `VPN` 路由器时。许多其他操作系统也有 `PPTP` 的实现，甚至存在于那些经常被称为“远程访问交换机”的专用硬件设备中。`FreeS/WAN`\
  \ 在 Linux 世界之外并不那么流行，但它是使用启用了 `VPN` 的 Linux 路由器将多个网络连接在一起极极方法。\n\n# 在 Linux 中配置\
  \ PPTP\n\n由于 `PPTP` 不是 Linux 的原生协议，在 Linux 系统上安装和使用它可能需要进行一些特殊的操作。PoPToP 服务器本身并不特殊，但它必须与\
  \ Linux `PPP` 守护进程 `pppd` 通信。为了提供安全性，整个系统还必须使用并非 `pppd` 标准部分的加密功能，因此你必须将标准的 `pppd`\
  \ 替换为扩展后的版本。Linux 和 Windows 客户端均可用，但它们它们的配置和使用方式有所不同。\n\n## 获取并安装 PoPToP\n\nPoPToP\
  \ 随于某些 Linux 发行版（如 Debian 和 Mandrake）提供，包名通常为 `pptpd` 或 `pptpd-server`。如果你的发行版自带\
  \ PoPToP 包，请先尝试使用它，因为它可能比通用的 PoPToP 包更容易安装和配置。如果你的发行版没有提供 PoPToP 包，你可以从 PoPToP 的主网站\
  \ ([`poptop.lineo.com`](http://poptop.lineo.com)) 获取。该网站以源码 tar 包、源码 RPM 和适用于 x86\
  \ 系统的二进制 RPM 形式托管软件。\n\n虽然可以在标准的 Linux 系统上安装并运行 PoPToP 包，但默认的 Linux 和 PoPToP 组合提供的\
  \ `VPN` 缺乏安全性。这是因为 `PPTP` 依赖于特殊的 `PPP` 加密功能，而这些功能并不是标准 Linux `pppd` 的。特别是 `PPTP`\
  \ 使用微软点对加密 (`MPPE`) 协议。为了启用加密，你必须为标准的 Linux `pppd` 和你的 Linux 内核获取并安装 `MPPE` 加密补丁。遗憾的是这个过程繁琐且复杂，将在后续章节“启用加密功能”中描述。\n\
  \n## PoPToP 服务器配置\n\n一旦下载并安装了 PoPToP 包，你可以按照以下方式激活它：\n\n1. 编辑 `/etc/ppp/options`\
  \ 文件。该文件控制 Linux `pppd` 程序，该程序处理 `VPN` 路由器与远程 `PPTP` 系统之间的网络链路。文件应包含类似下面的条目：\n\n\
  ```\ndebug\n    name servername\n    auth\n    require-chap\n    proxyarp\n    192.168.1.1:192.168.1.100\n\
  ```\n\n这些项目大部分设置了关键的 `PPTP` 选项。最后一行可选的；它设置了 `VPN` 路由器在其本地网络使用的地址 (`192.168.1.1`)\
  \ 以及分配给 `VPN` 客户端的地址 (`192.168.1.100`)。如果你省略此行，可以在 `VPN` 客户端配置中指定使用的 `IP` 地址。`servername`\
  \ 是 `VPN` 服务器的主机。\n\n2. 编辑 `/etc/ppp/chap-secrets` 文件以指定用于登录 `VPN` 的用户名和密码，每行一个。指定用户名\
  \ `vpn1` 和密码 `vpnpass` 的示例为：\n\n```\nvpn1   *   vpnpass   *\n```\n\n### 警告\n\n![WARNING](img/warning.gif)\n\
  \n存储在 `/etc/ppp/chap-secrets` 中的密码没有经过加密。因此，该文件极其敏感，应该尽可能地保护。通常情况下，`root` 拥有该文件且仅允许\
  \ `root` 读取。然而，如果你的 PoPToP 服务器被破解，此文件可能会被读取，从而让他人获得你网络的远程访问。出于此原因，你应该在你的 `VPN` 路由器上运行尽可能少的服务器。\n\
  \n1. 在你的 `/etc/inab` 文件中查找 `pptpd` 的引用。如果你发现此类引用，通过在行首添加井号 (`#`) 来禁用它，然后输入 `telinit\
  \ Q` 激活此更改。这允许你手动启动 `pptpd` 以测试其配置。一旦你确定了可行的配置，可以在 `/etc/inab` 中重新启用 `pptpd`，或像第\
  \ 4 章描述的那样像传统服务器一样启动它。\n\n2. 以 `root` 身份输入 `pptpd` 来启动服务器。\n\n此时，PoPToP 已经在运行，你应该按照后续章节“PPTP\
  \ 配置”所述使用 `PPTP` 客户端连接到系统。如果没有启用加密功能，你可能需要禁用客户端上的加密以建立连接。下一节将描述如何启用 PoPToP 加密。\n\
  \n### 警告\n\n![WARNING](img/warning.gif)\n\n虽然在不加密的情况下连接到 PoPToP 是测试配置的有用第一步，但你不应该将其作为常规事务运行。运行\
  \ `VPN` 的主要原因之一是提供安全连接，当你禁用加密时，就会失去这些安全益处。\n\n额外的 `PPTP` 特定选项通过 `pptpd.conf` 文件控制，该文件通常位于\
  \ `/etc` 或 `/etc/ppp`。你可能想在该文件中设置的某些选项包括：\n\n- `debug` — 进入此选项会导致 PoPToP 向系统日志记录更多数据，这在尝试建立连接遇到问题时非常有用。\n\
  \n\n\n\n\n*   `localip` — PPTP 通过每个客户端使用两个 IP 地址来工作：一个用于本地网络，另一个供客户端远程使用。PPTP 路由器对本地地址本身做出响应，并将其数据传递给远程地址。这类似于网络地址转换\
  \ (NAT) 设置。你可以使用 `localip` 选项指定本地 IP 地址，可以使用逗号分隔的列表或带连连字符的范围。例如，`localip 192.168.9.7,192.168.9.100-150`\
  \ 会分配 192.168.9.7 以及从 192.168.9.100 到 192.168.9.150 的所有地址。请确保本地网络上的其他计算机没有使用这些地址。\n\
  \n*   `remoteip` — 此选项指定远程客户端使用的 IP 地址。它们通常是私有 IP 地址段中的地址。你以与 `localip` 选项相同的格式指定\
  \ IP 地址。\n\n*   `listen` — 你可以通过在此选项中列出与特定接口关联的 IP 地址，让 `pptpd` 仅在该接口上监听连接。默认情况下，PoPToP\
  \ 监听所有接口，允许在 PPTP 连接中进行 PPTP 连接。\n\n## 启用加密功能\n\nPoPToP 依赖于 `pppd`，而 `pppd` 又依赖于内核。在\
  \ PoPToP 的实现中，加密功能需要 `pppd` 支持，而 `pppd` 要求 Linux 内核包含适当的加密功能。因此，对 PoPToP 使用加密需要对\
  \ `pppd` 和你的内核进行补丁或替换。\n\n为了激活 PoPToP 的 PPTP 加密支持，你可能需要从不同的位置获取补丁和软件包。具体取决于你取决于取决于。最简单的方法是使用的方法修复的\
  \ `pppd` 版本和预修复的 Linux 内核。你可以从 [`mirror.binarix.com/ppp-mppe/`](http://mirror.binarix.com/ppp-mppe/)\
  \ 获取这两者。特别是，你必须下载两个文件：\n\n*   Linux 内核 — 预修复的 Linux 内核以 `kernel` 开头的文件提供，例如 `kernel-2.4.9-13mppe.i386.rpm`。这些软件包中的某些是特定系统类型的预编译二进制内核，另一些是内核源码包。如果你下载了源码包，必须为你的系统进行配置和编译。\n\
  \n*   `ppp` 软件包 — 预修复的 `pppd` 软件包具有类似 `ppp-2.4.1-3mdk.i586.rpm` 的文件名。你可能可以直接将此类软件包覆盖覆盖现有的\
  \ `pppd` 软件包。\n\n[`mirror.binarix.com/ppp-mppe/`](http://mirror.binarix.com/ppp-mppe/)\
  \ 网站倾向于为 Mandrake 发行版构建二进制软件包，因此你使用这些软件包的最佳机会是使用 Mandrake。这些某些软件包（特别是 `ppp` 软件包）可能可以在其他发行上运行，特别是其他基于\
  \ RPM 的发行版。\n\n### 提示\n\n![TIP](img/tip.gif)\n\n如果你运行的是一个不使用 RPM 的发行版，你可能可以使用 `alien`\
  \ 工具来转换软件包格式。该程序是 Debian 的标准部分，允许你在 RPM、Debian 软件包和 tarball 之间进行转换。\n\n预修复工具的另一个来源是\
  \ PPTP-Linux 网站，[`pptpclient.sourceforge.net`](http://pptpclient.sourceforge.net)。该网站托管了稍后描述的\
  \ PPTP 客户端软件，`ppp-mppe` 软件包是修复了 MPPE 支持的 `pppd` 程序。这些软件包还包含了带有 MPPE 支持的内核模块。下载文件时咨询网站以确定支持哪些内核版本；我写这里时提供的\
  \ 2.4.0-4 软件包支持更新后的 Red Hat 6.2 和 7.0 系统上的 2.2.19 内核。由于现在 2.4.*x 内核更加常见，除非在你阅读时文件已更新，否则这种方法可能并不理想。如果你不能或不想使用预构建的二进制文件，你必须对\
  \ PPP 和你的内核都进行补丁。你需要获取并使用至少五项内容：\n\n*   Linux 内核 — 你可以从 [`www.kernel.org`](http://www.kernel.org)\
  \ 等网站获取标准的 Linux 内核源码包。建议使用标准的 Linux 内核，而不是 Linux 发版的内核，因为后者通常经过了自带补丁的修改。这会使应用新补丁变得困难。\n\
  \n*   `pppd` 源码 — 进入 ftp://cs.anu.edu.au/pub/software/ppp/ 获取原始的 `pppd` 源码。\n\n\
  *   OpenSSL — MPPE 补丁要求你的系统中安装了 OpenSSL 和 OpenSSL 头文件。你可以从 [`www.openssl.org`](http://www.openssl.org)\
  \ 获取这些内容。\n\n*   Linux 内核补丁 — 你可以从 [`mirror.binarix.com/ppp-mppe/`](http://mirror.binarix.com/ppp-mppe/)\
  \ 获取 Linux 内核补丁。寻找以 `linux` 开头并以 `patch.gz` 结尾的文件，例如 `linux-2.4.16-openssl-0.9.6b-mppe.patch.gz`。\n\
  \n*   `pppd` 补丁 — `pppd` 补丁也可以 [`mirror.binarix.com/ppp-mppe/`](http://mirror.binarix.com/ppp-mppe/)\
  \ 获取。这些文件名以 `ppp` 开头并以 `patch.gz` 结尾，例如 `ppp-2.4.1-openssl-0.9.6-mppe-patch.gz`。许多此类补丁都有变体，例如针对\
  \ Alpha CPU 的特殊版本。\n\n遗憾的是，这些许多补丁和工具是非常针对特定版本的。最好从补丁文件开始，找到它们支持的精确内核和 `pppd` 软件包，以避免由版本更改引起的问题。要修补并使用这些工具，你需要解压内核和\
  \ `pppd` 源码包，解压补丁文件（使用 `gunzip filename.patch.gz`），修补源码（使用 `cd source-dir`**`;`;\
  \ patch -p1 < patchfile.patch`），配置软件包（Linux 内核使用 `make menuconfig` 或 `make xconfig`，`pppd`\
  \ 使用 `./configure`），编译软件包（Linux 内核使用 `make bzImage` 和 `make modules`，`pppd` 使用 `make`），并安装软件包（Linux\
  \ 使用 `make modules_install` 和 LILO 配置，`pppd` 使用 `make install`）。\n\n无论你是从预构建二进制文件安装、还是手动修补并编译，或是混合使用，你都需要重启电脑使用新内核后才能加密支持。\n\
  \n## PPTP 客户端配置\n\n如果你的 PPTP 客户端是 Windows 系统，它们与 PoPToP VPN 使用非常简单，因为 Windows 包含了\
  \ PPTP 支持。Linux 客户端需要额外的软件包。在任何情况下，一旦建立了 VPN 连接，VPN 客户端就像是本地网络的一部分，至少从逻辑角度来看如此。（正如之前提到的，速度可能远低于真实的本地网络速度。）\n\
  \n### 使用 Linux PoPToP 客户端\n\n\n\n\nPoPToP 是一个 Linux PPTP 服务器。要将 Linux 系统（或 Linux\
  \ 路由器）连接到 PoPToP 或其他 PPTP 服务器，你需要另一个软件包：PPTP-Linux ([`cag.lcs.mit.edu/~cananian/Projects/PPTP/`](http://cag.lcs.mit.edu/~cananian/projects/pptp/)\
  \ 或 [`pptpclient.sourceforge.net`](http://pptpclient.sourceforge.net))。第二个网站包含 tarball\
  \ 和 RPM 格式的 PPTP-Linux 源码以及适用于 x86 和 Alpha CPU 的二进制 RPM。你应该下载并在必要时编译这些包之一，然后进行安装。\n\
  \n和 PoPToP 一样，PPTP-Linux 依赖 `pppd` 和 Linux 内核来实现 MPPE 加密。因此，在使用加密连接之前，你必须安装相应的内核和\
  \ `pppd` 更改。前面的章节“[启用加密功能””描述了如何操作。PPTP-Linux 网站包含了相应的工具。具体来说，`ppp-mppe` 软件包是一个经过\
  \ MPPE 补过的 `pppd` 程序和内核模块（截至 `ppp-mppe` 版本 2.4.0-4，适用于 2.2.19 内核）。\n\nPPTP-Linux\
  \ 包包含一个名为 `pptp-command` 的设置脚本。要使用此工具，请遵循以下步骤：\n\n1. 输入 `pptp-command` 启动脚本。\n2.\
  \ 脚本显示四个选项：`start`、`stop`、`setup` 和 `quit`。输入 `3` 使用 `setup` 过程。\n3. 脚本显示你可以配置的九个项目列表。输入\
  \ `2` 选择 `Add a New CHAP secret`。\n4. 系统询问你的本地名称（local name）。这是你的系统在 VPN 代理网络上的名称。如果\
  \ VPN 路由器是 Windows 系统，你必须包含一个 NetBIOS 域名。例如，你可以输入 `arbor\\\\maple` 为在 `arbor` 域为你的系统命名为\
  \ `maple`。\n5. 系统询问你的远程名称（remote name）。大多数情况下，你可以保持默认值（空字符串）。只有当你的网络具有多个本地名称相同但密码不同的条目时，才需要使用此项。\n\
  6. 系统询问密码。这是你在 PoPToP 或其他 VPN 服务器配置中输入的密码，例如“PoPToP 服务器配置”中的步骤 2。\n7. 脚本再次显示你可以设置的九个项目列表。选择选项\
  \ 5，`Add a NEW PPTP Tunnel`。\n8. 系统显示预定义隧道列表。这通常是空的，只包含一个名为 `Other` 的选项。如果你看到适合你的隧道，请选择它；但大多数情况下你需要选择\
  \ `Other`。\n9. 系统提示输入与隧道定义相关的各种信息，例如隧道名称（可以使用你喜欢的名称）、VPN 服务器的 IP 地址以及与隧道一起使用的路由命令。后者与\
  \ `route` 命令使用的命令类似（参见 第 2 章”，TCP/IP 网络配置）。例如，`add -host 172.19.87.1 gw DEF_GW`\
  \ 设置系统使用 172.19.87.1 作为默认网关，而 `add -net 172.19.0.0/16 TUNNEL_DEV` 告诉系统通过隧道传递发往 172.19.0.0/16\
  \ 网络的所有数据。\n10. 再次看到你可以配置的九个项目列表。选择选项 7，`Configure resolv.conf`。\n11. 选择你在步骤 9 中创建的隧道配置。系统将询问你通常位于\
  \ `/etc/resolv.conf` 中的 DNS 信息（如 第 2 章所述）。输入这些信息。\n12. 再次出现配置的九项选项列表。选择选项 8，`Select\
  \ a default tunnel`。\n13. 系统询问默认隧道的名称。选择你在步骤 9 中创建的那个（如果你正在创建多个隧道，则选择其他隧道）。\n14.\
  \ 列表再次出现时，选择选项 9，`Quit`。这将结束设置。\n\n此时，PPTP-Linux 已配置为使用你的 VPN。你可以通过使用 `pptp-command`\
  \ 测试你的 VPN。但是，在第一个提示中不要选择 3，而是选择 1（`start`）。`pptp-command` 会建立 VPN。\n\n### 注意\n\n\
  ![注意](img/note.gif)\n\n建立 VPN 链路需要一个常规连接。因此，你可能需要按照 第 2 章所述配置常规连接，或者建立拨号 PPP 链路。你可以通过\
  \ `route` 查看路由表，并通过 ping VPN 上的服务器来测试 VPN 链路。如果 `traceroute` 显示通过普通的（非 VPN）互联网连接，那么你的路由表出了问题。应该有一条通过\
  \ VPN 链路到达 VPN 系统的路径。\n\n### 使用 Windows PPTP 客户端\n\n通常，PPTP 客户端是属于旅行者、远程办公人员或其他需要离开办公室工作的\
  \ Windows 计算机。Windows 9*/Me 和 Windows NT/2000/XP 包含了 PPTP 客户端，尽管它们通常默认没有安装。只有在你拥有用的\
  \ Internet 连接后（无论是通过宽带 ISP、拨号 PPP ISP 还是其他机制），PPTP 软件才能工作。运行 Windows Me PPTP 客户端的步骤如下：\n\
  \n1. 从控制面板中双击“添加/删除程序”。这将产生“添加/删除程序”对话框。\n2. 点击“添加/删除程序”对话框中的“Windows 安装”选项卡。\n\
  3. 在组件类型列表中双击“通信”。这会弹出“通信”对话框。\n4. 在“通信”对话框中勾选“虚拟专用网络”项。\n5. 在“通信”对话框和“添加/删除程序”对话框中都点击“确定”。Windows\
  \ 将安装 PPTP 软件，并可能要求你重启计算机。请执行重启。\n6. 系统重启后，打开控制面板中的“拨号连接”文件夹。\n\n\n\n\n7. 双击“新建连接”图标。这将生成“新建连接向”向导（参见图\
  \ 26.3）。\n\n![创建 VPN 链接时，请务必选择 Microsoft VPN 适配器，而不是连接通过的调制解器。](img/26fig03.gif)\n\
  \n**图 26.3. 创建 VPN 链接时，请务必选择 Microsoft VPN 适配器，而不是连接通过的调制解器。**\n\n8. 为链接输入一个标识名称并选择\
  \ Microsoft VPN 适配器设备，如图 26.3 所示。\n\n9. 点击“下一步”。新建连接”窗口现在提供了一个文本输入字段，可以在此输入 VPN\
  \ 服务器的主机名或 IP 地址。输入这些信息。\n\n10. 点击“下一步”。系统现在通知你新设备已可用。点击“完成”关闭“新建连接”窗口。\n\n“拨号连接”窗口中现在出现了一个新图标。当你双击此图标时，Windows\
  \ 会显示如图 26.4 所示的“连接到”对话框。你应该输入在 VPN 服务器上使用的用户名和密码，并根据需要调整 VPN 服务器的名称或 IP 地址。当你点击“连接”时，Windows\
  \ 将启动连接，这可能需要几秒钟。之后，你的系统将获得额外的 IP 地址，该地址对应 VPN 服务器网络上的一个地址。你可以像访问本地系统一样访问该网络上的系统，包括在“我的网络位置”（较早版本的\
  \ Windows 中称为“网络邻居”）中浏览网络，并使用任何仅供本地计算机使用的资源。但请记住，物理网络并不是局部的，因此你无法获得当系统直接连接到与 VPN\
  \ 系统相同的网络介质时所拥的速度。\n\n![你可以通过“连接到”对话框控制 VPN 链接。](img/26fig04.gif)\n\n**图 26.4. 你可以通过“连接到”对话框控制\
  \ VPN 链接。**\n\n在启动连接之前，你可以通过“连接到”对话框更改 VPN 的某些功能。如图 26.4 所示，你可以选择让 Windows 记住（保存）你的密码。如果你这样做，可以通过勾选“自动连接”，让\
  \ Windows 在每次启动时都启动连接。点击“属性”可以获得更多选项。这将弹出一个以你的 VPN 连接命名的对话框，如图 26.5 所示。最有趣的选项位于“网络”和“安全”选项卡上。在“网络”选项卡中，你可以控制系统是否使用软件压缩或保留会话日志。你还可以控制哪些网络协议通过\
  \ VPN 传输。如果你点击“TCP/IP 设置”，可以告诉系统从 PPTP 服务器获取 IP 地址或自行请求特定地址，对 DNS 服务器地址也同样操作。“安全”选项卡允许你设置用户名、密码和\
  \ NetBIOS 域名。它还允许你启用或禁用密码和数据加密（两者均默认启用，禁用它们将失去 VPN 的大部分益处）。\n\n![你可以从客户端配置工具控制 PPTP\
  \ VPN 的许多细节。](img/26fig05.gif)\n\n**图 26.5. 你可以从客户端配置工具控制 PPTP VPN 的许多细节。**\n\n\
  # 配置 Linux FreeS/WAN 服务器\n\n与 PPTP 相比，FreeS/WAN 是一种更以 Linux 为中心的 VPN 解决方案，但从广上来说，两者都具有相似的功能：在不安全的网络（如互联网）上安全地连接两个或多个计算机或网络。与\
  \ PPTP 一样，运行 FreeS/WAN VPN 的步是获取并安装软件。然后你就可以开始配置系统并在 FreeS/WAN 系统之间建立链接。\n\nFreeS/WAN\
  \ 实际上是一个非常复杂的软件包，其选项比本章涵盖的要多。更多信息请参阅 FreeS/WAN 文档，特别是配置手册 [`www.freeswan.org/freeswan_trees/freeswan-1.91/doc/config.html`](http://www.freeswan.org/freeswan_trees/freeswan-1.91/doc/config.html)。\n\
  \n## 获取并安装 FreeS/WAN\n\n在 2002 年初，很少有 Linux 发行版自带 FreeS/WAN，但也有例外。值得注意的是，SuSE 带有该软件包，Mandrake\
  \ 软件包也易于获取。在从 FreeS/WAN 主网站 [`www.freeswan.org`](http://www.freeswan.org) 获取之前，你应该检查你的发行版以确保它没有附带\
  \ FreeS/WAN。该网站（或更准确地说，它链接的 FTP 站点 ftp://ftp.xs4all.nl/pub/crypto/freeswan/)以源码形式存放软件。FreeS/WAN\
  \ 需要 Linux 内核中不标准的显式内核支持，因此要使用它，你必须重新编译内核（如下文稍后会进行描述）。如果你安装了发行版自带的 FreeS/WAN 软件包，很有可能这些内核更改是发行版自带内核的一部分，因此你的配置任务会更简单。本节的其余部分假设你正在使用源码安装\
  \ FreeS/WAN。\n\n如果你从源码编译 FreeS/WAN，你必须在系统中安装几个组件：\n\n*   **标准开发工具**。你必须拥有典型的开发工具，例如\
  \ `GCC`、`make` 以及普通库和库头文件。此类工具在大多数 Linux 系统上默认已安装。\n\n\n\n\n\n- **内核源码**: FreeSwan\
  \ 编译工具会自动更改你位于 `/usr/src/linux` 的 Linux 内核源码树。因此，该源码树应该包含你当前的内核源码。如果你使用的是发行版的标准内核，你应该能够安装匹配的源码包。你稍后需要重新编译内核并重启。如果你计划更改内核配置，应该在编译\
  \ FreeSwan 之前（通过使用 `make menuconfig`、`make xconfig` 或类似的命令）进行配置。你可能想在继续后续之前编译并测试内核。\n\
  \n- **GMP 库**: FreeSwan 依赖于 GNU 多精度 (GMP) 库 ([`www.swox.com/gmp/`](http://www.swox.com/gmp/))。该包在大多数发行版中都可用，请尝试从你的安装\
  \ CD-ROM 或发行版主 FTP 或 网站查找并安装它。\n\n- **Ncurses 库**: 某些配置选项使用 ncurses 库。这不是强制要求的，但非常有帮助。它也非常常见，所以可能已经安装了。\n\
  \n要制作并安装 FreeSwan 包，请按照以下步骤操作：\n\n1. 确保你已拥有前面描述的所有组件，例如你的内核源码和 GMP 库。\n\n2. 将 FreeSwan\
  \ 包解压到某个方便的路径，例如 `/usr/src`。*不要*在解压后复制或移动 `freeswan-version` 目录；该目录包含对更改敏感的符号链接。）\n\
  \n3. 进入 FreeSwan 源码目录，并输入命令来配置包、补补 Linux 内核并制作 FreeSwan 包。你可以使用 `make oldgo` 使用你现有的\
  \ Linux 内核配置和默认的 FreeSwan 设置，使用 `make ogo` 使用内核的 `make config` 配置工具，使用 `make menugo`\
  \ 使用内核的 `make menuconfig`，或使用 `make xgo` 使用内核的 `make xconfig`。后三个选项将将引导你运行指定的内核配置例程，以便你更改内核选项。在任何情况下，输出的最后一行都应该报告系统正在调用\
  \ `errcheck` 脚本。如果你没有看到这一行，说明出问题了。你可以检查 `out.kpatch` 和 `out.kbuild` 文件，获取有关补丁和构建过程的信息，以寻找问题所在线索。\n\
  \n4. 输入 `make kinstall` 来重新构建你的内核。此过程构建内核及其模块，并使用内核的 `make modules_install` 过程安装新的内核模块。如果有任何错误，它们将出现在\
  \ `out.kinstall` 文件中。\n\n5. 重新配置 LILO、GRUB 或你用于启动 Linux 内核的任何方法来处理新内核。你可能需要从 `/usr/src/linux/arch/architecture-code/boot`\
  \ 拷贝新内核文件，编辑 `/etc/lilo.conf` 或其他配置文件，并输入 `lilo` 或其他引导器命令。\n\n6. 重启电脑。如果有选择，请确保指定正确的启用\
  \ FreeSwan 的新内核。\n\n此时，你的系统应该正在运行一个支持 FreeSwan 的内核。作为过程的一部分，FreeSwan 会创建一个名为 `/etc/ipsec.secrets`\
  \ 的文件，其中包含加密密钥。你以后需要处理这个文件，所以现在你应该检查它是否存在并包含一些密钥（看起来像十六进制的乱码）。\n\n为了有用，你必须在至少两台计算机上配置\
  \ FreeSwan，假设在不同的网络上。两边的安装过程是相同的。在许多情况下，两个系统都将配置为路由器，尽管你也可以将 FreeSwan 安装在连接到远程网络的单一系统上。\n\
  \n### 编辑配置文件\n\nFreeSwan 使用两个配置文件：`/etc/ipsec.secrets` 和 `/etc/ipsec.conf`。每个都很重要并起着不同的作用。第一个包含加密密钥，服务器使用这些密钥来相互识别身份。第二个则控制通用配置选项。\n\
  \n#### 设置密钥\n\n如前所述，FreeSwan 的构建过程应该已经创建了一个包含加密密钥的 `/etc/ipsec.secrets` 文件。如果该文件不存在，或者它不包含你想使用的密钥，你可以使用以下命令生成新密钥：\n\
  \n```bash\n# ipsec rsasigkey 128 > /root/rsa.key\n```\n\n此命令创建一个 128 位的密钥并将其放置在\
  \ `/root/rsa.key` 文件中。你可以通过在前面的示例中指定所需的长度代替 `128` 来生成其他某些长度的密钥。尽管如此，此命令的输出并不是完全所需要的。具体来说，你必须在文件的开头添加以下行：\n\
  \n```bash\n: RSA {\n```\n\n确保包含 `RSA` 周围的空格。你还必须在文件末尾添加一行包含至少一个空格后跟单个右大括号 (`}`)\
  \ 的行。然后你可以将结果复制到现有的 `/etc/ipsec.secrets` 文件中，替换该文件中当前的 `: RSA {` 块。你应该在两台 FreeSwan\
  \ VPN 路由器上执行此步骤。\n\n### 注意事项\n\n![NOTE](img/note.gif)\n\n`ipsec rsasigkey` 命令的输出包含一条注释，说明密钥仅用于身份验证，不用于加密。没关系；FreeSwan\
  \ 正是这种方式使用密钥，并使用其他算法进行加密。\n\n`ipsec rsasigkey` 命令的输出包含一行以 `#pubkey=` 开头的注释行。这设置了你必须提供与本系统通信的其他系统的公钥。你现在应该记录它，因为你需要将其输入其他系统的\
  \ `/etc/ipsec.conf` 文件。\n\n### 编辑 IPSec 设置\n\n大多数 FreeSwan 安装会创建一个默认的 `/etc/ipsec.conf`\
  \ 文件。该文件本身并不特别有用，但可以作为配置系统的良好模板。该文件有三种基本类型的设置部分：`config setup`、`conn %default` 和\
  \ `conn` `remotename`。\n\n#### 调整本地选项\n\n`config setup` 部分指定了本地设置。默认示例部分类似于以下：\n\
  \n```\n config setup\n  # 此设置必须正确，否则几乎一切都无法工作；\n  # %defaultroute 对于大多数简单情况都是可以的。\n\
  \  interfaces=%defaultroute\n  # 调试日志控制：\"none\" 表示（几乎）无，\"all\" 表示大量。\n  klipsdebug=none\n\
  \  plutodebug=none\n  # 使用 conn 描述中的 auto= 参数来控制启动动作。\n  plutoload=%search\n  plutostart=%search\n\
  \  # 当使用相同 ID 的新连接出现时关闭旧连接。\n  uniqueids=yes\n```\n\n\n\n\n\n此部分最重要的设置是 `interfaces`\
  \ 行，它告诉 `FreeS/WAN` 使用哪些接口进行 `VPN` 连接（即它可以在哪里找到 `VPN` 伙伴）。`%defaultroute` 的默认值告诉\
  \ `FreeS/WAN` 使用你的默认路由，该路由通常连接到所有非本地的 `IP` 地址。尽管如此，你可能可能想要指定特定的接口。例如，以下选项告诉系统使用\
  \ `eth0` 和 `ppp1`：\n\n```\ninterfaces=\"ipsec0=eth0 ipsec1=ppp1\"\n```\n\n`klipsdebug`\
  \ 和 `plutodebug` 选项为`内核 IP 安全 (KLIPS)` 内核功能以及 `Pluto` 守护进程设置日志选项，`Pluto` 是 `FreeS/WAN`\
  \ 软件包中处理密钥交换的组件。如果你遇到问题，可以将这些设置为 `all`。\n\n`Pluto` 可以将连接加载到内存中，或者在 `FreeS/WAN` 启动时自动启动它们。`plutoload`\
  \ 和 `plutostart` 选项告诉系统应对哪些连接执行此操作。默认值在大多数情况下运行良好，但如果你只想指定某些连接，可以命名它们。列出单个 `FreeS/WAN`\
  \ 服务器的缺点是，如果其中一个崩溃了，在重启后它可能不会自动恢复 `VPN` 连接。\n\n### 调整默认远程选项\n\n单个连接通过以关键字 `conn`\
  \ 开头的节定义。`FreeS/WAN` 支持一个 `%default` 连接名称来设置默认连接选项。你可能在此部分中看到的选项包括：\n\n*   `keyingtries`\
  \ — 在连接失败时时，`FreeS/WAN` 通常会重试连接。此选项的默认值 `0` 会使 `FreeS/WAN` 无限持续重试，但如果你想限制重试连接的次数，请将此值设得小一些。在首次测试设置时你可能需要这样做。\n\
  *   `authby` — 通常的验证方法使用 `authby=rsasig`，这会导致系统使用 `RSA` 密钥。另一种方法使用共享密钥 (shared secrets)，但本章仅涵盖\
  \ `RSA` 密钥认证。\n\n除了这些选项外，下一节“调整特定系统的远程选项”中描述的各种其他选项也可能出现在默认连接部分。如果你发现自己为多个连接输入相同的选项，可能可以将它们全部移动到默认配置中，以减少拼写错误导致问题的概率并缩短配置文件。\n\
  \n### 调整特定系统的远程选项\n\n每个连接都需要一些自定义，这在 `conn` 节中完成。连接名称跟在 `conn` 之后，该连接的选项位于后续行，所有行至少缩进空格。此部分的许多选项与网络接口有关。为了帮助理解这一点，请考虑[图\
  \ 26.6）。配置是从顶端（“左侧”）`VPN` 路由器描述的。你必须告诉 `FreeS/WAN` 此配置中使用的各种 `IP` 地址。你通过几个选项来实现：\n\
  \n![一个 FreeS/WAN 配置需要你识别创建 VPN 的多个计算机和网络地址。](img/26fig06.jpg)\n\n**图 26.6. 一个 FreeS/WAN\
  \ 配置需要你识别创建 VPN 的多个计算机和网络地址。**\n\n*   `leftsubnet` — 这是 `FreeS/WAN` 路由器连接的本地子网——在图\
  \ 26.6 中为 172.16.0.0/16。\n*   `left` — 这是与 `VPN` 服务器外部接口关联的地址。在大多数情况下它可以设置为 `%defaultroute`，或者你可能希望提供精确的\
  \ `IP` 地址，例如图 26.6 中的 10.0.0.1。\n*   `leftnexthop` — 这是 `VPN` 系统连接的常规路由器的 `IP` 地址，例如图\
  \ 26.6 中的 10.0.0.10。需要此信息是因为 `KLIPS` 绕过了正常的内核路由机制并直接将数据发送到下一个路由器。\n*   `leftfirewall`\
  \ — 如果 `VPN` 路由器服务的子网使用 NAT 的不可路由 `IP` 地址，或者如果 `VPN` 路由器兼作防火墙，请设置 `leftfirewall=yes`。这会调整\
  \ `FreeS/WAN` 处理包的方式以支持防火墙功能。\n*   `rightnexthop` — 这是 `leftnexthop` 项的镜像；它是将数据包传递到远程网络的常规路由器的\
  \ `IP` 地址。请注意，这是远程 `FreeS/WAN` 系统看到的此路由器的 `IP` 地址。\n*   `right` — 此项对应于远程 `VPN`\
  \ 路由器的外部网络接口。与 `left` 不同，你不能将此项留为默认。\n*   `rightsubnet` — 这是远程网络的 `IP` 地址块，例如图 26.6\
  \ 中的 192.168.1.0/24。\n*   `leftid` — 这是左侧系统的标识符。它可以是一个 `IP` 地址、域名、以 @ 符号引导的主机名（例如\
  \ `@vpn.threeroomco.com`）或用户名和主机名（类似于电子邮件地址，例如 `emily@vpn.threeroomco.com`）。以 @\
  \ 符号引导的主机名表示系统不应尝试将名称解析为 `IP` 地址。作为一个一般原则，这是最佳的使用形式，因为它相当容易记忆且在 `DNS` 宕机时不会引起问题。\n\
  *   `rightid` — 这与 `leftid` 相似，但它标识 `VPN` 链路的另一端。\n\n\n\n\n\n- `leftrsasigkey` —\
  \ 这是来自左侧 VPN 服务器 `/etc/ipsec.secrets` 文件的 RSA 公钥值。如果你正在配置左侧系统，应该剪切并粘贴此值；如果你正在配置右侧系统，则传输该文件然后复制粘贴。\n\
  - `rightrsasigkey` — 这是来自右侧 VPN 服务器 `/etc/ipsec.secrets` 文件的 RSA 公钥值。\n- `auto`\
  \ — 该选项结合了 `conn setup` 部分中的 `plutoload` 和 `plutostart` 选项，用于控制当 FreeS/WAN 启动时加载或启动哪些网络。具体而言，如果\
  \ `plutoload=%search` 且 `auto=add`，则加载配置；如果 `plutstart=%search` 且 `auto=start`，则启动配置。对于初始设置和测试，`auto=add`\
  \ 是一个较好的配置，因为它允许你手动启动连接。一旦你设置了生产环境系统，`auto=start` 通常效果更好，因为不需要手动干预即可启动连接。\n\n将系统或网络标记为\
  \ `left`（左）或 `right`（右）是人为的。一个实用的记忆方法是为链接取一个包含两端的名称，例如将连接波士顿和辛辛那提办公室的 VPN 命名为 `boscinci`。你可以波士顿端称为\
  \ `left`，辛辛那提端称为 `right`，反映它们在名称中的位置。你在链路的双方都使用相同的配置；FreeS/WAN 通过检查系统现有的网络连接来确定是哪一。\n\
  \n## 建立链路\n\n在两个 FreeS/WAN 路由器之间建立链路的基本步骤是在其中一台上以守护进程模式启动 `ipsec` 程序，并在另一台计算机上使用相同的程序发起连接。一旦你测试了连接，每当你启动计算机并在双方运行\
  \ `ipsec` 时，它都应该自动启动。在测试的这一阶段，使用哪个系统运行守护模式、使用哪个系统手动启动连接其实并不重要；与 PPTP 不同，FreeS/WAN\
  \ 在客户端和服务器之间没有太大区别。\n\n要以守护模式启动 FreeS/WAN，请输入以下命令：\n\n```\n# ipsec setup start\n\
  ```\n\n这会启动服务器，并根据前述的 `plutoload`、`plutostart` 和 `auto` 选项的配置，加载配置并等待连接或尝试发起连接。如果你按照前面的描述配置了系统（在连接的两端都设置了\
  \ `auto=add`），你可以在一端启动服务器，它将等待来自另一个系统的连接请求。当你在尚未运行程序的系统上输入以下命令时就会发生：\n\n```\n# ipsec\
  \ auto --up name\n```\n\n在此示例中，`name` 应该是连接链路的名称，例如 `boscinci`。系统应尝试启动该链路。你可以通过输入\
  \ `ipsec look` 来检查是否成功。如果输出了一组加密信息和一张 VPN 路由表，则表示连接成功。你也可以尝试使用普通的网络命令（如 `ping`、`traceroute`\
  \ 和 `telnet`）来查看是否能与远程网络上的系统建立连接，并验证它们是否正在通过 VPN 路由。请记住，如果远程网络从整个互联网公开访问，那么 `ping`\
  \ 等工具无法验证连接是否是通过 VPN 进行的。你应该使用那些被大众或你的本地公网地址屏蔽审查的协议来测试你的 VPN 功能。\n\n一旦你的网络运行起来，你就可以修改\
  \ `/etc/ipsec.conf` 中的 `auto` 配置。如果你在两端都设置为 `start`，那么每次执行 `ipsec setup start` 命令时启动都是自动的。你可以按照第\
  \ 4 章所述，通过在 SysV 或本地启动脚本以此这种方式启动 FreeS/WAN。\n\n## VPN 的潜在安全风险\n\nVPN 的目的部分是作为增加网络安全性的工具。然而，它们很容易变成入侵者进入的门径。VPN\
  \ 经常通过图 26.1、26.2 和 26.6 等图表来解释。这些图显示了各种 VPN 组件是如何结合在一起的。此类图没有强烈地强调许多链路实际上是两条链路。例如，考虑一个\
  \ PPTP VPN，其中中心网络使用 VPN 路由器以安全的方式与 Windows 计算机通信。那些 Windows 计算机实际上有两个网络接口——一个用于\
  \ VPN，另一个用于其正常的 Internet 连接。取决于 VPN 路由器自身的防火墙规则，此类网络的逻辑配置可能更接近图 26.7 所示的内容。\n\n\
  ![尽管 VPN 在系统或网络之间提供了安全链路，但 VPN 链路的双方都有直接的 Internet 连接，而这些连接可以被滥用。](img/26fig07.gif)\n\
  \n图 26.7。尽管 VPN 在系统或网络之间提供了安全链路，但 VPN 链路的双方都有直接的 Internet 连接，而这些连接可以被滥用。\n\n通常情况下，VPN\
  \ 配置为对其 VPN 客户端的信任超过对整个互联网主机的信任。然而，VPN 客户端拥有自己独立的 Internet 链路（事实上，这些链路通常是建立 VPN\
  \ 连接的）。因此，除非 VPN 客户端的安全性非常高，否则它们可能变成攻击手段。如果 VPN 或任何其他防火墙或安全工具将 VPN 客户端视为真正的本地，那么这些防火墙和其他安全措施提供的安全性远没有初看起来看起来那么好。例如，考虑攻击随机计算机的\
  \ Internet 蠕虫或病毒。你可能在常规防火墙中构建针对此类攻击的防护。但如果 VPN 客户端被攻破，且防火墙保护不适用于 VPN 客户端，那么蠕虫或病毒将迅速进入你所谓的受保护网络。\n\
  \n\n\n\n面对潜在的 VPN 绕过风险，恢复安全性的方法有两种：\n\n- **加固 VPN 的两端** — 如果 `VPN` 连接的两个端点都具有同等的安全性，那么整个网络就能保持安全状态。这种方法在\
  \ `VPN` 连接整个网络时很常见；通常，两个 `VPN` 路由器或独立的防火墙系统会保护所有形式的入口。当 `VPN` 连接的是单个远程办公人员或类似设备时，这种配置会变得棘手，因为\
  \ `VPN` 终点的数量可能很高，而且这些系统可能并不受你的直接控制。如果员工决定在家庭计算机上安装一个具有潜在风险的程序，你可能无能为力阻止它。\n- **不要信任\
  \ VPN 客户端** — 你可以安装防火墙规则，拒绝 `VPN` 客户端访问某些类型的资源，实际上是将它们在你的网络层级中降级为“二等”状态。走向极端，这种方法会消除\
  \ `VPN` 的所有优势，但你可以利用它来为本地网络提供*一些*保护。例如，如果你的 `VPN` 用户不使用 X，你可以阻止 `VPN` 客户端访问 X 协议，但允许本地系统访问，从而降低基于\
  \ X 的攻击通过 `VPN` 成功的概率。\n\n在许多情况下，结合使用这两种方法是合适的。你可能要求使用 `PPTP` 客户端软件的员工也安装防火墙软件包，并仅允许他们访问特定的本地计算机或协议。你可以使用\
  \ Linux 的 `iptables` 命令（在第 25 章 中进行了描述）来配置这些限制。当 `VPN` 的两端完全由你控制时，你可以更多地依赖第一种方法，因为你可以在两个互联网接入点上配置相同的安全措施。\n\
  \n## 总结\n\n`VPN` 是扩展本地网络范围的有用工具。你可以使用该工具让单个远程用户或整个远程网络访问你本地网络上的非公共服务器。当你想要支持远程办公，或者想要将远程地地的两个或多个网络连接起来以共享服务器或其他方式整合这些网络时，这是一个极其有用的工具。目前存在多种\
  \ `VPN` 产品，其中许多都有适用于 Linux 的版本。两种特别流行的协议是 `PPTP`（在 Linux 中通过 `PoPToP` 和 `PPTP-Linux`\
  \ 实现）和 `FreeS/WAN`。`PPTP` 通常用于个人远程客户端连接到中心网络，而 `FreeS/WAN` 则更常用于连接整个网络。不过，两者都可以以任何方式使用。在实施\
  \ `VPN` 之前，你应该仔细考虑这样做带来的安全性影响，特别要注意每个 `VPN` 客户端都是你本地网络的另一个潜在入口。\n"
