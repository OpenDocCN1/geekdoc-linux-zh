    ![](img/6d8286a85e2d8ad63e16f1801102da59_439_0.png)


    # Interacting with Windows


    Windows have their own components, as shown in Figure 11-5.


    Here is a description of the window components.


    +   - **Border**: Each window is outlined with a border.

    - **Title Bar**: At the top of the window border is a title bar. The title bar
    lists the name of the window or the application running in the window.

    - **Window Options button**: Click this button to see a menu offering several
    useful window operations.

    - **Iconify button**: Click this button to collapse the window into a small icon.
    The icon appears in a section of the panel known as the Pager. The program in
    the window is still running but is hidden from sight.

    - **Minimize/Maximize button**: Click this button to alternately expand the window
    to fill the screen and reduce the window to its original size.

    - **Close button**: Click this button to close the window and terminate the application
    running in it.

    - **Scroll bar**: If a window contains more information than it can display, you
    see a scroll bar. The scroll bar lets you scroll through all the window''s content.'
