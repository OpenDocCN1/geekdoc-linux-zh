- pgno: 270
  md: '# # Completing the Case Project


    In this lesson you will:


    +   - Create a program algorithm to solve a problem

    - Learn to create a quick screen-clearing technique

    - Develop and test a program to re-enter fields during data entry

    - Develop and test a program to eliminate duplicate records

    - Develop and test a program to delete records from the file

    - Create shell functions

    - Load shell functions automatically from the command line when you log on


    # ## Clearing the Screen


    Before you begin to complete the programming tasks, you decide you want to clear
    screens more quickly. The **clear** command is a useful housekeeping utility for
    clearing the screen before new screens appear (which happens frequently in shell
    scripts), but you can use a faster method. You can store the output of the clear
    command in a shell variable. Recall from Chapter 6 that you can store the output
    of a command in a variable by enclosing the command in single back quotes. For
    example, this command stores the output of the date command in the variable TODAY:


    ```

    `TODAY='' date ''`

    ```


    The output of the clear command is a sequence of values that erases the contents
    of the screen. Storing these values in a variable and then echoing the contents
    of the variable on the screen accomplishes the same thing, but about ten times
    faster. This is because the system does not have to locate and execute the clear
    command, as it does when executing the clear command.


    # **To clear screens by setting a shell variable:**


    +   1. Set a shell variable, CLEAR, to the output of the clear command, by typing:

    ```python

    CLEAR=''clear''

    export CLEAR

    ```

    2. Use your new variable in your shell programs for a fast clear operation:

    ```python

    echo "$CLEAR"

    ```'
  merge: -1
  img_proc: true
