    # ## Formatting Text in UNIX


    Text formatting in UNIX involves preparing a text file with embedded typesetting
    commands and then processing the marked-up text file with a computer program.
    This program generates commands for the output device, such as a printer, a monitor,
    or some other typesetter. UNIX''s nroff and troff commands are often used to process
    the embedded typesetting commands to format the output.


    UNIX users have long used the nroff and troff commands to produce manuals, corporate
    reports, books, and newspapers. These programs evolved from an earlier program,
    RUNOFF (a utility created in the late 1970s), which read pure text with embedded
    codes to format and print a text-enriched report. An embedded code is a special
    sequence of characters that are included with the regular text in the file. The
    special codes are not printed, but interpreted as commands to perform text formatting
    operations. For example, there are codes to produce boldface print, center text,
    and underline certain lines.


    Using embedded codes in text to produce enriched output provides the advantage
    of not needing additional word-processing programs to produce documents. You can
    use any editor that works with flat files, like vi or Notepad. In addition you
    can use'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'added features, such as hyperlinks to cross-reference other documents from
    within your document. You do need, however, an HTML browser program like Netscape,
    or UNIX utilities such as nroff and troff, to translate and execute the embedded
    hyperlink codes. Linux introduced groff, which implements the features of both
    nroff and troff. Table 8-9 lists some embedded codes supported by groff.


    | Embedded Command | Meaning |

    |:---|:---|

    | .ce n | Center next *n* lines |

    | .ds C | Center |

    | .ds R | Right justify |

    | .p n | Start a new paragraph indented *n* characters |

    | .sa 0 | Turn off justification |

    | .sa 1 | Turn on justification |

    | .ul n | Underline the next *n* lines |


    Table 8-9: Some groff embedded commands


    The groff command''s usage follows this format:


    | Syntax | groff [-Tdev] |

    |:---|:---|

    | Dissection | The -T designates a device type, which specifies an output device
    such as ASCII to tell groff that the device is a typewriter-like device. In the
    format example, the device type (*dev*) is for the man pages. Some other device
    types include *ps* for postscript printers, *dvi* for TeX dvi format, and *lj4*
    for an HP LaserJet4-compatible printer. |


    Your task for Dominion Consulting is to produce a man page that contains the standard
    man page sections. You are to use groff to produce the man page. The format codes
    consist of tags and font-change commands that control the formatting, which you
    type into your man page document. The tags and font-change commands consist of:


    +   ■ The .TH tag indicates the man page title, as well as the date and a version-number
    string. In the formatted man page, the version and date strings appear at the
    bottom of each page.'
