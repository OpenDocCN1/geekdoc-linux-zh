  md: '2  *Type* **:.9d** *and press* **Enter** .

    You deleted the last three lines of the file.


    # Copying or Cutting and Pasting


    You can use the **yy** command in **vi** to copy a specified number of lines from
    a file and place them on the clipboard. To delete the lines from the file and
    store them on the clipboard, use the **dd** command. Now you want to reorganize
    your document so that the first three lines are at the end of the file. You can
    use cut and paste commands to make this change.


    +   To cut and paste text:

    1  Type **H** to move the cursor to the beginning of line 1.

    2  Type **3dd** to cut the first 3 lines from the document and store them in the
    buffer.

    3  Type **G** to move the cursor to the end of the file.

    4  Type **p** to paste the three lines at the end of the file.


    # Printing Text Files


    You can use the **lpr** (line print) shell command to print a file. Type **!lpr**
    and then type the name of the file you want to print.


    +   To print a file:

    1  Press **Esc** to return to command mode.

    2  Type **!lpr practice** and press **Enter** . This prints the file practice
    in the current directory on the default printer.


    You can also specify which printer you want to use with the -P*printer* option.
    For example, you may use two printers—lp1 and lp2. To print the practice file
    on lp2, type **!lpr -Plp2 practice** and press **Enter**.


    # Canceling an Editing Session


    If necessary, you can cancel an editing session, that is, you can discard all
    the changes you made. You decide you don’t need your practice file, so you can
    cancel your editing session.'
