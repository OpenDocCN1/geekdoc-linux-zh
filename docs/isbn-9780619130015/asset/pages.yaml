- pgno: 124
  md: 'The command copies the file or files specified by the source path to the location
    specified by the destination path. You can copy files into another directory,
    with the copies keeping the same names as the originals. You can also copy files
    into another directory with the copies taking new names, or copy files into the
    same directory as the originals, with the copies taking new names.


    For example, assume Tom is in his home directory (/home/tom). In this directory
    he has the file reminder. Under his home directory he has another directory, duplicates
    (/home/tom/duplicates). He copies the reminder file to the duplicates directory
    with the following command:


    ```

    cp reminder duplicates

    ```


    After he executes the command, a file named reminder is in the duplicates directory.
    It is a duplicate of the reminder file in the /home/tom directory. Tom also has
    the file class_of_78 in his home directory. He copies it to a file named classmates
    in the duplicates directory with the following command:


    ```

    cp class_of_78 duplicates/classmates

    ```


    After he executes the command, the file classmates is stored in the duplicates
    directory. Although it has a different name, it is a copy of the class_of_78 file.
    Tom also has a file named memo_to_boss in his home directory. He wants to make
    a copy of it and keep the copy in his home directory. He types the following command:


    ```

    cp memo_to_boss memo.safe

    ```


    After he executes this command, the file memo.safe is stored in Tom’s home directory.
    It is a copy of his memo_to_boss file.


    You may specify multiple source files as arguments to the cp command. For example,
    Tom wants to copy the files project1, project2, and project3 to his duplicates
    directory. He types the following command:


    ```

    cp project1 project2 project3 duplicates

    ```


    After he executes the command, copies of the three files are stored in the duplicates
    directory. You may also use wildcard characters with the cp command. For example,
    Tom has a directory named designs under his home directory (/home/tom/designs).
    He wants to copy all files in the designs directory to the duplicates directory.
    He types the following command:


    ```

    cp designs/* duplicates

    ```


    After he executes this command, the duplicates directory contains a copy of every
    file in the designs directory.


    The cp command is especially useful for preventing data loss: you can use it to
    make back-up copies of your files. You can create three new files and then copy
    them to a different directory. Then you can duplicate one file and give it a different
    name. Start by creating the subdirectory source in your home directory. You can
    create three new files and then copy them to the source directory.'
  merge: -1
  img_proc: true
- pgno: 125
  md: "**To create three files and copy them to a directory:**\n\n+   1.  If you do\
    \ not already have a subdirectory source, make sure you're in your home directory\
    \ and then create the directory. After the $ command prompt, type **mkdir source**\
    \ and then press Enter.\n2.  To create three files in your home directory, type\
    \ > file1 and press Enter, type > file2 and press Enter, and then type > file3\
    \ and press Enter.\n3.  Now you can copy the three files to the source directory.\
    \ Type **cp file1 file2 file3 source** and press Enter.\n    Now you can copy\
    \ of one of the files and give it a different name so you can distinguish it as\
    \ a back-up file.\n4.  After the $ command prompt, type **cp file1 file1.sav**\
    \ and press Enter.\n    Now your working directory contains two files with identical\
    \ contents but different names.\n\n# Recursively Removing Directories\n\nThe rm\
    \ command normally requires that a directory be empty before you can remove it.\
    \ This can be inconvenient when you need to remove a directory that has several\
    \ subdirectories under it. The -r option, however, tells the rm command to remove\
    \ a directory and everything it contains, including subdirectories. It even removes\
    \ subdirectories of subdirectories. This operation is known as recursive removal.\n\
    \n**To recursively remove a directory with several subdirectories:**\n\n+   1.\
    \  Create a directory with several subdirectories. Type **mkdir company** and\
    \ press Enter. Type **mkdir company/sales** and press Enter. Type **mkdir company/marketing**\
    \ and press Enter. Type **mkdir company/accounting** and press Enter.\n2.  Create\
    \ three empty files in the company directory. Type **touch company/file1 company/file2\
    \ company/file3** and press Enter.\n3.  Copy the files to the other directories.\
    \ Type **cp company/file1 company/file2 company/file3 company/sales** and press\
    \ Enter. Type **cp company/file1 company/file2 company/file3 company/marketing**\
    \ and press Enter. Type **cp company/file1 company/file2 company/file3 company/accounting**\
    \ and press Enter. (HINT: The three commands you just typed are very similar.\
    \ You can reduce your typing by using the Up arrow key to recall the first command.)\n\
    4.  Use the ls command to verify that the files were copied into all three directories."
  merge: -1
