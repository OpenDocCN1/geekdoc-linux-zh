    # Using the Join Command


    The join command differs from the other file processing commands in this chapter,
    because it is used in relational database processing. Relational databases consider
    files as tables and records as rows. They also refer to fields as columns that
    can be joined to create new records. The join command is the UNIX method that
    lets you extract information from two files sharing a common field.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'For example, you can use the `join` command to combine information in the vendor
    and product files, thereby producing the vendor report for Worldwide''s purchasing
    department. Both the vendor and product reports include the vendor number. The
    syntax of the `join` command is:


    ```

    Syntax


    join [options] file1 file2

    ```


    **Dissection**


    file1, file2 are two input files that must be sorted on the join field—the field
    you want to use `join` the files. The join field is also called a *key*. You must
    sort the files before you can `join` them. When you issue the `join` command,
    UNIX compares the two fields. Each output line contains the common field followed
    by a line from file1, followed by a line from file2. You can modify output using
    the options described next. If records with duplicate keys are in the same file,
    UNIX `join`s on all of them. You can create output records for unpairable lines,
    for example, to append data from one file to another without losing records.


    # Options


    +   • **-j** specifies the common fields on which the join is to be made.

    • **-o** specifies a list of fields to be output. The list contains blank-separated
    field specifiers in the form m.n, where m is the file number and n is the position
    of the field in the file. Thus -o 1.2 means “output the second field in the first
    file.”

    • **-t** specifies the field separator character. By default this is a blank,
    tab, or new line character. Multiple blanks and tabs count as one field separator.

    • **-a n** produces a line for each unpairable line in file n, where n = 1 or
    2.

    • **-e str** replaces the empty fields for the unpairable line in the string specified
    by str. The string is usually a code or message to indicate the condition; for
    an example, -e “No Vendor Record.”


    For an example of join logic, see Figure 4-5.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_145_0.png)


    Figure 4-5: Relational join


    In Figure 4-5, the join command combines fields from the vendor and product files.
    Then it searches for vendor numbers in the vendor file matching those in the product
    file. If a field does not match, UNIX selects it and later appends it to the merged
    file. If the field does match, UNIX sends it to the merged file.


    # Using the Join Command to Create the Vendor Report


    You can use the join command to create a vendor report showing what products Worldwide''s
    purchasing department has in stock.


    +   **To use the join command to create a report:**


    **1** After the $ command prompt, type `join -a1 -e “No Products” -j1 1 -j2 3
    -o 1.2 2.2 -t: vendors products > vreport; cat vreport` and press Enter.

    In this command, the -j option indicates the first or second specified file, such
    as vendors or products. Numbers following j1 and j2 specify field numbers used
    for the join or match. Here, UNIX uses the first field of the vendors record to
    join the third field of the products file.'
  merge: -1
  img_proc: true
