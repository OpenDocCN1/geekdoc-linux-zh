  md: '# ## APPENDIX C

    # How to Install Red Hat Linux 6.0


    This appendix guides you through a **workstation-class** installation of Red Hat
    Linux 6.0 onto a computer that is currently running Windows 95 or Windows 98.
    This is the simplest installation type and the best for first-time users. If you
    are replacing an operating system other than Windows 95 or Windows 98, or wish
    to perform a server-class installation, visit the following Red Hat Web sites:

    www.redhat.com

    www.redhat.com/corp/support/manuals'
  merge: -1
  img_proc: true
- pgno: 523
  md: 'Successfully completing the steps in this appendix completely removes the existing
    Windows 95 or Windows 98 operating system from your computer and installs Red
    Hat Linux.


    Caution: This installation type erases *everything* on your hard drive. If you
    have data you wish to keep, perform a backup before starting the installation.
    You cannot recover data from the disk after you perform the installation!


    There are four major steps in this installation method:


    +   Gather information about your computer hardware and network

    Create a Red Hat Linux boot disk

    Prepare your hard disk by removing all existing partitions

    Install Red Hat Linux


    You must follow the steps in the order they are listed.


    # # Gather Information About Your Computer Hardware and Network


    The minimum hardware requirements for Red Hat Linux 6.0 are:


    +   An Intel x86 processor

    16 MB of RAM

    500 MB hard drive

    3.5-inch floppy disk

    CD drive


    Before you begin the Red Hat installation, you must gather information about your
    computer hardware, and the network it connects to, if any. Here are some specific
    things you will need to know:


    +   The type and size of your hard drive

    The amount of memory in your system

    The type of CD drive in your system (specifically if it has an IDE, SCSI, or other
    interface)

    The brand and model of your video card

    The amount of video memory on your video card

    The brand and model of your monitor, as well as need to know of the monitor''s
    vertical and horizontal sync ranges (You can find this information in the monitor''s
    manual)

    The type of mouse you are using (PS/2 or serial, two buttons or three)

    If your computer has a SCSI adapter, its brand and model

    The printer type you will use, if any. You also need to know how the printer connects
    to the computer. If you will print through a network, you need all the correct
    network connection information for the printer.


    If your computer is on a network, you need to know:


    +   The type of network card your computer has. You also need to determine configuration
    information the card''s driver may require.'
  merge: -1
  img_proc: true
- pgno: 524
  md: "+   \n■ Your computer’s IP address configuration information. You need to determine\
    \ if your computer has a static IP address or if it uses BOOTP or DHCP. You also\
    \ need to know the IP address of your default gateway and primary name server.\
    \ (If you have a secondary and tertiary name server, you need their IP addresses\
    \ as well.) Your network administrator can provide all this information.\n\nAfter\
    \ you collect this information, you should compare it with Red Hat’s hardware\
    \ compatibility list. You can find the list on the Red Hat Web site at www.redhat.com/hardware.\
    \ The hardware compatibility list shows all the devices that Red Hat Linux supports.\
    \ If any piece of your hardware does not appear on the list, Red Hat Linux may\
    \ not run on your system.\n\nAfter you determine that Red Hat Linux supports your\
    \ hardware, continue to the next installation phase.\n\n# ## Preparing the Linux\
    \ Boot Disk\n\nThe installation process starts from the Linux boot disk. You use\
    \ a program named *rawrite.exe* on the Red Hat CD to make the boot disk.\n\nTo\
    \ make the Red Hat Linux boot disk:\n\n+   1. Insert the Red Hat CD in the CD\
    \ drive.\n2. Insert a blank floppy disk in drive A.\n3. Click the **Start** button,\
    \ then point to **Programs**.\n4. Click **MS-DOS Prompt** on the Programs menu.\
    \ An MS-DOS window appears.\n5. Change the default drive to the CD drive. If the\
    \ CD drive is drive D, type **D:** and press **Enter**. (Likewise, if the CD drive\
    \ is drive E, type **E:** and press **Enter**.)\n6. Type **cd \\dosutils** and\
    \ press **Enter**.\n7. Type **rawrite** and press **Enter**. You see the message:\
    \  \n    Enter disk image source file name:  \n8. Type **..\\images\\boot.img**\
    \ and press **Enter**. You see the message:  \n    Enter target diskette drive:\
    \  \n9. Type **A:** and press **Enter**. You see the message:  \n    Please insert\
    \ a formatted diskette in drive A: and  \n    press —ENTER— :  \n10. Because the\
    \ disk is already in the drive, press **Enter**.\n11. There will be a short delay\
    \ while the program creates the boot disk. When the program ends, you see a DOS\
    \ prompt. You now have a Red Hat boot disk.\n12. Type **exit** and press **Enter**\
    \ to close the MS-DOS Prompt window."
  merge: -1
  img_proc: true
- pgno: 525
  md: '# Preparing the Hard Disk


    Before you can install Linux on your hard drive, you must make room for its partitions.
    This procedure deletes the existing partitions on your hard drive, so the Linux
    installation program can create its own partitions.


    > Caution: As stated before, this type of installation erases *everything* on
    your hard drive. If you have data you wish to keep, perform a backup now. Removing
    your existing partitions permanently erases everything stored on your hard drive.
    You cannot recover data from the disk after you complete these steps!


    For these steps you need a blank floppy disk. (Do not use the Red Hat boot disk
    you created earlier.) To remove your existing partitions:


    +   1. Insert a blank floppy disk in drive A.

    2. Click the **Start** button, then point to **Programs**.

    3. Click **MS-DOS Prompt** on the Programs menu. An MS-DOS window appears.

    4. After the C:\Windows> prompt, type format a:/s and press **Enter**. You are
    asked to insert a new disk for drive A and press **Enter**. Since the disk is
    already inserted, press **Enter**. Execution of this command takes several minutes.
    Once the disk is formatted, you are asked for a volume label. Press **Enter**.
    Next you are asked if you wish to format another disk. Press **n** and then press
    **Enter**.

    5. When the format command finishes, type **cd command** and press **Enter**.
    Your prompt changes to C:\Windows\Command>.

    6. After the prompt, type **copy fdisk.exe a:** and press **Enter**.

    7. With the disk still in drive A:, restart your computer.

    8. After the A:1> prompt, type **fdisk** and press **Enter**. If a message asks
    if you want to enable large disk support, type **N** for no and then press **Enter**.
    You see the DOS Fdisk menu.

    9. Option 4 on the menu reads, “Display partition information.” Type **4** and
    press **Enter** to select this option.

    10. On the next screen you see a list of partitions. Under the “Type” column you
    see the type of each partition. You may see any of these types: primary-DOS, non-DOS,
    extended partitions, and logical drives. Under the “Volume Label” column you see
    the volume labels of each labeled partition. Note each type of partition listed
    and its volume label. You will need this information later.

    11. Press **Esc** to return to the main Fdisk menu.

    12. Option 3 on the menu reads “Delete partition or logical DOS drive.” Type **3**
    and press **Enter** to select this option.'
  merge: -1
  img_proc: true
- pgno: 526
  md: '13 You now see a menu of options to delete partitions. Each option lets you
    delete a different type of partition. Because you are installing Linux as the
    sole operating system, you delete all partitions you saw listed while completing
    Step 10. For example, to delete the primary DOS partition, you must select option
    1 from the menu, so type 1 and press Enter. You see a screen that displays partition
    information and a message warning that you will lose data in the deleted primary
    DOS partition. You are asked, “What primary partition do you want to delete?”
    Type the partition number and press Enter. (The partition number is in the “Partition”
    column.) Next, you are asked to enter the partition’s volume label. If the partition
    does not have a volume label, type it and press Enter. If the partition has a
    volume label, simply press Enter. Last, you see a message that asks, “Are you
    sure (Y/N).” Type Y and press Enter. This deletes the partition (along with data
    previously stored there), and you see the main Fdisk menu. You must repeat this
    step for each partition on the disk.


    14 Now you have removed all previously installed partitions and erased the hard
    drive’s contents. Press Esc to exit the Fdisk program. You are ready to begin
    the Red Hat installation described in the next section.


    # # Installing Red Hat Linux 6.0


    The Red Hat installation program runs in “text mode” but displays screens that
    look like dialog boxes with buttons, scrolling lists, and other items common to
    graphical user interfaces. Although the program does not support a mouse, you
    can easily select items and activate buttons with keystrokes. Here is a summary
    of the keystrokes used during the installation process:


    +   * Tab key: Highlights the next item on the screen

    * Alt+Tab: Highlights the previous item on the screen

    * Up-arrow and down-arrow: Scrolls through a list of selections, or move to the
    next item on the screen

    * Spacebar: Selects the currently highlighted item, or deselects it if it is already
    selected

    * Enter: Presses the highlighted button


    You typically find these types of buttons on an installation screen:


    +   * OK: Accepts the values entered on the screen and moves to the next screen

    * Cancel: Cancels the current operation or the installation process

    * Yes: Answers “yes” to the question that appears on the screen

    * No: Answers “no” to the question that appears on the screen

    * Back: Moves back to the previous screen'
  merge: -1
  img_proc: true
