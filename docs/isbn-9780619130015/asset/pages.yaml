    # CGI Overview


    Perl is the most commonly used language for **CGI (Common Gateway Interface) programming**.
    CGI is a protocol, or set of rules, governing how browsers and servers communicate.
    Any script that sends or receives information from a server needs to follow the
    standards specified by CGI. Thus, scripts written in Perl follow the CGI protocol.
    CGI Perl scripts are specifically written to get, process, and return information
    through your Web pages, that is, they make your Web pages interactive.


    To allow your HTML document to accept input, especially where CGI rules apply,
    precede the input area with a description of what you want users to enter. For
    example, if you want users to enter cost, you would use this code:


    ```

    Total Cost? <INPUT TYPE=text NAME=cost SIZE=10>

    ```


    In addition, consistent with transmitting information to and from Web sites, you
    can use the special code INPUT TYPE=submit, which sends the data out when a user
    clicks the Submit button. The destination that you wish to receive the submitted'
