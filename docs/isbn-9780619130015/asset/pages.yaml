    # ## Creating a C Program to Accept Input


    You can draw from many standard library functions to accept input; that is, enter
    characters using the keyboard. Some like getchar() are character-oriented, while
    others like scanf() are field-oriented. This section concentrates on scanf().


    Unlike many other library input functions, scanf can be used to input values of
    a variety of data types. You use it like this:


    ```

    Syntax

    scanf(control string, address, address,...);

    ```


    The scanf() function uses a control string with format specifiers in a manner
    similar to printf. The arguments that follow the control string are the addresses
    of variables where the input is to be stored. Consider the following example.


    ```

    scanf("%d", &age);

    ```


    The %d format specifier works just like it does for printf. Here it indicates
    that scanf() should interpret the input value as a decimal integer.


    The &age argument tells scanf to store the input value in the variable age. The
    & is the address operator. When used with a general variable, it returns the memory
    address where this variable is located. The scanf() function needs the address
    of a variable to store an input value there. The next example shows how scanf()
    can be used to input a string.


    ```

    scanf("%s", city);

    ```


    Notice that this example does not use the & operator. Anytime you use the name
    of an array, it resolves to the address of the first element. It would be an error
    to use the & operator with the name of an array.


    The format specifiers for scanf() are generally the same as those used with printf().
    Table 10-6 shows the format specifiers for scanf().'
