    # Program Format


    As mentioned earlier, C programs are made up of one or more functions. Every function
    must have a name, and every C program must have a function called **main**. Here
    is a very simple C program:


    ```

    ```c

    int main()

    {

    }

    ```

    ```


    This program does absolutely nothing, yet it contains all the elements necessary
    for a valid C program. The next two paragraphs examine the bare essentials.


    Note the word “main” followed by a set of parentheses. (A following section, “Specifying
    Data Types,” defines the first item—int.) This is the name of a function. As mentioned
    earlier, all C programs must have a function called main. The parentheses denote
    that this is a function name.


    On the next line is an opening brace. In a C program this denotes the beginning
    of a block of code. The closing brace on the next line denotes the end of the
    block of code. All functions must have an opening and a closing brace. The statements
    that normally make up the function appear between the two braces. In the sample
    program there are no statements; therefore, the function does nothing. The braces
    are still required.


    # Including Comments


    The /\* symbol denotes the beginning of a comment, and the \*/ symbol denotes
    the end of a comment. The compiler ignores everything in between. This example
    shows a C program comment:


    ```

    ```c

    /* Here is a program that does nothing. */

    int main()

    {

    }

    ```

    ```'
