    Notice that the command deleted all characters in “full”---every f, u and l---from
    the output, rather than occurrences of the word “full”.


    The -s option of the tr command checks for sequences of a *string1* character
    repeated several consecutive times. When this happens, tr replaces the sequence
    of repeated characters with one occurrence of the corresponding character from
    *string2*. For example, use the -s option when you need to change a field delimiter
    in a flat file from one character to another. For example, in the file zoo2, use
    tr to replace the field delimiter “:” with a space character, “ ”. First, use
    cat to display the file.


