  img_proc: true
- pgno: 87
  md: 'called a **bitmap**—that must be translated by graphics software, commonly
    called a graphics viewer, which transforms a complex array of bits into an image.


    # Executable Program Files


    Many programmers develop source code for their programs by writing text files;
    then they compile these files to convert them to executable program files. **Executable
    program files** contain pure binary or machine language that the computer can
    immediately use or execute.


    # Using Editors


    Editors let you create and edit ASCII files. UNIX normally includes the two editors
    vi and Emacs. They are **screen editors**: they display the text you are editing
    one screen at a time and let you move around the screen to change and add text.
    You can also use a line editor to edit text files. A **line editor** lets you
    work with only one line or group of lines at a time. Although line editors do
    not let you see the context of your editing, they are useful for general tasks
    such as searching, replacing, and copying blocks of text.


    # Using the vi Editor


    The vi editor is so called because it is visual—it immediately displays on screen
    the changes you make to text. It is also a **modal editor**; that is, it works
    in two modes: insert mode and command mode. **Insert mode** lets you enter text;
    **command mode** lets you enter commands to perform editing tasks, such as moving
    through the file and deleting text.


    Now you''re ready to write your first memo using the vi editor. To do so, you
    complete the following tasks:


    +   - Create a new file in the vi editor

    - Insert, edit, and delete text

    - Search and replace text

    - Add text from other files

    - Copy, cut, and paste text

    - Print a file

    - Save a file and exit vi


    # Creating a New File in the vi Editor


    Start by creating a file called temp to hold your first memo summarizing the basic
    features of text files. To start vi and with a new file, you type vi followed
    by the new file''s name.'
