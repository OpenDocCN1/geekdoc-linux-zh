    You will learn more about the `rm` command in Chapter 4.


    # Setting File Permissions


    Because UNIX is a multi-user system, users can set permissions for files they
    own so that others can read, write, or execute their files. A file’s owner is
    the person who created it. The permissions the owner sets are listed as part of
    the file description. Figure 2-7 shows directory listings that describe file types.


    | File type | Meaning |

    |---|---|

    | - | Normal file |

    | d | Subdirectory |

    | l | Symbolic link |

    | b | Block device file |

    | c | Character device file |


    ```

