    Network components are software, hardware, protocols, and services necessary to
    establish a network connection. You should see each of these components: Client
    for Microsoft Networks, Dial-Up Adapter, and TCP/IP. If all these components are
    listed, skip to the “Configuring Your System’s Network Connection.” If any are
    missing, you must install them by continuing to the next steps.


