- pgno: 211
  md: "# ## Looping Logic\n\nIn **looping logic**, a control structure (or loop) repeats\
    \ until some condition exists or some action occurs. You will learn two looping\
    \ mechanisms in this section: the for loop and the while loop.\n\nYou use the\
    \ **for** command for looping through a range of values. It causes a variable\
    \ to take on each value in a specified set, one at a time, and perform some action\
    \ while the variable contains each individual value. The loop stops after the\
    \ variable has taken on the last value in the set and has performed the specified\
    \ action with that value.\n\n**To demonstrate looping logic:**\n\n+   1. Create\
    \ the file our_users with vi or Emacs.\n2. Type the following lines into the file:\n\
    \n    ```\n    for USERS in john ellen tom becky eli jill\n    do\n        echo\
    \ $USERS\n    done\n    ```\n\n3. Save the file and exit the editor.\n4. Give\
    \ the file execute permission, and run it. Your screen appears similar to Figure\
    \ 6-3.\n\n![](img/6d8286a85e2d8ad63e16f1801102da59_211_0.png)\n\nThe *for* statement\
    \ you typed in Step 2 specifies that the variable USERS take on the values john,\
    \ ellen, tom, becky, eli, and jill. Because there are six values in the set,"
  merge: -1
  img_proc: true
- pgno: 212
  md: 'the loop repeats six times. Each time it repeats, USERS contains a different
    value from the set, and the statement between the do and done statements is executed.
    The first value in the set is john, so the echo statement executes the first time
    with john stored in USERS. That is why john appears on the screen. The second
    time the loop executes, USERS contains ellen, so the echo statement displays ellen.
    This procedure repeats until no other names are left in the set.


    **Executing Control Structures at the Command Line** Most shell script control
    structures, such as the if and for statements, must be written across several
    lines. This does not prevent you from executing them directly on the command line,
    however.


    To demonstrate entering program control structures at the command line:


    ■ Enter the following. Note you will type directly from the command line and not
    into a script file.


    ```

    ```

    $ for myhobbies in tennis swimming movies travel <Enter>

    > do <Enter>

    > echo $myhobbies <Enter>

    > done <Enter>

    ```

    ```


    After you finish typing you see results similar to Figure 6-4.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_212_0.png)


    **Figure 6-4:** Results of for loop typed at command line


    The shell knows more code will come after you type the first line. It displays
    the > prompt indicating it is ready for the control structure’s continuation.
    The shell reads further input lines until you type the word “done,” which marks
    the end of a for loop.'
