- pgno: 350
  md: "terminates. Two commands inside the while loop are enclosed within curly braces:\
    \ print “$_” displays each record that is read in, and ++$line_count increments\
    \ (counts) the records in the file. The last command, print (“File \\$filein\\\
    ”, has \\$line_count lines. \\n”) prints the name of the file (saved in \\$filein)\
    \ and the number of lines in the file.\n\nNext, you learn how to open the file\
    \ from within your program, as opposed to passing it on the command line. All\
    \ files opened inside programs must be closed before the program terminates.\n\
    \n# To use Perl to open a file from within a program:\n\n+   1.  Use the editor\
    \ of your choice to create the file perread.p2.\n\n+   2.  Enter this Perl program:\n\
    \n```\n#!/usr/bin/perl\n# program name: perread.p2\n# purpose: Open disk file.\
    \ Read and display the records in\n#             the file. Count the number of\
    \ records in the\n#             file.\n\nopen (FILEIN, \"students\") || warn \"\
    Could not open students\nfile\\n\";\nwhile (<FILEIN>)\n{\n    print \"$_\";\n\
    \    ++$line_count;\n}\nprint (\"File \\\"students\\\" has \\$line_count lines.\
    \ \\n\");\nclose (FILEIN);\n```\n\n+   3.  Save the file and quit the editor.\n\
    \n+   4.  Give the file execute permission.\n\n+   5.  Test the program by typing\
    \ ./perread.p2 and then pressing Enter. Your screen should then display the contents\
