  md: '| Format Specifier | Interpretation |

    | :--- | :--- |

    | %c | Single character |

    | %d | Signed decimal integer |

    | %e, %f, %g | Floating-point number |

    | %E, %G | Floating-point number |

    | %i | Signed decimal integer |

    | %o | Signed octal integer |

    | %p | Pointer |

    | %s | String. Ignores leading white-space characters, then reads until it encounters
    another white-space character. |

    | %u | Unsigned decimal integer |

    | %x, %X | Signed hex integer |


    **Table 10-6:** *scanf()* format specifiers


    Table 10-7 shows a list of modifiers you can use with scanf format specifiers.


    | Modifier | Meaning |

    | :--- | :--- |

    | h | Used to indicate a short int or short unsigned int. Example: "%hd" |

    | l | Used to indicate a long int or long unsigned int. Example: "%ld" Also used
    to indicate a double. Example: "%lf" |

    | L | Used to indicate a long double. Example: "%Lf" |


    **Table 10-7:** Modifiers for *scanf()* format specifiers


    Although it rarely contributes to a program''s user-friendliness, the scanf statement
    can accept multiple inputs. Here is an example:


    ```

    scanf("%d %f %d", &x, &y, &z);

    ```'
