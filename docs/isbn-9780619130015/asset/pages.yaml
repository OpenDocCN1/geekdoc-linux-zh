- pgno: 54
  md: 'Note that the first table in Figure 2-2 identifies “hda” as the device, which
    indicates an IDE drive. The second table identifies “sda” as the device, which
    indicates a SCSI drive.


    # ## Setting Up Hard Disk Partitions


    Partitioning your hard disk provides organized space to contain your file systems.
    If one file system fails, you can work with another. This section provides general
    guidelines on how to partition hard disks. These recommendations are suggestions
    only. How you partition your hard drive may vary depending on your system’s configuration,
    number of users, and planned use. Partition size is measured in megabytes (MB,
    about a million characters) or gigabytes (GB—about a billion characters). You
    should have at least three separate partitions to store your file systems: root,
    swap, and /usr.


    Begin by setting up a partition for the root file system. A partition must be
    mounted before it becomes part of the file system. The kernel mounts the root
    file system when the system starts. The kernel has no other information about
    the computer’s other file systems, so all the information and programs the kernel
    needs to start the system must be present on the root partition. To protect this
    critical information, separate partitions are often used for other system data.


    The root partition can be small to leave space for other file systems. A corrupted
    root file system makes the system unbootable. Red Hat and most Linux distributors
    recommend a root partition size of no more than 120 MB.


    After creating the root partition, you should set up the **swap** partition. The
    swap partition acts like an extension of memory, so that UNIX has more room to
    run large programs. Linux distributors suggest that your swap space be twice the
    size of your computer’s internal memory (RAM). For example, if your computer has
    64 MB of RAM, you should allocate 128 MB for the swap partition. See Appendix
    C, “Installing Red Hat 6.x,” for more information.


    The **/usr** partition stores all the non-kernel operating system programs that
    make the computer useful. These programs include software development packages
    that support computer programming, networking, Internet access, graphical screens
    (including X-Windows), and the large number of UNIX **utilities** (programs that
    perform utilitarian operations like copying files, listing directories, and communicating
    with other users). The usr partition should be the largest of the three partitions,
    at least 600 MB.


    In addition to these three separate partitions, you can create a **/home** partition,
    the home directory for all users’ directories. A separate /home partition makes
    many system administration tasks such as backing up data more efficient.


    For example, Dominion Consulting partitions a PC with 32 MB of RAM and allocates
    2 GB of hard disk space for UNIX, allowing 120 MB for the root partition, 1400
    MB for the /usr partition, 32 MB for the swap partition, and 448 MB for the /home
    partition.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# The /usr Partition


    The /usr partition is a large partition that stores most operating system files
    and programs. Most Linux distributors, including Red Hat, offer you the option
    to “install everything” from their CD-ROM and store most of these files in the
    /usr partition. This is true of other UNIX systems as well. Software development
    tools such as language compilers, shared libraries, and header files needed for
    program creation are also stored in a hierarchy of subdirectories starting at
    /usr.


    # The /home Partition


    The /home partition is the storage space for all users’ work. If the root partition
    (or any other partition) crashes, having a /home partition ensures that you do
    not lose all the users’ information. Although regular user accounts are restricted
    from reading information in other partitions, you own and can access most files
    in your home directory. You can grant or deny access to your files as you choose.
    See “Setting File Permissions” later in this chapter for more information on file
    ownership.


    The size of the partition on a system for all users’ home directories depends
    on how many users the system supports. Thirty users probably need a total of 3000
    MB, that is, 3 GB (3 billion characters). This scheme gives users an average of
    100 MB each to store their work. The space allocated depends on how much data
    each user needs to store.


    # The swap Partition


    Swap partitions support virtual memory. Virtual memory means you have an unlimited
    memory resource—swap partitions try to meet this goal by providing swap space
    on disk and treating it like an extension of memory (RAM). It is called swap space
    because the system can use it to swap information between disk and RAM. Setting
    up swap space makes your computer run faster and more efficiently. If your computer
    has 16 MB of RAM or less, you must allocate some disk space to a swap partition.
    Even if your computer has more than 16 MB of RAM, swap space is recommended for
    all UNIX systems. The minimum amount of swap space should equal your RAM.


    > tip


    You can create and use more than one swap partition on Linux. Having multiple
    swap partitions spread across several hard disks can sometimes improve application
    performance on busy systems.


    # Exploring the Root File System


    The root (/) file system is mounted by the kernel when the system starts. To mount
    a file system is to connect it to the directory tree structure. The system administrator
    uses the mount command to mount a file system. The syntax of the mount command
    is:'
  merge: -1
  img_proc: true
- pgno: 56
  md: '**Syntax**


    *mount* ***device-name*** *mount-point*


    +   **Dissection**


    *   ***device-name*** identifies the partition (file system) to mount.

    *   ***mount-point*** identifies the directory where you want to mount the file
    system.


    See “Using the mount Command” later in this chapter for more information about
    the mount command.


    UNIX must mount a file system before any programs can access files on that file
    system. After mounting, the root file system is accessible for reading only. The
    root file system contains all essential programs for file system repair, restoring
    from a backup, starting the system, and initializing all devices and operating
    resources. It also contains the information for mounting all other file systems.
    Nothing beyond these essentials should reside in the root partition.


    > You can restore a “crashed” root partition using rescue files stored on floppy
    disks or tape. The installation media that comes with Red Hat Linux can be used
    to create rescue disks.


    The root directory itself generally contains subdirectories that contain files.
    The next sections describe the more frequently referenced subdirectories of the
    root file system.


    # The /bin Directory


    The /bin directory contains **binaries**, or **executables**, the programs needed
    to start the system and perform other essential system tasks. This directory holds
    many programs that all users need to work with UNIX.


    # The /boot Directory


    The /boot directory normally contains the files that the **bootstrap loader**
    (the utility that starts the operating system) needs and the kernel (operating
    system) images.


    # The /dev Directory


    Files in /dev reference system devices. They access system devices and resources
    such as hard disks, the mouse, printers, consoles, modems, memory, floppy disks,
    and the CD-ROM drive. All UNIX versions include many device files in the /dev
    directory to accommodate separate vendor devices that can be attached to the computer.
    The device files are divided into two major classifications: block types and character
    types. The type indicates the method of data transmission on the device, either
    as a block of characters or as a serial flow of characters. You can see the list
    of device files by typing *ls -l /dev* after the command prompt. (See “Listing
    Directory Contents” later in this chapter for more information on the ls command.)
    The leftmost character on the list tells you whether the file is a character device
    (c) or a block device (b) as shown in Figure 2-3.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_57_0.png)


    # Figure 2-3: Device files in /dev


    Explanations of the items listed in Figure 2-3 follow:


    +   - **console** refers to the system''s console—that is, the monitor connected
    directly to your system.

    - **ttyS1** and **cua1** are devices used to access serial ports. For example,
    /dev/ttyS1 refers to COM2, the communication port on your PC.

    - **cua** devices are "calout" devices used in conjunction with a modem.

    - Device names beginning with **hd** access IDE hard drives.

    - Device names beginning with **sd** are SCSI drives.

    - Device names beginning with **lp** access pararllel ports. The lp0 device refers
    to LPT1, the line printing.

    - **null** is a "black hole"—any data sent to this device is gone forever. Use
    this device when you want to suppress the output of a command appearing on your
    screen. Chapters 6 and 7 discuss this technique.

    - Device names beginning with **tty** refer to terminals or consoles. Several
    "virtual consoles" are available on your Linux system. (You access them by pressing
    Alt+F1, Alt+F2, and so on.) Chapter 11 discusses virtual consoles, which let you
    switch between screens.

    - Device names beginning with **pty** are "pseudo-terminals." They are used to
    provide a terminal to remote login sessions. For example, if your machine is on
    a network, incoming remote logins would use one of the pty devices in /dev.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# The /etc Directory


    The /etc directory contains configuration files the system uses when the computer
    starts. Most of this directory is reserved for the system administrator, and it
    contains system-critical information stored in files:


    +   - **passwd**, the user database

    - **rc**, scripts or directories of scripts to run when the system starts

    - **fstab**, lists of file systems mounted automatically when the system starts

    - **group**, the user group database

    - **inittab**, the configuration file for the **init** program that performs essential
    chores when the system starts

    - **motd**, the message of the day file

    - **printcap**, the printer capability database

    - **termcap**, the terminal capability database

    - **profile** and **bashrc**, files executed at logon that let the system administrator
    set global defaults for all users

    - **login.defs**, the configuration file for the **login** command


    # The /lib Directory


    This directory houses the **shared library images**, files that programmers generally
    use to share code in the libraries rather than creating copies of this code in
    their programs. This makes the programs smaller. Many files in this directory
    are symbolic links to other library files. A **symbolic link** is a name that
    points to and lets you access a file located in a directory other than the current
    directory. In the directory’s long listing, *l* in the leftmost position identifies
    files that are symbolic links.


    # The /mnt Directory


    Mount points for temporary mounts by the system administrator reside in the /mnt
    directory. This directory is often divided into subdirectories such as /mnt/cdrom
    and /mnt/floppy, to clearly specify device types.


    # The /proc Directory


    The /proc directory occupies no space on the disk: it is a **virtual file system**
    allocated in memory only. Files in /proc refer to various processes running on
    the system, as well as details about the operating system kernel.


    # The /root Directory


    The /root directory is the home directory for the root user—the system administrator.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# The /sbin Directory


    The /sbin directory is reserved for the system administrator. Programs that start
    the system, programs needed for file system repair, and essential network programs
    are stored here.


    # The /tmp Directory


    Many programs need a temporary place to store data during processing cycles. The
    traditional location for these files is the /tmp directory.


    # The /var Directory


    The /var directory holds subdirectories whose sizes often change. These subdirectories
    contain files such as error logs and other system performance logs that are useful
    to the system administrator. The /var/spool/mail subdirectory contains mail from
    the network, which remains there until you read and delete it.


    # Using the mount Command


    As you learned, UNIX uses the mount command to connect the file system partitions
    to the directory tree when the system starts. Users can access virtually any file
    system that has been mounted and to which they have been granted permission. Additional
    file systems can be mounted at any time using the mount command. The floppy disk
    and CD-ROM drive are the file system devices beyond the hard disk that are most
    commonly mounted.


    > tip

    To ensure security on the system, only the root user can normally use the mount
    command. Ordinary users can sometimes mount and unmount file systems located on
    floppy disks and CDs.


    Suppose you want to access files on a CD for the Dominion Consulting database.
    The system administrator mounts a CD-ROM by inserting a disk in the drive and
    uses the following mount command:


    ```

    mount -t iso9660 -r /dev/cdrom /mnt/cdrom

    ```


    This command mounts the CD on a device called “cdrom” located in the /dev directory.
    The actual mount point in UNIX is /mnt/cdrom, a directory that references the
    CD-ROM device. Once the CD is mounted, you can access its files through the /mnt/cdrom
    directory. UNIX supports several different types of file systems. The type of
    file system is specified with the -t option. CD-ROMS are classified as iso9660
    devices, so the system administrator types -t, followed by the argument iso9660.
    The -r indicates that the CD-ROM device is read-only.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'You also want to store back-up files on a floppy disk. The system administrator
    mounts a floppy disk in the floppy drive using the command:

    `mount /dev/fd0 /mnt/floppy`


    This command mounts the floppy in the first floppy drive, which is the device
    `/dev/fd0`, to the mount point, `/mnt/floppy`, in the UNIX file structure. Any
    files stored in the directory `/mnt/floppy` are written to the floppy.


    After accessing manually mounted file systems, the system administrator unmounts
    them using the umount command before removing the storage media, as in these examples:

    `umount /mnt/floppy`

    `umount /mnt/cdrom`


    See Appendix B, "The UNIX Command Syntax Guide to the Linux Shell and Utility
    Programs," for a brief description of the mount and umount commands.


    # ## Understanding Paths and Pathnames


    As you learned, all UNIX files are stored in directories in the file system, starting
    from the root directory. To specify a file or directory, use its **pathname**,
    which follows the branches of the file system to the desired file. A forward slash
    ( / ) separates each directory name. For example, suppose you want to specify
    the location of the file phones.502. You know that it resides in the source directory,
    in Jean’s home directory, illustrated in Figure 2-1. You can specify this file’s
    location as `/home/jean/source/phones.502`.


    # ### Using Your Command-line Prompt


    The UNIX command prompt may indicate your location within the file system. For
    example, the prompt `[jean@eli jean]$` is probably the **default prompt** that
    the system generated when the system administrator first created the login account.
    The prompt `[jean@eli jean]$` means that "jean" is the user working on the host
    machine called "eli" in her home directory, which bears her user name, "jean."
    In other words, "jean is at eli in her home directory." When Jean changes her
    location to `/home/jean/source`, her prompt looks like:

    `[jean@eli source]`


    When the system is initially installed, the default root prompt looks like this:
    `[root@spirit root]#`. To simplify the meaning of the command prompts in this
    book, the steps use $ to represent the ordinary user’s command prompt and # to
    represent the system administrator’s command prompt.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Customizing Your Prompt


    Your login prompt is configured automatically when you login. An environment variable,
    PS1, contains special formatting characters that determine your prompt''s configuration.


    > **To see the contents of the PS1 environment variable:**


    **1** Type `echo $PS1` and press **Enter**.


    **2** You see the contents of the PS1 variable, which may appear as:

    `[\u@\h \W]\$`


    Characters that begin with \\ are special Bash shell formatting characters. \\u
    prints the user name, \\h prints the system host name, and \\W prints the name
    of the working directory. The \\$ character prints either a # or a $, depending
    on the type of user logged on. The brackets, [ and ], and the space that separates
    \\h and \\W, are not special characters, so they are printed just as they appear.
    When Jean is logged on to the system eli and working in her home directory, her
    prompt appears as [jean@eli jean]$ in the format shown above.


    Table 2-1 shows other formatting characters for configuring your Bash shell prompt.


    | **Formatting character** | **Purpose** |

    | :--- | :--- |

    | \\d | Displays the date |

    | \\h | Displays the host name |

    | \\n | Displays a new line |

    | \\nnn | Displays the ASCII character that corresponds to the octal number *nnn*.
    |

    | \\s | Displays the shell name |

    | \\t | Displays the time |

    | \\u | Displays the user name |

    | \\w | Displays the path of the working directory |

    | \\W | Displays the name of the working directory without any other path information
    |

    | \\! | Displays the number of the current command in the command history |


    Table 2-1: Formatting characters for configuring a Bash shell prompt'
  merge: -1
  img_proc: true
- pgno: 62
  md: '| Formatting character | Purpose |

    | :--- | :--- |

    | \# | Displays the number of the command in the current session |

    | \$ | Displays a # if root is the user, otherwise displays a $ |

    | \[ | Marks the beginning of a sequence of non-printing characters, such as a
    control sequence |

    | \] | Marks the end of a sequence of non-printing characters |

    | \\ | Displays a \ character |


    Table 2-1: Formatting characters for configuring a Bash shell prompt (continued)


    # To configure your Bash shell prompt:


    +   1  To change your prompt to display the date and time, type `PS1=''\d \t>''`
    and press **Enter**. Type the command with no spaces between the characters. Your
    prompt now looks similar to:


    Tue Jul 5 09:18:33>

    2  To change your prompt to display the current working directory, type `PS1=''\w>''`
    and press **Enter**. Your prompt now looks similar to:


    ~>


    The\w formatting character displays the ~ to represent the user''s home directory.
    To change your prompt to display the full path of the current working directory,
    you must use another environment variable, PWD. The PWD variable contains the
    full pathname of the current working directory.

    3  To display the PWD variable in the prompt, type `PS1=''$PWD>''` and press **Enter**.
    (Notice that you must place the $ sign in front of the environment variable name
    to extract its contents.) Your prompt now looks similar to:


    /home/jean>

    4  Log out of the system, and log back on to reset your prompt to its default
    configuration.


    # The pwd Command


    You can use the UNIX pwd command to display your current path (pwd stands for
    **print working directory**).'
  merge: -1
