    # Sorting the Phone List


    To sort the phone list, make a minor revision to phlist1 to load the functions
    and then call sort_name to redirect the sorted output to a temporary file. The
    sorted temporary file serves as input to the Awk program that displays the records.
    The revised code will use the CLEAR variable also.


    To sort the phone listing:

    1. Make sure you are in the source directory. Use the vi or Emacs editor to add
    the code to the phlist1 script. The additions and revisions are in boldface.


    ```

    ```bash

    #!/bin/bash

    #==============================================================

    # Script Name: phlist1

    # By:      JQD

    # Date:    March 1999

    # Purpose:Use awk to format a colon-separated set of fields

    #        in a flat file and display to the screen

    # Command line:     bash phlist  <enter>

    # ==============================================================

    echo "$CLEAR"

    cursor 2 20; echo "Corporate Phone List"

    cursor 3 20; echo "==================="

    cursor 5 0;

    sort_name > sorted_phones

    awk -F'': '' { printf "%-12s %-12s %s\t%s%s$10.10s $s\n",

    $2, $3, $4, $1, $5, $6, $7 } '' sorted_phones


    cursor 23 1; echo "Review"

    cursor 23 8; read prompt

    ```

    ```


    2. This code assumes you have modified your .bashrc file so it loads the functions
    in .myfuncs when you log on. Save the file and exit the editor.


