- pgno: 26
  md: '# ## Entering Commands


    To interact with UNIX, you enter a **command**, text you type after the command
    prompt. When you finish typing the command, press Enter. UNIX is **case-sensitive**,
    that is, it distinguishes between uppercase and lowercase letters, so that *john*
    differs from *John*. You type most UNIX commands in lowercase. Commands are divided
    into two categories: user-level commands that you type to perform tasks, such
    as retrieve information or communicate with other users; and system-administration
    commands, which the system administrator uses to manage the system.


    You must know a command''s syntax to enter it properly. **Syntax** refers to a
    command''s format and wording, as well as the options and arguments you can use
    to extend and modify its functions. Most commands are single words. If you enter
    a command using correct syntax, UNIX executes the command. Otherwise, you receive
    a message that UNIX cannot interpret your command.


    > > **tip**

    >

    > Appendix B, "Syntax Guide to UNIX Commands," alphabetically lists all the commands
    in this book and tells you how to enter each command and use its options.


    The place on the screen where you type the command is called the **command line**.
    Commands use the following syntax:


    | Syntax | command_name [-option] [value] |

    | :--- | :--- |

    | Dissection | ▪ The **command_name** specifies what operation to perform. In
    the syntax illustrations in this book, command names appear in **boldface**.

    <br>▪ Command **options** are ways to request that UNIX carry out a command in
    a specific style, or variation. Options follow command names, separated by a space.
    They usually begin with a hyphen (-). Options are also case-sensitive. For example,
    -R differs from -r. You do not need to type an option after every command; however,
    some commands do not work unless you specify an option. The syntax illustrations
    in this book list options in square brackets ([ ]) when the command does not require
    them.

    <br>▪ Command **arguments** follow command options, separated by whitespace. Command
    arguments are usually file and directory names. In the syntax illustrations in
    this book, arguments appear in *italics*. Square brackets surround arguments if
    the command does not require them. |


    # ### The date Command


    Use the UNIX date command to display the system date, which the system administrator
    maintains. Because the date and time on a multi-user system are critical for smooth
    processing, only the system administrator can change the date. You start your
    UNIX training at Dominion Consulting by checking the system date.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '**To display your system date:**


    1. Type `date` in the command line, and press **Enter**.

    A date like the one below appears:

    `Mon Apr 20 21:30:08 EST 2000`


    You may see the abbreviation EDT (eastern daylight time) instead of EST (eastern
    standard time), or another time zone abbreviation, such as PDT (Pacific daylight
    time) or CST (central standard time). Notice also that UNIX uses a 24-hour clock.


    2. Type `Date` in the command line, and press **Enter**. You see the following
    system error message:

    `bash: Date: command not found`


    The system error message appears because you must enter the date command, like
    most UNIX commands, in lowercase letters.


    The `date` command has an option, `-u`, which displays the time in Greenwich Mean
    Time (GMT)—GMT is also known as Universal Coordinated Time, for which the abbreviation
    is UTC.


    **To display your system date:**


    *   Type `date -u` in the command line, and press **Enter**.

    A date like the one below appears:

    `Mon Apr 20 23:43:148 UTC 2000`


    # ### The cal Command


    Use the `cal` command to show the system calendar. Your manager at Dominion, Rolf
    Williams, advises you that this is the command commonly used to schedule tasks
    and events.


    **To display your system’s default calendar:**


    1. Type `cal` in the command line, and press **Enter**. Without an option, the
    `cal` command shows a calendar of the current month. Assuming the current month
    is July of the year 2000, you see the default calendar shown in Figure 1-7.'
  merge: -1
  img_proc: true
