    As you can see from the program above, Perl also lets you group operations within
    parentheses. Now that you have a general understanding of Perl, you will study
    its data types.


    # Identifying Data Types


    The computer programmer must understand not only what is contained in files, records,
    and fields, but also the format in which it is stored. Are the fields of information
    numeric or alphabetic? Are the fields made up of a combination of numbers and
    letters? How do you treat control characters such as tab and new-line? Although
    it may seem obvious that a data item such as a person''s name cannot be added
    or multiplied, the programmer must write code that properly handles any and all
    data items that appear in a program. Otherwise, misidentified data generates processing
    errors. To do this, programmers need to identify data types.


    Data may be represented in a Perl program in a variety of ways. You will learn
    about these types of data:


    +   1.  Variables

    2.  Constants

    3.  Scalars

    4.  Arrays

    5.  Hashes'
