    # ### The who Command


    In a multi-user system, knowing who is logged on to the system may be helpful.
    Use the *who* command to see who is using the system and their current location.
    At Dominion, *who* is a useful command for getting to know your co-workers.


    # To use the who command to determine who is logged onto the system:


    +   1. Type **who** in the command line, and press *Enter*.

    2. You see a list like the one below showing user names, the terminals they are
    using, and the dates and the times they logged on.


    ```

    root  tty1  Aug 12  07:56

    ell en  tty1  Aug 12  08:15

    ```'
  merge: -1
