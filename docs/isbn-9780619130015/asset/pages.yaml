  md: '# LESSON B

    objectives


    In this lesson you will:


    +   □ Use the File Manager to navigate the file system and to copy, move, and
    delete files

    □ Execute the built-in calendar, spreadsheet, and editing applications

    □ Copy and paste between windows

    □ Perform basic desktop configuration


    # Running Applications and Customizing the Desktop


    # Running Built-in Applications


    The staff at Dominion Consulting frequently needs programs for calendar, text
    editing, and spreadsheet operations. They could also benefit from a graphical
    file management utility. Your next task is to find built-in applications for all
    these needs. After reading this section and completing its exercises, you will
    be able to:


    +   □ Use the File Manager application to navigate the file system, and to copy,
    move, and delete files

    □ Use the Calendar application to keep appointments and a to-do list

    □ Start the Spreadsheet application and the gEdit application

    □ Copy text from one window and paste it in another

    □ Change your desktop background and your screen saver

    □ Move icons on the panel and add other applers to the panel

    □ Add new icons that launch your own programs on the panel

    □ Add your own programs to the Main menu


    Management has asked you to instruct the other staff members on how to locate
    and execute programs that will help them do their job more productively. They
    also ask you to investigate using a graphical file management tool. You decide
    to consult the GNOME Help Browser and find references to a program called File
    Manager. You''ve also read about a calendar program. Both programs are executed
    from the Main menu.'
