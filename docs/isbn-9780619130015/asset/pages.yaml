- pgno: 16
  md: '# # CHAPTER 1

    ## The Essence of UNIX


    **case** ► Dominion Consulting specializes in management systems for large hotels
    and resorts. Dominion’s founders, Eli Addison and Carmen Scott, recognize the
    need for an in-house computer system that lets their employees work as a team.
    UNIX is an operating system designed for collaborative development of software,
    allowing people to work together and share information in controlled ways. Dominion
    has offered you a position as a UNIX system trainee. Your managers want you to
    understand the basics of operating systems in general, and UNIX in particular.
    They ask you to log on to UNIX and learn how to use some basic commands.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# LESSON A


    # objectives


    After completing this lesson, you should be able to:


    +   ■ Define operating systems in general and the UNIX operating system in particular


    +   ■ Describe Linux as it relates to UNIX


    +   ■ Explain the function of UNIX shells


    +   ■ Describe options for connecting to a UNIX system


    +   ■ Define the syntax used for entering UNIX commands


    +   ■ Use the date, cal, who, man, whatis, and clear commands


    +   ■ Perform basic command-line editing operations


    +   ■ Enter multiple commands on a single command line


    +   ■ Recall a command from the command history


    +   ■ Log on to and log out of UNIX


    # Getting Started with UNIX


    This chapter introduces the UNIX operating system and a few of its basic commands.
    It also explains how you can use Linux to learn UNIX. A variant of UNIX, Linux
    runs on PCs with Intel processors but uses the same file system and commands as
    UNIX, which usually runs on a network. Using Linux on your PC is virtually the
    same as using UNIX on a network.


    After you explore essential background information in this chapter, you begin
    to work with UNIX. If you’re familiar with operating systems in general, then
    some background material may be review for you. This chapter also provides plenty
    of opportunity for hands-on practice of UNIX commands, primarily in the context
    of the opening case. The case study reflects a realistic scenario for the tasks
    you complete in this chapter. You learn to use a variety of basic commands to
    meet the goals of the scenario.


    # Understanding Operating Systems


    An operating system (OS) is the most important program that runs on a computer.
    Operating systems enable you to store information, process raw data, use application
    software, compile your own programs, and access all hardware attached to a computer,
    such as a printer or keyboard. In short, the operating system is the most fundamental'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'computer program. It controls all the computer''s resources and provides the
    base upon which application programs can be used or written. Figure 1-1 shows
    the relationship between an operating system and other parts of a computer system.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_18_0.png)


    Different computer systems may have different operating systems. For example,
    the most common operating systems for personal computers are DOS, OS/2, and Windows.
    Mainframe computers may use Digital Equipment''s VMS operating system or IBM''s
    MVS. Networks also have operating systems, such as Novell NetWare and Windows
    NT. UNIX is the leading operating system for workstations, which are powerful
    computers linked together on a local-area network.


    # PC Operating Systems


    A personal computer system or PC is usually a standalone machine, such as a desktop
    or laptop computer. A PC operating system conducts all the input, output, processing,
    and storage operations on a single computer. Figure 1-2 identifies some popular
    PC operating systems.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_19_0.png)


    Figure 1-2: Common PC operating systems


    # Mainframe Operating Systems


    A mainframe operating system controls a mainframe system, a large computer system
    with multiple processors that conducts input, output, processing, and storage
    operations for many users. Historically, mainframe systems have been popular in
    large corporations and industrial computing. Figure 1-3 shows some recognized
    mainframe operating systems and their manufacturers.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_19_1.png)


    Figure 1-3: Common mainframe operating systems'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Network Operating Systems


    A computer **network** combines the convenience and familiarity of the personal
    computer with the processing power of the mainframe. A network lets multiple users
    share computer resources and files. A **network operating system** controls the
    operations of a **server** computer, sometimes called a **host** computer, which
    accepts requests from user programs running on other machines, called **clients**.
    Figure 1-4 shows the relationship of servers and clients on a network.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_20_0.png)


    ![](img/6d8286a85e2d8ad63e16f1801102da59_20_1.png)


    ![](img/6d8286a85e2d8ad63e16f1801102da59_20_2.png)


    ![](img/6d8286a85e2d8ad63e16f1801102da59_20_3.png)


    ![](img/6d8286a85e2d8ad63e16f1801102da59_20_4.png)


    **Figure 1-4:** Relationship of servers and clients on a network


    In a centralized approach, all the users'' data and applications reside on the
    server. This type of network is called a **server-based network**. The system
    administrator secures all the information on the network by securing the server.
    The system administrator easily maintains the users'' applications and performs
    back-up operations directly on the server. If the server fails, however, the entire
    network fails.


    **Peer-to-peer** networks, which work best for small networks, are more distributed
    than server-based networks. In a peer-to-peer configuration, each system on the
    network is both a server and a client. Data and applications are not centrally
    located but reside on the individual systems in the network. Software upgrades
    and back-up operations must be performed locally at each computer. Security, which
    is implemented on each computer, is not uniform. Each user of the network is,
    to some degree, responsible for administering his or her own system. Despite the
    disadvantages a peer-to-peer network presents to the system administrator, the
    individual users do not depend on a central server. If one computer in the network
    fails, the other systems continue to operate.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Introducing the UNIX Operating System


    UNIX is a multi-user, multitasking operating system with built-in networking functions.
    It can be used on systems functioning as:


    +   - Dedicated servers in a server-based network

    - Client workstations connected to a server-based network

    - Client/server workstations connected to a peer-to-peer network

    - Standalone workstations not connected to a network


    UNIX is a **multi-user system**, which lets many people simultaneously access
    and share the resources of a server computer. Users must **log on** by typing
    their user name and a password before they are allowed to use a multi-user system.
    This validation procedure protects each user''s privacy and safeguards the system
    against unauthorized use. A **multitasking system** lets one user execute more
    than one program at a time. For example, on a multitasking system, you can update
    records in the foreground while your document prints in the background.


    UNIX is also a portable operating system. Its **portability** means it can be
    used in a variety of computing environments. In fact, UNIX runs on a wider variety
    of computers than any other operating system. It also connects to the Internet,
    executing popular programs such as **File Transfer Protocol (FTP)**, an Internet
    protocol used for sending files; and **Telnet**, an Internet terminal emulation
    program. Dominion Consulting chose UNIX as the OS for its computer system because
    many of its employees must work on a range of computers performing a variety of
    tasks at the same time.


    # A Brief History of UNIX


    A group of programmers at Bell Labs originally developed UNIX in the early 1970s.
    Bell Labs distributed UNIX in its source code form, so anyone who used UNIX could
    customize it as needed. Attracted by its portability and low cost, universities
    began to modify the UNIX code to make it work on different machines. Eventually,
    two standard versions of UNIX evolved: AT&T produced System V and University of
    California at Berkeley developed BSD. Using features of both versions, Linux may
    be a more integrated version of UNIX than its predecessors. Currently, the POSIX
    project, a joint effort of experts from industry, academia, and government, is
    working to standardize UNIX.


    # UNIX Concepts


    UNIX pioneered concepts that have been applied to other operating systems. For
    example, Microsoft DOS and Microsoft Windows adopted original UNIX design concepts,
    such as the idea of a **shell**—an interface between the user and the operating
    system—and the hierarchical structure of directories and subdirectories.


    The concept of layered components that make up an operating system also originated
    with UNIX. Layers of software surround the computer system''s inner core to protect
    its vital hardware and software components and to manage the core'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'system and its users. Figure 1-5 shows how the layers of a UNIX system form
    a pyramid structure.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_22_0.png)


    At the bottom of the pyramid is the hardware. At the top are the users. The layers
    provide insulation, assuring system security and user privacy. The **kernel**
    is the base operating system, which interacts directly with the hardware and services
    the user programs. It is only accessible through **kernel mode**, which is reserved
    for the system administrator. This prevents unauthorized commands from invading
    the **foundation layer** or the hardware that supports the entire UNIX structure.
    **User mode** provides access to higher layers where all application software
    resides.


    This layered approach, and all other UNIX features, were designed by programmers,
    for programmers to use in complex software development. Because the programmers
    wrote UNIX in the C programming language, it can be installed on any computer
    that has a C compiler. Its portability, flexibility, and power make UNIX a logical
    choice for network operating systems. And, with the emergence of a new PC version
    called Linux, the popularity of UNIX is increasing.


    # Linux and UNIX


    Linux is a UNIX-like operating system. Linus Torvalds, who released it to the
    public, free of charge, in 1991, originally created Linux. A number of companies
    now distribute professional versions of Linux.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Linux offers all the complexity of UNIX at no cost. It is robust enough to
    handle large tasks with all the networking features of commercial UNIX versions.
    You can install Linux on your PC, where it can coexist with other operating systems,
    and test your UNIX skills. All these features make Linux an excellent way to learn
    UNIX, even when you have access to other computers running on UNIX.


    # Introducing UNIX Shells


    The **shell** is a UNIX program that interprets the commands you enter from the
    keyboard. UNIX provides several shells, including the Bourne shell, the Korn shell,
    and the C shell. Steve Bourne at AT&T Bell Laboratories developed the **Bourne
    shell** as the first UNIX command processor. Another Bell Labs employee, David
    Korn, developed the Korn shell. Compatible with the Bourne shell, the **Korn shell**
    includes many extensions, such as a history feature that lets you use a keyboard
    shortcut to retrieve commands you previously entered. The **C shell** is designed
    for C programmers'' use. Linux uses the freeware **Bash shell** as its default
    command interpreter. Its name is an acronym for "Bourne Again Shell," and it includes
    the best features of the Korn and Bourne shells. No matter which shell you use,
    your communications with UNIX always take place through a shell interpreter. Figure
    1-6 shows the role of the shell in the UNIX operating system.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_23_0.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# ### Choosing Your Shell


    Before working with a UNIX system, you need to determine which shell will serve
    as your command interpreter. Shells do much more than interpret commands: each
    has extensive built-in commands that, in effect, turn them into first-class programming
    languages. (You will pursue this subject in depth in Chapters 6 and 7.) You choose
    a shell when the system administrator sets up your user account. Most users choose
    the Bash shell, although you can choose any of these:


    +   - Bourne

    - Korn

    - C shell

    - Bash

    - tcsh (a freeware shell derived from the C shell)

    - zsh (a freeware shell derived from the Korn shell)


    # ### Switching from Shell to Shell


    After you choose your shell, the system administrator stores your choice in your
    account record, and it becomes your assigned shell. UNIX uses this shell any time
    you log on. However, you can switch from one shell to another by typing the shell''s
    name (such as **tcsh**, **bash**, or **zsh**) on your command line. You work in
    that shell until you log on again or type another shell name on the command line.
    Users often use one shell for writing shell scripts (programs) and another for
    interacting with a program.


    # ## Choosing User Names and Passwords


    Before you can work with UNIX and its programs, you must log on by providing a
    unique user name and password. Decide on a name you want to use to identify yourself
    to the UNIX system, such as “aquinn.” This is the same name others on the UNIX
    system use to send you electronic mail. UNIX recognizes only the first eight characters
    of a user name, so choose a user name with eight or fewer characters.


    You must also choose a password, which must contain five or more characters. The
    password should be easy for you to remember but difficult for others to guess,
    such as your birth date written in a mix of uppercase and lowercase letters, numbers,
    and hyphens. The password can contain letters, numbers, and punctuation symbols
    but not control characters.


    You can log on to any UNIX or Linux system as long as you have a user account
    and password on the host (server) computer. A UNIX system administrator creates
    your account by adding your user name (also called a *login name or user id*)
    and your password. To use this book and the hands-on tutorials, you must connect
    to and establish an account on a UNIX or Linux system using one of these methods:


    +   - Through a Telnet connection to a remote computer

    - As a client on a UNIX client/server network

    - As a peer on a peer-to-peer local-area network in which each computer has the
    Linux operating system installed'
  merge: -1
  img_proc: true
