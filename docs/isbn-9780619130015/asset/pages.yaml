  md: "The operators behave differently depending on which form is used. Assume the\
    \ variable j is set to 4. In this statement,  \nx = j++;\n\nthe ++ operator is\
    \ used in postfix form. This means the assignment operator (=) uses the value\
    \ of j before it is incremented. In effect, it says “set x equal to j, then increment\
    \ j.” After the operation, x will be equal to 4 and j will be equal to 5.\n\n\
    If the prefix form of the operator is used, you get different results:  \nx =\
    \ ++j;\n\nThis statement says “increment j, then set x equal to j.” Both x and\
    \ j will be equal to 5 after the statement executes.\n\n# Generating Formatted\
    \ Output with printf\n\nOne of the most commonly used screen output library functions\
    \ is printf. The f stands for “formatted,” as the function allows you to format\
    \ and print several arguments of differing data types. The printf function is\
    \ used in the following manner:\n\n![](img/6d8286a85e2d8ad63e16f1801102da59_389_0.png)\n\
    \nThe first argument is called the **control string**. It specifies the way formatting\
    \ should occur. Following the control string may be a variable number of arguments.\
    \ Each of these will be an expression whose value is to be printed. Here is perhaps\
    \ the most simple example of a printf statement:  \nprintf(\"Hello\");\n\nThe\
    \ example only uses a control string. The word Hello will be printed as is on\
    \ the screen. Here is another example.  \nprintf(\"Your age is %d\", 30);\n\n\
    The %d that appears in the control string is called a format specifier. It will\
    \ not be printed as part of the message, but tells printf to substitute a decimal\
    \ integer in its place. The decimal integer is the very next argument, the number\
    \ 30. This printf statement prints the following message on the screen:  \nYour\
    \ age is 30\n\nAlthough this example illustrates the usage of the %d format specifier,\
    \ it is not very realistic. You are more likely to use it in the following manner:\
    \  \nprintf(\"Your age is %d\", age);"
