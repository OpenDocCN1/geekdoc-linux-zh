- pgno: 308
  md: '# Removing Garbage Files


    An easy way to free space in your file systems is to remove garbage files. **Garbage
    files** are temporary files, such as a core file, that lose their usefulness after
    several days. A **core file** is created when an executing program attempts to
    do something illegal, like accessing another user''s memory. The UNIX operating
    system detects the attempt and sends a signal to the program. The signal halts
    the offending program and creates a copy of the program and its environment in
    a file named core in the current directory. The programmer who wrote the program
    that “dumps core” (slang for this event) might be interested in dissecting the
    core file with a debugging tool. However, all too often the core file simply languishes
    unused in some branch of the directory hierarchy. All files created this way have
    the same name: core.


    Another file with a generic name is a.out, the default for the output of program
    compilation procedures. Like core files, the true identity of these generically
    named files often gets lost over time. You can use the find command to retrieve
    these wasteful files and execute the rm command to remove them. You can also use
    the find command to search through the directory hierarchy and remove such files.
    You can write a find command so that it locates all files named core and a.out,
    and then remove each one. Here is such a command:


    ```

    find . "( -name a.out -o -name core )" -exec rm {} \\;

    ```


    You have used the find command before to locate files. The command above locates
    every occurrence of the a.out and core files, and then deletes them with the rm
    command. The first argument, dot (.), tells find to start looking in the current
    directory. The argument “(“-name a.out-o-name core”)” uses the -o (OR) operator.
    It tells find to search for files named a.out OR core. The -exec rm option instructs
    find to execute the rm command each time it locates a file with the name being
    searched for. The {} characters are replaced with the matching file name. For
    example, when the command locates an a.out file, the {} are replaced with a.out,
    so the command rm a.out is executed. The \\; terminates the command.


    Now you use the find command to search for and delete all occurrences of a.out
    and core.


    > Note: The steps that follow assume you have a source directory in your home
    directory. The test files, a.out and core, are quickly created using the touch
    command, which, when followed by the filenames, creates empty files. The tilde
    (~) ensures that these files go into your home and source directories.


    +   **To remove garbage files:**

    1 Create some garbage files, core and a.out, and place them in your home directory
    and the subdirectory of home by typing **touch ~/core**, pressing **Enter**, typing
    **touch ~/a.out**, pressing **Enter**, typing **touch ~/source/core**, pressing
    **Enter**, typing **touch ~/source/a.out** and then pressing **Enter**.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '2 Make sure you are in your home directory, then type find . ("" -name a.out
    -o -name core "") and press Enter. Your screen should resemble Figure 8-12.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_309_0.png)


    Figure 8-12: Results of find command


    The results of the find command in Step 2 show the core and a.out files are in
    the current directory and in the source directory.


    Remove the garbage files by typing find . ("" -name a.out -o -name core "") -exec
    rm{} \; and then pressing Enter.


    Check that the files have been removed by repeating the find command you entered
