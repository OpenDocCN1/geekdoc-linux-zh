- pgno: 163
  md: '# Using the wc Command


    Use the wc command to count the number of lines (option -l), words (option -w),
    and bytes or characters (option -c) in text files. You may specify all three options
    in the command line, that is, -lwc. If you enter the command without options,
    you see counts of lines, words, and characters in that order. You can use the
    wc command to count the number of lines in a new file, counters.


    To create a file and count its lines:


    +   1. After the $ command prompt, type cat > counters and press Enter.

    2. Type this text, pressing Enter at the end of each line:


    Linux is a full featured UNIX clone.

    Linux blends the best of BSD and Sys V.


    3. Type Ctrl+D.

    4. To find the number of lines in counters, type wc -l counters and press Enter.
    UNIX reports that the file contains two lines.

    5. To find the number of bytes in counters, type wc -c counters and press Enter.
    UNIX reports that the file contains 77 bytes.

    6. To find the number of words in counters, type wc -w counters and press Enter.
    UNIX reports that the file contains 16 words.

    7. To count words, characters, and lines in counters, type wc -lwc counters and
    press Enter. UNIX reports the counts for lines (2), words (16), and bytes (77).


    # Using the Manipulate and Format Commands


