  md: "You can initialize variables with values at the time they are declared by placing\
    \ an equal sign after the variable name and then a constant value. Here is an\
    \ example:\n\n```\nint days = 5, months = 2, years = 10;\n```\n\n# Understanding\
    \ the Scope of Variables\n\nThe **scope** of a variable is the part of the program\
    \ in which the variable is defined and therefore accessible. You can declare a\
    \ variable either inside a function or any place that is not inside a function.\n\
    \nVariables that are declared inside a function are called **automatic variables**.\
    \ These variables are local to the function in which they are declared. Here is\
    \ an example:\n\n```\n/* This program declares a local variable\n    in function\
    \ main. The program does nothing\n    else. */\nint main()\n{\nint days;\n}\n\
    ```\n\nHere, the variable days is an automatic variable and is local to the function\
    \ main. You can also declare a variable outside of any function, as in the following\
    \ example:\n\n```\n/* This program declares a global variable\n    The program\
    \ does nothing else. */\n\nint days;\nint main()\n{\n}\n```\n\nIn the program\
    \ above, the variable is external, or global. The scope of a global variable is\
    \ the entire program, beginning at the point where the declaration was made. The\
    \ scope of an automatic, or local, variable is the body of the function in which\
    \ it is declared.\n\nThe only place inside a function where local variables may\
    \ be declared is at the beginning of the body of the function—after the opening\
    \ brace and before any statement. You can declare global variables anywhere in\
    \ a program except inside a function.\n\n# Using Math Operators\n\nTable 10-4\
    \ lists the C arithmetic operators."
