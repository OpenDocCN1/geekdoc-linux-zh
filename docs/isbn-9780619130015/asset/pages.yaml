- pgno: 208
  md: "# # Shell Logic Structures\n\nThe four basic logic structures needed for program\
    \ development are sequential logic, decision logic, looping logic, and case logic.\n\
    \n# ## Sequential Logic\n\n**Sequential logic** states that commands will be executed\
    \ in the order in which they appear in the program. The only break in this sequence\
    \ comes when a branch instruction changes the flow of execution. The following\
    \ steps present a very simple example of a shell script using sequential logic.\
    \ You create a simple shell script, seqtotal.\n\n+   **To demonstrate sequential\
    \ logic:**\n\n1. Type `vi seqtotal` and press **Enter**.\n2. Type `i` to switch\
    \ to vi's insert mode.\n3. Type the following lines:\n\n   ```text\n   let a=1\n\
    \   let b=2\n   let c=3\n   let total=a+b+c\n   echo $total\n   ```\n4. Press\
    \ **Esc** to switch to vi's command mode.\n5. Type `:wq` and press **Enter** to\
    \ save the file and exit vi.\n6. Next, test the new shell script, Seqtotal. (To\
    \ save a few keystrokes, you use the `sh` command instead of the `chmod` command.)\
    \ Type `sh seqtotal` and press **Enter**.\n\nYou see the output of the program,\
    \ which is 6.\n\nMany programs are simple, straightforward command sequences.\
    \ An example is the programmer activity report script you wrote in Chapter 5.\
    \ The shell executes the script's commands in the order they appear in the file.\
    \ You use sequential logic to write this type of application.\n\n# ## Decision\
    \ Logic\n\n**Decision logic** enables your program to execute a statement or series\
    \ of statements only if a certain condition exists. The **if statement** is the\
    \ primary decision-making control structure in this type of logic. In the steps\
    \ that follow, notice that the semicolon (;) separates commands on the same line."
  merge: -1
  img_proc: true
- pgno: 209
  md: "Note: Throughout the sample scripts, variables are always enclosed in double\
    \ quotes, as in “$choice,” “$looperst,” “$yesno,” “$guess,” and “$myfavorite,”\
    \ due to how the shell interprets variables. All shell variables, unless declared\
    \ otherwise, are strings, which are arrays of characters. If you do not enter\
    \ data in the string variables, the variables will be treated as blank strings,\
    \ which result in an invalid test. The enclosing double quotes therefore maintain\
    \ the validity of strings, with or without data, and the test is carried out without\
    \ producing an error condition.\n\n# To demonstrate decision logic:\n\n+   1.\
    \ Type **vi os_choice** and press **Enter**.\n2. Type **i** to switch to vi's\
    \ insert mode.\n3. Type the following lines:\n\n```\n```bash\necho -n \"What is\
    \ your favorite operating system? \"\nread OS_NAME\nif [ \"$OS_NAME\" = \"UNIX\"\
    \ ]\nthen\n    echo \"You will like Linux.\"\nelse\n    echo \"You should give\
    \ Linux a try!\"\nfi\n```\n```\n\n+   4. Press **Esc** to switch to vi’s command\
    \ mode.\n5. Type **:wq** and press **Enter** to save the file and exit vi.\n\n\
    Before you run the program, let's examine its contents. The first statement uses\
    \ the echo command to display a message on the screen. The -n option suppresses\
    \ the line feed that normally appears after the message. The second statement\
    \ uses the read command, which waits for the user to type a line of keyboard input.\
    \ The input is stored in the variable specified as the read command's argument.\
    \ The line in the program reads the user's input into the OS_NAME variable.\n\n\
    The next line begins an if statement. The word “if” is followed by an expression\
    \ inside a set of brackets ([ ]). (The spaces that separate the [ and ] characters\
    \ from the enclosed expression are necessary.) The expression, which is tested\
    \ to determine if it is true or false, compares the contents of the OS_NAME variable\
    \ with the string UNIX. (When you use the = operator in an if statement's test\
    \ expression, it tests its two operands for equality. If the operands are equal,\
    \ the expression is true. Otherwise, it is false.) If the contents of the OS_NAME\
    \ variable is equal to UNIX, the statement that follows the word “then” is executed.\
    \ In this program, it is an echo statement.\n\nIf the if statement's expression\
    \ is false (if the contents of the OS_NAME variable does not equal UNIX), the\
    \ statement that follows the word “else” is executed. In this program, it is a\
    \ different echo statement.\n\nNotice the last statement, which is the word fi.\
    \ fi (“if” spelled backward) always marks the end of an if or an if...else statement."
  merge: -1
  img_proc: true
- pgno: 210
  md: "+   **Now, test your code by executing it at least twice:**\n1. Run the program.\n\
    2. When asked to enter the name of your favorite operating system, answer UNIX.\n\
    3. Run the program again and respond with MS-DOS or some other operating system\
    \ name.\n\n![](img/6d8286a85e2d8ad63e16f1801102da59_210_0.png)\n\nRemember to\
    \ use the chmod command first to make the script executable. Then type the script's\
    \ name after the command prompt to execute it. Another way to run the script is\
    \ to use the sh command, as you did with the seqtotal script.\n\nNested Control\
    \ Structures You can nest a control structure, such as the if statement, inside\
    \ another control structure. For example, a program may have an if statement inside\
    \ another if statement. The first if statement controls when the second if statement\
    \ is executed.\n\n+   **To practice writing a nested if statement:**\n1. Open\
    \ the os_choice file in vi or Emacs.\n2. Edit the file so it contains the following\
    \ lines. (Code has been added to the else part of the original if statement.)\n\
    \n```\necho -n \"What is your favorite operating system? \"\nread OS_NAME\nif\
    \ [ \"$OS_NAME\" = \"UNIX\" ]\nthen\n    echo \"You will like Linux.\"\nelse\n\
    \    if [ \"$OS_NAME\" = \"WINDOWS\" ]\n    then\n        echo \"A great OS for\
    \ applications.\"\n    else\n        echo \"You should give Linux a try!\"\n \
    \   fi\nfi\n```\n\n+   3. Execute the program and respond with WINDOWS when asked\
    \ for your favorite operating system.\n\nAs you can see, the second if statement\
    \ is located in the first if statement's else section. It is only executed when\
    \ the first if statement's expression is false.\nDecision logic structures, such\
    \ as the if statement, are used in applications where different courses of action\
    \ are required, depending on the result of a command or comparison."
