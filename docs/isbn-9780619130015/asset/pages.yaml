    # Working with Files in C


    Files are continuous streams of data. They are typically stored on disk. Many
    file operations are sequential, meaning they work from the beginning of the file
    to the end. When the file is opened, you are working with the beginning of the
    file. Every time a byte is read from or written to the file, your current position
    in the file is moved forward by one byte.


    **File Pointers** C file input/output is designed to use file pointers, which
    point to a pre-defined structure that contains information about the file. The
    structure template is found in stdio.h. You must declare a file pointer in order
    to use the I/O package. Here is an example:


    ```

    FILE *fp;

    ```


    This declares fp as a FILE pointer. It will be used with various file access functions.


    **Opening and Closing Files** Before you can use a file, it must be opened. The
    library function for opening a file is fopen. Here is an example.


    ```

    fp = fopen(“myfile.dat”, “r”);

    ```


    The fopen function takes two arguments: the filename and the access mode. This
    example opens a file named myfile.dat. The “r” means that the file will be opened
    for reading. The following statement uses the “w” access mode for writing:


    ```

    fp = fopen(“myfile.dat”, “w”);

    ```'
