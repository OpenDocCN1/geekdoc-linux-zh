- pgno: 169
  md: '# COMMAND SUMMARY


    | Command | Purpose | Options covered in this chapter |

    | :--- | :--- | :--- |

    | comm | Compare and output lines common to two files | |

    | diff | Compare two files and determine which lines differ | |

    | grep | Select lines or rows | -i ignores case<br>-l lists only filenames |

    | pr | Format a specified file | -d double-spaces the output<br>-h customizes
    the header line<br>-In sets the number of lines per page |

    | sed | Specify an editing command or a script file containing sed commands |
    -a \ appends text after a line<br>-d deletes specified text<br>-e specifies multiple
    commands on one line<br>-n indicates line numbers<br>-p displays lines<br>-s substitutes
    specified text |

    | tr | Translate characters | -d deletes input characters found in *string1* from
    the output<br>-s checks for sequences of *string1* repeated consecutive times
    |

    | uniq | Remove duplicate lines to create unique output | |

    | wc | Count the number of lines, bytes, or words in a file | -c counts the number
    of bytes or characters<br>-l counts the number of lines<br>-w counts the number
    of words |


    # SUMMARY


    The UNIX file processing commands can be organized into two categories: select
    commands and manipulation and transformation commands. Select commands extract
    information. Manipulation and transformation commands alter and transform extracted
    information into useful and appealing formats.'
  merge: -1
  img_proc: true
