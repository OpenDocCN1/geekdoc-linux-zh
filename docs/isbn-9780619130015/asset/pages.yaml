  md: "# Guide to UNIX® Using Linux\n\n*Guide to UNIX Using Linux* is a hands-on,\
    \ practical guide that teaches the fundamentals of the UNIX operating system concepts,\
    \ architecture, and administration. These concepts are taught using Linux, a free,\
    \ PC-compatible UNIX clone that is an ideal teaching tool for many basic and advanced\
    \ UNIX commands. The power, stability, and flexibility of UNIX has contributed\
    \ to its popularity in mission-critical business and networking applications.\n\
    \n# About the Authors\n\n**Jack Dent** has 25 years of experience as a programming\
    \ consultant specializing in UNIX and Linux systems, and is the computer science\
    \ department head at International Business College in Fort Wayne, Indiana.\n\n\
    **Tony Gaditis** is the Coordinator of Advanced Technology at Haywood Community\
    \ College in North Carolina. He teaches computer science courses, and is a former\
    \ North Carolina Community College “Teacher of the Year.”\n\n# Key Features of\
    \ *Guide to UNIX Using Linux*\n\n+   - Includes a copy of Red Hat Linux 6.0\n\
    - Covers shell programming, database management, editing, C programming, debugging,\
    \ Internet access, X-Windows basics, and rapid application development using standard\
    \ UNIX tools like awk, sed, and perl\n- Provides users with a working knowledge\
    \ of basic system utilities\n- features review questions, hands-on exercises,\
    \ and discovery exercises at the end of each chapter, allowing students to practice\
    \ skills as they are learned\n\nCourse Technology is part of the Thomson Learning\
    \ family of companies—dedicated to providing innovative approaches to lifelong\
    \ learning.  \n**Thomson is learning.**\n\nVisit Course Technology online at **www.course.com**\n\
    To learn more about our Networking titles,  \nvisit **www.course.com/products/networkingcentral**\n\
    \n![](img/6d8286a85e2d8ad63e16f1801102da59_579_0.png)\n\n0-7600-1142-7\nGuide\
    \ to Operating Systems\nBadgett• Palmer• Jonker\n\n![](img/6d8286a85e2d8ad63e16f1801102da59_579_1.png)\n\
    \n0-619-00097-x\nGuide to Linux Installation and Administration\nWells\n\n![](img/6d8286a85e2d8ad63e16f1801102da59_579_2.png)\n\
    \n*W3-CVQ-530*\n0-619-00094-5\nGuide to Linux Networking and Security\nWells\n\
    \n```\nISBN 0-619-13001-6\n90000\n9 780619 130015\n```"
