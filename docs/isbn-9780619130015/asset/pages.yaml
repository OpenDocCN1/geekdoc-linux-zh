    \ similar to:\n\n       ```bash\n       rmdir: newdir: Directory not empty\n \
    \      ```\n\n5. Use a relative path with the `rm` command to delete newfile.\
    \ Type `rm newdir/newfile` and press `Enter`.  \n6. The directory is now empty.\
    \ Type `rmdir newdir` and press `Enter`.  \n7. Type `ls` and press `Enter`. The\
    \ newdir directory is no longer there.\n\n# Copying Files\n\nChapter 2 introduced\
    \ the `cp` command. Its general form is:\n\n```\nSyntax\ncp [options] source destination\n\
    ```"
