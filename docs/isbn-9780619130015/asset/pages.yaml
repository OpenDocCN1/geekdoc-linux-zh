    > To see the contents of the `PATH` variable:


    ■ Type `echo $PATH` and press Enter.


    You see a list of directories. Notice that the path names are separated by colons
    (`:`).


    Because new shell programs are most often kept in the current directory while
    they are being tested, you should add the current working directory to the `PATH`
    variable. Here is an example:


    ```

    PATH=$PATH:.

    ```


    Remember, the shell interprets `$PATH` as the contents of the `PATH` variable.
    The sample command sets the `PATH` variable to its current contents. The colon
    and dot (`.`) add the current directory to the search path so that the shell program
    can locate the new program.


    > To add the current working directory to the `PATH` variable:


    1 Type `PATH=$PATH:.` and press Enter.

    2 Type `echo $PATH` and press Enter. The dot (`.`) is now appended to the list.

    3 You can now run scripts in your current working directory without typing the
    `/` characters before their names. Test this by typing `testscript` and pressing
    Enter. You see testscript execute.


    # Arithmetic Operators


    Arithmetic operators consist of the familiar plus (+) for addition, minus (-)
    for subtraction, asterisk (*) for multiplication, and slash (/) for division.
    Table 6-3 explains other operators.'
