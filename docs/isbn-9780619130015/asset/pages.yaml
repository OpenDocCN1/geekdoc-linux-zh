    command line. Do *not* press `Enter`.

    6. Press the **down arrow** key twice. The `who -iH` command is recalled to the
    command line. Press `Enter` to execute the command.


    # The man Program


    For reference, UNIX includes an online manual that contains all commands, including
    their options and arguments. The man program in UNIX displays this online manual,
    called the man pages, for command-line-assistance. Although the man pages for
    some commands contain more information than others, most man pages list the following
    items.


    +   - **Name**: the name of the command and a short statement describing its purpose

    - **Synopsis**: a syntax diagram showing the usage of the command

    - **Description**: a more detailed description of the command than the name item
    gives

    - **Options**: a list of command options and their purposes

    - **See Also**: other commands or man pages that provide related information

    - **Bugs**: a list of the command''s known bugs


    The man program usually accepts only one argument—the name of the command about
    which you want more information. The online manual shows the valid command formats
    that your system accepts. To close the online manual, type q.


    You decide to display information about the who command and the man program for
    yourself and others at Dominion.


    +   **To display online help for commands:**

    1. Type `man who` in the command line, and press `Enter`. You see the explanation
    of the `who` command illustrated in Figure 1-10.'
