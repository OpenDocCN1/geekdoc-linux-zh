  img_proc: true
- pgno: 196
  md: 'A program''s high-level language statements are stored in a file called the
    **source file**. This is the file that the programmer creates with an editor such
    as vi or Emacs. The source file cannot execute, however, because the computer
    can only process instructions written in low-level **machine language**. As we
    recall from Chapter 3, machine-language instructions are cryptic codes expressed
    in binary numbers. Therefore, the high-level source file must be converted into
    a low-level machine language file, as described next.


    The source file is converted into an executable machine-language file by a program
    called a **compiler**. The compiler reads the lines of code that the programmer
    wrote in the source file and converts them to the appropriate machine language
    instructions. For example, the Linux C++ compiler is named g++. The following
    command illustrates how it is executed:


    ```

    g++ -o my_exe my_source.cpp

    ```


    In this sample command, the -o option followed by my_exe instructs the compiler
    to create an executable file, my\_exe. The source file is my\_source.cpp. The
    command causes the compiler to translate the C++ program my\_source.cpp into an
    executable machine-language program, which is stored in the file my\_exe.


    If a source file contains **syntax errors** (grammatical mistakes in language
    usage), it cannot be converted into an executable file. The compiler locates and
    reports any syntax errors, which the programmer must correct.


    > Note: After compiling, the executable program may still contain fatal **run
    errors** or logic errors. Fatal run errors cause the program to abort due to an
    invalid memory location, for example. Logic errors cause the program to produce
    invalid results because of problems such as flawed mathematical statements.


    Another way to accomplish programming tasks is to develop UNIX shell scripts.


    # ## Using UNIX Shell Scripts


    Introduced in Chapter 4, **UNIX shell scripts** are text files that contain sequences
    of UNIX commands. Like high-level source files, a programmer creates shell scripts
    with a text editor. Unlike high-level language programs, however, shell scripts
    do not have to be converted into machine language by a compiler. This is because
    the UNIX shell acts as an **interpreter** when reading script files. As an interpreter
    reads the statements in a program file, it immediately translates them into executable
    instructions, and causes them to run. No executable file is produced because the
    interpreter translates and executes the program statements in one step. If a syntax
    error is encountered, the program halts.


    After you create a shell script, you simply tell the operating system that the
    file is a program that can be executed. This is accomplished by using the **chmod**
    (“change mode”) command to change the file''s mode. The mode determines how the
    file may be used. Recall that modes are denoted by single-letter codes, the most
    common being “r” (read), “w” (write), and “x” (execute). Further, the chmod command
    tells the computer who is allowed to use the file: the owner (u), the group (g),
    or all other users (o). For a description of the chmod command, see Appendix B,
    “Syntax Guide to UNIX Commands.”'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'As you recall from Chapter 4, you can change the mode of a file so that UNIX
    recognizes it as an executable program that everyone (user, group, and others)
    can use. In the following example, the user is the owner of the file.


    ```

    $ chmod ugo+x filename             <Enter>

    ```


    By typing the filename after the system prompt, you can now run the shell program.
    However, before any program can be run, it must be retrieved from a path identified
    in the **PATH variable**, which provides a list of directory locations where UNIX
    looks to find the executable programs. (See the section, \"Variables,\" later
    in this chapter.) If the program resides in your current directory, which is not
    in the PATH variable, you can precede the program name with a dot slash (./. )
    to tell UNIX to look in the current directory to find the program, as follows:


    ```

    $ ./filename                   <Enter>

    ```


    Shell programs run less quickly than do compiled programs, because the shell must
    interpret each UNIX command inside the executable script file before it is executed.
    However, it generally takes less time to create a shell program than one written
    using a high-level language, because the process of invoking a compiler and producing
    an executable file is eliminated. Because it is usually faster and easier to write
    a program such as a shell script than a compiled language, many programmers prefer
    scripts.


    # Prototyping an Application


    A **prototype** is a running model of your application, which lets you review
    the final results before committing to the design. Using a shell program to create
    a prototype is often the quickest and most efficient method, because prototyping
    logic and design capabilities reside within UNIX.


    After the working prototype is approved, the program can be rewritten to run faster
    using a compiled language such as C++. If the shell program performs well, however,
    you may not need to convert it to a compiled version.


    Now that you better understand the program development cycle, you realize that
    it will be more efficient to maintain Dominion Consulting''s phone records using
    a shell script. Your next step is to select the programming shell that will be
    most efficient for your application.


    # The Programming Shell


    All Linux versions use the Bash shell (Bourne Again Shell) as the default shell.
    Table 6-1 lists the three shells that come with most Linux distributions, their
    derivations, and distinguishing features.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '| Shell Name | Original Shell It Is Derived From | Description |

    | :--- | :--- | :--- |

    | Bash | Bourne and Korn shells | Offers strong programming language features
    like shell variables, control structures, and logic/math expressions. Combines
    the best features of the other shells. |

    | tsh | C Shell | Conforms to a programming language format. Shell expressions
    use operators like those found in the C programming language. |

    | zsh | Korn shell | Reflects the Bash shell in many respects but also has C programming-like
    syntax. Useful if you are familiar with older Korn shell scripts. |


    Table 6-1: Linux shells


    The Bash shell offers improved features over the older Bourne and Korn shells
    and is fully backward-compatible with the Bourne shell. Additionally, the Bash
    shell, when compared to the other shells, has a more powerful programming interface.
    As a result, you should use the Bash shell (as contained in Red Hat’s Linux version
    5.2) to complete your assignment.


    Now that you have selected the shell, you need to learn about what the shell scripts
    include, such as the variables, operators, and special characters.


    # Variables


    Variables are symbolic names that represent values stored in memory. The three
    types of variables discussed in this section are configuration variables, environment
    variables, and shell variables. Use configuration variables to store information
    about the setup of the operating system, and do not change them. You can set up
    environment variables with initial values that you can change as needed. These
    variables, which UNIX reads when you log in, determine many characteristics of
    your session. For example, you have already learned about the PS1 environment
    variable, which determines the way your prompt appears. Additionally, UNIX uses
    environment variables to determine such things as where it should look for programs,
    which shell to use, and the path of your home directory. Shell variables are those
    you create at the command line or in a shell script. They are very useful in shell
    scripts for temporarily storing information.'
  merge: -1
  img_proc: true
