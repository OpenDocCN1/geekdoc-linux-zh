- pgno: 88
  md: '# The UNIX Editors


    To enter vi and create a new file:


    +   ■ After the $ command prompt, type vi temp and press Enter. This starts vi
    and begins editing a new file called temp. Your screen should look similar to
    Figure 3-2.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_88_0.png)


    Figure 3-2: vi editor''s opening screen


    In the upper-left corner of your screen, you see the cursor, shown in Figure 3-2
    as a solid block. The cursor indicates your current location in the file.


    Note: The line containing the cursor is the current line. Lines containing tildes
    (~) are not part of the file; they indicate lines on the screen only, not lines
    of text in the file.


    # Inserting Text


    When you start the vi editor, you''re in command mode. This means that the editor
    interprets anything you type on the keyboard as a command. Before you can insert
    text in your new file, you must use the i (insert) command.


    # To insert text in the Temp file:


    +   1  Type i. Like most vi commands, the i command does not appear (or echo)
    on your screen. The command switches you from command mode to insert mode; you
    don''t need to press Enter to signal the command''s completion.


    +   2  Type the text shown in Figure 3-3.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_89_0.png)


    Figure 3-3: Inserting text with the vi editor


    If you need to delete characters, press Backspace. Press Enter at the end of each
    line to move to the next line.


    Note: In insert mode, every character you type appears on the screen. To switch
    to command mode, press Esc.


    # Repeating a Change


    Use the repeat ( . ) command to repeat the most recent change you made. Because
    you just inserted text, the repeat command repeats the insertion, duplicating
    the inserted text. You can add the next item in your memo by repeating the previous
    line and then editing it.


    **To repeat your last edit command:**


    +   1.  Press ESC to switch to command mode.

    2.  Type . (period).


    The vi editor inserts the last text you typed below the current line. Your screen
    should look similar to the one in Figure 3-4.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_90_0.png)


    Figure 3-4: Repeating a command in the vi editor


    Now you''re ready to edit the text you just inserted. Start by moving the cursor
    around the screen and then deleting unnecessary text.


    # Moving the Cursor


    You can move the cursor when you are in command mode. Start by moving around the
    screen to get a feel for the commands, and then move to the particular line you
    want to edit.


    +   To move the cursor around the screen:

    1. Press ESC to make sure you are in enter command mode.

    2. Press the arrow keys to move up, down, left, and right one character at a time.

    3. Type H to move the cursor to the upper-left corner of the screen.

    Note: Make sure you type capital letters as indicated in these steps.

    4. Type L to move the cursor to the last line on the screen.

    5. Type G to go to the beginning of the last line. This is the go to command.
    You can include a number before the G to indicate which line you want to move
    to.

    6. Type 2G to move to the beginning of the second line.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'In addition to these commands, you can use other commands to move the cursor.
    Table 3-1 summarizes the vi editor''s cursor movement keys.


    | Key | Movement |

    | :--- | :--- |

    | h or left arrow | Left one character position |

    | l or right arrow | Right one character position |

    | k or up arrow | Up one line |

    | j or down arrow | Down one line |

    | H | Upper-left corner of the screen |

    | L | Last line on the screen |

    | nG | Go to the line specified by a number, n |

    | w | Forward one word |

    | b | Back one word |

    | 0 (zero) | To the beginning of the current line |

    | $ | To the end of the current line |

    | Ctrl+U | Up one-half screen |

    | Ctrl+D | Down one-half screen |

    | Ctrl+F or Pg down | Forward one screen |

    | Ctrl+B or Pg up | Back one screen |


    Table 3-1: vi editor''s cursor movement keys


    Remember that cursor movement keys only work in command mode.


    Note: Using the letter keys to move the cursor dates back to the days when UNIX
    used teletype terminals that had no arrow keys. Designers of vi chose the letter
    keys because of their relative position on the keyboard.


    # Deleting Text


    Now that you know how to insert text and move around a file, you are ready to
    delete text. To do so, move to a character and then type x to delete that character.
    You can also combine many delete commands with cursor movement commands to delete
    more than one character. Table 3-2 summarizes the most common delete commands.'
  merge: -1
  img_proc: true
