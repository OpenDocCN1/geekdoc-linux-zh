    # S U M M A R Y


    +   - The operating system is the most fundamental computer program. It controls
    all computer resources and provides the base upon which application programs can
    be used or written.


    - A server-based network is centralized. All the users’ data and applications
    reside on the server, which is secured, maintained, and backed up by the system
    administrator. Each computer in a server-based network relies on the server. All
    systems in a peer-to-peer network function as both server and client. The security
    and maintenance of the network is distributed to each system. If one of the systems
    in a peer-to-peer network fails, the other systems continue to function.


    - The UNIX operating system is a multi-user system that lets many people access
    and share the computer simultaneously. It is also a multitasking operating system:
    it can perform more than one task at one time.


    - UNIX systems may be configured as dedicated servers in a server-based network,
    client workstations in a server-based network, client/server workstations in a
    peer-to-peer network, or standalone workstations connected to no network.


    - The concept of the layered components that make up an operating system originated
    with UNIX. Layers of software surrounding the computer system’s inner core protect
    the vital hardware and software components and insulate the core system from users.


    - Linux is a UNIX-like operating system that you install on your PC. It coexists
    with other operating systems such as Windows and MS-DOS.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '+   In UNIX, you communicate with the operating system programs through an
    interpreter called the shell, which interprets the commands you enter from the
    keyboard. UNIX provides several shell programs, including the Bourne, Korn, and
    C shells. The Bash shell provides enhanced features from the Bourne and the Korn
    shells. It is the most popular shell on the Linux system.


    +   In UNIX, the system administrator sets up accounts for ordinary users. To
    set up your account and to protect the privacy and security of the system, you
    select and give the system administrator your user name and password. You can
    log on to any UNIX or Linux system anywhere as long as you have a user account
    and password on the host (server) computer. You can also use the Microsoft Windows
    Telnet program to log on to a remote UNIX system.


    +   The commands you type to work with UNIX have a strict syntax that you can
    learn by referring to the online manual called the man pages. Use the man program
    to display the syntax rules for a command. Use the whatsis command to see a brief
    description of a command. Use the who command to list who is logged in and where
    they are located. Use the cal command to display the system calendar for all or
    selected months. To log out when you decide to stop using UNIX, use the exit or
    logout command.


    +   Most shells provide basic command-line editing capabilities and keep a history
    of your most recently used commands. Use the up and down arrow keys to scroll
    backward and forward through the list of recently used commands. You may enter
    multiple commands on a single command line by separating them with a semicolon.
    UNIX executes the commands in the order you enter them.


    +   You can use the view commands to view the contents of files. Use the cat command
    to create a file by typing information from the keyboard. Use the less and more
    commands to display multi-page documents. Use the head and tail commands to view
    the first or last few lines of a file.


