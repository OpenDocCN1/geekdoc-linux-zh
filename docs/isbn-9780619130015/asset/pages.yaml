    # Assembling Extracted Information


    # ## Using Script Files


    As you have seen, command-line entries can become long, depending on the number
    of options you need to use. You can use the shell’s command-line history retrieval
    feature to recall and re-execute past commands. This feature works well for you,
    but others who need to execute your commands cannot access them repeatedly. MS-DOS
    users resolve this problem by creating batch files. UNIX users do the same: they
    create shell script files to contain command-line entries. Like MS-DOS batch files,
    script files contain commands that can be run sequentially as a set. A good candidate
    for a script file is the series of cut, paste, and sort commands that you entered
    in Lesson A. You can use the vi editor to create the script file and then make
    the script executable using the chmod command with the x argument.


    Rolle Williams is delighted with your vendor report but wants a way to generate
    the report whenever the data changes. You can create a script that includes a
    series of commands for creating the file ven_report.


    > To use the vi editor to create a script:

    1. Change your working directory to the corp_db directory, under your home directory.

    2. After the $ command prompt, type vi ven_report and press Enter.

    The vi editor starts and creates a new file, ven_report.'
