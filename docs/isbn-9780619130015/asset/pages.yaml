- pgno: 207
  md: 'Note: Constants beginning with 0 are interpreted as octal numbers. A preceding
    x denotes a hexadecimal number.


    # # Preventing Redirection from Overwriting Files


    Recall that the > redirection operator overwrites an existing file. If you write
    a shell script that uses the > operator to create a file, you may want to prevent
    it from overwriting important information. You can use the set command with the
    `set -o noclobber option` to prevent a file from being overwritten, as in the
    following example:


    ```

    $ set -o noclobber


    ```


    However, you can choose to overwrite a file anyway by placing an exclamation point
    after the redirection operator:


    ```

    $ set -o noclobber

    $ cat new_file > old_file

    $ cat: file exists

    $ cat new_file >! old_file


    ```


    # # More About Wildcard Characters


    Shell scripts frequently use the asterisk (*) and other wildcard characters (such
    as ? and []), which help to locate information containing only a portion of a
    matching pattern. For example, to retrieve all program files whose names contain
    a “.c” extension, use the following command:


    ```

    ls *.c


    ```


    Wildcard characters are also known as **glob** characters. If an unquoted argument
    contains one or more glob characters, the shell processes the argument for filename
    generation. Glob characters are part of **glob patterns**, which are intended
    to match filenames and words. Special constructions that may appear in glob patterns
    follow:


    +   - The question mark (?) matches exactly one character, except for the backslash
    and period.

    - The asterisk (*) matches zero or more characters in a filename.

    - [chars] defines a class of characters. The glob pattern matches any single character
    in the class. A class may contain a range of characters, as in [a-z].


    For example, assume the working directory contains files chap1, chap2, and chap3.
    The following command displays the contents of all three files:


    ```

    more chap[1-3]


    ```


    Now that you understand some of the tools used to construct shell scripts, you’ll
    see examples of how shell scripts are rewritten to support the four basic logic
    structures needed for program development.'
  merge: -1
