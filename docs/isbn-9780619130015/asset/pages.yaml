  md: "# Setting Up a Class\n\nOne of the more difficult concepts to grasp is the\
    \ use of the C++ class data structure. A data structure lets you create abstract\
    \ data types. An **abstract data type** is one defined by the programmer for a\
    \ specific programming task.\n\nYou might begin by thinking of the class as made\
    \ up of members that interrelate to make the class perform like an object rather\
    \ than just a normal structure. Its methods (which are like C functions) are part\
    \ of the class and considered behaviors of the class. The similarity between a\
    \ class and a structure is that both store related data. You can use structures\
    \ in C++ just as you do in C. However, in C++ you can and should use a class when\
    \ your program performs specific operations on the data. For example, you can\
    \ create a class for an object called cube when you want to compute the volume\
    \ of any size cube:\n\n```\n```cpp\n//=============================\n\n// Program\
    \ Name: cube.C\n// Purpose: Show how to set up a class. The class is called\n\
    //          cube, and computes the volume of a cube.\n//=============================\n\
    \n#include <iostream.h>\n\n//--- cube class\nclass Cube\n{\n    int height, width,\
    \ depth; // private data members\npublic:\n    // ---- constructor\n    Cube(int\
    \ ht, int wd, int dp)\n    { height = ht; width = wd; depth = dp; }\n    // ----\
    \ member function\n    int volume()\n    { return height * width * depth; }\n\
    };\n\nvoid main(void)\n{\n    Cube thiscube(7, 8, 9);  // declare a Cube\n   \
    \ cout << thiscube.volume() << \"\\n\";  // Compute &\n// display volume\n}\n\
    ```\n```"
