- pgno: 313
  md: 'Another useful, though static, display of memory usage is generated by the
    `free` command. The `free` command displays the amount of free and used memory
    in the system. Unlike `top`, the `free` utility runs and then automatically exits.


    # **To demonstrate the `free` command:**


    +   1.  Type `free` and press Enter. Your screen looks similar to Figure 8-16.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_313_0.png)


    **Figure 8-16:** Output of `free` command


    +   2.  The command displays the amount of total, used, and free memory. It also
    displays the amount of shared memory, buffer memory, and cached memory. In addition,
    the amount of total, used, and free swap memory is shown. By default, all amounts
    are shown in kilobytes.

    3.  Type `free -m` and press Enter to see the `free` command''s output in megabytes.

    4.  Type `free -b` and press Enter to see the `free` command''s output in bytes.


    As mentioned earlier, you may want to forward these displays to the system administrator
    and tune-up specialists. You do this next.


    # **To forward displays generated by the `top` and `free` utilities:**


    +   1.  Redirect the outputs of the `top` utility to a file in your current directory
    by typing `top > top_out` and then pressing Enter.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '+   2 Wait about 10 seconds and then press **q** to exit the top utility.

    3 Redirect the outputs of the top free to a file in your current directory by
    typing `free > free_out` and then pressing **Enter**.

    4 Print the report for the system administrator and tune-up specialists by typing
    `lpr top_out`, pressing **Enter**, typing `lpr free_out`, and then pressing **Enter**
    again.


    Because UNIX is a multitasking operating system, it allows you to run programs
    in the background while you continue to work with other programs. For example,
    if you have a program that prints a lengthy report, you can run it in the background
    and continue working with other programs while the report is printing. To run
    a program in the background, append the & character to the end of the command
