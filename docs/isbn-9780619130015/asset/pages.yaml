- pgno: 225
  md: 'An **alias** is a name that represents another command. You can use aliases
    to simplify and automate commands you use frequently. For example, the following
    command sets up an alias for the rm command.


    ```

    alias rm="rm -i"

    ```


    This command above causes the rm -i command to execute any time the user enters
    the rm command. This is a commonly used alias, as it ensures users are always
    prompted before the rm command deletes a file. Here are two other common aliases
    that help safeguard files:


    ```

    alias mv="mv -i"

    alias cp="cp -i"

    ```


    ![](img/6d8286a85e2d8ad63e16f1801102da59_225_0.png)


    The **.bashrc** file that resides in your home directory can be used to establish
    customizations that take effect for each login session. The .bashrc script is
    executed each time you generate a shell, such as when you run a shell script.
    Any time a subshell is created, the .bashrc is re-executed. The following .bashrc
    file is commented to explain how you can make your own changes.


    ```

    .bashrc

    # Source global definitions

    if [ -f /etc/bashrc ]; then

    . /etc/bashrc # if any global definitions are defined

    # run them first

    alias rm ''rm -i'' # make sure user is prompted before

    # removing files

    alias mv ''mv -i'' # make sure user is prompted before

    # overwriting files

    set -o ignoreeof # Do not allow Ctrl-D to logout

    set -o noclobber # Force user to enter >! To write

    # over existing files

    PS1="\\w \\$" # Set prompt to show working directory

    ```


    In addition to knowing how to customize your work environment, you should also
    be familiar with the trap command.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# The trap Command


    The trap command is useful when you want your shell program to automatically remove
    any temporary files that are created when the shell scripts runs. The **trap**
    command specifies that a command, listed as the argument to trap, is read and
    executed when the shell receives a specified system signal. Here is an example
    of the command:


    ```

    trap "rm ~/tmp/* 2> /dev/null; exit" 0

    ```


    This command has two arguments: a command to be executed, and a signal number
    from the operating system. The command, rm ~/tmp/* 2>/dev/null; exit, deletes
    everything in the user''s tmp directory, redirects the error output of the rm
    command to the null device (so it does not appear on the screen), and issues an
    exit command to terminate the shell. The signal specified is 0, which is the operating
    system signal generated when a program exits. So, if this sample command is part
    of a script file, it causes the specified rm command to execute when signal 0
    is sent by the operating system.


    The programmer often sets up ~/tmp (a subdirectory of the user''s home directory)
    to store temporary files. When the script file exits, any files placed in ~/tmp
    can be removed. This is called "good housekeeping" on the part of the programmer.


    # Creating the Corp_phones File


    The steps that follow require you to create the corp_phones file and place it
    in your ~/source directory.


    **To create the corp_phones file:**


    +   1. Use the vi or Emacs editor to create the corp_phones file.


