- pgno: 74
  md: 'Notice the long listing of the two directories. (Remember that the directory
    is just another file.) The earlier section, “Listing Directory Contents,” describes
    the information presented in a long listing. Now you can look closer at the file
    permissions. For the first file described, the column on the far left shows the
    string of letters drwxr-xr-x. You already know the first character indicates the
    file type. The characters that follow are divided into three sections of file
    permission specifiers. There are three specifiers in each section, as illustrated
    in Figure 2-8.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_74_0.png)


    Figure 2-8: Example of file type and file permissions for a file


    The first section of file permission specifiers indicates the owner’s permissions.
    The owner, like all users, belongs to a group of users. The second section indicates
    the group’s permissions. This specification applies to all users other than the
    owner who are members of the owner’s group. The third section indicates all others’
    permissions. This specification applies to all users who are not the owner and
    not in the owner’s group. In each section, the first character indicates read
    permissions. If an “r” appears there, that category of users has permission to
    read the file. The second character indicates write permission. If a “w” appears
    there, that category of user has permission to write to the file. The third character
    indicates execute permission. If an “x” appears there, that category of user has
    permission to execute the file. If a dash (-) appears in any of these character
    positions, that type of permission is denied.


    > Note: If a user is granted read permission for a directory, the user can see
    a list of its contents. Write permission for a directory means the user can rename
    and delete files in the directory. Execute permission for a directory means the
    user can make the directory the current working directory.


    From left to right, the letters rwxr-xr-x mean:


    +   r    File’s owner has read permission

    w    File’s owner has write permission

    x    File’s owner has execute permission (can run the file as a program)

    r    Group has read permission

    -    Group does not have write permission

    x    Group has execute permission'
  merge: -1
  img_proc: true
- pgno: 75
  md: "+   r Others have read permission  \n    - Others do not have write permission\
    \  \n    x Others have execute permission\n\nYou can change the pattern of permission\
    \ settings by using the chmod command. For example, setting others' permissions\
    \ to --- removes all permissions for others. They cannot read, write, or execute\
    \ the file. In the first line of Figure 2-7, notice that the owner has read, write,\
    \ and execute (rwx) permissions for the file X11. The r-x indicates that the group\
    \ of users that shares the same group id as the owner has only read and execute\
    \ permissions. The system administrator assigns group ids when he or she adds\
    \ a new user account. Group ids give a group of users equal access to files that\
    \ they all share. Others are all other users who are not associated with the owner's\
    \ group by a group id, but have read and execute permissions.\n\nUse the UNIX\
    \ chmod command to set file permissions. In its simplest form, the chmod command\
    \ takes as arguments a symbolic string followed by one or more file names. The\
    \ symbolic string specifies permissions that should be granted or denied to categories\
    \ of users. Here is an example: ugo+rwx. In the string, the characters ugo stand\
    \ for user (same as owner), group, and others. These categories of users will\
    \ be affected by the chmod command. The next character, the + sign, indicates\
    \ that permissions are being granted. The last set of characters, in this case\
    \ rwx, indicates the permissions being granted. The symbolic string ugo+rwx indicates\
    \ that read, write, and execute permissions are being granted to the owner, group,\
    \ and others. Here is an example of how the symbolic string is used in a command,\
    \ to modify the access permissions of myfile:\n\n```\nchmod ugo+rwx myfile\n```\n\
    \nHere is a command that grants group read permission to the file customers:\n\
    \n```\nchmod g+r customers\n```\n\nIt is also possible to deny permissions with\
    \ a symbolic string. The following command denies the group and others write and\
    \ execute permissions for the file account_info.\n\n```\nchmod go-wx account_info\n\
    ```\n\nSee Appendix B, “The UNIX Command Syntax Guide to the Linux Shell and Utility\
    \ Programs,” for a brief description of the chmod command.\n\nRolf e wants all\
    \ users to have access to the corp_phones file. To make that possible, he asks\
    \ you to change the file permissions. First, permit access to your home directory.\
    \ Next, allow access to the corp_db directory, and then set the permissions for\
    \ everyone to read the corp_phones file. You can use the chmod command with the\
    \ x argument to grant access to directories."
  merge: -1
  img_proc: true
- pgno: 76
  md: '# **To change file and directory permissions:**


    +   1. Make sure that you are in your home directory.


    +   2. Type `chmod go+x ~` and press **Enter** to allow access to your home directory.
    This command means “make your home directory (~) accessible (+x) to the group
    (g) and others (o).”


    +   3. Type `chmod ugo+x ~/corp_db` and press **Enter** to allow access to the
    corp_db directory. This command means “make the corp_db directory accessible (+x)
    for the owner (u), group (g), and others (o).”


    +   4. Type `chmod ugo+r ~/corp_db/corp_phones` and press **Enter** to set permissions
    so everyone can read the file. This command means “make the corp_phones file readable
    (+r) for the owner (u), group (g), and others (o).”


    Note: From your home directory, you can create any subdirectory and set permissions
    for it. However, you cannot create subdirectories outside your home directory
    unless the system administrator makes a special provision.


    You used the appropriate UNIX commands to create new directories to store files
    and set up a central directory for all users, and then you transferred files from
    other directories to the central directory. Finally, you changed file permissions
    so other users can access the directories and files you created.


    # # S U M M A R Y


    +   - In UNIX, a file is the basic component for data storage. UNIX considers
    everything to be a file, even attached devices such as the monitor, keyboard,
    and printer.


    +   - A file system is the UNIX system’s way of organizing files on mass storage
    devices such as hard and floppy disks. Files are stored on a file system, which
    is a hierarchical structure like a tree where top-level directories contain other
    directories, which in turn contain other directories.


    +   - Every file can be located by using a correct and unique pathname; that is,
    a listing of names of directories leading to a particular file.


    +   - The standard tree structure starts with the root ( / ) directory, which
    serves as the foundation for a nested group of other directories and subdirectories.


    +   - The section of the disk that holds a file system is called a partition.
    One disk may have many partitions, each separated from the others so that it remains
    unaffected by external disturbances such as structural file problems associated
    with another partition.


    +   - The UNIX file system is designed to allow access to multiple partitions
    once they are mounted in the tree structure.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   - A path, as defined in UNIX, serves as a map to access any file on the
    system. An absolute path is one that always starts at the root level. A relative
    path is one that starts at your current location.


    +   - You may customize your command prompt to display the current working directory
    name, the date, time, and several other items.


    +   - The ls command displays the names of files and directories contained in
    a directory. The ls -l command and its options display all file information on
    the screen. This display is often called a long listing. The ls -a command shows
    hidden files.


    +   - Wildcard characters can be used in a command, such as ls, and take the place
    of other characters in a file name. The * wildcard can take the place of any string
    of characters, and the ? wildcard can take the place of any single character.


    +   - You can use the mkdir command to create a new directory as long as you own
    the parent directory. A file’s owner is the person who creates it and becomes
    the only one who controls access to it.


    +   - You can use the chmod command to set permissions for files that you own.
    The permissions settings are rwx, which mean read, write, and execute, respectively.
    File permissions are set to control file access by three types of users: the owner,
    the group, and others. You must remember to change permission settings on any
    directories you own if you want others to access information in those directories.
    You use the execute permission (x) command to grant access to directories.


    +   - You can use the cp command to copy a source file to a destination file.
    UNIX overwrites the destination file without warning unless you use the -i option.
    The dot notation (current directory) is a shorthand way to specify the destination
    in a cp command.


    # COMMAND SUMMARY


    | | Command | Purpose | Options covered in this chapter | | | | | cd | Change
    directories | | | | | chmod | Set file permissions for specified users | | | |
    | cp | Copy files from one directory to another | -i prevents overwriting of the
    destination file without warning | | | | | ls | Display directory''s contents,
    including its files and subdirectories | -a lists the hidden files -l generates
    a long listing of the directory | | | | |'
  merge: -1
  img_proc: true
