    When you are satisfied with the man page format, you can make it available to
    others by copying it (while logged on as root) to one of the man page directories.
    All man pages are stored in subdirectories of the /usr/man directory. These subdirectories
    have names such as man1, man2, man3, and man4. All man pages in man1 are identified
    with a common suffix, .1, so phmenu.1 is copied to /usr/man/man1. The suffix number
    represents the section number of the man page.


    When you request a man page using the man program, you specify the section number
    you want to see by placing the number after the name. (If you type only the name,
    man looks recursively for the page through all the subdirectories, starting with
    /usr/man/man1, and then displays the first match.) For example, if you want man
    to print the second version of the break command, follow the man command with
    break 2.


    Note: You need superuser privileges to copy phmenu.1 into the “root-owned” directory,
    /usr/man/man1. If you are not logged on to the root account, use the su command
    instead.


