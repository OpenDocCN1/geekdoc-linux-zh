    # ## Debugging Your Program


    Typical errors for new C programmers include using incorrect syntax, such as forgetting
    to terminate a statement with a semicolon. Or, because almost everything you type
    into a C program is in lowercase, your program may have a case-sensitive error.
    Here is an example of what you might see on the screen if you omit a closing quote
    inside a printf command:


    ```

    simple.c:10: unterminated string or character constant

    simple.c:10: possible real start of unterminated constant

    ```


    The compiler generally produces more error lines than the number of mistakes it
    finds in the code. The compiler reports the error lines and any surrounding lines
    affected by the mistake(s).


    > Note: Remember that every time you modify (correct or add text to) your program
    source file, you must recompile the program to create a new executable program.'
  merge: -1
  img_proc: true
