- pgno: 117
  md: '# LESSON A


    # objectives


    After studying this lesson, you should be able to:


    +   Explain UNIX''s approach to file processing


    +   Use basic file manipulation commands


    +   Extract characters and fields from a file using the cut command


    +   Rearrange fields inside a record using the paste command


    +   Merge files using the sort command


    +   Create a new file by combining cut, paste, and sort


    # Extracting Information from Files


    Now that you know how to work with UNIX files and editors, you''re ready to learn
    how to manipulate files and work with their contents. After a brief discussion
    of UNIX file types and file structures, Lesson A defines file processing and shows
    you how to use redirection operators when processing files. You also learn how
    to manipulate files by creating, deleting, copying, and moving them to extract
    information from files, to combine fields, and to sort a file''s contents, all
    in the context of the opening case. In Lesson B, you learn how to assemble information
    you extracted from files. You also create a script to automate a series of commands,
    link files with a common field, and use the awk command to format output. You
    complete these tasks to meet the goals of the opening case.


    # UNIX''s Approach to File Processing


    UNIX file processing is based on the idea that files should be treated as nothing
    more than character sequences. This concept of a file as a series of characters
    offers a lot of flexibility. Because you can directly access each character, you
    can perform a range of editing tasks, such as correcting spelling errors and organizing
    information as necessary.


    # Understanding UNIX File Types


    Operating systems support several types of files. UNIX, like MS-DOS, has regular
    files, directories, and special files. Regular files contain information you create
    and manipulate, and include either ASCII files, such as the text files you created
    in Chapter 3, or binary files, such as those you create while compiling source
    code. You use regular files, also called ordinary files, in this chapter. Other
    file types'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'include directories and special files, such as character files and block files.
    Chapter 2 explained that directories are system files for maintaining the structure
    of the file system. **Character special files** are related to serial input/output
    devices, such as printers. **Block special files** are related to devices, such
    as disks.


    # File Structures


    Files can be structured in several ways. For example, UNIX stores data, such as
    letters, product records, or vendor reports, in flat ASCII files. A programmer
    structures a file depending on the kind of data it stores. Three kinds of regular
    files are unstructured ASCII characters, records, and trees. Figure 4-1 illustrates
    these three kinds of regular files.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_118_0.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Figure 4-1(a) shows a file that is an unstructured sequence of bytes and is
    a typical example of a text file. This file structure gives you the most flexibility
    in data entry, because you can store any kind of data in any order. However, you
    can only retrieve the data in the same order, which may limit its overall usefulness.
    For example, suppose you list Worldwide Hotel''s vendors in an unstructured ASCII
    file. It would then be convenient to only view or print the entire list, not just
    the vendor names or vendor numbers.


    Figure 4-1(b) shows data as a sequence of fixed-length records, each having some
    internal structure. In this structure, UNIX reads the data as fixed-length records.
    Although you must enter data as records, you can also manipulate and retrieve
    the data as records. For example, you can select only certain vendor records to
    retrieve from the file.


    The third kind of file, illustrated in Figure 4-1(c), is structured as a tree
    of records, not necessarily of the same length. Each record contains a key field,
    such as a record number, in a fixed position in the record. The key field sorts
    the tree, so you can quickly search for a record with a particular key. For example,
    you can quickly find the record for Triumph Motors by searching for record #1203.


    # Processing Files


    When performing commands, UNIX **processes** data—it receives input from the standard
    input device (your keyboard) and then sends output to the standard output device
    (your monitor). System administrators and programmers refer to standard input
    as *stdin*. They refer to standard output as *stdout*. (The third standard output
    is called **standard error**, or **stderr**. When UNIX detects errors in processing
    system tasks and user programs, it directs the errors to stderr, which by default
    is the screen by default.)


    You can use the redirection operators to save the output of a command or program
    in a file, or use a file as an input to a process. The redirection operators,
    therefore, help you process files.


    # Using Input and Error Redirection


    You can use redirection operators (>, >>, 2>, <, and <<) to retrieve input from
    something other than the standard input device and to send output to something
    other than the standard output device.


    You already used the output redirection operators in Chapter 1 when you created
    a new file by redirecting the output of several commands to files. Redirect output
    when you want to store the output of a command or program in a file. For example,
    recall that you can use the `ls` command to list the files in a directory, such
    as /home. The `ls` command sends output to stdout, which by default is the screen.
    To redirect the list to a file called *homedir.list*, use the redirection symbol
    by typing `ls > home-dir.list`.


    You may also redirect the input to a program or command with the < operator. For
    instance, a program that accepts keyboard input may be redirected to read information
    from a file instead. In the following steps you create a file for the vi editor
    to read its commands from, instead of reading them from the keyboard.'
  merge: -1
  img_proc: true
- pgno: 120
  md: "# **To create a file from which the vi editor reads commands:**\n\n**1**\t\
    Use the `vi` editor, or the `cat` command with output redirection, to create the\
    \ file `testfile`, containing the text:\n```\nThis is line 1.\nThis is line 2.\n\
    This is line 3.\nThis is line 4.\n```\n\n**2**\tCreate another text file containing\
    \ some `vi` commands as follows. Type `cat > commands` and press **Enter**. Type\
    \ `H` and press **Enter**. Type `dd` and press **Enter**. Type `G` and press **Enter**.\
    \ Type `p` and press **Enter**. Type `:wq` and press **Enter**. Press `Ctrl+D`.\n\
    \n**3**\tType `cat commands` and press **Enter**. You see the contents of the\
    \ commands file, which are:\n```\nH\ndd\nG\np\n:wq\n```\n\n**4**\tType `vi testfile\
    \ < commands` and press **Enter**. This loads `testfile` into the `vi` editor\
    \ and redirects `vi`'s input to the text in the command file. The text in the\
    \ command file is treated as commands typed on the keyboard.\n\n**5**\tType `cat\
    \ testfile` and press **Enter**. You see the contents of `testfile` after the\
    \ `vi` commands execute. The contents are:\n```\nThis is line 2.\nThis is line\
    \ 3.\nThis is line 4.\nThis is line 1.\n```\n\nYou may also use the `2>` operator\
    \ to redirect commands or program error messages from the screen to a file.\n\n\
    # **To redirect error messages:**\n\n**1**\tForce the `ls` command to display\
    \ an error message by giving it an invalid argument. Assuming you have no file\
    \ or directory in your home directory named `jojo`, type `ls jojo` and press **Enter**.\
    \ You see the error message:\n```\nls: jojo: no such file or directory\n```\n\n\
    **2**\tRedirect the error output of the `ls` command. Type `ls jojo 2> errfile`\
    \ and press **Enter**. There is no output on the screen.\n\n**3**\tType `cat errfile`\
    \ and press **Enter**. You see `errfile`'s contents:\n```\nls: jojo: no such file\
    \ or directory\n```"
