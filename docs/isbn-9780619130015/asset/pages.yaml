- pgno: 310
  md: '# # Applying System Status Utilities


    As you see from the list of command descriptions in Table 8-2, the system status
    commands determine the system''s performance. Although system engineers who assess
    the CPU''s performance primarily use this data, you should at least know how to
    obtain this information. You can redirect the output of these commands to a file
    that you can then print and forward to the system administrator and system tune-up
    specialists.


    One of the most effective utilities for auditing system performance is the top
    command. The top command displays a listing of the most CPU-intensive tasks, such
    as the processor state, in real time (the display is updated every 5 seconds by
    default). This means that you can actually see what is happening inside the computer
    as it progresses. The top command works with these options:


    | Syntax | top [-] [d delay] [q] [S] [s] [i] [c] |

    | :--- | :--- |

    | Dissection | The d option specifies the delay between screen updates. The q
    option causes the top utility to refresh without delay. The S option specifies
    cumulative mode, where each process is listed with the CPU time it has spent.
    The s option allows the top utility to run in secure mode, which disables the
    interactive commands (a good option for those not in charge of tuning the system).
    The i option causes the top utility to ignore any idle processes. Finally, the
    c option displays the command line instead of the command name only. While running,
    the top command supports interactive commands, such as k, which kills a running
    process. The top utility continues to produce output until you press q to terminate
    the execution of the program. |


    The simplest way for most users to run the top utility is to simply issue the
    command without options.


    **To use the top utility:**


    +   1. Display the CPU activity by typing **top** and then pressing **Enter**.
    Your screen should look similar to Figure 8-13. (Don''t forget this display changes
    dynamically while on screen.)


    +   2. The processes are shown in the order of the amount of CPU time they use.
    After looking at the display for a short time, press **q** to exit from the top
    utility.


    +   3. Run the top command again. Notice the leftmost column of information, labeled
    PID. This column lists the process ID of each process shown. Notice the PID of
    the top command. (In Figure 8-13, the top command''s PID is 707. Yours will probably
    differ.)'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_311_0.png)


    Figure 8-13: Output of top command


    4 Press h to initiate the kill command. The top program asks you to enter the
    PID to kill. Enter the PID of the top command. Your screen should resemble Figure
    8-14. Press Enter to kill the process. (You may have to press Enter a second time
    to return to a command prompt.) The top command is no longer running.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_311_1.png)


    Figure 8-14: The k command'
