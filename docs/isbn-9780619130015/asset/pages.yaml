- pgno: 126
  md: '+   5. Remove the company directory and everything it contains. Type rm -r
    company and press Enter.

    6. Type ls and press Enter. The company directory is removed.


    **Caution:** Be very careful with the rm -r command. It can permanently delete
    massive amounts of information.


    # Moving Files


    Moving files is similar to copying them, except you remove them from one directory
    and store them in another. To move a file, use the mv (move) command. The command
    has the general form:


    ```

    Syntax

    `mv [-options] source destination`

    ```


    You can also use the mv command to rename a file by moving one file into another
    file with a different name.


    +   **To move a file from one directory to another:**

    1. To create the new file thisfile in your home directory, type > thisfile and
    then press **Enter**.

    2. Type mv thisfile source and press **Enter** to move the new file to the source
    directory.

    3. Type ls and press **Enter**. Thisfile is not listed. Type ls source and press
    **Enter**. You see thisfile listed.

    4. To move more than one file, type the filenames before the directory name. For
    example, type mv file1 file1.sav source and press **Enter**.

    5. To create the new file my_file, type > my_file and press **Enter**.

    6. To rename my_file to your_file, type mv my_file your_file and press **Enter**.

    7. Type ls and press **Enter**. You see your_file listed, but my_file is not listed.


    **Note:** Moving and renaming a file are essentially the same operation.


    You can also use the -i option with the mv command. It causes the command to prompt
    you before it overwrites an existing destination file.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Finding Files


    The find command searches for files that have a specified name. Use the find command
    to locate files that have the same name or to find a file in any directory. The
    command has the form:


    | Syntax | find pathname -name filename |

    | Dissection | ■ *pathname* is the path name of the directory you want to search.
    The find command searches recursively; that is, it starts in the named directory
    and searches down through all files and subdirectories under the directory specified
    by *pathname*.


    ■ -name indicates that you are searching for files with a specific filename. You
    may use wildcard characters in the filename. For example, you may use *phone**
    to search for all filenames that begin with “phone.” For other search conditions
    you can use with find, refer to Appendix B, “Syntax Guide to UNIX Commands.” |


    Using the find command you can only search areas where you have adequate permissions.
    As the search progresses, the find command may enter protected directories; you
    receive a “Permission denied” message each time you attempt to enter a directory
    for which you do not have adequate permissions.

    You can use the find command to find every file named *phone1* in the /home directory
    and all its subdirectories.


    +   **To find a file:**


    ■ After the $ command prompt, type find /home -name *phone1* and press *Enter*.


    Note: Although Linux does not require it, some UNIX versions require the -print
    option after the filename to display the names of files the find command locates.


    # Combining Files


    Now you''re ready to work on the vendor report for Worldwide Hotels, Dominion’s
    client. Two separate files, illustrated in *Figure 4-2*, store the data you need—product
    descriptions and vendor numbers.'
  merge: -1
  img_proc: true
