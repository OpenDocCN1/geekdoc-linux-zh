- pgno: 443
  md: 'Finally, the **Windows Options** button displays a menu of basic and advanced
    window operations:


    +   - **Close** terminates the application and closes the window.

    - **Annihilate** also closes the window but can be used in cases where the application
    is malfunctioning, when it will not let you close the window.

    - **Iconify** reduces the window to an icon in the GNOME Pager.

    - **Raise** brings the window on top of all other windows.

    - **Lower** puts the window beneath all other windows.

    - **Shade/Unshade** collapses or expands a window.

    - **Stick/Unstick** makes a window visible on all desktops. (*Desktops* are covered
    later in this chapter.)

    - **Desktop** displays a menu that allows you to move the window to specific desktops.

    - **Window Size** displays a menu that allows you to change the width and height
    of the window.


    > Note: You can customize the items in the Windows Options menu, which may be
    different on your system.


    +   **To practice using the Windows Options menu:**

    1. Click the large **question mark** icon on the panel to open the Help Browser
    window.

    2. Click the **Windows Option** button in the upper-left corner of the window.

    3. Experiment with several options on the menu.

    4. When finished, close the **Help Browser** and any other open windows.


    # Interacting with the Panel


    The panel, which appears at the bottom of the GNOME screen, features the Pager
    (which you used in the previous section), a clock, and several icons. The icon
    at the left end of the panel, shown in Figure 11-8, is the Main menu button.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_443_0.png)


    **Figure 11-8:** Main menu button'
