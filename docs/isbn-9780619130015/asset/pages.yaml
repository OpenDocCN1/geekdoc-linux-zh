    # Advancing Your File Processing Skills


    In Chapter 4 you learned to use several UNIX commands to extract and organize
    information from existing files and transform that information into a useful format.
    This chapter explains how to use other file processing commands, which are organized
    into two categories: select commands, and manipulation and transformation commands.
    Table 5-1 lists the select commands, which extract information.'
