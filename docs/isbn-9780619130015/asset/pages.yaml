  img_proc: true
- pgno: 345
  md: "![](img/6d8286a85e2d8ad63e16f1801102da59_345_0.png)\n\nFigure 9-10: Output\
    \ of example9.p\n\nNow that you understand about data types, you are ready to\
    \ learn more about programming using Perl. Perl's similarities and differences\
    \ with other programming languages can be illustrated by comparing how the same\
    \ program appears in awk and Perl.\n\n# ## Perl versus Awk Programs\n\nAwk does\
    \ not require the programmer to explicitly set up looping structures as Perl does.\
    \ Perl's while loop, on the other hand, is almost identical to the one found in\
    \ C and C++. Awk, therefore, uses fewer lines of code to resolve pattern-matching\
    \ extractions than Perl does. For example, look at the following awk program,\
    \ awkcom.a, and its output. The program counts the number of comment lines that\
    \ appear in the file specified on the command line.\n\n```\n!usr/bin/awk -f\n\
    # program name: awkcom.a\n# purpose: Count the comment lines in a file\n#\nEnter\
    \ the filename on the command line.\n\nEND {\n\tprint \"The file has \", line_count,\
    \ \" comment lines.\"\n}\n/\"^#`/ \" !/^#!`/ { ++line_count } # This occurs for\
    \ every line.\n\n```"
  merge: -1
  img_proc: true
- pgno: 346
  md: "![](img/6d8286a85e2d8ad63e16f1801102da59_346_0.png)\n\nFigure 9-11: Output\
    \ of awkcom.a\n\nNow compare and contrast the awkcom.a program with this Perl\
    \ program:\n\n```\n#!/usr/bin/perl\n# program name: perlcom.p\n# purpose: count\
    \ the source file's comment lines\n\n$filein = $ARGV[0];\nwhile (<>)\n{\n    if\
    \ (/^#/ && !/^#!/) {\n        ++$line_count\n    }\n}\nprint (\"File \\\"$filein\\\
    \" has $line_count comment lines. \\n\"\n);\n```\n\nAlthough the end results of\
    \ both programs are very similar, you can see where the two programs differ. Awk\
    \ uses an implicit while loop that automatically sends the entire contents of\
    \ the file named on the command line to the pattern-matching and action part of\
    \ the program. However, note that for the Perl program you need to build the while\
    \ loop explicitly."
  merge: -1
  img_proc: true
- pgno: 347
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_347_0.png)


    Figure 9-12: Output of perlcom.p


    The first line of each program tells the shell program to run either the awk program
    or the Perl program and pass the statements in the file to the program for execution.
    Both programs also use the pound sign (#) to specify a comment line. Further,
    the pattern-matching code is the same in both programs. That is where the similarities
    end.


    The -f option in the awk program tells the shell that the program is being called
    with a script file that contains the awk commands. Recall that awk contains more
    built-in commands to read lines from the file. All awk needs is the pattern-matching
    conditions to select the lines. The reading of the file, in awk, is implied as
    shown in this code.


    ```

    /^#|&& !/^#!\t{++line_count}


    ```


    Awk also uses BEGIN and END to control when commands execute. All statements in
    a BEGIN block execute before the input file is read. All statements in an END
    block execute after all the contents of the input file have been read. This program
    only needs the END pattern.


    In the Perl program, the code:


    ```

    $filein = $ARGV[0];


    ```


    takes the name of the file on the command line (ARGV[0]) and places it in a variable
    so it can be referenced later. The filename originally stored in ARGV[0] from
    the command line is destroyed during the while loop.


    ```

    while (<>)


    ```


    The <> symbol is called the diamond operator. Once the file is opened, you can
    access its data using the diamond operator. Each time it is called, it returns
    the next line from the file.'
  merge: -1
  img_proc: true
- pgno: 348
  md: "Curly braces open and close a block where you can place multiple statements:\n\
    \n```\nif ( /^# /&&  !/^#! / )\n{\n      ++$line_count\n}\n```\n\nThis block tests\
    \ to see if the line begins with the # character, but not with the #! characters.\
    \ If true, the statement ++$line_count adds one to the $line_count variable and\
    \ then closes the if block.\n\nWhether awk or Perl is a good choice for you is\
    \ a personal decision, but one should be part of your tool kit. There is no substitute\
    \ for the kinds of work that either can perform very quickly, with minimal code\
    \ preparation. For example, you probably would not want to write a C program for\
    \ a task like scanning files for a matching pattern. Perl and awk are excellent\
    \ when you are looking for a “needle in the haystack.” Some say that the greater\
    \ flexibility and power of Perl’s expanded regular expressions give it a slight\
    \ edge.\n\n# ## How Perl Accesses Disk Files\n\nLike most high-level programming\
    \ languages, Perl uses filehandles to reference files. A **filehandle** is the\
    \ name for an I/O connection between your Perl program and the operating system,\
    \ and it can be used inside your program to open, read, write, and close the file.\
    \ The convention is to use all uppercase letters for filehandles. In most instances,\
    \ you must issue an open statement to open the file before you can access it.\
    \ The exception to this occurs when you use the ARGV[0] variable to pass the filename\
    \ to the program through the command line. In effect, you “open” it on the command\
    \ line. As with other languages, every Perl program has three filehandles that\
    \ are automatically opened: STDIN (the keyboard), STDOUT (the screen, to which\
    \ the print and write functions are written by default), and STDERR (the screen,\
    \ used to display error messages).\n\nYou will now learn common methods for opening\
    \ and processing external files. The first program, pread.pl, passes the filename\
    \ on the command line, using the standard array variable that is reserved to do\
    \ just that, ARGV[0]. This Perl program displays the contents of a file. (Recall\
    \ that you can also use cat, less, and more for doing this.)\n\n**To use Perl\
    \ to display the contents of a file:**\n\n+   1. Use the cat command (or the editor\
    \ of your choice) to create the test file students, containing the names Joseph,\
    \ Alice, Mary, Zana, Aarom, Barbara, and Larry.\n2. Save the file."
  merge: -1
  img_proc: true
- pgno: 349
