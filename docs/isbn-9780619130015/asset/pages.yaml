  md: '# # objectives


    In this lesson you will:


    +   - Create an HTML document for the World Wide Web

    - Use Perl and CGI scripts to make your Web pages interactive

    - Use X-Window and Netscape to retrieve Web pages


    # # Creating an Interactive Web Page


    # ## Setting Up a Web Page


    You can create a Web page using **HTML (Hyper Text Markup Language)**. HTML is
    a format for creating documents with embedded codes known as *tags*. When the
    document is viewed in a Web browser, such as Netscape Navigator or Internet Explorer,
    the tags give the document special properties. Examples of properties include
    foreground and background colors, font size and color, and the placement of graphic
    images. In addition, HTML tags let you place **hyperlinks** in a document. A hyperlink
    is text or an object that, when clicked, loads another document and displays it
    in the browser.


    After you use HTML to create a Web page, you then publish the page on a Web server.
    A **Web server** is a system connected to the Internet running Web server software,
    such as Apache. The Web server software lets other users access the HTML document
    via the Internet.


    You may experiment with and test HTML documents using your Linux system''s loopback
    networking feature. The **loopback** feature allows your UNIX or Linux system
    to access its own internal network configuration instead of an external network.
    To use the loopback, you do not need to be connected to any network. More importantly,
    the loopback can emulate a real-world Web site, so you can carry out the testing
    and development of your new Web pages. Stand-alone testing of new Web pages is
    recommended: after fully testing your work, you can then later transfer your documents
    to any Web server, knowing that they are ready to perform.


    tip


    > To run the Web pages and CGI programs in this lesson, you must have the Apache
    Web Server program installed on your Linux Computer. (See Appendix C for instructions
    on installing Apache.)'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# # Creating Web Pages


    You may use a visual HTML editor, such as Netscape Composer or Microsoft FrontPage,
    to create Web pages. These programs let you graphically construct a Web page in
    a “what you see is what you get” fashion. If you have no visual HTML editor, all
    you need is a text editor. You create the HTML document by typing its text and
    the desired embedded tags. Here is a sample HTML file.


    ```

    <HTML>

    <HEAD><TITLE>My Simple Web Page</TITLE></HEAD>

    <BODY>

    <H1>Just a Simple Web Page</H1>

    This is a Web page with no frills!

    </BODY>

    </HTML>

    ```


    All special codes contained inside angled brackets <> are tags. The first tag,
    <HTML>, identifies the file as an HTML document. Notice the corresponding </HTML>
    tag at the end of the file. Everything between the <HTML> and </HTML> tags are
    considered text with HTML tags. In general, most tags are used this way. One tag
    marks the beginning of a section, while a corresponding tag marks the end of the
    section.


    Note that there are two parts to the code: a head and a body. The **head** contains
    the title, which appears on the top bar of your browser window. The **body** defines
    what appears within the browser window. All other tags refine the Web page''s
    appearance. Figure 9-19 shows the Web page''s appearance in the Netscape Web browser.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_364_0.png)


    **Figure 9-19: Simple Web page**'
  merge: -1
  img_proc: true
