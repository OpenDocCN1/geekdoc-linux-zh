  md: '# chapter 1, lesson B


    # To view the contents of large files on the screen with the less command:


    +   1. Type less /etc/termcap after the command prompt, and press Enter. You see
    a long file of text on your screen.

    2. Press the down arrow key several times to scroll forward in the file one line
    at a time.

    3. Press the up arrow key several times to scroll backward in the file one line
    at a time.

    4. Press Pg Dn, Space, z, or f to scroll forward one screen.

    5. Press Pg Up or b to return to a previous screen.

    6. Terminate the display by typing q (for quit) when you see a colon (:) at the
    bottom of a screen.


    Sometimes you only need to glimpse part of a file’s contents to determine what
    is stored in the file. The head command shows you the first few lines of a file—by
    default, the first 10 lines.


    # To view the first or last few lines of a file:


    +   1. Type head /etc/termcap and press Enter to see the first 10 lines of the
    /etc/termcap file.

    2. The -n option specifies the number of lines the head command displays. Type
    head -n 5 /etc/termcap and press Enter. You see the first five lines of the /etc/termcap
    file.

    3. The tail command shows you the last few lines of a file. Like the head command,
    tail displays 10 lines by default. Type tail /etc/termcap and press Enter to see
    the last 10 lines of the /etc/termcap file.

    4. The -n option specifies the number of lines the tail command displays. Type
    tail -n 5 /etc/termcap and press Enter. You see the last five lines of the /etc/termcap
    file.


    # Redirecting Output


    In UNIX, the greater than sign (>) is called the redirection symbol. You can use
    the redirection symbol to create a new file or overwrite an existing file by attaching
    it to a command that produces output. In effect, you “redirect” the output to
    a disk file instead of the monitor. You already used the who command to find out
    who was logged on to the system at Dominion. Now you can use the same command
    with the redirection symbol to save this information in a text file.'
  merge: -1
  img_proc: true
