  md: "The While Loop A different pattern for looping is created using the **while**\
    \ statement. The **while** statement best illustrates how to set up a loop to\
    \ test repeatedly for a matching condition.\n\n+   To use the while statement:\n\
    1. Use the vi or Emacs editor to create a shell script, colors.\n2. The script\
    \ should contain these lines:\n   ```\n   echo -n \"Try to guess my favorite color\
    \ \"\n   read guess\n   while [ \"$guess\" != \"red\" ]; do\n       echo \"No,\
    \ not that one. Try again. \"; read guess\n   done\n   ```\n3. Save the file and\
    \ exit the editor.\n4. Give the file execute permission, and test it. You see\
    \ output similar to Figure 6-6.\n\n![](img/6d8286a85e2d8ad63e16f1801102da59_214_0.png)\n\
    \nThe while loop tests an expression in a manner similar to the if statement.\
    \ As long as the statement inside the brackets is true, the statements inside\
    \ the do and done statements repeat.\n\nNotice the use of the != symbol, which\
    \ is the not-equal operator. It tests two operands and returns true if they are\
    \ not equal. Otherwise, it returns false. In the steps you just completed, the\
    \ echo and read statements inside the loop repeat until the user enters red.\n\
    \nAnother example of the while loop is in a data entry form."
