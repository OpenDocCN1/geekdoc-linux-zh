- pgno: 134
  md: "![](img/6d8286a85e2d8ad63e16f1801102da59_134_0.png)\n\nMake sure not to include\
    \ a space in the code sequence after the dash (-) options in the `cut` command.\
    \ For example, the correct syntax is `cut` (space) `-c14-25,26-35,36` (space)\
    \ `corp_phones2`.\n\nUsing the `cut` command with variable-length or fixed-length\
    \ records produces similar results. Cutting from fixed-length records creates\
    \ a more legible display, but requires more storage space. For example, `corp_phones2`\
    \ requires 345 bytes and `corp_phones1` requires 279.\n\n# Using the sort Command\n\
    \nUse the `sort` command to sort a file’s contents alphabetically or numerically.\
    \ UNIX displays the sorted file on the screen by default, but you can specify\
    \ that you want to store the sorted data in a particular file.\n\nThe `sort` command\
    \ offers many options, which Appendix B, “Syntax Guide to UNIX Commands,” describes.\
    \ Here is an example of its use:\n\n```\n`sort file1 > file2`\n```\n\nIn this\
    \ example, the contents of `file1` are sorted and the results stored in `file2`.\
    \ (If the output is not redirected, `sort` displays its results on the screen.)\
    \ Here is a more complex example:\n\n```\n`sort +.10 file1 > file2`\n```\n\nThis\
    \ command specifies a sorting key. A sorting key is a field or character position\
    \ within each line. The `sort` command sorts the lines based on the sorting key.\
    \ The `+` indicates that sorting does not begin at the first character position,\
    \ but is offset elsewhere in the line. The period (.) indicates that the offset\
    \ is measured in characters. (If the period is missing, the offset is measured\
    \ in fields.) The number of characters to offset follows the period. The sample\
    \ command tells the `sort` command that the sort key begins at character position\
    \ 10.\n\nSorting the `corp_phones1` file is relatively easy, because you can refer\
    \ to field numbers. As you will see when you perform the next steps, sorting the\
    \ fixed-length file, `corp_phones2`, is more difficult. In the first two steps,\
    \ you sort the `corp_phones2` file by last name and first name, respectively.\
    \ In the third and fourth steps, you do the same thing with `corp_phones1`. Notice\
    \ that the output of these four steps goes to `stdout` (the screen). The last\
    \ step uses the `-o` option, instead of output redirection, to write the sorted\
    \ output to a new disk file, `sorted_phones`.\n\n# To sort the phones2 file:\n\
    \n1. After the `$` command prompt, type `sort +.13 corp_phones2` and press Enter.\
    \ This sorts the file by last name, starting at offset 13 (+.13). You see the\
    \ following on your screen:\n\n```\n`219 432 4567 Harrison Joel M 4540 Accountant\
    \ 09-12-1985`  \n`219 432 4587 Mitchell Barbara C 4541 Admin Asst 12-14-1995`\n\
    ```"
  merge: -1
  img_proc: true
