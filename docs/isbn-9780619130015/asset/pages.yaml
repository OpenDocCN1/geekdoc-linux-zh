  md: "```\nwhile (<>)\n{\n    $somelist[$x] = $_;\n    $x++;\n}\n```\n\nthe next\
    \ line in the file is automatically copied into the $ _ variable. The assignment\
    \ statement:\n\n```\n$somelist[$x] = $_;\n```\n\ncopies the contents of the $\
    \ _ variable into an element of the array. The element is determined by the variable\
    \ $x, which is used as a subscript. After the assignment operation occurs, the\
    \ following statement executes:\n\n```\n$x++;\n```\n\nThe ++ operator adds one\
    \ to its argument, so the statement increments the variable $x. As a result, the\
    \ first name, Aaron, is placed in $somelist[0], Alice is placed in $somelist[1],\
    \ and so on.\n\nThe statement:\n\n```\n@sortedlist = sort @somelist;\n```\n\n\
    sorts the array, @somelist, placing the alphabetized names into @sortedlist, and\
    \ the final instruction prints the alphabetized list of students’ names.\n\n#\
    \ ### Using Perl to Sort Numeric Fields\n\nSorting numeric fields requires using\
    \ a subroutine where you can define comparison conditions (e.g., greater than,\
    \ less then, or equal to) between the data you are sorting. The sort routine is\
    \ then called repeatedly, passing two elements to be compared on each call. The\
    \ scalar variables $a and $b store the two values that are compared to select\
    \ the larger value. Using the comparison operation, a return code of −1, 0, or\
    \ +1 is returned, depending on whether $a is less than, equal to, or greater than\
    \ $b, as in the demonstrated code:\n\n```\nsub numbers\n{\n    if ($a < $b) {\
    \ -1; }\n    elsif ($a == $b) { 0; }\n    else { +1; }\n}\n```\n\nWhen sorting\
    \ numbers, you need to instruct Perl to use this sort subroutine as the comparison\
    \ function, rather than the built-in ASCII ascending sort (the default). To do\
    \ this, place the name of the subroutine between the keyword sort and the list\
    \ of items to be sorted:\n\n```\n$sortednumbers = sort numbers 101, 87, 34, 12,\
    \ 1, 76;\n```\n\nThe statement instructs Perl to sort the values in the list but\
    \ use the numbers subroutine to determine their order. The output is in numeric\
    \ order, not ASCII order."
