    ```

    219-555-4567:Harrison:Joel:M:4540:Accountant:09-12-1985 219-555-4587:Mitchell:Barbara:C:4541:Admin
    Asst:12-14-1995 219-555-4589:Olson:Timothy:H:4544:Supervisor:06-30-1983 219-555-4591:Moore:Sarah:H:4500:Dept
    Manager:08-01-1978 219-555-4567:Polk:John:S:4520:Accountant:09-22-1998 219-555-4501:Robinson:Albert:J:4501:Secretary:08-12-1997

    ```


    +   3. Save the file and exit the editor.


    +   4. Use the following grep command to search the file for specific phone numbers.


    ```

    grep 219-555-4591 corp_phones <Enter>

    ```


    The output should look like:


    ```

    219-555-4591:Moore:Sarah:H:4500:Dept Manager:08-01-1978

    ```


    +   5. Use a similar grep command to search the file for all Accountants. Your
    screen should look similar to Figure 6-9.'
