- pgno: 130
  md: 'Note: The **paste** command normally sends its output to the screen. To capture
    it in a file, use the redirection symbol.


    As you can see, the **paste** command is most useful when you combine files that
    contain columns of information. When **paste** combines items into a single line,
    it separates them with a tab. For example, look at the first line of the food
    file:


    ```

    Carrots          Whole wheat

    ```


    When **paste** combined “Carrots” and “Whole wheat,” it inserted a tab between
    them. You can use the **-d** option to specify another character as a delimiter.
    For example, to insert a comma between the output fields instead of a tab, Becky
    types the **paste** command:


    ```

    paste -d'','' vegetables bread > food

    ```


    After Becky’s command executes, the food file’s contents are:


    ```

    Carrots,Whole wheat

    Spinach,White bread

    Lettuce,Sourdough

    Beans,Pumpernickel

    ```


    Now you can use the **paste** command to combine the two product files in one.
    (Use **paste** instead of **cat**, because you’re combining fields from two or
    more files.)


    ![](img/6d8286a85e2d8ad63e16f1801102da59_130_0.png)


    # ## Using the Cut Command to Extract Fields


    You have learned that files can consist of records, fields, and characters. You
    may want to retrieve some, but not all, fields in a file. You can use the **cut**
    command to remove specific columns or fields from a file. The syntax of the **cut**
    command is:


    **Syntax**


    ```

    cut -f list [-d char] file1 file2 ...

    Or

    cut -c list file1 file2 ...

    ```'
  merge: -1
  img_proc: true
- pgno: 131
  md: "# ## Dissection\n\n+   - -f specifies that you are referring to fields.\n\n\
    +   - *list* is a comma-separated list or a hyphen-separated range of integers\
    \ that specifies the field. For example, `-f 1` indicates field 1, `-f 1,14` indicates\
    \ fields 1 and 14, and `-f 1-14` indicates fields 1 through 14.\n\n+   - -d indicates\
    \ that a specific character separates the fields.\n\n+   - *char* is the character\
    \ used as the field separator (delimiter), for example, a comma. The default field\
    \ delimiter is the Tab character.\n\n+   - *file1, file2* are the files from which\
    \ you want to cut columns or fields.\n\n+   - -c references character positions.\
    \ For example, `-c 1` specifies the first character and `-c 1,14` specifies characters\
    \ 1 and 14.\n\nRecall the vegetables and bread files in Becky's home directory.\
    \ She also has the file meats. When she uses the command `paste vegetables bread\
    \ meats > food`, the contents of the food file are:\n\nCarrots \t Whole wheat\
    \ \t Turkey\nSpinach \t White bread \t Chicken\nLettuce \t Sourdough \t Beef\n\
    Beans \t Pumpernickel \t Ham\n\nBecky wants to extract the second column of information\
    \ (the bread list) from the file and display it on the screen. She types the following\
    \ command:\n\n```\ncut -f2 food\n```\n\nThe option `-f2` tells the `cut` command\
    \ to extract the second field from each line. Tab delimiters separate the fields,\
    \ so `cut` knows where to find the fields. She sees the following output on the\
    \ screen:\n\n```\nWhole wheat\nWhite bread\nSourdough\nPumpernickel\n```\n\nShe\
    \ extracts the first and third columns from the file with the command:\n\n```\n\
    cut -f1,3 food\n```\n\nThe results of the command are:\n\n```\nCarrots \t Turkey\n\
    Spinach \t Chicken\nLettuce \t Beef\nBeans \t Ham\n```"
  merge: -1
  img_proc: true
