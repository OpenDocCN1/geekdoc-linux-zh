    \ You will\nmake this change by editing the `phoneadd` program (which provides\
    \ the user with\ndata-entry screens) that you already created. Your first step\
    \ in editing the program\nis to create a program algorithm.\n\n# Creating Program\
    \ Algorithms\n\nAn **algorithm** is a sequence of commands or instructions that\
    \ produces a desired\nresult. The algorithm to solve a specific problem is frequently\
    \ developed by following\nthe logic shown in a flowchart and the expressed conditions\
    \ necessary to carry out\nthe logic described in the pseudocode.\n\nHere is the\
    \ pseudocode for repositioning the cursor at the previous field when\nthe user\
    \ enters the minus sign (-):\n\n```\nRead information into field2.\nWhile field2\
