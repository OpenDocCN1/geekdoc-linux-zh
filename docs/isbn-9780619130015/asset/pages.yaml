    \ in a file and count lines\n$filein = $ARGV[0];\nwhile (<>)\n{\n      print \"\
    $_\";\n      ++$line_count\n}\nprint (\"File \\\"$filein\\\" has $line_count lines.\
    \ \\n\");\n```\n\n+   4\tSave the file and quit the editor.\n\n+   5\tGive the\
    \ file execute permission.\n\n+   6\tTest the program by typing */perread.p1 students*\
    \ and then pressing **Enter**.\n\nYour screen should now display the contents\
