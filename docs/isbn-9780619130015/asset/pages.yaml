- pgno: 404
  md: "new executable file. However, keeping track of what needs to be recompiled\
    \ and what does not can become an overwhelming task when the program involves\
    \ dozens of source-code files. This is where the `make` utility helps.\n\nThe\
    \ **make utility** tracks what needs to be recompiled by using the time stamp\
    \ field for each source file. All you have to do is create a control file, called\
    \ the **makefile** (which is actually a file named `Makefile`), for the `make`\
    \ utility to use. The control file lists all your source files and their relationships\
    \ to each other. These relationships are expressed in the form of targets and\
    \ dependencies. A **target file** depends on another file to determine if any\
    \ action needs to be taken to rebuild the target file. (The ultimate target file\
    \ is, of course, the executable file that results from linking all the object\
    \ files together.) The **dependent files** are source files, such as the `.c`\
    \ source files, or `.h` files that serve as headers to be included within the\
    \ source files.\n\nThe `Makefile` must exist in the current directory. It feeds\
    \ the `make` utility all it needs to know to recompile any changed modules and\
    \ then relink the objects to produce a new executable program. You can also give\
    \ the `makefile` another name, such as `make_abs`. To do this, you need to enter\
    \ an `-f` option followed by the name of the `makefile`. This is useful when you\
    \ are developing more than one application from within the same directory.\n\n\
    The contents of `make_abs`, an example of a `makefile`, follow:\n\n```\n```\n\
    abs_main.o: abs_main.c\n        gcc -c abs_main.c\nabs_func.o: abs_func.c\n  \
    \      gcc -c abs_func.c\nabs2: abs_main.o abs_func.o\n        gcc abs_main.o\
    \ abs_func.o -o abs2\n```\n```\n\nTwo types of lines are shown in the file: dependencies\
    \ and commands. The first line is a dependency, and the second line is a command:\n\
    \n```\n```\nabs_main.o: abs_main.c\n        gcc -c abs_main.c\n```\n```\n\nThe\
    \ first line establishes a dependency between `abs_main.o` and `abs_main.c`. If\
    \ `abs_main.c` is newer than `abs_main.o`, the command on the second line executes\
    \ (rebuilding `abs_main.o`).\n\nThe third and fourth lines, as well as the fifth\
    \ and sixth lines, establish similar dependencies and commands.\n\nThe command\
    \ line entry to build the `abs2` program using the `makefile` is:\n\n```\n```make\
    \ -f make_abs abs2```\n```\n\nThe `-f` option instructs `make` to read the file\
    \ `make_abs` instead of `makefile`. After executing the command, you can run the\
    \ `abs2` program. Figure 10-10 shows the output of the `make` command and the\
    \ `abs2` program."
