- pgno: 379
  md: '# LESSON A

    objectives


    In this lesson you will:


    +   * Create simple C programs

    * Use the make utility to revise and maintain source files

    * Identify program errors and fix them

    * Create a complete C programming application


    # C Language Programming


    In this chapter, you learn not only how to write C programs, but also how to use
    other software development tools, such as the make utility. The **make utility**
    is a UNIX program that controls compilation as you make changes and additions
    to the programs as they are being developed. Finally, you also write simple C++
    programs, so you can understand how C++ programming differs from C programming.


    # Introducing C Programming


    C is the language in which UNIX was developed and refined. The original UNIX operating
    system was written in assembly language. **Assembly language** is a low-level
    language that provides maximum access to all the computer''s devices, both internal
    and external. However, assembly language requires more coding and a greater in-depth
    treatment of all internal control items. The C language was partly developed to
    resolve the more lengthy requirements of assembly language. It has drastically
    reduced these requirements to a high-level set of easy-to-understand instructions.
    Dennis Ritchie and Brian Kernighan, two Bell Lab employees, rewrote most of UNIX
    using C in the early 1970s.


    Note: Ken Thompson, another Bell Lab employee, also deserves credit for his influence
    on the development of C. He wrote a forerunner of C, called B, in 1970 for the
    first UNIX system to run on the DEC PDP-7 mini-computer.


    Since its inception, the C language has evolved from its original design as an
    operating system language to its current status as a major tool in the development
    of any high-performance application for general use. Since C is native to UNIX,
    it works best as a UNIX application development tool, where the operating system
    views the application as an extension of its core functionality. For example,
    daemons (specialized system process that run in the background) are written in
    C. They access the UNIX system code just as any other part of the operating system.


    C programming may be described, in a nutshell, as a language that uses relatively
    small, isolated functions to break down large complex tasks into small and easily
    resolved subtasks. This function-oriented design allows programmers to create
    their'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'own program functions to interact with the predefined system functions to create
    powerful and comprehensive solutions to the largest of applications.


    Using C to write a program for Dominion''s security demonstration is a good choice.
    Because C is a compiled language, the program source code cannot be viewed. Before
    you begin to write this program, however, you first need to learn the basics of
    C programming.


    # ## Creating a C Program


    A C program consists of separate bodies of code, known as **functions**. In other
    languages, bodies of code have different names, such as subroutines or procedures.
    Each of these bodies of code is designed so it contributes to the execution of
    a single task. You put together a collection of these functions, and they become
    a program. Within the program the functions call each other as needed and work
    to solve the problem for which the program was originally designed.


    Creating a program is never done in a single step. As a programmer, you complete
    many phases before the program is ready to run. The first phase is to create the
    source code of the program. As with shell scripts and Perl programs, you use a
    text editor, such as vi or Emacs, to create C programs.


    The next phase is to execute the preprocessor and compiler. The **preprocessor**
    makes modifications to your program, such as including the contents of other files
    and creating constant values. After the preprocessor prepares your program, the
    **compiler** executes. The compiler is a program that translates the source code
    into **object code**, which consists of binary instructions. If you made errors,
    the compiler locates many of them. When this happens, you use the text editor
    to correct the errors and recompile the program.


    Many compilers translate source code into assembly code. This requires that an
    **assembler** be invoked to translate the assembly code into object code. The
    compiler usually invokes the assembler automatically, so you do not need to enter
    additional commands. Some compilers translate directly from source code into object
    code, skipping the assembly step. Whatever type of compiler you use, the outcome
    of this phase is the creation of a file that contains object code.


    The final phase requires the use of another tool called a **linker**. This program
    links all the object files that belong to the program, along with any library
    functions the program may use. The result is an **executable file**. The entire
    process is depicted in Figure 10-1.


    # ## C Key Words


    The C language, like all programming languages, includes **key words**. These
    key words have special meanings, so you cannot use them as names for variables
    or functions. Table 10-1 lists C key words.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_381_0.png)


    Figure 10-1: C program compilation process


    # The C Library


    As you can see from Table 10-1, the C language is very small. It has no input
    or out-<br>put facilities as part of the language. All I/O is performed through
    the C library. The<br>**C library** consists of functions that perform file, screen,
    and keyboard operations, as<br>well as many other tasks. For example, certain
    functions perform string operations,<br>memory allocation and control, math operations,
    and much more. When you need<br>to perform one of these operations in your program,
    you place a **function call** at the<br>desired point. The linker joins the code
    of the library function with your program’s<br>object code to create the executable
    file.'
  merge: -1
  img_proc: true
