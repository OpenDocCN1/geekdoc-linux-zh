- pgno: 448
  md: "Now that you have learned the basic techniques of interacting with the X Window\
    \ system, and the GNOME environment in particular, you are ready for more advanced\
    \ operations. In the next lesson you will learn to run built-in X Window applications\
    \ and configure your desktop.\n\n# SUMMARY\n\n+   The X Window system is a graphical\
    \ user interface, or GUI, that runs on many UNIX and Linux systems. It allows\
    \ users to run applications transparently across a network.\n\n+   The X Window\
    \ system is built in layers. The top layer, with which the user interacts, is\
    \ called the Window Manager. By default, Red Hat 6 uses the Enlightenment Window\
    \ Manager with the GNOME environment.\n\n+   Use the startx command at the command\
    \ line to start the X Window system. A line in the /etc/initab file directs Linux\
    \ to start the X Window system automatically.\n\n+   The GNOME environment consists\
    \ of icons, a panel, windows, and the desktop area.\n\n+   You resize, move, minimize,\
    \ maximize, and close a window by interacting with its border, title bar, and\
    \ buttons.\n\n+   The GNOME Panel provides access to the Main menu and icons for\
    \ applets. One applet is the Pager, which shows the virtual desktops and buttons\
    \ for all the running applications. The panel provides a button that hides and\
    \ shows it.\n\n+   You can configure the Clock applet to display the date and\
    \ the time in 12-hour, 24-hour, or the internal UNIX format.\n\n# REVIEW QUESTIONS\n\
    \n+   1. In the X Window client/server model, the system that hosts and executes\
    \ the application is the \n    a. client\n    b. server\n    c. workstation\n\
    \    d. host\n\n+   2. The top layer of the X Window system is the \n    a. X\
    \ Window kernel\n    b. network manager\n    c. Window Manager\n    d. window\
    \ shell"
