    # # S U M M A R Y


    +   ■ Bytes are “computer characters” stored using numeric codes. A set of standardized

    codes known as ASCII codes is often used. ASCII stands for the American Standard

    Code for Information Interchange. Computer files that contain only ASCII characters

    (bytes) are called text files.


    +   ■ The vi editor remains the choice of most UNIX users. Standard editors process
    text

    files. Text files are also called “flat files” or “ASCII files.”


    +   ■ The vi editor is a modal editor, because it works in two modes: insert mode
    and com-

    mand mode. Insert mode lets you enter text, and command mode lets you navigate
    the

    file and modify the text.


    +   ■ In the vi editor’s insert mode, characters you type are inserted in the
    file. They are not

    interpreted as vi commands. To exit insert mode and re-enter command mode, press
    Esc.


    +   ■ With vi, you initially edit a copy of the file placed in the computer’s
    memory. You do

    not alter the file itself until you save it on disk.


    # # C O M M A N D   S U M M A R Y


    **Chapter 3, Lesson A commands**


    | Command | Purpose |

    | :--- | :--- |

    | *vi Commands* | |

    | . (repeat) | Repeat your most recent change |

    | / | Search forward for a pattern of characters |

    | :! | Leave vi temporarily |

    | :q | Cancel an editing session |

    | :r | Read text from one file and add it to another |

    | :set | Turns on certain options, such as line numbering |'
