- pgno: 206
  md: '| Operator | Description | Example |

    |---|---|---|

    | `, +` | Unary minus and plus | `+R` (denotes positive R) <br> `-R` (denotes
    negative R) |

    | `! , ~` | Logical and bitwise negation | `!Y` (returns 0 if Y is non-zero, returns
    1 if Y is zero.) <br> `~X` (reverses the bits in X) |

    | `* , / , %` | Multiplication, division, and remainder | `A * B` (returns A times
    B) <br> `A / B` (returns A divided by B) <br> `A % B` (returns the remainder of
    A divided by B) |

    | `+, -` | Addition, subtraction | `X + Y` (returns X plus Y) <br> `X - Y` (returns
    X minus Y) |

    | `>, <` | Greater than and less than | `M > N` (Is M greater than N?) <br> `M
    < N` (Is M less than N?) |

    | `= , !=` | Equality and inequality | `Q = R` (Is Q equal to R?) <br> `Q != R`
    (Is Q not equal to R?) |


    Table 6-3: Examples of the shell’s arithmetic operators


    When using arithmetic operators, the usual mathematical precedence rules apply:
    multiplication and division are performed before addition and subtraction. For
    example, the value of the expression 6 + 4 * 2 is 14, not 20. Precedence can be
    overridden, however, by using parentheses. For example, the value of the expression
    (6 + 4) * 2 is 20, not 14. Other mathematical rules also apply; for example, division
    by zero is treated as an error.


    To store arithmetic values in a variable, use the let statement. For example,
    the following command stores 14 in the variable X:


    ```

    let X=6+4*2

    ```


    You can use shell variables as operands to arithmetic operators. Assuming the
    variable X has the value 14, the following command stores 18 in the variable Y:


    ```

    let Y=X+4

    ```


    # To practice using the arithmetic operators:


    +   1. Type let X=10+2*7 and press Enter.

    2. Type echo $X and press Enter. You see 24 on the screen.

    3. Type let Y=X+2*4 and press Enter.

    4. Type echo $Y and press Enter. You see 32 on the screen.'
