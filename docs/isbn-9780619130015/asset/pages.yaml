- pgno: 297
  md: '# ## Using the File Processing Utilities


    Recall that the file processing utilities help you display and manipulate files.
    You use several of these utilities to complete your tasks. First, you use the
    dd command to copy a file and change the format of the destination file at the
    same time.


    # ### Using the dd Command


    Files not only store information, but they also store it in a particular format.
    For example, most computers store text using ASCII codes. (IBM mainframes, however,
    use EBCDIC codes to store text.) In addition to the internal codes that computers
    use to store information, some files store text in all uppercase letters. Likewise,
    other files store text in all lowercase letters. Some files include only records,
    where each record consists of several fields. A special character, such as a colon,
    separates the fields, and each record ends with a new-line character. Different
    files have different internal formats, which depend upon how the file is used.


    Whereas the standard UNIX copy utility, cp, duplicates a file, it cannot alter
    the format of the destination copy. Therefore, when you need to copy a file and
    change the format of the destination copy, use the dd command instead. Possessing
    a rich set of options that allow it to handle copies when other methods are inappropriate,
    the dd command can handle conversions to and from IBM’s EBCDIC character types
    to standard ASCII characters. The dd command is frequently used for devices such
    as tapes, which have discrete record sizes, or for fast multi-sector reads from
    disks.


    Note: For information about the options available for this command and others
    in this chapter, refer to Appendix B, “Syntax Guide to UNIX Commands.”


    The dd command has the general form:


    **Syntax**    dd [options]


    *Options* include if=*filename* and of=*filename*, which specify the input and
    output files, respectively. Another frequently used option is bs=*n*, which specifies
    the block size, *n*, as an integer. You also have options to specify the input
    block size (*ibs*=*n*) and output block size (*obs*=*n*). Specifying block size,
    an optional requirement, speeds copying, especially when copying backups to tape.


    Another advantage that the dd command has over cp is that all users, not just
    the system administrator, can copy files to and from the floppy drive. With cp,
    you must mount a floppy disk if you need to copy to or from the floppy disk. Usually,
    only the system administrator, who must be logged on as root, can issue the mount
    command. With the dd command there is no need to mount the floppy device to access
    it.


    By duplicating a file with dd, you can learn the command’s basic usage.'
  merge: -1
  img_proc: true
