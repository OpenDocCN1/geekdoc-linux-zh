    \n# ## Analyzing the Program\n\nA computer program is developed by analyzing the\
    \ best way to achieve the desired results. Standard programming analysis tools\
    \ help you do this. The two most popular and proven analysis tools are the program\
    \ flowchart and pseudocode.\n\n# ### Flowcharting\n\nThe flowchart is a logic\
    \ diagram that uses a set of standard symbols that explain the program’s sequence\
    \ and each action it takes. For example, look at the flowchart in Figure 7-1."
