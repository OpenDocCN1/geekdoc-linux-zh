  md: 'By using the | operator, this command also works as a filter in cases where
    the input comes from the output of another UNIX command. For example, the following
    command sends the output of the cat command to tr:


    ```

    cat names | tr -s ":" " "

    ```


    This sample command sends the contents of the names file to tr. The tr utility
    replaces each occurrence of the : character with a space. The tr utility works
    like the sed command, except that sed changes the standard input string by string,
    not character by character.


    You now use the tr utility to change lowercase characters to uppercase, as well
    as replace colon characters with spaces.


