    # The Paste Command


    The paste command combines files side by side, whereas the cat command combines
    files end to end. When you use paste to combine two files into a third file, the
    first line of the third file contains the first line of the first file followed
    by the first line of the second file. For example, Becky has the file vegetables
    in her home directory. Its contents are:


    ```

    Carrots

    Spinach

    Lettuce

    Beans

    ```


    She also has the file bread in her home directory. Its contents are:


    ```

    Whole wheat

    White bread

    Sourdough

    Pumpernickel

    ```


    After she executes the command paste vegetables bread > food, the vegetables and
    bread files are combined, line by line, into the file food. The food file’s contents
    are:


    ```

    Carrots    Whole wheat

    Spinach     White bread

    Lettuce     Sourdough

    Beans       Pumpernickel

    ```'
