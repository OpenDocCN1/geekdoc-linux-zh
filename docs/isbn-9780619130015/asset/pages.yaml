  md: '# Using the du Utility


    The du utility summarizes disk usage. If you enter the command without options,
    you receive a report based on all file usage, starting at your current directory
    and progressing down through all subdirectories. File usage is expressed in number
    of 512-byte blocks (default) or by the number of bytes (the -b option).


    # To report on disk usage:


    +   1. If you are still logged on as root, log out and then log on under your
    account.


    +   2. To receive a report on disk usage starting at your home directory, type
    du l more and then press Enter. (The results of the du command can be lengthy,
    so pipe its output to the more command.) Figure 8-9 shows an example of the command''s
    output.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_306_0.png)


    Figure 8-9: Output of du l more command


    +   3. The output shows the number of 512-byte blocks used in each subdirectory
    (including hidden subdirectories). Type q to exit the more command.


    +   4. To receive a report on disk usage by number of bytes starting at your home
