- pgno: 71
  md: '# LESSON B


    # Working with Files

    and Directories


    # objectives


    After studying this lesson, you

    should be able to:


    +   • Create new directories to store files

    • Copy files from one directory

    to another

    • Set file permissions to let other

    users access your directory and files


    # Creating Directories and Files


    As part of your work to create Dominion’s centralized telephone database, your

    manager at Dominion, Rolf e Williams, asks you to create directories for depart-

    ments 4540 and 4550 and then create files of department phone numbers to store

    in those directories. You can use the mkdir (make directory) command to create
    a

    new directory and the cat command to create the phone files.


    To create new directories and phone files:


    +   1 Type **cd** and press **Enter** to make sure you are in your home directory.

    2 Type **mkdir dept_4540** and press **Enter** to make a new directory called

    dept_4540.

    3 Type **ls** and press **Enter**. You see the dept_4540 directory in the listing.

    4 Type **cd dept_4540** and press **Enter** to change to the new directory. Now
    you

    can use the **cat** command to create a file called phones1. The phones1 file

    contains fields for area code, phone prefix, phone number, last name, and

    first name. A colon (:) separates each field.

    5 Type these commands, pressing **Enter** at the end of each line:

    ```

    cat > phones1

    219:432:4567:Harrison:Joel

    219:432:4587:Mitchell:Barbara

    219:432:4589:Olson:Timothy

    ```

    6 Press **Ctrl+D**.

    7 Type **cd** and press **Enter** to return to your /home directory.'
