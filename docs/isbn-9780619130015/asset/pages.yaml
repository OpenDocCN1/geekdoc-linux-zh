    # ## A Brief Introduction to Awk


    Awk, a pattern-scanning and processing language, helps to produce professional-looking
    reports. Although you can use the cat and more commands to display the output
    file that you create with your join program, the awk command (which starts the
    Awk program when you type it on the command line) lets you do the same thing more
    quickly and easily. The syntax of the awk command is:


    Syntax | awk [-Fsep] '' pattern {action} ..'' filenames

    ---|---

    Dissection | ■ awk checks to see if the input records in the specified files satisfy
    the *pattern* and, if they do, awk executes the *action* associated with it. If
    no *pattern* is specified, the *action* affects every input record.

    ■ -F: means the field separator is a colon.


    +   **To generate and format the vendor report:**

    1 After the $ command prompt, type `awk -F: ''{printf "%-28s|t %s\n", $1, $2}''
    vreport` and then press **Enter**. This command is explained in detail after Step
    2.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# ### 132


    chapter 4, lesson ■


    2 You see the vendor report, including vendor names and product descriptions:


    Cromwell Interiors    Lobby Furniture

    Design Extras Inc.    Ballroom Specialties

    Piedmont Plastics Inc.    Poolside Carts

    Morgan Catering Service Ltd.    Formal Dining Specials

    Pullman Elevators    No Products

    Johnson Office Products    No Products


    The parts of the awk command you typed in Step 1 are:


    +   - **awk -F:** calls the Awk program and identifies the field separator as
    a colon.


    +   - **{''printf "%-28s\t %s\n", $1, $2''}** represents the *action* to take
    on each line that is read in. Single quotes enclose the action.


    +   - **printf** is a print formatting function from the C language. It lets you
    specify an edit *pattern* for the output. The code inside the double braces defines
    this pattern. The code immediately following the % tells how to align the field
    to be printed. The − sign specifies left alignment. The number that follows, 28,
    indicates how many characters you want to display. The trailing s means that the
    field consists of non-numeric characters, also called a “string.” The \t inserts
    a tab character into the edit pattern. The %s specifies that another string field
    should be printed. You do not need to specify the string length in this case,
    because it will be the last field printed (the product name). The \n specifies
    to skip a line after printing each output record. The $1 and $2 separated with
    a comma indicates that the first and second fields in the input file should be
    placed in the edit pattern where the two s’s appear. The first field is the vendor
    name, and the second is the product description.


    +   - **vreport** is the name of the input file.


    # ## Using the Awk Command to Refine the Vendor Report


    To refine and automate the vendor report, you can create a shell script, as you
    did at the beginning of this lesson. This new script, however, includes only the
    awk command, not a series of separate commands. You then call the Awk program
    using awk with the −f option. This option tells awk that the code is coming from
    a disk file, not from the keyboard. You can present the *action* statements inside
    the Awk program file in a different way. The program file includes additional
    lines needed to print a heading and the current date for the report.


    The next steps show what happens when you enter the Awk program in a file like
    this. You use the FS variable to tell the program what the field separator is,
    in this example, a colon. FS is one of many variables that awk uses to advise
    the program about the file being processed. Other codes you see here set up an
    initial activity that executes once when the program loads. BEGIN followed by
    the opening curly brace (\{) indicates this opening activity. The closing curly
    brace (\}) marks the end of actions performed when the program first loads. These
    *actions* print the headings, date, and dash lines that separate the heading from
    the body of the report.'
  merge: -1
  img_proc: true
