- pgno: 222
  md: '# # LESSON B


    # ## Objectives


    In this lesson you will:


    +   - Create screen-management and cursor programs

    - Edit the .bashrc file to customize your personal working environment

    - Use the trap command

    - Enter and test shell programs to print the phone records, view the contents
    of the Corp_phones file, and add new phone records to the file


    # # Creating and Completing the Corporate Phones Application


    # ## Using Shell Programming to Create a Menu


    Before creating your corporate phone program, you first create a menu, which is
    a good example of a shell program that employs the four basic logic structures:
    sequence, decision, looping, and case. A significant feature of the menu program
    is the screen presentation, which you want be as appealing and user-friendly as
    possible. You can choose one of UNIX''s lesser-known commands, tput, to make your
    screen place the prompt (cursor) at the user''s data-entry point on the screen.
    The **tput command** initializes the terminal to respond to a setting that the
    user chooses. Some examples of this are:


    +   - `tput cup 0 0`: moves the cursor to row 0, column 0, the upper-left corner
    of screen

    - `tput clear`: clears the screen

    - `tput cols`: prints the number of columns for the current terminal

    - `bold=`''tput siso'''' offbold=`''tput rsmso''''`: sets boldfaced type


    **To practice the tput command:**


    - Type the following command sequence, and press **Enter**:


    ```

    ```

    tput clear ; tput cup 10 15 ; echo "Hello" ; tput cup 20 0

    ```

    ```


    You see the results of the command sequence. The screen clears: the cursor is
    positioned at row 10, column 15, on the screen; the word “Hello” is printed; and
    the prompt''s position is row 20, column 0.'
  merge: -1
  img_proc: true
- pgno: 223
  md: "Next, use the tput command to create a cursor utility. You can use this utility\
    \ in other script files to position the cursor on the screen.\n\n+   **To use\
    \ the tput command to create a cursor utility:**\n1. Use the vi or Emacs editor\
    \ to create a script file, `cursor`.\n2. Enter the following lines in the program:\n\
    \n   ```\n   tput cup $1 $2\n   ```\n3. Save the file and exit the editor.\n4.\
    \ Make the cursor script executable with the `chmod` command.\n5. Test the cursor\
    \ script by typing **cursor 10 12** and pressing **Enter**. The cursor moves to\
    \ the position 10, 12 on the screen.\n\nNotice the script is passing $1 and $2\
    \ as arguments to the `tput cup` command. These are positional parameters: they\
    \ reference arguments typed on the command line when the cursor script file is\
    \ executed. For example, when you invoked the script with the command `cursor\
    \ 10 12`, the $1 parameter holds the value 10, and the $2 parameter holds the\
    \ value 12.\n\nYou will now use the `tput` command to create screen management\
    \ and cursor programs for displaying menus and data entry screens.\n\n+   **To\
    \ use the tput command:**\n1. Use the vi or Emacs editor to enter a screen-management\
    \ program, `Scrmange`, containing the following lines:\n\n   ```\n   tput cup\
    \ $1 $2    # place cursor on row and col\n   tput clear        # clear the screen\n\
    \   bold=`tput smso`  # set standout mode - bold\n   offbold=`tput rmso` # reset\
    \ screen - turn bold off\n   echo $bold        # turn bold on\n   cursor 10 20;\
    \ echo \"Type Last Name:\" # bold caption\n   cursor 12 20; echo \"Type First\
    \ Name:\" # bold caption\n   echo $offbold     # turn bold off\n   cursor 10 41;\
    \ read lastname  # enter last name\n   cursor 12 41; read firstname # enter first\
    \ name\n   ```\n2. Save the file and exit the editor.\n3. Give the file execute\
    \ permission, and test it.\n\nYou are now ready to enter the script to display\
    \ the menu. (You will use this program as part of your application later in this\
    \ section.)"
