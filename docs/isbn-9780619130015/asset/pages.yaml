    # ## Installing the Apache Web Server


    To develop and test web pages with CGI scripts (as discussed in Chapter 9), you
    must install the Apache Web Server program. After successfully installing Red
    Hat Linux, follow these steps to install Apache.


    To install the Apache Web Server:


    +   1 Make sure you are logged on as root.

    2 Insert the Red Hat Linux CD into the CD drive.

    3 Mount the CD drive by typing mount /dev/cdrom and pressing Enter.

    4 Type cdmnt/cdrom/RedHat/RPMS and press Enter.

    5 Type ls apache*.rpm and press Enter. The output of the command should be the
    names of two files, in the form of apache-X.X.X-X.i386.rpm and apache-devel-X.X.X-X.i386.rpm
    (where the Xs represent numbers). The filenames will be similar to the following:'
  merge: -1
  img_proc: true
- pgno: 533
  md: '```

    apache-1.3.6-7.i386.rpm  apache-devel-1.3.6-7.i386.rpm

    ```


    Note that the actual numbers that are listed after apache- and apache-devel- on
    your computer may be different than those shown above.


    +   6  Type **rpm -i apache-X.X.X-X.i386.rpm** (where the Xs are the numbers you
    saw in the filename as a result of the command in Step 5) and press **Enter**.
    For example, if you saw apache-1.3.6-7.i386.rpm when you typed the command in
    Step 5, you will type **rpm -i apache-1.3.6-7.i386.rpm** and press **Enter**.


    +   7  When the installation is finished and you are returned to a command prompt,
    reboot the system by typing **shutdown -r now** and pressing **Enter**. When the
    system reboots, the Apache Web Server program will be running.'
  merge: -1
