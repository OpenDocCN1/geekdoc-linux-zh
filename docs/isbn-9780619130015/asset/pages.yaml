- pgno: 441
  md: '2  Move the mouse pointer to the right edge of the window border. The pointer
    becomes a horizontal double-headed arrow. Click and hold the left mouse button
    while dragging the mouse pointer to the right. You see the window expand horizontally.
    Drag the mouse pointer back to the left, and the window shrinks horizontally.
    Release the mouse pointer to stop resizing the window.


    3  Move the mouse pointer to the bottom edge of the screen. The pointer becomes
    a vertical double-headed arrow. Click and hold the left mouse button as you move
    the pointer, first up and then down. The window shrinks and expands vertically.


    4  Move the mouse pointer to the lower-right corner of the window. The pointer
    becomes a slanted double-headed arrow. Click and hold the left mouse button while
    dragging the mouse pointer toward the lower-right corner of the screen. The window
    expands both horizontally and vertically. Drag the pointer back toward the upper-left
    corner of the screen, and the window shrinks horizontally and vertically.


    5  Release the mouse pointer to stop resizing the window.


    # tip


    > The Help Browser contains useful information on using GNOME. Its contents are
    hyperlinked in a manner similar to a Web page.


    Other basic window operations are moving, shading, and unshading a window.


    **To practice moving, shading, and unshading a window:**


    1  Move the mouse pointer to the window’s title bar. The pointer becomes a four-way
    arrow.


    2  Click and hold the left mouse button as you drag the mouse pointer across the
    screen. The window moves to follow the mouse pointer.


    3  Release the mouse button to stop moving the window.


    4  Shading a window means to collapse it, or “draw it up” into its title bar.
    Double-click the title bar to shade the window.


    5  Double-click the title bar again to unshade the window.


    Most window components offer context-sensitive pop-up Help boxes. These are useful
    for discovering the purpose of a button or another component.'
  merge: -1
  img_proc: true
