- pgno: 333
  md: '# # LESSON A

    ## objectives


    +   In this lesson you will:


    - Learn the basics of the Perl language

    - Create simple Perl scripts with variables and logic structures

    - Create simple Perl scripts to read and sort data files


    # ## Learning to Use Perl


    In this chapter, you learn how to use Perl to create effective, interactive Web
    pages. Perl (which stands for Practical Extraction and Report Language) was created
    in 1986 by Larry Wall as a simple report generator. Since then, the author and
    others have enhanced it so that it has become a powerful programming language.
    One of the most popular uses of Perl scripts today is to make interactive Web
    pages.


    This chapter also expands on your previous knowledge of both awk and sed. You
    will learn more options and features of both by writing awk and sed scripts as
    problem-solving programs, not just as isolated commands within other programs.


    Before you can begin to create your Web page, however, you first need to learn
    more about the structure and syntax of a Perl program.


    # ### Introduction to Perl


    Perl contains a blend of features found in other languages. It is very similar
    to the C language but also contains features found in awk and shell programs.
    You will begin learning Perl by examining a few simple programs, such as this
    one:


    ```

    #!/usr/bin/perl

    # Program name: example1.p

    print ("This is a simple\n");

    print ("Perl program.\n");

    ```


    The first line in the program tells the operating system to use Perl to interpret
    the file. Recall from Chapter 7 that when the first line of a program begins with
    #!, the remainder of the line is assumed to give the path of the interpreter.


    The second line in the sample program is a comment that lists the name of the
    file. Like shell scripts, Perl programs use the # character to mark the beginning
    of a comment. The third and fourth lines of the program display text on the screen.
    The program output is shown in Figure 9-1.'
  merge: -1
  img_proc: true
