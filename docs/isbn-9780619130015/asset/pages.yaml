  md: "+   - The .SH tag indicates a section. (Section names usually appear in all\
    \ uppercase characters on a man page.) Six common sections of a man page are:\n\
    \  - NAME: the name of the command or program\n  - SYNOPSIS: a brief description\
    \ of the command or program\n  - DESCRIPTION: a detailed description of the command\
    \ or program\n  - FILES: a list of files used by the command or program\n  - SEE\
    \ ALSO: a list of other commands or programs that are related to this one.\n \
    \ - BUGS: a list of known bugs\n\n+   - The .SS tag indicates the beginning of\
    \ a subsection. For example, Options is a subsection of the DESCRIPTION section.\n\
    \n+   - The .TP tag indicates each item in the Options subsection.\n\n+   - The\
    \ \\fB command changes the font to boldface, the \\fI command changes the font\
    \ to italic, the \\fR command changes the font to roman, and the \\fP command\
