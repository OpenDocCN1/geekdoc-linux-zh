- pgno: 161
  md: "# Using the comm Command\n\nLike the **uniq** command, the **comm** command\
    \ identifies duplicate lines. Unlike the uniq command, it doesn’t delete duplicates\
    \ and it works with two files rather than one. The **comm** command locates identical\
    \ lines within two identically sorted files. It compares lines common to file1\
    \ and file2 and produces three-column output:\n\n+   * The first column contains\
    \ lines found only in file1.\n* The second column contains lines found only in\
    \ file2.\n* The third column contains lines found in both file1 and file2.\n\n\
    The syntax of **comm** is:\n\n```\nSyntax  comm [options] file1 file2\n```\n\n\
    To practice using the **comm** command, start by creating the file *my_list*.\
    \ Duplicate the file and then use the **comm** command to compare the two files.\n\
    \n+   To use the **comm** command to compare files:\n\n1. To create the file *my_list*,\
    \ after the $ command prompt, type **cat > my_list** and press **Enter**.\n\n\
    2. Type the following text, pressing **Enter** at the end of each line:\n\n  \
    \ Football\n\n   Basketball\n\n   Skates\n\n3. Press **Ctrl+D**.\n\n4. To copy\
    \ *my_list* to a second file, *your_list*, type **cp my_list your_list** and press\
    \ **Enter**.\n\n5. Now use the **comm** command to compare *my_list* to *your_list*.\
    \ Type **comm my_list your_list** and press **Enter**.\n\n6. You see the three-column\
    \ output. Notice that the lines in the third column are those that both files\
    \ contain. The files are identical.\n\n   Column 1      Column 2      Column 3\n\
    \                                   Football\n                               \
    \    Basketball\n                                   Skates\n\n7. Now add a new\
    \ line to *my_list*. Type **cat >> my_list** and press **Enter**.\n\n8. Type **Books**\
    \ and press **Enter**.\n\n9. Press **Ctrl+D**.\n\n10. Use **comm** to compare\
    \ *my_list* to *your_list* again. Type **comm my_list your_list** and press **Enter**."
