  md: '```

    End if.

    Move cursor to position of field2.

    Read information into field2.

    End While.

    ```


    One code addition to the phoneadd program uses the algorithm for re-entering fields:


    ```

    cursor 5 18; read lname

    while test "$lname" = "-"

    do cursor 4 18; echo ""

    cursor 4 18; read phonenum

    cursor 5 18; read lname

    done

    ```


    This code reads the last name into the variable lname. If lname contains a minus
    sign (-), the cursor moves to the previous field, which contains the phone number.
    The value displayed for the phone number is cleared from the screen, and a new
    value is entered into phonenum. The cursor is then moved back to the last name
    field, and the last name is entered. The while statement repeats this process
    as long as the user types a minus sign for the last name.


    Note: Using the if statement instead of the while statement allows only one return
    to the prior field. Instead, you need a loop so the process repeats as long as
    the user enters a minus sign for the field.


    Look at the while statement shown above:


    ```

    while test "$lname" = "-"

    ```


    The argument “$lname” is enclosed in quotation marks to prevent the command from
    producing an error, in the event the user types just Enter or more than one word
    for the last name. For example, if the user enters Smith Williams for the last
    name, the statement above will be interpreted as:


    ```

    while test "Smith Williams" = "-"

    ```


    However, if the statement were written without the quotation marks around $lname,
    the statement would be interpreted as:


    ```

    while test Smith Williams = "-"

    ```


    This statement causes an error message, because it passes too many arguments to
    the test command.


    You are now ready to edit the phoneadd program. You add the field re-entering
    algorithm to each part of the program that reads a value into a field.


    > **To allow re-entry of data:**


    1. Make sure you are in the source directory. Load the Phoneadd program into the
    vi or Emacs editor.'
