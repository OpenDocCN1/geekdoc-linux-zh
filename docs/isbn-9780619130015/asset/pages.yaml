- pgno: 241
  md: 'Each step in the program is represented by a symbol in the flowchart. The shape
    of the symbol indicates the type of operation being performed, such as input/output
    or a decision. Figure 7-2 shows standard flowcharting symbols and their meanings.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_241_0.png)


    **Figure 7-2:** Standard flowchart symbols'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'The arrows that connect the symbols represent the direction in which the program
    flows from one symbol to the next. In the flowchart in Figure 7-1, the arrow after
    the START terminator shows the program flowing to an output operation that displays
    the message, "What is your favorite operating system?" Next, the program flows
    to an input operation that reads a value into OS_NAME. A decision structure (represented
    by a diamond-shaped symbol) is encountered next, which compares OS_NAME to "UNIX"
    to determine if the two are equal. If so, the program follows the "Yes" branch.
    This leads to an output operation that displays the message, "You will like Linux."
    If OS_NAME and "UNIX" are not equal, the program follows the "No" branch. This
    leads to an output operation that displays the message, "You should give Linux
    a try!" The two paths then converge and flow to the END terminator.


    You manually create a flowchart using a drawing template. Flowchart templates
    provide the symbols that denote logical structures, input-output operations, processing
    operations, and the storage media that contain the files. (See Figure 7-2.) A
    variety of flowcharting software packages let you create flowcharts on your computer.
    Popular word-processing packages, such as Microsoft Word and WordPerfect, are
    also equipped with flowcharting tools.


    # ## Writing Pseudocode


    After creating a flowchart, the next step in designing a program is to write pseudocode.
    Pseudocode instructions are similar to actual programming statements. Use them
    to create a model that you can later use as a basis for a real program. For example,
    here are pseudocode statements for the os_choice program:


    ```

    Display "What is your favorite operating system? " on the screen.

    Enter data into OS_NAME.

    If OS_NAME is equal to "UNIX"

    then

    Display "You will like Linux." on the screen.

    Else

    Display "You should give Linux a try!" on the screen.

    End if.

    ```


    Pseudocode is a design tool only, and never processed by the computer. Therefore,
    there are no strict rules to follow. The pseudocode should verbally match the
    symbolic representation of logic illustrated on the flowchart. For example, Figure
    7-3 shows the flowchart and pseudocode that represent one change Dominion Consulting
    wants to make to its phone program (re-entering data in a field).


    Before you can begin to work on the program, however, you need to do some preliminary
    work. First, you must ensure that everyone who runs the program does so with the
    correct shell. To do this, modify the program so it informs the operating system
    which shell to use while interpreting the statements in the script.'
  merge: -1
  img_proc: true
