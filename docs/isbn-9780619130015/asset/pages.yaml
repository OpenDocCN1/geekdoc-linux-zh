- pgno: 121
  md: "# ## Manipulating Files\n\nWhen you manipulate files, you work with the files\
    \ themselves as well as their contents. This section explains how to complete\
    \ the following tasks:\n\n+   - Create files\n- Delete files\n- Copy files\n-\
    \ Move files\n- Find files\n- Display files\n- Combine files\n- Cut and paste\
    \ file contents\n- Sort files\n\n# ### Creating Files\n\nYou can create a new\
    \ file by using the output redirection operator (**>**). You learned how to do\
    \ this to redirect the `cat` command's output in Chapters 1–3. You can also use\
    \ the redirection operator without a command to create an empty file.\n\n```\n\
    **To create an empty file:**\n1. After the `$` command prompt, type `> newfile1`\
    \ and press **Enter**. This creates an empty file called `newfile1`.\n2. To list\
    \ the new file, type `ls -l newfile1` and press **Enter**. You see only the information\
    \ listed next, where `jean` is your user name.\n   ```\n   -rw-rw-r-- 1 jean jean\
    \      0 Nov 1 16:57 newfile1\n   ```\n3. To create another new file, type `>\
    \ newfile2` and press **Enter**.\n```\n\nYou may also use the `touch` command\
    \ to create empty files. For example, the following command creates the file `newfile3`,\
    \ if the file does not already exist.\n\n```\n```\ntouch newfile3\n```\n```\n\n\
    The primary purpose of the `touch` command is to change a file's time and date\
    \ stamp. UNIX maintains the following date and time information for every file:\n\
    \n+   - Change date and time: the date and time the file's inode was last changed\n\
    - Access date and time: the date and time the file was last accessed\n- Modification\
    \ date and time: the date and time the file was last modified\n\nAlthough the\
    \ `touch` command cannot alter a file's inode changed date and time, it can alter\
    \ the file's access and modification dates and times. By default, it uses the\
    \ current date and time for the new values."
  merge: -1
  img_proc: true
- pgno: 122
  md: "# To create a file and alter its date/time stamp with the touch command:\n\n\
    +   1.  Type **touch newfile3** and press **Enter**. This command creates the\
    \ file newfile3.\n2.  Type **ls -l newfile3** and press **Enter**. You see a long\
    \ listing for the newfile3 file. Note its modification date and time.\n    - \
    \  *Wait at least one minute.*\n3.  Type **touch newfile3** and press **Enter**.\
    \ This updates the file’s access and modification date and time stamps with the\
    \ system date and time.\n4.  Type **ls -l newfile3** and press **Enter**. Look\
    \ at the file’s modification time. It should be different now.\n\nTable 4-1 lists\
    \ and describes the *touch* command’s options.\n\n| Command option | Description\
    \ |\n| :--- | :--- |\n| -a | Updates the access time only |\n| -m | Updates the\
    \ modification time only |\n| -c | Prevents *touch* from creating the file if\
    \ it does not exist |\n\nTable 4-1: *Touch* command options\n\n# Deleting Files\n\
    \nWhen you no longer need a file, you can delete it using the *rm* (remove) command.\
    \ If you use *rm* without options, UNIX deletes the specified file without warning.\
    \ Use the *-i* (interactive) option to have UNIX warn you before deleting the\
    \ file. You can use the *rm* command to delete the new files you just created.\n\
    \n# To delete a file from the current directory:\n\n+   1.  After the $ command\
    \ prompt, type **rm newfile1** and press **Enter**.\n    -   This permanently\
    \ deletes newfile1 from the current directory.\n2.  Type **rm -i newfile2** and\
    \ press **Enter**.\n    -   You see the message, “remove ‘newfile2’?”.\n3.  Type\
    \ **y** for yes and press **Enter**."
  merge: -1
  img_proc: true
- pgno: 123
  md: "chapter 4, lesson A\n\n+   To delete a group of files using wildcards:  \n\n\
    1. You can specify multiple filenames as arguments to the `touch` command: Type\
    \ `touch file1 file2 file3 filegood filebad` and press `Enter`. This command creates\
