    \nFigure 9-13: Output of perread.p1\n\nThe first instruction ($filein = $ARGV[0];)\
    \ saves the name of the file that is passed to the program and stores it in ARGV[0].\
    \ The while loop triggers the diamond operator (<>) that sequentially reads records\
