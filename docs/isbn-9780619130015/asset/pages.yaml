- pgno: 157
  md: "# Using the Select Commands\n\nYou used the head and tail commands in Chapter\
    \ 1, and the cut command in Chapter 4. Now you can work with the grep, diff, uniq,\
    \ comm, and wc commands, which also let you process files.\n\n> Note: The command\
    \ usage in this chapter demonstrates how commands generally work. Appendix B,\
    \ “Syntax Guide to UNIX Commands,” summarizes these commands.\n\n# Using Pipes\n\
    \nAs you have seen, most UNIX commands take their input from stdin (the standard\
    \ input device) and send their output to stdout (the standard output device).\
    \ You have also used the > operator to redirect a command’s output from the screen\
    \ to a file, and the < operator to redirect a command’s input from the keyboard\
    \ to a file. The pipe operator (\\|) redirects the output of one command to the\
    \ input of another command. The pipe operator is used in the following manner:\n\
    \n```\nfirst_command | second_command\n```\n\nThe pipe operator connects the output\
    \ of the first command with the input of the second command. For example, the\
    \ output of the ls command is commonly redirected to the more command. This technique\
    \ allows you to scroll through a directory listing that does not fit on a single\
    \ screen.\n\n# To redirect the output of the ls command to the more command:\n\
    \n+   1. Type ls -l /etc and press Enter. The output of the command scrolls quickly\
    \ by.\n2. Type ls -l /etc | more.\n    Notice the output fills the screen and\
    \ pauses with the prompt “—More—” displayed on the bottom line. Each time you\
    \ press the spacebar, the output advances to the next screen. Press the spacebar\
    \ until the command has finished.\n\nThe pipe operator can connect several commands\
    \ on the same command line, in the following manner:\n\n```\nfirst_command | second_command\
    \ | third_command ...\n```\n\n# To connect several commands with the pipe operator:\n\
    \n■ Type ls /etc | sort -r | more and press Enter. This command redirects the\
    \ directory listing of the /etc directory to the sort -r command. sort -r sorts\
    \ the directory listing in reverse order. The sort command’s output is redirected\
    \ to the more command.\n    You see the directory listing of /etc in reverse order,\
    \ one screen at a time."
  merge: -1
  img_proc: true
- pgno: 158
  md: "# # Using the grep Command\n\nUse the grep command to search for a specified\
    \ pattern in a file, such as a particular word or phrase. UNIX finds and then\
    \ displays the line containing the pattern you specified. As you recall from Chapter\
    \ 1, you can use the head command to retrieve the first 10 lines of a file. You\
    \ can combine the grep and head commands to retrieve only the first 10 lines containing\
    \ the word or phrase. For example, use grep with head to find the first 10 lines\
    \ in /etc/termcap that contain the characters “IBM.”\n\n+   1.  **To display lines\
    \ in a file containing a particular word or phrase:**\n    1.  To see all the\
