- pgno: 231
  md: "# Creating the Phoneadd Shell Program\n\nThe Phmenu program offers the option\
    \ to add a phone record to the corp_phones file; that is, the user interacts with\
    \ the program to enter a new employee's phone record. To do this, you can use\
    \ a cursor program, similar to the one you wrote earlier, to design your data\
    \ entry screen, display it, and place the cursor in the first data-entry field.\
    \ You can subsequently position it for all the other entries.\n\n# To create the\
    \ phoneadd program to allow additions:\n\n1  Use the editor of your choice to\
    \ create the script phoneadd. Enter this code:\n\n```\n# ==========================================================\n\
    # Script Name: phoneadd\n# By: JQD\n# Date: March 1999\n# Purpose: A shell script\
    \ that sets up a loop to add new employees to the Corp_phones file.\n# Command\
    \ Syntax: phoneadd\n#\n# ==========================================================\n\
    trap \"rm ~/tmp/* 2> /dev/null; exit\" 0 1 2 3\nphonefile=~/source/corp_phones\n\
    looptest=y\nwhile [ $looptest = y ]\ndo\n    clear\n    cursor 1 4; echo \"Corporate\
    \ Phone List Additions\"\n    cursor 2 4; echo \"=============================\"\
    \n    cursor 5 4; echo \"Last Name : \"\n    cursor 6 4; echo \"First Name : \"\
    \n    cursor 7 4; echo \"Middle Init : \"\n    cursor 8 4; echo \"Dept # : \"\n\
    \    cursor 9 4; echo \"Job Title : \"\n    cursor 10 4; echo \"Date Hired : \"\
    \n    cursor 12 4; echo \"Add Another? (Y)es or (Q)uit \"\n    cursor 4 18; read\
    \ phonenum\n    if [ \"$phonenum\" = 'q' ]\n    then\n        { clear; exit }\n\
    \    fi\n    cursor 5 18; read lname\n    cursor 6 18; read fname\n    cursor\
    \ 7 18; read midget\n    cursor 8 18; read deptno\n    cursor 9 18; read jobtitle\n\
    \    cursor 10 18; read datehired\n    # Check to see if last name is not a blank\
    \ before you\n    # write to disk\n    if [ \"$lname\" > \"    \"]\n    then\n\
    \        echo \"$phonenum:$lname:$fname:$midget:$deptno:$jobtitle:$datehired\"\
    \ >> $phonefile\n```"
