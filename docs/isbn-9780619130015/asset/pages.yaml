- pgno: 445
  md: 'You have already used the large question mark icon, which opens the Help Browser.
    The toolbox icon opens the Control Center, a program for configuring the GNOME
    environment. The icon displaying an image of a computer screen executes a terminal
    emulation program, which allows you to use the command line within a window. The
    last icon in the figure displays the Netscape logo. It executes the Netscape Communicator
    Web browser and e-mail client.


    +   **To practice launching the terminal emulation program and Netscape Communicator:**


    **1** Click the **Terminal Emulator** icon, which displays an image of a computer
    screen. A terminal window appears with a command prompt.


    **2** You cannot use the window until it is active. Click anywhere in the window
    to make it active. You see the title bar change color.


    **3** Practice shell commands such as *ls-l*, *date*, and *who* in the window.
    Leave the window open. (Note that depending on your computer’s configuration,
    a terminal window may open automatically when you start the X Window System.)


    The next area on the panel is the GNOME Pager, shown in Figure 11-11.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_445_0.png)


    The GNOME Pager is an **applet**, a small application designed to run on the panel.
    As shown in Figure 11-11, the left section of the Pager is the Desktop View. The
    Desktop View is divided into four areas. These are virtual desktops that you may
    switch to at any time. Currently, you are using the first desktop area, which
    is represented by the upper-left quadrant of the Desktop View.


    +   **To practice using the Desktop View:**


    **1** Make sure the Terminal Emulation program is running on your current desktop.


    **2** Your current desktop is represented by the upper-left square of the Desktop
    View. Click each of the other quadrants of the Desktop View. Notice that each
    appears as a clear desktop, with no windows open.


    **3** Click the lower-right quadrant of the Desktop View.'
