  md: "# Case Logic\n\nThe **case logic** structure simplifies the selection of a\
    \ match when you have a list of choices. It allows your program to perform one\
    \ of many actions, depending upon the value of a variable. Note the use of two\
    \ semicolons ( ;; ) that terminate the action(s) taken after the case matches\
    \ to the test.\n\n+   **To demonstrate case logic:**\n1. Use the vi or Emacs editor\
    \ to create the manycolors shell script.\n2. Type these lines into the file:\n\
    \n   ```bash\n   echo -n \"Enter your favorite color: \"; read color\n   case\
    \ $color in\n    \"blue\")   echo \"As in My Blue Heaven.\";;\n    \"yellow\"\
    ) echo \"As in the Yellow Sunset.\";;\n    \"red\")    echo \"As in Red Rover,\
    \ Red Rover.\";;\n    \"orange\") echo \"Autumn has shades of Orange.\";;\n  \
    \  *         ) echo \"Sorry, I do not know that color.\";;\n   esac\n   ```\n\
    3. Save the file and exit the editor.\n4. Give the file execute permission, and\
    \ test it. You see output similar to that shown in Figure 6-8.\n\n![](img/6d8286a85e2d8ad63e16f1801102da59_216_0.png)\n\
    \nFigure 6-8: Output of manycolors script"
  merge: -1
  img_proc: true
- pgno: 217
  md: 'In the Manycolors script, the case structure examines the contents of the color
    variable and searches for a match among the values listed. When a match is found,
    the statement that immediately follows the case value is executed. For example,
    if the color variable contains red, the echo statement that appears after "red")
    is executed. If the contents of the colors variable does not match any of the
    values listed, the statement that appears after \*) is executed.


    As you can see, case logic is designed to pick one course of action from a list
    of many, depending upon the contents of a variable. This control structure is
    ideal for menus, where the user chooses one of several values.


    Note: The case structure is terminated by the word "esac," which is "case" spelled
    backwards.


    In this section, you learned about shell variables, operators, and wildcard characters.
    You also learned about the four logic structures. In the next section, you’ll
    use shell programming to create your application.


    # ## SUMMARY


    +   - A high-level language (such as C, C++, or COBOL) is a language that uses
    English-like expressions. A high-level language must be converted into a low-level
    (machine) language before the computer can execute it.


    +   - The shell interprets UNIX shell scripts. They do not need to be converted
    to machine language because UNIX converts and executes them in one step.


    +   - UNIX shell scripts, created with the vi or Emacs editor, contain instructions
    that do not need to be written from scratch, but rather can be selectively chosen
    from the operating system’s inventory of executable commands.


    +   - Linux shells are derived from the UNIX Bourne, Korn, and C shells. The three
    Linux shells are Bash, tesh, and zsh; Bash is the most used Linux shell.


    +   - UNIX keeps three types of variables: configuration, environment, and shell.
    Configuration variables contain set-up information for the operating system. Environment
    variables keep information about your login session. Shell variables are created
    in a shell script or at the command line. The export command is used to make a
    shell variable an environment variable.


    +   - The shell supports numerous operators, including many for performing arithmetic
    operations.


    +   - You can use wildcard characters in shell scripts, including the bracket
    ([]) characters. Brackets surround a set of values that can match an individual
    character in a name or string.


    +   - The logic structures supported by the shell are sequential, decision, looping,
    and case.'
  merge: -1
  img_proc: true
