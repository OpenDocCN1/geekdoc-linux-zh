    # ## **Using the diff Command**


    The *diff* command attempts to determine the minimal set of changes needed to
    convert *file1* to *file2*. The command’s output displays the line(s) that differ.
    The code **3d2** displayed above the line indicates that you need to delete the
    third line in *file1*, so *file1* matches *file2*. The **d** means delete, the
    **3** means the third line from *file1*, and the **2** means that *file1* and
    *file2* will be the same up to but not including line 2. The code **2a3** indicates
    you need to add a line to *file1*, so *file1* matches *file2*. The **a** means
    add a line or lines to *file1*. The **3** means line 3 is to be added from *file2*
    to *file1*. The **2** indicates that the line must be added following line 2.'
