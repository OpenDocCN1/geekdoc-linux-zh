- pgno: 65
  md: '> tip


    You must always use a space after a UNIX command before including arguments to
    that command.


    In the previous example, the dot dot tells the operating system to go to the parent
    directory, which is /home. The first / separator followed by the directory name
    tells the operating system to go forward to the tricia subdirectory. The second
    “/” separator followed by the directory name tells UNIX to go forward to the source
    subdirectory, the final destination. If no name precedes or follows the slash
    character, UNIX treats it as the root directory. Otherwise, / separates one directory
    from another.


    +   To use dot and dot dot to change your working directory:


    1 If you are not in your home directory, type cd and press **Enter**.

    2 Type cd . and press **Enter**. Since . references your current directory, the
    system did not change your working location.

    3 Type cd .. and press **Enter**. The system takes you to the parent directory,
    which is /home.

    4 Type cd / and press **Enter**. The system takes you to the root (/) directory.

    5 Type cd and press **Enter**. The system takes you to your home directory.


