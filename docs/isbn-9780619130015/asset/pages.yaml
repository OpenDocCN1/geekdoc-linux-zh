- pgno: 356
  md: "The numeric comparison of $a and $b is performed so frequently that Larry Wall,\
    \ Perl's creator, developed a special Perl operator for numeric sorts, `<= >`.\
    \ This sort operator, known as the **spaceship operator**, reduces coding requirements.\
    \ To illustrate the code savings, compare the next sort subroutine using the spaceship\
    \ operator with the previous one:\n\n```\n```\nsub numbers\n{\n    $a <=> $b;\n\
    }\n```\n```\n\nThis numbers subroutine produces the same result as the first example,\
    \ which uses an if-else statement. Perl allows an even more compact notation:\
    \ the **inline sort block**, which looks like this:\n\n```\n```\n@sortednumbers\
    \ = sort { $a <=> $b; } @numberlist;\n```\n```\n\nThis statement uses the block\
    \ { $a <=> $b; } as the sort routine. It eliminates the need for a separate subroutine.\
    \ Let's examine how a Perl program sorts numeric data.\n\n+   - To use Perl for\
    \ numeric sorting:\n    - Create the file numberlist, containing the data 130,\
    \ 100, 121, 101, 120, and 122.\n    - Use the editor of your choice to create\
    \ the perlsort.p3 program. Enter this code:\n\n```\n```\n#!/usr/bin/perl\n# program\
    \ name: perlsort.p3\n# purpose: Sorts numerically using a subroutine. Filename\n\
    #             is entered on the command line.\n# Syntax: perlsort.p3 filename\
    \ <Enter>\n#######################################################\n$x = 0;\n\
    while (<>)\n{\n    $somelist[$x] = $_;\n    $x++;\n}\n@sortedlist = sort numbers\
    \ @somelist;\nprint @sortedlist;\n\nsub numbers\n{\n    if ($a < $b)\n       \
    \ { -1; }\n    elsif ($a == $b)\n        { 0; }\n    else\n        { +1; }\n}\n\
    ```\n```"
  merge: -1
  img_proc: true
