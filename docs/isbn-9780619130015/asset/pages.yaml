    # Formatting Output


    Chapter 4 introduced the awk command, which simplifies preparation of formatted
    output. Awk is actually a full-featured programming language and requires a chapter
    unto itself. The limited presentation here explains only the use of the printf
    action within the awk command, which formats output. The printf function has the
    syntax:


    | Syntax | printf (format, expr1, expr2, expr3 ...) |

    | Dissection | ■ format is always required. It is an expression whose string value
    contains literal text and specifications of how to format expressions in the argument
    list. Each specification begins with a percentage character (%), which identifies
    the code that follows as a modifier (- to left justify; width to set size; .prec
    to set maximum string width or digits to the right of decimal point; s for an
    array of characters (string); d for a decimal integer; f for a floating-point
    decimal number). Enclosed in double quotes (" "), format is often referred to
    as a "mask" that overlays the data fields (exprs) going into it.

    | | ■ $expr1, $expr2, $expr3 are awk expressions that represent data fields. These
    expressions typically take the form $1, $2, $3, etc. In the programmer file, the
    expression $1 indicates the programmer number (the first field), $2 indicates
    the programmer’s last name (the second field), and $3 indicates the programmer’s
    first name (the third field). |


    You can use the awk command and printf function to print the programmer_number,
    programmer last name, and programmer first name, all left-justified.


    **To print three fields:**

    ■ After the $ command prompt, type awk -F: ''{printf "%d %-12.12s %-10.10s\n",$1,$2,$3
    }'' programmer and press Enter.


    Each % symbol in the format string corresponds with a $ field: The %d specifies
    how to display the $1 field, the %-12.12s specifies how to display the $2 field,
    and the %-10.10s specifies how to display the $3 field. Here is a breakdown of
    each specifier:


    +   ■ %d indicates that field $1 is to appear in decimal digits.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "+   ■ %-12.12s indicates that field $2 is to appear as a string. The minus\
    \ sign (-) specifies the string is to be left-justified. The 12.12 indicates the\
    \ string should appear in a field padded to 12 spaces, with a maximum size of\
    \ 12 spaces.\n■ %-10.10s indicates that field $3 is to appear as a string. The\
    \ minus sign (-) specifies the string is to be left-justified. The 10.10 indicates\
    \ the string should appear in a field padded to 10 spaces, with a maximum size\
    \ of 10 spaces.\n\nThe spaces that appear in the format string are printed exactly\
    \ where they appear in relation to the fields (one is printed after $1, and another\
    \ is printed after $2). The trailing \\n tells awk to skip a line after displaying\
    \ the three fields.\nAwk provides a shortcut to other UNIX file processing commands\
    \ when you need to extract and format data fields for output. For example, although\
    \ it takes a few lines of code, you can use the cut, paste, and cat commands to\
    \ extract and display the programmers' last names and salaries. Start by using\
