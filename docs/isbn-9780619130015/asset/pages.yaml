    # ## Configuring the Panel


    You may configure almost every aspect of the GNOME panel. In this section you
    will learn to adjust the position of icons on the panel, add new applets to the
    panel, and add your own icon that launches a program.


    +   **To adjust the position of icons on the panel:**

    1. Right-click an applet icon on the panel.

    2. On the shortcut menu, click **Move applet**. The mouse pointer becomes a four-way
    arrow.

    3. Drag the mouse pointer to the left or right. As you do, the icon moves along
    the panel.

    4. When you decide where you would like to move the icon, click the mouse. The
    icon stays in its current place.


    You can use several other applets in addition to those that appear on the panel
    by default. Management at Dominion Consulting has asked you to instruct the other
    staff how to add these applets to their panels:


    +   - The CPU Load applet displays an animated bar graph that indicates the usage
    of your machine''s CPU.

    - The Disk Usage applet displays a pie chart indicating the system''s used and
    free disk space.'
  merge: -1
  img_proc: true
