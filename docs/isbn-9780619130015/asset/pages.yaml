- pgno: 351
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_351_0.png)


    In the perlread.p2 program, the `open` function appears on line 5:


    ```

    open (FILEIN, "students") || warn "Could not open students file\n";

    ```


    Nearly all program functions are written to return a value that indicates whether
    the function was carried out successfully. The values returned are considered
    true or false. A **true value** is usually represented with a 1, and sometimes
    any value greater than zero. A **false value** is represented with a 0 (zero).
    The open function returns true if the file is opened successfully and false if
    it failed to open. Opening a file can fail because the file is not found or because
    the file''s permissions for reading and/or writing are not set. However, in Perl,
    a filehandle that has not been successfully opened can still be read, but you
    will get an immediate **EOF** (end-of-file signal), with no other noticeable effects.
    An EOF results in your program not letting you read from or write to the file,
    because the file is not available.


    The two vertical bar characters (`||`) are the logical OR operator. When an expression
    on the left of a logical OR operator returns false, the expression on the right
    of the operator executes. The `warn` operator, on the right of the OR operator,
    displays an error message indicating the file did not open. Although displaying
    error conditions is not absolutely necessary in your programs, you should display
    them when it is obvious that the errors will cause subsequent problems if the
    program continues to run. This additional coding is especially essential in open
    statements.


    After the file is open, access to the data is made through the diamond operator
    (<FILEIN>). When the while loop reaches the end of a file, it terminates. Except
    for the `open` and `close` statements and the use of the diamond operator, the
    perlread.p2 program is identical to perlread.p1.'
  merge: -1
  img_proc: true
