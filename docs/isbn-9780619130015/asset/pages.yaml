  md: 'You can use tags to set background and foreground colors and to manipulate
    text with such tags as `<FONT SIZE=n>(insert text here)`. You can change text
    sizes with the heading tags, where `<H1>` is the largest and `<H6>` is the smallest.
    (However, note that users’ browsers may also automatically change the actual text
    size.)


    Because standard HTML ignores multiple spaces, tabs, and carriage returns, you
    can enclose text within `<PRE><PRE>(preformatted text)` tag pairs. Otherwise,
    any consecutive spaces, tabs, carriage returns, or combinations produce a single
    space. You can also use the `<P>` tag, which creates two line breaks, or the `<BR>`
    tag, which creates one line break. Neither tag requires a closing tag.


    Browsers automatically wrap text so you don’t need to worry about page widths.
    To center text, however, use `<CENTER>(text here)</CENTER>`. To indent from both
    margins, use `<BLOCKQUOTE>(text here)</BLOCKQUOTE>`. To change color, use `<FONT
    COLOR="RGB">(text here)</FONT>`, where RGB is the RGB color code. An **RGB color
    code** is a set of three numbers that specify a color’s red, green, and blue components.
    For example, the code 512218 specifies a red component of 51, a green component
    of 22, and a blue component of 18. The higher the number, the more intense the
    color component.


