    `dd if=./duplicate.flppy of=/dev/fd0` and then pressing **Enter**. Make sure to
    use the dot (.) reference to the input file (if=./duplicate.flppy) to indicate
    that the input file is located in the current directory.


    You have learned some useful utilities for preparing floppy disks and copying
    information to them. Next you learn to monitor the hard disk usage of your system.


    # ## Checking Hard Disk Usage


    UNIX system users, as well as the system itself, create and enlarge files. Eventually,
    unless files are removed, even the largest disk runs out of free space. To maintain
    adequate free space, you should use these basic strategies:


    +   - Be vigilant against running dangerously low on free space by using the `df`
    command.

    - Watch for conspicuous consumption by using the `du` command.

    - Follow a routine schedule for “garbage” collection and removal by using the
    `rm` command.


    Now you use each of these techniques to check hard disk usage.'
