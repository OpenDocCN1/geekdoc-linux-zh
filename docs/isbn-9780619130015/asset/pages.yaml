- pgno: 233
  md: '# SUMMARY


    +   • You can use the tput command to create a simple cursor-placement program
    to enhance data entry functions.


    +   • You can customize the .bashrc file that resides in the user’s home directory
    to suit the needs of programmers and system administrators.


    +   • You can create aliases and enter them into .bashrc to simplify often-used
    commands, such as ls -l and rm -i.


    +   • Use the trap command inside a script file to remove temporary files after
    the script file has been run (exited).


    +   • The grep command serves a key role in the development of shell programs
    by letting you search and retrieve information from files.


    +   • The Awk program serves as an effective and easy-to-use tool for generating
    reports.


    # COMMAND SUMMARY


    ### Chapter 6 Commands


    | Command | Purpose |

    | :--- | :--- |

    | alias | Establishes an alias |

    | case…in…esac | A programming structure that allows one action from a set of
    possible actions to be performed, depending upon the value of a variable |

    | export | Makes a variable an environment variable |

    | for; do…done | Causes a variable to take on each value in a set of values. An
    action is performed for each value. |

    | if…then…else…fi | Causes one of two actions to be performed depending on a condition
    |

    | let | Stores arithmetic values in a variable |

    | printenv | Prints a list of environment variables |

    | set -o noclobber | Prevents files from being overwritten by the > operator |

    | tput cup | Moves the screen cursor to a specified row and column |

    | tput clear | Clears the screen |

    | tput cols | Prints the number of columns on the current terminal |

    | tput smso | Enables boldfaced output |'
