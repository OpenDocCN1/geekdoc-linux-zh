- pgno: 280
  md: 'Looking at the phoneadd program, you realize that it contains code that you
    may want to reuse for other programs. To do this, you use shell functions.


    # ## Using Shell Functions


    A **shell function** is a group of commands that is stored in memory and assigned
    a name. Shell scripts can use the function name to execute the commands. You can
    use shell functions to isolate reusable code sections, so that you do not have
    to duplicate algorithms throughout your program. For example, the phlist1 script
    can use several functions to sort the phone list in a variety of ways.


    A function name differs from a variable name, because a function name is followed
    by a set of parentheses, and the commands that comprise the function are enclosed
    in curly braces. For example, look at the code for a function:


    ```

    ```text

    datenow()

    {

    date

    }

    ```

    ```


    The name of the function is "datenow." It has only one command inside its braces:
    the **date** command. When the datenow function is executed, it calls the **date**
    command.


    Functions are usually stored in script files and loaded into memory when you log
    on. However, you can also enter them at the command line.


    To declare the simple datenow function:


    +   1.  At the command line, type **datenow()** and press **Enter**. Notice the
    prompt changes to the **>** symbol. This indicates the shell is waiting for you
    to type more information to complete the command you started.

    2.  At the **>** prompt, type **{** and press **Enter**.

    3.  At the **>** prompt, type **date** and press **Enter**.

    4.  At the **>** prompt type **}** and press **Enter**. The normal prompt returns.

    5.  You created the **datenow** function and stored it in the shell’s memory.
    Invoke it by typing **datenow** and pressing **Enter**. Your screen looks similar
    to Figure 7-31.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_281_0.png)


    Figure 7-31: Output of datenow function


    Arguments are passed to functions in the same manner as any other shell procedure.
    The function accesses the arguments using the positional variables $1 . . . $9.
    Simply type the arguments following the command name, placing a space between
    each argument. Now you redefine the datenow function so it accepts an argument.


    # To redefine the datenow function to accept an argument:


    +   1.  At the command line, type **datenow()** and press **Enter**. The commands
    you are about to type replace those currently stored in the datenow function.

    2.  At the > prompt, type { and press **Enter**.

    3.  At the > prompt, type **echo “$1”** and press **Enter**. When the function
    runs, this command displays the information passed to the function in the first
    argument.

    4.  At the > prompt, type **date** and press **Enter**.

    5.  At the > prompt type } and press **Enter**. The normal prompt returns.

    6.  Test the function by typing **datenow “Today is”** and pressing **Enter**.
    Your screen looks similar to Figure 7-32.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/6d8286a85e2d8ad63e16f1801102da59_282_0.png)


    Figure 7-32: Results of revised datenow function


    The exercises you just completed demonstrate how functions work in general. Typing
    functions at the command line is hardly productive, however, because they must
    be re-entered each time you log on. You will now learn how to use shell functions
    to reuse code and to make functions available each time you log in.


    # Reusing Code


    To improve your programming productivity, you should learn to reuse your code.
    This means that the functions and programs you develop should be shared with other
    programs and functions as much as possible, thereby helping to prevent duplications,
    save time, and reduce errors. A good illustration of this potential use of reusable
    functions can be demonstrated in the current phoneadd program. You can create
    several different sort functions and store them in memory. The phlist1 script
    can then call these functions to display the list of phone numbers, sorted in
    a variety of ways.


    You can place multiple functions inside a shell script such as .myfuncs and execute
    them from your .bash_profile login script or simply run .myfuncs from the command
    line. This loads all your functions into memory just as you load environment variables.'
  merge: -1
  img_proc: true
