  md: 'You can also use the -d option with the tr command to delete input characters
    found in *string1* from the output. This is helpful when you need to remove an
    erroneous character from the file.


    +   **To delete specified characters from the counters file:**

    ■ To delete the characters “full” from the output, type `tr -d "full" < counters`
    and press Enter.

