  img_proc: true
- pgno: 446
  md: '+   Click the **large question mark** icon on the panel to open the Help Browser.
    Notice a small square in the lower-right quadrant of the Desktop view, approximating
    the position of the Help Browser window.


    +   Click the upper-left quadrant of the Desktop view to return to your original
    desktop. You see the Terminal Emulation window.


    The second area of the Pager is the Applications View. It holds an icon for each
    application that is running in the current desktop area. As you have already learned,
    an application that is represented by an icon may be restored to the desktop by
    clicking its icon in the Applications View. Between the Desktop View and Application
    View areas are two small icons: one with an up arrow and one with a small question
    mark. The up-arrow icon displays a list of all running applications. The small
    question-mark icon opens the GNOME Pager Settings window, which allows you to
    customize the Pager.


    Near the right edge of the panel is the Clock applet shown in Figure 11-12.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_446_0.png)


    Figure 11-12: Clock applet


    By default, the clock displays the date and time. You can modify its properties,
    however, by right-clicking it.


    # To modify the Clock applet properties:


    +   Position the mouse pointer over the Clock applet''s display, and click the
    right mouse button. You see a small shortcut menu.


    +   Click **Properties**. You see the Clock Properties window, shown in Figure
    11-13.


    +   The **Time Format** buttons allow you to choose from a 12- or 24-hour display.
    The **Show date** check box toggles the date display on or off. The **Unix time**
    check box toggles the time display between hours and minutes, and the internal
    UNIX time format. Click the **24 hour** button, and the **Show date** button.


    +   Click **OK**. The date no longer appears, and the time appears in 24-hour
    format.'
  merge: -1
  img_proc: true
