    **To make a back-up copy of the bootable floppy disk:**


    +   1. Insert the bootable floppy disk in the computer’s floppy disk drive (commonly
    known as drive A).

    2. Copy the disk’s contents into your current directory on the hard drive by typing
    `dd if=/dev/fd0 > duplicate.flppy` and then pressing **Enter**.

    3. Remove the floppy from drive A.

    4. Insert a formatted floppy disk in drive A.

