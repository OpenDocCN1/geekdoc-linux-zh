- pgno: 69
  md: "See Appendix B, “The UNIX Command Syntax Guide to the Linux Shell and Utility\
    \ Programs,” for a brief description of the ls command.\n\n# ### Using Wildcards\n\
    \nA wildcard is a special character that can stand for any other character or,\
    \ in some cases, a group of characters. Wildcards are useful when you wish to\
    \ work with several files whose names are similar or with a file whose exact name\
    \ you cannot remember. UNIX supports several wildcard characters. In this section\
    \ you will learn about two: \\* and ?.\n\nThe \\* wildcard represents any group\
    \ of characters in a filename. For example, assume Becky has these nine files\
    \ in her home directory:\n\n```\nfriends  \ninstructions.txt  \nlist1  \nlist2\
    \  \nlist2b  \nmemo\\_to\\_fred  \nmemo\\_to\\_jill  \nminutes.txt  \nnotes\n\
    ```\n\nIf she enters ls \\*.txt and presses Enter, she sees the following output:\n\
    \n```\ninstructions.txt  minutes.txt\n```\n\nThe argument \\*.txt causes ls to\
    \ display the names of all files that end with .txt. If she enters ls memo\\*,\
    \ she sees the following output:\n\n```\nmemo\\_to\\_fred  memo\\_to\\_jill\n\
    ```\n\nIf she enters the command ls s and presses Enter, ls displays all filenames\
    \ that end with s. She sees the output:\n\n```\nfriends  notes\n```\n\nThe ? wildcard\
    \ only takes the place of a single character. For example, if Becky types ls list?\
    \ and presses Enter, ls displays all files whose names start with *list* followed\
    \ by a single character. She sees the output:\n\n```\nlist1  list2\n```\n\nShe\
    \ does not see the listing for the file list2b, because two characters follow\
    \ the word “list” in its name."
