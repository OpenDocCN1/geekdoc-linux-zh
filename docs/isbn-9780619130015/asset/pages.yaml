    # # Using a Shell Program to Implement the Application


    Your application for Dominion Consulting currently consists of many separate commands
    that must run in a certain order. As you recall from Chapter 4, you can create
    a script file to simplify the application. Store your commands in a script file,
    which in effect becomes a program. (When you develop an application, you should
    usually test and debug each command before you place it in your script file.)
    You can use the vi editor to create the script files.


    **Note: Chapter 6 covers the subject of shell programming in detail.**


    Shell programs should contain not only the commands to execute but also comments
    to identify and explain the program. Use the pound (#) character in script files
    to mark comments. This tells the shell that the words following # are a comment,
    not a UNIX command. The next steps show how to add comments to your shell programs.
    Start by using the vi editor to create the script file, pact. Notice that you
    begin by inserting comments to identify and explain the program.'
