  md: '```

    john tty2 Aug 12 08:15

    jerry tty3 Aug 12 08:21

    ```


    3 To display a line of column headings with the who command’s output, type who
    -H and press Enter. You see a list like the one below.


    ```

    USER LINE LOGIN-TIME FROM

    root tty1 Aug 12 07:56

    ellen tty1 Aug 12 08:15

    john tty2 Aug 12 08:15

    jerry tty3 Aug 12 08:21

    ```


    If any current users are logged on from a remote host, the FROM column shows the
    name of the host.


    4 Idle time is the amount of time that has elapsed with no activity in a user’s
    session. Type who -i and press Enter to see each user’s idle time. You see a list
    similar to the one below.


    ```

    root tty1 Aug 12 07:56 00:29

    ellen tty1 Aug 12 08:15 .

    john tty2 Aug 12 08:15 00:01

    jerry tty3 Aug 12 08:21 old

    ```


    The output shows that the person logged on as root has performed no activity in
    the last 29 minutes, and John’s session has been idle for one minute. The period
    on Ellen’s line indicates that her session has been active in the last minute.
    The word old on Jerry’s line indicates no activity in the past 24 hours.


    5 If you wish to use multiple options on the same command line, type them all
    after a single hyphen. For example, type who -iH and press Enter to see a list
    of users with idle times and column headings. You see a list similar to the one
    below.


    ```

    USER LINE LOGIN-TIME IDLE FROM

    root tty1 Aug 12 07:56 00:29

    ellen tty1 Aug 12 08:15 .

    john tty2 Aug 12 08:15 00:01

    jerry tty3 Aug 12 08:21 old

    ```


    6 Type who -q and press Enter to see a quick list of current users. You see a
    list similar to the one below, which shows only login names and the total number
    of users on the system.


    ```

    root ellen john jerry

    # users=4

    ```


    7 To determine which terminal you are using or what time you logged on, type who
    am I in the command line, and press Enter. You see a line similar to the one below.
