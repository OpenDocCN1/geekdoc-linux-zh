    \ If you use a PPP connection to dial into an ISP, make that connection. If you\
    \ use a full-time Internet connection at work or school, ignore this step.  \n\
    3. Start your Telnet program and connect to the UNIX system.  \n   Follow the\
    \ instructions in your Telnet program to connect to a remote host. Usually, you\
    \ must provide the host name to connect to a UNIX system. For example, you can\
    \ type the following command after the prompt in a Windows 95/98 MS-DOS window\
    \ to gain access to the system *Lunar.campus.edu*.\n   `telnet Lunar.campus.edu`\n\
    \n# Logging On to UNIX\n\nAfter you connect to a UNIX system, you must log on\
    \ by entering your user name and password. You see a prompt requesting the login\
    \ or user name and the password. For security reasons, the password does not appear\
    \ on the screen as you type it. You cannot log on without an authorized user account,\
    \ if your password fails, or if you wait too long before entering your name and\
    \ password. Contact your system administrator for help.\n\nAfter you log on, you\
    \ are ready to begin using the system."
