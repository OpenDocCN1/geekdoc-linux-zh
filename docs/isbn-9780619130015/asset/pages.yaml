    # Performing Boolean Tests with the test Command


    The test command''s Boolean operators let you combine multiple expressions with
    AND and OR relationships. You can also use a Boolean negation operator. Table
    7-4 describes Boolean operators.


    | Option | Meaning | Example |

    | :--- | :--- | :--- |

    | -a | Logical AND | test expression1 -a expression2 |

    | -o | Logical OR | test expression1 -o expression2 |

    | ! | Logical negation | test !expression |


    Table 7-4: Test command''s Boolean operators


    The -a operator combines two expressions and tests a logical AND relationship
    between them. The form of the test command with the -a option is:


    `test expression1 -a expression2`'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'If both expression1 and expression2 are true, the test command returns true
    (with a 0 exit status). However, if either expression1 or expression2 is false,
    the test command returns false (with an exit status of 1).


    The -o operator also combines two expressions. It tests a logical OR relationship.
    The form of the test command with the -o option is:


    ```

    test expression1 -o expression2

    ```


    If either expression1 or expression2 is true, the test command returns true (with-a
    0 exit status). However, if neither of the expressions is true, the test command
    returns false (with an exit status of 1).


    The ! operator negates the value of an expression. This means that if the expression
    normally causes test to return true, it returns false instead. Likewise, if the
    expression normally causes test to return false, it returns true instead. The
    form of the test command with the ! operator is:


    ```

    test !expression

    ```


    +   **To demonstrate the test command''s Boolean operators:**


