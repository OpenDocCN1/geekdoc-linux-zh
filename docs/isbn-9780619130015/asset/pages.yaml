  md: "# # EXERCISES\n\n+   1. Start the X Window system on your computer. Open the\
    \ GNOME Help Browser, and perform these window operations:\n a. Shade and unshade\
    \ the window\n b. Maximize the window\n c. Minimize the window\n d. Iconify the\
    \ window\n e. Restore the window from the Pager\n f. Close the window\n\n+   2.\
    \ Open the GNOME Help Browser while the upper-left quadrant of the Pager’s virtual\
    \ desktop view is active. Describe how the icon for the current desktop changes.\n\
    \n+   3. Activate the upper-right quadrant of the Pager’s desktop view, and open\
    \ a terminal window. Practice a shell command, such as ls.\n\n+   4. Activate\
    \ the lower-left quadrant of the Pager’s desktop view, and open another terminal.\
    \ Use the who command to see a list of current users. Note how many times you\
    \ are listed.\n\n+   5. Change the Clock applet so the time appears in 24-hour\
    \ format and the date does not appear.\n\n+   6. What is the difference between\
    \ closing a window and using the Annihilate command on the Window Options menu?\n\
    \n# # DISCOVERY EXERCISES\n\n+   1. Open a terminal window in the current desktop.\
    \ Next, open a Gnome Help Browser window in the same desktop. How does the icon\
    \ for the current desktop indicate that two windows are open?\n\n+   2. With the\
