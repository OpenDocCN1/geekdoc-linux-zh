- pgno: 244
  md: '! character and the path of the shell. For example, this line tells the system
    to use the Bash shell:

    # ! /bin/bash


    When the system reads this code line, it loads the Bash shell and uses it to interpret
    the statements in the script file. Since UNIX includes many shells, you should
    always begin your scripts with this statement.

    Next, you need to make sure that the necessary directories and files are in place
    before you execute programs that depend on them. To do this, use the test command.


    # # Using the test Command


    The test command makes preliminary checks of the UNIX internal environment and
    other useful comparisons (beyond those that the if command alone can perform).
    See Appendix B, “Syntax Guide to UNIX Commands,” for a description of options
    available for the test command. You can place the test command inside your shell
    script or execute it directly from the command line. In this section you learn
    to use the test command at the command line. In the next section you use it in
    a script file.


    The test command uses operators expressed as options to perform the evaluations.
    The command can be used to:


    +   - Perform relational tests with integers (such as equal, greater than, less
    than, etc.)

    - Test strings

    - Determine if a file exists and what type of file it is

    - Perform Boolean tests


    Each type of test operation is discussed in more detail in the following sections.


    # ## Relational Integer Tests with the test Command


    The test command can determine if one integer is equal to, greater than, less
    than, greater than or equal to, less than or equal to, or not equal to another
    integer. Table 7-1 describes the integer testing options of the test command.


    Table 7-1: Integer testing options of test command


    | Option | Meaning | Example Command |

    | --- | --- | --- |

    | -eq | equal to | test a --eq b |

    | -gt | greater than | test a --gt b |

    | -lt | less than | test a --lt b |

    | -ge | greater than or equal to | test a --ge b |

    | -le | less than or equal to | test a --le b |

    | -ne | not equal to | test a --ne b |'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'The test command returns a value known as an exit status. An **exit status**
    is a numeric value that the command returns to the operating system when it finishes.
    The value of the test command’s exit status indicates the results of the test
    performed. If the exit status is 0 (zero), the test result is true. An exit status
    of 1 indicates the test result is false.


    The exit status is normally detected in a script by the *if* statement or in a
    looping structure. You can view the last command’s exit status by typing the command:


    ```

    echo $?

    ```


    # To demonstrate the test command with integer expressions:


    +   1. Create the variable number with the value 20 by typing the command **number=20**
    and pressing **Enter**.

    2. Type **test $number -eq 20** and press **Enter**.

    3. Type **echo $?** and press **Enter**. Your screen looks similar to Figure 7-4.


    ![](img/6d8286a85e2d8ad63e16f1801102da59_245_0.png)'
  merge: -1
  img_proc: true
