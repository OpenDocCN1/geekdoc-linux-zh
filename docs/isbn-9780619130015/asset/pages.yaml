    # Translating Characters Using the tr Command


    The **tr** command copies data from the standard input to the standard output,
    substituting or deleting characters specified by options and patterns. The patterns
    are strings and the strings are sets of characters.


    | Syntax | `tr [options] string1 string2` |

    |---|---|

    | Dissection | - In its simplest form, **tr** translates each character in *string1*
    into the character in the corresponding position in *string2*. The strings may
    need to be “quoted” with either single or double quotes. |

    | | - Two options used most frequently are `-d` (delete character) and `-s` (substitute
    character). |


    A popular use of **tr** is converting lowercase characters to uppercase characters.
    You can translate the file *counters* from lowercase to uppercase characters by
    specifying `[a-z]` as the lowercase characters and `[A-Z]` as the uppercase characters.


    > To translate lowercase characters to uppercase characters in the file *counters*:

    - After the `$` command prompt, type `tr [a-z] [A-Z] < counters` and press **Enter**.

    You see these lines:

    `LINUX IS A FULL FEATURED UNIX CLONE.`

    `LINUX BLENDS THE BEST OF BSD AND SYS V.`'
