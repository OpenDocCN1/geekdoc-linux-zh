    +   7.  Press **q** to exit the top utility.


    Table 8-8 summarizes several of the top command’s options.


    | Option | Description |

    | :--- | :--- |

    | -q | Causes the top command to display its output continually, with no delay
    between outputs |

    | -s | Causes top command to run in secure mode, disabling its interactive commands,
