- pgno: 203
  md: 'Use the **equal sign (=)** operator to set a value in a variable, as follows:

    NAME=Becky


    This example sets the NAME variable to the value Becky. The variable names or
    values that appear to the left and right of an operator are its **operands**.
    The name of the variable you are setting must appear to the left of the = operator.
    The value of the variable you are setting must appear to the right.

    Note: Notice there are no spaces between the = operator and its operands.


    To create a variable and assign it a value:


    ■ Type **DOG=Poolde** and press **Enter**.

    You created the variable DOG and set its value to Poolde.


    The echo command is used to display the contents of a variable.


    To see the contents of a variable:


    1 Type **echo DOG** and press **Enter**.

    You see the word “DOG.”


    2 To see the contents of the DOG variable, you must precede the name of the variable
    with a $ operator. Type **echo $DOG** and press **Enter**.

    You see the word “Poolde.”


    Enclose the value in double quotes (“ ”) if it contains spaces. The next command
    is an example.


    To set a variable to a string of characters containing spaces:


    1 Type **MEMO="Meeting will be at noon today"** and press **Enter**.


    2 Type **echo $MEMO** and press **Enter**.

    You see the contents of the MEMO variable: Meeting will be at noon today.


    You may also use single quotes. However, they suppress the evaluation of a variable
    like $HOME, whereas double quotes do not.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'To demonstrate the `"` and `` ` `` characters used with a variable name:


    1. Type `echo ''$HOME''` and press **Enter**. You see `$HOME` on the screen.

    2. Type `echo "$HOME"` and press **Enter**. You see the path of your home directory
    on the screen.


    Finally, the `backquote (\`) operator` is used to enclose UNIX commands whose
    output will become the contents of a variable.


    To demonstrate the backquote operator:


    1. Type `TODAY=`date`` and press **Enter**. This command creates the variable
    TODAY, executes the date command, and stores the output of the date command in
    the variable TODAY. (No output appears on the screen.)

    2. Type `echo $TODAY` and press **Enter**. You see the output of the date command
    that was executed in Step 1.


    # Exporting Shell Variables to the Environment


    Shell scripts cannot automatically access variables created on the command line
    or by other shell scripts. To make a variable available to a shell script, you
    must use the `export` command to make it an environment variable.


    To demonstrate the export command:


    1. Type `cat > testscript` and press **Enter**.

    2. Type `echo $MY_VAR` and press **Enter**.

    3. Type `Ctrl+D`. You have created a simple shell script named testscript. Its
    only function is to display the value of the MY_VAR variable.

    4. To make the script executable, type `chmod ugo+X testscript` and press **Enter**.

    5. After the $ prompt, type `MY_VAR=2` and press **Enter**.

    6. Type `echo $MY_VAR` and press **Enter** to confirm the operation above. You
    see "2" on the screen.

    7. Next look at the list of environment variables. Type `printenv | more` and
    press **Enter**. Look carefully as you scroll through the output of the printenv
    command. You do not see the MY_VAR variable.

    8. Execute the shell script by typing `./testscript` and pressing **Enter**. The
    script displays a blank line. This is because it does not have access to the shell
    variable MY_VAR.'
