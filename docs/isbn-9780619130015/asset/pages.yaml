  md: 'your source code in some way. For example, the #include directive causes the
    pre-processor to include another file in your program, at the point where the
    #include directive appears.


    The file **stdio.h** is called a **header file** and is part of your C development
    system. This file contains information the compiler needs to process standard
    input or output statements. Any program that performs standard input or output
    must include the stdio header file. Because the sample program uses the printf
    statement (which performs standard output), it must include stdio.h.


    The C development system includes a number of header files. All library functions
    require that you include a particular header file.


    # ### Specifying Data Types


    Variables and constants represent data used in a C program. You must declare variables
    and state the type of data that the variable will hold. A variable''s data type
    determines the upper and lower limits of its range of values. Data types with
    wider ranges of values occupy more memory than those with narrower ranges. The
    exact limits of the ranges vary among compilers and hardware platforms.


    Table 10-2 shows a list of the basic data types that may be used in a C program.


    | Data Type | Description |

    | :--- | :--- |

    | char | Occupies a single byte. Designed to hold one character from the character
    set used by the running machine. |

    | int | Holds integer values. The size of an int variable should be the default
    size of an integer on the running machine, but it is not always. |

    | float | A single-precision, floating-point value. |

    | double | A double-precision, floating-point value. |


    **Table 10-2:** C data types


    As mentioned earlier, the exact upper and lower limits of each of the range of
    values for data types depends on the compiler and hardware platform being used.
    You can use three modifiers with int data types: short, long, and unsigned. The
    short and long modifiers make an integer variable smaller or larger than its default
    size. Typically, a long int occupies twice as many bits as an int. On some machines
    a short int occupies half the number of bits as an int, but in many cases there
    is no difference between a short int and an int.'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'Table 10-3 shows typical limits and memory requirements of C data types.


    | Data Type | Bytes | Minimum Value | Maximum Value |

    |---|---|---|---|

    | char | 1 | -128 | 127 |

    | unsigned char | 1 | 0 | 255 |

    | short int | 2 | -32,768 | 32,767 |

    | unsigned short | 2 | 0 | 65,535 |

    | int | 4 | -2,147,483,648 | 2,147,483,647 |

    | long int | 4 | -2,147,483,648 | 2,147,483,647 |

    | unsigned long | 4 | 0 | 4,294,967,295 |

    | float | 4 | -3.4028E+38 | 3.4028E+38 |

    | double | 8 | -1.79769E308 | 1.79769E+308 |


    Table 10-3: Typical C data type limits and memory requirements


    # Character Constants


    Characters are represented internally in a single byte of the computer''s memory.
    When a character is stored in the byte, it is set to the character''s code in
    the host character set. For example, if the machine uses ASCII codes, the letter
    A is stored in memory as the number 65. This is because the ASCII code for A is
    65.


    When you represent character data in a program as a character constant, you enclose
    the character in single quote marks. Here are some examples:


    +   ‘A’

    ‘C’

    ‘a’

    ‘z’


    # Using Strings


    A string is a group of characters, like a name. Strings are stored in memory in
    consecutive memory locations. When you use string constants in your C program,
    they must be enclosed in double quote marks. Here are some examples:


    ```

    “Linux is a great operating system.”

    “Good Morning!”

    “Enter your name and age.”

    ```'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'Unlike higher level languages, C does not provide a specific data type for
    character strings. C requires that you view strings the same way the computer
    does, as an array of characters. Here is how you might declare a character array
    to store a string:


    ```

    char name[20];

    ```


    This is just like declaring a char variable, except for the [20] appended to the
    variable name. It indicates that name should be an array of 20 characters. It
    is large enough to hold a string of up to 19 characters. This is because in C
    all strings are terminated with a null character. A **null character** is a single
    byte where all bits are set to zero.


    # # Including Identifiers


    **Identifiers** are names given to variables and functions. When naming variables
    and functions, resist the temptation to use short names that do not convey the
    meaning of the item. Using meaningful identifiers greatly enhances the style of
    your program. There are only a few rules to remember:


    +   - The first character must be a letter or an underscore (the _ character).

    - After the first character you may use letters, underscores, or digits.

    - Variable names may be limited to 31 characters, and some compilers require the
    first 8 characters of variable names to be unique.

    - Uppercase and lowercase characters are distinct.


    These are all examples of legal identifiers:


    ```

    radius

    customer_name

    earnings_for_2000

    _my_name

    ```


    # # Declaring Variables


    You must declare all variables before you use them in a program. A declaration
    begins with a data type and is followed by one or more variable names. Here is
    an example:


    ```

    int days;

    ```


    This example declares a variable named days. Its data type is int, so days is
    large enough to hold any value that fits within the range of an int. Notice that
    the declaration ends with a semicolon, as do all complete C statements.


    You can declare multiple variables of the same type on the same line. Here is
    an example:


    ```

    int days, months, years;

    ```


    This example declares three variables, each of type int, named days, months, and
    years. Notice that commas separate the names.'
