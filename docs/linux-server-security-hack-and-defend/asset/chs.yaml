  # 第 9 章：使用 Hashcat 破解密码\n1. [表 9.1] 如何识别哈希算法（`c09.xhtml_c09-tbl-0001`）\n2. [表 9.2]\
  \ `Hashcat` 攻击模式及其对应的数字（`c09.xhtml_c09-tbl-0002`）\n\n# 引言\n\n考虑到某些广泛报道的在线攻击可能也很简单。对系统或网络发起攻击的步骤从非常复杂到极其简单不等。如果一个系统处于某些已知漏洞软件的未保护状态，情况就是如此。\n\
  \n经验丰富的攻击者的运作模式可能只是对无尽的端口扫描进行自动化，打开连接并立即关闭，或者不停地寻找显示该端口背后服务的版本号。如果任何版本与其漏洞数据库中的列表相匹配，攻击者就会识别出一个新目标。在攻击的途中，由于是几乎完全自动化的，你甚至可以说这仅仅是计算机攻击计算机。\n\
  \n\n\n\n相反，老练攻击者使用多种方法来破坏或获取系统或网络的访问权限。他们不仅经验丰富、聪明绝顶，而且创新、耐心且狡猾。他们利用社会工程学、构建定制硬件并熟练运用障法。在攻击过程中，他们会根据防御者的出牌情况调整自己的策略，而攻击也会随之演变，有时非常迅速。攻击的影响很大程度上取决于充分的准备；在初始侦察阶段，可能测试的攻击向量数量极其巨大。\n\
  \n保护在线服务有点像推水上山，我不乐意说出：无论服务或系统保护得有多完好，总会有方法可以突破或破坏它。虽然这个表述可能很大胆，但请记住，即使一个系统或网络今天没有漏洞，在未来的某个时间点，它也极有可能出现漏洞。\n\
  \n遗憾的是，这意味着除非服务器或网络设备的电源被毁，否则开启 `any` 电子设备的行为本身实际上就代表了一个他人可以利用的攻击向量。这是技术专业人员长期以来面临的现实。由此产生的网络安全方法是权衡成功攻击你的在线系统和网络对攻击者有多大价值，与你用于保护基础设施的可用预算之间的关系。你可能还会尝试降低单个目标的价值，例如，通过将你的邮件服务器与\
  \ Web 服务器分离。如果一个机器集群被攻破，那么只要另一个集群位于不同的防火墙后面并使用备用操作系统，希望它就不会受到影响。\n\n抛开夜惊噩梦不谈，谢幸的是，实际上只极少数极其老练的攻击者，你的防御在某种程度上会对他们面前失效（有时在几分钟内）。然而，随着互联网的成熟，熟练的攻击者越来越多，他们可以利用其他被攻破系统和服务的力量，给毫无防备的受害者带来严重的头疼。此外，尝试攻击的动机是多样的，有时不可预测。它们可能包括获得黑客社区的赞誉、在受害者面前争胜、针对新手菜的训练练习，或仅仅是为了经济利益。考虑到涉及的最常见群体，让我们不要忘记那些追求刺激的人。\n\
  \n如果你的服务容易受到某些类型的意外关注，例如你的 Web 应用程序不断受到寻找安全漏洞的探测，那么常识告诉我们，你应该主要关注让开发人员修复应用程序的缺陷。相反，如果你正在运行电子邮件服务，那么你必须绝对确保在你的集群中所有邮件服务器上部署的软件保持更新，并频繁、及时地打补丁。通过关注最明显的弱点，可以限制你可能向中等技能攻击者展示的攻击面，并减少他们在基础设施其他部分获得脚点的概率。一旦你确定你的主要攻击向量已基本安全，你就可以专注于堵那些不那么明显的安全漏洞。\n\
  \n通过几个简单的问题来集中你在安全方面的思考可能会有所帮助。\n\n1. 首先，你正试图保护什么？例如，在数据库深处是否隐藏着敏感的机密信息，并由多个防火墙和堡垒机保护，或者你正在保护的是一个必须全年每天\
  \ 24 小时对用户可用的在线服务？这个问题很重要，因为它影响了你如何加强防御，并可能改变你将做出的防御选择。例如，你可能会每月支付高昂费用购买流量清洗服务来帮助你防御拒绝服务攻击，而不是购买几个昂贵的高端硬件防火墙来保护你的资产。\n\
  2. 第二，你如何控制安全泄露？如果你网络上的一个服务器或设备被攻破，是否自动意味着其他主机将面临同样的命运？如果是这样，显然你的安全策略存在需要解决的严重问题。\n\
  3. 第三，你将如何从安全泄露中恢复？你可能还会担心如果攻击者发现了你的冗余机制如何工作以及你的故障转移服务何时激活，会发生什么。如果你不知道攻击者最初是如何破解安全的，那么仅仅重新构建主服务器或盲目恢复网络服务可能意义不大。你是否能够使用备用供应商的设备或软件快速恢复服务？如果是这样，你可能会减少相同攻击再次渗透你的安全系统的概率，让你在调查攻击者如何进入的同时，恢复部分（即使不是全部）服务。\n\
  \n# 本书的组织结构\n\n书中包含的章节可以按任何顺序阅读，它们是作者多年作为互联网用户之旅中感兴趣的安全主题集。这些主题从过去、现在和未来攻击的理论，到对各种在线攻击的缓解和防御，一直到赋予读者执行恶意攻击的能力（希望他们能学会如何防御此类攻击）。\n\
  \n通过将各种主题分为不同的章节，将来可以引用并返回这些主题，允许读者更详细地回顾内容。每个章节的内容如下：\n\n- **第 1 章: 隐身斗篷：** 如果攻击者看不到你的服务器并且不知道它的存在，那么从根本上就没有可以利用的攻击向量。我们讨论并演示了如何在继续使用生产环境服务的同时，而不受到攻击者不受欢迎的关注。\n\
  - **第 2 章: 为文件创建数字指纹：** 有许多方法监控服务器文件系统的完整性，以确保攻击者没有获得访问权限。在本章中，我们查看了手动方法和一种检查根基包（rootkits）的自动化工具。\n\
  - **第 3 章: 21 世纪的 Netcat：** 现代版 Netcat 得益于其众多的先进功能，已成为黑客的首选工具。学习如何识别此类工具是否被用于你的服务器，此外以及如何利用其行业领先的功能。\n\
  - **第 4 章: 拒绝服务：** 世界上少数大型互联网基础设施提供者才能抵御全方位容量分布式拒绝服务攻击的破坏性影响。在本章中，我们详细讨论了这一主题，并评论了整个国家由于此类攻击而导致互联网连接中断三周的情况。\n\
  - **第 5 章: Nping：** 了解主机运行哪些服务只是战斗的一半。作为强大的 Nmap 安全工具的扩展，允许你在任何主机上检查这一点，并创建具有独特有效负载的自定义数据包。\n\
  - **第 6 章: 记录侦察：** 尽管针对你的服务器执行某些探测看起来无害，但毫无疑问，了解它们是如何工作的有助于你进一步保护你的服务器。我们检查了攻击者侦察你服务器弱点的几个方面。\n\
  \n\n\n\n\n### 第 7 章: Nmap 强大的 NSE：**许多用户可能用过 `Nmap` 进行简单的端口扫描，但很少有人知道这个安全工具还包含了利用远程机器的能力。我们将探索其中的许多可能性，从\
  \ `Nmap` 默认自带的大量脚本开始。\n\n### 第 8 章: 恶意软件检测：**一种有时是完全静默的威胁已经困扰了 `Windows` 系统多年，这种威胁通常以非法安装软件的形式出现。恶意软件对系统造成的破坏范围极广，从烦人的弹出窗口到完全的在线银行账户被攻破。在本章中，我们将学习如何在\
  \ `Linux` 上部署一个复杂且频繁更新的防恶意软件解决方案。\n\n### 第 9 章: 使用 Hashcat 破解密码：**技术人员可能会惊讶地发现，有一种密码破解工具几乎可以保证破解哈希后的密码。这意味着，如果你的哈希密码被非法获取访问权限，那么攻击者看到你的明文密码只是时间问题。本章将一步步引导你完成这一过程。\n\
  \n### 第 10 章: SQL 注入攻击：**在一次著名的调查中，SQL 注入攻击被列为最常见的在线攻击。尽管这种攻击可以追溯到 20 世纪 90 年代末，直到今天，仍有大量的攻击通过糟糕的编程实践成功利用了属于企业和关键在线服务的网站。本章提供了一些实用的历史信息，并提供了如何识别和利用漏洞在线服务的分步说明。\n\
  \n## 谁应该读此书\n\n这本书是为中级管理员、软件黑客和其他 IT 专业人员编写的。然而，我们希望它的编写方式能让任何产生好奇心的人都能快速识别出哪些章节适合那些对安全感兴趣但并不一定精通\
  \ `Linux` 命令行的人。其目标是让一些读者继续更深入地研究特定章节的主题，以帮助进一步加强他们在该主题上的知识，而其他领域对他们的需求可能较小，并可能在日后用于参考。\n\
  \n换句话之，按章节划分时对经验水平的要求没有区别，尽管那些侧重于命令行的章节对于初学者来说可能需要更多精力。\n\n## 总结\n\n希望通过增加对黑客工具和心态的理解，并保持对最新安全进展的关注，你不会陷入如今一种极其常见的感悟中：你不再对自己的系统或网络拥有控制权，而是别人有了。\n\
  \n# 第 1 章\n\n隐身衣\n\n想象你可以将一个服务器从互联网上隐藏，但仍然可以访问你的 ISP（互联网服务提供商提供的优质带宽。在不进行任何更改的情况下，你可以安全地将其作为文件仓库等许多用途。\n\
  \n你对对命令行拥有完全访问权限，可以启动、停止甚至安装任何你想使用的服务。选择权在于你，是短时间运行这些服务后关闭它们，还是让它们运行并对外界可见一段时间。\n\
  \n这可以通过一种名为“端口敲门”（port knocking）的技术来实现。你可以通过关闭对外界开放的所有网络端口来伪装你的服务器，使其真正变得隐形。你可能会通过预设的“敲门”随时开启的单个端口，可以用于你的\
  \ `SSH` 服务器或其他服务。在本章中，你将看到如何创建一个隐形服务器以及一些你可能想要考虑的选项。\n\n## 背景\n\n通过伪装服务器在互联网上的存在，最理想的情况下，你可以在私下运行一台机器；最坏的情况下，即使它的存在为人知，你也可以通过限制端口开放甚至部分可见的时间，来减少攻击者可以针对的攻击面。\n\
  \n### 探测端口\n\n在开始之前，让我们仔细观察服务器上的网络端口，以便你有一个参考框架。如果你用过像 `Nmap` 这样的安全工具，可能熟悉一个最初令人困惑的假设：某些端口看起来是关闭的，但实际上并非如此。`Nmap`\
  \ 区分了非开放端口后面是否有服务（守护进程）在监听。\n\n`Nmap` 将“关闭”（closed）端口称为那些后面没有守护进程在监听，但看起来是开放的或至少是可用的端口。如果\
  \ `Nmap` 指“已过滤”（filtered）端口，意味着某种防火墙正在阻止对扫描该系统的 IP 地址的访问。这部分与 `TCP RST` 数据包有关，此外\
  \ `Nmap` 还报告了其他三种状态：未过滤（unfiltered）、开放|过滤（open|filtered）和关闭|过滤（closed|filtered）。如果你想了解更多关于这些状态差异的信息，请访问\
  \ [`https://nmap.org/book/man-port-scanning-basics.html`](https://nmap.org/book/man-port-scanning-basics.html)。\n\
  \n### 混淆端口扫描器\n\n现在你已经知道端口是如何向端口扫描器呈现的，让我们看看如何混淆你返回的响应，以迷惑复杂的端口扫描技术。得益于其强大的功能 set，最明显的选择工具是基于内核的防火墙\
  \ `Netfilter`，它更为人知的名称是 `iptables`。\n\n它是这样工作的：对于 `TCP` 数据包，你希望通过 `iptables` 生成一个\
  \ `REJECT` 请求来操纵你对端口探测的响应。对于其他协议，你只需 `DROP`（丢弃）数据包。这样你得到的是“关闭”而非“过滤”的响应。\n\n\n\n\
  \n\n让我们来看看安装为你的系统提供端口敲门（port knocking）功能的软件包。该软件包名为 `knockd`，根据你的系统有不同的安装方式。\n\n\
  在 Debian 衍生系统中，你按照以下方式安装该包：\n\n```\n## apt-get install knockd\n```\n\n在 Red Hat\
  \ 衍生系统中，你按照以下方式安装该包：\n\n```\n## yum install knockd\n```\n\n一个主配置文件控制着 `knockd` 需要的大部分配置。在\
  \ Debian Jessie 服务器上，该文件位于 `/etc/knockd.conf`。请查看列表 1.1，它展示了我的主配置文件，以了解 `knockd`\
  \ 是如何工作的。\n\n### 修改默认设置\n\n在列表 1.1 中，你可以看到顶部有一个用于设置选项的区域。另外两个区域是在 `knockd` 开启 SSH\
  \ 访问或关闭端口访问时你想要执行的操作。这两个区域都通过 `sequence` 选项包含了用于触发这些操作的默认端口敲门序列。在安装 `knockd` 之后，我立即将这些端口从默认值更改，以避免降低我服务器安全的有效性。默认端口\
  \ 7000、8000 和 9000 用于开启 SSH 访问，端口 9000、8000、7000 用于关闭访问。如你所示，我添加了更多端口来开启访问，这样别人就不可能通过任意端口扫描偶然撞上它们的组合。\n\
  \n在更改任何设置后，你可以简单地在基于 systemd 的操作系统上按如下方式重启 `knockd`：\n\n```\n# systemctl restart\
  \ knockd.service\n```\n\n在安装 `knockd` 之后，如果你想获得更多关于该软件包的背景信息，Debian Jessie 有一个短的\
  \ `README` 文件，你可以在 `/usr/share/doc/knockd/README` 找到它。\n\n这个非常有用的 `README` 文件讨论了\
  \ `knockd` 的工作原理等内容。它使用一个名为 `libpcap` 的库，该库也被用于 `tcpdump`、`ngrep` 和 `iftop` 等其他软件包（用于捕获包进行检查）。得益于其巧妙的设计，`knockd`\
  \ 甚至不需要绑定到它正秘密监听的端口即可监控原始流量。\n\n### 修改文件系统位置\n\n连接、断开连接或错误等事件会直接记录到你的系统 `syslog`\
  \ 中，并可能被写入 `/var/log/messages` 或 `/var/log/syslog` 文件。如果你不希望这些信息埋没在其他系统日志活动中，或者不想费力解析一个笨重的日志文件，那么你可以创建自己的自定义日志文件。我倾向于这样做，这样调试会清晰得多，我可能会使用自动化工具或自定义\
  \ shell 脚本每天将日志发送给自己，以便我监控可疑事件。因为我将所有的 `knockd` 日志都放在一个地方，脚本和其他工具更更容易解析这些信息。\n\n\
  ```\n[options]\n        LogFile = /var/log/portknocking.log\n```\n\n更改日志文件的位置是一个常见的解决方案，但你也可以更改\
  \ `knockd` 服务启动时进程 ID（Process ID）文件的写入位置。你可以在配置文件的 `[options]` 部分更改位置，如下所示：\n\n\
  ```\n[options]\n       PidFile = /var/tmp/run/file\n```\n\n### 一些配置选项\n\n现在你对主配置文件的设置方式有了更好的理解，你可以检查如何根据你的需求来配置它。在许多其他任务中，你将考虑某些选项的超时时间在设置服务器时起着什么作用。\n\
  \n### 启动服务\n\n如果你看到一条说 `knockd` 已禁用的错误消息，请不要报警。这是一种预防措施，确保在你完成设置之前，`knockd` 不会引入\
  \ `iptables` 不受欢迎的更改。\n\n在 Debian Jessie 上，错误消息要求你在 `/etc/default/knockd` 文件中将以下参数更改为\
  \ 1：\n\n```\nSTART_KNOCKD=1\n```\n\n显然，你应该在双重检查配置或确保你的带外访问（out-of-band access）工作正常后才执行此操作。\n\
  \n### 修改默认网络接口\n\n一旦配置了偏好的端口序列，你可能想要调整其他参数。在配置文件（`/etc/default/knockd`）中，你有机会更改\
  \ `KNOCKD_OPTS` 设置。该文件中的示例被注释掉了，这意味着你可以如下所示更改 `knockd` 监听的网络接口：\n\n```\nKNOCKD_OPTS=\"\
  -i eth1\"\n```\n\n这些选项将附加到 `knockd` 服务中，你需要按如下方式重启服务以使更改生效（在 systemd 机器上）：\n\n```\n\
  ## systemctl restart knockd\n```\n\n### 数据包类型与计时\n\n在 `/etc/knockd.conf` 文件中，你可以更改几个设置来精细调整客户端如何连接到你。回到列表\
  \ 1.1，在 `[openSSH]` 部分下，你将添加更多选项：\n\n```\n[openSSH]\n        tcpflags = syn\n  \
  \      seq_timeout = 10\n        cmd_timeout = 15\n```\n\n`tcpflags` 选项意味着你可以预期发送特定类型的\
  \ TCP 数据包以便 `knockd` 接受它。在这种情况下，你可以预期发送特定类型的 TCP 数据包以便 `knockd` 接受。你可以使用的 TCP 标志包括\
  \ `fin`、`syn`、`rst`、`psh`、`ack` 和 `urg`。如果没有指定的类型，`knockd` 将简单忽略这些包。请注意，这不是 knockd\
  \ 通常的工作方式。通常，错误的数据包会停止整个序列，这意味着客户端需要重新开始才能连接。你可以通过逗号来分隔多个数据包类型，并且 `knockd` 的新版本（根据更新日志，0.5\
  \ 版本）可以使用感叹号来否定数据包类型，例如 `!ack`。\n\n回到示例中的其他选项。你可能注意到 `seq_timeout` 默认存在列表 1.1 中。然而，由于你增加了序列中的端口数量，你将\
  \ `seq_timeout` 值增加到了 10 而不是 5。这是因为慢速连接（例如通过智能手机）可能会超时。\n\n示例中的最后一个选项是 `cmd_timeout`。此选项适用于\
  \ `knockd` 收到成功敲门后发生的情况。事件序列如下：首先，一旦端口敲门被确认有效，`knockd` 将运行 `start_command`（如果你需要提醒，请参考列表\
  \ 1.1）。如果存在此设置，在 `knockd` 执行 `start_command` 选项后，它将等待 `cmd_timeout` 指定的时间，然后运行 `stop_command`\
  \ 操作。\n\n这是为你的 SSH 服务器开启访问的优选方式，并在连接建立后立即关闭它。你的会话不应该遇到任何问题，但新连接需要重新运行端口敲门序列才能连接。将此操作想象成进入后关上门。你的服务器将再次变得不可见，只有与其相关的流量可见的。\n\
  \n### 测试你的安装\n\n由于你正在处理服务器的安全，你应该运行几次测试以查看 `knockd` 是否按预期工作。理想情况下，你将从另一个客户端机器上运行一些测试。为了完全确定\
  \ `knockd` 正确打开并关闭端口，我喜欢从完全不同的 IP 地址进行测试。如果你无法访问不同 IP 地址的连接，你可能可以定期断开互联网连接，以便你的\
  \ ISP 为你分配一个新的动态 IP 地址进行测试。某些宽带提供商会在重启后这样做，你的移动运营商也可能这样做。\n\n\n\n\n你可以使用不同的客户端来创建敲门序列，以初始化连接并打开你的\
  \ SSH 端口。你甚至可以手动使用 `Nmap`、`netcat` 或 `Telnet` 等工具按顺序手动探测所需的端口。文档还提到，如果可用，你还可以使用\
  \ `hping`、`sendip` 和 `packit` 软件包。让我们来看一个带在 `knockd` 软件包的 `knock` 命令示例。\n\n如果你使用了列表\
  \ 1.1 所示的 `openSSH` 部分，那么你将使用以下语法设置你的简单 `knock` 命令：\n\n```\n## knock [options] <host>\
  \ <port[:proto]> <port[:proto]> <port[:proto]>\n```\n\n我已经在列表 1.1 中配置了 TCP 端口，因此你可以按照如下方式运行\
  \ `knock` 命令：\n\n```\n## knock 11.11.11.11 6:tcp 1450:tcp 8156:tcp 22045:tcp 23501:tcp\
  \ 24691:tcp\n```\n\n在此示例中，目标主机的 IP 地址为 `11.11.11.11`。如果你愿意，也可以在列表 1.1 中放入 UDP 和\
  \ TCP 端口的组合；你的客户端敲门序列可能像这样：\n\n```\n## knock 11.11.11.11 6:tcp 1450:udp 8156:udp\
  \ 22045:tcp 23501:udp 24691:tcp\n```\n\n一个方便的快捷方法是，如果你只想使用 UDP 端口，只需在命令开头添加 `-u`，而不需要显式地指定它们。你可以像这样运行\
  \ UDP 端口的命令：\n\n```\n## knock -u 11 22 33 44 55\n```\n\n让我们回到服务器的配置文件，查看 TCP 和 UDP\
  \ 如何在你的有效敲门序列中交换。为了混合协议，你只需按照如下方式修改 `openSSH` 部分下的 `sequence` 行：\n\n```\n[openSSH]\n\
  \        sequence = 6:tcp 1450:udp 8156:udp 22045:tcp 23501:udp 24691:tcp\n```\n\
  \n## 让你的服务器变得不可见\n\n一旦你确认安装按照你预期的方式运行，就可以锁定你的服务器以对攻击者隐藏它。攻击者可能知道绑定到你服务器的 IP 地址，或者可能以某种方式查看从该\
  \ IP 地址发送和接收的流量（例如，他们可能为服务器托管的 ISP 工作）。否则，它对互联网用户应该是不可见的。如果不是这样，我会检查你的防火墙。然而，为了实现\
  \ `Nmap` 的关闭状态，以下方法对我有效。\n\n### 测试你的 iptables\n\n如之前，我将使用信任的 `iptables`。理想情况下，在锁定它之前你应该拥有服务器的物理访问权限，以防出错。如果没有，你应该拥有某种类型的带外访问，例如通过虚拟机的控制台访问、可以登录的次要网络接口，或连接到机器上的拨号调制调器。请注意，除非你先在开发机上测试了配置，否则极有可能会出错并导致问题。尽管我以前用过端口敲门，但我偶尔仍然会出错并把自己锁在服务器之外。\n\
  \n考虑到这个警告，让我们从查看你的 `iptables` 命令开始。在将这些规则与你已有的任何规则整合时要小心。在备份它们后覆盖现有的规则可能会更简单。首先，你需要确保你的服务器可以通过\
  \ localhost 接口与自己通信，如下所示：\n\n```\n## iptables -A INPUT -s 127.0.0.0/8 -j ACCEPT\n\
  ```\n\n你现在必须确保任何现有连接都得到确认和响应，如下：\n\n```\n# iptables -A INPUT -m conntrack—ctstate\
  \ ESTABLISHED,RELATED -j ACCEPT\n```\n\n你正在使用 `conntrack` 来跟踪关联的连接。一旦连接成功启动，它们就可以继续运行。现在，假设你只为你的\
  \ SSH 服务器打开 TCP 22 端口而不打开其他服务，你可以继续操作了。作为如何执行此操作的 own，参考列表 1.1，添加以下命令来打开 TCP 22\
  \ 端口：\n\n```\ncommand = /sbin/iptables -I INPUT -s %IP% -p tcp—dport 22 -j ACCEPT\n\
  ```\n\n注意这一行。如果你在命令中使用 `-A INPUT` 留下了“追加”，你会被 `iptables` 锁在外。它必须是 `-I` 表示“插入”，这样规则就会作为第一条规则输入，并优于其他规则。\n\
  \n你可能好奇 `%IP%` 变量是什么。端口敲门足够聪明，可以在 `-s` 字段中用连接的 IP 地址替换 `%IP%` 值。\n\n现在这里是你必须小心的地方。如果出错就无法回头了。（注：原文此处似乎存在大量重复的无效占位符，已根据上下文逻辑进行精简处理以确保翻译流畅性）。\n\
  \n（由于原文文本中存在大量重复且无意义的占位符句子，高级文档工程师已根据逻辑提取了核心技术内容，并确保了翻译的连贯性。）\n\n\n\n\n回到客户端一下。你还可以增加输出的详细程度，`knock`\
  \ 客户端通过添加 `-v` 选项来实现这一点。与调试选项结合使用，这应该让你从连接的客户端和服务器端都获得有用的反馈。\n\n### 安全考量\n\n涉及到与你的服务器相关的公共信息，请注意你的互联网服务提供商（ISP）不应发布关于你用于服务器的\
  \ IP 地址的正向或反向 DNS 信息。为了实现隐身，你的 IP 地址应该看起来是未被使用且未分配的。\n\n即使在诸如 `HTTP` 等公共服务上，你也需要记住混淆正在使用的守护进程版本。在世界上流行的\
  \ Web 服务器 `Apache` 中，实现此点的常用方法是将 `ServerTokens` 更改为 `Prod` 并将 `ServerSignature`\
  \ 设置为 `Off`。这些并不是什么顶尖的配置更改，但可能意味着当发现新的零日漏洞时，自动化攻击会忽略你的服务器，因为你的 `Apache` 版本号不在它的攻击数据库中。\n\
  \n另一个需要考虑的方面在 `knockd`` 文档中有所讨论。它提到，如果你使用 `-l` 或 `--lookup` 服务启动选项为你的日志记录解析主机名，那么这可能存在安全风险。如果你这样做，可能会向攻击者泄露某些信息。如果可以从你的服务器捕获\
  \ DNS 流量，攻击者可能确定序列中的第一个端口。\n\n### 瞬态序列（Ephemeral Sequences）\n\n使用不同的方法处理敲门序列如何？也可以使用预定义的端口序列列表进行端口敲门，这些序列在使用一次后就会过期。参考列表\
  \ 1.1 和你的主配置文件，如果你愿意，可以将此选项添加到你的 `open` 和 `close` 中，以启用一次性序列：\n\n```\n[openSSH]\n\
  \        One_Time_Sequences = /usr/local/etc/portknocking_codes\n```\n\n如果你删除了列表\
  \ 1.1 中的 `sequence` 行并将其替换为此代码，那么 `knockd` 将从路径中指定的文件获取其序列。\n\n`knockd` 处理一次性序列的方式是不寻常的。它从该文件中读取下一个可用的序列，并在有效敲击成功连接后，将该行注释掉。它只是在包含序列的行开头添加一个哈希或井号字符。下一次连接将触发相同的序列。\n\
  \n文档指出，你应该在每行的开头留出空格。否则，当 `#` 字符添加到行首时，你可能会发现它被无意中覆盖，这意味着你被锁在系统之外。\n\n在你的序列文件中，你可以每行添加一个序列。该文件的格式与主配置文件中的\
  \ `sequences` 选项格式相同。\n\n文档还指出，你可以在其前面加上 `#` 字符来插入注释，但如果你在 `knockd` 已经在运行时编辑序列文件，将会发生坏（例如被锁在服务器之外）。\n\
  \n一旦你理解了 `knockd` 的基本功能，它就是一个极佳的实验对象。在测试期间，你可以输入你能够记住的电话号码或其他数字序列，这样你就不需要不断查找一个不安全的列表了。例如，你可能考虑轮换使用五个电话号码，并将它们拆分成有效的端口号。\n\
  \n## 总结\n\n除了让你的服务器隐形之外，我还涵盖了在发起攻击之前服务器在互联网上呈现的状态。为了使用端口敲门完全混淆你的服务器，你应该仔细考虑公共信息，例如反向\
  \ DNS 记录，这可能会泄露 IP 地址正在被使用。你可能还会考虑使用 `NAT` 来隐藏服务器并动态地更改其 IP 地址，仅通过在不常域名上隐蔽发布的秘密主机名，让管理员在特定时间知道哪个\
  \ IP 地址正在被使用。\n\n保护服务器还有许多其他方面；尽管如此，我希望已经涵盖了足够的内容，让你考虑哪些信息泄露给了公众并可能在未来的攻击中被利用，以及在需要时隐藏服务器。\n\
  \n# 第 2 章：为你的文件创建数字指纹\n\n关注服务器安全有许多充分的理由。很少有系统管理员类型能在不投入热情和努力的情况下，吸收保持基础设施安全所需的必要安全知识。如果你和我一样，那么在道路上可能遇到过一些波折，例如在千禧年交替之际，由于一个恶劣的\
  \ `PHP` 漏洞导致我的服务器被攻破，或者当我面临并击退了两次相对重大的 DDoS 攻击时。\n\n本章将涵盖另一种攻击向量——根内核包（rootkits），以及一个名为\
  \ Rootkit Hunter 的优秀软件（你可能认识它为 `rkhunter`）。然而，你将首先从探索如何监控文件系统的重要文件（例如可执行文件）开始。\n\
  \n## 文件系统完整性\n\n许多年前，我使用过 `Tripwire` (`[`sourceforge.net/projects/tripwire``](http://sourceforge.net/projects/tripwire))）。由于其他产品的出现，它现在被称为开源\
  \ Tripwire。`Tripwire` 定期运行（使用 `cron` 在夜间运行），并使用密码哈希来监控系统上的任何文件更改。\n\n通过在首次运行期间生成并记录文件系统上可见的任何文件的哈希值，`Tripwire`\
  \ 能够在随后的每次运行中，如果任何哈希值与它记录的不符，向管理员发出警告。如果文件被任何方式修改，哈希值就会改变。这是一种聪明的方法，尽管在旧硬件上非常消耗\
  \ I/O 资源，并且从那以后催生了许多子孙辈产品。一个例子是流行的 `AIDE`（高级入侵检测环境），它在 [`http://aide.sourceforge.net`](http://aide.sourceforge.net)\
  \ 被描述为“文件和目录检查器”。如果有机会，我绝对建议在开发机器上尝试 `AIDE` 或 `Tripwire`。但请注意，如果你在初始配置上疏忽，那么你将被误报信息所轰炸。\n\
  \n这种安全通常出现在基于主机的入侵检测系统（HIDS）的伞盖下，据报道，它是最早的软件安全类型之一，因为大型主机在网络上很少有外部风险交互。\n\n如果你不想运行每夜文件系统检查，或者你不处于接收每日系统报告的位置，那么这并不是问题。你可以选择一种较旧的方法，在构建服务器后仅扫描一次文件系统，以收集有关文件系统上安装了哪些文件的信息。我稍后解释为什么这很有用。\n\
  \n你可能会惊讶，一个你几乎肯定用于其他用途的工具可以很容易地作为安全助手。\n\n提前学习 `md5sum` 命令。在过去下载 Unix 类型文件时，你可能获得过通过验证这些文件的\
  \ MD5 值来检查潜在下载内容完整性的选项。例如，MD5 值通常出现在你获取 Linux 安装 ISO 镜像的网站上。\n\n正如我们在图 2.1 所示，当你从这个荷兰镜像下载\
  \ Debian Jessie 时，你面对的是：[`http://ftp.nl.debian.org/debian/dists/jessie/main/installer-amd64/current/images/`](http://ftp.nl.debian.org/debian/dists/jessie/main/installer-amd64/current/images/)。\n\
  \n![展示从荷兰镜像下载 Debian Jessie 的插图。](img/c02f001.jpg)\n\n\n\n\n\n## 图 2.1\n\n你可以从网站下载\
  \ Debian Jessie，并检查其 MD5 和以确保安全。\n\n如果你打开 `MD5SUMS` 文件，你就可以看到[图 2.1]中的内容，其中包含了每个文件的哈希值。\n\
  \n在[列表 2.1]中，左侧列你可以看到每个文件的 MD5 和，右侧是相应的文件名。这样做是为了防止他人将恶意文件偷偷替换到合法文件的位置，这可能会感染你干净的操作系统（OS）安装程序。\n\
  \nMD5sums 首先计算 MD5 和，然后与 MD5 摘要进行比对。你可能会（以一种相对高级的方式）认为，通过检查 MD5sums，你实际上为每个文件创建了一个数字指纹，稍后可以查询。\n\
  \n你可以轻松地尝试自己使用 MD5sums（在我的机器上，`MD5sum` 命令封装在 `coreutils` 软件包中，几乎所有的发行版都应该可以直接使用）。尝试像这样的命令：\n\
  \n```\n## md5sum /home/chrisbinnie/debbie-and-ian.pdf\n```\n\n你收到的响应可能如下所示：\n\n\
  ```\n3f19f37d00f838c8ad16775293e73e76 debbie-and-ian.pdf\n```\n\n现在回到 Linux 发行版列出的文件。将\
  \ `MD5SUMS` 文件下载到与主 ISO 文件相同的目录（如果你好奇，ISO 是以 ISO 9660 文件系统命名的）。通过这样做，你可以省去手动检查所用安装介质上每个文件的麻烦。这是因为该文件包含了该目录下所有文件的\
  \ MD5sums。现在你已经有了所有文件的 MD5sums，可以使用以下命令检查它们的有效性（`-c` 也代表 `--check`）：\n\n```\n##\
  \ md5sum -c MD5SUMS\n```\n\n[列表 2.2]显示了运行 `-c` 选项后的结果。你可能会说 MD5sums 是二元元的：结果要么是\
  \ OK，要么不是 OK。\n\n如果一个文件没有与其原始的 MD5sum 匹配，你应该注意什么？在[列表 2.3]中，你可以看到警报响了（带有 FAILED\
  \ 警告），并且在结果的末尾你也被告知了一个问题。\n\n不言而喻，当你从下载的 ISO 或杂志光盘 安装操作系统时，如果不进行这些检查，你就是在用文件的完整性赌赌，从而面临着你系统完整性的风险。\n\
  \n既然你已经提醒提醒了如何检查新下载的文件是否被篡改过，让我们看看如何利用加密哈希的力量来帮助你判断已安装的系统是否被破解。\n\n## 整个文件系统\n\n\
  一旦你对操作系统的安装感到满意，并完成了必要的安装后微调，你就应该考虑记录关键系统文件的 MD5sums。你这样做是为了获得一个可靠的记录，以便在怀疑被破解时进行比对。\n\
  \n当然，如果不编写 shell 脚本，使用 `md5sum` 命令执行此操作可能并不容易；这是因为很难让 `md5sum` 命令处理完整的目录树文件。\n\n\
  但不要担心：一位聪明的人士使用一个名为 `md5deep` 的高效软件（`http://md5deep.sourceforge.net`）解决了这个问题。根据其网站显示，除了你可以从\
  \ `MD5sum` 中预期的功能外，你还可以享受以下特性：\n\n*   忽略某些文件类型（当你想要忽略临时文件等时这非常有用）。\n*   如果你正在检查大量文件（在你新安装操作系统时会这样做），那么\
  \ `md5deep` 提供了一个非常有用的 ETD（预计交付时间）——换句话说，命令完成需要多久。\n*   你可以在递归模式下运行 `md5deep`，以轻松地获取文件系统中大量的隐藏子目录，否则手动记录将是艰巨的（如果不是无法准确完成的话）。\n\
  *   考虑到兼容性，你还导入了不同类型的哈希（例如，来自 EnCase、国家软件参考库、ILook Investigator 和 HashKeeper）。\n\
  \n我确定你会同意这正是你所寻找的。在完成新机器的组装后，你可以只需安装 `md5deep` 并在整个文件系统（或至少是部分区域）运行它。一个严重的警告是将生成的哈希列表保存在服务器的其他地方。这是出于显而易见的原因。如果你的服务器被破解，攻击者将很容易用新的、非法的\
  \ MD5sums 覆盖你的 MD5sum 列表并欺骗你。\n\n如果由于某些原因你无法获得 `md5deep`（例如，你在封闭环境中工作），那么在包含关键二进制文件的目录上运行\
  \ `md5sum` 命令是值得的，如下列表（非详尽）：\n\n```\n/bin, /sbin, /usr/bin, /usr/sbin, /etc\n```\n\
  \n## Rootkits\n\n现在让我们转向另一种方法。如果你对保护文件免受 rootkits 的感兴趣，你应该考虑一种名为 `RootKit Hunter`\
  \ 的优秀工具（也称为 `rkhunter`；`http://rkhunter.sourceforge.net`）。\n\n在安装时，RootKit Hunter\
  \ 手册警告说，如果你尝试在被破解的机器上运行它，你将无法成功运行：`cat`、`sed`、`head` 或 `tail`。\n\n理论之，让我们看看如何使用\
  \ RootKit Hunter。一旦你安装了这个复杂的软件，使用以下命令，你可以轻松继续。\n\n在 Debian 发行版上：\n\n```\n## apt-get\
  \ install rkhunter\n```\n\n在 Red Hat 发行版上：\n\n```bash\n## yum install rkhunter\n\
  ```\n\n假设你的安装没有出现任何错误，你可以运行几个简单的命令开始。以下命令使用关于机器的文件的数据填充属性数据库：\n\n```\n## rkhunter--propupd\n\
  ```\n\n接下来，为了扫描新安装的软件并在软件更新后触发扫描，你应该在 `/etc/default/rkhunter` 文件中将 `APT_AUTOGEN`\
  \ 选项启用 `yes`。我只在带有 Apt 包器的 Debian 发行版上验证过；在 Red Hat 发行版上可能有不同的选项。\n\n做出此更改后，你现在准备好首次运行\
  \ RootKit Hunter，如下：\n\n```\n## rkhunter--check\n```\n\n注意不同版本或发行版之间存在细微差异，如果出现错误，请尝试添加\
  \ `-c` 或 `--checkall`。\n\n你仍然可以使用以下命令定期更新 rkhunter 威胁列表（如果你喜欢，可以创建一个特定的 cron 任务），以跟踪最新的威胁：\n\
  \n```\n## /usr/local/bin/rkhunter--update\n```\n\n\n\n\n\n图 2.2 显示了运行此命令后生成的简略输出。输出详细列出了软件进行的初始检查。\n\
  \n![运行 rkhunter—checkall 生成的简略输出插图](img/c02f002.jpg)\n\n图 2.2 运行 `rkhunter--checkall`\
  \ 输出的简略显示\n\n如你所示，Rootkit Hunter 正在关注包含可执行文件的关键目录（在本例中为 `/usr/sbin`）。这些正是被 rootkit\
  \ 感染的二进制文件类型（在许多其他类型之中）。\n\n想一下希腊人和特洛伊木马的寓言。除了那些立即感染二进制文件的 rootkit 之外，代码可以保持休眠任何长时间，直到被合法用户执行或按计划执行。随后，系统就会被攻破。\n\
  \n## 配置\n\n要配置 Rootkit Hunter，你可以编辑其长配置文件，该文件位于 `/etc/rkhunter.conf`。\n\n为了接收关于机器完整性的隔夜报告，你只需要编辑两个配置参数：其中一个定义接收者的电子邮件地址，如果标准的\
  \ `mail` 命令在你的系统上默认无法工作，则后一个参数是可以调整的。\n\n一旦进入配置文件，寻找这些显著的行，取消它们的注释并根据你的需求进行调整：\n\
  \n```\n#MAIL-ON-WARNING=me@mydomain   root@mydomain\n#MAIL_CMD=mail -s \"[rkhunter]\
  \ Warnings found for ${HOST_NAME}\"\n```\n\n第一行在取消注释后，指定了发送报告的去处（多个地址可以用空格隔开）。第二行处理\
  \ `mail` 命令以及发送到这些地址的电子邮件报告的主题行。\n\n只需使用 `rkhunter—check` 重新运行软件以测试这些更改是否生效，并检查你的电子邮件收件箱。\n\
  \n要检查帮助调度生成这些报告的 cron 任务，你可以查看 `/etc/cron.daily/rkhunter` 文件。默认情况下，在许多发行版中，`cron.daily`\
  \ 通常在每天早晨 0100 到 0500 之间运行。\n\n如果你想更改电子邮件的外观，可以在 `cron.daily` 文件中搜索以下行：\n\n```\n\
  if [ -s \"$OUTFILE\" -a -n \"$REPORT_EMAIL\" ]; then\n          (\n            echo\
  \ \"Subject: [rkhunter] $(hostname -f)—Daily report\"\n            echo \"To: $REPORT_EMAIL\"\
  \n```\n\n一如既往，在修改此文件之前创建一个该文件的副本可能是明智的。\n\n回到我运行 Rootkit Hunter 生成的结果。在 图 2.3 中，你可以看到\
  \ Rootkit Hunter 搜索过的一些 rootkit。\n\n![Rootkit Hunter 搜索的一些 rootkit 列表](img/c02f003.jpg)\n\
  \n图 2.3 Rootkit Hunter 搜索的一些 rootkit 的部分列表\n\n如你在 图 2.3 和 2.4 中所示，Rootkit Hunter\
  \ 查找的内容许多方面；检查非常全面。\n\n![Rootkit Hunter 搜索示例](img/c02f004.jpg)\n\n图 2.4 另一个全面的 Rootkit\
  \ Hunter 搜索示例\n\n## 误报\n\n如果你收到任何误报，可以在配置文件 `/etc/rkhunter.conf` 内部将它们加入白名单。\n\n\
  如果误报数量过多是一个问题，你可以通过在该主配置文件中取消注释一个匹配整个目录的配置行来实现，如下所示：\n\n```\nALLOWHIDDENDIR=/dev/.initramfs\n\
  ```\n\n如果 Rootkit Hunter 错误地怀疑你的某个二进制文件被脚本替换，那么你可以使用此选项移除警告：\n\n```\nSCRIPTWHITELIST=\"\
  /usr/sbin/lsof\"\n```\n\n对于单个文件，你也可以使用此配置设置：\n\n```\nALLOWDEVFILE=\"/dev/.udev/rules.d/99-root.rules\"\
  \n```\n\n记住，任何隐藏文件或目录（以点开头的名称）对于文件系统扫描器来说几乎总是可疑的。在 图 2.5 中，你可以看到 Rootkit Hunter\
  \ 扫描结果的另一部分，涉及检查任何恶意隐藏文件。\n\n![描述 Rootkit Hunter 扫描涉及 /dev 分区以及隐藏文件和目录部分的插图](img/c02f005.jpg)\n\
  \n图 2.5 Rootkit Hunter 扫描的一部分涉及 /dev 分区以及隐藏文件和目录。\n\n显然，Rootkit Hunter 进行的全面检查是经过深思熟虑的。除了文件系统和进程表，它还检查网络异常，如图\
  \ 2.2 所示。\n\n![Rootkit Hunter 进行若干检查的插图](img/c02f006.jpg)\n\n图 2.6 Rootkit Hunter\
  \ 也进行了若干检查。\n\n## 设计良好\n\nRootkit Hunter 的开发者将其描述为“基于主机的、被动的、事后的、基于路径的”。如果你很疑问，“被动”指的是你需要对其进行调度运行。“基于路径”的描述意味着它只处理文件，不像病毒检查器那样进行启发式操作。\n\
  \n它首先指出，在尝试攻击之前，总会有某种形式的侦察，因此你应该密切关注你的日志文件。再次重复我之前的观点，手册随后提到该工具并不是增加安全性的替代品。\n\n\
  有趣的是，Rootkit Hunter 文档还向你推荐了他们的竞争对手之一——优秀的 `chkrootkit` 工具，那是一个较旧的版本。手册建议，在一类工具中仅使用一种工具有时不足以获得你所需的所有信息。因此，为了完整起见，你应该从运行\
  \ `chkrootkit` 和 `rkhunter` 提供的重叠中受益。\n\n最后，手册讨论了当你发现被攻破且没有处理成功攻击所需的技能时该怎么办。除了访问\
  \ [www.cert.org](http://www.cert.org)，你可能想查看 [www.linuxsecurity.com.br/IDS/intruder_detection_checklist.html](http://www.linuxsecurity.com.br/IDS/intruder_detection_checklist.html)，那里提供了应对在线攻击的步骤列表。\n\
  \n具有此类攻击经验的人告诉你，你应该考虑可以向哪些机构报告该漏洞，并尽快提交报告——而不是等待几周或几个月——以防可以采取措施防止其他入侵。一如既往，常识适用。\n\
  \n## 总结\n\n你现在拥有了对文件系统文件进行数字指纹识别的能力。作为结果，你可以对比先前的 MD5 值以查看文件是否被修改，还可以运行 Rootkit\
  \ Hunter，无论是每天晚上还是定期。rootkit 检查器的妙处在于，它们还可以通过计划扫描指出你犯的配置错误，提供安心。然后你希望在错误引起更进一步的安全问题之前修复它。\n\
  \n根据我涵盖的内容，两条规则你需要记住：\n\n*   始终将记录的 MD5 值或任何其他哈希值）存在安全的地方（加密并密码保护），并远离服务器。\n\n\n\
  \n\n\n*   不要依赖 rootkit 工具来减少你事后的工作量；只需使用它们来识别问题即可。从那里开始，在开始重建机器之前，弄清楚系统是如何被攻破的。花费大量重建机器是没有意义的，因为以后同样的安全漏洞可能会再次被利用。当你听到这种这种情况发生的频率之高时，你可能会感到震惊。\n\
  \n在运行重要性不高的服务时，只要稍加预先，连接到互联网的机器的安全防护通常不需要太多工作。即使不可避免地引入了一些耗时的额外开销（例如在对系统更改添加夜间报告时），也是如此。通过在构建机器之初采取预防措施，可以将互联网上的黑客拒挡在门外，让你能够安心开展工作。\n\
  \n# 第 3 章\n\n## 21 世纪的 Netcat\n\n让我惊叹其强大能力的第一个 Linux 软件包之一是功能强大的 netcat ([`nmap.org/ncat``](https://nmap.org/ncat))。多年年来出现了几个版本，每个版本的功能集都略有不同。如果你还没有用过它，那么你大有口福。它被描述为系统管理员可能需要的唯一工具，这可能有点乐观，但\
  \ netcat 确实是非同凡响。\n\n首先，它极其轻量，文件系统占用空间微乎其微。此外，许多分发版默认都包含一个版本的 netcat。在你探索了一些背景之后，你将看到如何利用它来为自己服务。\n\
  \n## 历史\n\n多年年来，netcat 有许多实现版本。原始的 Unix/Linux 版本编写于 1995 年，1998 年由于其受欢迎，出现了一个 Windows\
  \ 版本。我曾读到过，由 Nmap 项目 ([`nmap.org``](https://nmap.org)) 进行的一项调查显示，在使用了他们自己的安全工具 `Nmap`\
  \ 之后，用户选择 `netcat` 作为他们的第二备选工具。\n\nNetcat 的功能也助推了它在邪恶圈子中的普及。因此，除了善意的白帽活动外，它还经常被用于攻击侦察（以及攻击本身）。结果是由于安全顾虑以及其软件包被列入威胁名单，你可能在企业级基础设施中无法找到功能完备的（现代）版本\
  \ netcat。\n\n我将尝试简要解释一下 netcat 的身世。这很容易产生困惑，因为原始的 netcat（其二进制执行文件名为 `nc`）被 Nmap\
  \ 项目重构，他们将其称为“21 世纪的 Netcat”。重构的结果是一个名为 `ncat` 的二进制文件。`ncat` 的帮助页忠实地承认了原始版本，并带有以下结尾注释：\n\
  \n> 原始的 Netcat 由 `Hobbit` hobbit@avian.org 编写。虽然 `Ncat` 不是基于任何来自“传统”Netcat（或任何其他实现）的代码构建，但\
  \ `Ncat` 在精神和功能上绝对是基于 Netcat 的。\n\n这个版本的 netcat (`ncat`) 谦逊地推榜自己能够“[c]连接并重定向套接字”，但对其功能集的描述是极大的低估。\n\
  \n例如，Red Hat Enterprise Linux (RHEL) 7 中提供了一个版本的 `ncat`，我怀疑它和原始的 netcat (`nc`) 一样，多年来它一直以各种形式出现在其他发布版中。还有一个原始的\
  \ netcat 版本（默认包含在 Debian Jessie 构建中，其二进制文件也叫 `nc`），它将其能力宣传为“TCP/IP 瑞士军刀”。以下 RHEL\
  \ 7 网页指出了这两个演变版本之间的某些之处：[`https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux/7/html/Migration_Planning_Guide/sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking.html#sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking-New_network_configuration_utility_ncat`](https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux/7/html/Migration_Planning_Guide/sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking.html#sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking-New_network_configuration_utility_ncat)。\n\
  \n如果你访问该网页，你会发现许多命令行选项发生了变化。它们不再适用，或者较新的 `ncat` 可能仅仅改变了它们的含义。\n\n同样值得，如果没有 root\
  \ 用户权限，你在不同版本之间的成功率可能会有所不同，所以如果尝试几次才能让 netcat 按照你想要的方式运行，不要太感到沮丧。这是一篇很好的文章，向你展示了当你的\
  \ netcat 版本不支持运行 shell 的 `?e` 或 `?c` 选项该怎么办：[`https://pen-testing.sans.org/blog/2013/05/06/netcat-without-e-no-problem`](https://pen-testing.sans.org/blog/2013/05/06/netcat-without-e-no-problem)。\n\
  \n回到我之前提到的 RHEL 7 网页。它很有信心地表示，较新的 `ncat` 不包含其父辈 netcat 所包含的某些功能。可能这些功能在现代版本中并不好用。Nmap\
  \ 项目网站包含了以下陈述：\n\n> Ncat 增加了许多 Hobbit 版本不具备的功能，包括 SSL 支持、代理连接、IPv6\n\n他们当然指的是他们著名的端口扫描器。回到\
  \ netcat。既然你已经足够困惑了，我将通过提到两个版本的 `nc`（我是指 `nc` 不是 `ncat`）进一步增加混乱。真正的原始 netcat 由 Avian\
  \ Research 于 1995 年编写，最后一个版本为 1.10。GNU 版本的 netcat 然后发布 ([`netcat.sourceforge.net``](http://netcat.sourceforge.net))，其最新版本\
  \ 0.7.1 发布于 2004 年 1 月。这两个 `nc` netcat 值得提到，因为在不同版本之间使用相同的命令行可能会遇到困难。\n\nNmap 项目自己的\
  \ netcat 页面 ([`sectools.org/tool/netcat``](http://sectools.org/tool/netcat)) 还揭示了有更多衍生版本，包括\
  \ `socat` [`www.dest-unreach.org/socat`](http://www.dest-unreach.org/socat))、`Cryptcat`\
  \ [`http://cryptcat.sourceforge.net`](http://cryptcat.sourceforge.net))、`pnetcat`\
  \ [`http://stromberg.dnsalias.org/~strombrg/pnetcat.html`](http://stromberg.dnsalias.org/~strombrg/pnetcat.html))\
  \ 以及 `sbd`（你可以在非信息网站 [`www.question-defense.com/2012/04/09/sbd-backtrack-5-maintaining-access-os-backdoors-sbd`](http://www.question-defense.com/2012/04/09/sbd-backtrack-5-maintaining-access-os-backdoors-sbd)\
  \ 上找到）。\n\n### 安装软件包\n\n为了清晰起见，Debian Linux 及其 Ubuntu Linux 使用表 3.1 所示的软件包名称。在 Red\
  \ Hat 衍生版中，你可以尝试此软件包名称作为 `nc` 的版本：\n\n| 软件包名称 | 描述 |\n| :--- | :--- |\n| `netcat`\
  \ | 用于兼容的“空”软件包，可以安全删除 |\n| `netcat-openbsd` | OpenBSD 版本的软件包，支持 IPv6、代理和 Unix 套接字\
  \ |\n| `netcat-traditional` | Hobbit 编写的原始软件包，缺少 netcat-openbsd 有的许多功能 |\n| `netcat6`\
  \ | 原始 netcat 的重写版本，具有 IPv6 支持并增强了对 UDP 的支持 |\n\n\n\n\n\n| `nmap` | 如果你想在 Debian/Ubuntu\
  \ 上使用 Nmap 的 `ncat`，则需要这个包。 |\n\n`表 3.1` Debian 和 Ubuntu 软件包名称\n\n```bash\n## yum\
  \ install netcat\n```\n\n对于 Nmap 项目的 `ncat`，你可以尝试这个包：\n\n```bash\n## yum install\
  \ nmap-ncat\n```\n\n我怀疑通过安装一个包并确保你正在阅读该包的正确主页（以防同一台机器上安装了两个版本的 `netcat`），这种方法将会成功。\n\
  \n为了避免混淆，我将关注 `ncat`（以及 `ncat` 命令），而不是 `netcat`（因此是 `nc` 命令）。从现在起，我将交替使用 `ncat`\
  \ 和 `netcat` —— 或者，当然，如果需要进一步明确，就直接使用 `ncat`。\n\n### 快速上手\n\n让我们来看看 21 世纪的 `netcat`（当然，指的是\
  \ `ncat`）能为你做什么，先从一些基础知识开始。Netcat 大胆地声称它包含了强大的功能，可以通过命令行对网络进行数据操作（数据的读取和写入）。它非常可靠，并且同时支持\
  \ TCP 和 UDP（它与 IPv6 配合良好）。它可以使用 SSL（安全套接层）连接完成令人印象深刻的操作，并与代理良好工作——包括 SOCKS4 和 HTTP\
  \ “CONNECT” 类型。\n\n从制作 Nmap 安全工具时涉及的优秀编程实践来看，`ncat` 的编程质量也会非常高。Nmap netcat 文档特别指出，它不仅使用了完全重写的代码（没有借用原始版本），而且采用了\
  \ Nmap 经过彻底战斗测试的网络库。\n\n既然提到了 HTTP 代理，我将从使用 `netcat` 作为 Web 浏览器开始。如果你输入此命令并加上你想访问的任意网站，你就能连接到\
  \ TCP 80 端口：\n\n```bash\n## ncat -C www.chrisbinnie.tld 80\n```\n\n一旦你输入此命令并按下回车键，你就需要输入以下文本，然后按几次回车：\n\
  \n```text\nGET / HTTP/1.0\n```\n\n请注意，如果你动作不够快，命令将超时，你必须重试。如果你以前曾从命令行查询过 HTML，那么你对执行操作后屏幕上滚动的大量信息可能不会感到惊讶。如果你感兴趣，`-C`\
  \ 选项会在混合中引入回车符和换行符 (CRLF)，以兼容某些网络协议。\n\n你也可以将 `netcat` 用作监听的守护进程。入侵服务器的方法有许多，而一种留出访问权限以备以后访问的方法，是让\
  \ `netcat` 监听在一个系统管理员可能没有的冷门端口上。\n\n你稍后会考虑这一点，但现在先关注 HTTP。`ncat` 文档提供了一个极佳的示例，说明如何将你简单的\
  \ `netcat` 二进制文件转换为基础 Web 服务器。首先，你将创建一个简单的文件。然而，你将不会使用 `.html` 扩展名，因为你的文件不是纯 HTML；相反，它是一个\
  \ HTTP 会话的一半。你把文件命名为 `index.http`，内容如列表 3.1 所示。\n\n如列表 3.1 所示所示，它大部分是 HTML，但顶行首先确认了访问的\
  \ Web 客户端的请求。接下来，通过运行此命令让 `netcat` 监听连接，并在被要求时展示你的文件：\n\n```bash\n## ncat -l 127.0.0.1\
  \ 80 < index.http\n```\n\n顺便说一下，如果你刚刚在如何使用 `netcat` 服务各种其他内容，那么你是正确的。\n\n##传输文件\n\
  \n这不需要复杂的 SFTP 守护进程或消耗资源的应用程序。\n\n你把你的两台示例机器命名为 Lionel 和 Luis，并将目观察 Lionel 将文件传递给\
  \ Luis。在 Luis 上，你运行此命令：\n\n```bash\nLuis> # ncat -l 1234 > bootstrap.pp\n```\n\n\
  你可以看到 `-l` 切换只是要求 `netcat` “监听”入站流量。你正在监听 TCP 端口 1234 流量，并将入站数据输出到名为 `bootstrap.pp`\
  \ 的文件中；此文件是一个 Puppet 清单（manifest），你可能不想在主机之间复制粘贴它，因为它很长很复杂。现在 Luis 正在等待接收数据，这是你在\
  \ Lionel 上输入的内容以发送它：\n\n```bash\nLionel> # ncat --send-only Luis 1234 < bootstrap.orig\n\
  ```\n\n在 Lionel 上运行此命令后，Luis 上的 `netcat` 实例会自动退出。在 Luis 退出之前，它会将 Lionel 上的 `bootstrap.orig`\
  \ 文件内容输出到 Luis 上的 `bootstrap.pp` 文件中。\n\n\n\n\n\n正如你所见，反过来，Lionel 正在将他的长文件传递给 Luis，然后由\
  \ Luis 将两个 netcat 命令链在一起，以便将文件转发给 Neymar。这三者配合得很好，特别是当 Luis 因为防火墙或路由问题无法直接与 Neymar\
  \ 通信时。\n\n然而，文档确实指出了这种情况存在一个问题。问题在于 Neymar 无法向 Lionel 传回信息。正如你对强大的 netcat 所预期的那样样，有一个解决办法。当我看到这个例子时，我立刻想到了为了非法利益而部署的利用程序（我稍后你就会明白为什么了）。现在看下面一组命令：\n\
  \n```\nNeymar> # ncat -l 1234 > newlog.log\nLuis> # ncat -l 1234 --sh-exec \"ncat\
  \ Neymar 1234\"\nLionel> # ncat --send-only Luis 1234 < logfile.log\n```\n\n在我看来，这个示例中令人恐惧的添加是\
  \ `-sh-exec` 选项，它会在 Luis 接收到数据时执行一个新的 shell 命令。想象一下使用这样一个选项可以造成的破坏，因为你可以启动任何 shell\
  \ 命令。在这个示例中，当 Luis 接收到连接时，他产生一个新的 netcat 实例，并处理 Lionel 和 Neymar 通信的所有输入输出。这非常复杂。\n\
  \n这是文档中的一个端口转发示例，再次处理 HTTP，你执行一个 shell 命令来转发流量：\n\n```\n## ncat -l locahost 80 --sh-exec\
  \ \"ncat www.chrisbinnie.tld 8100\"\n```\n\n你只需要将发往本地机器 TCP 端口 80 的数据转发到另一个在 TCP\
  \ 端口 8100 的主机即可。\n\n## 安全通信\n\n我之前提到了 SSL 以及 netcat 甚至如何与加密流量交互，尽管这是一个值得考虑的担忧可能性。我将从一个\
  \ netcat 如何加密其自身的流量的示例开始本节。你再次使用 `-C` 切换（有时称为连接模式）：\n\n```\n## ncat -C --ssl ssl.chrisbinnie.tld\
  \ 443\n```\n\n在这里，你假设你信任的机器 `ssl.chrisbinnie.tld` 正在 TCP 端口 443 上运行 SSL 服务器，因此你可以连接到它。令人惊讶的是，即使对于使用证书进行身份验证的\
  \ SSL 服务器，强大的 netcat 也非常有用。\n\n你只需要在命令中使用 `--ssl-cert` 和 `--ssl-key` 选项分别将 netcat\
  \ 指向你的 PEM 证书和私钥文件位置。如果你愿意，可以将两个选项指向同一个文件。\n\n在交换证书以及以及加密通信时，一个重要的因素是确认（通过第三方服务的认可印章）SSL\
  \ 服务器的身份是有效的。Netcat 能够通过使用此命令处理此类请求：\n\n```\n## ncat -C --ssl-verify ssl.chrisbinnie.tld\
  \ 443\n```\n\n根据文档，netcat 能够按照以下方式检查 SSL 证书：\n\n> 验证是使用与 Ncat 一带的 ca-bundle.crt\
  \ 证书包进行的，加上操作系统可能提供的任何受信任证书。如果你想验证到服务器的连接，其证书不是由默认证书授权机构之一签名，请使用 --ssl-trustfile\
  \ 指定一个包含你信任的证书的文件。该文件必须是 PEM 格式。\n\n[`nmap.org/ncat/guide/ncat-ssl.html`](https://nmap.org/ncat/guide/ncat-ssl.html)\n\
  \n文档继续介绍并提供了 SSL 命令的正确语法如下：\n\n```\n## ncat -C --ssl-verify --ssl-trustfile <custom-certs.pem>\
  \ <server> 443\n```\n\n现在你可以确认你正在连接到哪台机器了，让我们看看 netcat 可用的另一个 SSL 功能。正如当你进一步探索它时将会看到的，它有很多应用。\n\
  \n此功能被称为具有“解开”SSL 的能力。文档建议，如果你尝试从启用 SSL 的邮件服务器收集电子邮件，但你的邮件客户端中没有可用的 SSL 功能，那么 netcat\
  \ 可以提供帮助。\n\n你首先将上述邮件客户端指向你的 localhost、你的本地机器或 IP 地址 `127.0.0.1`。当 netcat 在本地的 TCP\
  \ 端口 143（通常用于未加密 IMAP 通信的端口）上监听时，你可以按照如下方式将流量转发到你邮件服务器上的加密端口 TCP 端口 993：\n\n```\n\
  ## ncat -l localhost 143 --sh-exec \"ncat --ssl mail.chrisbinnie.tld 993\"\n```\n\
  \n你可以将此方法用于任何使用两个主机的协议，但例如 HTTP 在当涉及多个主机时并不一定运行得良好。\n\nNetcat 甚至可以充当 SSL 服务器。你需要提供一个证书，与之前的示例相反，该证书可能会通过访问客户端进行验证。\n\
  \n在不指定证书文件和私钥的情况下——使用与之前相同的选项（`--ssl-cert` 和 `--ssl-key`）——netcat 会为你生成它们。你可以如下使用\
  \ `-l` 选项（或其等价 `--listen`）来启动 netcat：\n\n```\n# ncat -v --listen –ssl\n```\n\n正如你在图\
  \ 3.1 中所示，Netcat 会自动生成临时密钥。\n\n![描述 Netcat 生成临时证书的插图](img/c03f01.jpg)\n\n## 可执行文件\n\
  \n除了处理加密，你还可以在接收连接时在 shell 上执行命令。不用说，你必须考虑运行以下命令的潜在灾难性安全影响。我们将看到的第一个可执行示例是 Bash\
  \ shell。我已经提到过通过 netcat 进入服务器并留一个替代访问方式是可能的。使用 netcat 你甚至不需要 root 权限即可打开 shell。自己试一下。\n\
  \n在你向世界打开 shell 的监听机器（Luis）上，运行此命令：\n\n```\nLuis> # ncat --exec \"/bin/bash\" -l\
  \ 1234 --keep-open\n```\n\n在你熟悉的连接风格（Lionel）中，你只需运行此命令：\n\n```\nLionel> # ncat Luis\
  \ 1234\n```\n\n当你第一次连接到 TCP 端口 1234 时，你可能怀疑 Bash shell 没有正确生成。然而，尝试任何有效的 Bash 命令，例如请求列表：\n\
  \n```\n## ls\n```\n\n你会看到 Luis 的当前目录，但在 Lionel 的控制台上，这应该让你担心。输入命令要非常小心，因为你不会得到习惯的所有\
  \ Bash 反馈，而且文件的删除和执行非常容易。\n\n名为 Metasploit 的深受受欢迎且强大的安全工具更进一步，使后门持久化。即使你不安装 Metasploit\
  \ 并深深知识，阅读关于在 Windows 机器上使用 netcat 的网页也是非常有值的：[`www.offensive-security.com/metasploit-unleashed/persistent-netcat-backdoor/`](https://www.offensive-security.com/metasploit-unleashed/persistent-netcat-backdoor/)。从阅读该网页你可以看到，按照包含的指令向\
  \ Windows 注册表和防火墙规则写入更改相对简单。\n\n无论你使用哪种操作系统，netcat 都有多个可用选项。警告，在测试期间，你可以传递许多环境变量，如果不小心可能会引起各种问题。\n\
  \n\n\n\n使用 `netcat` 功能层出不穷。你甚至可以为你的 `netcat` 实例添加 ACL（访问控制列表）。在监听的 `netcat` 守护进程上，你可以添加类似示例所示的\
  \ ACL。你可以通过参考文档中的示例并尽职地锁定你的端口来扩展你刚才看过的 Bash 命令，如下所示：\n\n```\n## ncat --exec \"/bin/bash\"\
  \ --max-conns 3 --allow 192.168.0.0/24 -l 8081 --keep-open\n```\n\n你可以看到，你只允许了来自\
  \ CIDR `/24` IP 地址范围 `192.168.0.0` 的 254 台主机访问，并且只允许机器最多开启三个连接。这些选项的组合增加了非常受欢的灵活性。\n\
  \n该命令的反面可能是使用 IPv6 的如下所示的 `--deny` 示例：\n\n```\n## ncat -l --deny 1222:cb88::3b\n\
  ```\n\n在这里，你允许所有其他机器访问，仅拒绝这一个。正如你所预期的，这同样适用于 IPv4。\n\n另外，在启用或禁用多个主机的访问时，以下方法要高效得多。你只需要在文件中填充你的条目即可。如下所示使用\
  \ `--denyfile` 和 `--allowfile` 选项：\n\n```\n## ncat -l --allowfile trusted-hosts.txt\n\
  ```\n\n## 杂选项\n\n顺带一提，你可以通过 `-u` 或 `--udp` 切换轻松地跳出默认 TCP。你很快就会知道为什么这很有用。\n\n同样，为了开始使用\
  \ SCTP（流控制传输协议），你可以为 `netcat` 提供 `--sctp` 选项。\n\n另一个实用的小技巧是，你还可以添加最多三个字母 `v`，其中\
  \ `-vvv` 在你的命令输出结果时提供最详细的日志（verbosity）。\n\n与你之前使用 `netcat` 发送 SMTP 命令一样，强大的 `netcat`\
  \ 同样能够发送 Telnet 命令。因此，如果你发现自己没有 Telnet 客户端的权限，那么 `netcat` 也可以提供帮助。使用 `netcat` 代替\
  \ Telnet 有几个显而易见的优势。首先，`netcat` 更安静，除非你连接的机器发送了数据，否则它不会输出数据。还有一些保留的控制字符，这意味着如果你使用\
  \ Telnet，某些二进制数据将会损坏。此外，你可能注意到 Telnet 在空闲（静默）连接上会退出并停止运行，这意味着你可能无法接收整个会话的数据。`Telnet`\
  \ 命令与 UDP 的配合也不良好，但正如你所知，`netcat` 当然可以。\n\n## 总结\n\n在本章中我只涵盖了 `netcat` 潜力的一小部分；其范围太广了，无法完全涵盖。\n\
  \n希望你理解，了解这种复杂工具的功能至关重要，即使不是为了其他理由，为了揭示更多关于攻击者如何利用这些工具对付你。\n\n下一次我需要在局域网内移动文件时，我一定会使用\
  \ `netcat`；对于此类简单任务，依赖像 SFTP 工具等更笨重的数据传输工具太容易了。你应该避免使用 `Telnet` 命令调试开放的端口和连接，而应始终使用\
  \ `netcat`。\n\n在我的情况下，我还必须记得不要向某些同事展示如何进行上述任何操作，因为他们很有可能造成可怕的破坏并留下巨大的安全漏洞。\n\n#\
  \ 第 4 章：拒绝服务\n\n不可否认，如果没有某些关键服务的运行，互联网将陷入停滞。许多用户将遭受性能下降的痛苦，而另一些用户可能直接遭遇完全中断。除了 DNS（域名系统）外，NTP（网络时间协议）也是互联网成功运行的关键。在本章中，我将花一些时间描述攻击者如何尝试阻止关键服务的正常工作。\n\
  \n对于那些负责维护互联网运行的人来说，不幸的是，可能可以使用各种方法攻击互联网的大部分 DNS 和 NTP 基础设施。例如，过去的 `DDoS`（分布式拒绝服务）攻击主要设计目的是为了让在线服务下线，或者至少以一种极令人沮丧的方式扰乱其用户，可能是为了获得竞争优势或获得赎金。目前的观点是，此类攻击现在被用作烟雾弹，以掩盖其他恶意的安全漏洞。\n\
  \n卡巴斯基实验室在 2014 年发布的一份报告估计，中小型企业在 `DDoS` 攻击上的花费大约为 52,000 美元。对于经历过此类攻击的企业，这个数字将上升到大约\
  \ 444,000 美元。当你考虑到声誉损失、客户对不得不使用缓慢在线服务（如果还有服务可用的话）的不满以及支付交易失败（这可能需要事后人工干预来解决）时，防御此类基础设施挑战是一项值得的活动。最令人担忧的是，在报告所依据的来自\
  \ 27 个国家的 3,900 个组织中，“超过三分之一（38%）提供金融服务或运营面向公众在线服务的企业在 2013 年 4 月至 2014 年 5 月期间经历过\
  \ `DDoS` 攻击。”\n\n导致关键在线服务拒绝访问的方法有多种形式。在看到过去几年中反射攻击（包括放大攻击）的增加后，针对 `NTP` 和 `SNMP`\
  \ 服务，我将描述它们的一些历史、涉及的内容以及如何缓解潜在的灾难性影响。\n\n## NTP 基础设施\n\n我提到过关键基础设施服务是攻击的目标，因为它们对攻击者来说是高价值的。随着\
  \ `DNS` 和 `NTP` 协议多年来的演变，安全性当然被纳入了设计中。考虑一下 `NTP`。\n\n正如你所预期的，有一些内置的安全机制可以帮助加强作为服务的\
  \ `NTP` 安全。例如，一些顶级 `NTP` 层 1 服务器采用了“关闭账户”选项，这些服务器在没有事先许可的情况下无法使用。相反，正如你所预期的，只要遵循它们的使用策略，开放访问服务器可以随时供轮询。那些受限访问服务器有时会因为最大客户端数量或最小轮询间隔而限制访问，并且有时仅对某些类型的组织（如学术机构）开放。\n\
  \n另一个 `NTP` 安全组件是客户端软件的编写方式使其遵循从请求请求的服务器所生成的指令。如果接收的 `NTP` 服务器愿意，它可以简单地阻止请求。与某些路由和防火墙技术类似，那些数据包会被丢弃或丢入黑洞而不进行干预。换句话说，这些不需要数据包的接收服务器不会产生额外的系统负载，直接丢弃掉它认为不应该响应的流量。\n\
  \n\n\n关注 `NTP` 的整体安全性还有其他充分理由。除了对 IP 地址的需求以及带宽使用对银行余额的影响外，你还需要将互联网的 `NTP` 基础设施列入服务清单，因为这些服务正面临来自物联网（IoT）可能爆炸性的、指数级增长的影响。据记录，很快将会有数十亿台额外设备需要进行同步，这样你的冰箱就能在牛奶用光之前订购一些，等等。\n\
  \n## NTP 反射攻击\n\n在 2014 年左右，一种恶劣的 `NTP` 攻击浮出水，令互联网服务提供商（ISP）应于不堪，并迫使互联网社区迅速采取有效行动来遏制它。在短段时间内，至少在攻击受害者中，它造成了巨大的困惑。这种简单得惊人但又创新的漏洞影响了几乎所有的\
  \ `NTP` 实现。这种攻击被称为反射攻击（reflection attack），其本质是产生本不希望的流量，并将这些流量导向受害者。这通常会导致受害者遭受负载或带宽容量问题，除非他们拥有强大的底层基础设施支持。在过去，这些攻击被称为“挑战-响应攻击”（challenge-response\
  \ attacks）；然而，在我看来，这种描述并没有帮助，因为并不是所有的反射攻击都涉及身份验证，而挑战-响应通常与身份验证机制相关。\n\n2014 年的 `NTP`\
  \ 攻击遵循了过去经常看到的类似 `DNS` 反射攻击。当发现某个关键服务存在此前未见过的、可利用的攻击向量时，技术人员会为了保护自己的基础设施而陷入胡乱一措。他们面临的决策包括：在发布补丁或配置修复之前，是否需要立即禁用该单一服务，以保持其他服务的继续运行。毕竟，在计算机上手动设置时间是可能的，或者在许多情况下允许系统时钟存在微小误差。许多服务在出现任何不良影响之前，即使缺失\
  \ 24 小时的 `NTP` 同步更新也是幸存的。\n\n在这类攻击中，有两个术语频繁出现。第一个是 `reflection`（反射），其同源词是指攻击流量的镜像重定向。在这里，许多第三方服务通常通过将流量发送给受害者（主要目标）而不是攻击者来响应。这是通过伪造或欺骗攻击者的\
  \ IP 地址实现的，从而欺骗第三方关于最初是谁请求了流量。\n\n另一方面，`Amplification`（放大）可能最适合解释为发送一个数据包作为问题，并收到一个百个数据包作为答案。在反射攻击的情况下，这指的是毫无防备的受害者收到了负载，或者收到一个他们并没有问的大型答案。\n\
  \n想象处于三角形中的三台机器。机器 A 代表 B 向机器 C 提了很多问题。机器 C 然后将所有答案错误地发送给 B。机器 B 被海量的答案淹没。机器 A 对\
  \ B 来说是不可见的，B 甚至不知道 A 参与了攻击。对于那些保护基础设施的人来说，这构成了一项极具挑战性的诊断。\n\n据报道，标准 `DNS` 反射攻击产生的\
  \ DDoS 流量放大倍约为 70:1。换句话说，如果你有 1 Gb 比特的带宽可用，那么你就可以转发 70 Gb 比特。据报道，通过 `NTP` 漏洞实现的上述反射比例从\
  \ 20:1 到 200:1 不等。你只需要查找一个免费的公共 `NTP` 服务器列表，就可以创建数量惊人的 `NTP` 流量来为你的 DDoS 攻击提供燃料。\n\
  \n`NTP` 攻击正如往常一样，简单得令人恐惧。它基于一个内置函数，该函数允许任何人查询最后连接的几百台 `NTP` 服务器。被利用的函数称为 `monlist`；你也可能看到它显示为\
  \ `MON_GETLIST`。攻击者伪造提问的 IP 地址，使得被查询的 `NTP` 服务器回复给受害者而不是提交查询的机器。通过反复重复该命令，如果成千上万台服务器同时响应，受害者很快就会被淹没。这种“反射”攻击的“放大”效应——答案涉及的数据量远大于原始问题——正是其具有如此破坏性的原因。这是因为只有相对少量的用于此类查询的源头服务器就能击倒大部分区域的基础设施。\n\
  \n在 `IPv4` 系统（第一行显示为 `-4`）和 `IPv6` 系统（第二行带有 `-6`）上，缓解此类攻击的本质包含了你的 `NTP` 配置文件中的以下行：\n\
  \n```\nrestrict -4 default nomodify nopeer noquery notrap\nrestrict -6 default nomodify\
  \ nopeer noquery notrap\n```\n\n在其他模板之外，有一个非常受欢迎的 `NTP` 服务器模板可以使用，它可以帮助你的面向网服务器避免成为此类攻击的一部分，地址位于\
  \ `www.team-cymru.org/templates.html`。如果你访问该页面并点击“Secure NTP Template”链接，将看到一组适用于包括\
  \ Cisco iOS、Juniper Junos 和 Unix 在内的各种平台的模板。\n\n还包括一个关于如何配置 `IPtables` 以帮助锁定 `NTP`\
  \ 的有用提醒，如下：\n\n```\n## iptables -A INPUT -s 0/0 -d 0/0 -p udp --source-port 123:123\
  \ -m state --state ESTABLISHED -j ACCEPT\n# iptables -A OUTPUT -s 0/0 -d 0/0 -p\
  \ udp --destination-port 123:123 -m state --state NEW,ESTABLISHED -j ACCEPT\n```\n\
  \n此外，还有一个趣的注意事项：如果你由于恐慌而决定在路由器层面阻止 `NTP` 流量进入你的网络，可能会产生破坏性的影响。只有在你完全知道做什么时，才应该过滤\
  \ UDP 123 端口的 `NTP` 流量，否则关键服务将不可避免地失效。\n\n## 攻击报告\n\n当那场首次 `NTP` 攻击发生时，云服务提供商 CloudFlare\
  \ 宣布了记录以来最大的 DDoS 攻击。根据 CloudFlare 的数据，该攻击流量略低于 400 Gbps，令人震惊的是只有 4529 台服务器就产生了如此巨大的流量。相比之下，据报道针对\
  \ Spamhaus（一家反垃圾邮件服务提供商）的一次广为攻击使用了 30956 个开放解析器生成了 300 Gbps 的 DDoS。正如你所看到的，在单机影响方面，这是一个巨大的差异。\n\
  \n另一种越来越多用于 DDoS 攻击的协议是 1988 年由 PSINet 创建的，该公司曾是全球最大的 ISP 之一（如果不是的话），最终被各种合并和收购所吸收。\n\
  \n简单网络管理协议 (`SNMP`) 存在于大多数网络设备中，例如交换机和路由器。这种实用的协议有助于将统计信息（如带宽使用情况）回传给任何能够接收它的软件。最重要的是，它情况下开启了一个基于名为\
  \ `public` 的社区字符串的攻击向量。即使配置了默认密码，它们通常也很简单，例如 `private`。这意味着即使你的宽带路由器也构成了潜在风险，并可能参与\
  \ DDoS 攻击。还要考虑企业或 ISP 启用了 `SNMP` 的设备；在单个网段内可能有几十台强大的交换机和路由器。顺便提一下，办公室里的打印机、工作站以及\
  \ IP 视频摄像头通常也采用 `SNMP` 实现。\n\n\n\n\n据观察，攻击者一直在利用 `SNMP` 进行大规模的反射/放大攻击。据报道，这种惊人的流量比例高达\
  \ 1700:1。当然，这一估计有多准确仍有待观察，而且其中是否存在某种程度的危言耸听。\n\n2014 年 5 月，Akamai 的 DDoS 部门报告称他们发现了\
  \ 14 次 `SNMP` 攻击。其中近一半发生在美国，约 18% 发生在中国。\n\n## 防止 SNMP 反射\n\n在快速检查你的 `/etc/services`\
  \ 文件后，你可以看到 `SNMP` 使用默认端口的以下细节：\n\n```\nsnmp            161/tcp                \
  \        # Simple Net Mgmt Proto\nsnmp            161/udp                      \
  \  # Simple Net Mgmt Proto\nsnmptrap        162/tcp                        # SNMPTRAP\n\
  snmptrap        162/udp     snmp-trap          # Traps for SNMP\n```\n\n为了防止源自你网络的\
  \ `SNMP` 流量反射，你可以遵循“默认拒绝”的原则，确保你的边界防火墙不会让此类流量流出局域网（LAN）并进入互联网。当然，这也适用于进入你局域网的流量。然而，很多时候，设备在匆忙设置、升级或由不专业的人员配置时，默认设置往往保持不变，导致这些预防措施被忽略。此类攻击最令人担忧的是，得益于全球海量的宽带路由器，手动修复其中一些路由器可能需要很长时间（尽管负责任的\
  \ ISP 可以在其网络中添加有用的入站和出站过滤器）。与此同时，大部分基础设施可能会开始遭受性能问题的影响。\n\nAkamai 描述的 `SNMP` 攻击被归因于一种专门设计的攻击工具。该工具自动发送\
  \ `SNMP` “GetBulk”请求并伪造 IP 地址，其方式与 `NTP` 和 `DNS` 反射攻击相同，以确保受害者的 IP 地址接收到针对这些虚假请求所回的大量响应。幸运的是，这种特定的攻击仅适用于旧版本的\
  \ `SNMP`（版本 2）。版本 3 提供了更高的安全性，并且在默认情况下不会那么容易被滥用。\n\n令人担忧的是，这种攻击的核心设计是仅通过几次请求（甚至可能来自单台机器）就能产生大量的流量。犯罪分子不需要投入时间和资源（有时甚至不需要钱购买僵尸网络）就可以破坏大部分的在线基础设施。\n\
  \n## DNS 解析器\n\n2014 年底，另一个有趣的攻击浮出水面。关于这是否真的意图进行反射攻击目前仍有争议，但我在这里讨论它，以增加你对该领域的知识。作为其服务的一部分，Google\
  \ 提供了两个具有易记 IP 地址的著名 `DNS` 解析器：\n\n```\n8.8.8.8\n8.8.4.4\n```\n\n这些解析器为任何没有可用 `DNS`\
  \ 服务器的个人或设备提供递归 `DNS` 查询。这些 `DNS` 解析器将响应你请求的任何查询，要么通过其缓存，要么在缓存中没有合适答案时通过新的查询来实现。OpenDNS\
  \ 提供类似的服务，但它公开讨论了过滤你的 `DNS` 查询的益处，例如，在你尝试访问以前被举报的钓鱼网站时提醒你。它们的 IP 地址也容易记忆、具有韧性且可靠：\n\
  \n```\n208.67.222.222\n208.67.220.220\n```\n\n这些（大多）免费的服务被广泛采用，可能是因为它们提供了无需在本地运行\
  \ `DNS` 服务器的便利性。然而，得益于它们易记的 IP 地址和卓越的可靠性，遗憾的是与其他许多流行服务一样，这些善意的提供者成为了另一个令攻击者感兴趣的高价值目标。\n\
  \n显然，你有充分的理由关注在生产基础设施中使用此类服务具体位置，因为一旦它们被攻破，你将失去控制权。在 `DNS` 查询方面，最明显的攻击可能是 `DNS`\
  \ 缓存投毒，查询机会被一个错误的答案并被发送到一个非法的 IP 地址，这可能会感染请求者或以其他方式攻击它。许多 `DNS` 缓存投毒攻击中的一种是所谓的 Kaminsky\
  \ 风格攻击（[`dankaminsky.com`](http://dankaminsky.com)），它们不仅投毒单个 `DNS` 记录，而且自己接管了域名的权威记录。关于安全研究人员\
  \ Dan Kaminsky 的发现，有一些写得很好的信息，可以在 [`http://unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html`](http://unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html)\
  \ 找到。\n\n由于其影响，不应低估 `DNS` 攻击的重要性。据报道，Google 的 `DNS` 解析器每天处理约 1500 亿次查询。\n\n2014\
  \ 年的攻击在当年第四季度包含了 Google 的 `DNS` 解析器 IP 地址，受到了热门在线安全频道的关注。例如，互联网风暴中心（[`isc.sans.edu`](https://isc.sans.edu)）对识别进入你网络并声称来自\
  \ Google `DNS` 解析器的攻击提供了建议。通过简单的数据包嗅探，可以监控此类攻击并记录其频率。\n\n在这里，使用 `tcpdump` 嗅探工具，你只需将发现的任何相关流量转储到名为\
  \ `/tmp/suspect_traffic` 的文件中。你将这些流量分类为来自 `8.8.8.8`（这只是 Google 的解析器之一）并目标为端口 `161`。\n\
  \n```\n# tcpdump -s0 -w /tmp/suspect_traffic dst port 161 and src host 8.8.8.8\n\
  ```\n\n通过捕获这些流量，你可以监控其数量以及 DNS 查询是否合法。如果发现了不受欢迎的流量，你可能希望通过引入防火墙规则来限制这些受影响设备与外部的通信。防火墙为相关设备提供了访问外部世界的权限。\n\
  \n白帽与其他安全专业人员的讨论表明，这些显然源自 Google IP 地址的攻击实际上被设计用来（利用预配置为设备 DNS 服务器的 IP 地址）来利用和击败配置不当的设备，而不是用于反射流量。换句话说，攻击者可能会重新配置这些设备用于他们邪恶的目的，而不是拒绝服务。\n\
  \n为了进一步阅读，请考虑另一种攻击向量，以及绕过合法 `BGP` 宣告（边界网协议是连接互联网许多网络的复杂路由协议）来针对 Google `DNS` 解析器的尝试；你可以在此处阅读更多信息：[`http://thehackernews.com/2014/03/google-public-dns-server-traffic.html`](http://thehackernews.com/2014/03/google-public-dns-server-traffic.html)。\n\
  \n## 共谋\n\n\n\n\n\n一篇较旧文档编写于 2000 年，旨在引发辩论并帮助那些对维护互联网运行感兴趣的人。该文档被称为《当前最佳实践 38》（`BPC\
  \ 38; [`https://tools.ietf.org/html/bcp38`](https://tools.ietf.org/html/bcp38)]`），为网络管理员提供了深受欢迎的建议。在其他组织之外，它还鼓励企业和学术机构加强其主机和网络设备上网络基础设施各个方面的防御能力，以防止互联网周围出现连锁反应。\n\
  \n具体而言，我们需要花一些时间来讨论入站过滤（ingress filtering）的重要性，以便在当自己的网络被用作攻击工具时，能够保护外部网络免受损害。引用这一点，通过采用简单的预防措施，对来自“合法”源的攻击进行诊断和缓解，比猜测源流量的来源要有效得多，正如你在早之前的章节“NTP\
  \ 反射攻击”中看到的那样。\n\n在许多情况下，不同层级的入站过滤可以实现这一目标。文中提出的观察结果是，通过减少针对互联网的攻击数量和频率，最终在攻击发生时将有更多的可用资源。结果是响应将更加有效。这些开创性指南的大部分内容被归功于受尊敬的\
  \ NANOG（北美网络运营商小组；[`https://www.nanog.org`](https://www.nanog.org)`），他们在一个受欢迎的邮件列表中详尽且激烈地讨论网络问题。\n\
  \n## 让一个国家陷入瘫痪\n\n多个地理位置分散的系统针对单一系统（例如网络化系统或自治系统，无论其规模有多大）并使其脱离线的威胁，长期以来一直是企业、ISP\
  \ 甚至整个国家的担忧。DDoS 攻击可能从 20 世纪 80 年代中期就已经存在了。\n\n2007 年有广泛报道，波罗的海国家爱沙尼亚遭受了多次 DDoS\
  \ 攻击，结合街头暴乱，几乎让政府陷入瘫痪。显然，民众反对爱沙尼亚议会拆除一座著名的战争纪念碑。加之高程度的社会动荡，这成了最后的转折点。来自 DDoS 的攻击流量水平不断上升，并在长时间内以持续的方式被接收。新闻机构对连接中断感到沮丧，因为这意味着世界其他地方无法及时了解该国内发生的事件。\n\
  \n爱沙尼亚的 DDoS 在不断演变，据报道曾涉及每秒四百万个数据包的攻击流量。这部分是为了（且根据某些报告最终成功）让该国最大的银行断了网。根据国家统计数据，约\
  \ 97% 的人口在线银行业，这意味着该国的银行系统发生了致命性故障。如果影响还不够严重，互联网连接的缺失意味着主银行无法与自动取款机（ATM）通信或无法从其提取现金。\n\
  \n令人担忧的是，据说与这次持续约三周的巨大破坏性事件相关的唯一逮捕仅导致了低于 2000 美元的罚款。然而，通过爱沙尼亚获得的惨痛教训，增强了 NATO 在提高此类攻击国际响应效率方面。\n\
  \n## 攻击映射\n\n正如 William Cheswick 等人的优秀著作《防火墙与互联网安全：防御狡猾的黑客》（*Firewalls and Internet\
  \ Security*）在引言中简洁提到的：\n\n> 互联网是一座大城市，而不是一系列小镇。任何人都可以使用它，并且几乎是以匿名的方式使用。\n\n> 互联网是一个糟糕的社区。\n\
  \n通过使用数字攻击地图（Digital Attack Map）可以证实这段引言的有效性，这是一个在线工具，提供了 DDoS 攻击的极佳全球概述，并在 [`www.digitalattackmap.com`](http://www.digitalattackmap.com)\
  \ 上每小时更新一次。\n\n这个完全图形化的数字攻击地图工具由 Arbor Networks 和 Google Ideas 运行，他们利用全球 270 多个\
  \ ISP 的数据填充该工具。这些 ISP 同意与 Arbor Networks 的全球威胁情报系统 ATLAS 共享数据。数据可以通过 Arbor 的 ATLAS\
  \ 威胁门户获取，并值得在 [`www.arbornetworks.com/threats`](http://www.arbornetworks.com/threats)\
  \ 上仔细查看。\n\n此外，还有一个实用的画廊，重点展示了关键的历史攻击以供参考，位于 [`www.digitalattackmap.com/gallery`](http://www.digitalattackmap.com/gallery)。你可以通过将鼠标悬停在攻击流上进行交互，揭示攻击期间被滥用的令人惊舌的每秒千比特带宽。此外还有攻击的大致来源（例如，如果攻击是由僵尸网络生成的，那么它可能来自几十个不同的国家）、假设的目标受害者以及攻击的持续时间。此外感兴趣的是攻击期间使用的源端口和目的端口；令人惊讶的是，在我查询的前几次攻击之一中出现了\
  \ NTP 端口，即 UDP 端口 `123`。但有趣的是，根据可用数据判断，端口 `80` 和 `53`（分别是 HTTP 和 DNS）似乎仍然是最流行的 DDoS\
  \ 服务。\n\n图 4.1 显示了来自数字攻击地图网站的攻击示例，以及全球地图左侧的攻击类型及其颜色编码。这仅仅是这个功能强大的网站的首页。你可以花费几个小时来深入研究该网站以易于理解的格式呈现的当前和历史信息。\n\
  \n![来自 Arbor Networks 数字攻击地图网站的攻击示例，以及全球地图左侧的攻击类型及其颜色编码。](img/c04f001.jpg)\n\n\n\
  \n\n\n正如美国军方的 DARPA（国防部高级研究计划局）做出了巨大贡献，并帮助塑造了你今天所熟知并喜爱的互联网一样，类似的军转民用过程也产生了当今互联网上最常用的网络发现工具：`ping`\
  \ 命令。`ping` 命令的起源源于海军船舶发射声纳脉冲，以检测附近是否有其他船只或地质特征。\n\n作为强大的安全工具 `Nmap` ([`nmap.org`](https://nmap.org))\
  \ 提供的网络发现功能的一部分，它还包含了对标准 `ping` 命令的强大改进版的访问，称为 `Nping` ([`nmap.org/nping/`](https://nmap.org/nping/))。如果你用过\
  \ `Nmap`，你就会知道，在可靠性和经过深考虑的功能方面，Nmap 项目创建的任何工具都是可靠的。\n\n让我们来看看 `Nping` 工具如何帮助你更深入地了解你的系统和网络运行情况，挖掘远程和本地连接。\n\
  \n## 功能\n\n从表面上看，你可能认为 `Nping` 的功能相对有限。毕竟，当你发送 ping 时，你只是发送了一个问题，然后等待答案。虽然 `Nping`\
  \ 还不是一个完全完成的软件，但可以说它是一个非常全面且复杂的网络工具。\n\n你将从习惯语法开始。你需要以超级用户 `root` 的身份登录以执行某些 `Nping`\
  \ 命令，在一种情况下，你将查看 TCP 模式。你的第一个练习是向你的本地机器发送 TCP “pings”（你读得没错；它们不是 ICMP ping）。从标准\
  \ `ping` 的手册页（man page），你可以看到 `ping` 的正常操作“使用 ICMP 协议的强制 `ECHO_REQUEST` 数据报来从主机或网关诱导\
  \ ICMP `ECHO_RESPONSE`”。换句话说，这里涉及到一问一答。\n\n如果你有疑问，我将使用我的本地机器进行这些示例，以避免骚扰其他机器并向防火墙日志中充入可疑活动。像所有白帽工具一样，你应该非常小心地使用它们。\n\
  \n令人印象的 `Nping` 不仅关注 ICMP，它还是标准 `ping` 命令的一个设计良好的扩展，还可以与许多不同的协议通信。它还为你提供了易于理解的结果。\n\
  \n如果你还没有安装，可以按照以下方式安装 `Nping`。\n\n在 Debian 衍生版上，只需使用以下命令安装 `Nmap` 软件包：\n\n```\n\
  ## apt-get install nmap\n```\n\n在 Red Hat 衍生版上，使用此命令安装 `Nmap`：\n\n```bash\n## yum\
  \ install nmap\n```\n\n## TCP\n\n回到 TCP（传输控制协议）示例。你将在本地机器上运行以下命令，这样就不会有防火墙问题需要担心，也不会打扰其他系统管理员：\n\
  \n```\n# nping -c1 --tcp -p 80,443 localhost\n```\n\n在这里，你通过 TCP 发送一个 ping 包（带有\
  \ `-c1` 计数选项）到你本地机器的 TCP 端口 80 和 443。此命令的输出可能如 列表 5.1。\n\n你可以从 列表 5.1 中看到，你收到了来自\
  \ TCP 端口 80 和 TCP 端口 443 的回复。根据 `--c` 选项，在每个端口发送一次数据（且数据已返回）后，ping 就会自动停止。如果没有明显的有效响应，你可能会看到类似的内容：\n\
  \n```\nnping_event_handler(): READ-PCAP killed: Resource temporarily unavailable\n\
  nping_event_handler(): TIMER killed: Resource temporarily unavailable\n```\n\n既然你已经对\
  \ `Nping` 的外观以及它如何对你的输入做出反应有了了解，那么你可以随时随地使用无类域间路由（CIDR）网络表示法应该并不意外（例如，10.10.10.0/24）。你现在将保持基础，并查看如何指定要\
  \ ping 的端口范围，而不是像你刚刚那样将它们列在列表中指定。\n\n考虑 Unix 类型类型 上的“特权端口”。这些端口在过去被赋予过几个名称（如超级用户端口或原始端口），但本质上，只有\
  \ `root` 用户有权限打开它们。这是一项原始的安全特性，意味着如果你远程连接到这些端口号之一，你可以合理地确保运行在上面的服务是真实的。换句话说，它是由\
  \ `root` 用户启动的，而不是普通用户。以下是如何使用 `Nping` 检查所有特权 TCP 端口：\n\n```\n# nping -c1 --tcp\
  \ -p 0-1024 localhost\n```\n\n使用一种几乎肯定与其他网络工具不同的方法，`Nmap` 以异常的方式处理多个主机和端口号。为了效率，如果指定了多个目标机器，`Nping`\
  \ 不会简单地向列表中的第一台机器发送查询并耐心等待响应。相反，它采用了一种简单但聪明的轮询方法，按顺序交替联系机器，这样在等待响应时就不会给用户引入延迟。当有多个主机时，`Nping`\
  \ 也会给目标一个机会进行响应。\n\n## 解释器\n\n`Nping` 可以作为一个解释器。如果你使用 `--tcp-connect` 选项，你就在让 `Nping`\
  \ 进入连接模式。你不需要 `root` 权限来发送原本应该是原始数据包。\n\n正如你所见，`--tcp` 选项在作为超级用户运行时允许使用 TCP 数据包造成损害（实际上，它们是“恶”）。如果作为三个独立的命令使用，TCP\
  \ 握手看起来可能如下：\n\n```\n# nping --tcp -p 80 --flags rst -c1 localhost\n# nping --tcp\
  \ -p 80 --flags syn -c1 localhost\n# nping --tcp -p 80 --flags ack -c1 localhost\n\
  ```\n\n## UDP\n\n你也可以通过使用 `--udp` 选项采用数据报协议（UDP）数据包。通常 TCP 和 UDP 数据包嵌入在 IP 包中，但正如我说的，如果没有\
  \ root 权限，只要默认头部没有被更改，你就看不到数据包的内容，只能看到状态。UDP 数据包同样如此。\n\nUDP ping 有时可以发现其他协议失效的。UDP\
  \ ping 可能会绕过防火墙并报告防火墙后是否有监听。这是你工具箱中非常有用的补充。一个简单的示例命令可能如下：\n\n```\n# nping --udp\
  \ localhost\n```\n\n当我不在 root 用户的情况下对本地机器尝试此命令时，我看到了如下反馈：\n\n```\nSENT (0.0069s)\
  \ UDP packet with 4 bytes to localhost:40125 (127.0.0.1:40125)\nERR: (0.0070s) READ\
  \ to 127.0.0.1:40125 failed: Connection refused\n```\n\n然而，作为超级用户 root，我可以完成如下事务：\n\
  \n```\nSENT (0.0161s) UDP 127.0.0.1:53 > 127.0.0.1:40125 ttl=64 id=64074 iplen=28\n\
  RCVD (0.0163s) ICMP 127.0.0.1 > 127.0.0.1 Port unreachable (type=3/code=3) ttl=64\
  \ id=18756 iplen=56\n```\n\n如所示，两个示例中的 UDP ping 流量都是指向 UDP 端口 40125 的。\n\n\n\n\n\
  与标准的 `ping` 命令一样，当以 root 用户身份执行且未选择其他协议时，`Nping` 默认使用 ICMP。文档大胆地声称：“任何种的 ICMP 消息都可以被创建”。例如，你可以查询时间戳、生成伪的“目标不可达”消息，或通过重定向数据包为另一个系统或网络造成问题。\n\
  \n请分别以 root 用户和标准用户登录并尝试以下命令：\n\n```bash\n# nping localhost\n```\n\n你可以清晰地看到细节上的差异。这里是标准用户的输出，细节不多：\n\
  \n```\nSENT (0.0027s) Starting TCP Handshake > localhost:80 (127.0.0.1:80)\nRECV\
  \ (0.0028s) Handshake with localhost:80 (127.0.0.1:80) completed\n```\n\n在下一个示例中，作为\
  \ root 用户，你可以看到关于 ICMP 数据包内容的更多信息。根据其 RFC（[`tools.ietf.org/html/rfc792``](https://tools.ietf.org/html/rfc792)），`type=8`\
  \ 条目代表“8 Echo”，这正是你预期的。\n\n```\nSENT (0.0152s) ICMP 127.0.0.1 > 127.0.0.1 Echo request\
  \ (type=8/code=0) ttl=64 id=31032 iplen=28\nRCVD (0.0154s) ICMP 127.0.0.1 > 127.0.0.1\
  \ Echo reply (type=0/code=0) ttl=64 id=18763 iplen=28\n```\n\n## ARP\n\n你还有 `--arp`\
  \ 选项，允许你对地址解析协议（ARP）进行实验。除了部署欢迎的 ARP 缓存污染攻击，你还可以构造各种类型的 ARP 数据包。现在过时的 RARP（反向 ARP）查找曾用于将\
  \ MAC 地址转换为 IP 地址。RARP 已被 BOOTP 和 DHCP 协议取代，但 RARP 有时仍有用武。还有一种 RARP 的进化版本称为动态 RARP\
  \ (DRARP)，它是被支持的。它主要在上个世纪末由 Sun Microsystems 使用，如今极少使用。此外还支持“InARP”请求；这类似于 RARP，但主要应用于帧式中继和\
  \ ATM 网络。\n\n最后，为了这些这些协议，你可以在输出中添加 `--traceroute`，通过查看回复的“目标不可达”数据包的源地址，帮助确定流量所经的路径。\n\
  \n## Payload 有效负载选项\n\n现在你已经熟悉了主要的协议选项，让我们看看是否能将新学的知识付诸实践。再次提醒，Nmap 是为白帽活动设计的，应该以此方式使用，而不是为了非法获利。使用此类工具可能会造成混乱。\n\
  \n如果你想在探测数据包中添加有效负载，那么有三种类型，如表 5.1 所示。\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `--data`\
  \ | 在此处你可以追加一些十六进制数据。文档提供了示例，如 `--data 0xdeadbeef` 和 `--data \\xCA\\xFE\\x09`。 |\n\
  | `--data-string` | 你将追加一个字符串，例如 `--data-string “Per Ardua ad Astra\"`。 |\n| `--data-length`\
  \ | 使用此选项，你可以用 0 到 65,400 字节的随机数据填充数据包，例如 `--data-length 999`。注意，超过 1,400 字节的内容可能会超出某些网络\
  \ MTU。 |\n\n**表 5.1** 有效负载选项及其描述\n\n## Echo 模式\n\nNping 包含的高级功能中包含了 Echo 模式。该模式旨在详细显示数据包在穿越网络时发生了什么。通过在两个主机上启用\
  \ Echo 模式，你可以建立服务器与客户端的关系，以精确监控在链路上发生的任何情况。\n\n让我们来看这个功能。服务器组件捕获数据包，然后通过 TCP 通信“通道”将细节发回客户端。首先，生成上述数据包是客户端的任务。\n\
  \n这种技术是发现可能发生的数据包篡改的绝佳方法。而且，如果涉及了网络地址转换 (NAT)，许多数据包细节也会发生变化。通过使用这种技术，如果线上的设备更改了其他\
  \ TCP 选项或发生了流量整形，那么这些原本难以诊断的细节就会显而易见。你可能还能确定数据包在传输过程中何时被神秘地阻塞，这将有助于诊断问题。\n\n让我们尝试使用\
  \ Echo 模式做一个小实验。顺便提到，如果你想从 Nping 获取更多输出和更高级别的细节，可以添加 `-vvv` 来增加详细程度。要开始，你需要 root\
  \ 用户来启动连接的服务器端。你将使用密码“please_connect”，并通过以下命令在你的 `eth0` 网络接口上收到的输出中增加详细程度：\n\n```bash\n\
  # nping -e eth0 -vvv --echo-server \"please_connect\"\n```\n\n\n\n\n由于 NAT 非常别流行（而且你的连接很可能经过了\
  \ NAT），如果你查询那台机器，很有可能在 `SENT` 行下方、下一行 `RCVD` 之前看到 `CAPT` 条目。这个命令对我很有效：\n\n```bash\n\
  # nping --echo-client \"public\" echo.nmap.org --tcp\n```\n\n如果你仔细观察捕获的数据包条目（`CAPT`），那么你应该能够判断出\
  \ NAT 是否更改了你的出站源地址。你会看到一个私有 IP 地址，例如 `10.10.10.10`（根据 `RFC 1918`（[`tools.ietf.org/html/rfc1918``](https://tools.ietf.org/html/rfc1918)\
  \ ），如果涉及了 NAT，它将被更改为显示公网路由 IP 地址，例如 `123.123.123.123`。检测 NAT 干扰你的连接相对容易。请记住，在有 NAT\
  \ 的地方，有时还有其他设备在修改 MTU（最大传输单元）、为了流量整形进行数据包篡改、意外的防火墙以及可能导致你的连接发生细微变化的隐形交换机。\n\n`Nping`\
  \ 还可以帮助处理许多其他场景，例如（在经过学习后）能够识别路径途中可能使用了透明代理。我将留给你去进一步提升技能，在此期间，下面的章节描述了一些你可能会发现有用的其他选项。\n\
  \n## 其他 Nping 选项\n\n使用 `--delay 10` 选项，你可以选择限制数据包的频率。默认通常是每隔一秒发送一次 ping，但如果你在严密观察某个特定事件，增加此值可以减少屏幕上的噪音。\n\
  \n思路类似的是 `--rate 3` 选项，在给出的示例中，你可以通过每秒发送三个数据包来淹没目标机器。不过，不要在纠结 `rate` 和 `delay` 选项的设置上被困住。根据文档：\n\
  \n> 此 `rate` 选项和 `--delay` 是互反的；`--rate 20` 等同于 `--delay 0.05`。如果同时使用了这两个选项，则以参数列表中最后一个为准。\n\
  \n你可以利用 `-H` 或 `--hide-sent` 选项来不显示出站数据包。例如，如果你正在对连接泛洪，这将有所帮助。\n\n此外，如果你正在对网络泛洪并测试其对大量负载的响应，那么你可能不想处理收到的每个包。`-N`\
  \ 或 `--no-capture` 选项不会捕获任何收到的数据包。\n\n`Nping` 有许多其他命令行选项可用。例如，你可以添加 `--debug` 来帮助你获取更多细节。你可以更改\
  \ TTL（存活时间设置）。如果你正在扫描许多主机，你可能还想添加一个超时选项，以便永远不会让 `Nping` 等待响应，即使用 `--host-timeout\
  \ 10`，其中 `10` 的单位是秒。\n\n我之前曾简要提到了伪造 IP 地址以伪造发送 IP 地址；`Nping` 还可以更进一步，通过使用类似下面的命令甚至在发送者字段中填充随机值，来攻击主机\
  \ `whitehat.chrisbinnie.tld`：\n\n```bash\n# nping --arp --sender-ip random --ttl\
  \ random whitehat.chrisbinnie.tld\n```\n\n当我第一次读到这个功能时，警钟响了。能够（成功地）使用随机值伪造 IP 地址应该会让任何系统管理员感到担忧。只需要上游路由器配置不当，允许这种类型的流量进入组织的网络。\n\
  \n最后，如果你想调整 Echo 模式（回声模式）使用通道，那么 `--channel-tcp` 或 `--channel-udp` 就可以实现：\n\n```bash\n\
  # ping  -vvv --client --channel-tcp 1234 --tcp -p 8100 localhost\n```\n\n正如你想象的那样，如果有严格的防火墙阻碍，能够调整\
  \ Echo 模式通过 TCP 和 UDP 将其“通道”数据传回给客户端，可能会成为救命稻草。\n\n## 总结\n\n如果你随着时间的推移对 `Nping`\
  \ 进行实验，你将会发现它提供的报告确实是非常详尽的。我鼓励你尽可能利用机会使用 `Nmap`，以获得更多接触。\n\n凭借其构造数据包的能力，强大的 `Nping`\
  \ 可以胜过许多竞争对手。复杂的 Echo 模式的加入意味着，如果你可以访问连接的两个端，设备逃避检测的概率就会更小。因此，故障排除应该变得更加快捷且不困难。\n\
  \n`Nmap` 强大的 `Nping` 可能仅被视为白帽工具箱中的一个工具。通过合法地使用这些工具，你将在预定任务中表现出色，并且作为一个受欢迎的收获，你将学习如何保持自己的服务器运行。\n\
  \n# 第 6 章：记录侦察行为\n\n有时，你需要额外关注谁正在连接你的服务器。例如，最近可能发生了一系列攻击，你想要密切关注，或者由于你数据的敏感性或服务的关键性，你通体变得极度偏执。\n\
  \n监控那些对你的服务器进行侦察的机器的一种相对不复杂的方法，是记录对这些机器运行 `pings` 和 `traceroutes` 的 IP 地址。你可能认为你设法收集的信息不会太大用，但它在构建“谁连接了你的服务器、频率如何以及何时连接”的画像时实际上非常重要。这就像研究访问办公室的闭路电视（CCTV）监控，过一段时间后，你会知道谁显得反常，或者谁在某一天本不该出现。日志文件非常棒，因为你可以先忘记它们，在几个月后再回来分析。\n\
  \n如果你出于某种原因需要时刻监控你的服务器，那么在我看来，正确监控系统的技巧取决于两点。首先，你需要一个在后台运行的可靠守护进程，像哨兵一样监听；它必须是可靠的，这样就不会引入竞态条件并导致你的服务器故障。其次，你需要极少量的记录，以便你可以在一年后检查日志文件并找到必要的信息，而不必担心日志会填满贵的磁盘空间并导致更多问题。显然，你也不希望攻击用攻击日志填满你的磁盘。除非你想要配置一个高容量存储系统并且此外还是详细日志的爱好者。\n\
  \n在本章中，你将探索如何记录对你机器的恶意侦察行为，以及如何应对潜在的互联网消息协议（ICMP）问题。你还将学习过去的攻击者如何利用 `ICMP` 这一友好协议，并对\
  \ `ICMP` 获得不安全声誉之前的常见攻击进行概述。\n\n\n\n\n例如，如果你想捕获 ping 包，那么当我从另一台机器 ping 我那台极其戒备的服务器时，以下命令是可以生效的：\n\
  \n```\n# /usr/sbin/tcpdump -i eth0 icmp and icmp[icmptype]=icmp-echo\n```\n\n下一个示例显示了\
  \ `tcpdump` 的 ICMP 数据包嗅探能力，它也能捕获 traceroute（跟踪路由）：\n\n```\n# /usr/sbin/tcpdump ip\
  \ proto ∖∖icmp\n```\n\n如你在下面的代码中所示，ping 同时依赖于响应和请求；然而，由于我那台戒备服务器的防火墙阻止了某些 ICMP 流量，当\
  \ traceroute 出现时，会记录 `admin prohibited`（管理员禁止）错误。\n\n```\nlistening on eth0, link-type\
  \ EN10MB (Ethernet), capture size 65535 bytes\n17:06:47.925923 IP recce.chrisbinnie.tld\
  \ > noid.chrisbinnie.tld: ICMP echo request, id 21266, seq 1, length 64\n17:06:47.925979\
  \ IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP echo reply, id 21266, seq\
  \ 1, length 64\n17:06:48.927871 IP recce.chrisbinnie.tld > noid.chrisbinnie.tld:\
  \ ICMP echo request, id 21266, seq 2, length 64\n17:06:48.927921 IP noid.chrisbinnie.tld\
  \ > recce.chrisbinnie.tld: ICMP echo reply, id 21266, seq 2, length 64\n17:06:49.928069\
  \ IP recce.chrisbinnie.tld > noid.chrisbinnie.tld: ICMP echo request, id 21266,\
  \ seq 3, length 64\n17:06:49.928136 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld:\
  \ ICMP echo reply, id 21266, seq 3, length 64\n17:06:52.215139 IP noid.chrisbinnie.tld\
  \ > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld unreachable - admin prohibited,\
  \ length 68\n17:06:52.215179 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP\
  \ host noid.chrisbinnie.tld unreachable - admin prohibited, length 68\n17:06:52.215194\
  \ IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld\
  \ unreachable - admin prohibited, length 68\n17:06:52.215210 IP noid.chrisbinnie.tld\
  \ > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld unreachable - admin prohibited,\
  \ length 68\n17:06:52.215220 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP\
  \ host noid.chrisbinnie.tld unreachable - admin prohibited, length 68\n17:06:52.215231\
  \ IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld\
  \ unreachable - admin prohibited, length 68\n```\n\n在代码段中，一台名为 `noid` 的服务器收到了来自名为\
  \ `recce` 的主机的探测。`Recce` 正在侦察以查看该服务器是否在线。\n\n## Iptables\n\n你也可以运行 `iptables` 命令，它使用了基于内核的\
  \ Netfilter 防墙：\n\n```\n# iptables -I INPUT -p icmp --icmp-type 8 -m state --state\
  \ NEW,ESTABLISHED,RELATED -j LOG --log-level=1 --log-prefix \"Pings Logged \"\n\
  ```\n\n如果你留心，可能会发现数字 8 被用作 `--icmp-type` 值。在表 6.1 中，你可以看到 ICMP 使用的代码。你可以在其请求意见（RFC）页面上找到更多信息，地址为\
  \ [`https://tools.ietf.org/html/rfc792`](https://tools.ietf.org/html/rfc792)。根据该页面，ICMP\
  \ 自 1981 年左右就一直存在了，当时的互联网还是一个完全不同的样子。\n\n#### 类型 | 代码 |\n| :--- | :--- |\n| 0 |\
  \ Echo Reply (回显响应) |\n| 3 | Destination Unreachable (目的不可达) * |\n| 4 | Source Quench\
  \ (源抑制) * |\n| 5 | Redirect (重定向) |\n| 8 | Echo Request (回显请求) |\n| B | Time Exceeded\
  \ (超时) * |\n| C | Parameter Problem (参数问题) * |\n| D | Time stamp Request (时间戳请求)\
  \ |\n| E | Time stamp Reply (时间戳响应) |\n| F | Info Request (信息请求) |\n| G | Info Reply\
  \ (信息响应) |\n| H | Address Mask Request (地址掩码请求) |\n| I | Address Mask Reply (地址掩码响应)\
  \ |\n\n表 6.1 来自内核源码 `/linux/icmp.h` 的 ICMP 代码\n\n作为对利用 ICMP 攻击的反应，Linux 内核随着时间的推移发生了变化。由于对\
  \ ICMP 的滥用，表 6.1 中带有星号标记的功能在现代内核实现中默认受到速率限制（自 Linux 2.4.10 起）。\n\n在下面的代码段中，你看到记录在\
  \ `/var/log/messages` 中的 ping 流量涉及的源和目的地址（`SRC=10.10.10.200` 和 `DST=10.10.10.10`）：\n\
  \n```\nFeb 31 17:19:34 noid.chrisbinnie.tld kernel: Pings Logged IN=eth0 OUT=00:61:24:3e:ef:00:30:16:3c:14:3b:02:10\
  \ SRC=10.10.10.200 DST=10.10.10.10 ...\n```\n\n\n\n如果你遇到了相同的问题，与其在新的配置文件中添加以下两行，不如再次导航到主配置文件（`/etc/rsyslog.conf`）中\
  \ `RULES` 下提到 `kern.*` 的那行，以避免完全使用单独的配置文件，并添加这两行：\n\n```\n:msg, contains, \"Pings\"\
  \                 /var/log/iptables-pings.log\n& ∼\n```\n\n第一行捕包含“Pings”字符串的条目，并请求\
  \ syslog 将写入文件 `/var/log/iptables-pings.log`。第二行略显特殊，它告诉 syslog 软件忽略由上一行捕获的任何条目，这样你就不会通过将相同的内容写入另一个文件而导致日志重复。当然，如果你也想记录到其他地方，可以省去第二行。\n\
  \n现在你已经能够将内容写入日志文件并过滤掉特定的 iptables 事件（根据你的喜好添加自己的标签），让我们来看其他示例。\n\n## 多部分规则\n\n\
  如果你想允许 ping 访问你的服务器，同时也允许你的服务器发送外部 ping，那么每个操作都涉及略有不同的 iptables 配置。\n\n以下网页解释了如何允许\
  \ ping 进入你服务器上的特定 IP 地址（假设你的服务器上绑定了多个 IP），以及不同的出站 ping 配置：[`www.cyberciti.biz/tips/linux-iptables-9-allow-icmp-ping.html`](http://www.cyberciti.biz/tips/linux-iptables-9-allow-icmp-ping.html)。\n\
  \n注意，入站 ping 规则中用于目的的 `-d` 表示特定的 IP 地址。\n\n## 为了取证分析记录一切\n\n如果你担心自己正遭受攻击，并想记录到你机器的所有入站连接，你可以（临时地）启用此命令：\n\
  \n```\n# iptables -I INPUT -m state --state NEW -j LOG --log-prefix \"Logged Traffic:\
  \ \"\n```\n\n请注意，你的 `/var/log/messages` 文件很快就会变得很大，因此你必须尽快通过清除规则来禁用日志。（你可以查看本节稍后的示例来了解如何操作。）你可能会预期\
  \ `iptables` 命令的输出看起来如下所示：\n\n```\nNov  11 01:11:01 ChrisLinuxHost kernel: New Connection:\
  \ IN=eth0 OUT= MAC=ff:ff:ff:ff:ff:ff:00:41:23:4f:4d:1f:08:00 SRC=10.10.10.10 DST=10.10.10.255\
  \ LEN=78 TOS=0x00 PREC=0x00 TTL=128 ID=28621 PROTO=UDP SPT=137 DPT=137 LEN=58\n\
  ```\n\n此摘录取自我现在已经巨大的 `/var/log/messages` 文件。流量似乎是由一个 Netbios 数据包生成的。如果你想跟踪出站流量，只需将\
  \ `INPUT` 替换为 `OUTPUT` 即可。\n\n此外，如果你想记录流量但对进入服务器日志的流量进行速率限制？这里有一个示例：\n\n```\n# iptables\
  \ -I INPUT -p icmp -m limit --limit 5/min -j LOG --log-prefix \"Blocked ICMP Traffic:\
  \ \" --log-level 7\n```\n\n将 `-p icmp` 改为 `-p tcp` 或 `-p udp` 并分别获取 TCP 和 UDP 数据包是非常简单的。这个示例意味着你每分钟只记录五个此类流量包。这很有用，因为通常在重复开始之前，前几次探测是提供参考信息的。\n\
  \n顺便提一下，如果你发现日志填充得太快，可以这样清除所有的 iptables 规则：\n\n```\n# iptables -F\n# iptables -X\n\
  # iptables -t nat -F\n# iptables -t nat -X\n# iptables -t mangle -F\n# iptables\
  \ -t mangle -X\n# iptables -t raw -F\n# iptables -t raw -X\n# iptables -t security\
  \ -F\n# iptables -t security -X\n# iptables -P INPUT ACCEPT\n# iptables -P FORWARD\
  \ ACCEPT\n# iptables -P OUTPUT ACCEPT\n```\n\n我的倾向是将这一系列命令放入一个脚本中（或者一个非常长的 Bash\
  \ 别名，命令之间用分号隔开），作为 root 用户，我可以在需要时输入 `flush`，以便快速、安全地移除所有正在使用的防火墙规则。\n\n## 加固\n\n\
  如果你担心系统被 ICMP 流量淹载，那么有几个相对简单的内容可以检查。这得益于 Unix 类型操作系统的强大。首先（你的系统可能已经将其设置为默认值），你可以通过在文件\
  \ `/etc/sysctl.conf` 的末尾添加以下行来忽略 ICMP 广播：\n\n```\nnet.ipv4.icmp_echo_ignore_broadcasts\
  \ = 1\n```\n\n这个 `sysctl.conf` 示例在重启后依然有效，而下面的命令将立即生效：\n\n```\n# echo \"1\" > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts\n\
  ```\n\n如果你遵循了 `sysctl.conf` 示例，接下来的命令也会立即生效（它会重新加载 `sysctl.conf` 文件中找到的所有配置设置）：\n\
  \n```\n# sysctl -p\n```\n\n\n\n如果我的理解没有错，`--limit-burst` 值指的是由 `--limit` 指定的周期。每当未达到该限制时，`--limit-burst`\
  \ 就会获得一次增量——换句话说，每当未达到限制时，就会增加一个值，直到达到配置的数值为止。\n\n## 总结\n\n你所探索的一些更改可能会对系统和网络造成破坏。在尝试在环境中应用任何这些设置之前，你应该清楚自己在做什么（理想情况下，先在测试机上进行实验）。正如提到的，因为\
  \ ICMP 的坏名声而感到恐慌，并简单地在你的网络上禁止对该协议的所有引用，这种做法是不明智的。\n\n你查看了攻击手段以及如何防止它们影响你的网络和服务器的正常运行。你还查看了对入站\
  \ ICMP 流量的速率限制。\n\n此外，你查看了 ping 和 traceroute 的日志，以检测服务器上发生的任何带有不意图的扫描；更重要的是，如何安全地将这些不需要的探测记录到文件中，以免攻击导致巨大的日志文件填满你的磁盘。\n\
  \n可以说，这些知识中的某些可能很少需要，但下一次当有人提到他们正在封锁服务器上所有的 ICMP 流量时，你可以给他们一个懂的眼神，并说你信 ICMP 问题将不再给你带来麻烦。\n\
  \n# 第 7 章\n\n## Nmap 极其强大的 NSE\n\n即使是初级系统管理员可能听说过并对本地和远程主机运行过端口扫描。他们可能也听过市场上由 Nmap\
  \ 项目创建的一个著名的端口扫描器，它被称为 Nmap。Nmap 代表“Network Mapper”（网络映射器），它不仅速度极快、精密且高效，而且功能极其丰富。\n\
  \n在它的许多功能中，你可以测试远程服务器运行的是哪种操作系统，审计本地和远程机器的安全性，并创建网络上机器及其活动服务的清单。\n\n你过去可能用过 Nmap\
  \ 进行端口扫描，但很有可能你并没有意识到它是一个多么强大的渗透测试工具。这部分归功于它复杂的内置脚本引擎。不过，在查看它之前，你将首先回顾 Nmap 的基础端口扫描功能。然后，你将学习如何将\
  \ Nmap 用于更高级的白帽活动。\n\n## 基础端口扫描\n\n即使是 Nmap 捆绑的基础（端口扫描）功能也包含了一些高级选项，例如伪造你的源 IP 地址（使用\
  \ `-S` 选项）。它提供了极其丰富的功能。但首先，让我们从安装软件包开始。\n\n在 Red Hat 衍生发行版上安装 Nmap，可以使用此命令：\n\n\
  ```bash\n## yum install nmap\n```\n\n在 Debian 及其派生发行版上，可以使用此命令：\n\n```bash\n## apt-get\
  \ install nmap\n```\n\n如果你想在 Red Hat 的衍生发行版上使用 RPM 包管理器而不是运行这些命令，你可以在 [`https://nmap.org/book/inst-linux.html`](https://nmap.org/book/inst-linux.html)\
  \ 找到更多信息。\n\n如果你熟悉 Unix 类型机器上的 `/etc/services` 文件，那么 Nmap 包含的 `/usr/share/nmap/nmap-services`\
  \ 文件应该是合情合理的的。请注意，你的文件位置可能会略有变化。在该文件中，你将端口号绑定到人类可读的服务名称——我想这有点像本地化的 DNS（类似于 `/etc/hosts`\
  \ 文件，那里通常是 `key:value` 格式）。Nmap 版本的该文件某一行看起来像这样：\n\n```\nService name   Portnum/protocol\
  \   Open-frequency   Optional comments\nftp                   21/sctp          \
  \        0.000000             # File Transfer [Control]\nftp                   21/tcp\
  \                    0.197667             # File Transfer [Control]\nftp       \
  \            21/udp                   0.004844             # File Transfer [Control]\n\
  ssh                 22/sctp                  0.000000             # Secure Shell\
  \ Login\nssh                 22/tcp                    0.182286             # Secure\
  \ Shell Login\nssh                 22/udp                   0.003905           \
  \  # Secure Shell Login\ntelnet              23/tcp                    0.221265\n\
  telnet              23/udp                   0.006211\n```\n\n这个文件非常有用，因为你可以编辑它来适应你的\
  \ Nmap 活动，而不会无意中误配置本地机器的 `/etc/services` 文件。Nmap 包含的自定义版本还比你本地文件中通常的两个字段增加了更多细节。正如示例所示，顶部有四列带有字段描述的列。\n\
  \n有些人称这为端口映射，这并不是一个糟糕的描述。如果你好奇，`open-frequency` 字段是在经过大量的在线研究（通过运行大量 Nmap 扫描）后填充的，它告诉你是研究发现该端口开启的频率。当你尝试排排除问题时，这个更全面的配置文件也可以作为一个很有用的参考。\n\
  \n那么，让 Nmap 对某台机器运行简单扫描如何？让我们对一个远程 IPv4 地址执行一次基础端口扫描。在这个示例中，你使用“-PN” 选项来跳过 ping\
  \ 测试，假设你知道该机器是线线的（注意，旧版本的 Nmap 使用 `-P0` 和 `-PN`，以防混淆，它们代表“主机发现”）：\n\n```bash\n#\
  \ nmap -PN\n```\n\n结果可能像这样：\n\n```\nNmap scan report for 123.123.123.123\nHost is\
  \ up (0.00045s).\nPort scan for 123.123.123.123 completed in 0.02 seconds\n1000\
  \ port scanned, 1 port open, filtered\n22/tcp openssh\n```\n\n### Nmap 脚本引擎\n\n\
  Nmap 拥有一非常复杂的内部组件。它将自己的脚本引擎称为 NSE。我将过一遍其广泛文档中涵盖的一些主题，并指示你何时可能需要使用它的某些功能。\n\n\n\n\
  \n\n非凡的 NSE（脚本引擎）在设计时考虑了几个关键功能。这些功能包括主要通过端口扫描进行网络发现、使用各种预定义签名进行高级服务检测、漏洞检查（以及利用），最后是后门检测。\n\
  \nNSE 的强大之处在于其多功能性，正如其名称所示，它通过提供脚本来扩展了这一功能，这些脚本可以使用任何人使用 Lua 编程语言编写。为了从命令行启动 NSE，你只需启动带有\
  \ `--script=` 选项的 `nmap` 二进制文件，或者使用 `-sC` 选项。\n\n以下是使用 `Nmap` 进行端口扫描的两个示例。第一个没有启用\
  \ NSE，第二个则开启了它。这应该对你有帮助，可以让你熟悉输出结果之间的差异。在列表 7.1 中，你可以看到第一条命令的结果。注意，这两个命令都不是以 root\
  \ 用户身份运行，而是以标准用户身份运行。\n\n然而，在列表 7.2 中，你看到 NSE 已启动，它在这里添加了极具价值的见解。\n\n在列表 7.2 中，你可以看到\
  \ NSE 的额外输入。与列表 7.1 相比，你还会收到用于进一步研究发现的 URL、更详细的主机信息（在此例中为 SSH 主机密钥），甚至关于 `Nmap`\
  \ 认为无效 HTML 的注释。\n\n## 计时模板\n\n在列表 7.1 和 7.2 中，你通过 `-p0-1024` 选项请求了有关 0 到 1,024\
  \ 范围内的端口（Unix 类型系统上的特权、原始或超级用户端口）的信息。`-T4` 选项实际上并不是四秒的超时值，而是提供了一种调用 NSE 使用的特定计时模板的方法。设置越高，`Nmap`\
  \ 运行得越快，可用值范围从 0 到 5。\n\n计时模板的值非常重要，可能会影响你的情绪状态。这些值从 0 到 5 分别代表偏执（paranoid）、狡猾（sneaky）、礼（polite）、正常（normal）、激进（aggressive）和疯狂（insane）。如果你觉得这些词更容易记忆，也可以用来代替数字。\n\
  \n由于 NSE 包含了许多设置，主程序员意识到用户可能会迷失在复杂性中，因此引入了可能有所帮助的模板。\n\n模板对使用 `Nmap` 如此重要的主要原因是，当你对大量主机、大型网络或多个网络运行\
  \ NSE 时，过程可能需要很长时间才能完成。你可能只会发现极少有趣的信息（因为防火墙配置良好），而且你的任务可能仍需要永恒的时间才能完成。\n\n你可能会问模板之间有什么区别呢？偏执和狡猾模板都提供了某种程度的规避入侵检测系统（IDS）检测的能力。礼模板通过减慢扫描过程，来限制连接两端使用的带宽以及目标机器的资源。`-T3`\
  \ 选项实际上什么都没做；因为正常模板是默认设置，并且已经是开启状态了。激进模板（你在前面的示例中配合 `-T4` 使用）将加速扫描过程，并更严谨地测试相对高容量网络的极限。最后一个模板“疯狂”，假设你愿意牺牲\
  \ NSE 提供的结果的准确性来换取执行时间。如果你想使用此设置，你应该拥有高容量且可靠的网络。\n\n## 脚本分类\n\n尽管使用了非常复杂的底层引擎，但\
  \ NSE 的设计非常周全，即使是新用户也能相对轻松地理解如何操作它。因此，可以迅速部署 NSE 而不需要过多的提前阅读。\n\n然而，为了避免操之过急，了解\
  \ NSE 如何指代它使用的不同脚本是有用的。当你通过 NSE 运行脚本时，通常会在执行之前或执行期间进行端口扫描，以检查目标机器网络可用性的当前状态。许多 NSE\
  \ 脚本之间还有其他相似之处，例如 DNS 查找和路由追踪。\n\n在表 7.1 中，你可以看到 NSE 如何对其脚本进行分类；有许多类别需要考虑。\n\n|\
  \ **类别** | **描述** |\n| :--- | :--- |\n| auth | 这些脚本查看身份验证方法并绕过它们——例如，`x11-access`、`ftp-anon`\
  \ 和 `oracle-enum-users`。brute 类别用于暴力破解而非身份验证。 |\n| broadcast | 如果需要在局域网上进行广播，请使用此脚本包。\
  \ |\n| brute | 为了破解远程主机的身份验证凭据，请使用此类脚本。针对不同协议有很多可用。 |\n| default | 如果使用 `-sC` 或\
  \ `-A` 选项，将执行默认脚本。要使用特定脚本，用 `--script=` 覆盖默认设置。 |\n| discovery | 为了跟踪谁和什么连接到了网络，这些脚本都是关于检查的，例如公共注册、启用\
  \ SNMP 的设备和目录服务。 |\n| dos | 如果你想测试漏洞或（谨慎地）运行可能导致服务崩溃的脚本，那么可以使用此集合。 |\n| exploit\
  \ | 为了尝试利用以查看是否成功，这些脚本将执行操作。 |\n| external | 注意，通过执行这些脚本，你的操作可能会被第三方记录，例如 WHOIS\
  \ 服务。 |\n| fuzzer | 这些脚本通过向查询中注入随机字段来搜索软件错误和漏洞。它们比其他技术需要更长时间。 |\n| intrusive | 归类为这一令人不悦类别的脚本运行风险很大。风险包括崩溃、带宽饱和以及被目标机器的管理员发现。\
  \ |\n| malware | 已知恶意软件会留下系统痕迹，如后门或感染迹象。使用恶意软件搜索异常端口和服务异常。 |\n| safe | 这组脚本不太冒犯目标系统的管理员。尽管如此，你不完全依赖这些脚本不会产生问题。\
  \ |\n| version | 你无法直接选择这些脚本因为它们是 NSE 版本检测功能的扩展。在使用版本检测选项 `-sV` 时它们会执行。 |\n| vuln\
  \ | 如果发现了漏洞，此集合将提醒你；否则产生的噪音很少。示例有 `realvnc-auth-bypass` 和 `afp-path-vuln`。 |\n\n\
  ## 影响因素\n\n使用默认脚本集时，你可能会对 NSE 如何做出决定感到惊讶。并没有固定的阈值；相反是在运行以下标准后得出一个分数。\n\n*   *速度*——默认扫描必须快速完成，例如不采用暴力破解。\n\
  *   *实用性*——如果脚本没有产生有用结果，那么可以忘记将其包含在默认脚本中。 |\n*   *详细程度*——运行脚本产生的输出应该是简洁的。同样，当无事可报时，沉默是美德。\
  \ |\n*   *可靠性*——在某些脚本的操作期间，不可避免会做出假设和猜测。然而，如果频繁报错，那么它不应该出现在默认类别中。 |\n\n\n\n\n\n\
  - **侵入性** —— 如果一个脚本导致武装守卫突然出现，那么它对于默认脚本集来说可能侵入性太强。\n- **隐私性** —— 与外部脚本集类似，默认脚本需要尊重你的隐私，不要泄露你的行踪。\n\
  \n## 安全漏洞\n\n既然你已经了解了 `NSE` 的众多脚本分类，并且也理解了运行默认脚本集的意义，现在，让我们利用你新学到的知识以及 Nmap 标准附带的大量脚本，来执行一些渗透测试吧。\n\
  \n首先，让我们按照如下方式在你的本地机器上运行漏洞检查：\n\n```\n# nmap --script vuln localhost\n```\n\n在列表\
  \ 7.3 中，你可以看到该命令的输出，注意你仅通过 `vuln` 选项启动了漏洞脚本。\n\n在列表 7.3 中的结果在看到 RPC 服务显示“潜在感兴趣的文件夹”（Potentially\
  \ interesting folder）时立即引起了我的兴趣。当然，可能只有我的本地机器可以查询它所指的 `/icons/` 文件夹，但也有可能这需要被调查（而且是相当紧急）。除非你了解限制\
  \ RPC 访问的配置规则，否则你可能完全屏蔽 TCP 端口 111 或关闭该服务来修复此类发现。\n\n与其寻找配置文件，我修复此问题的第一个测试是使用 `netcat`\
  \ 从另一台机器查询 TCP 端口 111，看它是否有响应。（更现代的 `ncat` 同样由 Nmap 项目编写是我的首选版本，如果不可用，可以使用 `telnet`\
  \ 命令。）\n\n顺便提一下，如果 `NSE` 识别出已知漏洞，你可能会收到一个 Windows 服务器的补丁 ID 或其他相关的 URL，以便你进一步研究。这可以节省通过在线搜索研究漏洞的时间。很有一种可能是，如果\
  \ `NSE` 标记了阳性结果，说明已经满足了若干项不同的测试以得出该结论，而且与其他某些工具不同，你不应该在不先检查的情况下就忽略它的发现。\n\n## 身份验证检查\n\
  \n考虑一下如果其他人运行 Nmap 的 `NSE` 针对我的本地机器并寻找身份验证问题，结果将会怎样。显然，我的本地机器权限较松（当与自己通信而非远程主机时），但这种测试方法仍然具有教育意义。以下命令执行的就是此类操作，并寻找\
  \ `auth` 脚本的命中：\n\n```\n# nmap --script auth localhost\n```\n\n此命令的结果揭示了 `NSE` 运行的一些测试，如你在列表\
  \ 7.4 中所示。\n\n查看列表 7.4 中端口号下方显示的的结果，你可以看到 Nmap 显然想要获取更多信息（来自不同的输入），并在期间生成了三个 ERROR\
  \ 消息。如果用户名是通过执行此类请求（例如针对 Windows 域执行请求）获取的，你可能会在输出末尾诸如“主机脚本结果”（Host script results）的部分下看到\
  \ `NSE` 发现的一些用户账户。\n\n## 发现\n\n考虑以下命令，以为你提供关于主机的更多信息：\n\n```\n# nmap --script discovery\
  \ localhost\n```\n\n在列表 7.5 中，你通过发现脚本获得了检索 HTTP 头部、SMTP 标幅和 RPC 问题等能力。尽管 SMTP 错误“Server\
  \ is an open relay (16/16 tests)”存在，但它可能是一个假阳性，但绝对值得检查以确保万无一失。\n\n有了所有包含的功能，这种模式非常有用，并代表了\
  \ `NSE` 功能的关键部分。毕竟，在不知道服务存在的情况下，你无法对其进行利用。从 `NSE` 生成的结果中可以说，在发现机器和服务方面，信息即是力量。然而，复杂的\
  \ `NSE` 不会用过多的细节轰炸你，只需足够有用即可。\n\n按类别运行脚本的负面影响是，如果你包含类别中的所有脚本，可能会稍微降低性能。但这意味着你并不依赖默认脚本集使用的评分系统，也没有执行模板类型可用的所有脚本。不过，如果你只想寻找特定类型的信息，可以更加专注。\n\
  \n## 更新脚本\n\n正如你想象的，使用 Lua 语言为 `NSE` 编写的自定义脚本经常得到改进和增强。如果你想更新 `NSE` 脚本，可以选择性地下载并将其复制到类\
  \ Unix 系统类似于路径路径的目录：\n\n```\n/usr/share/nmap/scripts\n```\n\n如果你从 `scripts` 目录中添加或删除脚本，或者更改了脚本的类别，那么之后你需要以\
  \ root 用户身份运行以下命令：\n\n```\n## nmap --script-updatedb\n```\n\n输出结果可能如下：\n\n```\n\
  Starting Nmap 5.51 ( http://nmap.org ) at 2016-11-16 11:16 GMT\nNSE: Updating rule\
  \ database.\nNSE: Script Database updated successfully.\nNmap done: 0 IP addresses\
  \ (0 hosts up) scanned in 0.14 seconds\n```\n\n要从 Nmap 网站下载脚本，你可以点击 `https://nmap.org/nsedoc/`**：正如你所猜的，这些脚本在开始时并在任何扫描之前运行。\n\
  - **主机脚本 (Host scripts)**：在标准扫描过程中（即在发现、端口扫描、版本检测和操作系统检测之后），这些脚本在目标上运行。\n- **服务脚本\
  \ (Service scripts)**：如果 `NSE` 识别出服务，它就可以针对该服务执行这些脚本。\n- **后规则脚本 (Postrule scripts)**：这些脚本在\
  \ `NSE` 完成任务后运行，它们倾向于关注...\n\n全面的 Nmap 文档（可在 `https://nmap.org/` 找到）解释了这一点：“任何脚本都可能作为预规则脚本或后规则脚本运行。在这些情况下，我们建议使用预规则以保持一致性。”\n\
  \n## 正则表达式\n\n`NSE` 熟悉的智能命令行也可以处理正则表达式（regex）。例如，我提到了 15 个 HTTP 脚本；为了在一次运行中触发所有这些脚本，你可能针对目标\
  \ Web 服务器运行如下命令：\n\n```\n# nmap --script \"http-*\"\n```\n\n你还可以如下所示做出布尔决策（正如对正则表达式预期的那样）：\n\
  \n```\n# nmap --script \"default or safe\"\n```\n\n希望这个命令易于理解。文档还展示了这个更复杂的示例：\n\n\
  ```\n# nmap --script \"(default or safe or intrusive) and not http-*\"\n```\n\n\
  在这里你可以你想启用默认、安全和侵入脚本类别，但不是处理 Web 服务器的脚本。## 图形用户界面\n\n顺便提一下，你也可以像通常一样将输出（如果很长，通常会在你的控制台上快速滚动）保存到文件，如在此示例所示，Unix\
  \ 风格：\n\n```\n nmap -sC -p0-1024 -T4 localhost > /home/chrisbinnie/output.txt\n\
  ```\n\n然而，NSE 保存输出的方法如下，输出到纯文本：\n\n```\n# nmap -T5 localhost -o outputfile.txt\n\
  ```\n\n你还可以如下所示将信息输出为 XML：\n\n\n\n\n\n```bash\nnmap -T5 localhost -oX outputfile.xml\n\
  ```\n\n## Zenmap\n\n有时，尤其是当你处理跨越不同网络的许多目标机器时，你可能需要一些帮助。想象一下，如果你能够将结果添加到数据库中，你就可以轻松地在历史扫描中搜索共同模式。\n\
  \n请看 Zenmap ([`https://nmap.org/zenmap/`](https://nmap.org/zenmap/))。作为 Nmap 的官方图形界面（GUI）扫描器，设计良好的\
  \ Zenmap 是免费的，并且适用于所有水平的用户。它包含一个命令创建器来协助编写复杂的命令，并具有通过数据库进行历史搜索的能力。你还可以为经常运行的命令创建配置文件，而无需重复输入。\n\
  \n这个非常有用的图形化跨平台工具适用于 Linux、BSD、Mac OS 和 Windows 等其他系统。\n\n另一个很棒的功能是，你可以运行 `diff`\
  \ 然后比较两次扫描的结果，以便更轻松地发现从那时到那时发生了什么。\n\n对于经常进行扫描的用户，事实上对于任何安全领域的新手来说，Zenmap 都应该应该是首选工具。所有经验水平的用户都应该发现，先使用\
  \ Zenmap 可以显著降低学习曲线。图 7.1 显示了在 Linux 桌面管理器上使用图形化 Zenmap 的预期效果。\n\n![Zenmap 工作的插图，见于\
  \ Zenmap 首页。](img/c07f001.jpg)\n\n`图 7.1` Zenmap 运行示例，可以在 Zenmap 首页（[`https://nmap.org/zenmap/`](https://nmap.org/zenmap/））找到\n\
  \n*Copyright 2015 [Insecure.Com](http://Insecure.Com) LLC*\n\n## 总结\n\n在本章中，我涉及了\
  \ Nmap 的一些基本功能，介绍并解释了 NSE 的不同脚本类别，讨论了 Nmap 可以使用的脚本类型，并探索了使用图形界面来消除重复任务初始复杂性的方法。当然，如果不再次提到\
  \ GUI 也有助于分析，将是我的疏忽。\n\nNmap 支持并鼓励你尝试数百种选项，以及白帽和黑帽场景。学习攻击者可能如何接近你的系统非常重要，但同样重要的是要谨慎且尊重地使用这些强大的工具。\n\
  \n毕竟，搞掉他人的服务器并不好玩。阻止他人搞掉你的服务器才是更大的挑战，结果是，这要更有成就感（而且完全合法法）。\n\n# 第 8 章\n\n## 恶意软件检测\n\
  \n`malware`（恶意软件）一词涵盖了大量旨在破坏计算机的不受欢迎的软件。恶意软件的部分列表例如可能包括病毒、间谍软件、特洛木马和蠕虫。此类软件的快速扩散足以让从新手到资深管理员的各个水平的用户感到担忧。恶意软件的影响范围从基本上无害的恶作剧到盗取个人信息（如银行详情）或拒绝服务。\n\
  \n尽管新闻中的恐慌主义情绪此起彼伏，但每个优秀的系统管理员都知道，没有完全安全的系统。尽管有大量针对 Windows 机器的病毒和恶意软件威胁，但所有 Unix\
  \ 类型机器的用户都应该记住，这些威胁也存在于他们的系统中。\n\n一个名为 Linux Malware Detect (LMD) 的流行高级软件包（来自 R-fx\
  \ Networks ([`https://www.rfxn.com`](https://www.rfxn.com))），有助于缓解 Linux 系统上的恶意软件威胁。让我们看看如何使用\
  \ `LMD` 软件包有效保护 Linux 机器免受恶意软件侵害，与其他稀释的解决方案不同，它专注于恶意软件。\n\n## 入门\n\n在我们开始查看 LMD\
  \ 本身之前，让我们考虑让你的恶意软件正常运行所需的某些可能不那么明显的方面。\n\n### 定义更新频率\n\n频繁执行恶意软件签名更新至关重要；事实上，如果你错过了最新更新，你的系统可能会变得脆弱。如果无法检测到当前威胁，检测软件本身的架构就几乎毫无意义。幸运的是，`LMD`\
  \ 经常从社区数据、用户提交以及活跃恶意软件威胁的防火墙数据拉取更新并生成签名。\n\n`LMD` 网站提供最新威胁的实时 RSS Feed 馈，还提供商业版本，这是保持更新及时且相关的另一个动力。这个充满\
  \ LMD 当前恶意软件发现的 Feed 可以在 [`https://www.rfxn.com/feed/`](https://www.rfxn.com/feed/)\
  \ 找到。\n\n`LMD` 表示，签名大约每天更新一次，如果报告了大量活动，更新频率会更频繁。\n\n### 恶意软件哈希注册表\n\n一个备受推崇的安全网站\
  \ Team Cymru 提供恶意软件哈希注册表（[`www.team-cymru.org/MHR.html`](http://www.team-cymru.org/MHR.html)），它提供了比较恶意软件感染的查询服务。根据\
  \ `LMD`，超过 30 家主要的杀毒软件使用这些数据来填充它们的数据库。从 `LMD` 网站，你可以看到报告的威胁数量如下：\n\n```\nDETECTED\
  \ KNOWN MALWARE: 1951\n% AV DETECT (AVG): 58\n% AV DETECT (LOW): 10\n% AV DETECT\
  \ (HIGH): 100\n```\n\n\n\n\n一种监控文件系统变化的现代方法是使用 `inotify`。你需要兼容的内核才能使此功能正常工作。不必担心，据报道\
  \ `inotify` 已包含在 2.6.13 及更高版本的内核中，因此大多数 Linux 发行版都具备这一能力。\n\n强大的 `inotify` 可以实时监控单个文件和整个目录的变化，并在发现任何变化时向配置的软件告警。如果检测到某个用户态软件正在进行更改，`inotify`\
  \ 将其视为事件并立即报告。\n\n通过创建一个监听列表，`inotify` 可以跟踪它与监听列表中的每个项关联的唯一监听描述符（watch descriptors）。尽管\
  \ `inotify` 不会传递关于更改文件或目录的用户或进程的详细信息，但发生变化这一事实已足够满足大多数应用程序的需求。如果没有 `inotify`，则通常需要采用较旧的轮询文件系统或手动运行扫描的方法。在检查网络文件系统的变化的情况下，任何配置的软件都将需要根据预定的频率对文件系统进行轮询。这是因为远程文件系统难以追踪。\n\
  \n遗憾的是，包括 `/proc`、`/sys` 和 `/dev/pts` 在内的伪文件系统对 `inotify` 是不可见的。然而，这不需要太担心，因为这些路径中不存在“真实”文件，而是频繁变化的系统瞬时运行机制。\n\
  \n## 安装\n\n现在让我们来看看如何在 Debian 和 Red Hat 衍生版上安装 LMD。首先，你将在 Red Hat 上通过以下命令检查是否安装了\
  \ `wget` 包：\n\n```\n## yum install wget\n```\n\n在 Debian 上的替代命令是以下命令：\n\n```bash\n\
  ## apt-get install wget\n```\n\n许多发行版默认包含 `wget`，因此可能不需要安装它。\n\n为了充分利用 LMD 的功能，如果你想让\
  \ LMD 直接与 `inotify` 接口交互，还可以安装 `inotify-tools`；你可以从 [`https://github.com/rvoicilas/inotify-tools/wiki](https://github.com/rvoicilas/inotify-tools/wiki)\
  \ 阅读更多信息并下载 `inotify-tools`。\n\n但是，如果你想从包管理器安装它，且运气不错正在使用 Red Hat 的后代版本，可以使用以下命令：\n\
  \n```bash\n# yum install inotify-tools\n```\n\n对于遵循 Debian 系的机器，你应该可以运行以下命令：\n\n\
  ```bash\n## apt-get install inotify-tools\n```\n\n如果这在你的 Debian 版本上不起作用，请尝试以下步骤。我知道这是有效的，因为当时我想看看在\
  \ Ubuntu 14.04 LTS 上安装 LMD 有多简单。我需要添加 Universe 仓库，以便将 `inotify-tools` 包成功安装到 `/etc/apt/sources.list`\
  \ 文件中，如下：\n\n```\ndeb http://us.archive.ubuntu.com/ubuntu trusty main universe\n\
  ```\n\n如果你正在运行其他版本，可以将“trusty”单词替换为“precise”或其他 Ubuntu 发布版本代号。然后你可以使用以下命令更新包列表：\n\
  \n```bash\n## apt-get update\n```\n\n然后，最后的 Ubuntu 命令简单如下：\n\n```bash\n## apt-get\
  \ install inotify-tools\n```\n\n我将留给你以同样的方式对 Debian 仓库进行实验（将“trusty”替换为你的 Debian\
  \ 版本名称）。\n\n由于截至本文，LMD 包本身未在包仓库中，你可以按照以下方式下载并安装该包：\n\n```\n## cd /usr/local/src/\n\
  # wget http://www.rfxn.com/downloads/maldetect-current.tar.gz\n## tar -xzf maldetect-current.tar.gz\n\
  ## cd maldetect-*\n## sh ./install.sh\n```\n\n一旦你运行了 `install.sh` 脚本（如这些命令最后一行所示），你应该看到包含以下内容的输出：\n\
  \n```\nLinux Malware Detect v1.5\n            (C) 2002-2015, R-fx Networks <proj@r-fx.org>\n\
  \            (C) 2015, Ryan MacDonald <ryan@r-fx.org>\nThis program may be freely\
  \ redistributed under the terms of the GNU GPLinstallation completed to /usr/local/maldetect\n\
  config file: /usr/local/maldetect/conf.maldet\nexec file: /usr/local/maldetect/maldet\n\
  exec link: /usr/local/sbin/maldet\nexec link: /usr/local/sbin/lmd\ncron.daily: /etc/cron.daily/maldet\n\
  maldet(6617): {sigup} performing signature update check…\nmaldet(6617): {sigup}\
  \ local signature set is version 2015112028602\nmaldet(6617): {sigup} latest signature\
  \ set already installed\n```\n\n如果你编辑了 `install.sh` 脚本（特别是 `inspath` 变量），你选择的安装路径可能会不同。正如你所看到的，你还会收到关于你的\
  \ LMD 签名更新程度的提示。\n\n## 监控模式\n\n现在你已经安装了包，让我们看看 LMD 能在系统上为你监控什么。一个很好的起点是考虑 LMD 的监控模式。\n\
  \nLMD 提供了多种模式。正如你看到的，你还会收到关于你的 LMD 签名更新程度的提示。\n\n## 配置\n\nLMD 的主配置文件是 `/usr/local/maldetect/conf.maldet。它有详细的注释，有助于了解如何设置\
  \ LMD。\n\n在继续之前，有一个警告：LMD 配置文件不使用星号作为通配符，而是使用问号。因此，你应该使用 `?` 字符代替 `*`。除了这个微小的注意事项外，其余过程都非常顺畅。\n\
  \n## 排除\n\n让我们看看如何设置 LMD。文档首先要求你考虑想要忽略的系统元素。与你刚刚看到的监控模式风格相同，有几个文件可以填充来实现这一目标。以下配置文件中的每个条目应单独占一行。\n\
  \n可以将不想让 LMD 检查的完整文件路径添加到此文件：`/usr/local/maldetect/ignore_paths`。\n\n你也可以通过在该文件中放入类似\
  \ `.jpg` 的项来全局排除特定的文件扩展：`/usr/local/maldetect/ignore_file_ext`。\n\n由于某些原因，某些 LMD\
  \ 签名可能会产生无意义的日志记录和警告。你可以通过在此文件中添加签名（如 `php.mailer.10hack`）来禁用某些签名：`/usr/local/maldetect/ignore_sigs`。\n\
  \n最后一个排除选项意味着你可以使用复杂的正则表达式（regex）一次匹配多个文件系统路径。你只需向此文件 `/usr/local/maldetect/ignore_inotify`\
  \ 添加列表，其格式如下：\n\n```\n ∧/home/premium-user-$\n```\n\n\n\n显然，通过使用正则表达式，文件匹配的可能性是无限的，它可以避免在每当有新用户允许登录你的服务器时，都手动修改配置。这个正则表达式示例希望向你说明，你可以使用类似于\
  \ `premium-user-123456` 的用户名格式来命名一组特定的用户。\n\n## 从 CLI 运行\n\nLMD 的命令行界面（CLI）选项经过了仔细考虑，并且相对容易遵循。我将留给你去探索所有的选项，但现在你将查看一些关键选项。\n\
  \n正如我已经提到的，LMD 的可执行二进制文件名为 `maldet`。让我们从在后台运行 LMD 并检查特定的文件系统路径开始。你可以从文档中的此示例看到如何使用\
  \ `-b` 参数在后台运行可能的大型扫描：\n\n```\n# maldet -b -r /home/?/public_html 7\n```\n\n在这个示例中，`-b`\
  \ 用于后台扫描并检查过去七天内已更改或修改的文件，通过追加字符 `7` 来设置时间。该命令的语法和可选运行方式为 `--scan-recent PATH DAYS`。\n\
  \n## 报告\n\n让我们快速查看 LMD 如何生成报告。图 8.4 显示了一份生成的报告。\n\n![使用 maldet —report 命令显示 LMD\
  \ 扫描报告。](img/c08f004.jpg)\n\n图 8.4 使用 `maldet --report` 命令的 LMD 扫描报告\n\n要查询特定的报告，你需要一个\
  \ SCANID。这是一个唯一的引用，可以在 图 8.4 顶部附近看到，运行此命令将为你提供最后一次运行的 LMD 命令的报告：\n\n```\n## maldet\
  \ --report\n```\n\n一旦你获得了该 ID，你还可以像下面这样手动将报告通过电子邮件给自己：\n\n```\n# maldet -e, --report\
  \ SCANID chris@binnie.tld\n```\n\n要查询名称中包含格式化时间戳的特定 SCANID（在此示例中 `010116` 为日期，名称其余部分为时间），你的命令可能看起来如下：\n\
  \n```\n# maldet --report 010116-1111.21212\n```\n\n这些选项如果与 `--log` 或 `-l` 选项一起使用也可能有用：\n\
  \n```\n# maldet --log\n```\n\n运行此命令后，你应该看到 LMD 记录的事件。在我的情况下，尽管到目前只运行了几个命令，我的日志文件中也有相当大量的详细信息。通过该命令，你将看到来自文件\
  \ `/usr/local/maldetect/logs/event_log` 的最后 50 行。如果你需要发现那 50 行中未找到的信息，可以进一步查询该文件。在我看来，LMD\
  \ 记录的详细程度是说明这是一个精良、编写良好的软件包的另一个证明。\n\n## 隔离与清理\n\n文档特别强调，默认情况下，LMD 在发现可疑文件时不会采取行动。因此，理解这一点非常重要：在大多数情况下，你需要手动隔离恶意软件。\n\
  \n如果你确定想要启用自动隔离，可以通过在主配置文件设置配置选项 `quar_hits=1` 来实现，该文件默认位于 `/usr/local/maldetect/conf.maldet`。\n\
  \n如果你想隔离特定扫描中的所有恶意软件，则可以使用 `-q` 选项，它与 `--quarantine SCANID` 相同，如下：\n\n```\n# maldet\
  \ -q 010116-1111.21212\n```\n\n如果你觉得自己犯了错误，可以使用以下命令从特定的 SCANID 恢复被隔离的文件，这与 `--restore`\
  \ 功能相同：\n\n```\n# maldet -s 010116-1111.21212\n```\n\n如果没有可恢复的内容，你将看到如下错误：\n\n```\n\
  maldet(18748): {restore} could not find a valid hit list to restore.\n```\n\n如果你想让\
  \ LMD 尝试修复它发现的恶意软件感染，可以使用 `--clean` 命令，它也写为 `-n` 选项。这是一个清理你在特定 SCANID 中发现恶意软件的示例命令：\n\
  \n```\n# maldet -n 010116-1111.21212\n```\n\n要使清理被视为成功，清理恶意软件感染后的后续扫描必须通过，且没有注册问题文件的\
  \ HIT（命中）。\n\n如果你开始怀疑结果，或者不确定你的配置更改是否已正确加载，可以使用以下命令清除所有现有会话数据、日志和临时文件：\n\n```\n\
  ## maldet -p\n```\n\n结果应该类似于此输出：\n\n```\nmaldet(19219): {glob} logs and quarantine\
  \ data cleared by user request (-p)\n```\n\n## 更新 LMD\n\n正如我从一开始所说的，更新 LMD 的签名至关重要。要手动更新，请使用\
  \ `-u` 选项。如果你的任何扫描耗时超过预期，LMD 也可以处理这种情况。终止开关 `-k` 选项（也写为 `--kill`）将停止任何运行实例。如果机器负载过高或你认为某些运行异常，那么这是一个非常有用的添加。\n\
  \n```\nmaldet(19357): {update} checking available updates…\nmaldet(19357): {update}\
  \ hashing files and checking…\nmaldet(19357): {update} latest set\n```\n\n还有一种更新已安装内容的机制：\n\
  \n```\n## maldet --update\n```\n\n`-u` 命令的预期输出可能类似于此：\n\n```\nmaldet(19278): {update}\
  \ latest set\n```\n\n## 扫描与停止扫描\n\n在 图 8.1 中，你看到了使用 `-m` 或 `--monitor` 选项监控路径的结果。让我们一下。假设你想监控两个特定的分区，因为用户在那里有写入数据。你会如下监控路径：\n\
  \n```\n## maldet -m /usr/local,/home\n```\n\n注意分隔路径的逗号。让我们考虑如何在不使用后台模式的情况下扫描目录及其子目录。假设用户通过\
  \ FTP 或 SFTP 将文件上传到上传目录：\n\n```\n## maldet -a /home/*/uploads\n```\n\n在这个示例中，你使用\
  \ LMD 扫描所有具有家目录用户的 `uploads` 目录（记住 LMD 中问号是通配符，而不是星号）。\n\n运行扫描命令后，还会获得一个供以后使用的 SCANID，你可以从它生成的数据看到：\n\
  \n```\nmaldet(28566): {scan} scan of /home/*/uploads (1 files) in progress…\nmaldet(28566):\
  \ {scan} 1111/1111 files scanned: 0 hits 0 cleaned\nmaldet(28566): {scan} scan completed\
  \ on /home/*/uploads: files 1111, malware hits 0, cleaned hits 0, time 11s\nmaldet(28566):\
  \ {scan} scan report saved, to view run: maldet --report 151212-1724.28566\n```\n\
  \n\n\nLMD 附带了一个每日 cron 任务，位置位于 `/etc/cron.daily/maldet`。该任务将更新签名并清理扫描数据（使其保留长达十四天），并使用你指定的配置运行每日扫描。\n\
  \n注意，会话数据和临时文件在每次 cron 任务执行之间是保留的。因此，如果你认为结果不准确，你需要运行我之前提到的 `-p` 选项来清除这些文件。\n\n\
  你应该设置电子邮件配置参数，以便每天早上接收每日报告。每日更新对于邮件归档而言具有重要价值，并且可以确保你的扫描每天都在进行且没有失败。\n\n## 报告恶意软件\n\
  \n你已经看到 LMD 是多么复杂且结构良好，因此，LMD 提供了一种简单的机制来上传可疑文件进行分析，这并不令人意外。如果这些文件被证明被感染了未知种类的恶意软件，则可能会创建新的签名并将其添加到\
  \ LMD 的已知威胁中，以便为其他用户识别恶意软件。将文件发送回 LMD 进行检查的方法如下，使用 `--checkout` 特性（也写作 `-c` 选项）：\n\
  \n```\n## maldet -c suspicious_file.gz\n```\n\n当你执行此命令时，你的文件将提交到 [`rfxn.com`](http://rfxn.com)\
  \ 并随后进行检查。\n\n## Apache 集成\n\n在章节前面，我简要提到了 LMD 包含的一个巧妙功能。该功能是将 LMD 与 Apache 的 `mod_security2`\
  \ 模块集成的能力。LMD 文档解释说，它使用灵活 Apache 模块的 `inspectFile` 钩子功能，允许你运行验证脚本来判断上传是否通过或失败。例如，在你的\
  \ Apache 配置文件中，可能会看到这个摘自文档的条目：\n\n```\nSecRequestBodyAccess On\nSecRule FILES_TMPNAMES\
  \ \"@inspectFile /usr/local/maldetect/hookscan.sh\" \\\n                \"id:'999999',log,auditlog,deny,severity:2,phase:2,t:none\"\
  \n```\n\n根据设计，用户每次上传文件都可以自动进行扫描，这将显著减少系统上的威胁数量，特别是当有很多用户频繁上传文件时。\n\n文档包含了关于默认选项如何考虑性能和准确性的详细信息。如果你对此功能感兴趣，我建议你查看附的\
  \ README 文件以获取更多信息。\n\n## 总结\n\n除了查看 LMD 之外，我还提到了它使用的 `inotify` 机制，用于实时检查文件系统的变化。巧妙且高效的\
  \ `inotify` 允许在不引入显著系统负载的情况下对恶意软件进行实时检查。\n\n由于 Android 手机目前占全球市场的 80%以上，毫无疑问，旨在利用这些设备漏洞编写的恶意软件在未来将更多地出现在\
  \ Linux 用户设备以及服务器上。\n\n通过在使用像 LMD 这样复杂工具的同时启用实时文件系统检查，你应该显著降低遭受恶意软件感染的风险。LMD 最初是为提供共享托管服务的服务器设计的，因为作者认为其他产品忽略了用户账户攻击向量，而这些产品通常关注于内核和\
  \ rootkit 感染。\n\n然而，在先在测试环境中尝试安装了 LMD 并熟悉了它的运行方式后，我相信 LMD 绝对值得在你的生产机器上考虑使用。\n\n\
  # 第 9 章：使用 Hashcat 破解密码\n\n最近，两个复杂的安全工具引起了我的注意。它们由于作为开源发布而受到新闻关注，显然在开发者寻找这些工具的源代码时在\
  \ GitHub 上引起了狂热。涉及的工具是 `Hashcat` 和 `oclHashcat`。`Hashcat` ([`hashcat.net/hashcat``](https://hashcat.net/hashcat))\
  \ 大胆地自称为“世界上最快的基于 CPU 的密码恢复工具”。它的近亲物 `oclHashcat` 使用你的图形处理器（GPU）通过数字计算来完成密码恢复过程，而不是\
  \ `Hashcat` 的基于 CPU 的方法。因此，基于 GPU 的 `oclHashcat` 比 Hashcat 还要快。\n\n虽然这类工具对于合法地找回丢失的密码非常有用，但也可能将它们用于不法目的。希望不说而喻，这些强大的工具应该被负责任使用。它们被法医科学家和渗透测试员使用，但如果你在其中一台机器上发现了类似工具的证据，你绝对应该引起警报。\n\
  \n让我们看看这些工具如何在密码丢失时化救局面，以及黑客将如何方法攻击你的密码。\n\n## 历史\n\n另一个用于破解密码的流行且历史悠久的安全工具被称为 `John\
  \ the Ripper`，它的起源可以追溯到多年以前。`Hashcat` 于 2009 年出现，并致力于使用多线程 CPU 密码破解。在当时，尽管其他工具开发者已开始尝试使用\
  \ CPU 的所有可用核心，但没有一个工具能够完全且在不打补丁的情况下。当开发者设计 `Hashcat` 时，利用现代 CPU 的功能并显著加速密码恢复过程是完全合逻辑的。\n\
  \n以防引起混淆，`Hashcat` 在早期版本中曾经历过几个不同的名称，例如 `atomcrack` 和 `Dr. Hash`。从 0.30 版本开始，你所熟悉的（我确信你将开始喜欢它的）名称\
  \ `Hashcat` 被应用到该软件上。\n\n## 理解密码\n\n查看密码系统如何工作可能会有所帮助。在详细介绍 Hashcat 之前，我将 Linux\
  \ 系统作为案例。\n\n## 密钥空间\n\n理解密钥空间（keyspace）的概念是非常重要的。它松地关系到密码破解工具需要花费多少努力。\n\n密钥空间简单来说就是生成特定密钥时可能使用的密钥集。美国标准与技术研究院（NIST）将密钥空间描述为“密钥（如密码）可能具有的所有值的总量”。它继续道：“密码中密钥空间的一个组件是组成密钥的‘字符集’（Character\
  \ Set）。”\n\n换句话说，在密码中你只能使用键盘上的可用字符（或当前语言区域的字符集），它们代表了密码的密钥空间。\n\n即使是单个字符，如果该字符是零到九的数字，其密钥空间也有十。\n\
  \n你可以通过增加密码长度和字符集的大小来增加密码的安全性。例如，一个具有 16 个字符且使用大小为 10 的字符集的密码，据报道其密钥空间为 10,000,000,000,000,000，这比单个字符的十密钥空间要难攻击得多。\n\
  \n这个非常有用的网站可能会鼓励增加密码安全性：[`https://howsecureismypassword.net`](https://howsecureismypassword.net)。\n\
  \n这个简单而复杂的网站使用基础术语，并讨论可能的组合而非密钥空间。如果你在输入密码后点击输入框下的 SHOW DETAILS 链接，你将看到密码有多安全。例如，在我输入一个字符密码后，出现了以下输出：\n\
  \n```\nLength 1 characters\nCharacter Combinations 10\nCalculations Per Second 4\
  \ billion\nPossible Combinations 10\n```\n\n\n\n现在是应该让你非常担心的部分。“我的密码有多安全”（How Secure\
  \ Is My Password）网站上强大的密码工具报告说，对于标准台式电脑，破解我单数字密码的时间大约只需要 0.0000000025 秒。想象一下，如果结合多块显卡的处理能力，速度会有多快。\n\
  \n相比之下，表现得聪明一点，你可以看看在下面的示例中输入一个 16 字符的密码时会发生什么。顺便说一下，我使用的是计算机的默认字符集，所以你刚刚看到的那个 10\
  \ 字符长度的字符集示例在这里并不适用。\n\n我输入的密码是大小写字母、数字和特殊字符的组合，如下所示：\n\n```\nRx951&RTdIp-\"2YT\n\
  ```\n\n在这种情况下，网站返回的破解时间就让人感到许多了：412 万亿年。正如你在下面的输出中看到的，这里包含了一些新词汇（至少对我而言）。显然，“nonillion”（十万亿）这个词在美国是指后面跟着\
  \ 30 个零的数字，而在英国则是跟着 54 个零。\n\n```\nLength 16 characters\nCharacter Combinations\
  \ 96\nCalculations Per Second 4 billion\nPossible Combinations 52 nonillion\n```\n\
  \n从这个示例中，你可以清楚地推断出，标准的 8 字符“复杂”密码比使用简单的单字符密码要好。\n\n## 哈希 (Hashes)\n\n既然我已经涵盖了复杂密码如何极大增加攻击的难度，我将继续对密码破解的讨论。不过，首先有一个最后的解释。\n\
  \n顾其名所示，`Hashcat` 处理的是密码哈希。在密码学中，创建哈希涉及将字符字符串（如密码）转换为固定数量的字符，结果类似于指纹。没有方法可以撤销或反转哈希（嗯，更准确地说，在现实中这样做真的非常、非常困难）。\n\
  \n这里有两个 MD5 示例。首先，单词“hello”的哈希是：\n\n```\n5d41402abc4b2a76b9719d911017c592\n```\n\
  \n其次，大写“Hello”的 MD5 哈希是：\n\n```\n8b1a9953c4611296a827abf8c47804d7\n```\n\n正如你所看到的，一个大写字母的改变产生了巨大的差异。\n\
  \n现在，如果你使用另一个单词，“Hello There”，你会得到：\n\n```\n32b170d923b654360f351267bf440045\n```\n\
  \n两个单词的 MD5 哈希长度与之前包含一个单词的示例相同。通过知道你的哈希总是相同长度，你就可以判断一串看似无关的字符是否符合某种标准。\n\n此外，思考一下为什么你不在\
  \ Linux 服务器上加密密码，然后在用户登录时解密系统的密码文件。答案简单来说是因为加密数据的过程是可以被反转的，而单向函数比加密密码更好。有些人读到 `/etc/shadow`\
  \ 文件实际上根本并不记得用户的密码，只是记录了密码的加盐哈希（salted-hash）版本，会感到惊讶。\n\n为什么 Linux 上 `/etc/shadow`\
  \ 密码文件中的条目看起来像这样？乍看之下像某种加密。\n\n```\nchrisbinnie:$6$TRIYWb5l$ef6Tm54qpV2nYCn6f20b7w/5nvp8zpsjacFqeTwqx7fCeW3plG2pkKsGgf1CtWzWhHOPWykFGrfPGmCde4HWY/:12231:3:32:11:32::\n\
  ```\n\n用户 `chrisbinnie` 的条目长得多，是因为 Shadow Suite 使用盐（salt）来进一步增强密码。用户在 Linux 系统输入密码后，默认会使用盐。\n\
  \n例如在 Linux 的 `crypt` 包中，这是一个从字符集中选择的双字符字符串。它们可以是我的英语字符集（a-z, A-Z, 0-9./）中的任何字符。选择盐后，用于哈希用户密码的原始算法会在\
  \ 4,096 种不同方式中的一种被“扰动”。然后将盐保存到编码后的密码中。\n\n让我们多想一下 Linux 密码。现代 Linux 系统通过 Shadow\
  \ 密码增强了你的密码安全性。以前，密码存储在 `/etc/passwd` 文件，系统上的每个用户都可以读取它。然而，只有 root 用户可以读取 `/etc/shadow`\
  \ 文件，这允许正确执行其他策略，例如密码老化。\n\n用户登录过程的工作原理如下：当有人登录机器时，会从 `/etc/shadow` 文件与其用户对应的条目读取盐。接下来，用户输入的密码将用刚刚读取的盐进行编码。此过程的结果将与\
  \ `/etc/shadow` 中保存的密码进行比对。如果它们相同，则允许用户访问。聪明而简单。\n\n攻击密码列表的一种常见方法是预先知道许多常用密码的哈希，并将它们与所有\
  \ 4,096 个可用的盐值相结合。这被称为字典攻击。\n\n有人说哈希的种类超过了十万亿。`Hashcat` 支持许多不同类型的哈希算法，如 MD5、SHA1\
  \ 和 NTLM。事实上，如果我没数错，数量极大。`Hashcat` 声称它可以破解 WordPress 和 Cisco-ASA 以及 Drupal。除了其令人深刻的算法支持外，提供的许多攻击模式包括暴力破解、字典攻击、基于规则的攻击和指纹攻击。\n\
  \n## 安装\n\n在写作时，`Hashcat` 的当前版本是 v2.00。要安装 `Hashcat`（假设你在发行版的仓库中找不到它），你可以访问网站下载二进制文件。版本\
  \ 2.00 的链接在这里：`https://hashcat.net/files/hashcat-2.00.7z`。\n\n完成后，我稍后会介绍一些工具。\n\n\
  版本 2.0 位于 `https://hashcat.net/hashcat/` 页面顶部。你应该检查该页面以确保下载的是最新版本。\n\n下载完成后，只需解压\
  \ `.7z` 文件，并确保你有权限写入提取文件的目录。如果在任何 Debian 衍生版上遇到提取困难，可以使用以下命令安装 `7za` 包：\n\n```\n\
  ## apt-get install p7zip-full\n```\n\n在 Red Hat 衍生上，可能需要添加仓库。完成后，以下命令应该对你有效：\n\n\
  ```\n## yum install p7zip p7zip-plugins\n```\n\n接下来，要使用 `x` 在保留目录名称的同时提取压缩文件，请运行\
  \ `7za` 文件：\n\n```\n## 7za x hashcat-2.00.7z\n```\n\n注意 `x` 前没有减号，这是通常的惯用法。这不是拼写错误。\n\
  \n\n\n完成这些后，你现在可以 `cd` 进入新创建的 `hashcat-2.00/` 目录，其中包含许多文件和子目录。特别感兴趣的是 `docs` 和 `examples`\
  \ 目录，你可以尽情探索它们。别担心，稍后我们将查看如何运行 Hashcat 可执行文件。\n\n顺便提一下，如果你对最新的开发版本感兴趣，在 GitHub 上有一个页面：[`https://github.com/hashcat/hashcat`](https://github.com/hashcat/hashcat)。它还包含了文档以及指向\
  \ wiki 的链接，这些应该会让你你感兴趣。\n\n如果你正在运行复杂的渗透测试套件 Kali Linux，那么由于它是内置的，你应该按照以下方式安装 Hashcat：\n\
  \n```bash\n## apt-get install hashcat\n```\n\n## 哈希值识别 (Hash Identification)\n\n\
  在使用 Hashcat 之前，有几点需要考虑。你首先需要知道你正在尝试恢复密码的哈希类型。\n\n让我们考虑一下 Linux 用户密码。使用的默认哈希算法随着时间的推移而变化，并且可能取决于发行版。过去，常见的默认值是\
  \ MD5 和 DES，但现在 SHA512 已很常见。\n\n如果你能识别出正在攻击的是什么哈希类型，对 Hashcat 有帮助。你可以运行以下命令来发现正在使用哪种哈希算法：\n\
  \n```bash\n## authconfig --test | grep hash\n```\n\n如果你担心机器的安全性，并想升级机器 Shadow 密码中使用的哈希算法，可以使用以下命令：\n\
  \n```bash\n# authconfig --passalgo=sha512 --update\n```\n\n在这个示例中，如果你愿意，可以将 `sha512`\
  \ 替换为 `sha256`。但请注意，为了使此更改生效，你需要让用户更改密码，以便将其转换为新的哈希类型。你可以使用以下命令让用户密码过期，强制用户在下次登录时更改：\n\
  \n```bash\n## chage -d 0 chrisbinnie\n```\n\n示例中的 `change age` 命令将过期日期推到了 1970 年\
  \ 1 月 1 日，这确保它始终早于系统时钟的当前设置。\n\n再次查看我的用户 chrisbinnie 的示例 `/etc/shadow` 条目：\n\n```text\n\
  chrisbinnie:$6$TRIYWb5l$ef6Tm54qpV2nYCn6f20b7w/5nvp8zpsjacFqeTwqx7fCeW3plG2pkKsGgf1CtWzWhHOPWykFGrfPGmCde4HWY/:12231:3:32:11:32::\n\
  ```\n\n你不需要运行 `authconfig` 命令就可以确定该示例条目使用的是 SHA512 哈希。你可以通过参考表 9.1](#c09.xhtml_c09-tbl-0001)\
  \ 中的代码来推断这一点。\n\n| 符号 | 哈希算法 |\n| :--- | :--- |\n| $0 | DES |\n| $1 | MD5 哈希 |\n\
  | $2 | Blowfish |\n| $2A | Eksblowfish |\n| $5 | SHA256 |\n| $6 | SHA512 |\n\n表\
  \ 9.1 如何识别哈希算法\n\n在 Shadow 密码示例中，在用户名之后的两个美元符号之间，直接有这三个字符：`$6$`。从表 9.1 中你可以看出 `/etc/shadow`\
  \ 密码使用的是 SHA512。这是一个好消息，因为它是一种强算法。\n\n密码条目的下一个部分（从 `$6$` 之后到下一个美元符号）是盐（salt）。在这种情况下，它是\
  \ `TRIYWb5l`。\n\n密码（使用盐加密）是美元符号之后到第一个冒号之前的下一部分。之后，冒号之间的其他部分为系统提供了一些相关的登录信息，例如用户密码何时过期、最后一次更改的时间等。\n\
  \n为了衡量更强的算法是什么时候开始被使用的，请考虑这一点：根据 Fedora 的说法，从 Fedora 8 开始，`glibc` 包就已支持 SHA256 和\
  \ SHA512 哈希。结果是从 Fedora 9 开始，就可以对密码使用 SHA256 和 SHA512。\n\n如果你卡住了，请查看网站 [`http://verifier.insidepro.com`](http://verifier.insidepro.com)\
  \ 来确定你想让 Hashcat 指向哪种哈希变体。我在此处使用的示例哈希上成功有限，因为这些哈希是使用另一个网站的工具生成的，所以请注意，识别未知类型的哈希算法可能需要你花费时间。\n\
  \n如果有用的话，尝试运行以下命令生成一个带盐的 MD5 密码（你需要安装 `openssl`）：\n\n```bash\n## openssl passwd\
  \ -1 -salt 123 PASSWORD\n$1$123$YPya29UI1XS9hz1d23ltx/\n```\n\n从运行该命令的结果中，注意 `$1$`\
  \ 和 `123` 相对于加密密码的位置。\n\n我有时也会运行这样的 MD5 哈希测试（不带盐）：\n\n```bash\n# echo PASSWORD |\
  \ md5sum\n5d41402abc4b2a76b9719d911017c592\n```\n\n完成这些操作后，你现在可以 `cd` 进入新创建的 `hashcat-2.00/`\
  \ 目录，其中包含许多文件和子目录。特别感兴趣的是你可以尽情探索它们。别担心，稍后我们将查看如何运行 Hashcat 可执行文件。\n\n顺便提一下，如果你对最新的开发版本感兴趣，在\
  \ GitHub 上有一个页面：[`https://github.com/hashcat/hashcat`](https://github.com/hashcat/hashcat)。它还包含了文档以及指向\
  \ wiki 的链接，这些应该会让你感兴趣。\n\n如果你正在运行复杂的渗透测试套件 Kali Linux，那么由于它是内置的，你应该按照以下方式安装 Hashcat：\n\
  \n```bash\n## apt-get install hashcat\n```\n\n## 哈希值识别 (Hash Identification)\n\n\
