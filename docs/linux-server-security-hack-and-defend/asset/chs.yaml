  \ SHA512 哈希。结果是从 Fedora 9 开始，就可以对密码使用 SHA256 和 SHA512。\n\n如果你卡住了，请查看网站 [`http://verifier.insidepro.com`](http://verifier.insidepro.com)\
  \ 来确定你想让 Hashcat 指向哪种哈希变体。我在此处使用的示例哈希上成功有限，因为这些哈希是使用另一个网站的工具生成的，所以请注意，识别未知类型的哈希算法可能需要你花费时间。\n\
  \n如果有用的话，尝试运行以下命令生成一个带盐的 MD5 密码（你需要安装 `openssl`）：\n\n```bash\n## openssl passwd\
  \ -1 -salt 123 PASSWORD\n$1$123$YPya29UI1XS9hz1d23ltx/\n```\n\n从运行该命令的结果中，注意 `$1$`\
  \ 和 `123` 相对于加密密码的位置。\n\n我有时也会运行这样的 MD5 哈希测试（不带盐）：\n\n```bash\n# echo PASSWORD |\
  \ md5sum\n5d41402abc4b2a76b9719d911017c592\n```\n\n\n\n\n```\ncharsets/  hashcat-cli32.exe\
  \  hashcat-cliXOP.bin  tables/  hashcat-cli64.app  hashcat-cliXOP.exe\ndocs/  hashcat-cli64.bin\
  \  rules/  hashcat-cli32.bin  examples/  hashcat-cli64.exe  salts/\n```\n\n从我的目录列表中可以看出，有很多不同类型的可执行文件。\n\
  \n对于你的需求，任何以 `.bin` 结尾的文件都足够。如果由于某种原因你的 `.bin` 文件无法立即执行，那么像往常一样，你可以输入 `chmod +x\
  \ <executable>` 来修复。我将使用名为 `hashcat-cli64.bin` 的 64 位命令行界面版本，这与我机器的能力相匹配。\n\n显然，该目录下显示的不同\
  \ Hashcat 可执行文件适用于你机器处理器可能提供的各种特性。你感兴趣的另一个相关的 `.bin` 文件，名称中带有 XOP，代表扩展操作（eXtended\
  \ OPerations）指令。如果你以后想更深入地使用 Hashcat，可以研究一下你的处理器标志位，并选择哪个可执行文件可以充分利用你的特定系统。例如，根据论坛介绍，AMD\
  \ 处理器芯片适用于 XOP 版本。\n\n现在让我们运行你的 Hashcat 可执行文件。`hashcat` 命令的语法如下：\n\n```\n## hashcat\
  \ [options] hashfile [mask|wordfiles|directories]\n```\n\n下载（或生成）你的字典列表并将其保存为文件名\
  \ `wordlist.txt` 后，就可以继续了。在输入命令 `cd examples/` 进入 `examples` 子目录后，考虑这个示例命令：\n\n\
  ```\n## ./hashcat-cli64.bin -m0 -a0 A0.M0.hash A0.M0.word\n```\n\n`-m` 选项意味着你指定了\
  \ MD5 哈希，`-a 0` 选项意味着你想让 Hashcat 执行字典攻击（也称为直击攻击）。作为参考，如果你指定了 `-m1800`，那么你指的是你首选的现代\
  \ Unix 哈希算法 `SHA512`。\n\n正如你可能猜到的，`examples` 目录下的 `A0.M0.hash` 文件是你的哈希列表。这些哈希经过了精简，没有在前面添加\
  \ `<username>:` 盐值部分，也没有在后面附加密码过期信息（包括后面的冒号）。这就是你应该收集哈希的方式。\n\n`A0.M0.word` 文件是你作为字典列表的潜在密码字典。\n\
  \n顺便提一下，如果你想将结果直接输出到文件而不是屏幕，可以简单地添加 `-o <filename>`；当你发现某个哈希的密码后，想从满是哈希的文件中删除该行，可以添加\
  \ `--remove`。\n\n运行 `hashcat` 命令的结果如下（采用高度简略的形式）：\n\n```\n651e96f9b94e1a3a117eade5e226bd1e:y[N\"\
  %e?U{<k[‘x<TlG U6Z\n465133fae5a994afb03c7158260b2e8d:kCQArZz)It\nAll hashes have\
  \ been recovered\nInput.Mode: Dict (A0.M0.word)\nIndex…..: 1/1 (segment), 102 (words),\
  \ 2769 (bytes)\nRecovered.: 102/102 hashes, 1/1 salts\nSpeed/sec.: - plains, 102\
  \ words\nProgress..: 102/102 (100.00%)\nRunning…: 00:00:00:01\nEstimated.: --:--:--:--\n\
  ```\n\n前两行包含冒号之前的哈希，冒号之后是发现的密码。输出的其余部分显示你的整个文件处理成功。\n\n一旦你掌握了这些示例，尝试对自己的 `/etc/shadow`\
  \ 哈希进行操作。如果你运气好，在运行调整后的命令后，你应该看到一个或多个哈希以及其对应的明文密码。如果破解命中率不够，就不断实验直到你对结果满意。要让一切按预期运行可能需要一些尝试；我建议先熟悉这些全面的示例。如果你遇到困难，请宽宽，因为并不是所有密码都能在瞬间被破解的。\n\
  \n尽管如此，一旦你理解了理论并尝试了使用其基本功能，Hashcat 的操作非常简单。从 Linux 系统管理员的角度来看，这应该是你关注的，因此你应该注意你的服务器所使用的哈希算法。\n\
  \n还有许多选项留给你自己探索。例如，在示例命令旁运行规则的选项简单就是 `-r rules/specific_rule.rule`。\n\n我承诺过你会查看一些相应的哈希值和攻击模式。哈希的数量太多，无法列出，但\
  \ Hashcat 网站提供了它们以及有用的细节，地址为 [`http://hashcat.net/wiki/doku.php?id=example_hashes`](http://hashcat.net/wiki/doku.php?id=example_hashes)。\n\
  \n你可以使用的某些攻击模式（其中 0 被称为“直击”，换句话说，与字典或单词列表匹配）如表 9 所示。\n\n| 数字 | 攻击模式 |\n| :--- |\
  \ :--- |\n| 0 | 直击 (Straight) |\n| 1 | 组合 (Combination) |\n| 3 | 暴力破解 (Mask force)\
  \ |\n| 6 | 混合 (Hybrid) |\n\n## Hashcat 攻击模式与数字\n\n暴力破解和字典攻击的主要区别在于暴力破解需要搜索整个空间。而字典攻击的范围是有限的。在\
  \ Hashcat 的详细在线文档中，提到暴力破解是一种较老的方法。Hashcat 现在将暴力破解包含在掩模式中。\n\n掩攻击的主要原理是缩小空间大小，从而加快运行速度。文档提供的一个巧妙例子是，通过\
  \ Hashcat 的创新技术，你可以将密码 `Julia1984` 的破解时间大约四年缩短到惊人的四十分。\n\n文档大胆地声称，用掩攻击代替暴力破解没有缺点。你通过在标准命令后添加掩码来运行掩攻击，如下：\n\
  \n```\n# hashcat -m 1800 -a 0 -o discovered_passwords.txt --remove hashes.txt wordlist.txt\
  \ -1 ?dabcdef\n```\n\n此处添加 `-1 ?dabcdef` 请求 Hashcat 遍历 `0123456789abcdef`。\n\n根据文档，此掩码\
  \ `-1 ?l?d?s?u` 提供了完整的 ASCII 字符集。Hashcat 有许多内置字符集选项，例如 `?l`（代表 a 到 z 的所有小写字母）和 `?u`（代表\
  \ A 到 Z 的所有大写字母）。\n\n你可以在此处找到更多关于掩攻击的详细信息：[`https://hashcat.net/wiki/doku.php?id=mask_attack`](https://hashcat.net/wiki/doku.php?id=mask_attack)。\n\
  \n## oclHashcat\n\n使用 oclHashcat 和 Hashcat 需要相似的知识水平，因为它们的操作方式几乎相同。尽管它们之间存在差异——例如\
  \ oclHashcat 加载字典的方式不同于 Hashcat，但如果你切换到使用 oclHashcat，可以预期学习曲线非常平缓。\n\n\n\n\n此外，正如我已经提到的，必要的密码破解计算使用了你系统中完全不同的组件。简单来说，`oclHashcat`\
  \ 使用的是显卡而非 CPU。这里有两个重要的软件版本需要区分，每种都适用于两种流行的 GPU：\n\n- `cudaHashcat`，用于 Nvidia（英伟达）显卡\n\
  - `oclHashcat`，适用于 AMD 显卡\n\n（在设置正确的情况下）GPU 的速度比 CPU 快得多，因为它们专门设计用于快速地进行数字运算，通常是为了处理图形。虽然\
  \ GPU 本身显然是为了速度而设计的，但在性能方面，CPU 可能会被其额外的、包含性的功能集分散注意力，导致吞吐量降低。因此，GPU 是计算海量数据的良好选择，因为它们可以得到更好的优化。还可以通过将它们串联成链来几乎无缝地扩展\
  \ GPU 的输出，从而更容易地利用它们的组合力量。为了让你直观地了解 GPU 的速度有多快，如果你使用彩虹表（rainbow tables）并划分密钥空间（美国键盘上提供的\
  \ 95 个字符），你每秒可能会进行 10 万亿明文测试！\n\n在学习 Hashcat 和 `oclHashcat` 方面，我建议先让 Hashcat 运行，然后阅读如何让你的显卡\
  \ GPU 驱动程序工作。在 `http://hashcat.net/oclHashcat/` 上有更多信息。\n\n如果引起困惑，`oclHashcat-plus`\
  \ 已不再使用并被认为已弃用。因此，“plus”版本没有任何意义。\n\n## Hashcat-Utils\n\nHashcat 套件中另一个值得提的额外组件是一组名为\
  \ `Hashcat-utils` 的工具集。这组实用工具可以从 `http://hashcat.net/wiki/doku.php?id=hashcat_utils`\
  \ 下载。\n\n这些工具包括 `combinator`，它是一个独立的程序，你可以通过它运行组合攻击（combinator attacks）。你可以在 `https://hashcat.net/wiki/doku.php?id=combinator_attack`\
  \ 找到更多信息。\n\n你还可以使用 `cutb` 工具对字典文件进行修剪和切割，你可以用它来清理字典文件中常见的、不想要的前缀或后缀字符。\n\n包中的另一个工具\
  \ `rli` 类似于 Unix 类型的命令，它在比较一个文件与其他一个或多个文件后，简单地删除重复文件。\n\n进一步探索这些工具以增加你对 Hashcat\
  \ 工作原理的了解绝对值得。\n\n## 总结\n\n在本章中，你查看了密码攻击背后的一些理论。我还涵盖了字符集包含的组合数量的重要性、密码长度，以及它们的组合如何影响密钥空间。最后，我描述了哈希（hashing）和加盐（salting），这些确保了破解密码的时间显著增加。\n\
  \n能够高效地破解密码需要多年的学习才能掌握，这确实是一个多层面的领域。然而，资深的 Hashcat 可以帮助你轻松完成学习过程。它还有一个详尽的常见问题解答（FAQ），可以在\
  \ `http://hashcat.net/wiki/doku.php?id=frequently_asked_questions` 找到。\n\n现在你已经看到了攻击者将用来破解你密码的方法，以及你可以增加他们工作难度的方法，如果你在自己的机器上发现了我讨论过的任何工具的痕迹，应该要加注意。有了你新获得的力量，希望不需要我再提醒你要负责任地使用你的技能。\n\
  \n# 第 10 节：SQL 注入攻击\n\n最流行的在线攻击类型之一被称为 SQL 注入，有时缩写为 `SQLi`。这些攻击涉及使用结构化查询语言 (`SQL`)\
  \ 插入数据库代码，攻击者可以从数据库中检索数据或覆盖现有数据。\n\n你可能会惊讶地发现，根据 OWASP（开放 Web 应用安全项目， latter 一个促进软件安全的慈善组织），`SQLi`\
  \ 是 2013 年在线服务的首要威胁，并列为 `https://www.owasp.org/index.php/Top_10_2013-Top_10` 中最常见的威胁。\n\
  \n本章将介绍这些攻击涉及的内容、如何保护你的网站免受此类攻击，最后介绍为了渗透测试的目的，你自己如何发起这些攻击。\n\n不说说，这是一个宽泛且复杂的领域，需要一定的背景知识来执行更复杂的攻击。然而，你可能会惊讶地发现，仅仅通过运行极少数命令并仅凭一点数据库知识，就能让一个脆弱的在线服务瘫痪。仅就此而言，IT\
  \ 专业人员意识到 SQL 注入带来的风险以及如何减轻其影响是至关重要的。\n\n## 历史\n\n考虑到其简单性，`SQLi` 如此有效这一事实使其成为一种可怕的攻击类型。\n\
  \n初级开发者们请注意，因为涉及到安全问题时，系统管理员往往不对此类攻击的发生负直接责任。这是因为很多时候，漏洞的产生是因为代码没有正确地转义特殊字符。除了简单性之外，另一个担忧的原因是，据报道，这种攻击自\
  \ 1998 年起就为人知。当年 12 月出版的一期《Phrack 杂志》首次宣布了一种针对网站的广泛漏洞。随着时间的推移，恐怖局面开始展开，变得显而易见，几个自动化工具可以用来扫描网页寻找站点，然后对其进行篡改或窃取数据。\n\
  \n然而，情况并未止于此。随着网络钓鱼攻击变得流行（攻击者欺骗用户泄露自己的信息），狡猾的攻击者通过注入必要的代码来重新标记网站，以说服访问者他们访问的是合法的网站。\n\
  \n\n\n\n关于如何保护你的代码的完整教程可以留到以后再说。不过，我将使用一种流行的编程语言，为你进行一次快速的回习。在此之前，我将提醒你一些 SQL 注入（SQLi）运行的简单原理。\n\
  \n正如我所说的，仅仅篡改网站界面远非拦截的 SQL 语句可能造成的唯一伤害。例如，考虑这个 SQL 语句：\n\n```sql\nsql-server> DROP\
  \ TABLE special-offers;\n```\n\n通过获取表名，你可以完全从数据库中删除一个表。除了破坏性行为之外，我还没有提到过从数据库中提取用户名和密码。如果带有犯罪意图，成功的\
  \ SQL 攻击无疑是值得追求的奖赏。一些大型品牌已沦为程序编写不当代码和 SQL 注入的受害者。据报道，Yahoo、Adobe、LinkedIn 和 Sony\
  \ Music 可能都在一个长长的受害者名单上。当然，由于我既不是攻击者之一，也不是负责恢复受此类攻击影响的服务人员，我只能推测这些攻击在多大程度上涉及 SQL\
  \ 注入。在 `http://codecurmudgeon.com/wp/sql-injection-hall-of-shame/` 可以找到 SQL 注入耻辱柱。虽然该列表可能不完全准确，但我相信你会同意这是一个引人入胜的读物。\n\
  \n刚才我提到了一种编程语言。我将使用据报道世界上最流行的服务器端脚本语言 `PHP` 作为示例，快速演示 SQL 注入是如何运作的。强大的 `PHP` 不仅直接用于数百万个网站，还被用于世界上最流行的内容管理系统（CMS）WordPress（`https://wordpress.com`）以及许多其他动态网站应用，如\
  \ Joomla!（`https://www.joomla.org`）。简而言之，`PHP` 遍布网络，如果发现了漏洞，它将是攻击者的容易目标。\n\n让我们来看另一个例子，这次是使用\
  \ `PHP` 的：\n\n```php\n$input = $variable[3];\n$dbquery = \"SELECT id, item, price\
  \ FROM specialoffers ORDER BY id LIMIT 15 OFFSET $input;\";\n```\n\n看第一行，你可以看到你没有过滤名为\
  \ `$input` 的变量。这意味着当该变量在第二行的 SQL 语句中使用时，它可能包含包含攻击者想要使用的任何代码。通过注入精心构造的代码，可以造成各种混乱。\n\
  \n另一个例子是更新 sysop 用户的密码。例如，`PHP` 代码中一个普通的 SQL 语句可能像这样：\n\n```php\n$dbquery = \"UPDATE\
  \ credentials SET passwd='$password' WHERE userid='$id';\";\n```\n\n通过向此语句中附加 SQL，例如\
  \ `or userid like '%sysop%'`，你的 SQL 变得不那么严格了，你要求数据库快速搜索类似于 `sysop` 的其他特权用户名（例如 `sysops`），然后也更新它们的密码。\n\
  \n令人担忧的是，还可以执行包含在 SQL 中的 shell 命令。某些数据库服务器允许通过这种方法访问操作系统命令。\n\n## 在 PHP 中缓解 SQL\
  \ 注入\n\n正如我所说的，这个领域太大，无法进行详细介绍，但如果我不简要查看如何过滤 SQL 输入以帮助缓解 SQL 注入攻击，将是我的失职。许多 `PHP`\
  \ 函数可以协助你完成这一任务。截至本文写作，`PHP` 正在从当前版本 `5.6.16` 大跨到 `7.0.0` 版本（尽管版本号可能会继续增加）。\n\n\
  一个注意事项是，在旧版本（直到 `5.3.0`）中，在你的主 `PHP` 配置文件（`php.ini`）内部，可以通过 `magic_quotes_gpc` 通过\
  \ `PHP` 过滤（或转义）所有输入数据。这显然被废弃了，因为它被过度依赖了，并且并不总是以意味着应用程序安全的方式转义字符。本质上，魔法引号（magic quotes）并不是为了安全目的而设计的，但被这样使用了。\n\
  \n为了保护第一个 SQL 示例中变量，你可能希望通过 `stripslashes` 函数处理你的用户输入。示例看起来如下：\n\n```php\n$input\
  \ = $variable[3];\n```\n\n使用 `stripslashes` 后，它可能像这样：\n\n```php\n$input = stripslashes($variable[3]);\n\
  ```\n\n正如你猜的那样，这意味着你正在移除斜杠以帮助防止意外的输入。还有 `trim` 用于移除变量中的空格，可以同样的方式使用，以及 `strip_tags`\
  \ 用于移除 HTML 和其他标记标签。这些都可以有用，并且为了方便可以链式调用，如下：\n\n```php\n$input = stripslashes((trim($input));\n\
  ```\n\n此外，在 `PHP` 版本 `5.5.0` 之前，你可以使用 `mysql_real_escape_string` 函数如下所示清理单个字符串：\n\
  \n```php\n$input = mysql_real_escape_string($input);\n```\n\n然而，从 `7.0.0` 版本及以上版本，你几乎总是想要使用一个名为\
  \ `MySQLi`（代表 MySQL improved）的改进驱动程序来对抗 SQLi。得益于这种增强，你可以采用更高级的方法从执行的代码中剔不必要的且潜在危险的字符。使用\
  \ `mysqli` 的示例与之前的示例没有太大区别：\n\n```php\n$input= mysqli_real_escape_string($input);\n\
  ```\n\n使用 `MySQLi`，你使用不同的方法连接到数据库，如下：\n\n```php\n$mysqli = new mysqli(\"localhost\"\
  , \"userid\", \"passwd\");\n```\n\n\n\n\n\n`sqlmap` 的广泛兼容性足以让大多数勤奋的系统管理员感到担忧。根据其网站，`sqlmap`\
  \ 支持以下数据库服务器：MySQL、Oracle、PostgreSQL、Microsoft SQL Server、Microsoft Access、IBM DB2、SQLite、Firebird、Sybase、SAP\
  \ MaxDB 和 HSQLDB。\n\n让我们来看看如何安装 `sqlmap`。它包含在 `Kali Linux` 等某些基于安全性的发行版中，但如果它不在你的包管理器仓库中，你还有其他方法可以安装它。\n\
  \n你可以通过 Git `clone` 命令使用 GitHub 上的 `sqlmap` 仓库：\n\n```\n## git clone https://github.com/sqlmapproject/sqlmap.git\
  \ sqlmap-dev\n```\n\n你也可以从 [`https://github.com/sqlmapproject/sqlmap/zipball/master`](https://github.com/sqlmapproject/sqlmap/zipball/master)\
  \ 获取 Zip 文件。\n\n你也可以从 [`https://github.com/sqlmapproject/sqlmap/tarball/master`](https://github.com/sqlmapproject/sqlmap/tarball/master)\
  \ 下载 tarball 包。\n\n一旦你按照安装说明进行操作，你就应该能够进入运行以下命令的阶段（在运行完之前的 Git 命令后，你只需要执行此操作即可）：\n\
  \n```\n## cd sqlmap-dev\n## python ./sqlmap.py -h\n```\n\n此命令将为你提供一个选项列表。\n\n##\
  \ 启动攻击\n\n现在让我们来看看 `sqlmap` 功能的核心，即攻破远程机器。\n\n但请注意，测试你的 `sqlmap` 技能中一个耗时的方面可能涉及设置你自己的易漏洞测试服务器，或者合法地识别易受攻击的网站。你可能会对此此感到惊讶，因为\
  \ URL 的构造方式，Google 可以很容易地识别出易漏洞站点。不言而喻，我不建议攻击你通过 Google 或任何其他方法发现的任何网站。然而，为了发现可能被利用的\
  \ URL，你可以输入诸如 `inurl:website.php?id=` 或 `inurl:product.php?id=` 的查询。第一个搜索词返回了令人担忧的\
  \ 170 万条结果。\n\n通过 Google 不恰当暴露其漏洞的网站和其他在线资源获得了一个绰号，“Googledorks”。有一个网站列出了其中一些站点；值得快速查看一眼，可以在\
  \ [`www.hackersforcharity.org/ghdb/`](http://www.hackersforcharity.org/ghdb/) 找到。列表包含了许多潜在的秘密登录页面、敏感目录以及提到用户名的文件。请负责任地这些信息。\n\
  \n顺便提一下，你可以通过 `Python` 运行 `sqlmap`，这意味着你需要在机器上安装某种类型的实现版本。\n\n在 图 10.1 中，你可以看到开发者热于远离非法活动。这种强大的工具总是会被滥用。\n\
  \n让我们继续。看下面的示例，使用 `sqlmap` 命令所需的语法非常简单：\n\n```\n## python sqlmap.py -u http://www.a-vulnerable-website.com/product.php?id=1111\n\
  ```\n\n![描述了 qlmap 启动时样子的插图](img/c10f001.jpg)\n\n**图 10.1** 启动 sqlmap 时的界面，包含免责声明\n\
  \n如果你在使用低速连接或遇到远程数据库服务器响应缓慢的情况，那么你可以在该命令后添加 `--time-sec 10` 以引入更真实的超时设置。虽然有些反直觉，但这实际上可以加快整个过程。\n\
  \n现在让我们有条不紊地逐步执行几个简单的命令。一旦你熟悉了使用 `sqlmap`，你可以将这些所有都链在一起。\n\n我的 sqlmap 示例命令包含了 `-u`\
  \ 选项，这意味着声明了一个 URL。该命令将通过许多 SQL 注入测试检查末尾参数（`id=1111`）的漏洞。从那里开始，`sqlmap` 通常可以检测 Web\
  \ 服务器厂商和版本、远程操作系统以及正在使用的数据库服务器版本。\n\n如果你现在想学习该网站正在使用的数据库名称怎么办？你可以通过以下方式添加 `--dbs`\
  \ 选项：\n\n```\n## python sqlmap.py -u \"http://www.a-vulnerable-website.com/product.php?id=1111\"\
  \ --dbs\n```\n\n在获取了这些有用信息后，你的下一步是发现正在使用的表名。你可以按照如下操作，将你的真实数据库名称替换为 `<database-name>`\
  \ 条目：\n\n```\n## python sqlmap.py -u \"http://www.a-vulnerable-website.com/product.php?id=1111\"\
  \ --tables -D <database-name>\n```\n\n下一个逻辑步骤是学习感兴趣的数据库表所使用的列。命令如下，再次将你的数据库名称替换为\
  \ `<database-name>` 条目，并将 `<table-name>` 替换为你的表名：\n\n```\n## python sqlmap.py -u\
  \ \"http://www.a-vulnerable-website.com/product.php?id=1111\" --columns -D <database-name>\
  \ -T <table-name>\n```\n\n该过程的最后部分是从目标中提取所有数据。这可能包括用户名和密码、个人信息，或仅是产品信息。要转储数据库，如所示引入\
  \ `--dump` 选项：\n\n```\n# python sqlmap.py -u http://www.a-vulnerable-website.com/product.php?id=1111\"\
  \ --dump -D <database-name> -T <table-name\n```\n\n等等，让我重新对齐流程。你的最后一个命令可能会产生类似这样的输出：\n\
  \n```\n+-------+----------------+----------+----------+------------+--------------+\n\
  | id    | title          | color    | price    | category  | received-date|\n+-------+----------------+----------+----------+------------+--------------+\n\
  | 1111  | bars of soap   | green    | 1.22     | toiletries | 11.11.22     |\n+-------+----------------+----------+----------+------------+--------------+\n\
  ```\n\n如果你只想提取特定的列，那么你可以直接指定它们。一旦知道了列名，你可以使用如 `-C columnX,columnY` 的选项列出它们。这样做之后，只需移除\
  \ `--columns` 选项：\n\n```\n## python sqlmap.py -u \"http://www.a-vulnerable-website.com/product.php?id=1111\"\
  \ -C columnX,columnY -D <database-name> -T <table-name>\n```\n\n强大且复杂的 `sqlmap`\
  \ 工具提供了大量的选项列表，在书中无法进行详细介绍。我建议阅读 GitHub 页面，它提供了关于使用 `sqlmap` 的更多详细信息。可以在 [`https://github.com/sqlmapproject/sqlmap/wiki/Usage`](https://github.com/sqlmapproject/sqlmap/wiki/Usage)\
  \ 找到。\n\n## 合法尝试 SQLi\n\n可能有很多实用的网站允许你运行扫描，以确认你正确配置了渗透测试工具。你可能想要测试你新学的 SQLi 技能的这样一个站点名为\
  \ `Web Scan Test`。通过此子目录可以 SQL 注入：[`www.webscantest.com/datastore`](http://www.webscantest.com/datastore)。然而，在继续之前，我会阅读该网站的条款，以确保你没有犯罪。\n\
  \n\n\n\n\nCodebashing 网站上的一个在线演示可能也会让你感兴趣。他们将自己巧妙且具有交互性的网站描述为“由程序员为程序员提供的应用程序安全培训”。该演示展示了特殊字符如何对登录过程产生巨大影响，并带你了解当你更改输入内容时，底层数据库服务器是如何反应的。你可以在\
  \ [`www.codebashing.com/sql_demo`](http://www.codebashing.com/sql_demo) 找到该演示。\n\
  \n## 总结\n\n在本章中，我涵盖了 SQL 注入背后的基础知识，并简要回顾了 SQL 攻击的历史。此外，你还看到了 `PHP` 开发人员如何建议防御与 `MySQL`\
  \ 相关的 SQLi 攻击，包括过去针对旧版本的建议，以及特别是针对 `7.0.0` 之后新版本的未来建议。\n\n很容易看出为什么 SQLi 攻击如此常见——事实上，在某些领域，它被认为是最流行的攻击类型。通过使用几个相对简单的\
  \ `sqlmap` 命令，你已经掌握了潜在突破网站安全防护的力量，并查询和窃取其宝贵数据，最后通过破坏性行为进一步损害其声誉。\n\n对于防御此类攻击的技术人员来说，意识到这些攻击是多么简单，并理解这些看似简单的错误所产生的影响至关重要。这些错误可能会让网站（这可能花费了大量精力和资源来构建）遭受毁灭性的攻击，导致恢复成本高昂。再次强调，请负责任地使用这些技能。妥善保护你自己的基础设施比攻击他人的基础设施要满足得多。\n\
