  ## 前言\n\n毫无疑问，有效保护系统和网络所需的知识需要不断更新。然而，并非所有技术人员都想成为全职安全人员；相反，他们更倾向于关注其他领域，尽管他们的职位需要许多此类技能。\n\
  \n\n\n\n\n似乎每隔几天新闻就会报道另一起轰动世俗的攻击事件，让该领域的工作人员庆幸自己的客户不是攻击目标。随着我们对响应式连接和优质软件的依赖日益增长，成功攻破在线服务所带来的回报也随之增加。\n\
  \n### 系统与网络威胁简介\n\n本书的意图是对系统和网络威胁提供广泛的概述。我的目标不是关注网络安全的某个特定方面，而是为了检查许多不同的领域，为你（即读者）提供足够的知识，以便你能够更深入地研究你感兴趣的内容。\n\
  \n书中的每一章都探索了我在作为互联网用户的旅程中发现的有趣安全方面，令人担忧的是，这段旅程已经跨越了近二十年。\n\n### 保护在线服务与理解攻击者战术\n\
  \n书中主题的多样性有望能帮助你保护自己的在线服务，并为你提供实验黑客所使用的常用工具的机会。这旨在造福每一个人，帮助技术专业人员更好地理解攻击者将如何识别并尝试利用系统或网络的漏洞。\n\
