  \n在下面的示例中，`Operation timed out`（操作超时）是由虚拟机未启用网卡导致的。\n\n### 链接\n\n*   [网络调试与故障排除指南](https://docs.ansible.com/ansible/latest/network/user_guide/network_debug_troubleshooting.html)\n\
  \n### 演示\n\n讲解 Ansible 故障排除的最佳方法是进入现场演示，向你直观地展示连接错误以及如何解决它！\n\n#### 错误\n\nAnsible\
  \ 依赖于与目标机器的 `SSH` 连接。让我们尝试手动操作：\n\n```\n1 $ ssh username@hostname\n2 Failed to connect\
  \ to the host via ssh: ssh: connecto to h\\\n3 ost hostname port 22: Operation timed\
  \ out\n```\n\n你能够验证源机器和目标机器之间的网络连接。\n\n#### 修复\n\n一旦网络连接修复，你就可以成功连接到目标机器。\n\n```\n\
  1 $ ssh username@hostname\n2 username@hostname:~$ \n\n```\n\n## Ansible 故障排除 - 缩进错误\n\
  \n缩进错误是 Ansible 最常见的问题之一。在现场演示中，我们将从错误消息开始进行排错。我们将调查问题的根源并修复它。\n\n### 演示\n\n讲解 Ansible\
  \ 故障排除的最佳方法是进入现场演示，向你直观地展示该错误以及如何解决它！\n\n#### 错误\n\n```\n 1 ---\n 2 - name: blockinfile\
  \ module demo\n 3   hosts: all\n 4   become: true\n 5   tasks:\n 6 - name: Generate\
  \ /etc/hosts file\n 7   ansible.builtin.blockinfile:\n 8     state: present\n 9\
  \     dest: /etc/hosts\n10     content: |\n11       192.168.0.200 demo demo.example.com\n\
  ```\n\n#### 修复\n\n```\n 1 ---\n 2 - name: blockinfile module demo\n 3   hosts: all\n\
  \ 4   become: true\n 5   tasks:\n 6   - name: Generate /etc/hosts file\n 7     \
  \  ansible.builtin.blockinfile:\n 8         state: present\n 9         dest: /etc/hosts\n\
  10         content: |\n11           192.168.0.200 demo demo.example.com\n```\n\n\
  ## Ansible 故障排除 - 语法错误\n\n让我们一起排查 Ansible 致命错误“Syntax Error while loading YAML”，以找到\
  \ playbook 代码中的问题行、确定根源、修复缺失的引号，并验证解决方案是否有效。\n\n### 演示\n\n讲解 Ansible 故障排除的最佳方法是进入现场演示，向你直观地展示该语法错误以及如何解决它！\n\
  \n#### 错误代码\n\n*   `report.txt`\n\n```\n1 test report.txt\n```\n\n*   `syntax_error.yml`\n\
  \n```\n 1 ---\n 2 - name: win_copy module demo\n 3   hosts: all\n 4   become: false\n\
  \ 5   gather_facts: false\n 6   vars:\n 7     source: \"report.txt\"\n 8     destination:\
  \ \"Desktop/report.txt\"\n 9   tasks:\n10     - name: copy report.txt\n11      \
