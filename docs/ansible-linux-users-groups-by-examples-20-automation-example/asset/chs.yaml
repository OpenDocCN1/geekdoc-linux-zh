  \ #\n```\n\n## 如何使用 PIP 安装 Ansible\n\n如何使用 Python 包管理器 `PIP` 安装 Ansible？\n\n`PIP`\
  \ 是 Python 包管理器，它将处理所有过程并管理必要的依赖关系。它直接从 `PyPI` 下载并安装软件包。`PIP` 设计为与操作系统无关。\n\n这对于总是想要最新版本的开发者来说，可能是一种解决方案。\n\
  \n另一种方法是使用特定操作系统的包管理器。\n\n例如，对于 Linux 使用 `yum`、`DNF` 和 `apt`，对于 macOS 使用 `Homebrew`。\n\
  \n第二种方法更强调稳定性，因此可能没有最新版本。\n\n所以，如果你确实需要最新版本的 Ansible，我建议你使用 `PIP`。\n\n### 使用 PIP\
  \ 安装 Ansible 演示\n\n如何使用 Python 包管理器 `PIP` 安装最新版本的 Ansible。\n\n#### PIP 用户代码\n\n\
  * `install-pip-user.sh`\n\n```\n1 #!/bin/bash\n2 python3 -m pip install --upgrade\
  \ -user pip\n3 python3 -m pip install --user ansible\n4 install-pip-global.sh\n\
  ```\n\n#### PIP 全局代码\n\n* `install-pip-global.sh`\n\n```\n1 #!/bin/bash\n2 python3\
  \ -m pip install --upgrade pip\n3 python3 -m pip install ansible\n```\n\n## 如何在\
  \ RedHat Enterprise Linux 9 Beta 中安装 Ansible\n\n如何在包含在 RHEL 9 AppStream 仓库中的 RedHat\
  \ Enterprise Linux 9 Beta 中安装 Ansible Core (`ansible-core`)。\n\n### 如何在 RHEL 9 Beta\
  \ 中安装 Ansible\n\n* RHEL 9 AppStream 仓库中包含的 Ansible Core 包 (`ansible-core`)\n\n好消息是，Ansible\
  \ Core 软件包已经已经内置包含在 RHEL 9 AppStream 仓库中了。\n\n基础自动化不再像以前的版本那样需要额外的仓库（如 `Ansible\
  \ Engine` 或 `EPEL`）。\n\n然而，为了对底层平台和 Core 维护的模块提供额外支持，需要 Ansible Automation Platform\
  \ 订阅。\n\n### 链接\n\n* [RHEL 9 AppStream 中包含的 Ansible Core 包的支持范围](https://access.redhat.com/articles/6325611)\n\
