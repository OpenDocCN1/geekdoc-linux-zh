  ```\n\n# Ansible Ansible\n\n在本章节中，你将发现常用的 Ansible 模块，用于自动化 Linux 系统管理员任务。\n\n##\
  \ Ansible 术语 - `ansible_hostname` 与 `inventory_hostname` 与 `ansible_fqdn`\n\n在 Ansible\
  \ Playbook 的实际示例中，`ansible_hostname`、`inventory_hostname`  way `ansible_fqdn` 之间的区别是什么？\n\
  \n这两个 Ansible 内部变量有时会让人互相混淆，但它们在本质上是不同的。\n\n### `ansible_hostname` vs `inventory_hostname`\
  \ vs `ansible_fqdn`\n\n#### `ansible_hostname` 和 `ansible_fqdn`\n\n从事实（facts）中读取目标机器的主机名：\n\
  \n* `ansible_hostname` 从 `gather_facts` 期间收集的事实中读取主机名。\n* 等同于 `uname -n` 或 `hostname`\
  \ 命令行工具。\n* 需要启用 `gather_facts`，否则 `ansible_facts` 变量将无法在 playbook 中。\n* 等同于目标主机的主机名。\n\
  * 由于它基于 `gather_facts` 步骤，`ansible_hostname` 在临时命令（ad-hoc command）不可用。\n\n#### `inventory_hostname`\n\
  \n从 Ansible 清单（inventory）或主机文件读取：\n\n* `inventory_hostname` 从清单配置或 hosts 文件读取主机名。它可能与远程系统的主机名配置不同。它可能只是控制机上的一个名称。\n\
  * `inventory_hostname` 在 playbook 中始终可用。\n* 可能与目标主机的主机名不同。\n* Playbook 和临时命令均可用。\n\
  \n### 演示\n\n我将通过一个简单的 Playbook 向你展示 `ansible_hostname`、`inventory_hostname` 和 `ansible_fqdn`\
  \ 内部变量之间的区别。\n\n#### 代码\n\nhostnames.yml\n\n```yaml\n1 ---\n2 - name: hostnames\
  \ demo\n3   hosts: all\n4   gather_facts: true\n5   tasks:\n6     - name: print\
  \ inventory_hostname\n7       ansible.builtin.debug:\n8         var: inventory_hostname\n\
  9     - name: print ansible_hostname\n10      ansible.builtin.debug:\n11       \
  \ var: ansible_hostname\n12    - name: print ansible_fqdn\n13      ansible.builtin.debug:\n\
  14        var: ansible_fqdn\n```\n\ninventory\n\n```ini\n1 foo.example.com ansible_host=192.168.0.190\n\
  2 [all:vars]\n3 ansible_connection=ssh\n4 ansible_user=devops\n5 ansible_ssh_private_key_file=~/.ssh/id_rsa\n\
  ```\n\n执行\n\n```bash\n1 ansible-pilot $ ansible-playbook -i inventory/hostnames.yml\n\
  3 PLAY [hostnames demo] ***********************************\n4 *************************************************\n\
  5 TASK [Gathering Facts] **********************************\n6 *************************************************\n\
  7 ok: [foo.example.com]\n8 TASK [print inventory_hostname] *************************\n\
  9 *************************************************\n10 ok: [foo.example.com] =>\
  \ {\n11     \"inventory_hostname\": \"foo.example.com\"\n12 }\n13 TASK [print ansible_hostname]\
  \ ***************************\n14 *************************************************\n\
  15 ok: [foo.example.com] => {\n16     \"ansible_hostname\": \"demo\"\n17 }\n18 TASK\
  \ [print ansible_fqdn] *******************************\n19 *************************************************\n\
  20 ok: [foo.example.com] => {\n21     \"ansible_fqdn\": \"demo.example.com\"\n22\
  \ }\n23 PLAY RECAP *********************************************\n24 *************************************************\n\
  25 foo.example.com: ok=4    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\n27 ansible-pilot $\n```\n\n幂等性\n\n```bash\n1 ansible-pilot\
  \ $ ansible-playbook -i inventory/hostnames.yml\n3 PLAY [hostnames demo] ***********************************\n\
  4 *************************************************\n5 TASK [Gathering Facts] **********************************\n\
  6 *************************************************\n7 ok: [foo.example.com]\n8\
  \ TASK [print inventory_hostname] *************************\n9 *************************************************\n\
  10 ok: [foo.example.com] => {\n11     \"inventory_hostname\": \"foo.example.com\"\
  \n12 }\n13 TASK [print ansible_hostname] ***************************\n14 *************************************************\n\
  15 ok: [foo.example.com] => {\n16     \"ansible_hostname\": \"demo\"\n17 }\n18 TASK\
  \ [print ansible_fqdn] *******************************\n19 *************************************************\n\
  20 ok: [foo.example.com] => {\n21     \"ansible_fqdn\": \"demo.example.com\"\n22\
  \ }\n23 PLAY RECAP *********************************************\n24 *************************************************\n\
  25 foo.example.com: ok=4    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\n27 ansible-pilot $\n```\n\n\n\n\n这种方法的优点是，在针对单个主机执行之前，你不需要编辑\
  \ Ansible Playbook 代码。\n\n缺点是，你每次执行命令时都应该记住，而人类有时并不那么可靠。\n\n#### 代码\n\n*   `playbook.yml`\n\
  \n```\n1 ---\n2 - name: harmful playbook\n3   hosts: all\n4   tasks:\n5     - name:\
  \ harmful task\n6       ansible.builtin.debug:\n7         msg: \"harmful task\"\n\
  ```\n\n#### 执行\n\n```\n 1 ansible-pilot $ ansible-playbook --limit demo.example.com\\\
  \n 2  -i limit/inventory limit/playbook.yml\n 3 PLAY [harmful playbook] *********************************\\\
  \n 4 ******************************************\n 5 TASK [Gathering Facts] **********************************\\\
  \n 6 ******************************************\n 7 ok: [demo.example.com]\n 8 TASK\
  \ [harmful task] *************************************\\\n 9 ******************************************\n\
  10 ok: [demo.example.com] => {\n11     \"msg\": \"harmful task\"\n12 }\n13 PLAY\
  \ RECAP **********************************************\\\n14 ******************************************\n\
  15 demo.example.com           : ok=2    changed=0    unreach\\\n16 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n17 ansible-pilot $\n```\n\n#### 错误执行\n\
  \n如果我们忘记了 `--limit` 选项，结果可能会非常有害。\n\n```\n 1 ansible-pilot $ ansible-playbook -i\
  \ limit/inventory limit\\\n 2 /playbook.yml\n 3 PLAY [harmful playbook] *********************************\\\
  \n 4 ******************************************\n 5 TASK [Gathering Facts] **********************************\\\
  \n 6 ******************************************\n 7 ok: [demo.example.com]\n 8 ok:\
  \ [demo2.example.com]\n 9 TASK [harmful task] *************************************\\\
  \n10 ******************************************\n11 ok: [demo.example.com] => {\n\
  12     \"msg\": \"harmful task\"\n13 }\n14 ok: [demo2.example.com] => {\n15    \
  \ \"msg\": \"harmful task\"\n16 }\n17 PLAY RECAP **********************************************\\\
  \n18 ******************************************\n19 demo.example.com           :\
  \ ok=2    changed=0    unreach\\\n20 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\\\n21    \n22 demo2.example.com          : ok=2    changed=0    unreach\\\
  \n23 able=0    failed=0    skipped=0    rescued=0    ignored=0\n24 ansible-pilot\
  \ $\n```\n\n### Ansible Playbook 主机\n\n*   `hosts: HOSTNAME`\n*   `ansible-playbook\
  \ PLAYBOOK`\n\n在 Ansible Playbook 中使用 `hosts` 语句允许你为执行指定一个主机或一组主机。\n\n这种方法的优点是，它比通过从命令行使用\
  \ `--limit` 参数来手动指定主机名更可靠。\n\n缺点是，你每次都需要记得编辑 Ansible Playbook 代码。如果你不这样做，你将在指定的主机上执行代码，这仍然是一个潜在的人为问题。\n\
  \n### Ansible Playbook 主机代码\n\n*   `playbook2.yml`\n\n```\n1 ---\n2 - name: harmful\
  \ playbook\n3   hosts: demo.example.com\n4   tasks:\n5     - name: harmful task\n\
  6       ansible.builtin.debug:\n7         msg: \"harmful task\"\n```\n\n#### 执行\n\
  \n```\n 1 ansible-pilot $ ansible-playbook -i limit/inventory limit\\\n 2 /playbook2.yml\n\
  \ 3 PLAY [harmful playbook] *********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [harmful task] *************************************\\\
  \n 9 ******************************************\n10 ok: [demo.example.com] => {\n\
  11     \"msg\": \"harmful task\"\n12 }\n13 PLAY RECAP **********************************************\\\
  \n14 ******************************************\n15 demo.example.com           :\
  \ ok=2    changed=0    unreach\\\n16 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n17 ansible-pilot $\n```\n\n### Ansible Playbook 主机进阶\n\n*   `hosts:\
  \ \"{{ HOSTS }}\"`\n*   `ansible-playbook -e \"HOSTS=demo.example.com\" PLAYBOOK`\n\
  \n在 Ansible Playbook 中使用 `hosts` 语句允许你指定一个变量，你可以通过该变量填充一个用于执行的主机或一组主机。\n\n基本上，如果你在命令行上盲目执行\
  \ Ansible Playbook 代码，它什么都不会做的的。唯一的处理方法是通过命令行通过额外变量来填充主机变量。\n\n这种方法的优点是，它比通过从命令行使用\
  \ `--limit` 参数来手动指定主机名更可靠。\n\n这个选项结合了上一个方法的优点，也是我最喜欢的。\n\n#### 代码\n\n*   `playbook3.yml`\n\
  \n```\n1 ---\n2 - name: harmful playbook\n3   hosts: \"{{ HOSTS }}\"\n4   tasks:\n\
  5     - name: harmful task\n6       ansible.builtin.debug:\n7         msg: \"harmful\
  \ task\"\n```\n\n#### 执行\n\n```\n 1 ansible-pilot $ ansible-playbook -i limit/inventory\
  \ -e \"H\\\n 2 OSTS=demo.example.com\" limit/playbook3.yml\n 3 PLAY [harmful playbook]\
  \ *********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [harmful task] *************************************\\\
  \n 9 ******************************************\n10 ok: [demo.example.com] => {\n\
  11     \"msg\": \"harmful task\"\n12 }\n13 PLAY RECAP **********************************************\\\
  \n 14 ******************************************\n15 demo.example.com          \
  \ : ok=2    changed=0    unreach\\\n16 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n17 ansible-pilot $\n```\n\n#### 错误执行\n\n```\n 1 ansible-pilot $\
  \ ansible-playbook -i limit/inventory\\\n 2 /playbook3.yml\n 3 [WARNING]: Could\
  \ not match host pattern, ignorin\\\n 4 g: HOSTS\n 5 PLAY [harmful playbook] *********************************\\\
  \n 6 ******************************************\n 7 skipping: no hosts matched\n\
  \ 8 PLAY RECAP **********************************************\\\n 9 ******************************************\n\
  10 ansible-pilot $\n```\n\n### 链接\n\n*   [模式：目标主机和组](https://docs.ansible.com/latest/user_guide/intro_patterns.html)\n\
  \n## 测试主机可用性 - Ansible 模块\n\n让我们聊聊 `ping` 模块。\n\n全名是 `ansible.builtin.ping`，这意味着它是\
  \ Ansible 自带的 `builtin` 集合的一部分，并随 Ansible 一起提供。\n\n这是一个非常稳定的模块。\n\n它验证 Ansible 登录到托管主机的能力，以及是否存在能够执行代码的\
  \ Python 解释器。\n\n所以它在网络上下文中与 ping 有不同。它是 Windows 对应的 win_ping 模块。\n\n### 主要参数和返回值\n\
  \n*   `data` string\n*   `ping` string\n\n人们通常不指定任何参数，或者使用返回值。\n\n对于参数，可以将行为从默认的“pong”更改为“crash”，后者在失败时会抛出异常。\n\
  \n返回值默认是“pong”字符串，但你可以通过 `data` 参数进行自定义。\n\n### 示例\n\n使用 Ansible `ping` 模块测试主机可用性。\n\
  \n```\n1 ---\n2 - name: ping demo\n3   hosts: all\n4   become: false\n5   tasks:\n\
  6     - name: test connection\n7       ansible.builtin.ping:\n```\n\n\n\n同样地，`var`\
  \ 参数允许我们打印变量。\n\n我们可以在 `msg` 字段中组合文本和变量。请注意，当我们想要变量值时，需要始终使用双括号。\n\n`verbosity`\
  \ 是为高级用户提供的，如果你想在正常执行时隐藏调试代码，但在调试模式下将其保留在 playbook（剧本）中。该值可以从 0（正常执行）到 3 不等。\n\n\
  ### Ansible debug 模块演示\n\n在接下来的示例中，我们将不再仅仅打印“Hello world!”文本，而是打印文本、变量、文本与变量的混合体，并向你演示如何使用调试级别（verbosity\
  \ level）。\n\n```\n 1 ---\n 2 - name: debug module demo\n 3   hosts: all\n 4   vars:\n\
  \ 5     fruit: \"apple\"\n 6   tasks:\n 7     - name: debug message\n 8       ansible.builtin.debug:\n\
  \ 9         msg: \"our fruit is {{ fruit }}\"\n10         verbosity: 2\n```\n\n\
  # Ansible Linux 用户管理\n\n我将向你展示如何在 Linux 系统下执行用户管理：创建、删除、修改属性、禁用和启用。\n\n## Ansible\
  \ 创建用户账户\n\n如何使用 Ansible 模块 `user` 创建用户账户。\n\n全名称为 `ansible.builtin.user`，这意味着它是\
  \ Ansible 内置（builtin）模块集合的一部分，并随 Ansible 一起发布。\n\n这是一个非常稳定且已发布多年的模块。\n\n它用于管理用户账户。\n\
  \n它支持极其多的 Linux 发行版、SunOS、macOS 以及 FreeBSD。\n\n该模块使用 Linux 发行版的 `useradd` 工具进行创建；在\
  \ FreeBSD 上，该模块使用 `pw useradd`；在 macOS 上，该模块使用 `dscl create`。\n\n对于 Windows，请使用\
  \ `ansible.windows.win_user` 模块。\n\n### 参数\n\n* `name` 字符串 - 用户名\n* `state` 字符串\
  \ - present（存在）/absent（缺不存在）\n* `password` 字符串 – `{{ 'password' | password_hash('sha512',\
  \ 'salt') }}`\n* `uid` 字符串 注释字符串 shell 字符串 过期字符串 password_expire_min 字符串 password_expire_max\
  \ 字符串\n* `group/groups` 字符串 - 主组/组成组\n* `create_home` 布尔值 - yes/no\n* `generate_ssh_key`\
  \ 字符串 ssh_key_bits 字符串 ssh_key_file 字符串 ssh_key_type 字符串 ssh_key_passphrase 字符串\n\
  \n该模块具有某些用于执行任务的参数。\n\n唯一必须的是“name”，即用户名。\n\n“state”参数允许我们创建或删除用户，在我们的用例中，默认已设置为“present”以创建用户。“password”经常与\
  \ `password_hash` 过滤器配合使用来生成密码。请注意，你还可以指定加密算法和盐值（salt）以使你的密码更健壮。\n\n我们可以指定所有常用的\
  \ Unix 属性，如 uid、comment、shell、expires、password_expire_min、password_expire_max。\n\
  \n其他重要参数是“group”和“groups”。第一个（不以“s”结尾的）表示用户的主组，第二个（以“s”结尾的）设置其他组成员。因此，请务必小心带有“s”结尾的参数，它可能会导致截然不同的设置。\n\
  \n通常，我们希望为用户创建家目录，因此“create_home”参数默认为 yes，但如果不需要家目录，可以覆盖它。\n\n让我也强调一下，我们还可以使用许多选项生成\
  \ SSH 密钥。指纹和公钥可以在返回的长长值列表中找到。\n\n### code\n\n如何使用 Ansible Playbook 在 Linux 中创建用户。\n\
  \n* `user.yml`\n\n```\n 1 ---\n 2 - name: user module demo\n 3   hosts: all\n 4\
  \   become: true\n 5   tasks:\n 6     - name: user example present\n 7       ansible.builtin.user:\n\
  \ 8         name: example\n 9         password: \"{{ 'password' | password_hash('sha512'\\\
  \n10 , 'mysecretsalt') }}\"\n11         groups:\n12           - wheel\n13      \
  \     - adm\n14         state: \"present\"\n15         shell: \"/bin/bash\"\n16\
  \         system: false\n17         create_home: true\n18         home: \"/home/example\"\
  \n19         comment: \"Ansible example\"\n20         generate_ssh_key: true\n```\n\
  \n## Ansible 删除用户账户\n\n今天我们讨论 Ansible 模块 `user`。\n\n全名称为 `ansible.builtin.user`，这意味着它是\
  \ Ansible 内置（builtin）模块集合的一部分，并随 Ansible 一起发布。\n\n这是一个非常稳定且已发布多年的模块，它管理用户账户。\n\n\
  它支持极其多的 Linux 发行版、SunOS、macOS 以及 FreeBSD。\n\n该模块使用 Linux 发行版的 `userdel` 进行删除；在 FreeBSD\
  \ 上，该模块使用 `pw userdel`；在 macOS 上，该模块使用 `dscl`。\n\n对于 Windows，请使用 `ansible.windows.win_user`\
  \ 模块。\n\n### 参数\n\n* `name` 字符串 - 用户名\n* `state` 字符串 - present（存在）/absent（不存在）\n\
  * `remove` 布尔值 - no /yes\n\n唯一必须的是“name”，即用户名。“state”允许我们创建或删除用户，在用例中，我们需要指定“absent”来删除用户。\n\
  \n如果我们想尝试删除用户，其行为类似于 `userdel` 命令。\n\n### code\n\n如何使用 Ansible Playbook 在 Linux\
  \ 中删除用户。\n\n* `delete_user.yml`\n\n```\n 1 ---\n 2 - name: user module demo\n 3\
  \   hosts: all\n 4   become: true\n 5   tasks:\n 6     - name: user example present\n\
  \ 7       ansible.builtin.user:\n 8         name: example\n 9         state: \"\
  absent\"\n10         remove: true\n```\n\n## Ansible 修改密码\n\n今天我们讨论 Ansible 模块 `user`。\n\
  \n全名称为 `ansible.builtin.user`，这意味着它是 Ansible 内置（builtin）模块集合的一部分，并随 Ansible 一起发布。\n\
  \n这是一个非常稳定且已发布多年的模块，它管理用户账户。\n\n它支持极其多的 Linux 发行版、SunOS、macOS 以及 FreeBSD。\n\n对于\
  \ Windows，请使用 `ansible.windows.win_user` 模块。\n\n### 参数\n\n* `name` 字符串 - 用户名\n*\
  \ `state` 字符串 - present（存在）/absent（不存在）\n* `password` 字符串 - 加密\n\n唯一必须的是“name”，即用户名。在\
  \ `state` 参数中，我们需要指定 `present` 选项。\n\n最重要的参数是 `password`，它允许你指定新密码。\n\n### demo\n\
  \n如何使用 Ansible 在 Linux 中更改用户密码。\n\n### code\n\n* `change_password.yml`\n\n```\n\
  \ 1 ---\n 2 - name: user module demo\n 3   hosts: all\n 4   become: true\n 5   vars:\n\
  \ 6     myuser: \"example\"\n 7     mypassword: \"password\"\n 8   tasks:\n 9  \
  \   - name: change password\n10       ansible.builtin.user:\n11         name: \"\
  {{ myuser }}\"\n12         state: present\n13         password: \"{{ mypassword\
  \ | password_hash('sha512'\\\n14 ) }}\"\n```\n\n#### execution\n\n```\n 1 $ ansible-playbook\
  \ -i demo/inventory change\\ user\\ passwo\\\n 2 rd/user.yaml\n 3 PLAY [user module\
  \ demo] *********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [change password] **********************************\\\
  \n 9 ******************************************\n10 changed: [demo.example.com]\n\
  \ 11 PLAY RECAP **********************************************\\\n 12 ******************************************\n\
  \ 13 demo.example.com           : ok=2    changed=1    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n#### verification\n\n```\n1 $ sshpass\
  \ -p 'password' example@demo.example.com\n```\n\n请注意：系统中必须安装 `sshpass`。\n\n\n\n\n\
  ## Ansible 禁用用户账户\n\n如何使用 Ansible 的 `user` 模块来禁用用户账户。\n\n### 参数\n\n* `name` 字符串\
  \ - 用户名\n* `state` 字符串 - present/absent（存在/不存在）\n* `password_lock` 布尔值 - no/yes\n\
  * `shell` 字符串 - `/sbin/nologin`\n\n唯一必填参数是 `name`，即用户名。\n\n`state` 参数允许我们创建或删除用户。\n\
  \n`password_lock` 参数指定锁定用户密码。\n\n该参数在 Linux 系统上使用 `passwd` 工具通过将密码更改为不匹配任何可能加密的值来禁用密码（在密码开头添加一个\
  \ `!`）。\n\n此参数不会禁用用户，仅锁定密码。此参数并不总是意味着用户无法通过其他方法登录。\n\n`shell` 参数指定用户的 shell。一个非常特殊的是\
  \ `nologin`。当具有该 shell 的用户登录时，他们将收到一条礼貌的提示，显示“此账户目前不可用”。此消息可以通过 `/etc/nologin.txt`\
  \ 文件进行自定义。\n\n### 示例\n\n让我们进入一个真实的 Ansible Playbook 来禁用用户。\n\n#### 代码\n\n* `user_disable.yml`\n\
  \n```\n 1 ---\n 2 - name: user module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   vars:\n 6     myuser: \"example\"\n 7   tasks:\n 8     - name: disable user\n\
  \ 9       ansible.builtin.user:\n10         name: \"{{ myuser }}\"\n11         state:\
  \ present\n12         password_lock: true\n13         shell: \"/sbin/nologin\"\n\
  ```\n\n#### 执行\n\n```\n 1 $ ansible-playbook -i demo/inventory disable\\ user\\\
  \ accou\\\n 2 nt/user.yml\n 3 \n 4 PLAY [user module demo] *********************************\\\
  \n 5 ******************************************\n 6 \n 7 TASK [Gathering Facts]\
  \ **********************************\\\n 8 ******************************************\n\
  \ 9 ok: [demo.example.com]\n 10 \n 11 TASK [disable user] **************************************\\\
  \n 12 ******************************************\n 13 changed: [demo.example.com]\n\
  \ 14 \n 15 PLAY RECAP **********************************************\\\n 16 ******************************************\n\
  \ 17 demo.example.com           : ok=2    changed=1    unreach\\\n 18 able=0   \
  \ failed=0    skipped=0    rescued=0    ignored=0\n```\n\n#### 验证\n\n```\n 1 $ ssh\
  \ devops@demo.example.com\n 2 $ sudo su -\n 3 [root@demo ~]# getent passwd\n 4 example:x:1002:1002::/home/example:/sbin/nologin\n\
  \ 5 [root@demo ~]# passwd -S example\n 6 example LK 2021-09-30 0 99999 7 -1 (Password\
  \ locked.)\n 7 [root@demo ~]# grep example /etc/shadow\n 8 example:!!:18900:0:99999:7:::\n\
  ```\n\n# Ansible 启用用户账户\n\n如何使用 Ansible 的 `user` 模块来启用用户账户。\n\n另参阅 Ansible 故障排除\
  \ - 无密码账户 。\n\n### 参数\n\n* `name` 字符串 - 用户名\n* `state` 字符串 - present/absent（存在/不存在）\n\
  * `password_lock` 布尔值 - no/yes\n* `shell` 字符串 - `/bin/bash`\n\n唯一必填参数是 `name`，即用户名。\n\
  \n`state` 参数允许我们创建或删除用户。\n\n`password_lock` 参数指定在密码锁定时解锁用户密码。\n\n该参数使用 `passwd`\
  \ 工具通过将密码更改为不匹配任何可能加密的值来更改密码（在密码开头添加一个 `!`）。为了启用我们的用户，显然我们需要禁用此参数。\n\n`shell` 参数指定用户的\
  \ shell。两个非常特殊的是 `nologin` 和 `false` shell。应用 `/bin/bash` 值将恢复用户的访问权限。\n\n### 示例\n\
  \n如何使用 Ansible 在 Linux 中启用一个没有密码锁定且具有适当 shell 的用户。\n\n#### 代码\n\n* `user_enable.yml`\n\
  \n```\n 1 ---\n 2 - name: user module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   vars:\n 6     myuser: \"example\"\n 7   tasks:\n 8     - name: enable user\n\
  \ 9       ansible.builtin.user:\n10         name: \"{{ myuser }}\"\n11         state:\
