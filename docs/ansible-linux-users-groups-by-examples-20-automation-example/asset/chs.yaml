  另一种非常有用的数据结构是注册变量。你可以将命令的输出保存在注册变量中。在示例中，它将显示在屏幕上。\n\n\n\n\n与远程相关的变量被称为事实（facts）。通过事实，你可以将一个系统的行为或状态作为其他系统的配置。它们之所以如此强大，是因为你可以获取关于当前主机、操作系统、所使用的发行版、IP\
  \ 地址、网络配置、存储配置等非常全面的视图。\n\n### 使用 ad-hoc 命令列出机器的所有事实\n\n```\n 1 $ ansible -m setup\
