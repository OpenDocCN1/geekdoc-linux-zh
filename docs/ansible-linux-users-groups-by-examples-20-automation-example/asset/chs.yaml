  ## Ansible 创建组\n\n`ansible.builtin.group`\n\n添加或删除组\n\n让我们来介绍 Ansible 模块 `group`。\n\
  \n它的全名是 `ansible.builtin.group`，这意味着它是 Ansible 内置（builtin）模块集合的一部分，并随 Ansible 一起发布。\n\
  \n这是一个非常稳定且已发布多年的模块。\n\n它用于添加或删除组。\n\n它支持大量的 Linux 发行版和 macOS。\n\n它依赖于三个 Linux 命令：`groupadd`、`groupdel`\
  \ 和 `groupmod`。\n\n对于 Windows，请使用 `ansible.windows.win_group` 模块。\n\n### 参数\n\n\
  - `name` string - 组名\n- `state` string - 存在(present)/不存在(absent)\n- `system` boolean\
  \ - 是(yes)/否\n- `gid` integer - 为组设置的 GID\n- `local` string - “local” 命令的替代方案\n\n\
  该模块包含一些参数用于执行特定任务。\n\n唯一必需的参数是 “name”，即组名。\n\n`state` 参数允许我们创建或删除组，在我们的用例中，默认值已设置为“present”以创建组。\n\
  \n`system` 参数允许创建系统组，默认情况下不是。\n\n你可以使用 `gid` 参数指定组标识符 “GID”。\n\n`local` 参数允许在实现了“local”命令的平台上使用“local”\
  \ 命令的替代方案（前提是你有一个中央认证系统）。\n\n### 演示\n\n如何使用 Ansible 创建 Linux 组。\n\n#### 代码\n\n`create_group.yml`\n\
  \n```\n 1 ---\n 2 - name: group module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   vars:\n 6     mygroup: \"example\"\n 7   tasks:\n 8     - name: create group\n\
  \ 9       ansible.builtin.group:\n10         name: \"{{ mygroup }}\"\n11       \
  \  state: present\n```\n\n#### 执行\n\n```\n 1 $ ansible-playbook -i demo/inventory\
  \ group/create.yml\n 2 PLAY [group module demo] ********************************\\\
  \n 3 *********************************\n 4 TASK [Gathering Facts] *********************************\n\
  \ 5 **************************\n 6 ok=1 [localhost]\n 7 TASK [create group] *********************************\\\
  \n 8 **************************\n 9 changed:1 [localhost]\n10 PLAY RECAP *********************************\\\
  \n11 **************************\n12 ok:1    changed:1    unreachable:0    failed:0\
  \    skipped:0\n```\n\n#### 验证\n\n```\n  1 ssh devops@demo....\n       . |. group\n\
  ```\n\n\n\n\n\n主组在 `group` 参数中指定，每个用户只能属于一个组。\n\n`groups` 参数指定了用户将被添加的额外组列表。这类组有时也被称为\
  \ `secondary`（次）、`additional`（附加）或 `supplementary`（补充）。\n\n`append` 参数非常重要。使用 `yes`\
  \ 选项，用户将被添加到指定的组中。\n\n使用 `no` 选项，所有组成员都将被指定的组所覆盖。\n\n总结一下，如果你指定了 `no` 选项，你将丢失所有先的组关联，请小心！\n\
  \n### demo\n\n如何使用 Ansible Playbook 在 Linux 上更改用户主组。\n\n### code\n\n- `user_group_changeprimary.yml`\n\
