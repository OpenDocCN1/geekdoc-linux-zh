  \ 故障排除 - 此命令必须在 root 用户下运行\n\n权限错误信息是令人令人困恼的 Ansible 问题。在实战演示中，我们将从错误消息开始进行故障排除。我们将调查问题的根源，并使用\
  \ package 模块进行修复。\n\n这种致命错误消息发生在我们尝试在模块执行期间执行一个需要更高权限的模块时。\n\n这些情况通常与 Ansible Playbook\
  \ 或 Ansible 配置有关。\n\n### 演示\n\n讨论 Ansible 故障排除最好的方法是进入现场演示，向你实际展示“此命令必须在 root 用户下运行”以及如何解决它！\n\
  \n此演示将尝试在目标系统上安装 `rsync` 软件包。\n\n#### 错误代码\n\n```\n1 ---\n2 - name: troubleshooting\
  \ under the root user\n3   hosts: all\n4   become: false\n5   tasks:\n6     - name:\
  \ rsync installed\n7       ansible.builtin.package:\n8         name: rsync\n9  \
  \       state: present\n```\n\n#### 错误执行\n\n```\n 1 ansible-pilot $ ansible-playbook\
  \ -i virtualmachines/demo/inventory troubleshooting/under_root_user_error.yml\n\
  \ 3 PLAY [troubleshooting under the root user] ***************\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] *********************************\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [rsync installed] *********************************\n\
  \ 9 ******************************************\n10 fatal: [demo.example.com]: FAILED!\
  \ => {\"changed\": false, \"msg\": \"This command has to be run under the root user.\"\
  , \"results\": []}\n11 PLAY RECAP **********************************************\n\
  12 ******************************************\n13 demo.example.com           : ok=1\
  \    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n\
  14 ansible-pilot $\n```\n\n#### 修复代码\n\n```\n1 ---\n2 - name: troubleshooting under\
  \ the root user\n3   hosts: all\n4   become: true\n5   tasks:\n6     - name: rsync\
  \ installed\n7       ansible.builtin.package:\n8         name: rsync\n9        \
  \ state: present\n```\n\n#### 修复执行\n\n```\n 1 ansible-pilot $ ansible-playbook -i\
  \ virtualmachines/demo/inventory troubleshooting/under_root_user_fix.yml\n 3 PLAY\
  \ [troubleshooting under the root user] ***************\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] *********************************\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [rsync installed] *********************************\n\
  \ 9 ******************************************\n10 ok: [demo.example.com]\n11 PLAY\
  \ RECAP **********************************************\n12 ******************************************\n\
  13 demo.example.com           : ok=2    changed=0    unreachable=0    failed=0 \
  \   skipped=0    rescued=0    ignored=0\n14 ansible-pilot $\n```\n\n# 感谢\n\n让我提醒一下，Ansible\
