  \ ok=2    changed=0    unreach\\\n14 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n```\n\n## Ansible 故障排除 - 权限提升错误\n\n权限提升错误是 Ansible 最常见的问题之一。\n\n\
  当 Ansible 连接的用户没有没有执行该操作的权限时，就会发生这种情况。解决方案是切换到具有管理员权限的用户。在 Ansible 中，你通过启用 `become`\
  \ 语句来执行此操作。\n\n在后台，Ansible 使用普通用户连接到目标主机，切换到管理员用户，然后执行 playbook 代码。\n\n标准的权限提升方法是\
  \ `sudo`，但也可用其他方法，例如 `su`、`pfexec`、`doas`、`pbrun`、`dzdo`、`ksu`、`runas`、`machinectl`、Centrify\
  \ 等。\n\n### 链接\n\n*   [理解权限提升：become](https://docs.ansible.com/ansible/latest/user_guide/become.html)\n\
  \n### 演示\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，向你实际展示权限提升错误以及如何解决它！\n\n#### 错误\n\n```\n\
  \ 1 ---\n 2 - name: yum module demo\n 3   hosts: all\n 4   become: false\n 5   tasks:\n\
  \ 6     - name: install package\n 7       yum:\n 8         name: git\n 9       \
  \  state: present\n```\n\n#### 修复\n\n```\n 1 ---\n 2 - name: yum module demo\n 3\
  \   hosts: all\n 4   become: true\n 5   tasks:\n 6     - name: install package\n\
  \ 7       yum:\n 8         name: git\n 9         state: present\n```\n\n## Ansible\
  \ 故障排除 - 缺少 sudo 密码和 sudo 密码错误\n\n学习如何复现致命错误 `missing sudo password`（缺少 sudo 密码）和\
  \ `incorrect sudo password`（sudo 密码错误）以及如何解决它们！\n\n### 演示\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，向你实际展示缺少\
  \ sudo 密码和 sudo 密码错误以及如何解决它们！\n\n#### 错误代码\n\n*   `missingsudopassword_error.yml`\n\
  \n```\n 1 ---\n 2 - name: debug module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   tasks:\n 6     - name: root test\n 7       ansible.builtin.debug:\n 8    \
  \     msg: \"privilege escalation successful\"\n```\n\n#### 错误执行\n\n```\n 1 $ ansible-playbook\
