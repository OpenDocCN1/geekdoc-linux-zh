  \ 2021 年 9 月 17 日\n\n本课程将跟踪 Ansible 技术的演进，并在需要时添加更多内容。\n\n* * 你准备好享受乐趣了吗？\n\n# 带示例的\
  \ Ansible 入门\n\n在本章中，你将发现 Ansible 基础、架构和术语。\n\n## 什么是 Ansible\n\n在本章中，我将向你解释什么是\
  \ Ansible 以及为什么它对你的 IT 部门是如此强大的。\n\n### Ansible\n\n* 基础设施自动化工具\n* 开源基础设施即代码\n\n\
  首先，让我们与名为 Ansible 的卓越开源技术开启之旅。它被归类为基础设施自动化工具，因此你可以非常轻松地自动化你的系统管理员任务。基础设施即代码是通过机器可读的定义文件管理和配置计算机数据中心的过程，而不是物理硬件配置或交互式配置工具。Ansible\
  \ 遵循 DevOps 原则。通过 Ansible，你可以在本地以及最著名的公共云提供商部署你的基础设施代码。\n\n### Ansible 三大用例\n\n\
  * 部署 (Provision)\n* 配置管理\n* 应用部署\n\nAnsible 的三个主要用例是部署、配置管理和应用部署。但在接触这项技术后，我相信你一定发明出更多使用它的方法！\n\
  \n#### 部署 (Provisioning)\n\n* 设置 IT 基础设施的过程\n\n让我们开始谈论部署：所有的系统管理员都知道管理一个统一的机器群有多重要。一些人仍然依赖软件来创建工作站镜像。但有一个缺点，使用镜像技术你只是获取了机器某个时间点的快照。因此，每当你因为现代密钥激活系统需要重新安装软件或手动更新到最新的安全补丁时，Ansible\
  \ 在自动化这一过程方面非常强大，能够创建一个更流畅的过程。\n\n#### 配置管理 (Configuration management)\n\n* 将系统和软件维护在预期且一致状态的过程\n\
  \n\n\n\n第二个关键用例是“配置管理”：以最新且一致的方式维护整个集群，协调滚动更新并调度停机时间。通过 Ansible，你可以验证受托管主机的状态并对其中一小部分主机执行操作。对于最常见的用例，提供了大量的模块。更不用说检查集群对某些国际标准的合规性并应用解决方案的这种常见用例了。\n\
  \n## 应用部署\n\n- 在测试环境、预发布环境（staging）和生产环境之间发布软件的过程\n\nAnsible 有用的第三个关键用例是应用部署。它可以自动化你的\
  \ Web 程序的持续集成/持续交付（CI/CD）工作流流水。你的 DevOps 团队会非常喜欢的！\n\n## DevOps 中的 Ansible\n\nAnsible\
  \ 用于在全球组织中应用 DevOps 原则。让我快速总结一下。\n\nDevOps 是一种结合了软件开发（Dev）和 IT 运营（Ops）的实践。由于 DevOps\
  \ 旨在成为一种跨部门的工作模式，实践该方法的人使用被称为“工具链”的不同工具集，而不是单一的工具。这些工具链预计符合以下一个或多个类别，反映了开发和交付过程的关键方面。这七类分别是：\n\
  \n- 代码：代码开发和评审、源代码管理工具、代码合并。\n- 构建：持续集成工具、构建状态。\n- 测试：持续测试工具，可提供对业务风险的快速且及时的反馈。\n\
  - 发布：制品仓库、应用部署前的预发布阶段。\n- 部署：变更管理、发布审批、发布自动化。\n- 运营：基础设施配置和管理、基础设施即代码（IaC）工具。\n\
  - 监控：应用程序性能监控、终端用户体验。\n\n## Ansible 的四个核心原则\n\n1. **声明式（Declarative）**：声明你想要的，而不是如何实现。\n\
  2. **无代理（Agentless）**：你不需要安装代理。它利用了 `OpenSSH`。\n3. **幂等性（Idempotent）**：操作可以运行多次，而不会产生初始操作之外的变化。\n\
  4. **社区驱动（Community driven）**：在 `Ansible Galaxy` 中以集合（collections）和角色（roles）的形式发布。\n\
  \nAnsible 的四个核心原则是：声明式、无代理、幂等和社区驱动。“声明式”意味着你可以以非常类似于编程语言的方式，在代码流中应用顺序、选择和迭代。“无代理”意味着你不需要在目标机器上安装和更新任何代理，它使用\
  \ SSH 连接和 Python 解释器。语言本身是“幂等的”，这意味着代码将检查受托管机器上的精确状态。这意味着，例如，你的代码第一次运行时会更改某些内容，随后的运行仅会验证没有变化并继续进行。最后一个原则是“社区驱动”，意味着存在一个名为“Ansible\
  \ Galaxy”的公共存档，你可以在那里下载其他开源贡献者编写的代码。这些代码组织为角色（roles）和集合（collections），但我们将在未来看到。\n\
  \n## Ansible 的六大价值\n\n- **简单（Simple）**：人类可读的 YAML 。\n- **强大（Powerful）**：配置管理、工作流编排、应用部署。\n\
  - **跨平台（Cross-platform）**：对所有主流操作系统、物理、虚拟、云和网络无代理支持。\n- **与现有工具协作（Work with existing\
  \ tools）**：使现有环境同质。\n- **“内置电池”（batteries included）**：自带了 750 多个模块。\n- **社区驱动（Community\
  \ powered）**：每月 [25 万次下载]、3500 名贡献者、IRC 上有 1200 名用户。\n\n现在让我们谈谈 Ansible 的六大价值。第一个是“简单：代码是用\
  \ YAML 语言编写的，这是一种人类可读的数据序列化语言。它广为人知且易于学习，通常用于配置文件以及存储或传输数据的应用程序。Ansible 是强大的，它在配置管理、工作流编排、应用部署方面经过了实战检验。第三个价值本质上是“跨平台”，对所有主流操作系统、物理、虚拟、云和网络提供商提供无代理支持。Ansible\
  \ 的另一个价值是它可以与现有工具协作，轻松使现有环境同质化。“内置电池”意味着 Ansible 包含了超过 750 个模块，用于自动化最常见的任务。最后一个价值是\
  \ Ansible 是“社区驱动”的，每月有超过 25 万次下载，平均 3500 名贡献者，IRC 上有超过 1200 名用户。\n\n## Ansible 历史\n\
  \n- **2012**：由 Michael DeHaan 开发\n- **2015**：被红帽（Red Hat）收购\n- **2016**：AnsibleFest\
  \ 活动\n- **2020**：红帽 Ansible 自动化平台 1.0\n- **2021**：红帽 Ansible 自动化平台 2.1\n\nAnsible\
  \ 历史上的主要事件如下。\n\nAnsible 的第一个版本于 2012 年 2 月 20 日发布。Ansible 工具由 Michael DeHaan 开发。Ansible\
  \ Inc.（原 AnsibleWorks Inc.）是为商业化支持和赞助该项目而成立的公司。\n\n2015 年 10 月 16 日，红帽收购了 Ansible\
  \ Inc，并将 Ansible 视为“强大的 IT 自动化解决方案”，旨在帮助企业实现无缝 IT。\n\nAnsibleFest 是自 2016 年以来在伦敦和美国举办的\
  \ Ansible 社区用户及贡献者年度会议。\n\n## Ansible & Ansible Tower & Ansible 自动化平台\n\n- **Ansible**：社区驱动项目，创新快速，开源，但仅提供命令行工具。\n\
  - **红帽 Ansible Tower / Ansible 自动化平台**：它是一个一个由红帽设计的框架。它提供了一个 Web 界面来管理你的基础设施。\n\n\
  Ansible 是一个社区驱动的项目，创新快速，开源，但仅提供命令行工具。\n\n企业需要更多的服务和更稳定的版本。例如，他们需要支持的 SLA。红帽通过 Ansible\
  \ Tower（现已更名为 Ansible 自动化平台）向公司提供此类服务。\n\n红帽还维护 Ansible Engine。通过 Ansible Engine，组织可以以强化、企业级的方式访问底层\
  \ Ansible 技术提供的工具和创新。\n\n## 入门\n\n在本章中，我将向你介绍如何开始使用 Ansible 技术。如何连接到受托管主机以及如何命令行执行一些简单任务。\n\
  \n### Ansible 架构\n\n让我们开始谈论 Ansible 架构。安装 Ansible 的节点被称为“控制节点”，它管理你的整个节点集群。相反，被控制节点被称为“受托管节点”。目标节点可以是\
  \ Linux、Mac、Windows 以及多种网络设备。每个目标都有某些特性，例如不同的 Linux 发行版和模块用法。我们将在接下来的章节中讨论这些特性。\n\
  \n### 与受托管节点的连接\n\n\n\n\n\n“控制节点”与“托管节点”之间的连接通过 SSH 协议管理，无需在目标机器上安装特定的客户端。其他竞争对手通常需要一个被称为“代理”（agent）的客户端软件。通过\
  \ SSH 连接，唯一需要的是用户名和用于访问目标机器的证书。有一些方法可以自动化这第一个脚本步骤。完成 SSH 连接后，另一个要求是 `python` 解释器，现代操作系统通常开箱即用。Ansible\
  \ 默认使用 SFTP 传输文件，但你可以在配置中切换到 SCP。Windows 目标可以使用 WinRM 技术连接，并使用 `PowerShell` 作为解释器。\n\
  \n## 创建基础清单\n\n*  `/etc/ansible/hosts`\n\n```\n1 host1.example.com\n```\n\n* 默认清单文件\
  \ `/etc/ansible/hosts`\n\n* “host1.example.com”是一个托管主机\n\n托管主机列表存储在 `/etc/ansible/hosts`\
  \ 中。在例例中，它只包含一个名为 `host1.example.com` 的主机。\n\n## 运行你的第一个 Ansible 命令\n\n```\n1 $\
  \ ansible all -m ping\n2 host1.example.org | SUCCESS => {\n3     \"ansible_facts\"\
  : {\n4         \"discovered_interpreter_python\": \"/usr/bin/python\"\n5     },\n\
  6     \"changed\": false,\n7     \"ping\": \"pong\"\n8 }\n```\n\n* “ping”模块在“all”（所有）主机上执行\n\
  \n* “host1.example.com”以成功代码回复\n\n现在我们准备好运行你的第一个 Ansible 命令了。Ansible 命令在 Ansible\
  \ 术语中称为 `module`（模块）。第一行在 `all` 主机上执行了 Ansible `ping` 模块。响应是 `pong`。请注意，这意味着 Ansible\
  \ 能够通过 SSH 用户名建立连接，使用公钥进行身份验证并执行本地 `python` 执行器。因此，它与网络中的任何 `ping` 完全不同。\n\n## 在\
  \ Ansible 上运行即性命令\n\n```\n1 $ ansible all -a “/bin/echo hello”\n2 host1.example.org\
  \ | CHANGED | rc=0 >>\n3 hello\n```\n\n* “/bin/echo hello”命令在“all”主主机上执行\n\n* “host1.example.com”以更改代码回复并在标准输出上打印“hello”\n\
  \nAnsible 也可以在目标主机上执行某些命令并在“控制节点”的控制台上报告状态。在此例中，“/bin/echo hello”命令在 `all` 主机上执行。“host1.example.com”以更改代码回复并在标准输出上打印“hello”。请注意，每当你运行远程机器上运行命令时，都会收到一个“changed”（更改）状态。\n\
  \n## 在 Ansible 上运行带权限提升的即性命令\n\n```\n1 $ ansible all -m ping -u devops --become\n\
  2 host1.example.org | SUCCESS => {\n3     \"ansible_facts\": {\n4         \"discovered_interpreter_python\"\
  : \"/usr/bin/python\" even5     },\n6     \"changed\": false,\n7     \"ping\": \"\
  pong\"\n8 }\n```\n\n* 以用户“devops”登录后，以用户“root”身份在“all”主机上执行“ping”模块\n\n* “host1.example.com”以更改代码回复并在标准输出上打印“hello”\n\
  \n在此例中，我在以用户“devops”登录后，以用户“root”身份对“all”主机运行“ping”模块。“host1.example.com”以更改代码回复并在标准输出上打印“hello”。\n\
  \n### 总结\n\n在本模块中，我们学习了 Ansible 架构的基本概念、如何编写托管主机列表以及如何对其执行一些简单命令。\n\n## 清单 (Inventory)\n\
  \n在本章中，我将向你解释什么是 Ansible 清单、你为什么需要它、不同类型，以及如何在日常工作中编辑和使用它。\n\n```\n1 清单是 Ansible\
  \ 可以工作的主机集\\\n2 。\n3 它们可以被分类为组/模式。\n```\n\n由 Ansible 管理的多个主机列表被称为“清单”（inventory）。它根本上是你的基础设施中节点或主机的列表，同时使用列表或列表列表被称为清单。你可以通过“组”（groups）或“模式”（patterns）来组织清单，以选择你想让\
  \ Ansible 运行的主机或组。\n\n* “all”关键字\n\n```\n1 关键字 all 包含清单中的所有主机，除\\\n2 localhost\n\
  ```\n\n特殊关键字 `all` 包含所用清单的所有主机。它在接下来的课程中将非常有用。唯一的例外是你需要指定的 `localhost`。\n\n### 简单的\
  \ INI 清单\n\n*  `./ini_simple_inventory`\n\n```\n1 one.example.com\n2 \n3 [webservers]\n\
  4 two.example.com\n5 three.example.com\n```\n\n* 文件名：`ini_simple_inventory`\n\n\
  * “one.example.com”未分组\n\n* “two.example.com”和“three.example.com”被组为“webserver”\n\
  \n最简单的清单类型是根据文件类型划分的 INI 清单。默认位置是 `/etc/ansible/hosts`，但你可以使用 `-i` 参数使用自定义清单。在此例中，主机“one.example.com”未分组，“two.example.com”和“three.example.com”被分组为“webserver”。\n\
  \n### 简单的 YAML 清单\n\n*  `./simple_yaml_inventory.yml`\n\n```\n1 ---\n2 all:\n3 \
  \  hosts:\n4     one.example.com:\n5   children:\n6     webservers:\n7       hosts:\n\
  8         two.example.com:\n9         three.example.com:\n```\n\n* 文件名：`simple_yaml_inventory.yml`\n\
  \n* “one.example.com”未分组\n\n* “two.example.com”和“three.example.com”被组为“webserver”\n\
  \n你可以使用 YAML 语法表示相同的清单。在此例中，“one.example.com”未分组，“two.example.com”和“three.example.com”被组为“webserver”。\n\
  \n### 主机范围\n\n*  `./ini_range_inventory`\n\n```\n1 [webservers]\n2 www[01:99].example.com\n\
  3 \n4 [databases]\n5 db-[a-f].example.com\n```\n\n* “webservers”包含从 www01.example.com\
  \ 到 www99.example.com 的主机\n\n* “databases”组包含从 db-a.example.com 到 db-f.example.com\
  \ 的主机\n\n组成员也可以通过范围定义。在范围示例中你也可以指定。\n\n### 多组主机\n\n*  `./ini_groupsmultiple_inventory`\n\
  \n```\n 1 one.example.com\n 2 \n 3 [webservers]\n 4 two.example.com\n 5 three.example.com\n\
  \ 6 \n 7 [prod]\n 8 two.example.com\n 9 \n10 [dev]\n11 three.example.com\n```\n\n\
  * “two.example.com”和“three.example.com”存在于多个组中\n\n主机可以存在于多个组。在此 INI 示例中，“two.example.com”和“three.example.com”被组为“webserver”。“two.example.com”同时也存在于“prod”组。\n\
  \n### 主机变量\n\n*  `./ini_hostinventory`\n\n```\n1 [webservers]\n2 localhost  ansible_connection=local\n\
  3 one.example.com ansible_connection=ssh ansible_user=devops\n4 two.example.com\
  \ ansible_connection=ssh ansible_user=ansible\n```\n\n* `ansible_connection` 和 `ansible_user`\
  \ 变量的自定义\n\n在清单中你可能存储与特定主机或组相关的变量。这种场景很常见，因为它为不同的主机定义了不同的连接。例如对 localhost 使用“local”连接，对所有其他主机使用默认的“ssh”。对于每个主机，你还可以自定义登录用户，为“one.example.com”使用“devops”，为“two.example.com”使用“ansible”。\n\
  \n### 组变量\n\n*  `./ini_groupsvariables_inventory`\n\n```\n1 [webservers]\n2 one.example.com\n\
  3 two.example.com\n4 \n5 [webservers:vars]\n6 ntp_server=europe.pool.ntp.org\n```\n\
  \n*  `./inventory.yml`\n\n```\n1 ---\n2 webservers:\n3   hosts:\n4     two.example.com:\n\
  5     three.example.com:\n6   vars:\n7     ntp_server: europe.pool.ntp.org \n```\n\
  \n与单主机一样，也可以定义组变量。在两个清单文件（INI 和 YAML 格式）中，变量 `ntp_server` 已为组内所有主机分配了值 `europe.pool.ntp.org`。\n\
  \n### 变量值的继承\n\n\n\n\n\n```\n 1 [asia]\n 2 host1.example.com\n 3 \n 4 [europe]\n\
  \ 5 host2.example.com\n 6 \n 7 [webserver:children]\n 8 asia\n 9 europe\n10 \n 11\
  \ [webservers:vars]\n 12 ntp_server=europe.pool.ntp.org\n```\n\n- `./variableinheriting_inventory.yml`\n\
  \n```\n 1 ---\n 2 children:\n 3   webservers:\n 4     children:\n 5       asia:\n\
  \ 6         hosts:\n 7           host1.example.com:\n 8       europe:\n 9      \
  \   hosts:\n10           host2.example.com:\n11     vars:\n 12       ntp_server:\
  \ europe.pool.ntp.org\n```\n\n主机和组可以在一起。在这个示例中，`webserver` 组有两个成员 `asia` 和 `europe`。这两个元素分别被定义为单个主机\
  \ `host1.example.com` 和 `host2.example.com`，但也可以包含更多主机。`ntp_server` 变量定义在 `webservers`\
  \ 级别。因此，`ntp_server` 变量对 `webserver`、`asia` 和 `europe` 组可用。`ntp_server` 变量在 `host1.example.com`\
  \ 和 `host2.example.com` 主机上也可用。\n\n### 使用多个清单源\n\n```\n1 $ ansible-playbook playbook.yml\
  \ -i production -i development\n```\n\n- 对 `production` 和 `development` 目标执行名为 `playbook.yml`\
  \ 的 `ansible-playbook`\n\n每次执行可以使用多个清单文件。在这个示例中，将针对 `production` 和 `development`\
  \ 清单执行名为 `playbook.yml` 的 ansible playbook。\n\n### localhost 清单\n\n- `./ini_local_inventory`\n\
  \n```\n1 localhost ansible_connection=\"local\"\n```\n\n- 文件名：`inventory`\n- 默认路径\
  \ `/etc/ansible/hosts`\n\n清单中的一个特殊情况是 `localhost`。你需要指定连接类型为 `local`，否则 Ansible\
  \ 将默认使用 SSH 连接。\n\n### 总结\n\n现在你对 Ansible INI 和 YAML 清单文件、主机和组变量有了更多的了解。\n\n## Playbook\n\
  \n在本章中，我将为你解释什么是 Ansible Playbook 以及你为什么需要它。我们将介绍如何从一个简单的 playbook 开始，从基础语法到如何添加更多任务。\n\
  \n```\n1 playbook 是一组针对清单执行的 play（剧本）。\n```\n\n### YAML 语法\n\n```\n 1 # 这是一个 YAML\
  \ 注释\n 2 some data # 这也是一个 YAML 注释\n 3 \n 4 this is a string\n 5 'this is another\
  \ string'\n 6 \"this is yet another a string\"\n 7 \n 8 with_newlines: |\n 9 Example\
  \ Company\n10 123 Main Street\n11 New York, NY 10001\n12 \n13 without_newlines:\
  \ >\n14 This is an example\n15 of a long string,\n16 that will become\n17 a single\
  \ sentence.\n18 \n19 yaml_dictionary: {name1: value1, name2: value2}\n20 \n21 yaml_list1:\n\
  22 - value1\n23 - value2\n24 yaml_list2: [value1, value2]\n```\n\n每个 playbook 都基于\
  \ YAML 语法，因此文件易于阅读且符合人类阅读习惯。YAML 是一种文本格式，你可以通过开头的三个连字符和结尾的三个点来轻松识别它。三个点并不是强制性的，许多人直接省略了它们。这种文件类型对元素之间的空格非常敏感。与某些编程语言不同，严格重要的是相同级别的元素必须具有相同的缩进。你可以使用符号\
  \ `#` 进行注释，即使在带有之前代码的行中也是如此。字符串非常重要，你可以直接指定或使用单引号或双引号。我建议你将双引号作为通用规则。使用管道符号 `|`\
  \ 和大于符号 `>` 可以定义多行字符串。第一个语句将保留换行符，第二个则不会。其他有用的数据结构是字典和列表，你可以在灰色面板中看到它们的用法。\n\n###\
  \ helloworld.yml\n\n- `helloworld.yml`\n\n```\n1 ---\n2 - name: Hello World sample\n\
  3   hosts: all\n4   tasks:\n5     - name: Hello message\n6       ansible.builtin.debug:\n\
  7         msg: \"Hello World!\"\n8 ...\n```\n\n```\n1 文件名: helloworld.yml\n2 playbook\
  \ 的名称\n3 执行的主机\n4 任务列表\n5 一个名为 \"Hello message\" 的任务\n6 模块 ansible.builtin.debug\n\
  7 debug 模块的参数 \"msg\"\n```\n\n\n\n这是执行 `helloworld.yml` 的输出。我希望你注意使用的命令是 `ansible-playbook`。第一个参数是清单文件，第二个是\
  \ playbook。\n\n在这次执行中，play 是针对 `host1.example.com` 节点执行的。输出清晰地显示了执行步骤。当命令成功时，输出将以绿色显示。警告将以橙色显示，错误将为红色。细心的你可能注意到执行了一个额外的任务叫做\
  \ `Gathering Facts`（收集事实），这是 Ansible 用于获取被管理节点的一些信息。我们将讨论更多关于 facts 内容。\n\n### 提示\
  \ 1：ansible-playbook --check 选项\n\n```\n1 $ ansible-playbook -i inventory --check\
  \ helloworld.yml\n2 PLAY [Hello World sample] *******************************\n\
  3 *********************************************************\n4 ***********\n5 TASK\
  \ [Gathering Facts] **********************************\\\n6 *********************************************************\n\
  7 ********\n8 ok: [host1.example.com]\n9 TASK [Hello message] ************************************\n\
  10 *********************************************************\n11 ******\n12 ok:\
  \ [host1.example.com] => {\n13     \"msg\": \"Hello World!\"\n14 }\n15 PLAY RECAP\
  \ **********************************************\n16 *****************************************************\n\
  17 host1.example.com       : ok=2    changed=0\n```\n\n`--check` 是一个非常实用的选项，用于对\
  \ playbook 进行空运行（dry run）。这将 Ansible 报告如果执行 playbook 会发生哪些变化。\n\n### 提示 2：debug\
  \ 的用法\n\n- `helloworld_debug.yml`\n\n```\n1 ---\n2 - name: Hello World sample\n\
  3   hosts: all\n4   tasks:\n5     - name: Hello message\n6       debug:\n7     \
  \    msg: \"Hello World!\"\n8         verbosity: 2\n9 ...\n```\n\n```\n1 文件名: helloworld_debug.yml\n\
  2 playbook 的名称\n3 执行的主机\n4 任务列表\n5 一个名为 \"Hello message\" 的任务\n6 模块 debug\n7 debug\
  \ 模块的参数 \"msg\"\n8 参数 \"verbosity\" 为 \"2\"\n```\n\n这个提示允许你将调试代码保留在 playbook 中，仅在需要时启用执行。例如，只有当以输出级别二调用\
  \ Ansible 时，才会打印消息。\n\n### helloworld_debug.yml - 执行 - 部分 1\n\n```\n 1 ansible-playbook\
  \ -i inventory helloworld_debug.yml\n 2 PLAY [Hello World sample] *******************************\n\
  3 *********************************************************\n4 ***********\n 5 \n\
  6 TASK [Gathering Facts] **********************************\\\n7 *********************************************************\n\
  8 ********\n9 ok: [host1.example.com]\n10 \n11 TASK [Hello message] ************************************\n\
  12 *********************************************************\n13 ******\n14 skipping:\
  \ [host1.example.com]\n15 \n16 PLAY RECAP **********************************************\n\
  17 *****************************************************\n18 host1.example.com \
  \      : ok=1    changed=0\n19 e=0    failed=0    skipped=1    rescued=0    ignored=0\n\
  ```\n\n这是 `helloworld_debug.yml` 在正常执行（即未处于调试模式）时的输出。正如你所看到的，hello 消息被跳过了。\n\n###\
  \ helloworld_debug.yml - 执行 - 部分 2\n\n\n\n\n\n```\n 1 $ ansible-playbook -i inventory\
  \ -vv helloworld_debug.yml\n 2 PLAY [Hello World sample] *******************************\\\
  \n 3 *********************************************************\\\n 4 ***********\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 *********************************************************\\\
  \n 7 ********\n 8 ok: [host1.example.com]\n 9 TASK [Hello message] ************************************\\\
  \n10 *********************************************************\\\n11 ******\n12\
  \ ok: [host1.example.com] => {\n13     \"msg\": \"Hello World!\"\n14 }\n15 PLAY\
  \ RECAP **********************************************\\\n16 *****************************************************\n\
  17 host1.example.com       : ok=2    changed=0    unreachabl\\\n18 e=0    failed=0\
  \    skipped=1    rescued=0    ignored=0\n```\n\n这是 `helloworld_debug.yml` 在调试级别二模式下执行时的输出，请注意命令行中的两个\
  \ `-vv`。如你看到的，hello 消息被打印出来了。\n\n### 等幂性\n\n```\n1 idempotency\n2 modules check\
  \ the desired final state has already been ac\\\n3 hieved, otherwise apply\n```\n\
  \n大多数 Ansible 模块的一个重要特性是“等幂性”。这意味着在对目标节点执行任何操作之前，模块会先检查实际状态。如果实际状态与期望状态匹配，则不会执行任何操作。如果当前状态偏离了预期状态，则会执行操作。请注意，如果你再次执行该\
  \ playbook，将发现期望状态已经满足，不会再执行后续操作。这一属性被称为“等幂性”，你应该充分利用这一特性。\n\n### multipleplays.yml\n\
  \n```\n 1 ---\n 2 - name: first play\n 3   hosts: web.example.com\n 4   tasks:\n\
  \ 5     - name: first task\n 6       ansible.builtin.yum:\n 7         name: httpd\n\
  \ 8         status: present\n 9     - name: second task\n10       ansible.builtin.service:\n\
  11         name: httpd\n12         enabled: true\n13 - name: second play\n14   hosts:\
  \ database.example.com\n15   tasks:\n16     - name: first task\n17       ansible.builtin.service:\n\
  18         name: mariadb\n19         enabled: true\n```\n\n*   文件名：`multipleplays.yml`\n\
  \n内部包含两个针对 `web.example.com` 和 `database.example.com` 执行的 play。\n\n`multipleplays.yml`\
  \ playbook 包含两个 play。第一个 play 针对 `web.example.com` 主机执行，安装 apache Web 服务器并设置开机自启。第二个\
  \ play 将针对 `database.example.com` 执行，并设置 `mariadb` 数据库管理系统开机自启。如你所见，使用多个 play 在不同主机上执行不同任务是非常强大的。现在，对\
  \ playbook 的定义就变得更有意义了。\n\n### privilege_escalation.yml\n\n```\n 1 ---\n 2 - name:\
  \ install httpd\n 3   hosts: web.example.com\n 4   become: true\n 5   become_method:\
  \ sudo\n 6   become_user: root\n 7   tasks:\n 8     - name: install httpd\n 9  \
  \     ansible.builtin.yum:\n10         name: httpd\n11         status: present\n\
  ```\n\n*   `privilege_escalation.yml`\n\n`become` 指定是否需要权限提升\n\n`become_method`\
  \ 指定权限提升的方法\n\n`become_user` 指定目标用户（默认认为 `root`）\n\n某些操作需要由具有管理员权限的用户执行。在 Linux\
  \ 中，这通常是 `root` 用户。某些发行版允许通过 `sudo` 命令使用 `wheel` 组进行权限提升。在这个示例中，我将安装软件，因此我需要权限提升。`yum`\
  \ 模块需要在托管节点上执行某些操作。在 playbook 中，如果不需要，你可以禁用它。\n\n### 最常用的 Ansible 模块\n\n#### **文件模块**\n\
  \n*   `copy`：将本地文件复制到托管主机\n*   `fetch`：将文件从远程节点复制到本地\n*   `file`：设置文件的权限和其他其他属性\n\
  *   `lineinfile`：确保文件中存在或不存在某特定行\n*   `synchronize`：使用 rsync 同步内容\n\n#### **软件包模块**\n\
  \n*   `package`：使用操作系统原生自动检测的包管理器管理软件包\n*   `yum`：使用 YUM 包管理器管理软件包\n*   `apt`：使用\
  \ APT 包管理器管理软件包\n*   `dnf`：使用 DNF 包管理器管理软件包\n*   `gem`：管理 Ruby gems\n*   `pip`：从\
  \ PyPI 管理 Python 软件包\n\n#### **系统模块**\n\n*   `firewalld`：使用 firewalld 管理任意端口和服务\
  \ \n*   `reboot`：重启机器\n*   `service`：管理服务\n*   `user`：添加、删除和管理用户账户\n\n#### **网络工具模块**\n\
  \n*   `get_url`：通过 HTTP、HTTPS 和 FTP 下载文件\n*   `nmcli`：管理网络\n*   `uri`：与 Web 服务交互\n\
  \n### 总结\n\n在本模块中，我们为后续在 Ansible Playbook 的操作奠定了基础。继续努力，你很快就能自动化你所有的系统管理员任务。\n\n\
  ## 变量\n\n在本章中，我将向你解释什么是 Ansible 变量、你为什么需要它们、不同类型以及如何在日常工作中编辑和使用它们。\n\n\n\n\n\n`variableprint.yml`\
  \ 的执行输出与 `helloworld.yml` 文件的输出非常相似。请注意，消息“Print the value of variable apple”的打印是通过将字符串与变量\
  \ `apple` 的值组合得到的。此外，如你在执行回放（play recap）区域和绿色字体所示，本次执行是成功的。正在执行两个任务。\n\n### variableprint.yml\
  \ - 额外变量\n\n```\n 1 $ansible-playbook -i inventory  -e fruit=banana  variabl\\\n\
  \ 2 eprint.yml\n 3 PLAY [Variable print sample] ****************************\\\n\
  \ 4 ***********************\n 5 \n 6 TASK [Gathering Facts] **********************************\\\
  \n 7 ***********************\n 8 ok: [host1.example.com]\n 9 \n10 TASK [Print variable]\
  \ ***********************************\\\n11 ***********************\n12 ok: [host1.example.com]\
  \ => {\n13     \"msg\": \"Print the value of variable banana\"\n14 }\n15 \n16 PLAY\
  \ RECAP **********************************************\\\n17 ***********************\n\
  18 host1.example.com\t: ok=2    changed=0    unreachable=0   \\\n19  failed=0  \
  \  skipped=0    rescued=0    ignored=0\n```\n\n在命令行上设置的 playbook 变量被称为额外变量（extra\
  \ variables）。`variableprint.yml` 的执行输出与上一个相似。请注意，消息“Print the value of variable\
  \ banana”的打印是通过将字符串与变量的值组合得到的。从命令行传递的值将覆盖任何 playbook 中的变量值。\n\n### 主机变量和组变量\n\n\
  * `inventory_host_variables`\n\n```\n1 [servers]\n2 host1.example.com ansible_user=devops\n\
  ```\n\n* `inventory_group_variables`\n\n```\n1 [servers]\n2 host1.example.com\n\
  3 host2.example.com\n4 \n5 [servers:vars]\n6 user=alice\n```\n\n主机变量和组变量可以在你的清单文件中定义。在左侧列中你可以看到变量的示例。变量\
  \ `ansible_user` 被赋值为值 `devops`。此主机变量适用于 `host1.example.com`。在右侧列中，你看到了变量的示例。变量\
  \ `user` 被赋值为值 `alice`。此组变量将适用于 `host1.example.com` 和 `host2.example.com` 并具有相同的值。\n\
  \n* `inventory_host_dir`\n\n```\n1 [servers]\n2 host1.example.com\n```\n\n* `host_vars/host1.example.com`\n\
  \n```\n1 ansible_user=devops\n```\n\n* `inventory_group_dir`\n\n```\n1 [servers]\n\
  2 host1.example.com\n3 host2.example.com\n```\n\n* `group_vars/servers`\n\n```\n\
  1 user=alice\n```\n\n你也可以使用目录来填充主机和组变量以达到相同的结果。如你所见，结果与幻灯片相同。在左侧列中你可以看到变量的示例。变量\
  \ `ansible_user` 被赋值为值 `devops`。此主机变量适用于 `host1.example.com`。在右侧列中，你看到了变量的示例。变量\
  \ `user` 被赋值为值 `alice`。此组变量将适用于 `host1.example.com` 和 `host2.example.com` 并具有相同的值。\n\
  \n### 数组变量\n\n* `array.yml`\n\n```\n 1 ---\n 2 - name: Array sample\n 3   hosts:\
  \ all\n 4   vars:\n 5     users:\n 6       alice:\n 7         firstname: Alice\n\
  \ 8         homedir: /users/alice\n 9       bob:\n10         firstname: Bob\n11\
  \         homedir: /users/bob\n```\n\n```\n1 file name: array.yml\n2 用户按层级结构组织。\n\
  3 \n4 Returns 'Alice'\n5 users.alice.firstname\n6 Returns 'Alice'\n7 users['alice']['firstname']\n\
  ```\n\n一种非常有用的数据结构是 `Array`（数组）。你可以按照层级结构组织信息。在示例中，用户列表 `alice` 和 `bob` 是非常易读的。列表中的每个元素有两个属性：`firstname`\
  \ 和 `homedir`。你可以使用点表示法或方括号来访问数据。在两种情况下你都会获得相同的结果，如幻灯片所示。\n\n### array.yml - 执行\n\
  \n```\n 1 $ansible-playbook -i inventory array.yml\n 2 PLAY [Array sample] *************************************\\\
  \n 3 *********************************************************\n 4 *****\n 5 TASK\
  \ [Gathering Facts] **********************************\\\n 6 *********************************************************\n\
  \ 7 *******\n 8 ok: [host1.example.com]\n 9 TASK [Print Alice's firstname] **************************\\\
  \n10 *********************************************************\n11 ---------------ok:\
  \ [host1.example.com] => {\n12     \"msg\": \"Print Alice's firstname: Alice\"\n\
  13 }\n14 PLAY RECAP **********************************************\\\n15 *****************************************************host\n\
  16 1.example.com                  : ok=2    changed=0    unreachable\\\n17 able=0\
  \    failed=0    skipped=0    rescued=0    ignored\\\n18 ed=0 \n```\n\n这是 `array.yml`\
  \ 的执行输出与上一个非常相似。请注意“Print Alice's firstname: Alice”的输出。\n\n### 注册变量（Registered Variables）\n\
  \n* `variables.yml`\n\n```\n1 ---\n 2 - name: Array sample\n 3   hosts: all\n 4\
  \   vars:\n 5     users:\n 6       alice:\n 7         firstname: Alice\n 8     \
  \    homedir: /users/alice\n 9       bob:\n10         firstname: Bob\n11       \
