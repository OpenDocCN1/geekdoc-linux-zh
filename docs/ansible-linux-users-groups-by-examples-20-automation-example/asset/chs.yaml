  \ 执行结果相同。\n\n### `facts_printall.yml` - 执行\n\n```\n 1 ansible-playbook -i inventory\
  \ facts_printall.yml\n 2 PLAY [facts_printall] ***********************************\\\
  \n 3 *****************************************************\n```\n\n\n\n\n\n要编辑已有的加密文件，Ansible\
  \ Vault 提供了 `ansible-vault edit filename` 命令。该命令会将文件解密到临时文件并允许你进行编辑。保存时，它会复制内容并删除临时文件。\n\
  \n### 加密已有的文件\n\n```\n1 $ ansible-vault encrypt cleartext1.yml --output=vault1.yml\n\
  2 New Vault password: password\n3 Confirm New Vault password: password\n4 Encryption\
  \ successful\n```\n\n要加密已存在的文件，请使用 `ansible-vault encrypt filename` 命令。`--output`\
  \ 选项可以将加密文件保存为新名称。如果你省略此选项，原始文件将被加密后的文件覆盖。\n\n### 解密已有的文件\n\n```\n1 $ ansible-vault\
  \ decrypt vault1.yml --output=decrypted.yml\n2 Vault password: password\n3 Decryption\
  \ successful\n```\n\n可以使用 `ansible-vault decrypt filename` 命令永久解密已有的加密文件。在解密单个文件时，你可以使用\
  \ `--output` 选项将解密后的文件保存为不同的名称。\n\n### 修改加密文件的密码\n\n```\n1 $ ansible-vault rekey\
  \ secret.yml\n2 Vault password: password1\n3 New Vault password: password\n4 Confirm\
  \ New Vault password: password\n5 Rekey successful\n```\n\n你可以使用 `ansible-vault\
  \ rekey filename` 命令更改加密文件的密码。该命令可以一次更改多个数据文件的密钥。它会提示输入原始密码，然后新密码。\n\n### Playbooks\
  \ 与 Ansible Vault\n\n```\n 1 $ ansible-playbook playbook.yml\n 2 TASK [include_vars]\
  \ *************************************\\\n 3 *************************************************fatal:\
  \ [localhost]: FAIL\\\n 4 ED! => {\"ansible_facts\": {}, \"ansible_included_var_files\"\
  \\\n 5 : [], \"changed\": false, \"message\": \"Attempting to decrypt\\\n 6  but\
  \ no vault secrets found\"}\n 7 \n 8 $ ansible-playbook --vault-id @prompt playbook.yml\n\
  \ 9 Vault password (default): password\n10 \n11 $ ansible-playbook --vault-password-file=vault-password.t\\\
  \n12 xt playbook.yml\n```\n\n运行访问 Ansible Vault 加密文件的 playbook，你需要为 `ansible-playbook`\
  \ 命令提供加密密码。如果不提供密码，playbook 将返回错误。要为 playbook 提供 vault 密码，请使用 `--vault-id` 选项。例如，如所示，通过交互方式提供\
  \ vault 密码可以使用 `--vault-id @prompt`。或者你也可以使用密码文件。\n\n### 总结\n\n在本模块中，我们探索了 Ansible\
  \ Vault 安全存储，用于在 Ansible 内部保存秘密和机信息。正如我们看到的，这些工具是非常健壮的并且完全集成在 Ansible 技术中。\n\n##\
  \ 条件\n\n在本模块中，我将向你解释什么是 Ansible 条件操作，以及你如何在每天的 Ansible Playbook 中使用它们。\n\n```\n\
  1 条件语句检查一个条件并根据情况改变程序的\\\n2 行为\n```\n\n让我们开始吧！为了编写出实用的代码，我们几乎总是需要检查条件的能力并相应地改变程序的行为。条件语句赋予了我们这种能力。Ansible\
  \ 的形式是“when”语句。Ansible 在条件判断中使用 Jinja2 测试和过滤器。Ansible 支持所有标准测试和过滤器，并添加了一些独特的测试。\n\
  \n### 使用“when”的基础条件判断\n\n- `conditional_basic_false.yml`\n\n```\n 1 ---\n 2 - name:\
  \ conditional_basic\n 3   hosts: all\n 4   vars:\n 5     configure_nginx: false\n\
  \ 6   tasks:\n 7     - name: reload nginx\n 8       ansible.builtin.service:\n 9\
  \         name: nginx\n10         state: reloaded\n11       when: configure_nginx\n\
  ```\n\n这是在 Ansible playbook 中使用“when”语句的基础用法示例。任务“reload ngnix”只有在 `configure_nginx`\
  \ 布尔变量被设置为“true”时才会执行。在这个例子中，它并非如此，因此我们预期的该任务会被跳过。让我们看看执行代码的输出。\n\n执行结果：\n\n```\n\
  \ 1 $ ansible-playbook -i inventory conditional_basic_false.y\\\n 2 ml\n 3 PLAY\
  \ [conditional_basic] ********************************\\\n 4 *********************************************************\\\
  \n 5 **********\n 6 TASK [Gathering Facts] **********************************\\\n\
  \ 7 *********************************************************\\\n 8 ********\n 9\
  \ ok: [host1.example.com]\n10 TASK [reload nginx] *************************************\\\
  \n 11 *********************************************************\\\n 12 *****\n 13\
  \ skipping: [host1.example.com]\n 14 PLAY RECAP **********************************************\\\
  \n 15 *****************************************************\n 16 host1.example.com\
  \       : ok=1    changed=0    unreachabl\\\n17 e=0    failed=0    skipped=1   \
  \ rescued=0    ignored=0 \n```\n\n这是执行 `conditional_basic_false.yml` 的输出。在这次执行中，play\
  \ 是针对“host1.example.com”节点执行的。输出用绿色和蓝色高亮。正如你所看到的，任务“reload nginx”被 Ansible 读取了，但根据我们的条件语句被跳过了。\n\
  \n- `conditional_basic_true.yml`\n\n```\n 1 ---\n 2 - name: conditional_basic\n\
  \ 3   hosts: all\n 4   vars:\n 5     configure_nginx: true\n 6   tasks:\n 7    \
  \ - name: reload nginx\n 8       ansible.builtin.service:\n 9         name: nginx\n\
  10         state: reloaded\n11       when: configure_nginx\n```\n\n这是在 Ansible playbook\
  \ 中使用“when”语句相同的的基础示例，但我们将变量值从“false”更改为了“true”。现在任务“reload ngnix”将执行执行，因为 `configure_nginx`\
  \ 布尔变量被设置为“true”。让我们看看这段代码的输出。\n\n执行结果：\n\n```\n 1 $ ansible-playbook -i inventory\
  \ conditional_basic_true.yml\n 2 PLAY [conditional_basic] ********************************\\\
  \n 3 *********************************************************\\\n 4 **********\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 *********************************************************\\\
  \n 7 ********\n 8 ok: [host1.example.com]\n 9 TASK [reload nginx] *************************************\\\
  \n 10 *********************************************************\\\n 11 *****\n 12\
  \ ok: [host1.example.com]\n 13 PLAY RECAP **********************************************\\\
  \n 14 *****************************************************\n 15 host1.example.com\
  \       : ok=2    changed=0    unreachabl\\\n16 e=0    failed=0    skipped=0   \
  \ rescued=0    ignored=0 \n```\n\n这是执行 `conditional_basic_true.yml` 的输出。在这次执行中，play\
  \ 是针对“host1.example.com”节点执行的。输出用绿色高亮。正如你所看到的，任务“reload ngnx”被 Ansible 读取了，并在我们的条件语句中成功执行。\n\
  \n### 基于 ansible_facts 的条件判断\n\n- `conditional_facts.yml`\n\n```\n1 ---\n2 - name:\
  \ conditional_facts\n3   hosts: all\n4   tasks:\n5   - name: Shut down Debian-like\
  \ systems\n6     ansible.builtin.command: /sbin/shutdown -t now\n7     when: ansible_facts['os_family']\
  \ == \"Debian\"\n```\n\n将条件判断和 facts 结合非常有用。因此你可以根据单个主机的条件、IP 地址、操作系统、文件系统状态等许多因素来调整代码的执行。在这个例子中，如果目标系统是类\
  \ Debian 系统的（即 Debian 和 Ubuntu 管理的主机），我们将执行关机。\n\n\n\n\n\n```\n 1 $ ansible-playbook\
  \ -i inventory conditional_facts.yml\n 2 PLAY [conditional_facts] ********************************\\\
  \n 3 *********************************************************\\\n 4 **********\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 *********************************************************\\\
  \n 7 ********\n 8 ok: [host1.example.com]\n 9 TASK [Shut down Debian-like systems]\
  \ ********************\\\n10 *********************************************************\\\
  \n11 **********************\n12 skipping: [host1.example.com]\n13 PLAY RECAP **********************************************\\\
  \n14 *****************************************************\n15 host1.example.com\
  \                  : ok=1    changed=0   \\\n16  unreachable=0    failed=0    skipped=1\
  \    rescued=0    i\\\n17 gnnored=0 \n```\n\n这是执行 `conditional_facts.yml` 后的输出。在本次执行中，该\
  \ play 是针对 `host1.example.com` 节点执行的。目标主机不是 Debian 类系统，因为你可以注意到名为 `Shut down Debian-like\
  \ systems` 的任务处于 `skipped`（跳过）状态。\n\n### 总结\n\n条件判断非常重要，因为它们允许我们创建响应某些事件、条件或 Ansible\
  \ Facts 的 Ansible Playbook。这些语句是智能 Ansible Playbook 的基础。\n\n## 循环 Loop\n\n在本章中，我将向你解释什么是\
  \ Ansible 循环操作，以及你如何在 Ansible Playbook 中每天使用它们。\n\n```\n1 循环自动化重复任务\n```\n\n计算机在自动化重复任务方面非常出色。在不产生错误的情况下重复相同或相似的任务是计算机擅长而人类不擅长的领域。\n\
  \n一组语句的重复执行被称为迭代。Ansible 有几个用于迭代的语句——`loop` 语句和 `with_items` 语句。`with` 语句依赖插件。\n\
  \n*   `loop_simple.yml`\n\n```\n 1 ---\n 2 - name: Check services\n 3   hosts: all\n\
  \ 4   tasks:\n 5   - name: httpd and mariadb are running\n 6     ansible.builtin.service:\n\
  \ 7       name: \"{{ item }}\"\n 8       state: started\n 9     loop:\n10      \
  \ - httpd\n11       - mariadb\n```\n\n简单的循环对列表中的每个项进行任务迭代。`loop` 语句被添加到任务中，并以任务应迭代的项列表作为其值。循环变量\
  \ `item` 在每次迭代中遍历当前值。\n\n*   `loop_hash_or_dict.yml`\n\n```\n 1 ---\n 2 - name:\
  \ Users exist and are in the correct groups\n 3   hosts: all\n 4   tasks:\n 5  \
  \ - name: Users exist and are in the correct groups\n 6     ansible.builtin.user:\n\
  \ 7       name: \"{{ item.name }}\"\n 8       state: present\n 9       groups: \"\
  {{ item.group }}\"\n10     loop:\n11       - name: alice\n12         group: wheel\n\
  13       - name: bob\n14         group: root\n```\n\n循环列表并不一定是一个简单值的列表。在接下来的示例中，列表中的每个项实际上是一个哈希（hash）或字典（dictionary）。示例中的每个哈希或字典都有两个键`name`\
  \ 和 `groups`，可以通过 `item.name` 和 `item.group` 变量分别获取当前项循环变量中的键值。\n\n### with_* 语句\n\
  \n*   `with_items`\n\n    类似于简单列表的 `loop`，适用于字符串列表或哈希/字典列表。如果提供了嵌套列表，则会扁平化为列表。\n\
  \n*   `with_file`\n\n    此关键字需要一个控制节点文件名列表。循环变量 `item` 持有文件的内容。\n\n*   `with_sequence`\n\
  \n    需要参数根据数值序列生成值列表。\n\n### loop_with_items.yml\n\n```\n 1 ---\n 2 - name: Example\
  \ with_items\n 3   hosts: all\n 4   vars:\n 5     data:\n 6       - alice\n 7  \
  \     - bob\n 8   tasks:\n 9   - name: Print values of data\n10     ansible.builtin.debug:\n\
  11       msg: \"{{ item }}\"\n12     with_items: \"{{ data }}\"\n```\n\n在 `loop_with_items.yml`\
  \ playbook 中，变量 `data` 是一个字符串列表。任务 `Print values of data` 使用 `with_items` 逐个迭代项并打印到屏幕上。\n\
  \n### 总结\n\n循环语句对于自动化重复任务非常有用。\n循环是成功的 Ansible Playbook 的基础。\n\n## Handler\n\n在本章中，我将向你解释什么是\
  \ Ansible Handler 语句，以及你如何在 Ansible Playbook 中每天使用它们。\n\n```\n1 Handler 在更改时运行操作\n\
  ```\n\nHandlers 对于幂等性（idempotency）非常重要。它们允许在需要时执行某些步骤，并在不需要执行时节省计算机周期。\n\n### rollingupdate.yml\n\
  \n```\n 1 ---\n 2 - name: Rolling update\n 3   hosts: all\n 4   become: true\n 5\
  \   tasks:\n 6     - name: latest apache httpd package is installed\n 7       ansible.builtin.yum:\n\
  \ 8         name: httpd\n 9         state: latest\n10       notify: restart apache\n\
  11 \n12   handlers:\n13     - name: restart apache\n14       ansible.builtin.service:\n\
  15         name: httpd\n16         state: restarted\n```\n\n`rollingupdate.yml`\
  \ 包含了任务和通知。当 `latest apache httpd package is installed` 执行成功时，它会 `notify` `restart\
  \ apache`。只有当 `handlers` 部分被触发时，`restart apache` 才会执行。\n\n## Role\n\n在本章中，我将向你解释什么是\
  \ Role，以及你如何在 Ansible Playbook 中每天使用它们。\n\n```\n1 Role 目录结构\n```\n\nRole 类似于传统编程中的函数。\n\
  \n### Role 目录树\n\n```\n 1 user.example/\n 2 ├── defaults/\n 3 3   └── main.yml\n\
  \ 4 ├── files/\n 5 ├── handlers/\n 6 6   └── main.yml\n 7 ├── meta/\n 8 8   └──\
  \ main.yml\n 9 ├── README.md\n 10 ├── tasks/\n 11 │   └── main.yml\n12 ├── templates/\n\
  \ 13 ├── tests/ main 1\n    ├──/\n 15 1   └── inventory\n 16 │   └── test.yml\n\
  \ 17 └── vars/\n18     └── main.yml\n```\n\n目录说明：\n\n*   `defaults`：`main.yml` 文件包含\
  \ role 变量的默认值，在使用 role 时可以覆盖。这些变量的优先级最低。\n*   `files`：此目录包含 role 任务引用的静态文件。\n* \
  \  `handlers`：`main.yml` 文件包含 role 的 handler 定义。\n*   `meta`：`main.yml` 文件包含关于 role\
  \ 信息，包括作者、许可证、平台和可选的角色依赖。\n*   `tasks`：`main.yml` 文件包含 role 的任务定义。\n*   `templates`：此目录包含\
  \ role 任务引用的 Jinja2 模板。\n*   `tests`：此目录可以包含一个用于测试 role 的 inventory 和 `test.yml`\
  \ playbook。\n*   `vars`：`main.yml` 文件定义 role 的变量值。这些变量通常用于 role 内部。这些变量的优先级较高，在\
  \ playbook 中使用时不打算更改。\n\n并不是每个 role 都有所有这些目录。\n\n### 在 playbook 中使用 Ansible roles\n\
  \n*   `./role_simple.yml`\n\n```yaml\n1 ---\n2 - name: role example\n3   hosts:\
  \ all\n4   roles:\n5     - role1\n6     - role2\n```\n\n```\n1 file name: role_simple.yml\n\
  2 Apply “role1” and “role2” to “all” managed hosts\n```\n\n*   `./role_vars.yml`\n\
  \n```yaml\n1 ---\n2 - name: role example\n3   hosts: all\n4   roles:\n5   - role:\
  \ role1\n6   - role: role2\n7     var1: value\n8     var2: value\n```\n\n```\n1\
  \ file name: role_vars.yml\n2 Apply “role1” and “role2” to “all” managed hosts\n\
  3 \n4 “Role2” 有两个变量参数\n```\n\n### 执行顺序\n\n*   `./role_vars.yml`\n\n\n\n\n\n```\n\
  \ 1 ---\n 2 - name: order of execution example\n 3   hosts: all\n 4   pre_tasks:\n\
  \ 5     - debug:\n 6         msg: 'pre-task'\n 7       notify: my handler\n 8  \
  \ roles:\n 9     - role1\n10   tasks:\n11     - debug:\n12         msg: 'first task'\n\
  13       notify: my handler\n14   post_tasks:\n15     - debug:\n16         msg:\
  \ 'post-task'\n17       notify: my handler\n18   handlers:\n19     - name: my handler\n\
  20       debug:\n21         msg: Running my handler\n```\n\n对于 playbook 中的每个 play（剧本），任务（tasks）按照\
  \ `tasks` 列表中的顺序执行。在所有任务执行后，将执行任何被通知的处理器（handlers）。\n\n当向 play 添加一个 role 时，该 role\
  \ 的任务会被添加到 `tasks` 列表的开头。如果 play 中包含了第二个 role，其任务列表将添加到第一个 role 之后。\n\nrole 处理器（role\
  \ handlers）添加到 play 的方式与 role 任务添加到 play 的方式相同。每个 play 定义了一个 `handlers` 列表。role\
  \ 处理器首先添加到 `handlers` 列表中，然后是 play 中 `handlers` 部分定义的任何处理器。在某些情况下，可能需要在执行 role 之前执行某些\
  \ play 任务。为了支持此类场景，可以为 play 配置 `pre_tasks` 部分。此部分中列出的任何任务都会在任何 role 执行之前执行。如果这些任务中的任何一个通知了处理器，则这些处理器任务将在\
  \ role 或普通任务之前执行。\n\nplay 还支持 `post_tasks` 关键字。这些任务在 play 的普通任务之后执行，并且它们通知的任何处理器也会运行。\n\
  \n## Ansible Galaxy\n\n- [`galaxy.ansible.com/`](https://galaxy.ansible.com/)\n\n\
  ### 手动从 Ansible Galaxy 安装 Roles\n\n```\n1 $ ansible-galaxy install geerlingguy.redis\
  \ -p roles/\n```\n\n### 从 Ansible Galaxy 的 requirements.yml 安装 Roles\n\n- `./requirements.yml`\n\
  \n```\n1 - src: geerlingguy.redis\n2   version: \"1.5.0\"\n```\n\n```\n1 $ ansible-galaxy\
  \ install -r roles/requirements.yml  -p ro\\\n2 les\n```\n\n## Ansible 最佳实践\n\n\
  遵循 Ansible 最佳实践可以确保代码成功执行，简化故障排除，并对你的自动化之旅产生积极影响。\n\n### 使用空格\n\n在你的 YAML 代码中使用空格（spaces）而不是制表符（tabs）。在每个块或任务之前添加新行可以使\
  \ playbook 易于易读。\n\n例如：\n\n* 错误 (WRONG)\n\n```\n1 ---\n2 - hosts: all\n3   tasks:\n\
  4   - ansible.builtin.yum:\n5       name: httpd\n6       state: latest\n7   - name:\
  \ end message\n8     ansible.builtin.debug:\n9       msg: \"httpd succesfully installed\"\
  \n```\n\n* 正确 (CORRECT)\n\n```\n 1 ---\n 2 - hosts: all\n 3   tasks:\n 4   - ansible.builtin.yum:\n\
  \ 5       name: httpd\n 6       state: latest\n 7 \n8   - name: end message\n 9\
  \     ansible.builtin.debug:\n10       msg: \"httpd succesfully installed\"\n```\n\
  \n### 为每个步骤分配“名称 (name)”\n\n始终为你代码中的每个 Ansible 语句（Ansible Plays, Tasks, Blocks）设置\
  \ `name` 参数。\n\n例如：\n\n* 错误 (WRONG)\n\n```\n1 ---\n2 - hosts: all\n3   tasks:\n\
  4   - ansible.builtin.yum:\n5       name: httpd\n6       state: latest\n```\n\n\
  * 正确 (CORRECT)\n\n```\n1 ---\n2 - name: install apache\n3   hosts: all\n4   tasks:\n\
  5     - name: install apache packages\n6       ansible.builtin.yum:\n7         name:\
  \ httpd\n8         state: latest\n```\n\n### 为变量使用人类可读且有意义的名称\n\n变量对于存储参数或保存上一个任务的结果来说非常重要。\n\
  \n使用人类可读且有意义的名称可以增加团队之间代码的复用性和可读性。\n\n也可以使用 `ansible-playbook` 命令的 `–extra-vars`\
  \ 额外变量参数在执行时覆盖变量。\n\n例如：\n\n* 错误 (WRONG)\n\n```\n1 httpkeepalive: 25\n2 webpo: 80\n\
  3 aaaa: 8080\n```\n\n* 正确 (CORRECT)\n\n```\n1 apache_max_keepalive: 25\n2 apache_port:\
  \ 80\n3 tomcat_port: 8080\n```\n\n### 使用原生 YAML\n\n使用原生 YAML 可以提高代码可读性，并让你更更快、更容易地发现错误。它还允许使用一些\
  \ YAML 检查器（linter）和解析器进行验证。\n\n例如：\n\n* 错误 (WRONG)\n\n```\n1 - name: install apache\n\
  2   ansible.builtin.yum:\n3     name: apache-{{ apache_version }} state=present\
  \ updat\\\n4 e_cache=yes disable_gpg_check=yes enablerepo=apache\n5   notify: restart\
  \ apache\n```\n\n* 正确 (CORRECT)\n\n```\n1 - name: install apache\n2   ansible.builtin.yum:\
  \ apache-{{ apache_version }}\n3     state: present\n4     update_cache: yes\n5\
  \     disable_gpg_check: yes\n6     enablerepo: apache\n7   notify: restart apache\n\
  ```\n\n### 使用原生模块代替运行命令\n\n始终优先使用原生模块。原生模块为幂等性（idempotency）而构建，内部包含逻辑。\n\n`command`、`shell`\
  \ 和 `raw` 应该作为最后的手段。\n\n例如：\n\n* 错误 (WRONG)\n\n```\n1 - name: install apache\n2\
  \   ansible.builtin.yum:\n3       name: apache-{{ apache_version }} state=present\
  \ update_cache=yes disable____=_check=ereerepoerepo=apache\n```\n\n* 正确 (CORRECT)\n\
  \n```\n1 - name: install apache\n2   ansible.builtin.yum: apache-{{ apache_version\
  \ }}\n3     state: present\n4     update_cache: yes\n5     disable_gpg_check: yes\n\
  6     enablerepo: apache\n7   notify: restart apache\n```\n\n\n\n\n添加一个注释（以“#”开头的行），帮助他人（可能也未来的你自己）理解某个语句、play\
  \ 或任务（或变量设置）的作用、如何实现它以及为什么要这么做。\n\n# 安装 Ansible\n\n在本章中，你将发现如何在现在最常用的操作系统中安装 Ansible。\n\
  \n## Ansible 术语 - ansible 与 ansible-core 包\n\n什么是 `ansible-core`？什么是 ansible 社区包？在\
  \ Ansible 2.9 版本之后，Ansible 项目发生了什么变化？目前 ansible 社区和 `ansible-core` 包的概述及使用用例。\n\n\
  ### 什么是 `ansible-core`？什么是 ansible 社区包？\n\n在 Ansible 2.9 版本之后，Ansible 项目发生了什么变化？\n\
  \n今天我们将讨论 2021 年以来发布的 ansible 社区和 `ansible-core` 包。\n\n### ansible vs ansible-core\n\
  \n在 2.9 版本之后， ansible 发生了什么变化？\n\n从 2.10 版本开始，Ansible 分发两个交付物：一个名为 `ansible` 的社区包，以及一个极简的语言和运行时\
  \ `ansible-core`（在 2.10 版本中称为 `ansible-base`）。选择符合你特定需求的 Ansible 风格和版本。\n\n`ansible`\
  \ 包包含了 Ansible 语言和运行时，以及一系列社区策选的集合（Collections）。它重现并扩展了 Ansible 2.9 中包含的功能。\n\n\
  你可以选择以下任何方式安装 Ansible 社区包：\n\n* 使用你操作系统的包管理器安装最新发布版本（适用于 Red Hat Enterprise Linux、CentOS、Fedora、Debian\
  \ 或 Ubuntu）。\n* 使用 `pip`（Python 包管理器）安装。\n\n#### Ansible 社区包发布周期\n\nAnsible 社区团队通常每年发布两个主要版本的社区包，采用灵活的发布周期，该周期落后于\
  \ `ansible-core` 的发布。该周期可以延长，以便在发布新版本可用之前，对较大的更改进行适当的实现和测试。请查看 Ansible 路线图（Road\
  \ map）以获取即将发布的详细信息。在主要版本之间，Ansible 团队每三周会发布一个新的 Ansible 社区包小版本。小版本包含新的、向后兼容的特性、模块和插件，以及错误修复。\n\
  \n从 2.10 版本开始，Ansible 社区团队保证一次仅维护一个主要的社区包版本。例如，当 Ansible 5.0.0 发布时，团队将停止发布新的 4.x\
  \ 版本。社区成员可以根据需要维护旧版本。\n\n### ansible community\n\n* 使用新版本命名（2.10，然后是 3.0.0）\n* 遵循语义版本化规则\n\
  * 不使用语义版本化\n* 一次仅维护一个版本\n* 包含语言、运行时和指定的 Collections\n* 在 Collection 仓库中开发和维护\n\n\
  #### ansible-core (曾为 ansible-base 2.10)\n\n* 继续使用“经典 Ansible”版本命名（2.11，然后是 2.12）\n\
  * 不使用语义版本化\n* 维护最新版本加上两个旧版本\n* 包含语言、运行时和内置插件\n* 在 `ansible/ansible` 仓库中开发和维护\n\n\
  ### ansible-core\n\n`ansible-core` 包主要用于只想安装所需集合的开发者和用户。\n\n#### 什么是 `ansible-core`\
  \ 包？\n\nAnsible Core 是一个命令行工具，主要用于只想安装所需集合的开发者和用户。\n\n它包含极少量的模块和插件，并允许安装其他 Collections。虽然与\
  \ Ansible 2.9 类似，但不包含此后已移动到 Collection 中的内容。\n\nAnsible core 或 `ansible-core` 是\
  \ Ansible 的主要构建模块和架构，包括：\n\n* CLI 工具，如 `ansible-playbook`、`ansible-doc.` 等，用于驱动和与自动化交互。\n\
  * Ansible 语言使用 YAML 为开发 Ansible Playbooks 创建一套规则，并包括条件判断、块（blocks）、包含、循环和其他 Ansible\
  \ 指令等函数。\n* 一个允许通过 Ansible collections 进行扩展的架构框架。\n\n`ansible-core` 大约每半年发布一次新的大版本。\n\
  \n### ansible community\n\nAnsible 社区包提供了 Ansible 2.9 的功能，包含 85 多个 collections，其中包含数千模块和插件。\n\
  \n#### 什么是 ansible 社区包？\n\nAnsible 社区包的每个主要版本都会接受包含的每个 Collection 的最新发布版本以及 `ansible-core`\
  \ 的最新发布版本。\n\nAnsible 社区包的主要版本可能包含包含 Collections 中的模块和其他插件，以及/或核心功能中的破坏性更改（breaking\
  \ changes）。\n\nAnsible 包依赖于 `ansible-base`（很快变为 `ansible-core`）。所以当你执行 `pip install\
  \ ansible` 时，`pip` 会自动安装 `ansible-core`。\n\nAnsible 3.0.0 及后续版本包含更多的 Collections，这归功于广泛的\
  \ Ansible 社区根据社区清单审查 Collections。\n\n### Links\n\n* [Ansible 3.0.0 问答](https://www.ansible.com/blog/ansible-3.0.0-qa)\n\
  * [发布与维护](https://docs.ansible.com/ansible/devel/reference_appendices/release_and_maintenance.html)\n\
  * [安装 Ansible](https://docs.ansible.com/ansible/latest/installation_guide/intro_installation.html)\n\
  * [Ansible 社区变更日志](https://docs.ansible.com/ansible/devel/reference_appendices/release_and_maintenance.html#ansible-community-changelogs)\n\
  * [Ansible Core 文档](https://docs.ansible.com/ansible-core/devel/index.html)\n* [pip\
  \ install ansible-core](https://pypi.org/project/ansible-core/)\n* [pip install\
  \ ansible](https://pypi.org/project/ansible/)\n\n## 在 RedHat Enterprise Linux (RHEL)\
  \ 8 上使用 Ansible Engine 安装 Ansible\n\n使用 Ansible Engine 软件集合在 Red Hat Enterprise\
  \ 8 上安装最新版本的 Ansible。\n\n我将向你展示如何使用发行工具在 RHEL 8 内部安装和维护 Ansible。\n\n### 在 RHEL 8\
  \ 中安装 Ansible\n\n使用发行工具在 Red Hat Enterprise 版本 8 内部安装和维护 Ansible。包含 Ansible 的仓库被称为\
  \ Ansible Engine 软件集合 `ansible-2.9-for-rhel-8-x86_64-rpms`。使用软件集合的主要优势是你不需要任何外部仓库（如\
  \ EPEL）。软件集合由 Red Hat 完全支持并包含在你的订阅计划中。\n\n### Demo\n\n在 RHEL8 中安装最新版本的 Ansible。\n\
  \n```bash\n1 #!/bin/bash\n2 sudo subscription-manager register\n3 sudo subscription-manager\
  \ repos --enable ansible-2.9-for\n4 rhel-8-x86_64-rpms\n5 sudo yum install ansible\n\
  ```\n\n## 在 Ubuntu 20.04 上安装 Ansible\n\n使用 universe 和 PPA 仓库在 Ubuntu 20.04 LTS 上安装\
  \ Ansible。\n\n今天我们将讨论如何使用发行工具在 ubuntu 20.04 内部安装和维护 Ansible。\n\n### 在 Ubuntu 20.04\
  \ 中安装 Ansible\n\n我们将看到如何使用发行工具在 Ubuntu 内部安装和维护 Ansible。\n\n我们将看到如何通过两种方式安装 Ansible。\n\
  \n#### 第一种方法：Universe 仓库\n\n```bash\n1 #!/bin/bash\n2 sudo apt update\n3 sudo apt\
  \ install ansible\n```\n\n#### 第二种方法：PPA 仓库\n\n安装 Ansible 的第二种方法是使用 PPA 仓库。请记住，添加额外的仓库其软件质量保证会有不同。\n\
  \n\n\n\n\n#### 代码 PPA\n\n```\n1 #!/bin/bash\n2 sudo apt update\n3 sudo apt install\
  \ software-properties-common\n4 sudo add-apt-repository --yes --update ppa:ansible/ansible\n\
  5 sudo apt remove ansible\n6 sudo apt install ansible-base\n```\n\n### 如何在 Fedora\
  \ 35 中安装 Ansible\n\n如何使用默认仓库在 Fedora 35 中安装和维护最新版本的 Ansible，并附带实际演示。\n\n### 如何在\
  \ Fedora 35 中安装 Ansible\n\n让我们在 Fedora 35 中安装 Ansible。\n\n好消息是 Ansible 包含在默认仓库中，因此你可以使用常规的包管理器轻松安装它。\n\
  \n你可以在更新仓库中找到最新版本的 Ansible。\n\n目前可用的最新版本是 2.9。\n\n### 演示\n\n如何在 Fedora 中安装最新版本的\
  \ Ansible。\n\n#### 代码\n\n*   `install-Ansible-Fedora.sh`\n\n```\n1 #!/bin/bash\n\
  2 $ sudo dnf list available ansible\n3 $ sudo dnf install ansible\n4 $ sudo \"rpm\
  \ -qa | grep ansible\"\n5 $ sudo dnf list ansible\n```\n\n#### 执行\n\n\n\n\n\n```bash\n\
  ssh devops@fedora.example.com\n[devops@demo ~]$ sudo su\n[root@demo devops]# cat\
