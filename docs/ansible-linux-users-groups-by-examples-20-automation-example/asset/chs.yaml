  \n```\n 1 ---\n 2 - name: uri module demo\n 3   hosts: all\n 4   become: false\n\
  \ 5   vars:\n 6     server: \"https://reqres.it\"\n 7     endpoint: \"/api/users?page=2\"\
  \n 8   tasks:\n 9     - name: list users\n10       ansible.builtin.user:\n11   \
  \      url: \"{{ server }}{{ endpoint }}\"\n12         method: GET\n13         status_code:\
  \ 200\n14         timeout: 30\n15       register: result\n16 \n17     - name: debug\n\
  18       ansible.builtin.debug:\n19         var: result.json\n```\n\n#### 错误执行\n\
  \n```\n 1 $ ansible-playbook -i virtualmachines/demo/inventory trou\\\n 2 bleshooting/urlopen_error.yml\n\
  \ 3 PLAY [uri module demo] *********************************\\\n 4 *************************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 *************************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [list users] ***************************************\\\
  \n 9 *************************************************\n10 fatal: [demo.example.com]:\
  \ FAILED! => {\"changed\": false, \\\n11 \"elapsed\": 15, \"msg\": \"Status code\
  \ was -1 and not [200]: \\\n12 Request failed: <urlopen error [Errno -2] Name or\
  \ service\\\n13 not known>\", \"redirected\": false, \"status\": -1, \"url\": \\\
  \n14 https://reqres.it/api/users?page=2\"}\n15 PLAY RECAP **********************************************\\\
  \n 16 ***********************\n17 demo.example.com           : ok=1    changed=0\
  \    unreach\\\n18 able=0    failed=1    skipped=0    rescued=0    ignored=0\n```\n\
  \n#### 修复代码\n\n* `urlopen_fix.yml`\n\n```\n 1 ---\n 2 - name: uri module demo\n\
