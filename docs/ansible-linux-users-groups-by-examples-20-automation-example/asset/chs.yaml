  \n 4     ],\n 5     \"ansible_all_ipv6_addresses\": [\n 6         \"REDACTED IPV6\
  \ ADDRESS\"\n 7     ],\n 8     \"ansible_apparmor\": {\n 9         \"status\": \"\
