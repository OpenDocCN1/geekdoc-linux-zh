  \n\n\n\n本书可在 [`leanpub.com/ansiblelinuxusersandgroupsbyexamples`](http://leanpub.com/ansiblelinuxusersandgroupsbyexamples)\
  \ 购买\n\n此版本发布于 2022-04-04\n\n![出版者标志](img/leanpub-logo.png)\n\n* * * * * * *\n\n\
  这是一本 [Leanpub](https://leanpub.com) 书籍。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版社助力。[精益出版](https://leanpub.com/manifesto)\
  \ 是使用轻量级工具和多次迭代来出版进行中的电子书，以获取读者反馈，不断调整直到你获得正确的书籍，并在成功后建立影响力。\n\n* * * * * * *\n\n\
  \n\n# 简介\n\n本书提供了对 Ansible 语言的介绍。\n\nAnsible 是一种流行的开源 IT 自动化技术，用于广泛领域的应用程序脚本编写。\n\
  \n它是免费、可移植、功能强大，而且使用起来非常简单且有趣。\n\n本书是一本通过一些真实示例来学习 Ansible 自动化技术的工具。\n\n无论你是自动化领域的新手还是希望成为一名专业的自动化工程师，本书的目标都是让你快速掌握核心\
  \ Ansible 语言的基础知识。\n\n如今，每一个成功的的 IT 部门都需要为裸机服务器、虚拟机、云提供商、容器和边缘计算实现自动化。使用 Ansible\
  \ 自动化技术让你的 IT 旅程自动化。\n\n我将通过一个又一个示例教你如何完成最常见的系统管理员任务。\n\n你将首先学习如何使用常用的包管理器和归档，在\
  \ Red Hat Enterprise Linux、Ubuntu 和 macOS 上安装 Ansible。\n\n20 多个课程中的每一个节课都总结了一个关于用户和组管理的特定场景：创建用户、创建一对合适的\
  \ SSH 密钥和主目录、更改密码并指定加密算法、删除主目录和邮件邮箱，或为临时禁用的用户分配特殊的 `nologin` shell。另一个非常常见的用户场景是当你只需要临时禁用和启用一个用户时。另一个实用的管理员工具是组管理，用于为一组用户分配资源权限。\n\
  \n你可以轻松地用你的用户名自定义示例代码并在日常工作中使用，而无需任何额外努力。\n\n有一些 Ansible 代码适用于所有 Linux 系统和 macOS，并已经经过了类\
  \ RedHat 节点和类 Debian 系统的实战测试。\n\n10 多个 Ansible 故障排除课程将教你如何阅读错误信息、如何复现，以及故障排除和解决的过程。\n\
  \n你准备好用 Ansible 自动化你的日常了吗？\n\n## 谁是 Luca Berton\n\n我是 Luca Berton，我们将一起度过许多时光。\n\
  \n首先，让我介绍一下我自己。\n\n我曾是红帽公司的 Ansible 技术支持工程师，位于捷克共和国，尽管我是意大利人。\n\n我有 15 年以上的系统管理经验，从事基础设施工作，无论是本地还是主要的云提供商平台。\n\
  \n我是开源的热热爱好者，通过在不同的公共活动中分享我的知识来支持社区。\n\n我还是家乡 Linux 用户组的联合创始人，自由软件运动创始人 Richard\
  \ Stallman 曾访问过该小组。\n\n我认为自己是一个懒人，所以我总是尝试用新方法来自动化我工作中重复性的任务。\n\n在多年 Perl、Bash 和\
  \ Python 脚本编写后，我接触了 Ansible 技术。我通过了认证并与 Ansible 工程师团队工作了一年多。\n\n我认为 Ansible 是目前最好的基础设施自动化技术，它是人类可读的，学习曲线易于接受，并且非常受市场招聘者的青睐。\n\
  \n这份终极指南包含了使用 Ansible 自动化的所有显而易见和不显见的解决方案。\n\n在课程的每一节中，我将与你分享一个特定的用例、可能的解决方案、代码、执行以及目标系统的验证。\n\
  \n所有这些解决方案都经过了实战测试，并被我用于日常自动化。\n\n你可以轻松地在课程之间跳转，并在需要时随时回顾。\n\n### 奖项与认可\n\n####\
