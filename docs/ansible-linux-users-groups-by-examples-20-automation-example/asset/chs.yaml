  \ Ansible 故障排除 - 目标不存在\n\n如何在 Ansible 故障排除中重现 `destination does not exist`（目标不存在）错误，并进行修复以便能够在你的\
  \ Ansible Playbook 中从 URL 成功下载文件。`dest` 参数中的本地路径会导致 `destination does not exist`\
  \ 错误。\n\n另参阅：下载文件 - Ansible 模块 get_url\n\n### 演示\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，向你直观展示\
  \ `destination does not exist` 错误以及如何解决它\n\n#### 错误代码\n\n```yaml\n1 ---\n2 - name:\
  \ get_url module demo\n3   hosts: all\n4   become: false\n5   vars:\n6     myurl:\
  \ \"https://releases.ansible.com/ansible-2.9.25.tar.gz\"\n7     mycrc: \"sha256:https://releases.ansible.com/ansible-2.9.25.tar.gz.sha\"\
  \n8     mydest: \"ansible-2.9.25.tar.gz\"\n9   tasks:\n10     - name: download file\n\
  11       ansible.builtin.get_url:\n12         url: \"{{ myurl }}\"\n13         dest:\
  \ \"{{ mydest }}\"\n14         checksum: \"{{ mycrc }}\"\n15         mode: '0644'\n\
  ```\n\n#### 错误执行\n\n```\n 1 $ ansible-playbook -i virtualmachines/demo/inventory\
  \ troubleshooting/destinationnotexist_error.yml\n 2 PLAY [get_url module demo] *****************************\n\
  ***********************************\n 3 TASK [Gathering Facts] ***********************************\n\
  ***********************************\n 4 ok: [demo.example.com]\n 5 TASK [download\
  \ file] ***********************************\n***********************************\n\
  \ 6 fatal: [demo.example.com]: FAILED! => {\"changed\": false, \"checksum_dest\"\
  : null, \"checksum\": \"574e24659f55fe370571167d3d44761f73\", \"dest\": \"ansible-2.9.25.tar.gz\"\
  , \"elapsed\": 3, \"msg\": \"Destination does not exist\", \"src\": \"/home/devops/.ansible/tmp/ansible-tmp-164055219.326019-1431-267536126421544/tmp_raid\"\
  , \"url\": \"https://releases.ansible.com/ansible-2.9.25.tar.gz\"}\n 7 PLAY RECAP\
  \ **********************************************\n***********************************\n\
  \ 8 demo.example.com           : ok=1    changed=0    unreachable=0    failed=1\
