  \n使用 `DNF` 和“AppStream”系统仓库在 CentOS 9 Stream 中安装最新版本的 Ansible 并保持更新的简单方法。\n\n###\
  \ 如何在 CentOS Stream 9 中安装 Ansible\n\n* 系统 AppStream 仓库中的 `ansible-core`\n* 用于企业\
  \ Linux 的额外软件包 - `EPEL Next` 附加软件包\n\n在 CentOS Stream 版本 9 中安装和维护 Ansible 的简单方法是使用系统\
  \ `AppStream` 仓库。\n\n另一种方法是使用额外的 `EPEL Next` 仓库。该仓库由 Fedora 特别兴趣小组维护，为 CentOS Stream\
  \ 管理了一组高质量的额外软件包，类似于针对 Red Hat Enterprise Linux (RHEL)、CentOS、Scientific Linux (SL)\
  \ 以及 Oracle Linux (OL) 目标的 Extra Packages for Enterprise Linux (EPEL) 额外软件包。\n\n\
  ### 链接\n\n* [CentOS Stream 下载](https://www.centos.org/centos-stream/)\n* [EPEL 9\
  \ 现在可用](https://communityblog.fedoraproject.org/epel-9-is-now-available/)\n* [介绍\
  \ CentOS Stream 9](https://blog.centos.org/2021/12/introducing-centos-stream-9/)\n\
  * [用于企业 Linux 的额外软件包 (EPEL)](https://docs.fedoraproject.org/en-US/epel/)\n\n###\
  \ 演示\n\n通过 AppStream 系统仓库在 CentOS Stream 版本 9 中安装 Ansible。\n\n#### 代码\n\n* `Install-Ansible-CentOS-Stream9.sh`\n\
  \n```\n1 #!/bin/bash\n2 sudo dnf install ansible-core\n```\n\n#### 执行\n\n\n\n\n\n\
