  \         使用 become 运行操作（不包含\\\n17 t 密码提示）\n18 ansible-pilot $ ansible-playbook\
  \ -i demo/inventory troubl\\\n19 eshooting/miss\\\n```\n*(注：提供的故障排除部分原始文本在源码中被截断；我已格式化了可用部分。)*\n\
  \n\n\n\n\n```\n 1 ---\n 2 - name: service module demo\n 3   hosts: all\n 4   become:\
  \ true\n 5   tasks:\n 6     - name: sshd restart\n 7       ansible.builtin.service:\n\
  \ 8         nme: sshd\n 9         state: restarted\n10         enabled: true\n```\n\
  \n在这个示例中，参数 `nme` 不存在，导致 Ansible 出现致命错误。解决方法很简单，仅仅是一个拼写错误！\n\n## Fix code\n\n* \
  \  `missingparam_fix.yml`\n\n```\n 1 ---\n 2 - name: service module demo\n 3   hosts:\
  \ all\n 4   become: true\n 5   tasks:\n 6     - name: sshd restart\n 7       ansible.builtin.service:\n\
  \ 8         name: sshd\n 9         state: restarted\n10         enabled: true\n\
  ```\n\n## Ansible 故障排除 - 下载失败\n\n从互联网下载内容时，有时可能会收到 `failure downloading` 错误。根本通常是\
  \ URL 拼写错误或网站移动了内容。此错误大多数情况下是由 HTTP 404 错误引起的。在 Ansible 中使用 URL 之前，请在浏览器中双检查。\n\n\
  ### demo\n\n错误的（HTTP 404 错误）URL 会导致 Ansible 错误 `failure downloading`。\n\n### code\n\
  \n*   `failuredownloading_error.yml`\n\n```\n 1 ---\n 2 - name: unarchive module\
  \ demo\n 3   hosts: all\n 4   become: false\n 5   vars:\n 6     myurl: \"https://github.com/lucab85/ansible-pilot/arch\\\
  \n 7 ive/refs/master.zip\"\n 8   tasks:\n 9     - name: extract archive\n10    \
  \   ansible.builtin.unarchive:\n11         src: \"{{ myurl }}\"\n12         dest:\
  \ \"/home/devops/\"\n13         remote_src: true\n14         validate_certs: true\n\
  ```\n\n*   `failuredownloading_fix.yml`\n\n```\n 1 ---\n 2 - name: unarchive module\
  \ demo\n 3   hosts: all\n 4   become: false\n 5   vars:\n 6     myurl: \"https://github.com/lucab85/ansible-pilot/arch\\\
  \n 7 ive/refs/heads/master.zip\"\n 8   tasks:\n 9     - name: extract archive\n\
  10       ansible.builtin.unarchive:\n11         src: \"{{ myurl }}\"\n12       \
  \  dest: \"/home/devops/\"\n13         remote_src: true\n14         validate_certs:\
  \ true\n```\n\n## Ansible 故障排除 - chgrp 失败\n\n当你尝试更改文件权限时，你的 Ansible Playbook 可能会出现\
  \ \"chgrp failed\" 错误。让我们一起调查为什么发生这个错误以及如何解决！\n\n### demo\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，向你实际展示\
  \ chgrp failed 错误以及如何解决它！\n\n### code\n\n```\n1 # groups devops\n2 devops : wheel\n\
  3 # useradd -a -G users devops\n4 # groups devops\n5 devops : wheel users\n6 # id\
  \ devops\n7 uid=1001(devops) gid=10(wheel) groups=10(wheel),100(users)\n```\n\n\
  ## Ansible 故障排除 - not a valid attribute for a Play 错误\n\n如何重现、排除并修复“not a valid\
  \ attribute for a Play”错误。\n\n### demo\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，向你实际展示 `not\
  \ a valid attribute for a Play` 错误以及如何解决它！\n\n### error code\n\n*   `invalid_play_attribute_error.yml`\n\
  \n```\n 1 ---\n 2 - name: file module demo\n 3   hosts: all\n 4   vars:\n 5    \
  \ myfile: \"~/example.txt\"\n 6   task:\n 7     - name: Creating an empty\n 8  \
  \     ansible.builtin.file:\n 9         path: \"{{ myfile }}\"\n10         state:\
  \ touch\n```\n\n### error execution\n\n*   output\n\n```\n 1 $ ansible-playbook\
  \ -i demo/inventory troubleshooting/inva\\\n 2 lid_play_attribute_fix.yml\n 3 ERROR!\
  \ 'task' is not a valid attribute for a Play\n 4 The error appears to be in 'ansible-pilot/troubleshooting\\\
  \n 5 /invalid_play_attribute_error.yml': line 2, column 3, but\\\n 6  may\n 7  be\
  \ elsewhere in the file depending on the exact syntax pr\\\n 8 oblem.\n 9 The offending\
  \ line appears to be:\n10  - -\n11 - name: file module demo\n12  ^ here\n```\n\n\
  ### fix code\n\n*   `invalid_play_attribute_fix.yml`\n\n```\n 1 ---\n 2 - name:\
  \ file module demo\n 3   hosts: all\n 4   vars:\n 5     myfile: \"~/example.txt\"\
  \n 6   tasks:\n 7     - name: Creating an empty\n 8       ansible.builtin.file:\n\
  \ 9         path: \"{{ myfile }}\"\n10         state: touch\n```\n\n### fix execution\n\
  \n```\n 1 $ ansible-playbook -i demo/inventory troubleshooting/inva\\\n 2 lid_play_attribute_fix.yml\n\
  \ 3 PLAY [file module demo] *********************************\\\n 4 ************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ************************************\n\
  \ 7 ok: [example.com]\n 8 TASK [Creating an file] ***************************\\\n\
  \ 9 ************************************\n10 changed: [example.com]\n 11 PLAY RECAP\
  \ **********************************************\\\n 12 ************************************\n\
  13 demo.example.com           : ok=2    changed=1    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n\n\n\n\n```\n 1 $ ansible-playbook\
  \ -i demo/inventory troubleshooting/temp\\\n 2 late_error_string_fix.yml\n 3 PLAY\
  \ [file module demo] *********************************\\\n 4 *********************************************************\\\
  \n 5 *********************************************************\\\n 6 *********************************************************\n\
  \ 7 TASK [Gathering Facts] **********************************\\\n 8 *********************************************************\\\
  \n 9 *********************************************************\\\n10 *****************************************\n\
  11 ok: [demo.example.com]\n12 TASK [Creating an empty file] ***************************\\\
  \n 13 *********************************************************\\\n 14 *********************************************************\\\
  \n 15 *****************************************\n16 changed: [demo.example.com]\n\
  17 PLAY RECAP **********************************************\n18 demo.example.com\
  \           : ok=2    changed=1    unreach\\\n19 able=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\n```\n\n# Ansible 故障排除 - 无密码账户\n\n如何复现“usermod: unlocking\
  \ the user’s password would result in a passwordless account.”错误以及如何解决它！\n\n###\
  \ demo\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，向您直观地展示 `usermod: unlocking the user's password\
  \ would result in a passwordless account.` 错误以及其解决方法！\n\n#### 错误代码\n\n*   `passwordless_error.yml`\n\
  \n```yaml\n 1 ---\n 2 - name: user module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   vars:\n 6     myuser: \"example\"\n 7   tasks:\n 8     - name: create a disabled\
  \ user\n 9       ansible.builtin.user:\n10         name: \"{{ myuser }}\"\n11  \
  \       state: present\n12         password_lock: true\n13 - name: enable user\n\
  14       ansible.builtin.user:\n15         name: \"{{ myuser }}\"\n16         state:\
  \ present\n17         password_lock: false\n```\n\n#### 错误验证\n\n在目标系统中验证不存在名为 example\
  \ 用户：\n\n```bash\n1 $ ssh devops@demo.example.com\n2 Last login: Tue Oct  5 09:35:24\
  \ 2021 from 192.168.0.100\n3 [devops@demo ~]$ sudo su -\n4 Last login: Tue Oct \
  \ 5 09:34:55 UTC 2021 on pts/0\n5 [root@demo ~]# getent passwd | grep example\n\
  6 [root@demo ~]# exit\n7 logout\n8 [devops@demo ~]$ exit\n9 logout\n```\n\n####\
  \ 错误执行\n\n输出\n\n```bash\n 1 $ ansible-playbook -i demo/inventory troubleshooting/pass\\\
  \n 2 wordless_error.yml\n 3 PLAY [user module demo] *********************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 7 ok: [demo.example.com]\n\
  \ 8 TASK [create a disabled user] ***************************\n10 changed: [demo.example.com]\n\
  11 TASK [enable user] **************************************\n13 fatal: [demo.example.com]:\
  \ FAILED! => {\"changed\": false, \\\n14 \"msg\": \"usermod: unlocking the user's\
  \ password would resu\\\n15 lt in a passwordless account.\\nYou should set a password\
  \ \\\n16 with usermod -p to unlock this user's password.\\n\", \"name\\\n17 \":\
  \ \"example\", \"rc\": 1}\n18 PLAY RECAP **********************************************\n\
  20 demo.example.com           : ok=2    changed=1    unreach\\\n21 able=0    failed=1\
  \    skipped=0    rescued=0    ignored=\n```\n\n#### 修复代码\n\n*   `passwordless_fix.yml`\n\
  \n```yaml\n 1 ---\n 2 - name: user module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   vars:\n 6     myuser: \"example\"\n 7     mypassword: \"password\"\n 8   tasks:\n\
  \ 9     - name: create a disabled user\n10       ansible.builtin.user:\n11     \
  \    name: \"{{ myuser }}\"\n12         state: present\n13         password_lock:\
  \ true\n14 - name: enable user\n15       ansible.builtin.user:\n16         name:\
  \ \"{{ myuser }}\"\n17         password: \"{{ mypassword | password_hash('sha512'\\\
  \n18 ) }}\"\n19         state: present\n20         password_lock: false\n```\n\n\
  #### 修复执行\n\n输出\n\n```bash\n 1 $ ansible-playbook -i demo/inventory troubleshooting/pass\\\
  \n 2 wordless_fix.yml\n 3 PLAY [user module demo] *********************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 7 ok: [demo.example.com]\n\
  \ 8 TASK [create a disabled user] ***************************\n10 ok: [demo.example.com]\n\
  11 TASK [enable user] **************************************\n13 changed: [demo.example.com]\n\
  14 PLAY RECAP **********************************************\n16 demo.example.com\
  \           : ok=3    changed=1    unreach\\\n```\n\n#### 修复验证\n\n```bash\n1 $ ssh\
  \ devops@demo.example.com\n2 Last login: Tue Oct  5 09:37:07 2021 from 192.168.0.100\n\
  3 [devops@demo ~]$ sudo su -\n4 Last login: Tue Oct  5 09:35:42 UTC 2021 on pts/0\n\
  5 [root@demo ~]# getent passwd | grep example\n6 example:x:1002:1002::/home/example:/bin/bash\n\
  7 [root@demo ~]# passwd -S example\n8 example PS 2021-10-05 0 99999 7 -1 (Password\
  \ set, SHA512)\n9 [root@demo ~]# grep example /etc/shadow\n10 example:$6$kg63VBL5Hw3AwjQt$GSn.Z7h3/ipgaY2p0ypSrymLN/2.l\\\
  \n11 hZnMeONjkiaiac5o7R6TkfHtPJyXmKqoW3IQxw6Udxb2khiJ8NCVo4KM1\\\n12 :18905:0:99999:7:::\n\
  ```\n\n\n\n\n\n```\n 1 $ ansible-playbook -i demo/inventory troubleshooting/user\\\
  \n 2 bug_error.yml.yml\n 3 PLAY [user module demo] *********************************\\\
  \n 4 *************************************************\n 5 TASK [Gathering Facts]\
  \ **********************************\\\n 6 *************************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [password expiration] ******************************\\\
  \n 9 *************************************************\n10 changed: [demo.example.com]\n\
  11 PLAY RECAP **********************************************\\\n12 *************************************************\n\
  13 demo.example.com           : ok=2    changed=1    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n15 ansible-pilot $ ansible-playbook -i\
  \ demo/inventory user\\ \\\n16 expiration/user.yml\n17 PLAY [user module demo] *********************************\\\
  \n18 *************************************************\n19 TASK [Gathering Facts]\
  \ **********************************\\\n20 *****************************************************************\n\
  21 ok: [demo.example.com]\n22 TASK [password expiration] ******************************\\\
  \n23 *************************************************\n24 ok: [demo.example.com]\n\
  25 PLAY RECAP **********************************************\\\n26 *************************************************\n\
  27 demo.example.com           : ok=2    changed=0    unreach\\\n28 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n29 ansible-pilot $ ssh devops@demo.example.com\n\
  30 Last login: Mon Nov  8 17:09:16 2021 from 192.168.43.5\n31 [devops@demo ~]$ sudo\
  \ su\n32 [root@demo devops]# chage -l example\n33 Last password change     : Nov\
  \ 08, 2021\n34 Password expires     : Feb 06, 2022\n35 Password inactive     : never\n\
  36 Account expires      : never\n37 Minimum number of days between password change\
  \  : 0\n38 Maximum number of days between password change  : 90\n39 Number of days\
  \ of warning before password expires : 7\n```\n\n我们期望 `Minimum number of days between\
  \ password change`（密码更改之间的最小天数）的值为 `7`，但得到的却是 `0`\n\n## 故障排除\n\n* [bug report -\
  \ user 模块无法正确处理密码过期参数 #75017](https://github.com/ansible/ansible/issues/75017)\n\
  * [pull request - user 模块修复了密码过期问题 #75390](https://github.com/ansible/ansible/pull/75390)\n\
  \n### 解决方案\n\n* `userbug_workaround.yml`\n\n```\n 1 ---\n 2 - name: user module\
  \ demo\n 3   hosts: all\n 4   become: true\n 5   vars:\n 6     myuser: \"example\"\
  \n 7   tasks:\n 8     - name: password min expiration\n 9       ansible.builtin.user:\n\
  10         name: \"{{ myuser }}\"\n11         password_expire_min: 7\n12 - name:\
  \ password max expiration\n13       ansible.builtin.user:\n14         name: \"{{\
  \ myuser }}\"\n15         password_expire_max: 90\n```\n\n### 解决方案执行\n\n```\n 1\
  \ $ ansible-playbook -i demo/inventory troubleshooting/user\\\n 2 bug_workaround.yml\n\
  \ 3 PLAY [user module demo] *********************************\\\n 4 *************************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 *************************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [password min expiration] **************************\\\
  \n 9 *************************************************\n10 changed: [demo.example.com]\n\
  11 TASK [password max expiration] **************************\\\n 12 *************************************************\n\
  13 ok: [demo.example.com]\n14 PLAY RECAP **********************************************\\\
  \n 15 *************************************************\n16 demo.example.com   \
  \        : ok=3    changed=1    unreach\\\n17 able=0    failed=0    skipped=0  \
  \  rescued=0    ignored=0\n18 ansible-pilot $ ssh devops@demo.example.com\n19 Last\
  \ login: Wed Nov 10 10:38:59 2021 from 192.168.43.5\n20 [devops@demo ~]$ sudo su\n\
  21 [root@demo devops]# chage -l example\n22 Last password change     : Nov 08, 2021\n\
  23 Password expires     : Feb 06, 2022\n24 Password inactive     : never\n25 Account\
  \ expires      : never\n26 Minimum number of days between password change  : 7\n\
  27 Maximum number of days between password change  : 90\n28 Number of days of warning\
  \ before password expires : 7\n```\n\n## Ansible 故障排除 - urlopen 错误\n\n如何在 Ansible\
  \ 中复现 `urlopen error`、进行故障排除并修复，以便能够在你的 playbook 中成功打开 URL。\n\n错误的或拼写错误的 URL 会导致\
  \ `urlopen error`。\n\n另请参：\n\n* 向 REST API 端点发送 GET 请求 - 与网络服务交互 - Ansible module\
  \ uri\n* REST API 中的基于令牌身份验证 - 与网络服务交互 - Ansible module uri\n\n### 演示\n\n讨论 Ansible\
