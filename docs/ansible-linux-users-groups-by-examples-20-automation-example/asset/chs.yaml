  \n16 x86_64\",\n 17         \"console\": \"ttyS0,115200\",\n 18         \"no_timer_check\"\
  : true,\n 19         \"nofb\": true,\n 20         \"nomodeset\": true,\n 21    \
  \     \"ro\": true,\n 22         \"root\": \"LABEL=cloudimg-rootfs\",\n 23     \
