  \n## 如何在 Windows 11 WSL（Windows Linux 子系统）中安装 Ansible\n\n介绍如何使用 Windows Linux 子系统和\
  \ Ubuntu 20.04 LTS 在 Windows 11 中安装和维护 Ansible。\n\n使用 Windows Linux 子系统在 Windows\
  \ 11 中安装和维护 Ansible 的简单方法。\n\n另请：\n\n* Ansible 故障排除 - Windows 10 错误 0x80370102 WSL:\
  \ Windows Linux 子系统\n* Ansible 故障排除 - Windows 11 错误 0x80370102 WSL: Windows Linux\
  \ 子系统\n\n### 如何在 Windows 11 中安装 Ansible\n\n官方事实上，Windows **并不是**受支持的控制节点操作系统，尽管\
  \ RedHat 正在非常努力消除原生 Windows 控制器的障碍。\n\n这背后的原因是 Ansible 的大部分内容深度植入了许多 UNIX 特性，这导致它无法在原生\
  \ Windows 上运行，基本上是因为 Windows 没有 `fork()` 系统调用的实现。从 2.11 版本开始，Ansible 控制器工作模型大量使用了\
  \ POSIX `fork()` 系统调用。\n\n* `Cygwin`\n\n有些人使用了 Cygwin POSIX 兼容项目，但有时它会失效，因此不是一个可靠的解决方案。\n\
  \n* `Windows Subsystem for Linux`\n\n最佳替代方案是使用 Windows Linux 子系统，也称为 `WSL`。如果是高于版本\
  \ 2004 的 Windows 10 或 Windows 11，请运行 `WSL` 版本 2\n\nAnsible 在 `WSL` 和 `WSL2` 上运行良好。\n\
  \n### 链接\n\n更多技术信息：\n\n* [Windows Linux 子系统](https://docs.microsoft.com/en-us/windows/wsl/compare-versions)\n\
  * [Ansible on Windows 常见问题](https://docs.ansible.com/ansible/latest/user_guide/windows_faq.html)\n\
  * [Windows 11  Windows Linux 子系统](https://arstechnica.com/gadgets/2021/10/the-best-part-of-windows-11-is-a-revamped-windows-subsystem-for-linux/)\n\
  \n### 演示\n\n如何使用 Windows Linux 子系统在 Windows 中安装最新版本和特定版本的 Ansible。\n\n#### 代码\n\n\
  * `install_wsl.ps1`\n\n```\n 1 wsl --help\n 2 wsl --list -o\n 3 wsl --install\n\
  ```\n\n#### 执行\n\n* 安装 WSL\n\n```\n 1 Windows PowerShell\n 2 Copyright (C) Microsoft\
  \ Corporation. All rights reserved.\n 3 \n 4 安装最新的 PowerShell 以获取新功能和改进\\\n 5 ements!\
  \ https://aka.ms/PSWindows\n 6 \n7 PS C:\\Users\\user> wsl --install\n 8 Installing:\
  \ Virtual Machine Platform\n 9 Virtual Machine Platform has been installed.\n10\
  \ Installing: Windows Subsystem for Linux\n11 Windows Subsystem for Linux has been\
  \ installed.\n12 Downloading: WSL Kernel\n13 Installing: WSL Kernel\n14 WSL Kernel\
  \ has been installed.\n15 Downloading: GUI App Support\n16 Installing: GUI App Support\n\
  17 GUI App Support has been installed.\n18 Downloading: Ubuntu\n19 请求的操作成功。更改在重启系统之前\
  \ b\\\n20 e ective 才会生效。\n21 PS C:\\Users\\user>\n```\n\n* 设置 Ubuntu 20.04 LTS WSL\
  \ 并安装 ansible\n\n\n\n\n\n```\n 1 正在安装，这可能需要几分钟...\n  2 请创建一个默认的 UNIX 用户账户。用户名不需要与您的\
