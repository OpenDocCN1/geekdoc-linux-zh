  **封面设计** Alan Clements\n**排版** Jake McFarland\n\n# 献辞\n\n> 献给我的筑家导师 David Hill，在我努力兼顾写作生涯以及过多的运动和爱好时，他耐心地指导我建造了我们的家。\n\
  \n# Negus Live Linux 系列\n\n帮助您通过免费软件获得真实成果的实用、实操指南\n\n将书中附带 CD 中的免费软件和示例添加到您的 Windows、Mac\
  \ OS X 或 Linux 系统中，以跟随书中描述的项目。或者直接启动 CD，以使用一套完整的、预装的免费软件工具集来玩耍、显示和修改这些项目。从新手开始，尝试示例……并最终以专业的启用\
  \ Ajax 的 Web 内容作为收官！\n\n该系列由 Christopher Negus 负责监督，他是畅销书 **The Red Hat Linux Bible*\
  \ 系列、*Linux Toys* 系列以及本系列标志性著作 **Live Linux CDs* 的作者。\n\n# 致谢\n\n这整本书的创意源于我与编辑之间的一个赌注，我打赌我们无法选出两个随机的技术的话题并将它们联系在一起。两支飞镖飞过空中，“Ajax”和“live\
  \ CDs”这两个主题最终成了结果。这本书完全可以写成关于“基于 Rails 的蓝光光”或“iPod 设计模式”。所以，你恰好拿起了一本关于 Ajax 和 live\
  \ CDs 的书，纯粹是运气好。\n\n如果你相信这一点，也许我可以让你兴趣资助我一直在考虑的这个初创项目！事实是，Ajax 和 live CDs 是出人意料的好搭档，因为\
  \ live CDs 为构建和测试提供了完美的环境。“live CD”的核心理念是它在单张 CD 上包含了一个完整的操作系统。除了完整的操作系统外，你还可以包含任何你想要的应用程序，例如可以提供\
  \ Ajax 应用程序服务的 Web 服务器。\n\nAjax 应用程序与仅用 JavaScript 开发的纯客户端应用程序相比，独特的一点在于它们需要在服务器上发生事情。换句话说，Ajax\
  \ 的前提是客户端与服务器之间的通信。这意味着你不仅需要一个服务器，还需要一个你拥有一定控制权的服务器。至少，你能够快速安装和测试服务器端脚本，这些脚本将处理你\
  \ Ajax 应用程序的服务器端处理。在提供用于构建、测试和托管 Ajax 应用程序的不可置信的可定制平台方面，Live CDs 非常符合要求。\n\n尽管 live\
  \ CDs 很酷，但我必须诚实地说，这本书的 95% 都是关于 Ajax 的。书中 live CD 的方面主要是为了方便，因为 Ajax 应用程序对环境的要求比纯应用程序更高。\n\
  \n好了，既然书主要是关于 Ajax 的，这到底意味着什么？这意味着在相对少的页数内，你学习了如何使用 Ajax 完成以下工作：\n\n*   为 Web 电子书阅读器动态加载章节(第三章)\n\
  \n*   立即选择并查看实时股票报价(第四章)\n\n# 关于作者\n\n**Michael Morrison** 是一位作家、开发者以及 Stalish Labs\
  \ ([www.stalefish.com](http://www.stalefish.com)) 的创始人，这是一家专注于游戏和交互媒体的娱乐公司。在不盯着电脑、滑板、打冰球或与妻子一起看电影时，Michael\
  \ 喜欢在他的锦池旁闲逛。除了作家和技术顾问的主业外，Michael 还是多门课程的导师，包括 DigitalThink 的 Java 介绍系列、JavaBeans\
  \ 程序员系列以及 Win32 编程。Michael 的一些著作包括 **JavaScript Bible, 6th Edition* (Wiley)、*Teach\
  \ Yourself HTML and CSS in 24 Hours, 7th Edition* (Sams Publishing)、*Beginning Mobile\
  \ Phone Game* (Sams Publishing) 以及 **Java Unleashed* (Sams Publishing)。\n\n# 第一章.\
  \ 引言\n\n\n\n\n\n\n*   将任何网页转换为能够理解 RSS 新闻订阅的聚合器（第 5 章）\n*   为你的网站添加自动补全功能（第 6 章）\n\
  *   实时验证表单数据并查找位置数据（第 7 章）\n*   创建一个“Web 2.0”查看器，使你的页面处理图像的方式现代化（第 8 章）\n*   使用信息弹出窗口动态显示小量内容片段（第\
  \ 9 章）\n*   在任何链接上添加实时天气状况弹出窗口（第 10 章）\n*   通过美国邮政服务的 Ajax 请求即时计算运费（第 11 章）\n* \
  \  在你的网页中加入一个动画五星级评分系统（第 12 章）\n\n这些都是 Ajax 使之成为可能的动态应用类型。更重要的是，本书采用了一种“构建工具包”的方法，引导你如何向\
  \ Ajax 应用中添加这些功能。虽然你在探索书中穿插的众多示例时，最终会学到很多关于 Ajax 的知识，但本书的重点不在于教你 Ajax。重点在于向你展示如何使用\
  \ Ajax 实现酷炫。有时这需要你学习完全全新的新东西；而其他时候只需要简单的复制粘贴代码。要点在于，这本书是关于*做事情*的。\n\n在我看来，做就是学，所以当你最终读完这本书时，对\
  \ Ajax 的理解将比开始时透彻得多。更重要的是，你离开时将带有一套属于自己的 Ajax 构建模块，你可以带着它们并将其应用于你自己的项目。\n\n## 本书的读者群\n\
  \n我不骗你——由于本书的本质，在介绍各种 Ajax 示例时，它必须经常涉及 JavaScript 和 PHP。然而，本书的初衷目标是让任何拥有 HTML 和\
  \ CSS（层叠样式表）知识的人都能读懂，而不一定要求具备脚本背景（无论是客户端 JavaScript 还是服务器端 PHP）。我不完全确定这是否是一个现实的目标，但它对我很有帮助，使我能够尽力提供足够的\
  \ Ajax 覆盖以确保示例通俗易，又不至于多到吓跑脚本初学者。\n\n话虽如此，你必须了解一点 HTML 才能应对这本书。CSS 并不那么关键，但它会偶尔提到，所以你大可以将\
  \ CSS 基础知识视为先决条件。从那里开始，了解一些 JavaScript 对你很有帮助，因为它是 Ajax 的基础。然而，我相信即使你对 Web 脚本的知识有限，你也可以灵活地闪避并理解书中的\
  \ JavaScript 代码，并在离开时依然带走满一箱可以随时复用的 Ajax 宝箱工具。书中反复出现的 PHP 代码非常简单，我会详细解释发生了什么，所以你完全可以在不了解任何\
  \ PHP 的情况下应付。\n\n## 本书的结构\n\n尽管本书遵循 Negus Live Linux 系列的宗旨以快速提供实践经验，但书的结构略有些特殊。本书分为三个部分：\n\
  \n*   **第一部分,“Ajax 营”——**。书的这部分没有浪费时间，铺垫足够的基础，让你不会被后续密集的 Ajax 示例应用压倒。你将探索几个商业真实的\
  \ Ajax 应用，并熟悉附带 CD-ROM 提供的 Ajax Toolkit。读完这部分后，你将充满动力地见证 Ajax 的运作。\n*   **第二部分,“构建真实的\
  \ Ajax 应用”——**。这部分是书的剩余，完全专注于使用 Ajax 解决现实世界的问题。从动态将数据输入表单邮政编码解析为城市/州，到向页面注入交互式五星评分系统，这部分不浪费时间，而且毫不留情。别误会我，它仍然是一本有趣的读物，但不要指望有一堆教程式的说或关于\
  \ Ajax 历史的文章。这部分特别全是关于实战！\n*   **第三部分,“附录”——**。这部分提供了你可能觉得有用的额外信息。附录 A,“Ajax 的过去、现在和未来”描绘了\
  \ Ajax 的来源以及它将走向何方。这对于理解如何为网页添加 Ajax 驱动的功能绝非关键，但它确实为如今围绕 Ajax 的热议增加了一些视角。附录 B,“快速粗暴的\
  \ XMLHttpRequest”正如其名——作为 Ajax 核心的 JavaScript 对象的参考。\n    最后附录 C,“使用 Live Linux\
  \ CD”无疑是所有附录中最实用的，因为它详细解释了如何使用书中附带的 Live CD。如果你从未用过甚至听过 Live CD，完全不必担心，也不要认为你需要是\
  \ Linux 专家或已安装 Linux。附录 C 解释了 Live CD 的作用，并指导你如何根据特定的硬件设置使用它。\n\n## 关于本书的 CD-ROM\n\
  \n书中附带的 CD-ROM 是 Live CD 进入 Ajax 世界的地方。光盘包含一个可启动的 Ubuntu（Linux 变体）操作系统，其中包含了 Apache\
  \ 服务器和书中涵盖的所有 Ajax 示例应用。也许更有趣的是，启动后你可以直接从 CD 运行应用程序，考虑到如果不这样做你将需要启动并运行自己的 Web 服务器，这非常强大。\n\
  \n\n\n\nLive Linux CD 可以在多种计算机硬件上运行，例如标准 PC 架构 (i386)、PowerPC (PPC) 和 64 位 AMD (AMD64)。我建议运行书中附带的\
  \ CD 至少需要一台 Pentium III 级 PC 和至少 128MB 内存。至于硬盘需求，运行 live CD 时，你的电脑甚至不需要有硬盘。你可能需要考虑准备一个\
  \ USB 闪存盘（也称为 U 盘、优盘或内存棒）。由于 live CD 通常从只读介质上运行，因此当应用程序需要写入数据时，随身携带 USB 闪存盘会很有用，正如第\
  \ 12 章 获取有关如何使用 live CD 的详细说明。\n\n# 第一部分.Ajax 训练营\n\n# 第 1 章.Ajax 与勇敢新世界的世界\n\n\
  ### 动画中的 Ajax\n\n![动画中的 Ajax](img/note.jpg)\n\nAjax 公司是一家由美高梅影业制片公司（MGM）使用的虚构公司，用于讽刺华纳兄弟的\
  \ Acme 公司，后者在《跑跑兔》动画片中有非常醒目的登场。Ajax 公司主要出现在《猫和老鼠》动画片中。\n\n前几天，当我正在一家快餐店等餐时，我开始怀疑为什么“快”这个词出现在这个特定地方的描述中是有意义的。我急于找个座位坐下来翻翻杂志，而不是在拥挤的大厅里徘徊，等我的“快”餐。这种状况让我思考起\
  \ Ajax 以及它是如何提升整体 Web 体验的。是的，用一种可以说是扭曲的方式，通过汉堡包装纸的油腻滤镜来看待 Ajax 是可能的。稍过一下，你就会看到它是如何做到的。\n\
  \n尽管 Ajax 并不被严格视为缩写词，但这个名字最终源于 Asynchronous JavaScript and XML（异步 JavaScript 和 XML）。Ajax\
  \ 的主要优势在于，它允许你通过 Web 连接异步接收小块块的数据，这意味着你不需要苦苦等待，而且在大多数情况下，你可以避免整个 Web 页面的刷新。有效使用\
  \ Ajax 的真正诀窍在于让你的大脑理解它能做什么，这比它是什么或为什么人们看起来如此痴迷它要重要得多。Ajax 是那些真正稀有的 Web 创新之一，一旦你在正确的语境下看到它的应用，其益处就会立即被理解。它就像你有时在电视上看到的流行的\
  \ 3M 广告一样，你使用 Ajax 不是为了制造东西，而是为了让事情变得*更好*。本章将带你从客观且健康的 Ajax 现实主义开始，清晰地聚焦于它旨在解决什么类型的问题，以及为什么这些这些问题对你很重要。是的，我也会解释它是什么以及为什么人们对它痴迷不已，但那只是锦上添花。\n\
  \n### 与 Ajax 一起用餐\n\n回到开头的快餐类比，这种场景是一家拥挤的快餐店，你必须在坐下享受舒适环境之前一直站在那里等食物。将这种快餐用餐体验与全服务餐厅进行对比，在后者中，在你坐下并点餐后，餐点会被送到你的桌上。坐在桌旁处理自己的事情，而让人在厨房里忙碌地准备食物，这是一种巨大的奢侈。在快餐的替代方案中，你必须在坐下并舒适之前一直站在那里等食物，前提是你认为快餐店的座位是舒适的。我想表达的点是，通过快餐方式，准备食物花费的时间是你损失的时间，因为你的用餐体验在食物准备好之前一直处于挂起状态。而对于坐式晚餐，你可以在等待时享受饮品、吃点前菜、读读杂志，或者与你的用餐伴侣聊天。这些是完全不同的体验，如图\
  \ 1.1 所示![准备食物的时间在全服务晚餐中相对不容易被注意到，因为你可以自由享受用餐体验。](img/01ack01.gif)\n\n**图 1.1 准备食物的时间在全服务晚餐中相对不容易被注意到，因为你可以自由享受用餐体验。**\n\
  \n除了我喜欢吃东西（尤其是出去吃）之外，这次讨论的重点在于 Ajax 是一种 Web 开发技术，它承诺将你的 Web 页面升级为坐式的用餐体验。传统的 Web\
  \ 应用迫使你在服务器上搜索或处理数据时等待。Ajax 则并非如此。一个 Ajax Web 应用会在后台执行数据处理，让你在此期间继续与 Web 页面交互。这似乎像是一个细微的差别，但事实并非如此。问问你自己，你更愿意在一家不那么快的快餐店排队，还是在坐式餐厅里一个舒适的桌子旁放松？\n\
  \n### 注意\n\n![注意](img/note.jpg)\n\n我关于 Ajax 的餐厅类比有一个小问题，即它暗示 Ajax Web 应用在某种程度上比传统的\
  \ Web 应用慢。事实并非如此。在原始数据处理方面，Ajax 应用并不更快也不更慢。事实上，它们往往给人一种更快的印象，因为处理通常在你察觉的情况下在后台进行。\n\
  \n### Ajax、Sting 与非同步性\n\n1983 年，警察乐队（The Police）发布了专辑《Synchronicity》（同步性），它随后售出了数百万份拷贝，并催生了“Every\
  \ Breath You Take”等热门单曲。我打赌 Sting 从没想过几十年后他的专辑标题会成为众多书籍和文章中的反派。事实证明，同步性是 Web 用户界面的梦梦，因为它意味着一件事必须在另一件事开始之前完成。在同步\
  \ Web 页面中，在任务 A 完全完成之前，你无法开始任务 B，即使任务 A 需要很长时间。例如，一个同步在线音乐服务在忙于提供歌曲下载时，不允许你继续浏览音乐。\n\
  \n### 注意\n\n![注意](img/note.jpg)\n\nSting 可能从未建立起专辑*Synchronicity* 与技术世界之间联系的一个原因是，因为这张专辑实际上指的是瑞士心理学家卡尔·荣格（Carl\
  \ Jung）的一种心理学原理。在这种语境下，同步性指的是“有意义的巧合”，例如两个看似无关的事情发生时，它们之间比纯粹的巧合有更多的联系。如果我解释技术话题比解释心理学原理要好，，请见谅。\n\
  \n\n\n\n即使对于那些设计为在结算流程早期计算运费的购物车，你仍然面临服务器请求/响应的问题，这可能需要时间，并最终导致页面重新加载以便在页面上显示运费。在进行此服务器请求期间，订单输入的用户界面实际上处于冻结状态，这并不是一件好事。如果在你输入收货地址时就能无缝地计算并显示运费，那将会有意义得多。由于购买的物品已经在购物车中，整个购物车应用程序只需要一个邮政编码即可触发服务器请求并开始计算费用。此操作可以在你填写其他订单信息时在后台进行。与用餐的示例类似，计算运费时涉及的等待几乎完全消失了，因为在等待期间，你被允许去做其他有用的事情。\n\
  \n### 重新加载，还是不重新加载\n\n正如我之前提到的，用户界面的冻结只是传统 Web 应用问题的一个部分。等式的另一方面是：对于每一个服务器响应都必须重新加载页面。具体来说，当服务器从后端传回运费时，页面必须刷新以反映这一变化，因为服务器返回的是整个\
  \ Web 页面。任何基于服务器响应的页面更改都需要刷新页面。这是一个非常烦人的问题，不仅是因为页面重新加载/刷新需要时间，还因为页面在每次变化时实际上会闪烁和跳动。\n\
  \n### 注意事项\n\n![Note](img/note.jpg)\n\n关于为整个 Web 应用版本号的观点存在广泛的争议。要将这样一个迥异的物兽归类到一个编号系统中是非常困难的，就像你无法将高速公路系统标记为\
  \ Autobahn 3.0 一样。然而，Web 应用设计中存在离散的演进步骤这一通用观点是绝对有效的。所以，也许公路的类比并没有那么遥远——将传统的 Web\
  \ 应用想象成土路，而 Ajax 驱动的 Web 应用则是沥油州际高速公路。\n\n还存在一个重大的效率问题：每次重新加载页面时，整个页面内容都要重新发送，即使只更新了一小部分数据（例如运费）。这是对带宽的浪费，也是对用户时间的浪费。这种类型的\
  \ Web 应用通常被被称为 Web 1.0 应用。Ajax 在引领新一代属于 Web 2.0 名号的应用程序出现中发挥着重要作用，这些应用“感觉”上更像真正的桌面应用程序。\n\
  \nAjax 通过将服务器请求和响应减少为你所需的精确数据（而非整个页面），解决了页面重新加载问题。在运费请求的情况下，服务器只需返回一个货币金额，在这种情况下，页面仅使用服务器数据更新页面的运费区域，然后计算新的购买总额。整个页面不需要重新发送，不需要重新加载，也不会发生闪烁。图\
  \ 1.2 展示了 Ajax 如何改进运费计算过程。\n\n![Ajax 使得在不中断用户体验的情况下计算运费成为可能。](img/01ack02.gif)\n\
  \n**图 1.2. Ajax 使得在不中断用户体验的情况下计算运费成为可能。**\n\n### Ajax 到底是什么？\n\n到目前为止我一直克制着详细说明\
  \ Ajax 是什么的冲动，因为对你来说，理解它的作用重要得多。如果你不理解它解决的问题类型，那么说 Ajax 是一种结合了 JavaScript 和 XML\
  \ 的编程技术是毫无意义的。希望前面的基础工作做得足够，让你现在对 Ajax 解决的问题有了基本的掌握。\n\n那么，Ajax 是什么？Ajax 是一种特定的\
  \ Web 开发方法，涉及 JavaScript 的使用并且经常使用 XML。仅此而已。它不是什么花哨的浏览器插件，也不是什么酷的新编程语言。它只是一种涉及已存在已久的编程技术。\n\
  \nAjax 真正的内核是一个单一 JavaScript 对象，它使得与 Web 服务器进行异步通信成为可能。在传统的 Web 应用中，浏览器本身通常是与服务器通信的唯一手段，更重要的是，它一次只处理一个\
  \ Web 页面。Ajax 引入了使用 JavaScript 与服务器通信的概念。在幕后，仍然是浏览器在工作，但最终效果是你的 JavaScript 代码能够与\
  \ Web 服务器进行对话，发送并接收离散的数据片段。这种通信是异步进行的，这意味着它在后台发生，不会中断任何其他事情。\n\n目前，对你来说，了解关于使 Ajax\
  \ 可能 JavaScript 对象的细节并不极端重要。下一章将详细介绍 Ajax 的内部构造以及如何组装 Ajax 代码。\n\n### 注意事项\n\n![Note](img/note.jpg)\n\
  \n请记住，本书的完全目的是为你提供一个即插即用的 Ajax 框架，以最大限度地减少代码开发。你只需要对 Ajax 代码及其工作原理有极少的了解，就能复用书中的代码。不仅如此，你还可以使用附带的实时\
  \ Linux 光盘直接从你的 PC 上尝试许多示例。\n\n### 现实世界中的 Ajax\n\n本书在本质上是非交互性的，我可以证明这一点。用你的手指点击这里，你就会明白我的意思。看，没有出现新页面。由于打印页面是相当静态的，我鼓励你花一点时间在线摆玩一些真实的\
  \ Ajax 应用，以感受它们与传统 Web 应用的对比。接几节介绍了一些流行且引人注目的 Ajax 应用，并引导你关注从 Ajax 中受益最大的特定功能：\n\
  \n*   Google Suggest\n*   Netflix\n*   Flickr\n*   Google Maps\n\n由于你可能已经在使用这些 Web\
  \ 应用，当你发现 Ajax 如何让特定功能成为可能时，会有更有见解。在这一小现实之旅之后，你将在附带的实时 Linux 光盘背景下重新查看运费计算器示例。\n\
  \n#### Google Suggest\n\nGoogle Suggest ([`labs.google.com/suggest/`](http://labs.google.com/suggest/))\
  \ 是一个相对简单但功能强大的 Ajax 绝佳案例。事实证明，“强大”可能是你在探索 Ajax 及其各种可能性时经常会想到的。Google Suggest 是普通的\
  \ Google 搜索引擎，但带有一个建议文本输入功能，根据实际 Google 搜索数据帮助你缩小范围。\n\n当你在 Google Suggest 中输入搜索词时，会立即弹出一个包含可能匹配项的下拉列表。要接受其中一个建议的词，只需用鼠标点击它，或者光标向下移动选择。这个\
  \ Ajax 应用如此酷的地方在于，每个可能的匹配项旁边都列出了匹配的数量。\n\n\n\n\n\n当你尝试 Google Suggest 时，从开发的角度来看，需要注意的关键点是它如何在你每输入一个字符时都与服务器进行无缝的往返通信。仔细想想，这其实非常令人惊叹。这可是极具响应性的界面！这正是\
  \ Ajax 旨在带给现代 Web 应用的“感觉”。第 6 章，“通过自动补全读懂读心”将再次回顾 Google Suggest，向你展示如何使用 Ajax 实现你自己的“自动补全”功能。但不要等到第\
  \ 6 章,现在就去尝试 Google Suggest 吧。\n\n#### Netflix\n\n很有可能你已经在不知不觉中沐浴在 Ajax 带来的舒适光芒中了。如果你使用\
  \ Netflix ([`www.netflix.com/`](http://www.netflix.com/)) 租电影，那么你已经在某种程度上是一个 Ajax\
  \ 老兵了，至少从用户的角度来说是这样。Netflix 使用 Ajax 实现了一种流行的技巧：当你用鼠标指针悬停在某个信息上（在这种情况下是电影图标）时，弹出窗口会自动出现。\n\
  \n如果你只需将鼠标悬停在一个电影的小图标上，就会弹出一个弹出窗口，其中包含完整的电影描述和相关电影信息。所有这些电影数据都是在悬停开始时通过 Ajax 在后台从服务器检索的。从用户的角度来看，这太棒极了，因为在服务器通信完成（弹出窗口出现）之前，你甚至没有意识到正在进行服务器通信。再次，Ajax\
  \ 以一种完全无缝的方式增加了一个重大的可用性功能。\n\n使用 Ajax 弹出窗口时值得注意的一个有趣点是，一旦你将鼠标指针移出所指电影，Netflix 的弹出窗口就会自动消失。这有助于让用户产生一种感知，即弹出窗口纯粹是提供信息的，而不是那种必须点击才能关掉的烦人广告弹——对于\
  \ Netflix 来说，这些弹出窗口确实是用户界面受欢迎的补充。即使你没有 Netflix 账户，也可以在 Netflix 上体验 Ajax——只需访问 [`www.netflix.com/`](http://www.netflix.com/))\
  \ 并点击“浏览选择”（Browse Selection），找到一些电影进行悬停即可。顺便提一下，你将在第 9 章中学习如何在自己的页面中注入信息弹出窗口。\n\
  \n### Note\n\n![注意](img/note.jpg)\n\n关于使用 Ajax 显示弹出窗口的另一种有趣用法，请查看 [`www.theinvisiblead.com/`](http://www.theinvisiblead.com/))上的\
  \ Invisible Ad 广告服务。这是一个非常不受常规的广告概念，涉及一个由小正方形组成的巨大网格，你必须用鼠标悬停在它们上面才能看到广告。这种广告被称为像素广告（pixel\
  \ ads），因为你实际上是为屏幕上的每个像素广告空间付费。突破性的？愚蠢的？由你来判断吧！\n\n#### Flickr\n\n毫无疑问，这是目前为止我最喜欢的商业\
  \ Ajax 应用，Flickr ([`www.flickr.com/`](http://www.flickr.com/)) 将 Ajax 发挥到了极致。如果你不熟悉，Flickr\
  \ 是一个在线照片共享社区。让 Flickr 如此与常的是它如何如此彻底地使用 Ajax，使其具有类似桌面应用程序的感觉。在 Flickr 中，极少任务需要重新加载页面，或者让你在服务器请求/响应期间坐在一旁无所事事。图\
  \ 1.3 显示了得益于大量的 Ajax，在 Flickr 中编辑照片标题是多么直观。\n\n![编辑 Flickr 照片标题在“原地”完成且无需任何页面刷新，即使在保存修改后的标题也是。](img/01ack05.jpg)\n\
  \n**图 1.3. 编辑 Flickr 照片标题在“原地”完成且无需任何页面刷新，即使在保存修改后的标题也是。**\n\n该图显示了我照片收藏集中的一张照片，其标题正在被编辑。需要理解的是，当我点击照片标题时，编辑字段及其关联“保存”和“取消”按钮会自动出现。更改标题后，你只需点击“保存”按钮，更改就会立即提交到服务器。无需等待新页面打开，没有确认对话框，什么都没有。标题直接从编辑模式变回静态文本。正如我之前说的，当你考虑到得益于\
  \ Ajax 的标题编辑任务变得如此干净利落时，脑海中就会浮现出“极其强大”这个词。\n\nFlickr 对 Ajax 的使用并不仅于照片标题编辑。Ajax 有各种巧妙的方式渗透到\
  \ Flickr 的用户界面中。我可以再花几页的内容把它们一个一个喂给你们，或者我直接让你自己去尝试。你需要创建一个免费的 Flickr 账户才能真正体验用户界面，但这只需要几个简单的步骤。你可以从\
  \ [`www.flickr.com/`](http://www.flickr.com/)) 开始。\n\n#### Google Maps\n\n我必须承认，将\
  \ Flickr 封为我最喜欢的商业 Ajax 应用让我有点心疼，因为还有另一个令我心爱的应用。我说的是 Google Maps ([`maps.google.com/`](http://maps.google.com/))，在许多方面都是\
  \ Ajax 应用的教父。仅仅在几年前，全球的 Web 开发者还在苦恼 Google Maps 怎么可能做到它所的一切，而且速度如此快。事实证明，Google\
  \ Maps 的秘诀一直都是 Ajax。\n\nGoogle Maps 采用的主要技巧是在数据需要*之前*不断预测并加载地图数据。换句话说，Google Maps\
  \ 并不关心你正在查看地图的哪个部分，而是关心你可能要看哪个部分。安全的猜测包括当前区域周围的区域，以及当前区域的放大和缩小版本。事实证明，Google Maps\
  \ 通过比用户处理速度快的数据来胜过用户。因此，当你开始探索地图的不同部分时，Google Maps 已经领先你一步并预加载了地图数据。其最终效果是惊人的响应式用户界面，如果没有\
  \ Ajax 在后台加载地图数据方面的协助，这将是不可能的。\n\n当涉及到用你自己的信息自定义地图时，Ajax 也进入了场景。Google 发布了一个用于与\
  \ Google Maps 交互的特殊 `API`（应用程序接口），它完全基于 Ajax。例如，你可以创建自定义的标记（推大针）并将其放置在地图位置上，甚至将它们链接到显示位置附加信息的自定义弹出窗口。\n\
  \n## Ajax 并非适用于一切\n\n我猜，对真实世界 Ajax 应用的小之旅让你对在自己的 Web 页面中注入一点 Ajax 感到兴奋。这是一件非常好事。不过，我必须警告你，Ajax\
  \ 并不是万能的解决方案。就像生活中的大多数事情一样，适度可以让你获得 Ajax 的最大益处。\n\n\n\n\n\n在本章的早期部分，你已经了解了 Ajax\
  \ 解决的主要问题。从这些问题反推，可以列出一份 Ajax 很有意义的场景列表。通过分析这个场景列表，也可以确定何时 Ajax 并不是理想的解决方案。你可以将此列表作为基础，判断\
  \ Ajax 是否真的能为你的 Web 页面提供帮助。请注意，此列表并非涵盖所有内容，但更多是作为评估 Ajax 实际用处的通用指南。具体如下：\n\n*  \
  \ 首先，Ajax 始终涉及服务器通信，更具体地说，就是数据从服务器流向客户端 浏览器。如果你的 Web 页面不需要访问 Web 服务器来获取某种数据，那么使用\
  \ Ajax 就毫无意义。你当然仍然可以使用 JavaScript 来让页面更具交互性，但 Ajax 并非严格必须。\n\n*   Ajax 的关键点之一是在不需要刷新/重新加载的情况下更新页面。如果你的应用程序本质上需要打开新页面（例如一系列离散页面中新页面的链接），那么\
  \ Ajax 可能不是答案。另一方面，也许你可以将几个页面合并成一个不需要重新加载的由 Ajax 驱动的页面。\n\n    ### Note\n\n    ![Note](img/note.jpg)\n\
  \n    有些人错误地将任何高响应式的 Web 用户界面都称为“Ajax 用户界面”。严格来说，至少在我浅见的看来，这种界面必须涉及服务器通信才能算作 Ajax\
  \ 解决方案。这并不是说响应式用户界面与 Ajax 没有紧密联系，因为它们确实密切相关。但事实是，Ajax 的核心在于从服务器异步获取数据。我并不是试图在“什么是\
  \ Ajax、什么不是 Ajax”的语义上钻牛角尖；我只是想帮助你了解何时使用 Ajax 是有意义的。\n\n*   Ajax 的另一个关键点是`异步通信，这是\
  \ Ajax 在后台穿梭数据的方式，以便其他操作可以在前台进行。如果你的应用程序特别需要某件事在另一件事之前发生，那么 Ajax 可能不是一个好主意。也许在继续之前，必须对某块用户输入数据进行验证，在这种情况下，你可能真的需要打开新页面或在数据验证期间让用户等待。无论何种情况，\
  \ Ajax 都没有什么真正的帮助。\n\n我在这里表达的观点是，Ajax 在使用得当时非常强大，但知道何时使用它至关重要。上述三点可以作为评估在你的应用程序中引入\
  \ Ajax 是否有意义的指南。此外，你在书中剩余部分中将探索的示例将进一步说明 Ajax 何时以及如何进入你的 Web 页面。\n\n## 重新审视运费费用计算器\n\
  \n在本章的早期，我重点强调了在在线购物车中，必须先泄露财务信息或经过一系列 Web 页面才能发现运费是多么令人恼恼。我论证了 Ajax 如何通过在你输入订单发送地的邮政编码后，在后台从服务器获取运费，从而极地改善这种情况。这样你就可以继续输入订单信息，而无需等待服务器或被页面刷新所中断。图\
  \ 1.4 显示了这样的购物车在输入运输邮政编码前可能的样子。\n\n![Part of the check-out process for any online\
  \ shopping cart involves gathering the shipping information and displaying a total.](img/01ack07.jpg)\n\
  \n**图 1.4. 任何在线购物车结账流程的一部分包括收集运费信息并显示总计。**\n\n在这个示例中，结账过程已经进展到了选择商品的阶段；剩下的只是获取运费信息、计算总额并完成支付。这个特定的示例止于完成支付，而是侧重于简化获取运费以及根据这些费用计算结账总额的过程。\n\
  \n有了 Ajax 的加入，现在可以在输入邮政编码后直接从运输提供商的服务器（在本例中为美国邮政局）获取运费。图 1.5 显示了已部分输入邮政编码的订单输入页面。注意，此时运费尚未获取，因为我仍在输入邮政编码。\n\
  \n![Nothing happens while the ZIP code is being entered because you need the entire\
  \ ZIP code to request the shipping charge.](img/01ack08.jpg)\n\n**图 1.5. 在输入邮政编码时什么都不会发生，因为你需要完整的邮政编码来请求运费。**\n\
  \n### Note\n\n![Note](img/note.jpg)\n\n负责通过 Ajax 获取运费的 USPS Web Tools API 也支持对运费信息的验证。例如，你可以通过\
  \ USPS 服务器从邮政编码查找城市和州，从而完全将订单输入提升一个水平，由此消除两项用户输入的信息。当我们在真实的 Ajax 应用背景下更详细地剖析运费计算器示例时，你将在第\
  \ 11 章”中中学到更多关于 USPS Web Tools API 的知识。\n\n一旦完全输入邮政编码并我移动到用户界面的下一个字段（电话号码），运费就会神奇地出现，结账总额也会计算出来（参见图\
  \ 1.6\n\n**图 1.6. 在后台没有干扰的情况下计算结账总额。**\n\n即使 USPS 服务器返回运费花费了一些时间，用户的体验也不会受到太大影响，因为用户可以继续输入信息。此外，邮政编码的任何更改都会导致新的服务器请求和新的运费。不仅如此，具体的\
  \ USPS 运输服务（包裹邮政、优先邮件等）也可以更改，这也会导致获取新的运费。\n\n这个 Ajax 示例中的最后一个小技巧在你输入不支持的邮政编码时显现。也许特定物品无法运到某些地区——或者像在本示例中，为了测试目的限制了邮政编码。无论动机如何，如果邮政编码没有产生有效的运费，邮政编码字段旁边就会显示错误提示，如图\
  \ 1.7\n\n**图 1.7. 如果输入不受接受的邮政编码，邮政编码字段旁边将出现错误消息。**\n\n\n\n\n\n第 11 章 将更详细地探讨此示例的内部机制。目前，只需知道该示例仅适用于邮政编码\
  \ 20008，这意味着任何其他邮政编码都会导致错误。这种局限性是因为在“测试模式”下使用了 USPS Web Tools API，而不是示例代码本身的问题。\n\
  \n## 总结\n\n在本章中，我最不想做的事情就是向你长篇大论地总结 Ajax 是如何诞生的以及谁实现了它。我意识到，你购买这本书的动力是为了利用这项技术去做一些酷的东西，而这无疑是长期以来冲击\
  \ Web 领域最酷炫的编程技术之一。本章的目标是让你熟悉 Ajax 能够做什么，以及为什么它对你当前的应用程序以及 Web 的未来都至关重要。\n\n任何为\
  \ Web 开发应用程序的人都应该考虑如何让自己的应用程序变得：更具交互性、更直观，并且不那么像旧式的 Web。我们正站在一个令人兴奋的新 Web 时代的边缘，它潜力消除\
  \ Web 应用程序与桌面应用程序之间的界限。想一想，这种区别到底又重要什么呢？应用程序只是用计算机完成某些有用或有趣的事情的方式，而 Ajax 是一项可以显著改进许多在线应用程序的工具。这本书的其余部分将向你展示具体如何使用\
  \ Ajax 让你的应用程序变得更好。\n\n## 第 2 章 Ajax 应用程序内部构造\n\n### 海上的 Ajax\n\n![海上的 Ajax](img/note.jpg)\n\
  \n多年来，美国海军有几艘船以 Ajax 命名，第一艘 USS Ajax 于 1864 年下水。最近的一艘 USS Ajax 是一艘维修舰，曾曾在第二次世界大战和越南战争中服过役，并最终于\
  \ 1986 年退役。\n\n如果说我最讨厌什么，那就是那种前五章都在为后续一切铺垫基础的计算机书籍。很多书感觉必须教你每样一点知识，而不是专注于当前的主题。出于这个原因，在本章初你只需要进行一点额外的设置，然后就会切入\
  \ Ajax 的核心。如果你认为你需要温习一下 HTML 和 CSS，或者可能认为一个快速的 JavaScript 或 XML 教程会有帮助，请务必休息一下去复习它们。只是不要指望我会浪费你的下午时间，手把手地带你过这些主题，因为我们还有\
  \ Ajax 的正事要处理。\n\n我并不是想恐吓跑你；我只是想激发你的热情，让你投入到买这本书是为了学习的酷东西中。到本章结束，你将完成你的第一个功能完整的\
  \ Ajax 应用程序。不仅如此，你还将非常熟悉如何自定义该应用程序，让它执行那些可能从未被设计过要做的事情。这是一好事。即兴发挥，不断发明；这是这里的精神。现在，让我们开始吧！\n\
  \n本章中的 Booker 应用程序使用了以下文件，它们位于包含本书的实时 Linux 刻录光盘的 `chap02` 示例代码文件夹中：\n\n* `booker.html`—主\
  \ Web 页面\n* `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n* `domkit.js`—Ajax Toolkit 的\
  \ DOM 相关函数\n* `book_alicewonderland.xml`—《爱丽丝仙仙游记》XML 电子书\n* `book_frankenstein.xml`—《弗兰肯斯坦》XML\
  \ 电子书\n* `book_mobydick.xml`—《莫比迪克》XML 电子书\n* `book_warandpeace.xml`—《战争与和平》XML\
  \ 电子书\n* `book_warofworlds`—《世界大战》XML 电子书\n\n## Ajax 的基础与组件\n\n你现在可能已经感觉到，Ajax 并不是单项技术，而是其他技术的特定应用。在\
  \ Ajax 应用程序的背景下理解这些其他技术是如何结合的，对于理解如何构建和修改自己的 Ajax 应用程序非常重要。因此，让我们探索让 Ajax 运行的组件技术。图\
  \ 2.1 显示了主要的 Ajax 技术在典型的 Ajax 应用程序中是如何结合的。\n\n![HTML、CSS、JavaScript、XML 以及如 PHP\
  \ 的服务器程序共同工作以协调 Ajax 请求和响应。](img/02fig01.gif)\n\n**图 2.1。HTML、CSS、JavaScript、XML\
  \ 以及如 PHP 的服务器程序共同工作以协调 Ajax 请求和响应。**\n\n注意图中，Ajax 请求/响应过程是有顺序展开的，从数字 1 到 3 可以看出这一点。在接下来的几节中学习更多不同\
  \ Ajax 组件如何结合时，请记住这张图。\n\n### HTML 和 CSS\n\n如果没有一点 HTML，创建任何 Web 页面都是困难的，因为它是 Web\
  \ 的语言。在 Ajax 应用程序中，HTML 仍然作为页面内容的结构化部分，例如文本、图像、表单字段等。事实上，Ajax 应用程序中的大多数 HTML 代码并没有什么特殊之处——有趣的内容主要发生在\
  \ JavaScript 代码中，我就会讲到这一点。\n\n如果你在过去几年里做过任何 Web 页面的创建，你可能已经对层叠样式表（CSS）以及它们对于创建美观\
  \ Web 页面的重要性有了认识。CSS 允许你将 Web 页面的外观与其结构分离，结果是页面更容易维护，而且漂亮。CSS 进入 Ajax 领域是因为它提供了一种方法，动态地改变\
  \ HTML 内容的外观。例如，通过 Ajax 请求对数据库验证数据时，你可能想高亮某个输入字段。在本示例中的高亮将通过 CSS 在 HTML 元素上实现。\n\
  \n### JavaScript\n\nJavaScript 在 Ajax 中的工作是协调客户端侧的一切，包括所有必须由浏览器执行的逻辑。不要忘记，Ajax 的本质是客户端（浏览器）与服务器（Web）之间的数据交换，因此在设计和构建\
  \ Ajax 应用程序时，你总是以客户端/服务器通信的方式思考。JavaScript 代码运行在浏览器上，用于发起 Ajax 请求并处理服务器返回的数据。\n\n\
  你使用 JavaScript 封装用户数据发送到服务器，并接收服务器的响应，以有意义的方式呈现给用户。当然，这意味着 HTML 和 CSS 深度影响了 Ajax\
  \ 应用程序的 JavaScript 代码，JavaScript 经常利用对象模型（DOM）根据 Ajax 响应动态更改 HTML 元素。[图 2.1] 中的虚线表示了\
  \ JavaScript 利用 DOM 动态更改 HTML 和 CSS 代码的能力。\n\n### 注意\n\n你并不需要掌握 JavaScript 编程就能在自己的\
  \ Web 页面中复用书中的示例。然而，如果不深入研究 JavaScript 代码，就无法深入探讨 Ajax，因此如果你计划将任何示例代码推向另一个水平，简单了解\
  \ JavaScript 是重要的。\n\n### XML 和 Ajax 数据\n\n\n\n\n\n好的，你已经知道 Ajax Web 页面仍然由 HTML\
  \ 和 CSS 组成，并且可以使用巧妙的 JavaScript 代码进行动态调整，这些代码负责管理 Ajax 请求和响应。我还没有解释过在 Ajax 请求/响应序列中，客户端和服务器之间传输的数据的本质。部分原因之一是\
  \ Ajax 事务中的数据格式并不是固定成不变的。你可以自由使用多种数据格式来适应每个应用程序的特定需求。换句话说，你可以为每个 Ajax 应用程序量定制数据的表示形式。\n\
  \n使用 Ajax 的极具说服力的理由之一是利用 XML 数据标准，它提供了一种高度结构化的信息组织方式。XML 特别擅长表示其他难以的复杂数据，例如具有多层嵌套数据的分级数据库。Ajax\
  \ 在请求/响应等式的两端都完全支持 XML，这意味着你可以以 XML 格式发送和或接收数据。\n\n虽然 XML 是一件很好的事情，但并不是解决所有 Ajax\
  \ 问题的万灵药。事实上，使用原始文本数据作为 Ajax 数据交换的格式是完全可以的，在很多情况下也是理想的。例如，像你在 URL 中经常看到的那，通过简单的键/值对将数据传递给服务器是非常简洁的，如下：\n\
  \n```\nfname=Michael&lname=Morrison\n```\n\n将此与以 XML 结构的相同信息进行对比：\n\n```\n<fname>Michael</fname>\n\
  <lname>Morrison</lname>\n```\n\n在这种情况下，URL 键/值版本的数据要有效得多，因为数据非常简单。\n\n底线是，在 Ajax\
  \ 应用程序中传输的数据格式完全取决于应用程序的特定需求。在整书中，你将遇到使用多种不同数据类型的应用程序，包括原始文本、XML 和另一种被称为 JSON（JavaScript\
  \ 对象表示）的类型。\n\n### PHP 与服务器\n\nAjax 的一个经常被初学者误解的方面是它完全依赖于服务器程序接受请求并以某种方式做出响应。在通常与\
  \ Ajax 术语相关的熟悉的“异步 JavaScript + XML”配方中，服务器程序是那个隐藏的成分。在实践层面，这意味着你不能仅仅通过一些 JavaScript\
  \ 代码组装 Web 页面就写出一个 Ajax 应用程序——必须有一个服务器端组件来响应客户端的请求。\n\n服务器程序在 Ajax 应用程序中的作用完全取决于特定的\
  \ Ajax 应用程序，但通常你会发现，大多数 Ajax 服务器程序负责查找某些信息并将其返回给客户端。例如， Ajax 员工目录应用程序可能会向服务器传递一个员工\
  \ ID，情况下，服务器程序在数据库中查找该 ID 并返回员工的姓名和联系信息。或者，正如你在上一章中思考的示例那样，关于待运物品的信息可能会被传递给服务器，之后服务器查找运费并返回它。\n\
  \n与 Ajax 应用程序的客户端（那是 JavaScript 的专属领域）不同，服务器端在使用何种编程语言创建服务器程序方面是完全开放的。幸运的是，有一些被广泛支持且相对易于修改和使用的流行选项。这些选项中的之一是\
  \ `PHP`，它是一种非常流行的服务器脚本语言，在创建 Ajax 应用程序时非常方便。与运行在浏览器上的 JavaScript 代码类似，`PHP` 代码运行在服务器上。再次参考阅图\
  \ 2.1，你可以看到服务器上的 `PHP` 程序如何接收来自浏览器的 Ajax 请求（多亏 JavaScript），然后在处理请求后做出响应。\n\n`PHP`\
  \ 代码（以及所有服务器端脚本）的有趣之处在于，它们最终都会将数据传回客户端。在使用 `PHP` 时，你必须始终记住，无论你正在做什么，最终都会导致数据被传回浏览器。在\
  \ Ajax 应用程序的情况下，`PHP` 脚本将数据传回给 Ajax 请求。\n\n## Ajax 请求生命周期\n\n每个 Ajax 请求都会经历一个可预测的生命周期，在开始查看\
  \ Ajax 应用程序内部构造之前，理解这一点至关重要。Ajax 生命周期中的每个里程碑都对应于 `XMLHttpRequest` 对象中的一个独特状态，该对象是作为\
  \ Ajax 核心 JavaScript 对象。你稍后将学习 Ajax 工具包会让你屏蔽 `XMLHttpRequest` 对象绝大部分的内部机制，但熟悉其工作方式的某些方面仍然是有值的。关于该对象的完整解析，请查看附录\
  \ B，“快速且简便的 XMLHttpRequest 参考”。\n\n以下是 Ajax 请求从创建到提交到成功响应所循环的五种状态：\n\n1. `UNINITIALIZED`——请求未初始化。\n\
  2. `LOADING`——请求已初始化。\n3. `LOADED`——请求已发送，正在等待服务器确认。\n4. `INTERACTIVE`——响应数据正在从服务器下载。\n\
  5. `COMPLETE`——请求/响应周期完成。\n\n生命周期中每个状态的大写名称直接对应于 `XMLHttpRequest` 对象的内部状态。关于这个生命周期的好消息是，你通常只关心最后一个状态\
  \ `COMPLETE`，这是很合理的，因为在请求完成且结果数据可用之前，你不需要采取任何操作。然而，从诊断的角度来看，窥视事务并确保它按预期方式通过生命周期通常是有帮助的。由于这个原因，随书提供的\
  \ 提供的 Ajax 工具包包含一个诊断功能，可以可视化地显示 Ajax 请求执行的每种状态。\n\n### 注意\n\n![注意](img/note.jpg)\n\
  \n考虑到 Booker 示例程序的性质，你可能会认为这是同步应用程序的绝佳机会，因为等待书籍加载之外没别的事。但如果在书籍下载期间你改变了主意呢？如果用户界面在加载时不锁定你的其他选择，将会好得多。通过使用\
  \ Ajax，你可以在一本书加载时完全自由地选择另一本书。在这种情况下，当前的 Ajax 请求将被取消，另一本书将立即开始加载。\n\n图 2.2 显示了一个名为\
  \ Booker 的 Ajax 示例应用程序，它正在执行请求。Booker 示例应用程序是一个简单的电子书阅读器。\n\n![页面顶部的诊断条显示了书籍查看器示例中的\
  \ Ajax 请求状态。](img/02ack02.jpg)\n\n**图 2.2. 页面顶部的诊断条显示了书籍查看器示例中的 Ajax 请求状态。**\n\n\
  \n\n\n\n在本示例中，H. G. 威尔斯所著*《世界大战》*的全文通过 Ajax 请求进行加载并显示。由于该书的大小有几百 KB，请求完成需要一些时间，这当然取决于连接速度。图\
  \ 2.2 显示应用程序正处于 `INTERACTIVE`（“正在下载响应...”）状态，这意味着服务器响应（书籍文本）正在下载中。请注意，书籍文本将出现的区域包含“加载中...”消息，这表明目前还没有显示内容是有原因的。几刻之后，请求状态变为\
  \ `COMPLETE`（“请求已完成！”），书籍文本将出现在页面的主要部分（参见图 2.3）。\n\n![请求完成后，电子书的全文就会出现。](img/02ack03.jpg)\n\
  \n**图 2.3. 请求完成后，电子书的全文就会出现。**\n\n### 注意\n\n![注意](img/note.jpg)\n\n本示例中使用的所有书籍都是公有领域书籍，由免费电子书制作者\
  \ Project Gutenberg 计划提供的电子化版本。要了解更多信息，请访问 Project Gutenberg 在线网站：[`www.gutenberg.org/`](http://www.gutenberg.org/)。\n\
  \n你可能已经注意到页面顶部 Ajax 诊断栏下方有一个电子书选择列表。这不仅允许你访问不同的书籍，还作为观察不同长度 Ajax 请求发生的良好方法。为了测试我所说的内容，请在附带的实时\
  \ Linux 刻盘中打开 `chap02` 文件夹中的 `booker.html` 页面。查看器中初始加载的书籍是刘易斯·卡罗尔的*《爱丽丝仙仙游》*。点击选择列表并选择*战争与和平》。这部被广泛认为有史以来最厚重的小说之一，列夫·托尔斯泰著的《战争与和平》原始文本重量约为\
  \ 3MB。即使直接从 CD-ROM 上执行 Ajax 请求的速度相对很快，你仍然会注意到 Ajax 诊断栏中的状态变化。\n\n### 注意\n\n![注意](img/note.jpg)\n\
  \n随着阅读的进行，你可以根据是否需要监控请求状态，在每个应用程序中开启或关闭 Ajax 诊断栏。\n\n## 了解 Ajax 工具包\n\n我已经多次提到了随书附带的\
  \ CD-ROM 中的 Ajax 工具包——现在是时候确切了解它是什么以及它是如何工作的了。如果你进行大量的自行 Ajax 开发，最终会发现，市面上真的有几十甚至上百个\
  \ Ajax 库，旨在让使用 Ajax 变得更简单、更高效。许多库确实实现了它们的目标。问题是，其中许多库的学习曲线和 Ajax 本身一样大，除非你正在构建一个带有大量花哨巨型\
  \ Ajax 应用，否则这不是一件好事。而在那种情况下，你最终可能还是想构建自己的 Ajax 库。\n\n为了保持尽可能简单直接，我选择为本书构建了一个用于本书的自定义\
  \ Ajax 库，它应该可以作为你将 Ajax 功能集成到 Web 页面中的起点。在许多情况下，你可以原封不动地使用我的代码来获得结果。除此之外，你可能想要温习\
  \ JavaScript 和 XML，将我的代码提升到另一个水平。无论如何，我的 Ajax 工具包都可以作为 Ajax Web 开发的便捷启动器，且学习曲线非常低。\n\
  \n我实用的 Ajax 工具包由几个 JavaScript 文件组成，每个文件都包含 JavaScript 函数和相关的辅助代码：\n\n*   `ajaxkit.js`——核心\
  \ Ajax \n*   `domkit.js`——DOM（文档对象模型）\n*   `modalimgkit.js`——模态图像\n*   `validatekit.js`——数据验证\n\
  *   `infowinkit.js`——信息窗口\n*   `ratingkit.js`——五星评分\n\n我说的“辅助代码”是指这些文件提供了预构建的代码，旨在让某些任务变得极其容易。并不是所有这些文件都包含在你所开发的每个\
  \ Ajax Web 页面中——你根据需要使用它们。例如，以下是将前两个文件导入页面的代码，它们必须放在页面的 `<head>` 中：\n\n```\n<script\
  \ type=\"text/javascript\" src=\"ajaxkit.js\"> </script>\n<script type=\"text/javascript\"\
  \ src=\"domkit.js\"> </script>\n```\n\n一旦将这些代码行添加到页面中，你就可以自由地使用 Ajax 工具包文件中提供的任何功能。\n\
  \n接下来的几节将更详细探索 Ajax 工具包的不同部分。虽然我会快速解释每个工具包文件中的所有不同 JavaScript 函数，但你不需要将它们背记于心，甚至不需要完全理解它们的作用。目前的目标仅仅是让你大致了解工具包每个部分提供了什么——书的其余部分将在当每个图块开始发挥作用时，更详细地回顾该工具包。\n\
  \n### `ajaxkit.js` 文件\n\n工具包的 `ajaxkit.js` 部分仅由两个 JavaScript 函数组成，分别处理 Ajax 请求和更新诊断栏：\n\
  \n```\najaxSendRequest(type, url, postData)\najaxUpdateState()\n```\n\n如果你熟悉 JavaScript\
  \ 函数，只需知道它们是执行特定任务的可重用代码块。在这种情况下，`ajaxSendRequest()` 函数根据提供的参数向服务器发送 Ajax 请求。再次，现在不需要理解这些函数——当你看到\
  \ `ajaxSendRequest()` 如何使用时就会理解了。现在，只需知道参数对应于请求类型（`GET` 或 `POST`）、处理请求的服务器地址、你提供的处理服务器响应的自定义函数，以及如果是\
  \ `POST` 则所需的的数据类型和数据。\n\n### 注意\n\n![注意](img/note.jpg)\n\nAjax 请求类型（`GET` 或 `POST`）直接源于\
  \ Ajax 请求本质上就是 HTTP 请求。如果你处理过 HTML 表单，就应该对 `GET` 和 `POST` 请求有一定的了解。通常情况下，想法是：如果你只是从服务器获取信息，就使用\
  \ `GET` 请求，而 `POST` 则更多用于向服务器传递信息。\n\n为了证明 `ajaxSendRequest()` 函数使用起来并不困难，这里是书籍书示例中使用的精确\
  \ Ajax 请求：\n\n```\najaxSendRequest(\"GET\", \"book_\" + title + \".txt\", handleRequest);\n\
  ```\n\n即使不深入研究 JavaScript，也能看出第一个参数表示这是一个 `GET` 请求，第二个参数正在组装文件名，例如 `book_alicewonderland.txt`，最后一个参数是自定义处理函数的名称。你将在本章稍后的部分再次回到这段代码。\n\
  \n\n\n\n调用 JavaScript 函数意味着你告诉该函数去执行它设计时指定的任何任务。处理函数（handler function）简单来说就是在某个事件发生时被调用的函数。例如，当发生鼠标点击时，鼠标点击事件处理函数就会被调用。同样，每个\
  \ Ajax 应用都有一个自定义的请求处理函数，该函数在请求状态发生变化时都会被调用。这就是为什么在本章早期学习请求状态对你来说如此重要的原因。在“拆解电子书阅读器”章节中，你将重新回顾请求状态，并确切了解它们是如何融入到\
  \ Ajax 工具箱方程式中的。\n\n### `domkit.js` 文件\n\n回到 Ajax 工具箱的各个组成部分，`domkit.js` 文件包含了几个执行不同\
  \ DOM 任务的函数。例如，`replaceText()` 函数负责更改页面上元素的文本：\n\n```\nreplaceText(elem, text)\n\
  ```\n\n如果你以前做过任何 JavaScript 编程，你可能对大多数 HTML 元素的 `innerHTML` 属性熟悉，它用于更改页面上元素的值。在现代\
  \ Web 标准中，该属性的使用被认为是过时的（passé），我们现在鼓励你在大多数情况下使用 DOM 的新功能来更改元素的内容。然而，这种新方法并没有像设置单个属性那样简单。为了避免让你重复一行行必要的代码，我选择创建一个名为\
  \ `replaceText()` 的函数来为你完成内容替换。你只需将元素和新内容传递给它，`replaceText()` 函数就会完成其余工作。例如，下面这段代码将存储在\
  \ `firstName` 中的元素内容更改为 `\"Michael\"`：\n\n```\nreplaceText(firstName, \"Michael\"\
  );\n```\n\n你将在书中示例中经常看到这个函数。只要你将 `domkit.js` 文件导入到页面中，你也可以自由使用该函数。别担心，在示例出现时，你会看到看到如何导入该文件以及使用\
  \ `replaceText()` 函数的，因此在这个阶段完全理解它并不是关键。\n\n与 `replaceText()` 类似的是 `getText()` 函数，它利用\
  \ DOM 提取 HTML 元素的内容：\n\n```\ngetText(elem);\n```\n\n你给这个函数一个 HTML 元素，它会返回该元素的内容。\n\
  \n`domkit.js` 文件还包含了四个用于确定浏览器窗口客户区域大小的函数，这在页面上仔细放置元素时非常有用：\n\n```\ngetClientWidth()\n\
  getClientHeight()\ngetClientLeft()\ngetClientTop()\n```\n\n这些函数返回浏览器客户区域的宽度、高度、左位置和顶位置，客户区域是页面实际所在的区域。换句话说，它不包括围绕页面的各种工具栏、状态栏和其他组件。\n\
  \n`domkit.js` 文件中的最后一个函数用于获取与浏览器存储的 cookie 关联的数据：\n\n```\ngetCookieData(cookieName)\n\
  ```\n\n该函数接受目标 cookie 的名称，然后返回 cookie 值。Cookie 是记住用户在页面上执行过的某些事的方便方式，它们将在书的 第 12\
  \ 章 中出现，届时你将构建一个五星评分应用。\n\n### `modalimgkit.js` 文件\n\n工具箱的 `modalimgkit.js` 部分由单一\
  \ JavaScript 函数组成，该函数为 Web 页面添加模态图像支持：\n\n```\ninitModal()\n```\n\n你将在 第 8 章 中学到更多关于模态图像的知识，但基本思想是允许你从缩略图查看全尺寸图像，而无需将新页面加载到浏览器中。类似于出现在应用程序窗口上的“关于”对话框，模态图像会弹出并显示在当前\
  \ Web 页面之上。\n\n### `validatekit.js` 文件\n\n工具箱的 `validatekit.js` 部分提供了几个验证不同类型用户输入的有用函数：\n\
  \n```\nvalidateNonEmpty(inputControl, helpControl)\nvalidateInteger(inputControl,\
  \ helpControl)\nvalidateNumber(inputControl, helpControl)\nvalidateZipCode(inputControl,\
  \ helpControl)\nvalidatePhone(inputControl, helpControl)\nvalidateEmail(inputControl,\
  \ helpControl)\nvalidateDate(inputControl, helpControl)\n```\n\n这些函数都旨在验证特定的数据类型，并涵盖了你在表单中会遇到的最常见数据类型。函数的两个参数是待验证的输入控件，以及在检测到验证问题时显示帮助消息的输出元素。\n\
  \n## `infowinkit.js` 文件\n\n工具箱的 `infowinkit.js` 部分包含了用于向页面添加基于 Ajax 的信息弹出窗口的函数：\n\
  \n```\ninitInfoWindow(width, height) {\nshowInfoWindow(infoURL, evt)\n```\n\n第一个函数最初调用以设置信息窗口的宽度和高度，而第二个函数则实际上显示带有来自指定\
  \ URL 内容的信息窗口。\n\n### `ratingkit.js` 文件\n\n工具箱的 `ratingkit.js` 部分实现了一个可以添加到任何站五星评分系统，包括为多个项目添加评分支持：\n\
  \n```\ninitRatings()\nsetRating(id, rating)\n```\n\n第一个函数用于初始化评分系统，而第二个函数设置特定项目的评分。系统中的每个项目都分配有一个唯一的\
  \ ID，这是传递给 `setRating()` 的第一个参数。第二个信息是评分本身，范围在 `1` 到 `5` 之间。\n\n## 拆解电子书阅读器\n\n\
  是时候停止在 Ajax 理论的虚拟世界中，进入现实了。本章的剩余部分将探索你在图 2.2 和 2.3 中看到的阅读器的内部机制，并解释它的工作原理。你可以将这一节看作后续章节的微缩版本——一个可以根据你的需要随时使用的真实\
  \ Ajax 应用剖析。虽然我无法保证你在没有 JavaScript 经验的情况下理解每一行代码，但我可以明确指出相关的代码，以便你根据自己的需求进行明智的修改。换句话说，我不一定教你如何成为一名修理工，但我会告诉你在哪里转扳手。\n\
  \n在本章早期，我解释了每个 Ajax 应用最终归结为两个部分——客户端（浏览器）侧的 JavaScript 程序和负责响应 Ajax 请求的服务器端程序。虽然服务器端程序可以使用任何语言编写，但本书的大多数示例侧于\
  \ PHP。Booker 示例的独特之处在于由于 Ajax 请求仅仅是从 Web 服务器加载整个电子书文本文件，因此服务器本身就足够了。\n\n\n\n\n当然，客户端仍然需要一些自定义编程，以响应用户从选择列表中选择电子书的操作。这些自定义代码必须异步地从服务器加载电子书，并将其显示在页面上。在许多方面，这是所有\
  \ Ajax 请求中最基础的一种了，因为你不需要向服务器传递任何信息——你只需要在发起 Ajax 请求时指定电子书文本文件的文件名即可。关于这一细节，稍后我们会详细介绍；让我们先回顾一下电子书。\n\
  \n### 电子书\n\n在 Booker 示例中，电子书是以原始文本文件的形式提供的，具有熟悉的 `.txt` 文件扩展名。你可以像在 Linux 系统上使用\
  \ `Vi`、`Emacs` 或 `Pico`，在 Windows 系统上使用 `Notepad`，或在 Mac 上使用 `TextEdit` 一样，打开并编辑这些文件。示例应用程序中随带包含了以下书籍及其相关的文本文件：\n\
  \n*   《爱丽丝在仙游境》—`book_alicewonderland.txt`\n*   《弗兰肯斯坦》—`book_frankenstein.txt`\n\
  *   《白比·鲸》—`book_mobydick.txt`\n*   《战争与和平》—`book_warandpeace.txt`\n*   《世界大战》—`book_warofworlds.txt`\n\
  \n你可能会注意到这些电子书文本文件的命名中有一个非常明显的模式，即它们都遵循 `book_AbbrevTitle.txt` 的格式，其中 `AbbrevTitle`\
  \ 是书名的缩写标题。通过遵循电子书文件名的标准格式，在响应用户从页面选择列表中选择时，程序化地加载每本书将变得容易得多。具体来说，可以使用以下公式程序化地构建文件名：\n\
  \n```\n\"book_\" + AbbrevTitle + \".txt\"\n```\n\n正如你稍后看到的，这实际上正是处理响应选择变化时加载电子书的代码工作方式。\n\
  \n### Booker 页面\n\nBooker 示例应用程序中的所有繁重工作都在 `booker.html` Web 页面中完成，该页面包含了 HTML 和\
  \ JavaScript 代码，以及零星几处的 CSS 样式。不过，在深入研究代码之前，让我们再次查看 图 2.4 中运行的应用程序，这次加载的是电子书《弗兰肯斯坦》。\n\
  \n![请求完成后，电子书的完整正文将出现。](img/02ack04.jpg)\n\n图 2.4. 请求完成后，电子书的完整正文将出现。\n\n尽管 JavaScript\
  \ 代码出现在实际 HTML 文档的开头，但先看一眼 body HTML 代码会更有意义：\n\n```\n<body style=\"background:#EEEEEE\"\
  \n  onload=\"document.getElementById('book').selectedIndex = 0;\n  loadBook(document.getElementById('book').options[\n\
  \  document.getElementById('book').selectedIndex].value)\">\n  <div id=\"ajaxState\"\
  \ style=\"display:block\"></div>\n  <br />\n  <div style=\"margin-left:10%\">Select\
  \ book:\n    <select id=\"book\" onchange=\n      \"loadBook(this.options[this.selectedIndex].value)\"\
  >\n      <option value=\"alicewonderland\">Alice's Adventure's in\n        Wonderland\
  \ by Lewis Carroll</option>\n      <option value=\"frankenstein\">Frankenstein by\
  \ Mary\n        Shelley</option>\n      <option value=\"mobydick\">Moby Dick by\
  \ Herman\n        Melville</option>\n      <option value=\"warandpeace\">War and\
  \ Peace by Leo\n        Tolstoy</option>\n      <option value=\"warofworlds\">The\
  \ War of the Worlds by H.G.\n        Wells</option>\n    </select>\n  </div\n  <br\
  \ />\n  <div id=\"booktext\" style=\"margin-left:10%; margin-right:10%;\n    padding:2%;\
  \ background:#FFFFFF; border:thin solid #333333\">\n    </div>\n</body>\n```\n\n\
  这段代码的大部分由 `<select>` 标签内的电子书选择列表组成。注意，每本书的缩写标题被指定为每个电子书 `<option>` 标签的 `value` 属性。这就是\
  \ JavaScript 代码如何从选择列表中的值（`alicewonderland`）组合成书籍文本文件的名称（`book_alicewonderland.txt`）。\n\
  \n页面向下移动一点，你会看到一个 ID 为 `booktext` 的 `div` 元素。这个 `div` 元素用于存放通过 Ajax 请求加载电子书后的文本内容。换句话说，这个\
  \ `div` 是页面的主要区域。应用于 `div` 上的各种 CSS 样式使其在页面居中，让文本与边缘留有一定的距离，并给它一个可见的边框。该 `div` 元素的\
  \ ID 用于页面 JavaScript 代码，在通过 Ajax 请求加载后设置电子书文本。\n\n回过来看选择列表，页面中可能最关键的代码是选择列表的 `onchange`\
  \ 事件处理器，它包含了以下 JavaScript 代码：\n\n```\nloadBook(this.options[this.selectedIndex].value)\n\
  ```\n\n```javascript\nfunction loadBook(title) {\n  replaceText(document.getElementById(\"\
  booktext\")), \"Loading...\");\n  ajaxSendRequest(\"GET\", \"book_\" + title + \"\
  .txt\", handleRequest);\n}\n```\n\n\n\n在 `if` 语句中，调用了 `replaceText()` 函数来将页面上的主\
  \ `div` 元素（`booktext`）设置为刚刚加载的电子书文本。这段代码的关键在于请求对象的 `responseText` 属性，它包含了来自请求的响应数据。在处理\
  \ Ajax 请求的结果时，你始终使用 `responseText` 属性来处理原始文本数据，或者使用 `responseXML` 属性来处理 XML 数据。\n\
  \n`handleRequest()` 函数中最后一行有意义意义的代码是对 `ajaxUpdateStatus()` 函数的调用，它负责更新 Ajax 诊断条。将此函数保持在\
  \ `if` 语句之外是非常重要的，因为这样每当 `XMLHttpRequest` 对象的状态发生变化时，它都会被调用。我还没有提到的一点是，该函数要求在页面上放置一个特殊的\
  \ `div` 元素。如果你回看 Booker 应用页面的 HTML 代码，你会看到一个代码如下的 `div` 元素：\n\n```\n<div id=\"ajaxState\"\
  \ style=\"display:block\"></div>\n```\n\n`ajaxUpdateStatus()` 函数会寻找 ID 为 `ajaxState`\
  \ 的 `div` 元素，然后相应地设置该 `div` 的背景颜色和内容。要隐藏 Ajax 诊断条，只需将 `div` 元素的样式属性更改为 `display:none`。之后如果需要，你也可以通过将样式改回\
  \ `display:block` 来再次显示诊断条。当你完成 Ajax 应用开发并准备好完全消除诊断条时，只需删除该 `div` 元素以及对 `ajaxUpdateStatus()`\
  \ 的调用即可。\n\n我尚未解释的一项后续工作是 `body` 元素的 `onload` 事件处理器，它非常重要，因为它确定了初始选择的是哪本电子书，并确保书籍能够被正确加载。以下是在\
  \ `onload` 事件处理器中设置的代码：\n\n```\ndocument.getElementById('book').selectedIndex =\
  \ 0;\nloadBook(document.getElementById('book').options[\n  document.getElementById('book').selectedIndex].value);\n\
  ```\n\n第一行将选择列表中的选定项目设置为列表中的第一个项目（项目 `0`）。你使用 `0` 作为第一个项目，是因为选择列表的索引是从 `0` 开始并递增的。如果你想选择第二个项目，则会将\
  \ `selectedIndex` 属性设置为 `1`。\n\n第二行和第三行代码实际上只是由于代码太长而跨越两行的单行代码。由于需要两次使用 `getElementById()`\
  \ 函数获取选择列表对象，代码变得有点杂乱。如果将 `getElementById()` 函数调用替换为某个名称，代码将容易理解得多。以下是该代码的简化版本，将选择列表对象重命名为\
  \ `sel`：\n\n```\nsel.selectedIndex = 0;\nloadBook(sel.options[sel.selectedIndex].value);\n\
  ```\n\n现在，希望你能够看到如何向 `loadBook()` 函数传递当前所选电子书的值。或者更具体地说，向它传递了当前所选电子书的缩写标题。如果你还记得在之前讨论中提到的话，`loadBook()`\
  \ 函数使用这个缩写标题来为电子书构建文件名，并将其作为 Ajax 请求的一部分传递过去。\n\n## 定制化电子书阅读器\n\n我知道，最后几页很可能让你怀疑所有这些\
  \ Ajax 的东西，以及它是否真的值得费这些脑筋。在这里，我必须重申，这里的目标仅仅是让你尝试一下，而不是向你展示一场“火中演练”式的 Ajax 教程。请记住，本书的假设是为你提供即插即用的\
  \ Ajax 应用和组件，你可以以最小的努力将它们复用到自己的 Web 页面。事实证明，这种最小的努力有时需要一些微小的 JavaScript 调整，这就是为什么我想让你尽早看到一些代码。\n\
  \n说到复用代码，你是否已经在考虑 Ajax 对你自己的 Web 页面会有何用？你可以这样想：尽管该应用目前被用作原始的电子书阅读器，但它的核心在于允许用户动态地选择和加载文档。对于任何包含大量文档的归档网站来说，都是如此，你可能希望根据自己的需求定制\
  \ Booker 示例。以下是你可以通过较小努力修改应用程序的方法：\n\n- **添加更多内容**：通过向服务器复制新的电子书文本文件并为选择列表添加新的选项，你可以轻松扩展应用程序。只需确保每个\
  \ `<option>` 标签的 `value` 属性（例如 `warofwords`）与你用于书籍的文件（`book_warofwords.txt`）匹配即可。\n\
  - **更改书籍内容的渲染**：如果你希望电子书籍更易于阅读，可能考虑增大字体大小，甚至选择更合适的字体。由于所有的书籍内容都流向 ID 为 `booktext`\
  \ 的 `div` 元素，你可以通过为该 `div` 元素添加一些 CSS 样式来轻松更改书籍的外观。\n- **关闭 Ajax 诊断条**：在发布你的应用程序之前，不要忘记关闭\
  \ Ajax 诊断条。只需从页面的 HTML 部分删除 ID 为 `ajaxState` 的 `div` 元素，然后删除 JavaScript `handleRequest()`\
  \ 函数中调用 `ajaxUpdateStatus()` 的代码即可。\n\n如果你认为 Booker 应用的另一个酷炫调整可能是一次加载并显示电子书的每一个章节，那么你的想法完全正确，因为下一章恰好解决了这一挑战。\n\
  \n## 总结\n\n确实，这一章很快就进入了快节奏。你最初对 Ajax 机器的各个部分进行了谨慎的探索，学习了一些 Ajax 请求生命周期的知识，然后通过全力冲刺对\
  \ Ajax 工具包进行了快速上手介绍，并对你的第一个完整的 Ajax 应用进行了震撼性的介绍。我能说的就是从现在开始事情只会变得更好。\n\n\n\n上一章探讨了使用\
  \ `Ajax` 动态加载数据的基础，但电子书的示例效率相当低，因为它要求你等待整本书加载完毕后才能阅读任何内容。Booker 应用也只演示了如何加载原始文本文件，这在处理\
  \ Ajax 方程中的 XML 部分方面并没有起到太大作用。实际上，处理 XML 格式的电子书更具意义，因为这让你能够根据需要挑选和选择想要处理的信息。具体来说，按章节访问\
  \ XML 电子书是相对直观的，这可以缩短每个 `Ajax` 请求的传输时间，并通过一次只显示一个章节来提高书籍的可读性。\n\n本章将在上一章 Booker\
  \ 示例的基础上，引导你使用 `XML` 作为电子书数据格式对应用程序进行重新设计。除了能直观看到 `XML` 如何融入到实际的 `Ajax` 应用中之外，你还能够感受到，当你减少每次请求交换的数据量时，应用程序的响应速度会变得快出多少。\n\
  \n本章中的 Booker 应用使用了以下文件，这些文件位于存有书籍的 Linux 光盘 `chap03` 示例代码文件夹中：\n\n* `booker.html`—主\
  \ Web 页面\n* `booker.php`—用于加载电子书章节的服务器脚本\n* `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n\
  * `domkit.js`—Ajax Toolkit 的 DOM 相关函数\n* `book_alicewonderland.xml`—《爱丽丝仙仙游记》XML\
  \ 电子书\n* `book_frankenstein.xml`—《弗兰肯斯坦》XML 电子书\n* `book_mobydick.xml`—《莫比迪克》XML\
  \ 电子书\n* `book_warandpeace.xml`—《战争与和平》XML 电子书\n* `book_warofworlds`—《世界大战》XML 电子书\n\
  \n## 挑战：分小块加载数据\n\n如果你在读完上一章后停了一个一个月，试图阅读《战争与和平》电子书，那么你很快就会发现 Booker 示例应用在性能上略显不足。问题在于，该程序将电子书视为一个巨大的原始文本块，当你尝试阅读一本像《战争与和平》这样重量超过\
  \ 3MB 的真正头大书时，这非常笨拙。我不知道你的网络连接如何，但即使是我的宽带连接在加载 3MB 的文本文件时也会感到吃力，并且非常缓慢。\n\n原始 Booker\
  \ 应用不仅传输时间是一个问题，而且尝试在单个页面上显示整本书本身就存在着严重的易用性问题。这样想——物理纸质书首先被拆分成章节，然后进一步分成页。这不仅为你提供了一个放置书签的好地方来记录你自己在书中的位置，而且在读完一段较长的文本后，翻页提供了一个有用的心理休息。Booker\
  \ 则并非如此。整本 3MB 的小说被挤进你浏览器里的一个巨大肥胖的虚拟页面中。除非你是某种超人般的速读者，否则你会立刻讨厌这种阅读方式。\n\n因此，我们评估认为第一个\
  \ Booker 应用存在一些问题，并且本着动态数据加载的精神，`Ajax` 显然提供了一个解决方案。事实上，在一点 `Ajax` 的帮助下，可以动态地仅加载你需要的内容，对于电子书来说，也就是一个章节。这种改变让你一石二得，因为一次加载一个章节书籍数据的新方法由于每个\
  \ `Ajax` 请求中传输的数据量大幅减少，带来了显著的性能提升。接下来的挑战就是开发一个改进后的 Booker 版本，实现一次加载一个章节。\n\n###\
  \ Note\n\n![Note](img/note.jpg)\n\n考虑将电子书拆分为单独的页面而不仅仅是章节，并不是不可行的。然而，什么来定义一页的长度呢？物理纸质书在不同尺寸和字体打印时显然并不遵循相同的页数。Web\
  \ 浏览器在显示信息量方面也更加多样化。因此，将“章节”作为将电子书拆分为组成部分的度量单位是有意义的。后，如果你想通过程序化对一个章节进行分页，以适应特定的浏览器窗口从而提高可读性，那是完全没问题的。但对于组织和加载\
  \ XML 电子书而言，章节是更好的选择。\n\n在进入新的电子书查看器应用程序的设计阶段之前，值得我们后退一步，重新评估原始的 Booker 应用并看看它是如何工作的。通过这样做，你将对在设计新应用程序时面临的挑战有一个更准确的把握。\n\
  \n首先，图 3.1\n\n图 3.1. 当用户从列表中选择书籍时，原始 Booker 应用会加载电子书的全部文本。\n\n在幕后，Booker Web 页面使用\
  \ `Ajax` 请求根据用户的选择来动态加载书籍文本。从 Ajax 的角度来看，原始 Booker 应用可能是所有 Ajax 请求中最简单的，因为它处理的是未格式化的数据（原始文本），并且直接从服务器文件获取数据；不需要服务器程序进行处理。\n\
  \n新版本 Booker 的挑战在于首先将电子书重新格式化为结构化的 XML 文档，然后重构 Web 页面以便加载单个章节而不是整本书。这还将涉及用户界面的变化，因为用户现在可以在章节之间跳转。事实证明，这种数据格式的微妙变化对\
  \ Booker 应用的设计实现产生了显著影响。\n\n## 设计：设计 XML 电子书查看器\n\n好了，现在你正在重构 Booker 应用，通过 Ajax\
  \ 请求使用 XML 格式加载电子书。这意味着你首先需要为书籍设计一种合适的 XML 格式，以便一次访问一个章节。确定了 XML 格式后，你需要弄清楚 Ajax\
  \ 请求期间服务器和客户端之间具体传输了什么。显而易见的是章节文本会被发送，但现在由于电子书的格式更加智能，你应该能够作为请求的一部分接收到章节标题。然后你可以将章节名称作为标题显示在章节文本上方，让页面更有真实书籍的感觉。\n\
  \n### Note\n\n如果你对 XML 不熟悉，不用担心，因为在看到它的运行之后会很容易理解。事实上，当你创建 HTML Web 页面时，已经在间接使用\
  \ XML 了。HTML，或者说是它更正式的兄弟版本 XHTML，可以被看作 XML 的特定应用。\n\n### 客户端请求\n\n\n\n\n\n因此，新款改进版\
  \ Booker 应用程序设计中的很大一部分工作，就是准确地确定哪些信息需要在客户端和服务器之间传输，以及从服务器传回客户端。你可能还记得，每本电子书都存储在自己的文件中。在第一个\
  \ Booker 应用程序中，书籍的简写标题会作为 Ajax 请求的一部分发送——这就是请求知道要打开哪个文件的方式，而这又决定了加载的本书。在较新的版本中，你不再请求整本书，而是请求书的某一个章节。出于这个原因，你除了简写标题外，还需要传递章节信息。为了保持简单且高效，章节可以指定为一个数字，其中\
  \ `0` 是第一章，`1` 是第二章，依此类推。\n\n### 注意\n\n![Note](img/note.jpg)\n\n由于许多书籍包含诸如引言、序言、结语等“章节”内容，因此在指代从\
  \ XML 文档加载章节时对应的“**数字**”时，使用不同的术语会更好。将这个数字称为“章节索引”（chapter index）实际上更符合逻辑。因此，如果一本书在第\
  \ 1 章之前有一个引言和一个序言，那么它们的章节索引分别为 `0`、`1` 和 `2`。\n\n总结一下，在新款版 Booker 应用程序中，必须从客户端向服务器发送以下两个信息来启动电子书请求：\n\
  \n*   简写标题（例如，`alicewonderland`）\n*   章节索引（例如，`0`）\n\n现在让我们关注转向服务器端，看看它在接收到客户端请求后需要做什么。\n\
  \n### 服务器响应\n\n服务器的任务是获取简写的电子书标题和章节索引，并返回章节文本以及在客户端电子书查看器语境下可能有用的其他内容。你已经确定知道章节标题是一个很有用的信息。然而，有些书籍更进了一步，既有章节编号又有章节标题。既然如此，从服务器同样接收章节编号可能也是个好主意。这也有助于处理那些不属于正常章节命名范围的“章节”情况，例如引言或结语。在这种情况下，“章节编号”可能是“引言”，而不是“第\
  \ 1 章”。\n\n尽管你可以在此停下，并顺利实现一个支持独立章节的电子书查看器，但仍然缺少一个关键信息。要理解缺失了什么，评估应用程序的用户界面将如何运作至关重要。想一想，实体书的操作是基于翻页的理念。尽管电子书查看器没有将书籍分成页码，但像翻页一样在章节之间移动的概念是一个好主意。这可以通过“上一个”和“下一个”按钮来实现，如图\
  \ 3.2 所示。\n\n![这些按钮为在电子书中导航章节提供了一种直观的手段。](img/03fig02.gif)\n\n**图 3.2. 上一个和下一个按钮为在电子书中导航章节提供了一种直观的手段。**\n\
  \n注意图中，章节可以被看作是在逻辑上一个一个接一个地出现。“下一个”和“上一个”按钮允许你以任何方向从一个章节导航到下一个章节。但你如何知道何时停止呢？这似乎是一个微小的问题，但它非常重要，因为它揭示了你必须知道总共有多少章，以便知道何时禁用“下一个”按钮。“上一个”按钮更容易处理，因为你已经知道哪是第一章。最后一章则比较棘手，因为你不需要将所有章节都加载到应用程序并记住最后一章的名字。更整洁的方案是将总章节数作为\
  \ Ajax 请求的一部分返回。\n\n有了总章节数，你可以简单地将当前查看的章节与总章节数进行比较，判断“下一个”按钮是否可用。也就是说，如果读者正在查看最后一章，你就禁用“下一个”按钮。总章节数是使这种用户界面技巧成为关键信息。\n\
  \n回顾 Booker 应用程序从服务器到客户端的数据传输部分，以下是发送的内容：\n\n*   章节编号（例如，`Chapter I`）\n*   章节标题（例如，`Down\
  \ the Rabbit-Hole`）\n*   章节文本（例如，`Alice was beginning to...`）\n*   总章节数（例如，`12`）\n\
  \n考虑到服务器的响应，现在可以组合整个客户端服务器对话，并深入研究数据在其中究竟是如何表示的。\n\n### 理解客户端-服务器对话\n\n整合应用程序的整个数据传输链路，你得到了图\
  \ 3.3，它显示了从客户端到服务器再返回客户端的信息流，这些都是 Ajax 请求的一部分。\n\n![Ajax 请求中客户端和服务器之间的数据流是 Booker\
  \ 应用程序的关键部分。](img/03fig03.gif)\n\n**图 3.3. Ajax 请求中客户端和服务器之间的数据流是 Booker 应用程序的关键部分。**\n\
  \n该图揭示了多个信息如何在客户端和服务器之间往返传输。你已经从原始 Booker 应用程序知道，作为 URL 的一部分向服务器发送信息并不困难。例如，旧版本\
  \ Booker 的电子书简写标题是通过 URL 发送的：\n\n```\nbooker.php?title=alicewonderland\n```\n\n\
  你可以通过 `&` 将章节索引与标题分开，将其作为 URL 的第二个参数。这涵盖了从客户端到服务器的数据传输。从服务器返回客户端的数据要复杂得多，因为它包含了整个章节的内容，以及其他书籍信息，包括章节编号、章节标题和总章节数。这些数据需要相当复杂的格式，以确保可以在客户端被干净地提取。事实证明\
  \ XML 为这种数据格式提供了完美的解决方案。即使你不是 XML 专家，我认为你理解以下代码也不会太困难：\n\n```\n<bookData>\n  <chapNum>Chapter\
  \ I</chapNum>\n  <chapTitle>Down the Rabbit-Hole</chapTitle>\n  <chapText>Alice\
  \ was beginning to get very tired of sitting by her sister on the bank, and of having\
  \ nothing to do...</chapText>\n  <totalChapters>12</totalChapters>\n</bookData>\n\
  ```\n\n### 注意\n\n![Note](img/note.jpg)\n\n这些 XML 代码没有任何任何标准或官方定义。它们纯粹是为了 Booker\
  \ 应用程序的需求而创建的。XML 的核心优势之一是它允许你为任何目的创建任何语言。了解这一点，只要在整个应用程序代码中统一使用标签名称，你可以轻松地将 `<bookData>`\
  \ 标签重命名为 `<eBookInfo>` 或 `<booker>`。\n\n\n\n\n如你所示，服务器响应中包含的章节信息使用 XML 标签编码，这些标签清晰地描述了每一条信息。在这个示例中，章节文本被刻意简化了，以便代码更易读。\n\
  \n因此，服务器对客户端的 Ajax 请求响应 XML 数据，其中包含了关于该章节的相关信息。随后，解析 XML 数据并将其显示在页面上就成了客户端的任务。你将在本章稍后的部分详细了解到这是如何操作的。在此之前，涵盖一个额外的设计问题至关重要：对服务器脚本的需要。\n\
  \n新 Booker 应用程序设计的一个关键部分是将每本电子书编码为一个 XML 文档。由于每本电子书都包含许多章节，以及书籍标题和作者等其他信息，理所服务器上必须有某种程序，知道如何接收章节请求并对你刚才看到的\
  \ XML 章节数据做出响应。该服务器程序（在这种情况下为 PHP 脚本）负责解析整本电子书的 XML 数据，提取指定的章节数、章节标题和章节文本，并计算书籍的总章节数。然后，脚本必须将这些信息封装成它自己的\
  \ XML 代码并返回给浏览器。这就是你之前看到的包含 `<bookData>` 标签的代码。\n\n现在你已经有了关于新 Booker 应用程序 Ajax 请求/响应的知识，可以开始组装应用程序了。如果你对如此快速上手\
  \ XML 感到有些担心，不用担心。加载和理解 XML 数据所需的代码少得令人惊讶。此外，拥有一个 XML 数据驱动的应用程序的酷之处在于，一旦它构建完成，你不需要（或者可能完全不需要）过多地改动应用程序代码——你只需通过修改电子书本身的\
  \ XML 就可以进行重大的更改。\n\n## 组装电子书查看器\n\n构建这个功能增强的 Booker 应用程序的最佳方法是将其拆解为各个部分。以下是组成应用程序的三个主要组件：\n\
  \n* XML 文件（`book_alicewonderland.xml`, `book_frankenstein.xml` 等）\n* HTML 网页（`booker.html`）\n\
  * PHP 服务器脚本（`booker.php`）\n\n接下来的几节将更详细地探索 Booker 拼图的这些部分，揭示它们运行的代码。\n\n### Note\n\
  \n![Note](img/note.jpg)\n\n天哪！又要学习一项新技术了——PHP。其实不是。虽然了解 PHP 确实是一个巨大的优势，但你绝对不需要成为\
  \ PHP 程序员才能理解并自定义这个应用程序，书中的任何其他程序也是如此。我刻意将示例应用程序中所有的 PHP 代码结构得极其简单且精简。你遇到的大部分 PHP\
  \ 代码都是“样板”代码，这意味着你不需要为了对应用程序进行微调和自定义而触碰它们。当出现精调 PHP 代码的机会时，我会准确地告诉你在哪里以及为什么。\n\n\
  ### XML 电子书\n\n在原始的 Booker 示例中，电子书被指定为带有熟悉的 `.txt` 文件扩展名的原始文本文件。应用程序打开并显示每本电子书的所有数据，将其视为一整巨大的文本块。新的\
  \ Booker 应用程序要求电子书以 XML 数据格式编码，该格式能够清晰地界定章节和其他信息（如书籍标题、书籍作者、章节标题等）。与文本文件类似，XML 文件可以在任何文本编辑器中打开并编辑。你可以将\
  \ XML 文件看作类似于 HTML 网页文件，区别在于你处理的是自定义的词汇（标签集），而不是 `<html>`、`<p>`、`<div>` 等。XML 文件的扩展名均为\
  \ `.xml`。\n\n### Note\n\n![Note](img/note.jpg)\n\n在讨论 XML 时，你经常看到 `file`（文件）和 `document`（文档）这两个词交替使用。通常情况下，它们的意思相同。它们有时产生差异的地方在于，一段\
  \ XML 代码并不一定关联硬盘上的某个文件。例如，动态生成 XML 代码是完全可能的（而且很有用！），在这种情况下就没有文件的概念。在这种情况下，使用更抽象的术语\
  \ `document` 来指代 XML 代码更为合理。我倾向于整本书中遵循这一术语。\n\n那么，你使用什么种 XML 词汇来表示电子书呢？虽然市面上已经有一些标准的电子书词汇，但它们通常非常复杂，对于这个示例来说大材小用了，因此我认为创建我们自己的会更好。与其向你逐条详细解释每个标签的含义，不如直接看一看来自真实书籍的摘录：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<ebook>\n  <title>ALICE'S\
  \ ADVENTURES IN WONDERLAND</title>\n  <author>Lewis Carroll</author>\n  <chapters>\n\
  \    <chapter num=\"Chapter I\" title=\"Down the Rabbit-Hole\">\n    Alice was beginning\
  \ to get very tired of sitting by her\n    sister on the bank, and of having nothing\
  \ to do...\n    </chapter>\n    <chapter num=\"Chapter II\" title=\"The Pool of\
  \ Tears\">\n    &#39;Curiouser and curiouser!&#39; cried Alice (she was so\n   \
  \ much surprised, that for the moment she quite forgot how to\n    speak...\n  \
  \  </chapter>\n    ...\n  </chapters>\n</ebook>\n```\n\n承认第一行有点晦涩，它表示该 XML 代码遵循\
  \ XML 1.0 标准并使用了标准的字符编码（UTF-8）；这是出现在每个 XML 文档顶部的标准代码。其余部分是电子书特定的代码，根据标签名称应该很容易理解。\n\
  \n它的工作原理如下：每本电子书的代码都封装在一个 `ebook` 元素中，它由起始和结束标签组成：\n\n```xml\n<ebook>\n  ...\n</ebook>\n\
  ```\n\n在 `ebook` 元素内部，你放置另一个用于章节集合的容器元素（`chapters`）。这是添加 `chapters` 元素后的电子书代码：\n\
  \n```xml\n<ebook>\n  <chapters>\n  ...\n  </chapters>\n</ebook>\n```\n\n电子书的每个章节随后使用\
  \ `<chapter>` 标签编码，该标签有两个用于设置章节数和标题的属性：`num` 和 `title`。除了这两个属性，`<chapter>` 标签本身作为章节文本的容器。因此，单个章节看起来如下：\n\
  \n```xml\n<chapter num=\"Chapter II\" title=\"The Pool of Tears\">\n&#39;Curiouser\
  \ and curiouser!&#39; cried Alice (she was so\nmuch surprised, that for the moment\
  \ she quite forgot how to\nspeak...\n</chapter>\n```\n\n章节文本中奇怪的 `&#39;` 是单引号（），经过特殊编码以防混淆\
  \ XML 文档处理器。编码此类元素（在 XML 中也称为 `entity` 实体）的另一种方法是使用 XML 标准的单引号实体，即 `&apos;`。电子书中的引号字符也需要类似的编码，在这种情况下，你使用\
  \ `&#34;` 代替真实的引号（\"）。\n\n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<ebook>\n  <title>世界大战</title>\n  <author>H. G. 威尔</author>\n  <chapters>\n\
  \  <chapter num=\"\" title=\"INTRO\">\n  但如果这些世界真的有人居住，那么谁将居住在那里呢？. . . .  我们还是他们才是世界的主人？.\
  \ . . . .  万物是如何为人类创造的？\n  — 开普勒（引自《忧郁的剖析》）\n  </chapter>\n  <chapter num=\"BOOK\
  \ ONE, CHAPTER ONE\"\n  title=\"THE EVE OF THE WAR\">\n  火星人的降临\n\n  在 19 世纪的最后几年里，没有人相信这个世界正被比人类更高等的敏锐且密切地监视着，而它们又和人类一样凡胎……\n\
  \  </chapter>\n  <chapter num=\"BOOK ONE, CHAPTER TWO\"\n  title=\"THE FALLING STAR\"\
  >\n  接着，第一颗流星之夜降临了。清晨，人们看到了它，它向东方飞过温彻斯特，在大气层高处留下一道火线。可能有数百人看到了它，并认为那是一颗普通的流星……\n\
  \  </chapter>\n  ...\n </chapters>\n</ebook>\n```\n\n当你看到了使用相同格式编码的两本不同书籍后，希望这些\
  \ XML 代码现在看起来更清晰易懂了。值得注意的是，《世界大战》有一点不同之处，它被分成了两个“卷”。我们没有修改整个数据格式来适应这种划分（这等同于另一种指定章节的方式），而是将卷号整合到了章节编号中。与其他一些电子书不同，这本书的有趣之处还在于它同时利用了章节编号和章节标题，这有助于证明这这两项信息都是必要的。\n\
  \n尽管我必须承认这一点也不好玩，但我手动将上一节中的五个示例电子书转换成了你刚刚学习的 XML 格式。在遇到那头“凶猛野兽”（字面意义上的！）《莫比迪克》之前，一切都很费力，因为它被分为\
  \ 102 章！更不用提《战争与和平》了，那部规模宏大的小说为 Booker 应用提供了极佳的压力测试。你最终会发现，将电子书编码为 XML 是定制 Booker\
  \ 应用以满足自己需求中最耗时的部分。\n\n在本节较早的时候，我提到 XML 文件尽管实际上是文本文件，但它们具有 `.xml` 文件扩展名。以下是更新后的\
  \ Booker 应用中使用的示例电子书及其各自的文件名：\n\n*   `爱丽丝梦游仙境`—`book_alicewonderland.xml`\n*   `弗兰肯斯坦`—`book_frankenstein.xml`\n\
  *   `莫比迪克`—`book_mobydick.xml`\n*   `战争与和平`—`book_warandpeace.xml`\n*   `世界大战`—`book_warofworlds.xml`\n\
  \n这些电子书使用了你之前看到的缩写标题命名——唯一的变化是它们拥有 `.xml` 文件扩展名而不是 `.txt`。这意味着你可以通过公式程序化地构建 XML\
  \ 电子书文件名：\n\n```\n\"book_\" + AbbrevTitle + \".xml\"\n```\n\n下一节将揭示 Booker 应用代码如何结合此文件名和章节索引，向服务器发送\
  \ Ajax 请求。\n\n### Booker Web 页面\n\n尽管 Booker 应用有一个服务器端组件，但大部分工作是在客户端完成的，这对应于应用的\
  \ HTML Web 页面部分，`booker.html`。图 3.4 显示了在 Web 浏览器中运行的全新 Booker 应用，它展示了更新后的用户界面，该界面提供了章节导航的按钮。\n\
  \n![现在只显示单个电子书章节，并提供了按钮用于向前和向后导航其他章节。](img/03ack04.jpg)\n\n**图 3.4. 现在只显示单个电子书章节，并提供了按钮用于向前和向后导航其他章节。**\n\
  \n### 注意事项\n\n如果你好奇 Booker 应用中的 Ajax 诊断条去哪了，答案是我隐藏了它，以免分散人们对图表的注意力。事实上，诊断条在书中剩下的任何其他应用中都不会出现。你仍然可以通过移除网页\
  \ HTML 代码中 Ajax 状态 `div`（ID 为 `ajaxState`）的 `display:none` 样式来轻松地在示例中启用诊断条，或者如果你想保留该样式以便日后禁用，可以将样式更改为\
  \ `display:block`。\n\n该图揭示了应用的几个新用户界面方面。首先，注意到章节标题显示在电子书选择列表下方。该区域实际上能够显示章节编号和章节标题，但在《世界大战》引言的情况下，只出现了章节编号（`INTRO`）。\n\
  \n在章节标题（编号 + 标题）下方有两个分别跳转到第一章和上一章的导航按钮。注意，这些按钮在图中是禁用的……（此处根据原文截断）\n\n\n\n\n再次，我意识到对于一本声称不需要了解任何\
  \ JavaScript 的书来说，这段代码确实充满了 JavaScript。但请记住，其要点在于你能够在自己的应用程序中重用这些代码。在你不一定完全理解每一行代码是如何运作的情况下，这是完全可以实现的。尽管如此，有必要对发生的情况勾勒出一个概括的画面，让你对如何进行修改产生一些见解。不要忘记，所有这些代码（以及本节中的剩余代码）都位于随书提供的\
  \ Linux CD 上的 `booker.html` 文件中。\n\n### 用户界面\n首先，用户界面由几个 `div` 元素组成，它们为整洁地组织章节信息和导航按钮提供了良好的手段。与应用程序的上一个版本类似，包含电子书的选取列表使用\
  \ HTML 中的 `<select>` 标签编写。这一版本中更有趣的是导航按钮，它们是使用 `<input>` 标签编写的。\n\n### 导航功能\n“上一页”和“下一页”导航按钮的功能通过调用\
  \ `prevChapter()` 和 `nextChapter()` JavaScript 函数来实现，你稍后就会看到这些函数。首页（<<`）和末尾（>>`）按钮也使用这些函数，但在\
  \ `curChapIndex` 变量的帮助下，该变量跟踪当前的章节索引。稍后当你进入应用程序的 JavaScript 代码时，就会看到这个变量是如何运作的。\n\
  \nBooker 页面主体中另一段非常重要的代码是根据选取列表中的选取变化加载电子书的代码：\n\n```\nloadChapter(this.options[this.selectedIndex].value,\
  \ 0)\n```\n\n这段代码与应用程序上一个版本的选取变化代码相同，不同之处这段代码在传递当前选取电子书（`this.options[this.selectedIndex].value`）的同时，还传递了章节索引（`0`）。函数名也已从\
  \ `loadBook()` 变为 `loadChapter()`，以表示只加载一个章节。对 `loadChapter()` 函数的类似调用出现在 `<body>`\
  \ 标签的 `onload` 事件处理程序中，它负责在页面首次打开时加载列表中第一本电子书的第一章。\n\n### loadChapter 函数\n以下是 `loadChapter()`\
  \ 函数的代码，它根据简短的电子书标题和章节索引，通过 Ajax 请求加载单个章节：\n\n```javascript\nfunction loadChapter(title,\
  \ chapIndex) {\n  // 可能是新书，因此初始化导航按钮\n  if (chapIndex == 0) {\n    document.getElementById(\"\
  homeButton\").disabled = true;\n    document.getElementById(\"prevButton\").disabled\
  \ = true;\n    document.getElementById(\"nextButton\").disabled = false;\n    document.getElementById(\"\
  endButton\").disabled = false;\n  }\n\n  // 设置当前章节索引\n  curchapIndex = chapIndex;\n\
  \n  // 清除上一章节的文本\n  replaceText(document.getElementById(\"chaptext\"),\n    \"Loading...\"\
  );\n\n  // 发送 Ajax 请求加载新章节\n  var bookURL = \"booker.php?title=\" +\n    encodeURIComponent(title)\
  \ +\n    \"&chapIndex=\" + encodeURIComponent(chapIndex);\n  ajaxSendRequest(\"\
  GET\", bookURL, handleRequest);\n}\n```\n\n函数的前几行初始化了导航按钮，以便它们根据第一本书的第一章被适当地启用或禁用。然后存储了当前章节索引，因为你需要记住它才能成功地从一个章节导航到下一个章节。章节文本区域兼具双重职责：它作为章节加载的状态通知，在章节加载期间设置为\
  \ `Loading...`。一旦章节加载完成，此文本将被实际的章节文本替换。最后，通过 `GET` 请求方法，将简短标题和章节索引封装到 URL 中，发送实际的\
  \ Ajax 请求。注意，熟悉的 `handleRequest()` 函数被指定为请求处理程序，这意味着它在请求完成时被调用。\n\n### handleRequest\
  \ 函数\n`handleRequest()` 函数承担了 Booker 应用程序中大部分的工作，在这种情况下，它包括接收 XML 格式书籍数据、提取重要信息并相应地更新页面上的元素。在探索该函数的代码之前，让我们花一点时间回顾一下从服务器\
  \ Ajax 响应返回的 XML 数据格式：\n\n```xml\n<bookData>\n  <chapNum />\n  <chapTitle>INTRO</chapTitle>\n\
  \  <chapText>\n  But who shall dwell in these worlds if they be\n  inhabited? .\
  \  .  .  Are we or they Lords of the\n  World? .  .  .  And how are all things made\
  \ for man?\n  — KEPLER (quoted in The Anatomy of Melancholy)\n  </chapText>\n  <totalChapters>28</totalChapters>\n\
  </bookData>\n```\n\n这是一个必须由 `handleRequest()` 函数处理的 XML 数据示例，其代码如下：\n\n```javascript\n\
  function handleRequest() {\n  if (request.readyState == 4 && request.status == 200)\
  \ {\n    // 存储 XML 响应数据\n    var xmlData = request.responseXML.getElementsByTagName(\n\
  \      \"bookData\")[0];\n\n    // 存储总章节数\n    totalChapters =\ngetText(xmlData.getElementsByTagName(\"\
  totalChapters\")[0]);\n\n    // 显示章节信息\n    var chapNum = getText(xmlData.getElementsByTagName(\n\
  \      \"chapNum\")[0]);\n    var chapTitle =\n    getText(xmlData.getElementsByTagName(\"\
  chapTitle\")[0]);\n    var chapInfo;\n    if (chapNum.length > 0 && chapTitle.length\
  \ > 0)\n      chapInfo = chapNum + \" : \" + chapTitle;\n    else\n      chapInfo\
  \ = chapTitle;\n    replaceText(document.getElementById(\"chapinfo\"), chapInfo);\n\
  \n    // 显示章节文本\n    replaceText(document.getElementById(\"chaptext\"),\n     getText(xmlData.getElementsByTagName(\"\
  chapText\")[0]));\n  }\n ajaxUpdateState();\n}\n```\n\n代码首先检查 Ajax 请求是否完成，然后将 XML\
  \ 数据缩小到第一个 `bookData` 元素。从那里，使用 JavaScript DOM 函数从 XML 数据中提取每个数据。例如，总章节数通过以下行代码获取并存储在\
  \ `totalChapters` 变量中：\n\n```javascript\ntotalChapters =\ngetText(xmlData.getElementsByTagName(\"\
  totalChapters\")[0]);\n```\n\n如果总章节数在 XML 中使用了不同的标签名称（例如 `<NumberOfChapters>`），那么之前的行代码只需更改为：\n\
  \n```javascript\ntotalChapters =\ngetText(xmlData.getElementsByTagName(\"NumberOfChapters\"\
  )[0]);\n```\n\n这是一个在不一定深入研究实现其功能的 DOM 函数细节的情况下修改应用程序 XML 处理代码的示例。\n\n### 注意\n![Note](img/note.jpg)\n\
  \n在 Booker 应用程序中使用的 `getText()` 和 `replaceText()` 函数不是标准的 DOM 函数，而是随书包含在 `domkit.js`\
  \ 文件中的函数。上一章解释了这些函数以及 Ajax 工具包中其他函数的相关性。\n\n你尚未看到的 Web 页面剩余部分是响应导航按钮点击的两个函数：`prevChapter()`\
  \ 和 `nextChapter()`。让我们从 `prevChapter()` 函数开始，其代码如下：\n\n\n\n\n\n```\nfunction prevChapter()\
  \ {\n  if (curchapIndex > 0) {\n    curchapIndex—;\n    document.getElementById(\"\
  nextButton\").disabled = false;\n    document.getElementById(\"endButton\").disabled\
  \ = false;\n  }\n  if (curchapIndex == 0) {\n    document.getElementById(\"homeButton\"\
  ).disabled = true;\n    document.getElementById(\"prevButton\").disabled = true;\n\
  \  }\n  loadChapter(document.getElementById('book').options[\n    document.getElementById('book').selectedIndex].value,\n\
  \      curchapIndex);\n}\n```\n\n该函数的大部分代码用于根据当前章节是否为第一章来智能地启用或禁用导航按钮。一旦完成导航按钮逻辑，就会调用\
  \ `loadChapter()` 函数并使用当前章节索引来指定要加载的章节。\n\n`nextChapter()` 函数与 `prevChapter()` 非常相似，角色反转，侧重于最后一章而不是第一章。换句话说，如果当前章节是最后一章，那么\
  \ `nextChapter()` 函数禁用“下一页”按钮就非常重要。以下代码了如何使用 `totalChapters` 变量作为判断当前章节是否为最后一章的依据：\n\
  \n```\nfunction nextChapter() {\n  if (curchapIndex  < (totalChapters - 1)) {\n\
  \    curchapIndex++;\n    document.getElementById(\"homeButton\").disabled = false;\n\
  \    document.getElementById(\"prevButton\").disabled = false;\n  }\n  if (curchapIndex\
  \ == (totalChapters - 1)) {\n    document.getElementById(\"nextButton\").disabled\
  \ = true;\n    document.getElementById(\"endButton\").disabled = true;\n  }\n  loadChapter(document.getElementById('book').options[\n\
  \    document.getElementById('book').selectedIndex].value,\n      curchapIndex);\n\
  }\n```\n\n这标志着新改版 Booker 应用程序客户端部分的结束。剩下的就是快速看一眼服务器脚本，与客户端相比，这部分简直轻而易举。\n\n### Booker\
  \ 服务器脚本\n\nBooker 应用程序服务器端的 PHP 脚本负责读取整个电子书 XML 文件，然后动态生成一个仅包含 Web 页面所需章节信息的 XML\
  \ 文档。这些章节信息通过 Ajax 响应传回客户端。以下是服务器端 PHP 脚本 `booker.php` 的代码：\n\n```php\n<?php\nheader('Content-Type:\
  \ text/xml');\n\n// 将电子书 XML 数据解析为数据结构\n$rawBook = file_get_contents(\"book_\" .\
  \ $_REQUEST['title'] .\n  \".xml\");\n$xml = new SimpleXmlElement($rawBook);\n\n\
  $chap = $xml->chapters->chapter[intval($_REQUEST['chapIndex'])];\n$xmlChapter =\
  \ '<?xml version=\"1.0\" encoding=\"utf-8\"?>';\n$xmlChapter .= '<bookData>';\n\
  $xmlChapter .= '<chapNum>' . $chap['num'] . '</chapNum>';\n$xmlChapter .= '<chapTitle>'\
  \ . $chap['title'] . '</chapTitle>';\n$xmlChapter .= '<chapText>' . $chap . '</chapText>';\n\
  $count = 0;\nforeach ($xml->chapters->chapter as $chapter) {\n  $count++;\n}\n$xmlChapter\
  \ .= '<totalChapters>' . $count . '</totalChapters>';\n$xmlChapter .= '</bookData>';\n\
  \n// 生成书籍信息 XML 文档\necho $xmlChapter;\n?>\n```\n\n诚然，如果你对 PHP 一无所知，那么这些代码看起来可能非常陌生。我并不尝试教你一门新语言（这显然超出了本书的范围和领域），我将充当翻译的角色。代码的开头确定了返回的数据格式为\
  \ XML 数据；这至关重要，以便服务器在 Ajax 响应将数据传回客户端时能够正确封装代码。\n\n脚本中的第一个大块代码负责从 XML 文件读取整个电子书到一个可以进一步处理的数据结构中。`$_REQUEST['title']`\
  \ 这部分代码是 PHP 脚本获取随 Ajax 请求 URL 发送的 `title` 参数的地方。记住这段代码：\n\n```\nbooker.php?title=warofworlds&chapIndex=0\n\
  ```\n\n代码 `$_REQUEST['title']` 获取了该 URL 中发送的 `title` 值。同样，要获取 `chapIndex` 参数的值，你使用这段代码：\n\
  \n```\n$_REQUEST['chapIndex']\n```\n\n现在回到脚本中解析 XML 电子书的部分，代码构建了一个文件名（例如 `book_warofworlds.xml`），并将其读取到\
  \ XML 数据结构中。从那里开始，主大块代码开始运行，深入 XML 代码中查找指定的章节，正如脚本的 `chapIndex` 参数所示。这段代码实际上是在同时对\
  \ XML 进行读取和写入——它正费力整个电子书寻找特定的章节信息，然后写入一个包含该信息的新 XML 文档。最终结果是你在上一节中看到的带有 `<bookData>`\
  \ 标签的简洁 XML 响应数据。\n\n为了真正理解服务器脚本是如何工作的，最好的方法是用文本编辑器打开一个电子书 XML 文件，并在逐行阅读脚本中最后一段大块代码的同时，研究这些标签。你会开始看到一种模式：每个标签和属性都被有条理地钻取，其相关数据被提取并封装到一个新的\
  \ XML 标签中。\n\n\n\n\n\n![新的 Booker 应用启动时加载所选书籍的第一章。](img/03ack06.jpg)\n\n图 3.6。新的\
  \ Booker 应用启动时加载所选书籍的第一章。\n\n### 注意事项\n\n![注意](img/note.jpg)\n\n在某个时刻，你可能想要考虑通过探索服务器日志，来确切了解\
  \ Ajax 请求到底发生了什么。你需要检查你所使用的特定 Web 服务器的文档，但所有的 Web 服务器都包含日志，以便你发现了哪些请求以及是否发生了错误。你还可以使用诸如\
  \ `Firebug` 等 JavaScript 调试器，直接在 Web 浏览器中查看与 Ajax 请求相关的类似信息。\n\n注意图中，章节编号和标题出现在选择列表正下方，这有助于页面具有更像真实书籍的感觉。下方是\
  \ `Home`（首页）和 `Previous`（上页）导航按钮，它们在最初是禁用的，因为无法从书籍的第一章向后移动。\n\n如果你向下滚动到章节末尾，你将看到另一对导航按钮，如图\
  \ 3.7 所示，它们允许你移动到下一章或直接跳转到书籍的最后一章。\n\n![下一个和结束导航按钮出现在章节底部，允许你在电子书中向前导航。](img/03ack07.jpg)\n\
  \n图 3.7。下一个和结束导航按钮出现在章节底部，允许你在电子书中向前导航。\n\n点击 `Next`（下一页）按钮将带你进入下一章，如图 3.8 所示。\n\
  \n![移动到新章节会导致章节标题更新，章节文本也会更新。](img/03ack08.jpg)\n\n图 3.8。移动到新章节会导致章节标题更新，章节文本也会更新。\n\
  \n此图显示 `Home` 和 `Previous` 按钮已启用，因为你不再处于第一章。\n\n与应用程序的早期版本一样，你可以从选择列表中选择其他书籍，它们将通过\
  \ Ajax 加载。现在的区别是，每本电子书都是按章节处理的，这在可读性和性能方面都是重大的改进。\n\n## 为 Booker 进行一次极端的 Ajax 改造\n\
  \n很容易看出新的 Booker 电子书阅读器如何成为一个在线提供电子书的方便工具。但假设你并不是经营虚拟 Web 图书馆的业务，该应用程序还可以被修改来实现什么。请记住，该应用程序擅长处理任何受益于拆分为离散部分的文本文档。对于电子书来说，这些部分是章节，但它们实际上可以是任何内容。\n\
  \nBooker 的一种可能变形是数据驱动的博客工具。例如，你可以修改现有的应用程序，使每个“书”对应一个博客主题，如商业、体育或政治。然后，每个主题内部的章节”就变成了单独的博客文章。这种对\
  \ Booker 的重用酷之处在于，你完全不需要更改 JavaScript 或 `PHP` 代码即可实现。你只需要对选择列表进行一些细小的 HTML 更改，使其显示博客主题而不是书籍，除此之外，所有的更改都可以在\
  \ XML 文件中完成，这是一件好事。\n\n记住，每本电子书的 XML 文件都包含给定章节的三个主要信息：编号、标题和文本。唯一不真正符合博客想法的信息是章节编号，它可以很容易地被重用为博客日期/时间。因此，编写一个与电子书完全相同的博客文档是可能的，只需将博客日期和时间指定为章节编号，博客标题为章节标题，博客文本为章节文本。以下是此类文档的示例：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<ebook>\n  <title>Michael's\
  \ Sports Blog</title>\n  <author>Michael Morrison</author>\n  <chapters>\n    <chapter\
  \ num=\"01/16/2007 8:00pm\"\n    title=\"Predators Have Most Wins\">\n    在昨晚击败赛对手卡尔加里后，\n\
  \    纳什维尔掠食者队现在是本赛季 NHL 首支获得 32 胜的球队，\n    在整个联盟中仅后纳海姆一分。Go Preds！\n    </chapter>\n\
  \    <chapter num=\"12/31/2006 11:30pm\"\n    title=\"Titans Eliminate Themselves\"\
  >\n    在一次将困扰该球队直到下赛季的失败中，\n    田纳西泰坦队奇迹般的赛季反转戛然而止，\n    他们在第 17 周输给了新英格兰开拓者队，并把自己淘汰出了季后赛。\n\
  \    </chapter>\n  </chapters>\n</ebook>\n```\n\n诚然，你可以认为应该修改 XML 词表以便使用 `<ebook>`\
  \ 和 `<chapter>`，但这并不是关键。如果你觉得有足够的信心折腾 XML，请尽管这样做。但在此之外，你只需更改 XML 的内容就能完成很多工作。\n\n\
  ## 总结\n\n你只学了三章，现在就有了一个能够动态加载章节的 Ajax 驱动电子书阅读器。听起来很复杂，但希望你意识到并没有涉及大量的代码。我不是说这些代码第一次读很容易理解，但它们确实非常简洁。更重要的是，你了解到代码具有很好的扩展性，允许你通过极少的更改将应用程序转换为其他形式。\n\
  \n# 第 4 章。使用 Ajax 动态填充列表：股票选择器\n\n### 秘密 Ajax\n\n![秘密 Ajax](img/note.jpg)\n\n谁能想到\
  \ Ajax 与中东冲突有联系？1953 年，英国和美国合作进行了一项推翻伊朗首相穆萨迪格的秘密行动。Ajax 行动取得了短期成功，但对稳定伊朗与西方的关系的作用有限，1979\
  \ 年伊斯兰革命及后的事件证明了这一点。\n\nWeb 页面中常见的用户界面设计是使用多个选择列表让用户选择分级数据。一个很好的例子是城市/州/国家选择，其中一个列表中决定了另一个列表中可以选择哪些州，进而决定了第三个列表中可以选择哪些城市。这种思想是根据一个列表的选择来限制另一个列表的可能选择。虽然此功能完全可以使用客户端\
  \ JavaScript 代码来实现，但为了从服务器获取数据动态构建选择列表，Ajax 是必要的。\n\n本章将详细探讨这个问题，并向你展示如何使用 Ajax\
  \ 从服务器数据动态构建选择列表。这是一个实用的 Ajax 设计模式，你可能想在自己的应用程序中重复使用。此外，在开发另一个实用示例应用程序的过程中，你为你快速扩展的技能库又增加了一些\
  \ Ajax 技巧。\n\n本章 Picker 程序使用了以下文件，它们位于带书籍的现场 Linux 光盘的 `chap04` 示例代码文件夹中：\n\n* \
  \  `picker.html`—主 Web 页面\n\n*   `quoter.php`—加载股票报价的服务器脚本\n\n*   `ajaxkit.js`—Ajax\
  \ Toolkit 的核心 Ajax 函数\n\n\n\n\n\n* `domkit.js`—Ajax Toolkit 的 DOM 相关函数\n* `stocks.xml`—股票选股的\
  \ XML 列表\n\n## 挑战：显示所选股票信息\n\n这个挑战非常简单：使用 Ajax 根据另一个选择列表中的选择，动态填充一个选择列表。为什么要费此精力呢？因为在许多场景下，这种双重选择方法非常有意义。事实上，在人类最受欢迎的网站之一，这种四重选择方法每天被使用数千次。我说的就是\
  \ eBay——具体来说是在发布拍卖物品时的类别选择部分。图 4.1 展示了 eBay 如何使用多四个选择列表，允许用户在列出物品时深入到子类别。\n\n![eBay\
  \ 是使用多个选择列表允许用户在相互依赖的数据之间进行选择的完美范例](img/04ack01.jpg)\n\n**图 4.1. eBay 是使用多个选择列表允许用户在相互依赖的数据之间进行选择的完美范例。**\n\
  \n这种选择列表的安排为用户在处理具有某种层次结构的数据时提供了一种直观的选择方式。如果你可以将一组数据看作一系列决策，或者能以某种方式将其组织成发散的树状结构（想象成族谱），那么你可能就有机会使用两个或多个动态填充的选择列表。\n\
  \n值得澄清的是，你并不需要 Ajax 就能创建允许用户导航层级数据的选择列表。你会发现，国家/州/城市的例子随处可见，完全不需要任何 Ajax 帮助。直接将此类数据硬编码在\
  \ Web 页面的 JavaScript 代码中是完全可能的。问题在于，你每当想更新选择选项时都必须编辑网页，而在某些情况下，这根本是不可能的。Ajax 应用背后的一个核心概念是让用户界面数据驱动，在一种情况下，这意味着根据从服务器获取的数据动态构建选择列表。\n\
  \n### 注意事项\n\n![注意事项](img/note.jpg)\n\n如果你阅读过其他 Ajax 教程，最终会遇到一个使用熟悉的国家/州/城市数据的 Ajax\
  \ 选择列表示例。虽然数据本身非常适合层级选择用户界面，但从 Ajax 的角度来看，它并不一定理想，因为国家、州和城市很少改变。阿拉巴马州并不是每隔几年就会洗牌到另一个国家。由于这个原因，我不认为在静态数据上使用数据驱动编程有什么意义，除非目标仅仅是为了让应用程序更具维护性，这是一个值得赞赏的目标。我努力让本书中的示例具有价值，本章中的选择列表示例也不例外。\n\
  \n如果你思考多重选择列表技术的数据驱动本质，你会发现许多地方可以使用它。一个可以根据部门或安全分类进行导航的公司目录就是一种可能。另一个是按部门组织的的产品目录，例如服装、五金硬件等。一个引起我注意的应用程序是一个投资服务，它以“热门、冷门和安全”股票列表的形式提供建议。并不是说我一定很急于使用这样的服务，但它提供了一个在两个方面使用\
  \ Ajax 的机会：\n\n* 动态填充选择列表\n* 获取实时股票报价\n\n第一个任务是本章的重点，而第二个任务是创建一个可以通过 Ajax 满足的实际需求的应用程序的附带收益。\n\
  \n你在本章中开发的应用程序被称为 `Picker`（即股票选股器），它展示了两个选择列表——一个是股票类型，另一个是实际股票。股票类型包括热门、冷门和平。股票列表根据股票类型列表中的选择动态填充。此类网站的编辑可以对服务器上的股票选股进行后端更改，结果会自动同步到数据驱动的页面上。当股票列表中选择了某只股票时，股票报价就进入了视野。包括当前股价在内的详细信息显示在两个选择列表下方。\n\
  \n你在这个应用程序中真正拥有的是两个“链式” Ajax 请求：\n\n* 第一个 Ajax 请求根据所选的股票类型（热门、冷门或安全）从服务器获取股票列表。\n\
  * 第二个 Ajax 请求根据股票列表中的特定股票获取有关该股票的最新信息。\n\n如果这听起来像是一项大胆的挑战，不要太担心，因为 Ajax 提供了一条清晰的路径来完成这些任务，而不会太麻烦。秘诀在于设计出一个简单的设计，以便代码不会失控。\n\
  \n## 设计：设计一个股票选股器\n\n任何 Ajax 应用的设计在很大程度上归于对客户端和服务器之间传输的数据进行仔细分析。在 `Picker` 应用程序中，有两个不同的\
  \ Ajax 请求相继发生，因此你的设计工作量增加了一倍。幸运的是，这两个请求都不特别复杂，因此设计仍然保持简单。\n\n第一个请求是响应用户从第一个选择列表中选择股票类型。当选择此类型时，会发送一个请求到服务器，获取与特定类型匹配的股票列表。此时，你所做的只是根据所选类型获取股票列表。这个股票列表用于填充第二个选择列表，而该列表恰好是第二个\
  \ Ajax 请求的基础。\n\n第二个请求在用户从第二个选择列表（即股票列表）中选择某只股票时启动。此请求从提供金融数据的 Web 服务查询最新的股票信息。除非你自己运行一个金融报价服务器，否则这就是向第三方服务发起的请求，而不是像第一个请求那样提供自己的数据。服务器返回的最新股票信息随后显示在\
  \ Web 页面上。图 4.2 展示了应用程序用户界面转换为 Ajax 请求的粗略表示。\n\n![应用程序的用户界面由两个选择列表和一个包含所选股票信息的文本区域组成。]()\n\
  \n**应用程序的用户界面由两个选择列表和一个包含所选股票信息的文本区域组成。**\n\n现在你已经了解了 Picker 应用程序的大致设计，让我们仔细查看一下特定的\
  \ Ajax 请求和响应，以及其中流传输的数据类型。\n\n### 客户端请求\n\n在 `Picker` 应用程序中从客户端发送到服务器的数据极少。事实上，对于初始的股票列表请求，不需要发送任何内容，因为股票列表的\
  \ XML 数据足够小，直接在客户端 JavaScript 代码中检索整个文档并解析所需内容并没有问题。因此，你不需要担心在第一个请求中携带任何内容。\n\n\n\
  \n\n第二个请求显然必须至少发送股票的名称，因为它正在金融服务器上执行股票查询。仅仅通过股票的代码（ticker symbol）就能获取如此多的信息，这令人相当惊讶。由于这个原因，你在第二个请求中需要发送的就是股票代码，它通常是一个三个或四个字母的单词，例如\
  \ `SBUX`（星巴克）、`FDX`（联邦快递）、`AMZN`（亚马逊）等。\n\n到此，从客户端发送到服务器的简单数据传输就结束了。现在让我们来处理服务器返回的内容。\n\
  \n### 服务器响应\n\n向服务器发出的第一个 Ajax 请求是为了获取整个股票列表，无论选择了哪种股票类型。你可能会认为此请求应该包含股票类型，从而在响应中只返回单一类型的股票，但如果只是直接获取整个股票列表，服务器的角色就会被简化。事实上，你根本不需要服务器脚本来请求整个\
  \ XML 文档。\n\n服务器在股票列表响应中返回的 XML 文档是所有可能的股票类型的股票列表。那么，责任就到了 Web 页面，由它处理列表并提取出特定类型的股票，以填充第二个选择列表。你将在下一节中看到特定股票的具体\
  \ XML 数据示例。\n\n第二个 Ajax 请求促使服务器返回有关特定股票的信息，包括最新的股价。由于这些信息是从第三方服务（在本例中为 `webserviceX.net`）获取的，服务器返回的股票信息并不是你可以直接控制的。如此，尝试使用\
  \ Ajax 请求除你自己以外的服务器的数据存在一个固有的问题——这是不允许允许的！出于安全考虑，你不允许向请求源地其他域名的服务器执行 Ajax 请求。该怎么办？\n\
  \n尽管有其他方法可以绕过 Ajax 安全限制，但我们将使用 PHP 脚本作为代理来从第三方服务器抓取数据。它的工作原理是：你的 Ajax 客户端向你服务器上的\
  \ PHP 脚本发送请求，该脚本转而从第三方服务器获取数据。这是被允许的，因为服务器到服务器的通信不像客户端到服务器通信那样受到限制。正如你在本章稍后部分学到的，实现这一点的所需的\
  \ PHP 脚本实际上只需要几行代码。\n\n回到 Picker 应用程序的整体服务器响应图景：整个股票列表在第一个 Ajax 响应中返回，该响应在用户从第一个选择列表中选择股票类型时触发。第二个请求由从第二个选择列表中选择股票触发，结果是返回一个包含详细股票信息（包括当前价格）的响应。第二个响应间接接收来自第三方\
  \ Web 服务 `webserviceX.net`，该服务提供了多种 XML 格式的便捷数据馈送。\n\n### 理解客户端到服务器的对话\n\n你现在已经有了足够的数据通信方程，可以将\
  \ Picker 应用程序的所有内容整合成一个连贯的设计，并考虑了两个 Ajax 请求中每个发送和接收的内容。图 4.3 显示了针对这些请求的客户端到服务器的对话。\n\
  \n![Picker 应用程序涉及数据在两个不同的 Ajax 请求中的往返。](img/04fig03.gif)\n\n**图 4.3. Picker 应用程序涉及数据在两个不同的\
  \ Ajax 请求中的往返。**\n\n该图揭示了两个 Ajax 请求如何生成响应，分别将股票列表和股票信息回传给浏览器（客户端）。第一个请求没有向服务器发送任何额外数据，而第二个请求只发送相关股票的代码。该符号被作为一个单个参数封装在\
  \ URL 中。以下是一个用于将股票代码传递给 Picker 应用程序 PHP 脚本的 URL 示例：\n\n```\nquoter.php?symbol=EBAY\n\
  ```\n\n这段代码表明负责处理第二个 Ajax 请求的 PHP 脚本位于名为 `quoter.php` 的文件中。你将在本章稍后学习此脚本如何工作。现在，回到第一个\
  \ Ajax 请求以及它期望从服务器返回的数据类型。\n\n第一个 Ajax 请求期望服务器返回一个 XML 文档，其中包含应用程序使用的整个股票列表，包括所有股票类型。以下是该\
  \ XML 代码的示例：\n\n```\n<stocks>\n  <hot>\n    <stock>AAPL</stock>\n    <stock>LUV</stock>\n\
  \    ...\n  </hot>\n  <cold>\n    <stock>HSY</stock>\n    <stock>WIN</stock>\n \
  \   ...\n  </cold>\n  <safe>\n    <stock>KO</stock>\n    <stock>CAT</stock>\n  \
  \  ...\n  </safe>\n</stocks>\n```\n\n如你所示，股票被组织成由 `<hot>``<cold>` 和 `<safe>` 等标签定义的组。在每种股票类型的这些标签组中，你可以找到单独的股票，它们使用`<stock>`\
  \ 标签进行编码。需要注意的是，使用股票代码来识别股票，而不是实际的公司名称。这是一个关键的设计决策，因为股票代码是用于查找任何给定股票的，可以被视为该股票的唯一标识符。\n\
  \n在股票的实际数据文件中，股票信息可能比你预期的要详细一点，并且包含的信息比 Picker 应用程序需要的更多。然而，既然数据在那里，你不妨尽可能利用它们。具体来说，Picker\
  \ 应用程序最终使用了 Ajax 响应返回的股票信息中的以下数据：\n\n*   股票名称 (`<Name>`)\n*   最新报价 (`<Last>`)\n\
  *   市值 (`<MktCap>`)\n*   成交量 (`<Volume>`)\n*   价格百分比变化 (`<PercentageChange>`)\n\
  *   市盈率 (`<P-E>`)\n*   报价日期 (`<Date>` 和 `<Time>`)\n\n这就是潜在投资者可能想知道的关于推荐股票的全部信息。现在你只需要思考如何将所有数据整合到应用程序中。\n\
  \n## 组装股票选择器\n\n与书中许多示例 Ajax 应用程序一样，Picker 应用程序涉及三个主要组件：\n\n*   XML 文件 (`stocks.xml`)\n\
  *   HTML Web 页面 (`picker.html`)\n\n\n\n\n- PHP 服务器脚本 (`quoter.php`)\n\n除了应用程序的这三个部分外，第三方财务\
  \ Web 服务负责提供实时股票数据。虽然该服务是应用程序的重要部分，但它不需要单独的组件，只需要在 HTML Web 页面编写启动 Ajax 请求的代码，并在\
  \ PHP 服务器脚本编写处理将响应传回页面的代码即可。这种安排是必要的，因为 Ajax 请求不允许直接访问位于其他域的资源。\n\n让我们更详细地分解 Picker\
  \ 应用程序的每个部分，让你完全理解该应用程序是如何运作的。\n\n### Stocks XML 文件\n\nstocks XML 文件完全由你生成，负责根据选定的股票类型控制应用程序中显示的股票。以下是示例\
  \ `stocks.xml` 文件的完整代码，它包含了一份大致随机的股票列表：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<stocks>\n  <hot>\n    <stock>AAPL</stock>\n    <stock>LUV</stock>\n\
  \    <stock>GOOG</stock>\n    <stock>FDX</stock>\n    <stock>TM</stock>\n  </hot>\n\
  \  <cold>\n    <stock>HSY</stock>\n    <stock>WIN</stock>\n    <stock>MRK</stock>\n\
  \    <stock>AMGN</stock>\n    <stock>BBY</stock>\n  </cold>\n  <safe>\n    <stock>KO</stock>\n\
  \    <stock>CAT</stock>\n    <stock>DIS</stock>\n    <stock>GE</stock>\n    <stock>MSFT</stock>\n\
  \  </safe>\n</stocks>\n```\n\n### 注意\n\n![Note](img/note.jpg)\n\n我强烈建议你不要在这些股票选择上孤注掷！股票被标记为热门、冷门或安全在大多数情况下是随机的，所以如果你把养老钱都投入了苹果（`AAPL`）股票，而\
  \ iPhone 最终大失利了，请不要怪我。\n\n你在本章的早些部分已经见过这段代码的片段，所以到目前对你来说应该并不完全陌生。请记住，整个 XML 文件将作为对第一个\
  \ Ajax 请求的响应发送回客户端，该请求是由第一个选择列表中的股票类型选择所触发的。\n\n### 提示\n\n![Tip](img/tip.jpg)\n\n\
  `stocks.xml` 文件使用股票代码而不是公司名称来指定股票。在构建你自己的股票列表时，你可能需要找到它们的股票代码。你可以使用在线工具，例如雅虎的符号查找（[`http://finance.yahoo.com/lookup`](http://finance.yahoo.com/lookup)）来确定此类股票代码。还要记住，Picker\
  \ 应用程序对于共同基金、交易所交易基金（ETFs）以及几乎任何与主要金融交易所有关代码的代码都能正常工作；你不局限于股票。\n\n每只股票都使用 `<stock>`\
  \ 标签编码，且没有属性，`<stock>` 标签被仔细排列在指示其类型的标签内。例如，要将某只股票指定为“热门”，你只需将其 `<stock>` 标签放在 `<hot>`\
  \ 和 `</hot>` 标签之间。你可以在每个股票类型中包含任意数量的股票——客户端 JavaScript 代码会自动根据给定类型列出的每个股票填充股票选择列表。\n\
  \n### Picker 页面\n\nPicker 应用程序的 HTML Web 页面 (`picker.html`) 在用户界面方面相对简单，主要由两个选择列表以及几个用于持有详细股票信息的\
  \ `div` 和 `span` 元素组成。图 4.4 显示了在 Web 浏览器中打开的 Picker 应用程序，两个选择列表和股票信息均可见。\n\n![The\
  \ Picker Web page consists of two selection lists and an area for displaying the\
  \ stock information.](img/04ack04.jpg)\n\n**图 4.4. Picker 页面包含两个选择列表和一个显示股票信息的区域。**\n\
  \n以此图，查看页面主体 HTML 代码：\n\n```html\n<body onload=\"document.getElementById(\n  'stocktype').selectedIndex\
  \ = 0; loadStockList()\">\n  <div id=\"ajaxState\" style=\"display:none\"></div>\n\
  \  <br />\n  <div>选择类型:\n    <select id=\"stocktype\" onchange=\"loadStockList()\"\
  >\n      <option value=\"hot\">热门股票</option>\n      <option value=\"cold\">冷门股票</option>\n\
  \      <option value=\"safe\">安全股票</option>\n    </select>\n  </div>\n  <br />\n\
  \  <div>选择股票:\n    <select id=\"stock\"\nonchange=\"loadStockInfo(this[this.selectedIndex].value);\"\
  >\n    </select>\n  </div>\n  <br />\n  <div id=\"stockname\" style=\"font-size:large;\
  \ font-weight:bold\">\n  </div>\n  股票价格：  <span id=\"stockprice\" style=\"font-weight:bold\"\
  >\n  </span><br />\n  市值：  <span id=\"stockcap\" style=\"font-weight:bold\">\n \
  \ </span><br />\n  成交量：  <span id=\"stockvolume\" style=\"font-weight:bold\">\n\
  \  </span><br />\n  涨跌幅：  <span id=\"stockchange\" style=\"font-weight:bold\">\n\
  \  </span><br />\n  市盈率：  <span id=\"stockpe\" style=\"font-weight:bold\">\n  </span><br\
  \ />\n  日期时间：  <span id=\"stockdatetime\" style=\"font-weight:bold\">\n  </span></div>\n\
  </body>\n```\n\n第一个选择列表 (`stocktype`) 使用固定选项进行编码。这些股票类型被用于动态填充第二个列表 (`stock`)，后者初始为空。\n\
  \n页面的最后一部分包含几个 `div` 元素和几个 `span` 元素，用于格式化股票信息。仔细检查代码可以发现每项信息前面都有标签，在某些情况下还带有美元符号（`$`）。股票名称和日期时间是唯一没有标签的元素，因为股票名称元素兼当了\
  \ Ajax 请求的通知。具体地说，当股票正在加载时，股票名称元素显示文本 \"Loading...\"。这让用户知道发起了请求。页面上的日期时间元素的含义对用户来说应该是显而易见的，因此那里没有使用标签。\n\
  \n\n\n\n\n```javascript\nfunction handleStockListRequest() {\n  if (request.readyState\
  \ == 4 && request.status == 200) {\n    // Store the XML response data\n    var\
  \ xmlData = request.responseXML.getElementsByTagName(\n      \"stocks\")[0];\n\n\
  \    // Isolate the data for the current stock type\n    var listData = xmlData.getElementsByTagName(\n\
  \      document.getElementById('stocktype').options[\n      document.getElementById('stocktype').selectedIndex].\n\
  \      value);\n\n    // Clear the stock list\n    var stockSel = document.getElementById('stock');\n\
  \    while (stockSel.length > 0)\n      stockSel.remove(0);\n\n    // Fill the stock\
  \ list with stock symbols\n    for (var i = 0; i  < listData[0].childNodes.length;\
  \ i++) {\n      if (listData[0].childNodes[i].nodeType == 1) {\n        var symbol\
  \ = getText(listData[0].childNodes[i]);\n        stockSel.add(new Option(symbol,\
  \ symbol, false, false),\n          null);\n      }\n    }\n\n    // Select the\
  \ first stock in the list\n    stockSel.selectedIndex = 0;\n\n    // Load the info\
  \ for the first stock in the list\n    loadStockInfo(stockSel[0].value);\n  }\n\
  \  ajaxUpdateState();\n}\n```\n\n### handleStockListRequest\n\n我意识到这是一个相当复杂的函数，但从其实际执行的操作来看，它并不非常复杂。请参考\
  \ `stocks.xml` 文件以了解该函数正在处理什么的数据。该函数的目标是深入解析 `stocks.xml` 数据，并提取与给定股票类型（热门、冷门或安全）相关的股票列表。更具体地说，这个股票列表存在于给定的股票类型标签（`<hot>`、`<cold>`\
  \ 或 `<safe>`）之中。\n\n在最初从服务器获取获取 XML 数据后，`handleStockListRequest()` 函数会将 XML 数据缩小到某个特定的股票类型。例如，热门股票的\
  \ XML 数据子集如下：\n\n```xml\n<hot>\n  <stock>AAPL</stock>\n  <stock>LUV</stock>\n  <stock>GOOG</stock>\n\
  \  <stock>FDX</stock>\n  <stock>TM</stock>\n</hot>\n```\n\n现在代码正准备好循环遍历 `<hot>`\
  \ 标签内的股票列表，用热门股票填充选择列表。但在在此之前，必须清除列表以确保之前显示的股票已经消失。在清除股票列表后，它将使用剩余 XML 数据中的股票进行填充。对于这个例例来说，这意味着有五只股票被添加到股票选择列表中。股票列表填充完成后，将选择项设置为新列表中的第一只股票。\n\
  \n这里变得有点有趣了，因为你动态地填充了股票列表，但你还没有任何任何可以展示的股票信息。你需要显示新列表中第一只股票的信息。这是通过调用 `loadStockInfo()`\
  \ 函数实现的，该函数接受第一只股票的值作为其唯一参数。此函数调用会导致第二个 Ajax 请求的启动，该请求的任务是获取指定股票的信息。\n\n### loadStockInfo\n\
  \n以下是 `loadStockInfo()` 函数的代码：\n\n```javascript\nfunction loadStockInfo(stock) {\n\
  \  // Clear the previous stock info text\n  replaceText(document.getElementById(\"\
  stockname\"),\n    \"Loading...\");\n  replaceText(document.getElementById(\"stockprice\"\
  ), \"\");\n  replaceText(document.getElementById(\"stockcap\"), \"\");\n  replaceText(document.getElementById(\"\
  stockvolume\"), \"\");\n  replaceText(document.getElementById(\"stockchange\"),\
  \ \"\");\n  document.getElementById(\"stockchange\").style.color = \"#000000\";\n\
  \  replaceText(document.getElementById(\"stockpe\"), \"\");\n  replaceText(document.getElementById(\"\
  stockdatetime\"), \"\");\n\n  // Send the Ajax request to load the new stock info\n\
  \  ajaxSendRequest(\"GET\", \"quoter.php?symbol=\" +\n    encodeURIComponent(stock),\
  \ handleStockInfoRequest);\n}\n```\n\n除了清除页面上的股票显示元素为新的股票信息做准备外，该函数的简单程度与 `loadStockList()`\
  \ 相当。注意，股票名称 `div` 元素被设置为 `\"Loading...\"`，以便用户知道数据正在传输。在请求完成之前，所有其他元素都为空的。完成后，股票信息\
  \ Ajax 请求将由 `handleStockInfoRequest()` 函数处理，其结构如下：\n\n### handleStockInfoRequest\n\
  \n```javascript\nfunction handleStockInfoRequest() {\n  if (request.readyState ==\
  \ 4 && request.status == 200) {\n    // Store the XML response data\n    var xmlData\
  \ = request.responseXML.getElementsByTagName(\n      \"Stock\")[0];\n\n    // Display\
  \ the detailed stock info\n    replaceText(document.getElementById(\"stockname\"\
  ),\n      getText(xmlData.getElementsByTagName(\"Name\")[0]) +\n      \" (\" +\n\
  \      getText(xmlData.getElementsByTagName(\"Symbol\")[0]) +\n      \")\");\n \
  \   replaceText(document.getElementById(\"stockprice\"),\n      \"$\" + getText(xmlData.getElementsByTagName(\"\
  Last\")[0]));\n    replaceText(document.getElementById(\"stockcap\"),\n      \"\
  $\" + getText(xmlData.getElementsByTagName(\"MktCap\")[0]));\n    replaceText(document.getElementById(\"\
  stockvolume\"),\n      getText(xmlData.getElementsByTagName(\"Volume\")[0]) +\n\
  \      \" shares\");\n    replaceText(document.getElementById(\"stockchange\"),\n\
  \      getText(xmlData.getElementsByTagName(\"PercentageChange\")[0]));\n    if\
  \ (getText(xmlData.getElementsByTagName(\"PercentageChange\")[0]).charAt(0) == '+')\n\
  \      document.getElementById(\"stockchange\").style.color = \"#009900\";\n   \
  \ else if (getText(xmlData.getElementsByTagName(\"PercentageChange\")[0]).charAt(0)\
  \ == '-')\n      document.getElementById(\"stockchange\").style.color = \"#990000\"\
  ;\n    replaceText(document.getElementById(\"stockpe\"),\n      getText(xmlData.getElementsByTagName(\"\
  P-E\")[0]));\n    replaceText(document.getElementById(\"stockdatetime\"),\n    \
  \  getText(xmlData.getElementsByTagName(\"Time\")[0]) + \" - +\n      getText(xmlData.getElementsByTagName(\"\
  Date\")[0]));\n  }\n  ajaxUpdateState();\n}\n```\n\n记住此函数正在处理以下 XML：\n\n```xml\n\
  <string>\n  <StockQuotes>\n    <Stock>\n      <Symbol>SBU</Symbol>\n      <Last>36.29</Last>\n\
  \      <Date>1/17/2007</Date>\n      <Time>2:41pm</Time>\n      <Change>+0.07</Change>\n\
  \      <Open>36.26</Open>\n      <High>36.52</High>\n      <Low>36.20</Low>\n  \
  \    <Volume>432780</Volume>\n      <MktCap>N/A</MktCap>\n      <PreviousClose>36.22</PreviousClose>\n\
  \      <PercentageChange>+0.19%</PercentageChange>\n      <AnnRange>28.72 - 40.01</AnnRange>\n\
  \      <Earns>0.00</Earns>\n      <P-E>N/A</P-E>\n      <Name>STARBUKS CP</Name>\n\
  \    </Stock>\n  </StockQuotes>\n</string>\n```\n\n\n\n\nPicker 网页的代码就到此了，诚承认它比之前的示例要沉重一些。不过，请记住，大多数\
  \ JavaScript 代码都与设置各种股票信息元素有关。如果你想将应用程序简化为仅显示当前股票价格，那么 JavaScript 代码会减小很多。但那样还有什么趣呢？\n\
  \n### Quoter 服务器脚本 (Quoter Server Script)\n\n在本章稍早，我解释了 Picker 应用程序如何在服务器端需要脚本，以绕过无法在第三方域名上直接发起\
  \ Ajax 客户端请求的限制。该第三方域名之所以重要，是因为 Picker 应用程序依赖它来提供实时股票信息。可以使用 PHP 脚本作为某种安全代理：它通过代表客户端接受\
  \ Ajax 请求，从第三方服务器获取股票数据，然后将数据响应给客户端。通过这种方式，Ajax 请求本身完全是针对你自己的域发出的，因此处于 Ajax 的安全限制之内。\n\
  \n我所指的第三方 Web 服务是 `webserviceX.net`，它提供了多个基于 XML 的数据馈。其中一个数据馈就是股票报价馈，你可以在其中指定一个股票代码，服务器会返回一个包含该股票详细信息的\
  \ XML 文档。在本章中，你已经多次看到这个 XML 文档中的代码了，但你还没有见过让通过 Ajax 请求接收代码成为可能的 PHP 脚本。以下是 `quoter.php`\
  \ 服务器脚本的代码：\n\n```php\n<?php\nheader('Content-Type: text/xml');\n\n// 从服务器加载 XML\
  \ 股票报价数据\n$xml = html_entity_decode(file_get_contents(\n  \"http://www.webservicex.net/stockquote.asmx/GetQuote?symbol=\"\
  \n  . $_REQUEST['symbol']));\n\n//\n返回 XML 股票报价数据\necho $xml;\n?>\n```\n\n记住，此脚本的任务是从来自\
  \ `webserviceX.net` 的股票报价 Web 服务获取 XML 文档，然后在不进行任何修改的情况下直接将该数据传递给客户端。然后由客户端对 XML\
  \ 代码进行一些有用的操作，例如在页面上显示部分内容。\n\n服务器脚本首先确保响应被处理为 XML。脚本中的第二部分代码从股票报价 Web 服务加载 XML\
  \ 文档，并确保传递了 `symbol` 参数，以便 Web 服务知道要查询哪只股票。最后一段代码是脚本实际返回 XML 数据的地方，它作为对 Ajax 股票信息请求的响应。\n\
  \n在继续测试完成的应用程序之前，值得花一点时间单独测试一下 PHP 脚本。你在上一章的 Booker 应用程序中看到是如何操作的，但这里有一个测试 Quoter\
  \ 脚本的示例 URL：\n\n[`www.yourdomain.com/quoter.php?symbol=SBUX`](http://www.yourdomain.com/quoter.php?symbol=SBUX)\n\
  \n假设 `quoter.php` 文件存储在你的服务器上，请将此行代码中的域名更改为你的域名，然后将 URL 输入 Web 浏览器。你也可以直接在随书附带的实时\
  \ Linux CD 上尝试此技巧。无论如何，图 4.5 显示了 PHP 脚本生成的 XML 响应数据。\n\n![你可以通过直接在浏览器中打开脚本来查看 Quoter\
  \ PHP 脚本返回的 XML 股票信息。](img/04ack05.jpg)\n\n图 4.5。你可以通过直接在浏览器中打开脚本来查看 Quoter PHP\
  \ 脚本返回的 XML 股票信息。\n\n请随时在 Quoter 脚本的 URL 中尝试不同的股票代码。这是研究服务器脚本返回数据的极佳方法，可以确保它与你的预期一致——当你只看\
  \ Web 页面时，诊断服务器脚本问题要困难得多。\n\n## 测试 Picker\n\nPicker 应用程序现在已全部组装完毕并准备好进行测试。要在你自己的浏览器中尝试，请打开附带实时\
  \ Linux CD 上 `chap04` 文件夹中的 `picker.html` 页面。图 4.6 显示了应用程序正在运行，并从初始热门股票列表中选择了一只股票。\n\
  \n![Picker 应用程序最初选择第一种股票类型以及股票列表中的第一只股票。](img/04ack06.jpg)\n\n图 4.6。Picker 应用程序最初选择第一种股票类型以及股票列表中的第一只股票。\n\
  \n图中显示了 Google 如何最初被显示为第一个热门股票。要看到选择列表动态填充的动作，请从第一个列表中选择不同的股票类型。图 4.7 显示了应用程序从列表中选择了“冷门股票\
  \ (Cold Stocks)”。\n\n![选择不同的股票类型会导致股票列表动态重新加载并显示新的股票信息。](img/04ack07.jpg)\n\n图 4.7。选择不同的股票类型会导致股票列表动态重新加载并显示新的股票信息。\n\
  \n尽管我是一个巧克力爱好者，但我还是将好时公司（Hershey Company）放在了冷门列表中。由于这只股票是列表中的第一个，它的信息会自动加载并显示在下方。\n\
  \n应用程序的最后一个测试是尝试列表中的另一只股票。图 4.8 显示了应用程序在冷门列表中选择了另一只股票（安森制 Amgen）。\n\n![当你选择不同的股票时，股票列表不会重新加载，但会显示新的股票信息。](img/04ack08.jpg)\n\
  \n图 4.8。当你选择不同的股票时，股票列表不会重新加载，但会显示新的股票信息。\n\n## 为 Picker 进行极的 Ajax 改造\n\nPicker\
  \ 应用程序在提供用于选择股票推荐的动态用户界面，并为每个股票选择提供相应的硬数据方面表现良好。该应用程序的双层选择列表设计在投资之外也可以有许多益处。我喜欢的一个想法是使用此类应用程序来跟踪某种收藏，例如电影收藏。\n\
  \n\n\n\n当你从更抽象的角度思考 Picker（选择器）应用程序时，你就会开始感觉到它是如何应用到其他类型的数据上的。以电影收藏为例，可以将股票类型可以转换为电影类型，例如动作、恐怖、喜剧等。在每种电影类型中，你将使用类似的\
  \ XML 编码方法来列出你的个人电影。然而，在这种情况下，并没有像股票代码那样建立好的标准来用简写唯一地表示某部电影。相反，你可能只想直接列出整个电影名称，因为为每部电影想出一个“股票代码”可能会很困难。\n\
  \n基于 Picker 代码创建电影收藏应用程序的首要挑战在于找到一个能够提供电影信息的 Web 服务，就像 `webserviceX.net` 在 Picker\
  \ 中提供股票信息那样。事实证明，确实有一个 Web 服务可以让电影收藏应用在投入极少工作的情况下变成一个非常切实的目标。查看以下 URL 看看我在说什么：\n\
  \n`http://www.trynt.com/movie-imdb-api/v2/?t=Raising%20Arizona`\n\n这个 Web 服务被称为\
  \ TRYNT Movie IMDb Web 服务，它为你提供了对流行的互联网电影数据库（IMDb）的程序化访问。如果你从未探索过 IMDb，请在 `http://www.imdb.com/`\
  \ 尽情探索。该网站解决了许多电影参数问题！有关 TRYNT 的更多信息，请查看 `http://www.trynt.com/`。\n\n回到电影 Web 服务，以下是你刚刚看到的\
  \ `Raising Arizona` URL 返回的 XML 数据：\n\n```xml\n<trynt>\n  <movie-imdb>\n    <search>Raising\
  \ Arizona</search>\n    <matched-id>tt0093822</matched-id>\n    <matched-url>http://www.imdb.com/title/tt0093822/\n\
  \    </matched-url>\n    <matched-title>Raising Arizona (1987)</matched-title>\n\
  \    <data>\n       <movie-id>\n         <data>\n           <id>tt0093822</id>\n\
  \           <score>6</score>\n         </data>\n       </movie-id>\n       <movie-title>\n\
  \         <data>\n           <id>Raising Arizona (1987)</id>\n           <score>6</score>\n\
  \         </data>\n       </movie-title>\n    </data>\n  </movie-imdb>\n</trynt>\n\
  ```\n\n诚然，除了电影年份外，并没有太多有用信息，遗憾的是，年份与名称包含在同一个字段中，这使得提取变得稍微困难。然而，这段代码中极其有用用的是指向 IMDb\
  \ 中电影的链接。这意味着你可以动态地构建一个指向电影的链接，作为电影收藏页面上显示的电影信息的一部分。让你的应用程序只需点击即可获取人们可能想了解关于电影的任何信息，这是该应用程序中一个非常精妙的补充。\n\
  \n要将 Picker 应用程序转换为电影收藏应用程序，重新设计 `stocks.xml` 文件中的 XML 标签以使其符合 `movies.xml` 文件的逻辑绝对不是一个坏主意。只需记住，Web\
  \ 页面上的每个标签引用也需要修改。不过，在你开始拆解代码之前，尝试仅通过将电影数据插入现有框架来修改应用程序可能是值得的。不要忘记更改应用程序 Web 页面上的第一个选择列表，使其列出的是电影类型而不是股票类型。\n\
  \n## 总结\n\n本章向你展示了第一个向不同 URL 发送多次 Ajax 请求的示例应用程序。幸运的是，这些请求是连续发生的，而不是同时发生的；否则，Ajax\
  \ Toolkit 将需要修改以允许多个请求同时发生。Picker 应用程序也是你如何绕过在请求源域名之外发送 Ajax 请求的限制的良好示例。通过将此责任交给服务器脚本，你允许客户端\
  \ Web 页面请求服务器脚本执行与第三方服务器通信。通过使用第三方 Web 服务，Picker 应用程序是一个很好的例子，展示了你如何将你自己的 XML 数据（股票列表）与来自其他地方的数据（实时股票报价）结合，而如果没有它，这些数据很难甚至无法获得。\n\
  \n## 第 5 章 接入 RSS 新闻订阅\n\n### 古希腊的 Ajax\n\n![古希腊的 Ajax](img/note.jpg)\n\n并不是要削弱异步\
  \ Web 应用的重要性，但 Ajax 在过去的某个时期具有重要得多的意义。我指的是古希腊，那里一位名叫阿贾斯（Ajax）的传奇希腊英雄在特洛伊战争中发挥了巨大作用。希腊诗人荷马在史诗《伊利亚特纪》中记述了阿贾斯传奇的力量和勇气。\n\
  \n作为一名多年来创建并维护过许多网站的人，我不得不说，当我第一次尝试新闻订阅时感到非常兴奋。它们允许你聚合来自其他地方的内容，并将其整合到你自己的页面中，其效果是你的页面会自动更新并保持新鲜——或者至少新闻订阅是自动更新的。所以，除非你有天赋并渴望费尽精力地报道新闻，否则你可能会发现，注入到你网站的相关新闻订阅可以提供自动刷新的有趣内容。\n\
  \n### 挑战：动态查询新闻订阅\n\n本章的挑战是使用 `Ajax` 动态查询新闻订阅 Web 服务以获取数据（新闻项目），然后在页面上显示这些新闻项目。更具体地说，新闻项目是新闻故事的标题，因此你实际上需要显示的是作为每个新闻故事链接的标题。事实证明，新闻订阅中的每个新闻项目都包含标题和链接等其他内容，因此新闻订阅提供了你应对挑战所需的所有数据。\n\
  \n在深入探讨挑战本身之前，我们首先需要花一点时间了解新闻订阅以及它们是如何融入 Web 世界的。让大多数新闻订阅运行的技术是 `RSS`。这项技术允许你同步\
  \ Web 内容，这意味着你可以订阅 Web 网站并轻松发现新发布的内容，而无需实际访问它。虽然对 `RSS` 缩写有几种解释，但最新且可能最准确的是“真正简单订阅”（Really\
  \ Simple Syndication）。RSS 新闻订阅实际上是编码信息的 XML 文档；你将在本章稍后部分学习更多关于 RSS 具体格式的知识。\n\n\
  通过 `Ajax` 动态检索新闻项目一样酷的，是 Ajax 请求执行期间显示的精美小“加载”图像。本章的新闻订阅应用程序使用的以下文件位于书中附带的光盘的 `chap05`\
  \ 示例文件夹中：\n\n*   `newsfeeder.html`—主 Web 页面\n*   `newsfeeder.php`—加载新闻订阅的服务器脚本\n\
  *   `newsfeeder.css`—格式化的样式表\n*   `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n*   `domkit.js`—Ajax\
  \ Toolkit 的 DOM 相关函数\n*   `newspaper.gif`—显示在每个新闻项目旁的报纸图标\n*   `wait.gif`—Ajax 请求期间显示的动画“等待”图标\n\
  \n\n\n\n\nRSS 的历史及其不同版本相当复杂，因此可以说 `RSS 2.0` 是 `RSS` 的最新且最常用的版本。你可能还会看到 Atom 格式的新闻源，它与\
  \ `RSS 2.0` 非常相似。\n\n通过使用名为“新闻聚合器”（news aggregator）的特殊软件，你可以监控来自多个网站的 RSS 新订阅，并有效地跟踪广泛范围的信息，而无需定期访问每个不同的网站。你可以将\
  \ `RSS` 视为为 Web 内容提供某种“股票行情显示”的功能——它允许你持续关注你喜爱的网站何时发布了新内容。\n\n尽管它们没有独立的新闻聚合器应用程序功能全备，但大多数现代\
  \ 浏览器都提供了查看新闻源的内置支持。图 5.1 显示了在 Firefox 浏览器中查看的主 Wired 新闻源。\n\n![你可以在大多数 浏览器中直接查看\
  \ RSS 新闻源，无需任何特殊插件或软件。](img/05fig01.jpg)\n\n图 5.1.你可以在大多数 浏览器中直接查看 RSS 新闻源，无需任何特殊插件或软件。\n\
  \n当然，在 Web 浏览器中直接查看新闻源与将源嵌入你自己的页面并不完全相同。这让我们回到了面临的挑战——使用 `Ajax` 在页面中动态加载并显示新闻源。由于每个新闻源都有自己独特的\
  \ `URL`，该挑战的 `Ajax` 部分实际上非常简单——它涉及从 `URL` 获取整个 XML 文档。这意味着你不需要在应用程序的服务器端对新闻数据进行任何特殊处理，这极大地简化了工作。\n\
  \n由于此应用程序的 `Ajax` 请求非常简单，我们将通过给用户提供视觉提示（告知其数据正在加载）来稍微美化用户界面。这也很重要，因为某些新闻源包含的信息足够，会导致接收数据时出现明显的延迟。如果你不知道正在发生什么，即使是几秒钟的延迟也会让人感到困惑。因此，处理该问题的一种巧妙方法是在请求进行时显示“加载中”图像。\n\
  \n挑战的最后一部分是给用户从多个新闻源中选择的选项。这不仅为使用不同的数据集对应用程序进行压力测试提供了良好方法，而且从用户的角度来看，也使应用程序更加灵活。当然，在将\
  \ `RSS` 整合到自己的页面时，你可以选择单个源并放弃选择方法。无论何种，News Feeder 示例应用程序都是你 RSS Ajax 冒险之旅的绝佳起点。\n\
  \n## 设计：设计新闻源应用程序\n\nNews Feeder 应用程序的设计始于将数据从新闻源服务器传输到应用程序的 `Ajax` 请求。该请求从新闻源服务器的\
  \ `URL` 开始，然后该服务器返回一个包含新闻源详细信息的 XML 文档，其中包含带有链接和发布日期的单个新闻项目列表。`Ajax` 请求由用户从选择列表中选择新闻源时触发。\n\
  \n鉴于每个新闻源都有一个作为 `Ajax` 请求基础的对应 `URL`，你需要一种方法将源 `URL` 与源名称绑定，以便允许用户选择源。`<option>`\
  \ 标签的 `value` 属性是存储源 `URL` 的理想位置，它让你能够轻松地构建新闻源选择列表。\n\n新闻源选择列表是 News Feeder 用户界面的主要组件之一。该界面由两部分组成：新闻源选择列表和成功加载后显示源数据的区域。在这种情况下，源数据由源标题和一系列作为每个新闻故事链接的单个源项目组成。图\
  \ 5.2 显示了 News Feeder 用户界面是如何融入新闻源 `Ajax` 请求的。\n\n![News Feeder 应用程序的用户界面由一个选择列表和一个包含新闻源标题和单个新闻项目链接的区域组成。](img/05fig02.gif)\n\
  \n图 5.2.News Feeder 应用程序的用户界面由一个选择列表和一个包含新闻源标题和单个新闻项目链接的区域组成。\n\n我之前提到过应用程序应该使用动画图像让用户知道\
  \ `Ajax` 请求正在下载新闻源数据。图 5.3 让用户知道 Ajax 请求正在处理中。\") 显示了这个动画图像 `wait.gif` 的样子。\n\n\
  ![News Feeder 应用程序使用动画的“加载中”图像 (wait.gif) 让用户知道 Ajax 请求正在处理中。](img/05fig03.jpg)\n\
  \n图 5.3.News Feeder 应用程序使用动画的“加载中”图像 (`wait.gif`) 让用户知道 Ajax 请求正在处理中。\n\n诚然，在打印的页面上很难辨认动画，但图像的移动给用户一种感觉，即某些正在发生，他们不是在盯着一个冻结的页面。现在你可能会质疑在异步应用程序中显示“加载中”图像的想法。`Ajax`\
  \ 的核心意义不就是为了不让用户等待某项内容吗？是的，但请记住，在请求期间，应用程序实际上并没有冻结——用户可以自由选择不同的源，在这种情况下，当前的源请求会被中断。动画图像只是为了让用户知道正在进行某种工作。\n\
  \n现在你应该已经对应用程序的总体设计有了足够的了解，可以深入研究 `Ajax` 请求和响应了。\n\n### 客户端请求\n\n在没有任何安全限制的情况下，News\
  \ Feeder 应用程序中的客户端请求将是 Ajax 方程中最可预测的部分，因为它简单地对一个 `URL` 执行 `GET` 请求，没有任何特殊参数或其他任何内容。然而，直接在远程\
  \ Web 服务器上进行 `Ajax` 请求是不可能的，这意味着你必须创建自己的服务器脚本来接受并履行 `Ajax` 请求。\n\n获取新闻源数据只需要新闻源的\
  \ `URL`。因此，News Feeder 客户端请求必须将新闻源的 `URL` 发送到你的服务器脚本，然后由脚本处理获取数据并以 `Ajax` 响应的形式返回。这一切的关键在于识别合适的\
  \ RSS 新源，这意味着找到它们的 `URL`。\n\n如果你开始留意你访问的网站，可能会在主菜单或导航链接附近的看到“订阅”（syndicate）链接，甚至可能是\
  \ RSS 图标。这就是寻找新闻源 `URL` 的方法，而这个 `URL` 就是你通过 `Ajax` 加载新闻源所需的所有。\n\n### 注意\n\n![注意](img/note.jpg)\n\
  \n大多数内容驱动的网站（如新闻网站）提供针对不同兴趣的众多新闻源。例如，*USA Today* 提供超过 30 种从大学冰球到赛马的不同体育新闻源。要访问它们，只需滚动到\
  \ *USA Today* 主 Web 页面 ([`www.usatoday.com/`](http://www.usatoday.com/)) 的底部并点击小橙色\
  \ XML 图标。这个图标通常被用来代替较新的 RSS 图标。\n\n### 服务器响应\n\n\n\n\n\n在 News Feeder 应用的服务端，服务器仅负责递送一个包含\
  \ RSS 格式新闻源信息的 XML 文档，而 RSS 正好就是 XML 格式。与书中的其他示例不同（那些示例依赖服务器 PHP 脚本在通过 Ajax 响应返回数据之前对数据进行某种处理或操作），News\
  \ Feeder 应用只需要一个 PHP 脚本，来绕过无法在第三方域名上发出客户端请求的固有局限。这是一种安全限制，防止客户端 JavaScript 代码越出其所属的域名范围。\n\
  \n因此，News Feeder 应用确实在服务器上需要一个 PHP 脚本，但它的唯一作用是从远程服务器获取新闻源数据，然后通过 Ajax 响应将其传回给客户端。你可以将\
  \ News Feeder 的服务器脚本视为一个代理，因为它在客户端 JavaScript 代码和实际托管新闻源的远程服务器之间充当了中间人。再次强调，关键在于你的\
  \ Ajax 代码只能向你的服务器发送请求，而当你需要从其他地方请求数据时，这是一个大问题。解决方案是允许服务器脚本检索数据，然后让该脚本作为响应 Ajax 请求的基础。\n\
  \n我一直提到的第三方（远程）服务器可以是任何提供 RSS 格式数据的服务器。你会发现，如果你稍作探索，大多数主流 网站都提供 RSS 格式的新闻源。当你发现新闻源时，请注意浏览器中的\
  \ URL——这就是你在发起 RSS Ajax 请求时需要插入到代码中的 URL。\n\n### 理解客户端到服务器的对话\n\n如果你将你学到的关于 News\
  \ Feeder 应用上下文中发生的通信的知识整合在一起，就会得到一个如图 5.4 所示的数据流。\n\n![News Feeder 应用在响应发送新闻源 URL\
  \ 请求时接收 XML 新闻源数据。](img/05fig05.gif)\n\n**图 5.4. News Feeder 应用在响应发送新闻源 URL 请求时接收\
  \ XML 新闻源数据。**\n\n作为 Ajax 请求参数发送到服务器的数据是新闻源数据的 URL。尽管这些数据始终以 URL 的形式存在，但它可以有多种形式。例如，以下是与*科学美国人*Scientific\
  \ American）网站关联的新闻源 URL：[`www.sciam.com/xml/sciam.xml`](http://www.sciam.com/xml/sciam.xml)。\n\
  \n注意此 URL 引用了一个特定的 XML 文档 `sciam.xml`。考虑到 RSS 源实际上是 XML 文档，这是很合理的，但新闻源 URL 并不总是引用\
  \ XML 文件。例如，以下 URL 是 Wired 新闻源的：[`feeds.wired.com/wired/topheadlines`](http://feeds.wired.com/wired/topheadlines)。\n\
  \n在这个示例中，URL 是一个路径而不是文件名。底线是，你无法总是预测新闻源 URL 的确切形式。好消息是，你通常可以直接使用网站提供的分发 URL。\n\n\
  一旦你获取了新闻源 Web 服务器的 URL，它就必须被封装成一个更大的 URL，以便作为 Ajax 请求的一部分提交给 News Feeder 服务器脚本。以下是实现此操作的示例：\n\
  \n```\nnewsfeeder.php?rssurl=http://www.sciam.com/xml/sciam.xml\n```\n\n这段代码揭示了如何将新闻源\
  \ URL 封装成单个参数（`rssurl`）。这整个 URL 被用作 Ajax 请求的基础，在这种情况下，你的服务器脚本 `newsfeeder.php` 将获取\
  \ `rssurl` 参数，并使用其中包含的 URL 获取馈信息。\n\n提到服务器脚本，你现在理解了它通过 `rssurl` 参数接收新闻源 URL，然后使用该\
  \ URL 获取一个 RSS 文档。该文档随后通过 Ajax 响应传回给客户端 JavaScript 代码。以下此类 RSS 代码的真实外观：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<rss version=\"2.0\" xmlns:dc=\"http://purl.org/dc/elements/1.1/\"\
  >\n<channel>\n  <title>Scientific American - Official RSS Feed</title>\n  <link>http://www.sciam.com/</link>\n\
  \  <image>\n    <url>http://www.sciam.com/media/logo/SAlogo_144px.gif</url>\n  \
  \  <title>Scientific American.com</title>\n     <link>http://www.sciam.com/</link>\n\
  \    <width>144</width>\n    <height>45</height>\n  </image>\n  <description>Science\
  \ news and technology updates from\n    Scientific American</description>\n  <language>en-us</language>\n\
  \  <managingEditor>editors@sciam.com</managingEditor>\n    <dc:publisher>Scientific\
  \ American</dc:publisher>\n  <copyright>Copyright 1996-2007 Scientific American</copyright>\n\
  \  <item>\n    <title>News: Snake Bites the Toxic Toad that Feeds It—and\n     \
  \ Spreads Its Poison</title>\n    <link>http://www.sciam.com/article.cfm?chanID=sa003&amp;\n\
  \      articleID=6FD96483-E7F2-99DF-3C8A12ACF6BB2D8&amp;\n      ref=rss</link>\n\
  \    <guid>http://www.sciam.com/article.cfm?chanID=sa003&amp;\n      articleID=6FD96483-E7F2-99DF-3C8A12ACF6BB2D8&amp;\n\
  \      ref=rss</guid>\n    <author>JR Minkel &lt;editors@sciam.com&gt;</author>\n\
  \    <dc:date>2007-01-29T17:00:00-05:00</dc:date>\n  </item>\n  <item>\n    <title>News:\
  \ Did Honest Abe Have Nerves of Glass?</title>\n    ...\n  </item>\n</channel>\n\
  </rss>\n```\n\n\n\n\n\nRSS 新闻源之所以使用两个不同的标签来编码发布日期，其原因非常复杂，涉及到竞争性的规范以及 RSS 格式演进迅速的实。我并不打算给你上一堂枯燥且没必要的\
  \ RSS 历史课，只需要说：你遇到 `<pubDate>` 标签的频率可能比 `<date>` (`<dc:date>`) 高得多，但同时支持两者仍然值得的，因为一些知名网站确实在使用\
  \ `<date>`。\n\n当然，你还需要获取新闻源的名称，甚至可能是其网站的链接。这些信息也包含在 `<title>` 和 `<link>` 标签中，但这次标签出现在\
  \ `<channel>` 标签之下；一个独立的新闻源有时也被称为 `channel`，就像电视频道一样。因此，再次检查《科学美国》（Scientific American）的代码，以下是包含新闻源标题和链接的代码：\n\
  \n```\n...\n<channel>\n  <title>Scientific American - Official RSS Feed</title>\n\
  \  <link>http://www.sciam.com/</link>\n...\n```\n\n总而言之，为了新闻提送器（News Feeder）应用程序的目的，必须从\
  \ RSS (XML) 新闻源文档中提取出以下信息：\n\n*   新闻源标题（`<channel>` 内部的 `<title>`）\n*   新闻源链接（`<channel>`\
  \ 内部的 `<link>`）\n*   新闻项目标题（`<item>` 内部的 `<title>`）\n*   新闻项目链接（`<item>` 内部的 `<link>`）\n\
  *   新闻项目发布日期（`<item>` 内部的 `<pubDate>` 或 `<date>`）\n\n前两个信息在任何给新闻源文档中只出现一次，而后两个如果有多个新闻项目，可能会出现多次——而且通常确实如此。当有多个新闻项目时，每个项目都有自己的\
  \ `<item>` 标签。\n\n尽管我可以花更多时间来揭示 RSS 数据格式的细节，但我不会这样做；这没有必要。你已经掌握了组装新闻提送器应用程序所需的所有知识，让我们开始吧！\n\
  \n## 组装新闻提送器应用程序\n\n你可能已经准备好处理新闻提送器应用程序的主要部分：一个网页和一个服务器脚本。然而，拼图中还有第三块碎片，形式为 CSS\
  \ 样式表。样式表并不是绝对必要的，但它确实为显示的新闻信息增添了许多更愉悦的外。因此，以下是应用程序所需的组件：\n\n*   HTML 网页 (`newsfeeder.html`)\n\
  *   CSS 样式表 (`newsfeeder.css`)\n*   PHP 服务器脚本 (`newsfeeder.php`)\n\n请记住，对于每个不同的新闻源\
  \ URL，还涉及到一个远程服务器。从某种意义上说，这个远程服务器并不是应用程序的一部分，因为你不需要担心文件或其他资源，但它对应用程序的运行起着至关重要的作用。因此，在接下来的几节处理新闻提送器应用程序文件时，请理解它们仍然依赖远程服务器来获取实际的新闻源数据。\n\
  \n### 新闻提送器网页\n\n新闻提送器网页 (`newsfeeder.html`)无疑是应用程序最重要的部分，因为它负责解析 PHP 服务器脚本返回的 RSS\
  \ 数据，并以有意义的方式显示这些数据。如图 5.5 所示，该页面包含一个新闻源选择列表，随后是一个 `div` 元素，该元素包含了当前选择的新闻源的链接标题，以及每个链接新闻项目的列表。\n\
  \n![新闻提送器网页包含一个新闻源选择列表，随后是与当前选择源相关的信息。](img/05fig06.jpg)\n\n**图 5.5. 新闻提送器网页包含一个新闻源选择列表，随后是与当前选择源相关的信息。**\n\
  \nHTML 代码在 `<body>` 标签中为新闻提送器网页建立了用户界面，其代码如下：\n\n```\n<body onload=\"loadFeed()\"\
  >\n  <div id=\"ajaxState\" style=\"display:none\"></div>\n  <br />\n  <div>Choose\
  \ your news:\n    <select id=\"feed\" onchange=\"loadFeed()\">\n      <option value=\"\
  http://feeds.wired.com/wired/topheadlines\">\n        Wired News</option>\n    \
  \  <option value=\n        \"http://feeds.engadget.com/weblogsinc/engadget\">\n\
  \        Engadget</option>\n     <option value=\n       \"http://feeds.ziffdavis.com/ziffdavis/extremetech\"\
  >\n       ExtremeTech</option>\n     <option value=\n       \"http://feeds.feedburner.com/ajaxian\"\
  >Ajaxian</option>\n     <option value=\"http://www.sciam.com/xml/sciam.xml\">\n\
  \       Scientific American</option>\n     <option value=\"http://news.google.com/?output=rss\"\
  >\n       Google News</option>\n     <option value=\n       \"http://www.michaelmorrison.com/mambo/index2.php?\n\
  \       option=com_rss&feed=RSS2.0&no_html=1\">\n       Michael Morrison's Blog</option>\n\
  \   </select>\n </div>\n <br />\n <div id=\"feedcontent\"></div>\n</body>\n```\n\
  \n如果你排除掉由 `<select>` 标签创建的选择列表，你会发现这段代码非常简单。事实上，页面上实际上只有两个视觉元素：选择列表 (`feed`) 和用于显示动态加载信息的\
  \ `div` 元素 (`feedcontent`)。\n\n网页主体中不应忽略的代码代码是 `onload` 事件处理器，它负责通过调用 `loadFeed()`\
  \ 函数加载第一个源。在查看 `loadFeed()` 函数之前，值得指出的是，你无需处理任何其他代码就可以完全自定义你发现的新源——换句话说，只需添加 `<option>`\
  \ 标签或修改现有的 `<option>` 标签即可。\n\n如果你想深入了解应用程序背后的原理，那么你必须研究 JavaScript。以下是 `loadFeed()`\
  \ 函数的代码，它负责启动加载源数据的 Ajax 请求：\n\n```\nfunction loadFeed() {\n  // 清除之前的源内容\n  document.getElementById(\"\
  feedcontent\").innerHTML =\n    \"<img src='wait.gif' alt='Loading...' />\";\n\n\
  \  // 发送 Ajax 请求加载新的源内容\n  ajaxSendRequest(\"GET\", \"newsfeeder.php?rssurl=\" +\n\
  \    encodeURIComponent(document.getElementById('feed').options[\n    document.getElementById('feed').selectedIndex].value),\n\
  \    handleFeedRequest);\n}\n```\n\n\n\n回到 `loadFeed()` 代码，“加载中”图像是通过更改 ID 为 `feedcontent`\
  \ 的 `div`，使其包含一个 `<<img>>` 标签来显示的。这种更改通过设置 `div` 元素的 `innerHTML` 属性来实现。你可以使用 `innerHTML`\
  \ 属性来动态更改页面上元素的内容。在稍后的代码中，你会看到在将新闻提要标题和新闻项目显示在同一个提要内容 `div` 容器中时，再次使用了该属性。\n\n`loadFeed()`\
  \ 函数的最后一段代码负责发出 Ajax 请求。这段代码构建了一个用于与 PHP 服务端脚本 `newsfeeder.php` 通信的 URL，其中包含了包含新闻提要\
  \ URL 的 `rssurl` 参数。Ajax 处理函数被设置为 `handleFeedRequest()`，而正是这个函数承担了应用程序中的大部分重型工作。\n\
  \n### 注意事项\n\n![Note](img/note.jpg)\n\n在这里，我必须向你透露一个小秘密——这是我在本书中第一次使用 `innerHTML`\
  \ 属性来更改网页的内容。我感到有一点内疚，因为这个属性并没有被世界维网联盟（W3C）正式认可为 Web 标准，这使得它的用法有些可疑。然而，它非常方便，并被专家开发者用于无数\
  \ Web 网站，因此该属性在短期内不太可能消失。另一种方案是纯通过 DOM 应用程序编程接口（API）函数修改页面中的内容。后一种技术至少从标准的角度来看是更优的，但在大多数情况下它更复杂。我选择了简单明了，因此使用了\
  \ `innerHTML` 属性。如果你想了解更多关于 `innerHTML` 与 DOM API 的争论，只需在 Web 上搜索“innerHTML”和“DOM”即可。你会发现强烈的观点并不乏！\n\
  \n在进入 `handleFeedRequest()` 函数的代码之前，还有另一段小代码值得关注。我指的是紧接在 `loadFeed()` 函数下方用于预加载\
  \ `wait.gif` 图像的代码：\n\n```\nvar waitImage = new Image();\nwaitImage.src = \"wait.gif\"\
  ;\n```\n\n这段代码的意义在于，你不希望在加载“加载中”图像时出现任何明显的延迟。该图像的目的是让用户知道后台正在发生某些重要的事情。因此，我们通过在页面渲染之前预加载图像来尽可能快地开始工作。这之所以有效，是因为图像预加载代码出现在任何其他\
  \ JavaScript 函数之外，这意味着它在页面加载时会自动运行。\n\n回到 `handleFeedRequest()` 函数，它的工作是响应 Ajax\
  \ 响应，通过筛选返回的 RSS 数据然后显示有意义的新闻提要信息。以下是该函数的代码：\n\n```\nfunction handleFeedRequest()\
  \ {\n  if (request.readyState == 4 && request.status == 200) {\n    //  XML 响应数据\n\
  \    var xmlData = request.responseXML;\n\n    // 从提要标题开始生成提要内容\n    var feedContent\
  \ = \"\";\n    var channelElem = xmlData.getElementsByTagName(\"channel\")[0];\n\
  \    feedContent += \"<div class='feedtitle'><a href='\" +\n      getText(channelElem.getElementsByTagName(\"\
  link\")[0]) +\n      \"'>\" + getText(channelElem.getElementsByTagName(\n      \"\
  title\")[0]) + \"</a></div>\";\n\n    // 现在作为无序列表生成提要项目列表\n    feedContent += \"\
  <<ul>\";\n    var feedItems = channelElem.getElementsByTagName(\"item\");\n    for\
  \ (var i = 0; i < feedItems.length; i++) {\n      var itemTitle =\ngetText(feedItems[i].getElementsByTagName(\"\
  title\")[0]);\n      var itemLink = getText(feedItems[i].getElementsByTagName(\n\
  \        \"link\")[0]);\n      var itemPubDate =\ngetText(feedItems[i].getElementsByTagName(\"\
  pubDate\")[0]);\n      if (itemPubDate == \"\")\n        itemPubDate = getText(feedItems[i].getElementsByTagName(\n\
  \          \"date\")[0]);\n      if (itemPubDate == \"\")\n        feedContent +=\
  \ \"<li><a href='\" + itemLink + \"'>\" +\n          itemTitle + \"</a></li>\";\n\
  \      else\n        feedContent += \"<li><a href='\" + itemLink + \"'>\" +\n  \
  \        itemTitle + \" <span class='itemdate'>(\" +\n          itemPubDate + \"\
  )</span></a></li>\";\n    }\n    feedContent += \"</ul>\";\n\n    // 显示提要内容\n  \
  \  document.getElementById(\"feedcontent\").innerHTML = feedContent;\n  }\n  ajaxUpdateState();\n\
  }\n```\n\n诚然，这里的代码相当多，但理解起来并不太困难。只需记住，它基本上是在动态构建一段 HTML 代码。换句话说，该函数正在构建 Web 页面的一部分，以便将其插入提要内容\
  \ `div` 中显示。生成的 HTML 代码包含了新闻提要的标题，该标题恰好也作为指向新闻源网站的链接。HTML 代码还包含一个无序（项目符号）新闻项目列表，每个项目由一个链接标题和一个发布日期组成。需要注意的是，生成的\
  \ HTML 代码包含了几个 CSS 样式表类引用，这有助于样式表知道它被应用到了哪些内容。\n\n在 `handleFeedRequest()` 函数的末尾，你看到一行代码，它最终将动态生成的\
  \ HTML 代码插入页面中：\n\n```\ndocument.getElementById(\"feedcontent\").innerHTML = feedContent;\n\
  ```\n\n虽然这段代码简短有力，但考虑到它负责将“加载中”图像替换为格式化的新闻提要标题和项目，它的作用巨大。页面的外观主要由 `newsfeeder.css`\
  \ 样式表提供，该样式表通过以下链接在 Web 头部引用：\n\n```\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"newsfeeder.css\" />\n```\n\n`newsfeeder.css` 样式表位于与其余 Feeder 文件相同的 `chap05`\
  \ 文件夹中。下一节将快速检查此样式表，并解释它对 Feeder 外观的影响。\n\n### Feeder 样式表\n\n我会第一个承认，我很不愿意在一部关于\
  \ Ajax 的书中列出 CSS 样式表代码。然而，Feeder 应用程序是一个极佳的例子，展示了少量代码可以为应用程序增添多少魅力。如果你不相信，请查看图 5.7，它展示了没有样式表效果的\
  \ Feeder 应用程序。\n\n![如果没有样式表，Feeder 应用程序看起来有些乏味。](img/05fig08.jpg)\n\n**图 5.7.如果没有样式表，Feeder\
  \ 应用程序看起来有些乏味。**\n\n将此图与图 5.5 进行对比，后者显示了具有样式表效果的完全相同的新闻提要。或者直接使用随书附的 Live Linux\
  \ 光盘在你自己的 Web 浏览器中尝试 Feeder 示例。重点是，尽管 CSS 与 Ajax 无直接关系，但它可以让任何 Ajax 应用程序看起来更有吸引力、更专业。\n\
  \n以下是负责 Feeder 应用程序中新闻提要标题样式的 CSS 代码：\n\n```css\ndiv.feedtitle {\n  padding-left\
  \ : 5px;\n  background-color : #EEEEEE;\n  font-size : 22px;\n  font-weight : bold;\n\
  }\n\ndiv.feedtitle a {\n  color : #666677;\n  text-decoration : none;\n}\n\ndiv.feedtitle\
  \ a:hover {\n  color : #333344;\n  text-decoration : none;\n}\n```\n\n\n\n\n新闻流标题是在\
  \ HTML 代码中生成的，该代码具有 `class` 属性 `feedtitle`，这正是代码与这组样式建立联系的。首先为标题整体设置了左侧内边距、背景颜色、字体大小和字重。然后设置了文本颜色，并为用户鼠标悬停在标题上时设置了略有不同的颜色（如果你还记得的话，它是一个链接）。使用\
  \ `text-decoration` 样式是为了覆盖当用户悬停在链接上时显示下划线的默认 HTML 行为——在这种情况下，在悬停时更改字体颜色看起来更整洁、更专业。\n\
  \n相似的 CSS 样式也应用于无序列表中显示的单个新闻项目：\n\n```css\nli {\n  font-size : 18px;\n  padding-left\
  \ : 25px;\n  background : url(newspaper.gif) no-repeat;\n  list-style : none;\n\
  }\n```\n\n这段代码负责在列表中的每个项目旁边显示整齐的小报纸图标（请参考图 5.5）。每个列表项目也是一个链接，因此对新闻项目应用与推送标题相同的通用的“链接悬停”着色概念是合理的。以下是该部分的\
  \ CSS 代码：\n\n```css\na:link {\n  color : #333344;\n  text-decoration : none;\n}\n\
  \na:visited {\n  color : #9999AA;\n  text-decoration : none;\n}\n\na:hover, a:active\
  \ {\n  background : #EEEEEE;\n  text-decoration : none;\n}\n```\n\n最后，你可能已经注意到每个新闻项目的发布日期以斜体显示，且颜色非常浅，以免与标题竞争夺。以下是负责新闻项目发布日期外观的\
  \ CSS 样式：\n\n```css\nspan.itemdate {\n  font-style : italic;\n  color : #CCCCDD;\n\
  }\n```\n\n新闻推送器（News Feeder）应用的样式表到此结束。剩下的 PHP 服务器脚本完成后，应用就完成了。\n\n### 新闻推送器服务器脚本\n\
  \n你是否见过田径赛中的接力赛，一名跑步者将接棒交给另一名跑步者？这基本上 `newsfeeder.php` 服务器脚本为新闻推送器应用所做的。它运行并从远程服务器获取新闻流\
  \ RSS 数据，然后迅速返回并将数据传递给客户端 JavaScript 代码。得益于 Ajax 请求中传递给它的 URL 参数（`rssurl`），服务器脚本知道要从哪个服务器获取\
  \ RSS 数据。以下是该 PHP 脚本的代码：\n\n```php\n<?php\nheader('Content-type: text/xml;');\n\n\
  // 返回 RSS 馈数据\necho file_get_contents($_REQUEST['rssurl']);\n?>\n```\n\n### Note\n\
  \n![Note](img/note.jpg)\n\n记住，这个“代理”服务器脚本的目的是绕过无法在远程服务器上发出 Ajax 请求的限制。如果不存在这个安全限制，那么服务器脚本就是多余，客户端将直接对新闻流\
  \ URL 发起 Ajax 请求。然而，远程请求权限限制在服务器是有充分的：安全！让客户端脚本自由发起远程请求实在太危险了，因此必须创建自己的 Ajax 代理是获得更安全\
  \ Web 所付出的微小代价。\n\n在设置标头以便以 XML 格式发送响应后，此脚本实际上只包含一行代码。`file_get_contents()` 函数从指定的\
  \ URL 获取数据，这正是你所需的功能。因此，脚本所做的只是将新闻流 URL 传递给此函数并将结果返回给客户端。最终结果是一个格式良好的 RSS 新闻流文档，作为\
  \ Ajax 请求的响应返回给客户端。\n\n## 测试新闻推送器\n\n当你首次打开新闻推送器 Web 页面时，应用程序最初加载选择列表中的第一个新闻流，恰好是\
  \ Wired News 的头条故事。图 5.8 显示了选中了该新闻流的应用。\n\n![新闻推送器应用从加载选择列表中的第一个新闻流开始。](img/05fig09.jpg)\n\
  \n**图 5.8. 新闻推送器应用从加载选择列表中的第一个新闻流开始。**\n\n当你通过选择选择列表中不同的推送切换到另一个新闻流时，在进行 Ajax 请求期间会显示动画化的“加载”图像。图\
  \ 5.9 显示了推送从 Wired News 切换到 Engadget。\n\n![当切换新闻流时，会显示动画化的“加载”图像让你知道页面正在后台处理某些操作。](img/05fig10.jpg)\n\
  \n**图 5.9. 当切换新闻流时，会显示动画化的“加载”图像让你知道页面正在后台处理某些操作。**\n\n新闻流的大小并不大，因此显示推送不需要费长时间。当这种情况发生时，新推送的信息将取代“加载”图像，如图\
  \ 5.10 所示。\n\n![当新选择的新流加载完成后，信息将取代“加载”图像。](img/05fig11.jpg)\n\n**图 5.10. 当新选择的新流加载完成后，信息将取代“加载”图像。**\n\
  \n重要的是，你现在已经创建了一个非常实用的新闻聚合器。我的意思是，一旦你理解了 Ajax 在新闻推送器应用中的工作原理，你可能会发现自己很喜欢使用该应用获取新闻。点击新闻项目即可查看完整新闻。在这种情况下，点击新闻项目将带你进入\
  \ Engadget 网站上的新闻。\n\n除了有有趣的科技新闻外，Engadget Web 页面也是如何方便你聚合数据的良好示例。在 Engadget Web\
  \ 页面的右上角你会看到标准的橙色 RSS 图标。点击此图标将获得 Engadget 新闻流的 URL，我想这是一个不错的选择！\n\n## 为新闻推送器进行极端的\
  \ Ajax 改造\n\n书中的没有任何应用程序是真正完成的。我的意思是，示例应用程序都是作为你实验 Ajax 的起点。新闻推送器应用也不例外，事实上它是一个极具可定制性的应用示例。\n\
  \n可能自定义新闻推送器应用最明显的方法是折腾推送本身。这也是最简单的自定义，因为你只需要操作 Web 页面中的 `<option>` 标签，更改标题和值以对应其他新闻流。请记住，你可以添加任意数量的新\
  \ `<option>` 标签，最终构建包含许多不同新闻流的选择列表。\n\n\n\n\n\n你可能会认为，从新闻源列表中进行选择并不是你真正想要的，在这种情况下，你可能会选择仅将单个新闻源嵌入到你自己的\
  \ Web 页面中。在这种情况下，你需要从 `newsfeeder.html` Web 页面中仔细提取重要代码并将其放置到你的页面中。这主要涉及复制和粘贴页面\
  \ `head` 中的所有脚本代码，并确保不要忘记 `<body>` 标签的 `onload` 事件处理程序，该程序会调用 `loadFeed()` 函数。你还需要确保创建一个名为\
  \ `feedcontent` 的 `div` 元素。最后，你需要稍微微调 `loadFeed()` 函数，使其使用你选择的新闻源 URL，而不是从选择列表中获取它。\n\
  \n如果你选择将新闻源嵌入到包含其他内容的页面中，那么你很可能想要限制在页面上显示的新闻条目数量。例如，你可能只想显示前五条或十条新闻条目。要限制显示的项目数量，请将\
  \ `handleFeedRequest()` 函数中的 `for` 循环更改为：\n\n```\nfor (var i = 0; (i < feedItems.length)\
  \ && (i < numItems); i++) {\n```\n\n在这段代码中，`numItems` 变量控制显示多少新闻条目。你可以使用变量，也可以直接硬编码一个数字，如下：\n\
  \n```\nfor (var i = 0; (i < feedItems.length) && (i < 10); i++) {\n```\n\n此示例将新闻条目的数量限制为十个。`for`\
  \ 循环仍然检查 `feedItems` 数组的长度，以防新闻源的项目少于十个，在这种情况下，你只想显示可用项目的数量。\n\n在你掌握了一些 RSS 技能之后，现在可能想要考虑的最后一个技巧是创建自己的\
  \ RSS 新闻源。无论你拥有博客还是其他内容定期变化的网站，允许用户聚合你的网站都是一个很棒的功能。希望你已经在本章中学到了足够的关于 RSS 格式的知识，以尝试创建你自己的\
  \ RSS 文档。事实上，理想的解决方案是开发一个脚本自动将 HTML Web 内容转换为 RSS 格式，以便你的网站能够自动聚合。该解决方案的细节超出了本章的范围，但如果你创建了任何新闻源，你现在有了一个很棒工具来测试它们。\n\
  \n## 总结\n\n本章向你介绍了 Web 内容管理中一个令人兴奋的领域——新闻源，它使用一种名为 RSS（Really Simple Syndication）的基于\
  \ XML 标准数据格式。使用 RSS，可以获取 Web 网站变化内容的快照，而无需实际访问该网站。更重要的是，现在可以聚合另一个网站的内容并将其发布在你的 Web\
  \ 网站上。这是保持页面内容更新的绝佳方法，而不需要总是构思自己的内容。在本章中开发的 News Feeder 演示了 Ajax 如何让动态加载 RSS 数据并将其整洁地呈现在页面成为可能，以便导航和阅读新闻条目。该应用程序包含了足够的核心代码，你可以毫不费力地将\
  \ RSS 新闻源注入到你自己的 Web 页面中。\n\n## 第 6 章：通过自动补全读懂人心\n\n### Ajax 纯血赛马\n\n![Ajax 纯血赛马](img/note.jpg)\n\
  \n如果你是 20 世纪 30 年代澳大利亚的一个赌徒，你可能会以完全不同的眼光看待 Ajax。你可以通过投注澳大利亚冠军纯血赛马 Ajax 来赚取一大笔钱，它因连胜\
  \ 18 场比赛而闻名，并后来入选澳大利亚赛马名人堂。\n\n当 Ajax 首次进入网络领域时，它最直接的益示例之一是 Google Suggest，它利用 Ajax\
  \ 通过尝试自动补全搜索文本来帮助你执行搜索。Google Suggest 是一个特别具有吸引力的 Ajax 示例，因为它既细微又强大——这是一种很难实现的结合。尽管具有技术上的优点，但过多的技术性\
  \ Web 改进最终都对 Web 体验造成了分心。但 Ajax 并非如此。Google Suggest 的自动补全功能是许多 Ajax 特性之一，它们在不干扰\
  \ Web 体验的同时极大地提升了 Web 体验。\n\n本章将引导你设计并开发一个自动补全应用程序，该程序使用 Ajax 在服务器上动态查找用户输入，并协助可能的输入完成。在某些方面，你可以将此应用程序视为一种原始的人工\
  \ Web 智能形式，因为它赋予了文本输入控件猜测用户正在输入什么的能力。该应用程序既简单又强大，是你 Ajax 工具箱中可以添加的一件非常实用的工具。\n\n\
  本章中的 Completer 应用程序使用了以下文件，它们位于随书提供的实时 Linux 光盘中，路径在 `chap06` 示例代码文件夹下：\n\n* `completer.html`——主\
  \ Web 页面\n* `completer.php`——用于查找自动完成文本的服务器脚本\n* `ajaxkit.js`——Ajax Toolkit 的核心\
  \ Ajax 函数\n* `domkit.js`——Ajax Toolkit 的 DOM 相关函数\n\n### 挑战：预测数据输入\n\n本章的挑战是创建一个功能与\
  \ Google Suggest 普及的自动补全功能类似的应用程序。在继续之前，快速查看 Google Suggest 以确切了解它的工作原理将会有帮助。因此，请将浏览器指向\
  \ [`www.google.com/webhp?complete=1&hl=en`](http://www.google.com/webhp?complete=1&hl=en)\
  \ 并尝试进行搜索。\n\n### 注意\n\n![注意](img/note.jpg)\n\nGoogle Suggest 仍然被认为是 Google Labs\
  \ 区域的一个实验性项目，这就是为什么它的 URL 如此晦涩。如果 Google Suggest 被推广到 Google 搜索引擎的主流使用，这个 URL 可能会变得易读。\n\
  \nGoogle Suggest 实际上非常复杂，因为它动态显示了一个供选择建议短的列表。Google Suggest 的有趣之处在于它还显示了每个建议的点击次数，从而让你对建议的重要性有一个参考。Google\
  \ Suggest 没有做的是以任何方式操作文本字段，除非你从下拉列表中选择了某一个建议。\n\n你在本章中开发的 Completer 应用程序在自动补全功能上与\
  \ Google Suggest 有所不同。为了感受它将如何工作，让我们查看另一个提供自动补全的方便网站 Lyricsfly.com。请随时访问 [`www.lyricsfly.com/`](http://www.lyricsfly.com/)，它在图\
  \ 6.1 中展示了运行状态。\n\n![Lyricsfly.com 是一个使用自动补全功能的音乐歌词搜索引擎。](img/06fig02.jpg)\n\n**图�6.1. Lyricsfly.com\
  \ 是一个使用自动补全功能的音乐歌词搜索引擎。**\n\n\n\n\n\n在图中，我点击了“歌曲”（Song）链接来专门搜索歌曲。此外请注意图中 Lyricsfly.com\
  \ 和 Google Suggest 之间的主要区别——Lyricsfly.com 在提供建议时，实际上会将建议的文本添加到文本字段中。这意味着如果你不想用，就不需要使用下拉列表。事实上，如果你不介意继续输入并锁定歌曲，你真的根本不需要下拉列表。诚然，下拉列表确实很有帮助，而且它确实传达了艺术家等额外信息，但它对于自动补全功能并非必关重要。图\
  \ 6.2 显示了如果你继续输入歌曲名，Lyricsfly.com 中的下拉列表最终将解析为单一歌曲。\n\n![你在 Lyricsfly.com 中输入的内容越多，下拉列表就越不重要。](img/06fig03.jpg)\n\
  \n**图 6.2. 你在 [Lyricsfly.com](http://Lyricsfly.com) 中输入的内容越多，下拉列表就越不重要。**\n\n在这张图中，我输入了足够的歌曲名，使下拉列表减少到单一歌曲。当然，整个设计理念是防止用户不得不输入大量内容，但你已经明白自动补全功能在没有下拉列表的情况下也可以运行得相当良好。\n\
  \n展示如何在没有下拉列表的情况下实现自动补全的主要点，是为 Completer 示例应用程序设置挑战。动态创建和管理自定义下拉列表具有相当的复杂性，我希望让这个示例尽可能简洁。你将在书的后半部分学到\
  \ Ajax 驱动的自定义弹出窗口，但现在我想保持一个简单的用户界面，而不包含大量棘手的额外开销代码。因此，我们将抛弃下拉列表，完全在文本输入控件内部创建一个自动补全功能。\n\
  \n这意味着应用程序在任何给定时间只会建议一个单词或短语，但你会发现，即使是单一的建议短语也能对让应用程序变得更加实用和直观产生很大帮助。\n\n因此，Completer\
  \ 应用程序当前的任务是仅为文本输入控件提供自动补全功能。就此挑战如何影响 Ajax 而言，应用程序的客户端负责在用户输入每个字符时向服务器发送用户输入的文本。服务器接收给定的输入文本，并在可能的补全项（建议）列表中找到最匹配的项。然后，服务器将补全的剩余部分返回给客户端，以便添加到文本输入控件并进行选择。\n\
  \n为了让应用程序具有一定的教育意义，Completer 使用了一份著名历史人物列表作为自动补全功能的基础。这意味着用户将从开始输入一个名字，应用程序将快速（理想情况下）用其对该人可能是谁的最佳猜测来填充文本字段。如果用户对建议满意，他或她就不需要再输入更多内容。如果不满意，用户可以选择继续输入，应用程序将尝试另一次补全尝试。除非用户输入速度快到\
  \ Ajax 请求跟不上，否则每次按键按下时都会发出一次请求（实际上是按键释放，但那不是重点所的）。\n\n总而言之，Completer 应用程序会为用户输入的每个字符发出\
  \ Ajax 请求，以尝试自动完成历史姓名的输入。一旦成功输入了姓名，用户就可以点击按钮在 Wikipedia（流行的在线百科全书）上查看该历史人物的传记。应用程序的\
  \ Wikipedia 部分仅仅是作为成功使用 Ajax 输入历史姓名的一个纪念性小奖。\n\n## 设计：设计一个自动补全应用程序\n\n你对于 Completer\
  \ 应用程序中客户端和服务器之间往回传递的数据已经有了基本的概念，并知道正在发生什么。文本输入控件作为显示内容。图 6.3 显示了文本输入控件如何显示在应用程序中。\n\
  \n![用户输入的内容会导致 Ajax 请求返回补全字符串。](img/06fig04.jpg)\n\n**图 6.3. 用户输入的内容会导致 Ajax 请求返回补全字符串。**\n\
  \n图中显示了文本输入控件如何作为 Ajax 请求的源和目的。尽管初看起来看起来很奇怪，但考虑到文本输入控件扮演着两个角色：它接收用户的输入并尝试给予用户信息。这里需要注意的是补全文本被高亮显示，这意味着如果用户输入另一个字符，它将覆盖补全文本。这当然会触发另一个\
  \ Ajax 请求并产生新的补全文本。这种互动一直持续，直到用户到达所需的输入。\n\n关于 Completer 应用程序中的 Ajax 请求数据的一个有趣点是它非常简单。没有任何\
  \ XML，也没有任何数据格式。事实上，你每次只需往回发送几个字符。为了让你理解我的意思，让我们通过一个涉及美国历史人物托马斯·爱迪生（Thomas Edison）的快速示例。你通过在文本框中输入\
  \ `t` 或 `T` 来开始输入这个名字。此时，文本框包含：\n\n```\nT\n```\n\n因为你输入了一个字符，立即发出了 Ajax 请求，并将 `ecumseh`\
  \ 返回到文本框：\n\n```\nTecumseh\n```\n\nTecumseh 是在 1812 年战争中去世的著名肖尼印第领袖。Tecumseh 这个名字是由\
  \ Completer 应用程序最初建议的，因为在补全列表中，字母顺序 Tecumseh 在 Thomas Edison 之前。你将在本章稍后看到这个列表，但现在你希望可以看到列表的字母顺序如何影响补全过程。\n\
  \n如果你继续输入另一个字母（这次是 `h`），文本 `ecumseh` 将立即被 `h` 替换，给你：\n\n```\nTh\n```\n\n发送另一个 Ajax\
  \ 请求，这次返回了 `eodore Roosevelt`。天哪，我们什么时候能得到托马斯·爱迪生？这里是文本框现在的内容：\n\n```\nTheodore\
  \ Roosevelt\n```\n\n显然，Theodore Roosevelt 比 Thomas Edison 更近了一步，但在字母顺序上仍然在它之前，这就是为什么这个名字被建议的原因。事实证明，只需再输入一个字符就能最终锁定爱迪生：\n\
  \n```\nTho\n```\n\n服务器接收到最后一次 Ajax 请求并返回 `mas Edison`，产生如下文本框内容：\n\n```\nThomas\
  \ Edison\n```\n\n现在你得到了你的名字，总共 13 个字符，但你只需要输入了其中的 3 个。这就是自动补全功能的威力。希望这个小练习不仅说明了该功能的实用性，还阐明了执行它所需的\
  \ Ajax 请求和响应的本质。\n\n### 客户端请求\n\n\n\n\n客户端对 `Completer` 应用程序的请求非常简单，因为它会在用户在文本输入控件中输入内容时，直接将用户输入发送出去。这些用户输入只是原始文本字符，没有任何任何特殊格式。在很多情况下，输入只是几个字符，但在没有自动补全匹配且用户继续打字的情况下，字符可能会更多。尽管如此，你所讨论的也只是几十个字符，而不是数百个字符。\n\
  \n### 注意\n![Note](img/note.jpg)\n\n幸运的是，对于 Ajax 请求来说，你发送多少字符其实并不重要，尽管发送的数据越多，请求传输的时间就越长。然而，从大局来看，你所处理的仍然是非常小的数据。\n\
  \n在介绍服务器响应细节之前，值得解决一个针对像 `Completer` 这类 Ajax 应用提出的担忧。我指的是 `Completer` 能够根据用户输入字符发出一连串的请求。虽然\
  \ `Completer` 的服务器端脚本简单且快速，仅依赖于嵌入 PHP 代码中的数据，但一个拥有更大型数据集的应用程序可能会从数据库获取补全文本。这意味着用户每输入一个字符，你就会进行一次数据库查询，这可能是一个问题。\n\
  \n这里的问题在于，大量的数据库查询可能会使数据库服务器崩溃。对于你使用自动补全功能构建的任何 Ajax 应用来说，这可能是也可能不是问题，但这是一个警告：要让任何频繁调用的\
  \ Ajax 代码变得极其高效；即，对最少的数据进行最少的处理。如果你仍然遇到问题，你可能需要探索一种对高频率小数据请求产生更好结果的服务器配置。先不要恐慌——将此视为一个留作备后参考的微小提醒。可能，如果你在使用自动补全功能时保持适度的克制，你就不会遇到任何问题。\n\
  \n### 服务器响应\n\n`Completer` 应用程序中的服务器脚本被赋予了任务：根据用户输入的文本匹配并返回补全文本。与本书中的许多其他应用程序返回经过\
  \ XML 仔细格式化的数据不同，`Completer` 仅返回一个文本片段，作为用户已输入内容的补全。这只是没有特殊格式的原始文本，这意味着你可以在客户端获取它并直接使用，而无需解析任何\
  \ XML 代码。\n\n尽管 `Completer` 应用程序中的服务器响应非常短且简洁，但它们发生的频率比你在其他应用程序中看到的 Ajax 响应要得多，因为它们会在用户每输入一个字符时被触发。这并不一定是个问题，但它也是为什么不在可能的补全列表中使用巨大的补全文本的理由。顺便说一下，这个列表是由\
  \ `completer.php` 服务器脚本提供的，你会在本章稍后的部分看到它。\n\n### 理解客户端到服务器的对话\n\n虽然你可能已经理解了这种特定的客户端到服务器通信交换，但图\
  \ 6.4 正展示了 Ajax 请求以及后续响应如何与浏览器（客户端）和 Web 服务器相关。\n\n![Completer 应用程序涉及未格式化的用户输入和补全文本在客户端和服务器之间来回。](img/06fig05.gif)\n\
  \n**图 6.4. Completer 应用程序涉及未格式化的用户输入和补全文本在客户端和服务器之间来回。**\n\n`Completer` 应用程序双方来回的文本数据非常小，通常只有几个字符或单词量级。如果你回顾本章节之前关于“托马斯·爱迪生”文本补全示例的数据交换，你会发现每次\
  \ Ajax 请求都发送了一系列序列的用户输入字符。这些请求由 `completer.php` 服务器脚本处理。以下是一个 Ajax 请求的 URL 示例，它将字符\
  \ `T` 作为用户输入发送：\n\n```\ncompleter.php?input=T\n```\n\n此时，服务器做出响应并尝试猜测用户正在输入 `Tecumseh`，但事实并非如此。如果用户通过输入字符\
  \ `h` 继续打字，接下来的 URL 将作为 Ajax 补全请求：\n\n```\ncompleter.php?input=Th\n```\n\n这一次，文本\
  \ `Th` 被发送到服务器脚本，这将产生更准确的补全。服务器通过猜测 `Theodore Roosevelt`（西奥多·罗斯福）做出响应，这更接近了，但尚未完全正确。最后，需要一个带有三个字符输入的\
  \ URL 才能获得正确的补全：\n\n```\ncompleter.php?input=Tho\n```\n\n在这个示例中，服务器返回文本 `mas Edision`，这是名字“托马斯·爱迪生”（Thomas\
  \ Edison）的补全文本（`Tho` + `mas Edison`）。用户现在可以接受该补全并点击“了解更多”按钮获取更多关于托马斯·爱迪生的信息。这就是\
  \ `Completer` 应用程序数据交换的全部内容。\n\n## 整合 Completer 应用程序\n\n`Completer` 应用程序的数据交换非常直接，应用程序的结构也相当简单，仅包含两个文件：\n\
  \n* HTML Web 页面 (`completer.html`)\n* PHP 服务器脚本 (`completer.php`)\n\n这两个文件直接对应应用程序的客户端\
  \ (`completer.html`) 和服务器 (`completer.php`) 部分；没有需要竞争的独立数据源或第三方 Web 服务。`Completer`\
  \ Web 页面发出的 Ajax 请求由 PHP 服务器脚本直接处理，然后由页面中的 JavaScript 代码处理响应的数据。\n\n现实中，补全单词和短语列表（你稍后将在\
  \ `completer.php` 代码中看到）应该存储在某种数据库中。某些自动补全列表可能会很大，对于大型数据集的搜索，真正的数据库可能比纯 PHP 代码高效。然而，我在示例中选择了简单的方法，直接在\
  \ PHP 脚本中编写了补全列表。只要你的补全列表不会变得过于巨大，这样做是没有问题的。\n\n### Completer Web 页面\n\n`Completer`\
  \ 应用程序的 HTML 页面 (`completer.html`) 极其简单的用户界面，仅包含一个文本输入控件和一个查找输入的历史名称的按钮。图 6.5 显示了在浏览器中打开并等待输入的页面。\n\
  \n![Completer Web 页面启动时是一个空的输入框，等待用户输入历史名称。](img/06fig06.jpg)\n\n**图 6.5. Completer\
  \ Web 页面启动时是一个空的输入框，等待用户输入历史名称。**\n\n该用户界面主要通过 HTML 代码的主体建立，代码如下：\n\n```\n<body\
  \ onload=\"document.getElementById('name').value = '';\n  document.getElementById('name').focus()\"\
  >\n  <div id=\"ajaxState\" style=\"display:none\"></div>\n  <br />\n  <div>\n  \
  \  输入历史名称:\n    <input id=\"name\" type=\"text\" size=\"32\"\n      onkeyup=\"getCompletion(this,\
  \ event)\" />\n    <input id=\"learnButton\" type=\"button\" value=\"了解更多...\" onclick=\"\
  showBiography()\" />\n  </div>\n</body>\n```\n\n\n\n\n这段代码展示了页面如何包含两个输入控件——一个是文本框，另一个是按钮。注意，文本框在\
  \ body 的 `onload` 事件处理器中被清空，并且焦点也被设置在了它上面。对于任何初始操作是用户输入文本的 Web 页面来说，后操作都是一个好主意。Google\
  \ 就是这种策略的很好的例子——焦点始终设置在搜索文本框上。\n\n同样注意，文本输入控件的 `onkeyup` 事件处理器被设置为调用 `getCompletion()`\
  \ 函数。该函数负责启动 Ajax 请求，以从 Web 服务器获取补全建议。以下是该函数的代码：\n\n```javascript\nfunction getCompletion(inputControl,\
  \ evt) {\n  evt = evt ? evt : (event ? event : null);\n  if (evt) {\n    // 忽略不参与文本输入的按键\n\
  \    var key = evt.charCode ? evt.charCode : evt.keyCode;\n    if (key < 32 || (key\
  \ >= 33 && key <= 46) ||\n     (key >= 112 && key <= 123))\n      return;\n\n  \
  \  // 存储当前输入\n    currentInput = inputControl.value;\n\n    // 发送 Ajax 请求加载补全\n\
  \    ajaxSendRequest(\"GET\", \"completer.php?input=\" +\n      encodeURIComponent(inputControl.value),\n\
  \      handleCompletionRequest);\n  }\n}\n```\n\n### Note\n\n![Note](img/note.jpg)\n\
  \n在本章前面的部分，我提到过与此类 Ajax 请求相关的潜在性能问题，即在响应按键按下时发出大量请求。解决此类问题的一种巧妙方法是设置一个定时器来发送补全请求，而不是每次按键按下时都发送请求。例如，你可以每秒检查两次新按键，这样在补全文本出现方面的效果大致相同，但最大请求数被限制为每秒两次。\n\
  \n该函数中的大部分初始代码处理了浏览器在处理事件方式上的一致性问题。在这种情况下，你感兴趣的是获取按键释放的值，这涉及到一些技巧，以确保代码可以在任何主流浏览器中运行。一旦解析出按键的字符码，就会将其与几个按键范围进行比较，以确保它确实是有效的输入文本。这防止了像\
  \ `Shift` 或 `Enter` 等控制键被解释为有效数据输入，否则将触发 Ajax 自动补全请求。\n\n如果用户输入确实有效，它会被存储在一个名为 `currentInput`\
  \ 的全局变量中。然后根据文本框中的文本组装 Ajax 请求的服务器 URL，并将请求发送到服务器。注意，`handleCompletionRequest()`\
  \ 函数负责在 Ajax 请求返回响应时处理调用。以下是该函数的代码：\n\n```javascript\nfunction handleCompletionRequest()\
  \ {\n  if (request.readyState == 4 && request.status == 200) {\n    // 获取响应文本并删除任何末尾空格\n\
  \    var completion = request.responseText.replace(/\\s*$/g, \"\");\n\n    // 只有当输入控件仍包含\n\
  \    // 当前输入时，才发出 Ajax 请求\n    var inputControl = document.getElementById(\"name\"\
  );\n    if (completion && (inputControl.value == currentInput)) {\n      if (inputControl.setSelectionRange)\
  \ {\n        // 为非 IE 浏览器向输入控件中添加补全\n        var inputLen = inputControl.value.length;\n\
  \        inputControl.value += completion;\n        inputControl.setSelectionRange(inputLen,\n\
  \          inputControl.value.length);\n      }\n      else if (inputControl.createTextRange)\
  \ {\n        // 为 IE 向输入控件中添加补全\n        var sel = inputControl.createTextRange();\n\
  \        sel.text += completion;\n        sel.moveStart(\"character\", -completion.length);\n\
  \        sel.moveEnd(\"character\", 0);\n        sel.select();\n      }\n    }\n\
  \  }\n  ajaxUpdateState();\n}\n```\n\n`handleCompletionRequest()` 函数接收每个 Ajax 服务器响应，负责仔细将补全文本插入文本框并将其选中。尽管这个任务听起来足够简单，但浏览器的兼容性再次导致了两个代码分支：一个为了适应\
  \ IE，另一个为了适应其他浏览器。遗憾的是，在 Web 演进的阶段，我们仍在为像在文本框中选择文本这样简单的事情处理完全不同的方法。但抱怨并不能让应用程序运行得更快！\n\
  \n回顾 `handleCompletionRequest()` 函数的开头，你会看到一行代码处理服务器响应文本并将其存储在 `completion` 变量中。这种处理是必要的，因为响应文本在从服务器发送到客户端的过程中会产生一些额外的字符。这些字符出现在文本末尾，可能是\
  \ PHP 脚本中 `echo` 命令的结果，尽管它本不应该在文本末尾附加换行符、新行或其他任何字符。无论如何，使用标准的文本 `replace()` 方法在继续之前裁剪响应文本末尾的多余字符。\n\
  \n`handleCompletionRequest()` 函数的剩余部分包含了将补全文本添加到文本框并选中的两种不同技术。注意，在代码分支到特定浏览器代码之前，会对\
  \ `currentInput` 变量与文本框的值进行检查。这是一个重要的检查，因为它确保了 Ajax 请求与触发它的输入相匹配。用户可能会输入非常快，输入的字符快于\
  \ Ajax 请求解析的速度。在这种情况下，你只希望最后一个请求生效。这段代码有助于实现这一点。\n\n尽管两个特定浏览器代码分支在细节上有所不同，但它们都执行相同的操作：\n\
  \n*   将补全添加到文本框用户输入的末尾。\n*   选中文本框中的补全，这样如果用户输入另一个字符，补全就会擦除。\n\n这完成了自动补全功能的客户端部分，但并不是\
  \ Completer 页面的终点。如果你查看页面 body 的 HTML 代码，当用户点击“更多信息”按钮时会调用一个名为 `showBiography()`\
  \ 的函数。以下是该函数的代码：\n\n```javascript\nfunction showBiography() {\n  // 根据输入的历史人物\n\
  \  // 在维基百科中打开链接\n  if (document.getElementById(\"name\").value != \"\")\n    window.location\
  \ = \"http://en.wikipedia.org/wiki/\" +\n      encodeURIComponent(document.getElementById(\"\
  name\").value);\n}\n```\n\n这里的想法是让应用程序对输入的历史人物执行有意义的操作。因此，`showBiography()` 函数获取历史人物（文本框的内容）并用它构建维基百科在线的\
  \ URL。该 URL 的格式如下：[`en.wikipedia.org/wiki/Thomas_Edison`](http://en.wikipedia.org/wiki/Thomas_Edison)\n\
  \n\n\n\nCompleter 应用的服务端包含一个名为 `completer.php` 的 PHP 服务器脚本。该脚本不仅负责接收请求并响应补全，还作为可能补全列表的数据存储库。我在本章前面的部分提到过，这个列表可能存储在真正的数据库中更好，特别是对于使用大型补全列表的应用而言，但为了简单起见，该列表在本应用程序的\
  \ PHP 脚本中运行良好良好。\n\n以下是 `completer.php` 服务器脚本的简略代码：\n\n```php\n<?php\n$people =\
  \ array(\n  \"Abraham Lincoln\",\n  \"Adam Smith\",\n  \"Adolf Hitler\",\n  \"Albert\
  \ Einstein\",\n  \"Alexander Fleming\",\n  \"Alexander Graham Bell\",\n  \"Alexander\
  \ Hamilton\",\n  \"Alexander the Great\",\n  \"Alfred T. Mahan\",\n...\n  \"William\
  \ Harvey\",\n  \"William Shakespeare\",\n  \"William T.G. Morton\",\n  \"William\
  \ the Conqueror\",\n  \"Willis Haviland Carrier\",\n  \"Woodrow Wilson\",\n  \"\
  Ziryab\"\n);\n$input = strtolower($_GET['input']);\n$inputLen = strlen($input);\n\
  \nif ($inputLen > 0) {\n  for ($i = 0; $i < count($people); $i++) {\n    if (strtolower(substr($people[$i],\
  \ 0, $inputLen)) ==\n      $input) {\n      echo substr($people[$i], $inputLen,\n\
  \        strlen($people[$i]) - $inputLen);\n      break;\n    }\n  }\n}\n?>\n```\n\
  \n此脚本中最重要的代码是历史人物数组，它以字母顺序排列的引号名称列表的形式列出。注意每个名称都用逗号隔开，且整个列表包含在括号内。这是 PHP 数组的标准格式，我指出这一点是为了让你知道在修改补全列表或创建自己的列表时要保持这种格式。\n\
  \nCompleter 应用的一个我尚未提到的细微细节是它并不关心用户输入的大小写。换句话说，如果你输入 `tho`、`Tho` 或 `tHo`，它都会匹配 `Thomas\
  \ Edison`。负责此操作的代码是补全列表下方调用标准 `strtolower()` 函数的第一行。\n\n服务器脚本中的剩余代码承担的任务是逐个搜索补全列表，寻找与输入文本的匹配项。如果找到匹配项，则将其输出到客户端，脚本结束。这是一个重要的细节，它揭示了为什么补全列表必须按字母顺序排列——输入文本的第一个匹配项总是返回的。因为第一个匹配总是获胜，获得一致结果的唯一方法是对列表进行字母排序。在本章稍后的位置，我提供了一个小技巧，你可以使用\
  \ Microsoft Word 自动对列表进行字母排序——如果你有一个巨大且无序的列表，这非常有帮助。\n\n现在你已经把应用程序的两个部分组合在了一起，所以是时候进入最有趣的开发阶段了：测试！\n\
  \n## 测试 Completer\n\nCompleter 应用在测试方面来说非常简单，因为你只需要开始输入并观察会发生什么。图 6.6 显示了在文本框中输入字符\
  \ `C` 后应用程序。\n\n![在 Completer 应用的文本框中输入单个字符会导致尝试补全。](img/06fig07.jpg)\n\n**图 6.6.\
  \ 在 Completer 应用的文本框中输入单个字符会导致尝试补全。**\n\n找到第一个以 `C` 开头的历史人物是 Charlemagne（查理曼），在图中显而易见。因为补全文本会自动选中，如果该名称不是正确的匹配项，你可以继续输入。继续输入字符\
  \ `o`，正如你预期的那样，得到了不同的名称（参见图 6.7）。\n\n![随着你继续输入字符，应用程序继续寻找补全的最佳匹配项。](img/06fig08.jpg)\n\
  \n**图 6.7. 随着你继续输入字符，应用程序继续寻找补全的最佳匹配项。**\n\n啊，孔子说这就是我想要的名字，所以我停止输入并点击“了解更多”（Learn\
  \ More）按钮来获取更多关于这位中国哲学家的信息。\n\n只需点击按钮，在自动修正功能的帮助下就能获得关于你输入的名称的人的丰富信息。Completer 应用的\
  \ Wikipedia 部分在任何方面都不至关重要，但它确实增添了一点实用的趣味。\n\n## 为 Completer 进行一次极端的 Ajax 改造\n\n\
  Completer 应用是书中适用最广泛的示例之一，因为它可以应用于几乎任何文本输入，只要某种程度上能够预测用户可能输入什么。当你考虑在自己的页面上使用自动补全功能时，关键是要隔离足够可预测并可以用单词或短语列表进行建模的文本输入，但又不能如此预测以至于选择列表更符合你的需求。\n\
  \n作为自动补全可能过于设计的例子，请考虑帮助用户输入美国的一个州的例子。由于美国州的列表是有限且相对较小的，让用户直接从州列表中进行选择可能更有意义。另一方面，你可能想使用自动补全来帮助某人输入宠物的名字。虽然这最终可能是自动补全的一个可行应用，但可能名称的列表如此巨大且开放，因此可能不值得尝试。这一点在于，自动补全确实是一个非常有用的用户输入工具，但在假设使用自动补全是合理的之前，你应该考虑具体的输入类型。\n\
  \n在完成这段小段抱怨后，让我说你对 Completer 应用应该尝试的第一件事是完全更换列表。考虑其他一些帮助用户会很酷的文本输入场景。然后更改 `completer.php`\
  \ 服务器脚本中的数据集；只需确保列表保持按字母顺序排列。应用程序将立即开始使用你的新补全列表尝试自动补全文本。\n\n### 提示\n\n![提示](img/tip.jpg)\n\
  \n如果你正在为 Completer 应用构建单词和/或短语列表，而它们尚未按字母顺序排列，我有一个小技巧可以节省你的时间和精力的。你需要访问 Microsoft\
  \ Word，但考虑到现在 Microsoft Office 的普及程度，这应该不会太困难。在 Word 中创建一个新文档，然后将你的补全列表复制粘贴进去。选择所有补全项，然后点击\
  \ Word 菜单上的“表格”。然后从表格菜单中选择“排序”。会出现一个对话框。确保选择了“升序”单选框，然后点击“确定”。完成！你的列表现在按字母顺序排序了。\n\
  \n\n\n\n此示例 URL 搜索文本“tony hawk”，这将找到许多关于职业滑板运动员 Tony Hawk 的匹配项。注意，使用加号（`+`）来分隔姓和名。你必须将搜索词中的任何空格替换为\
  \ `+`。\n\n你所剩下的的任务是将页面重定向到 Google URL。假设你的应用程序中的文本输入控件仍然像 Completer 那样样具有 ID `name`，以下代码将获取输入文本，将其空格转换为加号（`+`），构建\
  \ Google 搜索 URL，并将浏览器重定向到该地址：\n\n```\nvar searchText = document.getElementById(\"\
  name\").value.replace(  \" \", \"+\");\nwindow.location = \"http://www.google.com/search?q=\"\
  \ + searchText;\n```\n\n这就是将自动补全上下文敏感文本字段输入转换为 Google 搜索所需的全部代码。\n\n## 总结\n\n本章为你日益快速扩展的技巧宝箱增添了一项极其实用的\
  \ Ajax 技术。Completer 应用非常专注且简单，因为它只适用于文本控件，但如果使用得当，它在 Web 页面的易用性方面会产生惊人的效果。你可以完全忽略自动补全建议并继续输入，这一事实意味着如果补全建议恰好没有帮助，它也不会产生干扰。这是许多\
  \ Ajax 技术的共同点，也是在你自己的页面中注入 Ajax 时应该始终记住的一点。\n\n## 第 7 章：创建具有实时验证的响应式 GUI\n\n###\
  \ Ajax 清洁剂\n\n![Ajax the Cleanser](img/note.jpg)\n\n你早迟会发现它的，那为什么要再等呢？也许 Ajax 这个术最广为人知的用法是高洁施施民公司（Colgate-Palmolive）在\
  \ 1947 年推出的全能清洁剂。该清洁剂以强大的希腊英雄 Ajax 命名，这促成了 Ajax 产品的口号：“比污垢更强！”\n\nAjax 真正的杀手级应用之一是实时用户输入验证，这意味着用户在输入数据时，系统会对数据的有效性进行检查。这可以极大提高用户界面的效率，因为错误在产生时就会被捕获，从而消除了提交整个表单来检查是否存在问题的需要。此外，当应用程序对数据输入提供即时反馈时，感觉会更智能。事实证明，许多实时验证技巧在技术上并不需要\
  \ Ajax，但在某些需要从服务器加载数据作为验证一部分的实例中，它仍然发挥着作用。\n\n本章深入探讨实时验证，并探索何时以及何地在你自己的应用程序中注入此类功能是合理的。你还将暂时离开\
  \ Ajax，学习如何验证电话号码、日期和电子邮件地址等常用数据类型。随后，当你处理一个涉及邮政编码验证的实用示例时（该示例会实时查询相应的城市和州），Ajax\
  \ 将再次回到用场。这是一个极其实用的 Ajax 技巧，你可以用它显著简化位置/地址信息的输入。\n\n本章中的 Validator 应用使用了以下文件，它们位于随书附带的\
  \ Linux 刻光盘的 `chap07` 示例代码文件夹中：\n\n*   `validator.html`—主 Web 页面\n*   `ziplookup.php`—根据邮政编码查找城市/州的服务器脚本\n\
  *   `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n*   `domkit.js`—Ajax Toolkit 的 DOM 相关函数\n\
  *   `validatekit.js`—Ajax Toolkit 的验证函数\n*   `wait.gif`—在 Ajax 请求期间显示的动画“加载”图标\n\
  \n### 挑战：实时检查用户输入\n\n本章提出的挑战非常广泛——通过在产生输入错误的地方立即消除它们，提高从用户那里获取信息的效率。如果你使用像 Microsoft\
  \ Word 这样具有实时拼写检查器的文字处理器，你就能理解此功能有多方便了。在许多方面，上一章中的自动补全应用可以被认为大致类似于一个实时验证器。然而，自动补全更多是关于提高效率，而不是纠正错误，尽管这两个任务往往是辅相成的。\n\
  \n要查看验证器的实际运行，请访问 Google 的 Gmail 在线邮件服务：[`http://mail.google.com/`](http://mail.google.com/)。Gmail\
  \ 中的邀请功能允许你向朋友发送加入 Gmail 的邀请。邀请请求需要朋友的电子邮件地址，这正是你应该在文本框中输入的内容。电子邮件地址格式不当会导致 Gmail\
  \ 在电子邮件地址文本框正下方显示“无效地址”消息。\n\nGmail 在验证方面不像某些 Ajax 应用程序那样激进，这一点体现在你必须在 Gmail 执行验证之前得先点击“发送邀请”（Send\
  \ Invite）按钮。更激进的方法将会在用户离开电子邮件文本框时立即对地址进行验证。这种方法通常用于 Ajax 应用，并且在大多数情况下被视为一种改进，因为它可以在无效数据输入一完成后立即阻止它。\n\
  \n现代用户输入验证方法的通用思想是消除为了查看数据是否有效而刷新页面的需要。在许多情况下，你可以消除整个访问服务器的过程，并完全在客户端内部执行验证。严格来说，如果不涉及服务器，这种验证就不是真正在使用\
  \ Ajax。然而，应用程序的“Ajax 感觉”这种概念仍然可以通过客户端验证获得。本章的挑战既涉及纯客户端验证也涉及真正的 Ajax 验证。\n\n说到挑战，本章并没有专注于完成一项核心任务，而是侧重于演示如何验证不同的用户输入。当然，可以构思涉及数字、日期、电子邮件地址、电话号码和邮政编码的示例，但额外的开销会分散对验证数据的关注注意力。因此，Validator\
  \ 应用的挑战在于简单的展示几个用户输入文本框，每个框关联一种特定的数据类型，并在用户浏览界面时实时对每一个进行验证。\n\n以下是 Validator 应用针对的数据类型：\n\
  \n*   整数\n*   数字\n*   电话号码\n*   电子邮件地址\n*   日期\n*   邮政编码\n\n验证的关键不仅仅是弹出一个烦人的警告框来告诉用户他的输入是错误的。事实上，警告框是通知用户输入问题的糟糕方式。更好的方法是在表单上悄悄提供帮助字段，这些字段只有在发生验证问题时可见，此时为用户显示帮助文本。例如，当用户输入无效日期时，你可能会显示帮助文本：\n\
  \n```\n\"请输入日期（例如，01/14/1975）。\"\n```\n\n当数据错误时，帮助文本会出现，一旦数据修复，它就会神奇消失。\n\n当然，“魔法”在于支持帮助文本功能的验证代码。这些代码是\
  \ `validatekit.js` 文件的一部分，该文件作为 Ajax Toolkit 包含在书中，也是 Validator 示例应用程序源代码的一部分。正如在第\
  \ 2 章 中最初提到的，`validatekit.js` 文件提供了许多你可以用于验证不同数据的 JavaScript 函数。具体来说，`validatekit.js`\
  \ 文件暴露了以下用于验证用户输入数据的 JavaScript 函数：\n\n*   `validateNonEmpty()`—数据是否为空？\n\n\n\n\n\
  \n*   `validateInteger()`—数据是有效的整数吗？\n*   `validateNumber()`—数据是有效的数字吗？\n*   `validateZipCode()`—数据是有效的邮政编码吗？\n\
  *   `validatePhone()`—数据是有效的电话号码吗？\n*   `validateEmail()`—数据是有效的电子邮件地址吗？\n*   `validateDate()`—数据是有效的日期吗？\n\
  \n如你所见，这些函数恰好与 Validator 应用程序所针对的数据类型完美匹配。这意味着挑战变得简单得多了，因为你现在有了标准的 JavaScript 函数可以用来验证每种数据类型。挑战的主要挑战变成了弄清楚如何将这些函数连接到\
  \ Validator 页面上的 HTML 元素上，以便文本框中的数据能够正确地路由到 JavaScript 函数中。此外，你还需要为每个文本框创建 HTML\
  \ 元素来显示帮助文本，以便验证函数可以显示帮助文本。\n\n到此时，你可能在想 Ajax 到底在 Validator 的公式中处于什么位置，答案是它并不在其中……至少目前还没有。该应用程序针对的所有数据类型都可以在客户端完美地验证，不需要服务器的任何帮助。或者至少数据的格式可以在客户端进行验证。邮政编码数据有一点特殊，因为你可以在客户端验证邮政编码的格式（例如，正好是五个数字），但你不知道该邮政编码在现实世界是否真实有效。换句话说，这个邮政编码是否真的在使用中？\n\
  \n检查邮政编码有效性的唯一方法是在真实的邮政编码数据库中查找它，看它是否确实真实。这个数据库能够告诉你 90210 确实是一个真实的邮政编码，它代表加州的比弗利山山区（Beverly\
  \ Hills, CA）。事实证明，这样的数据库已经存在，并且可以通过 Ajax 请求访问。更好的是，大多数可以以 XML 格式为你提供数据，使其在你的 Ajax\
  \ 代码中容易排序。因此，Ajax 通过查询邮政编码对应的城市和州进入了 Validator 应用程序，以验证该邮政编码的真实性。\n\n所以，现在你有了一个相当完整的验证挑战，涉及到若干个客户端数据验证，以及一个涉及邮政编码及其相应城市和州的真实\
  \ Ajax 验证。你现在可以将注意力转移到 Validator 应用程序的设计上。\n\n## 设计：设计一个验证应用程序\n\nValidator 应用程序的设计希望比书中其他一些应用程序更直观一些，主要因为离散的用户输入数据是相互独立进行验证的。你的设计工作基本上只是为每个用户输入文本框调用相应的\
  \ `validatekit.js` 验证函数。然后是 Ajax 请求，它通过 Web 服务查询城市和州，为邮政编码提供额外层级的验证。\n\n图 7.1 显示了应用程序用户界面的大致解释，揭示了帮助字段是如何排列在每个输入文本框旁边的。\n\
  \n![Validator 应用程序的用户界面由多个文本框及其相关的帮助文本字段组成。](img/07fig02.gif)\n\n**图 7.1. Validator\
  \ 应用程序的用户界面由多个文本框及其相关的帮助文本字段组成。**\n\n你可以从图中看到每个文本框是如何与特定类型的数据相关的，例如电话号码、电子邮件地址等。每个文本框旁帮助字段用于传达有关该文本框内数据有效性的帮助信息。唯一的例外是邮政编码的帮助字段，它兼具通过\
  \ Ajax 请求检索的城市和州显示字段的功能。\n\n提到邮政编码字段的 Ajax 请求，如果能显示一个动画“加载”图像，让用户知道应用程序正在根据邮政编码查找城市和州，将非常方便。此图像\
  \ `wait.gif` 显示在图 7.2 让用户知道 Ajax 请求正在处理中。\")。\n\n![Validator 应用程序使用动画“加载”图像 (wait.gif)\
  \ 让用户知道 Ajax 请求正在处理中。](img/07ack03.jpg)\n\n**图 7.2. Validator 应用程序使用动画“加载”图像 (`wait.gif`)\
  \ 让用户知道 Ajax 请求正在处理中。**\n\n“加载”图像显示在持有邮政编码帮助文本的同一个字段中，我想该字段实际上承担了三重职责。在输入邮政编码的过程中，以下三条信息可以在不同的时间出现在邮政编码的帮助字段中：\n\
  \n*   当邮政编码无效时，显示帮助文本。\n*   在执行 Ajax 请求时，显示“加载”图像。\n*   在 Ajax 请求成功后，显示动态加载的城市和州。\n\
  \n这看起来在邮政编码及其辅助字段上发生了很多事情，但 Validator 应用程序处理这一切时并不算复杂。请记住，该应用程序实际上只处理了一个 Ajax 请求，这有助于简化问题。你现在准备好学习更多关于邮政编码\
  \ Ajax 请求的内容。\n\n### 客户端请求\n\nValidator 应用程序的客户端请求非常基础，就是在邮政编码输入控件失去焦点时发送邮政编码。这种方法与第\
  \ 6 章 中的 Completer 应用程序不同，后者在每输入一个字符后都会发出 Ajax 请求。逐个字符的请求技术对于 Validator 来说没有意义，因为输入一段有意义的数据需要多次按键——你必须等待用户完成数据输入。用户完成在邮政编码控件中输入数据的信号，是他们通过\
  \ Tab 键离开或点击此处离开控件时。\n\n一旦用户离开了邮政编码文本框，你就可以将输入作为 Ajax 请求的一部分发送。这些用户输入只是没有特殊格式的原始文本字符。已经执行的整数验证确保了邮政编码文本由五个整数组成，但在某种意义上，该文本仍被视为未格式化的，因为它没有被编码为\
  \ XML 或其他标准数据格式。\n\n### 注意\n\n![注意](img/note.jpg)\n\n我意识到还有一种形式为 `#####-####` 的长邮政编码格式，这可能出现在这里。为了保持简单，我选择坚持使用基本的五位邮政编码，其格式为\
  \ `#####`。\n\n关于从客户端发送到服务器进行邮政编码查询的最少数据，你只需要知道这些。现在让我们处理服务器返回的内容。\n\n### 服务器响应\n\
  \n\n\n\nValidator 应用程序中的 Ajax 服务器响应返回了请求中发送的邮政编码信息。此响应间接接收自第三方 Web 服务 `webserviceX.net`，该服务提供多种\
  \ XML 格式的便捷数据馈。在这种情况下，`webserviceX.net` 服务使用邮政编码来查找并返回匹配的城市、州、区号和时区。由于 Validator\
  \ 应用程序中只需要城市和州，因此你可以忽略区号和时区。响应数据格式化为 XML 代码，这一事实使得访问你所需的特定数据变得非常容易。\n\n你可能在早早的一些应用程序中记得，你无法对第三方域名发起\
  \ Ajax 请求。因此，技巧是通过从服务器脚本发起第三方数据请求，然后使用 Ajax 从位于你服务器上的该脚本获取数据，从而缓解这种安全限制。这是因为从服务器脚本请求数据并不存在安全问题。因此，Validator\
  \ 应用程序需要包含一个 PHP 服务器脚本，该脚本充当向 `webserviceX.net` 服务发送邮政编码请求的代理。\n\n### 理解客户端到服务器的对话\n\
  \nValidator 应用程序中的 Ajax 请求用于将用户输入的邮政编码传输到服务器，然后返回城市和州。图 7.3 有助于直观地澄清这种数据传输。\n\n\
  ![Validator 应用程序涉及未格式化的邮政编码和格式化的城市及州数据在客户端和服务器之间往返。](img/07fig04.gif)\n\n**图 7.3.\
  \ Validator 应用程序涉及未格式化的邮政编码和格式化的城市及州数据在客户端和服务器之间往返。**\n\n作为 Ajax 请求的参数发送到服务器的数据是用户输入的邮政编码。邮政编码已经通过了格式验证，但尚未检查它是否真的匹配某个城市和州。邮政编码请求由\
  \ `ziplookup.php` 服务器脚本处理。以下是一个 Ajax 请求 URL 的示例，它将邮政编码 85250 作为唯一参数发送到服务器脚本：\n\n\
  ```\nziplookup.php?zipCode=85250\n```\n\n此代码揭示了邮政编码如何被封装成 URL 中的单个参数 (`zipCode`)。整个\
  \ URL 被用作 Ajax 请求的基础，在这种情况下，你的服务器脚本 `ziplookup.php` 将获取 `zipCode` 参数并使用其包含的 URL\
  \ 获取城市和州信息。\n\n城市和州数据以紧凑的 XML 文档返回，假设邮政编码成功匹配，该文档实际上包含了该邮政编码的城市、州、区号和时区。以下是此类 XML\
  \ 文档实际的的示例：\n\n```xml\n<NewDataSet>\n  <Table>\n    <CITY>Scottsdale</CITY>\n  \
  \  <STATE>AZ</STATE>\n    <ZIP>85250</ZIP>\n    <AREA_CODE>602</AREA_CODE>\n   \
  \ <TIME_ZONE>M</TIME_ZONE>\n  </Table>\n</NewDataSet>\n```\n\n即使你不是 XML 专家，这段代码也并不难理解。你实际上只感兴趣\
  \ `<CITY>` 和 `<STATE>` 标签，因为它们包含了该邮政编码的城市和州。剩下的任务是在客户端从这些数据中提取城市和州。\n\n## 整合 Validator\
  \ 应用程序\n\n除了包括 `validatekit.js` 在内的标准工具包 JavaScript 文件外，Validator 应用程序仅包含两个组件：\n\
  \n*   HTML Web 页面 (`validator.html`)\n*   PHP 服务器脚本 (`ziplookup.php`)\n\n当然，应用程序中的另一个主要成分是负责根据邮政编码提供城市/州数据的第三方位置\
  \ Web 服务。虽然该服务是应用程序的重要部分，但它不需要除了 HTML Web 页面中启动 Ajax 请求的代码以及 PHP 服务器脚本中处理将响应传回页面的代码之外的独立组件。这种安排是必要的，因为\
  \ Ajax 请求不允许直接访问位于其他域的资源。\n\n接下来的几个章节将详细探讨 Validator Web 页面和服务器脚本，以完全理解应用程序的工作原理。\n\
  \n### Validator Web 页面\n\nValidator 应用程序的 HTML Web 页面 `validator.html` 由一系列文本框输入字段组成，每个字段旁边都有一个非输入文本字段，作为帮助消息的显示区域。文本框被创建为\
  \ `input` 元素，而帮助消息字段被创建为 `span` 元素。图 7.4 显示了在 Web 浏览器中打开的 Validator 应用程序，空白文本字段已准备好供用户输入，所有帮助消息都指示字段缺失数据。\n\
  \n![Validator Web 页面由一系列文本框输入控件和随后的文本显示区域组成。](img/07ack05.jpg)\n\n**图 7.4. Validator\
  \ Web 页面由一系列文本框输入控件和随后的文本显示区域组成。**\n\n### 注意\n\n![注意](img/note.jpg)\n\n应用程序最初不会如图所示那样显示帮助消息。相反，“请输入一个值。”这一帮助消息直到你在不输入任何内容的情况下离开输入控件时才会出现。根据图中所示的\
  \ Validator 应用程序布局，请查看 Web 页面主体的 HTML 代码：\n\n```html\n<body onload=\"document.getElementById('something').\"\
  >\n  <div id=\"ajaxState\" style=\"display:none; font-style:italic\">\n  </</div>\n\
  \  <br />\n  <div>\n    Enter something:\n    <input id=\"something\" type=\"text\"\
  \ size=\"32\" onblur=\"validateNonEmpty(this,\n      document.getElementById('something_help'))\"\
  \ />\n    <span id=\"something_help\" class=\"help\"></span>\n  </div>\n  <div>\n\
  \    Enter an integer:\n    <input id=\"integer\" type=\"text\" size=\"32\" onblur=\"\
  validateInteger(this,\n      document.getElementById('integer_help'))\" />\n   \
  \ <span id=\"integer_help\" class=\"help\"></span>\n  </div>\n  <div>\n    Enter\
  \ a number:\n    <input id=\"number\" type=\"text\" size=\"32\" onblur=\"validateNumber(this,\n\
  \      document.getElementById('number_help'))\" />\n    <span id=\"number_help\"\
  \ class=\"help\"></span>\n  </div>\n  <div>\n    Enter a phone number:\n    <input\
  \ id=\"phone\" type=\"text\" size=\"32\" onblur=\"validatePhone(this,\n      document.getElementById('phone_help'))\"\
  \ />\n    <span id=\"phone_help\" class=\"help\"></span>\n  </div>\n  <div>\n  \
  \  Enter an email address:\n    <input id=\"email\" type=\"text\" size=\"32\" onblur=\"\
  validateEmail(this,\n      document.getElementById('email_help'))\" />\n    <span\
  \ id=\"email_help\" class=\"help\"></span>\n  </div>\n  <div>\n    Enter a date:\n\
  \    <input id=\"date\" type=\"text\" size=\"32\" onblur=\"validateDate(this,\n\
  \      document.getElementById('date_help'))\" />\n    <span id=\"date_help\" class=\"\
  help\"></span>\n  </div>\n  <div>\n    Enter a ZIP code:\n    <input id=\"zipcode\"\
  \ type=\"text\" size=\"16\"\n      onblur=\"if (validateZipCode(this,\n        document.getElementById('zipcode_help')))\n\
  \        getCityState(this.value);\" />\n    <span id=\"zipcode_help\" class=\"\
  help\"></span>\n  </div>\n</body>\n```\n\n\n\n\n通过 `onload` 事件处理程序将焦点设置到页面上的第一个文本框后，页面主体将开始创建每个文本框\
  \ `input` 及其相关的帮助消息 `span` 节点。这段代码中没有特别寻常的地方，除了 `onblur` 事件处理程序，该程序会在输入焦点离开输入控件时被调用。因此，当用户通过按键切换\
  \ `Tab` 键离开文本框或点击页面上的其他地方时，文本框会接收到一个 `onblur` 事件通知。这时你可以调用一个函数来验证文本框中的输入值。\n\n`Validator`\
  \ 应用程序中负责验证的函数都是 `validatekit.js` Ajax 工具包文件的一部分，该文件必须通过以下代码导入到 Web 页面（放置在页面的 `head`\
  \ 标签中）：\n\n```\n<script type=\"text/javascript\" src=\"validatekit.js\"> </script>\n\
  ```\n\n该文件提供的每个函数都接受相同的两个函数参数：\n\n*   包含待验证值的输入控件\n*   用于显示帮助文本的帮助控件\n\n要查看这些参数是如何传递到验证函数的，请查看调用整数验证函数的代码：\n\
  \n```\nvalidateInteger(this, document.getElementById('integer_help'))\n```\n\n由于该函数是在整数文本框的范围内调用的，你可以将\
  \ `this` 作为第一个参数传递给函数。第二个参数则使用标准的 `getElementById()` 函数指定，以获取整数帮助控件，其 ID 为 `integer_help`。\n\
  \n如果你仔细观察页面上的帮助控件，可能会发现每个 `span` 元素都被样式化为一个名为 `help` 的 CSS 样式类。该样式类仅将字体颜色改为红色（`#FF0000`）并将字体样式设置为*斜体*（italic），这使得帮助消息在页面上更加突出。以下是\
  \ `Validator` Web 页面内部样式表的代码，其中包含了 `span.help` 样式类：\n\n```\n<style type=\"text/css\"\
  >\n  div { padding-bottom:5px; }\n  span.help { color:#AA0000; font-style:italic;\
  \ }\n</style>\n```\n\n样式表中包含了一个全局 `div` 样式，完全是为了在页面上的输入控件之间提供少量的垂直间距。\n\n尽管 `Validator`\
  \ 内部样式表有助于让页面看起来更好一点，但在 Ajax 方面并没有太大帮助。为 `Validator` 启动 Ajax 请求的代码位于邮政编码文本框的 `onblur`\
  \ 事件处理程序中。虽然这段代码在你刚刚看到的列表里，但如果将其从 `onblur` 属性中提取出来会更容易理解：\n\n```\nif (validateZipCode(this,\n\
  \  document.getElementById('zipcode_help')))\n  getCityState(this.value);\n```\n\
  \n这段代码首先验证邮政编码输入数据，检查其是否确实是一个五位数字。这是通过调用 `validateZipCode()` 函数实现的。函数的返回值指示数据是有效（`true`）还是无效（`false`）。如果数据有效，则调用\
  \ `getCityState()` 函数启动 Ajax 请求。以下是该函数的代码：\n\n```\nfunction getCityState(zipCode)\
  \ {\n  // 显示等待图像\n  document.getElementById(\"zipcode_help\").innerHTML =\n    \"\
  <img src='wait.gif'\n    alt='Looking up ZIP code...' />\";\n\n  // 发送 Ajax 请求加载城市/州\n\
  \  ajaxSendRequest(\"GET\", \"ziplookup.php?zipCode=\" + zipCode,\n    handleCityStateRequest);\n\
  }\n```\n\n啊，你终于看到了让这个应用程序看起来很酷的魔法。`getCityState()` 函数的第一个任务是在邮政编码帮助控件中显示动画“加载”图像\
  \ `wait.gif`。该图像将一直显示，直到 Ajax 请求完成，从而给用户一个视觉提示，表明后台正在发生操作。\n\n`getCityState()` 函数的第二个任务是实际提交\
  \ Ajax 请求，这涉及到将邮政编码封装成用于 `ziplookup.php` 服务器脚本的 URL。`handleCityStateRequest()` 函数被指定为邮政编码\
  \ Ajax 请求处理器。以下是它的代码：\n\n```\nfunction handleCityStateRequest() {\n  if (request.readyState\
  \ == 4 && request.status == 200) {\n    // 存储 XML 响应数据\n    var xmlData = request.responseXML;\n\
  \n    // 显示城市/州结果\n    if (xmlData != null &&\n      getText(xmlData.getElementsByTagName(\"\
  CITY\")[0]) != \"\")\n      document.getElementById(\"zipcode_help\").innerHTML\
  \ =\n        \"<span style='font-weight:bold'>\" +\n        getText(xmlData.getElementsByTagName(\"\
  CITY\")[0]) +\n        \", \" +\n        getText(xmlData.getElementsByTagName(\"\
  STATE\")[0]) +\n        \"</span>\";\n    else\n      document.getElementById(\"\
  zipcode_help\").innerHTML =\n        \"Could not find the ZIP code.\";\n  }\n  ajaxUpdateState();\n\
  }\n```\n\n该函数在 Ajax 请求完成后调用，其工作是从响应数据中提取城市和州，并将它们显示在页面上替换“加载”图像。城市/州数据的提取离助于 `getText()`\
  \ Ajax 工具包函数的帮助，该函数位于 `domkit.js` 文件中。注意元素名 `CITY` 和 `STATE` 被用作访问城市和州的依据。不仅提取了这些数据，还使用\
  \ HTML 进行了格式化。如果一切顺利，生成的 HTML 如下：\n\n<span style='font-weight:bold'>Scottsdale,\
  \ AZ</span>\n\n注意对城市和州应用了内联样式，以便与普通帮助文本区分。如果从服务器返回的 XML 数据有问题，则会显示帮助消息提示找不到邮政编码。\n\
  \n`Validator` 页面的代码到此结束。剩下的就是快速查看负责传递邮政编码的脚本。\n\n### 邮政编码查询脚本\n\n与第 4 节中的 Picker\
  \ 应用类似，`Validator` 需要服务器端脚本来绕过无法向第三方域名直接请求的限制。第三方域名很重要，因为 `Validator` 应用程序依赖它来查询代码。`Validator`\
  \ PHP 脚本充当安全代理，代表客户端接受 Ajax 请求，从第三方服务器检索城市/州数据，然后将数据响应给客户端。通过这种方式，Ajax 请求是在自己的域名上进行的，这对于\
  \ Ajax 的安全限制是完全可以接受的。\n\n我提到的第三方 Web 服务是 `webservice.net`，它提供了多个基于 XML 的数据馈。第 4\
  \ 节中的 Picker 应用使用该服务获取实时股票报价，而 `Validator` 则使用它获取有关邮政编码的详细信息。\n\n\n\n\n请记住，此脚本的作用是从\
  \ `webserviceX.net` 的邮政编码 Web 服务检索 XML 文档，然后简单将这些数据传递给客户端，而不进行任何修改。随后，由客户端对 XML\
  \ 代码进行某些有用的处理，例如在页面上显示城市和州。\n\n服务器脚本首先确保响应被处理为 XML。然后，它从邮政编码 Web 服务加载 XML 文档，并确保传递\
  \ `zipCode` 参数，以便 Web 服务知道要查询哪个邮政编码。脚本通过返回脚本中的 XML 数据结束，这将作为 Ajax 邮政编码请求的响应。\n\n\
  虽然我确定你已经等不及要测试应用程序了，但让我们花时间单独测试一下 PHP 脚本。你已经在前面的章节中看到如何直接在浏览器中打开 PHP 脚本来完成操作的——这里有一个测试\
  \ `ZIPLookUp` 脚本的示例 URL：\n\n```\nhttp://www.yourdomain.com/ziplookup.php?zipCode=94965\n\
  ```\n\n假设 `ziplookup.php` 文件存储在你的服务器上，请更改此行代码中的域名以匹配你的域名，然后将 URL 输入到 Web 浏览器中。图\
  \ 7.5 显示了由 PHP 脚本生成的 XML 响应数据。\n\n![你可以直接在浏览器中打开脚本来检查 ZIPLookUp PHP 脚本返回的 XML 邮政编码信息。](img/07ack06.jpg)\n\
  \n**图 7.5。你可以直接在浏览器中打开脚本来检查 ZIPLookUp PHP 脚本返回的 XML 邮政编码信息。**\n\n非常值得尝试通过 URL 向脚本传递邮政编码，看看它们如何影响返回的\
  \ XML 数据。你应该始终直接测试 PHP 脚本，以确保其结果与你的预期一致——当你只看客户端 页面时，诊断服务器脚本问题要困难得多。\n\n## 测试验证器\n\
  \n验证器（Validator）应用程序提供了一个有趣的测试机会，因为在检查验证有效性时，你有几个不同的数据字段可以进行调整。你会发现，随着页面向下移动，数据类型往往变得越来越复杂。通过在任何输入控件中留空或输入无效数据，然后按\
  \ Tab 键离开控件，就可以轻松生成帮助消息。图 7.6 显示在无效整数数据旁边显示了一个帮助消息。\n\n![输入无效数据然后离开输入控件会导致在控件旁边显示帮助消息。](img/07ack07.jpg)\n\
  \n**图 7.6。输入无效数据然后离开输入控件会导致在控件旁边显示帮助消息。**\n\n当然，文本“more data”（更多数据）并不恰恰构成一个有效的整数，这解释了图中的帮助消息。\n\
  \n当你尝试向更复杂的类型（例如日期输入控件）中输入数据时，事情会变得更有趣了。图 7.7 显示了在响应一个几乎有效的日期时显示的的无效日期消息。\n\n![日期输入控件非常擅长检测错误的日期。](img/07ack08.jpg)\n\
  \n**图 7.7。日期输入控件非常擅长检测错误的日期。**\n\n显然，1 月只有 31 天，因此在该示例中，涉及每月第 32 日的日期是无效的。验证器应用程序捕捉了输入错误并显示了帮助消息。\n\
  \n尽管日期验证很有用，但验证器应用程序最有趣的部分是邮政编码查询，这是在你向邮政编码输入控件中输入邮政编码并离开控件时执行的。图 7.8 显示了在执行邮政编码\
  \ Ajax 请求时显示的动态“加载”图像。\n\n![显示“加载”图像代替帮助消息，以告知用户正在查询邮政编码。](img/07ack09.jpg)\n\n\
  **图 7.8。显示“加载”图像代替帮助消息，以告知用户正在查询邮政编码。**\n\n是的，我知道，我无法忍住不使用地球上最流行的邮政编码来测试应用程序。如果通过\
  \ Ajax 请求成功检索了邮政编码数据，结果中的城市和州将显示在“加载”图像的位置，如图图 7.9 所示。\n\n![成功的邮政编码 Ajax 请求会导致输入控件旁边显示相关的城市和州。](img/07ack10.jpg)\n\
  \n**图 7.9。成功的邮政编码 Ajax 请求会导致在输入控件旁边显示相关的城市和州。**\n\n成功固然很好，但当未找到邮政编码时会发生什么？如果在应用程序代码中回，会显示帮助消息来指示这一点。图\
  \ 7.10 显示了响应未与真实城市和州关联的邮政编码的帮助消息。\n\n![没有真实世界城市和州的邮政编码会显示未找到的帮助消息。](img/07ack11.jpg)\n\
  \n**图 7.10。没有真实世界城市和州的邮政编码会显示未找到的帮助消息。**\n\n需要注意的是，未找到的邮政编码在严格的数据输入意义上并不一定是无效的。是的，它在现实世界中未使用（如果你正在输入收货地址，这是一个问题），但并不意味着它将来不会真实。邮政编码不是刻在石头上的，事实上，它们在快速发展的地区经常新建。这就是依赖第三方服务来处理邮政编码查询的魅力所在——它负责更新其邮政编码数据库，而不是你。\n\
  \n无论你如何处理现实世界未使用的问题，希望你能看到验证器应用程序为数据验证奠定了重要的基础，你可以以各种方式重新利用。\n\n## 为验证器进行极致 Ajax\
  \ 改造\n\n验证器应用程序是书中最直接应用的示例之一，因为智能数据输入是一个常见需求。`validatekit.js` 文件为输入表单中常用的数据类型提供了函数。扩展验证器示例的第一种是将验证函数应用到你自己的用户输入表单。通过以下\
  \ `<script>` 标签将 `validatekit.js` 文件导入你的页面即可：\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"validatekit.js\"> </script>\n```\n\n然后通过调用适当的验证函数并传递 HTML 元素的 ID 来编写用于验证的\
  \ HTML 元素。例如，如果你想验证人的年龄以确保它是一个整数，你可能会创建以下文本框和帮助字段：\n\n```html\n<input id=\"age\"\
  \ type=\"text\" size=\"4\"\n  onblur=\"validateInteger(this,\n  document.getElementById('age_help'))\
  \ />\n<span id=\"age_help\" class=\"help\"></span>\n```\n\n\n\n你不必为帮助文本关联样式类，但这确实会让用户界面看起来更好一些。这里有一个帮助样式的示例，可以使用它来美化帮助字段：\n\
  \n```\n<style type=\"text/css\">\n  span.help { color:#AA0000; font-style:italic;\
  \ }\n</style>\n```\n\n请记住，这种样式必须放置在 Web 页面的 `<head>` 中，这也就是你刚才看到的 `<script>` 标签必须放置的地方。这种样式只是让帮助文本变为斜体和红色。你可以轻松地添加更多样式或调整这些样式以获得不同的视觉效果。\n\
  \n这个年龄验证器唯一的问题在于，它没有考虑到用户输入的年龄可能毫无意义。例如，由于验证只检查输入是否为整数，因此如果用户输入年龄 `-5` 或 `212`，则不会显示任何帮助文本。在有人发现长生不泉之前，远超\
  \ 100 岁的年龄可能都可以被视为无效。你可能会通过创建一个只允许正整数的全新验证函数来考虑负数年龄，但在这种特定情况下，范围验证更具意义。\n\n年龄范围验证负责首先检查输入值是否为整数，然后进一步检查该整数是否在可接受范围内，例如\
  \ `1` 到 `120`。以下是你如何组合一个验证函数来执行此任务的：\n\n```javascript\nfunction validateAge(inputControl,\
  \ helpControl) {\n  // 首先检查输入是否为整数\n  if (!validateInteger(inputControl, helpControl))\n\
  \    return false;\n  // 然后检查输入值是否在规定范围内\n  if (inputControl.value < 1 || inputControl.value\
  \ > 120) {\n    if (helpControl != null)\n      helpControl.innerHTML = \"Please\
  \ enter an age in the\n      range 1 - 120.\";\n    return false;\n  }\n  else {\n\
  \    if (helpControl != null)\n      helpControl.innerHTML = \"\";\n    return true;\n\
  \  }\n}\n```\n\n注意，此函数首先调用 `validateInteger()` 函数检查并确保输入确实是一个有效整数。如果输入不是整数，那么继续进行范围检查就没有意义。如果输入是整数，则执行范围检查。范围检查的结果仅仅是设置或清除帮助控件中的文本。如果你忘记或决定不包含帮助控件，则会检查帮助控件是否为\
  \ `null` 值，在这种情况下你不希望发生错误。\n\n即使你的 JavaScript 经验并不扎实或没有，你也应该能够分离出 `validateAge()`\
  \ 函数的关键部分并对其进行修改以适应你的需求。例如，你只需更改此行代码即可改变验证检查的范围：\n\n```javascript\nif (inputControl.value\
  \ < 1 || inputControl.value > 120) {\n```\n\n假设你想验证 NFL（国家橄榄球联盟）四分卫评分，该分值必须在 `0`\
  \ 到 `158` 之间。以下是你如何更改范围测试代码行的：\n\n```javascript\nif (inputControl.value < 0 || inputControl.value\
  \ > 158) {\n```\n\n### Note\n\n![Note](img/note.jpg)\n\n请不要问为什么 NFL 四分卫评分的范围是 `0`\
  \ 到 `158`（实际上是 `158.33`），而不是更符合逻辑的 `0` 到 `10`。这是一个复杂的计算，考虑了诸如传球完成率、均尝试码数、均尝试达区数等变量。除非你是个完全的（美国）橄榄球迷，否则请接受这个范围并继续吧。否则，请在\
  \ [`en.wikipedia.org/wiki/Passer_rating`](http://en.wikipedia.org/wiki/Passer_rating)\
  \ 了解更多。\n\n希望你能看到，基于我提供的基础 set 创建你自己的验证函数并不困难。\n\n还可以扩展 Validator 应用中采用的 Ajax 风格验证，用于查询邮政编码的城市和州。例如，一种流行的\
  \ Ajax 验证是检查用户名数据库以确保在注册新用户时的唯一性。在这种情况下，你将向服务器脚本发出 Ajax 请求，传递输入的用户名，然后服务器脚本将名称与现有用户名数据库进行对比以查看是否唯一。响应可以是简单的“是”或“否”来进行唯一性验证。因此客户端只需要查看此结果并相应显示帮助消息。\n\
  \n这次改进讨论的重点在于，在数据验证和 Ajax 方面，我真的只展示了冰山一角。取决于你如何利用所学和我提供的代码，根据需要进一步扩展验证技术。\n\n##\
  \ 总结\n\n尽管此书介绍了许多有趣的 Ajax 应用，其中一些具有令人深刻的视觉效果和实时数据馈，但从纯实用的角度来看，很少有像 Validator 应用那样立刻就能用的。该应用程序有一个非常基础的用户界面，但易用性在这里脱颖而出。当输入无效数据时出现的帮助文本微妙但引人入胜。而且考虑到这些帮助信息在你无需提交任何数据的情况下立即出现——这就是“Ajax”式的处理方式，即使没有显式地发出\
  \ Ajax 服务器请求。当然，Validator 应用确实涉及了获取邮政编码城市和州的 Ajax 服务器请求，但事实是，即使验证完全在客户端进行，该应用程序在处处都营造了“Ajax”的感觉。\n\
  \n## 第 8 章：用于查看图片的杀手界面\n\n### Ajax 与早期管道工程\n\n![Ajax and Early Plumbing](img/note.jpg)\n\
  \n很难相信，但 Ajax 的起源可以追溯到 16 世纪的管道工程。1596 年，约翰·哈灵顿为英国女王伊丽莎白一世发明了一个名为“The Ajax”的冲水马桶。Ajax\
  \ 马桶在英国并没有真正流行，但在法国获得了一些成功。现代的 S 型马桶设计直到近 200 年后才出现。\n\n我们都知道一画胜于万言，特别是在视觉化程度极现代\
  \ Web 领域。然而，目前在 Web 上查看图片的技巧有点原始且无聊。我假设你正在使用小图像缩略图作为完整尺寸图像的链接，对于大多数照片来说，这是合理的，因为你不想在带有巨大照片的页面上占据过多屏幕空间。处理缩略图的传统方法是简单地链接到完整图片，在这种情况下，浏览器会打开并显示图片，就像另一个页面一样。这被视为页面导航，意味着你必须点击浏览器上的后退按钮才能返回原始页面，这可能导致重新加载。这种查看图片的方式并不理想，并且涉及到过多的加载和重新加载。“Ajax”提供了一个更好的替代方案。\n\
  \n本章为你展示了一个流畅的“Ajax”图片查看器，它消除了在另一个页面中打开缩略图完整版本的需求，从而抛弃了整个后退按钮加载的问题。我一直引用“Ajax”这个词，是因为从技术上说，你不需要\
  \ Ajax 来执行这种图片查看功能。当你深入本章的挑战时就会发现为什么，但请理解，本章展示了一个 Ajax 风格效果的完美示例，该效果在技术上并不涉及 Ajax\
  \ 请求。\n\n本章中的 Imaginator 应用使用了以下文件，它们位于带有书籍的实时 Linux 光盘的 `chap08` 示例代码文件夹中：\n\n\
  *   `imaginator.html`——主 Web 页面\n\n*   `smokiesXX.jpg`——一系列雾烟山示例图片\n\n*   `smokiesXX_thumb.jpg`——一系列雾烟山示例图片的缩略图\n\
  \n*   `domkit.js`——用于 Ajax Toolkit 的 DOM 函数\n\n*   `modalimgkit.js`——用于 Ajax Toolkit\
  \ 的模态图片相关函数\n\n*   `modalimgkit.css`——模态图片的样式表\n\n\n\n\n*   `modalimgkit_wait.gif`—在加载模态图片时显示的动态“加载中”图标。\n\
  *   `modalimgkit_gray.png`—当在前景显示模态图片时，在背景页面上显示的透明灰色图像。\n\n### 挑战：动态加载图片\n\nWeb\
  \ 页面上通常处理缩略图的方式存在一个固有的问题。问题的根源在于，你必须通过链接发起完整的 HTTP 请求才能查看全尺寸图片。这意味着该图片的加载方式就像是另一个\
  \ Web 页面一样，即浏览器会离开带有缩略图的当前页面，并跳转到一个包含该图片的新“页面”。如果你处于较慢的网络连接下，或者正在查看一张特别大的图片，等待图片加载的时间可能会让人困惑，因为此时没有视觉提示显示图片正在加载（除非你认为浏览器假死也是一种提示）。\n\
  \n次要问题是，你必须点击“后退”按钮才能返回带有缩略图的原始页面。这很重要，因为浏览器“前进”和“后退”按钮的设计初衷是引导你在不同的页面之间切换。换句话说，通过链接离开页面应该带你去一个完全不同的地方，而不仅仅是提供页面上已有内容的另一种视图。全尺寸图片的视图并不构成“新”内容，这就是为什么我非常不喜欢这种必须先向后浏览查看图片，然后再向后浏览以返回原始页面的做法。\n\
  \n那么 Ajax 能帮我们解决这个问题吗？并不真正。在这种场景下，Ajax 的问题在于它是围绕着向服务器查询文本数据的概念而设计的。正如你可能已经意识到的，图片是二进制文件，而不是文本。如果你对这种区别感兴趣，可以尝试将一张图片拖到你喜喜欢的文本编辑器中。你会看到一堆毫无意义的乱码字符，因为图片格式并不是为文本表示而设计的。正因如此，尝试通过\
  \ Ajax 请求图片时你会遇到严重的问题。\n\n我们已经确定 Ajax 无法通过请求来动态加载图片，这很遗憾，因为这本可以完全解决“通过加载新页面来查看图片”的困境。但并不意味着我们无路可\
  \ own。事实上，标准 JavaScript `Image` 对象中的一种机制使得在从不发布任何 Ajax 请求的情况下，实现 Ajax 的效果成为可能。我指的是\
  \ `Image` 对象中的 `onload` 事件，它会在图片加载完成时通知你。此事件在许多方面都像 Ajax 请求，因为它会在图片加载完成时发出通知。\n\n\
  `Image` 对象的另一个辅助 `onload` 事件处理程序的组件是 `complete` 成员变量，这是一个布尔值（`true`/`false`），可以让你知道图片是否加载完成。当与\
  \ `onload` 事件处理器结合时，`complete` 成员变量为你提供了构建“Ajax”图片查看器所需的所有信息。\n\n虽然我确定你会喜欢对 `onload`\
  \ 事件处理器和 `complete` 成员变量进行一场精彩的深入讨论（特别是如果你不是 JavaScript 高手的话），但我将免除你的痛苦。相反，我很乐意分享，我已经编写了一些\
  \ JavaScript 代码，允许你几乎不需要任何工作就能在页面中注入一个精美的图片查看器。说真的，你会对本章示例的极其简单感到惊讶的。\n\n支持图片查看器的代码是\
  \ `modalimgkit.js` 文件的一部分，该文件包含在书中附带光盘的 Ajax Toolkit 中，它也是 Imaginator 示例应用程序源代码文件的一部分。正如在第\
  \ 2 章 中最初提到的，“深入 Ajax 应用内部”，`modalimg.js` 文件提供了一个单一的 JavaScript 函数，你可以用它将整个页面上的图片链接自动转换为\
  \ Ajax 风格的图片查看器链接。该函数称为 `initModal()`，必须在包含图片链接的页面的 body 的 `onload` 事件处理器中调用。\n\n\
  `initModal()` 函数的精妙之处在于，它会自动扫描页面寻找图片链接，然后修改它们，使其使用动态的 Ajax 风格图片查看器。由于该函数会自动处理页面上找到的每一个图片链接，因此你只需要调用它一次即可激活动态图片查看器。\n\
  \n### 注意\n![注意](img/note.jpg)\n\n`modalimgkit.js` 文件中的 `modal`（模态）一词是指图片查看器使用了模态窗口（modal\
  \ window），这种窗口在显示时会阻止你与父窗口进行交互。模态窗口在大多数现代操作系统中通过对话框被大量使用。例如，大多数 Windows 应用程序中的“关于”对话框就是一个模态窗口。动态图片查看器使用模态窗口是为了确保你在查看图片时不会意外点击到背景中的窗口。\n\
  \n### 注意\n![注意](img/note.jpg)\n\n如果你在好奇，还有其他可以免费下载和使用的 Ajax 风格图片查看器工具包。其中一些甚至比你在这里学的还要强大。然而，你很难找到像这一个既紧凑又易用的。我的目标是尽可能地简化和最小化代码，同时提供一种精美的视觉效果。有时，少即是多！\n\
  \n## 设计：设计动态图片查看器\n\n本章的示例应用程序名为 Imaginator，它的主要工作是演示使用书中附带的 Ajax Toolkit 中的模态查看器部分是多么地异常简单。Imaginator\
  \ 应用程序实际上只需要展示几张链接的缩略图，然后正确地调用 `initModal()` 函数来开启图片查看器。从那时起，一切都是自动的。\n\n你还需要在 Imaginator\
  \ 页面中包含 `modalimgkit.js` JavaScript 文件，以及其关联样式表 `modalimgkit.css`。该样式表定义了模态图片窗口使用的样式，以便在屏幕上显示图片时获得整洁的外观。\n\
  \nImaginator 展示了一系列缩略图作为动态图片查看的基础，这意味着点击这些图片中的任何一个都会导致加载与缩略图关联的全尺寸图片，并跟踪加载状态。Imaginator\
  \ 页面始终保持可见，尽管当图片查看器显示图片时，它被隐藏在一个透明的灰色叠加层。图 8.1 显示了在任何给定时刻，缩略图系列中只有一张图片可以进行全尺寸查看。\n\
  \n![Imaginator 应用程序包含了一系列链接的缩略图，可以单独进行全尺寸查看。](img/08fig01.gif)\n\n**图 8.1. Imaginator\
  \ 应用程序包含了一系列链接的缩略图，可以单独进行全尺寸查看。**\n\n\n\n\n此图没有显示的是在显示全尺寸时，图像查看器是如何自动禁用整个 Imaginator\
  \ 网页的。不仅如此，在图像加载期间还会显示一张动画“加载”图像，以提示用户他们正在等待图像加载。这张图像是图像查看器的一部分，但没有任何东西阻止你将其更改为其他内容。图\
  \ 8.2 让用户知道图像正在加载\") 显示了图像查看器使用的 `modalimgkit_wait.gif` 图像。\n\n![Imaginator 使用的动态图像查看器使用动画“加载”图像\
  \ (modalimgkit_wait.gif)让用户知道图像正在加载。](img/08fig02.jpg)\n\n**图 8.2. Imaginator 使用的动态图像查看器使用动画“加载”图像\
  \ (modalimgkit_wait.gif)让用户知道图像正在加载。**\n\n在图像加载期间，动画“加载”图像会显示在原图像的位置。一旦图像加载完成，它就会取代“加载”图像。你可以将“加载”图像看作是在图像加载时代替图像的占位符。\n\
  \n## 组装 Imaginator 应用\n\n益于 Ajax Toolkit 中的图像查看器，组装 Imaginator 应用非常简单——该应用程序仅包含一个\
  \ HTML 网页和几张图像。更具体地说，网页 `imaginator.html` 包含一系列缩略图，这些图像链接到每个缩略图的全尺寸版本。图 8.3 显示了\
  \ Imaginator 应用显示了一个全尺寸模态图像，背景中可见一系列缩略图。\n\n![Imaginator 网页包含一系列缩略图，这些图像链接到它们全尺寸对应项。](img/08fig03.jpg)\n\
  \n**图 8.3. Imaginator 网页包含一系列缩略图，这些图像链接到它们全尺寸对应项。**\n\nImaginator 网页的主体负责在页面上安排缩略图并建立到全尺寸图像的链接。以下是页面主体的代码：\n\
  \n```html\n<body onload=\"initModal()\">\n  <p>Following are some pictures from\
  \ a recent trip to the Great\n    Smoky Mountains.</p>\n  <table>\n    <tr>\n  \
  \    <td><a href=\"smokies01.jpg\"><img src=\"smokies01_thumb.jpg\"\n        alt=\"\
  The Great Smoky Mountains\" style=\"border:none\"/>\n        </a></td>\n      <td><a\
  \ href=\"smokies02.jpg\"><img src=\"smokies02_thumb.jpg\"\n        alt=\"The Great\
  \ Smoky Mountains\" style=\"border:none\"/>\n        </a></td>\n      <td><a href=\"\
  smokies03.jpg\"><img src=\"smokies03_thumb.jpg\"\n        alt=\"The Great Smoky\
  \ Mountains\" style=\"border:none\"/>\n        </a></td>\n      <td><a href=\"smokies04.jpg\"\
  ><img src=\"smokies04_thumb.jpg\"\n        alt=\"The Great Smoky Mountains\" style=\"\
  border:none\"/>\n        </a></td>\n      <td><a href=\"smokies05.jpg\"><img src=\"\
  smokies05_thumb.jpg\"\n        alt=\"The Great Smoky Mountains\" style=\"border:none\"\
  />\n        </a></td>\n    </tr>\n  </table>\n</body>\n```\n\n整个应用程序中最重要的代码是主体中的第一行代码，它调用\
  \ Ajax Toolkit 中的 `initModal()` 函数来初始化动态图像查看器。该函数位于 `modalimgkit.js` 文件中，它的工作是处理页面上所有的图像链接，以便使用\
  \ Ajax 风格的图像查看器而不是传统的链接方法。`initModal()` 函数还预加载模态图像使用的图像，包括动画“加载”图标 (`modalimgkit_wait.gif`)\
  \ 和透明灰色背景图像 (`modalimgkit_gray.png`)。\n\n页面主体中的剩余代码是纯 HTML 代码，通过在 `<img>` 标签周围包裹\
  \ `<a>` 标签来创建链接的缩略图。注意，缩略图图像都以 `_thumb` 作为文件名后缀。你不需要使用这种完全相同的命名约定，但在命名相关文件（如缩略图和全尺寸图像对）时建立一致性是一个非常好的主意。\n\
  \n之前我提到过你需要从 Ajax Toolkit 将图像查看器文件导入到 Imaginator 网页中。这些文件包括一个 CSS 样式表和一个 JavaScript\
  \ 文件。以下是导入名为 `modalimgkit.css` 的样式表的方法：\n\n```html\n<link rel=\"stylesheet\" type=\"\
  text/css\" href=\"modalimgkit.css\" />\n```\n\n同样，`modalimgkit.js` JavaScript 文件通过以下代码行导入：\n\
  \n```html\n<script type=\"text/javascript\" src=\"modalimgkit.js\"></script>\n```\n\
  \n这两行代码都必须放在 `<head>` 中。以下是完整的页面头部：\n\n```html\n<head>\n  <title>Imaginator</title>\n\
  \  <link rel=\"stylesheet\" type=\"text/css\" href=\"modalimgkit.css\" />\n  <script\
  \ type=\"text/javascript\" src=\"domkit.js\"></script>\n  <script type=\"text/javascript\"\
  \ src=\"modalimgkit.js\"></script>\n</head>\n```\n\n这段代码揭示了 Ajax Toolkit 中的 `domkit.js`\
  \ 如何提供几个辅助函数来执行确定客户端大小、替换元素等任务。Imaginator 中缺少的另外两个成分是图像查看器所需的两个图像。你已经见过其中一个，`modalimgkit_wait`，它作为动画“加载”图像。另一个\
  \ `modalimgkit_gray.png` 是一个带透明的微小灰色图像，用于使背景变灰。这种视觉效果是通过图像查看器的 CSS 样式表实现的。当你点击模态图像的链接时，微小的灰色图像会平铺在背景上，使底层页面呈现出“禁用”外观，而动画“加载”图像在加载期间显示在页面中心。\n\
  \n## 测试 Imaginator\n\n测试 Imaginator 应用几乎和组装它一样简单，只需点击缩略图并确保它们以全尺寸正确显示即可。图 8.4 显示了\
  \ Imaginator 应用最初打开时，可见缩略图而没有显示全尺寸图像。\n\n![当 Imaginator 应用首次启动时，你只能看到一系列缩略图。](img/08fig04.jpg)\n\
  \n要查看动态图像查看器的运行情况，请点击一个缩略图。图 8.5 显示了在图像加载期间 world 的“加载”图像。\n\n\n\n\n\n非常重要的一点是，“加载”图像背后的背景是如何变灰，以防止在图像加载期间访问底层页面。这在视觉上强调了图像查看器是模态（modal）的这一事实，并帮助用户完全集中在全尺寸图像上，或者在本例中，专注于它正在加载的事实。\n\
  \n片刻之后，全尺寸图像将取代“加载”图像出现，如图 8.6 所示。\n\n![加载完成后，全尺寸图像将出现在“加载”图像的位置。](img/08fig06.jpg)\n\
  \n**图 8.6。加载完成后，全尺寸图像将出现在“加载”图像的位置。**\n\n同样，在查看全尺寸图像时，背景窗口保持灰色状态。如要关闭图像，只需用鼠标点击它，或按键盘上的回车键或空格键。你将立即返回原始页面，可以在那里查看其他图像或继续进行\
  \ Web 浏览。\n\nImaginator 应用的关键在于，你无需离开原始页面即可查看全尺寸图像。不仅如此，你还会获得一个非常清晰的视觉提示，显示图像正在加载，而不是仅仅等候浏览器在新的“页面”中打开全尺寸图像时在那忙运行。\n\
  \n## 为 Imaginator 进行一次极端的 Ajax 改造\n\n你可能在想，考虑到图像查看器专注于解决一个非常特定的问题，Imaginator 应用还有什么很大的空间可以改造呢？虽然你完全可以考虑通过支持字幕或注释音频剪来增强图像查看器本身，但这只会让事情变得复杂，或者至少需要大量的开发工作。\n\
  \n对 Imaginator 应用更贴切的“极端改造”是使用你自己的图像进行实验。事实上，最好的实验方法是取一个带有缩略图的现有页面，在不进行任何其他更改的情况下尝试图像查看器。你只需要在页面头部添加两行导入代码，然后在\
  \ `body` 的 `onload` 事件句处理程序中添加 `initModal()` 函数调用。然后确保将源文件（`modalimgkit.css` 和 `modalimgkit.js`）以及图像（`modalimgkit_wait.gif`\
  \ 和 `modalimgkit_gray.png`）拷贝到包含页面的文件夹中，即可开始。这是一个非常好的测试，因为它展示了动态图像查看器是多么真正的“即插即用”。\n\
  \n改造 Imaginator 应用的另一种趣味方式是尝试不同的动画“加载”图像。如果你是一个手手巧的平面设计师，你可能自己着手制作一个。对于我们其他人来说，有一个非常酷的在线工具允许你生成自己的自定义\
  \ Ajax“加载”图像。该网站名为 AjaxLoad.info ([[`www.ajaxload.info/`](http://www.ajaxload.info/))，你可以在图\
  \ 8.7 看到它的效果。\n\n![AjaxLoad.info 网站允许你为 Ajax 应用生成自定义的动画“加载”图像。](img/08fig07.jpg)\n\
  \n**图 8.7。AjaxLoad.info 网站允许你为 Ajax 应用生成自定义的动画“加载”图像。**\n\n使用这个工具，你可以选择指示器（图标）及其背景和前景颜色，工具会为你生成一张动画图像。你甚至可以查看预览，在决定下载结果之前对图像进行调整。\n\
  \n一旦你得到了喜欢的动画“加载”图像，只需将其覆盖到 Imaginator 文件夹（或你自己的 Web 页面文件夹）中现有的 `modalimgkit_wait.gif`get。替换\
  \ GIF 文件将立即替换图像查看器中的图像，尽管如果你拷贝图像之前已经打开了 Imaginator 页面，可能需要刷新浏览器。\n\n## 总结\n\n本书的目标之一是构建实用的\
  \ Ajax 示例应用程序，其构建组件尽可能做到即插即用。虽然书中的 Ajax Toolkit 某些组件确实比其他组件更容易即插即用，但很少有组件像动态图像查看器这样既简单又高效——它只需在你的\
  \ Web 页面中使用几行代码，就能提供一个流畅的“Web 2.0”风格的图像查看器。我鼓励你将该查看器接入你自己的页面并充分利用它的易用性，且不再回头——在\
  \ Web 开发世界中，很少能获得如此物超所值的轻松体验。\n\n## 第 9 章：使用精美的弹出窗口展示信息\n\n### Ajax 小镇\n\n![Ajax\
  \ 小镇](img/note.jpg)\n\n如果你想访问 Ajax，可以前往加拿大安大略省南部，在那里你可以发现 Ajax 小镇。Ajax 位于安大略湖岸，被认为是多伦的一个郊区。小镇的名字源于二战期间位于那里的一个弹药工厂。由于其作为二战弹药提供者的角色，该镇以二战英国海军首次重大海战获胜的军舰\
  \ Ajax 号命名。\n\nAjax 在整个网络上最可见的用途之一是点击或悬停在链接上自动出现的弹出窗口。即使弹出窗口带有负面声誉，但只要使用得当，Ajax\
  \ 弹出技术也可以变得非常有用。例如，这种弹出窗口可以在悬停在链接上时显示，并可以在用户实际跳转到链接之前提供页面预览。本章探索了 Ajax 驱动的信息窗口（或称\
  \ info window）的概念，它只是一个通过 Ajax 请求获取数据并动态填充的弹出窗口。信息窗口可以显示几乎任何内容，但其核心思想是显示不一定需要独立完整页面的信息片段。通过使用信息窗口，你让信息更易获取，并消除了加载新页面的需求。\n\
  \n本章中的 Informer 应用使用了以下文件，它们位于书中附带的 Linux 光盘 `chap09` 示例代码文件夹中：\n\n*   `snapper.html`—Snapper\
  \ 主 页面\n*   `informer.html`—Informer 主 页面\n*   `skateXXX.html`—一系列与滑板相关的示例 Web 页面\n\
  *   `skateXXX.jpg`—一系列滑板示例图像\n*   `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n*   `domkit.js`—Ajax\
  \ Toolkit 的 DOM 相关函数\n*   `infowinkit.js`—Ajax Toolkit 的信息窗口相关函数\n*   `infowinkit.css`—信息窗口的样式表\n\
  *   `infowinkit_wait.gif`—向信息窗口加载信息时显示的动画“加载”图标\n\n### 挑战：创建链接弹出窗口\n\n虽然我同意弹出窗口已成为\
  \ Web 简短历史上最负面的“创新”之一，但有时对负面事物进行稍微的重新利用可以产生积极影响。“有用”与“恼人”之间只有微妙的界限。遗憾的是，弹出窗口在很大程度上倾向于后者。Ajax\
  \ 提供了一种以更有帮助且不那么侵入的方式使用弹出窗口的机会。\n\n\n\n\n\n请记住，Ajax 的杀手级功能是它可以向服务器查询部分数据，而不是整个 Web\
  \ 页面。本书已经向你展示了许多示例，说明了动态加载电子书章节、股票报价或经过验证的用户输入是多么地高效率，而你不需要在服务器上进行一次完整的全页往返请求。然而，到目前为止，这种思想是从服务器加载分块信息并以某种方式将其显示在当前页面上。但如果将当前页面用于显示目的并不合理了呢？\n\
  \n在某些情况下，直接在当前页面上显示 Ajax 请求的结果可能会分散注意力。考虑一下本书书中侧边栏或注释框的类比。侧边栏或注释框旨在提供某种补充信息。然而，它们被放置在主章节正文的中间，从而竞争你的注意力。如果你能够随心所欲地开启或关闭注释，而不是让它与主讨论进行视觉上的竞争，将会好得多。\n\
  \n### Note\n\n![Note](img/note.jpg)\n\n诚承认，这个注释确实有点分散注意力，因为它占据了打印页面上宝贵的空间并中断了主章节正文的阅读流。当然，你可以忽略它，但你显然没有这样做，否则你就不会在读这句话了。如果你能用手指点一下页面让这个注释框消失就太好了。遗憾的是，我还没有想出如何将\
  \ Ajax 注入到打印页面中！\n\n我想表达的是，当你有一些额外信息要展示，但又不想干扰当前查看的页面时，弹出窗口会很有用。此外，如果你不需要在前端加载这些额外信息，而是根据需要才加载，那将极其方便。Ajax\
  \ 使得能够根据按需访问此类信息，然后将其显示在只临时占用屏幕空间的弹出窗口中。\n\n显然，由于激进的在线广告商，人们对滥用弹出窗口存在很多敌意。出于这个原因，某些用户反感任何形式的弹出窗口。了解这一点，在使用弹出窗口时保持非常谨慎至关重要，即使在理由充分的情况下也不要强加给用户。用户真正讨厌的是无法对弹出窗口的显示拥有任何控制权，这在恼人的弹出广告窗口中通常很常见。弹出窗口的一种更积极的用法是仅在响应点击或可能的悬停时显示它们。在后一种情况下，在悬停结束自动隐藏弹出窗口（即当鼠标指针离开它所悬停的元素时）非常重要。\n\
  \n一种应用成功的 Ajax 弹出窗口技术涉及我刚才提到的悬停方法。我指的是链接预览弹出窗口，当你悬停在链接上时，与链接关联的页面内容会在一个小弹出窗口中显示。\n\
  \n这种技术的一个很好的例子是 Snap Preview 网站（[`www.snap.com/`](http://www.snap.com/))），它显示一个提供链接页面预览的弹出窗口。虽然你可以用\
  \ Ajax 编写自己的自定义悬停预览窗口，但没有必要，因为 Snap Preview 实际上是一个自动化该过程的在线服务。Snap Preview 允许将你\
  \ Web 上的所有链接转换为 Snap Preview 链接。\n\n### Note\n\n![Note](img/note.jpg)\n\n另一个与 Snap\
  \ Preview 类似的服务是 Kontera ([`www.kontera.com/`](http://www.kontera.com/))，它使用悬停弹出窗口显示与链接相关的广告。虽然\
  \ Kontera 链接仍然基于广告的弹出，但它们比在没有任何警告的情况下出现的弹出窗口要侵入得多。\n\n要让你自己的页面支持 Snap，你必须先在 [`www.snap.com`](http://www.snap.com)\
  \ 向 Snap 注册你的站点。\n\n除了向 Snap 注册之外，Snap 注册过程还为你提供了在页面中添加 Snap Preview 功能所需的 JavaScript\
  \ 代码。这段 Snap Preview JavaScript 代码段包含在一个标准的 `<script>` 标签中。以下是此类代码段的示例，它必须放置在 Web\
  \ 页面的 head 中才能使用 Snap Preview 功能：\n\n```html\n<script defer=\"defer\" id=\"snap_preview_anywhere\"\
  \n  type=\"text/javascript\"\n  src=\"http://spa.snap.com/snap_preview_anywhere.js?\n\
  \  ap=1&amp;key=c6a9f...&amp;\n  sb=0&amp;domain=www.stalefishlabs.com\"></script>\n\
  ```\n\n这段代码实际上包含在我组合的一个示例 Web 页面（`snapper.html`）中，用于演示使用 Snap Preview 是多么简单。以下是页体的代码：\n\
  \n```html\n<body>\n  <p>Here are some links:</p>\n  <p><a href=\"http://www.usatoday.com/\"\
  >USA Today</a></p>\n  <p><a href=\"http://www.amazon.com/\">Amazon.com</a></p>\n\
  \  <p><a href=\"http://www.nhl.com/\">National Hockey League</a></p>\n  <p><a href=\"\
  http://www.snopes.com/\">Snopes.com</a></p>\n  <p><a href=\"http://www.michaelmorrison.com/\"\
  >Michael's Web site</a></p>\n</body>\n```\n\n如你所见，这段代码没有任何特定内容将其与 Snap Preview 功能关联起来——Snap\
  \ Preview 脚本会自动更改链接。图 9.1 显示了带有弹出窗口的最终页面。\n\n![当你悬停在页面上的任何链接上，Snap Preview 弹出窗口就会出现，提供页面的小型预览。](img/09fig03.jpg)\n\
  \n**图 9.1. 当你悬停在页面上的任何链接上，Snap Preview 弹出窗口就会出现，提供页面的小型预览。**\n\n\n\n\n支持信息弹窗的代码是\
  \ `infowinkit.js` 文件的一部分，该文件包含在书籍附光盘的 Ajax Toolkit 中，它也是 Informer 示例应用程序源代码文件的一部分。正如在第\
  \ 2 章 中最初提到的，“在 Ajax 应用程序内部”，`infowinkit.js` 文件提供了两个用于支持动态信息弹窗窗口的 JavaScript 函数：\n\
  \n- `initInfoWindow()`——为整个页面初始化信息弹窗\n- `showInfoWindow()`——在弹窗中显示特定的动态加载信息\n\n\
  `initInfoWindow()` 函数用于初始化信息弹窗，并且必须在包含信息链接的页面 `body` 的 `onload` 事件处理程序中调用。随后，在每个信息链接的\
  \ `onclick` 事件处理程序中调用 `showInfoWindow()` 函数；这才是真正导致弹窗显示的因素。在本章稍后的部分深入介绍 Informer\
  \ 应用程序的细节时，你将学习更多关于这两个函数的具体用法。\n\n回到与 Informer 应用程序相关的挑战，你知道信息弹窗用于共享信息。在这个特定的示例中，你将创建一个关于滑板运动的\
  \ Web 页面，使用信息弹窗来描述涉及的主要设备。其理念是页面的主要内容只需提到每件设备，而每件设备的具体细节则委托给信息链接（弹窗）。因此，你将在页面上的几处文本周围包装信息链接，以便这些文本链接到信息弹窗。\n\
  \n## 设计：设计一个信息弹窗应用程序\n\nInformer 应用程序实际上只是一个普通的 Web 页面，带有几个链接，这些链接在信息弹窗窗口的帮助下变得有趣。由于信息链接是通过鼠标点击触发的，因此相关的弹窗会出现在被点击的链接上方。图\
  \ 9.2 显示了 Informer 应用程序的概念用户界面，并包含一个出现在信息链接上方的弹窗窗口。\n\n![Informer 应用程序的用户界面由一个标准的\
  \ Web 页面和能够触发弹窗的特殊信息链接组成。](img/09fig04.gif)\n\n图 9.2。Informer 应用程序的用户界面由一个标准的 Web\
  \ 页面和能够触发弹窗的特殊信息链接组成。\n\n该图揭示了页面上的链接如何导致在链接所在的页面上显示一个弹窗窗口。虽然驱动弹窗的代码包含在 Ajax Toolkit\
  \ 中，但在弹窗中显示的信息是 HTML 代码，这最终由你负责。这些 HTML 代码存储在单独的文件中，并与信息弹窗窗口一一一地映射。这使得 Informer\
  \ 应用程序能够针对每个弹窗窗口对特定文件发起 Ajax 请求。因此，你可以将每个弹窗的内容看作一个微型 Web 页面。\n\n因此，应用程序的设计不仅涉及导入适当的\
  \ JavaScript 代码，还涉及创建弹窗的内容。好消息是，这些内容是纯 HTML 代码，不需要特殊的脚本。\n\n虽然 Informer 应用程序中的 Ajax\
  \ 请求发生在 `infowinkit.js` 文件内部，但评估代表信息弹窗发送请求所涉及的内容仍然是值得的。接下来的几节将快速探讨与信息弹窗相关的 Ajax\
  \ 请求和响应。\n\n### 客户端请求\n\nInformer 应用程序弹窗窗口中显示的信息是从作为微型 Web 页面的独立文件中加载的。例如，点击滑板轮链接将显示一个显示轮子图片及其描述的弹窗。这张图片和描述存储在如\
  \ `skatewheels.html` 之类的 HTML 文件中，当弹窗显示时通过 Ajax 请求动态加载。因此，针对信息弹窗窗口的客户端请求仅包含信息 Web\
  \ 页面的 URL。\n\n请记住，随客户端请求发送的 Web 页面 URL 并没有引用一个完整的 Web 页面。这是因为生成的 HTML 内容将注入到现有的弹窗窗口中，而不是在浏览器中作为真正的\
  \ Web 页面打开。你可以将信息窗口的 HTML 内容认为一个 HTML 文档“片段”。\n\n### 服务器响应\n\n信息弹窗窗口的“文档片段”概念应该提示你服务器对\
  \ Informer 应用程序发起的请求返回了什么。事实上，服务器简单地返回在请求 URL 所引用的 HTML 文件中存储的文档片段。因此，在滑板轮示例中，客户端请求包含文件的\
  \ URL (`skatewheels.html`)，而服务器响应则是该微型页面的实际 HTML 代码。\n\n由于服务器返回的是完整文件（即使其内容代表 HTML\
  \ 代码的片段），因此没有在服务器上进行任何特殊处理。因此，你不需要为 Informer 应用程序编写任何 PHP 脚本。\n\n### 理解客户端到服务器的对话\n\
  \n得益于 Ajax Toolkit，Informer 应用程序使用了非常直接的 Ajax 通信。图 9.3 揭示了向信息弹窗窗口中动态加载内容的过程涉及发送\
  \ URL 并获取 HTML 代码（内容）作为响应。\n\n![Informer 应用程序使用 URL 作为客户端请求的基础，导致服务器交付信息内容。](img/09fig05.gif)\n\
  \n图 9.3。Informer 应用程序使用 URL 作为客户端请求的基础，导致服务器交付信息内容。\n\nInformer 应用程序中的客户端请求仅包含代表信息的\
  \ HTML 文件的 URL。不需要参数，因为你只对 HTML 文件感兴趣，所以 Ajax 请求导致加载整个文件，在这种情况下它包含信息“页面”的 HTML 代码。\n\
  \n我在引用信息内容时使用了“页面”一词是因为因为它更是一个 HTML 文档片段而不是完整的页面。以下是描述滑板轮信息的示例内容：\n\n```\n<table>\n\
  \ <tr>\n   <td rowspan=\"2\"><img src='skatewheels.jpg'\n     alt='Skateboard wheels'\
  \ /></td>\n   <td style=\"font-weight:bold; background-color:#CCCCCC\">\n     滑板轮</td>\n\
  \ </tr>\n <tr>\n   <td>尽管尽管过去使用过其他材料，\n     现代滑板轮都是由聚氨酯制成的。聚氨酯滑板轮有各种尺寸\n     和硬度，以适应不同的地形。\n\
  \   </td>\n </tr>\n</table>\n```\n\n## 组装 Informer 应用程序\n\n\n\n\n* HTML 页面 (`informer.html`)\n\
  * 信息内容页面\n\nInformer 的 HTML 页面是包含信息链接的 页面，而信息内容页面则描述特定的内容并用于触发弹出窗口。接下来的几个章节将详细介绍\
  \ Informer 应用程序的这些部分。\n\n### Informer 页面\n\nInformer 应用程序由多个 HTML 文件组成，但只有其中一个作为应用程序的主\
  \ 页面。主 Informer 页面是包含信息链接的地方，如图图 9.4 所示。\n\n![Informer 页面包含一个包含信息链接的文本段，点击这些链接会启动信息弹出窗口。](img/09fig06.jpg)\n\
  \n**图 9.4. Informer 页面包含一个包含信息链接的文本段，点击这些链接会启动信息弹出窗口。**\n\n该图显示了 Informer 页面文本段中存在大量的信息链接。点击这些链接中的任何一个都会显示信息弹出窗口，如图所示。虽然弹出窗口主要通过\
  \ Ajax Toolkit 中的 JavaScript 代码控制，但 Informer 页面的主体是在其 HTML 代码中布局的：\n\n```\n<body\
  \ onload=\"initInfoWindow(325, 200)\">\n  <div id=\"ajaxState\" style=\"display:none\"\
  ></</div>\n  <br />\n  <h2>Informer - 滑板基础</header>\n  <p>滑板在过去几年里已成为美国青少年的一项主要运动，增长显著。虽然滑板涉及设备相当简单，但对于这项运动的新手来说，仍然需要一定程度的教育。无论你计划做哪种滑板，你无疑都需要滑板的核心组件，由板\n\
  \    <a href=\"#\" class=\"info\"\n    onclick=\"return showInfoWindow('skatedeck.html',\
  \ event)\">\n    板 (deck)</a>，<a href=\"#\" class=\"info\"\n    onclick=\"return\
  \ showInfoWindow('skatetrucks.html',\n    event)\">支架 (trucks)</a>，以及 <a href=\"\
  #\" class=\"info\"\n    onclick=\"return showInfoWindow('skatewheels.html',\n  \
  \  event)\">轮子 (wheels)</a>。\n    此外，考虑使用 <a href=\"#\"\n    class=\"info\" onclick=\"\
  return showInfoWindow(\n    'skatehelmet.html', event)\">\n    头盔 (helmet)</a> 和\
  \ <a href=\"#\" class=\"info\"\n    onclick=\"return showInfoWindow('skatepads.html',\
  \ event)\">\n    护具 (pads)</a> 是个好主意，如果你计划滑任何高大的障碍，例如垂直斜道和混凝土碗池。\n  </p>\n\n</body>\n\
  ```\n\n此列表中第一个重要的代码段是页面主体的 `onload` 事件处理器，它调用了 Ajax Toolkit 中的 `initInfoWindow()`\
  \ 函数。注意向该函数传递了两个参数（325 和 200），它们是弹出窗口的宽度（325）和高度（200），单位为像素。这个宽度和高度在整个应用程序生命周期内都是固定的，这意味着一旦设置了初始宽高，弹出窗口就不会改变大小。\n\
  \n下一段值得再次查看的代码是通过熟悉的锚点标签（`<a>`）创建信息链接的代码。以下是出现在主体 HTML 代码中的其中一个信息链接的示例：\n\n```\n\
  <a href=\"#\" class=\"info\"\n  onclick=\"return showInfoWindow('skatedeck.html',\
  \ event)\">板 (deck)</a>\n```\n\n注意，通常指向链接 URL 的 `href` 属性被设置为 \"#\"。这基本上是告诉链接它没有链接到任何地方。相反，该链接作为信息弹出窗口的触发器，该窗口通过\
  \ `onclick` 事件处理器中调用 `showInfoWindow()` 函数来显示。当用户点击链接文本 \"deck\" 时，`showInfoWindow()`\
  \ 函数被调用并显示弹出窗口。\n\n`showInfoWindow()` 函数的第一个参数是待显示的页面 URL。如果你还记得早些时候，信息页面实际上是页面片段（fragments），因为它们旨在用于在现有的弹出窗口内显示。你将在下一节中了解更多关于这些页面的结构。函数的第二个参数是标准的\
  \ JavaScript `event` 对象，它对于传递鼠标点击坐标是必需的。\n\n### 注意\n\n![注意](img/note.jpg)\n\n在实际上，“标准的”\
  \ JavaScript `event` 对象并不完全标准，意味着它在所有浏览器中都不得到支持。然而，Ajax Toolkit 足够智能，可以考虑到浏览器的不一致性并相应地调整事件处理代码。\n\
  \n记住，`showInfoWindow()` 函数最终负责发布加载信息内容的 Ajax 请求。为了更好地理解 `showInfoWindow()` 函数如何产生\
  \ Ajax 请求，请查看该函数在 `infowinkit.js` 文件中的以下代码片段：\n\n```\nfunction showInfoWindow(infoURL,\
  \ evt) {\n  ...\n  ajaxSendRequest(\"GET\", infoURL, handleContentRequest);\n  ...\n\
  }\n```\n\n注意，由于 `infoURL`，正在加载的“页面”的 URL 直接传递给了 Ajax 请求。\n\n在 Informer 页面主体 HTML\
  \ 代码中可以注意的另一个小细节是将信息链接的 `class` 属性设置为 \"info\"。`info` 样式类在 `infowinkit.css` 文件中定义，用于将信息链接与标准链接进行样式区分。具体来说，信息链接显示为双下划线，并且在悬停时会高亮显示。\n\
  \n为了让 `info` 样式类生效，必须使用以下代码行将 `infowinkit.css` 样式表导入到 Informer 页面的头部 (`informer.html`)：\n\
  \n```\n<link rel=\"stylesheet\" type=\"css\" href=\"infowinkit.css\" />\n```\n\n\
  同样，使用以下代码行导入 `infowinkit.js` JavaScript 文件：\n\n```javascript\n<script type=\"text/javascript\"\
  \ src=\"infowinkit.js\"></script>\n```\n\n这两行代码都必须出现在页面头部。为了澄清文件是如何导入的，这里是 Informer\
  \ 页面的完整头部：\n\n```\n<head>\n  <title>Informer</title>\n\n  <link rel=\"stylesheet\"\
  \ type=\"css\" href=\"infowinkit.css\" />\n  <script type=\"text/javascript\" src=\"\
  ajaxkit.js\"></script>\n  <script type=\"text/javascript\" src=\"domkit.js\"></script>\n\
  \  <script type=\"text/javascript\" src=\"infowinkit.js\"></script>\n</head>\n```\n\
  \n这段代码显示了 Informer 页面还包含了 Ajax Toolkit 中的 `ajaxkit.js` 和 `domkit.js` 文件，这些文件提供了多个与\
  \ Ajax 和 JavaScript DOM 相关的辅助函数。\n\n有了 Informer 应用程序的基础框架，你现在缺的只是信息弹出窗口本身的内容了。\n\
  \n### 信息内容页面\n\n如果你查看 Informer 页面主体中的代码，你会发现有五个与滑板设备内容相关的信息链接。每个链接都引用了一个 HTML 文件，该文件包含要在信息弹出窗口中显示的内容。以下是\
  \ Informer 页面引用的 HTML 文件：\n\n* `skatedeck.html`\n* `skatetrucks.html`\n* `skatewheels.html`\n\
  * `skatehelmet.html`\n* `skatepads.html`\n\n\n\n\n\n这些文件每一个都代表一个微 Web 页面，当点击链接时会在弹出窗口中显示。尽管这些文件是文档片段而不是完整的\
  \ Web 页面，你仍然可以在 Web 浏览器中打开并查看它们，以了解它们的样子。图 9.5 显示了直接在 Web 浏览器中查看的 `skatedeck.html`\
  \ 文件。\n\n![Informer 应用中的每部分信息内容实际上只是一个微 Web 页面](img/09fig07.jpg)\n\n**图 9.5. Informer\
  \ 应用中的每部分信息内容实际上只是一个微 Web 页面。**\n\n该图展示了滑板板的内容是如何由一张图片、一个标题和一段文字组成的。在讨论内容文件时，我多次使用了“片段”（fragment）一词。我之所以这样做是因为在普通的\
  \ Web 页面中找不到 `<html>`、`<head>` 或 `<body>` 标签。相反，这些内容“页面”只包含了描述内容所需的 HTML 代码。为了理解我的意思，请看下方\
  \ 图 9.5 所示的 `skatedeck.html` 文件代码：\n\n```\n<<table>\n <tr>\n   <td rowspan=\"2\"\
  ><img src='skatedeck.jpg'\n     alt='Skateboard deck' /></td>\n   <td style=\"font-weight:bold;\
  \ background-color:#CCCCCC\">\n     Skateboard Deck</td>\n </tr>\n <tr>\n   <td>板面是滑板最核心的部分，\n\
  \     通常由七层硬枫木制成。这些木层在模具中胶合并压制，\n     然后切割并加工成所需的形状。\n   </td>\n </tr>\n</table>\n\
  ```\n\n### Note\n\n![Note](img/note.jpg)\n\n我坦然承认我违反了“不使用表格进行布局”的黄金法则，但在这种情况下，使用表格布局滑板内容反而更整洁、简单。如果你想成为一个设计纯粹主义者并放弃表格改用\
  \ CSS，请随意。\n\n这段代码揭示了如何使用 HTML 代码片段描述滑板板微页面。这之所以有效，是因为代码最终被插入到信息弹出窗口中，而不是作为一个独立的\
  \ Web 页面被打开。\n\n我忘记提到的小细节是，我只创建了五个 HTML 内容文件中的三个，故意遗留了 `skatehelmet.html` 和 `skatepads.html`\
  \ 文件。省略这些文件是为了测试 Informer 应用处理缺失内容的能力，这是你接下来要的操作。\n\n## 测试 Informer\n\n测试 Informer\
  \ 应用只需在浏览器中打开主页面并进行点击。图 9.6 显示了页面首次加载后、在点击任何信息链接之前的状态。\n\n![Informer 应用启动时，信息弹出窗口是隐藏的，因为信息链接尚未被点击](img/09fig08.jpg)\n\
  \n**图 9.6. Informer 应用启动时，信息弹出窗口是隐藏的，因为信息链接尚未被点击。**\n\n要查看信息弹出窗口并查看有关特定滑板装备的更多细节，只需点击一个信息链接。你看到的第一个东西是一个弹出窗口，左上角有一个微小的动画“加载”图标，让你知道内容正在加载。图\
  \ 9.7 显示了该图标的运行状态。\n\n![信息弹出窗口中首先出现一个动画“加载”图标，让你知道内容正在加载](img/09fig09.jpg)\n\n**图\
  \ 9.7. 信息弹出窗口中首先出现一个动画“加载”图标，让你知道内容正在加载。**\n\n除非你的网络连接非常慢，否则内容应该加载得非常快，在这种情况下，动画“加载”图标会被实际内容取代。图\
  \ 9.8 显示了带有显示滑板板信息的弹出窗口的 Informer 应用。\n\n![当你在 Informer 应用中点击信息链接时，会显示带有额外信息的弹出窗口](img/09fig10.jpg)\n\
  \n**图 9.8. 当你在 Informer 应用中点击信息链接时，会显示带有额外信息的弹出窗口。**\n\n当然，页面上的两个信息链接被故意设置为会失败的，这为\
  \ Ajax Toolkit 的错误处理能力提供了一个很好的测试。图 9.9 显示了当你在点击头盔或护垫链接时发生的情况。\n\n![点击没有内容内容的信息链接会导致包含错误的弹出窗口](img/09fig11.jpg)\n\
  \n**图 9.9. 点击没有内容内容的信息链接会导致包含错误的弹出窗口。**\n\n如图所示，信息弹出窗口以其尽可能优雅的方式处理了缺失的内容，仅显示一条未找到内容的消息。\n\
  \n# 为 Informer 进行彻底大新\n\n\n\n\n\n我对于信息弹窗（information popups）功能的探索仅仅是触毛一角。我鼓励你寻找自己的独特应用——只需记住，它的主要优势是能够在临时窗口中显示小段\
  \ HTML 内容，而不是像传统链接那样打开全新的 Web 页面。\n\n### 注意事项\n\n![Note](img/note.jpg)\n\n由于信息弹窗的大小在首次初始化后就不会再改变，因此尝试让你所有的内容文件的大小大致相同是一个好主意。这样，它们就可以在同一个弹窗中显示，且只需极少的滚动。理想情况下，不应该出现滚动条，但这在所有浏览器中很难保证。\n\
  \n## 总结\n\n本章探讨了 Ajax 开发中一个既流行又充满争议的领域。虽然弹窗在用不当时确实招人厌恶，但在适制使用且具有明确目的的情况下使用时，它们也可以非常有帮助。由\
  \ Ajax 驱动的弹窗比标准弹窗更有趣，因为它们允许你从服务器动态加载碎片化数据，而无需打开一个全新的 Web 页面。本章将引导你开发一个示例应用程序，该程序使用了书中\
  \ Ajax Toolkit 内置的信息弹窗支持。希望你喜欢使用信息弹窗，因为这并不是你见到它们的最后一次。\n\n## 第 10 章：使用 Ajax 预测天气\n\
  \n### Ajax 的另一位战士\n\n![Ajax the Other Warrior](img/note.jpg)\n\n如果你认为希腊战士 Ajax 很厉害，那么纽约街头混混\
  \ Ajax 又是怎样的？在 1979 年的电影《战士》（*The Warriors*）中，Ajax 是一个特别有攻击性的街头帮派成员，他随时准备战斗。如果这听起来还不够吓，那么也许他的无指皮手套和黑色无背心会吓掉你的审美！\n\
  \n虽然在现实世界中天气是个极其乏味的话题，但在 Web 服务领域，天气是非常有趣的数据。天气是实时 Web 服务的绝例子，因为它具有非常强的实时感。它总是在变化且难以预测的，是实时查看数据的完美类型。而且，天气以非常真实的方式影响着我们所有的生活，使其成为某些\
  \ Web 应用中非常有价值的实用信息源。\n\n本章深入探讨了一个使用 Ajax 查询天气服务器获取实时天气数据，然后以有趣的方式显示这些天气数据的应用程序。具体来说，天气数据显示在一个临时弹窗中，类似于\
  \ 第 9 章 中“用精美弹窗展示信息”所示的内容。天气数据非常适合在弹窗中显示，因为它是简洁的，通常是对特定页面重点内容的补充。换句话说，它是那种你可能想快速看一眼然后关闭的内容。\n\
  \n本章中的 Forecaster 应用程序使用了以下文件，这些文件位于随书附带的 Linux 实时版光 光盘（live Linux CD-ROM）的 `chap10`\
  \ 示例代码文件夹中：\n\n* `forecaster.html`—主 Web 页面\n* `forecaster.php`—用于加载天气预报的服务器脚本\n\
  * `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n* `domkit.js`—Ajax Toolkit 中与 DOM 相关的函数\n\
  * `infowinkit.js`—Ajax Toolkit 中与信息窗口相关的函数\n* `infowinkit.css`—信息窗口样式表\n* `infowinkit_wait.gif`—在向信息窗口加载信息时显示的动态“加载”图标\n\
  \n### 挑战：收集动态天气信息\n\n本章的挑战涉及使用 Ajax 动态加载特定位置的天气数据。实时天气信息在各种场景中都可能有用：旅游网站、体育网站，实际上任何天气可能影响网站内容的网站都适用。我个人很喜欢旅游网站这个主意，因为天气在旅行决策中确实起着至关重要的作用。也许你正试图仔细避开飓风季节热带地区的风暴，或者你可能想在季初滑雪之旅前检查天气是否足够冷。几乎任何涉及旅行的网站都能从实时天气数据中受益。\n\
  \n但现在已经很容易获取天气状况了，为什么还要费心 Ajax 和弹窗呢？只需去 [Weather.com](http://Weather.com) 网站查看世界上任何城市的当前天气即可。\n\
  \n尽管 [Weather.com](http://Weather.com) 在提供信息的质量方面无可比拟的，但请记住，你需要在浏览器中导航到那里，然后输入你想要的天气报告的位置。如果你不想丢失当前查看页面的上下文，而是希望在不离开页面的情况下获取天气更新，那么这就是问题所在。这就是弹窗大显用场的地方。通过在弹窗中显示天气数据，允许用户继续关注当前任务，而不会因离开页面而分心。也许重要的是，你消除了用户离开你网站的一个借口。\n\
  \n所以，你的目标不是创建一个比像 [Weather.com](http://Weather.com) 等纯天气网站更丰富或更详尽的替代方案。你的目标是将实时天气数据注入现有网站的上下文中从而在用户无需离开你的舒适页面的情况下添加一些有用的新内容。信息弹窗是显示天气数据且不与主页面竞争的关键。\n\
  \n该挑战涉及的 Ajax 请求必须以某种方式根据特定位置查询天气服务获取天气数据。事实证明，邮政编码足以识别位置，因此成为查询天气数据的很好的数据。Ajax\
  \ 响应包含了你必须处理的天气数据以便在弹窗中显示有意义的天气信息。\n\n## 设计：设计天气预报器\n\n你为了应对天气挑战而开发的名为 Forecaster，它的设计很大程度上依赖于书中\
  \ Ajax Toolkit 中现有的信息窗口支持。事实上，Forecaster 应用程序在结构上与 第 9 章 中开发的 Informer 应用程序非常，因为它请求的是特定位置的实时天气信息，而不是预构建的\
  \ HTML 内容文件。图 10.1 让你了解 Forecaster 应用程序用户界面的结构。\n\n![The user interface for the\
  \ Forecaster application consists of a Web page with info links that trigger a popup\
  \ window containing live weather information.](img/10fig02.gif)\n\n**图 10.1. Forecaster\
  \ 应用程序的用户界面由一个带有信息链接的 Web 页面组成，这些链接会触发一个包含实时天气信息的弹窗。**\n\n该图显示了 Forecaster 页面由标准文本散落在其中的城市链接组成。每个城市链接实际上都是一个信息链接，会导致显示一个包含实时天气数据的弹窗。\n\
  \n\n\n\n\n为了让 Ajax 天气请求生效，你实际上需要访问结构化格式（如 `XML`）的实时天气数据。事实证明，你可以使用互联网上的多个天气源来完成此任务。我喜欢的一个服务是\
  \ Yahoo! Weather  RSS 天气馈送。这些天气数据以 RSS 格式提供，这是一种特定的 `XML` 数据格式，传统上用于共享新闻，正如在第 5\
  \ 章 中所示的，“接入 RSS 新闻馈送”。然而，没有理由认为 RSS 馈送不能用于其他类型的数据，在这种情况下，Yahoo! Weather 使用 RSS\
  \ 来传输天气数据。\n\n### 注意\n\n![Note](img/note.jpg)\n\nRSS（实时简单信息聚合）是一种 `XML` 数据格式，旨在以一致的方式表示新闻故事。一个典型的\
  \ RSS 文档（或馈送）包含多个新闻故事，并附有详尽信息，如标题、描述、发布日期以及指向在线文章的链接。RSS 格式实际上可以用于新闻领域之外，事实上对于任何定期变化的文本信息都是用的。有许多第三方应用程序（称为\
  \ RSS 阅读器），允许你在单一视图中查看和访问多个 RSS 馈送。\n\n图 10.2 显示了 Yahoo! Weather RSS 馈送网页 ([`developer.yahoo.com/weather/`](http://developer.yahoo.com/weather/))，它包含了关于天气馈送以及如何对其自定义以满足你需求的优秀文档。\n\
  \n![Yahoo! Weather RSS 馈送网页提供了实时 XML 天气馈送。](img/10fig03.jpg)\n\n**图 10.2。Yahoo!\
  \ Weather RSS 馈送网页提供了实时 XML 天气馈送。**\n\n在本章的剩余部分中，你将学习从 Yahoo! Weather 馈送中挖掘天气数据的基础知识，但随时返回此网页自行学习更多。\n\
  \n回到 Forecaster 应用程序的设计，你现在有了一个可以作为 Ajax 天气请求基础的实时天气服务。这些请求都是由于用户点击网页文本中的城市而产生的，而该城市恰好是一个信息链接。这意味着当点击城市时，将显示一个信息窗口，其中包含通过在\
  \ Yahoo! Weather 服务器上进行的 Ajax 请求获取的天气数据。接几节将更详细地探讨此 Ajax 请求。\n\n### 客户端请求\n\n如果你一直在顺序阅读这本书，你可能已经在考虑，获取天气数据的\
  \ Ajax 请求需要一个服务器端脚本，以处理无法从远程服务器请求数据的安全限制。在这种情况下，Yahoo! Weather 服务器确实属于远程服务器。因此，你需要一个\
  \ `PHP` 脚本来充当某种代理，由服务器而不是客户端执行实际的 Yahoo! Weather 请求。\n\n除了服务器上的 `PHP` 脚本外，Forecaster\
  \ 应用程序中的客户端请求并不复杂，因为它必须传递给服务器的唯一信息是目标位置的 `ZIP` 邮编。`ZIP` 邮编用于识别位置，幸运的是 Yahoo! Weather\
  \ 服务能够仅根据 `ZIP` 邮编查询天气信息。因此，生成的 Ajax 客户端请求涉及一个带有 `ZIP` 代码参数的 `PHP` 服务器脚本。\n\n###\
  \ 服务器响应\n\n天气请求的响应以充满有用天气数据的 RSS 文档形式出现。如果你还记得，RSS 格式是一种 `XML` 数据格式，这意味着你可以根据标签名称从从中提取数据，而不需要太大麻烦。这很重要，因为你不会使用\
  \ Ajax 响应中返回的所有信息。\n\n正如你在下一节看到的，Yahoo! Weather 服务交付的标准 Ajax 响应包含的信息比此特定示例所需的要多得多。因此，你需要能够使用服务器脚本提取特定信息，并仅将该信息返回给客户端。鉴于前面提到的安全绕过方法，服务器脚本已经是必不可少的，因此增加少量代码来提取特定的天气数据不会带来太大的挑战。\n\
  \n### 理解客户端到服务器的对话\n\n你现在已经足够了解 Forecaster 应用程序中客户端和服务器的角色，可以可视化一个单个 Ajax 天气请求及其相关响应。图\
  \ 10.3 显示了针对此请求的客户端到服务器的对话。\n\n![Forecaster 应用程序涉及从客户端发送 ZIP 编码并从服务器接收 HTML 天气内容。](img/10fig04.gif)\n\
  \n**图 10.3。Forecaster 应用程序涉及从客户端发送 ZIP 编码并从服务器接收 HTML 天气内容。**\n\n该图揭示了 Ajax 请求如何生成将天气内容回传给浏览器（客户端）的响应。我特意将这些天气信息称为“内容”而不是“数据”，因为它们之间存在细微的。“数据”通常指未以任何特定方式编码或格式化的原始信息，而“内容”通常指经过某种处理的数据。在这一特殊情况下，天气信息被归类为内容，因为它是作为\
  \ `HTML` 代码从服务器返回的，并已准备好在弹出窗口中显示。\n\n回到图中所示的 Ajax 请求，你将位置的 `ZIP` 编码连同 Ajax 请求通过将其封装为\
  \ URL 中的单个参数来传递。以下是一个传递给 PHP 脚本的 URL 示例：\n\n```php\nforecaster.php?zipCode=37205\n\
  ```\n\n这段代码显示负责处理 Ajax 请求的 PHP 脚本位于 `forecaster.php` 文件中。该脚本负责从 Yahoo! 服务器检索天气数据，仅提取所需信息，然后将这些信息返回给客户端。你将在后名为“Forecaster\
  \ 服务器脚本”的节中确切了解到该脚本是如何运作的。\n\n从服务器返回的天气数据实际上比 Forecaster 应用程序所需的要详细得多，这就是为什么服务器脚本只提取了部分数据返回给客户端。恰好\
  \ Yahoo! Weather 服务提供了一块预格式化的天气信息，可以轻松地从剩余天气数据中单独访问。这部分内容被格式化为 `HTML` 代码，已准备好在弹出窗口中显示。以下是该代码的示例：\n\
  \n```html\n<img src=\"http://us.i1.yimg.com/us.yimg.com/i/us/we/52/30.gif\"/>\n\
  <br />\n<b>Current Conditions:</b><br />\nPartly Cloudy, 66 F<br /><br />\n<b>Forecast:</b><br\
  \ />\nWed - Partly Cloudy. High: 69 Low: 42<br />\nThu - Sunny. High: 61 Low: 32<br\
  \ /><br />\n<a href=\"http://weather.yahoo.com/forecast/37205_f.html\">\n  Full\
  \ Forecast at Yahoo! Weather\n</a><br />\n(provided by The Weather Channel)<br />\n\
  ```\n\n如你所见，得益于几个 `HTML` 标签，这段代码已经过格式格式化以便显示。\n\n预格式化的天气信息在主 RSS 天气馈送中使用 `<description>`\
  \ 标签标识。换句话说，你看到的代码被封装在 RSS `XML` 代码中的 `<description>` 和 `</description>` 标签之间。以下是一个简化的\
  \ RSS 天气馈送文档，展示了如何使用 `<description>` 标签：\n\n\n\n\n\n```xml\n<rss version=\"2.0\"\
  \nxmlns:yweather=\"http://xml.weather.yahoo.com/ns/rss/1.0\"\n  xmlns:geo=\"http://www.w3.org/2003/01/geo/wgs84_pos#\"\
  >\n  <channel>\n    <title>Yahoo! Weather - Nashville, TN</title>\n    <link>http://weather.yahoo.com/forecast/37205_f.html</link>\n\
  \    <description>Yahoo! Weather for Nashville, TN</description>\n    ...\n    <item>\n\
  \      <title>Conditions for Nashville, TN at 10:53 am CST</title>\n      <geo:lat>36.11</geo:lat>\n\
  \      <geo:long>-86.68</geo:long>\n      ...\n      <description><![CDATA[\n  \
  \      <img src=\"http://us.i1.yimg.com/us.yimg.com/i/us/we/52/\n          30.gif\"\
  \ /><br />\n        <b>Current Conditions:</b><br />\n        Partly Cloudy, 66\
  \ F<br /><br />\n        <b>Forecast:</b><br />\n        Wed - Partly Cloudy. High:\
  \ 69 Low: 42<br />\n        Thu - Sunny. High: 61 Low: 32<br /><br />\n        <a\
  \ href=\"http://weather.yahoo.com/forecast/37205_f.html\">\n          Full Forecast\
  \ at Yahoo! Weather</a><br />\n        (provided by The Weather Channel)<br />\n\
  \      ]]></description>\n      ...\n    </item>\n  </channel>\n</rss>\n```\n\n\
  这段代码展示了 `<description>` 标签是如何嵌入在天气馈送的 RSS 代码底层的，以及它是如何存储 HTML 编码版本的天气信息的。Forecaster\
  \ 服务端脚本的作用仅仅是提取 `<description>` 标签的内，并将其作为 Ajax 响应返回给客户端。\n\n## 整合 Forecaster 应用程序\n\
  \n除了 Ajax Toolkit 提供的支持功能（如信息弹窗）外，Forecaster 应用程序由两个组件组成：\n\n* HTML 页面 (`forecaster.html`)\n\
  \n* PHP 服务端脚本 (`forecaster.php`)\n\n接下来的两个部分将详细检查这些 Forecaster 拼图的碎片。希望你已经对它们的作用有了相当的了解，甚至可能知道它们是如何实现的。\n\
  \n### Forecaster 页面\n\nForecaster 应用程序的 HTML 页面由的一段文本组成，其中散布着天气信息链接（城市）。从没有任何输入控件的角度来看，该页面简单得具有欺骗性。然而，点击任何链接城市都会发现，Forecaster\
  \ 的功能远比表面看起来要复杂。图 10.4 显示了用户界面的快速预览，这将帮助你理解实现该功能所需的 HTML 代码。\n\n![Forecaster 页面由的一段文本组成，其中散布着用于将城市连接到其各自实时天气信息的链接。](img/10fig05.jpg)\n\
  \n图 10.4.Forecaster 页面由的一段文本组成，其中散布着用于将城市连接到其各自实时天气信息的链接。\n\n以下是图中所示页面 (`forecaster.html`)\
  \ 背后的 HTML 代码：\n\n```\n<body onload=\"initInfoWindow(300, 240)\">\n  <div id=\"\
  ajaxState\" style=\"display:none\"></div>\n  <br />\n  <h2>Forecaster - 穿梭美国</h2>\n\
  \  <p>获得旅行中完整文化体验的绝佳方式是\n    踏上旅程并尽可能覆盖尽可能多的区域。在美国境内，你可以体验到\n    各种气候范围，这往往会让在准备不同类型的\n\
  \    天气方面的规划变得困难。\n\n    例如，假设你的旅程从 <a href=\"#\"\n    class=\"info\" onclick=\"\
  return showInfoWindow(\n    'forecaster.php?zipCode=10001', event)\">纽约市</a>开始，\n\
  \    计划是横跨整个国家并在\n    <a href=\"#\" \n    class=\"info\" onclick=\"return showInfoWindow(\n\
  \    'forecaster.php?zipCode=94129', event)\">旧金山</a>结束。\n    根据季节的不同，你将体验到非常多种不同的天气。如果你的\n\
  \    旅程深入南部，你就会理解为什么 <a href=\"#\"\n    class=\"info\" onclick=\"return showInfoWindow(\n\
  \    'forecaster.php?zipCode=30301', event)\">亚特兰大</a>\n    被亲切地称为“热亚特兰大”（Hotlanta）。向西行驶时，当你经过\n\
  \    <a href=\"#\" \n    class=\"info\"\n    onclick=\"return showInfoWindow(\n\
  \    'forecaster.php?zipCode=73101', event)\">俄克拉荷马城</a>时，\n    需要留心龙卷风。如果你觉得亚特兰大很热，那么你在\n\
  \    <a href=\"#\" \n    class=\"info\" onclick=\"return showInfoWindow(\n    'forecaster.php?zipCode=85003',\
  \ event)\">凤凰城</a>的停靠将称被称为“阳光之谷”。\n  </p>\n</</body>\n```\n\n第一行代码初始化了一个大小为 `300`\
  \ 比 `240` 的弹窗。`ajaxState` `div` 默认是隐藏的。`<h2>` 定义了页面标题。段落包含几个 `<a>` 标签，它们带有不同的参数调用\
  \ `showInfoWindow()` 函数，例如 `forecaster.php?zipCode=10001`、`forecaster.php?zipCode=94129`、`forecaster.php?zipCode=30301`、`forecaster.php?zipCode=73101`\
  \ 和 `forecaster.php?zipCode=85003`。CSS 文件和三个 JavaScript 文件都是书中 Ajax Toolkit 的一部分。\n\
  \n### Forecaster 服务端脚本\n\n由于 Forecaster 应用程序中的天气信息最终是从远程服务器（Yahoo! Weather）加载的，因此无法直接从客户端发出\
  \ Ajax 请求。需要 Forecaster 服务端脚本来绕这一限制并访问远程服务器上的信息。不仅如此，服务端脚本还承担着额外作用，必须提取天气数据的特定部分并仅将该数据返回给客户端。换句话说，客户端不需要\
  \ Yahoo! Weather 馈送的所有内容。\n\nForecaster PHP 服务端脚本期望接收邮政编码，然后它可以使用该编码请求特定位置的天气数据。以下是\
  \ `forecaster.php` 服务端脚本的代码：\n\n```php\n<?php\nheader('Content-Type: text/xml');\n\
  \n// 将 XML 天气数据解析为结构\n$rawFeed =\nfile_get_contents(\"http://weather.yahooapis.com/forecastrss?p=\"\
  \ .\n  $_REQUEST[\"zipCode\"]);\n$xml = new SimpleXmlElement($rawFeed);\necho \"\
  <div>\" . $xml->channel->item->description . \"</div>\";\n?>\n```\n\n\n服务器脚本首先确保响应被处理为\
  \ XML。脚本中的第二部分代码随后从天气服务加载 RSS/XML 天气文档，并确保传递 `zipCode` 参数，以便服务知道天气位置。天气服务返回的原始 XML\
  \ 数据随后被转换为结构化的 XML 对象，这样你就可以轻松地访问各个元素。\n\n代码的最后部分是脚本实际返回天气信息的地方，它作为对 Ajax 天气信息请求的响应。在返回给客户端之前，格式化的\
  \ HTML 天气代码被封装在一个 HTML `div` 元素内部。\n\n在继续之前测试已完成的 Forecaster 应用程序之前，首先对 PHP 脚本本身进行测试非常重要。你已经在之前的章节中看到过这种操作，但对于任何涉及自定义服务器脚本的\
  \ Ajax 应用程序，这始终是一个不可或缺的重要步骤。以下是测试 Forecaster 脚本的示例 URL：\n\n```\nhttp://www.yourdomain.com/forecaster.php?zipCode=94129\n\
  ```\n\n假设 `forecaster.php` 文件存储在你的服务器上，请修改此行代码中的域名以匹配你的域名，然后将 URL 输入到 Web 浏览器中。你也可以直接在随书附赠的演示\
  \ CD 上尝试此技巧。无论你从何处访问脚本，图 10.5 显示了 PHP 脚本生成的 HTML 响应数据。\n\n![你可以通过在浏览器中直接打开脚本来检查\
  \ Forecaster PHP 脚本返回的 HTML 天气信息。](img/10fig06.jpg)\n\n**图 10.5。你可以通过在浏览器中直接打开脚本来检查\
  \ Forecaster PHP 脚本返回的 HTML 天气信息。**\n\n尽管在 Forecaster 脚本的 URL 中尝试不同的 ZIP 编码。这是研究服务器脚本返回的数据的一种极佳方法，确保它与你的预期一致——当你受限于通过客户端\
  \ Web 页面查看所有内容时，服务器脚本问题将变得难追踪得多。\n\n## 测试 Forecaster\n\n测试 Forecaster 应用程序需要大量的技巧和耐心。当然，这还是假设你认为点击几次鼠标是一项艰巨的工作。说真的，这是一个非常容易测试的应用程序，因为你只需要点击页面上的几个链接。图\
  \ 10.6 显示了 Forecaster 应用程序启动时天气弹出窗口是隐藏的。\n\n![Forecaster 应用程序启动时，天气弹出窗口是隐藏的，因为还没有点击任何城市。](img/10fig07.jpg)\n\
  \n**图 10.6。Forecaster 应用程序启动时，天气弹出窗口是隐藏的，因为还没有点击任何城市。**\n\n注意图中页面上没有出现任何天气相关的内容，这意味着天气不会以任何方式干扰主内容。这很重要，因为天气信息旨在是补充和自愿的——随手可用，但根据用户的意愿显示。\n\
  \n点击城市（天气链接）会显示一个带有该城市当地天气状况的天气弹出窗口。但请记住，天气数据是从远程 Web 服务加载的，这并不总是瞬间完成的。图 10.7 显示了在加载天气信息时如何出现一个动画“加载”图标。\n\
  \n![点击页面上的链接时，在加载天气信息期间会出现一个动画“加载”图标。](img/10fig08.jpg)\n\n**图 10.7。点击页面上的链接时，在加载天气信息期间会出现一个动画“加载”图标。**\n\
  \n除非你正在使用老旧的拨号调制调器或 Yahoo! 天气服务遭遇延迟，否则你很快就能看到科罗拉多州丹佛的天气数据，如图 10.8 所示。\n\n![动态加载的丹佛天气信息显示在信息弹出窗口中。](img/10fig09.jpg)\n\
  \n**图 10.8。动态加载的丹佛天气信息显示在信息弹出窗口中。**\n\n丹佛的天气信息被加载并显示在浮在 Forecaster 主页面之上的信息弹出窗口中。这允许你快速查看天气，而无需实际离开页面。当你查看完天气后，只需点击弹出窗口的任何地方，它就会消失。\n\
  \n获取另一个城市的天气状况只需点击城市名称（信息链接）即可。图 10.9 显示了在弹出窗口中显示的佐治亚州亚特兰塔天气。\n\n![佐治亚州亚特兰塔的天气状况与丹佛或页面上的任何其他城市一样容易。](img/10fig10.jpg)\n\
  \n**图 10.9。佐治亚州亚特兰塔的天气状况与丹佛或页面上的任何其他城市一样容易。**\n\n所以 61 华氏度可能并不足以被称为 Hotlanta（热亚特兰塔），但你必须考虑到我们现在讨论的是二月。等七月份回来查看\
  \ Forecaster 应用程序，你就会明白我在说什么。\n\n## 为 Forecaster 进行深度改造\n\n改造 Forecaster 应用程序最快最简单的方法是尝试不同的城市。例如，将\
  \ Web 页面上的一个城市更改为你的家乡，并将城市信息链接中的 ZIP 编码替换为你自己的。具体来说，确保更改传递给 `showInfoWindow()` 函数的\
  \ URL，使其引用你的 ZIP 编码。例如，如果你的 ZIP 编码是 92024（加州恩尼尼亚塔），你将希望将信息链接 `onclick` 事件处理程序中的\
  \ `showInfoWindow()` 函数更改为：\n\n```\nonclick=\"return showInfoWindow('forecaster.php?zipCode=92024',\
  \ event)\"\n```\n\n信息链接在请求天气数据时会将 ZIP 编码传递给天气服务器，因此将在信息弹出窗口中显示你自己的实时天气状况。\n\n\n\n\
  在第一个 `<wind>` 标签中，你可以看到风寒指数、风向和风速。第二个标签（`<atmosphere>`）处理大气状况，如湿度、能见度、气压以及气压上升或下降的程度。最后，第三个标签（`<astronomy>`）提供了该位置的日出和日落时间。为了帮助理解前两个标签，另一个标签指定了天气数据的单位：\n\
  \n```\n<units temperature=\"F\" distance=\"mi\" pressure=\"in\" speed=\"mph\" />\n\
  ```\n\n这行代码让你知道所有温度都以华氏度为单位，距离以英里为单位，气压以英寸为单位，风速以每小时英里为单位。在构建天气数据的自定义视图时，你可以提取这些单位并附加天气数值之后，提供额外的细节并赋予这些数值更大的意义。\n\
  \n## 总结\n\n你无疑已经意识到，Web 上有很多资源可以获取地球上几乎任何位置的实时天气信息。并不容易做到的是将此类信息紧密地关联到你自己的页面中，且又不会损害用户的体验。信息弹窗窗口提供了一种巧妙的机制，可以在你的页面上下文中显示天气数据，而无需用户离开页面。Forecaster\
  \ 应用程序很好地演示了在自己的页面中包含特定位置的实时天气数据是多么简单。\n\n# 第 11 章构建一个 Ajax 运计算器\n\n### 高海拔的 Ajax\n\
  \n![Ajax at High Altitude](img/note.jpg)\n\n如果你热于高档滑雪，你可能熟悉应用于山地中的 Ajax。阿斯彭山位于科罗拉多州华华的小镇阿斯彭（Aspen）的正南方，是阿斯彭/斯诺韦马斯（Aspen/Snowmass）滑雪场所在地。当地有时将阿斯彭山称为\
  \ Ajax。\n\n你难道不厌倦在线购物体验中的这一部分吗：你对购买某物品感兴趣，但需要知道运费以判断是否真的划算？问题在于，大多数购物车在结账流程的最后一步之前（在你输入了姓名、地址、出生日期、母亲母姓、童年最喜爱的宠物以及他们能从你那里获得的任何其他个人数据之后）都不会告知你运费。如果在结算过程早期（肯定在输入信用卡信息之前）就能获得运费，最好在不需要刷新页面的情况下，该有多好？正如你可能猜到的那样，Ajax\
  \ 提供了一种更好的方法。\n\n本章通过向你展示如何使用 Ajax 在用户毫无察觉的情况下动态确定运费，解决了运费问题。不仅如此，运费是直接从美国邮政（U.S.\
  \ Postal Service）的运费 Web 服务获取的，这意味着你不需要进行猜测或处理可能过时的查找表——你正在直接从源头获取信息。本章中的 Shipper\
  \ 示例应用程序结论性地展示了 Ajax 如何优雅地解决常见问题，并悄悄提升任何涉及运费计算的 Web 应用程序的体验。\n\n本章中的 Shipper 应用程序使用了以下文件，它们位于带有书籍的实时\
  \ Linux 光盘的 `chap11` 示例代码文件夹中：\n\n* `shipper.html`——主 Web 页面\n* `shipper.php`——用于加载运费的服务器脚本\n\
  * `ajaxkit.js`——Ajax Toolkit 的核心 Ajax 函数\n* `domkit.js`——Ajax Toolkit 的与 DOM 相关的函数\n\
  * `wait.gif`——在加载运费时显示的动画“加载”图标\n\n### 挑战：获取实时运费\n\n本章的挑战在理论上很简单，但在实践中有些棘手。这种棘手源于用于获取运费信息的\
  \ Web 服务其访问并不像你在书中看到的某些其他 Web 服务那样简单。更具体地说，本章中的 Shipper 应用程序使用美国邮政 Web 工具（USPS Web\
  \ Tools）来检索运费。问题在于 USPS 的 Web 服务要求你提交一份相当详细的 XML 文档以获取运费。\n\n当然，考虑到决定运输物品的成本涉及几项信息时，这不应该太令人惊讶。你有起点和目的地（邮政编码），以及有关物品本身的细节，如尺寸和重量。然后你必须从几种可能的运输方案中进行选择，例如包裹邮（Parcel\
  \ Post）或优先邮件（Priority Mail）。所有这些信息都必须仔细封装在 USPS Web 服务能够理解的 XML 文档中。\n\n为了让 Shipper\
  \ 应用程序具有实用感，它的用户界面模拟了一个购物车，在其中你已经选择了一个特定物品进行购买，并准备好结账。然而，为了保持简单，你无法对购物车的内容进行控制。换句话说，Shipper\
  \ 应用程序专门关注接收目的地的运输信息，以便能够动态计算运费。构建一个功能完整的购物车超出了本章的范围。\n\n尽管在 Shipper 应用程序中购物车的内容无法由用户操作，但目的地邮政编码和运输方式都是可以更改的。这让我们看到了\
  \ Ajax 的用场。每当邮政编码或运输方式发生时，就会对 USPS Web 服务发出一个 Ajax 请求以获取新的运费并更新购物车。你能够更新购物车是因为应用程序已经知道了购物车中物品的费用。因此，这仅仅是将物品价格加到运费中以显示购物车的总额的问题。\n\
  \n再次，尽管应用程序提供了功能完整的购物车的错觉，但它实际上只是在使用静态购物车数据结合动态运输信息（邮政编码和运输方式），通过 Ajax 获取运费并更新总价。这使得挑战紧紧围绕核心主题——使用\
  \ Ajax 从 USPS 服务动态检索运费。\n\n## 设计：设计一个运输应用程序\n\n由于 Shipper 应用程序试图模拟购物车，因此它的某些用户界面元素纯是装饰性的，不会直接影响功能。图\
  \ 11.1 显示了应用程序界面的草图，并说明了哪些字段在检索和显示运费信息中起着直接作用。\n\n![Shipper 应用程序的用户界面包含输入邮政编码和查看结果运费的字段，等等。](img/11fig01.gif)\n\
  \n**图 11.1. Shipper 应用程序的用户界面包含输入邮政编码和查看结果运费的字段，等等。**\n\n该图显示了几个输入字段，但只有两个字段（邮政编码和运输方式）直接影响运费的计算。这种运费计算涉及将邮政编码、运输方式以及有关运输物品的其他详细信息提交给\
  \ USPS Web 服务以获取国内运率。\n\n\n\n\n\n由于用户完全有可能输入无效的邮编码，从而不会产生运费，因此在邮编码旁边使用了一个帮助文本显示字段，用于告知用户邮编码是否存在问题。如果服务器返回的运费为\
  \ `0`，则该字段会被设置，这表示邮编码存在问题。\n\nShipper 应用中另一个图中未标出的细微之处是使用了一个带动画的“加载”图像来指示 Ajax 请求的状态。当在\
  \ USPS 服务器上查询运费时，该图像会出现在运费费用显示的位置。图 11.2 来让用户知道 Ajax 请求正在处理。\") 显示了这张小图像 `wait.gif`\
  \ 的外观。\n\n![Shipper 应用使用了一个微小的动画“加载”图像 (wait.gif) 来让用户知道 Ajax 请求正在处理。](img/11fig02.jpg)\n\
  \n**图 11.2。Shipper 应用使用了一个微小的动画“加载”图像（`wait.gif`）来让用户知道 Ajax 请求正在处理。**\n\n由于用户在处理运费请求时可能仍在忙于输入信息，因此没有必要让“加载”图像在页面上变得显眼。这就是为什么它出现在运费显示的位置。当然，这意味着运费字段承担了双重职责，但这并没有引起问题。只需知道，在没有请求时，该字段持有实际运费，而在请求期间它会显示“加载”图像即可。\n\
  \n尽管 Shipper 应用的用户界面中有大量的输入字段，但请记住，只有其中两个字段（邮编码和运费方式）直接影响运费 Ajax 请求。而且只有另外少数字段（运费和订单总额）会影响请求的运费信息的显示结果。\n\
  \n所以，尽管该应用程序看起来相当复杂，但它实际上只处理一个 Ajax 请求，这极大地简化了问题。你现在准备好进一步了解一下运费 Ajax 请求了。\n\n###\
  \ 客户端请求\n\nShipper 应用的客户端请求是你在书中遇到的最棘手的 Ajax 请求之一，因为它负责向服务器传递相当大量的信息。然而，在深入这些信息的细节之前，让我们快速处理一下这样一个事实：我们正在处理一个远程\
  \ Web 服务器。\n\n正如你从许多其他示例应用程序中所回的，出于安全考虑，无法直接在第三方（远程）Web 服务器上发处 Ajax 请求。绕过这一限制的方法是使用自己的服务器脚本作为基础，将请求转发到远程服务器，这是被允许的，因为服务器与服务器之间的通信被认为是完全合法的。事实证明，在这种情况下，由于\
  \ Ajax 安全限制之外的原因，还需要服务器脚本，所以无论如何都会处理一个 PHP 脚本。\n\n我已经提到过，Shipper 应用只需要传递邮编码和运费方式即可从\
  \ USPS Web 服务器获取实时运费。虽然从应用程序的角度来看可能是这样，但从 USPS 的角度来看，完全不是如此。为了确定邮寄物品的成本，需要多得的信息。具体来说，USPS\
  \ 国内费率 Web 服务需要以下信息才能成功返回运费：\n\n*   用户 ID\n*   密码\n*   运费方式\n*   起始地邮编码\n*   目的地邮编码\n\
  *   物品重量（磅）\n*   物品重量（盎司）\n*   容器类型\n*   尺寸\n*   可机器处理（正常包裹限制范围内）\n\n前两项信息是你的 USPS\
  \ Web Tools 账户的用户 ID 和密码，这些对于甚至测试 Shipper 应用都是必要的。事实上，在运行应用程序之前，你必须先获取自己的用户 ID。正如我之前所说的，USPS\
  \ 对访问其 Web 服务的限制比你在书中遇到的其他服务要严格得多。反之，你可以从服务器脚本安全地引用你的 USPS 用户 ID 和密码，而不是从客户端 Web\
  \ 页面，这为 Shipper 应用提供了额外的安全措施。\n\n### 注意\n\n![注意](img/note.jpg)\n\n出于测试目的，你可能只分配了一个用户\
  \ ID 而没有密码，这意味着在发布运费费率请求时可以留空密码。\n\n你对接下来的信息应该有了相当的了解，因为我们已经讨论过很多运费方式和邮编码。不过，值得指出的是，Shipper\
  \ 应用将起始邮编码“硬编码”为 USPS 测试所需的特定测试邮编码。在生产环境中，你会将此邮编码更改为发送包裹的邮编码。\n\n### 注意\n\n![注意](img/note.jpg)\n\
  \n当我说应用程序“硬编码”某项信息时，我仅仅是指应用程序在内部设置了该信息，而不是允许用户选择或输入它。这在 Shipper 应用中主要是一种简化，尽管在生产应用程序中，某些硬编码信息也不可能更改。\n\
  \n传递给 USPS Web 服务的两个重量对于将包裹重量分解为不同的单位组件是必要的。这些重量是一起使用的，这意味着一个 4 磅 3 盎司的包裹会导致 `pounds`\
  \ 值为 4，`ounces` 值为 3。换句话说，这并不是让你提供不同单位的总重量。另一个例子是，如果包裹重量为 6 磅 0 盎司，那么 `pounds` 值为\
  \ 6，`ounces` 值为 0。Shipper 应用再次硬编码了这些值，因为它在模拟购物车，并假设你在结账过程的此时已经选择了一个物品。\n\n容器类型描述了盛放包裹的容器，为了测试目的，必须设置为“Flat\
  \ Rate Box”（固定费率箱）。虽然你可能想在生产环境中加入其他容器类型，但 Flat Rate Box 涵盖了大量的包裹。这是 Shipper 应用中硬编码的另一个信息。\n\
  \n包裹尺寸必须对应 USPS 实施的标准包裹尺寸标记之一。为了测试目的，你必须将包裹尺寸设置为“Large”（大号）。并不意外，这条信息在 Shipper 应用中是硬编码的。\n\
  \n你需要传递给 USPS Web 服务的最后一项信息是包裹是否“可机器处理”（machinable），这指的是包裹是否符合某些可预测的限制。不可机器处理的包裹包括巨大的包裹、形状不规则的容器以及你没有寄送合理尺寸的平板或箱形容器的其他场景。为了测试目的，你必须指定包裹是可机器处理的。我确定你猜到了——请求信息中的可机器处理部分在\
  \ Shipper 应用中是硬编码的。\n\n我不期望你记住 USPS 运费费率 Ajax 请求所需的各种不同信息。稍后你会再次看到它们时，那时你将探索用于为\
  \ USPS 服务器格式化这些信息的特定 XML 代码。\n\n### 服务器响应\n\n\n\n\n\n正如 USPS 国内费率 Web 服务期望 XML 文档作为计算运费的基础一样，它也会以\
  \ XML 文档的形式返回费率。事实上，它通常用于一次性返回多个运率，在这种情况下，就由处理请求的应用程序负责提取所需的任何特定费率。在 Shipper 应用程序中，则由\
  \ `PHP` 服务器脚本负责接收 `USPS` XML 响应数据并对其进行筛选以找到所需的运率。\n\n下一节将更深入探讨与 USPS 国内费率 Web 服务往来传输的数据，包括作为\
  \ USPS 服务器响应返回的特定 XML 数据。\n\n### 理解客户端到服务器的对话\n\nShipper 应用程序中的 Ajax 请求用于将用户输入的邮政编码和运输方式发送到服务器，连同其他几项固定的\
  \ USPS 运费信息。作为回报，`PHP` 服务器脚本向 Shipper 客户端 Web 页面返回单一运费。图 11.3 有助于直观地澄清这种数据传输。\n\n\
  ![Shipper 应用程序涉及发送到服务器的几项运费信息和返回给客户端的单一运率。](img/11fig03.gif)\n\n**图 11.3. Shipper\
  \ 应用程序涉及发送到服务器的几项运费信息和返回给客户端的单一运率。**\n\n在我们进一步研究 Shipping 应用程序的细节之前，非常重要的一点是：在允许使用生产服务器之前，任何使用\
  \ USPS Web Tools 的应用程序都必须在 USPS 测试服务器上进行测试。在实际操作中，这意味着你在测试应用程序时，受限于一组非常特定的测试数据。这意味着你即将看到的\
  \ Shipper 应用程序测试数据并不是随机的——它们是 USPS 专门为配合其测试服务器提供的。\n\n### 注意\n\n![注意](img/note.jpg)\n\
  \n如果你在运行 USPS 测试服务器时偏离了标准的 USPS 测试数据，Shipper 应用程序将无法工作。在通过 USPS 验证并获得其生产服务器权限之前，你无法尝试全范围的测试数据（邮编码）。关于如何获得验证，你可以在本章节稍后的“为\
  \ Shipper 进行极端的 Ajax 改造”部分了解更多信息。\n\nUSPS 施加的测试数据甚至限制你只能使用特定的起始邮政编码和特定的目的邮政编码。这是一个使用标准\
  \ USPS 测试数据集获取 Shipper 应用程序运率数据的 Ajax 请求 URL 示例：\n\n```\nshipper.php?userID=YOURUSPSUSERID&origZip=10022&destZip=20008&\n\
  weightLb=10&weightOz=5&container=Flat%20Rate%20Box%20&\nsize=Large&mailService=Priority%20Mail\n\
  ```\n\n首先，要理解这是一个长 URL，尽管它在页面上被分成了多行。所有的信息你至少应该模糊感到熟悉，因为你已经学习了 USPS 国内费率运请求所需的各个部分。我还没有完全解释的是用户\
  \ ID，你会注意到它被设置为 `YOURUSPSUSERID`。你可能还会注意到 URL 中没有指定密码。这是怎么回事？\n\n为了访问 USPS Web Tools，你必须拥有一个由\
  \ USPS 发放给自己的用户 ID，USPS 对用户 ID 的共享非常严格。这就是为什么我不能直接把我的 ID 打印在这里给你使用。因此，在继续操作之前，我鼓励你在\
  \ [`www.usps.com/webtools/`](http://www.usps.com/webtools/) 免费注册你自己的 USPS Web Tools\
  \ 用户 ID。获取此 ID 后，你就可以将其插入刚刚看到的 URL 中以完成一个 Shipper Ajax 请求 URL。\n\n在 USPS Web 服务应用程序的测试阶段，不需要提供密码，这就是为什么\
  \ URL 中没有指定密码。在生产环境中，你肯定会使用密码；`shipper.php` 服务器脚本通过请求 URL 中的 `password` 参数接受密码。\n\
  \n此时，重要的是区分在你的服务器上发出的 Ajax 请求 URL 和在 USPS 服务器上发出的 USPS 请求 URL。前者用于将数据传递给你的 `shipper.php`\
  \ 服务器脚本，而后者用于在你的 `shipper.php` 服务器脚本内部，在 USPS 服务器上执行实际的运率查询。因此，`shipper.php` 脚本驻留在你的服务器上，负责通过\
  \ URL 接收运费参数，然后使用它们构建另一个 URL，从而将查询传递到 USPS 服务器。\n\n你刚刚看到了 Ajax 请求的 URL，现在让我们关注 USPS\
  \ 请求，它期望运费信息被格式化为 XML：\n\n```\nhttp://testing.shippingapis.com/ShippingAPITest.dll?API=RateV2&\n\
  XML=<RateV2Request%20USERID=\"YOURUSPSUSERID\"%20PASSWORD=\"\">\n<Package%20ID=\"\
  0\"><Service>All</Service><ZipOrigination>10022\n</ZipOrigination><ZipDestination>20008</ZipDestination><Pounds>\n\
  10</Pounds><Ounces>5</Ounces><Container>Flat%20Rate%20Box%20&\nsize=Large&mailService=Priority%20Mail\n\
  </Package></RateV2>\n```\n\n哎！我知道你觉得 XML 看起来很乱。在 URL 中挤在一起确实如此。让我们添加一些换行和制表符，以更传统的方式显示它：\n\
  \n```\nhttp://testing.shippingapis.com/ShippingAPITest.dll?API=RateV2&\nXML=<RateV2Request%20USERID=\"\
  YOURUSPSUSERID\"%20PASSWORD=\"\">\n  <Package%20ID=\"0\">\n    <Service>All</Service>\n\
  \    <ZipOrigination>10022</ZipOrigination>\n    <ZipDestination>20008</ZipDestination>\n\
  \    <Pounds>10</Pounds>\n    <Ounces>5</Ounces>\n    <Container>Flat%20Rate%20Box%20</Container>\n\
  \    <Size>Large</Size>\n    <mailService=Priority%20Mail\n  </Package>\n</RateV2Request>\n\
  ```\n\n现在 USPS 请求应该更有意义了。这一切是因为 Ajax 请求数据现在被格式化为符合 USPS 国内费率格式的 XML 文档。只有两个部分没有直接对应你传递的数据：`<Service>`\
  \ 和 `<Machable>` ，它们表示你想获取所有方式（服务）的运率，并且包裹确实可以机器处理（包装方面没有异常）。\n\n向 USPS 服务器发出此请求后，返回一个不同的\
  \ XML 文档：\n\n```\n<RateV2Response>\n  <Package ID=\"0\">\n    <ZipOrigination>10022</ZipOrigination>\n\
  \    <ZipDestination>20008</ZipDestination>\n    <Pounds>10</Pounds>\n    <Ounces>5</Ounces>\n\
  \    <Size>LARGE</Size>\n    <Machinable>TRUE</Machinable>\n    <Zone>3</Zone>\n\
  \    <Postage>\n      <MailService>Express Mail to PO Addressee</MailService>\n\
  \      <Rate>39.20</Rate>\n    </Postage>\n    <Postage>\n      <MailService>Priority\
  \ Mail</MailService>\n      <Rate>8.95</Rate>\n    </Postage>\n    <Postage>\n \
  \     <MailService>Parcel Post</MailService>\n      <Rate>7.80</Rate>\n    </Postage>\n\
  \    <Postage>\n      <MailService>Bound Printed Matter</MailService>\n      <Rate>3.53</Rate>\n\
  \    </Postage>\n    <Postage>\n      <MailService>Media Mail</MailService>\n  \
  \    <Rate>5.14</Rate>\n    </Postage>\n    <Postage>\n      <MailService>Library\
  \ Mail</MailService>\n      <Rate>4.91</Rate>\n    </Postage>\n  </Package>\n</RateV2Response>\n\
  ```\n\n\n\n\n此响应文档重复了原始请求的某些信息，但也包含了大量的运费信息。事实上，由于请求指定了 `All` 为运费方式，响应包含了所有可能的运费方式的费率。由于运费是以\
  \ XML 格式提供的，因此在 PHP 代码中提取特定费率并不困难。例如，`server.php` 脚本在查询 `Priority Mail`（优先邮件）运费方式时，会在响应中返回以下这段数据：\n\
  \n```\n8.95\n```\n\n希望你现在开始了解数据在 Shipper 应用程序中是如何往来传输的。为了确保你没有迷失在 URL 和 XML 代码的旋涡中，这里是该流程工作原理的总结：\n\
  \n1. 你的客户端网页通过一个包含运费信息的 URL 向你的 PHP 服务器脚本发送 Ajax 请求。\n2. 你的 PHP 服务器脚本构建另一个包含 XML\
  \ 运费信息的 URL，并向 `USPS Domestic Rates`（US 国内国内）Web 服务发送请求。\n3. `USPS Domestic Rates`\
  \ Web 服务返回一个包含所有运费费率的 XML 文档。\n4. 你的 PHP 服务器脚本解析出所需运费方式的费率，并将其返回给你的客户端网页。\n5. 结束。\n\
  \n但这并不是真正的结束，因为你甚至还没有看到实现这一切的代码。显然，是时候将所有部分整合在一起了。\n\n## 组装 Shipper 应用程序\n\n尽管看起来是一个相当复杂的数据通信模型，但\
  \ Shipper 应用程序在组件方面其实非常简单。事实上，除了标准的 Ajax Toolkit 文件外，应用程序中仅包含两个文件：\n\n* HTML 网页\
  \ (`shipper.html`)\n* PHP 服务器脚本 (`shipper.php`)\n\n接下来的几节将更详细地探索 Shipper 应用程序中这块拼图的两个部分。\n\
  \n### Shipper 网页\n\n用于 Shipper 应用程序的 HTML 网页由几个文本输入字段组成，允许用户输入运费信息。这些字段中的大部分是装饰性的，用于支持购物车结账的概念。ZIP\
  \ 编码（邮政编码）字段在应用程序的功能中显然起着重要作用，运费方式选择框也是如此。图 11.4 显示了 Shipper 应用程序在使用无效 ZIP 编码的情况，从而显示了\
  \ ZIP 编码输入控件右侧的错误消息显示区域。\n\n![Shipper 网页包含多个输入控件和显示区域，尽管邮政编码输入和运费输出字段是目前最重要的。](img/11fig04.jpg)\n\
  \n**图 11.4. Shipper 网页包含多个输入控件和显示区域，尽管邮政编码输入和运费输出字段是目前最重要的。**\n\n结合图中所示的 Shipper\
  \ 应用程序布局，请查看 `shipper.html` 网页 `body` 的 HTML 代码：\n\n```html\n<body onload=\"initForm()\"\
  >\n  <div id=\"ajaxState\" style=\"display:none\"></div>\n  <br />\n  <table width=\"\
  500px\">\n    <tr>\n      <td class=\"heading\" colspan=\"3\">Shipping Information</td>\n\
  \    </tr>\n    <tr>\n      <td class=\"label\">Name:</td>\n      <td class=\"value\"\
  \ colspan=\"2\"><input type=\"text\"\n        id=\"name\" size=\"30\" /></td>\n\
  \    </tr>\n    <tr>\n      <td class=\"label\">Address 1:</td>\n      <td class=\"\
  value\" colspan=\"2\"><input type=\"text\"\n        id=\"addr1\" size=\"30\" /></td>\n\
  \    </tr>\n    <tr>\n      <td class=\"label\">Address 2:</td>\n      <td class=\"\
  value\" colspan=\"2\"><input type=\"text\"\n        id=\"addr2\" size=\"30\" /></td>\n\
  \    </tr>\n    <tr>\n      <td class=\"label\">City:</td>\n      <td class=\"value\"\
  \ colspan=\"2\"><input type=\"text\"\n        id=\"city\" size=\"20\" /></td>\n\
  \    </tr>\n    <tr>\n      <td class=\"label\">State/Province/Region:</td>\n  \
  \    <td class=\"value\" colspan=\"2\"><input type=\"text\"\n        id=\"state\"\
  \ size=\"3\" /></td>\n    </tr>\n    <tr>\n      <td class=\"label\">ZIP/Postal\
  \ Code:</td>\n      <td class=\"value\"><input type=\"text\" id=\"zipCode\" size=\"\
  10\"\n        onchange=\"getShipRate()\" /></td>\n      <td class=\"label\" width=\"\
  50%\"><span id=\"zipCodeErr\"\n        style=\"font-size:80%; color:#BB0000;\"></span></td>\n\
  \    </tr>\n    <tr>\n      <td class=\"label\">Country:</td>\n      <td class=\"\
  value\" colspan=\"2\"><input type=\"text\"\n         id=\"country\" size=\"25\"\
  \ value=\"USA\"\n         readonly=\"readonly\" /></td>\n    </tr>\n    <tr>\n \
  \     <td class=\"label\">Phone Number:</td>\n      <td class=\"value\" colspan=\"\
  2\"><input type=\"text\" id=\"phone\"\n        size=\"10\" /></td>\n    </tr>\n\
  \  </table>\n  <br />\n  <table width=\"500px\">\n    <tr>\n      <td class=\"heading\"\
  >Order Summary</td>\n    </tr>\n    <tr>\n      <td class=\"label\">Item:</td>\n\
  \      <td class=\"value\"><span id=\"item\"></span></td>\n      <td class=\"value\"\
  ><span id=\"price\"></span></td>\n    </tr>\n    <tr>\n      <td class=\"label\"\
  >Shipping & Handling:</td>\n      <td class=\"value\">\n        <select id=\"mailService\"\
  \ onchange=\"getShipRate()\">\n          <option value=\"Parcel Post\">Parcel Post</option>\n\
  \          <option value=\"Priority Mail\" selected=\"selected\">Priority Mail</option>\n\
  \          <option value=\"Express Mail to Addressee\">Express Mail to Addressee</option>\n\
  \        </select>\n      </td>\n      <td class=\"value\"><span id=\"shiprate\"\
  >0.00</span></td>td>\n    </tr>\n    <tr>\n      <td class=\"label\">Total:</td>\n\
  \      <td class=\"value\"></td>\n      <td class=\"value\"><span id=\"total\">0.00</span></td>td>\n\
  \    </tr>\n    <tr>\n      <td colspan=\"3\" align=\"center\"><input type=\"button\"\
  \ value=\"Proceed with Checkout\" /></td>\n    </tr>\n  </table>\n</body></body>\n\
  ```\n\n大部分 HTML 代码都用于各个标签和文本框。唯一有意义的字段是 ZIP 编码输入，它在 `onchange` 事件处理程序中调用了 `getShipRate()`\
  \ 函数。为了方便你在长列表中找到它，再次列出此代码：\n\n```html\n<input type=\"text\" id=\"zipCode\" size=\"\
  10\"\nonchange=\"getShipRate()\" />\n```\n\n紧随 ZIP 编码 `input` 元素之后一个用于显示错误消息的 `span`\
  \ 元素。你需要向下跳过部分代码才能遇到另一个感兴趣的项目，即运费服务选择列表。该列表包含三个选项（包裹邮件、优先邮件和快递邮件），并在响应 `onchange`\
  \ 事件时也会调用 `getShipRate()` 函数。这里单独列出该列表：\n\n```html\n<select id=\"mailService\" onchange=\"\
  getShipRate()\">\n  <option value=\"Parcel Post\">Parcel Post</option>\n  <option\
  \ value=\"Priority Mail\" selected=\"selected\">Priority Mail</option>\n  <option\
  \ value=\"Express Mail to Addressee\">Express Mail to Addressee</option>\n</select>\n\
  ```\n\n在运费服务选择列表之后，你会发现几个用于显示运费请求结果的 `span` 元素。ID 为 `shiprate` 的 `span` 用于存储实际运费，而\
  \ ID 为 `total` 的元素则用于在获取运费后显示订单总额。\n\n最后，代码末尾的“继续结账”按钮只是为了装饰，用以指示完成在线订单还有一个最后的步骤。\n\
  \n回到 Shipper 网页 `body` HTML 代码的开头，你可能注意到 `body` 的 `onload` 事件处理程序中有一个对 `initForm()`\
  \ 函数的调用。这是该函数的代码：\n\n```javascript\nfunction initForm() {\n  replaceText(document.getElementById(\"\
  item\"), itemDesc);\n  replaceText(document.getElementById(\"price\"), itemPrice);\n\
  }\n```\n\n\n\n\n这段代码的作用是在页面首次加载时，初始设置页面上商品描述和价格的值。这两项信息都不会以任何直接方式影响运费，尽管价格会影响订单总额的计算。\n\
  \n商品描述和价格是硬编码在 Web 页面中的，还包括其他几个与运输相关的变量。以下是为这些变量赋值的代码：\n\n```\nvar origZip = \"\
  10022\"; // Origination ZIP code\nvar itemDesc = \"Popcorn Holiday Feast\";\nvar\
  \ itemPrice = 29.99;\nvar weightLb = \"10\";\nvar weightOz = \"5\";\nvar container\
  \ = \"Flat Rate Box\";\nvar size = \"Large\";\n```\n\n注意这些与运输相关的数据是如何被刻意设置用以与本章节之前提到的\
  \ USPS 测试数据匹配。这对于测试目的非常重要，因为 USPS 测试服务器不会接受任何其他数据。\n\n之前我提到了 `getShipRate()` 函数，该函数被调用以发起获取运费的\
  \ Ajax 请求。以下是该函数的代码：\n\n```javascript\nfunction getShipRate() {\n  // 显示等待图像\n \
  \ document.getElementById(\"shiprate\").innerHTML =\n    \"<img src='wait.gif' alt='Looking\
  \ up shipping rate...' />\";\n\n  // 组装运输信息请求字符串\n  var shipInfo = \"userID=YOURUSPSUSERID\"\
  \ +\n    \"&origZip=\" + encodeURIComponent(origZip) +\n    encodeURIComponent(\n\
  \    document.getElementById(\"zipCode\").value) +\n    \"&weightLb=\" + encodeURIComponent(weightLb)\
  \ +\n    \"&weightOz=\" + encodeURIComponent(weightOz) +\n    \"&container=\" +\
  \ encodeURIComponent(container) +\n    \"&size=\" + encodeURIComponent(size) +\n\
  \    \"&mailService=\" +\n    encodeURIComponent(\n    document.getElementById(\"\
  mailService\").value);\n  ajaxSendRequest(\"GET\", \"shipper.php?\" + shipInfo,\n\
  \    handleRequest);\n}\n```\n\n函数的第一个任务是设置 `shiprate` 元素，以便显示“加载”图像（`wait.gif`）。显示“加载”图像后，该函数继续组装运输信息，这些信息以\
  \ URL 的形式存在，并通过 `GET` 请求提交到 `shipper.php` 服务器脚本。非常重要的一点是，你必须修改这段代码，在分配 `userID`\
  \ 参数时包含你自己的唯一用户 ID。换句话说，将 `YOURUSPSUSERID` 更改为你注册 USPS Web Tools 时提供的 ID。\n\nAjax\
  \ 运输请求由 `handleRequest()` 函数处理，该函数负责从服务器脚本接收单一运费并相应更新页面。以下是该函数的代码：\n\n```javascript\n\
  function handleRequest() {\n  ajaxUpdateState();\n  if (request.readyState == 4\
  \ && request.status == 200) {\n    var shipRate = request.responseText;\n    if\
  \ (parseFloat(shipRate) != 0.0) {\n      replaceText(document.getElementById(\"\
  zipCodeErr\"), \"\");\n      updateTotal(shipRate);\n    }\n    else {\n      replaceText(document.getElementById(\"\
  zipCodeErr\"),\n        \"Cannot ship to this ZIP code.\");\n      updateTotal(\"\
  0.00\");\n    }\n  }\n}\n```\n\n这个函数对于一个 Ajax 请求处理器来说相当简单，主要涉及将运费转换为浮点数，然后调用 `updateTotal()`\
  \ 计算订单总额。页面的错误消息区域也进行了设置：如果请求失败则显示消息，如果请求成功则清除消息。\n\n稍等一下， Shipper Web 页面的代码快要写完了。以下是你最后需要了解的代码，即\
  \ `updateTotal()` 函数：\n\n```javascript\nfunction updateTotal(shipRate) {\n  document.getElementById(\"\
  shiprate\").innerHTML = shipRate;\n  var total = itemPrice + parseFloat(shipRate);\n\
  \  replaceText(document.getElementById(\"total\"), \"$\" + total);\n}\n```\n\n`updateTotal()`\
  \ 函数接受一个新的运费作为其唯一参数，然后根据该率更新页面并计算新的订单总额。这段代码中一个初看之下可能让人困惑的细节是 `innerHTML` 与 `replaceText()`\
  \ 函数的使用区别。理想情况下，你应该只使用 `replaceText()`，因为它不会改变底层 HTML 代码的结构。然而，由于运费 `span` 元素兼具费率显示和“加载”图像显示的双重功能，这意味着你必须使用\
  \ `innerHTML`。这是因为在文本和图像之间切换确实会改变 HTML 代码的结构，而仅使用 `replaceText()` 函数是无法实现的。\n\n\
  ### Shipper 服务器脚本\n\n考虑到 Shipper 应用程序客户端的需求，是时候将注意力转向服务器端了。你已经了解到 `shipper.php`\
  \ 脚本的作用是使用传递给它的运输信息组装一个 XML 文档，提交给 USPS 国内费率 Web 服务。然后它必须获取返回的响应 XML 文档并从中提取特定的运费。\n\
  \n尽管听起来可能需要大量的混乱代码，但 Shipper 应用程序的 PHP 服务器脚本实际上并不复杂，如下代码所示：\n\n```php\n// 为 USPS\
  \ 服务器请求生成 XML 文档\n$uspsRequest =\n  \"http://testing.shippingapis.com/ShippingAPITest.dll?\"\
  ;\n$uspsRequest .= \"API=RateV2&XML=\";\n$uspsRequest .= \"<RateV2Request%20USERID=\\\
  \"\";\n$uspsRequest .= $_REQUEST[\"userID\"];\n$uspsRequest .= \"\\\"%20PASSWORD=\\\
  \"\";\n$uspsRequest .= $_REQUEST[\"password\"] . \"\\\">\";\n$uspsRequest .= \"\
  <Package%20ID=\\\"0\\\"><Service>\" . \"All\";\n$uspsRequest .= \"</Service>\";\n\
  $uspsRequest .= \"<ZipOrigination>\" . $_REQUEST[\"origZip\"];\n$uspsRequest .=\
  \ \"</ZipOrigination>\";\n$uspsRequest .= \"<ZipDestination>\" . $_REQUEST[\"destZip\"\
  ];\n$uspsRequest .= \"</ZipDestination>\";\n$uspsRequest .= \"<Pounds>\" . $_REQUEST[\"\
  weightLb\"] . \"</Pounds>\";\n$uspsRequest .= \"<Ounces>\" . $_REQUEST[\"weightOz\"\
  ] . \"</Ounces>\";\n$uspsRequest .= \"<Container>\" . urlencode($_REQUEST[\"container\"\
  ]);\n$uspsRequest .= \"</Container>\";\n$uspsRequest .= \"<Size>\" . $_REQUEST[\"\
  size\"] . \"</Size>\";\n$uspsRequest .= \"<Machable>\" . \"true\" . \"</Machable>\"\
  ;\n$uspsRequest .= \"</Package></RateV2Request>\";\n```\n\n这段代码并不是整个 PHP 脚本，但它是最大的部分，负责从传递给脚本的运输信息组装\
  \ XML 文档。\n\n请求 XML 文档准备就绪后，脚本发送请求并接收一个响应 XML 文档：\n\n```php\n// 将运输响应数据解析为结构\n$rawShipping\
  \ = file_get_contents($uspsRequest);\n$xml = new SimpleXmlElement($rawShipping);\n\
  ```\n\n你现在已经将 XML 响应数据存储在 PHP 变量 `$xml` 中，并准备好解析出与 `mailService` 参数传递的运输方法匹配的运费：\n\
  \n```php\n// 返回对应邮件服务的费率\n$rate = 0;\nif ($xml->Package->Postage != null) {\n  foreach\
  \ ($xml->Package->Postage as $postage) {\n    if ($postage->MailService == $_REQUEST['mailService'])\
  \ {\n      $rate = $postage->Rate;\n      break;\n    }\n  }\n}\necho $rate;\n```\n\
  \n这段代码遍历响应 XML 文档寻找 `<Postage>` 标签。在找到每个 `<Postage>` 标签中，检查子标签 `<MailService>` 的内容是否与指定的邮件服务（例如优先邮件）匹配。如果匹配，则从脚本返回\
  \ `<Rate>` 标签的内容供客户端处理。\n\n\n\n\n\n```\nhttp://www.yourdomain.com/shipper.php?userID=YOURUSPSUSERID&\n\
  origZip=10022&destZip=20008&weightLb=10&weightOz=5&container=\nFlat%20Rate%20Box&size=Large&mailService=Priority%20Mail\n\
  ```\n\n假设 `shipper.php` 文件存储在您的服务器上，请将此行代码中的域名更改为与您的匹配匹配，并将 `YOURUSPSUSERID` 替换为您的用户\
  \ ID，然后将 URL 输入到浏览器中。或者直接在随书的演示 CD 上使用以下 URL，但仍需确保将 `YOURUSPSUSERID` 替换为您自己的用户 ID：\n\
  \n```\nhttp://localhost/chap11/shipper/shipper.php?\nuserID=YOURUSPSUSERID&origZip=10022&destZip=20008&weightLb=10&\n\
  weightOz=5&container=Flat%20Rate%20Box&size=Large&mailService=\nPriority%20Mail\n\
  ```\n\n图 11.5 显示了 PHP 脚本生成的运费。\n\n![Shipper PHP 脚本返回的唯一信息是单条运费。](img/11fig05.jpg)\n\
  \n**图 11.5. Shipper PHP 脚本返回的唯一信息是单条运费。**\n\n虽然在 URL 中尝试不同的运费信息（例如不同的起始和目的邮政编码）会很有趣，但\
  \ USPS 测试服务器仅支持你在此看到的测试数据。你必须获得 USPS 的验证并迁移到其生产服务器，才能进行更彻底的测试。你将在本章稍后的“为 Shipper\
  \ 极极彻底的 Ajax 改造”节中查阅到如何获取验证。\n\n## 测试 Shipper\n\n在尝试测试 Shipper 应用程序之前，请确保已在 [`www.usps.com/webtools/`](http://www.usps.com/webtools/)\
  \ 注册了您自己的 USPS Web Tools 用户 ID。然后，您需要按照上一节中的说明，将此用户 ID 插入到 `shipper.html` 网页的 HTML\
  \ 代码中。请记住，除非注册并将自己的用户 ID 插入应用程序的 HTML 代码，否则 Shipper 将无法运行。\n\n完成这些准备工作后，请查看图 11.6，它显示了\
  \ Shipper 应用程序已打开并准备好正式的运费计算。\n\n![Shipper 应用程序启动时，除了无法更改的默认国家字段外，整个用户界面都是空白的。](img/11fig06.jpg)\n\
  \n**图 11.6. Shipper 应用程序启动时，除了无法更改的默认国家字段外，整个用户界面都是空白的。**\n\n用户界面初始是空白的，因此你可以像完成在线购买结算一样随意输入信息。或者为了节省时间，直接跳转到页面上的邮政编码字段。首先尝试输入一个现实世界中（尚）不存在的邮政编码，例如\
  \ 20080。图 11.7 显示了应用程序如何显示错误/帮助消息，以指示该邮政编码没有运费信息。\n\n![输入无效的邮政编码会在邮政编码字段旁边显示错误/帮助消息。](img/11fig07.jpg)\n\
  \n**图 11.7. 输入无效的邮政编码会在邮政编码字段旁边显示错误/帮助消息。**\n\n实际上，你输入的除 20008（华盛顿特区）以外的任何邮政编码在测试目的下都被视为无效，因此你可以输入几乎任何内容并获取错误消息。要查看成功的运费计算，请输入\
  \ 20008 作为邮政编码并离开邮政编码字段。图 11.8 显示了动态获取的运费和新计算的订单总额。\n\n![输入有效的邮政编码会导致运费的成功 Ajax\
  \ 请求，从而导致订单总额的计算。](img/11fig08.jpg)\n\n**图 11.8. 输入有效的邮政编码会导致运费的成功 Ajax 请求，从而导致订单总额的计算。**\n\
  \n除非你非常专注，否则你可能错过了请求执行期间出现在运费位置的“加载”图像。尝试选择不同的运送方式并仔细观察运费再次尝试。图 11.9 显示了“加载”图像的运行状态。\n\
  \n![在请求执行期间，小的“加载”图像出现在运费位置。](img/11fig09.jpg)\n\n**图 11.9. 在请求执行期间，小的“加载”图像出现在运费位置。。**\n\
  \n此图展示了“加载”图像如何提供一种微妙但有效的指示，表明后台正在发生某些操作。当获得新费率时，图像会消失并显示新费率（参见图 11.10）。\n\n![动态获取的运费和新计算的订单总额。](img/11fig10.jpg)\n\
  \n**图 11.10. 动态获取的运费和新计算的订单总额。**\n---\n\n# 为 Shipper 极极彻底的 Ajax 改造\n\n由于 Shipper\
  \ 应用程序根据美国邮政的服务提供运费选项，因此高度依赖于美国邮政国内费率 Web 服务，该服务是 USPS Web Tools 的（[`www.usps.com/webtools/`](http://www.usps.com/webtools/)）。与全书中使用的许多其他\
  \ Web 服务不同，USPS Web Tools 受到严格控制，只有通过与 USPS 的紧密配合才能使用。\n\n具体来说，你必须通过验证过程，才能超越测试服务器上的有限测试数据，并在生产服务器上尝试您的应用程序。此验证由\
  \ USPS 互联网客户中心 (ICCC) 执行，联系方式为 icustomercare@usps.com 或 1-800-344-7779（东部时间 7 点至晚上\
  \ 11 点）。在联系 ICCC 获取生产服务器权限之前，你必须已经是注册的 USPS Web Tools 用户（拥有 ID），并已经在国内费率 Web 工具服务器上测试过应用程序。因此，Shipper\
  \ 极端改造的第一部分仅仅是获得生产服务器的访问权限，以便尝试全范围的代码。\n\n### 注意\n\n![注意](img/note.jpg)\n\n你必须联系\
  \ ICCC 才能以任何实际方式使用 Shipper 应用程序，因为它在 USPS 测试服务器上运行时仅限于使用 USPS 指定测试数据。\n\n\n\n\n\
  在你通过了 ICCC 验证并获得了国内费率 Web 工具（Domestic Rates Web Tool）生产服务器的 URL 后，请确保通过更改 `shipper.php`\
  \ 文件开头附近的以下行代码，将 Shipper 应用切换到生产服务器：\n\n```\n$uspsRequest =\n  \"http://testing.shippingapis.com/ShippingAPITest.dll?\n\
  \  API=RateV2&\";\n```\n\n此代码中 URL 的第一部分 `http://testing.shippingapis.com/Shipping-APITest.dll`\
  \ 是 USPS 测试服务器的 URL，这是你需要更改为生产环境 URL 的部分。这应该是将 Shipper 应用从 USPS 测试服务器移动到生产服务器所需的唯一更改，从而让你能够尝试任何邮政编码（ZIP\
  \ codes）来计算运费。\n\n一旦你让 Shipper 应用成功在 USPS 生产服务器上运行，你将希望认真考虑将 Ajax 代码整合到你自己的 页面中。遗憾的是，这种“大改版”的方面完全取决于你具体的网站设计，因此很难就如何执行设计和实现给出细节。不过，我可以为你提供一种将\
  \ Ajax 运费计算器集成到现有购物车中的通用策略策略。\n\n首先，你需要导入两个相关的 Ajax Toolkit 文件，如下所示：\n\n```\n<script\
  \ type=\"text/javascript\" src=\"ajaxkit.js\"> </script>\n<script type=\"text/javascript\"\
  \ src=\"domkit.js\"> </script>\n```\n\n然后，你需要确保有一个用于邮政编码输入字段的 `input` 文本元素，以及一个用于邮政编码错误信息的\
  \ `span` 元素。如果你已经有一个邮政编码 `input` 元素，请确保添加一个与 Shipper 应用中类似的 `onchange` 事件处理器。以下是来自\
  \ Shipper Web 页面的相关代码：\n\n```\n<td class=\"value\"><input type=\"text\" id=\"zipCode\"\
  \ size=\"10\"\n  onchange=\"getShipRate()\" /></td>\n<td class=\"label\" width=\"\
  50%\"><span id=\"zipCodeErr\"\n  style=\"font-size:80%; color:#BB0000;\"></span></td>\n\
  ```\n\n注意，邮政编码输入元素调用了 `getShipRate()` 函数来从 USPS 服务器动态获取运费。你之前已经见过这个函数了，所以我在这里不再重复它。但是，你需要将它的代码连同响应处理器函数\
  \ `handleRequest()` 一起复制粘贴到你的页面头部。\n\n你可能已经有一个用于选择运方法的 `select` 元素，但如果没有，你就需要将其添加到页面中。以下是\
  \ Shipper 应用中用于提供 USPS 运方法选择的选择列表：\n\n```\n<select id=\"mailService\" onchange=\"\
  getShipRate()\">\n  <option value=\"Parcel Post\">Parcel Post</option>\n  <option\
  \ value=\"Priority Mail\" selected=\"selected\">\n    Priority Mail</option>\n \
  \ <option value=\"Express Mail to PO Addressee\">\n    Express Mail</option>\n</select>\n\
  ```\n\n极其重要的一点是，注意每个选项的值（value）必须必须与 USPS Web Tools 国内费率文档中指定的运方法完全匹配。这非常重要，因为 Shipper\
  \ 应用使用此值作为费率请求的基础，这意味着它必须与运方法完全匹配才能进行查询。换句话说，`value=\"US Priority Mail\"` 是不起的，因为运方法是\
  \ `\"Priority Mail\"`，而不是 `\"US Priority Mail\"`。\n\n### Note\n\n![Note](img/note.jpg)\n\
  \n除了 Shipper 应用中显示的三个方法之外，还可以支持其他 USPS 运方法。要了解所有可用的运方法，请查看 USPS Web Tools 文档 http://www.usps.com/webtools/technical.htm。如果你想支持不同的快递供应商（如\
  \ FedEx 或 UPS），你需要深入研究其文档并进行一些工作以支持其请求/响应格式。\n\n最后，Shipper 应用中有几个“购物车”变量，你需要提供或将它们连接到你现有的购物车字段：\n\
  \n```\nvar origZip = \"10022\"; // Origination ZIP code\nvar itemDesc = \"Popcorn\
  \ Holiday Feast\";\nvar itemPrice = 29.99;\nvar weightLb = \"10\";\nvar weightOz\
  \ = \"5\";\nvar container = \"Flat Rate Box\";\nvar size = \"Large\";\n```\n\n请记住，这些变量的大多数将以某种方式与购物车中已输入或选择的真实数据绑定。我在\
  \ Shipper 应用中选择将它们设置为静态，只是为了保持简单；我的目标是展示如何使用 Ajax 计算运费，而不是如何构建整个购物车。\n\n如果你遵循了这些通用设计指南，你应该能够很顺利地将\
  \ Ajax 动态运费查询集成到你自己的网站中。\n\n## Summary\n\n本章探讨了运费的动态查询，这显然属于一个需要 Ajax 解决方案的问题领域。为了查询在线购买的运费，而需要在购物车中在不同页面之间跳转，这完全是不必要的。不仅如此，为了确定费用你真正需要提供的只有你的邮政编码。本章中的\
  \ Shipper 应用演示了巧妙利用 Ajax 如何对购物车或任何需要动态计算运费并将其展示给用户的应用程序进行细微但实质的改进。\n\n## 第 12 章：为你的网站添加\
  \ Ajax 驱动的评分系统\n\n### 动画中的再次 Ajax\n\n![Ajax Yet Again in Cartoons](img/note.jpg)\n\
  \nMGM 的 Ajax 公司并不是 Ajax 在动画中被使用的唯一一次。*Duckman* 是 20 世纪 90 年代美国 USA Network 的部经常剧，出现了一个名为\
  \ Ajax Duckman 的角色，他是剧主角 Eric Duckman 的儿子。Ajax Duckman 由音乐家 Dweezil Zappa 配音，在剧中是一个有点像无手好业的青少年。\n\
  \n许多热门网站中一个日益受欢迎的组件是对事物进行评分的能力。Amazon 可能在提供对产品评分和撰写自己的评论的功能时开启了这一趋势。从那时起，各种不同的网站提供了某种类型的评分系统，无论是对电影、音乐、照片、博客文章或其他任何内容的评分。只要可以在网上发布，就可以被评分。我想我们大多数人内心深处都是评论家，所以能够对任何事物和任何事进行评分的想法触中了我们分享批评（在很多情况下是赞美）的需求。承认，将世界上的一切都简化为五星级可能并不公平，但它可以让你快速了解人们是如何看待某事的。\n\
  \n在利用 Ajax 为网页上的任何内容添加五星级评分方面，本章无疑是书中野心勃勃的一章。我所说的“野心勃勃”是指，考虑到 Rater 示例应用程序必须能够向服务器上的文件或数据库读写多个评分，并同时防止同一用户的重复投票，它在\
  \ Ajax 的使用上要先进得多。好消息是，这种复杂性的绝大部分隐藏在 Ajax Toolkit 内部，这意味着你的工作主要归结为正确地使用 Toolkit，而不是构建自己的评分代码。本章中的\
  \ Rater 使用了以下文件，这些文件位于随书附带的 Linux 光盘的 `chap12` 示例代码文件夹中：\n\n* `rater.html`—Rater\
  \ 主 Web 页面\n* `cookiereset.html`—用于模拟唯一用户的 Cookie 重置 页面\n* `ajaxkit.js`—Ajax Toolkit\
  \ 的核心 Ajax 函数\n* `domkit.js`—Ajax Toolkit 的 DOM 相关函数\n* `ratingkit.js`—Ajax Toolkit\
  \ 的评分相关函数\n* `ratingkit.php`—用于保存和加载评分的服务器脚本\n* `ratingkit.css`—五星评分的样式表\n\n\n\n\
  \n* `star.gif`—用于表示五星级标准的星星图像\n* `star_sm.gif`—用于表示较小五星级标准的较小星星图像\n\n### 挑战：为网站添加评分功能\n\
  \n确定一个物品重要性的一种方便方法是考虑：如果你被困在荒岛上，且只能带上特定数量的物品，该物品是否会被入选。例如，如果你在孤立无援的多年里只能带一张音乐 CD\
  \ 听的话（但指望有足够的电池为你的 CD 播放器供电！），你会选择哪张 CD？\n\n希望你永远不需要真正去做出那次“荒岛 CD 选择”。退一步而言说，你可能会发现在\
  \ [Amazon.com](http://Amazon.com) 上为你喜爱的 CD 评分是很有用的，这样其他人就可以做出更明智的音乐购买决策。[Amazon.com](http://Amazon.com)\
  \ 允许你使用五星评分系统对音乐 CD 以及其销售的几乎所有商品进行评分。如果你现在就在电脑旁，花点时间访问 [Amazon.com](http://Amazon.com)\
  \ 查看一张音乐 CD。这会让你了解在线评分系统是如何工作的。\n\n如果你看艺术家和 CD 标题下方的五颗星星，你会发现星星旁边是给出评分的客户数量。这非常重要，因为这让你对评分的准确性心中有数——如果只有少数个人对该物品进行了评分，那么这个评分可能意义不大。\n\
  \n提到这个评分示例的真正目的是指出 [Amazon.com](http://Amazon.com) 的评分方法涉及到一个用于选择评分的、相当平庸的用户界面。我指的是用于选择评分的选项列表，它允许你选择星级评分的文本描述，例如“五星”或“四星”。除了\
  \ [Amazon.com](http://Amazon.com) 还支持配合评分的文本评论外，你还必须在评分生效之前对其预览并接受你的评分。如果能直接点击五星评分直接在物品主页面上对物品进行评分，将会要直观且高效得多。诚然，这并不能解决写评论的需求，但并不是每个人都对写评论感兴趣——有时你只需要快速的“点完就走”式评分。\n\
  \n本章的挑战是使用 Ajax 在 Web 页面中整合一个交互式五星评分组件，使用户无需离开页面即可对物品进行投票。这符合你已经学到的关于 Ajax 的大部分知识，即当你只是微调少量数据时尽量减少页面重新加载。在这种情况下，你只想向服务器提交一条单条评分数据，然后在投票处理后查看总评分计数。这绝对在\
  \ Ajax 可以处理的范畴。\n\n这个挑战中你可能已经好奇的棘手部分是评分票的持久化存储。回想你迄为止看到的所有 Ajax 示例，这是第一个必须记住用户提交内容的程序。具体来说，Rater\
  \ 必须以某种方式在服务器上存储每个用户对每个物品的每次投票。幸运的是，我为你提供了一个预构建的评分组件，它可以处理在服务器 XML 文档中存储评分数据的所有细节。如果你有兴趣，我还提供了一些关于可能使用数据库代替\
  \ XML 文件的想法。\n\n我所说的这个评分组件包含在随书附带的光盘的 Ajax 工具包中。该组件涉及客户端和服务器端代码，以及几张图像和一个样式表。在后台，一个由\
  \ Ajax 驱动的五星评分系统比你想象的要复杂一些，这就是为什么需要这么多文件才能发挥魔力。\n\n在评分组件的客户端 JavaScript 代码（包含在 `ratingkit.js`\
  \ 中）中，使用了以下两个函数来控制评分系统：\n\n* `initRatings()`—初始化页面上所有物品的评分\n* `setRating()`—为单个物品发出评分投票\n\
  \n在 PHP 服务器脚本 (`ratingkit.php`) 的帮助下，这些函数使得为页面上任意数量的物品分配评分成为可能。不仅如此，评分组件足够智能，可以将给定计算机上的投票次数限制为每个用户一次。它是通过巧妙地使用\
  \ cookie 实现的，cookie 为记住用户是否已执行过某些操作（如对特定物品评分）提供了完美的机制。\n\n希望我已经说服了你通过提供预构建组件已经完成了评分工作的大部分。那么对于\
  \ Rater 应用挑战还剩下什么呢？Rater 应用的挑战在于要正确设置可评分物品的 HTML 代码，使其与评分组件连接并正确发出投票。此外，几个 CSS 评分类是评分组件的一部分，必须仔细分配给\
  \ Rater 页面上的元素，评分才能正常工作。\n\n为了保持 Rater 应用的 HTML 代码相对简单且不涉及大量额外图像或其他资源，被评分的物品是著名的名言。Rater\
  \ Web 页面包含五个著名的名言，因此有五个不同的评分——每个名言一个。Rater Web 页面需要为每个名言包含一个唯一的评分组件并对其进行正确标识，以便该名言的投票存储在服务器上以供以后检索。归结底，Rater\
  \ 应用将允许 Web 上的无数人对他们喜爱的名言投票，所有评分投票在服务器上汇总，总票数显示在页面上。\n\n在开发 Rater 应用后，你将获得复用评分组件为任何类型的\
  \ Web 内容评分的能力。\n\n## 设计：设计一个 Rater 应用\n\nRater 应用的设计从名言本身开始，因为它们在这个特定的示例中驱动着评分过程。由于名言只是文本，只需将它们封装在\
  \ `div` 元素中即可，不需要任何特殊格式或其他代码。虽然评分立即出现在名言下方，但在 HTML 代码方面，并没有直接将评分和名言联系在一起。\n\n评分与名言之间的连接与评分的“物品\
  \ ID”（item ID）有关，这是一段用于在其他评分中唯一标识评分的文本。如果你将网站上所有的评分看作一个大集合（它们确实如此），那么每一个评分都有一个唯一的\
  \ ID 让你能够区分它们。物品 ID 应该以某种方式提示你该评分与哪个名言相关。例如，你可以使用名言作者的姓氏作为评分的 ID，这实际上正是 Rater 应用所使用的。\n\
  \n物品 ID 至关重要，因为它与评分投票一起存储，因此它被用于将存储的评分与页面上的名言相关起来。提到页面上的名言，图 12.1 显示了 Rater 用户界面的基本布局，包括名言及其相应的评分。\n\
  \n![Rater 应用的用户界面由多个文本名言组成，每个名言都有一个评分组件。](img/12fig03.gif)\n\n**图 12.1. Rater 应用的用户界面由多个文本名言组成，每个名言都有一个评分组件。**\n\
  \n\n\n\n\n该图展示了每个引言后如何紧跟一个评分及其相关的辅助文本。辅助文本最初仅会指示您点击评分以提交投票。一旦您对某个评分进行了投票，辅助文本就会改变，显示该评分已被投了多少次票。因此，辅助文本充当了双重角色：首先作为指令，然后作为显示评分信息的手段。\n\
  \n`Ajax Toolkit` 提供的评分组件处理了 `Rater` 应用中所有 `Ajax` 请求的细节。本章的目标不是剖析 `rater` 组件的内部机制，而是向您展示如何使用它将评分整合到\
  \ Web 页面中。尽管如此，快速了解一下 `Ajax` 如何以客户端请求和服务器响应的形式在组件中运行仍然是值得的。\n\n### 客户端请求\n\n评分组件涉及两种不同的客户端请求：一个用于初始获取页面上所有评分的评分信息，另一个用于对特定评分进行投票。第一个请求在页面初始加载时恰好发生一次，如果页面上有多个评分，则第二个请求可能会发生多次。当然，评分组件确实使用了\
  \ cookie 来防止你对某个评分投多次票。但事实仍然是，对每个评分的每次投票都会产生一个 `Ajax` 请求。\n\n当对所有评分发出 `Ajax` 请求时，客户端不需要传递任何信息。换句话说，`Ajax`\
  \ 请求的 `URL` 仅由 `PHP` 服务器脚本组成，该脚本从 `XML` 文件读取评分并返回结果。\n\n与获取评分请求不同，提交评分的 `Ajax` 请求确实需要参数。此请求所需的参数是项目\
  \ ID 和评分本身（一星到五星）。这两个参数被传递到服务器上，并在那里被正确地整合到评分数据中，这意味着它们被用于增加票数并重新计算平均分。\n\n### 服务器响应\n\
  \n`Ajax Toolkit` 中评分组件的服务器响应根据请求的不同而异。当为了初始化页面评分而检索所有评分时，服务器会返回所有存储为 `XML` 文档的评分。然后，由客户端代码根据评分\
  \ ID 决定哪些评分适用于该页面。\n\n设置评分的服务器响应涉及新计算的平均分以及针对指定项目 ID 的投票总数。这两条信息被返回给客户端脚本，随后脚本将相应地更新页面上的评分。\n\
  \n### 理解客户端到服务器的对话\n\n为了帮助熟悉 `Rater` 应用（`rater 组件`）中客户端和服务器之间发生的数据流，请查看 图 12.2。\n\
  \n![Rater 应用的后台有两个用于初始化评分和提交新评分投票的 Ajax 请求。](img/12fig04.gif)\n\n**图 12.2. Rater\
  \ 应用的后台有两个用于初始化评分和提交新评分投票的 Ajax 请求。**\n\n该图展示了初始评分请求不涉及从客户端的数据流，但它返回了一个包含所有评分的完整\
  \ `XML` 文档。由于在提交 `Ajax` 请求时不需要参数，请求的 `URL` 仅仅是 `PHP` 服务器脚本的名称：\n\n```\nratingkit.php\n\
  ```\n\n尽管从客户端到服务器流出的数据非常少，但反方向返回的数据要有趣得多。以下是响应 `XML` 文档的示例：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<ratings>\n  <rating>\n    <id>twain</id>\n    <avg>4.5</avg>\n\
  \    <votes>2</votes>\n  </rating>\n  <rating>\n    <id>ali</id>\n    <avg>3.33333333333</avg>\n\
  \    <votes>3</votes>\n  </rating>\n  <rating>\n    <id>einstein</id>\n    <avg>3</avg>\n\
  \    <votes>2</votes>\n  </rating>\n  <rating>\n    <id>shaw</id>\n    <avg>4</avg>\n\
  \    <votes>2</votes>\n  </rating>\n  <rating>\n    <id>paine</id>\n    <avg>4</avg>\n\
  \    <votes>1</votes>\n  </rating>\n </ratings>\n```\n\n此 `XML` 文档的结构非常简单，因为它包含一个评分列表，每个评分包含三个独立的数据项：\n\
  \n* 项目 ID (`<id>`)\n* 平均评分 (`<avg>`)\n* 票数 (`<votes>`)\n\n这些信息足以描述单个项目的评分。`XML`\
  \ 文档中的每个 `<rating>` 标签对应于单个项目的评分。整个文档充当评分的数据格式，这意味着如果你打开在服务器上生成的 `ratings.xml` 文件，你将看到相同的\
  \ XML 代码。注意的是，该文件充当你网站上所有评分的主数据库，可能跨越多个页面。关键在于项目 ID，它允许你只要正确标识了 ID，就可以在网站的任何地方使用评分。\n\
  \n### 注意\n\n![注意](img/note.jpg)\n\n正如你稍后在章节的“为 Rater 进行一次极端的 Ajax 改造”部分中会发现的那样，项目\
  \ ID 可以是您想要的任何文本。虽然 `Rater` 应用使用名称作为 ID，但你同样可以轻松使用数字或字母与数字的组合。重要的是使用唯一且易于与项目关联的项目\
  \ ID。例如，书籍评分的项目 ID 可以使用该书的国际标准书号 (ISBN)，这样 ID 就能保证唯一，并且与书籍有明显的关联。\n\n如果你想查看网站上存储的评分\
  \ `XML` 数据，只需在浏览器中不带任何参数或任何内容地输入评分组件的 `PHP` 服务器脚本 (`ratingkit.php`) 即可。图 12.3 显示了通过直接打开脚本在浏览器中显示的评分\
  \ XML 代码。\n\n![直接输入评分组件的 PHP 服务器脚本的 URL 将显示评分 XML 文档。](img/12fig05.jpg)\n\n**图 12.3.\
  \ 直接输入评分组件的 PHP 服务器脚本的 URL 将显示评分 XML 文档。**\n\n`Rater` 应用中使用的另一个 `Ajax` 请求涉及存储新评分。处理此请求的服务器脚本底层代码要复杂一些，因为它必须足够智能，在文件尚不存在时创建一个新的\
  \ `XML` 文件 (`ratings.xml`)（即，这是任何项目的第一次投票）。假设 `XML` 文件确实存在，服务器脚本必须搜索 `XML` 代码并根据项目\
  \ ID 找到评分。然后它必须通过重新计算平均分并增加票数来更新评分。\n\n\n\n\n\n用于发布新评分的 URL 涉及将项目 ID 和评分作为参数传递给服务器脚本。然而，与你在书中书中见过的其他\
  \ Ajax 请求不同，此请求是以 `POST` 而不是 `GET` 发送的，因为该请求的意图是修改服务器上的信息。在 `POST` 请求中，URL 仅仅是服务器脚本的，而参数（项目\
  \ ID 和评分）则作为单独参数传递给 `ajaxkit.js` 文件中 Ajax Toolkit 中的 `ajaxSendRequest()` 函数。我意识到我正在陷入一些你可能并不感兴趣的细节中，因为这里的重点是代码复用，但我希望你对评分器组件（rater\
  \ component）的内部运作有足够的的了解，以便在需要时能够对其进行修改。\n\n回到评分提交请求，服务器的响应包含了新计算的平均分值和已投票总数。虽然完全可以使用\
  \ XML 来格式化这些返回数据，但这并非必须。因此，数据以冒号分隔的对的形式返回，如下：\n\n```\n4.5:2\n```\n\n这是在对你看到的 XML\
  \ 数据中的第一个引言进行最后一次投票后返回的数据。如果你回看那些数据，将看到以下代码：\n\n```\n<rating>\n  <id>twain</id>\n\
  \  <avg>4.5</avg>\n  <votes>2</votes>\n</rating>\n```\n\n因此，服务器对已投出的评分投票的响应仅仅是返回刚刚写入\
  \ XML 文件的两个数据：`<avg>` 和 `<votes>` 内容。\n\n## 整合评分器应用程序\n\n除了随书附带的光盘包含的 Ajax Toolkit\
  \ 的几个文件外，评分应用程序由一个 Web 页面和一个并非严格要求的辅助 Web 页面组成：\n\n*   HTML 页面 (`rater.html`)\n\
  *   Cookie 重置 Web 页面 (`cookiereset.html`)\n\n评分应用程序包含在评分 Web 页面 (`rater.html`) 中，而\
  \ Cookie 重置 Web 页面 (`cookiereset.html`) 是一个独立的辅助页面，用于清除评分 Cookie。接下来的几节将详细检查这些文件。\n\
  \n### 评分 Web 页面\n\n评分 Web 页面使用了五个独立的评分，每个评分都应用于页面上每个评分之前显示的文本引言。这种设计的理念是你可以阅读一段引言，然后立即对其进行评分。图\
  \ 12.4 显示了已完成评分但仍有几个项目处于未评分状态的评分 Web 页面。\n\n![评分 Web 页面显示了多个引言，每个引言都有一个五星评分组件。](img/12fig06.jpg)\n\
  \n**图评分 Web 页面显示了多个引言，每个引言都有一个五星评分组件。**\n\n如果你仔细观察该图，你会发现穆罕德·阿里引言的评分使用了较大的星星和文本。这证明了评分组件如何支持两种不同的尺寸。在实践中，评分组件的小大版本之间的区别仅涉及对评分使用不同的\
  \ CSS 样式类。\n\n承认评分 Web 页面的实际代码确实很长，所以请做好准备。只需记住，代码列表很长的主要原因是该页面使用了五个不同的评分，每个评分都需要几行代码。以下是评分页面主体的简略代码，所有有趣的内容都发生在这里处：\n\
  \n```\n<body onload=\"initRatings()\">\n  <div id=\"ajaxState\" style=\"display:none\"\
  ></div>\n  <br />\n  <div>A banker is a fellow who lends you his umbrella when the\n\
  \    sun is shining, but wants it back the minute it begins to\n    rain.<br />\n\
  \    - Mark Twain</div\n  <div>\n    <span class=\"rating-label-small\">Rating:</span>\n\
  \    <span class=\"inline-rating\">\n      <ul class=\"star-rating small-star\"\
  >\n        <li id=\"twain-rating\" class=\"current-rating\"\nstyle=\"width:0%\"\
  >Rating</li>\n        <li><a href=\"javascript:setRating('twain', 1);\"\n      \
  \    class=\"one-star\">1</a></li>\n        <li><a href=\"javascript:setRating('twain',\
  \ 2);\"\n          class=\"two-stars\">2</a></li>\n        <li><a href=\"javascript:setRating('twain',\
  \ 3);\"\n          class=\"three-stars\">3</a></li>\n        <li><a href=\"javascript:setRating('twain',\
  \ 4);\"\n          class=\"four-stars\">4</a></li>\n        <li><a href=\"javascript:setRating('twain',\
  \ 5);\"\n          class=\"five-stars\">5</a></li>\n     </ul>\n   </span>\n   <span\
  \ id=\"twain-info\" class=\"rating-info-small\">\n     (click to vote)</span>\n\
  \  </div\n  <hr />\n  <div>Learn from yesterday, live for today, hope for tomorrow.\n\
  \   The important thing is not to stop questioning.<br />\n   - Albert Einstein</div\n\
  \  <div>\n    <span class=\"rating-label-small\">Rating:</span>\n    <span class=\"\
  inline-rating\">\n      <ul class=\"star-rating small-star\">\n        <li id=\"\
  twain-rating\" class=\"current-rating\"\nstyle=\"width:0%\">Rating</li>\n      \
  \  <li><a href=\"javascript:setRating('twain', 1);\"\n          class=\"one-star\"\
  >1</a></li>\n        <li><a href=\"javascript:setRating('twain', 2);\"\n       \
  \   class=\"two-stars\">2</a></li>\n        <li><a href=\"javascript:setRating('twain',\
  \ 3);\"\n          class=\"three-stars\">3</a></li>\n        <li><a href=\"javascript:setRating('twain',\
  \ 4);\"\n          class=\"four-stars\">4</a></li>\n        <li><a href=\"javascript:setRating('twain',\
  \ 5);\"\n          class=\"five-stars\">5</a></li>\n     </ul>\n   </span>\n   <span\
  \ id=\"twain-info\" class=\"rating-info-small\">\n     (click to vote)</span>\n\
  \  </div\n  <hr />\n  <div>Learn from yesterday, live for today, hope for tomorrow.\n\
  \   The important thing is not to stop questioning.<br />\n   - Albert Einstein</div\n\
  </body>\n```\n\n这段代码的关键在于对评分 CSS 样式类的细致使用。这些类定义在 `ratingkit.css` 样式表中，负责当你将鼠标悬在评分上时产生动画悬停效果。这种实现五星评分的\
  \ CSS 方法最初是由 Komodo Media 的 Rogie King 创建的，该网站位于 [`www.komodomedia.com`](http://www.komodomedia.com)。这段代码运行效果非常好，以至于我将其作为\
  \ Ajax Toolkit 中评分组件的基础。\n\n评分 Web 页面中的每个评分都是作为一个无序列表创建的，其中的每个星星都是列表中的一项。不同之处在于列表项是水平显示而不是垂直显示，这导致了星星水平排列。这看起来像是使用列表的一种奇怪方法，确实如此，但对于评分来说效果非常好。技巧在于对列表应用适当的样式，以便悬停效果按预期工作。\n\
  \n第一步是创建一个 `span` 元素来包含评分标签，它只是静态文本：\n\n```\n<span class=\"rating-label-small\"\
  >Rating:</span>\n```\n\n当然，即使是静态文本也必须应用适当的 CSS 样式类（`rating-label-small`）。如果你想为尺寸较大的评分组件使用更大的标签，请使用\
  \ `rating-label` 代替 `rating-label-small`。\n\n下一步是创建另一个 `span` 元素，作为评分组件的外壳：\n\n\
  ```\n<span class=\"inline-rating\">\n```\n\n在在此 `span` 元素内部，你添加无序列表容器元素 `ul`，如下：\n\
  \n```\n<ul class=\"star-rating small-star\">\n```\n\n此 `ul` 元素是为小型评分组件样式化的，这意味着它将使用\
  \ `star_sm.gif` 图像文件中的较小星星图像。如果你想使用较大的评分组件，只需省略 `small-star` 类，使代码如下所示：\n\n```\n\
  <ul class=\"star-rating\">\n```\n\n\n到目前为止，评分组件完全是通用的，没有任何针对特定项目的代码。随着第一个列表项的添加，这种情况将发生改变，这是一个特殊的项目，用于控制可见星级的数量：\n\
  \n```html\n <li id=\"twain-rating\" class=\"current-rating\"\nstyle=\"width:0%\"\
  >Rating</li>\n```\n\n现在你已经可以看到特定项目评分的证据了，因为项目 ID `twain` 被通过其 `id` 属性（`twain-rating`）用于标识评分。\n\
  \n接下来是星级本身，它们都被被编码为 `li` 列表元素：\n\n```html\n <li><a href=\"javascript:setRating('twain',\
  \ 1);\"\n     class=\"one-star\">1</a></li>\n   <li><a href=\"javascript:setRating('twain',\
  \ 2);\"\n     class=\"two-stars\">2</a></li>\n   <li><a href=\"javascript:setRating('twain',\
  \ 3);\"\n     class=\"three-stars\">3</a></li>\n   <li><a href=\"javascript:setRating('twain',\
  \ 4);\"\n     class=\"four-stars\">4</a></li>\n   <li><a href=\"javascript:setRating('twain',\
  \ 5);\"\n     class=\"five-stars\">5</a></li>\n```\n\n这里的每一行代码代表五星级评分中的五颗星之一。每颗星不仅作为评分的视觉指示，还充当发布评分投票的触发器。这一点是明显的，因为在响应列表项中的每个链接时，都会调用\
  \ `setRating()` 函数。`setRating()` 函数的第一个参数接收用于评分的项目 ID（在此例中为 `twain`），随后是要设置的评分值。因此，`setRating()`\
  \ 函数的第二个参数是为该评分设置的星数。\n\n你现在准备好关闭评分组件的主体了，如下所示：\n\n```html\n </ul>\n</span>\n```\n\
  \n剩余的代码是最后一个 `span` 元素，用于显示评分右侧的帮助文本：\n\n```html\n<span id=\"twain-info\" class=\"\
  rating-info-small\">\n  (click to vote)</span>\n```\n\n注意，这段代码使用了 `rating-info-small`\
  \ CSS 样式类，它对应于小型评分组件。如果你正在创建一个大型评分组件，请将此样式更改为 `rating-info`。\n\n这段代码还使用了项目 ID（`twain`）来形成元素的\
  \ `id` 属性（`twain-info`）。请记住，该元素的目的是指示用户如何投票（在投票之前）以及显示总票数（在投票之后）。帮助文本的第三个作用是在向服务器存储投票时显示状态消息。这最后一个角色与你在其他示例中看到的“加载”（loading）图像非常相似，区别在于在这种情况下使用了“加载”文本代替图像。\n\
  \n到此，Rater Web 页面中单个评分组件的拆解就完成了。如果你回顾整个页面使用的评分代码，你会看到五段完全遵循你刚刚检查的结构的独立代码。\n\nRater\
  \ 应用中唯一留下的收尾工作是调用 `initRatings()` 函数，这必须在页面 body 的 `onload` 事件处理程序中进行。该函数最初设置页面上所有评分的值。如果没有这个函数，将评分写入服务器文件的优势将消失。\n\
  \n### Cookie 重置 Web 页面\n\nCookie 重置 Web 页面（`cookiereset.html`）是 Rater 应用的一个辅助工具，用于重置\
  \ Cookie 并允许你对 Rater 页面上的任何引言再次投票。这对于测试应用程序和尝试不同的评分非常有帮助，而不需要访问许多台不同的计算机。当然，你永远不会发布\
  \ Cookie 重置 Web 页面供其他用户访问；它纯粹是一个供你自己测试的内部工具。\n\n图 12.5）显示了 Cookie 重置 Web 页面的运行状态，诚然这并不有趣。\n\
  \n![Cookie 重置 Web 页面显示一条消息，让你知道 Rater cookies 已经重置。](img/12fig07.jpg)\n\n图 12.5.\
  \ Cookie 重置 Web 页面显示一条消息，让你知道 Rater cookies 已经重置。\n\nCookie 重置 Web 页面缺乏趣味是因为除了清除与五个引言评分相关的五个\
  \ Cookie 值之外，它什么都没做。以下是该页面的完整 HTML 代码， `cookiereset.html`，它应该阐明清除 Cookie 的过程：\n\n\
  ```html\n<html>\n  <head>\n    <title>Rater - Cookie Reset</title>\n    <script\
  \ type=\"text/javascript\">\n      document.cookie = \"twain-rating=\";\n      document.cookie\
  \ = \"einstein-rating=\";\n      document.cookie = \"ali-rating=\";\n      document.cookie\
  \ = \"paine-rating=\";\n      document.cookie = \"shaw-rating=\";\n    </script>\n\
  \  </head>\n\n <body>\n   <p>The cookies are reset.</p>\n </body>\n</html>\n```\n\
  \n如你所见，页面头部包含了五个 Cookie。清除 Cookie 仅涉及名称。请记住，Cookie 重置页面实际上是一个节省时间的工具。即使有选项可以清除单个\
  \ Cookie，这也可能非常繁琐。\n\n### 注意\n\n![注意](img/note.jpg)\n\n当你自己的页面中重用评分组件时，可能会使用不同的项目\
  \ ID，在这种情况下，你可能需要修改 Cookie 重置页面以便清除你的。\n\n## 测试 Rater\n\nRater 应用是一个相当有趣的测试对象，因为它涉及存储在服务器上的数据，这意味着应用程序维护着某种状态。另一种说法是，它记得已经投出的票。还要记住，应用程序的设计目的是防止来自同一台计算机对特定项目进行多次投票。因此，要在一台计算机上彻底测试该应用程序，你需要使用\
  \ `cookiereset.html` 页面来重置 Cookie。\n\n图 12.6）显示了处于空白状态 Raterater（即没有投票）。\n\n![当你第一次启动\
  \ Rater 应用时，所有的引言都准备好进行评分](img/12fig08.jpg)\n\n图 12.6. 当你第一次启动 Rater 应用时，所有的引言都准备好进行评分。\n\
  \n由于此时还没有投票，因此没有设置 Cookie，所以所有评分都可以投票。将鼠标悬停在其中一个评分上，你可以通过深色星高亮浅色星来查看潜在的评分（参见 图 12.7）。\n\
  \n![用鼠标悬停在评分上可以预览你即将进行的评分](img/12fig09.jpg)\n\n图 12.7. 用鼠标悬停在评分上可以预览你即将进行的评分。\n\n\
  \n\n\n要完成对特定项目的评分，只需点击评分星级的数字即可。这将提交评分投票，此时星级旁边的提示文本将更改，以指示正在提交投票。图 12.8 显示了页面上第一个评分组件的效果，该组件对应马克·吐恩的一句引言。\n\
  \n![在发布评分投票后，五星级评分旁边的提示文本会更改，以指示正在提交投票。](img/12fig10.jpg)\n\n**图 12.8. 在发布评分投票后，五星级评分旁边的提示文本会更改，以指示正在提交投票。**\n\
  \n一旦投票完成，项目的平均评分将以金星的形式出现。这很重要，因为在提交自己的投票之前，你是不允许看到平均评分的。项目收到的总票数也会显示在星级旁边的提示文本中。图\
  \ 12.9 显示了马克·吐恩引言在获得第一个四星投票后的状态。\n\n![成功提交评分投票后，评分组件将更改以显示平均评分和总票数。](img/12fig11.jpg)\n\
  \n**图 12.9. 成功提交评分投票后，评分组件将更改以显示平均评分和总票数。**\n\n除了较小的五星评分组件外，Rater 应用还展示了如何使用带有更大星级图像和相关文本的较大版本。穆哈默德·阿林的引言使用了更大版本的组件——图\
  \ 12.10 显示了使用该组件提交的投票。\n\n![评分组件还支持一个使用更大星级图像和更大文本的版本。](img/12fig12.jpg)\n\n**图\
  \ 12.10. 评分组件还支持一个使用更大星级图像和更大文本的版本。**\n\nRater 应用和评分组件的真正威力在于许多不同的人对项目进行评分。虽然组件设计为通过\
  \ Cookie 防止在同一台机器上重复投票，但你可以通过加载清除评分 Cookie 的特殊 Web 页面来绕过限制。如果你在浏览器中打开 `cookiereset.html`\
  \ 页面，它将清除 Rater Web 页面的所有 Cookie，从而允许你像其他人在自己的电脑上看到的那样查看页面。\n\n### Note\n\n![注意](img/note.jpg)\n\
  \n如果你多次使用 Cookie 重置 Web 页面，请确保刷新该页面，并在重置 Cookie 后刷新 Rater Web 页面。否则，Cookie 的变化将不会生效。\n\
  \n图 12.11 显示了对引言进行了多次投票的 Rater 应用。事实上，该图显示了所有的评分平均分，这意味着每一句引言都投过票。\n\n![通过重置 Cookie，你可以再次对项目进行投票并绕过每台电脑只能投票一次的限制。](img/12fig13.jpg)\n\
  \n**图 12.11. 通过重置 Cookie，你可以再次对项目进行投票并绕过每台电脑只能投票一次的限制。**\n\n评分组件酷的地方在于，它存储评分的方式使得在提交额外投票时，服务器上的\
  \ XML 文件不会增长。因此，你可以让很多人对项目投票，而无需担心评分数据文件增长失控。\n\n## 为 Rater 进行极端的 Ajax 改造\n\n扩展\
  \ Rater 应用有多种方法，但你可能最想做的是将评分组件应用到自己的 Web 页面上。我假设你已经了一些想要添加五星评分功能的项目。这些项目可以是图像、音乐片段、视频、文本或你想象的任何其他。关键是你需要在页面项目附近添加评分组件的\
  \ HTML 代码，以便于访问。\n\n在你自己的页面上添加评分组件的第一步是导入适当 Ajax Toolkit 文件。以下代码需要添加到包含评分的页面 `<head>`\
  \ 中：\n\n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"ratingkit.css\" />\n\
  <script type=\"text/javascript\" src=\"ajaxkit.js\"> </script>\n<script type=\"\
  text/javascript\" src=\"domkit.js\"> </script>\n<script type=\"text/javascript\"\
  \ src=\"ratingkit.js\"> </script>\n```\n\n此代码导入了评分 CSS 样式。下一步是在 `<body>` 标签的 `onload`\
  \ 事件中调用 `initRatings()` 函数，如下：\n\n```html\n<body onload=\"initRatings()\">\n```\n\
  \n这确保了所有评分都已初始化。从这里开始，代码在很大程度上取决于你如何组织评分。假设你有很多想要评分的项目。这里是小型评分（项目 ID 为 1）的代码：\n\n\
  ```html\n<div>\n  <span class=\"rating-label-small\">Rating:</span>\n  <span class=\"\
  inline-rating\">\n    <ul class=\"star-rating small-star\">\n      <li id=\"1-rating\"\
  \ class=\"current-rating\" style=\"width:0%\">Rating</li>\n      <li><a href=\"\
  javascript:setRating('1', 1)\" class=\"one-star\">1</a></li>\n      <li><a href=\"\
  javascript:setRating('1', 2)\" class=\"two-stars\">2</a></li>\n      <li><a href=\"\
  javascript:setRating('1', 3)\" class=\"three-stars\">3</a></li>\n      <li><a href=\"\
  javascript:setRating('1', 4)\" class=\"four-stars\">4</a></li>\n      <li><a href=\"\
  javascript:setRating('1', 5)\" class=\"five-stars\">5</a></li>\n    </ul>\n  </span>\n\
  \  <span id=\"1-info\" class=\"rating-info-small\">(click to vote)</span>\n</div>\n\
  ```\n\n你看到代码中的模式了吗？项目 ID 恰好出现了七次，而且每一个都非常重要。项目 ID 第一次出现在 `li` 列表项标签的 `id` 属性中，设置为\
  \ `1-rating`。接下来的五次出现在对每种可能的投票（一星到五星）调用 `setRating()` 函数调用中。在这种情况下，值 `1` 作为第一个参数传递给函数；这就是项目\
  \ ID。最后，项目 ID 在代码末尾 `span` 元素的 `id` 属性中再次作为 `1-info` 被引用。这就是评分组件的提示文本与特定项目关联起来的关键。\n\
  \n\n\n\n页面中的每个单独评分都必须正确设置这些项目 ID（item ID）引用。为了确保你理解其工作原理，让我们快速浏览过产品目录，直到找到项目 ID\
  \ 为 `379` 的产品。以下是为该项目添加评分组件的代码：\n\n```\n<div>\n  <span class=\"rating-label-small\"\
  >Rating:</span>\n  <span class=\"inline-rating\">\n    <ul class=\"star-rating small-star\"\
  >\n      <li id=\"379-rating\" class=\"current-rating\"\n        style=\"width:0%\"\
  >Rating</li>\n      <li><a href=\"javascript:setRating('379', 1);\"\n        class=\"\
  one-star\">1</a></li>\n      <li><a href=\"javascript:setRating('379', 2);\"\n \
  \       class=\"two-stars\">2</a></li>\n      <li><a href=\"javascript:setRating('379',\
  \ 3);\"\n        class=\"three-stars\">3</a></li>\n      <li><a href=\"javascript:setRating('379',\
  \ 4);\"\n        class=\"four-stars\">4</a></li>\n      <li><a href=\"javascript:setRating('379',\
  \ 5);\"\n        class=\"five-stars\">5</a></li>\n    </ul>\n  </span>\n  <span\
  \ id=\"379-info\" class=\"rating-info-small\">\n    (click to vote)</span>\n</div>\n\
  ```\n\n希望这段代码让你牢牢记住项目 ID 在评分代码中的位置。你可以根据需要多次粘贴这段代码以创建不同的评分，只要你每次都仔细地更改项目 ID 即可。\n\
  \n### Note\n\n![Note](img/note.jpg)\n\n另一个极易于应用的快速评分改新是将星形图像替换为你自己的图像。大星和小星形图像分别存储在\
  \ `star.gif` 和 `star_sm.gif` 文件中。这些每个文件都包含了悬停效果所需的三个不同星形。星形在 GIF 图像中垂直排列，且尺寸相同（大图为\
  \ 25×25，小图为 10×10）。如果你使用相同尺寸的图像并以相同的方式垂直排列，就可以轻松更改整个评分组件的外观——只需将你自己的星形图像文件覆盖 `star.gif`\
  \ 和/或 `star_sm.gif` 即可。\n\n在自己的页面中复用评分组件并不是唯一值得考虑的极端改新。虽然评分组件本身运行得很好，但你可能对使用 XML\
  \ 文件在服务器上存储评分数据并不完全满意。我选择这种方法主要是因为我不想让应用程序变得比必要的更复杂，而引入数据库会增加相当大的额外复杂度。但这并不是一个坏主意。\n\
  \n如果你具有一些 `MySQL` 或其他数据库的经验，你可能会考虑重写 `ratingkit.php` 服务器脚本，使其使用数据库而不是 XML 文件来读取和写入评分数据。与其深入探讨\
  \ `MySQL` 实现的具体编码细节，我将只需为你勾勒出如何操作的总体蓝图。\n\n简而言之，要更改 Ajax Toolkit 中的评分组件以便使用 `MySQL`\
  \ 数据库进行评分存储和检索而不是 XML 文件，需要以下步骤：\n\n1. 创建一个名为 `rating` 的数据库表，包含以下字段：`id, avg` 和\
  \ `votes`。这些字段与 `ratings.xml` 文件中同名的标签一一对应。\n2. 修改 `ratingkit.php`，使其建立数据库连接而不是打开\
  \ XML 文件。\n3. 修改 `ratingkit.php`，使其通过数据库查询从 `rating` 表读取所有行，而不是读取 `ratings.xml`\
  \ 文件。\n4. 修改 `ratingkit.php`，使所有遍历 XML 数据结构中评分的代码改为遍历从数据库查询返回的行。\n5. 修改 `ratingkit.php`，使其修改\
  \ `rating` 表中的相应行来存储评分，而不是写入 XML 文件。\n\n我意识到这个步骤列表非常通俗，并且需要相当的 `MySQL` 经验才能执行。但坦诚地说，这正是目的所在——如果你没有完成此任务的\
  \ `MySQL` 技能，我宁愿看到你坚持 XML 文件解决方案。相信我，对于任何拥有数据库技能的人来说，这都是一个非常基本的数据库挑战。如果你缺乏数据库技能（正如我们中的许多人一样），只需使用\
  \ XML 版本即可，知道它应该能完全满足你的需求。\n\n## 总结\n\n尽管你可能并不总是喜欢收到的反馈，但很难否认允许用户自由对你网站上的内容进行评分的好处。评分是任何交互式网站的关键功能之一。评分提供了任何交互式网站的关键功能之一。\n\
  \n# 第三部分 附录\n\n## 附录 A. Ajax 的过去、现在与未来\n\n也许你完全不在乎 Ajax 是从哪里来的，但如果你感兴趣，我认为这堂历史课是值得的。通过稍微了解\
  \ Ajax 的起源，你将能够更好地评估它在未来可能扮演的角色。它是一项非常令人的技术，但在许多方面仍然处于探索阶段。那么，Ajax 到底是从哪里来的，它又将向何处发展？让我们去探个究竟。\n\
  \n### Ajax 爆发\n\n\n\n\n\n重大技术转型很少在抽象中发生。以 Ajax 而言，需要一个真实的案例来证明这项技术有多大的吸引力。这个例子过去是、现在也是\
  \ Google Maps。Google Maps 于 2005 年 2 月以测试版的形式向世界发布，让许多 Web 开发者大开眼界，他们惊讶于地图竟然可以实时拖动。这么多数据怎么可能传输得这么快？事实证明，这是\
  \ `Ajax` 的一种非常巧妙的使用，让 Google Maps 看起来如此灵敏。在实际上，该应用程序尝试预测你的下一步操作并异步预加载地图数据。\n\n###\
  \ Note\n\n![Note](img/note.jpg)\n\n值得注意的是，社交网站 Orkut 在技术上是 `Ajax` 的第一个主流应用，但它带来的远比不上\
  \ Google Maps 带来的震撼感。Orkut 使用（并继续使用）`Ajax` 让用户能够通过星级评分系统对他们的朋友进行评分。\n\n至少在我看来，Google\
  \ Maps 正式开启了 Web 应用程序的 `Ajax` 时代。狂潮已经开始，现在许多主流应用都具有不可辨认的 `Ajax` 风格。Gmail、Flickr\
  \ 和 Netflix 只是其他被大量注入 `Ajax` 的主流应用中的几个，它们再也不会回到“点击、等待、重新加载”的时代。凭借这项技术背后的巨大动力，随着时间的推移，我们无疑会看到更多应用变为\
  \ `Ajax` 驱动。\n\n### Ajax 的下一步是什么？\n\n尽管 `Ajax` 迅速崛起，但在规划通未来的道路时，有必要从全局角度来看待问题。可以确定的一点是，科技行业中的许多人仍然没有从\
  \ 90 年代末互联网泡沫破灭中吸取教训。“理性越热”一词被用来描述导致那个时期科技股无节制上涨的心态。问题的很大程度上在于人们倾向于紧抓住下一个“宏大想法”，就好像它将改变我们所知的的世界一样。当然，互联网整体在很大程度上改变了世界，但我们中的许多人倾向于过度渲染每一项新进展，就得好像它本身就承载着无法想象的进步、效率、财富等承诺。`Ajax`\
  \ 就是这些新进展之一。\n\n如果用更开阔的视角来观察，就会发现 Ajax 仅仅是 Web 演进中的一项进展。我并不是要低估这项进展的重要性，但我提醒大家，我们都不应该沉溺在新奇感的兴奋中迷失自我。`Ajax`\
  \ 确实提供了更快速响应且最终更易用的 Web 的承诺，这值得兴奋。但同时，不要忘记它解决的是一个非常特定的问题，而这个问题并不一定是每个 Web 应用程序的问题。`Ajax`\
  \ 并不是你向所开发的每个 Web 页面发射的灵丹妙药。\n\n当我们进入“Web + `Ajax`”的未知未来时，我们克制 `Ajax` 使用的程度最终可能对\
  \ `Ajax` 的持续成功起关键作用。这与多种原因有关，其中之一是，尽管通常传输的信息减少了，但 `Ajax` 实际上可能会给服务器带来更多的工作负载。确实，你消除了每次请求都要发送的整页页数据，但你选择了发送几十个请求而不是只发送一个。取决于特定的服务器配置，多个小请求可能比一个大请求更容易产生更多的瓶颈。\n\
  \n所有这些都是想说，在处理未来的 Web 项目时，你应该意识到 `Ajax` 是一个极其好手的工具，但它根结底仍然只是一个工具。那句“拿着锤子看什么都像钉子”的老话在这里绝对适用。仅仅因为你有知识和代码可以将\
  \ `Ajax` 注入到你所做的一切事中，并不意味着它是正确的。同时，即使是结构良好的微小 `Ajax` 应用也可以极具吸引力，并显著提高应用程序的可用性。如果我们都能带有一点创造性的克制来使用\
  \ `Ajax`，未来的 Web 将无疑是一个更加愉快的生活和工作场所。\n\n## 附录 B. XMLHttpRequest 快速简易参考\n\n尽管本书的主旨是让你能够使用\
  \ `Ajax`，而无需沉浸在异步 JavaScript 编码的细节中，但你可能会被示例激发足够的动力去深入研究 `Ajax` 编程。如果是这样，你将彻底理解\
  \ `XMLHttpRequest` 对象——这个对象包含了负责让 `Ajax` 运行的主要功能。本附录为你提供了关于 `XMLHttpRequest` 对象的简明参考，以及关于如何用用其方法和属性的一些有用提示。有关核心\
  \ JavaScript 语言所支持的所有对象的完整参考，请参阅 [`developer.mozilla.org/en/docs/Core_JavaScript_1.5_Reference`](http://developer.mozilla.org/en/docs/Core_JavaScript_1.5_Reference)。\n\
  \n### Methods\n\n`XMLHttpRequest` 对象包含几个方法，用于与 Web 服务器建立连接并发送和数据。尽管该对象的现代用法通常涉及异步通信，但该对象完全能够执行同步操作。你如何使用对象的方法决定了特定请求的性质。\n\
  \n以下是 `XMLHttpRequest` 对象支持的主要方法：\n\n* `open()`\n* `send()`\n* `abort()`\n* `overrideMimeType()`\n\
  * `setRequestHeader()`\n* `getAllResponseHeaders()`\n* `getResponseHeader()`\n\n\
  在这些方法中，前两个是最重要且最常用的。接下来的几节将更详细探讨这些方法。\n\n### open()\n\n```\nopen(method, url[, async[,\
  \ userName[, password]]])\n```\n\n`open()` 方法打开服务器请求并为即将到来的通信做好准备。两个必需参数（`method`\
  \ 和 `url`）分别指定请求方法和服务器连接的 URL。请求方法参数可以是 `\"GET\"` 或 `\"POST\"`，取决于你是在进行一个简单的的数据检索请求（`\"\
  GET\"`），还是需要作为请求的一部分向服务器发送大量数据（`\"POST\"`）。如果你只是发送几条信息，仍然可以使用 `GET` 方法，但对于较大的数据提交请求（大于\
  \ 512 字节），`POST` 是你的最佳选择。\n\n### Tip\n\n![Tip](img/tip.jpg)\n\n另一种知道何时使用 `GET` 或\
  \ `POST` 作为 `Ajax` 请求的请求方法的方便方法，是根据请求评估服务器上的数据是否会发生变化。如果服务器的状态由于请求而改变，那么 `POST`\
  \ 就是答案；否则，使用 `GET`。\n\n`url` 参数可以指定为绝对（完整）URL 或相对 URL，但请记住，无论哪种情况，URL 必须与生成请求的 JavaScript\
  \ 代码匹配。换句话说，Ajax 连接只能在 Ajax 脚本代码所在的服务器上发送请求。这是 `XMLHttpRequest` 对象的一个安全限制，但它是为了保护用户免受恶意\
  \ Ajax 代码编写者的侵害。\n\n\n\n\n\n`open()` 方法的第三个参数 `async` 是可选的布尔值，用于决定是否异步地处理请求。默认值\
  \ `true` 表示异步（Ajax）请求，而 `false` 则表示同步请求。在实践中，这意味着同步请求会使你的脚本在执行任何其他操作之前等待响应，而异步请求则在后台进行，仅在完成后才报告结果。在极少数特殊情况下，同步请求是有意义的，例如在允许用户继续执行任务之前需要等待绝对至关重要的数据，但在大多数情况下，你将倾向于使用异步请求。此外，异步性正是\
  \ Ajax 如此酷炫的原因。\n\n### 注意事项\n\n![Note](img/note.jpg)\n\n大多数支持 Ajax 的浏览器会将 Ajax 请求限制在\
  \ HTTP 请求（`http:` 协议）上，这意味着你将无法使用 `file:` 协议从本地硬盘测试 Ajax 脚本。当然，你始终可以在本地安装 Web 服务器，在这种情况下你就可以使用\
  \ `http:` 协议来打开 Ajax 页面。\n\n`open()` 的最后两个参数完全可选的，它们最终取决于你的服务器是否需要用户名和密码来执行该请求。\n\
  \n下面是一个创建一个 `XMLHttpRequest` 对象并调用 `open()` 方法来建立异步请求的简单示例：\n\n```\nvar request\
  \ = new XMLHttpRequest;\nrequest.open(\"GET\", \"processSomeStuff.php\", true);\n\
  ```\n\n`XMLHttpRequest` 对象有两个方面与 `open()` 方法紧密相关：`send()` 方法和 `onreadystatechange`\
  \ 事件处理程序。`send()` 方法必须在 `open()` 方法之后调用，才能实际执行 Ajax 请求。`onreadystatechange` 事件被分配了一个你自己的回调方法，该方法会在\
  \ Ajax 请求完成后自动调用。换句话说，你必须编写自己的函数，每当 Ajax 请求完成工作时，该函数就会被调用。这个函数就是你处理从完成的 Ajax 请求返回的数据的地方。\n\
  \n### send()\n\n```\nsend(content)\n```\n\n`send()` 方法负责实际向服务器发送请求进行处理。在调用 `send()`\
  \ 之前，必须已经调用 `open()` 准备好连接。`send()` 方法的唯一参数 `content` 是作为请求的一部分发送到服务器。在许多情况下，你只是单纯发送服务器请求而不发送任何数据，在这种情况下，向\
  \ `send()` 方法传递 `null` 是完全可以的，如下：\n\n```\nrequest.send(null);\n```\n\n在使用 `\"GET\"\
  ` 请求方法时，经常向 `send()` 方法传递 `null`。相反，`\"POST\"` 方法专门为向服务器传递数据而设计，在这种情况下，你会希望在 `content`\
  \ 参数中包含有意义的数据。\n\n通过 `content` 参数传递到 `send()` 方法的内容可以是字符串、无符号字节数组或 XML DOM 对象。在许多情况下，你只需向该方法传递一个字符串，在这种情况下，它通常接受熟悉的\
  \ `POST` 风格的键/值对，如示例所示：\n\n```\nrequest.send(\"artist=phish&album=rift&track=weigh\"\
  );\n```\n\n需要注意的是，对于异步请求，你需要在调用 `send()` 方法之前设置 `onreadystatechange` 事件处理程序。否则，你的事件处理程序回调方法将永远不会被调用，Ajax\
  \ 效果将完全丢失。下面是句设置该处理程序的示例，这必须在调用 `send()` 方法之前进行：\n\n```\nrequest.onreadystatechange\
  \ = yourHandler;\n```\n\n请记住，当 Ajax 请求完成后，会自动调用 `yourHandler()` 函数，以便你对请求返回的数据进行一些用的操作。\n\
  \n### abort()\n\n```\nabort()\n```\n\n`abort()` 方法停止服务器请求。该方法在超时情况下非常有用，当你选择放弃一个耗时较请求时。你也可以调用\
  \ `abort()` 方法来确保请求对象在重用它来执行另一个请求之前被重置。下面是调用 `abort()` 方法终止 Ajax 请求的示例：\n\n```\n\
  request.abort();\n```\n\n### overrideMimeType()\n\n```\noverrideMimeType(type)\n\
  ```\n\n`overrideMimeType()` 方法为你提供了一种手段，可以覆盖服务器响应请求返回返回数据的 MIME 类型。这在你期望 XML 但由于某些原因无法让服务器配合时非常有用。例如，服务器可能因为\
  \ XML 数据格式不完美而拒绝 XML 数据，在这种情况下，服务器将通过 `responseText` 属性以原始文本的形式返回数据。如果你调用 `overrideMimeType()`\
  \ 方法并将 `\"text/xml\"` 指定为 MIME 类型，服务器将尝试在 `responseXML` 属性中返回 XML 数据：\n\n```\nrequest.overrideMimeType(\"\
  text/xml\");\n```\n\n### 注意事项\n\n![Note](img/note.jpg)\n\n`overrideMimeType()` 方法应该在调用\
  \ `open()` 方法之后但在调用 `send()` 方法之前调用。\n\n### setRequestHeader()\n\n```\nsetRequestHeader(label,\
  \ value)\n```\n\n`setRequestHeader()` 方法用于向请求头添加标签/值对。对于普通的 `GET` 请求，此方法不是必需的，但在进行\
  \ `POST` 请求时是关重要的。例如，以下请求头设置允许服务器知道 `POST` 请求中的数据将以编码 URL 的形式存在\n\n```\nrequest.setRequestHeader(\"\
  Content-Type\",\n  \"application/x-www-form-urlencoded\");\n```\n\nXML 是发布 `POST`\
  \ 请求的另一种流行数据格式。如果你计划在 `POST` 请求中向服务器传递 XML 数据，那么需要以下请求头设置：\n\n```\nrequest.setRequestHeader(\"\
  Content-Type\",\n  \"text/xml\");\n```\n\n设置请求头的需要最终取决于你的特定请求。如果你的请求是 `POST`，你应该始终设置它。否则，在\
  \ `GET` 的情况下，不设置请求头上的任何内容通常也没问题。\n\n### getAllResponseHeaders()\n\n```\ngetAllResponseHeaders()\n\
  ```\n\n`getAllResponseHeaders()` 方法返回与响应相关的所有响应头，返回为一个包含一系列换行符分隔的标签/值对的字符串。可能更有用的是\
  \ `getResponseHeader()` 方法，它返回特定头部标签的单个值。\n\n### getResponseHeader()\n\n```\ngetResponseHeader(headerLabel)\n\
  ```\n\n`getResponseHeader()` 方法接受特定头部的标签，并返回该标签对应的头部字符串值。例如，你可以通过获取 `\"Content-Type\"\
  ` 标签的响应头来确定请求的内容类型，如下所示：\n\n```\nvar header = request.getResponseHeader(\"Content-Type\"\
  );\n```\n\n在此示例中，存储在 `header` 变量中的返回值可能是 `text/xml` 或 `text/plain` 之类的，取决于请求返回的数据类型。\n\
  \n### 属性\n\n方法只是 `XMLHttpRequest` 方程的一半部分。几个属性也发挥了作用，并且对于成功执行 Ajax 请求实际上非常重要。以下是\
  \ `XMLHttpRequest` 对象支持的最重要的属性：\n\n* `readyState`\n* `status`\n* `statusText`\n\
  * `responseText`\n* `responseXML`\n\n\n\n\n这些属性非常重要，因为它们能为你提供有关 Ajax 请求状态和状况的关键信息，例如请求是否已完成并成功，以及存储\
  \ Ajax 请求返回的数据。所有这些属性都是只读的，意味着你无法设置它们的值。前三个属性与请求的状态和状态有关，而后两个属性用于访问从请求返回的实际数据。接下来的几节将深入探讨这些属性的工作原理。\n\
  \n### readyState\n\n`readyState` 属性反映请求的当前状态，是你跟踪请求进展的首要手段。随着请求的执行，该属性会经历一系列值，其中最后一个值表示请求已完成。以下是\
  \ `readyState` 属性可能的取值，按出现顺序排序：\n\n*   `0`—未初始化 (Uninitialized)\n*   `1`—加载中 (Loading)\n\
  *   `2`—已加载 (Loaded)\n*   `3`—交互中 (Interactive)\n*   `4`—完成 (Complete)\n\n这些属性值，你通常只关心最后一个，因为它表示请求的完成。然而，在检测成功的\
  \ Ajax 请求时，`readyState` 属性值为 `4` 并不意味着结束。你还需要考虑 `status` 属性。\n\n### Note\n\n![Note](img/note.jpg)\n\
  \n分配给 `onreadystatechange` 事件处理器的自定义回调方法在每次 `readyState` 属性值变化时都会被调用。这就是为什么在回调方法中对请求采取行动之前，检查\
  \ `readyState` 属性是否等于 `4` 是非常重要的——你需要在执行任何操作之前确认请求已完成。\n\n### status\n\n`status`\
  \ 属性记录了当前的 HTTP 服务器状态，该状态可以是许多不同值之一，包括表示“未找到”的 `404` 或表示“OK”的 `200`。从 Ajax 的角度来看，实际上你真正感兴趣的是\
  \ `status` 设置为 `200`，这表示请求执行“成功”。可能会出现很多其他代码，但你主要关注 `200`，因为任何其他代码都意味着存在问题。\n\n\
  你通常会在检查 `readyState` 属性是否等于 `4` (Complete) 的同时，检查 `status` 属性是否等于 `200` (OK)。如果两个属性都通过，你就知道请求已完成，可以开始处理请求数据。\n\
  \n### statusText\n\n`statusText` 属性包含一个与当前状态码相关的字符串消息。例如，成功状态码 `200` 的状态文本为 `\"\
  OK\"`。如果请求以 `200` 以外的状态码失败，你可能考虑显示状态文本以进行诊断或错误处理。\n\n### responseText\n\n`responseText`\
  \ 属性是用于存储 Ajax 请求返回数据的属性对中的一半。我之所以说它是属性对的一半，是因为另一个名为 `responseXML` 的属性能够返回与 `responseText`\
  \ 格式不同的数据。如果你计划以原始文本的形式接收请求数据，`responseText` 是你想要使用的属性，因为它只需为你提供一个包含数据的字符串文本。\n\n\
  ### responseXML\n\n响应数据属性对的另一半是 `responseXML` 属性，它将请求返回的数据格式化为与 DOM 兼容的 XML 文档节点对象。由于\
  \ `responseXML` 属性为你提供 DOM 节点对象，你可以使用所有极其强大且灵活的 DOM 方法和属性来探索和操作数据。虽然通过 `responseText`\
  \ 属性以原始文本处理 Ajax 请求数据是完全可行且通常很有用的，但 `responseXML` 提供的 XML 请求数据结构赋予了 Ajax 许多力量。\n\
  \n需要注意的是，只有当响应的内容类型被设置为 XML MIME 类型 `text/xml` 时，请求数据才会存储在 `responseXML` 属性中。在许多情况下，XML\
  \ MIME 类型会根据对响应中 XML 数据的识别自动设置。然而，并非总是如此，你可能会遇到尽管知道响应正在接收 XML 数据但 `responseXML`\
  \ 属性仍为空的情况。解决方案是通过 `overrideMimeType()` 方法将请求的 MIME 类型显式设置为 `\"text/xml\"`。\n\n\
  ### Events\n\n在任何 Ajax 应用中，幕后发挥魔术的事件是 `onreadystatechange`，它会在请求的就绪状态发生变化时触发。此事件通常被分配一个自定义事件处理方法，该方法根据就绪状态的变化采取行动。你的工作是在此方法内检查并确保请求已完成\
  \ (`readyState == 4`) 且无错误地运行 (`status == 200`)。\n\n## 附录 C. 使用 Live Linux CD\n\n\
  Live CD 是存储在移动式光盘上的整个计算机操作系统。该 CD 可以在大多数标准 PC 上直接引导，忽略你硬盘的内容，并作为桌面、服务器或其他特殊系统运行。本书随附的\
  \ *Ajax Construction Kit* live CD 包含了这三者的元素。使用此 live CD，你可以实时运行书中所有的示例，在阅读书籍时跟随代码，并修改代码以备后用。\n\
  \n### Live CD 内部\n\n该 live CD 是一个经过重新制制的 Ubuntu Linux live CD，经过调整后包含了以下组件：\n\n\
  *   **Ajax Construction Kit 示例—.** 书中描述的所有示例应用程序都包含在 live CD 中。\n*   **Web 服务器—.**\
  \ live CD 包含了 XAMPP 服务器。只需点击一下，你就可以启动服务器，在本地计算机或通过另一个浏览器尝试这些示例。\n*   **工具—.** live\
  \ CD 还包含了 Firefox 浏览器（用于显示示例）和 Bluefish 编辑器（用于修改代码）。由于该 CD 是一个功能全桌面 live CD，你还可以使用其他命令行工具和应用程序。\n\
  *   **文档—.** 顶部面板中的链接让你能够访问 Ajax、PHP 和 XAMPP 文档，以防你在处理代码时需要参考资料。\n\n将 *Ajax Construction\
  \ Kit* CD 作为 live CD 使用，意味着在重启 PC 之后，显示、使用和修改项目所需的所有软件无需任何特殊配置即可直接可用。然而，在你不想（或被允许）重启正在工作的\
  \ PC 的情况下，该 CD 也提供了处理代码的其他方法。\n\n在 CD 上，我们包含了一个 XAMPP 服务器包版本，它可以轻松安装在 Windows 系统上。遵循使用该软件的说明并添加\
  \ CD 中的代码示例，你可以从 Windows 桌面运行 Ajax 项目。你需要的一切都包含在 CD 中。（你只需要再做一点设置。）\n\n### 运行 Live\
  \ CD\n\n对于一台带有至少 256MB 内存和 Pentium III 650MHz（或更高）处理器的普通 PC，live CD 的运行性能应该相当良好。以下是操作步骤：\n\
  \n1.  将 CD 插入标准 PC 并重启。\n2.  在启动界面按回车键选择启动 (Start) 或安装 (Install)。\n3.  几分钟后桌面出现时（请耐心），打开\
  \ Start LAMPP 图标启动服务器。\n4.  服务器运行后，打开 Start Projects 图标以查看并处理项目。\n\n此时，你应该看到 Firefox\
  \ Web 浏览器打开了索引页，从那里你可以运行书中的所有代码示例。live CD 的 Ubuntu 桌面以及 *Ajax Construction Kit*\
  \ 组件如图 C.1 所示。\n\n\n\n\n\n![Live CD 提供了启动 XAMPP Web 服务器和探索 Ajax 示例应用程序的便捷访问](img/acfig01.jpg)\n\
  \n**图 C.1. Live CD 提供了启动 XAMPP Web 服务器和探索 Ajax 示例应用程序的便捷访问。**\n\n如果您想开始修改代码示例，请选择顶部面板中的\
  \ `Bluefish` 图标。`Bluefish` 编辑器（位于图 C.1 的右上角）会在左列显示 Ajax 代码示例文件。您可以根据需要更改任何文件。然后通过刷新页面在\
  \ Firefox 浏览器中实时查看结果。\n\n除了 `Bluefish` 编辑器的图标外，顶部面板还有其他实用的图标。面板中的每个小书图标都代表指向不同支持信息的链接。它们包括指向\
  \ Ajax 及其相关文档的链接，以及指向 `XAMPP` 服务器信息的链接。\n\n整个 `XAMPP` 服务器文件存储在 `/opt/lampp` 文件夹中。代码示例存储在\
  \ `/opt/lampp/htdocs` 文件夹中。您对代码或服务器设置的任何想要保留的更改必须在关机之前保存（稍后我会讨论）。如果不保存这些文件，下次重启时，您的\
  \ live CD 系统所有内容将恢复到原始状态。\n\n### 设置网络\n\n许多 Ajax 项目需要连接互联网才能正常工作。Linux 中的大多数有线以太网卡将被自动检测并配置。如果线上有\
  \ `DHCP` 服务器，您很可能会自动连接并立即访问互联网。\n\n无线连接在 Linux 中可能更具挑战性。由于许多无线网卡需要制造商提供的专有固件，而这些固件无法合法随\
  \ Linux 重新分发，因此这些网卡可能需要一些额外工作才能在 Linux 中运行。其他网卡则完全无法工作（尽管完全不支持的卡数量在过去几年已大幅减少）。\n\
  \n无论是有线还是无线，在 live CD 上尝试设置网络的地方都是“网络设置”（Network Setup）窗口。从 live CD 桌面选择 `System`、`Administration`、`Networking`。该窗口会立即显示您的网络接口硬件是否已检测并配置运行。您可以对显示为可用的接口进行任何手动配置（例如，在需要时设置静态\
  \ IP 地址）。\n\n如果网络设置窗口告诉您的无线网卡未配置，请打开 `Terminal` 窗口（从顶部面板的 `Terminal` 图标）进行一些侦查工作。输入以下命令尝试确定您正在使用的无线网卡类型：\n\
  \n```\n$ lspci -v |grep -i wireless\n```\n\n执行命令后，您可能会看到类似所示的内容：\n\n```\n02:02.0\
  \ Network controller: Intel Corporation PRO/Wireless\n2200BG Network Connection\
  \ (rev 05)\n```\n\n在此示例中，无线网卡是 `Intel PRO/Wireless 2200BG` 卡。有了该信息，访问您最喜欢的搜索引擎（假设您有设备可以上网，或可以临时连接到有线网络），并搜索网卡型号和单词“Linux”（例如“Linux\
  \ 2200BG”）。这个示例找到了 `ipw2200` 驱动项目。我将继续这个示例。首先，我检查驱动是否已加载：\n\n```\n$ lsmod |grep\
  \ ipw2200\n```\n\n该命令的匹配结果显示驱动确实已加载：\n\n```\nipw2200     115652   0\n```\n\n如果驱动未安装，我必须下载（或通过其他方式在机器上获取驱动），然后使用\
  \ `modprobe` 命令加载它（例如 `sudo modprobe ipw2200`）。接下来，我必须获取网卡所需的固件。许多无线网卡的驱动位于 `/lib/firmware`\
  \ 文件夹中。如果所需的固件不在那里，请下载固件并将其添加到 `/lib/firmware` 文件夹。\n\n此时，您应该能够配置无线网卡了。在网络设置窗口中选择您的无线网卡并选择\
  \ `Properties`（属性）窗口。设置您的无线设置（ESSID、密码和配置类型，例如静态或 DHCP）。在 `Terminal` 窗口中输入 `sudo\
  \ /etc/init.d/networking restart` 重启网络接口。现在您应该可以选择顶部面板中的 `Network Monitor`（网络监控）图标来检查无线网卡的活动了。\n\
  \n### 备份数据\n\n正如我之前提到的，在 live CD 会话期间进行的任何更改在重启后都会消失，除非您以某种方式备份了数据。您可以将 *Ajax Construction\
  \ Kit* 数据备份到本地硬盘、USB 闪存或通过网络备份。然后，下次启动 live CD 时，您就可以恢复这些数据。这里是使用 USB 闪盘备份数据的示例。\n\
  \n将存储设备（如 U 盘）插入 USB 端口。如果它已格式化，live CD 应该检测到它并在桌面的单独窗口中打开任何已格式化的分区。接下来，打开 `Archive\
  \ Manager`（归管理器）（选择 `Applications`、`Accessories`、`Archive Manager`）。从归管理器中选择 `New`，然后添加存档名称（例如\
  \ `AjaxProjects`）和保存文件夹（例如 `/media/usbdisk` 或代表您的 U 盘的其他名称）。选择 `New`。\n\n从桌面打开 `Ajax\
  \ Applications` 文件夹。然后选择该文件夹的部分或全部文件和文件夹，将其拖放到 `Archive Manager` 窗口。压缩包（tar 和 gzipped）现在已保存到您的\
  \ USB 驱动器上。\n\n下次启动 *Ajax Construction Kit* live CD 时，再次打开 `Archive Manager` 窗口。选择\
  \ `Archive`、`Open` 并打开插入的 USB 驱动器上的存档。选择 `Edit`、`Select All` 高亮包中的所有文件。然后选择 `Archive`、`Extract`。\n\
  \n选择 `Extract in Folder` 以选择 `/opt/lampp/htdocs` 文件夹来提取文件。在默认设置下，您将重建文件夹并覆盖现有文件。请确保这是您想要执行的操作。然后选择\
  \ `Extract`。\n\n上述程序也可用于将您的 Ajax 项目文件和文件夹复制到另一个计算机系统（例如 Windows 电脑），以便在该机器上工作或运行项目。如果是如此，您可能希望选择如\
  \ `.zip` 的存档类型，以确保您可以在新系统上提取文件。\n\n### 注意\n\n![注意](img/note.jpg)\n\n如果您想备份整个 Web\
  \ 服务器（`/opt/lampp`），您可能需要从命令行执行，而不是从 `Archive Manager` 窗口执行。这是因为您可能需要 root 权限来访问某些文件。您可以使用以下命令将整个\
  \ `XAMPP` 服务器（包括 Ajax 项目）备份到您的 USB 磁盘。第二个命令允许您恢复它：\n\n```\n$ sudo tar cvfz /media/usbdisk/lampp-backup.tar.gz\
  \ /opt/lamp\n$ cd / ; sudo tar xvfz /media/usbdisk/lampp-backup.tar.gz\n```\n\n\
  ### 直接在 Windows PC 上运行 live CD\n\n有些人可能倾向于不重启电脑来尝试书中的示例。如果是您的情况，您可以在 Windows 系统上安装\
  \ `XAMPP` 服务器软件，并从那里尝试代码示例。您将无法获得 live CD 提供的所有工具，但您可以在熟悉的 Windows 环境中工作。\n\n要在您的\
  \ Windows 系统上安装并运行书中的 `XAMPP` 服务器和代码示例，请执行以下操作：\n\n1. 从正在运行的 Windows 系统，插入随书附的 live\
  \ CD。\n2. 在资源管理器窗口中打开 live CD 并导航到 `\\Windows` 文件夹。\n\n\n\n\n\n3. 从 CD 的 `\\Windows`\
  \ 文件夹打开 XAMPP 安装程序（`xampp-win32-1.6.0a-installer.exe`）并按照安装说明操作。它是为 Windows 2000、NT\
  \ 和 XP 专业版制作的。如果你需要帮助，请参考 Windows 版 XAMPP 常见问题（[www.apachefriends.org/en/faq-xampp-windows.html](http://www.apachefriends.org/en/faq-xampp-windows.html)）。\n\
  \n4. 如果选择了所有默认选项，软件将解压缩，你最终会得到一个 XAMPP 控制面板桌面图标。打开该图标。\n\n5. 当 XAMPP 控制面板窗口出现时，选择\
  \ Apache 和 MySql 的 Start 按钮。（如果 Windows 提示你解除端口锁定，如果你只是想从桌面操作服务器，则无需解除锁定。）\n\n6.\
  \ 将你的 *Ajax Construction Kit* CD 插入光驱器，并浏览到 Windows 文件夹（例如，`D:\\Windows`）。\n\n7.\
  \ 打开 `Examples` 文件夹，选择编辑（Edit）、全选（Select All）并复制（Copy）。使用你的资源管理器窗口浏览到 XAMPP 窗口中的\
  \ `htdocs` 文件夹。此文件夹位于你的硬盘上，路径类似于 `C:\\Program Files\\xampp\\htdocs`。然后选择编辑（Edit）、粘贴（Paste）。\n\
  \n8. 所有的 Ajax 项目就绪后，你就可以开始使用它们了。从机器上的任何 浏览器输入以下 Web 地址即可打开 *Ajax Construction Kit*\
  \ 示例：\n\n```\nhttp://localhost/index.html\n```\n\n你可以使用 Windows 系统上现有的任何文本编辑器或 Web\
  \ 内容管理工具开始处理 Ajax 项目。\n\n### 在 Mac PC 上直接运行 Live CD\n\n如果你有一台基于 Intel 芯片的 Mac 电脑，可以直接运行\
  \ live CD。不过，你也可以选择使用内置的 Apache 软件在 Mac OS X 上运行 Ajax 代码示例。\n\nLive CD 可以在较新的基于\
  \ Intel 的 Mac 电脑（如 Mac Mini）上启动，并按照本附录之前介绍的方法使用。插入 live CD，按住 `Alt` 键重启，并选择从 CD\
  \ 启动。（它会被标记为 Windows CD。）你的有线以太网卡无需额外配置即可工作。然而，无线以太网卡可能在 Linux 中无法从电脑工作。除此之外，live\
  \ CD 的运行方式与在任何基于 Intel 的 PC 上一样。\n\n如果你倾向于在 Mac OS X 中原生运行代码示例，那么你很幸运了。新的 Mac 系统内置了\
  \ Apache，因此你只需要进行一些配置，添加示例并启动服务器。方法如下：\n\n1. 打开终端（Terminal）窗口，切换到 root 用户（`su -`），并使用任何文本编辑器编辑\
  \ `/etc/httpd/httpd.conf` 文件。你需要搜索四行，并删除每这些行前的注释字符（`#`），以便为你的 Apache 服务器启用 PHP 和\
  \ Perl。取消注释后的行看起来如下：\n\n```\nLoadModule perl_module  libexec/httpd/libperl.so\n\
  LoadModule php4_module  libexec/httpd/libphp4.so\nAddModule mod_perl.c\nAddModule\
  \ mod_php4.c\n```\n\n关闭终端窗口并返回 OS X 桌面。\n\n2. 插入 live CD，然后从 CD 打开 Windows/Examples\
  \ 文件夹。你应该看到所有的 Ajax 代码示例文件和文件夹。\n\n3. 打开文件浏览器（选择 Macintosh HD 图标）并导航到你的主目录。从你的 `home`\
  \ 文件夹打开 `Sites` 文件夹。\n\n4. 将 `Sites` 文件夹中现 `index.html` 文件重命名为其他名称（例如 `index-original.html`）。\n\
  \n5. 选择 `Examples` 文件夹中的所有内容，然后将这些内容拖到你的 Sites 文件夹。\n\n6. 打开“System Preferences”（系统偏好设置）并选择“Sharing”（共享）（位于“互联网与网络”下）。\n\
  \n7. 在共享窗口中，选择个人网页共享（Personal Web Sharing）。这将启动 Apache Web 服务器并开始提供 Ajax 代码示例。\n\
  \n8. 在共享窗口中，选择“...your personal website at...”之后显示的链接，它看起来应该所示：\n\n```\nhttp://10.0.0.1/~user\n\
  ```\n\n或者你可以在浏览器地址栏中输入类似 `http://localhost/~user`（其中 `user` 替换为你的用户名）。\n\nAjax 代码示例将出现在浏览器窗口中，准备好运行。\n\
  \n### 以其他方式运行 Live CD\n\n鉴于如今有海量的开源和专有软件，人们开发了各种方法在不同的环境中运行软件。如果通过 live CD 和 Windows\
  \ 方法处理 *Ajax Construction Kit* CD 不完全符合你的需求，这里有其他方法可以让你设置该 CD 中的软件以供本书使用：\n\n- **带有模拟器的\
  \ Windows 桌面——** 使用虚拟化软件，如 VMPlayer（[www.vmware.com](http://www.vmware.com)）或 QEMU（[www.qemu.org](http://www.qemu.org)），你可以将\
  \ live CD 作为虚拟机运行。实际上，live CD 将在你 Windows 或 Linux 桌面的窗口中运行。\n\n- **你当前的 Web 服务器——**\
  \ 你可以将 CD 上 `/Windows/Examples` 文件夹中的项目复制到你自己的 Web 服务器，并在那里运行代码。\n\n- **任何硬盘分区——**\
  \ 如果你在硬盘上除 Windows 或 Linux 分区之外有可用空间，你可以将 live CD 的全部内容安装到电脑硬盘上。除非现有磁盘分区之外有空闲空间，或者你不在意清除电脑硬盘上的内容，否则此过程可能会有点复杂。因为你需要调整现有的磁盘分区来实现。\n\
  \n一旦你有了可用的磁盘或分区，实际安装 live CD 的过程非常简单。只需选择 live CD 桌面上的 Install（安装）图标。安装程序将引导你完成安装\
  \ live CD 的过程，让你能够从硬盘使用其内容。\n\n- **任何 Linux 系统——** 完整的 XAMPP 栈和 Ajax 示例包含在 CD 的一个\
  \ tar 包中（`/Linux/xampp-linux-1.6-Ajax.tar.gz`）。你可以将该包的内容解压到几乎任何未运行 Web 服务器的 Linux\
  \ 系统上，并使用该系统的项目。作为 root 用户，在插入 CD 后，运行以下命令将包解压到你的 `/opt` 文件夹并启动服务器：\n\n```\n# cd\
  \ /opt ; tar xvfz /media/disk/Linux/xampp-linux-1.6-Ajax.tar.gz\n# /opt/lampp/lampp\
  \ start\n```\n\n请记住，live CD 的设置主要是作为学习编写 Ajax 代码的教学工具。虽然 XAMPP 可以用作专业的 Web 服务器，但它目前尚未进行安全配置。在公共网络上使用示例代码或\
  \ Web 服务器之前，请务必采取措施锁定该内容的安全性。\n\n"
