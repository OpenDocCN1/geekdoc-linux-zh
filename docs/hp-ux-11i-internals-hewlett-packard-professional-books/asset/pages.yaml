    0 and 767. An equivalent external priority is calculated using kernel macros and
    will fall in the range of −512 to +255.


    To understand the external number, we need to look back into the HP-UX history
    books a bit. Earlier versions of HP-UX had only 256 priority values—0 to 255,
    strongest to weakest—which were reported via commands such as ps, top, and glance.
    Legacy scripts and programs expect timeshare processes to have priorities between
    128 and 255. In order to maintain this standard and protect these scripts and
    utilities, an external number scheme needed to be developed.'
