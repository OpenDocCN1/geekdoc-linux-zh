    on. Generally it just registers the CDIO with the G1O.


    +   - `module_init()`: This function too is called in real mode. This is a second
    place for CDIOs to perform tasks that must be done before virtual memory translations
    are started.


    +   - `init_begin()`: This is the first function in the CDIO that is called in
    virtual mode. This allows the CDIO to perform any configuration that needs to
    be done with virtual translations on.


    +   - `install_drv()`: This function is used only by the W510 CDIO. It allows
    the CDIO to set up structures that are needed before drivers are installed.


    +   - `init_middle()`: This function is called after all drivers have been installed.
    The CDIO can expect that no more driver installation will take place until after
    the system is up and running.


    +   - `init_end()`: This is the final configuration call made to the CDIO. CDIOs
    can do any post-configuration cleanup in this routine.


    Once the CDIO is initialized, there are three functions used as part of the device
    discovery process. These functions allow for the configuration of drivers within
    the CDIO:


    +   - `scan()`: This function is called by the G10 to allow the CDIO to claim
    1/0 modules. The G10 passes an `ionode`, which represents a particular hardware
    path, to the CDIO using this call. The CDIO probes the hardware modules connected
    to that hardware path, looking for any modules that it wishes to claim. If it
    finds hardware to claim, it creates a node in the `iotree` for the module.


    +   - `config()`: This function is called by the G1O to tell the CDIO to configure
    the driver associated with a node.


    +   - `unconfig()`: This function is called by the G1O to tell the CDIO to unconfigure
    a driver. This may be because a particular hardware module is no longer available,
    or it may be in preparation for unloading a dynamically loadable driver.


    The names of these routines are typically preceded with the name of the CDIO,
    so the config routine for WS10 is `wsio_config()`, for S10 it''s `sio_config()`,
    for CORE it''s `core_config()`, and so on.


    Of course, the remaining functionality in the CDIO is unique to each CDIO. For
    example, the S10 CDIO provides a routine called `io_send()`, which is used by
    all S10 drivers to send messages to other parts of the S10 subsystem. The WS1O
    CDIO provides DMA services that are used by all W510 drivers to simplify doing
    DMA transfers. Each CDIO provides a set of functionality suited to the particular
    drivers that run under that environment.'
