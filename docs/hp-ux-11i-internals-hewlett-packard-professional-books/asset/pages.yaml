    \ 0 \\ 0 \\ 0 \\ 0 \\ 0\n\n```\n\n# ## Blocks and Fragments\n\n\nAs we noted,\
    \ the block size of the file system has increased over the years from its original\
    \ 512 bytes to a typical 8 KB. On HP-UX, the block size is tunable on a per-file\
    \ system basis between 2 KB and 64 KB. With this flexibility comes the potential\
    \ to waste file space when storing small files, so HFS file systems support the\
    \ allocation of file system block fragments. Like the block size, the fragment\
    \ size is also a tunable parameter at the time of file system creation. The fragment\
    \ size may be set to the same as the block size, one-half, one-quarter, or one-eighth\
    \ the block size (with a hard minimum of 1 KB). To accommodate the fragment size\
    \ variations, the last three bits of the block pointer are reserved to address\
    \ a fragment offset within a block. Figure 8-10 illustrates this basic concept."
