- pgno: 206
  md: '# Keeping Track of Free Physical Page Frames


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_206_0.png)


    Figure 6-13 Managing Page Frames


    Our first challenge is simply to know how many physical pages there are, which
    pages are free, and which have been allocated for use either by a user process
    or the kernel. To serve this need, HP-UX uses a modified version of an age-old
    structure called the page free data table, or *pfdt*. The *pfdt* structure has
    been around in concept since very early UNIX versions, even as far back as Bell
    Lab System (BLS) releases.


    This table is part of the kernel''s hardware-independent layer and is not directly
    connected to the virtual memory translation system. The kernel must manage physical
    pages and map them to the virtual memory space in alignment with the requirements
    of the kernel and its processes.


    # Keeping Track of Free Physical Page Frames


    The original incarnation of *pfdt* was quite simple. Each page had a *pfdt* structure,
    and the entries were arranged in a simple array. The physical page frame number
    served as the index into the array. As we mentioned in our discussion of the `pfn_to_virt_ptr`
    structure, modern HP-UX systems must be able to handle partitioned memory configurations.
    With the advent of today''s cell-based systems with their physical and virtual
    partitioning schemes, this requirement is coming under a new focus. Figure 6-14
    illustrates the current incarnation of the page free data table.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_207_0.png)


    *pfdat_ptr* partition size is set by **PFN_CONTIGUOUS_PAGES** and currently defaults
    to 4096 pages, or 16 MB, of contiguous memory. Only those physical page frames
    that may be dynamically paged in or out by the kernel have *pfdat* structures.
    The kernel’s static pages do not require inclusion in this table, as they will
    never be part of the dynamic memory pool.


    The two-tier nature of this structure makes it easy to skip blocks of memory pages
    such as kernel static memory pages or holes in the physical hardware map. In *pfdat_ptr*,
    a **pp_tbl** set to zero simply means that the corresponding 16-MB block of memory
    is not dynamically mapped. Note, this does not mean that the memory does not physically
    exist, just that it is not to be managed by this structure. (See Listing 6.11.)


    # Listing 6.11 **q4_fields** struct **pfdat_ptr**


    ```

    The pp_tbl points to a block of "page free data" entries and the pp_offset directs
    us to the first valid entry in the block. Each block maps 4096 physical page translations
    (determined by the kernel parameter PFN_CONTIGUOUS_PAGES)

    0 0 4 0 * pp_tbl

    4 0 4 0 int pp_offset

    ```


    Once we have used the physical page number and have followed the appropriate *pp_tbl*
    pointer, we will find the page’s *pfdat* data structure. Let’s examine an annotated
    listing of this structure (Listing 6.12).'
