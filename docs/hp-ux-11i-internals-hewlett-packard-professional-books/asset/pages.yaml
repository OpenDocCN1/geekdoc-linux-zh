- pgno: 109
  md: '# # The vas and pregion Tables


    In the grand scheme of things, a **pregion** contains the address offset and size
    of a process''s logical region, access identifier information, and a type designator
    that specifies the usage mode. The **pregion** also maps a process''s logical
    region to the system''s VAS and creates a linked list of a process''s virtual
    memory elements. When a process causes a page fault (requests access to a virtual
    page that is not currently memory-resident), the fault handler must search the
    process''s linked list of **pregions** to determine which kernel region contains
    the necessary data for obtaining the faulting page. These structures and the underlying
    kernel region structures are the backbone of memory fault handling and have been
    optimized for function and efficiency. In addition to keeping track of its threads,
    a process table must also provide a map to each of the memory regions it will
    require for execution. To this end, a structure called a **vas** is created and
    linked to the **proc** of the process. The **vas** is the nexus of a linked list
    of **pregion** structures connected by a skip list. Each **pregion** links the
    process and its threads to a kernel-managed **region** structure. The **pregion-to-region**
    abstraction layer facilitates the mapping of shared objects by the kernel.


    # ## Process File Descriptors


    All sibling threads share access to any file that has been opened in the name
    of its parent process. Each **open()** system call results in an entry in the
    process''s file descriptor table. The size of this table is controlled by the
    kernel-tunable parameter **nfile** and prevents unlimited opens by a runaway thread.


    All I/O is file I/O, and as such the file descriptor table represents the process''s
    gateway to the “real world.” File descriptors are required for each read and write
    operation. For example, consider the shell''s default **STDIN**, **STDOUT**, and
    **STDERR** descriptors. As is the case with the shell, multiple file descriptors
    may point to the same file path, some for reading and some for writing.


    # ## The urea Structure


    An additional structure being introduced here is the **urea**. The **urea** is
    implemented as a kernel memory region, and unlike the other regions mapped in
    the parent process''s **pregion** chain, access to the **urea** is private to
    a single **kthread**. If there are multiple siblings, then there is an equal number
    of **urea pregions** linked to the process''s **vas**. An interesting note is
    that the **urea** is mapped into a process''s **vas** but never directly accessed
    by a user thread. The kernel has exclusive usage rights and stores the threads
    register image, known as a process control block (**PCB**) prior to a context
    switch-out. It then loads the next thread on the run queue''s **PCB** from its
    **urea** prior to switching it in.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# The Kernel File System Tables


    The kernel must maintain a complete list of all opened files on the system, active
    mount points, and what is mounted there. Performance requires that many file system
    structures be maintained in core-resident inode caches and buffer caches as well
    as in a variety of tables.


    # The System File Table


    Each discrete, open system call results in an entry to the system file table (see
    Figure 3-13). If the same file is opened 20 times, there will be 20 separate entries
    in the table. Discrete entries are required because this table keeps track of
    the type of open (read or write), the current offset into the file, and the number
    of linkages to it. As the various processes are terminated, their file descriptors
    are closed, and the linkage count in the system file table is decremented. If
    the linkage count goes to zero, then the entry is placed on a free list and may
    be reused.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_110_0.png)


    **Figure 3-13** Kernel File System Tables


    # The Virtual File System


    The HP-UX kernel supports access to several different types of file systems. On
    earlier versions of the operating system, the specifics of each supported file
    system type was crafted into the kernel''s core image. Changing file system attributes
    was a major challenge and required patching'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'the kernel. To move away from this dependency, a virtual file system interface
    was designed and implemented in the kernel.


    The virtual file system treats all file system types the same. It is primarily
    concerned with their type, where they are mounted, a pointer to core-resident
    copies of any metadata that may be required to manage them, a cached copy of their
    respective root directories, and a pointer to an operational array of routines
    customized to handle their specific type.


    # The Inode Cache


    The inode is the heart and soul of a UNIX file; it contains all attribute information
    with respect to a specific file. As the file is the basic object of all I/O operations,
    the inode attribute information is the key to access rights and data security
    within the system.


    File attribute information is needed each time a thread requests access to file
    data or to modify the inode data itself. To speed this operation, an in-core copy
    is maintained of the inode data for each open file on the system. This is known
    as an inode cache.


    As each file system type may define different inode data structures (different
    sizes, different block location schemes, different immediate data storage methods),
    it is the job of each configured file system type to define and build its own
    inode cache. To mask this difference from the higher levels of the kernel, an
    abstraction layer is added in which each file has assigned to it a systemwide
    unique virtual node (or vnode). Actions aimed at the vnode are translated through
    an operations array to file system type-specific routines in the kernel.


    # The Buffer Cache


    Just as we keep copies of file attributes in an inode cache, the system maintains
    and manages a memory-resident buffer cache to hold recently requested copies of
    file data. When a process requests a read or write of file data, the buffer cache
    is checked first to see if a copy is present. If a cached copy is present, then
    the system merely needs to perform a memory-to-memory transfer of the requested
    buffer to or from the program''s data space. Memory-to-memory transfers of this
    nature are called logical reads or logical writes. If a requested buffer is not
    present or the buffer is filled, a transfer must take place between the buffer
    cache and the physical disk. This constitutes a physical read or physical write.


    When a read or write request results in an immediate physical action, it is said
    to be a buffer cache miss. The ratio between logical and physical reads and writes
    is called the hit rate and may be viewed using tools such as HP''s glance or gpm.


    # The Kernel Input/Output Tables


    The HP-UX kernel allows no direct access to physical devices. All I/O must be
    requested through the proper channel: the system call interface. A key component
    of this model is the ker-'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'nel''s extensive set of drivers, device maps, and the overall system''s general
    input/output (I/O) system.


    A large portion of the kernel memory space is occupied by these various components.
    The modern HP-UX kernel provides for the dynamic mapping of some of these should
    it be required.


    # # The I/O Tree


    A key table is appropriately named the *I/O tree*. This tree structure is actually
    a collection of linked objects used to identify and map system hardware devices
    to specific software drivers. The tree''s roots stretch back to the system initialization,
    occurring even before the HP-UX kernel is loaded into memory. A subsection of
    this structure is the more elemental kernel *I/O tree* and is created in memory
    visible to the processor-dependent code (sometimes called the *bootrom*) to be
    used in the event of a system crash.


    The individual nodes of the *I/O tree* contain basic information about the hardware
    address: its type, which software has claimed it (driver association), and which
    context it belongs to. Additional properties, such as a kernel-assigned instance
    number and pointers to its parent, siblings, and children, are also present.


    The *I/O tree* follows an object model: nodes lower down in the tree structure
    inherit attributes from their parents and pass them on to their children. We explore
    this fully in Chapter 10, "I/O and Device Management."


    # # System Interruptions


    In addition to the *I/O* tree, the *I/O* subsystem is responsible for the detection
    and response to interruptions. You may notice that we use the word *interruption*,
    not *interruots*: HP-UX describes all categories of events affecting normal processor
    execution as being *system interruptions*. They are broken into four categories:
    faults, traps, *interruots*, and clocks.


    To further complicate the topic, there are internal (CPU hardware, clocks, timers,
    etc.) and external (*I/O* devices, interface cards, physical device) *interruots*,
    not to mention process signal handling.


    As shown in Figure 3-14, internal *interruots* are registered by a CPU and cause
    a vectored branch to memory-resident handling routines contained in an array called
    the *interruot vector table* (IVT). Each entry in this table consists of a 32-byte
    block of code in which the initial portion of the *interruot* handler must be
    loaded. Also note that control register *CR14* contains the *interruot* vector
    address (IVA), the starting address of the IVT. As each physical processor maintains
    its own register set, it would be possible to have *interruot* handlers specific
    to each processor. This is not generally the case, but it is an interesting option.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_113_0.png)


    Figure 3-14 Kernel I/O Tables


    An interesting interruption (registered as internal interrupt #4) is called the
    *external interrupt* and evokes routines vectored through an array named the *external
    interrupt receipt register switch table*, or simply the `eirr_switch[x]`. In most
    cases, this vectored switch table points toward the interrupt handling routine
    entry points associated with the kernel’s various hardware drivers. Two additional
    control registers assist in registering and enabling the various external interrupts:
    CR23 (the `eirr`) and CR15 (the external interrupt enabling mask, or `eierm`).


    # Drivers and Switch Tables


    The bottom portion of Figure 3-14 shows two switch tables. One is used for accessing
    block device drivers and the other for raw device drivers. A raw device is one
    to which data is transferred in byte streams of varying sizes.


    A raw device may receive a single byte or many megabytes in a single transfer
    (or even gigabytes in today’s computing climate). Raw device access is also used
    to talk to and configure device controllers and interface cards when necessary.


    Block devices hold mountable file systems. All I/O to a block device is directed
    through the system’s buffer cache to reduce physical requests to logical requests
    whenever possible for speed and convenience'
