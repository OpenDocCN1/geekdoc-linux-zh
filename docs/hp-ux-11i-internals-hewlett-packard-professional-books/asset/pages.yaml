- pgno: 286
  md: 'The only complication to the HP approach is that since we create new private
    memory regions, swap reservations must be made. When this feature was first introduced
    in a workstation release of HP-UX several years back, it created a bit of a predicament.
    If a large parent program, such as a computer-aided design program with a relatively
    large private data region, needed to fork a simple child, say, to perform some
    menial task such as checking the user''s email, the initial `fork()` in a large
    swap reservation, which was immediately deconstructed by the following `exec()`
    call. This required that the system be configured with a large amount of swap
    space that wasn''t actually used. As disk space was still quite expensive at the
    time, the original Berkeley `vfork()` was patched back into the kernel to avoid
    having to over state the system''s swap space.


    Hewlett-Packard also revisited the `vfork()` call and modified it to allow the
    child to simply map the parent''s `vas`, `region`, and `region` structures to
    its `proc` table. Because this gives the child unrestricted access to the parent''s
    data space, the only supported use of this call is when it is immediately followed
    by an `exec()` or `exit()` in the child''s logic.


    As you may be thinking, this gets to be a bit confusing, so let''s clear the deck
    a bit and create a timeline of the various flavors of `fork()` and `vfork()` that
    have been and are being used. Then, we examine the semantics of the current implementation
    of each call.


    +   * HP-UX 7.x: `fork()` uses the original UNIX model and copies the parent''s
    data area, and `vfork()` uses the original Berkeley model, sharing the data area
    between the parent and the child.

    +   * HP-UX 8.x: HP-UX servers and workstations used the new copy-on-write/access
    `fork()` model implemented to handle both `fork()` and `vfork()` calls. The previously
    mentioned issue with swap reservation caused a patch for the workstation release
    of the OS, which implements the original `vfork()` code.

    +   * HP-UX 9.x: Servers used the combined copy-on-write/access `fork()/vfork()`
    calls, while workstations used the copy-on-write/access `fork()` and the original
    Berkeley `vfork()`.

    +   * HP-UX 10.x and beyond (at least through 11i, the current release at time
    of writing): Servers and workstations alike use the new, true copy-on-write `fork()`
    call and a newer improved version of the `vfork()` call.


    # The `fork1()` Kernel Routine


    Today the two system calls `fork()` and `vfork()` enter the kernel at the same
    point: `fork1()`. This kernel routine looks for the passed `forktype` argument
    (set to either FORK_PROCESS or FORK_VFORK) to determine which set of rules to
    play by. In either case, a number of kernel procedures are used. Let''s first
    examine the actions for `fork-type = FORK_PROCESS`, the full copy-on-write version.'
