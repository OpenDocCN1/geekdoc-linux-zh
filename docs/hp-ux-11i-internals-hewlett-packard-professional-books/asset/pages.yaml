    Figure 9-6 getxfile() Rebuilds the Memory View


    Now it’s finally time to build the new image map! The compiler magic type tells
    us what type of mapping (\texttt{DEMAND\_MAGIC}, \texttt{EXEC\_MAGIC}, \texttt{SHMEM\_MAGIC},
