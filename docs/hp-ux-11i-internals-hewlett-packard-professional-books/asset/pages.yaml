- pgno: 92
  md: '# Pros


    Hashing algorithms offer a versatile indexing method that is not tied to basics
    such as numerical sequence or alphabetic order. Relevant attributes are used to
    calculate an offset into the hash-chain header array. The header points to a linked
    list of all items sharing the same hash attribute, thus reducing the overall search
    time required to locate a specific item in the list.


    # Cons


    The specific attributes used for the hash may be somewhat abstract in concept
    and must be carefully considered to assure that they are not artificially influenced
    and do not result in uneven distributions to the individual chains. If the size
    of the resource pool being hashed grows, the length of the individual chains may
    become excessively long and the payback may be diminished.


    While the basic concept of hashing is very simple, each implementation is based
    on specific attributes, some numeric, some character-based, and so on. This requires
    the programmer to carefully study the data sets and identify which attribute to
    use as a key for the hash. Frequently, the most obvious one may not be the most
    efficient one.


    # Summary


    Hashing is here to stay (at least for the foreseeable future). Make your peace
    with the concept, as you will see various implementations throughout all areas
    of kernel code.


    # Binary Searches


    When it comes to searching a fixed list for a value, there are many approaches.
    The brute-force method is to simply start with the first element and proceed in
    a linear manner through the entire list. In theory, if there were 1024 entries
    in the list, the average search time would be 512 tests (sometimes the item you
    are looking for would be at the front of the list and sometimes toward the end,
    so the average would be 1024/2 or 512).


    Another method involves the use of a *binary search algorithm*. The decision branch
    employed by the algorithm is based on a binary-conditional test: the item being
    tested is either too high or too low. In order for a binary search to work, the
    data in the list must be ordered in an increasing or decreasing order. If the
    data is randomly distributed, another type of search algorithm should be used.


    Consider a 1024-element list. We would start the search by testing the element
    in the middle of the list (element 512). Depending on the outcome of this test,
    we would then check either element 256 or 768. We would keep halving the remaining
    list index offset until we found the desired element.'
