- pgno: 303
  md: "WNOHANG and WNOWAIT which function the same as in the `wait3` call\n* waitpid(\
    \ pid, *stat_loc, options); This version functions for the same as the `wait`\
    \ call if the passed pid=-1. If pid>0, then the call is for a specific child.\
    \ If pid<-1, then the call is for any child whose process group is equal to pid\
    \ \\infty -1 (absolute value). The options available are similar to those in the\
    \ `wait3` call.\n\nIn all four `wait` variations, version control is passed by\
    \ the system call interface to the kernel routine wait1(), where the real work\
    \ is done. First, a search is made for zombie children. If they are found, their\
    \ status is passed back to the caller and the zombie is laid to rest. This is\
    \ called reaping a thread. Stopped, traced, and continued children may also be\
    \ looked for depending on the actual call specifies.\n\nBefore `wait1()` may modify\
    \ any of the child resources, a lock must be acquired to make sure that the thread\
    \ is being reaped only in response to a single request. The kernel also reaps\
    \ any adopted zombies that may be queued for its attention.\n\n# The Grim Reaper\
    \ PAYS a VISIT\n\nWhen the kernel reaps a kthread with `kt_stat`=SZOMB, the thread's\
    \ final resource usage statistics are added to its process, and it is laid to\
    \ rest with a call to `kiss_of_death()`. The reaped kthread structure is placed\
    \ on the `freekthread_list`. Next, the process itself is reaped in a similar manner.\
    \ Its resource usage statistics are added to the process that called the wait,\
    \ and the proc structure is placed on the `freeproc_list`. A call to `abandon_child()`\
    \ removes it from the parent's list of children. (Don't you just love this stuff?\
    \ I mean, what a violent piece of code. We have daemons, zombies, old processes,\
    \ death-of-child signals, abandoned children, and calls for the kiss of death.\
    \ UNIX internals is not for the fainthearted!) \n\nIt should be noted that a parent\
    \ process may choose to ignore the SIGCHLD signal. In this case, its children\
    \ remain in the SZOMB state. While a zombie has freed most of its system resources,\
    \ it does occupy a place in the process and thread tables. If the parent aborts\
    \ without issuing the necessary `wait`, the children are frozen in the zombie\
    \ state indefinitely—basically until the system is rebooted, as only the parent\
    \ of record may issue a `wait` for a zombie child.\n\nAnother possibility is that\
    \ the parent process may exit or abort before its children. In this case, HP-UX\
    \ tries to solve the potential problem by reassigning the parent process ID of\
    \ the orphaned child to the patron of all processes, init. The init process periodically\
    \ issues a `waitid(\"p_ALL\"...)` to clean up any adopted zombies. This approach\
    \ has reduced the number of inadvertent zombies on a system to minimum. The limiting\
    \ factor is that the “adoption” is only performed if a child calling exit passes\
    \ the kernel an invalid parent ID number. If a parent process is blocking an attempted\
    \ death-of-child signal and aborts without handling it, the child will remain\
    \ a zombie. Responsible parents always clean up after their children—or at least\
    \ pass the responsibility on to another!"
  merge: -1
