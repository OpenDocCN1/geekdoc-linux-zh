    The pp_head[1] contains the actual free list pointers for each pond. The first
    element in this array has the next and previous pointer for the one-page frame
    free list, the second entry has the linkage pointers to the four-page frame free
    list, the third to the 16-page frame free list, and so on up to the maximum configured
    page size. To facilitate management of multiple page sizes, an additional structure
    called the memory page_group was created.


    # Variable Page Size


    The HP-UX 11.00 release introduced variable page sizes (vps) also known as performance
    opti- mized page sizing (pops). This feature allowed the kernel to take advantage
    of new hardware features introduced in PA-RISC 2.0 processors. On the new wide
    processors the tlb has an addi- tional field introduced to allow the mapping of
    a variety of virtual-to-physical page translation sizes. The basic page frame
    remains 4Kbytes but the vps parameter allows a single tlb entry to map from 4Kbytes
    to a potential maximum of 1048576 Kbytes of contiguous physical memory with a
    single entry. The page size is determined by a 5-bit field in the ttbl/pdir entry.
    The current implemented sizes range from 1 to 256K page frames (each progressively
    larger size is 4X the previous small size). The kernel tracks a process''s memory
    usage and may adjust the page size or a program or a programmer may use the chptr
    command to adjust the page size. There are several kernel tunable parameters used
    to control this feature:


    +   vps_pagesize This parameter sets the base page size and defaults to 4Kbytes

    +   vps_ceiling This parameter sets the maximum page size the kernel may select
    and is currently limited to 65536KBytes

    +   vps_chatr_ceiling This is the maximum page size which may be requested by
    the chptr() and is limited to 1048576KBytes


    With respect to kernel memory management, the various sizes are referred to as
    a page group. As we see in Figure 6-17, a page_group structure helps the kernel
    identify and manage consecutive blocks of free pages.'
