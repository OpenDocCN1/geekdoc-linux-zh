    for this procedure must be deallocated by decrementing the stack pointer.

    +   4. Branch to the return pointer. A BV instruction to GR2 is used to branch
    back to the calling procedure.

    +   5. Restore the caller save registers. Any of the caller save registers that
    were saved before the procedure call are restored by the calling procedure.


    # # Stack Usage


    PA-RISC uses a stack to keep track of local data and procedure call return information
    for each procedure call. The PA-RISC architecture does not provide explicit stack
    manipulation instructions. To manage the stack, the runtime architecture specifies
    that general register GR30 will be used as a stack pointer. This register is commonly
    referred to as the sp register.


    The stack in PA-RISC grows upward in memory. That is, as data is added to the
    stack, it goes at increasing addresses and the stack pointer increases. When data
    is removed from the stack, the stack pointer decreases.


    Each called procedure begins by increasing the stack pointer, thus allocating
    itself memory for local data storage and linkage information. This area is called
    a *stack frame*. The amount of space allocated for a stack frame depends on how
    much local data storage the procedure needs.


    Stack usage differs between narrow mode and wide mode. We discuss the narrow mode
    stack usage first, then look at the differences when running in wide mode.


    # ## Stack Usage in Narrow Mode


    Figure 2-1 shows the stack frame for a narrow-mode call. By convention, we draw
    the stack with lower addresses higher on the page, and the stack grows down to
    higher addresses. The first thing on the stack is a *frame marker*, which is always
    eight words long. The frame marker for the current process is located at SP-4
    through SP-0x20. The space in the frame marker is reserved for a variety of uses,
    but the only one we need be concerned with is at SP-0x14. SP-0x14 contains the
    Return Pointer (RP) of a *called procedure*. In other words, when a procedure
    is called, it saves the return pointer at SP-0x14 in the calling procedure’s stack
    frame.'
