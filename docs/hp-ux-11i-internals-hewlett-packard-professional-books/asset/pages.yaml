    structure points to another, it makes sense to be able to use the member names
    rather than having to type in addresses. For example, in the `proc` structure
    there is a member named `p_firstthread` that points to the first thread in that
    process. Once you’ve got a `proc` structure on the pile, you can load the first
    thread for that process by typing'
