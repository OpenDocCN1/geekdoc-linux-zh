- pgno: 193
  md: '# Virtual Address Aliasing


    Virtual addressing aliasing was introduced to the HP-UX kernel with the release
    of HP-UX 10.0. This feature was incorporated to facilitate a "copy-on- write"
    scenario in the process creation for k() system call. Figure 6-7 demonstrates
    the kernel data structure changes this entailed.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_193_0.png)


    In the case of a single virtual page number being assigned to a specific physical
    page, no alias structure is required. The physical to virtual translation follows
    the previously discussed model. If more than one virtual address needs to be associated
    with a physical page, then its pfn_to_virt_entry space value will be set to INVALID_SPACE_ENTRY
    (0xffffff). And the offset value will be a pointer to an alias data structure.
    The alias structure will contain a virtual space and offset and a pointer to the
    next alias structure if one exists (Listing 6.5).


    # Listing 6.5 q4> fields struct alias


    ```

    0 0 4 0 * aa_next

    4 0 4 0 u_int space

    8 0 0 7 u_int aa_saver

    8 7 3 1 u_int aa_saverpt

    12 0 4 0 u_long offset_page

    ```


    A free list of unused alias structures is maintained by the kernel and pointed
    to by aa_entfreelist (the alias structure free list). Another kernel parameter,
    min_alias_entries, sets a low-water mark for free alias structures. When the available
    count, aa_entcnt, falls below this limit, the kernel allocates a new page of alias
    structures.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'When an alias ed virtual address is created, an entry must also be added to
    the hashtable (`tbl1/pdir`). If the new virtual address maps to a used hashtable
    entry, a sparse entry must be allocated. Space for one of these alias pdes is
    allocated from the `aa_pdirfreelist` instead of the system''s `pdir_free_list`.
    The `aa_pdirfreelist` is maintained to avoid overwriting the `pdir_free_list`.
    The system has a pointer to both the head and the tail of this free list, `aa_pdirfreelist`
    and `aa_pdirfreelist_tail` respectively. For a wide system, the pointers are `aa_pdirfreelist2_0`
    and `a_pdirfreelist_tail2_0`.


    As with the alias structures, the kernel monitors their use and availability.
    The parameter `aa_pdiront` is monitored: if it falls below `min_alias_pdirs` (256
    by default), then a new page of alias PDEs is allocated. The total number of kernel
    alias PDEs is stored in `max_aapdir`; this value may grow over time but will never
    shrink.


    Pages allocated to the kernel for use as alias PDEs or alias structures are never
    returned to the free page list. They represent a type of high-water mark, and
    the current thought is that if you need them once, you may need them again. Tying
    up a few pages is less costly than the overhead of reallocating the pages.


    Now that we can convert from virtual to physical and back, let’s consider how
    the kernel manages its many regions of virtual pages.


    # # Regions of Pages


    The `region` is the workhorse of the kernel memory management subsystem. It represents
    the highest level of memory resource management available to a process (via pointers
    from the process''s `pregion` structure). As we see in Figure 6-8, the `region`
    is simply a collection of consecutive virtual pages. Each region occupies a unique
    space in the system''s VAS. The kernel must make sure the regions are assigned
    to the correct quadrant type. As far as the `region` structure is concerned, there
    are only two types of regions: shared and private.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_194_0.png)


    The `region` structure contains the organizational pointers and status flags used
    to manage it. Let’s look at an annotated listing of the `region` structure (Listing
    6.6).'
  merge: -1
  img_proc: true
