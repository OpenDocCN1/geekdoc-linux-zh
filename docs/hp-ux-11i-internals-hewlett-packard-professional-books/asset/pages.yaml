  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_191_0.png)


    # Figure 6-5 Sparse Tables


    Once memory pages have been allocated by the kernel for sparse structures, they
    will not be returned to the memory free list. In actual practice, the virtual-to-physical
    mapping system rarely sees more than three virtual addresses hashed to the same
    index. The hashed sparse table structure serves our needs very well, but what
    if you know the physical address and need to determine the virtual address (or
    addresses) currently assigned to it?


    # Page Frame to Virtual Page Frame Tables


    Let’s address a structure that is completely independent of the underlying hardware
    architecture. The kernel may know the physical page number and need to determine
    if there are any virtual pages currently mapped to it. This is a scenario that
    occurs at various points when the kernel is trying to clean up resources following
    a process termination or panic.


    In Figure 6-6, we see the page frame number to virtual address table, or **pfn_to_virt_ptr**,
    as its current incarnation is named. In early HP-UX systems, this was a very simple
    table; it had one entry for each physical page configured on the system. The physical
    page number was the index to get the associated virtual address if there was one.
    As the complexity of the Hewlett-Packard computer hardware platforms grew, so
    did the complexity of physical-to-virtual mapping. The V-class introduced partitioned
    memory designs to the HP-UX kernel, and in order to avoid waste in the **pfn_to_virt**
    table, it was converted to a partitioned design, thus the new name **pfn_to_virt_ptr**.'
