- pgno: 140
  md: '# Process and Thread

    Management

    from the Process’s

    Viewpoint


    In this chapter, we explore kernel data structures used to manage resources allocated
    to a process and its threads. We see how a process’s *logical address space* is
    mapped into the kernel’s *virtual address space* (VAS) in preparation for translation
    to the hardware’s *physical address space*. As the kernel is asked to host multiple
    processes, individual *lthreads* are placed in run queues organized according
    to processor, priority, and type. We also examine the overall implementation of
    the kernel scheduling system, its rules, and the concepts of *nice, real-time,
    timeshare*, and *priority decay*.


    # A Process and Its Resources


    A process is a container used to link the system resources needed during the execution
    of its *lthreads*. A process must have a unique identity (its PID, or process
    identifier number), and the kernel needs a means of tracking system resources
    allocated for process use. To this end, the kernel employs several linked data
    structures to coordinate thread access to code, data, shared memory objects, files,
    and the *I/O* system.


    From the process’s point of view, the *proc* table (process table) is our starting
    point in the study of HP-UX internals. As we see in Figure 5-1, the *proc* table
    ties a process to its *lthreads*, virtual memory mappings, open file descriptors,
    and other system resources and services.'
