  md: 'If no thread is in *sigwait*(), then we look for threads in *sigsuspend*()
    (that are waiting for this signal). If a thread is found here, then that thread
    becomes the target of the signal. In other words, even if a signal is sent to
    a process, if there is a thread waiting for it, that thread is the one that gets
    it.


    Next, we check to see if the process is multithreaded. If there is only a single
    thread in the process, that thread becomes the target of the signal. If there
    are multiple threads, we check each to see if it has registered a handler for
    the signal. If so, that thread gets the signal. If we have multiple threads, no
    thread is waiting for the signal, and no thread has a handler for the signal,
    then we deliver the signal to the process itself. Finally, we''re ready to actually
    raise the signal by setting the appropriate bit either in `p_sig` or `kt_sig`.


    The next thing we have to do is decide whether or not to wake up the thread we
    just set the bit for. This depends on a combination of what state the thread is
    in and what signal we''re sending it. It''s just a straightforward case statement
    to get it to behave as described in the man pages.


    Finally, there''s just a little cleanup to do. If the thread was a *sigwaiter*
    and we woke it up, then we remove it from the *sigwaiters* list. If we had *siginfo*
    along with the signal, here is where it gets enqueued onto the receiving thread''s
    list. And if the signal we''re delivering is *SIGKILL*, we mark the process as
    terminating so it won''t get back into user space to run anymore.


    So now the signal has been delivered. The receiving thread or process has its
    bit set to let it know the signal has arrived, and it has been woken up if appropriate.
    Let''s now have a look at how the receiving process does with the signal.


    # Signal Recognition


    There are three places a thread checks to see if it has been signaled: at the
    end of every system call, when it wakes up from a sleep, and after handling a
    trap of some kind. The routine that checks for signals is *issig*(). The kernel
    routines *real_sleep*(), *syscall*(), and *trap*() (each call *issig*() to see
    if any signals are pending for the thread.


    The job of *issig*() is to determine what signal, if any, should be processed.
    *issig*() loops through the bits in `p_sig` and `kt_sig` looking for pending signals.
    If it finds no signals pending, it returns zero. If it finds a signal that is
    pending, it returns the number of the signal. The signal number is also placed
    in the thread structure, in `kt_cursig`.


    Although this sounds like a relatively simple process, *issig*() does a few other
    things that add to its complexity. Most of the default actions for signals are
    handled by *issig*(). If the action for the signal is set to *SIG_DFL*, *issig*()
    looks at the signal number. Default actions are handled by *issig*() for *SIGSTOP*,
    *SIGTTIN*, *SIGTTOU*, *SIGSTOP*, *SIGCONT*, *SIGIO*, *SIGCANCEL*, *SIGPWR*, *SIGWINCH*,
    *SIGCLD*, *SIGURG*, and *SIGILL*.


    Signals with an action of *SIG_HOLD* or *SIG_IGN* are handled by *issig*() too.
    If the action is *SIG_IGN*, the bit is reset and any *siginfo* that goes with
    it is thrown away. For'
