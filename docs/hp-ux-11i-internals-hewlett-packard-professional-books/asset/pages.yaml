  md: '+   - **sema_add()** adds a semaphore to a thread’s list of semaphores.

    +   - **sema_delete()** removes a semaphore from a thread’s list.


    Most of these routines are very simple. `initsema()` initializes the fields in
    the semaphore, setting the `sa_count` to one and allocating a spinlock structure
    for `sa_lock`. `sema_add()` and `sema_delete()` are actually more complicated
    than they need to be. They maintain a linked list of semaphores owned by a thread.
    The `kt_thread` structure has a field, `kt_sema`, which points to a list of owned
    semaphores. Within the semaphore, the `sa_next` and `sa_prev` pointers continue
    the list. However, since there is only one alpha semaphore, this list will either
    be empty or contain one entry, the `filesys_sema`. The `owns_sema()` routine simply
    checks to see if the `sa_owner` field is equal to the current thread.


    Acquiring a semaphore with the `psema()` routine can be complicated. The first
    step is to lock the spinlock associated with the semaphore. Next, we check `sa_count`.
    If it is one, indicating it is free, then we set it to zero, set `sa_owner` to
    the current thread, and release the spinlock. The complicated part comes in if
    we find that the semaphore is already owned.


    Because a semaphore can be held for a long time, we don’t want to just spin waiting
    for it—we want to be able to context-switch and let the processor do other work.
    On the other hand, changing context is an expensive process. If the wait is going
    to be a short one, we’d rather not do the context switch. To balance out these
    requirements, if we try to get a semaphore and find it locked, the first thing
    we do is a short spin wait. The routine `psema_spin_1()` is called to spin for
    up to 50,000 clock cycles trying to get the lock. If we fail to get the lock after
    50,000 cycles, we then call `psema_switch_1()` to give up the processor and let
    another process take over.


    When we return from `psema_switch_1()` (when it’s our turn on the processor again),
    we go into another section of spinning, this time by calling `psema_spin_n()`.
    The difference between `psema_spin_1()` and `psema_spin_n()` is that `psema_spin_n()`
    uses an arbitration mechanism to determine how long to spin and who should get
    the semaphore next. The semaphore has a field, `sa_turn`, which says which SPU
    is next in line in the waiters list. Each time we get ready to spin on the semaphore,
    we first look at the `sa_missers[]` array in the semaphore. This array keeps track,
    in priority order, of the SPUs that are waiting for the semaphore. The earlier
    entries in `sa_missers` have been waiting longer and thus have a higher priority
    for getting the semaphore. If the current SPU isn’t in the `sa_missers[]` array
    it gets added at the end of the list. Now we look at the `sa_turn` member in the
    semaphore and find out whose turn is next. We find that SPU in the `sa_missers`
    array, and if it is farther down the list than we are, we set `sa_turn` to our
    own SPU, indicating that we’re next in line.


    This `sa_turn` field has two effects. First, when we’re spinning, waiting for
    the semaphore, we spin longer if it’s our turn. If `sa_turn` equals our SPU, we’ll
    spin for 50,000 cycles waiting for the semaphore. If not, we spin only 5,000 cycles.
    Second, once we find the semaphore is free, we acquire it only if `sa_turn` points
    to our SPU or it is the value `SA_NONE`.'
