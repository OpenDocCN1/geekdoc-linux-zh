    # Partitioned Tables


    Modern architectures present kernel designers with many challenges; one is the
    mapping of resources (both contiguous and noncontiguous). Consider the task of
    tracking the page-frames of physical memory on a system. If physical memory is
    contiguous, then a simple usage map may be created, one entry per pageframe, the
    page number would be the same as the index into the array.


    On modern cell-oriented systems, there may be multiple memory controllers on separate
    busses. Often, the hardware design dictates that each bus be assigned a portion
    of the memory address space. This type of address allocation may result in "holes"
    in the physical memory map. The use of *partitioned tables* offers a method to
    efficiently map around these holes.


