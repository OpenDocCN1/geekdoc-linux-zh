  img_proc: true
- pgno: 173
  md: 'The real-time scheduler was named SCHED_RTPRIO and made use of the previously
    unused priority numbers 1 through 127. As Hewlett-Packard was writing its own
    rules at this point, the decision was to have a unique number for each priority
    number. These queues would use a round-robin scheme for threads in the same queue
    in the same manner as the SCHED_TIMESLARE scheduler and utilize the sysvemdime
    timeslice quantum value.


    As SCHED_RTPRIO run queues are stronger than the system-level queues when a real-time
    thread requests kernel services and needs to be put to sleep (possibly to wait
    on an I/O operation to complete), the sleeping kernel routine is promoted to the
    requesting thread''s real-time priority. This allows the blocking routine''s interrupt
    handler to respond at the stronger real-time priority when it is time to finish
    the request.


    Another advantage to real-time priority queues, at least from the kernel''s viewpoint,
    is that they don''t need to be considered by the staddaemon during the 100-tick
    priority readjustment cycle. Here is a hint: On a development system it is a good
    idea to always have at least one shell session running at a stronger real-time
    priority than the code being developed; if a real-time application becomes a runaway,
    the stronger shell could be used to send it a kill signal as long as the tty (keyboard)
    interrupt handler is also running at a stronger priority.


    # SCHED_RTPRIO


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_173_0.png)


    Take a look on an HP-UX 11i system: what process runs at the absolute strongest
    priority? It should show a process named ttiser running at a priority of −32.
    On most systems this is the strongest configured POSIX real-time priority. This
    routine is the teletype interrupt service routine—no matter what, we want to be
    able to have our keyboard input detected!


    Speaking of POSIX real-time priorities, they are next on our list.'
