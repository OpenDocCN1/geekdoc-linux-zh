- pgno: 365
  md: '# ### Synchronization Semaphores


    Where mutual exclusion semaphores are generally used to protect data structures
    from simultaneous access, synchronization semaphores are used to synchronize events.
    The implementation and usage are almost the same as for the mutual exclusion semaphores.


    The data structure for a synchronization semaphore is `struct_sync` or `sync_t`.
    A `struct_sync` has many of the same fields as the other semaphores. `s_lock`
    is a pointer to a spinlock to protect the semaphore during modification, `count`
    is the current value of the semaphore, `wait_list` is a pointer to a list of threads
    waiting for the semaphore, and `order` is the locking order.


    The two main operations on a synchronization semaphore are `psync()` and `v_sync()`.
    `psync()` corresponds to the lock operation on a mutual exclusion semaphore. The
    `psync` operation first decrements the `count:` field in the semaphore. If the
    result is less than zero, the process blocks. If the result is greater than or
    equal to zero, the process continues. The `v_sync()` operation is the inverse.
    It increments the value in the `count` field.


    The `count` field can be thought of as the number of `psync()` calls that can
    be done before blocking. Because the `count` field can take on values other than
    just one or zero, you can also think of a synchronization semaphore as keeping
    track of how many of a particular resource are available. In this case, the `psync()`
    call corresponds to using a resource, and `v_sync()` corresponds to freeing one
    up.


    There is an additional call, `evsync()`, which is a conditional `v_sync()`. It
    performs the `v_sync` operation only if there is a thread waiting for the semaphore.


    An example of how this might be used is if you have a thread that uses a resource,
    such as memory, and another that frees up that resource. If the first thread finds
    it is low on memory, it can call `psync()` to wait until more is available. The
    thread that is freeing memory can call `evsync()` once it has made more memory
    available. This technique is used by the scheduler to suspend itself when memory
    is critical and to wait for the `statdaemon` to reactivate it when memory becomes
    available.


    # ## Summary


    We looked at a variety of techniques for managing multiple processors in a system
    and the interaction between them. While adding additional processors to a system
    makes more processing power available, it also introduces some very complex problems
    that must be overcome to keep the system running smoothly.'
  merge: -1
  img_proc: true
