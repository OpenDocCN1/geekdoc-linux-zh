    \n# Table 10-1 SPL Levels\n\n| SPL Level | Alternate Name | Value |  \n|---|---|---|\
    \  \n| none | SPLPREEMPTOK | 0xffffffff |  \n| SPL0 | SPLNOPREEMPT | 0xfffffff0\
    \ |  \n| SPL1 |  | 0xffffffc0 |  \n| SPL2 | SPLSOFT | 0xfffff100 |  \n| SPL3 |\
    \  | 0xfffffe00 |  \n| SPL4 |  | 0xfffffc00 |  \n| SPL5 | SPLIO | 0xc1000800 |\
    \  \n| SPL6 | SPLSYS | 0xc4000000 |  \n| SPL7 | SPLLWI | 0xc0000007 |\n\nWe saw\
    \ how hardware modules in the system communicate with each other. We looked at\
    \ the address space of I/O modules, communication between modules using that address\
    \ space, and the mechanics of how interrupts are generated and handled. In the\
    \ next section, we take another step back and look at the framework that exists\
    \ within the kernel for managing the various drivers.\n\n# # I/O Framework\n\n\
    Prior to the 10.0 release of HP-UX, there were two distinct families of HP products\
    \ that used the HP-UX operating system. One was the workstation family, or S700\
    \ systems. These systems evolved from the Motorola 68000-based single-user systems.\
    \ The other family was the server family, or S800 systems. These were the original\
    \ PA-RISC machines, using the hardware developed for both the HP-UX servers and\
    \ for the systems running Hewlett-Packard’s proprietary operating system MPE.\n\
    \nOver time, the S700 systems were moved to the PA-RISC platform. It became clear\
    \ that a single operating system that ran on both workstations and servers made\
    \ good sense. With release 7.0, HP-UX had merged most of the kernel functionality\
    \ between the two platforms. Hewlett-"
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Packard no longer had different releases for the two platforms. However, the
    I/O systems still remained incompatible—a workstation had to run the workstation
    version of 7.0, and a server ran the server version of 7.0.


    Release 10.0 finally converged the two I/O systems. This coincided with the release
    of the K-class system, the first system to have I/O hardware from both the server
    and workstation platforms.


    This convergence was made possible by creating a framework in which the various
    drivers could coexist despite having been developed in very different environments.
    Figure 10-4 shows the block diagram of this I/O framework.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_314_0.png)


    # Figure 10-4 Converged Workstation and Server I/O Systems


    The key components of the framework are the general I/O (GIO) system and the context-dependent
    I/O (CDIO) systems. GIO handles all the functions that are done on a systemwide
    level. The CDIOs provide environments for the drivers to work in. The SIO CDIO
    provides the environment for the server I/O subsystem, and the WSI0 CDIO provides
    the environment for the workstation I/O subsystem. In addition, there are CDIOs
    for other driver environments and hardware bus types.


    One special case of the CDIO is the central bus CDIO (CB-CDIO). This CDIO is responsible
    for system platform hardware. Within this CB-CDIO environment are a set of platform
    support modules (PSMs). As new functionality is added to the system—hardware for
    things like online addition and replacement (OLAR), for example—new PSMs are created
    to support that functionality. A system that supports OLAR has the OLAR PSM included
    in the kernel to provide the software interface.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# ## General I/O


    As mentioned, the G I O subsystem provides global functionality to the I/O system.
    Every system has G I O in the kernel. Some of the functions of the G I O include
    the following:


    +   - **Management of I/O Configuration**: The overall configuration of the I/O
    system is a global concept and is managed in the G I O. The G I O maintains a
    structure called the $i o t r e e$, which describes the relationship between the
    modules in the system.


    +   - **Algorithms for Device Discovery**: At system boot time (and when requested
    by the $i o s c a n$ command) the system must probe the I/O modules to determine
    what is present and bind the hardware to the correct drivers. The G I O oversees
    this process, although the individual C D I O s do the actual interrogation of
    the modules.


    +   - **System Administration Interface**: Users and system administrators must
    see a consistent view of all I/O modules. The G I O provides this through a pseudo-driver
    called $d e v c o n f i g$.


    +   - **Services**: The G I O provides services that can be used by all of the
    C D I O s. These services include such things as inter-CDI O communication and
    dynamic module loading and unloading.


    The G I O is not directly involved in individual I/O transactions or with individual
    devices. It provides a global environment in which the C D I O s operate and a
    uniform interface to the user.


    # ### I/O Global Data Structures


    One of the most important data structures provided by the G I O is the $i o t
    r e e$. The data structure of the $i o t r e e$ is an “object” in that the G I
    O provides procedures for manipulating the tree structure, and the structure may
    only be manipulated by those procedures.


    The basic building block of the $i o t r e e$ is an $i o t r e e$ node. Each node
    in the tree has a pointer to its parent, a pointer to its first child (the one
    with the lowest address), and a pointer its first sibling. Each node also has
    information about the driver that manages the node. Figure 10-5 is a diagram of
    a small $i o t r e e$, showing the pointer structure.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_316_0.png)


    # **Figure 10-5** Iotree Example


    The figure illustrates that each node in the tree represents a module and that
    for each of these modules we record the driver name, the class, the hardware address,
    and the CDIO that corresponds to that module.


    The process of building the iotree starts with the routine `io_virt_mode_config()`,
    which is called by `init_main()` at boot time. This routine first initializes
    the GIO, then calls `io_scan()` to begin scanning the I/O buses. `io_scan()` puts
    all the nodes in the tree into the SCAN state, then calls `gio_scan_subtree()`,
    which starts configuring the central bus. Each CDIO in the system is given a chance
    to claim each device on the bus. Information about each device is passed to a
    scan routine in the CDIO. If the CDIO recognizes the device, it claims it.


    This scanning of the bus continues recursively. As each CDIO is told to scan a
    module and given a chance to claim it, it also calls the claim routines for the
    interface card drivers within that CDIO. Those drivers in turn get a chance to
    claim any interface cards they support on the bus. As each module gets claimed
    by a driver, its iotree node gets put into the CLAIMED state. Once the entire
    scan is complete, any nodes that did not get claimed by a driver are still in
    the SCAN state. These are then moved to the UNCLAIMED state, indicating that there
    is no driver in the kernel that supports them.


    Another important data structure maintained by the GIO is the device switch tables.
    This pair of tables is used to associate device files in the system with device
    drivers. Each device file (also known as a *special file*) has three characteristics:
    the type (block or character), the major number, and the minor number. When a
    special file is accessed, the system uses either the block device switch (`bdextvsw`)
    or the character device switch (`cdextvsw`) depending on the type of the file.
    It then uses the major number as an index into that table to get a structure containing
    the information about the driver. The structures for block and for character devices
    are slightly different.'
