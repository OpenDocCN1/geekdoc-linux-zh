  md: 'It was decided to report POSIX priorities as negative integer values starting
    with −1 and decrementing to the tunable maximum of −512. This approach meant that
    what used to be reported externally as the weakest priority of 255 still comes
    out as 255. The strongest HP real time was and still is reported as 0, and the
    new strongest POSIX priority is reported as −512. Implementation of this model
    is really quite simple, as the POSIX real time priorities are simply inverted
    and added to this reporting continuum in the range of −1 to −512. This also maintains
    the concept that the more positive the value, the weaker the priority.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_167_0.png)


