  md: 'The instruction is given a register and an address. The instruction first loads
    the contents of memory from the given address into the given register. It then
    clears the value in memory—sets it to zero. When the instruction completes, the
    memory location will always be zero. The register will be whatever value was in
    memory *before* the instruction was executed. We use this instruction to set the
    value in `s1_lock` in the spinlock structure. After the instruction executes,
    the spinlock will be locked. When we examine the register we passed to the LDWC
    instruction. If that register is zero, it means that the spinlock was already
    locked by some other processor. If it is nonzero, then it was previously unlocked,
    and now is locked by us.


    So what do we do if we try to lock a spinlock and find it is already locked? We
    spin, of course. More specifically, we call `wait_for_lock()`, which does some
    accounting, then sits in a tight loop waiting for the lock to free up. When it
    finds the lock free, it tries to grab it. If it succeeds, then `wait_for_lock()`
    returns and the processor continues. If, when we try to grab the lock, we find
    that we can’t, it means some other processor beat us to it. We continue to spin.


    During this spin we also keep a timer. If we find after 60 seconds that we’re
    still waiting for the lock, then the system will panic with a Spinlock deadlock
    message. Sixty seconds is far too long for a spinlock to be held. If we’re not
    able to get it within 60 seconds, something is broken.


    Notice that once we find the lock free, there’s a chance we still can’t get it
    because another processor got there first. On a very busy system this can cause
    problems on a popular spinlock. To avoid this, the system uses a method of handing
    the spinlock from one processor to another. Rather than just freeing a spinlock,
    a processor can check to see if another processor is waiting for it. If so, it
    can assign it to that other processor. This is where the other two fields, `s1_flag`
    and `s1_next_cpu`, are used.


    `s1_flag` is set to one if there is another processor waiting for the spinlock.
    So when we try to lock a spinlock and find it already locked, one of the things
    that `wait_for_lock()` does is set `s1_flag` to one. The `spinunlock()` code checks
    this flag when unlocking the spinlock. If the flag is one, indicating that someone
    is waiting, rather than just releasing the spinlock, the code donates it to the
    next processor.


    # Arbitration


    Picking who to donate the spinlock to involves two more pieces of the puzzle:
    the `s1_arb_array` and the `s1_next_cpu` member. `s1_arb` is a global array of
    pointers to spinlocks, one for each processor in the system. When a processor
    starts to wait for a spinlock, in addition to setting `s1_flag` to one, it sets
    its own `s1_arb` array entry to point to the spinlock it is waiting for. Now,
    when the `spinunlock` code is ready to donate a lock to another processor, it
    can look through `s1_arb` for an entry that points to the spinlock that’s being
    released. When it finds one, that processor is the one that gets the lock next.
    The `s1_next_cpu` member is used to decide where in the `s1_arb` array to start
    looking. Each time the lock is donated to a processor, that processor’s index
    is put into `s1_next_cpu`. The next time we go through the process of'
