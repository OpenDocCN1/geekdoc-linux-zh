- pgno: 256
  md: 'The inode points to specific disk blocks using a 32-bit signed integer. The
    last three bits are the fragment offset, which leaves 28 bits for the actual block
    number and one sign bit. Note that these bits are reserved for the fragment offset
    regardless of the actual file system configuration. Only the last assigned direct
    pointer in an inode may point to a fragment.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_256_0.png)


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_256_1.png)


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_256_2.png)


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_256_3.png)


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_256_4.png)


    Figure 8-10 Blocks and Fragments


    Consider a file 27 KB in size. The first three direct pointers in its inode would
    point to full blocks (this would hold the first 24 KB, leaving 3 KB of space to
    be allocated). The fourth direct pointer could locate the remaining 3 KB of data
    in any fragmented block with three contiguous fragments available. As a file grows,
    whole free blocks are allocated; when the file is closed, the last direct pointer
    used is checked to see if its data may be relocated to an existing fragmented
    block or if it is a good candidate to allow remaining fragments to be used by
    other files. Each cylinder group maintains a list of fragmented blocks within
    its boundary.


    Fragment allocation and management requires extra overhead within the kernel,
    and its payoff is diminished once indirect pointers are required to map data.
    Once a file has grown to the point where all 12 direct pointers in the inode are
    used, all future allocations are of whole disk blocks, and no fragmentation is
    attempted for the file.


    # Allocation Policy


    Specialized allocation policies are used by the kernel when an inode or data blocks
    are requested. An inode is allocated as follows:


    +   Allocate inodes for files in the same cylinder group as their parent directory.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '+   * Allocate inodes for new directories in the cylinder group with a higher
    than average number of free inodes and the smallest number of directory entries.


    Data block allocation follows these rules:


    +   * If we are allocating a direct block, allocate the block in the same cylinder
    group as the inode that describes the file.

    +   * If the block is not available or if allocating an indirect block, allocate
    the block in a group with a greater than average number of free blocks.


    A secondary set of allocation policies follows:


    +   * Allocate the requested block.

    +   * Allocate a rotationally equivalent block in the same cylinder group.

    +   * Allocate any block in the same cylinder group.

    +   * If no data blocks are available in the requested cylinder group, then the
    try another cylinder group with a greater than average number of free blocks.


    Exceptions to these policies are made if there is insufficient space within the
    cylinder group. In this manner, a single file may still occupy the entire available
    disk space (within tunable limits), but in general all the blocks of a file tend
    to exist within the narrow boundary of a cylinder group. This improves the locality
    of the data and greatly speeds up file access during operations such as copies
    and backups, or any other time the entire file needs to be accessed. Another tunable
    file system parameter in the kernel is maxbpg, which is set to 25 percent by default.
    This parameter states the maximum percentage of space in a cylinder group that
    may be allocated to a single file. This is an advisory limit and may be exceeded
    if a file can find no other available blocks.


    # Other File System Types


    There are other file system types that may be utilized with the HP-UX operating
    system. The most common is the Veritas file system (VxFS). It is a third-party
    offering, so we will not go into the internal specifics of VxFS in this book.
    In general, the features offered by VxFS are transactional journaling (or intent
    logging) to speed up file system recovery following a system crash and a variety
    of data storage algorithms based on the allocation of large contiguous blocks
    of disk space for the storage of large files (it is also called an extent-based
    file system).


    Following the recent merger of Hewlett-Packard and Compaq, features of the Compaq
    Tru-64 operating system, particularly the Advanced File System, are being considered
    for porting to HP-UX.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# File System Utility Wrappers


    As the metadata utilized by various file system implementations may be quite different,
    the administrative commands used to manipulate, repair, and monitor them must
    be specific for the type they work with. When a developer creates a new file system
    type to be used with the HP-UX kernel, it is her or his responsibility to also
    create the utilities that work with the specific file system. So that the administrator
    doesn''t have to learn a different set of command names for each type of file
    system, most of the common commands have been converted to command wrappers.


    A wrapper command is merely a front end to the file system type-specific executable.
    Most wrapper commands allow you to pass the file system type as an option, or
    if the type is not passed, they simply examine the superblock for a magic number
    identifying the type. Once the type is known, the wrapper simply passes control
    to the type-specific executable. One way to see if a command is a wrapper is to
    find the "See also" section of its main page. For the fsdb command, you would
    find references to fsdb_hfs and fsdb_vxfs, among others. In most cases, you may
    also pass the type-specific executable name to the man command to learn about
    additional options and flags for the command.


    # The Kernel View of File Systems


    To isolate the rest of the kernel from the type-specific structures used by various
    file system types, a Virtual File System (VFS) abstraction layer is employed.
    Figure 8-11 gives us an overview of the VFS components.


    The VFS abstraction layer was first introduced to UNIX by Sun Microsystems engineers
    while they were developing the Network File System (NFS). They wanted local users
    and applications to be oblivious to the actual location of the files they were
    using. Current UNIX operating systems frequently build on this approach to masquerade
    the specifics of local and remote file system types mounted within their kernels.


    The HP-UX kernel uses a number of VFS structures, virtual inodes (vnode), caches,
    and hash headers to facilitate file access. To get started, we examine two key
    components of the virtual file system: the vfs mount table and the vnode.


    # The vES Mount Table


    The starting point for the HP-UX file management subsystem is the pointer rootvfs.
    This kernel symbol directs us to the "/" (or root) file system''s vES data structure
    (see Figure 8-12). Each new file system we mount creates an additional entry in
    the linked list of vES structures. Once a mount has been made, its vES entry is
    maintained until the kernel is rebooted, even if the file system is unmounted
    (if it is later remounted, the original vES structure is reused). Mount points
    configured by the automounter also add vES structures to the list.'
  merge: -1
  img_proc: true
