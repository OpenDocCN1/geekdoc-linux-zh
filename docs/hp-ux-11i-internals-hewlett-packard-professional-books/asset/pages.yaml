    # Figure 4-4 User-to-Kernel Thread Transitions


    For now, consider that there are only two means by which a processor’s current
    execution mode may be changed from user mode to kernel mode. The first is as the
    result of some type of system interruption that results in an immediate switch
    into the kernel context. The second is the direct result of the current user thread
    making a request to use one of the many provided kernel routines known as system
    calls, syscall().


    The return to the most deserving user thread is controlled by the same kernel-level
    mechanism, syscall(), regardless of which event caused the switch to kernel mode.
    This kernel routine is responsible for the delivery and notification of process-to-process
    signals and the handling of user-level context-switching, returning from a user-defined
    signal-handling routine, returning from a system-level interruption handler, and
    returning from a user thread-requested system call. It therefore must be able
    to deal with several different user and kernel stacks for the recovery of the
    user thread’s context (a thread’s run state context is stored in a process control
    block, or PCB, structure).


    Reference Figure 4-5 as we describe the various tasks performed by a thread during
    the execution of a system call.'
