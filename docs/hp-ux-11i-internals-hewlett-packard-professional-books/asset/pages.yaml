    # The preig ion (pseudo-region)


    This is a good point to discuss what is meant by a pseudo-structure. As mentioned
    earlier, memory management may be approached from two perspectives. A process
    could care less if a page is private or shared--it simply wants it to be made
    available when its data or text is needed during the execution of its code. From
    the process''s viewpoint, the va s should provide a direct connection to individual
    page-frame management data, but in practice it is not that simple!


    The kernel also has a perspective when it comes to memory management. We fully
    explore this point of view in Chapter 6, but for now must consider the basic idea
    of memory regions. A region is a contiguous range of virtual page frames to be
    used in a consistent manner with common access rights and privileges. To increase
    memory utilization efficiencies and provide various types of shared access to
    memory objects, a concept of private and shared regions has been developed.


    A reference count is kept in the region structure, tracking the number of preigions
    that are currently pointing to it. If this reference count is reduced to zero,
    then the kernel deallocates the region structure and all the memory resources
    it controls.


    Region sharing is accomplished through the creation of an additional abstraction
    layer in the kernel. For a process to claim access to a region, a structure known
    as a preig ion (or pseudo-region) is linked into the process''s vas chain. Each
    preig ion in the process''s chain points to a specific region mapped to the kernel''s
    VAS (see Figure 5-10).


    Preigions from multiple processes may point to the same kernel region, thus creating
    a shared memory object under kernel control. A region only knows the total number
    of page frames it contains, where they have been placed in the kernel''s VAS map,
    whether it is private or shared, and the specific status and location of each
    page frame. The actual purpose of these pages (whether it is text, data, a memory-map
    or shared memory) is not known at this level.


    Conversely, the preig ion maintains a detailed list of attributes from the perspective
    of the process, where it has been linked into the process''s logical memory, its
    usage type, size, and current status.'
