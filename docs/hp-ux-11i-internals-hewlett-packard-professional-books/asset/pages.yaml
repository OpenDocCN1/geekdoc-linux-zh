- pgno: 130
  md: 'Note: As shown in the listing, system calls 1 through 253 each have a private
    promotion block defined, thus allowing them to define a unique branch target.
    Most of the calls jump to syscallinit, but some reference lightweight calls instead.
    All the calls above 253 collectively use the promotion block for syscall #0.


    One restriction in this model was that no new lightweight calls could be defined
    with call numbers above 253. Another issue is that since the address of gateway_page
    is hardcoded into the system call stub it may not be relocated without breaking
    support of existing binaries.


    # The Wide Gateway: gateway_page, sysvec, and gateway64_page on a 64-bit Kernel


    With the advent of the 64-bit HP-UX kernel, a new gateway page model was implemented.
    To address the issue of assigning lightweight system call numbers above 253, a
    user-space vector jump table (indexed by the system call number), sysvec, was
    created and accessed by a new system call stub for wide applications. The addresses
    contained in sysvec point to promotion blocks stored on a newly created gateway64_page.
    The kernel still contains a sysent [ ] vector jump array, so the gateway64_page
    needs to contain only a generic promotion block for all the heavyweight system
    calls and one additional promotion block for each distinct lightweight system
    call.


    To provide continued support of existing narrow applications, a gateway_page is
    located at the virtual address 0xC0000000, and the gateway64_page and the sysvec
    page (or pages) are located immediately after. Unlike on narrow systems, these
    pages are not in the fourth quadrant of virtual space 0; instead, they are in
    the first quadrant of the space allocated for sharing objects between narrow and
    wide processes. This space number is stored in the kernel parameter q1_64bit_spaceid.


    During kernel initialization, the gateway_page and gateway64_pages are configured
    with TLB access rights set to PDE_AR_GATE. The following kernel global variables
    help define the location and size of the gateway and sysvec pages for a wide kernel:


    +   - gate64_vaddr – Virtual address of the gateway64_page

    +   - gate64_pages – Number of pages needed for the 64-bit promotion blocks

    +   - sysvec_vaddr – Virtual address of the 64-bit sysvec table

    +   - sysvec_pages – Number of pages needed for the sysvec table

    +   - sysvec_entries – Number of 64-bit promotion blocks

    +   - q1_64bit_spaceid – Number of the virtual space holding the gateway pages'
  merge: -1
  img_proc: true
