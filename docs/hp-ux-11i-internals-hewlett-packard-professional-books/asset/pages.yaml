    # Figure 9-8 Shared Memory Objects


    The following kernel-tunable parameters are used to size and configure System-V
    shared memory capabilities.


    +   * **shmni** sets the maximum number of shared memory regions the kernel may
    manage.

    +   * **shmmax** sets the maximum size in bytes for a shared memory region.

    +   * **shms** sets the maximum number of shared memory regions a single process
    may attach to its virtual view at one time.


    System-V shared memory regions are managed as independent kernel resources; that
    is, they may continue to exist even if there are no current processes attached
    to them. If a programmer decides to use shared memory regions, he or she is responsible
    for their allocation and eventual cleanup. The administrative commands **ips**
    and **icrm** may be used to check the status of shared memory regions and, if
    necessary, to remove them from the system.


    Note that some programmatic schemes involve creating a shared memory region and
    having it persist as various daemons or agents are launched and momentarily attach
    to and detach from it. In a production environment, just because a shared memory
    region has no processes currently attached does not necessarily mean that you
    should remove it!


    The POSIX system definition also has a set of shared memory calls. The calls are
    implemented on HP-UX as shared memory mapped files. Programmers are encouraged
    to use the System-V shared memory calls over the POSIX calls but both will function.'
