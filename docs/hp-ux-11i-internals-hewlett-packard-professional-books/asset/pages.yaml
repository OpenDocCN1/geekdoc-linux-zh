- pgno: 283
  md: '+   - The kernel is now free to complete the deconstruction of the child and
    free its resources.

    +   - In most cases, the shell then issues another prompt to the user, and the
    process starts all over again.


    As a side note, consider that a parent process may choose not to wait for the
    death of its child (called running the child in background mode), but it still
    must respond to the receipt of the death-of-child signal with one of several variations
    of the `wait()` system call. The kernel cannot complete the deconstruction of
    a child process until the parent’s wait handshake is received. When a child calls
    `exit()`, it is placed in a zombie state until the parent handshake is received
    (or until the system is rebooted).


    Another point to consider is that if a process is multithreaded, the child resulting
    from a fork will have only one initial thread regardless of how many active threads
    the parent had at the time the call was made. As a related point, if any active
    thread of a multithreaded process calls `exit()`, then the process and all sibling
    threads are halted and deconstructed. The process and the thread that made the
    `exit()` call remain in the zombie state until the parent handshake is received.


    # Which Came First?


    So now, the age old question: which came first, the chicken or the egg? Since
    all processes start out as the cloned child of a parent, how does the first process
    get its start? In the world of HP-UX (and UNIX in general), that auspicious honor
    belongs to the first user-level process named `init` and assigned process identifier
    `p_pid=1`.


    The `init` process is handed off by the kernel during system initialization and
    linked to a process and thread table structure (more on this later). The `init`
    process takes its marching orders from the `/etc/inittab` file, starting many
    processes, including the infamous `/sbin/rc` program, which in turn initiates
    most of the system daemons and services. Next time you’re asked the chicken and
    egg question, simply smile a knowing smile and answer “init!” (If there was ever
    any doubt, your UNIX-savvy friends will now know for sure you are a fellow geek!)


    Now that we have taken a first look at the process life cycle, we examine each
    of the related system calls in greater detail.


    # A Historic Look at the fork() Call


    The original UNIX `fork()` call required that the full scope of the calling process’s
    kernel run environment be duplicated. This included the allocation of new process
    and thread table structures, the duplication of the entire `vas::pregion` structures,
    and creation of new region structures in the case of private memory regions and
    copies of their data pages. If the `fork()` was'
