    \nEach time you execute a `load` command, a new pile is created. Previous piles\
    \ are pushed onto a stack, so that at any time you will have access to all piles\
    \ you've created. The `history` command lists the piles in the stack. For example,\n\
    \n```\nq4> history\nHIST NAME    LAYOUT  COUNT  TYPE      COMMENTS\n  1 <none>\
    \    array   1      struct    mpinfo  stopped by max count\n  2 <none>    array\
    \   2      struct    mpinfo  stopped by max count\n  3 <none>    array   2   \
    \   struct    mpinfo  stopped by max count\n  4 <none>    list   155     struct\
    \    proc    stopped by null pointer\n```\n\nThe highest numbered pile is the\
    \ current pile. You can recall a previous pile with the `recall` command. The\
    \ argument to the `recall` command is a pile number from the `HIST` column in\
    \ the history display. A copy of the specified pile is pushed onto the stack and\
    \ becomes the new current pile. Given the history in the previous example, we\
    \ can recall the first `mpinfo` pile:\n\n```\nq4> recall 1\ncopied 1 item\nq4>\
    \ history\nHIST NAME    LAYOUT  COUNT  TYPE      COMMENTS\n  1 <none>    array\
    \   1      struct    mpinfo  stopped by max count\n  2 <none>    array   2   \
    \   struct    mpinfo  stopped by max count\n  3 <none>    array   2      struct\
    \    mpinfo  stopped by max count\n  4 <none>    list   155     struct    proc\
    \    stopped by null pointer\n  5 <none>    array   1      struct    mpinfo  copy\
    \ of 1\n```\n\nA pile can also be given a descriptive name that will be displayed\
    \ in the history. The name is applied to the current pile with the `name` command.\
    \ The syntax is just `name it <name>`. Continuing the above example, if we want\
    \ to assign the name `proc1` to the pile we just recalled, we type\n\n```\nq4>\
    \ name it proc1\nso named\nq4> history\nHIST NAME    LAYOUT  COUNT  TYPE     \
    \ COMMENTS\n  1 <none>    array   1      struct    mpinfo  stopped by max count\n\
    \  2 <none>    array   2      struct    mpinfo  stopped by max count\n  3 <none>\
    \    array   2      struct    mpinfo  stopped by max count\n  4 <none>    list\
