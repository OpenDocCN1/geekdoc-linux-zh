  md: '# Q3 Private Address Space


    With the release of patch PHKL_20224 for HP-UX 11.0 and on subsequent releases,
    32-bit narrow applications running under control of a 64-bit wide kernel on 64-bit
    PA-RISC 2.0 hardware have an additional mapping option available to them (a 32-bit
    kernel will simply ignore this request for large private data). Figure 5-7 illustrates
    the basics of this option.


    The classic narrow process map reserves Q3 and Q4 for shared objects, but what
    if the process needs an extraordinary amount of private data space? As there is
    a hard limit of four quadrants, the only way to increase a process''s private
    data space comes at the expense of its ability to access system-shared space.


    To implement this new feature requires the use of the chattr command-line utility.
    Two new options have been added to chattr: +q3p <enable/disable> <process-name>
    and +q4p <enable/disable> <process-name>. Before either of these commands may
    be issued, the kernel must be tuned to allow the new, larger private data size,
    which is accomplished by tuning the age-old parameter maxdsiz.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_155_0.png)


    Figure 5-7 Q3 Private Address Space'
