- pgno: 397
  md: 'next step is to launch the first user space process—the pre_init_rc process.
    pre_init_rc is a script found in /etc/pre_init_rc and is responsible for performing
    an fscok on the root file system. We start out as before, calling prepare_newproc()
    and newproc() to fork a new process and kernel thread. Then we handcraft a small
    data space—three pages—and attach it to the thread. The first page gets a fixed
    preamble, coded in assembly, which contains some simple support routines. These
    include a version of strlen(), a version of bcopy(), and an interface to allow
    system calls. We need this preamble because we don''t have direct access to the
    kernel''s system call handlers or to routines like bcopy(), since the process
    is a user space process. At the same time, we don''t have access to libc or any
    of the other usual C libraries because the kernel doesn''t know where those are
    yet. We''ve only got the root file system mounted. Immediately following this,
    the code we want to run gets copied into the page. The second page is reserved
    for data for the process, and the third is used for stack.


    Three pages isn''t much space to operate in, but it doesn''t have to do much.
    The code that gets placed into the first page opens stdin, stdout, and stderr,
    then does an execve() system call. For the pre_init_rc script, we tell execve()
    to run sh out of /sbin and pass pre_init_rc as argv[1]. The execve() syscall takes
    care of loading the shell and expanding memory regions as required, and then the
    shell runs the pre_init_rc script.


    After the pre_init_rc script has run, we unmount the root file system, then mount
    it again, this time writable. Now we''re ready to fork the init process.


    Init gets forked essentially in the same way as pre_init_rc—by creating a process,
    creating a three-page user space for it, then using that space to make an execve()
    system call to get init running.


    We''re on the home stretch now. Once init is up and running, it starts forking
    off the user processes. We still need to get the rest of the processors going—we
    left them spinning, looking at the mp_sync_after_rendez global. The monarch processor
    now sets that global to CONTINUE_EXECUTION. All of the other processors now continue
    with their startup, much as the monarch did—they go into virtual mode, start their
    clocks ticking, and eventually call idle(), where they loop, looking for processes
    to run.


    The last thing that the monarch does in the boot process is call sched(). This
    causes that thread of execution to become the sched process. Note that this isn''t
    like the other daemons, where we forked first and the child became the daemon.
    We don''t fork for sched, so the thread of execution that has done all the work
    for us so far becomes sched.


    # ## Summary


    We''ve looked at the boot process from the time that the system is powered on
    to the time it''s running and ready to launch user processes. Most of the process
    is fairly routine—the creation and initialization of systemwide data structures.
    Some of the steps are described in more detail in other chapters, particularly
    the I/O configuration process. We''ve seen too that there are some unusual things
    that have to happen during boot, such as handcrafting processes and making the
    leap into user space to launch user-level processes. There''s a lot of work that
    has to get done to get from power off to running, particularly in a multiprocessor
    system.'
  merge: -1
  img_proc: true
