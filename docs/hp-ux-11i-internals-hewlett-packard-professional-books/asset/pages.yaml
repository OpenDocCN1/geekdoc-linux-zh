- pgno: 220
  md: '# # CHAPTER 7


    # The HP-UX Paging System


    C lassic UNIX featured a program swapping system. When the kernel needed to make
    room in-core memory for a process to run, it would select an inactive process
    or one of a lesser priority and move it from physical memory to a temporary storage
    location on disk. The program was then said to be *swapped out*. Before the process
    could run again, it would have to be swapped back into memory. This could tie
    up a large portion of the system''s I/O bandwidth. Whole process swapping has
    been relegated to the history books; modern kernels utilize a *demand paging system*.


    # ## Pages on Demand


    In a demand paging system, instead of loading all of a program''s text and data
    at the time the program is dispatched, the system waits for a page to fault and
    then loads only the required page. This means that at any specific point only
    a small portion of a process''s pages need be resident in physical memory. All
    first references to a page result in a page fault, but if a system has ample memory
    then eventually all of a process''s pages will be mapped to physical pages and
    performance will be optimal. If the demand for pages exceeds the system''s configured
    or available memory, then pages will have to be paged out before others may be
    paged in.


    The HP-UX paging system is responsible for loading pages when they are first requested
    and monitoring and maintaining a reasonable supply of free pages. If the amount
    of free memory drops below tunable system thresholds, the paging system must identify
    pages to be paged out. Page-ins will always occur; at least as long as new programs
    are dispatched, but significant numbers of page-outs indicate memory pressure
    has increased and overall system performance will begin to diminish. This is not
    necessarily bad; it is just a case of cause and effect that the system administrator
    must understand.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'When a page fault occurs, the kernel must be able to identify the location
    of the requested page and take corrective action. As we saw in Chapter 6, “Managing
    Memory,” in our discussion of the **ddb**, each nonce resident page is typed.
    The paging system understands the various types and how to recover them. Let’s
    look at the types in detail.


    # ### Faulting in a Page from Front Store


    A requested page may be part of a process’s text image or an initialized data
    page. If so, the appropriate page is found in the program file, and it is loaded
    to a free page frame. In addition to scheduling the page-in, the kernel must update
    the **hash**, **region**, **pfdat**, and **pfn_to_virt** table entries as well.


    The routine handles read-ahead page requests as well: the **p_pagein** in the
    **preregion** is adjusted according to whether the file is being accessed in a
    random or sequential manner, which is determined by monitoring the address of
    faulting pages. Each time a fault is handled for a region, its **p_nextfault**
    is set to the next sequential page address following the one that caused the current
    fault (the current faulting page number plus **p_pagein**). When the next fault
    for this **preregion** occurs, the faulting page address is compared to this value.
    If it matches, we are performing sequential reads, in which case **p_pagein**
    is multiplied by 2 (the value is limit-checked against the kernel’s **maxpagein_size**,
    default is 64). If **p_strength** is less than 100 and we have detected a sequential
    operation, it is incremented. This gives us a sense of how sequential our access
    is.


    If the next fault is not sequential, **p_pagein** is divided by 2 (limit-checked
    against **minpagein_size**, defaults to 1), and the **p_strength** is decremented
    unless it is currently equal to $\sim$100.


    From the above description we can see that **p_strength** may vary between $\sim$100
    (defined as **PURELY_RANDOM**) and +100 (defined as **PURELY_SEQUENTIAL**), and
    **p_pagein** may vary by powers of two between 1 and 64.


    # ### Faulting in a Page from Back Store (Swap)


    A page may currently reside in swap. Before the page is scheduled for a page-in,
    the system first calls **vm_no_io_required()** to check the **pash** in case the
    page was swapped but never revalidated. If this is the case, the page is still
    in memory and all the kernel has to do is update the tables—no actual page-in
    is required. This is called a *soft page fault*. If the fault is not soft, then
    a page-in is scheduled and the four tables are updated as in the previous case.


    # ### Faulting in a Zero-Fill Page


    If the page requested is a uninitialized data page, the kernel simply has to find
    a free page, fill it with zeros, and update the four tables. Uninitialized data
    pages are also known as block store by symbol (**BSS**) pages and constitute the
    majority of a process’s private data area.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# ### Faulting in a No-Fill Page


    In addition to these three types of pages, the kernel may be asked to fault in
    a no-fill page. This is similar to the BSS page fault except that we don’t fill
    the page with zeros. The page will still contain whatever residue was left behind
    by its previous owner. For this reason, this option is available only for pages
    being allocated for kernel use and, in particular, only for use as `uarea` pages.
    The `uarea` is not visible to the process, only to the kernel so residue data
    is not subject to examination by a user thread.


    # ### Digging a Memory Hole


    The final type is a page called a *memory hole*, used for linkage to sparse memory-mapped
    files. When a read is scheduled against one of these pages, a requestor receives
    a 0 or null value; when a write is attempted, the semantics of the zero-fill page
    are followed.


    # ## Monitoring Free Memory


    Maintaining an ample supply of free pages for the system is a key duty of the
    kernel; to this end, the kernel symbol `freeemem` contains the total number of
    page frames currently on a free list. When memory pressure is high, there are
    relatively few free pages on the free lists, and the kernel must take corrective
    action. Figure 7-1 gives us an overall view of the free-page monitoring system.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_222_0.png)'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The total amount of memory available to the operating system is determined
    at boot and stored in the kernel parameter `phys_mem_pages`. Additional setpoints
    are calculated and continuously monitored by the kernel.


    # lotsfree


    The tunable parameter `lotsfree` sets the point at which the paging system is
    first called into action. If the number of free pages, `freemem`, is above `lotsfree`,
    then the paging system has nothing to do. The default value for `lotsfree` depends
    on the amount memory configured for the system.


    For systems with 32 MB to 2 GB of physical memory, `lotsfree` will be 1/16 of
    the non-kernel memory, not to exceed 8192 pages (32 MB). For systems with more
    than 2 GB, `lotsfree` is set to 16,384 pages (64 MB).


    # desfree


    The tunable parameter `desfree` sets the minimum desired number of free system
    pages. When the number of free pages drop below this limit, the `vhand` agents
    are already working at their maximum rate. The swapper starts evaluating processes
    for potential deactivation, but no deactivations take place yet.


    For systems with 32 MB to 2 GB of memory, `desfree` is set to 1/64 of non-kernel
    memory, not to exceed 1024 pages (4 MB). For systems with more than 2 GB of memory,
    `desfree` is set to 3072 pages (12 MB).


    # minfree


    When the tunable parameter `minfree`''s limit is hit, things are really tight.
    supply is not keeping up with demand by any stretch of the imagination. In terms
    of memory availability, we are in the 11th hour, so the kernel asks the swapper
    to start process deactivations. Hopefully, this action will get `freemem` back
    into an acceptable range.


    For systems with 32 MB to 2 GB of memory, `minfree` is set to 1/4 of `desfree`,
    not to exceed 256 pages. For systems with more than 2 GB of memory, `minfree`
    is set to 1280 pages (5 MB).


    # gggslim


    At boot time, this parameter is set to 1/4 of the way between `desfree` and `lotsfree`.
    When `freemem` drops below `lotsfree`, the `vhand` daemon is started, but at this
    time it only ages pages—no stealing is done. If `freemem` drops below `gggslim`,
    then the other half of `vhand` is activated, and it steals stale pages. The kernel
    adjusts `gggslim` between `lotsfree` and `desfree` in accordance with recent current
    trends in memory pressure. (In earlier versions of HP-UX this parameter was tunable.)'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Other Kernel Paging Parameters


    There are several other kernel parameters we need to mention:


    +   • **freemem** (calculated): This is the current free page count for the system,
    the number of page frames on all the free lists.


    +   • **paolem** (calculated): This is the count of pages pending page-out operations
    at this time.


    +   • **vhandrunrate** (tunable): This is the number of times per second the kernel
    will kick off the vhand daemon if the free page count (*freemem* plus *paolem*)
    has dropped below *lotsfree*. The default is 8.


    +   • **memzeroperiod** (tunable): This parameter, in 1 second increments, determines
    how often *pggslim* is adjusted by the kernel. Every $2 * \text{memzeroperiod}$
    seconds or if *freemem* has reached zero more than two times, *pggslim* is adjusted.
    The formula for this adjustment is $[3 * \text{pggslim} + (\text{lotsfree}/4)]$
    if *freemem* has reached its target limit within *memzeroperiod* and $[3 * \text{pggslim}
    + (\text{desfree}/4)]$ if *freemem* has not reached its target limit within *memzeroperiod*.
    The default value is 30, or every 3 seconds.


    +   • **hitzero/freemem** (kernel): The number of times *freemem* has hit zero
    in the last *memzeroperiod*.


    +   • **targetcpu** (tunable): This represents the maximum number of CPU cycles
    we are willing to allocate to the *vhand* daemon. The default is 100 ticks, or
    10 percent of the total CPU time.


    +   • **maxqueuesize** (tunable): This number controls the pending *paolem* queue
    depth. The value is in 1 second and defaults to 10. This means that the system
    will attempt to keep the page-out queue to no more than the system can handle
    in 1 second.


    +   • **pageoutcnt** (counter): This is a count of recent kernel- and user-requested
    page-outs.


    +   • **kpageoutcnt** (counter): This is the number of recently completed kernel-requested
    page-outs (*vhand*).


    +   • **pageoutrate** (calculated): This is the current total page-out rate.


    +   • **kpagueoutrate** (calculated): This is the current *vhand*-page-out rate.


    +   • **maxpendpageouts** (calculated): *pageoutrate* \* (*maxqueuesize*/10).


    +   • **pgrateupdate** (tunable): Number of seconds to copy *curr_pgrate* to *max_pgrate*;
    defaults to 60.


    +   • **curr_pgrate** (counter): Maximum *kpageoutrate* seen in the current period.


    +   • **max_pgrate** (calculated): Maximum *kpageoutrate* seen in the last *pgrateupdate*
    period. This is an indicator of possible page thrashing if it is high and the
    CPU utilization rate is low.


    +   • **agehand** (kernel): This is a pointer to the next *pregion* in which *vhand*
    may age (scan) pages.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '+   • *stealand* (kernel): This is a pointer to the next preregion in which
    vhand may steal pages.


    +   • *agerate* (kernel): This is the age quota assigned by the swapper to vhand
    for its next run.


    +   • *stealrate* (kernel): This is the steal quota assigned by the swapper to
    vhand for its next run.


    +   • *handlaps* (kernel): This it the desired amount of lag between the scanning
    operation and the stealing operation in a pre region.


    +   • *targetlaps* (kernel): This it the actual amount of lag between the scanning
    operation and the stealing operation in a pre region.


    +   • *vhandinfoticks* (adb tunable): This parameter should only be set using
    adb (by a very knowledgeable user). If it is a nonzero value, then every vhandinfoticks
    vhand prints a status report out to the system console, including the current
    values of handlaps, targetlaps, agerate, gpgslim, paroleem, stealrate, and freemem.


    The vhandrunrate sets flags in the kernel to call schedpaging() at the appropriate
    rate. This routine checks the current value of freemem, and if it has fallen below
    lotsfree (or gpgslim in an extreme case), the vhand daemon is called. Let''s examine
    vhand in detail.


    # A Thief in the Night: vhand


    The vhand kernel daemon is actually two operations in a single package. The first
    scan targets pages and, if their pde_accessed bits are still clean, steals them;
    the second scan ages targeted pages. To age a page means to invalidate its current
    virtual address translation(s) in all processor TLBs and clear the access bit
    for the page in its hash table entry (pde_accessed = 0). vhand steals a page when
    it discovers that the page has not been referenced since it was last scanned.
    It then requests a page-out and allocates a swap location if one does not already
    exist for the page.


    Pages are aged and stolen through their pre region → region → vfd linkages. Figure
    7-2 shows vhand''s view of a pre region.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_226_0.png)


    # **Figure 7-2 Inside Each pregion**


    In this simplified model we see that all the pages of the **pre gion** are arranged
    in a circle, and their respective **vfd s** appear as the numerals on the face
    of a clock. In our simple example, the **p region** has 32 pages, sufficient to
    explain **vh and** operation. In the **p region** structure, the **p_stealscan**
    points to the next page in this **p region**, which may be checked for parole.
    The **p_agescan** points to the next page **vh and** may age. When **vh and**
    enters a **p region**, it is only allowed to scan 1/16 of the available pages.


    The **p_stealscan** must lag the position of the **p_agescan** by [**(p_count/16)
    * handlaps]**. Maintaining this lag assures that a process that still needs the
    aged page may access it before it is stolen. The larger the lag, the less likely
    **vh and** is to steal a page in current use.


    The next time the system points to this **pregion**, the next 1/16 of its pages
    may be scanned. Individual **pregions** are dual-linked in a systemwide list of
    all active **pregions** by their **p_forw** and **p_back** pointers


    # **The Linked pregion List**


    The kernel follows this dual-linked list to find the next **pregion** to scan
    Figure 7-3 illustrates this concept. You can think of the operation as a two-level
    clock. The hands on the main clock are the system''s **agehand** and **stealhand**.
    Inside each **p region** are corresponding **p_agescan** and **p_stealscan** pointers.
    This is where the paging routine''s name comes from: **vh and** stands for the
    *virtual hand* pager.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_227_0.png)


    # **Figure 7-3** Linking All the *regions*


    In order for all the pages of a *region* to be aged, the system’s *agehand* would
    have to make 16 complete laps of the systemwide *region* list—hence the term *handlap*.
    The larger the *handlap* value (maximum is 15), the greater the lag time between
    the *vhand* aging a page and being able to steal it. As memory pressure falls
    below *pggslim*, the *handlap*’s value is reduced until the *_p_*stealscan* is
    bumping into the *_p_*agescan* (it is never allowed to overtake it).


    Each time *vhand* is scheduled, it is given a quota of pages to age and steal:
    *stealrate* and *agerate* respectively. As it enters the *region*, it attempts
    to meet its quota. if the *region* doesn’t have enough pages to meet the quota,
    *stealhand* simply moves on to the next *region*. Once the quota is reached, it
    stops. The current position of *_p_*stealscan* is where it starts next time this
    *region* is scanned. The same is true for the aging process


    The quotas are also adjusted as *freemem* loses ground with respect to *pggslim*
    and *desfree*. By the time we reach *desfree*, handlaps are at a minimum, the
    quota is at its maximum (determined by the setting of *targetcpu*), and the paging
    is as aggressive as it can be. If this isn’t enough to get us back into the good
    graces of the memory management system, then deactivation may do the trick.


    Programs begin with no pages in memory. As pages occur, the requested pages are
    loaded; this is the essence of *demand* paging. As time goes by, a process may
    end up with a substantial number of its pages in-core. As other processes are
    scheduled, memory pressure may start to increase. When a program is deactivated,
    all of its *regions* are marked as deactivated and moved to the front of the *stealhand*
    list. All of its pages may be pored the next time *vhand* runs.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'As soon as we get above the **desfree** limit, we consider deactivated processes
    for reactivation. Even if we reactivate a large process, we may be able to stay
    above the limit, since pages are only reloaded on an on-demand basis.


    # # Reservation Versus Swap Allocation


    In operating system design, there are many variations of swap management. Some
    systems dynamically assign swap space from available file system space and return
    it when it’s not needed. Others configure static, dedicated swap at boot time
    and force the system to work within its boundaries. Some allow swap space to be
    allocated on the fly from either dedicated volumes or by creating a directory
    under a mounted file system and creating swap files there.


    An important design consideration is how the system responds if it runs out of
    swap space. Will the kernel crash or simply terminate the process that made the
    swap request? This could have severe impact on running applications and wreak
    havoc on system uptime.


    A final issue is when to allocate a swap page for a process page. Some systems
    make an entire copy of a program to swap prior to running the first command. These
    allocated swap pages belong to the process as long as it is active and are reclaimed
    by the swap system only at process termination. Another approach is to hand out
    swap locations as they are needed and return them to a free list as soon as their
    pages are reloaded into memory. In this model, a page may be swapped several times
    during its life cycle, and it might use a different swap location each time. This
    approach means we have to go through the overhead of allocation each time the
    page is to be swapped. We could also wait to assign a page until it is needed
    and then keep the allocation until the process terminates. In this last model,
    we would have to pay the price of allocation only once. Each approach has its
    pros and cons.


    HP-UX uses bits and pieces of the two approaches and adds a few twists of its
    own. The HP-UX paging strategy keeps track of the number of reserved, allocated,
    and free swap pages under its control.


    When a process requests permission to become active via the **fork()** or **vfork()**
    system calls, the system calculates the total number of swap pages this process
    might need. It uses a worst-case calculation and includes room for all of the
    process’s data pages, **region** page lists, **aarea**, and any other process-specific
    writable memory pages. This number of pages is then subtracted from the system’s
    swap reservation limit. In this way, HP-UX performs prereservation and postallocation
    of swap.


    To understand this approach, think of a fancy restaurant. You plan to bring a
    party of 12 to the restaurant for dinner on Friday night at 7:00 p.m. If you wait
    until Friday and simply show up with your group, you may have to wait a long time
    for seating. Although you may eventually get to eat, your enjoyment of the experience
    may be adversely affected by the long wait. To avoid customer dissatisfaction,
    the restaurant takes seating reservations ahead of time. You call the restaurant
    on Tuesday to make a reservation for you and your party on Friday. When you call
    the maitre d’ and request seating for Friday, he or she checks a list and lets
    you know if the res-'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'taurant can accommodate you at that specific time. If it can, the maitre d’
    takes your name and confirms the reservation.


    Now let’s think about this process a bit. Does the maitre d’ know exactly where
    you will be seated? Does he or she know what you will order or how long you plan
    to stay? The only thing the maitre d’ can assume is that the restaurant’s resources—tables
    and chairs, capacity of wait staff and kitchen—will need to accommodate your party.
    The establishment determines a reservation limit dependent upon its capacity.
    When you actually arrive at the restaurant, the decision is made to allocate specific
    resources to you as they are required. Once you are seated, the space remains
    yours until your evening is finished. If you get up to have a spin on the dance
    floor or go to the powder room, the resources assigned to you and your party are
    maintained. When you pay your check and leave, the resources are collected and
    made available for the next party. If you hadn’t shown up on Friday, or if your
    party ended up being only 8 instead of 12, no resources were wasted; they simply
    remained available to accommodate other customers as required.


    This is a fairly decent analogy of the HP-UX swap reservation policy. Once a page
    has been allocated to hold a specific page, it is retained for this purpose until
    the process exits, then it is returned to the swap map as a free page. In Figure
    7-4, we see the relationship between swap space, reservation, and allocation.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_229_0.png)


    At boot time, the reservation limit is set to the total amount of configured swap
    space. When the system is asked to `fork()` a new process, its potential swap
    requirements are subtracted from the swap reservation. If this causes the limit
    to go negative, the `fork()` fails and the error message returned will indicate
    the failure was due to insufficient swap.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'If the fork() succeeds, the reservation limit is adjusted and the process is
    initialized. At this point, no pages have actually been allocated, only reserved.
    On a system with ample physical memory, it is quite possible that the process
    will never have a swap page allocated. This is the ideal, as it means system memory
    pressure never triggered the paging system.


    When a page needs to be swapped for the first time, the kernel allocates a page
    from the swap map and pages the in-core page to the newly allocated swap page.
    When this occurs, the allocated count is incremented and the reserved count is
    decremented; the reservation limit remains unchanged. The swap reservation limit
    plus the number of reserved and allocated pages should always add up to the total
    amount of swap configured on the system. Once a page allocation has been made,
    it is maintained until the process is terminated.


    # A Simple Swap Example


    Figure 7-5 demonstrates a simple swap scenario: three programs would like to run
    in our model. The model is configured with 12 pages of physical memory and 12
    pages of swap space.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_230_0.png)


    The swap reservation limit is 12 when progA asks to run. Its swap requirement
    is four pages for data; 12 - 4 = 8, so the reservation limit is adjusted and the
    process is given the green light.


    When progB asks to run, its swap requirement is determined to be five pages. The
    reservation limit is checked: 8 - 5 = 3, so this process is also given the green
    light.


    When progC asks to join the club, it is denied permission to run. Its swap requirement
    is four pages. Since 3 - 4 = -1, this would result in a negative swap reservation
    limit, so the fork() fails.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'You might ask why we don''t just let all three run. The total memory requirement
    appears to be 21 pages, and we have a total of 24 pages counting physical memory
    and swap. If we returned freed pages to the swap map as they are paged back into
    core, we could get by. The approach HP-UX takes is on the conservative side but
    assures reasonable performance. Stopping to allocate a swap page is a timely operation,
    and we don''t want to do this more than once for a page. If your kernel is scheduling
    page-outs, HP-UX chooses a strategy that allows us to minimize the overhead of
    the paging system at a time when performance is already being compromised by high
    memory pressure.


    Another issue is that we don''t want to find ourselves in the situation where
    a page needs to be swapped and the system is simply out of swap. When this happens,
    a kernel either has to panic or at the very least kill the process that is causing
    the memory pressure. The HP-UX approach is to never allow this scenario by simply
    assuring that sufficient swap space is configured before allowing a process to
    start. With the current cost of disk storage, large swap space should not be considered
    a major issue.


    Let''s revisit our simple model. Suppose you decided to double the amount of physical
    memory on the system so that you would never have to swap. This sounds like a
    good idea and should guarantee optimum performance as far as memory pressure is
    concerned. The problem arises when we work through the model: if we don''t also
    increase our swap space we won''t be allowed to schedule all three processes,
    since we will still run out of swap reservation space before we can launch progC.
    In our model it seems simple to adjust the swap space, but in the real world and
    with the large configurable memory options available today, this isn''t always
    practical.


    On early versions of HP-UX, when you wanted to increase the physical memory to
    eliminate the need for swap, you still had to provide the swap space to satisfy
    the swap reservation scheme. Customers did not want to buy swap space that might
    not even be used, and who could blame them? In those days, disk space was a much
    more valuable commodity. One approach would have been to simply turn off swap
    preservation, but this would lead to the problems discussed earlier. The answer
    arrived at by the HP-UX kernel designers is a feature called pseudo-swap.


    # Pseudo-Swap


    The pseudo-swap approach is one of the least understood features of the HP-UX
    kernel; hopefully, we can make you comfortable with its purpose and function.
    Pseudo-swap is enabled in the HP-UX kernel by setting the kernel parameter swappemon
    to 1 (this is the default for freshly installed systems). With pseudo-swap enabled,
    the swap reservation limit is adjusted to include all physical swap plus 75 percent
    of the system''s available memory (87 percent on the latest release). This has
    been described as "using physical memory for swap space." While there is a basic
    truth to this statement, it doesn''t tell the whole story. Although pseudo-swap
    may'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'sound a bit strange at first, it provides several benefits over simply turning
    swap reservation off. Figure 7-6 illustrates the addition of pseudo-swap to the
    mix.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_232_0.png)


    The addition of pseudo swap allows the actual swap space to be reduced to as little
    as 25 percent of the physical memory. That''s not to say that you *should* reduce
    it—just that you *can*. If the system is configured with ample physical memory,
    then there is no danger in reducing the size of the swap map. If, however, memory
    pressure increases and we don''t have actual swap space to handle it, things can
    get a bit interesting. Consider the following scenarios:


    +   * **First scenario:** We have enough physical memory for all the system and
    user needs. Pseudo-swap is turned on, and device swap is reduced to 25 percent
    of the available memory. No problem—this should work just fine.

    +   * **Second scenario:** You have maximized your physical memory, but your processes
    simply want more! It''s easy: configure the amount of swap your processes need.
    In this scenario, we recommend that you leave pseudo-swap disabled, as you would
    really prefer to have device swap fulfill the system''s paging requirements.

    +   * **Third scenario:** Originally we had sufficient memory, turned on pseudo-swap,
    and reduced the physical swap to a minimum. The challenge is that we have since
    increased our demand on memory by adding more processes, but we haven''t upgraded
    the memory or the swap space. What happens when we start using the pseudo-swap
    to satisfy our system needs?


    When a process starts, its swap space requirements are calculated and reserved.
    As long as there is device or file system swap space available to cover this reservation,
    all is fine. Once we'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'exceed the physical swap limit, we begin to allocate from the pseudo-swap area.
    As swap is reserved for a new region, if it falls within pseudo-swap, then its
    pages are not reserved; instead they are allocated right form the start. In either
    case, this has the same net effect on the reservation limit but the dynamics of
    this region with respect to vhand are quite different.


    The mechanics of pseudo-swap are that if a swap space cannot be reserved against
    the available physical swap during the creation of a memory region, then it is
    flagged as being preallocated in pseudo-swap (this is actually noted in the region''s
    pointing to the region). On the surface, this almost sounds logical! We need to
    make room in memory, so we move a page to swap, but if the swap page we move it
    to is in memory (pseudo-swap), we haven''t gained anything—we haven''t increased
    the freemem count. This is the case, but the important issue is that swap didn''t
    fail. We just didn''t accomplish the desired goal this time, so hopefully vhand
    will continue and try to steal a page with an actual reserved or allocated back-store
    page.


    Once we start allocating from pseudo-swap, in effect the number of pages available
    for paging in is reduced. If a page is mapped by a region that has been marked
    as a pseudo-swap region, then all attempts to swap one of its pages simply result
    in the page remaining where it is. Conceptually, the swap would be successful
    but at a net-sum-gain of zero as far as increasing the value of freemem is concerned.
    To avoid wasting vhand''s time, regions identified as containing pseudo-swap pages
    are not eligible for inclusion in the vhand algorithms. When agehand or stealhand
    points to the pregion of a pseudo-swap region, r_swapmem. it simply moves on to
    the next region in the chain.


    As pseudo-swap is allocated, it has the effect of reducing the number of physical
    pages that may be paged out in times of high memory pressure. A process lucky
    enough to have its pages in pseudo-swap regions will continue to operate with
    little impact because its pages are, in effect, locked in memory. But those processes
    resident in the remaining pages will suffer a performance hit because their pages
    must carry the extra burden of being at risk of being aged and stolen by the paging
    system.


    # Interpreting the Output of swapinfo


    If you run the swapinfo command and have pseudo-swap enabled, you will see a line
    that reports the amount of memory swap available and the amount currently in use.
    Don''t be surprised if pseudo-swap usage is reported even when no physical swap
    has been allocated. Since pseudo-swap is letting us cheat the limit, the system
    must be able to adjust this cheat as the kernel takes dynamic pages out or circulation,
    effectively reducing the available memory count. Therefore, the system reports
    these kernel-allocated pages as allocated pseudo-swap pages. This effectively
    reduces the swap reservation limit available and keeps the system from overcommitting
    its memory resource.


    Pseudo-swap works well for its intended purpose, but if you push it past the limits,
    you will have slower overall system performance—but everything will still run.
    Don''t be afraid of pseudo-swap, but make sure you understand its purpose.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# # Device Swap


    Device swap is dedicated physical or logical disk volumes. These raw volumes are
    configured for exclusive use by the swap system. If logical volumes are used,
    you should attempt to have only one swap space per physical disk controller. It
    is much better to have one large volume than two smaller ones sharing the same
    spindle.


    It is a common practice to also configure swap devices as dump devices; this may
    be done either through inclusion in the kernel''s "system" file when the kernel
    is being built or through lines placed in the /etc/fstab file. The use of the
    /etc/fstab file gives you more control and makes it easier to modify your configuration.
    If a swap area is added to /etc/fstab it may be activated by issuing the swapon
    -a command. If a swap area definition is being removed from /etc/fstab a system
    reboot is required to halt its use. There is no swapoff command for HP-UX.


    # # File System Swap


    As the name suggests, we may also allocate swap space from swap files reserved
    on mounted file systems. The swap files are sized in alignment with the swap chunk
    size (the swap chunk is the basic unit used to track swap in kernel data structures,
    we will discuss it in detail shortly) and may be dynamically allocated as needed.
    When a file system swap space is initialized, a minimum and maximum amount of
    space may be configured. A reserved free space limit for the file system may also
    be specified.


    Initialized file system swap appears as a directory named paging, which contains
    individual swap files. The swap file naming convention is somewhat interesting.
    The root of the name is the system''s hostname followed by a period (.) and the
    swap chunk number this file represents in the system''s swap table. While file
    system swap spaces are fully functional, they do present a couple of concerns.
    When a file system is 100 percent full, its performance becomes sluggish, and
    a file system with a paging directory and swap files may not be unmounted. If
    the host file system employs features such as VxFS logging, this could further
    impact swap performance. Keep these issues in mind before deciding to use this
    feature.


    It is entirely possible to allocate file system swap on a remotely mounted Network
    File System (NFS), but this is generally not a good idea. The extra overhead incurred
    in the network combined with the stateless nature of an NFS mount makes for very
    bad chemistry! Besides, the NFS server''s administrator may not appreciate your
    chewing up their disk space to satisfy your swap requirements (such connections
    are readily apparent, and with the naming convention used, it is a simple matter
    to determine which remote host has configured the remote swap).


    # # Swap Priority


    Both types of swap, device and file system, may be assigned a priority in the
    range of 0 to 10. Priority 0 devices are used first, and 10 are used last. The
    primary boot swap device is assigned a'
