    \ approach was covered in Chapter 3, “The Kernel: Basic Organization.”\n\nOne\
    \ thing to note is that on a system with memory windows enabled, the basic algorithm\
    \ for allocation of shared objects is modified slightly. Since there is only one\
    \ truly global quadrant now (Q4) and it is slightly less than 75 percent available\
    \ (remember the gateway page and the 256 MB of I/O space mapped here), shared\
    \ library space comes at a slightly higher premium.\n\nFor a non-memory windowed\
    \ system, the allocation routine for shared objects is as follows:\n\n+   1. \
    \ Try finding space for the object in **Q4** (regardless of object type).\n+ \
