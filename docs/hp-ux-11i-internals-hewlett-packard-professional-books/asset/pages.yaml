    # Static Lists (Static Tables)


    The kernel often needs to maintain an extensive list of parameters related to
    some data structure or managed resource. The simplest way to store this type of
    data is to create an ordered, static list of the attributes of each member of
    the list.


    Each data structure is defined according to the individual pieces of data assigned
