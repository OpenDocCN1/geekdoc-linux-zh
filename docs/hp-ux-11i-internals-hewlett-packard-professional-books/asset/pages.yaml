  md: '# Signal Delivery


    signal to a particular thread within the process. Signal delivery is further complicated
    because the interface to the kill() system call is complicated—a pretty good feat
    for a system call with only two arguments.


    The kill() system call is the way a process sends a signal. The first argument
    is the PID of the process to which the signal should be sent, and the second argument
    is the number of the signal to send. The complication comes from the PID argument,
    which can take on values other than an actual PID. If the specified PID is zero,
    the signal is sent to all processes in the same process group as the process sending
    the signal. If PID is -1 and the user is not root, the signal is sent to all processes
    belonging to the user. If the PID is -1 and the user is root, the signal is sent
    to all processes other than system processes. If the PID is the constant KILL_ALL_OTHERS
    (defined in /usr/include/sys/signal.h), the behavior is similar to the case where
    PID is -1 except that the signal is not sent to the sending process. Finally,
    if PID is negative but not -1 or KILL_ALL_OTHERS, the signal is sent to all processes
    whose process group is the absolute value of PID. Table 14-1 summarizes the various
    actions of kill().


    # Table 14-1 Actions of the kill() System Call


    | PID | Effective UID | Signal sent to |

    | :--- | :--- | :--- |

    | >0 | Any | Specific process |

    | 0 | Any | All processes in current process group |

    | -1 | Root | All processes |

    | -1 | Nonroot | All processes with same UID |

    | KILL_ALL_OTHERS | Root | All processes except sender |

    | KILL_ALL_OTHERS | Nonroot | All processes with same UID except for the sending
    process |

    | <0 | Any | Process group \|PID |


    The first thing the kill() kernel function has to do is validate the arguments
    and sort out where the signal should be delivered. kill() then calls kill1() and
    passes it the signal number, the process group or process to signal, a flag indicating
    whether the signal is going to a group or a single process, and a flag indicating
    whether or not this is a “kill all” signal.


    The job of kill1() is to interpret the arguments from kill() and then call signalx()
    for each process that should be sent the signal. Depending on the arguments, this
    could mean going through the process group hash to find all processes in a group,
    or it could mean looping through all processes looking for the correct ones.


    There is also a second system call, which provides a means of initiating a signal:
    sigqueue(). sigqueue() does not have the broadcasting functionality that kill()
    has—the PID passed to sigqueue() must be a valid PID, and only that process receives
    the signal. However, sigqueue() does have the ability to send a value along with
    the signal. This value'
