- pgno: 439
  md: '> *“A good, quality text for system developers, device driver developers, kernel
    developers, compiler developers and techie who just want to learn more.”*

    > *—Glen S. Rosen, Professional Software Developer*


    > *“The right way to introduce readers to HP-UX internals.”*

    > *—Stanislav Moravec, Global Solutions Engineering (GSE) Engineer, HP-UX Kernel
    Team*


    # hp-ux 11i internals


    HP-UX under the hood: practical insight for optimization and troubleshooting


    chris cooper · chris moore


    To maximize the performance, efficiency, and reliability of your HP-UX system,
    you need to know what''s going on under the hood. HP-UX 11i Internals goes beyond
    generic UNIX internals, showing exactly how HP-UX works in PA-RISC environments.


    Two HP insiders systematically illuminate HP-UX kernel data structures and algorithms
    for memory management, process and thread scheduling, I/O control, files and file
    systems, resource management, and more. They focus on HP-UX 11i version 1.0, while
    also offering valuable insight for those using earlier versions.


    +   *   PA-RISC architecture: register set, virtual memory, key instructions,
    and procedure calling conventions

    +   *   HP-UX kernel organization: hardware-dependent and independent data structures

    +   *   Process and thread management: proc tables, memory management, scheduling,
    and the complete process/thread lifecycle

    +   *   System-wide memory resources: allocation and mapping to physical memory

    +   *   HP-UX paging and swapping

    +   *   Files and filesystems

    +   *   I/O and device management

    +   *   Logical Volume Management (LVM) HP-UX Multiprocessing: challenges, data
    structures, and interfaces

    +   *   Kernel communication services

    +   *   Signaling in complex thread environments

    +   *   System initialization, from vmunix to init: running HP-UX on diverse platforms


    Whether you administer HP-UX, tune it, troubleshoot it, or write kernel modules
    for it, you''ll find HP-UX 11i Internals indispensable.


    CHRIS COOPER, HP Senior Education Consultant, is a 19-year veteran with Hewlett-Packard
    Education Services. He has spent most of his HP career developing and delivering
    courses on programming, system administration, O/S internals, and networking.
    He has also served as a solution architect and consultant.


    CHRIS MOORE, Expert Center Engineer for HP''s Global Solutions Engineering team,
    specializes in analyzing system core dumps and identifying the causes of failures.
    He teaches classes on First Pass Dump Analysis inside and outside HP.


    $59.99 U.S.    $86.99 Canada

    Prentice Hall

    Upper Saddle River, NJ 07458

