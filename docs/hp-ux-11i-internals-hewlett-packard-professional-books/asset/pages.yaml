  md: 'There are also functions for canceling a timeout or for finding timeouts. The
    `untimeout()` function is passed a function pointer and an argument, just like
    the first two arguments to `timeout()`. If a timeout is registered for that function
    and that argument, then the timeout is cancelled and the return value will be
