  md: '# The fork() System Call Mechanics


    After entering fork1(), calls are made to obtain unique process and thread identification
    numbers. The current release of HP-UX reserves pid 0 through 7 for system use
    (0 for the swapper, 1 for init, 2 for page-out, 3 for staddaemon, 4 for the unhash
    daemon, 5 for netisr, 6 for the socket registration daemon, and 7 for commit).
    Thread identification numbers are unique within the scope of the kernel, and in
    a similar manner tids 0 to 7 are reserved for the system threads associated with
    the first eight system processes.


    > **NOTE** In the future, HP-UX may be modified to allow each process to start
    numbering its threads with kt_tid = 0, but for now all threads have a unique tid.


    Once we have a unique process and thread ID, we allocate the process table and
    thread table structures. Kernel routines check for available structures by following
    the freeproc_list and freektthread pointers. Although both of these structures
    are currently maintained as dynamic lists, the current implementation does not
    return unused process and thread structures to the kernel memory arenas; instead
    the structures are returned to the appropriate free list when their process or
    thread is discontinued.


    These free lists maintain a kind of high-water mark for structure utilization
    and save time when the kernel is asked to find new process or thread structures.
    If a free list is empty and we haven’t exceeded the respective kernel parameter
    nproc or nrktthread (the tunable maximums), the kernel memory allocator is asked
    to provide space for the new structure.


    As our new structures are allocated, they are initialized and set to the idle
    state. The newly allocated proc and kthread structures are linked together and
    attached to a variety of hash chains.


    +   * tidhash[] links kthread structures to chains based on the tid.

    +   * pidhash[] links proc structures to chains based on the pid.

    +   * uidhash[] links proc structures to chains based on the UID.

    +   * sidhash[] links proc structures to chains based on the session ID.


    These hashtables provide quick access to the process and thread structures based
    on common attributes. Once this work is completed, the process and thread table
    entries are linked to their appropriate active lists.


    Now switch() is called to pass control to the kernel routine newproc(). Before
    we continue with the creation of our new process, a sanity check is made checking
    the thread state of the new child’s kthread structure. If it is anything other
    than kt_stat=TSIDL, then the kernel panics, as we shouldn’t be here under any
    other circumstance. Assuming we pass this test, the child’s proc and kthread structures
    inherit basic data from the parent’s environment, such as the UID and GID. We
    reload the child’s scheduling and usage counters, and temporarily'
