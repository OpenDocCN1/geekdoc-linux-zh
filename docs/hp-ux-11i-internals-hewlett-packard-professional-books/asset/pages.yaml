  md: 'If we are still unsuccessful, the thread blocks until a buffer is available.


    An interesting observation is that items cached in the buffer cache don’t behave
    like items in most other caches. When a buffer is involved in an I/O operation,
    it is `B_BUSY`. The rest of the time, it is placed on a free list. In this manner
    the more a buffer is referenced, the less its chances are of being reallocated.
    If the cache is not busy, a buffer may persist for quite some time following its
    use, if another process comes along requesting the data, it may be pleasantly
    surprised to find that it is already in the cache and may be accessed logically.


    A fourth queue, `BQ_SENDFILE`, is used to list transitive buffers in use by kernel
    routine `sendfile()`.


    # Bigger Isn’t Always Better


    The time required to search the hash chain is offset by the fact that a logical
    read or write is several orders of magnitude faster than a physical transaction.
    The greater the “hit rate” for data in the cache, the greater the payoff for this
    scheme. For files accessed in a sequential manner, the hit rate may exceed 90
    percent! Adjusting the size of the buffer cache may help to increase the hit rate,
    but caution should be used to make sure that the system has plenty of available
    memory and that increasing the buffer cache doesn’t cause an increase in the page-out
    rate, or the gains in the hit rate could be lost in the added overhead of *vhand*.


    Another concern is that if the buffer cache gets too large, then the added length
    of the hash chain requires more search time. At some point the payoff of caching
    may be diminished.


    Prior to HP-UX 11.11, the conventional wisdom was that the buffer cache should
    not exceed 0.5 GB. Recent modifications (HP-UX 11.11) to the hashtable mechanics
    suggest that sizes in the 1-GB to 2-GB range may be considered


    # The Directory Name Lookup Cache, DNLC


    The final component of the file system we examine in this chapter is the directory
    name lookup cache, or DNLC (Figure 8-19). Just as the kernel maintains caches
    for data blocks and inodes for improved performance, it also maintains a cache
    of recently referenced pathnames.


    We have seen how a user-supplied pathname is processed by the kernel through the
    VFS. If we could skip past a majority of the smoke-and-mirror translation tasks,
    we could improve the time required to open a file descriptor.'
