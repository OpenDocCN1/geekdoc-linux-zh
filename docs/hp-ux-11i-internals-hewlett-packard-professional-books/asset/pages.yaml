    # Getting Data Type Information


    `q4`’s strength lies in its awareness of data structures. Unlike `adb`, which
    requires working with raw data in memory, `q4` can display complex kernel data
    structures in a format that is easy to read.


    We can look at what is in a kernel data structure with the `fields` command. This
    command takes a struct, union, or type as an argument and displays the members
    of the structure. For example, to see what the fields are in a `spinlock` structure,
    we would type


    ```q4> fields struct lock```


    | OFFSET | SIZE | FLAVOR | NAME |

    | bytes +bits | bytes +bits | | |

    |---|---|---|---|

    | 0 0 | 8 | 0 u_long | sl_lock |

    | 8 0 | 8 | 0 u_long | sl_owner |

    | 16 0 | 8 | 0 * | sl_name_ptr |

    | 24 0 | 2 | 0 u_short | sl_flag |

    | 26 0 | 2 | 0 u_short | sl_next_cpu |

    | 28 0 | 4 | 0 char[4] | sl_pad |


    `q4` tells us the offset of each member in the structure, the member’s size, its
    type, and its name. Notice that `q4` knows about pointers such as `sl_name_ptr`,
    but it doesn’t know what type they point to.


    When you specify a type in `q4`, you must include the `struct` or `union` keywords
    if the type is a structure or a union. In the above example we used `struct lock`
    to indicate that it was a structure. If the type has a typedef, you can use that
    instead, so we could also have said `fields lock_t`.


    # Loading a Structure into a Pile


    The basic unit that `q4` works with is called a `pile`. A pile is simply an array
    of structures. You create a pile with `q4`’s `load` command. The `load` command
