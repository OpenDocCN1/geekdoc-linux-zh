- pgno: 280
  md: '# # The Process Life Cycle, Cradle to Grave


    So far we have discussed the underlying PA-RISC hardware and many of the various
    kernel data structures that make up the HP-UX operating system. The point of view
    of our discussions has switched between that of the kernel and that of a process.
    We now have a broad enough perspective to examine the life cycle of a system process
    from cradle to grave.


    We start with the birth of a process, which is the result of a system call to
    either fork() or vfork() and requires the establishment of a unique process table
    entry and the creation of the process''s first thread. Then we examine the tasks
    performed by the kernel in the creation of the new process environment, including
    the creation of new memory regions and/or the attachment to existing shareable
    ones. Our study concludes with a discussion of the termination of a process, including
    breaking reference links, deconstruction of system resources, and the important
    role played by the parent process in the acknowledgment of the death-of-child
    signal. We also examine the mechanics of shared memory objects in greater depth.


    # ## The Birth of a Process


    The UNIX operating environment presents a special challenge when it comes to starting
    a new process. The only way for a new process to be created is for an existing
    process to ask the system to make a copy, a complete “clone” of the process environment
    (see Figure 9-1). A parent process is said to fork a “child” process: this is
    the computer equivalent of cellular mitosis in living organisms.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_281_0.png)


    **Figure 9-1 Parent Creates a Child**


    Once the fork is completed, there are two essentially identical process environments
    under kernel control. They have the same process logical memory view, identical
    file descriptors (to facilitate features such as pipes and I/O redirection), and
    they map the same shared memory objects. The only notable differences are that
    the new process has a unique process ID (`p_pid` in its proc structure) and its
    own virtual memory view, and that all of its scheduling-related parameters, performance
    counters, and pending signal counts have been initialized.


    Both the parent and child share the same execution trace and return from the same
    system call, but they have different return values passed to them. In this manner,
    each process can determine its role.


    A parent may create any number of identical copies of itself through fork calls,
    which may be desirable in the case of a system daemon wishing to create a number
    of clones to handle individual client requests. Since there is an endless variety
    of programs we may wish to run, a process needs a way to morph itself into a different
    process—changing its stripes, so to speak. To this end, another call is key in
    process creation: once a child process has been created and has determined that
    its function is to usher in a new process image, it places the `exec()` system
    call.


    When the `exec()` call is made, the kernel is asked to change out one process
    logical view for another while maintaining its kernel-resident run environment
    and basic identity. To put it another way, the kernel structures that make a process
    unique, are required for its management, and contain its environmental credentials
    are preserved, but all those directly associated with the current process''s text
    and data are removed. The kernel then rebuilds the logical view in accordance
    with the new process''s requirements (as defined in its executable program file).
    In effect, the kernel waves a magic wand and changes one process into another!


    As the work of a process is finished, one of its threads must make one final system
    call to `exit()`. The kernel then starts the termination process. It is at this
    time that an interesting com-'
  merge: -1
