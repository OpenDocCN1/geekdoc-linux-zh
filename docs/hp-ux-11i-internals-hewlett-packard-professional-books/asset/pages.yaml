  md: '# Copy-on-Write, First Read Access from a Child


    If the first access to the page is by a child, a tlb fault occurs, no pde entry
    will exist (the child was placed in its own space, and its virtual page numbers
    have not been mapped in the pdir), and the kernel page fault handler is called
    next.


    This handler determines the faulting thread''s identity and follows pointers from
    its kthread structure to the pga structure to the vpa to the pregion list. The
    preregions are searched (using their skiplist links) to find the one containing
    the faulting virtual page. Finally, we calculate the page offset within the region
    and search the b-tree to locate the vfda/dbc data for the faulted page. This search
    will reveal a valid vfd entry with pg_cw=1.


    Since this is a first access, the kernel also needs to add an alias entry to the
    pfn_to_virt table entry for this physical page before we continue. In this manner,
    we postpone the creation of the alias links until it is absolutely necessary.
    We also make an entry in the pdir for the new virtual page number. If the pde
    pointed to by the initial hash for the new virtual page is not available and we
    have to link to a sparse pde, we allocate it from the aa_pdireelist.


    At this point the instruction is retried, but since the tlb has not been updated,
    it will fault. The handler finds the new valid pde in the pdir and uses it to
    update the tlb, setting the copy-on-write access bit in the process. We try one
