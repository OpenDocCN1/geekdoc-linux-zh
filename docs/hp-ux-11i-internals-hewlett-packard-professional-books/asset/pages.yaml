  md: 'cesses in and out of play, it must adjust entries in this table accordingly.
    Figure 6-3 demonstrates how the hardware''s page directory, or pd ir, is also
    known to the kernel as the hashtable.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_185_0.png)


    # **Figure 6-3 How the Kernel Views the pd ir**


    The processor populates the hashtable (htbl/pdir) with page data entries (pde),
    which contain a variety of status bits, the current virtual address, and the current
    physical address of a page (see Figure 6-4). The kernel references and maintains
    this structure as a table of hashed page data entries (hpd e on narrow systems
    and hpde2_0 on wide systems).


    As the virtual map is huge in comparison to the physical map, it would be impractical
    to size it large enough for each virtual page to have its own pde . That''s one
    of the reasons we utilize a hashtable. The trick then is to size the table large
    enough to minimize the occurrence of two virtual addresses hashing to the same
    entry yet small enough to avoid wasting physical memory.


    The basic approach is to size the hashtable in relationship to the number of translations
    the system is expected to manage at any one time. The simple answer would be to
    set it to the number of physical pages configured into the system, but this doesn''t
    factor in all the addresses for which translations may be needed. Don''t forget
    that PA-RISC processors use a memory-mapped I/O approach; these pseudo-memory
    pages may also require the creation of virtual translations. The size is determined
    in the following way:


    +   * The total number of pages in physical memory is stored in the kernel parameter
    npdir .'
