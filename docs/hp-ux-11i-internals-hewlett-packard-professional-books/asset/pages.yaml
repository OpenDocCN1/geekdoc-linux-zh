    # Address Swizzling


    Address swizzling is the process of converting a 32-bit address to a 64-bit address.
    When a 32-bit application is running on a 64-bit kernel, any addresses passed
    to the kernel must be swizzled to 64-bits. This process simply involves copying
    the upper 2 bits of the 32-bit address into the upper 2 bits of the 64-bit address,
    zeroing out the next 32 bits of the 64-bit address, and copying the lower 30 bits
    of the 32-bit address into the lower 30 bits of the 64-bit address. See Figure
    1-7.


    This process extends the 32-bit value to a 64-bit value while maintaining the
    correct quadrant. Note that this happens only for addresses, not for arithmetic
    values, which implies that the kernel must know that a value passed to it is meant
    to be an address.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_51_0.png)


