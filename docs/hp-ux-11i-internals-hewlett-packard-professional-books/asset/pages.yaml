- pgno: 282
  md: 'munication takes place between the kernel and the parent process of the process
    that is being deconstructed. When a process calls `exit()`, the kernel notifies
    the parent of the process of the impending death of its child. Before the kernel
    may complete the deconstruction and cleanup of the child’s system resources, the
    parent process must acknowledge receipt of the kernel’s signal and respond appropriately.
    Failure to do so results in the child process remaining in limbo and becoming
    what is commonly called a *zombie* process. Most versions of UNIX label a process
    in this state as *defunct* (political correctness rears its ugly head again—we
    wouldn’t want to offend the undead!).


    Before we explore each of these system calls in detail, let’s consider a simple
    parent–child scenario.


    # ## A Simple Scenario


    Consider the simple case of a user running a POSIX shell and issuing the command:


    ```

    `$ more /etc/hosts`

    ```


    In the beginning, we have a process environment for the initial POSIX shell program
    (`pid` = 100). The resulting child (`pid` = 101) will become a run environment
    for the *more* program. Let’s break it down into specific actions:


    +   - The shell must parse the line and isolate the first argument.

    +   - The argument must be checked against the shell’s list of intrinsic shell
    keywords, aliases, and function names.

    +   - Assuming no match, the shell must search for an executable file that matches
    the command name; the contents of the shell’s *PATH* variable tells it where and
    in what order to conduct the search.

    +   - Once the executable has been located, its access and permissions are checked.
    If suitable, then the parent shell creates a clone of itself using either a `fork()`
    or `vfork()` system call.

    +   - In the case of a typical interactive shell, the parent process requests
    that it be put to sleep and awaken when the child process requests an `exit()`.
    This is commonly called running the command in the foreground and is accomplished
    by the parent process making a `wait()` system call with the appropriate arguments
    immediately upon the return from the fork call.

    +   - The child process calls `exec()` immediately upon return from the fork call.
    It requests that its process environment be *replaced* by that of the *more* program
    and that execution continue with the first executable line of the *more* program
    code.

    +   - Once the child completes its task, it calls `exit()`, resulting in the parent
    being notified of the death of the child, and since the parent is currently waiting
    on just such a signal, it will wake and proceed.'
