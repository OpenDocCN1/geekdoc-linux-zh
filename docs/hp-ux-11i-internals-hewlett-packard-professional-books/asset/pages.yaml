  md: '# Stack Usage in Wide Mode


    Figure 2-2 shows the stack usage for a wide-mode procedure call. Recall that in
    wide mode all our registers are 64 bits wide. Each entry on the stack is also
    treated as a 64-bit doubleword.


    The frame marker for wide mode is only two doublewords long to allow for storing
    two values. The return pointer is stored at SP-0x10. SP-0x08 is reserved for storing
    the previous stack pointer if needed.


    After the frame marker, eight doublewords are allocated to store eight arguments.
    Additional space may be allocated for arguments if there are more than eight.
    Unlike in narrow mode, these are stored at *increasing* addresses, not decreasing
    addresses. In addition, arguments are no longer addressed relative to the stack
    pointer. Instead, GR29 is set to point to the address of the ninth argument (even
    if there are fewer than nine arguments, the pointer is set to point to the doubleword
    after the location reserved for the eighth argument).


    After the area for arguments are optional areas to accommodate stack growth for
    allocated memory, local storage, and callee save registers.


