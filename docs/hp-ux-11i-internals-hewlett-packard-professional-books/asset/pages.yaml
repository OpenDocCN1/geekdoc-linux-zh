- pgno: 200
  md: '```

    0000 DBD_NONE There is no copy of this page on the disk

    0001 DBD_FSTORE A copy of the page is on the front store

    0010 DBD_BSTORE A copy of the page is on the back store

    0011 DBD_DZERO This will be a “demand zero” page and will be filled with zeros
    when it is first requested

    0100 DBD_DFILL The page is of type “demand fill.” When first allocated the page
    will not be initially filled with zeros (this is only used during the initialization
    of pages allocated for use by a UAREA)

    0101 DBD_HOLE This page will be used to map a sparse memory-mapped file. A read
    request will return a zero, but a write will cause a fresh page to be allocated
    and zero-filled

    0 0 0 3 u_int dbd_type

    The remaining 28 bits contain pointer(s) to the page’s image

    on either a front store or back store.

    0 3 3 5 u_int dbd_data

    ```


    The primary job of the **region** is to organize the **vfd|dbd** data in an easy-to-search
    manner. It would be very easy to place the **vfd|dbd**’s in an array and use the
    relative page number as an index into the array. This would be a suitable solution
    if all regions were of a similar size, but this is not the case.


    Previously, we learned that there are several types of process **precisions**,
    and in a case of guilt by association, there are several varieties of regions.
    The size of these regions varies greatly, from a mere 4 to 8 pages for a **uarea**
    to literally millions of pages in a large wide process data region. Another challenge
    is that some regions may need to grow as the process’s threads execute: think
    of the **malloc**() call or a memory-mapped file being written to.


    Now we see the challenge: design a data base that may be easily allocated and
    deallocated from kernel memory space, that handles very small and very large data
    sets, that may be expanded on the fly, and that provides a low overhead searching
    algorithm. Easy, right?


    The HP-UX kernel employs a design called the **b-tree**. Let’s take a look.


    # ## The b-tree


    We discussed the generic **b-tree** in Chapter 3, “The Kernel: Basic Organization,”
    and now we need to apply the specifics used to map the **vfd|dbd** data structures.
    Figure 6-10 shows the overall design of the memory management **b-tree** and its
    relationship to a **region** structure.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_201_0.png)


    Figure 6-10 The b-tree


    The base of the tree is its **broot**. It sets the rules for the tree''s usage
    and directs us to the first level **bnode** in the tree. This first **bnode**
    is sometimes called the root **bnode** — try not to confuse the two structure
    names.


    The **bnode** structures are ranked and ordered according to the tree''s depth
    (defined in the **broot**) and form the tree''s **branches**. To continue with
    the tree model, the **chunk** structures could be thought of as the leaves on
    the branches. Each chunk contains **vfd** | **dbd** structure pairs; these **vfd**
    | **dbds** are the fruit of a successful search of the tree.


    # Broot, Bnodes, and Chunks


    Let''s examine the b-tree structures in Listings 6.9 and 6.10.


    Listing 6.9 q4> fields struct broot


