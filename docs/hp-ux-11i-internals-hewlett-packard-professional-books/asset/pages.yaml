  md: 'Let''s check to see how observant you were of the annotations. Did you notice
    the size (in bits) of the virtual page number stored in the *hpde*? It is only
    15 bits wide, which presents a challenge, since there are 2^20 virtual pages per
    space. The bits are noted to be the high-order 15 bits of the virtual page number.
    With this model, it seems that only one out of every 32 pages will be translatable
    by this table! There must be more to this story than meets the eye—and there is.
    To understand the secret of the missing five virtual page address bits, we need
    to examine the hashing algorithm being used by the hardware (and understood by
    the kernel).


    # The Kernel View: The Hashtable


    The name *pdir* is a bit of a throwback. Originally, HP-UX used an inverse page
    directory that mapped physical page numbers to virtual page numbers. This meant
    that while the size of the table was easy to determine (simply one entry for each
    page), searching for a specific virtual address was a lengthy process. To reduce
    search times, a hashed table of virtual addresses was created. In this format,
    a virtual page address is used to create a *hash table index* value. The index
    is then tested against a mask value to make sure the index doesn''t exceed the
    size of the hashtable, and the result is used as an offset into the *htbl* (or
    *htbl2_0*).


    The hashing algorithm varies according to the hardware width. For a narrow system,
    the routine is as follows:


    +   *   *pdhashl_1(*space* ,*offset*)* & (*mask*)

    +   *   We left-shift the space value by 5 bits.

    +   *   The offset is right-shifted by 12 bits (this is the byte offset into a
    page and as such is not part of the virtual page number).

    +   *   These two values are exclusively ORed to create the initial hashtable
    index.

    +   *   To assure that the index does not exceed the size of the hashtable, an
    AND operation is performed between the initial index value and the mask (the size
    of the table, a power of two).


    This is where we answer the question asked previously. By shifting the space value
    by 5 bits to the left, the last 5 bits of the virtual page number translate directly
    to the hashed index. Effectively this means that 32 sequential virtual page numbers
    are mapped in 32 consecutive *htbl1* entries.


    For a wide system,


    +   *   *pdhash2_0(*space* ,*offset*)* & (*mask*)

    +   *   *pdhash2_0* bit shifts the space value 10 bits to the right (recall from
    our discussion of the Global Virtual Address (GVA) formation in Chapter 2, "PA-RISC
    2.0 Architecture," that the lowest 10 bits of the space number are always set
    to 0).'
