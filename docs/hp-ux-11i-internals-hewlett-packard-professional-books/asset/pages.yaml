- pgno: 148
  md: "![](img/08b7d2492fc1415a694a5fb16a8fdeb3_148_0.png)\n\n# **Figure 5-4** Mapping\
    \ a Program to a Logical Space\n\nMost modern compilers divide the text (instruction\
    \ code) of a program into one object and program data into one or more additional\
    \ objects. HP PA-RISC systems follow certain defaults for the setting of access\
    \ rights and permissions depending upon which quadrant a page frame is mapped\
    \ into.\n\nNarrow executables and wide executables map objects in a different\
    \ manner. This change was necessitated by the desire to allow *narrow* and *wide*\
    \ processes running on the same machine to share data objects. To accomplish this\
    \ goal, it was necessary for wide processes to have **quadrant Q1** be allocated\
    \ for shared objects (after all, the entire logical space of a narrow process\
    \ fits easily into the first .01% of a wide process's **Q1**).\n\nFor a narrow\
    \ application, the defaults are as follows:\n\n+   **Q1** is shared read-only\
    \ access,  \n+   **Q2** is private read-write,  \n+   **Q3** is shared read-write,\
    \ and  \n+   **Q4** is shared read-write.\n\nFor a wide application,\n\n+   **Q1**\
    \ is shared read-write access,  \n+   **Q2** is shared read-only,  \n+   **Q3**\
    \ is private read-write, and  \n+   **Q4** is shared read-write."
  merge: -1
  img_proc: true
- pgno: 149
  md: 'As we mentioned, the compilers must be aware of these rules, but as with all
    rules, there may be exceptions!


    You may have noted that because of the implied restrictions controlling which
    program objects may be placed in which quadrants, there are systemwide limits
    to how large a program memory object may be. In general, a single object may not
    be larger than the quadrant to which it is mapped, and in many cases it must share
    the space with other objects. On a 64-bit system, this is not currently much of
    a concern, considering its current 4-TB hardware-implemented quadrant size, but
    for 32-bit applications with a 1 GB quadrant size, this has become a serious limiting
    factor to some applications.


    The size of a process''s private data quadrant may be a concern, and in some cases
    there are only 1 3/4 quadrants available for shared objects on the system, which
    has been a limiting factor to the applications we wish to run (remember that in
    Q4 on a narrow memory map, the last 256 MB are reserved for memory-mapped I/O).
    There are several tricks of the trade that may be implemented to address some
    of the limits. Let''s make some magic!


    # SHARE\_MAGIC, EXEC\_MAGIC, and SHMEM\_MAGIC


    The first compiler directives we consider are SHARE\_MAGIC, EXEC\_MAGIC. The first
    is the default for HP-UX compilers, and the second allows a program to increase
    the amount of private memory space it may use. Figure 5-5 gives us a visual comparison
    of the logical mapping for these options.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_149_0.png)'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'These options are only for use by narrow programs (running on either a 32-bit
    or a 64-bit kernel and hardware platform).


    # SHARE_MAGIC


    The SHARE_MAGIC directive is the system default and requires no special parameter
    to be passed to the compiler or linking-loader. The term share as used here refers
    to the fact the executable image should be built with the code and data separated
    into different objects. This is necessary if you want to allow multiple copies
    of the same program to be resident on the system and have them share access to
    a common text object, reducing overall system memory utilization. This is often
    called a multiprocess shared-code access model and is implemented on most modern
    operating systems.


    In this model, the various memory objects are assigned to the quadrants according
    to the default access settings. A program''s data and possibly a null-dereference
    page are placed in Q1. Q2 gets, starting from the lowest offset, the process''s
    private data, comprised of the program''s initialized data, uninitialized data
    (or BSS, an old mainframe term: Block Store by Symbol), and the beginning of the
    process''s heap space (this is where additional data storage may be allocated
    to a running process using calls such as malloc( )). The uarea is located near
    the highest offset to Q2, and working back toward the private data area, we have
    the process''s stack, which contains a "red zone" and room for the process''s
    private stack area. Next, we find any private memory mapped objects. The heap
    grows up, and the maps grow down until there is no space left. The red zone we
    mentioned is a type of buffer area at the high-address end of the stack: this
    address space is off limits to the process. In the case of a stack overflow, the
    kernel must kill the process, and the red zone space is used by the signal code
    during the kill procedure.


    Several tunable kernel parameters control the size of objects located in Q1 and
    Q2.


    +   - maxtsiz limits a 32-bit process''s text object; defaults to 16384 pages.

    +   - maxtsiz_64bit limits a 64-bit process''s text object; defaults to 16384
    pages.

    +   - maxdsiz limits a 32-bit process''s private data object; defaults to 65536
    pages.

    +   - maxdsiz_64bit limits a 64-bit process''s private data object; defaults to
    65536 pages.

    +   - maxssiz limits a 32-bit process''s stack object; defaults to 2048 pages.

    +   - maxssiz_64bit limits a 64-bit process''s stack object; defaults to 2048
    pages.


    As you can see, these default values are fairly conservative. The reason for setting
    these limits along with other tunables is to give the kernel a best guess/mode
    as to the amount of space it will need to allocate for its internal data tables.
    It can always allocate more pages as needed, but it is nice to start with a reasonable
    amount at system boot.


    The Q4 and Q3 quadrants are used for shared library text, shared memory, shared
    memory-mapped files, and other shared objects. The Q4 space is allocated first,
    then Q3 (this order was established with the release HP-UX 10.0; in previous versions
    Q3 was used first, then Q4).'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Alright, you can''t fit your process data in the single quadrant allocated,
    then perhaps you need a little executive magic!


    # EXEC_MAGIC


    The `EXEC_MAGIC` directive changes things a bit. The first thing we notice is
    that the process''s private data starts immediately after the end of its text.
    In most cases, a program does not need an entire quadrant for its text object
    (and I certainly wouldn''t want to be around code, when you tried to print out
    the source code for a program that produced a gigabyte of machine code, or when
    you tried to debug it). As a result, most processes have a considerable amount
    of unused space in their first quadrant. The `EXEC_MAGIC` directive allows a process
    to make use of this space. In general, this increases the amount of private data
    space to approximately 1.9 GB (depending on the size of the *text* object, *stack*,
    and *varea*). An interesting side effect of this option is that the process''s
    text is now writable; if you want to try your hand at self-modifying code (definitely
    not for the casual programmer!), this is one method to explore.


    To solve this dilemma, Hewlett-Packard introduced the practice of virtual address
    aliasing with HP-UX 10.0. Physical text page frames of an `EXEC_MAGIC` process
    are mapped to two unique virtual addresses by the kernel. This allows multiple
    instances of the same program to share access to common physical page frames.
    Because these pages are mapped to separate “private” virtual quadrants, there
    must be a means to avoid corruption if one of the process threads tries to write
    to the page frame. This issue is handled with a technique called *read-only aliasing*.
    If any of the processes sharing the physical page frame attempts a write, then
    a kernel mechanism called *copy-on-write* simply creates a duplicate copy of the
    physical page frame and relinks the writer''s virtual page to it. In this manner,
    as long as we are only reading from the page, data corruption is avoided and we
    can enjoy the advantage of sharing text pages, thus reducing overall memory pressure
    (always a good thing!). There is a price to pay for this action. We are now placing
    private data in Q1, and we will need to change access permissions to private-read-write.
    Prior to HP-UX 10.0, this meant that programs compiled with this directive were
    not allowed to run in a shared text mode: two instances of the same program required
    two copies of the text to be placed in memory.


    In the case of `EXEC_MAGIC`, the four quadrants could be mapped to four different
    spaces (their access controlled by the four space registers, *sr4* through *sr7*).
    For an `EXEC_MAGIC` process, **Q1** and **Q2** must reside in the same virtual
    space (*sr4* and *sr5* will have the same value), allowing the data object to
    cross the Q1/Q2 boundary with no discontinuity. Quadrants **Q3** and **Q4** may
    each be mapped to different spaces.


    What if your size problem isn''t with the private data space; instead, you simply
    need more shareable memory. `SHMEM_MAGIC` may be just the trick you are looking
    for.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '**SHMEM\_MAGIC**


    The SHMEM\_MAGIC directive is very similar to the EXEC\_MAGIC in that it combines
    text and data objects in the process’s Q1. The big difference is that the Q2 does
    not contain private data but instead has been turned over for use for additional
    shared objects. It would do very little good to run only one process compiled
    with this option——after all, who could it share this new space with?


    Again noting Figure 5-5, we see that with this option all four quadrants may be
    mapped to different virtual spaces. In general this option is used in conjunction
    with another relatively new option, Memory Windows. We examine memory windows
    in just a moment.


    # More Magic


    In addition to the three magic directives we have mentioned, there are several
    others. Compilers designed for HP-UX also understand DEMAND\_MAGIC and SHL\_MAGIC
    directives. Both of these are enabled by default and deal with the issue of demand
    page loading and the use of shared libraries located and linked at runtime. We
    also have RELOC\_MAGIC for loading a program in relocatable-only mode, AR\_MAGIC
    for linking in archive libraries, and DL\_MAGIC for the inclusion of dynamic libraries.
    This concludes our magic lesson for now. Let’s move on to memory windows.


    # Memory Windows


    The memory windowing system was introduced to HP-UX 11.0 as a patch (PHKL\_13810
    and PHCO\_13811) and is part of the HP-UX 11.1 release. Figure 5-6 shows a greatly
    simplified example of a system VAS with memory windows implemented. To enable
    memory windows on a system, the kernel-tunable parameter max\_mem\_window must
    be set to the desired number of user windows. The kernel adds 1 to this value
    and initializes a memory-window array structure during system boot.


    **NOTE** Memory windows may only be implemented for 32-bit narrow application
    memory mapping.


    The kernel pointer `*memWindows` directs us to an array of individual window data
    structures of type `vas_window`. Let’s take a look at this structure in Listing
    5.3.


    ```

    **Listing 5.3** `q4> fields struct vas_window`


    The first three fields are used to map quadrant Q2 (in the case of SHMEM\_MAGIC)

