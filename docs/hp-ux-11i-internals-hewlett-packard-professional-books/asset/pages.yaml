  md: 'Now we can use proc1 instead of the pile number if we want to recall the pile.
    This can be really handy if you have a lot of piles that are all the same data
    type—it can be hard to tell them apart.


    Another handy pair of commands is keep and discard. For both of these commands,
    the argument is an expression. A new pile is created that contains either only
    those structures for which the expression is true (keep) or only for those for
    which the expression is false (discard). As an example, let''s say we want to
    look at the process table entry for PID 1. We can recall the list of all processes
    we have in our stack, then keep just the one with p_pid equal to one:


    ```

