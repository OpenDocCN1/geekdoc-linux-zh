    If the lines of each message were not assigned sequential space on the message
    board, you could end up with the following mess!


    Beagle puppy

    Seeks lawn to mow

    House broken

    12-year-old boy

    Free to good home


    To avoid such a situation, a resource map could be employed to allocate sequential
    lines. Each entry in the resource map would point to the next block of available
    line(s) on the board.


