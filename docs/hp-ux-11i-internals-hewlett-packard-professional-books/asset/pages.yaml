- pgno: 175
  md: 'systems with multiple processor sets (psets), there is a unique POSIX run queue
    created for each pset.


    # SCHED_FIFO


    This policy schedules threads in a queue strictly according to time, when they
    were placed into the queue. First-in, first-out is the name of the game here.
    Once a thread gets the CPU, it keeps it until it requests a system call resulting
    in its blocking (being placed on a sleep queue) or until a thread of stronger
    priority preempts it. When a running thread is preempted, it is placed at the
    head of its queue. If it blocks on a system call upon wakeup, it is placed at
    the end of its queue.


    # SCHED_RR


    The SCHED_RR, or round-robin queuing policy, uses the system’s timeslice quantum
    and moves a thread to the end of its queue when its timeslice expires. If a thread
    operating under this policy is preempted, it resumes operation at the head of
    its queue.


    # SCHED_RR2


    This policy represents a round-robin scheduler with the difference that the timeslice
    may be adjusted differently for each queue—at least that was the intention. Current
    implementation allows this policy to be selected, but there is no kernel code
    to implement the per-queue timeslice quantum value; it simply uses the system
    timeslice quantum value. In effect, SCHED_RR and SCHED_RR2 both run in an identical
    manner.


    Some general housekeeping items need to be mentioned at this time. With the introduction
    of the POSIX real-time extension came the rt sched( ) system call and the command-line
    rtsched. This call, just like the rtprio( ) call, requires privileged group capabilities
    in order to be used (see set_priv_grp and get_priv_grp commands in the manual
    pages). To make things a bit easier, the rt sched call may be passed any of the
    valid scheduling policy names as an argument, and will implement the requested
    policy.


    The timeslice value kernel parameter may be set to 0, in which case the default
    value of 10 ticks is used, or the desired number of ticks may be set (use caution:
    in most cases this parameter should not be set lower than 5 or greater than 30—these
    are both extreme cases). Another interesting option is to set timeslice to -1;
    this will effectively turn round-robin scheduling off for the system. Again, we
    don’t recommend this for most configurations.


    # Run Queues


    We have used the term run queue frequently in this chapter. Let’s take a moment
    to understand what a run queue is, where it is located, and how it is implemented.


    The run queue does not exist as a single structure. It is built by linking together
    all runnable threads on the system to appropriate queue headers. Which queue header
    a runnable'
