- pgno: 38
  md: '# # PA-RISC 2.0 Architecture


    Before we dive into HP-UX itself, we should have a look at the underlying system
    architecture. The very nature of an operating system requires that it be aware
    of the architecture it''s running on. The operating system''s kernel insulates
    the user applications from the hardware, making the architecture mostly transparent
    to the applications. But the kernel itself has to work directly with the hardware
    and so has to be designed to run on a particular type of hardware.


    HP-UX has been implemented on a variety of platforms, among them the Motorola
    68000 family, HP''s PA-RISC family, and the new Itanium family. In this book we
    concentrate on the PA-RISC architecture. The 68000 versions of HP-UX are long
    obsolete, and the Itanium versions are new enough that there are few implementations
    in use. The vast majority of HP-UX systems are running on PA-RISC hardware.


    Why study architecture at all in a software book? The kernel has architecture-specific
    code for handling interruptions, dealing with I/O devices, managing multiprocessor
    issues, and for many other tasks. In fact, parts of the kernel are written in
    assembly language for performance reasons. Before we get into how the kernel works,
    it''s important to have at least a general idea of how the hardware works.


    We won''t get into every detail of the architecture. That''s covered thoroughly
    in *PA-RISC 2.0 Architecture* by Gerry Kane.¹ In this book, we cover just those
    implementation details that are critical to an understanding of the internals
    of HP-UX. In particular, we look at the general hardware building blocks, the
    registers that are available and how they are used, provisions for virtual memory
    addressing, and some of the assembly instructions that are important to the implementation
    of the kernel.


    > Gerry Kane, *PA-RISC 2.0 Architecture* (Pearson Education POD, 1995).'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'We also look a little at the differences between the PA-RISC 2.0 and PA-RISC
    1.1 architectures. PA-RISC 2.0 expanded the PA-RISC architecture to a 64-bit model
    and added many enhancements for improving system performance. Systems built on
    the PA-RISC 1.1 architecture run 32-bit kernels. A PA-RISC 2.0 system can run
    either a 32-bit or a 64-bit kernel. A 64-bit kernel in turn can run either 32-bit
    or 64-bit user applications.


    # ## RISC Architecture


    PA-RISC, as its name implies, is a RISC, or Reduced Instruction Set Computer,
    architecture. But there is more to RISC than just a smaller instruction set. There
    are several characteristics that are common to all RISC architectures, including
    PA-RISC, that make these systems fast and easy to implement. Among these are:


    +   - Fixed instruction size—All instructions are 32 bits wide.

    +   - Small number of addressing modes—PA-RISC has only three methods of specifying
    a memory address.

    +   - Simplified memory access—The only instructions that access memory are explicit
    loads and stores. Computational operations are done between registers.


    These characteristics make for a fast, simple hardware implementation. Performance
    gains can then be accomplished through pipelining and through optimization of
    code by compilers.


    The PA-RISC architecture also has many features not normally associated with RISC.
    The instruction set, while smaller than older CISC architectures, has many instructions
    designed specifically to streamline commonly executed sequences of instructions.
    In addition, the hardware is designed to speed up typically expensive instructions
    such as bit operations.


    # ## Hardware Modules


    Figure 1-1 shows a typical PA-RISC processor. The architecture provides for a
    translation lookaside buffer (TLB), which is used to assist in translating virtual
    addresses to physical addresses. The inclusion of a cache is optional, but most
    PA-RISC processors do have at least some amount of cache. The architecture also
    provides for assist processors such as a floating-point processor to assist in
    complex operations.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_40_0.png)


    # ## Central Processing Unit


    The CPU itself contains the system’s register set, control logic, and execution
    logic. The register set, discussed in detail below, is where all of the computation
    takes place in the processor. The only instructions that access memory are explicit
    load and store operations. Thus, to operate on a value, the value must be loaded,
    manipulated, then stored. Frequently used data is kept in registers to bypass
    the load and store operations. The CPU’s control logic is responsible for fetching
    and decoding instructions. The CPU can prefetch instructions, and multiple instructions
    are pipelined within the CPU for parallel execution. The execution logic performs
    the actual operations on the data. This section of the CPU consists of the arithmetic
    logic unit (ALU), shift and merge units, mask registers, and a variety of other
    hardware for executing the instructions.


    PA-RISC provides for four different privilege levels that determine what operations
    the CPU is permitted to perform and what data it can access. The HP-UX kernel
    uses only two of these privilege levels: 0 for kernel and 3 for user. The system
    checks access rights on a per-page basis. Each page of memory in the system has
    an Access Rights entry, which indicates privilege levels required to read, write,
    or execute that page. The system also provides for a gateway instruction, which
    is used for promotion from one privilege level to another. This instruction is'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'used by the kernel when transitioning from user mode to kernel mode. This process
    is discussed in detail in Chapter 3.


    # Translation Lookaside Buffer


    The TLB is used in translating virtual addresses to physical addresses. Each entry
    in the TLB holds a virtual page number, the corresponding physical page number,
    and the access rights for that particular page. The system may use separate TLBs
    for instructions (ITLB) and data (DTLB), or it may use a combined TLB.


    PA-RISC version 2.0 includes provisions for variable-sized pages. Prior to PA-RISC
    2.0 all pages were a fixed 4 KB. PA-RISC 2.0 can use pages ranging from 4 KB to
    64 MB. This allows for more efficient use of the TLB when very large data structures
    are used. A large data structure can be placed in a single large page and will
    use only one TLB entry rather than requiring several.


    When an instruction accesses a particular virtual page, that page is looked up
    in the TLB to find the corresponding physical address and the access rights. If
    a matching entry is not present, a *TLB miss* interruption is generated. The system
    must then look up the correct entry in the Page Directory (PDR), insert the entry
    into the TLB, then restart the instruction. The details of how this happens are
    covered in Chapter 6, “Managing Memory.”


    # Cache


    PA-RISC uses a visible cache architecture. The processor has instructions to explicitly
    manipulate the cache, flushing or invalidating cache entries where required. Systems
    can have separate instruction and data caches, or they may have a single combined
    cache.


    In order to have the required data in the cache whenever possible, the cache is
    capable of prefetching data and instructions. To determine which data should be
    fetched, the PA-RISC processor uses *branch prediction* to guess which way conditional
    branches will go. Compilers can code a prediction into branch instructions. For
    example, if a branch is used in a loop, and the loop will run for 100 iterations,
    then the end-of-loop branch will be taken 100 times, not taken just one time.
    The compiler can indicate to the processor that it is more likely that the branch
    is taken, and the cache prefetch circuitry can then prefetch the correct instructions.
    PA-RISC 2.0 also adds a *dynamic branch prediction* functionality. The processor
    keeps track of how many times a branch actually went the way that the compiler
    predicted. If the branch prediction indicator is wrong more than right, then the
    system starts prefetching the opposite of the way the branch prediction indicates.


    In a multiprocessor system, the cache must also be aware of the memory activity
    of other processors. This is called *cache coherence*. The cache circuitry continually
    monitors the system bus for load and store instructions from other processors.
    In this way, it will know if the data in the cache is no longer valid due to access
    from a different processor.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# ## Assist Processors


    The PA-RISC architecture provides for extensibility in the form of assist processors.
    Two kinds of assist processors are defined: special function units (SFUs) and
    coprocessors. An SFU is a hardware module that has direct access to the CPU''s
    general registers but operates outside of the CPU''s execution unit. Although
    the architecture defines how SFUs are to be implemented, none are currently used.
    A coprocessor is also an assist processor, but it is less closely coupled to the
    CPU. It has its own set of registers, and data must be explicitly passed to and
    from the coprocessor for processing.


    An understanding of the assist processors is not required for an understanding
    of the kernel, so we do not go into detail beyond this brief mention. Suffice
    it to say that PA-RISC processors do have a floating-point coprocessor, and if
    you find yourself looking at assembly code, you may occasionally see references
    to it.


    # # Registers


    The PA-RISC architecture provides for several sets of registers. Of particular
    interest to us are the general registers, space registers, and some of the control
    registers.


    # ## General Registers


    PA-RISC has 32 general purpose registers. In PA-RISC 2.0, these are 64-bit registers;
    prior to PA-RISC 2.0, these registers are 32 bits wide. The architecture itself
    defines specific uses for only a few of these registers:


    +   - GR0—Permanent zero. Reads from this register always return a zero. Writes
    to this register are discarded.


    +   - GR1—Target of ADDIL. When the ADD IMMEDIATE LONG (ADDIL) instruction is
    executed, the result is always placed in GR1. This register can also be used for
