    # ## An Example: Getting the urea of a Process


    Let''s look at an example that goes through several of these steps. In this example,
    we get the urea of a process, PID 2003. Because of the way structures are interconnected,
    there are many ways to do this, and some of them are quicker and easier than this
    example, but the idea here is to show a variety of g4 commands. Following are
    the steps we go through:


    +   - Load all processes.

    +   - Keep process 2003.

    +   - Get the VAS structure for the process from the p_vas pointer.

    +   - Using the VAS region list, load all regions for the process.

    +   - Keep the region that has a type of PT_UREA.

    +   - Print the space and offset of that region.

    +   - Load a struct user from that space and offset.


    ```

    ```

    g4> load struct proc from proc_list next p_fctpf max 10000

    loaded 150 struct proc as a linked list (stopped by null pointer)

    g4> keep p_pid == 2003

    kept 1 of 150 struct proc''s, discarded 149

    ```

