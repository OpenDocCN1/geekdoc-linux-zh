  md: 'Specifically, if the SA_SIGINFO flag is set, then the kernel must allocate
    memory in which to store signal information to pass to the signal handler. This
    is done first, before any locks are acquired, because it has to use MALLOC memory,
    and MALLOC might sleep if memory is not available. Next, if the signal being modified
    is SIGCLD, we obtain three locks: the MTPROC_REAP_LOCK, the systemwide sched_siglock
    spinlock, and the exit_lock spinlock for the current process. This is because
    SIGCLD changes modify the behavior taken when a child exits. The MTPROC_REAP_LOCK
    makes sure that the process isn’t currently being reaped; the sched_lock makes
    sure the scheduler can’t modify it; the exit_lock makes sure that it’s not currently
    trying to exit. Finally, we obtain the spinlock that controls the process structure:
    p->p_lock. Once all this is done, we’re back to sigaction().


    The actual setting and retrieving of the signal handler values is really pretty
    straightforward. If the user has passed a non-NULL pointer for the third argument
    to sigaction, indicating that he or she wants to get the current values, we just
    extract the handler and flag values from the proc structure (and its associated
    Process_Shared_Fields structure) and pass them back to the user. sigaction then
    calls sigsetget to set the new values, which again is pretty straightforward.
    The handler is copied to p->p_shared->p_signal[sig+1]. The mask is copied into
    p->p_shared->p_sighandmask [sig+1]. We then go through the flags value and copy
    each of the flags into its correct place — for most of the flags, this is a bit
    in p->p_shared.


    There are a few special cases in setsigvec(). The SA_NOCLOSESTOP and SA_NOCLDWAIT
    flags are looked at only if the signal value is SIGCLD. If the request is turning
    off the SA_SIGINFO flag, we go through each non-zombie child of the current process
    and delete the structure that is holding the siginfo data. If the action is being
    set to SIG_IGN, indicating that the user wants to ignore this signal, setsigvec()
    goes through all threads and removes any pending or blocked signals for this signal
    number.


    There are also bitfields in the proc structure that get updated at this point.
    p->p_sigignore is a ksigset_t that says which signals are ignored, and p->p_sigscatch
    is a ksigset_t that says which signals are being caught. Note that these are actually
    in the proc structure itself, not in the Process_Shared_Fields.


    Finally, after all this is done, sigaction() calls setsigvec_cleanup() to release
    any locks acquired in setsigvec_setup().


    We now have our signal handler set up — we saved off what signal the user is interested
    in, what he or she wants to do with that signal, and a set of flags and a mask
    that modify what happens when the signal arrives. We look in more detail at how
    these flags and masks are handled when we look at signal handling. But first,
    let’s look at how signals get delivered.


    # Signal Delivery


    Signal delivery became much more complicated with the advent of multithreaded
    processes. The kernel has to support the old paradigm of delivering a signal to
    a process as well as to deliver the'
