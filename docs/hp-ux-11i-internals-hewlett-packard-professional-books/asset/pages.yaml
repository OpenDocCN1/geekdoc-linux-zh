    # The System Call Stub


    System calls number in the hundreds and are made available to user threads by
    way of the system call library. These routines differ from conventional library
    routines in that they must first transition a user thread to a kernel thread in
    order to access kernel-resident subroutines. Execution access of code located
    on kernel-owned pages requires a privilege level of 0. User threads operate with
    a privilege level of 3; kernel threads operate at a level of 0. By necessity,
    the mechanism by which a thread''s privilege level is set is tightly controlled
    by the hardware and the kernel to prevent unauthorized use. A listing of available
    system calls and their symbolic name and number is provided by the file `/usr/include/sys/`*`syscall_define.h`*`
    on HP-UX systems.


