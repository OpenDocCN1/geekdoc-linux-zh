- pgno: 100
  md: '# The Skip List


    In the world of search algorithms, the skip list is a new kid on the block. Its
    use was first outlined in the 1990s in a paper prepared for the Communications
    of the Association for Computing Machinery (CACM) by William Pugh of the University
    of Maryland. For additional information, visit ftp://ftp.cs.umd.edu/pub/skipLists/skiplists.ps.Z.


    The algorithm may be employed to reduce search times for dynamic linked lists.
    The individual list elements must be assigned to the list according to some ordered
    attribute. This approach works well for linked lists with only a dozen or so members
    and equally as well for lists of several hundred members.


    At first glance, skip lists appear to be simply a series of forward- and reverse-linkage
    pointers. Upon closer examination, we see that some point directly to a neighbor,
    while others skip several in-between structures. The surprising part is that the
    number of elements skipped is the result of random assignment of the pointer structures
    to each list member as it is linked into the list.


    List maintenance is fairly simple. To add a new member element, we simply skip
    through the list until we find its neighboring members. We then simply link the
    new structure between them. The removal of a member follows the same logic in
    reverse.


    When a new member is added, we must decide at which levels it will be linked.
    The implementation used in the HP-UX region lists uses a skip pointer array with
    four elements. All members have a first-level forward pointer. The odds are one
    in four that it will have a second-level pointer, one in four of these will have
    a third-level pointer, and one in four of these will have a fourth-level pointer.
    As elements may be added or removed from the list at any time, the actual distribution
    of the pointers takes on a pseudorandom nature.


    To facilitate the method, a symbolic first element is created, which always contains
    a forward pointer at each of the skip levels. It also stores a pointer to the
    highest active level for the list. See Figure 3-9.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_101_0.png)


    Figure 3-9 Skip List


    # Example


    From Figure 3-9, let''s assume that we need to locate the structure with the attribute
    9678. In the list nexus structure, we see that the highest level active pointer
    is at `next` [2], so we follow it. This structure has an attribute value of 5255,
    so we need to continue our search at this level.


    We arrive back at the starting point structure, so we backtrack to the 5255 structure,
    drop down a level to `next` [1], and continue.


    We now arrive at the structure with the 9678 attribute—it''s a match! Our search
    is over.


    In the example, it took only three searches. A simple binary search would have
    taken four searches.


    # Pros


    The skip list offers an interesting approach for searching that often results
    in a reduction of search times when compared to a simple binary method. Adding
    and removing members to and from the list is reasonably quick.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Cons


    It requires the creation of a multielement array for the forward linkages. The
    random nature of the pointer assignment does not take into account the relative
    size or frequency of use of the various list elements. A frequently referenced
    structure might be inefficiently mapped by the luck-of-the-draw (in our example
    we beat the binary method, but other members of our list would not: try searching
    for the 5015 structure).


    # Summary


    Despite the random nature of this beast, the overall effect may be a net-sum gain
    if the ratio between the number of items and the number of levels is carefully
    tuned.


    # Operations Arrays


    Modern kernels are often required to adapt to a variety of different subsystems
    that may provide competing or alternate approaches to the same management task.
    A case in point is that of a kernel that needs to support multiple file system
    implementations at the same time.


    To accomplish this goal, specific file systems may be represented in the kernel
    by a virtual object. Virtual representation makes all references to the actual
    object. This is all well and good, but what if kernel routines needed to interact
    with the real object required code and supporting data dependent upon type-specific
    attributes? An operations array, or vectored jump table, may be of service here.


    # Example


    Consider Figure 3-10. Here we see a simple kernel table with four elements, each
    representing a member of a virtual list. Each list member has its actual v_type
    registered, a type-specific v_data[] array, and a pointer to a v_ops[] operational
    array.


    For this model to work, the number of entries in the operational array and the
    functions they point to must be matched for each type the kernel is expected to
    handle. In our example, there are four operational target functions: open(), close(),
    read(), and write(). Currently, our system has only two variations labeled type
    X and Y.


    When a routine is called through a vectored jump referenced through v_ops[x],
    it is passed the address of the virtual objects v_data[] array. This allows the
    final type-specific function to work with a data set type that it understands.


    The end result is that all other kernel objects need only to request a call to
    v_ops[0] to instigate an open() of the virtual object without concern or knowledge
    of whether it is of type X or Y. The operations array will handle the redirection
    of the call. In practice, we will see many examples of this type of structure
    in the kernel.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_103_0.png)


    Figure 3-10 Operations Arrays: A Vectored Jump Table


    Pros

    The cost of redirecting a procedure call through a vector jump table is very low
    and for the most part transparent to all that use it.


    Cons

    In debugging, this is yet one more level of indirection to contend with.


    Summary

    The vectored jump table, or operational array, provides a very effective abstraction
    layer between type-specific, kernel-resident functions, and other kernel subsystems.


    # ## The HP-UX Kernel Overview


    Now that we have spent some time considering a generic UNIX kernel, the tools
    of the trade, and some of the challenges faced by the kernel designers, let''s
    turn our attention to the specifics of the HP-UX kernel.


    The current release of the Hewlett-Packard HP-UX Operating System is HP-UX 11.1
    (the actual revision number is 11.11). We concentrate on the current release,
    but as many production'
