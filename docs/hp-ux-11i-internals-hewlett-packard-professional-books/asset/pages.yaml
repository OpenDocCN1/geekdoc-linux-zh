    # Free Lists: Allocating a New Buffer


    When a buffer is in use, its b_flags is set to B_BUSY. As soon as any pending
    data transfer is complete, it is returned to a free list. There are several free
    lists.


    When a page is first allocated to the dynamic buffer cache, its buffers are placed
    on the BQ_EMPTY free list. Requests to grow the buffer cache depend on its level
    of use.


    Once a buffer is allocated, used, and freed, it is placed on the BQ_AGE list,
    and its b_count is incremented. Once the b_count exceeds 4, the buffer is placed
    on the BQ_LRQ list when it is freed. In this manner, a buffer that has been loaded
    to satisfy a truly random access read request is more likely to be reallocated
    than one for which sequential requests are being processed.


    Each processor has its own set of free list headers. The rules for finding an
    available buffer with a fixed buffer cache are as follows:


    +   Search the processor''s BQ_AGE list, then its BQ_LRU.


    +   Next, search the BQ_AGE lists of all the other processors.


    +   Finally, search their BQ_LRQ lists.


    In the case of a dynamic buffer cache:


    +   Check the current processor''s BQ_AGE and BQ_LRU.


    +   Next we check the BQ_EMPTY (we wait to check it, as the allocation of new
    pages to the cache is performed in background).


    +   Assuming that we can''t find a buffer on one of our processor''s free lists,
    we next check the neighboring processors'' BQ_AGE and then their BQ_LRU lists.'
