    # One-Way and Two-Way Mirroring Mechanics and Options


    Mirroring allows for either two (one-way) or three (two-way) mirroring of individual
    logical volumes under LVM control. The basic premise of mirroring is very straightforward,
    but the behind-the-scenes mechanics require additional considerations.


    A major concern with mirrored operations is assuring that each mirror copy has
    the same data. This really comes to bear when a write is requested. To help make
    sure that the data is consistent across all copies, LVM incorporates an MWC strategy.
    When a logical volume is configured to be mirrored, it may be configured to use
    one of three mirror-caching policies.


    +   NONE: Choosing this policy disables all internal consistency checks. Extents
    are not marked as stale at activation, and mirrors are not synchronized. This
    may be suitable for a swap volume.


    +   NOMWC: No MWC records are keep and there is no performance cost during normal
    operation. At volume group activation time all but one volume will be marked as'
