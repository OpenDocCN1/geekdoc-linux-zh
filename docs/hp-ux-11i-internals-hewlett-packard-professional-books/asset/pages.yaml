    \ 1\tentry abandoned\n+   SIDL = 2\tintermediate state during creation\n+   SZOMB\
    \ = 3\tintermediate state during deconstruction\n+   SINUSE = 5\tentry in use\n\
    \nPrior to the advent of kernel threads, a process could also be in the state\
    \ SRUN, waiting on an active run queue; SSLEEP, blocked or sleeping; or SSTOP,\
    \ halted. With the introduction of kernel threads, these three scheduling-oriented\
    \ process states were replaced with the inclusive SINUSE state designator for\
    \ the process.\n\nAs the current scheduler works directly with kernel threads,\
    \ the TSRUN, TSSLEEP, and TSSTOP states are set at the thread level and recorded\
    \ in the `kt_stat` field. Figure 9-4 abstracts the overall process life cycle\
    \ and the relationship between the various states.\n\n![](img/08b7d2492fc1415a694a5fb16a8fdeb3_294_0.png)"
