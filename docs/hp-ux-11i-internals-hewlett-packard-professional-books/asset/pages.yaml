  md: '# CHAPTER 3


    # # The Kernel: Basic

    # Organization


    The study of a modern operating system leads down many paths and requires that
    we consider a number of different challenges and their solutions. The HP-UX kernel
    is a multi-tasking, multiuser, multiprocessor, multithreaded, load-leveling, modular
    operating system with real-time scheduling extensions—to list just the highlights.
    To support such capabilities requires many levels of design abstraction, data
    tables, and lists as well as a host of subsystems, drivers, and dynamic modules.


    In this chapter, we examine the basic organization of the kernel and its data
    structures, and we consider which are dependent on the underlying hardware platform
    (hardware dependent-layer, HDL) and which are independent (hardware-independent
    layer, HIL).


    Before addressing HP-UX-specific topics, let''s stop and think about what an operating
    system really is.


    # ## A Generic Overview


    Approaching an operating system as a whole can be a bit overwhelming, so let''s
    break it down a bit. Think of an operating system simply as a bootable piece of
    application code. True, it is a somewhat large piece of application code, and
    it employs many diverse and complex functionalities (even an abstracted form of
    self-modifying code), but in the final analysis it is still just an executable
    image!


    A programmer must design and create data structures to store and manipulate data
    in a logical and efficient manner to support the operation and design goals of
    the program. An operating system designer faces the same challenge, only in spades.
    Understanding and identifying the resulting data structures and their interaction
    is a major focus of this book.


    The UNIX operating system design is very simple.'
