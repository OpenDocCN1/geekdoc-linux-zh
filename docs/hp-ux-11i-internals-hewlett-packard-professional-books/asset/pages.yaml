    q4> run WhatHappened

    ```


    The argument to the run command is the name of a subroutine within the Perl file.
    In most cases, this is the same as the file but in mixed case, as in the example
    for WhatHappened. In other cases, you may have to look at the Perl file to find
    out how it works. Table 16-2 lists some of the more useful Perl scripts.


    # Table 16-2 q4 Perl Scripts


    | File Name | Command | Purpose |

    | --- | --- | --- |

    | bucketwalk.pl | BucketWalk | Checks the memory buckets in the bucket allocator
    for corruption. |

    | callout.pl | callout | Reports information related to call-outs. |

    | ioscan.pl | Ioscan | Re-creates ioscan-like information from a dump. |

    | lvm.pl | LVM | Prints summary of LVM configuration. |

    | netinfo.pl | Netinfo | Simulates lanscan and netstat. |

    | openfiles.pl | OpenFiles | Displays all files open by all processes. |

    | sleep_queue.pl | (various) | Various commands to check sleep queues. |

    | whathappened.pl | WhatHappened | General information used in analyzing dumps.
    |

    | wsioscsi.pl | WsIoSio | Information about the state of the WSIO SCSI subsystem.
    |


    # Summary


    Both adb and q4 give you the ability to examine kernel data structures either
    on a running system or in a crash dump. adb is better for simple tasks and allows
    modification of kernel values. q4 allows you to get an in-depth view of the kernel
    but is a view-only tool.'
