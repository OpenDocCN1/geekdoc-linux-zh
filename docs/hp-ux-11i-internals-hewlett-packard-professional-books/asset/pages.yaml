  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_141_0.png)


    # The proc Table


    For a process to exist (at least from the point of view of the kernel), a *proc*
    data structure must be placed in the system *proc* table. Prior to HP-UX 11i,
    the *proc* table was a static array. the kernel pointer *proc* defined its beginning,
    and the size was tuned via the kernel parameter *nproc*. The *proc* table is one
    of the largest tables in the kernel (at HP-UX 11.00, each *proc* structure was
    700 bytes), and tuning *nproc* could significantly alter the size of the kernel.
    This effect was amplified, since many additional kernel data structures are sized
    in proportion to *nproc*.


    With the release of HP-UX 11i, the *proc* table has become dynamic (see Figure
    5-2). This means that individual *proc* structures are allocated from kernel memory
    arenas as they are needed. The beginning of this key system table is now pointed
    to by *proc_list*, and linkage pointers have been added to the structure to create
    a dynamic linked list. At HP-UX 11i, a *proc* structure has grown to 828 bytes.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_142_0.png)


    To date, not all kernel data structures have been converted from static to dynamic,
    which necessitates the maintenance of the nproc parameter to be used during the
    sizing of related tables. In addition, nproc acts as a tunable limit for the number
    of processes a kernel may be expected to manage.


    In the current implementation, structures allocated to the proc table are not
    returned to the kernel memory pool when their process is terminated. Instead,
    the proc structure''s status is set to SUNUSED, and it is placed on a free list.
    The current thinking is that once a proc entry has been allocated, it represents
    a type of high-water mark for system activity, and the system will simply place
    it on a free list so that it will be available next time the process count is
    high. Let''s explore some additional linkages and parameters stored there.


    q4 may be used to examine the process table on a live system.


