- pgno: 190
  md: '+   - Depending on whether this is a narrow or wide kernel, additional bit
    operations are performed on the offset value (again from our GVA discussion, there
    are only 30 actual virtual page address bits implemented by the current processors:
    64 - 2 space reg. selection bits - 20 unimplemented bits - 12 page offset bits
    = 30 bits).

    +   - As with the narrow version, to assure that the index does not exceed the
    size of the hashtable, an AND operation is performed between the initial index
    value and the mask.


    For the most part, the index calculation involves bit shifts, exclusive ORs, and
    ANDs. The indexing functions are quick and dirty, but keep in mind that the hardware
    performs a parallel to these operations: each time an implicit address is requested,
    the hardware calculates the index as an atomic operation and its value is temporarily
    stored in CR28. If a tlb fault occurs the hardware will use CR28 as an index into
    the kernel hashtable in an attempt to find the correct translation. The only reason
    the kernel needs to be able to duplicate this effort is so that it can move virtual
    pages in and out of the physical memory map and keep the htbi/pdir in sync with
    the changes it makes.


    Creating a Sparse Table You may be wondering what happens if two virtual page
    numbers hash to the same index, which is a very real possibility. When this happens
    a forward linkage pointer will direct the fault handler to an extension pde. Extended
    pdes are allocated from pages of pde structures managed by the kernel. The hashtable
    pages and pages allocated for the extended pde entries are collectively called
    the sparse pdir.


    When an extended npde entry needs to be stored, the kernel allocates the space
    from the head of pdir_free_list (see Figure 6-5). In order to maintain a supply
    of these structures for use when needed, several kernel parameters are utilized.
    The pdir_free_list and pdir_free_list_tail point to the front and back of a linked
    list of available structures. Whenever the number of free entries begins to run
    low (drops below 256), the kernel allocates an additional page to the effort,
    carves it into npdes, and links them to the free list.


    For wide systems, the free lists are maintained on a per-spu (system processor
    unit) basis and the pointers are pd_f12_0 (spu) .head and pd_f12_0 (spu) .tail.'
