    # Beta Semaphores


    Most of the functions on beta semaphores are similar to those for alpha semaphores.
    One concept that is different is the idea of *dismantling* a semaphore. There
    are a few cases when a semaphore must be acquired and held until an I/O operation
    completes. When the I/O completes later and an interrupt is generated, the “current
    thread” is whichever one is running when the interrupt occurs. Before the I/O
    starts, the system dismantles the semaphore, leaving it locked but without an
    owner. Then, when the I/O completes later, the system can unlock the semaphore
    even though it is in a different thread context.


    Internally, there are several differences between the alpha and beta semaphores.
    The beta semaphore structure itself has three fields: `b_lock`, `owner`, and `order`.
    `b_lock` is a bitmask value. The lowest order bit is on if the semaphore is currently
    locked, and the second bit is on if someone is waiting for the semaphore. The
    *owner* field will be zero if the semaphore is not locked, negative one if the
    semaphore is locked and dismantled, or it will point to the thread which owns
    the semaphore.


    The *order* field is used to ensure that if a thread acquires several semaphores,
    it does so in the correct order. To prevent a deadlock situation, all semaphores
    have an order. Every time a semaphore is acquired, the system checks all other
    semaphores already held by that thread. The order of the new semaphore must not
    be less than the order of any semaphore already held. This check of a semaphore
    order takes some extra time and really shouldn’t be necessary. Semaphore should
    never be violated if there are no bugs in the system. Because of this, this feature
    is actually turned off in most kernels. When a new kernel is under development,
    semaphore order checking is turned on. When the kernel is ready for release, the
    kernel is rebuilt in “performance mode” with this check turned off to eliminate
    the overhead.


    Another difference between the alpha and beta semaphore implementations is the
    lack of a spinlock and information about waiters in the `b_sema` structure. This
    information is kept in a separate structure, the beta semaphore hash. The system
    maintains a single table of information'
