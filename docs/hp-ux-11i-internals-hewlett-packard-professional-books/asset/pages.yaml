    is a forward branch, then the instruction in the delay slot is nullified if the
    branch is taken. This is because for a forward branch, the construct is usually
    “if this condition is true, skip forward over the following code.”


    The instruction in the delay slot is part of the code that is skipped if the condition
    is true. In the normal case where the condition is not met, we fall through to
    the next instruction as expected.


    If the branch is backwards, the delay slot is nullified if the instruction is
    not taken. The reasoning is that a backward branch is typically at the bottom
    of a loop. The compiler will generally copy the first instruction in the loop
    into the delay slot of the test at the end. Then the branch back to the top of
    the loop will branch to the second instruction of the loop. By doing this, we
    take advantage of the speed gained by using the delay slot. If the test fails
    and the branch is not taken, we continue on, nullifying the instruction in the
    delay slot.


    # Immediate Instructions


    An immediate instruction is one in which one of the operands is a constant value,
    encoded as part of the instruction. Because the PA-RISC architecture uses a fixed
    instruction size of 32 bits, the size of an immediate operand is limited to only
    21 bits. PA-RISC has some interesting tricks for dealing with this limitation,
    and we look at those here.


    The most common example is the add immediate left instruction (ADDIL). ADDIL takes
    the 21-bit immediate value, shifts it left by 11 bits, then adds it to a specified
    register. The result is always placed in GR1. This gives the system a way to load
    the upper portion of a 32-bit value as an immediate.


    In the kernel, this is commonly seen when loading a global. The address of the
    global is calculated by the compiler relative to the data pointer (GR27). The
    compiler then generates an'
