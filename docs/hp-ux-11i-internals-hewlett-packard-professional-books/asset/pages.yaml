    hard to track down, because by the time the panic occurs, the code that caused
    the corruption may already be done and gone.


    # ## The Arena Allocator


    The arena allocator has several advantages over the bucket allocator. With this
    allocation method, each subsystem creates its own “arena” of memory. Memory is
    then requested from and returned to that arena. This allows the allocator to tailor
    its performance to a particular use and also helps to contain any possible memory
    corruption. A problem in one arena can’t affect another subsystem. The arena allocator
    refers to each piece of memory allocated or released as a *memory object*.


    One feature of the arena allocator is that it distinguishes between *fixed-size*
    memory objects and *variable-sized* memory objects. If an arena is created as
    a *fixed-size* arena, then all'
