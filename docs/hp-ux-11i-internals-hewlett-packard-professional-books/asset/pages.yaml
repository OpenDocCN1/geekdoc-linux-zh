    Once a structure has been allocated and the correct data stored, the challenge
    is in accessing the data in a timely manner. A simple index will not suffice due
    to the noncontiguous nature of the individual list elements. The choice is to
    "walk" the list by following forward pointers inserted into each list element
    as a means of building a continuous path through the list or to implement some
    other type of index data structure or hash function. While a hash greatly reduces
    the access/search time, it is a calculated overhead and must be used each time
    an item in the list is needed.


    An additional challenge comes when it is time for the kernel to clean up a structure
    that is no longer needed. If the individual elements of the list have been simply
    linked by a single forward-linkage pointer, then the task of removing a single
    element from the list can be time consuming. The list element, which points to
    the element to be removed, must be identified in order to repair the break in
    the chain that the removal will cause. These requirements lead to the development
    of bidirectional linkage schemes, which allow for quicker deletion but require
    additional overhead during setup and maintenance.


