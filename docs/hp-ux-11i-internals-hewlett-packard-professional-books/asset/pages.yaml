- pgno: 114
  md: 'As drivers are built into the kernel image or registered for future dynamic
    loading, they are assigned a driver number, often called their *major* number.
    Many of the major numbers are reserved and always assigned to a specific driver;
    for example, the logical volume manager psuedodriver is always assigned major
    number 64, while others are assigned from a dynamic pool of available numbers.
    This major number is visible through the `11` or `ls -1` commands. To list all
    the currently used major numbers for an HP-UX kernel, enter the `lsdev` command.
    In general, many more devices have raw drivers than have block drivers.


    The device switch tables are arrays of operational pointers. Each entry in the
    table consists of a subarray of jump points. The routines pointed to are entered
    in a documented order and cover actions such as open, close, read, write, and
    several more. If it sounds like we are talking about file I/O, you are absolutely
    correct—but remember that in the world of HP-UX (and UNIX in general), all types
    of I/O are treated like file I/O. No matter what type of physical device a driver
    was created to work with, to system process threads, first you open it, then you
    read or write to it, and when you are through you close it!


    # ## Summary


    This concludes our first pass through the kernel designer''s tool kit. Knowledge
    of these structures and tables and how they work will help prepare us for an in-depth
    examination of the HP-UX kernel. HP-UX and UNIX in general have many nooks and
    crannies to be explored and understood. Please reference the generic algorithm
    explanations offered in this chapter as we encounter specific examples of their
    usage in the chapters to come.'
  merge: -1
