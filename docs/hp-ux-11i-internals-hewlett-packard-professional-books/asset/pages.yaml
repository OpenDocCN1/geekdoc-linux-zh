- pgno: 396
  md: '+   * Setup the `procinfo` structure and IVA for the particular processor.

    +   * Set the global variable `boot_rendez_state` to `RS_RENDEZ_IN_PROGRESS`.

    +   * Set the `MEM_RENDEZ` pointer in page zero of memory to point to `force_start()`.

    +   * Send a rendezvous interrupt to the processor on EIRR bit 0.

    +   * Monitor the value of `boot_rendez_state` for 10 seconds. If it changes to
    `RS_RENDEZ_ACK`, then the processor woke up. If it doesn''t, then the processor
    is considered bad.


    When a processor gets the rendezvous interrupt, it branches to the interrupt handler
    at `MEM_RENDEZ—force_start()`. This is an assembly language routine that does
    many of the things that `rdb_bootstrap()` does—the processor goes into wide mode,
    clears and enables interrupts, and sets up its IVA, stack, and data pointers.
    It then calls `non_monarch_init()` to do real mode initialization. `non_monarch_init()`
    sets up the TLB for the processor and fills in the rest of the `procinfo` structure.
    It then sets `boot_rendez_state` to `RS_RENDEZ_ACK` to indicate to the monarch
    that it has started.


    Once it has done this, the processor begins to spin, watching the global value
    `mp_sync_after_rendez`. As long as this value is `WAIT_FOR_ALL_PROCESSORS`, it
    continues spinning. We''ll see how that happens shortly.


    Back on the monarch, once all the non-monarchs have been started, we continue
    with system initialization by initializing the scheduler. Next, we perform second-level
    I/O configuration, as described in detail in Chapter 10, “I/O and Device Management.”
    When this process is complete, we''ll have the I/O tree completely filled out
    with drivers mapped to each device. Now we''re ready for more Subsystem initialization!
    We set up buffer hash queues and allocate the buffer cache, initialize System
    V semaphores and shared memory, and initialize LVM.


    Finally, we''re ready to start some disk activity—starting with mounting the root
    file system. We go through every file system that was registered during the second
    level I/O configuration, looking for one with an empty point for `vfs_mountroot`.
    When we find one, that entry point is called, causing the file system to be mounted
    read-only on `/`.


    Next, we fork some system daemon processes—`vhand`, `stataemon`, `unhashdaemon`,
    and `ttsr`. The process is very similar to the use of the `fork()` system call
    in a user program. We first have to call `prepare_newproc()`, which initializes
    a proc structure and a `kthread` structure, and gives us back pointers to those
    new structures. When we call `newproc()`, passing it the pointers to the new proc
    and kthread. Just like `fork()`, `newproc()` returns twice: once in the parent
    and once in the child. We check for a return value of `FORKRN_CHILD` to indicate
    that we are the new child process. If we are the child, then we call the appropriate
    routine—`vhand`, `stataemon`, `unhashdaemon`, or `ttsr_daemon`—to perform the
    daemon function. These calls never return; they run as long as the system is up.


    Up to this point, all of the processes we''ve launched have been kernel processes.
    They run in kernel address space; use the kernel stack; and have access to all
    the kernel functions. The'
