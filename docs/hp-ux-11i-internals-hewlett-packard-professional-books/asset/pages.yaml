    # **Figure 8-15 Building a Seamless File System**


    Let''s revisit our earlier scenario except that now /home is a separate file system
    mounted to the system''s root file system. Again, our challenge is to follow the
    pathname /home/chris/stuff through the kernel''s virtual structures.


    We start our search by locating the kernel''s copy of the / inode (2 on the first
    volume). The inode/vnode and root directory data of all mount points and file
    system roots are held in the caches and the buffer cache as long as a file system
    is mounted. To speed up this initial search, the kernel maintains a permanent
    shortcut pointer to the cached copy of the / inode/vnode in the symbol rootdir.


    From this vnode, we determine the file system device number, and from the associated
    inode we get the data block pointer. These two numbers are used to hash our way
    into the buffer cache, where we find a copy of the root file system''s root directory
    data. We take the inode number associated with the /home directory and the device
    number to hash our way back into the inode cache for the next step of our search.


    When we find the cached vnode for the /home directory (5 on the first volume),
    the v_vfsountedhere pointer is valid and directs us to the kernel mount table
    and the vfs structure for the second mounted volume (did we ever play the children''s
    game Chutes and Ladders?). We then follow the v_data pointer to find the root
    inode/vnode (2 on the second volume) and cached data block for the mounted /home
    file system.


    We continue our search within the /home file system, locating the inode/vnode
    (10 on the second volume) and cached data for the /home/chris directory and finally
    the inode/vnode (14 on the second volume) and cached data for the /home/chris/stuff
    file.'
