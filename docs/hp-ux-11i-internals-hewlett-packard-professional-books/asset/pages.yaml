- pgno: 301
  md: '# # The exit() System Call Mechanics


    When a thread makes an `exit()` system call, it is asking to be removed from its
    run queue and to have its cumulative resources returned to the kernel for dispersal
    to their appropriate free lists and arenas (Figure 9.9). As we mentioned earlier,
    when any thread of a multithreaded process calls `exit()`, all of its threads
    are halted and removed from kernel tables and structures.


    Actually, there are two variations of the exit call, the original `exit()` and
    `__exit()`. When a programmer codes a call to `exit()`, an additional call is
    made to `atexit()`. The idea is that the programmer may wish to have specific
    functions performed as part of the exit procedure (i.e., some standard I/O library
    routines require a final "flush" of buffers to avoid data loss when a program
    terminates). Since an `exit()` may be called on behalf of a thread by the kernel
    (as the result of a fault or signal) or at the request of another process (by
    the `kill` command or system call), a programmer may need to schedule cleanup
    actions as part of the program''s exit logic. This feature is embedded into the
    basic `exit()` call.


    There are some conditions in which these cleanup actions may not be desired or
    in fact may cause problems. When is an executing thread not running in its own
    run environment? During a `vfork()`. If a child of a `vfork` calls `exit()` while
    it is still running in the parent context, then any scheduled cleanup actions
    are actually modifying the parent environment. Once the child completes its exit,
    the parent may wake to find that its context has been corrupted. For this reason
    and others, the `__exit()` call was created. This call bypasses the call to `atexit()`.
    It proceeds directly to exit, does not pass `atexit`, and does not collect `$200!`
    In the kernel both calls are handled by `exit1()`.


    # ## Walk, Don''t Run, to the exit1() Nearest You


    As part of the kernel mechanics, when a thread calls `exit()` or `__exit()`, or
    when a fault results in the kernel scheduling `exit()` on behalf of a thread,
    a sequence of events takes place involving the kernel, the exiting process, and
    the parent process. In the case of a multithreaded process, all sibling threads
    are immediately halted, and in all cases deconstruction of the process''s resources
    is begun. A write lock is obtained for the process (we don''t want two siblings
    attempting to exit at the same time). We set `p_flag`=`SWEXIT`, ignore all signals,
    release semaphores, cancel pending callouts, and release our virtual memory regions
    (provided we are the last active process to reference them; for shared regions,
    it is a case of "last one out turns off the lights"). We close all open file descriptors,
    perform any requested `Sysv` semaphore undos, and destroy any adopted processes.
    If the exiting process has children, we turn them over to `init` and send a `SIGCHLD`
    to `init` if there are any newly adopted zombies waiting for the reaper. Finally,
    the `kthread` and `proc` structures are removed from their active lists.


    All kernel structures are released with the exception of the `proc`, calling `kthread`,
    `vas`, and one remaining `area`, `region`, and `pregon`. The state in the `proc`
    and `kthread` structures are set to `p_stat`=`SZOMB` and `kt_stat`=`TSZOMB` respectively.'
  merge: -1
