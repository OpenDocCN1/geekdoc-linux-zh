- pgno: 310
  md: '# PA-RISC I/O Architecture




    Both address-space models reserve a portion of memory for PDC address space. In
    the 32-bit model this is from 0xEFFFFFF0 to 0xFFFFFF. In the 64-bit model, it
    is in the range 0xFFFFFFFF 00000000 to 0xFFFFFFFF FFFFFFF. This area of address
    space is reserved for use by PDC. Memory in this range can be used both for PDC
    code itself and for data storage.


    Both models also reserve a range of addresses for interfacing with I/O modules.
    In the 32-bit model this range is from 0xF1000000 to 0xFFFFFFF. The 64-bit model
    has a range of addresses that correspond with the 32-bit ranges but with the upper
    bytes “F extended.” This gives a range from 0xFFFFFF F1000000 to 0xFFFFFF FFFFFFF.
    This range of 64-bit addresses is called the local I/O address space. In addition,
    the 64-bit model has a pair of ranges that make up the global I/O address space,
    which is accessible only by 64-bit processes. These ranges are from 0x00000000
    00000000 to 0xFFFFFFEF FFFFFFF and from 0xFFFFFFFF FFFFFFFF to 0xFFFFFFFF EFFFFFF.


    As you can see from the figures, the 32-bit I/O addresses and the corresponding
    local I/O addresses in the 64-bit model can be further divided into four regions:


    +   * A general I/O space for addressing modules on the bus

    +   * An area reserved for the system''s central bus

    +   * A local broadcast area for communicating with all modules on the bus

    +   * A global broadcast area for communicating with all modules in the system.


    The general I/O space is further divided according to the topology of the system.
    Each bus in the system is given a 256-KB chunk of the address space. This 256-KB
    chunk is then divided into 64 chunks of 4 KB each, one for each possible module
    on this bus. The module''s space is divided into 64 register sets, each with 16
    registers. Of course, not every module will use all 1,024 registers, but that
    is the space that is available to the module. These addresses associated with
    a module are known as the module''s hard physical address.


    Now that we have all these addresses partitioned into modules and register sets
    and registers, how do we know what to do to talk to an I/O module? That''s the
    part that is unique to every type of module, and that''s why every module type
    has to have its own driver. The system can query the IODC in the module, find
    out what kind of module it is, and assign it to a driver, and the driver then
    knows what registers are available and how to use them to communicate with the
    card.


    # ## Modes of Operation


    There are two general modes of operation that can be used in communicating with
    an I/O module. The first is direct I/O. A direct I/O module cannot initiate a
    transfer of data on its own. In order for data to be transferred, the processor
    (or some other bus module) must explicitly do a LOAD or STORE operation. The only
    way a direct I/O module can initiate communication is by sending an interrupt
    to a processor. This puts some severe limitations on what can be done with a direct
    I/O card. The throughput on this type of card is low, and the demands on the processor'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'are high because it has to be involved in every data transfer. However, there
    are some advantages too. Direct I/O is much easier to implement in hardware, particularly
    when interfacing to existing devices that are not designed with the PA-RISC architecture
    in mind. For this reason, they’re also less expensive. For a low-speed operation
    to industry-standard devices, such as parallel and serial ports, direct I/O can
    be a good solution.


    When the need for performance is higher, then we turn to the other type of I/O
    card: direct memory access (DMA). A DMA I/O card can initiate its own data transfers
    across the bus, normally to and from a memory module. The processor can give a
    DMA I/O card a command such as “read” or “write” and a range of memory, and the
    card will transfer all the data in the range. When the operation is complete,
    it signals the processor with an interrupt. During the time the I/O is taking
    place, the processor is free to do other work—it doesn’t need to get involved
    in the transfer until it is signaled that the transfer has completed. While this
    adds some complexity to the hardware on the module, it is an absolute necessity
    if we’re to keep up with devices such as disks and tapes.


    PA-RISC further defines two different types of DMA modules. Type A DMA modules
    support data chaining. This allows the system to supply a list of data ranges
    rather than a single range. When the module finishes transferring to one range,
    it begins transferring to the next. The system is signaled when the entire DMA
    chain is complete. Type B DMA modules take this one step further. They allow chaining
    of the commands as well as the data lists. Thus, the processor can pass the module
    a list of commands to be executed, a list of the memory ranges with which to transfer
    the data, and let the module do all the work. The module then returns a completion
    list to the system indicating the status of the various commands.


    # ## External I/O Interrupts


    Now we have I/O modules connected to system busses. Each module has a range of
    addresses through which the system can communicate with the module. How does the
    module go about getting the attention of the processor when it needs to? This
    is done through the External Interrupt process.


    Each processor has one control register called the external interrupt request
    register (EIRR) and another called the external interrupt enable mask (EIEM).
    These are 32-bit registers on a 32-bit machine and 64-bit registers on a 64-bit
    machine. Each bit in these registers corresponds to an external interrupt number.
    At boot time when the system is initializing the I/O modules, each module is instructed
    which interrupt number to use. All direct I/O cards use the same interrupt number:
    interrupt 3. They also send broadcast interrupts, meaning that when a direct I/O
    module sends an interrupt, all the processors get it. DMA cards, on the other
    hand, can each be given their own interrupt bit, and each can be assigned to a
    processor. When these cards send an interrupt, it’s to a specific processor and
    a specific bit on that processor. The programming of the modules and the interrupts
    themselves both take place in the same way: by writing to registers in the I/O
    space. Each module has a register called the TO_ETIM register, which tells it
    where to send its interrupts. The processor writes a value to the'
  merge: -1
  img_proc: true
- pgno: 312
  md: "IO_EIM register for each module as part of the initialization process. To generate\
    \ an interrupt, the card writes to the IO_EIR register of the processor. Remember\
    \ that a processor is just another module with an address on the bus just like\
    \ any other. An I/O module writes to the processor's IO_EIR register to raise\
    \ an interrupt.\n\nAfter each instruction, the processor performs a logical AND\
    \ between its EIMR and its EIRR registers. If a bit is turned on in the EIRR and\
    \ that interrupt is enabled by the corresponding bit being on in the EIE, then\
    \ an interrupt is generated. (The I bit in the Processor Status Word, or PSW,\
    \ must be on too, enabling the overall interrupt system.)\n\nWhen the processor\
    \ is interrupted, the first thing it does is turn off the I bit in the PSW, preventing\
    \ any further interrupts until it is ready for them. It then branches to the first-level\
    \ interrupt handler (FLIH) for the interrupt for the it has received. The address\
    \ of this handler is found in an interrupt vector table (IVT), which is pointed\
    \ to by the interrupt vector address (IVA) register (control register 14). Recall\
    \ from Chapter 1, “PA-RISC 2.0 Architecture,” that there are many types of traps\
    \ and interrupts that the processor has to deal with. Each type is assigned a\
    \ trap number (trap type). So for an external interrupt, the FLIH is found as\
    \ the fourth entry in the table pointed to by the IVA. In HP-UX this is the routine\
    \ handler().\n\nEach processor in the system has its own interrupt control stack\
    \ (ICS). When an interrupt occurs, the system switches to using the ICS rather\
    \ than the user process’s stack or the kernel’s stack. It then saves the current\
    \ system state onto that stack. Next, it calls one of three interrupt handlers:\
    \ mp_ext_interrupt(), up_ext_interrupt(), or external_interrupt(). Which it calls\
    \ depends on whether the system is multiprocessing or uniprocessor and whether\
    \ or not the kernel debugger is running. We perform this little bit of magic by\
    \ actually patching the code at boot time. That is, part of the boot-up process\
    \ is to determine if we’re a uniprocessor or multiprocessor system and go poke\
    \ the right branch address into handler().\n\nRegardless of which of the three\
    \ error handlers is used, a certain set of steps is performed. The first is that\
    \ we determine which external interrupt bit we’re dealing with. The interrupt\
    \ handler locates the highest priority unmasked interrupt to determine which to\
    \ handle. It then sets that bit in the EIRR to off, indicating the interrupt has\
    \ been received. Next, we mask off lower priority interrupts by modifying the\
    \ EIMR. This holds off any lower priority interrupts until we’re done with the\
    \ current one. Now we can turn the I bit back on in the PSW, enabling interrupts\
    \ overall. Finally, we’re ready to call the correct interrupt handler for the\
    \ external interrupt we received.\n\nThe information on what to mask and where\
    \ to find the specific handler is kept in a table called the eirr_switch. It is\
    \ an array of struct eirrswitch:\n\n```\n```\nstruct eirrswitch {\n    void  \
    \          (*int_action)();\n    unsigned long   eiem;\n    void            *int_arg;\n\
    \    unsigned long   io_int;\n};\n```\n```"
