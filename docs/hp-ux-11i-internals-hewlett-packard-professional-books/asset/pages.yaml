  md: '# # Managing Memory


    In this chapter ,we examine HP-UX memory management by looking at systemwide memory
    resources. Figure 6-1 shows the various forms of memory the kernel must manage.
    We examine how the per-process memory areas are allocated from systemwide memory
    and how the kernel''s virtual memory is mapped to physical memory. We also look
    at how free memory and swap space are allocated and managed.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_180_0.png)'
