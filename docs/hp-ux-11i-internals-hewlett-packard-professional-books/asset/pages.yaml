- pgno: 116
  md: '# # Programs, Processes, and Threads


    The study of UNIX internals may be approached from several points of view. One
    is to simply define all the individual kernel data structures and their basic
    functionality. While this presents a suitable framework for our study, we would
    like to also consider the kernel''s construction and utilization from the perspective
    of an individual process or thread. The kernel perspective is macro in its scope,
    while the view from a process or thread is more closely related to the user or
    programmer''s perspective.


    # ## The Players


    There was a time when the process was the smallest schedulable entity of concern
    to the kernel; today, however, that honor belongs to the thread. Before we discuss
    HP-UX kernel structures in depth, we must define the relationship between programs,
    processes, and threads.


    # ### The Program


    The term *program* refers to a file that stores an executable image. A program
    file contains a header record defining the architecture for which it was compiled,
    magic numbers, and a list of system resources it will require access to during
    its execution life cycle.


    The first HP series 800 computers were based on the then newly developed 32-bit
    HP Precision Architecture (PA-RISC 1.x) chip set. This product line was called
    the Specturm computing platform. The linking-loader for this architecture used
    a proprietary header format called the Spectrum Object Module, or SOM. With the
    advent of the 64-bit HP Precision Architecture (PA-RISC 2.0), the loader format
    adopted was the POSIX Executable Linking Format (ELF) defini-'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'tion. For compatibility reasons, all 32-bit executables on HP PA-RISC platforms
    continue to use the SOM format, and 64-bit executables use ELF.


    The memory management portion of the kernel also refers to program files as the
    *front store*. Since the program file contains static images of the program''s
    text (or code) pages, the kernel paging system makes use of these if it needs
    to page-out any of the program''s text once it has been loaded into physical memory.
    This negates the need to allocate a storage location from the system''s swap space
    (a.k.a. *back store*) for a program''s text pages. As the paging system relies
    on access to these page images as long as the process is active, the program file
    must be held in an open state for as long as the program is in use. Paging and
    swapping are discussed in greater detail in Chapter 6, "Managing Memory."


    # The Process


    In the world of HP-UX, the term *process* is used to define all the parts that
    make up an active program on the system—that is, one that is currently being allowed
    to utilize system resources and perform work on the behalf of a user. Think of
    a process as a type of container used to organize and manage a task. It keeps
    track of what is being used, what is required to perform the task at hand, priority
    and scheduling information, and what permissions and authorizations have been
    granted to the process. In addition, the process keeps tally of processor time
    used, the amount of I/O performed at the request of the process, the state of
    pending signals sent to the process, and many other related operational parameters.


    A process exists once there is a valid entry in the kernel process table (or *proc*
    table, as we call it in this book; see Figure 4-1). This table entry ties the
    process to all of its allocated system resources and is truly the nexus of the
    process''s view of the kernel throughout its life cycle.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_118_0.png)


    # Figure 4-1 Static versus Dynamic proc Tables


    Prior to the release of HP-UX 11.1, the proc table was a static table, and its
    size was defined by the system-tunable parameter nproc. The table was an array
    of data structures of type proc whose starting point was accessed through the
    kernel pointer proc*. When the table was full, no additional programs could be
    launched on the system. Increasing the number of allowable processes required
    a rebuild of the kernel. The current trend is to make many kernel structures dynamic
    in order to reduce the need to rebuild the kernel (and the number of reboots).


    Starting with HP-UX 11.1, the proc table became a dynamic linked list (see Figure
    4-1). This arrangement allows for proc table entries to be created on demand and
    dynamically linked into the list of active processes on the system. Access to
    the first proc table entry is now made by following the kernel pointer proc_list*.
    Each table structure is still defined as a proc (note that this structure definition
    has changed significantly since previous releases), which now contains the linkage
    pointer p_next* to the next proc table entry.


    The kernel-tunable parameter nproc is still used, but its purpose has changed
    somewhat: it is now used to define a maximum number of allowable proc table entries
    that may be created on the system. The kernel can maintain many static lists,
    which need to be sized large enough to handle the kernel’s worst-case needs. The
    nproc parameter has been used to help in this task during kernel initialization.
    Until these tables also become dynamic structures, a parameter like nproc will
    be required.


    The process has long been the workhorse of the HP-UX runtime environment. With
    the release of HP-UX 10.0 came the introduction of the thread as the schedulable
    entity.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# The Thread


    A thread is an instance of execution of a process''s code and is scheduled by
    the kernel. A single process may employ a single thread or several threads depending
    on its programming. A thread is running either in kernel thread or user thread
    mode depending on whether it is executing code from the process''s text or from
    privileged areas of the kernel code known as system calls.


    Each thread requires an active entry in the kernel thread table. Thread table
    entries are created on demand and are defined by the structure `kthread`. All
    the threads spawned for a process are said to be *siblings*, and their individual
    thread table entries are formed into a linked list using entries in their respective
    `kthread` structures. The parent process has linkage pointers in its `proc` structure
    to the first and last `kthread` elements in this list (see Figure 4-2). The parent
    `proc` table entry also contains a count of threads it has created, `p_threads_created`;
    this counter is set to 0 with the creation of the process''s initial thread and
    incremented for each additional sibling spawned.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_119_0.png)


    **Figure 4-2 Linking Threads to Their Process**


    In addition to the `proc`-to-`kthread` linkages, all the active threads on the
    system are linked together to form an active thread list.


    As was the case with the `proc` table, in HP-UX 10.x releases the thread table
    was also a static table. The kernel pointer to the first `kthread` was `kthread*`,
    and the number of entries in the thread table was stored in `kthreadnKTHREAD`,
    which was set equal to `nproc`. As with the `proc` table at HP-UX 11.1 the thread
    table has also been converted to a dynamic list.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # A Process and Its Threads


    On HP-UX operating system releases prior to 10.10, the kernel scheduled a process
    to run on the hardware to accomplish its programmatic tasks. By this model, a
    process lived a very solitary life and the programmer did not have to be concerned
    with the coordination of access to the process''s private system resources. While
    the kernel provided many forms of sharing between process views (shared memory,
    shared file access, memory-mapped files, and shared libraries to name but a few),
    process-private data could only be used or modified by the process''s single thread
    of execution.


    A process could only do one thing at a time. If it was blocking (or sleeping)
    on a physical action, such as waiting for operator input or a tape drive to rewind,
    then it was said to be in a *wait-state* or *sleeping*, and only when the blocking
    action was completed could it perform its next instruction. In the early days
    of computing this model served quite well, since most systems had very limited
    resources, single processors, and comparatively slow response times.


    System architectures progressed to include multiple processors under simultaneous
    control of a single kernel, referred to as symmetrical multiprocessing (SMP) systems
    (see Chapter 12, "Multiprocessing and HP-UX," for additional details on this aspect
    of the kernel). The next step was to devise a methodology whereby a single program
    could take advantage of SMP parallelism and execute tasks on several CPUs at the
    same time. This required a new breed of programmatic logic and gave rise to many
    innovations in operating system design. The challenge of parallelism with respect
    to the management of a process and its execution brought about the creation of
    multithreaded kernels.


    Thread-based structures were first introduced into the HP-UX kernel with the 10.10
    release (the initial threading of the kernel supported only a single thread per
    process, but it was a first step). With the release of HP-UX 11.0, the kernel
    became truly multithreaded; that is, a single process could have multiple user-space/kernel-space
    thread pairs performing tasks in parallel if it was on an SMP system. Even on
    a uniprocessor (UP) system, a process could spawn multiple threads, and they could
    compete for system resources: perhaps one could sleep waiting on user input while
    another processed existing data.


    A thread-based kernel manages a client program by first creating a unique process
    container by which it to track and manage the global attributes and allotted system
    resources of the program. Next, it creates one or more threads to implement the
    program''s instructions. These threads are schedulable entities. In effect, the
    venerable process was promoted to a management position—instead of actually doing
    the work, it now owns the resources and supervises and coordinates the actions
    of its subordinate threads.


    An operating system such as HP-UX (even before the implementation of kernel threads)
    was said to be *multi-process* or *multiple-tasking* in reference to its ability
    to switch or timeslice between completely independent sets of process instructions.
    Each process had use of the system''s resources and ran in a private context—without
    knowledge or interaction with other processes resident on the system. The kernel
    switched context from one to another, carefully managing the system resources
    so that each process had its own private view of "reality" and so'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'that they did not disturb the view of their neighbors. The kernel maintained
    peace in the commu-nity and made each process feel as if it were king of the hill.
    This type of process management required heavyweight context-switching system
    calls.


    A threaded process is one in which there may be several threads of execution simulta-neously
    contending for system resources. Unlike in the older multiprocess environment,
    a single process may have one or more concurrent threads. Multiple threads of
    the same process (called siblings) share the same system resource view. They share
    the same code, most of the same data space (each thread does have its own stack
    space and user area), and the same libraries and sys-tem resources. Since all
    the threads of a process are playing in the same sandbox, it becomes the responsibility
    of the programmer to develop strategies to assure that sibling don’t step on each
    other. To help in this task, many programming aids and libraries have been developed.
    The thread has become the schedulable entity and working incarnation of the program’s
    instructions and logic.


    Today many operating system kernels (including HP-UX) operate in a multiprocess
    and multithreaded environment. The kernel must manage many different process contexts
    and also must manage processes with multiple threads. To accomplish this, the
    kernel considers individ-ual threads, not processes, for scheduling. The thread
    becomes the active, working, schedulable entity for kernel management. This change
    in behavior between the process-centric and the thread-centric view of running
    a program is a seminal point in the evolution of operating system design.


    In HP-UX, the kernel must keep track of all active processes and each of their
    individual threads. This is accomplished by the creation of what many feel are
    the two most fundamental data structures in the operating system kernel: the process
    table and the kernel thread table.


    # Threading Models and HP-UX


    Several threading models are utilized in modern operating systems (see Figure
    4-3).'
  merge: -1
  img_proc: true
- pgno: 122
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_122_0.png)


    **M x 1** threading allows for a single kernel-level thread per process. In the
    user space, a user-level scheduler may be employed to approximate the actions
    of a multi-threaded environment. Programmers use user-space library routines to
    accomplish pseudo-scheduling and resource coordination. The library routines must
    monitor the individual user threads and context-switch if the current active thread
    is about to make a system call that would result in a blocking action. Once any
    of a process’s user threads blocks on a call, the entire process is placed in
    a wait state. Keep in mind that from the perspective of the kernel, this is a
    single-threaded model ( ergo the 1 in the M x 1 label). All of the scheduling
    is done by the user model, which results in a fairly low cost because the pseudo-scheduler
    does not encounter the additional overhead of system calls. While this is a plus,
    a big negative is that this model does not allow a process to take advantage of
    multiple CPU configurations.


    **1 x 1** threading does allow for multiple threads per process. In this model,
    there is a one-to-one relationship between kernel and user threads, and no user-space
    scheduler is allowed. The kernel scheduler works only with kernel threads and
    has no knowledge of what goes on in the user space. A process’s user threads are
    bound one-on-one to a kernel thread, which in turn is scheduled on a specific
    CPU. The scheduler runs in kernel space and requires heavyweight system calls
    to manage each processor’s run-queue. Processor run-queues are built by creating
    a linked list of kernel threads, *kthreads*, that share the same priority queue
    and processor affinity. The thread at the head of the list of the strongest active
    priority queue will be the next one scheduled. Once a kernel thread is scheduled,
    it may pass control to its user thread. We return to a kernel thread only when
    the user thread makes a system call or to the kernel proper upon receipt of a
    system interruption. While this model makes extensive use of system calls it allows
    a process to take advantage of parallel execution on SMP systems.


    **M x N** threading brings together both of the previous models. In this environment,
    the programmer may choose to employ a user-space scheduler or simply rely on the'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'kernel scheduler, or use a combination of both. On SMP systems, user threads
    may be multiplexed to several kernel threads or simply bound in a one-to-one fashion
    at the discretion of the application programmer. This gives the programmer the
    greatest degree of control when trying to optimize process performance.


    **Hewlett Packard is using a phased introduction of threading to the HP-UX kernel.**


    **Phase 1** occurred with the release of HP-UX 10.10. This involved modifying
    the kernel''s scheduling system to work with the newly created `kthread` table
    entries. For this release, only one thread of execution could exist per `proc`
    table entry. One could argue that this was not truly a threaded kernel; in effect,
    we were at the time merely “prepping the kernel for threads.” A limited form of
    threading known as user threads, or the M x 1 model (making use of the DCE libemacathreadsm
    library), was also available to programmers at this time.


    **Phase 2** came with HP-UX release 10.30/11.00, which adopted a threading model
    called 1 x 1 threading: for each thread spawned by a user process, there is a
    single unique kernel thread. This new capability allowed a process to spawn multiple
    sibling threads and, for the first time on an HP-UX system, allowed a process
    to take full advantage of SMP system parallelism. To facilitate this model, the
    POSIX kernel threads library, `libpthread`, was implemented.


    The release of HP-UX 10.30 (an early developers'' release for workstations) provided
    for compliance with the POSIX 1003.1b API for multithreaded application development.
    With the full HP-UX 11.00 release, more thread features were added to make it
    POSIX 1003.1c compliant.


    **Phase 3** will be implemented in a future release. This phase will adopt the
    M x N threading model. In this model a single kernel thread may be associated
    with one or more individual user threads. This is a very flexible model, but along
    with flexibility comes an added cost in the complexity of the programming. M x
    N threads should be available on HP-UX in the near future.


    # # The System Call Interface


    Each process thread consists of a bound user/kernel thread pair (unless a user-space
    scheduler is used). This thread is executing instructions from either the process''s
    user memory space or from the privileged memory space of a legitimate kernel system
    call at any one instance of time. In addition to the many process-based threads,
    at times the system is required to halt the execution of the currently scheduled
    thread and switch to a specific kernel-only thread for the performance of interrupt
    handling, scheduling, or a host of other operating system-related tasks.


    The transition between these various modes of operation is the study of the system
    call interface and the interrupt system (see Figure 4-4). We discussed the occurrence
    and handling of internal system-level interruptions in Chapter 1, “HP PA-RISC
    Architecture,” and we explore external interrupts in detail in Chapter 10, “I/O
    and Device Management.”'
