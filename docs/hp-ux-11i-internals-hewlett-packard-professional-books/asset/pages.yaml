    # Space Registers


    PA-RISC provides eight space registers. As with the general registers, the architecture
    provides for 64-bit wide registers on PA-RISC 2.0 and 32-bit wide registers on
    PA-RISC 1.1. However, on all current implementations of PA-RISC 2.0, the space
    registers are actually only 32 bits wide. The space registers are used in combination
    with the general registers to construct a virtual address. The space register
    can be either explicitly supplied in the instruction or implied by the value in
    the general register. The use of the space registers is covered in detail in the
    section "Virtual Memory Support."


    # Control Registers


    PA-RISC provides 32 control registers (see Figure 1-4). Again, in PA-RISC 1.1
    these are 32-bit registers, but in PA-RISC 2.0 they are 64-bit registers. Most
    of these are used when handling interruptions and are discussed in detail in the
    section "Interruption Handling."'
