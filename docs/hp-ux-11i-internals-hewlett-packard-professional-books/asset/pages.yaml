  md: 'This statement usually draws an assortment of looks or comments; indeed, some
    may question its basic premise or perhaps the qualifications of the one who spoke
    it! The essence that the statement is meant to draw out is that in the design
    of a UNIX operating system there are a few key elements (see Figure 3-1).


    +   * First, and most important, a UNIX operating system is responsible for the
    scheduling and management of individual threads of execution. Later, we discuss
    processes and threads, but for now let''s just consider a thread of execution
    as an operational piece of code, something that is accomplishing “work” on behalf
    of a “user.” Who gets to run, when, and how long are the issues under the control
    of the operating system.

    +   * UNIX is the ultimate control freak—it is prosecutor, judge, and jury for
    all code that attempts to circumvent its authority. The kernel manages access
    to all system resources. The only way executing code may make use of a system
    resource is to request access through well-defined programmatic kernel hooks (called
    system calls).

    +   * All I/O is file I/O. That is to say that all devices are defined by “special”
    device file handles and treated as if they are simple files.

    +   * All forms of synchronous and asynchronous interruptions are handled by kernel
    routines. Simply put, if it is unexpected, then let the kernel figure it out.

    +   * System resources should be available to all requestors in a balanced manner
    when possible.


    These are the prime directives of a UNIX kernel''s statement of design. While
    this may seem an oversimplification, it is our hope that by setting these elements
    as our focal points and by relating other topics and features back to them, we
    will stay on track.'
