    # Process Identity Crisis: The exec ( ) System Call


    When an established thread desires to replace its logical memory view with that
    of another program, "changing its stripes", so to speak, it places a system call
    to exec ( ). The exec ( ) call is passed the name of an executable file. The file
    may be either a compiled binary image or a text file to be processed as a script
    by an interpreter program such as the POSIX shell or PERL.


    In the case of a compiled program, the file starts with a header written in a
    format recognizable to the operating system and containing a "magic number" indicating
    the hardware platform, OS type, and version for which the code was compiled. If
    the magic number does not match those acceptable to the kernel, an error message
    stating "bad magic" is generated and the exec ( ) call fails. HP-UX 32-bit executables
    use the Spectrum Object Module (SOM) header format. The name echoes the history
    of the PA-RISC processor design, which was originally called the spectrum computing
    family. When the 64-bit PA-RISC hardware was introduced (PA-RISC 2.0), HP-UX adopted
    the POSIX ELF-64 header format for wide executables (there is an ELF-32 definition,
    but HP-UX does not currently use it).


    # The Kernel''s Draft Horse, getxfile ( )


    The exec ( ) call relies heavily on the kernel routine getxfile ( ) to do the
    majority of its work. The sequence of actions taken depends on the type of fork
    used to create the calling thread. The first challenge is to determine if the
    filename passed is a suitable object for running. A program file must not be open
    to any process for writing; the file must be executable on the system (magic number
    check), and the requesting thread''s UID or GID must have the proper credentials
    for execution. Assuming these tests are passed in the case of fork ( )/exec (
    ), the v as and pregion lists must be deconstructed, while for the v fork ( )/exec
    ( ) case, we must create a ua rea, vas, and pregion/region list from scratch.
    In both cases, getxfile ( ) must then build the new logical memory view in the
    system''s virtual space.'
