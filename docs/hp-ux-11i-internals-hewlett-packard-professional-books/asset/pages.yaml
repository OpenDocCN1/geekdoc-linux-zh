    # # Resource Allocation


    An early challenge for a kernel designer is to track the usage of a system resource.
    The resource may be memory, disk space, or available kernel data structures themselves.
    Any item that may be used and reused throughout the operational life cycle of
    the system must to be tracked by the kernel.


    # ## Bit Allocation Maps


    A bitmap is perhaps one of the simplest means of keeping track of resource usage.
    In a bitmap, each bit represents a fixed unit of the managed resource, and the
    state of the bit tracks its current availability.


    A resource must be quantified as a fixed unit size, and the logic of the bitmap
    must be defined (does a 0 bit indicate an available resource or a used resource?).
    Once these ground rules have been determined, the map may be populated and maintained.


    # ### Example


    In practice a resource bit map requires relatively low maintenance overhead. The
    actual size of the map will vary according to the number of resource units being
    mapped. As the unit size of the resource increases, the map becomes proportionally
    smaller, and vice versa. The size of the map comes into play when it is being
    searched: the larger the map, the longer the search may take. Let’s assume that
    we have reserved a contiguous 32-KB block of kernel memory and we want to store
    data there in 32-byte structures. It becomes a fairly simple issue to allocate
    a 1024-bit bitmap structure (128 bytes) to track our resource’s utilization. When
    you need to find an available storage location, you perform a sequential search
    of the bitmap until you find an available bit, set the bit to indicate that the
    space is now used, and translate its relative position to indicate the available
    32-byte area in the memory block.


    Pros


    The relative simplicity of the of the bitmap approach makes it an attractive first-pass
    solution in many instances. A small map may be used to track a relatively large
    resource. Most processors feature assembly language–level bit-test, bit-set, and
    bit-clear functions that facilitate the manipulation of bitmaps.


    Cons


    As the size of the bitmap increases, the time spent locating an available resource
    also increases. If there is a need for sequential units from the mapped space,
    the allocation algorithms become much more complex. A resource map is a programmatic
    agreement and is not a resource'
