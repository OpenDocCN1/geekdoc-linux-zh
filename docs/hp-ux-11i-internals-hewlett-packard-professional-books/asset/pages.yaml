    map pointing to the first line and stating that 20 lines were sequentially available.
    To list the first message, we would allocate the first three lines from the board,
    adjust our resource map entry to point to the fourth line, and adjust the count
    to 17. To add the second message to the board, we would allocate two more lines
    and adjust the first entry in the map to point to the sixth line, with the count
    adjusted to 15.


    In effect a resource map points to the unused “holes” in the resource. The size
    of the resource block tracked by each map entry varies according to usage patterns.


    # Pros


    A resource map requires relatively few actual entries to manage a large number
    of resources. If the allocation block size varies and needs to be contiguously
    assigned, then this may be your best bet.


    # Cons


    Map entries are constantly being inserted and deleted from the maps. This requires
    constant shifting of the individual map entries (the saving grace here is that
    there are relatively few entries). Another concern is the size of the resource
    map itself: if you run out of entries, then freed resources may not be accounted
    for and in effect will be lost (a type of memory leak) to system usage until a
    reboot.'
