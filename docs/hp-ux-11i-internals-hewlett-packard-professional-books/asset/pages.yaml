    of Autoboot and Autosearch.


    # **Table 15-1** Autoboot and Autosearch


    | **Autoboot** | **Autosearch** | **Nickname** |  |

    |---|---|---|---|

    | OFF | OFF | Manual boot | BCH interacts with the user to get the boot path.
    |

    | OFF | ON | Boot search | BCH finds all bootable paths and presents the user
    with a list. The user must choose a boot path from the list. |

    | ON | OFF | Auto boot | BCH attempts to boot from the primary path. If the boot
    fails, BCH prompts the user. |

    | ON | ON | Auto search | BCH first tries the primary path. If that fails, BCH
    searches for bootable devices and tries to boot each one in turn. |


    PDC expects a bootable device to begin with a logical interchange format (LIF)
    volume. More information about the format of a LIF volume can be found on the
    lif(4) man page. PDC looks for a LIF header at the beginning of the bootable device.
    Within this header is a value called `IPL_ADDR`, which is the offset of the initial
    program loader (IPL). Also in the header are `IPL_SIZE` and `IPL_ENTRY`, which
    specify the size of the IPL program and the address of the entry point to the
    program. PDC loads the IPL program into memory, then branches to the start address.


    The PA-RISC platform can run a variety of operating systems, including HP-UX,
    MPE, and Linux. The IPL program for each operating system is different. For HP-UX
    the IPL program is called ISL, for initial system loader.


    # ISL: The Initial System Loader


    ISL also uses the `Autoboot` flag and the LIF volume. In an interactive boot,
    ISL displays a prompt and waits for a command. From ISL, the user can perform
    a variety of low-level maintenance functions, including updating the stable storage
    flags, changing boot and console paths, and examining the LIF volume contents.
    In an automatic boot, ISL looks in the LIF volume for a file called `AUTO`. Reads
    a line from that file, and uses that as a boot command.


    Normally, the `AUTO` file contains a single line that just reads `hpxux`. `hpxux`
    is the name in the LIF directory of the program that handles the next step in
    the boot process: the `HPUXBOOT` secondary loader. The header of `HPUXBOOT` contains
    its load address and entry point address.'
