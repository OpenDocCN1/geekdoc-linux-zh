- pgno: 58
  md: '# Interruption Handling


    The four different groups of interruptions become significant when we look at
    how interruptions are handled.


    Group 1 consists of just the HPMC. This interruption is generated when the hardware
    detects an unrecoverable error. It can occur at any time asynchronously with the
    instruction stream and is acted on immediately.


    Group 2 interruptions are checked immediately at the beginning of an instruction
    cycle. These interruptions are handled before the next instruction is fetched.


    The system next checks the N-bit in the PSW, which indicates a nullified instruction.
    A nullified instruction is an instruction that should be skipped. In Chapter 2,
    we talk about how and why it is used. For now, it’s enough to know that if the
    N-bit is on, the next instruction isn’t even fetched—we just increment the program
    counter and start the next cycle.


    If the N-bit is not set, the system fetches the next instruction, begins execution
    of the instruction, and advances the program counter. If the execution of the
    instruction causes a Group 3 interruption, the program counter is decremented,
    the PSW is reset to its previous state, and the interruption is handled. This
    means that when the interruption handler finishes, the instruction will be restarted.
    If the instruction causes a Group 4 interruption, the handler is branched to directly
    without backing up the program counter, so the instruction will not be restarted.


    # Interruption Save State


    When an interruption occurs, the system must save its current state before branching
    to the interruption vector. Control registers 17 through 22 are used to save the
    interruption state. For each interruption, the system takes the following actions:


    +   • The PSW is saved in CR22. For groups 2 and 3, this will be the PSW at the
    beginning of the instruction. For group 4, it will be the PSW at the end of the
    instruction.


    +   • The PSW is cleared except for the W-, E-, and M-bits. This has the effect
    of disabling all lower priority interruptions.


    +   • The current instruction space and offset are stored in control registers
    17 and 18.


    +   • The privilege level is set to 0.


    +   • The instruction that was executing at the time of the interruption is stored
    in CR19.


    +   • The address associated with the interruption is stored in control registers
    20 (space) and 21 (offset). In this way, a faulting address is passed to the fault
    handlers.'
  merge: -1
  img_proc: true
