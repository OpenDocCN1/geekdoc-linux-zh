  md: "disable swapping for the parent (after all, we will be copying the parent’s\
    \ memory view to the child and don’t want `whand` attempting to swap it out while\
    \ we are making our copy). \nNow, as we are rounding the far turn and entering\
    \ the home stretch, control is passed to `proc_dup()`, where we start duplicating\
    \ the parent `vas`, `pregion`, and private region structures to create a new memory\
    \ view for the child.\n\n# ## Copying a Process Memory View\n\nThe kernel manages\
    \ regions of pages to be used by a process for any of a number of purposes. Each\
    \ process maintains its own virtual memory view, facilitated by assigning virtual\
    \ space values to work in conjunction with an offset address for each region.\
    \ Since the virtual view belongs primarily to the process, it is the process `pregion`\
    \ that `p_entry` and `p_vaddr` (the space and offset used to create a virtual\
    \ address) are recorded. The entire `vas/pregion` structure of the parent process\
    \ must be duplicated for the child and attached to its `proc` structure (using\
    \ `p_was`).\n\nThe kernel checks each `pregion` in the parent’s list to see if\
    \ it points to a region of type `RT_SHARED` or `RT_PRIVATE`. In the case of a\
    \ shared region, the kernel needs only copy the `pregion` to the child’s list\
    \ and increment the reference count (`r_refcnt`) in the region. In the case of\
    \ a private region the kernel must build a duplicate `pregion` and `pregion` and\
    \ map it to the child’s list. This involves duplicating the region’s page list\
    \ (containing the b-tree’s `root`, `hnodes`, and chunks) and reserving swap space\
    \ for it and for the potential number of pages it could map. A unique “space”\
    \ value must also be obtained so that the child will have its own virtual view.\n\
    \nThis is where copy-on-write comes into play. As a duplicate private region is\
    \ created, all of its `vfds` are set to copy-on-write, and any in-core page frames\
    \ have their usage count incremented (`pf_use++`) in their `p_fdat`. The page’s\
    \ entry in the `pdix` is flagged for copy-on-write behavior (this includes updating\
    \ multiple `pdexs` in the case of an aliased page), and any existing `t1b` entries\
    \ are purged. This assures a page fault on first access and allows the fault handler\
    \ to update access information and physical page copying at the time if necessary.\
    \ In the case of a child making an immediate `exec()`, we have minimized the amount\
    \ of page copying done at the time of the `fork()`.\n\nLet’s examine what happens\
    \ when a copy-on-write page is accessed.\n\n# ## Copy-on-Write, First Read Access\
    \ from the Parent\n\nIf the first access to the page is by the parent, the system\
    \ experiences a `t1b` fault (since we purged the `t1bs` during the region duplication\
    \ process). The resulting fault loads the translation from the `pdix` and sets\
    \ the copy-on-write access bit. \nWe try one more time and, as there is now a\
    \ valid translation in the `t1b` and this is a read request, access is granted\
    \ (effectively creating a *shared read* access mode)."
