- pgno: 393
  md: 'We do have information in memory from PDC that we can use—for example, the
    location of the IODC routines and the size of memory. Also, HPUXBOOT is still
    in memory and we have pointers to its I/O routines to help out with doing disk
    I/O.


    # Real-Mode Initialization


    The entry point for the kernel is an assembly language routine called rdb\_bootstrap().
    RDB refers to the remote debugger used internally by Hewlett-Packard. This is
    the first point in the kernel at which the debugger can start managing the kernel.
    rdb\_bootstrap() turns off interrupts and initializes the interrupt vector table
    so that we’ll be ready to handle any interrupts that come in. It also creates
    the first procinfo structure, mproc\_info[0], and fills it with information about
    the monarch. It sets CR24 to point to this procinfo structure. If the kernel is
    compiled for 64-bit operation and the hardware is 64-bit-capable, rdb\_bootstrap()
    turns on the w-bit in the Processor Status Word to enable wide mode.


    rdb\_bootstrap() then has to get ready to make a call into C code. It sets up
    the stack pointer (GR30) and global data pointer (GR27), creates a calling stack
    from, then calls real-main().


    realmain() handles the portion of kernel initialization that must be done in real
    mode before we turn on virtual address translation. Realmain() does its work by
    using a callist— an array of pointers to functions. The only line in realmain()
    is a call to DoCallist(), passing realmain\_callist as the first argument. DoCallist()
    iterates over the functions in the realmain\_callist array, calling each one in
    turn. The callist itself is constructed when the kernel is compiled, using an
    English-like file that describes the order of the initialization routines. This
    file contains the name of each routine to be called along with constraints on
    the order of execution—which other routines it must run before or after. A program
    parses this file at compile time and creates the callist.


    The realmain callist contains close to 100 routines. The following is a summary
    of the general functions performed by the realmain callist.


    +   1.  Set the transfer of control (TOC) vector in page zero of memory.

    +   2.  Copy the arguments passed by HPUXBOOT from HPUXBOOT’s address space into
    the kernel’s.

    +   3.  Create a temporary resource map for the IMM, indicating that memory currently
    used by the kernel image is busy and the rest is free. This will be used to allocate
    memory before the virtual memory allocator has been set up.

    +   4.  Allocate and initialize systemwide spinlocks.

    +   5.  Allocate buffers for IODC to use to dump memory in the event of a panic.

    +   6.  Initialize the monarch by setting up its HPME handler, filling in information
    about the processor type and enabling its coprocessors.

    +   7.  Purge the TLB, then initialize TLB entries for kernel and graphics.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '+   8.  Call `pa_memory_init()`, which scans the central bus for memory modules
    not yet initialized. Any memory modules found are initialized and added to the
    native module tree.


    +   9.  Create another resource map `real_free_map` to be used to track available
    pages now that we have initialized the rest of memory. The resource map we had
    been using is copied into this new one.


    +   10. Create the 32-bit and 64-bit resource maps `sysmap_32bit` and `sysmap_64bit`.


    +   11. Using the routines provided by HPUXBOOT, read the LVM configuration from
    `/stand/rootconf` and the stored I/O configuration from `/stand/ioconfig`.


    +   12. Perform first-level I/O configuration. This calls `pa_module_init()` to
    scan the system''s busses looking for modules. Each module is added to the `native_mod_tree`.
    If the module is a processor, it gets a crash table entry; if it is an I/O module,
    the module is reset and interrupt handlers are set up for the module.


    +   13. The `fixed_mod_table` (from `/stand/ioconfig`) gets merged with the `native_mod_table`,
    which contains devices we''ve discovered.


    +   14. The space used by HPUXBOOT is now freed—it is no longer needed.


    +   15.  Allocate and initialize a number of kernel data structures. These include:


    +   •   The `pgclass` table, used by `crashconf(1m)` to mark which pages to dump
    in the event of a panic

    +   •   `mproc_info` structures for non-monarch processors

    +   •   `pdir` locks, the page directory, and the `pfn_to_virt` table

    +   •   The I/O alias table

    +   •   The space map

    +   •   The inode table

    +   •   The file table

    +   •   The directory name lookup cache (DNLC)

    +   •   The `proc` and `kthread` tables

    +   •   Physo''s private buffer pool

    +   •   Processor save state areas

    +   •   Callouts

    +   •   Resource allocation maps for quadrants 2, 3, and 4


    +   16.  Handcraft `proc[0]`, the swapper. Assign it to `kthread[0]`. Create a
    virtual address space for it, and manually map it to a real address.


    +   17.  Allocate and initialize processor idle stacks and non-monarch interrupt
    stacks.


    +   18.  Map any extra I/O register sets into virtual space


    +   19.  Each page we allocated so far while in real mode is inserted into the
    `pdir` and reserved in `sysmap_32bit`.'
