- pgno: 350
  md: '# CHAPTER 12


    # Multiprocessing and HP-UX


    There are many challenges in the implementation of a multiprocessor computer system.
    One of the first decisions to be made is whether the system will be symmetric
    or asymmetric. In a symmetric system, all processors have equal access to the
    system and play equal roles. In an asymmetric system, one processor is “in charge,”
    and it delegates work to the others.


    With the exception of some boot time tasks, HP-UX is symmetric. During boot, one
    processor does the initial bring-up, but once the other processors are started,
    all have equal access. (See Chapter 15, “System Initialization,” for details of
    the system boot process). The HP-UX implementation has the following characteristics:


    +   * Each processor has equal access to all system resources.

    +   * System memory is shared by all processors.

    +   * All I/O devices are shared by all processors.

    +   * All processors execute a single copy of the kernel.


    As with any design consideration, there are benefits to this design and there
    are design challenges. In this chapter, we look at how we take advantage of the
    benefits of multiprocessing and how we address some of the problems caused by
    having multiple processors.


    # Hardware Overview


    Figure 12-1 shows an example of a typical multiprocessor system.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_350_0.png)'
  merge: -1
  img_proc: true
- pgno: 351
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_351_0.png)


    # **Figure 12-1 A Typical Multiprocessor System**


    Note that while the multiprocessors share the system memory and I/O, each has
    its own cache and TLB. In order to get the necessary speed benefits from the cache,
    the cache has to be physically close to the CPU. But this brings up another example:
    how do you maintain consistency between the caches on the various processors?
    For example, say processor A and processor B both have the same memory address
    cached in their respective data caches. If processor A modifies the data at that
    address, it will change the copy in its cache and mark the cache as dirty, but
    it will not necessarily write that data to main memory immediately. The data that
    processor B has in its cache is now no longer valid.


    We get around this problem with a *cache coherency check transaction*. Every time
    a processor modifies data that is in its cache, it sends out a cache coherency
    check transaction. All other processors must check their caches to see if they
    have copies of the data in their own caches. If a processor has the data in cache
    and it has been modified, then the data is immediately flushed to main memory.
    Then that cache line is marked invalid so that the next time it is data is needed,
    it must be read from memory again.


    To use our example from above, when processor A wants to modify the data, it first
    sends out the cache coherency check transaction. Processor B sees this transaction
    and finds that it has that address in its own cache. If the cache line in processor
    B''s cache is dirty, meaning that it needs to be written to memory, processor
    B immediately flushes that cache line out to memory. It then marks the cache line
    as invalid so that if it needs the data again later, it will have to load it from
    memory. If processor B has the data in cache but has not modified it (it is “clean”),
    then it just has to invalidate the cache line.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'Multiprocessing Data Structures


    # Multiprocessing Data Structures


    Each processor has a data structure that is used to keep track of data specific
    to that processor. This structure is of type struct **mpinfo**, which is typedefed
    to **mpinfo_t**. The global vari-able **mpproc_info** is declared as a pointer
    to a struct **mpinfo**. At boot time, the system allocates enough memory to hold
    one struct **mpinfo** for each processor. It then points **mpproc_info** to the
    beginning of this allocated memory. In this way, **mpproc_info** can be used as
    an array of struct **mpinfo** by using the processor index. For example, **mpproc_info[0]**
    is the **mpinfo** structure for the first processor in the system. The **mpinfo**
    structure is also sometimes called the *per-processor data pointer* (PPDP).


    The **mpinfo** structure is a huge structure—over 13 KB in an 11.11 system. A
    large por-tion of this is the **ki_proc_info_data**. This structure is used for
    kernel profiling and trac-ing, and has counters to keep track of **syscall** and
    procedure calls. Table 12-1 lists some of the more useful and interesting members
    of the **mpinfo** structure. Note that the code uses the terms “processor” and
    “SPU” interchangeably. An SPU is a System Processor Unit.


    **Table 12-1 The mpinfo Structure**

    | Type and Name | Description |

    | :--- | :--- |

    | procpa | Pointer to the processor''s hard physical address (HPA) |

    | iva | Interrupt vector address |

    | procindex | Processor number |

    | spinlock_depth | Number of spinlocks held |

    | entry_int_level | Interrupt level the processor was at when the first spinlock
    was taken |

    | spu_state | State of the SPU: one of SPU_ENABLED, SPU_DISABLED, SPU_PENDING,
    SPU_INTR_ENABLED, SPU_DISABLED_HW_FAILURE |

    | threadp | Pointer to the current thread structure |

    | ureasid | Space ID of the urea structure |

    | prethreadp | Pointer to the previous thread structure |

    | mpctras | Per-processor counters |

    | mp_rq | Run queues |



    The **mpctras** member has some interesting information in it and is worth a further
    look (Listing 12.1).'
