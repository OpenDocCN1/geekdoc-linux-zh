  md: 'ume information. The MCR provides space for the mirror write cache (MWC) consistency
    data stored on the drive. As with the PVRA, there are duplicates of each structure.
    Figure 11-5 illustrates the PVRA and VGRA in greater detail.


    After the VGRA is the bulk of the disk''s space, the area mapped as physical extents.
    Only whole extents may be allocated within LVM, so a partial extent will remain
    unused. The worst case for this would be a wasted space slightly smaller than
    the basic extent size. This is one consideration when deciding on the extent size:
    the larger the extent size, the larger the possible waste may be. Considering
    that the size of modern disk drives is in gigabytes, the potential to waste less
    than 4, or even 8 or 16 mega-bytes, doesn''t seem to be much of a concern.


    Bringing up the end is an area for bad block relocation, known as the bad block
    pool, and a small optional structure for cluster-locking information if the volume
    group is to be used in conjunction with an HP Service Guard cluster environment.
    Bad block relocation under LVM control may be disabled during configuration. Considering
    that most modern disk drive controllers handle the relocation of bad blocks, many
    administrators choose to disable bad block checking within LVM.


    # ## The PVRA and VGRA


    The kernel defines the location of several key structures on an LVM physical volume
    (see Table 11-1). Disk drives are block-oriented devices. Access to their data
    must be performed a sector at a time. The basic size is either 1 KB per sector
    or 2 KB per sector on newer drives. The primary LVM record is located at sector
    8. The primary bad block directory is at sector 9 for 1 KB/sector drives and at
    sector 10 for 2 KB/sector drives. The secondary LVM record starts at sector 72.
    The secondary bad block directory is at sector 73 for 1 KB/sector drives and at
    sector 74 for 2 KB/sector drives. Overall size of the PVRA is set to 128 sectors,
    and the bad block directory is set to 55 sectors.


    **Table 11-1 Kernel Parameters for LVM Disk-Set Structures**


    | Kernel | # define | Sector # |

    |:---|:---|:---|

    | Primary LVM record | PVRA_LVM_REC_SN1 | 8 |

    | Primary bad block directory | PVRA_BBDIR_SN1 | 9 (or 10) |

    | Secondary LVM record | PVRA_LVM_REC_SN2 | 72 |

    | Secondary bad block directory | PVRA_BBDIR_SN2 | 73 (or 74) |

    | Primary boot data record | BDRA_BDR_SN1 | 128 |

    | Secondary boot data record | BDRA_BDR_SN2 | 136 |

    | Overall size of the BDRA | BDRA_SIZE | 16 |

    | Length of the boot disk record | BDRA_BDR_LENGTH | 2 |

    | Length of the physical volume list | BDRA_PVL_LENGTH | 6 |'
