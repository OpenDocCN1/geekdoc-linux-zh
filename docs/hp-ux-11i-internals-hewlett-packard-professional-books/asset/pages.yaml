- pgno: 285
  md: '# **Figure 9-2** The fork()


    When a page fault occurs for one of these pages, the kernel fault handler discovers
    a valid vfd entry. If the parent causes the fault, there is an entry in the pdir;
    if the child causes the fault, there is no pdir entry, as it is using a newly
    allocated space ID and thus has its own unique virtual page number. This seeming
    inconsistency in the synchronization of the various kernel and process memory-mapping
    structures is used to determine the disposition of the fault.


    If either thread (parent or child) is attempting a first write, a copy of the
    page data is made and mapped to the faulting thread''s region. A first read request
    by the parent is allowed, but if the request is from the child (indicated by the
    lack of a valid pdir entry), the kernel makes a copy of the data page for the
    child and maps it to the appropriate kernel tables. In this manner, each process
    ends up with its own private copy of the data, but the overhead of creating the
    page copies is postponed until they are actually accessed. If the fork() is followed
    by an exec(), we will not have wasted our time copying pages unnecessarily.


    Later, Hewlett-Packard upgraded its fork() call to work with full copy-on-write
    access rules. As the parent and the child each has its own private page quadrants
    with unique space IDs, the kernel needed the ability to alias a single physical
    page to multiple virtual pages. This feature was introduced with the HP-UX 10.0
    kernel release. The advantage to true copy-on-write is that a read access by either
    the parent or the child is allowed to function in a shared mode, avoiding the
    overhead of a page copy. In the case of a write request, a copy is made if the
    page shows more than one virtual address currently mapped (this means that the
    last to access the page ends up with the original copy).


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_285_0.png)'
