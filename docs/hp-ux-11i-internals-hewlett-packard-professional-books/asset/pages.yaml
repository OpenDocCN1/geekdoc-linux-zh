    # ## Connecting an Open File to a Process


    We have seen that the **proc** structure is the base of all process-related kernel
    structures. The definition of a process''s resources includes mapping opened files
    to per-process file descriptors (see Figure 8-16).


    From the kernel''s point of view, each distinct file `open()` call must be tracked,
    which is accomplished by making entries in the system file table. From the process''s
    point of view, it is only concerned with its own file descriptors, but the kernel
    must manage all `open()` calls.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_270_0.png)


    The number of file descriptors a single process may have is controlled by the
    kernel-tunable parameters `max_files` (for a regular user process) and `max_files_lim`
    (for a superuser process), and may be set up to 60,000. The default is 60 and
    is usually sufficient, considering that most processes only need to map `stdin`,
    `stdout`, and `stderr`.


    To avoid wasting kernel memory space, process file descriptors are stored in blocks
    of eight for HP-UX 11.11 (HP-UX 11.0 used 32 descriptors per block), and the blocks
    are referenced through a partition table pointed to by the **proc** structure.
    Additional blocks are allocated as needed by the kernel.


