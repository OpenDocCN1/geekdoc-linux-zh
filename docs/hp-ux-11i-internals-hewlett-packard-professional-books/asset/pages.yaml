    +   * `PR_SCHED_BASE = 0`: Strongest internal priority.

    +   * `RT_SCHED_NUM_PRI_FLOOR = 32`: Minimum number of POSIX queues.

    +   * `MAX_RT_SCHED_PRI = 512`: Maximum number of POSIX queues.

    +   * `RT_SCHED_NUM_PRI_CEILING = ?`: Tunable number of POSIX queues (defaults
    to 32).

    +   * `PRT_BASE = 512`: Strongest HP Real time priority.

    +   * `PTIMESHARE = 640`: Strongest timeshare priority.

    +   * `PMAX_TIMESHARE = 767`: Weakest timeshare.

    +   * `pzero = 153`: Uninterruptible sleep upper limit.

    +   * `puser = 178`: Start of the user-start priorities.

    +   * `timeslice = ?` (default is 10): Number of 10-ms ticks a thread is allowed
    before a voluntary context switch is called by the kernel.


