- pgno: 284
  md: 'called in prelude to an `exec()` call, then much of this work was almost immediately
    decon- structed, as the kernel replaced the original process view with the new
    one.


    # Another Approach: The Berkeley Virtual Fork


    With the introduction of Berkeley''s virtual memory UNIX kernel, a new “virtual”
    fork call was added to the growing system call list. The Berkeley kernel hacks
    decided that in the case of a “`fork()`” immediately followed by `exec()`” scenario,
    it would make sense to simply allow the new child process to run in the parent''s
    virtual memory space until it was time to start building its own view. This methodology
    was implemented in the Berkeley `vfork()` call.


    The idea behind the `vfork()` may seem very logical at first, but it flies in
    the face of many basic UNIX rules. The basic kernel memory management subsystem
    is designed specifi- cally to make sure that one process doesn''t corrupt the
    memory space of another. With the `vfork()`, there is no such protection between
    the parent and the newly created child. A child process of a `vfork()` should
    not modify any of the parent''s data, but this is only a program- ming convention,
    and in actual practice there are no guarantees. To some, this aspect of Berke-
    ley''s `vfork()` was considered a bug, while other creative programmers considered
    it a feature and used it to provide a very primitive form of threading. We don''t
    recommend this approach by any means! To address these concerns, Hewlett-Packard
    made several modifications to the basic `fork()` and `vfork()` calls over the
    years.


    # HP''s New and Improved `fork()`


    To improve system performance and avoid the potential corruption of the parent
    data by the child during a `vfork()`, HP reworked the mechanics of the basic `fork()`
    call and redirected the `vfork()` call to the same entry point in the kernel.


    Hewlett-Packard''s `fork()` was built around the concept of copy-on-write for
    the parent and copy-on-access for the child (referred to after this as copy-on-write/access).
    As in the older fork model and as illustrated in Figure 9.2, a new process structure
    is allocated and the parent''s `vas`, `preigion`, and private memory structures
    are copied. What makes this version different is that while private memory `region`
    structures are copied, their current in-core pages are not. Active `vfd` entries
    in the newly copied child `region` point to the same physical pages as those of
    the parent. This means that the parent and child have access to the same physical
    data space. To assure that no data corruption occurs, all the core resident data
    pages have their `pdirt` entries, and `tlb` entries invalidated.'
