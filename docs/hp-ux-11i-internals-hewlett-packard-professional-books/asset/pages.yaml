    # The Buffer Cache


    Just as the kernel keeps copies of open inode data in a cache, it also maintains
    a much larger cache of recently accessed file data blocks (or extents, depending
    on the type of file system). This buffer cache is a key component of the HP-UX
    operating system. Figure 8-17 provides an overview of the buffer cache design.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_272_0.png)


    A basic premise of the UNIX operating system is that every thing is a file. This
    model serves many purposes and greatly reduces the overall complexity of the operating
    system. With this in mind, it is understandable that everything that may be done
    to improve file performance provides a large payback.


    # Being Flexible: The Dynamic Buffer Cache


    The HP-UX implementation of a buffer cache follows a dynamic model. The buffer
    cache is mapped into the kernel''s address space, but the physical pages allocated
    to it come from the same available memory pools as those used for user processes.
    In this manner, the buffer cache competes with user code for system memory resources.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'The kernel allows the administrator to set a maximum and minimum percentage
    of the available memory that may be allocated for buffer cache use. Remember that
    *available memory* means the amount of physical memory remaining after the kernel
    allocates pages for its exclusive use during system initialization. The kernel-tunable
    parameters to enable a dynamic buffer cache are:


    +   * dbc_min_pct: Minimum percentage of available memory that may be allocated
    for buffer cache use

    +   * dbc_max_pct: Maximum percentage of available memory pages that may be allocated
    for buffer cache use


    If the `dbc_min_pct` is set equal to or larger than the `dbc_max_pct`, then the
    dynamic buffer cache is capped at the size dictated by `dbc_min_pct`. This presents
    what at first seems to be a conundrum. How can it be a dynamic buffer cache if
    the size is fixed? While the size is fixed, it is simply a targeted value and
    not an absolute. As long as the buffer cache is considered to be dynamic, its
    pages may be aged and stolen by the vhand daemon during times of heavy memory
    pressure. This means that while the overall size appears to be static, the specific
    pages allocated to the cache may change from time to time, so they are considered
    dynamic.


    If these two dynamic tunables are not set, then the following older kernel parameters
    take effect and the cache is flagged as static; that is, pages once allocated
    to the cache remain there and vhand cannot scan them.


    +   * nbuf: Number of buffer headers

    +   * bufpages: Number of buffer pages


    Once a buffer has been populated with a copy of file data, the kernel needs an
    efficient method to search for it in the cache. This is accomplished through the
    use of a hash (by now you expected this, didn’t you!).


    # The Buffer Cache Hash


    Figure 8-18 illustrates the basic design of the buffer cache. Individual buffers
    are pointed to by buffer headers’ which are arranged in hash chains. In the case
    of a read(), the hash offset is calculated using the device number and block offset
    (obtained from the vnode) for the requested disk data.'
