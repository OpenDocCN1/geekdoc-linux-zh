    # ## Additional Resource Pointers


    In addition to the various structures we have mentioned in this chapter, the proc
    structure provides pointers to a process''s file descriptor and kernel signal
    structures. These are covered later in this book.


    # ## Process/Thread Scheduling


    Now that we have seen the fundamental structures used to define a process''s logical
    space and assign system resources, we must consider the task of scheduling threads
    for execution. This is one of the kernel''s primary responsibilities and requires
    a considerable number of system resources. Traditionally, UNIX is designed to
    be a load-leveling operating system: that is, the kernel attempts to distribute
    access to system resources in an equitable fashion to all active threads. While
    this is a noble cause, at times you might like certain threads to receive a larger
    (or possibly smaller) share of the kernel''s attention. Many operating systems
    accomplish this by assigning a priority to a job. UNIX has priorities but they
    don''t function exactly the way you might suspect.


    HP-UX uses priorities to place threads in an appropriate run queue. When a processor
    needs to determine what to do next, it simply goes to its strongest active run
    queue and context switches to the first thread in the queue. A thread''s position
    in a run queue is subject to possible kernel-induced priority decay, "voluntary"
    time slicing (round-robin queueing), and preemption'
