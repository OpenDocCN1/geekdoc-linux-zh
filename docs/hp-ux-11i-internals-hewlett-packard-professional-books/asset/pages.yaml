  md: '# ## Central Bus CDIO


    The CB_CDIO is a special case of a CDIO. It is installed like any other CDIO and
    interfaces with GIO in the same way. But its job is to manage the central bus
    of the system rather than a particular I/O environment or set of drivers. Every
    system has the CB-CDIO compiled into it.


    Up through release 11.0 of HP-UX, much of this functionality was provided by a
    CDIO called the Precision Architecture CDIO (PA-CDIO). This CDIO supported the
    PA-RISC specific portions of the kernel. When Hewlett-Packard began looking at
    porting the HP-UX system to other platforms, it became apparent that a more generic
    interface was needed to support the platform hardware. So, with HP-UX 11.0 release
    990P, Hewlett-Packard removed the PA-CDIO and replaced it with the CB-CDIO.


    One of the key features of the CB-CDIO is the support for PSMs. A PSM is a piece
    of code that installs into the CB-CDIO just as a device driver installs into other
    CDIOs. But rather than supporting a particular type of device, a PSM supports
    a particular platform’s specific functionality. These can support a particular
    functionality, such as the o1ar_psm, which supports OLAR, or they can support
    particular system hardware such as the sapic_psm, which supports a particular
    programmable interrupt controller (PIC). Providing PSMs as modules that can be
    loaded as if they were device drivers allows the kernel to include only those
    PSMs needed on a particular platform. In fact, it is possible for PSMs to be dynamically
    loaded after boot time, just as a driver is, to enable new platform functionality.


    The CB-CDIO provides a wide range of functionality to the kernel:


    +   * **GIO Interface**: The CB-CDIO has to follow all the rules of any CDIO,
    so it must implement the standard interface to the GIO.

    +   * **PIK Interface**: The platform-independent kernel (PIK) interface contains
    routines that provide services to kernel functions that are the same across all
    platforms.

    +   * **PDK Interface**: The platform-dependent kernel (PDK) interface provides
    services to those parts of the kernel that are unique to a particular platform.

    +   * **PSI Switch Table**: The platform support interface (PSI) switch table
    provides the access to the underlying PSM.


    Another important feature provided by the CB-CDIO is I/O forwarding. I/O forwarding
    is the process of having I/O requests issued by the processor that will receive
    the interrupt when the I/O completes. Remember that each I/O module is told at
    boot time what interrupt it should generate and which processor it should interrupt.
    In this sense, each module is “owned” by a particular processor. Ideally, we want
    the I/O to complete on the same processor on which it started. This improves performance
    because data is more likely to be associated with the I/O in the cache. The CB-CDIO
    manages this by maintaining an I/O queue for each processor, called mp_io_queue.
    When a driver is ready to queue an I/O request to be started, it calls ioiorw_scheduled()
    to have the I/O placed on the queue of the correct processor. CB-CDIO maintains
    a map, called io_or_forw_map, which maps devices to the processors that handle
    the'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'interrupts for those devices. ioforw_sched() places the I/O onto the mp_io_queue
    for the correct processor, and that processor then starts the I/O. This way, when
    the interrupt comes back from the device at I/O completion, that processor is
    likely to have the relevant data in its cache.


    # ## I/O Odds and Ends


    There are a few I/O topics that don’t really fit into the categories we’ve talked
    about so far, but they are worth knowing about.


    # ### Device Files and the Device Switch Table


    Device files in HP-UX are represented by two numbers: a major number and a minor
    number. Within the kernel, these two numbers are concatenated to form a single
    32-bit value known as a dev_t. The first 8 bits of the dev_t are the major number,
    and the remaining 24 bits are the minor number. The major number is associated
    with a driver through the device switch tables, which we talked about earlier.
    The minor number is passed as an argument to that device driver’s routines.


    As an example, let’s say we want to do an open() system call to a tape device
    called /dev/rmt/c0t3d0BESTnb. The major number for this device is 205 (decimal),
    and the minor number is 0x0030c0. Within the kernel, this is a dev_t value of
    0xcd0030c0. The kernel handles this open request by looking in the device switch
    table and finding entry 205, then calling the routine pointed to by the d_open
    field in that entry: the function stage_open(). The first argument to stage_open()
    is the dev_t that we’re opening. In this example the SCSI tape driver is part
    of the WSIO CDIO, and as such it gets access to common SCSI services. One of the
    first things that stage_open() does is call scsi_run_open(), again passing the
    dev_t. scsi_run_open() decodes the dev_t into card, target, and logical unit numbers
    (LUNs), and does what it has to do to open the correct target and LUN. stage_open()
    now interprets the remaining bits in the dev_t in its own way and determines that
    this is a no-rewind Berkeley tape device file.


    # ### The iooconfig File


    The iooconfig file is a persistent version of the iotree. That is, it is a place
    on disk where I/O configuration can be stored so that it will exist from one boot
    of the machine to the next. There are actually two copies of the iooconfig file
    on a system—one in /etc/iooconfig and another in /stand/iooconfig. The copy in
    /etc/iooconfig is the authoritative copy, and the one in /stand is a backup in
    case the /etc directory is unavailable at boot time.


    During system startup, the ioinit program is run from /sbin/iointrlc (which in
    turn gets started by init). ioinit compares the two files to see if they match.
    If they don’t,'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'the one in `/etc` is written over the top of the one in `/stand`. Then `iomin`
    reads the configuration information from the file and uses that to rebuild the
    `iottree` entries from the previous boot of the system. This ensures that instance
    numbers and major numbers won''t change between one boot and the next.


    # Instance Numbers


    So, what are these instance numbers that the `iocconfig` is keeping for us? An
    instance number is just a way of uniquely identifying a particular card. Card
    types are assigned a class by the driver that claims them. This class might be
    `tty` for a serial interface, `lan` for a LAN interface, or `ext_bus` for a device
    like a SCSI card that supports multiple remote devices. Within these categories,
    each card is given an instance number, so if, for example, we might have `ext_bus`
    numbers 0, 1, and 2 in a particular system. Each number corresponds to a particular
    card. The numbers are assigned by the G10 when they are bound to a driver, and
    they need not be sequential. They must be unique within a class but not across
    classes, so you can have only one `ext_bus0`, but you can also have a `lan0` and
    a `tty0`.


    These numbers are generally represented as a part of the minor number of the device
    file. In our SCSI tape example the `ext_bus` instance was 0 (for the SCSI card
    0) and is represented by the `eo` part of the device filename and by the `0x00`
    in the upper byte of the minor number.


    1/0 Merging1 is important that these instance numbers not change once they''ve
    been discovered, which is why we have the `iocconfig` file. If we reassigned the
    instance numbers at each boot, then removing a card or adding a new card could
    cause the instance numbers to change, meaning that the device files would now
    be pointing to different devices.


    1/0 merging is a technique to improve disk throughput by gathering together contiguous
    disk accesses. When a new disk 1/0 is started, rather than just tacking it on
    the end of the queue, the driver looks through the queue of 1/0s that are waiting
    to be started to see if any of them are scheduled to access adjacent data on the
    disk. If so, the new 1/0 is combined with the old so that the system will do one
    larger 1/0 rather than two smaller ones. This takes advantage of the disk device''s
    ability to read ahead and cache data, and also of the physical nature of disks.
    A disk access is much quicker if the heads don''t have to be moved.


    When the 1/0 is completed, there is a corresponding process that unmerges the
    1/0 back to the original requests.


    # Summary


    In this chapter, we looked at the 1/0 subsystem from a variety of levels. We covered
    some of the physical and architectural aspects of the 1/0 system, looking at how
    modules are accessed, addressed, and claimed by drivers.


    We looked at how the 1/0 portion of the kernel is made up of a complex framework
    consisting of the G10, which acts as interface and overseer; a variety of CD10s,
    which encapsulate the drivers; and the CB CD10, which manages the platform-specific
    parts of the 1/0 system.'
  merge: -1
  img_proc: true
