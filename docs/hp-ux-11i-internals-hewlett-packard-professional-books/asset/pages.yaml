    # ## The Process''s Logical View


    In order to facilitate the concept of relocatable code, compiled programs are
    linked against a logical memory image map. For 32-bit narrow applications, the
    logical size is $2^{32}$, or 4 GB; in the case of 64-bit wide applications, the
    theoretical size is limited to $2^{64}$, or 16 exabytes.1 In either case, the
    logical map is divided into four quadrants of equal size. This is not an arbitrary
    configuration. It is dictated by the underlying design of the HP PA-RISC hardware
    platform and its virtual memory system.


    We discuss the virtual memory-to-physical memory mapping in the next chapter,
    but first we must look at the rules and options that control the placement of
    a program''s various memory objects into a logical space. Figure 5-4 illustrates
    this concept for both narrow and wide program images.


    The mapping of individual program object modules is accomplished by the infamous
    linking-loader. This program is usually compiled with the compiler and must understand
    which modules will be needed, and where to find them. Frequently, the build of
    the runnable image is controlled by the make utility and a corresponding Makefile.


    Prior to the final linking of the executable image, the compiler builds relocatable
    object modules and a skeletal symbol table. The linking-loader must make sure
    that following the link there are no undefined external references to procedures
    not linked into the image (or to be made available via shared libraries at runtime).


    The linking-loader must understand the system architecture for which it is building
    the executable image. Each hardware platform has its own unique way of dealing
    with the assignment of sections of virtual memory. In effect, the program''s objects,
    or code and data blocks, are separated according to their function and type, and
    level of security they required.'
