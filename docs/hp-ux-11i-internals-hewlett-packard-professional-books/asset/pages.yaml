    # Virtual Memory Support


    In a virtual memory system, pages are mapped from one set of addresses, virtual
    addresses, to another set, physical addresses. Each time the processor accesses
    memory, it does so using a virtual address. This address then gets translated
    to a physical address. This mapping takes place in units of pages. When a program
    addresses a virtual address, that address is first broken up into a virtual page
    number and an offset into that virtual page. The virtual page is then translated
    into a physical page. It''s possible that the virtual page might be on disk rather
    than in physical memory. In this case, a page fault is generated and the page
    must then be brought in from disk to memory. In this section we look at how addresses
    get translated. The case where data is resident on disk rather than in physical
    memory is covered in Chapter 6.


    PA-RISC processors operate in one of two modes: narrow or wide. PA-RISC 1.1 processors
    are always narrow, and they operate on 32-bit addresses. PA-RISC 2.0 processors
    can be narrow or wide at any time depending on the setting of the W-bit in the
    PSW. Because the addresses are handled differently in these two cases, we look
    at both possibilities. We also look at the memory layout for both kernel mode
    and user mode. Recall that on a PA-RISC 1.1 system, the kernel and user applications
    are always narrow (32-bit). On a PA-RISC 2.0 system, the kernel can be narrow
    or wide (64-bit); on a wide kernel, applications can be either narrow or wide.'
  merge: -1
  img_proc: true
- pgno: 48
  md: "# Virtual Memory Layout, Narrow Mode\n\nAs discussed, the entire set of virtual\
    \ memory is divided into spaces. Every address is made up of a space and an offset\
    \ into that space.\n\nIn narrow mode, we use a 32-bit offset into a space, which\
    \ means that every space is $2^{32}$ or 4 GB in size. This 4 GB is in turn divided\
    \ into four quadrants of 1 GB each.\n\nEach process on the system has four quadrants\
    \ of address ranges that it can use. This doesn't mean that it has 4 GB of memory\
    \ set aside—just that it has that many unique addresses that it can access. However,\
    \ these four quadrants are not necessarily in the same space. For example, a process\
    \ might have quadrant 1 from space 0x123, quadrant 2 from space 0x234, quadrant\
    \ 3 from space 0x345, and quadrant 4 from space 0x456. At the same time, some\
    \ other process might have its quadrant 2 taken from space 0x123. To put this\
    \ another way, each space is divided into four quadrants, and each quadrant belongs\
    \ to a different process. The reason for this will become apparent when we talk\
    \ about explicit and implicit addressing.\n\nThe quadrants are determined by simply\
    \ dividing the space into four equal pieces as determined by the upper two bits\
    \ of the offset. Table 1-2 shows how address ranges map to quadrants.\n\nTable\
    \ 1-2 Quadrants in 32-Bit Mode  \n| Quadrant | Virtual Address Range |\n| :---\
    \ | :--- |\n| Quadrant 1 | 0x00000000 to 0x3fffffff |\n| Quadrant 2 | 0x40000000\
    \ to 0x7fffffff |\n| Quadrant 3 | 0x80000000 to 0xbfffffff |\n| Quadrant 4 | 0xc0000000\
    \ to 0xffffffff |\n\n# Virtual Memory Layout, Wide Mode\n\nIn wide mode, the virtual\
    \ memory concepts are the same as in narrow mode, but the register sizes are different\
    \ and the calculations are done differently. The PA-RISC 2.0 architecture allows\
    \ for space registers of up to 64 bits, although all current implementations use\
    \ 32-bit space registers. Of these 32 bits, only the upper 22 bits are used; the\
    \ lower 10 bits are always zero. General registers, which are used for the offset,\
    \ are 64 bits wide. However, only the lower 42 bits are used for the offset. Like\
    \ in narrow mode, the two highest bits indicate the quadrant. The result is that\
    \ each quadrant is 4 TB, and each space is 16 TB. Table 1-3 shows how address\
    \ ranges map to quadrants."
