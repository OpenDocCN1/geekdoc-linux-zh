- pgno: 184
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_184_0.png)


    During execution, the PA-RISC hardware utilizes the translation lookaside buffer
    (**tlb**) and the page directory (**pdir**) to convert implicit virtual addresses
    to physical addresses. When a requested virtual address is *not resident*, *or
    in-core*, the hardware suffers a *page fault*. It is at this point that the kernel
    fault-handling code must come into play, find (or create) the missing page image,
    load it in an available physical page frame, update associated hardware-dependent
    layer data structures, update kernel hardware-independent layer data structures,
    and then return from the fault handler so that the hardware may request the address
    again.


    The kernel must keep track of which regions occupy which quadrants in which space.
    This is accomplished by a host of bit maps and resource maps maintained by the
    kernel. A key feature of this approach has been that even though the scope of
    virtual addressing increased many orders of magnitude when the underlying hardware
    grew from 32 bit to a 64 bit, the VAS concept has changed very little. True, the
    quadrants are much larger and there are many more potential spaces, but the concept
    remains consistent. The core issue for both the processor hardware and the kernel
    is the translation of virtual-to-physical translation and, to a lesser degree,
    physical-to-virtual mapping.


    # # VIRTUAL-TO-PHYSICAL PAGE TABLES


    While it is true that virtual-to-physical translation takes place in the processor
    hardware, the table that supports it resides in the kernel''s memory space, and
    if the kernel wishes to move pro-'
