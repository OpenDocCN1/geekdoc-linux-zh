    2 <none>     array   2 struct mpminfo stopped by max count

    3 <none>     array   2 struct mpminfo stopped by max count

    4 <none>     list   155 struct proc  stopped by null pointer

    5 proc1      array   1 struct mpminfo copy of 1

    6 <none>     list   155 struct proc  copy of 4

