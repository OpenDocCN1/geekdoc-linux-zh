  md: 'Several other stipulations apply to a q3_private process. Such processes cannot
    share objects not created by another q3_private process even in Q4 unless the
    objects were created by a non-q3_private process using the IPC_GLOBAL or MAP_GLOBAL
    flags, which may require a recompile. If a recompile is not an option, then all
    processes needing to share objects in Q4 will simply need to be made into q3_private
    processes (chattr +g3p enable <process-name>).


    In a limited number of extreme cases, you may wish to extend the process''s private
    data space even farther. This may be done (but only with extreme caution and need!)
    by invoking the +q4p option with chattr. The use of +q4p presupposes the implementation
    of the +q3p rules. This is an extreme decision, as a process running in this mode
    will have access to no shared objects whatever (with exception to the I/O space
    and the gateway page).


    Note that the space IDs for the extended data spaces are identical. In effect,
    this means that the logical data size may exceed the previous limits. While this
    does bring some relief, all is not skittles and beer here. The fixed placement
    of the gateway page means that even with +q4p invoked, a singular data object
    may not extend past the beginning of the fourth quadrant. In order to use the
    additional space in Q4, the process must make private memory map calls using mmap
    (MAP_PRIVATE) or malloc (), which has been modified to address this limit.


    As an observation, if you need to utilize these types of options to make your
    process fit into the 32-bit narrow environment, perhaps your process is trying
    to tell you something—like, “I need to be a 64-bit wide process!”


