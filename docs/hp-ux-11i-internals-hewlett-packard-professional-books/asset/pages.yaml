    # q4


    q4 is a tool that was designed for analyzing kernel core dumps. However, like
    adb, it can also be used on a running system. You do need to be aware that most
    kernel data structures are very dynamic, changing constantly. Thus, if you''re
    looking at a live kernel rather than a dump, you need to realize that the data
    you''re looking at is a snapshot.


    Like adb, q4 takes a kernel file and a memory image or core dump directory as
    parameters. If the parameters are omitted, it looks for vmunix and a core file
    in the current directory. So, if you''re looking at a core dump, change to the
    directory that has the dump in it and just type q4. If you want to run q4 on the
    running kernel, type q4 /stand/vmunix /dev/mem.


    A very useful option to q4 is -p, which tells q4 to start Perl and set up an interface
    with the Perl process. This allows you, from within q4, to run Perl scripts that
    interact with q4. Many Perl scripts are packaged with q4 to perform common tasks.
    You may find that you need to tell q4 where Perl is by setting the Q4_PERL_PATH,
    and q4 also needs a Perl startup script that can be pointed to by the environment
    variable Q4_STARTUP_SCRIPT. If your files are in the usual places for release
    1.1, the following starts q4 with Perl mode on the running kernel:


    ```

    export Q4_PERL_PATH=/usr/contrib/bin/perl

    export Q4_STARTUP_SCRIPT=/usr/contrib/../lib/Q4/sample.q4rc.pl

    /usr/contrib/bin/q4 -p /stand/vmunix /dev/mem

    ```


    # Examining Data and Code


    q4 has an examine command that is similar to the data display commands in adb.
    The format is


    ```

    examine <address> [for <count>] using <format>

    ```


    For example, to display the value of nproc, type


    ```

    examine &nproc using D

    ```'
