    # ## Tracing Stacks


    To get a stack trace, you use the `trace` command. `q4` can trace four kinds of
    things: processes, kthreads, processors, and crash events. Note that `trace` will
    not show you function calls in user processes—this is the kernel stack.


    If you are looking at a crash dump rather than the running kernel, you can get
    a stack trace of crash events using the `trace event` command. Given a crash event
    number, this shows you the stack trace from the time the process entered kernel
    space to the time the system panicked. Crash event 0 is generally the most useful,
    although there are times when you need to see other crash events as well. For
    example, here is the stack trace from a data page fault panic:


    ```

    ```

    q4> trace event 0

    stack trace for event 0

    crash event was a panic

    panic+0x14

    report_trap_or_int_and_panic+0x84

    trap+0xd9c

    nokgdb+0x8c

    getnewbuf+0x1cc

    ogtblk+0x110

    getblk1+0x260

    vx_getblk+0x50

    vx_write_default+0x564

    vx_write+0xd8

    vx_rdwrs+0x164

    vno_rw+0x84

    write+0x104

    syscall+0x28c

    $$syscallrt n+0x0

    ```

    ```


    Here we see that the process entered the kernel by doing a write() system call.
    The kernel progressed through vno_rw, vx_rdwrs, and so on until it was in getnewbuf.
    At 0x1cc bytes past the beginning of getnewbuf, it executed an instruction that
    caused a trap—in this case a Data Page Fault. The trap handler, trap, decided
    it couldn''t handle the trap and called report_trap_or_int_and_panic to cause
    the system to panic.'
