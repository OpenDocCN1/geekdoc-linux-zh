  md: 'The kernel must have a place to safely store the *pcb* of a sleeping or blocked
    process until it is required for a context switch back into the processor''s registers.
    To this end, each process thread has created for it a memory region known as a
    *uarea* (see Figure 5-11).


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_163_0.png)


    The *uarea* is not visible from the process''s threads and is mapped into the
    kernel space whenever a thread is activated (made the running thread on a specific
    processor). When a thread makes a system call or the kernel preempts a thread
    to handle an interruption, it already has the current thread''s *uarea* mapped
    into the kernel''s memory view. If the kernel determines that it needs to perform
    a context switch prior to returning to the user space, then the current thread''s
    *pcb* is stored in its *uarea*. Next, the kernel determines which thread to switch
    to and restores a *pcb* from its *uarea* prior to the transition to user mode.
    The kernel routine that manages this black magic is called *switch*() and is one
    of the more expensive, but very necessary, actions the kernel may undertake!


    The *uarea* comprise several key sections (see Figure 5-11). The first is the
    *user* structure, which contains room for the *pcb* and other thread-specific
    kernel management data, and the second is a kernel stack space. Each thread must
    provide a limited amount of stack space for use by kernel routines, drivers, and
    kernel services requested through the system call interface.


    Consider for a moment the scenario where two independent threads make a request
    to the same kernel service, possibly a disk read or write request. As both threads
    enter the gateway page and transition from user space to kernel space, they are
    in effect running the same exact set of instructions in the kernel but from two
    different program contexts.'
