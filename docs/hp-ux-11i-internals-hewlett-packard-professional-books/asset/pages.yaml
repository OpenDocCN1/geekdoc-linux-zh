    process’s logical address space (see Figure 5-9). Modern compilers build an executable
    image by loading discrete components of the program into contiguous address blocks
    and then linking them together. This approach is necessary if you want to implement
    shared libraries, memory-mapped files, shared text, and shared memory—all features
    of the HP-UX kernel.


    To clarify and equate a couple of terms, contiguously addressed logical memory
    blocks are mapped to virtual page objects. These are also called memory regions.
    The term region goes back a long way in the history of UNIX kernels and is present
    in virtually all UNIX and Linux implementations.


    One example of the use of the vas structure occurs when there is a physical page
    fault. The kernel’s fault handler must locate the specific region of memory in
    which the missing page is managed (this is discussed in greater detail in Chapter
    6). The kernel knows which kthread was executing when the fault occurred. The
    kthread structure provides a direct pointer to the associated proc structure,
    and it in turn provides a pointer to the vas structure at the head of the linked
    list of regions that define the process’s logical address space. Next, the fault
    handler must search the chain of region structures to find the one containing
    the faulted page address. Once the correct region is found, page frame–specific
    information is contained in the kernel-managed region structure pointed to by
    the process’s region. To speed up the searching of these linked structures, the
    kernel uses a four-level skip list.


    As regions are added to a process’s vas chain, they are assigned a skip level
    between 0 and 3. Level determination is pseudo-random in nature; the general rule
    is that we are four'
