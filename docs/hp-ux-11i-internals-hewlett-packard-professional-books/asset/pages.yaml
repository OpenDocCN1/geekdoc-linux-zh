- pgno: 395
  md: 'Let''s have a look at where we are when `realmain()` completes:


    +   • We have discovered all our I/O devices and reset them, but have not yet
    assigned drivers to them.

    +   • The virtual memory system is initialized and ready to run.

    +   • The monarch is still the only processor running, although we have initialized
    much of the data for the other processors.

    +   • The file systems are initialized.

    +   • The proc and thread tables are initialized, and the first entry in each
    is occupied by the swapper process.


    When `realmain()` completes, it returns to its caller, `rdb_bootstrap()`. The
    next thing `rdb_bootstrap()` does is put us into virtual mode by setting the W,
    D, C, P, Q, and I bits. This gives us wide mode, data translation, code translation,
    protection identifier validation, interrupt state collection, and external interrupts
    enabled. The system is now running in virtual mode.


    # # Virtual Mode Initialization


    Once `rdb_bootstrap()` has placed the system into virtual mode, it has a couple
    of more steps to do. It flushes all the caches because the `realmain` routine
    does some code optimization. This act of having the kernel modify its own code
    can cause problems with the caches, so we flush them. We also create the kernel
    stack and switch to using that instead of the interrupt stack. Finally, `rdb_bootstrap`
    branches to `main()`, the virtual mode main program for the kernel.


    `main()` is similar to `realmain()` in that it works from a calllist. This one
    is called `mainstreet_calllist`. One interesting difference in `main` is that
    it never returns. The thread that calls the `mainstreet_calllist` routines eventually
    become `proc 0`, the swapper. If `DoCalllist` ever returns in `main()`, we''ll
    panic with the message `main: Road Ends.`


    Like `realmain`, `calllist`, `mainstreet_calllist` has a lot of work to do. There
    are over 100 entries on the calllist. Rather than list them all, we just summarize
    the more important functions.


    The first step is to initialize more systemwide data structures: semaphores, the
    per-processor run queues, `t_tss` data structures, and `clocks`. Then, we finish
    filling out `proc[0]`, `kthread[0]`, and the user area for that thread. All other
    proc table and kthread table entries are placed on the `freeproc_list` or `freekthread_list`.
    We set up the external clock interrupt handler and start the clock ticking.


    At this point, we''re finally ready to start up the non-monarch processors. They
    get started up one at a time. For each processor, the monarch does the following:'
