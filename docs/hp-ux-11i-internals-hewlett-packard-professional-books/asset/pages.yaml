- pgno: 83
  md: 'keeping track of what is free and what is in use becomes much simpler. This
    is a very basic layer of abstraction; the kernel manages page frames, which you
    and I know are actually blocks of words made up of bytes that are 8-bits each.


    A modern UNIX kernel may use multiple layers of abstraction. Let’s continue with
    our discussion of fundamental memory management. UNIX kernels often employ a scheme
    whereby a process that requires a number of page frames to hold its code is assigned
    an appropriately sized *region* in a virtual page-frame map. Virtual page frames
    are mapped to specific physical page frames by means of processor hardware and
    supporting kernel tables (discussed later in this book). This additional layer
    of abstraction greatly simplifies issues such as allowing two or more processes
    to share the same view of executable code, shared libraries, shared memory, and
    other process-level shared objects.


    There are structures in the kernel to keep track of each element at each abstraction
    layer. Entities at higher layers simply point to the tracking structures at the
    lower layers. Lower level resource attributes are inherited by the upper abstraction
    layers.


    Care must be taken in deciding the size of each management unit—too large and
    you may waste a limited resource; too small and the overhead of the tracking structures
    may be excessive. The kernel designer constantly walks a fine line between convenience
    and efficiency. As you study resource management, note the granularity of control
    the kernel has over its charges.


    # ## Some Generic Kernel Techniques


    The discussion of operating system internals presents many challenges and opportunities
    to an author. Our approach is to discuss each area of the kernel, consider the
    challenges faced by kernel designers, and then explore the path taken toward the
    final solution implemented in the HP-UX code.


    Before we talk about HP-UX specifics, let’s discuss some generic challenges faced
    by kernel designers. As with any programming assignment, there are frequently
    many different ways to approach and solve a problem. Sometimes the decision is
    based on the programmer’s past experience, and sometimes it is dictated by the
    specific requirements of each kernel design feature. As an operating system matures,
    these individual point solutions are often modified or “tweaked” in order to tune
    a kernel’s operating parameters and bring them into alignment with performance
    objectives or system benchmark metrics. The HP-UX operating system is the product
    of a continuous improvement process that has enabled the refinement of core features
    and introduced many enhancements and services over the years.


    # ### Kernel Data Structures


    Programmers often use algorithms or borrow coding techniques from a “know-how”
    that belongs to the software development community at large. This common knowledge
    base contains many elements of special interest to those who craft operating system
    code. Let’s explore'
