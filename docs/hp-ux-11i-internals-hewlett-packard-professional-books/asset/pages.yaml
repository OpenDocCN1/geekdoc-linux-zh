  md: 'kthread is linked to depends on its processor affinity, its priority, `kt_pri`
    and its scheduling policy stored in `kt_schedpolicy` (stored in the thread''s
    `kthread` structure). To enter a processor''s run queue, we start with the `mp_thread`
    structures.


    The structures are stored in a number of arrays (dependent on the number of processors
    and processor sets). Each of the per-processor run queues has 160 `mp_thread`
    elements, while the global POSIX run queue size is controlled by the kernel-tunable
    `rtsched_numri` (default is 32). In either case each run queue header contains
    two words `th_link` and `tn_rlink`. The `th_link` points to the first thread in
    this specific run queue, and the `th_rlink` points to the last thread currently
    in the queue. Maintaining a dual linkage facilitates the linking of a `kthread`
    to either the front or back of its perspective queue. Threads are normally added
    to the back of a queue except in the case of preemption.


    The bulk of the run queue consists of the `kt_link` and `kt_rlink` pointers maintained
    in each individual `kthread` structure. As an individual thread''s state changes
    from run-able to blocked (sleeping), these linkage pointers are updated by the
    kernel as part of the overall scheduling process. These same pointers serve a
    dual purpose: they link a `kthread` to other `kthreads` in the same run queue
    or to other `kthreads` that are blocking on the same kernel service or I/O routine.
    `kthreads` blocking on the same kernel routine are said to be on a sleep queue.
    The `kthread`''s present state (`kt_stat`) notes whether it is on a run queue
    or a sleep queue.


    Next, we explore the two types of run queues: global and per-processor.


    # The Systemwide POSIX Run Queues


    As we have stated, the POSIX run queue is a global entity (one per `pset`). Each
    processor starts its search for runnable threads by first checking the POSIX run
    queue to see if it has any waiting threads. If not, it checks its own per-processor
    run queue. Figure 5-16 shows the basic principals of the POSIX real-time run queue.'
