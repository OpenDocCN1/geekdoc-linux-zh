    # Figure 3-1 The Big Picture


    The UNIX kernel is very modular in its design and evolution. The design was influenced
    in large part by the C programming language–itself a very modular language–in
    which the bulk of UNIX kernel code is written. A lot of the personality of the
    original “kernel hackers” (a term used with great respect) is still present in
    the heart and soul of today’s UNIX incarnations.


    When studying a UNIX operating system, always be vigilant for similarities between
    different sections of the kernel code; that is, look for variations on a theme.
    It will help your comprehension to compare and contrast the various programmatic
    tools and tricks of the trade as they come into focus during subsequent chapters.


    # All I/O Is File I/O


    Continuing with the theme of simplification, let’s think about the fundamentals
    of process I/O and the UNIX kernel. The UNIX kernel is charged with policing all
    forms of I/O as part of its resource management duties. To simplify this task,
    UNIX has reduced all types of I/O to the level of file I/O. By representing all
    external devices as files, the system needs only one type of access-control mechanism.
    This is the infamous “rwx rwx rwx,” user group and other (or UGO) security model
    presented in all introductory-level UNIX training courses and books. UNIX basically
    follows the KISS (keep it simple, stupid) principle of design.'
