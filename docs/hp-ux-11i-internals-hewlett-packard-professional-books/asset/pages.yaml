  md: 'To convert an internal priority to an external POSIX priority (the priority
    number you would pass as an argument in the rt sched() system call or rt sched
    line-mode command):


    > External-POSIX-Priority = (MAX_RT SCHED_PRI - 1) - Internal-priority


    To convert an external POSIX priority to an internal priority:


    > Internal-Priority = (MAX_RT SCHED_PRI - 1) - External-POSIX-priority


    Next, let''s examine the scheduling schemes.


    # SCHED_TIMESHAKE and SCHED_NOAGE


    The classic UNIX scheduler is implemented in HP-UX as SCHED_TIMESHAKE. This policy
    has two additional aliases: SCHED_OTHER and SCHED_HPOX. In Figure 5-13, we illustrate
    the basics of the timeshare scheduler and position it with respect to the overall
    priority system.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_168_0.png)


    | |  | HP-UX Timeshare Priorities | 32 queues, 4 priorities/queue |  | 252-255
    |

    |---|---|---|---|---|---|

    | 128-131 |  |  |  |  | 255 |

    |  |  | System, Timeshare |  | PUSER | User, Timeshare |

    | 128 | Delay Signals 153 | 154 Wake for Signals 177 |  |  |  |

    | PZERO |  |  |  |  |  |


    # Figure 5-13 Thread Priorities


    This scheduling policy consists of 32 run queues. Each queue contains four sequential
    priority values. The strongest queue handles threads with priorities between 128
    and 131, while the weakest handles those between 252 and 255. The four priorities
    per queue is part of the legacy left by the early UNIX development work done on
    an older Digital Equipment Corp. hardware platform. The system was set up to handle
    32 unique queues; this number was carried through in the UNIX kernel design. When
    it was decided to increase the priority range to an 8-bit value (0'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'to 255), the existing 32 queues were divided into the upper half of the number
    range, allowing for the later introduction of additional higher priority schemes.


    # ### System-Level and User-Level Priorities


    Overall, the `SCHED_TIMESHARE` queues are divided into two groups. External priorities
    128 to 177 are system-level priorities; 178 to 255 are user-level priorities.
    The system parameter `puser` sets the base priority for the user level (this should
    not be changed!). The system-level priorities are reserved for privileged kernel
    routines and system call code running on behalf of a user thread.


    Threads assigned one of the user-level priorities may have their value adjusted
    by the kernel depending on current system resource utilization levels or the thread''s
    behavioral patterns (more on this later). This adjustment by the kernel is called
    *priority decay*. System-level priorities are said to be nondecaying; that is,
    their priority is not adjusted by the kernel.


    Threads in the system levels may fall into one of two additional subdivisions:
    those that will be awakened from a sleep queue to handle an incoming signal and
    those that will delay signal handling until whatever they are blocking on wakes
    them. Have you ever tried to halt a process with a `kill -9` only to see it still
    there when you run `ps` immediately afterwards? If so, then you may be looking
    at a thread sleeping in the un-interruptible range (128 to `pzero`).


    Consider a kernel driver that has set up an interface card to perform a direct
    memory access (DMA) transfer between a data block on a disk and a physical address
    range in memory currently mapped to a thread''s data space. If you were allowed
    to signal this thread to exit before the DMA completed, the kernel might attempt
    to return a physical page frame to the free list while the I/O interface was affecting
    its data transfer—not a comforting thought! For such reasons, a sleeping thread
    may be placed at a priority below `pzero` to ensure that the DMA transaction completes
    and the associated external interrupt is posted by the interface to the kernel
    I/O system to wake the sleeping thread (also called un-blocking the thread). When
    the thread wakes, the signal will be caught prior to the transition from the kernel
    space back to the user space, which in most cases results in the termination of
    the process and its threads. The kernel parameter `pzero` is the upper limit of
    the group, which delays signal delivery until wake up.


    # ### Time Basics in HP-UX Scheduling: The Tick


    Time in HP-UX is measured by the kernel in terms of *ticks*. A tick is defined
    to be 10 ms. The CPU''s hardware clock signal is monitored by a configurable counter
    circuit. The counter is set such that an internal processor interrupt occurs every
    10 ms. This interrupt is handled by a kernel routine known as `hardclock()`. As
    a hard runs, the number of ticks that occur while it is running is stored in the
    thread''s `proc` structure in the field `p_ticks`. This counter circuit is also
    the basis for the network time protocol service in which a system compares its
    time of day to that of another “server” system. Systems either are peers or belong
    to various strata; a system of lower strata will make fine adjustments to its
    counter interface to effectively speed up or slow'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'down its tick. These adjustments are continually refined until the system at
    the lower time strata is synchronized with the higher level server.


    # Time Slicing or Round-Robin Queuing


    When more than one thread exists in the same run queue, a round-robin scheduling
    scheme is usually observed. The kernel-tunable parameter `timeslice` determines
    the number of ticks a thread is allowed to run before being rethreaded to the
    end of its queue. The default value of `timeslice` is 10 ticks, or 100 ms. Each
    thread maintains a count of its remaining ticks until the next timeslice in `kt_ticsleft`
    (in its kthread structure).


    Every time the hard-clock interrupt occurs, the running thread on each processor
    has its `kt_ticsleft` decremented by 1 and compared to 0. If the thread''s timeslice
    has expired, then the current thread has `kt_ticsleft` reset to `timeslice`, and
    it is moved from the front to the end of its run queue. In effect, threads of
    the same run queue take turns in a round-robin manner. If only one thread exists
    in a queue when its timeslice expires, it is simply re-threaded to the front of
    its own queue. The kernel realizes this is the case and stops short of actually
    performing a full context-switch operation and simply continues execution of the
    thread. The thread''s `kt_ticsleft` is reset, and the countdown starts all over
    again in case new threads are added to the queue.


    # Priority Decay, nice, and User-Level Priorities


    The HP-UX source code includes an interesting statement in the comments; it goes
    something like this:


    > A thread''s priority is adjusted according to a mystic formula handed down by
    kernel hack to seed as part of the oral UNIX tradition.


    We don’t claim to be sage kernel hacks, but we would like to demystify this a
    bit. Each thread keeps a parameter in its `kthread` known as `kt_cpu`. In older
    UNIX incarnations there was something called the process `hog factor`. Now, per-thread
    `kt_cpu`, to some degree, is a modern extension of that idea, although implemented
    in a somewhat different manner.


    The `kt_cpu` may range in value between 0 and 255 and is used whenever the kernel
    needs to reevaluate a thread’s priority. Another factor in the recalculation of
    a thread’s priority is its `nice` value. The `nice` value is a user-provided parameter
    and may be set either programmatically via a system call or by the user from the
    command line. Using `nice` when the process is first launched or `renice` to adjust
    the value of a running process.


    The system assigns a default `nice` value of 20 to all processes; this value is
    stored in the kernel parameter `pnice`. The `nice` command has an overall range
    of 0 to 39. A regular user may only increase the `nice` value between 20 and 39,
    while a superuser may “nasty”—that is, negative `nice`—a process all the way to
    0. Okay, so each thread has a `nice` value—so what? Here is the way the `nice`
    value and the `kt_cpu` come into play.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'Periodically, the kernel stops to reevaluate the priority of all threads actively
    waiting to run on the system. This happens once a second, or every 100 ticks of
    the `hardclock()`. A kernel routine named `stat_daemon()` calls `sched_cpu()`,
    which calls its helper `setpri()`, which in turn calls `calculatepri()` to assess
    and adjust user-level thread priorities. The basic formula looks something like
    this (remember that `puser = 178` and `p_nice` is 20):


    > The new priority = (`puser` + `kt_cpu`/4) - 2(`pnice` - `p_nice`)


    Upon examination of this pseudo-formula, we immediately see that if the thread''s
    `p_nice` value is set to the default of 20, then the nice''ness has no effect
    on the calculation.


    The `nice` value is stored in a thread''s proc table structure in the `p_nice`
    field. As a result when you `nice` a process, you `nice` all of its threads to
    the same level. The `nice` parameter predates the introduction of threads to the
    HP-UX kernel. Table 5-2 shows the contribution of the `nice` value to a thread''s
    calculated priority:


    | | 0 | 5 | 10 | 15 | 20 | 25 | 30 | 35 | 39 |

    |---|---|---|---|---|---|---|---|---|---|

    | `p_nice =` | | | | | | | | | |

    | Priority adjustment | -40 | -30 | -20 | -10 | 0 | 10 | 20 | 30 | 38 |


    The contribution of `kt_cpu` may also be calculated; it is simply `kt_cpu`/4 and
    added to the base user-level priority `puser` (178). To complete our total understanding
    of this phenomenon, we simply need to ask how `kt_cpu` is set. Simple, right?
    If only it were so. Enter the mystic formula!


    A thread''s `kt_cpu` is adjusted at the whim of the kernel. When a process requests
    kernel services, I/O, systems calls, and so on, the requested kernel routine may
    adjust the requesting thread''s `kt_cpu` depending upon its mood. Seriously, if
    a resource is currently in heavy demand, then `kt_cpu` may be increased. If there
    is average traffic, it may be left alone; or if the kernel notes light usage,
    it may reward the thread and reduce it. During the `stat_daemon()`, waiting threads
    are checked to see if they are being starved for CPU time-how long it has been
    since they had a turn as the running thread. If CPU utilization is low, this time
    should be very short; adjustments to `kt_cpu` may be made at this time as well.
    The kernel uses this as a means to avoid potential bottlenecks in various system
    resources. It is the sum total of the kernel''s current activity level and the
    behavioral patterns of the thread which in the end determines how this parameter
    is set.


    Our story is not quite over yet. When these two factors have been assessed and
    totaled, they are limit-checked against the weakest priority (255) and the base
    of the user-level priorities `puser` (178) and adjusted within these bounds.


    There is another way that a thread''s priority may decay: each time the total
    number of ticks a thread has used since it started is evenly divisible by 4, its
    current user-level priority is incremented by 1. This means that a user-level
    thread locked in a CPU loop would have its prior-'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'ity decay to the next weaker run queue after racking up 16 clock ticks (160
    ms) assuming that it had started at the strongest priority in its run queue (remember
    there are four priorities per user-level run queue).


    When both mechanisms—the “four ticks and you lose” and the once-a-second statdæmon(1)
    recalculation of all runnable thread priorities—are combined, the basic personality
    of punishment and reward appears: if you are a CPU-intensive thread, you will
    be caught by many clock ticks and priority decay will move you out of the active
    queue. If you stop and ask the CPU to perform lots of I/O, your chances of being
    the running thread at the hard-clock interrupt is drastically reduced and you
    will be dealt with in a much gentler manner.


    There is another vague statement that bears repeating points:


    > In general a thread will recover 90 percent of the priority points it has lost
    in four times the current percentage of CPU utilization, in seconds, once it has
    been pushed out of an active run queue.


    In other words, if the system is currently running at 80 percent CPU utilization,
    a thread that has suffered a loss of 10 priority points due to decay will recover
    9 of them in 3.2 seconds. This is a very rough characterization but is surprisingly
    accurate.


    # SCHED_NOAGE


    Now that you are beginning to see what priority decay is all about, let’s introduce
    a relatively new kid on the block. The policy SCHED_NOAGE allows threads in the
    user-level run queues to be assigned a fixed timeshare priority. These threads
    are linked to the same run queue as other threads in SCHED_TIMESHARE and compete
    alongside them for system attention, but their priorities are not changed by any
    of the mechanisms we just discussed. This feature was originally introduced to
    support database operations. Prior to this option, you had to use one of the real-time
    policies if you wanted to have a fixed (or nondecaying) priority assigned to a
    process or its threads. SCHED_NOAGE offers a thread many of the same benefits
    as real-time run queues but without the inherent danger of a system hang which
    could result if a real-time thread behaves badly.


    # SCHED_RTPRIO


    A number of years back, Hewlett-Packard decided to implement a real-time scheduling
    policy in addition to the classic timeshare scheme. Hewlett-Packard has a strong
    history in real-time computing, specifically with its HP-1000 family of computers
    running the proprietary Real Time Executive operating system on A-series minicomputers
    (referred to as RTE-A). These machines were used in manufacturing and process-control
    systems, and as HP-UX entered into this space and was determined to be Hewlett-Packard’s
    strategic future path, real-time extensions to the HP-UX kernel had to be developed.
    Hewlett-Packard addressed this challenge with the introduction of the rtprio()
    system call and rtprio line-mode command in the HP-UX 7.0 release. In Figure 5-14,
    we see the relationship of this scheduler to the overall priority scheme.'
