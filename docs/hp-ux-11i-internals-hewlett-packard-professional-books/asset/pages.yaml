    # Semaphores


    Now that we’ve covered spinlocks, let’s have a look at the other synchronization
    primitive offered by the kernel: semaphores. Semaphores in the HP-UX kernel can
    be roughly divided into two types: mutual exclusion semaphores, or mutexes, and
    synchronization semaphores. Mutual exclusion semaphores are further divided into
    alpha semaphores and beta semaphores.


    The key difference between an alpha semaphore and a beta semaphore is that alpha
    semaphores are used to protect data structures, which must be consistent when
    a context switch occurs. It is assumed that a structure is inconsistent while
    the lock is held. That’s the idea of the lock—to prevent access while the structure
    is inconsistent. For that reason, a process can’t sleep'
