- pgno: 338
  md: '# LVM: The Kernel View


    In Figure 11-6 we see an overview of the LVM pseudodriver organization within
    the kernel. As mentioned earlier, an application thread requests a file open by
    referencing a file system path-name. The virtual file system resolves this to
    a specific vnode within the kernel file system table. The vnode contains the device
    number of the file system on which the file is located. The device number for
    LVM-based file systems directs all I/O requests to the LVM pseudodriver via the
    kernel''s device switch table. Once an I/O request is received by the driver,
    the driver must pass it through several layers.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_338_0.png)


    **Figure 11-6** The LVM Pseudodriver Architecture


    **Strategy Layer:** This layer receives the initial request for a block I/O transaction
    to a specific file system block. The kernel facilitates this request by passing
    a buf structure containing the logical volume number (b_dev), request flags defining
    the transaction (v_flags), the block number within the logical volume (b_blkno),
    the byte count of the request (b_bcount), and various options (b_options). The
    strategy layer must validate the request, checking the availability of the requested
    volume and its size against the block size of the volume.


    **Mirror Consistency Layer:** If a logical volume has mirroring configured, then
    this layer must coordinate mirror writes. A volume may be configured to cache
    mirrored write request in an MWC. A volume group is divided into logical track
    groups (LTG) and cached write requests are first registered in one of the MWC''s
    cache records (one per LTG) in kernel memory and also written to an mwc_entry
    on one of the physical volumes of the volume group. Originally, each volume group
    had 32 LTGs, but with the 11.1 release this was increased to 126.'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'The cached data does not contain the user data, but it does register the intent
    to update data on the disk. When the write has been completed to all mirror copies,
    the cache record is cleared. In the case of a system crash and reboot, the cache
    records on the physical volumes may be used to identify which LVG''s may be out
    of sync. If the MWC is not used, then all logical extents on the mirrors would
    have to be resynchronized.


    **Scheduling Layer:** This layer makes full use of the kernel-based copies of
    the volume group''s kernel-based configuration information. The actual location
    and number of mirrors are converted into one or more physical requests. The strategy
    layer accepts the buf pointer from the previous layers and directs it on its way
    through LVM.


    A logical volume may be configured to follow one of several scheduling strategies.
    It may be LVM_RESERVED if the request is to the reserved area on the disk (the
    actual metadata structures used to configure and manage the volume). Normal read
    and write requests may be either LVM_SEQUENTIAL or LVM_PARALLEL. This affects
    the methodology used for mirrored read and write requests. Finally, the request
    could be flagged as LVM_STRIPE for parallel striped operations.


    **Physical Layer:** This last layer is where the rubber meets the road. The LVM
    driver passes requests and their associated buf structures to the actual physical
    device drivers responsible for the mapped physical volumes.


    # **Work Queues: Keeping a Request on Track**


    Because the LVM pseudodriver is a kernel resource, it is common for it to be processing
    multiple requests in the various layers at any one point in time. In addition
    to servicing multiple threads, the buffers may be queued while awaiting access
    to a physical device or to be transferred to the next layer within the LVM driver
    itself.


    In Figure 11-7, we see that there are a number of queues that a request may find
    itself on.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_339_0.png)


    **Figure 11-7 Work Queues**'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'They may be divided into four different categories.


    **Global queues:** The `pf_wait_Q` contains all requests that may not be completed
    due to a power failure. A request on this queue is waiting for termination and
    cleanup.


    **Per-volume-group queues:** The `vg_cache_wait_queue` holds requests waiting
    on a free entry in their volume group’s MWC. The `vg_cache_write` queue provides
    a linked list of physical volumes available for an MWC update to disk. When the
    LVM driver needs to store MWC data to a physical disk in its volume group, it
    selects the one at the head of this queue.


    **Per-physical-volume queues:** All requests scheduled for a specific physical
    volume are linked to the `pv_read_Q`. The `pv_cache_wait` holds requests waiting
    for their MWC data to be written to a physical disk.


    The LVM system supports a feature known as physical volume links (`pv links`).
    This feature allows for the automatic switchover from one bus to an alternate
    bus; that is, when a failure occurs on a bus controller, if the system has an
    alternate path available, I/O is switched to it. The `pv_wait_Q` holds requests
    waiting for the `pv links` switch to take effect.


    Currently, `pv links` support an active/passive mode of operation. This references
    the fact that only one interface may be active at a time. If it fails, the standby
    passive interface is activated. In the future, this may be enhanced to allow active/active
    configurations where both interfaces may be used to share the load and increase
    overall throughput while providing true hot standby functionality.


    **Per-logical-volume queues:** The `work_Q` is actually a per-logical-volume array
    of all outstanding requests for the volume. The array entries are the other queues
    on which the individual requests are currently linked. Since this master queue
    has knowledge of all current outstanding requests for a volume, the kernel strategy
    layer makes use of this information to serialize I/O requests whenever possible.


    The `lv_read_Q` is a holding place for requests waiting to be passed to the MWC
    layer in the pseudo-driver.


    Next, let’s consider the data structures stored in the kernel to support the operations
    of the LVM subsystem.


    # # Kernel Resident Data Structures


    When a volume group is activated (at boot or via the `vgchange -a y` command),
    its metadata is copied to kernel-resident structures. Figure 11-8 presents an
    overview of these structures. The starting point for these structures is the kernel
    `vol1grp[]` array. As individual `vol1grp` structures are among the largest in
    the kernel, their number is limited by the kernel-tunable `maxvgs` and defaults
    to 10. Note: if you are creating a new volume, group directory, and `vgoup` file
    the volume group number passed to the `mkcmd` command (the first two digits of
    the minor number argument) should not exceed this tunable value. The volume group’s
    number is used as the index into the kernel resident `vol1grp[]` array.'
  merge: -1
  img_proc: true
