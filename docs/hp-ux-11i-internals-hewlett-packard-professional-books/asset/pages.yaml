    # ## Base Register Modification


    Another variation of the STORE and LOAD instructions provides *base register modification*.
    That is, in addition to moving data to or from memory, the instruction also modifies
    the specified base register. If the displacement is positive, then the base register
    is modified *after* the load or store is done. This is a *post-increment* operation.
    If the displacement is negative, the base register is modified *before* the load
    or store is done. This is a *pre-decrement* operation.


    As an example, consider the following instruction:


    ```

    ```asm

    STW, M  r3, 0x80(r30)

    ```

    ```


    This instruction tells the system to store the value in GR3 at the address specified
    by GR30, then add 0x80 to GR30.


    In contrast, consider the following instruction:


    ```

    ```asm

    STW, M  r3, -0x80(r30)

    ```

    ```


    Because the offset is negative, the system first subtracts 0x80 from GR30, then
    stores the contents of GR3 at that address.


    We will frequently see an *STW, M* instruction at the beginning of each called
    procedure. The compiler uses this instruction to allocate a stack frame—that is,
    to move the stack pointer forward to allow room for storage of local variables.
    We''ll see this in more detail when we look at stack usage.


    # ## Branch Instructions


    Branch instructions can be divided into two types: conditional and unconditional.
    As the names imply, a conditional branch may or may not be taken depending on
    some condition. An unconditional branch is always taken. Within these two types
    are several different instructions depending on the range of the branch and whether
    or not a return address is saved.'
