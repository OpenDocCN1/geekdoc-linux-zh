- pgno: 60
  md: '# # Procedure Calling Conventions


    In the preceding chapter, we discussed the system architecture—the design and
    implementation of the PA-RISC hardware. But in order to make this useful, we need
    to make some decisions about how we’ll use the hardware. For example, we need
    to agree on how procedure calls are made, how arguments are passed, and how return
    values are returned. This is known as the runtime architecture of the system.
    In this chapter, we look at these conventions, and we also take a look at some
    of the commonly used PA-RISC instructions.


    # ## Register Usage


    Recall from our discussion of the PA-RISC architecture in Chapter 1 that only
    four registers have specific meaning: GR0, GR1, GR2, and GR31. The runtime architecture
    specifies guidelines for many of the remaining registers.


    Registers 3 through 18 are designated as *callee* save registers. This means that
    if these registers are going to be overwritten, it is the responsibility of the
    *callee* or the *called function* to save their contents. These registers are
    commonly used for storage of local variables in a function and are stored to the
    stack before being used. They then must be restored to their original values before
    returning to the calling program.


    Registers 19 through 26 are *caller* save registers. If the calling function wants
    to preserve these values, it must save them before making the procedure call.
    The called function is free to modify them without saving them.


    For most procedure calls, the arguments to the call are placed in the registers
    before the call is made. PA-RISC 1.1 specifies four registers for passing arguments.
    Argument 0 is stored in GR26, Argument 1 in GR25, Argument 2 in GR24, and Argument
    3 in GR23. Many of the tools use alternate names for these registers to indicate
    their usage—arg0 instead of GR26, arg1'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'instead of GR25, and so on. In addition, the tools generally refer to the registers
    as r26, r25, and so on rather than GR26 and GR25. In PA-RISC 2.0 the number of
    argument registers was expanded, so Argument 4 is in register 22 (GR22), Argument
    5 is in GR21, Argument 6 is in GR20, and Argument 7 is in GR19. If a procedure
    call uses more arguments than the number of architected registers, the remaining
    arguments are passed by putting them on the stack.


    General register 30 is used as the stack pointer and is frequently called by the
    mnemonic instead of GR30. The stack grows toward higher addresses in memory, so
    as data are added to the stack, the value of GR30 gets larger, and as data are
    removed from the stack, the value of GR30 gets smaller. This sometimes gets confusing
    because, by convention, we draw stacks as growing *down*—larger addresses are
    at the bottom of the stack diagram. PA-RISC does not have explicit PUSH and POP
    stack operations. The stack is grown or shrunk by incrementing or decrementing
    GR30.


    # PA-RISC Instructions


    The PA-RISC instruction set can be divided into seven general categories of instructions:


    +   - Memory reference instructions—Instructions that explicitly move data to
    or from memory.

    +   - Computation instructions—Instructions that perform basic arithmetic, logical
    operations, shifts and rotates, and bit operations.

    +   - Branch instructions—Instructions to alter the order of instructions execution,
    either conditionally or unconditionally, with or without saving a link pointer
    to return to the current instruction stream.

    +   - Multimedia instructions—Instructions that perform multiple parallel operations
    on 16-bit values packed into a single register. These instructions are designed
    to speed operations typically used in multimedia applications such as signal processing
    and compression.

    +   - Floating-point instructions—These instructions perform floating-point operations
    on values stored in the system’s floating-point registers

    +   - System control instructions—These instructions perform control functions
    such as handling interrupts and managing the cache and TLB.

    +   - Long immediate instructions—Instructions that allow the use of an immediate
    value.


    You don’t need to know everything about every instruction available in order to
    get a good grasp of the kernel, but there are a few instructions that are used
    commonly or that are important to understanding how procedure calls are handled.
    We look at the memory reference instructions, branch instructions, and long immediate
    instructions in more detail. Gerry Kane’s *PA-RISC 2.0 Architecture* book has
    complete details on all the instructions.


    Before we get into the details of the instructions, we should mention the format
    of the mnemonics. Many of the instructions have a *completor* to indicate different
    types of similar'
