  md: '# # CHAPTER 15

    ## System Initialization


    The first step in the system boot process is controlled by processor-dependent
    code (PDC). On a multiprocessor system, PDC must first identify the controlling
    native processor, or *monarch*. The *monarch* is the first processor initialized,
    and it handles all of the early boot process. Each processor on the bus has a
    value called BOOT_ID, which is set at the factory to 2. *Monarch* selection begins
    by looking for the processor with the highest BOOT_ID. If there are multiple processors
    with the same BOOT_ID, the one with the lowest slot number becomes the *monarch*.
    BOOT_IDs are rarely changed, so the *monarch* is almost always the processor in
    the lowest slot. The *monarch* processor then continues with the boot process
    while all other processors idle, waiting for an interrupt.


    PDC next configures the initial memory module (IMM). This is the memory module
    that is mapped to physical address zero. The IMM selection is similar to the *monarch*
    selection process, and the IMM is the largest memory module. If there are multiple
    modules with the same size, the IMM is the one with the lower slot number. On
    most newer systems, the entire memory space appears to the system as a single
    module, so this selection process usually selects that one memory module. The
    module''s soft physical address (SPA) is set to 0, mapping it to physical address
    zero.


    Now that the system has a *monarch* processor identified and memory mapped, the
    next step is to identify the boot and console devices. This is done by the boot
    console handler (BCH). BCH looks in the system''s stable store to find the hardware
    path to the system console. Once the console path is initialized, it displays
    some system status information and then proceeds based on the settings of two
    flags in the stable store: *Autoboot* and *Autosearch*. If the *Autoboot* flag
    is set, BCH attempts to boot the system without interaction with the user. Without
    the *Autoboot* flag, BCH asks the user to verify the boot path. *Autosearch* allows
    BCH to search all I/O modules for bootable devices. Without *Autosearch*, BCH
    attempts to boot only'
