    # The vnode


    Next, we address the specifics of the vnode structure. We have learned that an
    inode contains all of a file''s credentials and attributes, and is therefore the
    key to managing a file within a file system. The inode number is unique within
    the context of a single file system, and it is all that is needed to define a
    file. Within a kernel, there may be several file systems mounted together to create
    what appears to be a seamless, larger file system. Within this larger context,
    inode numbers are no longer guaranteed to be unique. Each mounted file system
    may have an inode 1, 2, and so on. To enable the kernel to refer to opened files
    with a unique handle, the virtual inode or vnode was created.


    In a similar manner to the vfs structure, a vnode contains an operational array
    pointer to the kernel''s type-specific routines for file manipulation tasks (see
    Figure 8-14).


