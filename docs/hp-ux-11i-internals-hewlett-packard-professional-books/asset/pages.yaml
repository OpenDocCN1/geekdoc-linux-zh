- pgno: 145
  md: 'We return to many of these parameters as we continue our exploration of the
    kernel. The next stop on our trip is the *kthread* structure.


    # ## The kthread Table


    Originally, HP-UX managed jobs only at the process level, and the *proc* table
    contained all information relating to the execution of a process by the kernel.
    HP-UX 10.0 introduced the *kthread* structure as a first step toward implementation
    of a fully threaded kernel environment. Although this was only a first step toward
    a true multithreaded environment, it initiated the division of static process-related
    parameters and dynamic thread-related values into separate structures. The *proc*
    table contains static values and pointers to resources shared equally by all of
    its threads, while the *kthread* structure(s) contain dynamic information relating
    to their execution and runtime environment.


    First, let''s examine the manner in which a *proc* table entry and its *kthreads*
    are linked together. In Figure 5-3, we see this relationship mapped out. The *proc*
    table maintains a pointer to the first thread and last (most recently created)
    *kthread*. In addition, a count is kept of all the created threads. Please note
    that this count is not incremented for the original thread, so a process with
    a single original thread will show *p_created_threads = 0* until the first sibling
    thread is spawned.


    The *kthread* structure maintains next/previous links and each sibling *kthread*
    has a direct pointer to its parent *proc* structure entry for quick access. In
    addition, each *kthread* has an indirect pointer to a uarea structure via a *pre
    gion* structure (both of which are discussed later in this chapter).


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_145_0.png)'
  merge: -1
  img_proc: true
