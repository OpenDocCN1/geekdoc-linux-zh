    # ## Abstraction Layers


    We have used the term *abstraction* and should spend a moment talking about what
    it means with regard to kernel design. When we consider the task of resource management,
    we must determine the level of control we wish to implement in our management
    scheme. One of the tricks of the trade involves grouping individual components
    of a system resource into uniform-sized blocks, chunks, extents, pages, and so
    on. The availability of the resource is then tracked at the level of these granular
    units, thus reducing the complexity of kernel data structures.


    A classic case is that of memory management. A computer’s physical RAM consists
    of circuits representing single bits of data storage; these are combined into
    sets of eight and referred to as bytes. An operating system combines bytes into
    words (for HP-UX, a word is 32 bits, or 4bytes; this is true for both narrow and
    wide kernels). The word is still a very small amount of storage space, and if
    the kernel needed to manage each word (by manage, we mean keep track of which
    words are currently being used, which are free, and who is using what), the amount
    of memory needed to build such structures could easily require as much space as
    or more than the memory being managed!


    To reduce this management overhead, we make the managed unit size larger than
    a word. In UNIX, this is accomplished by combining sequential physical words of
    memory into units called *page frames* (on HP-UX the page frame is 4096 bytes,
    or 1024 words). Now the task of'
  merge: -1
