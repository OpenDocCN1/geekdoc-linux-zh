- pgno: 306
  md: '# Chapter 10


    # # I/O and Device Management


    T he I/O subsystem is one of the most complicated parts of the HP-UX operating
    system. As each new generation of hardware is developed, it brings along with
    it new types of busses, new device adapters, and new devices. Over time the kernel
    has had to change to accommodate these new advances while maintaining compatibility
    with old hardware. As a result, the I/O subsystem has grown into a large and complex
    framework that involves many smaller subsystems and a lot of "glue" to hold it
    all together.


    # ## PA-RISC I/O Architecture


    The PA-RISC I/O architecture has specific requirements for all PA-RISC systems.
    These are designed to provide a standard set of rules for how the I/O hardware
    works and communicates with other components.


    Every PA-RISC system must have at a minimum at central bus to which must be attached
    at least one processor module and at least one memory module. If the system has
    more than one processor or more than one memory module, they all reside on the
    central bus.


    There are also a number of possible native busses. A native bus is one that adheres
    to the PA-RISC I/O architecture. As hardware has evolved since the introduction
    of PA-RISC, a number of new native busses have been introduced. One of the earliest
    of these was the HP Precision Bus (HP-PB), also called the native I/O (NIO) bus.
    Some others include the high-speed connect (HSC) bus, Gecko System Connect (GSC)
    bus, summIt bus, and runway bus. Each provides different capabilities and performance
    points, but all are native busses.


    In addition to the native busses, PA-RISC systems must be able to connect to a
    variety of busses that were not designed with PA-RISC in mind. These are known
    as foreign busses. Some examples are Extended Industry Standard Architecture (EISA),
    Peripher al Component Intercon-'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'nect (PCI), and Versa Module Eurocard (VME). These busses are designed by a
    variety of non-HP organizations and are used on many types of systems beyond PA-RISC.
    Because they don''t conform to the PA-RISC architecture, we have to have some
    hardware that adapts their interface to that of the PA-RISC system. These adapters,
    which connect native busses to foreign busses, are called bus adapters.


    It may also be desirable to connect between two different native busses, perhaps
    to expand capacity, for example. The PA-RISC I/O architecture specifies that a
    native bus can have no more than 64 modules on it. To get beyond this limitation,
    we can attach one native bus to another, much the way some people chain extension
    cords and power strips together to get more electrical outlets. The hardware that
    connects one native bus to another is a bus converter.


    Figure 10-1 shows a block diagram of a typical PA-RISC system. In this example,
    we have two processors and two memory modules connected to the central bus. There
    is also an I/O module connected directly to the central bus, along with a bus
    converter that connects to a native bus and a bus adapter that connects to a foreign
    bus.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_307_0.png)


    All of these components must be able to communicate with each other. This is part
    of what makes the I/O subsystem such a large and complex part of the kernel.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# IODC and PDC


    All native I/O modules provide an area of memory on the card known as I/O-dependent
    code (IODC). IODC normally resides in ROM on the interface card, but is frequently
    copied into main memory and accessed there. There are two components to IODC.
    The first is an area that contains information about the I/O module. By examining
    this information, the system can uniquely identify a particular type of module
    and determine how to interact with it. The second is a set of standard entry points
    that can be used to interact with the module. Not all modules provide all of these
    entry points. Some examples of these are ENTRY_INIT, which is used by the system
    at boot time to tell the card to initialize itself, and ENTRY_IO, which can be
    used at boot time to read or write through the module. This last is particularly
    important because this is how the kernel gets loaded into memory at boot time.
    In order for a device to be bootable, the I/O card it is connected to must have
    IODC that supports ENTRY_IO.


    # Processor-Dependent Code (PDC)


    Similar in concept to IODC, each native processor also has an area of processor-dependent
    code (PDC). It contains a set of standard entry points to control and query the
    processor. Among these are entry points for resetting the processor (PDC_RESET),
    handling hardware errors or machine checks (PDC_CHECK), and handling transfer
    of control requests (PDC_TOC). PDC also provides entries for retrieving model
    information, controlling the system''s chassis display, and managing the real-time
    clock.


    # I/O Address Space


    PA-RISC uses memory-mapped I/O space. This means that there are no specific instructions
    for performing I/O in the system. Instead, all I/O modules take up a portion of
    the memory space, and the system uses LOAD and STORE operations to interact with
    the memory modules. The 32-bit and 64-bit address layouts are slightly different,
    but the concepts are the same. Figure 10-2 shows the 32-bit layout, and Figure
    10-3 shows the 64-bit layout.'
  merge: -1
  img_proc: true
