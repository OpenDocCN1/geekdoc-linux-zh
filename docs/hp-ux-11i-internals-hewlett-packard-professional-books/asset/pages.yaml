  md: 'while an alpha semaphore is held. Over time, the alpha semaphores have been
    replaced with beta semaphores such that only one remains now: the file system
    semaphore, `filesys_`. Alpha semaphores are no longer officially deprecated, so
    there will be no new alpha semaphores created. The `filesys_`_` is the last.


    There are several differences between mutual exclusion semaphores and synchronization
    semaphores. Table 12-2 lists the key differences.


    **Table 12-2 Comparison of Semaphore Types**


    | Mutual Exclusion Semaphores | Synchronization Semaphores |

    | :--- | :--- |

    | Lock and unlock operations are always done by the same thread. | Lock and unlock
    are normally done by different threads. When the first thread locks the semaphore,
    it blocks. When another thread unlocks the semaphore, it allows the first to proceed.
    |

    | Semaphores are initialized to one. The first lock will succeed, all following
    locks will block. | Semaphores are initialized to zero so that the first lock
    will block. |

    | Semaphores have only two states: locked or unlocked. For this reason, these
    are also called binary semaphores. | Semaphores can take any value. For this reason,
    these are also called counting semaphores. |


    # Alpha Semaphores


    The actual implementation of alpha semaphores is fairly straightforward. The tricky
    part—dealing with contention between processors—is handled using a spinlock. Alpha
    semaphores are represented by a `struct` `sema` data type, also called a `sema_t`.
    The first field in a `struct` `sema` is a pointer to a spinlock, `sa_lock`. This
    protects the semaphore structure from concurrent access. Any time the semaphore
    structure is modified, the code first grabs the `sa_lock` spinlock, then modifies
    the semaphore, then releases the spinlock. In addition to the `sa_lock` field,
    there are two other fields—`sa_count` and `sa_owner`—which implement the core
    of the semaphore’s functionality. `sa_count` is one if the semaphore is unlocked
    and zero if it is locked. `sa_owner` is a pointer to the thread that owns the
    semaphore if it is locked.


    Because there is only one alpha semaphore in the system, there are a few alpha
    semaphore routines that are no longer used. For example, `pxsema()` and `vxsema()`
    are used to release one semaphore and acquire another in the same operation. Since
    there’s only one semaphore, there’s never a need to do this. The following are
    the more useful semaphore functions:


    +   - `initsema()` initialize a semaphore.

    +   - `psema()` acquires a semaphore.

    +   - `vsema()` releases a semaphore.

    +   - `owns_sema()` checks that a thread owns the semaphore.'
