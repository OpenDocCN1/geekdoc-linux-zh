    # # Kernel Memory Allocation


    In Chapter 3, “The Kernel: Basic Organization,” we talked about how the kernel
    manages virtual and physical memory. Memory is divided into pages of 4 KB each.
    The kernel’s page allocator handles allocating pages of memory to processes that
    need them. However, the kernel itself needs dynamic memory too, and it uses a
    different process. The memory allocations for the kernel are frequently for small
    areas of memory—the size of a proc structure or the size of a network buffer,
    for example. It would be impractical to just call the page allocator and request
    a page each time we need a small piece of memory. That’s where the kernel memory
    allocator comes in. It handles requests for memory from the kernel, getting pages
    from the page allocator as needed. It then divides these pages into smaller pieces
    so that it can be used efficiently.


    Beginning with HP-UX version 11.11, the method of tracking and allocating kernel
    memory has changed. Prior to 11.11 HP-UX, a scheme known as the McKusick & KareI
    memory allocator, also called the “bucket allocator,” was used. In release 11.11,
    this was replaced by the new arena allocator.


    Although our focus in this book is on HP-UX version 11.11, the bucket allocator
    is pervasive enough that it’s worth a brief look. Without going into too much
    detail, we look at the bucket allocator before examining the newer arena allocator.


    # ## The Bucket Allocator


    The bucket allocator divides memory requests into buckets by size, where each
    size is a power of two. Thus, we have a 32-byte bucket, a 64-byte bucket, a 128-byte
    bucket, and so on. When a kernel subsystem needs to allocate memory, the request
    is rounded up to the next power of two. So, for example, if a request is for 100
    bytes, it will come from the 128-byte bucket.


    The arrays bucket_32bit[] (for 32-bit kernels) and bucket_64bit[] (for 64-bit
    kernels) contain the head of a list of free areas of memory. The index into the
    array is the power of two of the size of the buckets: 2⁵ is 32, so the head of
    the 32-byte bucket list is at bucket_64bit[5], and so on.


    Memory is allocated using the MALLOC macro. This macro checks the freelist pointer
    to see if an area of memory of the requested size is on the list. If so, then
    the first address off the list is returned. If not, then a new page is requested
    from the page allocator by calling kmal_loc(). This page then is broken into pieces,
    the pieces are put on the free list, and the first of them is returned to the
    requester.


    When the memory is no longer needed, it is returned to the bucket lists by use
    of the FREE macro. If a lot of memory allocations are made and then freed, this
    can leave many pages of'
