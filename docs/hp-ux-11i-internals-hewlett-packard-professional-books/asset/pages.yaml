    these two values, each file is guaranteed to have a unique identity within the
    scope of the operating system.


    # Caching inode/vnode Data in the Kernel


    To improve system performance and reduce the amount of time spent accessing metadata
    on the disk, inode/vnode data is maintained in kernel-resident caches. Each type
    of file system is responsible for the allocation and maintenance of its inode/vnode
    cache. In most implementations caches are sized by kernel-tunable parameters or
    by an embedded formula. A hash is formed using the device number and the inode
    number. Before a copy of an inode is read in from the physical disk, the inode
    cache is always checked to see if a copy of the data is present.


