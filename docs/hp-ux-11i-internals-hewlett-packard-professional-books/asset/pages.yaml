    # **The Type-Specific In-Core Data Structures**


    Each file system type requires its own specific in-core data. Figure 8-13 illustrates
    the point.


    In general, the in-core data has a copy of the file system''s superblock, a pointer
    to the kernel''s copy of the inode/vnode to which the file system is mounted,
    and copies of the file system''s allocation tables.


    In the case of HFS, the kernel-resident structures include a mount structure (with
    pointers to the mount point''s inode/vnode), a pointer back to the file system''s
    vfs structure, and a pointer to a copy of the superblock maintained in the buffer
    cache (more on the buffer cache later in this chapter). Let''s examine the HFS
    mount and fs (superblock) structures in Listings 8.5 and 8.6.'
