    # Figure 8-18 The Buffer Cache Hash


    Once the hash has been calculated, the appropriate hash chain is searched to see
    if the requested data is present in the cache. In the case of a miss, the kernel
    works with the appropriate hardware driver, requests a physical data transfer
    from the disk, and allocates a free cache buffer to store the data in. Requests
    made and satisfied by the buffer cache are said to be *logical* reads and writes.
    Reads and writes within the buffer cache and a disk are called *physical*.


    A *write()* request is handled in a similar manner. If a buffer has already been
    started, a simple logical write is performed. When a buffer is filled or when
    a dirty buffer (one whose content differs from its counterpart on the disk) is
    found by the *sync* daemon during one of its scheduled scans, a physical write
    is scheduled. Physical writes may also be specifically requested by a programmer
    or when a file is closed.


