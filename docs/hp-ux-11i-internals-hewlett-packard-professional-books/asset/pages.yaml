    # The kthread table


    kthread structures are also dynamically allocated from a kernel memory arena and
    linked onto a list of active kthreads. In addition, all kthread structures belonging
    to a single process are linked together and to the parent process proc structure.
    Such threads are commonly called siblings. The process table has a pointer to
    the first and last of its sibling threads and maintains a count of how many it
    has spawned.


    Prior to HP-UX 11.i, the kthread table was also a static array allocated at system
    boot and sized by the kernel parameter kthreadNTHREAD.


