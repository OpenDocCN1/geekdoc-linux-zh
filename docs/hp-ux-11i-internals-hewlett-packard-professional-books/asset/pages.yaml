    # Prearbitration


    There is one more shortcoming to the spin and arbitrate method we''ve discussed
    so far. With a heavily used spinlock, many processors can be continuously looking
    at the same memory. This causes contention between the caches on those processors—the
    caches need to be continually flushed and updated to verify correctness. To avoid
    this contention, one more step was added to the process of acquiring a lock: prearbitration.
    Similar to the s1_arg array, there is a global array called pre_arbitration, with
    one entry per processor. Each entry in this array is of type struct pre_arbitration.
    In this structure is a pointer to a lock and a sequence number.


    Now when we try to get a lock and find it locked, we first call the preArbitration()
    routine. This routine looks through the pre_arbitration array for another processor
    that''s already waiting for this lock. If we find none, then the routine returns
    and we fall through to the usual spinlock code, spinning on the lock and waiting
    for it to be released. However, if we do find one or more processors already waiting
    for the lock, we find the one that is last in line based on the sequence number.
    Then we set our own pa_lock field to indicate which lock we''re waiting for, and
    then we spin, watching the processor that is in line before us. We''re looking
    at the pa_lock field of that processor''s pre_arbitration structure, waiting for
    it to change to zero. When we see the pa_lock field for the guy in front of us
    go to zero, we know that he has now acquired the lock and we''re next in line.
    We exit pre_arbitration() and continue to spin on the spinlock as we would without
    arbitration.


    Each of the pre_arbitration structures is aligned and sized such that it will
    be on its own cache line. That means that there is only one processor spinning
    on that cache line and it doesn''t have to be updated on the other processors.


    The whole process sounds complicated, but it''s really not as bad as it sounds.
    Figure 12-2 shows a flowchart of the process for acquiring a spinlock.


    Compared to acquiring the lock, releasing it is a pretty simple operation. First,
    we check for the lock''s s1_flag to see if anyone is waiting for it. If no one
    is waiting, we simply set s1_owner to zero and s1_lock to our PDPD. Then we restore
    the interrupt mask from before we had the lock, decrement the spinlock depth,
    and we''re done.


    If we find there is someone waiting for the lock, the process is still not much
    more complicated. We look through the s1_arb array to find out who is waiting
    for it. Then we set s1_owner to the PDPD of the processor that is waiting, leaving
    s1_lock at zero. The lock remains locked, but now the next processor in line is
    the owner of it. Recall that in wait_for_1_lock() the processor is looking for
    either s1_lock to become nonzero or for'
