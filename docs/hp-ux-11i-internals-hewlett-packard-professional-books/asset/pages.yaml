  md: '# Summary


    Resource maps have long been utilized by System V Interprocess communication kernel
    services, and if care is taken in their sizing, they are very efficient.


    # Searching Lists and Arrays


    Where there are arrays and lists of data structures, there is always a need to
    search for specific elements. In many cases, one data structure may have a simple
    pointer to related structures, but there are times when all you know is an attribute
    or attributes of a desired structure and not an actual address.


    # Hash tables: An Alternative to Linear Searches


    Searching a long list item by item (often called a sequential or linear search)
    can be very time consuming. To reduce the latency of such searches, *hash lists*
    are created. Hashes are a type of indexing and may be used with either static
    arrays or linked lists to speed up the location of a specific element in the list.


    To use a hash, a known attribute of the item being searched for is used to calculate
    an offset into the hashtable (hash arrays are frequently sized to a power of two
    to assist in the calculation and truncation of the hashed value to match the array
    size). The hashtable will contain a pointer to a member of the list that matches
    the hashed attribute. This entry may or may not be the actual entry you are looking
    for. If it is the item you seek, then your search is over; if not, then there
    may be a forward *hash-chain* pointer to another member of the list that shares
    the same hash attribute (if one exists). In this manner, you will have to follow
    the hash-chain pointers until you find the correct entry. While you will still
    have to perform a search of one or more linked items, the length of your search
    will be abbreviated.


    The efficiency depends on how evenly distributed the attribute used for the hash
    algorithm is within the members of the list. Another key factor is the overall
    size of the hashtable.


    # Example


    Suppose you have a list of your friends’ names and phone numbers. As you add names
    and numbers to the list, they are simply placed in an available storage slot and
    not stored in any particular order. Traditionally, you might sort the list alphabetically
    each time an entry is made, but this would require “reordering the deck.” Consider
    instead using a hashtable.


    As each entry is made, the number of letters in each name is counted; if there
    are more than nine, then only the last digit of the count is kept. A separate
    *hashtable* array with 10 entries is also maintained with a pointer to a name
    in the list with that *hash count*. As each name is added to the list, it is linked
    to all the other list members with the same hash count. See Figure 3-5.'
