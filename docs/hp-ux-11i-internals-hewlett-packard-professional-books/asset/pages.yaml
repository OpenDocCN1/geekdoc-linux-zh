    # ### Data Structures


    The primary data structure used for callouts is the `struct callout`, or `callout_t`.
    The structure is used for two different things: either a “real callout” — that
    is, to represent a callout event — or a “callout header.” At boot time a fixed
    number of callout structures are allocated. The number is determined by the `ncallout`
    system tunable. These callout structures are divided between the SPUs so that
    each SPU has its own pool of callout structures. The reason we divide them into
    per-SPU pools is to reduce lock contention. If we had a single pool, then we’d
    have to have a single lock controlling access to the pool. Because a callout scheduled
    on one SPU is triggered by that SPU, it makes sense for each SPU to have its own
    pool of callouts. An SPU can access its pool without blocking operations on another
    SPU. In the `mpinfo` structure for the SPU there is a field called `callout_info`,
    which points to a `struct callout_info_spu` (typed `callout_info_spu_t`). This
    structure maintains information about the callouts that pertain to that SPU. This
    structure has (among other things) a pointer to the first `callout_t` in the pool
    (`ci_callout`), one past the last `callout_t` in the pool (`ci_calloutEND`), and
    a pointer to a linked list of free callouts (`ci_freelist`).


    When a new callout is scheduled, the system gets an available callout structure
    from the `ci_freelist`, fills in the appropriate data, and then attaches it to
    a list of callouts that are scheduled. If an SPU runs out of free callouts, it
    can go to the pools belonging to the other SPUs and “borrow” callout structures
    from those free lists.


    The `callout_info` structure also maintains three sets of linked lists of active
    events based on when they are scheduled to occur. These are the near-term list
    pointed to by `ci_time_nr`, the mid-term list pointed to by `ci_time_md`, and
    the far-future list pointed to by `ci_time_ff`. The division of events into groups
    like this avoids the overhead of having to search the entire list of callouts
    at every interrupt. We only have to search the near-term list to see if anything
    has expired. When the near-term list is empty, we migrate events from the other
    lists.


    To enable us to find a particular callout, there is also a hashtable and hash
    chains. A hashing function determines which of several hash chains to search for
    a callout, then that chain is searched to see if the callout is on the list. Figure
    13-1 shows the relationship of the callout information in the `mpinfo` structure
    and the various lists of callouts.'
