- pgno: 166
  md: 'by threads from a stronger queue being awakened. In this section, we explain
    the various schedulers and introduce the \u201cmystic formula\u201d by which HP-UX
    adjusts a thread’s priority.


    A natural tendency in the discussion of priorities is to think in terms of numbers.
    We encourage you to instead consider only relative strength: is one priority stronger
    or weaker than another? There are several different priority schemes in use in
    the kernel. For some, zero is the strongest possible priority, and for others
    it is the weakest! (See Table 5-1.)


    | Scheduler | Policy # | Policy Label |

    |---|---|---|

    | HP-UX Timeshare | 2 | SCHED_HPUX |

    | | | SCHED_TIMESHAKE |

    | | | SCHED_OTHER |

    | | 8 | SCHED_NOAGE |

    | HP-UX Real Time | 6 | SCHED_RTPRIO |

    | | 0 | SCHED_FIFO |

    | POSIX Real Time | 1 | SCHED_RR |

    | | 5 | SCHED_RR2 |


    The challenge for modern UNIX systems is to incorporate the various priority schemes
    into one contiguous model. HP-UX uses a combination of three primary scheduling
    schemes: the traditional UNIX timeshare, HP real-time, and POSIX real-time schemes.
    Each scheme maps a range of priorities to a series of run queues; Figure 5-12
    illustrates how the three schemes have been merged into a single priority continuum.


    Each run queue has both internal and external priority values. The POSIX priorities
    presented a couple of challenges for the kernel designers. First, the number of
    POSIX priorities is a tunable parameter; 1 is the weakest priority, and the strength
    progresses as the value grows to the maximum of 512. For the other existing priority
    schemes the more positive the integer value the weaker the priority! This conundrum
    was addressed by adding the maximum number of POSIX priorities (512) to existing
    number of HP real-time and timeshare priorities (256) for a new total of 768 possible
