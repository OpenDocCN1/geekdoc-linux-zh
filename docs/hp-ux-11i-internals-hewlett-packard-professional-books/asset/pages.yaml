- pgno: 136
  md: '# Low-Level Initialization


    Once the appropriate promotion block is selected, the system will either transfer
    control to a lightweight system call (also known as a level-2 call) or it will
    enter the kernel `syscall-init() ` function (a level-1 call) to begin level-l
    initialization.


    In the case of a lightweight call, the action is performed and an immediate return
    is made to the system call sub. In reality, very little time is spent in the kernel
    code, so little in fact that the thread accounting system does not even attempt
    to charge any CPU utilization to the thread''s system time bucket. Instead, it
    is simply considered as user time.


    # High-Level Initialization


    `syscallinit() `contains an assembly-level initialization code routine designed
    to set up a save state and stack frame for use as we transition further into the
    kernel''s higher level. As the same kernel code may be called simultaneously by
    different user threads on SMP systems, each thread brings with it a privately
    owned kernel stack area. This kstack (three pages for a narrow application and
    six pages for a wide application) immediately follows the thread''s uarea (every
    thread has its own unique uarea/kstack memory region, discussed in greater detail
    in Chapter 6). The primary job of `syscallinit() ` is to make sure that the stack
    pointer (sp), the sub return address (r32), the original caller''s return address
    (xp), the user''s data pointer (dp), and the user''s space registers are safely
    stored away so that when all is said and done we will be able to return to the
    original calling context. The next step is to call the high-level initialization
    routine `syscall() `.


    The `syscall() ` kernel routine is written in C code and starts by collecting
    performance metrics relating to this thread. The measurement system is initialized,
    and we now start charging CPU utilization ties to the thread''s "system time"
    bucket. The current system call number is saved in the thread''s uarea (at `u_ssyscall`)
    and is used as the index into the ysuent[] vect or jump table. The kernel also
    contains the array ysaxux [] with specific 64-bit information about the pending
    call, such as the number of registers used by the call. Any extra arguments passed
    via the registers are copied to the uarea (`u_arg []), which satisfies the differences
    between the 32-bit and 64-bit calling conventions. Once the actual system call
    address is retrieved, a call is made to set jmp (`.


    Argument coercion may be required if the calling user thread is 32 bits and we
    are running a 64-bit kernel. This action is transparent for the most part, as
    the values stored in the thread''s `u_arg []` will have their sign bit extended
    to 64 bits. The argument coercion stub makes the actual call to the address index
    in ysent [r22].


    # The System Call


    Now we have arrived at the actual kernel code we requested. At this point, any
    of many paths may be followed. We may be asking for an I/O operation, in which
    case our thread will most likely be put to sleep and assigned a wait channel.
    We might simply perform the task requested'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'and start on the return path, or an interruption may halt our progress. In
    any case, let''s take stock of where we are and what we have working for us.


    The thread is now in kernel mode, and required stack space is being provided by
    the thread''s own private kstack area. A save state of the originating context
    is safely held in the urea, and we are proceeding with the full authority and
    privilege of the kernel.


    The next step is to begin the return trip to resume execution in our user thread
    context. We could find ourselves at this juncture as the result of several different
    scenarios. Perhaps an interrupt signifying the completion of an I/O operation
    was received, causing some other thread to be preempted; a user-defined signal
    handler may have completed and made a call to sig return(); or a system call could
    be simply finishing its job. The point is that the system call that initiates
    the return to a user thread is not necessarily the one that started the sequence:
    the kernel interrupt system, memory manager, I/O system, or any of a number of
    system services may have affected the sequence of events.


    # ## High-Level Return


    The high-level return path starts in the midst of the kernel syscall() routine.
    The return trip start by checking to see if the thread we are about to return
    to has received any signals. This is the only time that a thread checks for signals,
    and the programer may have chosen to ignore or block certain signals. We cover
    the signal-handling mechanism fully in a separate chapter of this book. For now,
    we simply want to mention that this is the point at which signals are checked
    for.


    Next, the system call''s return value is checked to see if an error occurred during
    the execution of the call or if the return was interrupted by the receipt of a
    signal. If all is well, the system call return value is passed back through the
    low-level return code by placing it into ret of the save state structure (which
    was created during the low-level initialization).


    One last task before transferring control to the low-level return code is to check
    the processor''s rrun flag. This flag is stored in a per-processor mp_info_t (this
    structure is covered in Chapter 12) and is set if an interrupt handler places
    a thread on a processor''s run-queue and notices that it belongs to a higher priority
    run-queue than the one from which that processor''s current thread is executing
    (remember on SMP systems, interrupts may be handled for an I/O operation requested
    from a different processor than the one on which the thread is running). If the
    rrun flag is set, the current thread is placed back on its run-queue by the setrq()
    kernel routine, and the kernel routine switch() is called to make a context-switch
    to the kthread at the front of the processor''s strongest run-queue. Once syscall()
    is satisfied that it has identified the most deserving thread, the measurement
    system is instructed to start charging CPU utilization to the user time bucket,
    and the low-level return routine is called.


    # ## Low-Level Return


    sysscalltrn() is an assembly code routine that basically restores the registers
    that were saved upon entry to the low-level initialization code: the stack pointer
    (sp), the stub return'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'address (r31), the original caller’s return address (rp), the data pointer
    (dp), and the user’s space registers are all restored prior to branching back
    to the system call stub’s return address (r31). The system call’s return value
    is passed to the original calling thread by way of r22, the same register that
    was used by the system call stub to pass the system call number. While this describes
    the normal system call return path, there are a couple of other possibilities
    that could have brought us here.


    If we have arrived here due to the trapping of a signal for which the programmer
    has defined a signal handler, we will check to see if a save state needs to be
    placed on a signal stack for future reference, and then we will return directly
    to the handler routine. If we are returning from a user-defined signal handler,
    then the save state will need to be recovered from the signal stack prior to completing
    the return.


    If the return is the result of a context-switch, we will recover the save state
    from the thread’s area and proceed directly back to the user thread’s context.
    Flags are also checked to see if this thread belongs to a process that is being
    traced; if so, various actions are taken depending on the level and type of tracing
    being used.


    The final step involves making a branch-external instruction to the stub’s return
    address in r31. This completes the system call and in the process demotes the
    thread to the user privilege level of 3.


    # Summary


    Knowledge of the relationship of processes to threads and the function of the
    system call interface will help us as we expand our study into the structural
    depths of the kernel. Remember that at any one instant in time a processor is
    simply executing a single instruction, and the processor is either user mode or
    kernel mode. There are only two ways in which the kernel mode may be entered:
    a user-initiated system call or as the result of a system interruption (interrupt,
    fault, or check). The kernel always attempts to return to the user mode upon completion
    of its tasks. Along the way it evaluates which user thread is the most deserving
    to run.


    Now that we understand the mechanics of moving between two modes, let’s examine
    in depth the kernel tables and data structures of key subsystems in the HP-UX
    kernel.'
  merge: -1
