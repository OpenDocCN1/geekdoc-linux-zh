- pgno: 355
  md: "struct mp_threadds. The struct mp_threadhd is simply a pair of pointers to\
    \ threads. It is used as the head of a doubly linked list of threads:\n\n```\n\
    typedef struct mp_threadhd {\n struct kthread *th_link; /* linked list of running\
    \ threads */\n struct kthread *th_rlink;\n} mp_threadhd_t;\n```\n\nThe th_link\
    \ member points to the first thread in the queue, and the th_rlink member points\
    \ to the last thread in the queue. Within the threads, kthread->th_link is the\
    \ forward pointer and kthread->th_rlink is the backward pointer.\n\n# # Synchronization\n\
    \nOne of the challenges of multiprocessor systems is synchronizing access between\
    \ the processors. In the early days of UNIX, it could be assumed that there was\
    \ only one processor and only one kernel, and once that kernel started running,\
    \ it had absolute control of the system. If the kernel had a critical sequence\
    \ of instructions, it could turn off interrupts and execute that code without\
    \ the risk of anything interrupting the flow. With multiprocessor systems, even\
    \ with interrupts off, it is possible that two processors could try to access\
    \ the same data at the same time. For an example of why this is a problem, consider\
    \ the following code, which stores a value into a circular buffer, increments\
    \ the index into the buffer, then wraps the index back to the beginning if it\
    \ is past the end:\n\n```\nbuffer[index++] = new data;\nif (index == BUFFER_SIZE)\
    \ {\n index = 0;\n}\n```\n\nThis looks pretty reasonable until you consider the\
    \ case where two processors execute the same code at the same time. Let's say\
    \ your buffer has 200 entries, so BUFFER_SIZE is 200. You've got 199 entries in\
    \ the buffer, so index is at 199. Processor A stores the new data at buffer[199]\
    \ and increments index to 200. Now Processor B stores its new data at buffer[200]\
    \ (off the end of the buffer) and increments the index to 201. Next, Processor\
