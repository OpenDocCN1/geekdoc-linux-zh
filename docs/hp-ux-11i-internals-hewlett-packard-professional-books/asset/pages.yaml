- pgno: 407
  md: 'The `trace processor` command takes a single argument, the number of the processor
    you wish traced. q4 prints a stack trace for whatever was running on that processor.


    You can use `trace process` or `trace thread` at to get a kernel stack trace for
    a particular process or thread. The value following at should be the address of
    a `struct proc` or a `struct _kthread`. Tracing a process will print a stack trace
    of all the threads for that process.


    You can also use `trace pile` to get a trace of whatever is in the current pile.
    The structures in the pile must be of type `struct proc`, `struct kthread`, `struct
    minfo`, or `struct crash event_table_struct`. Here''s an example of using `trace
    pile` to get the stack trace for a particular process:


    ```

    q4> load struct proc from proc_list next p_factp max 10000

    loaded 150 struct proc as a linked list (stopped by null pointer)

    q4> keep _p_pid == 2003

    kept 1 of 150 struct proc''s, discarded 149

    q4> trace pile

    stack trace for process at 0x0''42846040 (pid 2003), thread at

    0x0''42847040 (tid 2104)

    process was not running on any processor

    __swtch+0xcx4

    _sleep+0x318

    fifo_rdwr+0x2f8

    vno_rw+0x1ac

    read+0x10c

    syscall+0x204

    $syscall$rt+n+0x0

    ```


    This shows us that this particular process has done a `read()` system call on
    a `fifo`. The `fifo` is empty, and the process has been put to sleep and will
    be woken up when data is available to read.


    # Using Perl Scripts in q4


    q4 ships with a directory full of Perl scripts that can automate some common operations.
    Because these were designed for Hewlett-Packard internal use, they are not well
    documented and some have very limited, specific uses.


    The Perl files are usually located in `/user/contrib/lib/q4`. Each script is a
    file with a `.pl` suffix. To use these files, you first have to use the `include`
    command to have them read into q4. For example, to include the `whathappened.pl`
    script, type


    ```

    q4> include whathappened.pl

    ```


    Once the file is included, you run it with the `run` command:'
