- pgno: 240
  md: '# CHAPTER 8


    # # Files and File Systems


    T he file system is a basic workhorse component of an operating system. Figure
    8-1 shows the big picture of the file management subsystem in the HP-UX kernel.
    Our study is divided into three phases: first we examine basic file system concepts,
    then we focus on the design and implementation of the classic UNIX File System
    (UFS), and finally we examine the kernel-resident structures utilized to keep
    track of mounted file systems.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_240_0.png)


    **Figure 8-1** The File Management Subsystem'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Not all applications store data of the same type or follow the same data utilization
    modes. Over the years, a variety of file system types have been created to meet
    the needs of programmers, improve dependability, and increase performance. To
    simplify the interaction between a specific file system type and the rest of the
    kernel, an abstraction layer known as the *virtual file system* (VFS) has been
    implemented. As we study the file management subsystem, be on the lookout for
    transition points between VFS structures and implementation-specific structures.


    # # File System Concepts


    Before we begin our study of the specifics of file systems and HP-UX, we need
    to spend a little time thinking about what a file system really is.


    # ## The Challenge


    Since the beginning of computer operating systems, there has been a need to store
    program instructions and data in some type of nonvolatile memory so that they
    may be recalled and loaded into the system’s RAM when needed. Very early systems
    stored information by punching patterns into paper tape or “keypunch” cards. This
    worked but was very slow and added the tasks of storage, collation, and labeling
    to the growing list of duties for the computer operator. When rotating magnetic
    storage mechanisms were first created (early cylindrical rotating drums evolved
    into flat disks with multiple platters), basic storage algorithms were developed.


    # ## File Systems: A Simple Approach


    The first disk drives had precious little storage space (some of the first floppy
    drives held only 140 KB of data1), and the storage algorithms employed were quite
    simplistic by necessity. Figure 8-2 outlines a basic approach.


    The first step was to come up with a way to identify specific drives under the
    control of the operating system. One approach was to assign drive letters to each
    physical drive. Once we can identify a specific drive, we need to be able to locate
    directory information for the files stored on it. Most early file system designs
    placed a pointer to the disk’s directory data on the first physical sector of
    the mechanism (regardless of the overall size of a disk drive, they all have a
    first sector).'
  merge: -1
  img_proc: true
- pgno: 242
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_242_0.png)


    A unique file path descriptor \u2192 **A:F5**


    # Figure 8-2 File System Basics: 101


    These early directory structures were very sketchy in their details. Basically,
    there was an entry for each file consisting of its name, a starting offset, and
    the file\u2019s overall size. This approach is called a *flat file system*, so
    named because the file system had a single directory and all of its files were
    managed by this directory. In addition, all the data making up a specific file
    was stored in contiguous sectors on the disk. Once you found the beginning of
    a file, you simply read its data from the disk in a sequential manner until you
    reached its end. Although this approach is very dated, it still has certain strengths.
    If a file is to be accessed in a sequential manner or its contents are needed
    in their entirety, then the contiguous nature of storage in a flat file system
    provided good performance. A major weakness was the dynamics of what happened
    when a file was removed from the storage matrix or when an existing file needed
    to grow.


    When a file was removed, it left a hole. New files could be located in the hole
    as long as their size was equal to or smaller than that of the hole. New files
    larger than the hole needed to find available free space elsewhere on the disk.
    If an existing file needed to grow, it could simply extend its size if there was
    adjacent free space or be moved to an area of larger free space if one was available.


    This juggling of data resulted in fragmentation of the available free space within
    the overall disk. An approach to minimize this problem involved periodic disk
    maintenance to defragment the disk (see Figure 8-3).'
  merge: -1
  img_proc: true
- pgno: 243
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_243_0.png)


    **Figure 8-3 Fragmentation of Available Space**


    While defragmentation allowed the administrator to coalesce the free space holes
    into a contiguous free space at the end of the drive, it had to be performed while
    all the files on the drive were quiescent. This may not seem like much of an issue,
    but in today''s world with 7-by- 24 system utilization and +99.999% uptime requirements,
    defragmentation is a costly option.


    # ### UNIX Gets a File System


    In the early 1970s, the developers of what was to become known as UNIX faced the
    need to design and implement a file system for their fledgling operating system.
    The file system designs in use at the time were mostly flat and required frequent
    defragmentation. Instead of following the crowd, our fearless UNIX developers
    chose to think outside the box and make fragmentation their friend. Figure 8-4
    shows the first step to this new approach.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_244_0.png)


    Figure 8-4 Fragmentation Is Our Friend


    First, the entire disk is subdivided into uniform *disk blocks* (for the original
    UNIX file system, the block size was 512 bytes). A file’s data is stored in any
    available disk block. There is no requirement that they be sequential or contiguous.
    The disk’s free blocks are easily managed by the use of a simple bit allocation
    map. Each block is represented by a bit in the bitmap. If the bit is set, the
    block is in use; if it is not set, the block is available.


    The challenge with this design is to track the specific blocks that belong to
    a file and the order in which they are allocated. To this end, a section of the
    disk space is reserved (at the time of file system creation) to hold information
    about each file (see Figure 8-5).'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_245_0.png)


    # **Figure 8-5 Creating an Index**


    These indexed information nodes (*inodes*) have a fixed size and are arranged
    in an array located in the middle of the disk’s storage space. Since each file
    reference required accessing the file’s *inode* by locating the *inodes* in the
    middle of the disk, overall disk access times were optimized.


    The *inode* array is a prime example of what we call metadata, the administrative
    overhead required to manage the file system’s user data. Additional metadata structures
    are shown in Figure 8-6.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_246_0.png)


    Figure 8-6 Metadata


    As we mentioned, the inode table was located in the middle of the disk to improve
    overall access time; but as not all disk drives are the same size, there needed
    to be a metadata structure in a well-known location on all disks containing potential
    file systems. To meet this need, several additional structures were created.


    When a machine is booting, it is running from simplified code in its boot ROM.
    A boot ROM usually has very minimalist driver code and can read only the first
    block of a device. For this reason, the first block of the disk is reserved as
    a boot block. Next, a block called the super-block is allocated. The superblock
    contains static and dynamic information about the specifics of the file system
    on the disk. One of the most important components is a pointer to the starting
    address (a byte offset) of the inode table. Additional structures, such as bit
    allocation maps, are also assigned and mapped by the superblock. Each type of
    file system may have its own specific additions to the contents of the superblock
    but certain key values are located at fixed offsets within the superblock regardless
    of the file system type. These values are used by the kernel to identify the file
    system type, version, and basic static configuration data.


    # Layering a Directory Hierarchy on a Flat File System


    Another feature desired by the UNIX developers was the implementation of a hierarchical
    file system. The file structure was based on a basically flat model (there is
    only one inode table per file system), so a method needed to be developed to facilitate
    the use of directories and subdirectories.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'tories. This brought about the creation of a special type of file known as
    a *directory*. This is an important point: in UNIX, a directory is simply a special
    type of data file.


    Every file on a UNIX system is known by its file system’s device number and its
    *inode* number. Directory files contain a pairing of file names with their *inode*
    numbers on the local file system. Let’s consider what is required to locate the
    contents of a file with the pathname of /home/chris/stuff (see Figure 8-7).


    We start our search with the superblock of the / (root) file system. The superblock
    gives us the offset for the start of the *inode* table. As a standard, all file
    systems use *inode* 2 to point to their root directory data blocks. The size of
    an *inode* is fixed, and the first *inode* has an index of 0. Therefore, if you
    know an *inode* number, you may easily calculate its location on the disk volume.
    To find *inode* 2, you simply take the *inode* table offset from the superblock
    and add 2 * *inode*-$size*-$in*-$bytes* and you have the byte offset from the
    beginning of the file system.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_247_0.png)


    **Figure 8-7 Super Blocks, Index Nodes, Directories, and User Data**


    Examination of the root directory reveals that the *home* directory file’s *inode*
    is 5. We return to the *inode* table and access node 5 and follow the block pointer
    to its data block. This reveals the *inode* number for the *chris* subdirectory.
    We then access node 10 and locate the *stuff* directory block pointer. From this
    block we learn that *inode* 14 contains the attributes of the /home/chris/stuff
    file. Now we simply have to follow the various block pointers in this *inode*
    to access the file’s data.


    You may have noticed that the *inode* contains pointers to disk data blocks and
    a type flag to let us know whether the next step of our scavenger hunt will lead
    us to a directory file or a reg-'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'ular file. The actual specifics of the inode data structure differ from one
    file system type to another. Next, we study the specifics of the Hierarchical
    File System (HFS) as implemented by the HP-UX operating system.


    # The New and Improved UNIX File System


    The early history of UNIX development consisted of two competing flavors of UNIX:
    the original AT&T/Bell Labs release and the Berkeley System Definition. The original
    code from AT&T could not be sold, as antitrust laws didn''t allow AT&T to compete
    in this area, but the company was allowed to provide copies of its operating system
    code for free, and many universities took them up on the offer. The University
    of California, Berkeley, became a hotbed of UNIX development efforts, and one
    of the first areas it addressed was the file system.


    The original UNIX file system was unique in its approach to file data management
    but had several weak points in its design. Among them was its dependency on the
    all-important superblock. If this key structure was corrupted, then all access
    to data on the file system was lost. In addition, the design allowed the blocks
    of a single file to be spread across the entire disk space with no attempt to
    keep related blocks in any type of order. This played well when the kernel was
    trying to figure out where to put the next block of data, but the price had to
    be paid in performance when a file had to be accessed in its entirety (file copies,
    backups, etc.).


    As disks got bigger, the tendency was to increase the file system block size to
    keep the management overhead to an acceptable limit. This was fine as long as
    you didn''t have lots of very small files. A file with only a small number of
    bytes would require an entire block for its storage. This could result in an inefficient
    utilization of disk space.


    The Berkeley File System (BFS) attempted to address these and other performance
    issues. For the record, the following names all refer to the same file system
    implementation:


    +   * High-performance File System or Hierarchical File System (HFS in HP-UX)

    +   * Berkeley File System

    +   * Fast File System (FFS in SYS V.4)

    +   * McKusick File System

    +   * UNIX File System (UFS)


    # HP-UX''s HFS


    The HFS has long been the main file system for the HP-UX kernel, and indeed for
    PA-RISC-based systems, the kernel image may be loaded only from HFS. Although
    recently there are contenders to HFS''s position as the HP-UX default file system,
    we study it here, as it sets the baseline for HP-UX file system features and performance
    comparisons. Figure 8-8 illustrates a high-level view of this model.


    File access time depends on a couple of basic factors: first, the average *seek
    time*. Assume that a disk has 1,000 distinct tracks. The amount of time it takes
    to move the disk head from one'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'track to another is the seek time. Sometimes the data you are seeking is one
    track away and sometimes it might be 1,000 tracks away. The average seek time
    is the time it takes to reposition the head across I of its total track count
    (500 in our example).


    The other factor affecting disk access time is *rotational latency*. Consider
    a rotating disk platter with a number of sectors located around each track. The
    sector you require might be the next to come under the head, or it might have
    just passed by, in which case you will have to wait for a complete revolution
    of the disk. As such, the average rotational latency is the time it takes for
    half a revolution of the disk media.


    ![](img/08b7d2492fc1415a694a5fb16a8fdeb3_249_0.png)


    # Figure 8-8 The HFS File System Layout


    From a designer’s point of view, the only way to reduce the rotational latency
    is to get a faster disk (you may have noticed the trend from 5400 rpm disks to
    10,000 rpm or higher in the PC market recently). The disadvantages of speeding
    up a drive is that the tolerances of the heads must be increased and that speed
    equals heat—the faster the drive spins, the more heat dissipation the hardware
    designer has to deal with. These two issues add up to increased cost. As far as
    the seek time is concerned, the trend is to increase the number of tracks, not
    decrease them, as hardware designers are constantly trying to increase the capacity
    of their drives.


    This is where the file system designer chose to implement a “soft” solution to
    the challenge. By dividing the disk into multiple cylinder groups and allocating
    inodes and their related data blocks within a cylinder group whenever possible,
    the average seek time may be greatly improved. Each cylinder group contains a
    portion of the inode table, a redundant copy of the superblock (the fsck utility
    can use one of these copies to recover a corrupted super-'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'block), and localized metadata to manage and monitor utilization of the local
    cylinder group space.


    Reconsider our example, assume that the whole disk was divided into 100 cylinder
    groups. Each cylinder group (CG) would be mapped to 10 adjacent tracks. While
    the rotational latency would be a constant the all the individual blocks containing
    a file''s data would be located within a 10 track area. For access to this single
    file the average seek time would be reduced from the time to move 500 tracks to
    the time to move 5 tracks! Simply by following these conventions for the placement
    of a files data we could see a vast improvement in access time. We realize that
    this is an over-simplified explanation but it points our thinking in the right
    direction.


    # Direct and Indirect Block Pointers


    You may be wondering how a fixed-size inode can point to all the data blocks of
    files of varying sizes. If the block size is fixed and the inode size is fixed,
    it seems that there would be an implied maximum file size. To work around this
    issue, the HFS inode employs four types of block pointers:


    +   - Direct pointers (12 per inode)

    +   - Single indirect pointers (one per inode)

    +   - Double indirect pointers (one per inode)

    +   - Triple indirect pointers (one per inode)


    The original AT&T file system had a 512-byte block, and the inode was 128 bytes
    and had room for 15 block pointers (each pointer was 32 bits). Let''s examine
    the limits of this model (Figure 8-9).


    There are 12 direct pointers that locate the first 12 blocks containing file data,
    allowing for 12 * 512, or 6 KB of storage. If the file grew beyond this size,
    then the 13th pointer (the single indirect pointer) was used to point to a data
    block that could hold additional direct pointers (a block size of 512 meant that
    an indirect block would hold an additional 128 pointers). The 14th pointer (the
    double indirect) could point to a block containing additional single indirect
    pointers, and the 15th pointer (the triple indirect) could point to a block containing
    additional double indirect pointers. In this manner, a fixed-size inode could
    map a very large number of file data blocks.'
