  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_99_0.png)


    # **Figure 3-8 Sparse Tables**


    Pros


    Sparse lists greatly reduce the average search time to locate items in unordered
    tables or lists.


    Cons


    Sparse lists require the kernel to manage the available sparse data-element locations
    as yet another kernel resource. As there is a possibility that the data element
    first pointed to may not be the actual one you are searching for, the target structure
    must contain enough data to validate that it is or is not the one you want. If
    it isn’t, a routine needs to be developed to “walk the chain.”


    Summary


    Sparse lists work best when there is some known attribute(s) of the desired data
    set that may be used to generate a sufficiently large and distributive hash value.
    The odds of needing to create a forward chain pointer decrease greatly as the
    scope of the hash increases. We will see an example of this approach in the HP-UX
    kernel’s virtual-to-physical page-frame mapping. In actual use, it is a one-in-a-million
    chance to find a hash-chain with more than three linked elements!'
