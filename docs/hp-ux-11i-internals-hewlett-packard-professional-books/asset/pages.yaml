    As we see in this structure, page frames are linked to several lists. Of course,
    there is a free list to facilitate page allocation schemes, and all pages related
    to a specific open file are linked together as well. Another linkage is the pf_hchain
    at the top of the structure; let''s take a look at how this hash is utilized.


    # Is a Page I/O Really Needed? (phash and phead)


    To assure that there are always free pages available when one is requested, the
    kernel invests a portion of its resources into the proactive identification of
    stale pages and the transfer of these pages to a swap location or back store.
    Moving pages between a disk and physical memory is a very costly operation in
    terms of computer instruction cycle times and I/O bandwidth. However, not being
    able to find a free page when one is needed can really throw a wrench into the
    works! As part of the page-out operation, a page''s pfsdat structure is added
    to a hashed list (see Figure 6-15). The pages are hashed according to the disk
    block descriptor and the device pointer of the device they have been written to.
    The actual hash algorithm is


    ```

    (dhd_data>>5)+dhd_data) xor (devvp >> 6) & phashmask

    ```'
  merge: -1
  img_proc: true
- pgno: 210
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_210_0.png)


    # Figure 6-15 *phash* and *phead*


    To minimize the cost of paging, the *phash* is searched before a page-in operation
    is called just in case the page frame has not been reallocated since it was paged
    out. If the required page is found on the *phash*, it is simply removed from its
    free list and reinstated in the *region_htbl*, and *pfn_to_virt* tables.


    If you are starting to feel comfortable with the logical to virtual to physical
    to front store and back store relationships, great! That’s the goal of this work,
    but we need to take a deep breath and press on. Recent developments have introduced
    another level of complexity to our strategy for managing this precious resource.


    # Views, Ponds, Pools, Pages


    An operating system’s physical page allocator must be able to work in harmony
    with the underlying physical hardware. The kernel claims physical pages for its
    own memory arena scheme and for dynamic assignment to meet its process’s needs.
    As HP-UX is migrating from a purely proprietary architecture, PA-RISC to the new
    IA-64, the memory allocator must be modified to handle architectural differences.
    In preparation for this change and to facilitate partitioning schemes recently
    introduced, the kernel memory allocator has been modified. Figure 6-16 illustrates
    an abstraction of the new model.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/08b7d2492fc1415a694a5fb16a8fdeb3_211_0.png)


    # **Figure 6-16** Pools, Ponds, Views


    This new model includes a combination of views, ponds, pools, and groups. Let''s
    try to define these terms and concepts.


    # ### Physical Memory View


    The highest level of organization is the physical memory view, or **pmv**, which
    allows a system''s physical memory to be divided into sets depending on specific
    properties or aligned according to physical configurations. One use would be to
    divide memory according to its access latency. On an SMP (symmetrical multi-processor)
    or UMA (uniform memory access) machine there would be only one **pmv**, while
    on a multinode design or ccNUMA (non-uniform memory access) platform, each node
    (or cell) might have its own **pmv**. To date, this level has not been coded into
    the HP-UX kernel and is presented here only for future considerations.


    # ### Logical Memory Views


    The logical memory view, or **lmv**, is the next level of division within a **pmv**.
    The **lmv** maintains its own free lists and lock structures. Currently, the **lmvs**
    are aligned with the system''s processor sets. By having each processor set allocate
    memory from its own free list and use its own locking mechanism, overall system
    performance is increased due to the reduction in lock contensions. This is currently
    the highest abstraction level incorporated in the HP-UX kernel. The **lmv** is
    managed by an array of **lmv** structures allocated at boot time. The number of
    **lmvs** is currently calculated as the total number of processors divided by
    four.'
  merge: -1
  img_proc: true
- pgno: 212
  md: "# ## Memory Pools\n\nEach *lmv* is made of one or more *pools* of memory. A\
    \ memory **pool** boundary is set in alignment with intrinsic hardware restrictions.\
    \ For instance, on an HP-UX 32-bit kernel the first gigabyte of physical memory\
    \ belongs to one **pool**, and the memory above 1 GB belongs to another. To allow\
    \ equivalent memory mapping of kernel pages, it is required that they be in the\
    \ first physical gigabyte of memory. By having the two pools, the memory allocator\
    \ may be instructed to always allocate kernel pages from the first pool and to\
    \ allocate user pages from the second pool (unless none are available, in which\
    \ case the first pool is used).\n\nOn current PA-RISC systems, there are only\
    \ two pools, one for equivalently mapped memory and one for nonequivalently mapped\
    \ memory. On a wide system, the entire physical memory may be equivalently mapped,\
    \ as the addressing range for the 64-bit system is quite large ($2^{42}$).\n\n\
    The page pool data is stored in an array of **page_pool** structures, which reside\
    \ inside their respective *lmv*.\n\n# ## Memory Ponds\n\nAs mentioned, if a *page*\
    \ is swapped out to increase the supply of free pages, its **pfdst** structure\
    \ is linked to the **phas**. These pages are called *cached* free pages. As pages\
    \ are freed, they are divided into one of two ponds of memory: one for cached\
    \ free pages and the other for uncached. If the system uses variable page sizing,\
    \ then a separate free list is maintained for each page size. The number of free\
    \ list headers created per **pond** is determined by the kernel tunable parameter\
    \ **pf_offset_idx** and set at boot time. The **pond** structure is contained\
    \ as an array in its corresponding pool structure.\n\n# ## The Nested Structures\n\
    \nIn Listing 6.13, we see that the *pond* array is nested in the **pool** structure,\
    \ which in turn is nested in the *lmv* structure.\n\n```\n```\nListing 6.13  q4>\
    \ fields lmv_t\n\n  Number of pools in this logical memory view\n  0 0 4 0 int\
    \      lmv_npools\n  Index of this logical memory view\n  4 0 4 0 int      lmv_id\n\
    \  Amount of free memory in this view\n  8 0 4 0 int      lmv_freeem\n  Pointer\
    \ to spinlock for protection of this view's free lists\n  12 0 4 0 *       lmv_fi_lock\n\
    \  Individual page pool structures (for PA-RISC there are two\n  pools per logical\
    \ memory view). We start with a linked list of\n  all page groups in the pool,\
    \ a free list spinlock for this\n```\n```"
  merge: -1
