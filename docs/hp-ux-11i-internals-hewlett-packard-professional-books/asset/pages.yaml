- pgno: 403
  md: '# # Loading Multiple Structures


    Now we know how to load up a structure and examine its contents. But a pile can
    be more than one structure—you can load up a whole array of structures. We do
    this with the `max` keyword to the `load` command, which tells q4 the maximum
    number of structures to load; the default is one. Continuing with our `m_pinfo`
    example, we can load the `m_pinfo` structures for all of the processors by taking
    advantage of the global symbol `n_mpinfo`, which tells us how many there are:


    ```

    ```

    q4> load struct m_pinfo from mp_mproc_info max n_mpinfo

    loaded 2 struct m_pinfo as an array (stopped by max count)

    ```

    ```


    q4 tells us how many were loaded and what made it stop.


    # # Loading Linked Lists


    The linked list is such a common structure in the kernel that q4 has knowledge
    of linked lists built in. To load a list of structures into a pile, you have to
    tell q4 which element in the structure points to the next structure in the list.
    You do this with the `next` keyword.


    For an example, let’s look at the process table. Prior to HP-UX release 11.11,
    the process table was a statically allocated table of entries. Beginning with
    HP-UX 11.11, the process table is a linked list. The head of the list is pointed
    to by the symbol `proc_list`, and each entry in the list has a member called `p_factp`,
    which points to the next entry. To load up all of the current process table entries,
    we type


    ```

    ```

    q4> load struct proc from proc_list next p_factp max 10000

    loaded 155 struct proc as a linked list (stopped by null

    pointer)

    ```

    ```


    q4 again tells us how many structures were loaded and why it stopped—in this case
    because it encountered a null pointer. q4 detects the end of a linked list either
    when it finds a null pointer or when it finds a pointer that points back to the
    first entry in the list.


    Notice the large value for max. In this case, we wanted all of the `proc` structures,
    so we picked a `max` value large enough that it wouldn’t be exceeded. Without
    specifying `max` at all, we would get only one structure loaded.


    # # Using Values from a Pile


