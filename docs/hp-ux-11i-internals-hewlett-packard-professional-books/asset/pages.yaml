    hand makes a complete revolution, the hour hand moves forward one tick. Similarly,
    each list in the midterm wheel represents the same amount of time as the entire
    near-term wheel. On the near-term wheel all callouts that expire in a particular
    tick are on the same tick. With 128 lists in the wheel, that means anything expiring
