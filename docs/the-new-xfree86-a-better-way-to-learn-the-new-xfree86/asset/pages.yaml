    # XFree86 Fonts


    You can control and support fonts in a number of ways when using XFree86. You
    can install fonts locally or on a remote server. Most users working on a standalone
    workstation will have X11 fonts installed under the /usr/X11R6/lib/X11/font directory,
    although other fonts may be found under the /usr/share/fonts directory.


    Font management utilities for X first appeared in X11R3. This release includes
    utilities such as the mkfontdir client, which is used to create font name databases
    in each subdirectory included under the /usr/X11R6/lib/X11/font directory. Other
    font utilities include the xlsfonts command, which lists installed,'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Chapter 4: Overview of XFree86


    xfontsel client, which displays individual fonts selected from various font families,
    and the xfd client, which displays characters in an X font.


    Fonts are stored in compressed form in separate directories, sorted according
    to type and resolution. Compressed font support has been present in XFree86 at
    least since version 2.1; however, starting with version 3.3.1, XFree86 has stored
    fonts in the more efficient gzip format instead of the UNIX format.


    For example, the font directories included with XFree86 4.0.1 include the following:


    +   * 100dpi

    * CID

    * Speedo

    * cyrillic

    * latin2

    * misc

    * 75dpi

    * PEX

    * Type1

    * encodings

    * local


    Each directory contains a fonts.alias and fonts.dir file. The fonts.dir file contains
    a line indicating the number of fonts, along with a list of abbreviated font filenames
    and names of each font. X and xfs font server use this minitabase to find font
    files. Scalable font directories also contain a file named fonts.scale (generated
    by the ttkfdir client). The fonts.alias file contains two columns of information:
    an alias and a name. This file is used to create new font names for existing fonts.
    The encodings directory contains Type1 (also known asType) font encodings generated
    by the mkfontdir client. This information is used to scale and draw fonts for
    your display.


    The most important configuration file is the FontPath entry in your system''s
    XF86Config file in the Files section. For example, the following is the minimum
    entry required to use XFree86 on a standalone workstation:


    Section "Files"


    ```

    FontPath      "/usr/X11R6/lib/X11/fonts/misc"

    ```


    EndSection


    Using the previous listing of font directories, an example set of FontPath directories
    might be as follows:


    Section "Files"


    ```

    FontPath      "/usr/X11R6/lib/X11/fonts/misc"

    ```'
  merge: -1
