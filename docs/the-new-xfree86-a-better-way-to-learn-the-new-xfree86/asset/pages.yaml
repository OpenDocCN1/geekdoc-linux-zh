  md: '# Chapter 14: Configuring X11 Input


    recognizes a -keyboard command-line option, and you can define additional keyboards
    as "CoreKeyboard" input devices. The next section expands on the use of keyboards
    for XFree86.


    # Keyboard Issues


    Keyboards are an important part of your X session. Using the right keyboard of
    the right size and at the height for typing can reduce the risk of Carpal Tunnel
    Syndrome. This is a serious condition, usually brought on by severe repetitive
    stress injury that can eventually become disabling. Affected areas include the
    back, neck, shoulders, arms, hands, and, more commonly, the wrists and forearms.
    Symptoms include pain, stiffness, coldness, tenderness, swelling, and numbness.


    Some general tips, compiled from various computer manufacturers that want to combat
    bad problems and help ensure comfort, the following:


    +   * Adjust body position.

    * Distribute your weight evenly.

    * Keep your elbow height near your keyboard.

    * Keep your head vertical and comfortable.

    * Keep your keyboard in front of you.

    * Keep your thighs level.

    * Keep your wrists straight when typing.

    * Let go of your mouse when you''re not using it.

    * Move around occasionally.

    * Relax your fingers and thumbs when you type.

    * Rest your feet on the floor.

    * Support your lower back.

    * Type softly.

    * Use arm supports if available.

    * Vary your posture.

    * When typing, use your arm instead of reaching with fingers.


    Other factors include the comfort and placement of frequently used keys, the availability
    of characters, and the readability of the keyboard during the work session. Fortunately,
    using Linux and X, you can completely redefine your keyboard and remap keys to
    accommodate a wide variety of styles and needs. It is up to you, however, equip
    your workspace with ergonomics in mind and to make your sessions as comfortable
    as possible.'
  merge: -1
  pgno: 295
