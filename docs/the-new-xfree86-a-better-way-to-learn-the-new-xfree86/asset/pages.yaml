    The RPM files are usually installed during an initial Linux installation, although
    you can install them manually using the rpm command or a graphical RPM client
    such as GNOME''s gnome or KDE''s kpackage clients. The compressed file size of
    the XFree86 3.3.6 distribution in Table 2.3 is nearly 40MB, but not all of the
    fonts or X servers are installed if you configure XFree86 during a Linux session.


    # Downloading Binary Archives


    go to Project, Inc.''s FTP site to get the latest copy of XFree86. The software
    is distributed in source code form so you can build the distribution yourself,
    or in binary (compressed archives). There are versions for the following-operating
    systems:


    +   * FreeBSD 2.2, 3.X, 4.X

    * Linux (Alpha)

    * Linux (Intel)

    * NetBSD 1.3

    * OpenBSD 2.7

    * Solaris-8

    * Unixware


    For Linux, you have your choice of libc5, glibc20, and glibc21 distributions.
    The libc5 and glibc20 versions are for older Linux distributions. Most Linux users
    using newer distributions, such as Red Hat 6.2, Mandrake, and SuSE 7.0, should
    use the glibc21 distributions, as the software will match the software libraries
    used in the Linux distributions.'
