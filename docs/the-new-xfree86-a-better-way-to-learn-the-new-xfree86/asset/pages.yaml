  md: '# The Resolution Revolution


    Most early personal computers (that is, pre-IBM PCs) used either a TV or a monochrome,
    single-color, text-only display (usually with the standard 80 characters by 24
    or 25 lines resolution). The capabilities of PC graphics cards and monitors have
    increased dramatically since those early days, progressing from Video Graphics
    Adapter (VGA) resolutions, or horizontal lines of 320 by 200 vertical pixels,
    to today''s resolutions of 2,048 by 1,536. Cutting-edge graphics cards now sport
    onboard random access memory (RAM) may equal or exceed that of one''s PC, and
    also offer features as TV, composite, and S-Video output. Performance and power
    are now measured by a card''s fill rate—that is, speed at which the card can paint
    the screen. This rate, in megixels (or millions of pixels) can indicate the number
    of frames per second that a card can provide at a specified resolution and at
    a specific color depth (number of colors per pixel). Color depths, represented
    by the number of bits, (such as 1-bit for monochrome) can range from four-bits
    per pixel (bpp), or 16 colors, to 32 bpp, or millions of colors. Today''s fast
    cards can provide up to 100 frames per second (fps) at 32 bpp at 1,280 by 1,024.


    switches, loading paper tape, and rewinding cassettes to load programs, modifying
    IBM typewriters for use as printers and swapping five-inch floppy disks. With
    faster CPUs, high-resolution color monitors, multiple-button pointing devices,
    ever-increasing hard drive space, and rewritable CD-ROM drives, today''s desktop
    sessions allow us to get to work and accomplish more efficiently than ever.


    Unless you have older hardware, such as a laptop with limited resolution such
    as 800×600, to acquire or set up your computer to display X at a minimum of 1,024
    pixels by 768 pixels with, a color depth of thousands of colors (16 bpp). Although
    you can get work done at 800×600, you''ll find that you''ll run out of screen
    real estate when using a lower resolution and that some graphics display poorly
    when represented on a 256-color display.


    # Monitor Specifications


    XFree86 supports nearly every monitor on the market, and comes with a database
    (actually, a text file named MonitorDB) containing 1,727 model names, types, and
    horizontal and vertical frequency ranges. The frequency ranges are crucial bits
    of information needed by XFree86''s server, and are used to calculate the types
    of'
  merge: -1
