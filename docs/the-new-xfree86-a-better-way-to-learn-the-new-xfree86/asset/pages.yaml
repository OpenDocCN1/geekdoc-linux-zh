  md: '# Configuring the K Desktop Environment


    To assign sounds, first ensure you have properly configured Linux to work with
    your computer''s sound card. Next, click the Look & Feel list item, then click
    the System Notifications list item. You''ll see a dialog box, as shown in Figure
    16.9, that you can use to assign a sound to a system event.


    You can also have KDE notify you visually by displaying a message box, sending
    a message to the standard output, or creating a log entry in a specified file,
    which can be handy to track users.


    # Configuring the Keyboard and Mouse


    Even though you can use the xset and xmodmap clients to control your pointer and
    keyboard for your X sessions, KDE includes graphic keyboard, mouse, and pointer
    controls. For example, to change the order of your mouse buttons, the behavior
    of mouse clicks, and even the size and shape of your pointer, click the Mouse
    list item under the Peripherals drop-down list menu. You''ll see the Mouse dialog
    box shown in Figure 16.9.


    To change how fast or slow your mouse moves across the screen, click the Advanced
    tab. Then you can adjust and acceleration values similar to those offered by the
    xset command.


    When finished, click the Apply button. But if you change the cursor size, you
    will need to restart your KDE 2.0 session.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_338_0.png)


    Figure 16.9 Assign sounds to a notification or window event using System Notifications.'
