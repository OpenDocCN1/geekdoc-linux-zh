    Follow the prompts for networking information and finish the install. After installing
    your license key, a file named license under a folder .vmware in your home directory,
    you can start VMware from the command line as follows:


    ```

    $ vmware

    ```


    After you press Enter, the VMware Workstation dialog box appears, as shown in
    Figure 23.10.


    Use VMware Configuration Wizard to select the type of operating system that you''d
    like to install, along with other configuration options, such as the size of the
    virtual host filesystem. You should then use the main window''s File menu to save
    your configuration. If you need to edit the configuration, click the Settings
    menu, then click Configuration Editor. You''ll then see its dialog box shown in
    Figure 23.11.


    You can use this editor to change the drivers, network adapters, or serial and
    parallel ports, or to alter settings for the mouse, sound, memory, and operating
    system. After saving your configuration, you can install the operating system
    using a floppy disk or CD-ROM. First, click the Power On button in the VMware
    window. You''ll see an initial PC boot screen, complete with BIOS information.
    Install your operating system (shown in Figure 23.12), then reboot or restart
    VMware.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_449_0.png)


    **figure 23.10** Use the VMware Workstation dialog box to prepare a host filesystem
    for your operating system install.'
