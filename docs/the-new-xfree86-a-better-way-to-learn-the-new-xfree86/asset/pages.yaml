  md: '# Puzzles


    A computer puzzle can be confounding, astounding, and even a game! One fun client
    for X that offers a puzzle on each playing level is xsok, included with many Linux
    distributions. This game, based on a game called Sokoban (from Japan), involves
    using the cursor keys to move a little man through a maze (represented by a ware-house).
    The object is to have the man push the jewels (boxes) through the maze to correct
    destinations.


    Start xsok from the command line of a terminal window as follows:


    # xsok &


    After you press Enter, you''ll see the window shown in Figure 13.10.


    You''ll find variations of this game for GNOME (gsokoban) and KDE (ksokoban).


    # Otheruzzling Clients for X11


    Many different puzzle clients are available for XFree86. Some clients are based
    on the sliding tiles games of 15 (arranging 15 tiles in sequential order on a
    16-tile field), whereas others, such as xjig, can be used to create onscreen jigsaw
    puzzles out of .gif images. The xuzzles client provides a complete set of geometric
    puzzles.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_266_0.png)


    figure 13.10 The xsok client for X11 appears simple, but grows increasingly frustrating
    and challenging.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Strategy Simulation with LinCity


    Although not in the board, solitaire, or puzzle category, other games for X11,
    such as simulations, require thinking and strategy. One of the most popular free
    software simulation games is LinCity by I.J. Peters. This client comes in two
    versions: one for the console, and the other for X. The console version is named
    cityscape, and you can start it, if you choose to load xlincity, from the command
    line. To run the X version, open a terminal window and launch the xclincity client
    as follows:


    ```

    # xclincity &

    ```


    After you press Enter, you''ll see an initial splash window; press the spacebar
    to begin. If you choose to load a default scenario, you may see the display shown
    in Figure 13.11.


    xclincity features built-in help to aid in game play. You can also choose different
    simulation speeds, build your own simulations from scratch, and save simulations
    in progress.


    # Arcade Games


    Arcade games have been popular ever since the first commercial pong games were
    introduced to the public in the 1970s. Even though today''s commercial arcade
    games are much more than paddle-driven court games and more like military flight
    and combat simulators, simple arcade games for X continue to be popular and hold
    attention. This section includes a small selection of some of the more popular
    games.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_267_0.png)


    Figure 13.11 The xclincity simulation game offers a number of complex controls
    that you can use to build simulations that will run for days.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Where is DOOM?


    DOOM, the first-person shooter game by iD Software that has spawned a foul legion
    and host of bloody arcade games for PCs, is available in source code from http://sourceforge.net/project/showfiles.php?group_id=3586.
    You''ll also need a DOOM WAD (data) file and a file server (available in source
    from the sourceforge site). Building and installing the shareware version of DOOM,
    named lxdoom, takes about three minutes on a 500MHz Pentium computer, and game
    play works quite well, even at high resolutions, as 1,024×768. Although there
    is no commercial version of DOOM for Linux, ID Software still retains the copyright,
    and you must still use commercial DOOM WAD files for full play.


    Unlike board, most arcade games will use your system''s sound card. You''ll need
    to have a properly configured sound card for your system in order to take advantage
    of these clients. Do you have to use sound? Of course not! Many of the clients
    covered here provide sound control, either through the command line or via a graph-interface.


    # Arc Arcade with abuse


    For its arcade action with a unique interface and playing field, abuse has acquired
    a legion of fans, especially Linux X game players. This game, from the company
    Crack Dot com, is now distributed in source code. You can find a copy on Jonathan
    Clark''s Web site, http://jonathanclark.com/crack/abuse/downloads.php3. The abuse
    client runs in a small 320×200 window, but features 3D animation and sound effects.


    Start abuse from the command line of a terminal window as follows:


    ```

    # abuse &

    ```


    After you press Enter, you will see the window shown in Figure 13.12.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_268_0.png)'
