  md: '# Chapter 2: Getting and installing XFree6


    Table 2.4 lists the components of the latest XFree6 distribution, and the fields
    marked with an asterisk (*) are part of a minimal installation. This means that
    at a minimum, you must download and copy those archives to a single directory
    on your system prior to installing the distribution. You can extract and install
    the other archives later.


    Before beginning the installation, you should carefully read the files Install
    and RELNOTES. These files contain important installation directions and technical
    information regarding the distribution. This early 4.0.1 compressed distribution
    requires 25MB hard drive storage. Note that this distribution is much smaller
    than the previous version, 3.3.6. Two reasons for this smaller size are XFree86
    4.0.1''s new architecture and use of loadable driver modules.


    # Installing the XFree86 Archives


    To install the archives, log in as root, than navigate to the directory containing
    the XFree86 compressed archives. Do not perform the installation while running
    an X11 session. If you use the startx command to start your X session, or press
    Ctrl+Alt+Backspace to kill the current session. If you have not installed X11,
    you can manually install the files by following directions in section 4.1 of the
    Install file.


    You can ensure that you have the correct files by running the Xinstall.sh script
    with its -check option, as follows:


    ```

    # sh Xinstall.sh -check

    Checking which OS you''re running...

    uname reports ''Linux'' version ''2.2.14-15mdk'', architecture ''i686''

    Object format is ''ELF'', glibc version is ''6.1''.

    ```


    Binary distribution name is ''Linux-ix86-glibc21''.


    This example shows that the system is running Linux 7.0, which uses the glibc21
    software libraries. If you have an existing X installation, read section 4.2 of
    the Install file for directions on how to back up and save your X installation.
    If you are confident about installing 4.0.1, then just proceed with the installation,
    as it will overwrite your current X system under the /usr/X11R6 directory.


    Start the installation by using the Xinstall.sh script, as follows:


    ```

    # sh Xinstall.sh

    Welcome to the XFree86 4.0.1 installer

    ```


    You are strongly advised to backup your existing XFree86 installation before proceeding.
    This includes the /usr/X11R6 and /etc/X11 directories. The installation process
    will overwrite existing files'
