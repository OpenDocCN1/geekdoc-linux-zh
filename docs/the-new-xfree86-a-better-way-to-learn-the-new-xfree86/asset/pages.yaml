  md: '# Capturing and Displaying Screens


    The xwd and xwud clients are used to capture and display the local or remote contents
    of a window or entire display. To capture the contents of a window, use the xwd
    command on the command line of a terminal window, along with its -out option and
    a filename, like:


    ```

    # xwd -out mygraphic.xwd

    ```


    After you press Enter, your pointer will turn into a cross-hair. Move your pointer
    to a window to capture, press the left mouse button. Your graphic (in X Window
    bitmap format) will be saved in the current directory. You can capture the entire
    display (without using your pointer) using the -root option, like this:


    ```

    # xwd -root -out mygraphic.xwd

    ```


    You can also capture the contents of a display on a remote computer by using X
    Toolkit -display option and the name of a remote display, like this:


    ```

    # xwd -display stinky.home.org:0.0 -out stinkygraphic.xwd

    ```


    This example assumes that you have access to the remote computer''s display (granted
    by using the xhost command on the remote computer, as you learned in Chapter 9,
    "X11 on a Network”). To display your graphic, you can use the xwd client, which
    will "undump" your capture and display it in a window. Like xwd, the xwud client
    also features X Toolkit options; in this case, you can use xwud to display the
    graphic in a scaled window. Use the -scale option, along with a -geometry setting,
    to display the captured window at 320×200 pixels, like this:


    ```

    # xwud -scale -geometry 320x200 -in mygraphic.xwd

    ```


    The -in option allows you to specify a filename on the command line. If you do
    not use any command-line options, you could also just display the graphic, by
    using the standard input redirection operator, <, like this:


    ```

    # xwud <mygraphic.xwd

    ```


    > Linux distributions typically include hundreds of graphics utilities for X,
    including one of the best graphics manipulation clients, the GIMP. See Chapter
    12, "X11 Multimedia Clients," for more information about graphics and XFree86.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_198_0.png)'
  merge: -1
