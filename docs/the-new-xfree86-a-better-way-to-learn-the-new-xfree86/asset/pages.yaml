    # Performing Console-based Configuration Using the XFree86 Server


    A new feature introduced with the XFree86 architecture is the ability of the XFree86
    X server to configure X from the command line of your console. To do this, log
    in root, then use the XFree86 server''s -configure command-line option as follows:


    ```

    # XFree86 -configure

    ```


    After you press Enter, the server probes your computer''s hardware and generates
    a configuration file named XF86Config.new in the /root directory. You can then
    test the configuration by running the server, specifying the test configuration
    with the server''s -xf886config command-line option and the pathname to the configuration
    file, as follows:


    ```

    # XFree86 -xf886config /root/XF86Config.new

    ```


    After you press Enter, the server starts and uses your new configuration file.
    If the configuration file works, you can then copy or move the file to the /etc/X11
    directory with the name XF86Config.'
