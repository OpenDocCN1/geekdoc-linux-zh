    # Strategy Games


    Strategy games usually involve some sort of logic and thinking. Traditional strategy
    games are board games, and quite a few of these clients are available for X. Some
    have been around for quite some time, whereas others are new to the scene. You
    will find a good selection of card solitaire and mah-jong solitaire clients for
    X, with some included as part of the KDE or GNOME desktop environments.


    # Board Games


    Board games for X are usually modeled after their real-world counterparts, and
    games such as chess and backgammon have been around for computers since the first
    interactive teletes. Many of these games feature computer-versus-human play, along
    with strong internal intelligence through the use of quite robust algorithms.
    You can expect a good challenge. When you add X for graphics support, you also
    find a colorful display and intuitive use of your pointer for piece movement.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Playing Chess with xbox


    The xboard client is a graphical interface to the GNU chess program. This client
    provides a colorful board in a variety of sizes and also obeys a subset of X Toolkit
    options for window placement. Start this game from the command line of a terminal
    window as follows:


    # xbox &


    After you press Enter, you''ll see a window, as shown in Figure 13.1.

    This client offers play against the computer or play against another human; also,
    you can set up a game between two computers. You can also use this client to play
    chess over a network or by electronic mail. X users with a display smaller than
    1,024×768 should use xboard''s -size option as follows:


    # xbox -size small


    # Playing Chess with Glchess


    The glchess client plays chess in 3D within a floating window on your screen.
    The client from the command line as follows:


    # glchess &


    ![](img/078622fac3fd61e5a0c895da1d3eff96_259_0.png)'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'Free X11 Games 233


    The game displays a chessboard in a floating window, shown in Figure 13.2. After
    you launch the client, press the 2, 3, or 4 keys to change the board''s highlighting.
    You can also rotate the x, y, and z axes of the board by using the cursor keys.
    To begin play, click to select a piece, then click a valid destination square
    on the board.


    # Playing Backgammon with xgammon


    Lambert Klasen and Detlef Steuer''s xgammon client is a fun-filled and accurate
    rendition of classic backgammon. This game, like xboard, also features computer-against-computer
    play. You can launch xgammon from the command line as follows:


    ```

    # xgammon &

    ```


    After you press Enter, you''ll see two windows, as shown in Figure 13.3.

    This client has more than 20 different command-line options, and like most well-behaved
    X clients, xgammon obeys resource settings.


    # Solitaire Card Games


    Card games have always been popular, and especially so with computer users. The
    energy used playing solitaire on desktops across the world for so many hours could
    probably run a small nation-state. If you''re a solitaire card game fan, you won''t
    be disappointed when you look at what''s available for X. This section features
    several clients that are sure to keep your interest for hours on end.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_260_0.png)


    Figure 13.2 The glchess client plays chess on a 3D chessboard.'
