    When the install detects an optional component (the X server in this example),
    the program asks whether you want to install it. Choose each component as you
    go along (you can and should install the Xfsrv.tgz file, which contains the X
    font server). The installation script runs the ldconfig command to update the
    new X11 libraries, then create font directory for any new installed fonts. You''ll
    see the following message:


    You appear to have a termcap file: /etc/termcap

    This should be edited manually to replace the xterm entries with those in /usr/X11R/lib/X11/etc/xterm.termcap


    > Note: the new xterm entries are required to take full advantage of new features,
    but they may cause problems when used with older versions of xterm. A terminal
    type ''xterm-r6'' is included for compatibility with the standard X11R6 version
    of xterm.


    On some platforms (e.g., Linux), the OpenGL standard requires that the GL shared
    library and header files be visible from the system lib (/usr/lib and /usr/include).
    This can be done by installing links in those directories to the files that have
    been installed under /usr/X11R6.


    NOTE: installing these links will overwrite existing files or nlinks.


    Do you wish to have the (new) links installed (y/n)? [n]


    Type y and press Enter to create these symbolic links. These links help ensure
    that software libraries are recognized. The install script will also find any
    old modules for servers or fonts and back them up if desired. The installation
