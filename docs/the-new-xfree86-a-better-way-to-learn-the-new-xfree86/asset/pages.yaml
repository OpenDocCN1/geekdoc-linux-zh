    # Configuring the GNOME-aware Window Managers


    GNOME (GNU Network Object Model Environment) is a programming project derived
    from earlier work and development of the GTK++ libraries used to create the GNOME
    Image Manipulation Program, or the GIMP GNOME programmers distribute their work
    under the GNU GPL, which allows anyone to share source code or build programs.
    Unlike Qt software libraries for KDE, which still requires licensing if you want
    to build binary-only software, using GNOME projects is royalty- and license-free.


    GNOME is a set of software libraries and a suite of clients that use the software
    libraries. These libraries provide sophisticated window, event, and drawing capabilities
    in a unique X session. One of the reasons that GNOME is unique is that it provides
    a framework that enables any GNOME-aware window manager to support features such
    as a desktop panel, session-management, drag-and-drop, animation, and a consistent
    client interface during the X session.'
