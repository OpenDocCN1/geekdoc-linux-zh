    # Security Issues


    Although security perhaps is not a problem on a small network, you should always
    consider security when running remote clients, especially when using the keyboard.
    For the best security, you should always launch your X terminal locally, then
    use tel to access the remote machine. Even better, you can also set xterm to use
    a secure keyboard during your session.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_186_0.png)


    Figure 9.1 The vncviewer client and the Xnc server software allow you to run virtual
    networks and remote computers across networks and platform systems.'
