  md: '# Play Mah-Jong with xmahjong


    Jeff S. Young''s xmahjong was first developed more than 10 years ago for X11R,
    yet remains as playable today. The object of xmahjong, with nearly all other Mah-Jjong
    games, is to remove as many tiles as possible from the board by first clicking
    a tile, clicking a matching tile. The game ends when no more matching tiles are
    available.


    Computer Mah-Jong games are not the same as the real game of Mah-Jong (which can
    be traced back to the late 1800s in China). Rules are extensive, four players
    are usually required, and setup of the initial board is quite different. Browse
    to http://www.mahjong.com to learn more about this game.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_263_0.png)


    This client features a large, colorful display, allows you to build your own games,
    and requires a display of at least 1,024×768. A nice feature of this client is
    that it does not require 256 colors, and may be played on a 4 bit planes per pixel
    or 16-color display.


    Start this client from the command line of a terminal window as follows:


    ```

    # xmahjong &

    ```


    After you press Enter, you''ll see the window shown in Figure 13.6.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_263_1.png)


    figure 13.6 The xmahjong client has survived through three revisions of the X
    Window system, largely due to its good game play and portability.'
