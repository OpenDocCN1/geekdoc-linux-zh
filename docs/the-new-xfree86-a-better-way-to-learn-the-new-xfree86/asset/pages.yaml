    # Using Digital Cameras


    Just as with scanners, the ever-increasing popularity of digital cameras in the
    marketplace has spurred greater support for these devices under Linux and X11.
    This section describes one of most popular digital camera support clients for
    X: the GNOME-enabled gPhoto, which supports more than 100 different types of cameras.'
