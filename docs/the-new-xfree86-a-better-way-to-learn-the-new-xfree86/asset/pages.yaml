  md: '# Chapter 18: Basic X11 Programming


    his chapter introduces the concepts, software tools, and resources such as software
    libraries that you''ll need to begin developing simple clients for the X Window
    system. You''ll get an overview of X programming, discover several essential utilities,
    learn how to use some programming tools, and then see how to build a simple X11
    client.


    Programming for X11 requires a basic understanding of the available resources,
    as such function calls provided by various software toolkits included with XFree86.
    One of the benefits of programming for X is portability, or the ability of your
    code to build and compile a variety of other computer platforms, regardless of
    operating system or hardware. As long as the other computer supports X11 and your
    code is hardware-independent, your program should survive and successfully build
    on other machines with few, if any, changes.


    # Installing XFree86 Development Support


    If you have installed XFree86, but want to develop programs for using Linux, you''ll
    need to make sure that you have also installed a working C (and possibly C++)
    development system. This means that you may need to install the Linux kernel #include
    files, the gcc compiler, and associated development software libraries and documentation.
    You''ll need the GNU Development Tools, such as the assembler, the ld linker,
    and others. Fortunately, most Linux distributions make installing development
    support fairly easy using some form of package manager such as Red Hat''s rpm
    command, SUSE''s yet (which is rpm-based), or Debian''s app-get system. You can
    also install the tools from compressed tarballs, as .tgz files, using the tar
    command.


    If you use an rpm-based Linux distribution, you can check whether the XFree86
    development files are installed using the rpm command -q query option and the
    fgrep command as:


    ```

    $ rpm -qa | fgrep XFree86-dev

    XFree86-devel-4.0.1-1

    ```


    In this example, following a query to the rpm database for all installed packages,
    an fgrep search of the rpm command output shows that the XFree86 4.0.1 development
    package is installed. You can then see a list of the files included in the devel'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Essential Programming Tools


    opment package by again using the rpm command and its query option, but this text
    with a list option, as follows:


    ```

    $ rpm -ql XFree86-devel-4.0.1-1 | less

    ```


    When you pipe the output through the less paging command, you can peruse the list
    of files. You will see the contents of the XFree86 development files are installed
    under the following directories:


    +   * /usr/X11R/bin—nine binary software tools.

    * /usr/X11R/include/X11—X11 #include files, containing definitions and defaults
    of default values and functions.

    * /usr/X11R/include/bitmaps—nearly 100 bitmaps that may be used when programming
    (note that these files are not required or exclusive).

    * /usr/X11R/include/X11/extensions—#include files containing defaults and definitions
    for extended functions.

    * /usr/X11R/include/X11/fonts—#include files containing information for font programming.

    * /usr/X11R/lib/X11/config—files containing rulesets (default definitions used
    by the local operating system and other operating systems). You use these files
    when building configuration files and Makefiles, and which help to build local
    X11 clients. The ruleset information is used by the xmkmf and make commands during
    the build process.

    * /usr/X11R/lib—X software libraries containing functions used by X clients. This
    directory holds several libraries, such as the basic Xlib, Xt Intrinsics, X Toolkit,
    and Athena Xaw libraries. In XFree86 version 4.0 and higher, you also find the
    Xpm (X pixmap) libraries in this directory.

    * /usr/X11R/man/man3—man pages describing X11 functions.


    Installing the XFree86 development package requires an additional 9MB of hard
    drive space. The normal Linux development tools can require up to 20MB or more
    hard drive space, depending on the type of tools and libraries that you install.


