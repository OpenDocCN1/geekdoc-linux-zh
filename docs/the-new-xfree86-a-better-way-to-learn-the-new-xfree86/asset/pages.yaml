- img_proc: true
  md: '# Using gPhoto


    Until this year, gPhoto was not a staple addition to most Linux distributions.
    How-ever, with digital cameras becoming commonplace, many Linux distributions
    now include this capable software package, gPhoto, which uses the GTK+ libraries,
    provides a healthy selection of photo-handling utilities in addition to being
    a transport agent for digital images.


    Start gPhoto from the command line of terminal window as follows:


    ```

    # gphoto6

    ```


    After you press Enter, click the Configure menu, then select the Port/Camera Menu
    item. You''ll see the dialog box shown in Figure 12.9.


    Select the proper serial port, then click the Camera Model drop-down menu, and
    scroll through the list of cameras to select your particular model. Click the
    Save button when finished.


    Next, to save time before a long download, you can use gPhoto to download thumbnails,
    or a reduced-index view of the contents of your digital camera. Click the Camera
    menu, select Download Index, then click the Thumbnails item. You can also press
    Ctrl+I or use a toolbar button to download the thumbnails. gPhoto downloads miniature
    pictures of the images in your camera and displays them in the main window, as
    shown in Figure 12.10.


    When you decide what pictures to download, click them, then use again the Camera
    menu to download the pictures as shown in Figure 12.11. Note that you can also
    use one of the toolbar buttons to download the selected photos.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_243_0.png)


    Figure 12.9 When you first use gPhoto, use its configuration dialog to select
    the proper camera and transfer port.'
