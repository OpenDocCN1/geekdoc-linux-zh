  md: 'Using make, imake, and xmmkmf 39


    After you press Enter, the make command generates the commands to build your project.
    You''ll find a number of default keywords defined automatically for your use,
    such as the following:


    +   * all compiles and builds all source and object files

    * myclient compiles and builds the myclient client

    * clean deletes temporary files, such as .bak


    Using xmkmf and make can save you a lot of time and effort, even on small projects,
    you won''t have to type long command lines over and over.


    # Using autoconf


    Another software tool that is becoming increasingly popular is autoconf, which
    automatically generates a configure script, which you can then use to quickly
    configure and build a Makefile for a specific computer system. You usually can
    find documentation for this utility in GNU info file, which you can read by entering
    the following:


    ```

    # info autoconf

    ```


    The autoconf command works by taking an initial ruleset from a file named configure.in.
    This file contains a list of macros, or shortcut definitions that will be used
    to create the larger configure script to test your system for required libraries
    or #include files.


    The configure.in file is created by the autoscan command, which initially creates
    a file named configure.scan. You should then edit or examine configure.scan and
    rename it as configure.in before running autoconf. You''ll also need to create
    a file named Makefile.in, which is a template that will be used, in turn, when
    the configure script builds the Makefile for your project. If file dependencies
    become complicated, as configure is complex program, and usually used with large,
    complex software projects involving hundreds of files. Creating the initial files
    to build the Makefile for a larger project is much easier using autoconf than
    be to define manually the command lines and dependencies required for such a project
    Makefile. However, many Linux and XFree8 programmers use even on smaller projects.


    For example, create a short Makefile.in for the example project in the project
    directory:


    ```

    CC = @CC$


    CFLAGS = @CFLAGS@ CPPCFLAGS@ DEFS$


    LDFLAGS = @LDFLAGS@ @LIBS$


    OBJS = main.o


    all : myclient

    ```'
