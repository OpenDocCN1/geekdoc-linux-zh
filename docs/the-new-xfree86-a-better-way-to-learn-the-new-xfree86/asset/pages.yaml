  md: '# A USB Primer 26


    Directions for configuring a USB mouse for your system will be found in the file
    named input.txt under the /usr/src/linux/Documentation/usb directory. One quick
    way to add support involves a proper set of kernel modules (as root) from the
    Linux input drivers. If your system has USB support, you will find the modules
    under /lib/modules/2.2.XX/usb directory, where xx is the version of your Linux
    kernel.


    You can check the version by using the uname command with its -r (revision) command-line,
    as follows:


    ```

    # uname -r

    2.2.16

    ```


    In this example, the modules will be found under /lib/modules/2.2.16/usb directory.
    Next, attach your USB mouse, then load the following modules:


    ```

    # insmod input

    Using /lib/modules/2.2.16/usb/input.o

    # insmod mousedev

    Using /lib/modules/2.2.16/usb/mousedev.o

    # insmod usbcore

    Using /lib/modules/2.2.16/usb/usbcore.o

    # insmod usb-uhci

    Using /lib/modules/2.2.16/usb/uhci.o

    # insmod hid

    Using /lib/modules/2.2.16/usb/hid.o

    ```


    This example uses the usb-uhci kernel module, which matches the type of USB controller.
    If you receive an error message, try using the usb-ohci kernel module instead
    to match your computer''s hardware. You can then verify the actions of loading
    the modules by examining your Linux kernel messages using the dmesg command:


    ```

    # dmesg

    ...

    usb.c: registered new driver usbdevfs

    usb.c: registered new driver hub

    usb-uhci.c:$Revision: 1.232 $ time 20:14:50 Aug 2000

    usb-uhci.c: High bandwidth mode enabled

    usb-uhci.c: Intel USB controller: setting latency timer to 0

    usb-uhci.c: USB UHCI at I/O 0x1060, IRQ 11

    usb-uhci.c: Detected 2 ports

    usb.c: new USB bus registered, assigned bus number 1

    usb.c: USB new device connect, assigned device number 1

    hub.c: USB hub found

    hub.c: 2 ports detected

    ```'
  merge: -1
