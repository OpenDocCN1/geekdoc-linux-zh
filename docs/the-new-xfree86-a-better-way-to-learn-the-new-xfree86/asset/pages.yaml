  md: '# Introduction


    find versions for computer platforms using the Motorola PowerPC or Compaq Alpha
    CPUs. Again, because X is distributed with source code and is written in C, it
    has been converted, ported, to numerous different architectures. This means that
    you''ll find a version of XFree86 on your Apple Macintosh with nearly all the
    same features as the version for an Intel-based PC.


    XFree86''s X is exactly like X for other platforms. This means that you can write
    and develop clients on your PC-based system, then copy the source to another platform
    and rebuild your client. X is as X as X is! Besides compatibility, X gives you
    the following advantages:


    +   - Versions for more than a dozen operating systems, and 100 versions of those
    operating systems


    +   - Flexible network connections


    +   - Use of in-memory, or user environment variables


    +   - Nearly two-dozen command-line operations for server operations


    +   - Support for specialized keyboard operations, as stopping a session or using
    other text-only logins (or consoles) over Linux


    Until recently, the XFree86 X distribution (XFree86 3.3.6) was based on X11R6.3.
    However, the newest and latest versions, XFree86 4.0 and 4.0.1, are based on X11R6.4.
    The culmination of nearly two years'' work, the XFree86 has many new features
    to its internal architecture that will appeal to users, administrators, and computer
    graphics developers and manufacturers.


    This new release is the reason for writing this book. Although this author''s
    efforts pale to the expertise of XFree86''s developers, I hope that this book
    will help you share in the joy, empowerment, and satisfaction that so many users
    derive from using these developers'' software.


    # The Future


    As mentioned previously, at the time of this writing, the free software and commercial
    computer industry is poised to receive a new revision of X, X11R6.5. The good
    news is that within releases of minor revisions to the X distribution, X clients
    and source code are generally upward-compatible. This means that you''ll be able
    to build your favorite clients using the new software, and that older clients
    will still run under the system.


    Revisions to X, even minor ones, are generally few and far between. The last major
    revision, from X11R5 to X11R6, took place ten years ago. Even so, you may find
    some computer systems still running X11R5 to this.


    Although specific features in future revisions are hard to predict, you can bet
    that X will continue to evolve to incorporate new network, communication, or input'
