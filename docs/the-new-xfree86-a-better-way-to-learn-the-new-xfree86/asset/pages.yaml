  md: '# Chapter 17: Building X11


    The XFree86 4.0.1 source distribution includes more than 11,000 files. You''ll
    need at least 53MB to store the compressed archives and files. When decompressed,
    the source code requires more than 227MB of hard drive space. According to the
    XFree86 folks, you can get by using only the first archive (X401src-1.tgz) if
    you already have X11 fonts installed on your system. The documentation tools package
    is used to format the XFree86 documentation (which includes the pages).


    Another way to get the latest work in progress (instead of a point release, as
    of 4.0.1) is to use XFree86''s Concurrent Version System CVS. Although the latest
    release can be important, especially if you''re aware of a new feature or driver
    release that will allow you to overcome a plaguing problem with your graphics
    system X, it is not always advisable to use or build XFree86 from the CVS repository.
    The distribution, unless labeled as "stable," will be a work in progress, and
    may have some nasty bugs.


    To download a current snapshot directly from the XFree86 developer''s working
    directories, use the cvs command log in to the remote XFree86 CVS directory:


    ```

    $ cvs -d pserver:anoncvs@anoncvs.xfree86.org:/cvs login

    ```


    (Logging in to anoncvs@anoncvs.xfree86.org)

    CVS password:


    The program prompts you for the password (which is anoncvs). Next, use the cvs
    checkout to retrieve the source tree of XFree86 using the xc module:


    ```

    $ cvs -d pserver:anoncvs@anoncvs.xfree86.org:/cvs checkout xc

    cvs server: Updating xc

    U xc/INSTALL.PS

    U xc/INSTALL.TXT

    U xc/Makefile

    U xc/LABEL

    U xc/Makefile

    U xc/RELNOTES.PS

    ...

    ```


    As you can see, the files will start downloading. If you just want the contributed
    files, use the contrib module. Other modules include test, docutils, utils, and
    notes. Note that retrieving the entire source tree can take quite some time, especially
    if you''re not using a broadband service. If you don''t want to use CVS or FTP,
    you can also download the source code, in compressed form, via HTTP and a Web
    browser, such as lynx or Netscape. To download this, browse to the following site:

    http://www.doc.cs.univ-paris.fr/mirrors/XFree86/

    or

    http://ftp-sub.fht-esslingen.de/pub/Mirrors/ftp.xfree86.org/.'
