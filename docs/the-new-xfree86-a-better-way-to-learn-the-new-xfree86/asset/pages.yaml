  md: '# Chapter 6: Starting X11


    dtlogin, with TriTeal''s CDE for Red Hat Linux; although this product is no longer
    supported, you can still get CDE for Linux from Xi Graphics, Inc.) The other display
    managers discussed are KDE''s kdm and Gnome''s gdm.


    If you successfully configure X during an initial Linux installation, many of
    today''s distributions offer you the choice of booting directly to X. This option
    is adequate if you''re absolutely sure that the configuration works. Otherwise,
    a better and perhaps safer approach is to configure X after installing Linux.


    # Configuring the System


    Use of a display manager is generally controlled by a runlevel entry in the Linux
    system initialization table /etc/initab. This text file is used by /sbin/init
    command, the first command that Linux runs after booting. init is responsible
    for starting processes in memory according to the runlevel—that is, the system
    state into which Linux is booting. However you should be aware that every Linux
    distribution defines the same runlevels. For example, Red Hat Linux-based distributions
    define the following:


    ```

    # runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    ```


    For Red Hat, the runlevels most commonly used after booting Linux are the following:


    +   - 1, or single-user mode, used for file system repairing or administrative
    work

    - 3, for normal console-login multiuser mode

    - 5, for multiuser mode with a graphical X using a display manager


    When you boot this system to the text-only or console mode, you''re running to
    runlevel 3. When you boot directly to a graphical login through X, you''re booting
    to runlevel 5.


    On the other hand, SuSE Linux defines these runlevels:


    ```

    # runlevel 0 is halt

    # runlevel S is single-user

    # runlevel 1 is multi-user without network

    ```'
  merge: -1
