  md: 'This window manager is less than 32KB in compressed source form, and is built
    from nine source files of C++ code. The resulting binary is less than 120,000
    bytes! This means that wm2 can be an excellent choice for X users with have low-capacity
    drives or less optimal memory for X. For a few more features, as virtual desktops
    (or "Channels", to use the author''s terminology), minimizing, and more extensive
    menus, use the wmx window manager.


    The wm2 window manager features no configuration file. All configuration is done
    in the file Config.h when building the binary. The decomp to build and install
    wm2 is quite easy. After downloading the file (as root), decompress the file by
    entering the following command:


    ```

    # tar xvzf wm2-4.tar.gz

    ```


    Next, navigating to the directory and edit (if required) the file named Config.h:


    ```

    # cd wm2-4

    # pico -w Config.h

    ```


    Save any changes, then build wm2 and copy it to your system''s /usr/X11R6/bin
    directory:


    ```

    # make

    # cp wm2 /usr/X11R6/bin

    ```


    To launch this window manager using the startx command, include the following
    in your home directory''s .initrc file:


    wm2


    When your X session starts, you can build your wm2 desktop, as shown in Figure
    5.12.


    # mwm Window Manager


    The mwm window manager, perhaps better known as the Motif window manager, was
    originally part of the commercial and proprietary OSF/Motif programming libraries
    (Toolkit) from The Open Group. However, starting before 1994, a group of developers
    began developing a Motif-1.2-compatible Open Source distribution that included
    programming libraries and development files. Today, the result is LessTiff 0.918.2.
    This distribution is compatible with Motif 1.2, and will soon be compatible with
    Motif 2.0. You can download, build, and install the LessTiff software from sites
    on the Internet, and some Linux distributions, such as Mandrake and SuSE, include
    LessTiff, its development libraries, and associated clients (one of which is mwm).


    The mwm window manager included LessTiff is a functional clone of the commercial
    mwm window manager, and even use the same configuration files. You''ll get a definitive
    root menu, along with the ability to page between virtual desktops.'
