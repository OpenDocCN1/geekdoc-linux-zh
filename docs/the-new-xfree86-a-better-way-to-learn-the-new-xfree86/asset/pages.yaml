    This means that the menu entry for xterm''s font uses the text string "Large"
    for the font5 menu item. You can also define specific client resources in a file
    named .defaults orXresources in your home directory. In instance, you would use
    a resource string setting as the following:


    client*resource: value


    For example, to turn off the use of color by xterm, use an entry such as the following:


    xterm*VT100*colormode: off


    Finally, you can also specify resource settings on the command line. For example,
    to turn off the use of color by the xterm client, enter the -xrm or X resource
    option followed by the name of the resource and its setting, as follows:


    xterm -xrm ''*VT100*colormode: off'' &


    Not all X terminal clients behave this way. For example, you can build the rxvt
    terminal emulator with or without resource setting support. Additional client
    command-line options, like XToolkit options, are created in greater detail in
    Chapter 8, "Using X11 Clients."


    # Exploring Special Terminal Features


    X and (more specifically) X clients support text copy-paste operations between
    clients. Using your pointer, click to activate a terminal window. To copy a single
    word, double-click the selected word, then move your pointer to another window
    and press the middle mouse button (that is, click button 2, or simultaneously
    click the left and right mouse buttons if you use a two-button mouse and have
    enabled three-button emulation). To copy a line of text, triple-click the desired
    line, then again click the middle mouse button to paste the text.


    To copy a selection of text, known as a region, left-click and hold the mouse
    button, then drag up or down to highlight a region of text. Again, move your pointer
    to a desired window and click the middle mouse button works with X clients, you
    should use Ctrl+v to paste text into other clients, such as StarOffice. Not all
    X clients respond to copy-and-paste operations, or respond to them the same way.


    XFree86 also has at least two clients that you can use to copy and paste text:
    xclip and xset. These clients perform the same operation, but you can also use
    xclip to save copied text to a file.'
