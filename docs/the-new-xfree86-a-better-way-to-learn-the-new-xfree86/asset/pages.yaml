- img_proc: true
  md: 'or ISO8859-1 Latin character set used during most sessions, but also European
    language fonts, Asian language fonts, and Unicode fonts. These additional fonts
    were developed to support the world''s languages and to provide for characters
    with accents or in graphic form. Xfree86''s fonts can support languages, such
    as Japanese or Korean, that require thousands of characters.


    The most critical FontPath entry in your XF86Config file is for fonts contained
    in the mise directory. If the X server is unable to find this directory, launching
    your X session will fail and the server will abort.


    # Changing Font Use with xset


    Use the xset client to add or remove fonts during your X session. You can use
    this client to alter the xfs server''s font path on the fly, by using the client''s
    +fp command-line option as follows:


    ```

    # xset +fp /usr/local/share/fonts/misc

    ```


    After you press Enter, fonts under the specified directory will become available
    for your X session, and will be added to the beginning of your FontPath. You can
    also specify remote displays by using the -display option like this:


    ```

    # xset -display dell:0.0 +fp /X11R6/lib/X11/fonts/mdk

    ```


    This command enables your local X session to use the fonts from the mdk directory
    on the remote host named dell.


    # Using TrueFonts


    A great feature of the XFree86 4.0.1 distribution is built-in support for TrueType
    fonts. If you use a previous or 3.3-X-series of XFree86, you''ll need to resort
    to using a specialized font server, such as xft.


    One quick and easy way to add fonts to your system, especially if you use a dual-boot
    system, is to copy the Type1 or TrueType fonts included with the Windows operating
    installed on your system. If you copy these fonts into the X11R6 directory, you
    can use them during your X sessions (you as well get some out of what is otherwise
    worthless software, right)?


    Although you can use any directory, the best approach is to create a directory
    (named fonts) under the /usr/X11R6/lib/X11/fonts directory to hold the fonts.
    Copy all .ttf files from your Windows partition into the new directory. You can
    quickly locate these fonts if you have the partition mounted, by using the command
    as follows:


    ```

    # find /mt/dos -name *.ttf -print | less

    ```'
