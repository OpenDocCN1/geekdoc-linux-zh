  md: '# Using X11 Terminal Clients


    return to normal user status. Using su at least a small precaution, because you''ll
    need to examine the task, press Enter, enter a password, and then press Enter
    again to launch the task.


    Obviously, if you use startx to launch a local X session, you have already logged
    in. But if you log into Linux and X using xdm, you may be able to use various
    editing keys when entering your username and password. These keys are listed in
    Table 7.1.


    # Table 7.1 xdm Editing Keys


    | Key | Description |

    |---|---|

    | Ctrl+a | Jump to the beginning of the entry |

    | Ctrl+b | Move back one character (nondestructive) |

    | Ctrl+d | Delete the next character |

    | Ctrl+e | Jump to the end of the entry |

    | Ctrl+f | Move forward one character |

    | Ctrl+h | Move back one character, erasing one character |

    | Ctrl+k | Delete to the end of the entry |

    | Ctrl+r | Restart the login |

    | Ctrl+x | Delete the entire entry |

    | Ctrl+u | Delete the entire entry |


    Most that but not all the keystrokes listed in Table 7.1 correspond to keystroke
    used with the bash command line and the emacs editor. You can also use the left
    and right cursor keys when editing your entries. If you type an incorrect username
    or password and press Enter, the display manager should respond with an error
    and replace the entry cursor on the login: prompt for you.


    # Using X11 Terminal Clients


    This section introduces terminal clients for X. Just as you have a vast choice
    of window managers to use for your X sessions, you will also find a number of
    X terminal clients included with your Linux distribution, especially if you install
    KDE and GNOME. Your choice of a favorite terminal might be driven by practicality,
    a need for features, or simply personal preference. Some terminal clients have
    special features that require certain software support libraries, whereas other
    clients may be used as standalone terminals or with any window manager.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_150_0.png)'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Exploring Terminal Features


    Nearly all X terminal clients support display features similar to common hardware-based
    terminals. Note that there is a difference between an X terminal client and a
    hardware terminal. In the past, UNIX was a character-based system and X was yet
    to be developed, users logged in to UNIX over serial lines using a variety of
    display devices with attached keyboards or character-based terminals. These terminals
    had different hardware features, worked at different speeds, and in many cases,
    operated to entirely dissimilar software commands.


    To get an idea of the vast number of different terminals (many if not most of
    which now line landfills across the world), take a look at your system''s terminal
    capabilities database, /etc/termcap. This file, consisting of nearly 15,000 lines
    of terminal definition and configuration values, is one indication of the complexity
    of supporting character-based terminals under UNIX and, of course, Linux. Note
    that you cannot use X with a character-based terminal—the point is that this limitation
    has been inherited by Linux. When working at the console or using a console-based
    text editor in an X11 terminal window, programmers need to adhere to a standard
    set of software codes that will make the cursor addressable. Specifically, programmers
    need to be able to place the cursor anywhere in a display that traditionally (but
    not always) is 80 characters wide by 24 or 25 lines and so on.


    Although Digital Equipment Corporation''s VT52 terminal of 1974 was one of the
    first with an addressable display, the standard for cursor addressing grew out
    of DEC''s VT100 hardware, which featured a screen, keyboard, and serial input
    line. The software codes used to control the display evolved into today''s VT100
    emulators. Other standard sets of cursor control in since include VT102, VT220,
    VT320, and so on.


    The Linux console emulates the VT220 terminal, but adds color support. You will
    find terminal information files regarding various X terminal clients under the
    /usr/share/terminfo directory. These files are compiled parts of a database of
    terminals used by today''s Linux-oriented programs. Read the terminfo page for
    information regarding the database, and the term map for information regarding
    the format of the compiled database entry for each terminal. The curses software
    library are used to handle cursors in Linux programs.


    # Choosing a Terminal Client


    Fortunately, choosing which X terminal client to use today is not as easy than
    it was to choose which hardware terminal to use 20 years ago. Features that are
    desirable today include the following:


    +   - The ability to be reconfigured to recognize different terminal codes

    - Scrolling, with a history feature that enables the user to view past pages'
  merge: -1
  pgno: 151
- img_proc: true
  md: '+   - Extensive window controls, such as the ability to minimize (iconize or
    dock into a taskbar), maximize, or close, and controls for resizing or dragging


    +   - The ability to change foreground and background colors (or at least use
    reverse colors and handle color) easily


    +   - The ability to use different fonts and font sizes


    +   - The ability to mimic one or more terminal standards, or perhaps use different
    keys


    +   - The ability to use images in the background or perhaps support transparency


    Some X terminal clients have all these features, including not listed, such as
    the ability to remember sessions and settings, use images for window decoration
    backgrounds, use minimal memory, or launch actions with user-defined keys. Nearly
    all X terminal clients obey a similar subset of command-line options (which you''ll
    learn about in Chapter 8, "Using X11 Clients").


    Table 7.2 lists several terminal clients included with most Linux distributions.


    | Name | Description |

    |---|---|

    | aterm | AfterStep X VT102 terminal emulator |

    | Eterm | Enlightened terminal emulator for X |

    | gome-terminal | GNOME X terminal emulator |

    | konsole | KDE terminal emulator |

    | kterm | Multilingual terminal emulator |

    | kvt | KDE terminal emulator (deprecated); use konsole or another client |

    | rxvt | An X terminal emulator |

    | xterm | An X international decoration |

    | xterm | The X terminal emulator |


    # # Configuring a Terminal Client


    How you configure your terminal depends, in most cases, on the features supported
    by the client. Terminal clients supported by KDE and GNOME, for example, generally
    provide menus and dialog boxes that list options you can use to change the appearance
    or capabilities of a client. However, other terminal clients require that you
    enter command-line options to take advantage of different features.'
  merge: -1
  pgno: 152
