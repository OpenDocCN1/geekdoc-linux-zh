    # Retro-arcade with xinvaders


    One of the games that started it was Space Invaders. One of the first invader
    clones of the commercial arcade version appeared as C source code for the CP/M
    console. Then, as personal computers gained the ability to use color and graphics,
    innumerable clone games appeared on the scene. The xinvaders client by Jonny Goldman
    closely mimics the feel and play of the original arcade game.


    Start xinvaders from the command line of a terminal window as follows:


    ```

    # xinvaders &

    ```


    After you press Enter, you''ll see an initial window; press the Play button to
    begin, as shown in Figure 13.15.


    Press the z key or spacebar to fire, and use the left- and right-mouse buttons
    to move your spaceship from left to right.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_270_0.png)


