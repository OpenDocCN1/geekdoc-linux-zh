  md: '# Appendix: Essential X11


    This appendix provides a short list of essential resources for the X11 and XFree86
    user. Although this book has concentrated on XFree86 and Linux running on Intel-based
    PC platforms, many of the concepts, strategies, and use of X11 will apply to other
    computer platforms. The appendix is organized into several parts: a section covering
    X clients; a section listing invaluable X resources; a list of pertinent Usenet
    groups; and various mailing lists that may provide answers or an avenue for questions.


    If you''re looking for definitive technical information regarding X11, download
    the source to X11r6.5 from http://www.X.org. The source archive contain technical
    papers by the authors and X programming, generally in compressed PostScript.


    # Popular X11 Clients


    Table A.1 lists just few common X11 clients, along with a concise description
    (the table was derived from output of the apropos command). You can generally
    learn about a command by reading its man page, you may find documentation under
    the /usr/doc/, /usr/share/doc, or /usr/info directories. If you''re looking for
    a specific client or game for X11, use your favorite search engine (such as http://google.com)
    or Linux link (http://freshmeat.net)—you are sure to find what you''re looking
    for:


    | Table A.1 X11 Clients and Descriptions |

    | Client | Description |

    | animate | Displays image sequences |

    | bitmap | Provides a simple X bitmap editor |

    | bmtoa | Converts an X bitmap to ASCII |

    | bounce | Displays an X screensaver |

    | display | Views and edits ImageMagick images |

    | editres | Edits X11 resources |

    | flsfonts | Lists Fonts |

    | fly8 | Simulates an X11 flight |

    | fsinfo | Provides an X font server utility |

    | gears | Displays an X screensaver |

    | gedit | Provides a simple GNOME text editor |

    | gphoto | Downloads a digital camera and edits images |

    | gv | Views and prints PostScript files |'
