  md: '# Using Xnvnc


    decompressed and installed. To get started under Linux, first use the vncserver
    script as follows:


    ```

    # vncserver

    ```


    The script prompts you to enter a password:


    Password:


    Type a password used to allow remote access, then press Enter. The program again
    asks you to verify the password:


    Verify:


    New ''X'' desktop is thinkpad.home.org:1


    Creating default startup script /root/.vnc/xstartup


    Starting applications remotely in /root/.vnc/xstartup

    Log file is /root/.vnc/thinkpad.home.org:1.log


    After you pass the password again and press Enter, the Xnvnc server starts. First,
    note the $DISPLAY layer number returned by the server (1 in this example). You''ll
    need to know this number later if you want to connect remotely. Also note that
    the server creates a directory named .vnc in your home directory, and copies a
    file xstartup to that directory. This file contains directions on the type of
    virtual X session to run when a remote viewer requests a connection. The file
    looks like this:


    ```

    #!/bin/sh


    xrddb $HOME/.Xresources

    xsetroot -geometry 80x24+10+10 -title "$VNCDESKTOP Desktop" &

    twm &

    ```


    As you can see, the default session will use the twm window manager. You can edit
    this script before starting a different window manager or to launch various clients
    before starting twm. The vncserver script also recognizes the X Toolkit -geometry
    setting, so you can assign a default size to your sessions. For example, the session
    will be 1,024×768, but if you''d prefer to have a remote session at 800×600, use
    the vncserver client as follows:


    ```

    # vncserver -geometry 800x600

    ```


    Now that you''ve started the server on your local computer, other remote users
    can connect and log in, provided they know the password and have an active account.'
