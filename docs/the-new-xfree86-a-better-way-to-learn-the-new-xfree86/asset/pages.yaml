    ```


    When your X session starts, you can build your FVWM desktop, as shown in Figure
    5.3.


    Note that FVWM provides an icon window list, desktop pager, or navigation mini-window,
    along with a mailbox, clock, and load client in a wharflock on the desktop. The
    pager is used to navigate between desktops. To move to a different desktop, you
    can click on the desktop''s represented block in the pager; alternatively, if
    you configure FVWM to use "borderless" margins, you can simply drag your pointer
    to the edge of your desktop to move into an adjacent desktop.


    One version of it, tvwm, includes virtual desktop features. You can download,
    build, and install fvwm from http://ftp.x.org/R5config/fvwm-5.3.tar.gz.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_103_1.png)'
