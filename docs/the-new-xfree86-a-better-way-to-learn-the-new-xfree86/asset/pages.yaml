  md: '# Chapter 22: Using GTK+


    his chapter provides a short overview of using GTK+ toolkit and associated GNOME
    libraries and utilities to build a simple GNOME client. The chapter starts by
    briefly discussing licensing considerations. You''ll then see how to set up and
    run GNOME''s graphical client GLADE, which you can use for developing GNOME clients.
    Finally, the chapter presents a short demonstration of using KDE''s KDevelop to
    build a GNOME client.


    # Understanding Licensing Issues


    Software that is distributed in source code form can be very beneficial, especially
    if you have the tools to build the software from its source. Software that is
    distributed in binary-only form can also be beneficial, but only if it works well
    with your operating system and version of software. But even more important than
    how software is distributed is how the software is licensed.


    Software distributed under the GNU General Public License (GPL) will be free and
    come with source code. Only one class of software is distributed more than GPL
    software, and is public domain software. Other than public domain software, any
    software that is not under the GPL copy-left will have a license with one or more
    forms of subjective clauses that encompass the possession, use, or distribution
    of the software. That said, GNOME and its libraries, documentation, and clients
    are distributed under the GNU GPL. The GNU GPL, along with the Lesser GPL, offers
    the greatest freedom to software developers but, in general, also mandates distribution
    of source code or source code changes to software.


    # Downloading and Installing GNOME


    Although you can download and install GNOME from source, a much easier way to
    get GNOME is to install a Linux distribution using GNOME or to upgrade your system
    using native software archives used by your distribution. Most Red Linux–based
    systems already come with GNOME installed, and you shouldn''t have to install
    additional software libraries unless you choose not to install development software
    when you first built your system. If you did choose to install the GNU gcc and
    g++ compilers, along with GNOME''s development libraries, you''ll see them appear
    in your favorite .rpm archive manager, as shown in Figure 22.1.


    If you do not find the GNOME libraries or development tools, you''ll need to insert
    your Linux CD-ROM or download the GNOME distribution over the Internet.'
