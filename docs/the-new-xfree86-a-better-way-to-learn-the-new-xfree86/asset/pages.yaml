  md: '# Chapter 23: X11 and Other Operating Systems


    # Xnc for Windows


    To initialize Xnc on a Windows computer, you must download and copy the Windows
    version of Xnc onto the computer, extract its archive with a utility such as WinZip.


    You install the Win32 vnc software using the Xnc SETUP. EXE command, and you can
    run the Win32 version of Xnc as a server or as a program. To run Xnc as a server,
    first open your desktop''s Start menu and click Vnc from the Programs folder,
    then open the Administrative Tools folder and click the Install Default Registry
    Settings menu, as shown in Figure 23.1.


    The registry settings will be updated with information about Xnc. Click the OK
    button in the resulting dialog to dismiss the dialog. Next, you can then click
    the Install XncVNC Service item from the Administrative Tools folder. The first
    time you run this program, you need to enter a password in the dialog box, then
