  md: '# Building from Source


    The most important of the base documents are the build and install directions
    in the file INSTALL.TXT. This file, from The Open Group, provides an overview
    of the build and install process of X11R6.4 for a variety of computer platforms.
    You should definitely read the entry document before you begin the process, in
    order to get a better idea of proper procedures and potential problems.


    However, do not put off or intimidated. If you''re worried about your current
    XFree86 installation, rename or move the /usr/X11R6 directory tree before installing
    your new version of X. Next, read the "Easy Build" portion of the document. You''ll
    see that it contains the following simple steps and directions for building X:


    +   1. Edit xc/config/cf/site.def.

    2. To this file, add the following:


    ```

    #define LinuxDistribution XXXXXX


    wherexxxxx may be one of the following:


    LinuxUnknown

    LinuxSuSE

    LinuxCaldera

    LinuxCrafts

    LinuxDebian

    LinuxInfoMagic

    LinuxKheops

    LinuxPro

    LinuxRedHat

    LinuxSlackware

    LinuxTurbo

    LinuxWare

    LinuxYggdrasil

    ```


    However, you can skip this step if you use a SuSE, Red Hat, or Debian distribution,
    as those distributions determine this value automatically.


    +   3. Change to the xc directory and enter the following:


    ```

    # make World >& world.log

    ```


    +   4. To install the new distribution, enter the following:


    ```

    # make install >& install.log

    ```'
