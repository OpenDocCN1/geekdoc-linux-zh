  md: '# Get the most out of your new XFree86 system!


    Learn the skills that will turn you into a master of the radically changed new
    XFree86. The most out of X on your laptop, desktop, or server. Everything from
    building an efficient desktop for X to security tips and installation details
    are covered as you delve into the world of this amazing free networking graphical
    interface for Linux.


    Bill Ball is the author of a number of bestselling books about Linux. He has been
    using Linux since version 0.99 and is an advocate of the Open-Source movement.
    He is a member of the Northern Virginia Users Group (NOVALUG).


