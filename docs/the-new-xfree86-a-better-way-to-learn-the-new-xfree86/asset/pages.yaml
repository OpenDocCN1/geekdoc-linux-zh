  md: '# Chapter 10: XFree86 X11 Clients


    Unlike most XFree86 clients, a number of the clients in Table 10.1 do not have
    a corresponding man page. This is because the clients, such as the xkb series,
    are part of X.org’s (the steward consortium for X) series of unsupported clients,
    testing applications, or utilities. However, don''t let the lack of a man page
    deter you from experimenting!


    # Setting Preferences with the xset Client


    The xset client is used to display and set preferences for local or remote X sessions.
    This client controls many different aspects of your session, including the following:


    +   * Terminal bell—xset can turn this feature on or off, and can set the volume,
    pitch, and duration of your system beep.

    * Keyclicks—The client can control the volume of your system’s keyclick sound,
    or turn the keyclick on or off; xset can also control your keyboard’s autorepeat
    rate or rate.

    * Display Power Management Signaling (DPMS)—xset can control the Energy Star features
    of your monitor (if the monitor supports these features).

    * Screensaving—The client enables you to turn your session’s screensaving features
    on or off; if you activate the features, and the client also enables you to set
    an interval before activation.

    * Fonts—The client can add or remove a font to or from your X session.

    * LEDs—You can use xset to control your keyboard’s Light Emitting Diodes.

    * Pointer—You can control your pointer’s acceleration and threshold (the distance
    traveled relative to movement) values.


    Use xset’s q option to display your current settings, as follows:


    ```

    # xset q

    Keyboard Control:

    auto repeat: on key click percent: 0 LED mask: 000000000

    auto repeat delay: 500 repeat rate: 5

    auto repeating keys: 0ffffffffffffbbbf

    fa9ffffffffffffdffd

    7f000000000000000

    0000000000000000

    bell percent: 75 bell pitch: 800 bell duration: 100

    Pointer Control:

    ```'
  merge: -1
