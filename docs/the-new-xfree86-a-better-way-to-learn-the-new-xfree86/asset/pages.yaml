    # Using make and xmkmf


    The make client, by Todd Brunhoff, and the xmkmf script, by Jim Fulton, are two

    legacy software tools used by X11 programmers around the world. Xfree86 includes

    both utilities, which are designed to aid in the portability and building of X11
    clients

