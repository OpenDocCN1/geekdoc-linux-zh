    When X starts, your PS/2 mouse will work, but your USB mouse will.


    Another useful option to add to your XF86config file allows you to start an X
    session even if the mouse isn''t working. Use the AllowMouseOpenFail option in
    a separate "ServerFlags" entry, as follows:


    Section "ServerFlags"

