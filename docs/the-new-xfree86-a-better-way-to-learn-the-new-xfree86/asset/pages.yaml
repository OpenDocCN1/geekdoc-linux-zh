    # # Screensensaving Necessary?


    Modern color monitors with energy saving features and active-matrix liquid crystal
    displays (LCDs) for laptops are immune to static displays of information that
    10 years ago would have been cause for concern. Monitor "burn-in" hasn''t been
    an issue to worry about for a number of years, but screensavers live on as an
    art form. Probably better termed as "eye candy," screensavers are really no longer
    needed, but you''ll find a healthy selection of more than a hundred included with
    every Linux distribution. Unless you need to use a screensaver with password protection,
    it''s always a good idea to turn off electrical devices if you''re not using them
    (to save energy). Whether or not you use a screensaver is a personal, but not
    necessary, choice.'
