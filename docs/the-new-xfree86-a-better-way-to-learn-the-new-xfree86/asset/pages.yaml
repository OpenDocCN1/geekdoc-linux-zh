- img_proc: true
  md: '# Chapter 2: Getting and Installing XFree6


    resolution over your system''s monitor and graphics card. The horizontal and vertical
    frequencies refer to the times per second that can be scanned across and up down
    your display.


    A complete description of how your monitor and graphics card work together, with
    Eric S. Raymond''s XFree86-Video-Timings-HOWTO. You may find a copy under your
    system''s /usr/doc/HOWTO directory, under the /usr/X11R6/lib/X11/doc directory
    with the name VideoModes.doc, or at the URL listed in the "Resources" section
    at the end of this chapter.


    For example, if you have an NEC Multisync XV monitor, you can quickly look up
    your monitor''s capabilities by using the grep command like this:


    ```

    # fgrep ''MultiSync XV'' /usr/X11R6/lib/X11/MonitorsDB

    NEC Technologies; NEC Multisync XV14; NEC37FB; 30.0-57.0;

    NEC Technologies; NEC Multisync XV15; NEC3D5RE; 31.6-65.0; 55.0-100.0;

    NEC Technologies; NEC Multisync XV15; NEC3C14; 31.0-65.0; 55.0-100.0;

    NEC Technologies; NEC Multisync XV17* (-2); NEC4C3BD; 31.0-62.0; 55.0-100.0.

    ```


    The database, found under the /usr/X11R6/lib/X11/ directory after you install
    XFree86, shows that an XV15 monitor supports a horizontal frequency range of 31
    to 65, whose vertical range is 55 to 100. Although it is not absolutely necessary,
    you should keep your monitor''s manual on hand when you configure X for your system.
    Knowing the exact frequencies for your monitor will help ensure configuration
    of your display, and this information is even more important if you use an off-brand
    display. In the recent past, before the advent of XFree86 4.0, this information
    was critical; using incorrect settings outside a monitor''s range could damage
    your monitor''s internal components. Fortunately, most of today''s monitors have
    built-in circuitry to prevent problems. Better yet, the latest X server, XFree86,
    in XFree86 version 4.0.1, internally incorporates the Video Electronics Standards
    Association for monitors, making configuration much safer with newer equipment.
    This server automatically calculates the ranges during startup!


    # Memory Requirements


    Although most computer users think in terms of a system''s random memory (RAM)
    when discussing memory, the amount of RAM included with your computer''s graphics
    card also plays a large role in determining the resolution and color depth supported
    by your computer. Many early, pre-PC era computers used part of the computer''s
    system memory for graphics display. As the PC has matured,'
