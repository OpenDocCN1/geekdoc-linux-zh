  md: '# Displaying Eyes and the Logo


    Two clients, xeyes and xlogo, are also included in the XFree86 distribution. These
    clients really don''t do much, but can be fun to watch or to use to dress up a
    plain desktop. The xeyes client features a pair of graphic eyes that follow your
    pointer. The xlogo client simply displays a floating window with the X.org logo.
    Both clients obey a subset of the X Toolkit options.


    You can start both clients like this:


    ```

    # xeyes -fg red -center yellow & xlogo -fg black -bg lightgreen

    ```


    After you press Enter, you''ll see a pair of floating eyes and the X logo, as
    shown in Figure 10.5.


    # Displaying the Time


    You''ll find two clock clients included with XFree86: xclock, which displays the
    time in analog (clockface) or digital format; and oclock, which displays a round
    clock face. These clocks may be started by entries in your .xinitrc file or the
    command line of an X terminal. They obey a subset of the X Toolkit options.


    The oclock client has a number of interesting options, with the ability to use
    different faces and to offer a chime (beep) on the half-hour and twice on the
    hour. You can also enable a second hand on the oclock client by using the -update
    option with a value of 1 (in seconds). For example, you can use the following
    command lines to see the difference between oclock and xclock''s digital and analog
    modes:


    After all three clients are launched, you''ll see them in the upper-left corner
    of your display, as shown in Figure 10.6


    ![](img/078622fac3fd61e5a0c895da1d3eff96_201_0.png)


    Figure 10.5 The xeyes and xlogo can dress up your desktop.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_201_1.png)


    Figure 10.6 You can use the oclock and xclock clients to display the time as colorful
    analog clocks; the xclock client also features a digital mode.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Magnifying a Portion of the Display


    # Clocking Out the Time


    Many different clock clients are available for XFree86 and Linux. You''ll find
    clocks of every imaginable type. Some of the most popular include rclock client
    (which features a timer, alarms, and an appointment reminder), xdclock (with melting
    clock faces), and asclock (the After-Step clock that can be docked into your desktop
    panel).


    Linux uses two types of time: the hardware time, set inside your computer, and
    the system time, set by Linux upon startup. Use the date command to set the Linux
    system date and time manually. Use the hwclock (as root) to set either your computer''s
    internal (hardware) clock, the system time from the hardware clock, or the hardware
    clock from the system time. You can also use the rdate command to retrieve the
    correct time from an Internet server, as in the following:


    ```

    rdate -s time.nist.gov

    ```


    This example works well if you''re at a workstation in a fixed location. However,
    if you''re a laptop user on the road, ensure you start with accurate time, and
    change your system''s timezone settings during your travels. See the man page
    for the tzselect command, or if you''re a Red Hat or Mandrake Linux user, use
    the timeconfig command.


    -fg and -bg options are used to set the foreground and background colors. You
    can use the geometry settings for the two xclock modes to place the clocks next
    to the oclock client (on the far left in Figure 10.6). The last command line''s
    -d option forces xclock''s digital mode. Note that you can use use geometry to
    resize the clocks.


    # Magnifying a Portion of the Display


    Use the xmag client to magnify (and copy) a portion of your desktop. Start the
    client from the command line of an terminal window as follows:


    ```

    # xmag

    ```


    After you press Enter, your pointer will turn into a 90-degree L shape. Next,
    click on the upper-left area of the desktop that you would like to magnify. The
    xmag client then displays the area in a floating window, as shown in Figure 10.7.
    You can then paste this graphic into a compatible X graphics application (such
    as xpaint).'
  merge: -1
