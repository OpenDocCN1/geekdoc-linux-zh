  md: 'his chapter introduces a special type of X11 client known as a window manager.
    You''ll learn what a window manager is, what features a window manager should
    have, and how to choose an appropriate window manager for your system. This chapter
    covers window managers for XFree86; the focus is on window managers that work
    with XFree86 and Linux. However, in many cases, the software works in the same
    way as for other operating systems that you use X, such as FreeBSD, OpenBSD, or
    NetBSD.


    Again, this is an introduction to window managers for XFree86 and Linux. If you''re
    new to Linux and X, you''ll be quite surprised to learn about the available choices.
    Experienced users may already have a preferred X environment. You can find details
    about managing and configuring window managers in Chapter 16, "Window Manager
    Configuration."


    # # What Is a Window Manager?


    A window manager is an X client that manages X windows and the X desktop. You''ll
    also find several desktop environments available for XFree86 and Linux. The difference
    between a window manager and a desktop environment is that, a window manager is
    a single X client, whereas a desktop environment includes a specialized window
    manager and suite of clients that take advantage of special software libraries
    or other features of the specialized window manager.


    Some examples of simpler window managers introduced later in this chapter include
    twwm and fwm. Examples of desktop environments include the Common Desktop Environment
    (CDE), the K Desktop Environment (KDE), and window managers using the GNOME libraries.


    You don''t have to use a window manager with X. If you want to run X without a
    window manager, first create an .xinitrc file in your home directory containing
    the following:


    ```

    xterm -fg black -bg white

    ```


    Next, save the file. This entry starts the xterm client using black text on a
    white background. Then you can choose to use the startx command or the xinit client
    to start an X session. To use the startx command, you simply enter the following:


    ```

    # startx

    ```


    Or, you can use the xinit client to start an X session, by entering the following:


    ```

    # xinit

    ```'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Window Manager Features


    ![](img/078622fac3fd61e5a0c895da1d3eff96_100_0.png)


    Figure 5.1 An xterm client can run without a window manager during an X session.


    After you press Enter, you should see a display such as shown in Figure 5.1.

    The display shows the xterm window sitting at the upper-left corner of the X root
    display or main desktop. As you see, you can run X clients without a window manager
    (type exit to quit the session, or press Ctrl+Alt+Backspace to kill the server),
    but some familiar and quite necessary elements are missing from the display. How
    many elements do you think are missing?


    # Window Manager Features


    Window managers are an essential element for using X. The following are some of
    the basic tasks performed by a window manager:


    +   - Managing new or child windows (hiding, iconifying, or destroying a window)

    - Managing window decorations (such as titlebars, scrollbars, and buttons)

    - Managing window movement and placement (such as determining where to place a
    newly created window)

    - Handling the resizing of windows (providing animation or redrawing of resized
    windows according to your pointer or keyboard input)'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Chapter 5: Choosing a Window Manager


    +   - Creating an icon or restoring an icon to a client window (and perhaps docking
    icons).

    - Handling tiling, overlay, or overlapping of windows

    - Handling focus policy, which determines how a window becomes active (such as
    whether a window should receive focus when your pointer is over a window) and
    when a window becomes active (such as whether you click to make a window active)

    - Possibly providing menus from the root desktop or on a client window

    - Possibly mapping keyboard input into pointer movement or other actions (so you
    can, for example, X without a pointing device)

    - Possibly providing virtual desktops—that is, a new, blank desktop—from

    - Handling transfer of interclient communication—the exchange of data between
    windows—such as copy and paste operations and object linking


    Most window managers provide these features. And some window managers support
    additional features, such as dragging and dropping of icons to copy, print, delete,
    link, or move files. Newer window managers may also automatically draw icons of
    files based on the file''s name or its content.


    A window manager runs in the background (in memory) during your X session. The
    only time you know that one is running is when you have an active client; you''ll
    then see how your window manager draws the client''s window frame, titlebar, buttons,
    and scrollbars.


    One of the great things about using Free86 (and Linux) is that you have freedom
    of choice. This means that, unlike a commercial operating system provided by industry,
    Free86 lets you choose the type of window manager to use during your X session.
    The difference in appearance of your desktop will be more than just dressing using
    a different background display. You can choose a window manager with as many or
    as few as you desire. Window managers (such as wm2 or vwm) have extremely small
    memory and storage footprint, whereas other desktop environments require 100MB
    of hard drive space and at least 32MB of memory. And some compact and efficient
    window managers can mimic other operating systems, even those that run on different
    hardware platforms!


    # An Overview of Window Managers


    This section introduces a number of window managers available for XFree86 and
    Linux. You''ll find a number of these included with most Linux distributions,
    whereas others may be downloaded from various sites on the Internet. Although
    all window managers described in this section share common features, each possesses
    a unique character or attribute that you may find desirable.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Unless proscribed by corporate policy or your local system administrator, choosing
    window manager is usually a personal choice, dictated by aesthetics, need, or
    applicability. Note that you can customize nearly all of them either by using
    resource settings, creating systemwide defaults for consistency, or configuring
    each individually with settings stored in a user''s home directory.


    # twm Window Manager


    The only window manager included with XFree86, twm (Tab Window Manager) is a legacy-type
    client that provides the bare minimum of features to support a productive X session.
    This window manager features a smaller memory footprint than others, but provides
    window decorations, customizable desktop menus, icons, and other desirable features.


    Most Linux distributions use twm as a fallback or failsafe window manager because
    it is included with XFree86. Its systemwide resource file, system.twrc, is found
    under the /etc/X11/twm directory. You can find user settings in a user''s home
    directory in a file named .twrc.


    You can launch this window manager using the startx command, if you include the
    following in your home directory''s .xinit file:


    ```

    twm

    ```


    When your X session starts, you can build a desktop, as shown in Figure 5.2.

    To access the desktop menu, left-click over a blank area of the desktop. A menu
    appears, from which you can select window control items or menus of applications
    (as defined in twm''s .twm file).


    # The FVVM Window Manager


    The FVVM window manager is another legacy-type client that has been popular with
    X power users for a number of years. Like twm, FVVM has served as a building block
    for many other window managers. Based on twm, FVVM incorporates additional features,
    one of the most important of which is the virtual desktop, or additional in-memory
    root docks. This feature enables you to assign different applications to different
    desktops; for example, you can decorate one desktop to work processing, another
    to Internet browsing, and others to specific tasks. This feature can help you
    organize your workspace (if you have enough memory!).


    This window manager also features 3D decorations, as well as a modular architecture
    that enables you to add features through additional code modules. The FVVM interface
    is very customizable. Although at one point in the recent past there were two
    versions, fvm and fvm2, there is now only one supported version, fvm2, which derives
    from the previous version, fvm2.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# # Chapter 5: Choosing a Window Manager


    ![](img/078622fac3fd61e5a0c895da1d3eff96_103_0.png)


    Figure 5.2 The twwm window manager features decorations and icon management.


    fvwm2''s systemwide resource file, system.fvwm2rc, is found under the /etc/X11/fvwm2rc
    directory. You can find unique user settings in your home directory''s file named
    .fvwm2rc.


    You can launch this window manager, like others, using the startx command, if
    you include the following in your home directory''s .xinitrc file:


    ```

