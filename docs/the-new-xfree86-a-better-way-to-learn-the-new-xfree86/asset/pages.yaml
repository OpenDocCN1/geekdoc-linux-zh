    used with a video device driver and kernel modules to provide service for all
    users or implemented as user-space applications (as owned processes by users)
    running in system memory. Using video hardware with Linux depends on the availability
    of such software, so you should always check the status of support for such hardware
    before contemplating its purchase.


    However, watching video requires another type of client for X11. Often included
    with Linux distributions is Real''s RealPlayer, which you can use as a standalone
    program to'
