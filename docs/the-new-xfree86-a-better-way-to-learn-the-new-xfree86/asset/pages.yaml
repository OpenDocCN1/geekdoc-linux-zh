    as text, from one client to another, or to bring up a window menu in the root
    display. You can see pasting by first highlighting text in a window window, then
    clicking the middle mouse button in another X terminal window.


    Some left-handed users will benefit by remapping the mouse buttons, using the
    xmodmap client to reverse their action. For example, use xmodmap and its -e pointer
