    # Maelstrom from the Mac


    Maelstrom, by Andrew Welch, is a shareware arcade game originally developed for
    the Apple Macintosh. What is interesting about this game—besides its excellent
    animation, fast play, and great sounds—is that the original interface is relatively
    unchanged from the Macintosh version.


    Start Maelstrom from the command line of a terminal window as follows:


    +   # Maelstrom &


    After you press Enter, you''ll see an initial splash window. Press the spacebar,
    and you''ll see a window of controls that allow you to change keyboard settings,
    high scores, and the volume. When ready, press the P key, and the game begins,
    as shown in Figure 13.13.


    This game is somewhat like the old classic Asteroids arcade game, but it is more
    like 3D Asteroids on steroids! You use various keys to maneuver, thrust, and fire
    at oncoming asteroids. As with the classic Asteroids, playing this game for any
    length of time requires dexterity and good aim.


    # Classic Arcade with xgalaga


    A whole generation of arcade game players grew up flinging weeks'' worth of allowances
    and spending money into game machines. You can relive some classic


