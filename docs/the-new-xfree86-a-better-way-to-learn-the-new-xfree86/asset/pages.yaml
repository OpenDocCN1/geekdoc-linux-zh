  md: '# Understanding the X Toolkit


    # xterm Exception!


    Be careful when using geometry settings to start an xterm client—the values do
    not correspond to pixels. When you use geometry settings with xterm, the width
    and height settings designate the number of characters and lines of the new terminal
    window.


    X Toolkit geometry settings can be especially useful to build working desktops
    and to place windows in exact positions on the display. As a system administrator,
    you can help new users learn X by crafting default desktops with helpful tools
    on the screen, using client listings with geometry settings in default .xinitrc
    files. Geometry settings take the following form:


    +   -geometry WidthHeight+/-Xoffset/-Yoffset


    Although the syntax may look complicated, it is quite easy to use geometry settings.
    In fact, a few "tricks of the trade" are documented in the Man page regarding
    the use of X and Y offsets. For example, you can use the -geometry option to create
    and place an xclock window that is 100 pixels wide and 80 pixel height with a
    negative X offset and a positive Y offset, as:


    ```

    # xclock -geometry 100x80+0&

    ```


    After you press Enter, the clock will appear in the upper-right corner of your
    display. This means you can use the following offsets to control corner displays
    of clients:


    # Offset


    # Position


    +   +0+0

    -0-0

    -0+0

    +0-0


    +   Upper-left corner

    Lower-right corner

    Upper-right corner

    Lower-left corner


    Another interesting use of geometry settings is to place clients offscreen in
    a virtual desktop. If you know your desktop size in pixels and the geometry of
    your virtual desktops (as 2x2, 3x2, and so on), then you can use geometry settings
    to position client windows on other desktops relative to desktop one, the starting
    desktop. For example, if your display is 1,024×768 and you use a 2×2 virtual desktop,
    start the xclock client with the following geometry setting:


    ```

    * xclock -geometry 80x80+1025&

    ```'
