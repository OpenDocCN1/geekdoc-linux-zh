    # Configuring XF86Config


    You''ll need to create several specialized sections in the XF86Config file to
    create support for multiple monitors. Support for multiple devices, monitors,
    screens, and layouts is built into FreeX86 4.0.1. Your first task is to create
    unique entries for each monitor, video device, and screen.


    For example, if your system will use two monitors—with one a 15-inch liquid crystal
    display (LCD) and the other 17-inch multisync display—create a “Monitor” section
    for each, and provide a unique identifier like this:


    ```

    Section "Monitor"

    Identifier "NECXV17"

    HorizSync 31-65

    VertRefresh 55-100

    EndSection

    ```


    ```

    Section "Monitor"

    Identifier "LCD"

    HorizSync 31-65

    VertRefresh 56-75

    EndSection

    ```


    In this example, the X session will use an NEC XV17 labeled “NECXV17” and a Samsung
    LCD monitor labeled “LCD.” If you plan to use two video cards, you''ll'
