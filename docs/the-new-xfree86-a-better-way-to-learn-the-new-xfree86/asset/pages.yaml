  md: '# Building from Source


    5. To create and install the XFree86 and X11 pages, enter the following:


    ```

    # make install.man > man.log

    ```


    6. Keep your fingers crossed. If a problems occurs, the build fails, you''ll need
    to peruse the rest of the installation directions for details and carefully examine
    the build, install, or man logs.


    The directions contain some guidance on building under Linux distributions, and
    specify some possible settings that can help you avoid any problems. When the
    build starts, you can use the less pager to read any initial information, as follows:


    ```

    # less world.log

    ...

    Building on Linux 2.2.14-15mdk i686 [ELF] (2.2.14)


    Linux Distribution: RedHat

    libc version: 6.1.2

    binutils version: 2.9

    ...

    ```


    In this example, the install program has recognized the distribution as Red Hat
    (actually Mandrake Linux). You can watch the progress of the build by using the
    tail command with -f command-line option, as follows:


    ```

    # tail -f world.log

    ```


    Depending on your computer''s CPU, available memory, and hard drive speed, the
    complete build can take nearly one hour. For example, a sample build on 500MHz
    Pentium II, 128MB system required 54 minutes. Of course, if you have a low-end
    quad-CPU Alpha system, which can perform a Linux kernel recompile in 90 seconds
    (as opposed to four minutes for the Pentium), the build time will be considerably
    shorter.


    # Examining the X11 Source


    The new architecture of XFree86 4.0 and higher provides a great deal of convenience,
    especially in those instances where you need to add support for a graphics chipset
    family. In the past, with the pre-4.0 XFree86 distribution, this task required
    patching and rebuilding an entire server binary. Today, however, you need only
    make changes to a driver, which enables manufacturers and XFree86 developers to
    add support for new hardware quickly.'
