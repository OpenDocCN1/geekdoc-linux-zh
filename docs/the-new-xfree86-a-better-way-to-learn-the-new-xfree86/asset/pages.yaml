  md: '# Chapter 7: First Steps with X11


    This chapter introduces some of the basics when using XFree86. You''ll learn about
    logging in, using an X11 terminal, or shell window, configuring various clients,
    launching X clients, and using various graphic software tools to manage processes
    during your X session. Finally, you''ll learn how to stop or log out of your X
    session.


    # Starting an X Session


    As you learned in previous chapters, there are a number of ways to start an X
    Session. Once X is properly configured for your system, you can use the starttx
    command, log in locally through an X display manager, or query for specific hosts
    on your network to log to.


    Fortunately, to keep things simple, X does not require a separate username or
    password in order to initiate an X session. But you are required to have a valid
    account on the local or remote computer. If you manage one or more workstations,
    you should also know that it''s not a good idea to log in as the root operator
    or Linux or X directly. As root, you are the superuser and can do anything to
    the system, including wreaking havoc through inadvertent file deletion by entering
    a command such as the following:


    ```

    # rm -fr /

    ```


    This command line instructs Linux not only to destroy the root filesystem, but
    also any mounted filesystem—such as a mounted Windows, DOS, or Network File System
    (NFS) filesystem—under the root directory. If you need to use root to edit system
    configuration files, a safer approach is to limit root activity to a specific
    task. For example, you can become root by using the su command as follows:


    ```

    $ su

    Password:

    #

    ```


    But a better way to use su is to specify the task:


    ```

    $ su -c "pico -w /etc/X11/XF86Config"

    Password:

    ```


    After you press Enter, you can then edit the file (in this example, the command
    specifies the pico editor with line-wrapping disabled). When you exit the editor,
    you'
