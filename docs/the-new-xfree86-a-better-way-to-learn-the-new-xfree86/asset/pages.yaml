  md: '# Starting X11 Clients


    When you run a terminal client, you use a Linux shell, or interactive command
    line. Using the shell, you can launch X clients in the background (memory) and
    go right back to work. A proper X client will “detach” from your terminal window
    and appear in its own window as long as you use the proper shell operator, the
    ampersand (&), or the proper background operator on the command line, as follows:


    ```

    $ xterm &

    ```


    When you launch an X client using the background operator, the program becomes
    a background process. Using the background operator is essential under X11, as
    you can repeatedly launch clients from a single terminal window.


    Another way to launch multiple clients is through your home directory’s .xinitrc
    file. This, as you’ve learned, can contain directions to launch clients and a
    specific window manager for your X session if you launch X from the console. You
    can also craft your own shell scripts to launch multiple clients with a single
    command, as follows:


    ```

    #!/bin/bash

    xterm &

    xcalc &

    ```


    Save the file with a name such as myx, then use the chmod command and its +x option
    to make the file executable:


    ```

    $ chmod +x myx

    ```


    You can then launch several clients at once with the following command:


    ```

    $ /myx

    ```


    Note that you don’t have to use a background operator because all the clients
    that you launch will launch into the background. After you press Enter, your shell
    prompt returns.


    # Stopping X11 Clients


    Each background process (such as an X server) is assigned a unique process number,
    or process ID. Various programs display the IDs of all or some as the superusers,
    whereas others may be used to control processes. Unless you are the superuser
    root, you will be able to control only the processes that you own. One simple
    way to view process IDs is to use the ps (process status) command, along with
    fgrep search command. For example, use the ps command along with its -e line option
    (to display all'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'processes), then pipe the output through the fgrep command to search for certain
    processes, as follows:


    ```

    $ ps -e | fgrep kvt

    6068 tty1 00:00:14 kvt

    9466 tty1 00:00:14 kvt

    ```


    In this example


    ```

    $ kill 9466

    ```


    After you press Enter, the terminal disappears. If you used that terminal to launch
    other clients, they too will exit, because they are inherited processes. This
    behavior is how an application dock, desktop panel, or root display can be handy
    to launch independent processes during your X session.


    Keep in mind that even though a client can be minimized, iconized, or docked,
    that client is still using system memory. On a workstation with little memory
    (such as 32MB), a local X session can quickly exhaust the system’s resources by
    running many processes. It is much better to stop unneeded clients and keep as
    much memory free as possible for system performance.


    You can also use the killall command, included with many Linux distributions,
    to kill a process by name. Using the previous example, you would kill all the
    instances of the kvt process as follows:


    ```

    $ killall kvt

    ```


    After you press Enter, the terminal’s windows disappear. If you use killall -i
    (interactive) option you can selectively kill clients.


