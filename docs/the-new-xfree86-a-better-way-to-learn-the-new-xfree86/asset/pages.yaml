  md: '# Chapter 2: Getting and Installing Xfree86


    This chapter discusses the XFree86 distribution for Linux, along with some initial
    considerations concerning your computer''s display, memory requirements, and storage
    requirements. There are a number of ways to acquire and install XFree86. This
    chapter will show you how to install or update a new distribution or version of
    X. You''ll also learn about the various components of XFree86, so that you can
    decide which components may be most important for your system.


    # Initial Considerations


    Most new users simply install Linux and XFree86 on an existing computer using
    an acquired Linux distribution on CD-ROM. The user puts little thought into any
    preplanning process, and simply crosses fingers and hopes for the best regarding
    compatibility (and in the majority of cases, ends up pleasantly!); today''s more
    experienced Linux users are choosing to plan installation on specific hardware,
    with the most savvy building systems from scratch using researched components.


    Whether you''re new to Linux or an experienced hand, your installation will benefit
    if you develop a good understanding of your existing graphics hardware or carefully
    choose your graphics ahead of time. If you are building a Linux server, however,
    the type of graphics hardware in your system may not be much of a concern, as
    whether or not X is installed or used may not be important. (My system''s graphics
    hardware is important to me as an author, because I run all my X clients over
    Ethernet from a large server in the basement, and use a desktop-replacement laptop
    with a high-resolution display as a writing and graphics terminal. You''ll learn
    how to do this in Chapter 9, "Using X11 on a Network.")


    # Display Requirements


    If you plan to buy a computer to run Linux and need a specific resolution or capabilities,
    then you should definitely do a bit of research ahead of time. If you''re installing
    Linux on an existing system, or just want to run a dual-boot system (which enables
    you to choose Linux or another operating system at boot time), you can also benefit
    from understanding the capabilities of XFree86 and your computer''s hardware.
    By knowing the specifics, you''ll be able to get the most out of what you have.


    As you know, Linux works quite well in console mode, or text-only display. The
    fact is that your personal computing experience is enriched when using a graphical
    interface. Old hackers may remember (although not fondly) the days of flipping'
  merge: -1
