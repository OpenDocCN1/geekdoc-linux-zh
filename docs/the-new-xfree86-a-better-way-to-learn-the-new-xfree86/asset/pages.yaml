  md: "# Remapping Keys\n\nYou can remap the keys on your keyboard using the xmodmap\
    \ client. This client designed to change the keymap table, which interprets X\
    \ keyboard events and returns keyboard symbols. This means that you can use this\
    \ client to swap keys quickly around your keyboard, or even design new keyboards\
    \ using the command line.\n\nFor example, one common gripe among experienced computer\
    \ users is the loss and replacement of the Ctrl key Caps Lock located on QWERTY\
    \ U.S. keyboards. Many favorite applications, as editors for Linux, can still\
    \ use the now legendary cursor diamond for cursor movement:\n\n+   - e\nasdf\n\
    \ x\n\nEarly terminals usually provided a small Ctrl key, accessed by the left\
    \ hand's pinky finger. While the user pressed the Ctrl key, the rest of the user's\
    \ left hand was to navigate in the direction indicated by the cursor diamond.\
    \ For example, you could press Ctrl+s to move one character, Ctrl+a to move one\
    \ word, Ctrl+d to move one character right, Ctrl+f to move one word, Ctrl+e to\
    \ move up one line, and Ctrl+X to move one down line.\n\nUnfortunately, on modern\
    \ U.S. keyboards, the left Ctrl key is placed below the left Shift key. You can\
    \ quickly remedy this by placing the following key definitions in a file .xmodmap\
    \ in your home directory:\n\n```\nremove Lock = Caps_Lock\nremove Control = Control_L\n\
    keycode 0x42 = Caps_Lock\nkeycode 0x25 = Control_L\nadd Lock = Control_L\nadd\
    \ Control = Caps_Lock\n```\n\nSave the file, which uses the value of the Ctrl\
    \ and Caps Lock keys in hexadecimal, and then use the xmodmap file to read in\
    \ your definitions to swap the keys for your session:\n\n```\n# xmodmap .xmodmap\n\
    ```\n\nNote that your .xmodmap file is generally read before you start an X session.\
    \ You could identify the Caps_Lock and Control_L keys as follows:\n\n```\nremove\
    \ Lock = Caps_Lock\nremove Control = Control_L\n```"
  merge: -1
  pgno: 296
