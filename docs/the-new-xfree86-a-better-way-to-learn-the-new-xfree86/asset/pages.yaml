  md: '# Remote Sessions


    You can quickly determine your $DISPLAY variable by piping the output of the shell''s
    env command through fgrep like this:


    ```

    $ env | fgrep DISPLAY

    DISPLAY=dell.home.org:0.0

    ```


    This example (after using telnet to access a remote host) shows the hostname,
    display, screen number, and refers to your workstation, not the display of the
    remote host. Another way to see your shell''s $DISPLAY variable quickly is to
    use the echo command (or your shell''s built-in echo command), as follows:


    ```

    $ echo $DISPLAY

    dell:0.0

    ```


    And another way is to use the xdpyinfo client as follows:


    ```

    $ xdpyinfo | fgrep display

    name of display:      dell.home.org:0.0

    ```


    If more than one X session is running locally on a server, you may see something
    like the following:


    ```

    name of display:      1.0

    ```


    In this example, the user is logged in and using a second X session (display)
    of the workstation.


    # Remote Client Execution


    There are also a number of ways to launch clients on an X network. For example,
    if you log in to Linux and start an X session locally, you can display a local
    client on a remote display using the -display X Toolkit option with the remote
    computer''s display name. If you''re sitting at a workstation named greenie, you
    can launch the xcalc client and display it on the remote X display on stinky like
    this:


    ```

    $ xcalc -display stinky:0.0 &

    ```


    However, if you do not have access or permission to run clients on the remote
    computer, you will see something like this:


    ```

    Xlib: connection to "stinky:0.0" refused by server

    Xlib: Client is not authorized to connect to Server

    Error: Can''t open display: stinky:0.0

