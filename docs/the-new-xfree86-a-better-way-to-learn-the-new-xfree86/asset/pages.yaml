    # Commercial X11 Games for Linux


    Selecting commercial games for Linux and X may require some deliberation before
    purchase. On the one hand, these games are professional and polished, and will
    hold your interest for many hours of play. On the other hand, some of these games
    require enormous amounts of hard drive storage, require advanced and in some cases
    expensive video hardware, and are huge resource hogs for CPU cycles and system
    memory while they are running. Most are not to be played on a low-end workstation
    and, unlike Linux and XFree86, have minimum system requirements, even for Pentium-class
    computers.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_277_0.png)


    Figure 13.23 The xsnow client can be fun for at least one month each year.'
