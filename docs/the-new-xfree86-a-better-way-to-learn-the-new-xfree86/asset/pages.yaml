- img_proc: true
  md: '# About the Author


    ILL BALL is the best-selling author of a dozen books about Linux, including such
    titles as Linux for Your Laptop. He has been a fan of Linux since kernel 0.99,
    and first started using XFree86 in 1994, albeit in 16 colors. He is also an active
    member of the Northern Virginia Linux Users Group (NOVALUG) and lives in the Shirlington
    area of Arlington, Virginia.'
