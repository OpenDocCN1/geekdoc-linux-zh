  md: '# Acknowledgments


    Without a doubt, this book would not have been possible without the support and
    assistance of my career mentor, Lynette Quinn. Many thanks to everyone at Prima,
    especially Andrew Ossian Saff and Elizabeth Agostinelli for their efforts to make
    this book the best product on the market. Many thanks to Brandon Palmer for the
    technical edits. Also, to those programmers, such as Jim Gettys and others of
    the original X and past and current XFree86 Project releases, many thanks for
    porting, improving, and distributing the best networking graphical interface in
    the world. Thanks are also due to Richard M. Stallman for his GNU GPL, and to
    Linus B. Torvalds for bringing Linux into the world as free software.'
