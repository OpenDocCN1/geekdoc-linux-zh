  md: "# # Building a Simple Client\n\nYou can compile the sample client by using\
    \ a single command line to instruct the compiler (gcc) where to find the various\
    \ #include files and using the X11 and Motif toolkit libraries to link into the\
    \ final client executable:\n\n```\n$ gcc -o myclient.c -I/usr/X11R6/include \\\
    \n-L/usr/X11R6/lib -lxp -lxm -lxm -ltext -lX11\n```\n\nAfter you Enter, you can\
    \ run the client, specifying a pixmap graphic to display in the root of the window\
    \ manager, as follows:\n\n```\n# .myclient/home/bball/faces.xm\n```\n\nThe client\
    \ then appears, and should look similar to that shown in Figure 20.3.\n\nInstead\
    \ of the previous command line order, you can use this Makefile installed:\n\n\
    ```\nCC = gcc\nINCLUDES = -I/usr/X11R6/include\nLIBS = -L/usr/X11R6/lib -lxp -lxm\
    \ -lxt -lext -lX11\nOBJS = myclient.o\nmyclient : $(OBJS)\n\t$(CC) -o myclient\
    \ $(OBJS) $(INCLUDES) $(LIBS)\n```\n\nEnter the text into a named Makefile. You\
    \ can then edit it and rebuild the client using the make command. If you prefer,\
    \ you can also craft an Makefile or use the autoconf command to create a configure\
    \ script for your project.\n\nTo build this client using LessTif, you can use\
    \ a Makefile like this:\n\n```\nCC = gcc\nINCLUDES = -I/usr/local/LessTif/Motif1.2/include\n\
    LIBS = -L/usr/local/LessTif/Motif1.2/lib -lxm -L/usr/X11R6/lib -lxt -lext -lX11\n\
    OBJS = myclient.o\nmyclient : $(OBJS)\n\t$(CC) -o myclient $(OBJS) $(INCLUDES)\
    \ $(LIBS)\n```"
