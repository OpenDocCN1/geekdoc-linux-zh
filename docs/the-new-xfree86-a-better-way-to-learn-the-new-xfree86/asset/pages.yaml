  md: '# Free X11 Games 25


    Select a game by using the Rules menu. The client automatically places the cards
    for you, you don''t have to drag cards between piles. While this may not be as
    flexible as other solitaire games, it does speed up play.


    # Solitaire with kpat


    The kpat client, by Paul Olav Tvelei, is included with KDE and is another combination
    solitaire game for X. You''ll need to have KDE and its support libraries installed
    in order to play kpat. This game features nine different card games. Although
    you normally launch a KDE client from the desktop''s panel menu, you can launch
    this game from the command line as follows:


