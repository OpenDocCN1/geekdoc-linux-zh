    # Using Multihead Displays


    One of the new features of the XFree86 4.X series of X distributions is the support
    of Xinerama, the use of multihead displays, similar to a feature supported by
    the Apple Macintosh for nearly 15 years. To take advantage of this feature, you
    must use the new XFree86 4.0.1 server and have one or more compatible graphics
    cards installed on your system.


    XFree86 offers several types of support for use of multiple monitors. First, having
    multiple instances of the X server, as running multiple X sessions, can support
    the use of one or more monitor resolutions and color depths. Second, you can have
    one or more monitors display simultaneous desktops during a single X session.
    Finally, a single instance of the X server can be used as a session that takes
    advantage of Xinerama, which allows windows to span physical borders (that is,
    the monitors borders).


    The current limitation is that you cannot associate different color depths with
    each display when using a single instance of the X server with the desktop as
    a contiguous display. One possible solution is to run multiple instances of the
    X server using different color depths (provided you have adequate memory). Clients
    may be sent remotely between displays, and the user can activate displays through
    the use of keyboard commands, such as Ctrl+Alt+Fn (that is, a specific function
    key).


    # Choosing a Video Card


    Any supported video card should enable you to use Xinerama, peculiarities of your
    system''s motherboard could cause big problems. You''ll need to decide if you
    want to use two peripheral component interconnect (PCI) video adapters, a single
    multihead video card, or one accelerated graphics port (AGP) video card and one
    PCI video adapter. Although an AGP adapter is not necessarily faster than a PCI
    video card, your choice may be determined by whether your motherboard has a


