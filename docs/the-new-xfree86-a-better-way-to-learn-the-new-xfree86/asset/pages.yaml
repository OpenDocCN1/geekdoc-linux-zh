  md: '# Chapter 23: X11 and Other Operating Systems


    This chapter provides a short overview of interesting and useful software technologies
    that you can take advantage of when using XFree86. For example, you''ll learn
    about Xvnc, and how you can use it to control remote desktops, or to control your
    own desktop from a remote location. Although you can do this easily if the other
    computers are using X11, the Xvnc server is cross-platform-independent. This means
    you don''t have to use X11 on the local or remote server.


    You''ll also get an introduction on using the VMware emulator, which can help
    you install and run Linux or other operating systems during your X sessions, or
    perhaps run XFree86 while using Windows.


    # Xvnc


    Xvnc (Virtual Network Computing) is a package of software distributed by AT&T
    Laboratories in Cambridge, England, and stands for Virtual Network Computing.
    This amazing software, based on X11R6.3, provides a unique way to run applications
    across different computer platforms or even on the same computer platform. Distributed
    under the GNU Public License, Xvnc is available in source code and binary versions
    are available for a variety of operating systems and computer platforms, including
    the following:


    +   - DEC Alpha OSF1 3.2

    - Java

    - Macintosh OS (m68k and PPC)

    - Solaris 2.5 (SPARC)

    - Win32 (including Windows 9x and 2000 as well as Windows NT)

    - Windows CE 2.x (for the SH3 and MIPS processors)


    # Xvnc for Linux


    The Xvnc software package for Linux and XFree86 includes a shell script named
    vnc-server, xvnc (a modified X server), and a utility client named vncviewer.
    The package also includes a password client named vncpasswd. You can build the
    Xvnc software from scratch, but you can get right to work by downloading binary
    versions for your computer platforms from http://www.uk.research.att.com/vnc/.
    The software will'
