    # Logging Out


    Most window managers offer a mechanism for logging out of an X session gracefully.
    You''ll find a Log Out menu item on KDE''s desktop panel and the GNOME panel.
    Other window managers, such as Motif, twm, and FVWM, offer Log Out menu items
    from root display menus.


    Logging out of your X session gracefully is the best way to end your X session.
    You can run the chance of corrupting your filesystem if you exit Linux or X11
    by turning off your computer, and you can lose session management or other settings
    that you configured during your X session.


    # Using the Keyboard


    XFree86 offers some basic keyboard controls that you can use either to exit an
    X session to the Linux console or to kill the X server. The kernel included with
    most distributions offers six virtual consoles. As you learned in Chapter 6, "Starting
    X11," you can jump to a text-only console by pressing Ctrl+Alt+Fn, where n is
    a virtual console from 1 through 6. For example, to return to the third virtual
    console, you would press Ctrl+Alt+F3. Usually then return to the X session by
    pressing Ctrl+Alt+F7.


    One of the options that you can include in your system''s XF86Config ServerFlags
    section controls the ability to kill the current X server session by pressing
    Ctrl+Alt+Backspace.The section appears as follows:


    Section "ServerFlags"


    ```

    # Uncomment this to disable the <Ctrl><Alt><BS> server abort sequence

    # This allows clients to receive this key event.

    #DontZap

    ```


    EndSection


    Although the logic may seem backward, if you enable this feature, you won''t be
    able to use this method to kill the X session. However, if you''re still determined
    to kill the session, you can do so even with this feature enabled. Simply use
    the command, and as root, kill the current X server by entering the kill command
    with the server''s process ID.'
