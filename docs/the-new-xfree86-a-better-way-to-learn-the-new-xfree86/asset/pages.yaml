    # Managing Fonts


    Font use under X11R6 seem mysterious and difficult to set up and administer, but
    the fact is that fonts are quite easily managed using X11, on a workstation or
    even across a network. XFree86 has built-in facilities and comes with a number
    of clients that you can use to manage fonts on your system. You''ll find plenty
    of documentation and guidance on using fonts included with your system.


    # Using the xfs Font Server


    The xfs font server is a critical element in managing fonts when using X in a
    networked environment. Using xfs, you can offload font storage to faster computers
    over your LAN or computers with more storage. The server also responds dynamically
    to requests to add or remove fonts from a particular X session.


    You do not have to use xfs for your X session, particularly on a standalone workstation.
    If you do not, a correct FontPath entry in your system XF86Config''s "Files" section
    is essential. For example, on a standalone workstation with adequate storage and
    resources, you can dispense with the font server and simply tell the X server
    where to find the system fonts, like this:


    ```

    Section "Files"

    RPath "/usr/X11R6/lib/X11/rgb"

    FontPath "/usr/X11R6/lib/X11/fonts/misc/*"

    FontPath "/usr/X11R6/lib/X11/fonts/75dpi/:unscaled"

    FontPath "/usr/X11R6/lib/X11/fonts/100dpi/:unscaled"

    FontPath "/usr/X11R6/lib/X11/fonts/URW/*"

    FontPath "/usr/X11R6/lib/X11/fonts/Type1/*"

    FontPath "/usr/X11R6/lib/X11/fonts/Speed/*"

    FontPath "/usr/X11R6/lib/X11/fonts/75dpi/*"

    FontPath "/usr/X11R6/lib/X11/fonts/100dpi/*"

    EndSection

    ```


    Note that the preceding listing does not show all the output of the XF86Config
    file. The "Files" section, which also tells the server the location of the 8-bit-plane
    color database, can contain detailed listings and pathnames of the locations of
    different fonts.'
  merge: -1
