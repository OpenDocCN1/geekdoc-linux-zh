  md: '# Networking Fonts


    The xfs font server is primarily responsible for network font management, and
    thus provides fonts to the local or remote display server (XFree86). This means
    that you can use fonts installed on a remote computer, reducing the need for local
    storage.


    The xfs server is managed by its configuration file, config, found under the /etc/X11/fs
    directory. This file contains a number of elements, one of the most important
    of which is the font catalogue. The following is an example of a font catalogue:


    +   catalogue = /usr/X116/lib/X11/fonts/misc:unscaled,

    - /usr/X116/lib/X11/fonts/75dpi:unscaled,

    - /usr/X116/lib/X11/fonts/100dpi:unscaled,

    - /usr/X116/lib/X11/fonts/misc,

    - /usr/X116/lib/X11/fonts/Type1,

    - /usr/X116/lib/X11/fonts/Speedo,

    - /usr/X116/lib/X11/fonts/cyrillic,

    - /usr/X116/lib/X11/fonts/75dpi,

    - /usr/X116/lib/X11/fonts/100dpi,


    Note that the example replicates only a portion of the catalogue entry. Table
    4.2 lists the major elements of the xfs config file. See the config file for example
    entries.


    | Table 4.2 xfs config File Elements |

    | Option | Description |

    |---|---|n| alternate-servers | Provides a comma-delimited list of alternate servers
    |

    | catalogue | Prints a comma-delimited list of font paths |

    | client-limit | Specifies the maximum number of clients that can connect |

    | clone-server | Spawns a new server when the maximum number of clients is reached
    |

    | default-point-size | One-hundredths of a point (default 120 decipoints) |

    | default-resolutions | Provides a comma-delimited list of resolutions |

    | deferoglyphss | Specifies the encoding size used for 16-bit fonts |

    | error-file | Specifies the error logging pathname |

    | no-listen | Turns off listening on specified type of port |

    | port | Listens on specified port |

    | use-syslog | Toggles logging on and off |'
  merge: -1
