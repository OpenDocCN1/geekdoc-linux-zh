    # Audio Clients


    Literally hundreds of audio clients are available for Linux and X11. This section
    introduces some of the more common clients you''ll find with your Linux distribution.
    To use these, you should configure your system to use your computer''s sound hardware.
    This hardware can include a microphone, lines in, audio out, CD audio, and so
    on. If you need help configuring your system to work with Linux, read the Sound-HOWTO,
    Sound-Playing-HOWTO, or sound documentation included with the Linux kernel. You
    can also turn to alternative sound systems for Linux, such as the ALSA project,
    or use the commercial sound drivers from 4-Front Technologies.


    # Audio Mixer Clients


    After configuring your sound, you should be able to adjust the volume, balance,
    and other features using a variety of graphical clients. This section covers some
    common audio mixers you''ll find with your Linux distribution.'
