  md: '# Popular Toolkits 365


    ![](img/078622fac3fd61e5a0c895da1d3eff96_392_0.png)


    The KDE desktop environment is built upon the Qt software libraries from Trolltech
    AS.


    The result has been increasing support for a totally free, unencumbered GNU GPLd
    X11 development and session environment. GNOME uses the GTK+ toolkit, originally
    developed to provide a GUI for the premier Linux graphics client, the GIMP. Version
    1.0 was released in March 1999, and the current version, 1.2, was released in
    May 2000. At the time of this writing, version 1.4 was in the works.


    Like KDE, GNOME includes a variety of clients that take specific advantage of
    GNOME''s features. One GNOME distribution, named Helix Code, includes a full suite
    of clients, including a window manager, office suite, and development environment.
    An example desktop is shown in Figure 19-4.


    The GNOME development software consists of several different libraries:


    +   - Glib-Consisting of a base library of "portable" functions, GLib includes
    string-handling routines, data structures, and, most important, an event loop.

    - own-This library is part of GNOME''s portability, and is an abstraction layer
    using higher-level widgets and creating X windows. Clients use functions for drawing
    or screen handling.

    - GTK+ Object System-This higher-level toolkit of object-oriented function calls
    provides signaling, date inheritance, and other sophisticated widgets for such
    things as event and data handling.'
