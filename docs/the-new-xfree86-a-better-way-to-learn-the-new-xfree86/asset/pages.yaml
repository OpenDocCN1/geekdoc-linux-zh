  md: '# Chapter 5: Choosing a Window Manager


    # How Many Window Managers?


    Many other window managers are available for XFree86. Some of these include cwm,
    olvm, Blackbox, YAWM, wmG, aew, lwm, flwm, and many others. Unless the window
    manager''s author has made a special effort to build a version for your version
    of Linux and XFree86, you''ll most likely need to download and build the window
    manager from scratch. As you can see from the wm2 example, this procedure is not
    always difficult. However, some window managers, especially those under rapid
    and active development, cutting-edge software, may require additional attention.
    This can hamper your desire to use the "latest and greatest" version of your favorite
    window manager. However, as you have seen so far, many other window managers are
    available for you to explore in your quest for the perfect X desktop.


    The mwm configuration file defines the root desktop menu (accessed by right-clicking
    in a blank area of the desktop), along with window actions to be carried out in
    response to keyboard presses (known as key bindings) or mouse presses (known as
    bindings).


    As with other window managers, you can start an X session using mwm by editing
    your .xinitrc file and adding the following:


    ```

    mwm

    ```


    When your X session starts after you invoke the startx command, you''ll see a
    desktop such as that shown in Figure 5.13.


    # An Overview of Desktop Environments


    This section introduces three desktop environments for XFree86 and Linux. X-top
    environments are similar to window managers (as a window manager is required to
    support client windows), but differ significantly in scope, size, and approach
    to providing a graphical interface for your X session. The environments described
    in this section have several traits or features in:


    +   - An underlying structure consisting of one or more software libraries that
    provide standardized graphical interfaces for clients developed for the environment.
    In other words, developers creating programs for the environment can reuse a standard
    base of code (or, in the parlance of commercial operating systems, a base set
    of programming interfaces, or APIs) for drawing windows, menus, buttons, scrollbars,
    file open and save dialogs, and so on.'
