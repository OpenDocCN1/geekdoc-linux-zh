  md: '# Chapter 9: X11 on a Network


    ![](img/078622fac3fd61e5a0c895da1d3eff96_187_0.png)


    Figure 9.2 The Xvnc server and client software works even on outdated operating
    systems such as Windows.


    Start the client during your local X session as follows:


    $ xtterm &


    Next, move your mouse button to a blank area of the terminal window, then hold
    down the Ctrl key and left-click the mouse button. A pop-up menu appears, from
    which you should select the Secure Keyboard option, as shown in Figure 9.3.


    The xtterm window reverses background and foreground colors in secure keyboard
    mode. This mode forces all keyboard input to the xtterm window for the duration
    of the mode, so if you launch another client or Netscape, you will not be able
    to enter input into other windows or text fields. Turn off the secure keyboard
    mode by identifying the window or using the pop-up menu.


    If you want to allow external access to your network''s internal X servers, consider
    setting up an firewall proxy using the xfw client. You will also need to run an
    X proxy manager, but once in place, the addresses of your LAN''s X servers will
    be protected, and only authorized clients will be allowed to connect. The xfw
    client is generally used on a firewall computer, but you may have to do some additional
    configuration with your existing firewall software to allow access to your LAN''s
    X servers.'
