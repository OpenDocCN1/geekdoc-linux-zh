  md: '2000, The Open Group announced Motif, and its source code, would become available
    under a “public license.” Although this license allows you to download and use
    Motif, it does not allow you to create binary-only clients for profit; you must
    still pay a license fee to The Open Group if you wish to sell your client.


    Motif libraries provide high-level functions that you can use to build clients
    quickly. These libraries are pretty much industry standard between corporate UNIX
    and X11 developers, and the graphical user interface (GUI) toolkit works on a
    variety of platforms.


    Motif widgets support advanced features such as printing and vertical text. Three-dimensional
    object decorations—such as for window borders, scrollbars, check boxes, and over
    GUI elements—are supported automatically.


    Whereas the Xt Intrinsic introduced widgets, the Motif toolkit gets a bit further
    to include widgets known as gadgets. Some of these objects include a container,
    a spinbox, a combo box, and a thermometer. Building upon Motif’s capabilities,
    developers can include advanced features as drag-and-drop and tear-off menus for
    clients.


    Like XFree86, Motif also includes a window manager. The mm window manager, when
    installed with the Motif libraries, may be used for your X sessions and can support
    clients using Motif features.


    Motif has been available for Linux since the first ports of XFree86. Once installed,
    the Motif library usually resides under the /usr/X11R6/lib directory with files
    such as libXm.* and libMrm.*.


    # Popular Toolkits


    This section introduces some of the more popular toolkits used by Linux and X11
    developers today. As the Open Source and free software movements have grown, and
    the installed Linux user base has proliferated, more and more developers and companies
    are turning to alternative, noncommercial sources of development libraries. This
    only makes sense in today’s economy, where licensing, royalties, and other monetary
    caps can hinder or kill small-business software projects altogether.


    # The Qt Libraries


    The Qt libraries from Trolltech form the base and underlying functionality of
    the K Desktop Environment. First released in 1994 as part of a commercial enterprise
    with liberal licensing, the libraries quickly became the foundation of KDE. Although
    initially shunned by programmers wishing to develop only free software clients,
    the Qt (and KDE) libraries have proven quite capable and appealing to C++ programmers
    around the world.'
