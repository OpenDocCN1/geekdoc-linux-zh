    To select a game, choose New Game from the Game menu. You can drag and release
    cards during game play.


    # Solitaire Games


    There are many other types of solitaire games besides card games. Although some
    fall into the category of board games, others (such as ksame, discussed later
    in this section) could not be played without the help of graphics animation and
    X. Some solitaire games can be played quickly, in less than a minute, whereas
    others may require nearly an hour.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_262_0.png)


    Figure 13.5 The kpat client plays nine different solitaire games and is part of
    the KDE games suite.'
