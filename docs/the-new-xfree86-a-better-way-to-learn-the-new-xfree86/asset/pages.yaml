    The Next button to continue the installation. You can choose a minimal or full
    installation of the suite''s components. Unlike Applixware, Corel has chosen the
    installation directory (/usr/lib/corel), so you cannot specify a different installation
    directory. Installation can take up to 10 or more minutes, depending on your setup
    and computer system.


    After installation, if you use KDE and Corel Linux for your XFree86 sessions,
    you will find WordPerfect Office 2000 menu available under the desktop panel''s
    Applications menu, as shown in Figure 11.6.


    # Trouble Launching Corel''s Office 2000?


    Despite the ease of installation, the Corel office suite will refuse to launch
    on a number of Linux distributions, such as Red Hat Linux, unless you prepare
    your system by performing a complex series of software package installations in
    a specific order using the rpm command. Probably the best advice is to install
