    touted announcements in early 2000 for bringing out DVD playing software for Linux,
    those products have yet to come to market.


    The good news is that there are projects aimed at developing Open Source DVD players
    for Linux and XFree86. If you''d like to learn how to play DVDs under Linux right
    away, read the OMS-HOWTO. The Open Media System (OMS) video'
