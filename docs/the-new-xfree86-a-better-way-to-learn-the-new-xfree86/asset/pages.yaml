  md: '# An Overview of Desktop Environments


    The objective of CDE was to provide a single, unifying desktop and set of APIs
    for developing graphical clients for the hodge-podge of commercial UNIX systems
    operating by members of The Open Group. How well CDE achieved this objective may
    be in doubt. However, although commercial developers may desire a single GUI for
    Linux to ensure some market success, the Linux and X user base have still not
    singled out a definitive GUI. The truth is that many users like the idea of having
    the freedom to choose a GUI, window manager, or desktop environment. The following
    sections discuss two of the most popular desktop environments: the K Desktop Environment
    (KDE) and the GNU Network Object Model Environment (GNOME).


    # The K Desktop Environment


    In 1996, a German Linux software developer Matthias Etrich introduced the K Desktop
    Environment (KDE) for Linux and XFree86. Since then, KDE has gone through several
    major revisions, with vast improvements included with every release. KDE is a
    graphical desktop environment that runs on a variety of Linux and UNIX systems
    and provides all the features of a modern graphical, networking computer interface.


    The suite of KDE clients grows weekly, and typical distributions include nearly
    200 or more KDE applications. The current stable version of KDE is 1.1.2; the
    anticipated version is 2.0, which is slated to include a full-featured office
    suite named KOffice, a C/C++ integrated development environment (IDE), and hundreds
    of clients. The current version of KDE uses a window manager kfm, which may be
    replaced with a client named konqueror.


    KDE is typically started from the command line or through an X11 display manager,
    or X graphical login. To start KDE from the command line using the startx command,
    you should insert the following into your .xinitrc file:


    ```

    startkde

    ```


    If you''re using the current stable version of KDE (version 1.1.2), after you
    start your X session you should see the desktop in Figure 5.15.


    KDE may be located under the /opt/kde directory or if you use Mandrake or Red
    Linux, integrated under the /usr/bin directory. Configuration files are stored
    in a sub True named .kde in a user''s home directory.


    One issue that could potentially cloud the appeal of KDE for developers is whether
    KDE is truly free. The source code for KDE is certainly free and open; what has
    been in question is whether or not the Qt software libraries—which provide the
    base set of development functions and APIs, which were developed by an independent
    company named Trolltech—are also free. Trolltech, the Free Edition of the Qt libraries
    for KDE are indeed free. However, unlike other software libraries'
