  md: '# Confused After Building from Source?


    New Linux and XFree86 users can become confused when switching between Linux distributions;
    likewise, users who are accustomed to a particular Linux distribution can become
    disoriented when building software from scratch. This is because every Linux distribution
    places configuration files under the same paths or includes the same versions
    of window managers. If you build fwm from using default settings and source code
    from its home page ("Resource Information" at the end of this chapter), you will
    find fwm installed under the /usr/local/bin directory with the name fwm2. However,
    fwm2''s system-wide configuration file will not be installed during the build.
    (You''ll need to copy the file manually from the source''s fwm2-2.2.4/extras/fvwmScript/Scripts/
    directory into a new fwm2 directory under /etc/X11, then edit the file for you.)
    The new version may also be three times the size of the installed version from
    your commercial distribution. Keep in mind that building and installing a window
    manager from scratch can often involve additional configuration tasks not required
    when using the same window manager installed from a commercial Linux distribution.


    dow controls, and provide support for loadable modules that can add window management
    features. The system-older fvwm configuration file is named system.fvwmrc, and
    is usually located under the /etc/X11/fvwm directory. Like this, your file may
    be copied as .fvwmrc and saved your home directory for per-user customization.
    The newer fwm2 window manager''s system-wide configuration file is named system.fwm2,
    and is found under the /etc/X11/fwm2 directory. It may be copied as .fwm2rc and
    saved in your home directory.


    As an example resource file change, you can customize the number of virtual desktops
    available for your X sessions when using fwm2 by editing the desktop section,
    which may look like this:


    DeskTopSize 2x


    This section defines the default number of virtual desktops, which appear in the
    desktop''s pager window, and which you can access by left-clicking on the appropriate
    square in the pager''s window. To add 12 more desktops, change the entry as follows:


    DeskTopSize 4x4


    When you restart fwm2, you''ll see a small grid of 16 desktops in the pager.'
