  md: 'The xfd client displays all the characters available in a specified font. X
    pointer curs also have designated names, and are defined in the cursorfont.h,
    found under the /usr/X11R6/include/X11 directory if you have installed support
    for X development on your system. This file lists a name for each character in
    the font. Use the character''s name and the xsetroot client with its -cursor_name
    option to change your pointer, like:


    ```

    # xsetroot -cursor_name pirate

    ```


    After you press Enter, your pointer will become a skull and crossbones. For a
    lighter touch, try the following command:


    ```

    # xsetroot -cursor_name gumbly

    ```


    To reset your cursor, use this command:


    ```

    # xsetroot -cursor_name X_cursor

    ```


    # Setting Pointers


    You can use the xset command to control the speed and threshold setting of your
    pointer. Simply use the m option and a single integer (to control acceleration)
    or a set of integers (to control acceleration and threshold) with the command,
    as follows:


    ```

    # xset m "1 6"

    ```


    After you press Enter, your pointer will move only a short distance relative to
    movements of your pointer device. On the other hand, you could use the following
    command:


    ```

    # xset m "30 10"

    ```


    After you press Enter, your pointer will rapidly jump from one end of the screen
    to another. To reset your pointer value, use the default option as follows:


    ```

    # xset m "default"

    ```


    You can put these xset settings into your system''s .xinitrc or .Xdefaults file
    to customize your X session


