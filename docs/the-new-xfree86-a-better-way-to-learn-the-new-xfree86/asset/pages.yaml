  md: 'This chapter provides an introduction to using X11 clients, X command-line
    options (known as X Toolkit options), and X resources, which were introduced in
    Chapter 7. Building on information that you''ve learned so far, the chapter aims
    to help you build expertise when using X clients from the command line.


    Understanding the options that you can use during your X sessions can help you
    build better, more efficient desktops with properly configured applications. Some
    of the issues discussed in this chapter are critical, especially if your system
    has limited real estate (for example, if your system''s resolution is less than
    1,024×768), and can help you overcome obstacles with client placement and organization
    on the root display.


    Free86 and the X protocol provide the user with a great deal of flexibility and
    control, and you''ll benefit from greater knowledge of this flexibility.


    # Understanding the X Toolkit Options


    One of the benefits of using X is standardization. One of the downsides of using
    X is nonstandardization. How can this be true? Although X provides the basic underlying
    protocol and drawing routines for creating interactive clients and a robust graphical
    networking system, there are few standards (if any) regarding how clients should
    provide menus or window decorations. But one standard shared by nearly all X clients
    using functions outlined in the Xt (X Toolkit) library: the ability of standard
    options that can be used to control the initial size and placement of windows,
    font usage, color, and as shown in the last chapter, resource settings.


    These options are available through resource files or the command line. This section
    demonstrates how to use X Toolkit command-line options.


    # Using the Command Line


    The Linux command line, known as the shell, offers quite a bit of power to the
    user. When you use the shell with special commands as filter programs, you can
    use the output of one command to feed the input of another command, and thereby
    build complex commands from a single command line. For example, to search and
    then mail matching files with a single command line, you can combine the output
    of the find command with the mail command as follows:


    ```

    # find . -name ''*.msg'' | mail -s "Message List" willie@tux.org

    ```'
  merge: -1
