  md: '# Chapter 17: Building X11


    his chapter covers building and installing XFree86 from source. You''ll learn
    how to download, decompress, and build the XFree86 4.0.1 distribution from scratch.
    Although few if Linux and XFree86 users perform these tasks, doing them can be
    informative and an integral part of the process of learning technical details
    about XFree86. The tasks are also necessary if a required patch or fix appears
    for the current distribution and you need to build a revised driver or server
    in order to use X11 on your new hardware.


    This chapter explains how to download the essential files and components of XFree86
    source distribution, and covers the elements required before you can build XFree86.
    Coverage is limited to XFree86 4.0.1, which was released July 3, 2000, and which
    presents a radically new architecture to support X with Linux.


    According to the XFree86 Project, the organization''s current work is focused
    on providing updates and fixes to the 3.3.6 series and adding new features to
    the 4.0-series. The next release of XFree86, according to http://xfree86.org/releaseplans.html,
    is to have version 4.0.2 “...available sometime in late 2000. The current version
    at the time of this writing is 4.0.1, and it is this new architecture that merits
    coverage instead of the older, multiserver distributions.


    # Installing XFree86 Development Components


    To build XFree86, you should have a working Linux development system installed
    on your computer. Ideally, you should use the same versions of software and libraries
    that the XFree86 Project, Inc., uses to build its distribution. However, in general,
    you will run fewer problems if you use a current GNU compiler, along with a set
    of current `include` files and software libraries.


    You''ll have even fewer problems if you''re merely installing a patch and rebuilding
    the current XFree86 distribution. In other words, try to match the development
    tools with the version of XFree86 currently in use. Although you can try, it may
    not possible to use an older Linux distribution, such as Red Hat 5.2, to host
    and build XFree86 4.0.1.


    Although XFree86''s documentation does not include specific references to recommended
    versions of development tools, it does refer to versions of free software development
    tools that should not be used. Although The Open Group X11R6.4, the base and source
    for XFree86 4.0.1, as “...the easiest to build yet,” the release has some pitfalls:


    ![](img/078622fac3fd61e5a0c895da1d3eff96_357_0.png)'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Installing XFree86 Development Components


    +   - Applying patches. If you need to customize a particular driver, apply the
    patch as directed. You''ll need the patch command and possibly the diff command.
    There will usually be some additional patches that you''ll want to apply before
    the build.


    +   - Configuration. You''ll need to configure the source for use with Linux.
    The configuration files include various flags (settings) that you need to specify
    before starting the build.


    +   - Compiling. According to The Open Group, you cannot use the GNU gcc compiler
    version 2.5, 25.1, or 2.5.2 to build the software. In addition, versions of Red
    Hat Linux includes a development version of the gcc compiler that may or not build
    portable binaries, even with compatible software libraries. You should probably
    use the latest stable version if possible. The compiler used to test the build
    for this chapter was gcc version 2.95.2, used under Mandrake Linux running kernel
    2.2.14-15mdk (Mandrake 7.0).


    +   - Other caves. You may have problems linking libraries if your Linux distribution
    has a broken runtime loader. The GNU make command is not compatible; the XFree8
    source includes a make command that will be built and using. According to The
    Open Group, the GNU as assembler and 1d linker are not supported or will not work
    for rebuilding X (although the build and resulting binaries worked fine on the
    test system for this chapter). New library names will be used by the rebuild server
    and X clients, even if you build a version commensurate with the installed version;
    the recommended approach, according to The Open Group, is to install the new libraries
    by symbolically linking the old library to the new one.


    # Downloading Source Archives


    You can obtain the source for XFree86 in a variety of ways. One of the easiest
    is to download the files via FTP from http://ftp.xfree86.org/pub/XFree86/4.0.1/source.
    You''ll find the following files:


    +   - FILES—list of all files in each archive


    +   - SUMS.md5—checksums of the files to ensure validity


    +   - SUMS.md5sum—checksums of the archives to ensure english


    +   - X401src-1.tgz—source to the XFree86 server, clients, documentation, libraries,
    and contributed clients


    +   - X401src-2.tgz—XFree86 fonts and font utilities


    +   - X401src-3.tgz—XFree86 hardcopy documentation


    +   - doctools-1.2.tgz—documentation creation tools'
