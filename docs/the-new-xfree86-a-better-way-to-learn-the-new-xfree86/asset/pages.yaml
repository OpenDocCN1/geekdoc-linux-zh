  md: '# Chapter 19: X11 Programming Toolkits Overview


    This chapter provides an overview of the various software libraries or toolkits
    that you can use when programming for X11. You''ll learn about some of the classic
    toolkits that have evolved over the last 10 years, and also get information about
    the newest and latest software libraries that you can use when developing clients.


    Choosing a toolkit to use for client development can be an important decision
    for reasons of ease of use, portability, features, and distribution. Literally
    hundreds of all toolkits offer the basics of creating and decorating windows on
    the X desktop, but some are easier to use than others and may offer additional
    features. Literally hundreds of special software libraries are available for X
    programmers. Many provide a set of convenient functions that you can use to create
    clients, whereas others provide special functions to aid in handling certain objects
    or events, such as graphic images, sound, network data, and other objects.


    This chapter starts with a basic description of the software libraries included
    with XFree86. You''ll learn about other libraries and development systems that
    you can install on your computer to aid you in developing clients that use these
    special libraries.


    # Classic Toolkits


    This section introduces the classic, low-level toolkits included with XFree86.
    These toolkits were developed following the start of the 1983 Project Athena,
    a joint research effort among the Massachusetts Institute of Technology (MIT),
    IBM, and Digital Equipment Corporation to devise a graphical networking system.
    That effort has evolved into X11R6, and is now under the auspices of X.org.


    You''ll find nearly all X11 software libraries installed under the /usr/X11R6/lib
    directory.


    # Xlib


    Known as the “assembly language” of X11, the Xlib software libraries contain functions
    that form the base of X11. As a common base, low-level, and main interface to
    X, Xlib provides explicit control over created objects such as windows, but'
  merge: -1
  pgno: 385
- img_proc: true
  md: '# Classic Toolkits


    requires more attention to detail regarding events such as keyboard presses and
    mouse clicks.


    The software functions provided by Xlib are contained in the files named libX11.*
    under the /usr/X11R6/lib directory. Programs requiring Xlib usually start with
    the following line:


    ```

    #include <X11/Xlib.h>

    ```


    This header file contains definitions, extensions, data structures, and C language
    interfaces to the library''s functions. Extensions to Xlib are contained in the
    files named libXext* under the /usr/X11R6/lib directory. Miscellaneous routines
    are contained in files named libXmu*.


    # Xt Intrinsics


    The X Toolkit Intrinsics library, libXt, features additional functions that use
    Xlib functions to provide enhanced drawing support. You can use this support to
    draw more complex objects known as widgets. In turn, libXt, like libX11, forms
    the base for creating additional toolkits.


    The software functions provided by libXt are contained in the files named libXt*
    under the /usr/X11R6/lib directory. Programs requiring libXt usually start with
    the following line:


    ```

    #include <X11/Intrinsic.h>

    ```


    This header file, like libXt X11.h, contains definitions, extensions, data structures,
    and C language interfaces to the library''s functions, which provide advanced
    event, error, memory, graphics, and text handling. You can use these functions
    to build a wide range of widgets, such as buttons or complex dialog boxes with
    multiple controls. You can usually recognize a libXt function by its name, especially
    if it begins with Xt*.


    # Athena


    As the base for additional toolkits, libXt is used to build additional widget
    sets. The best known of these is the Athena widget set, included with XFree86
    and Motif (discussed in the next section). The Athena libraries are found under
    the /usr/X11R6/lib directory. Their filenames start with libXaw*.


    The Athena toolkit contains the original set of widgets provided for X, its widgets
    are not as feature-rich as those provided by other toolkits based on libXt, such
    as Motif. However, using the Athena toolkit makes the job of creating simple


    359'
