  md: '# Chapter 2: Getting and Installing Xfree86


    # Windowing for Small Footprints


    If you need a windowing environment for your Linux system but have extremely limited
    amounts of system memory and hard drive space, consider trying Torsten Scherer
    and Eero Tamminen''s WLR4, an X11-like server and windowing system that also runs
    on Atari, Sun, and Intel-based PCs. The system includes 28 clients, with other
    graphical applications—such as a Web browser, a text editor, audio utilities,
    a drafting program, and network utilities—available for the system. The W server,
    wserver, is only 128KB, and most clients are less than 60,000 characters. Browse
    to http://www.students.tut.fi/~t150315/ to download W.


    today by X developers working to bring a graphical interface to Linux on Digital
    Assistants (PDAs).


    # Choosing a Graphics Card


    Many new XFree86 users install Linux on preexisting hardware, most likely an older
    home desktop PC or laptop. For laptop users, choosing a graphics card is moot
    point, as the graphics chipset is an integral part of the notebook and cannot
    be replaced. This is also true of some desktop PCs that have a video subsystem
    installed on the PC''s motherboard (although you can usually disable the video
    by installing a new card).


    If you''re not happy with your current desktop PC video and are looking to choose
    a new graphics card, you''ll be better informed by understanding the types of
    cards and chipsets supported by XFree86. Understanding graphics cards is also
    helpful if you''re looking to buy a new notebook.


    The older version of XFree86, version 3.3.6, supports a formidable list of graphics
    cards through the use of 12 servers. Each list lists each, along with the video
    card. This table can help ensure that you''re using the correct server for your
    card, and help you check for compatibility with your card.


    The new XFree86 4.0.1 replaces the previous architecture of the XFree86, which
    provided a server for a particular family of chipsets or video cards and included
    support for hundreds of cards with a single server. The new approach (due in part
    to work done by Metro Link, Inc.) uses loadable code modules and a single server.
    This framework provides a more flexible framework for adding support for new graphics
    cards.'
