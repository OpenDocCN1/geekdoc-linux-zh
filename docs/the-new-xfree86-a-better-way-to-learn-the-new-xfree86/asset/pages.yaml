    # # Feature Overview of the New Xfree86


    This book is about the version of X distributed by the XFree8 Project, Inc., and
    known as Xfree86. Why Xfree86? This collection of software provides X, is free,
    and is focused on Intel-based PC platforms. This does not mean that you wont'
