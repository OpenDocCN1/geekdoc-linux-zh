- img_proc: true
  md: 'Even grant that today''s PCs are getting faster and more capable, and that
    many users now have access to broadband technologies such as DSL, some of these
    games are still out of play for many PCs still in use. On the other hand, if you
    want to play some of the hottest first-person, 3D real-time arcade or strategy
    games, you''ll find many of those listed in Table 13.1 quite up to snuff.


    This section covers a number of commercial arcade and strategy games for Linux
    and X. If you''re interested in any of these games, try downloading a demo first.
    But be warned: Although most demos are in the 50–60MB download range, some, such
    as SimCity 3000, require more than 180MB just to install the compressed archive.


    # Strategy Games


    Commercial strategy games have traditionally been board games or simulations.
    However, in the last few years, the difference between animated arcade games,
    or role-playing games, and simulations has blurred. Today, a number of quite sophisticated
    strategy games are on the market. This section covers sampling of these new games
    for Linux and XFree86.


    # Call to Power


    Civilization: Call to Power, or CivCTP, is a strategy civilization game in which
    the object is to wisely guide the growth of your civilization through thousands
    of years in speed-up time. This game requires more than 400MB hard drive space,
    and an X display of least thousands of colors. As is for nearly all games discussed
    throughout the rest of this chapter, installation is script-driven and automatic.


    After installation—which can take nearly 10 minutes, depending on your CD-ROM
    drive''s speed—you can start the game as follows:


    ```

    # civctp

    ```


    After you press Enter, you''ll see a splash intro movie. You can then choose the
    type of civilization and its initial ruler before launching into the simulation,
    as shown in Figure 13.24.


    # SimCity 3000


    SimCity 3000 is an amazing city simulation and strategy game. Over the years,
    the popular SimCity series of computer games has grown in sophistication, but
    you have to see this product''s details to fully appreciate the game. You can
    actually see people walking around your city when you play this game, and the
    level of detail is quite astonishing.


    Game play is typical of other simulations as shown in Figure 13.25, which is a
    shot of a demo version of the game.'
