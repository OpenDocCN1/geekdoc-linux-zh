  md: '# Configuring the Window Maker Window Manager


    Window Maker, originally by Alfredo Kojima, is an improved version of the After-Step
    window manager. In its latest version, Window Maker now provides for graphical
    configuration, an application and workspace dock, theme support, keyboard support,
    virtual desktops, and window animation, and internationalization support for different
    natural languages.


    The actual filename of this window manager is wmaker, and in some Linux distributions
    its system-wide configuration files are located under the /usr/X11R6/share/WindowMaker
    directory. If you want to build and install this window manager from scratch,
    you''ll need to download the following files:


    +   - libPropList-0.10.1.tar.gz, a special software library that provides data
    structures and lookups

    - WindowMaker-0.62.1.tar.gz, the source to Window Maker

    - WindowMaker-extra-0.1.tar.gz, which provides themes, icons, and other utilities


    Building and installing Window Maker is quite simple. You simply enter the following
    commands:


    ```

    # tar xvzf libProp*; cd libProp*;; ./configure; make install

    # tar xvzf Windo*62*.gz; cd Window*; ./configure; make install

    # tar xvzf Win*extra*.gz; cd extra*; ./configure; make install

    ```


    After building and installing Window Maker, you may need to run the wmaker.inst
    command as follows:


    ```

    # wmaker.inst

    ```


    The GNUUserStep subdirectory in your home directory will be created to hold your
    personal settings, whereas the /usr/local/share/WindowMaker directory contains
    backgrounds, icons, graphics files, style and theme subdirectories, along with
    configuration and startup scripts. You can then start up wmaker from your .xinitrc
    file as:


    ```

    exec wmaker

    ```


    In past versions, you had to edit the file WMRootMenu in the GNUUserStep/Defaults-directory
    in your home directory. However, using Window Maker''s root menu, as shown in
    Figure 16.19, you can change the appearance of your desktop to a specific background,
    style, or theme. You can then save the custom appearance as your own theme.


