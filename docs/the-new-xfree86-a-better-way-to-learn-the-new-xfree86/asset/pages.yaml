    After you press Enter, you can use your USB mouse at the Linux text console. If
    you load the module keydev.o right after the mousedev.o module, your USB keyboard
    should start working right away. Another way to verify that the modules have loaded
    is to the lsmod command, as follows:


    ```

    # /sbin/lsmod

    ```


    | Module | Size | Used |

    | hid | 11516 | 0 (unused) |

    | usb-uhci | 21604 | 0 (unused) |

    | usbcore | 42760 | 0 [hid usb-uhci] |

    | mousedev | 3724 | 0 (unused) |

    | input | 2908 | 0 [hid mousedev] |


    Manually loading kernel modules is one way to add USB support. You''ll find that
    newer Linux distributions from vendors such as Red Hat, Mandrake, SuSE include
    USB startup scripts under the /etc/rc.d or /etc/rc.d/init directory. When doubt,
    follow your distribution''s documentation and use any graphical administration
    tools (such as mouseconfig or yast) to add USB support. Note that you''ll still
    need to edit your X86Config files for now, as many of these tools do not automatically
    update the X configuration file!


