  md: '# Virtual Networks


    For example, start the Xvnc server on a remote computer running Linux on your
    LAN like this:


    ```

    [green]$ vncserver -geometry 800x600

    ```


    New ''X'' desktop is green:1


    Starting applications specified in /home/bball/.vnc/xstartup

    Log file is /home/bball/.vnc/green:1.log


    As you can see, you can use geometry settings to determine the initial desktop
    size. The Xvnc server starts, and the "virtual" session is assigned a display
    name. A file named xstartup under the .vnc directory of the remote computer determines
    the virtual X session, and will automatically be created when you first use Xvnc.
    This file may look like this:


    ```

    #!/bin/sh

    xrdb $HOME/.Resources

    xsetroot -solid grey

    xterm -geometry 80x24+10+10 -ls -title "$VNCDESKTOP Desktop" &\ntwm &

    ```


    The startup script shown here will read first in any session preferences from
    your .Xresources file, then set the root display color, the xterm client, and
    then launch the twm window manager. To view this remote session, enter the vncviewer
    command along the name of the remote display, like this from a different computer
    on your LAN:


    ```

    $ vncviewer green:1

    ```'
