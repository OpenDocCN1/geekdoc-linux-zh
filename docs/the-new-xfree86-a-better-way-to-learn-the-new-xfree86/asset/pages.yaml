    # # Using and Configuring gdm


    The gdm client is part of the GNOME libraries. Like kdm, gdm provides a graphical
    login to Linux and X. This client, which actually launches the gdlogin client,
    may be specified in your system''s /etc/initab file or in a gdm-specific configuration
    file. The client will then be launched automatically at the start of the proper
    runlevel for multiuser user mode and X. The examples used in this section apply
    to Red Hat Linux.


    Another way to boot Linux directly to a gdm login on Red Hat Linux-based systems
    is to edit /etc/initab directly and use a gdm-specific entry for runlevel 5. Open
    the file, then look for the default entry, which looks like this:


    ```

    x:5:respawn:/etc/X11/prefdm -nodaem

