  md: '# Chapter 15: Configuring the X11 Display


    with a screen ID and position information or a placement keyword to specify which
    display to place where in relation to the main display. The ServerLayout section
    uses information derived from at least two "Screen" sections.


    For example, to define a layout named "Dual-head" the monitors by side by side
    with the LCD on the left, create a ServerLayout section like this:


    ```

    Section "ServerLayout"


    Identifier "Dual-head"


    Screen "Screen 0" LeftOf "Screen 1"

    Screen "Screen 1"


    InputDevice "Mousel" "CorePointer"

    InputDevice "Keyboard1" "CoreKeyboard"

    EndSection

    ```


    This layout creates a contiguous display in which you can draw windows or active
    clients across a virtual border between the monitors. After editing your XF86Config,
    start your X session using the startx command. You will also need to use the +xinerama
    command-line option as follows to enable your layout:


    ```

    # startx --+xinerama

    ```


    Your XF86Config file can have multiple ServerLayout sections. For example, if
    you simply want a simultaneous display instead of a contiguous display between
    monitors, use a layout like the following:


    ```

    Section "ServerLayout"


    Identifier "Simultaneous"


    Screen "Screen 0"

    Screen "Screen 1"


    InputDevice "Mousel" "CorePointer"

    InputDevice "Keyboard1" "CoreKeyboard"

    EndSection

    ```


    In this example, both monitors will display the same X session at the same time.
    You can choose which layout to use by using the X server''s -layout command-line
    option, along with the layout''s name, as in either of the following examples:


    ```

    # startx --+xinerama -layout Dual-head

    # startx --+xinerama -layout Simultaneous

    ```'
