  md: '# Configuring the K Desktop Environment


    Version 1.0 of the K Desktop Environment (KDE) for Linux and X was released in
    July 1998. Since then, KDE has become one of the most popular desktop environments
    and suite of X clients for XFree6 and Linux. KDE and its host of accompanying
    programs have features not supported by legacy window managers. Some of these
    features include session management, Network Transparent Access (NTA) (which allows
    the user to drag and drop files via remote lists), mounting of filesystems with
    a mouse click, graphical control of window hints, sounds for system events, sticky
    buttons (which place an instance of a single client on each virtual desktop),
    and a pop-up command-line interface (CLI). This section introduces configuration
    tips for managing logins, managing the desktop''s panel, and graphically configuring
    KDE using the KDE Control Center.


    # Using kdm


    As you already know, to configure the X display manager (xdm) for use, you edit
    /etc/initab file, or initialization table. The entry in initab boots Linux to
    a multi-user X session might look like this:


    ```

    id:5:initdefault:

    ```


    However, other Linux distributions, such as SuSE, may use a different run-level,
    such as the following:


    ```

    id:3:initdefault:

    ```


    Note that in this example, most Linux uses run-level 3 for a multi-user X session.
    The other required entry in your initab file specifies a display manager for the
    run-level and manages logins. A corresponding run-level entry (such as for Red
    Hat Linux) will look like this:


    ```

    x:5:respawn:/usr/bin/X11/xdm -daemon

    ```


    # KDE in Transition


    At the time of this writing, KDE 2.0 had just been released. A long-awaited sequel
    to the previous 1.1.2 stable version, KDE 2.0 introduces new software libraries,
    many updated clients, and a new window manager, and fledgling office suite. For
    all discussions regarding KDE, this book refers to KDE 2.0 even though many readers
    may still be using the older version.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_330_0.png)'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Chapter 16: Window Manager Configuration


    Use KDE''s display manager instead of xdm, change the entry and specify the correct
    path to the kde client, as follows:


    ```

    x:respawn:/usr/bin/kdm -nodaemon

    ```


    When you restart Linux, the kde client will then manage logins to your X sessions.
    If you would like to try kdm before committing your system to a particular run-level,
    you can also (as root) use kdm from the text-only console as follows:


    ```

    # kdm -nodaemon

    ```


    After you press Enter, the screen will clear and you''ll see a kdm login window.
    You can manage kdm via the KDE Control Center (see the following section, "Using
    the kcontrol Client")


    Make sure that you have correctly configured Free86 to work with your system''s
    initialization table before you edit your system. If you find that your system,
    rebooting, alternately flashes a black screen and tries to run X, there''s a problem.
    If this happens, press Ctrl+Alt+Del to reboot your system, then enter the kernel
    argument linux in the LILO boot: prompt to reboot Linux into single-user mode.
    You can then undo any changes made to your initab file or fix the problem (which
    could range from a bad X86Config file to an incorrect entry in .xinitrc file).


    ![](img/078622fac3fd61e5a0c895da1d3eff96_331_0.png)


    # Using the kcontrol Client


    The KDE Control Center, named kcontrol, is a graphical utility to control many
    different aspects of a KDE session. Table 16.1 lists the controls that this client
    provides.


    Click the application starter button on your panel, then click the Control Center
    menu item. The client will appear as shown in Figure 16.1.


    For example, to change settings for kdm''s login display, users, and sessions,
    click the System list in the kcontrol window. Next, click the KDE Manager in the
    drop-down list. Note that you must be running as root in order to change any of
    these settings. The Login Manager dialog box appears as shown in Figure 16.2.


    You can change the greeting text, show a custom logo, display the time, and alter
    language and country settings for the display. To change fonts, the background,
    or user access, to add or remove X session types from the kdm login screen, click
    on the appropriate tab in the dialog box.'
