  md: '# The Resource Database


    You can also set systemwide resources on a per-server basis by using the xrdb
    client. This client is usually run from the Xsession script (found under the /etc/X11/xdm
    directory) and may be used to read resource information from a variety of sources.
    On a Mandrake Linux system, two sources are a file .resources under the /usr/X1R6/lib/X11/xinit
    directory or your home directory''s .resources file. Under Red Hat Linux, two
    sources are /etc/X11/Resources or your home directory''s .resources file.


    You can then copy, paste, and save these settings in your .defaults file. Subsequently,
    each time that you launch xclock, it uses the new resources.

    You''ll have to decide whether it is easier to use the editres client, to preference
    menus in newer X clients for KDE and GNOME, or to edit resource-setting text files.
    On the one hand, providing resource settings outside of a client can reduce the
    client size. On the other hand, providing comprehensive graphical interfaces for
    preferences can be overwhelming and lead to “code bloat,” especially if a client
    is used for a single purpose.


