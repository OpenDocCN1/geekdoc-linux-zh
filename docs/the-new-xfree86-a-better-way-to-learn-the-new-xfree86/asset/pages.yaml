    # # Configuring Screensaving


    KDE 2.0 comes with 27 different screensavers that you can set up and test using
    the Screensaver list item from kcontrol’s Look & Feel function.


    > You don''t have to launch kcontrol to configure or activate settings for your
    KDE sessions. You can also select the panel''s Preferences menu item followed
    by an appropriate menu item to change various settings.


    The Screensaver dialog box, as shown in Figure 16.8, offers a scrolling list of
    screensavers along with Setup and Test buttons and a sliding control for Priority
    settings. The Priority settings should always be set to Low, especially on a multi-user
    system.


    If you click the Require Password check box, KDE will require you to enter your
    password before returning from a screensaving session. Unfortunately for fans
    of the earlier version of KDE, it is no longer possible to set up special active
    “hot corners” of the display to turn on screensaving immediately.


