    Some general pointers on security include the following:



    +   - Check your xhost settings and always reset them.

    - Regularly upgrade your software to include bug and security fixes; periodically
    check the home pages for your distribution, and check the XFree86 security pages
    for updates.

    - Limit physical access to your network, protect passwords, and ensure that passwords
    are changed regularly.

    - Protect open ends of your network using firewalls, and disable unneeded services
    (usually listed in inetd.conf or /etc/xinetd).

    - Limit shell or dial-in access; unless remote administration is really needed,
    consider alternatives that allow limited access.

    - Edit your /etc/hosts.deny and /etc/hosts.allow files. Fortunately, all Linux
    distributions use TCP wrappers, so you should edit these files nevertheless.

    - Regularly check system logs.


    # Troubleshooting


    Most problems with remote execution of clients under X involve the incorrect use
    of $DISPLAY variables, the -display option (specifying an incorrect hostname,
    display, or screen number), and permissions involving the xhost command.'
