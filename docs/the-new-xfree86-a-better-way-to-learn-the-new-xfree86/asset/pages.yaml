  md: '# Chapter 3: Configuring XFree86


    This chapter covers configuration of XFree86 for Linux. Configuring X during system
    installation can still be a frustrating and debilitating process even though Linux
    installation methods and system software tools have vastly improved and matured
    over the last eight years. X configuration is no integral part of the install
    process for a majority of Linux distributions. When everything goes right, automatic
    and correct configuration of X for your computer''s graphics card during an install
    is a wonderful thing. But when probing of your graphics hardware returns wrong
    values, or the software tools fail to return proper settings, you''ll need to
    resort to other methods to get X working properly on your computer.


    This chapter arms you with information about the arsenal of X configuration tools
    available in your Linux system. Until computer manufacturers realize the value
    of properly supporting Linux and X on desktop PCs, you''ll need this information
    to overcome obstacles in your path to a working system. Commercial operating systems
    have the advantage of holding hardware and software developers hostage in monopolistic
    industry. For this reason, Linux users, as a group of computer users recognizing
    the merits of free and Open Source software, have to overcome the limitations
    imposed by a closed system of proprietary hardware and software.


    The good news is that these efforts succeed; today, ever-increasing numbers of
    hardware and software developers understand the merits of open specifications,
    which have led to increased cross-platform compatibility, improvements in software
    design and execution, and widespread increases in the use of graphics systems.
    It no longer makes sense to introduce or support a product limited to a single
    market or platform; hardware manufacturers are beginning to realize the merits
    of its opening up specifications, which leads to increased support, and in many
    cases better performance, from existing designs.


    Several of the XFree86 configuration tools described in this chapter are universal
    among XFree86 distributions. Others, such as Xconfigurator, SaX, and Xfrake, are
    tools developed for a specific distribution (in these cases, Red Hat, SuSE, and
    Mandrake Linux, respectively).


    # Choosing a Configuration Tool


    The choice of a configuration tool is normally a personal preference. Every XFree86
    software configuration tool has one specific purpose: to generate an accurate,
    working-XFree86 configuration file named XF886conf. This file is parsed when X
    starts and contains essential information needed to provide a proper display.'
  merge: -1
