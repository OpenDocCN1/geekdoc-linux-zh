    # Pointer Issues


    The typical pointing device labeled for X is a three-button mouse. In this configuration,
    the mouse buttons are labeled (with right-handed bigotry) left, middle, and right,
    or 1, 2, and 3. The right button, or mouse button 3, usually used to bring up
    a menu of information about an object, or to display information about an item.
    You''ll notice this behavior if you right-click on an icon or a blank area of
    the root display.'
