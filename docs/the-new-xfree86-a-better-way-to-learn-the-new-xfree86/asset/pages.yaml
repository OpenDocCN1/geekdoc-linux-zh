  md: '# Setting the Display Background


    The KDE and GNOME desktop environments have distribution-specific tools that you
    can use to set the background, or root display. When you use a simpler window
    manager or a less complex X session, use the xsetroot command to change the color
    of the root display or to place an image in the root display. This client works
    from the command line of an X terminal window, and you can use xsetroot, like
    many clients, for effect on a local or remote display.


    For example, to set the background of your root display to light blue, use the
    xsetroot command and its -solid option as follows:


    ```

    $xsetroot -solid lightblue

    ```


    After you press Enter, the background will become light blue. The color name derives
    from the RGB database, and should be listed in the file rbg.txt under the /usr/X11R6/lib/X11
    directory. You can also specify a patterned background using the -bitmap option
    followed by the pathname to an X bitmap file, as follows:


    ```

    $xsetroot -bitmap /usr/X11R6/include/X11/bitmaps/escherknot

    ```


    After you press Enter, your display will look like that shown in Figure 10.2.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_199_0.png)


    Figure 10.2 The xsetroot client can change the background color of your root display
    or place a bitmap in the background.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'The xsetroot command is only one of many different clients you can use to display
    images in your root window. Read the man pages for the xv, xli, xpmroot, xscreensaver,
    bseroot, and display clients. You can use these clients to display nearly any
    type of graphic image, including animations, in your desktop.


    # Receiving Mail Notification


    You can use the xbiff client to notify you when electronic mail arrives in your
    inbox (most likely the file with your username under /var/spool/mail/directory).
    This client, a latter-day counterpart of the console-mode biff command, is typically
    launched automatically when an X session starts, and is positioned in an out-of-the-corner
    of the desktop. xbiff can use most X Toolkit options, but it also recognizes several
    other helpful options, such as the following:


    +   - file path, where path is the complete pathname to the user''s mailbox file

    - update n, where n is how often (seconds) to check for new mail

    - -volume %, where % is a loudness level between 0–100 for the notification bell


    For example, you can run xbiff like this:


    ```

    # xbiff -update 15 -volume 100 -geometry 100x100 mailbox with a blue background
    -fg white -bg &

    ```


    After you press Enter, a 100×100-pixel mailbox with a blue background will appear
    in the upper-left corner of your display, as shown in Figure 10.3.


    When you receive mail, you''ll hear a loud beep, the mailbox handle (flag) will
    pop up, and the image will be reversed, as shown in Figure 10.4.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_200_0.png)


    Figure 10.3 The xbiff client monitors your system''s mailbox.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_200_1.png)


    Figure 10.4 "You''ve got mail!" the xbiff way!'
