    Figure 13.15 The invaders client is a retro-classic game of intergalactic dueling.


    # Falling Blocks with tetrix


    The game of Tetris caused a sensation when it first appeared on the IBM PC in
    the mid-1980s by Vadim Gerasimov ported Alexey Pazitnov''s falling blocks game.
    Next appearing on the Apple II, the game of Tetris soon spawned an immense legion
    of users, and a sad, 10-year story for its inventor, who received nearly nothing
    for his work while British, U.S., and Japanese companies reaped a fortune.


    This version of the falling blocks game uses the traditional h, l, j, and k keys
    and the spacebar for left, right, clockwise, counterclockwise, and dropping movement
    of the falling piece. Start tetris from the command line of a terminal window
    as follows:


    ```

    # tetris &

    ```


    After you press Enter, you''ll see an initial window; press the New Game button
    to begin, as shown in Figure 13.16.


