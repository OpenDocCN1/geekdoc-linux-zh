  md: '# Chapter 2: Getting and Installing XFree86


    # Getting Support


    If you have an older card (at least two years old), you usually get XFree86 to
    work with your card using the 16-color XF86_VGA16 or monochrome XF86_Mono servers.
    If you have a newer card, browse to your card''s manufacturer Web site and look
    for links to support or driver downloads. The new XFree86 4.0 architecture enables
    card manufacturers to release binary-only drivers (loadable modules) to provide
    support for a new product. Although many Source pundits will avoid purchasing
    a card that relies on proprietary drivers, the good news is that many card manufacturers
    are releasing information to the XFree86 developers.


    Some of the manufacturers providing support for Linux (at least in the form of
    FAQs, links, or other information) and X11 include ELSA, S3, Inc., Matrox, 3dfx,
    Interactive, Inc., and ATI Technologies, Inc. Some manufacturers provide custom
    servers, others will point you in the right direction.


    Other sources of support include SuSE, Inc., which has a program of developing
    specialized servers for a variety of cards, and including support in its distributions
    for specialized or newer cards. In general, if you have one of the latest and
    greatest graphics cards, don''t expect support for Linux right away. Although
    this situation is getting better every year, you need to:


    +   - Understand legacy graphics cards are generally supported, but may not be
    supported by the latest version of XFree86. The XFree86 release notes and documentation
    regarding chipset support.


    +   - Keep in mind that the support will be for the best-selling and most popular
    cards that have been on the market for at least 18 months. The market will demand
    support, and you should always let the manufacturer know about your needs for
    Linux support (if the manufacturer does not support Linux as a matter of policy,
    vote with your pocketbook).


    +   - Realize that latest and greatest video card may not be supported away. Again,
    you may have to vote with your pocketbook, but at least let the manufacturer know
    about a missed sale.


    +   - Choose the proper card for your needs. If you plan to play graphics-intensive
    games, you may need to install additional support libraries and use a 3D-capable
    graphics card.


    # Choosing an Archive Source


    The easiest way to install XFree86 is from a Linux distribution''s CD-ROM. You''ll
    find the XFree86 files packaged in the same format as other software packages
    in the distribution. For example, Red Hat, Mandrake, Yellow Dog, Caldera OpenLinux
    and'
