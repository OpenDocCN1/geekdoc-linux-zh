  md: '# Essential Files 65


    When you use xfs on a standalone Linux workstation, you can replace the entire
    list of FontPath entries listed in your XF86Config file with a single entry:


    FontPath **unix:/7100**


    This entry corresponds to the workstation hostname (localhost in this example,
    as the field is blank) and port number. Other Linux distributions may use the
    following entry:


    FontPath **unix:-1**


    Note that the preceding example also works for localhost. Typically, a system
    initialization script starts the xfs font server. Under Red Hat Linux-based systems,
    this is the xfs script under the /etc/rc.d/init.d directory. You can start the
    server as follows:


    ```

    # /etc/rc.d/init.d/xfs start

    ```


    If your system doesn''t use an initialization script for xfs, you can start the
    font server before starting your session as follows:


    ```

    # xfs &

    ```


    After you press Enter, the server begins running.


    You can also access the fonts by a server running on a remote computer on your
    network. To do this, use the xset client to add fonts from a remote server to
    the current display''s FontPath. For example, use us''s +fp option, along with
    the name of a remote server, as *thinkpad.home.org:


    ```

    # xset +fp unix/thinkpad.home.org:7100

    ```


