    # # The Enlightenment Window Manager


    The Enlightenment window manager, like AfterStep, was first based on another window
    manager (fvwm2), but the similarity ends there. Completely revised, Enlightenment,
    also known as E, is one of the new breed of X window managers. Although Enlightenment
    is quite complex, it offers an amazing variety of features. This window manager
    (shown in Figure 5.6) was one of the first to take advantage of the GNOME software
    libraries, which provide many unique features but overall consistency in X clients.


    Enlightenment includes a floating desktop manager, xv. The window manager takes
    familiar features of docking, taskbars, virtual desktops, and menuing to dazzling
    extremes. After AfterStep, Enlightenment keeps its defaults in numerous files,
    with systemwide settings under the /usr/share/enlightenment directory. User settings
    are located in a user''s home directory in a subdirectory named .enlightenment.


    You can launch this window manager, like others, using the startx command if you
    include the following in your home directory''s .xintrc file:


    ```

    enlightenment

    ```


    When X session starts, the Enlightenment desktop appears (the desktop should look
    similar, but not quite the same, as shown in Figure 5.6).'
