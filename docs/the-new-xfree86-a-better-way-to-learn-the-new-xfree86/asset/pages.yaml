  md: '# Using Cygwin


    Cygwin XFree86 distribution, whose current version is 4.0.1, is for the Win32
    platform. This means that if you use Windows 95, 98, NT 4.0, 2000, or Me, you
    may be able to use XFree86. You''ll need to download quite a bit of software and
    follow numerous steps, but the effort is worthwhile.


    First, download the file SETUP.EXE from the Cygwin site or a mirror (see "Resources
    Information" at the end of this chapter). Next, run the program and follow the
    dialog boxes to choose a directory, connection type, and source for the download.
    After the download is complete, again SETUP.EXE to install the Cygwin toolset
    on your Windows computer. Although the download of 45MB of software can take a
    while, the initial install takes only a minute or so. After installation, a directory
    named cygwin, with nearly 370MB of files, will be installed on your C drive. You''ll
    be able to use a bash shell under Windows (as shown in Figure 23.13), and many
    of your favorite GNU software tools will be available for use.


    # Windows 9x Users Left Out?


    Cygwin XFree86 project is in flux. Although earlier versions worked with Windows
    9x, and despite the information provided at the Cygwin Web site, the current version
    may work only for Windows 2000 and NT 4.0 and ME. You''re interested in using
    Cygwin''s port of XFree86, check the site http://www.cygwin.com regularly for
    updates, as development on this project is active and new versions are being worked.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_451_0.png)


    | free.exe | pdbash.exe | winfo.exe |

