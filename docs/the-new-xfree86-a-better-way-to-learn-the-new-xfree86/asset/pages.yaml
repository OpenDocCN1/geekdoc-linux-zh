  md: '# Examining Essential Files


    To build a new version of XFree86, you must have a Linux development system installed
    on your computer. Although having a previous version of XFree86, or at least a
    previous version of the X11 development files, installed on your system will help,
    you won''t be able to do anything without a proper C compiler, linker, loader,
    and associated support files.


    After decompress the source to XFree86, you''ll find every file under a new xc
    directory. At the base of this directory are several essential files:


    +   - INSTALL.PS—a PostScript version of INSTALL.TXT

    - INSTALL.TXT—Kaleb Keithley’s “Building and Installing X11R6.4,” a must-read
    before attempting to build XFree86

    - Makefile—the overall Imfile for building XFree86

    - LABEL—copyright information and names

    - RELNOTES.PS—release notes concerning XFree86

    - RELNOTES.TXT—a template for reporting bugs or other problems

    - registry—documentation describing internal symbols that XFree86 uses to identify
    such things as organizations, key symbols, protocol names, vendors, extensions,
    host families, property names and types, and fonts


    The base source is installed in the following subdirectories under the xc directory:


    +   - config—a directory of configuration files used during the build to determine
    specific host platform features or hardware

    - doc—documentation files, distributed in a compressed PostScript format or in
    a markup format

    - exports—header(include) files, along with X11 bitmap and pixmap graphics and
    the X11 software libraries

    - extras—additional font and graphics library support, such as FreeType, TrueType,
    Mesa rendering, and the Xpm libraries

    - fonts—XFree86’s font distribution

    - include—#include files

    - lib—source to the X11 software libraries

    - nls—additional fonts

    - programs—source to the X and the suite of XFree86 clients

    - util—various software utilities, such as compress and patch'
