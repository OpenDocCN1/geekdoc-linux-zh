  md: '# Initial Considerations


    15


    most of today''s computers have separate video and system memory (although some
    computers on the market have motherboards that, almost like those from the earlier
    era, used shared video and system memory).


    Video RAM on your graphics card or in your graphics chipset is used to draw pixels
    on your monitor. Many notebooks on the market today sport at least 2MB of memory,
    enough to provide thousands of colors at 1,024×768. For example, if one byte of
    memory is needed to display one of 256 colors per pixel, then a 1,024×768 display
    requires 1,024×768, or 786,432 bytes of storage. If two bytes are required to
    display thousands of colors, then the requirement doubles to 1,572,864 bytes.
    However, trying to use millions of colors at that resolution would require 2,359,296
    bytes and exceed the capacity. Therefore, many notebooks that can provide millions
    of colors do so at a resolution of 800×600 (which requires only 1,440,000 bytes).
    However, consider notebook chipsets, as those from NeoMagic, 2.5MB of RAM, which
    provides enough memory for displays of millions of colors at 1,024×768.


    You should also know that having a lot of video RAM won''t help provide you with
    a higher resolution unless your monitor supports the display. Many monitors have
    limited resolutions; for example, most (but not all) 15-inch monitors support
    resolutions of only 1,024×768.


    Aside from graphics issues, there are other important reasons for carefully assessing
    your system''s RAM when using Free86. Even though most computers are equipped
    with a base 4MB of RAM, you may want to consider adding more (perhaps an additional
    64MB) for memory-intensive clients at the same time. Although Free86 3.3.6 will
    run on a system with 16MB RAM and use 4MB of swap space, these are considered
    minimum memory requirements for a system.


    # Hard Drive Requirements


    The amount of hard drive storage required for a base Free86 installation can vary,
    depending on whether or not you choose to install the X11 development libraries,
    additional support libraries, and higher-level desktop suites such as GNOME and
    the K Desktop Environment. If you''re going to use only Free86, the hard drive
    requirements are rather modest—the initial compressed distribution comprises 25
    files and is about 25MB.


    Even if you include many additional clients, development libraries, man pages,
    and window managers, a full X11 installation may require only 150MB of hard drive
    space. It is when hard drive space is at a premium that shoe-horning a X install
    onto a tiny file system can be a problem. This is the type of obstacle faced'
