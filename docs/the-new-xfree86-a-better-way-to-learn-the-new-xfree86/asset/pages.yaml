  md: '# Chapter 12: X11 Multimedia Clients


    # Sound Players


    There are many different types of sound players for Linux, but few for X11, unless
    you count some of the more esoteric sound editors such as the sd client. Most
    sound players for Linux are command-line utilities, and the most common is the
    sox command with its symbolic link, the play command. This command is typically
    used to play a .wav file, as in the following example:


    ```

    # play /usr/share/sndconfig/test.wav

    ```


    # Audio CD Players


    Some of the most popular sound clients for X are audio CD players. There are number-ber
    players, but the newer ones have some interesting features.


    # xplayed


    Again, one of the oldest graphical audio CD players for Linux is Olav Woelfelsnei-der''s
    xplayed client. This client, shown in Figure 12.16, provides the basic audio CD
    title, track, author CD controls, but also includes a remarkable feature: You
    can drag and drop the track number buttons to reorder the audio play order.


    # ksed


    If you''re a KDE fan and have access to the Internet, you can use the ksed client
    not only to play audio CDs, but also to retrieve automatically the CD title, track,
    author, and track titles. This network-aware client, shown in Figure 12.17, features
    button controls and a number of configuration dialog boxes that you can use to
    change the number of Internet music databases searched or the appearance of the
    client''s window (such as the background or foreground colors).


    You can use this client to build gradually a local database of all your audio
    CDs or even to contribute information about an obscure CD to the Internet databases.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_247_0.png)


    Figure 12.16 The xplayed client is an early version of a graphical audio player
    for X and Linux.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Audio Clients


    ![](img/078622fac3fd61e5a0c895da1d3eff96_248_0.png)


    Figure 12.17 The kaca client not only plays CDs, but also searches the Internet
    for and title information about your CD.


    # .mp3 Players


    The latest audio rage in music seems to be the .mp3 audio format. All the music
    industry aside, this audio format has become the de facto standard for compressed
    digital-quality audio files. You''ll find a number of .mp3 or MPEG audio players
    available for Linux and X. The command-line version for non-X users is the mpg123
    command, which you can use to play one or more audio files as:


    +   * mpg123 *.mp3


    After you press Enter, the player loads the first of any found files and starts
    playing them through your computer''s sound system. The premier graphical audio
    player for X is the xmms client. This client, shown in Figure 12.18, features
    a graphic equalizer, a playlist editor, and the ability to use different audio
    and visual plug-ins.


    Another great feature of this client is that you can minimize it to occupy very
    little space on your screen without losing any of the client''s controls. This
    feature alone endears this client to Linux and X laptop users. However, if you
    enable the equalizer and visual plug-ins, as shown in Figure 12.19, this player
    can take up a lot of your display.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_248_1.png)


    Figure 12.18 The xmms .mp3 player client for X has many different features, including
    a graphic equalizer.'
