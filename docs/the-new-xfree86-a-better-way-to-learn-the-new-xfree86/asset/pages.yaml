  md: '# Chapter 21: Using Qt and KDE


    To use KDE, your system should have an installed base of C and C++ development
    tools such as g++, GNU make, Perl, autoconf, automake, flex, and, of course, the
    KDE and Qt development libraries. The current version of KDE at the time of this
    writing, 1.3, also requires the Qt libraries version 1.42 or 1.44 (a newer KDev
    will probably be available by the time that you read this book).


    You can start KDE from KDE''s desktop panel, or through a terminal window as:


    ```

    # kdevlop &

    ```


    You can also specify a project name like:


    ```

    # kdevlop myproject.kdevprj

    ```


    If you''d like to have KDE run through its setup procedure (to check for other
    installed utilities to enable additional features), use its --setup feature as
    follows:


    ```

    # kdevlop --setup

    ```


    If you start KDE by itself from the command line, you will see the main window
    shown in Figure 21.4.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_419_0.png)


    Figure 21.4 KDE''s KDevelop is a sophisticated development environment for building
    KDE 2.0 applications.'
