  md: '# Chapter 14: Configuring X11 Input


    This chapter introduces software tools and methods that you can use to control,
    configure, or manage X input. You''ll learn about a number of clients used to
    create, modify, or manage the keyboard and mouse. You''ll also learn about issues
    regarding new devices supported under Linux and XFree86. Understanding how to
    install and configure a new pointing device or keyboard for XFree86 can help you
    overcome obstacles that you face in creating an efficient desktop system for your
    self, or if you are a system administrator, other users on your network.


    Some of the clients discussed in this chapter are included with XFree86, whereas
    others may be downloaded from the Internet. Although some issues of pointer support
    are XFree86 problems, others, such as installing a Universal Serial Bus (USB)
    mouse, are not. Supporting new devices require that you work with the Linux kernel.
    You may have to learn a little about Linux kernel modules and configuration, and
    you''ll find all the information that you need in this chapter.


    Linux and XFree86 support a great wealth of input devices. These devices include
    keyboards, pointing devices such as mice, infrared remote control, touch screens,
    and voice control via a microphone. This does not cover all these devices, but
    you can check various Web sites for more information.


    Versions of XFree86 prior to 4.0 provided support for a number of graphic input
    devices, such as tablets and touchscreens. These versions supported joystick input,
    for example, with a drop-in driver. The "Module" section of XFree86Config file
    supporting these drivers, and the "Input" section of XFree86Config required a
    responding entry. Newer versions of XFree86, as a4.0.1, now include at least loadable
    input modules (found under the /usr/X11/lib/XFree/modules/input directory), which
    are documented in short man pages included with the XFree86 distribution. Dynapro,
    MicroTouch, and Wacom drivers are included, along with a mouse, a void, or null-input
    device (which is used to run without a pointer or keyboard). To configure the
    devices that these drivers support, you need to make appropriate entries in your
    XFree86Config file''s "InputDevice" section.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_287_0.png)


    Commercial versions of X from companies as Metro-Link, Inc., provide additional
    drivers for other input devices, such as the Magellan Space Mouse or Labtec SpaceOrb.


    New devices appearing for the PC market are USB input devices such as keyboards
    and mice. The next section explains how to incorporate support for this on a properly
    configured Linux system that you can use the USB device during your X sessions.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# A USB Primer


    # A USB Primer


    Support for USB devices will become a reality with the release of the Linux 2.4
    series of kernels. At the time of this writing, the Linux community was poised
    to receive the new kernel after a long and much anticipated wait during the year
    2000. The current stable kernel at the time of this writing is 2.2.18, but many
    Linux users still use earlier 2.2-series kernels (and 2.0.38 and 1.2.13 kernels).


    Because of the popularity of USB, for these devices were backported, or inserted
    into Linux kernels, starting with 2.2.15, 2.2.16, 2.2.17, and 2.2.18. All that
    is required is the application of a single patch file as usb-2.4.0-test2-pre2-for-2.2.16-v3.diff.gz,
    and a quick recompile of your kernel (see "Resource Information" section at the
    end of this chapter). The good news is that most Linux distributions, such as
    Mandrake 7.2, SuSE and Red Hat 7.0, have included USB support in the distributed
    kernel.


    Linux now supports nearly 60 USB input devices such as joysticks, keyboards, and
    mice. Table 14.1 lists the supported devices.


    # Table 14.1 Linux Supported USB Devices


