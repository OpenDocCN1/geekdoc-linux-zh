  md: '190 Chapter 11: Popular X11 Clients


    # # Free Application Suites


    This section introduces a number of free software suites, word processors, text
    editors, and various productivity applications that you''ll find available for
    Linux and XFree86. Just because these applications are free does not mean that
    the software is of lower quality than many commercial software products. In many
    cases, these clients are even better, more stable, and much more popular because
    they have withstood the ravages of hard use and the scrutiny of their source code
    by hundreds of thousands of advanced users and programmers around the world.


    # # StarOffice


    StarOffice, at one time a proprietary commercial office suite, was acquired in
    1999 by Microsystems, Inc., which then released the multiplatform suite free for
    Linux, Solaris, Windows NT, and Windows 95. In October 2000, Sun then released
    the source code to StarOffice under the GNU General Public License and Industry
    Standard Source License. These bold maneuvers by Sun have resulted in StarOffice
    becoming one of the most popular applications for Linux, and a viable, economical
    alternative to expensive commercial office software for other operating systems.


    The StarOffice consists of a word processor, spreadsheet, organizer, graphics
    editor, presentation manager, and database manager wrapped in an integrated desktop
    that can function as a window or complete desktop during your session. This suite''s
    main desktop window can also function as a Web browser. The following are the
    main components of StarOffice:


    +   * **Words**—a word processor that can import and export 16 different document
    formats; the application also includes extensive support for HTML document editing,
    revision markup, spell-checking, a thesaurus, and automatic correction.

    * **Spreadsheets**—a modern spreadsheet with numerous graphing facilities that
    can generate data and graphics for embedding in other StarOffice documents.

    * **Presentations or StarImpress**—a presentation creation and display client
    with integrated drawing and image editing tools.

    * **StarDraw**—a drawing and image editing client used to generate or modify artwork
    for use in StarOffice documents.

    * **Mail**—an electronic mail manager.


    New improvements added to recent versions of StarOffice are the ADABAS database
    manager, expanded Java language support, and better documentation of StarOffice''s
    internal language, StarBASIC. Expect additional features as the Open Source version
    of StarOffice matures.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Installing StarOffice


    StarOffice is included as a standard feature with many Linux distributions. If
    you did not get a copy with your distribution, you can download a binary install
    version from Sun at http://www.sun.com/startoffice. The download for version 5.2
    requires as little as 95MB for the main installation file.


    To begin the installation, log in as root, then run the file named so-5_2-ga-bin-linux-en.bin,
    as follows:


    ```

    # ./so-5_2-ga-bin-linux-en.bin

    ```


    If you have an older version of Linux or an incompatible set of software libraries,
    you can also download version 5.1a, which consists of a 70MB tape archive file.
    You can then extract the file like this:


    ```

    # tar xf so51_lnx01.tar

    ```


    After decompression, you can then start the installation (of either version) by
    using the included setup command (as root) like this:


    ```

    # ./setup /net

    ```


    In this example, the /net command-line option allows the root operator to install
    a system-wide StarOffice configuration in which individual users can then perform
    minimal installs (otherwise, the command will install the entire 150MB StarOffice
    system in each user''s home directory).'
  merge: -1
