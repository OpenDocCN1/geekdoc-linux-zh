  md: '# Chapter 16: Window Manager Configuration


    His chapter introduces configuration of various popular window managers for XFree86.
    You''ll find an amazing variety of window managers for Linux and X, and choosing
    a favorite can be difficult. You''ll also learn some of the unique features of
    each window manager and how you can configure each to work the way you want.


    One of the best reasons to use XFree86 is to be able to choose an alternative
    window manager for use during an X Session. Choosing which window manager to use
    from the hundred or so available for X can be a challenge, but as your personal
    tastes and needs will dictate your favorite environment. A number of window managers
    discussed in this chapter support different themes, desktop schemes, in which
    various sets of window controls, colors, and decorations are available, with each
    radically or subtly different.


    Although some window managers may be a challenge to configure, nearly all respond
    changes in configuration text files on your system. In most cases, if a graphical
    configuration tool is offered to change the theme or configuration of a window
    manager, you should properly use the supplied tool.


    Remember that although a window manager is nothing more than an X11 client, using
    XFree86 without a window manager isn''t much fun. This chapter covers some of
    the more popular window managers for XFree86:


    +   * AfterStep, which features a wharf, or docking station for icons and windows

    * fwm, which features basic window management, including virtual desktops

    * fwm2, an improved version of fwm

    * GNOME-aware window managers, which include Enlightenment and sawfish, two of
    most popular window managers used with GNOME

    * KDE, one of the newer desktop environments for XFree86, includes a suite of
    hundreds of clients

    * mlwm, a window manager that mimics the classic MacOS desktop

    * mwm, which is the original Motif and LessTif window manager with virtual desktops
    and a configurable desktop menu

    * twwm, which is included with XFree86 and provides minimal window management

    * Window Maker, the GNU X11 window manager with improved features from AfterStep

    * wm2, a window manager with a limited set of features'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Configuring the twwm Window Manager


    You''ll probably find a number of these window managers available on your Linux
    distribution''s CD-ROMs (especially if you use SUSE Linux). KDE and GNOME are
    the most popular desktop environments for most Linux users. You''ll also see how
    easy it is to build and install some window managers from scratch.


    You''ll find many additional window managers for Linux and XFree86 at http://www.plg/~xwinman.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_326_0.png)


    # Configuring the twwm Window Manager


    The twwm, or Tab window manager, is installed by default under the /usr/X11R6/bin
    directory, and is included with every XFree86 distribution. Originally developed
    by TomLaStrange, twwm offers only the most basic features for supporting window
    management, as a root menu, basic window controls, and the use of icons.


    You can find the twwm manager''s system-wide configuration file, system.twmrc,
    under the /etc/X11/twwm directory, although older versions of XFree86 or other
    Linux distributions may locate this file under the /usr/X11R6/lib/X11/twwm directory.
    New distributions use symbolic links that point to /etc/X11/twwm/. Users can customize
    the system-wide file by copying it with the name .twmrc into the home directory.


    Some Linux distributions allow you to specify a desired window manager on the
    startx command line as follows:


    ```

    # startx twwm

    ```


    However, most Linux users who use the startx command will enter the following
    lines into the .xinitrc file in their home directory:


    ```

    exec xterm &

    exec twwm

    ```


    This example launches the xterm client and then the twwm window manager. After
    you start your X session, you can access twwm''s root menu by left-clicking in
    a blank area of the desktop. This menu is defined in your copy of .twmrc in your
    home directory. You can use favorite text editor, as pico, to edit this file,
    as follows:


    ```

    # pico -w .twmrc

    ```'
  merge: -1
