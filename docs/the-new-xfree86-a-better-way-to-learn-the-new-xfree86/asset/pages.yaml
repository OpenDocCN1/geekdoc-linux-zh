  md: '# What Is X?


    To quote the rather modest X man page, "The X Window System is a network-parent
    system which runs on a wide range of computing and graphics machines." More importantly,
    you should know that X is not Windows! X should be referred to as X; X Window
    system; X Version 11; X Window System, Version 11; or X11. Some people also refer
    to X by its latest revision number, X11R6.


    X is a protocol that defines programs, known as clients, interact with any program,
    known as a server, possibly running on a remote computer. The server handles objects
    are drawn on displays by providing the specific device drivers. Their relationship
    of device-independence allows software developers to concentrate on writing clients
    which will run on any computer platform; moving, or porting an X11 client to a
    different workstation, such as running an Intel-based PC to a Sun Microsystems
    SPARC workstation, can be as easy as a simple recomile of the source.


    Whatever you call X, don''t call it Windows! At best, any UNIX earshot will immediately
    label you as either a "suit" or "newbie." At the worst, you''ll be termed a "luser,"
    and if you are on a network with a BOFH (Bastard Operator from Hell), you could
    lose your username, home directory, or by


    # A Short History


    Modest definitions aside, X is a sophisticated networking graphical interface
    that has been in use for nearly 20 years. Maturing along with UNIX, development
    of X started in 1982 as of an effort by the Massachusetts Institute of Technology
    (MIT) and the Digital Equipment Corporation (DEC) to create a Distributed Computing
    Environment (DCE). The effort, named Project Athena, resulted in a capable environment
    which grew to support more than 10,000 users on workstations. Several versions
    followed rapidly, including X10, then X11, released in 1988. Other successful
    elements of the project are still in use today, such as the Kerberos authentication
    system.


    Since 1987, X11 has gone through at least six major revisions and five minor revisions.
    At the time of this writing, the current X, the X Consortium (http://www.x.org),
    was about to introduce X11R6.5. Although you''ll learn about some of the new features
    of X11R6.5, this book focuses on the base for XFree86 Project''s XFree86 X11 distribution.


    # What''s New?


    As mentioned, a new minor revision of X was introduced as this book was developed.
    However, it can be important to understand the lineage of features added to X
    over'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    the years, as some computer manufacturers are slow to jump to the latest version
    of X (because the previous version works so well).


    New developments include better handling of fonts, compressed audio and video
    data streams, internationalization, and incorporation of support for more input
    devices, such as keyboards, graphics tablets, and pointing devices.


    # Why Use X?


    This section introduces general features of X, and presents some rationale for
    using this windowing system instead of other commercial operating systems that
    initially could only mimic X. Originally thought to be the high-end windowing
    system for premium workstations, X has experienced a huge resurgence in popularity,
    as free software and operating systems rise in popularity with the Open Source
    movement. Today users of X are more likely to run Linux or FreeBSD on a $1,500
    home PC, rather than HP/UX or Solaris on an $20,000 workstation.


    # General Features of X


    One of X''s most impressive features is the system''s portability. Originally
    developed from research by Xerox and refined by researchers at MIT, X builds on
    the capabilities of its operating system. Also best known as a graphical network
    interface for UNIX, X has been ported to many different computer platforms and
    operating systems, ranging from mainframes to personal digital assistants (PDAs).


    X appeals to researchers, administrators, and users for a number of reasons. Although
    the ebb and flow or perpendicular momentum in the computer industry swings between
    centralized or distributed computer systems (systems that either depend on one
    large system or derive power and flexibility from the combination of many systems),
    X has provided both! You can use X as a standalone system on a large network or
    launch clients from a remote server.


    Taken to an extreme, this means that you can sit at one display somewhere in North
    America, for example, and launch clients on a workstation or server on the other
    side of the world. The world can be viewed or over either terminal. X also works
    over slower networks, such as dial-up lines via a serial port.


    The intrinsic networking features of X have added to its appeal. Another strength
    could also be viewed as a weakness: X as a standard, does not enforce graphics
    standards. This means that the developer is free to create clients with a variety
    of interfaces. As a developer, you are given the basic function calls and libraries
    to craft programs, but so-called "standards" of an interface are left up to you
    and your choice of software toolkit, window manager, or operating system.


    Other features include font manipulation, use of color, use of resources (or configuration
    files for system or client-specific tweaks), example source code, many'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'clients, standard command-line interfaces, geometry settings (for sizing and
    placement of windows), and general graphics device-independence.


    Another appeal of X is that, like UNIX, the system enables you to activate or
    update multiple windows at same time. Basic copy-and-paste operations are supported
    between windows and clients, and processes can also share data.


    Finally, one of best reasons for the popularity of X is its licensing. A split
    (or *fork*) in its development was threatened in early 1998, when the then-curators
    of X, The Open Group (TOG) changed X’s copyright and announced prohibitively expensive
    monetary licensing for “official” development and distribution of X. Fortunately,
    cooler heads prevailed, the copyright of X11R6.4 reverted to its original version,
    the licensing was withdrawn, and stewardship of X was transferred to another Open
    Group organization, the X Consortium.


    You are free to develop and distribute X11 clients without paying royalties. You
    are also free to develop and distribute your own version of X! The pertinent portion
    of the licensing (found under the `/usr/X11R6/lib/X11` directory after you install
