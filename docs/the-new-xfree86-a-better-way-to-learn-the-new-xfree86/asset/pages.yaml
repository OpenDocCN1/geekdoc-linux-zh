    To find the value for your keyboard''s Ctrl key, press the key; then depress the
    key to release events printed in your original terminal window. As you can see
    in the strings of output text in the xev window, the values returned by the Ctrl
    and Caps keys are 66 and 37 decimal, which translate to 0x42 and 0x25 in hexadecimal.
    Note that xev also reports on pointer movement and mouse button events.


    # Programming Help


    One quick to translate numbers from one base system to another is to use a programmer''s
    calculator. Although the venerable xcalc client does not offer this feature, the
    kcalc client included with KDE can translate different base values. Simply select
    the input number''s base (either decimal, hexadecimal, oct, or binary), enter
    the number, then click a different base. Note that binary translations work up
    to 32,767 decimal.


