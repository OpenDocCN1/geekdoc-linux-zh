  md: '# Starting X Remotely 119


    Ensure that all your users have accounts on your servers. Users on your network
    can now sit down at a workstation, then log on to either server using the Xwrapper
    command with the XFree86 server''s -broadcast option like this:


    # Xwrapper -broadcast


    The Xwrapper command (part of the XFree86 distribution) allows directly launch
    the X server. Using this example command line, an xdm login appears from the server
    watchdog, as it is the first server listed in the workstation''s file. If wonderdog
    is offline, the xdm login appears for supercat. To log on to a specific server,
    workstation users should use the Xwrapper command and the XFree86 server''s -query
    option, followed by a server''s name, as follows:


    # Xwrapper -query supercat


    After pressing Enter, the xdm login screen appears for supercat, even though wonderdog
    is online and listed first. Note that your network''s users don''t have to have
    an account on the workstation!


    One approach for providing X sessions for your users is to set up each workstation
    on your network with a minimal Linux and XFree86 installation with only a single
    root account, and perhaps an open account used to provide the xdm login screen.


    For example, create a user named xlogin with a password on your workstation. Next,
    edit the /etc/passwd file and look for the following line:


    ```

    xlogin:x:501:501::/home/xlogin:/bin/bash

    ```


    Replace /bin/bash in the password entry (which designates the login shell for
    the user) with the pathname to a special shell script, such as remotex:


    ```

    xlogin:x:501:501::/home/xlogin:/usr/local/bin/remotex

    ```


    Save the passwd file. Next, create the remotex script:


    ```

    /usr/X118/Xwrapper -broadcast

    ```


    Save the script under the /usr/local/bin directory, then use the chmod command
    to make it executable:


    ```

    # chmod +x /usr/local/bin/remotex

    ```


    Don''t forget to use the passwd command to assign a password for the new xlogin
    user! Then, when any user on your network sits down at any workstation, the user
    can boot Linux and log in with the xlogin username and password. After entering
    the password and enter, the xdm login screen for the first available server appears.
    This provides an additional level of security by requiring users to know how to
    log in to a workstation and then use a personal username and password before running
    X on a server.'
