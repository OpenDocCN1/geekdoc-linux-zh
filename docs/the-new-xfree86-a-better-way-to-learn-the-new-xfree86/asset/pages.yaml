  md: 'Productivity Clients


    # X11 Clients


    There are numerous X11 productivity clients. Some of these programs are legacy
    applications developed over the years on various UNIX systems, which have then
    been ported to XFree86 and Linux. One client that you''re sure to find with your
    Linux distribution is Sanjay Ghemawat''s ical, a visual calendar and planning
    client that you can also use to print-one-, two-, six-, nine-, or twelve-day calendars
    or monthly calendars.


    Start ical from the command line of your terminal window like this:


    # ical &


    After you press Enter, you''ll see ical''s main window, which defaults to an appointment-view
    of the current day, as shown in Figure 11.21.


    This client has a number of command-line options that you can use to import, print,
    or display your calendar. ical also obeys a subset of X Toolkit options, so you
    can specify foreground and background colors. Another feature is the ability to
    set appointments (also known as notices), repeating items, and alarms. To use
    the alarms feature, you''ll need to run ical either the time on your system or
    every time you log in for an session.


    Other productivity clients for XFree86 include plan (which calculates loan amortization),
    grok (which creates databases), and plan (which offers calendar and appointment
    functions). You''re sure to find many more productivity clients with a little
    searching on the Internet.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_230_0.png)


    figure 11.21 The ical client is a popular X11 productivity application.


