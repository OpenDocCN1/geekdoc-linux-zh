  md: '# Handling Resolutions


    | Depth | 16 |

    |---|---|

    | Modes | "1600x1200" "1024x480" "800x600" "640x480" |


    In this example, you have a choice of resolutions to use for your X session. You
    can toggle these resolutions using your keyboard keypad if your XF86Config "ServerFlags"
    section has disabled the DontZoom feature as follows:


    ...


    # # DontZoom


    You can toggle resolutions on the fly by pressing Ctrl+Alt[+-]-(that is, the keypad''s
    plus or minus keys). Laptop users usually need to press and hold a special Fn
    key while performing this toggle the embedded keypad set in the laptop''s keyboard.
    The resolutions will be used in the order which they appear on the "Modes" line.
    Most users place the highest resolution first, even though most configuration
    generate the "Modes" line from lowest to highest resolution by default.


    For systems with limited resolution, one possible solution invokes the use of
    a virtual desktop, a feature sometimes provided by the window manager used for
    your X session. Some virtual desktops allow clients to span the current desktop
    while allowing transparent borders that move. This capability enables you to pan,
    or shift a window through the desktops using your pointing device or designated
    keystroke commands.


    For example, the fwwm2 window manager settings for control language keywords,
    such as Scroll, in its resource file, which is either .fwwm2rc in your home directory
    or system. .fwwm2rc under the /etc/X11/fwwm2rc directory:


    +   * Let''s bind some keys to pan the desktop around


    | Key Left | A | C | Scroll -100 0 |

    | Key Right | A | C | Scroll +100 +0 |

    | Key Up | A | C | Scroll +0 -100 |

    | Key Down | A | C | Scroll +0 +100 |

    | Key Left | A | M | Scroll -10 +0 |

    | Key Right | A | M | Scroll +10 +0 |

    | Key Up | A | M | Scroll +0 -10 |

    | Key Down | A | M | Scroll +0 +10 |


    These settings enable the user to press Shift+Ctrl+ cursor key (left, right, or
