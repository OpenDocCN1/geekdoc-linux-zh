  md: '# Using VMware


    Vmware, from VMware, Inc., is an X11 client that can create a virtual host for
    other operating systems, such as different versions of Linux, DOS, FreeBSD, and
    the Windows family of operating systems. The client accomplishes this by using
    a virtual filesystem on your hard drive (somewhat like that used by DOSEMU).


    Unlike Xnc, VMware is a commercial product. You must have a valid license key
    in order to run this software. To install VMware, download the software (which
    can be a 6MB compressed tarball or .rpm archive), then install it as root, as
    in the following example:


    ```

    # tar xvzf vmware-2.0.3-799.tar.gz

    # cd vm*

    # ./vmware-install.pl

