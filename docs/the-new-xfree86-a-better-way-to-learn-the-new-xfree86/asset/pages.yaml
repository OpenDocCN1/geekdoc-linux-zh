  md: 'Note that you can use NFS or Samba-mounted filesystems to store X fonts; they
    do not have to reside on the local filesystem, although most Linux users choose
    to install thousands of fonts locally so that they can access the fonts quickly.
    However, if you''re going to resort to networked storage for providing fonts,
    a better approach is to use xfs font server.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_312_0.png)


    You''ll find a number of X font utilities included with Linux and XFree86, as
    the following:


    +   - amf2tf, which converts a font-metrics file to a TeX font metrics file

    - bdttfcf, which converts a binary font to to .pdf format

    - chfontpath, a FontPath utility for the xfs font server

    - getafm, which creates a font-metrics file from a PostScript font

    - fsinfo, which displays font server information

    - flsfonts, which displays fonts known by the xfs font server

    - f- fstobdf, which converts an xfs server font into a .bdf font file

    - ftinfo, which displays information about a TrueType font

    - mkfontdir, which creates an index of a font directory

    - showfont, which prints specified font data

    - xfd, which displays a font''s characters

    - xfontsel, which displays available X fonts and enables you to select one

    - xlsfonts, which displays your system''s installed and recognized X11 fonts


    # Installing Fonts


    Fonts are usually installed under the /usr/X11R/lib/X11/fonts directory in a subdirectory
    matching the type of font. For example, you''ll now find a Type1 font directory
    included with newer XFree86 distributions as its 4.0:


    ```

    $ ls /usr/X11R/lib/X11/fonts

    100dpi/ PEX/ Type1/ mdk/ movilla-fonts/

    75dpi/ Speedo/ drakfont/ misc/ pcf-drakfont/

    ```


    Each directory will contain one or more additional files, such as fonts.dir, an
    index of the directory''s fonts, and fonts.alias, an index of short names of fonts.
    Outside of this index of shortened names, font names can be as long as the following
    example:


    -adobe-courier-bold-r-normal--25-180-100-100-m-150-iso08859-2


    XFree86 uses a variety of fonts during your X sessions. Fonts are distributed
    in binary, ASCII, outline, and portable formats. You''ll find the more common
    ASCII'
  merge: -1
