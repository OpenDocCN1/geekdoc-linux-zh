    # Corel’s WordPerfect Office 2000 for Linux


    Corel, Inc., has had a rocky road with lots of financial ups and downs, but continues
    to support Linux and XFree86 with some major products. Starting in December 1998
    with the release of a free version of WordPerfect 2000 for Linux (see the section
    “Corel’s WordPerfect 8 for Linux” later in this chapter), Corel promised to bring
    its office suite and related products to the Linux market. In the summer of 2000,
    Corel released WordPerfect 2000 (along with its premier graphics program, Corel-DRAW)
    for the Linux community.


    Part of the incentive and the port come from the Open Source community’s Wine
    project. Wine, which aims to provide clone software libraries comparable to those
    used in the commercial Windows operating system, attempts to enable users to run
    programs for Windows under XFree86 and Linux (along with FreeBSD and Solaris).
    In 1998, Corel adopted the project, which so far has had great success in allowing
    Linux and XFree86 users to run hundreds of Windows programs with-out problems.


    As a result, Corel contributed code back to the Wine project, and at the same
    time used parts of Wine to port WordPerfect Office 2000 and its graphics application.
    Corel’s actions provide one of the biggest examples of collaboration between the
    Open Source developer community and a corporate enterprise.


    The office suite consists of five applications:


    +   * WordPerfect 9—an updated version of WordPerfect with graphics and charting
    features, along with Internet publishing and HTML editing.

    * Quattro Pro 9—a spreadsheet client with all the features of modern 3D spreadsheets,
    including Internet publishing and HTML editing.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Commercial Application Suites


    +   * Corel Presentations 9—a presentation editor that incorporates a drawing
    editor and graphics-editing module.

    * Paradox 9—a relational database manager client that, like other sophisticated
    database environments, allows creation of customized programs.

    * CorelCENTRAL—a PIM for scheduling, reminders, and contacts; other features include
    support for launching browsers on internal URLs.


    Like Applware, Corel''s suite is also tied together with an internal macro language
    (named PerfectScript) that can communicate across the suite''s clients. The suite
    also includes a CD-ROM with 1,000 fonts, 12,000 clipart images, and 200 photos
    for use in documents.


    # Installing WordPerfect Office 2000


    WordPerfect Office 2000 for Linux is primarily contained on two installation CD-ROMs,
    although four CD-ROMs are included in the package. (The CD-ROMs include a copy
    of Corel''s Linux distribution and a limited version of Loki''s Railroad Tycoon,
    and more.) The suite is aimed at Linux systems using a 2.2-series Linux kernel
    and X. The minimum system requirements, according to Corel, are a 200MHz CPU and
    64MB RAM. However, these suggested requirements specify an unrealistic minimum;
    you can achieve better performance with a faster CPU and twice as much memory.
    (Applware, on the other hand, is quite fast even on lowerEnd Pentium CPUs and
    32MB XFree6 Linux systems.) You''ll also need more than 400MB hard drive space
    for a full installation, not counting fonts, clipart, or photo images.


    Start the installation (as root) by inserting and mounting CD-ROM Disk 1. Next,
    use the setup command on the CD-ROM as follows:


    ```

    # ./setup

    ```


    After you press Enter, you''ll see a splash screen as shown in Figure 11.5.


    # Trouble Installing?


    Corel WordPerfect Office 2000 for Linux package is quite particular about the
    type of software library support installed, and requires a minimum of the glibc
    2.0 software libraries. Out of the box, this office suite will not install on
    some Linux Linux 7.0, even though the distributions were introduced after the
    office suite came on the market.

    Browse to http://linux.corel.com for updates or bug fixes for this office suite.'
  merge: -1
