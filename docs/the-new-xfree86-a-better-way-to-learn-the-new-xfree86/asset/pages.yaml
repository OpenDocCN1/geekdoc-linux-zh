  md: '# Chapter 11: Popular X11 Clients


    This chapter introduces some commercial office suites and free software productivity
    tools that are popular among Linux and XFree86 users. You will see how some of
    the packages are installed, learn about the installation and use requirements,
    how to set up backup preferences, and get solutions to some common problems that
    arise when setting up or using the programs.


    One of the biggest arguments against Linux in recent years—spouted by early Linux
    foxes, industry nay-sayers, and the so-called professional but biased PC media
    still in the grip of the software monopoly—was that there was a lack of solid,
    capable, and “professional” software suites for Linux. (These same pundits have
    moved onto other excuses, such as scalability, accountability, and total cost
    of ownership, or whatever fear, uncertainty, and doubt [FUD] tactics are currently
    being espoused by the software monopoly.)


    The fact is that great software has been available for Linux and XFree86 almost
    since the first releases and distributions. In this chapter, you will learn about
    Applinux, a legacy office suite that has recently been improved. You will also
    learn about the very latest office suite from Corel, WordPerfect Office 2000 Deluxe
    for Linux.


    Palm PDA users will also find out how to use a graphical X client to back up or
    install software on their PDAs. And you''ll get an overview of some of the more
    free productivity software packages included with nearly every Linux distribution
    for XFree86.


    Linux and XFree86 users enjoy a special relationship with their operating system,
    and as you''ll soon see, you can find “professional-quality” software that exceeds
    other commercial operating system software in ease of installation, configuration,
    stability, and features.


    # Commercial Application Suites


    Although the majority of Linux users quite continue to use free software instead
    of commercial applications, a number of commercial applications appeal to a segment
    of the Linux market. In particular, those sites that need or require service and
    support for daily operations may want to consider using commercial software.


    An office suite is generally a collection of individual software packages with
    common functions, interdependence, and the code- and data-sharing base. Most office
    suites combine a word processor, spreadsheet, image or presentation editor, and
    perhaps a'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'database manager. Modern office suites adds additional functions, such as electronic
    mail handling and perhaps a development package. A code- and data-sharing base
    enables you to create documents that contain common data. For example, a word
    processing document might include numbers from a spreadsheet or a graphic from
    an image editor. Also, each suite element can benefit a common module, such as
    a spelling checker.


    Some suites may offer productivity applications such as personal information (PIM).
    Some PIM modules include an address book, To-Do or contact list manager, scheduling
    and appointments manager, and project management functions.


    # Applquare Office for Linux


    First offered for Linux in conjunction with Red Hat Linux 4.2 in 1997, the Applquare
    Office suite can create and read documents across a different operating systems.
    To use Applquare on an Intel-based PC running Linux, you need XFree86, at least
    32MB RAM, a Pentium-class 166MHz CPU, and 133MB, 236MB, or 500MB hard drive storage.


    AppOffice for Linux, now marketed by VistaSource, Inc., combines a number of different
    software tools in an integrated environment for developing numerous types of documents,
    databases, and clients. The following are the basic elements:


    +   Data—a client for accessing database information. The client uses a spreadsheet
    interface to interface with the Postgresql and MySQL systems, along with the commercial
    ADJAS database (and others).


    +   Directory Displayer—an explorer-type dialog used for file navigation and launching.


    +   Graphics—a graphics client that you can use with 32 different graphics formats.
    This client is also part of the Presents presentation module.


    +   HTML Author—a Webcentric incarnation of the Applquare Words word processing
    client, you used to create, edit, and publish Web pages.


    +   Macro editor—a website-wide macro editor that you can use to create repeatable
    shortcuts of common actions.


    +   Mail—an electronic mail manager that is MIME-compliant and that can also serve
    as a Post Office Protocol 3 (POP3) gateway.


    +   Presents—a presentation manager that you can use to create, import, or export
    a variety of presentation document formats. This application features transition
    effects, templates, and drawing and graphics tools.


    +   SHELF/Builder—an object-oriented client builder used to create standalone
    applications that work on a variety of computer platforms.'
  merge: -1
