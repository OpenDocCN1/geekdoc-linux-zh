- img_proc: true
  md: '# Performing Text-based Configuration Using x86config


    You can generate a new file during your Linux install, while running X, or from
    the text-based console. Some tools, such as x86cfg, launch a X server to offer
    graphical installation, whereas others, such as x86config, are text-based.


    > You should never use someone''s XF8Config file for your system unless you use
    the exact same video card and monitor combination. Linux notebook users can also
    share configuration files, but again, only notebooks of the same model. You should
    always, as a matter of practice and to avoid damaging your equipment, generate
    your own XF86Config file. Incorrect settings can damage older monitors!


    ![](img/078622fac3fd61e5a0c895da1d3eff96_60_0.png)


    You can manually craft your own XF86Config file by editing a template named XF86Config.eg.
    This file is normally located under the /usr/X11/lib/X11 directory, and contains
    sample sections that you can customize for your system. You will also find example
    entries for popular pointing devices, and details about more advanced configurations,
    such as using two monitors during your X session Use the less pager command to
    read the file after you install XFree86:


    ```

    # less /usr/X11R6/lib/X11/*.eg

    ```


    If you use a simple text editor, as pico (part of the pine email package), don''t
    forget to disable the line-wrapping feature. Enter pico''s -w option, followed
    by the template file''s name, as follows:


    ```

    # pico -w /usr/X11R6/lib/X11/XF86Config

    ```


    After making changes, creating your own XF86Config file is not recommended if
    you''re new to XFree86. However, editing the file to make quick changes may sometimes
    be necessary, especially if you want to enable or disable features of X for your
    session or to take advantage of any special features or options available for
    your system''s graphics driver. Seasoned experts will trim the file down to its
    bare minimum for full functionality, but those new to XFree86 will most likely
    use a configuration tool that is much easier to.


    # Performing Text-based Configuration Using x86config


    The x86config command is a venerable XFree86 configuration tool that has the flexibility
    of working at the console or through X11 terminal window. This means you can configure
    X immediately after installation or reconfigure your X11 session. A companion
    program named reconfig is included with XFree8'
