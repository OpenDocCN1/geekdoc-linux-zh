  md: '# Using Scanners


    Scanners are useful devices that can copy and import images and documents. Although
    scanners initially were an expensive hardware add-on for any computer system,
    prices have dropped and even the cheapest models currently on the market now have
    features that rival or exceed those of the most expensive models of only a few
    years ago. Scanners come in all different shapes and sizes, and can use a variety
    of input/output (I/O) ports on your system. This includes the serial and parallel
    port, Small Computer System Interface (SCSI) PC ports, Personal Computer Computer
    Memory Card Interface Adapter (PCMCIA) slots, and today, the most common Universal
    Serial Bus (USB) port.


    Before contemplating a purchase of a scanner for Linux, first check for the availability
    of a driver or user-space application that can enable your scanner to be recognized
    and used under Linux. Some scanners require a specific set of loaded kernel modules,
    you can use other scanners from a command-line program. Depending on the type
    of scanner and supporting software, you may not need to use X or a running X session
    in order to perform a scan. However, it is much more convenient to use a graphical
    interface when scanning, as most supporting applications provide convenient preview,
    cropping, contrast, brightness, and color controls. One of the most popular software
    support programs for using scanners is the Scanner Access Easy (SANE) package.


    # SANE


    SANE is a scanner support package split into two components: a back-end (or low-level
    driver), and a front-end (or graphical interface) to the driver and scanner hardware.
    The back-end support comes in the form of background drivers, whereas the front-end
    may be one or more supporting command-line, X, or network clients, such as the
    following:


    +   - xsane, which can function as a GIMP plug-in

    - xscanimage, which can function as a GIMP plug-in

    - scanimage, a command-line version of xscanimage

    - xcam, a GUI for cameras

    - saned, a network daemon to support scanning over a network


    For example, the xscanimage client, which may be used as a standalone program
    or a plug-in with the GIMP, provides a number of controls and settings, depending
    on the supported driver. Settings for xscanimage are stored in several resource
    files'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'found under the subdictionary inside the directory .sane in your home directory.
    The resource files include the following:


    +   - xscanimage.rc, which sets user preferences

    - devicename.rc, a resource file with the name that consists of the scanner''s
    driver, such as as660driver.rc; this file generally contains the last or current
    settings for the driver

    - preview-devicename.ppm, a saved preview from a previous preview acquisition


    You can start this client from the command line as follows:


    # xscanimage &


    After you Press, insert a photo into your scanner, click the Preview Window button,
    then click the Acquire button as shown in Figure 12.5.


    You can then use the various controls to set the type of scan, resolution, brightness,
    and contrast. Other drivers (the one shown in Figure 12.5 is for an Artec AS6E6)
    may provide fewer or more controls.


