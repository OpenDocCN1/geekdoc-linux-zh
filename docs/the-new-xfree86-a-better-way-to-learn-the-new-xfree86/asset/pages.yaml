    XFree86 and Linux. These clients cover a wide range of applications, including
    graphics, audio, video, and animation. You''ll learn about some of the premier
    applications that you can use as an artist or to boost creativity when building
    various multimedia products using Linux and XFree86.


    Many of the clients, like games, will tax your system''s resources. In many but
    not all cases, you should have a properly configured sound system. Your X11 sessions
    should provide a resolution of at least 1,024×768 and thousands of colors. Although
    this may be a problem for legacy hardware, most modern-day Intel-based PCs can
    boost this capability. Laptop users with recent models will also benefit, as higher
    resolution seems to be a stock feature, with 800×600 displays relegated to only
    the lowest-end models.


    # Graphics Clients


    Graphics clients play an important part when you are using XFree86 and Linux.
    The clients described in this section offer expanded or added graphics capability
    to your system. Graphics are used throughout the X desktop to build icons, background
    pixmaps, and root displays. Graphics may also play an important role when creating
    technical documents, drawings, brochures, and even faxes.


    # Using the GIMP


    The GIMP is the premier graphics creation and editing client for Linux and XFree86.
    This application and its custom toolkit spawned a new generation of graphics clients
    and other applications by providing a base of routines eventually into and expanded
    by the GNOME project. As an Open Source project, the GIMP is distributed free,
    with source code, which has helped increase its popularity and finesse, as developers
    contribute improvements and features. It is one of the lightning rods of success
    that many advocates of Open Source point to when talking about the viability of
    the Open Source model of building projects.


    Nearly every Linux distribution includes the GIMP. As an interactive image editor
    for XFree86 and Linux, the GIMP is without peer. In fact, many of its features,
    such as scripting and advanced filters, rival that of commercial alternatives
    on other computer platforms and operating systems.'
  merge: -1
