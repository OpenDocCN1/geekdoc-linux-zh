  md: 'In this chapter, you proceed with configuring and managing your X system. You''ll
    learn about managing various aspects of your system, such as the display, keyboard,
    fonts, virtual desktops, and access. You''ll also learn about configuring multihead
    X using some of the new features of the XFree86 distribution.


    For several reasons, it is important to know how to manage your X display. First,
    you''ll be able to track down and fix any problems quickly, and quickly determine
    whether a difficulty requires a hardware or software fix. Next, you''ll be able
    to configure more efficient systems, and squeeze the best performance out of your
    system or systems.


    You will put these skills to good use when administering your own system or an
    entire LAN.


    # Handling Resolutions


    As you''ve already learned, you can never have too much screen real estate when
    you are fortunate enough of 1,600×1,200 at 24-bit-plane color depth or millions
    of colors, you won''t experience the problems of trying to run an X client that
    needs 1,024×768 on an 800×600 display.


    Although Linux and XFree86 are portable enough to squeeze onto many embedded systems,
    some of which displays of 160×160, for all practical displays of at least 1,024×768
    are preferable and the most usable. If your system does not support this resolution,
    chances are good that you are using a specialized display, perhaps on a notebook
    such as the Sony Picturesbook (which sports 1,024×480 resolution), legacy computer
    equipment with a less-capable graphics card and monitor combination, or an embedded
    device.


    You can do a few things in software, however, to overcome display obstacles posed
    by limited hardware. This section introduces some solutions that you can attempt
    using XFree86 and some window managers.


    # Using Keyboard Controls


    On systems that support X at multiple resolutions, you can define multiple modes
    in your XF86Config''s "Screen" section. For example, a large monitor and graphics
    card with lots of memory may have a "Modes" line such as the following:


    ...


    Subsection "Display"'
  merge: -1
