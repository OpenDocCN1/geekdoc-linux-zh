  md: '# Configuring GNOME


    Configuring GNOME while running a GNOME session is actually the act of configuring
    the window manager used to support the session. You select many of the configuration
    options, including the choice of window manager to use with GNOME, through the
    GNOME Control Center, as shown in Figure 16.13.


    For example, after launching the Control Center via the Start menu, click the
    Desktop item, click the GNOME Manager list item. You will see a list of recognized,
    GNOME-aware window managers listed in the dialog box. Using this dialog box, you
    can alternatively try or reset your choice of window manager on the fly.


    Other configuration options offered by the Control Center include document handling,
    sound, external filesystems, session startup, and user interface elements, such
    as windows, buttons, and dialog boxes. Many of these settings are also available
    via the panel''s Start menu, as shown in Figure 16.14.


