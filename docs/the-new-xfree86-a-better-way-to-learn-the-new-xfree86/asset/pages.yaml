  md: 'Programming with Qt and KDE 389


    You can also develop graphic X11 clients using just the Qt libraries, the applications
    will be cross-platform-compatible, but won''t be able to use KDE 2.0''s features.
    Development for Qt and KDE clients primarily involves the use of the C++ language.


    # Simple Client Development with Qt Designer


    Qt Designer, included with the latest Qt libraries, is a graphical development
    client for rapidly prototyping applications and generating a user interface or
    .ui file containing a high-level description of your form. You can start this
    client from the command line of an X terminal window as follows:


    # designer &


    After you press Enter, you''ll see the client''s main window, as shown in Figure
    21.1. The design interface features various widgets that you can apply to a selected
    layout. To begin your design, click the New Menu item from Qt Designer''s File
    menu. You''ll then see the New Form dialog box shown in Figure 21.2, from which
    you can choose a type of form or framework for your project.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_416_0.png)


    Figure 21.1 Qt Designer is a GUI prototyping tool for quickly building the framework
    of cross-platform applications under XFree86 and Linux.'
