  md: '# Configuring the AfterStep Window Manager


    Many Linux distributions include AfterStep as a legacy window manager. At one
    time, AfterStep had eclipsed older window managers in features, but it now seems
    somewhat dated compared to KDE 2.0, GNOME, and Enlightenment. Originally fashioned
    after the Bowen window manager (itself a modification of fwm), After-Step was
    modified and improved to include many of the features of the NextSTEP interface.
    AfterStep provides a wharf for docking client icons, as well as other expected
    niceties, like a desktop menu, virtual desktops, window animation, and in the
    latest version, themes and GNOME compatibility. This window manager—like fwm,
    fwm95, and others—builds from source and installs quite quickly and easily on
    your PCs running Linux and XFree86. To install AfterStep, enter the following
    commands:


    ```

    # tar xvvf AfterStep.gz

    # cd AfterStep

    # ./configure; make install

    ```


    After building and installing AfterStep from scratch, you''ll find your system-wide
    configuration files under /usr/local/share/afterstep directory. You can use the
    start command to launch AfterStep for your X session if you enter the following
    line in your .xinitrc file:


    ```

    exec afterstep

    ```


    When you first start AfterStep, it creates a GNU submenu in your home directory.
    This subdirectory can contain customizations, although you can control nearly
    all of AfterStep features through its root menu, as shown in Figure 16.18.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_346_0.png)


    Figure 16.18 Use AfterStep''s root menu by clicking in a blank area of the desktop,
    then selecting the Desktop menu.'
