  md: '# Using a Display Manager


    ```

    # runlevel 2 is multi-user with network

    # runlevel 3 is multi-user with network and xdm

    # runlevel 4 is unused

    # runlevel 5 is unused

    # runlevel 6 is reboot

    ```


    Note that you can boot SuSE Linux to a full (networking) multiuser, console-only
    mode by choosing runlevel 2, whereas choosing runlevel 3 is boot to a graphical
    login using a display manager and X. Regardless of whether you are running a Red
    Hat or SuSE Linux-based system, you specify the default runlevel by using the
    initdefault setting in the /etc/initstab file. Under Red Hat Linux, booting to
    runlevel 5 (to use xdm) requires the following setting:


    ```

    id:5:initdefault:

    ```


    Under SuSE Linux, use the following initdefault setting:


    +   - default runlevel


    ```

    id:3:initdefault:

    ```


    You can also switch to a specified runlevel by using the init command, followed
    by a runlevel number. For example, when using Red Hat, to jump to a graphical
    login using the default display manager, use the init command followed by the
    appropriate runlevel, as follows:


    +   - init 5


    You can also do this directly at the LILO boot prompt by passing a kernel argument
    or boot message, entering the linux keyword and the runlevel as follows:


    ```

    boot: linux 5

    ```


    The default display manager is generally specified in /etc/initabb with a runlevel
    description. For example, an entry for a Red Hat–based system to boot directly
    to xdm might look like this:


    ```

    x:5:respawn:/usr/bin/xdm -nodaemon

    ```


    However, both SuSE and Red Hat Linux use more complicated means to determine the
    default boot manager. Under SuSE Linux, system initialization scripts (which are
    actually shell scripts) contain the logic to determine the default boot manager:


    ```

    13:3:wait:/sbin/init.d/rc 3

    ```


    Under Hat Linux–based systems, a shell script named prefd, found under the /etc/X11
    directory, is run to determine the display manager used:


    ```

    x:5:respawn:/etc/X11/prefdm -nodaemon

    ```'
