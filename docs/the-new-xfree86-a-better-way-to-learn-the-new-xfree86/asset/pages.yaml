    # # Just Mousing Around!


    You can specify other mouse actions by using the Mouse Behavior dialog box. To
    access this dialog box, click the Window Behavior menu item under Look & Feel
    list item. Use this dialog box to determine window behavior according to the type
    of mouse click. Other settings dependent on your pointer include active or inactive
    desktop borders. By changing the defaults in the Borders dialog box (which you
    can access by Look & Feel, then Desktop, finally Borders), you can set KDE to
    allow you to navigate to different virtual desktops by moving your mouse to the
    current desktop border. You can also set up KDE so that you can navigate through
    the desktops by pressing Ctrl+Tab.


    # # Configuring the Panel


    The typical KDE panel provides an application starter menu, client icons, session
    control buttons (such as buttons to lock the screen or log out), virtual desktop
    buttons, and other program icons and information, such as the clock and calendar
    at the far right. To configure the desktop panel, click the application starter
    button, then select the Panel menu, then Configure, then the Settings menu item.'
