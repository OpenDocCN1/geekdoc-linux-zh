    # Starting X Remotely


    Many Linux and XFree86 users are quite satisfied to install Linux and run X as

    alone system. However, X supports networking graphics, and was originally

    designed to work well on networks with 10,000 or more workstations. This means

    that you can combine the power of Linux and X and adapt XFree86 to provide ser-

    vices well beyond the capabilities of a single workstation.


    One of the greatest features of Linux is that it works on legacy computer hard-

    ware. While commercial software users are crying in their beer as their recently

    purchased hardware is quickly outdated by bloated products from the software

    monopoly, Linux users happily scoop corporate dump sites for ancient 486 and

    Pentium computers, reaping bargains at a fraction of the hardware’s original cost.

    Even better, the legacy hardware performs quite well, even using X!


    For a modest investment, Linux users can assemble inexpensive local net-

    , with capital expenditures focused on one or two higher-powered servers.

    By configuring XFree86, it is possible to sit down at a recycled workstation and
    log in

    and run X from the high-powered server. This section explains how to do.


    Install and configure XFree86 to work properly on each remote workstation. For
    exam-

    ple, on a workstation named sticky, edit the file Xaccess the /etc/X11/xdm

    directory. Look for the following section of code:


    ```

    #

    # The nicest way to run the chooser is to just ask it to broadcast

    # requests to the network - that new hosts show up automatically.

    # Sometimes, however, the chooser can''t figure out how to broadcast,

    # so this may not work in all environments.

    #

    *

    CHOOSER BROADCAST #any indirect host can get a chooser

    #n# If you''d prefer to configure the set of hosts each terminal sees

    ```'
