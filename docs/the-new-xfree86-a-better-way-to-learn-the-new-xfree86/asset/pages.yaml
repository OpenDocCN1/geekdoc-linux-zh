    Many Linux distributions (and /previous XFree86 distributions) also include a
    symbolic link named X under the /etc/X11 directory. This link points to the X
    server used for your session. With XFree86 4.0.1, the link X points to the XFree86
    server under /usr/X11R6/bin:'
