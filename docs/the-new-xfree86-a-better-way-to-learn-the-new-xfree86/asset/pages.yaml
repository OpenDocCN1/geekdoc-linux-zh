    Click on a form, then click the OK button. The main window changes, and you can
    add widgets or features, and configure widgets, features, or text labels belonging
    to your new form. For example, you can create a nearly complete dialog box (named
    MyForm) for a subsystem of a client, then preview the form (as shown in Figure
