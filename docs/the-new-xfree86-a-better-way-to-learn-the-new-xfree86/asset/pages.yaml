    # Editing XF86Config


    Another solution involves modifying the resolution settings in your system''s
    XF86Config file. Free8 provides special keywords that you can use in the file
    to specify a larger display than your system''s hardware can ordinarily allow.
    These displays are known as virtual resolutions. The XFree86 server handles the
    panning or shifting of the display automatically, regardless of the window manager
    used for your X session.


    # Configuring Virtual Resolution Settings


    If you examine your current XF86Config file, you may or may not have any resolution
    settings. The file most likely will provide these settings when you are using
    X at less than optimal resolutions. The amount of video memory installed on your
    system can also determine whether the file displays the settings. For example,
    if your system provides 2MB of video RAM, and an optimal (that is, hardware-limited)
    resolution of 1,024x768, you may not be able to use a virtual desktop larger than
    the optimal resolution. On the other hand, you must most certainly be able to
    use a virtual screen during X sessions at a resolution of 800x600, because the
    system will not need to use extra video RAM. The color depth of your X session
    will also have bearing, as extra video memory is required as more bit-planes are
    used.


    Virtual resolutions are entered in the "Display" subsection of your XF86Config''s
    "Screen" section, and two keywords are particularly pertinent to the settings.
    The first is the Virtual keyword, followed two integers: a value of X for horizontal
    pixel width, and a value of Y for vertical pixel height. These entries specify
    the resolution, with one caveat: X must be a multiple of either 8 or 16 for color,
    and a multiple of 32 for the monochrome server. The second keyword that you use
    is ViewPort. Like Virtual, the ViewPort setting also requires X and Y entries,
    but in many cases, these entries are set to zero (0). This is because the ViewPort
    setting tells the X server where to place the initial upper-left corner of the
    display.


    Therefore, a system with the capability to display X at 1,024x768 at thousands
    of colors, but only 800x600 in millions of colors, will limit the size of the
    virtual display. In the following example, not all Virtual settings will be available
    at higher resolutions, especially at greater color depths. This example can be
    a good place to start, but you will have to experiment with your system to determine
    the limits of resolution and virtual settings:


    Section "Screen":


    Subsection "Display":


    Depth 8

    Modes "1024x768" "800x600" "640x480"


    ...'
