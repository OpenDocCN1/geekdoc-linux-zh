  md: '# Understanding the X Toolkit


    Although a few clients (such as xmessage) can work as software filters, simply
    obey built-in command-line options and are meant to run as a background process
    with a window display on the desktop. Launching most clients is as simple as taking
    on the shell''s background operator, &, and pressing Enter, as follows:


    ```

    # xterm &

