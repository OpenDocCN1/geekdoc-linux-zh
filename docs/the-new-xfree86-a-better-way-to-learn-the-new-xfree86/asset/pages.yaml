    # Setting Preferences


    Unless you''re employed in a unique business setting or graphics shop, chances
    are pretty good that the component of any office suite you use is the word processor.
    Nearly every user spends a large percentage of time editing text, Web pages, or
    source code. If you work with documents very often, you''ll want to ensure that
    the system creates backup documents, knowing how to set this preference is important.


    To backup preferences for word processing, click the Applix Words icon on the
    floating toolbar to launch the Applix Word processor, then click the Applixware
    menu item in the Applix Words menu bar. You''ll see a drop-menu, as shown in Figure
    11.3.


    Select the Preferences menu item to open the Preferences dialog box. Note that
    this menu, is available whenever you run any of the suite''s modules, also allows
    you to launch another component. When the Words dialog box appears, as shown in
    Figure 11.4, you''ll see a variety of options and preference settings.


    Click the Create Backup Copy radio button, then enter a time, in minutes, between
    backups. The application will then save backup documents at the set interval.
    You can specify a value of zero (0) to turn off this feature, even if you have
    selected the Create Backup option. Unfortunately, this feature does not apply
    to any currently open document. Ideally, you should set this preference before
    beginning a word processing session.'
