    # # Having Trouble with Fonts?


    If you find that fonts are unavailable when you use WordPerfect Office 2000 for
    Linux, make sure that Corel''s office suite is able to access the proprietary
    font server, fontastic. This font server by Bitstream, Inc., replaces or augments
    the XFree FontPath, and is a daemon like the xfs font server. To add the fantastic
    fonts to your X session''s FontPath, use the xset command and its +fp command-line
    option like this:


    ```

    xset +fp tcp://localhost:7102/all

    ```'
