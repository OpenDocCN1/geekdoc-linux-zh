    # Using xlock


    The xlock client, part of the XFree86 contributed software, can be used to provide
    password protection for an idle X session. This client has an extensive list of
    command-line options, and features many different screensaving effects. To see
    a sample of the effects right without password protection, use its -nlock and
    -mode options as:


    ```

    # xlock -nlock -mode random

    ```


    To “lock” your display right away, simply use xlock without its -nlock option,
    as:


    ```

    # xlock

    ```


    After you press Enter, the display will turn blank and screensaving will start.
    To return to your session, click a mouse button or press a keyboard key. The program
    then prompts you to type your password and press Enter before you can return.
    To see a list of xlock''s options, read its man page, or use its -help command-line
    option as:


    ```

    # xlock -help

    ```


    # Using xscreensaver


    The xscreensaver client features a client/server model in which it is a daemon
    component and resides in memory as a process. The xscreensaver-command client
    is then used to control screensaving. Start the process by invoking xscreensaver
    as:


    ```

    # xscreensaver &

    ```


    After you press Enter, you can control screensaving with the xscreensaver-command
    client and its command-line options. For example, to start screensaving, use the
    client like this:


    ```

    # xscreensaver-command -activate

    ```


    To see the current settings, use the -prefs option as follows:


    ```

    # xscreensaver-command -prefs

    ```'
