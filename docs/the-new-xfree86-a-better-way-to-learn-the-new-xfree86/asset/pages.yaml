  md: '# Chapter 10: XFree86 X11 Clients


    This chapter introduces a number of XFree86 clients included with the latest XFree86
    distribution. Several of these clients have been covered elsewhere in this book;
    this chapter will mention those clients, but also provide an overview of some
    commonly used applications.


    XFree86 comes with more than 100 different clients that you can use to configure,
    manage, and run. Table 10.1 lists the clients included with XFree86 4.0.1, specifies
    the client''s file size, and briefly describes each command. You can use this
    table as a quick reference, or to decide whether you really need to install the
    client on your system. Thus the table can help system managers trim the contents
    of /usr/X11/bin directory on those systems with limited resources.


    # # Exploring Base Clients


