    After a minute or so, you can then use the gocr command from the command line
    to perform OCR. First, scan a sheet of text in line-art (black-and-white) mode
    at 300dpi (dots per inch). Next, save the file as a .pbm, .pnm, .jpg, .tiff, .gif,
    or .bmp graphic. You can then perform OCR by using the gocr command as follows:


    ```

