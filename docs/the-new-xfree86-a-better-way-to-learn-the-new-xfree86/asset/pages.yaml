- img_proc: true
  md: '# Chapter 4: Overview of XFree86


    This chapter introduces you to the features and components of XFree86 4.0.1 after
    installation and configuration on your system. Although you''ll find the majority
    of XFree86''s software—such as the XFree86 server, fonts, libraries, drivers,
    and documentation—installed under the /usr/X11R directory, there are other critical
    configuration files and essential elements of X installation. Knowing the location
    of important files and understanding the role that these files play will help
    you when using and managing X for Linux.


    The chapter begins with a discussion of the features, software components, and
    file layout of the XFree86 distribution. You''ll then learn about fonts, some
    essential files found under the /etc/X11 directory, and documentation included
    with XFree86.


    # Features


    The new XFree86 (version 4.0 and 4.0.1) is the result of more than two years''
    effort by The XFree86 Project, Inc. Originally, these efforts were intended to
    redesign X for Intel-based PCs, to improve portability and produce a new, modular
    architecture for the distribution. Along the way, ports of XFree86 (such as FreeBSD,
    NetBSD, OpenBSD, and PPC Linux) have benefited from these improvements to the
    Intel-based distribution. The new architecture means better support for other
    operating systems and hardware platforms, and allows graphics chipset manufacturers
    to release binary-only drivers to support new video cards entering the market.


    One of the most important features of the new XFree86 distribution is the design
    of the XFree86 X server, named XFree86. This server incorporates major changes
    to previous versions; support for all hardware is now incorporated into a single
    server instead of multiple servers. Along with this major architectural change
    to the distribution, other features introduced with the new server include the
    following:


    +   - Reduced size of the configuration file (XF86Config)


    +   - Improved configuration parser (although legacy 3.3.X compatibility for Keyboard
    and Pointer selections has been retained at least through XFree86 4.0.1)


    +   - XINERAMA, a feature that provides কবিত, multiple-screen, and multiple driver
    support


    +   - Support for many additional fonts, font rasterizers, and keyboard internationalization


    +   - Improved probing and built-in configuration support by the server'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# File System Layout


    +   * Modular driver support with common code that all drivers can use

    * Modular library support for sophisticated and complex 3D drawing

    * Peripheral Component Interconnect (PCI) device identification (which aids in
    multhead displays)

    * Incorporation of standard Video Graphics Array (VGA) timing modes

    * Ability to mix color depths on different screens


    The new server benefits from many other improvements, ranging from wider input
    device support to new configuration tools and a runtime loader (based on code
    donated by Metro Link, Inc.). This means that better support for newer video cards
    is introduced a lot faster than in the past.


    # Major Software Components


    The components of this new architecture (and the architecture itself) are discussed
    in detail in the document named DESIGN, found under /usr/X11R6/lib/X11/doc directory.
    You can also find a copy by browsing to http://www.xfree86.org/. What follows
    a simplified overview of the new elements, with a focus on how these elements
    may affect you when installing, configuring, or managing XFree86.


    As you know, you can install XFree86 while installing Linux, by compressed tarballs
    (such as file.tar.gz or file.tgz) and an install script from The XFree86 Project,
    Inc., or through other software package-management systems as Red Hat''s RPM,
    or front-end clients like KDE''s kpackage or GNOME''s gnome.


    The majority of the software is installed under the /usr/X11R6 directory tree.
    Depending on your system and your requirements, this directory tree can include
    additional documentation, such as man pages; additional libraries, such as add-on
    toolkits like OpenMotif, additional development and programming support, such
    as libraries and documentation; and additional fonts and clients.


    # File System Layout


    The majority of software, fonts, and files included with XFree86 are found under
    the /usr/X11R6 directory. However, other elements, such as configuration files,
    are included under the /etc/X11 directory, and some services, such as the xfs
    font server, may be started by a system initialization script under /etc/rc.d/init
    d (which is specially common on Red Hat-based Linux systems). Software developers
    should become familiar with XFree86''s layout for #include files and development
    libraries, which are essential to the creating new files for X.


    Table 4.1 lists the major directories and briefly explains each directory''s contents.'
  merge: -1
  pgno: 86
