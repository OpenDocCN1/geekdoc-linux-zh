  md: '# Usenet Newsgroups


    Finally, if you''re a registered user of a commercial Linux distribution, always
    check the company''s Web site for support issues, bug fixes, or updates. If you
    have a problem getting a particular graphics card to work with XFree86, check
    the card''s manufacturer for possible Open Source drivers or other support—and
    ask the manufacturer to provide support for Linux!


    # Usenet Newsgroups


    This section lists some Usenet groups with discussions focused on X11 and specific
    computer platforms. If you have a question regarding a problem with X, XFree86,
    or Linux, make sure that you follow these guidelines:


    +   - Always post your question in the correct newsgroup.

    - Don''t post across many groups.

    - Always use a clear subject line in your post.

    - Don''t rant and use obscure language; you''ll be ignored.

    - Include as technical information about the problem as possible, such as the
    type of graphics card, Linux kernel, XFree86 distribution version, and so on.


    Here then the Usenet groups:


    +   - comp.os.linux.x—discussions about Linux and X.

    - comp.unix.aux—discussions about Apple''s defunct AU/X.

    - comp.unix.freebsd—discussions about FreeBSD.

    - comp.unix.netbsd—discussions about NetBSD.

    - comp.unix.openbsd.misc—discussions about OpenBSD.

    - comp.unix.cde—discussions about Common Desktop Environment.

    - comp.unix.machen—discussions about Tenon''s BSD for MacOS.

    - comp.unix.osf1—discussions about OSF/1.

    - comp.unix.programmer—discussions about programming under UNIX.

    - comp.unix.tru64—Tru64 UNIX discussions.

    - comp.windows.x.announce—announcements about X.

    - comp.windows.x.apps—discussions about X-based applications.

    - comp.windows.x.i386unix—discussions about X for UNIX PCs.

    - comp.windows.x.intrinsics—X Toolkit library discussions.

    - comp.windows.x.kde—KDE and X discussions.

    - comp.windows.x.motif—all about Motif.

    - comp.windows.x—discussions about X in general.'
