  md: '# Testing Clients


    After you XFree86, but you install the new version on your system, you can quickly
    test a few clients on your existing system by extending your system''s soft-library
    path to include any required new software libraries. For example, if you navigate
    to the xc/programs/xclock directory, then you can use the ldd command to show
    any shared library dependencies of the new xclock client, as follows:


    ```

    $ ldd xclock

    libXaw.so.7 => not found

    libXmu.so.6 => /usr/X116/lib/libXmu.so.6 (04001c000)

    libXt.so.6 => /usr/X116/lib/libXt.so.6 (04002f000)

    libSM.so.6 => /usr/X116/lib/libSM.so.6 (040081000)

    libICE.so.6 => /usr/X116/lib/libICE.so.6 (04008c000)

    libXpm.so.4 => /usr/X116/lib/libXpm.so.4 (0400a4000)

    libXext.so.6 => /usr/X116/lib/libXext.so.6 (0400b4000)

    libX11.so.6 => /usr/X116/lib/libX11.so.6 (0400c1000)

    libXaw.so.6 => /lib/libXaw.so.6 (040173000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (04000000)

    ```


    After you press Enter, you will see a list of libraries that the client requires.
    As you can, the command did not find a new library named libXaw.so.7. You can
    then add the new library, found under the xc/lib/Xaw directory, as follows:


    ```

    $ export LD_LIBRARY_PATH=$d3/x11r6free86/xc/lib/Xaw

    ```


    In this example, the source and build directories reside on / /d3/x11r6free86
    in the xc directory. However, you may need to add an additional new library to
    this path if a new function is missing in the older libraries. For example, when
    you try to run the new xclock, you may see the following output:


    ```

    $ .xclock

    ./xclock: error in loading shared libraries: \

    /d3/x11r6free86/xc/lib/libXaw.so.7: undefined symbol: \

    XmuCvtGravityString

    ```


    Here you can see even though the older ldd command deemed the older Xmu library
    sufficient, the newer library may include a new function. You can then simply
    add the path, using the LD_LIBRARY_PATH environment variable:


    ```

    $ export LD_LIBRARY_PATH=$d3/x11r6free86/xc/lib/Xaw: \\

    /d3/x11r6free86/xc/lib/Xmu

    ```


    After you press Enter, you can then run the xclock client:


    ```

    # .xclock

    ```'
