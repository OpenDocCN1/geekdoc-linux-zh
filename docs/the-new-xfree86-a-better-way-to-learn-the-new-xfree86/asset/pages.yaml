  md: '# Chapter 21: Using Qt and KDE


    This chapter provides a short overview of the Qt and KDE toolkits to build a simple
    KDE client. You''ll learn about licensing considerations, how to download and
    install the Qt and KDE development libraries, and how to set up a graphical development
    client used for developing complex KDE clients.


    # Understanding Licensing Issues


    As you''ve already learned, many different software licenses are applied and used
    in a Linux distribution and for X11 software. Some software is distributed in
    source code form under the GNU General Public License (GPL), whereas other packages
    are proprietary, binary-only clients. XFree86 and its fonts, documentation, source
    code, and graphics are copyrighted by the XFree86 Project, However, portions are
    copyrighted and owned by the X Consortium, Inc., and the majority of code is covered
    by a Berkeley-based copyright. New distributions of XFree86 also contain copyrighted
    material from NVidia, Inc.


    # Open Source Versus Proprietary Licensing


    The spectrum of software licensing ranges from the GNU GPL to source-binary, single-user
    packages. The GNU GPL, along with the Lesser GPL, offers the greatest freedom
    for software developers. However, the GPL generally mandates distribution of source
    code or source changes to Open Source software. Although the K Desktop Environment
    and many of its clients are distributed under the GNU GPL, KDE''s base of libraries
    was built using the Qt Free 2.1 toolkit.


    This toolkit is distributed under the Q_Public License (QPL), which is copyrighted
    by Trolltech AS. One of the limitations of using this license is if you use the
    Qt toolkit to create commercial software, you must purchase a license for Trolltech''s
    Qt Professional Edition of the Qt libraries. This is unlike GNOME and its many
    clients, which are unencumbered by restrictive licensing. Although the Qt toolkit
    technically falls under the category of Open Source software, and its future is
    certainly protected by the KDE Foundation, you must consider licensing you to
    create and sell software using this toolkit.


    Another consideration is that if you find a problem with a function call in the
    Qt toolkit and create a fix, you may not distribute the fix with a modified library
    unless'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# Programming with Qt and KDE


    you first contact Trolltech. You will also not get technical support unless you
    have purchased the Qt Professional Edition.


    # Breaking News About Qt 2.2.1


    The latest release of Qt at the time of this writing is Qt 2.2.1, which is basically
    a maintenance fix. By the time that you read this book, most commercial Linux
    distributions will include this toolkit or a newer version. The previous release,
    version 2.2, was a major upgrade, with compatibility added for other operating
    systems, graphical user interface (GUI) drawing improvements, and the use of different
    "modules," or source components, of the toolkit library. The latter change organized
    the library''s widgets into various sets according to function, such as GUI controls,
    dialog boxes, and networking.


    The previous stable version of Qt was 1.44. At this point, you must use the newer
    libraries if you want to run clients developed with Qt 2.0 and the higher Qt 1.44
    libraries provide the only support for earlier clients.


    # Downloading and Installing Qt and KDE Libraries


    Although you can download and install Qt and KDE from a source, a much easier
    way to install or upgrade your system is to software archives used by your system.
    For example, users of Red Hat Linux-based systems will want to download the requisite
    of .rpm packages. A minimal installation of KDE 2.0, along with Qt 2.2.1 and all
    development files and libraries, requires 27 .rpm archives that will take up more
    than 63MB hard drive space. Table 21.1 lists these archives and describes their
    contents.


    The library .rpm archives should be installed first, followed by support and utility
    packages. If you receive any dependency errors, install the required package first.
    After installation, you''ll be able to start KDE 2.0 and begin designing your
    clients.


    # Programming with Qt and KDE


    A full overview of programming KDE clients using the Qt toolkit and additional
    KDE 2.0 development libraries is beyond the scope of this book. However, you can
    use one or more of the sophisticated development tools included with these distributions
    to take a few shortcuts on the path to learn more about Qt and KDE. The important
    thing to remember is that although Qt provides a high-level widget toolkit, you''ll
    also need to use KDE''s software toolkit to develop KDE 2.0-compatible clients.'
  merge: -1
  pgno: 414
