  md: '# Starting X Remotely


    To go to the other X session, press Ctrl+Alt+F7, and press Ctrl+Alt+F8 to return.

    From your current session, you can go to another text-only session by pressing
    Ctrl+Alt+F3. To go back either X session, press Alt+F7 or Alt+F8.


    In general, the start client provides an easy way to pass command-line arguments

