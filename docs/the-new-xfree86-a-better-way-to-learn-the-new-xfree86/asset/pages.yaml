    # # Configuring Enlightenment


    One of the earliest window managers to support GNOME was Enlightenment, this accelerated
    window manager may be used with or without GNOME. Developed by Carsten Haitzer
    and Geoff Harrison, Theme support was an early feature of Enlightenment. At one
    time, Enlightenment was destined to be the premier window manager for use with
    GNOME, but the client has evolved to include many of its own desktop environment
    features.


    Enlightenment stores most of its information on a per-user basis in a subdirectory
    named .enlightenment in your home directory. In this subdirectory, you’ll find
    backgrounds, icons, and themes directories, although the four default Enlightenment
    themes and other information are stored under your system’s /usr/share/enlightenment
    directory.


    Enlightenment is quite easy, as this window manager has an accompanying graphical
    configuration tool named e-conf. You can launch this tool from the GNOME window
    manager dialog box in the GNOME Control Center, or from the command line of an
    X11 terminal window, as follows:


    ```

