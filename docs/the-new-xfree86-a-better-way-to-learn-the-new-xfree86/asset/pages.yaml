  md: '# Configuring the fwwm95 Window Manager


    The fwwm95 window manager, by Robert Nation, is based on fwwm2 and adds improvements
    such as a hierarchical start menu and a taskbar. As with the earlier versions,
    you can build custom menus and change effects by editing a configuration file.


    If you build and install fwwm95 from source, the majority of this window manager''s
    support files will be located under the /usr/local/lib/X11 directory. To build
    and install fwwm95, download and decompress the source, navigate into the source
    directory, then use the package''s configure script and make the command like
    this:


    ```

    # tar xvzf fwwm95-2.0.43a-Autocf.tgz

    # cd fwwm95

    # ./configure; make install

    ```


    The system-wide configuration file, system.fwwm95rc, will be found under the /usr/local/lib/X11/fwwm
    directory. Again, with twm and fwwm2, copy the system.fwwm95rc as .fwwm95rc and
    save it in your home directory to make your customizations. The configuration
    file consists of sections for fonts, windows, modes, menus, startup, and mouse
    and keyboard bindings.


    For example, one mode customization issue regarding pointer movement and window
    placement is that of focus, or when or how a window should be made active. You
    can select from one of the following modes:


    +   Style *** ClickToFocus

    Style *** MouseFocus

    Style *** SloppyFocus


    This example, taken from the default system, fwwm95rc file, does not make a window
    active until the user clicks the window or its contents. If you prefer that a
    window becomes active when the pointer hovers over a part of the window and then
    becomes inactive when the pointer does not hover over any portion of the window,
    uncomment the MouseFocus line—that is, remove the pound sign (#) in front of the
    line—and place a pound sign in front of the ClickToFocus line. If you use the
    SloppyFocus setting, a window will become active after the pointer passes over
    the window, but will stay active after the pointer is no longer hovering


    Another mode to enable conjunction focus is whether or not to have a window that
    is active be placed over any other windows. To do this, you''ll need to uncomment
    the following section:


    ```

    # "I" Module FwmAuto 500

    ```


    In this example, if you click on a window''s title bar, it will automatically
    be placed on top of any overlapping windows.'
  merge: -1
