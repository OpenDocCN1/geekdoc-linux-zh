  md: "# Using the make Command\n\nThe make command included with most Linux distributions\
    \ is GNU make, and was developed by Richard Stallman Roland McGrath. The make\
    \ command has long been the standard programming assist tool, even in the face\
    \ of newer software tools such as autoconf (see the section “The autoconf Command”).\
    \ The make command generates new commands using directions or rules contained\
    \ in a default file named Makefile; however, you can actually use any filename\
    \ if you run make with its -f option, by the name of the file containing the list\
    \ of dependencies.\n\nThis section describes a short Makefile. The structure of\
    \ a basic Makefile is fairly simple, but you can quickly and easily add different\
    \ elements to add to its usefulness. For example, to build a small project with\
    \ a single file gcc and the basic X11 libraries, you can enter the following:\n\
    \n```\nCC = gcc\nINSTALL = /usr/local/bin\nIN = -I/usr/X11R6/include\nLIBS = -L/usr/X11R6/lib\
    \ -lX11 -laxaw -lext\nOBJS = main.o\nmyclient = $(OBJS)\n\t$(CC) -o myclient $(OBJS)\
    \ $(INCLUDES) $(LIBS)\nt:\ninstall:\n\tinstall -fr .o root myclient $(INSTALL)\n\
    clean:\n\trm -fr *.myclient\narchive:\n\ttar cvf ../myclient.tgz\n```\n\nThe first\
    \ five lines of this example define the compiler (gcc), the directory under which\
    \ the client will be installed the libraries required to support the client (named\
    \ myclient), and the name of the object files required for linking (main.o). Following\
    \ these definitions are lines describing the commands to be created and used to\
    \ build, test, install, clean up, and archive the project. Note that you must\
    \ enter a Tab character at the beginning of each command-line definition.\n\n\
    You can type and save the listing in a file named Makefile, which is intended\
    \ to reside in the same directory as the source. To build the project, use the\
    \ make command as follows:\n\n```\n$ make\ngcc -c main.c -o main.o\n```"
