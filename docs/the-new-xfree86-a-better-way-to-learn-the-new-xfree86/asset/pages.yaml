  md: '# Downloading and Installing Open Motif


    You can download Open Motif from the Open Motif developer''s home page (see “Resource
    Information” at the end of this chapter). First, click the Download Open Motif
    link. You''ll then see another page with links to download the software or to
    order the software on CD-ROM (which includes all versions, binaries, documentation,
    and source).


    You need to supply your name and a valid email address. Packages are available
    in Debian''s .deb, rpm''s .rpm, and tar''s .tgz format. For compressed tarballs
    and most Linux systems, you can use the following:


    +   - openmotif-2.1.30-linux-i386.tgz, a 26.5MB compressed tarball of binary runtime
    files for most Linux distributions

    - openmotif-2.1.30-src.tgz, an 18MB archive containing the source code to the
    runtime libraries of Open Motif

    - openmotif-devel-2.1.30-linux-i386.tgz, a 26MB file containing the development
    libraries, header files, and documentation for developing Open Motif clients

    - openmotif-2.1.30-2_ICS.src.tgz, a 17MB archive containing the source to Open
    Motif


    The current version is 1.30, which was released in December 2000. Like LessTif,
    Open Motif is available for a variety of computer platforms, operating systems,
    and Linux distributions. Binary distributions are available for Linux on Compaq
    CPUs, ia64 platforms, Intel-based PCs, SPARC workstations, PowerPC platforms,
    and FreeBSD (Intel only).


    Open Motif development requires that you download and install the runtime and
    development archives. After downloading, decompress the source archive like this:


    ```

    # tar xzvf openmotif-2.1.30-2_ICS.src.tgz

    openmotif-2.1.30-icsbuild.patch

    openmotif-2.1.30-icsextra.tgz

    openmotif-2.1.30-mwm.patch

    openmotif-2.1.30-src.tgz

    ```


    The latest release includes some patch files. Next, decompress the source code
    like this:


    ```

    # tar xzvf openmotif-2.1.30-src.tgz

    ```'
