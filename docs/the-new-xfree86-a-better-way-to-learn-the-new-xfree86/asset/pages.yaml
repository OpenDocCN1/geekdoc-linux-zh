    ```


    In older distributions of XFree8 and Linux, the default configuration does not
    include a menu item to launch a terminal window. This means that unless you first
    launch a terminal window and then start twm, you have no access to a terminal
    window. Fortunately, newer Linux and XFree8 distributions (such as Mandrake) now
    include a menu item for at least launching the xtterm client. To insert a menu
    item for xterm or any terminal client, add a definition such as the following:


    ```

    "Launch xterm client" f.exec "exec xterm &"

    ```


    Save the file, then restart X. The next time that you use twm, you''ll be able
    to launch a terminal window.


    # Configuring the fwm2 Window Manager


