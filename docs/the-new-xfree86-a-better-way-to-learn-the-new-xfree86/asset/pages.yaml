  md: '# Introduction


    Welcome to the new XFree86! This book is for readers who want to learn more about
    the X Window system, a fascinating and capable networking graphic interface for
    UNIX, Linux, and other operating systems. This book is all about helping you,
    the reader. You''ll better understand how the X Window system (also known as X11)
    and the XFree86 Project, Inc., come into being. You''ll also learn how to install
    and configure a version for your computer, and see how to use X11, or X, more
    efficiently. If you take the plunge, later chapters will show you how to compile
    and write programs for X, starting with the basics, and then using today''s high-level
    toolkits.


    There''s a growing interest today in using and programming for X. One of the reasons
    for this interest is the explosive growth in the installed user base of operating
    systems such as Linux and FreeBSD. Another is that as computer software and hardware
    companies search for new ways to bring more power to the desktop or embedded systems
    by introducing even faster and more capable computers, they are discovering that
    they no longer have to be behold to a monopolistic software industry; there are
    better, faster, and royalty and license-free solutions for crafting better, faster,
    and more efficient human-computer interfaces. One of these solutions is X. This
    book is about one of the most popular versions of X, XFree86 from the XFree86
    Project, Inc. XFree86 is one of the reasons for this book, and this book is being
    written partially to celebrate the latest version of XFree86, version 4, which
    was two years in the making.


    The main focus of this book is using XFree86 for Linux on Intel-based PCs. However,
    you''ll find that no matter what platform you use for X, the majority of techniques,
    and tricks outlined here can here apply to your environment. You''ll also find
    coverage of other operating systems, such as BSD UNIX and its variants, OpenBSD
    and FreeBSD. If you''re an Apple Macintosh user, you''ll also learn about configuring
    and using X on that platform. In other words, I hope to present enough information
    in this book to help more than just Linux PC users.


    It is important to learn about X and how to use it, for many reasons. One reason
    is to broaden your knowledge of computer operating system interfaces and networking.
    Another is to become aware of cheaper, faster, and more secure graphical interface
    and network alternatives that exist despite the current monopolistic software
    industry. X can be a perfect solution, as you can use it to develop commercial
    products and environments without the worthy of royalties or paid licensing. Another
    reason to learn about X is although it is not as mature as UNIX, its architecture
    is tested, stable, and proven.'
  merge: -1
  pgno: 22
