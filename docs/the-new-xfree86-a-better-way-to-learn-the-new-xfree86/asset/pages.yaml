  md: "# Chapter 6: Starting X11\n\nThe script contains logic that chooses the display\
    \ manager, based on the contents of the file named desktop under the /etc/sysconfig\
    \ directory:\n\n```\n...\n# Run preferred X display manager\npreferred=\nif [\
    \ -f /etc/sysconfig/desktop ]; then\n  if grep -q GNOME /etc/sysconfig/desktop\
    \ 2>/dev/null; then\n    preferred=gdm\n  elif grep -q KDE /etc/sysconfig/desktop\
    \ 2>/dev/null; then\n    preferred=kdm\n  elif grep -q AnotherLevel /etc/sysconfig/desktop\
    \ 2>/dev/null; then\n    preferred=xdm\n  fi\n```\n\nfi\n\nThe preceding excerpt\
    \ is just a portion of the predef shell script used by Mandrake Linux 7.0. However,\
    \ as you can see, the desktop file is parsed for the keywords GNOME, KDE, and\
    \ AnotherLevel to determine the display manager. You do not have to use this approach;\
    \ instead, you can define your own entry to determine the display manager. However,\
    \ if you choose to define your own entry, depending on your system, other configuration\
    \ scripts or clients may may not work properly. The best approach is to understand\
    \ the runlevel configuration system used by your distribution.\n\n# Using and\
    \ Configuring xdm\n\nThe xdm client is controlled by a series of files under the\
    \ /etc/x11/xdm directory. These files, listed in Table 6.1, determine the X server\
    \ to use, access permissions, the hosts that you may log on or from, the default\
    \ appearance of the chooser dialog box, and security settings for failsafe or\
    \ terminal usage. Some Linux distributions also use third-party commands, such\
    \ as the xbanner client, to spin up the initial display (which can be handy for\
    \ customizing xdm logins in an academic or corporate environment).\n\nYou'll also\
    \ find a subdirectory named authdir under the /etc/X11/xdm directory. This directory\
    \ might also contain another directory named authfiles, which contains authentication\
    \ files used for security to enable the X session; also note that on some systems,\
    \ the directory may be a link to the /var/lib/xdm directory.\n\nIf you have properly\
    \ installed and configured X, but generally use a text-only display, you can start\
    \ the xdm client (as root) from the command line using its -nodemon option as:\n\
    \n```\n# xdm -nodemon *\n```"
