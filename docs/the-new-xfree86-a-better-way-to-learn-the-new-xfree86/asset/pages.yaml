  md: '# Resource Information


    Next, you need to download XFree86 4.0.1 from the Cygwin site, then copy, decompress,
    and extract the archives in the root Cygwin directory on your Windows hard drive.
    This download requires an additional 60MB of hard drive space.


    According to the Cygwin folks, all you need to do is double-click the file named
    startx.bat via Windows Explorer, and X will start in full-screen mode. You''ll
    be able to access other X desktops for your LAN and enjoy the benefits of X.


    # Exploring Commercial Servers


    You can still buy a commercial X server for Intel-based PCs running Linux from
    at least two sources: Metro Linux, Inc., and Xi Graphics. These servers offer
    so many advantages that you may find better support and performance for a particular
    family of graphics cards, or support for the newest and latest graphics cards.
    Most Linux users happily conduct business using XFree86, if you are in a commercial
    production environment and need extra bit of performance when using X, you can
    turn to a commercial server.


    If you''re a Windows user, you can also check StarNet-X-Win32 commercial X server
    for Windows, which includes a terminal application along with a secure-shell solution
    for X. Other products include Hummingbird''s Exceed, XLink''s Omni-X, and Plexus
    System''s X-Deep/32 for Windows. In the past, many of these packages were exceedingly
    expensive, but with the advent of Open Source software and free software from
    the GNU project, many packages are now reasonably priced and with technical support
    and upgrades. But don''t be surprised if some are just like XFree86!


    # Resource Information


    http://www.metrolink.com—home page for the commercial Metro-X server for Linux.


    http://www.xig.com—home page for the commercial X server from Xi Graphics; there
    are versions for laptops and desktops.


    ftp://sunsite.utk.edu/pub/cygwin/latest/—one of many mirrors for the Cygwin SETUP.EXE
    command and related software.


    http://cygwin.com/xfree/docs/howto/book1.htm—detailed instructions on downloading
    and installing Cygwin and XFree86 for Windows.


    http://www.uk.research.att.com/vnc/xvnc.html—home page for downloading the latest
    version of Xvnc.'
