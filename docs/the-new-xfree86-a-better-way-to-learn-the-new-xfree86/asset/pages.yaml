- img_proc: true
  md: '# Limit Shell Accounts!


    Although a shell account can be a handy tool in the right hands, not every-one
    on your LAN (or company) should have access to the shell. For security reasons,
    always limit shell accounts.


    Now dial to the server named stinky and establish a connection. On the remote
    computer (greenie), open two X terminal windows. On one, use the telnet command
    to get on the server and ensure that the $DISPLAY variable is set to the $DIS-PLAY
    of the remote computer, as follows:


    ```

    [stinky]$ export DISPLAY=greenie:0.0

    ```


    Next, run the dxpc program in this window as a client:


    ```

    [stinky]$ dxpc -f s1

    dxpc proxy running in CLIENT mode

    ```


    The dxpc command will show a status report (in client mode on the remote server).
    The extra options can process the for and enable compression reports to std-out.
    Next, reset the DISPLAY variable as follows:


    ```

    [stinky]$ export DISPLAY=unix:8

    ```


    The unix:8 display used by the dxpc command (when the computer is running as a
    server), provides an address used to display clients – the dxpc command is "mimick-ing
    an X server, and uses the unix:8 display. Now, the terminal window of the remote
    computer (greenie), use the dxpc command in server mode, specifying the remote
    computer as follows:


    ```

    [greenie]$ dxpc -f stinky

    dxpc proxy running in SERVER mode

    ```


    After you press Enter, the dxpc command will run as a server and intercept requests
    from remote clients, display them locally. You can now launch clients from the
    server''s terminal window (stinky''s in this example) and they will run over your
    serial PPP connection. Versions of dxpc are available for number of computer platforms
    and operating systems, including Solaris, Windows, HP/UX, and Digital Unix. You
    can use this software to easily set up a telecommmuting connection, and with faster
    serial lines, even run graphical remotely with acceptable performance. Browse
    to http://www.vigor.nu/dxpc/ for more information.'
  merge: -1
