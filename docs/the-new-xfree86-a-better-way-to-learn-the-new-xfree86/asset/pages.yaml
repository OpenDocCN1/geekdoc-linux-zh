  md: '# Chapter 9: X11 on a Network


    his chapter provides information on how to use X on a network, and builds on topics
    previously introduced regarding how to start X, launch clients, and use terminals.
    You''ll see how to use X to build a powerful and flexible graphical network using
    simple techniques and a minimum of rote skills. This chapter will cover some initial
    considerations in setting up a network, then provide the details on how to perform
    remote logins and launch clients, even over a dial-up PPP connection.


    Even XFree86 performs admirably as a standalone workstation and provides a superior
    graphical interface for Linux users, the real power of X becomes apparent when
    used with other workstations or servers. X has a long history of network reliability,
    and was designed from scratch with networking in mind. As you learned in Chapter
    6, "Starting X11," low-end Linux workstations, along with the right displays,
    can be part of a cost-effective but efficient LAN. This chapter builds on the
    concept of using XFree86 in a network environment. You''ll learn the basics of
    using X on a network, configure remote logins, and see how to launch clients locally
    from a remote station or remotely from a local workstation. Chapter will also
    cover some basic security issues that you should be aware of, with potential solutions
    and troubleshooting suggestions hopefully providing answers to common problems.


    # Setup Considerations


    When you are setting up XFree86 to work on a network, the same basic considerations
    that go into planning an efficient network for other operating systems can apply.
    These considerations include an outline and thorough review of the purpose, requirements,
    cost limits, user needs, security, and support issues facing the network. One
    of your worst worries is about using Linux and XFree86, as both distributions
    are flexible enough to conform to many different situations, from a wide area
    network (WAN) to a local area network (LAN), a company intranet, or even embedded
    device development. Other factors in Linux and XFree86 as a cost-effective solution
    include the fact that both distributions are royalty and license free, with work
    nearly any hardware platform, and come with source code. The cost of using commercial
    operating systems with server features is nearly $1,000 for only five users.


    # Overview of Clients and Servers


    The networking aspect of X is based on a client/server model, with the X server
    handling nearly every aspect of client display, such as drawing, providing fonts,'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Setup Considerations


    15


    transmitting pointer and keyboard events, and so on. The X server handles tasks,
    so that only the graphics hardware hosting the server is of any importance to
    the underlying code. This abstraction, in response to client requests, allows
    the server to create desktops and displays on remote hardware successfully without
    knowing about the particulars of the remote hardware, and increases the portability
    of the server code.


    The basic components of the X client and server model include the X server, which
    reacts to requests (or commands) sent by X clients (applications). These requests
    are in the form of X protocol requests, and the clients may be running locally
    from a remote server. This model can be confusing initially, but once you understand
    the basic concepts, you will see that you can configure X flexibly to fit a variety
    of network models.


    As of the X parallel file and disk server networks. Although you can use X in
    this (using X terminals focused on a central server), you can also use X in a
    way that models a distributed network. Again, you can launch X clients locally
    or remotely on any workstation running an server, as long as proper permissions
    exist. By transmitting and receiving graphics requests and keyboard and mouse
    input events, the X display server allows local client launch and display, remote
    client launch and display, and local display of remote client launches. This means
    that you can run and display remote X clients locally on an Intel-based PC, even
    if the remote computer is an Apple Macintosh running XFree(or the reverse—and
    run Intel X clients, such as Sun''s StarOffice suite, to display on your Macintosh)


    Linux, with its support of networking protocols and filesystems, is perfect complement
    to the capabilities of XFreeBee. By using a combination of each system''s features,
    you can quickly craft creative solutions to provide pinpoint solutions suitable
    for a wide array of computational needs and budgets.


    For example, a text-based environment without the benefits of using X, Linux supports
    the ability to log in and work on remote workstations or servers (through the
    telnet or ssh utilities). Linux also supports the mounting of remote filesystems
    locally, in a heterogeneous system (using the Network File System, NFS, NetaTalk,
    and Samba). When you factor in a networking graphical system such as X, which
    supports display and use of clients locally or from a remote computer, you''ll
    quickly realize the benefits of using Linux and X.


    # Considerations


    Every network design involves planning considerations of needs, availability,
    flexibility, use, security, and costs. A variety of会不会 are used, as total cost
    of ownership, cost per seat, and even performance benchmarks. Obviously, the target
    is to get the most computational "bang for the buck," but other factors can be
    important, such as future upgrade, maintenance, or administration costs.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Chapter 9: X11 on a Network


    Some factors in favor of X include its independence of operating systems. There
    are X servers and clients (close variants) for almost every hardware platform
    available, even Personal Digital Assistants (PDAs)! In the recent past, dedicated
    X terminals—or hardware with adequate display, input, and performance to support
    a minimal X server—were part of the formula in X network design. X terminals generally
    lacked traditional hard drive, RAM, and other storage space, and therefore cost
    less than workstations that could also function in a server capacity. Today, these
    terminals are being resurrected as network appliances, and can again be part of
    the efficiency in efficient network design.


    Obviously, no one would seriously consider building an X network consisting of
    PDAs, but hardware costing the same or less can be purchased and put to work as
    terminals. When companies face horizontal scaling (adding more workstations to
    the network), expenses can mount quickly. Obviously, the capabilities of hardware
    on the network will vary, and depend on the functions or processing needs of parts
    of the network (in other words, the design and shipping departments will have
    different workstations).


    However you design your network, you''ll find XFree86 a solution that provides
    benefits of flexible user interaction, graphics output, transparent networking,
    hardware interoperability, and room to grow.


    # Remote Sessions


    There are a number of ways to conduct an X session on a network. For example,
    you can log in to Linux on your workstation, start X, then launch clients that
    display locally. Another way is to use an X display manager to log in to a remote
    computer and run a X session on your local display. And yet another way is to
    launch a local X session, use the telnet command to log in the remote computer,
    launch clients from the remote server, then they display locally.


    A properly defined $DISPLAY environment variable is crucial when using X. A display
    name is assigned to every X server on your network, and usually consists of the
    hostname, a display number, and a screen number. Knowing the display is necessary
    if you want to launch remote clients for local use or launch a client for use
    on remote display.


    For example, when you log in to Linux and launch X on the workstation named stinky,
    the $DISPLAY environment variable for your session will look like this:


    ```

    stinky:0.0

    ```


    The variable could also look like this:


    ```

    :0.0

    ```'
