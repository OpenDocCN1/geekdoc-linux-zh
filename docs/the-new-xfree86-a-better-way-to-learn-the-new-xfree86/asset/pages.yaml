  md: '# Video and Animation Clients


    Video and animation playback, first ushered into the personal computer realm only
    a few years ago, is now almost a necessity for online viewing, especially now
    that personal computers feature more RAM and hard drive storage. With the advent
    of the next phase of the communications revolution and the introduction of universal
    broadband access for most Internet users, the capability to watch video and animation
    locally or the Internet is finally being realized.


    # Animation Clients


    One animation and video clip playback client is Mark Podlip''s xanim player. This
    client is a staple addition to many Linux distributions, and can play back more
    than a dozen different animation and video clips formats, including QuickTime
    and .avi clips.


    You can start this from the command line, specifying the command along with the
    name of the video clip, like this:


    ```

    # xanim *.avi

