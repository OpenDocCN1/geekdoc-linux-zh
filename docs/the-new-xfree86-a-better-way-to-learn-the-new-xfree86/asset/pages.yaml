    # Using KDE System Sounds


    Although changing your KDE windows or background or using a different theme can
    provide visual stimulation, you can also use a specific sound for specific KDE
    or AOL Instant Messenger events during your X sessions. KDE 2.0 recognizes 38
    separate system notifications and window events to which you can assign a sound.
    Table 16.2 shows a list of these events, such as opening or closing windows, along
    with integral AOL Instant Messenger events.


    # Table 16.2. KDE and AOL IM System Sound Events


    | System | Events |

    | --- | --- |

    | System Notification | No match found; more than one match found; cannot open
    the file; serious program error and exit; log out; start up; program error; miscellaneous;
    desktop has changed |

    | Window Event | Another is active; close; restored; deleted; virtual desktop
    selected; identified; maximized; done moving; new window; done resizing; being
    resizing; shade; made sticky; dialog deleted, dialog box |

    | AOL Event | Buddy list member offline; buddy list member online; message arrival;
    message sent; now offline; now online; warning |'
