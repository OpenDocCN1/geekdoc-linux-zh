    # The AfterStep Window Manager


    The AfterStep window manager, based on fwm, provides a similar look and feel as
    another well known but perhaps less popular commercial operating system known
    as NeXTSTEP. Like each of the previous window managers with virtual desktops,
    AfterStep provides a pager in its root display. A windowlist, or taskbar, is placed
    along the top of the desktop, and a wharf is used to provide rapid access to X
    clients. Among AfterStep''s most notable features are its desktop menu (accessed
    by left-clicking the blank area of the desktop), the number of windows placed
    in window titlebars, the use of themes (comprehensive look-and-feel desktop schemes),
    and pop-up help displays appear when the pointer hovers over a window decoration.


    AfterStep''s default settings are contained in numerous files, with system settings
    under the /usr/share/afterstep or /usr/local/share/afterstep directories. User
    settings are located in a user''s home directory in a subdirectory named GNUStep.


    You can launch this window manager, like others, using the start command if you
    include it in your home directory''s .xinitrc file:


    ```

    afterstep

    ```


    When your X session starts, the AfterStep desktop appears, as shown in Figure
    5.5.'
