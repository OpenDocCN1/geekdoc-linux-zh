  md: '# Chapter 1: X11, XFree86, and Linux


    his chapter provides a small bit of historical background about X, XFree86, and
    other X distributions for Linux. The lineage of X, its various revisions, and
    how X ported to Linux comprise a fascinating story of the potential of collaborative
    programming, the power of the Open Source movement, and the efforts of thousands
    of programmers around the world. Although the idea of providing a graphical interface
    began at Xerox''s Palo Alto Research Center in the middle of 1970, many of the
    windowing solutions available for Linux would not be available today without the
    quirks of part and history of X11 and the XFree86 Project, Inc.


    # The Early X11 Distributions


    Development of X started in 1984 at the Massachusetts Institute of Technology
    (MIT) as part of Project Athena, an effort to build a portable graphical interface
    to enable the use of worksheets in the teaching process. Based on earlier work
    at Stanford (a system named W), X was originally developed by Jim Gettys of Digital
    Equipment Corporation (DEC) and Ron Newman and Bob Scheifer of MIT.


    Commercially released in 1986 as X10.4, X quickly evolved to X11R1 (X11, revision
    1) the following year, and within a year to X11R2.


    The appeal of X is in no small part to several important features:


    +   * **Portability**—X works with nearly every known graphics system capable
    of pixel addressing or bitmap display.

    * **Standardization**—The X Window System provides a standard set of libraries
    and function calls that allow programmers to concentrate on developing clients
    instead of worrying about how to work with graphics hardware.

    * **Networking**—X11 was built from the ground up to support networking, and it
    over a variety of media, such as Ethernet or serial network connections.

    * **Modular Architecture**—Features and support for new technologies can be added
    to X without major difficulty, due to the fact that X is officially distributed
    in source form only.


    X was released under the largest of the MIT X Consortium, a nonprofit organization
    supported by nearly every computer manufacturer at the time. Today, most Linux
    distributions use X11R6.3 or X11R6.4, although X11R6.5,1 was released late in
    2000.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# The Early Days


    X has the basics for developing and running a networking graphical interface right
    from the start. One of the earliest releases, X10R3, worked with only six different
    displays. But this 7MB, source-code–only X distribution supported color, overlapping
    windows, and copy and paste operations, and came with a terminal emulator, a clock
    client, and other example clients.


    The September 15, 1987 release of X11R1 was a “major redesign and enhancement
    of X,” according to MIT’s announcement document included in the distribution.
    Contributors included researchers at MIT, with all programmers from Apollo, DEC,
    HP, IBM, Sun Microsystems, and Textroon. X was now supported under four major
    operating systems, and included 19MB of source code and documentation.


    The 1988 second release, X11R2, provided numerous fixes, compressed fonts, and
    changes to command-line arguments for servers and clients. The release included
    a contributor distributor of third-party software, along with additional libraries
    of programming functions, such as the Andrew Toolkit from IBM and Carnegie Mellon
    University. These contributed toolkits provided programmers with easier ways to
    develop clients quickly for X. New clients were added, including the now-classic
    x and xbib.


    Subsequent revisions, such as X11R4, added improved handling and the creation
    of objects known as widgets. A widget is a graphical user interface item that
    can be created, displayed, hidden, or destroyed in memory. Thus, the ability to
    create nonrectangular window shapes was introduced. The xdm client became the
    standard login manager for X.


    The August 29, 1991 release of X11R5 provided a client resource or customization
    mechanism, in which text resources could be used to change the appearance of a
    client’s buttons and windows, change fonts, and so on. This release also added
    internationalization capabilities, improved font handling, and support for Apple’s
    monochrome and color displays. The release also added supported for Video Graphics
    Adapter (VGA) displays for ATT’s System V/386 UNIX.


    In 1993, the X Consortium, a nonprofit group of companies, adopted X as the MIT
    Consortium dissolved. One year later, on April 21, 1994, X11R6 was released. The
    release improved window management, resource sharing, session management (the
    ability to save settings between X sessions), and numerous other features.


    X11R6.1, released March 5, 1996, supported 16 different operating systems, including
    Linux kernel 1.2.1. The release added new clients, but not had much changed with
    the introduction of X11R6.


    The next version was X11R6.3, released on December 23, 1996. X11R6.3 was to be
    the last X Consortium release before stewardship was turned over to another'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Chapter 1: X1, XFree86, and Linux


    nonprofit organization named The Open Group (TOG), comprising 200 corporations
    and many original members of the X Consortium.


    The Open Group X Project Team released the next version, X11R.6, on January 30,
    1998—but not without controversy. TOG decided that X was no longer be free of
    licensing or royalty payments. The group decided that if you were making a profit
    from selling a version of X, you would have to pay an annual license fee at $7,500
    for 500 units.


    Faced with annual fees up to $65,000, or the need to cough up $30,000 for membership
    to get lower fees, many companies and programmers involved in the Open Source
    community threw their hands in horror. A split in the development of the free
    version and the newer free-based revision became imminent.


    Fortunately, the XFree86 Project, Inc. (discussed in the next section), a nonprofit
    organization comprising programmers from around the world and devoted to bringing
    a free X to the Intel-based PC platform, vowed to continue development of the
    free version. In another positive development, TOG changed its mind in early September
    1998 and reverted X11R6.4''s license to the old MIT version.


    Today, X resides with XOrg, an organization of TOG. X took charge of X on May
    12, 1999, and now oversees its development and evolution.


    # The XFree86 Project, Inc.


    The XFree86 Project, Inc., formally incorporated May 19, 1994, was created partly
    in response to problems with funding and status for membership in the X Consortium.
    The project has two classes of membership: full and associate members. Original
    members of the board include David Wexdlat, Dirk Hoenhold (now with SuSE, Inc.),
    Dr. Richard Murphy, Glenn G. Lai, David Dawes, Dr. Jon Toms, and James Tillas.
    Run entirely by donations, XFree86 became an honorary member of XOrg in November
    1999.


    Originally started in 1992 by a small band of developers, the project quickly
    took shape to provide an X11 implementation for Intel-based PCs. Today''s XFree86
    distribution, however, supports other platforms, such as Compaq Alpha, Sun''s
    SPARC, and Motorola''s PowerPC CPU-based systems, that brought the efforts of
    programmers around the world.


    XFree86 2.1, introduced March 18, 1994, was the first version of XFree86 for Linux,
    and was designed to work with Linux kernel version 0.99p115. Thus, XFree86 has
    supported Linux since its first usable kernel.


    Updates quickly followed, with version 2.1.1 for Linux 1.0, and the next release,
    XFree86 3.0, which introduced support for X11R. The XFree86 3.0-series'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'distributions lasted more than two years, from 1998 until January 2000, and
    many Linux distributions still use the last version, XFree8 3.3.6.


    A major watershed for XFree86 arrived on March 7, 2000. XFree86 4.0 was officially
    released, and incorporated nearly two years of work by the XFree86 Project. Many
    new features were added. These features introduced the following:


    +   - Built-in configuration features in the main server

    - Improved font support

    - Incorporation of X11R6.4 features, such as support for multiple monitors

    - Introduction of new configuration utilities

    - Support for more than 500 graphics cards and 30 types of graphics chipsets using
    a single server

    - Use of loadable modules and drivers, instead of a single server for a type of
    graphics chipset


    The current version of XFree86 is 4.0.1, which incorporates features found in
    the official X11R6.4 release from X.Org.


    # New Features of X11R6.51


    The latest version of X, X11R6.51, was introduced on August 15, 2000. According
    to X.Org, the release incorporates nearly 200 updates, and provides support (via
    a patch) for the Euro and improved X Print Server support (which allows images
    to be sent to an output device as a printer).


    This new release, composed of four compressed files, has bloated to 144MB of source
    code, 20 times larger than the original X10 distribution. The source includes
    more than 8,100 files, nearly 600 fonts, 345 pages, 20 libraries, 70 images, and
    60 clients.


    System administrators, computer network analysts, and programmers will also find
    nearly 150 white papers, documentation, and other research included as compressed
    PostScript files under X11R6.51''s xc/doc/hardcopy directory. These treatises
    can provide invaluable information when planning or programming. You can quickly
    read these documents by entering the g client, followed by the document''s name,
    as follows:


    ```

    # g xc/doc/hardcopy/Xserver/analysis.PS.gz

    ```


    After you press Enter, the g client automatically decompresses the PostScript
    document, and you can read David P. Wiggins’ “Analysis of the X Protocol for Security
    Concerns.”'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Chapter 1: X1, XFree86, and Linux


    # Other Distributions


    Since the beginning of X support under Linux, there have been commercial distributions
    of X as well as distributions of commercial software libraries for X, such as
    Motif (now at version 2.1.30), that are designed for use with Linux. A number
    of vendors, at one time or another, have provided proprietary X distributions
    (usually with special features or updated drivers) that work well.


    One of the first companies to ship commercial software for Linux (nearly nine
    years ago) is Metro Link, Inc. This company has marketed an X distribution for
    Linux since the first stable kernel. Today, Metro Link offers four basic products
    for Linux:


    +   - Metro-X—a general-purpose server for Linux on the Intel and Alpha CPU platforms,
    with support for more than 100 different graphics chipsets, touch screens, multithread
    (multiple-monitor) displays, and 3D-input devices, such as a table stylus

    - Micro-X—a scalable X server, for use in embedded systems (Intel, Alpha, PowerPC,
    and ARM CPUs), that has a very small memory footprint (according to Metro Link,
    as small as 600KB)

    - Metro Link Motif—a distribution of the latest three versions of the Motif programming
    libraries and clients for X

