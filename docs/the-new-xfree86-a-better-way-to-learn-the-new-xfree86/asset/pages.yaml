  md: '# 230 Chapter 13: Popular X11 Games


    This chapter introduces a number of popular free and commercial games for Linux
    and XFree86. Until recently, most of the amusement and past-time clients (games)
    for X resided in the realm of legacy clients that were ported over time to work
    with Linux. However, as Linux and XFree86 have increased in popularity over the
    last two years, commercial game producers have seen a new, expanded marketplace
    for selling games for Linux.


    Now more than a dozen commercial games are available for Linux, thanks to the
    programming efforts of at least one company, Loki Entertainment, Inc. Table 13.1
    lists some of the most popular games.


    Commercial games for XFree86 are, the equivalent to counterparts for other operating
    systems. However, some of these games require special graphics hardware and software
    libraries to support 3D rendering and feasible game play. Fortunately, you can
    download nearly all-commercial games as demos, so you can try the game before
    purchasing it. This idea has merit, as it can save you time, effort, and money.
    Commercial games are covered in the section "Commercial X11 Games for Linux,"
    later in this chapter.


    The good news is that you''ll find many other games available for X that do not
    require a major reinvestment of graphics hardware, video memory, or additional
    download and installation of special software libraries. Nearly every Linux distribution
    includes a variety of games for X, and many have become classic additions to the
    /usr/X11R6/bin directory.


    This chapter covers nearly 30 great games, both arcade and strategy, that will
    work on nearly every computer system. Keep in mind that an 800×600 display with
    256 colors is generally required. Realistically, most games function best when
    played on a 1,024×768 desktop with thousands of colors.


    # Free X11 Games


    This section introduces several free strategy and arcade games for X, along with
    miscellaneous fun clients that you can use on your system. The strategy games
    cover the more traditional board games, although some strategy games also involve
    graphics, sound, and music. The arcade games include some traditional ones, as
    well as a few unique twists.'
  merge: -1
  pgno: 257
