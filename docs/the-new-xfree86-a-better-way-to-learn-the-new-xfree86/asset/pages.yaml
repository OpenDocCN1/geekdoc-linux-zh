  md: '# Chapter 20: Using LessTif and Open Motif


    his chapter gives an overview of downloading, installing, and using the LessTif
    and Open Motif toolkits for XFree86 and Linux. These toolkits provide various
    X clients and window managers, software libraries, and high-level development
    libraries that you can use to build sophisticated clients. Although both are free
    software, only LessTif enables you to develop binary-only clients without worry
    about royalties or licensing; Open Motif is a free version of the commercial Motif
    distribution from The Open Group, recently released free for noncommercial use.


    These software libraries can help you save time and effort when building portable
    X11 software. The libraries take advantage of a platform''s native environment
    when you you rebuild and compile your software for other target hardware. This
    means that unless you specifically program your software to have a dependency
    on a particular computer''s hardware, clients that you develop using these toolkits
    should be extremely portable at the source code level.


    This chapter also provides a simple Motif client that shows a sampling of Motif’s
    capabilities.


    # Considering Licensing Issues


    Until recently, licensing was a consideration when using Motif. However, you can
    now produce Motif clients using the LessTif software toolkits. And since The Open
    Group has released Open Motif, you can now develop Open Source clients using the
    latest Motif toolkits. This release can save a Linux developer more than $100,
    as you previously had to purchase Motif for Linux and XFree86 from a licensed
    software vendor.


    As you learned in Chapter 19, “X11 Programming Toolkits Overview,” Motif and its
    source code became available for free download May 15, 2000. However, remember
    that you may develop only Open Source clients using this software. Other proprietary
    avenues still require licensing and perhaps royalties to The Open Group.


    # Downloading and Installing LessTif


    You can download LessTif from the project’s home page (see the “Resource Information”
    section at the end of this chapter). The current version, 0.91,8, was released
    on August 31, 2000 (and an updated version almost certainly will be released before
    you read this book). On the home page, you’ll find a link to LessTif’s download
    page.'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# Downloading and installing LessTif


    LessTif is available for a variety of computer platforms, operating systems, and
    Linux distributions. You can download the source code, compressed tarballs of
    binaries, the binaries in rpm zip format. Binary distributions are available for
    Red Hat Linux, generic Linux (libc-based), FreeBSD, and OS/2.


    Source distributions are available in compressed tarballs in gzip or bzip2 format.
    The source distribution is available in several packages, but the primary source
    is contained in a single file, lestif-0.91.8.bz2, a 2.6MB bzip2 tarball, or lestif-0.91.8.tar.gz,
    and a 3.5MB tarball. After downloading, decompress the archive like:


    ```

    # make xvf less

    lestif-0.91.8/README

    lestif-0.91.8/release-notes.html

    lestif-0.91.8/AUTHORS

    lestif-0.91.8/BUG-REPORTING

    lestif-0.91.8/COPYING

    ...

    ```


    In this example, you use the tar command to decompress the LessTif source; a directory
    named lestif-0.91.8 is then created. You need nearly 19MB for the directory (and
    even more for the build). A file named INSTALL under the LessTif directory provides
    documentation about configuring, building, and installing LessTif. You will need
    to install on your system a copy of XFree86-devel software libraries and header
    files. To start the process, you can use the included configure script.


    > Chapter 18, "Basic X11 Programming," for more information about software development
    tools such as make, xkmf, and autoconf for X11 client development.


    You can also use this script to specify whether you want to build and install
    or static libraries, debugging symbols in clients, and a production version. You
    can also specify where to install the distribution. Or you can simply type the
    following:


    ```

    # ./configure

    ```


    After you press Enter, the script examines your system. If all goes well, after
    or so the script creates a top-level file named Makefile (along with many Makefiles
    in the source tree). You can then use the make command to build the distribution,
    as follows:


    ```

    # make

    ```


    ![](img/078622fac3fd61e5a0c895da1d3eff96_400_0.png)'
  merge: -1
