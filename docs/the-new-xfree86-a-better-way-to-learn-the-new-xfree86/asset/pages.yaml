- img_proc: true
  md: '# Using x86cfg


    Free8 46.0.1 also includes a new graphical configuration client, named x86cfg,
    that you can use to configure X. To start the configuration, type the client''s
    name on the command line as follows:


    ```

    # x86cfg

    ```


    After you press Enter, your screen may clear, and you can start the configuration.
    This client may or may not work with your computer''s hardware, but if it does,
    x86cfg will use the tw window manager to offer a configuration window showing
    the results of running the Free86 server to probe your computer''s hardware, and
    an access window for configuration. The configuration window features four buttons
    along the top of the screen for adding additional hardware, along with a graphic
    representation of your computer''s monitor, graphics card, keyboard, and mouse
    (in other words, those components that the server has recognized and found). The
    bottom portion of the window features a Help and Quit button, along with a Layout
    button to define new configurations. The Layout button is helpful if you have
    added new hardware, such as a new graphics card or monitor or a new keyboard or
    mouse.


    # Edit the Files Section First!


    The x86cfg client will generate a working X86Config file, but unfortunately does
    not add at least one critical element: a FontPath entry in the Files section.
    Open the generated X86Config.new file with your favorite text editor and look
    for the Files section, which should look like this:


    Section "Files":


    EndSection


    Change this section by adding (at a minimum) a FontPath entry pointing to X''s
    miscellaneous fonts:


    Section "Files":


    ```

    FontPath "/usr/X11R6/lib/X11/fonts/misc"

    ```


    EndSection


    You can then use the startx command to start a test session, as follows:


    ```

    # startx -xf86cfg /root/X86Config.new

    ```


    When you''re satisfied with your configuration, copy the X86Config.new file to
    the /etc/X11 directory with the name X86Config.'
  merge: -1
