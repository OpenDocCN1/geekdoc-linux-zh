    # .mp3 Rippers


    One of the nice features about using .mp3 audio is that you can fit nearly 10
    audio CDs of music on a single CD-R. This also means you can carry around 20 or
    30 CDs of music and use only a few gigabytes of hard drive space on your laptop.
    You can also preserve your entire audio collection in digital format on a small
    server on your LAN.


    There are a number of front-end clients that you can use to automate the process
    of converting audio CDs into .mp3 format. If you use KDE, you''ll definitely want
    to use Adrian Schroeter''s krabber client. You can start this client from the
    command line of an X11 terminal as follows:


    ```

    # krabber &

    ```


    After you press Enter, krabber looks for the cdparanoia, ecdrecord, sox, and mpg123
    commands, as well as various .mp3 encoders such as lame. The main interface looks
    like that shown in Figure 12.20.


    This client features a number of options, including sound filters, the ability
    to set more or less CPU usage to the encoding task), and the ability to set the
    quality of the digital conversion. Better quality means larger encoded files.
    Songs played with average quality typically take up to 1MB of hard drive storage
    per minute.


    All you have to do is click the buttons labeled 1–4 in sequence. Clicking the
    first button enables you to choose the audio tracks of inserted CD audio. Like
    the kde client, krabber will query remote Internet music databases and automatically
    manage'
