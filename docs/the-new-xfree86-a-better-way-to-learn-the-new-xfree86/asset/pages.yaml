  md: '# Motif, Open Motif, or LessTif?


    Until recently, Motif was a set of proprietary, binary-only, and commercially
    sold and distributed software libraries and clients. The Motif provide X programmers
    with timesaving functions and standardized widgets for quickly creating clients.
    Built upon the X libraries, Motif, first introduced before 1993, has gone through
    a number of revisions and stewardships (from X/Open, to The Open Software Foundation,
    or OSF, and not to TOG).


    LessTif is a clone set of libraries that provides compatibility with Motif version
    1.2. However, on May 15, 2000, TOG released the Motif source code under a free-personal-use
    license.


    In response, the LessTif developers write, "Usage of the OpenGroup™''s implementation
    does neither match the OpenSource definition nor any more general definition of
    ''free'' usage, it''s in rather limited."


    > "In situation there''s still need for LessTif at least to have a LGPL''ed version
    around which can be used on the vast majority of operating systems. Once the OpenGroup™
    would release their Motif under a license compatible with common OpenSource definition
    LessTif might become obsolete."


    > "So we encourage people to still use, test and enhance LessTif. Until the details
    have been worked out any code contributors shouldn''t look (closely) at the OpenGroup™''s
    sources to avoid any possible license violation."


    The caution by the LessTif team points out a potential problem for any developer
    attempting to provide Open Source software compatibility with proprietary software:
    Your efforts at cloning can be tainted by looking at the source. Meanwhile, you
    can still buy commercial versions of Motif or register and download Motif (see
    the section "Resource Information," at the end of this chapter).


    for Linux. Red Hat, Inc., marketed CDE for Linux for only 18 months, around 1994.


