  md: 'Note that the main KDEDevelop window features a browser-like interface that
    lists a host of reference materials and documentation, such as the KDE Application
    Tutorial, the KDE Library Reference Guide, and the KDE Developer''s Guide. Although
    you should read this documentation thoroughly first, you can quickly create your
    first project by clicking the New menu item under the Project menu. You''ll see
    a six-step KDE Application Wizard, as shown in Figure 21.5.


    Note that you can useDevelop to prototype more than a dozen different types of
    clients, including a GNOME application. For example, click the Normal application
    option under the KDE drop-down list in the wizard''s scrolling window. When finished,
    click the Next button. You will then see the Generate Settings dialog box, as
    shown in Figure 21.6.


    Use the Generate Settings dialog box to select your project''s icons, assign a
    name, and enter directory, author, and email information. Note that Develop automatically
    generates files, such as the GNU install, readme, and copying files. You''ll need
    to add information to these files before distributing your client. When you are
    finished configuring your project''s initial settings, click the Next button to
    continue. The next dialog box, Version Control System (shown in Figure 21.7),
    enables you to select whether you would like to use the Concurrent Versions system.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_420_0.png)


    figure 21.5 KDEDevelop features a wizard interface for setting up your project
    for a variety of systems, including GNOME.'
