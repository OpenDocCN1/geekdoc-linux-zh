    # The pilot-xfer Client


    The commands for Kenneth Albanowski''s pilot-link suite are text-based, and meant
    to be used from the command line in conjunction with a Palm PDA attached to your
    computer''s serial or USB port. This section covers the pilot-xfer program, part
    of the pilot-link suite. Table 11.5 lists pilot-xfer and the other commands included
    with the suite.


    The most capable client, and probably the one that Linux users will use with the
    Palm PDA, is pilot-xfer. For example, to back up your PDA quickly, you can log
    in as root, then create an environment variable named PILOT_RATE, like this (if
    you''re using the bash shell):


    ```

    # export PILOT_RATE=57600

    ```'
