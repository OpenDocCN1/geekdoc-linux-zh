    # Corel''s WordPerfect 8 for Linux


    WordPerfect has long been a staple word processor for UNIX systems. A Linux version
    was developed several years ago, and has been available as a commercial product
    for a number of years. However, in December 1998, Corel, Inc., which had acquired
    WordPerfect, decided to release WordPerfect 8 for Linux as a free client.


    WordPerfect 8 for Linux is nearly identical to its brethren available for commercial
    operating systems and its now-defunct commercial sibling for Linux. (Corel offered
    a low-cost commercial version, but that version is no longer on the market.) This
    free word processor is an excellent choice for performing word processing functions
    under Linux and XFree86, especially on older Linux systems.


    # Installing WordPerfect 8


    The WordPerfect 8 download is a 38MB compressed binary file consisting of a number
    of tape archives that must be decompressed after download. Download the archive,
    named GUILG00.gz, and save it in a directory. You can then decompress and extract
    the archives using the tar command and the xf options, as follows:


    ```

    # tar xv GUI=

    ```


    You can then verify the contents with the ls command as follows:


    ```

    $ ls

    ```'
