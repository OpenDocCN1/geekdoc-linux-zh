  md: 'After you press Enter, X will start, and the XFree86 server will determine
    whether your system can support the requested color depth and resolutions defined
    for your system. Typical values used for different color depths are 8, 15, and
    16.


    Another option commonly used is to start an X using a different number of dots-per-inch
    (dpi) resolution. This can be helpful to provide better-looking fonts and help
    displays with large resolutions (such as 1,600×1,200), or perhaps to work around
    font support problems for X clients used during your X sessions. The default setting
    is to support 75-dpi fonts. But you can bump this up to 100 dpi by using the startx
    command and -dpi setting, followed by 100, as follows:


    ```

    # startx -dpi 100

    ```


    After you press Enter, your session will be at 100=dpi resolution.


    # Starting Multiple Sessions


    If you have enough system memory, you can use the startx command to launch multiple
    X sessions. This can be useful to test new window managers or run X sessions at
    different color depths. Thanks to support under Linux and XFree86 for virtual
    consoles, or console displays across the keyboard, you can quickly and easily
    jump back and forth between sessions.


    You first need to boot Linux to a non-X multiuser mode, such as level 3 for Red
    Hat or Mandrake Linux. After you log in, you can start your X session by using
    the start command, a display number, which specifies an X server instance in this
    example, and a number representing a virtual console. Many Linux distributions
    use console 7 for X; if this is the case for your distribution, you can start
    your X session as follows:


    ```

    # startx -0 vt7

    ```


    After you press Enter, X starts. To start another X11 session, press Ctrl+Alt+F2.
    You''ll find yourself at a text-only login prompt. Log in, and again use startx
    to start another X11 session, as follows:


    ```

    # startx -1 vt8

