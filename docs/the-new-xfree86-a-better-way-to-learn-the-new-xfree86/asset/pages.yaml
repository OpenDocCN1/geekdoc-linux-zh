  md: '# Chapter 6: Starting X11


    This chapter provides an overview of the ways in which you can start your X session.
    You''ll learn how to use the Linux command line to launch your system''s X server,
    get an introduction to a number and type of X display managers, or X login choosers,
    and also how to use the startx command to customize your users session. You''ll
    also learn one to start XFree86 remotely over a network.


    Understanding your options when using XFree86 is part of the X and Linux experience,
    and can help you get the most out of your system. Although many users sit down
    at a terminal, log in, and go to work, creating the optimal X login, session,
    and desktop is critical if you want to ensure the most efficient, trouble-free
    system for you or your users''s. This task, of course, usually falls on the shoulders
    of a system administrator in a large computing environment, but when using Linux
    and X on a standalone computer, you, the user, must assume some administrative
    tasks.


    Granted, installing and configuring Linux and X become easier with each new release,
    but a little knowledge can go a long way transforming you just another X to a
    more savvy and experienced desktop technician. We hope that the information that
    this chapter presents will help you make more informed choices when developing
    personal tastes for your X environment.


    # Choosing a Starting Method


    X display manager is an X client that graphically manages who may log in to an
    X session, and depending on the display manager, use a specific window manager
    somewhere on a network. This means that you can set up your computer to offer
    a login to an X session running locally or on a different computer on your network
    (or anywhere in the world).


    Several display managers (such as the xdm configuration used by a new ancient
    Red Linux 4.2 system shown in Figure 6.1) are available for XFree86 and are usually
    included with most Linux distributions. The X display manager, or xdm, is an X
    client and part of the XFree86 distribution. KDE includes the K display manager,
    or kdm, and GNOME provides the gdm client.


    You do not need to use a display manager to start your X session. XFree86 comes
    with a shell script named startx that the startx command has the staple to start
    X sessions for Linux and XFree86 until very recently. Newer Linux distributions
    now configure X during installation, but this was not the case until recently;
    now, the normal procedure was to install Linux and X, then to configure and test
    X before committing the system to a graphical login.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_129_0.png)'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Using a Display Manager


    ![](img/078622fac3fd61e5a0c895da1d3eff96_130_0.png)


    **Figure 8.1** A display manager, such as this client for an early version of
    Red Hat Linux, offers a single point for logging in to Linux and starting an X
    session.


    The startx command (discussed in more detail later in this chapter; see the section
    "Using thex Script") has several advantages over the graphical login offered by
    a display manager because of its flexibility and command-line options. On the
    other hand, a display manager can offer more security (when X is properly configured)
    and combine into a single step the processes of logging in to Linux and starting
    X. Newer display managers, such as kd and gdm, also offer drop-down menus that
    enable the user to choose a window manager for the X session.


    Whether or not you use a display manager can be a matter of personal preference
    or a need dictated by your computing environment. Certainly, one of the first
    choices you''ll need to make when using X is whether or not to use a graphical
    login. In some environments, using a display manager can help offload system requirements
    (such as hard drive space) from the local workstation by booting to an X session
    remote resources, or even simplify the task of logging in to a working X session.
    If you''re using Linux on a network appliance, you may or may not need a display
    manager, depending on how the system is configured.


    # Using a Display Manager


    This section introduces three display managers commonly used with XFree86 and
    Linux. The first display manager, xdm, is part of the XFree86 distribution. xdm
    is the first display manager available for XFree86. (The next oldest display manager
    was'
  merge: -1
