  md: '# X via PPP


    the local workstation (named thinkpad, in this example). Finally, the StarOffice
    suite is launched on the dell workstation, and will be displayed on thinkpad.
    Note that it was unnecessary to use the -display option (although you could choose
    to use the option). After the session has ended, you should use again the xhost
    command to remove access.


    Displaying remote clients on a user''s screen in a network environment can also
    take some thought. For example, if a user logs in to X via xdm to a remote server
    (using X -broadcast or X -query hostname), that user can display X remotely by
    specifying the hostname of the user''s workstation, not the remote computer. For
    example, if a user is on stinky logs in X via xdm and runs a session on greenie,
    a user on thinkpad, given proper access, would display the xcalc client using
    the following command:


    ```

    $ xcalc -display thinkpad:0.0 &

    ```


    In this example, thinkpad displays the xcalc client, even though the user is logged
    in greenie.


    In some instances, you may have to set your $DISPLAY variable manually, especially
    if you use the rlogin or ssh command to log in to a remote box. You can do this
    easily from the command line by using the shell''s variable definition assignment.
    After logging in remote, if you use the bash shell, use the bash export command
    followed by the definition, like this:


    ```

    $ export DISPLAY=hostname:0.0

    ```


    After you press Enter, your workstation will display locally any clients launched
    on the remote computer (again, you may have first to get access using xhost).


    # X via PPP


    Another method of allowing remote access is to use low-bandwidth X with the lbx-proxy
    client. This method is generally used to provide remote X sessions over modem
    dial-in, and allows X to work via Serial Line Internet Protocol (SLIP), compressed
    SLIP, or more commonly, Point-to-Point Protocol (PPP).


    One method of easily establishing X sessions via dial-up and getting a better
    performance is to use the dxpe client (which acts as a client or server, depending
    on command-line options). This software, originally by Zachary Vonler and now
    maintained by Brian Pane, works by caching X Protocol messages in order to provide
    compressed X requests over slower transmission lines. This remarkable performance
    and greatly speeds up the display of clients, even when using slow serial lines.'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'First, you''ll need to download and install the dxpc software package. This
    software, available through http://www.vigor.nu/dxpc/, is packaged as source code
    in a 123K compressed tarball. To build and install the software, use the tar,
    cd, configure, and make commands (as root) like this:


    ```

    # tar xvf dxpc*.gz

    # cd dxpc*

    ./configure ; make install

    ```


    Next, you''ll need to set up PPP service on the intended server, named stinky
    for this example. You can quickly perform this setup (as root) by creating a user
    account named ppp. Next, in the /etc/passwd entry, replace the shell entry with
    a pathname to a shell script (named dopp in this example):


    ```

    ppp:x:502:502::/ppp:/usr/local/bin/dopppp

    ```


    Don''t forget to assign a password for the new PPP user using the password command.
    Next, create the shell script with the following command:


    ```

    exec /usr/sbin/ppppd -detach

    ```


    Save the file and use the chmod command to make it executable. Your system''s
    /etc/inittab file should already be set up to accept dial-ins via modem. The following
    entry, using the getty tagname, allows dial-ins at 38400 on /dev/ttyS2:


    ```

    3:2345:respawn:/usr/local/bin/agetty -w -I ATE001&D2&CISO=1''015'' \

    115200 tty2 vt100

    ```


    Next, to assign a static IP address for the dial-in user, create a file named
    options.tty2 in the /etc/ppp directory with the following command:


    ```

    192.168.2.37:192.168.2.41

    ```


    In this example, the remote caller will be assigned the IP 192.168.2.41, whereas
    the IP of the server host (stinky) is 192.168.2.37. Finally, create your /etc/ppp/options
    file with the following commands:


    ```

    asyncmap 0

    netmask 255.255.255.0

    proxyarp

    lock

    crcts

    modem

    ```


    Save the file. At this point, you can dial from a remote computer, named greenie
    in this example, into your server. To do so, enter the username and password,
    then establish a PPP connection with the assigned IP address.'
  merge: -1
