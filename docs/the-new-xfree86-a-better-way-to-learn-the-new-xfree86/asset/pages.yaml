  md: '# Chapter 11: Popular X11 Clients


    # # The kpilot Client


    One of the most popular graphical clients for interaction with the Palm PDA is
    Dan Pilone''s kpilot client, usually included with KDE and many Linux distributions.
    You can launch this client from the command line of an X terminal window, as follows:


    ```

    # kpilot

    ```


    After you press Enter, you''ll see the main kpilot window, as shown in Figure
    11.19. kpilot can be used to synchronize data between your Linux system and a
    Palm-OS PDA, and will automatically start communicating with your PDA when you
    press your PDA''s software or hardware synchronize button.


    To begin using kpilot, first select the File menu, then click Settings. The KPilot
    Options dialog appears, as shown in Figure 11.20.


    Use this dialog box to select the correct serial port (perhaps a symbolic name
    like /dev/pilot that points to the correct port, such as /dev/tty0). Next, click
    the drop-down Speed menu, select a speed for transferring files. Most computers
    will easily support the value 57600, but you can try the faster 115200 if you
    like. If click the Start KPilot Hot-Sync, kpilot will automatically launch if
    its kpilotDaemon is active (you can start the daemon manually from the command
    line) and you press the Palm PDA cradle''s HotSync button. When finished, click
    the OK button.


    To begin, insert your Palm in its cradle and connect the cradle to your computer.
    You can start kpilot, click the Backup menu item from its File menu, then press
    your Palm cradle''s HotSync button to back up your PDA.


    ![](img/078622fac3fd61e5a0c895da1d3eff96_229_0.png)


    ![](img/078622fac3fd61e5a0c895da1d3eff96_229_1.png)'
