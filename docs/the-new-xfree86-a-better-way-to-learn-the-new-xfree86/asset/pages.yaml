  md: '# Configuring the wm2 Window Manager


    Chris Cannam''s wm2 window manager wins the prize as the smallest window manager
    discussed in this book. The source code distribution consists of 32KB of compressed
    files, and when built, the source code results in a binary on most systems of
    less than 200,000 characters. This window manager''s best feature is its lack
    of features; wm2 doesn''t even provide any icons, virtual desktops, root menu,
    or configuration file.


    The only way that you can configure the wm2 window manager is by editing a source
    code file named Config.h:


    ```

    #define CONFIG_NEW_WINDOW_COMMAND "xterm"

    ...

    ***PD: End code

    ```


    You can select colors by editing another portion of the file:


    ```

    ...

    \***PD: Begin code


    #define CONFIG_TAB_FOREGROUND "black"

    #define CONFIG_TAB_BACKGROUND "gray80"

    #define CONFIG_FRAME_BACKGROUND "gray95"

    #define CONFIG_BUTTON_BACKGROUND "gray95"

    #define CONFIG_BORDERS "black"


    #define CONFIG_MENU_FOREGROUND "black"

    #define CONFIG_MENU_BACKGROUND "gray80"

    #define CONFIG_MENU_BORDERS "black"

    ...

    ```


    After you build wm2, insert wm2 into your .xinitrc file in your home directory.
    You can also use the xsetroot command to set the background color before starting
    your X session, as follows:


    ```

    xsetroot -solid lightblue

    wm2

    ```'
