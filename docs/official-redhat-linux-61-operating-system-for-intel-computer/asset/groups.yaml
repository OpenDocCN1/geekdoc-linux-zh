    # Chapter 2:Before You Begin


    These classes give you the option of simplifying the installation process (with
    some potential for loss of configuration flexibility), or retaining complete flexibility
    with a slightly more complex installation process. Let''s take look at each class
    in more detail, so you can see which one is right for you.


    Only the custom-class install allows you complete flexibility. The workstation-
    and server-class installations go through the installation process for you and
    omit certain steps. However, you can now choose to partition your drives manually
    in a workstation- or server-class installation.


    # 2.4.1 The Workstation-Class Installation


    A workstation-class installation is most appropriate for you if you''re new to
    the world of Linux, and would like to give it a try. By answering very few installation
    questions, you can be up and running Red Hat Linux in no time!


    # What Does It Do?


    If you choose not to partition manually, a workstation-class installation removes
    any Linux-related partitions on all installed hard drives (and uses all free unpartitioned
    disk space) to create the following partitions:


    +   A 64MB swap partition.


    A variable-sized (the exact size is dependent on available disk space) root partition
    (mounted as /) in which all other files are stored.


    | Intel |

    | A 16MB partition (mounted as /boot) in which the Linux kernel and related files
    reside. |

    || Alpha |

    | A 2MB partition (mounted as /dos) in which the MILO boot loader is located.
    |


    This approach to disk partitioning results in the simplest filesystem configuration
    possible.'
