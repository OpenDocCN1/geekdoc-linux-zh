    # Section 4.10:Installing LILO


    +   * Do not install LILO -- if you have Windows NT installed on your system,
    you may not want to install LILO. If you choose not to install LILO for this reason,
    make sure that you have chosen to create a boot disk; otherwise you will not be
    able to boot Linux. You can also choose to skip LILO if you do not want to write
    LILO to your hard drive.


    #  4.10.2 Alternatives to LILO


    If you do not wish to use LILO to boot your Red Hat Linux system, there are several
    alternatives:


    # Boot Disk


    As previously stated, you can use the boot disk created by the installation program
    (if you elected to create one).


    # LOADLIN


    You can load Linux from MS-DOS. Unfortunately, it requires a copy of the Linux
    kernel (and an initial RAM disk, if you have a SCSI adapter) to be available on
    an MS-DOS partition. The only way to accomplish this is to boot your Red Hat Linux
    system using some other method (e.g., LILO on a diskette) and then copy the kernel
    to the MS-DOS partition. LOADLIN is available from ftp://metalab.unc.edu/pub/Linux/systemboot/dualboot/
    and associated mirror sites.


    # SYSLINUX


    An MS-DOS program very similar to LOADLIN. It is also available from ftp://metab-lab.unc.edu/pub/Linux/system/boot/loaders/
    and associated mirror sites.


    # Some commercial bootloaders


    For example, System Commander and Partition Magic, which are able to boot Linux
    (but still require LILO to be installed in your root partition).


    # 4.10.3 SMP Motherboards and LILO


    This section is specific to SMP motherboards only. If the installer detects an
    SMP motherboard on your system, it will automatically create two lilo.conf entries
    as opposed to the usual entry.


    One entry will be called linux and the other will be called linux-up. The linux
    will boot by default. However, if you have trouble with the SMP kernel, you can
    elect to boot the linux-up entry instead. You will retain all the functionality
    as before, but you will only be operating with a single processor.'
