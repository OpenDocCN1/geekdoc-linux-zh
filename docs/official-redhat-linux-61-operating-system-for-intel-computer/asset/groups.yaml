    # 官方 Fedora Linux 6.1

    ### 操作系统


    Red Hat Linux 是一款强大且极其稳定的下一代计算机操作系统，它为服务器和桌面级 PC 提供了高性能的计算环境。


    ## 安装指南


    本分步指南将引导你完成 Red Hat Linux CD-ROM 图形化安装过程。在安装之前，请先了解新功能、开始安装前所需的准备工作、如何启动安装程序以及如何完成安装。


    安装好 Red Hat Linux 之后，《Red Hat Linux 入门指南》将成为你学习如何导航和探索新系统强大功能的资源。


