    | 总计 (Total) | 293 M | 0:07:18 |

    | 已完成 (Completed) | 358 M | 0:01:13 |

    | 剩余 (Remaining) | 258 M | 0:06:05 |


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_66_0.png)


    ## 4.18 创建启动盘


    如果您选择创建启动盘，请向您的软驱器插入一张空白软盘（参见下方的图 4–20）。稍等片后，您的启动盘将被创建。从软驱器中取出后，请清晰地标记它。如果您想在安装后创建启动盘，可以这样做。更多信息，请在
    shell 提示符处输入 `bootdisk` 查看。


    如果您使用启动盘（而不是 LILO）启动系统，如果您对内核进行了任何更改，请确保创建一个新的启动盘。


