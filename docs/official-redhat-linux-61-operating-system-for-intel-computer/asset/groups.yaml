    Chapter 2:Before You Begin


    # Intel


    A 16MB partition (mounted as /boot) in which the Linux kernel and related files
    are kept.


    # Alpha


    A 2MB partition (mounted as /dos) in which the MILO boot loader is kept.


    This approach to disk partitioning results in a reasonably flexible filesystem
    configuration for most server-class tasks.


    # Please Note


    You will need approximately 1.6GB of free disk space in order to perform a server-class
    installation.


    > CAUTION

    A server-class installation will remove ALL existing partitions of ANY type on
    ALL existing hard drives of your system. All drives will be erased of all information
    and existing operating systems, regardless of if they are Linux partitions or
    not!


    # 2.4.3 The Custom-Class Installation


    As you might guess from the name, a custom-class installation puts the emphasis
    on flexibility. During a custom-class installation, you choose how disk space
    should be partitioned. You have complete control over which packages will be installed
    on your system. You also determine whether you''ll use LILO to boot your system.'
  - '[PAGE 22]


    # 2.4.4 Behind the Scenes of a Custom-Class Installation


    This section covers the installation steps that are not seen by performing a workstation-server-class
    installation.


    This may help those of you who are trying to decide which installation class will
    better suit your needs. If you think you''ll have trouble performing any of the
    tasks on this list, you should not perform a custom-class installation without
    reading through this manual and clarifying any questions you may have.


    +   - Creating Partitions -- In the custom-class installation it is necessary
    for you to specify where want Red Hat Linux to be installed. This is no longer
    specific to custom-class installations as you now have the option to manually
    partition your hard drives in the workstation- and server-class installations.

    - Formatting Partitions -- All newly created partitions must be formatted. Any
    partitions that contain old data (data you no longer need or want) should be formatted.
    If you choose to manually partition your workstation- or server-class installation,
    you will need to choose which partitions to format.

    - Selecting and Installing Packages -- This is performed after your partitions
    have been configured and selected for formatting. Here you may select groups of
    packages, individual packages, a combination of the two, or choose "everything"
    install.

    - LILO Configuration -- In a custom-class installation, you are able to choose
    where you would like LILO to be installed (either on the master boot record (MBR)
    or on the first sector of your root partition), or you may choose not install
    LILO at all.


    # 2.5 Disk Partitions


    Nearly every modern-day operating system uses disk partitions, and Red Hat Linux
    is no exception. When installing Red Hat Linux, it will be necessary to work with
    disk partitions. If you have not worked with disk partitions before (or would
    like a quick review of the basic concepts) please read the An Introduction to
    Disk Partitions appendix in the Official Red Linux Reference Guide before proceeding.'
