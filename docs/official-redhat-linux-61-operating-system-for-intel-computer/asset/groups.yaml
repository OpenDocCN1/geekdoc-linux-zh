    ### 2.1.1 Contents of the Red Hat Linux Boxed Set


    The Red Hat Linux boxed set contains the following items:


    - The Official Red Hat Linux Installation Guide

    - The Official Red Hat Linux Getting Started Guide

    - The Official Red Hat Linux Reference Guide

    - The Official Red Hat Linux Alpha/SPARC Installation Addendum, only in Red Hat
    Linux/Alpha and Red Hat Linux/SPARC boxed sets.

    - Red Hat Linux CDs 1 and 2.

    - The Linux Applications Library, only in Red Hat Linux/Intel Deluxe and Professional
    boxed sets.

    - Boot diskette, only in Red Hat Linux/Intel boxed sets.

    - License and Registration information.


    Let''s take a quick look at each item:


    ### 2.1.2 The Official Red Hat Linux Installation Guide


    The Official Red Hat Linux Installation Guide is what you''re currently reading.
    It contains the information necessary to install Red Hat Linux.


    ### 2.1.3 The Official Red Hat Linux Getting Started Guide


    The Official Red Hat Linux Getting Started Guide contains information on what
    to do after the installation has taken place. We believe it is both well written
    and informative, and will guide you through the necessary steps of actually using
    your system once the installation is in place.


    The Official Red Hat Linux Getting Started Guide covers topics ranging from learning
    the basics of your system, navigating your system, to GNOME, to connecting to
    the Internet.


    ### 2.1.4 The Official Red Hat Linux Reference Guide


    The Official Red Hat Linux Reference Guide contains information on configuring
    your system, package list information, text-mode installations, and more. Once
    you have installed your system and mastered the basics of navigation, you can
    use this guide to help configure and fine tune Red Hat Linux to your specific
    needs.


    ### 2.1.5 The Official Red Hat Linux Alpha/SPARC Installation Addendum


    #### Alpha, SPARC


    The Official Red Hat Linux Alpha/SPARC Installation Addendum contains information
    of interest to owners of Alpha- and SPARC-based computer systems that will make
    installation of Red Hat Linux more straightforward. (The Official Red Hat Alpha/SPARC
    Installation Addendum is only included in Red Hat Linux/Alpha and Red Hat Linux/SPARC
    boxed sets.)


    ### 2.1.6 CDs 1 and 2


    These compact discs contain the entire Red Hat Linux distribution, including source
    code. CD 1 contains all the binary packages built for your type of computer (Intel,
    Alpha, or SPARC). CD 2 contains the source packages that were used to build the
    binary packages on CD 1.


    ### 2.1.7 Linux Applications Library


    #### Intel


    This compact disc library contains demonstration versions of a number of commercial
    Linux software products. If you purchased Red Hat Linux/Intel Deluxe, you will
    receive the workstation edition. If you purchased Red Hat Linux/Intel Professional,
    you will receive the workstation and server edition of the Linux Applications
    Library. For more information, please refer to the README file in this library.


    ## Chapter 2: Before You Begin


    #### Please Note


    > This CD-ROM library and its contents are completely unsupported by Red Hat,
    Inc.. All questions and issues concerning any software in this pack should be
    directed to the responsible company, and not Red Hat, Inc.


    ### 2.1.8 Boot Disks


    #### Intel


    This diskette is used to start the installation process for Red Hat Linux/Intel.
    Depending on your computer''s configuration and the type of installation you select,
    you may or may not need this boot disk. Instead, you may require a PCMCIA or a
    Network boot disk, depending on your system''s hardware configuration, and the
    installation method you choose. When we discuss the different installation methods
    later in this chapter, we''ll explain which diskettes are needed for each type
    of installation, and give you instructions for producing any diskettes.


    #### Alpha, SPARC


    SPARC and Alpha owners should refer to the Official Red Hat Alpha/SPARC Addendum
    for information on which diskettes are required.


    ### 2.1.9 License and Registration Information


    As a Red Hat Linux 6.1 owner, you are entitled to the benefits of support once
    you have registered. Sign up by going to www.redhat.com/now and entering your
    product ID found in your Red Hat boxed set. Once that has been done, you can go
    to www.redhat.com/support for further information. Our registration program offers
    free FTP access.


    ### 2.1.10 Missing Something?


    If you''ve purchased the Official Red Hat Linux boxed set from Red Hat, Inc. (or
    one of its distributors) and you''re missing one or more of the items listed above,
    please let us know!


    One thing to keep in mind is that Red Hat partners with companies (international
    and domestic) so that we can make Red Hat Linux available to you in the most convenient
    form. Because of this, you might find that your Red Hat Linux boxed set may not
    have been produced by Red Hat.


    Not how to identify our official boxed set? Here''s how: The bottom of our box
    has an ISBN number next to one of the bar codes. That ISBN number should be in
    this form:


    1-58569-xx-y


    (The xx and y will be unique numbers.) If your box has an ISBN number in this
    form, and you''re missing something, feel free to call us at 1-888-733-4281 (+1-919-547-0012
    outside the USA), or to send mail to presales@redhat.com.


    If your box has a different ISBN number (or none at all), you''ll need to contact
    the company that produced your boxed set.


    If Red Hat Linux boxed set is complete, please skip ahead to Section 2.1.11, Checking
    for Updated Diskette Images.


    ## No Boxed Set? No Problem!


    Of course, not everyone purchases a Red Hat Linux boxed set. It''s entirely possible
    to install Red Hat Linux using a CD created by another company, or even via FTP.
    In these cases, you may need to create one or more diskettes to get started.

    '
