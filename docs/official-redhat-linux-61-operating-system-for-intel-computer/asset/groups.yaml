    Kickstart 已重写为新的脚本化格式。现在，你可以向 kickstart 传递一个 Python 对象并动态配置 kickstart 安装。对于熟悉
    kickstart 的人，你会对其新功能和重写方式感到满意。


    ### 1.1.5 用户账户创建


    在新的 Red Hat Linux 6.1 安装过程中，你现在可以设置用户账户。在安装的账户创建部分，你可以设置机器的 root 密码，并创建所需的各种用户账户。


