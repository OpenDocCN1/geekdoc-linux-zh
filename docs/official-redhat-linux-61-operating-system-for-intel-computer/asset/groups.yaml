    # Please Note


    If you intend to perform a workstation- or server-class installation, and you
    already have sufficient unpartitioned disk space, you do not need to read this
    section, and may turn to Section 2.6, A Note About Kernel Drivers. Otherwise,
    please read this section in order to determine the best approach to freeing disk
    space for your Red Hat installation.


    In order to install Red Hat Linux, you must make disk space available for it.
    This disk space needs to be separate from the disk space used by other operating
    systems you may have installed on your computer, such as Windows, OS/2, or even
    a different version of Linux. This is done by dedicating one or more partitions
    to Red Hat Linux.


    Before you start the installation process, one of the following conditions must
    be met:


    +   - Your computer must have enough unpartitioned disk space available to install
    Red Hat Linux.


    +   - Your computer must have one or more partitions that may be deleted, thereby
    freeing up disk space to install Red Hat Linux.


    If you are not sure that you meet these conditions or want to know how to free
    up more space for your Red Hat Linux installation, please refer to the Official
    Red Hat Linux Reference Guide.


    # 2.6 A Note About Kernel Drivers


    During installation of Red Hat Linux, there are some limits placed on the filesystems
    and other drivers supported by the kernel. However, after installation there is
    support for all filesystems available under Linux. At installation time the modularized
    kernel has support for (E)IDE devices, (including ATAPI CD-ROM drives), SCSI adapters,
    and network cards. Additionally, all mice, SLIP, CSLIP, PPP, PLIP, FPU emulation,
    console selection, ELF, SysV IPC, IP forwarding, firewalling and accounting, reverse
    ARP, QIC tape and parallel printers, are supported.'
