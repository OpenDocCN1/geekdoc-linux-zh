    # Section 2.4:Installation Classes


    Please Note

    You will need approximately 600MB of free disk space in order to perform a workstation-class
    installation.


    If your system already runs Windows (Windows 3.1/95/98), a workstation-class installation
    will automatically configure your system to dual-boot using LILO.


    > CAUTION

    A workstation-class installation will remove all existing Linux partitions on
    all hard drives in your system. It will also attempt to set up a dual boot environment
    automatically on your system, if another OS is present.


    # 2.4.2 The Server-Class Installation


    A server-class installation is most appropriate for you if you''d like your system
    to function as a Linux-based server, and you don''t want to heavily customize
    your system configuration.


    # What Does It Do?


    If you choose not to partition manually, a server-class installation removes ALL
    existing partitions on ALL installed hard drives, so choose this installation
    class only if you''re sure you have nothing you want saved! When the installation
    is complete, you''ll find the following partitions:


    +   - A 64MB swap partition.

    - A 256MB partition (mounted as /).

    - A partition of at least 512MB (mounted as /usr).

    - A partition of at least 512MB (mounted as /home).

    - A 256MB partition (mounted as /var).'
