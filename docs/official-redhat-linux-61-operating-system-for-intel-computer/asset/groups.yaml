    # 2 Before You Begin


    While installing Red Hat Linux is a straightforward process, taking some time
    prior to starting the installation can make things go much more smoothly. In this
    chapter, we''ll discuss the steps that should be performed before you start the
    installation.


    > Please Note

    If you are currently running version 2.0 (or greater) Red Hat Linux system, you
    can perform an upgrade. Skim this chapter to review the basic issues relating
    to installation, and read the following chapters in order, following the directions
    as you go. The upgrade procedure starts identically to the installation procedure;
    you will be directed to choose an installation or upgrade after booting the installation
    program and answering a few questions.


    There are five tasks you should perform prior to installing Red Hat Linux:


    +   1. Make sure you have sufficient documentation to effectively use your Red
    Hat Linux system after the installation (please refer to the Official Red Hat
    Linux Reference Guide for more information).

    2. Make sure you have access to the Red Hat Linux components required for installation.

    3. Make sure you know your computer''s hardware configuration and networking information
    (the Official Red Hat Linux Reference Guide for more help).

    4. Decide, based on the first two tasks, what method will you use to install Red
    Hat Linux.

    5. Determine where on your hard drive(s) Red Hat Linux will reside.


    Let''s start by making sure you have the correct components needed for your Red
    Hat Linux installation.


    # 2.1 Getting the Red Hat Linux Components


    If you''ve purchased the Red Hat Linux boxed set, you''re ready to go! However,
    mistakes occasionally happen, so now is a good time to double-check the contents
    of your boxed set. If you haven''t purchased a Red Hat Linux boxed set, skip to
    No Boxed Set No Problem! in Section 2.1.10.'
