    Red Hat Linux 6.1 is the latest in a long line of software from Red Hat. We hope
    you are using Red Hat Linux as much as we''ve enjoyed bringing it to you.


    One of the difficulties new users to Linux encounter is the necessary "learning
    curve," which accompanies any new experience. After all, many new users are accustomed
    to working "just so"; having to make some adjustments can cause a bit of frustration.


    Have patience, and you''ll begin to see the flexibility and power that millions
    of Linux users have already discovered.


    Installing an operating system can take some time. The brains behind the brain
    of your computer, an OS isn''t exactly like installing a single application. Installing
    Red Hat Linux takes time, patience, knowledge of your hardware components -- and
    sometimes, a little luck.


    We hope our installation and user documentation will help you throughout these
    important first steps. If this is your first time using or installing Linux, please
    read through this entire manual before attempting your installation. You might
    also want to make notes of your hardware components and refer to http://www.redhat.com/corp/support/hardware/index.html
    to make certain that your computer''s hardware is compatible.


    If you use another operating system, you should pay particular attention to partitioning
    details outlined in the Official Red Hat Linux Reference Guide.


    And please register your product as soon as possible. Registration of Red Hat
    Linux 6.1 entitles you to installation support, preferred FTP access and more.
    Sign up at www.redhat.com/now.


    Thanks again for supporting Red Hat. We hope you have an enjoyable experience
    using Red Hat Linux.


    ## An Overview of This Manual


    This manual is organized to guide you through the process of installing Red Hat
    Linux with ease. Toward that goal, let''s take a glance at each chapter to help
    you get acclimated:


    Chapter 1, New Features of Red Hat Linux 6.1:


    - + 2 If you will be using a PCMCIA device (a laptop for instance) during the
    install you should create a PCMCIA boot disk. Section 2.3, Need a PCMCIA Boot
    Disk? will describe how that disk is made.


    ## Section 0.5: Notes from the Editor


    packages that are installed on your machine. The upgrade process preserves existing
    configuration files using a .rpms extension (e.g., sendmail.cf.rpms) and leaves
    a log telling what actions it took in /tmp/upgrade.log. As software evolves, configuration
    file formats can change, so you should carefully compare your original configuration
    files to the new files before integrating your changes.


    ## A Word from the Developers


    We would like to thank all our beta testers for entrusting their systems to early
    versions of Red Hat Linux and taking the time to submit bug reports from the front,
    especially those of you who have been with Red Hat since the "Halloween" release
    and earlier. We would also like to thank Linus Torvalds and the hundreds of developers
    around the world for creating, truly, one of the wonders of distributed development.


    And, again, we''d like to thank you for your interest in Red Hat Linux!


    The Red Hat Development Team


    ## Notes from the Editor


    Our evolutionary process of expanding the scope of this Official Red Hat Installation
    Guide continues. As before, we''ve updated the chapters related to the actual
    installation process, but we''ve narrowed down the scope of the installation guide
    to only cover the most common installation method (installing from a CD-ROM).
    Other installation methods are covered in the Official Red Hat Linux Reference
    Guide. We''ve also updated the New Features chapter to reflect all the good stuff
    that has been added to Red Hat Linux 6.1. We consider this to be "business as
    usual."


    ## We Need Feedback!


    If you spot a typo in the Installation Guide, or if you''ve thought of a way to
    make this manual better, we''d love to hear from you! Be sure to mention the manual''s
    identifier:


    Inst(EN)-3.0-Print-RHI (09/99)


    That way we''ll know exactly which version of the guide you have.


    Please send mail to:


    docs@redhat.com


    If you have a suggestion, try to be as specific as possible when describing it.
    If you''ve found an error, please include the section number and some of the surrounding
    text so we can find it easily. We may not be able to respond to every message
    sent to us, but you can be sure that we''ll be reading them all!


    ## I Couldn''t Have Done it Without...


    Many thanks go out to the past authors of this manual. A great deal of their work
    is still here. Thanks also go out to the developers and testers who have patiently
    listened to my questions and even more patiently gave me answers.


    A "BIG" thank you also goes out to the members of the documentation team. Paul
    Gallagher, our editor, has done a wonderful job of proof reading and editing this
    manual. Edward Bailey, "fearless leader" and head of the documentation team, has
    kept me to speed and helped push me in the right direction. Carole Williams, resident
    chocolate lover, has been more than helpful getting the Support FAQ of this manual
    together, as well as patiently piecing together parts of the Official Red Hat
    Linux Alpha/SPARC Installation Addendum. Wayne Sherrill, the newest addition to
    our team, has put together the text mode installation information that can be
    found in the Official Red Hat Linux Reference Guide.


    Thanks are also due to the readers of past Installation Guides. Without their
    corrections, suggestions and even occasional praises, I wouldn''t know if I weren''t
    on the right track. Finally, thanks goes out to everyone at Red Hat for their
    help.


    Sandra A. Moore & The Red Hat Documentation Team


    ## New Features of Red Hat Linux 6.1


    This chapter describes features that are new to Red Hat Linux 6.1. If you are
    interested in reading about non-installation features, please refer to the Official
    Red Hat Reference Guide.


    ## Installation-Related Enhancements


    Here is a list of the many changes which have been made:


    - GUI Mode

    - Customizable Workstation-Class Installations

    - Flexible Workstation- and Server-Class Installations

    - Scriptable Kickstart

    - User Account Creation

    - Software Support

    - Up Front Configuration


    Let''s look at each one in more detail.


    ### 1.1.1 GUI Mode


    The most notable change in Red Hat Linux 6.1 is the new GUI format of the installation.
    Not only will you have the convenience of using your mouse throughout the installation,
    the screens themselves are more intuitive. Help screens have also been added to
    make the installation go more smoothly.


    ### 1.1.2 Customizable Workstation-Class Installations


    New to the installation is the ability to choose a more customized workstation-class
    installation. You can choose from a standard Window System and GNOME or substitute
    KDE for GNOME. These new options help to guarantee all of the desired packages
    are installed and allow you the convenience of a simple installation.


    ### 1.1.3 Flexible Workstation- and Server-Class Installations


    Both workstation- and server-class installations have been improved with the ability
    to manually partition your hard drives. Rather than have the installation''s preset
    partitions created, you can now set up your own partitions as you would do in
    a custom-class installation.


    ### 1.1.4 New Scriptable Kickstart


    Kickstart has been rewritten to a new scriptable format. Now, you can pass kickstart
    a Python object and dynamically configure kickstart installation. For those familiar
    with kickstart, you are sure to be pleased with its new features and the way it
    has been rewritten.


    ### 1.1.5 User Account Creation


    During the new Red Hat Linux 6.1 installation, you are now able to set up user
    accounts. In the account creation portion of the installation, you can set your
    machine''s root password, as well as create the various user accounts you may
    need.


    ### 1.1.6 Software RAID Support


    New to Red Hat Linux is the ability to set up RAID devices (available only for
    multiple hard drives) when you set up your partitions during the installation.
    We only recommend this option if you have previous RAID experience. For more information
    about RAID, please refer to the Official Red Hat Linux Reference Guide.


    ### 1.1.7 Up Front Configuration


    Up front configuration allows you to completely configure your Red Hat Linux system
    before making any actual changes (ex: partitioning or installing packages) to
    your hard drive(s). The new installation program writes all configuration files
    to your machine''s memory. Only after configuration has been completed will changes
    be made to your system.

