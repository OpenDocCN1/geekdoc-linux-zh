    #### A.1 记得注册


    如果您拥有官方版本的 Red Hat Linux 6.1，请记得注册您作为 Red Hat 客户应享有的福利。


    根据您购买的官方 Red Hat Linux 产品，您将有权获得以下任何一项或全部福利：


    - 官方 Red Hat 支持 —— 从 Red Hat, Inc. 支持团队处获得有关您安装问题的解帮助。

    - 优先 FTP 访问 —— 不再需要半夜访问拥挤的镜像站点。Red Hat Linux 6.1 的所有者可以免费访问 priority.redhat.com，这是
    Red Hat 的优选客户 FTP 服务，提供全天候的高带宽连接。

    - Red Hat 更新代理程序 (Red Hat Update Agent) —— 一旦有更新的 RPM，即可直接收到 Red Hat 的电子邮件。使用更新代理程序过滤器仅接收您感兴趣的主题的通知。

    - 幕后故事：Red Hat 官方电子新闻 —— 每月直接从 Red Hat 接收最新新闻和产品信息。


    如需注册，请访问 http://www.redhat.com/now。您可以在官方 Red Hat Linux 盒内的红白卡片上找到您的个人产品 ID (Personal
    Product ID)。


    #### A.2 Red Hat 支持概览


    Red Hat 为官方 Red Hat Linux 盒装产品提供安装协助，并涵盖单台计算机的安装。此类协助旨在帮助成功安装 Red Hat Linux。安装协助通过电话和网络提供。


    Red Hat 支持将尝试在安装过程启动之前回答您可能有的任何问题。这包括：


    - 硬件兼容性问题

    - 基础硬盘分区策略


    Red Hat, Inc. 支持还可以在安装过程中提供协助：


    ### 附录 A：获取技术支持


    - 让 Red Hat Linux 操作系统识别任何受支持的硬件。

    - 协助活动分区（active partitioning）提供帮助。

    - 配置 Red Hat Linux 和至多一个其他操作系统（仅限 Intel 平台），使用 Linux 引导加载程序 LILO 进行双引导。请注意，不支持第三方引导加载程序和分区软件。


    我们还可以帮助您完成基础的安装后任务，例如：


    - 使用 XF86Setup 或 Xconfigurator 成功配置 X Window 系统。

    - 配置本地端口打印机打印文本。

    - 配置鼠标。


    我们的安装协助服务旨在让您尽可能快、尽可能容易地运行 Red Hat Linux。然而，您可能还想对 Red Hat Linux 系统进行许多其他操作（从编译自定义内核到设置
    Web 服务器），这些并不涵盖范围内。


    关于这些任务的协助，可以通过 HOWTO 文档、Linux 相关网站和商业出版物获得丰富的在线信息。Red Hat 操作系统在安装光盘的 /doc/HOWTO
    目录下包含了各种 Linux HOWTO 文档，以纯文本文件的形式存在，可以从 Red Hat Linux 和其他操作系统轻松读取。


    有很多 Linux 相关网站。寻找 Red Hat Linux 信息的最佳起点是 Red Hat, Inc. 网站：


    ```

    http://www.redhat.com/

    ```


    有很多 Linux 相关。如果您是 Linux 新手，一本涵盖 Linux 基础的书将是无价之宝。我们可以推荐几本书：Bill Ball 的《Using Linux》；Bryan
    Pfaffenberger 的《Linux Explained》；Jon "maddog" Hall 的《Linux for Dummies》；以及 Mark
    G. Sobell 的《A Practical Guide to Linux》。


    Red Hat 还提供各种基于事件的支持计划，以协助安装协助未涵盖的配置问题和任务。请参阅 Red Hat 支持网站获取更多信息。Red Hat, Inc.
