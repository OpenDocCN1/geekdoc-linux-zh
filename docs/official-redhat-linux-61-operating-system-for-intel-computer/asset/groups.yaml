    ## Section 3.2:Starting the Installation Program


    ### 3.2.1 Booting the Installation Program


    To start installing Red Hat Linux, insert the boot disk into your computer''s
    first diskette drive and reboot (or boot using the CD-ROM, if your computer supports
    this). Your BIOS settings may need to be changed to allow you to boot from the
    diskette or CD-ROM.


    There are four possible boot methods:


    - local boot disk -- use in cases where your machine will not support a bootable
    CD-ROM and you want to install from a local CD-ROM or a hard drive.

    - network boot disk -- use to install from NFS, FTP and HTTP installation methods.

    - PCMCIA boot disk -- use in cases where you need PCMCIA support, but your machines
    does not support booting from the CD-ROM drive or if you need PCMCIA support in
    order to make use of the CD-ROM drive on your system. This boot disk offers you
    all installation methods (CD-ROM, hard drive, NFS, FTP, and HTTP).

    - bootable CD-ROM -- to be used in cases where your machine supports a bootable
    CD-ROM drive and you want to perform a local CD-ROM installation.


    After a short delay, a screen containing the boot : prompt should appear. The
    screen contains information on a variety of boot options. Each boot option also
    has one or more help screens associated with it. To access a given help screen,
    press the appropriate function key as listed in the line at the bottom of the
    screen.


    You should keep two things in mind:


    - The initial screen will automatically start the installation program if you
    take no action within the first minute. To disable this feature, press one of
    the help screen function keys.

    - If you press a help screen function key, there will be a slight delay while
    the help screen is read from diskette.


    Normally, you''ll only need to press [Enter] to boot. Watch the boot messages
    to see whether the Linux kernel detects your hardware. If it does not properly
    detect your hardware, you may need to restart the installation in "expert" mode.
    If your hardware is properly detected, please continue to the next section.


    Expert mode can be entered using the following boot command:


    ```

    boot: linux expert

    ```


    ## Please Note


    The initial boot messages will not contain any references to SCSI or network cards.
    This is normal as these devices are supported by modules that are loaded during
    the installation process.


    Options can also be passed to the kernel.


    For example, to instruct the kernel to use all the RAM in a 128 MB system, enter:


    ```

    boot: linux mem=128M

    ```


    After entering any options, press [Enter] to boot using these options. If you
    need to specify boot options to identify your hardware, please make note of them
    -- they will be needed later.


    ## Intel


    The Red Hat Linux/Intel CD-ROM can also be booted by computers that support bootable
    CD-ROMs. Not all computers support this feature, so if yours can''t boot from
    the CD-ROM, there is one other way to start the installation without using a boot
    disk. The following method is specific to Intel-based computers only.


    If you have MS-DOS installed on your system, you can boot directly from the CD-ROM
    drive without using a boot disk.


    To do this (assuming your CD-ROM is drive d:), use the following commands:


    ```

    C:\> d:

    D:\> cd \dosutils

    D:\>dosutils> autoboot.bat

    ```


    This method will not work if run in a DOS window -- the autoboot.bat file must
    be executed with DOS as the only operating system. In other words, Windows cannot
    be running.


    If your computer can''t boot directly from CD-ROM (and you can''t use a DOS-based
    auto-boot), you''ll have to use a boot diskette to get things started.


    ## 3.3 Selecting an Installation Method


    Next, you will be asked what type of installation method you wish to use. You
    can install Red Hat Linux via any of five basic methods:


    | Method | Description | Requirements |

    | :--- | :--- | :--- |

    | CD-ROM | If you have a CD-ROM drive and the Red Hat Linux CD-ROM. Please refer
    to Chapter 4, Graphical User Interface Installation to begin a CD-ROM installation.
    | Requires a boot disk, a bootable CD-ROM or a PCMCIA boot disk. |

    | Hard Drive | If you are installing from copied Red Hat Linux files to a local
    hard drive. Please refer to the Official Red Hat Linux Reference Guide for hard
    drive installation instructions. | Requires a boot disk or a PCMCIA boot disk.
    |

    | NFS Image | If you are installing from an NFS Image server which is exporting
    the Red Hat Linux CD-ROM or a mirror image of Red Hat Linux. | Requires a network
    or PCMCIA boot disk. Please refer to the Official Red Hat Linux Reference Guide
    for network installation instructions. Please also note that NFS installation
    may also be performed in the new GUI mode. |

    | FTP | If you are installing directly from an FTP server. | Requires a network
    or PCMCIA boot disk. Please refer to the Official Red Hat Linux Reference Guide
    for FTP installation instructions. |

    | HTTP | If you are installing directly from an HTTP Web server. | Requires a
    network or PCMCIA boot disk. Please refer to the Official Red Hat Linux Reference
    Guide for HTTP installation instructions. |


    ## 4 Graphical User Interface Installation


    ### 4.1 Beginning the Installation


    If you are planning to install via CD-ROM using the new graphical interface, please
    read on. If you are planning to do a text mode installation, type text at the
    boot: prompt and refer to the Official Red Hat Linux Reference Guide.


    ### 4.1.1 Installing from CD-ROM


    To install Red Hat Linux from CD-ROM, choose "CD-ROM," and select OK. When prompted,
    insert the Red Linux CD into your CD-ROM drive. Once done, select OK. The installation
    program will then probe your system and attempt to identify your CD-ROM drive.
    It will start looking for an IDE (also known as ATAPI) CD-ROM drive. If found,
    the installation will continue. If not detected, you will be asked what type of
    CD-ROM drive you have.


    SCSI Select this if your CD-ROM drive is attached to a supported SCSI adapter;
    the installation program will then ask you to choose a driver. Choose the driver
    that most closely resembles your adapter. You may specify options for the driver
    if necessary; however, most drivers will detect your adapter automatically.


    Other If your CD-ROM drive is neither an IDE nor a SCSI, it is "other." Sound
    cards with proprietary CD-ROM interfaces are good examples of this type. The installation
    program presents a list of drivers for supported CD-ROM drives -- choose a driver
    and, if necessary, specify any options.


    ## Please Note


    A partial list of optional parameters for CD-ROM drives


    If you have an IDE (ATAPI) CD-ROM drive and the installation program fails to
    find it (in other words, it asks what type of CD-ROM drive you have), you must
    restart the installation, and enter linux hdx=cdrom. Replace the X with one of
    the following letters, depending on the interface unit it is connected to, and
    whether it is configured as master or slave:


    - First IDE controller, master

    - First IDE controller, slave

    - Second IDE controller, master

    - Second IDE controller, slave


    (If you have a third and/or fourth controller, simply continue assigning letters
    in alphabetical order, going from controller to controller, and master to slave.)


    After booting, the installation program begins by displaying the language screen.
    If you wish to abort the installation process at this time, simply eject the boot
    diskette or CD-ROM now and reboot your machine.


    You can safely cancel the installation at any point before you configure X for
    your system. However, once X has been configured, partitions will be written and
    packages will be installed.


    ### 4.2 Selecting a Language


    Using your mouse, please select your preferred language to use for the installation
    and the system default (see Figure 4–1, Selecting a Language).

