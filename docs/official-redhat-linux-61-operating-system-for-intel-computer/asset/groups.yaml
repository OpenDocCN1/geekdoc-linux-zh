    # # OFFICIAL redhat. Linux 6.1

    ### Operating System


    Red Hat Linux is a powerful, extremely stable, next generation computer operating
    system that provides a high performance computing environment for both server
    and desktop PCs.


    Installation Guide


    This step-by-step guide walks you through the Red Hat Linux CD-ROM graphical installation
    process. Learn about the new features before you install, what you need before
    beginning the installation, booting the installation program, and how to complete
    the installation.


    After you''ve installed Red Hat Linux, the Red Hat Linux Getting Started Guide
    is your resource to learn how to navigate and explore the power of your new system.


