    ## 3.1 The Installation Program User Interface


    This chapter explains how to start Red Hat Linux. We’ll cover the following areas:

    - Getting familiar with the installation program’s interface;

    - Starting the installation program;

    - Selecting an installation method.


    By the end of this chapter, the installation program will be running, and you
    will select the appropriate method.


    ### 3.1.1 A Note about Consoles


    There is more to the Red Hat installation program than the dialog boxes it presents
    as you go through. In fact, the installation program makes several kinds of diagnostic
    messages available to you, in addition to giving you a wo to enter commands from
    a shell prompt. It presents this information on virtual consoles which you can
    switch between a single keystroke.


    These virtual consoles can be very helpful if you encounter a problem while installing
    Red Hat. Please see Table 3–1, Console, Keystrokes, and Contents for a listing
    of the consoles, the keystroke to switch to, and their contents.


    ## 3.2 Starting the Installation Program


    Now it''s time to start installing Red Hat Linux. To start the installation, it
    is first necessary to boot the installation program. Before we start, please make
    sure you have all the resources you''ll need for the installation. If you''ve
    already read through 2, *Before You Begin*, and followed the instructions, you
    should be ready.

