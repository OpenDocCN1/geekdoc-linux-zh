    ## 第 4.15 节：选择软件包组


    要选择单个软件包，请用鼠标左键双击它，或者单击一次将其高亮，然后点击下方的“选择安装的软件包”（Select Package For Installation）按钮。您已选择安装的任何软件包上都将出现一个绿色的勾标记。


    在选择某个软件包进行安装之前，如果想查看相关信息，请左键单击一次将其高亮，信息将显示在屏幕底部，以及软件包的名称和大小。


    ## 请注意


    某些软件包（如内核和某些库）是每个 Red Hat Linux 系统所必需的，且无法选择或取消选择。这些基础软件包是默认被选中的。


    ### 4.15.2 未解决的依赖关系


    许多软件包为了能够正常运行，依赖于必须安装在您的系统上的其他软件包。例如，许多图形化的 Red Hat 系统管理工具需要 `python` 和 `pythonlib`
    软件包。为了确保您的系统拥有实现完全功能所需的所有软件包，Red Hat Linux 在您每次安装或删除软件包时都会检查这些软件包的依赖关系。


    如果任何软件包都需要另一个您未选择安装的软件包，程序将列出这些未解决的依赖关系，并给您解决它们的机会（参见图 4–17，“未解决的依赖关系”）。


    只有当缺少所选软件包所需的某些软件包时，“未解决的依赖关系”屏幕才会出现。在缺失软件包列表下方，屏幕底部有一个“安装软件包以满足依赖”（Install packages
    to satisfy dependencies）复选框，默认是选中的。如果您保持勾选此项，安装程序将通过将所有所需的软件包添加到选定的软件包列表中自动解决软件包依赖关系。


    ## 第 4 章：图形用户界面安装


    ### 图 4–17 未解决的依赖关系


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_63_0.png)


    ## 4.16 GUI X 配置工具


    如果您决定安装 X Window System 软件包，现在就有有机会为您的系统配置 X 服务器了。如果您没有选择安装 X Window System 软件包，请跳到第
    4.17 节，*安装软件包*（Installing Packages*）。


    > 警告

    > 如果您选择安装 X，这将是写入您机器内存的安装最后部分。一旦您按下“下一步”（Next）按钮，分区将被写入且软件包将进行安装。如果您想取消安装，应该在硬盘被重写之前现在重启。


    ## 第 4.16 节：GUI X 配置工具


    Xconfigurator 首先探测您的系统，试图确定您拥有什么种类型的视频硬件（参见图 4–18，*X 配置屏幕*/*X Configuration Screen*）。如果失败，Xconfigurator
    将列出一个显卡和显示器列表供您选择。


    如果您的显卡没有出现在列表中，则 XFree86 可能不支持它。但是，如果您对您的显卡有技术了解，可以选择“**列出**”（Listed），并尝试通过将显卡的视频芯片与可用的
    X 服务器匹配来尝试进行配置。


    ### 图 4–18 X 配置屏幕


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_64_0.png)


    接下来，**Xconfigurator** 会提示您输入显卡上安装的显存大小。如果您不确定，请查阅显卡随附的文档。选择比可用内存更大的内存不会损坏您的显卡，但如果这样做了，XFree86
    服务器可能无法正常启动。


    如果选定的显卡可能有视频时钟芯片，Xconfigurator 将显示时钟芯片列表。推荐的选择是“**无时钟设置**”（No Clockchip Setting），因为在大多数情况下，XFree86
    可以自动检测到合适的时钟芯片。


    如果您的显示器没有出现在列表中，选择“**自定义**”（Custom）。如果您选择了“**自定义**”，**Xconfigurator** 将提示您选择显示器的水平同步范围和垂直同步范围（这些值通常可以在显示器随附的文档中找到，或者从您的显示器供应商或制造商处获得）。


    ## 第 4 章：图形用户界面安装


    > 注意

    > 不建议选择与您的显示器“相似”的显示器，除非您确定所选的显示器性能没有超过您显示器的能力。如果您这样做，可能会超频您的显示器并导致其损坏或毁灭。


    一旦确定了硬件，您就可以测试配置设置了。我们建议您测试配置，以确保分辨率和颜色是您想要使用的。


    如果您想自定义 X 配置，请确保已勾选“配置 X 配置”（Configure X Configuration）按钮。如果您选择自定义，将出现另一个屏幕，让您选择想要多少颜色（256、65,536
    或 1600 万）以及您的分辨率应该是多少。再次，您将有测试配置的。


    您也可以选择“跳过 X 配置”（Skip X Configuration），如果您愿意在安装后设置 X 或者根本不设置。


    ## 4.17 安装软件包


    此时，在所有软件包安装完成之前，您没有其他事情需要做了（参见图 4–19，“安装软件包”）。此过程发生的快慢取决于您选择的软件包数量以及您计算机的速度。


    ## 第 4.18 节：创建启动盘


    ### 图 4–19 安装软件包


    安装软件包 (Installing Packages)

