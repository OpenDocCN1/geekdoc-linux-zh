    ## 4.11 网络配置


    如果你有一个网卡且尚未配置网络信息，现在你有机会配置网络了。参考图 4–11，*网络配置界面*。


    图 4–11 网络配置界面


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_55_0.png)


    选择你的设备类型以及是否想要使用 DHCP 进行配置。如果你有多个设备，每个设备都将保留你提供的信息。你可以在设备之间切换（例如 eth0 和 eth1），你提供的信息将针对每个设备是特定的。如果你选择了“启动时激活”，则你的网络接口将在系统启动时启动。如果你没有
    DHCP 客户端访问权限或不确定这些信息是什么，请联系你的网络管理员。


    接下来，在适用的情况下，输入 **IP 地址**、**子网掩码**、**网络地址**和**广播地址**数字。如果你不确定其中任何一项的内容，请联系你的网络管理员。


    利用此机会为你的系统输入一个名称。如果不输入，你的系统将被识别为 `localhost`。


    ## 4.12 时区配置


    最后，输入网关、主 DNS、备 DNS 和三级 DNS 数字。


    你可以通过选择计算机的物理位置，或者通过你的时区相对于协调世界时（也称为 UTC）的偏移量来设置时区。


    图 4–12 配置时区


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_56_0.png)


    注意屏幕顶部的两个标签页（参见图 4–12，配置时区）。第一个标签页为你提供了按位置进行配置的能力。通过此选项，你可以选择你的视图。在选择视图时，你的选项有：世界、北美、南美、太平洋地区、欧洲、非洲和亚洲。


    从交互式地图上，你可以点击由黄色点指示的特定城市；将出现一个红色的 X 表示你的选择。你也可以滚动列表并选择你所需的时区。


    第二个标签页为你提供了使用 UTC 偏移量的能力。UTC 为你提供了一个供选择的偏移量列表，以及一个设置夏令时的选项。


    对于这两个标签页，都有“系统时钟使用 UTC”的选项。如果你知道系统已设置为 UTC，请选择此项。


    如果你在启动 Red Hat Linux 系统后想要更改时区配置，可以使用 `/usr/sbin/timeconfig` 命令。


    ## 4.13 账户配置


    账户配置界面允许你设置 root 密码。此外，你还可以设置用户账户，以便在安装完成后登录（参见图 4–13，创建账户）。


    图 4-13 账户创建


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_57_0.png)


    ### 4.13.1 设置 root 密码


    安装程序将提示你为系统设置一个 root 密码。你将使用 root 密码首次登录你的 Red Hat Linux 系统。


    root 密码长度至少为六个字符；你输入的密码不会显示在屏幕上。你必须输入两次密码；如果两个密码不匹配，安装程序将要求你重新输入。


    你应该将 root 密码设成你能记住的内容，但不要是别人容易猜到的内容。你的名字、电话号码、qw、password、root、123456 和 anteater
    都是糟糕密码的例子。良好的密码将数字与大写字母混合，且不包含单词：例如 Aard387vark 或 420BMttNT。记住密码是区分大小写的。


    **请注意**


    root 用户（也称为超级用户）对整个系统具有完全访问权限；出于因此，以 root 用户身份登录最好仅用于系统维护或管理。


    ### 4.13.2 设置用户账户


    如果你选择现在创建用户账户，那么在安装完成后你将有一个账户可以登录。这允许你安全、方便地登录计算机，而无需拥有 root 权限即可创建其他账户。


    输入账户名称。然后为该用户账户输入并确认密码。输入账户用户的全名并按 [Enter]。你的账户信息将添加到账户列表中，并清空账户字段以便你添加另一个用户。


    你也可以选择“新建”（New）来添加新用户。输入用户信息并使用“添加”（Add）按钮将用户添加到账户列表中。


    你还可以“编辑”（Edit）或“删除”（Delete）你已创建的或不再需要的用户账户。


    ## 4.14 身份验证配置


    如果执行的是工作站级安装，请跳到第 4.16 节，GUI 配置工具。


    如果执行的是服务器级安装，请跳到第 4.17 节，安装包。


    如果你不需要设置网络密码，可以跳过此节。如果你不确定是否应该这样做，请向你的系统管理员寻求帮助。


    除非你要设置 NIS 身份验证，否则你会发现 MD5 和影子密码（shadow passwords）都被选中了（参见图 4–14，身份验证配置）。我们建议同时使用两者以确保你的机器尽可能安全。


    要配置 NIS 选项，你必须连接到 NIS 网络。如果你不确定是否连接到了 NIS 网络，请询问你的系统管理员。


    图 4–14 身份验证配置


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_59_0.png)


    - MD5 密码 --允许使用长密码（最多 256 个字符），而不是标准的八个字母。

    - 影子密码 -- 提供了一种安全的密码保留方法。密码存储在 `/etc/shadow` 中，只有 root 用户可读取。

    - 启用 NIS -- 允许你运行一组具有共同密码的计算机。有两个选项供选择：

    - NIS 域 -- 此选项允许你指定你的系统属于哪个域或组。

    - NIS 服务器 -- 此选项使你的计算机使用特定的服务器，而不是向局域网“广播”消息。


    ## 4.15 选择软件包组


    在完成分区的选择和配置后，你就可以选择软件包了。


    你可以选择组件（按功能将软件包分组在一起的项，例如 C、网络工作站或 Web 服务器）、单个软件包或两者的结合。


    要选择组件，请点击其旁边的复选框（参见图 4–15，选择软件包组）。


    图 4-15 选择软件包组


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_60_0.png)


    选择你想要安装的软件包组。要选择组包，点击软件包旁边的复选框。要单独选择软件包，必须勾选屏幕底部的“单独软件包”框。


    选择你想要安装的每个组件。选择“所有”（Everything，位于列表末尾）将安装 Red Hat Linux 包含的所有包。选择所有包将需要接近 1.5GB
    的可用磁盘空间。


    要单独选择软件包，勾选屏幕底部的“单独软件包”框。


    ### 4.15.1 单独选择软件包


    在选择想要安装的组件后，你可以选择或取消选择单个软件包。安装程序会显示该组中的软件包列表，你可以使用鼠标进行选择或取消（参见图 4–16，单独选择软件包）。


    图 4-16 单独选择软件包


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_61_0.png)


    xcreensaver 软件包包含了各种屏幕保护程序，供你享受烧脑、消耗、浪费和催眠般的视觉乐趣。


    如果你需要用于 X Window系统的屏幕保护程序，请安装 xcreensaver 软件包。


    在屏幕左侧你会看到各种软件包组的目录列表。当你展开此列表（双击选择）并双击单击目录时，可安装的软件包列表将出现在右侧。


    '
