    支持网站位于以下 URL：


    ```

    http://www.redhat.com/support/

    ```


    #### A.5.1 注册支持


    您需要：


    1. 在 http://www.redhat.com/now 创建个人资料。

    2. 输入姓名和密码。

    3. 根据需要更新电子邮件地址。


    如果您担心隐私，请参阅 Red Hat 的隐私声明：http://www.redhat.com/legal/privacy_statement.html。


    #### A.6 节：技术支持问题


    技术支持既是一门科学，也是一门艺术。在大多数情况下，支持技术人员依靠客户的观察和交流来诊断并解决问题。因此，您在陈述问题和报告问题时，尽可能详细清晰至关重要。应包含的内容示例下：


    - 问题症状，例如：“Linux 无法访问我的 CD 驱动器。当它尝试时，我会收到超时错误。”

    - 问题开始的时间，例如：“我的系统一直运行良好，直到昨天雷暴袭击了我的地区。”

    - 您对系统做的任何更改，例如：“我增加了一块新硬盘并使用‘Partition Wizzo’ 添加了 Linux 分区。

    - 与您的情况可能相关的其他信息，例如安装方法（光盘、NFS、HTTP）。


    #### A.6.1 如何发送支持问题


    请登录 http://www.redhat.com/support 并开启新的服务请求，或拨打支持电话。如果您的产品附带电话支持，或您购买了


