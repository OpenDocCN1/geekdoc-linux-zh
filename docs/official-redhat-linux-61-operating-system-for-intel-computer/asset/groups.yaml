    ## 4.19 安装完成


    恭喜！您的 Red Hat Linux 61 安装现在已完成！


    安装程序将提示您准备重启系统。不要忘记移除软驱器或 CD-ROM 驱动器中的任何设备。如果您决定跳过安装 LILO，现在需要使用您的启动盘。


    在您的计算机正常开机序列完成后，您应该会看到 LILO 的标准提示符，即 `boot:`，您可以执行以下任何操作：


    - 按 [回车] -- 启动 LILO 的默认启动项。

    - 输入启动标签并按 [回车] --  LILO 启动与输入的标签对应的操作系统。

    - 什么都不做 -- 在 LILO 的超时期（默认为五秒）后，LILO 将自动启动默认启动项。


    执行操作启动 Red Hat Linux。您应该看到一个或多个屏幕的消息滚动。最后，您应该看到登录：提示符或 GUI 登录界面（如果您安装了 X Window
    System 并选择自动启动 X）。


    如果您不确定下一步做什么，我们建议您从阅读《Red Hat Linux 入门指南》开始，作为使用 Red Hat Linux 的入门。《Red Hat Linux
    入门指南》涵盖了与系统基础相关的主题，并包含了更新后的 GNOME 用户指南。对于经验丰富的用户，您可能会发现《Red Hat Linux 参考指南》更有帮助。


