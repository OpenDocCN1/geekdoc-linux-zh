  mdcn: "\n电话支持合同，您需要拨打的电话将在注册过程中提供。\n\n## A.7 支持常见问题解答 (FAQ)\n\n### A.7.1 问：发送至 support@redhat.com\
    \ 的邮件被退回\n\n我向 support@redhat.com 发送了邮件，但邮件退回给了。这是什么问题？\n\n### A.7.2 答：目前不使用 support@redhat.com\
    \ \n\n为了更好地服务客户，Red Hat 正在重新设计我们的电子邮件支持流程。目前，support@redhat.com 地址无法使用。在此期间，请通过\
    \ Web 或电话寻求支持。\n\n### A.7.3 问：系统不允许登录\n\n我知道我已经注册了，但系统不允许我登录。\n\n### A.7.4 答：旧的登录名和密码无效\n\
    \n您可能正在尝试使用旧的登录名和密码，或者仅仅是输错了登录名或密码。\n\n## B.1 节在 MS-DOS 下制作磁盘盘\n\n## B 制作安装磁盘\n\
    \n有时需要从镜像文件创建磁盘盘（例如，您可能需要使用从 Red Hat Linux CD 获取的更新磁盘镜像）。\n\n如名称所示，镜像文件是包含磁盘盘内容精确副本（或镜像）的文件。由于磁盘盘除了文件中的数据外还包含文件系统信息，因此在将镜像写入磁盘盘之前，它是不可用的。\n\
    \n开始之前，您需要一张空白的、已格式化的、高密度（1.44 MB）3.5 英制磁盘盘。您需要一台带有 3.5 英制磁盘驱动器且能够运行 DOS 程序（或在大多数类\
    \ Linux 操作系统中找到 `dd` 工具程序）的计算机。\n\n镜像文件位于您的 Red Hat Linux CD 中的以下目录中：\n\n- images\
    \ -- 包含 Red Hat Linux/Intel 的启动目录，以及用于 Red Hat Linux/Alpha 的各种内核和内存盘镜像。\n  在 Red\
    \ Hat Linux/SPARC CD 上，此目录包含启动镜像和一个用于网络启动的镜像。\n\n- milo -- 包含用于 Red Hat Linux/Alpha\
    \ 微加载程序 MILO 的各种镜像。此目录仅存在于 Red Hat Linux/Alpha CD 上。\n\n一旦您选择了适当的镜像，就可以将镜像文件传输到磁盘盘了。如前所述，这可以在支持\
    \ DOS 的系统上完成，也可以在运行类 Linux 操作系统的系统上完成。\n\n## B.1 在 MS-DOS 下制作磁盘盘\n\n要在 MS-DOS\
    \ 下制作磁盘盘，请使用 Red Hat CD 中 `dosutils` 目录包含的 `rewrite` 工具。首先，对空白的 3.5 英制磁盘盘进行适当标记（例如“Boot\
    \ Diskette”、“Supplemental Diskette”等）。将其插入磁盘盘驱动器。然后，使用以下命令（假设您的 CD 是 d 驱动器）：\n\
    \n```\nC:\\ d:\nD:\\> cd dosutils\nD:\\dosutils> rewrite\nD:Enter disk image source\
    \ file name: ..\\images\\boot.img\nter target diskette drive: a:\nPlease insert\
    \ a formatted diskette into drive A: and\npress --ENTER-- : [Enter]\n```\n\n##\
    \ 附录 B 制作安装磁盘盘\n\n```\nD:\\dosutils>\n```\n\n`rawwrite` 首先要求您输入磁盘镜像的文件名；输入您想要写入的镜像目录和名称（例如，`..\\\
    images\\boot.img`）。然后 `rawwrite` 要求输入要写入镜像的磁盘盘驱动器；输入 `a:`。最后，`rawwrite` 要求确认所选驱动器中已插入格式化的磁盘盘。按下\
    \ [Enter] 确认后，`rawwrite` 将镜像文件复制到磁盘盘上。如果您需要制作另一个磁盘盘，请标记另一个磁盘盘并再次运行 `rawwrite`，指定适当的镜像文件。\n\
    \n## B.2 在类 Linux 系统下制作磁盘盘\n\n要在 Linux（或其他任何类 Linux 操作系统）下制作磁盘盘，您必须拥有写入代表3.5 英制磁盘驱动器的设备的权限（在\
    \ Linux 下称为 `dev/fd0`）。首先，对空白的、已格式化的磁盘盘进行适当标记（例如“Boot Diskette”、“Supplemental\
    \ Diskette”等）。将其插入磁盘盘驱动器（但不要执行命令）。挂载 Red Hat Linux CD 后，进入包含所需镜像文件的目录，并使用以下命令（根据情况更改文件名和磁盘盘设备名称）：\n\
    \n```\ndd if=..\\images\\boot.img of=/dev/fd0 bs=1440\n```\n\n如果您需要制作另一个磁盘盘，请标记另一个磁盘盘并再次运行\
    \ `dd`，指定适当的镜像文件。\n\n## 索引\n\n## 索引\n\n- A\n  附录, Alpha... 13\n  附录, SPARC...\
    \ 13\n  添加分区... 47\n  Alpha 附录... 13\n  ATAPI CD-ROM\n  无法识别，问题... 33\n  认证配置...\
