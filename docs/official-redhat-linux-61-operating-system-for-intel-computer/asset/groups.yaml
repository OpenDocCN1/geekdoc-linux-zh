    如果您打算进行工作站级或服务器级安装，并且已经拥有足够的未分区磁盘空间，则无需阅读本节内容，可以直接转到第 2.6 节“关于内核驱动程序的说明”。否则，请阅读本节，以确定为您的
    Red Hat 安装释放磁盘空间的最佳方法。


    为了安装 Red Hat Linux，您必须为其提供可用的磁盘空间。此部分磁盘空间需要与您可能在计算机上安装的其他操作系统（例如 Windows、OS/2
    甚至不同版本的 Linux）所使用的磁盘空间隔离开。这是通过将一个或多个分区专门分配给 Red Hat Linux 来的。


    在开始安装过程之前，必须满足以下条件之一：


    - 您的计算机必须有足够的未分区磁盘空间来安装 Red Hat Linux。

    - 您的计算机必须有一个或多个可以删除的分区，从而释放磁盘空间以安装 Red Hat Linux。


    如果您不确定自己是否符合这些条件，或者想知道如何为 Red Hat Linux 安装释放更多空间，请参阅《Red Hat Linux 官方参考指南》。


    ## 2.6 关于内核驱动程序的说明


    在安装 Red Hat Linux 期间，内核对支持的文件系统和其他驱动程序有一些限制。然而，安装后，将支持 Linux 下所有可用的文件系统。在安装时，模块化内核支持
    (E)IDE 设备（包括 ATAPI CD-ROM 驱动器）、SCSI 适配器和网卡。此外，支持所有鼠标、SLIP、CSIP、PPP、PLIP、FPU 仿真、控制台选择、ELF、SysV
    IPC、IP 转发、防火墙和计数、反向 ARP、QIC 磁带和并行打印机。


    ## 2.9 节：系统需求表


    > 注意

    由于 Red Hat 支持在许多不同类型的硬件上安装，许多驱动程序（包括 SCSI 适配器、网卡和许多 CD-ROM 的驱动程序）并未构建到安装期间使用的
    Linux 内核中；相反它们以模块的形式存在，并在安装过程中根据需要加载。如有必要，您可以在加载这些模块时有机会为它们指定选项，实际上，这些驱动程序将忽略您在启动提示符处为它们指定的任何选项。


    安装完成后，您可能希望重新构建一个包含您的特定硬件配置支持的内核。请参阅《Red Hat Linux 官方参考指南》来构建自定义内核。请注意，在大多数情况下，没有必要构建自定义内核。


    ## 2.7 如果您遇到问题……


    如果您在安装之前、期间或之后有任何疑问或问题，请检查 Red Hat 常见问题解答列表。您可以在以下地址找到 FAQ：

    http://www.redhat.com/knowledgebase/index.html


    在许多情况下，快速检查一下 FAQ 可以让您快速恢复工作。


    ## 2.8 最后的说明


    在开始之前，请阅读所有的安装说明；这将为您需要做出的任何决策做好准备，并应该消除潜在的意外。


    ## 2.9 系统需求表


    请使用提供的空间填写您的系统设置和要求。这将帮助您记录当前的系统状况，并使安装过程变得更加简单。（请参阅 http://www.redhat.com/corp/support/hardware/index.html
