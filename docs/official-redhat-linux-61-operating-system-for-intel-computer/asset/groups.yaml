    ## 4.8 节：划分您的系统


    ## 注意


    图 4–7 划分您的系统


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_44_0.png)


    Red Hat Linux 6.1 中分区工具是 Disk Druid。以前安装过 Red Hat Linux 的用户可能用过 Disk Druid，但你会发现在这个版本中，Disk
    Druid 有了一个整洁的图形界面。


    除特殊情况外，Disk Druid 可以处理典型 Red Hat Linux 安装的分区需求。


    ## 第 4 章：图形用户界面安装

    ### Alpha, SPARC


    注意如果你决定在 Alpha 或 SPARC 系统上使用 Disk Druid，需要注意某些点。请参阅《Red Hat Linux Alpha/SPARC
    安装附》获取更多信息。


    ### 4.8.1 分区字段


    “分区”（Partitions）部分中的每行代表一个磁盘分区。该部分的每行有五个不同的字段：


    **挂载点 (Mount Point)：**


    此字段指示分区挂载的位置。如果分区存在但显示为“未设置”（not set），则你需要定义其挂载点。双击分区或使用 Edit（编辑）键。


    我们建议，除非你有其他理由，否则你应该创建以下分区：


    - 一个交换分区（swap partition）（至少 16MB）—— 交换分区用于支持虚拟内存。如果你的电脑只有 16MB RAM 或更少，你必须创建一个交换分区。即使你有更多内存，仍建议创建一个交换分区。交换分区的最小大小应等于电脑的
    RAM，或 16MB（取两者较大者）。


    - 一个 /boot 分区（最大 16MB）—— 挂载在 /boot 上的分区包含操作系统内核以及在引导过程中使用的所有文件。由于大多数 PC BIOS 的局限性，创建一个小分区来存放这些文件是一个好主意。该分区的大小不应超过
    16MB。


    - 一个根分区（root partition）（600MB-1.5GB）—— 这是 "/"（根目录）所在。在此设置下，所有文件（存储在 /boot 中的除外）都位于根分区上。600MB
    的根分区允许等同于工作站级的安装（剩余空间非常小），而 1.5GB 的根分区将允许你安装每个软件包。


    **设备 (Device)：**


    此字段显示分区的设备名称。


    **请求 (Requested)：**


    “请求”字段显示分区的原始大小。要重新定义大小，你必须删除当前分区并使用 Add（添加）按钮重新创建。


    **实际 (Actual)：**


    “实际”字段显示当前分配给分区的空间。


    **类型 (Type)：**


    此字段显示分区的类型（例如 Linux 原生或 DOS）。


    ### 4.8.2 添加分区时出现的问题


    如果你尝试添加分区但 Disk Druid 无法执行你的请求，你将看到一个对话框，列出所有当前未分配的分区以及无法分配的原因。注意，未分配的分区也会显示在
    Disk Druid 的主屏幕上（尽管你可能需要滚动“分区”部分才能看到它们）。


    当你滚动查看“分区”部分时，你可能会看到一条“未分配的请求分区”（Unallocated Requested Partition）消息（红色字体），随后是一个或多个分区。这种常见原因是该分区没有足够的可用空间。在任何情况下，分区保持未分配的原因将显示在分区请求的挂载点之后。


    要修复未分配的请求分区，你必须将分区移动到另一个具有可用空间的驱动器，调整分区大小以适应当前驱动器，或完全删除该分区。使用 Edit 按钮或通过点击分区进行更改。


    ### 4.8.3 驱动器摘要


    “驱动器摘要”（Drive Summaries）部分中的每行代表系统上的一个硬盘。每行具有以下字段：


    **驱动器 (Drive)：**


    此字段显示硬盘的设备名称。


    **几何结构 [C/H/S]：**


    此字段显示硬盘的几何结构。几何结构由三个数字组成，代表硬盘报告的磁道（cylinders）、磁（heads）和扇区（sectors）数量。


    **总计 (Total)：**


    “总计”字段显示硬盘的总可用空间。


    **可用 (Free)：**


    “可用”字段显示硬盘空间中仍有多少未分配空间。


    **已用 (Used)：**


    这些字段以兆字节（MB）和百分比显示当前分配给分区的硬盘空间。


    驱动器摘要部分仅用于指示你电脑的磁盘配置。它不是为了作为指定特定分区目标硬盘的手段。那是通过 4.8.5 节“添加分区”中的“允许的驱动器”字段实现的。


    ### 4.8.4 Disk Druid 按钮


    这些按钮控制 Disk Druid 的操作。它们用于添加和删除分区以及更改分区属性。此外，还有按钮用于接受你所做的更改或退出 Disk Druid。让我们顺序查看每个按钮。


    **Add（添加）：**


    - 用于请求新分区。选中后，将出现一个对话框，包含必须填充的字段（如挂载点和大小）。


    **Edit（编辑）：**


    - 用于修改当前高亮分区的属性。


    **Delete（删除）：**


    - 用于删除当前高亮分区。


    **Reset（重置）：**


    - 将分区恢复到原始状态。


    **Make RAID Device（创建 RAID 设备）：**


    - 创建 可以为任何分区提供冗余。


    ### 4.8.5 添加分区


    要添加新分区，选择 **Add** 按钮。将出现一个对话框（见图 4–8）。


    图 4–8 添加分区


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_48_0.png)


    > 注意

    你至少需要分配一个分区给 Red Hat，可选地分配更多。


    - **挂载点 (Mount Point)：** 高亮显示分区的挂载点。例如，如果此分区应该是根分区，则输入 /；为 usr 分区输入 /usr，以此此类推。


    - **大小 (Size (MB))：** 输入分区的大小（兆字节）。注意此字段以...开头。


    - **增长以填满 (Grow To Fill)：** 此复选框指示你在上一个字段中输入的大小是将被视为分区的精确大小还是其最小大小。勾选时，分区将增长以填满硬盘上的所有可用空间。


    - **允许的类型 (Allowable Type)：** 此字段包含不同分区类型的列表（例如 Linux 原生或 DOS）。使用鼠标选择相应的分区类型。


    - **允许的驱动器 (Allowable Drives)：** 此字段包含安装在系统上的硬盘列表。如果某个硬盘的框被高亮，则可以在该硬盘上创建所需的分区。


    - **Ok（确定）：** 当你对分区的设置满意并希望创建它时，选择此按钮并按 [Enter] 键。


    - **Cancel（取消）：** 如果你不想创建分区，选择此按钮并按 [Enter] 键。


    ## 第 4 章：图形用户界面安装

    （继续）


    ### 4.8.6 编辑分区


    要编辑分区，选择 Edit 按钮或双击现有分区。


    > 注意

    如果分区已存在于你的硬盘上，你只能更改分区的挂载点。如果你想进行任何其他更改，你需要删除分区并重新创建。


    ### 4.8.7 删除分区


    要删除分区，在“分区”部分高亮它并双击 Delete 按钮。系统将要求确认删除。


    ### 4.9 选择要格式化的分区


    选择你想格式化的分区。所有新创建的分区都应该格式化。此外，任何包含不再需要的数据的现有分区应该


    '
