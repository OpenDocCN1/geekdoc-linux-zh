    # Chapter 4:Graphical User Interface Installation


    # Please Note


    The contents of the "Boot label" column will be what you will need to enter at
    LILO''s boot: prompt in order to boot the desired operating system. However, if
    you forget the boot labels defined on your system, you can always press [Tab]
    at LILO''s boot: prompt to display a list of defined boot labels.


    #  4.10.1 Configuring LILO


    +   - Create boot disk The option is checked by default. If you do not want to
    create a boot disk, you should deselect this option. However, we strongly urge
    you to create a boot disk. A boot disk can be handy for a number of reasons:


    +   - Use It Instead of LILO -- You can use a boot disk instead of LILO. This
    is handy if you''re trying Red Hat Linux for the first time, and you''ll feel
    more comfortable with the boot process for your other operating system is left
    unchanged. With a boot disk, going back to your other operating system is as easy
    as removing the boot disk and rebooting.


    +   - Use It In Emergencies -- The boot disk can be used in conjunction with the
    rescue mode, which will give you the tools necessary to get your system back on
    its feet 1

    - Use If Another Operating System Overwrites LILO -- Other operating systems may
    not be as flexible as Red Hat Linux when it comes to boot methods. Often, installing
    or updating another operating system can cause the boot record (originally containing
    LILO) to be overwritten, making it impossible to boot your Red Hat Linux installation.
    The boot disk can then be used to boot Red Hat Linux so you can reinstall LILO.


    1 To do this, you have several options:


    +   ⇒ Using the CD-ROM to boot, type `linux rescue` at the boot:` prompt.


    +   ⇒ Using the network boot disk, type `linux rescue` at the boot:` prompt. You
    will then be prompted to pull the rescue image from the network.


    +   ⇒ Using the boot disk included with the Red Hat Linux set, type `linux rescue`
    at the boot:` prompt. You can then load the rescue images from the CD-ROM or hard
    drive.'
