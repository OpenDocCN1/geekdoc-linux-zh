    ## 第 2.1 节：获取 Red Hat Linux 组件


    ## 2 在开始之前


    虽然安装 Red Hat Linux 是一个简单的过程，但在开始安装之前花一些时间准备可以让整个过程变得更加顺畅。在本章中，我们将讨论在开始安装之前应该执行的步骤。


    > 注意

    > 如果您目前运行版本 2.0（或更高）的 Red Hat Linux 系统，可以进行升级。请快速浏览本章以回顾与安装相关的基本问题，并按照顺序阅读后续章节，按照指示操作。升级程序与安装程序完全相同；在启动安装程序并回答几个问题后，系统将引导您选择“安装”或“升级”。


    在安装 Red Hat Linux 之前，您应该执行五项任务：


    - 1. 确保您有足够的文档，以便在安装后有效使用您的 Red Hat Linux 系统（更多信息请参阅《官方 Red Hat Linux 参考指南》）。

    - 2. 确保您可以获得安装所需的 Red Hat Linux 组件。

    - 3. 确保您了解电脑的硬件配置和网络信息（如需帮助，请参阅《官方 Red Hat Linux 参考指南》）。

    - 4. 根据前两个任务，决定您将使用什么方法安装 Red Hat Linux。

    - 5. 确定 Red Hat Linux 将存放在您的硬盘的哪个位置。


    让我们从确保您拥有安装 Red Hat Linux 所需正确组件开始。


    ## 2.1 获取 Red Hat Linux 组件


    如果您购买了 Red Hat Linux 盒装版，那么您已经准备好了！然而，偶尔会发生错误，因此现在是检查盒装版内容的良好时机。如果您没有购买 Red Hat
    Linux 盒装版，请跳到第 2.1.10 节的“没有盒装版也没问题”。


    ### 2.1.1 Red Hat Linux 盒装版的内容


    Red Hat Linux 盒装版包含以下物品：


    - 《官方 Red Hat Linux 安装指南》

    - 《官方 Red Hat Linux 入门指南》

    - 《官方 Red Hat Linux 参考指南》

    - 《官方 Red Hat Linux Alpha/SPARC 安装附录》，仅包含 Red Hat Linux/Alpha 和 Red Hat Linux/SPARC
    盒装版。

    - Red Hat Linux CD 1 和 2。

    - Linux 应用程序库，仅包含 Red Hat Linux/Intel Deluxe 版和 Professional 版盒装版。

    - 启动盘，仅包含 Red Hat Linux/Intel 盒装版。

    - 许可证和注册信息。


    让我们快速查看每个物品：


    ### 2.1.2 官方 Red Hat Linux 安装指南


    《官方 Red Hat Linux 安装指南》就是您目前正在阅读的内容。它包含了安装 Red Hat Linux 所需的信息。


    ### 2.1.3 官方 Red Hat Linux 入门指南


    《官方 Red Hat Linux 入门指南》包含了安装完成后需要做什么的信息。我们认为该指南既写得良好又内容详实，将在安装完成后引导您完成实际使用系统的必要步骤。


    《官方 Red Hat Linux 入门指南》涵盖了从学习系统基础知识、浏览系统到 GNOME 以及连接互联网的各种话题。


    ### 2.1.4 官方 Red Hat Linux 参考指南


    《官方 Red Hat Linux 参考指南》包含了有关配置系统、软件包列表信息、文本模式安装等信息。一旦您安装了系统并掌握了导航基础，就可以使用此指南帮助根据您的特定需求配置和微调
    Red Hat Linux。


    ### 2.1.5 官方 Red Hat Linux Alpha/SPARC 安装附录


    #### Alpha, SPARC


    《官方 Red Hat Linux Alpha/SPARC 安装附录》包含了基于 Alpha 和 SPARC 的计算机系统所有感兴趣的信息，这将使得 Red
    Hat Linux 的安装更加简单。（《官方 Red Hat Alpha/SPARC 安装附录》仅包含在 Red Hat Linux/Alpha 和 Red
    Hat Linux/SPARC 盒装版中。）


    ### 2.1.6 CDs 1 和 2


    这些光盘包含了 Red Hat Linux 发行版。CD 1 包含了为您的计算机类型（Intel、Alpha 或 SPARC）构建的所有软件包。CD 2 包含了构建
    CD 1 的源代码。


    ### 2.1.7 Linux 应用程序库


    #### Intel


    此库包含了许多商业软件的演示版本。如果您购买了 Red Hat Linux Deluxe，将获得工作站版。如果您购买了 Red Hat Linux Professional，将获得服务器版。更多信息请参阅此库中的
    README 文件。


    ## 第 2 章：在开始之前


    > 注意

    > 此光盘库不受 Red Hat, Inc. 的支持。有关此包的任何问题都应咨询相关公司。


    ### 2.1.8 启动磁盘


    #### Intel


    此磁盘用于启动 Red Hat Linux/Intel 的安装。根据您的硬件配置和选择的安装类型，您可能需要 PCMCIA 磁盘或网络磁盘。在本章后面的部分讨论不同的安装方法时，我们将说明各种类型所需的磁盘。


    #### Alpha, SPARC


    SPARC 和 Alpha 所有者应参考《官方 Red Hat Alpha/SPARC 安装附录》以了解所需的磁盘。


    ### 2.1.9 许可证和注册信息


    作为 Red Hat Linux 6.1 所有者，注册后即可获得支持。访问 www.redhat.com 并输入位于盒装版中的产品 ID 进行注册。完成后，您可以访问
    www.redhat.com 获取更多信息。我们的注册计划提供免费 FTP 访问。


    ### 2.1.10 缺少什么？


    如果您是从 Red Hat, Inc. 或其分销商处购买的官方 Red Hat Linux 盒装版，但缺少上述的任何物品，请告诉我们！


    需要注意的是，Red Hat 与国内外公司合作，以便我们以最方便的形式向您提供 Red Hat Linux。因此，您可能会发现您的 Red Hat Linux
    盒装版可能并非由 Red Hat 生产。


    不知道如何识别我们的官方盒装版？这里是方法：我们的盒子底部条形码旁边有一个 ISBN 码。该 ISBN 码应该是这种格式：


    1-58569-xx-y


    （xx 和 y 是唯一的数字。）如果您的盒上有这种格式的 ISBN 码，且您缺少某些物品，请随时拨打 1-888-733-4281（美国境外拨 +1-919-547-0012），或发送邮件至
    presales@redhat.com。


    如果您的盒上有不同的 ISBN 码（或没有），您需要联系生产该盒装版的公司。


    如果 Red Hat Linux 盒装版完整，请跳到第 2.1.11 节，“检查更新的磁盘镜像”。


