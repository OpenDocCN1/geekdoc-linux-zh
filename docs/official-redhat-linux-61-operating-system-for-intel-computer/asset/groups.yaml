    your Red Hat Linux directly, and will need to use another boot method (such as
    a boot diskette). Use this option only if you are sure you have another way of
    booting your Red Hat Linux system!


    If your computer accesses a hard drive in LBA mode, check Use linear mode. This
    is most used in situations where the drive is a SCSI and you are getting errors
    accessing the drive.'
