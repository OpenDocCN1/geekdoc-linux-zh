    \ Red Hat Linux 系统根文件系统的分区上填充单词 **linux**。其他分区\n\n## 4.10.2 LILO 的替代方案\n\n如果您不想使用\
    \ LILO 启动您的 Red Hat 系统，有几种替代方案：\n\n-   启动盘：如前所述，可以使用安装程序创建的启动盘（如果您选择创建了）。\n- \
    \  LOADLIN：您可以从 MS-DOS 加载 Linux。遗憾的是，它需要在 MS-DOS 分区上有 Linux 内核副本（如果有 SCSI 适配器，还需要初始内存磁盘）。实现此点的唯一方法是使用其他方法（例如软盘上的\
    \ LILO）启动您的 Red 系统，然后将内核拷贝到 MS-DOS 分区。LOADLIN 可从 ftp://metalab.unc.edu/pub/Linux/system/dualboot/\
    \ 及镜像站点获取。\n-   SYSLINUX：一种与 LOADLIN 非常类似的 MS-DOS 程序。它也可以从 ftp://metab-lab.unc.edu/pub/Linux/system/boot/loaders/\
    \ 及镜像站点获取。\n-   某些商业引导加载器：例如 System Commander 和 Partition Magic，它们能够启动 Linux（但仍需要在根分区中安装\
    \ LILO）。\n\n## 4.10.3 SMP 主板与 LILO\n\n此节专门适用于 SMP 主板。如果安装程序检测到您的系统上有 SMP 主板，它将创建两个\
    \ lilo.conf 条目，而不是通常的一个。\n\n其中一个条目命名为 linux，另一个命名为 linux-up。默认启动 linux。但是，如果您在运行\
    \ SMP 内核时遇到问题，可以选择启动 linux-up 条目。您将保留之前所有的功能，但将仅使用单个处理器运行。\n\n"
