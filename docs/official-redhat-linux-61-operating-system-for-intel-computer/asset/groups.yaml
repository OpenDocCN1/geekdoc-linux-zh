    ## 第3.2 节：启动安装程序


    ### 3.2.1 启动安装程序


    要开始安装 Red Hat Linux，请将启动盘插入计算机的第一个软驱驱动器并重启（或者如果您的计算机支持，请使用 CD-ROM 启动）。您可能需要更改
    BIOS 设置，以允许从软驱或光驱（CD-ROM）中启动。


    共有四种可能的启动方法：


    - 本地启动盘 (local boot disk) —— 用于机器不支持可启动的 CD-ROM，且您希望从本地 CD-ROM 或硬盘进行安装的情况。

    - 网络启动盘 (network boot disk) —— 用于通过 NFS、FTP 和 HTTP 安装方法进行安装。

    - PCMCIA 启动盘 (PCMCIA boot disk) —— 用于需要 PCMCIA 支持，但机器不支持从 CD-ROM 驱动器启动，或者您需要 PCMCIA
    支持才能使用系统上的 CD-ROM 驱动器的情况。此启动盘提供了所有的安装方法（CD-ROM、硬盘、NFS、FTP 和 HTTP）。

    - 可启动 CD-ROM (bootable CD-ROM) —— 用于机器支持可启动的 CD-ROM 驱动器，且您希望执行本地 CD-ROM 安装的情况。


    稍等片刻，将出现一个包含 boot : 提示符的屏幕。该屏幕包含各种启动选项的信息。每个启动选项还关联有一个或多个帮助屏幕。要访问特定的帮助屏幕，请按下屏幕底部行中列出的相应功能键。


    您应该记住以下两点：


    - 如果您在第一分钟内没有采取任何操作，初始屏幕将自动启动安装程序。要禁用此功能，请按下一个帮助屏幕的功能键之一。

    - 如果您按下帮助屏幕的功能键，在从软驱读取帮助屏幕时会有短暂的延迟。


    通常情况下，您只需要按 [Enter] 即可启动。观察启动消息以查看 Linux 内核是否检测到您的硬件。如果它没有正确检测到您的硬件，您可能需要在“专家”（expert）模式下重新启动安装。如果硬件已正确检测，请继续下一节。


    可以使用以下启动命令进入专家模式：


    ```

    boot: linux expert

    ```


    ## 请注意


    初始启动消息将不包含任何关于 SCSI 或网卡的引用。这是正常的，因为这些设备由安装过程中加载的模块支持。


    选项也可以传递给内核。


    例如，要指示内核在 128 MB 的系统中使用所有内存，请输入：


    ```

    boot: linux mem=128M

    ```


    输入任何选项后，按 [Enter] 使用这些选项启动。如果您需要指定启动选项来识别您的硬件，请记录下它们 —— 稍后需要。


    ## Intel


    支持可启动 CD-ROM 的计算机也可以启动 Red Hat Linux/Intel CD-ROM。并非所有计算机都支持此功能，因此，如果您的计算机无法从
    CD-ROM 启动，还有一种方法可以在不使用启动盘的情况下启动安装。以下方法专门适用于基于 Intel 的计算机。


    如果您的系统中安装了 MS-DOS，您可以直接从 CD-ROM 驱动器启动，而无需使用启动盘。


    要这样做（假设您的 CD-ROM 驱动器是 d:），请使用以下命令：


    ```

    C:\> d:

    D:\> cd \dosutils

    D:\>dosutils> autoboot.bat

    ```


    此方法在 DOS 窗口中运行将无效 ——必须以 DOS 作为唯一的操作系统执行 autoboot.bat 文件。换句话说，Windows 不能运行。


    如果您的计算机无法直接从 CD-ROM 启动（且您无法使用基于 DOS 的自动启动），您将必须使用启动软盘来启动。


    ## 3.3 选择安装方法


    接下来，系统将询问您希望使用哪种类型的安装方法。您可以通过以下五种基本方法之一安装 Red Hat Linux：


    | 方法 | 描述 | 要求 |

    | :--- | :--- | :--- |

    | CD-ROM | 如果您有 CD-ROM 驱动器和 Red Hat Linux CD-ROM。请参阅第 4 章“图形用户界面安装”以开始 CD-ROM
    安装。 | 需要启动盘、可启动的 CD-ROM 或 PCMCIA 启动盘。 |

    | 硬盘 | 如果您正在从复制到本地硬盘的 Red Hat Linux 文件进行安装。请参阅《Red Hat Linux 参考指南》获取硬盘安装说明。 |
    需要启动盘或 PCMCIA 启动盘。 |

    | NFS 镜像 | 如果您正在从导出 Red Hat Linux CD-ROM 或 Red Hat Linux 镜像的 NFS 镜像服务器进行安装。 |
    需要网络或 PCMCIA 启动盘。请参阅《Red Hat Linux 参考指南》获取网络安装说明。请注意，NFS 安装也可以在新的 GUI 模式下进行。 |

    | FTP | 如果您直接从 FTP 服务器进行安装。 | 需要网络或 PCMCIA 启动盘。请参阅《Red Hat Linux 参考指南》获取 FTP 安装说明。
    |

    | HTTP | 如果您直接从 HTTP 网站服务器进行安装。 | 需要网络或 PCMCIA 启动盘。请参阅《Red Hat Linux 参考指南》获取 HTTP
    安装说明。 |


    ## 4 图形用户界面安装


    ### 4.1 开始安装


    如果您计划通过新的图形界面通过 CD-ROM 进行安装，请继续阅读。如果您计划进行文本模式安装，请在 boot: 提示符处输入 text 并参阅《Red Hat
    Linux 参考指南》。


    ### 4.1.1 从 CD-ROM 安装


    要从 CD-ROM 安装 Red Hat Linux，请选择“CD-ROM”并按 OK。当出现提示时，将 CD 插入您的 CD-ROM 驱动器。完成后，按
    OK。安装程序将探测您的系统并尝试识别 CD-ROM 驱动器。它将寻找 IDE（也称为 ATAPI）CD-ROM 驱动器。如果找到，安装将继续。如果没有检测到，系统将询问您使用的是哪种
    CD-ROM 驱动器。


    SCSI 如果您的 CD-ROM 驱动器连接到支持的适配器，请选择此项；随后安装程序会要求您选择驱动程序。选择与您的适配器最匹配的驱动程序。需要时可以指定驱动选项，但大多数驱动程序会自动检测。


    其他 如果您的 CD-ROM 驱动器既不是 IDE 也不是，它是“其他”。具有专用接口的光卡是此类很好的例子。安装程序提供支持的 CD-ROM 驱动程序列表
    —— 选择一个驱动程序并在必要指定任何选项。


    ## 请注意


    CD-ROM 可选参数列表


    如果您有一个 IDE (ATAPI) CD-ROM 驱动器且安装程序未能找到它（换句话说，它询问您使用的是哪种 CD-ROM 驱动器），您必须重新启动安装并输入
    `linux hdx=cdrom`。根据连接的接口单元以及它是配置为主设备还是从设备，将 X 替换为以下字母之一：


    - 第一 IDE 控制器，主设备

    - 第一 IDE 控制器，从设备

    - 第二 IDE 控制器，主设备

    - 第二 IDE 控制器，从设备


    （如果有第三个和或第四个控制器，只需按字母顺序继续分配字母，从控制器到控制器，从主设备到从设备。）


    启动后，安装程序从显示语言屏幕开始。如果您在此处中止安装过程，请现在弹出启动软盘或 CD-ROM 并重启计算机。


    在为系统配置 X 之前的任何时候，都可以安全地取消安装。然而，一旦配置了 X，将写入分区并安装软件包。


    ### 4.2 选择语言


    使用您的鼠标，选择您希望用于安装和系统默认的语言（参见图 4–1，选择语言）。

    '
