    # Chapter 4:Graphical User Interface Installation


    The recommended place to install LILO, unless the MBR already starts another operating
    system loader, such System Commander or OS/2''s Boot Manager. The master boot
    record is a special area on your hard drive that is automatically loaded by your
    computer''s BIOS, and is the earliest point at which LILO can take control of
    the boot process. If you install LILO in the MBR, when your machine boots, LILO
    will present a boot: prompt. You can then boot Red Hat Linux or any other operating
    system you configure LILO to boot (see below).


    # The first sector of your root partition


    Recommended if you are already using another boot loader on your system (such
    as OS/2''s Boot Manager). In this case, your other boot loader will take control
    first. You can then configure that boot loader to start LILO (which will then
    boot Red Hat Linux).


    If you choose to install LILO, please select where you would like LILO to be installed
    on your system (see Figure 4-10, LILO Configuration Screen). If you use only one
    Red Hat Linux you should choose the master boot record (MBR). For systems with
    Win95/98, you should also install LILO to the MBR so that LILO can boot both operating
    systems.


    If you have Windows NT (and you want to install LILO) you should choose to install
    LILO on the first sector of the root partition, not the MBR. Please be sure to
    create a boot disk. In a case as this, Windows NT''s operating system loader will
    be on the MBR and the only way you can choose LILO (on the first sector of your
    root partition) is by using the boot disk. Be sure to check out http://www.linuxdoc.org/HOWTO/mini/Linux+NT-Loader.html
    for more information on setting up LILO and NT.


