    ## 4.11 Network Configuration


    If you have a network card and have not already configured your networking information,
    you now have the opportunity to configure networking. Figure 4–11, *Network Configuration
    Screen*.


    Figure 4–11 Network Configuration Screen


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_55_0.png)


    Choose your device type and whether you would like to configure using DHCP. If
    you have multiple devices, each device will keep the information you have provided.
    You may switch between devices, for example eth0 and eth1, and the information
    you give will be specific to each device. If you select Activate on boot, your
    network interface will be started when you boot. If you do not have DHCP client
    access or are unsure as to what this information is, please contact your network
    administrator.


    Next enter, where applicable, the **IP Address**, **Netmask**, **Network**, and
    **Broadcast** numbers. If you are unsure about any of these, please contact your
    network administrator.


    Take this opportunity to enter a name for your system. If you do not, your system
    will be known as `localhost`.


    ## 4.12 Time Zone Configuration


    Finally, enter the Gateway, Primary DNS, Secondary DNS and Tertiary DNS numbers.


    You can set your time zone either by selecting your computer''s physical location,
    or by your time zone''s offset from Universal Coordinated Time (also known as
    UTC).


    Figure 4–12 Configuring Time Zone


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_56_0.png)


    Notice the two tabs at the top of the screen (see Figure 4–12, Configuring Time
    Zone). The first tab offers you the ability to configure by location. With this
    option, you can choose your view. In choosing view, your options are: World, North
    America, South America, Pacific Rim, Europe, Africa, and Asia.


    From the interactive map, you can click on a specific city, as indicated by the
    yellow dots; a red X will appear to indicate your selection. You can also scroll
    through a list and choose your desired time zone.


    The second tab offers you the ability to use the UTC offset. UTC presents you
    with a list of offsets to choose from, as well as an option to set Daylight Savings
    Time.


    For both tabs, there is the option of selecting System Clock uses UTC. Please
    select this if you know that your system is set to UTC.


    If you wish to change your time zone configuration after you have booted your
    Red Hat Linux system, you may use the /usr/sbin/timeconfig command.


    ## 4.13 Account Configuration


    The Account Configuration screen allows you to set your root password. Additionally,
    you can set up user accounts for you to login to once the installation is complete
    (see Figure 4–13, Account Creation).


    Figure 4-13 Account Creation


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_57_0.png)


    ### 4.13.1 Setting the Root Password


    The installation program will prompt you to set a root password for your system.
    You''ll use the root password to log into your Red Hat Linux system for the first
    time.


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice; if the two passwords
    do not match, the installation program will ask you to enter them again.


    You should make the root password something you can remember, but not something
    that is easy for someone else to guess. Your name, your phone number, qw, password,
    root, 123456, and anteater are all examples of poor passwords. Good passwords
    mix numerals with upper case letters and do not contain words: Aard387vark or
    420BMttNT, for example. Remember that the password is case-sensitive. Write down
    your password and keep it in a secure place.


    **Please Note**


    The root user (also known as the superuser) has complete access to the entire
    system; for this reason, logging in as the root user is best done only to perform
    system maintenance or administration.


    ### 4.13.2 Setting Up User Accounts


    If you choose to create a user account now, you will have an account to log in
    to once the installation has completed. This allows you to safely and easily log
    into your computer without having to be root to create other accounts.


    Enter an account name. Then enter and confirm a password for that user account.
    Enter the full name of the account user and press [Enter]. Your account information
    will be added to the account list, clearing the account fields so you can add
    another user.


    You can also choose New to add a new user. Enter the user''s information and use
    the Add button to add the user to the account list.


    You can also Edit or Delete the user accounts you have created or no longer want.


    ## 4.14 Authentication Configuration


    If performing a workstation-class installation, please skip ahead to Section 4.16,
    GUI Configuration Tool.


    If performing a server-class installation, please skip ahead to Section 4.17,
    Installing Packages.


    You may skip this section if you will not be setting up network passwords. If
    you are unsure as to whether you should do this, please ask your system administrator
    for assistance.


    Unless you are setting up NIS authentication, you will notice that both MD5 and
    shadow passwords are selected (see Figure 4–14, Authentication Configuration).
    We recommend you use both to make your machine as secure as possible.


    To configure the NIS option, you must be connected to an NIS network. If you are
    unsure whether you are connected to an NIS network, please ask your system administrator.


    Figure 4–14 Authentication Configuration


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_59_0.png)


    - MD5 Password -- allows a long password to be used (up to 256 characters), instead
    of the standard eight letters.

    - Shadow Password -- provides a secure method of retaining passwords. The passwords
    are stored in /etc/shadow, which is only readable by root.

    - Enable NIS -- allows you to run a group of computers with a common password.
    There are two options to choose from:

    - NIS Domain -- this option allows you to specify which domain or group your system
    belongs to.

    - NIS Server -- this option causes your computer to use a specific server, rather
    than "broadcasting" a message to the local area network.


    ## 4.15 Selecting Package Groups


    After your partitions have been selected and configured, you are ready to select
    packages.


    You can select components, which group packages together by function (for example,
    C, Networked Workstation, or Web Server), individual packages, or a combination
    of the two.


    To select a component, click on the check box beside it (see Figure 4–15, Selecting
    Package Groups).


    Figure 4-15 Selecting Package Groups


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_60_0.png)


    Select the package groups you want to install. To select a group package, click
    on the check box beside the package. To select packages individually, you must
    check the Individual Packages box at the bottom of the screen.


    Selecting each component you wish to install. Selecting Everything (which can
    be found at the end of the component list) installs all packages included with
    Red Hat Linux. Selecting every package will require close to 1.5GB of free disk
    space.


    To select packages individually, check the Individual Packages box at the bottom
    of the screen.


    ### 4.15.1 Selecting Individual Packages


    After selecting the components you wish to install, you can select or deselect
    individual packages. The installation program presents a list of the packages
    in that group, which you can select or deselect using your mouse (see Figure 4–16,
    Selecting Individual Packages).


    Figure 4-16 Selecting Individual Packages


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_61_0.png)


    The xcreensaver package contains a variety of screensavers for your mind-ninding,
    emotion-eroding, wasting, hypnotized viewing pleasure.


    Install the xcreensaver package if you need screensavers for use with the X Window
    System.


    On the left side of the screen you will see a directory listing of various package
    groups. When you expand this list (double-click to select it) and double-click
    on a single directory, the list of packages available for installation will appear
    on the right.

