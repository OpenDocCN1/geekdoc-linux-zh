    |---|---|--|

    | 3 | [Ctrl]-[Alt]-[F3] | install log (messages from installation program) |

    | 4 | [Ctrl]-[Alt]-[F4] | system log (messages from the kernel, etc.) |

    | 5 | [Ctrl]-[Alt]-[F5] | other messages |

