- pgno: 70
  md: '# Section A.2:An Overview of Red Hat Support


    # # A Getting Technical Support


    # ## A.1 Remember to Sign Up


    If you have an official edition of Red Hat Linux 6.1, please remember to sign
    up for the benefits you''re entitled to as a Red Hat customer.


    You''ll be entitled to receive any or all of the following benefits, depending
    upon the Official Red Hat Linux product you purchased:


    +   - Official Red Hat support -- Get help with your installation questions from
    Red Hat, Inc.''s support team.

    - Priority FTP access -- No more late-night visits to congested mirror sites.
    Owners of Red Hat Linux 6.1 receive free access to priority.redhat.com, Red Hat''s
    preferred customer FTP service, offering high bandwidth connections day and night.

    - Red Hat Update Agent -- Receive e-mail directly from Red Hat as soon as updated
    RPMs are available. Use Update Agent filters to receive notification about only
    those subjects that interest you.

    - Under the Brim: The Official Red Hat E-Newsletter -- Every month, get the latest
    news and product information directly from Red Hat.


    To sign up, go to http://www.redhat.com/now. You''ll find your Personal Product
    ID on a red and white card in your Official Red Hat Linux box.


    # ## A.2 An Overview of Red Hat Support


    Red Hat provides installation assistance for Official Red Hat Linux boxed set
    products and covers installation on a single computer. This assistance is intended
    to help customers successfully install Red Hat Linux. Assistance with installation
    is offered via telephone and the Web.


    Red Hat Support will attempt to answer any questions you may have before the installation
    process is initiated. This includes the following:


    +   - Hardware compatibility questions

    - Basic hard drive partitioning strategies


    Red Hat, Inc. Support can also provide assistance during the installation process:'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Appendix A:Getting Technical Support


    +   * Getting any supported hardware recognized by the Red Hat Linux operating
    system.


    +   * Assistance with deactive partitioning.


    +   * Configuring Red Hat Linux and up to one other operating system (on Intel
    platforms only) to dual-boot using the Linux boot loader LILO. Please note that
    third boot loaders and partitioning software are not supported.


    We can also help you with basic post-installation tasks, such as:


    +   * Successfully configuring the X Window System using XF86Setup or Xconfigurator.


    +   * Configuring a local port printer to print text.


    +   * Configuring a mouse.


    Our installation assistance service is designed to get you up and running with
    Red Hat Linux as quickly and as easily as possible. However, there are many other
    things that you may want to do with your Red Hat Linux system (from compiling
    a custom kernel to setting up a Web server) that are not covered.


    For assistance with these tasks, there is a wealth of on-line information available
    in the form of HOWTO documents, Linux-related websites, and commercial publications.
    The Red Hat Operating system includes the various Linux HOWTO documents on the
    installation CD in the /doc/HOWTO directory as plain text files that can easily
    be read from Red Hat Linux and other operating systems.


    A large number of Linux-related websites are available. The best starting point
    for finding information on Red Hat Linux is the Red Hat, Inc. website at:


    ```

    http://www.redhat.com/

    ```


    Many Linux-related books are available. If you''re new to Linux, a book that covers
    Linux basics will be invaluable. We can recommend several titles: Using Linux
    by Bill Ball; Linux Explained by Bryan Pfaffenberger; Linux for Dummies by Jon
    "maddog" Hall; and A Practical Guide to Linux by Mark G. Sobell.


    Red Hat also offers various incident-based support plans to assist with configuration
    issues and tasks that are not covered by installation assistance. Please see the
    Red Hat Support website for more information. The Red Hat, Inc. Support website
    is located at the following URL:


    ```

    http://www.redhat.com/support/

    ```'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Section A.5:How to Get Technical Support


    # A.3 Scope of Red Hat Support


    Red Hat, Inc. can only provide installation assistance to customers who have purchased
    an Official Red Hat Linux boxed set. If you have obtained Linux from any other
    company, must contact that company for support. Examples of such companies are
    as follows:


    +   * Macmillan

    * Sams/Que

    * Linux Systems Labs LSL

    * Mandrake

    * CheapBytes


    Additionally, Red Hat Linux obtained via any of the following methods does not
    qualify for support from Red Hat:


    +   * Red Hat Linux PowerTools Archive.

    * Downloaded via FTP on the Internet.

    * Included in a package such as Motif or Applixware.

    * Copied or installed from another user''s CD.


    # A.4 The Red Hat, Inc. Support System


    As of October 1999, Red Hat, Inc. has implemented a new technical support system.
    If you signed up for technical support in the past with Red Hat, it may be necessary
    for you to sign up again. The new system will implement a unified login and password
    that will work across the entire Red Hat website. The support system will also
    automatically route and track service requests.


    If you haven''t signed up yet, then you should. Instructions for how to sign up
    are provided next, in Section A.5, How to Get Technical Support.


    # A.5 How to Get Technical Support


    In order to receive technical support for your Official Red Hat product, you first
    have to sign up.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Every Official Red Hat product comes with a Personal Product Identification
    code: a 16 character alphanumeric string. The Personal Product ID for Red Hat
    Linux 6.1 is located on a red and white card that can be found inside the box.
    Your Personal Product ID is on a perforated card that you can punch out and keep
    in a safe place. You need this code, so don''t lose the card!


    # Please Note


    Do not throw away the card with your Personal Product ID. You need the Personal
    Product ID to get technical support. If you lose the certificate, you may not
    be able to receive support.


    The Personal Product ID is the code that will enable your technical support and
    any other benefits or services you purchased from Red Hat, depending upon which
    Red Hat product you purchased. The Personal Product ID may also enable priority
    FTP access, depending on the product that you purchased, for a limited amount
    of time.


    # A.5.1 Signing up for Technical Support


    You''ll need to:


    +   1. Create a customer profile at http://www.redhat.com/now. You may have already
    completed this step; if you have, continue to the next step. If you do not already
    have a customer profile on the Red Hat website, please create a new one.

    2. With your login name and password, please login at the Red Hat Support website
    at http://www.redhat.com/support.

    3. Update your contact information if necessary.


    # Please Note


    If your e-mail address is not correct, communications regarding your technical
    support requests CANNOT be delivered to you, and you will not be able to retrieve
    your login and password by e-mail. Be sure that you give us your correct e-mail
    address.


    If you''re worried about your privacy, please see Red Hat''s privacy statement
    at http://www.redhat.com/legal/privacy_statement.html.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Section A.6:Questions for Technical Support


    4. Add a product to your profile. Please enter the following information:


    +   - The Personal Product ID for the boxed set product.

    - A description of the hardware on which the Red Hat Linux product will be installed.

    - The Support Certificate Number or Entitlement Number if the product is a contract.


    5. Set your customer preferences.


    6. Answer the optional customer questionnaire.


    7. Submit the form.


    If the previous steps were completed successfully, you can now login at http://www.red-hat.com/support
    and open a new technical service request. However, you must still use your Personal
    Product ID in order to obtain technical support via telephone (if the product
    you purchased with phone support). Please do not lose your Personal Product ID,
    or you might not be able to receive support.


    # A.6 Questions for Technical Support


    Technical support is both a science and a mystical art form. In most cases, support
    technicians must rely on customer observations and communications with the customer
    in order to diagnose and solve the problem. Therefore, it is extremely important
    that you are as detailed and clear as possible when you state your questions and
    report your problems. Examples of what you should include are:


    +   - Symptoms of the problem, for example: "Linux is not able to access my CD-ROM
    drive. When it tries, I get timeout errors."

    - When the problem began, for example: "My system was working fine until yesterday,
    when a lightning storm hit my area."

    - Any changes you made to your system, for example: "I added a new hard drive
    and used ''Partition Wizzo'' to add Linux partitions."

    - Other information that may be relevant to your situation, such as the installation
    method (CD-ROM, NFS, HTTP).


    # A.6.1 How to Send Support Questions


    Please login at http://www.redhat.com/support and open a new service request,
    or call the phone number for support. If your product came with phone support,
    or you''ve purchased a'
