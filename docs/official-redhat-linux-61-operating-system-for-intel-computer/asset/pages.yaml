- pgno: 62
  md: '# Section 4.15:Selecting Package Groups


    To select an individual package, double-click on it with the left mouse button,
    or click on it once to highlight it and click on the Select Package For Installation
    button below. A green check mark will appear on any of the packages you have selected
    for installation.


    To read information about a particular package before choosing it for installation,
    left-click it once to highlight it, and the information will appear at the bottom
    of the screen along with the name and size of the package.


    # Please Note


    Some packages (such as the kernel and certain libraries) are required for every
    Red Hat Linux system and are not available to select or deselect. These base packages
    are selected by default.


    # 4.15.2 Unresolved Dependencies


    Many software packages, in order to work correctly, depend on other software packages
    that must be installed on your system. For example, many of the graphical Red
    Hat system administration tools require the python and pythonlib packages. To
    make sure your system has all the packages it needs in order to be fully functional,
    Red Hat Linux checks these package dependencies each time you install or remove
    software packages.


    If any package requires another package which you have not selected to install,
    the program presents a list of these unresolved dependencies and gives you the
    opportunity to resolve them (see Figure 4–17, Unresolved Dependencies).


    The Unresolved Dependencies screen will only appear if you are missing certain
    packages that are needed by your selected packages. Under the list of missing
    packages, there is an Install packages to satisfy dependencies check box at the
    bottom of the screen which is selected by default. If you leave this checked,
    the installation program will resolve package dependencies automatically by adding
    all required packages to the list of selected packages.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Chapter 4:Graphical User Interface Installation


    # ### Figure 4–17 Unresolved Dependencies


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_63_0.png)


    # ## 4.16 GUI X Configuration Tool


    If you decided to install the X Window System packages, you now have the opportunity
    to configure an X server for your system. If you did not choose to install the
    X Window System packages, skip ahead to Section 4.17, *Installing Packages*.


    > > WARNING

    > If you chose to install X, this will be the last part of the installation that
    will be written to your machine''s memory. Once you press the Next button, partitions
    will be written and packages will be installed. If you wish to abort the installation,
    you should reboot now before your hard drive(s) are rewritten.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Section 4.16:GUI X Configuration Tool


    **Xconfigurator first probes your system in an attempt to determine what type
    of video hardware you have (see Figure 4–18, *X Configuration Screen*). Failing
    that, Xconfigurator will present a list of video cards and monitors for you to
    select from.


    If your video card does not appear on the list, XFree86 may not support it. However,
    if you have technical knowledge about your card, you may choose **Listed** and
    attempt to configure it by matching your card''s video chipset with one of the
    available X servers.


    # Figure 4–18 X Configuration Screen


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_64_0.png)


    Next, **Xconfigurator** prompts you for the amount of video memory installed on
    your video card. If you are not sure, please consult the documentation accompanying
    your video card. You will not damage your video card by choosing more memory than
    is available, but the XFree86 server may not start correctly if you do.


    If the video card selected might have a video clockchip, Xconfigurator presents
    a list of clockchips. The recommended choice is **No Clockchip Setting**, since
    XFree86 can automatically detect the proper clockchip in most cases.


    If your monitor does not appear on the list, select **Custom**. If you select
    **Custom**, **Xconfigurator** prompts you to select the horizontal sync range
    and vertical sync range of your'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Chapter 4:Graphical User Interface Installation


    monitor (these values are generally available in the documentation which accompanies
    your monitor, or from your monitor''s vendor or manufacturer).


    > CAUTION

    It is not recommended to select a monitor "similar" to your monitor unless you
    are certain that the monitor you are selecting does not exceed the capabilities
    of your monitor. If you do so, it is possible you may overclock your monitor and
    damage or destroy it.


    Once your hardware has been determined, you can test the configuration settings.
    We recommend that you test your configuration to make sure that the resolution
    and color is what you want to work with.


    If you would like to customize the X configuration, please make sure the Configure
    X Configuration button is selected. If you choose to customize, you will be presented
    with another screen that lets you select how many colors you want (256, 65,536
    or 16 mil) and what your resolution should be. Again, you will have the option
    of testing the configuration.


    You may also choose to Skip X Configuration if you would rather set up X after
    the install or not at all.


    # 4.17 Installing Packages


    At this point there’s nothing left for you to do until all the packages have been
    installed (see Figure 4–19, Installing Packages). How quickly this happens depends
    on the number of packages you’ve selected, and your computer’s speed.'
  merge: -1
  img_proc: true
