- pgno: 37
  md: '# 4.4 Selecting the Mouse


    First, choose the correct mouse type for your system. Try to find an exact match.
    If an exact match cannot be found, choose a mouse type that you are sure is compatible
    with your system (see Figure 4–3, Selecting a Mouse)


    To determine your mouse''s interface, follow the mouse cable back to where it
    plugs into your system. If the connector is at the end of the mouse cable plugs
    into a rectangular connector, you have a serial mouse; if the connector is round,
    you have a PS/2 mouse. If you are installing Red Hat Linux on a laptop computer,
    in most cases the pointing device will be PS/2 compatible.


    If you cannot find a mouse that you are sure is compatible with your system, select
    one of the Generic entries, based on your mouse''s number of buttons, and its
    interface.


