- pgno: 28
  md: '# Section 3.1:The Installation Program User Interface


    # 3 Starting the Installation


    This chapter explains how to start the Red Hat Linux 6.1 installation process.
    We’ll cover

    the following areas in this chapter:


    +   - Getting familiar with the installation program’s user interface;

    - Starting the installation program;

    - Selecting an installation method.


    By the end of this chapter, the installation program will be running on your system,
    and you

    will select the appropriate installation method.


    # 3.1 The Installation Program User Interface


    If you’ve used a graphical user interface before, you’ll find this process to
    be familiar. If you

    have not, you simply need to use your mouse to navigate the screens, to “click”
    buttons or

    Enter text fields. You can also navigate the installation using the [Tab] and
    [Enter] keys.


    # 3.1.1 A Note about Virtual Consoles


    There is more to the Red Hat Linux installation program than the dialog boxes
    it presents as

    y you go through the installation process.


    In fact, the installation program makes several different kinds of diagnostic
    messages available-

    to you, in addition to giving you a way to enter commands from a shell prompt.
    It

    presents this information on five virtual consoles which you can switch between
    a

    single keystroke.


    These virtual consoles can be very helpful if you encounter a problem while installing
    Red

    Hat Linux. Messages displayed on the installation or system consoles can help
    pinpoint the

    problem. Please see Table 3–1, Console, Keystrokes, and Contents for a listing
    of the virtual

    soles, the keystrokes to switch to, and their contents.


    Table 3–1 Console, Keystrokes, and Contents


    | Console | Keystrokes | Contents |

    |---|---||

    | 1 | [Ctrl]-[Alt]-[F1] | installation dialog |

    | 2 | [Ctrl]-[Alt]-[F2] | shell prompt |'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Chapter 3:Starting the Installation


