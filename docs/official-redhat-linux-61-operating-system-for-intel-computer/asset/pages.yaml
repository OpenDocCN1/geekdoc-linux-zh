- pgno: 34
  md: '# 4 Graphical User Interface Installation


    # 4.1 Beginning the Installation


    If you are planning to install via CD-ROM using the new graphical interface, please
    read on.

    \If you are planning to do a text mode installation, type text at the boot: prompt
    and refer to the Official Red Hat Linux Reference Guide.


    # 4.1.1 Installing from CD-ROM


    To install Red Hat Linux from CD-ROM, choose "CD-ROM," and select OK. When prompted,
    insert the Red Hat Linux CD into your CD-ROM drive. Once done, select OK, and
    press [Enter]. The installation program will then probe your system and attempt
    to identify your CD-ROM drive. It will start looking for an IDE (also known as
    ATAPI) CD-ROM drive. If found, the installation will continue. If not detected,
    you will be asked what type of CD-ROM drive you have. You may choose from the
    following types:


    SCSI


    Select this if your CD-ROM drive is attached to a supported SCSI adapter; the
    installation program will then ask you to choose a SCSI driver. Choose the driver
    that most closely resembles your adapter. You may specify options for the driver
    if necessary; however, most drivers will detect your SCSI adapter automatically.


    Other


    If your CD-ROM drive is neither an IDE nor a SCSI, it is an "other." Sound cards
    with proprietary CD-ROM interfaces are good examples of this CD-ROM type. The
    installation program presents a list of drivers for supported CD-ROM drives --
    choose a driver and, if necessary, specify any driver options.


    # Please Note


    A partial list of optional parameters for CD-ROM drives can be found in the Official
    Red Hat Linux Reference Guide, in the General Parameters and Modules appendix.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'If you have an IDE (ATAPI) CD-ROM drive and the installation program fails
    to find it (in

    other words, it asks what type of CD-ROM drive you have), you must restart the
    in-

    stall, and enter linux hdx=cdrom. Replace the X with one of the following letters,

    dending on the interface unit it is connected to, and whether it is configured
    as master or

    slave:


    +   - First IDE controller, master

    - First IDE controller, slave

    - Second IDE controller, master

    - Second IDE controller, slave


    (If you have a third and/or fourth controller, simply continue assigning letters
    in alphabetical

    order, going from controller to controller, and master to slave.)


    Once identified, you will be asked to insert the Red Linux CD into your CD-ROM
    drive.

    Select OK when you have done so. After a short delay, the next dialog box will
    appear.


    After booting, the installation program begins by displaying the language screen.
    If you wish

    to abort the installation process at this time, simply eject the boot diskette
    or CD-ROM now

    and reboot your machine.


    You can safely cancel the installation at any point before you configure X for
    your system.

    However, once X has been configured, partitions will be written and packages will
    be in-

    stalled.


    # 4.2 Selecting a Language


    Using your mouse, please select your preferred language to use for the installation
    and the

    system default (see Figure 4–1, Selecting a Language).'
