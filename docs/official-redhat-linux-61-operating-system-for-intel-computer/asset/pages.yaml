- pgno: 10
  md: '# 1 New Features of Red Hat Linux 6.1


    This chapter describes features that are new to Red Hat Linux 6.1 installation
    process. If you are interested in reading about non-installation-related new features,
    please refer to the Official Red Hat Linux Reference Guide.


    # 1.1 Installation-Related Enhancements


    Here is a list of the many changes which have been made in order to make the Red
    Hat installation process even easier:


    +   * GUI Installation Mode

    * Customizable Workstation-Class Instalations

    * More Flexible Workstation- and Server-Class Installations

    * New Scriptable Kickstart Mode

    * User Account Creation

    * Software RAID Support

    * Up Front Configuration


    Let''s take a look at each one in more detail.


    # 1.1.1 GUI Installation Mode


    The most notable change in Red Hat Linux 6.1 is the new GUI format of the installation.
    Not only will you have the convenience of using your mouse throughout the installation
    process, the screens themselves are more intuitive. Help screens have also been
    added to make the installation process go more smoothly.


    # 1.1.2 Customizable Workstation-Class Installations


    New to the installation is the ability to choose a more customized workstation-class
    intalation. You can choose from a standard X Window System and GNOME workstation-class
    installation or substitute KDE for GNOME. These new options help to guarantee
    all of the desired packages are installed and allow you the convenience of a simple
    installation.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 1.1.3 Flexible Workstation- and Server-Class Installations


    Both workstation- and server-class installations have been improved with the ability
    to manually partition your hard drives. Rather than have the installation''s preset
    partitions created, you can now set up your own desired partitions as you would
    do in a custom-class installation.


    # 1.1.4 New Scriptable Kickstart


    Kickstart has been rewritten to a new scriptable format. Now, you can pass kickstart
    a Python object and dynamically configure you kickstart installation. For those
    of familiar with kickstart, you are sure to be pleased with its new features and
    the way it has been been rewritten.


    # 1.1.5 User Account Creation


    During the new Red Hat Linux 6.1 installation, you are now able to set up user
    accounts. In the account creation portion of the installation, you can set your
    machine''s root password, and as well as create the various user accounts you
    may need.


    # 1.1.6 Software RAID Support


    New to Red Hat Linux is the ability to set up RAID devices (available only for
    multiple hard drives) when you set up your partitions during the installation.
    We only recommend this option if you have previous RAID experience. For more information
    about RAID, please refer to the Official Red Hat Linux Reference Guide.


    # 1.1.7 Up Front Configuration


    Up front configuration allows you to completely configure your Red Hat Linux system
    before making any actual changes (ex: partitioning or installing packages) to
    your hard drive(s). The new installation program writes all configuration files
    to your machine''s memory. Only after X configuration has been completed will
    changes be made to your system.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Section 2.1:Getting the Red Hat Linux Components


    11


    # 2 Before You Begin


    While installing Red Hat Linux is a straightforward process, taking some time
    prior to starting the installation can make things go much more smoothly. In this
    chapter, we''ll discuss the steps that should be performed before you start the
    installation.


    > Please Note

    If you are currently running version 2.0 (or greater) Red Hat Linux system, you
    can perform an upgrade. Skim this chapter to review the basic issues relating
    to installation, and read the following chapters in order, following the directions
    as you go. The upgrade procedure starts identically to the installation procedure;
    you will be directed to choose an installation or upgrade after booting the installation
    program and answering a few questions.


    There are five tasks you should perform prior to installing Red Hat Linux:


    +   1. Make sure you have sufficient documentation to effectively use your Red
    Hat Linux system after the installation (please refer to the Official Red Hat
    Linux Reference Guide for more information).

    2. Make sure you have access to the Red Hat Linux components required for installation.

    3. Make sure you know your computer''s hardware configuration and networking information
    (the Official Red Hat Linux Reference Guide for more help).

    4. Decide, based on the first two tasks, what method will you use to install Red
    Hat Linux.

    5. Determine where on your hard drive(s) Red Hat Linux will reside.


    Let''s start by making sure you have the correct components needed for your Red
    Hat Linux installation.


    # 2.1 Getting the Red Hat Linux Components


    If you''ve purchased the Red Hat Linux boxed set, you''re ready to go! However,
    mistakes occasionally happen, so now is a good time to double-check the contents
    of your boxed set. If you haven''t purchased a Red Hat Linux boxed set, skip to
    No Boxed Set No Problem! in Section 2.1.10.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 2.1.1 Contents of the Red Hat Linux Boxed Set


    The Red Hat Linux boxed set contains the following items:


    +   * The Official Red Hat Linux Installation Guide

    * The Official Red Hat Linux Getting Started Guide

    * The Official Red Hat Linux Reference Guide

    * The Official Red Hat Linux Alpha/SPARC Installation Addendum, only in Red Hat
    Linux/Alpha and Red Hat Linux/SPARC boxed sets.

    * Red Hat Linux CDs 1 and 2.

    * The Linux Applications Library, only in Red Hat Linux/Intel Deluxe and Professional
    boxed sets.

    * Boot diskette, only in Red Hat Linux/Intel boxed sets.

    * License and Registration information.


    Let''s take a quick look at each item:


    # 2.1.2 The Official Red Hat Linux Installation Guide


    The Official Red Hat Linux Installation Guide is what you''re currently reading.
    It contains the information necessary to install Red Hat Linux.


    # 2.1.3 The Official Red Hat Linux Getting Started Guide


    The Official Red Hat Linux Getting Started Guide contains information on what
    to do after the installation has taken place. We believe it is both well written
    and informative, and will guide you through the necessary steps of actually using
    your system once the installation is in place.


    The Official Red Hat Linux Getting Started Guide covers topics ranging from learning
    the basics of your system, navigating your system, to GNOME, to connecting to
    the Internet.


    # 2.1.4 The Official Red Hat Linux Reference Guide


    The Official Red Hat Linux Reference Guide contains information on configuring
    your system, package list information, text-mode installations, and more. Once
    you have installed your system and mastered the basics of navigation, you can
    use this guide to help configure and fine tune Red Hat Linux to your specific
    needs.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Section 2.1:Getting the Red Hat Linux Components


    # 2.1.5 The Official Red Hat Linux Alpha/SPARC Installation Addendum


    # Alpha, SPARC


    The Official Red Hat Linux Alpha/SPARC Installation Addendum contains information
    of interest to owners of Alpha- and SPARC-based computer systems that will make
    installation of Red Hat Linux more straightforward. (The Official Red Hat Alpha/SPARC
    Installation Addendum is only included in Red Hat Linux/Alpha and Red Hat Linux/SPARC
    boxed sets.)


    # 2.1.6 CDs 1 and 2


    These compact discs contain the entire Red Hat Linux distribution, including source
    code. CD 1 contains all the binary packages built for your type of computer (Intel,
    Alpha, or SPARC). CD 2 contains the source packages that were used to build the
    binary packages on CD 1.


    # 2.1.7 Linux Applications Library


    # Intel


    This compact disc library contains demonstration versions of a number of commercial
    Linux software products. If you purchased Red Hat Linux/Intel Deluxe, you will
    receive the workstation edition. If you purchased Red Hat Linux/Intel Professional,
    you will receive the workstation and server edition of the Linux Applications
    Library. For more information, please refer to the README file in this library.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 14 Chapter 2:Before You Begin


    # Please Note


    This CD-ROM library and its contents are completely unsupported by Red Hat, Inc..
    All questions and issues concerning any software in this pack should be directed
    to the responsible company, and not Red Hat, Inc.


    # 2.1.8 Boot Disks


    # Intel


    This diskette is used to start the installation process for Red Hat Linux/Intel.
    Depending on your computer''s configuration and the type of installation you select,
    you may or may not need this boot disk. Instead, you may require a PCMCIA or a
    Network boot disk, depending on your system''s hardware configuration, and the
    installation method you choose. When we discuss the different installation methods
    later in this chapter, we''ll explain which diskettes are needed for each type
    of installation, and give you instructions for producing any diskettes you require.


    # Alpha, SPARC


    SPARC and Alpha owners should refer to the Official Red Hat Linux Alpha/SPARC
    Installation Addendum for information on which diskettes are required.


    # 2.1.9 License and Registration Information


    As a Red Hat Linux 6.1 owner, you are entitled to the benefits of support once
    you have registered. Our new registration program offers you free priority FTP
    access and your own home base at www.redhat.com.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Section 2.1:Getting the Right Red Hat Linux Components


    Sign up by going to www.redhat.com/now and entering your personal product ID found
    in your Red Hat Linux boxed set. Once that has been done, you can go to www.redhat.com/support
    for further support-related information.


    # 2.1.10 Missing Something?


    If you''ve purchased the Official Red Hat Linux boxed set from Red Hat, Inc.,
    (or one of its distributors) and you''re missing one or more of the items listed
    above, please let us know!


    One thing to keep in mind is that Red Hat partners with companies (international
    and domestic) so that we can make Red Hat Linux available to you in the most convenient
    form. Because of this, you might find that your Red Hat Linux boxed set may not
    have been actually produced by Red Hat.


    Not how to identify our official boxed set? Here''s how: The bottom of our box
    has an ISBN number next to one of the bar codes. That ISBN number should be in
    this form:


    1-58569-xx-y


    (The xx and y will be unique numbers.) If your box has an ISBN number in this
    form, and you''re missing something, feel free to call us at 1-888-733-4281 (+1-919-547-0012
    outside the USA), or to send mail to presales@redhat.com.


    If your box has a different ISBN number (or none at all), you''ll need to contact
    the company that produced your boxed set. Normally, third-party producers will
    include their logo and/or contact information on the outside of the box; an official
    Red Hat Linux boxed set has only our name and contact info on the outside.


    If Red Hat Linux boxed set is complete, please skip ahead to Section 2.1.11, Checking
    for Updated Diskette Images.


    # No Boxed Set? No Problem!


    Of course, not everyone purchases a Red Hat Linux boxed set. It''s entirely possible
    to install Red Hat Linux using a CD created by another company, or even via FTP.
    In these cases, you may need to create one or more diskettes to get started.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Intel


    For people installing Red Hat Linux/Intel, you may need a boot disk, or if using
    a PCMCIA device during the installation (such as a laptop), a PCMCIA boot disk.
    It may also be possible to start the installation directly from the CD. We''ll
    discuss this in more detail when we outline the various installation methods.


    # Alpha, SPARC


    People with Alpha-based systems should refer to the Official Red Hat Linux Alpha/SPARC
    Installation Addendum for additional information on the diskettes they may need.


    # 2.1.11 Checking for Updated Diskette Images


    From time to time, we find that the installation may fail, and that a revised
    diskette image is required for the installation to work properly. In these cases,
    we make special images available via the Red Hat Linux Errata.


    Since this is a relatively rare occurrence, you will save time if you try to use
    the standard diskette images first, and then review the Errata only if you experience
    any problems completing the installation.


    There are two ways to review the Errata:


    +   1. World Wide Web -- By pointing your Web browser at http://www.redhat.com/errata,
    you can read the Errata on-line, and download diskette images easily.


    +   2. Electronic Mail -- By sending an empty mail message to errata@redhat.com,
    you will receive a mail message containing a text listing of the complete Errata.
    Also included are URLs to each updated package and diskette image in the Errata.
    By using these URLs, you can then download any necessary diskette images. Remember
    to use binary mode when transferring a diskette image!


    For now, concentrate only on the Errata entries that include new diskette images
    (the filenames always end in .img). If you find an entry that seems to apply to
    your problem, get a'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Section 2.4:Installation Classes


    copy of the diskette images, and create them using the instructions in Appendix
    B, Making Installation Diskettes.


    # 2.2 Need a Network Boot Disk?


    If you are performing an installation via FTP, HTTP, or NFS you will need to create
    your own network boot disk. The network boot disk image file is bootnet.img, and
    is located in the images directory on your Red Hat Linux/Intel CD. Please turn
    to Appendix B, Making Installation Diskettes and follow the instructions there.
    Then, return here, and read on.


    # 2.3 Need a PCMCIA Boot Disk?


    This section is specific to Intel-based computers only. If you are using an Alpha
    or SPARC computer, please skip ahead to Section 2.5, Disk Partitions.


    Here''s a checklist that you can use to see if you''ll need to create a PCMCIA
    boot disk:


    +   - Installing from a PCMCIA-Connected CD-ROM -- If you''ll be installing Red
    Linux from a CD-ROM, and your CD-ROM drive is attached to your computer through
    a PCM-CIA card, you''ll need a PCMCIA boot disk.


    +   - Installing using a PCMCIA Network Card -- If you will be using a PCMCIA
    network adapter during the installation, you may need a PCMCIA boot disk.


    If you need a PCMCIA boot disk, you will need to make one. The PCMCIA boot disk
    image file is pcmcia.img, and is located in the images directory on your Red Hat
    Linux/Intel CD. Please turn to Appendix B, Making Installation Diskettes and follow
    the instructions there. Then, return here, and read on.


    # 2.4 Installation Classes


    Red Hat Linux includes three classes, or types of installations. They are:


    +   - Workstation


    +   - Server


    +   - Custom'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Chapter 2:Before You Begin


    These classes give you the option of simplifying the installation process (with
    some potential for loss of configuration flexibility), or retaining complete flexibility
    with a slightly more complex installation process. Let''s take look at each class
    in more detail, so you can see which one is right for you.


    Only the custom-class install allows you complete flexibility. The workstation-
    and server-class installations go through the installation process for you and
    omit certain steps. However, you can now choose to partition your drives manually
    in a workstation- or server-class installation.


    # 2.4.1 The Workstation-Class Installation


    A workstation-class installation is most appropriate for you if you''re new to
    the world of Linux, and would like to give it a try. By answering very few installation
    questions, you can be up and running Red Hat Linux in no time!


    # What Does It Do?


    If you choose not to partition manually, a workstation-class installation removes
    any Linux-related partitions on all installed hard drives (and uses all free unpartitioned
    disk space) to create the following partitions:


    +   A 64MB swap partition.


    A variable-sized (the exact size is dependent on available disk space) root partition
    (mounted as /) in which all other files are stored.


    | Intel |

    | A 16MB partition (mounted as /boot) in which the Linux kernel and related files
    reside. |

    || Alpha |

    | A 2MB partition (mounted as /dos) in which the MILO boot loader is located.
    |


    This approach to disk partitioning results in the simplest filesystem configuration
    possible.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Section 2.4:Installation Classes


    Please Note

    You will need approximately 600MB of free disk space in order to perform a workstation-class
    installation.


    If your system already runs Windows (Windows 3.1/95/98), a workstation-class installation
    will automatically configure your system to dual-boot using LILO.


    > CAUTION

    A workstation-class installation will remove all existing Linux partitions on
    all hard drives in your system. It will also attempt to set up a dual boot environment
    automatically on your system, if another OS is present.


    # 2.4.2 The Server-Class Installation


    A server-class installation is most appropriate for you if you''d like your system
    to function as a Linux-based server, and you don''t want to heavily customize
    your system configuration.


    # What Does It Do?


    If you choose not to partition manually, a server-class installation removes ALL
    existing partitions on ALL installed hard drives, so choose this installation
    class only if you''re sure you have nothing you want saved! When the installation
    is complete, you''ll find the following partitions:


    +   - A 64MB swap partition.

    - A 256MB partition (mounted as /).

    - A partition of at least 512MB (mounted as /usr).

    - A partition of at least 512MB (mounted as /home).

    - A 256MB partition (mounted as /var).'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Chapter 2:Before You Begin


    # Intel


    A 16MB partition (mounted as /boot) in which the Linux kernel and related files
    are kept.


    # Alpha


    A 2MB partition (mounted as /dos) in which the MILO boot loader is kept.


    This approach to disk partitioning results in a reasonably flexible filesystem
    configuration for most server-class tasks.


    # Please Note


    You will need approximately 1.6GB of free disk space in order to perform a server-class
    installation.


    > CAUTION

    A server-class installation will remove ALL existing partitions of ANY type on
    ALL existing hard drives of your system. All drives will be erased of all information
    and existing operating systems, regardless of if they are Linux partitions or
    not!


    # 2.4.3 The Custom-Class Installation


    As you might guess from the name, a custom-class installation puts the emphasis
    on flexibility. During a custom-class installation, you choose how disk space
    should be partitioned. You have complete control over which packages will be installed
    on your system. You also determine whether you''ll use LILO to boot your system.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 2.4.4 Behind the Scenes of a Custom-Class Installation


    This section covers the installation steps that are not seen by performing a workstation-server-class
    installation.


    This may help those of you who are trying to decide which installation class will
    better suit your needs. If you think you''ll have trouble performing any of the
    tasks on this list, you should not perform a custom-class installation without
    reading through this manual and clarifying any questions you may have.


    +   - Creating Partitions -- In the custom-class installation it is necessary
    for you to specify where want Red Hat Linux to be installed. This is no longer
    specific to custom-class installations as you now have the option to manually
    partition your hard drives in the workstation- and server-class installations.

    - Formatting Partitions -- All newly created partitions must be formatted. Any
    partitions that contain old data (data you no longer need or want) should be formatted.
    If you choose to manually partition your workstation- or server-class installation,
    you will need to choose which partitions to format.

    - Selecting and Installing Packages -- This is performed after your partitions
    have been configured and selected for formatting. Here you may select groups of
    packages, individual packages, a combination of the two, or choose "everything"
    install.

    - LILO Configuration -- In a custom-class installation, you are able to choose
    where you would like LILO to be installed (either on the master boot record (MBR)
    or on the first sector of your root partition), or you may choose not install
    LILO at all.


    # 2.5 Disk Partitions


    Nearly every modern-day operating system uses disk partitions, and Red Hat Linux
    is no exception. When installing Red Hat Linux, it will be necessary to work with
    disk partitions. If you have not worked with disk partitions before (or would
    like a quick review of the basic concepts) please read the An Introduction to
    Disk Partitions appendix in the Official Red Linux Reference Guide before proceeding.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Please Note


    If you intend to perform a workstation- or server-class installation, and you
    already have sufficient unpartitioned disk space, you do not need to read this
    section, and may turn to Section 2.6, A Note About Kernel Drivers. Otherwise,
    please read this section in order to determine the best approach to freeing disk
    space for your Red Hat installation.


    In order to install Red Hat Linux, you must make disk space available for it.
    This disk space needs to be separate from the disk space used by other operating
    systems you may have installed on your computer, such as Windows, OS/2, or even
    a different version of Linux. This is done by dedicating one or more partitions
    to Red Hat Linux.


    Before you start the installation process, one of the following conditions must
    be met:


    +   - Your computer must have enough unpartitioned disk space available to install
    Red Hat Linux.


    +   - Your computer must have one or more partitions that may be deleted, thereby
    freeing up disk space to install Red Hat Linux.


    If you are not sure that you meet these conditions or want to know how to free
    up more space for your Red Hat Linux installation, please refer to the Official
    Red Hat Linux Reference Guide.


    # 2.6 A Note About Kernel Drivers


    During installation of Red Hat Linux, there are some limits placed on the filesystems
    and other drivers supported by the kernel. However, after installation there is
    support for all filesystems available under Linux. At installation time the modularized
    kernel has support for (E)IDE devices, (including ATAPI CD-ROM drives), SCSI adapters,
    and network cards. Additionally, all mice, SLIP, CSLIP, PPP, PLIP, FPU emulation,
    console selection, ELF, SysV IPC, IP forwarding, firewalling and accounting, reverse
    ARP, QIC tape and parallel printers, are supported.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Section 2.9:System Requirements Table


    > Please Note

    Because Red Hat supports installation on many different types of hardware, many
    drivers (including those for SCSI adapters, network cards, and many CD-ROMs) are
    not built into the Linux kernel used during installation; rather, they are available
    as modules and loaded as you need them during the installation process. If necessary,
    you will have the chance to specify options for these modules at the time they
    are loaded, and in fact these drivers will ignore any options you specify for
    them at the boot:

    prompt.


    After the installation is complete you may want to rebuild a kernel that includes
    support for your specific hardware configuration. See the Official Red Hat Linux
    Reference Guide for building a customized kernel. Note that, in most cases, a
    custom-built kernel is not necessary.


    # 2.7 If You Have Problems...


    If you have questiions or problems before, during, or after the installation,
    check the list of Red Hat Frequently Asked Questions. You can find the FAQ at:

    http://www.redhat.com/knowledgebase/index.html


    In many cases, a quick check of the FAQ can quickly get you back in action.


    # 2.8 One Last Note


    Please read all of the installation instructions before starting; this will prepare
    you for any decisions you need to make and should eliminate potential surprises.


    # 2.9 System Requirements Table


    Please use the space provided to fill in your system settings and requirements.
    This will help you keep a record of your current system, as well as make the installation
    process easier. (Refer to http://www.redhat.com/corp/support/hardware/index.html
    for the most current list of Red Hat Linux compatible hardware or the Official
    Red Hat Linux Reference Guide for more hardware information.)'
  merge: -1
  img_proc: true
