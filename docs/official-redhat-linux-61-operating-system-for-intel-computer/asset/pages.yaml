- pgno: 53
  md: '# Chapter 4:Graphical User Interface Installation


    # Please Note


    The contents of the "Boot label" column will be what you will need to enter at
    LILO''s boot: prompt in order to boot the desired operating system. However, if
    you forget the boot labels defined on your system, you can always press [Tab]
    at LILO''s boot: prompt to display a list of defined boot labels.


    #  4.10.1 Configuring LILO


    +   - Create boot disk The option is checked by default. If you do not want to
    create a boot disk, you should deselect this option. However, we strongly urge
    you to create a boot disk. A boot disk can be handy for a number of reasons:


    +   - Use It Instead of LILO -- You can use a boot disk instead of LILO. This
    is handy if you''re trying Red Hat Linux for the first time, and you''ll feel
    more comfortable with the boot process for your other operating system is left
    unchanged. With a boot disk, going back to your other operating system is as easy
    as removing the boot disk and rebooting.


    +   - Use It In Emergencies -- The boot disk can be used in conjunction with the
    rescue mode, which will give you the tools necessary to get your system back on
    its feet 1

    - Use If Another Operating System Overwrites LILO -- Other operating systems may
    not be as flexible as Red Hat Linux when it comes to boot methods. Often, installing
    or updating another operating system can cause the boot record (originally containing
    LILO) to be overwritten, making it impossible to boot your Red Hat Linux installation.
    The boot disk can then be used to boot Red Hat Linux so you can reinstall LILO.


    1 To do this, you have several options:


    +   ⇒ Using the CD-ROM to boot, type `linux rescue` at the boot:` prompt.


    +   ⇒ Using the network boot disk, type `linux rescue` at the boot:` prompt. You
    will then be prompted to pull the rescue image from the network.


    +   ⇒ Using the boot disk included with the Red Hat Linux set, type `linux rescue`
    at the boot:` prompt. You can then load the rescue images from the CD-ROM or hard
    drive.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Section 4.10:Installing LILO


    +   * Do not install LILO -- if you have Windows NT installed on your system,
    you may not want to install LILO. If you choose not to install LILO for this reason,
    make sure that you have chosen to create a boot disk; otherwise you will not be
    able to boot Linux. You can also choose to skip LILO if you do not want to write
    LILO to your hard drive.


    #  4.10.2 Alternatives to LILO


    If you do not wish to use LILO to boot your Red Hat Linux system, there are several
    alternatives:


    # Boot Disk


    As previously stated, you can use the boot disk created by the installation program
    (if you elected to create one).


    # LOADLIN


    You can load Linux from MS-DOS. Unfortunately, it requires a copy of the Linux
    kernel (and an initial RAM disk, if you have a SCSI adapter) to be available on
    an MS-DOS partition. The only way to accomplish this is to boot your Red Hat Linux
    system using some other method (e.g., LILO on a diskette) and then copy the kernel
    to the MS-DOS partition. LOADLIN is available from ftp://metalab.unc.edu/pub/Linux/systemboot/dualboot/
    and associated mirror sites.


    # SYSLINUX


    An MS-DOS program very similar to LOADLIN. It is also available from ftp://metab-lab.unc.edu/pub/Linux/system/boot/loaders/
    and associated mirror sites.


    # Some commercial bootloaders


    For example, System Commander and Partition Magic, which are able to boot Linux
    (but still require LILO to be installed in your root partition).


    # 4.10.3 SMP Motherboards and LILO


    This section is specific to SMP motherboards only. If the installer detects an
    SMP motherboard on your system, it will automatically create two lilo.conf entries
    as opposed to the usual entry.


    One entry will be called linux and the other will be called linux-up. The linux
    will boot by default. However, if you have trouble with the SMP kernel, you can
    elect to boot the linux-up entry instead. You will retain all the functionality
    as before, but you will only be operating with a single processor.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 4.11 Network Configuration


