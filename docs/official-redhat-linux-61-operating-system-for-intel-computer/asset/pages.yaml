    # 4.10 Installing LILO


    In performing a workstation- or server-class installation, please skip ahead to
    Section 4.12, Time Zone Configuration.


    In order to be able to boot your Red Hat Linux system, you usually need to install
    LILO (the LInux LOader). You may install LILO in one of two places:


    The master boot record (MBR)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Chapter 4:Graphical User Interface Installation


    The recommended place to install LILO, unless the MBR already starts another operating
    system loader, such System Commander or OS/2''s Boot Manager. The master boot
    record is a special area on your hard drive that is automatically loaded by your
    computer''s BIOS, and is the earliest point at which LILO can take control of
    the boot process. If you install LILO in the MBR, when your machine boots, LILO
    will present a boot: prompt. You can then boot Red Hat Linux or any other operating
    system you configure LILO to boot (see below).


    # The first sector of your root partition


    Recommended if you are already using another boot loader on your system (such
    as OS/2''s Boot Manager). In this case, your other boot loader will take control
    first. You can then configure that boot loader to start LILO (which will then
    boot Red Hat Linux).


    If you choose to install LILO, please select where you would like LILO to be installed
    on your system (see Figure 4-10, LILO Configuration Screen). If you use only one
    Red Hat Linux you should choose the master boot record (MBR). For systems with
    Win95/98, you should also install LILO to the MBR so that LILO can boot both operating
    systems.


    If you have Windows NT (and you want to install LILO) you should choose to install
    LILO on the first sector of the root partition, not the MBR. Please be sure to
    create a boot disk. In a case as this, Windows NT''s operating system loader will
    be on the MBR and the only way you can choose LILO (on the first sector of your
    root partition) is by using the boot disk. Be sure to check out http://www.linuxdoc.org/HOWTO/mini/Linux+NT-Loader.html
    for more information on setting up LILO and NT.


    # WARNING


    > If you choose not to install LILO for any reason, you will not be able to boot
    your Red Hat Linux directly, and will need to use another boot method (such as
    a boot diskette). Use this option only if you are sure you have another way of
    booting your Red Hat Linux system!


    If your computer accesses a hard drive in LBA mode, check Use linear mode. This
    is most used in situations where the drive is a SCSI and you are getting errors
    accessing the drive.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Section 4.10:Installing LILO


    # Figure 4–10 LILO Configuration Screen


    Online Help


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_52_0.png)


    LILO, the Linux Loader, is the software that can be used to start Red Hat Linux
    computer. It can also start other operating systems, such as Windows 98. Here,
    you''ll be asked how (or where) to configure LILO.


    Create boot disk: You should create a boot disk if you are not installing LILO
    on the MBR or if


    If you wish to add default options to the LILO boot command, enter them into the
    kernel parameters field. Any options you enter will be passed to the Linux kernel
    every time it boots.


    Bootable Partition -- Every bootable partition is listed, including partitions
    used by other operating systems. The "Boot label" column will be filled with the
    word linux on the partition holding your Red Hat Linux system''s root filesystem.
    Other partitions may also have boot labels. If you would like to add boot labels
