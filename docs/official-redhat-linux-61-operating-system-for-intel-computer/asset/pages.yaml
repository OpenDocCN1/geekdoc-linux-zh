  md: '# Section 4.6:Install Path


    # Figure 4–5 Choosing Install or Upgrade


    ![](img/9e196f4266ccc50fcca5eceaa09f8a5b_40_0.png)


    # 4.6.1 Installing


    You install Red Hat Linux on a clean disk partition or set of partitions, or over
    another installation of Linux.


    > WARNING

    Installing Red Hat Linux over another installation of Linux (including Red Hat
    Linux) does not preserve any information (files or data) from a prior installation.
    Make sure you save any important files! If you are worried about saving the current
    data on your existing system (without making a backup of your own), you should
    consider performing an upgrade instead (see iSection 4.6.2, Upgrading).'
