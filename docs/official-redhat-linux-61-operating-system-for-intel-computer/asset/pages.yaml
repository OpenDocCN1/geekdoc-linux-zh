- pgno: 50
  md: '# Section 4.10:Installing LILO


    be formatted. However, partitions such as /home or /usr/local must not be formatted
    if they contain data you wish to keep (see Figure 4–9, Choosing Partitions to
    Format).


    # Figure 4–9 Choosing Partitions to Format


