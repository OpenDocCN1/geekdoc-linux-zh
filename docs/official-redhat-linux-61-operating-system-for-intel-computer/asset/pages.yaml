    # 3.2 Starting the Installation Program


    Now it''s time to start installing Red Hat Linux. To start the installation, it
    is first necessary to boot the installation program. Before we start, please make
    sure you have all the resources you''ll need for the installation. If you''ve
    already read through Chapter 2, *Before You Begin*, and followed the instructions,
    you should be ready.


    # Alpha


    > If you haven''t created your diskettes yet, please refer to the first chapter
    of the *Official Red Hat Linux Alpha/SPARC Installation Addendum*, and create
    them now. After you''ve created the necessary diskettes, please finish reading
    the first chapter for information on starting the installation.


    # SPARC


    > If you haven''t prepared for the installation yet, please read the *Official
    Red Hat Linux Alpha/SPARC Installation Addendum* to determine how you will boot
    the installation program, and issue the boot command that will start the installation.'
  merge: -1
