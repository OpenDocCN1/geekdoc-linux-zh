    # 4.19 Installation Complete


    Congratulations! Your Red Hat Linux 6.1 installation is now complete!


    The installation program will prompt you to prepare your system for reboot. Don''t
    forget to remove any device in the floppy drive or CD in the CD-ROM drive. If
    you decided to skip installing LILO, you''ll need to use your boot disk now.


    After your computer''s normal power-up sequence has completed, you should see
    LILO''s standard prompt, which is boot: prompt, you can do any of the following
    things:


    +   - Press [Enter] -- Causes LILO''s default boot entry to be booted.


    +   - Enter a Boot Label, followed by [Enter] -- Causes LILO to boot the operating
    system corresponding to the entered boot label.


    +   - Do Nothing -- After LILO''s timeout period. (which, by default, is five
    seconds) LILO will automatically boot the default boot entry.'
