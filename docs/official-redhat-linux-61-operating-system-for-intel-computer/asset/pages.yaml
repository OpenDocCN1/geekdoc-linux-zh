- pgno: 41
  md: '# Chapter 4:Graphical User Interface Installation


    If you choose to perform a full installation, you must also choose the class of
    the installation.

    Your options include: **Custom, GNOME Workstation, KDE Workstation**, or **Server**.


    Only the custom-class installation allows you complete flexibility. The workstation-class
    and server-class installations automatically go through the installation process
    for you and omit certain steps. During a custom-class installation, it is up to
    **you** how disk space should be partitioned. You have complete control over the
    packages that will be installed on your system. You can determine whether you''ll
    use LILO to boot your system.


    If you would like to know what steps are missed by not performing a custom-class
    installation please refer to Section 2.4.4, *Behind the Scenes of a Custom-Class
    Installation*.


    Workstation-class installations will install the X Window System and the desktop
    of your choice.


    > CAUTION


    A workstation-class installation will **erase all information in all Linux-related
    partitions from every one** of your computer''s hard drive(s).


    A server-class installation is most appropriate for if you''d like your system
    to function as a Linux-based server, and you don''t want to heavily customize
    your system configuration.


    > CAUTION


    A server-class installation will **erase all partitions** (both Linux and non-Linux)
    **from every one of your computer''s** hard drive(s).


    # 4.6.2 Upgrading


    The installation process for Red Hat Linux 6.1 includes the ability to upgrade
    from prior versions of Red Hat Linux (version 2.0 and later) which are based on
    RPM technology.


    Upgrading your system installs the modular 2.2.x kernel as well as updated versions
    of the packages which are currently installed on your machine. The upgrade process
    preserves'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Section 4.7:Automatic Partitioning


    existing configuration files by renaming them using an .rpmsave extension (e.g.,
    mail.cf.rpmsave) and leaves a log of the actions it took in /tmp/upgrade.log.
    As software evolves, configuration file formats can change, so you should carefully
    compare your original configuration files to the new files before integrating
    your changes.


    # Please Note


    Some upgraded packages may require that other packages are also installed for
    proper operation. The upgrade procedure takes care of these dependencies, but
    it may need to install additional packages which are not on your existing system.


    # 4.7 Automatic Partitioning


    The Automatic Partitioning screens will only be seen if you are performing a workstation-
    or server-class installation.


    Here you can choose to continue with this installation, to partition manually,
    or to use the Back button to go back and choose a different installation method
    (see Figure 4–6, Automatic Partitioning).


    If you do not want to lose some or all of your data, you should either choose
    to partition manually or choose a different installation class.


    A workstation-class installation will remove data on all currently existing Linux
    partitions. If you do not want Red Hat Linux to be installed on your master boot
    record (MBR) or if you want to use a boot manager other than LILO, do not choose
    this installation method.


    A server-class installation will remove data on all partitions of all hard drives.
    If you have another OS on your system that you wish to keep installed, if you
    do not want Red Hat Linux to be installed on your master boot record (MBR), or
    if you want to use a boot manager other than LILO, do not choose this installation
    method.'
  merge: -1
  img_proc: true
