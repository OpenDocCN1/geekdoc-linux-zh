  md: '# CHAPTER 8: Browsing the World Wide Web with Mozilla Firefox


    +   - Block Popup Windows—You can enable (the default) or disable this option.
    You can also build a list of sites where pop-ups are allowed.

    - Allow Web Sites to Install Software—By default, no sites are allowed to install
    software. You can build a list of trusted sites that can download software to
    your system.

    - Load Images—By default, images on sites are loaded. You can disable this option
    if you want. You can also create a list of exceptions that specifies sites where
    image loading is either allowed or not allowed.

    - Enable Java—By default, Java web-based applets are allowed to run. You can disable
    this option by clearing the box.

    - Enable JavaScript—By default, JavaScript is enabled, allowing JavaScript active
    content to play on all sites. You can disable this option by clearing the box.


    NOTE


    You can select options for JavaScript related to what you allow the script to
    do to your browser. Options include hide the status bar, raise or lower windows,
    and change images. If you have JavaScript enabled, you may want to go with the
    default options set for JavaScript. As you use Firefox over time, you can fine-tune
    these options to meet your needs.


    Clear any of the option check boxes related to pop-ups, downloads, and scripting
    as needed. In most cases, you will want to keep these options enabled.


    # 5 Allowed Sites Dialog


    You can build an allowed sites list for the pop-up and install software options.
