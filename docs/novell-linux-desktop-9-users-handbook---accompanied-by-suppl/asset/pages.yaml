    # 5 Insert Page Number and Other Fields


    ![](img/6e85ebc4ce06a64c82109523b60183ba_268_2.png)


    # 104 Insert Headers, Footers, and Page Numbers


    TIP


    Obviously, you can have both headers and footers on your document''s pages.

    Enable both headers and footers in the Page Style dialog, if you want to use both
    in your document.


    253'
  merge: -1
