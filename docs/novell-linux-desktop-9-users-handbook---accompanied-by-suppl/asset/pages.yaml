- pgno: 149
  md: '# CHAPTER 6: Managing Files


    # WEB RESOURCE


    http://www.regular-expressions.info


    If you are just dying to learn more about regular expressions and how to create
    them for searches, check out this website. It provides tutorials and advice related
    to creating regular expressions for searches.


    After selecting an option, click **Add**. A new box opens for the option that
    you selected, and you can enter the search criteria in the box. For example, if
    you selected Contains the Text, enter the text that you want to search in the
    box.


    # Run Search


    After you have entered all your search parameters, click the **Find** button.
    The results of your search appear in the Search for Files window.


    # TIP


    When you run the search, watch the Search Results list. When you see the file
    appear in the list (the one you are looking for), you can click **Stop** to end
    the search.


    # Open File in Search Results List


    To open a file in the search results, double-click on the file. The file opens
    in the appropriate application. At this point, you can close the Search for Files
    window or run another search.


    # Delete Files


    You can delete files from the Nautilus window by opening the appropriate location.
