    Sort Items on the Bookmarks Menu

    When you are working in the Firefox window, select the Bookmarks menu; then point
    to a folder to open the list of bookmarks it contains. To sort the bookmarks alphabetically,
    right-click and select Sort Name. The bookmarks are sorted by name.


    About Cookies and Firefox

    A cookie is an information file stored on your computer as a text file. Cookies
    can hold personal preference for how you view and interact with a particular website.
    Cookies can also hold passwords and other personal information related to a particular
    website that you use.'
