- pgno: 235
  md: '+   - Writer—A powerful document processor that allows you to create every
    possible type of document from simple letters to brochures to complex reports
    that contain data from the other OpenOffice.org applications. Writer also makes
    it easy to create tables of contents and indexes and provides autocomplete and
    autformat options that make it easy to create any document quickly.


    +   - Calc—A spreadsheet application that provides all the tools that you need
    to create invoices, balance sheets, and budgets and chart the data in a variety
    of chart formats. Calc also provides advanced tools for "What If" analysis of
    data and provides a number of wizards to help you work with more advanced analysis
    features.


    +   - Impress—An—An application that allows you to create simple slideshows and
    advanced multimedia presentations that include pictures, sound, and other multimedia
    content such as video. Impress also provides drawing and diagramming tools that
    allow you to create an impressive array of highly informative slides for your
    presentations.


    +   - Draw—A drawing tool that allows you to create simple and complex drawings
    to include in your OpenOffice.org documents, spreadsheets, and presentations.
    Draw is particularly useful for creating flowcharts and other complex diagrams.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# NOTE


    At the time of the writing of this book, OpenOffice.org version 1.1.4 was the
    most recent "stable version" of this application suite. A version 2 is in the
    works and will include a database application. Because Novell has "fine-tuned"
    the version of OpenOffice.org that accompanies NLD, it is unclear when version
    2 will avail-able for NLD and which applications will be included in newer versions
    of the suite.


    The OpenOffice.org applications use an XML (extensible Markup Language) file format
    as the default format when you save a document or other file in one of the OpenOffice.org
    applications. OpenOffice.org embraces XML as the default file format because XML
    files can readily be opened by a variety of applications. Because OpenOffice.org
    is open source, the developers of the application suite chose a default file format
    that is also open and nonproprietary.


    # KEY TERM


    XML—XML or eXtensible Markup Language was developed by the World Wide Web Consortium
    and is a markup language that allows for the creation of tags (a tag language
    like HTML).It provides a universal file format that can be embraced by many different
    types of applications.


    Because the OpenOffice.org applications share a number of tools and a common interface,
    you will find that the learning curve for taking advantage of more advanced features
    in the applications is fairly flat; meaning that you will be up and running in
    all the applications in no time. Let''s take a look at how you start the various
    applications and then we can look at configuring OpenOffice.org applications.


    # 90 Start OpenOffice.org Applications


    The OpenOffice.org applications (Write, Calc, Impress, and Draw) can be opened
    from the Programs menu. You can also launch one of the applications from the window
    of any of the other applications by selecting a new file that requires that application.
    For example, if you are in Write, you can select File, New from the menu and start
    a new spreadsheet, which opens Calc.


    +   - BEFORE YOU BEGIN


    89 About OpenOffice.org'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# CHAPTER 10: Working with OpenOffice.org Applications


    ![](img/6e85ebc4ce06a64c82109523b60183ba_237_0.png)


    # 1 Open Application


    From the NLD desktop, select Programs, Office from the menu. Select one of the
    application icons to start the appropriate application: Drawing, Presentation,
    Spreadsheet, or Word Processor. A new application window opens.


    TIP


    You can quickly start Writer using the Word Processor icon provided in the top
    panel of the NLD desktop.'
  merge: -1
