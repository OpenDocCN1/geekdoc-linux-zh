- pgno: 143
  md: '# Delete a Folder


    To delete a folder, right-click on the folder and select Move to Trash. This places
    the folder in the Trash.


    TIP

    to empty the trash, right-click on the desktop Icon and select Empty Trash. You
    are asked whether you are sure you want to empty the trash; click the Empty button
    to proceed.


    # Add Emblems to a Folder


    Right-click on a folder and select Properties to open the Properties dialog box
    for that folder. Then select the Emblems tab. To add visual cues to a folder that
    help you keep track of how important a folder is or what you plan to do with a
    particular folder, you can use emblems. Select an emblem or emblems by clicking
    on the appropriate check box.


    # Add Notes to a Folder


    Select the Notes tab. You can enter descriptive or other text on the folder''s
    Notes tab. This helps you keep track of the contents of the folder.

    After you have finished working in the folder''s Properties dialog box, click
    Close. This returns you to the Nautilus File Manager window.


    NOTE

    Every folder and file that you create (all the folders and files that are part
    of the NLD installation) is assigned permissions. These permissions grant rights
    to a file or folder, and these rights provide different levels of access; the
    permission levels are read, write, and execute. Certain rights (read, write, and
    execute) are assigned to you as the owner of a file or folder. Other rights (read
    and execute) are assigned to the user group that you belong to. You can change
    the permissions for any file or folder that you create on the Permissions tab
    of that item''s Properties dialog box. Permissions become important when you work
    in a networked environment or share your computer with multiple users.'
  merge: -1
  img_proc: true
