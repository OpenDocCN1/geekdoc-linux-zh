- pgno: 206
  md: '# TIP


    If you don''t like dragging the bookmarks around in the Bookmarks Manager window
    to move them, select a bookmark that you want to move and then click the Move
    button on the toolbar.The Choose Folder dialog box opens. Choose the folder that
    is the destination for the bookmark and then click OK.


    # Open Bookmark Properties


    If you want to change the properties for a bookmark such as the bookmark text
    or the URL for the bookmark, select a bookmark and then select Properties. The
    Properties dialog box opens for that bookmark.


    # Change Bookmark Properties


    Change the Name and Location information as needed. You can also enter keywords
    for the site and a description. After you have finished working with the bookmark''s
    properties, click OK.


    # Delete Bookmark


    To delete a bookmark, select the bookmark and then select the Delete button on
    the toolbar. The bookmark is removed from the list.


    # TIP


    The Bookmarks Manager also makes it easy for you to add new separator lines between
    the folders and bookmarks in the Bookmarks list. Select a folder (position) in
    the list and then select the New Separator button on the toolbar.


    # TIP


    You can add new divider lines and folders directly to the Bookmarks list. Right-click
    on a bookmark and select the appropriate choice from the shortcut menu.


    # Sort Bookmarks


    Depending on the number of bookmarks that you have, you might find it advantageous
    when you are working in the Bookmarks Manager to be able to sort the folders and
    bookmarks. You can sort these items alphabetically, by keyword, by description,
    and even by last visited. This ability to sort it makes casi er to manage the
    bookmarks.'
