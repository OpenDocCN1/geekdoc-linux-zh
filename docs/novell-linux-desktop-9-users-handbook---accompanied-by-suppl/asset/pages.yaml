- pgno: 64
  md: '# 1 Open the GNOME Terminal


    Select the Programs menu on the top panel, select the System Tools submenu, and
    then select Terminal. The GNOME Terminal opens on the desktop. The command line
    in the terminal consists of your username@linux. You enter commands at the command
    line.


    # 2 Maximize the Terminal


    It is easier to view the results of shell commands if you maximize the terminal
    window. Click the Maximize button on the window. Now you are ready to enter shell
    commands.


    # 3 Execute the Command


    A good command utility to try out is passwd command, which allows you to change
    your password. Click the command line type passwd and then press Enter. Type your
    current password and then press Enter. Type your new password and then press Enter.
    Reenter the new password and press Enter. The password has been changed.


    > TIP


    To clear the entries currently on the terminal screen, type clear and then press
    Enter.


    > TIP


    You can get help on a command by typing the command followed by --help (such as
    ls --help). To view the manual information for a particular command, type the
    command and then type man and press Enter. This opens the manual for the command.
    You can use the up and down arrow keys to move through the manual (the spacebar
    moves you one screen at a time). To exit the manual (or any manual pages that
    you access at the command line) press the q key on the keyboard.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# About File Commands


    +   SEE ALSO


    +   BEFORE YOU BEGIN


    | | Description |

    |--- |--- |

    | 46 | Use Nautilus to Manage Folders |

    | 47 | Browse and Open Files |

    | 48 | Find Files |


    +   13 Access the Command Line


    You can list and manipulate the files in your folders from the command line. NLD
    provides the Nautilus File Manager, which allows you to manage your files using
    a GUI utility. You will probably want to use Nautilus for most of your file work.
    However, it is not a bad idea to know and understand a few file management shell
    commands—at least of the basic file commands. Table 3.1 lists a few file management
    commands that you can use in the GNOME Terminal.


    | TABLE 3.1 FILE MANAGEMENT COMMANDS |

    | COMMAND | PURPOSE |

    |--- |--- |

    | ls | Lists the files in the current directory. |

    | cd | Used to change to a particular directory folder; for example, cd Documents
    would move you from the current parent folder to a subfolder named Documents.
    The cd command would return you to the parent folder. |

    | mkdir | Used to create a new directory (subfolder). For example, mkdir would
    place a new directory (subfolder) in the current folder. |

    | rdir | Used to remove a directory.From the folder''s parent directory, type
    rdir followed by the folder name. For example, rdir joe would remove the joe folder
    (the folder must be empty to be removed). |

    | copy | Used to copy a file from one folder to another. example, to copy a file
    from the current folder to another the syntax would be copy filename. |

    | rm | Used to delete a file.The syntax is rm filename. Be careful with this command;
    it does not provide you with a second chance in terms of deleting a file.|'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# WEB RESOURCE


    http://www.linuxforum.com/shell.php


    For a complete listing of Linux commands by category check out this website.


    Remember that Linux commands and references are case-sensitive. So if a folder-
    begins with a capital letter, you must type the name exactly to manipulate that
    folder. In terms of experimenting with folders and files at the command line,
    you can create new folders within your Home folder and keep documents and other
    files that you use in the Documents subfolder.


    # 15 Use File Commands


    +   - BEFORE YOU BEGIN

    - 13 Access the Command Line

    - 14 About File Commands


    When you open the terminal window, you are in your Home directory. Within the
    home directory are the subfolders: bin, Desktop, Documents, and public-HTML. You
    can use commands such as ls, cd, and mkdir to view the contents of these folders
    and to make new subfolders.


    +   1 Use the ls Command

    In the GNOME Terminal window, type ls at the command line and press Enter. The
    contents of your Home folder are listed.


    +   2 Use the cd Command

    Type cd Documents at the command line and press Enter. This changes the location
    to the Documents subfolder. To view any files are in this subfolder use the ls
    command. To return to the main Home folder, type cd and press Enter.


    TIP

    To recycle through your recently used commands, press the up arrow key on the
    keyboard.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# CHAPTER 3: Working on the NLD Desktop


    ![](img/6e85ebc4ce06a64c82109523b60183ba_67_0.png)


    # ## Use the mkdir Command


    You can create a new subfolder within your Home folder. Type `mkdir special` (where
    the new subfolder will be special) and then press `Enter`. To view the new subfolder
    run the `ls` command.


    # ## Use the rmdir Command


    To remove a directory from the current parent folder, such as the special subfolder
    created in step 3, use the `rmdir` command. Type `rmdir special` and then press
    `Enter`. When you run the `ls` command you will see that the folder has been deleted.


    NOTE


    When you create a new subfolder, you typically will use it to hold files. You
    can copy files from any of your folders to another folder using the `copy` command.'
