- pgno: 317
  md: '# CHAPTER 13: Creating Presentations with OpenOffice.org Impress


    Planning and then actually getting up in front of a group of people to give a
    presentation can be nerve wracking for even the most seasoned presenter. OpenOffice.org
    provides Impress, a presentation application that makes it easy for you to create
    a presentation that provides both insight and impact in relation to any subject
    matter.


    In this chapter we take a look at the options for creating a new presentation
    and using Impress. We begin with a look at the options for creating a new presentation
    and then concentrate on the various aspects of creating presentation slides including
    the insertion of text and graphics.


    # 128 About OpenOffice.org Impress


    OpenOffice.org Impress provides all the tools that you need to create both simple
    and complex presentations. You can create simple text slides and add animation
    effects and slide transitions. You can even add multimedia content such as sound
    and other media objects to your slides to create full-blown multimedia presentations.


    The Imp application window provides the same overall layout as the OpenOffice.org
    applications such as Writer and Calc. You have the Function bar, Object bar, and
    Main toolbar, which give you access to most of the tools that you need to create
    your presentations. Impress also provides additional toolbars as the Presentation
    toolbar, which makes it easy for you to quickly insert a new slide or change the
    design or layout.


    The Imp application window provides the workspace and toolbars embraced by the
    other OpenOffice.org applications.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_317_0.png)


    302'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Impress also provides different options for the output of your presentations.
    Although most of us think of these types of presentations being shown primary-
    on a computer (or video projection system), Impress also makes it easy for you
    to design your presentations for other types of outputs such as overheads, papers,
    and actual 35mm slides.


    Impress provides a fairly slide-centric approach to creating your presentation;
    in the default Drawing view you are able to concentrate on each slide as you add
    text and other objects to the slide. Then slide transitions and animation effects
    can be added on a slide-by-slide basis. However, you can also differ-ent workspace
    views, such as the Outline view and the Slides view, which allow you to easily
    move content from slide to slide or rearrange the slides in the presentation,
    respectively.


    # 129 Create a New Presentation


    Impress provides the AutoPilot Presentation Wizard, which walks you through the
    process of creating a new presentation. The wizard allows you to select a background
    for the slides in the presentation and quickly add a standard slide transition
    for the slides in the presentation.


    +   - BEFORE YOU BEGIN


    +   -128 About OpenOffice.org Impress


    # Start Impress


    Select the Programs, Office, Presentation. The AutoPilot Presentation Wizard opens.


    TIP


    If you don''t want the AutoPilot Presentation Wizard to appear each time you start
    Impress, select the Do Not Show This Dialog Again check box on the first wizard
    screen. When you open Impress in the future, you are taken directly to the Impress
    workspace and a new blank slide opens. You can then open existing pre-sentations
    as needed. If you do want to use the AutoPilot to create a new pres-entation,
    select File, AutoPilot, Presentation.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# CHAPTER 13: Creating Presentations with OpenOffice.org Impress


    # ## Select Presentation Type


    ![](img/6e85ebc4ce06a64c82109523b60183ba_319_0.png)


    # ## Select Slide Design


    ![](img/6e85ebc4ce06a64c82109523b60183ba_319_1.png)


    # ## Select Slide Transition and Timing


    ![](img/6e85ebc4ce06a64c82109523b60183ba_319_2.png)


    # ## Select Slide AutoLayout


    ![](img/6e85ebc4ce06a64c82109523b60183ba_319_3.png)


    ![](img/6e85ebc4ce06a64c82109523b60183ba_319_4.png)


    # ## Add Text to Slide


    ![](img/6e85ebc4ce06a64c82109523b60183ba_319_5.png)


    # ## 129 Create a New Presentation


    # ## Select Presentation Type


    On the first wizard screen select a new presentation type such as Empty Presentation
    or From Template. If you select From Template a list of templates appears. Select
    a template from the drop-down list. To continue, click Next.'
