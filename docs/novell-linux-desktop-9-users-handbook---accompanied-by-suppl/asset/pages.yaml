- pgno: 148
  md: "When you open the Browse window with the Browse button, you are provided\n\
    icons for the desktop, your home folder, and your removable media drives. To add\n\
    a location to the Browse window, right-click in the right pane of the window and\n\
    select Open Location from the shortcut menu. You can type in the path. The eas-\n\
    way to see all the available folders is to type a slash (/) for the root and all\
    \ the\folders contained in the file system appear. Click on the one you want to\
    \ add. You can\nnow use this location as the start for your search.\n\n# Show\
    \ More Search Options\n\nTo access more search options, select the Show More Options\
    \ switch in\nthe Search for Files window.\n\n# Enter Additional Search Options\n\
    \nSelect the Available Options drop-down list and select one of the\noptions listed:\n\
    \n+   - Contains the Text—Enter any text contained in the file.\n- Date Modified\
    \ Less Than—Enter the number of days that the mod-\nification date must be less\
    \ than.\n- Date Modified More Than—Enter the number of days that the\nmodification\
    \ date must be greater.\n- Size At Least—Enter the “least” file size in kilobytes.\n\
    - Size At Most—Enter the “most” file size in kilobytes.\n- File Is Empty—Looks\
    \ for empty files (you will use this rarely\nbecause anything you create in an\
    \ application is essentially “not\nempty”).\n- Owned By User—Enter the user who\
    \ owns the file.\n- Owned By Group—Enter the group that owns the file.\n- Owner\
    \ Is Unrecognized—Allows you to search for files where the\ncannot be recognized\
    \ by the system.\n- Name Does Not Contain—Enter a character string not contained\
    \ in\nthe filename. This allows you to “rule out” certain files that would\ncontain\
    \ the character in the name.\n- Name Matches Regular Expression—Regular expressions\
    \ are special\nsearch strings that you can create using a text editor. Using regular\n\
    expressions is certainly an advanced way to search but requires a\nfair amount\
    \ of knowledge to create."
