- pgno: 47
  md: '# CHAPTER 3: Working on the NLD Desktop


    NLD uses the GNOME desktop (by default) to provide an easy-to-use desktop environment.
    In this chapter we take a look at the basics of navigating the GNOME desktop including
    how to use the desktop menus, with application windows and virtual desktops, and
    access a command shell to execute NLD command-line tools.


    First we discuss GNOME and where GNOME came from. Then we can explore the GNOME
    desktop in a more hands-on fashion.


    # About the GNOME Desktop


    The GNOME desktop (GNOME stands for GNU Network Object Model Environment) is GNU
    (open source) software that can be run on a number of Linux distributions; it
    also runs on UNIX implementations. GNOME is a desktop environment that provides
    the GUI that you can see and use as you work in NLD.


    GNOME was created and is updated by the GNOME Project. The GNOME community of
    developers is one of the first free software groups to create human interface
    guidelines for the GNOME desktop, which are also suggested guidelines for programmers
    creating applications for Linux-based systems.


    # WEB RESOURCE


    http://www.gnome.org


    See this website for more information about GNOME and the GNOME project.


    The actual graphical display system that allows you to use GNOME and other desktop
    environments such as KDE on a Linux system (such as NLD) is the X Window System.
    The X Window System contains the programming code that allows the system to display
    items in a graphical format (rather than text only).


    # KEY TERM


    X Window System—The graphical display system used by many Linux implementations
    including NLD.


    When you configure items such as your monitor, graphics card, and display resolution,
    you are actually configuring the X Window System. Because the NLD installation
    process automatically configures most X Window System'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# About the GNOME Desktop


    settings for you, you can work in GNOME without worrying too much what the X Window
    System is up to (although when you do change display settings, you are configuring
    the X Window System). Because it is GNOME that we actually interface with (rather
    than the X Window system), we should have a closer look at GNOME''s geography.


    GNOME provides a desktop workspace that contains a set of default desktop icons,
    a top and bottom panel, and a menu system in the top panel. Let''s break out and
    define the various areas of the GNOME desktop for clarity:


    +   Desktop icons—A set of default icons on the NLD desktop: Computer, Home, floppy
    (if one exists on the computer), CD or DVD (depending on the type of installed),
    and Trash. The Computer icon provides access to the computer''s removable media
    drives (floppy and CD for example), the file system (folders on the computer),
    and the Network (which allows you to browse the local area network). The Trash
    icon provides quick access to the Trash folder, which holds all recently deleted
    files and folders.


    +   Top panel—The top panel provides access to the NLD menus (Program, System,
    Help) and quickstart icons for the Mozilla Firefox browser, Novell Evolution,
    and OpenOffice.org. Two additional quickstart icons, Network Connection and Updates,
    also appear on the top panel as does the Volume Control and current date/time.


    +   Bottom panel—The bottom panel contains the Show Desktop icon (which is used
    to clear the desktop by minimizing all currently open windows) and the Workspace
    Switcher allows you to work on multiple virtual desktops. Each of these separate
    spaces can contain open windows and running applications.


    # KEY TERM


    Virtual desktop—A separate workspace that can be used to run applications. Each
    workspace shows the GNOME desktop, but each workspace is a discrete operating
    space, which allows you to keep the actual desktop (within each virtual desktop)
    less crowded (with application windows).


    As with similar graphical user interfaces (such as Windows or the Mac OS), windows
    on the desktop can be maximized, minimized, and dragged to new locations on the
    desktop. Desktop icons require a double-click to open, where-quickstart icons
    on the top panel require only a single click.'
  merge: -1
  img_proc: true
