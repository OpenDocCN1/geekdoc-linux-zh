- pgno: 308
  md: '# TIP


    You can also quickly sort a database or a selected list using the Sort Ascending
    or Sort Descending buttons on the Main toolbar. Only select the items in the list
    to use these buttons. Do not select column headings (the field names that you
    used to describe the columns such as Name, Address, and so on); they will end
    up being sorted with the other data.


    # AutoFilter Database


    You can also quickly filter your data; meaning view a subset of the data based
    on a particular field and its contents. For example, you could view all your clients
    in Indiana by doing an autofilter of a State field where the criterion is "Indiana".


    Select the AutoFilter button on the Main toolbar. A set of drop-down lists appears
    to the right of each of your column headings. Select a list and choose a field
    parameter (the drop-down list shows each of the entries that you have entered
    in that particular field). As soon as you select an entry in the filter drop-down
    box, the database list will be filtered on the selection.


    You can further filter the database by selected parameters for any of the other
    fields using the field''s drop-down list. After you have finished filtering the
    database list, select the AutoFilter button. The database list appears in its
    entirety, and the autofilter drop-down lists for each column disappear.


    # TIP


    You can also create more complex filters that allow you to filter using conditional
    statements. To open the Standard Filter dialog box, select Data, Filter, Standard
    Filter. Select the field or fields that you want to filter the list by and include
    conditional statements as needed.


    # 125 About Calc Charts


    Charts provide pictorial representations of the data in your spreadsheet. Charts
    can be used to emphasize trends shown by the data, and charts often make it easier
    for someone looking at the data to understand what the data really means.


    Calc provides a number of different chart types that can be used to depict

    merical data. Some of the most useful chart types are'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# CHAPTER 12: Creating Spreadsheets with OpenOffice.org Calc


    +   - Line charts—Line charts are used to show change over time. They emphasize
    the highs and the lows in the data. Line charts can show busi- growth over time
    or the sinking of a particular stock fund over time.


    +   - Area charts—These charts are useful for showing trends over long periods
    of time because they emphasize the general direction of the data points (whether
    values are going up or going down). Rather than the severe peaks and valleys that
    you see in line charts, area charts emphasize the area under the graph line, showing
    a gradual rise or drop over time rather than the short-term fluctuations by line
    charts.


    +   - Pie charts—Pie charts show how the points relate to the whole. For example,
    if you want to view pictially how your budget is spent by category (such as supplies,
    salaries, and so on), a pie chart could be used to view each spending category
    and its percent in relation to the whole budget.


    # NOTE


    Calc also provides scatter charts and net charts. Scatter charts are used to identify
    data clusters, which show a correlation between data points. Net charts show how
    uniform a set of data points are have been plotted.


    When you create a chart in Calc, you are walked through the steps of selecting
    the chart type and adding labels or other information to the chart. A new chart
    can be created as an object on an existing sheet in your spreadsheet (such as
    the same sheet that contains the data), or you can choose to place the chart on
    a new sheet.


    # 126 Insert and Format a Chart


