  md: '# 103 Create a Paragraph Style


    # 1 Format Paragraph


    # 2 Create New Paragraph Style


    # 3 Name Style


    ![](img/6e85ebc4ce06a64c82109523b60183ba_266_0.png)


    # 5 Edit Style Settings


    ![](img/6e85ebc4ce06a64c82109523b60183ba_266_1.png)


    # 4 Open Paragraph Style Dialog


    # 103 Create a Paragraph Style


    # 2 Create New Paragraph Style


    In the Stylist window (select the Stylist button on the Function bar if the Stylist
    is not open), select the New Style from Selection button. The Create Style dialog
    box opens.


    # 3 Name Style


    Type a name for the style in the Create Style dialog box; then click OK. The new
    style appears in the Stylist''s style list. You can now assign the style to other
    paragraphs as needed.


    251'
  merge: -1
