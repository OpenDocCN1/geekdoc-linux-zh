- pgno: 370
  md: '# Add New vFolder


    In the vFolders dialog box click the Add button to open the Add Rule dialog box.


    # Enter Name and Criteria


    Type a name for the new vFolder rule (this will also be the name of the vFolder).
    In the If area of the dialog box, specify your criteria. Select the first criteria
    drop-down box and select the part of the message that will be used by the filter
    such as Sender, Recipient, Subject, and so on. Type the criteria that will be
    used by the filter.


    Add other criteria for the rule using the If Add button. If you use multiple criteria,
    select the Execute Actions drop-down list and select either If All Criteria Are
    Met or If Any Criteria Are Met (depending on how you want the criteria).


    # NOTE


    ![](img/6e85ebc4ce06a64c82109523b60183ba_370_0.png)


    Creating vFolders is similar to creating filters. You set the criteria for the
    virtual folder (there can be a number of conditions that must be met for the vFolder)
    and then the filter dictates what appears in the vFolder when you access it from
    the Folder list.


    # Select Sources and Open Select Folder Dialog


    You also need to specify the folders that the vFolder searches when compiling
    the message list that appears in the vFolder. If you want to provide the vFolder
    with a look at all your local or network folders, select the vFolder Sources drop-down
    list and make a selection such as With All Local Folders.


    If you want to specify a folder or folders, select the Add button.


    # Select Folders


    In the Select Folder dialog box, select the folder or folders you want to use
    as the source for the vFolder. Then select Add.


    After setting the criteria and the source folders, click OK to close the Add Rule
    dialog. Click OK again to close the vFolders dialog box.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# CHAPTER 14: Managing Email and Contacts with Novell Evolution


    # 6 View Messages in vFolder


    Now you can view the messages that meet the criteria of the vFolder rule by looking
    in the vFolder. In the Folder list, expand the vFolders list and select the vFolder
    that you created. The messages listed in the vFolder are all messages that meet
    the criteria of the rule that you created for the vFolder.


    NOTE


    The Unmatched vFolder, which is created automatically, shows you all the messages
    that don''t appear in the vFolders that you have created in Evolution.


    # 15 About the Evolution Address Book


    The Evolution address book or contact list provides you with the ability to enter
    contacts including information on each contact such as name, email address, phone
    number, and both home and business addresses. Each contact that you enter is an
    address card in the contacts list when the Address Book is selected in the Evolution
    window (when the Contacts shortcut is selected below the Folder list).


    You can quickly change the view of the contact list by selecting View, Current
    View, and then selecting one of the views on the submenu as Phone List or By Company.
    You can also use the Search box to quickly find a contact or contacts.


    NOTE


    You can share contact information easily with nearly any co-worker user no matter
    what email or groupware program he uses. Select a contact in the address book
    and then select File, Save as vCard. Saving the address information as a vcard
    allows you to email the vcard file as an attachment. Most contact management and
    groupware products can "read" the vcard so that the information can be added to
    that product''s contact list.


    The information you record for each contact depends on what you need to know about
    that particular contact. For example, in the case of personal contacts or co-workers
    you may only need to enter their names and email addresses. In the case of clients
    you may want to enter all the information that you have regarding them, such as
    work address, home address, multiple telephone numbers, and email addresses.


    356'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# Create a New Contact


    Contacts are shown as address cards by default.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_372_0.png)


    The Contact Editor is used to create and edit contacts. The Contact Editor provides
    three tabs:


    +   - Contact—This tab is used to record the contact''s name and other basic information
    such as email address, phone number, and instant messaging account names (if applicable).

    - Personal—This tab allows you to enter information such as home page address
    and the contact''s job information (such as company and title).

    - Mailing Address—This tab provides space for you to enter both the home and work
    addresses of the individual (and includes space for additional optional addresses).


    After you create a new contact, you can edit his information at any time. You
    can also delete contacts that you no longer need.


    # Create a New Contact


    Contacts can be added as needed to the Evolution address book. You can enter all
    the information for a particular contact when you first create the entry in the
    address book. Or you can add information for the contact over time as you accumulate
    it.


    357'
  merge: -1
