- pgno: 347
  md: '# CHAPTER 14: Managing Email and Contacts with Novell Evolution


    Keeping your various communications channels open and organized is essential no
    matter what your job. You need to keep your email organized, have quick access
    to contacts, make keep appointments, and complete tasks on time.


    Evolution is a groupware product designed for collaboration and communication
    between users and a personal information manager (PIM) that can serve as your
    email client, contact manager, and appointment calendar. Evolution provides an
    easy-to-use interface that makes it easy for you to take advantage of its powerful
    features.


    # 143 About Novell Evolution


    Novell Evolution is a perfect example of a groupware client. It is designed to
    allow groups of users to communicate and collaborate. Groupware products such
    as Novell Evolution provide email, help group scheduling, and give access to local
    and global contacts.


    Evolution can serve as the email client and contact manager on a number of different
    network communication platforms such as SUSE Linux servers, Novell GroupWise servers,
    and Microsoft Exchange communication servers. The type of server environment isn''t
    really all that important to Evolution users because the email features and other
    features such as the calendar and contacts work seamlessly no matter the network
    platform.


    # NOTE


    Evolution can be synchronized with Palm handheld devices allowing you to take
    your Evolution contacts and calendar on the road.


    The real concerns of the end-user are related to how Evolution allows you to juggle
    emails, contacts, and appointments and still stay organized. Evolution is installed
    during the NLD installation process. When you open Evolution, you are provided
    with an environment that makes it easy for you to access mail, contacts, and a
    number of other tools.


    # NOTE


    The first time you start Evolution you are walked through the process of adding
    an email account to the Evolution configuration (if an email account has not been
    preconfigured for you by your system administrator).


    The Evolution window is divided into three main areas. At the top of the window
    are the Menu bar and the toolbar. The toolbar actually provides tools'
  merge: -1
  img_proc: true
