- pgno: 229
  md: '# CHAPTER 9: Using Other Internet Tools


    TIP


    To filter the list of groups by a keyword, type the keyword in the Find box and
    then press Enter. This shows you a subset of the group list based on the keyword.


    # 3 Download Headers


    In the Download Headers for Group dialog box new headers will be downloaded (meaning
    the titles of recent posts to the group). If you want to download a greater (or
    fewer) number of posts, select the Download Recent Headers option and use the
    number drop-down list to specify a number. Then select Execute.


    # 4 View Message and Message Threads


    To view a post, select the post in the upper pane of the post list. To view threads
    (responses) to the post, double-click the expand button to the left of the post.
    The contents of the currently selected post appear in the bottom pane of the Pan
    window.


    # 5 Post Message


    To post a message as a follow-up to the currently selected post, select the Followup
    to Newsgroup icon (the second button from the left). If you want to post a new
    message (not related to the current post), select the Post to Newsgroup button
    (the first button on the toolbar). In either case a new post window opens.


    Enter the text for your post in the message area of the Post window. If you are
    creating a new post (not related to a current post) enter a subject for the post.
    After entering the post information, select the Send Now button, and the post
    will be sent. It may take some time (depending on the news server) for your post
    to appear in the group.


    After you have finished browsing groups and posts and finished posting your own
    messages, select the Close Window button to close the Pan window.


    TIP


    As you browse through the various groups, you will find groups that you want to
    access often. Right-click the group in the group list and select Subscribe. The
    group is marked with a subscribe icon. You can quickly find your subscribed groups
    in the group list. Select the All Groups drop-down list and select subscribed.
    Only your subscribed groups appear in the group list.'
