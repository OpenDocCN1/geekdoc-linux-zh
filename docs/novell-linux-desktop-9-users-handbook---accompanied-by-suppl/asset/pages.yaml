- pgno: 365
  md: '# CHAPTER 14: Managing Email and Contacts with Novell Evolution


    # 5 Create New Filter Rule


    In the Add Rule dialog box, type a name for the new rule. In the If area of the
    dialog box, specify your criteria. Select the first criteria drop-down box and
    select the part of the message that will be used by the filter such as Sender,
    Recipient, Subject, and so on. Type the criteria that will be used by the filter.
    For example, if you want to filter the emails from Mary Smith, select Sender in
    the drop-down list and then type Mary Smith as criteria.


    Add other criteria for the rule using the Add button. If you use multiple criteria,
    select the Execute Actions drop-down list and select either All Criteria Are Met
    or If Any Criteria Are Met (depending on how you want the criteria).


    In the Then area of the Add Rule dialog box, select the drop-down list and select
    the action that you want to take place when the filter rule criteria is met by
    a message, such as Move to Folder, Copy to Folder, Delete, and so on. You can
    add multiple actions using the Add button if necessary.


    # TIP


    You can create filters based on the currently selected message. Select a message
    in the list and then select Tools, Create Filter From Message, and from the sub-menu
    such as Filter on Subject, Filter on Sender, and so on. The Add Filter Rule dialog
    box opens. The criteria for the filter rule will be set based on information in
    the email. For example, if you selected Filter on Sender on the submenu, the rule
    is set to filter mail based on the selected email''s sender. You can add criteria
    as needed and specify what you want to do to messages that meet this rule''s criteria
    (such as move to a particular folder).


    # 6 Open Select Folder Dialog


    To specify a folder to be used when the rule criteria is met (when you are using
    actions as Move to Folder or Copy to Folder), select the Click Here to Select
    a Folder box. This opens the Select Folder dialog box.


    # 7 Select Folder


    Select a folder in the Select Folder dialog box and then click OK. You are returned
    to the Add Rule dialog box.'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'Your filters don''t necessarily have to move, copy, or delete the messages
    that they act on. Filters can also be used to color code messages, and you can
    automatically assign follow-up flags to messages using filter rules.


    # Complete Filter


    After specifying the criteria and the actions for the filter rule, click OK You
    are returned to the Filters dialog box.


    # Close Filters Dialog


    Your new rule will appear in the Filters dialog box. Click OK to close the Filters
    dialog box.


    # Apply Filter


    Select a message or messages in the Inbox or any folder. Select Actions Apply
    Filters Selected messages that match the rule criteria are acted on by the filter
    (such as being moved to a different folder). All new mail automatically is acted
    on by the filter.


    # Use the Junk Mail Filter


    We are inundated with junk email: spam! Evolution provides a junk mail filter
    that detects suspected junk email and removes it to the Junk folder. You can actually
    train the junk mail filter by letting the feature know when you have received
    junk email. You select the email and then mark the email as junk using the Junk
    button on the Evolution toolbar.


    # Open Evolution Settings Dialog


    Select Tools, Settings from the menu. In the Evolution dialog box, select the
    Mail Preferences icon.


    NOTE


    The Evolution Settings dialog box is where you configure the various settings
    for your mail accounts, mail preferences, and settings for your calendar and tasks.
    Select one of the icons such as Calendar and Tasks to configure settings such
    as the time zone, the start of the work week, and when reminders should be provided
    for your scheduled appointments.'
  merge: -1
  img_proc: true
