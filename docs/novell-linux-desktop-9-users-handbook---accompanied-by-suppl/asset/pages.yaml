- pgno: 293
  md: '# Format Text


    +   5 Format Text


    After you have entered your text labels, you can format them. Select the cell
    or cells that you want to format. Then select a formatting option such as **Bold**
    on the Object bar. You can also add borders and background colors for selected
    cells using the Object bar. After formatting the cells, click in any other cell
    to deselect the formatted cells.


    +   6 Format Numbers


    Numerical values can appear as standard numbers, currency, and percentages (and
    have a varying number of decimal places). To format numbers for a particular number
    type such as currency, select the cells to be formatted and then select a format
    option on the Object bar such as Currency.


    TIP


    You can access more formatting options for selected cells in the Format Cells
    dialog box. Select **Format, Cells.** This provides access to numerical formatting
    and formatting for font attributes and borders and background colors.


    +   7 Compute Totals


    You can quickly derive a total for a row or column of numbers using the Sum function.
    This function (a built-in formula) automatically selects the cells to be used
    to compute the total by selecting adjacent cells containing numerical values (a
    group of adjacent cells is referred to as a range).


    KEY TERM


    **Range**—A group of adjacent and contiguous cells. Ranges are used in formulas
    and functions to compute the results. You can also select a range of cells for
    formatting.


    Click in the cell where you want to place the Sum function and then click the
    **Sum** function button on the Formula bar. The cell range to be acted on by the
    function will be highlighted in a blue box. If you need to adjust the cell selection,
    click and drag to select the appropriate cells. Then press **Enter** to enter
    the Sum function in the cell.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# TIP


    You can also drag to copy a formula or function. For example, if you have several
    like ranges of numerical values in rows, you can use Sum to compute the first
    total and then drag the Sum function to the other cells to compute their totals.
    The Sum function is actually copied using the autofill handle, and it adjusts
    to the new row values, giving you the correct total for each range of numbers.


    # 115 Enter Dates


    Although dates appear as dates (August 11, 2005, for example) in your Calc sheets,
    these dates actually have numerical significance. For example, you might need
    to calcule the number of days between two different dates. You can actually subtract
    the earlier date from the later date and be provided the number of days that they
    differ.


    The date is actually seen by Calc as a numerical value; so when you enter 11/22/2005,
    you see it as a date, but Calc sees it as a number—the number of days that have
    elapsed since January 1, 1900. So, Calc sees 11/22/2005 as 38,678.


    +   1 Enter Date


    In Calc, click on a cell that will hold a date. Type the date; you can enter the
    date as November 22, 2005 or as 11/22/2005. Press Enter.


    +   2 Open Format Cells Dialog


    You can change the format (appearance of the date). Select a cell or cells containing
    dates and then select Format, Cells. The Format Cells dialog box opens.


    +   3 Format Date


    The Numbers tab of the dialog box will be selected. Select a format for the date
    in the Format list. After you have completed your selection, click OK.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# CHAPTER 12: Creating Spreadsheets with OpenOffice.org Calc


    ![](img/6e85ebc4ce06a64c82109523b60183ba_295_0.png)


    115 Enter Dates


    # 116 About Creating Formulas


    Calc is designed to do calculations. Although many built-in formulas and functions
    are provided by Calc, in some situations you will need to build your own formulas.
    These formulas typically involve simple math operations such as subtraction, multiplication,
    and division.


    All formulas that you create must begin with the equal sign (=). This tells Calc
    that the information that follows the equal sign is a formula. To designate the
    type of calculation you want Calc to perform you use a mathematical operator (see
    Table 12.1).


    TABLE 12.1.

    Mathematical Operators


    | OPERATOR | PERFORMS | EXAMPLE |

    |---|---||

    | + | Addition | =A1+B1 |

    | - | Subtraction | =A1-B1 |

    | * | Multiplication | =A1*B1 |

    | / | Division | =A1/B1 |

    | ^ | Exponentiation | =A1^2 |


    You enter the cell addresses for the cells that will be acted on by the formula.
    For example, B5*C5 multiplies the contents of B5 times the contents of C5.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'When you design your own formulas, keep the natural order of math operator
    precedence in mind: Exponents are computed first, then multiplication and division,
    followed by addition and subtraction. To force the precedence you can place portions
    of your formula in parentheses. This part of the formula is computed first.


    # Create a Formula


    Calc makes it easy to add simple formulas in your spreadsheet.


    +   - BEFORE YOU BEGIN

    - About Creating Formulas


    # Start Formula


    Select the cell that will contain the formula. Type an equal sign (=) or select
    the Function button (the big equal sign on the Formula bar).


    # Select Cell


    Select the first cell that will be included in the formula (selecting the cell
    is better than typing the cell address because it avoids typos). The cell address
    appears in the cell where you are creating the formula.


    # Enter Operator and Select Second Cell


    Type the operator for the formula. For example, type an asterisk (*) for multiplication.
    Then select the second cell that will be acted on by the formula. Press Enter
    to complete the formula. The results of the formula appear in the cell where you
    built the formula. Select the cell and view the formula on the Formula bar''s
    Input line.


    # TIP


    After you create the formula, you can use the autofill feature to copy the formula
    to other cells or use Copy and Paste to copy the formula to other cells.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# CHAPTER 12: Creating Spreadsheets with OpenOffice.org Calc


    ![](img/6e85ebc4ce06a64c82109523b60183ba_297_0.png)


    # 118 About Calc Functions


    Functions are built-in formulas that can do everything from add a range of values
    to provide an average for a range of cells to figure out the payment amount for
    a loan at a particular interest rate. Functions consist of two parts: the function
    name (such as =Average) and the range of cells that the function should act on.
    Calc provides many functions broken down into different categories (see Table
    12.2). A statistical category includes functions such as average, maximum, and
    minimum. A financial category provides functions that allow you to calculate returns
    on investment and loan payment amounts among other finance-related calculations.


    # TABLE 12.2


    Some of the Calc Function Categories


    | CATEGORY | EXAMPLE | PURPOSE |

    |---|---|---|

    | Date and Time | TODAY | Enters the current date |

    | Financial | PMT | Calculates loan payments |

    | Logical | IF | Returns a true or false answer to a conditional statement |

    | Mathematical | COS | Calculates the cosine of an angle |

    | Statistical | AVERAGE | Calculates the average for a range of cells |


    The easiest way to enter a function is through the Function AutoPilot. The AutoPilot
    allows you to select a particular function from the function list and then specify
    the cells that the function should act on. The AutoPilot also provides information
    about a selected function and makes it easy for you to get help as you work with
    a particular function.


    282'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Use the Function AutoPilot


    # Use the Function AutoPilot


    Calc''s AutoPilot simplifies the task of creating complex formulas and functions
    with your spreadsheet data.


    +   - BEFORE YOU BEGIN

    - About Calc Functions


    # Select Cell and Start AutoPilot


    Select the cell that will contain the function. Then select the AutoPilot: Functions
    button on the Formula bar. The AutoPilot: Functions dialog box opens.


    # Select Function


    In the AutoPilot dialog box use the Category drop-down list to select the function
    category you want to view. To select a function, use the Function scroll box.
    After you have selected your function, click Next.


    # Shrink AutoPilot


    On the next AutoPilot screen you must provide the range of cells that you want
    the function to act on. The easiest way to specify the range is to shrink the
    AutoPilot. Select the Shrink button in the Number 1 range box on the right of
    the AutoPilot. The AutoPilot dialog box shrinks or rolls up, allowing you to view
    the data on the sheet.


    # Select Cell Range


    Select the range of cells to be used in the function. Then press Enter. The AutoPilot
    dialog box reappears (unshrinks).


    # Enter Function


    To enter the function in the cell, click OK. The function is placed in the cell,
    showing the results.'
  merge: -1
  img_proc: true
