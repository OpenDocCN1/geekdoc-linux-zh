- pgno: 137
  md: '# CHAPTER 6: Managing Files


    Each standard folder in the hierarchy holds a particular set of files. Normally
    really should not mess around with these folders; for example, the /etc folder
    contains configuration files. The /lib folder contain library code used by NLD
    programs.


    Other folders that you may want to be aware of are /media, which contains the
    mountable removable media drives that are on your system (such as a floppy, CDROM,
    DVD), and /tmp, which is used by programs that need to create temporary files
    as they are used.


    As a "regular" user there are not many folders that you need to be concerned with.
    When your user account was created (during installation or after using the root
    account), a home folder was created for you. This home folder can be easily opened
    from the Home icon provided on your NLD desktop. This is the best folder for saving
    the files that you create. You can create subfolders in your home folder as needed.


    The Nautilus File Manager provides you with the ability to manage files locally,
    on your hard drive, and on other media drives, and it allows you to browse files
    on the network. You can use Nautilus to access files on a Linux network or on
    a Windows computer in a workgroup, your computer has also been configured to managing
    and locating the files that you need to get your work done.


    # NOTE


    If you have configured your NLD installation to use a printer that is shared by
    a Windows computer to access files on that same workgroup. You can easily access
    any files shared by Windows computers in the workgroup.


    # 45 Configure Nautilus Preferences


    Nautilus makes it easy for you to configure preferences related to how folders
    and files are viewed and accessed. The Nautilus preferences are accessed via the
    Preferences command on the Edit menu.


    # 1 Open Nautilus


    Select the Programs menu and then Accessories; then select File Manager. Nautilus
    opens showing your home folder.'
