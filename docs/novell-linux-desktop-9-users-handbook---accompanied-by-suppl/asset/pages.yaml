- pgno: 267
  md: '# 4 Open Paragraph Style Dialog


    You can edit the various formatting options for a style that you have created.
    Right-click on the style in the Stylist''s style list and select Modify. The Paragraph
    Style dialog box opens.


    # 5 Edit Style Settings


    Use the various tabs in the Paragraph Style dialog box to change the formatting
    options for the style. After you have completed your changes, click OK. You can
    now assign the edited style to text in the document.


    TIP


    You can also update a style by changing the formatting on a paragraph that has
    been assigned the style. Then in the Stylist, select the Update Style button in
    the upper right of the Stylist window.


    # 104 Insert Headers, Footers, and Page Numbers


    Information that you want to repeat at the top (header) or bottom (footer) of
    the pages in the document can be inserted using the Page Style dialog box (select
    Format


    Headers and footers are useful when you want to place a draft number on the pages
    of a document or place your name and the date on all pages in the document. More
    importantly, you can automatically number the pages of the document by entering
    a page number field in a header or footer.


    # 1 Open Page Style Dialog


    Because headers and footers are typically not placed on the first page, to the
    second page of your document and place the cursor on that page. select Format,
    Page from the menu. The Page Style dialog box opens.


    # 2 Enable Header/Footer


    In Page style dialog box, select the Header (or Footer) tab. To enable the header
    (or footer) select the Header On (or Footer On) check box.


    252'
  merge: -1
