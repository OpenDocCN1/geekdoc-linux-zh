- pgno: 215
  md: '# CHAPTER 9: Using Other Internet Tools


    The World Wide Web isn''t the only communication medium that takes advantage of
    the Internet''s infrastructure. In this chapter we look at some other strategies
    for communication on the Internet including email, instant messaging, and Internet
    newsgroups.


    NLD comes with a number of Internet tools preinstalled. You can quickly get your
    email account up and running with Novell Evolution (a powerful email client and
    information manager). And NLD also offers the Gaim Instant Messenger, which can
    be used for instant messaging on a variety of IM platforms including AOL, ICQ,
    Jabber, Yahoo, and MSN. You can also take advantage of the wealth of information
    held in Usenet newsgroups by configuring and using the preinstalled Pan News Reader.


    # About Internet Email Accounts


    +   - SEE ALSO

    - Add an Email Account to Evolution

    - About Email and Evolution

    - Compose and Send Email


    Electronic mail (email) has been available on the Internet since 1972, dating
    back to a time when the Internet was still called ARPANet. Email is certainly
    one of the most widely used applications on the Internet.


    To configure an email account you need to know certain things such as the names
    of the mail servers that you use to send and receive email. And of course you
    need to know your email address and a password to access the email account.


    If you work for an organization that maintains its own mail servers, your email
    account will typically be configured for you. If you are using NLD with an email
    only account through an Internet service provider, there are some things you need
    to know about to actually configure your account.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# 80 About Internet Email Accounts


    # NOTE


    The type of email account that you have depends on the network environment that
    you work in. Home and small office users typically use Internet email accounts
    hosted by an Internet service provider. In a corporate environment your email
    account is a corporate account that also provides email capabilities and is controlled
    by your organization; the organization typically has its own email servers (such
    as Novell or SUSE Linux mail servers) and system and network administrators that
    configure desktop computers and servers. In most corporate and institutional environments,
    your email account will be set up for you on your system. If you are an NLD home
    user or small office user, the information that you need to configure your Internet
    email account will be available from your Internet service provider.


    The following list provides short descriptions of things you need to know to configure
    your own Internet email account:


    +   - Email address—You need to know your Internet email address. Sometimes you
    are allowed to select this when you sign up with an Internet service provider.
    It takes the form of username@company.com. Where the username would be your email
    account username and the information that follows the "at" (@) sign is the domain
    name for the Internet service provider that is supplying you with the account.

    - Email account password—Email is a secure service and so it is password protected.
    You need to know the password for your email account.

    - SMTP server name—SMTP (Simple Mail Transport Protocol) allows you to send your
    email. So, you need to know the domain name (friendly name) of your provider''s
    SMTP server. It is typically in a format such as snmp-server.mail.company.com.

    - POP3 server name—Mail that is sent to you is held on a POP (Post Office Protocol)
    server, until you download the email to your computer(using your email client).
    You need to know the POP3 server name, which will be in a format such as pop-server.mail.company.com.


    # KEY TERM


    SMTP server—The server that accepts your email when you send an email. The SMTP
    server then passes the email on it to its final destination.


    201'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# CHAPTER 9: Using Other Internet Tools


    # KEY TERM


    POP3 server—The server that acts as the post office and holds your received email
    until you download them to your computer using your email client.


    # NOTE


    There is another mail server type called IMAP (Internet Message Access Protocol)
    server. An IMAP server can take the place of a POP3 server as the post office
    for your received mail. IMAP allows you to leave mail on the server (even after
    you access it) and store the mail in folders on the server. This is useful for
    people on the go who may access their mail from different devices such as computers,
    handheld personal assistants, or email-ready cell phones. IMAP allows you to see
    all your email messages received no matter what device you use.


    It goes without saying that you have to be connected to a corporate network that
    supports email or have an Internet connection to take advantage of Internet email.
    One thing that I did not mention that you need is an email client. NLD provides
    Novell Evolution as the default email client, and it is installed when NLD is
    installed on your computer. It is Evolution that you will configure for corporate
    and/or Internet mail accounts.


    # 81 Configure an Email Client


    To configure an email account you must supply email account and password information.
    You must also enter information related to the mail servers that handle your outgoing
    and incoming email.


    You configure your email client the first time that you start Evolution. Other
    email accounts can be added to Evolution as needed.


    +   - BEFORE YOU BEGIN

    - SEE ALSO


    +   80 About Internet Email Accounts

    144 Add an Email Account to Evolution


    # 1 Open the Evolution Setup Assistant


    From the NLD desktop, select the Evolution icon in the top panel. The Evolution
    Setup Assistant window opens. To bypass the introductory screen of the Assistant,
    select Forward.'
  merge: -1
  img_proc: true
