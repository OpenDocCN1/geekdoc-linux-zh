- pgno: 101
  md: '# CHAPTER 4: Modifying the NLD Desktop


    # 1 Open Window Preferences Dialog


    In the Settings dialog box, double-click the Windows icon in the Appearance pane
    of the dialog box. The Window Preferences dialog box opens.


    # 2 Change Window Preferences Settings


    In the Window Preferences dialog select the Select Windows When the Mouse Moves
    Over Them check box if you want to activate windows by rolling the mouse over
    them. You can also set the interval of time that must be met before the window
    gains focus. Select the Raise Selected After an Interval check box and set the
    interval time.


    If you want to change the behavior of windows when the title bar is double-clicked
    (the default is Maximize), select the Double-Click Titlebar to Perform This Action
    box and select Roll Up. Windows now roll up when you double-click the title bar.


    You can also select the helper key used when you want to drag to the window (by
    default no helper key is required, and the default is the Alt key). Select an
    option box such as Control, Hyper, or Super (or “Windows logo”) to change the
    key selection.


    # 3 Close Window Preferences Dialog


    After making your changes to the settings in the Window Preferences dialog box,
    select the Close button to close the dialog box and return to the Settings dialog
    box.


    NOTE Other than the ability to focus on a window by rolling the mouse over it
    and the ability to roll up a window with a double-click on the title bar, the
    other options in the Window Preferences dialog are probably best left at the defaults.'
