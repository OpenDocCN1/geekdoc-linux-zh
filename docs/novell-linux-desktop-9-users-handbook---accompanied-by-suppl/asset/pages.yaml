- pgno: 386
  md: '# Create Appointments


    # TIP


    Make sure that the calendars you want to view in the calendar pane are selected
    in the Calendar list on the left side of the Evolution window (select the check
    box for each calendar you want to view).


    # 2 Enter Summary, Location, and Description


    Enter a summary for the appointment. You can also type an optional location and
    description for the appointment.


    # 3 Select Classification


    To classify the appointment as Public, Private, or Confidential select the Classification
    drop-down list and make a selection.


    # NOTE


    Marking an appointment as private or confidential is really only necessary when
    you are using group calendars on a network. In this type of groupware environment,
    public appointments would be available to other users; private appointments- would
    not.


    # 4 Select Calendar


    Select the Calendar drop-down box and select the calendar for the appointment.
    The calendar you select determines the color-coding for the appointment.


    # 5 Select Start Time, End Time, and Reminder


    Use the Start Time and End Time drop-down lists to set the start and end times
    for the appointment, respectively. For a reminder for the appointment, select
    the Alarm drop-down list and make a selection on the list (such as 1 Hour Before
    Appointment).


    # TIP


    If the appointment is an all-day event, select the All Day Event check box to
    mark the entire day as "busy."'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# CHAPTER 15: Staying Organized with Novell Evolution


    # TIP


    If you want to customize the alarm for the appointment, select the **Customize**
    button. You can then customize your alarm by selecting the **Add** button in the
    Add Alarm dialog box. Custom alarms can start a particular program or play a particular
    sound when the alarm is triggered.


    # Save Appointment


    After you have finished entering the information and the time frame for the appointment,
    click **OK**. The appointment is added to your calendar.


    # TIP


    For a recurring appointment, select the **Recurrence** tab on the appointment’s
    dialog box. Select the **This Appointment Recurs** check box and then use the
    spinner boxes to set the period for the appointment’s recurrence.


    # 163 Send a Meeting Invitation


    Evolution makes it easy for you to schedule a meeting and notify the participants.
    Invitations can quickly be sent to your contacts and others via email. When you
    create a new meeting you are also creating a new appointment on your calendar.


    # Open New Meeting


    To start a new meeting select the New drop-down arrow on the toolbar and then
    select **Meeting**. A new Appointment dialog opens with Scheduling and Invitations
    tabs included.


    # NOTE


    Because you are the organizer of the meeting, Evolution automatically includes
    you as a participant.


    # Open Select Contacts from Address Book Dialog


    To type a new participant into the meeting list, select **Add** and then type
    the name or email address of the participant. You can also quickly add participants
    for the meeting from your address book. Select **Contacts** on the Invitations
    tab.'
  merge: -1
  img_proc: true
