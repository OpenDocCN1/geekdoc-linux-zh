- pgno: 320
  md: '# 129 Create a New Presentation


    TIP


    If you want to open an existing presentation from the AutoPilot Wizard, select
    the Open Existing Presentation option.


    # 3 Select Slide Design


    On the next screen select a slide design from the Presentation Backgrounds drop-down
    list. To select an output medium (other than the default: Screen), select the
    appropriate option button such as Overhead Project. After making your selections,
    click Next to continue.


    # 4 Select Slide Transition and Timing


    In the next wizard you are provided the option of selecting a slide transition
    for the slides in the presentation. Select a transition type from the Effect drop-down
    list (such as Fly in from Left or Dissolve). To set the speed of the transition
    select the Speed drop-down list and select a speed (Medium is the default).


    If you want to create a self-running automatic presentation, select the Automatic
    option button. You can then set the page and pause duration timings using the
    appropriate spinner box. After you have configured the settings on this wizard
    screen, select Create to continue.


    NOTE


    You do not have to select a transition type for your slides in the AutoPilot Presentation
    Wizard window. You can add transitions to your slides using the Slide Show menu
    (and then Slide Transition) as you create each of the slides.


    # 5 Select Slide AutoLayout


    The Modify Slide dialog box opens. This allows you to set the AutoLayout for the
    first slide in the presentation. This layout is typically Title Slide layout.
    You can also enter a name for the slide. This is a descriptive name, which is
    saved with the slide''s properties. After selecting the slide and entering the
    optional slide name, click OK. The new slide appears in the Impress window in
    the Drawing view, which is used to add text and other objects to the slide (only
    one slide is shown in the Drawing view at a time).


    305'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# CHAPTER 13: Creating Presentations with OpenOffice.org Impress


    # 6 Add Text to Slide


    Placeholder text is provided on the new slide. Select any of the placeholder text
    and enter your slide text as needed.


    TIP


    To save your new presentation, select the Save Document button on the Function
    bar. In the Save As dialog box provide a name and location for the new file; then
    select Save.


    # 130 Insert a New Slide


    As you create your slide presentation, you will need to enter new slides. The
    quickest way to insert a new slide is using the Presentation toolbar. You can
    also insert a new slide using the Insert menu.


    ✓ BEFORE YOU BEGIN


    +   - 128 About OpenOffice.org Impress

    - 129 Create a New Presentation


    # 1 Activate Presentation Toolbar


    If the Presentation toolbar is not open in the Impress workspace, select the View,
    Toolbars, Presentation. The Presentation toolbar appears.


    TIP


    You can dock the Presentation toolbar in the Impress workspace. For example, if
    you want to dock the Presentation toolbar on the right side of the workspace,
    hold down the Ctrl key and drag the Presentation toolbar to the right border of
    the Impress window. When you dock the Presentation toolbar at the bottom of the
    you are provided access to a series of buttons at the toolbar that allow you to
    quickly switch the current view in the workspace.


    # 2 Insert New Slide


    On the Presentation toolbar, select Insert Slide. The Insert Slide dialog box
    appears.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# 131 Add Text to a Slide


    # 1 Activate Presentation Toolbar


    # 2 Insert New Slide


    ![](img/6e85ebc4ce06a64c82109523b60183ba_322_0.png)


    # 3 Select Slide AutoLayout


    ![](img/6e85ebc4ce06a64c82109523b60183ba_322_1.png)


    # 130 Insert a New Slide


    # Select Slide AutoLayout


    In the Insert Slide dialog box type an optional name for the slide. Select a layout
    for the new slide from the AutoLayouts provided (the Title, Text layout is selected
    by default after you have created a title slide for the (presentation). After
    making your selection, click OK The new slide appears in the Impress workspace.


    # Add Text to a Slide


    After you''ve created a slide, you can add text to it by selecting any of the
    place-holder text on the slide and typing your text as needed. In some situations
    you may want to add text to a slide in a new text box. You can add text boxes
    where the text fits the frame (making the font size dependant on the frame size),
    and you can also add callouts that allow you to provide informa- related to a
    certain part of an image, chart, or other inserted object.


    307'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# CHAPTER 13: Creating Presentations with OpenOffice.org Impress


    +   ✓ BEFORE YOU BEGIN

    130 Insert a New Slide


    # Select Text Tool


    Insert a new slide or use a current slide in a presentation. On the Main toolbar,
    select the Text button''s arrow and select one of the text tools such as Text
    or Fit Text to Frame (this changes the font to mimic the size of the drawn frame).


    TIP


    You can move from slide to slide in your presentation using the navigation buttons
    at the bottom of the workspace. To select a particular slide, click on the tab
    for that slide. The slide tabs show the name that you entered when you created
    the slide.


    # Draw Text Box


    Use the mouse to "draw" a text box on the current slide. When you release the
    mouse cursor appears in the text box.


    # Enter Text


    Type the text that you want to place in the text box.


    TIP


    You can drag the text box by its border to any location on the slide. If you want
    to change the size or shape of the text box after you have entered text, use the
    sizing handles on the text box. After text is in the text box, you can select
    the text using the I-beam and format the text using the font formatting and alignment-tools
    on the Object bar.


    # Add Callout to Slide


    Callouts allow you to draw attention to a particular place on a diagram or picture.
    Select the Text button''s arrow (as in step 1) and then select the Callouts tool.
    Drag the mouse from the item that you want to "point out" with the callout to
    a position you want the callout''s text box to appear. Then release the mouse.


    308'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# 132 Modify Slide Layout


    +   1 Select Text Tool


    +   2 Draw Text Box


    +   4 Add Callout to Slide


    +   3 Enter Text


    +   5 Type Callout Text


    +   131 Add Text to a Slide


    # 5 Type Callout Text


    Type and format the text in the callout''s text box as needed. You can drag the
    callout to position it more precisely on the slide.


    # 132 Modify Slide Layout


    You can modify the layout for the current slide in the Drawing view. Because layout
    changes can affect text and objects already on the slide, you may finalize the
    layout for a slide before adding items to the slide.


    +   BEFORE YOU BEGIN


    +   130 Insert a New Slide'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# CHAPTER 13: Creating Presentations with OpenOffice.org Impress


    ![](img/6e85ebc4ce06a64c82109523b60183ba_325_0.png)


    # 1 Modify Slide Dialog


    Open the slide in the Drawing view. Select Format, Modify Slide Layout. The Modify
    Slide dialog box opens.


    TIP


    You can also use the Presentation toolbar to duplicate the current slide. This
    allows you to change the layout for the slide and see how the change affects the
    text and objects already on the slide.


    # 2 Select New Layout for Slide


    Select a new layout for the slide in the Modify Slide dialog box. Then click OK
    to accept the selection.


    TIP


    Changing the slide layout negates you from "undoing" any changes made to the slide
    before you change the layout. Although changing the layout preserves current objects
    on the slide, it may make them look a little strange when the new layout places
    additional new objects on the slide.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# 133 Change Slide Design


    You can change the slide design for a slide or slides in your presentation. This
    changes the background color and the design elements provided by the previous
    design. As with slide layouts, it makes sense to select the slide design before
    you enter a lot of text or other objects on the slides. This allows you to arrange
    objects on a slide so that they complement the design elements provided by the
    selected design. When you select a different design, you are actually selecting
    a template that is applied to the slides.


    # 1 Open Slide Design Dialog


    You open the slide in the Drawing view that you want to edit. Select Format, Styles,
    Slide Design. The Slide Design dialog box opens.


    TIP


    You can also open the Slide Design dialog box from the Presentation toolbar. Select
    Slide Design.


    # 2 Load Slide Designs


    Recently used designs are listed in the Slide Design dialog box. To load other
    available designs, select the Load button. The Load Slide Design dialog box opens.


    # 3 Choose Design for Loading


    Select Presentation Backgrounds in the Categories box of the Load Slide Design
    dialog box. This lists the slide designs available. Select a design and then click
    OK. You are returned to the Slide Design dialog box.


    TIP


    You can download additional templates and slide designs from the OpenOffice.org
    website. The template page URL is http://documentation.openoffice.org/Samples_Templates/User/template/index.htm
    The template page provides links for downloading the templates and provides information
    on the folder that you should place the templates in so that Imp can load them
    when you want to access them. This template page also provides templates for other
    OpenOffice.org applications such as Writer and Calc.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# CHAPTER 13: Creating Presentations with OpenOffice Impress


    ![](img/6e85ebc4ce06a64c82109523b60183ba_327_0.png)


    +   1 Open Slide Design Dialog


    +   2 Load Slide Designs


    +   3 Choose Design for Loading


    +   4 Apply Design


    +   5 Open Page Setup


    +   6 Select Background


    +   133 Change Slide Design


    # 4 Apply Design


    Select the newly loaded design in the Slide Design dialog box. Then click OK to
    apply the design to the current slide.


    # 5 Open Page Setup


    You can change the background for the current slide; select Format, Page. The
    Page Setup dialog box opens. Select the Background tab if necessary.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Select Background


    The option buttons on the Background tab to select the type of background to apply
    to the slide: Color, Gradient, Hatching, or Bitmap. Then select the background
    for the slide from the currently selected background type. When you are ready
    to apply the new background, click OK.


    # TIP


    You can change the background color and design elements for all the slides in
    a presentation. This allows you to add objects to all your slides such as a company
    logo or repeating elements. You change the overall design of the slides in the
    presentation by editing the master slide. Select View, Master, Drawing from the
    menu. Be careful not to change the text box provided on the master. You can, however,
    add or replace the design elements on the master. You can also change the background.
    Select Format, Page. Use the Page Setup dialog box to change the background for
    the master. You can then return to the slide view; select Format, Slide.


    # Use the Object Bar


    The Object bar provides tools specific to the currently selected object on your
    slide. For example, when you work with a text object (a text box) the Object bar
    provides font formatting and alignment tools. When you work on a drawn object
    (such as an ellipse drawn using the Mail toolbar Ellipse tool), the Object bar
    provides tools that can be used to format the line style, color, and background-color
    for the drawn object.


    # Use Text Formatting Tools


    Select the text in a text box. The Object bar changes to the text formatting tools.
    Use the font formatting tools such as the Font box to select a new font and the
    Size box to select a new font size. You can also enable other formatting attributes
    such as Bold and Italic. To change the alignment for the selected text, select
    one of the alignment buttons such as Centered.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# CHAPTER 13: Creating Presentations with OpenOffice.org Impress


    | 1 Use Text Formatting Tools | 2 Use Drawn Object Tools |


    ![](img/6e85ebc4ce06a64c82109523b60183ba_329_0.png)


    Early Computing Devices


    3 Use Image Formatting Tools


    ![](img/6e85ebc4ce06a64c82109523b60183ba_329_1.png)


    Early Computing Devices


    134 Use the Object Bar


    # Use Drawn Object Tools


    Draw an object such as an ellipse using the Ellipse tool on the Main toolbar.
    With the drawn object selected use the Object bar tools such as the **Line Style**,
    **Line Width**, or **Line Color** tools to format the object. To change the fill
    color for the object, select the **Area Style/Filling** drop-down list and select
    a new color.


    # Use Image Formatting Tools


    Insert a graphic on a slide (select **Insert, Graphics**). When the graphic is
    selected, the Object bar provides tools for formatting the graphic. Use the Red,
    Blue, Green spinner boxes to change the basic color mix for the graphic. Use the
    Brightness and Contrast spinner boxes to lighten or darken the image as needed.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Insert Graphics and Other Objects


    You can insert graphics and other objects to enhance the slides in your presentation.
    Graphics can be informative, such as a picture that provides information related
    to the slide content, or used just to add interest to your slides, such as a design
    element. You can also insert other objects (just about anything really), such
    as video and sound or application objects such as Calc spreadsheets and charts.
    Any application that you run on your system can actually be the host for an object
    placed on a slide.


    # Open Insert Graphics Dialog


    Select Insert, Graphics from the menu. This opens the Insert Graphics dialog box.


    TIP


    You can search for open source and free clipart and images on the Web. A good
    place to start is www.openclipart.org. You can browse for specific clipart on
    this site or download the entire library.


    # Insert Graphic


    In the Insert Graphics dialog box browse your folders as needed to locate the
    graphic. Then select the graphic file and then select Open. The graphic is placed
    on the slide. You can drag the graphic to a new location or size it as needed.
    Tools for modifying the graphic are available on the Object bar.


    TIP


    OpenOffice.org allows you to use graphics in a number of different graphic formats
    including .bmp, .eps, .gif, .jpg, and .png.


    # Open Gallery


    You can find a number of 3-D graphics, textures, and other graphic objects to
    add to your slides in the Gallery. Select the Gallery button on the Function bar.
    The Gallery opens at the top of the workspace.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# CHAPTER 13: Creating Presentations with OpenOffice.org Impress


    # 1 Open Insert

    Graphics Dialog


    # 2 Insert Graphic


    # 3 Open

    Gallery


    ![](img/6e85ebc4ce06a64c82109523b60183ba_331_0.png)


