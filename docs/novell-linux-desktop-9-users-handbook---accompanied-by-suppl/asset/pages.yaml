- pgno: 56
  md: '# 10 Change the System Date and Time Settings


    +   1 View Month


    To view the current date in the context of the current month, select the Clock
    (showing the current date and time on the top panel). To close the month view,
    select the Clock a second time.


    +   2 Open Clock Preferences


    Right-click on the date and then select Preferences from the shortcut menu that
    appears. This opens the Clock Preferences dialog.


    +   3 Change Clock Preferences


    Select the Clock Type drop-down box to select either a 12, 24 hour, UNIX time
    (the seconds that have elapsed since January 1, 1970; this is used primarily by
    developers), or Internet time (a universal reference used all over the world)
    for the clock. To show seconds on the clock, select the Show Seconds check box.
    To change the clock to UTC (Universal Coordinated Time or Greenwich Mean Time),
    select the UTC check box. When you have completed editing the preferences, click
    Close.


    +   4 Change Date and Time Settings


    Right-click on the date and time and then select Adjust Date and Time from the
    shortcut menu. The Run as Root dialog box appears.


    +   5 Enter the Root Password


    Type the root password in the Password box and then click OK. The YaST window
    opens the Clock and Time Zone Configuration.


    +   6 Edit Date and Time Settings in YaST


    In the Region select your region. The appropriate region. To change the date or
    time, select the Change Time or Date button. The Change System Date and Time dialog
    opens. Enter the correct time in the Current Time boxes and enters the correct
    date in the Current Date boxes (the correct format for each entry is provided).
    After entering the time and date information, click Apply. This returns you to
    YaST. If you want to change the hardware clock setting to local (the default is
    UTC), click the Hardware Clock Set To-drop-down box and select Local Time. After
    changing the clock settings in YaST, click Accept. YaST writes a new configuration
    file and then closes, returning you to the NLD desktop.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# CHAPTER 3: Working on the NLD Desktop


    # NOTE


    If NLD is the operating system installed on your computer, go with the default
    hardware clock setting, which is UTC. If you have a computer that is configured
    for a dual boot situation and also has Microsoft Windows installed on the computer,
    use local time as your hardware clock setting.


    # 11 Get Help on the GNOME Desktop


    Although the GNOME desktop is easy to navigate, there may be times when you need
    some extra help. You can quickly access the Novell''s GNOME User''s Manual from
    the desktop. The user manual provides basic information on GNOME and provides
    a section to make it easier for Windows users to switch to the GNOME desktop.


    The manual also provides information on specific applications such as Firefox,
    Evolution, iFolder, and the OpenOffice.org site. Additional information is provided
    on managing printers, and is on administrative tasks and in a command shell (entering
    commands at the command line). You can access Help content using the content links
    in the Navigation Area (the left frame), or you can search for content by performing
    either a simple search or a more complex search on the Search bar.


    +   Open the Help Center


    Select the Help menu on the top panel and then select User''s Manual. The Help
    Center opens on the desktop. You can maximize the Help Center; select the Maximize
    button on the left side of the window.


    +   Select Content Topics


    The Help Center consists of two areas: a navigation area, which lists topics,
    and a view window, which shows the information contained in the selected topic.
    To view a particular topic found in the navigation area (when the Contents tab
    is selected), select that topic. To view specific information related to the selected
    topic, select a link in the view window (the right pane of the Help Center).


    # TIP


    To enlarge the font text in the View window, select the Increase Font Size on
    the toolbar (Decrease Font Sizes decreases the text size). To go back to a previous
    topic page, click the Back button. If you want to print a topic, click the Print
    button on the toolbar.'
  merge: -1
  img_proc: true
