- pgno: 182
  md: '# View Package Groups


    To view the software packages by group, click the Filter list and select Package
    Groups. Expand a particular group listing. To view the information about a particular
    package, select that package in the list.


    Installed packages are marked with a check mark. Uninstalled packages have an
    empty check box.


    To quickly check whether the dependencies for a particular package are met installing,
    select the Check Dependencies button. A message box opens and tells you whether
    all dependencies are met. If you want to autocheck dependencies, select the Autocheck
    button at the bottom of the YaST window.


    # Select or Deselect Package


    To remove a package from installation, click the check box for that package until
    a trash icon appears, marking the package for deletion. To include a package for
    installation, select the empty check box (this places a check mark in the box).


    You can add packages as needed, but I would caution you in terms of removing packages.
    Remember the importance of dependencies. Removing one package could disable other
    packages on the system.


    # Complete Installation or Removal


    When you are ready to complete the process, click the Accept button. The packages
    are installed (or uninstalled), and you are returned to the YaST Control Center.


    Make sure that you place the appropriate installation or update CD (or DVD) in
    the CD (or DVD) drive you used for the NLD installation. If you do not have the
    appropriate CD in the drive, you are prompted for the correct one.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# CHAPTER 7: Adding and Managing Software Applications and Tools in NLD


    # NOTE


    The YaST Add and Remove Software module also allows you to mark installed packages
    for update. Right-click on the check box for the package and select Update. For
    packages that you have installed in the past and then removed because they didn''t
    work correctly or caused system problems, you can mark them as taboo (meaning
    don''t install!). Right-click on the package''s check box and select Taboo—Never
    Install.


    # 66 About Installing Applications from Other Archive Types


    +   ✓ BEFORE YOU BEGIN


    +   55 Archive Files with File Roller

    62 About RPMs


    As you become more comfortable with NLD and its various applications and tools,
    you may find yourself on the lookout for new applications and applets that serve
    specific purposes (okay, so it might even be a game that you are dying to play).


    We have already discussed how you can add RPM software packages to your NLD installation
    either through channels or by downloading packages from a website. However, there
    may be occasions when you find a program that you want to install and it is available
    only in another file archive type, the most common being the compressed tar file:
    tar.gz.


    Installing tar.gz files to your system is a little more difficult than RPMs. The
    first thing you should do after you download the file use Nautilus to locate the
    downloaded package. If you double-click on the package, File Roller opens, and
    you can view the package contents.


    You are looking for an Install or readme text file in the package contents. You
    can double-click to open the installation or readme file to get information on
    how you install the package. This is a multistep process because the program must
    be compiled and run to install the package. Here is a quick runthrough of the
    process, but the final steps depend on the package you are dealing with.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# About Installing Applications from Other Archive Types


    You can view the files in the tar archive using File Roller.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_184_0.png)


    After you create a new folder to hold the files and open the package in File Roller,
    you can extract the package to a folder using File Roller. Select all the files
    in the package and select **Extract**. A specific folder may be created for the
    package files when you extract the files.


    After the files are in a folder, you should read and print out the install text
    file with the package. Now comes the hard part.


    # NOTE


    Installing tar packages is tricky. In many cases you need a C compiler installed
    on your system. Use Red Carpet to install the GCC compiler on your system. Also
    make sure that the following are installed on your system: make and automate.
    These are both development tools that can be installed using YaST from your installation
    CDs. You may want to install other development tools as needed.


    Open a terminal window. Type **su** at the command prompt and enter the root password.
    You have to be logged in as root in the terminal window to install software. Use
    the **cd** (change directory) command to navigate to the folder that holds the
    files for the package.


    Type **./configure** at the command prompt and press **Enter**. This configures
    the package for your system. Now you can compile the package.


    Type **make** and then press **Enter**. This compiles the installation for the
    software. Now you can type **make install** and press **Enter**. This installs
    the software.


    You should now be able to run the program from the Run Program window. If the
    program works, you can add it to a menu or panel.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Don''t be upset if this process doesn''t work the first time. You may need
    to do a little research on the software that you are trying to install because
    some packages require more than just the `configure`, `make`, and `make install`
    commands. In some cases, you may have downloaded a bad archive package.


    As a final word related to software installation, it makes sense to use RPMs that
    have been specifically designed for NLD. When dealing with tarballs, do not install
    from a tarball unless you are absolutely sure that you need a program that is
    available only as a tar.gz file (and is not available as an RPM). I would also
    suggest that you do not install a file that doesn''t have a support website or
    hasn''t had a revision for some time. Be sure that you know from where the files
    you install come, and what impact they will have on your system.'
  merge: -1
  img_proc: true
