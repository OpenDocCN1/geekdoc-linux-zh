- pgno: 389
  md: '# CHAPTER 15: Staying Organized with Novell Evolution


    # 3 Add Contacts


    In the Select Contacts from Address Book dialog box, select a contact from the
    list and add them to the meeting by clicking the appropriate button: Chair Persons,
    Required Participants, and so on. After you have finished adding contacts, click
    OK to return to the Appointment dialog box.


    # 4 Configure Scheduling Options


    Select the Scheduling tab. Use the drop-down lists to set the date and the start
    and end times for the meeting. You can drag the bracketed time block on the Time/Date
    pane to set the time and date. You can also quickly add additional contacts by
    selecting the Contacts button.


    TIP


    You can add an attendee to the Attendee list by typing in the person''s email
    address. This allows you to add participants who do not have in your address book.


    TIP


    On a corporate network that allows users to share calendar data, you can quickly
    select a time for a meeting that will avoid all conflicts. After entering all
    the participants for the meeting, select (on the Scheduling tab) the AutoPick
    button''s drop-down arrow and then select an option such as All People and Resources
    or Required People.


    # 5 Complete Meeting Configuration


    Select the Appointment tab of the new meeting. Enter a summary, location, and
    a description (as needed). You can also set an alarm (for you) for the meeting;
    select the Alarm check box and then set the time for the reminder. After you have
    entered the information (and checked the date and time for the meeting), click
    OK. An Evolution query opens.


    # 6 Send Meeting Invitations


    Evolution asks whether you want to send the meeting invitations to the participants.
    Click OK to close the query box and send the invitations. The invitations require
    a response from all invitees.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# NOTE


    The invitation email that is received by your invitees makes it easy for a potential
    attendee to respond. The email provides a series of buttons at the top of the
    message such as Accept, Decline, and Propose New Time. Responses to your invitation
    appear in your Evolution Inbox. The response email that you receive has a "slick"
    Update Respondent Status allows you to quickly change the status of that respondent
    on the actual meeting dialog box (on the Scheduling tab); all you do is click
    the Update Respondent Status button in the email message.


    # Manage Appointments and Meetings


    The Evolution calendar makes it easy for you to manage your appointments and meetings.
    Days that hold appointments appear in bold on the month calendars shown in the
    Calendar pane. You can easily move an appointment or meeting to a new time and
    date. Appointments can also be edited as needed. You can also respond to meeting
    requests that will place a new meeting appointment on your calendar when you accept
    a meeting invitation.


    +   1 Select Calendars to View


    In the Calendar view, select or deselect calendars in the Calendar list as needed
    (select or deselect the appropriate check boxes). Appointments and meetings only
    show on the current day for the calendars currently selected.


    +   2 Open Existing Appointment


    Double-click an existing appointment on the currently selected day. The appointment''s
    dialog box opens.


    +   3 Edit Appointment


    Edit the appointment as needed (including date and time) and then click OK to
    close the appointment.


    # TIP


    You can move appointments from one of your calendars to any of your other calendars.
    Right-click an appointment and select Move to Calendar. The Select Destination
    dialog box opens. Select the calendar that will serve as the destination for the
    appointment and then click OK. Moving an appointment to a different calendar does
    not change the time or date of the appointment. It does change the color coding
    of the appointment based on the calendar that served the destination.'
  merge: -1
  img_proc: true
