- pgno: 176
  md: 'RPM files can be downloaded from the Web and then installed to your system
    from a Nautilus window. All you have to do is download the file to a folder on
    your computer. Then locate the downloaded file using Nautilus.

    Locate the downloaded RPM using Nautilus.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_176_0.png)


    # WEB RESOURCE


    http://www.linux.org


    This website is a good place to begin your search for Linux software not available
    through your NLD subscription channels (and Red Carpet). This site provides a
    listing of software by category (such as Games). You can read about a particular
    program before downloading. Remember that you will want to look up the license
    type for these files because not all are GPL or GNU (meaning open source). Try
    to find an RPM compatible with NLD. Generally, RPMs designed for SUSE Linux Professional
    will work with NLD.


    When you double-click on the file, you are asked to provide the root password.
