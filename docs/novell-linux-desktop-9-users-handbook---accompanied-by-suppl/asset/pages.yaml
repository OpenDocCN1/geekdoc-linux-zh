- pgno: 62
  md: '# Access the Command Line


    BEFORE YOU BEGIN SEE ALSO 12 Run a Program from the Run Application Dialog 14
    About File Commands 15 Use File Commands 16 About System Commands 17 Use System
    Commands


    Although GNOME provides easy access to applications and applets using the menu
    system and there may be occasions when you need to access a command shell and
    work at the command line. The information provided here is not a comprehensive
    look at the command shell or the various commands that can be run at the command
    line but is a primer to provide you with an overview of the command shell.


    # NOTE


    Shell commands consist of an actual command and optional switches, which allow
    for certain options with a particular command. After typing a command and any
    accompanying switches, press Enter to invoke the command.


    In NLD the default terminal or shell program is GNOME Terminal. This terminal
    allows you to work at the command line without leaving the NLD desktop. Most shell
    commands come in two flavors: commands that provide an immediate response, such
    as the `ls` command, which provides a list of files in the current folder, and
    shell commands that start a particular command-line utility. For example, the
    `passwd` command starts a utility that walks you through the process of changing
    your user password.


    # NOTE


    You may wonder why you should even consider working with shell commands when GNOME
    provides desktop utilities and tools that take care of most of your day-to-day
    needs in managing files. It is a good idea to know a few file and system commands
    and to be aware of the capabilities of the command shell, particularly if you
    decide to expand your knowledge of the Linux system over time (from user to "better").'
  merge: -1
  img_proc: true
