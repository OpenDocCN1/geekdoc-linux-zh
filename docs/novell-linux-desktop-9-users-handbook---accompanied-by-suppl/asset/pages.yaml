- pgno: 155
  md: '# CHAPTER 6: Managing Files


    # 3 Browse Files on USB


    The USB drive window opens. You can browse the files and folders on the USB drive
    as needed. You can open another File Manager window if you want to copy or move
    files from the USB drive.


    # 4 Close USB Drive Window


    After you have finished working with the files and folders on the USB drive, select
    the Close button to close the window.


    TIP


    If you close the USB drive''s Nautilus window, you can reopen it at any time.
    Open the Computer window (double-click on the Computer icon on the desktop) and
    then open the Filesystem. Open the /media folder, and the USB drive appears as
    an icon. Double-click the icon to open the drive.


    # 53 Burn Files on a CD or DVD


    You can burn folders and files to a CD or DVD (depending on the drive types installed
    on your computer) using the K3b burning software. You can create data CDs (or
    DVDs), create music CDs, or copy a CD. Now here''s the bad news: Linux systems
    are up to protect direct access to devices other than the root account. So, you
    can log on as root, burn your CDs or DVDs, and then log off; no questions asked.


    If you want to configure your system so that a "regular" user can access the burn
    drives and configure K3b so that it works correctly (and its core executables
    such as لديك have proper access), you are talking about several tweaks and changes
    to file attributes and configuration files.


    Commands as chown and chmod are involved, and you have to do a fair amount of
    work at the command line as the root user to get things working properly. Going
    through all the possibilities is certainly beyond the scope of this book, and
    applying the "fixes" incorrectly can have dire consequences for your system. If
    you really have NLD administration in mind, you might want to consult NLD and
    Linux administration books such as Emmett Delaney''s Novell Linux Desktop 9 Administrator''s
    Handbook (as well as some of his other publications).'
  merge: -1
  img_proc: true
