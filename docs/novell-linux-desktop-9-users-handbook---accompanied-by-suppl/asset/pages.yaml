- pgno: 260
  md: '# 100 Format Paragraphs


    To change font color and add attributes such as underlining, select the Font Effects
    tab. This tab also provides character effects such as all capitals and embossing.


    To make the selected text superscript or subscript, select the Position tab and
    select the appropriate options. On this tab, you can also change the spacing for
    the selected text and rotate text.


    To add a background to the selected text, select the Background tab. Select a
    color for the background. When you have finished working in the Character dialog
    box, click OK.


    # Format Paragraphs


    You can change paragraph formatting using buttons on the Object bar, such as the
    alignment buttons—Align Left, Centered, and Align Right. You can also increase
    and decrease the indent for the paragraph. To control paragraph attributes such
    as line spacing, numbering attributes, and border formats, you need to access
    the Paragraph dialog box.


    > BEFORE YOU BEGIN


    97 About OpenOffice.org Writer


    # Select Paragraph


    Select the paragraphs that you want to format in the document (if you are formatting
    only one paragraph, place the cursor in that paragraph). You want to format all
    the paragraphs in the document, select Edit, Select All.


    # Select Paragraph Formating


    To change the paragraph formatting for the selection, select a button on the Object
    bar such as the Increase Indent button (or an attribute as a numbered or bulleted
    list).


    NOTE


    We normally think of paragraphs as several sentences, but every line followed
    by a line break (the Enter key) is really a paragraph in terms of formatting attributes
    particularly when you use the numbered or bulleted list formats.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# CHAPTER 11: Creating Documents with OpenOffice.Writer


    ![](img/6e85ebc4ce06a64c82109523b60183ba_261_0.png)


    # 1 Select Paragraph


    # 2 Select Paragraph Formatting


    # 4 Set Paragraph Attributes


    # 3 Open Paragraph Dialog


    # 100 Format Paragraphs


    # 3 Open Paragraph Dialog


    To access additional paragraph formatting attributes, you need to open the Paragraph
    dialog box. Select **Format, Paragraph**. The Paragraph dialog opens.


    # 4 Set Paragraph Attributes


    On the Indents & Spacing tab set the indent, spacing before and after, and the
    line spacing for the paragraph as needed.


    Select the **Alignment** tab. Set the alignment for the selected paragraph (or
    paragraphs) by selecting the **Left, Right, Center,** or **Justified** option
    buttons.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'The Numbering tab allows you to control the numbering in your numbered lists.
    You can choose to start at a certain number or restart a numbered list with the
    current paragraph.


    To set border options for the paragraph or paragraphs, select the Borders tab.
    Select one of the line arrangements to enable borders or use the userdefined grid
    to specify your own line arrangement (click in the grid to place a line). Use
    the Style list to select a style for the border. To set a color for the border
    lines use the Color drop-down list. When you have finished selecting your paragraph
    formatting settings, click OK.


    You can set tabs for the selected paragraph or paragraphs on the Tabs tab of the
    Paragraph dialog box. However, it is easier to create tabs directly on the Writer
    ruler.With a paragraph or paragraphs selected, select the tab type on the far
    left of the ruler (the default tab is Left) and then click on the ruler at the
    position where you want to place the tab. Every paragraph (meaning every line
    followed by a line break) can have its own unique tab settings.


    # About Writer Styles


    When you are working with a document that requires you to use the same set of
    character or paragraph formatting attributes on text throughout the document,
    you will want to take advantage of styles. A style is a grouping of formatting
    attributes identified by a style name.


    Style—A collection of formatting attributes that have been saved under a style
    name.


    For example, you may be formatting a number of headings that use the same font
    size, color, and alignment (perhaps all the headings are centered). You can create
    a style (a paragraph style) that contains these formatting elements and assign
    it to your various headings as needed.


    Writer styles are cataloged and assigned using the Stylist. The Stylist allows
    you to quickly switch between style types and add new styles as needed. So, you
    can take advantage of a number of premade styles, and you can create your own
    styles.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# CHAPTER 11: Creating Documents with OpenOffice.org Writer


    Two of the most commonly used styles are character and paragraph styles. A character
    style is used to assign formatting attributes to a word. For example, you might
    want to bold and italicize terms that show up in a document. All you have to do
    is click on the word and then assign the character style from the Stylist.


    # KEY TERM


    **Character style**—A collection of saved character formatting attributes used
    to format words in a document.


    # KEY TERM


    **Paragraph style**—A collection of both character and paragraph formatting attributes
    that have been saved under a style name.


    Paragraph styles allow you to combine paragraph attributes, such as alignment,
    and character formatting attributes. You can then assign the style to an entire
    paragraph of text by clicking inside the paragraph and selecting the style from
    the Stylist.


    The great thing about styles is that you can assign them as needed. And if you
    decide that you don''t like the way the particular style looks in the document,
    you can edit the style and change the formatting attributes it assigns to. All
    the text that was previously assigned the style will be updated to the edited
    version of the style. Bottom line: Styles save you a lot of time when you are
    creating documents that use a lot of formatting.


    # NOTE


    Writer also provides additional style types other than character and paragraph
    styles. There are frame styles (used for different types of frames depending on
    the object inside a frame), page styles (a first page style can be used to format
    a first page without headers and footers in the rest of the document), and numbering
    styles (can be used to format numbered lists with different looks).'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Use the Stylist


    # 102 Use the Stylist


    The Stylist provides a number of predefined styles including character and paragraph
    styles. The Stylist can be opened by selecting the Stylist button on the Function
    bar.


    +   BEFORE YOU BEGIN

    101 About Writer Styles


    # Open Stylist


    Select the Stylist button on the Function bar to open the Stylist.


    TIP


    You can dock the Stylist. Hold down the Ctrl key and drag the Stylist to the left
    side of the Writer window. The Stylist will be docked to the left of the Main
    tool-bar. To undo the Stylist hold down the Ctrl key and drag the Stylist (by
    the top of the Stylist pane) back onto the Writer application window.


    # Select Word or Paragraph


    Place the cursor (click the I-beam) in the word or paragraph that you will assign
    the style to. To assign a style to multiple words or paragraphs select the words
    or paragraph.


    # Assign Style


    Double-click a style in the Stylist to assign it to the text or paragraph.


    TIP


    Use the buttons on the top left of the Stylist to switch between the different
    types of styles available such as character and paragraph.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# CHAPTER 11: Creating Documents with OpenOffice.Writer


    ![](img/6e85ebc4ce06a64c82109523b60183ba_265_0.png)


    # 103 Create a Paragraph Style


    You can create your own styles, which are added to the Stylist for easy access.
    Styles can quickly be created by formatting text or paragraphs and then creating
    a new style based on the current formatting of selected text or paragraphs.


    Paragraph styles, which are often the most useful style to create, can contain
    both font attributes and paragraph attributes such as alignment. So, you can create
    your own heading styles or special paragraph styles and then apply them as needed.


    +   - BEFORE YOU BEGIN


    +   - 101 About Writer Styles


    +   - 102 Use the Stylist


    # 1 Format Paragraph


    Format a paragraph with character and paragraph formatting attributes as needed.'
  merge: -1
