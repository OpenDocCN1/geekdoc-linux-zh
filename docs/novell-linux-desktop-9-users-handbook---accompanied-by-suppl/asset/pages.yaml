    +   6 Use Tabbed Browsing


    Firefox provides you with the ability to open websites in tabbed windows. This
    means that you can have several websites open at the same time and switch between
    the sites using the various tabs. This makes browsing multiple sites much easier
    than the alternative of having to open a new window for each site.


