- pgno: 349
  md: '# CHAPTER 14: Managing Email and Contacts with Novell Evolution


    If you used a previous email, contacts, and calendar manager, you will find that
    Evolution provides tools that you can use to import information saved in other
    groupware applications and email clients. So, you can hit the ground running in
    terms of responding to email and managing your contacts and calendar.


    # Add an Email Account to Evolution


    +   - BEFORE YOU BEGIN

    - Configure an Email Client


    The first time you start Evolution you are walked through the process of configuring
    the settings for your email account. Evolution can serve as the email client for
    both corporate email accounts and Internet-only email accounts and can be the
    client for multiple email accounts.


    Because your first email account is configured during the initial setup of Evolution
    (the first time you start the software), this task allows adding additional email
    accounts (no matter the type of account). You can easily add a new email account
    at any time on an as-needed basis.


    # Start Evolution


    Select Programs, Novell Evolution from the menu. The Evolution window opens on
    the desktop.


    > TIP

    You can also start Evolution by selecting the Evolution icon on the desktop''s
    top panel.


    # Open Evolution Settings Dialog


    To add an email account to the Evolution configuration, select Tools, Settings.
    The Evolution Settings dialog box opens.


    # Open Evolution Account Assistant


    In the Evolution Settings dialog box, make sure that the Mail Accounts icon is
    selected and then select Add. The Evolution Account Assistant opens. Select Forward
    to bypass the introductory screen.'
