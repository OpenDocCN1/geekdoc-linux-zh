- pgno: 219
  md: '# CHAPTER 9: Using Other Internet Tools


    # 2 Enter Identity Information


    On the Identify Information screen enter your name and email address. You can
    also enter optional reply to company information that will be included on all
    your sent emails. After entering the information, select Forward.


    # 3 Enter Receiving Mail Information


    The next screen requires that you enter information related to receiving mail.
    Select the Server Type drop-down box and select the type of server that you use
    to receive mail (POP, IMAP, and so on). You also need to enter the hostname for
    the server (the domain name such as pop-server.mail.com or variation) in the Host
    box and your user-name in the Username box (this will be the name that precedes
    the @ on your email account).


    To select the authentication type, use the Authentication Type drop-down box.
    In most cases (particularly for Internet email), this selection will be Password.
    After entering the appropriate information select Forward to continue.


    > NOTE

    When you configure the Receiving Mail options for your email account, there is
    an optional Security drop-down box. This drop-down box allows you to select whether
    a secure connection should be used when you connect to your post office mail server.
    You can select: Always, Whenever Possible, or Never from the drop-down list. Because
    your account information and password are sent to the mail server, when you connect
    to receive mail, you may want to take advantage of a secure connection (which
    makes it more difficult for someone snooping on the network to capture your account
    information).Check with your network administrator or Internet service provider
    to determine whether you can configure your email account to take advantage of
    this security feature.


    > TIP

    You won''t actually enter your email account password until you send email for
    the first time from Evolution. If you want Evolution to remember the password
    (after you enter it), select the Remember Password check box.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Select Receiving Mail Options


    On the next screen select the **Automatically Check for New Mail** check box if
    you want to have Evolution periodically check for new mail. Use the minute''s
    spinner box to set the time frame for the automatic checks. Select **Forward**
    to continue.


    # Enter Sending Mail Information


    On the next screen you enter information related to sending mail. Select the **Server
    Type** drop-down list to select the server type for sending mail (SMTP being the
    most likely). In the Host box type the name of the server (such as `smtp-server.mail.company.com`;
    this is information you need from your network administrator or ISP). After entering
    the information, select **Forward** to continue.


    # NOTE


    In some cases servers for sending mail will require password authentication for
    you to connect. Parameters for authentication can be set on the Sending Mail screen
    of the Evolution Setup Assistant. This is information that you must get from your
    network administrator or Internet service provider.


    # Enter Account Name


    On the next screen enter the name that you want to use to refer to this account.
    This name is up to you and should be descriptive, particularly in cases where
    you have multiple accounts. Type the name in the Name box and select **Forward**
    to continue.


    # Enter Time Zone


    On the next screen you enter your time zone. Select the **Selection** drop-down
    list and choose your time zone. Select **Forward** to continue.


    # Apply Email Configuration


    You have entered all the information necessary to configure an email account.
    Select **Apply**. The Assistant window closes, and Evolution opens. You can close
    Evolution by selecting the **Close** button.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# CHAPTER 9: Using Other Internet Tools


    # 82 About Instant Messaging


    Instant messaging is becoming one of the most popular communication platforms
    on the Internet. It allows real-time messaging between individuals and groups
    of individuals.


    Instant messaging is not brand new to the Internet, however. As early as the 1980s
    Internet Relay Chat (IRC) has been available on the Internet and provides a venue
    where users can conduct conversations on a predetermined channel. IRC does not
    provide the privacy that newer instant messaging platforms provide when you talk
    to a single individual.


    A number of IM platforms and client software packages are available for use on
    the Internet. These are AOL Instant Messenger, MSN (Microsoft), ICQ, and Jabber.
    All these platforms function similarly. You use client software to determine whether
    "buddy" is online and then you can chat with him using a text window. Some IM
    platforms now provide support for voice and video communication and provide the
    capability to transfer files between users.


    NLD provides the Gaim Instant Messenger (preinstalled on your system), which is
    an open source IM client that can be used for AOL, MSN, ICQ, Jabber, Yahoo, and
    other IM accounts. To use Gaim you must have already signed up for an account
    on the platform you want to use. For example, if you are going to use Gaim for
    AOL Instant Messenger, you need to have an AOL IM account.


    # WEB RESOURCE


    +   AOL IM:www.aol.com

    ICQ IM: www.icq.com

    MSN IM: www.msn.com

    Yahoo IM: www.yahoo.com

    Jabber IM: www.jabber.com


    You need an IM account to use Gaim for instant messaging. Check out these websites
    to establish an account.


    # NOTE


    Jabber is both an open source and a proprietary IM platform. An open source server
    and open source clients can be used to configure a Jabber communication network
    either on a corporate network or on the Internet. Mention Jabber to your network
    administrator if you want to earn a few points. It has a lot of possibilities
    for inexpensive and secure real-time communication within a corporation. Check
    out http://www.jabber.org for more information.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Configure Gaim Instant Messenger


    Gaim is a multiplatform IM client. You need to have an IM account (or accounts)
    prior to configuring and using Gaim.


    # Open Gaim


    From the NLD desktop, select Programs, Internet, Instant Messenger. The Gaim Login
    and Accounts window opens.


    # Open Add Account Dialog


    In the Accounts window (which is empty), select the Add button. The Add Account
    dialog box opens.


    TIP


    If you have more than one IM account (on different platforms), you can add multiple
    accounts to the Gaim configuration.


    # Add Account Information


    You can now add your IM account information. Select the Protocol dropdown list
    to select the IM protocol (AIM/ICQ, Jabber, Yahoo, and so on). Enter your screen
    name, password, and alias in the appropriate box. If you want to have Gaim remember
    the password select the Remember Password check box.


    TIP


    You can also configure Gaim to auto-login to your IM account when you start Gaim.
    Select the Auto-login check box when you configure the IM account. To keep your
    Gaim session open as you work on your desktop (without the Gaim window open),
    select the Preferences button in the Gaim window. In the Preferences dialog box,
    select Plugins and then select the System Tray icon. Select the Hide New Messages
    Until Tray Icon Is Clicked check box.


    # Save Account


    After you have added your account information, select the Save button. If you
    are returned to the Gaim Login and Accounts windows. If you do not need to enter
    any additional accounts, close the Accounts window.'
  merge: -1
  img_proc: true
