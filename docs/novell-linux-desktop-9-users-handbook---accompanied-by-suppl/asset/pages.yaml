    You can then run the newly installed program from a Run Application window (select
    System, Run Program). All you need to do is type the name of the application in
    the window and press Enter. You can also add the application to the Programs menu
    for easy access.


    # NOTE


    It is certainly not required that you spend a lot of time searching for new software
    packages on the Web. Your subscribed channels will provide you with most of the
    software that you need (using Red Carpet). However, on occasion you may need to
    look elsewhere for something special. Be advised that even software listed on
    high-profile Linux websites such as linux.org isn''t always available. Many of
    the links dry up over time (the sites don''t exist anymore). Remember that most'
