- pgno: 257
  md: '# Select Layout


    On the first AutoPilot screen select a layout for the new document (in this case
    a memo). Use the drop-down list to select a title for your memo (you can also
    use a graphic as the title). Then select Next to continue.


    # Select Elements


    On the next screen select the elements that you want to include in the document.
    Use the check boxes as needed. Then click Next to continue.


    # TIP


    The AutoPilot documents take advantage of the personal information that you entered
    in the OpenOffice.org global settings. To enter your name and other information,
    go to the Options dialog box (select Tools, Options). Enter your information under
    User Data.


    # Select Header and Footer Elements


    On the next screen select the elements that you want to include in the header
    and footer of the document (the memo). Select check boxes as needed. Then click
    Next to continue.


    # Enter Document Information


    Enter the document information such as title and subject. Check the Automatic
    check box to save the file using the title information. You can choose a destination
    for the file using the Destination button. Click Next to continue.


    # Create Document


    The last screen provided by the AutoPilot appears. Click Create to create the
    document. The document appears in the Writer window including the various elements
    that you selected during the AutoPilot process. Additional text to be entered
    will be marked by placeholder text. Select the placeholder text and type the required
    text (such as the body of the memo) to complete the document.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 99 Format Characters


    TIP


    Remember to save your document by selecting the Save Document button on the Function
    bar.


    # 99 Format Characters


    Formatting text characters can be done on-the-fly as you type or edit using the
    font formatting commands on the Object bar. You can also change character formatting
    attributes in the Character dialog box.


    +   BEFORE YOU BEGIN


    +   97 About OpenOffice.org Writer


    # Select Text


    Select the text that you want to format in the document. Click and drag to select
    text, double-click to select words, or triple-click to select lines.


    TIP


    You can toggle the various font attributes on the Object bar on and off as needed
    as you type, if you want. Typically, it is almost faster to format the text after
    the fact, after you have typed your rough draft.


    # Select Font Attributes from Object Bar


    After the text is selected, select a character formatting attribute from the Object
    bar such as Font, Bold, Italics, and so on. You can also use the Font Color button
    to change the font color.


    TIP


    Place the mouse on any button on the Object bar for a tip related to that button.
    If you want to see more information, select Help, Extended Tips. This provides
    more detailed tips for the various toolbar buttons.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# CHAPTER 11: Creating Documents with OpenOffice.Writer


    ![](img/6e85ebc4ce06a64c82109523b60183ba_259_0.png)


    # Open Character Dialog


    To access to all the font attribute and alignment possibilities for selected text
    you can use the Character dialog box; select Format, Character. The Character
    dialog box opens.


    # Select Character Attributes in Character Dialog


    In the Character dialog box, set character attributes such as font, size, and
    typeface on the Font tab.'
  merge: -1
