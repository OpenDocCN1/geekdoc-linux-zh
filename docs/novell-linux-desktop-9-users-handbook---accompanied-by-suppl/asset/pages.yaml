- pgno: 379
  md: '# CHAPTER 14: Managing Email and Contacts with Novell Evolution


    ![](img/6e85ebc4ce06a64c82109523b60183ba_379_0.png)


    # Open the Evolution Import Assistant


    In the Evolution window select File, Import. To begin the import process, select
    Forward on the initial Import Assistant screen.


    # Select Importer Type


    On the next screen select the type of import that you want to perform: Import
    Data and Settings from Older Program or Import a Single File.


    If you select Import Data and Settings from Older Program, select Forward, and
    Evolution scans your system for address book, email, and calendar files created
    in other Linux software applications. When the files are ready to import, you
    can select the Import button (and skip steps 4 and 5).


    364'
  merge: -1
  img_proc: true
- pgno: 380
  md: '160 Import Contacts


    If you select Import a Single File, select Forward to continue the process.


    # 3 Select File


    On the next screen enter the file that you want to import. You can use the Browse
    button to locate the file. After specifying the file, select Forward to continue.


    # 4 Select Import Location


    On the next screen specify the location for the import. Because you are importing
    “personal” information, you will, in almost all cases, select Personal (On This
    Computer). Select Forward to continue.


    # 5 Import File


    Select the Import button. The information (contacts, email messages, appointments—depending
    on the contents of the import file) is added to the appropriate folder in Evolution.


    > TIP

    If have been using Microsoft Outlook as your groupware software, you need to download
    an open source tool called Outport to help you save your contact, email, or calendar
    information for import into Evolution. The Outport open source software is available
    for download to a Microsoft Windows system using the URL http://www.outport.sourceforge.net.
    The website provides all the information that you need to download Outport and
    then prepare your Outlook information for import into Evolution.


    > TIP

    You can also quickly start a new contact based on a mail or calendar entry. This
    isn''t really an import, but it does allow you to start a new contact based on
    information that you have received. Just right-click on an email address or email
    message in the Inbox or other mail folder and then select Add Sender to Contacts
    on the shortcut menu. This creates a new address card that can then be edited
    as needed.


    365'
  merge: -1
  img_proc: true
