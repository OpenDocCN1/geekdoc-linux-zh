- pgno: 278
  md: '# Select Frame Type


    On the Type tab select the anchor type for the frame (To Page, To Paragraph, To
    Character, and so on). You can also change the vertical and horizontal position
    of the frame on the Type tab.


    You can also format the frame for borders, backgrounds, and columns in the Frame
    dialog box. Select a tab (such as Background) and then select the properties you
    want to apply to the frame.


    # Set Frame Wrap Properties


    To change how the document wraps in relation to the frame, select the Wrap tab.
    Select one of the wrap settings: None, Before, After, Parallel, Through, or Optimal.
    You can also control the spacing around the frame using the Spacing spinner boxes.
    After you have finished working in the Frame dialog box, click OK to return to
    the document.


    You can also insert floating frames into a document; select Insert, Floating Frame.
    A floating frame can contain any type of object: a picture, another document;
    it is up to you. Floating frames can be dragged to any position on the page.


    # Place Graphics in a Document


    Images that you place in your documents can be informational (such as a picture
    of a house that you are writing about) or can be used as publishing elements that
    just add interest to the document. You can add graphics to your documents from
    files (meaning image files on your computer) or directly from a scanner attached
    to your computer.


    # Open Insert Graphics Dialog


    Select Insert, Graphics, From File from the menu. The Insert Graphic dialog box
    opens.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# CHAPTER 11: Creating Documents with OpenOffice.Writer


    # 1 Open Insert Graphics Dialog


    ![](img/6e85ebc4ce06a64c82109523b60183ba_279_0.png)


    # 2 Insert Graphic


    # 3 Size Graphic


    # 4 Open Graphics Dialog


    # 5 Set Graphic Properties and Crop Image


    109 Place Graphics in a Document


    # TIP


    You can also draw your images for your documents within the Writer application.
    Select the Show Draw Functions button on the Main toolbar, and the Object bar
    shows the various drawing tools available (replacing the formatting buttons normally
    shown on the Object bar). Use the tools as needed.


    264'
