- pgno: 253
  md: 'The most frequently used application on any system would have to be the word
    processor. In this chapter we take a closer look at OpenOffice.org Writer. Writer
    is a complete document processor and desktop publishing application that makes
    it easy to create a variety of document types.


    # About OpenOffice.org Writer


    Writer provides all the features and tools that you would expect from a word processing
    application. You can add headers/footers to documents, insert tables, insert frames
    that hold a variety of objects, and merge addresses with form letters and labels.


    You can start Writer from the Programs menu (select Programs, Office, Word Processor).
    You can also start Writer from the Word Processor icon on the top panel.


    Writer''s command set is easily accessed from the menu system in the Writer application
    window. Writer also provides both default and optional toolbars that allow you
    to quickly access a particular feature. The default toolbars are


    +   - Function bar—This toolbar resides below the Function bar and by default
    provides access to commands such as New, Open File, and Print File Directly. It
    also provides access to specialized tools such as the Navigator (which allows
    you to quickly move to a specific place in a document such as a table or text
    frame) and the Stylist (which provides easy access to the styles in the current
    document).


    +   - Object bar—This toolbar resides below the Function bar and provides access
    to commands related to formatting as font, font size, alignment, and numbered
    and bulleted lists. When you select a button on the Main toolbar as Show Draw
    Functions, the formatting tools on the Object bar are replaced with a set of drawing
    tools.


    +   - Main toolbar—This toolbar is the vertical toolbar on the left of the Writer
    window. It provides quick access to a number of features including the Insert
    Table and Insert Object commands and the Spell Check feature.


    You can customize any of the toolbars. Right-click to the right of the Function
    bar or Object bar and select Customize from the shortcut menu. The Customize dialog
    box allows you to add or remove buttons from a selected toolbar.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'The Writer toolbars provide quick access to a number of commands and Writer
    features.


    # Function Bar Object Bar


    ![](img/6e85ebc4ce06a64c82109523b60183ba_254_0.png)


    # Main Toolbar


    You can customize the Writer toolbars.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_254_1.png)


    The best way to navigate a multipage document is with the Navigator. It allows
    you to quickly jump to a particular object in a document such as a heading, frame,
    table, or graphic. It also provides a page spinner box-that allows you you to
    move quickly to any page in the document. The Navigator is opened using the Navigator
    button on the Function bar.


    TIP


    You can also open the Navigator by selecting the Navigator button on the vertical
    scrollbar, which also provides Next Page and Previous Page buttons.'
  merge: -1
  img_proc: true
