- pgno: 363
  md: '# CHAPTER 14: Managing Email and Contacts with Novell Evolution


    # 151 Organize Your Email


    When you receive large numbers of email, it is certainly worth your while to keep
    these messages organized. You can add flags to emails to "tag" for future reference.
    For example, you can add the Call follow-up flag, which reminds you to call the
    sender of a particular message.


    You can also keep your email organized by moving incoming mail to folders that
    you create. For example, you may create a folder related to a certain project
    and then move all the email related to that project to the folder. You can move
    easily by dragging mail from one folder to another folder. Another way to get
    email into a specific folder is to use a filter. A filter uses criteria that you
    set to locate a message. The filter also includes instructions to what the filter
    should do with the message as move the message to a folder that you have specified.


    +   1 Open Create Folder Dialog


    If you are going to use filters to move mail to specific folders, create the folders
    as needed. Right-click on a folder such as Inbox and then select New Folder on
    the shortcut menu.


    +   2 Create Folder


    In the Create Folder dialog box, specify a name for the new folder and then select
    Create. The folder is added to the Folder list. Create other folders as needed.


    +   3 Open Filters Dialog


    Now you can create a filter (or filters as needed). Select Tools, Filters.


    +   4 Open Add Rule Dialog


    In the Filters dialog box, select Add to create a new filter rule. The Add Rule
    dialog box opens.'
  merge: -1
  img_proc: true
