- pgno: 169
  md: '# CHAPTER 7: Adding and Managing Software Applications and Tools in NLD


    After you become comfortable with the NLD environment, you will probably consider
    adding additional applications and applets to your system. You will also want
    to keep your NLD installation files up-to-date. NLD makes it easy for you to install
    and update software.


    In this chapter we explore different ways to update the software on your computer
    and add new software. We take a look at program archive types and become familiar
    with YaST and Red Carpet.


    # 59 About Updating and Adding Applications to NLD


    NLD provides two different GUI tools that make it easy for you to update programs,
    add software, remove software. YaST, the NLD administrative configuration tool,
    allows you to add and remove software from your NLD installation (add software
    using the NLD installation disks or updates) and also makes it easy for you to
    run a system and apply patches to your system.


    Three icons in the YaST window (when Software is selected in the left pane) are
    of particular interest:


    +   - Install and Remove Software—This tool allows you to view the software installed
    on your system from a particular installation CD or DVD. You can also use this
    tool to remove software from your system.


    +   - System Update—This tool allows you to connect to Novell''s servers and update
    your system software.


    +   - Patch CD Update—This tool allows you to install patches to your system from
    a patch CD or DVD.


    # KEY TERM


    A patch is a software update to a particular system or software file that resolves
    issues or tightens security.


    To access YaST you must know the root password. This makes sense because even
    though YaST makes it easy to add and remove or update software, there is always
    a level of risk involved in maintaining the integrity of your system. Think carefully
    before adding and removing software.


    Another tool that makes it easy to quickly update your NLD software and search
    for other software packages on the Novell software update servers is Red Carpet.
    Red Carpet provides a GUI where you can view available updates, view software
    installed on your system, and search for available unavailable software on the
    NLD update servers. To use Red Carpet you need to know the root password.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 59 About Updating and Adding Applications to NLD


    YaST provides easy access to software installation and system update tools.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_170_0.png)


    Red Carpet makes it easy to update your system from online software resources.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_170_1.png)


    # NOTE


    If you are running a free or "sample" version of NLD, you typically get updates
    for only a limited period of time. A "full-blown" version of NLD provides a much
    longer time frame for updating the system software, software applications, and
    applets. In either case, you must activate the updates for your system for Red
    Carpet to work properly.


    One other thing that we need to discuss before looking at Red Carpet and then
    YaST is the issue of dependencies. Let''s say you want to install program A, but
    there is a dependency for program B. This typically means that program B must
    also be installed on the system for program A to actually function after you install
    it. In some few cases, programs have negative dependencies, meaning you cannot
    install both the programs on the system if you want either one to run.


    155'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# CHAPTER 7: Adding and Managing Software Applications and Tools in NLD


    # KEY TERM


    Dependency—A necessary software module for a program to run on the Linux system.
    Linux applications and applets require other software modules to be installed
    before application or an applet will run.


    Dependencies for a software package must be met for it to run after installation.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_171_0.png)


    The question arises: When should you use YaST and when should you use Red Carpet
    to install and update software? They both share some of the same capabilities.


    YaST works best for adding software and patches to your system from CDs and DVDs.
    YaST actually has a better tool than Red Carpet to check whether the dependencies
    are met for a package you want to install without having to view a list of dependencies.


    Red Carpet is easy to deal with in terms of performing system updates because
    an indicator appears on the top panel when system updates are available. Red Carpet
    (at least in my opinion) also makes it easier to quickly view all the software
    installed on your system, and with just a couple of clicks you can remove or add
    a package.


    # 60 About Updating Applications Using Red Carpet


    Red Carpet provides you with the ability to quickly do a system software update,
    including updates for installed applications and applets. Red Carpet updates are
    provided by servers set up to support NLD. These are called services. The services
    supply update channels that you can subscribe to (for example, the NLD channel),
    meaning that you need to be connected to the Internet to run the Red Carpet update.


    You have the option of installing all the available updates or selecting individual
    updates for specific applications or applets. In terms of updating the NLD'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'software, Red Carpet is quick and painless, particularly if you don''t overthink
    the whole update process and allow Red Carpet to install all the updates that
    are located.


    You can select to install all available updates or install individual updates.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_172_0.png)


    Red Carpet''s capabilities don''t end with easy updates. You can also quickly
    view the software installed on your system. This makes it easy to view the information
    for a particular package. You also have the option of removing unwanted packages
    if you want.


    Installed packages can be reviewed and removed.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_172_1.png)


    # NOTE


    Red Carpet is easy to deal with because your subscribed channels provide the update
    list and allow you to view software available on the channels. You don''t have
    to deal with CDs or DVDs; everything is handled online.


    When you are perusing installed software packages, you might find the complete
    list rather long and imposing. You can use the Sections drop-down list to'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# CHAPTER 7: Adding and Managing Software Applications and Tools in NLD


    view subsets of installed and available software. For example, if you just want
    to see the productivity tools installed, you can select Productivity on the All
    Sections drop-down list.


    Viewing software by the various sections (such as Productivity, Games, Multimedia,
    and Internet) makes it easier to then look at the information related to a specific
    package because you know what type of package it is. To view the information for
    a specific package, select the package and select the dependencies for the Information
    button. The Information dialog for the package provides package information and
    also allows you to view the dependencies for the package.


    You can view the information for a specific package.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_173_0.png)


    Red Carpet is an intuitive tool in terms of working with updates and adding other
    available packages or removing installed packages. The History tab of the Red
    Carpet window allows you to peruse a date and time list of updates including the
    new and replaced version of the updated package.


    # 61 Run Red Carpet to Update NLD Applications


    In terms of stability and usability (updated software often provides interface
    enhancements), you want to keep your NLD software up-to-date. It makes sense to
    update your system when you are alerted that updates are available.


