    items in the currently selected folder.


    On the left side of the Evolution window is the Folder list. The Folder list

    allows you to quickly access the various folders. There is a Shortcut

    bar at the bottom of the Folder list. The shortcuts provided on the bar make it

    eas for you to access specific Evolution features as mail, contacts, and the

    calendar.


    On the right side of the Evolution window is a list pane that shows a list of

    y emails, contacts, or appointments (depending on whether you have Mail,

    Contacts, or Calendars selected). A preview pane is also provided that allows

    you to preview the email currently selected in the list.


    Evolution provides an easy-to-navigate interface for managing emails, contacts,
    and

