    ![](img/6e85ebc4ce06a64c82109523b60183ba_331_2.png)


    # The Planets


    # 135 Insert Graphics and Other Objects


    # 4 Drag Graphic from Gallery


    Select one of the Gallery categories such as 3D Effects, Bullets, or

    Rulers. Drag an object from the Gallery to the current slide. After the

    object is on the slide, you can move and size it as needed.


    TIP


    You can also drag sounds from the Gallery to your current slide. To see a more

    descriptive listing of the sounds in the Gallery’s Sound category, select the

    Detailed View button at the top of the Gallery pane.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'To place repeating graphics or other objects such as a text box containing
    the date, slide show title, or your name, open the master slide (select View,
    Master, Drawing) and then place items on the master. You can insert fields such
    as the Date and Author (select Insert, Fields) at the top or bottom of the master
    slide and add a company logo or other graphic to the master. Remember that objects
    that you place on the master appear on all the slides in the presentation. Take
    advantage of the different design objects in the Gallery to build eye-catching
    master slides.


    # Insert Spreadsheet


    You can place other objects on your slides including a slide, charts and spreadsheets.
    To insert a new spreadsheet on a slide use the Insert button arrow on the Main
    toolbar and then select Spreadsheet from the object list. A new blank spreadsheet
    is placed as an object on the slide.


    # Enter Spreadsheet Data


    When the spreadsheet object is selected the toolbars provide the tools that you
    would normally have access to Calc. Enter data in the spreadsheet as needed. When
    you click outside the spreadsheet object, the toolbars provide the Impress tools
    normally available in the Impress workspace.


    You can drag text boxes, images, and other objects off a slide and park these
    objects in the gray area of the workspace to "accumulate" objects for a particular
    slide and then arrange them as needed or actually move them to a different slide.


    # Select a Slide Transition


    Slide transitions allow you to add some interest and glitz to your slide presentations.
    A transition uses a special effect (such as dissolve), and each slide in a presentation
    can be assigned a different transition type. You see the transitions as you advance
    from the current slide to the next slide during your slide show.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# CHAPTER 13: Creating Presentations with OpenOffice.org Impress


    ![](img/6e85ebc4ce06a64c82109523b60183ba_333_0.png)


    # Open Slide Transition Dialog


    To add a transition to the current slide, select the Slide Show, Slide Transition
    from the menu. The Slide Transition dialog box opens.


    # Select and Preview Transition


    Select the Preview button on the top right of the Slide Transition dialog box
    (this allows you to preview the transition). Then select a transition from the
    transition list. Select the Assign button (the check mark button); a preview of
    the transition appears in the Preview window when you assign the transition to
    the slide (using the Assign button).


    # Set Timing and Select Sound


    Select the Extras button on the top left of the Slide Transition dialog box. This
    screen allows you to add automatic timings for the transition and add a sound
    effect to the transition.


    Select the Automatic Transition button and then use the time spinner to set the
    timing for the transition. To add a sound effect to the transition, select the
    Sound button and then select a sound from the list. When you select the Assign
    button, the timing and the sound are assigned to the transition and you receive
    a preview in the Preview window. After you have completed your transition settings,
    you can close the Slide Transition dialog box and the Preview box.


    318'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Add Slide Animation Effects


    Another way to add special effects to your presentation slides is to take advantage
    of animation effects. These effects can be assigned to a particular object on
    a slide such as a text box or graphic.


    There are “regular” effects that are used to control the effect of an object (objects)
    onto the slide (such as a dissolve), and there are also text effects. A text effect
    can be used to animate the text in a text box such as a bulleted list. For example,
    using the **Fly in from Left** effect to a text box causes each item in the list
    to fly in from the left (separately) when you click the mouse (a mouse click is
    required for each item in the list).


    +   BEFORE YOU BEGIN


    +   Insert Graphics and Other Objects


    # Select Object


    Select an object on the current slide (or select multiple objects by using the
    mouse to drag a selection frame around those objects).


    # Open Animation Effects Dialog


    Select Slide Show, **Effects** from the menu. The Animation Effects dialog box
    opens. Select the **Preview** button in the Animation Effects dialog box so that
    you can view a preview of any effects you apply to the selected object or objects.


    # Select Object Effect


    If you want to apply an animation effect to an object (any object), select the
    effect category in the **Effects** drop-down list (such as Favorites, Cross-fading,
    and so on). Then select an effect in the effect box.


    To change the speed of the effect, select the **Speed** drop-down list and select
    **Slow**, **Medium**, or **Fast**. To apply the effect and view a preview (in
    the Preview window), select the **Assign** button (check mark).'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# CHAPTER 13: Creating Presentations with OpenOffice.org Impress


    ![](img/6e85ebc4ce06a64c82109523b60183ba_335_0.png)


    TIP


    You can also select a sound to accompany your animation effects. After selecting
    an effect, select the Extras button. On the Extras screen select the Sound button
    and select a sound to accompany the effect. You can also select Fade Object to
    Color on the Extras screen and select a color to be used for the fade.


    TIP


    You can configure the order that objects appear on the slide when you have set
    effects for multiple objects. In the Animation Effects dialog box, select the
    Order button. The Order list appears for the slide, listing all the objects on
    the slide. Drag objects in the list to select the order entry for the various
    items. Remember to select Assign after making any changes to the animation effect
    settings.


    # 4 Select Text Effect


    If you want to apply a text effect rather than an object effect (as discussed
    in step 3), select the Text Effects button in the Animation Effects dialog box.
    Select the Text Effects drop-down list and select an effect from the list (such
    as Cross-fading, Fly In, and so on). Then select one of the effects shown in the
    Effect box.


    320'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'After selecting the effect, select the Assign button to apply the effect to
    the text box. A preview of the effect will appear in the Preview window. After
    you have finished applying your object or text effects, close the Animation Effects
    dialog box and then the Preview window.


    # Change the Workspace View


    After you create slides in the Draw view, you might want to take a "bigger picture"
    look at your presentation. Impress provides different workspace views including
    the Outline, Slides, and Notes views.


    The Outline allows you to see your presentation as an outline and makes it easy
    to move text (particularly bulleted lists) from one slide to another. You can
    use the Slides view to quickly view all slides and change the slide order as needed.
    The Notes view allows you to view a notes area for each slide, which provides
    space for you to type notes related to each slide, allowing you to build your
    presentation script (what you will say) as you create the slides.


    # Select Workspace View


    To select a workspace view, select View, Workspace, and then select one of the
    views provided on the Workspace submenu such as Outline View.


    # View Presentation as Outline


    Open the Outline view (select View, Workspace, Outline View). Use the Main toolbar
    outline buttons, such as First Level or All Levels, to shrink or expand the slide
    text shown, respectively. When you select First Level to shrink the slide content
    to the slide titles only, you can easily drag slides to a new location in the
    outline.


    TIP


    You can quickly view the presentation slide show from the current slide in the
    Outline view. Select the Slide Show button on the Main toolbar.


    # Rearrange Slides in the Slides View


    Open the Slides view (select View, Workspace, Slides View). This view shows all
    the slides in the presentation as thumbnails. You can rearrange your slides in
    this view. Drag a slide to a new location as needed.'
