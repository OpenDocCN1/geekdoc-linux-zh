- pgno: 392
  md: '# Move Appointment in Current Day


    To move an an appointment on the current day drag the appointment to a new time.


    # Open Meeting Invitation


    You must accept or reject meeting invitations that you receive. In your Inbox
    open a meeting invitation; right-click on the invitation message and select Open
    or double-click on the message.


    # Respond to Invitation


    Scroll to the bottom of the invitation message. Select the Choose Action drop-down
    list and then select Accept, Tentatively Accept, or Decline. A response message
    is sent to the originator of the meeting invitation.


    # Open Meeting Appointment


    When you accept an invitation to a meeting, a new appointment is placed on your
    calendar for the meeting. To open a meeting appointment, double-click the appointment.


    # View Meeting Appointment


    The meeting appointment opens. View the appointment for location and other information
    related to the meeting. After you have finished reading the information, close
    the appointment dialog.


    # Create Tasks


    You can view tasks in the Calendar view in the Task pane or you can switch to
    the Task view (select the Task shortcut icon). You can create tasks for your to-do
    list or assign tasks to others. You can also create multiple task lists (the same
    as creating multiple calendars) that allow you to color-code tasks (dependent
    on the task list the is held in).


    # Select Task View


    To switch to the Task view, select the Task shortcut.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# CHAPTER 15: Staying Organized with Novell Evolution


