- pgno: 189
  md: '# CHAPTER 8: Browsing the World Wide Web with Mozilla Firefox


    The Internet has become an increasingly important communication infrastructure
    for businesses and individuals. It is safe to say that one of the Internet''s
    most popular information conduits is the World Wide Web.


    In this chapter we take a look at the Mozilla Firefox web browser. This browser
    provides all the tools and capabilities that you expect from a web browser. It
    also provides added security and is easy to get up and running because it is installed
    by default during your NLD installation.


    # 67 About Mozilla Firefox


    The Mozilla Suite is a set of Internet-related tools including a web browser,
    email client, and newsreader. The various Mozilla tools are all open source.


    Firefox is not the same as the standard Mozilla browser that is part of the Mozilla
    Internet tools but is a standalone browser created using the Mozilla browser source
    code. Firefox is a multiplatform web browser. It can operate on a number of operating
    systems including Microsoft Windows and Linux distributions such as NLD.


    # NOTE


    The Mozilla project was actually launched by Netscape in 1998 when it released
    the source code for the Netscape web browser. Available under GPL and GNU licenses,
    Mozilla tools such as the Firefox browser are open source.


    If you haven''t been following the news related to security and web browsers,
    you probably haven''t seen all the positive press for the Firefox browser and
    its capabilities for dealing with security threats, pop-ups, and cookies. Firefox
    is not actually part of the operating system and so doesn''t open up to threats
    caused by security holes in the operating system itself. Firefox does not run
    certain active content types as ActiveX controls. (ActiveX controls developed
    by Microsoft to provide active content to Microsoft Internet Explorer.) ActiveX
    controls have been identified as a route used by hackers to invade computer systems.


    Most of the security issues that Firefox protects against are really issues related
    to the Windows operating system and Microsoft''s Internet Explorer web browsers.
    So, you don''t have to think about some of these issues at all. Remember that
    Linux (NLD) already provides a more secure environment from the go; your use of
    Firefox as your NLD-based web browser just makes your web experience even more
    secure and flexible.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Firefox provides a number of enhancements (other than security-related enhancements)
    that differentiate it from other web browsers that you may have used. Some of
    these enhancements are


    +   Tabbed browsing—The Firefox window can be divided into multiple tabbed windows
    allowing you to open multiple websites. Move from site by selecting the appropriate
    tab.


    +   Google search box—You can quickly conduct a Google search using the Search
    box provided at the right end of the Firefox toolbar.


    +   Extensions—Extensions are add-modules that can perform all sorts of tasks.
    There are a number of different extensions, with new extensions becoming available,
    including an extension that shows forecasts on the toolbar, an extension that
    provides more control over the download of PDF files, and an extension that allows
    JavaScript to run only when you browse trusted websites.


    +   Download Manager—The Firefox Download Manager allows you to track and access
    the files that you download from the Web.


    Firefox also makes it easy for you to configure the various user preferences.
    A Preferences dialog box (select Edit, Preferences) provides access to these settings.


    +   General—This group of preferences includes the setting for your home page
    and the fonts and colors in the browser window.


    +   Privacy—These settings include the length of time to keep your browsing history
    and cookie management preferences. You can also view the history for the download
    manager and you can manage the passwords that you have saved for secure websites.


    +   Web features—A set of options related to pop-ups and scripting types that
    are allowed to run on accessed sites.


    +   Downloads—These settings include the ability to choose the folder for downloads
    and whether to show the Download Manager when a file is downloaded.


    +   Advanced—A series of options related to accessibility, browsing, and tabbed
    browsing. You can also select the type of security protocols used for secure connections.


    Firefox will serve you as well as your web browser, there are some downsides,
    however. Because Firefox will not run certain content types, you may have problems
    with some interactive sites, particularly sites that have been created with Microsoft
    Explorer in mind. But the enhancements and security'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# CHAPTER 8: Browsing the World Wide Web with Mozilla Firefox


    provided by Firefox more than make up for some of the compatibility issues

    you may have to deal with.


    # 68 Browse Web Pages


    If you''ve used any web browsers in the past (Especially Netscape''s old web

    browser or any of the recent Mozilla browsers), using Firefox should be a

    breeze for browsing web pages.


    +   ✓ BEFORE YOU BEGIN


    # 67 About Firefox


    # 1 Start Firefox


    From the NLD desktop, select the Firefox Web Browser icon in the top

    panel. The Firefox window opens.


    # 2 Enter URL


    To enter a URL (a web address that you know), select the current

    address, then type the URL in the Address box and press Enter.


    # 3 Follow Web Link


    Click a link on a web page to follow an internal link to a new page or

    an an external link.


    > TIP


    You don''t have to type the whole URL, meaning you can type www.sitem.

    suffix (which as .com, .org, and so on.). You don''t have to enter the HTTP://.


    # 4 Perform a Google Search


    To quickly perform a search using Google type your search terms in the

    Google Search box and then press Enter.'
