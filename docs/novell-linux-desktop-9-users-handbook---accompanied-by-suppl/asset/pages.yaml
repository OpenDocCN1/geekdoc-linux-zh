- pgno: 73
  md: '# CHAPTER 4: Modifying the NLD Desktop


    The GNOME desktop not only provides a GUI launch pad for your productivity software
    tools and utilities, but it also provides NLD (and you) a highly customizable
    user environment. Think about the kind of desktop personalization that other operating
    systems provide for their desktop GUIs, and you will be in the same league with
    GNOME.


    You can control and personalize the desktop background, the items available on
    the menus and desktop panels, and you can control personal settings for both software
    and hardware items including the mouse and your printers. This chapter begins
    with an overview of personalizing the NLD desktop.


    # 18 About Modifying GNOME


    GNOME provides you with the ability to add desktop icons and shortcut icons to
    the panels on the desktop. You can also add new items to the menu system. In terms
    of modifying and personalizing the desktop, you can control the desktop background,
    change the desktop fonts, and the screensaver that you want to use.


    The number of changes that you can make to the NLD desktop at the user level (without
    using the root password) are limited to the look and feel of the desktop, meaning
    how you perceive the desktop environment (colors, background, and so on). An item
    that controls a number of look-and-feel elements is a theme. A theme is a set
    of coordinated settings that control how the various parts of your application
    and applet windows including the window frame and controls. A theme also controls
    the look of certain desktop icons and some icons on the panels. To create a unified
    look for the NLD desktop, you can use themes and desktop backgrounds that complement
    each other.


    NLD provides several themes that you can choose from. You can also download and
    install additional themes.


    # KEY TERM


    Theme—Settings that affect the look of program and utility windows including the
    frame and controls. Themes also control the look of certain desktop and panel
    icons.


    In terms of the hardware settings that you can modify, you will find the appropriate
    utilities in the Settings dialog box, which is launched via the System menu. You
    can modify settings related to the keyboard, mouse, and printers and even change
    the screen resolution. Most of the settings for personalizing the desktop environment
    are found in the Settings dialog box.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 19 Create Desktop Icons


    One of the easiest ways to personalize the NLD desktop is to add icons to the
    desktop, panels, and menus that make it easier for you to run your applications.
    Let''s begin our discussion of modifying the NLD desktop with a look at adding
    icons to the desktop.


    # 19 Create Desktop Icons


    You can create desktop icons for applications, applets, folders, and files. You
    can quickly drag icons from the menus to make a desktop icon or use the Create
    Launcher dialog box to create icons for programs, folders, and icons.


    +   - BEFORE YOU BEGIN

    - About the GNOME Desktop

    - Navigate the GNOME Desktop

    - About Modifying GNOME

    - SEE ALSO

    - Use Nautilus to Manage Folders

    - Browse and Open Files


    # 1 Drag icon from


    To quickly create a desktop icon from a menu item, open the menu and submenu that
    contains the icon. Then drag the icon onto the desktop. To use the icon to launch
    the program, double-click the icon.


    # 2 Open Create Launcher Dialog


    Right-click on the desktop and select Create Launcher. The Create Launcher dialog
    box opens. This dialog allows you to create program, folder, and file icons on
    the desktop.


    # 3 Create Program Icon


    To create a program icon enter a name (which appears on the icon) and a command
    (the command that launches the program). To select an icon for the program (a
    generic icon is used otherwise), select the No Icon box. The Browse Icons dialog
    box appears. Select an icon and then click OK to return to the Create Launcher
    dialog. Click OK to create the new program icon on the desktop.'
  merge: -1
  img_proc: true
