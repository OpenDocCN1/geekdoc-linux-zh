- pgno: 269
  md: '# CHAPTER 11: Creating Documents with OpenOffice.Writer


    # 3 Set Header/Footer Properties


    After you enable the header or footer feature on the Header or Footer tab, you
    can set the distance from the header to the margins (Left Margin and Right Margin
    settings) and the height of the header or footer. The default Autofit Height setting
    allows the header or footer to accommodate all the text that you place in the
    header or footer. After you have completed setting the options for the header
    or footer (or both), click OK.


    # 4 Enter Header/Footer Text


    Click in the header or footer. Enter the header or footer text as needed. You
    can format the text in the header or footer as you would format text in the document
    itself.


    # 5 Insert Page Number and Other Fields


    Headers and footers typically contain information such as the date or page numbers.
    You can enter these items into the header or footer as fields. To enter a field
    in a header or footer (such as the page number field), place the cursor in the
    header or footer where you want to place the field. Select Insert, Fields, and
    then select a field (such as Page Number) from the list of available fields. This
    places the field in the header or footer.


    > TIP


    You can have a different header and footer on the first page of your document,
    if you want. To place a header or footer on the first page, select Insert, Header,
    First Page (or Footer and then First Page). Then enter the first page header or
    footer information including any fields that you want to use.


    # 105 Use Format Page Options


    Headers and footers settings are set using the Page Style dialog box. This dialog
    also allows you to control other page settings such as the margins for the document,
    the page orientation for pages (portrait or landscape), and the borders and footnotes
    for the document.


    +   - BEFORE YOU BEGIN


    104 Insert Headers, Footers, and Page Numbers'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# 105 Use Format Page Options


    +   1 Open Page Style Dialog

