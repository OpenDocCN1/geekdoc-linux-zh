- pgno: 52
  md: '# Manage Virtual Desktops


    # Open Program


    Select the Programs menu and then select one of the program categories such as
    Internet. Then click an application icon such as Firefox Web Browser. The application
    (in this case Firefox) opens on the desktop. You can Minimize or Close the application
    as needed.


    # Open Settings


    Select the System menu and then select an item on the menu such as Personal Settings.
    This opens the Settings window. You can minimize or maximize the Settings window
    as needed.


    # View Desktop


    To minimize the application currently running on the desktop, click the View Desktop
    icon on the desktop''s bottom panel. You can then restore any of the open applications
    to the desktop by clicking its icon on the bottom panel.


    TIP


    To quickly start applications as Firefox, Evolution, and OpenOffice.org Write,
    click the appropriate quickstart icon on the top panel.


    TIP


    If you are running a multimedia application such as the CD Player or Music Player,
    you can quickly adjust the sound by selecting the Volume Control icon on the top
    panel.


    # Manage Virtual Desktops


    +   - BEFORE YOU BEGIN

    - Navigate the GNOME Desktop

    - Use the Menu System


    Multitasking environments such as NLD make it easy for you to run multiple applications
    on the desktop. However, the desktop can become overpopulated with application
    windows. Even with some applications minimized, the bottom panel can contain any
    number of icons, making the process of switching between applications an annoyance.
    Virtual desktops allow you to place'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# CHAPTER 3: Working on the NLD Desktop


    applications on different desktops. You can switch between these desktops and
    use the running applications, without sorting through a pile of windows on one
    desktop only.


    TIP


    On the far left of the top panel is the Window Switcher icon. When you are working
    on a particular virtual desktop, you can quickly get a list of open application
    windows (and switch to particular application) by selecting the Window Switcher.


    You switch between the virtual desktops using the Workspace Switcher on the right
    side of the bottom panel. The Workspace Switcher actually provides a thumbnail
    of each of the virtual desktops currently in use.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_53_0.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Switch Virtual Desktop


    To switch from your current desktop (and the applications currently open on the
    desktop), click one of the blank virtual desktops in the Workspace Switcher. Although
    your applications still show as open on the bottom panel (as icons), you are provided
    with a “fresh” desktop.


    # Open Applications on Virtual Desktop


    You can now open applications as needed on the virtual desktop. For example, select
    Programs, Office, Word Processor to open the OpenOffice.org Write application.


    # Switch Back to Original Virtual Desktop


    To switch back to the original virtual desktop, select the Workspace Switcher
    box for that desktop. To return a virtual desktop to its original state (meaning
    devoid of application windows), close the applications on that virtual desktop.


    # Change the System Date and Time Settings


    The date and time are displayed by the Clock applet that resides on far right
    of the top panel of the NLD desktop. Selecting the applet displays the current
    month showing the current date. You can change clock preferences and even copy
    the time and date (and then paste it into another application) by accessing this
    applet.


    You can also access date and time settings using the Clock applet, however, date
    and time settings are considered administrative settings. This means that you
    must know the root account password to change these settings.


    The date and time settings are administrative settings configured using YaST,
    which is the NLD configuration utility. YaST actually played an important part
    when you installed NLD on your system. Access to YaST, no matter what settings
    you are trying to edit, always requires the root password.'
  merge: -1
  img_proc: true
