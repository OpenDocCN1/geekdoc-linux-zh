- pgno: 80
  md: '# Select Submenu for New Icon


    Open the Programs menu and then select the submenu where you want to place the
    new icon.


    # Open Create Launcher Dialog


    Right-click on the submenu. Select Entire Menu on the shortcut menu that appears
    and then select Add New Item to This Menu. The Create Launcher dialog box opens.


    # Enter Information in Create Launcher Dialog


    Enter the appropriate information in the Create Launcher dialog box (the program
    name and program command). Select an icon for the program (select the No Icon
    box). To create the new menu item, click OK. You can now access the program on
    the appropriate submenu using the new icon.


    > TIP

    You may have to log out and then log in to see the changes that you have made
    (such as the adding of icons) to the NLD menu system.


    # About GNOME Personal Settings


    +   - BEFORE YOU BEGIN

    - About the GNOME Desktop


    The NLD personal settings provide control over special accessibility features,
    appearance settings, hardware settings, and system settings. For example, if you
    want to set up a screensaver or add a new printer, you are dealing with personal
    settings. The various user settings are accessed via the Settings dialog box,
    which is a set of icons divided into categories.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# CHAPTER 4: Modifying the NLD Desktop


    These four setting categories are


    +   - Personal—These settings relate to accessibility features that can be enabled
    on the keyboard and tools that can be used to better view the desktop (in cases
    where the user needs special abilities related to viewing the desktop). Two of
    the four icons available under Personal settings that control accessibility features
    are Accessibility and Assistive Technology Support. The Menu icon allows you to
    modify the group submenus currently shown on the Programs menu. The Shortcuts
    icon allows you to add or edit the keyboard shortcut keys for GNOME actions such
    as menu and icon access.


    Many of your personal desktop settings are accessed using the Settings dialog
    box.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_81_0.png)


    +   - Appearance—The Appearance settings group includes icons that allow you to
    control the desktop background, desktop fonts, the screensaver, current theme
    (the overall look of the NLD desktop), and the look and feel of your application
    and app windows.


    +   - Hardware—The hardware settings available in the Settings dialog box include
    keyboard settings and settings for the mouse, the printers, and the screen resolution.


    +   - System—System settings that you can adjust file associations, network proxies,
    sessions, and sound.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# NOTE


    We take a look at the Personal and Appearance settings in this chapter. Hardware
    and System settings are discussed in Chapter 5,"Configuring NLD Hardware and System
    Settings.


    Remember that all the configuration possibilities available to you in the Settings
    dialog box are user settings. This means you can change these settings without
    requiring the root password. More complex settings (those that require administrative
    privileges) are accessed via the Administrator Settings command on the Systems
    menu.


    # Change Personal Settings


    The first group of icons in the Settings dialog box is categorized as Personal
    settings. These settings relate to special accessibility features and also provide
    control over the items on the Programs menus and the settings for keyboard shortcuts.


    +   - BEFORE YOU BEGIN


    +   - About GNOME Personal Settings


    # WEB RESOURCE


    http://www.novell.com/documentation/nld/index.html


    Go to this website to access documentation provided by Novell for NLD.


    +   1 Open Settings Dialog Box


    To open the Settings dialog box select the System menu and then select Personal
    Settings.


    +   2 Open Personal Settings


    To open one of the Personal Settings dialog boxes, double-click the appropriate
    icon.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# CHAPTER 4: Modifying the NLD Desktop


