- pgno: 78
  md: '# Create Panel Quickstart Icon from Menu


    Place the mouse pointer on either the top or bottom panel. Right-click and select
    Add to Panel. A submenu appears that provides a series of categories (Accessories,
    Actions, Amusements, and so on). Each category contains a set of applets and utilities.
    Select a category and then a specific applet. A quickstart icon for that applet
    is placed on the panel.


    # Open Create Launcher Dialog


    You can also create quickstart icons for the panels using the Create Launcher
    dialog box. Right-click on a panel, select Add to Panel, and then select Launcher.
    The Create Launcher dialog box opens.


    # Create Panel Quickstart Icon from Create Launcher Dialog


    Enter a program, document, or other item name and then enter the appropriate information
    in the Type box (select the Type from the drop down box). After entering the appropriate
    information, click OK to create the panel icon.


    # TIP


    You can remove any quickstart icons that you add to your panels. Right-click on
    the icon and select Remove from Panel.


    # TIP


    You can add additional panels to the desktop if you want and then populate them
    with quickstart icons. Right-click on an existing panel and select New Panel.
    A new vertical panel is added on the right side of the desktop. You can add icons
    to this new panel as needed. If you want to remove an added panel, right-click
    on the panel and select Delete This Panel.


    # Add an Item to a Menu


    You can add items to the Programs menu (items cannot be added to the System menu).
    In particular, you can add programs or applets not currently present on the main
    Programs menu or its submenus. The procedure is similar to creating program icons
    for the desktop and the desktop panels; you use the Create Launcher dialog box
    to enter the information for the program icon.'
  merge: -1
  img_proc: true
