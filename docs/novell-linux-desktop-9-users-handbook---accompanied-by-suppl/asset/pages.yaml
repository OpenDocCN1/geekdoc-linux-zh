    detected printer list, select the Use a Detected Printer option button and then
    select the printer in the list.


    TIP


    If you just connected a new plug-and-play printer to your computer and you don''t
    see it listed in the detected printer list, try rebooting the system and see whether
    the printer shows up after the list rebooting.


    If you are installing a network printer, select the Network Printer button. Use
    the drop-down list to select the connection type for the network printer:


    +   - CUPS Printer (IPP)—Use this connection for network printers connected to
    other NLD or Linux systems on the network. If you select this connection type,
    you need the URI for the computer hosting the printer.

    - Windows Printer (SMB)—Use this connection for network printers attached to PCs
    (or servers) running the Microsoft Windows operating system. You need the Windows
    computer name, the workgroup (or domain) name for the computer, and a username
    and password configured on the Windows computer.'
