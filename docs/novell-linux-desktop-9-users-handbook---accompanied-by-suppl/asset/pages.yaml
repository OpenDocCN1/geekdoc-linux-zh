- pgno: 18
  md: '# Start Here


    Novell Linux Desktop (version 9) is a desktop computing environment that provides
    a customizable graphical interface and all the productivity software, such as
    email, word processing, and a secure web browser, that you need (and expect) to
    get your job done. Although Novell Linux Desktop (NLD) may be considered the new
    kid on the block in terms of a desktop operating system, it is a Linux distribution,
    meaning that it is both a powerful and secure operating system.


    NOTE


    The NLD is actually built on the SUSE Linux distribution developed by Novell.
    We discuss SUSE Linux and Linux distributions later in the section "Linux and
    Linux Distributions."


    But before I get tofar ahead of myself in terms of describing NLD (which is provided
    in the section, "What is Novell Linux Desktop?"), I should address where most
    end-users are coming from as they switch to NLD, and this means Microsoft Windows.
    It is safe to say that the desktop computing environment that most of us, the
    typical end-user, have used for more than a decade has been Microsoft Windows.
    Although the Macintosh Operating System preceded Windows in terms of an easy-to-use
    and intuitive graphical interface, Microsoft has enjoyed the greater market share.


    So, whether we worked on a Windows or Novell network, the desktop operating system
    of choice was Microsoft Windows. With this choice has come a number of issues
    related to security and viruses that keep support personnel and network engineers
    hopping to protect both the network and each user''s desktop.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# CHAPTER 1: Start Here


    So, if we flash forward to today, the Linux operating system, both in terms of
    an alternative server environment (everything from web servers to file servers
    to application servers) and as a desktop operating system solution, has gained
    a great deal of acceptance with computing professionals and has evolved into a
    viable alternative to the Windows operating system (and other operating systems).
    Linux certainly is not the new kid on the block, however; Linux developed as an
    open source operating system for the personal computer in 1991 by Linus Torvalds,
    a student at the University of Helsinki.


    # NOTE


    Linus Torvalds based his Linux operating system on UNIX (a multiuser, multisear
    operating system developed by AT&T Bell Labs in the 1960s), and Linux embraced
    a similar set of command-line tools and file structure.


    Because the Linux source code was freely available to developers, a number of
    Linux distributions have been brought to the market (which we discuss in a moment).
    NLD is a Linux distribution developed by Novell with with the end-user in mind.


    # What Is Novell Linux Desktop?


    NLD is a Linux-based desktop operating system powered by Novell’s popular SUSE
    distribution. NLD includes a number of Novell products and services and also provides
    open source productivity tools such as OpenOffice.org, a powerful and complete
    application suite.


    # KEY TERM


    Distribution—A particular flavor or version of Linux that has been packaged using
    the Linux source code and other open source software applications.


    NLD provides the same kind of mouse-driven multitasking environment found in:
    both the Microsoft Windows and Apple Macintosh operating system environments.
    This means that you don''t have to deal with a steep learning curve in terms of
    getting up and running in NLD.


    # Linux and Linux Distributions


    As mentioned earlier in the chapter, when Linus Torvalds first developed Linux
    he made the operating system open source. This meant that the Linux kernel'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Linux and Linux Distributions


    (the actual source code of the operating system) could be built upon to develop
    a unique flavor or distribution of Linux.


    A number of Linux distributions exist, each with its own take on the Linux source
    code. For example, there is Novell''s SUSE Linux, RedHat Linux, and Mand Linux
    among others. Each of these operating systems is Linux, but each is also a unique
    operating system platform, having been developed by different programmers with
    different purposes in mind for the operating system.


    Linux distributions have been built for the most part so that they can serve as
    a full-blown server environment or as the operating system for a desktop computer.
    This duality of Linux distributions often ends-users shy away from Linux because
    many distributions were necessarily developed specifically for the desktop user.
    NLD has been developed with the sole purpose of serving as an end-user environment.


    I would be remiss if I didn''t mention some facts related to Linux distributions
    and NLD directly in terms of dealing with viruses and other software pests when
    you begin to explore the applications and apps provided by NLD, you will find
    that no antivirus software is preinstalled. This shouldn''t make you nervous;
    to date, fewer than 20 viruses can affect Linux systems, and they require that
    the user allow them to execute. They can only be executed when a user is logged
    in as the root account. (The root account is synonymous with administrative account
    and is used only when software updates or important system settings need to be
    configured.) So, the bottom line is that NLD is essentially worry-free in terms
    of virus attacks.


    # KEY TERM


    Applet—A software tool that requires minimal system resources and is designed
    to be launched from within another application. Applets typically do not provide
    access to the computer''s hard drive. NLD provides a number of applets, such as
    the Volume Control applet and the Resolution Switcher.


    # KEY TERM


    Root—The root account is the administrative account for a Linux system. It has
    many more rights and capabilities when compared to the typical user account in
    NLD.


    In terms of adware and spyware, you will find that the Firefox web browser, installed
    with NLD, provides a great deal of protection. It was designed as an answer to
    the problems other web browsers pose for end-users and the deluge of adware and
    spyware that we all have to deal with the Web. We will discuss Firefox in more
    detail in Chapter 8, "Browsing the World Wide Web with Firefox."'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Understanding GNU Software


    The Linux kernel is an example of software licensed under GNU (GNU is an acronym
    that stands for GNU''s not Unix). The GNU Project actually began in 1984 to develop
    an open source operating system, with the result being Linux. The GNU licensing
    strategy means that no one actually owns Linux (or appropriately GNU/Linux), but
    anyone can use the source code to develop his own distributions and tools (as
    already discussed). The GNU Project''s key sponsor is the Free Software Foundation
    (FSF).


    GNU software is not restricted to the Linux platform. OpenOffice.org, which is
    a productivity suite similar to Microsoft Office. OpenOffice.org is available
    for the Linux platform, but it is also available for other platforms. There is
    actually a version that runs in the Windows environment. We will discuss OpenOffice.org
    in more detail in later chapters in this book.


    Other tools available for the Linux environment, such as the GNOME desktop and
    Mozilla Firefox web browser, are also licensed under GNU. The possibilities provided
    by GNU have led to the creation of many applications and other tools that are
    readily available to users worldwide. It has also helped to build an operating
    system platform that has great promise and flexibility to developers expand and
    fine-tune the software available for Linux systems.


    # NOTE


    Because Linux and many software programs that run in the Linux environment are
    licensed under GNU, it appears that Linux is freely freer. But that depends on
    the distribution. You can download many Linux distributions for free. However,
    to take advantage of proprietary software tools and other services, such as easy
    system updates, software media (receiving the distribution on CD or DVD), and
    support, it is necessary to purchase a particular distribution such as NLD. For
    more about GNU and the Free Software Foundation see http://www.GNU.org.


    # The Novell Linux Desktop GUI


    In terms of actual use in businesses and other institutions, network administrators
    have embraced Linux for a number of years, particularly in the realm of network
    servers. For example, the Apache web server, which runs on the Linux platform,
    is a popular product for hosting websites. Neither network administrators running
    Linux implementations nor Linux aficionados have ever really been daunted by the
    fact that to administer a computer running Linux, a very good grasp of the Linux
    shell commands (the command-line tools) is necessary.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# The Novell Linux Desktop GUI


    Obviously, for Linux to become popular on an end-user''s desktop, the environment
    has to be both friendly and easy to operate. Most end-users do not want to deal
    with a complex set of commands run in a command-line environment. This is where
    the Linux Graphical User Interface (GUI) comes in. NLD uses the GNOME (GNU Network
    Object Model Environment) desktop by default.


    # NOTE


    NLD provides a choice of GUIs: GNOME and KDE (K Desktop Environment). These two
    GUIs are similar. However, because GNOME is the default GUI for an NLD installation,
    this book covers GNOME. For more information on GNOME (in terms of its development)
    see http://www.novell.org. For more about KDE, check out http://www.kde.org.


    GNOME isn''t actually a part of the NLD operating system; it is an open source
    GUI (GNU software as discussed in the previous section) that can be run by NLD
    (and other Linux distributions). GNOME provides a desktop environment that embraces
    all the aspects of the typical end-user interface. Software and files can be manipulated
    using icons and applications, and tools are run in windows.


    The GNOME desktop provides a familiar and easy-to-use graphical user interface
    for NLD.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_22_0.png)'
  merge: -1
  img_proc: true
