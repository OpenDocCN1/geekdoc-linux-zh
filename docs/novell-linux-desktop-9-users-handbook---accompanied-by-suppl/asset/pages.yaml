    # Select and Delete File


    Select the file you want to delete. If you want to select multiple files, select
    the first file and then hold down the Ctrl key as you select subsequent files.
    Press the **Delete** key. The file or files will be removed and placed in the
    trash.


    TIP


    To select all the files in a folder, from the Nautilus menu, select **Edit, Select
