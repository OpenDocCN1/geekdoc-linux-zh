- pgno: 90
  md: '# Open Pick a Font Dialog


    Select one of the font change boxes (such as Application font). This opens the
    Pick a Font dialog box.


    TIP


    You can add TrueType fonts to your system as needed. Use Firefox to locate websites
    that provide font downloads. Download the fonts to the folder that you create
    on your desktop (right-click on the download link and select Save Target to specify
    the appropriate folder). Open the folder on the desktop that you use to store
    the downloaded fonts. Open your Home folder on the desktop. In the Home window,
    select File and then select Location. In the dialog that you, type fonts:/// and
    then click Open. This opens the Font folder for the system. Drag fonts from the
    folder that you created hold downloaded fonts to the Font system. You now have
    access to the added fonts.


    # Select Font Family, Style, and Size


    In the Pick dialog box, select a new font family from the Family list. If you
    want to change the font style, select a new style in the Style list box. Finally,
    to change the font size, make a selection in the Size list. Click OK to return
    to the Font Preferences dialog box.


    # Select Font Rendering


    By default fonts are rendered using the Best Shapes option. This option smoothes
    the edges of the fonts and is typically the best setting for standard monitors.
    You can also select Monochrome (fonts are shown in black and white,but edges are
    not smoothed), Best Contrast (sharpens the contrast and smoothes edges; setting
    is designed to make screen easier to read), and Subpixel Smoothing (LCDs). The
    Subpixel Smoothing option is designed to get the best performance out of LCD (laptops)
    and flat-screen monitors. After making your font rendering selection, click Close
    to exit the dialog box.


    NOTE


    Changing the fonts and other options for your applications only affects your GNOME
    applications, which is fine because GNOME is the default GUI for NLD. However,
    if you switch to the KDE desktop, you will find that your font changes are not
    applied to your applications and applets.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# CHAPTER 4: Modifying the NLD Desktop


    TIP


    You can specify additional settings related to how fonts are rendered on your
    monitor. Select the Details button to fine-tune settings for smoothing and hinting.


    # Select a Screensaver


    Screensavers were originally developed to protect computer screens (we''re talking
    about those old amber and monochrome monitors) from having a static image burned
    onto the screen during long periods of screen inactivity. The monitors that we
    now use do not have the same burn-in problems, and most are energy-compliant devices
    that shut down after a period of inactivity. Screensavers are really mostly for
    fun and also provide you with the ability to lock your screen when you are away
    from your computer.


    +   - BEFORE YOU BEGIN

    - SEE ALSO


    +   - About GNOME Personal Settings

    - Use the Lock Screen Tool


    # Open Screensaver Preferences Dialog


    In the Settings dialog box (in the Appearance pane), double-click the Screensaver
    icon. This opens the Screensaver Preferences dialog box.


    # Select Screen Saver Mode


    Select the Mode list to select one of the following: Only One Screen Saver, Random
    Screen Saver (allows you to select a list of screensavers for random selection),
    Blank Screen Saver (screen banks, but a screensaver is not used) or Disable Screen
    Saver (the screensaver feature is not used).


    # Select Screensaver


    If you select the Only One Screen Saver mode, select a screensaver from the list
    of screensavers provided. If you select Random Screen Saver, check boxes are placed
    next to the screensavers in the list. Enable or clear check boxes as needed to
    select the screensavers that will be used.'
  merge: -1
  img_proc: true
- pgno: 92
