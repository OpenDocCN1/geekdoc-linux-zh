    # Sort and Filter Data


    When you work with large sheets containing data such as employees, products,

    or lists, it is useful to be able to sort and filter the data. Calc provides you
    with

    the ability to sort spreadsheet data and also to filter data; in effect, these
    fea-

    tures (and other database features provided by Calc) allow you to use Calc for

    database management.


    # 1 Open Define Range Dialog


    The first thing you need to do is identify the database for Calc. Select all

    data in your database list including your column headings (these are

    actually used to identify the column that will be used when sorting

    items in the list). Select Data, Define Range. The Define Database Range

    dialog box opens.'
