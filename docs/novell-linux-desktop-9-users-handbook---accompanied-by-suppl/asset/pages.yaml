- pgno: 396
  md: '# Send Task Invitations


    Send Evolution Query dialog box opens asking you whether you want to send the
    task participants an email invitation. Click Send.


    # NOTE


    When you send task invitations, invitees have the option of accepting or declining
    the task. Email responses from the invitees appear in your Inbox when the various
    invitees respond.


    # Create Task Lists


    You can create multiple task lists. Each task list appears in the left pane of
    the Task view. Each task list has its own color coding, so you can have task lists
    for projects that you are working on. All tasks appear in the Task view when all
    lists are selected. To view the tasks in a particular list, make sure that it
    is only the only list selected in the left pane of the List view.


    # Open Add Task List Dialog


    ![](img/6e85ebc4ce06a64c82109523b60183ba_396_0.png)


    # Create New Task List


    # Open Add Task List Dialog


    Right-click on an existing task list in the left pane of the Task view (such as
    the Personal task list). On the shortcut menu select New Task List.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# CHAPTER 15: Staying Organized with Novell Evolution


    # Create New Task List


    Enter a name for the task list and select a color for the list (which is used
    to color code tasks in that list). To create the new list select Add Task List.


    When you create a new task, you can assign it to a particular task list on the
    task''s Tab using the Group drop-down list.


    # Use Calendar Views


    Viewing tasks and your calendar simultaneously is easily accomplished in the Calendar
    view. You can also change the current view of the calendar to better view your
    daily appointments (in a list) or view.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_397_0.png)


    # Select Calendars Shortcut


    Select the Calendars shortcut to view your calendars and the task list.


    # Change Calendar View


    Select View, Current View. Select one of the following views from the submenu:


    +   - Day View—The default view shows the current day and appointments.'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'Workweek View—Shows the current workweek in a grid, with appointments shown
    for each workweek day.


    Week View—Shows the current seven-day week and appointments scheduled on each
    day.


    Month View—Shows the current month and appointments scheduled on each day of the
    month.


    List View—Lists the current day''s appointments in a list.


    # 169 Set Evolution Preferences


    You can set the various preferences for Evolution, including mail, calendar, and
    task preferences, in the Evolution Settings dialog.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_398_0.png)


    # 169 Set Evolution Preferences'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# Open Evolution Settings Dialog


    To open the Settings dialog box, select Tools, Settings.


    # Set Mail Preferences


    Select the Mail Preferences icon. You can then set mail preferences including
    message fonts, message notification settings, and the headers shown for each email
    message (such as To; From; CC; and so on).


    # Set Calendar and Tasks Preferences


    Select the Calendar and Tasks icon. Set preferences as needed including time zone,
    work week parameters, and alert settings. After you have completed setting your
    preferences, select Close to close the Settings dialog box.


    > TIP

    To set preferences related to composed messages select the Composer Preferences
    in the Settings dialog. You can set preferences such as having all messages sent
    as HTML and automatically including a smiley face on every message.


    # About Synchronizing a Handheld Device with Evolution


    You can synchronize handheld devices that run the Palm operating system with Evolution.
    The first thing you must do is set up communication between the NLD system and
    your Palm device. The second phase of the setup allows you to move information
    from your various Evolution folders, such as the calendar and the address book
    to the Palm device (and vice versa).


    The easiest way to set up the initial communication between the Palm device and
    Evolution is to run the Gnome-Pilot Wizard. The wizard walks you through the steps
    of linking your Palm handheld organizer with Evolution. You start the Gnome-Pilot
    Wizard from inside Evolution; select Tools, Pilot Settings from the Evolution
    menu.


    After the Gnome-Pilot Wizard has started, the first screen provided by the wizard
    can be quickly bypassed by selecting Forward. The second screen requires you to
    enter important information for creating the link between the handheld'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# 170 About Synchronizing a Handheld Device with Evolution


    device and Evolution. You must specify the port type (Serial, USB, for example)\sand
    the actual port that will be used for the Palm to Evolution communication.

    The default is /dev/pilot, but other ports such as ttyUSB0 or ttyUSB1 can be

    used.


    # NOTE


    You need read and write access to connect to a port such as a USB or serial port.

    So, connecting a handheld device to an NLD system when you are not running as

    root, poses some of the same problems that burning CDs or DVDs do (meaning

    root privileges are required to access devices). You can use commands such as

    own and chmod at the command line, when logged in as root using the su

    (superuser) command, to gain access to ports. For example, you can run the com-\mand
    chmod 777 /dev/tty0 to access the first USB port on a system.

    Successfully connecting to a Palm device may require help from your system

    administrator or require some additional research on your part to get the Palm

    device and your system talking when you are not logged in to the system as root.


    Specify the port and port type for the communication between the Palm device and

    Evolution.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_400_0.png)


    After the port and port type are specified, the wizard walks you through the

    steps of synchronization with the Palm device for the first time. You can specify

    whether you have synced the device with other groupware software in the past

    or are synchronizing the device with a groupware product (such as Evolution)

    for the first time. In either case, a username and unique ID are negotiated

    between the handheld device and your system.'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# CHAPTER 15: Staying Organized with Novell Evolution


    After your system and the handheld device have been synchronized for the first
    time, you can configure the conduits that allow you to synchronize email, appointments,
    or tasks between Evolution and the Palm device. You can access the Pilot Settings
    (including the conduit settings) by selecting Tools, Pilot Settings from the menu
    after you have run the initial synchronization.


    The Pilot Settings dialog box provides three tabs: Pilots, Devices, and Conduits.
    The Pilots tab lists the device that was identified during the initial synchronization.
    The Devices tab shows the cradle and communication port (such as a USB port) that
    was configured by the Gnome-Pilot Wizard.


    The Pilot Settings dialog box shows the settings that were configured when you
    ran the Gnome-Pilot Wizard.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_401_0.png)


    The Conduits tab is used to configure how Evolution and the handheld device share
    information. You will have different conduits listed on the Conduit tab such as
    EAddress, which is for synchronizing the address book, and Ecalendar, which is
    used for synchronizing your appointments. You select a conduit and then enable
    it by selecting the Enable button. To configure the conduit, you select the conduit
    (such as EAddress) and then select Settings. Selecting Settings opens a Conduit
    Settings dialog box for the selected conduit.


    You then must determine how you want Evolution and the handheld device to handle
    the information shared during subsequent synchronizations. In the Conduit Settings
    dialog box you select the Action drop-down list. You can then select from the
    following:


    386'
  merge: -1
  img_proc: true
- pgno: 402
  md: '+   * Synchronize—New data is shared between Evolution and the device (no matter
    where the new information resides), and information deleted in Evolution or the
    Palm device is removed from Evolution and the hand-held device.


    +   * Copy from Pilot—New information is copied from the Palm device to Evolution.


    +   * Copy to Pilot—New information is copied from Evolution to the Palm device.


    +   * Merge from Pilot—New data is copied to Evolution, and any data deleted on
    the handheld device is also deleted from Evolution.


    +   * Merge to Pilot—New data is copied to the handheld device from Evolution,
    and any information that has been deleted from Evolution is also deleted from
    the handheld device.


    Conduits are configured to determine how information is dealt with during the
    synchronizing of Evolution and the handheld device.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_402_0.png)


    Configure all the conduits that you want to synchronize. You can then synchronize
    Evolution and your Palm device as needed. After you have configured your conduits,
    you can synchronize Evolution and your handheld device as needed by pressing the
    sync button on your handheld device''s cradle.


    # Delete Evolution Items


    The end result of deleting items in Evolution really depends on the item you are
    deleting. Deleted messages are placed in the Trash folder. This allows you to
    recover the message if it has been deleted inadvertently. When you delete contacts,
    appointments, and tasks, you aren''t really given a second chance in terms of
    recovering the deleted item. They are removed from Evolution completely.'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# CHAPTER 15: Staying Organized with Novell Evolution


    ![](img/6e85ebc4ce06a64c82109523b60183ba_403_0.png)


    # Delete Message


    With the Inbox selected, right-click on any message and select Delete from the
    shortcut menu. The message is deleted from the Inbox.


    TIP


    You can select multiple messages and then delete them by pressing the Delete key.


    388'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# View Messages in Trash Folder


    Select the Trash folder in the Folder list. Deleted messages are held in the Trash
    folder until you empty the trash or exit Evolution (and have configured Evolution
    to automatically empty the Trash folder on exiting).


    To configure Evolution to automatically empty the Trash folder on exiting, go
    to the Mail Preferences in the Evolution Settings dialog. Select the Empty Trash
    Folders on Exit check box on the General tab of the Mail Preferences.


    You can undelete a message in the Trash folder (which returns it to the folder
    that held before the deletion). Right-click on the message and select Undelete.


    # Delete Appointment


    When you delete items such as appointments or tasks, you don''t have the luxury
    of recovering them from a Trash folder (as you do with messages). With the Calendars
    shortcut selected, right-click on an appointment on the daily calendar. Select
    Delete from the shortcut menu.


    # Confirm Appointment Deletion


    An Evolution Query dialog box opens that lets you know that the item will be permanently
    deleted from Evolution; select Delete to remove the item.'
  merge: -1
  img_proc: true
