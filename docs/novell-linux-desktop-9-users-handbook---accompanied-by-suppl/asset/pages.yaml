- pgno: 146
  md: '# View File Properties


    To view the file properties, right-click on the file icon and select Properties
    from the shortcut menu. This opens the Properties dialog box for that particular
    file. On the Basic tab, the file size and when the file was last modified and
    accessed are provided. If you want to view permissions for the file, select the
    Permissions tab. After you have finished viewing the file properties, select Close.


    # TIP


    You can attach emblems to the files using the Emblems tab and enter comments for
    the Notes tab. If you want to select a custom icon for the file, select the Select
    Custom Icon button. The Select an Icon dialog box appears. Select a new icon and
    click OK.


    # Open File


    You can quickly open the file in the application that it was created in. Double-click
    the file, and the application window opens. You can now edit and then save any
    changes that you have made to the file. After you have finished working in the
    application, close its window, and you are returned to the Nautilus window containing
    the file icon.


    # Find Files


    NLD provides a quick search tool that makes it easy to find files anywhere in
    the file system. You can search by filename and a number of other parameters,
    such as the text the file contains, the date the file was last modified, and/or
    the size of the file.


    # BEFORE YOU BEGIN


    +   14 About File Commands


    +   15 Use File Commands


    +   46 Use Nautilus to Manage Folders


    +   47 Browse and Open Files'
