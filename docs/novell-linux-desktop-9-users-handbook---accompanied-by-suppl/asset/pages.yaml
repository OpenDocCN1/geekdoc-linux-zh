  md: 'Firefox allows you to manage the bookmarks that you create. You can change
    link-specific information such as the name and address of the bookmark. You can
    also move and delete bookmarks as needed and create new folders to hold your bookmarks.


    You manage your bookmarks in the Bookmarks Manager, which allows you to sort bookmarks,
    change bookmark properties, and perform other tasks such as moving and deleting
    bookmarks.


    The Bookmarks Manager allows you to manage your bookmarks.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_204_0.png)


    The Bookmarks Manager also allows you to import and export bookmark lists. This
    allows you to import the bookmarks from another computer and web browser. For
    example, if you use more than one computer running NLD, you can make sure that
    the systems share the same bookmarks by exporting (from NLD) and then importing
    (from NLD) as needed. The import and export functions are available on the Bookmarks
    Manager''s File menu.


    # Move and Edit Bookmarks


    Occasionally, after you''ve accumulated a number of bookmarks you''ll want to
    organize them in a way that makes them easy to find. You may want to edit the
    bookmarks so that their titles appear a certain way in your bookmark menu. This
    task will show you how to do this.


    +   - BEFORE YOU BEGIN


    +   - Create a Bookmark


    +   - About Managing Bookmarks'
  merge: -1
  img_proc: true
