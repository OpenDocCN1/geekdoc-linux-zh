- pgno: 115
  md: '# CHAPTER 5: Configuring NLD Hardware and System Settings


    # Open Printers Window


    In the Settings dialog box (select System, Personal Settings) double-click the
    Printers icon. The Printer window opens.


    # Start GNOME Add a Printer Utility


    The Printers window shows currently installed printers. To add a printer with
    the GNOME Add a Printer Utility, double-click the New Printer icon.


    # Enter Root Password


    The Run as Root dialog opens. Enter the root password and then click OK. The GNOME
    Add a Printer utility opens.


    # Select Printer Connection


    On the Step 1 specify the connection for the printer. If the printer is a local
    user, select the Printer Port drop-down list to choose the port type (parallel,
    serial, or USB).


