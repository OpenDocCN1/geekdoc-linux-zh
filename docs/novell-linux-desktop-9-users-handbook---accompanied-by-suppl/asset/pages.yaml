    # 105 Use Format Page Options


    # 1 Open Page Style Dialog


    Select Format, Page from the menu. The Page Style dialog box opens.


    NOTE


    The Organizer tab of the Page Style dialog box can be used to change the current
    page style. This allows you to quickly format your document pages for endnotes
    or footnotes using a page style from the Next Style drop-down list.


    255'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# CHAPTER 11: Creating Documents with OpenOffice. Writer


    # 2 Set Margins, Paper Format, and Orientation


    In the Page Style dialog box, select the Page tab. To change the paper format
    (Letter, Legal, and so on), select the Format drop-down list and make a selection.
    Use the margin springer boxes to set the top, bottom, left, and right margins
    for the document.


    TIP


    The settings in the Page Style dialog box are designed to affect all the pages
    in the document. You can also create documents that have pages with different
    margins, orientation, and other attributes such as borders or backgrounds. This
    can be done by adding a section to the document. You can insert sections at any
    point in the document (you enter a name for each section that you create). This
    allows you to create a single document with multiple sections, meaning different
    page layouts throughout the document. The easiest way to create a new section
    in an existing document is to select the text you want want apply the style to.
    Then select Insert, Sections. The Sections dialog box allows you to name the section
    and select settings for the new section as columns, backgrounds, and footnotes.
    Sections can also be edited as needed.


    # 3 Select Background Color


    Select the Background tab. Use the color palette to select a color for the background.


    # 4 Set Borders


    Select the Borders tab. Select one of the default border styles or use the user-defined
    pane to create your custom borders. Use the Line Style and Color drop-down lists
    to set the options for the borders. If you want to have a shadow on the borders,
    select the shadow position and then select the color for the shadow.


    # 5 Select Columns


    You can format all the pages in the document with columns (very useful when you
    are creating a newsletter). The Column settings take effect on the pages starting
    at the current cursor position. So, if you Ctrl+Home to go to the top of the document
    (otherwise, place the cursor where you want the columns to start), Select Columns
    tab and select one of the column presets. If you want to set your own columns,
    select the number of columns in the Columns spinner box. You can then set the
    spacing between the columns.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'After you have finished selecting your page style settings, click OK to accept
    the new settings for the document. The Page Style dialog box closes.


    # Move Text


    The document editing process usually entails moving text from one place to another
    within the document. Writer makes it easy for you to move text with the Cut and
    Paste commands. You can also drag and drop selected text any-where in the document
    or drag text from one document to another.


    +   1 Drag Text to New Location


    Select the text that you want to move. Drag the selected text to a new location
    in the document. The mouse pointer becomes a drag-and-drop pointer as you drag
    the text.


    +   2 Cut Selected Text


    If you don''t like dragging text, you can use Cut and Paste. Select the text that
    you want to move and then select Edit, Cut. The text is removed from the document.


    TIP


    You can cut and paste text faster using the Cut and Paste buttons on the Function
    bar.


    +   3 Paste Selected Text


    Place the cursor in the document at the position where you want to paste the text
    that was cut. Select Edit, Paste to paste the text into the document.


    TIP


    The Special command on the Edit menu allows you to paste text without the formatting
    that has been assigned to it.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# CHAPTER 11: Creating Documents with OpenOffice.Writer


    ![](img/6e85ebc4ce06a64c82109523b60183ba_273_0.png)


    # 107 Insert a Table


    Writer tables are made up of columns and rows, allowing you to arrange text in
    a tabular format. The intersection of a column and a row is referred to as a cell.


    There are two ways to add a table. You can add a table from the Main toolbar or
    Insert button. This option allows you to choose the number of rows and columns
    in the table with the mouse. You can also select Insert, Table to open the Insert
    Table dialog box. This dialog box allows you to specify the number of rows and
    columns and also autoformat the new table.


    # 1 Insert Table from Main Toolbar


    Select the arrow at the top of the Insert button on the Main toolbar. In the toolbox
    that appears, point at the table button and drag to select the number of rows
    and columns for the table. When you release the mouse, the table is inserted into
    the document.


    258'
  merge: -1
  img_proc: true
