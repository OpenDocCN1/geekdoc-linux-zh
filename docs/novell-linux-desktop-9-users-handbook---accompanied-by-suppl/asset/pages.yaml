- pgno: 292
  md: '# Autofill Text Cells


    You can save some typing of text labels by using the autofill feature. This fills
    adjacent to the current cell based on the contents of the currently selected cell.
    For example, if the current cell contains January, you can autofill the cells
    to the right of the cell with February, March and so on.

    Click on the first cell in the series you want to create (such as a cell containing
    January). Place the mouse pointer on the lower-right corner of the selected cell.
    The mouse becomes a plus symbol. Drag the fill handle (the small black box on
    the cell) to create the series and autofill the adjacent cells (you can drag up,
    down, or right as needed).


    Autofill is pretty slick; it can pick up on series that you need to create. For
    example, typing Region 1 and using autofill produces Region 2, Region 3, and so
    on. Autofill can also be used for days of the week (Monday, Tuesday, and so on),
    and it can fill in a series of numbers. For example, you place 2 in a cell and
    then 4 in an adjacent cell (below or to the right). When you drag to use autofill,
    a series of 2, 4, 6, 8, and so on is created.


    # Enter Numbers


    Select a cell that will contain a numerical value. Type the number and then press
    Enter (or use one of the arrow keys).


    If you need to change an entry (text or number) click in the cell and type the
    new data. If you want to edit an entry, select the cell and then use the Input
    line (on the Formula bar) to enter the entry. Press Enter when finished.


    If you exceed the column width with an entry (text or number), the entry will
    be truncated when you enter data to the right of the "long"entry. You can quickly
    correct this by dragging the column border (the border in the column heading area)
    for the column to accommodate the entry. You can also double-click the column
    boundary for a “best fit,” which accommodates the longest entry in the column
    automatically.'
