- pgno: 283
  md: '# CHAPTER 11: Creating Documents with OpenOffice.org Writer


    # NOTE


    You can use other databases as your data source. This depends on the access to
    you have to internal databases (on your computer) or external database sources
    on the network. For example, programs such as Novell GroupWise, which can hold
    contact information, can be accessed as the data source.


    # 5 Name Data Source


    On the next AutoPilot screen you are asked to enter a name for the data source.
    This is a "friendly" name, type the name you want to use and then click Create.
    A message box opens letting you know that the data source is now available to
    the OpenOffice.org application. You can access the data source anytime from OpenOffice.org
    by pressing F4. Click OK to close the message box. The Fields dialog box opens.


    # 6 Enter Fields


    You must enter merge fields into the form letter. The fields are placeholders
    for items such as name, address, and so on. The Fields dialog box allows you to
    access the fields in your data source and then insert them into the appropriate
    places in the form letter (or other merge document). Expand the data source to
    view the available fields. (It will be with the name you want to place a field.)
    Click in the letter to place the cursor where you want to place a field. In step
    5.) Then click in the Fields dialog box, select the field, and then select Insert.
    The field placeholder is placed in the letter. After you have finished inserting
    the fields, click Close.


    # 7 Complete Mail Merge


    All the records in the data source are used by default. If you want to use only
    some of the records, select the records. Click a record with the mouse and then
    hold down the Ctrl key to select other records. Or you can specify a range of
    records using the From option.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'When you are ready to complete the merge, click OK. The merged letters are
    printed or saved as individual files, depending on the output option you chose.


    # 111 About Printing in Writer


    Despite the web, email, and all other forms of electronically dealing with documents
    today, there are still times when you may find it necessary to print out a hard
    copy of a document.


    +   - BEFORE YOU BEGIN

    - 35 About Printing and NLD

    - 36 Add and Configure a Printer

    - 37 Print to a Printer


    Writer can print to any printer that has been installed on your system. This includes
    local and network printers that have been installed through CUPS. You can quickly
    print a document by selecting the Print File Directly on the Function toolbar.
    This sends the print job to the default printer using the default print settings.


    If you want to be able to choose from the different printers that you have access
    to, you will want to print via the Print dialog box (select File, Print). The
    Print dialog box allows you to select the printer, the page range to print, and
    other options related to the print job.


    You can preview your print jobs using the Page Preview feature (select File, Page
    Preview). The Preview window allows you to zoom in and out on a page and view
    multiple pages as you would.


    You can also print a document to a file. This file can then be printed on any
    computer regardless of whether you use OpenOffice.org. You can also export Writer
    documents as PDF (Adobe Acrobat files). This is useful because the standard document
    type for most websites is not the PDF file format. The PDF format also preserves
    all your formatting, graphics, and so on. To export a document as a PDF, select
    File, Export as PDF. Provide a filename and then save the newly created PDF file.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# CHAPTER 11: Creating Documents with OpenOffice.org Writer


    # 112 Print a Document


    Printing a document in most applications follows a few very similar steps. This
    task will show you specifc how to print a document in Writer.


    +   BEFORE YOU BEGIN


    +   111 About Printing in Writer


    # 1 Open Print Dialog


    With the document you want to print open in the Writer window, File, Print. The
    Print dialog box opens.


    # 2 Set Print Options


    In the Print dialog box use the printer Name drop-down box to select the printer
    you will use for the print job. Specify the print range for the document if you
    are not printing the entire document. If you want to print multiple copies of
    the document, use the Number of Copies spinner box to specify the number of copies.


    > TIP


    You can set other options for your print job. Select the Options button in the
    Print dialog box. The Printer Options dialog box opens. You can select the objects
    you want to print in the document (such as graphics and tables) and change the
    order of the print job. When you choose the Printer Options dialog box you are
    returned to the Print dialog box.


    # 3 Print Document


    After you have specified the options related to the print job, click OK. The document
    will be sent to your printer.'
