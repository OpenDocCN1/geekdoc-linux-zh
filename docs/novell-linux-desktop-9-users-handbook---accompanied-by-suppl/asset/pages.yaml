- pgno: 76
  md: '# Create Document Icon


    You can also place document icons on the desktop that allow you to quickly access
    a particular application file such as a document or spreadsheet. In the Create
    Launcher dialog box select the Type drop-down box and select Link. You can use
    the Browse button to locate the file that you want to create the icon. If you
    want to use a special icon for the document, click the No Icon box and select
    an icon. To place the icon on the desktop click OK


    NOTE


    The path to the file is actually placed in the URL box of the Create Launcher
    dialog box (when you select Link in the drop-down list, the Command box changes
    to the URL box). Interestingly, URLs can point to local files or external websites,
    which we often think of in terms of URLs.


    # Create New Folder Icon


    To quickly create a new folder on the desktop right-click on the desktop and select
    Create Folder from the shortcut menu. The new folder appears on the desktop. Type
    a name for the new folder. To open the new (and empty folder) double-click the
    icon.


    NOTE


    Folders that you create on the desktop are actually there to hold documents and
    subfolders. They differ from the desktop icons that you create, which are merely
    pointers to applications, applets, or other items.


    TIP


    To arrange the desktop icons (including any new icons that you have created),
    right-click on the desktop and select Clean Up by Name.


    TIP


    Removing icons from the desktop is simple. Select the icon and then press Delete.
    The icon is moved to the Trash.'
  merge: -1
  img_proc: true
