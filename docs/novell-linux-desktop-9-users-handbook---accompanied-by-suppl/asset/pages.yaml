- pgno: 407
  md: '# CHAPTER 16: Using Novell iFolder


    Having the ability to access important files from any computer, even a computer
    that is not running NLD, provides a number of possibilities for working on the
    road and collaborating with other users. Novell iFolder is a network service that
    allows you to access a dedicated iFolder from any workstation running NLD or from
    any computer''s web browser. This chapter provides a basic overview of the client
    side of iFolder.


    # 172 About Novell iFolder


    Novell iFolder is a network and Net service that allows you to access a personal
    folder on a server (the iFolder server can be a NetWare, SUSE, or Microsoft Windows
    server configured with the iFolder service). The items in the local folder are
    synchronized with your iFolder on the server. This provides seamless access to
    the files that you need as if they exist locally, and it also backs up these files
    in the iFolder on the server.


    You can access your folder on the iFolder server from any computer that provides
    access to an iFolder client. NLD provides an iFolder client that is installed
    during the NLD installation process.


    In cases where you have access to a computer but not to an iFolder client, you
    can access your iFolder from any computer that has a web browser. As files are
    moved over the network and/or the Internet, they are encrypted, protecting your
    data.


    # 173 Start the iFolder Client


    The iFolder client is the easiest way to access your online iFolder. The client
    software is installed by default during the NLD installation.


    +   1 Start iFolder Client

    From the NLD desktop, select Programs, Accessories, Novell iFolder. The Login
    dialog box opens.


    +   2 Enter Logon Information

    ter your user ID, password, and the name of the iFolder server. After you have
    completed entering the information, select Login. The first time you log in, the
    Novell iFolder Location dialog opens.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# 393'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# CHAPTER 16: Using Novell iFolder


    # NOTE


    The server name can be entered as a DNS friendly name, or the IP address of the
    server can be entered.


    # 3 Confirm iFolder Location


    The Novell iFolder Location dialog box shows the default location for your new
    iFolder. You can edit the path if you want, even using a directory in which you
    already have files. To accept the default (or your modified path), click **OK**.
    The Novell iNew Internet Folder Setup dialog box opens.


    # 4 Enable Automatic Logon and Encryption


    The next step in the process of configuring your new iFolder provides you with
    the option of having automatic logon to the iFolder server at the startup of your
    NLD system and also gives you the option of encrypting your files. Select the
    **Enable Automatic Login at Startup** check box to log on to the iFolder server
    at NLD startup.


    If you are going to access your iFolder via an Internet connection (rather an
    internal network), you may want to enable the file encryption feature; select
    the **Encrypt Files** check box. Click **OK**. If you choose to encrypt files,
    the Novell iFolder Get Pass Phrase dialog box opens.


    # 5 Set Encryption Pass Phrase


    Enter a pass phrase and reenter the pass phrase to confirm it. Enter a hint that
    helps you remember your pass phrase (if necessary). Click **OK** to continue the
    iFolder initialization process.


    # NOTE


    The pass phrase can be one word or multiple words. Spaces are legal characters.
    Keep the pass phrase simple enough that you can remember it easily but complex
    enough that it will not be easy to guess.


    # 6 Enable Pass Phrase Recovery


    Select the **Enable Pass Phrase Recovery** check box. This makes it possible for
    your network administrator to provide you with your pass phrase if you cannot
    remember it. Click **OK**.'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# Access iFolder from the Desktop


    This ends the initialization process. An iFolder icon appears on the NLD desktop
    for your new iFolder.


    NOTE


    You only have to go through all the initialization steps the first time you use
    the iFolder client to log on to the iFolder server. In the future providing the
    username and password will log you immediately on the server.


    # Access iFolder from the Desktop


    After you have logged on successfully to the iFolder server, an icon is placed
    on the desktop for your local iFolder. You can use this icon to quickly open your
    iFolder as needed. To keep the files up-to-date in the local iFolder, it is periodically
    synchronized with your iFolder on the server.


    +   1 Open Your iFolder


    ![](img/6e85ebc4ce06a64c82109523b60183ba_410_0.png)


    +   2 Move Files to iFolder


    +   3 View Files in iFolder


    ![](img/6e85ebc4ce06a64c82109523b60183ba_410_1.png)


    174 Access iFolder from the Desktop'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# Open Your iFolder


    Double-click the iFolder icon on the NLD desktop. The iFolder opens. The iFolder
    is empty the first time you open it, unless you specified a directory that already
    contains files.


    # Move Files to iFolder


    Open a folder on your hard drive using Nautilus. To move files from a local folder
    (on your computer) to the iFolder, drag the files as needed onto the iFolder icon
    on the desktop.


    # View Files in iFolder


    To view or access the files in your iFolder double-click the desktop iFolder icon.
    A Nautilus window opens showing the iFolder contents.


    NOTE


    You can treat the iFolder as you do any other folder on your system. Copy or move
    files to the iFolder, delete files in the iFolder, and double-click a file to
    open the application that the file was created. You can also specify the iFolder
    as the destination to save a file as you work in an application such as OpenOffice
    Writer or Calc. Bottom line: It is the same as other folders that you access locally
    on your computer, except that it gets synchronized in the background to your iFolder
    on the server.


    # Access Your iFolder from a Web Browser


    You can also access your iFolder from any computer that has Internet access and
    a web browser installed (if your iFolder server is reachable via the Web).


    # Access iFolder Server via the Web


    Open a web browser on any computer with an Internet connection. Enter the DNS
    name or the IP address of your iFolder server in the address box and click Go
    (or press Enter). You are taken to the main page of the iFolder server.


    Because most web browsers support Java, the easiest way to log on and access the
    iFolder is to use the Java client that runs inside your browser window. Select
    the Login link on the left side of the browser window. The Java Login client opens.'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# 175 Access iFolder from a Web Browser


    # 1 Access iFolder Server via the Web


    ![](img/6e85ebc4ce06a64c82109523b60183ba_412_0.png)


    # 2 Log In to iFolder Server


    # 3 View Files in iFolder


    # 4 Delete File in iFolder


    TIP


    For web browsers that do not support Java or access to the iFolder using a handheld
    device with web access, use the Login (PDA) link in the browser window to log
    on. You will be able to download the files but not upload them to your iFolder
    nor delete any files from the server.


    # 2 Log In to iFolder Server


    In the Java client Login window provide your username, password, and pass phrase.
    Then click Connect.


    397'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# CHAPTER 16: Using iFolder


    # 3 View Files in iFolder


    The iFolder appears in the browser window. To view the files in your folder, double-click
    the folder in the Folder list. Files appear in the File list. If you want to use
    one of the files on the current computer, select the file and then click Download.
    This downloads the file to the computer you are currently working on.


    # TIP


    You can upload files to your iFolder using the web client. Select your iFolder
    (don''t open it) in the browser window and then select Upload. An Upload dialog
    box opens. Specify the file that you want to upload and then upload the file (or
    files). The file is added to your iFolder.


    # 4 Delete File in iFolder


    You can delete files from the iFolder using the web client. Select a file and
    then select Delete. In the Delete dialog box that opens, select Yes to delete
    the file.


    # 176 About Synchronizing Files


    Because you can access your iFolder from multiple workstations, even over the
    Web, it is necessary for the iFolder on the server to be synchronized with your
    NLD system (the system you use most often). Synchronization makes sure that the
    same files are available in the iFolder no matter where you are logging on to
    the server.


    Files are automatically synchronized between the server and your computer when
    you use the iFolder client to log on to the server (or NLD system). You can also
    activate synchronization manually from the iFolder applet that resides in the
    top panel.


    When there is a conflict during synchronization, affected files are held in a
    conflict bin. For example, let''s say that you are working on a file on your NLD
    desktop that resides in your iFolder. Then you go to a remote system and download
    the file using the web client. You then complete working on the file. And let''s
    say that you don''t need the file any longer, so you delete it from the iFolder
    using the web client.'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'The next time you log on to the iFolder server on our NLD system (using the
    iFolder client) synchronization takes place. However, there will be a con-lict
    because the file you deleted using the web client is not on the server; it is
    in your local iFolder. Instead of just deleting the file, the file in question
    is placed in your conflict bin. This allows you to review the file and decide
    whether it should be deleted from the local iFolder on your NLD system.


    # Manually Synchronize Files


    Occasionally you may find the need to manually synchronize you iFolder with your
    NLD system.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_414_0.png)


    # Start Synchronization


    Select the iFolder icon in the top panel. On the menu that appears select Sync
    Now. The Novell iFolder dialog box opens.'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# CHAPTER 16: Using Novell iFolder


    # 2 View Synchronization Progress


    The manual synchronization is posted on the View Activity tab of the Novell iFolder
    dialog box. You can scroll through the log information to view all the recent
    activity related to synchronization between your local iFolder and the iFolder
    server. After you have completed viewing the log, you can close the Novell iFolder
    dialog box.


    # 178 Views Files in the iFolder Conflict Bin


    After you synchronize with the iFolder server (at logon or manually), files may
    be placed in the conflict bin. You can access the conflict bin and determine what
    to do with the files found there.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_415_0.png)


    # 1 Open Conflict Bin


    Select the iFolder icon in the top panel and select View Conflict Bin. The conflict
    bin opens.


    # 2 Restore or Delete Files


    Files listed are a result of conflicts found during synchronization. To place
    a file back in your local iFolder that was removed during synchronization, select
    the file and select Restore.


    If lists listed in the folder are no longer needed and were not the result of
    a "true" conflict, you can select the files and then click Delete to delete them
    as needed. After you have finished working in the conflict bin, close the dialog
    box.


    400'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# Set iFolder Preferences


    You can review your iFolder account settings and set preferences related to synchronization
    between your local iFolder and the iFolder server. Settings and preferences are
    accessed via the Novell iFolder dialog box.


    # Open Account Information


    ![](img/6e85ebc4ce06a64c82109523b60183ba_416_0.png)


    # Review User Information


    # Set Preferences


    # Open Account Information


    Select the iFolder icon in the top pane of the NLD desktop. Then select Account
    Information. This opens the Account Information tab of the Novell iFolder dialog
    box.'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# Review User Information


    The Account Information tab provides all the information related to your user
    ID, iFolder, and the iFolder server that you use. The amount of space available
    on the server and the amount of space that you have used are also provided on
    this tab.


    # Set Preferences


    Select the **Preferences** tab. The **Automatic Sync** check box is enabled by
    default. If you want to turn off Automatic Sync, clear the check box (only if
    you advised to do so by your network administrator). You can also change the default
    timing for the synchronization delay (the delay and the syncing interval, which
    is the time between sync operations from the server. You can change these timings
    as needed using the spinner boxes provided. If you want the iFolder client to
    remember your password, select the **Remember Password** check box.


    Any changes that you make to the settings should be applied by selecting **Apply**.
    After you have finished working with the dialog box, you can close it.'
  merge: -1
  img_proc: true
