- pgno: 24
  md: '# Novell Linux Desktop Applications and Tools


    Writer is a powerful document processor and is part of the OpenOffice.org productivity
    suite


    ![](img/6e85ebc4ce06a64c82109523b60183ba_24_0.png)


    # Mozilla Firefox


    Whether you use the Web for business, research, or entertainment, it''s important
    to have a web browser that minimizes the dangers of adware, pop-ups, and spyware.
    Your web browser also make it easy for you to find the websites you are looking
    for and to save your web addresses for later reference. Mozilla Firefox fulfils
    all these requirements and more.


    Mozilla Firefox is cross-platform (available for more than one operating system
    platform including Linux and Microsoft Windows) GNU software and provides unique
