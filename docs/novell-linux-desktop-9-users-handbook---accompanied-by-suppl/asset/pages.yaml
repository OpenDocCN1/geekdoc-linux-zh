- pgno: 356
  md: '# Open Attach File(s) Dialog


    On a new mail message (select New on the toolbar), select the Attach button on
    the message toolbar.


    # TIP


    You can also open Nautilus and drag files onto a message when you want to send
    them as an attachment. Select the Show Attachment Bar link at the bottom of the
    message window and drag files onto the bar as needed.


    # Select File Attachments


    In the Attach File(s) dialog box, select the file or files that you want to attach
    to the message. Then select Open. You are returned to the message window.


    # View Attachments


    Select the Show Attachment Bar link at the bottom of the message. This allows
    you to view the icons for the files attached to the message.


    # TIP


    To remove an attachment, select the attachment in the attachment pane at the bottom
    of the message and press Delete.


    # Send Message


    When you are ready to send the message, select the Send button on the message
    toolbar.


    # Receive and Reply to Email


    Newly received messages are placed in your Inbox (unless you have set up a rule
    that sends that particular message to the Junk or other folder). You can quickly
    reply to any received message or forward that message to another recipient if
    necessary.'
