- pgno: 108
  md: '33 Change Keyboard Settings


    NOTE


    The keyboard type that you are using is identified during the NLD installation.
    You may want to tread lightly in terms of reconfiguring your keyboard layout,
    particularly changing the keyboard model.


    # 4 Configure Keyboard Layout


    Select the Layouts tab of the Keyboard Preferences dialog box. To change the keyboard
    model, select the Keyboard Model list and choose your model from the list (make
    sure that your keyboard and the model on the list match correctly). To add layouts
    to the current keyboard configuration, scroll through the Available Layouts list
    and select a layout on the list; then click the Add button. Layouts can also be
    removed from the Selected Layouts list. Select a layout and then click the Remove
    button. Use the Up and Down buttons to reorder layouts in the Selected Layouts
    list.


    TIP


    If you want to restore the keyboard layout settings to the default, select the
    Reset to Defaults button on the Layouts tab.


    # 5 Add Layout Options


    You can also add configuration options to your keyboard layout that control the
    behavior of certain keys and key combinations. Select the Layout Options tab.
    A list of layout options is provided on the right side of the dialog box. Select
    the expand arrow for any option category to view specific options. For example,
    expand the Alt/Win Key Behavior category to view options such as the Add Standard
    Behavior to Menu Key (the Window key). Select a particular option from the list
    and then select the Add button to add the selected option to the Selected Options
    list. If you want to remove an option, select the option and then select the Remove
    button.


    # 6 Close Keyboard Preferences Dialog


    When you have finished setting options and preferences for the keyboard, click
    the Close button to close the Keyboard Preferences dialog box and return to the
    Settings dialog box.'
  merge: -1
  img_proc: true
