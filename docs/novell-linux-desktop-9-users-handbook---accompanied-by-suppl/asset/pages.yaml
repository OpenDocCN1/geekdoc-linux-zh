    # Change Accessibility Settings


    If you do not want to configure keyboard accessibility settings, you can skip
    this step. Double-click the Accessibility icon to open the Accessibility dialog.
    On the Basic tab, select Enable Keyboard Accessibility Features (to enable accessibility).
    You can then enable sticky keys (helper keys as Alt and Ctrl that only have to
    be tapped rather than held down when used for shortcuts) and repeat keys (for
    a set key before it repeats) on this tab.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Change Personal Settings


    Select the Filters tab. On this tab you can configure slow keys (key must be pressed
    for certain duration) and bounce keys (prevents double typing by setting a time
    limit for consecutive uses of a single key).


    Select the Mouse Keys tab. This tab allows you to configure the arrow keys on
    the number as a keyboard mouse. You can configure items such as the speed and
    acceleration for the keyboard mouse. After you have finished configuring the Accessibility
    settings select Close to close the dialog box.


    TIP

    If you want to use the Assistive Technology Support features, which provide onscreen
    keyboard support and special magnifiers, you must install all additional packages
    (which are not installed as part of the typical NLD installation): dasher, gok,
    and gnome-mag. You can install these packages if you have access to the root password.
    These packages are available on either CD 2 of the NLD CD or on the DVD. Open
    the Administrator Settings dialog (from the System menu). Then select Install
    and Remove Software. On the Filter drop-down list, select Selections. Then click
    the Accessibility check box. The four accessibility packages should be selected
    on the right of theST window. Place the appropriate CD or DVD in your drive. Then
    click Accept to install these packages.


    # Add Assistive Technology Support


    If you do not want to take advantage of the Assistive Technology Support features,
    skip this step. Double-click the Assistive Technology icon in the Settings dialog.
    Select the Enable Assistive Technologies check box. Select the settings you want
    to use: Screenreader, Magnifier, On-screen Keyboard. To enable the settings, you
    must log off the system. Click the Close and Log Out button.


    When you log on to the system, the assistive tools that you selected will be enabled.
    The screenreader/magnifier divides the screen into two sections: The normal desktop
    is on the left, and on the right is a magnified version of the mouse pointer''s
    position on the desktop. The onscreen keyboard (GOK) allows you to use the mouse
    to launch programs, manipulate windows, and compose from a keyboard using the
    mouse.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# CHAPTER 4: Modifying the NLD Desktop


    # TIP


    To close the screenreader/magnifier, close the Gnoopicus window (which allows
    you to configure the screenreader/magnifier). You can relaunch any of your assistive
    tools using the Accessories submenu on the Programs menu. To deactivate all the
    assistive tools, return to the Assistive Technologies Preferences dialog and clear
    the Enable Assistive Technologies check box.


    # 5 Modify Programs Menu


    You can modify the Programs menu by adding new folders and program launcher icons.
    Double-click the Menu in the Settings dialog. To create a new folder on the Programs
    menu or in any of the subfolders (double-click a subfolder to open it), select
    File and select New Folder. Type a name for the new folder.


    To add a program icon, Select File and select Create Launcher. The Create Launcher
    dialog provide a name and a command that starts the program (you can also browse
    for the program). Click OK to create the launcher icon. After you have finished
    adding items to the Programs menu (or submenu), close the Programs window.


    # 6 Set Keyboard Shortcuts


    Keyboard shortcuts (a combination of a helper key as Alt or Shift and another
    keystroke) allow you to quickly perform a particular task such as open your web
    browser, log out, or change the system volume. Double-click the Icons to open
    the Keyboard Shortcuts dialog box. To set the shortcut for a particular action,
    select that action in the Action list (actions without shortcuts are marked disabled).
    To create the shortcut, press the key combination on the keyboard. The shortcut
    key combination appears in the Shortcut list to the left of the selected action.
    After you have completed setting your keyboard shortcuts, Close.


    # 24 Change the Desktop''s Background


    The background or wallpaper covers the largest part of the desktop, providing
    the backdrop for the working environment. You can personalize the desktop by selecting
    your own background. You can select from a list of existing backgrounds, or you
    can download additional backgrounds. The file format for backgrounds is the jpeg
    graphic format. Any file you download as a jpeg or any photo that you save as
    a jpeg can be used as the desktop.'
  merge: -1
  img_proc: true
