    # 3 Open File


    # 95 Open an Existing Document


    # Open File


    To open the file, select the Open button.


    # TIP


    You can also open your OpenOffice.org files (and any files for that matter) using
    Nautilus. Open Nautilus (select Programs, Accessories, File Manager) and browse
    for the file. After you have located the file, double-click it to open in the
    appropriate OpenOffice.org application.


    # Get Help in OpenOffice.org


    There will be times when you need to get help as you work in the OpenOffice.org
    applications. OpenOffice.org supplies three different features that help you get
    your work done.


    First, the Help system allows you to browse the Help contents and search for help
    on specific topics. Second, the Help Agent, provides context-sensitive help on
    a particular task or feature. Third, OpenOffice.org provides tips for all the
    buttons on the various toolbars. You can expand these tips for increased information
    by selecting Help, Extended Tips from the menu.'
