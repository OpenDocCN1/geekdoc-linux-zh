- pgno: 158
  md: '# Burn Files on a CD or DVD


    NOTE


    A space counter in the lower panel tells you the amount of space still available
    on the CD or DVD as you drag items onto it.


    # Open the Burning Dialog


    To opening the Burning dialog box (the place where you set the burn parameters),
    select the Burn button in the lower right of the K3b window.


    # Set Burn Parameters


    On the Writing tab of the Data Project dialog box, make sure that the correct
    burning device is selected (if you have multiple burners). You can also choose
    the writing mode, which is by default to Auto. Select the Writing Mode drop-down
    list and select DAO (at once), TAO (at once), or RAW (raw data).


    To select the speed for the burn, select the Speed drop-down list and select a
    burn speed. You also have options that can be set: On the Fly allows you to burn
    the data directly to the CD without a copy made on the hard drive. The Only Create
    Image option burns an ISO image to your hard drive, which can be used to create
    a CD at a later time.


    You may also want to enter descriptive information for the newly created CD including
    the volume name. Select the Volume Desc tab of the project''s dialog box. Enter
    a volume in the Volume Name box. Enter other descriptive information as required.


    TIP


    Burning CDs and DVDs can sometimes be more of an art than a science. You may want
    to simulate the burn process to test your settings (select the Simulate option
    on the Writing tab). In some cases, you may also have to burn through a couple
    of CDs or DVDs to determine the best settings for your particular burning device
    (fortunately, CDs are relatively cheap and CD-RWs can be erased). Sometimes you
    are just dealing with trial and error to determine your own best settings. After
    you establish the settings that work best for you, save them by selecting Save
    User Defaults.'
