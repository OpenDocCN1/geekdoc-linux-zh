- pgno: 275
  md: '# CHAPTER 11: Creating Documents with OpenOffice.org Writer


    # Open Insert Table Dialog


    If you don''t want to insert the table from the Insert button, you can use the
    Insert menu. Select Insert, Table. The Insert Table dialog box opens.


    # Enter Table Settings and Text


    In the Insert Table dialog box enter the number of columns and rows for the table
    and then click OK. You can now enter text into the table. Click any of the cells
    and enter the data. You can quickly move forward through the cells in the table
    by pressing the Tab key (go backward through Shift+Tab).


    TIP


    You can quickly assign an autoformat to your table in the Insert Table dialog
    box by clicking the AutoFormat button.


    # Open Table Format Dialog


    You can format your table. The formatting options include column width, borders,
    and backgrounds. Right-click on the table and select Table on the shortcut menu.
    The Table Format dialog box opens.


    # Select Table Format Options


    On the Columns tab set the width for each of the table''s columns. To add a border
    or a background select the Borders or Background tab, respectively, and make your
    selections for these settings. After you have completed setting the table format
    options, click OK.


    TIP


    You can change the width of the columns in the table by dragging a column border.


    TIP


    You can autoformat a table, which provides a number of ready-made formats that
    include different combinations of cell backgrounds and table grid formats. Select
    Format, Autformat (when you are in the table). Select an autoformat from the list
    and then click OK.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Insert a Text Frame


    Text frames allow you to add text boxes to your documents. These frames can be
    placed anywhere on the page, and options can be set for how the regular document
    text flows around the frame. You can insert a new frame from the Insert menu (select
    *Insert, Frame*). However, the easiest way to insert the frame is to use the Insert
    button on the Main toolbar. This allows you to create the frame and size it on-the-fly.


    # Insert Text Frame from Main Toolbar


    Select the arrow at the top of the Insert button on the Main toolbar. In the toolbox
    that appears, select the *Insert Frame* manually. When you move the mouse pointer
    onto the document, it will appear as a large plus (+) symbol. Hold down the left
    mouse button and drag the frame borders until the sizing handle appears. Drag
    to change the frame (drag over and then to create the size of rectangle that you
    want to create for the frame). When you release the mouse frame is inserted in
    the document.


    TIP


    You can move or resize the frame as needed. Place the mouse pointer on one of
    the frame borders until the sizing handle appears. Drag to change the size and
    shape of the frame. To move the frame, drag the frame to a new location or drag
    the anchor for the frame that appears to the left of the frame near the left margin.


    # Enter Text in Frame


    Click the 1-beam inside the frame and type the text that you want to place in
    the frame. You can format the text and change the text alignment (left, center,
    right, and so on) after typing the text. Click outside the frame when you have
    finished typing.


    TIP


    You can format the text in a frame as you would any other text in the document.
    You can change fonts, size, color, and layout such as columns.'
  merge: -1
  img_proc: true
