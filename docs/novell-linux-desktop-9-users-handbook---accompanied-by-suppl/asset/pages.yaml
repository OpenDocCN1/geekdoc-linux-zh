    60 About Updating Applications Using Red Carpet

    66 About Installing Applications from Other Archive Types


    Programs that you install on your system come as archive files. The most common
    and the easiest to deal with is the RPM file. RPM stands for RedHat Package Manager,
    which was developed originally for RedHat Linux. Other implementations of Linux
    including NLD and USE have embraced the RPM format because the program contained
    in the archive (the RPM) has been compiled and is ready to install.


    # KEY TERM


    RPM—An archived, compressed, and compiled software application, code library,
    or help file. RPM stands for RedHat Package Manager.


