  md: '# Set Page Style Options


    In the Page Style dialog box you can set page, border, and background settings
    using the appropriate tab. To set header or footer settings, select the Header
    or Footer tab. Set the header or footer spacing and margins using the appropriate
    spinner box.


    To place information in the header or footer, select the Edit button on the Header
    or Footer tab. The Header or Footer dialog box opens.


    Enter the information that you want to appear in the header or footer using the
    Left Area, Center Area, and Right Area panes. To enter information such as page
    number or date in the header or footer use the buttons provided below the header
    or footer area panes. After you have edited inserting the information for the
    header or footer, click OK. This returns you to the Page Style Dialog box. Click
    OK to close the dialog box.


    # Print Spreadsheet


    When you are ready to send your previewed print job to the default printer, select
    the Print File Directly button on the Page Preview window''s Function bar. The
    printout is sent to the printer.


    TIP


    You can also print the spreadsheet via the Print dialog box. This allows you to
    select the printer that you want to use for the print job and also allows you
    to set print options. Select File, Print to open the Print dialog box.'
  merge: -1
  img_proc: true
