- pgno: 368
  md: '# Mark Message as Junk


    In your Inbox (or other mail folder) select a message that is junk (you can select
    multiple messages). Select the Junk button on the toolbar to send the message
    to the Junk folder. This also teaches Evolution the message (taking into consideration
    sender and content) should be treated as junk in the future.


    # Check Junk Folder


    To open the Junk folder select the Junk icon in the Folder list. Any junk messages
    are listed in the folder.


    # Un-Junk a Message


    If a message has been sent to the Junk folder that is not junk, select the message.
    Then select the Not Junk button on the toolbar.


    TIP


    After viewing junk mail in the Junk folder (and un-junking messages that are not
    junk), you can select the messages in the Junk folder and delete them.


    # Create Virtual Folders


    Virtual folders or vFolders are not actually folders but views of messages that
    meet the criteria of a particular rule. So, a vFolder is a combination of a search
    and a filter (or filters) and allows you to quickly access messages that meet
    certain criteria.


    +   BEFORE YOU BEGIN


    +   Organize Your Email


    # Open Virtual Folder Editor


    In the Evolution window select Tools, Virtual Folder Editor. The vFolders dialog
    box opens.'
  merge: -1
