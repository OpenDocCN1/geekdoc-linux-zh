- pgno: 245
  md: '# Open New File from Template


    From the New submenu (select **File, New**), select **Templates and Documents**.
    This opens the Templates and Documents dialog box. To create a new Impress presentation
    from one of the templates provided (such as Introducing a New Product), select
    the template and then click Open.


    # Save a Document


    After you have started a new document and entered some information, you will want
    to save your work. The first time you select the Save command the **Save As**
    dialog box opens.


    +   BEFORE YOU BEGIN

    * 90 Start OpenOffice.org Applications

    * 93 Start a New File


    # Open Save As Dialog


    From any of the OpenOffice.org application windows, select **File, Save**. The
    Save dialog box opens.


    > TIP

    nYou can quickly save a new document by using the **Save Document** button on
    the Function bar.


    # Enter Filename


    Enter a new name for the file in the **Name** box.


    # Select Path


    The default path for saving your files is the Documents folder (in your Home folder).
