- pgno: 247
  md: '# CHAPTER 10: Working with OpenOffice.org Applications


    TIP


    After you have saved the document, you can quickly save changes that you make
    as you work; select the Save Document button on the Function bar. If you want
    to change the name, location, or file type of a previously saved document, select
    File, Save As. Enter the new filename and other information in the Save As box
    and then click Save.


    # 95 Open an Existing Document


    To read or edit an existing document you must first open it from the appropriate
    applications.


