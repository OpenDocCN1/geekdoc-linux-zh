    select Remove from the shortcut menu. The printer is removed from the Printers
    window (and deleted from your system).


    # 40 Configure Sound Settings


    Your sound card should be identified and configured during the NLD installation.
    The audio functionality is provided by Advanced Linux Sound Architecture (ALSA),
    which is licensed under GNU.


    # NOTE


    ALSA supports most sound cards. However, some new sound cards or even existing
    sound cards (from more obscure vendors) may not be supported. You can attempt
    to fine-tune the settings for an unsupported card and manually choose the driver
    for the card. In terms of supporting new hardware, sound cards include, it is
    important that you update your NLD system using Red Carpet whenever the Updates
    Available notification icon appears in the top panel of the desktop.


    When you boot NLD, your NLD system is initiated by the sound server. As a user,
    you can enable system sound events and select the sounds for specific events.
