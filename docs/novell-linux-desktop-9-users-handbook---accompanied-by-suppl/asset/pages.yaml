- pgno: 68
  md: '# About System Commands


    # Exit the Shell


    When you have finished working with the shell commands in the terminal window,
    you can close the terminal. Type exit at the command line and then press Enter.
    You are returned to the NLD desktop.


    # About System Commands


    +   BEFORE YOU BEGIN


    +   Access the Command Line


    There are also shell commands that can quickly provide you with information related
    to your computer system. For example, you can use the df command to view statistics
    related to your hard drive including the total amount of disk space and the free
    space available. Other shell commands can list information related to your computer''s
    memory and swap space and provide a list of processes (programs) that are currently
    running. Table 3.2 provides a list of some of the shell system commands.


    | TABLE 3.2 SYSTEM COMMANDS |

    | COMMAND | PURPOSE |

    | df | Lists the total disk space, space currently in use, and the free space
    (df stands for disk free). |

    | du | Shows the total amount of disk space in use in the current folder. |

    | free | Shows statistics on current memory and swap file use. |

    | date | Shows the current system time. |

    | ps | Displays a list of currently running processes (programs). |

    | kill | Used to terminate a process. This is a sort of last-ditch effort to kill
    a program that won''t shut down. The syntax is kill process ID. |


    The system commands provided in Table 3.2 are used to view information about the
    system. The only "dangerous" command is kill. kill should be used only in cases
    where you cannot get an application to close in NLD after you have tried all other
    possibilities. To use kill you must find the process ID for the offending application
    using the ps command.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# CHAPTER 3: Working on the NLD Desktop


    TIP


    Again, you may wonder why you need to know anything about the command line. It
    actually provides one of your recourses for troubleshooting when you are having
    problems with your system. If you are still feeling squamish about the command
    line and system commands, check out the System Monitor. This desktop-top tool
    allows you to view running processes and usage statistics related to the computer''s
    memory and processor. Select Programs, System Tools, and then System Monitor.


    # 17 Use System Commands


    +   - BEFORE YOU BEGIN

    - 13 Access the Command Line

    - 16 About System Commands


    A number of system commands are available to the end-user such as df and du that
    allow you to view the disk space currently used and the amount of disk space occupied
    by a particular folder, respectively. These system commands do not require you
    to be logged in as root (the superuser administrator account).


    # 1 Use the df Command


    In the GNOME Terminal window, type df at the command line and then press Enter.
    This shows you the amount of disk space used (and the percentage used) and the
    amount of free space on the drive (drive meaning volume).


    # 2 Use the du Command


    Use the 1s and cd to locate one of your folders. Type du and then press Enter.
    This shows the amount of disk space used in that folder.


    # 3 Use the free Command


    Type free at the command prompt and then press Enter. This shows you memory use
    and swap file statistics.'
  merge: -1
  img_proc: true
