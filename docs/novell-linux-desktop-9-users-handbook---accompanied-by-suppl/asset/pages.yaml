- pgno: 456
  md: '# # What''s On the DVD


    The book''s DVD includes the complete version of the Novell Linux Desktop 9.


    # # Hardware Requirements


    +   - Pentium II+, 266 MHz or higher, or any AMD64 or Intel EM64T processor

    - 1–2 physical CPUs

    - Minimum 128 MB (256 MB recommended, 64 GB maximum) physical RAM

    - 800 MB available disk space

    - 8 TB maximum disk space

    - 800 x 600 or higher display resolution; 1024 x 768 or higher suggested


    # # Installing Novell Linux Desktop


    You may need to change your BIOS settings to boot directly from a DVD drive. If
    you are not sure if can boot from a DVD, you should start or reboot your computer
    and go into the computer''s BIOS setup utility. Pressing the DEL (Delete) or the
    F2 key usually accesses this utility while the computer is starting up. Once in
    the BIOS setup utility, look for a boot priority option. If your computer is capable
    of booting from a DVD, your DVD drive has a higher boot priority than your hard
    drive(s) to enable booting from a DVD.


    Once you have determined that you can boot from the DVD, start or reboot your
    machine with the disc in your DVD drive. After a few moments, you should see the
    installation routine. Follow the onscreen prompts to finish the installation.


    NOTE


    To get Service Pack 2, you can download the ISO images from download.novell.com
    or use the Red Carpet update tools to download individual packages from update.novell.com.
    Service Pack 2 includes the most current device drivers for the supported architectures
    (x86, AMD64 and EMT64).'
  merge: -1
  img_proc: true
