- pgno: 240
  md: '# Open Options Dialog


    From any of the OpenOffice.org application windows, select Tools, Options. The
    Options dialog box opens. To view all the global options, expand the OpenOffice.org
    category (double-click on OpenOffice.org) in the left pane of the dialog box.


    Other global options include security, printing, and external program. You may
    want to leave these settings at the default as you begin your explorations of
    the various applications. The Options dialog box also provides access to settings
    for languages, text documents, spreadsheets, and presentations. These settings
    allow you to fine-tune the look and the features of the individual applications
    such as Writer and Calc. I would suggest that you begin using the applications
    with specific settings at default (feel free to edit the global settings excluding
    security, print, and external programs). You can then fine-tune settings specific
    to an application or document type as you become more familiar with the OpenOffice.org
    applications.


    # Enter User Data


    Select the User Data option. Enter the information including name, address, and
    so on. This information is used by the OpenOffice.org applications when you use
    a template to create a letter or send a fax or email directly from one of the
    applications.


    # Set General Options


    Select the General options. These settings relate to the date, the Help Agent,
    and document status. The date information is best left at the default. The Help
    Agent is also enabled by default (the Help Agent provides context-sensitive help
    as you perform tasks in OpenOffice.org). If you do not want to use the Help Agent,
    clear the Help Agent Activate check box. If you want documents to save changes
    after printing, select the Printing Sets “Document Modified” Status check box.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# CHAPTER 10: Working with OpenOffice.org Applications


    # 4 Configure View Options


    Select the View options. To change the look and feel of OpenOffice.org, select
    the Look and Feel drop-down list and select Macintosh, X Window, or OS/2 (the
    standard uses the default NLD view settings). Set other view options by selecting
    or clearing the appropriate check box (such as the heading or font options). If
    you want to set mouse positioning settings (where the mouse pointer automatically
    appears in a dialog box), select the Mouse Positioning drop-down list and select
    Default Button or Dialog Center (no automatic positioning is the default).


    TIP

    If you need help setting a particular option, select the Help button in the Options
    dialog box.


    # 5 Set Paths Options


    Select the Paths options. All the path options are determined when OpenOffice.org
    is installed on your computer (when NLD is installed). Use caution when changing
    the paths for any of the items other than Graphics or My Documents. OpenOffice.org
    may not operate properly if you do. To change the default location for saving
    and opening files, select My Documents and then Edit. The Select Path dialog box
    opens. For the new path and then click OK. The new path appears in the Options
    dialog box.


    # 6 Add and Edit Colors


    Select the Colors option. You can add colors to the color palette or edit existing
    colors (use in your applications as fill colors, frames colors, or font colors).
    To add a new color, type a name in the Name box and then click Add (then you need
    to modify the color). To modify the new color or an existing color, select the
    Modify button and specify the Red (R), Green (G), and Blue (B) mix for the color
    using the color spinner boxes. If you want to delete a color, select the color
    in the Color dropown list, and then select Delete. Click Yes to delete the color.


    TIP

    You can switch from RGB colors to CMYK colors. Select the RGB drop-down list and
    select CMYK. You can now "mix" colors using the Cyan, Magenta, Yellow, and Black
    spinner boxes.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Change OpenOffice.org Appearance


    Select the Appearance option. General settings and more specific settings (such
    as settings for text documents and spreadsheets) are available in this option
    dialog box. Use the check boxes to enable or disable an appearance setting such
    as Text Boundaries or Table Boundaries. To change the color and appearance setting
    for one of the enabled options (such as Text Boundaries), select the drop-down
    list to the right of the option and make a selection from the list (Automatic
    is the default setting for all options).


    # Close Options Dialog and Accept Settings


    If you have made your selections for the various global options provided in the
    Options dialog box, click OK to close the dialog box and accept the new settings.


    # About Sharing Documents with Microsoft Office Users


    OpenOffice.org makes it easy for you to share documents, spreadsheets, and presentations
    with users of Microsoft Office (Word, Excel, and PowerPoint). You can save your
    OpenOffice.org files in a format that can be opened by a Microsoft Office application.
    For example, you can save your Writer documents in a Word document format.


    OpenOffice.org can save files in Microsoft Office file formats.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_242_0.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# CHAPTER 10: Working with OpenOffice.org Applications


    You can also email documents, spreadsheets, and presentations directly from one
    of the OpenOffice.org applications (select File, Send from an OpenOffice.org application
    window). An option is provided that attaches the document in a Word or Excel format.
    This means that the recipient of the email can immediately open the sent file
    in the Microsoft Office application required.


    In cases where you must open a file created in Microsoft Office, you can open
    the file in the appropriate OpenOffice.org application immediately. Just select
    Open from the OpenOffice.org application''s Function bar and then browse to locate
    the file and then open it. OpenOffice.org opens the document, spreadsheet, or
    presentation without a hitch. You can then save changes that you make to the file
    in the original Microsoft Office format or Save As to save the document in the
    native OpenOffice.org XML file format.


    # 93 Start a New File


    You can start a new document, spreadsheet, or presentation from the OpenOffice.org
    File menu or from the New button on the Function bar. You can also start new documents
    or presentations based on a template. For example, you can quickly create business
    cards or mailing labels by choosing one of these options from the New submenu.
    You can also select from two presentation templates in the Templates and Documents
    dialog box (opened from the New submenu).


    +   ✓ BEFORE YOU BEGIN

    Start OpenOffice.org Applications


    # 1 Open New Blank Document


    From the OpenOffice.org application windows, select the New button on the Function
    bar. The new document opens.


    # 2 Open New File from New Menu


    You can also open a new document, spreadsheet, presentation, or drawing from any
    of the OpenOffice.org applications. Select File, New from the menu. On the New
    submenu, select the type of file that you want to create (such as Text Document,
    Spreadsheet, and so on). If the new file is not the type of file created in the
    current application, a new application window opens (with the appropriate application)
    for the new document.'
  merge: -1
  img_proc: true
