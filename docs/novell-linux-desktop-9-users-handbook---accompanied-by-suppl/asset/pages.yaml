- pgno: 383
  md: '# CHAPTER 15: Staying Organized with Novell Evolution


    Everyone needs to keep a calendar. Tracking appointments and job tasks (as well
    as personal tasks) can be a headache if a system isn''t available that provides
    appointment reminders and allows you to view tasks in progress and completed tasks.


    The Evolution calendar makes it easy for you to manage both your appointments
    and tasks. Evolution calendar also provides you with the ability to pull a meeting
    together by quickly sending electronic invitations to the participants and tracking
    their responses to the invitation.


    # 161 About the Evolution Calendar


    The Evolution calendar serves as an easy-to-use time-management tool that allows
    you to enter appointments (including recurring appointments), events, and tasks.
    The default view for the calendar shows the current day and any appointments scheduled
    for that day. The current month and the following month are also shown. A task
    list is also provided in the Evolution window, making it easy to monitor entered
    tasks and quickly add new tasks as needed.


    The Evolution default calendar allows you to quickly view your appointments for
    the day and monitor your task list.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_383_0.png)


    368'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'You may note that the shortcut icon for the calendar is actually called Calendars,
    and there is a good reason for the plural. You can quickly create a new calendar
    (the default is Personal) by right-clicking an existing calendar and then selecting
    New Calendar from the shortcut menu. Name the new calendar, and you are ready
    to add appointments to the calendar.


    When you use multiple calendars, the different calendars actually overlay each
    other in the Evolution window. Each calendar that you create is assigned a color
    code. Any appointments that have been entered in a particular calendar are color
    coded using the calendar color assigned when you created the new calendar.


    So, you can have a personal calendar (the default), a work calendar, a special
    project calendar—as many calendars as you need. The color coding allows you to
    differentiate an appointment on your personal calendar from your work calendar.


    Different views are also provided for the calendar pane, with the default being
    the current day. You can also quickly switch to a work week or month view of your
    calendars using the View menu.


    # Appointments


    You can create a new appointment for the current day or a future date (by selecting
    the date on the months shown). Appointment information that you enter includes
    an appointment summary, location, and starting time, and you can also set a reminder
    for the appointment. Appointments that you specify as All Day appear in the gray
    header area of the current day (or the day that you placed the appointment on).


    # Open New Appointment


    In the Evolution calendar window (select Calendars shortcut), select the New drop-down
    button on the toolbar and select Appointment. The Appointment dialog box opens.


    TIP


    You can quickly start a new appointment by double-clicking on a blank space on
    your daily calendar.'
  merge: -1
  img_proc: true
