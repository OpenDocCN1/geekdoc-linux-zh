- pgno: 35
  md: '# CHAPTER 2: Starting Novell Linux Desktop


    In this chapter we take a look at booting NLD, logging on to the system, and then
    logging off and shutting the system correctly. You might think that turning the
    computer on and then logging on to the system would be straightforward—and it
    is——but there are some logon options that we need to explore.


    First, to log on the system you need a valid username and password. The user could
    have been created by you during the NLD installation process or by your network
    administrator if you didn''t play a part in the NLD installation on the PC.


    # NOTE


    You only have rights to change or add user accounts if you have the root password.
    So, if your account has been created for you, you won''t be able to add users
    or change settings related to the user accounts.


    Logging on the system is straightforward after the user accounts have been established
    (particularly the user account you will use). You might also think that logging
    off and then turning off the system must really be a piece of cake; however, the
    Linux shutdown process can actually take some time as the various system processes
    are terminated. Pulling the plug (meaning turning off the power) on the system
    before the shutdown is complete can actually lead to corruption of the system
    files and loss of data. Let''s take a closer look at the logon screen and logon
    options.


    # 1 About Booting the NLD System and Logon Options


    When you boot the NLD system, your computer initializes its hardware (such as
    the processor). Then a boot loader, a small program that resides on the partition
    of your hard drive, begins to load the NLD kernel and passes control of the system
    over to Linux (in this case NLD). The boot loader program actually provides a
    text screen that allows you to select boot options such as a regular boot (Linux)
    or a boot to a floppy or failsafe boot, which provides a command line only.


    # KEY TERM


    Boot—The process where a computer is initialized, and an operating system is loaded.'
  merge: -1
  img_proc: true
