- pgno: 358
  md: '# Select and Preview Received Message


    Select a newly received message to view it in the Preview pane.


    # Open Message


    If you want to open a message in a separate window, double-click the message.


    # Select Reply


    To reply to the message select Reply on the message toolbar (or on the Evolution
