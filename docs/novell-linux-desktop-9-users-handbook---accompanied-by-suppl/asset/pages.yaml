- pgno: 238
  md: '# Open Application from Program Window


    You can also open a new drawing, presentation, spreadsheet, or document window
    from any one of the OpenOffice.org applications. Select the application windows,
    select File, New, and then select Text Document, Spreadsheet, Presentation, or
    Drawing A new application window opens for the OpenOffice.org application that
    creates the document type that you choose on the New submenu.


    # Switch Between Application Windows


    You can quickly switch between application windows open on the NLD desktop. Select
    the icon for the application window you want to switch to on the desktop''s lower
    panel.


    If you have multiple application windows open on the NLD desktop and want to keep
    all the applications open but clear your workspace, right-click on the bottom
    panel icon for any open application window. On the shortcut menu Move to Another
    Workspace and select one of the workspaces listed. This keeps the application
    window open but moves it to another of the virtual workspaces provided by NLD.
    To switch between workspaces, use the icons on the far right of the bottom panel.


    # Close Application


    After you have completed working with an application, select the Close button
    for that window (or select File, Exit). Make sure that you save any changes to
    the current document if alerted when closing the application.


    # Configure OpenOffice.org Global Options


    You can configure a number of global options that affect all the OpenOffice.org
    applications. These global options include user data (such as your name and other
    information), the view settings for the applications, the folder paths for graphics
    and your saved files, and appearance settings such as colors and boundaries.


    | BEFORE YOU BEGIN | SEE ALSO |

    | 89 About OpenOffice.org | 96 Get Help in OpenOffice.org |'
  merge: -1
  img_proc: true
