    165 Create Tasks


    # 2 Open New Task


    To create a new task, select the New drop-down arrow on the toolbar and then select
    Task. A new task dialog box opens.


    # 3 Enter Task Information


    On the Task tab of the new task dialog box enter the summary and description for
    the task. In the Date and Time area of the Task tab use the drop-down lists to
    set the Due Date and Start Date for the task as needed.


    378'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# TIP


    To quickly start a new task click in the **Click to Add a Task** box in the Task
    pane. Type the name of the new task. To edit the task, including setting the task
    status, double-click the task in the Task list.


    # Enter Task Status


    Select the **Status** tab of the task''s dialog box. Set the status of the task;
    select the **Status** drop-down list and then select **In Progress**. To set the
    priority, select the **Priority** drop-down list and then select **High**, **Normal**,
    or **Low**. To close the dialog box and add the task to the Task list, click OK.


    # TIP


    After you have completed a task, you can select the task''s check box in the Task
    list. Or you can open the task (double-click the task), select the **Status**
    tab, and then select **Completed** on the **Status** drop-down list.


    # 166 Create Assigned Tasks


    You can assign tasks to co-workers or subordinates. When you assign a task, the
    assignee has the option of accepting or rejecting the task.


    # 1 Open Assigned Task


    Select the New drop-down arrow on the toolbar and then select **Assigned Task**.
    A new task dialog box opens.


    # 2 Open Select Contacts from Address Book Dialog


    Task participants are entered on the task''s Assignment tab. You are added as
    a participant automatically (you can remove yourself using the **Remove** button
    if you want). To add additional participants from your address book select the
    **Contacts** button. The Select Contacts from Address Book dialog box opens.'
  merge: -1
  img_proc: true
- pgno: 395
