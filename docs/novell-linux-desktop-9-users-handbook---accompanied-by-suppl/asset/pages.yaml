  md: '# CHAPTER 12: Creating Spreadsheets with OpenOffice.org Calc


    ![](img/6e85ebc4ce06a64c82109523b60183ba_307_0.png)


    # Name Database Range


    Type a name for your database in the Name box of the Define Database Range dialog
    box. You can enter any descriptive name; this is not a filename. The name is used
    to identify the database (the selected list) only. Click OK.


    # Open Sort Dialog Box


    Now you can sort the database by a particular field (column heading). Click in
    any cell that is part of the database list that you named in step 2. Select Data,
    Sort. The sort dialog box opens.


    # Sort Database


    Select the first field drop-down box to select the field (column heading) that
    you want to use to sort the list. If you want to use a secondary sort criterion
