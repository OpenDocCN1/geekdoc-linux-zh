- pgno: 59
  md: '# CHAPTER 3: Working on the NLD Desktop


    # 3 Do a Simple Search


    To quickly search for specific Help content, enter a search term in the Search
    box above the navigation area; then click the Search button. The results of your
    search appear in the view window. Select specific links provided as search results
    to view the topic pages.


    # 4 Select the Search Tab


    You can also run a more complex search, which provides you the ability to set
    more parameters for the search. Select the Search tab of the Help navigation area.
    Before you run the search, you need to generate a search index for content that
    the Help system contains. Click the Create Search Index button at the bottom of
    the Search pane. This opens the Build Search dialog.


    # 5 Generate Search Index


    In the Build Search Index dialog, select check boxes of index topics that currently
    have a status of missing (meaning that an index has not been generated for these
    topic areas). Then click OK to generate the indexes. The Build Search Indices
    message box declaring that the index creation is complete. Click Close to close
    this message box.


    # 6 Run Advanced Search


    Enter your search criteria in the Search box. Set the Method drop-down to either
    and (the default) or or. Use the Max Results drop-down box to select the number
    of results you want to receive from the search. The final step is to set the scope
    for the search.

    You can use the Scope drop-down list to select All or Custom (None is also a selection
    possibility but does not apply in this case). If you select Custom, you can then
    use the check boxes provided in the Scope area of the Search pane to select individual
    topics to include in the scope. After determining the scope, click the Search
    button. The Search results appear as links in the view window.


    TIP


    To view a list of Glossary terms (and access their definitions), select the Glossary
    tab of the Help navigation area. You can view the glossary alphabetically or by
    topic.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Run a Program from the Run Application Dialog


    # Run a Program from the Run Application Dialog


    +   SEE ALSO

    20 Add Items to a Panel

    21 Add Items to a Menu

    63 About Finding and Installing New Applications


    GNOME provides menu icons for many of the applications and applets installed when
    you run the NLD installation. These menu icons are present on either the Run or
    System menus. Additional applets and other useful utilities are installed with
    NLD that are not represented on the menu system. One way you can run these is
    from the Run Application dialog.


    NOTE


    The Run Application dialog is really one way of accessing the NLD command line.
    You must know the command that starts a particular application or applet to take
    advantage of the Run Application dialog.


    The Run Application dialog is also useful if you add applications or applets to
    your NLD installation (you can download any number of GNU applications and applets
    for Linux distributions such as NLD). Seldom-used applications and applets can
    be run from the Run Application dialog. However, if you find that you are using
    an application or applet a lot, it makes sense to add that application or applet
    to a panel (such as the top panel) as a shortcut or add to a menu.


    # Open the Run Application Dialog


    Select the System menu on the top panel and select Run Program The Run Application
    dialog opens. To view a list of the applications installed with NLD, select the
    Show of known applications. This list does not list all the applications or applets
    available. You can view the command that actually starts one of the listed applications
    by selecting a particular application in the known applications list.


    NOTE


    Understanding file types and finding specific files, particularly those that launch
    applications, requires that you have an understanding of how programs are installed
    and then launched in NLD. See Chapter 7, "Adding and Managing Software Applications
    and Tools in NLD," for more information.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# ## CHAPTER 3: Working on the NLD Desktop


