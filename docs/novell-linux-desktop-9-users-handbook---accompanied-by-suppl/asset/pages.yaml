- pgno: 362
  md: '150 Read, Sort, and Search Your Email


    # TIP


    To change the width of a column in the message list so that you can see the longest
    entry in that column (such as the email subjects), right-click on that column
    heading and select Best Fit.


    +   3 Open Add a Column Dialog


    You can add additional columns to the message pane. Right-click on one of the
    current columns and select Add a Column.


    +   4 Add a Column


    Drag a column listed in the Add a Column dialog box to the column area of the
    message list. The column is added. You can then use the column to sort the messages
    in the currently selected folder.


    # TIP


    If you want to remove a column from the message list, right-click the column heading
    and select Remove This Column.


    +   5 Search


    You can quickly search for email messages in the Inbox (or any mail folder). Select
    the Rule drop-down list and select a search criterion such as Subject Contains,
    Subject Does Not Contain, Sender Contains, and so on. After selecting the criterion,
    enter the search parameter (keywords) in the Search box. When you are ready to
    search, select the Find Now button. The message list is filtered by your search
    parameters, and only the messages meeting the search parameters are listed in
    the message list.


    # TIP


    If you need to search with multiple search criteria (say you want to search by
    Subject Contains and Sender Contains, using more than one rule at a time), select
    Advanced Search in the Rule drop-down list and then add criteria to the Advanced
    Search dialog box to conduct your complex search as needed.


    # TIP


    To reset the search feature and show all messages in the message list, select
    the Clear button.


    347'
