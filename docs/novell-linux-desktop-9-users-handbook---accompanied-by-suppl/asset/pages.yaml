    the installation process. When the installation is complete, click OK. You can
    also close the Red Carpet window at this point.


    # 4 Run Application


    You now run the application in the Run Application dialog box (select System,
    Run Program). Enter the program name in the Run Application dialog and then select
    Run. The-program opens on the NLD desktop.'
