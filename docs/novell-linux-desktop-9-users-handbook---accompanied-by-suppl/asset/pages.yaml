  md: '![](img/6e85ebc4ce06a64c82109523b60183ba_458_0.png)


    SMTP server—the server that accepts your email when you send an email. The SMTP
    server then passes the email on to its final destination.


    **Theme**—Settings that affect the look of program and utility windows including
    the frame and controls. Themes also control the look of certain desktop and panel
    icons.


    **Virtual desktop**—A separate workspace that can be used to run applications.
    Each workspace uses the GNOME desktop, but each workspace is a discrete operating
    space, which allows you to keep the actual desktop (within each virtual desktop)
    less crowded (with application windows).


    **X Window System**—The graphical display system used by many Linux implementations
    including NLD.


    XML—or Extensible Markup Language is a markup language that allows for the creation
    of extended tags (a tag language like HTML). It provides a universal file format
    that can be embraced by many different types of applications.'
