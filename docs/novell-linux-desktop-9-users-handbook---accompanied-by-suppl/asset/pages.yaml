    Cookies cannot spread viruses or do bad to your computer''s hard drive. But some
    websites use cookies to record your preferences and other information without
    you knowing it and then use to show you certain advertisement content or bombard
    you with certain pop-ups. So, cookies can be annoying, but they certainly aren''t
    a threat to your system.


    # TIP


    If you don''t want to deal with nefarious cookies, you should stay off nefarious
    websites. The types of sites that you browse at home are one thing, but in a professional
    environment, stay away from sites of an unsavory nature (you''ll have to decide
    what you consider unsavory).


    In some cases a cookie is required to use a website. This is particularly true
    of sites that you subscribe to and that use a logon name and password to enter
    the site.

    Firefox actually provides you with lot of flexibility in dealing with cookies.
    You can create cookie rules and then accept or reject cookies-on-the-fly as you
    browse the Web. By default Firefox is configured to accept all cookies. In some
    cases, blocking a cookie (or deleting a cookie from the cookie list) keeps a particular
    site from functioning correctly when you attempt to go to that site.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# CHAPTER 8: Browsing the World Wide Web with Mozilla Firefox


    # 78 Accept and Reject Cookies


    You can configure Firefox so that it allows you to accept and reject cookies from
    websites as you browse the Web. Cookie-related settings are configured in the
    Firefox Preferences dialog box.


    +   - BEFORE BEGIN


    +   -77 About Cookies and Firefox


    # 1 Open Firefox Preferences


    From the Firefox window, select Edit, Preferences. The Preferences dialog box
    opens.


    # 2 Select Privacy Settings


    In the Preferences dialog box, select the Privacy icon to view the cookie settings.
    Select the Keep Cookies drop-down list. To have the option to deny or select cookies
    as you browse, select Ask Me Every Time.


    > TIP


    If you don''t want to allow any cookies, clear the Allow Sites to Set Cookies
    check box. But be advised that disallowing cookies can make many websites, more
    than you would imagine, act odd and in many cases unsatisfactory.


    # 3 Open Website Exceptions


    If you want to negate your cookie settings for a few exceptions, click the Exceptions
    button. The Exceptions dialog box opens.


    # 4 Enter Exceptions


    Type a website URL in the Address of Web Site box and then select Block, Allow
    for Session, or Allow. These exceptions should be the antithesis of your main
    cookie settings (in the Preferences dialog), meaning that if you are blocking
    all cookies, some sites will be “allowed” to set cookies when you add them to
    the list and select Allow. After entering the exceptions, click OK.


    You returned to the Preferences dialog box. Click OK to save your preferences
    and return to the Firefox window.'
  merge: -1
  img_proc: true
