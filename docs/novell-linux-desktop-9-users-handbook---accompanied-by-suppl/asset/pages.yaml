    ![](img/6e85ebc4ce06a64c82109523b60183ba_378_0.png)


    # 159 Use Categories to Group Contacts


    # Assign Categories to Contact


    In the Edit Categories dialog box, select the check box for a category or categories.
    After you have finished selecting the categories for the contact, click OK. This
    returns you to the Contact Editor. After you have finished editing the information
    for the contact, click OK.


    # TIP


    A number of existing categories are provided by Evolution by default. You can
    also create your own categories. In the Edit Categories dialog box select the
    Edit Master Category List. The Edit Global Category List dialog opens. Select
    the Click Here to Add Category box and then add a new category. Repeat as needed
    to build a list of custom categories.


    # Import Contacts


    You can import contacts from existing address books or email software (installed
    on your NLD system), or you can import files from other contact management software.
    You must export and save the data using the other contact management software
    before you attempt to import it into Evolution (meaning the data must exist as
    a file). Because Evolution serves as the default email and address book manager
    for NLD (meaning, you probably have not been running other address book or email
    software on your NLD installation), most situations will involve an import of
    data from another groupware product.


    363'
