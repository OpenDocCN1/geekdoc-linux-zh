- pgno: 159
  md: '# CHAPTER 6: Managing Files


    # 6 Burn CD


    When you are ready to burn the CD (or DVD) select the Burn button on the right
    of the project''s dialog box. The files are burned to the CD. The Writing Data
    dialog box shows the progress of the burn process. When the process is complete,
    you can close this dialog box. When you close K3b, you are given the option of
    saving the parameters from the CD creation session.


    # TIP


    There is also a quick but less elegant way to burn CDs directly from the Nautilus
    window. Select Go and then CD Creator. Drag folders and files that you want to
    place on the CD onto the CD Creator window that appears. Then select File, Write
    to CD.


    # TIP


    When you use removable media such as CDs, right-click on the device''s icon and
    select Eject before removing the media. The Linux system to "unmount" the media
    before removal. Do the same for floppies; right-click on the icon and remove them
    from the file system before ejecting the disk.


    # 54 About Archiving Files


    You can take files and archive them into a single, compressed file: This is useful
    in cases where you want to carry a bunch of files on removable media with limited
    disk space, to prepare older files for backup, or want to send files via email
    or upload to a website.


    Archive files are created with the File Roller application. File Roller also has
    the capability to extract files from archives, which can be useful in cases where
    you download Linux applets or other items from the Web that have been saved as
    an archive. Any number of folders and files can be saved in an archive file.


    File Roller allows you to create (and open) archives in different formats. Some
    of the common (more are supported) file formats


    +   - arj—A compressed file type (.arj) using the ARJ32 archive program.

    - java—A java compressed file format (.jar) created using the jar command.

    - lha—A archive format (.lha) created using the LHA archive command.'
  merge: -1
