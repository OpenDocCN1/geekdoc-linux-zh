- pgno: 127
  md: '# CHAPTER 5: Configuring NLD Hardware and System Settings


    # 42 Change Session Settings


    A session, which loads your GUI environment, begins when you log on and ends when
    you log off. In the Sessions dialog box, you can control session settings such
    as the display of a confirmation box when you end a session (by logging out) and
    whether changes to a particular session are automatically saved. These changes
    would be in the form of changes to the GNOME desktop (icons, colors, fonts, and
    so on) and application and app windows left open (or minimized) on the desktop.


    When you save the changes to your current session, any applications open on the
    desktop will start automatically the next time you log on to the session. This
    means that you can park commonly used applications (and a particular document
    or spreadsheet) and get back to work the next time you log on.


    Not all programs automatically reload when you log back on your session. These
    are referred to as nonsession managed applications (as opposed to session managed
    applications such as OpenOffice, Firefox, and most all the NLD applications).


    An example of a nonsession managed application would be a utility or tool that
    must run from a terminal window. If you want to run nonsession managed applications
    upon logging on to a session, you can add them to the Startup Tabs of the Sessions
    dialog box.


    # BEFORE YOU BEGIN


    +   - About Booting the NLD System and Logon Options


    +   - Change Personal Settings


    +   - About Configuring Hardware and System Settings in NLD


    # Set Sessions Dialog


    From the Settings dialog (select System, Personal Settings), double-click the
    Sessions icon in the System pane. The Sessions dialog box opens.


    # Set Session Options


    By default the session options are configured to show a splash screen at logon
    (that is, the NLD splash screen you see as GNOME is loaded) and prompt you to
    save changes to your session at logout. If you want changes to your current session
    saved automatically when logging off, select the Automatically Save Changes to
    Session check box.'
  merge: -1
  img_proc: true
