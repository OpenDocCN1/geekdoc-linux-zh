    # 71 Control Pop-ups in Firefox


    Pop-ups are those annoying windows that open up automatically as you are browsing
    the Web. Firefox is configured by default to block pop-up windows. In some cases,
    however, you may use websites where you want pop-ups to be allowed. You can temporarily
    allow pop-ups for a particular site, and you can also configure the pop-up options
    for Firefox in the Preferences dialog box.


    +   - BEFORE YOU BEGIN


    +   - 68 Browse Web Pages


    # 1 Temporarily Allow Pop-ups


    As you browse the Web a message may appear at the top of the page''s window that
    says Firefox prevented this site from opening a pop-up window. To access pop-up
    options for this site, click to the right of the message. In the options menu
    that appears Allow Popups to temporarily allow pop-ups for the site.


    # 2 Open Preferences Dialog


    You can configure the options for the Pop-up Blocker. Select Edit, Preferences
    from the menu. The Firefox Preferences dialog box opens.


    TIP


