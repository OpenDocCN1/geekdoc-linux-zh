- pgno: 351
  md: '# CHAPTER 14: Managing Email and Contacts with Novell Evolution


    # 4 Enter Identity Information


    Enter your name and email account on the Identity screen. If the account will
    be the default account, select the Make This My Default Account check box. You
    can also enter optional text such as reply to and organizational information (which
    appears on all sent emails). Select Forward to continue.


    # 5 Enter Receiving Mail Information


