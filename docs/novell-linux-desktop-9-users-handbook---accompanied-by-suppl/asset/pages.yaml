- pgno: 135
  md: '# CHAPTER 6: Managing Files


    It is important to be able to manage the files that you create using the various
    productivity tools provided by NLD. You need to be able to create folders (directories)
    to store your files and be able to locate, copy, move, and delete files when necessary.


    In this chapter we take a look at managing files using Nautilus, NLD''s GUI file
    manager. We look at how you access or save files to portable media such as a USB
    stick (drive) and burn files on CDs or DVDs. We also look at how to archive files
    and back up and restore files.


    # 44 About the Linux File Structure and Nautilus File Manager


    Before we put the Nautilus File Manager to the test in terms of working with files,
    we should take a look at the Linux file structure. Linux uses a hierarchy, diverging
    file system. You can think of each folder (or directory, as a container. The top
    of the file system and the hierarchical start of the system is the root, which
    is designated by a slash (/). Every other folder branches off the root, and each
    folder can contain subfolders increasing the number of sub-branches in the hierarchy.
    So in a simple representation of the Linux file structure that you will deal with
    when using NLD, the root (/) would be on the left of the diagram, and all the
    main folders (often referred to as standard folders or directories) would branch
    to the right. Any subfolders in the main folder would provide further sub-branches.


    Root is the / container at the top of the file system hierarchy. There is also
    a folder root, which contains folders and files for the root user (administrator).
    It is the root user''s home folder and cannot be opened unless you are logged
    in as root. The root (/) is the logical top of the file system.


    You can access the file system using Nautilus (which is also often referred to
    as the File Manager in the NLD Help documents) and view all the main folders contained
    in the root. To view the contents of a particular folder (subfolders or files),
    double-click on that folder.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# 44 About the Linux File Structure and Nautilus File Manager


    The Linux file system is hierarchical with root at the top of the system.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_136_0.png)


    You can use Nautilus to view the file system structure.


    ![](img/6e85ebc4ce06a64c82109523b60183ba_136_1.png)


    121'
