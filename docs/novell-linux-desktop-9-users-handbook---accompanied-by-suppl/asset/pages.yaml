- pgno: 338
  md: '# Add Notes in the Notes View


    Open the Notes view (select View, Workspace, Notes View). The current slide is
    represented by a thumbnail, and a text box appears below the slide. Enter text
    as needed to the notes text box. This can be notes you will use when you give
    your presentation or reminders related to the presentation.


    # TIP


    When you print a presentation from the Print dialog box, you can select to print
    the notes that you have typed on the various slides.


    # Rehearse Slide Show Timings


    The Rehearse Slide Show Timings feature allows you to set up the timings for an
    automated presentation. You actually run the slide show, and a timer appears in
    the bottom-left corner of the screen. You can then deliver your "speech" and talk
    about the content of each slide as you would giving the presentation. When you
    want to "set" the onscreen duration for a particular slide and move onto the next
    slide, you click on the timer on the slide show window.


    These settings are saved with your presentation. The next time you run the automated
    presentation, the slides change based on the timings that you set during your
    "dry run" of reading a slide show. Because setting transition effects is another
    aspect of presentation, the best place to select transitions and review the automatic
    slide timings is the Slides view.


    # Open Slides View


    The fastest way to choose transitions for your slides and then run the Rehearse
    Timings feature is the Slides view; select View, Workspace, Slides View from the
    menu.


    # Set Transitions to Automatic


    Select all the slides in the presentation and then set the Transition drop-down
    list to Automatic.'
