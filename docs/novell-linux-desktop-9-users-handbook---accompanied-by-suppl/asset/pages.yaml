- pgno: 107
  md: "# Open Keyboard Preferences Dialog\n\nIn the Settings dialog box (select **System,\
    \ Personal Settings**) double-click the **Keyboard** icon.\n\n# Configure Repeat\
    \ Keys and Cursor\n\nOn the **Keyboard** tab of the Keyboard Preferences dialog\
    \ box, use the **Delay** and **Speed** slider bars below the Repeat Keys check\
    \ box to set the time delay for when a key should repeat (for example, how long\
    \ it takes for the letter *d* to repeat when you hold down the *d key*) and the\
    \ speed (how fast the action is repeated) of repetition, respectively. To set\
    \ the cursor blind speed (how rapidly it blinks), use the **Cursor Blinking Speed**\
    \ slider bar.\n\nIf you change repeat key and cursor blink settings on the Keyboard\
    \ tab, use the Type to Test Settings box to enter some sample text and test the\
    \ new settings. \n\n# Configure Typing Breaking Settings\n\nSelect the **Typing**\
    \ tab of the Keyboard Preferences dialog box. This allows you to set typing breaks.\
    \ A typing break is designed to force you to take a break from the keyboard and\
    \ so is an optional setting. To configure typing breaks, select the **Lock Screen\
    \ to Enforce Typing Break** check box. Then enter the time settings in the **Work\
    \ Interval Lasts** and the **Break Interval Lasts** spinner boxes. If you want\
    \ to have the ability to postpone a “forced” break, select the **Allow Postponing\
    \ of Breaks** check box.\n\nIf enabling typing breaks, a red timer appears on\
    \ the top panel. Place the mouse on it to see how much time is left until the\
    \ next break. When the break begins Take a Break dialog box opens and shows the\
    \ amount of time left in the break. To postpone the current break (you must enable\
    \ the Allow Postponing of Breaks check box), select the **Postpone Break** button\
    \ that appears in the lower left of the “frozen” desktop."
  merge: -1
