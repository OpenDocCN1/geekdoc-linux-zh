- pgno: 280
  md: '# 109 Place Graphics in a Document


    # Insert Graphic


    In the Insert Graphic dialog box browse to find the image that you want to place
    in the document. Select the file and then select Open.


    # Size Graphic


    Place the mouse pointer at one of the corners of the inserted graphic (to maintain
    the height/width ratio) and when the sizing tool appears drag diagonally to size
    the picture.


    # Open Graphics Dialog


    When the graphic is selected, the Object bar provides a set of tools for editing
    the image; for example, you can use the Red, Green, and Blue buttons to adjust
    the RGB ratios for the picture. To open the Graphics dialog box for the picture
    (and adjust settings) select the Graphics Properties button on the Object bar
    (the first button on the right of the toolbar).


    # Set Graphic Properties and Crop Image


    In the Graphics dialog box you can adjust the type, wrap, borders, and backgrounds
    for the image (select the appropriate tab and configure options as needed). You
    can also crop the image in the Graphics dialog box. Select the Crop tab on the
    Graphics dialog box. Use the Left, Right, Top, and Bottom spinner boxes to crop
    the image as needed. As you are adjusting the settings, crop marks appear on the
    preview image for the Crop tab. After you have completed configuring the settings
    for the image, click OK.


    TIP


    You can set the transparency for the image on the Object bar (when the image is
    selected); use the transparency spinner box on the Object bar. This allows you
    to add special effects such as watermarks to a document because you can then choose
    to have the text in the document to wrap through (on the Wrap tab of the Graphics
    dialog box, select Through) the image, which in effect uses the graphic as a background
    for the text.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# CHAPTER 11: Creating Documents with OpenOffice.org Writer


    110 Do a Mail Merge

    No matter what your business, it is useful to be able to create a form letter
    and then create individual letters for a list of people. Writer walks through
    the process of creating a form letter and merging the letter with a data source
    that provides the names and addresses of the individuals you want to receive the
    letter. You can also do mail merges to other document types such as envelopes.
    The easiest data source to prepare for your mail merges is the Contact list in
    Evolution (the NLD personal information manager and email client).


    +   BEFORE YOU BEGIN

    154 About the Evolution Address Book

    155 Create a new Contact


    +   1 Type Letter

    The best first step in preparing for the mail merge is to start a new document
    and create your form letter. You can type the body text and add fields to the
    document as the date field (select Insert, Fields, Date).


    +   2 Begin Mail Merge Process

    To begin the mail merge process, select Tools, Mail Merge. The Mail Merge dialog
    box opens.


    +   3 Select Current Document

    Select From This Document in the Mail Merge dialog box and then click OK.


    +   4 Select Data Source

    A warning box opens telling you that a data source has not been set up for the
    merge. Click OK to close the box. The Address Source AutoPilot opens. Select Evolution
    as the data source. Then click Next.


    TIP

    You need to set up your data source, meaning enter your contacts in Evolution
    before performing the mail merge. You can then specify the contacts that should
    be included in the merge.'
  merge: -1
  img_proc: true
