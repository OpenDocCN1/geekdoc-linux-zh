- pgno: 289
  md: '# CHAPTER 12: Creating Spreadsheets with OpenOffice.org Calc


    Everyone has to do occasion some number crunching in the form of invoices, balance
    sheets, or budgets. OpenOffice.org provides Calc, a full-featured and easy-to-use
    spreadsheet program. In this chapter, we look at how to create basic spreadsheets
    and take advantage of Calc''s many features including functions, chart creation,
    and the printing of spreadsheets.


    # 113 About OpenOffice.org Calc


    Calc provides all the capabilities and features that you would expect from a spreadsheet
    program. It provides to you with the ability to create both simple and complex
    spreadsheets. And because it shares a common interface with the other OpenOffice.org
    applications, as Writer, the working environment where you create your spreadsheets
    will be immediately familiar no matter which of the other OpenOffice.org applications
    you use most often.


    The Calc application window provides some toolbars as the other OpenOffice.org
    applications. There is the Function bar, Object bar, and Main toolbar. These toolbars
    provide many of the same button and functions as you will find in the other applications.
    However, the Calc Object bar and Main toolbar provide access to tools that are
    specific to working in a spreadsheet, such as tools for sorting data and formatting
    tools that make it easy to format numerical data as currency or percentages.


    The Calc application window is also different from the other OpenOffice.org applications
    in that is designed to create spreadsheets. The Calc window contains an additional
    toolbar called the Formula bar, which provides access to Calc built-in formulas
    (called functions) and provides a box that shows you the contents of the currently
    selected cell.


    So, if Calc is designed to create a spreadsheet, what do spreadsheets look like?
    Spreadsheet is really a generic term that refers to the file type that is created.
    When you work in Calc you are actually working on a particular sheet. Each sheet
    consists of columns and rows. The intersection of a column and a row is referred
    to as a cell. You can place data in each cell. Each spreadsheet file, which is
    the file that you save when you save your work in Calc, can consist of multiple
    sheets.


    Each sheet contains 256 columns, and each column is designated by a letter such
    as A, B, C, and so on. After Z the letters repeat AA, AB, and so on until you
    get to IV the column in the sheet.


    Each sheet has 32,000 rows available. Each row is designated by a number (1, 2,
    3, to 32000).'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'So, with 256 columns and 32,000 rows, you have 8,192,000 cells in a sheet.
    Each cell has an address based on the column and row that intersect to create
    the cell; for example, a cell in column A and row 1 would be Cell A1.


    # TIP


    Don''t be intimidated by the fact that there are so many columns, rows, and cells
    in each sheet. Even large spreadsheets use only a fraction of the cells provided.
    The fact that each spreadsheet can contain multiple sheets means that you can
    break your spreadsheets down smaller endeavors by using multiple sheets. For example,
    each quarter of the year could be placed on a separate sheet instead of placing
    the entire year on one sheet. Sure, there is certainly room for a lot of data
    on one sheet, but in terms of viewing and printing data, using multiple sheets
    is easier on the eyes and makes it easier to print your work.


    When you build a spreadsheet (meaning a sheet, really), you enter text and numbers
    into the various cells. The true power of Calc is its capability to perform a
    wide variety of mathematical calculations on the numerical data you enter on the
    sheet. It also provides you with the ability to create a chart based on the data,
    which provides a pictorial view of the data and the results of formulas in the
    sheet.


    # 114 Enter Text and Data


    To create your spreadsheets you will enter text, which serves as descriptive data
    such as column or row headings; numbers, which have numerical significance (meaning
    they can be acted on by formulas); and formulas and functions (for formulas you
    create; functions are built into Calc). Entering text and numerical data is straightforward.
    You click on the mouse and then you enter the information that you want in the
    cell. When you press Enter the cell selec-tor moves down to the next cell in the
    column.


    +   BEFORE YOU BEGIN


    +   97 About OpenOffice.org Writer


    # Start Calc


    From the NLD desktop, Select Programs, Office, Spreadsheet The Calc window opens.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# CHAPTER 12: Creating Spreadsheets with OpenOffice.org Calc


    ![](img/6e85ebc4ce06a64c82109523b60183ba_291_0.png)


    # Enter Text


    Click in a cell that will contain text. Type the text. After you have completed
    entering the text, press Enter. The text is placed in the cell, and the cell selector
    moves to the next cell down. Enter other text as needed. Notice that text is aligned
    in the cells.


    # TIP


    You can also enter typed text in a cell by pressing an arrow key. This moves you
    to another cell in the direction of the arrow key.'
  merge: -1
