- pgno: 154
  md: '# Access and Save Files to a USB Memory Stick


    ![](img/6e85ebc4ce06a64c82109523b60183ba_154_0.png)


    # Access and Save Files to a USB Memory Stick


    # Insert USB Drive


    Insert the USB drive into a USB port on your computer. A hardware detection dialog
    opens. If you want this dialog box to open each time you insert the USB drive,
    clear the Do Not Ask Again check box.


    TIP


    To remove the USB drive, make sure that you close all applications and applets
    accessing the drive. You can then remove the drive. If this makes you queasy,
    open a terminal window, type su, and then press Enter. Type the root password
    (and press Enter). Type mount /media/usb* and press Enter. You can type exit and
    then press Enter to go as root, and then type exit and press Enter again to close
    the terminal. In some cases, the light on the USB drive will still be blinking,
    but you can now remove it. If you still don''t want to just yank out the drive,
    power down the system and then remove the USB drive.


    # Close Hardware Detection Dialog


    Select Yes on the Hardware Detection dialog box to open the USB drive.


    139'
