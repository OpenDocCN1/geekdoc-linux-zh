    每个 AS 会告知其对等方，哪些 IP 地址可以在该 AS 中到达。例如，如果你的公司拥有 192.168.8.0 至 192.168.8.255 的 IP
    地址段，你的路由器会告诉 AS200 和 AS300，它们应该将发往这些 IP 地址的数据包发送到你的网络。这被称为`路由公告`。你从对等方收到的每条路由公告都会占用一小部分内存。


    同样，你的每个对等方也会告知你的路由器，通过它们的网络可以到达哪些路由，以及你的数据包将经过哪些网络才能到达目的地。例如，你的 AS200 对等方会告诉你，要到达
    AS700 背后的网站，你的数据包将经过 AS200、AS400、AS600 和 AS700。这条 AS 编号链被称为`AS 路径`。


    你的路由器将根据 AS 路径来决定数据包的发送方向。通过 AS200 对等方到达目标网站，你的数据包需要经过四个自治系统；通过 AS300 对等方到达目标网站，数据包只需经过三个自治系统。由于经由
    AS300 对等方的 AS 路径更短，BGP 规定你的路由器将通过 AS300 发送发往该网站的数据包。


    配置 BGP 时，你必须决定从每个对等方接收多少路由信息。`完整路由`意味着你的对等方会发送它所知道的关于互联网上每个网络的所有信息。`部分路由`意味着对等方只会发送直接连接到该网络的路由。`不接收路由`意味着你的路由器不会从该对等方接收任何路由信息。选择不接收完整路由的主要原因是减少内存使用；在这种情况下，你通常从较小的对等方接收完整路由，从较大的对等方接收部分路由；如果你的内存确实非常紧张，你可能会从较小的对等方接收部分路由，从较大的对等方不接收路由，并选择将较大的对等方作为默认路由，前提是较大的对等方直接连接的网络比你较小的对等方更多。


    路由的设计目的是在单条路由声明中覆盖尽可能多的 IP 地址。大型 ISP 尽可能公告 /16 或更大的地址段。全球互联网接受的最小路由公告是 /24（即以前所说的"C
    类"网络）。要使用 BGP，你的网络必须拥有至少一个 /24 的地址段。¹


    > ¹ 如果本段内容中任何部分让你感到困惑，请阅读附录。


    ## BGP 不是什么


    BGP 不是一种负载均衡协议。如果你有两条互联网线路，BGP 不会将负载均匀分配到这两条线路上。不过，BGP 会通过选择最佳的 AS 路径来发送数据包，从而达到类似的效果。但如果其中一个运营商的连接远优于另一个，每次都会选择更优的那个运营商，导致线路使用不对称。


    BGP 在做路由决策时既不知道也不关心容量、速度或拥塞情况。在前面的例子中，要到达图 7-1 中的单宿主网站，我们会选择经由 AS300，因为它只有三个 AS
    跳数。BGP 并不知道 AS300 的一部分是通过卫星链路连接到缅甸的一台路由器，数据包在那里每天被收集一次，然后通过骆驼快递送到下一个 AS 所在的托管机房。BGP
    在乎的只是 AS 路径。


    BGP 不会告诉远程用户在尝试到达你的网络时应该做何选择。在图 7-1 中，AS400 无论通过 AS200 还是 AS300 都是两跳的距离。你可能有一条到
    AS300 的 DS3 链路和一条到 AS200 的 T1 链路，因此更希望用户通过 AS300 进入你的网络。如果是这样，那就没办法了——BGP 的职责不包括告诉用户这些事情。（你可以使用一些
    BGP 技巧来变通处理，但请注意，这既不可靠，也无法做到精细控制。）


    在排查路由问题时，请牢记这些事实。例如，人们自然会认为 BGP 会做负载均衡——你有两条线路，BGP 会将负载分散到两条线路上！但当你需要弄清楚数据包为什么以某种方式传输时，这种想法会让你陷入困境。


    ## BGP 准备工作


    要运行 BGP，你必须具备以下条件：


    - 一台内存超过 128MB 的路由器。

    - 两家 ISP，且都愿意为你提供 BGP 路由馈送。

    - 一个支持 BGP 版本 4 的 IOS 版本。

    - 一个 /24 或更大的 IP 地址段。若干个加起来等于 /24 的小地址段对 BGP 毫无用处。

    - 一个自治系统编号。

    - 你的网络地址段的路由注册表条目。


    我们将逐一进行介绍。


    ### 路由器特性


    先来解决最简单的条件。你的路由器必须拥有支持 BGP 的 IOS 镜像。如果你的 IOS 不支持 BGP，请使用你的 SmartNet 合同获取支持的版本。


    内存方面的问题则稍微复杂一些。来自对等方的每条路由公告都会占用一小部分内存。当你从两个对等方接收完整路由时，你的路由表将占用路由器大部分可用内存。尝试使用任何高级
    Cisco 路由器功能都会导致路由器内存溢出并引发问题。全球路由表每年都在增长。2004 年，一个较新的 IOS 镜像加上两张完整路由表几乎占满了 128MB
    的 RAM，而且很快运行 BGP 并从两个对等方接收完整路由就需要超过 128MB 的内存。


    你可以通过只从一个对等方接收部分路由来减少内存使用。这样你的路由器只会将发往该对等方的数据包发送到该对等方，其余数据包则发送到另一个对等方。但这只会加剧带宽使用不对称的问题，除非你直接连接到一个拥有重要客户的网络，或者有其他大量带宽需求直接连接到该对等方。


    说来奇怪，只能处理 128MB 内存的 Cisco 路由器在 eBay 上反而越来越容易找到了。人们卖掉它们是有原因的。我强烈建议你尽可能从 256MB 内存起步。


    ### 提供 BGP 的 ISP


    信不信由你，许多小型 ISP 只有一条到互联网的线路。这些 ISP 没有 BGP 路由馈送，也无法为你提供。在寻找用于多宿主的 ISP 时，务必询问他们是否能提供
    BGP 路由馈送。同时也要问你当前的运营商是否提供这项服务。多宿主可能需要你终止当前的互联网服务合同，并与两家完全不同的运营商签订新合同。


    向你的运营商索取他们的 AS 编号；你需要这些编号才能申请自己的 ASN。


    ### IP 地址


    请记住，全球骨干网会过滤所有小于 /24 的路由公告。你必须拥有至少那么大的地址段才能使用 BGP。若干个加起来等于同等大小的小地址段是*不够的*。如果你目前没有那么大的地址段，请与你第二条线路的销售人员沟通。ISP
    很可能会愿意为你分配足够大的 IP 地址段来运行 BGP，以争取你的业务——毕竟，没有地址他们就不需要第二条线路！不过，他们可能会对你的 IP 地址收费。


    你必须至少拥有一个 /24 或更大的地址段才能获得 ASN。


    ### 获取 ASN


    美国互联网号码注册局（ARIN）负责分配西半球的自治系统编号。（如果你在世界其他地区，你将有自己所属的区域号码管理机构。）申请流程非常简单，前提是你在申请前准备好所有材料。ARIN
    的网站 http://www.arin.net 上有关于 ASN 申请流程的文档和空白模板。


    只有在 ARIN 注册的组织才能申请 ASN。注册组织是免费的，会为你的组织分配一个 ARIN 组织 ID，即 `Org ID`。你在 ASN 申请表上需要使用
    Org ID 作为联系点。你可以从 ARIN 网站获取申请表。作为在 ARIN 的全新组织，你*必须*使用详细的 Org ID 申请表。申请表是纯文本格式；井号（#）后面的所有内容都是注释，而每个冒号所在的位置都是你需要填写答案的地方。适当的地方会在问题下方给出示例答案。我们不会逐步讲解整个
    Org ID 申请表，因为它所问的问题都非常基础：名称、地址、电话号码等等。将填写好的表格发送到 hostmaster@arin.net，邮件主题为"ORGANIZATION
    TEMPLATE"。


    几天之内，你应该会收到一份通知，告知你的组织已注册成功，并附有你组织信息的详细资料。其中一个重要的信息是你新的 org handle，它包含一个由字母和数字组成的组织代码。你为组织定义的每个联系人也会收到一个
    handle。请记下这些 handle 代码，因为申请 ASN 时需要用到。（如果你忘记了 handle，可以使用 ARIN 网站上的 Whois 搜索引擎来查找你的组织条目。）


    有了 Org ID 之后，你就可以填写 ASN 申请模板了。由于其中某些问题可能比较棘手，我们将逐步讲解当前版本的申请表。

