    # ## Data or Voice Circuit?


    Most telcos today are very well acquainted with private data circuits—in fact,
    some salespeople have never sold anything but data circuits! Telcos provide a
    whole variety of circuits, however, so be certain to specify that you want a data
    circuit when ordering. While a voice circuit might work for a modem, it certainly
    won''t work as a dedicated data circuit.


    When the purchase order arrives, confirm that you''re getting a data circuit (most
    are encoded as "B8ZS"). If your order form does not specify a data circuit or
    state that it has B8ZS encoding, review the paperwork with your salesperson. If
    your paperwork states that the circuit has "AMI" encoding, it''s flat-out wrong,
    and you need to have a pointed conversation with your telco representative.


    In most parts of the United States, delivery time for a T1 circuit will be two
    to four weeks (or as specified on your completed order form). Be certain to get
    a real delivery date from your vendor, however; if the RBOC has to dig a trench
    across the road to deliver your T1, it will take a little longer.


    **NOTE** If you''re not in the United States, you''ll want to investigate your
    country''s telephone system before attempting to place an order. Much as if you
    were shopping for an ISP, talk to other network administrators to see what sort
    of service your different possible vendors offer. In many countries with a telco
    monopoly, service is slow at best. Plan ahead.


    # ## Private Circuit Configuration


    While your circuit is on order, you can preconfigure your router. Configuring
    a Cisco router for a private connection is almost exactly the same as configuring
    it for an ISP connection. As long as the configuration of the router on each end
    is consistent, there''s really very little you can do to mess it up. In most situations,
    the hardest part of the configuration process is choosing the IP addresses for
    your circuit.


    # ### *Private Circuit IP Addresses*


    You''ll need IP addresses for both ends of your T1 circuit and for at least one
    Ethernet interface on each router. To number the Ethernet interface, just pick
    an IP address on the local LAN. Every device in the remote office will use the
    IP address of the remote office router''s Ethernet as the default gateway. At
    headquarters, the IP address of the router connecting the remote office is also
    the route to the remote office.'
  - '[PAGE 56]


    While private circuits don''t strictly require IP addresses (you could always
    use “unnumbered” interfaces), troubleshooting is much simpler when each side of
    the circuit has an IP, because then you can ping either side of a circuit and
    get a response that you know is from the circuit interface. Numbering IP addresses
    also makes it much easier to sort out your interfaces when performing network
    monitoring. I strongly recommend numbering interfaces whenever possible—and it''s
    almost always possible.


    # Reserved Addresses


    Several blocks of IP addresses are reserved for use on private networks. If you''re
    using NAT (Network Address Translation), chances are good that you''re already
    familiar with them. The address blocks are:


    +   - 10.0.0.0 through 10.255.255.255

    - 172.16.0.0 through 172.31.255.255

    - 192.168.0.0 through 192.168.255.255


    If your internal network falls into any of these ranges, you''re already using
    private IP addresses. If not, you can use any of these blocks to number your private
    network interfaces. (You could also use actual IP addresses assigned to your company
    to make those private circuits accessible to the outside world, but that''s usually
    neither necessary nor desirable.)


    # Subnetting


    Each circuit requires two IP addresses in a legitimate subnet. Remember, in any
    block of IP addresses, the highest and lowest addresses are not usable,² so we
    need a network of four IP addresses.


    > **NOTE** *If you''re not familiar with netmasks other than 255.255.255.0, or
    if you''ve never seen subnets labeled with suffixes such as /30, be sure to read
    the appendix for a full explanation before continuing. You must understand subnetting
    before you can properly assign addresses or perform advanced routing.*


    Each usable subnet of four IP addresses has a first number evenly divisible by
    4. For example, 10.0.3.0 through 10.0.3.3 is a usable block (0 is evenly divisible
    by 4), as is 10.0.3.28 through


    ² On those rare occasions when you have both time *and* a network to kill, assign
    a system (on an average 255.255.255.0-netmask LAN) an IP address ending in .0
    or .255 and see what happens. Something will break, but you might not figure out
    what it was for some time.'
  - '[PAGE 57]


    10.0.3.31 (28 is also evenly divisible by 4). However, 10.0.3.207 through 10.0.3.210
    is not usable because 207 is not evenly divisible by 4.


    Because some (increasingly rare) network devices have trouble with the first and
    last subnet in a block, I recommend starting with the fifth through eighth addresses
    in a block and working up. Because we’re beginning our count from 0, this would
    be .4 through .7. (If any of this confuses you, even a little bit, go read the
    appendix.)


    So, if you’re using 10.0.1.0/255.255.255.0 as your headquarters LAN IP addresses,
    and 10.0.2.0/255.255.255.0 as your remote office IP addresses, you might decide
    to carve up 10.0.3.0 for router interfaces. In this example, we’ll use the addresses
    10.0.3.4 through 10.0.3.7. However, because 10.0.3.4 and 10.0.3.7 are not usable
    (because they are the first and last IP addresses in the block), we’ll assign
    10.0.3.5 to the headquarters side of our circuit and 10.0.3.6 to the remote office.


    With this information, you can configure both routers. On your main office router,
    enter configure mode and give the interface its IP address. Here, we configure
    the interface “serial1” with the IP address 10.0.3.5 and assign it the proper
    netmask for a block of four IPs. This should look exceedingly familiar from our
    recent adventures configuring Internet T1s.


    ```

    router#conf t

    router(config)#int s1

    router(config-if)#ip address 10.0.3.5 255.255.255.252

    ```


    Now exit configure mode and save your work. Your interface should simply come
    up when you plug in the circuit (especially if your routers are identical models
    running the same version of the IOS).


    If the circuit doesn’t come up, do a sho int on both routers and compare the configurations.
    The interfaces should have identical setups; if they don’t, make them match by
    changing the configuration (as discussed in Chapter 3).


    The most common misconfiguration between peer routers is the default line encapsulation:
    make sure that they’re both set to either PPP or HDLC. (HDLC is generally preferable
    on broadband circuits.) A mismatch of default encapsulation is especially likely
    if you are using different router models.


    When you have your serial lines up, configure an IP address on your Ethernet interface.
    These are configured exactly as they'
  - '[PAGE 58]


    would be for a standard Internet connection; just assign an IP address and a netmask,
    and they should come right up.


    # Routing Configuration


    Now that you have a circuit set up between offices, it''s time to figure out how
    to guide traffic to its destination. Remember that each desktop machine at headquarters
    has a default route telling it to send all traffic to the main (external) router,
    so if that router cannot send traffic to the remote office, all this is for nothing.
    The purpose of *routing* is to tell routers where to send packets that belong
    to particular networks of IP addresses.


    You can fire up RIP or some other dynamic routing protocol to guide your traffic
    around the network, but doing so has a lot of disadvantages. Dynamic protocols
    break, increase non-useful network traffic, and may pose security risks.


    # Static Routing


    On a simple network, it''s much better to simply attach static routes to various
    sections of the network and have all traffic flow in a deterministic manner. In
    the long run, this method is much more maintainable and causes fewer problems
    on a network like this. (If you have several internal circuits with multiple routes
    between different locations, consider using a dynamic routing protocol.³)


    The syntax for a static route statement is:


    ```

    router(config)#ip route ①destination-ip-network ②netmask ③gateway

    ```


    The ① destination IP address is the first IP in the network block. The ② netmask
    is the netmask of the destination netblock. (Remember, when you route, you route
    entire blocks of addresses, not individual IPs.)


    Finally, the ③ gateway is an IP address that is the next hop where packets for
    this block should be sent. This gateway should be an IP address that the router
    knows how to reach but is not on the router itself. On most routers, this will
    be the IP address on the far side of a serial link. For example, if we wanted
    to provide a static route to the IP address block 100.100.50.0, netmask 255.255.254.0,
    through the gateway of 10.0.3.5, we would use the following command.


    ```

    router(config)#ip route 100.100.50.0 255.255.254.0 10.0.3.5

    ```


    ³ Even in this case, I can''t recommend any sort of RIP. Investigate OSPF instead.'
- md: '**NOTE** One thing to remember about routing (on almost any system, not just
    Cisco) is that the most specific route for a particular IP address is taken. For
    example, almost every router has a “default route” where it sends packets bound
    for another network. If you have a more specific route for certain IP addresses,
    that more specific route will be taken instead of the default. We’ll see some
    examples of this later.


    As you saw in Figure 4-1, all traffic on the remote office LAN is either local
    or routed through the T1 to headquarters. In the main office, all traffic that
    is not destined specifically for the remote office is either local or goes to
    the exterior router. This design is simple and doesn’t resort to error-prone dynamic
    routing protocols.


    ## Remote Office Routing


    In this scenario, every host on the remote office network needs a default route
    that points to the IP address of the remote office router’s Ethernet interface.
    This is best done on the DHCP server. The router then needs to know to send outbound
    traffic to the far side of the serial line.


    Because all traffic on the remote office LAN needs to go to the headquarters router,
    you only need a single route statement.


    ```

    router#conf t

    router(config)#ip route ①0.0.0.0 ②0.0.0.0 ③10.0.3.5

    ```


    The ① first 0.0.0.0 is our destination IP address, and the ② second 0.0.0.0 is
    the netmask. This combination means “every IP address in the world.” The router
    knows that the IP addresses in the 10.0.2.0 network block are attached to a local
    interface, so it will not send those packets across the WAN. Lastly, the ③ gateway
    IP address is the IP address of the headquarters side of the T1 (in this case).


    ## Headquarters Routing


    Our headquarters’ private T1 router has a slightly more complicated configuration.
    It must know that traffic bound for the remote office must be sent across the
    private T1, but all other traffic should go to the exterior router’s Ethernet
    interface at 10.0.1.1.


    ```

    router(config)# ip route ①10.0.2.0 255.255.255.0 ②10.0.3.6

    router(config)# ip route ③0.0.0.0 0.0.0.0 ④10.0.1.1

    ```


    In this configuration, we first send the specific network block used in the remote
    office to the far side of the private T1. Then we add the default route to send
    all other traffic to the exterior router''s Ethernet interface. (In practice,
    you can add these routes in either order and the router will put them in the order
    it prefers.) The route for the 10.0.2.0 network block is more specific than the
    default route, so that route is preferred over the default route for those IP
    addresses.


    The external router should already have a default route pointing to the outside
    world, but it must know where to send traffic for both the remote office and for
    the serial link addresses.


    ```

    router(config)# ip route 10.0.2.0 255.255.255.0 10.0.1.2

    router(config)# ip route 10.0.3.4 255.255.255.252 10.0.1.2

    ```


    Just like on our private T1 router at headquarters, we route the 10.0.2.0 block
    further into the network—but this time, to the IP address of the private line
    router''s Ethernet interface. We then route the IP addresses used on the private
