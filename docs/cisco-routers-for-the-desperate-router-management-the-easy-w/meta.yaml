- md: "## Configuring Interfaces\n\nYou enter configuration information for a single\
    \ interface in configure mode (as discussed in Chapter 2), but to do so you must\
    \ specify the interface that configuration applies to. After you're in configuration\
    \ mode, enter the interface name.\n\n```\nrouter#conf t\nrouter(config)#int faste2/0\n\
    router(config-if)#\n```\n\nThe config-if (Cisco-ese for \"configure interface\"\
    ) label indicates that configuration changes you make will only apply to the single\
    \ interface you specified.\n\nTo leave either interface configuration mode or\
    \ router configuration mode, enter CTRL-Z.\n\n## Ethernet Interfaces\n\nAlmost\
    \ every Cisco router has one or more Ethernet interfaces. Ethernet is a broadcast\
    \ medium. Many devices can be attached to a single Ethernet network, and information\
    \ transmitted by a host is broadcast across the entire Ethernet network. Almost\
    \ all modern office networks are Ethernet.\n\nTheoretically, every host on an\
    \ Ethernet network sees all data transmitted by every host on that Ethernet. (While\
    \ switches mostly direct broadcasts to only the destination computer, even a top-of-the-line\
    \ switch still \"leaks\" some information to all the hosts on the network.) If\
    \ you're having trouble with your local Ethernet, a bad switch is the most common\
    \ cause. (If you're still using a hub, that's almost certainly the problem. Please\
    \ join the 21st century at your earliest opportunity.) Be sure to check hubs and\
    \ switches before you blame your router.\n\nWhile Ethernet has been run over a\
    \ wide variety of physical media in the past, today almost everyone uses either\
    \ category 5 cable or some sort of fiber. (You may well find an antediluvian Cisco\
    \ 2500 with an AUI port, but most of those will also have a 10BaseT Ethernet port.)\n\
    \nFrom the Cisco point of view, all Ethernet interfaces are configured the same\
    \ way; just remember that the connection speed will only be as fast as the slowest\
    \ network device. For example, if you plug a 100Mb Ethernet switch into a 10Mb\
    \ Ethernet router, the connection will be limited to 10Mb.\n\nHere is the beginning\
    \ of the output from a `sho int` on a typical Cisco Fast Ethernet interface. Let's\
    \ look at some of the useful Ethernet-specific information.\n\n```\nrouter#sho\
    \ int faste2/0\nFastEthernet2/0 is up, line protocol is up\n  Hardware is AmdFE,\
    \ address is 0003.e35e.d1a1 (bia 0003.e35e.d1a1)\n  ...\n  Keepalive set (10 sec)\n\
    \  Half-duplex, 10Mb/s, 100BaseTX/FX\n  ARP type: ARPA, ARP Timeout 04:00:00\n\
    \  ...\n```\n\nThe first interesting thing is the ① MAC (Media Access Control)\
    \ address, or Ethernet address, 0003.e35e.d1a1. This is a 48-bit number that is,\
    \ in theory, unique to each Ethernet device. (In practice, some vendors reuse\
    \ Ethernet addresses, because the chances of two devices with the same MAC address\
    \ winding up on the same network are negligible.) Because Cisco routers allow\
    \ you to change the MAC address of an Ethernet interface, they also show the ②\
    \ original burned-in address (bia) assigned to the device by the manufacturer\
    \ in parentheses. The MAC address and bia address match in this case.\n\nActive\
    \ Ethernet interfaces also show the ③ duplex setting, which is half-duplex in\
    \ this case. (The duplex is usually automatically negotiated between the router\
    \ and the switch it's attached to.)\n\nDon't worry about configuring autonegotiation,\
    \ as that takes place in the hardware and cannot be configured. You can hard-code\
    \ this setting, but doing so can cause all sorts of trouble if you change equipment\
    \ or if the connected switch has problems. While your switch might support 100Mb/s\
    \ full duplex today, if it has a problem and must fall back to half-duplex, your\
    \ hard-coded duplex setting will bring the circuit down. It's better to stay up\
    \ in a degraded mode than to go down entirely! Your best bet, if possible, is\
    \ to allow your router to autonegotiate its duplex setting unless you already\
    \ understand the issues involved.\n\nAn active interface also shows the current\
    \ ④ network speed. Again, while you can hard-code this, it is generally best to\
    \ let the router negotiate with the switch or hub it is connected to in order\
    \ to learn what speeds it can best support. Finally, you can see the ⑤ type of\
    \ physical medium connected to this interface. As you can see, this high-quality\
    \ fast Ethernet interface is connected to a slow, half-duplex, 10MB network device.\n\
    \n## Configuring Ethernet Interfaces\n\nThe only change you must make to an Ethernet\
    \ interface to give it on the network is to give it an IP address.\n\n```\nrouter(config-if)#ip\
    \ address <ip address> <netmask>\n```\n\nIn most small network environments, the\
    \ Ethernet interface's IP address is the default gateway of the attached network.\
    \ For example, to set the IP address to 192.168.1.1, with a netmask of 255.255.255.128,\
    \ you would use the following command.\n\n```\nrouter(config-if)#ip address 192.168.1.1\
    \ 255.255.255.128\n```\n\nAfter you have this basic configuration, you can go\
    \ on to a variety of other settings.\n\n## Description\n\nWhile entering a description\
    \ is almost pointless for a simple router with a single T1 port and a single Ethernet,\
    \ the description field is very useful when your router has multiple Ethernet\
    \ interfaces. Enter a description with the description keyword.\n\n```\nrouter(config-if)#description\
    \ DMZ network\n```\n\n## duplex\n\nBy default, the router will attempt to autonegotiate\
    \ the duplex setting of a connection. You can force a particular setting with\
    \ the duplex keyword, which has three legitimate settings: auto, half, and full.\
