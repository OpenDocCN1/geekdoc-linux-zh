    \ load balancing software, how to configure a reliable printing system in a Linux\
    \ cluster environment, and how to build a job scheduling system in Linux with\
    \ no single point of failure.\n\nJANUARY 2005, 456 PP., $49.95 ($69.95 CAN) W/CD\n\
