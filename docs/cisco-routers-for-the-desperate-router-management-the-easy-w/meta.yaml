- img_proc: true
  md: '```

    Timeout in seconds [2]:

    ```


    Two seconds is a very reasonable timeout. Giving a longer timeout is generally
    useless for most IP circuits, because either the packet will return in much less
    time, or you’ll wait that much longer for failed packets. With a shorter timeout,
    you may miss perfectly legitimate return packets that are delayed by a busy remote
    router.


    ```

    Extended commands [n]: y

    ```


    If you take the default n (no) here, the router will run the ping as you have
    specified it. But most of the truly nifty options are in the extended commands,
    so enter y for yes.


    ```

    Source address or interface:

    ```


    With loose source routing, you can change your source IP address and send packets
    from a particular interface, which is useful to do on backbone routers but not
    for most small offices. I highly recommend that you don’t try this, because the
    results will only confuse you. (Tracking down problems is difficult enough without
    using an easily misunderstood tool!)


    ```

    Type of service [0]:

    Set DF bit in IP header? [no]:

    Validate reply data? [no]:

    ```


    These three flags manipulate or verify TCP/IP data but aren’t generally useful
    for day-to-day work. If you’re not familiar with the innards of TCP/IP, just take
    the defaults.


    ```

    Data pattern [0xABCD]: 0xffff

    ```


    A ping packet contains four bytes, and you can choose what data to put in them.
    The hexadecimal 0xABCD is the default, but two common choices are 0x0000 (all
    zeros) and 0xFFFF (all ones). Many misconfigured circuits fail with certain sizes
    of all-zero or all-one packets.


    ```

    Loose, Strict, Record, Timestamp, Verbose [none]:

    ```


    You can choose to use loose or strict source rerouting, record the route taken
    by the ping packets, datestamp each ping packet, or use verbose output. If you
    don’t know what loose or'
