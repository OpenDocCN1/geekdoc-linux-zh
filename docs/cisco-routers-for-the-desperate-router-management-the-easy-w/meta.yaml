    version and the ② hardware platform. The system then starts ③ loading the operating
    system and heads for the main boot sequence. We''ll see how to interpret most
    of the output it gives later in this book. Let it keep going until it wants to
    talk to you. If this is the first boot, it will offer to let you configure it:


    ```

