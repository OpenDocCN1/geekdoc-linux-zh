    \ enable 密码——要么是因为它们没有更新，要么是因为它们仅能支持这些。以这种方式限制特权模式的使用没有问题，特别是在只有一两个人连接设备的规模较小的店面，但如果你有更多人员，你可能希望设置单独的用户名并允许个人拥有或不拥有特权。我们将在第\
    \ 8 章中看到如何实现这一点。\n\n### 集成帮助\n\n“帮助”这个词可能太强了，但路由器会提供关于命令、命令语法以及路由器中可用功能的提示。不同版本的\
