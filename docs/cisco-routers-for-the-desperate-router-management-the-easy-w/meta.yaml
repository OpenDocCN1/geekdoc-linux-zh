    4b. AS Number: **300**


    Question 4 wants the ASNs of your ISPs, which your ISPs can easily provide. You
    must give two valid ASNs.


    5. Unique Routing Policy:


    It is theoretically possible to get an ASN without multihoming, but if you''re
    in that situation, you didn''t buy this book to learn how to do it. Leave this
    blank.


    6. Additional Information:


    I strongly recommend that you leave this blank. Answering questions 1 through
    4 properly is all you need to justify receiving an ASN.


    7. Org ID: **MWL-88**


    Enter the org handle your organization received from ARIN.


    8. Org Name: **The Michael W Lucas Foundation**


    This should exactly match the organization name you registered previously.


    9. AS Name: **MWLF**


    Create an alphanumeric handle for your ASN. This will appear in the ARIN database,
    and will be used to uniquely identify your AS. Use the Whois search at http://www.arin.net
    to ensure nobody already has that handle.


    You can specify additional contacts by ARIN handle in the remaining fields, but
    this is not necessary. Mail your form to hostmaster@arin.net, with a subject of
    “ASN REQUEST.” Within three business days, ARIN will either approve or reject
    your request. If they approve it, you have 60 days to complete the Terms of Service
    agreement and pay the fee (currently $500). If it is rejected, it’s probably because
    you didn’t fill out your request correctly. Read the rejection messages carefully
    and try again.


    ## Routing Registries


    Many large backbones use routing registries to identify which blocks of IP addresses
    should be announced by which ASNs. This prevents someone from destroying a company’s
    Internet connectivity by sending out bogus route announcements for their IP addresses.
    The original Routing Arbiter Database (RADB) is maintained by Merit, but today
    many backbones have their own RADB systems.


    Check with your ISPs. They may or may not require that you register with a RADB,
    and they may or may not have particular RADBs that they will accept. Because each
    RADB differs, there’s no point in going through a detailed exercise in filling
    out forms. The best advice that I can give is to read the instructions carefully
    and look at samples of other entries in that registry for examples.


    After you reach the point where your IP addresses are registered in a RADB, you
    can actually configure BGP on your router.


    ## Configuring BGP


    The good news is that the paperwork necessary to prepare for BGP is the hard part.
    The actual setup process is very mechanical. When you configure BGP, your ISP
    should provide you with an IP address for their router’s BGP session (usually,
    their end of the Internet circuit) and an ASN to peer with.


    ### Your Address Announcements


    By default, a BGP session refuses to announce routes to its peers. This helps
    prevent a small company’s router from becoming an inter-backbone exchange point.
    (Your upstream providers should filter your announcements so that they only receive
    the proper routes from you, so this shouldn''t be a problem.^(2)) For a router
    to announce a block of addresses via BGP, it must know where to send packets bound
    for those addresses when a peer sends them. In a small network, the simplest way
    to do this is to provide a single static route for the exact block of addresses
    you want to announce to your peers. Providing several static routes for pieces
    of that block is insufficient: you must have a single route for the entire block.


    The easiest thing to do is provide a static route for the whole announced block
    to the “null0” interface. While null0 is only a logical interface that exists
    only to discard data, your router will use a more specific route if one is available.
    This monolithic route also allows you to renumber interfaces or change how your
    subnets are routed without worrying about scrambling BGP''s route announcements.


    ### Configuring Addresses for Announcement


    For example, assume that you have the address block 192.168.0.0/23 on your network.
    The first half of that block is attached to your router''s Ethernet interface,
    while the second half is routed to a firewall further into your network. Obviously,
    your router knows where to send packets bound for any individual IP address within
    that block. It doesn''t know where to send the block as a whole, however. While
    both halves of the network address block are routed, you must have a single static
    route for the whole of 192.168.0.0/23.


    ```

    router(config)# ip route 192.168.0.0 255.255.254.0 Null0

    router(config)# access-list 130 permit ip host 192.168.0.0 host 255.254.0.0

    ```


    The first entry is a ❶ standard route statement, just as we discussed in Chapter
    4. The second statement defines an access list, a completely new topic. Thick
    books have been written entirely about Cisco access lists, and we''re not going
    to go over them in any great detail. (They are worthy knowing, but they do need
    a book at least to do them even a faint hint of justice.) The important thing
    now is the syntax used for BGP route announcements. Every access list has a ❷
    unique number, and the number defines the syntax of the remainder of the access
    list statement. For BGP, use a number between 100 and 199. The ❸ permit keyword
    tells us that this access list allows a certain type of traffic. We then need
    the ❹ network number and the ❺ netmask for the IP range we want to announce.


    > ^(2) Note the words “should” and “shouldn''t” in this sentence. Sadly, some
    companies don''t do this basic filtering. A good ISP will.


    ### Configuring BGP


    Once you have your addresses in static routes and access lists, you can tell BGP
    to announce them.


    ```

    router(config)# ❶router ❷bgp ❸100

    router(❹config-route)#

    ```


    In configure mode, tell the router you want to ❶ enable ❷ BGP for ❸ your ASN.
    Note the change of ❹ command prompt when you begin BGP configuration. Then you
    can perform the initial setup of your BGP configuration.


    ```

    router(config-route)# bgp ❶dampening

    router(config-route)# ❷redistribute static

    router(config-route)# ❸network 192.168.0.0 mask 255.255.254.0

    ```


    BGP ❶ dampening allows your router to better resist *route flap*, which is when
    a route is repeatedly added to the routing table and then quickly withdrawn several
    times a minute. If one of your peers starts flapping, your router may become overloaded
    and crash. It’s enabled by default on most modern IOS versions, but you should
    be absolutely sure it’s there.


    We then tell BGP to announce routes that it learned from ❷ static routing. (It’s
    entirely possible to redistribute routes learned via other routing protocols,
    but you need a thicker book to learn how to do that safely.) Because your router
    might have many static routes, we need to specify exactly which ❸ routes we want
    to announce. We don’t want to try to announce every little subnet that the router
    knows about, after all!


    When you actually have a peer configured, it should see these routes.


    ### Your First Neighbor


    Now that you have prepared the routes you want to announce, configure an actual
    BGP session with one neighbor. You must have the peer’s ASN and the IP address
    of the peer. Still in a “BGP 100” configure session, tell the router about a peer
    with the neighbor keyword.


    ```

    router(config-route)# neighbor ❶10.1.8.5 ❷remote-as 200

    router(config-route)# neighbor 10.1.8.5 ❸route-map ❹ispA-out ❺out

    ```


    Identify each peer by the ① IP address you’re peering with. Every line that applies
    to a simple peer starts with the `neighbor ip address` statement. In a simple
    BGP setup, each peer only needs two bits of information: the ② AS of the remote
    side, and a ③ route map used to identify permitted traffic. Like access lists,
    route maps are very powerful tools that require a lot of education to use their
    full potential, but we’ll cover just enough to get BGP working. I recommend ④
    naming each route map after the ISP you are peering with, with the suffix `-out`
