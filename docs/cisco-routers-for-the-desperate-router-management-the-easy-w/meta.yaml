    router(config-if)#ip mroute-cache

    ```


    ## 接口介质类型


    较旧的路由器（例如在拍卖网站上经常发现的一些）同时具有 AUI 和 10BaseT 以太网端口。尽管外观如此，但这些路由器只有一个以太网接口，只是有两个连接器。你可以使用
    AUI 端口或 10BaseT 端口，但不能同时使用。使用 `media-type` 关键字以及 `aui` 或 `10baseT` 设置来选择你想要的连接器。


    ```

    router(config-if)#media-type 10baseT

    ```


    对于每个以太网接口只有一个物理插口的路由器，这是不必要的。你只需要观察以太网端口就能很容易地识别这些路由器。


    ## 串口接口


    串口网络只有两个节点，两端各一个，且仅在两点之间传输数据。这使得管理串口链路比管理以太网链路要简单得多，但连接路由器与远程网络的线路具有更多可设置的选项。


    虽然你可以通过在两个路由器的串口之间连接正确的电缆来运行串口链路，但串口线路通常由电话公司提供，运行在两个不同位置之间，其距离远超以太网所能承受的几百英尺。我们将重点讨论电信公司提供的
    T1 电路，例如你在 ISP 连接或两个办公室之间能找到的那种。


    以下是一个典型的 Cisco T1 接口的 `sho int` 输出的开头。尽管串口接口有着令人畏惧的名声，但在许多方面，串口线路比以太网接口更容易配置，因为它的选项少得多。


    ```

    Serial1/0 is up, line protocol is up

    Hardware is DSCC4 with integrated T1 CSU/DSU

    ...

    ```


    首先，我们看到了关于该接口 ① 硬件的信息。虽然没有大量 Cisco 经验的人根本不知道 DSCC4 是什么，但集成的 T1 CSU/DSU 提示这是一个
    T1 线路。（如果你不知道 CSU/DSU 是什么，请参阅第 5 章中的“电路设计”。）


    再往下看，我们看到了 ② 封装（encapsulation）字段。封装是线路两端路由器所使用的物理协议，正如我们之前讨论过的那样。T1 线路的两种常见选择是点对点协议
    (PPP) 和高级数据链路控制 (HDLC)。PPP（本例中使用的协议）是一个由许多不同路由器和调制解调器支持的旧标准，而 HDLC 是 Cisco 创建的专门为高带宽线路设计的协议。虽然
    HDLC 比 PPP 更高效，但对于 T1 规模或更小的电路，两者都能很好地工作。需要记住的重要一点是，电路两端的路由器必须在电路中使用相同的物理协议。如果一个路由器声称电路使用的是
    PPP，而另一个坚持是 HDLC，那么线路协议将掉线并保持掉线状态，直到误配置被修复。


    ## 配置串口接口


    串口接口上需要配置的两个基本事项是 IP 地址和封装。例如，假设我们有一个 T1 线路，其 IP 地址为 192.168.1.2，子网掩码为 255.255.255.252，且使用
    PPP 封装。进入该接口的配置模式并输入：


    ```

    router(config-if)#ip address 192.168.1.2 255.255.255.252

    router(config-if)#encapsulation ppp

    ```


    > 我们在第 4 章中更详细地介绍了串口接口的配置。更多详情请参考 Cisco 的在线文档。


    现代 Cisco 路由器在默认情况下设置了多种配置，其中大多数禁用了仅在高级实现中使用的功能。不过，一个值得更改的设置是接口描述（interface description），这是一个可以用来存储重要电路相关信息的有用字段。在这里，我们将我们的
    Internet 电路标记为此类，以将其与我们的其他 T1 电路区分开来，并且我们包含了电话公司用于标识此特定 T1 电路的电路 ID。这样，如果我们必须打电话给电信公司投诉电路中断，我们就可以立即获得必要的电路
    ID。


    ```

    router(config-if)#description ISP uplink, circuit ID#3141579

    ```


    ## 其他接口


    Cisco 支持大量不同的接口类型：例如 HSSI、FDDI、SMDS 和 ATM。如果你需要其中一个接口，接口卡或路由器将附带描述如何配置该接口的文档。很有可能配置过程与用于串口或以太网电路的过程非常相似，仅在连接协议上有细微变化。由于这些接口在可能阅读本书的人群中相对罕见，我们不会详细讨论它们。


    然而，每个路由器都有另外两种我们将要讨论的接口：环回（loopback）接口和空（null）接口。两者都是逻辑接口——它们没有与之关联的硬件，而是纯粹在软件中创建，以便路由器处理某些专门的任务。每种接口都有其特定的用途。


    ## 环回接口


    环回接口是本地路由器与其自身进行通信的接口。它们很有用，因为你可以为其分配任何你喜欢的 IP 地址。例如，某些高级路由器配置要求路由器拥有自己的 IP 地址，而无需将该
    IP 分配给连接到网络的任何接口。环回接口使这变得简单。


    你通过配置来创建环回接口。例如，要创建一个名为 `loopback0` 的接口，你需要进入配置模式并告知路由器你正在配置该接口，然后像任何其他接口一样为其分配
    IP 地址。


    ```

    router# conf t

    router(config) int loopback0

    router(config-if)#ip address 192.168.254.5 netmask 255.255.255.255

    router(config-ip)#^Z

    ```


    下次运行 `sho int` 时，你创建的环回接口将出现在列表中。我们的路由器现在知道 IP 地址 192.168.254.5 绑定到此路由器，而不是绑定到任何特定接口。如果有人尝试通过任何接口
    ping 该 IP，路由器都会响应。


    要删除环回接口，请进入配置模式并输入 **no** 以及接口名称。


    ```

    router#conf t

    router(config)#no int loopback0

    ```


    当你使用多链路 PPP 将两个或多个电路合并为一个大的电路，然后在该链路上使用 BGP（见第 7 章）时，这些接口特别有用。你需要为 BGP 对端拥有一个单一的
    IP 地址，但当你与 BGP 对端共享多个电路时，你需要一个一致的 IP 地址供这些对端通信。除非你的 ISP 或 Cisco 技术支持明确指示，否则你不应创建环回接口，但基于类似的理由，你应该了解它们是什么，这样它们就不会让你感到意外。


    ## 空接口


    空接口字面上就是一条通往“无处”的路由。路由到任何空接口的流量都会被直接丢弃。你为什么要丢弃流量？某些 IP 地址不应该在公共互联网上出现，如果你收到发往这些地址的数据包，你可能希望将这些地址路由到无底深渊中。空接口最常用于
    BGP 配置，在这种配置中，你必须为你希望通告的每个网段设置一条静态路由。（我们将在第 7 章更详细地讨论 BGP。）


    只需要一个空接口 `null0`；在路由器中设置多个黑洞没有任何意义。空接口不需要配置；你只需将流量路由到它即可。


    ```

    router(config-ip)#ip route 192.168.0.0 255.255.0.0 null0

    ```


    现在我们已经探索了路由器接口的基础知识，让我们来看看如何在现实世界中使用串口接口。


    # 广域网连接


    Cisco 在广域网 (WAN) 方面表现出色，能够通过电话公司电路连接不同的站点。对许多人来说，T1 或 DS3 连接是某种提供互联网或将公司办公室连接到总部的神秘“东西”。然而，一旦你对它们有了初步了解，网络电路就远没有那些让老板的电脑一天崩溃三次的东西那么神秘了。


    广域网主要用于通过 ISP 连接到互联网，或通过私有网络连接两个办公室。我们将讨论这两种用途。

