  - "[PAGE 115]\n\n# # Lines\n\nNear the end of your router’s configuration, you’ll\
    \ see entries like line vty 0 4 and line con 0. These lines are the available\
    \ methods of getting a command line prompt on your router, and each can be configured\
    \ separately. A standard Cisco device has three types of line: con, aux, and vty.\n\
    \nThe *con* (or console) port is what we’ve been using to connect to the system.\
    \ While it’s entirely possible to reconfigure this port, it’s generally a bad\
    \ idea. You can set the console to require a password to log in, for example,\
    \ or you might have it run at a higher speed for better interactive response.\
    \ If you need a physical console port with nonstandard behavior, use the *aux*\
    \ (or auxiliary) port. That’s what it’s there for.\n\nThe *vty* lines, or virtual\
    \ terminals, are logical lines used for access over the network. Telnet and SSH\
    \ connections into the router are directed to a virtual terminal. These lines\
    \ have no physical hardware; they are strictly a software interface. (That’s why\
    \ they’re called “virtual.”) These lines may cause the most concern and require\
    \ the most attention; while a locked door can control access to the con and aux\
    \ ports, the whole point of remote network access is that you can access your\
    \ router from anywhere.\n\nEach router supports a different number of lines. The\
    \ easy way to identify the lines is with the `show line` command.\n\n```\nrouter#show\
    \ line\n   Tty  Typ     Tx/Rx    A Modem  Roty AccO AccI  Uses  Noise  Overruns\
    \    Int\n     0  CTY                -    -      -    -    -      0      0   \
    \     0/0      -\n   129  AUX   9600/9600    -    -      -    -    -      0  \
    \    0        0/0      -\n*  130  VTY                -    -      -    -    - \
    \    18      0        0/0      -\n   131  VTY                -    -      -   \
    \ -    -      6      0        0/0      -\n   132  VTY                -    -  \
    \    -    -    -      3      0        0/0      -\n   133  VTY                -\
    \    -      -    -    -      2      0        0/0      -\n   134  VTY         \
    \       -    -      -    -    -      0      0        0/0      -\n```\n\nHere,\
    \ we see that this particular router has a single ❶ console, a single ❷ aux port,\
    \ and five virtual terminals numbered ❸ 130 through ❺ 134. While most of the rest\
    \ of the information is not normally useful, sometimes it’s nice to see ❹ how\
    \ many times a particular terminal has been accessed.\n\nWhile you can do all\
    \ sorts of configuration on these ports, the most important features are those\
    \ related to passwords and access methods. Let’s look at a sample configuration\
    \ and see what we can learn."
  - "[PAGE 116]\n\n```\nline con 0\n password 7 02310042864A2C295D43D1\nline aux 0\n\
    \ password 7 02310042864A2C295D43D1\nline vty 0 4\n login local\n transport input\
    \ telnet ssh\n```\n\nThe first entry is the console port. Like all real computer\
    \ devices, Cisco numbers ports beginning with zero. This console port has a password\
    \ on it; even if you hook up a serial cable and fire up HyperTerminal, you'll\
    \ have to enter a password. This may be necessary if your router is physically\
    \ insecure, such as in a shared colocation center. (It may also be necessary if\
    \ your company has staff that like to wander into places they aren't supposed\
    \ to.) If your router is correctly configured, the actual password is stored in\
    \ encrypted form.\n\nThe aux port is also numbered 0 and has a password. While\
    \ the password for both the console and aux ports are encrypted, you can see that\
    \ they are identical.\n\nLast, we have the virtual terminals. This system has\
    \ five configured virtual terminals, numbered 0 through 4. The login local keyword\
    \ means that this router has a list of usernames and passwords stored on the local\
    \ machine, and that whenever a login request arrives over the network, the router\
    \ should use this list. The transport line indicates what methods can be used\
    \ to access the virtual terminals; in this case, acceptable inputs are telnet\
    \ and SSH.\n\nUnconfigured virtual terminals cannot be used; if we configured\
    \ only virtual ports 0 and 1, the router would only support two simultaneous remote\
    \ login sessions. While this might not seem like a problem, at times it's nice\
    \ to have multiple router command prompts open simultaneously so that you can,\
    \ say, keep watching your BGP sessions in one window and make changes in another.\
    \ I've found myself at times with all four virtual terminals open on my single\
    \ desktop when I'm trying to debug a particularly annoying problem.\n\nHow can\
    \ you set all this up? Well, let's find out.\n\n# Passwords\n\nA password is the\
    \ simplest authentication method a Cisco router can use, but it's effective enough\
    \ for most networks. If you have dozens of routers, you may want to consider a\
    \ solution such as"
- md: " RAIDUS or TACACS+, but that really is overkill for most environments. By default,\
    \ routers do not require passwords, but also by default, you cannot access the\
    \ router over the network, so in order to get a command prompt on the router,\
    \ you would need to have physical access. Cisco assumes that if you know enough\
    \ to enable network access, you will be able to set up basic passwords.\n\nBefore\
    \ implementing passwords on your router, make certain that the password encryption\
    \ service is activated. By default, routers store passwords in their configuration\
    \ in *unencrypted* format. This means that anyone who can view the router's configuration\
    \ can see the router's passwords! While it's true that you already have to have\
    \ privileged mode access '[age to view a running router's configuration, that\
    \ doesn't protect backup copies of your configuration stored elsewhere. It also\
    \ makes it almost impossible for someone who happens to be looking over your shoulder\
    \ to *not* view the password, even if they want to be honest. To enable the password\
    \ encryption service, just add\n\n```\nservice password-encryption\n```\n\nto\
    \ your configuration.\n\nNow that nobody can get your passwords trivially, it's\
    \ worth continuing. Standard Cisco devices offer three standard passwords: the\
    \ *front door*, *enable*, and *enable secret*. The front door password protects\
    \ unprivileged EXEC mode access to the router. This means that you can look but\
    \ not touch, as discussed earlier. Setting a front door password for a line is\
    \ very simple. Here, we're setting a front door password on our aux port.\n\n\
    ```\nrouter# conf t❶\nrouter(config)# line aux 0❷\nrouter(config-line)# login❸\n\
    router(config-line)# password *YourPassword*❹\nrouter(config-line)# ^Z\n```\n\n\
    Start by ❶ entering configure mode, and then tell the router that you want to\
    \ ❷ configure the line aux 0. Remember, your router configuration will tell you\
    \ exactly what the line is called; if nothing else, you'll see a single line near\
    \ the end of the configuration that says only `line aux 0`. You need to tell the\
    \ router to ❸ use password checking on this port with the login option. Finally,\
    \ enter the command `password` and ❹ your chosen password. Unlike more modern\
    \ operating systems that provide you with shaded dialog boxes that hide your password\
    \ as you change it, your password will actually appear on the command line here.\
    \ Be certain that nobody's looking over your shoulder when you set or change the\
    \ password!\n\nAfter you've set a password, you'll see an entry for it in the\
    \ router configuration.\n\n```\nline aux 0\n password 7 053C02162C006D01080856\n\
    \ login\n```\n\nThis looks an awful lot like what you typed, but the password\
    \ has been hashed. Another thing to note is the 7 between the word password and\
    \ the password string. The 7 tells the router that the password has been hashed,\
    \ and that the string 053C02162C006D01080856 isn't the actual password.\n\nOne\
    \ thing to remember is that these front door passwords are configured on a line-by-line\
    \ basis. You can have one password for your console port, another for the aux\
    \ port, and yet another for your virtual terminals. Setting different passwords\
    \ on different ports is a wonderful way to confuse yourself.\n\nThe *enable* password\
    \ protects access to privileged EXEC mode. The old method of Cisco access control\
    \ was to give lower-level support techs the front door password but restrict the\
    \ enable mode to higher-level techs. Unfortunately, Cisco created its own encryption\
    \ algorithm to keep the password secure. This algorithm is badly flawed. You should\
    \ not have an enable password on your Cisco devices, because anyone who gets your\
    \ configuration can trivially reverse engineer the enable password from the scrambled\
    \ hash.1 To fix this, Cisco introduced a second privileged EXEC protection, the\
    \ *enable secret*, and protected it with the cryptographically sound MD5 hash.\
    \ Setting an enable secret, and disabling the enable password, is much like setting\
    \ a front door password. Unlike the front door passwords, which can be different\
    \ for each line, the enable passwords work globally.\n\n```\nrouter# 1 conf t\n\
    router(config)# 2 enable secret YourSecretPassword\nrouter(config)# 3 no enable\
    \ password\n```\n\n> 1 This happens more frequently than you might think. Whenever\
    \ a vendor says that it has invented its own proprietary, highly secure encryption\
    \ techniques, run. Run quickly. While the security of \"open code\" versus \"\
    closed code\" may be debatable, the security of \"open crypto\" versus \"closed\
    \ crypto\" most certainly is not.\n\nWhen you're in ① standard configure mode,\
    \ the command ② enable secret and a password string will set the enable secret.\
    \ You don't want any sort of easily retrievable password on any system, so be\
    \ sure to ③ disable the old-fashioned enable password.\n\nThese passwords will\
    \ provide some basic protection to your system. You can also change passwords\
    \ at any time with exactly the same commands you used to set them in the first\
    \ place.\n\n## Usernames\n\nWhile global passwords are sufficient to protect your\
    \ router from the most ignorant network intruders, you will probably want to secure\
    \ the remote command-line access to the router. Cisco provides secure shell (SSH)\
    \ server for secure remote administration. SSH requires that each末节 user have\
    \ a username. In large networks, you can use usernames to assign different users\
    \ different privilege levels on each router as required.\n\nEach user needs a\
    \ username, a password, and a privilege level. Privilege levels range from 1 (unprivileged\
    \ EXEC) to 15 (privileged EXEC). To create a username, just go into configure\
    \ mode and enter all the information.\n\n```\nrouter(config)# username ①mwlucas\
    \ privilege ②15 password ③mwlucas-password\nrouter(config)# username ④kgball privilege\
    \ ⑤1 password kgball-password\n```\n\nThe first username we're creating is ① mwlucas.\
    \ This user has a ② privilege level of 15, meaning that he is in enable mode when\
    \ he logs in. While you give this user's ③ password on the command line when you're\
    \ creating him, it will be hashed and appear scrambled when you view the configuration\
    \ later.\n\nThe second username we're creating is ④ kgball. The only different\
    \ thing about him is that he is at ⑤ privilege level 1. He can look at everything\
    \ but cannot make any changes, exactly as if he only had the front door password.\n\
    \nWhile you can assign particular privilege levels to different commands, and\
    \ then assign each user a privilege level commensurate with their duties and abilities,\
    \ in most small networks two privilege levels are quite sufficient.\n\n## *Making\
    \ Lines Check Usernames*\n\nAfter you have assigned usernames and passwords, you\
    \ need to tell the router's lines to use them. Adding the login local line to\
    \ a line will tell the router to check incoming connection requests against the\
    \ local users database. For example, to make the console check usernames you would\
    \ just do this:\n\n```\nrouter# conf t\nrouter(config)# line con 0\nrouter(config-line)#\
    \ login local\n```\n\nYou can mix and match different authentication methods on\
    \ different lines. By setting login local on the vty lines and login on the con\
    \ port, you require a username and password for remote access but the standard\
    \ front door password for the console. This provides more than enough possible\
    \ combinations for you to completely lock yourself out of the system.\n\n## Remote\
    \ Router Access\n\nCisco routers support a variety of methods for administration\
    \ over the network. The most common methods of accessing a router are telnet and\
    \ SSH.\n\nTelnet was the standard method to get a command prompt on a remote system\
    \ for many, many years. Unfortunately, everything sent over telnet is unencrypted.\
    \ For twenty-odd years, this didn't matter a great deal, but these days the Internet\
    \ is much less friendly. A hostile Internet user between your computer and your\
    \ router can capture your router passwords and do anything they like to your router.\
    \ If you must use telnet, be certain you only use it from a trusted network local\
    \ to the router and not over the public Internet. Both Unix and Windows include\
    \ a command-line telnet client. If at all possible, use SSH instead of telnet.\n\
    \nSSH, or Secure Shell, is the modern replacement for telnet. All communications\
    \ between client and server are encrypted, so that same hostile user cannot capture\
    \ any useful information. While all modern Unix versions include an SSH client,\
    \ Windows users will need to get an add-on SSH client. Many clients are available\
    \ from the Internet, but one of the most commonly recommended is puTTY. A Google\
    \ search will take you directly to any number of download sites.\n\nMany Cisco\
    \ routers support other configuration methods, such as a web interface. Like telnet,\
    \ any information you transmit is sent over the network unencrypted, and anyone\
    \ who knows how to can capture it and gain unrestricted access to your router.\
    \ A router's web interface is frequently not as flexible as the command line.\
    \ Between the two, there is little to recommend the web interface."
  mdcn: "\nRAIDUS 或 TACACS+，但对大多数环境来说这确实有点小题大做了。默认情况下，路由器不需要密码，但同样默认情况下，你无法通过网络访问路由器，因此要在路由器上获得命令提示符，你需要拥有物理访问权限。思科假设，如果你知道如何启用网络访问，你就能设置基本密码。\n\
    \n在路由器上设置密码之前，请确保密码加密服务已激活。默认情况下，路由器以*未加密*格式在配置中存储密码。这意味着任何能够查看路由器配置的人都能看到路由器的密码！虽然要查看运行中路由器的配置确实需要先拥有特权模式访问权限，但这并不能保护存储在其他地方的配置备份。而且，当有人碰巧看到你的肩膀时，即使他们想保持诚实，也几乎不可能*不*看到密码。要启用密码加密服务，只需在配置中添加\n\
    \n```\nservice password-encryption\n```\n\n既然没人能轻易获取你的密码了，我们就可以继续了。标准的思科设备提供三种标准密码：*前门密码*、*enable密码*和*enable\
    \ secret密码*。前门密码保护对路由器的非特权EXEC模式访问。这意味着你只能看不能动，正如前面所讨论的。为一条线路设置前门密码非常简单。这里，我们在辅助端口上设置前门密码。\n\
    \n```\nrouter# conf t❶\nrouter(config)# line aux 0❷\nrouter(config-line)# login❸\n\
    router(config-line)# password *YourPassword*❹\nrouter(config-line)# ^Z\n```\n\n\
    首先❶进入配置模式，然后告诉路由器你想要❷配置aux 0线路。记住，你的路由器配置会准确告诉你这条线路叫什么；至少，你会在配置末尾附近看到一行，上面写着`line\
    \ aux 0`。你需要告诉路由器❸使用登录选项来在此端口启用密码检查。最后，输入`password`命令❹以及你选择的密码。与现代操作系统在你更改密码时提供隐藏密码的阴影对话框不同，在这里你的密码实际上会显示在命令行上。设置或更改密码时，一定要确保没人正在看你的肩膀！\n\
    \n设置密码后，你会在路由器配置中看到一个条目。\n\n```\nline aux 0\n password 7 053C02162C006D01080856\n\
    \ login\n```\n\n这看起来和你输入的非常相似，但密码已被哈希处理。另一件需要注意的事情是`password`这个词和密码字符串之间的`7`。`7`告诉路由器密码已被哈希处理，字符串`053C02162C006D01080856`不是实际的密码。\n\
    \n需要记住的一点是，这些前门密码是按行配置的。你可以为控制台端口设置一个密码，为辅助端口设置另一个密码，为虚拟终端再设置一个密码。在不同端口设置不同的密码是迷惑自己的好方法。\n\
    \n*enable*密码保护对特权EXEC模式的访问。思科旧的访问控制方法是给低级支持技术人员前门密码，但将enable模式限制为高级技术人员。不幸的是，思科自己创建了加密算法来保护密码安全。这个算法存在严重缺陷。你不应该在你的思科设备上使用enable密码，因为任何获取你配置的人都可以轻松地从混乱的哈希值中反向工程出enable密码。¹\
    \ 为了解决这个问题，思科引入了第二种特权EXEC保护，即*enable secret*，并用密码学上安全的MD5哈希来保护它。设置enable secret并禁用enable密码，与设置前门密码非常相似。与可以为每条线路设置不同密码的前门密码不同，enable密码是全局工作的。\n\
    \n```\nrouter# 1 conf t\nrouter(config)# 2 enable secret YourSecretPassword\n\
    router(config)# 3 no enable password\n```\n\n> 1 这比你想象的更常见。每当有供应商说他们发明了自己的专有的、高度安全的加密技术时，快跑。赶紧跑。虽然“开源代码”与“闭源代码”的安全性可能有争议，但“开源加密”与“闭源加密”的安全性则肯定没有争议。\n\
    \n当你在❶标准配置模式下时，命令❷`enable secret`和一个密码字符串将设置enable secret。你不想在任何系统上使用任何容易检索到的密码，所以一定要❸禁用旧式的enable密码。\n\
    \n这些密码将为你的系统提供一些基本保护。你也可以随时使用与最初设置密码时完全相同的命令来更改密码。\n\n## 用户名\n\n虽然全局密码足以保护你的路由器免受最无知的网络入侵者，但你可能希望保护远程命令行访问路由器。思科提供安全外壳服务器，用于安全管理远程访问。SSH要求每个最终用户都有一个用户名。在大型网络中，你可以根据需要使用用户名为每个路由器上的不同用户分配不同的权限级别。\n\
    \n每个用户都需要一个用户名、一个密码和一个权限级别。权限级别范围从1（非特权EXEC）到15（特权EXEC）。要创建用户名，只需进入配置模式并输入所有信息。\n\
    \n```\nrouter(config)# username ①mwlucas privilege ②15 password ③mwlucas-password\n\
    router(config)# username ④kgball privilege ⑤1 password kgball-password\n```\n\n\
    我们创建的第一个用户名是①`mwlucas`。该用户的②权限级别为15，意味着他登录时就处于enable模式。虽然你在创建此用户时在命令行上提供了③密码，但之后查看配置时它会被哈希处理并显示为混乱的字符串。\n\
    \n我们创建的第二个用户名是④`kgball`。他唯一不同的地方是他的⑤权限级别为1。他可以查看所有内容但不能进行任何更改，就好像他只有前门密码一样。\n\n\
    虽然你可以为不同的命令分配特定的权限级别，然后根据每个用户的职责和能力分配相应的权限级别，但在大多数小型网络中，两个权限级别就足够了。\n\n## *让线路检查用户名*\n\
    \n分配完用户名和密码后，你需要告诉路由器的线路使用它们。在一条线路上添加`login local`行，将告诉路由器根据本地用户数据库检查传入的连接请求。例如，要让控制台检查用户名，你只需这样做：\n\
    \n```\nrouter# conf t\nrouter(config)# line con 0\nrouter(config-line)# login\
    \ local\n```\n\n你可以在不同的线路上混合搭配不同的认证方法。通过在vty线路上设置`login local`，在con端口上设置`login`，你要求远程访问使用用户名和密码，而控制台则使用标准的前门密码。这提供了足够多的可能组合，让你完全将自己锁在系统之外。\n\
    \n## 远程路由器访问\n\n思科路由器支持多种通过网络进行管理的方法。访问路由器最常见的方法是telnet和SSH。\n\nTelnet多年一直是获得远程系统命令提示符的标准方法。不幸的是，通过telnet发送的所有内容都是未加密的。二十多年来，这并没有太大关系，但如今互联网变得不那么友好了。你计算机和路由器之间的恶意互联网用户可以捕获你的路由器密码，并对你的路由器为所欲为。如果必须使用telnet，请确保只在路由器本地的可信网络中使用，而不是通过公共互联网。Unix和Windows都包含命令行telnet客户端。如果可能，请使用SSH而不是telnet。\n\
    \nSSH，即安全外壳，是telnet的现代替代品。客户端和服务器之间的所有通信都是加密的，因此同样的恶意用户无法捕获任何有用的信息。虽然所有现代Unix版本都包含SSH客户端，但Windows用户需要获取一个附加的SSH客户端。许多客户端可以从互联网上获得，但最常推荐的之一是puTTY。谷歌搜索将直接带你到许多下载站点。\n\
    \n许多思科路由器支持其他配置方法，如Web界面。与telnet一样，你传输的任何信息都是通过网络未加密发送的，任何知道如何操作的人都可以捕获它并获得对路由器的无限制访问。路由器的Web界面通常不如命令行灵活。两者之间，没什么理由推荐Web界面。\n"
