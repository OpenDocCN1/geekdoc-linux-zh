    \n当你同时拥有BGP和HSRP时，你的冗余性几乎达到了极致。现在唯一能让你网络瘫痪的只有电信故障、停电和大规模陨石撞击。（好吧，好吧；小型但目标精准的陨石撞击也足够了。）这些都可以处理，但它们是其他书籍的主题。\n\
    \n## 8 登录、认证与远程访问\n\n限制对路由器配置和控制的访问是网络管理的重要组成部分。虽然让路由器启动并运行很重要，但你不希望任何人能够访问你的设备并重新配置它！理解如何访问你的路由器、如何设置密码和创建独立用户名，以及如何通过telnet或SSH在网络中提供和控制访问，这些都是非常重要的。\n\
    \n### 线路\n\n在路由器配置的末尾附近，你会看到像`line vty 0 4`和`line con 0`这样的条目。这些线路是在路由器上获取命令行提示符的可用方法，每条都可以单独配置。一个标准的Cisco设备有三种类型的线路：con、aux和vty。\n\
    \n*con*（或控制台）端口是我们一直用来连接系统的端口。虽然完全有可能重新配置这个端口，但通常这不是个好主意。例如，你可以设置控制台要求输入密码才能登录，或者你可以让它以更高速度运行以获得更好的交互响应。如果你需要一个具有非标准行为的物理控制台端口，请使用*aux*（或辅助）端口。这就是它的用途。\n\
    \n*vty*线路，或虚拟终端，是用于通过网络访问的逻辑线路。Telnet和SSH连接到路由器被定向到一个虚拟终端。这些线路没有物理硬件；它们纯粹是软件接口。（这就是为什么它们被称为“虚拟”。）这些线路可能引起最多的关注和需要最多的注意；虽然锁着的门可以控制对con和aux端口的访问，但远程网络访问的全部意义在于你可以从任何地方访问你的路由器。\n\
    \n每台路由器支持不同数量的线路。识别线路的简便方法是使用`show line`命令。\n\n| Tty | 类型 | 发送/接收 | A | 调制解调器\
    \ | 轮询 | AccO | AccI | 使用次数 | 噪声 | 溢出 | 接口 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | 0 | CTY | | - | - | - | - | - | 0 | 0 | 0/0 | - |\n| 129 | AUX | 9600/9600 |\
