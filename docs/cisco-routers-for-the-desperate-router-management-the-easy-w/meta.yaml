    \n## 索引 123\n\n# 引言\n\n欢迎来到*绝望中的思科路由器！* 虽然网络管理员知道他们应该深入了解网络中的每一台设备，但在现实中，我们对那些需要最多关心和维护的东西最为熟悉。我们都花了比预期更多的时间与有问题的操作系统和应用程序争论，因此对它们非常熟悉。思科路由器“几乎总是能正常工作”，所以我们没有太多机会熟悉它们。这使得路由器带有一种“神秘黑盒”的氛围。当路由器真正出故障时，这个神秘黑盒立即变成了恐惧和担忧的对象。战斗或逃跑的本能被触发，人们惊慌失措，很快每个人都会像内裤里放出一只喝醉的獾一样到处乱跑。也许你会打电话给你的互联网服务提供商寻求帮助——这始终是一种合理的策略，但也许不是最快的方法，也肯定不是最维护自尊的方法。你可以去买一本关于思科路由器的书，但那些真正包含有用信息的书，其重量大约相当于一个汽车变速箱，也几乎一样难以消化。我们都知道在紧急情况下你不会有时间通读它，对吧？\n\
    \n这本书面向管理一到三台思科路由器的小型网络管理员。我们的目标是让你熟悉思科环境，并提供你所需的确切信息，以解决发生在思科路由器上或与思科路由器密切相关的最常见问题。一旦你掌握了这些，我们会再进一步，提供你需要的基本信息，以解决在使用思科路由器和网络连接时经常出现的一些问题。这本书也足够短，可以实际阅读。\n\
    \n> *这是我希望在我第一次接触思科设备之前就读过的书。*\n\n这本书不是关于使用思科路由器所能做所有事情的完整教程。思科几乎发明了网络业务，其设备已被用于互联几乎有史以来创建的每一种网络硬件。我们专注于互联网环境中的\
    \ TCP/IP 网络，不涉及信道化电路、VoIP、IPX、AppleTalk 或思科领域可用的任何其他功能。相反，你将发现如何自己学习这些东西。一旦你熟悉了思科路由器，其他一切都会随之而来。\n\
    \n## 本书将教你什么\n\n本书的主要目标是让你熟悉每台思科路由器内部的环境和技术。首先，你需要连接到路由器并登录，我们将讨论如何做到这一点。你还需要检查接口、检查配置、更改系统的当前和启动配置，以及运行一些基本的故障排除命令。\n\
    \n为了让路由器正常工作，你需要对现代 TCP/IP 网络上最常见的网络类型有基本的理解。我们将简要介绍以太网和串行线路，并给出一些进一步信息的提示。这不是网络入门，但你需要理解足够的理论来理解路由器错误消息。\n\
    \n然后，我们将讨论最常见的路由器用途：将小型网络连接到互联网。我们将逐步介绍典型的配置选项，然后学习如何预配置路由器，以便你可以快速、轻松地建立连接，而无需过多麻烦。这将使你能够向你的\
    \ ISP 询问你所需的具体信息，而不是让他们告诉你需要输入什么。为了让你的互联网连接工作，你还需要配置路由器的以太网接口，所以我们也会讨论这一点。\n\n\
    也许路由器的第二个最常见的用途是用一条私有租用线路连接两个办公室。这比将网络连接到 ISP 更进一步，我们将介绍如何实现这一点，从向电话公司订购电路开始。因为你将负责这条电路，我们也会介绍故障排除。\n\
    \n尽管思科设备很好，但它的产品需要不时的软件更新来解决稳定性和安全性问题。我们将带你安全可靠地完成这个过程，并讨论从最常见的问题中恢复的方法。\n\n每当办公室的互联网连接中断时，经理们都有同样的问题：“需要什么才能实现冗余？”我们将揭开\
    \ BGP（边界网关协议）的奥秘，并展示你，作为一个小型网络提供商，如何使用 BGP 提供某种程度的网络冗余。我们还将讨论与 BGP 相关的问题以及可以解决这些问题的一些解决方法。\n\
    \n最后，思科路由器可以利用你可能已经提供的各种网络服务，并提供其他接口以更轻松地适应你的网络。这些包括像 SSH（安全外壳）、NTP（网络时间协议）和 SNMP（简单网络管理协议）这样的基本协议。我们将简要讨论如何配置这些以及其他协议。\n\
    \n# 你可以在哪里学习更多\n\n如果你需要更多信息，可以在其他地方以少量费用或免费获得。\n\n到目前为止，我最喜欢的思科问题信息来源是 Google\
    \ 搜索引擎。通常，使用精心选择的搜索词进行快速的网络搜索，会在第一个结果中给出答案。\n"
