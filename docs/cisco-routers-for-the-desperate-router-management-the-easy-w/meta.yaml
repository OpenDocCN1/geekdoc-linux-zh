    当你处于特权 EXEC 模式时，你不仅可以执行更强大的命令，还可以更改路由器的配置。


    要更改路由器的配置，你必须进入 *配置模式*。配置路由器最常见的方式是在你登录的命令行，也称为 *终端*。在特权模式提示符下输入 `configure terminal`。


    ```

    router#conf t

    Enter configuration commands, one per line. End with CNTL/Z.

    router(config)#

    ```


    注意 ❶ 命令提示符已经从简单的 `router` 变成了 `router(config)`；路由器明确表示你正在配置系统。在配置提示符下，你可以输入配置语句，每行一条。


    配置命令看起来与系统配置中的命令完全一样，直接添加到路由器的配置中。例如，要将 `service password-encryption` 这一行添加到你的配置中，只需在配置提示符下输入即可。


    ```

