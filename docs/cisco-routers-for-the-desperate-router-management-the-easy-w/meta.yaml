    \ IP address of two peers, ISP A and ISP B, and it has route maps for each.\n\n\
    Outside the BGP configuration, we have a static route for the block we wish to\
    \ announce, and a matching access list so that we can allow BGP sessions to announce\
    \ this block.\n\nFinally, we have route maps for both ISP A and ISP B, so that\
    \ we can attach the access list to the BGP session. While the route maps are initially\
    \ identical, they soon may not be, so they should be separate.\n\n## Managing\
    \ BGP\n\nView BGP activity with the `show ip bgp` commands. A plain `show ip bgp`\
    \ will display every route your router knows about via BGP, which is hundreds\
    \ of thousands of lines of output. Most people consider this less than useful.\
    \ Assorted subcommands break this down into palatable chunks, the most commonly\
    \ used of which is `show ip bgp summary`. The BGP summary is a nice snapshot of\
    \ the router's BGP information, including memory usage, routes available, flapping\
    \ routes, and so on, and ends with a very useful line for each BGP peer.\n\n```\n\
    router# sho ip b s\nBGP router identifier 10.1.8.6, local AS number 100\n...\n\
    Neighbor          V    AS MsgRcvd MsgSent  TblVer  InQ OutQ Up/Down  State/PfxRcd\n\
    10.1.8.5          4   200 1486094   19609  155050    0    0  1w6d    132868\n\
    172.16.0.2        4   300  510754   19621  155050    0    0  1w1d     115598\n\
    router#\n```\n\nBy far, the most interesting columns are Neighbor and AS, which\
    \ allow you to identify a peer by either IP address or ASN. The InQ and OutQ columns\
    \ show how many messages from or to that peer remain to be processed, respectively.\
    \ Up/Down shows how long the current BGP session has been established. Finally,\
    \ during normal operation, the State/PfxRcd column shows the number of route announcements\
    \ that your router has received from that peer. If the BGP session has just been\
    \ started or is having problems, this entry will display a word describing the\
    \ state of the BGP session. An Active session has just been started, and your\
    \ router is waiting for the other router to begin communication. An OpenSent or\
    \ OpenConfirm status indicates that your router is negotiating with the peer to\
    \ establish a connection. The Established state means that the routers are now\
    \ exchanging routing information.\n\nThe remaining columns are less useful in\
    \ day-to-day work, but might be important when troubleshooting. The MsgRcvd and\
    \ MsgSent columns tell you how often you have received and transmitted BGP messages.\
    \ TblVer gives the latest version of the BGP table that you've transmitted to\
    \ your peers. Most of the time, you will only need these when you're on the phone\
    \ with Cisco support.\n\n## Viewing Routes\n\nThe most frequently asked question\
    \ when running BGP is, \"Which circuit are we using to reach such-and-such website?\"\
    ³ That's simple with the `show ip route` command, specifying the IP address you're\
    \ interested in.\n\n³ Actually, the most frequently asked question seems to be,\
    \ \"What do you mean, BGP doesn't load balance?\" This is merely the most frequently\
    \ asked useful question.\n\n```\nrouter# sho ip route 10.3.5.8\nRouting entry\
    \ for 10.3.0.0/16, supernet\n  Known via \"bgp 200\", distance 20, metric 0\n\
    \  Tag 200, type external\n  Last update from 172.16.0.2 00:09:37 ago\n  Routing\
    \ Descriptor Blocks:\n  * 172.16.0.2, from 172.16.0.2, 00:09:37 ago\n    Route\
    \ metric is 0, traffic share count is 1\n    AS Hops 1\nrouter#\n```\n\nThe IP\
    \ address we're interested in is announced as part of a /16 block. We get the\
    \ route from our peer at AS200. This route was updated from our peer 9 minutes\
    \ and 37 seconds ago. Finally, to reach this destination we need to pass through\
    \ one autonomous system.\n\nAfter you know which path your packets will take,\
    \ you might want to know *why* they're taking that path. (Some people are never\
    \ satisfied, after all!) You can examine the BGP information for a particular\
    \ IP address with the `show ip bgp` command.\n\n```\nrouter# sho ip b 10.3.5.8\n\
    BGP routing table entry for 10.3.0.0/16, version 1912659\nPaths: (2 available,\
    \ best #1, table Default-IP-Routing-Table)\n  Not advertised to any peer\n  200\n\
    \    172.16.0.2 from 172.16.0.2 (172.16.1.3)\n      Origin IGP, metric 0, localpref\
    \ 100, valid, external, best\n  300 400 700 200\n    10.1.8.5 from 10.1.8.5 (10.1.2.87)\n\
    \      Origin IGP, localpref 100, valid, external\nrouter#\n```\n\nOur router\
    \ has two paths to this IP address, which makes sense—you have two Internet connections,\
    \ after all!\n\nWe are not re-advertising this route to our peers, which is good—if\
    \ you're advertising routes from one peer to another, you're telling the peer\
    \ that you can provide access to these IP addresses. Redistributing routes learned\
    \ via BGP to your ISPs would mean that you're paying your ISP for the privilege\
    \ of carrying the ISP's traffic for them. With proper BGP setup, you should never\
    \ re-advertise the routes you learn from your peers. (That's why we used `redistribute\
    \ static` earlier; with this set, your router will only announce the networks\
    \ it knows about via static routes to your peers.)\n\nFrom AS200, we reach the\
    \ destination IP address via an AS path of 200. This means that the target IP\
    \ is part of AS200. You would expect that AS200 has the best path to reach this\
    \ destination. BGP knows the next IP address to send the packets to, the provider's\
    \ side of the circuit going to AS200. It's figured out that this route is the\
    \ best it has.\n\nVia AS300, we reach the destination IP address via an AS path\
    \ of 300 400 700 200. In other words, the packets will have to go through four\
    \ autonomous systems. This is probably longer than the route directly through\
    \ AS200, so we don't want to take it.\n\n## Resetting BGP\n\nBGP runs almost perfectly,\
    \ and rarely has any problems at all. I've let routers run for months without\
    \ changing their BGP configurations. On occasion you might find that your routing\
    \ is behaving oddly; perhaps all of your traffic is running over one circuit,\
    \ indicating that the other peer is not sending you any routes. Or perhaps the\
    \ peer isn't receiving your route announcements, and so all of your incoming traffic\
    \ is arriving via the other ISPs. One common step in these circumstances is to\
    \ reset the BGP session, forcing your router and the peer to dump everything that\
    \ they've previously agreed on, re-initialize the connection, and completely reload\
    \ the routing table. The command for this is `clear ip bgp` followed by the neighbor's\
    \ IP address.\n\n```\nrouter# clear ip bgp 172.16.0.2\nrouter#\n```\n\nThis should\
    \ not be done lightly! Existing connections to the Internet may hang momentarily\
    \ or even terminate. The router's CPU utilization will climb dramatically as the\
    \ routes are cleared and all the new BGP information is received from the peer.\
    \ If you have an older or smaller router, you can expect your terminal window\
    \ to become at least useless.\n\nOn a more serious note, the rest of the world\
    \ will see that your routes have just \"flapped\"; they've been withdrawn from\
    \ that peer, and suddenly reappear. If you do this several times in quick succession,\
    \ other autonomous systems will \"dampen\" your route announcements due to flap.\
    \ They will ignore your route updates, and they may ignore routes to your network\
    \ entirely until you can stop bouncing up and down. This is a necessary part of\
    \ BGP; sudden withdrawals and insertions of a particular"
  mdcn: "\n## 完整的BGP配置\n\n配置完成后，你的BGP配置应如下方示例所示。如果此配置中缺少任何部分，BGP将无法工作。配置BGP时最常见的问题就是忘记了配置过程中的某一步骤。请将有问题的路由器配置与这里的示例进行比较，并添加任何缺失的部分。\n\
    \n```\nrouter bgp 100\n  bgp dampening\n  network 192.168.0.0 mask 255.255.254.0\n\
    \  redistribute static\n  neighbor 10.1.8.5 remote-as 200\n  neighbor 10.1.8.5\
    \ route-map ispA-out out\n  neighbor 172.16.0.2 remote-as 300\n  neighbor 172.16.0.2\
    \ route-map ispB-out out\nip route 192.168.0.0 255.255.254.0 Null0\naccess-list\
    \ 130 permit ip host 192.168.0.0 host 255.255.254.0\nroute-map ispA-out\n  match\
    \ ip address 130\nroute-map ispB-out\n  match ip address 130\n```\n\n我们从BGP的全局配置开始，包括路由振荡抑制。然后我们配置了路由器将要宣告的路由，并指明这些路由可通过静态路由访问。路由器已知两个对等体——ISP\
    \ A和ISP B的IP地址，并且为每个对等体配置了路由策略。\n\n在BGP配置之外，我们为希望宣告的地址块配置了一条静态路由，以及一个匹配的访问控制列表，这样我们就能允许BGP会话宣告该地址块。\n\
    \n最后，我们为ISP A和ISP B配置了路由策略，以便可以将访问控制列表应用到BGP会话。虽然这些路由策略最初是相同的，但它们可能很快就会变得不同，因此应该分开配置。\n\
    \n## 管理BGP\n\n使用`show ip bgp`命令查看BGP活动。一个简单的`show ip bgp`将显示你的路由器通过BGP了解到的所有路由，这通常是成千上万行的输出。大多数人认为这并不太实用。各种子命令可以将输出分解成易于处理的部分，其中最常用的是`show\
    \ ip bgp summary`。BGP摘要信息是路由器BGP信息的良好快照，包括内存使用情况、可用路由、振荡路由等，最后对每个BGP对等体都有一行非常有用的信息。\n\
    \n```\nrouter# sho ip b s\nBGP router identifier 10.1.8.6, local AS number 100\n\
    ...\nNeighbor          V    AS MsgRcvd MsgSent  TblVer  InQ OutQ Up/Down  State/PfxRcd\n\
    10.1.8.5          4   200 1486094   19609  155050    0    0  1w6d    132868\n\
    172.16.0.2        4   300  510754   19621  155050    0    0  1w1d     115598\n\
    router#\n```\n\n到目前为止，最有趣的列是\"Neighbor\"和\"AS\"，它们允许你通过IP地址或ASN来识别对等体。\"InQ\"\
    和\"OutQ\"列分别显示了来自该对等体或发往该对等体的待处理消息数量。\"Up/Down\"显示当前BGP会话已建立的时间。最后，在正常运行期间，\"\
    State/PfxRcd\"列显示你的路由器从该对等体接收到的路由通告数量。如果BGP会话刚刚启动或出现问题，此条目将显示一个描述BGP会话状态的单词。\"\
    Active\"状态表示会话刚刚启动，你的路由器正在等待另一台路由器开始通信。\"OpenSent\"或\"OpenConfirm\"状态表示你的路由器正在与对等体协商以建立连接。\"\
    Established\"状态意味着路由器现在正在交换路由信息。\n\n其余列在日常工作中用处不大，但在故障排除时可能很重要。\"MsgRcvd\"和\"\
    MsgSent\"列告诉你接收和发送BGP消息的频率。\"TblVer\"给出了你传输给对等体的BGP表的最新版本。大多数时候，你只有在与Cisco技术支持通话时才会需要这些信息。\n\
    \n## 查看路由\n\n运行BGP时最常被问到的问题是：“我们使用哪条电路去访问某某网站？”³ 使用`show ip route`命令并指定你感兴趣的IP地址，这个问题就很容易回答了。\n\
    \n³ 实际上，最常被问到的问题似乎是：“你说BGP不进行负载均衡是什么意思？”这仅仅是最常被问到的有用问题。\n\n```\nrouter# sho ip\
    \ route 10.3.5.8\nRouting entry for 10.3.0.0/16, supernet\n  Known via \"bgp 200\"\
    , distance 20, metric 0\n  Tag 200, type external\n  Last update from 172.16.0.2\
    \ 00:09:37 ago\n  Routing Descriptor Blocks:\n  * 172.16.0.2, from 172.16.0.2,\
    \ 00:09:37 ago\n    Route metric is 0, traffic share count is 1\n    AS Hops 1\n\
    router#\n```\n\n我们感兴趣的IP地址作为/16地址块的一部分被宣告。我们从AS200的对等体那里获知此路由。此路由在9分37秒前从我们的对等体处更新。最后，要到达此目的地，我们需要经过一个自治系统。\n\
    \n在知道数据包将走哪条路径后，你可能想知道它们*为什么*走那条路径。（有些人就是永不满足！）你可以使用`show ip bgp`命令检查特定IP地址的BGP信息。\n\
    \n```\nrouter# sho ip b 10.3.5.8\nBGP routing table entry for 10.3.0.0/16, version\
    \ 1912659\nPaths: (2 available, best #1, table Default-IP-Routing-Table)\n  Not\
    \ advertised to any peer\n  200\n    172.16.0.2 from 172.16.0.2 (172.16.1.3)\n\
    \      Origin IGP, metric 0, localpref 100, valid, external, best\n  300 400 700\
    \ 200\n    10.1.8.5 from 10.1.8.5 (10.1.2.87)\n      Origin IGP, localpref 100,\
    \ valid, external\nrouter#\n```\n\n我们的路由器到这个IP地址有两条路径，这很合理——毕竟你有两个互联网连接！\n\n我们没有将此路由重新通告给对等体，这是正确的——如果你将一个对等体的路由通告给另一个对等体，就是在告诉该对等体你可以提供对这些IP地址的访问。将从BGP学习到的路由重新分发给你的ISP意味着你在为ISP代为传输他们的流量而付费。在正确的BGP设置下，你不应该重新通告从对等体学习到的路由。（这就是为什么我们之前使用了`redistribute\
    \ static`；设置此项后，你的路由器将只向你的对等体宣告它通过静态路由获知的网络。）\n\n通过AS200，我们经由AS路径200到达目的IP地址。这意味着目标IP是AS200的一部分。你可能会预期AS200拥有到达此目的地的最佳路径。BGP知道要将数据包发送到的下一个IP地址，即通往AS200的电路的提供商端。它已确定这条路由是它拥有的最佳路由。\n\
    \n通过AS300，我们经由AS路径300 400 700 200到达目的IP地址。换句话说，数据包必须经过四个自治系统。这可能比直接通过AS200的路径更长，所以我们不想选择它。\n\
    \n## 重置BGP\n\nBGP运行几乎完美，极少出现问题。我让路由器运行数月而无需更改其BGP配置。偶尔你可能会发现你的路由行为异常；也许你所有的流量都运行在一条电路上，表明另一个对等体没有向你发送任何路由。或者对等体可能没有收到你的路由通告，因此你所有的入站流量都来自另一个ISP。在这种情况下，一个常见的步骤是重置BGP会话，迫使你的路由器和对等体丢弃之前达成的所有协议，重新初始化连接，并完全重新加载路由表。此命令是`clear\
    \ ip bgp`后跟对等体的IP地址。\n\n```\nrouter# clear ip bgp 172.16.0.2\nrouter#\n```\n\n\
    这不应轻易执行！现有的互联网连接可能会暂时挂起甚至中断。在清除路由并从对等体接收所有新的BGP信息时，路由器的CPU利用率将急剧上升。如果你使用的是较旧或较小的路由器，你可以预期你的终端窗口至少会变得无法使用。\n\
    \n更严重的是，世界其他地方会看到你的路由刚刚“振荡”；它们从该对等体被撤销，然后突然重新出现。如果你快速连续多次这样做，其他自治系统会由于振荡而“抑制”你的路由通告。它们会忽略你的路由更新，并且可能完全忽略通往你的网络的路由，直到你能停止这种反复变化。这是BGP的必要组成部分；特定路由的突然撤销和插入\n\
    \n"
