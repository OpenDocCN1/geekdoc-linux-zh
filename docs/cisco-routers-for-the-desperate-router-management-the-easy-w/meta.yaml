    same size are *not sufficient*. If you do not currently have that large a block
    of addresses, talk with the salesperson for your second connection. Chances are
    that the ISP will be willing to issue you a sufficiently large block of IP addresses
    to run BGP in order to get your business—after all, without the addresses they
    don’t need a second circuit! They might charge you for your IP addresses, however.


    You must have at least one block /24 or larger to get an ASN.


    # Getting an ASN


    The American Registry for Internet Numbers (ARIN) assigns Autonomous System Numbers
    in the Western Hemisphere. (If you are elsewhere in the world, you will have your
    own regional number administration.) The application process is very simple, if
    you have everything ready before applying. ARIN’s website at http://www.arin.net
    has documentation on the ASN request process and a blank template.


    Only organizations registered with ARIN can request an ASN. Registering an organization
    is free and gives your organization an ARIN organization ID, or `Org ID`. You
    use the Org ID as a point of contact for the ASN request form. You can get the
    request form from the ARIN website. As an organization brand new to ARIN, you
    *must* use the detailed Org ID request form. The request form is plain text; everything
    after a pound sign (#) is a comment, while every place there is a colon is a place
    you are expected to put an answer. Example answers appear below the question where
    appropriate. We’re not going to walk through the entire Org Id request form, because
    the questions it asks are very basic: names, addresses, phone numbers, and so
    on. Send the completed form to hostmaster@arin.net with a subject of “ORGANIZATION
    TEMPLATE.”


    Within a few days, you should receive a notice that your organization has been
    registered and giving the details of your organization’s information. One important
    piece of information is your new org handle, which contains an alphanumeric code
    for your organization. Each contact you defined for your organization will also
    receive a handle. Note the handle codes, because you’ll need them to request your
    ASN. (If you forget your handles, you can use the Whois search engine on the ARIN
    website to search for your organization’s entry.)


    When you have an Org ID, you can fill out an ASN request template. Because some
    of the questions can be tricky, we’ll walk through the current version of the
    form.'
