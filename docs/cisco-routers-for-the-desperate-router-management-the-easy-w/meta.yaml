  mdcn: "\n## 1 熟悉命令行\n\n本书完全聚焦于命令行。为什么？一些 Cisco 路由器包含 Web 界面，而另一些则没有。Cisco 出售高级路由器管理软件包，但它们需要一个复杂的客户端环境，而当你真正需要它时，可能无法使用该环境。你可能一年才需要登录一次路由器，甚至更少；在这种情况下，你的桌面系统及其所有花哨的管理工具在期间经历了某种剧烈变动，导致路由器工具不再按预期工作，这种概率有多大？就个人而言，我不喜欢在路由器宕机时还得尝试解决\
