    will now have two extra 300s in front of it, much like this:


    ```

    300 300 300 400

    ```


    This will make the other AS path appear shorter and thus make it preferable for
    this route.


    Do not be too quick with AS path prepending. While we added two AS hops in this
    example, it is best to add a single AS hop to a peer at a time to see how it affects
    performance. If necessary, you can add additional hops later. (You do have MRTG
    running to display the effects of this every few minutes, correct?)


    If your incoming traffic is biased toward one peer or another, change your outgoing
    announcements to balance those. The important thing to remember here is that you
    must prepend your own AS number to outbound announcements instead of your peer’s.
    You would be quite annoyed if someone else started using your AS number, and you
    can expect that your peers feel the same about theirs.


    The nice thing here is that you already have outbound route maps. To add an AS
    path prepend, simply edit the existing map to add the line for AS path prepending.


    ```

    router# conf t

    router(config)# route map ❶ispB-out permit 10

    router(config-route)# ❷set as-path prepend 100

    ```


    Our BGP configuration already references the ispB-out route map, so we don’t have
    to touch the BGP configuration at all. Just go into configure mode and edit the
    ❶ existing route map to add the ❷ AS prepending rule. You still must clear the
    BGP session with this peer to make the change take effect, however.


    # Propagation of BGP Updates


    Now that you know enough about BGP to be dangerous, you should know that BGP announcements
    may take up to 20 minutes to be visible throughout the world. Although your peers
    should pick them up quickly, you can’t expect that every-one everywhere is so
    well connected to you. After changing your'
- md: ' BGP setup, wait at least 20 minutes to see what the real effects are before
    making another change. This will also help reduce the risk of being marked as
    a flapping BGP source and blackholing yourself off the Internet.


    If you want to see how your BGP announcements are being viewed by the outside
    world, search the Internet for a "BGP Looking Glass." These are web pages that
    allow you to query routers for BGP information. By asking remote routers for BGP
    information on your block of IP addresses, you can see what announcements they
    are seeing and how other people view your network. If you are having a problem
    with BGP configuration, you can use several looking glasses to determine who can
    see your routes and who cannot, and thereby identify the scope of the problem.
    This information can also help you to identify problems such as one of your peers
    not propagating your announcements beyond their network or altering your announcements
    in some way.


    ## Hot Standby Router Protocol


    After you have BGP up and running, the next obvious question is, "What do we do
    if the router itself fails?" While Cisco routers are generally reliable, even
    the best hardware sometimes lets the magic smoke escape and transforms into a
    shiny metal paperweight. Cisco supports the Hot Standby Router Protocol (HSRP)
    to provide live failover between routers in this eventuality. You can build a
    "pool" of independent Cisco devices that will take over some functions of a failed
    router; not all of the functions are covered, but enough are so that your users
    will not notice.


    ## What Is HSRP?


    HSRP lets multiple routers provide a single IP address. This is most useful for
    your default gateway on your Ethernet. All your computers know about the routers
    is that one of them had better have the default gateway of (for example) 192.168.0.1;
    they don''t care which router has it, just that it''s available. HSRP allows the
    routers to keep track of each other; when the router that has the default gateway
    disappears from the network, another router can automatically respond to requests
    for the default gateway''s IP address. In this case, each router has its own unique
    IP address on its Ethernet interface, but might also have the default gateway
    as shown in Figure 7-2.


    Router A has an Ethernet interface on the office network. This interface has the
    primary IP address of 192.168.0.2, but it can also host the IP address 192.168.0.1—the
    default gateway for your computers. If you want to log in to Router A, SSH to
    the address 192.168.0.2. Similarly, Router B also has an Ethernet interface on
    the office network and a unique IP address of 192.168.0.3, but it can also host
    the default gateway of 192.168.0.1. The routers settle between themselves which
    is the "default" default router, but when that router fails, the other will take
    over. In Cisco terminology, the IP address 192.168.0.1 is the *standby* address.
    (Other implementations commonly call this a Virtual IP, or VIP.)


    Very basic configuration of this Ethernet interface is only a couple of lines.


    ```

    router(config)# int faste0/0

    router(config-if)# ip address 192.168.0.2 255.255.255.0

    router(config-if)# standby 1 ip 192.168.0.1

    ```


    Apply the standby entry to both router configurations, and abruptly you''ll be
    able to ping 192.168.0.1. Keep pinging that IP while you reboot routers, and you
    won''t even see a single dropped packet—unless, of course, you turn both routers
    off at once!


    A single router interface can support multiple HSRP standby IP addresses. Each
    has to be identified as a group. Use the group identifier in every configuration
    involving that particular standby IP.


    ## Tuning HSRP


    While the above will handle most of the work of live failover for most circumstances,
    you''ll find that HSRP requires some fine-tuning to be truly transparent. The
    most commonly tweaked features are preemption, interface tracking, delay, and
    authentication.


    ### Preemption


    Preemption is where a particular interface declares itself to be in charge of
    the standby IP address and forces all others to relinquish their claims to that
    address. This means that a particular router defaults to supporting the HSRP,
    letting all others only be backups. This is handled by assigning a priority to
    each interface that supports the standby IP, and letting the router with the highest
    priority claim it. By default, every router in a standby group has a priority
    of 100. To set a priority, use the keyword priority in the configuration.


    ```

    router(config)# int faste0/0

    router(config-if)# standby 1 preempt

    router(config-if)# standby 1 priority 105

    ```


    Start by allowing this router to demand to host the standby IP from lower-priority
    routers. If you use preemption, all routers in a standby group should have this
    entry. Then set this particular router to have a priority of 105.


    ### Interface Tracking


    It can be convenient to assign a single router to be the master of the standby
    group, if only so you know which router is in charge. (Network administrators,
    as a class, are not comfortable saying that "traffic goes into a cloud near our
    routers and magic things happen." They prefer statements such as, "Traffic will
    unquestionably go to Router A as long as A is running.") At times, your chosen
    router might not be a sensible choice. Look at Figure 7-2 again. Each of our routers
    has a single line to the Internet. If a router''s Internet circuit goes down,
    it no longer makes sense for that router to be the standby master; traffic would
    go through an extra hop for no good reason. We can cause a router''s HSRP priority
    to drop by using interface tracking. When your interface being tracked goes down,
    the HSRP priority automatically decreases.


    ```

    router(config)# int faste0/0

    router(config-if)# standby 1 track Serial0

    ```


    The standby IP number 1 is monitoring the interface Serial0. When Serial0 goes
    down, it will automatically decrease its priority by 10. If this router''s priority
    has been set to 105, it will become 95. Because the other router has the default
    priority of 100, it suddenly has higher priority and takes over as the standby
    IP.


    ### HSRP Delay


    When a router first boots, it takes a few seconds for it to get its bearings and
    start routing traffic. If the router uses BGP, those few seconds can be as long
    as a minute or two. HSRP, on the other hand, works quickly. If your preferred
    router takes over the standby IP address before it has a chance to sort out its
    BGP routing tables, traffic will stop flowing until the router is comfortable.
    To let your router get its feet properly under the table, you can assign a delay
    to HSRP failover.


    Time how long it takes for your router to reassemble all of its BGP sessions and
    for the CPU to drop to only normally busy after you type clear ip bgp *. Round
    it up 10 or 15 seconds, just to allow time for the unexpected. That''s how long
    your standby IP should wait before failing over.


    ```

    router(config)# int faste0/0

    router(config-if)# standby 1 preempt delay minimum 60

    ```


    This router will wait a minimum of 60 seconds before taking over the standby IP
    address.


    ### Authentication


    It''s quite unlikely that an intruder would break into your HSRP cluster. This
    would require a fair amount of talent and knowledge. If they managed to do so,
    however, the effects could be devastating. Imagine if an intruder funneled all
    network traffic through a packet analyzer illegally installed on one of your machines;
    they could capture usernames, passwords, credit card numbers, customer details,
    and so on. For that reason, using some basic authentication on your HSRP standby
    group is a good idea. HSRP uses a simple password for authentication. Any router
    that knows the password is permitted to participate in the HSRP group.


    ```

    router(config)# int faste0/0

    router(config-if)# standby 1 authentication PassWord

    ```


    Here, we set standby group 1 to use a password of Password. It might not be the
    strongest authentication mechanism in the world, but it''s far better than nothing.


    Given these features, you should be able to tune HSRP to do almost anything you
    like. There''s one more complication with router redundancy, however: routing.


    ## BGP and HSRP


    Take another look at Figure 7-2. We have Router A connected to ISP #1, and Router
    B connected to ISP #2. Both Router A and Router B are announcing their network
    addresses to their ISPs. Systems in the outside world will send their traffic
    to your network via their closest route. But with HSRP set up as we''ve discussed,
    your network will only use one outbound circuit at a time! Think about it; Router
    A only knows of routes it receives from ISP #1, so that''s where it sends everything.
    If Router A is holding the default route, even traffic meant for ISP #2 will go
    out via ISP #1. This is inefficient, and it places a very real limitation on your
    bandwidth use. To actually use both ISPs for outbound traffic, you need to speak
    BGP between your routers.


    In Figure 7-2, we show a pair of separate Ethernet interfaces for a connection
    between the two routers. Router A has the IP address of 192.168.1.1, while Router
    B has 192.168.1.2. Nothing else is on this network; I just use a crossover cable
    between the two routers.


    > **NOTE** *Nugget of Wisdom*

    > *Yes, you can speak BGP over the shared network where the rest of your traffic
