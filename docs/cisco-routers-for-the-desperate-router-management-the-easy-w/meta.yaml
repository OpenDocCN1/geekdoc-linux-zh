    ## 运行配置与启动配置


    路由器在任何时候都有两份配置：*启动配置*和*运行配置*。启动配置存储在路由器的非易失性内存中，用于在启动过程中配置路由器。此时，启动配置的副本会被放入运行配置中。如果你在操作期间更改路由器的配置，你实际上是在更改运行配置。当你保存运行配置时，它会覆盖之前的启动配置，成为新的启动配置。如果你在重启路由器之前没有保存更改，这些更改将会丢失。


    > **注意** 这其实就是说：保存你的更改，否则下次重启时就会丢失！更改路由器配置与在文字处理器中编辑文档没有什么不同；如果不保存就退出，你就会丢失工作。这可能好也可能坏；如果你真的把路由器配置搞砸了，不要害怕利用这一点来为你所用！


    从技术上讲，你可以说启动配置是一个配置文件；它存储在非易失性 RAM 中，就像磁盘上的文件一样。然而，思科专家通常不会把启动配置称为配置文件；它只是"配置"。运行配置肯定不是文件；它是启动配置的（可能经过修改的）副本，保存在内存中。


    ## 启动配置


    要查看路由器启动时将使用的配置，请输入 `show startup-config` 命令。


    ```

    router# show startup-config

    Using 5620 out of 129016 bytes

    !

    version 12.0

    ...

    ```


    路由器从永久存储中读取配置，并 ❶ 告诉你它占用了多少空间，然后才显示 ❷ 配置本身。


    ## 运行配置


    要查看当前（运行中）的配置，请输入 `show running-config` 命令。¹


    ```

    router#show running-config

    ❶Building configuration...

    ❷Current configuration:

    !

    version 12.0

    ...

    ```


    注意输出的第一行，路由器告诉你它正在从内存中 ❶ 组装当前配置。然后它 ❷ 提醒你这是当前内存中的配置，可能与 NVRAM 中的内容一致也可能不一致。然后它会逐屏显示配置。


    ## 阅读配置


    我们不会在这本书中剖析一份完整的路由器配置，因为即使是一个小型路由器的工作配置也很容易达到 200 行。不过，以下是阅读这份配置的方法。


    Cisco IOS 配置由一系列语句组成。每条语句要么为某个接口、某个协议或整个路由器激活或停用某个功能，要么定义路由器的某些全局特性。你还会看到感叹号，IOS
    用它来表示配置的各个部分之间的分隔。（如果你将路由器配置副本存储在路由器以外的其他地方，你可以使用感叹号来表示注释，就像许多程序配置文件中使用的井号一样。这种情况很少见，因为路由器加载配置时会剔除这些注释。）例如，以下是一个小型路由器配置文件的一些片段。


    > ¹ 老牌的思科用户可能还记得这是 `write terminal` 或 `wr t`。`wr t` 本身没有什么不好，但被认为已经过时了。


    ```

    ...

    ① service timestamps debug uptime

    ② !

    ③ hostname router.blackhelicopters.org

    ...

    ```


    这台路由器 supporting ① 网络服务 timestamps、debug 和 uptime。（只需在配置文件中列出它们就足以启用这些服务。）


    我们还有一个全局配置变量，即 ③ 路由器的主机名。如果路由器认为配置部分之间足够不同，它会在它们之间放置一个 ② 空行。


    ```

    ...

    ① ip subnet-zero

    ② ip domain-name blackhelicopters.org

    ③ no ip finger

    ...

    ```


    这台路由器有两个互联网协议（IP）设置：① 启用了 subnet-zero 功能，② 设置了 IP 域名。相反，"no" 设置会禁用某个特定服务；在这种情况下，③
    finger 服务被关闭了。


    ```

    ...

    ① interface Serial1/1

    ② description main office T1

    ③ no ip redirects

    ...

    ```


    这里我们有一个 ① 特定路由器接口 的配置。该接口的配置信息 ② 直接出现在它的下方，并且前面有一个空格。注意我们在这里专门关闭了 ③ 某个特定的 IP 功能，即
    ip redirects；我们可以在路由器全局启用这个功能，然后逐个接口地禁用它。


    ```

    ...

    ① router bgp 8292

    ② bgp dampening

    ...

    ```


    同样，① 路由器上配置的每个主要路由协议 都有自己的部分。该协议的配置（dampening）② 直接出现在其下方，以空格开头。


