  pgno: 118
- img_proc: true
  md: 'When you''re in ① standard configure mode, the command ② enable secret and
    a password string will set the enable secret. You don''t want any sort of easily
    retrievable password on any system, so be sure to ③ disable the old-fashioned
    enable password.


    These passwords will provide some basic protection to your system. You can also
    change passwords at any time with exactly the same commands you used to set them
    in the first place.


    # Usernames


    While global passwords are sufficient to protect your router from the most ignorant
    network intruders, you will probably want to secure the remote command-line access
    to the router. Cisco provides secure shell (SSH) server for secure remote administration.
    SSH requires that each user have a username. In large networks, you can use usernames
    to assign different users different privilege levels on each router as required.


    Each user needs a username, a password, and a privilege level. Privilege levels
    range from 1 (unprivileged EXEC) to 15 (privileged EXEC). To create a username,
    just go into configure mode and enter all the information.


    ```

    router(config)# username ①mwlucas privilege ②15 password ③mwlucas-password

    router(config)# username ④kgball privilege ⑤1 password kgball-password

    ```


    The first username we''re creating is ① mwlucas. This user has a ② privilege level
    of 15, meaning that he is in enable mode when he logs in. While you give this
    user''s ③ password on the command line when you''re creating him, it will be hashed
    and appear scrambled when you view the configuration later.


    The second username we''re creating is ④ kgball. The only different thing about
    him is that he is at ⑤ privilege level 1. He can look at everything but cannot
    make any changes, exactly as if he only had the front door password.


    While you can assign particular privilege levels to different commands, and then
    assign each user a privilege level commensurate with their duties and abilities,
    in most small networks two privilege levels are quite sufficient.


    # *Making Lines Check Usernames*


    After you have assigned usernames and passwords, you need to tell the router''s
    lines to use them. Adding the login local line to a line will tell the router
    to check incoming connection'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'requests against the local users database. For example, to make the console
    check usernames you would just do this:


    ```

    router# conf t

    router(config)# line con 0

    router(config-line)# login local

    ```


    You can mix and match different authentication methods on different lines. By
    setting login local on the vty lines and login on the con port, you require a
    username and password for remote access but the standard front door password for
    the console. This provides more than enough possible combinations for you to completely
    lock yourself out of the system.


    # Remote Router Access


    Cisco routers support a variety of methods for administration over the network.
    The most common methods of accessing a router are telnet and SSH.


    Telnet was the standard method to get a command prompt on a remote system for
    many, many years. Unfortunately, everything sent over telnet is unencrypted. For
    twenty-odd years, this didn''t matter a great deal, but these days the Internet
    is much less friendly. A hostile Internet user between your computer and your
    router can capture your router passwords and do anything they like to your router.
    If you must use telnet, be certain you only use it from a trusted network local
    to the router and not over the public Internet. Both Unix and Windows include
    a command-line telnet client. If at all possible, use SSH instead of telnet.


    SSH, or Secure Shell, is the modern replacement for telnet. All communications
    between client and server are encrypted, so that same hostile user cannot capture
    any useful information. While all modern Unix versions include an SSH client,
    Windows users will need to get an add-on SSH client. Many clients are available
    from the Internet, but one of the most commonly recommended is puTTY. A Google
    search will take you directly to any number of download sites.


    Many Cisco routers support other configuration methods, such as a web interface.
    Like telnet, any information you transmit is sent over the network unencrypted,
    and anyone who knows how to can capture it and gain unrestricted access to your
    router. A router''s web interface is frequently not as flexible as the command
    line. Between the two, there is little to recommend the web interface.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Enabling Telnet


    To use telnet, the router must have a password set on the vty lines, or local
    usernames and passwords that the vty lines can be told to authenticate against.
    If you have already set a password on the lines, just adding the transport input
    telnet configuration option to the vty line configuration will turn on telnet.


    ```

    line vty 0 4

    ! password 7 0231004206EA2C295D4848

    transport input telnet

    ```


    If a ! password is not set on the vty lines, the router will reject all attempts
    to connect via telnet. Otherwise, telnet will just start working with this simple
    configuration. If you want to use local usernames, skip assigning a password on
    the vty lines. Just be certain to add the option login local to the vty line configuration
    in addition to the transport input telnet line.


    ```

    router# conf t

    router(config)# line vty 0 4

    router(config-line)# login local

    router(config-line)# transport input telnet

    ```


    This tells the router to authenticate incoming telnet requests against the local
    usernames list.


    # Enabling SSH


    The SSH protocol might be more secure than telnet, but its complexity leads to
    its needing more configuration than telnet. Much of this configuration is stuff
    that is nice to have on a router anyway, so it shouldn''t be a burden.

    To use SSH, the router must have an IOS version that supports SSH. Generally speaking,
    the Enterprise and DES feature sets include SSH support. If your router doesn''t
    have an IOS version that supports SSH, get a new one from Cisco. Feel free to
    open a request with Cisco''s Technical Assistance Center, requesting help in selecting
    an IOS version, or if you''re brave, you can wander through the Cisco website
    and use its IOS selection tool. Also go back and read Chapter 6 carefully.

    The router must have user accounts on the virtual terminals instead of generic
    passwords, as discussed earlier this chapter. When you have those, however, your
    router must know its hostname and its domain name.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '```

    router# conf t

    router(config)# hostname router.blackhelicopters.org

    router(config)# ip domain-name blackhelicopters.org

    ```


    This particular machine has the hostname router.blackhelicopters.org and is part
    of the domain blackhelicopters.org. While you might expect that a router could
    determine its domain name from the hostname, if you have fourth- and fifth-level
    domains, this gets harder to do than it sounds. After you have these basics set,
    you can finish configuring SSH. One easy way to determine if your current IOS
    version supports SSH is to run these commands. If the router doesn''t recognize
    them, your IOS doesn''t support SSH, and you need to change to a different one.


    ```

    router(config)# crypto key generate rsa

    router(config)# ip ssh timeout 60

    router(config)# ip ssh authentication-retries 3

    router(config)# line vty 0 4

    router(config-line)# transport input ssh

    ```


    After you have the hostname and domain name set, generate an RSA cryptographic
    key for your router. An RSA cryptographic key is a pair of very large numbers
    that your router uses as a key to prove its identity to SSH clients. This key
    will not show up in your router''s configuration file; it''s stored separately.


    SSH has two other options that you can set; the number of seconds that the router
    will leave an idle SSH connection up before closing it, and the number of tries
    an incoming SSH connection has to enter a correct password. In this case, the
    router will leave SSH connections open for 60 seconds and give users three chances
    to enter the correct password.


    Finally, we need to configure the virtual terminals and tell the router that SSH
    is the incoming transport method that it should accept. Of course, we also have
    to have the login local statement so that the network will authenticate against
    the usernames and passwords stored on the router.


    Now you can securely access your router from anywhere in the world. Let''s go
    on to look at some other features offered by Cisco to make your router a real
    participant in your network instead of a mysterious gray box.'
  merge: -1
  pgno: 122
