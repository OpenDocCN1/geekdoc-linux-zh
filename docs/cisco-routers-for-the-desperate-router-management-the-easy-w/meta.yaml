    line vty 0 4\n login local\n transport input telnet ssh\n```\n\n第一个条目是控制台端口。像所有真正的计算机设备一样，Cisco从零开始给端口编号。这个控制台端口有一个密码；即使你连接串行电缆并启动HyperTerminal，你也必须输入密码。如果你的路由器物理上不安全，比如在共享的托管中心，这可能是必要的。（如果你公司有喜欢在不该去的地方闲逛的员工，也可能是必要的。）如果你的路由器配置正确，实际密码是以加密形式存储的。\n\
    \n辅助端口也编号为0，并且有密码。虽然控制台和辅助端口的密码都是加密的，但你可以看到它们是相同的。\n\n最后，我们有虚拟终端。这个系统配置了五个虚拟终端，编号从0到4。`login\
