  md: '# 6


    # IOS CHANGES


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_80_0.png)


    Cisco''s Internetwork Operating System (IOS) is the brains of any Cisco router;
    it provides the command line, interface device drivers, routing software, and
    all the other bits that make a router do more than draw power and generate heat.
    Cisco continuously maintains and updates IOS, adding more features as they become
    useful and stable. If you want some of Cisco''s nifty new functionality, you''ll
    probably find it in an IOS upgrade.


    The only reasons to upgrade are for security, stability, or required features.
    While it might be cool to have the latest IOS, that is insufficient motivation
    for staying up all night hoping'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'that a “bad upgrade recovery process” works. I advise you to find any technical
    justification you can to not perform an upgrade. A successful upgrade only causes
    a few minutes of downtime, but a failed upgrade can take the router out of action
    for several hours.


    > **NOTE** *SmartNet and IOS Upgrades*

    *Do not attempt an IOS upgrade without a SmartNet support agreement! An IOS upgrade
    gone bad may leave your router completely unusable without advanced help. I’ve
    had upgrades where the router could not find its own network interfaces, or wouldn’t
    boot at all and was stuck in rommon (BIOS) mode. Cisco has many different versions
    of IOS for each router, and installing the wrong IOS can turn your expensive router
    into an expensive chunk of metal and plastic that requires expert help to repair.*


    If everything goes perfectly, the upgrade process is quick and easy: get the new
    IOS file onto the router’s flash disk and reboot.


    # Cisco Security Notifications


    Every so often, some bright person discovers a security flaw in the Cisco IOS.
    Because the router is the first point of entry onto a network, no security device
    on your network can protect it, which means that when a security hole is discovered
    in IOS, you may have to upgrade the router to keep intruders out.


    Cisco announces security issues through a customer mailing list and through security
    mailing lists such as BugTraq.


    If you’re not already on a mailing list that gets Cisco security announcements,
    you should sign up for Cisco’s customer security announcements list, cust-security-announce@cisco.com.
    Send an email containing only the words “subscribe cust-security-announce” to
    majordomo@cisco.com. You’ll receive a reply giving you instructions on how to
    confirm your subscription.


    Read all Cisco security alerts carefully. If you’re not using the targeted functionality
    mentioned in an alert, or if the problem doesn’t affect your equipment, don’t
    worry about it. But if the alert affects you, schedule a maintenance window to
    take the router down and upgrade the IOS.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# # Upgrade Preparations


    Before upgrading, make sure that you have an FTP server available close to the
    router. (The official Cisco documentation discusses using a TFTP server, but an
    FTP server is far more secure and no more difficult to use than a TFTP server.)
    You''ll need a user account and password on that FTP server along with a few megs
    of disk space. (If you don''t have FTP server software, you''ll find dozens of
    free ones on sites like http://www.tucows.com and http://www.freshmeat.net.)


    An emergency Internet connection is also useful in case something goes wrong.
    Although Cisco has extensive disaster recovery documentation on its website, it
    will be largely useless if you don''t have Internet access! By setting up an account
    with a dial-up ISP for one of your workstations, you''ll be able to access this
    information easily. A number of ISPs allow their users a certain number of dial-up
    hours free each month; I have a NetZero account set up at the office for exactly
    this purpose.


    Finally, confirm that you have a Cisco console cable and that it works. If the
    upgrade goes really, really badly, you may have to console in to restore service.


    # ## IOS Versions


    Once you have these trivialities out of the way, you''ll need a new IOS image
    to install. Cisco''s IOS is released in several parallel versions, each with a
    unique version number. For example, "12.0" is an older release, "12.1" is a later
    version, "13.0" is more recent still, and so on. You know the drill.


    +   - Each release is available in a variety of patch levels, indicated in parenthesis
    after the main release number, like 12.0(7). (This may not be the seventh release
    of version 12.0, by the way; you''ll also see further divisions, such as 12.0(5)a
    and 12.0(5)b.)

    - Cisco adds capital letters to the end of the release name to indicate special
    branches or versions of a particular IOS release, as in 12.0(7)XK. These letters
    may change as features are shuffled from branch to branch. (It is possible—but
    not easy—to track a particular set of features from version to version and release
    to release.)'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Choosing Your IOS Version


    Because of the various ways that IOS images are labeled, choosing the new IOS
    image to install on your router is often the trickiest part of the upgrade. You’ll
    want an IOS version that contains all the necessary device drivers for your hardware,
    with support for the features you require.


    The simplest way to get the correct IOS version is to open a Technical Assistance
    Request at Cisco’s website. Run show tech on your router, capture the output,
    and attach it to your request so that your support tech will have everything he
    needs to make an informed decision. Cisco usually responds to these requests within
    hours with a custom link to the exact image you need.


    Cisco also provides the Software Advisor Web tool, which purports to guide you
    to the correct version of IOS for your exact hardware. More than once, I’ve used
    this tool and found that the version I downloaded won’t work on my router; either
    the router refuses to boot with that IOS image, or the new IOS won’t recognize
    some of my router interfaces. Feel free to try it, if you’re into recovering damaged
    systems or if risking router failure under load gives you a warm, fuzzy feeling.


    One way or another, you’ll get a file containing the new IOS version. This file
    is called an *image*. Put your new IOS image on your FTP server. Do not change
    the file’s name.


    # Find the Current IOS Image


    If your shiny new IOS image doesn’t work the way Cisco promises, you’ll want to
    be able to fall back to your current IOS version and router configuration so you
    can at least restore service. The current version is somewhere on your router’s
    flash disk. As shown in Chapter 2, the image name that the router booted with
    is shown in the show version output. Perhaps half a dozen lines down in the show
    version output you’ll see the System image file entry.


    ```

    ...

    System image file is "①flash:②c3640-is56i-mz-120-7-XK1"

    ...

    ```


    The image file is stored on ① internal flash and is ② named c3640-is56i-mz-120-7-XK1.
    This is the file you want to back up.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '> **NOTE** Routers have many potential image storage locations, including internal
    flash, removable flash cards, or other storage media. Having additional space
    to store images is nice, because it allows you to easily recover from installing
    an unsuitable image.


    # Viewing Disk Contents


    Go into enable mode and enter dir /all.


    ```

    router# dir /all

    Directory of flash:/


    1 -rw- 9270984 <no date> c3640-is56i-mz-120-7-XK1.bin

    2 -rw- 25 <no date> snmpengineid


    33554432 bytes total (24283292 bytes free)

    ```


    There''s only one file on this router, our boot image. There isn''t enough room
    on this flash device to store another image—we have used more space with the existing
    image than we have left free. While this particular router has two slots for flash
    cards, neither slot has a card in it.


    If you have a router with PCMCIA slots for flash memory, I highly recommend that
    you purchase a Cisco-branded flash card. Although they cost a few hundred dollars,
    it will make recovering from a failed upgrade much, much easier. (Regular flash
    cards will almost certainly not work with a Cisco router; don''t even bother trying
    them.)


    # Copying Files


    The copy command duplicates an existing file elsewhere, just like its DOS equivalent.
    The syntax is


    ```

    router# copy <current location> <new location>

    ```


    The difficult part is knowing the syntax for the various locations you might be
    copying from. Copying from one filesystem to another is perhaps the easiest; all
    you need is the full path to each filename. For example, if we have an IOS image
    on flash that we want to copy to a flash card in slot 0, we would just use


    ```

    router#copy flash:c3640-is56i-mz-120-7-XK1.bin slot0:c3640-is56i-mz-120-7-XK1.bin

    ```'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'By doing this, you''ve backed up your current IOS to a removable flash card
    for safekeeping. In the event that your shiny new IOS image doesn''t boot, you
    can pull the known working image off the flash disk and rapidly restore service.


    If you''re not lucky enough to have a flash card, you can copy the current image
    to your FTP server. The Cisco FTP client will not prompt you for a username and
    password for your FTP server, however, so you need to give it on the command line
    as part of the copy command. An FTP location for the copy command looks like this:


    ```

    ftp://username:password@servername/filename

    ```


    So, assume you have an FTP server running on the machine fileserver. Your account
    name is mwlucas, and the password is YrtIuarph?¹ To copy an image from the flash
    drive to the FTP server, you would issue the following command.


    ```

    router# copy flash:c3640-is56i-mz-120-7-XK1.bin

    ftp://mwlucas:YrtIuarph?@fileserver/c3640-is56i-mz-120-7-XK1.bin

    Address or name of remote host [fileserver]?

    Destination filename [c3640-is56i-mz-120-7-XK1.bin]?

    Writing c3640-is56i-mz-120-7-XK1.bin

    !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

    ....

    router#

    ```


    The router prompts you to confirm the server name and the destination filename.
    Just press ENTER if you gave the correct locations on the command line, or you
    can correct them here. (You cannot enter or correct the username or password interactively,
    however; that would be too convenient.)


    It''s also a good idea to back up your router''s configuration in case the upgrade
    goes really, really badly and the router loses its memory. You can simply use
    a text file backup if you wish, or you can actually FTP the startup configuration
    to the FTP server.


    ```

    router# copy startup-config ftp://mwlucas:YrtIuarph?@fileserver/startup-config

    ```


    When you have backed up your current system, you are finished until your maintenance
    window begins.


    ¹ This is, of course, an acronym for "You really think I would use a real password
    here?"'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Performing the Upgrade


    An IOS upgrade requires a router reboot, which interrupts service. If all goes
    well, the router will only be down for a few minutes. If the new IOS image does
    not work, you will need to reload the old IOS onto the router and reboot again.
    If you have an external flash card, or if you have enough room on the router''s
    flash memory to store multiple IOS images, you''ll be able to restore the old
    image fairly quickly. If you don''t have those features, you will need to get
    the old IOS image onto the router either via FTP, or if your router no longer
    knows it has network interfaces, via xmodem over a serial cable. Allow yourself
    at least two hours for this recovery process.


    In short, schedule a two-hour (or longer!) window of acceptable downtime for a
    router upgrade.


    # IOS Installation


    After all of this work, the new IOS installation itself is almost anticlimactic.
    Just copy the image from the FTP server to the router''s internal flash.


    ```

    router# copy ftp://username:password@servername/new-image-name flash:new-image-name

    ```


    The copy command will prompt you for confirmation. If the internal flash is too
    small to hold both the old image and the new image, it will ask you if you want
    to erase the existing flash first. Confirm that you really do have a backup of
    the old IOS image, and then proceed to erase the flash.


    After the image file is loaded onto the router''s flash storage, reload the router.
    The router should boot with the new IOS. You can confirm this with show version
    upon the next reboot.


    # Managing Multiple IOS Images


    If you are one of the lucky people with a router that has enough flash to hold
    multiple IOS images, you don''t want to erase the entire flash just to make room
    for the new image. The erase command will erase a particular file from a storage
    device, making room for the new image. Usually, you''ll have two image files on
    the flash: the version you''re currently running and the previous version. To
    fit a new image on the flash, erase the oldest image you have.


    ```

    router# erase flash: filename

    ```'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'You should now have enough room to load the new IOS image. When the router
    has enough internal flash to hold multiple IOS images, it will automatically boot
    with the first available image. Do a `dir flash:` to determine what image that
    is. If the wrong image is first, you can hard-code the image to be booted with
    a `boot system` command.


    ```

    router#conf t

    router(config)#no boot system

    router(config)#boot system flash *imagename*

    router(config)^Z

    ```


    # **Disaster Recovery**


    If your new IOS image is bad, upon a reboot the router may be unstable; it might
    not know it has any network interfaces, it might repeatedly crash, or it might
    even only boot into "rommon" mode—the Cisco equivalent of "Press F2 for Setup."


    If you are in this situation but have your old version of IOS available on the
    router itself (either on flash or on a flash card), boot the old image. This will
    at least restore service while you get Cisco on the phone and make use of your
    SmartNet contract to have them help you fix the problem.


    If you do not have the old IOS handy on the router itself—say, it''s backed up
    on your FTP server instead—you must load the image back onto the router via xmodem
    over your console cable. The process for this varies with router types and failure
    types, so we won''t go into detail here. I suggest that you immediately phone
    Cisco and open a Priority 1 case. The magic words are, "I am completely down."
    When the Cisco tech understands that your router is off the Internet and you are
    totally hosed, they will be able to immediately connect you to a technician who
    can point you to the correct recovery procedure for your router. They will even
    hold your hand and walk you through every step of the process if you desire. Even
    though I''ve had upgrades fail several times, and I know what to do for each of
    my routers, when time is running short it''s nice to have an expert on the phone.


    Now that you can upgrade your router, let''s look at providing backup connectivity.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# 7

    REDUNDANCY WITH BGP AND HSRP


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_88_0.png)


    The component of your Internet service most likely to fail is your Internet circuit.
    Cisco routers can use multiple Internet circuits from multiple providers, giving
    your network the best possible access to Internet sites and other Internet users
    the best possible access to your company.


    This is possible through the Border Gateway Protocol (BGP). BGP announces to the
    whole world what IP addresses your router is responsible for, and it listens to
    other routers to learn the best way to reach other sites. BGP is not difficult
    to understand or to implement, but it has its own tricks and traps. You may want
    to do additional research into how to make BGP meet your particular needs, but
    this section will be enough to get you up and running with multiple Internet providers.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# BGP Basics


    The key to BGP is the *Autonomous System* (AS). An AS is a single network, of
    any size, that makes its own routing decisions. If your company has only one route
    onto the Internet, your network makes no routing decisions—it dumps everything
    across that single route. If your network had two routes onto the Internet, via
    two different providers, your network would have to decide where to send each
    chunk of traffic, and you could adjust how traffic entered and left your network.
    You would be an autonomous system. Similarly, huge companies such as Level3 and
    MCI are autonomous systems. Every AS is assigned an Autonomous System Number,
    or ASN, to uniquely identify that autonomous system on the Internet. Autonomous
    systems exchange routing information via BGP. Two autonomous systems that connect
    directly to each other and exchange routing information are said to *peer*.

    Take a look at our sample network of autonomous systems (Figure 7-1). This sample
    is much smaller and much less interconnected than the real Internet, but it''s
    good enough to use to understand the basic principles. Your network is AS100 and
    peers with AS200 and AS300. AS300 in turn peers with AS200, AS400, AS500, and
    AS600.


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_89_0.png)


    *Figure 7-1: A sample network of Autonomous Systems*'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'Each AS tells its peers that IP addresses can be reached in that AS. For example,
    if your company has the block of IP addresses 192.168.8.0 through 192.168.8.255,
    your router would tell AS200 and AS300 that they should send packets bound for
    those IP addresses to your network. This is called a `route announcement`. Every
    route announcement you receive from a peer uses a small chunk of memory.


    Similarly, each of your peers tells your router what routes can be reached through
    their networks, and what networks your packets will pass through to reach their
    destinations. For example, your AS200 peer would tell you that to reach the website
    behind AS700, your packets will travel through AS200, AS400, AS600, and AS700.
    This chain of AS numbers is called an `AS path`.


    Your router will make its decisions on where to send packets based on the AS path.
    To reach the target website via the AS200 peer, your packets will have to travel
    through four autonomous systems. To reach the target website via the AS300 peer,
    the packets will travel through only three autonomous systems. Because the AS
    path is shorter via the AS300 peer, BGP dictates that your router will send packets
    bound for that website via AS300.


    When you configure BGP, you must decide how much routing information you want
    to receive from each peer. `Full routes` means that your peer will send you everything
    it knows about every network on the Internet. `Partial routes` means that the
    peer will only send you routes for networks directly attached to that network.
    `No routes` means that your router receives no routing information from that peer.
    The main reason to choose less than full routes from a peer is to reduce memory
    usage; in this case, you normally choose full routes from the smaller peer and
    partial routes from the larger peer, or if you’re really tight on memory you might
    take partial routes from the smaller peer and no routes from the larger, and choose
    to use the larger peer as your default route, assuming that the larger peer will
    have more directly connected networks than your smaller peer.


    Routes are designed to cover as many IP addresses as possible in a single route
    statement. Major ISPs announce blocks /16 or larger whenever possible. The smallest
    route announcement that will be accepted by the global Internet is a /24 (what
    used to be called a “class C” network). To use BGP, your network must have at
    least a /24 address block.¹


    > ¹ If any of this paragraph confuses you, read the appendix.'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# What BGP Isn’t


    BGP is not a load-balancing protocol. If you have two Internet circuits, BGP will
    not divide the load evenly between them. However, BGP will achieve a similar effect
    by choosing the best AS path to send packets out on. But if one provider is far
    better connected than the other, the better provider will be chosen every single
    time, resulting in asymmetric circuit usage.


    BGP neither knows nor cares about capacity, speed, or congestion when making routing
    decisions. In our earlier example, to reach the single-homed website in Figure
    7-1, we would choose to go via AS300 because it’s only three AS hops away. BGP
    doesn’t know that part of AS300 is on a satellite link to a router in Burma, where
    the packets are collected daily and delivered via camel courier to their colocation
    with the next AS in the chain. All BGP cares about is the AS path.


    BGP doesn’t tell remote people what choice to make when trying to reach your network.
    In Figure 7-1, AS400 is two hops away by either AS200 or AS300. You might have
    a DS3 to AS300 and a T1 to AS200, and would therefore prefer that people enter
    your network via AS300. If so, bad; it’s not BGP’s place to tell people these
    things. (You can use a BGP trick to work around that, but mind you, it’s certainly
    neither reliable nor fine-grained.)


    Keep these facts in mind when troubleshooting routing issues. For example, it’s
    natural to think that BGP does load balancing—you have two circuits, and BGP spreads
    the load between them, after all! But that thinking will trap you when you need
    to figure out why packets are going in a certain way.


    # BGP Preparations


    To run BGP, you must have the following:


    +   * A router with more than 128MB of RAM.

    * Two ISPs, both willing to provide you with a BGP feed.

    * An IOS version that supports BGP version 4.

    * A block of IP addresses /24 or larger. Several smaller chunks that add up to
    a /24 are useless for BGP.

    * An Autonomous System Number.

    * A routing registry entry for your network block.


    We’ll look at each in turn.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Router Features


    Let''s dispose of the easy requirement first. Your router must have an IOS image
    that supports BGP. If your IOS doesn''t support BGP, use your SmartNet contract
    to get a version that does.


    Memory is a little more problematical. Each route announcement from a peer takes
    up a little bit of memory. When you are receiving full routes from two peers,
    your routing table will use most of your router''s free memory. Attempting to
    use any advanced Cisco router features will overflow your router''s memory and
    cause problems. The global routing table grows every year. In 2004, a recent IOS
    image and two full routing tables almost completely filled 128MB of RAM, and soon
    more than 128MB will be required to run BGP with full routes from two peers.


    You can reduce memory usage by taking only partial routes from one peer. Your
    router will only send packets meant for that peer to that peer, and will send
    everything else to the other peer. This only aggravates the problem of asymmetrical
    bandwidth use, however, unless you are directly connected to a network with a
    major client or have some other heavy bandwidth requirement directly connected
    to that peer.


    Oddly enough, Cisco routers that can only handle 128MB of RAM are becoming much
    easier to find on eBay. People are selling them for a reason. I highly recommend
    that you start with 256MB of RAM if at all possible.


    # ISPs with BGP


    Believe it or not, many small ISPs have only a single circuit to the Internet.
    These ISPs do not have BGP feeds and cannot provide you with one either. When
    shopping for an ISP for multihoming, be certain to ask if they can provide a BGP
    feed. Also ask your current provider if they provide that service. It''s possible
    that multihoming will require you to terminate your current Internet service contract
    and sign new ones with two entirely different providers.


