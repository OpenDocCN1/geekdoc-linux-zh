    \ 255.255.255.0。这是多年来企业网络的标准。这个子网掩码意味着你的网络块中有 256 个合法的 IP 地址。例如，如果你的机器 IP 地址是\
    \ 10.5.3.12，子网掩码是 255.255.255.0，你就知道你的本地网络上最多还有 255 个其他 IP 地址。（所有这些地址都用到的情况很少见，而且某些地址会造成问题，但这是可能的。）这个子网掩码通常被称为\
    \ *C 类网络*，尽管 *C 类*（以及其他\"类\"网络名称）这个术语已经过时大约十年了。\n\n子网掩码就是网络地址和主机地址之间的分界线。经典的 255.255.255.0\
