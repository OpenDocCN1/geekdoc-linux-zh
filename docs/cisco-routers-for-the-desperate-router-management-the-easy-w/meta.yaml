  md: '# INTRODUCTION


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_14_0.png)


    Welcome to *Cisco Routers for the Desperate!* While network administrators know
    that they should intimately understand every piece of equipment on their networks,
    in the real world we all become most familiar with the things that require the
    most care and feeding. We all spend more time than we''d like arguing with buggy
    operating systems and applications, and as a result are very familiar with them.
    Cisco routers "just work" almost all the time, so we don''t get much chance to
    become familiar with them. This gives the router a certain air of the "mysterious
    black box." When the router actually breaks, the mysterious black box immediately
    becomes an object of fear and dread. The fight-or-flight instinct kicks in, people
    panic, and pretty soon everyone''s'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'running around as if they have a drunken badger loose in their undies. Perhaps
    you call your Internet service provider and beg for help—always a legitimate tactic,
    but perhaps not the quickest and certainly not the best for your self-respect.
    You could go buy a book on Cisco routers, but most of those that actually contain
    useful information weigh roughly the same as an automobile transmission and are
    almost as digestible. And we all know you won’t have time to get through it during
    an actual emergency, will you?


    This book is aimed at the administrator of a small network who is responsible
    for anywhere from one to three Cisco routers. Our goal is to make you comfortable
    with the Cisco environment and provide exactly the information you need to troubleshoot
    and resolve the most common problems that either happen on Cisco routers or intimately
    involve Cisco routers. Once you have that under your belt, we go a little further
    and provide the basic information you need to address some of the questions that
    frequently arise when working with Cisco routers and network connections. This
    book is also short enough to actually be read.


    > *This is the book I wish I had read before I first touched a Cisco device.*


    This book is not a complete tutorial on all of the things that can be done with
    Cisco routers. Cisco almost invented the networking business, and its equipment
    has been used to interconnect almost every sort of network hardware ever created.
    We focus squarely on TCP/IP networking in an Internet environment and do not detour
    into channelizing circuits, VoIP, IPX, AppleTalk, or any of the other features
    available in Cisco-land. Instead, you’ll discover how to learn these things yourself.
    Once you’re comfortable with Cisco routers, everything else follows.


    # ## What This Book Will Teach You


    The main goal of this book is to make you comfortable with the environment and
    technology found inside every Cisco router. First, you have to connect to the
    router and log in, and we’ll discuss how you can do that. You also need to examine
    interfaces, check the configuration, and change the system’s current and startup
    configurations as well as run some basic troubleshooting commands.


    To make the router work properly, you’ll need to have a basic comprehension of
    the network types most commonly found on modern TCP/IP networks. We’ll briefly
    cover'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Ethernet and serial lines, and we''ll give some pointers to further information.
    This isn''t a primer on networking, but you need to understand enough theory to
    comprehend router error messages.


    We''ll then discuss the most common router usage, connecting a small network to
    the Internet. We''ll go step-by-step over the typical configuration choices, and
    then learn how to pre-configure a router so that you can quickly and easily set
    up a connection with a minimum of fuss. This will allow you to ask your ISP for
    the specific information you need, rather than their telling you what you need
    to type. To make your Internet connection work, you''ll also have to configure
    the router''s Ethernet interface, so we''ll discuss that as well.


    Perhaps the second most common use of a router is to connect two offices with
    a private leased line. This is a step up from connecting a network to an ISP,
    and we''ll cover how to make this happen, beginning with ordering the circuit
    from the telephone company. Because you''ll be responsible for this circuit, we''ll
    cover troubleshooting as well.


