  mdcn: "\n路由可能会导致较小的路由器过载并崩溃。通常认为路由抖动是由电路或硬件问题引起的，而不是有人反复重置其BGP会话。BGP重置可以被看作是计算机领域中类似把煤渣砖砸到脚上的行为——除了单脚跳来跳去、花几分钟思考自己做了什么，你几乎做不了什么。路由器默认，即使你有充分的理由重置一次，你也足够聪明，不会持续这么做。⁴\n\
    \n话虽如此，你可以使用星号代替IP地址来同时清除所有BGP会话。上述所有警告对于此类大规模BGP重置更为重要。\n\n如果您的BGP问题持续存在，请联系显示异常行为的互联网服务提供商（ISP），询问是谁一直在摆弄路由器配置。\n\
    \n## 注意：监控路由器流量\n\n您应该如何了解流量在每条电路上的流向？虽然有多种选择，但我强烈建议使用免费工具MRTG (http://www.mrtg.org)\
    \ 执行基本的路由器监控。MRTG会告诉您每条电路的进出流量，并且可以扩展以跟踪路由器使用的内存和CPU时间。我不知道有人如何能在不使用MRTG或类似工具的情况下管理路由器。\n\
    \n## BGP负载均衡\n\n如果您之前注意到了，您可能捕捉到了前面关于BGP不是负载均衡协议的强调部分，并且觉得本节标题令人费解。BGP不执行负载均衡，但您可以使用一些手动技巧来调整互联网电路的使用情况。您也可以购买产品，这些产品将通过DNS或NAT为BGP添加负载均衡或执行伪负载均衡，或执行其他不相关的技巧。然而，在不购买额外设备的情况下，您可以利用BGP协议本身来执行粗糙的负载调整。通过明智地添加到您接收和提供的路由的AS“跳数”，您可以增加详细算法看到的来自不同网络区域的路由的距离。\n\
    \n⁴ 这可能是计算机和人类之间最基本的区别。\n\n**警告** *在调整路由器流量之前，您必须了解流量在电路上的长期传输量。我之前建议使用MRTG (http://www.mrtg.org)\
    \ 进行流量测量，我在这里更强烈地建议它。如果您在阅读本文时还没有设置流量测量工具，您可能还没有搬起石头砸自己的脚，但您已经装上了枪并开始盯着自己的大脚趾了。*\n\
    \n查看您在每个提供商上的流量吞吐量。通常，您的路由器会选择更频繁地将出站流量传输到一个提供商。一个拥有两条T1电路的小型办公室，一条电路的使用量是另一条的十倍，这种情况非常常见。当一条电路使用1.0Mb/秒时，另一条可能只使用0.1Mb/秒。如果您的带宽使用率较低，这没问题，但如果更受欢迎的电路满了，您在较不受欢迎的电路上可能只使用0.15Mb/秒。这将使您的网络使用量约为1.6Mb/秒，仅略高于可用带宽的一半。更糟的是，通过受欢迎的电路发出的网络请求返回会非常非常慢。同样，如果您的大部分流量通过一条电路到达，您可能会发现一条电路被入站请求堵塞，而备用电路却空闲着。\n\
    \n如果您查看路由器中通过较慢电路到达的目的地的路由，您会看到它们被发送到那里是因为它们具有最短的AS路径。例如，假设您的路由器倾向于大量地通过一条电路而非另一条发送流量。选择一个始终通过一个提供商到达的随机站点，并检查其BGP信息。这里，我们选择检查系统192.1.120.84的BGP信息。\n\
    \n```\nrouter# sho ip b 192.1.120.84\nBGP routing table entry for 192.1.120.0/24,\
    \ version 4521114\nPaths: (2 available, ❶best #1, table Default-IP-Routing-Table)\n\
    \  Not advertised to any peer\n    ❷300 400\n      172.16.0.2 from 172.16.0.2\
    \ (129.250.61.128)\n        Origin IGP, metric 0, localpref 100, valid, external,\
    \ best\n        Community: 190972324 190973904 190974904\n    ❸200 600 500\n \
    \     10.1.8.5 from 10.1.8.5 (10.1.8.23)\n        Origin IGP, localpref 100, valid,\
    \ external\nrouter#\n```\n\n第一条路由跨越❷两个自治系统，300和400。第二条路由经过❸三个自治系统，200、600和500。第一条路由使用更少的自治系统，因此它被①优选。\n\
    \n在这种常见的使用不均情况下，一个提供商始终提供比另一个更短的到其他网络的AS路径。这并不罕见，也并非一个网络比另一个“连接更好”的症状；事实上，AS数量较高的提供商的连接可能比另一个更快！既然您理解了问题，解决方案就显而易见：使更频繁使用的路径的AS路径变长，这样您的路由器就会更少选择它。在这个例子中，我们希望增加从AS300接收的路由的路径长度。您可以通过在对等体前添加（前置）额外的AS编号来调整AS路径长度。\n\
    \n以下是我们必须修改的BGP配置片段及其当前路由映射。\n\n```\nrouter bgp 100\nneighbor 172.16.0.2 remote-as\
    \ 300①\nneighbor 172.16.0.2 route-map ispB-out ②out\nroute-map ispB-out③\nmatch\
    \ ip address 130\n```\n\n我们的① AS300对等会话当前只有一个路由映射，并且应用于②出站通告。如果我们想修改对此对等体的通告，我们可以编辑现有的③路由映射，但我们要修改来自此对等体的入站通告，因此我们需要一个新的路由映射。\n\
    \n```\nrouter# conf t\nrouter(config)# router bgp 100\nrouter(config-router)#\
    \ neighbor 172.16.0.2 route-map ④ispB-in ⑤in\nrouter(config-router)# ^Z\n```\n\
    \n这里，我们告诉BGP会话为ISP B使用一个新的路由映射，称为① ispB-in。这个新的路由映射仅应用于②入站通告。\n\n```\nrouter#\
    \ conf t\nrouter(config)# route map ⑥ispB-in permit 10\nrouter(config-route)#\
    \ set ⑦as-path ⑧prepend ⑨300 300\n```\n\n这将创建ispB-in路由映射。通过它到达的每个通告，其② AS路径都将通过在其前面④添加两个300来扩展。\n\
    \n进行此更改并保存您的工作后，通过清除此对等体的BGP会话使新路由映射生效。\n\n```\nrouter# clear ip bgp 172.16.0.2\n\
    ```\n\n当您重置了BGP会话后，请重新检查您的测试路由。输出将有一些次要但重要的更改。具体来说，来自AS300的AS路径现在将在前面有两个额外的300，就像这样：\n\
    \n```\n300 300 300 400\n```\n\n这将使另一个AS路径看起来更短，从而使其成为此路由的首选。\n\n不要太急于使用AS路径前置。虽然我们在这个例子中添加了两个AS跳，但最好一次只向一个对等体添加一个AS跳，看看它如何影响性能。如果需要，您可以稍后添加额外的跳数。（您确实有MRTG在运行以每隔几分钟显示此效果，对吧？）\n\
    \n如果您的入站流量偏向于某个对等体，请更改您的出站通告以平衡这些流量。这里要记住的重要事情是，您必须将自己的AS号前置到出站通告中，而不是您的对等体的AS号。如果有人开始使用您的AS号，您会非常恼火，您可以期望您的对等体对他们的AS号也持相同看法。\n\
    \n这里的好处是您已经有了出站路由映射。要添加AS路径前置，只需编辑现有映射以添加AS路径前置行即可。\n\n```\nrouter# conf t\nrouter(config)#\
    \ route map ❶ispB-out permit 10\nrouter(config-route)# ❷set as-path prepend 100\n\
    ```\n\n我们的BGP配置已经引用了ispB-out路由映射，因此我们完全不需要修改BGP配置。只需进入配置模式并编辑❶现有路由映射以添加❷AS前置规则即可。不过，您仍然必须清除此对等体的BGP会话才能使更改生效。\n\
    \n## BGP更新的传播\n\n现在您已经掌握了足够的BGP知识，可以进行危险操作了，您应该知道BGP通告可能需要长达20分钟才能在全球可见。虽然您的对等体应该会很快获取它们，但您不能期望每个地方的每个人都与您连接良好。在更改您的\n"
