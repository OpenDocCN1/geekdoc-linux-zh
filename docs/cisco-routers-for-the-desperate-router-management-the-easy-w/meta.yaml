    ## BGP 与 HSRP


    再次查看图 7-2。我们有路由器 A 连接到 ISP #1，路由器 B 连接到 ISP #2。路由器 A 和路由器 B 都在向各自的 ISP 公告它们的网络地址。外部世界的系统将通过最接近的路由将流量发送到你的网络。但按照我们讨论的
    HSRP 设置，你的网络一次只能使用一个出站电路！想一想：路由器 A 仅知道从 ISP #1 接收到的路由，因此它会将所有内容发送到那里。如果路由器 A 持有默认路由，即使是发往
