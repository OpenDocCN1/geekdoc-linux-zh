    \ EXEC 模式有时被称为“enable 模式”。在 enable 模式下，你可以按任何所需方式配置路由器，重启路由器，或执行软件中可能的任何其他操作。\n\
    \n要进入特权 EXEC 模式，请使用 `enable` 命令。当你实际上设置了访问 enable 模式的密码时，路由器会在你尝试 enable 时提示输入密码。请参阅第\
