  md: '![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_147_0.png)


    > IN CASE OF EMERGENCY, BREAK OPEN BOOK


    Cisco routers are the backbone of many networks. Working with them, however, can
    be a challenge for even the most competent network support people. The truth is,
    learning the basics will take you far. After all, most Cisco networks use only
    a tiny fraction of the router''s features.


    Cisco Routers for the Desperate™ is a brief, meaty introduction to Cisco routers
    that will teach you how to troubleshoot problems and take you through the basic
    tasks of maintaining the router and integrating it into an existing network. You''ll
    learn how to transform that mysterious black box into a helpful and vital portion
    of your network, with coverage of:


    +   - Installation—get your router up and running properly the first time.

    - Router and Internet circuit troubleshooting—is the complaint, “the Internet’s
    not working,” a network issue or something beyond your control?


    +   - Security issues—keep your network safe from hackers and install a private
    network between two offices to conveniently and securely share data.

    - Basic network connection redundancy—reduce the chances of network downtime.


    Read this compact book once, and then leave it on top of your router until something
    breaks. When it does, you''ll know where to turn: *Cisco Routers for the Desperate*.


    # ABOUT THE AUTHOR


    Michael W. Lucas is a network engineer with extensive experience with intra-office
    and nationwide networks. He is the author of the critically acclaimed Absolute
    BSD and Absolute OpenBSD (No Starch Press). Lucas has worked with Cisco devices
    since 1995 and is currently responsible for a high-availability Cisco-based network.


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_147_1.png)'
