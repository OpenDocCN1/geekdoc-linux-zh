    部分全部位于子网掩码中标记为 1 的部分，所以你不能更改这些数字。IP 地址的最后一段，即最后一个句点之后的部分，位于标记为 0 的部分，所以你可以更改它。IP\
    \ 地址中对应子网掩码中 1 的部分称为*网络地址*。其余部分称为*主机地址*。\n\n子网掩码的大小以子网掩码中 1 的数量来衡量。这个子网掩码有 24\
    \ 个 1，所以它是 24 位子网掩码或 /24（读作\"斜杠 24\"）。你的网络块将写为 192.168.1.0/24。\n\n这里是令人紧张的部分：网络号和主机号之间的分界线没有理由必须落在方便的\
    \ 8 位边界上。以下是一个完全合法的子网掩码：\n\n```\n11111111.11111111.11111111.10000000\n```\n\n\
    如果你把这个从二进制转换成十进制（大多数计算器都有这个功能），你会看到这是 255.255.255.128 的子网掩码。不要被吓到——这是一个完全合法的子网掩码，它有\
    \ 7 位地址空间供你的机器使用。同样的计算器会告诉你 2 的 7 次方是 128，所以这个网络有 128 个 IP 地址。\n\n> **注意** *不可用的\
    \ IP 地址*\n>\n> 任何网络块的第一个和最后一个地址是不可用的。你不能给子网掩码为 255.255.255.0 的网络上的机器分配以 .0 或 .255\
    \ 结尾的 IP 地址。\n\n### 实际的子网掩码\n\n子网掩码采用二进制的结果是，IP 地址以 2 的倍数为块进行分配。如果你有 5 位可用，你的网络上将有\
    \ 32（2 × 2 × 2 × 2 × 2 = 32）个 IP 地址，你的子网掩码将是 /27（32 − 5 = 27）。如果你有 8 位用于主机，你就有\
    \ (2⁸) 即 256 个 IP 地址。如果你被告知有 55 个 IP 地址，那么你不是在和别人共享网络，就是需要了解你的网络管理员在喝什么然后让他分享。\n\
    \n看到主机 IP 地址后面附加子网掩码并不罕见，例如 192.168.1.5/24。这几乎给了你关于本地网络所需的一切信息；只需获取默认网关，你就可以上网了！\n\
    \n### 子网掩码与 BGP\n\n你的网络必须是 /24 或更大才能路由 BGP，但如果网络更大呢？最好宣告尽可能少的网络块，以减小全局路由表的大小。多个连续的\"\
    C 类\"网络块很可能是一个合法的网络块。不过你大概不想掏出计算器把所有网络块都转换成二进制来确认！以下是一些提示，帮助你判断一组 IP 地址是否是一个合法的单一块。\n\
    \n记住，网络块是以 2 的倍数分配的。这一点在各个层级都成立，包括较大的网络号。这意味着每个合法的网络块必须是 2 的倍数。如果一个网络块确实是合法的，它将是自身大小的倍数。例如，地址块\
    \ 192.168.4.0–192.168.5.255 是一个连续的地址范围；它当然是两个 /24 网络，但它是一个合法的单个网络块吗？如果这是一个合法的\
    \ /23 网络，我们可以在 192.168 网络中精确地放入额外的 /23 网络。192.168.0.0/23 占用 192.168.0.0 到 192.168.1.255，192.168.2.0/23\
    \ 占用 192.168.2.0 到 192.168.3.255。我们的 192.168.4.0 网络块紧接着开始，没有任何空余空间，所以它是一个合法的网络块！你可以把它写成\
    \ 192.168.4.0/23，并通过 BGP 宣告它。\n\n另一方面，看看 192.168.32.0–192.168.96.255 这个网络块。这是\
    \ 64 个连续的 /24 网络块，或者可能是一个单独的 /18 网络。如果它是一个合法的 /18，我们应该能够在到达这个特定网络块之前，在 192.168\
    \ 中放入 64 个 /24 网络块的整数倍。我们尝试的第一个网络块，192.168.0.0 到 192.168.64.255，与我们网络块的前半部分重叠。不过我们可以把这个范围称为两个\
    \ /19 网络：192.168.32.0/19 和 192.168.64.0/19，这比通过 BGP 宣告我们的 64 个 /24 网络要好！\n\n##\
