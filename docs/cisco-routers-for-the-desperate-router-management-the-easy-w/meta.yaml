- img_proc: true
  md: '36,000 input errors. We''ve input about 6.4 million packets, though, so this
    is far less than one percent of all packets, an acceptable error rate.


    *CRC* and *frame input errors* probably indicate some sort of line noise; if these
    are happening frequently, call your ISP or telco and have them troubleshoot the
    circuit.


    *Overrun*, *ignored*, and *abort input errors* indicate that the router cannot
    process incoming packets quickly enough and is forced to drop surplus packets.
    You can adjust the router''s internal buffers, but this is very tricky to do correctly.
    I strongly encourage you to use Cisco''s SmartNet support and have a technician
    help you adjust the buffers to fit your particular situation.


    **7** *Output errors* are most common on an Ethernet interface, where an extremely
    high collision rate can interfere with the network''s performance. On a serial
    line, output errors are most commonly the result of running out of buffers for
    outgoing packets (though this is quite rare on small routers). Again, if you''re
    consistently running out of buffers, contact Cisco for help.


    # ## Using Carrier Transition to Detect a Bad Serial Connection


    One of the more useful ways to detect a bad serial connection is the **8** *carrier
    transitions* line. A carrier transition is when the interface either goes up or
    comes down. It''s entirely possible for a serial line to bounce up and down so
    quickly that you won''t catch it by successive `sho int` commands. The carrier
    transition increments whenever the line goes down, and again whenever it comes
    back up. By watching this field, you can detect an unstable circuit.


    Finally, a serial line will list the **9** signals that it is receiving over the
    line. For the line to be functional, all of these need to be up; if any are not
    up even after rebooting everything, call your ISP or telco. Your router cannot
    process traffic it cannot hear!


    # ## Extended Pings and Circuit Troubleshooting


    Cisco routers can use a variety of ping tests to check IP connectivity to other
    networks. This is very useful for testing troublesome serial circuits that are
    not down but that are not actually working properly. At times, a misprovisioned
    circuit will cause problems that do not appear on `sho int`, but that cause no
    end of headaches.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'On more than one occasion, I''ve dealt with a circuit with a perfect-looking
    interface that passed every standard ping test with flying colors and yet was
    useless. GIF files could not be moved across these circuits and Windows networking
    infrastructure protocols would not work over them. In each case, the problem was
    exactly the same: the circuit was provisioned incorrectly (with AMI encoding instead
    of the modern standard of B8ZS). This meant that the circuit could not pass large
    all-zero packets. The .gif image format uses a lot of large all-zero packets,
    as do the Windows network protocols.


    **NOTE** *Other physical errors generate different symptoms; this particular example
    is just the one that seems destined to haunt me. Your data circuit should accept
    whatever sort of data you want to transmit, even if it is a whole lot of nothing!*


    To perform an extended ping test, enter enable mode and just type **ping**.


    ```

    router#**ping**

    Protocol [ip]:

    Target IP address: 192.168.5.3

    ```


    The default protocol is IP, so just press ENTER. Then give the IP address you
    want to ping. Generally, this is the IP address of the router on the other side
    of your serial link.


    Don''t use pings to Internet sites to test your circuit''s status; that tests
    every link between your router and the remote Internet site! The other end of
    the circuit is the only reasonable place to ping when testing your own circuit''s
    behavior.


    ```

    Repeat count [5]: 1000

    ```


    When using extended ping, use more than five pings. A few hundred is the bare
    minimum for this sort of test, but a thousand is usually reasonable. Either your
    test will be over in just a few seconds, or you''ll be interrupting it anyway.
    If you sweep the range of sizes (as recommended later), the router will decide
    how many pings are necessary to properly cover the range, and the value you enter
    here will be ignored anyway.


    ```

    Datagram size [100]:

    ```


    You could specify a size here if you wished, but we''ll be doing something slightly
    more advanced in the extended commands.'
  merge: -1
