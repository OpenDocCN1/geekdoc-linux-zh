    # Configuring BGP


    Once you have your addresses in static routes and access lists, you can tell BGP
    to announce them.


    ```

    router(config)# ❶router ❷bgp ❸100

    router(❹config-route)#

    ```


    In configure mode, tell the router you want to ❶ enable ❷ BGP for ❸ your ASN.
    Note the change of ❹ command prompt when you begin BGP configuration. Then you
    can perform the initial setup of your BGP configuration.


    ```

    router(config-route)# bgp ❶dampening

    router(config-route)# ❷redistribute static

    router(config-route)# ❸network 192.168.0.0 mask 255.255.254.0

    ```


    BGP ❶ dampening allows your router to better resist *route flap*, which is when
    a route is repeatedly added to the routing table and then quickly withdrawn several
    times a minute. If one of your peers starts flapping, your router may become overloaded
    and crash. It’s enabled by default on most modern IOS versions, but you should
    be absolutely sure it’s there.

    We then tell BGP to announce routes that it learned from ❷ static routing. (It’s
    entirely possible to redistribute routes learned via other routing protocols,
    but you need a thicker book to learn how to do that safely.) Because your router
    might have many static routes, we need to specify exactly which ❸ routes we want
    to announce. We don’t want to try to announce every little subnet that the router
    knows about, after all!

    When you actually have a peer configured, it should see these routes.


    # Your First Neighbor


    Now that you have prepared the routes you want to announce, configure an actual
    BGP session with one neighbor. You must have the peer’s ASN and the IP address
    of the peer. Still in a “BGP 100” configure session, tell the router about a peer
    with the neighbor keyword.


    ```

    router(config-route)# neighbor ❶10.1.8.5 ❷remote-as 200

    router(config-route)# neighbor 10.1.8.5 ❸route-map ❹ispA-out ❺out

    ```'
