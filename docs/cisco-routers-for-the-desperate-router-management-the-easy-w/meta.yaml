    支持热备路由虚拟协议（HSRP），以便在这种紧急情况下在路由器之间提供实时故障转移。你可以构建一个由独立 Cisco 设备组成的“池”，它们将接管故障路由器的部分功能；虽然并非所有功能都被覆盖，但已足够让你的用户感知不到故障。


