  - '[PAGE 132]


    # APPENDIX


    # IP ADDRESSES AND NETMASKS


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_132_0.png)


    If you''ve been around the networking world for a while, you''ll certainly recognize
    network blocks identified with *slash notation*, such as 10.0.0.0/8 or 209.69.8.0/23.
    If you know what these are, you can skip this appendix. Otherwise, read on.


    # What Is an IP Address?


    An IP address is simply a  Prefetch 32-bit number assigned to particular network
    device. Rather than expressing that 32-bit number as a single number, IP addresses
    are usually shown broken up into four 8-bit numbers ranging from 0 to 255. It''s
    much easier for our feeble brains to wrap around a number such as 192.168.0.1
    than 11000000101010000000000000000001.'
  - '[PAGE 133]


    To really understand netmasks, it’s important to remember that your IP addresses
    are really just a single long string of numbers.


    A netmask is just a way of saying how many IP addresses you have in a particular
    block. The trick is that not all netmasks are legitimate, and you can’t use just
    any netmask with any random IP address. If you’ve been kicking around the Internet
    for a while, you’ve probably seen the netmask 255.255.255.0. This was the standard
    for corporate networks for many years. This netmask means that you have 256 legitimate
    IP addresses in your network block. For example, if the IP address of your machine
    is 10.5.3.12 and it has a netmask of 255.255.255.0, you know that your local network
    has up to 255 other IP addresses on it. (It’s rare that all of these would be
    used, and certain addresses would present difficulties, but it’s within the possible.)
    This netmask is frequently called a *class C network*, although the term *class
    C* (and the other “class” network names) has been obsolete for about a decade
    now.


    A netmask is simply the line between the network and the host IP address. The
    classic 255.255.255.0 netmask means that the IP number is fixed for the first
    24 bits, and that you can change the last 8 bits. Confused yet? Let’s look at
    an example. Suppose your ISP issues you the block of IP addresses 192.168.1.0
    through 192.168.1.255, with a netmask of 255.255.255.0. The first 24 bits of the
    address are fixed, and you can do anything you want with the remaining 8 bits.
    Look at the netmask as a binary number, and it will start to make a whole lot
    more sense. In this example, any digit that is a 1 has been set by the ISP that
    issued you your IP addresses; any digit that is a 0 can be changed by the network
    administrator.


    > 255.255.255.0 = 11111111.11111111.11111111.00000000


    The first 24 bits are all 1s, meaning that you cannot change that part of the
    IP address on a machine on your local network. You can change the numbers that
    are in the “0” section of the netmask. The “192.168.1” part of the IP is all in
    the part of the netmask marked off by 1s, so you cannot change those numbers.
    The last chunk of the IP address, the part after the last period, is in the section
    marked off by 0s, so you can change this. The part of the IP address under the
    1s in the netmask is called the *network address*. The remainder is called the
    *host address*.


    Netmask size is measured by the number of 1s in the netmask. This netmask has
    24 1s, so it is a 24-bit netmask or a /24 (pronounced “slash 24”). Your network
    block would be written as 192.168.1.0/24.'
  - '[PAGE 134]


    Here''s the scary part: there is no reason why the boundary between the network
    number and the host number must lie on the convenient 8-bit boundary. The following
    is a perfectly legitimate netmask:


    ```

    11111111.11111111.11111111.10000000

    ```


    If you convert this from binary to decimal (a function on most calculators these
    days), you''ll see that this is a netmask of 255.255.255.128. Don''t let that
    scare you—it''s a perfectly legitimate netmask, and it has 7 bits of addresses
    for your machines. That same calculator will show you that 2 to the power of 7
    is 128, so you have 128 IP addresses for this network.


    > **NOTE** *Unusable IP Addresses*


    The first and last address in any block is unusable. You cannot assign a machine
    on a network with a netmask of 255.255.255.0 an IP ending in either .0 or .255.


    # ## Practical Netmasks


    The end result of netmasks being in binary is that IP addresses are issued in
    blocks that are multiples of two. If you have 5 bits to play with, you''ll have
    32 (2 × 2 × 2 × 2 × 2 = 32) IP addresses on your network, and your netmask will
    be a /27 (32 − 5 = 27). If you have 8 bits for your hosts, you have (2⁸) or 256
    IP addresses. If you''re told that you have 55 IP addresses, you''re either sharing
    a network with other people or you need to learn what your network administrator
    is drinking and get him to share.


    It''s not uncommon to see a host IP with a netmask attached, e.g., 192.168.1.5/24.
    This gives you almost everything you need to know about the local network; just
    get the default gateway and you''re on the Internet!


    # ## Netmasks and BGP


    Your network must be a /24 or larger to route BGP, but what if it''s larger? It
    is preferable to announce as few blocks as possible, in order to reduce the size
    of the global routing table. Multiple consecutive "class C" blocks might very
    well be a legitimate network block. You probably don''t want to break out your
    calculator and transform all your network blocks into binary to find out, though!
    Here are some hints to determine whether a block of IP addresses is a legitimate
    single block.'
  - '[PAGE 135]


    Remember that network blocks are issued in multiples of two. This holds true all
    the way up the scale, including the larger network numbers. This means that each
    legitimate block must be a multiple of two. If a block is actually legitimate,
    it will be a multiple of its own size. For example, the address block 192.168.4.0–192.168.5.255
    is a single contiguous range of addresses; and it''s certainly two /24 networks,
    but is it a single legitimate network block? If this was a legitimate /23 network,
    we could fit additional /23 networks precisely into the 192.168 network. 192.168.0.0/23
    fills 192.168.0.0 through 192.168.1.255, and 192.168.2.0/23 fills 192.168.2.0
    through 192.168.3.255. Our 192.168.4.0 block picks up right there without any
    space left over, so it''s a legitimate block! You can write this as 192.168.4.0/23,
    and you can announce it via BGP.


    On the other hand, look at the block 192.168.32.0–192.168.96.255. This is a block
    of 64 consecutive /24 networks, or possibly a single /18 network. If it''s a legitimate
    /18, we could fit an even multiple of 64 /24s into 192.168 before we reach this
    particular block. The very first block we would try, 192.168.0.0 through 192.168.64.255,
    overlaps the first half of our block. We can call this range two /19 networks,
    however: 192.168.32.0/19 and 192.168.64.0/19, which is better than announcing
    via BGP our 64 /24 networks!'
