    ### 你的地址宣告


    默认情况下，BGP 会话拒绝向其对等体宣告路由。这有助于防止一家小公司的路由器成为骨干网间的交换点。（你的上游提供商应该对你的宣告进行过滤，以便他们只从你这里接收正确的路由，所以这不应该成为问题。^(2)）要让路由器通过
    BGP 宣告一个地址块，它必须知道当对等体发送这些地址的数据包时，应该将其发送到哪里。在小型网络中，最简单的方法是为你想要向对等体宣告的精确地址块提供一条静态路由。为该地址块的各个部分提供多条静态路由是不够的：你必须为整个地址块提供一条单独的路由。


