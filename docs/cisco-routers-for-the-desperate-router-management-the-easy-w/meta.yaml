    # Internet Connections


    Chances are good that readers of this book were handed the office Internet connection
    one day and told, "Here, take care of this." Maybe this inherited Internet connection
    works flawlessly and silently. However, if you are in the market for a new Internet
    connection, or if you want to replace the atrocity of a circuit you currently
    endure, read on. You''ve got a large variety of ISPs to choose from and a bewildering
    variety of service packages. It can be difficult to sort them all out, but here
    are some tips to help you decide.


    # Choosing an ISP


    Choosing an Internet circuit is difficult when compared to, say, buying a car.
    When you need a car, you have some idea of your needs. You know how many people
    you have to haul around, how often you need to move large objects, and what sort
    of comfort features you want, and you can put all this together and make a mostly
    intelligent decision between the SUV and the subcompact.


    To make an informed choice about network bandwidth, you''ll need to have the same
    sort of information. For one thing, you need to determine how much bandwidth your
    company actually uses. You can get a vague idea from random spot checks of throughput
    on the serial interface on your router''s Internet circuit, but this is haphazard
    and unreliable.


    If you log in once an hour to see how much bandwidth your router is using, you
    can easily miss random peaks. Your best bet is to use a tool like MRTG (http://www.mrtg.org)
    to gather statistics on your bandwidth usage over days or weeks. Even if you''re
    not in a decision-making position, knowing how much bandwidth your company uses
    will help your decision makers and will also make you look good.


    No matter how much bandwidth you have, at some time your company will consume
    all of it. For example, downloading an ISO image from a high-bandwidth site can
    soak up an entire T1 for several minutes and smaller circuits for proportionately
    longer.


    But consider this: How often do you use all of your bandwidth, and how urgent
    are those high-volume requests? When you do need to download an entire ISO, do
    you need it in ten minutes or would an hour suffice? In my experience working
    for ISPs, most companies that purchase a T1 use less than a tenth of their bandwidth
    99 percent of the time. If you *know*'
  - '[PAGE 48]


    that 128Kb/second would more than meet your company''s needs, you will be completely
    justified in laughing when a sales person attempts to sell you three bonded T1s
    with live failover for 4.5Mb/second of high-quality throughput. It sounds great,
    but you probably don''t need it.


    When you know what you need, you can easily gather a list of providers in your
    area from any search engine. Make a list of those who provide the service you
    require, and then start weeding them out. Talk to network staff at other companies
    and ask who they get Internet service through and how satisfied they are. Look
    for complaints in public newsgroups and websites; while every company has a few
    dissatisfied customers, do the number of complaints about any one company seem
    excessive compared to the others? See what you think. After you''ve weeded out
    the obvious losers from your list, you can probably group the remainder into four
    categories:


    **Big telcos** These are companies like SBC and Pacific Bell Internet, who have
    Big Names and correspondingly Big Prices. They frequently offer high levels of
    service, because they own the phone circuit as well as the Internet service. These
    companies can be difficult to work with when things go wrong, however, especially
    for small customers. Getting unusual problems resolved can take quite some time.


    **National ISPs** These are big Internet companies such as Level3 and Verio. Many
    times, these companies have unadvertised links to a big telco. For example, as
    of this writing Verio is owned by the Japanese telephone company NTT. Because
    they are pure Internet companies, they frequently have a better understanding
    of the Internet''s unique requirements and technologies than telco-based ISPs.
    These companies will frequently carry your traffic across the country to get it
    to someone on the other side of town, simply because that''s their closest connection
    to the other person''s provider.


    **Regional ISPs** These are local companies that cover a city, a state, or a few
    states. While they are generally clients of the telcos and national ISPs, they
    have a variety of connections in a variety of locations to a variety of providers.
    Some of these companies have excellent customer service, while others have service
    that is not so good. Regional ISPs are frequently more flexible than larger ones
    and have the technical staff to back it up.'
  - '[PAGE 49]


    **Mom-and-pop ISPs** It’s perfectly feasible for someone to set up a medium-sized
    router in his basement and start selling T1s. These companies can be inexpensive
    and fairly reliable; because the mom-and-pop ISP doesn’t have a huge number of
    customers, it cares about each and every one it has. Frequently, these ISPs are
    underfunded and under-equipped, which can be a risk, but their prices are good,
    and they usually don’t flinch from special requests.


    Having been employed by all four types, I have to say that my favorite is a good
    regional ISP. Your experiences in your area may vary.


    # ISP Router Configuration


    Your ISP should help configure your router or at least provide a configuration
    for the interface connecting to them. For the most part, you can accept what they
    give you; they’re in the business of hooking customers up to the Internet every
    day, and you’re in the business of hooking up this solitary T1 as soon as possible.
    If you’re going to build a configuration by hand, however, ask for this information:


    +   - **Serial interface IP addresses** Most ISPs give each end of a T1 an IP
    address and assign a block of four IP addresses (with a netmask of 255.255.255.252)
    to the circuit network. The bottom and top IP addresses in this block are not
    usable; one of the remaining addresses is assigned to each end of the circuit.
    You must know which IP goes on each end in order to configure your router appropriately.
    While you can use a serial line without an IP address, doing so will make troubleshooting
    and sophisticated routing more difficult.


    - **Circuit ID or customer number** If you should have a T1 failure, you will
    need to contact the ISP in a hurry. If possible, get the circuit ID for this circuit
    and/or your ISP’s customer number for your company so that you have this information
    handy when you call.


    - **T1 line encapsulation** You must set the encapsulation on your circuit. Common
    choices are HDLC and PPP (discussed in Chapter 3). As long as both your router
    and your ISP’s router use the same encapsulation protocol, the circuit will work.'
