  - '[PAGE 125]


    # NTP


    If you''re relying on system logs to identify problems (as opposed to traditional
    troubleshooting methods such as "blind guesswork"), having your logs properly
    timestamped can make the difference between useful and useless records. Network
    management systems often use a system''s reported timestamp to record events.
    In the event someone breaks into your network and you have to involve law enforcement,
    inaccurate system time will effectively invalidate your records and your logs
    in the eyes of the legal system. While all of these combine to make network time
    important, maintaining synchronized network time across a variety of operating
    systems can be an annoyance. Cisco routers support Network Time Protocol (NTP),
    which is supported by all major operating system vendors and is the industry standard.


    # Basics of NTP


    NTP allows a group of networked hosts to agree on the time, within a few milliseconds.
    The protocol works with two conflicting assumptions. First, some systems have
    very accurate clocks, and the system owners wish to provide others access to those
    clocks. Second, those same hosts that want to provide a public service of accurate
    time do not wish to be flooded by every possible client in the world. The NTP
    protocol allows one or two local servers to get accurate time from big global
    time servers, and then redistribute that correct time to other clients on the
    network. The systems with extremely accurate clocks are called Tier 1 NTP servers.
    Those systems that are allowed to pull time directly from Tier 1 NTP servers systems
    and redistribute it to clients are called Tier 2 NTP servers.


    It is possible to configure your router to pull time directly from one of the
    big Tier 1 or Tier 2 NTP servers, but it''s best to have a local NTP server. Generally
    speaking, this server will read time from two or three different Tier 2 NTP servers
    and allow other local systems to get their time from it. This reduces load on
    the Tier 2 servers and makes NTP easier for you to maintain. The Tier 1 and 2
    time servers change their names or IP addresses on occasion, so it''s simpler
    to update your configuration on a single local server than on every client on
    the network. Check your operating system documentation for details on bunk. on
    how to provide time services to clients.'
