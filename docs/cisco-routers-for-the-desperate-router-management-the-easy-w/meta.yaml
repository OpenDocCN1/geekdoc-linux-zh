    - Netmasks and BGP ...................... 121\n\n## INDEX 123\n\n# INTRODUCTION\n\
    \nWelcome to *Cisco Routers for the Desperate!* While network administrators know\
    \ that they should intimately understand every piece of equipment on their networks,\
    \ in the real world we all become most familiar with the things that require the\
    \ most care and feeding. We all spend more time than we'd like arguing with buggy\
    \ operating systems and applications, and as a result are very familiar with them.\
    \ Cisco routers \"just work\" almost all the time, so we don't get much chance\
    \ to become familiar with them. This gives the router a certain air of the \"\
    mysterious black box.\" When the router actually breaks, the mysterious black\
    \ box immediately becomes an object of fear and dread. The fight-or-flight instinct\
    \ kicks in, people panic, and pretty soon everyone's running around as if they\
    \ have a drunken badger loose in their undies. Perhaps you call your Internet\
    \ service provider and beg for help—always a legitimate tactic, but perhaps not\
    \ the quickest and certainly not the best for your self-respect. You could go\
    \ buy a book on Cisco routers, but most of those that actually contain useful\
    \ information weigh roughly the same as an automobile transmission and are almost\
    \ as digestible. And we all know you won’t have time to get through it during\
    \ an actual emergency, will you?\n\nThis book is aimed at the administrator of\
    \ a small network who is responsible for anywhere from one to three Cisco routers.\
    \ Our goal is to make you comfortable with the Cisco environment and provide exactly\
    \ the information you need to troubleshoot and resolve the most common problems\
    \ that either happen on Cisco routers or intimately involve Cisco routers. Once\
    \ you have that under your belt, we go a little further and provide the basic\
    \ information you need to address some of the questions that frequently arise\
    \ when working with Cisco routers and network connections. This book is also short\
