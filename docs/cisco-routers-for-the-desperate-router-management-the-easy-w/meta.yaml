    # Configuring Interfaces


    You enter configuration information for a single interface in configure mode (as
    discussed in Chapter 2), but to do so you must specify the interface that configuration
    applies to. After you''re in configuration mode, enter the interface name.


    ```

    router#conf t

    router(config)#int faste2/0

    router(config-if)#

    ```


    The config-if (Cisco-ese for "configure interface") label indicates that configuration
    changes you make will only apply to the single interface you specified.


    To leave either interface configuration mode or router configuration mode, enter
    CTRL-Z.


    # Ethernet Interfaces


    Almost every Cisco router has one or more Ethernet interfaces. Ethernet is a broadcast
    medium. Many devices can be attached to a single Ethernet network, and information
    transmitted by a host is broadcast across the entire Ethernet network. Almost
    all modern office networks are Ethernet.


    Theoretically, every host on an Ethernet network sees all data transmitted by
    every host on that Ethernet. (While switches mostly direct broadcasts to only
    the destination computer, even a top-of-the-line switch still "leaks" some information
    to all the hosts on the network.) If you''re having trouble with your local Ethernet,
    a bad switch is the most common cause. (If you''re still using a hub, that''s
    almost certainly the problem. Please join the 21st century at your earliest opportunity.)
    Be sure toXA check hubs and switches before you blame your router.


    While Ethernet has been run over a wide variety of physical media in the past,
    today almost everyone uses either category 5 cable or some sort of fiber. (You
    may well find an antediluvian Cisco 2500 with an AUI port, but most of those will
    also have a 10BaseT Ethernet port.)


    From the Cisco point of view, all Ethernet interfaces are configured the same
    way; just remember that the connection'
