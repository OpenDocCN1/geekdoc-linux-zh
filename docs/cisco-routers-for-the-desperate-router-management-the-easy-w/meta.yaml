    ## Running versus Startup


    A router has two configurations at any given time: the *startup configuration*
    and the *running configuration*. The startup configuration is stored in the router''s
    nonvolatile memory and is used to configure the router during the boot process.
    At that point, a copy of the startup configuration is placed into the running
    configuration. If you change the router''s configuration during operation, you''re
    changing the running configuration. When you save the running configuration, it
    overwrites the previous startup configuration and becomes the new startup configuration.
    If you do not save your changes before you reboot the router, the changes are
    lost.


    > **NOTE** This is a long-winded way of saying: save your changes or you''ll lose
    them at the next reboot! Changing a router configuration is no different than
    editing a document in a word processor; if you exit without saving, you lose your
    work. This can be good or bad; don''t be afraid to use this to your advantage
    if you really screw up your router''s configuration!


    Technically, you could say that the startup configuration is a configuration file;
    it''s stored in nonvolatile RAM, just like a file on disk. Cisco experts don''t
    generally refer to the startup configuration as a configuration file, however;
    it''s just a "configuration." The running configuration is certainly not a file;
    it''s a (possibly modified) copy of the startup configuration, held in memory.


    ## Startup Configuration


    To view the configuration the router will boot with, enter the `show startup-config`
    command.


    ```

    router# show startup-config

    Using 5620 out of 129016 bytes

    !

    version 12.0

    ...

    ```


    The router reads the configuration from permanent storage and ❶ tells you how
    much space it takes up before displaying the ❷ configuration proper.


    ## Running Configuration


    To view the current (running) configuration, enter the `show running-config` command.¹


    ```

    router#show running-config

    ❶Building configuration...

    ❷Current configuration:

    !

    version 12.0

    ...

    ```


    Note the first line of the output, where the router tells you that it is literally
    ❶ assembling the current configuration from the router''s memory. It then ❷ reminds
    you that this is the configuration in memory at the moment, which may or may not
    match what is in NVRAM. It then displays the configuration one screen at a time.


    ## Reading a Configuration


    We won''t dissect a single complete router configuration in this book, because
    a working configuration for even a small router can easily reach up to 200 lines.
    Here''s how to read this configuration, though.


    A Cisco IOS configuration consists of a series of statements. Each statement either
    activates or deactivates a feature for an interface, a protocol, or the router
    as a whole, or defines some global characteristic of the router. You''ll also
    see exclamation points, which IOS uses to separate sections of a configuration.
    (If you store copies of your router configurations in a place other than on the
    router, you can use exclamation points to indicate comments, much as the pound
    sign is used by many program configuration files. This is rarely done, because
    the router will strip out these comments when loading the configuration.) For
    example, here are some snippets of a small router configuration file.


    > ¹ Old Cisco farts may remember this as `write terminal` or `wr t`. There''s
    nothing inherently evil about `wr t`, but it''s considered obsolete.


    ```

    ...

    ① service timestamps debug uptime

    ② !

    ③ hostname router.blackhelicopters.org

    ...

    ```


    This router supports the ① network services timestamps, debug, and uptime. (Just
    listing them in the configuration file is enough to enable them.)


    We also have a global configuration variable, the ③ router''s hostname. If the
    router thinks that configuration sections are sufficiently different, it puts
    a ② blank line between them.


    ```

    ...

    ① ip subnet-zero

    ② ip domain-name blackhelicopters.org

    ③ no ip finger

    ...

    ```


    This router has two settings for Internet Protocol (IP): the ① subnet-zero feature
    is enabled, and the ② IP domain name is set. Conversely, the “no” setting disables
    a particular service; in this case, the ③ finger service is turned off.


    ```

    ...

    ① interface Serial1/1

    ② description main office T1

    ③ no ip redirects

    ...

    ```


    Here we have a configuration for a ① particular router interface. Configuration
    information for this interface appears ② directly beneath it and has a single
    space in front of it. Note that we specifically turned off ③ a particular IP feature
    here, ip redirects; we could enable this feature on the router as a whole and
    then disable it on an interface-by-interface basis.


    ```

    ...

    ① router bgp 8292

    ② bgp dampening

    ...

    ```


    Similarly, ① major routing protocols configured on the router each have their
    own section. Configuration for that protocol (dampening) appears ② directly beneath
    it, set off by a leading space.


    ## Configuring the Router


    When you’re in privileged EXEC mode, you can not only issue more powerful commands
    but also change the router’s configuration.


    To change the router’s configuration, you must enter *configure mode*. The most
    common way to configure the router is at the command line you’re logged in at,
    also known as the *terminal*. Enter `configure terminal` at the privileged mode
    prompt.


    ```

    router#conf t

    Enter configuration commands, one per line. End with CNTL/Z.

    router(config)#

    ```


    Note that the ❶ command prompt has changed from simply `router` to `router(config)`;
    the router is making it explicit that you are configuring the system. At the configure
    prompt, you can enter configuration statements, one statement per line.


    Configuration commands look exactly like those in the system configuration and
    are added directly to the router’s configuration. For example, to add the line
    `service password-encryption` to your configuration, just enter it at the configure
    prompt.


    ```

    router(config)#service password-encryption

    ```


    The router will place this in an appropriate spot in the global configuration.
    (No, you can’t put the statement in a place of your own choosing in the configuration;
    the router knows far better than you do where each line belongs and will blatantly
    ignore any attempts to reorder the configuration.) Entering a command like `reload`
    or `ping` at the configure prompt will only generate an error, because these are
    not legitimate configuration statements.


    When you have completed your configuration, leave configuration mode with CTRL-Z.


    ```

    router(config)#^Z

    router#

    ```


    The prompt changes back to simply `router`.


    ### Configuring a Particular Interface


    When you need to configure a particular interface, just enter the interface name
    at the configure prompt. The router will place any further statements under the
    interface configuration.


    ```

    router(config)#int s1/0

    router(config-if)#

    ```


    Note that the prompt changes to `router(config-if)` to remind you that you''re
    configuring an interface, not the entire router.


    Why is this important? Do you remember our example configuration that had `no
    ip redirects` on a single interface? Presumably that router needed the feature
    enabled on some other interface or on a global level, and it must have been enabled
    that way.


    Routing protocols have a similar configuration sub-prompt.


    ```

    router(config)#router bgp 8292

    router(config-route)#

    ```


    Any further statements will appear in the `router bgp 8292` section, as shown
    in our example earlier.


    ### Saving Changes


    Entering all these configuration statements will alter the running configuration,
    but that configuration won''t persist through a reboot unless you save the configuration.
    Use the `write` command to save your changes.


    ```

    router#write

    Building configuration...

    [OK]

    router#

    ```


