    # Configuring Ethernet Interfaces


    The only change you must make to an Ethernet interface to give it on the network
    is to give it an IP address.


    ```

    router(config-if)#ip address <ip address> <netmask>

    ```


    In most small network environments, the Ethernet interface''s IP address is the
    default gateway of the attached network. For example, to set the IP address to
    192.168.1.1, with a netmask of 255.255.255.128, you would use the following command.


    ```

    router(config-if)#ip address 192.168.1.1 255.255.255.128

    ```


    After you have this basic configuration, you can go on to a variety of other settings.


    # Description


    While entering a description is almost pointless for a simple router with a single
    T1 port and a single Ethernet, the description field is very useful when your
    router has multiple Ethernet interfaces. Enter a description with the description
    keyword.


    ```

    router(config-if)#description DMZ network

    ```


    # duplex


    By default, the router will attempt to autonegotiate the duplex setting of a connection.
    You can force a particular setting with the duplex keyword, which has three legitimate
    settings: auto, half, and full. Here, we force a connection into half-duplex mode.
    (You might try this if the router negotiates a full-duplex connection but seems
    to be dropping packets.)


    ```

    router(config-if)#duplex half

    ```


    Cisco recommends leaving duplex at the default setting (auto) so the router will
    negotiate its own best duplex.'
