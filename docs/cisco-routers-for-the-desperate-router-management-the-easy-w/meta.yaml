- img_proc: true
  md: '# 9


    # CISCO NETWORK SERVICES


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_124_0.png)


    If you’ve done everything in this book so far, your router should be fully functional
    and quickly processing packets to and from your network in exactly the manner
    you desire. In addition to simply forwarding packets, however, Cisco routers support
    many additional network protocols that can work well to integrate the router into
    your network services and network management systems. These include things such
    as Network Time Protocol, system logging, and SNMP.


    As many of these services make use of timestamps, we’ll start by making your router’s
    idea of the current date and time bear some resemblance to reality.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# NTP


    If you''re relying on system logs to identify problems (as opposed to traditional
    troubleshooting methods such as "blind guesswork"), having your logs properly
    timestamped can make the difference between useful and useless records. Network
    management systems often use a system''s reported timestamp to record events.
    In the event someone breaks into your network and you have to involve law enforcement,
    inaccurate system time will effectively invalidate your records and your logs
    in the eyes of the legal system. While all of these combine to make network time
    important, maintaining synchronized network time across a variety of operating
    systems can be an annoyance. Cisco routers support Network Time Protocol (NTP),
    which is supported by all major operating system vendors and is the industry standard.


    # Basics of NTP


    NTP allows a group of networked hosts to agree on the time, within a few milliseconds.
    The protocol works with two conflicting assumptions. First, some systems have
    very accurate clocks, and the system owners wish to provide others access to those
    clocks. Second, those same hosts that want to provide a public service of accurate
    time do not wish to be flooded by every possible client in the world. The NTP
    protocol allows one or two local servers to get accurate time from big global
    time servers, and then redistribute that correct time to other clients on the
    network. The systems with extremely accurate clocks are called Tier 1 NTP servers.
    Those systems that are allowed to pull time directly from Tier 1 NTP servers systems
    and redistribute it to clients are called Tier 2 NTP servers.


    It is possible to configure your router to pull time directly from one of the
    big Tier 1 or Tier 2 NTP servers, but it''s best to have a local NTP server. Generally
    speaking, this server will read time from two or three different Tier 2 NTP servers
    and allow other local systems to get their time from it. This reduces load on
    the Tier 2 servers and makes NTP easier for you to maintain. The Tier 1 and 2
    time servers change their names or IP addresses on occasion, so it''s simpler
    to update your configuration on a single local server than on every client on
    the network. Check your operating system documentation for details on bunk. on
    how to provide time services to clients.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Configuring NTP


    Enabling NTP on your router is as simple as telling the router the IP address
    of the local NTP server. Although one NTP server will suffice, if you have multiple
    servers, enter each in a separate configuration statement.


    ```

    router(config)# ntp server 192.168.5.8

    router(config)# ntp server 192.168.3.8

    ```


    Wall clock time isn''t the same throughout the world. By default, NTP distributes
    time in the Coordinated Universal Time (UTC) time zone, the modern successor to
    the old Greenwich Mean Time. Even if your clock is completely accurate, it''s
    not necessarily convenient for your logs to have timestamps local to Europe. After
    you configure a time zone, your router will know exactly what sort of timestamp
    you''d like to have. A time zone is easily configured with the clock option.


    ```

    router(config)# clock timezone ①est ②-5

    router(config)# clock ③summer-time ④edt ⑤recurring

    ```


    To set the router''s time zone, you need to know the ① name of the time zone.
    You probably know the name of your local time zone; if not, ask someone who spends
    a little less time with computers and a little more with other people. You also
    have to know ② how many hours this time zone is different from UTC. This is slightly
    obscure, but you can find any number of charts on the Internet that will give
    you this information.


    Many parts of the world also observe Daylight Saving Time (DST), and your router
    can too. Cisco recognizes this as ③ summer-time. To set DST, you need to know
    the ④ name of your time zone during the summer. Finally, if you want your router
    to automatically change its clock with the changing of the time, use the ⑤ recurring
    keyword.


    # Checking NTP


    Your router may need a few moments to synchronize its clock with your NTP servers.
    If you want to make sure that your router is correctly performing NTP operations,
    you can check with the command sho ntp status.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '```

    router# sho ntp status

    Clock is synchronized, stratum 4, reference is 192.168.5.8

    nominal freq is 250.0000 Hz, actual freq is 249.9991 Hz, precision is 2**24

    reference time is C48A754E.88C5D76C (06:45:34.534 edt Mon Jun 28 2004)

    clock offset is -0.4631 msec, root delay is 65.75 msec

    root dispersion is 53.45 msec, peer dispersion is 6.85 msec

    ```


    This command displays more than you could possibly want to know about your router''s
    clock behavior, but you can see that the router believes it has synchronized its
    clock with that of a particular NTP server. You can also see what time the router
    thinks it is. This should be accurate, because NTP deals with margins of error
    on the order of milliseconds.


    You now have accurate time—congratulations! Now, let''s set up a place to record
    all these timestamps, and maybe even some data with them.


    # Router Logging


    A router knows when the equipment attached to it changes, when it has problems,
    and when people change its configuration. When you make changes to your router
    via the console, or if a circuit has a problem, you''ll probably notice messages
    such as


    ```

    %LINEPROTO-5-UPDOWN: Line protocol on Interface Serial3/1, changed state to down

    ```


    By default, these messages are dumped onto the console so that the administrator
    can figure out what is happening. This is nice, if you''re not staring at the
    console 24 hours a day, it''s less than helpful. While the router can store logging
    messages locally, it can also send these messages to another system for safekeeping.
    We''ll start with the local logs and proceed to the more advanced remote logs.


    # Local Logging


    The router can store a few messages locally, which allows you to check recent
    events on the systems. To use this system, you have to decide what level of logging
    you would like. Cisco follows the syslog standards for logging levels that have
    eight degrees of severity.'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'The *level* is an indication of the importance or severity of an individual
    message. Some messages are purely informational or contain only debugging information,
    while other messages (such as the “circuit down” example above) are clearly quite
    important. The levels are, in order of increasing importance:


    +   - **debugging** for debugging only

    - **informational** general informational messages

    - **notifications** events that may require special handling, but are not errors

    - **warnings** minor errors

    - **errors** real errors

    - **critical** critical errors

    - **alerts** errors that require immediate corrective action

    - **emergencies** the router is now inoperable


    When you specify a particular level, the router will log all messages of that
    severity level or higher. For example, if you specify that you want to log “info”
    level messages, the router will record all messages of the levels informational,
    notifications, warnings, errors, critical, alerts, or emergencies. Configuring
    basic logging requires only a couple of lines of code.


    ```

    router# conf t

    router(config)# service ❶ log ❷ timestamps ❸ datetime ❹ localtime

    router(config)# ❺ logging ❻ history ❼ debugging

    ```


    Start by telling the router to provide basic ❶ logging services as well as ❸ dated
    ❷ timestamps in the ❹ local time. When you have that, you can tell the router
    to ❺ perform logging, keeping the ❻ history on the local system. End with the
    ❼ lowest level of severity of messages you wish to record.


    You can view the log entries with the show logging command. This command will
    display a few lines of information about the logging configuration and then give
    the actual log entries.


    ```

    router# show logging

    ...

    Log Buffer (8192 bytes):


    *Jun 29 10:17:46.079: %LINK-3-UPDOWN: Interface FastEthernet0/1,

    changed state to up

    *Jun 29 10:17:46.079: %LINK-3-UPDOWN: Interface FastEthernet0/0,

    changed state to up

    ```'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'The important thing to remember is that the amount of space on the router for
    log messages is strictly limited and varies between different routers. If you
    want to keep more log messages, you must use syslog.


    # Syslog Basics


    The *syslog* protocol requires a separate server to receive the messages from
    the router (and any other network devices that speak the syslog protocol). The
    server runs a syslog daemon, or *syslogd*. Syslogd has been integrated into all
    sorts of Unix-like operating systems for many, many years, and Microsoft server
    operating systems have quite a few syslogd implementations (both commercial and
    free). Syslog daemons are very small and have low impact on even modest systems,
    and I recommend using whichever version is most convenient for your environment.
    While the configuration of syslog daemons varies widely between programs, the
    protocol basics are unchanged. Syslog uses the same severity levels as local logging,
    but also uses a *facility* to label messages.


    A facility is category provided by the syslog daemon for a group of programs to
    log to the same place. For example, the syslog facility called ftp is intended
    for FTP server log messages, as well as messages from related programs such as
    TFTP and SFTP servers. The daemon facility is intended for miscellaneous system
    daemons that require logging but don''t really rate their own facility. In addition
    to a couple of dozen defined facilities much like these, a syslog daemon also
    has eight local facilities called local0 through local7 specifically for use by
    local systems administrators. Any one of these local categories is appropriate
    for your router messages; just pick one. The router will use any facility that
    you choose.


    I recommend logging everything that the router produces; Cisco logs aren''t very
    large, and when something breaks you''ll want to be able to look at older logs.
    Once you have local logging configured, you only need to add a few lines to enable
    syslog logging.


    ```

    router# **conf t**

    router(config)# **logging** ❶**trap** ❷**debugging**

    router(config)# **logging** ❸**facility** ❹**local3**

    router(config)# **logging** ❺**192.168.1.8**

    ```'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'Logging ❶ traps are messages sent by the router. In this case, we want the
    router to transmit any log messages of ❷ debugging severity or greater to our
    syslog server (the severity levels are exactly the same as those used in local
    logging). The router tags each message with a particular ❸ facility we''ve set
    aside. In this case, we use the ❹ local3 facility. Finally, we tell the router
    the ❺ IP address of our logging server. Save your work, and every time the router
    generates a log entry it will send a message to your logging server.


    When the syslog messages arrive at your logging server, the syslog daemon will
    check the facility and severity of each message and direct the message to the
    file you''ve chosen for those messages. This process happens extremely quickly;
    if your syslog server is correctly set up, you will start to see messages appear
    almost immediately.


    # SNMP


    The most common glue to hold networks together is the Simple Network Management
    Protocol (SNMP). Many different products and tools use SNMP to gather and accumulate
    network and device performance information, and all of these include support for
    Cisco routers.


    SNMP can be used in both read-only and read-write modes. Using read-write SNMP
    requires that your router be tightly secured. Because your router is usually the
    border device on your network, sitting outside your firewall, this is difficult.
    Read-only access is a much safer idea. (You can also use an access list to prevent
    random people from being able to query your router; check Cisco''s website for
    details.)


    A SNMP-enabled device uses a community name to provide basic security. This is
    much like a password; people that have the community ID can make SNMP queries
    of the router, while people without the community name cannot. Setting the community
    name is quite simple:


    ```

    router# conf t

    router(config)# ❶snmp-server ❷community ❸SendMichaelAllYourCash ❹RO

    ```


    First, tell the router to ❶ fire up its SNMP server. You must set a ❷ community
    and pick ❸ some random jumble of characters to use as a community name. Finally,
    do not forget to set the community name to be ❹ read only! (While the router will
    use'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'read-only SNMP by default, it''s always a good idea to list this explicitly
    in case the system behavior should change with an IOS change.)


    With SNMP support, logging, and timekeeping, you have the tools you need to successfully
    monitor and manage your router with the rest of your network management equipment.
    If you can do all this, as well as troubleshoot your own circuits and load balance
    your traffic with BGP, you''re better off than almost all other Cisco users. Congratulations!'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# APPENDIX


    # IP ADDRESSES AND NETMASKS


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_132_0.png)


    If you''ve been around the networking world for a while, you''ll certainly recognize
    network blocks identified with *slash notation*, such as 10.0.0.0/8 or 209.69.8.0/23.
    If you know what these are, you can skip this appendix. Otherwise, read on.


    # What Is an IP Address?


    An IP address is simply a  Prefetch 32-bit number assigned to particular network
    device. Rather than expressing that 32-bit number as a single number, IP addresses
    are usually shown broken up into four 8-bit numbers ranging from 0 to 255. It''s
    much easier for our feeble brains to wrap around a number such as 192.168.0.1
    than 11000000101010000000000000000001.'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'To really understand netmasks, it’s important to remember that your IP addresses
    are really just a single long string of numbers.


    A netmask is just a way of saying how many IP addresses you have in a particular
    block. The trick is that not all netmasks are legitimate, and you can’t use just
    any netmask with any random IP address. If you’ve been kicking around the Internet
    for a while, you’ve probably seen the netmask 255.255.255.0. This was the standard
    for corporate networks for many years. This netmask means that you have 256 legitimate
    IP addresses in your network block. For example, if the IP address of your machine
    is 10.5.3.12 and it has a netmask of 255.255.255.0, you know that your local network
    has up to 255 other IP addresses on it. (It’s rare that all of these would be
    used, and certain addresses would present difficulties, but it’s within the possible.)
    This netmask is frequently called a *class C network*, although the term *class
    C* (and the other “class” network names) has been obsolete for about a decade
    now.


    A netmask is simply the line between the network and the host IP address. The
    classic 255.255.255.0 netmask means that the IP number is fixed for the first
    24 bits, and that you can change the last 8 bits. Confused yet? Let’s look at
    an example. Suppose your ISP issues you the block of IP addresses 192.168.1.0
    through 192.168.1.255, with a netmask of 255.255.255.0. The first 24 bits of the
    address are fixed, and you can do anything you want with the remaining 8 bits.
    Look at the netmask as a binary number, and it will start to make a whole lot
    more sense. In this example, any digit that is a 1 has been set by the ISP that
    issued you your IP addresses; any digit that is a 0 can be changed by the network
    administrator.


    > 255.255.255.0 = 11111111.11111111.11111111.00000000


    The first 24 bits are all 1s, meaning that you cannot change that part of the
    IP address on a machine on your local network. You can change the numbers that
    are in the “0” section of the netmask. The “192.168.1” part of the IP is all in
    the part of the netmask marked off by 1s, so you cannot change those numbers.
    The last chunk of the IP address, the part after the last period, is in the section
    marked off by 0s, so you can change this. The part of the IP address under the
    1s in the netmask is called the *network address*. The remainder is called the
    *host address*.


    Netmask size is measured by the number of 1s in the netmask. This netmask has
    24 1s, so it is a 24-bit netmask or a /24 (pronounced “slash 24”). Your network
    block would be written as 192.168.1.0/24.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'Here''s the scary part: there is no reason why the boundary between the network
    number and the host number must lie on the convenient 8-bit boundary. The following
    is a perfectly legitimate netmask:


    ```

    11111111.11111111.11111111.10000000

    ```


    If you convert this from binary to decimal (a function on most calculators these
    days), you''ll see that this is a netmask of 255.255.255.128. Don''t let that
    scare you—it''s a perfectly legitimate netmask, and it has 7 bits of addresses
    for your machines. That same calculator will show you that 2 to the power of 7
    is 128, so you have 128 IP addresses for this network.


    > **NOTE** *Unusable IP Addresses*


    The first and last address in any block is unusable. You cannot assign a machine
    on a network with a netmask of 255.255.255.0 an IP ending in either .0 or .255.


    # ## Practical Netmasks


    The end result of netmasks being in binary is that IP addresses are issued in
    blocks that are multiples of two. If you have 5 bits to play with, you''ll have
    32 (2 × 2 × 2 × 2 × 2 = 32) IP addresses on your network, and your netmask will
    be a /27 (32 − 5 = 27). If you have 8 bits for your hosts, you have (2⁸) or 256
    IP addresses. If you''re told that you have 55 IP addresses, you''re either sharing
    a network with other people or you need to learn what your network administrator
    is drinking and get him to share.


    It''s not uncommon to see a host IP with a netmask attached, e.g., 192.168.1.5/24.
    This gives you almost everything you need to know about the local network; just
    get the default gateway and you''re on the Internet!


    # ## Netmasks and BGP


    Your network must be a /24 or larger to route BGP, but what if it''s larger? It
    is preferable to announce as few blocks as possible, in order to reduce the size
    of the global routing table. Multiple consecutive "class C" blocks might very
    well be a legitimate network block. You probably don''t want to break out your
    calculator and transform all your network blocks into binary to find out, though!
    Here are some hints to determine whether a block of IP addresses is a legitimate
    single block.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'Remember that network blocks are issued in multiples of two. This holds true
    all the way up the scale, including the larger network numbers. This means that
    each legitimate block must be a multiple of two. If a block is actually legitimate,
    it will be a multiple of its own size. For example, the address block 192.168.4.0–192.168.5.255
    is a single contiguous range of addresses; and it''s certainly two /24 networks,
    but is it a single legitimate network block? If this was a legitimate /23 network,
    we could fit additional /23 networks precisely into the 192.168 network. 192.168.0.0/23
    fills 192.168.0.0 through 192.168.1.255, and 192.168.2.0/23 fills 192.168.2.0
    through 192.168.3.255. Our 192.168.4.0 block picks up right there without any
    space left over, so it''s a legitimate block! You can write this as 192.168.4.0/23,
    and you can announce it via BGP.


    On the other hand, look at the block 192.168.32.0–192.168.96.255. This is a block
    of 64 consecutive /24 networks, or possibly a single /18 network. If it''s a legitimate
    /18, we could fit an even multiple of 64 /24s into 192.168 before we reach this
    particular block. The very first block we would try, 192.168.0.0 through 192.168.64.255,
    overlaps the first half of our block. We can call this range two /19 networks,
    however: 192.168.32.0/19 and 192.168.64.0/19, which is better than announcing
    via BGP our 64 /24 networks!'
