    # Resetting BGP


    BGP runs almost perfectly, and rarely has any problems at all. I''ve let routers
    run for months without changing their BGP configurations. On occasion you might
    find that your routing is behaving oddly; perhaps all of your traffic is running
    over one circuit, indicating that the other peer is not sending you any routes.
    Or perhaps the peer isn''t receiving your route announcements, and so all of your
    incoming traffic is arriving via the other ISPs. One common step in these circumstances
    is to reset the BGP session, forcing your router and the peer to dump everything
    that they''ve previously agreed on, re-initialize the connection, and completely
    reload the routing table. The command for this is `clear ip bgp` followed by the
    neighbor''s IP address.


    ```

    router# clear ip bgp 172.16.0.2

    router#

    ```


    This should not be done lightly! Existing connections to the Internet may hang
    momentarily or even terminate. The router''s CPU utilization will climb dramatically
    as the routes are cleared and all the new BGP information is received from the
    peer. If you have an older or smaller router, you can expect your terminal window
    to become at least useless.


    On a more serious note, the rest of the world will see that your routes have just
    "flapped"; they''ve been withdrawn from that peer, and suddenly reappear. If you
    do this several times in quick succession, other autonomous systems will "dampen"
    your route announcements due to flap. They will ignore your route updates, and
    they may ignore routes to your network entirely until you can stop bouncing up
    and down. This is a necessary part of BGP; sudden withdrawals and insertions of
    a particular'
