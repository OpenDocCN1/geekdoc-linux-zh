    another change. This will also help reduce the risk of being marked as a flapping
    BGP source and blackholing yourself off the Internet.


    If you want to see how your BGP announcements are being viewed by the outside
    world, search the Internet for a “BGP Looking Glass.” These are web pages that
    allow you to query routers for BGP information. By asking remote routers for BGP
    information on your block of IP addresses, you can see what announcements they
    are seeing and how other people view your network. If you are having a problem
    with BGP configuration, you can use several looking glasses to determine who can
    see your routes and who cannot, and thereby identify the scope of the problem.
    This information can also help you to identify problems such as one of your peers
    not propagating your announcements beyond their network or altering your announcements
    in some way.


    # Hot Standby Router Protocol


    After you have BGP up and running, the next obvious question is, “What do we do
    if the router itself fails?” While Cisco routers are generally reliable, even
    the best hardware sometimes lets the magic smoke escape and transforms into a
    shiny metal paperweight. Cisco supports the Hot Standby Router Protocol (HSRP)
    to provide live failover between routers in this eventuality. You can build a
    “pool” of independent Cisco devices that will take over some functions of a failed
    router; not all of the functions are covered, but enough are so that your users
    will not notice.


    # What Is HSRP?


    HSRP lets multiple routers provide a single IP address. This is most useful for
    your default gateway on your Ethernet. All your computers know about the routers
    is that one of them had better have the default gateway of (for example) 192.168.0.1;
    they don’t care which router has it, just that it’s available. HSRP allows the
    routers to keep track of each other; when the router that has the default gateway
    disappears from the network, another router can automatically respond to requests
    for the default gateway’s IP address. In this case, each router has its own unique
    IP address on its Ethernet interface, but might also have the default gateway
    as shown in Figure 7-2.'
  - '[PAGE 108]


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_108_0.png)


    Router A has an **1** Ethernet interface on the office network. This interface
    has the primary IP address of 192.168.0.2, but it can also host the IP address
    192.168.0.1—the default gateway for your computers. If you want to log in to Router
    A, SSH to the address 192.168.0.2. Similarly, Router B also has an **2** Ethernet
    interface on the office network and a unique IP address of 192.168.0.3, but it
    can also host the default gateway of 192.168.0.1. The routers settle between themselves
    which is the “default” default router, but when that router fails, the other will
    take over. In Cisco terminology, the IP address 192.168.0.1 is the *standby* address.
    (Other implementations commonly call this a Virtual IP, or VIP.)


    Very basic configuration of this Ethernet interface is only a couple of lines.


    ```

    router(config)# int faste0/0

    router(config-if)# ip address 192.168.0.2 255.255.255.0

    router(config-if)# **1**standby **2**1 ip 192.168.0.1

    ```


    Apply the **1** standby entry to both router configurations, and abruptly you’ll
    be able to ping 192.168.0.1. Keep pinging that IP while you reboot routers, and
    you won’t even see a single dropped packet—unless, of course, you turn both routers
    off at once!


    A single router interface can support multiple HSRP standby IP addresses. Each
    has to be identified as a **2** group. Use the group identifier in every configuration
    involving that particular standby IP.'
