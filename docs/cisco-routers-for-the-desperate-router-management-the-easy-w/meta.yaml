  md: '# Configuring the Router


    When you’re in privileged EXEC mode, you can not only issue more powerful commands
    but also change the router’s configuration.


    To change the router’s configuration, you must enter *configure mode*. The most
    common way to configure the router is at the command line you’re logged in at,
    also known as the *terminal*. Enter configure terminal at the privileged mode
    prompt.


    ```

    router#conf t

    Enter configuration commands, one per line. End with CNTL/Z.

    router(config)#

    ```


    Note that the ❶ command prompt has changed from simply router to router (config);
    the router is making it explicit that you are configuring the system. At the configure
    prompt, you can enter configuration statements, one statement per line.


    Configuration commands look exactly like those in the system configuration and
    are added directly to the router’s configuration. For example, to add the line
    service password-encryption to your configuration, just enter it at the configure
    prompt.


    ```

    router(config)#service password-encryption

    ```


    The router will place this in an appropriate spot in the global configuration.
    (No, you can’t put the statement in a place of your own choosing in the configuration;
    the router knows far better than you do where each line belongs and will blatantly
    ignore any attempts to reorder the configuration.) Entering a command like reload
    or ping at the configure prompt will only generate an error, because these are
    not legitimate configuration statements.


    When you have completed your configuration, leave configuration mode with CTRL-Z.


    ```

    router(config)#^Z

    router#

    ```


    The prompt changes back to simply router.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# # Configuring a Particular Interface


    When you need to configure a particular interface, just enter the interface name
    at the configure prompt. The router will place any further statements under the
    interface configuration.


    ```

    router(config)#int s1/0

    router(config-if)#

    ```


    Note that the  prompt changes to router (config-if) to remind you that you''re
    configuring an interface, not the entire router.


    Why is this important? Do you remember our example configuration that had no ip
    redirects on a single interface? Presumably that router needed the feature enabled
    on some other interface or on a global level, and it testified have been enabled
    that way.


    Routing protocols have a similar configuration sub-prompt.


    ```

    router(config)#router bgp 8292

    router(config-route)#

    ```


    Any further statements will appear in the router bgp 8292 section, as shown in
    our example earlier.


    # # Saving Changes


    Entering all these configuration statements will alter the running configuration,
    but that configuration won''t persist through a reboot unless you save the configuration.
    Use the write command to save your changes.


    ```

    router#write

    Building configuration...

    [OK]

    router#

    ```


    # # Backing Up Router Configurations


    There''s nothing particularly special about router configurations; they''re just
    plain text. The simplest way to back up your router''s configuration is to copy
    the configuration statements to another system, perhaps a plain text file on a'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'server or even to a piece of paper in a logbook. Should your router suffer
    a critical failure and lose its mind, you can restore service by just going into
    configure mode and pasting in the entire router configuration.


    It is also possible to copy your router''s configuration to an FTP server with
    the `copy ftp` command. The process is quite similar to the FTP process used for
    IOS upgrades, and it is an *excellent* precaution to take before an upgrade, so
    we''ll discuss it in Chapter 6.'
  merge: -1
  pgno: 33
