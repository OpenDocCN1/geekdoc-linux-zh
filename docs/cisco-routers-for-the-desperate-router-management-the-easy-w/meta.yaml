    # Configuring NTP


    Enabling NTP on your router is as simple as telling the router the IP address
    of the local NTP server. Although one NTP server will suffice, if you have multiple
    servers, enter each in a separate configuration statement.


    ```

    router(config)# ntp server 192.168.5.8

    router(config)# ntp server 192.168.3.8

    ```


    Wall clock time isn''t the same throughout the world. By default, NTP distributes
    time in the Coordinated Universal Time (UTC) time zone, the modern successor to
    the old Greenwich Mean Time. Even if your clock is completely accurate, it''s
    not necessarily convenient for your logs to have timestamps local to Europe. After
    you configure a time zone, your router will know exactly what sort of timestamp
    you''d like to have. A time zone is easily configured with the clock option.


    ```

    router(config)# clock timezone ①est ②-5

    router(config)# clock ③summer-time ④edt ⑤recurring

    ```


    To set the router''s time zone, you need to know the ① name of the time zone.
    You probably know the name of your local time zone; if not, ask someone who spends
    a little less time with computers and a little more with other people. You also
    have to know ② how many hours this time zone is different from UTC. This is slightly
    obscure, but you can find any number of charts on the Internet that will give
    you this information.


    Many parts of the world also observe Daylight Saving Time (DST), and your router
    can too. Cisco recognizes this as ③ summer-time. To set DST, you need to know
    the ④ name of your time zone during the summer. Finally, if you want your router
    to automatically change its clock with the changing of the time, use the ⑤ recurring
    keyword.


    # Checking NTP


    Your router may need a few moments to synchronize its clock with your NTP servers.
    If you want to make sure that your router is correctly performing NTP operations,
    you can check with the command sho ntp status.'
