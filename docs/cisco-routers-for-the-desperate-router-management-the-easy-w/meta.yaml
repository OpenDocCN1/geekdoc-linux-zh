    \ with the interface type, but you can ask an interface what speeds it supports\
    \ with the standard `?` syntax. Here we interrogate an interface to determine\
    \ supported speeds and then hard-code a desired speed into the configuration.\n\
    \n```\nrouter(config-if)#speed ?\n  10    Force 10 Mbps operation\n  100   Force\
