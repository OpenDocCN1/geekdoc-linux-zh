    router(config-route)#

    ```


    任何后续语句都会出现在 `router bgp 8292` 部分中，如我们之前的示例所示。


    ### 保存更改


    输入所有这些配置语句会更改运行配置，但如果你不保存配置，这些配置不会在重启后保留。使用 `write` 命令保存你的更改。


    ```

    router#write

    Building configuration...

    [OK]

    router#

    ```


