    Or there may be some Internet "black hole" that causes many different requests
    to fail. For example, for much of 1996, MCI''s Willow Springs router cluster seemed
    to be the Secret Internet Packet Burial Ground; network requests routed through
    that system consistently suffered horrible packet loss and latency. It''s highly
    likely that the owner of such a Network of Death is well aware of the problem
    and is desperately attempting to resolve the issue, but if you have no business
    relationship with the network owner, there''s nothing you or your ISP can do about
    it. In either event, at least you know.


    If you cannot even ping across your circuit, it''s time to get your hands dirty
    and troubleshoot your circuit. But before you can troubleshoot anything, you must
    understand it.


    # Circuit Design


    Different phone companies have used many different types of connection equipment
    over the decades. One of my clients still uses a phone switch dating from the
    1950s, featuring fuses the width of my thumb and several inches long. (I believe
    that Dr. Frankenstein used such equipment, and I have suggested offering the equipment
    to him for spares if he''ll only haul it away.) There is no way this sort of equipment
    can be used for an Internet connection.


    Others have systems of more recent vintage, but of completely unknown origin.
    If you have such a baroque setup, save yourself a *lot* of trouble and get a modern
    circuit. We''re going to discuss the physical design of a modern T1 circuit, not
    Frankenstein collectibles.'
  - '[PAGE 68]


    # ## The Smartjack


    Phone companies usually terminate the circuit at your location with a device called
    a *smartjack*, which is a small box with green and red lights on it. The smartjack
    has simple brains that the telco can use for troubleshooting (that''s where the
    "smart" part comes from). The phone company or ISP is usually responsible for
    the circuit up to the smartjack; problems between the smartjack and the router
    are your responsibility.


    The point where the smartjack is installed is called the *demarc*. If your smartjack
    is far from your router, it''s not uncommon to have a professionally installed
    *extended demarc*, where the circuit is run from the smartjack to a point more
    convenient for the equipment. You''ll frequently see this in office buildings,
    where the phone company delivers all the circuits to one central location but
    offices are on many floors above.


    Eventually, the circuit is delivered to a Channel Service Unit/Data Service Unit
    (CSU/DSU), which transforms the signals arriving over the T1 line into something
    the router understands. Most modern Cisco routers have integrated CSU/DSU features,
    so you can just plug the RJ-45 cable from the smartjack directly into the router
    without having additional clunky boxes sitting around the data center.


    # ## Examining the Circuit


    The first line of the sho int output for an interface describes the basic state
    of the interface, as discussed in Chapter 3. If the line is up, the router is
    seeing a reasonable signal from the T1. If the line is down, the router is not
    seeing a signal over the T1. While you still need to check for other errors on
    the interface, not seeing a signal is a pretty solid sign that something is seriously
    wrong.


    If the circuit is up but the protocol is down, the router cannot understand the
    signals coming over the T1. If this is a brand-positive circuit, it is probably
    misconfigured, but in mature circuits this may mean line noise or damage. (It
    can also mean that someone else somewhere along the circuit touched things, but
    no ISP or telco would even *dream* of doing that, not even if some underpaid and
    overworked tech thought you wouldn''t notice if he just tweaked one setting while
    nobody was looking.)


    Although you''ll want to check the rest of the information available on this interface,
    there are things you can try first.'
- md: ' # Resetting the Interface


    First, if some network device along the circuit is confused, resetting the interface
    may kick that device back to its senses.


    ```

    router#conf t

    router(config)#int s1/0

    router(config-int)#shut

    ```


    Count to ten slowly, and then reopen the interface.


    ```

    router(config-int)#no shut

    router(config-int)#^Z

    router#

    ```


    If your circuit is back up, congratulations! If not, the next step is to reboot
    the router.


    # Rebooting the Router


    While pulling the power cord out of the back, counting to ten, and plugging it
    back in will do the trick, as long as you''re logged in you might as well restart
    the router in a slightly more graceful manner.


    ```

    router# reload

    ```


    The router will prompt you for confirmation and then restart itself. If your router
    has a separate CSU/DSU, power cycle it simultaneously.


    # Nothing Worked!


    If neither of these works, you will have to phone your ISP or telco. You can make
    this call in one of two ways: either armed with lots of information so you can
    resolve the problem as quickly as possible, or in a hysterical panic. If you prefer
    the hysterical panic technique, make that call now. If not, arm yourself with
    all the information your router has to offer before calling. No matter how good
    your ISP''s customer service department is, failure of your network is more important
    to you than it is to the person answering the phone. After all, that support tech
    still has his email!


    When you make that call, however, you will sound much more impressive and serious
    if you can say, "Our circuit protocol has failed, and we are receiving hundreds
    of CRC errors a second," than if you say, "Uh, our circuit isn''t working." Your
    router provides you with a wide range of debugging information, if you know how
    to read it.


    # Interface Debugging Information


    Each router interface provides a full description of the work it is performing,
    the errors it sees, and what actions it is taking. While we won''t cover every
    scrap of information your router offers, you should understand some of the basics
    when you have to troubleshoot. Here''s the output from a `sho int` on a standard
    Cisco T1 interface. Your output might look slightly different, depending on your
    interface and circuit type.


    **NOTE**


    **Input and Output**


    Remember, a router''s "input" is traffic that is entering the router via the interface,
    while the "output" is leaving the router via that interface. In the case of a
    T1, input is coming in from the outside world, while output is leaving your network
    and heading out over the T1. On a typical Ethernet interface, router input is
    leaving the local network, and output is arriving at the local network.


    ```

    #sho int s1/0

    ```


    - Last input 00:00:07, output 00:00:07, output hang never


    - Last clearing of "show interface" counters 5w6d


    - 5 minute input rate 6000 bits/sec, 6 packets/sec


    5 minute output rate 6000 bits/sec, 2 packets/sec


    - 6413455 packets input, 2153942875 bytes, 0 no buffers


    - Received 0 broadcasts, 0 runts, 641 giants, 0 throttles


    - 36851 input errors, 327 CRC, 36520 frame, 0 overrun, 0 ignored, 4 abort


    - 2871476 packets output, 608779651 bytes, 0 underruns


    - 0 output errors, 0 collisions, 31 interface resets


    - 0 output buffer failures, 0 output buffers swapped out


    - 27 carrier transitions


    - DCD=up DSR=up DTR=up RTS=up CTS=up


    The **1** "last input" and "last output" values show how long it has been since
    packets entered or left this interface. This particular interface has been idle
    for seven seconds, which is not surprising with a problematic T1 or a slow network.


    Cisco tracks most errors with an incrementing counter. The **2** last clearing
    of "show interface" counters space shows the last time this incremental counter
    was reset to zero. In this example, the counters have been incrementing for five
    weeks and six days, far too long to be useful for troubleshooting a problem happening
    right now—those 15 million errors the router has recorded could have happened
    a month ago or in the last minute, and there''s no way to tell. It''s very easy
    to reset these counters, though, and you don''t even have to go into configure
    mode:


    ```

    router#clear counters

    Clear "show interface" counters on all interfaces [confirm]

    router#

    ```


    All the counters will be reset to zero, for all interfaces. You can now do a `sho
    int` on your failed interface several times in succession and easily see if any
    error counters are increasing while the problem is happening. (Yes, you can do
    this while the error counters are all high, but it''s much easier to see the difference
    between 0 and 300 than to see the difference between 15831594 and 15831894, especially
    if many error counters have nonzero values.)


    ## Input/Output Rates


    The **3** five-minute input and output rates can be useful for troubleshooting.
    Although they are averaged over the last five minutes, you can check the interface
    several times in succession to see how they change. Is the average tending toward
    zero or climbing rapidly?


    Remember, a T1 only handles 1.54MB/sec, or 1,540,000 bits per second. If your
    average throughput is close to that, that''s why your network feels slow. A distributed
    denial-of-service attack or a sudden rush on your website can make your users
    feel like the Internet is down, when actually it''s just a massive flood of traffic
    making your circuit useless. The **4** totals of all packets processed since the
    counters were cleared can be useful in a similar way.


    ## Types of Errors


    The interface then gets **5** specific on the types of errors it sees. *Broadcasts*
    are standard network broadcasts and generally are not a cause for alarm. *Runt*
    packets are smaller than the router''s minimum packet size, and *giants* are larger
    than the maximum packet size. Neither should be on a T1 circuit. If they appear
    on an Ethernet segment, some network device is sending them out.


    **6** *Input errors* cause packets to be rejected. The interface presents a total
    of all the input errors and then breaks them down by category. Although a certain
    number of errors is normal, if input errors comprise over one percent of your
    incoming packets, you have a problem. In this example, we have 36,000 input errors.
    We''ve input about 6.4 million packets, though, so this is far less than one percent
    of all packets, an acceptable error rate.


    *CRC* and *frame input errors* probably indicate some sort of line noise; if these
    are happening frequently, call your ISP or telco and have them troubleshoot the
    circuit.


    *Overrun*, *ignored*, and *abort input errors* indicate that the router cannot
    process incoming packets quickly enough and is forced to drop surplus packets.
    You can adjust the router''s internal buffers, but this is very tricky to do correctly.
    I strongly encourage you to use Cisco''s SmartNet support and have a technician
    help you adjust the buffers to fit your particular situation.


    **7** *Output errors* are most common on an Ethernet interface, where an extremely
    high collision rate can interfere with the network''s performance. On a serial
    line, output errors are most commonly the result of running out of buffers for
    outgoing packets (though this is quite rare on small routers). Again, if you''re
    consistently running out of buffers, contact Cisco for help.


    ## Using Carrier Transition to Detect a Bad Serial Connection


    One of the more useful ways to detect a bad serial connection is the **8** *carrier
    transitions* line. A carrier transition is when the interface either goes up or
    comes down. It''s entirely possible for a serial line to bounce up and down so
    quickly that you won''t catch it by successive `sho int` commands. The carrier
    transition increments whenever the line goes down, and again whenever it comes
    back up. By watching this field, you can detect an unstable circuit.


    Finally, a serial line will list the **9** signals that it is receiving over the
    line. For the line to be functional, all of these need to be up; if any are not
    up even after rebooting everything, call your ISP or telco. Your router cannot
    process traffic it cannot hear!


    ## Extended Pings and Circuit Troubleshooting


    Cisco routers can use a variety of ping tests to check IP connectivity to other
    networks. This is very useful for testing troublesome serial circuits that are
    not down but that are not actually working properly. At times, a misprovisioned
    circuit will cause problems that do not appear on `sho int`, but that cause no
    end of headaches.'
  mdcn: '

    # 重置接口


    首先，如果电路中的某个网络设备出现混乱，重置接口可能使其恢复正常。


    ```

    router#conf t

    router(config)#int s1/0

    router(config-int)#shut

    ```


    缓慢数到十，然后重新启用接口。


    ```

    router(config-int)#no shut

    router(config-int)#^Z

    router#

    ```


    如果你的电路恢复正常了，恭喜！如果没有，下一步是重启路由器。


    # 重启路由器


    虽然从背面拔掉电源线、数到十再插回去也能奏效，但只要你已经登录系统，不妨以一种更优雅的方式重启路由器。


    ```

    router# reload

    ```


    路由器会提示你确认，然后自行重启。如果你的路由器有独立的CSU/DSU设备，请同时对其断电重启。


    # 一切方法都无效！


    如果以上方法都不奏效，你将不得不致电你的互联网服务提供商（ISP）或电信公司。你可以选择以下两种方式之一进行通话：要么准备好大量信息，以便尽可能快地解决问题；要么在歇斯底里的恐慌中求助。如果你倾向于后一种方法，现在就可以打电话。如果不是，那么在拨打前，请准备好你的路由器所能提供的所有信息。无论你的ISP客服部门多么优秀，网络故障对你而言，远比对接电话的那个人更为重要。毕竟，那位技术支持人员还能继续处理他的邮件！


    然而，当你拨打电话时，如果你能说出“我们的电路协议失效了，而且每秒收到数百个CRC错误”，这会比说“呃，我们的电路不工作了”显得更专业、更认真。如果你知道如何解读，你的路由器会提供大量调试信息。


    # 接口调试信息


    每个路由器接口都提供其正在执行的工作、遇到的错误以及正在采取操作的完整描述。虽然我们不会涵盖你的路由器提供的所有信息，但你应该理解一些基础知识，以便在需要时进行故障排除。以下是标准Cisco
    T1接口上`sho int`命令的输出。根据你的接口和电路类型，你的输出可能略有不同。


    **注意**


    **输入和输出**


    记住，路由器的“输入”是通过接口进入路由器的流量，而“输出”是通过该接口离开路由器的流量。对于T1来说，输入来自外部世界，而输出则离开你的网络并通过T1传输。在典型的以太网接口上，路由器输入是离开本地网络的流量，而输出是到达本地网络的流量。


    ```

    #sho int s1/0

    ```


    - 最后输入时间 00:00:07，输出时间 00:00:07，输出挂起从未发生


    - 上次清除“show interface”计数器是在 5周6天前


    - 5分钟输入速率 6000比特/秒，6包/秒

    5分钟输出速率 6000比特/秒，2包/秒


    - 6413455包输入，2153942875字节，0个无缓冲区


    - 接收到 0个广播，0个残帧，641个巨帧，0个节流


    - 36851个输入错误，327个CRC错误，36520个帧错误，0个过载，0个忽略，4个中止


    - 2871476包输出，608779651字节，0个欠载


    - 0个输出错误，0个冲突，31次接口重置


    - 0个输出缓冲区失败，0个输出缓冲区被换出


    - 27次载波转换


    - DCD=up DSR=up DTR=up RTS=up CTS=up


    **1** “最后输入”和“最后输出”值显示了数据包进入或离开此接口的最后时间。这个特定的接口已经空闲了七秒，对于一个有问题的T1或一个缓慢的网络来说，这并不奇怪。


    思科使用递增计数器跟踪大多数错误。**2** “上次清除show interface计数器”的位置显示了此递增计数器上次归零的时间。在这个例子中，计数器已经递增了五周零六天，对于解决当前发生的问题来说，时间太长，无法提供有效信息——路由器记录的那1500万个错误可能是一个月前发生的，也可能是在过去一分钟内发生的，无法判断。不过，重置这些计数器非常容易，甚至不需要进入配置模式：


    ```

    router#clear counters

    Clear "show interface" counters on all interfaces [confirm]

    router#

    ```


    所有接口的所有计数器都将归零。现在你可以连续几次对故障接口执行`sho int`命令，在问题发生时轻松查看是否有任何错误计数器在增加。（是的，你可以在错误计数器都很高的时候这样做，但比较0和300之间的差异要比比较15831594和15831894之间的差异容易得多，尤其是当许多错误计数器都有非零值时。）


    ## 输入/输出速率


    **3** 五分钟的输入和输出平均速率对于故障排除可能很有用。虽然它们是过去五分钟的平均值，但你可以连续多次检查接口，观察它们如何变化。平均值是趋向于零还是在迅速攀升？


    记住，T1只能处理1.54MB/秒，或1,540,000比特/秒。如果你的平均吞吐量接近这个数值，这就是你的网络感觉慢的原因。分布式拒绝服务攻击或你网站的突然流量激增可能会让你的用户感觉互联网宕机了，而实际上只是大量的流量洪水让你的电路不堪重负。自计数器清除以来处理的所有数据包的**4**
    总数，在类似方式上也可能有用。


    ## 错误类型


    接下来，接口会详细说明它所遇到的**5** 错误类型。*广播*是标准的网络广播，通常不需要报警。*残帧*数据包小于路由器的最小数据包大小，而*巨帧*大于最大数据包大小。这两种情况都不应该出现在T1电路上。如果它们出现在以太网段上，则说明某个网络设备正在发送它们。


    **6** *输入错误*会导致数据包被拒绝。接口显示所有输入错误的总数，然后按类别细分。虽然一定数量的错误是正常的，但如果输入错误占你传入数据包的百分之一以上，你就遇到问题了。在这个例子中，我们有36,000个输入错误。然而，我们总共输入了大约640万个数据包，所以这远小于所有数据包的百分之一，属于可接受的错误率。


    *CRC*和*帧输入错误*可能表明某种线路噪声；如果这些错误频繁发生，请致电你的ISP或电信公司，让他们排除电路故障。


    *过载*、*忽略*和*中止输入错误*表明路由器无法足够快地处理传入数据包，被迫丢弃多余的数据包。你可以调整路由器的内部缓冲区，但这非常难以正确操作。我强烈建议你使用思科的SmartNet支持，让技术人员帮助你调整缓冲区以适应你的特定情况。


    **7** *输出错误*最常见于以太网接口，其中极高的冲突率会干扰网络性能。在串行线路上，输出错误最常见于为传出数据包准备的缓冲区耗尽（尽管这在小型路由器上相当罕见）。同样，如果你持续用尽缓冲区，请联系思科寻求帮助。


    ## 利用载波转换检测串行连接故障


    检测串行连接故障的较有用方法之一是**8** *载波转换*行。载波转换是指接口状态变为上升或下降。串行线路快速地上下跳动是完全可能的，以至于你无法通过连续的`sho
    int`命令捕捉到。每当线路断开时，载波转换计数器会增加一次，每当线路恢复时，又会增加一次。通过监视这个字段，你可以检测到不稳定的电路。


    最后，串行线路会列出它通过线路接收到的**9** 信号。为了使线路正常工作，所有这些信号都需要处于上升状态；如果即使在重启所有设备后，任何信号仍未上升，请致电你的ISP或电信公司。你的路由器无法处理它听不到的流量！


    ## 扩展Ping测试与电路故障排除


    思科路由器可以使用多种ping测试来检查与其他网络的IP连通性。这对于测试那些未宕机但实际未正常工作的、麻烦的串行电路非常有用。有时，一个配置错误的电路会导致在`sho
    int`上不显示、却令人头疼不已的问题。

    '
