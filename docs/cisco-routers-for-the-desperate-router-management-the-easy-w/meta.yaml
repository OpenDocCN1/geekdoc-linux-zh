  raw:
  - '[PAGE 73]


    On more than one occasion, I''ve dealt with a circuit with a perfect-looking interface
    that passed every standard ping test with flying colors and yet was useless. GIF
    files could not be moved across these circuits and Windows networking infrastructure
    protocols would not work over them. In each case, the problem was exactly the
    same: the circuit was provisioned incorrectly (with AMI encoding instead of the
    modern standard of B8ZS). This meant that the circuit could not pass large all-zero
    packets. The .gif image format uses a lot of large all-zero packets, as do the
    Windows network protocols.


    **NOTE** *Other physical errors generate different symptoms; this particular example
    is just the one that seems destined to haunt me. Your data circuit should accept
    whatever sort of data you want to transmit, even if it is a whole lot of nothing!*


    To perform an extended ping test, enter enable mode and just type **ping**.


    ```

    router#**ping**

    Protocol [ip]:

    Target IP address: 192.168.5.3

    ```


    The default protocol is IP, so just press ENTER. Then give the IP address you
    want to ping. Generally, this is the IP address of the router on the other side
    of your serial link.


    Don''t use pings to Internet sites to test your circuit''s status; that tests
    every link between your router and the remote Internet site! The other end of
    the circuit is the only reasonable place to ping when testing your own circuit''s
    behavior.


    ```

    Repeat count [5]: 1000

    ```


    When using extended ping, use more than five pings. A few hundred is the bare
    minimum for this sort of test, but a thousand is usually reasonable. Either your
    test will be over in just a few seconds, or you''ll be interrupting it anyway.
    If you sweep the range of sizes (as recommended later), the router will decide
    how many pings are necessary to properly cover the range, and the value you enter
    here will be ignored anyway.


    ```

    Datagram size [100]:

    ```


    You could specify a size here if you wished, but we''ll be doing something slightly
    more advanced in the extended commands.'
  - '[PAGE 74]


    ```

    Timeout in seconds [2]:

    ```


    Two seconds is a very reasonable timeout. Giving a longer timeout is generally
    useless for most IP circuits, because either the packet will return in much less
    time, or you’ll wait that much longer for failed packets. With a shorter timeout,
    you may miss perfectly legitimate return packets that are delayed by a busy remote
    router.


    ```

    Extended commands [n]: y

    ```


    If you take the default n (no) here, the router will run the ping as you have
    specified it. But most of the truly nifty options are in the extended commands,
    so enter y for yes.


    ```

    Source address or interface:

    ```


    With loose source routing, you can change your source IP address and send packets
    from a particular interface, which is useful to do on backbone routers but not
    for most small offices. I highly recommend that you don’t try this, because the
    results will only confuse you. (Tracking down problems is difficult enough without
    using an easily misunderstood tool!)


    ```

    Type of service [0]:

    Set DF bit in IP header? [no]:

    Validate reply data? [no]:

    ```


    These three flags manipulate or verify TCP/IP data but aren’t generally useful
    for day-to-day work. If you’re not familiar with the innards of TCP/IP, just take
    the defaults.


    ```

    Data pattern [0xABCD]: 0xffff

    ```


    A ping packet contains four bytes, and you can choose what data to put in them.
    The hexadecimal 0xABCD is the default, but two common choices are 0x0000 (all
    zeros) and 0xFFFF (all ones). Many misconfigured circuits fail with certain sizes
    of all-zero or all-one packets.


    ```

    Loose, Strict, Record, Timestamp, Verbose [none]:

    ```


    You can choose to use loose or strict source rerouting, record the route taken
    by the ping packets, datestamp each ping packet, or use verbose output. If you
    don’t know what loose or'
  - '[PAGE 75]


    strict source routing are, don''t try to use them. For most situations, almost
    none of these are useful, but you might try verbose output sometime for your own
    edification; just enter **v** at the prompt.


    ```

    Sweep range of sizes [n]: y

    ```


    By sweeping the range of sizes, you send packets ranging from very small to quite
    large. Definitely set this when testing a troublesome circuit. The smaller packets
    will appear quickly, larger packets much more slowly. If you sweep the range of
    sizes, the ping command will ignore the count you entered earlier; you will need
    to interrupt it with CTRL-^.


    ```

    Sweep min size [36]:

    Sweep max size [18024]:

    ```


    These are the minimum and maximum packet sizes when sweeping. The defaults range
    from quite tiny to reasonably large.


    ```

    Sweep interval [1]: 50

    ```


    The sweep interval is the increment to the packet size when sweeping. For example,
    with the example shown here, the first packet sent will be 36 bytes, the second
    37 bytes, the third 38, and so on, until a packet size of 18,024 is reached. Picking
    a larger increment than 1 will accelerate the test. Also, you may not want to
    let your router send 17,092 pings to perform the test with every possible sized
    packet in the range.


    Once you have chosen all the values, the ping will run.


    ```

    Type escape sequence to abort.

    Sending 1800, [36..18024]-byte ICMP Echos to 198.88.118.11, timeout is 2 seconds:

    Packet has data pattern 0xFFFF

    !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

    ....

    ```


    +   * Each exclamation point indicates a successful ping, while a period indicates
    a missed one. This ping test will continue until the 1800 packets have been sent.
    Reducing the increment will increase the number of pings the router sends. Again,
    you can interrupt the test at any time by pressing CTRL-^.'
  - '[PAGE 76]


    **NOTE** Small packets appear more quickly than large packets, and the largest
    packets in the ping sweep test may make you think that the router has stopped
    responding. Note which sorts of packets the router has trouble with.


    For circuits that are behaving poorly or exhibiting “weird” behavior, I suggest
    running the extended ping test three times: once with the default data pattern,
    once with an all-zero data pattern, and once with all ones. If your circuit has
    trouble with certain sorts of packets, this process will probably uncover it.
    If not, your circuit is probably running cleanly.


    # Phoning the ISP


    So you’ve opted to gather all your debugging information before calling. You know
    which sorts of errors are appearing on your circuit, and what sort of packets
    your circuit will and will not pass. Now what?


    You got your T1 circuit from either a telco or an ISP. Phone them. The first words
    out of your mouth should be, “I have a down circuit.” When you reach a technical
    support person, explain:


    +   - The state of the line itself (both line and protocol down, or just protocol
    down, or both line and protocol up)

    - That you have rebooted your router and CSU/DSU (this will almost certainly be
    their first suggestion)

    - The types of errors you are seeing: CRC, framing, overruns, aborts, and so on

    - The results of any ping tests you have run


    The technician should check the ISP’s end of the circuit and phone the telco who
    originally provisioned the line. Most telephone companies will return a call to
    the circuit owner (usually the ISP) within an hour with an initial status report.


    **NOTE** While your ISP should handle circuit issues, especially when they own
    the circuit, if the problem is actually a failed circuit, it may take hours to
    repair.


    # Circuit Loopback Tests


    T1 circuits include all sorts of intelligent equipment such as repeaters, switches,
    and smartjacks. The telco can talk to this equipment using a series of successive
    loopback tests to quickly identify where a problem lies and what piece of equipment
    is at fault.'
  - '[PAGE 77]


    The telco has a diagram listing every piece of equipment along a circuit. A loopback
    test is where they attempt to communicate with each piece of equipment in succession.
    For example, the telco central office will try to “loop up” the first piece of
    equipment outside their office—say, the repeater in the little gray box up the
    street. If they can easily communicate with that device, and if that device can
    return data it receives to the central office, they will loop up the second closest
    device and test it. When something fails to respond, they send a technician out
    to examine and repair that device.


    Eventually, the telco will work their way down to looping up the smartjack at
    your demarc. If the telco can communicate correctly with the smartjack, they will
    probably try to loop up your CSU/DSU. The telco/ISP’s responsibility technically
    ends at the smartjack, but they will frequently try to go the extra step simply
    to demonstrate that it isn’t their problem. (This tactic should be painfully familiar
    to anyone who has worked a help desk!) If the telco says that they can cleanly
    loop up the smartjack, but cannot loop up the CSU/DSU, the problem lies somewhere
    between the CSU/DSU and the smartjack and is unquestionably your problem.


    This sort of exhaustive test takes time, especially on a long circuit, but it
    is the quickest way to identify a problem. The telco may have to send a technician
    out to your facility to perform testing. You may well have to have someone stay
    after hours to let the technician in and out of the building.


    **WARNING** A loopback test will completely disable your circuit! If your circuit
    is already down, then they can loopback all they want, but if you are merely suffering
    degraded performance, you may want to ask the ISP or telco to perform the test
    after hours. It’s all a question of what your environment requires.


    Once you know without a doubt that the problem is with the telco or the ISP, the
    only skill required to fix the issue is a willingness to make a nuisance of yourself
    at the ISP’s help desk.


    # If It’s Your Problem


    If the ISP can loop up the smartjack but not your router, it’s your problem. Congratulations!
    The good news is, as you have very few components in your section of the circuit,
    testing your equipment won’t take very long. The bad news is, many components
    you do have will require outside help.'
- md: " Check to make sure everything in your system is tightly attached. A loose\
    \ connection can cause no end of problems. \"Is it plugged in?\" is still a good\
    \ question in the comms closet.\n\nA common culprit in circuit failures is wiring.\
    \ Replace the wiring between the smartjack and your CSU/DSU. A T1 circuit uses\
    \ a standard Cat 5 cable, so many people plug in a cable that they had in a drawer\
    \ somewhere. A T1 is less forgiving than Ethernet, however. Try using a good premade\
    \ cable, with solid connectors on both ends.\n\nIf you've replaced all your wiring,\
    \ and everything is firmly seated, and reboots and resets have not solved your\
    \ problem, phone your CSU/DSU's technical support line. On a modern Cisco system,\
    \ this would be Cisco itself.\n\n> **NOTE** If your vendors start each blaming\
    \ the other, as is common among lower-level technical support staff, do not be\
    \ afraid to get them all on the phone at once and let them fight it out.\n\nNow\
    \ that you know how to troubleshoot your router, you can learn how to upgrade\
    \ it.\n\n## 6\n\n## IOS CHANGES\n\nCisco's Internetwork Operating System (IOS)\
    \ is the brains of any Cisco router; it provides the command line, interface device\
    \ drivers, routing software, and all the other bits that make a router do more\
    \ than draw power and generate heat. Cisco continuously maintains and updates\
    \ IOS, adding more features as they become useful and stable. If you want some\
    \ of Cisco's nifty new functionality, you'll probably find it in an IOS upgrade.\n\
    \nThe only reasons to upgrade are for security, stability, or required features.\
    \ While it might be cool to have the latest IOS, that is insufficient motivation\
    \ for staying up all night hoping that a \"bad upgrade recovery process\" works.\
    \ I advise you to find any technical justification you can to not perform an upgrade.\
    \ A successful upgrade only causes a few minutes of downtime, but a failed upgrade\
    \ can take the router out of action for several hours.\n\n> **NOTE** *SmartNet\
    \ and IOS Upgrades*\n> \n> *Do not attempt an IOS upgrade without a SmartNet support\
    \ agreement! An IOS upgrade gone bad may leave your router completely unusable\
    \ without advanced help. I've had upgrades where the router could not find its\
    \ own network interfaces, or wouldn't boot at all and was stuck in rommon (BIOS)\
    \ mode. Cisco has many different versions of IOS for each router, and installing\
    \ the wrong IOS can turn your expensive router into an expensive chunk of metal\
    \ and plastic that requires expert help to repair.*\n\nIf everything goes perfectly,\
    \ the upgrade process is quick and easy: get the new IOS file onto the router's\
    \ flash disk and reboot.\n\n## Cisco Security Notifications\n\nEvery so often,\
    \ some bright person discovers a security flaw in the Cisco IOS. Because the router\
    \ is the first point of exit onto a network, no security device on your network\
    \ can protect it, which means that when a security hole is discovered in IOS,\
    \ you may have to upgrade the router to keep intruders out.\n\nCisco announces\
    \ security issues through a customer mailing list and through security mailing\
    \ lists such as BugTraq.\n\nIf you're not already on a mailing list that gets\
    \ Cisco security announcements, you should sign up for Cisco's customer security\
    \ announcements list, cust-security-announce@cisco.com. Send an email containing\
    \ only the words \"subscribe cust-security-announce\" to majordomo@cisco.com.\
    \ You'll receive a reply giving you instructions on how to confirm your subscription.\n\
    \nRead all Cisco security alerts carefully. If you're not using the targeted functionality\
    \ mentioned in an alert, or if the problem doesn't affect your equipment, don't\
    \ worry about it. But if the alert affects you, schedule a maintenance window\
    \ to take the router down and upgrade the IOS.\n\n## Upgrade Preparations\n\n\
    Before upgrading, make sure that you have an FTP server available close to the\
    \ router. (The official Cisco documentation discusses using a TFTP server, but\
    \ an FTP server is far more secure and no more difficult to use than a TFTP server.)\
    \ You'll need a user account and password on that FTP server along with a few\
    \ megs of disk space. (If you don't have FTP server software, you'll find dozens\
    \ of free ones on sites like http://www.tucows.com and http://www.freshmeat.net.)\n\
    \nAn emergency Internet connection is also useful in case something goes wrong.\
    \ Although Cisco has extensive disaster recovery documentation on its website,\
    \ it will be largely useless if you don't have Internet access! By setting up\
    \ an account with a dial-up ISP for one of your workstations, you'll be able to\
    \ access this information easily. A number of ISPs allow their users a certain\
    \ number of dial-up hours free each month; I have a NetZero account set up at\
    \ the office for exactly this purpose.\n\nFinally, confirm that you have a Cisco\
    \ console cable and that it works. If the upgrade goes really, really badly, you\
    \ may have to console in to restore service.\n\n### IOS Versions\n\nOnce you have\
    \ these trivialities out of the way, you'll need a new IOS image to install. Cisco's\
    \ IOS is released in several parallel versions, each with a unique version number.\
    \ For example, \"12.0\" is an older release, \"12.1\" is a later version, \"13.0\"\
    \ is more recent still, and so on. You know the drill.\n\n- Each release is available\
    \ in a variety of patch levels, indicated in parenthesis after the main release\
    \ number, like 12.0(7). (This may not be the seventh release of version 12.0,\
    \ by the way; you'll also see further divisions, such as 12.0(5)a and 12.0(5)b.)\n\
    \n- Cisco adds capital letters to the end of the release name to indicate special\
    \ branches or versions of a particular IOS release, as in 12.0(7)XK. These letters\
    \ may change as features are shuffled from branch to branch. (It is possible—but\
    \ not easy—to track a particular set of features from version to version and release\
    \ to release.)\n\n## Choosing Your IOS Version\n\nBecause of the various ways\
    \ that IOS images are labeled, choosing the new IOS image to install on your router\
    \ is often the trickiest part of the upgrade. You'll want an IOS version that\
    \ contains all the necessary device drivers for your hardware, with support for\
    \ the features you require.\n\nThe simplest way to get the correct IOS version\
    \ is to open a Technical Assistance Request at Cisco's website. Run show tech\
    \ on your router, capture the output, and attach it to your request so that your\
    \ support tech will have everything he needs to make an informed decision. Cisco\
    \ usually responds to these requests within hours with a custom link to the exact\
    \ image you need.\n\nCisco also provides the Software Advisor Web tool, which\
    \ purports to guide you to the correct version of IOS for your exact hardware.\
    \ More than once, I've used this tool and found that the version I downloaded\
    \ won't work on my router; either the router refuses to boot with that IOS image,\
    \ or the new IOS won't recognize some of my router interfaces. Feel free to try\
    \ it, if you're into recovering damaged systems or if risking router failure under\
    \ load gives you a warm, fuzzy feeling.\n\nOne way or another, you'll get a file\
    \ containing the new IOS version. This file is called an *image*. Put your new\
    \ IOS image on your FTP server. Do not change the file's name.\n\n## Find the\
    \ Current IOS Image\n\nIf your shiny new IOS image doesn't work the way Cisco\
    \ promises, you'll want to be able to fall back to your current IOS version and\
    \ router configuration so you can at least restore service. The current version\
    \ is somewhere on your router's flash disk. As shown in Chapter 2, the image name\
    \ that the router booted with is shown in the show version output. Perhaps half\
    \ a dozen lines down in the show version output you'll see the System image file\
    \ entry.\n\n```\n...\nSystem image file is \"①flash:②c3640-is56i-mz-120-7-XK1\"\
    \n...\n```\n\nThe image file is stored on ① internal flash and is ② named c3640-is56i-mz-120-7-XK1.\
    \ This is the file you want to back up.\n\n> **NOTE** Routers have many potential\
    \ image storage locations, including internal flash, removable flash cards, or\
    \ other storage media. Having additional space to store images is nice, because\
    \ it allows you to easily recover from installing an unsuitable image.\n\n## Viewing\
    \ Disk Contents\n\nGo into enable mode and enter dir /all.\n\n```\nrouter# dir\
    \ /all\nDirectory of flash:/\n\n1 -rw- 9270984 <no date> c3640-is56i-mz-120-7-XK1.bin\n\
    2 -rw- 25 <no date> snmpengineid\n\n33554432 bytes total (24283292 bytes free)\n\
    ```\n\nThere's only one file on this router, our boot image. There isn't enough\
    \ room on this flash device to store another image—we have used more space with\
    \ the existing image than we have left free. While this particular router has\
    \ two slots for flash cards, neither slot has a card in it.\n\nIf you have a router\
    \ with PCMCIA slots for flash memory, I highly recommend that you purchase a Cisco-branded\
    \ flash card. Although they cost a few hundred dollars, it will make recovering\
    \ from a failed upgrade much, much easier. (Regular flash cards will almost certainly\
    \ not work with a Cisco router; don't even bother trying them.)\n\n## Copying\
    \ Files\n\nThe copy command duplicates an existing file elsewhere, just like its\
    \ DOS equivalent. The syntax is\n\n```\nrouter# copy <current location> <new location>\n\
    ```\n\nThe difficult part is knowing the syntax for the various locations you\
    \ might be copying from. Copying from one filesystem to another is perhaps the\
    \ easiest; all you need is the full path to each filename. For example, if we\
    \ have an IOS image on flash that we want to copy to a flash card in slot 0, we\
    \ would just use\n\n```\nrouter#copy flash:c3640-is56i-mz-120-7-XK1.bin slot0:c3640-is56i-mz-120-7-XK1.bin\n\
    ```"
  mdcn: "\n检查并确保系统中的所有部件都连接紧密。松动的连接会导致无穷无尽的问题。\"插好了吗？\"在通信机房里仍然是一个好问题。\n\n电路故障的常见罪魁祸首是线路。更换智能插孔（smartjack）与CSU/DSU之间的线路。T1电路使用标准Cat\
    \ 5电缆，因此很多人会随手插上从抽屉里翻出来的电缆。然而，T1比以太网更挑剔。尝试使用一根优质的预制电缆，两端都有牢固的连接器。\n\n如果你已经更换了所有线路，所有部件都已牢固就位，重启和重置都无法解决问题，那就拨打CSU/DSU的技术支持热线。在现代Cisco系统上，这就是Cisco本身。\n\
    \n> **注意** 如果你的供应商开始互相指责，这在低级别技术支持人员中很常见，不要害怕让他们同时通电话，让他们自己争论出个结果。\n\n现在你已经知道如何排除路由器故障，可以学习如何升级它了。\n\
    \n## 6\n\n## IOS 变更\n\nCisco的互联网操作系统（Internetwork Operating System，IOS）是任何Cisco路由器的大脑；它提供命令行、接口设备驱动程序、路由软件以及所有其他让路由器不仅仅是耗电和发热的部件。Cisco持续维护和更新IOS，随着功能变得有用和稳定而不断添加新特性。如果你想要Cisco的一些新功能，很可能需要通过IOS升级来获得。\n\
    \n升级的唯一理由是安全、稳定性或必需的功能。虽然拥有最新的IOS可能很酷，但这不足以成为熬夜 hoping \"坏升级恢复流程\" 能成功的动机。我建议你尽可能找到任何技术理由来不进行升级。成功的升级只会导致几分钟的停机时间，但失败的升级可能让路由器瘫痪数小时。\n\
    \n> **注意** *SmartNet 和 IOS 升级*\n> \n> *没有SmartNet支持协议，不要尝试IOS升级！IOS升级失败可能会让你的路由器完全无法使用，没有高级帮助就无法恢复。我遇到过升级后路由器找不到自己的网络接口，或者根本无法启动，卡在rommon（BIOS）模式的情况。Cisco为每台路由器提供许多不同版本的IOS，安装错误的IOS可能会把你昂贵的路由器变成一块昂贵的金属和塑料，需要专家帮助才能修复。*\n\
    \n如果一切顺利，升级过程快速而简单：将新的IOS文件放到路由器的闪存盘上，然后重启。\n\n## Cisco 安全通知\n\n每隔一段时间，总会有某个聪明的人发现Cisco\
    \ IOS中的安全漏洞。由于路由器是网络出口的第一道关口，网络上的任何安全设备都无法保护它，这意味着当IOS中发现安全漏洞时，你可能必须升级路由器以阻止入侵者。\n\
    \nCisco通过客户邮件列表和安全邮件列表（如BugTraq）公布安全问题。\n\n如果你还没有订阅接收Cisco安全公告的邮件列表，你应该注册Cisco的客户安全公告列表\
    \ cust-security-announce@cisco.com。发送一封仅包含\"subscribe cust-security-announce\"\
    的电子邮件到 majordomo@cisco.com。你会收到一封回复，告知如何确认你的订阅。\n\n仔细阅读所有Cisco安全警报。如果你没有使用警报中提到的目标功能，或者问题不影响你的设备，不用担心。但如果警报影响到你，请安排维护窗口将路由器停机并升级IOS。\n\
    \n## 升级准备工作\n\n升级前，确保你有一台靠近路由器的FTP服务器可用。（Cisco官方文档讨论使用TFTP服务器，但FTP服务器远比TFTP服务器安全，而且使用起来并不更困难。）你需要在该FTP服务器上有一个用户账户和密码，以及几兆的磁盘空间。（如果你没有FTP服务器软件，可以在\
    \ http://www.tucows.com 和 http://www.freshmeat.net 等网站上找到数十个免费软件。）\n\n紧急互联网连接也很有用，以防出现问题。虽然Cisco网站上有广泛的灾难恢复文档，但如果你没有互联网访问，这些文档基本上毫无用处！通过为其中一台工作站与拨号ISP建立账户，你将能够轻松访问这些信息。许多ISP允许用户每月免费使用一定数量的拨号小时；我在办公室就设置了一个NetZero账户，正是出于这个目的。\n\
    \n最后，确认你有一根Cisco控制台电缆并且它能正常工作。如果升级进行得非常、非常糟糕，你可能必须通过控制台接入来恢复服务。\n\n### IOS 版本\n\
    \n一旦这些琐事处理完毕，你需要一个新的IOS镜像来安装。Cisco的IOS以多个并行版本发布，每个版本都有唯一的版本号。例如，\"12.0\"是较旧的版本，\"\
    12.1\"是较新的版本，\"13.0\"更新，依此类推。你懂的。\n\n- 每个版本都有多种补丁级别，在主要版本号后用括号表示，如12.0(7)。（顺便说一下，这可能不是12.0版本的第七个发布；你还会看到进一步的细分，如12.0(5)a和12.0(5)b。）\n\
    \n- Cisco在版本名称末尾添加大写字母，表示特定IOS版本的特殊分支或版本，如12.0(7)XK。随着功能在不同分支之间调整，这些字母可能会变化。（跟踪一组特定功能从版本到版本、从发布到发布是可能的——但并不容易。）\n\
    \n## 选择你的 IOS 版本\n\n由于IOS镜像标签的各种方式，选择要在路由器上安装的新IOS镜像通常是升级中最棘手的部分。你需要一个包含所有必要硬件设备驱动程序的IOS版本，并支持你所需的功能。\n\
    \n获取正确IOS版本的最简单方法是在Cisco网站上提交技术支持请求（Technical Assistance Request）。在你的路由器上运行 show\
    \ tech，捕获输出，并将其附加到你的请求中，这样你的技术支持人员就有他做出明智决定所需的一切信息。Cisco通常会在几小时内回复这些请求，并提供指向你所需确切镜像的定制链接。\n\
    \nCisco还提供Software Advisor Web工具，声称能指导你找到适合确切硬件的IOS正确版本。不止一次，我使用这个工具后发现下载的版本在我的路由器上无法工作；要么路由器拒绝用该IOS镜像启动，要么新IOS无法识别我的一些路由器接口。如果你热衷于恢复损坏的系统，或者冒着路由器在负载下故障的风险能让你感到温暖、舒适，请随意尝试。\n\
    \n无论如何，你会得到一个包含新IOS版本的文件。这个文件称为*镜像*。将你的新IOS镜像放到FTP服务器上。不要更改文件名。\n\n## 查找当前 IOS\
    \ 镜像\n\n如果你闪亮的新IOS镜像不像Cisco承诺的那样工作，你需要能够回退到当前的IOS版本和路由器配置，以便至少恢复服务。当前版本位于路由器闪存盘的某个位置。如第2章所示，路由器启动时使用的镜像名称显示在\
    \ show version 输出中。在 show version 输出中大约半打行之后，你会看到 System image file 条目。\n\n```\n\
    ...\nSystem image file is \"①flash:②c3640-is56i-mz-120-7-XK1\"\n...\n```\n\n镜像文件存储在①内部闪存上，②名为\
    \ c3640-is56i-mz-120-7-XK1。这就是你要备份的文件。\n\n> **注意** 路由器有许多潜在的镜像存储位置，包括内部闪存、可移动闪存卡或其他存储介质。拥有额外的镜像存储空间很好，因为它能让你轻松从安装不合适的镜像中恢复。\n\
    \n## 查看磁盘内容\n\n进入特权模式并输入 dir /all。\n\n```\nrouter# dir /all\nDirectory of flash:/\n\
    \n1 -rw- 9270984 <no date> c3640-is56i-mz-120-7-XK1.bin\n2 -rw- 25 <no date> snmpengineid\n\
    \n33554432 bytes total (24283292 bytes free)\n```\n\n这台路由器上只有一个文件，就是我们的启动镜像。这个闪存设备上没有足够的空间存储另一个镜像——我们已使用的空间比剩余的空闲空间还多。虽然这台特定路由器有两个闪存卡插槽，但两个插槽都没有卡。\n\
    \n如果你的路由器有用于闪存的PCMCIA插槽，我强烈建议你购买一张Cisco品牌的闪存卡。虽然它们要花费几百美元，但它会让从失败升级中恢复变得容易得多、得多。（普通闪存卡几乎肯定无法在Cisco路由器上工作；甚至不要尝试。）\n\
    \n## 复制文件\n\ncopy 命令复制现有文件到别处，就像它的DOS等价命令一样。语法是\n\n```\nrouter# copy <当前位置> <新位置>\n\
    ```\n\n困难的部分是了解你可能从中复制的各种位置的语法。从一个文件系统复制到另一个文件系统可能是最简单的；你只需要每个文件的完整路径。例如，如果我们有一个在闪存上的IOS镜像想要复制到插槽0中的闪存卡，我们只需使用\n\
    \n```\nrouter#copy flash:c3640-is56i-mz-120-7-XK1.bin slot0:c3640-is56i-mz-120-7-XK1.bin\n\
    ```\n"
