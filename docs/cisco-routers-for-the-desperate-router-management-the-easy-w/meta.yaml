    \ 18 | 0 | 0/0 | - |\n| 131 | VTY | | - | - | - | - | - | 6 | 0 | 0/0 | - |\n\
    | 132 | VTY | | - | - | - | - | - | 3 | 0 | 0/0 | - |\n| 133 | VTY | | - | - |\
    \ - | - | - | 2 | 0 | 0/0 | - |\n| 134 | VTY | | - | - | - | - | - | 0 | 0 | 0/0\
    \ | - |\n\n这里，我们看到这台特定的路由器有一个控制台端口、一个辅助端口和五个编号从130到134的虚拟终端。虽然大多数其他信息通常没什么用，但有时看看某个特定终端被访问了多少次也不错。\n\
    \n虽然你可以对这些端口进行各种配置，但最重要的功能是与密码和访问方法相关的那些。让我们看一个示例配置，看看能学到什么。\n\n```\nline con\
