- img_proc: true
  md: '# # 8


    # ## LOGINS, AUTHENTICATION, AND REMOTE ACCESS


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_114_0.png)


    Restricting access to your router''s configuration and controls is an important
    part of network management. While it''s important to get the router up and running,
    you don''t want just anyone to be able to access your equipment and reconfigure
    it! It''s important to understand how your router can be accessed, how to set
    passwords and create individual usernames, and how to offer and control access
    over the network via telnet or SSH.'
  merge: -1
  pgno: 114
- img_proc: true
  md: "# # Lines\n\nNear the end of your router’s configuration, you’ll see entries\
    \ like line vty 0 4 and line con 0. These lines are the available methods of getting\
    \ a command line prompt on your router, and each can be configured separately.\
    \ A standard Cisco device has three types of line: con, aux, and vty.\n\nThe *con*\
    \ (or console) port is what we’ve been using to connect to the system. While it’s\
    \ entirely possible to reconfigure this port, it’s generally a bad idea. You can\
    \ set the console to require a password to log in, for example, or you might have\
    \ it run at a higher speed for better interactive response. If you need a physical\
    \ console port with nonstandard behavior, use the *aux* (or auxiliary) port. That’s\
    \ what it’s there for.\n\nThe *vty* lines, or virtual terminals, are logical lines\
    \ used for access over the network. Telnet and SSH connections into the router\
    \ are directed to a virtual terminal. These lines have no physical hardware; they\
    \ are strictly a software interface. (That’s why they’re called “virtual.”) These\
    \ lines may cause the most concern and require the most attention; while a locked\
    \ door can control access to the con and aux ports, the whole point of remote\
    \ network access is that you can access your router from anywhere.\n\nEach router\
    \ supports a different number of lines. The easy way to identify the lines is\
    \ with the `show line` command.\n\n```\nrouter#show line\n   Tty  Typ     Tx/Rx\
    \    A Modem  Roty AccO AccI  Uses  Noise  Overruns    Int\n     0  CTY      \
    \          -    -      -    -    -      0      0        0/0      -\n   129  AUX\
    \   9600/9600    -    -      -    -    -      0      0        0/0      -\n*  130\
    \  VTY                -    -      -    -    -     18      0        0/0      -\n\
    \   131  VTY                -    -      -    -    -      6      0        0/0 \
    \     -\n   132  VTY                -    -      -    -    -      3      0    \
    \    0/0      -\n   133  VTY                -    -      -    -    -      2   \
    \   0        0/0      -\n   134  VTY                -    -      -    -    -  \
    \    0      0        0/0      -\n```\n\nHere, we see that this particular router\
    \ has a single ❶ console, a single ❷ aux port, and five virtual terminals numbered\
    \ ❸ 130 through ❺ 134. While most of the rest of the information is not normally\
    \ useful, sometimes it’s nice to see ❹ how many times a particular terminal has\
    \ been accessed.\n\nWhile you can do all sorts of configuration on these ports,\
    \ the most important features are those related to passwords and access methods.\
    \ Let’s look at a sample configuration and see what we can learn."
  merge: -1
  pgno: 115
- img_proc: true
  md: "```\nline con 0\n password 7 02310042864A2C295D43D1\nline aux 0\n password\
    \ 7 02310042864A2C295D43D1\nline vty 0 4\n login local\n transport input telnet\
    \ ssh\n```\n\nThe first entry is the console port. Like all real computer devices,\
    \ Cisco numbers ports beginning with zero. This console port has a password on\
    \ it; even if you hook up a serial cable and fire up HyperTerminal, you'll have\
    \ to enter a password. This may be necessary if your router is physically insecure,\
    \ such as in a shared colocation center. (It may also be necessary if your company\
    \ has staff that like to wander into places they aren't supposed to.) If your\
    \ router is correctly configured, the actual password is stored in encrypted form.\n\
    \nThe aux port is also numbered 0 and has a password. While the password for both\
    \ the console and aux ports are encrypted, you can see that they are identical.\n\
    \nLast, we have the virtual terminals. This system has five configured virtual\
    \ terminals, numbered 0 through 4. The login local keyword means that this router\
    \ has a list of usernames and passwords stored on the local machine, and that\
    \ whenever a login request arrives over the network, the router should use this\
    \ list. The transport line indicates what methods can be used to access the virtual\
    \ terminals; in this case, acceptable inputs are telnet and SSH.\n\nUnconfigured\
    \ virtual terminals cannot be used; if we configured only virtual ports 0 and\
    \ 1, the router would only support two simultaneous remote login sessions. While\
    \ this might not seem like a problem, at times it's nice to have multiple router\
    \ command prompts open simultaneously so that you can, say, keep watching your\
    \ BGP sessions in one window and make changes in another. I've found myself at\
    \ times with all four virtual terminals open on my single desktop when I'm trying\
    \ to debug a particularly annoying problem.\n\nHow can you set all this up? Well,\
    \ let's find out.\n\n# Passwords\n\nA password is the simplest authentication\
    \ method a Cisco router can use, but it's effective enough for most networks.\
    \ If you have dozens of routers, you may want to consider a solution such as"
  merge: -1
  pgno: 116
- img_proc: true
  md: 'RAIDUS or TACACS+, but that really is overkill for most environments. By default,
    routers do not require passwords, but also by default, you cannot access the router
    over the network, so in order to get a command prompt on the router, you would
    need to have physical access. Cisco assumes that if you know enough to enable
    network access, you will be able to set up basic passwords.


    Before implementing passwords on your router, make certain that the password encryption
    service is activated. By default, routers store passwords in their configuration
    in *unencrypted* format. This means that anyone who can view the router’s configuration
    can see the router’s passwords! While it’s true that you already have to have
    privileged mode access to view a running router’s configuration, that doesn’t
    protect backup copies of your configuration stored elsewhere. It also makes it
    almost impossible for someone who happens to be looking over your shoulder to
    *not* view the password, even if they want to be honest. To enable the password
    encryption service, just add


    ```

    service password-encryption

    ```


    to your configuration.


    Now that nobody can get your passwords trivially, it’s worth continuing. Standard
    Cisco devices offer three standard passwords: the *front door*, *enable*, and
    *enable secret*. The front door password protects unprivileged EXEC mode access
    to the router. This means that you can look but not touch, as discussed earlier.
    Setting a front door password for a line is very simple. Here, we’re setting a
    front door password on our aux port.


    ```

    router# conf t❶

    router(config)# line aux 0❷

    router(config-line)# login❸

    router(config-line)# password *YourPassword*❹

    router(config-line)# ^Z

    ```


    Start by ❶ entering configure mode, and then tell the router that you want to
    ❷ configure the line aux 0. Remember, your router configuration will tell you
    exactly what the line is called; if nothing else, you’ll see a single line near
    the end of the configuration that says only `line aux 0`. You need to tell the
    router to ❸ use password checking on this port with the login option. Finally,
    enter the command `password` and ❹ your chosen password. Unlike more modern operating
    systems that provide'
  merge: -1
  pgno: 117
- img_proc: true
  md: "you with shaded dialog boxes that hide your password as you change it, your\
    \ password will actually appear on the command line here. Be certain that nobody’s\
    \ looking over your shoulder when you set or change the password!\n\nAfter you’ve\
    \ set a password, you’ll see an entry for it in the router configuration.\n\n\
    ```\nline aux 0\n password 7 053C02162C006D01080856\n login\n```\n\nThis looks\
    \ an awful lot like what you typed, but 2 the password has been hashed. Another\
    \ thing to note is the 1 7 between the word password and the password string.\
    \ The 7 tells the router that the password has been hashed, and that the string\
    \ 053C02162C006D01080856 isn’t the actual password.\n\nOne thing to remember is\
    \ that these front door passwords are configured on a line-by-line basis. You\
    \ can have one password for your console port, another for the aux port, and yet\
    \ another for your virtual terminals. Setting different passwords on different\
    \ ports is a wonderful way to confuse yourself.\n\nThe *enable* password protects\
    \ access to privileged EXEC mode. The old method of Cisco access control was to\
    \ give lower-level support techs the front door password but restrict the enable\
    \ mode to higher-level techs. Unfortunately, Cisco created its own encryption\
    \ algorithm to keep the password secure. This algorithm is badly flawed. You should\
    \ not have an enable password on your Cisco devices, because anyone who gets your\
    \ configuration can trivially reverse engineer the enable password from the scrambled\
    \ hash.1 To fix this, Cisco introduced a second privileged EXEC protection, the\
    \ *enable secret*, and protected it with the cryptographically sound MD5 hash.\
    \ Setting an enable secret, and disabling the enable password, is much like setting\
    \ a front door password. Unlike the front door passwords, which can be different\
    \ for each line, the enable passwords work globally.\n\n```\nrouter# 1 conf t\n\
    router(config)# 2 enable secret YourSecretPassword\nrouter(config)# 3 no enable\
    \ password\n```\n\n> 1 This happens more frequently than you might think. Whenever\
    \ a vendor says that it has invented its own proprietary, highly secure encryption\
    \ techniques, run. Run quickly. While the security of “open code” versus “closed\
    \ code” may be debatable, the security of “open crypto” versus “closed crypto”\
    \ most certainly is not."
