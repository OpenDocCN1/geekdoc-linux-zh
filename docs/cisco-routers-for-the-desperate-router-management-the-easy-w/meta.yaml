    tracking）、延迟（delay）和认证（authentication）。


    ### 抢占 (Preemption)


    抢占是指某个特定接口声明自己负责该备用 IP 地址，并强制所有其他接口放弃对该地址的所有权。这意味着一台特定的路由器默认支持 HSRP，而让所有其他路由器仅作为备份。这是通过为每个支持备用
    IP 的接口分配优先级，并让优先级最高的路由器来主张所有权来实现的。默认情况下，备用组中的每台路由器优先级均为 100。要设置优先级，请在配置中使用 `priority`
    关键字。


    ```

    router(config)# int faste0/0

    router(config-if)# standby 1 preempt

    router(config-if)# standby 1 priority 105

    ```


    首先允许该路由器向优先级较低的路由器要求承载备用 IP。如果你使用了抢占功能，备用组中的所有路由器都应包含此条目。然后将该特定路由器的优先级设置为 105。


    ### 接口跟踪 (Interface Tracking)


    指定一台路由器作为备用组的主设备会很方便，哪怕仅仅是为了让你知道谁在负责。（网络管理员作为一个群体，通常不习惯于说“流量进入我们路由器附近的一个云端，然后发生了神奇的事情”。他们更倾向于像这样陈述：“只要
