  md: '# ABSOLUTE™ BSD


    # The Ultimate Guide to FreeBSD


    *by* MICHAEL W. LUCAS


    The definitive guide to using BSD, from installation to network services. Includes
    coverage of installation, networking, add-on software, security, network services,
    system performance, kernel tweaking, file systems, SCSI and RAID configurations,
    SMP, upgrading, monitoring, crash debugging, BSD in the office, and emulating
    other OSes. Author Michael W. Lucas is one of only about 200 FreeBSD committers,
    people who can make changes to the FreeBSD operating system itself.


    JULY 2002, 612 PP., $39.95, ($61.95 CAN)


    ISBN 1-886411-74-3


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_143_0.png)


    # ABSOLUTE™ OPENBSD


    # UNIX for the Practical Paranoid


    *by* MICHAEL W. LUCAS


    This straightforward, practical, and complete guide to mastering the powerful
    and complex OpenBSD operating system is for the experienced UNIX user who wants
    to add OpenBSD to his or her repertoire. The author assumes knowledge of basic
    UNIX commands, design, and permissions. The book takes you through the intricacies
    of the platform and teaches how to manage your system, offering friendly explanations,
    background information, troubleshooting suggestions, and copious examples throughout.


    JULY 2003, 528 PP., $39.95 ($59.95 CAN)


    ISBN 1-886411-99-9


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_143_1.png)


    # HACKING


    # The Art of Exploitation


    *by* JON ERICKSON


    A comprehensive introduction to the exploitation techniques and creative problem-solving
    methods known as "hacking." Explains technical aspects of hacking such as stack
    based overflows, heap based overflows, string exploits, return-into-libc, shellcode,
    and cryptographic attacks on 802.11b.


    > "The seminal hackers handbook." — SecurityForums.com


    NOVEMBER 2003, 264 PP., $39.95 ($59.95 CAN)


    ISBN 1-59327-007-0


    ![](img/fc7e1b7be1ffcc2dbde34ce0d154ae85_143_2.png)'
