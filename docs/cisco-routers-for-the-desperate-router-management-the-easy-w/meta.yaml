  - '[PAGE 17]


    page. The problem, of course, is finding those “well-chosen search terms.” Usually,
    the word “Cisco” and a snippet of the technology or error message will suffice
    to provide an answer. Be sure to check both the “groups” and “web” search functions,
    because Google indexes the entire history of Usenet (including even the early
    days of Cisco).


    If you’re a Usenet (aka “Internet News”) user, check the newsgroup comp.dcom.sys.cisco.
    While this group hasn’t had a FAQ update in several years, it’s still actively
    used and is an excellent place to get pointers to further information on almost
    any Cisco-related topic.


    By far, the most authoritative information on your router is available on the
    Cisco website, http://www.cisco.com. Documentation for all router models, modules,
    and other hardware appears there along with tutorials for configuring features
    specific to each model or module.


    Although all of the above-mentioned items are free, I cannot recommend a Cisco
    SmartNet contract strongly enough. The cost is small compared to the cost of the
    router, and having a contract ensures that a Cisco engineer will immediately be
    available to you whenever a critical problem occurs. If you have to resolve a
    router problem on your own, you may find yourself struggling for hours or days.
    But if you have a contract, your service might well be restored within minutes
    of a simple phone call. The cost of downtime when you’re struggling with a problem
    on your own almost certainly far exceeds the cost of the SmartNet contract.


    Additionally, Cisco tends to very quickly respond to low-priority Technical Assistance
    Requests that SmartNet customers can enter on its website. I’ve come to expect
    answers within an hour on even trivial questions, and have never waited more than
    a day. While Cisco does not guarantee this level of service, rapid response is
    very routine for them. You can spend far longer than that hunting for answers
    on the Internet.


    # Unpacking the Router


    If you’re lucky, your first introduction to Cisco routers will be a brown box
    arriving on your loading dock. This means that you’ll learn how to configure the
    router by actually installing it, which is much easier than having to thoroughly
    understand a working setup. If you aren’t this lucky, just pretend that your server
    room is a really *big* brown box and follow along. You may have to'
  - '[PAGE 18]


    search the office for the where your predecessor stashed some of the router accessories,
    but at least you’ll know what you’re looking for!


    While the most interesting part is probably the router itself, be sure to find
    the console cable and adapter as well as the manuals and CD-ROMs. In a modern
    Cisco router, the console cable is usually a flat blue cable with an RJ-45 connector
    on each end and an RJ-45–to–DB-9 adapter to let you attach to the serial port
    on your computer. Hang on to this cable, because you will need it later. (Because
    Cisco console cables tend to wander off if left unguarded, I keep a spare locked
    in my workshop in a fireproof safe labeled “Caution: Live Plague Virus.”)


    The manuals are generally available on Cisco’s website if you have a SmartNet
    contract, but a paper copy is nicer to read while sprawled on the couch. Many
    modern Cisco routers are *modular*; the router chassis has several slots where
    cards containing connectors for different types of networks can be plugged in.
    Each card or component has its own manual. While we will cover basic configuration
    of the most common network interfaces, you should definitely check the manual
    for any special requirements for your modules.


    Lastly, the CD-ROMs contain router software, additional documentation, and add-on
    tools that can help you manage your router. Keep this software, it can help greatly
    in disaster-recovery situations.


    Break out the router chassis manual and look at the router itself. Things you
    should look for include the console port, the aux port, and the network interfaces.
    Let’s start with the console port.


    > WARNING: *Do not power your new router on yet!*


    # ### Console Setup


    Your Cisco router has a port resembling a standard Ethernet RJ-45 port, labeled
    “console.” You received a console cable with your router; plug one end into your
    router and attach the serial port to a 9-pin serial port on a computer.


    Now you need serial port client software on your computer. We’ll assume that you’re
    using HyperTerminal for Windows to connect to the router. HyperTerminal is available
    on all versions of Windows. If you’re using another operating system, it must
    have a serial port program available. Free Unix-like operating systems usually
    include “tip” or “cu,” and “kermit” and “minicom” are also available for many
    different operating systems.'
  - '[PAGE 19]


    I frequently use a serial cable and a VT100 terminal emulator to console into
    a router from my handheld. (Handheld devices are an excellent choice of console
    client in crowded server rooms where the narrow space between racks make managing
    a laptop difficult.) Specifics of configuring these programs vary, but the settings
    we use here will work for any of them.


    In modern Windows versions, HyperTerminal may not be installed by default. If
    you look under Start > Programs > Accessories > Communications and don''t see
    HyperTerminal, it''s not yet installed on your system. Go to the Add/Remove Programs
    control panel and select "Windows Components." HyperTerminal is part of the "Communications"
    feature set.


    Once you have your serial client software installed, set up a new connection to
    your serial port. Use the following settings:


    +   - **9600 baud**

    - **No parity**

    - **8 data bits**

    - **1 stop bit**

    - **No flow control**


    Click the "connect" icon. Because your router has no power yet, you shouldn''t
    see anything happen.


    # **Other Router Ports**


    The aux port looks just like the console port, and you can even plug in your console
    cable and get a command line on your serial client. The router doesn''t display
    its bootup messages on the aux port, however. For the most part, the aux port
    is there only in case something goes wrong. If you misconfigure your console port
    and find yourself locked out of the system, you can log in via the aux port and
    fix the router''s configuration. In the event that you really botch an upgrade,
    you can set your aux port to use a high-speed connection and upload a new software
    image to the router over it. You might connect a modem to your console port for
    remote work, and use the aux port for local work.


    Network interfaces look different from router to router, but for the most part
    they have a connector appropriate to the type of network they connect to. Ethernet
    interfaces usually have either a standard Cat 5 or fiber connection, while T1
    interfaces look like Cat 5 connectors. Larger circuits, such as DS3s and'
  - '[PAGE 20]


    OC3s, have coaxial connections. Look at your router and identify the type of network
    interfaces it supports; you''ll need to know that later.


    # Power-On


    With your serial connection in the console port, plug in the router and in a few
    seconds you''ll see some activity.


    ```

    System Bootstrap, Version 12.2(1r)1 [dchih 1r], RELEASE SOFTWARE (fc1)

    Copyright (c) 2001 by cisco Systems, Inc.

    C7200 platform with 131072 Kbytes of main memory ②


    Self decompressing the image : ############################ ③

    …

    ```


    You''ll see a variety of facts about the equipment, such as the ① boot loader
    version and the ② hardware platform. The system then starts ③ loading the operating
    system and heads for the main boot sequence. We''ll see how to interpret most
    of the output it gives later in this book. Let it keep going until it wants to
    talk to you. If this is the first boot, it will offer to let you configure it:


    ```

    Would you like to enter the initial configuration dialog? [yes/no]:

    ```


    The configuration dialog is designed to get a bare minimum system up on the network,
    allowing you to use a configuration tool such as CiscoWorks to complete the setup.
    For reasons we''ll discuss shortly, I encourage you to perform all the configuration
    at the command line instead of via one of these tools. (Once you''ve read this
    book and understand the implications of your choices, you might want to use the
    configuration dialog to perform basic setup.) For that reason, I recommend that
    you skip the configuration dialog. This will drop you to a router prompt.


    ```

    Router>

    ```


    Congratulations! You''re now actually logged in to the router. Now, let''s see
    what you can do with it.'
- md: "## 1 BEFRIENDING THE COMMAND LINE\n\nThis book focuses entirely on the command\
    \ line. Why? Some Cisco routers include a web interface; others don't. Cisco sells\
    \ advanced router management packages, but they require a complicated client environment\
    \ that you might not have available when you really need it. You might only need\
    \ to log in to the router once a year or less; what are the chances that your\
    \ desktop system with all the fancy management tools has undergone some drastic\
    \ surgery in the meantime, and the router tools no longer work the way you expect?\
    \ Personally, I dislike trying to solve Windows problems when the router is down.\
    \ The one environment available on every Cisco router is the command line.\n\n\
    The command line gives you absolute control over every aspect of your router's\
    \ behavior. Some configuration changes can only be realistically made at the command\
    \ line. If your router loses its configuration, you'll need to use the command\
    \ line to restore enough of its mind that your fancy tools can talk to it. So,\
    \ if you must use the command line in those desperate circumstances, it's best\
    \ that you learn enough to be comfortable there.\n\n### EXEC versus Privileged\
    \ EXEC Mode\n\nBy default, when you first log in to a Cisco router you are in\
    \ *EXEC mode*. You can execute basic diagnostic commands and look at things, but\
    \ you cannot actually change configuration settings or view sensitive information.\
    \ For example, in EXEC mode, you can see if an interface is receiving errors,\
    \ and you can ping across a circuit to see if it is working, but you cannot reset\
    \ the interface. In EXEC mode, the command prompt ends in a \"greater than\" sign.\n\
    \n```\nRouter>\n```\n\nTo change anything, you must be in *privileged EXEC mode*,\
    \ which is a superuser or administrator security level protected by a unique password.\
    \ Privileged EXEC mode is sometimes called \"enable mode.\" In enable mode, you\
    \ can configure the router in any way desired, reboot the router, or take any\
    \ other action possible in the software.\n\nTo enter privileged EXEC mode, use\
    \ the enable command. When you actually have a password set to access enable mode,\
    \ the router will prompt for it when you try to enable. See the \"Passwords\"\
    \ section in Chapter 8.\n\n```\nRouter>**enable**\nRouter#\n```\n\nIn enable mode,\
    \ the command prompt ends in a pound sign.\n\nThe old method of Cisco access control\
    \ was to give the standard EXEC password to all the technicians but restrict the\
    \ enable password to the senior techs. Setting up discrete usernames is a better\
    \ way to achieve a similar effect, but many older routers still only use unprivileged\
    \ and enable passwords—either because they haven't been updated, or because that's\
    \ all that they can support. There's nothing wrong with restricting the use of\
    \ privileged mode in this way, especially in a small shop where only one or two\
    \ people connect to the equipment, but if you have more people you’ll probably\
    \ want to set up separate usernames and allow individuals to be privileged or\
    \ not. We’ll see how to do this in Chapter 8.\n\n### Integrated Help\n\n“Help”\
    \ might be too strong a word, but routers give hints on commands, command syntax,\
    \ and the features available in the router. Different versions of the Cisco IOS\
    \ have different features, and it’s not easy to identify them all. The simplest\
    \ way to see what commands are available is to ask the router. Once you’ve logged\
    \ in, enter a single question mark at the command prompt.\n\n```\nrouter#?\nExec\
    \ commands:\n  <1-99>              Session number to resume\n  clear         \
    \      Reset functions\n  clock               Manage the system clock\n  ...\n\
    ```\n\nMy test router has four full screens of commands available from a single\
    \ question mark. Many of these commands are completely irrelevant for a router\
    \ that is providing basic Internet capability; such activities require only a\
    \ very small subset of Cisco’s features. Still, this can be a helpful reminder\
    \ when you can’t quite remember the name of a particular command.\n\nYou can request\
    \ hints about individual commands. Many actions require one or more words to complete,\
    \ and Cisco’s integrated help system will provide helpful reminders about syntax\
    \ or required information upon request. For example, the show command is used\
    \ to view system information. If you want to know what arguments a show command\
    \ can take, ask the router by entering show ?.\n\n```\nrouter#show ?\n  access-expression\
    \    List access expression\n  access-lists         List access lists\n  accounting\
    \            Accounting data for active sessions\n  adjacency            Adjacent\
    \ nodes\n  ...\n```\n\nOn some versions of the IOS, this output can go on for\
    \ screens and screens. If you know the first part of a command’s name, even just\
    \ the first letter, you can narrow it down by giving what you remember of the\
    \ command and a question mark.\n\n```\nrouter#show a?\naccess-expression  access-lists\
    \  accounting  adjacency  aliases\nalps               arp           async\nrouter#show\
    \ a\n```\n\nNote that on your next command-line prompt, the router automatically\
    \ prints the chunk of command that you gave before the question mark. The system\
    \ knows that you want to type something that begins with show a, and is trying\
    \ to make it easier for you.\n\nOne thing to remember is that hints on a particular\
    \ command are only available in the mode in which the command is available. For\
    \ example, the commands beginning with ip, such as ip route, are only available\
    \ in enable mode. Entering ip ? in standard EXEC mode will generate an \"unrecognized\
    \ command\" error.\n\n### Command Abbreviation\n\nOne interesting feature of the\
    \ Cisco IOS is that it allows the user to abbreviate command names to the shortest\
    \ unique abbreviation for a word. For example, one common command we'll use again\
    \ and again to view settings is show. If you ask your router for all the commands\
    \ beginning with the letter s, you'll get a whole list.\n\n```\nrouter#s?\n*s=show\
    \  sdlc  send       set    setup\nshow     slip  start-chat  systat\nrouter#\n\
    ```\n\nNote that only the command show begins with the letters sh. You can use\
    \ the letters sh as an abbreviation for the full word show; the router is smart\
    \ enough to know that you couldn't possibly be typing any other legitimate command\
    \ that begins with those letters. In this particular case, the letter s is also\
    \ specially marked to indicate that it is an abbreviation for show; apparently\
    \ Cisco thought that show was so commonly used that it made sense to abbreviate\
    \ it further.\n\nIn this book, we will give commands in the text by their full\
    \ forms. Example commands may be in abbreviated form if they are commonly used\
    \ that way.\n\n## 2 ROUTER CONFIGURATION\n\nNow that you're logged in, let's set\
    \ up the router. The `show version` command explains some basic facts about your\
    \ router, such as the software version, hardware type, and supported interfaces.\
    \ Because the output is quite long, I won't include it all here, but we'll look\
    \ at a few important snippets.\n\n```\nrouter#show version\nCisco Internetwork\
    \ Operating System Software\nIOS (tm) 3600 Software (C3640-IS56I-M), Version 12.0(7)XK1,\n\
    EARLY DEPLOYMENT RELEASE SOFTWARE (fc1)\n...\n```\n\nThe second line gives you\
    \ the hardware platform this IOS is meant for and its version number. If you have\
    \ to contact Cisco, you will need to provide the version number. Next are details\
    \ about who built this software and when, the ROM version, and so on. While Cisco\
    \ would certainly want to see all of this information if you called for support,\
    \ you can't do much with it by yourself.\n\n```\n...\nrouter uptime is 4 weeks,\
    \ 4 days, 9 hours, 53 minutes\nSystem returned to ROM by reload\nSystem image\
