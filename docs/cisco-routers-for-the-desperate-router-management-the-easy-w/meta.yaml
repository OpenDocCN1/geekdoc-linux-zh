- img_proc: true
  md: '**NOTE** Small packets appear more quickly than large packets, and the largest
    packets in the ping sweep test may make you think that the router has stopped
    responding. Note which sorts of packets the router has trouble with.


    For circuits that are behaving poorly or exhibiting “weird” behavior, I suggest
    running the extended ping test three times: once with the default data pattern,
    once with an all-zero data pattern, and once with all ones. If your circuit has
    trouble with certain sorts of packets, this process will probably uncover it.
    If not, your circuit is probably running cleanly.


    # Phoning the ISP


    So you’ve opted to gather all your debugging information before calling. You know
    which sorts of errors are appearing on your circuit, and what sort of packets
    your circuit will and will not pass. Now what?


    You got your T1 circuit from either a telco or an ISP. Phone them. The first words
    out of your mouth should be, “I have a down circuit.” When you reach a technical
    support person, explain:


    +   - The state of the line itself (both line and protocol down, or just protocol
    down, or both line and protocol up)

    - That you have rebooted your router and CSU/DSU (this will almost certainly be
    their first suggestion)

    - The types of errors you are seeing: CRC, framing, overruns, aborts, and so on

    - The results of any ping tests you have run


    The technician should check the ISP’s end of the circuit and phone the telco who
    originally provisioned the line. Most telephone companies will return a call to
    the circuit owner (usually the ISP) within an hour with an initial status report.


    **NOTE** While your ISP should handle circuit issues, especially when they own
    the circuit, if the problem is actually a failed circuit, it may take hours to
    repair.


    # Circuit Loopback Tests


    T1 circuits include all sorts of intelligent equipment such as repeaters, switches,
    and smartjacks. The telco can talk to this equipment using a series of successive
    loopback tests to quickly identify where a problem lies and what piece of equipment
    is at fault.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'The telco has a diagram listing every piece of equipment along a circuit. A
    loopback test is where they attempt to communicate with each piece of equipment
    in succession. For example, the telco central office will try to “loop up” the
    first piece of equipment outside their office—say, the repeater in the little
    gray box up the street. If they can easily communicate with that device, and if
    that device can return data it receives to the central office, they will loop
    up the second closest device and test it. When something fails to respond, they
    send a technician out to examine and repair that device.


    Eventually, the telco will work their way down to looping up the smartjack at
    your demarc. If the telco can communicate correctly with the smartjack, they will
    probably try to loop up your CSU/DSU. The telco/ISP’s responsibility technically
    ends at the smartjack, but they will frequently try to go the extra step simply
    to demonstrate that it isn’t their problem. (This tactic should be painfully familiar
    to anyone who has worked a help desk!) If the telco says that they can cleanly
    loop up the smartjack, but cannot loop up the CSU/DSU, the problem lies somewhere
    between the CSU/DSU and the smartjack and is unquestionably your problem.


    This sort of exhaustive test takes time, especially on a long circuit, but it
    is the quickest way to identify a problem. The telco may have to send a technician
    out to your facility to perform testing. You may well have to have someone stay
    after hours to let the technician in and out of the building.


    **WARNING** A loopback test will completely disable your circuit! If your circuit
    is already down, then they can loopback all they want, but if you are merely suffering
    degraded performance, you may want to ask the ISP or telco to perform the test
    after hours. It’s all a question of what your environment requires.


    Once you know without a doubt that the problem is with the telco or the ISP, the
    only skill required to fix the issue is a willingness to make a nuisance of yourself
    at the ISP’s help desk.


    # If It’s Your Problem


    If the ISP can loop up the smartjack but not your router, it’s your problem. Congratulations!
    The good news is, as you have very few components in your section of the circuit,
    testing your equipment won’t take very long. The bad news is, many components
    you do have will require outside help.'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'Check to make sure everything in your system is tightly attached. A loose connection
    can cause no end of problems. “Is it plugged in?” is still a good question in
    the comms closet.


    A common culprit in circuit failures is wiring. Replace the wiring between the
    smartjack and your CSU/DSU. A T1 circuit uses a standard Cat 5 cable, so many
    people plug in a cable that they had in a drawer somewhere. A T1 is less forgiving
    than Ethernet, however. Try using a good premade cable, with solid connectors
    on both ends.


    If you’ve replaced all your wiring, and everything is firmly seated, and reboots
    and resets have not solved your problem, phone your CSU/DSU’s technical support
    line. On a modern Cisco system, this would be Cisco itself.


    > **NOTE** If your vendors start each blaming the other, as is common among lower-level
    technical support staff, do not be afraid to get them all on the phone at once
    and let them fight it out.


    Now that you know how to troubleshoot your router, you can learn how to upgrade
    it.'
  merge: -1
