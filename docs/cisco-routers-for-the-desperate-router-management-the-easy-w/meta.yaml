    \ a topic for other books.\n\n## 8 LOGINS, AUTHENTICATION, AND REMOTE ACCESS\n\
    \nRestricting access to your router's configuration and controls is an important\
    \ part of network management. While it's important to get the router up and running,\
    \ you don't want just anyone to be able to access your equipment and reconfigure\
    \ it! It's important to understand how your router can be accessed, how to set\
    \ passwords and create individual usernames, and how to offer and control access\
    \ over the network via telnet or SSH.\n\n### Lines\n\nNear the end of your router’s\
    \ configuration, you’ll see entries like `line vty 0 4` and `line con 0`. These\
    \ lines are the available methods of getting a command line prompt on your router,\
    \ and each can be configured separately. A standard Cisco device has three types\
    \ of line: con, aux, and vty.\n\nThe *con* (or console) port is what we’ve been\
    \ using to connect to the system. While it’s entirely possible to reconfigure\
    \ this port, it’s generally a bad idea. You can set the console to require a password\
    \ to log in, for example, or you might have it run at a higher speed for better\
    \ interactive response. If you need a physical console port with nonstandard behavior,\
    \ use the *aux* (or auxiliary) port. That’s what it’s there for.\n\nThe *vty*\
    \ lines, or virtual terminals, are logical lines used for access over the network.\
    \ Telnet and SSH connections into the router are directed to a virtual terminal.\
    \ These lines have no physical hardware; they are strictly a software interface.\
    \ (That’s why they’re called “virtual.”) These lines may cause the most concern\
    \ and require the most attention; while a locked door can control access to the\
    \ con and aux ports, the whole point of remote network access is that you can\
    \ access your router from anywhere.\n\nEach router supports a different number\
    \ of lines. The easy way to identify the lines is with the `show line` command.\n\
    \n| Tty | Typ | Tx/Rx | A | Modem | Roty | AccO | AccI | Uses | Noise | Overruns\
    \ | Int |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 0 | CTY | | -\
    \ | - | - | - | - | 0 | 0 | 0/0 | - |\n| 129 | AUX | 9600/9600 | - | - | - | -\
    \ | - | 0 | 0 | 0/0 | - |\n| * 130 | VTY | | - | - | - | - | - | 18 | 0 | 0/0\
    \ | - |\n| 131 | VTY | | - | - | - | - | - | 6 | 0 | 0/0 | - |\n| 132 | VTY |\
    \ | - | - | - | - | - | 3 | 0 | 0/0 | - |\n| 133 | VTY | | - | - | - | - | - |\
    \ 2 | 0 | 0/0 | - |\n| 134 | VTY | | - | - | - | - | - | 0 | 0 | 0/0 | - |\n\n\
    Here, we see that this particular router has a single console, a single aux port,\
    \ and five virtual terminals numbered 130 through 134. While most of the rest\
    \ of the information is not normally useful, sometimes it’s nice to see how many\
    \ times a particular terminal has been accessed.\n\nWhile you can do all sorts\
    \ of configuration on these ports, the most important features are those related\
    \ to passwords and access methods. Let’s look at a sample configuration and see\
    \ what we can learn.\n\n```\nline con 0\n password 7 02310042864A2C295D43D1\n\
    line aux 0\n password 7 02310042864A2C295D43D1\nline vty 0 4\n login local\n transport\
    \ input telnet ssh\n```\n\nThe first entry is the console port. Like all real\
    \ computer devices, Cisco numbers ports beginning with zero. This console port\
    \ has a password on it; even if you hook up a serial cable and fire up HyperTerminal,\
    \ you'll have to enter a password. This may be necessary if your router is physically\
    \ insecure, such as in a shared colocation center. (It may also be necessary if\
    \ your company has staff that like to wander into places they aren't supposed\
    \ to.) If your router is correctly configured, the actual password is stored in\
    \ encrypted form.\n\nThe aux port is also numbered 0 and has a password. While\
    \ the password for both the console and aux ports are encrypted, you can see that\
    \ they are identical.\n\nLast, we have the virtual terminals. This system has\
    \ five configured virtual terminals, numbered 0 through 4. The `login local` keyword\
    \ means that this router has a list of usernames and passwords stored on the local\
    \ machine, and that whenever a login request arrives over the network, the router\
    \ should use this list. The transport line indicates what methods can be used\
    \ to access the virtual terminals; in this case, acceptable inputs are telnet\
    \ and SSH.\n\nUnconfigured virtual terminals cannot be used; if we configured\
    \ only virtual ports 0 and 1, the router would only support two simultaneous remote\
    \ login sessions. While this might not seem like a problem, at times it's nice\
    \ to have multiple router command prompts open simultaneously so that you can,\
