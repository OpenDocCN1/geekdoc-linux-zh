    ```


    路由器会将它放在全局配置中的适当位置。（不，你不能自己选择在配置中的哪个位置放置这条语句；路由器比你清楚得多每条语句应该放在哪里，而且会完全无视你试图重新排列配置的任何尝试。）在配置提示符下输入
    `reload` 或 `ping` 之类的命令只会产生错误，因为这不是有效的配置语句。


    完成配置后，用 CTRL-Z 退出配置模式。


    ```

    router(config)#^Z

    router#

    ```


    提示符恢复为简单的 `router`。


    ### 配置特定接口


    当你需要配置特定接口时，只需在配置提示符下输入接口名称。路由器会将任何后续语句放在该接口配置下。


