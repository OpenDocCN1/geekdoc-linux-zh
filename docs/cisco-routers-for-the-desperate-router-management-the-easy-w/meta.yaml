    需要记住的重要一点是，路由器上用于存储日志消息的空间非常有限，且在不同路由器之间有所不同。如果你想保留更多日志消息，必须使用 syslog。


    ## Syslog 基础


    *syslog* 协议需要一台单独的服务器来接收来自路由器（以及任何其他支持 syslog 协议的网络设备）的消息。该服务器运行一个 syslog 守护进程，即
    *syslogd*。多年来，syslogd 已被集成到各种类 Unix 操作系统中，微软的服务器操作系统也有相当多 syslogd 的实现（包括商业版和免费版）。syslog
    守护进程非常小，即使对配置较低的系统影响也很小，我建议使用最适合你环境的版本。虽然不同程序的 syslog 守护进程配置差异很大，但协议基础是不变的。syslog
    使用与本地日志相同的严重程度级别，但还使用 *facility*（设施）来标记消息。


    Facility 是由 syslog 守护进程提供的一个类别，用于让一组程序将日志记录到同一个地方。例如，名为 `ftp` 的 syslog facility
    旨在用于 FTP 服务器日志消息，以及来自 TFTP 和 SFTP 服务器等相关程序的消息。`daemon` facility 旨在用于需要日志记录但没有独立
    facility 的各种系统守护进程。除了像这样几十个定义好的 facility 之外，syslog 守护进程还有八个名为 `local0` 到 `local7`
    的本地 facility，专门供本地系统管理员使用。这些本地类别中的任何一个都适用于你的路由器消息；只需挑选一个即可。路由器将使用你选择的任何 facility。


    我建议记录路由器产生的所有内容；Cisco 日志体积不大，而且当某些东西损坏时，你会希望能够查看旧日志。一旦你配置了本地日志，只需添加几行代码即可启用 syslog
    日志记录。


    ```

    router# conf t

    router(config)# logging ❶ trap ❷ debugging

    router(config)# logging ❸ facility ❹ local3

    router(config)# logging ❺ 192.168.1.8

    ```


    Logging ❶ traps 是由路由器发送的消息。在这种情况下，我们希望路由器将 ❷ debugging 严重程度或更高级别的任何日志消息传输到我们的
    syslog 服务器（严重程度级别与本地日志中使用完全相同）。路由器会为每条消息标记一个我们预留的特定 ❸ facility。在本例中，我们使用 ❹ local3
    facility。最后，我们告知路由器日志服务器的 ❺ IP 地址。保存你的工作，此后每当路由器生成一条日志条目时，它都会向你的日志服务器发送一条消息。


    当 syslog 消息到达你的日志服务器时，syslog 守护进程将检查每条消息的 facility 和严重程度，并将消息引导至你为这些消息选择的文件中。这个过程发生得极其迅速；如果你的
    syslog 服务器设置正确，你几乎会立即看到消息出现。


    ## SNMP


    将网络连接在一起最常用的“胶水”是简单网络管理协议 (SNMP)。许多不同的产品和工具使用 SNMP 来收集和积累网络及设备性能信息，所有这些都包括对 Cisco
    路由器的支持。


    SNMP 可以用于只读 (read-only) 和读写 (read-write) 两种模式。使用读写 SNMP 要求你的路由器具备极高的安全性。由于你的路由器通常是网络的边界设备，位于防火墙之外，这很难实现。只读访问是一个安全得多的方案。（你还可以使用访问控制列表来防止随机人员查询你的路由器；详情请查看
    Cisco 官网。）


    启用 SNMP 的设备使用“团体名 (community name)”来提供基础安全。这非常像密码；拥有团体 ID 的人可以对路由器进行 SNMP 查询，而没有团体名的人则不能。设置团体名非常简单：


    ```

    router# conf t

    router(config)# ❶snmp-server ❷community ❸SendMichaelAllYourCash ❹RO

    ```


    首先，告知路由器 ❶ 启动其 SNMP 服务器。你必须设置一个 ❷ 团体名，并挑选 ❸ 一串随机字符作为团体名。最后，不要忘记将团体名设置为 ❹ 只读 (read
