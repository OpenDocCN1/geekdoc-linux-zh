    ## 执行升级


    IOS 升级需要重启路由器，这将中断服务。如果一切顺利，路由器仅需停机几分钟。如果新的 IOS 镜像无法工作，你需要将旧的 IOS 重新加载到路由器并再次重启。如果你有外部闪存卡，或者路由器的闪存空间足够存储多个
    IOS 镜像，你将能够相当快速地还原旧镜像。如果你没有这些功能，则需要通过 FTP 将旧的 IOS 镜像传输到路由器；如果你的路由器不再识别网络接口，则需通过串口电缆使用
    xmodem 传输。请为这个恢复过程预留至少两小时。


    简而言之，为路由器升级计划一个两小时（或更长！）的可接受停机时间窗口。


    ## IOS 安装


    经过这么多准备工作，新 IOS 的安装本身几乎毫无波澜。只需将镜像从 FTP 服务器复制到路由器的内部闪存中即可。


    ```

    router# copy ftp://username:password@servername/new-image-name flash:new-image-name

    ```


    复制命令会提示你确认。如果内部闪存太小，无法同时容纳旧镜像和新镜像，它会询问你是否先擦除现有闪存。确认你确实已经备份了旧的 IOS 镜像，然后执行擦除闪存操作。


    镜像文件加载到路由器的闪存存储后，重新加载（reload）路由器。路由器应当使用新的 IOS 启动。你可以在下次重启后通过 `show version` 来确认。


    ## 管理多个 IOS 镜像


    如果你是那些幸运的人，拥有闪存空间足够容纳多个 IOS 镜像的路由器，那么你不会为了给新镜像腾空间而擦除整个闪存。`erase` 命令将从存储设备中擦除特定文件，为新镜像腾出空间。通常，闪存中会有两个镜像文件：当前运行的版本和之前的版本。为了在闪存中放入新镜像，请擦除你拥有的最旧镜像。


    ```

    router# erase flash: filename

    ```


    现在你应该有足够的空间加载新的 IOS 镜像。当路由器有足够的内部闪存来持有多个 IOS 镜像时，它会自动使用第一个可用的镜像启动。执行 `dir flash:`
    来确定是哪个镜像。如果错误的镜像排在首位，你可以使用 `boot system` 命令将启动镜像硬编码。


    ```

    router#conf t

    router(config)#no boot system

    router(config)#boot system flash *imagename*

    router(config)^Z

    ```


    ## 灾难恢复


    如果你的新 IOS 镜像有问题，重启后路由器可能会不稳定；它可能无法识别网络接口，可能会反复崩溃，甚至可能仅启动进入 "rommon" 模式——这相当于 Cisco
    版的 "Press F2 for Setup"（按 F2 进入设置）。


    如果你处于这种情况，但路由器本身（无论是在闪存中还是在闪存卡中）存有旧版本的 IOS，请启动旧镜像。这至少能在你打电话给 Cisco 并利用你的 SmartNet
    合同寻求他们帮助解决问题期间恢复服务。


    如果你在路由器本身上没有现成的旧 IOS——比如，它被备份在 FTP 服务器上——你必须通过控制台电缆使用 xmodem 将镜像加载回路由器。该过程因路由器类型和故障类型而异，因此我们在此不详述。我建议你立即致电
    Cisco 并开启一个 Priority 1（最高优先级）案例。关键措辞是：“I am completely down”（我完全掉线了）。当 Cisco 技术人员意识到你的路由器已脱离互联网且你彻底陷入困境时，他们能立即为你连接一名技术专家，指导你执行适用于该路由器的正确恢复程序。如果你需要，他们甚至会手把手地引导你完成每一个步骤。尽管我经历过几次升级失败，且知道每台路由器该怎么处理，但在时间紧迫时，电话那边有一个专家在场是非常令人安心的。


    既然你现在可以升级路由器了，让我们来看看如何提供备份连接。


    ## 7. 使用 BGP 和 HSRP 实现冗余


    你的互联网服务中最容易出现故障的组件是互联网链路。Cisco 路由器可以使用来自多个供应商的多条互联网链路，从而让你的网络能够以最佳方式访问互联网站点，同时也让其他互联网用户能够以最佳方式访问你的公司。


    这是通过边界网关协议（BGP）实现的。BGP 向全世界宣告你的路由器负责哪些 IP 地址，并监听其他路由器以学习到达其他站点的最佳路径。BGP 不难理解或实现，但它有自己的技巧和陷阱。你可能需要进一步研究如何使
    BGP 满足你的具体需求，但本节内容足以让你在多个互联网供应商环境下运行起来。


    ## BGP 基础


    BGP 的核心是*自治系统* (AS)。AS 是一个独立做出路由决策的单一网络，规模不限。如果你的公司只有一条通往互联网的路由，你的网络不做出路由决策——它将所有流量都丢给那条单一路由。如果你的网络通过两个不同的供应商拥有两条通往互联网的路由，你的网络就必须决定将每块流量发送到哪里，并且你可以调整流量进入和离开网络的方式。这时你就是一个自治系统。同样，像
    Level3 和 MCI 这样的大公司也是自治系统。每个 AS 被分配一个自治系统编号（ASN），以便在互联网上唯一标识该自治系统。自治系统通过 BGP 交换路由信息。两个直接连接并交换路由信息的自治系统被称为*对等*
    (peer)。


    看看我们的自治系统示例网络（图 7-1）。这个示例比真实的互联网小得多，互连程度也低得多，但足以用来理解基本原理。你的网络是 AS100，与 AS200 和
    AS300 对等。AS300 进而与 AS200、AS400、AS500 和 AS600 对等。


    *图 7-1：自治系统示例网络*

    '
