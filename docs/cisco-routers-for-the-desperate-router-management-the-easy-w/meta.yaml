    HSRP 允许多个路由器提供一个单一的 IP 地址。这对于以太网上的默认网关最为有用。你的所有计算机对路由器的认知仅限于其中一台必须拥有（例如）192.168.0.1
    的默认网关；它们不在乎哪个路由器拥有它，只要它可用即可。HSRP 允许路由器相互跟踪；当拥有默认网关的路由器从网络中消失时，另一个路由器可以自动响应针对该默认网关
    IP 地址的请求。在这种情况下，每台路由器在以太网接口上都有自己的唯一 IP 地址，但可能同时拥有如图 7-2 所示的默认网关地址。


