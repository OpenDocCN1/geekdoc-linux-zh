    \n未配置的虚拟终端无法使用；如果我们只配置了虚拟端口0和1，路由器将只支持两个同时进行的远程登录会话。虽然这可能不是问题，但有时同时打开多个路由器命令行提示符会很方便，这样你可以在一个窗口中继续监视你的BGP会话，而在另一个窗口中进行更改。我发现自己有时在调试一个特别烦人的问题时，在我的单个桌面上打开了所有四个虚拟终端。\n\
    \n你如何设置这一切？嗯，让我们找出答案。\n\n### 密码\n\n密码是Cisco路由器可以使用的最简单的认证方法，但它对大多数网络来说已经足够有效了。如果你有几十台路由器，你可能想考虑一种解决方案，比如\n"
