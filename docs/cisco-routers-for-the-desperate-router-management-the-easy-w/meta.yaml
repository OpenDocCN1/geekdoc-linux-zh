    A，请 SSH 到地址 192.168.0.2。同样，路由器 B 在办公网络上也有一个以太网接口和唯一的 IP 地址 192.168.0.3，但它也可以承载默认网关
    192.168.0.1。路由器之间会协商谁是“默认”的默认路由器，但当该路由器故障时，另一台将接管。在 Cisco 术语中，IP 地址 192.168.0.1
