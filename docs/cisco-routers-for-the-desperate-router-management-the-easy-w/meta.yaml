    Internet 电路。你可能已为该电路配置了域名，但请使用 IP 地址，因为实际的 Internet 问题也意味着 DNS 问题。你的电路远端很可能就是路由器上的默认路由。在下面的示例中，我们串行线路远端的
    IP 地址为 192.168.88.65。登录到你的路由器并执行 ping 命令，带上目标 IP 地址。¹


    ```

    router# **ping 192.168.88.65**

    Type escape sequence to abort.

    Sending 5, 100-byte ICMP Echos to 192.168.88.65, timeout is 2 seconds:

    ❶!!!!!

    Success rate is ❷100 percent (5/5), round-trip ❸min/avg/max = 4/4/4 ms

    router#

    ```


    路由器向目标 IP 地址发送五个数据包，并为每个数据包留出两秒的返回时间。这对于非卫星链路的任何设备来说通常都足够长了。每个 ❶ 感叹号表示一个返回的数据包，而一个点则表示丢失的数据包。最后，我们看到
    ❷ 成功百分比以及 ❸ 以毫秒为单位的数据包速度统计。此处显示的电路显然是通的。


    另一方面，类似下面的结果则表示你的本地电路已断开。


    ```

    Sending 5, 100-byte ICMP Echos to 192.168.88.65, timeout is 2 seconds:

    ❶.....

    Success rate is ❷0 percent (0/5)

    ```


    ❶ 一个点代表一个丢弃的数据包。五个点表示 ❷ 电路完全故障。开始排查你的电路问题吧！


    然而，回到第一个 ping 示例，电路通并不意味着你就能上 Internet。可能是你的 ISP 出现了故障，或者某个主干网遭遇了那台横行霸道的挖掘机。你的下一步是尝试从你的路由器访问一个热门
    Internet 站点，例如 Yahoo!。如果你的电路正在传输流量，但你无法 ping 通 Yahoo! 或 CNN.com 等热门且高可用性的站点，那么你的网络和主干
    Internet 之间可能存在故障。这时就该使用 traceroute 了。


    ¹ 也可以尝试从你的桌面计算机执行 ping 测试，但在这种情况下，你不仅仅是测试路由器的电路；你还在测试你的桌面计算机到网络的连接、任何中间防火墙，以及你的计算机和电路远端之间其他网络设备。为了隔离问题，每次只测试一小部分。


    # Traceroute


    traceroute 命令向远程 Internet 节点发送数据包，并返回沿途经过的每个节点的 IP 地址。请记住，要到达远程站点，你的流量很可能经过你的路由器、你的
    ISP 的路由器、穿越多个骨干路由器、通过目标站点的 ISP 的路由器，再通过目标站点的路由器，最后才能到达实际的目标服务器。如果其中任何一个环节出现故障，你的请求就会失败。


    要使用 traceroute，只需登录路由器并输入 traceroute 命令，以及你尝试访问的 IP 地址或主机名。


    ```

    router#traceroute www.blackhelicopters.org

    Translating "www.blackhelicopters.org"...domain server [OK]


    Type escape sequence to abort.

    Tracing the route to bewilderbeast.blackhelicopters.org (198.22.63.43)


    ① 1 192.150.247.53 [② AS 26096] ③ 4 msec 4 msec 0 msec

    ④ 2 192.150.247.38 [AS 26096] 4 msec 8 msec 8 msec

    ⑤ 3 bewilderbeast.blackhelicopters.org (198.22.63.43) [AS 26096] 12 msec 8 msec
    8 msec

    router#

    ```


    离开我们当前的路由器后，流向该服务器的流量通过 IP 地址为 ① 192.150.247.53 的路由器。如果这台机器有反向 DNS 记录，则会显示主机名而非
    IP。在三个数据包中，③ 有两个在四毫秒内返回，一个在零毫秒内返回。（这并不意味着零时间；只是表示小于你的路由器能够测量的最小时间。）该路由器属于 ② 自治系统
    26096（参见第 7 章）。④ 第二个路由器被非常快速地穿越。在 ⑤ 第三跳时，我们到达了一台反向 DNS 为 "bewilderbeast.blackhelicopters.org"
    的机器，traceroute 在此处结束。 presumably，www.blackhelicopters.org 的 IP 地址就在这台机器上。


    - 当数据包被丢弃时，你会看到一个星号而不是时间戳。

    - 如果 traceroute 以 !H 结束，这意味着 traceroute 的最后一个节点不知道如何到达目的地。这几乎可以肯定是一个路由问题。

    - 当 traceroute 变成一行又一行三个星号时，据说它"死掉"了。这可能表示防火墙阻止了 traceroute 数据包到达目标服务器，也可能是网络问题。最后出现的节点知道要将数据包发送到哪里，但它没有收到来自下一跳的响应。


    traceroute 可以帮助你明确问题的范围：如果你的oughout 你的所有 traceroute 都到达了你 ISP 的路由器然后就死掉了，你可以假设你的
    ISP 出了问题，是时候给他们打电话了。


    如果 traceroute 在 Internet 的某个中间位置死掉，这很可能意味着你无能为力，但损害的范围是有限的。也可能存在某些 Internet "黑洞"
    导致许多不同的请求失败。例如，在 1996 年的大部分时间里，MCI 的 Willow Springs 路由器集群似乎就是 Internet 数据包的秘密墓地；通过该系统路由的网络请求持续遭受严重的丢包和延迟。这种"死亡网络"的所有者很可能很清楚这个问题，并且正在拼命尝试解决，但如果你与网络所有者没有任何业务关系，你或者你的
    ISP 都无能为力。无论如何，至少你知道了情况。


    如果你甚至无法 ping 通你的电路两端，那就该亲自动手排查你的电路问题了。但在排查任何问题之前，你必须先理解它。


    # 电路设计


    几十年来，不同的电话公司使用过许多不同类型的连接设备。我的一个客户仍在使用的电话交换机可以追溯到 1950 年代，其保险丝有我的拇指那么粗，长达数英寸。（我相信弗兰肯斯坦博士使用过这种设备，我曾建议把这些设备提供给他作为备件，只要他把东西搬走就行。）这种设备显然无法用于
    Internet 连接。


    其他人拥有较新一些的系统，但来源完全不明。如果你有这样一套*极为*复杂的设置，为了避免大量麻烦，还是换一条现代电路吧。我们将讨论现代 T1 电路的物理设计，而不是弗兰肯斯坦的收藏品。


    ## Smartjack（智能插孔）


    电话公司通常会在你的位置用一个称为 *smartjack* 的设备来终结电路，这是一个带有绿色和红色指示灯的小盒子。smartjack 具有简单的智能功能，电话公司可以用于故障排查（这就是"smart"部分的由来）。电话公司或
    ISP 通常负责 smartjack 之前的电路；smartjack 与路由器之间的问题则由你负责。


    smartjack 的安装点称为 *demarc*（分界点）。如果你的 smartjack 离路由器很远，通常会由专业人员进行 *extended demarc*（延伸分界点）安装，将电路从
    smartjack 延伸到一个更方便设备连接的地点。这在办公楼中很常见，电话公司将所有电路都交付到一个中心位置，但办公室却分布在许多楼层之上。


    最终，电路被传送到信道服务单元/数据服务单元（CSU/DSU），它将 T1 线路上传来的信号转换为路由器能够理解的格式。大多数现代 Cisco 路由器都集成了
    CSU/DSU 功能，因此你可以直接将 smartjack 的 RJ-45 网线插入路由器，而无需在数据中心周围放置额外的笨重盒子。


    ## 检查电路


    接口的 `show int` 输出的第一行描述了接口的基本状态，如第 3 章所述。如果线路状态为 up，路由器正在从 T1 接收合理的信号。如果线路状态为
    down，路由器没有在 T1 上收到信号。虽然你仍需要检查该接口上的其他错误，但收不到信号是一个非常明确的信号，表明存在严重问题。


    如果电路是通的但协议状态为 down，路由器无法理解 T1 上传来的信号。如果这是一条全新的电路，很可能是配置错误，但在成熟的电路中，这可能意味着线路噪声或损坏。（这也可能意味着电路沿途的某个地方有人动了手脚，但任何
    ISP 或电话公司都*做梦*不会这样做，即使某个薪水过低、过度劳累的技术人员认为在你没注意的时候微调一个设置也不会被发现。）


    虽然你会想要检查该接口上可用的其余信息，但你可以先尝试一些操作。

    '
