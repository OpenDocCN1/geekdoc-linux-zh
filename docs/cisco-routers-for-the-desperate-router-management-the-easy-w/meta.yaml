    BGP 路由表之前就接管了备用 IP 地址，流量将停止流动，直到路由器准备就绪。为了让你的路由器能够稳妥地启动，你可以为 HSRP 故障转移分配一个延迟。


    在你输入 `clear ip bgp *` 后，计时路由器重新建立所有 BGP 会话以及 CPU 降低到正常繁忙状态所需的时间。将该时间向上取整 10 或
    15 秒，以预留应对意外的时间。这就是你的备用 IP 在故障转移前应等待的时间。


    ```

    router(config)# int faste0/0

    router(config-if)# standby 1 preempt delay minimum 60

    ```


    该路由器将在接管备用 IP 地址之前至少等待 60 秒。


    ### 认证 (Authentication)


    入侵者极不可能潜入你的 HSRP 集群，因为这需要相当高的天赋和知识。然而，如果他们成功潜入，后果可能是灾难性的。想象一下，如果入侵者通过非法安装在其中一台机器上的数据包分析器引导所有网络流量；他们可以截获用户名、密码、信用卡号、客户详情等。因此，在
