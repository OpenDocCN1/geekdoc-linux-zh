  mdcn: "\n服务器，甚至可以记录在日志本的一页纸上。如果您的路由器发生严重故障而导致配置丢失，您只需进入配置模式并粘贴整个路由器配置，即可恢复服务。\n\n\
    您还可以使用 `copy ftp` 命令将路由器的配置复制到 FTP 服务器。该过程与用于 IOS 升级的 FTP 过程非常相似，而且在升级前采取这种*极佳*的预防措施非常必要，因此我们将在第\
    \ 6 章中讨论它。\n\n## 3\n\n## 路由器接口\n\nCisco 路由器的主要功能之一是连接不同类型的网络。将以太网系统连接在一起非常直接，连接广域网\
    \ (WAN) 链路同样简单，但如果没有中间设备，这两种非常常见的网络类型根本无法相互通信。路由器允许您将非常不同的物理网络视为一个单一的连续实体。\n\n\
    Cisco 路由器支持几乎任何类型的网络接口：以太网 (Ethernet)、串口 (serial)、令牌环 (token ring)、DS3、OC3、异步调制解调器等。这些接口可能在类似于笔记本电脑中使用的插件卡上，也可能与系统集成。当某个聪明的科学家开发出直接进入人类大脑的神经链路时，Cisco\
    \ 也会为此提供接口。但在那之前，以太网和串口是最常见的接口，因此我们将重点讨论它们。\n\n## 有接口吗？\n\nCisco 设备可以显示关于连接到系统的每个接口的信息。通过查看系统接口，您不仅可以看到路由器拥有什么样的接口，还可以看到每个接口处理了多少流量、路由器感知到了什么样的网络错误，以及关于路由器所连接网络的大量进一步细节。要查看路由器上的每个接口，请输入\
    \ `show interfaces` (`sho int`)。路由器上的每个接口都会显示一个如下所示的条目。\n\n```\nrouter#sho int\n\
    \ FastEthernet2/0 is administratively down, line protocol is down\n Hardware is\
    \ AmdFE, address is 0003.e35e.d191 (bia 0003.e35e.d191)\n...\n```\n\n路由器根据其在系统中的内部顺序列出接口。有时这个顺序会清晰地标记在系统外部，而有时你可能会好奇路由器是怎么学会数数的。\n\
    \n每个接口由一个类型（本例中为 FastEthernet）和一个该类型的唯一编号（1/0）唯一命名。\n\n任何类型的第一个接口编号均为 0。像本例中这样的分级编号告诉我们，多个接口被加载到单个插件模块中。例如，接口\
    \ FastEthernet 1/0 是 1 号插件卡上的第一个以太网接口。如果该插件卡同时拥有串口接口和以太网接口，那么 Serial 1/0 也可能会出现。编号完全取决于路由器认为接口是如何连接的。\n\
    \n在拥有许多接口的路由器上，您可能只想查看某个特定接口。例如，如果您想查看您的互联网电路是否正常工作，您只需要查看连接到该电路的接口，而不需要查看路由器上的每个接口。要显示特定接口，请在\
    \ `sho int` 命令后加上其名称。例如，要仅查看接口 serial 0，请输入 `sho int serial0`。\n\n与命令一样，您可以将接口名称缩写为最短的唯一标识符：这些缩写通常包含足够地识别接口类型和编号的字母。例如，serial\
    \ 1 可以是 `s1`，ethernet 0 可以是 `e0`，fast ethernet 2/1 可以是 `faste2/1`。请查看您路由器的接口名称，看看它们可以如何缩写。\n\
    \n## 常见接口特性\n\n当您在大多数类型的接口（包括串口和以太网）上运行 `sho int` 时，您会在每个接口的输出结果中看到大量相似的信息。下面的示例显示了以太网接口\
    \ `sho int` 输出的第一部分，但我们将讨论的所有内容同样适用于串口接口。\n\n```\nrouter#sho int fastethernet2/0\n\
    FastEthernet2/0 is up①, line protocol is up②\n ③Hardware is AmdFE, address is\
    \ 0003.e35e.d1a1 (bia 0003.e35e.d1a1)\n ④Description: Main office Ethernet hub\n\
    \ ⑤Internet address is 198.88.118.129/25\n ⑥MTU 1500 bytes, ⑦BW 100000 Kbit, DLY\
    \ 1000 usec,\n  reliability 255/255, txload 1/255, rxload 13/255\n ⑧Encapsulation\
    \ ARPA, loopback not set\n ...\n```\n\n每个接口的输出还会继续，但大部分是调试信息，目前没有太大用处。我们将在第 5\
    \ 章中查看那些额外的输出。\n\n观察上面的输出，我们首先看到该接口是 ① **up**。这意味着物理电缆已插入接口，并且路由器看到了可以通过其理解的信号。如果接口未使用或为空，或者电路存在某些物理问题，状态将为\
    \ `down`。如果您的接口是 up，那么该网络很可能没有物理问题；如果它是 down，那么问题很可能可以通过沿着电缆检查物理缺陷来确定。\n\n接下来是\
    \ ② **线路协议状态 (line protocol status)**。线路协议告诉我们通过线路传输的信号所使用的编码。每种网络类型都使用某种物理协议将实际数据编码为一串\
    \ 0 和 1。只要电缆另一端的设备使用与路由器接口相同的协议，此行应显示为 `up`。然而，即使您在路由器接口上连接了正常的电路，如果两端的路由器使用了不同的线路协议，此处状态将显示为\
    \ `down`。您必须同时拥有“up”的电路和协议一致性才能实际使用该电路。如果您的电路是 up，但协议是 down，那么您的配置在两端中的一端可能出错了。线路协议在“封装\
    \ (encapsulation)”部分设置（见下文点 ⑧）。\n\n接口报告了该路由器为此连接所使用的 ③ **硬件 (hardware)** 类型。这个名称通常是某些模糊的\
    \ Cisco 内部零件号或名称，但它可能包含零件的描述。遗憾的是，并没有公开可查的这些零件的主清单，但如果您熟悉相关技术，您可能会从硬件描述中获得一些有用信息。在本例中，我们得到了快速以太网端口的\
    \ MAC 地址。\n\n您可以在 ④ **描述 (Description)** 字段中输入任何内容。虽然对于只有一个接口的普通 SOHO 网络来说这似乎毫无意义，但当您的路由器每种类型都有多个接口时，在这里输入一个简单的英文描述性名称会非常有帮助。在\
    \ T1 或 DS3 等串口电路中，我建议在此字段中填入电信运营商的电路 ID（我们将在第 4 章中讨论电路 ID）。\n\n每个配置好的接口都有一些基本的\
    \ ⑤ **TCP/IP 配置信息**，例如 IP 地址和子网掩码。（我们将在本章后面学习如何配置此项。）\n\n接下来，我们有一些关于该接口所使用的 ⑥\
    \ **物理协议 (physical protocol)** 的基本信息。大多数互联网设备的标准 MTU（最大传输单元）为 1500 字节，如这里所示；如果您的不同，那么一定是有人出于某种特定原因将其设置成了那样。更改此值可能会增加经过您网络的数据包的分片，通常是不建议的。（如果以太网或\
    \ T1 电路的 MTU 不是 1500 字节，那几乎肯定就是问题所在。）像 DS3 和 OC3 这样的大电路有其自身的正确 MTU 值，随意更改它们会导致各种麻烦。\n\
    \n⑦ **BW 值** 是该接口的总带宽。如果您试图确定为什么路由器运行缓慢，这可能是至关重要的信息。如果您的路由器可以处理每秒 100,000 kb（就像这个接口一样），而您想在网络中强行传输两倍的流量，您将遇到严重的问题。\n\
    \n最后，⑧ **封装 (encapsulation)** 是该接口使用的逻辑协议。从最基本的意义上说，它告诉路由器您连接的是什么样的网络。在本例中，我们使用\
    \ ARPA 封装，它用于所有以太网接口。（串口链路有更多选项，我们将在第 4 章中讨论。）这就是之前讨论的“线路协议”设置的地方。\n"
