    # E.2.15 What applications are there for Red Hat Linux?


    There are many applications for Linux available. Please see http://www.redhat.com
    and go to the “Linux Applications and Utilities” section. This section is maintained
    by a private individual that is not related to Red Hat in any way. You will find
    information on nearly every product available for Linux on his pages.


    # E.2.16 Does Red Hat Linux include source code?


    Yes. We include the exact source that was used to build the distribution. From
    release 2.0, Red Hat Linux is built on a packaging system called RPM that ONLY
    usine pristine source (the same as what you''d find at the author’s FTP site)
    and possibly a Red Hat patch. Complete information on RPM is available on http://www.redhat.com.


    # E.2.17 What version of X Windows is included with Red Hat?


    Red Hat Linux 4.1 ships with XFree86 3.2, and comes standard with a very nice
    configuration tool.


