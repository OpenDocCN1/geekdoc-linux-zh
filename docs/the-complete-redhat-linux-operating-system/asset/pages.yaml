  md: '# E.3 Installation Questions


    # E.3.1 Do I need swap space?


    Yes! If you have 8M of RAM, you must enable at least 8M of swap during the installation
    of Red Hat. If you have more RAM, you should still enable swap, though it isn''t
    mandatory.


    # E.3.2 How do I get my IDE CD-ROM on my SB16 to work?


    The Creative Labs kit comes with the IDE Interface set to the third IDE port by
    default (IDE2, I think). This won''t work under Linux as it only recognizes two
    IDE ports. What you need to do is move a jumper on the card to configure for IDE1
    (the secondary IDE port). I''m not sure if you have to make changes under DOS
    for this configuration to work, but your manuals should help with this (it will
    still work, but you may have to edit a file or two).


    You may also have to specify command line parameters like:


    ```

    boot: linux hdN=cdrom

    ```


    If you have one IDE drive, N is most likely "b" in this case (ie "linux hdb=cdrom").
    If you have two, then it will be "c".


    # E.3.3 How do I do a network install of Red Hat Linux 4.1?


    Get the RedHat-HOWTO from the docs directory of any Red Hat Mirror. It will tell
    you all you need to know.


    # E.3.4 How do I run the install program again?


