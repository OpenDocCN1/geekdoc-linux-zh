  md: '# Chapter 6


    # Finding Documentation


    Red Linux includes thousands of pages of online documentation to help you learn
    how to use the system. The man pages, info documents, and plain text files included
    provide information on almost every aspect of Linux. For more help, Red Hat also
    includes all of the documentation produced by the Linux Documentation Project
    electronically.


    # 6.1 On Line Help


    When you are looking for general help on commands and error messages, the best
    place to start is right on your system.


    # 6.1.1 Man Pages


    Most every command on your system has an associated “man” page. This is documentation
    that you can get to instantly should you have questions or problems. If you were
    having trouble with the command ls, you could enter `man ls`. This will bring
    up the man page for ls. The man page is viewed through the `less` program, so
    all of the options to less will work while in a man page. Some important key strokes
    are:


    +   - `q` to quit'
  merge: -1
  pgno: 82
- img_proc: true
  md: '70 CHAPTER 6. FINDING DOCUMENTATION


    +   * Enter to page down line by line

    * Space to page down page by page

    * b to page back up by one page

    * / followed by a string and Enter to search for a string

    * n to find the next occurrence of the previous search


    Sometimes viewing man pages isn’t too friendly on line. Providing you have a working
    printer, you can print man pages as well. If you don''t have postscript printing
    capability and just want to print ASCII, you can print man pages with:


    ```

    man COMMAND | 1pr

    ```


    If you have a postscript printer, you will probably want to print with:


    ```

    man -t COMMAND | 1pr

    ```


    In both of those commands substitute “COMMAND” for the command you are trying
    to get help for.


    Also, sometimes things have more than one man page. Here is a table of what is
    located where:


    | Section | Contents |

    |---|---|

    | 1 | user commands |

    | 2 | system calls |

    | 3 | library calls |

    | 4 | devices |

    | 5 | file formats |

    | 6 | games |

    | 7 | miscellaneous |

    | 8 | system commands |

    | 9 | kernel internals |'
