    What you''ll notice is that there are no real "files" in the scripts in the init.d
    directory. The links also have an "S" and a number at the beginning. The "S" means
    to start this particular script and a "K" would mean to stop it. The number is
    just there for ordering purposes. Init will start all the services based on the
    order they appear. You can duplicate numbers, but it will only confuse you somewhat.
    You just need to use a two digit number only, along with an upper case "S" or
    "K" to start or stop the services you need to.


    How does init start and stop services? Simple. Each of the scripts are written
    to accept an argument which can be "start" and "stop". You can execute these scripts
    by in fact with a command like:


    ```

    /etc/rc.d/init.d/httpd.init stop

    ```


    to stop the httpd server. Init just reads the name and if it has a "K", it calls
    the script with the "stop" argument. If it has an "S" it calls the script with
    a "start" argument. Why all these runlevels? Some people want an easy way to set
    up multi-purpose machines. I could have a "server" runlevel that just runs httpd,
    sendmail, networking, etc. Then I could have a "user" runlevel that runs xdm,
    networking, etc.


    # 10.5.2  Init Runlevels


