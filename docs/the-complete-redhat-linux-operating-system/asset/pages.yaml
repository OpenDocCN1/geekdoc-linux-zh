    # 6.1.5 "info" Pages


    While man is the most ubiquitous documentation format, info is much more powerful.
    It provides hypertext links to make reading documents much easier and many features
    for the documentation writer. There are some very complete info documents on various
    aspects of Red Hat (especially the portions from the GNU project).


    To read info, use the info program without any arguments. It will present you
    with a list of available documentation. If it can''t find something, it''s probably
    because you don''t have the package installed that includes that documentation.
    Install it with RPM and try again.


    If you''re comfortable using emacs, it has a built in browser for info documentation.
    Use `Ctrl-h` `Ctrl-i` to see it.


    The info system is a hypertext based system. Any highlighted text that appears
    is a link leading to more information. Use `Tab` to move the cursor to the link,
    and press `p` returns you to the previous page, `n` moves you to the next page,
    and `u` goes up one level of documentation. To exit info, press `Ctrl-x` `Ctrl-c`
    (control-x followed).


    The best way to learn how to use info is to read the info documentation on it.
    If you read the first screen that info presents you''ll be able to get started.


    # 6.2 Help from the Internet Community


    # 6.2.1 Red Hat Mailing Lists


    If you can''t find help for your problem on line and you have WWW access, you
    should see http://www.redhat.com/support/mailing-lists/. Here'
