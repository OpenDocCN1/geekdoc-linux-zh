  md: "# APPENDIX D. ALPHA MINILOADER HOWTO\n\n```\nMILO> help var\nVariables that\
    \ MILO cares about:\nMEMORY_SIZE - System memory size in megabytes\nBOOT_DEV -\
    \ Specifies the default boot device\nBOOT_FILE - Specifies the default boot file\n\
    BOOT_STRING - Specifies the boot string to pass to the kernel\nCSISIN_HOSTID -\
    \ Specifies the host id of the n-th SCSI controller\nAUTOBOOT - If set, MILO attempts\
    \ to boot on powerup\n  enters command loop only on failure.\nAUTOBOOT_TIMEOUT\
    \ - Seconds to wait before auto-booting on purpose.\n```\n\n# D.6.2 Booting Linux\n\
    \nThe boot command boots a linux kernel from a device. You will need to have a\
    \ linux kernel image on an EXT2 formatted disk (SCSI, IDE or floppy) or an ISO9660\
    \ formatted CD available to Milo. The image can be zipped and in this case Milo\
    \ will recognise it as gzip by the .gz suffix.\n\nYou should note that the version\
    \ of Milo does not usually have to match the version of the Linux kernel that\
    \ you are loading. You boot Linux using the following command syntax:\n\n```\n\
    MILO> boot [-t file-system] device-name:file-name [boot-option(s)]\n```\n\nWhere\
    \ device-name is the name of the device you wish to use and file-name is the name\
    \ of the file containing the Linux kernel. All arguments supplied after the file\
    \ name are passed directly to the Linux kernel.\n\nIf you are installing Red Hat,\
    \ then you will need to specify a root device and so on. So you would use:\n\n\
    ```\nMILO> boot fd0:mlinux.gz root=/dev/fd0 load_ramdisk=1\n```\n\nMilo will automatically\
    \ contain the block devices that you configure into your vmlinux. I have tested\
    \ the floppy driver, the IDE driver and the NCR SCSI driver, these work fine.\
    \ Also, it is important to set the host id of the SCSI controller to a reasonable\
    \ value. By default, MILO will initialize it to the highest possible value (7)\
    \ which should normally work just fine."
