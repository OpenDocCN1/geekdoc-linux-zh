  md: '# 2.3. PREPARING TO INSTALL


    # 2.3.2 A Note About Virtual Consoles


    The Red Hat Linux installation system is more than simply the dialog boxes it
    presents as it guides you through the installation procedure. In fact, the installation
    system presents several different kinds of diagnostic messages while running,
    and it gives you a means to enter commands from a shell prompt. It presents the
    installation dialogs, shell prompt, and messages on five virtual consoles which
    you can switch between using a single keystroke. These virtual consoles can be
    very helpful if you encounter a problem while installing Red Hat Linux: messages
    displayed on the install log or system log can help to pinpoint the problem. Please
    see Figure 2.1 for a listing of the virtual consoles, the keystrokes to switch
    to them, and their contents.


    | Console | Keystroke | Contents |

    |---|---||

    | 1 | Alt-F1 | installation dialog |

    | 2 | Alt-F2 | shell prompt |

    | 3 | Alt-F3 | install log (messages from installation program) |

    | 4 | Alt-F4 | system log (messages from kernel, etc.) |

    | 5 | Alt-F5 | program output (messages from other programs) |


    Figure 2.1: Virtual Console Information


    # 2.3.3 Using the Dialog Boxes


    You can navigate around the installation dialogs using a simple set of keystrokes.
    In most dialog boxes there is a cursor or highlight which you can move using the
    arrow keys ← ↑ ↓, Tab, and Alt Tab. A summary of movement commands is presented
    at the bottom of each screen.


    To “press” a button (such as OK, Tab) to the button and press Space to select
    an item from a list of items, move the highlight to the item you wish to select
    and press Enter To select any number of items from a checklist, move the highlight
    to the item you wish to select and press Space to select an item. To deselect
    an item, press Space a second time.


    Pressing F12 accepts the current values and proceeds to the next dialog; it is
    usually equivalent to pressing the OK button.'
