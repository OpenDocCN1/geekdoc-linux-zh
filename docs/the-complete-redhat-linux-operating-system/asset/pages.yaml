    # Configuring an XFree86 Server


    If you wish to use XFree86, the install program launches the Xconfigurator utility,
    which is described in detail in Chapter 5, Section 5.2.


    Xconfigurator first presents a list of video cards. Select your video card from
    the list and press `Enter`. If your video card does not appear on the list, XFree86
    may not support it; however, if you have technical knowledge about your card,
    you may choose `Unlisted Card` and attempt to configure it anyway.


    Once you have selected your video card, the installation program installs the
    appropriate XFree86 server, and Xconfigurator presents a list of monitors. If
    your monitor appears on the list, select `Enter`. Otherwise, select `Custom`.
    If you select `Custom`, Xconfigurator prompts you to select the horizontal sync
    range and vertical sync range of your monitor (these values are generally available
    in the documentation which accompanies your monitor, or from your monitor''s vendor
    or manufacturer).


    **Please Note:** It is not recommended to select a monitor "similar" to your monitor
    unless you are certain that the monitor you are selecting does not exceed the
    capabilities of your monitor. If you do so, it is possible you may overclock your
    monitor and damage or destroy it.'
