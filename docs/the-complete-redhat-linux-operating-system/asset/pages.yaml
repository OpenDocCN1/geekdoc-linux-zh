  md: '# D.6. MILO''S USER INTERFACE


    ```

    - Run the standalone program dev:file

    - Display all known devices and file systems

    - Set the variable VAR to the specified VALUE

    - Delete the specified variable

    - Delete all variables

    - Display current variable settings

    - Print this help text

    ```


    Devices are specified as: fd0, hda1, hda2, sda1...

    Use the ''-t filesystem-name'' option if you want to use anything but the default
    filesystem (''ext2'').

    Use the ''show'' command to show known devices and filesystems.

    Type ''help var'' for a list of variables.


    Note that the bootopt command only appears on AlphaPC64 (and similar) systems.
    Refer to the board''s documentation to find out what it means.


    Devices Until you use a command that needs to make use of a device, no device
    initialization will take place. The first show, ls, or run commands all cause
    the devices within Milo to be initialised. Devices are named in the same way (exactly)
    Linux itself will name them. So, the first IDE disk will be called ''hda'' and
    its first partition will be ''hda1''. Use the show command to show what devices
    are available.


    File Systems Milo supports three file systems: MSDOS, EXT2 and ISO9660. So long
    as a device is available to it, Milo can list boot or run an image stored on one
    of these file systems. Milo''s default file system is EXT2 and so you you tell
    Milo that the file system is something other than that. All of the commands that
    use filenames allow you to pass the file system using the -t [filesystem] option.
    So, if you wanted to list the contents of a SCSI CD ROM, you type the following:


    ```

    MILO> ls -t iso9660 scd0

    ```


    Variables Milo contains some settable variables that help the boot process. If
