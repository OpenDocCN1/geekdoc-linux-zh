    Local print queues are for printers attached to a printer or serial port on your
    Red Hat Linux system.


    Remote print queues are attached to a different system which you access over a
    TCP/IP network.


    SMB print queues are attached to a different system which uses LAN Manager networking.


    ![](img/bef0eed6d460726bef2ee16ade180160_110_0.png)


