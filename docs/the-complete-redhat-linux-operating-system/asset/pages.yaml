    # D.4 How To Build Milo


    You build Milo seperately from the Kernel. As Milo requires parts of the

    kernel to function (for example interrupt handling) you must first configure

    and build the kernel that matches with Milo that you want to build. Mostly

    this means building the kernel with the same version number. So, milo-

    1.3.76.tgz will build against linux-1.3.76-tar.gz. Milo may build against a

    higher version of the kernel but again it may not. In the remainder

    of this discussion. I assume that your kernel sources and object files are

    stored in the subtree at /usr/src/linux.


    To build Milo. change your working directory to the milo source directory

    and invoke make with:


    ```

    make KSRC=/usr/src/linux config

    ```


    Just like the Linux kernel, you will be asked a series of questions


    Echo output to the serial port (MIN_SERIAL_ECHO) [y]


    It''s a good idea to echo kernel printk to /dev/tty0 if you can. If you can

    (and want to), then type "y", otherwise "n".


    Use Digital''s BIOS emulation code (not free) (MIN_DIGITAL_BIOS_EMU) [


    This code is included as a library which is freely distributable so long as it

    is used on an Alpha based system. The sources are not available. If you

    answer "n" then the freeware alternative BIOS emulation will be built. It''s

    sources are included with Milo.'
