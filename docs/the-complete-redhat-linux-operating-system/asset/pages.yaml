  md: '# CHAPTER 2. INSTALLING RED HAT LINUX/INTEL


    Non-Destructive Repartitioning This procedure is not supposed to destroy data
    in the disk partition(s) you are resizing; however, we recommend reliable backups
    of data you wish to keep in any case. You can use the fips utility, included in
    the Red Hat Linux CD in the dosutils directory, to resize your MS-DOS partition:
    we highly recommend reading the fips documentation. located the the fipsdocs subdirectory,
    before doing so.


    After repartitioning, you can use the Red Hat Linux installation system to create
    partitions for your Red Hat Linux system as described in Step-By-Step Installation.


    # Disk Partitions and Other Operating Systems


    Information on creating disk partitions to be compatible with other operating
    systems is available in several HOWTOs and Mini-HOWTOs. available on the Red Hat
    Linux CD in the doc/HOWTO and doc/HOWTO/mini directories.


    # How Many Partitions?


    If you wish to, you can install Red Hat Linux in a single large partition. However,
    we recommend the following (Please Note: If you plan to install all the software
    packages accompanying Red Hat Linux. you may need to use even larger partitions):


    A swap partition for virtual memory. If your computer has 16 MB of memory or less,
    you must create a swap partition; even if you have more memory, a swap partition
    is recommended. The size of your swap partition should be 16 MB or the same as
    the amount of memory in your computer, whichever is larger.


    A root partition to be mounted as / (the root directory) when your Red Hat Linux
    system boots; it only needs to contain things necessary to boot your system, as
    well as system configuration files. 30-50 MB works well for most systems.


    A usr partition, where much of the software on a Red Hat Linux system lives; this
    partition should be 150 400 MB, depending on how many packages you plan to install.'
