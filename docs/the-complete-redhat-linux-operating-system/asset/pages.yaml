  md: '# Preface


    # What is Red Hat Linux?


    Red Hat Linux is a open source operating system based on the Linux kernel, which
    was originally created by Linus Torvalds in 1991. Created by a network of developers
    working over the internet, many forming today, Red Hat currently over 20% of the
    market Red Hat Linux Server 5.2, demonstrates the power of free and open source
    development as well as the value of the enterprise-grade product. Plus the support
    by Red Hat and Red Hat Enterprise Software for the market


    Since the release of version 5.2, Red Hat Linux has been under testing for FIPS
    compliance. Our version meets all the criteria of A RHCSA (Red Hat Certified System
    Administrator), versatile, marketable and ready for Red Hat Linux.


    We are pleased to see the growing number of applications which rely on the Linux
    operating system, needs of which Red Hat Linux satisfies. Our various versions
    of the Server OS are supported by many developers, including developers and users
    of the Linux. Red Hat Linux is based on kernel 2.6, which provides many advanced
    features for Red Hat Server, which is free/free to use.


    As you notice, Red Hat Linux is easy to install and all configuration purposes'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'can walk through the process in as little as 15 minutes. The system itself
    is very flexible: you can install and uninstall individual software ''packages''
    with only a few clicks. It is easy to maintain package distributions that can
    be verified and corrected, and packages can be installed and uninstalled simply
    and reliably. Furthermore, Red Hat Linux is easy to administer with a set of graphical
    administration tools that remove the hassle of everyday system administration.
    Complete source code is provided for the freely distributable components of the
    system.


    # An Overview of This Book


    This manual is organized in the following fashion:


    +   Chapter 1. Quick Start contains enough information for experienced users to
    perform a basic installation of Red Hat Linux without any trouble. We recommend
    that new Linux users read through the manual before installing to get a good understanding
    of the system.


    +   Chapter 2. Installing Red Hat Linux Local provides instructions for installing
    Red Hat Linux on an almost or compatible PC.


    +   Chapter 3. Installing Red Hat Linux Virtual covers installing Red Hat Linux
    on a Digital Unix.


    +   Chapter 4. Installing Red Hat Linux SPARC covers installing Red Hat Linux
    on a Sun SPARC machine.


    +   Chapters 5 - 10 explain how to configure various services once you have installed
    Red Hat Linux, how to find documentation on your system, and how to use the system
    management and administration tools which accompany Red Hat Linux. They also provide
    an explanation of what''s special about Red Hat Linux system, where special files
    live and how to shut down Red Hat Linux.


    +   Appendices contain information about Red Hat Linux installation, a list of
    hardware requirements, the Red Hat Linux Frequently Asked Questions (FAQ), and
    instructions on obtaining technical support.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Thanks and Acknowledments


    We want to thank all the testers for de-bugging this system, especially the users
    of Red Hat Linux and for taking the time to submit bug reports from the front
    lines—many which have been fixed with Red Hat fixes since the "Halloween" release
    and earlier. We would also like to thank Linus Torvalds and the thousands of developers
    around the world for creating, truly, one of the wonders of distributed development.


    Thanks again, and welcome to the wonderful world of Linux!


    The Red Hat Development Team'
