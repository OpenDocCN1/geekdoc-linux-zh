  md: '# Appendix C


    # Intro to Alpha Systems and Processors


    This document is a brief overview of existing Alpha CPUs, chipsets and systems.
    It has something of a hardware bias, reflecting my own area of experese. Although
    I am an employee of Digital Equipment Corporation, this is not an official statement
    by Digital and any opinions expressed are mine and not Digital''s.


    # C.1 What is Alpha


    "Alpha" is the name given to Digital''s 64-bit RISC architecture. The Alpha project
    in Digital began in mid-1989, with the goal of providing a high-performance migration
    path for VAX customers. This was not the first RISC architecture to be produced
    by Digital, but it was the first to reach the market. When Digital announced Alpha,
    in March 1992, it made the decision to enter the merchant semiconductor market
    by selling Alpha microprocessors. Alpha is also sometimes referred to as Alpha
    AXP, for obscure and arcane reasons that aren''t worth pursuing. Suffice it to
    say that they are one and the same.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# 150APPENDIX C. INTRO TO ALPHA SYSTEMS AND PROCESSORS


    # C.2 What is Digital Semiconductor


    Digital Semiconductor (DS, http://www.digital.com/info/semiconductor/) is the
    business unit within Digital Equipment Corporation (Digital - we don''t like the
    name DEC) that sells semiconductors on the merchant market. Digital''s products
    include CPUs, support chipsets. PCI-PCI bridges and PCI peripheral chips for comms
    and multimedia.


    # C.3 Alpha CPUs


    There are currently 2 generations of CPU core that implement the Alpha architecture:


    +   - EV4

    - EV5


    Opinions differ as what "EV" stands for (Editor''s note: the true answer is of
    course "Electro Vlassic" See section C.12), but the number represents the first
    generation of Digital''s CMOS technology that the core was implemented in. So,
    the EV4 was originally implemented in CMOS4. As time goes by, a CPU tends to get
    a mid-life performance kick by being optically shrunk into the next generation
    of CMOS process. EV45, then, is the EV4 core implemented in CMOS5 process. There
    is a big difference between shrinking a design into a particular technology and
    implementing it from scratch in that technology (but I don''t want to go into
    that now). There are a few other wildcards in here: there is also a CMOS4S (optical
    shrink in CMOS4) and CMOS5L.


    True technophiles will be interested to know CMOS4 is a 0.75 micron process, CMOS5
    is a 0.5 micron process and CMOS6 is a 0.35 micron process.


    To map these CPU cores to chips we get:


    ```

    /21064-150,166/ EV4 (originally), EV4S (now)

    /21064-200/ EV4S

    ```'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# C.3. ALPHA CPUS


    /21064A-233,275,300/ EV45


    /21066/ LCA4S (EV4 core, with EV4 FPU)


    /21066A-233/ LCA45 (EV4 core, but with EV45 FPU)


    /21164-233,300,333/ EV45


    /21164A-417/ EV56


    /21264/ You''ll just have to wait and see...


    The EV4 core is a dual-issue (it can issue 2 instructions per CPU clock) superspipelined
    with integer unit, floating point unit and branch prediction. It is fully bypassed
    and has 64-bit internal data paths and tightly coupled 8Kbyte caches, each for
    Instruction and Data. The caches are write-through (they never get dirty).


    The EV45 has a couple of tweaks to the EV4 core: it has a slightly improved floating
    point unit, and 16KB caches, one for Instruction and Data (it also has cache parity).
    (Editor''s note: Neal Crook indicated in a separate mail that the changes to the
    floating point unit (FPU) improve the performance of the divider. The EV4 divider
    takes 34 cycles for a single-precision divide and 63 cycles for a double-precision
    divide (non data-dependent). In contrast, the EV45 divider takes typically 19
    cycles (34 cycles max) for single-precision and typically 29 cycles (63 cycles
    max) for a double-precision division (data-dependent).


    The EV5 core is a quad-issue core, also superspipelined, fully bypassed etc. It
    has tightly-coupled 8Kbyte caches, each for I and D. These caches are write-through.
    It also has a tightly-coupled 96Kbyte on-chip second-level cache (the Scache)
    which is 3-way associative and write-back (it can be dirty). The EV4-5 performance
    increase is better than just the increase achieved by clock speed improvements.
    As well as the bigger caches and quad issue, there are microarchitectural improvements
    to reduce producer/consumer latencies in some paths.


    The EV56 core is fundamentally the same microarchitecture as the EV5, but it adds
    some new instructions for 8 and 16-bit loads and stores (see Section C.8 Bytes
    and all that stuff). These are primarily intended for device drivers. The EV56
    core is implemented in CMOS6, which is a 2.0V process.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# APPENDIX C. INTRO TO ALPHA SYSTEMS AND PROCESSORS


    The 21064 was announced in March 1992. It uses the EV4 core, with a 128-bit bus
    interface. The bus interface supports the ''easy'' connection of an external second-level
    cache, with a block size of 256-bits (2 beats on the bus). The Bcache timing is
    completely software configurable. The 21064 can also be configured to use a 64-bit
    external bus, (but I''m not sure if any shipping system uses this mode). The 21064
    does not impose any policy on the Bcache, but it is usually configured as a write-back
    cache. The 21064 does contain hooks to allow external hardware to maintain cache
    coherence with the Bcache and internal caches, which this is.


    The 21064 uses the EV4 core and integrates a memory controller and PCI host bridge.
    Save to pins, the memory controller has a 64-bit data bus (but the internal caches
    have a block size of 256 bits, just like the 21064. a block fill takes 4 beats
    on the bus). The memory controller supports an external Bcache and external DRAMs.
    The timing of the Bcache and DRAMs is completely software configurable, and can
    be controlled to the resolution of the CPU clock period. Having a 4-beat to fill
    a cache block isn''t as bad since the DRAM access is done in page mode. Unfortunately,
    the memory controller does not support any of the esoteric DRAMs (SRAM, EDO or
    BEDO) or synchronous cache RAMs. The PCI bus interface is fully rev2.0 compliant
    and runs at upto 33MHz.


    The 21164 has a 128-bit data bus and supports split reads, with upto 2 reads outstanding
    at any time (this allows 100utilisation under best-case dream-on conditions, i.e.,
    you can theoretically transfer 128-bits of data on every clock). The 21164 supports
    easy connection of an external 3-rd level cache (Bcache) and has all the hooks
    to allow external systems to maintain full cache coherence with all caches. Therefore,
    symmetric multiprocessor designs are ''easy''.


    The 2164A was announced in October, 1995. It uses the EV56 core. It is nominally
    pin-compatible with the 21164, but all of the power pins that were +3.3V power
    on the 21164 have now been split into two groups: one group provided 2.0V power
    to the CPU core, the other group supplies 3.3V to the I/O cells. Unlike other
    implementations, the 21164 pins are not 5V-tolerate. The end result of this change
    is that the 21164 systems are, in general, not upgradable to the 21164A (though
    note that it would be relatively straightforward to design a 21164A system that
    could also accommodate a 21164). The 21164A also has a couple of pins to support
    the new 8 and 16-bit loads and stores. It also improves the cache for using synchronous
    SRAMs to implement the external'
  merge: -1
