  md: '# B.3. ETHERNET PARAMETERS


    When a parameter has commas, make sure you do not put a space after a comma.


    # B.3 Ethernet parameters


    The format of the ethernet parameter is as follows:


    ```

    ether=irq,base_addr,mem_start,mem_end

    ```


    This shouldn''t be necessary for many cards, however. An example would look like:


    ```

    ether=11,0x360

    ```


    **Please Note:** The last two parameters can be left out (if not all) of the time.
    Also, linux will only recognize the first ethernet card in a system. To get it
    to see two, you must use a LILO boot: parameter (not a module parameter) similar
    to:


    ```

    boot: linux ether=0,0,eth1

    ```


    (For more information about using more than one ethernet card, see the Multiple-Ethernet
    mini-HOWTO.)'
