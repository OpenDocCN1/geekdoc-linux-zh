    # Limitations of LILO


    LILO is subject to some limitations imposed by most PC BIOSes. Here are the “rules”
    of where your root partition must live if you want to install LILO on a hard drive:


    +   1. If you have 2 IDE (or EIDE) drives, your root partition must live'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'on one of them. This also includes any IDE CD-ROM drives for your primary controller.
    If you have one IDE hard drive, and one IDE CD-ROM on the primary controller,
    you must install your root partition on the hard drive.


    +   2. If you have one IDE (or EIDE) drive and one or more SCSI drives, your root
    partition must live either on the IDE drive or the SCSI drive that is ID 0. No
    other SCSI IDs will work.


    +   3. If you have SCSI only, your root partition must live on a drive at ID 0
    or ID 1. No other SCSI IDs will work.


    +   4. In any case, your Linux kernel (and, if you have a SCSI adaptor, your initial
    ramdisk) must live below cylinder 1023. For IDE (or EIDE) drives, this generally
    means be below the 512 MB mark for SCSI drives. it''s generally below the 1 GB
    mark. The easiest (and recommended) way to ensure this is to make sure your root
    partition is located between cylinders 0-1023. Some more recent BIOSes don''t
    have this limitation.


    # Adding Options to LILO Boot Command Line


    Finally, the installation program will ask if you wish to add default options
    to the LILO boot command. Any options you enter will be passed to the Linux kernel
    every time it boots. Press OK when finished.


    # Alternatives to LILO


    If you do not wish to use LILO to boot your Red Hat Linux system, there are a
    few alternatives:


    LOADLIN can load Linux from MS-DOS: unfortunately, it requires a copy of the Linux
    kernel (and an initial ram disk. if you have a SCSI adaptor) to be available on
    an MS-DOS partition. The only way to accomplish this is to boot your Red Hat Linux
    system using some other method (e.g., from LILO on a floppy) and then copy the
    kernel an MS-DOS partition. LOADLIN is available from http://unsite.unc.edu/system/Linux-boot/
    and sunsite''s various mirror sites.'
