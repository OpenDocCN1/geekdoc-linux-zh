    the | (pipe) character separating entries.


    Spool Directory This is the directory on the local machine where files are stored
    before printing occurs. Be careful to not have more than one printer queue use
    a given spool directory.


    File Limit Maximum size print job accepted. A size of 0 indicates no limit should
    be imposed.


    For local printers, the following are also required:


    Printer Device Usually /dev/lpt1, the name of the port which the printer is attached
    to. Serial printers are usually on /dev/ttyS? ports. You will need to manually
