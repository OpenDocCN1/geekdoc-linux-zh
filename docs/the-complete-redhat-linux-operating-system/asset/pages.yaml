- img_proc: true
  md: '# APPENDIX D. ALPHA MINILOADER HOWTO


    # D.7 Running the Flash Management Utility


    The run command is used to run the flash management utility. Before you start
    you will need a device available to Milo that contains the updateflash program.
    This (like vmlinux) can be gip''d. You need to run the flash management utility
    program from Milo using the (run) command:


    ```

    MILO> run fd0:fmu.gz

    ```


    Once it has loaded and initialised, the flash management utility will tell you
    some information about the flash device and give you a command prompt. Again the
    help command is most useful.


    ```

    Linux Milo Flash Management Utility V1.0

    Flash device is an Intel 28f008SA

    16 segments, each of 0x10000 (65536) bytes

    Scanning Flash blocks for usage

    Block 12 contains the environment variables

    FMU>

    ```


    Note on systems where environment variables may be stored and where there is more
    than one flash block (for example, the AlphaPC64) the flash management utility
    will look for a block to hold Milo''s environment variables. If such a block already
    exists, the flash management utility will tell you where it is. Otherwise, you
    must use the environment command to set a block and initialise it. In the above
    example, flash block 12 contains Milo''s environment variables.


    # D.7.1 The "help" command


    ```

    FMU> help

    FMU command summary:

    ```


    +   - List the contents of flash

    - program an image into flash

    - Quit

    - environment - Set which block should contain the environment

    - bootopt num - Select firmware type to use on next power up'
