  md: '# APPENDIX D. ALPHA MINILOADER HOWTO


    You can now boot Milo (and then Linux). You can load inload.exe and Milo directly
    from a file system that Windows NT understands such as NTFS or DOS on a hard disk.
    The contents OSLOADOPTIONS are passed to Milo which it interprets as a command.
    So, in order to boot Linux directly from Windows NT without pausing in Milo, you
    could pass the following in OSLOADOPTIONS


    ```

    boot sda2:vmlinux.gz root=/dev/sda2

    ```


    See section D.6 Milo''s User Interface for more information on the commands.


    Another (rather sneaky) way of loading loading Milo via the WNT ARC firmware is
    to put Milo onto an MS-DOS floppy and call it fwupdate.exe and choose the “Upgrade
    Firmware” option.


    # D.5.2 Loading Milo from the Evaluation Board Debug Monitor


    Evaluation boards (and often designs cloned from them) include support for the
    Alpha Evaluation Board Debug Monitor. Consult your system document before considering
    this method of booting Milo. The following systems are known to include Debug
    Monitor support:


    +   * AlphaPC64 (Section D.5.6)

    * EB64+ (Section D.5.6)

    * EB66+ (Section D.5.6)

    * EB164 (Section D.5.6)


    Before you consider this method, you should note that the early versions of the
    Evaluation Board Debug Monitor did not include video or keyboard drivers and so
    you must be prepared to connect another system via the serial port so that you
    can use the Debug Monitor. Its interface is very simple and typing shows a whole
    heap of commands. The ones that are most interesting include the word boot or
    load in them.'
