    Xconfig is a full-screen menu driven program that walks you through setting up
    your X server. XF86Setup is a graphical setup program distributed with XFree86
    which requires the VGA 16-color server program in order to run. xf86config is
    a line oriented program distributed with XFree86. If it is not easy to use as
    Xconfig, but it is included for completeness. If these utilities fail to provide
    a working XF86config file, you may have an unsupported card or you may need to
    write the config file by hand. Usually the former is the case, so check and make
    sure your card is supported before attempting to write the config file yourself.
    If your card is not supported by XFree86 you may wish to consider using a commercial
    X server. If you have questions about whether or not your video card is supported
    you can check out http://www.xfree86.org for information on XFree86.


    # 5.2.1 The X Server


    Provided you selected the proper video card at install time, you should have the
    proper X server installed. When later running Xconfig or xf86config, you need
    to make sure you select the same video card or the autprobe will fail.'
