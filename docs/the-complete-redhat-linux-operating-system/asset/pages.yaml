    # Making Floppies Under Linux


    To make floppies under Linux, you must have permission to write to /dev/fd0 (the
    3.5-inch floppy drive). Label a blank, formatted diskette "Boot Diskette" or something
    similar and insert it into the floppy drive (but don''t mount it). After mounting
    the Red Hat Linux CD, change to the images directory and use the following command:


    ```

    dd if=boot.img of=/dev/fd0 bs=1440k

    ```


    If you need to make a supplemental floppy, label a second diskette, insert it
    in the floppy drive, and then use the following command:


    ```

    dd if=supp.img of=/dev/fd0 bs=1440k

    ```


    # Installing Without Using a Boot Floppy


    Alternatively, if you have MS-DOS installed on your computer, you can boot the
    installation system directly from the CD without making floppies. To do this,
