    # 2.4.17  Setting a Root Password


    After you have set up your system''s timezone, the installation program prompts
    you to set a root password for your system: this is the password you will use
    to log into your Red Hat Linux system for the first time.


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice: if the two passwords
    do not match, the installation program will ask you to enter them again (see Figure
    2.16).


    You ought make the root password something you can remember, but not something
    that is easy for someone else to guess. Your name, your phone number, qwerty,
    password, root. 123456, and anteater are all examples of poor passwords. Good
    passwords mix numerals with upper and lower case letters and do not contain dictionary
    words: Aard387vark or410VBttSW, for example. Remember that the password is case-sensitive.
    Write down this password and keep it in a secure place.


    Please Note: The root user (also known as the superuser) has complete access to
    the entire system; for this reason, logging in as the root user is best done only
    to perform system maintenance or administration, so that critical files are not
    inadvertently changed, moved, or deleted. Please see Section 8.1 for instructions
    on how to add a user for yourself after you reboot your system.


