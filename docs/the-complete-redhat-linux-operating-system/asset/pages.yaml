    package. Read the README file in the sendmail source for more details on creating
    sendmail configuration files. Also, O’Reilly & Associates publishes a good sendmail
    reference entitled sendmail by Bryan Colton.


    A common sendmail configuration is to have a single machine act as a mail gateway
    for all the machines on your network. For instance, Red Hat Software we have a
    machine mail.redhat.com that does all our mail. On that we simply need to add
