  md: '# 7.2. USING RPM


    +   - -i displays package information such as name, description, release, size,
    build date, install date, vendor, and other miscellaneous information.


    +   - -l displays the list of files that the package “owns”.


    +   - -s displays the state of all the files in the package. There are only two
    possible states, normal and missing.


    +   - -d displays a list of files marked as documentation (man pages, info pages,
    README’s, etc).


    +   - -c displays a list of files marked as configuration files. These are the
    files you change after installation to adapt the package to your system (sendmail.cf,
    passwd, inittab, etc).


    For those options that display file lists, you can add -v to your command line
    to get the lists in a familiar ls -l format.


    # 7.2.5 Verifying


    Verifying a package compares information about files installed from a package
    with the same information from the original package. Among other things, verifying
    compares the size, MD5 sum, permissions, type, owner and group of each file.


    rpm -V verifies a package. You can use any of the Package Selection Options list
    for querying to specify the packages you wish to verify. A simple use is rpm -V
    foo which verifies that all the files in the foo package are as they were when
    they were originally installed. For example:


    +   - To verify a package containing particular file:

    rpm -Vf /bin/vi


    +   - To verify ALL installed packages:

    rpm -Va


    +   - To verify an installed package against an RPM package file:

    rpm -Vp foo-1.0-1.1386.rpm'
