    # 2.3 Preparing to Install


    # 2.3.1 Creating the Boot and Supplemental Floppies


    Your Red Hat Linux/Intel CD set may include a boot diskette and supplemental diskette.
    If so, you may skip to Section 2.3.2. If not, you must create them.


    You need only a boot diskette if you are installing Red Hat Linux from CD-ROM
    or via NFS. You also need a supplemental diskette if you are installing from a
    hard disk, via FTP, or from a PCMCIA device.


    To create the boot and supplemental floppies, you need two blank, formatted, high-density
    (1.44 MB), 3.5-inch diskettes. The diskette images are located in the images directory
    on the Red Hat Linux CD or the FTP site where you get Red Hat Linux. Each image
    is a "snapshot" of the appropriate floppy diskette, which you need to transfer
    onto an actual floppy; you can do this using either MS-DOS or Linux.


