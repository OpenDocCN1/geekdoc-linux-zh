    This won''t work, however, unless the makewhat database has been created. Under
    Red Hat Linux, this is done by a cron job overnight. If you don''t leave your
    system running overnight the database won''t get created. If that is the case,
    just run:


    ```

    /etc/cron.weekly/makewhat.cron

    ```


    Note: This must be done as root.


    Once you''ve done that, you could enter man -k swap. That command would return:


    +   - man -k swap

    swap, swapoff (2) - start/stopping swap to file/device

    swap, swapoff (8) - enable/disable devices and files for \

    paging and swapping


