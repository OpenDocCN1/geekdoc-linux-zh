  md: '# Appendix F


    # Red Hat and Freely Distributable Software.


    # F.0.7 Red Hat History


    Linux, like Unix, is a very modular operating system. The skills required to select.
    compile. link. and install. the various components that are needed for a complete
    Linux OS are beyond the experience of most people who might want to use Linux.
    The various Linux distributions go a long way towards solving this for the average
    Linux user, but most do not address the problem of how to upgrade your Linux system
    once you get it successfully installed. Most users found it easier to delete their
    whole Linux system and reinstall from scratch when they needed to upgrade.


    The Red Hat distribution makes Linux easier to install and maintain by providing
    the user with advanced package management. graphical (point and click!) system
    installation and control, and system administration tools.


