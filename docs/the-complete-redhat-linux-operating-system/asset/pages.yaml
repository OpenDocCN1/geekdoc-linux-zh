    each service you may need to start at boot time or when entering another runlevel.
    Services include things like networking, nfs, sendmail, httpd, etc. Services do
    not include things like setserial that must only be run once and then exited.
    Things that should go in rc.local or rc.serial.


    If you want rc.local, it should be in /etc/rc.d. Most systems include one even
    though it doesn''t do much. You can also include an rc.serial in /etc/rc.d if
    you need to do serial port specific things at boot time.


    The chain of events is as follows:


    +   - The kernel looks in several places for init and runs the first one it finds

    - init runs /etc/rc.d/rc.sysinit

    - rc.sysinit does a bunch of necessary things and then runs rc.serial (if it exists)

    - init runs all the scripts for the default runlevel.

    - init runs rc.local


    The default runlevel is decided in /etc/inittab. You should have a line close
    to the top like:


    ```

    id:3:initdefault:

    ```


    From this, you''d look in the second column and see that the default runlevel
    is 3, as should be the case for most systems. If you want to change it, you can
    edit /etc/inittab by hand and change the 3. Be very careful when you are messing
    with inittab. If you do mess up, you can fix it by rebooting and doing:


    ```

    LILO boot: linux single

    ```


    This *should* allow you to boot into single user mode so you can fix inittab.


