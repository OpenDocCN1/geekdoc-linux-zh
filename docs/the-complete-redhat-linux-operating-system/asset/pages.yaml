  md: '# Building a modularized kernel


    Only Red Hat Linux/Intel and Red Hat Linux/SPARC support modular kernels; Red
    Hat Linux/Alpha users must build a monolithic kernel (see Section 5.1.3 below).


    These instructions provide you with the knowledge required to take advantage of
    the power and flexibility available through kernel modularization. If you do not
    wish to take advantage of modularization, please see Section 5.1.3 for an explanation
    of the different aspects of building and installing a monolithic kernel. It is
    assumed that the kernel-source package has been previously installed and all commands
    are issued in the directory usr/src/linux.


    It is important to begin building a kernel with the source tree in a known condition.
    Therefore, it is recommended that you begin with the command make mrproper This
    will remove any configuration files along with the remains of any previous builds
    that may be scattered around the source tree. Now you must create a configuration
    file that will determine which components to include in your new kernel. Depending
    upon your hardware and personal preferences there are three methods available
    to configure the kernel.


    +   - make config An interactive text program. Components are presented and you
    answer with Y (yes), N (no), or M (module)

    - menuconfig A graphic menu driven program. Components are presented in a menu
    of categories, you select the desired components in the same manner used by the
    Red Hat Linux installation program. Toggle the tag corresponding to the item you
    wanted: Y (yes), N (no), or M (module)

    - xconfig An X Windows program. Components are listed in different levels of menus,
    components are selected using a mouse. Again, select Y (yes), N (no), or M (module).


    In order to use kerneld (see Section 8.6 for details) and kernel modules you must
    answer Yes to kerneld support and module version (CONFIG_MODVERSIONS) support
    in the configuration. If you want to build a kernel with a configuration file
    (/usr/src/linux/.config) that you have already created with one of the above methods,
    you can omit the'
