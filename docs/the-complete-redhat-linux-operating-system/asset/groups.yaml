    ## 第 9 章

    ## Glint


    Red Hat 提供了一个图形化工具来帮助软件包的安装和卸载。它被称为 Mint（图形化安装工具），并在 Windows 下运行。它允许对软件包进行简单的安装、卸载、查询和验证。其界面与许多文件管理器相似，且简单易用。


    在 Mint 中，操作是通过选择要操作的软件包，然后通过按钮选择操作类型完成的。安装软件包会将该软件包的所有组件放置在您的系统中。卸载软件包会移除其所有痕迹，但您修改过的配置文件除外。升级软件包则会安装新可用的版本，并卸载之前安装的其他版本。这允许您快速升级到软件包的最新版本。


    查询操作允许您查看已安装或可用软件包的详细信息。您可以查看软件包的描述、构建位置和时间、软件包中的文件以及其他属性。所有内容都经过了清晰的标记，以减少您查找它们的时间。


    使用 Mint 执行所有这些操作与从命令行使用 `rpm` 是相同的。然而，Mint 的图形化特性使得这些操作变得更加简单。处理 Mint 的通常方法是显示可用的软件包和文件，选择要操作的对象，然后按下执行操作的按钮。例如，您只需点击几次即可安装多个软件包。


    ### 9.1 启动 Mint


    要启动 Mint，只需从任何终端运行即可。这将弹出一个与图 9.1 所示的窗口。任何用户都可以使用 Mint 查询和验证软件包，但如果您需要安装、卸载或升级软件包，请务必以
    root 身份运行 Mint。


    Mint 界面有两个主要部分。左侧部分允许您浏览并选择安装在系统上的软件包。右侧包含操作所选软件包的按钮。


    ![](img/bef0eed6d460726bef2ee16ade180160_)


    ### 9.2 软件包显示


    Mint 中的每个文件夹图标都代表一组软件包。每个组都可以包含其他组，这允许软件包以灵活的位置存在。组被用于将功能相似的软件包放置在相似的位置。例如，Red
    Hat 包含了许多应用程序，如编辑器和电子表格。所有基于文本的程序都出现在“Applications”（应用程序）组中。在该组内部，还有针对所有出厂编辑器的分组。


    按照惯例，组的写法与 UNIX 路径相同。首先编写顶级组，随后的组通过斜杠分隔组名。这意味着绘图程序出现在 Applications/Graphics 组中。


    要查看组内的软件包和子组，请双击组文件夹图标上的鼠标左键。窗口将切换并显示软件包包含的内容。软件包显示的顶行显示了您当前查看的组，以及通往当前组的路径组。要返回之前查看的组，请双击“Back”（返回）文件夹，它始终位于文件夹的左上角（尽管它经常随着滚动而移出）。


    如果您想在新窗口中查看子组，请双击其文件夹上的鼠标中间键。如果您的鼠标只有两个按钮，请同时点击两个。这将创建一个包含该组的新窗口。


    ### 9.2.1 上下文敏感菜单


    在软件包窗口的任何图标上点击鼠标右键，都会弹出一个小的上下文敏感菜单。它包含的具体项目取决于您点击的确切位置。它们都包含选择或取消选择项目的选项，并且许多选项还允许您安装、卸载、查询、升级或验证您点击的项目。稍后会有关于如何进行这些操作的更多信息。


    要从上下文敏感菜单中选择项目，请按住图标上的鼠标右键。在按住右键的同时，将鼠标指针移动到您想要选择的项目上（该项目将变为高亮）。释放右键以选择该项目并消失菜单。


    ### 9.2.2 选择软件包


    要选择单个软件包，请点击它的鼠标左键。您会注意到软件包图标周围出现了一个细边框（如图 9.2 所示），显示它当前被选中状态。要取消选择，请点击它的鼠标左键，边框将消失。当前选中的软件包数量始终显示在窗口底部。组的文件夹图标显示该组内已选中的软件包数量，或者如果全部选中，则显示“All”（全部）。


    ![](img/bef0eed6d460726bef2ee1ade180160_)


    图 9.2：在 Mint 中选择软件包


    软件包的上下文敏感菜单也允许方便地选择和取消选择。在软件包图标上使用“select”（选择）和“unselect”（取消选择）选项可以选择或取消选择该软件包，而在组文件夹图标上使用这些选项则可以选择和取消选择该组中的所有软件包。使用这些菜单选择软件包组比逐个选择每个软件包要快得多。


    ### 9.2.3 查看可用软件包


    要查看可供安装的软件包，请从任何 Mint 窗口选择“Available”（可用）按钮。片刻后，将出现一个图 9.3 所示的新窗口。标题中的差异表明此窗口正在列出您可能安装的软件包。在这些软件包之间导航并选择它们的方法与其他窗口相同。


    如果收到来自 Mint 的错误消息，显示其找不到 RPM，请查看下方的“Configuration”（配置）部分。


    ### 9.3 配置


    ![](img/bef0eed6d460726bef2ee1ade180160_)


    Mint 需要的唯一配置是新 RPM 的路径。当您使用 Red Hat CD-ROM 时，此路径可能是 `/mnt/cdrom/RPMs`，这是 Mint
    的默认路径。如果您从互联网下载 RPM 或想通过 NFS 挂载的 CD-ROM 安装 RPM，则此路径对您来说是不同的。


    ![](img/bef0eed6d460726bef2ee1ade180160_)


    要更改此路径，首先确保关闭所有列出可用软件包的窗口。然后从剩余的窗口中选择“Configuration”（配置）选项。这将打开一个如图 9.4 所示的对话框。在这里，您可以输入您想要查看的
    RPM 的完整路径。选择“Save”（保存）按钮将保存此路径，使其成为未来 Mint 会话的默认值。“Default”（默认）按钮将把路径恢复为 Mint
    启动时使用的路径。


    '
