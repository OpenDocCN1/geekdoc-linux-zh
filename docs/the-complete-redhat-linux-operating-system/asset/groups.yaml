    # D.7. 运行闪存管理工具


    help - 打印此帮助文本

    FMU>


    注意，environment 和 beboot 命令仅适用于 EB66+、AlphaPC64 和 EB164 系统（及其克隆版本）。


    ## D.7.2 “list”命令


    “list”命令显示闪存内存的当前使用情况。当存在多个闪存块时，会显示每个闪存块的使用情况。在下面的示例中，你可以看到 Windows NT ARC 使用块
    4:7 和 15。


    ```

    FMU> list

    Flash blocks: 0:DBM 1:DBM 2:DBM 3:WNT 4:WNT 5:WNT 6:WNT 7:WNT 8:MILO

    9:MILO 10:MILO 11:MILO 12:MILO 13:U 14:U 15:WNT

    Listing flash Images

    Flash image starting at block 0:

    Firmware Id: 0 (Alpha Evaluation Board Debug Monitor)

    Image size is 191248 bytes (3 blocks)

    Executing at 0x300000

    Flash image starting at block 3:

    Firmware Id: 1 (Windows NT ARC)

    Image size is 277664 bytes (5 blocks)

    Executing at 0x300000

    Flash image starting at block 8:

    Firmware Id: 7 (Milo/Linux)

    Image size is 217896 bytes (4 blocks)

    Executing at 0x200000

    FMU>

    ```


    ## D.7.3 “program”命令


    闪存管理工具包含一个 Milo 闪存镜像的压缩副本。“program”命令允许你将此镜像写入闪存。该命令允许你退出，但在运行之前，你应该使用“list”命令查看应该将
    Milo 放在哪里。如果 Milo 已经存在于闪存中，闪存管理工具将提供覆盖选项。


    # 18 附录 D. ALPHA MINILOADER 使用指南


    FMU program

    Image is:

    Firmware Id: 7 (Milo/Linux)

    Image size is 217896 bytes (4 blocks)

    Executing at 0x200000

    Found existing image at block 8

    Overwrite existing image? (N/y)? y

    Do you want to do this (y/N)? y

    Deleting blocks ready to program: 8 9 10 11

    Programming image into flash

    Scanning Flash blocks for usage

    FMU>


    请等待操作完成后再关闭系统电源。

    注意：我无法强调，在这里你必须非常小心，不要覆盖你可能需要的现有闪存镜像，否则会导致你的系统失效。一个非常好的规则是永远不要覆盖 Debug Monitor（调试器）。


    ## D.7.4 “environment”命令


    此命令选择一个包含 Milo 环境变量的块。


    ## D.7.5 “bootopt”命令


    这与 Milo 的“bootopt”命令相同。参见（Section D.6.4  “bootopt”命令）。


    ## D.7.6 “quit”命令


    这个命令其实没有任何意义。闪存管理工具运行后，返回 Milo（或其他任何程序）的唯一方法是重启。


    ## D.8 限制


    遗憾的是，这并不是一个完美的世界，而且如既往一样，你应该意识到一些限制。


    ## D.9 解决问题


    Milo 并不是加载 Linux 以外的操作系统，尽管它可以加载链接到在 Linux 相同内存位置运行（即 0xFFFFFC0003100000）的镜像。这就是闪存管理工具的功能。


    包含在 miniboot/palcode/blah 中的 PALcode 源码是正确的，但当使用最新的 gas 构建时会存在问题。如果你使用 Alpha Evaluation
    Board 工具包中提供的古老 aout gas，它们就可以构建（它们就是这样构建的）。我正在尝试修复新的 gas。同时，作为解决方法，我为支持的板卡提供了预编译的
    PALcode，David Mosberger-Tang 在他的 ftp 站点上提供了修复后的 gas。


    ## D.9 解决问题


    这里是一些人们遇到的常见问题及其解决方案。


    从评估板调试器读取 MS-DOS 软盘。许多人报告说，在使用 Digital Alpha 评估板（如 AlphaPC64）提供的评估板调试器时，从软盘读取文件会遇到问题。通常，调试器可以正常加载第一个扇区，但随后会进入无限循环并抱怨存在“坏道”。显然，调试器预期的
    DOS 文件系统与 Linux 的 DOSFS 实现之间存在不兼容性。简而言之：如果你遇到这个问题，请使用 DOS 写入软盘。例如，如果加载文件 milo.cab
    失败，请使用一台 DOS 机器，插入软盘然后执行：


    ```

    copy a:milo.cab c:

    copy c:milo.cab a:

    del c:milo.cab

    ```


    然后再次从该软盘启动。这通常能解决问题。


    Milo 显示一长串 0 且不接受输入。这通常发生在 Milo 被构建为作为次级控制设备时。在这种情况下，Milo 将回显输出到 COM1 并也从那里接受输入。这对于调试非常有帮助，但如果你连接了除终端以外的设备，就没那么妙了。如果发生这种情况，请断开设备或关闭电源，直到
    Linux 内核启动。一旦 Linux 启动并运行，一切都将按预期工作。


    ## D.10 致谢


    我要感谢：


    - Eric Rasmussen 和 Eileen Samberg，PALcode 的作者。

    - Jim Paradis 提供的键盘驱动程序和原始 MILO 接口。

    - Jay Estabrook 提供的帮助和错误修复。

    - David Mosberger-Tang 提供的免费 BIOS 仿真以及他的支持与鼓励。

    - 最后（也是同样重要的）Linus Torvalds 提供的定时器代码和他的内核。


    Milo 还有许多事情需要完成。如果你想自己添加某些内容，请告诉我 david.rusling@reo.mts.dec.com，以免我们进行重复劳动。


    最后，非常感谢 Digital 生产了如此出色的芯片（并付钱让我做这件事）。


