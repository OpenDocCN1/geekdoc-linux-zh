    # 前言


    # 什么是红帽 Linux？


    红帽 Linux 是一种基于 Linux 内核的开源操作系统，最初由 Linus Torvalds 在 1991 年创建。它由一个在互联网上工作的开发者网络创建，其中许多成员至今仍活跃在如今。红帽目前占据了超过
    20% 的市场份额。红帽 Linux Server 5.2 展示了自由开源开发的力量以及企业级产品的价值。此外，还有红帽和红帽企业软件对市场的支持。


    自 5.2 版本发布以来，红帽 Linux 一直处于 FIPS 合规性测试中。我们的版本符合 RHCSA（红帽认证系统管理员）的所有标准，多功能、具有市场竞争力并已为红帽
    Linux 准备就。


    我们很高兴看到依赖 Linux 操作系统的应用程序日益增，而红帽 Linux 满足了这些需求。我们的多个服务器操作系统得到了许多开发者的支持，包括 Linux
    的开发者和用户。红帽 Linux 基于内核 2.6，该内核为红帽服务器提供了许多高级功能，且该服务器是免费使用的。


    正如你所注意到的，红帽 Linux 易安装，所有的配置过程最可以在 15 分钟内完成。系统本身非常灵活：你只需点击几次即可安装和卸载单个软件“包”。维护可以验证和纠正的软件包发行非常容易，而且包可以简单可靠地安装和卸载。此外，红帽
    Linux 通过一套图形化管理工具易于管理，这些工具消除了日常系统管理的烦恼。系统中的自由分发组件提供了完整的源代码。


