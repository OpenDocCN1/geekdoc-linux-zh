    许多软件包为了正常运行，依赖于安装在系统中的其他软件软件包或库。例如，许多图形化系统管理工具需要 python 软件包。为了确保你的系统拥有完全功能所需的所有软件包，Red
    Hat Linux 在你每次安装或卸载软件时都会检查依赖关系。


    在你完成要安装的软件包选择后，安装程序会检查所选软件包列表依赖关系。如果任何软件包需要另一个你未选择安装的软件包，程序将列出这些未解决的依赖关系，并提供解决它们的机会（见图
    2.14）。如果你直接按“OK”，程序将通过将所有所需的软件包添加到已选列表中自动解决它们。


    ### 软件包安装


    在解决所有软件包依赖关系后，安装程序开始安装软件包：它会在你的 Red Hat Linux 系统的 /tmp/install.log 留下一份完整的安装日志。


    ### 2.4.12 选择键布局


    在完成所有选择软件包的安装后，安装程序列出可安装的键布局列表（见图 2.15）。选择你希望在 Red Hat Linux 系统上使用的键布局并按回车键：安装程序会立即安装该键布局。


    如果你在启动 Red Hat Linux 系统后想要更改键布局，可以使用 /usr/sbin/kbdconfig 命令。


    ### 2.4.13 配置鼠标


    要配置鼠标，请选择与你的鼠标最匹配的类型并按回车键。如果你有一个双键鼠标，并想通过同时点击左键和右键来模拟第三个键（中键），请选择“Emulate 2 Buttons”。


    如果你选择串口鼠标，下一个对话框将提示你鼠标连接的串口（COM）端口。选择正确的端口并按 `Enter`。


    > **请：** 如果你的鼠标连接到 PS/2 鼠标端口，无论它是什么种鼠标，都应该选择“PS/2 Mouse”。


    如果你在启动 Red Hat Linux 系统后想要更改鼠标配置，可以使用 /usr/sbin/mouseconfig 命令。


    ### 2.4.14 配置 Windows


    设置好鼠标后，如果你安装了 X 软件包，安装程序将给你一个配置网络的机会。如果你没有选择 X，可以跳到下方的 2.4.15。


    ## 2.4 逐步安装步骤


    ![](img/bef0eed6d460726bef2ee16ade180160_40.png)

    图 2.14：未解决的依赖关系


    ### 配置 X Server


    如果你想使用 XFree6，安装程序会列出显示器列表。从列表中选择你的显卡并按回车键。如果你的显示器没有出现在列表中，你可以选择 `Custom`。如果你选择了
    `Custom`，配置程序将提示你选择显示器的水平同步和垂直同步范围（这些值通常可以在文档或制造商说明中找到）。


    **请：** 不建议选择一个与你的显示器“相似”的显示器，除非你确定所选显示器的性能没有超过你显示器的能力。如果你这样做，可能会导致显示器超频并损坏它。


    如果你想使用 XFree6，安装程序会列出显卡列表。从列表中选择你的显卡并按回车键。如果你的显卡没有出现在列表中，你可以选择 `Unlisted`。如果你选择了
    `Unlisted`，配置程序将允许你进行配置。


    接下来，配置程序将提示你显卡上安装的显存大小。如果你不确定，请查阅显卡附带的文档。选择比可用更多的内存不应损坏你的显卡，但 XFree6 服务器可能无法正常启动。


    如果你选择的显卡可能带有时钟芯片（clockchip），配置程序将列出时钟芯片列表。推荐的选择是“No Clock Setting”，因为在大多数情况下 XFree6
    可以自动检测到时钟芯片。


    最后，配置程序提示你选择想要使用的视频模式；按空格键选择一个或多个模式。随后配置程序会将包含你所有选择的配置文件写入 /etc/X11/XConfig。


    ### 2.4.15 配置网络


    在协助你配置 X server 后，安装程序将给你一个配置（或重新配置）网络的机会。如果你从 CD-ROM 或硬盘安装，安装程序会询问你是否要配置网络。如果你选择
    No，你的 Red Hat Linux 系统将是一个单机工作站。如果你选择 Yes，可以按照下文所述配置网络。


    如果你通过 NFS 或 FTP 安装 Red Hat Linux，你已经配置了临时网络信息。安装程序将为你提供三个选择：


    - 保留用于安装的设置：你之前输入的所有网络信息将成为系统永久配置的一部分。

    - 重新配置网络；安装程序将显示下面的网络配置对话框，并使用你在安装期间使用的值作为默认。如果你的系统将安装在与安装 Red Hat Linux 时不同的网络，请选择此项。

    - 完全不设置网络：你的系统将不会配置网络。如果你通过网络安装了系统，但将其作为单机工作站使用，请选择此项。


    '
