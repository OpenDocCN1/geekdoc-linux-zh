- md: '

    ## C.10. Porting


    The ability of any Alpha-based machine to run Linux is really only limited by
    your ability to get information on the gory details of its innards. Since there
    are Linux ports for the E66, EB64+ and EB164 boards, all systems based on the
    21066, 21064/APECS and 21164/ALCOR should run Linux with little or no modification.
    The major thing that is different between any of these motherboards is the way
    that they route interrupts. There are three sources of interrupts:


    - on-board devices

    - PCI devices

    - ISA devices


    All systems use an Intel System I/O bridge (SIO) to act as a bridge between PCI
    and ISA (the main I/O bus is PCI, the ISA bus is a secondary bus used to support
    slow-speed and ''legacy'' I/O devices). The SIO contains the traditional pair
    of daisy-chained 8259s.


    Some systems (e.g., the Noname) route all of their interrupts through the SIO
    and thence to the CPU. Some systems have a separate interrupt controller and route
    all PCI interrupts plus the SIO (8259 output) through that, and all ISA interrupts
    through the SIO.


    Other differences between the systems include:


    - how many slots they have

    - what on-board PCI devices they have

    - whether they have Flash or EPROM


    ## C.11 More Information


    All of the DS evaluation boards and motherboard designs are license-free and the
    whole documentation kit for a design costs about $50. That includes all the schematics,
    programmable parts sources, data sheets for CPU and support chipset. The doc kits
    are available from Digital Semiconductor distributors. I''m not suggesting that
    many people will want to rush out and buy this, but I do want to point out that
    the information is available.


    Hope that was helpfull. Comments/updates/suggestions for expansion to Neal Crook,
    neal.crook@reo.mts.digital.com


    ## C.12 References


    http://www.research.digital.com/wrl/publications/abstracts/TN-13.h

    Bill Hamben, Jeff Mogul, Brian Reid, Alan Eustace, Richard Swan, Mary Jo Doherty,
    and Joel Bartlett. Characterization of Organic Illumination Systems. DEC WRL,
    Technical Note 13, April 1989.


    ## Appendix D


    ## Alpha Miniloader Howto


    This document describes the Miniloader, a program for Alpha based systems that
    can be used to initialize the machine and load Linux. The Alpha Linux Miniloader
    (to give it''s full name) is also known as Milo.


    ### D.1 Introduction


    This document describes the Miniloader for Linux on Alpha AXP (Milo). This firmware
    is used to initialize Alpha AXP based systems, load and start Linux and, finally,
    provide PALcode for Linux.


    ### D.1.1 Copyright


    The Alpha Miniloader (Milo) HOWTO is Copyright ©1995, 1996 David A Rusling.


    Copyright Like all Linux HOWTO documents, it may be reproduced and distributed
    in whole or in part. in any medium, physical or electronic, so long as this copyright
    notice is retained on all copies. Commercial redistribution is allowed and encouraged;
    however, the author would like to be notified of such distributions. You may translate
    this HOWTO into any language whatsoever provided that you leave this copyright
