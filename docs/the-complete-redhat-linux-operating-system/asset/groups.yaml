    由于 FSSTND 要求能够以只读方式挂载 /usr，因此任何写入日志文件或需要缓存（spool）或锁目录的程序可能将它们写入 /var 目录。FSSTND
    规定 /var 是


    > "... 变量数据文件。这包括缓存目录和文件、管理和日志数据，以及瞬性和临时文件。”


