    ## C.3. ALPHA 处理器


    - /21064A-233,275,300/ EV45

    - /21066/ LCA4S (EV4 核心，配备 EV4 FPU)

    - /21066A-233/ LCA45 (EV4 核心，但配备 EV45 FPU)

    - /21164-233,300,333/ EV45

    - /21164A-417/ EV56

    - /21264/ 你只能拭目以待……


    EV4 核心是一个双发射（它每个 CPU 时钟周期可以发射 2 条指令）的超流水线核心，带有整数单元、浮点单元和分支预测器。它采用全旁路设计，并拥有 64
    位内部数据路径和紧耦合的 8K 字节缓存，指令和数据缓存各一个。缓存为写通方式（它们永远不会变脏）。


    EV45 对 EV4 核心进行了若干调整：它拥有稍微改进的浮点单元和 16KB 缓存，指令和数据共用（它还具有缓存校验）。（编辑注：Neal Crook 在另一封邮件中指出，对浮点单元（FPU）的改进提高了除法器的性能。EV4
    除法器单精度除法需要 34 个周期，双精度除法需要 63 个周期（与取决于数据）。相比之下，EV45 除法器单精度除法通常需要 19 个周期（最多 34 个），双精度除法通常需要
    29 个周期（最多 63 个，取决于数据）。


    EV5 核心是一个四发射核心，同样是超流水线、全旁路等。它拥有紧耦合的 8K 字节缓存，分别用于 I 和 D。这些缓存是写通的。它还有一个紧耦合的 96K
    字节片上二级缓存（Scache），该缓存是 3 路关联且写回的（可以变脏）。EV4-5 的性能提升优于主频提升带来的增长。除了更大的缓存和四发射外，微架构的改进还减少了某些路径中生产者/消费者之间的延迟。


    EV56 核心在微架构上与 EV5 根本相同，但增加了一些用于 8 位和 16 位加载与存储的新指令（见章节 C.8 字节等）。这些指令主要用于设备驱动程序。EV56
    核心采用 CMOS6 工艺，这是一个 2.0V 工艺。


    ## 附录 C ALPHA 系统与处理器简介


    21064 于 1992 年 3 月发布。它使用 EV4 核心，带有 128 位总线接口。总线接口支持连接外部二级缓存，块大小为 256 位（总线上的 2
    个节拍）。Bcache 的时序完全可以通过软件配置。21064 还可以配置为使用 64 位外部总线（但不确定是否有任何上市系统使用这种模式）。21064 对
    Bcache 不施加任何策略，但它通常被配置为写回缓存。21064 包含钩子，允许外部硬件维持 Bcache 与内部缓存之间的缓存一致性。


    21064 使用 EV4 核心，并集成了内存控制器和 PCI 主桥。除去引脚外，内存控制器具有 64 位数据线（但内部缓存的块大小为 256 位，与 21064
    相同。填充一个块在总线端需要 4 个节拍）。内存控制器支持外部 Bcache 和外部 DRAM。Bcache 和 DRAM 的时序完全可以通过软件配置，并可以控制到
    CPU 时钟周期的分辨率。4 个节拍填充一个缓存块并不糟糕，因为 DRAM 访问是在页模式下进行的。遗憾的是，内存控制器不支持任何奇特的 DRAM（SRAM、EDO
    或 BEDO）或同步缓存 RAM。PCI 总线接口完全符合 rev2.0 标准，运行频率高达 33MHz。


    21164 具有 128 位数据线并支持拆分读取，任何时间最多有 2 个待处理读取（这在最佳情况的理想状态下允许实现 100% 的利用率，即理论上你可以在每个时钟周期传输
    128 位数据）。21164 支持轻松连接外部三级缓存（Bcache），并拥有所有钩子，允许外部系统与所有缓存维持完全缓存一致性。因此，对称多处理器设计是“容易”的。


    2164A 于 1995 年 10 月发布。它使用 EV56 核心。它在引脚上与 21164 兼容，但 21164 上所有的 +3.3V 电源引脚现在分为一组：一组为
    CPU 核心提供 2.0V 电源，另一组为 I/O 提供 3.3V。与其他实现不同，21164 的引脚不耐 5V。这种更改的结果是，21164 系统通常无法升级到
    2164A（尽管升级到 2164A 相对直接）。2164A 是第一个使用 2.0V 核心逻辑的 Alpha。2164A 是第一个使用 3.3V I/O 逻辑的
    Alpha。2164A 是第一个使用 1.5V I/O 逻辑的 Alpha。


    ## C.4. 2164 VS 2166 性能


    2164 和 2166 具有相同的微架构，但 2166 的主频更高。性能差异主要是由于主频造成的，但还有其他因素：


    - 在 2164(A) 和 2166(A) 上微架构相同，但 2166(A) 的主频更高。

    - 在 2164(AB) 和 2166(AB) 上微架构相同，但 2166(AB) 的主频更高。

    - 在 2164(C) 和 2166(C) 上微架构相同，但 2166(C) 的主频更高。

    - 在 2164(D) 和 2166(D) 上微架构相同，但 2166(D) 的主频更高。

    - 在 2164(E) 和 2166(E) 上微架构相同，但 2166(E) 的主频更高。


    ## C.5 关于时钟的少量说明


    目前的 Alpha CPU 都使用高频时钟，因为它们的微架构被设计为所谓的短周期设计。


    - 在 2164 和 2166 上，微架构相同，但 2166 的主频更高。

    - 在 2164(A) 和 2166(A) 上，微架构相同，但 2166(A) 的主频更高。

    - 在 2164(AB) 和 2166(AB) 上，微架构相同，但 2166(AB) 的主频更高。

    - 在 2164(C) 和 2166(C) 上，微架构相同，但 2166(C) 的主频更高。

    - 在 2164(D) 和 2166(D) 上，微架构相同，但 2166(D) 的主频更高。

    - 在 2164(E) 和 2166(E) 上，微架构相同，但 2166(E) 的主频更高。


    ## C.6. 芯片组


    DS 销售两种 CPU 支持芯片组。2107x 芯片组（又名 APECS）是 21064(A) 支持芯片组。2117x 芯片组（又名 ALCOR）是 21164
    支持芯片组。

