    ## CHAPTER 2. INSTALLING RED HAT LINUX/INTEL


    ![](img/bef0eed6d460726bef2ee16ade180160_39.png)

    Figure 2.10: Filesystem Configuration


    Additionally, Red Hat Linux allows you to mount NFS volumes when your system boots;
    this allows directory trees to be shared across a network. Choose Add NFS, then
    enter the hostname of the NFS server, the path to the NFS volume, and the local
    mount point for that volume (see Figure 2.11).


    ### 2.4.11 Selecting and Installing Packages


    After your partitions are configured and formatted, you are ready to select packages
    to install. You can select system components group together according to function,
    select individual packages, or select a combination of the two. Selecting System
    Components: for example: Development, Network Workstation, or Web Server. Select
    each component you wish to install and press Space installs all packages included
    with Red Hat Linux (see Figure 2.12).


    ### Formatting Partitions


    The next dialog presents a list of partitions to format. Most partitions should
    be formatted, especially if they are newly created; however, partitions such as
    /home or /usr/local do not need to be formatted if they contain data you wish
    to keep. Select each partition to format and press Space. If you wish to check
    for bad blocks while formatting each filesystem, select Check for bad blocks during
    format. Press OK.


    ### Individual Packages


    After selecting the components you wish to install, you may select or deselect
    individual packages. The installation program presents a list of packages available;
    select a group to examine and press Enter. The installation program presents a
    list of packages in that group which you may select or deselect using Space. You
    may view a detailed description of a package by pressing F (see Figure 2.13).
    When you are finished selecting individual packages, press OK in the Group dialog.


    ### Package Dependencies


    Many software packages, in order to work correctly, depend on other software packages
    or libraries to be installed on your system. For example, many of the graphical
    system administration tools require python packages. To make sure your system
    has all the packages it needs in order to be fully functional, Red Hat Linux checks
    dependencies each time you install or uninstall software.


    After you have finished selecting packages to install, the installation program
    checks the list of selected packages for dependencies. If any package requires
    another package which you have not selected to install, the program presents a
    list of these unresolved dependencies and gives you the opportunity to resolve
    them (see Figure 2.14). If you simply press OK, the program will resolve them
    automatically by adding all required packages to the list of selected packages.


    ### Package Installation


    After all package dependencies are resolved, the installation program begins to
    install packages: it leaves a complete log of what it installs in /tmp/install.log
    on your Red Hat Linux system.


    ### 2.4.12 Selecting a Keymap


    After it has finished installing all the packages you selected, the installation
    program presents a list of available keymaps to install (see Figure 2.15). Select
    the keymap you wish to use on your Red Hat Linux system and press Enter: installation
    program installs that keymap immediately.


    If you wish to change your keymap after you have booted the Red Hat Linux system,
    you may use the /usr/sbin/kbdconfig command.


    ### 2.4.13 Configuring a Mouse


    To configure your mouse, choose the mouse type that best matches your mouse and
    press Enter. If you have a 2-button mouse and want to emulate the third (middle)
    button by clicking the left and right buttons at the same time, choose Emulate
    2 Buttons.


    If you choose a serial mouse, the next dialog prompts you for the serial (COM)
    port your mouse is connected to. Choose the correct port and press `Enter`.


    > **Please Note:** If your mouse is connected to a PS/2 mouse port, you should
    select PS/2 Mouse, no matter what kind of mouse it is.


    If you wish to change your mouse configuration after you have booted your Red
    Hat Linux system, you may use the /usr/sbin/mouseconfig command.


    ### 2.4.14 Configuring Windows


    After setting up the mouse, if you installed the X packages, the installation
    program gives you an opportunity to configure networking. If you did not choose
    X, you may skip to 2.4.15 below.


    ## 2.4 STEP-BY-STEP INSTALLATION


    ![](img/bef0eed6d460726bef2ee16ade180160_40.png)

    Figure 2.14: Unresolved Dependencies


    ### Configuring an X Server


    If you wish to use XFree6, the installation program presents a list of monitors.
    Select your video card from the list and press Enter. If your monitor does not
    appear on the list, you may choose `Custom`. If you select `Custom`, configurator
    prompts you to select the horizontal sync and vertical sync range of your monitor
    (these values are generally available in the documentation or manufacturer).


    **Please Note:** It is not recommended to select a monitor "similar" to your monitor
    unless you are certain that the monitor you are selecting does not exceed the
    capabilities of your monitor. If you do so, it is possible you may overclock your
    monitor and destroy it.


    If you wish to use XFree6, the installation program presents a list of video cards.
    Select your video card from the list and press Enter. If your video card does
    not appear on the list, you may choose `Unlisted`. If you select `Unlisted`, configurator
    allows you to configure it.


    Next, configurator prompts you for the amount of video memory installed on your
    video card. If you are not sure, please consult the documentation accompanying
    your card. It ought not to damage your video card by choosing more memory than
    is available, but the XFree6 server may not start correctly.


    If the video card you selected might have a clockchip, configurator presents a
    list of clockchips. The recommended choice is No Clockchip Setting, since XFree6
    can automatically detect the proper clockchip in most cases.


    Finally, configurator prompts you to select the video modes you wish to use; select
    one or more modes by pressing Space. Configurator then writes a configuration
    file containing all of your choices to /etc/X11/XConfig.


    ### 2.4.15 Configuring Networking


    After assisting you in configuring an X server, the installation program gives
    you an opportunity to configure (or reconfigure) networking. If you are installing
    from CD-ROM or from a hard disk, the installation program asks you if you want
    to configure networking. If you choose No, your Red Hat Linux system will be a
    standalone workstation. If you choose Yes, you may configure networking as described
    below.


    If you are installing Red Hat Linux via NFS or FTP, you will have already configured
    temporary networking information. The install program offers you three choices:


    - Keep the setup you have been using to install with: all the networking information
    you entered previously becomes part of your system''s permanent configuration.

    - Reconfigure networking; the installation program presents the network configuration
    dialogs described below with the values you used during installation filled in
    defaults. Choose this if your system will be installed on a network other than
    the one you used to install Red Hat Linux.

    - Don''t set up networking at all: your system will not have networking configured.
    Choose this if you installed your system over a network, but it will be used as
    a standalone workstation.

