    ## 2.4. 分步安装


    ### 网络配置对话框


    在安装程序找到您的网卡后，会显示若干个用于配置 TCP/IP 网络的对话框。这些信息仅在安装过程中使用：您稍后可以配置永久的网络设置信息。如果您希望从机器将来“运行”的环境之外的其他网络进行安装，此功能可以提供更大的灵活性。图
    2.4 包含了示例网络信息。


    第一个对话框要求您输入 IP 和其他网络地址（参见图 2.5）。输入您安装期间使用的 IP 地址并按回车。安装程序会尝试根据您的 IP 地址推测子网掩码（Netmask）：如果掩码不正确，您可以进行更改。按回车。安装程序根据您的
    IP 地址和子网掩码猜测默认网关和主 DNS 服务器；如果不正确，您可以进行更改。选择 OK 继续。


    第二个对话框提示您输入域名、主机名和其他网络信息（参见图 2.6）。输入您系统的域名（Domain name）并按回车。安装程序会将域名传递到主机名（Host
    name）字段。您在域名之前使用的主机名将形成一个完全限定域名（FQDN）。如果您的网络有多个 DNS 服务器，您可以在“二级 DNS 服务器”和“三级 DNS
    服务器”字段中输入额外 DNS 服务器的 IP 地址。选择 OK 继续。


    ### 2.4.16 配置时钟


    设置网络后，安装程序会显示一个对话框帮助您配置 Red Hat Linux 系统的时区。


    如果您希望将硬件时钟（CMOS）设置为 GMT（格林尼治标准时间，也称为 UTC 或协调世界时），请选择“硬件时钟设置为 GMT”（Hardware clock
    set to GMT）。将硬件时钟设置为 GMT 意味着如果您的时区使用了夏令时，Red Hat Linux 系统将正确处理。大多数网络都使用 GMT。


    从列表中选择系统将运行的时区，并按回车。


    如果您想在启动 Red Hat Linux 系统后更改时区配置，可以使用 `/usr/sbin/timeconfig` 命令。


    ### 2.4.17 设置 root 密码


    设置好系统时区后，安装程序会提示您为系统设置 root 密码：这是您首次登录 Red Hat Linux 系统时使用的密码。


    root 密码长度至少为六个字符；您输入的密码不会显示在屏幕上。您必须输入两次密码：如果两个密码不匹配，安装程序将要求您重新输入（参见图 2.1）。您设置的
    root 密码应该是您能记住的，但不要别人别人轻易猜到的。良好的密码应该混合数字、大写和小字母，且不包含字典单词：name、phone number、qwerty、123456
    和 password 都是糟糕密码的示例。记住密码是区分大小写的。写下此密码并将其保存在安全的地方。请注意：root 用户（也称为超级用户）对整个系统具有完全访问权限；出于此原因，以
    root 用户身份登录最好仅执行系统维护，这样在您重启系统后，关键文件就不会被更改、移动或删除。


    ### 2.4.18 安装 LILO


    为了能够启动 Red Hat Linux 系统，您通常需要安装 LILO（Linux 加载器）。您可以在以下几个位置之一安装 LILO：


    主引导记录（MBR）是安装 LILO 的推荐位置，除非该处已安装了另一个操作系统（例如 System Commander 或 OS/2 的引导管理器）。当您的机器启动时，LILO
    会启动并显示启动提示符；如果您在系统中已在使用另一个加载器（如 OS/2 的引导管理器），可以安装根分区的第一个扇区；然后您可以设置该加载器来启动 LILO
    并引导 Red Hat Linux。软盘的第一扇区是上述选项的替代方案：要启动 Red Hat Linux，请将 LILO 软盘插入机器的软驱器并重启。LILO
    从软盘启动并显示启动提示符。选择您想要安装 LILO 的位置并按 OK。如果您不想安装 LILO，请按 Skip（跳过）。


    ### LILO 的局限性


    LILO 受限于大多数 BIOS 实施的某些限制。如果您想在硬盘上安装 LILO，以下是您的根分区必须所在位置的“规则”：


    - 如果您有两个 IDE（或 EIDE）驱动器，您的根分区必须位于其中之一上。这也包括主控制器上的任何 IDE CD-ROM 驱动器。如果您在主控制器上有一个
    IDE 硬盘和一个 IDE CD-ROM，则您 必须将根分区安装在硬盘上。

    - 如果您有一个 IDE（或 EIDE）驱动器和一个或多个 SCSI 驱动器，您的根分区必须位于 IDE 驱动器或 ID 为 0 的 SCSI 驱动器上。其他
    SCSI ID 无法工作。

    - 如果只有 SCSI，您的根分区必须位于 ID 为 0 或 ID 为 1 的驱动器上。其他 SCSI ID 无法工作。

    - 在任何情况下，您的 Linux 内核（如果您有 SCSI 适配器，还包括初始内存磁盘）必须位于柱道 1023 以下。对于 IDE（或 EIDE）驱动器，这通常意味着
    512 MB 标记以下；对于 SCSI 驱动器，通常位于 1 GB 标记以下。确保这一点最简单（也是推荐的）的方法是确保您的根分区位于柱道 0-1023 之间。某些较新的
    BIOS 没有此限制。


    ### 为 LILO 启动命令行添加选项


    最后，安装程序将询问是否向 LILO 启动命令添加默认选项。您输入的任何选项将在每次启动时传递给 Linux 内核。完成后按 OK。


    ### LILO 的替代方案




    如果您不想使用 LILO 启动您的 Red Hat Linux 系统，有几种替代方案：


    - LOADLIN 可以从 MS-DOS 加载 Linux：遗憾的是，它要求 Linux 内核副本（如果您有 SCSI 适配器，还包括初始内存磁盘）位于 MS-DOS
    分区上。实现此点的唯一方法是使用其他方法（例如从软盘上的 LILO）启动 Red Hat Linux 系统，然后将内核拷贝到 MS-DOS 分区。LOADLIN
    可从 http://sunsite.unc.edu/system/Linux-boot/ 以及 sunsite 的各种镜像站点获取。

    - SYSLINUX 是一个与 LOADLIN 非常类似的 MS-DOS 程序；它也可以从 ftp://sunsite.nc.edu/system/Linux-boot/
    以及 sunsite 的各种镜像站点获取。

    - 某些商业引导器（例如 System Commander）可以启动（但可能仍需要在 Linux 根分区中安装 LILO）。


