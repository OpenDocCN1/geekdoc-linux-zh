    # 198APPENDIX E. RED HAT LINUX FREQUENTLY ASKED QUESTIONS


    +   - You''d like to have a group of people work on a set of files in say, the
    "usr/lib/emacs/site-lsp" directory. You trust a few people to mess around in there,
    certain not everyone.


    +   - So you do "chown -R root:root /usr/lib/emacs/site-lsp". And you add the
    proper users to the group.


    +   - To allow the users to actually create files in the directory you do "chmod
    775 /usr/lib/emacs/site-lsp".


    +   - This is fine, but when a user creates a new file it gets the group of the
    users default group (usually users).


    +   - To prevent this you do "chmod 2775 /usr/lib/emacs/site-lsp" which causes
    everything in the directory to get created with the "emacs" group.


    +   - This is fine, but the new file needs to be mode 664 for another user in
    the emacs group. To do this make the default umask 002.


    +   - Well, all this works, except that if your default group is "users". every
    file you create in your home directory will be writable by everybody in "users"
    (usually everyone).


    +   - To fix this, make each user have a "private group" as their default group.


    At this point, by making the default umask 002 and giving everyone a private default
    group, you can easily set up groups which users can take advantage of without
    doing any magic. Just create the group, add the users, and do the above chown
    and chmod on the group''s directories.


    # E.4.2 Why doesn''t the zmh shipped with Red Hat work properly?


    We only ship zmh because it is part of the standard X11 distribution. zmh is basically
    shipped as-is from the X11 distribution, and is most likely broken. We''ve found
    that there are several better alternatives. If you want to use zmh mail, install
    the zmh RPM and the exmh RPM. exmh is a much better GUI mail reader than zmh.'
