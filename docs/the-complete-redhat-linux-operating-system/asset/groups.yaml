    - SP 位 7 是 TOY 时钟启动选项选择的镜像，闪存中的第一个镜像。


    因此，当 7 置空时，调试监控器将启动，因为它是闪存中的第一个镜像。带有位 7，将选择 TOY 时钟启动选项选择的镜像。调试监控器、Windows NT ARC
    固件和 Milo 都支持此启动选项，但你必须非常小心地使用它。特别是，你无法设置启动选项，以便下次系统启动时，Windows NT ARC 固件只允许你设置调试监控器或
    Windows NT ARC。


    要通过评估板调试监控器将 Milo 闪存，你需要一个可刷写的镜像。构建程序会生成 `milo.rom`，但你也可以使用板自带调试监控器软件中的 `makerom`
    工具制作镜像：


    ```

    makerom -v -i7 -1200000 Milo -o mini.flash

    ```


    （输入 makerom 查看参数含义，7 是 srom 使用的闪存镜像，-1200000 给镜像的加载地址为 `0x200000`）


    通过调试监控器命令 `fload`、`netload` 等将该镜像加载到内存的 `0x200000`，然后将镜像写入闪存：


    `AlphaPC64} flash 200000 8`


    （200000 是要写入内存的镜像位置，8 是你放置镜像的段号。闪存中有 16 个 1024*64 字节的段，调试监控器在段 0，Windows NT ARC
    固件在段 4）


    通过向 TOY 时钟写入镜像编号来设置 srom 将启动的镜像：


    `AlphaPC64} bootopt 131`


    （131 表示启动第 3 个镜像，129 = 第 1 个，130 = 第 2 个）


    关闭电源，开启跳线 7，你应该能看到调试监控器。


    ### EB66+


    EB66+ 与 Digital 制造的所有板卡一样，包含评估监控器，因此可以使用它加载 Milo（节 D.5.2 从调试监控器加载）。通常（尽管并非总是）设计源自这些系统的板卡包含了
    Windows NT ARC 固件（节 D.5.1 从 Windows NT ARC 固件启动）。提供了可从 Milo 运行的闪存管理工具，一旦 Milo
    运行，即可将其写入闪存（节 D.7 运行闪存管理工具）。该系统支持 Milo 环境变量。


    这些系统在闪存中有多个由跳线控制的镜像。两个跳线组为 J1，位于板底部。你通过跳线和保存在 TOY 时钟 NVRAM 中的启动选项来选择启动项（以及闪存中的
    Milo）。


    J18 的 7-8 脚置入表示启动选项描述的镜像。J18 的 7-8 脚置空表示通过评估板调试监控器写入镜像的方法与 AlphaPC64（节 D.5.6 AlphaPC64）相同。


    ### EB64+/Aspen Alpine


    EB64+ 有两个 ROM，其中一个包含 Windows NT ARC 固件（节 D.5.1 从 Windows NT ARC 固件启动），另一个包含调试监控器（节
    D.5.2 从调试监控器加载）。Aspen Alpine 略有不同，它只有一个 ROM：这包含了 Windows NT ARC 固件。


    ### Universal Desktop Box (Multilia)


    这是一个非常紧凑的基于 66 的系统，包含一个 TGA 设备。虽然你可以在盒子内刚好一张半高 PCI 卡，但最好等待 XFree 提供完整的 TGA 支持。它包含了
    Windows NT ARC。


    ### XL266


    XL266 是被称为 Avanti 的系统家族之一。它有一个包含 Alpha 芯片和缓存的扩展卡，以直角角度插入主板。该板卡可以替换同类的 Pentium
    板。


    其中一些系统配备了 SRM 控制台，但其他系统（特别是 XL266）仅在启动 Windows NT ARC 固件时才带有它。


    '
