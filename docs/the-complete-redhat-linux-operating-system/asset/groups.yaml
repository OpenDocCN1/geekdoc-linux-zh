    ### D.2 What is Milo?


    On Intel based PC systems, the BIOS firmware sets up the system and then loads
    the image to run from the boot block of a DOS file system. This is more or less
    what Milo does on an Alpha based system. however there are several interesting
    differences between BIOS firmware and Milo. not least of which is that Milo includes
    and uses standard Linux device drivers unmodified. Milo is firmware, unlike LILO,
    which relies on the BIOS firmware to get itself loaded. The main functional parts
    of Milo are:


    - 1. PALCode,

    - 2. Memory set up code (build page tables and turns on virtual addressing),

    - 3. Video code (BIOS emulation code and TGA (21030)),

    - 4. Linux kernel code. This includes real Linux kernel code (for example, the
    interrupt handling) or ersatz or mock Linux kernel,

    - 5. Linux block device drivers (for example, the floppy driver),

    - 6. File system support (ext2, MS-DOS and ISO9660),

    - 7. User inteface code (MILO),

    - 8. Kernel interface code (sets up the HWRPB and memory map for linux),

    - 9. NVRAM code for managing environment variables


    The following paragraphs describe these in more detail.


    ### D.2. WHAT IS MILO?


    Milo must tell what sort of system this is. how much memory there is and which
    of that memory is free. This does using the HWRPBB (Hardware Restart Parameter
    Block) data structure and associated memory cluster descriptions. These are placed
    at the appropriate place in virtual memory before control is passed to the Linux
    kernel.


