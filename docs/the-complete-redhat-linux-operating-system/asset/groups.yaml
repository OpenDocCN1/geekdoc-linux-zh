    ### 10.4.6 更多信息


    这只是 PAM 的介绍。系统在 `/usr/doc` 中包含了文本、HTML 和 PostScript 格式的更多信息，包括《系统管理员指南》、《模块编写者手册》、《应用程序开发者手册》以及
    PAM 标准 DCE-RFC 86.0。此外，可以在 Red Hat 网站获取文档，地址为：http://www.redhat.com/linux-info/pam/


    ## 10.5 启动过程、Init 和关机


    ### 10.5.1 System V Init


    本节是对启动过程内部原理的简要描述。它详细涵盖了机器如何使用 SysV Init 启动，以及与旧版本 Linux 中使用的原始 init 之间的区别。


    init 是内核在启动时运行的程序。它负责启动所有启动时需要运行的正常进程。这些包括允许你登录的 getty 程序、NFS 守护进程、FTP 守护进程以及你希望在机器启动时运行的任何其他。


    SysV Init 正在成为 Linux 世界控制启动时软件启动的标准。这是因为比传统的 BSD init 更容易使用，且更强大、更灵活。


    SysV init 与 BSD init 的不同之处在于，配置文件位于 `/etc` 的子目录中，而不是直接位于 `/etc` 下。该目录被称为 `rc.d`。在里面你会找到
    `rc.sysinit` 和以下目录：


    ```

    init.d

    rc0.d

    rc1.d

    rc2.d

    rc3.d

    rc4.d

    rc5.d

    rc6.d

    ```


    `init.d` 包含一组脚本。基本上，对于每个可能需要在启动时或进入另一个运行级别时启动的服务，你需要一个脚本。服务包括网络、nfs、sendmail、httpd
    等。服务不包括像 `setserial` 这样必须运行一次后退出的程序。这些是应该放在 `rc.local` 或 `rc.serial` 中的内容。


    如果你想要 `rc.local`，它应该位于 `/etc/rc.d` 中。大多数系统都包含一个，尽管它没做什么。如果你需要在启动时执行针对串口的特定操作，也可以在
    `/etc/rc.d` 中包含一个 `rc.serial`。


    事件链如下：


    - 内核在几个地方查找 init 并运行它找到的第一个

    - init 运行 `/etc/rc.d/rc.sysinit`

    - rc.sysinit 执行一系列必要操作，然后运行 `rc.serial`（如果存在）

    - init 运行默认运行级别下的所有脚本

    - init 运行 `rc.local`


    默认运行级别在 `/etc/inittab` 中决定。你应该在顶部附近有一如下所示的一行：


    ```

    id:3:initdefault:

    ```


    从这里，你可以查看第二列并看到默认运行级别是 3，大多数系统也应该是这种的。如果你想更改它，可以手动编辑 `/etc/inittab` 并更改 3。在动 `inittab`
    时要非常小心。如果你弄乱了，可以通过重启并执行以下操作来修复：


    ```

    LILO boot: linux single

    ```


    这*应该*允许你进入单用户模式，以便修复 `inittab`。


    现在，它是如何运行所有正确的脚本的？如果你在 `rc3.d` 中输入 1 -1，你可能会看到类似的内容：


