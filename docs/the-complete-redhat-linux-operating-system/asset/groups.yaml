    file contains information about the file systems that are mounted on the system.
    The /etc/resolv.conf file contains the configuration for the resolver, and the
    /etc/hosts file contains local mappings of host to addresses. The /etc/ld.so.conf
    file contains the configuration for the dynamic linker.


