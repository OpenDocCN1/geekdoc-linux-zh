    ## 8.4. NETWORK CONFIGURATION


    ![](img/bef0eed6d460726bef2ee16ade180160_114_0.png)


    Figure 8.11: Network Configuration Panel


    ![](img/bef0eed6d460726bef2ee16ade180160_114_1.png)


    Figure 8.12: Adding/Editing Hosts


    ### 8.4.2 Managing Hosts


    In the Hosts management screen you have the ability to add, edit, or-remove hosts
    from the /etc/hosts file. Adding or editing an entry involves identical actions.
    An edit dialog box will appear. simply type the new information and click Done
    when you are finished. See figure 8.12 for an example.


    ### 8.4.3 Adding a Networking Interface


    If you have added a networking interface to your machine since installing Red
    Hat Linux, or you didn''t configure your ethernet card at install time, you can
    configure it with a few clicks of a mouse. Begin by clicking on Interfaces in
    the main panel. This will bring up a window of configured devices with a row of
    available options, see figure 8.13.


    ![](img/bef0eed6d460726bef2ee16ade180160_115_0.png)


    Figure 8.13: Configured Interfaces


    To add a device, first click the Add button then select the type of interface
    you want to configure from the box that appears. (Figure 8.14)


    ![](img/bef0eed6d460726bef2ee16ade180160_116_0.png)


    Figure 8.14: Choose Interface Type


    ### PPP Interface


    Adding a PPP interface can be as simple as supplying the phone number, login name
    and password in the “Create PPP Interface” box shown in figure 8.15. In many cases
    some degree of customization will be needed to establish a PPP connection. Selecting
    the Customize button will allow you to make changes to the hardware, communication,
    and networking settings for the PPP interface.


    ![](img/bef0eed6d460726bef2ee16ade180160_116_1.png)


    Figure 8.15: Create PPP Interface


    ### SLIP Interface


    In order to configure a SLIP interface you must first supply a phone number, login
    name, and password. This will supply the initial parameters for the chat script
    needed to establish a SLIP connection. When you select the Done button an “Edit
    SLIP Interface” dialog will appear that enables you to further customize the Hardware,
    Communication and Networking parameters for SLIP.


    ### PLIP Interface


    To add a PLIP interface to your system you only have to supply the IP address,
    the remote IP address, and the Netmask. You can also select if you want to activate
    the interface at boot time.


    ### Ethernet, Arcnet, Token Ring and Pocket Adaptor Interfaces


    If you are adding an ethernet, arcnet, token ring or pocket adapter to your computer
    you will need to supply the information:


    - **Device**: This is determined by netconfig based on the devices already configured.

    - **IP Address**: Enter an IP address for your network device.

    - **Netmask**: Enter the network mask for your network device.

    - **Network**: This is determined based on the values supplied for IP address
    and Netmask.

    - **Broadcast**: This is determined based on the values supplied for IP address
    and Netmask.

    - **Activate at Boot**: If you want the device to be configured automatically
    when your machine selects this by clicking on the box.

    - **Configure with BOOTP**: If you have a BOOTP server on your network and would
    like to use it to configure the device select this by clicking on the box.


    After providing the configuration information for your new device, click **Done**.
    The device should appear in your “Interfaces” list as an inactive device. (The
    active column should have a label of “no”). To activate the new device highlight
    it with a mouse click and then click on the **Activate** button. If it does not
    come up properly, you may need to reconfigure it by clicking on **Edit**.


    ### 8.4.4 Managing Routes


    In the Routes management screen you have the ability to add, edit, or remove static
    networking routes. Adding or editing an entry involves identical actions, just
    like the Hosts panel. An edit dialog box will appear, simply type the new information
    and click Done when you are finished. See figure 8.16 for an example.


    ![](img/bef0eed6d460726bef2ee16ade180160_118_0.png)


    Figure 8.16: Adding/Editing Routes


    ## 8.5 Time and Date


    The time machine allows you to change the time and date by clicking on the appropriate
    part of the time and date display and clicking on the arrows to change the value.


    The system clock is not changed until you click on the Set System Clock button.


    Click on Reset Time to set the time machine time back to that of the system.


    CAUTION: Changing the time can seriously confuse programs that depend on the normal
    progression of time, and could possibly cause problems. Try to quit as many applications
    and processes as possible before changing the time or date.


    ## 8.6 Kernel Daemon Configuration


    As discussed in Chapter 5, Red Hat Linux includes “kerneld”, the Kernel Daemon,
    which automatically loads some software and hardware support into memory as it
    is, and unloads when it is no longer being used.


    The tool shown in Figure 8.17 manages the configuration file for kerneld. While
    kernel can load some things, such as filesystems, without explicit configuration,
    it needs to be told what hardware support to load when it is presented with a
    generic hardware request.


    ![](img/bef0eed6d460726bef2ee16ade180160_119_0.png)


    For instance, when the kernel wants to load support for ethernet, kerneld needs
    to know which ethernet card you have, and if your ethernet card requires special
    configuration, it needs to know about that, too.


    ### 8.6.1 Changing Module Options


    To change the options being given to a module when it is loaded, click on the
    line to select it, then click the Edit button. kernelcfg will bring up a window
    which looks like Figure 8.18. The options which kernelcfg knows about them (normally
    all available options) each have their own window.


    Normally, you will want to ignore the "Other arguments:” window. Some modules
    normally take no arguments: just in case, they have an "Arguments:” window which
    allows you to enter configuration information.


    ![](img/bef0eed6d460726bef2ee16ade180160_120_0.png)


    Figure 8.18: Editing Module Options


    ### 8.6.2 Changing Modules


    To change which module gets invoked to provide a generic service, such as an ethernet
    card or SCSI host adapter module, you need to delete the old one and add a new
    one. To delete a module, select it by clicking on it, then click on Delete. Then
    click on Add to add the new module, as explained in the following section.


    If you have changed your SCSI controller (scsi_hostadapter), remember to make
    a new initial ramdisk with the /sbin/mkinitrd command as documented in section
    5.1.2.


    ### 8.6.3 Adding Modules


    To add a module of any type, click on the Add button. You will be presented with
    a dialog box (Figure 8.19) asking you to choose a module type. Ethernet is eth.
    Token Ring is tr. SCSI controllers are scsi_hostadapter, and so on. Click OK to
    continue to the next dialog box. If there is more than one module which can be
    used for the module type you have chosen, you will be presented with a dialog
    box (Figure 8.20) which asks which module you want to use, and may also ask for
    specifics about the type of module; for ethernet, for example, you need to choose
    from eth0, eth1. etc etc. When you are done, click OK again to continue to specify
    any module options in the next dialog box (Figure 8.20), which is the same dialog
    box with which you are presented when you edit a module.


    ![](img/bef0eed6d460726bef2ee16ade180160_121_0.png)


    Figure 8.19: Adding a module


    ![](img/bef0eed6d460726bef2ee16ade180160_121_1.png)


    Figure 8.20: Selecting from available modules


    ### 8.6.4 Restarting Kerneld


    The changes that you make with the Kernel Daemon Configuration tool will be made
    in the file /etc/conf.modules, which kerneld reads whenever it is started. Once
    you have made changes, you can re-start kerneld by clicking on the Restart kerneld
    button. This will not cause any modules which are currently in use to be re-loaded,
    it will only notify kerneld to use the configuration when it loads more modules
    in the future.

