    # F.2 The Evolution of “Free Software"


    The Unix operating system was also developed on a cooperative basis by AT&T with
    the active support of many universities and research establishments. Many of the
    early Unix contributors were disappointed when AT&T began in the late 1970’s and
    1980’s to enforce their copyright terms over the use and distribution of Unix.
    This eventually resulted in the long and bitter legal battle between AT&T (and
    subsequently Novell who won the Unix copyrights from AT&T in 1991 and the University
    of California at Berkeley.


    In a response to this problem of individual control the Massachusetts Institute
    of Technology (MIT) in Cambridge, MA has, since 1984. Supported Richard Stallman’s
    efforts to launch a movement in the software development community to support
    the establishment of The Free Software Foundation (the FSF), and its GNU project.
    The name GNU follows in an early Unix tradition of using acronyms as program names,
    and stands for GNU’s Unix. The FSF continues to be head-quartered at MIT, and
    has enjoyed amazing success over the last decade with products like GNU C. GNU
    C++, Emacs, and'
