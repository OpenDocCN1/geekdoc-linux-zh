    ## CHAPTER 2. INSTALLING RED HAT LINUX/INTEL


    **Please Note:** Do not press random keys during the installation process; it
    may result in unpredictable behavior.


    ## 2.4 Step-By-Step Installation


    ### 2.4.1 Starting the Installation System


    Booting

    To begin installing Red Hat Linux, insert the boot floppy you just created into
    the floppy drive and reboot the machine (if you have MS-DOS installed on your
    machine, you can start installing directly from the CD-ROM: see Section 2.3.1
    above). The `boot:` prompt appears: press `Enter` to boot. Watch the boot messages
    to see whether the Linux kernel detects your hardware. If it does not properly
    detect your hardware, you may need to reboot and enter some options at the boot:
    prompt, e.g:


    ```

    boot: linux hdc=cdrom

    ```


    Press `Enter` to boot using those options. If you need to specify some boot options,
    please make note of them; they will be needed later.


    **Please Note:** Because Red Hat Linux supports installation on many different
    types of hardware, many drivers (including those for SCSI adapters, network cards,
    and many CD-ROMs) are not built into the Linux kernel used during installation;
    rather, they are available as modules and loaded as you need them during the installation
    process. You will have the chance to specify options for such drivers at the time
    they are loaded, and in fact these drivers ignore any options you specify for
    them at the boot: prompt. Please see Section 2.2.2 above for more information
    about drivers built into the installation system.


    ## Beginning the Installation


    After booting, the installation process begins by asking if you are using a color
    monitor (see Figure 2.2). Yes is the default; if you can''t distinguish a cursor
    or highlight `Tab` once, and then `Enter` to proceed. Next it presents a welcome
    message: press Enter to begin the installation. If you wish to abort the installation
    process, you may simply eject the boot floppy now and reboot your machine.


    ![](img/bef0eed6d460726bef2ee16ade180160_28_0.png)


    Figure 2.2: Beginning the Installation


    ### 2.4.2 PCMCIA Support


    After the welcome dialog, the installation program asks you whether you need using
    a PCMCIA device for installation (for example, a PCMCIA ethernet card for installing
    via NFS, or PCMCIA SCSI card for installing from CD) you should answer Yes: the
    installation program prompts you to insert the supplemental diskette. You should
    wait until the next dialog appears before inserting your PCMCIA card.


    ### 2.4.3 Selecting an Installation Method


    You can install Red Hat Linux via any of four basic methods (see Section 2.2.1,
    Installation Methods), some of which require the use of a supplemental diskette.
    To summarize:


    - CD-ROM: If you have a CD-ROM drive with the Red Hat Linux CD; does not require
    a supplemental diskette.

    - NFS: If you are installing from an NFS server which is exporting either the
    Red Hat Linux CD or a mirror of Red Hat Linux from the Red Hat FTP site; does
    not require a supplemental diskette.

    - Hard Drive: If you copied the Red Hat Linux files to one of your local hard
    drives; requires a supplemental diskette.

    - FTP: If you are installing directly from an FTP server; requires a supplemental
    diskette.


    The next dialog asks what type of installation method you wish to use (see Figure
    2.3). Highlight the appropriate choice and select OK, or press Enter. If you select
    FTP, or hard drive, and you''re not using PCMCIA support, the installation program
    prompts you to insert the supplemental diskette.


    #### CD-ROM Type


    If you choose to install Red Hat Linux/Intel from CD-ROM, the installation program
    prompts you for the type of CD-ROM:


    - IDE (ATAPI): Most CD-ROMs available for Intel-based PCs are IDE (also known
    as ATAPI) CD-ROMs. The install program checks for a CD-ROM on all available IDE
    devices before giving up.

    - SCSI: Select this if your CD-ROM is attached to a supported SCSI adapter: the
    installation program asks you to choose a SCSI driver. Choose the driver that
    most closely resembles your adapter. You may specify options for the driver if
    necessary; however, most drivers detect your SCSI adapter automatically.

    - Other: If your CD-ROM is neither an IDE nor a CD-ROM, it''s an “other”. The
    installation program presents a list of drivers for supported CD-ROMs; choose
    a driver and, if necessary, specify any driver options.


    ### 2.4.4 If You Are Installing via NFS


    If you are not installing Red Hat Linux via NFS, you may skip to Section 2.4.5
    below.


    ![](img/bef0eed6d460726bef2ee16ade180160_30_0.png)


    Figure 2.3: Selecting an Installation Method


    #### Choosing a Network Driver


    If you are installing via NFS, you must have a supported network card installed
    in your computer. The installation program prompts you to choose the driver that
    supports your network card and to specify any options necessary for the driver
    to locate and recognize the card. Most of the time, the driver can locate the
    card automatically by probing; however, it is possible that probing your hardware
    might cause your machine to hang. If this happens, reboot the machine, start the
    installation again, and specify driver options when you get to this step (see
    Appendix B).


    #### Configuring TCP/IP


    After the installation program has found your network card, it presents several
    dialogs for configuring TCP/IP. This information is only used during the installation
    process; this feature allows greater flexibility if you want to install from a
    network other than the one where the machine will “live”. The first dialog asks
    you for IP and other network addresses (see Figure 2.5). Enter the IP address
    you are using during installation and press Enter


    | Field | Example Value |

    | :--- | :--- |

    | IP Address | 10.0.2.15 |

    | Netmask | 255.255.255.0 |

    | Default Gateway | 10.0.2.254 |

    | Primary Nameserver | 10.0.2.1 |

    | Domain Name | redhat.com |

    | Hostname | pooh.redhat.com |


    Figure 2.4: Sample Networking


    The installation program attempts to guess your Netmask based on your IP address;
    you may change it if it is incorrect. Enter The installation program carries the
    domain name down to the hostname field. Enter the hostname you are using in front
    of the domain name to form a fully qualified domain name (FQDN). If your network
    has more than one nameserver, you may enter IP addresses for additional nameservers
    in the Secondary nameserver and Tertiary nameserver fields.


    ![](img/bef0eed6d460726bef2ee16ade180160_31_0.png)


    Figure 2.5: Configuring TCP/IP


    #### NFS Server Information


    The last NFS-specific dialog requests information about the NFS server (see Figure
    2.7). Enter the name or IP address of your NFS server, and the name of the exported
    directory that contains the Red Hat Linux CD. For example, if the NFS server has
    the Red Hat Linux CD mounted on /mnt/cdrom, enter /mnt/cdrom in Red Hat directory.
    If the NFS server is exporting a mirror of the Red Hat Linux installation tree
    instead of a CD, you enter the directory which contains the RedHat directory.
    For example, if your NFS server contains the directory /mirrors/redhat/i386/RedHat,
    enter /mirrors/redhat/i386.


    ### 2.4.5 Upgrading or Installing


    After you choose an installation method (and, if you''re installing via NFS, after
    you configure networking information), the installation program prompts you to
    either install or upgrade (see Figure 2.8).


    ![](img/bef0eed6d460726bef2ee16ade180160_32_0.png)


    Figure 2.6: Configuring Networking

