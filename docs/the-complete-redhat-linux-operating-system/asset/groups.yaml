    Linux 内核中；相反，它们作为模块可用，并在安装过程中根据需要加载。你将在这些驱动程序加载时有机会为它们指定选项，事实上，这些驱动程序会忽略你在 `boot:`
    提示符处指定的任何选项。有关安装系统内置驱动程序的更多信息，请参见上文第 2.2.2 节。


    ## 开始安装


    启动后，安装过程开始，询问你是否使用彩色显示器（见图 2.2）。“是”是默认选项；如果你无法区分光标或高亮，请按一次 `Tab`，然后按 `Enter` 继续。接下来，它会显示一条欢迎消息：按
    Enter 开始安装。如果你想中止安装过程，现在只需弹出启动软盘并重启机器即可。


    ![](img/bef0eed6d460726bef2ee16ade180160_28_0.png)


    图 2.2：开始安装


    ### 2.4.2 PCMCIA 支持


