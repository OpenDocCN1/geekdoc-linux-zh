    ## 2.4. STEP-BY-STEP INSTALLATION


    ### Network Configuration Dialogs


    After the installation program has found your network card, it presents several
    dialogs for configuring TCP/IP networking. This information is only used during
    the installation process: you will be able to configure permanent networking information
    later. This feature allows greater flexibility if you want to install from a network
    other than the one where the machine will “live”. Figure 2.4 contains example
    networking information.


    The first dialog asks you for IP and other network addresses (see Figure 2.5).
    Enter the IP address you are using during installation and press Enter. The installation
    program attempts to guess your Netmask based on your IP address: you may change
    the netmask if it is incorrect. Press Enter. The installation program guesses
    the Default gateway and primary nameservers from your IP address and netmask;
    you may change them if they are incorrect. Choose OK to continue.


    The second dialog prompts you for a domain name, a hostname, and other networking
    information (see Figure 2.6). Enter the Domain name for your system and press
    Enter. The installation program carries the domain name down to the Host name
    field. The hostname you are using in front of the domain name to form a fully
    qualified domain name (FQDN). If your network has more than one nameservers, you
    may enter IP addresses for additional nameservers in the Secondary nameserver
    and Tertiary nameservers fields. Choose OK to continue.


    ### 2.4.16 Configuring the Clock


    After you set up networking, the installation program presents a dialog to help
    you configure your Red Hat Linux system''s timezone.


    If you wish to set the hardware (CMOS) clock to GMT (Greenwich Mean Time, also
    known as UTC, or Coordinated Universal Time), select Hard-ware clock set to GMT.
    Setting your hardware clock to GMT means your Red Hat Linux system will properly
    handle daylight savings time, if your timezone uses it. Most networks use GMT.


    Select the timezone your system will be operating in from the list, and press
    Enter.


    If you wish to change your timezone configuration after you have booted your Red
    Hat Linux system, you may use the /usr/sbin/timeconfig-command.


    ### 2.4.17 Setting a Root Password


    After you have set up your system''s timezone, the installation program prompts
    you to set a root password for your system: this is the password you will use
    to log into Red Hat Linux system for the first time.


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice: if the two passwords
    do not match, the installation program will ask you to enter them again (see Figure
    2.1). You ought make the root password something you can remember, but not something
    is easy for someone else to guess. Good passwords mix numerals with upper and
    lower letters and do not contain dictionary words: name, phone number, qwerty,
    123456, and password are all examples of poor passwords. Remember that the password
    is case-sensitive. Write down this password and keep it in a secure place. Please
    Note: The root user (also known as superuser) has complete access to the entire
    system; for this reason, logging in as root user is best only to perform system
    maintenance, so that critical files are not changed, moved, or deleted after you
    reboot your system.


    ### 2.4.18 Installing LILO


    In order to be able to boot Red Hat Linux system, you usually need to install
    LILO (the Linux Loader). You may install LILO in one of several places:


    The Master Boot Record (MBR) is the recommended place to install LILO, unless
    another operating system (e.g., System Commander or OS/2''s Boot Manager) is already
    installed there. When your machine boots, LILO starts and presents the boot prompt;
    you can install the first sector of your root partition if you are already using
    another loader on your system (such as OS/2''s Boot Manager); then you can setup
    that loader to start LILO and boot Red Hat Linux. The first sector of a floppy
    diskette is an alternative of the above options: to boot Red Hat Linux, insert
    LILO diskette into your machine''s floppy drive and reboot. LILO starts from the
    floppy and presents the boot prompt. Select the location you wish to install LILO
    and press OK. If you do not wish to install LILO, press Skip.


    ### Limitations of LILO


    LILO is subject to some limitations imposed by most BIOSes. Here are the “rules”
    of where your root partition must live if you want to install LILO on a hard drive:


    - If you have two IDE (or EIDE) drives, your root partition must live on one of
    them. This also includes any IDE CD-ROM drives for your primary controller. If
    you have one IDE hard drive and one IDE CD-ROM on the primary controller, you
    must install your root partition on the hard drive.

    - If you have one IDE (or EIDE) drive and one or more SCSI drives, your root partition
    must live either on the IDE drive or the SCSI drive that is ID 0. No other SCSI
    IDs will work.

    - If you have SCSI only, your root partition must live on a drive at ID 0 or ID
    1. No other SCSI IDs will work.

    - In any case, your Linux kernel (and, if you have a SCSI adaptor, your initial
    ramdisk) must live below cylinder 1023. For IDE (or EIDE) drives, this generally
    means below the 512 MB mark; for SCSI drives it is generally below the 1 GB mark.
    The easiest (and recommended) way to ensure this is to make sure your root partition
    is located between cylinders 0-1023. Some more recent BIOSes don''t have this
    limitation.


    ### Adding Options to LILO Boot Command Line


    Finally, the installation program will ask if you wish to add default options
    to the LILO boot command. Any options you enter will be passed to the Linux kernel
    every time it boots. Press OK when finished.


    ### Alternatives to LILO


    If you do not wish to use LILO to boot your Red Hat Linux system, there are a
    few alternatives:


    - LOADLIN can load Linux from MS-DOS: unfortunately, it requires a copy of the
    Linux kernel (and an initial ram disk, if you have a SCSI adaptor) to be available
    on an MS-DOS partition. The only way to accomplish this is to boot your Red Hat
    Linux system using some other method (e.g., from LILO on a floppy) and then copy
    the kernel to an MS-DOS partition. LOADLIN is available from http://sunsite.unc.edu/system/Linux-boot/
    and sunsite''s various mirror sites.

    - SYSLINUX is an MS-DOS program very similar to LOADLIN; it is also available
    from ftp://sunsite.nc.edu/system/Linux-boot/ and sunsite''s various mirror sites.

    - Some commercial bootloaders, such as System Commander, are able to boot (but
    may still require LILO to be installed in your Linux root partition).


    ### 2.4.19 Finishing Up...or Starting Up


    After you have completed LILO installation, the installation program will reboot
    your system. Please don''t forget to remove the installation floppy from the diskette
    drive.


    At the boot prompt, press Enter and watch your Red Hat Linux system boot. When
    it presents the login prompt, enter root; at the Password prompt, type the root
    password you set for your machine in Section 2.4.17.

    '
