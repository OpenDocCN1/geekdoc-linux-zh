    # D.6. MILO USER INTERFACE


    However, if you wish, you can explicitly set the host id of the n-th SCSI controller
    in the system by setting environment variable SCSIIn_HOSTIDto the appropriate
    value. For example, to set the hostid of the first SCSI controller to 7, you can
    issue the following command at the MILO prompt:


    ```

    setenv SCSI_HOSTID 7

    ```


    # D.6.3 Rebooting Linux


    You may want to reboot a running Linux system using the shutdown -r now command.
    In this case, the Linux kernel returns control to Milo (via the HALT CallPAL entrypoint).
    Milo leaves a compressed copy of itself in memory for this reason and detects
    that the system is rebooted from information held in the HWRPB (Hardware Restart
    Block). In this case it starts to reboot using exactly the same command that was
    used to boot the Linux kernel the last time. There is a 30 second timeout that
    allows you to interrupt this process and boot whatever kernel wish in whatever
    way you wish.


    # D.6.4 The “bootopt” command


    For flash based systems such as the AlphaPC64, EB164 and the EB66+, there are
    a number of possible boot options and these are changed using the bootopt command.
    This has one argument, a decimal number which is the type of the image to be booted
    the next time the system is power cycled or reset:


    Boot the Evaluation Board Debug Monitor, Boot the Windows NT ARC firmware.


    In order to tell the boot code to boot the Milo firmware from flash then you need
    a boot option that means the N''th image. For this, you need to 128 plus N, so
    if Milo is the third image, you would use the command:


    ```

    MILO> bootopt 131

    ```


    Note: Be very careful with this command. A good rule is never to set bootopt to
    0 (the Evaluation Board Debug Monitor), but instead use the system''s jumpers
    to achieve the same thing.'
