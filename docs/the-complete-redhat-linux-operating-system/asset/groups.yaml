    ### 3.4.3 Finishing Up


    The Linux/Alpha system is fully configured. After the install is finished, you
    will be asked to reset your computer. This indicates that your system has been
    installed.


    ## 3.5 BOOTING YOUR RED HAT LINUX SYSTEM


    To boot Red Hat Linux/Alpha from MILO, you must use the following arguments:


    - Standard fdisk-style: This is the normal way as on Intel.

    - BSD-style: We don''t recommend using this unless it is absolutely necessary.


    For example, if your root partition is the second partition, you would use:


    ```

    sda2:root=/sda2

    ```


    If instead your root partition is the third partition, you would use:


    ```

    hdb3:root=/hdb3

    ```


    For information on these commands, please read the MILO HOWTO in Appendix D.


    # CHAPTER 4. Installing Red Hat Linux/SPARC


    These are brief installation instructions for the SPARC family of processors 4.1
    release. This chapter describes the differences between installing Red Hat/Alpha
    and Intel.


    ## 4.1 Hardware


    Red Hat Linux/SPARC is known to function on the following hardware:


    - sun4c architecture (IPC, SS1, etc.)

    - sun4m architecture (Classic, SS10, etc.) own- bwtwo, cg3, cg6, TCX framebuffers
    (24 bit on the TCX)

    - cg14 framebuffer (in3 mode)

    - SCSI and Ethernet on all of the above

    - type 4 and type 5 keyboards and mice


    A partial list of unsupported hardware:


    - VME based sun4m machines, such as 690

    - sun4d (SS1000, SS2000)

    - sun4u (UltraSparc1, UltraSparc2, Enterprise UltraSparc servers)

    - sun4 architecture


    Eurocard sun4c machines, called the ''sun4e'' under Solaris2.4 and others, are
    not supported. These are VME-bus sun4c machines, to which the kernel has not been
    ported yet.


    ## 4.2 Booting from Floppy


    First you need to boot your system to the install program. You will have to create
    boot floppy, and creating it depends on which version of the PROM you have. The
    images directory on your Red Hat/SPARC CD contains two images. Use boot-v0.img
    if you have a PROM version 0 or 1 (this is the major number...PROM 1.6 is a type
    1 PROM). Use boot-v2.img if you have a PROM version 2.0 or greater. To create
    the floppy, you can use rewrite.exe under MS-DOS (located on your Red Hat/SPARC
    CD in the dosutils directory), or you can use dd under Linux or Unix. Under MS-DOS,
    you would enter the following commands


    ```

    d:

    cd \images

    ..\dosutils\rewrite.exe

    ```

