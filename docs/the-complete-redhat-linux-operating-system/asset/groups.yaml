    halt, reboot, shutdown, fdisk, fsck.*, mkfs.*, lilo,

    arp, ifconfig, route

    ```


    ## /usr 目录


    /usr 目录用于存放整个站点共享的文件。/usr 目录通常有自己的分区，并且应该是可只读挂载的。以下目录应该是 /usr 的子目录：


    | /usr |

    | :--- |

    | X11R6 |

    | bin |

    | dict |

    | doc |

    | etc |

    | games |

    | include |

    | info |

    | lib |

    | local |

    | man |

    | sbin |

    | share |

    | src |


    X11R6 目录用于 X Window 系统（在 Red Hat Linux 上的 XFree86），bin 用于可执行文件，doc 用于随机的非 man
    页文档，etc 用于站点范围的配置文件，include 用于 C 头文件，info 用于 GNU info 文件，lib 用于库，man 用于 man 手页，sbin
    用于系统管理二进制文件（那些不属于 /sbin 的文件），src 用于源代码。


    ## /usr/local 目录


    FSSTND 规定：


    > “/usr/local 层次级结构供系统管理员在本地安装软件时使用。它需要确保在系统软件更新时不会被覆盖。它可以用于在组机器之间共享但在 /usr 中未找到的程序和数据。”


    /usr/local 目录的结构与 /usr 目录相似。它具有以下子目录，其用途与 /usr 目录中的子目录相似：


    | /usr/local |

    | :--- |

    | bin |

    | doc |

    | etc |

    | games |

    | include |

    | info |

    | lib |

    | man |

    | sbin |

    | src |


