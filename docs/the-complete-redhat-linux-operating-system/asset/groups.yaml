    ### 8.1.2 Removing a User


    To remove a user, select a user in the main window by clicking on it, and then
    click on Remove. You will be presented with the dialog box presented in Figure
    8.3. There are three types of action you may take. You may ignore the user''s
    home directory, leaving it alone, you can archive and compress it into a tar.gz
    file, or you can delete it completely. You can delete the user''s mail spool if
    you like. These first two actions will take place immediately after you confirm
    the deletion, before the tool accepts more. You can search for files owned by
    the user on parts of the filesystem other than the user''s home directory and
    either give ownership to the user “nobody” or delete them. If you choose to search
    for the user''s files, you have the option of mailing a report of the errors to
    root. This is important because the searching will be done in the background as
    you continue to work; it may take a long time. To find files owned by “nobody”,
    execute the following command:


    ```bash

    find / -group nobody -o -user nobody -print

    ```


    ![](img/bef0eedd460726bef2ee16ade80160_105_0.png)


    Figure 8.3: Delete User Dialog Box


    ### Deactivating a User


    Sometimes you just want to temporarily “remove” a user, with the intention of
    reinstating the user later. The Lock and Unlock functions handle this. When you
    deactivate a user, the user''s password is locked by prepending a “*” to it, preventing
    the user from logging in. You also have the option of “collapsing” the user''s
    home directory with tar and gzip, which can save some space. When you reactivate
    a user, the password locking is removed, and if the home directory was collapsed,
    it is expanded back to normal. When you lock a user, you are presented with the
    same options as when you delete a user, but you are unlikely to want to delete
    any files.


    ### 8.1.3 Creating a New Group


    To create a new group, first switch to group editing mode by selecting the Groups
    tab at the top of the main window. Clicking on Add brings up a dialog box to specify
    the group details. First enter a name for the new group. Just like a username,
    the group name should have no spaces and be no longer than 8 characters. You can
    set a group password; if you do, users who are not members of the group assume
    group membership by using the newgrp program and providing it with the password.
    To add members to the group, enter their names in the User list field. When you
    have selected all the group members, click Done


    ### 8.1.4 Editing an Existing Group


    To edit an existing group, double-click on the group in the main window, or click
    on the group and then on View/Edit. The same interface is used to edit an existing
    group as to create a new.


    ## 8.2 File System Configuration


    The file system configuration tool shown in Figure 8.4 allows you to easily examine
    and manipulate file system mount points, types, options, etc. It is very useful
    for manipulating a large number of file systems. You probably don''t want to do
    this unless you are an experienced system administrator. If you know what you
    are doing, it should be fairly straightforward as to mount, unmount, and add devices.


    The Reload entry in the FSM causes the file system configuration tool to re-load
    /etc/fstab from your hard drive. If you edit /etc/fstab by hand while the file
    system configuration tool is running (which you shouldn''t), you probably want
    to reload.


    To use the buttons along the bottom of the window, select a filesystem in the
    main window, and click on one of the buttons. The buttons perform the following
    functions:


    - Info Displays information on the filesystem. including the device, partition
    type, filesystem type, mount point and options, comment, size, used, etc.

    - Check Performs a filesystem check (fsck) on the partition. You can do this only
    on unmounted partitions — if the partition is mounted, you will get an error and
    you will have to unmount it first.

    - Mount Mounts the selected filesystem.

    - Unmount Unmounts the selected filesystem.

