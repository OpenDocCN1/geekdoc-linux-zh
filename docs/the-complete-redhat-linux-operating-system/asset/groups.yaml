    # Preface


    # What is Red Hat Linux?


    Red Hat Linux is an open source operating system based on the Linux kernel, which
    was originally created by Linus Torvalds in 1991. Created by a network of developers
    working over the internet, many forming today, Red Hat currently over 20% of the
    market, Red Hat Linux Server 5.2, demonstrates the power of free and open source
    development as well as the value of the enterprise-grade product. Plus the support
    by Red Hat and Red Hat Enterprise Software for the market.


    Since the release of version 5.2, Red Hat Linux has been under testing for FIPS
    compliance. Our version meets all the criteria of RHCSA (Red Hat Certified System
    Administrator), versatile, marketable and ready for Red Hat Linux.


    We are pleased to see the growing number of applications which rely on the Linux
    operating system, needs of which Red Hat Linux satisfies. Our various versions
    of the Server OS are supported by many developers, including developers and users
    of the Linux. Red Hat Linux is based on kernel 2.6, which provides many advanced
    features for Red Hat Server, which is free to use.


    As you notice, Red Hat Linux is easy to install and all configuration purposes
    can be walked through the process in as little as 15 minutes. The system itself
    is very flexible: you can install and uninstall individual software ''packages''
    with only a few clicks. It is easy to maintain package distributions that can
    be verified and corrected, and packages can be installed and uninstalled simply
    and reliably. Furthermore, Red Hat Linux is easy to administer with a set of graphical
    administration tools that remove the hassle of everyday system administration.
    Complete source code is provided for the freely distributable components of the
    system.


    # An Overview of This Book


    This manual is organized in the following fashion:


    - Chapter 1. Quick Start contains enough information for experienced users to
    perform a basic installation of Red Hat Linux without any trouble. We recommend
    that new Linux users read through the manual before installing to get a good understanding
    of the system.

