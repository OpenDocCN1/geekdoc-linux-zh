    ## 200 附录 F. 红帽与可自由分发软件。


    大学、商业企业和黑客可以合作开发和使用红帽 Linux 及相关技术，而无需担心他们的工作会被商业供应商的控制和限制。


    简而言之，GPL 将软件开发和分发模式转变为一种与我们法律体系及其行业所使用的模式非常的模式。如果一个律师设计出一个在最高法院赢赢得诉讼的论点，他的回报不仅是客户支付的费用，还有他的成就为他的执业吸引的额外客户。他所使用的“论点”可以供任何其他律师不受限制地使用，事实上，它成为了我们集体法律遗产的一部分。


    这种模式已经成为了一项新行业，Cygnus Support（参见 http://www.cygnus.com）等公司已通过为使用 GPL 及其他“自由分发”软件的大型商业用户提供支持和服务，发展成为价值数百万美元的企业。Red
    Hat Software Inc. 的快速增长同样基于于我们对红帽 Linux 发行版的开发和支持，我们根据 GPL 的客户条款，通过 CD 和互联网在全球分发该产品。


    ### F.2 “自由软件”的演变


    Unix 操作系统也是 AT&T 在许多大学和研究机构的积极支持下在合作的基础上开发的。许多早期 Unix 贡献者对 AT&T 在 20 世纪 70 年代末和
    80 年代对 Unix 的使用和分发执行版权条款感到失望。这最终导致了 AT&T（以及随后在 1991 年从 AT&T 手中获得 Unix 版权的 Novell）与加州大学伯克利分校之间长期而痛苦的法律斗争。


    针对这种个人控制的问题，位于马萨诸塞剑省理工学院（MIT）自 1984 年以来一直支持理查德·斯托曼在软件开发社区发起运动，支持建立自由软件基金（FSF）及其
    GNU 项目。GNU 的名字遵循了早期 Unix 使用缩写作为程序名称的传统，代表 GNU''s Unix。FSF 继续总部设在 MIT，并在过去的十年中凭借
    GNU C、GNU C++、Emacs 以及许多其他产品取得了巨大的成功，其中许多产品构成了 Linux 操作系统的实质性和关键构建模块。理查德·斯托曼很有理地坚持，Linux
    应该被正确地称为一个 GNU 系统。


    还有许多其他“自由软件”许可证，红帽 Linux 中的某些代码是在这些许可下授权的。其中流行的是加州大学伯克利分校的 BSD 许可证，其版权所有者仍是注册所有者，但对代码的用户不加进一步分发的限制。


    同样来自 MIT 但与 FSF 或 GPL 无关的是 X Consortium，这是一项 Unix 行业赞助的构建和维护 X Window 系统的努力。随后，一个名为
    XFree8 Project 的小组承担了将 X Window 系统移植到英特尔平台的责任。为了方便起见，我们在附录中包含了每种许可的副本。由于这项全球开发努力的贡献，Linux
    正在非常快速地进步，鼓励你和你的公司或学校做出贡献。


    ### F.3 GNU 公共许可证


    Red Hat Software, Inc. 选择根据 GPL 许可其代码有两个原因。其之一这是最容易做的事情，因为 Linux 内核是以这种方式许可的，而我们的代码与其他
    GPL 代码的交互方案非常困难。另一个是，出于合作开发的目的，我们真认为 GPL 是最有效的许可格式。


    GPL 的目的与任何标准版权许可一样，即定义你可以使用和不能使用该产品。然而，它与商业许可有本质区别，因为它的目的不是限制你对软件的使用，而是保证你对软件的使用。


    它完全不限制结合 Linux 或其他 GPL 代码使用标准的商业许可软件。只有你从他人那里“借用”的受 GPL 许可的代码所做的更改，必须根据 GPL 定义的相同不受限制的规则提供给其他人。任何简单使用
    或在 Linux 之上运行的产品都可以根据你选择的任何商业规则进行许可。


    许多领先的商业软件开发者活跃地在 Linux 上支持他们的商业产品，你必须购买这些产品的许可证，例如来自 OSF 的 Motif、来自 Empress Software
    的 Empress RDBMS、WordPerfect 以及最近的 Appiglich —— 来自 Applic Inc. 和 Red Hat Software
    的 Office 办公套件。你可以在 G 节找到 GPL 的完整副本。


    ### F.4 Linux 会取代商业操作系统吗？


    Linux 操作系统的巨大开发努力和广泛分发将确保它作为商业限制性操作系统的真实、可行且重要的替代方案而占据地位。开放的开发模式、源代码的可用性以及许可限制的缺失是
    Linux 操作系统的“特性”，这是商业开发人员根本无法提供的。需要这种模式的软件开发小组包括从政府附属研究机构、学术研究和教学项目到商业软件开发者的各个团体。


    近期 Linux 新应用程序快速增加以及这些技术用户群的快速增长，使得即使最大的计算机行业组织也开始重视 Linux。即使是 Apro（麦格罗集团公司）在最近的
    1996 年 UNIX 行业调查中也得出结论：“程序员正在认真考虑 Linux 在生产平台上的可行性，Linux 的成本比微软低，并且具有 UNIX 的额外优势，如出色的性能、内置的工具集和通信能力。”


    Linux、FSF 的代码和“自由分发”软件所代表的新发行和开发模式是一种我们很高兴你现在参与其中的新模式。


    ### F.5 Red Hat Software, Inc. 在 Linux 开发中的作用


    红帽 Linux 发行版也是根据 GPL 发行的。我们认为角色是让 Linux 操作系统易于安装、配置和维护。Red Hat Software, Inc.
    为 Linux 操作系统的用户提供支持，从运行单个工作站的个人到运行数百台联网机器的大型机构，涵盖各种程序。


    ### F.6 延伸阅读


    关于 Linux 的自由和商业软件的互联网列表出现在《Linux 日志》、《商业 HOWTO》、《Linux 软件地图》以及许多 Linux 供应商（包括红帽软件零售部门）的文档中。可以通过红帽的网站购买许多第三方和商业产品，包括
    Motif、数据库开发系统、编辑器等。可以通过发送传真请求至 (919) 572-6726 获取信息，网站地址为 http://www.redhat.com。


    你可以直接联系红帽：info@redhat.com。


    有关 Linux 的更多信息请参阅：


    - *Running Linux, M. Welsh, O''Reilly & Associates, 1995.

    - *Linux: Network Administrators Guide. O''Reilly & Associates. 1995.


