    # CHAPTER 2. INSTALLING RED HAT LINUX/INTEL


    ![](img/bef0eed6d460726bef2ee16ade180160_33_0.png)


    Figure 2.7: Installing via NFS


    # Installing


    You usually install Red Hat Linux on a clean disk partition or set of partitions,
    or over another installation of Linux. Installing Red Hat Linux over another installation
    of Linux (including Red Hat Linux) does not preserve any of the prior installation.


    If you wish to perform a full installation, choose Install.


    # Upgrading


    The installation process for Red Hat Linux 4.1 includes the ability to upgrade
    from previous versions of Red Hat Linux (2.0, 2.1, 3.0.3, and 4.0) which are based
    on RPM technology. Upgrading your system installs the modular 2.0.x kernel as
    well as updated versions of the packages which are installed on your machine.
    The upgrade process preserves existing configuration files using a .rpmsave extension
    (e.g., sendmail.cf.rpmsave) and leaves a log telling what actions it took in /tmp/upgradelog.
    As software evolves, configuration file formats can change, so you should carefully
    compare your original configuration files to the new files before integrating
    your changes.


    If you wish to upgrade your Red Hat Linux/Intel system, choose Upgrade.


    ## 2.4. STEP-BY-STEP INSTALLATION


    Please Note: Some upgraded packages may “depend” on other packages which may not
    be installed on your system. The upgrade procedure takes care of these dependencies,
    but it may need to install additional packages in order to satisfy them.


    ![](img/bef0eed6d460726bef2ee16ade180160_34_0.png)


    ### 2.4.6 SCSI Support


    After you choose whether to perform an upgrade or a full install, the installation
    program asks whether you have any SCSI adapters. If you choose Yes, the following
    dialog presents a list of SCSI drivers. Choose the driver that most closely resembles
    your SCSI adapter. The installation program gives you an opportunity to specify
    options for the SCSI driver you selected: most SCSI drivers detect your hardware
    automatically, however.


    ### 2.4.7 If You Are Installing via FTP


    If you are not installing Red Hat Linux via FTP, you may skip to Section 2.4.8
    below.


    # CHAPTER 2. INSTALLING RED HAT LINUX/INTEL


    ### Choosing a Network Driver


    If you are installing via FTP, you must have a supported network card installed
    in your computer. The installation program prompts you to choose the driver that
    supports your network card and to specify any options necessary for the driver
    to locate and recognize the card. Most of the time, the driver can locate the
    card automatically by probing; however, it is possible that probing your hardware
    might cause your machine to hang. If this happens, reboot the machine, start the
    installation again, and specify additional driver options when you get to this
    step (Appendix B).


    ### Configuring TCP/IP Networking


    After the installation program has found your network card, it presents several
    dialogues for configuring TCP/IP networking. This information is only used during
    the installation process; you will be able to configure permanent networking information
    later. This feature allows greater flexibility if you want to install from a network
    other than the one where the machine will “live”. Figure 2.4 contains example
    networking information.


    The first dialog asks you for IP and other network addresses (see Figure 2.5).
    Enter the IP address you are using during installation and press Enter. The installation
    program attempts to guess your Netmask based on your IP address; you may change
    the netmask if it is incorrect. Press the installation program guesses the Default
    gateway and Primary nameserver addresses from your IP address and netmask; you
    may change them if they are incorrect. Choose OK to continue.


    The second dialog prompts you for a domain name, a hostname, and other networking
    information (see Figure 2.6). Enter the Domain name for your system and press
    Enter the installation program carries the domain name down to the Host name field.
    Enter the hostname you are using in front of the domain name to form a fully qualified
    domain name (FQDN). If your network has more than one nameserver, you may enter
    IP addresses for additional nameservers in the Secondary nameserver and Tertiary
    nameserver fields. Choose OK to continue.


    ## 2.4. STEP-BY-STEP INSTALLATION


    ### FTP Server Information


    The last FTP-specific dialog requests information about the FTP server (see Figure
    2.9). Enter the name or IP address of the FTP site you are installing from, and
    the name of the directory which contains the RedHat directory for your architecture.
    For example, if the FTP site contains the directory /pub/mirrors/redhat/i386/enter/pub/mirrors/redhat/i386.


    ![](img/bef0eed6d460726bef2ee16ade180160_36_0.png)


    Figure 2.9: Installing via FTP


    ### 2.4.8 Creating Partitions for Red Hat Linux


    After choosing whether to use SCSI support (and, if you''re installing via FTP,
    after you configure networking information), the installation program presents
    a list of the hard disks it can find on your system and prompts you to set aside
    at least one disk partition for Red Hat Linux. If you need to create one or more
    partitions, select the disk you wish to partition and press `Enter` the installation
    program starts the fdisk utility. Please see Section 2.2.3 for recommendations
    about partitions for Red Hat Linux.


    ### Using fdisk


    fdisk includes online help which is terse but useful. Here are a few tips:


    # CHAPTER 2. INSTALLING RED HAT LINUX/INTEL


    - To list the current partition table, use the p command. To add a new partition,
    use n.

    - Linux fdisk creates partitions of type Linux native by default. When you create
    a swap partition, don''t forget to change it to type Linux swap using the t command.

    - Linux allows up to four (4) partitions on one disk. If you wish to create more
    than that, one of the four may be an extended partition, which in turn contains
    one or more logical partitions. Since it acts as a container, the extended partition
    must span all of the space that the logical partitions will take up.

    - It''s a good idea to write down which partitions (e.g., /dev/hda2) are meant
    for filesystems (e.g., /usr) as you create each one.

    - Please Note: None of the changes you make take until you save and exit fdisk
    using the w command. You may quit fdisk at any time without saving changes using
    the q command.


    # Numbering Partitions


    Linux refers to disk partitions using a combination of letters and numbers which
    may be confusing to inexperienced users. Here is a summary:


    The letters denote the device it is on. e.g., /dev/hda (the first IDE disk) or
    /dev/sdb (the second SCSI disk).


    The number denotes the partition. The first four (primary or extended) partitions
    are numbered 1 through 4. Logical partitions start at 5. E.g., /dev/hda3 is the
    third primary or extended partition on the first IDE disk; /dev/sdb6 is the second
    logical partition on the second SCSI disk.


    ### Changing the Partition Table


    When you are finished partitioning your disks, press Done: you may see a message
    indicating that the installation program needs to reboot. This is a normal occurrence
    after you created, changed, or deleted any extended partitions. After you press


    ## 2.4. STEP-BY-STEP INSTALLATION


    Follow the same installation steps you did until Partitioning Disks; then simply
    choose Done.


    ### 2.4.9 Initializing Swap Space


    After creating partitions for Red Hat Linux, the installation program looks for
    swap partitions. If it finds any, it asks whether you want to initialize them.
    Select the partition(s) you wish to initialize as swap space using then choose
    OK.


    If the installation program can''t find your swap partition, make sure you have
    set the partition type to Linux swap; see Section 2.4.8 above.


    ### 2.4.10 Filesystem Configuration


    Since Red Hat Linux may be distributed across several disk partitions, you need
    to choose which disk partitions go with which filesystem.


    ### Selecting the Root Partition


    After initializing swap space, the installation program presents a list of the
    Linux partitions it can find and prompts you to choose a root partition. The root
    partition (or root filesystem) is the one which holds everything necessary to
    boot your Red Hat Linux system: it is mounted on / (the root directory) when your
    system boots. Select the root partition you wish to use and press Enter.


    ### Other Partitions


    The next dialog presents a list of most of the disk partitions on your system
    (including MS-DOS and other partitions Linux can read), giving you the opportunity
    to assign other partitions to different parts of the filesystem. The partitions
    you assign will be automatically mounted when your Red Hat Linux system boots.
    Select the partition you wish to assign and press Enter (or choose Edit); then
    enter the mount point for that partition, c.g., /usr (see Figure 2.10).

