    在 Red Hat Linux 中，/usr/local 的预期用途与 FSSTND 规定的略不同。FSSTND 规定 /usr/local 应该确保在系统软件更新时不会被覆盖。由于
    Red Hat 软件是通过 RPM 安全地更新的，你不需要将文件放在 /usr/local 来保护它们。相反，我们建议将 /usr/local 用于本地软件。


