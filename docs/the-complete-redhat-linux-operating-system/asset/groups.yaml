    displays).


    # 4.7 SILO Configuration


    SILO configuration is nearly identical to LILO configuration. see section 2.4.18
    for details.


    # 4.8 Partitioning


    There is one additional step in partitioning a hard drive for a SPARC. You must
    create the third partition of every disk as type Whole Disk spanning cylinder
    0 to the end of the disk. It shouldn''t be touched, but should exist. You can
    create other partitions just as you normally would.


    # 4.9 X Windows


    There is no mouse or X windows config on the SPARC. The 8 bit server is installed
    by default. If you want to use the 24 bit server (for TCX cards), you need to
    install the Xsun24 package. If you only have a bwtwo frame-buffer and want to
    increase performance, install the XsunMono package.'
