    Usenet 的用户。


    ## 第 7 章


    ## 使用 RPM 进行软件包管理


    Red Hat 软件包管理器 (RPM) 是一个开放的软件包系统，供任何人使用，并可以在 Red Hat Linux 以及其他 Linux 和 UNIX 系统上运行。红帽软件公司鼓励其他供应商花时间研究
    RPM 并将其应用于自己的产品。RPM 可以在 GPL 协议下分发。


    对于最终用户来说，RPM 提供了许多功能，使得维护系统比以往任何时候都更加容易。安装、卸载和升级 RPM 软件包都是单行命令，所有繁杂的细节都由你为你处理。RPM
    维护一个已安装软件包及其文件的数据库，这允许你对系统进行强大的查询和验证。在升级期间，RPM 会特殊处理配置文件，以便你永远不会丢失自己的自定义设置——这一功能是直接使用
    .tar.gz 文件无法实现的。


    对于开发者来说，RPM 允许你获取软件源代码并将其打包成供用户使用的源码包和二进制包。这个过程非常简单，由你创建的单个文件和可选的补丁（patches）驱动。这种“原始”源码与你的补丁及构建指令之间的清晰界限，在软件新版本发布时减轻了软件包的维护工作。


    ## 第 7 章：使用 RPM 进行软件包管理


    在编写本文时，有一本书正在编写中，它将详尽记录 RPM，包括：构建和使用软件包、配置 RPM、在程序中使用 RPM 库、RPM 文件格式等。欲需更多信息，请联系红帽软件公司或访问我们的网页
    http://www.redhat.com。


    ## 7.1 RPM 设计目标


    在尝试理解如何使用 RPM 之前，了解其设计目标会有所帮助。


    **可升级性（Upgradability）** 通过 RPM，你可以升级系统的各个单个组件，而无需完全重新安装。当你获得基于 RPM 的新新版本操作系统（如
    Red Hat Linux）时，你不需要重新安装机器（就像在其他软件包系统的操作系统上所做的那样）。RPM 允许对系统进行智能、全自动的现场升级。软件包中的配置文件在升级过程中会被保留，因此你不会丢失自定义设置。


    **强大的查询（Powerful Querying）** RPM 的设计还包含了强大的查询选项。你可以搜索整个数据库以查找软件包或特定文件。你可以轻松找到某个文件属于哪个软件包以及它来自哪里。RPM
    软件包中的文件存储在压缩存档中，带有一个自定义的二进制头部，其中包含了有关软件包及其内容的有用信息，允许你快速、方便地查询单个软件包。


    **系统验证（System Verification）** 另一个强大的功能是验证软件包的能力。如果你担心删除了某个软件包的重要文件，只需验证该软件包即可。你将收到任何异常通知。此时，如有必要，你可以重新安装该软件包。你修改过的任何配置文件在重新安装期间都会被保留。


    **原始源码（Pristine Sources）** 一个关键的设计目标是允许使用由软件原始作者分发的“原始”软件源。通过 RPM，你拥有了原始源码以及所使用的任何补丁，外加完整的构建指令。由于以下几个原因，这是一个巨大的优势。


    ## 7.2 使用 RPM


    例如，如果一个程序发布了新版本，你不一定非要从头开始让它通过编译。你可以查看补丁（patch）以了解你可能需要做什么。通过这种方式，可以轻松看到所有编译的默认值以及为了让软件正常运行而所做的更改。这个目标对开发者来说可能很重要，但它为最终用户带来了更高质量的软件。我们要感谢
    BOGUS 发行版团队提出了原始源码的概念。


    ## 7.2 使用 RPM


    RPM 有五种基本模式（不包括软件包构建）：安装、卸载、升级、查询和验证。本节包含每种模式的概述。欲需完整细节和选项，请运行 `rpm --help`，并查看
    rpm man 手页以及之前提到的 RPM 书籍。


    ### 7.2.1 安装


    RPM 软件包通常具有类似 `foo-1.0-1.i386.rpm` 的文件名，它包含了包名（foo）、版本（1.0）、发行版本（1）和架构（i386）。软件包中的配置文件在升级过程中会被保留。安装的操作简单如下：


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    ```


    如你所示，RPM 会打印软件包名称，然后显示一系列哈号，软件包已安装。


    #### 软件包已安装（Package Already Installed）


    如果软件包已经安装，你会看到：


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    package-1.0-1 is already installed

    ```


    如果你确实想安装该软件包，可以使用 `--replace` 命令。


    #### 文件冲突（Conflicting Files）


    如果你尝试安装的软件包包含一个已被另一个软件包安装的文件，你会看到：


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    foo /usr/bin/foo conflicts with file from bar-1.0

    ```


    要让 RPM 忽略该错误，请使用 `--replacefiles`。


    #### 未解决的依赖（Unresolved Dependency）


    RPM 软件包可以“依赖”其他软件包，这意味着它们需要其他软件包才能正常运行。如果你尝试安装一个存在此类未解决依赖的软件包，你会看到：


    ```

    $ rpm -ivh bar-1.0-1.i386.rpm

    failed dependencies:

    foo is needed by bar-1.0

    ```


    要处理此错误，你应该安装请求的软件包。如果你想强制安装（这是一个坏主意，因为软件包将无法正常运行），请使用 `--nodeps` 命令。


    ### 7.2.2 卸载


    卸载软件包的操作简单如下：


    ```

    $ rpm -e foo

    ```


    注意我们使用的是包名“foo”，而不是原始软件包的文件名“foo-1.0-1.i386.rpm”。


    如果某些已安装的软件包依赖于你尝试删除的软件包，可能会遇到依赖错误。例如：


    ```

    $ rpm -e foo

    removing these packages would break dependencies:

    foo is needed by bar-1.0

    ```


    要让 RPM 忽略该错误并强制卸载软件包（这是一个坏主意，因为依赖它的软件包可能会无法正常工作），请使用 `--nodeps` 命令。


    ### 7.2.3 升级


    升级软件包几乎与安装一样。


    ```

    $ rpm -Uvh foo-2.0-1.i386.rpm

    foo #################

    ```


    你在上面没有看到的是 RPM 自动卸载了旧版本的 foo 软件包。由于 RPM 对带有配置文件的软件包执行智能升级，你可能会看到类似的消息：


    ```

    saving /etc/foo.conf as /etc/foo.conf.rpmsave

    ```


    这意味着你对配置文件的修改可能与软件包中的新配置文件向前兼容，因此 RPM 保存了你的原始文件，并安装了一个新文件。你应该尽快调查并解决这两个文件之间的差异，以确保你的系统继续正常运行。


