    With the introduction of modularization in 2.0 there have been some significant
    changes in building customized kernels. In the past you were required to compile
    support into your kernel if you wanted a particular hardware. With the capabilities
    of 2.0 kernel, if there are hardware components used infrequently driver modules
    can be loaded on demand.


    ## Building a modularized kernel


    Only Red Hat Linux/Intel and Red Hat Linux/SPARC support modular kernels; Red
    Hat Linux/Alpha users must build a monolithic kernel (see 5.3).


    These instructions provide you with the knowledge required to take advantage of
    the power and flexibility available through kernel modularization. If you do not
    wish to take advantage of modularization, please see 5.3 for an explanation of
    building and installing a monolithic kernel. It is assumed that the kernel-source
    package has been previously installed and all commands are issued in the directory
    usr/src/linux.


    It is important to begin building a kernel with the source tree in a known condition.
    Therefore, it is recommended that you begin with the command mrproper This will
    remove any configuration files along with the remains of any previous builds that
    may be scattered around the source tree. Now you must create a configuration file
    that will determine which components to include in your new kernel. Depending
    upon your hardware and personal preferences there are three methods available
    to configure the kernel.


