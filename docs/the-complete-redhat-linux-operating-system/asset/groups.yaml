    ### 8.4.2 管理主机


    在主机（Hosts）管理界面中，你能够从 `/etc/hosts` 文件中添加、编辑或删除主机。添加或编辑条目的操作是相同的。系统会弹出一个编辑对话框，只需输入新信息并在完成后点击“完成”（Done）即可。示例请参见图
    8.12。


    ### 8.4.3 添加网络接口


    如果你在安装 Red Hat Linux 之后为机器添加了网络接口，或者在安装时没有配置以太网卡，可以通过鼠标点击几次来完成配置。首先，点击主面板上的“接口”（Interfaces）。这将弹出一个显示已配置设备窗口，并带有一行可用选项，参见图
    8.13。


    ![](img/bef0eed6d460726bef2ee16ade180160_115_0.png)


    图 8.13：已配置的接口


    要添加设备，首先点击“添加”（Add）按钮，然后从弹出的框中选择你想要配置的接口类型。（图 8.14）


    ![](img/bef0eed6d460726bef2ee16ade180160_116_0.png)


    图 8.14：选择接口类型


    ### PPP 接口


    添加 PPP 接口简单，只需在图 8.15 所示的“创建 PPP 接口”（Create PPP Interface）框中提供电话号码、登录名和密码。在许多情况下，需要进行某种程度的自定义才能建立
    PPP 连接。选择“自定义”（Customize）按钮允许你对 PPP 接口的硬件、通信和网络设置进行更改。


    ![](img/bef0eed6d460726bef2ee16ade180160_116_1.png)


    图 8.15：创建 PPP 接口


    ### SLIP 接口


    为了配置 SLIP 接口，你必须先提供电话号码、登录名和密码。这将为建立 SLIP 连接所需的聊天脚本提供初始参数。当你选择“完成”（Done）按钮时，会出现一个“编辑
    SLIP 接口”（Edit SLIP Interface）对话框，允许你进一步自定义 SLIP 的硬件、通信和网络参数。


    ### PLIP 接口


    向系统中添加 PLIP 接口，只需要提供 IP 地址、远程 IP 地址和子网掩码（Netmask）。你还可以选择是否在启动时激活该接口。


    ### 以太网、Arcnet、令牌环和口袋式适配器接口


    如果你为电脑添加以太网、Arcnet、令牌环或口袋式适配器，你需要提供以下信息：


    - **设备 (Device)**：这由 netconfig 根据已配置的设备确定。

    - **IP 地址 (IP Address)**：为你的网络设备输入一个 IP 地址。

    - **子网掩码 (Netmask)**：为你的网络设备输入子网掩码。

    - **网络 (Network)**：这根据提供的 IP 地址和子网掩码的值确定。

    - **广播地址 (Broadcast)**：这根据提供的 IP 地址和子网掩码的值确定。

    - **启动时激活 (Activate at Boot)**：如果你想让设备在机器启动时自动配置，请点击此复选框。

    - **使用 BOOTP 配置 (Configure with BOOTP)**：如果你在网络上有一个 BOOTP 服务器并希望使用它来配置设备，请点击此复选框。


    提供新设备的配置信息后，点击**完成（Done）**。该设备将作为非活动设备出现在你的“接口”（Interfaces）列表中。（活动列应显示为非活动）。如果你想让设备在机器启动时自动配置，请点击此复选框来选择它。


    ### 8.4.4 路由路由


    在路由（Routes）管理界面中，你能够添加、编辑或删除路由。添加或编辑条目的操作是相同的。系统会弹出一个编辑对话框，只需输入新信息并在完成后点击“完成”（Done）即可。示例请参见图
    8.16。![](img/bef0eed6d460726bef2ee16ade180160_116_1.png) (注：此处原文图号与描述不符，已按逻辑翻译)


    ## 8.5 时间与日期


    为了配置 SLIP 接口，你必须先提供电话号码、登录名和密码。这将提供建立 SLIP 连接所需的初始参数。当你选择“完成”（Done）按钮时，会出现一个“编辑
    SLIP 接口”（Edit SLIP Interface）对话框，允许你进一步自定义 SLIP 的硬件、通信和网络参数。


    ## 8.6 守护进程配置


    通过内核守护进程配置工具所做的更改将写入 `/etc/conf.modules` 文件中，内核守护进程每次启动都会读取该文件。一旦完成更改，你可以点击“重启内核守护进程”（Restart
    kerneld）按钮来重启内核守护进程。这不会导致任何正在使用的模块重新加载，它只是通知内核守护进程在将来加载更多模块时使用该配置。


    ![](img/bef0eed6d460726bef2ee16ade180160_116_0.png)


    图 8.16：添加路由


    ### 8.6.1 模块选项


    要更改内核守护进程的选项，点击它并点击“编辑”（Edit）按钮。kernelcfg 将弹出一个如图 8.18 所示的窗口。通常情况下，某些模块需要参数，它们会有自己的“参数”（Arguments:）窗口。


    ![](img/bef0eed6d460726bef2ee16ade180160_120_0.png)


    图 8.18：编辑模块选项


    ### 8.6.2 更改模块


    要更改内核守护进程调用的模块（例如以太网卡），你需要删除旧的并添加新的。要删除模块，选中它并点击“删除”（Delete）。然后点击“添加”（Add）添加新模块。如果你更改了
    SCSI 控制器（scsi_hostadapter），记得按照第 5 节创建一个新的 ramdisk。


