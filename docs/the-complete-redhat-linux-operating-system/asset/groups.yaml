- md: "\n## 5.4. SENDMAIL\n\nemulate the third (middle) mouse button with a simultaneous\
    \ click of the left and right mouse buttons; use Tab to move the cursor to the\
    \ “Emulate 3 Buttons” checkbox and press Spacebar to toggle the selection.\n\n\
    ## 5.4 Sendmail\n\nA default sendmail.cf file will be installed in /etc. The default\
    \ configuration should work for most SMTP-only sites. It will not work for UUCP\
    \ sites; you will need to generate a new sendmail.cf if you need to use UUCP mail\
    \ transfers. To generate a new sendmail.cf, you will need to install m4 and the\
    \ sendmail source package. Read the README file in the sendmail source for more\
    \ details on creating sendmail configuration files. Also, O’Reilly & Associates\
    \ publishes a good sendmail reference entitled *Sendmail* by Bryan Colton.\n\n\
    A common sendmail configuration is to have a single machine act as a mail gateway\
    \ for all the machines on your network. For instance, Red Hat Software, we have\
    \ a machine mail.redhat.com that does all our mail. On that we simply need to\
    \ add the names of machines for which mail.redhat.com will handle mail to /etc/sendmail.cw.\
    \ Here is an example:\n\n- sendmail.cw - include all aliases for your machine\
    \ here.\n  - torgo.redhat.com\n  - poodle.redhat.com\n  - devel.redhat.com\n\n\
    Then on the other machines (torgo, poodle, and devel), we need to edit /etc/sendmail.cf\
    \ to “masquerade” as mail.redhat.com when sending mail, and to forward any local\
    \ mail processing to redhat.com. Find the DH and DM lines in /etc/sendmail.cf\
    \ and edit them thus:\n\n```\n# who i send unqualified names to (null means deliver\
    \ locally)\nDRmail.redhat.com\n```\n\n```\n# who gets all local email traffic\n\
    DHmail.redhat.com\n```\n\n```\n# who I masquerade as (null for no masquerading)\n\
    DMredhat.com\n```\n\nWith this type of configuration, all mail sent will appear\
    \ as if it were sent from redhat.com, and any mail sent to torgo.redhat.com or\
    \ the other hosts will be delivered to mail.redhat.com.\n\nPlease be aware that\
    \ if you configure your system to masquerade as another any email sent from your\
    \ system to system will be sent to the machine you are masquerading as. For example,\
    \ in the above illustration, log files that are periodically sent to root@poodle.redhat.com\
    \ by the cron daemon would be sent to root@mail.redhat.com.\n\n## 5.5 Controlling\
    \ Access to Services\n\nAs a security measure, most network services are managed\
    \ by a protective program called a TCP wrapper. The protected services are those\
    \ listed in /etc/inetd.conf that specify /usr/sbin/tcpd. tcpd can allow or deny\
    \ access to a service based on the origin of the request, and the configuration\
    \ in /etc/hosts.allow and /etc/hosts.deny. By default, Red Hat Linux allows all\
    \ service requests. To disable or limit services you can edit /etc/hosts.allow.\
    \ Here is an example /etc/hosts.allow file:\n\n- ALL: redhat.com .redhat.com\n\
    - in.talkd: ALL\n- in.ntalkd: ALL\n- in.fingerd: ALL\n- in.ftptpd: ALL\n\nThis\
    \ configuration allows all connections from redhat.com and *.redhat.com machines.\
    \ It also allows talk, finger, and ftp requests from all machines.\n\ntcpd allows\
    \ much more sophisticated access control using a combination of /etc/hosts.allow\
    \ and /etc/hosts.deny. Read the tcpd(8) and hosts_access(5) man pages for complete\
    \ details.\n\n## 5.6 Anonymous FTP\n\nSetting up anonymous FTP is simple. All\
    \ you need to do is install the anon-ftp rpm package (which you may have already\
    \ done at install time). Once it is installed, anonymous FTP will be up and running.\n\
    \nThere are a few files you might wish to edit to configure your FTP server:\n\
    \n- /etc/ftpass: This file defines most of the access control for your ftp server.\
    \ Some of the things that you can do are: set up \"groups\" to control access\
    \ from different sites, limit the number of simultaneous FTP connections, configure\
    \ transfer logging, and much more. Read the ftpass man page for complete details.\n\
    - /etc/fthosts: The fthosts file is used to allow or deny access to certain accounts\
