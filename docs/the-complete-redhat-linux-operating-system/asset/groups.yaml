    boot and supplemental disks used by the FTP install. You must first create a RedHat
    directory at the top level of your directory tree. Everything you will install
    be placed in that directory. First copy the base subdirectory, then copy the packages
    you want to install to another subdirectory called RPMS. You can use available
    space on an existing DOS partition or a Linux partition that is not required in
    the install procedure (for example, a partition that would be used for data storage
