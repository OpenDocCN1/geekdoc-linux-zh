    最后（如果 `pam_hosts.auth.so` 验证用户失败），将执行标准的 unix 密码认证。


    ## 10.4.4 默认 (Default Stanza)


    当安装包含使用 PAM 程序的软件包时，它们会自动向 `/etc/pam.conf` 添加段落。在可能的情况下，它们不会指定使用哪些模块——它们会复制 `/etc/pam.conf`
    顶部 `DEFAULT` 段中的任何内容。通过更改该段落，你可以更改大多数应用程序使用的默认条目。如果你这样做了，在添加新的感知 PAM 的应用程序后，你需要检查
    `/etc/pam.conf` 以确保所添加的段落符合你的系统。


    ## 10.4.5 影子密码 (Shadow Passwords)


    `pam_unix.*.so` 模块支持影子密码。为了将系统转换为影子密码，请使用以下命令：


    ```

    cd /etc

    pconv5

    chmod 600 passwd shadow-

    ```


    `pam_unix.*.so` 模块将检测到你正在使用影子密码并进行所有必要的调整。


