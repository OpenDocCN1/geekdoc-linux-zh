    - menuconfig 图形菜单驱动程序。组件以类别菜单的形式呈现，以与 Red Hat Linux 安装程序相同的方式选择所需的组件。切换你所需的项目标签：Y
    (yes)、N (no) 或 M (module)。

    - xconfig X Windows 程序。组件列在不同级别的菜单中，使用鼠标选择组件。同样，选择 Y (yes)、N (no) 或 M (module)。


