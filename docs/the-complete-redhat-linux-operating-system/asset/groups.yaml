    # 5.4. SENDMAIL


    emulate the third (middle) mouse button with a simultaneous click of the left
    and right mouse buttons use Tab to move the cursor to the “Emulate 3 Buttons”
    checkbox and press Spacebar to toggle the selection.


    # 5.4 Sendmail


    A default sendmail.cf file will be installed in /etc. The default configuration
    should work for most SMTP-only sites. It will not work for UUCP sites; you will
    need to generate a new sendmail.cf if you need to use UUCP mail transfers. To
    generate a new sendmail.cf, you will need to install m4 and the sendmail source
    package. Read the README file in the sendmail source for more details on creating
    sendmail configuration files. Also, O’Reilly & Associates publishes a good sendmail
    reference entitled sendmail by Bryan Colton.


    A common sendmail configuration is to have a single machine act as a mail gateway
    for all the machines on your network. For instance, Red Hat Software we have a
    machine mail.redhat.com that does all our mail. On that we simply need to add
    the names of machines for which mail.redhat.com will handle mail to /etc/sendmail.cw.
    Here is an example:


    +   - sendmail.cw - include all aliases for your machine here.

    torgo.redhat.com

    poodle.redhat.com

    devel.redhat.com


    Then on the other machines, torgo, poodle, and devel, we need to edit /etc/sendmail.cf
    to “masquerade” as mail.redhat.com when sending mail, and to forward any local
    mail processing to redhat.com. Find the DH and DM lines in /etc/sendmail.cf and
    edit them thus:


    ```

    # who i send unqualified names to (null means deliver locally)

    DRmail.redhat.com

    ```


    ```

    # who gets all local email traffic

    DHmail.redhat.com

    ```'
  - '[PAGE 75]


    # who I masquerade as (null for no masquerading)

    DMredhat.com


    With this type of configuration, all mail sent will appear as if it were sent
    from redhat.com, and any mail sent to torgo.redhat.com or the other hosts will
    be delivered to mail.redhat.com.


    Please be aware that if you configure your system to masquerade as another any
    email sent from your system to system will be sent to the machine you are masquerading
    as. For example, in the above illustration, log files that are periodically sent
    to root@poodle.redhat.com by the cron daemon would be sent to root@mail.redhat.com.


    # 5.5 Controlling Access to Services


    As a security measure, most network services are managed by a protective program
    called a TCP wrapper. The protected services are those listed in /etc/inetd.conf
    that specify /usr/sbin/tcpd. tcpd can allow or deny access to a service based
    on the origin of the request, and the configuration in /etc/hosts.allow and /etc/hosts.deny.
    By default Red Hat Linux allows all service requests. To disable or limit services
    you can edit /etc/hosts.allow. Here is an example /etc/hosts.allow file:


    +   ALL: redhat.com .redhat.com

    in.talkd: ALL

    in.ntalkd: ALL

    in.fingerd: ALL

    in.ftptpd: ALL


    This configuration allows all connections from redhat.com and *.redhat.com machines.
    It also allows talk, finger, and ftp requests from all machines.


    tcpd allows much more sophisticated access control. using a combination of /etc/hosts.allow
    and /etc/hosts.deny. Read the tcpd(8) and hosts_access(5) man pages for complete
    details.'
  - '[PAGE 76]


    # 5.6 Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the anon-ftp
    rpm package (which you may have already done at install time). Once it is installed,
    anonymous FTP will be up and running.


    There are a few files you might wish to edit to configure your FTP server:


    +   - /etc/ftpass This file defines most of the access control for your ftp server.
    Some of the things that you can do are: set up "groups" to control access from
    different sites, limit the number of simultaneous FTP connections. configure transfer
    logging, and much more. Read the ftpass man page for complete details.


    +   - /etc/fthosts The fthosts file is used to allow or deny access to certain
    accounts from various hosts. Read the fthosts man page for details.


    +   - /etc/ftpusers This file lists all the users that are not allowed to ftp
    into your machine. For example, root is listed in /etc/ftpusers by default. That
    means that you can not ftp to your machine and log in as root. This is a good
    security measure, but some administrators prefer to remove root from this file.


    # 5.7 World Wide Web Server


    If you installed the Apache server (from the apache package), then your Web service
    is already up and running! Just point Red Baron (or any other web browser) at
    http://localhost.


    The default page shown is /home/httpd/html/index.html. You can edit this file
    (or completely replace it) to your liking. All the CGI programs, icons, and html
    pages are stored in /home/httpd, but this can be changed in the apache configuration
    files, all of which are stored in /etc/httpd/conf. Logs of all http activity are
    kept in /var/log/httpd. Setting up your web server is as easy as adding your own
    HTML pages and links to the /home/httpd/html/ directory. For more information
    on customizing your web server we recommend a reference such as HTML: The Definitive
    Guide by Chuck Musciano & Bill Kennedy, published by O''Reilly & Associates.'
  - '[PAGE 77]


    # 5.8 NFS Configuration


    NFS stands for Network File System, and is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means that it can “export” filesystems to other systems,
    and “mount” filesystems exported from other machines.


    # 5.8.1 Mounting NFS Filesystems


    Use the mount command to mount a NFS filesystem from another machine:


    ```

    mount porky:/mnt/export /mnt/local

    ```


    In this command, porky is the hostname of the NFS fileserver. /mnt/export is the
    filesystem that porky is exporting, and /mnt/local is a directory on my local
    machine where I want to mount the filesystem. After the mount command runs (and
    if I had the proper permissions from porky) - voila! - I can enter ‘ls /mnt/local’
    and get a listing of the files in /mnt/export on porky.


    # 5.8.2 Exporting NFS Filesystems


    The file that controls what filesystems you wish to export is “etc/exports”. Its
    format is:


    ```

    directory          hostname(options)

    ```


    the “(options)” are optional. For example:


    ```

    /mnt/export      speedy.redhat.com

    ```


    would allow speedy.redhat.com to mount /mnt/export, but:


    ```

    /mnt/export      speedy.redhat.com(ro)

    ```'
  - '[PAGE 78]


    # 5.9 RUNNING PROGRAMS AT BOOT TIME


    would allow speedy to mount /mnt/export read-only.

    Each time you change /etc/exports, you need to tell the NFS daemons to examine
    it for new information. One simple way to accomplish this is to just stop and
    start the daemons:


    ```

    /etc/rc.d/init.d/nfs stop

    /etc/rc.d/init.d/nfs start

    ```


    The following will also work:


    ```

    killall -HUP rpc.nfsd rpc.mountd

    ```


    See the following man pages for more details: nfsd(8), mount(8), and exports(5).
    Another good reference is Managing NFS and NIS Services by Hal Stern, published
    by O''Reilly & Associates.


    # 5.9 Running Programs at Boot Time


    The file /etc.rc/rc.local is executed at boot time, after all other initialization
    is complete, and whenever you change runlevels. You can add additional initialization
    commands here. For instance, you may want to start up additional daemons, or initialize
    a printer. In addition, if you require serial port setup, you can edit /etc/rc.d/rc.serial
    and it will be executed at boot time.


    The default /etc/rc.d/rc.local simply creates a nice login banner with your kernel
    version and machine type.


    # 5.10 Color ls Setup


    Color ls is now part of the standard ls command. To use color-ls simply issue
    the command (bash):


    ```

    alias ls=''ls --color''

    ```'
