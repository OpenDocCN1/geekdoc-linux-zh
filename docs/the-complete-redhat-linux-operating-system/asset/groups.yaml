    ### C.1 What is Alpha


    "Alpha" is the name given to Digital''s 64-bit RISC. The Alpha project in Digital
    began in mid-1989, with the goal of providing a high-performance migration for
    VAX customers. This was not the first RISC architecture to be produced by Digital,
    but it was the first to reach the market. When Digital announced Alpha, in March
    1992, it made the decision to enter the merchant market by selling microprocessors.
    Alpha is also sometimes referred to as Alpha AXP, for obscure and arcane reasons
    that aren''t worth pursuing. Suffice it to say they are one and the same.


    ### C.2 What is Digital


    Digital Semiconductor (DS, http://www.digital.com/semiconductor/) is the business
    unit within Digital Corporation (we don''t like the name DEC) that sells semiconductors
    on the market market. Digital...


    Opinions differ as what "EV" stands for (Editor''s note: the true answer is of
    course "Electro Vlassic"), but the number represents the first generation of Digital''s
    CMOS technology that the core was implemented in. So, the EV4 was originally implemented
    in CMOS4. As time goes by, a CPU tends to get a mid-life performance kick by being
    optically shrunk into the next generation of CMOS process. EV45, then, is the
    EV4 core implemented in CMOS5 process. There is a big difference between shrinking
    a design into a particular technology and implementing it from scratch in that
    technology (but I don''t want to go into that now). There are a few other wildcards
    in here: there is also a CMOS4S (optical shrink in CMOS4) and CMOS5L.


    True technophiles will be interested to know CMOS4 is a 0.75 micron process, CMOS5
    is a 0.5 micron process and CMOS6 is a 0.35 micron process.


    To map these CPU cores to chips we get:


    ```

    /21064-150,166/ EV4 (originally), EV4S (now)

    /21064-200/ EV4S

