    # 2.3 Preparing to Install


    # 2.3.1 Creating the Boot and Supplemental Floppies


    Your Red Hat Linux/Intel CD set may include a boot diskette and supplemental diskette.
    If so, you may skip to Section 2.3.2. If not, you must create them.


    You need only a boot diskette if you are installing Red Hat Linux from CD-ROM
    or via NFS. You also need a supplemental diskette if you are installing from a
    hard disk, via FTP, or from a PCMCIA device.


    To create the boot and supplemental floppies, you need two blank, formatted, high-density
    (1.44 MB), 3.5-inch diskettes. The diskette images are located in the images directory
    on the Red Hat Linux CD or the FTP site where you get Red Hat Linux. Each image
    is a "snapshot" of the appropriate floppy diskette, which you need to transfer
    onto an actual floppy; you can do this using either MS-DOS or Linux.


    # Making Floppies Under MS-DOS


    To make floppies under MS-DOS, use the write utility included on the Red Hat Linux
    CD in the dosutils directory. First, label a formatted'
  - '[PAGE 25]


    # CHAPTER 2. INSTALLING RED HAT LINUX/INTEL


    3.5-inch floppy "Boot Diskette" or something similar and insert it into the floppy
    drive. Then, use the following commands (assuming your CD is drive d:):


    ```

    d:

    cd \images\rawrite

    ..\dosutils\rawrite.exe

    ```


    rawrite first asks you for the filename of a diskette image; enter boot.img. Then
    it asks for a diskette drive to write the image to; enter a:. If you need to make
    a supplemental floppy, label a second diskette and run rawrite again, using supp.img.


    # Making Floppies Under Linux


    To make floppies under Linux, you must have permission to write to /dev/fd0 (the
    3.5-inch floppy drive). Label a blank, formatted diskette "Boot Diskette" or something
    similar and insert it into the floppy drive (but don''t mount it). After mounting
    the Red Hat Linux CD, change to the images directory and use the following command:


    ```

    dd if=boot.img of=/dev/fd0 bs=1440k

    ```


    If you need to make a supplemental floppy, label a second diskette, insert it
    in the floppy drive, and then use the following command:


    ```

    dd if=supp.img of=/dev/fd0 bs=1440k

    ```


    # Installing Without Using a Boot Floppy


    Alternatively, if you have MS-DOS installed on your computer, you can boot the
    installation system directly from the CD without making floppies. To do this,
    use the following commands (assuming your CD is drive d:):


    ```

    d:

    cd \dosutils

    autoboot.bat

    ```'
