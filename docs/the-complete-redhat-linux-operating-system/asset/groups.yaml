    ## 2.2.3 磁盘分区


    要安装 Red Hat Linux，必须有可用的磁盘空间供其“运行”。这部分磁盘空间需要与您可能在计算机上安装的其他操作系统所使用的磁盘空间分开（例如 MS-DOS、OS/2、不同版本的
    Linux，或其他我们未命名的其他知名操作系统）。提供磁盘空间的方法是将磁盘划分为分区。


    您可能希望在独立的硬盘上安装 Red Hat Linux，甚至在某台不包含任何其他操作系统的计算机上安装。在这种情况下，您可以使用 Red Hat Linux
    安装系统来创建所需的磁盘分区。


    或者，您也可能希望在一块已经包含不同操作系统软件或数据的磁盘上安装 Red Hat Linux；如何创建所需的磁盘分区取决于存在哪种其他操作系统。


    ## 磁盘分区与 MS-DOS


    大多数来自供应商的 MS-DOS 系统都有一个硬盘，其中包含一个大分区。为了安装 Red Hat Linux，您需要缩小该分区的规模，然后在剩余空间中为 Red
    Hat Linux 创建分区。实现此目标有两种方法：


    **破坏性重新分区**：此过程会破坏您正在调整大小的磁盘分区（s）中的任何数据，您应该对正要重新分区的硬盘上您想要保留的所有内容进行完整、可靠的备份。然后，使用
    MS-DOS 磁盘分区工具（称为 `fdisk`）删除大分区并创建一个较小的 MS-DOS 分区。从您的备份中将数据恢复到新分区。


    ## 第 2 章. 安装 RED HAT LINUX/INTEL


    **非破坏性重新分区**：此过程不应破坏您正在调整大小的磁盘分区（s）中的数据；尽管如此，在任何情况下我们都建议对想要保留的数据进行可靠的备份。您可以使用
    Red Hat Linux CD 中 `dosutils` 目录下的 `fips` 工具来调整您的 MS-DOS 分区大小：在执行操作之前，我们强烈建议阅读位于
    `fipsdocs` 子目录下的 `fips` 文档。


    重新分区后，您可以按照“逐步安装”中的描述，使用 Red Hat Linux 安装系统为您的 Red Hat Linux 系统创建分区。


    ## 磁盘分区与其他操作系统


    关于创建与其他操作系统兼容的磁盘分区的信息，可以在 Red Hat Linux CD 中 `doc` 目录下的多个 HOWTO 和 Mini-HOWTOs
    中找到。


    ## 需要多少分区？


    如果您希望在单个分区上安装 Red Hat Linux，这是可以的。但是，我们建议以下方案：


    - 如果您希望在独立的硬盘上安装 Red Hat Linux，甚至在某台不包含任何其他操作系统的计算机上安装，您可以使用 Red Hat Linux 安装系统来创建所需的磁盘分区。

    - 或者，如果您希望在一块已经包含不同操作系统软件或数据的磁盘上安装 Red Hat Linux；如何创建所需的磁盘分区取决于存在哪种其他操作系统。

    - 大多数来自供应商的 MS-DOS 系统都有一个硬盘，其中包含一个大分区。为了安装 Red Hat Linux，您需要缩小该分区的规模，然后在剩余空间中为
    Red Hat Linux 创建分区。

    - 如果您希望在独立的硬盘上安装 Red Hat Linux，您可能需要按照“逐步安装”中的描述为您的 Red Linux 系统准备一个交换分区（swap
    partition）。

    - 如果您希望在一块已经包含不同操作系统软件或数据的磁盘上安装 Red Hat Linux；您可能需要按照“逐步安装”中的描述为您的 Red Linux 系统准备一个交换分区。


    ## 2.3. 准备安装


    关于与其他操作系统兼容的磁盘分区创建信息，可以在 Red Hat Linux CD 的 `doc` 目录下的多个 HOWTO 和 Mini-HOWTO 中找到。


    - **root 分区**：该分区包含操作系统及其所有文件。

    - **swap 分区**：该分区用于虚拟内存。

    - **home 分区**：该分区用于用户数据和设置。

    - **src 分区**：该分区在编译期间用于源代码。

    - **tmp 分区**：该分区用于临时文件。

    - **local 分区**：该分区用于本地化安装的软件。


    ### 2.3.2 关于控制台的说明


    Red Hat Linux 安装系统不仅仅是它提供的对话框。事实上，安装系统在运行时会呈现多种类型的诊断信息，并提供从 shell 提示符输入命令的方法。它显示了安装对话框、shell
    提示符以及可以通过按键切换的五个虚拟控制台的信息。如果您在安装 Red Hat Linux 时遇到问题，这些虚拟控制台会非常有帮助：显示在安装日志或系统日志上的信息有助于定位问题。请参图
    2.1 的虚拟控制台列表、切换到它们的按键及其内容。


    | 控制台 | 按键 | 内容 |

    |---|---|---|

    | 1 | Alt-F1 | 安装对话框 |

    | 2 | Alt-F2 | shell 提示符 |

    | 3 | Alt-F3 | 安装日志（来自安装程序的消息） |

    | 4 | Alt-F4 | 系统日志（来自内核等） |

    | 5 | Alt-F5 | 程序输出（来自其他程序的消息） |


    图 2.1：虚拟控制台信息


    ### 2.3.3 使用对话框


    您可以使用简单的按键在安装对话框之间导航。在大多数对话框中，有一个光标或高亮区域，您可以使用方向键 ← ↑ ↓、Tab 和 Alt Tab 进行移动。每个屏幕的底部都会显示移动命令的摘要。


    要“按下”按钮（如 OK、Tab）并从列表中选择项目，请将高亮移动到您想要选择的项目并按回车键。要从复选框列表中选择任意数量的项目，请将高亮移动到您想要选择的项目并按空格键。要取消选择项目，请再次按空格键。


    按下 F12 会接受当前值并进入下一个对话框；它通常等同于按下 OK 按钮。


    '
