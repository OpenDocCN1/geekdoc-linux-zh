    ## C.10. 移植


    任何基于 Alpha 的机器运行 Linux 的能力，实际上仅取决于你获取其内部详尽信息的能力。由于 E66、EB64+ 和 EB164 板上都有 Linux
    移植版本，所有基于 21066、21064/APECS 和 21164/ALCOR 的系统都应该可以在极少或不修改的情况下运行 Linux。这些主板之间主要的区别在于它们路由中断的方式。中断有三个来源：


    - 板载设备

    - PCI 设备

    - ISA 设备


    所有系统都使用 Intel 系统 I/O 桥节点（SIO）作为 PCI 和 ISA 之间的桥梁（主 I/O 总线是 PCI，ISA 总线是支持低速和“遗留”I/O设备的辅助总线）。SIO
    包含了传统的对级联 8259 控制器。


    某些系统（例如 Noname）将所有中断通过 SIO 随后传输到 CPU。某些系统具有独立的中断控制器，并将所有 PCI 中断以及 SIO（8259 输出）通过该控制器进行路由，并将所有
    ISA 中断通过 SIO 路由。


    系统之间的其他差异还包括：


    - 拥有多少个插槽

    - 拥有哪些板载 PCI 设备

    - 是否具有 Flash 或 EPROM


