    # 5.1.2 Making an initrd image


    An initrd image is needed for loading your SCSI module at boot time. The shell
    script /sbin/mkinitrd can build a proper initrd image for your machine if the
    following conditions are met:


    +   * The loopback block device is available.

    * The /etc/conf.modules file has a line for your SCSI adapter; for example:


    ```

    alias scsi_hostadapter BusLogic

    ```


    To build the new initrd image, run /sbin/mkinitrd with parameters such as this:


    ```

    /sbin/mkinitrd /boot/newinitrd-image 2.0.12

    ```


    where /boot/newinitrd-image is the file to use for your new image, and 2.0.12
    is the kernel whose modules (from /lib/modules) should be used in the initrd image
    (not necessarily the same as the version number of the currently running kernel).


    # 5.1.3 Building a monolithic kernel


    To build a monolithic kernel you follow the same steps as building a modular kernel
    with a few exceptions.


    +   * When configuring the kernel only answer Yes and No to the questions (don''t
    make anything modular).'
