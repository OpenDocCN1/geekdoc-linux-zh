    此时，你应该能够进入 SPARC 的 PROM 并输入：


    ```

    boot net fsroot=nfs.server.IP.address:/path/to/RH/image

    ```


    然后它将从 TFTP 服务器获取其 rar 请求响应，并通过 TFTP 开始加载内核。随后，内核将启动并开始安装。


    启动安装盘后，你将看到一个带有单个按钮的欢迎屏幕；按回车开始安装。


    现在，选择你将从哪个介质进行安装；NFS、硬盘或 FTP。如果你已有一个具有 EXT2 文件系统的分区，则可以从硬盘安装；目前尚未实现从 UFS 的安装。


    ## 4.4 网络安装


    你也可以通过通过 TFTP 传输整个安装镜像（内核和根文件系统）来执行 FTP 安装。你需要执行与上述示例相同的操作，nfsroot 和内核链接除外。不要使用
    /images/vmlinux，而是使用 tftpboot。将其放在 /home/tftpq 并创建软链接：


    ```

    cd /home/tftpq

    ln -s tftpboot.img C7B71E8.SUN4M

    ```


    请记住根据自己的网络数字和机器架构更改 IP 地址和架构。


    现在你需要做的就是从 SPARC 进行 boot net，它将通过 TFTP 传输所有内容，启动内核并运行安装程序。然后，你可以从附近的服务器进行 FTP
    安装，或者根据选择进行 NFS、硬盘驱动或 CD-ROM 安装。


    ## 4.5 使用串口终端安装


    你也可以使用串口终端安装 Red Hat Linux/SPARC 4.1；任何模拟 VT100 的终端都应该可以工作。从软盘启动，并在 SILO 提示符下输入：


    ```

    linux serial

    ```


    安装程序运行在第一个串口上，参数为 9600,8,N,1（9600 波特率，8 位，无校验位，1 位停止位）。如果你的串口终端支持颜色，安装程序可以彩色模式运行。


    在串口安装期间的任何提示对话框（任何带有 OK 按钮的对话框），你都可以按 Ctrl-Z 启动子 shell；要返回安装程序，在 shell 提示符处输入
    exit。


    **重要！** 使用串口终端安装后，登录你的 Red Hat Linux 系统的唯一方法是网络；然而，/etc/security 文件保留了 root 权限。在串口安装完成后，在重启之前，按
    Ctrl-Z 进入 shell 并输入：


    ```

    rm /etc/security

    ```


    ## 4.6 安装：选择组件


    在选择组件时，请参考第 2.4 节11。


    **重要！** 使用串口终端安装后，登录你的 Red Hat Linux 系统的唯一方法是网络；然而，/etc/security 文件保留了 root 权限。在串口安装完成后，在重启之前，按
    Ctrl-Z 进入 shell 并输入：


    ```

    rm /etc/security

    ```


    ## 4.7 SILO 配置


    SILO 配置与 LILO 配置非常相似。详情请见 2.18。


    ## 4.8 分区


    在分区硬盘时，你需要为磁盘末尾创建一个分区。


    ## 4.9 Windows


    上述两种方法都需要重启。8 位是默认的。


    ## 第 5 章


    ## 安装后操作


    安装后，你的系统功能完整，但你可能仍然想进行某些配置。


    ## 5.1 构建自定义内核


    随着 2.0 版本模块化的引入，编译内核发生了一些重大变化。过去，如果你需要特定的硬件，必须将其编译进内核。根据 2.0 的功能，如果硬件组件可以使用，可以按需加载。


    ## 构建模块化内核


    只有 Red Hat Linux/Intel 和 Red Hat Linux/SPARC 支持模块化内核；Red Hat Linux/Alpha 用户必须编译单体内核（见
    5.3）。


    这些说明提供了利用内核模块化功能所需的知识。如果你不想利用模块化，请参阅 5.3 关于构建和安装单体内核的说明。假设内核源码包已安装，且所有命令都在 usr/src/linux
    目录下执行。


    构建内核时，源码树处于已知状态很重要。因此，建议从运行 mr 命令开始，这将删除源码树周围任何配置文件。现在，你需要创建一个配置文件来确定新内核包含哪些组件。根据你的硬件和个人喜好，有三种方法可以配置内核：


