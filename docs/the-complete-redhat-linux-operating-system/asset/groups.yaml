    Hat Linux CD-ROM on a machine that supports ISO-9660 systems with Rock Ridge extensions.
    The machine must also support NFS. Export the CD-ROM file system via NFS. You
    will need to have nameservices configured, or know the NFS server''s IP address,
    and the path to the exported CD-ROM.


    **FTP** For an FTP install, you must have a boot disk and supplemental disk. You
    will need to have a valid nameserver configured or the IP address of the FTP server
    you will be using. You will also need the path to the root of the Red Hat Linux
    directory on the FTP site.


