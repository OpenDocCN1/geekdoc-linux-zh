    # 2.3.2 A Note About Virtual Consoles


    The Red Hat Linux installation system is more than simply the dialog boxes it
    presents as it guides you through the installation procedure. In fact, the installation
    system presents several different kinds of diagnostic messages while running,
    and it gives you a means to enter commands from a shell prompt. It presents the
    installation dialogs, shell prompt, and messages on five virtual consoles which
    you can switch between using a single keystroke. These virtual consoles can be
    very helpful if you encounter a problem while installing Red Hat Linux: messages
    displayed on the install log or system log can help to pinpoint the problem. Please
    see Figure 2.1 for a listing of the virtual consoles, the keystrokes to switch
    to them, and their contents.


    | Console | Keystroke | Contents |

