    ### 8.1.1 Adding or Editing a User


    The same interface is used to add and edit users. To add a user, click on the
    Add button in the main window. A dialog box will pop up like the one in figure
    8.2, with some defaults already filled in. First enter the username. This is the
    user''s first and last name: do not include any spaces and do not enter more than
    8 characters. Press the enter key when you are finished, and some of the other
    fields will be filled with default values. You may change them if you wish, but
    it is not necessary. You can, at your option, enter the user''s full name, office,
    and phone. The login shell can be changed from the default (normally /bin/bash)
    either by choosing a selection from the drop-down menu or by simply typing in
    the shell. You need to do something about the password. There are five options
    on the encrypted Password menu: Original, Change, No Password, Lock, and Unlock.
    No Password is a very bad option - with no password anyone can login to your system.
    Choosing Lock will prevent anyone from logging in but keep any password assigned
    so that it can be unlocked later; Unlock will unlock a previously locked password.
    Original is blank (No Password) when you are adding a new user - the same dialog
    box is used for editing users, when Original is the user''s password. Usually
    you will choose Change. A small dialog box will appear where you will need to
    enter a password, and then confirm it by typing it a second time. Click on Done
    in the password entry window to confirm that you type the password correctly.


    The numbers that the tool provides for UID and GID will work. If you change them,
    you are on your own; the tool is designed to assume that if you change them, you
    know what you are doing and want to change them. If you don''t know UID or GID
    leave them alone.


    If you have configured shadow passwords on your system you will have a Shadow
    Management button that will allow you to configure password and account expiry.
    By default (fields shown as blank have the default value), no expiry will be done.
    If you are unfamiliar with shadow account management, you will probably wish to
    accept the default. Click on Done when you are editing the expiry information.
    When you are editing the user, click on Done in the Edit User dialog box to add
    the user. If this user does not already have a home directory (and they won''t
    unless you have already created the home directory), one will be created.


