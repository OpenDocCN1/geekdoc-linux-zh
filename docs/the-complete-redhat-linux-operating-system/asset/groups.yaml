    header containing useful information about the package and its contents, allowing
    you to query individual packages quickly and easily.


    **System Verification** Another powerful feature is the ability to verify packages.
    If you are worried that you deleted an important file for some package, simply
    verify the package. You will be notified of any anomalies. At that point, you
    can reinstall the package if necessary. Any configuration files that you modified
    are preserved during reinstallation.


    **Pristine Sources** A crucial design goal was to allow the use of "pristine"
    software sources, as distributed by the original authors of the software. With
    RPM, you have the pristine sources along with any patches that were used, plus
    complete build instructions. This is a big advantage'
  - '[PAGE 92]


    # 7.2. USING RPM


    for several reasons. For instance, if a new version of a program comes out, you
    don''t necessarily have to start from scratch to get it to compile. You can look
    at the patch to see what you might need to do. All the compiled-in defaults, and
    all of the changes that were made to get the software properly are easily visible
    this way. This goal may seem important for developers, but it results in higher
    quality software for end users too. We would like to thank the folks from the
    BOGUS distribution for originating the pristine source concept.


    # 7.2 Using RPM


    RPM has five basic modes of operation (not counting package building): installing,
    uninstalling, upgrading, querying, and verifying. This section contains an overview
    of each mode. For complete details and options rpm --help, and see the rpm man
    page and the (previously mentioned) RPM book.


    # 7.2.1 Installing


    RPM packages typically have file names like foo-1.0-1.i386.rpm, which includes
    the package name (foo), version (1.0), release (1), and architecture (i386). Installing
    a package is as simple as:


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    foo #################

    ```


    As you can see, RPM prints out the name of the package (which is not necessarily
    the same as the file name, which could have been foo.rpm), and then prints a succession
    of hash marks as the package is installed, as a sort of progress meter.


    Installing packages is designed to be simple, but you can get a few errors:


    # Package Already Installed


    If the package is already installed, you will see:'
  - '[PAGE 93]


    # CHAPTER 7. PACKAGE MANAGEMENT WITH RPM


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    foo package-1.0-1 is already installed

    error: foo-1.0-1.i386.rpm cannot be installed

    ```


    If you really want to install the package anyway, you can use --replacepkgs on
    the command line, which tells RPM to ignore the error.


    # Conflicting Files


    If you attempt to install a package that contains a file that has already been
    installed by another packages, you''ll see:


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    foo /usr/bin/foo conflicts with file from bar-1.0-1

    error: foo-1.0-1.i386.rpm cannot be installed

    ```


    To cause RPM to ignore that error, use --replacefiles on the command line.


    # Unresolved Dependency


    RPM packages can “depend” on other packages. which means that they require other
    packages to be installed in order to run properly. If you try to install a package
    for which there is such an unresolved dependency, you''ll see:


    ```

    $ rpm -ivh bar-1.0-1.i386.rpm

    failed dependencies:

    foo is needed by bar-1.0-1

    ```


    To handle this error you should install the requested packages. If you want to
    force the installation anyway (a bad idea since the package probably will not
    run correctly), use --nodeps on the command line.


    # 7.2.2 Uninstalling


    Uninstalling a package is just as simple as installing:'
  - '[PAGE 94]


    # 7.2. USING RPM


    $ rpm -e foo


    Notice that we used the package name “foo”, not the name of the original package
    file “foo-1.0-1.i386.rpm”.


    You can encounter a dependency error when uninstalling a package if some installed
    package depends on the one you are trying to remove. For example:


    ```

    $ rpm -e foo

    removing these packages would break dependencies:

    foo is needed by bar-1.0-1

    ```


    To cause RPM to ignore that error and uninstall the package anyway (which is a
    bad idea since the package that depend on it will probably fail to work properly),
    use --nodeps on the command line.


    # 7.2.3 Upgrading


    Upgrading a package is almost just like installing.


    ```

    $ rpm -Uvh foo-2.0-1.i386.rpm

    foo #################################

    ```


    What you don''t see above is the fact that RPM automatically uninstalled any old
    versions of the foo package. In fact you may want to always use -U to install
    packages, since it works fine even when there are no previous versions of the
    package installed.


    Since RPM performs intelligent upgrading of packages with configuration files,
    you may see a message like:


    ```

    saving /etc/foo.conf as /etc/foo.conf.rpmsave

    ```


    This means that your changes to the configuration file may not be “forward compatible”
    with the new configuration file in the package, so RPM saved your original file,
    and installed a new one. You should investigate and resolve the differences between
    the two files as soon as possible to ensure that your system continues to function
    properly.'
