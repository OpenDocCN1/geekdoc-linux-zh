    ## E.3. 安装问题


    如果你只想重新配置网络或安装更多包，请尝试使用控制面板工具。


    ## E.3.5 为什么我缺少程序？


    尝试在 shell 提示符下运行 `df`。如果你发现 `/` 或 `/usr` 显示使用率为 100%，很可能是你的分区太小，无法容纳整个安装。遗憾的是，这不会产生任何类型的错误消息，除非你仔细观察（大多数人在系统提示安装需要
    2 小时时并不会留意 :-）。你可能需要重新安装并采取两种操作之一：a) 增大根分区或 `/usr` 分区或 b) 安装较少的包。


    此外，如果你为 Linux 创建的所有分区都没有满，那么你可能只是缺少了一些包。你需要使用 glint 或 rpm 来安装这些包。


    ## E.3.6 我如何挂载我的 CD-ROM？


    如果你是从 CD-ROM 安装的，你应该能够执行：


    ```bash

    mount /mnt/cdrom

    ```


    如果收到错误说挂载点不存在，请执行：


    ```bash

    mkdir /mnt/cdrom

    ```


    如果你是通过 NFS 安装的：你需要知道你的是哪种类型的 CD-ROM。最好的方法是在重启时观察启动信息，或者查看 /var/adm/messages（更多见
    /var/adm/messages）。你可能有一个 IDE CD-ROM，它会显示为 /dev/hde 或 /dev/hdd；或者你有一个 Sound Blaster
    类型显示为 /dev/sbpcd；或者你有一个 SCSI 显示为 /dev/scd0。


    在任何情况下，你都可以执行以下操作：


    ```bash

    mount -t iso9660 /dev/xxxx /mnt/cdrom

    ```


    并将 xxxx 替换为你的设备。然后你可以：cd /mnt/cdrom 接着执行：ls -l，这样你就能看到 CD-ROM 的内容了。


    ## E.3.7 为什么 Linux 只能看到部分内存？


    可能有几个地方出了问题。在某些 386 上，你需要在编译内核时启用“Limit memory to 16M”。某些 AMI BIOS 主板有一个将内存分成两个段的内存选项。我不确定该选项叫什么，但它与“linear（线性）”有关。你会在
    BIOS 设置中找到它。你可能需要在启动时从 lilo 为内核指定内存量。要尝试这样做，在 lilo 提示符中输入：linux mem=32M。如果有效，你可以将该行添加到
    /etc/lilo.conf 的 append 之后，并重新运行 lilo。上面的示例如下：


    ```bash

    append = "mem=32M"

    ```


    别忘记在编辑文件后运行 ''lilo''。


    ## E.3.8 我如何安装到 DOS 分区？


    你不能这样做。目前的 Red Hat 都不支持 UMSDOS 安装。如果你有一个硬盘，其中有一个带有你想使用的空闲空间的大 DOS 分区，你有两个选择。一种是以后某种方式备份所有数据，然后将硬盘重新分区为较小的分区，然后将
    DOS 数据恢复到 DOS 分区。这样你就有了一个供 Linux 使用的空分区。第二个选择是使用 fips。fips 是一个让你在不损坏分区内数据的情况下更改
    DOS 分区大小的程序。**强烈**在使用 fips 之前备份你的数据。Red Hat Software 对使用 fips 实现此目的适用性不作任何保证或声明，我们也不保证数据不受损坏。我没听说有人用
    fips 有过糟糕经历，但我也不保证这一点。


    ## E.3.9 我如何使用 RedHat 自带的 NYS/NIS 系统


    请参阅 NYS-Tips。你可以在 http://www.redhat.com/ 找到它。


    ## E.4. 使用 RED HAT LINUX


    ## E.3.10 安装 Linux 后，我为什么无法进入 Unixware 了？


    你需要从启动软盘启动 Unixware 并运行 `fdisk /mbr`。这应该允许你重新进入 Unixware，但不会让你访问 Linux。


    ## E.3.11 为什么我的 Diamond 显卡在 X Windows 下运行异常？


