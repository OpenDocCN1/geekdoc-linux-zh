    支持，安装程序将提示你插入补充软盘。


    #### CD-ROM 类型


    如果你选择从 CD-ROM 安装 Red Hat Linux/Intel，安装程序会提示你 CD-ROM 的类型：


    - IDE (ATAPI)：大多数基于 Intel 的 PC 可用的 CD-ROM 都是 IDE（也称为 ATAPI）CD-ROM。安装程序在放弃之前会检查所有可用的
    IDE 设备上的 CD-ROM。

    - SCSI：如果你的 CD-ROM 连接到支持的 SCSI 适配器上，请选择此项：安装程序会要求你选择 SCSI 驱动程序。选择与你的适配器最相似的驱动程序。如有，你可以为驱动程序指定选项；但大多数驱动程序会自动检测你的
    SCSI 适配器。

    - 其他：如果你的 CD-ROM 既不是 IDE 也不是 CD-ROM，它就是“其他”。安装程序会列出支持的 CD-ROM 的驱动程序列表；选择一个驱动程序，并在必要时指定任何驱动程序选项。


    ### 2.4.4 如果你正在通过 NFS 安装


    如果你不是通过 NFS 安装 Red Hat Linux，可以跳到下方的第 2.4.5 节。


    ![](img/bef0eed6d460726bef2ee16ade180160_30_0.png)


    图 2.3：选择安装方法


    #### 选择网络驱动程序


    如果你通过 NFS 安装，你的计算机中必须安装了受支持的网卡。安装程序提示你选择支持你的网卡的驱动程序，并指定驱动程序识别网卡所需的选项。大多数情况下，驱动程序可以通过探测自动定位网卡；但探测硬件可能会导致机器挂起。如果发生这种情况，请重启机器重新启动安装，并在该步骤指定驱动选项（参见附录
    B）。


    #### 配置 TCP/IP


    安装程序找到网卡后，会显示多个配置 TCP/IP 的对话框。这些信息仅在安装过程中使用；如果你想从网络其他安装，此功能提供了更大的灵活性。第一个对话框要求输入
    IP 和其他网络地址（见图 2.5）。输入安装期间使用的 IP 地址并按 Enter。


