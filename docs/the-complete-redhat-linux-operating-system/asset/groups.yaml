    ## 1.5. UPGRADING FROM A PRIOR VERSION


    your network (for an FTP or NFS install). Then reboot the machine and answer all
    questions as they are presented. If you are installing from PCMCIA, FTP or Hard
    disk, insert the supplemental disk when prompted.


    ## 1.5 Upgrading from a Prior Version


    The installation process for Red Hat Linux 4.1 includes the ability to upgrade
    from prior versions of Red Hat Linux (2.0, 2.1, 3.0.3, and 4.0) which are based
    on RPM technology. Upgrading your system installs the modular 2.0.x kernel as
    well as updated versions of the packages which are installed on your machine.
    The upgrade process preserves configuration files using a .rpmsave extension (e.g.,
    sendmail.cf.rpmsave) and leaves a log telling what actions it took in /tmp/upgradelog.
    As software evolves, configuration file formats can change, so you should carefully
    compare your original configuration files to the new files before integrating
    your changes.


    To upgrade a Red Hat Linux system, you must use a boot floppy (and possibly a
    supplemental floppy), just if you were performing a full install. After selecting
    the medium to install from (and setting up networking if it''s required), the
    installation procedure prompts you to either Install or Upgrade: select Upgrade.
    This upgrade procedure is the functional equivalent of running the upgrade script
    in prior versions of Red Hat Linux.


    Please note that some upgraded packages may "depend" on other packages which may
    not be installed on your system. The upgrade procedure takes care of these dependencies;
    but it may need to install additional packages in order to satisfy them.


    ## 1.6 Running Directly off the CD-ROM


    Prior versions of Red Hat Linux came with a "live filesystem" on the CD-ROM; this
    allowed users to run Red Hat Linux directly off the CD-ROM without first installing
    it on their hard drive.


    Unfortunately, with the modular Linux-2.0.x kernel, adding "live" boot capabilities
    has become too complex and is no longer supported. We apologize for the inconvenience.


    ## Chapter 2


    ## Installing Red Hat Linux/Intel


    This chapter explains in detail how to install or upgrade Red Hat Linux on Intel
    and compatible PCs. This chapter is organized as follows:


    - Section 2.1, The Red Hat Linux Errata, contains important pointers to the most
    current information about Red Hat Linux/Intel 4.1.

    - Section 2.2, Before You Begin, describes some of the things you need to know
    before you actually install Red Hat Linux.

    - Section 2.3, Preparing to Install, tells how to create installation floppies
    (if were not included with your copy of Red Hat Linux) and explains how to use
    the installation program.

    - Section 2.4, Step-By-Step Installation, gives step-by-step instructions for
    completing the entire installation or upgrade process.


    ## 2.1 The Red Hat Linux Errata


    Occasionally, we discover problems with a release of Red Hat Linux, some of which
    may affect installation. When we discover a problem, we post information about
    the problem and our solution in the Red Hat Linux Errata, which we make available
    in several ways:


    - via the World Wide Web: http://www.redhat.com/errata

    - via electronic mail: errata@redhat.com


    Please note that the solution to a problem listed in the Errata may require that
    you use a different boot or install disk image than the ones which are mentioned
    below or which come with your Red Hat Linux CD-ROM.


    ## 2.2 Before You Begin


    Before you begin installing Red Hat Linux, you should collect some information
    about your system:


    - Be familiar with the hardware you have installed in your machine, including:

    - hard drive(s) — number and size; if you have more than one, it''s helpful to
    know which one is first, second, etc.

    - memory — amount of RAM.

    - CD-ROM — its interface type (IDE, SCSI, or other interface). and for non-IDE,
    non-SCSI CD-ROMs, the make and model number.

    - SCSI adapter — make and model number.

    - network card — make and model number.

    - mouse — type (serial, PS/2, or bus mouse), protocol (Logitech-Microsoft, MouseMan,
    etc.), and number of buttons; also, for serial mice, the com port it is connected
    to.


    Also, if you will be installing the X Window System, you should be familiar with
    the following:


    - your video card — make and model number or video chipset, amount of video RAM.

    - your monitor — make and model number. allowable range of horizontal and vertical
    refresh rates.


    ## 2.2. BEFORE YOU BEGIN


    You can find most of the above information in the documentation accompanying your
    system or from your system''s vendor or manufacturer.


    - If you will be connected to a network, be sure you know your IP address, netmask,
    gateway IP address, name server IP addresses, domain name, and hostname. If you
    don''t know these values, ask your network administrator.

    - If Red Hat Linux/Intel will coexist with OS/2, you must create your disk partitions
