    Installing from CD-ROM or via NFS requires only a boot diskette. Installing from
    a hard drive, via FTP, or from a PCIA device (including PCMCIA-based CD-ROMs)
    requires both a boot diskette and a supplemental diskette. Section 2.3.1 below
    explains how to create boot and supplemental diskettes.


    **CD-ROM** If you have a Red Hat Linux CD and a boot diskette you will need a
