    ####....


    The following systems are *known* to have SRM Console support:


    +   - Noname (Section D.5.6)

    - AlphaPC64 (Section D.5.6)

    - EB164 (Section D.5.6)


    # D.5.6 System Specific Information


    # AxpPCI333 (Noname)


    The Noname board can load Milo from the Windows NT ARC firmware (Section D.5.1
    booting from Windows NT ARC firmware), from the SRM Console (Section D.5.5 Loading
    Milo from the SRM Console), and from a failsafe boot block floppy (Section D.5.3
    Loading from a Failsafe Boot Floppy). A flash management utility, runnable from
    Milo is available so that once Milo is running, it can be blown into flash (Section
    D.7 running the flash management utility). However, be warned that once you have
    done this you will lose the previous image held there as there is only room for
    one image.


    The way that Noname boots is controlled by a set of jumpers on the board, J29
    and J28. These look like:


    ```

    4

    J29 2 x x x 6

    1 x x x 5


    J28 2 x x x 6

    1 x x x 5

    3

    ```


    The two options that we''re interested in are J28, pins 1-3 which boots the console/loader
    from flash and J29, pins 1-3 which boots the console/loader'
  - '[PAGE 185]


    # 172 APPENDIX D. ALPHA MINILOADER HOWTO


    from a boot block floppy. The second option is the one that you need to first
    boot Milo on the Noname board.


    Once you''ve selected the boot from floppy option via the jumpers, put the SRM
    boot floppy containing Milo into the floppy and reboot. In a few seconds (after
    the floppy light goes out) you should see the screen blank to white and Milo telling
    you what you''s going on.


    If you are really interested in technical stuff, the Noname loads images off of
    the floppy into physical address 0x104000 and images from flash into 0x100000.
    For this reason, Milo is built with it''s PALcode starting at 0x020000. When it
    is first loaded, it moves itself to the correct location (relocate).


    # AlphaPC64 (Cabriolet)


    The AlphaPC64 includes the Windows NT ARC firmware (Section D.5.1). the SRM Console
    (Section D.5.5) and the Evaluation Debug Monitor (Section D.5.2 Loading from the
    Debug Monitor). These images are in flash and there is room to add Milo so that
    you can boot Milo directly from flash. A flash management utility, runnable from
    Milo is available so that once Milo is running, it can be blown into flash (Section
    D.7 running the flash management utility). This system supports Milo environment
    variables.


    You select between the boot options (and Milo when it is been put into flash)
    using a combination of jumpers and a boot option which is saved in the NVRAM of
    the TOY clock.


    The jumper is J2, SP bits 6 and 7 have the following meanings: itemize itemSP
    bit 6 should always be out. If this jumper is set then the SROM mini-debugger
    gets booted. itemSP bit 7 in boot image selected by the boot option byte in the
    TOY clock, itemSP bit 7 is out first image in flash. /itemize


    So, with 7 out, the Debug Monitor will be booted as it is always the first image
    in flash. With bit 7, the image selected by the boot option in the TOY clock will
    be selected. The Debug Monitor, the Windows NT ARC firmware and Milo all support
    this boot option but you must be very careful using it. In particular, you cannot
    set the boot option so that next time the system boots Milo when you are running
    the Windows NT ARC firmware, it only allows you to set Debug Monitor or Windows'
  - '[PAGE 186]


    # D.5. HOW TO LOAD MILO


    NT ARC as boot options.


    To get Milo into flash via the Evaluation Board Debug Monitor, you will need a
    flashable image. The build procedures make milo.rom, but you can also make a rom
    image using the makerom tool in the Debug Monitor software that comes with the
    board:


    ```

    makerom -v -i7 -1200000 Milo -o mini.flash

    ```


    (type makerom to find out what the arguments mean, and 7 is a flash image used
    by the srom and -1200000 gives the load address for the image as 0x200000)


    Load that image into memory (via the Debug, Monitor commands fload, netload, and
    so on) at 0x200000 and then blow the image into flash:


    AlphaPC64} flash 200000 8


    (200000 is where the image to be blown in memory and 8 is the segment number where
    you put the image. There are 16 1024*64 byte segments in the flash and the Debug
    Monitor is at seg 0 and the Windows NT ARC firmware is at seg 4)


    Set up the image that the srom will boot by writing the number of the image into
    the TOY clock.


    AlphaPC64} bootopt 131


    (131 means boot the 3rd image, 129 = 1st, 130 = 2nd and so on).


    Power off, put jumper 7 on and power on and you should see the Milo burst into
    life. If you don''t take jumper 7 back off and reboot the Debug Monitor.


    # EB66+


    The EB66+, like all of the Alpha Evaluation Boards built by Digital contains the
    Evaluation Board Debug Monitor and so this is available to load Milo (Section
    ref id="dbm-section" name="Loading from the Debug Monitor\). Often (although not
    always) boards whose design is derived'
  - '[PAGE 187]


    from these include the Debug Monitor also. Usually, these boards include the Windows
    NT ARC firmware (Section refid="arc-section" name="booting from Windows NT ARC
    firmware"). A flash management utility, runnable from Milo is available once Milo
    is running, it can be blown into flash (Section refid="milo-finu-section" name="running
    the flash management utility\). This system supports Milo environment variables.


    These systems have several boot images in flash controlled by jumpers. The two
    jumper banks are J18 and J16 and are located at the bottom of the board in the
    middle (if the Alpha chip is at the top). You select between boot options (and
    Milo when it is put into flash) using a combination of jumpers and a boot option
    which is saved in the NVRAM of the TOY clock.


    Jumper 7-8 of J18 in means boot the image described by the boot option. Jumper
    7-8 of J18 out means boot the Evaluation Board Debug Monitor.


    Blowing an image into flash via the Evaluation Board Debug Monitor is exactly
    the same procedure as for the AlphaPC64 (Section refid="pc64-section" name="AlphaPC64").


    # EB64+/Aspen Alpine


    This system is quite like the Alpha64 except that it does not contain flash which
    Milo can be loaded from. The EB64+ has two ROMs, one of which contains the Windows
    NT ARC firmware (Section refid="arc-section" name="booting from Windows NT ARC
    firmware"), and the other contains the Evaluation Board Debug Monitor (Section
    refid="dbm-section" name="Loading from the Debug Monitor").


    The Aspen Alpine is a little different in that it has only one ROM: this contains
    the Windows NT ARC firmware.


    # Universal Desktop Box (Multilia)


    This is a very compact pre-packaged 21066 based system that includes a TGA (21030)
    graphics device. Although you can just fit a half height PCI graphics card in
    the box you are better off waiting for full TGA support in XFree86. It includes
    the Windows NT ARC firmware and so booting from that is the preferred method (Section
    refid="arc-section" name="Loading'
  - '[PAGE 188]


    # D.5. HOW TO LOAD MILO


    from Windows NT")."


    # EB164


    The EB164, like all of the Alpha Monitor built by Digital contains the Evaluation
    Board Debug Monitor and so this is available to load Milo (Section D.5.2 Loading
    from the Debug Monitor). Quite often (although not always) boards whose design
    is derived from these include the Debug Monitor also. Usually, these boards include
    the Windows NT ARC firmware (Section D.5.1 booting from Windows NT ARC firmware).
    The SRM console is also available (Section D.5.3 Loading Milo from the SRM Console).
    A flash management utility, runnable from Milo is available so once Milo is running,
    it can be blown into flash (Section D.7 running the flash management utility).
    This system supports Milo environment variables.


    These systems have several boot images in flash controlled by jumpers. The two
    jumper bank is J1 and is located at the bottom of the board on the left (if the
    Alpha chip is at the top). You select between the boot options (and Milo when
    it is put into flash) using a combination of jumpers and a boot option which is
    saved in the NVRAM of the TOY clock.


    Jumper SP-11 of J1 in means boot the image described by the boot option. Jumper
    SP-11 of J1 out means boot the Evaluation Board Debug Monitor.


    Blowing an image into flash via the Evaluation Board Debug Monitor is exactly
    the same procedure as for the AlphaPC64 (Section D.5.6 AlphaPC64).


    # XL266


    The XL266 is one of a family of systems that are known as Avanti. It has a riser
    card containing the Alpha chip and cache which plugs into the main board at right
    angles. This board can replace the equivalent Pentium board.


    Some of these systems ship with the SRM console but others, notably the XL266
    ship with only when it is booting the Windows NT ARC firmware (Section D.5.1 booting
    from Windows NT ARC firmware).


    Here is my list of compatible systems:'
- md: "\n# 176 APPENDIX D. ALPHA MINILOADER HOWTO\n\n- AlphaStation 400 (Avanti),\n\
    - AlphaStation 250,\n- AlphaStation 200 (Mustang),\n- XL. There are two flavours,\
    \ XL266 and XL233 with the only difference being in processor speed and cache\
    \ size.\n\nNote: The system that I use to develop and test Milo is an XL266 and\
    \ so this is the only one that I can guarantee will work. However, technically,\
    \ all of the above systems are equivalent; they have the same support chipsets\
    \ and the same interrupt handling mechanisms.\n\n## Platform2000\n\nThis is a\
    \ 233Mhz 21066 based system.\n\n## D.6 Milo’s User Interface\n\nOnce you have\
    \ correctly installed/loaded/run Milo you will see the MILO (for MiniLoader) prompt\
    \ displayed on your screen. There is a very simple interface that you must use\
    \ in order to boot a particular Linux kernel image. Typing “help” is a good idea\
    \ as it gives a useful summary of the commands.\n\n### D.6.1 The \"help\" Command\n\
    \nProbably the most useful command that Milo has:\n\n```\nMILO> help\nMILO command\
    \ summary:\n\nls [-t fs] [dev:dir]\n  - List files in directory device\nboot [-t\
    \ fs] [dev:file] [boot string]\n  - Boot Linux from the specified device and file\n\
    run [-t fs] dev:file\n```\n\n## D.6. MILO'S USER INTERFACE\n\n```\n- Run the standalone\
    \ program dev:file\n- Display all known devices and file systems\n- Set the variable\
    \ VAR to the specified VALUE\n- Delete the specified variable\n- Delete all variables\n\
    - Display current variable settings\n- Print this help text\n```\n\nDevices are\
    \ specified as: fd0, hda1, hda2, sda1...\nUse the '-t filesystem-name' option\
    \ if you want to use anything but the default filesystem ('ext2').\nUse the 'show'\
    \ command to show known devices and filesystems.\nType 'help var' for a list of\
    \ variables.\n\nNote that the bootopt command only appears on AlphaPC64 (and similar)\
    \ systems. Refer to the board's documentation to find out what it means.\n\nDevices:\
    \ Until you use a command that needs to make use of a device, no device initialization\
    \ will take place. The first show, ls, or run commands all cause the devices within\
    \ Milo to be initialised. Devices are named in the same way (exactly) Linux itself\
    \ will name them. So, the first IDE disk will be called 'hda' and its first partition\
    \ will be 'hda1'. Use the show command to show what devices are available.\n\n\
    File Systems: Milo supports three file systems: MSDOS, EXT2 and ISO9660. So long\
    \ as a device is available to it, Milo can list boot or run an image stored on\
    \ one of these file systems. Milo's default file system is EXT2 and so you tell\
    \ Milo that the file system is something other than that. All of the commands\
    \ that use filenames allow you to pass the file system using the -t [filesystem]\
    \ option. So, if you wanted to list the contents of a SCSI CD ROM, you type the\
    \ following:\n\n```\nMILO> ls -t iso9660 scd0\n```\n\nVariables: Milo contains\
    \ some settable variables that help the boot process. If you are loading via the\
    \ Windows NT ARC firmware, then Milo makes use of the boot option variables set\
    \ up by that firmware. For some systems, Milo (for example, the AlphaPC64) maintains\
    \ its own set of environment variables that do not change from boot to boot. These\
    \ variables are:\n\n# APPENDIX D. ALPHA MINILOADER HOWTO\n\n```\nMILO> help var\n\
    Variables that MILO cares about:\nMEMORY_SIZE - System memory size in megabytes\n\
    BOOT_DEV - Specifies the default boot device\nBOOT_FILE - Specifies the default\
    \ boot file\nBOOT_STRING - Specifies the boot string to pass to the kernel\nCSISIN_HOSTID\
    \ - Specifies the host id of the n-th SCSI controller\nAUTOBOOT - If set, MILO\
    \ attempts to boot on powerup\n  enters command loop only on failure.\nAUTOBOOT_TIMEOUT\
    \ - Seconds to wait before auto-booting on purpose.\n```\n\n### D.6.2 Booting\
    \ Linux\n\nThe boot command boots a linux kernel from a device. You will need\
    \ to have a linux kernel image on an EXT2 formatted disk (SCSI, IDE or floppy)\
    \ or an ISO9660 formatted CD available to Milo. The image can be zipped and in\
    \ this case Milo will recognise it as gzip by the .gz suffix.\n\nYou should note\
    \ that the version of Milo does not usually have to match the version of the Linux\
    \ kernel that you are loading. You boot Linux using the following command syntax:\n\
    \n```\nMILO> boot [-t file-system] device-name:file-name [boot-option(s)]\n```\n\
    \nWhere device-name is the name of the device you wish to use and file-name is\
    \ the name of the file containing the Linux kernel. All arguments supplied after\
    \ the file name are passed directly to the Linux kernel.\n\nIf you are installing\
    \ Red Hat, then you will need to specify a root device and so on. So you would\
    \ use:\n\n```\nMILO> boot fd0:mlinux.gz root=/dev/fd0 load_ramdisk=1\n```\n\n\
    Milo will automatically contain the block devices that you configure into your\
    \ vmlinux. I have tested the floppy driver, the IDE driver and the NCR SCSI driver,\
    \ these work fine. Also, it is important to set the host id of the SCSI controller\
    \ to a reasonable value.\n\nHowever, if you wish, to set the host id of the SCSI\
    \ controller to a reasonable value, you can use the following command. For example,\
    \ to set the host id of the SCSI controller to 7, you can use the following command:\n\
    \n```\nsetenv HOSTID 7\n```\n\n### D.6.3 Rebooting Linux\n\nThe boot command boots\
    \ a linux kernel from a device. You will need to have a linux kernel image on\
    \ an EXT2 formatted disk (SCSI, IDE or floppy) or an ISO9660 formatted CD available\
    \ to Milo. The image can be zipped and in this case Milo will recognise it as\
    \ gzip by the .gz suffix.\n\nYou should note that the version of Milo does not\
    \ usually have to match the version of the Linux kernel that you are loading.\
    \ You boot Linux using the following command syntax:\n\n```\nMILO> boot [-t file-system]\
    \ device-name:file-name [boot-option(s)]\n```\n\nWhere device-name is the name\
    \ of the device you wish to use and file-name is the name of the file containing\
    \ the Linux kernel. All arguments supplied after the file name are passed directly\
    \ to the Linux kernel.\n\nIf you are installing Red Hat, then you will need to\
    \ specify a root device and so on. So you would use:\n\n```\nMILO> boot fd0:mlinux.gz\
    \ root=/dev/fd0 load_ramdisk=1\n```\n\nMilo will automatically contain the block\
    \ devices that you configure into your vmlinux. I have tested the floppy driver,\
    \ the IDE driver and the NCR SCSI driver, these work fine. Also, it is important\
    \ to set the host id of the SCSI controller to a reasonable value.\n\nNote: Until\
    \ you use a command that needs to make use of a device, no device initialization\
    \ will take place. The first show, ls, or run commands all cause the devices within\
    \ Milo to be initialised. Devices are named in the same way (exactly) Linux itself\
    \ will name them. So, the first IDE disk will be called 'hda' and its first partition\
    \ will be 'hda1'. Use the show command to show what devices are available.\n\n\
    File Systems: Milo supports three file systems: MSDOS, EXT2 and ISO9660. So long\
    \ as a device is available to it, Milo can list boot or run an image stored on\
    \ one of these file systems. Milo's default file system is EXT2 and so you tell\
    \ Milo that the file system is something other than that. All of the commands\
    \ that use filenames allow you to pass the file system using the -t [filesystem]\
    \ option. So, if you wanted to list the contents of a SCSI CD ROM, you type the\
    \ following:\n\n```\nMILO> ls -t iso9660 scd0\n```\n\n### D.6.4 The “bootopt”\
    \ command\n\nFor flash based systems such as the AlphaPC64 there are a number\
    \ of possible boot options and these are changed using the bootopt command. This\
    \ has one argument, a decimal number which is the type of firmware to use on next\
    \ power up:\n\nIn order to boot Milo from flash then you need 128 plus N, so if\
    \ Milo is the third image, you would use the command:\n\n```\nMILO> bootopt 131\n\
    ```\n\nNote: Be very careful with this command. A good rule is never to set bootopt\
    \ to 0 (the Evaluation Board Debug Monitor), but instead use the system's jumpers\
    \ to achieve the same thing.\n\n## D.7 Running the Flash Management Utility\n\n\
    The run command is used to run the flash management utility. Before you start\
    \ you will need a device available to Milo that contains the updateflash program.\
    \ This (like vmlinux) can be gzipped. You need to run the flash management utility\
    \ from Milo using the (run) command:\n\n```\nMILO> run fd0:fmu.gz\n```\n\nOnce\
    \ it has loaded and initialised, the flash management utility will tell you some\
    \ information about the flash device and give you a command prompt. Again the\
    \ help command is most useful.\n\n```\nLinux Milo Flash Management Utility V1.0\n\
    Flash device is an Intel 28f008SA\n16 segments, each of 0x10000 (65536) bytes\n\
    Scanning Flash blocks for usage\nBlock 12 contains the environment variables\n\
    FMU>\n```\n\n### D.7.1 The \"help\" command\n\n```\nFMU> help\nFMU command summary:\n\
    ```\n\n- List the contents of flash\n- program an image into flash\n- Quit\n-\
    \ environment - Set which block should contain the environment\n- bootopt num\
    \ - Select firmware type to use on next power up\n"
  mdcn: "\n\n# 176 附录 D. ALPHA MINILOADER 使用指南\n\n- AlphaStation 400 (Avanti),\n-\
    \ AlphaStation 250,\n- AlphaStation 200 (Mustang),\n- XL. 有两种型号，XL266 和 XL233，唯一的区别在于处理器速度和缓存大小。\n\
    \n注意：我用于开发和测试 Milo 的系统是 XL266，因此这是我唯一能保证可以工作的系统。然而，从技术上讲，上述所有系统都是等等的；它们具有相同的支持芯片组和相同的中断处理机制。\n\
    \n## Platform2000\n\n这是一个基于 21066 的 233Mhz 系统。\n\n## D.6 Milo 用户界面\n\n一旦你正确安装/加载/运行了\
    \ Milo，你将在屏幕上看到 MILO（MiniLoader 的简称）提示符。有一个非常简单的界面，你必须通过它启动特定的 Linux 内核镜像。输入“help”是一个好主意，因为它提供了命令的有用总结。\n\
    \n### D.6.1 \"help\" 命令\n\n可能是 Milo 最实用的命令了：\n\n```\nMILO> help\nMILO 命令总结:\n\n\
    ls [-t fs] [dev:dir]\n  - 列出设备中的文件\nboot [-t fs] [dev:file] [boot string]\n  -\
    \ 从指定的设备和文件启动 Linux\nrun [-t fs] dev:file\n```\n\n## D.6. Milo 用户界面\n\n```\n-\
    \ 运行独立程序 dev:file\n- 显示所有已知设备和文件系统\n- 将变量 VAR 设置为指定的 VALUE\n- 删除指定的变量\n- 删除所有变量\n\
    - 显示当前变量设置\n- 打印此帮助文本\n```\n\n设备指定方式为：fd0, hda1, hda2, sda1...\n如果你想使用默认文件系统 ('ext2')\
    \ 以外的任何系统，请使用 '-t filesystem-name' 。\n使用 'show' 命令显示已知设备和文件系统。\n输入 'help var'\
