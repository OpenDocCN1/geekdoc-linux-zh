    ## 4.3. BOOTING FROM A NETWORK


    When prompted, enter the file name of the image to write to floppy.


    Under Linux or Unix, mount the CD, change to the directory it is mounted, and
    use the following command:


    ```

    dd if=images/boot-v2.img of=/dev/fd0

    ```


    Replace boot-v2.img with boot-v0.img if you have a version 0 or 1 PROM. Also note,
    do not use /dev/rfd0 under Solaris; it will not work. Use /dev/fd0 instead.


    Insert the diskette, and at the PROM prompt enter floppy. You will be presented
    with a SILO prompt. If you wish to do install using randisk (it will use about
    2M of RAM and is recommended if you have 8M or more of RAM), you can simply press
    Enter at the SILO prompt. If you wish to do an NFS-rooted install, you will need
    to supply some parameters here. The formula is as follows:


    ```

    linux nfsroot=nfs.server.IP_address:path/to/RH/image

    ```


    For this work you will need a rarp entry or a bootp entry on your network will
    give your SPARC its IP address. This is covered in Section 4.3 below.


    ## 4.3 Booting from a Network


    If you do not have floppy drive, and your PROM is less than version 2, you will
    need to do a network boot. This is fairly easy to, but you will need a rarp entry
    on a server on your local network to tell the target SPARC what its IP address
    is. This can be done on a Linux system that has RARP built into the kernel (or
    inserted as a module), using a command of this form:


    ```

    rarp -s ip.address.of:sparc hw:address:of:sparc

    ```


    You also need an ARP entry in most cases; for example:


    ```

    arp -s ip.address.of:sparc hw:address:of:sparc

    ```


    ## CHAPTER 4. INSTALLING RED HAT LINUX/SPARC


    Now you need to set up a TFTP server on your local network to serve the kernel
    to the target SPARC. This should be the same machine that is doing the ramp above.
    Under Red Hat Linux, this can be done by editing /etc/inetd.conf. You need an
    entry that looks similar to:


    ```

    tftp dgram udp wait root /usr/sbin/tcpd in.tftpd /home/tftp

    ```


    You can now copy the /images/vmlinux to /home/tftp and create a symbolic link
    so the PROM can get the proper file. This symbolic link is conditional based on
    the IP address and architecture of the target SPARC. You need to make the link
    the hex value of your IP address "dot" the architecture. For example, to create
    a symbolic link for flanders.redhat.com, a sun4m machine with IP address 199.183.24.232.
    you would enter the command:


    ```

    cd /home/tftp

    ln -s vmlinux C7B718E8.SUN4M

    ```


    At this point you should be able to go to the PROM on your SPARC and type:


    ```

    boot net fsroot=nfs.server.IP.address:/path/to/RH/image

    ```


    and it should get its rar request from the TFTP server fulfilled and start loading
    the kernel via TFTP. The kernel should then boot and start the install.


    After booting the installation disk you will be greeted by a welcome screen with
    a single button; Enter to begin the installation.


    Now, choose the medium you will be installing from; NFS, Hard Disk or FTP. Installing
    from hard disk will work if you have an existing partition with an EXT2 filesystem
    only; installation from UFS is not yet implemented.


    ## 4.4 Network Installation


    You can also do an FTP install by TFTPing an entire install image (kernel and
    root filesystem). You will want to do the same as the above example, except for
    the nfsroot and the kernel link. Instead of using /images/vmlinux, use tftpboot.
    Put it in /home/tftpq and make the symlink:


    ```

    cd /home/tftpq

    ln -s tftpboot.img C7B71E8.SUN4M

    ```


    Please remember to change the IP address and architecture based on your own network
    numbers and machine architecture.


    Now all you need to do is a boot net from the SPARC, and it should TFTP everything
    over, boot a kernel, and start the install program. You can then do an FTP install
    from a server near you, or you can do an NFS, hard drive, or CD-ROM install if
    you choose.


    ## 4.5 Installation Using a Serial Terminal


    You can also install Red Hat Linux/SPARC 4.1 using a serial terminal; any terminal
    which emulates a VT100 ought to work fine. Boot from the floppy, and at the SILO
    prompt enter:


    ```

    linux serial

    ```


    The installation program runs on the first serial port at 9600,8,N,1 (9600 baud,
    8 bits. No parity. 1 stop bit). The installation program can run in color, if
    your serial terminal supports color.


    At any prompt dialog during a serial installation (any dialog with an OK button),
    you can press Ctrl-Z to start a subshell; to return to the installation program,
    enter exit at the shell prompt.


    **Important!** After installing using a serial terminal, the only way to log into
    your Red Hat Linux system is the network; however, the /etc/security file keeps
    the root user from logging in from the network. When the serial install is completed,
    but before you reboot your machine, press Ctrl-Z to start a subshell and enter
    the following command:


    ```

    rm /mnt/etc/security

    ```


    If you perform this step, you will not be able to log into your machine.


    ## CHAPTER 4. INSTALLING RED HAT LINUX/SPARC


    ## 4.6 Installation: Selecting System Components


    (For an explanation of system components, please see Chapter 2. Section 2.4.11.)


    **Important!** When selecting system components to install for Red Hat Linux/SPARC,
    choosing to install **Everything** without choosing **Select individual packages**
    could result in an unbootable Red Hat Linux system. The last kernel to be installed
    will be a multi-processor kernel, which will fail to work on sun4 machines. Additionally,
    the default X server will end up as XSunMono, which may not work for most people.
    If you do wish to install **Everything, choose Select individual packages** as
    well. Then, deselect all the kernels except for one you wish to install (kernel-sparc
    works for most) and all X servers except the one for your hardware (XSunMono for
    bwtwo video cards. Xsun for all 8-bit displays, and Xsun24 for the supported 24-bit
    displays).


    ## 4.7 SILO Configuration


    SILO configuration is nearly identical to LILO configuration. see section 2.4.18
    for details.


    ## 4.8 Partitioning


    There is one additional step in partitioning a hard drive for a SPARC. You must
    create the third partition of every disk as type Whole Disk spanning cylinder
    0 to the end of the disk. It shouldn''t be touched, but should exist. You can
    create other partitions just as you normally would.


    ## 4.9 X Windows


    There is no mouse or X windows config on the SPARC. The 8 bit server is installed
    by default. If you want to use the 24 bit server (for TCX cards), you need to
    install the Xsun24. If you have hardware-buffer, install the XSunMono.


    ## 4.9. WINDOWS


    Installing both of the above requires you to restart.


