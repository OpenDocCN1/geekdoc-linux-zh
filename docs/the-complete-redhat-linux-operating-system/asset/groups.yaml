    # D.7. RUNNING THE FLASH MANAGEMENT UTILITY


    help - Print this help text

    FMU}


    Note that the environment and beboot commands are only available on the EB66+,
    the AlphaPC64 and the EB164 systems (and their clones).


    # D.7.2 The “list” command


    The “list” command shows the current usage of the flash memory. Where there is
    more than one flash block, the usage of each flash block is shown. In the example
    below you can see that Windows NT ARC is using blocks 4:7 and 15.


    ```

    FMU> list

    Flash blocks: 0:DBM 1:DBM 2:DBM 3:WNT 4:WNT 5:WNT 6:WNT 7:WNT 8:MILO

    9:MILO 10:MILO 11:MILO 12:MILO 13:U 14:U 15:WNT

    Listing flash Images

    Flash image starting at block 0:

    Firmware Id: 0 (Alpha Evaluation Board Debug Monitor)

    Image size is 191248 bytes (3 blocks)

    Executing at 0x300000

    Flash image starting at block 3:

    Firmware Id: 1 (Windows NT ARC)

    Image size is 277664 bytes (5 blocks)

    Executing at 0x300000

    Flash image starting at block 8:

    Firmware Id: 7 (Milo/Linux)

    Image size is 217896 bytes (4 blocks)

    Executing at 0x200000

    FMU>

    ```


    # D.7.3 The “program” command


    The flash management utility contains a compressed copy of a flash image of Milo.
    The “program” command allows you to blow this image into flash. The command allows
    you to back out, but before you run it you should use the “list” command to see
    where to put Milo. If Milo is already in flash, then the flash management utility
    will offer to overwrite it.'
  - '[PAGE 195]


    # 182 APPENDIX D. ALPHA MINILOADER HOWTO


    FMU program

    Image is:

    Firmware Id: 7 (Milo/Linux)

    Image size is 217896 bytes (4 blocks)

    Executing at 0x200000

    Found existing image at block 8

    Overwrite existing image? (N/y)? y

    Do you want to do this (y/N)? y

    Deleting blocks ready to program: 8 9 10 11

    Programming image into flash

    Scanning Flash blocks for usage

    FMU>


    Wait until it has completed before powering off your system.

    Note: I cannot emphasise how careful you must be here not to overwrite an existing
    flash image that you might need or render your system useless. A very good rule
    is never to overwrite the Debug Monitor.


    # D.7.4 The "environment" command


    This selects a block to contain Milo''s environment variables.


    # D.7.5 The "bootopt" command


    This is just the same as Milo’s “bootopt” command. see (Section D.6.4 The “bootopt”
    command).


    # D.7.6 The "quit" command


    This is really pretty meaningless. The only way back to Milo (or anything else)
    once the flash management utility has run is is to reboot the system.


    # D.8 Restrictions


    Unfortunately this is not a perfect world and there, as always, some restrictions
    that you should be aware of.'
  - '[PAGE 196]


    # D.9. PROBLEM SOLVING


    Milo is not meant to load operating systems other than Linux, although it can
    load images linked to run at the same place in memory as Linux (which is 0xFFFFFC000310000).
    This is how the flash management utilities can be.


    The PALcode sources included in miniboot/palcode/blah are correct, however there
    are problems when they are built using the latest gas. They do build if you use
    the ancient aout gas that was supplied in the Alpha Evaluation Board toolset (and
    that''s how they were built). I''m trying to fix the new gas. Meanwhile, as a
    workaround, I have provided pre-built PALcode for the supported boards and David
    Mosberger-Tang has a fixed gas on his ftp site.


    # D.9 Problem Solving


    Here are some common problems that people have seen, together with the solutions.


    Reading MS-DOS floppies from the Evaluation Board Debug Monitor. Several people
    reported having problems reading files from the floppy disk using the Evaluation
    Board Debug Monitor supplied with Digital Alpha Evaluation Boards such as the
    AlphaPC64. Usually, the Debug Monitor can load the first sectors all right, but
    then goes into an endless loop complaining about “bad sectors.” Apparently, there
    is an incompatibility between the DOS file system as expected by the Debug Monitor
    and the Linux implementation of DOSFS. To make the long story short: if you run
    into this problem, using DOS to write the floppy disk. For example, if loading
    the file milo.cab doesn''t work, use a DOS machine, insert the floppy and then:


    ```

    copy a:milo.cab c:

    copy c:milo.cab a:

    del c:milo.cab

    ```


    Then booting from that floppy again. This normally solves the problem.


    Milo displays a long sequence of 0 and does not accept input. This usually happens
    when Milo was built to use as a secondary console device. In such a case, Milo
    echo output to COM1 and accepts input from there also. This is great for debugging
    but not so great if you have a device'
  - '[PAGE 197]


    other than a terminal connected. If this happens, disconnect the device or power
    it down until the Linux kernel has booted. Once Linux is up and running, everything
    will work as expected.


    # D.10 Acknowledgements


    I would like to thank:


    +   - Eric Rasmussen and Eileen Samberg the authors of the PALcode.

    - Jim Paradis for the keyboard driver and the original MILO interface.

    - Jay Estabrook for his help and bugfixes,

    - David Mosberger-Tang for the freeware BIOS emulation and his support and encouragement,

    - Last (and not least) Linus Torvalds for the timer code and his kernel.


    There are a number of things that still need doing to Milo. if you want to add
    something yourself, then do let me know. david.rusling@reo.mts.dec.com so that
    we do not duplicate our efforts.


    Finally, a big thank you to Digital for producing such a wonderful chip (and paying
    me to do this).'
