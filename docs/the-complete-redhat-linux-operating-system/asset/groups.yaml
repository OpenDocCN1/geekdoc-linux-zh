  mdcn: "\n\n# 第 7 章：使用 RPM 进行软件包管理\n\n由于升级实际上是卸载和安装的结合，你可能会遇到这些模式中的任何错误，此外还有一种：如果\
    \ RPM 认为你正尝试升级一个版本号较旧的软件包，你会看到：\n\n```bash\n $ rpm -Uvh foo-1.0-1.i386.rpm\nfoo\
    \ package-2.0-1 (which is newer) is already installed\nerror: foo-1.0-1.i386.rpm\
    \ cannot be installed\n```\n\n要强制让 RPM 无论如何进行“升级”，请在命令行中使用 `--oldpackage`。\n\n\
    ## 7.2.4 查询\n\n对已安装软件包数据库进行查询通过 `rpm -q` 完成。一个简单的用法是 `rpm -q foo`，它将打印已安装软件包 foo\
    \ 的包名、版本和发布版本：\n\n```bash\n $ rpm -q foo\nrpm-2.0-1\n```\n\n与其指定包名，你可以使用以下选项配合\
    \ `-q` 选项来指定你想要查询的软件包。这些被称为**软件包规范选项**。\n\n- -a 查询所有当前已安装的软件包。\n- -f <file> 将查询拥有\
    \ `<file>` 的软件包。\n- -F 与 -f 相同，但它通过标准输入接收文件名（例如：`find /usr/bin | rpm -qF`）。\n\
    - -p <packagefile> 查询软件包 `<packagefile>`。\n- -P 类似于 -p，但它从标准输入接收软件包文件名（例如：`find\
    \ /mnt/cdrom/RedHat/RPMS | rpm -qP`）。\n\n有多种方法可以指定显示关于查询软件包的哪些信息。以下选项用于选择你感兴趣的信息。这些被称为**信息选择选项**。\n\
    \n## 7.2. 使用 RPM\n\n- -i 显示软件包信息，如名称、描述、发布、大小、构建日期、安装日期、供应商和其他杂杂信息。\n- -l 显示该软件包“拥有”的文件列表。\n\
    - -s 显示软件包中所有文件的状态。只有两种可能的状态：正常（normal）和缺失（missing）。\n- -d 显示标记为文档的文件列表（man 页面、info\
    \ 页面、README 等）。\n- -c 显示标记为配置文件的文件列表。这些是你在安装后为了使软件包适应你的系统而更改的文件（sendmail.cf、passwd、inittab\
    \ 等）。\n\n对于那些显示文件列表的选项，你可以在命令行中添加 `-v` 以以熟悉的 `ls -l` 格式获取列表。\n\n## 7.2.5 验证\n\n\
    验证软件包是将从软件包中安装的文件信息与原始软件包的相同信息进行比较。除其他外，验证还会比较每个文件的大小、MD5 校验和、权限、类型、所有者和组。\n\n\
    `rpm -V` 验证软件包。你可以使用查询列表中的任何软件包选择选项来指定你想要验证的软件包。一个简单的用法是 `rpm -V foo`，它会验证 foo\
    \ 包中的所有文件是否与原始安装时一致。例如：\n\n- 验证包含特定文件的软件包：\n`rpm -Vf /bin/vi`\n\n- 验证所有已安装的软件包：\n\
    `rpm -Va`\n\n- 根据 RPM 软件包文件验证已安装的软件包：\n`rpm -Vp foo-1.0-1.i386.rpm`\n\n如果你怀疑 RPM\
    \ 数据库损坏了，这会非常有用。\n\n如果所有验证都正常通过，则没有输出。如果存在任何差异，它们将显示出来。输出的格式是一个 8 个字符的字符串，一个可能的“c”表示配置文件，然后是文件名。8\
    \ 个字符中的每一个都表示将文件的一个属性与 RPM 数据库中记录的该属性值进行比较的结果。单个“”（句号）表示测试通过。以下字符表示某些测试失败：\n\n\
    - MD5 校验和\n- 文件大小\n- 符号链接\n- 文件修改时间\n- 设备\n- 用户\n- 组\n- 模式（包括权限和文件类型）\n\n如果你看到任何输出，请根据你的判断决定应该是卸载或重新安装软件包，还是以某种方式修复问题。\n\
    \n## 7.3 用 RPM 让你的朋友印象深刻\n\nRPM 是管理系统以及诊断和修复问题非常有用的工具。理解所有选项的最佳方法是看一些示例。\n\n-\
    \ 假设你不小心删除了某些文件，但你不确定删除了什么。如果你想验证整个系统并查看可能丢失了什么，你会输入：\n\n```bash\nrpm -Va\n```\n\
    \n如果某些文件丢失或看起来已损坏，你应该重新安装该软件包，或者卸载然后重新安装该软件包。\n\n- 假设你遇到了一个你不认识的文件。要找出哪个软件包拥有它，你会输入：\n\
    \n```bash\nrpm -qf /usr/X11R6/bin/xjewel\n```\n\n输出看起来如下：\n\n`xjewel-1.6-1`\n\n\
    - 可以在以下情景中结合上述两个示例。假设你在 /usr/bin/paste 上遇到了问题。你想验证拥有该程序的软件包，但你不知道是哪一个软件包。只需输入：\n\
    \n```bash\nrpm -Vf /usr/bin/paste\n```\n就会显示相应的软件包。\n\n- 如果你想找出哪个软件包拥有一个程序，你可以输入以下内容：\n\
    \n```bash\nrpm -qf /usr/X11R6/bin/xjewel\n```\n\n输出看起来如下：\n\n`xjewel-1.6-1`\n\n\
    （注：原文后续存在大量重复段落，已按要求去重）如果你想找出哪个软件包拥有一个程序，你可以输入：\n\n```bash\nrpm -qf /usr/X11R6/bin/xjewel\n\
    ```\n\n输出看起来如下：\n\n`xjewel-1.6-1`\n\n"
