    # APPENDIX D. ALPHA MINILOADER HOWTO


    Linux device drivers live within the kernel and expect certain services from the
    kernel. Some of these services are provided directly by Linux kernel code, for
    example the interrupt handling and some is provided by kernel look-alike routines.


    Milo''s most powerful feature is that you can embed unaltered Linux device drivers
    into it. This gives the potential to support every device that Linux does. Milo
    includes all of the block devices that are configured into the Linux kernel that
    it is built against as well as a lot of the block device code (for example, ll_rw_blk()).


    Milo loads the Linux kernel from real file systems rather other strange places.
    It understands MSDOS, EXT2 and ISO9660 filesystems. Gziped files are supported
    and these are recommended. particularly if you are loading from floppy which is
    slower. Milo recognises these by .gz suffix.


    Built Milo is a simple keyboard driver which, together with an equally simple
    video driver allows it to list file systems on configured devices, Boot Linux
    or run flash updates and set environment variables that control the system''s
    booting. Like LILO, you can pass arguments to the Kernel.


    Milo must tell what sort of system this is. how much memory there is and which
    of that memory is free. This does using the HWRPBB (Hardware Restart Parameter
    Block) data structure and associated memory cluster descriptions. These are placed
    at the appropriate place in virtual memory before control is passed to the Linux
    kernel.


