    | 首选 DNS | 10.0.2.1 |

    | 域名 | redhat.com |

    | 主机名 | pooh.redhat.com |


    图 2.4：示例网络


    安装程序尝试根据你的 IP 地址猜测你的子掩码；如果不正确，你可以修改。安装程序会将域名带到主机名字段。在域名之前输入你使用的主机名以形成完全限定域名 (FQDN)。如果你的网络有多个
    DNS，你可以在辅助 DNS 和三级 DNS 字段中输入额外的 DNS IP 地址。


    ![](img/bef0eed6d460726bef2ee16ade180160_31_0.png)


    图 2.5：配置 TCP/IP


    #### NFS 服务器信息


    最后一个特定的 NFS 对话框请求 NFS 服务器的信息（见图 2.7）。输入 NFS 服务器的名称或 IP 地址，以及包含 Red Hat Linux CD
