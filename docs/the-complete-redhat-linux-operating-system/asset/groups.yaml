    ## C.7 系统


    这两个芯片组都为 CPU 提供了内存控制器和 PCI 主机桥。APEC 提供了一个 32 位 PCI 主机桥，ALCOR 提供了一个 64 位 PCI 主机桥（根据
    PCI 规范，它可以同时支持 32 位和 64 位 PCI 设备）。


    APECS 由 6 颗 208 引脚芯片组成（4 个 32 位数据切片 (DECADE)，1 个系统控制器 (COMANCHE)，1 个 PCI 控制器 (EPIC)）。它提供一个
    DRAM 控制器（128 位内存总线）和一个 PCI 接口。它还负责在 PCI 设备对内存进行 DMA 访问（或出）时维护内存一致性的所有工作。


    ALCOR 由 5 颗芯片组成（4 个 64 位数据切片 (Data Switch, DSW) - 208 引脚 PQFP，以及 1 个控制/I/O 地址芯片
    (CIA) - 一个 383 引脚塑料 PGA）。它提供一个 DRAM 控制器（256 位内存总线）和一个 PCI 接口。它还负责支持外部 Bcache 以及在
    PCI 设备对内存进行 DMA 访问（或出）时维护内存一致性的所需工作。


    21066 没有支持芯片组，因为内存控制器和 PCI 主机桥功能已集成在芯片内部。


    ## C.7 系统


    DS 的应用工程小组使用 CPU 和支持芯片组制作了示例设计。这些通常是 PC-AT 尺寸的主板，具备你在高端腾（Pentium）主板上通常能找到的所有功能。最初，这些示例设计旨在作为第三方生产主板设计的起点。这些第一代设计被称为评估板（EBs）。随着构建主板所需的工程量不断增加（由于更高频率的时钟以及需要满足射频
    RF 发射和抗干扰性规定），重点已转向提供适用于批量生产的主板。


    Digital 的系统组生产了数代使用 Alpha 处理器的机器。其中一些系统使用了系统组设计的支持逻辑，另一些则使用 DS 的通用芯片组。在某些情况下，系统结合使用了了两者。


    不同的第三方使用 Alpha 处理器构建系统。其中一些公司从零开始设计系统，另一些则使用 DS 的支持芯片组或克隆/修改 DS 的示例设计，或者直接使用 DS
    测试过的板卡进行组装。


    ## 附录 C. Alpha 系统与处理器简介


    - EB64：过时的设计，使用 21064，内存控制器使用可编程逻辑实现。I/O 通过可编程逻辑提供，用于连接 486 <-> ISA 芯片。板载以太网。SuperI/O（2S,
    1P, FD），以太网和 ISA。由标准 PC 电源运行。


    - EB64+:使用 21064 和 21064A 以及 APE。具有 ISA 和 PCI 扩展（3 个 ISA，2 个 PCI，一对位于共享槽位上）。支持
    36 位 DRAM SIMs。ISA 总线由 Intel Saturn/PCI-ISA 总线生成。板载 SCSI（PCI 上的 NCI 810）以太网（Digital
    21040）。鼠标（PS2 级），SuperI/O（2S, 1P, FD），RTC/NVRAM。启动 ROM 为 EPROM。PC-AT 尺寸。由标准 PC
    电源运行。


    - EB66：使用 21066 和 21066A。I/O 系统与 EB64+ 相同。PC-AT 尺寸。由标准 PC 电源运行。EB66 的原理图是作为营销海报创建的，宣传为“世界上第一个嵌入
    PCI 的微处理器”（对于冷知识爱好者：实际上有两个版本的版本的海报 - 我绘制了第一个版本的电路并写了文案，一些美国人寄送了第二个版本的文案）。


    - EB164：使用 21164 以及 ISA 和 PCI 扩展（3 个 ISA 槽，64 位 PCI 槽（一个与 ISA 槽共享）以及 2 个 32 位
    PCI 槽）。使用插卡 Beach SIMMs。I/O 系统提供 SuperI/O（2S, 1P, FD），键盘，鼠标（PS2 式）。RTC/NVRAM。启动
    ROM 为 Flash。PC-AT 尺寸主板。需要带有 3.3V 输出的电源。


    - AlphaPC64（又名 Cabriolet）：衍生自 EB64+，但现在采用 baby-AT Flash 启动，无板 SCSI 或以太网。3 个 ISA
    槽。4 个 PCI 槽（一对位于共享槽位上）。使用插卡 Beach SIMMs。需要带有 3.3V 输出的电源。


    - AXPci33（又名 NoName）基于 EB66。该设计由 Digital 的技术 OEM (TOEM)小组生产。它使用运行在 166MHz 或 233MHz
    的 21066 处理器。它是 baby-AT 尺寸，由标准 PC 电源运行。它有 5 个 ISA 槽和 3 个 PCI 槽（一对为共享槽）。有两个版本，键盘使用
    PS/2 或大型 DIN 连接器。


    其他基于 21066 的主板：大多数甚至所有基于 21066 的主板都是基于 21066。


    ## C.8 字节与其他内容


    当 Alpha 架构引入时，它在 RISC 架构中是独一的，因为它避免了 8 位和 16 位的加载和存储。它支持 32 位和 64 位的加载和存储（Digital
    的术语称为 longword 和 quadword）。


    缺少字节加载和存储影响了某些软件信号量，并影响了 I/O 系统的设计。Digital 解决 I/O 问题的方案是使用低位地址线来指定 I/O 传输期间的数据，并解码为字节。这种所谓的稀疏寻址浪费了地址空间，并导致
    I/O 空间不连续（等我写的时候再详细说明细节）。注意，在此背景下 I/O 空间是指 PCI 上的所有系统资源，因此包括 PCI 内存空间和 PCI I/O
    空间。


    联合架构（Dick Sites, Rich Witek）通过引用优点证明了这一决定：

    - 缓存和内存系统的字节支持往往减慢 32 位和 64 位数量的访问。

    - 字节支持使得在缓存/内存系统中构建高速纠错电路变得困难。


    Alpha 通过提供操作64 位寄存器内部字节和组的强大指令进行补偿。字符串操作的标准测试（例如某些字节测试）显示 Alpha 在处理字节方面表现非常好。


    随着 21164A 的引入，Alpha 架构通过 ECO 包含了字节寻址。在早期的 CPU 上执行这些新指令会导致 OPDEC PALcode 异常，从而由
    PALcode 处理访问。这将产生性能影响。由此产生的影响是（在我看来）这些新指令的使用应限制在设备驱动程序而不是应用程序代码中。


    新的字节加载和存储意味着未来的支持芯片组将能够支持连续 I/O 空间。


    ## C.9 PALcode 以及所有这些内容


    这是一个用于解释 PALcode 的章节占位符。如果有足够的兴趣，我会来写它。


    '
