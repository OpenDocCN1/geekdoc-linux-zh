    ## 第 6 章


    ## 查找文档


    Red Linux 包含了数千页在线文档，帮助你学习如何使用该系统。包含的 man 页面（手册页）、info 文档和纯文本文件提供了关于 Linux几乎每个方面的信息。为了提供更多帮助，Red
    Hat 还以电子形式包含了由 Linux 文档项目产生的所有文档。


    ## 6.1 在线帮助


    当你寻找有关命令和错误消息的通用帮助时，最好的起点就是直接在你的系统中。


    ### 6.1.1 Man 页面


    你系统上的几乎每个命令都有一个相关的“man”页面。当你有疑问或问题时，可以立即获取这些文档。如果你在使用命令 `ls` 时遇到困难，可以输入 `man ls`。这将显示
    `ls` 的 man 页面。man 页面是通过 `less` 程序查看的，因此在 man 页面中 `less` 的所有选项都有效。一些重要的快捷键是：


    - `q` 退出

    - 回车（Enter）逐行向下翻

    - 空格（Space）逐页向下翻

    - b 向上向上翻一页

    - `/` 后跟一个字符串并按回车搜索字符串

    - `n` 查找上一次搜索的下一次出现位置


    有时在命令行查看 man 页面并不友好。只要你有一个工作正常的打印机，你也可以打印 man 页面。如果你没有 postscript 打印能力而只想打印 ASCII，可以使用以下命令打印
    man 页面：


    ```

    man COMMAND | 1pr

    ```


    如果你有一个 postscript 打印机，你可能想用这个打印：


    ```

    man -t COMMAND | 1pr

    ```


    在这两个命令中，请将“COMMAND”替换为你尝试获取帮助的命令。


    此外，有时一个项目会有多个 man 页面。以下是所在位置的表格：


    | 章节 | 内容 |

    |---|---|

    | 1 | 用户命令 |

    | 2 | 系统调用 |

    | 3 | 库调用 |

    | 4 | 设备 |

    | 5 | 文件格式 |

    | 6 | 游戏 |

    | 7 | 杂项 |

    | 8 | 系统命令 |

    | 9 | 内内核原理 |


    ## 6.1. 在线帮助


    假设你想查看 `swap` 的 man 页面。你执行了 `man swap`。你实际上得到的是系统调用 `swap()` 的 man 页面，这是你在 C 程序中用于开启交换的函数。除非你正在编写自己的程序来实现它，否则这可能不是你想要的。因此，使用上表，你可以看到你可能需要的可能是“系统命令”，它位于第
    8 节。你可以执行 `man 8 swap`。这一切都是因为 `man` 按顺序搜索 man 目录，并在找到第一个匹配项时返回。


    你也可以在 man 页面中搜索字符串。你使用 `man -k string.to_search.for` 来这样做。然而，除非已创建 `makewhat`
    数据库，否则不起不起。在 Red Hat Linux 下，这是通过夜间的定时任务（cron job）完成的。如果你没有让系统运行过夜，数据库就不会创建。如果是那样，只需运行：


    ```

    /etc/cron.weekly/makewhat.cron

    ```


    注意：这必须以 root 身份执行。


    一旦完成上述操作，你可以输入 `man -k swap`。该命令将返回：


    - man -k swap

    swap, swapoff (2) - 开始/停止文件/设备的交换

    swap, swapoff (8) - 启用/禁用分页和交换的设备和文件


    所以你可以看到第 2 节和第 8 节中有引用 `swap`（在此例中为 `swapoff`）的页面。


    ## 6.1.2 软件包文档


    许多软件软件包将 `README` 和其他文档作为源码包的一部分。Red Hat Linux 使用标准位置来安装这些文档，这样你就不安装源码即可查看文档。所有这些文档存储在
    `/usr/doc` 的子目录下。子目录取决于软件包。每个带有额外文档的软件包都会创建一个名为 `packagenameversion-releasenumber`
    的目录。例如，`tin` 软件包的版本可能是 1.22，发布版本号为 2。其文档路径将为 `/usr/doc/tin-1.22-2`。


    大部分情况下，此目录中的文档是 ASCII 格式。你通常可以使用 `more filename` 或 `less filename` 查看它们。这很不错，但如果你想查看某个特定命令和文件是否有文档，而又不知道它来自哪个包呢？这没关系！你只需要输入：


    ```

    rpm -qdf /etc/sendmail.cf

    ```


    这将报告所有包含 `/etc/sendmail.cf` 文件的软件包的文档。此类命令在 `RPM-HOWTO` 中有更深入的介绍，可以从 www.redhat.com
    获取。


    此外，如果你需要某个命令的帮助，但 man 页面并不好用？你可以执行如下操作：


    ```

    rpm -qdf ''COMMAND''

    ```


    再次，“COMMAND”是你实际需要帮助的命令。这仅在该命令位于你的路径中时才有效。


    ## 6.1.3 HOWTO 和 FAQ


    Linux 文档项目 (LDP) 的大部分内容可以在你系统的 `/usr/doc/HOWTO` 中。


    `/usr/doc/HOWTO` 包含了我们刻录 CD 盘时所有可用 HOWTO 的 ASCII 版本。它们是 gzipped 压缩的，所以你必须使用 `gunzip`
    来解压它们，或者使用类似下面的命令：


    ```

    zcat HAM-HOWTO.gz | more

    ```


    后者可行，但比解压后再使用 `more` 稍微不灵活。不过，除非在完成后对文档进行重新 gzip，否则解压也需要更多的磁盘空间。


    `/usr/doc/HOWTO/mini` 包含了所有可用 miniTOs 的 ASCII 版本。它们没有压缩，可以使用 `more` 或 `less` 查看。


    ## 6.1. 在线帮助


    `/usr/doc/HTML` 包含了所有 HOWTO 以及 Linux 安装和入门指南的 HTML 版本。要查看此处的内容，只需使用像 Red Hat 软件提供的
    Red Baron 或 arena 这样的 WWW 浏览器即可。

    你可以执行如下操作：


    ```

    cd /usr/doc/HTML

    rena index.html

    ```


    `/usr/doc/FAQ` 包含了一些常用 FAQ 的 ASCII 版本（以及一些 HTML 版本），包括 RedHat-FAQ。它们都可以通过 `more`
    或 `less` 查看。


    ## 6.1.4 “locate” 命令


    当你不知道命令或文件的全名但需要找到它时，你通常可以使用 `locate` 找到它。`locate` 使用数据库来查找系统上的所有文件。通常，该数据库每晚通过
    cron 任务构建。然而，如果你的机器没有一直启动运行 Linux，则不会发生这种情况。所以，如果是那样，你可能偶尔需要运行以下命令：


    ```

