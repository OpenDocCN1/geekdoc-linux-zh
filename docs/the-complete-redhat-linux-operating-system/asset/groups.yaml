    ## 200 APPENDIX F. RED HAT AND FREELY DISTRIBUTABLE SOFTWARE.


    universities, commercial enterprises, and hackers, to develop and use Red Hat
    Linux and related technologies co-operatively without fear that their work would
    be controlled and restricted by a commercial vendor.


    In short, the GPL changes the model of software development and distribution to
    one much like the model our Legal system and its industry uses. If a lawyer designs
    an argument that wins his case in front of the supreme court his reward is not
    only the fees his client pays but also the additional clients that his achievement
    attracts to his practice. The “argument” he used becomes available for any other
    lawyer to use without restriction, and in fact becomes part of our collective
    legal heritage.


    This model is already a new industry with companies like Cygnus Support (see http://www.cygnus.com)
    becoming multi-million dollar enterprises on the basis of providing support and
    services for large commercial users of GPL''d and other “freely distributable”
    software. Red Hat Software Inc.’s rapid growth is based, similarly, on our development
    and support of the Red Hat Linux distribution, a product that we distribute worldwide
    on CD and over the Internet under the client terms of the GPL.


    ### F.2 The Evolution of “Free Software"


    The Unix operating system was also developed on a cooperative basis by AT&T with
    the active support of many universities and research establishments. Many of the
    early Unix contributors were disappointed when AT&T began in the late 1970’s and
    1980’s to enforce their copyright terms over the use and distribution of Unix.
    This eventually resulted in the long and bitter legal battle between AT&T (and
    subsequently Novell who won the Unix copyrights from AT&T in 1991) and the University
    of California at Berkeley.


    In a response to this problem of individual control the Massachusetts Institute
    of Technology (MIT) in Cambridge, MA has, since 1984, supported Richard Stallman’s
    efforts to launch a movement in the software development community to support
    the establishment of The Free Software Foundation (the FSF), and its GNU project.
    The name GNU follows in an early Unix tradition of using acronyms as program names,
    and stands for GNU’s Unix. The FSF continues to be head-quartered at MIT, and
    has enjoyed amazing success over the last decade with products like GNU C. GNU
    C++, Emacs, and many other products, many of which form substantial and key building
    blocks of the Linux operating system. Richard Stallman insists, with some justification,
    that Linux should correctly be known as a GNU system.


    There are many other “free software” licenses that some of the code in Red Hat
    Linux has been licensed under. The most popular of these are the University of
    California at Berkeley BSD License whereby the copyright holder remains the registered
    owner but no restrictions on further distribution are imposed on the user of the
    code.


    Also coming from MIT, but not related to the FSF or the GPL, is the X Consortium,
    which is a Unix industry sponsored effort to build and maintain the X Window System.
    In turn, a group called the XFree8 Project has taken on the responsibility to
    port the X Window System to the Intel platform. We have included copies of each
    of these licenses in the appendix for your convenience. Linux is continuing to
    progress very rapidly because of the contributions of this world wide development
    effort, to you and your company or school are encouraged to contribute.


    ### F.3 The GNU Public License


    Red Hat Software, Inc. has chosen to license its code under the GPL for two reasons.
    One is that this the the easiest thing to do since the Linux kernel is licensed
    this way and our code interacts with other GPL’d code scheme difficult. The other
    is that for the purpose of cooperative development purposes we genuinely feel
    that the GPL is in the most effective license format.


    The purpose of the GPL is much like any standard copyright license, to define
    what you can and cannot use the product. However it differs substantially from
    commercial licenses because instead of restricting your use of the software purpose
    is to guarantee your use of the software.


    It in no way restricts the use of standard commercially licensed software with
    Linux or other GPL’d code. Only the changes that you make to the code that you
    “borrowed” from someone else that was licensed under the GPL must be made available
    to others under the same unrestricted rules defined by the GPL. Any product that
    simply uses or operates on top of Linux can be licensed under any commercial rules
    you chose.


    There are many leading commercial software developers who are active supporting
    their commercial products on Linux for which you must purchase a license, such
    as Motif from the OSF, Empress RDBMS from Empress Software, WordPerfect, and recently
    Appiglich - the Office Suite from Applic Inc. and Red Hat Software. You will find
    a complete copy of the GPL in section G.


    ### F.4 Will Linux Replace Commercial OSes?


    The huge development effort and wide distribution of the Linux OS will ensure
    that it takes its place as a real, viable, and significant alternative to commercially
    restricted operating systems. The open development model, availability of source,
    and lack of license restrictions are "features" of the Linux OS that commercial
    developers simply cannot offer. Software development groups who need this model
    include groups from government affiliated research organizations, to academic
    research and teaching projects, to commercial software developers.


    The recent rapid increase in new applications becoming available for Linux and
    the rapidly growing user base of these technologies are causing even the largest
    computer industry organizations to take Linux seriously. Even Apro (a McGraw-Hill
    Company) in their recent 1996 Survey of the UNIX industry concluded that: "Programmers
    are taking a hard look at the viability of Linux on production platforms that
    Linux costs less than Microsoft and has the added benefits of UNIX, such as great
    performance, inherent power tool sets, and communication capabilities."


    The new distribution and development model that Linux, the FSF''s code, and "freely
    distributable" software represent a new model that we are pleased you are now
    part of.


    ### F.5 Red Hat Software, Inc.''s Role in Linux Development


    The Red Hat Linux distribution is also issued under the GPL. We see our role as
    making the Linux OS easy to install, configure, and maintain. Red Hat Software,
    Inc. provides support for users of the Linux OS, from individuals running a single
    workstation to large organizations running hundreds of networked machines, in
    a variety of programs.


    ### F.6 Further Reading


    There are Internet based listings of both the freely distributable, and commercial
    software available for Linux in documents such as the Linux Journal, the Commercial
    HOWTO, the Linux Software Map, and from many Linux vendors, including Red Hat
    Software''s retail division. Many third party and commercial products can be purchased
    through Red Hat''s web site, including Motif, database development systems, editors,
    and more. Info can be obtained by sending a fax request to (919) 572-6726, and
    the web site is located at http://www.redhat.com.


    You can contact Red Hat directly at: info@redhat.com.


    For more information on Linux please see:


    - * Running Linux, M. Welsh, O''Reilly & Associates, 1995.

    - * Linux: Network Administrators Guide. O''Reilly & Associates. 1995.

    '
