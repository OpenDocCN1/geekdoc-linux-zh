    # 134 CHAPTER 10. SYSTEM ADMINISTRATION


    That looks almost like the login entry, but there''s an extra line specifying
    an extra module, and the modules are specified in a different order.


    First, pam_securetty.so keeps root logins from happening on insecure terminals.
    If you wish to allow them (in which case we recommend that you neither be internet-connected
    or be behind a good firewall), you can simply remove that line.


    Second, pam_nologin.so checks /etc/nologin, as specified above.


    Third, if pam_hosts.auth.so authenticates the user, PAM immediately returns success
    to rlogin without any password checking being done. If pam_hosts.auth.so fails
    to authenticate the user, that failed authentication is ignored.


    Finally (if pam_hosts.auth.so has failed to authenticate the user), normal unix
    password authentication is performed.


    ## 10.4.4 The Default Stanza


    When packages contain applications which use PAM are installed, they automatically
    add stanzas to /etc/pam.conf. Whenever possible, they don''t specify which modules
    to use—they copy whatever has been put in the DEFAULT stanza near the top of /etc/pam.conf.
    By changing that stanza, you can change the default entries used by most applications.
    If you do this, you will need to check /etc/pam.conf after you add new PAM-aware
    applications to make sure that the stanza that was added fits your system.


    ## 10.4.5 Shadow Passwords


    The pam_unix.*.so modules can support shadow passwords. In order to convert your
    system to shadow passwords, use these commands:


    ```

    cd /etc

    pconv5

    chmod 600 passwd shadow-

    ```


    The pam_unix.*.so modules will automatically detect that you are using shadow
    passwords and make all necessary adjustments.


    ## 10.5. THE BOOT PROCESS. INIT, AND SHUTDOWN


    ### 10.4.6 More Information


    This is just an introduction to PAM. More information is included with the system
    in /usr/doc in text, HTML, and PostScript format, including a System Administrators''
    Guide, a Module Writers'' Manual, an Application Developers'' Manual, and the
    PAM standard, DCE-RFC 86.0. In addition, documentation is available from the Red
    Hat web site, at http://www.redhat.com/linux-info/pam/


    ## 10.5 The Boot Process, Init, and Shutdown


    ### 10.5.1 System V Init


    This section is a brief description of the internals of the boot process. It basically
    covers in detail how the machine boots using SysV Init and the differences between
    the original init used in older Linux releases.


    Init is the program that gets run by the kernel at boot time. It is in charge
    of starting all the normal processes that need to run at boot time. These include
    the gettys that allow you to log in. NFS NFS daemons, FTP daemons, and anything
    else you want to run when your machine boots.


    SysV Init is becoming the standard in the Linux world to control the startup of
    software at boot time. This is because it is easier to use and more powerful and
    flexible than the traditional BSD init.


    SysV init also differs from BSD init in that the config files are in a subdirectory
    of /etc instead of residing directly /etc. This directory is called rc.d. In there
    you will find rc.sysinit and the following directories:


    ```

    init.d

    rc0.d

    rc1.d

    rc2.d

    rc3.d

    rc4.d

    rc5.d

    rc6.d

    ```


    init.d contains a bunch of scripts. Basically, you need one script for each service
    you may need to start at boot time or when entering another runlevel. Services
    include things like networking, nfs, sendmail, httpd, etc. Services do not include
    things like setserial that must only be run once and then exited. Things that
    should go in rc.local or rc.serial.


    If you want rc.local, it should be in /etc/rc.d. Most systems include one even
    though it doesn''t do much. You can also include an rc.serial in /etc/rc.d if
    you need to do serial port specific things at boot time.


    The chain of events is as follows:


    - The kernel looks in several places for init and runs the first one it finds

    - init runs /etc/rc.d/rc.sysinit

    - rc.sysinit does a bunch of necessary things and then runs rc.serial (if it exists)

    - init runs all the scripts for the default runlevel.

    - init runs rc.local


    The default runlevel is decided in /etc/inittab. You should have a line close
    to the top like:


    ```

    id:3:initdefault:

    ```


