    ## /lib 目录


    /lib 目录应该只包含执行 /bin 和 /sbin 中二进制文件所需的库。


    ## /sbin 目录


    /sbin 目录用于存放 root 用户使用的可执行文件，且仅限于启动和挂载 /usr 以及执行系统恢复操作所需的可执行文件。FSSTND 规定：


    ## 10.1 文件系统结构


    /sbin 通常包含启动系统所必需的文件，以及 /bin 中的二进制文件。在 /usr 已知挂载（在没有问题的情况下）之后执行的任何程序都应该放在 /usr/sbin
