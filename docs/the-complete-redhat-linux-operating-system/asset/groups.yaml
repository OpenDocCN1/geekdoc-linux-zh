    ## Chapter 9

    ## Glint


    Red Hat provides a graphical tool to aid in package installation and removal.
    It''s called Mint (Graphical Installation Tool) and runs under Windows. It allows
    easy installation, uninstallation, querying, and verification of packages. The
    interface is similar to the one found in many file managers and is simple to use.


    Operations are performed in Mint by selecting the packages to operate on and then
    selecting the operation via buttons. Installing a package places all components
    of that package on your system. Uninstalling one removes all traces except for
    configuration files you have modified. Upgrading a package installs the newly
    available version and uninstalls other versions that were previously installed.
    This allows quick upgrading to the latest releases of packages.


    The query operation lets you examine the details of both installed or available
    package. You can view the description of the package, where and when it was built,
    the files in the package, and other attributes. All are clearly marked as such
    to reduce the time you spend looking for them.


    Using Mint to perform all of these operations is the same as using rpm from the
    command line. However, the graphical nature of Mint makes these operations easier.
    The normal way to handle Mint is to display the available packages and files,
    select the ones you want to operate on, and then press the button that performs
    the operation. For instance, you can install several packages with a few clicks.


    ### 9.1 Starting Mint


    To start Mint, simply run from any terminal. That will bring up a window that
    looks like the one in figure 9.1. Any user can use Mint to query and verify packages,
    but if you need to install, uninstall, or upgrade packages be sure to run Mint
    as root.


    There are two main parts to the Mint interface. The first on the left allows you
    to browse and select the packages installed on your system. The right side contains
    buttons that manipulate the selected packages.


    ![](img/bef0eed6d460726bef2ee16ade180160_)


    ### 9.2 The Package Display


    Each folder icon in Mint represents a group of packages. Each group can contain
    other groups, which allows for flexible locations of packages. Groups are used
    to place packages that perform similar functions in similar locations. For example,
    Red Hat includes many application programs such as editors and spreadsheets. All
    of the text-based ones appear in the "Applications" group. Inside that group,
    there is another grouping for all the editors that are shipped.


    By convention, groups are written in the same way as UNIX paths. The top group
    is written first, and subsequent groups follow with a slash separating the group
    names. This means that the drawing program appears in Applications/Graphics group.


    To view the packages and subgroups within a group, double-click the left mouse
    button on the group’s folder icon. The window then changes to show what the package
    contains. The top line of the package display shows which group you’re currently
    looking in, as well as the groups leading to the current one. To return to the
    previous group you were looking at, double-click the "Back" folder, which is always
    in the upper left corner of the folder (though it often gets scrolled away).


    If you’d like to examine a subgroup in a new window, double-click the middle mouse
    button on its folder. If your mouse has only two buttons, click both. This will
    create a new window with that group in it.


    ### 9.2.1 Context Sensitive Menus


    Pressing the right mouse button on any icon in the package window brings up a
    small context-sensitive menu. The exact items it contains depends on exactly where
    you press it. They all contain options to select or deselect the item, and many
    let you install, uninstall, query, upgrade, or verify the item you clicked on.
    There’s more information on how to do these later.


    To choose an item from a context-sensitive menu, press and hold the right mouse
    button on an icon. While still holding the right button down, move the mouse pointer
    over the item you’d like to select (which will then become highlighted). Release
    the right mouse button to select that item and make the menu disappear.


    ### 9.2.2 Selecting Packages


    To select a single package, click the left mouse button on it. You’ll notice a
    thin border appear around the package’s icon (as shown in figure 9.2) showing
    that it’s currently selected. To unselect it, click the left mouse button on it
    and the border will disappear. The number of packages currently selected is always
    displayed at the bottom of the window. A group''s folder icon displays the number
    of packages inside that group that have been selected, or "All" if all of them
    have been.


    ![](img/bef0eed6d460726bef2ee1ade180160_)


    Figure 9.2: Selecting Packages in Mint


    The context-sensitive menu for a package also allows easy selection and unselection.
    Using the select and unselect options on a package''s icon selects or unselects
    that package, while those options on a group''s folder icon select and unselect
    all of the packages in that group. Using these menus makes selecting groups of
    packages much quicker than selecting each package individually.


    ### 9.2.3 Viewing Available Packages


    To see what packages are available for you to install, choose the "Available"
    pushbutton from any Mint window. After a few moments, a new window, like the one
    shown in figure 9.3, will appear. The differences in the title indicate that this
    window is listing packages you may install. Navigating through these packages
    and selecting them is the same as in the other windows.


    If you get an error message from Mint saying it can''t find RPMs, see the section
    below on Configuration.


    ### 9.3 Configuration


    ![](img/bef0eed6d460726bef2ee1ade180160_)


    The only configuration Mint needs is the path to new RPMs. When you''re using
    the Red Hat CD-ROM, this will probably be /mnt/cdrom/RPMs, which is the default
    path for Mint. If you download RPMs from the Internet or want to install RPMs
    via a NFS mounted CD-ROM, this path will be different for you.


    ![](img/bef0eed6d460726bef2ee1ade180160_)


    To change this path, first sure to close all of the windows listing available
    packages. Then choose the Configuration option from one of the remaining windows.
    This will open a dialog box like the one shown in figure 9.4. Here you can type
    the full path to the RPMs you''d like to look at. Choosing the Save button will
    save this path, making it the default for future Mint sessions. The Default button
    restores the path to the one Mint used when it started.

    '
