    ## 2.2. BEFORE YOU BEGIN


    SysV IPC, IP forwarding, firewalling and accounting, reverse ARP, QIC tape and
    parallel printers, are supported.


    After the installation is complete you may want to rebuild a kernel that includes
    support only for your hardware. See Chapter 5, Section 5.1 for information on
    how to build a customized kernel.


    ## 2.2.3 Disk Partitions


    To install Red Hat Linux, you must have disk space available for it to “live”
    in. This disk space needs to be separate from the disk space used by other operating
    systems you may have installed on your computer (e.g., MS-DOS, OS/2, a different
    version of Linux, or another well-known operating system which we don''t name).
    The way to make disk space available is by dividing into partitions.


    You may wish to install Red Hat Linux on its own hard disk, or even on a computer
    which contains no other operating system. In that case, you can use the Red Hat
    Linux installation system to create the disk partitions you need.


    Alternately, you may wish to install Red Hat Linux on a disk which already contains
    software or data from a different operating system; how to create the disk partitions
    you need depends on what other operating system is present.


    ## Disk Partitions and MS-DOS


    Most MS-DOS systems, as they come from the vendor, have one hard disk which contains
    one large partition. In order to install Red Hat Linux, you need to make that
    partition smaller, and then create a partition for Red Hat Linux in the space
    that’s left. There are two ways to accomplish this:


    **Destructive Repartitioning**: This procedure destroys any data in the disk partition(s)
    you are resizing, you should make a complete, reliable backup of everything you
    wish to keep from the disk you are repartitioning. Then, use the MS-DOS disk partitioning
    utility, called fdisk, to delete the large partition and create a smaller MS-DOS
    partition. Restore your data to the new partition from your backup.


    ## CHAPTER 2. INSTALLING RED HAT LINUX/INTEL


    **Non-Destructive Repartitioning**: This procedure is not supposed to destroy
    data in the disk partition(s) you are resizing; however, we recommend reliable
    backups of data you wish to keep in any case. You can use the fips utility, included
    in the Red Hat Linux CD in the dosutils directory, to resize your MS-DOS partition:
    we highly recommend reading the fips documentation located in the fipsdocs subdirectory,
    before doing so.


    After repartitioning, you can use the Red Hat Linux installation system to create
    partitions for your Red Hat Linux system as described in Step-By-Step Installation.


    ## Disk Partitions and Other Operating Systems


    Information on creating disk partitions to be compatible with other operating
    systems is available in several HOWTOs and Mini-HOWTOs available on the Red Hat
    Linux CD in the doc directory.


    ## How Many Partitions?


    If you wish to install Red Hat Linux on a single partition, you can. However,
    we recommend the following:


    - If you wish to install Red Hat Linux on its own hard disk, or even on a computer
    which contains no other operating system, you can use the Red Hat Linux installation
    system to create the disk partitions you need.

    - Alternatively, if you wish to install Red Hat Linux on a disk which already
    contains software or data from a different operating system; how to create the
    disk partitions you need depends on what other operating system is present.

    - Most MS-DOS systems, as they come from the vendor, have one hard disk which
    contains one large partition. In order to install Red Hat Linux, you need to make
    that partition smaller, and then create a partition for Red Hat Linux in the space
    that’s left.

    - If you wish to install Red Hat Linux on its own hard disk, you may need a swap
    partition for your Red Linux system as described in Step-By-Step Installation.

    - If you wish to install Red Hat Linux on a disk which already contains software
    or data from a different operating system; you may need a swap partition for your
    Red Linux system as described in Step-By-Step Installation.


    ## 2.3. PREPARING TO INSTALL


    Information on creating disk partitions to be compatible with other operating
    systems is available in several HOWTOs and Mini-HOWTOs available on the Red Hat
    Linux CD in the doc directory.


    - **root partition**: This partition contains the operating system and all its
    files.

    - **swap partition**: This partition is used for virtual memory.

    - **home partition**: This partition is used for user data and settings.

    - **src partition**: This partition is used for source code during compilation.

    - **tmp partition**: This partition is used for temporary files.

    - **local partition**: This partition is used for locally installed software.


    ### 2.3.2 A Note About Consoles


    The Red Hat Linux installation system is more than simply the dialog boxes it
    presents. In fact, the installation system presents several different kinds of
    diagnostic messages while running, and it gives you a means to enter commands
    from a shell prompt. It presents the installation dialogs, shell prompt, and messages
    on five virtual consoles which you can switch between using a keystroke. These
    virtual consoles can be very helpful if you encounter a problem while installing
    Red Hat Linux: messages displayed on the install log or system log can help to
    pinpoint the problem. Please see Figure 2.1 for a listing of the virtual consoles,
    the keystrokes to switch to them, and their contents.


    | Console | Keystroke | Contents |

    |---|---|---|

    | 1 | Alt-F1 | installation dialog |

    | 2 | Alt-F2 | shell prompt |

    | 3 | Alt-F3 | install log (messages from installation program) |

    | 4 | Alt-F4 | system log (messages from kernel, etc.) |

    | 5 | Alt-F5 | program output (messages from other programs) |


