    Again, "COMMAND" is the actual command you need help with. This will work only
    when the command is on your path.


    # 6.1.3 HOWTOs and FAQs


    Most of the contents of the Linux Documentation Project (LDP) are available in
    /usr/doc/HOWTO on your system.


    /usr/doc/HOWTO contains the ASCII versions of all the available HOWTOs at the
    time we pressed the CD-ROM. They are gzipped, so you have to use gunzip to unzip
    them or use a command like:


    ```

    zcat HAM-HOWTO.gz | more

    ```


    The latter will work, but is a bit less flexible than unzipping and then using
    more. However, unzipping also requires more disk space unless you re-gzip the
    document when done.


    /usr/doc/HOWTO/mini contains the ASCII versions of all the available miniTOs.
    They are not compressed and can be viewed with more or less.'
