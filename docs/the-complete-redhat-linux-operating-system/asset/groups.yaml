    # E.2.6 How do I get new updates to Red Hat as they happen?


    Keep your eye on:


    http://www.redhat.com/errata

    for new information we''ve made available since the current CD was pressed. Also
    check the contrib directory on our FTP mirrors for packages that users have sent
    us to us. We will also make periodic announcements to redhat-announce-list with
    updates.


    # E.2.7 How do I get support if I bought the Caldera, PHT, etc CD-ROM?


    Please do not ask for support unless you purchase a Red Hat Linux CD-ROM product
    produced by Red Hat Software. Yes, if you have Caldera then you have Red Hat Linux,
    but you bought it from Caldera. If you would like support for Caldera, please
    see their web site: http://www.caldera.com for their support options.


    Also, Pacific Hi-Tech has sold CDs with “Official Red Hat Linux” on them. While
    it is a good CD, it was produced by them and is supported by them. Please don''t
    contact us for help with PHT CDs.


    # E.2.8 What is the relationship between Red Hat and Caldera, PHT, etc?


    All are separate companies. As with any maker of Linux CD-ROMs, Caldera, Pacific
    Hi-Tech, Yggdrasil, and LSL are all free to use Red Hat Linux as the basis for
    their products. This does, however, make those vendors solely responsible for
    supporting their product if they want it supported. We cannot support other vendors
    products directly, though users of Red Hat from other vendors are welcomed to
    participate in our mailing lists and make complete use of our WWW site and FTP
    site.


    # E.2.9 What do I do if I have media (manual or CD-ROM) problems?


    If you are experiencing problems with the product you received (eg your manual
    is missing pages or your CD-ROM is scratched), please contact the Red Hat Software
    at sales@redhat.com or by phone using the above contact information. The problem
    will be rectified promptly. Please do not report these problems on the redhat-list
    or to support as they are likely isolated and your product will simply need to
    be replaced.


    (No, this is not a common problem, but it does happen from time to time.)


    # E.2.10 What''s the quickest and best way to get support for Red Hat Linux?


    You can search for answers to your questions first via http://www.redhat.com.
    This has a search engine to search all the Red Hat mailing lists. If you don''t
    find what you need, you can join the Red Hat mailing lists and then send mail
    to redhat-list@redhat.com with your questions.


    To subscribe to the list, send mail to redhat-list-request@redhat.com with the
    subject line reading:


    subscribe


    Due to relatively high traffic on that list, we also have the redhat-announce-list.
    It is used only for announcements of major concern to the Red Hat community and
    is low traffic. Everyone using Red Hat Linux should be subscribed to that list.
    To subscribe to the list, send mail to redhat-announce-list-request@redhat.com
    with the subject line reading:


    subscribe


    # E.2.11 How do I report a problem?


    Send mail to bugs@redhat.com or report the bug to redhat-list. Again, if you didn''t
    buy Red Hat Linux from us, please see the previous question, “How do I get support...”.


    When reporting problems, please be as detailed as possible. For example, if you
    can''t get Red Hat to see your SCSI drives, tell us:


    - What version of Red Hat

    - What kind of SCSI card

    - what kernel

    - how many IDE drives do you have

    - specific details of the problem


    If you can''t get your CD-ROM recognized, tell us:


    - What version of Red Hat

    - make and model of CD-ROM

    - type of interface (IDE, SB, etc)

    - bootdisk

    - hardware configuration


    Again, be as detailed as possible about your problem!


    # E.2.12 What versions of Red Hat Linux are there?


    There have been several now. Here''s a rundown:


    - Preview (or Beta) - Summer ''94

    - Halloween - Fall ''94

    - 1.0 - Summer ''95

    - 1.1 - Late Summer ''95

    - 2.0 Beta - Late Summer ''95

    - 2.0 - Early Fall ''95

    - 2.1 - Late Fall ''95

    - Alpha 2.1-Beta - Late Fall ''95

    - Alpha 2.1 - January ''96

    - Intel 3.0.3 - March ''96

    - Rembrandt (BETA) - August ''96

    - Intel 4.0 - October ''96

    - Alpha 4.0 - October ''96

    - SPARC 4.0 - October ''96

    - Intel 4.1 - January ''97

    - Alpha 4.1 - January ''97

    - SPARC 4.1 - January ''97


    # E.2.13 What hardware does Red Hat support?


    For a current list of supported hardware, please see:


    http://www.redhat.com/hardware


    Look under the Red Hat support section.


    For a better list of video cards, you should see:


    http://www.xfree86.org


    # E.2.14 Why won''t my Adaptec (274x, 284x) work?


    The Adaptec 274x and 284x are supported but may need to be reconfigured to work
    properly. It has been reported that the wide negotiation on these cards is not
    quite working, so it should be disabled.


    # E.2.15 What applications are there for Red Hat Linux?


    There are many applications for Linux available. Please see http://www.redhat.com
    and go to the “Linux Applications and Utilities” section. This section is maintained
    by a private individual that is not related to Red Hat in any way. You will find
    information on nearly every product available for Linux on his pages.


    # E.2.16 Does Red Hat Linux include source code?


    Yes. We include the exact source that was used to build the distribution. From
    release 2.0, Red Hat Linux is built on a packaging system called RPM that ONLY
    uses pristine source (the same as what you''d find at the author’s FTP site) and
    possibly a Red Hat patch. Complete information on RPM is available on http://www.redhat.com.


    # E.2.17 What version of X Windows is included with Red Hat?


    Red Hat Linux 4.1 ships with XFree86 3.2, and comes standard with a very nice
    configuration tool.


    # E.2.18 Does Red Hat support UMSDOS installs?


    In a word, no. It is not a good performance idea. Aside from that, you’t “need”
    MS-DOS on your machine anyway :-)


    # E.3 Installation Questions


    # E.3.1 Do I need swap space?


    Yes! If you have 8M of RAM, you must enable at least 8M of swap during the installation
    of Red Hat. If you have more RAM, you should still enable swap, though it isn''t
    mandatory.


    # E.3.2 How do I get my IDE CD-ROM on my SB16 to work?


    The Creative Labs kit comes with the IDE Interface set to the third IDE port by
    default (IDE2, I think). This won''t work under Linux as it only recognizes two
    IDE ports. What you need to do is move a jumper on the card to configure for IDE1
    (the secondary IDE port). I''m not sure if you have to make changes under DOS
    for this configuration to work, but your manuals should help with this (it will
    still work, but you may have to edit a file or two).


    You may also have to specify command line parameters like:


    ```

    boot: linux hdN=cdrom

    ```


    If you have one IDE drive, N is most likely "b" in this case (ie "linux hdb=cdrom").
    If you have two, then it will be "c".


    # E.3.3 How do I do a network install of Red Hat Linux 4.1?


    Get the RedHat-HOWTO from the docs directory of any Red Hat Mirror. It will tell
    you all you need to know.


    # E.3.4 How do I run the install program again?


    Reboot your machine using the disk that you used for the installation. You will
    most likely need to completely reinstall your system.

    '
