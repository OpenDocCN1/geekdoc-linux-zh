  - '[PAGE 166]


    # C.4. 21064 PERFORMANCE VS 21066 PERFORMANCE


    # C.4 21064 performance vs 21066 performance


    The 21064 and the 21066 have the same (EV4) CPU core. If the same program is run
    on a 21064 and a 21066, at the same CPU speed, then the difference in performance
    comes only as a result of system Bcache/memory bandwidth. Any code thread that
    has a high hit-rate on the internal caches will perform the same. There are 2
    big performance killers:


    +   1. Code that is write-intensive. Even though the 21064 and the 21066 have
    write buffers to swallow some of the delays, code that is writeintensive will
    be throttled by write bandwidth to the system bus. This arises because the on-chip
    caches are write-through.


    +   2. Code that wants to treat floats as integers. The Alpha architecture does
    not allow register-register transfers from integer registers to floating point
    registers. Such a conversion has to be done via memory (And therefore, because
    the on-chip caches are write-through, via the Bache). (Editor’s note: it seems
    that both the EV4 and EV45 can perform the conversion through the primary data
    cache (Dcache), provided that the memory is cached already. In such a case, the
    store in the conversion sequence will update the Dcache and the subsequent load
    is, under certain circumstances, able to read the updated d-cache value, thus
    seems best to execute the stq/ldq or stb/ldq instructions back-to-back, which
    is somewhat counter-intuitive.)


    If you make the same comparison between a 21064A and a 21066A, there is an additional
    factor due to the different Icache and Dcache sizes between the two chips.


    Now, the 21164 solves both these problems: it achieve much higher system bus bandwidths
    (despite having the same number of signal pins - yes. I know it’s about twice
    as many pins as a 21064, but all those extra ones are power and ground! (yes,
    really!!)) and it has write-back caches. The only remaining problem is the answer
    to the question “how much does it cost?”'
  - '[PAGE 167]


    # APPENDIX C. INTRO TO ALPHA SYSTEMS AND PROCESSORS


    # C.5 A Few Notes On Clocking


    All of the current Alpha CPUs use high-speed clocks, because their microarchitectures
    have been designed as so-called short-tick designs. None of the system busses
    have have to run at horrendous speeds as a result though:


    +   - on the 21066(A), 21064(A), 21164 the off-chip cache (Bcache) timing is completely
    programmable, to the resolution of the CPU clock. for example, on a 275MHz CPU,
    the Bcache read access time can be controller with a resolution of 3.6ns


    +   - on the 21066(A), the DRAM timing is completely programmable, to the resolution
    of the CPU clock (not the PCI clock, the CPU clock).


    +   - on the 21064(A), 21164(A), the system bus frequency is a sub-multiple of
    the CPU clock frequency. Most of the 21064 motherboards use a 33MHz system bus
    clock.


    +   - Systems that use the 21066 can run the PCI at any frequency relative to
    the CPU. Generally, the PCI runs at 33MHz.


    +   - Systems that use the APECS chipset (see Section C.6) always have their CPU
    system bus equal to their PCI bus frequency. This means that busses tends to run
    at either 25MHz or 33MHz (since these are the frequencies that scale up to match
    the ‘CPU’ frequencies). On APECS systems, the DRAM controller timings are software
    programable in terms of the CPU system bus frequency


    Aside: someone suggested that they were getting bad performance on a 21066 because
    the 21066 memory controller was only running at 33MHz. Actually, it’s the superfast
    21064A systems that have memory controllers that ''only’ run at 33MHz.


    # C.6 The chip-sets


    DS sells two CPU support chipsets. The 2107x chipset (aka APECS) is a 21064(A)
    support chiset. The 2117x chipset (aka ALCOR) is a 21164 support chipset. There
    will also be 2117xA chipset (aka ALCOR) as a 21164A support chipset.'
- md: '

    ## C.7. THE SYSTEMS


    Both chipsets provide memory controllers and PCI host bridges for CPU. APEC provides
    a 32-bit PCI host bridge, ALCOR provides a 64-bit PCI host bridge which (in accordance
    with the requirements of the PCI spec) can support both 32-bit and 64-bit PCI
    devices.


    APECS consists of 6 208-pin chips (4, 32-bit data slices (DECADE), 1 system controller
    (COMANCHE), 1 PCI controller (EPIC)). It provides a DRAM controller (128-bit memory
    bus) and a PCI interface. It also does all the work to maintain memory coherence
    when a PCI device DMAs (or out of) memory.


    ALCOR consists of 5 chips (4, 64-bit data slices (Data Switch, DSW) - 208-pin
    PQFP and 1 control, I/O Address, CIA) - a 383 pin plastic PGA. It provides a DRAM
    controller (256-bit memory bus) and a PCI interface. It also does all the work
    required to support an external Bcache and maintain memory coherence when a PCI
    device DMAs (or out of) memory.


    There is no support chipset for the 21066, since the memory controller and PCI
    host bridge functionality are integrated into the chip.


    ## C.7 The Systems


    The applications engineering group in DS produces example designs using the CPUs
    and support chipsets. These are typically PC-AT size motherboards, with all the
    functionality that you''d typically find on a high-end Pentium motherboard. Originally,
    these example designs were intended to be used as starting points for third-parties
    to produce motherboard designs from them. These first-generation designs were
    called Evaluation Boards (EBs). As the amount of engineering required to build
    a motherboard has increased (due to higher-speed clocks and the need to meet RF
    emission and susceptibility regulations) the emphasis has shifted towards providing
    motherboards that are suitable for volume manufacture.


    Digital''s system groups have produced several generations of machines using Alpha
    processors. Some of these systems use support logic that is designed by the systems
    groups, and some use commodity chipsets from DS. In some cases, systems use a
    combination of both.


    Various third-parties build systems using Alpha processors. Some of these companies
    design systems from scratch, and others use DS support chipsets or clone/modify
    DS example designs or simply package systems using build tested boards from DS.


    ## APPENDIX C. INTRO TO ALPHA SYSTEMS AND PROCESSORS


    - The EB64: Obsolete design using 21064 with memory controller implemented using
    programmable logic. I/O provided by programmable logic to interface a 486 <->
    ISA chip. On-board Ethernet. SuperI/O (2S, 1P, FD), Ethernet and ISA. Runs from
    standard PC power supply.


    - The EB64+: Uses 21064 and 21064A and APE. Has ISA and PCI expansion (3 ISA,
    2 PCI, one pair on a shared slot). Supports 36-bit DRAM SIMs. ISA bus generated
    by Intel Saturn/PCI-ISA bus. On-board SCSI (NCI 810 on PCI) Ethernet (Digital
    21040). MOUSE (PS2 level), SuperI/O (2S, 1P, FD), RTC/NVRAM. Boot ROM is EPROM.
    PC-AT size. Runs from standard PC power supply.


    - The EB66: Uses 21066 and 21066A. I/O-system is identical to EB64+. PC-AT size.
    Runs from standard PC power supply. The EB66 schematic was created as a marketing
    poster advertising the advertising as "the first microprocessor in the world with
    embedded PCI" (for trivia fans: there are actually 2 versions of this poster -
    I drew the circuits and wrote spiel for the first version, and some Americans
    mailed spiel for the second version)


    - The EB164: Uses 21164 and ISA and PCI expansion (3 ISA lots, 64-bit PCI slots
    (one is shared with an ISA slot) and 2 32-bit PCI slots. Uses plug-in Beach SIMMs.
    I/O-system provides SuperI/O (2S, 1P, FD), KBD, MOUSE (PS2 style). RTC/NVRAM.
    Boot ROM is Flash. PC-AT-sized motherboard. Requires power supply with 3.3V output.


    - The AlphaPC64 (aka Cabriolet): derived from EB64+ but now baby-AT Flash boot,
    no-board SCSI or Ethernet. 3 ISA slots. 4 PCI slots (one pair are on a shared
    slot). uses plug-in Beach SIMMs. Requires power supply with 3.3V output.


    - The AXPci33 (aka NoName) is based on the EB66. This design is produced by Digital''s
    Technical OEM (TOEM) group. It uses the 21066 processor running at 166MHz or 233MHz.
    It is a baby-AT size, and runs from a standard PC power supply. It has 5 ISA slots
    and 3 PCI slots (one pair are a shared slot). There are 2 versions, with either
    PS/2 or large DIN connectors for the keyboard.


    Other 21066-based motherboards: most if not all 21066-based motherboards are based
    on 21066.


    ## C.8. BYTES AND STUFF


    When the Alpha architecture was introduced, it was unique amongst RISC architectures
    for eschewing 8-bit and 16-bit loads and stores. It supported 32-bit and 64-bit
    loads and stores (longword and quadword, in Digital’s nomenclature).


    The absence of byte loads and stores impacts some software semaphores and impacts
    the design of the I/O-systems. Digital’s solution to the I/O problem is to use
    some low-order address lines to specify the data size during I/O transfers, and
    to decode these as bytes. This so-called Sparse Addressing wastes address space
    and has the consequence that I/O space is non-contiguous (more on the intricacies
    of Sparse Addressing when I get around to writing it). Note that I/O space, in
    this context, refers to all system resources present on the PCI and therefore
    includes both PCI memory space and PCI I/O space.


    The co-architects (Dick Sites, Rich Witek) justified this decision by citing the
    advantages:

    - Byte support in the cache and memory-system tends to slow down accesses for
    32-bit and 64-bit quantities.

    - Byte support makes it hard to build high-speed error-correction circuitry into
    the cache/memory-system.


    Alpha compensates by providing powerful instructions for manipulating bytes and
    groups within 64-bit registers. Standard benchmarks for string operations (e.g.,
    some of the Byte benchmarks) show that Alpha performs very well on byte manipulation.


    With the 21164A introduction, the Alpha architecture was ECO’d to include byte
    addressing. Executing these new instructions on an earlier CPU will cause an OPDEC
    PALcode exception, so that the PALcode will handle the access. This will have
    a performance impact. The ramifications of this are use of these new instructions
    (IMO) should be restricted to device drivers rather than applications code.


    These new byte load and stores mean that future support chipsets will be able
    to support contiguous I/O space.


    ## C.9 PALcode and all that stuff


    This is a placeholder for a section explaining PALcode. I will write it if there
    is sufficient interest.

    '
