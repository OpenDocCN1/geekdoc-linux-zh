  \n293\n\n![](img/0393.jpeg)\n\n# 第 10 章 | 控制启动过程\n\n### 重置根密码\n\n### 目标\n\n完成本节后，你应该能够在根密码丢失时登录系统并更改密码。\n\
  \n### 从启动加载程序重置根密码\n\n每个系统管理员都应该能够完成的任务就是重置丢失的根密码。如果管理员仍然登录（无论是具有完全 `sudo` 权限的非特权用户，还是\
  \ `root`），此任务轻而易举。当管理员未登录时，此任务变得复杂一些。\n\n有多种方法可以设置根密码。例如，系统管理员可以使用 Live CD 启动系统，从那里挂载根系统并编辑\
  \ `/etc/shadow`。在本节中，我们将探索一种不需要外部媒介的方法。\n\n**注意**\n\n在 Enterprise Linux 及之前的版本上，管理员可以将系统启动到级别\
  \ 1 以获取 root 提示符。在 Enterprise Linux 8 机器上，级别 1 的对应的是救援和紧急目标，两者都需要根密码才能登录。\n\n在 Enterprise\
  \ Linux 8 上，可以让从 initramfs 运行的脚本在某些点暂停，提供 root shell，并在 shell 退出后继续。这主要用于调试，但你也可以使用此方法重置丢失的根密码。\n\
  \n要访问该 root shell，请遵循以下步骤：\n\n1. 重启系统。\n\n2. 按任意键中断启动倒计时（`Enter`）。\n\n3. 将光标移动到要启动的内核项。\n\
  \n4. 按下 `e` 编辑所选项。\n\n5. 将光标移动到内核命令行（以 `linux` 开头的行）。\n\n6. 添加 `rd.break`。使用该选项，系统会在\
  \ initramfs 将控制权交给实际系统之前中断。\n\n7. 按下 `Ctrl+x` 使用这些更改启动。\n\n此时，系统呈现一个 root shell，实际磁盘上的根文件系统以只读挂载在\
  \ `/sysroot` 上。由于故障排除通常需要修改根文件系统，你需要将根文件系统更改为读写。下面的步骤显示了使用 `mount` 命令的 `remount,rw`\
  \ 选项如何重新挂载文件系统并设置新选项（`rw`）。\n\n\n\n\n预构建的镜像可能会向内核传递多个 `console=` 参数，以支持各种实现场景。这些\
  \ `console=` 参数指示了用于控制台输出的设备。使用 `rd.break` 需要注意的是，尽管系统会将内核消息发送到所有控制台，但提示符最终会使用最后给出的控制台。如果你没有看到提示符，可能需要在从引导加载程序编辑内核命令行时，临时重新调整\
  \ `console=` 参数的顺序。\n\n#### 重要\n\n系统尚未启用 SELinux，因此你创建的任何文件都没有 SELinux 上下文。某些工具（例如\
  \ `passwd` 命令）会先创建一个临时文件，然后将其移动到要编辑的文件的位置，这实际上创建了一个没有 SELinux 上下文的新文件。因此，当你配合 `rd.break`\
  \ 使用 `passwd` 命令时，`/etc/shadow` 文件将没有 SELinux 上下文。\n\n从此处开始重置 root 密码，请使用以下步骤：\n\
  \n1. 将 `/sysroot` 重新挂载为读写。\n```\nswitch_root:/# mount -o remount,rw /sysroot\n```\n\
  2. 切换到 chroot 监狱，其中 `/sysroot` 被视为文件系统树的根。\n```\nswitch_root:/# chroot /sysroot\n\
  ```\n3. 设置一个新的 root 密码。\n```\nsh-4.4# passwd root\n```\n4. 确保在启动期间，包括 `/etc/shadow`\
  \ 在内的所有未标记文件都经过重新标记（relabel）。\n```\nsh-4.4# touch /.autorelabel\n```\n5. 输入两次 `exit`。第一个命令退出\
  \ chroot 监狱，第二个命令退出 initramfs 调试 shell。\n\n此时，系统将继续启动，执行完整的 SELinux 重新标记，然后再次重启。\n\
  \n### 检查日志\n\n查看之前失败启动的日志可能是很有用的。如果系统日志在重启后是持久化的，你可以使用 `journalctl` 工具检查这些日志。\n\n\
  请记住，默认情况下，系统日志在重启时会被清除。要将日志存储在跨越重启持久化的 `/var/log/journal` 目录中，请在 `/etc/systemd/journald.conf`\
  \ 中将 `Storage` 参数设置为 `persistent`。\n\n```bash\n[root@host ~]# vim /etc/systemd/journald.conf\n\
  \n...output omitted...\n\n[Journal]\nStorage=persistent\n\n...output omitted...\n\
  \n[root@host ~]# systemctl restart systemd-journald.service\n```\n\n要检查之前启动的日志，请使用\
  \ `journalctl` 的 `-b` 选项。在不带任何参数的情况下，`-b` 选项仅显示自启动以来的消息。使用负数作为参数，可以显示之前启动的日志。\n\n\
  ```bash\n[root@host ~]# journalctl -b -1 -p err\n```\n此命令显示上一次启动中所有评级为错误或更严重的消息。\n\
  \n### 修复 systemd 启动问题\n\n为了排查启动时的服务启动问题，Red Hat Enterprise Linux 8 提供了以下工具。\n\n\
  #### 启用早期调试 Shell\n\n通过 `systemctl enable debug-shell.service` 启用 `debug-shell`\
  \ 服务，系统会在启动序列早期在 TTY9 (Ctrl+Alt+F9) 上产生一个 root shell。该 shell 会以 root 身份自动登录，以便管理员可以在操作系统仍在启动时对其进行调试。\n\
  \n### 警告\n\n调试完成后，不要忘记禁用 `debug-shell.service` 服务，因为它会向任何具有本地控制台访问权限的人开放一个未经认证的\
  \ root shell。\n\n#### 使用紧急和救援目标\n\n通过从引导加载程序向内核命令行添加 `systemd.unit=rescue.target`\
  \ 或 `systemd.unit=emergency.target`，系统将进入救援或紧急 shell，而不是正常启动。这两个 shell 都需要 root\
  \ 密码。\n\n紧急目标（emergency target）保持根文件系统挂载为只读，而救援目标（rescue target）等待 `sysinit.target`\
  \ 完成，以便初始化更多的系统部分，例如日志服务或文件系统。此时，root 用户在驱动器重新挂载为读写状态之前，无法对 `/etc/fstab` 进行更改：\n\
  ```\nmount -o remount,rw /\n```\n管理员可以使用这些 shell 修复任何阻止系统正常启动的问题；；例如，服务之间的依赖循环或\
  \ `/etc/fstab` 中的错误条目。\n\n退出这些 shell 将继续常规启动过程。\n\n#### 识别卡住的任务\n\n在启动过程中，systemd\
  \ 会产生许多任务（jobs）。如果其中某些任务无法完成，它们将阻塞其他任务运行。要检查当前任务列表，管理员可以使用 `systemctl list-jobs`\
  \ 命令。任何列为运行（running）的任务必须在列为等待（waiting）的任务继续之前完成。\n\n### 参考文献\n\n`dracut.cmdline(7)`、`systemd-journald(8)`、`journald.conf(5)`、`journalctl(1)`\
  \ 和 `systemctl(1)` 手页。\n\n### 引导练习\n\n#### 重置 root 密码\n\n在此练习中，你将重置系统上的 root 密码。\n\
  \n#### 结果\n\n你应该能够重置丢失的 root 密码。\n\n## 开始之前\n\n在工作站上以 student 用户身份登录，密码为 `student`。\n\
