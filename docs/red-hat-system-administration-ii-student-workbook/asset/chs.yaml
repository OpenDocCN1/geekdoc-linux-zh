  ```\n\n\n\n\n\n*   系统固件从磁盘读取引导加载程序，然后将系统控制权交给该引导加载程序。在 Red Hat Enterprise Linux\
  \ 8 系统上，引导加载程序是 `GRand Unified Bootloader version 2` (`GRUB2`)。使用 `grub2-install`\
  \ 命令进行配置，该命令将 `GRUB2` 安装为磁盘上的引导加载程序。\n\n*   `GRUB2` 从 `/boot/grub2/grub.cfg` 文件加载配置，并显示一个菜单，你可以在其中选择要启动的内核。通过\
  \ `/etc/grub.d/` 目录、`/etc/default/grub` 文件以及 `grub2-mkconfig` 命令进行配置，用以生成 `/boot/grub2/grub.cfg`\
  \ 文件。\n\n*   在你选择内核或超时到期后，引导加载程序会从磁盘加载内核和 `initramfs` 并将其放入内存中。`initramfs` 是一个归档，包含了启动时所需的所有硬件的内核模块、初始化脚本等。在\
  \ Red Hat Enterprise Linux 8 上，`initramfs` 本身就包含了一个完整的可运行系统。通过 `/etc/dracut.conf.d/`\
  \ 目录、`dracut` 命令以及 `lsinitrd` 命令进行配置，用于检查 `initramfs` 文件。\n\n*   引导加载程序将控制权交给内核，并传递在引导加载程序内核命令行中指定的任何选项以及\
  \ `initramfs` 在内存中的位置。通过 `/etc/grub.d/` 目录、`/etc/default/grub` 文件以及 `grub2-mkconfig`\
  \ 命令进行配置，用以生成 `/boot/grub2/grub.cfg` 文件。\n\n*   内核初始化在 `initramfs` 中能找到驱动程序的所有硬件，然后从\
  \ `initramfs` 执行 `/sbin/init` 作为 PID 1。在 Red Hat Enterprise Linux 8 上，`/sbin/init`\
  \ 是指向 `systemd` 的软链接。通过内核 `init=` 命令行参数进行配置。\n\n*   来自 `initramfs` 的 `systemd` 实例执行针对\
  \ `initrd.target` 目标的所有单元。这包括将磁盘上的根文件系统挂载到 `/sysroot` 目录。通过 `/etc/fstab` 进行配置。\n\
  \n*   内核将根文件系统从 `initramfs` 切换（pivot）到 `/sysroot` 中的根文件系统。随后，`systemd` 使用安装在磁盘上的\
  \ `systemd` 副本重新执行自身。\n\n*   `systemd` 查找默认目标（从内核命令行传递的或在系统上配置的之一），然后启动（并停止）单元以符合该目标的配置，自动解决单元之间的依赖关系。本质上，一个\
  \ `systemd` 目标是系统应该激活以达到所需状态的一组单元。这些目标通常会启动文本登录界面或图形化登录界面。通过 `/etc/systemd/system/default.target`\
  \ 和 `/etc/systemd/system/` 进行配置。\n\n# 重启和关机\n\n要从命令行关闭或重启正在运行的系统，可以使用 `systemctl`\
  \ 命令。\n\n*   `systemctl poweroff` 停止所有正在运行的服务，卸载所有文件系统（在无法卸载时将其重新挂载为只读），然后关闭电源。\n\
  *   `systemctl reboot` 停止所有正在运行的服务，卸载所有文件系统，然后重启系统。\n\n你也可以使用这些命令的短版本 `poweroff`\
  \ 和 `reboot`，它们是对应 `systemctl` 等效命令的软链接。\n\n### 注意\n`systemctl halt` 和 `halt` 也可停止系统，但与\
  \ `poweroff` 不同，这些命令不会关闭电源；它们会将系统引导到一个可以手动关机的状态。\n\n# 选择 systemd 目标\n\n`systemd`\
  \ 目标是系统为了达到所需状态应该启动的一组 `systemd` 单元。下表列出了最重要的目标。\n\n| 目标 | 目的 |\n| :--- | :--- |\n\
  | `graphical.target` | 系统支持多用户、图形化和文本登录。 |\n| `multi-user.target` | 系统支持多用户，仅支持文本登录。\
  \ |\n| `rescue.target` | sulogin 提示，基础系统初始化完成。 |\n| `emergency.target` | sulogin\
  \ 提示，initramfs 切换完成，且系统根目录以只读方式挂载在 /。 |\n\n目标可以是另一个目标的一部分。例如，`graphical.target`\
  \ 包含 `multi-user.target`，后者又依赖于 `basic.target` 等其他目标。你可以使用以下命令查看这些依赖关系。\n\n```bash\n\
  [user@host ~]$ systemctl list-dependencies graphical.target | grep target\n```\n\
  graphical.target\n* └─multi-user.target\n* ├─basic.target\n* │ ├─paths.target\n\
  * │ ├─slices.target\n* │ ├─sockets.target\n* │ ├─sysinit.target\n* │ │ ├─cryptsetup.target\n\
  * │ │ ├─local-fs.target\n* │ │ └─swap.target\n\n要列出可用目标，请使用以下命令。\n\n```bash\n[user@host\
  \ ~]$ systemctl list-units --type=target --all\n```\nUNIT LOAD LOAD ACTIVE DESCRIPTION\n\
  ---------------------------------------------------------------------------\nbasic.target\
  \ loaded active active Basic System\ncryptsetup.target loaded active active Local\
  \ Encrypted Volumes\nemergency.target loaded inactive dead Emergency\ngetty.target\
  \ loaded inactive dead Prompts (Pre)\ngraphical.target loaded inactive dead Graphical\
  \ Interface\nmulti-user.target loaded active active-user\n\n# 运行时选择目标\n\n在运行的系统上，管理员可以使用\
  \ `systemctl isolate` 命令切换到不同的目标。\n\n```bash\n[root@host ~]$ systemctl isolate multi-user.target\n\
  ```\n停止该目标（及其依赖项）不需要的服务，并启动尚未启动的服务。\n\n### 注意\n并非所有目标都可以隔离。你只能隔离在其单元文件中设置了 `AllowIsolate=yes`\
  \ 的目标。例如，你可以隔离 `graphical` 目标，但不能隔离 `cryptsetup` 目标。\n\n```bash\n[user@host ~]$\
  \ systemctl cat graphical.target\n```\n[Unit]\nDescription=Graphical Interface\n\
  Documentation=systemd(7)\nRequires=multi-user.target\nWants=display-manager.service\n\
  Conflicts=rescue.service rescue.target\nAfter=multi-user.target rescue.target display-manager.service\n\
  AllowIsolate=yes\n\n```bash\n[user@host ~]$ systemctl cat cryptsetup.target\n```\n\
  \n# 设置默认目标\n\n当系统启动时，`systemd` 会激活 `default.target` 目标。通常 `/etc/systemd/system/`\
  \ 中的默认目标是 `graphical.target` 或 `multi-user.target` 的软链接。与其手动编辑此软链接相反，`systemctl`\
  \ 命令提供了两个子命令来管理它：`get-default` 和 `set-default`。\n\n```bash\n[root@host ~]$ systemctl\
  \ get-default\nmulti-user.target\n```\n\n```bash\n[root@host ~]$ systemctl set-default\
  \ graphical.target\nRemoved /etc/systemd/system/default.target.\nCreated symlink\
  \ /etc/systemd/system/default.target -> /usr/lib/systemd/system/graphical.target.\n\
  ```\n\n```bash\n[root@host ~]$ systemctl get-default\ngraphical.target\n```\n\n\
  # 在启动时选择不同目标\n\n要在启动时选择不同的目标，请从引导加载程序命令行附加 `systemd.unit= target.target` 选项。例如，为了在几乎没有服务运行的情况下进入救援\
  \ shell 以更改系统配置，请从引导加载程序命令行添加以下选项：\n\n`systemd.unit=rescue.target`\n\n此配置更改仅影响单次启动，是调试启动过程的有用工具。使用此方法选择不同目标，请按照以下步骤：\n\
  \n1. 启动或重启系统。\n2. 按任意键中断引导加载菜单倒计时（按 Enter 键将正常启动）。\n3. 将光标移动到想要启动的内核条目。\n4. 按 `e`\
  \ 编辑当前条目。\n\n\n\n\n将光标移动到以 `linux` 开头的行。这是内核命令行。\n\n6.\n\n末尾添加 `systemd.unit=target.target`。例如，\n\
  \n`systemd.unit=emergency.target.`\n\n7.\n\n按下 `Ctrl+x` 使用这些更改启动。\n\n### 参考文献\n\n\
  info `grub2` ( GNU GRUB 手册)\n\n`bootup(7)`, `dracut.bootup(7)`, `lsinitrd(1)`, `systemd.target(5)`,\
  \ `systemd.special(7)`, `sulogin(8)` 和 `systemctl(1)` 手页。有关更多信息，请参阅`配置基础系统设置`指南中的“使用\
  \ systemd 管理服务”章节，地址位于：\n\nhttps://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html-single/configuring_basic_system_settings/#managing-services-with-systemd\n\
  \n290\n\nRH134-RHEL8.0-en-1-20190531\n\n![](img/00257.jpeg)\n\n# 第 10 章 | 控制启动过程\n\
  \n## 引导性练习\n\n### 选择启动目标\n\n在此练习中，你将确定系统启动的默认目标，并引导系统启动到其他目标。\n\n### 学习结果\n\n你应当能够更新系统默认目标，并从启动加载程序使用临时目标。\n\
  \n### 准备之前\n\n在工作站上以用户 `student` 登录，密码为 `student`。\n\n在工作站上，运行 `lab boot-selecting\
  \ start` 命令。该命令会运行一个启动脚本，为练习准备工作站。\n\n```bash\n[student@workstation ~]$ lab boot-selecting\
  \ start\n```\n\n1.\n\n在工作站上，打开终端并确认默认目标为 `graphical.target`。\n\n```bash\n[student@workstation\
  \ ~]$ systemctl get-default\ngraphical.target\n```\n\n2.\n\n在工作站上，在不重启的情况下手动切换到多用户目标。使用\
  \ `sudo` 命令，如果系统提示，请使用 `student` 作为密码。\n\n```bash\n[student@workstation ~]$ sudo\
