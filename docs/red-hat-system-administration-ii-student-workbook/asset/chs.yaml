  RH134-RHEL8.0-en-1-20190531\n217\n![](img/00249.jpeg)\n\n# 解决方案：管理逻辑卷\n\n## 性能清单\n\
  在本实验中，你将调整一个现有逻辑卷的大小，根据需要添加 LVM 资源，然后添加一个带有持久挂载 XFS 文件系统的新逻辑卷。\n\n### 预期结果\n你应该能够：\n\
  * 将 `serverb_01_lv` 逻辑卷的大小调整为 768 MiB。\n* 创建一个名为 `serverb_02_lv` 的 128 MiB 新逻辑卷，并使用\
  \ XFS 文件系统将其持久地挂载到 `/storage/data2`。\n\n## 开始之前\n使用密码 `student` 以 `student` 身份登录到工作站。\n\
  \n在工作站上，运行 `lab lvm-review start` 命令。该命令会运行一个启动脚本，判断 `serverb` 机器在网络上是否可访问。它还会为练习准备\
  \ `serverb` 上的存储。\n\n```bash\n[student@workstation ~]$ lab lvm-review start\n```\n\
  \n在 `serverb` 上，挂载在 `/storage/data1` 的名为 `serverb_01_lv` 的逻辑卷磁盘空间不足，你被将其扩展到 768\
  \ MiB。你必须确保 `serverb_01_lv` 保持持久挂载在 `/storage/data1`。\n\n你还被要求创建一个名为 `serverb_02_lv`\
  \ 的 128 MiB 新逻辑卷，并挂载在 `/storage/data2`。你被指示使用 XFS 文件系统格式化新逻辑卷。\n\n`serverb_01_vg`\
  \ 卷组持有逻辑卷。遗憾的是，它没有足够的空间来扩展现有逻辑卷并添加新卷。之前在 `/dev/vdb` 上创建了一个 512 MiB 的分区。你被指示在 `/dev/vdb`\
  \ 上额外使用 512 MiB 空间。你必须创建这个新分区。\n\n### 步骤\n1. 在 `/dev/vdb` 上创建一个 512 MiB 分区，将其初始化为物理卷，并用它扩展\
  \ `serverb_01_vg` 卷组。\n\n#### 1.1 以 `student` 用户身份登录 `serverb`。\n```bash\n[student@workstation\
  \ ~]$ ssh student@serverb\n...output...\n[student@serverb ~]$\n```\n\n#### 1.2 使用\
  \ `sudo -i` 命令切换到 root 用户。`student` 用户的密码是 `student`。\n```bash\n[student@serverb\
  \ ~]$ sudo -i\n[sudo] password for student: student\n[root@serverb ~]#\n```\n\n\
  #### 1.3 使用 `parted` 创建 512 MiB 分区并将其类型设置为 LVM。\n```bash\n[root@serverb ~]# parted\
  \ -s /dev/vdb mkpart primary 512MiB 1024MiB\n[root@serverb ~]# parted -s /dev/vdb\
  \ set 2 lvm\n```\n\n#### 1.4 使用 `udevadm` 让系统注册新分区。\n```bash\n[root@serverb ~]#\
  \ udevadm settle\n```\n\n#### 1.5 使用 `pvcreate` 初始化分区为 PV。\n```bash\n[root@serverb\
  \ ~]# pvcreate /dev/vdb\nPhysical volume \"/dev/vdb\" created.\n```\n\n#### 1.6\
  \ 使用 `vgextend` 使用新的 `/dev/vdb` PV 扩展名为 `serverb_01_vg` 的卷组。\n```bash\n[root@serverb\
  \ ~]# vgextend serverb_01_vg /dev/vdb\nVolume group \"serverb_01_vg\" extended\n\
  ```\n\n### 2. 将 `serverb_01_lv` 逻辑卷扩展到 768 MiB，包括文件系统。\n\n#### 2.1 使用 `lvextend`\
  \ 将 `serverb_01_lv` LV 扩展到 768 MiB。\n```bash\n[root@serverb ~]# lvextend -L 768M\
  \ /dev/serverb_01_vg/serverb_01_lv\nSize of logical volume serverb_01_vg/serverb_01_lv\
  \ changed from 256.00 MiB (64 extents) to 768.00 MiB (192 extents).\nLogical volume\
  \ serverb_01_vg/serverb_01_lv successfully resized.\n```\n**注意**：你也可以使用 `-L +512M`\
  \ 选项来调整 LV 大。\n\n#### 2.2 使用 `xfs_growfs` 将 XFS 文件系统扩展到 LV 上的剩余空间。\n```bash\n[root@serverb\
  \ ~]# xfs_growfs /storage/data1\nmeta-data=/dev/mapper/serverb_01_vg-serverb_01_lv\
  \ isize=512 agcount=4, agsize=16384 blks\n...output omitted...\n```\n**注意**：此示例显示了扩展文件系统的\
  \ `xfs_growfs` 步骤。另一种方法是在 `lvextend` 命令中添加 `-r` 选项。\n\n### 3. 在现有卷组中，创建一个名为 `serverb_02_lv`\
  \ 的大小为 128 MiB 的新逻辑卷。添加 XFS 文件系统并将其持久地挂载到 `/storage/data2`。\n\n#### 3.1 使用 `lvcreate`\
  \ 从 `serverb_01_vg` VG 创建名为 `serverb_02_lv` 的 128 MiB LV。\n```bash\n[root@serverb\
  \ ~]# lvcreate -n serverb_02_lv -L 128M serverb_01_vg\nLogical volume \"serverb_02_lv\"\
  \ created\n```\n\n#### 3.2 使用 `mkfs` 在 `serverb_02_lv` LV 上放置 XFS 文件系统。使用 LV 设备名称。\n\
  ```bash\n[root@serverb ~]# mkfs -t xfs /dev/serverb_01_vg/serverb_02_lv\nmeta-data=/dev/serverb_01_vg/serverb_02_lv\
  \ isize=512 agcount=4, agsize=8192 blks\n```\n\n\n\n\n### 3.3. 使用 `mkdir` 在 `/storage/data2`\
  \ 创建挂载点。\n\n```bash\n[root@serverb ~]# mkdir /storage/data2\n```\n\n### 3.4.\n在\
  \ `serverb` 的 `/etc/fstab` 末尾添加以下行：\n\n`/dev/serverb_01_vg/serverb_02_lv /storage/data2\
  \ xfs defaults 1 2`\n\n### 3.5.\n使用 `systemctl daemon-reload` 更新 systemd 以加载新的 `/etc/fstab`\
  \ 配置。\n\n```bash\n[root@servera ~]# systemctl daemon-reload\n```\n\n### 3.6.\n使用\
  \ `mount` 验证 `/etc/fstab` 条目并挂载新的 `serverb_02_lv` LV 设备。\n\n```bash\n[root@serverb\
  \ ~]# mount /storage/data2\n```\n\n### 4.\n完成后，重启你的 `serverb` 机器，然后在工作站上运行 `lab\
  \ lvm-review grade` 命令来验证你的工作。\n\n```bash\n[root@serverb ~]# systemctl reboot\n\
  ```\n\n等待 `serverb` 完全启动，然后进行评估。\n\n#### 评估\n在工作站上，运行 `lab lvm-review grade` 脚本以确认本次练习成功。\n\
  \n```bash\n[student@workstation ~]$ lab lvm-review grade\n```\n\n## 第 7 章 | 管理逻辑卷\n\
  \n### 完成\n在工作站上，运行 `lab lvm-review finish` 脚本以完成实验。\n\n```bash\n[student@workstation\
  \ ~]$ lab lvm-review finish\n```\n\n本实验结束。\n\n### 总结\n在本章中，你学习了：\n- LVM 允许通过在多个存储设备上分配空间来创建灵活存储。\n\
  - 物理卷、卷组和逻辑卷由 `pvcreate`、`vgreduce` 和 `lvextend` 等工具进行管理。\n- 逻辑卷可以格式化为文件系统或交换空间，并且可以持久挂载。\n\
  - 可以向卷组添加额外的存储，并动态扩展逻辑卷。\n\n---\n\n## 第 8 章：实现高级存储功能\n\n### 目标\n使用 Stratis 本地存储管理系统管理存储，并使用\
  \ VDO 卷优化正在使用的存储空间。\n\n### 目标\n- 使用 Stratis 本地存储管理管理多个存储层。\n- 通过 VDO 对存储设备上的数据进行压缩和去重，以优化存储空间的使用。\n\
  \n### 章节\n- 使用 Stratis 管理分层存储（包含引导练习）\n- 使用 VDO 对存储进行压缩和去重（包含引导练习）\n\n### 实验：实现高级存储功能\n\
  \n---\n\n## 使用 STRATIS 管理分层存储\n\n### 目标\n完成本节后，你应该能够使用 Stratis 本地存储管理管理多个存储层。\n\n\
  ### 描述 Stratis 架构\nRed Hat Enterprise Linux (RHEL) 当前的本地存储解决方案包含了许多稳定且成熟的技术，包括设备映射器\
  \ (`dm`)、逻辑卷管理器 (`LVM`) 和 `XFS` 文件系统。这些组件提供的功能包括大规模可扩展的文件系统、快照、冗余 (RAID) 逻辑设备、多路径、精简置备、缓存、去重以及对虚拟机和容器的支持。每个存储栈层（`dm`、`LVM`\
  \ 和 `XFS`）都使用特定层的命令和工具进行管理，这要求系统管理员将物理设备、固定大小卷和文件系统作为独立的存储组件进行管理。\n\n近年来出现了一种新型存储管理解决方案，被称为卷管理文件系统，它们在创建和调整文件系统大小时动态且透明地管理卷层。然而，尽管这些文件系统的社区开发持续了多年，但没有一个能达到成为\
  \ Red Hat Enterprise Linux 主要本地存储所需的功能支持和稳定性。\n\n通过 RHEL 8，Red Hat 引入了 `Stratis`\
  \ 存储管理解决方案。Stratis 像其他存储项目那样从零开始，而是与现有的 RHEL 存储组件配合。Stratis 作为服务运行，管理物理设备池，并为正在创建的文件系统透明地创建和管理卷。由于\
  \ Stratis 使用现有的存储驱动程序和工具，你在 `LVM`、`XFS` 和设备映射器中使用的所有高级存储功能都被 Stratis 支持。\n\n在卷管理文件系统中，文件系统是使用名为“精简置备”（thin\
  \ provisioning）的概念构建在共享的磁盘设备池中的。Stratis 文件系统没有固定大小，且不再预分配未使用的块空间。虽然文件系统仍构建在隐藏的 `LVM`\
  \ 卷上，但 Stratis 会为你管理底层卷并在需要时扩展它。文件系统的实际使用大小被视为包含的文件实际占用的块量。文件系统的可用空间是其所属的池化设备中仍未使用的空间量。\n\
  \nStratis 使用元数据来识别受管理的池、卷和文件系统。手动配置 Stratis 文件系统可能会导致这些元数据丢失，并防止 Stratis 识别其创建的文件系统。请使用\
  \ Stratis 的工具和命令。\n\n### 描述简化的存储栈\nStratis 简化了一系列 Red Hat 产品本地存储配置和设置的许多方面。例如，在早期版本的\
  \ Anaconda 安装程序中，系统管理员必须将磁盘管理的每个方面层层叠加。现在，安装程序使用 Stratis 简化了磁盘设置。其他使用 Stratis 的产品包括\
  \ Cockpit、Red Hat Virtualization 和 Red Hat Enterprise Linux Atomic Host。对于所有这些产品，Stratis\
  \ 使管理存储空间和快照变得简单且不易出错。\n\n### 描述 Stratis 层\nStratis 内部使用 `Backstore` 子系统管理块设备，并使用\
  \ `Thinpool` 子系统管理池。`Backstore` 子系统有一个数据层，用于维护块设备上的磁盘上元数据，并检测和纠正数据损坏。缓存层使用高性能块设备作为数据层之上的缓存。`Thinpool`\
  \ 子系统管理与 Stratis 文件系统关联的精简置备卷。该子系统使用 `dm-thin` 设备映射驱动程序在虚拟卷的大小调整和管理方面替代 `LVM`。`dm-thin`\
  \ 创建的具有大虚拟大小的卷并用 `XFS` 格式化，但物理大小较小。当物理大小接近满时，Stratis 会自动扩大它。\n\n\n\n\n\n# 图 8.3：Stratis\
  \ 层级\n\n![](img/00136.jpeg)\n\n## 第 8 章 | 实现高级存储功能 \n\n## 管理精简置备文件系统\n\n要使用 Stratis\
  \ 存储管理解决方案管理精简置备文件系统，请安装 `stratis-cli` 和 `stratisd` 包。`stratis-cli` 包提供了 `stratis`\
  \ 命令，该命令通过 `D-Bus API` 将用户请求翻译给 `stratisd` 服务。`stratisd` 包提供了 `stratisd` 服务，它实现了\
  \ `D-Bus` 接口，并管理和监控 Stratis 的元素，例如块设备、池和文件系统。如果 `stratisd` 服务正在运行，则可以使用 `D-Bus API`。\n\
  \n### 使用常用工具安装并激活 Stratis：\n\n*   使用 `yum install` 命令安装 `stratis-cli` 和 `stratisd`。\n\
  \n```bash\n[root@host ~]# yum install stratis-cli stratisd\n...output omitted...\n\
  \nIs this ok [y/N]: y\n\n...output omitted...\n\nComplete!\n```\n\n*   使用 `systemctl`\
  \ 命令激活 `stratisd` 服务。\n\n```bash\n[root@host ~]# systemctl enable --now stratisd\n\
  ```\n\n以下是使用 Stratis 存储管理解决方案执行常用的管理操作。\n\n*   使用 `stratis pool create` 命令创建一个或多个块设备的池。\n\
  \n```bash\n[root@host ~]# stratis pool create pool1 /dev/vdb\n```\n每个池都是 `/stratis`\
  \ 目录下的子目录。\n\n*   使用 `stratis pool list` 命令查看可用池列表。\n\n```bash\n[root@host ~]# stratis\
  \ pool list\n\nName Total Physical Size Total Physical Used\npool1 5 GiB 52 MiB\n\
  ```\n\n*   使用 `stratis pool add-data` 命令向池添加额外的块设备。\n\n```bash\n[root@host ~]# stratis\
  \ pool add-data pool1 /dev/vdc\n```\n\n*   使用 `stratis blockdev list` 命令查看池的块设备。\n\
  \n```bash\n[root@host ~]# stratis blockdev list pool1\n\nPool Name Device Node Physical\
  \ Size State Tier\npool1 /dev/vdb 5 GiB In-use Data\npool1 /dev/vdc 5 GiB In-use\
  \ Data\n```\n\n*   使用 `stratis filesystem create` 命令从池中创建动态且灵活的文件系统。\n\n```bash\n\
  [root@host ~]# stratis filesystem create pool1 filesystem1\n```\n指向 Stratis 文件系统的链接位于\
  \ `/stratis/pool1` 目录中。\n\n*   Stratis 通过 `stratis filesystem snapshot` 命令支持文件系统快照。快照独立于源文件系统。\n\
  \n```bash\n[root@host ~]# stratis filesystem snapshot pool1 filesystem1 snapshot1\n\
  ```\n\n*   使用 `stratis filesystem list` 命令查看可用文件系统的列表。\n\n```bash\n[root@host ~]#\
  \ stratis filesystem list\n...output omitted...\n```\n\n为了确保 Stratis 文件系统被持久挂载，请编辑\
  \ `/etc/fstab` 并指定文件系统的细节。以下命令显示了文件系统的 UUID，您应该在 `/etc/fstab` 中使用该 UUID 来识别文件系统。\n\
  \n```bash\n[root@host ~]# lsblk --output=UUID /stratis/ pool1/ filesystem1\n\nUUID\n\
  31b9363b-add8-4b46-a4bf-c199cd478c55\n```\n\n以下是 `/etc/fstab` 文件中持久挂载 Stratis 文件系统的示例条。\n\
  \n```text\nUUID=31b9...8c55 /dir1 xfs defaults,x-systemd.requires=stratisd.service\
  \ 0 0\n```\n\n`x-systemd.requires=stratisd.service` 挂载选项会延迟文件系统的挂载，直到启动过程中 `systemd`\
  \ 启动了 `stratisd.service`。\n\n**注意**\n在 `/etc/fstab` 中为 Stratis 文件系统未使用 `x-systemd.requires=stratisd.service`\
  \ 挂载选项，将导致机器在下次重启时进入 `emergency.target`。\n\n### 参考文献\n有关更多信息，请参阅《Red Hat Enterprise\
  \ Linux 8：配置和管理文件系统》指南中的“使用 Stratis 管理分层本地存储”章节：\nhttps://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html-single/configuring_and_managing_file_systems/\n\
  \nStratis 存储\nhttps://stratis-storage.github.io/\n\nStratis 从 ZFS、Btrfs 和 Linux\
  \ Volume Manager 中学习到的教训\nhttps://opensource.com/article/18/4/stratis-lessons-learned\n\
  \n![](img/00284.jpeg)\n\n## 引导练习：使用 Stratis 管理分层存储\n\n在本次练习中，你将使用 Stratis 存储管理解决方案创建协同工作的池、卷和文件系统。\n\
  \n 预期结果\n你 应该能够：\n*   使用 Stratis 存储管理解决方案创建精简置备文件系统。\n*   验证 Stratis 卷动态增长以支持实时数据增长。\n\
  *   从精简置备文件系统的快照访问数据。\n\n## 开始之前\n1. 使用密码 `student` 以 `student` 身份登录工作站。\n2. 在工作站上，运行\
  \ `lab stratis start` 启动实验。\n3. 连接到 `servera`。\n```bash\n[student@workstation ~]#\
  \ ssh servera\n```\n4. 切换到 `root` 用户。\n```bash\n[student@servera]# sudo -i\n```\n\
  5. 使用 `yum` 安装 `stratisd` 和 `stratis-cli` 包。\n```bash\n[root@servera]# yum install\
  \ stratisd stratis-cli\n```\n6. 使用 `systemctl` 命令激活 `stratisd` 服务。\n```bash\n[root@servera]#\
  \ systemctl enable --now stratisd\n```\n7. 使用 `stratis pool create` 命令创建一个名为 `pool1`\
  \ 的 Stratis 池。\n```bash\n[root@servera]# stratis pool create pool1 /dev/vdb\n```\n\
  8. 使用 `stratis pool list` 命令验证 `pool1` 的可用性。\n```bash\n[root@servera]# stratis pool\
  \ list\n\nName Total Physical Size Total Physical Used\npool1 5 GiB 52 MiB\n```\n\
  9. 通过 `stratis pool add-data` 命令使用 `/dev/vdc` 设备扩展 `pool1` 的容量。\n```bash\n[root@servera]#\
  \ stratis pool add-data pool1 /dev/vdc\n```\n10. 使用 `stratis pool list` 命令验证 `pool1`\
  \ 的大小。\n```bash\n[root@servera]# stratis pool list\n\nName Total Physical Size Total\
  \ Physical Used\npool1 10 GiB 56 MiB\n```\n11. 使用 `stratis blockdev list` 命令验证当前属于\
  \ `pool1` 的块设备。\n```bash\n[root@servera]# stratis blockdev list pool1\n\nPool Name\
  \ Device Node Physical Size State Tier\npool1 /dev/vdb 5 GiB In-use Data\npool1\
