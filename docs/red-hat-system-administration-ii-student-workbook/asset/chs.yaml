  \ 管理基础存储\n\n# 管理交换空间 (SWAP SPACE)\n\n### 目标\n完成本节后，你应该能够创建和管理交换空间以补充物理内存。\n\n##\
  \ 交换空间概念介绍\n交换空间（swap space）是 Linux 内核内存管理子系统控制的磁盘区域。内核使用交换空间通过持有活动内存页来补充系统 RAM。系统\
  \ RAM 加上交换空间称为虚拟内存。\n\n当系统上的内存使用超过定义的限额时，内核会搜索 RAM 寻找分配给进程的空闲内存页。内核将这些空闲页写入交换区域，并将\
  \ RAM 页重新分配给其他进程。如果程序需要访问磁盘上的某个页面，内核会找到另一个空闲的内存页，将其写入磁盘，然后从交换区域中调回所需的页面。\n\n由于交换区域位于磁盘上，与\
  \ RAM 相比，交换速度较慢。虽然它用于增强系统 RAM，但你不应将交换空间视为解决工作负载 RAM 不足的持续解决方案。\n\n### 设置交换空间的大小\n\
  管理员应根据系统上的内存工作负载来确定交换空间的大小。应用程序供应商有时会就该主题提供建议。下表根据物理内存总量提供了一些指导。\n\n#### RAM 与交换空间建议\n\
  \n| RAM | 交换空间 | 允许休眠时的交换空间 |\n| :--- | :--- | :--- |\n| 2 GiB 或更少 | RAM 的倍 | RAM\
  \ 的倍 |\n| 2 GiB 到 8 GiB 之间 | 与 RAM 相同 | RAM 的倍 |\n| 8 GiB 到 64 GiB 之间 | 至少 4 GiB\
  \ | RAM 的 1.5 倍 |\n| 超过 64 GiB | 至少 4 GiB | 不建议休眠 |\n\n笔记本和台式机的休眠功能在关闭系统前保存 RAM\
  \ 内容。当你重新打开系统时，内核从交换空间恢复 RAM 内容，而不需要完全启动。对于这些系统，交换空间需要大于 RAM 的容量。\n\n本节末尾参考部分的知识库文章提供了更多关于设置交换空间大小的指导。\n\
  \n172\nRH134-RHEL8.0-en-1-20190531\n![](img/00289.jpeg)\n第 6 章 | 管理基础存储\n\n## 创建交换空间\n\
  要创建交换空间，你需要执行以下操作：\n* 创建文件系统类型为 `linux-swap` 的分区。\n* 在设备上放置交换签名。\n\n### 创建交换分区\n\
  使用 `parted` 创建所需大小的分区，并将其文件系统类型设置为 `linux-swap`。过去，工具通过查看分区文件系统类型来确定是否应激活该设备；但现在不再如此。尽管实用程序不再使用分区文件系统类型，但设置该类型允许管理员快速确定分区的用途。\n\
  \n以下示例创建了一个 256 MB 的分区。\n\n```bash\n[root@host ~]# parted /vdb\nGNU Parted 3.2\n\
  Using /vdb\nWelcome to Parted! 输入 'help' 查看命令列表。\n(parted) print\nModel: Virtio\
  \ Block Device\nDisk /vdb\nUnit: MiB\nFree: 20480MiB\nIn: 20GiB\nPartition table:\
  \ gpt\nNumber  Start         End         Size     Type\n1       1MiB          256MiB\
  \      linux-swap\n(parted) mkpart linux-swap 1MiB 256MiB\n(parted) quit\n```\n\
  创建分区后，运行。\n\n### 格式化设备\n`mkswap` 命令在设备上应用交换签名。与其他格式化工具不同，`mkswap` 在设备头部写入一个块。\n\n\
  ```bash\n[root@host ~]# mkswap /vdb\nSetting up swap version 1, size = 255848 KB\
  \ (244 MiB)\n```\n\n### 激活交换空间\n可以使用 `swapon` 激活已格式化的交换空间。使用设备作为参数运行 `swapon`，或者使用\
  \ `swapon -a` 激活 `/etc/fstab` 中列出的交换空间。使用 `swapon --show` 和 `free` 命令检查。\n\n```bash\n\
  [root@host ~]# swapon /vdb\n[root@host ~]# free\n              total        used\
  \        free      shared  buff/cache   available\nMem:             ...        \
  \     ...\nSwap:            249848             0     249848\n```可以使用 `swapoff` 命令禁用交换空间。如果交换空间中有写入的数据，`swapoff`\
  \ 会尝试将这些页移动到其他交换空间或返回内存。如果无法将数据写入其他地方，`swapoff` 命令将失败，交换空间将保持激活。\n\n### 持久化激活交换空间\n\
  要在每次启动时激活交换空间，需要在 `/etc/fstab` 文件中添加条目。下面的示例显示了根据上述创建的交换空间在 `/etc/fstab` 中的典型行。\n\
  \n```text\nUUID=39e2667a-9458-42fe-9665-c5c85460581 swap swap defaults 0 0\n```\n\
  示例使用 UUID 作为第一个字段。格式化设备时，`mkswap` 命令会显示该 `UUID`。如果你丢失了 `mkswap` 的输出，可以使用 `lsblk\
  \ --fs` 命令。此外，你也可以在第一个字段中使用设备名称。\n\n\n\n\n第四个字段是选项。示例使用了 `defaults` 选项。`defaults`\
  \ 选项包含了挂载选项 `auto`，这意味着系统启动时会自动激活交换空间。\n\n最后两个字段是 `dump` 标志和 `fsck` 顺序。交换空间不需要备份也不需要文件系统检查，因此这些字段应设置为零。\n\
  \n当你在 `/etc/fstab` 文件中添加或删除 entry 时，运行 `systemctl daemon-reload` 命令或重启服务器，以便 `systemd`\
  \ 注册新配置。\n\n```\n[root@host ~]# systemctl daemon-reload\n```\n\n# 设置交换空间优先级\n\n\
  默认情况下，系统串行使用交换空间，这意味着内核使用第一个激活的交换空间直到其满，然后开始使用第二个交换空间。然而，你可以为每个交换空间定义优先级以强制执行该顺序。\n\
  \n要设置优先级，请在 `/etc/fstab` 中使用 `pri` 选项。内核首先使用优先级最高的交换空间。默认优先级为 `-2`。\n\n示例显示了在 `/etc/fstab`\
  \ 中定义的三个交换空间。内核首先使用最后一条目，其 `pri=10`。当该空间满时，它使用第二个条目，其 `pri=4`。最后，它使用第一条条目，其默认优先级为\
  \ `-2`。\n\n```\nUUID=af30cbb0-3866-466a-825a-58889a49ef33 swap swap defaults 0 0\n\
  UUID=39e2667a-9458-42fe-9665-c5c854605881 swap swap pri=4 0 0\nUUID=fbd7fa60-b781-44a8-961b-37ac3ef572bf\
  \ swap swap pri=10 0 0\n```\n\n使用 `swapon --show` 显示交换空间的优先级。\n\n当交换空间具有相同优先级时，内核将以轮询方式写入它们。\n\
  \n# 参考\n\n`mkswap(8)`, `swapon(8)`, `swapoff(8)`, `mount(8)` 和 `parted(8)` 手页。知识库：Red\
  \ Hat 平台推荐的交换大小是多少？\n\nhttps://access.redhat.com/solutions/15244\n\nRH134-RHEL8.0-en-1-20190531\n\
