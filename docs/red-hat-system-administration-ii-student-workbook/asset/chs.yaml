  \n## 答案：管理基础存储\n\n### 性能检查清单\n在本实验中，你将在新磁盘上创建多个分区，对某些分区进行文件系统格式化并挂载，并将另一些激活为交换空间。\n\
  \n### 学习目标\n你应当能够：\n* 使用 `parted` 命令显示和创建分区。\n* 在分区上创建新的文件系统并持久地挂载它们。\n* 创建交换空间并在启动时激活它们。\n\
  \n## 开始之前\n使用密码 `student` 登录到工作站 `student`。\n\n在工作站上，运行 `lab storage-review start`\
  \ 命令。该命令会运行一个启动脚本，用于判断网络是否可以访问 `serverb` 机器。它还为 `serverb` 上的第二块磁盘为练习做好准备。\n\n```bash\n\
  [student@workstation ~]$ lab storage-review start\n```\n\n### 1\n`serverb` 上有新的磁盘。在第一块新磁盘上，创建一个名为\
  \ `backup` 的 2 GB GPT 分区。由于可能很难设置精确的大小，因此 1.8 GB 到 2.2 GB 之间的大小是可以接受的。在该分区上设置正确的文件系统类型以托管\
  \ XFS 文件系统。\n\n`serverb` 上 `student` 用户账户的密码为 `student`。该用户通过 `sudo` 拥有完全 root 权限。\n\
  \n#### 1.1\n使用 `ssh` 命令以 `student` 用户身份登录 `serverb`。系统配置为使用 `SSH` 密钥进行身份验证，因此不需要密码。\n\
  \n```bash\n[student@workstation ~]$ ssh student@serverb\n...output omitted...\n\
  [student@serverb ~]$\n```\n\n#### 1.2\n由于创建分区和文件系统需要 root 权限，使用 `sudo -i` 命令切换到\
  \ root 用户。如果系统提示，请使用 `student` 作为密码。\n\n```bash\n[student@serverb ~]$ sudo -i\n\
  [sudo] password for student: student\n[root@serverb ~]#\n```\n\nRH134-RHEL8.0-en-20190531\n\
  183\n\n![](img/00436.jpeg)\n\n# 第 6 章 | 管理基础存储\n\n#### 1.3\n使用 `lsblk` 命令识别新磁盘。这些磁盘不应该有任何分区。\n\
  \n```bash\n[root@serverb ~]# lsblk\nNAME MAJ:MIN RM SIZE RO TYPE MOUNTPOINT\nsr0\
  \ 11:0 1 1024M 0 rom\nvda 252:0 0 10G 0 disk\n└─vda1 252:1 0 10G 0 part /\nvdb 252:16\
  \ 0 5G 0 disk\nvdc 252:32 0 5G 0 disk\nvdd 252:48 0 5G 0 disk\n```\n注意第一块新磁盘 `vdb`\
  \ 没有任何分区。\n\n#### 1.4\n确认磁盘没有标签。\n\n```bash\n[root@serverb ~]# parted /dev/vdb print\n\
  Error: /dev/vdb: unrecognised disk label\nModel: Virtio Block Device (virtblk)\n\
  Disk /dev/vdb: 5369MB\nSector size (logical/physical): 512B/512B\nPartition Table:\
  \ unknown\nDisk Flags:\n```\n\n#### 1.5\n使用 `parted` 和 `mklabel` 子命令定义 GPT 分区方案。\n\
  \n```bash\n[root@serverb ~]# parted /dev/vdb mklabel gpt\nInformation: You may need\
  \ to update /etc/fstab.\n```\n\n#### 1.6\n创建 2 GB 分区。将其命名为 `backup` 并将其类型设置为 `xfs`。从扇区\
  \ 2048 开始该分区。\n\n```bash\n[root@serverb ~]# parted /dev/vdb mkpart backup xfs 2048s\
  \ 2GB\nInformation: You may need to update /etc/fstab.\n```\n\n#### 1.7\n确认新分区已正确创建。\n\
  \n```bash\n[root@serverb ~]# parted /dev/vdb print\nModel: Virtio Block Device (virtblk)\n\
  Disk /dev/vdb: 5369MB\nSector size (logical/physical): 512B/512B\nPartition Table:\
  \ gpt\nDisk Flags:\nNumber Start End Size Name\n1 2048s 2B backup\n```\n\n#### 1.8\n\
  运行 `udevadm settle` 命令。这会让系统等待检测新分区。\n\n```bash\n[root@serverb ~]# udevadm settle\n\
  ```\n\nRH134-RHEL8.0-en-20190531\n184\n\n![](img/00261.jpeg)\n\n# 第 6 章 | 管理基础存储\n\
  \n### 2\n使用 XFS 文件系统格式化该 2 GB 分区，并将其持久地挂载到 `/backup`。\n\n#### 2.1\n使用 `mkfs.xfs`\
  \ 命令格式化 `/dev/vdb1`。\n\n```bash\n[root@serverb ~]# mkfs.xfs /dev/vdb1\n```\n\n####\
  \ 2.2\n创建 `/backup` 挂载点。\n\n```bash\n[root@serverb ~]# mkdir /backup\n```\n\n####\
  \ 2.3\n在将新文件系统添加到 `/etc/fstab` 之前，获取其 `UUID`。\n\n```bash\n[root@serverb ~]# lsblk\
  \ --fs /dev/vdb1\nNAME FSTYPE LABEL UUID MOUNTPOINT\nvdb1 xfs a3665c6b-4bff-49b6-a528...\n\
  ```\n你系统的 UUID 可能不同。\n\n#### 2.4\n编辑 `/etc/fstab` 并定义新的文件系统。\n\n```bash\n[root@serverb\
  \ ~]# vim /etc/fstab\n...output omitted...\nUUID=a3665c6b-4bff-49b6-a528... /backup\
  \ xfs defaults 0 0\n```\n\n#### 2.5\n强制 `systemd` 重新读取 `/etc/fstab` 文件。\n\n```bash\n\
  [root@serverb ~]# systemctl daemon-reload\n```\n\n#### 2.6\n手动挂载 `/backup` 以验证你的工作。确认挂载成功。\n\
  \n```bash\n[root@serverb ~]# mount /backup\n[root@serverb ~]# mount | grep /backup\n\
  /dev/vdb1 on /backup type xfs (rw,relatime,seclabel,attr2,inode64,noquota)\n```\n\
  \n### 3\n在同一块新磁盘上创建两个名为 `swap1` 和 `swap2` 的 512 MB GPT 分区。460 MB 到 564 MB 之间的大小是可以接受的。在这些分区上设置正确的文件系统类型以托管交换空间。\n\
  \n#### 3.1\n通过显示 `/dev/vdb` 的当前分区表，获取第一个分区的结束位置。在下一步中，你使用该值作为 `swap1` 分区的起始。\n\n\
  ```bash\n[root@serverb ~]# parted /dev/vdb print\nModel: Virtio Block Device (virtblk)\n\
  Disk /dev/vdb: 5369MB\n```\n\n\n\n\n\n# 第 6 章 | 管理基础存储\n\n扇区大小（逻辑/物理）：512B/512B\n\
  分区表：`gpt`\n\n![](img/00438.jpeg)\n\n### 磁盘标记 (Disk Flags)\n| 编号 | 开始 | 结束 | 大小 |\
