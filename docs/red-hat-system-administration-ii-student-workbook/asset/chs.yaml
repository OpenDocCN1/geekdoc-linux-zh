  \ 1 root admin 46 May 31 NOTES.txt\n-rw-r-- 1 root admin 20 May 31 README.txt\n\
  -rw-r-- 1 root admin 27 May 31 Trackings.txt\n```\n\n#### 5.3. 退出 servera。\n\n```bash\n\
  [admin1@servera ~]$ exit\nlogout\nConnection to servera closed.\n```\n\n### 完成\n\
