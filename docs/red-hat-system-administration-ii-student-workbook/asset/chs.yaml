  \n## 第 4 章 使用 ACL 控制文件访问\n\n### 目标\n解释并设置文件上的访问控制列表 (`ACLs`)，以处理需要复杂用户和组访问权限的情况。\n\
  \n### 学习目标\n- 描述 `ACLs` 的用例，识别设置了 `ACLs` 的文件并解释这些 `ACLs` 的效果。\n- 在文件上设置和删除 `ACLs`，并定义目录在新建创建的文件上自动设置的默认\
  \ `ACLs`。\n\n### 章节\n- 解释文件 ACL（引导练习）\n- 使用 ACL 保护文件（引导练习）\n\n### 实验：使用 ACL 控制文件\n\
  RH134-RHEL8.0-en-1-20190531\n91\n![](img/00075.jpeg)\n第 4 章 控制文件访问\n\n## 解释文件 ACL\n\
  \n### 目标\n完成本节后，你应该能够：\n- 描述文件系统的 `ACLs`。\n- 使用 `ls` 和 `getfacl` 查看并解释 `ACLs`。\n\
  - 描述 `mask`（掩码）。\n\n### ACL 概念\n标准 Linux 权限限于单个所有者和组。然而，访问控制列表 (`ACLs`) 为多个用户和组提供了灵活性。\n\
  \n### 文件系统支持\n文件系统需要挂载 `ACL` 支持。`XFS` 文件系统内置 `ACL` 支持。其他文件系统（如 `ext3` 和 `ext4`）需要启用\
  \ `ACL` 选项。\n\n### 查看并解释权限\n`ls -l` 命令仅输出的 `ACL` 详情：\n\n```bash\n[user@host content]$\
  \ ls -l reports.txt\n-rwxrw----+ 1 user operators Mar 19 23:56 reports.txt\n```\n\
  权限字符串末尾的加号 (`+`) 表示此文件存在扩展 ACL。\n\n92\nRH134-RHEL8.0-en-1-20190531\n![](img/00394.jpeg)\n\
  第 4 章 控制文件访问\n\nuser：显示 ACL 设置与标准用户设置相同：`rwx`。\ngroup：显示当前的 ACL 掩码而不是组所有者设置：`rw`。\n\
  other：显示 ACL 设置与标准其他设置相同：`---`。\n\n### 注意\n对带有 `ACL` 的文件使用 `chmod` 更改组权限不会更改组所有者，但会更改\
  \ ACL 掩码。如果要更新文件的组所有者权限，请使用 `setfacl -m g::perms`。\n\n### 查看文件 ACL\n要显示文件的 `ACL`\
  \ 设置，使用 `getfacl`：\n\n```bash\n[user@host content]$ getfacl reports.txt\n# file:\
  \ reports.txt\n# owner: user\n# group: operators\nuser::rwx\nuser:consultant3:---\n\
  user:1005:rwx #effective:rw-\ngroup::rwx #effective:rw-\ngroup:consultant1:r--\n\
  group:2210:rwx #effective:rw-\nmask::rw-\nother::---\n```\n\n回顾上例的每个部分：\n\n注释项：\n\
  # file: reports.txt\n# owner: user\n# group: operators\n前三行是注释，标识文件名、所有者（user）和组所有者（operators）。如果有任何额外的文件标记（如\
  \ `setuid` 或 `setgid`），则会出现第四行注释显示设置了哪些标志位。\n\n用户项：\nuser::rwx\nuser:consultant3:---\n\
  user:1005:rwx #effective:rw-\n文件所有者权限：`user` 拥有 `rwx`。\n\n93\nRH134-RHEL8.0-en-1-20190531\n\
  ![](img/00274.jpeg)\n第 4 章 控制文件访问\n\n命名用户权限。每个与此文件关联的命名用户对应一个项目。\n\n\n\n\n\n`consultant3`\
  \ 没有权限。\n\n命名用户权限。`UID` `1005` 拥有 `rwx`，但掩码（mask）将有效权限限制为 `rw`。\n\n### 组条目：\n```\n\
  group::rwx #effective:rw-\ngroup:consultant1:r--\ngroup:2210:rwx #effective:rw-\n\
  ```\n\n组所有者权限。`operators` 拥有 `rwx`，但掩码将有效权限限制为 `rw`。\n\n命名组权限。每个与此文件关联的命名组条目。`consultant1`\
  \ 仅拥有 `r`。\n\n命名组权限。`GID` `2210` 拥有 `rwx`，但掩码将有效权限限制为 `rw`。\n\n### 掩码条目：\n```\n\
  mask::rw-\n```\n掩码设置显示了所有命名用户、组所有者和命名组可能的最大权限。`UID` `1005`、`operators` 和 `GID` `2210`\
  \ 无法执行此文件，尽管每个条目都设置了执行权限。\n\n### 其他条目：\n```\nother::---\n```\n其他或“世界”权限。所有其他 UID\
  \ 和 GID 都没有权限。\n\n## 查看目录 ACL\n\n要显示目录上的 ACL 设置，请使用 `getfacl` 目录命令：\n\n```\n[user@host\
  \ content]$ getfacl .\n# file: .\n# owner: user\n# group: operators\n# flags: -s-\n\
  user::rwx\nuser:consultant3:---\nuser:1005:rwx\ngroup::rwx\ngroup:consultant1:r-x\n\
  group:2210:rwx\nmask::rwx\nother::---\ndefault:user::rwx\ndefault:user:consultant3:---\n\
  default:group::rwx\n```\n94\nRH134-RHEL8.0-en-1-20190531\n![](img/00337.jpeg)\n\n\
  第 4 章 | 使用 ACL 控制文件访问\n\n```\ndefault:group:consultant1:r-x\ndefault:mask::rwx\n\
  default:other::---\n```\n\n### 复习上一个示例的每个部分：\n\n#### 打开注释条目：\n```\n# file: .\n#\
  \ owner: user\n# group: operators\n# flags: -s-\n```\n前三行是注释，用于识别目录名、所有者（`user`）和组组（`operators`）。如果有额外的目录标志（setuid,\
  \ setgid, sticky），则第四行注释将显示设置了哪些标志；在此例中，为 `setgid`。\n\n#### 标准 ACL 条目：\n```\nuser::rwx\n\
  user:consultant3:---\nuser:1005:rwx\ngroup::rwx\ngroup:consultant1:r-x\ngroup:2210:rwx\n\
  mask::rwx\nother::---\n```\n此目录上的 ACL 权限与之前显示的文件示例相同，但适用于目录。关键区别在于在这些条目中包含了执行权限（在适当的情况下），以允许目录搜索权限。\n\
  \n#### 默认用户条目：\n```\ndefault:user::rwx\ndefault:user:consultant3:---\n```\n默认文件所有者\
  \ ACL 权限。文件所有者将获得 `rwx`，对新文件具有读/写权限，对新子目录具有执行权限。\n默认命名用户 ACL 权限。每个命名用户有一个条目，该用户将自动获得应用于新文件或子目录的默认\
  \ ACL。`consultant3` 始终没有权限。\n\n#### 默认组条目：\n```\ndefault:group::rwx\ndefault:group:consultant1:r-x\n\
  ```\n默认组所有者 ACL 权限。文件组所有者将获得 `rwx`，对新文件具有读/写权限，对新子目录具有执行权限。\n\n95\nRH134-RHEL8.0-en-1-20190531\n\
  ![](img/096.jpeg)\n第 4 章 | 使用 ACL 控制文件访问\n\n默认命名组 ACL 权限。每个命名组有一个条目，该组将自动获得应用于新文件或子目录的默认\
  \ ACL。新文件具有 `rx` 读/写权限，对新子目录具有执行权限。\n\n#### 默认掩码条目：\n```\ndefault:mask::rwx\n```\n\
  默认掩码设置显示了所有命名用户、组所有者和命名组可能的最大权限。\n\n#### 默认其他条目：\n```\ndefault:other::---\n```\n\
  默认其他或“世界”权限。所有其他 UID 和 GID 都没有权限。\n\n\n\n\n\n在接下来的示例中，你可以看到用户有一个具有 `rw` 权限的 ACL\
  \ 条目应用于 `/dev/sr0` 设备，这是一个 CD/DVD 驱动器。\n\n```bash\n[user@host ]$ getfacl /dev/sr0\n\
  ```\n\ngetfacl: 从绝对路径名中删除前面的 `/`\n\n```text\n# file: dev/sr0\n# owner: root\n# group:\
  \ cdrom\nuser::rw-\nuser:group:rw-\ngroup::rw-\nmask::rw-\nother::---\n```\n\n###\
  \ 参考文献\n`acl(5)`, `getfacl(1)`, `journald.conf(5)`, `ls(1)`, `systemd-journald(8)`\
  \ 和 `systemd-udevd(8)` 手册页。\n\n98\nRH134-RHEL8.0-en-1-20190531\n![](img/00384.jpeg)\n\
