  \ 网站或通过复制并编辑 `/root/anaconda-ks.cfg` 创建 Kickstart 文件。\n- `virt` Yum 模块为 RHEL 系统成为虚拟化主机提供了所需的包。\n\
  - `cockpit-machines` 包为 Cockpit 添加了虚拟机菜单。\n\n---\n\n# 第 13 章：综合回顾\n\n### 目标\n回顾\
  \ Red Hat System Administration II（红帽系统管理二）中的任务。\n\n### 学习目标\n- 回顾 Red Hat System\
  \ Administration II 中的任务。\n\n## 章节\n- 综合回顾\n- 实验\n    - 实验：修复启动问题和维护服务器\n    - 实验：配置和管理文件系统与存储\n\
  \    - 实验：配置和管理服务器安全\n\n## 综合回顾\n### 学习目标\n完成本节后，你应该已经回顾并刷新了在 Red Hat System Administration\
  \ II 中学习的知识和技能。\n\n### 回顾 RED HAT SYSTEM ADMINISTRATION II\n在开始本课程的综合回顾之前，你应该对每个章节涵盖的主题非常熟悉。你可以参考教科书中之前的章节进行额外学习。\n\
  \n#### 第 1 章，提高命令行效率\n通过使用 Bash 壳 的高级功能、shell 脚本以及 Red Hat Enterprise Linux 提供的各种工具，更高效地运行命令。\n\
  - 通过编写简单的 shell 脚本自动化命令序列。\n- 使用 `for` 循环和条件判断，在脚本或命令行中对项目列表高效地运行命令。\n- 使用 `grep`\
  \ 命令和正则表达式在日志文件和命令输出中查找匹配模式的文本。\n\n#### 第 2 章，调度未来任务\n调度在未来某个自动执行的任务。\n- 设置一个在未来某个时间点运行一次的命令。\n\
  - 使用用户的 `crontab` 文件调度按周期循环运行的命令。\n- 使用系统 `crontab` 文件和目录调度按周期循环运行的命令。\n- 启用和禁用\
  \ `systemd` 定器，并配置一个管理临时文件的定时器。\n\n#### 第 3 章，调优系统性能\n通过设置调优参数和调整进程优先级来提高系统性能。\n\
  - 通过选择由 `tuned` 守护进程管理的调优配置文件来优化系统性能。\n- 使用 `nice` 和 `renice` 命令对特定进程设置优先级或降低优先级。\n\
  \n#### 第 4 章，使用 ACL 控制文件访问\n解释并设置文件上的访问控制列表 (ACL)，以处理需要复杂用户和组访问权限的情况。\n- 描述 ACL\
  \ 的用例，识别设置了 ACL 的，并解释这些 ACL 的影响。\n- 在文件上设置和删除 ACL，并定义目录在新建创建的文件上自动设置的默认 ACL。\n\n\
  #### 第 5 章，管理 SELinux 安全\n使用 SELinux 保护和管理服务器安全。\n- 描述 SELinux 如何保护资源以及如何选择强制模式。\n\
  - 配置文件的 SELinux 上文，以控制进程如何与该文件交互。\n- 配置 SELinux 布尔值，以允许根据不同的访问需求更改运行时策略。\n- 调查 SELinux\
  \ 日志消息并排查 SELinux AVC 拒绝问题。\n\n#### 第 6 章，管理基础存储\n从命令行创建和管理存储设备、分区、文件系统和交换空间。\n\
  - 创建存储分区，格式化为文件系统并挂载使用。\n- 创建并管理交换空间以补充物理内存。\n\n#### 第 7 章，管理逻辑卷\n从命令行创建和管理包含文件系统和交换空间的逻辑卷。\n\
  - 从存储设备创建并管理逻辑卷，并将其格式化为文件系统或准备交换空间。\n- 添加和移除分配给卷组的存储，并无破坏地扩展已格式化为文件系统的逻辑卷的大小。\n\n\
  \n\n\n\n# 第 8 章，实现高级存储功能\n使用 Stratis 本地存储系统管理存储，并使用 VDO 卷优化使用的存储空间。\n\n- 使用 Stratis\
  \ 本地存储管理管理多个存储层。\n- 通过使用 VDO 对存储设备上的数据进行压缩和去重，优化存储空间的使用。\n\n# 第 9 章，访问网络附属存储\n使用\
  \ NFS 协议访问网络存储。\n\n- 从命令行和在启动时挂载、使用和卸载 NFS 导出。\n- 配置具有直接和间接映射的自动挂载器，以根据需要自动挂载 NFS\
  \ 文件系统，并在不再使用时卸载。\n- 使用新的 `nfsconf` 工具配置 NFS 客户端使用 NFSv4。\n\n# 第 10 章，控制启动过程\n管理启动过程以控制提供的服务，并对问题进行诊断和修复。\n\
  - 描述 Red Hat Enterprise Linux 启动过程，设置启动时使用的默认目标，并将系统引导到非默认目标。\n- 登录系统并在当前 root 密码丢失时更改\
  \ root 密码。\n- 手动修复导致启动进程的文件系统配置或损坏问题。\n\n# 第 11 章，管理网络安全\n使用系统防火墙和 SELinux 规则控制服务的网络连接。\n\
  - 使用 `firewalld` 规则接受或拒绝系统服务的网络连接。\n- 通过管理 SELinux 端口标签控制网络服务可以使用特定的网络端口。\n\n# 第\
  \ 12 章，安装 Red Hat Enterprise Linux\n在服务器和虚拟机上安装 Red Hat Enterprise Linux。\n- 在服务器上安装\
  \ Red Hat Enterprise Linux。\n- 使用 Kickstart 自动化安装过程。\n- 使用 `Cockpit` 在你的 Red Hat\
  \ Enterprise Linux 服务器上安装虚拟机。\n\n### 实验：修复启动问题和维护服务器\n在本次回顾中，你将诊断并修复启动问题，并更新系统默认目标。你还将安排任务以普通用户身份按循环计划运行。\n\
  \n## 学习成果\n你应该能够：\n- 诊断问题并从紧急模式恢复系统。\n- 将默认目标从 `graphical.target` 更改为 `multi-user.target`。\n\
  - 调度以普通用户运行的循环任务。\n\n## 开始之前\n在重置之前，将任何想要保留的文件或工作内容复制到其他系统。现在重置 `workstation`、`servera`\
  \ 和 `serverb` 系统。\n\n使用密码 `student` 以 `student` 用户身份登录 `workstation`。\n\n在 `workstation`\
  \ 上，运行 `lab rhcsa-compreview1 start` 开始综合回顾。该脚本创建必要的文件以正确设置环境。\n\n```bash\n[student@workstation\
  \ ~]$ lab rhcsa-compreview1 start\n```\n\n## 操作说明\n在 `serverb` 上执行以下任务完成综合回顾：\n\n\
  - 在 `workstation` 上，运行 `lab rhcsa-compreview1 break1` 命令。此中断脚本会导致 `serverb` 启动过程失败。它还在\
  \ `GRUB2` 菜单上设置了更长的超时以帮助中断启动过程，并重启 `serverb`。\n诊断可能的原因并修复启动故障。修复必须确保 `serverb` 在无需干预的情况下重启。需要时，使用\
  \ `redhat` 作为超级用户的密码。\n\n- 在 `workstation` 上，运行 `lab rhcsa-compreview1 break2` 命令。此中断脚本会导致\
  \ `serverb` 默认目标从 `multi-user` 目标切换到 `graphical` 目标。它还为 `GRUB2` 菜单设置了更长的超时以帮助中断启动过程，并重启\
  \ `serverb`。\n在 `serverb` 上，修复默认目标使用 `multi-user` 目标。默认目标设置在重启后必须无需人工干预即可持续。\n\n\
  使用 `student` 用户（密码为 `student`）通过 `sudo` 命令执行特权命令。\n\n- 以 `student` 用户身份调度一个循环任务，在除周六和周日以外的所有每天晚上\
  \ 7 点到 9 点之间每小时执行一次 `/home/student/backup-home.sh` 脚本。\n从 `http://materials.example.com/labs/backup-home.sh`\
  \ 下载备份脚本。\n\n`backup-home.sh` 备份脚本会将 `serverb` 的 `/home/student` 目录备份到 `servera`\
