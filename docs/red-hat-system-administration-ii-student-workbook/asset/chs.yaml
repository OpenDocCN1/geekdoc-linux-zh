  # 第 5 章 | 管理 SELinux 安全\n\n安全增强 Linux (`SELinux`) 是系统安全的一个额外层。`SELinux` 的首要目标是保护用户数据免受已受攻击的系统服务的侵害。大多数\
  \ Linux 管理员熟悉标准的的用户/组/其他权限安全模型。这是一种基于用户和组的模型，被称为自主访问控制（DAC）。`SELinux` 提供了一个额外的安全层，它是基于对象的并由更复杂的规则控制的，被称为强制性访问控制（MAC）。\n\
  \n为了允许远程匿名访问 Web 服务器，必须打开防火墙端口。然而，这为恶意人员提供了通过安全漏洞破解系统的机会。如果他们成功攻破 Web 服务器进程，就会获得其权限。具体来说，就是\
  \ `apache` 用户和 `apache` 组的权限。该用户和组对文档根目录 `/var/www/html` 读取权限。它还可以访问 `/tmp`、`/var/tmp`\
  \ 以及任何世界可写的文件和目录。\n\n`SELinux` 是一组安全规则，决定了哪个进程可以访问哪些文件、目录和端口。每个文件、进程、目录和端口都有一个特殊的安全标签，称为\
  \ `SELinux` 上下文。上下文是 `SELinux` 策略用于判断进程是否可以访问文件、目录或端口的名称。默认情况下，除非显式规则允许访问，否则策略不允许任何交互。如果没有允许规则（allow\
  \ rule），则不允许访问。\n\n`SELinux` 标签有几种上下文：用户（user）、角色（role）、类型（type）和敏感性（sensitivity）。目标策略（targeted\
  \ policy）是 Red Hat Enterprise Linux 中启用的默认策略，它的规则基于第三种上下文：类型上下文。类型上下文的名称通常以 `_t`\
  \ 结尾。\n\n图 5.1：SELinux 文件上下文\n\nWeb 服务器的类型上下文为 `httpd_t`。通常在 `/var/www/html` 中找到的文件和目录的类型上下文为\
  \ `httpd_sys_content_t`。通常在 `/tmp` 和 `/var/tmp` 中找到的文件和目录的上下文为 `tmp_t`。Web 服务器端口的类型上下文为\
  \ `http_port_t`。\n\nApache 的类型上下文为 `httpd_t`。策略中有一个规则允许 Apache 访问具有 `httpd_sys_content_t`\
  \ 类型上下文的文件和目录。默认情况下，在 `/var/www/html` 和其他 Web 服务器目录下发现的文件具有 `httpd_sys_content_t`\
  \ 类型上下文。\n\n策略中对于通常在 `/tmp` 和 `/var/tmp` 中找到的文件没有允许规则，因此不允许访问。在启用 `SELinux` 的情况下，攻破了\
  \ Web 服务器进程的恶意用户无法访问 `/tmp` 目录。\n\nMariaDB 服务器的类型上下文为 `mysqld_t`。默认情况下，在 `/data/mysql`\
  \ 中找到的文件具有 `mysqld_db_t` 类型上下文。这种类型上下文允许 MariaDB 访问这些文件，但禁用了其他服务（如 Apache Web 服务）的访问。\n\
  \n`RH134-RHEL8.0-en-20190531`\n\n123\n\n![](img/00258.jpeg)\n\n# 第 5 章 | 管理 SELinux\
