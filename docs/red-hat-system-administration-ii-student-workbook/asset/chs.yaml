  \n# 第 9 章 | 访问网络附属存储\n\n## 引导练习：使用 NFS 管理网络附属存储\n\n### 性能检查清单\n\n在此练习中，你将修改 `/etc/fstab`\
  \ 文件，以便在启动时持久挂载 NFS 导出。\n\n#### 结果\n\n你应该能够：\n* 使用 `mount` 命令测试 NFS 服务器。\n* 在 `/etc/fstab`\
  \ 配置文件中配置 NFS 共享，以便在系统重启后仍保存更改。\n* 使用新的 `nfsconf` 工具配置 NFS 客户端使用 NFSv4。\n\n## 在开始之前\n\
  \n使用密码 `student` 以 `student` 身份登录工作站。\n\n在工作站上，运行 `lab netstorage-nfs start` 命令。该命令运行一个启动脚本，判断\
  \ servera 和 serverb 机器在网络上是否可访问。如果它们不可用，脚本将提示你。启动脚本会将 serverb 配置为 NFSv4 服务器，设置权限并导出目录。它会在\
  \ servera 和 serverb 上创建所需的 little 和用户组。\n\n```bash\n[student@workstation ~]$ lab\
  \ netstorage-nfs start\n```\n\n一家运输公司使用中央服务器 serverb 来托管许多共享文档和目录。servera 上的用户（均为\
  \ `admin` 组的成员）需要访问持久挂载的 NFS 共享。\n\n**重要信息：**\n* serverb 共享 `/shares/public` 目录，该目录包含一些文本文件。\n\
  * `admin` 组的成员（`admin1`, `sysmanager1`）对 `/shares/public` 共享目录具有读写权限。\n* servera\
  \ 的主挂载点为 `/public`。\n* 所有用户密码均设置为 `redhat`。\n\n### 1. 以 `student` 用户登录 servera 并切换到\
  \ root 用户。\n\n#### 1.1. 以 `student` 用户登录 servera。\n\n263\nRH134-RHEL8.0-en-20190531\n\
  ![](img/00236.jpeg)\n# 第 9 章 | 访问网络附属存储\n\n```bash\n[student@workstation ~]$ ssh\
  \ student@servera\n...输出省略...\n[student@servera ~]$\n```\n\n#### 1.2. 使用 `sudo -i`\
  \ 命令切换到 root 用户。`student` 用户的密码为 `student`。\n\n```bash\n[student@servera ~]$ sudo\
  \ -i\n[sudo] password for student: student\n[root@servera ~]#\n```\n\n### 2. 使用\
  \ `nfsconf` 工具配置 /etc/nfs.conf，使 NFS 客户端仅在版本 4.X 中工作，并确保启用 TCP 模式且禁用 UDP 模式。\n\n\
  #### 2.1. 使用 `nfsconf` 工具禁用 `udp`, `vers2`, `vers3`。\n\n```bash\n[root@servera ~]#\
  \ nfsconf --set nfsd udp n\n[root@servera ~]# nfsconf --set nfsd vers2 n\n[root@servera\
