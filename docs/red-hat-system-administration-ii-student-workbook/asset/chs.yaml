  ![](img/00282.jpeg)\n\n# 第 4 章 | 使用 ACL 控制文件访问\n\n## 使用 ACL 保护文件\n### 目标\n完成本节后，你应该能够：\n\
  - 使用 `setfacl` 修改普通 ACL 文件权限。\n- 控制新文件和目录的默认 ACL 文件权限。\n\n## 修改 ACL 文件权限\n使用 `setfacl`\
  \ 在文件和目录上添加、修改或删除标准 ACL。ACL 使用普通文件系统的权限表示，`\"r\"` 表示读取。\n\n[content]\n(注：由于提供的原始文本在后续部分存在大量重复内容，根据指令“不要重复输出原文”的要求，我将为您提供剩余非重复部分的翻译：)\n\
  \n原文中的 `QUIZ: INTERPRETING FILE ACLS` 和 `SOLUTION: INTERPRETING FILE ACLS` 表格内容翻译如下：\n\
  \n| ACL 操作 | 描述 |\n| :--- | :--- |\n`default:m::rx /directory` | 将读取和执行权限设置为默认掩码。\n\
  `default:user:mary:rx /directory` | 授予命名用户新文件的初始读取权限，以及对新子目录的读取和执行权限。\n`g::rw /directory`\
  \ | 授予目录组所有者目录的读写权限。\n`g::rw file` | 授予文件组所有者文件的读写权限。\n`getfacl /directory` | 显示目录上的\
  \ ACL。\n`group:hug:rwx /directory` | 授予命名组目录的读、写和执行权限。\n`user::rx file` | 文件所有者对文件拥有读取和执行权限。\n\
  `user:mary:rx file` | 命名用户对文件拥有读取和执行权限。\n\n\n\n\n\n在对目录设置 ACL 时，使用 `-R` 选项递归应用 ACL。请记住，你可能希望在递归操作时使用\
  \ `\"X\"`（大写 X）权限，这样设置了执行权限的文件将保留该设置，而目录将设置执行权限以允许目录搜索。在非递归地设置 ACL 时，同样使用大写 `\"\
  X\"` 被认为是一种良好的做法，因为可以防止管理员无意向普通文件添加执行权限。\n\n```bash\n[user@host ~]$ setfacl -R -m\
  \ u:name:rX directory\n```\n这会将用户 `name` 添加到目录 `directory` 及其所有现有文件和子目录，并设置只读和条件执行权限。\n\
  \n### 删除 ACL\n\n删除特定的 ACL 条目的基本格式与修改操作相同，不同之处在于不指定 `\":perms\"`。\n\n```bash\n[user@host\
  \ ~]$ setfacl -x u:name,g:name file\n```\n这仅从 `file` 或 `directory` 的 ACL 中移除指定的用户和指定的组。任何其他存在的\
  \ ACL 条目仍将保持激活状态。\n\n你可以在同一个 `setfacl` 操作中同时包含删除 (`-x`) 和修改 (`-m`) 操作。\n\n只有在没有设置其他\
  \ ACL 的情况下（排除无法删除的基础 ACL）才能删除掩码（mask），因此必须在最后删除。该文件将不再拥有任何 ACL，`ls -l` 将不会在权限字符串旁边显示加号\
  \ (`+`)。或者，若要删除文件或目录上的所有 ACL 条目（包括目录上的默认 ACL），使用以下命令：\n\n```bash\n[user@host ~]$\
  \ setfacl -b file\n```\n\n### 默认 ACL 文件权限\n\n为了确保在目录内创建的文件和目录继承某些 ACL，请对目录使用默认 ACL。你可以设置默认\
  \ ACL 以及任何标准 ACL 设置，包括默认掩码。\n\n目录本身仍然需要标准 ACL 来进行访问控制，因为默认 ACL 并不实现目录的访问控制；它们仅提供\
  \ ACL 权限继承支持。例如：\n\nRH134-RHEL8.0-en-1-20190531\n103\n\n![](img/00065.jpeg)\n\n\
  第 4 章 | 使用 ACL 控制文件访问\n\n```bash\n[user@host ~]$ setfacl -m d:u:name:rx directory\n\
  ```\n这添加了一个默认指定用户 (`d:u:name`)，具有只读权限和对子目录的执行权限。\n\n为每种 ACL 类型添加默认 ACL 的 `setfacl`\
  \ 命令与标准 ACL 完全相同，但在前面加上了 `d:`。或者，也可以在命令行上使用 `-d` 选项。\n\n#### 重要提示\n在目录上设置默认 ACL\
  \ 时，请确保通过在默认 ACL 中包含执行权限，使用户能够访问在其中创建的新子目录的内容。\n\n用户不会自动获得新创建的普通文件的执行权限设置，因为与新目录不同，新普通文件的\
  \ ACL 掩码为 `rw-`。\n\n### 注意\n新文件和新子目录继续从创建它的用户处设置其所有者 UID 和主组 GID 值，除非父目录启用了 `setgid`\
  \ 标志，在这种情况下，主组 GID 与父目录的 GID 相同。\n\n### 删除默认 ACL 条目\n\n以删除标准 ACL 的相同方式删除默认 ACL，在前面加上\
  \ `d:`，或使用 `-d` 选项。\n\n```bash\n[user@host ~]$ setfacl -x d:u:name directory\n```\n\
  这删除了上一个示例中添加的默认 ACL 条目。\n\n要删除目录上的所有默认 ACL 条目，使用 `setfacl -k directory`。\n\n###\
  \ 参考文献\n`acl(5)`、`setfacl(1)` 和 `getfacl(1)` 手页\n\n104\nRH134-RHEL8.0-en-20190531\n\
