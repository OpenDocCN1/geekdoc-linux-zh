  \ ~]$ lab-stratis finish\n```\n实验结束。\n\n---\n\n### 使用 VDO 进行存储压缩和去重\n\n### 目标\n\
  完成本节后，你将能够使用 VDO 对存储进行压缩和去重。\n\n## 虚拟数据优化器\nRed Hat Enterprise Linux 8 包含了虚拟数据优化器\
  \ (VDO)，它可以优化数据空间。VDO 是一种增加数据吐量的设备映射驱动。VDO 包含两个内核模块：用于透明控制压缩的 `kvdo` 和用于去重的 `uds`。\n\
  \nVDO 层放置在现有的块设备之上，例如 RAID 设备或本地磁盘。这些块设备也可以是加密设备。存储层（如 LVM 逻辑卷和文件系统）放置在 VDO 设备之上。\n\
  \nVDO 按照顺序对数据进行三个阶段的处理以减少空间占用：\n\n1. **零块消除**过滤掉仅包含零（0）的数据块，仅在元数据中记录这些块的信息。非零数据块将被传递到下一个阶段。此阶段实现了\
  \ VDO 设备的精简配置功能。\n2. **去重**消除冗余数据块。当你创建相同数据的多个副本时，VDO 会检测到重复数据块并更新元数据，将其作为原始数据的引用，而不是创建冗余数据。通用去重服务\
  \ (`uds`) 内核模块通过其维护的元数据检查冗余。该内核模块作为 VDO 的一部分发布。\n3. **压缩**是最后一个阶段。`kvdo` 内核模块使用\
  \ LZ4 压缩数据块，并按 4 KB 块进行分组。\n\n\n\n\n\n由于 `VDO` 卷是精简配置的（thinly provisioned），用户只能看到正在使用的逻辑空间，而无法感知实际可用的物理空间。如果你在创建卷时没有指定逻辑大小，`VDO`\
  \ 将将实际物理大小视为该卷的逻辑大小。这种逻辑大小与物理大小的 1:1 映射比例提供了更好的性能，但对存储空间的利用效率较低。根据您的基础设施需求，您应该优先考虑性能或空间效率。\n\
  \n当 `VDO` 卷的逻辑大小大于实际物理大时，您应该主动监控卷统计信息，使用 `vdostats --verbose` 命令查看实际使用情况。\n\n##\
  \ 启用 VDO\n\n安装 `vdo` 和 `kmod-kvdo` 包以在系统中启用 `VDO`。\n\n```bash\n[root@host ~]# yum\
  \ install vdo kmod-kvdo\n...output omitted...\n\nIs this ok [y/N]: y\n\n...output\
  \ omitted...\n\nComplete!\n```\n\n## 创建 VDO 卷\n\n要创建一个 `VDO` 卷，请运行 `vdo create`\
  \ 命令。\n\n```bash\n[root@host ~]# vdo create --name=vdo1 --device= /dev/vdd --vdoLogicalSize=\
  \ 50 G\n...output omitted...\n```\n\n如果省略了逻辑大小，生成的 `VDO` 卷将与其物理设备具有相同。\n\n当 `VDO`\
  \ 卷就绪后，您可以使用选择的文件系统类型对其进行格式化，并将其挂载到系统的文件系统层次下。\n\n## 分析 VDO 卷\n\n要分析 `VDO` 卷，请运行\
  \ `vdo status` 命令。该命令以 YAML 格式显示 `VDO` 系统的报告以及 `VDO` 卷的状态。它还会显示 `VDO` 卷的属性。使用 `--name=`\
  \ 选项指定特定卷的名称。如果省略特定卷名称，`vdo status` 命令的输出将显示所有 `VDO` 卷的状态。\n\n```bash\n[root@host\
  \ ~]# vdo status --name=vdo1\n...output omitted...\n\n238\n\nRH134-RHEL8.0-en-1-20190531\n\
  \n![](img/00043.jpeg)\n```\n\n第 8 章 | 实现高级存储功能 `vdo list` 命令显示当前已启动的 `VDO` 卷列表。您可以分别使用\
  \ `vdo start` 和 `vdo stop` 命令启动和停止 `VDO` 卷。\n\n### 参考文献\n\n有关更多信息，请参阅《Red Hat Enterprise\
  \ Linux 8 存储去重与压缩指南》中的“开始使用 VDO”章节，网址为：https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html-single/deduplicating_and_compressing_storage/\n\
