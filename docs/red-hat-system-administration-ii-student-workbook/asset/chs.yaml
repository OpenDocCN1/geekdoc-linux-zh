  ![](img/00167.jpeg)\n\n# 第 11 章 | 管理网络安全\n\n图 11.3：Web 控制台防火墙允许服务列表。添加服务页面显示了可用的预定义服务。\n\
  \n图 11.4：Web 控制台添加服务界面\n\n要选择服务，请滚动列表或在“过滤服务”（Filter Services）文本框中输入选择。在接下来的示例中，在搜索文本框中输入字符串\
