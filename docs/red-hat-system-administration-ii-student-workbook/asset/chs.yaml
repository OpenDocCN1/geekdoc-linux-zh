  \ ~]$ ssh student@servera\n...output omitted...\n[student@servera ~]$\n```\n\n##\
  \ 2\n验证 `tuned` 包是否已安装、启用并启动。\n\n### 2.1\n使用 `yum` 确认 `tuned` 包是否已安装。\n\n```bash\n\
  [student@servera ~]$ yum list tuned\n...output omitted...\nInstalled Packages\n\
  tuned.noarch 2.10.0-15.el8\n@anaconda\n```\n\n### 2.2\n`systemctl is-enabled tuned;\
  \ systemctl is-active tuned` 命令显示其启用和运行状态。\n\n```bash\n[student@servera ~]$ systemctl\
  \ is-enabled tuned; systemctl is-active tuned\nenabled\nactive\n```\n\n## 3\n列出可用的调优配置并识别活动配置。如果\
  \ `sudo` 提示密码，请在提示后输入 `student`。\n\n```bash\n[student@servera ~]$ sudo tuned-adm\
  \ list\n[sudo] password for student: student\nAvailable profiles:\n- balanced\n\
  - desktop\n- latency-performance\n- network-latency\n- network-throughput\n- powersave\n\
  - sap\n- throughput-performance\n- virtual-guest\n- virtual-host\nCurrent active\
  \ profile: virtual-guest\n```\n\n## 4\n将当前活动配置更改为 `powersave`，然后确认结果。如果 `sudo` 提示密码，请在提示后输入\
  \ `student`。\n\n### 4.1\n更改当前的活动调优配置。\n\n```bash\n[student@servera ~]$ sudo tuned-adm\
  \ profile powersave\n```\n\n### 4.2\n确认 `powersave` 是活动配置。\n\n```bash\n[student@servera\
  \ ~]$ sudo tuned-adm active\nCurrent active profile: powersave\n```\n\n## 5\n退出\
  \ `servera`。\n\n```bash\n[student@servera ~]$ exit\nlogout\nConnection to servera\
  \ closed.\n[student@workstation ~]$\n```\n\n### 完成\n在工作站上运行 `lab tuning-profiles\
  \ finish` 脚本完成此练习。\n\n```bash\n[student@workstation ~]$ lab tuning-profiles finish\n\
  ```\n\n\n\n\n\n完成本节内容后，你应该能够使用 `nice` 和 `renice` 命令对特定进程进行优先级排序或取消优先级。\n\n# LINUX\
  \ 进程调度与多任务处理\n\n现代计算机系统的跨度极广，从低端系统（任何时刻只能执行单条指令的单 CPU 系统）到高性能超级计算机，后者每个拥有数百个 CPU，且每个\
  \ CPU 都有几十个甚至上百个处理核心，从而允许并行执行海量的指令。所有这些系统都有一个共同点：需要运行的进程线程数量比它们的 CPU 数量多。\n\nLinux\
  \ 和其他操作系统使用称为“时间分片”（time-slicing）或“多任务”的技术来运行比处理单元更多的进程。操作系统的进程调度器在单个内核上于进程之间快速切换，产生多个进程同时运行的错觉。\n\
  \n# 相对优先级\n\n不同的进程具有不同的重要性级别。进程调度器可以配置为不同的进程使用不同的调度策略。普通系统上运行的大多数进程使用的调度策略被称为 `SCHED_OTHER`（也称为\
  \ `SCHED_NORMAL`），但对于各种工作负载需求也存在其他策略。\n\n由于并非所有进程都同等重要，使用 `SCHED_NORMAL` 策略运行的进程可以赋予相对优先级。这种优先级被称为进程的\
  \ `nice` 值，对于任何进程都被组织为 40 个不同的“谦性”（niceness）级别。\n\nnice 值范围从 -20（最高优先级）到 19（最低优先级）。默认情况下，进程继承其父进程的\
  \ nice 级别，通常为 0。nice 值越高表示优先级越低（该进程更容易放弃 CPU 使用），而 nice 值越低表示优先级越高（进程越倾向于保留 CPU）。如果不存在资源竞争（例如当活动进程数少于可用\
  \ CPU 核心数时），即使是 nice 值较高的进程也会使用它们能获得的所有可用 CPU 资源。然而，当请求 CPU 时间的进程超过可用核心数时，nice 值较高的进程接收到的\
  \ CPU 时间将比 nice 值较低的进程少。\n\n# 设置 nice 级别与权限\n\n由于对 CPU 密集型进程设置低 nice 级别可能会负面影响同一系统上运行的其他进程的性能，因此只有\
  \ root 用户可以降低进程的 nice 值。\n\n非特权用户仅允许增加其自身进程的 nice 值。他们不能降低自己进程的 nice 值，也无法修改其他用户进程的\
  \ nice 值。\n\nRH134-RHEL8.0-en-20190531\n77\n\n![](img/00089.jpeg)\n![](img/00480.jpeg)\n\
  \n第 3 章 | 调整系统性能\n\n# 显示 nice 级别\n\n若干工具可以显示运行进程的 nice 级别。进程管理工具（如 `top`）默认显示 nice\
  \ 级别。其他工具（如 `ps` 命令）在使用适当选项时会显示 nice 级别。\n\n## 使用 top 显示 nice 级别\n\n使用 `top` 命令交互式查看和管理进程。默认配置显示了关于\
  \ nice 级别和优先级的两列。`NI` 列显示进程的 nice 值，`PR` 列显示其调度优先级。在 `top` 界面中，nice 级别映射到如下图所示的内部系统优先级队列。例如，nice\
  \ 级别 -20 映射到 `PR` 列中的 0。nice 级别 19 映射到 `PR` 列中的优先级 39。\n\n图 3.5：top 报告的 nice 级别\n\
  \n## 从命令行显示 nice 级别\n\n`ps` 命令可以显示进程 nice 级别，但只有包含正确的格式选项时才。\n\n以下 `ps` 命令列出了所有进程及其\
  \ `PID`、进程名、nice 级别和调度类，并按 nice 值降序排序。在 `CLS` 调度类列中显示 `TS` 的进程在 `SCHED_NORMAL` 调度策略下运行。nice\
  \ 级别显示为折号 (-) 的进程在其他调度策略下运行，并被调度器解释为高优先级。其他调度策略的细节超出了本课程范围。\n\n```bash\n[user@host\
  \ ~]$ ps axo pid,comm,nice,cls --sort=-nice\n\nPID COMMAND NI CLS\n30 khugepaged\
  \ 19 TS\n29 ksmd 5 TS\n1 systemd 0 TS\n2 kthreadd 0 TS\n9 ksoftirqd/0 0 TS\n10 rcu_sched\
  \ 0 TS\n11 migration/0 - FF\n12 watchdog/0 - FF\n...输出已省略...\n```\n\n# 以不同的 nice\
  \ 级别启动进程\n\n在进程创建期间，进程会继承其父进程的 nice 级别。当从命令行启动进程时，它将继承启动它的 shell 进程的 nice 级别。通常，这会导致新进程以\
  \ nice 级别 0 运行。\n\n以下示例从 shell 启动进程，并显示进程的 nice 值。注意在 `ps` 中使用了 `PID` 选项来指定请求的输出。\n\
  \nRH134-RHEL8.0-en-20190531\n![](img/00119.jpeg)\n第 3 章 | 调整系统性能\n\n```bash\n[user@host\
  \ ~]$ sha1sum /dev/zero &\n[1] 3480\n[user@host ~]$ ps -o pid,comm,nice 3480\nPID\
  \ COMMAND NI\n3480 sha1sum 0\n```\n\n所有用户都可以使用 `nice` 命令以默认或更高的 nice 级别启动命令。\n\n\
  不带选项时，`nice` 命令以默认 nice 级别启动命令。\n\n以下示例显示从 shell 启动一个进程：\n\n```bash\n[user@host\
  \ ~]$ sha1sum /dev/zero &\n[1] 3480\n[user@host ~]$ ps -o pid,comm,nice 3480\nPID\
  \ COMMAND NI\n3480 sha1sum 0\n```\n\n使用 `-n` 选项应用用户定义的 nice 级别。默认是增加 10。以下示例以指定的\
  \ nice 级别启动后台任务：\n\n```bash\n[user@host ~]$ nice -n 15 sha1sum &\n[1] 3521\n[user@host\
  \ ~]$ ps -o pid,comm,nice 3521\nPID COMMAND NI\n3521 sha1sum 0\n```\n\n# 修改现有进程的\
  \ nice 级别\n\n可以使用 `renice` 命令更改现有进程的 nice 级别。此示例使用上一个示例中的 `PID` 将 15 改为 19。\n\n\
  ```bash\n[user@host ~]$ renice -n 19 3521\n3521 (进程 ID) 旧优先级 15，新优先级 19\n```\n\n\
  还可以使用 `top` 命令更改进程的 nice 级别。在 `top` 界面中，按下 `r` 选项进入 `renice` 命令，然后输入要更改的 `PID` 和新的\
  \ nice 级别。\n\nRH134-RHEL8.0-en-20190531\n79\n![](img/00418.jpeg)\n第 3 章 | 调整系统性能\n\
  \n### 参考文献\n\n`nice(1)`, `renice(1)`, `top(1)` 和 `sched_setscheduler(2)` 手册页。\n\n\
  80\nRH134-RHEL8.0-en-20190531\n![](img/00233.jpeg)\n第 3 章 | 调整系统性能\n\n# 引导练习\n\n\
  # 影响进程调度\n\n在此练习中，你将使用 `nice` 和 `renice` 命令调整进程的调度优先级，并观察这对进程执行的影响。\n\n#### 结果\n\
  \n你应该能够调整进程的优先级。\n\n#### 准备工作\n\n以 `student` 用户身份登录 workstation，密码为 `student`。\n\
  \n在 workstation 上运行 `lab tuning-procscheduling start` 命令。该命令运行一个启动脚本以确定 `servera`\
  \ 主机在网络上是否可用。\n\n```bash\n[student@workstation ~]$ lab tuning-procscheduling start\n\
  1.\n```\n\n\n\n\n\n```bash\n[student@workstation ~]$ ssh student@servera\n\n...output\
  \ omitted...\n\n[student@servera ~]$\n```\n\n## 2. 确定 `servera`  CPU 核心数，然后为每个核心启动两个\
  \ `sha1sum /dev/zero &` 命令的实例。\n\n### 2.1. 使用 `grep` 从 `/proc/cpuinfo` 文件解析现有的虚拟处理器（CPU\
  \ 核心）数量。\n\n```bash\n[student@servera ~]$ grep -c '^processor' /proc/cpuinfo\n2\n\
  ```\n\n### 2.2. 使用循环命令启动多个 `sha1sum /dev/zero &` 命令的实例。为上一步找到的每个虚拟处理器启动两个。在本示例中，这将启动四个实例。你输出中的\
  \ `PID` 值将与示例不同。\n\n```bash\n[student@servera ~]$ for i in $(seq 1 4); do sha1sum\
  \ /dev/zero & done\n[1] 2643\n[2] 2644\n[3] 2645\n[4] 2446\n```\n\n## 3. 验证每个 `sha1sum`\
  \ 进程的后台作业都在运行。\n\n```bash\n[student@servera ~]$ jobs\n[1] Running sha1sum /dev/zero\
  \ &\n[2] Running sha1sum /dev/zero &\n[3]- Running sha1sum /dev/zero &\n[4]+ Running\
  \ sha1sum /dev/zero &\n```\n\n## 4. 使用 `ps` 和 `pgrep` 命令显示每个 `sha1sum` 进程的 CPU 占用百分比。\n\
  \n```bash\n[student@servera ~]$ ps u $(pgrep sha1sum)\nUSER PID %CPU %MEM VSZ RSS\
  \ TTY STAT START TIME COMMAND\nstudent 2643 49.8 0.0 228360 1744 pts/0 R 11:15 6:09\
  \ sha1sum /dev/zero\nstudent 2644 49.8 0.0 228360 1780 pts/0 R 11:15 6:09 sha1sum\
  \ /dev/zero\nstudent 2645 49.8 0.0 228360 1748 pts/0 R 11:15 6:09 sha1sum /dev/zero\n\
  student 2646 49.8 0.0 228360 1780 pts/0 R 11:15 6:09 sha1sum /dev/zero\n```\n\n\
  ## 5. 终止所有 `sha1sum` 进程，然后验证没有正在运行的作业。\n\n### 5.1. 使用 `pkill` 命令终止所有名称模式为 `sha1sum`\
  \ 的运行进程。\n\n```bash\n[student@servera ~]$ pkill sha1sum\n[2] Terminated sha1sum\
  \ /dev/zero\n[4]+ Terminated sha1sum /dev/zero\n[1]- Terminated sha1sum /dev/zero\n\
