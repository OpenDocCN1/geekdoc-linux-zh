  # 第 9 章 | 访问网络附属存储\n\n### 3. 使用 servera 作为客户端测试 serverb 上的 NFS\n\n#### 3.1. 在 servera\
  \ 上创建 `/public` 挂载点。\n\n```bash\n[root@servera ~]$ mkdir /public\n```\n\n#### 3.2.\
