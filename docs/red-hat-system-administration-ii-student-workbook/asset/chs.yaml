  \ ExecStart=/usr/sbin/httpd $OPTIONS -DFOREGROUND\n(code=exited, status=1/FAILURE)\n\
  Main PID: 27313 (code=exited, status=1/FAILURE)\nStatus: \"Reading configuration...\"\
  \nApr 15 06:42:41 serverb.lab.example.com systemd[1]: Starting The Apache HTTP Server...\n\
  Apr 15 06:42:41 serverb.lab.example.com httpd[27313]: (13)Permission denied: AH00072:\
  \ make_sock: could not bind to address [::]:30080\nApr 15 06:42:41 serverb.lab.example.com\
  \ httpd[27313]: (13)Permission denied: AH00072: make_sock: could not bind to address\
  \ 0.0.0.0:30080\nApr 15 06:42:41 serverb.lab.example.com httpd[27313]: no listening\
  \ sockets available, shutting down\nApr 15 06:42:41 serverb.lab.example.com httpd[27313]:\
  \ AH00015: Unable to open logs\nApr 15 06:42:41 serverb.lab.example.com systemd[1]:\
  \ httpd.service: Main process exited, code=exited, status=1/FAILURE\nApr 15 06:42:41\
  \ serverb.lab.example.com systemd[1]: httpd.service: Failed with result 'exit-code'.\n\
  Apr 15 06:42:41 serverb.lab.example.com systemd[1]: Failed to start The Apache HTTP\
  \ Server.\n```\n\n注意上述输出中的权限错误，这表明 `httpd` 守护进程未能绑定到端口 `30080/TCP`。SELinux 策略可能是应用程序绑定端口的潜在限制。按\
  \ `q` 退出之前的 `systemctl` 命令。\n\n### 9.3.\n使用 `sealert` 命令确定是否是 SELinux 策略阻止了 `httpd`\
  \ 绑定端口 `30080/TCP`。\n\n```bash\n[root@serverb ~]# sealert -a /var/log/audit/audit.log\n\
  100% done\nfound 1 alerts in /var/log/audit/audit.log\n--------------------------------------------------------------------------------\n\
  SELinux is preventing /usr/sbin/httpd from name_bind access on the tcp_socket port\
  \ 30080\n```\n\n上述日志表明你需要使用：\n`semanage port -a -t PORT_TYPE -p tcp 30080` 来允许 `/usr/sbin/httpd`\
  \ 绑定到此端口，其中 `PORT_TYPE` 是以下类型之一：`http_port_t`, `jboss_port_t`, `messaging_port_t`,\
