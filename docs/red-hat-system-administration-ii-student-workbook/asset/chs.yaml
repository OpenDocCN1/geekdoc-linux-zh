  ![](img/00083.jpeg)\n![](img/00302.jpeg)\n\n## 第 6 章 | 管理基础存储\n\n## 添加分区、文件系统和持久性挂载\n\
  \n### 目标\n\n完成本节后，您应该能够创建存储分区，使用文件系统对其进行格式化，并挂载使用。\n\n### 磁盘分区\n\n磁盘分区允许系统管理员将硬盘划分为多个逻辑存储单元，称为分区。通过将磁盘划分为多个分区，系统管理员可以使用不同的分区执行不同的功能。\n\
  \n例如，在以下情况下，磁盘分区是必要或有益的：\n\n- 限制应用程序或用户的可用空间。\n- 将操作系统和程序文件与用户文件分离。\n- 为内存交换创建一个独立区域。\n\
  - 限制磁盘空间的使用，以提高诊断工具和备份镜像制作的性能。\n\n#### MBR 分区方案\n\n自 1982 年以来，主引导记录（MBR）分区方案决定了运行\
  \ BIOS 固件的系统上如何对磁盘进行分区。该方案最多支持四个主分区。在 Linux 系统上，通过使用扩展分区和逻辑分区，管理员可以创建最多 15 个分区。由于分区大小数据是以\
  \ 32 位值形式存储的，因此使用 MBR 方案分区的磁盘最大磁盘大小和分区大小为 2 TiB。\n\n图 6.1：`/dev/vdb` 存储设备的 MBR 分区。由于物理磁盘变得越来越大，基于\
  \ SAN 的卷甚至更大，MBR 分区方案的 2 TiB 磁盘和分区大小限制不再是一个理论限制，而是系统管理员在生产环境中越来越多遇到的现实世界问题。因此，遗留的\
  \ MBR 方案正在被新的 GUID 分区表（GPT）磁盘分区方案取代。\n\n#### GPT 分区方案\n\n对于运行统一可扩展固件接口（UEFI）固件的系统，GPT\
  \ 是在物理硬盘上布局分区表的标准。GPT 是 UEFI 标准的一部分，解决了旧的基于 MBR 的方案所施加的许多局限性。\n\nGPT 提供最多 128 个分区。与\
  \ MBR 使用 32 位存储逻辑块地址和大小信息不同，GPT 为逻辑块地址分配了 64 位。这使得 GPT 能够容纳高达 8 泽字节（ZiB）或 80 亿太字节（TiB）的分区和磁盘。\n\
  \n除了解决 MBR 分区方案的局限性外，GPT 还提供了一些额外的功能和优势。GPT 使用全局唯一标识（GUID）来识别每个磁盘和分区。与具有单点故障的 MBR\
  \ 相比，GPT 提供了分区表信息的冗余。主 GPT 位于磁盘头部，而备份副本（次级 GPT）存储在磁盘末尾。GPT 使用校验和来检测 GPT 头部和分区表中的错误和损坏。\n\
  \n图 6.2：`/dev/vdb` 存储设备的 GPT 分区\n\n### 使用 parted 管理分区\n\n分区编辑器是允许管理员对磁盘分区进行更改的程序，例如创建分区、删除分区和更改分区类型。为了执行这些操作，管理员可以使用\
  \ `parted` 分区编辑器来处理 MBR 和 GPT 分区方案。\n\n`parted` 命令将整个磁盘的设备名称作为第一个参数，并接跟一个或多个子命令。以下示例使用\
  \ `print` 子命令显示 `/dev/vda` 磁盘上的分区表。\n\n```bash\n[root@host ~]# parted /dev/vda print\n\
  \nModel: Virtio Block Device (virtblk)\nDisk /dev/vda: 53.7GB\nSector size (logical/physical):\
  \ 512B/512B\nPartition Table: msdos\nDisk Flags:\nNumber Start End Size Type File\
  \ system Flags\n1 1049kB 10.7GB 10.7GB primary xfs boot\n2 10.7GB 53.7GB 42.9GB\
  \ primary xfs\n```\n\n如果您不提供子命令，`parted` 将打开一个交互会话以发布命令。\n\n```bash\n[root@host\
  \ ~]# parted /dev/vda\nGNU Parted 3.2\nUsing /dev/vda\nWelcome to GNU Parted! 输入\
  \ 'help' 查看命令列表。\n(parted) print\nModel: Virtio Block Device (virtblk)\nDisk /dev/vda:\
  \ 53.7GB\nSector size (logical/physical): 512B/512B\nPartition Table: msdos\nDisk\
  \ Flags:\nNumber Start End Size Type File system Flags\n1 1049kB 10.7GB 10.7GB primary\
  \ xfs boot\n2 10.7GB 53.7GB 42.9GB primary xfs\n(parted) quit\n```\n\n默认情况下，`parted`\
  \ 以 10 的幂显示大小。您可以通过 `unit` 子命令更改默认值，接受以下单位：KB, MB, GB。\n\n```bash\n[root@host ~]#\
  \ parted /dev/vda unit s\nModel: Virtio Block Device (virtblk)\nDisk /dev/vda: 10485760\n\
  Sector size (logical/physical): 512B/512B\nPartition Table: msdos\nDisk Flags:\n\
  Number Start End Size Type File system Flags\n1 2048s 20971486s 20969439s primary\
  \ xfs boot\n2 20971520s 104857535s xfs\n```\n\n如上面的示例所示，您也可以在同一行中指定多个子命令（此处为 `unit`\
  \ 和 `print`）。\n\n### 在新磁盘上写入分区表\n\n为新驱动器分区之前，必须对其写入磁盘标签。磁盘标签指示使用何种分区方案。\n\n注意 请记住\
  \ `parted` 会立即生效。对 `parted` 的误操作会导致数据丢失。\n\n作为 root 用户，使用以下命令向磁盘写入 MBR 磁盘标签。\n\n\
  ```bash\n[root@host ~]# parted /dev/vdb mklabel msdos\n```\n\n写入 GPT 磁盘标签，使用以下命令。\n\
  \n```bash\n[root@host ~]# parted /dev/vdb mklabel gpt\n```\n\n警告 `mklabel` 命令会擦除现有分区表。只有在打算重用磁盘而不考虑现有数据时才使用\
  \ `mklabel`。如果新标签更改了分区边界，文件系统中的所有数据将无法访问。\n\nRH134-RHEL8.0-en-1-20190531\n160\n\n\
  ![](img/0342.jpeg)\n\n### 创建 MBR 分区\n\n创建 MBR 磁盘分区涉及几个步骤：\n\n1. 指定要创建分区的磁盘设备。\n\
  作为 root 用户，执行 `parted` 命令命令。这将以交互模式启动 `parted` 命令并显示命令提示符。\n\n```bash\n[root@host\
  \ ~]# parted /dev/vdb\nGNU Parted 3.2\nUsing /dev/vdb\nWelcome to GNU Parted! 输入\
  \ 'help' 查看命令列表。\n(parted)\n```\n\n2. 使用 `mkpart` 子命令创建新的主分区或扩展分区。\n\n```bash\n\
  (parted) mkpart\nPartition type? primary/extended? primary\n```\n\n注意 对于在 MBR 分区磁盘上需要多于四个分区的情况，创建三个主分区和一个扩展分区。该扩展分区充当容器，您可以在其中创建多个逻辑分区。\n\
  \n3. 指定想在分区上创建的文件系统类型，例如 `xfs` 或 `ext4`。\n\n\n\n\n这不会在分区上创建文件系统；它只是对分区类型的指示。\n\n\
  文件系统类型？`[ext2]`？`xfs`\n\n要获取支持的文件系统类型列表，请使用以下命令：\n\n```bash\n[root@host ~]# parted\
  \ /dev/ vdb help mkpart\n```\n\n`mkpart PART-TYPE [FS-TYPE] START END` 创建一个分区 `PART-TYPE`\
  \ 可选：`primary`（主）、`logical`（逻辑）、`extended`（扩展）\n\n`FS-TYPE` 可选：`btrfs`, `nilfs2`,\
  \ `ext4`, `ext3`, `ext2`, `fat32`, `fat16`, `hfsx`, `hfs+`, `hfs`, `jfs`, `swsusp`,\
  \ `linux-swap(v1)`, `linux-swap(v0)`, `ntfs`, `reiserfs`, `hp-ufs`, `sun-ufs`, `xfs`,\
  \ `apfs2`, `apfs1`, `asfs`, `amufs5`, `amufs4`, `amufs3`, `amufs2`, `amufs1`, `amufs0`,\
  \ `amufs`, `affs7`, `affs6`, `affs5`, `affs4`, `affs3`, `affs2`, `affs1`, `affs0`,\
  \ `linux-swap`, `linux-swap(new)`, `linux-swap(old)`。`START` 和 `END` 是磁盘位置，例如 `4GB`\
  \ 或 `10%`。负值从磁盘末尾计算。例如，`-1s` 确切指定最后一个扇区。\n\n`mkpart` 创建分区，但不会在分区上创建新的文件系统。可以指定 `FS-TYPE`\
  \ 来设置适当的分区 ID。\n\nRH134-RHEL8.0-en-1-20190531\n161\n![](img/00021.jpeg)\n\n# 第 6\
  \ 章 | 管理基础存储\n\n## 4. 指定新分区开始的磁盘扇区。\n\n起始位置？`2048s`\n\n注意 `s` 后缀表示以扇区为单位提供值。你也可以使用\
  \ `MiB`、`GiB`、`TiB`、`MB`、`GB` 或 `TB` 后缀。如果你不提供后缀，默认为 `MB`。`parted` 可能会舍入你提供的值以满足磁盘限制。\n\
  \n当 `parted` 启动时，它会从设备检索磁盘拓扑。例如，磁盘物理块大小通常是 `parted` 收集的一个参数。根据这些信息，`parted` 确保你提供的起始位置能够让分区与磁盘结构对齐。正确的分区对齐对于优化性能非常重要。如果起始位置导致分区未对齐，`parted`\
  \ 将显示警告。对于大多数磁盘，起始扇区是 `2048` 的倍数是一个安全的假设。\n\n## 5. 指定新分区应该结束的磁盘扇区。\n\n结束位置？`1000MB`\n\
  \n使用 `parted` 时，你无法直接提供分区的大小，但可以使用以下公式快速计算：\n\n`Size = End - Start`\n\n一旦你提供了结束位置，`parted`\
  \ 就会用新的分区详情更新磁盘上的分区表。\n\n## 6. 退出 parted。\n\n```bash\n(parted) quit\n```\n\n信息：你可能需要更新\
  \ `/etc/fstab`。\n\n```bash\n[root@host ~]#\n```\n\n## 7. 运行 `udevadm settle` 命令。\n\
  \n此命令等待系统检测到新分区并在 `/dev` 目录下创建关联的设备文件。它只在完成后才会返回。\n\n```bash\n[root@host ~]# udevadm\
  \ settle\n```\n\n作为交互模式的替代，你也可以按照以下方式创建分区：\n\n```bash\n[root@host ~]# parted /dev/\
  \ vdb mkpart primary xfs 2048s 1000MB\n```\n\n# 创建 GPT 分区\n\nGPT 方案也使用 `parted`\
  \ 命令来创建新分区：\n\n## 1. 指定要在哪个磁盘设备上创建分区。\n\n162\nRH134-RHEL8.0-en-1-20190531\n![](img/00437.jpeg)\n\
  # 第 6 章 | 管理基础存储\n\n作为 root 用户，以磁盘设备作为唯一参数执行 `parted` 命令，以带有命令提示符的交互模式启动 `parted`。\n\
  \n```bash\n[root@host ~]# parted /dev/ vdb\n```\n\n```\nGNU Parted 3.2\nUsing /dev/vdb\n\
  Welcome to GNU Parted! 输入 'help' to 查看命令列表.\n(parted)\n```\n\n## 2. 使用 `mkpart`\
  \ 子命令开始创建新分区。\n\n在 GPT 方案下，每个分区都被分配了一个名称。\n\n```bash\n(parted) mkpart\nPartition\
  \ name? []? usersdata\n```\n\n## 3. 指定你想在分区上创建的文件系统类型，例如 `xfs` 或 `ext4`。\n\n这不会在分区上创建文件系统；它只是对分区类型的指示。\n\
  \n```bash\nFile system type? [ext2]? xfs\n```\n\n## 4. 指定新分区开始的磁盘扇区。\n\n```bash\n\
  Start? 2048s\n```\n\n## 5. 指定新分区应该结束的磁盘扇区。\n\n```bash\nEnd? 1000MB\n```\n\n一旦你提供了结束位置，`parted`\
  \ 就会用新的分区详情更新磁盘上的分区表。\n\n## 6. 退出 parted。\n\n```bash\n(parted) quit\n```\n\n信息：你可能需要更新\
  \ `/etc/fstab`。\n\n```bash\n[root@host ~]#\n```\n\n## 7. 运行 `udevadm settle` 命令。\n\
  \n此命令等待系统检测到新分区并在 `/dev` 目录下创建关联的设备文件。它只在完成后才会返回。\n\n```bash\n[root@host ~]# udevadm\
  \ settle\n```\n\n作为交互模式的替代，你也可以按照以下方式创建分区：\n\n```bash\n[root@host ~]# parted /dev/\
  \ vdb mkpart primary xfs 2048s 1000MB\n```\n\n\n\n# 由 anaconda 创建于 2019 年 2 月 13\
  \ 日 周三 16:39:59\n\n## 文件系统概述\n可访问的文件系统通过引用维护在 `/dev/disk/` 下。\n更多信息请参见 man 页 `fstab(5)`、`findfs(8)`、`mount(8)`\
  \ 和/或 `blkid(8)`。\n\n编辑此文件后，运行 `systemctl daemon-reload` 以更新由此文件生成的 systemd 。\n\n\
  RH134-RHEL8.0-en-1-20190531 | 165\n![](img/00338.jpeg)\n\n# 第 6 章 | 管理基础存储\n\n##\
  \ fstab 配置\n```text\nUUID=a8063676-44dd-409a-b584-68be2c9f5570 / xfs defaults 0\
  \ 0\nUUID=7a20315d-ed8b-4e75-a5b6-24ff9e1f9838 /dbdata xfs defaults 0 0\n```\n\n\
  当你在 `/etc/fstab` 文件中添加或删除条目时，运行 `systemctl daemon-reload` 命令或重启服务器，以便 systemd 注册新配置。\n\
  \n```bash\n[root@host ~]# systemctl daemon-reload\n```\n\n### 设备识别\n第一个字段指定设备。此示例使用\
  \ `UUID` 来指定设备。文件系统在创建时会在其超级块（super block）中创建并存储 `UUID`。或者，你可以使用设备文件，例如 `/dev/vdb1`。\n\
  \n**注意**\n使用 `UUID` 优，因为块设备标识符在某些情况下可能会发生，例如云提供程序更改了虚拟机的底层存储层，或者磁盘在每次系统启动时检测到的顺序不同。\n\
  块设备文件名可能会更改，但 `UUID` 在文件系统的超级块中保持不变。\n\n使用 `lsblk --fs` 命令扫描连接到机器的块设备并检索文件系统的 `UUIDs`\n\
  \n```bash\n[root@host ~]# lsblk --fs\nNAME FSTYPE LABEL UUID MOUNTPOINT\nsr0\nvda\n\
  └─vda1 xfs 8063676-44dd-409a-b584-68be2c9f5570 /\nvdb\n└─vdb1 xfs 7a20315d-ed8b-4e75-a5b6-24ff9e1f9838\
  \ /dbdata\n```\n\n第二个字段是目录挂载点，块设备将通过该目录在目录结构中访问。挂载点必须存在；如果不存在，请使用 `mkdir` 命令创建。\n\
  \n第三个字段包含文件系统类型，例如 `xfs` 或 `ext4`。\n\n第四个字段是应用到设备的逗号分隔选项列表。`defaults` 是一组常用选项。`mount(8)`\
  \ man 页文档说明了其他可用选项。\n\n第五个字段用于 `dump` 命令来备份设备。其他备份应用程序通常不使用此字段。\n\n最后一个字段是 `fsck`\
  \ 顺序字段，决定在系统启动时是否应运行 `fsck` 命令来验证文件系统是否干净。该字段中的值表示 `fsck` 运行的顺序。对于 `XFS` 文件系统，将此字段设置为\
  \ `0`，因为 `XFS` 不使用 `fsck` 来检查其文件系统状态。对于 `ext4` 文件系统，将根文件系统设置为 `1`，将其他 `ext4` 文件系统设置为\
  \ `2`。这样，`fsck` 会先处理根文件系统，然后并发检查不同磁盘上的文件系统，并顺序检查同一块磁盘上的文件系统。\n\nRH134-RHEL8.0-en-20190531\
  \ | 166\n![](img/00115.jpeg)\n\n### 注意事项\n**注意**\n`/etc/fstab` 中存在错误的条目可能会导致机器无法启动。\n\
  管理员应通过卸载新文件系统并使用 `mount /mountpoint`（这会读取 `/etc/fstab`）重新挂载文件系统来验证条目是否有效。如果 `mount`\
  \ 命令返回错误，请在重启机器之前进行修正。\n\n作为替代方案，你可以使用 `findmnt --verify` 命令来控制 `/etc/fstab` 文件。\n\
  \n### 参考文献\n- `info parted` (GNU Parted 用户手册)\n- `parted(8)`、`mkfs(8)`、`mount(8)`、`lsblk(8)`\
  \ 和 `fstab(5)` man 页。\n更多信息，请参阅文件系统配置和管理指南：https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html-single/configuring_and_managing_file_systems/\n\
  \nRH134-RHEL8.0-en-20190531 | 167\n![](img/00198.jpeg)\n\n# 引导练习：添加分区、文件系统和持久性挂载\n\
  \n在本次练习中，你将在新的存储设备上创建一个分区，使用 `XFS` 文件系统对其进行格式化，将其配置为启动时挂载，并挂载以使用。\n\n#### 结果\n你应该能够使用\
  \ `parted`、`mkfs.xfs` 和其他命令在新磁盘上创建分区、进行格式化并进行持久性挂载。\n\n## 开始之前\n1. 在工作台上使用 `student`\
  \ 作为密码登录 student 用户。\n2. 在工作台上上运行 `lab storage-partitions start` 命令。该命令运行一个启动脚本，用于判断存储是否可访问。\n\
  \n\n\n更新 systemd 以使系统注册新的 `/etc/fstab` 配置。\n\n```bash\n[root@servera ~]# systemctl\
  \ daemon-reload\n```\n\n### 6.5.\n执行 `mount /archive` 命令，使用 `/etc/fstab` 中添加的新条目挂载新文件系统。\n\
  \n```bash\n[root@servera ~]# mount /archive\n```\n\n### 6.6.\n验证新文件系统已挂载到 `/archive`。\n\
  \n```bash\n[root@servera ~]# mount | grep /archive\n/dev/vdb1 on /archive type xfs\
  \ (rw,relatime,seclabel,attr2,inode64,noquota)\n```\n\n170\nRH134-RHEL8.0-en-1-20190531\n\
  ![](img/00325.jpeg)\n第 6 章 | 管理基础存储\n\n### 7.\n重启 `servera`。服务器重启后，登录并验证 `/dev/vdb1`\
  \ 是否挂载在 `/archive`。完成后，注销 `servera`。\n\n### 7.1.\n重启 `servera`。\n\n```bash\n[root@servera\
  \ ~]# systemctl reboot\n```\n连接到 servera 已被远程主机关闭。\n连接到 servera 已关闭。\n`[student@workstation\
  \ ~]$`\n\n### 7.2.\n等待几分钟让 `servera` 重启，并以学生用户登录。\n\n```bash\n[student@workstation\
  \ ~]$ ssh student@servera\n...省略输出...\n[student@servera ~]$\n```\n\n### 7.3.\n验证\
  \ `/dev/vdb1` 是否挂载在 `/archive`。\n\n```bash\n[student@servera ~]$ mount | grep /archive\n\
  /dev/vdb1 on /archive type xfs (rw,relatime,seclabel,attr2,inode64,noquota)\n```\n\
