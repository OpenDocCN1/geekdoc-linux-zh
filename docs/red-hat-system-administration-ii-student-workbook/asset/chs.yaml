  \ `servera` 和 `serverb` 系统上创建所需的用户和组。\n\n```bash\n[student@workstation ~]$ lab netstorage-review\
  \ start\n```\n\n一家 IT 支持公司使用中央服务器 `serverb` 在 `/remote/shares` 下为他们的组和用户托管一些共享目录。用户需要能够登录，并使其共享目录按需挂载到\
