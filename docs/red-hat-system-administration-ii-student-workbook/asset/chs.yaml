  \ 安装 Red Hat Enterprise Linux\n\n# 使用 KICKSTART 实现自动化安装\n\n### 目标\n完成本节后，你应该能够：\n\
  - 解释 Kickstart 概念和架构。\n- 使用 Kickstart Generator 网站创建 Kickstart 文件。\n- 使用文本编辑器修改现有的\
  \ Kickstart 文件并使用 `ksvalidator` 检查其语法。\n- 将 Kickstart 文件发布到安装程序。\n- 执行网络 Kickstart\
  \ 安装。\n\n## 创建 Kickstart 配置\n你可以使用名为 Kickstart 的功能自动化 Red Hat Enterprise Linux 的安装。\n\
  \n使用 Kickstart，你可以在 Kickstart 文本文件中指定 `Anaconda` 完成安装所需的一切，包括磁盘分区、网络接口配置、软件包选择和其他参数。通过引用该文本文件，`Anaconda`\
  \ 将无需进一步的用户交互即可执行安装。\n\n### 注意\nRed Hat Enterprise Linux 中的 Kickstart 类似于 Oracle\
  \ Solaris 中的 Jumpstart 功能，类似于用于 Microsoft Windows 的无人 Setup 回答文件。\n\nKickstart 文件以命令列表开始，定义如何安装目标机器。以\
  \ `#` 字符开头的行是安装程序忽略的注释。额外的章节以第一个 `%` 字符开头的指令开始，并在带有 `%end` 指令的行结束。\n\n`%packages`\
  \ 章节指定了要在目标系统上安装的软件。通过名称（不带版本）指定单个软件包。通过名称或 ID 指定的软件包组通过 `@` 字符开头来识别。环境组通过以 `@`\
  \ 字符开头的指令来识别，并以 `@stream/profile` 语法指定流、默认、。。。````````````````或或或软件包。。Kickstart\
  \ 通常使用两个额外的章节 `%pre` 和 `%post`，包含 shell 脚本来配置系统。`%pre` 脚本在磁盘分区之前执行。`#post` 脚本在安装完成后执行。你必须在\
  \ `%pre`、`%post` 和 `%packages` 章节之前指定主分区 Kickstart 命令，否则，你可以将这些章节放在文件的任何位置。\n\n\
  RH134-RHEL8.0-en-1-20190531\n353\n![](img/0496.jpeg)\n第 12 章 | 安装 Red Hat Enterprise\
  \ Linux\n\n# KSTART 文件 命令\n\n### 安装命令\n定义安装源以及如何执行安装。每个命令后都有一个示例。\n- `url`:指定指向安装媒体的\
  \ URL。\n  `url --url=\"http://classroom.example.com/content/rhel8.0/x86_64/dvd/\"\
  `\n- `repo`:指定在哪里查找额外的软件包。此选项必须指向有效的 yum 仓库。\n  `repo --name=\"appstream\" --baseurl=http://classroom.example.com/content/rhel8.0/x86_64/dvd/AppStream/`\n\
  - `text`:强制进行文本模式安装。\n- `vnc`:允许通过 VNC 远程查看图形化安装。\n  `vnc --password=redhat`\n\n\
  ### 分区命令\n定义使用的设备和分区方案。\n- `clearpart`:在创建新分区之前从系统中删除分区。默认情况下，不删除分区。\n  `clearpart\
  \ --all --drives=sda,sdb --initlabel`\n- `part`:指定分区的大小、格式和名称。\n  `part /home --fstype=ext4\
  \ --label=homes --size=4096 --maxsize=8192 --grow`\n- `autopart`:自动创建根分区、交换分区以及适用于架构的启动分区。在足够大的驱动器上，还会创建一个\
  \ `/home` 分区。\n- `ignoredisk`:控制 Anaconda 对接到系统的磁盘的访问。\n  `ignoredisk --drives=sdc`\n\
  - `bootloader`:定义安装引导程序的位置。\n  `bootloader --location=mbr --boot-drive=sda`\n- `volgroup`,\
  \ `logvol`:创建 LVM 卷组和逻辑卷。\n  `part pv.01 --size=8192`\n  `volgroup myvg pv.01`\n\
  \  `logvol / --vgname=myvg --fstype=xfs --size=2048 --name=rootvol --grow logvol\
  \ /var --vgname=myvg --fstype=xfs --size=4096 --name=varvol`\n\n354\n\n\n\n\n\n\
  RH134-RHEL8.0-en-1-20190531\n\n![](img/00025.jpeg)\n\n# 第 12 章 | 安装 Red Hat Enterprise\
  \ Linux\n\n- `zerombr`: 初始化格式无法识别的磁盘。\n\n## 网络命令\n\n定义主机所使用的网络特性。\n\n- `network`:\
  \ 为目标系统配置网络信息。在安装环境中激活网络设备。\n\n```\nnetwork --device=eth0 --bootproto=dhcp\n```\n\
  \n- `firewall`: 为目标系统定义防火墙配置。\n\n```\nfirewall --enabled --service=ssh,http\n```\n\
  \n## 地位置与安全命令\n\n配置与安全、语言和区域相关的设置。\n\n- `lang`: 设置安装期间使用的语言以及安装系统的默认语言。必选。\n\n```\n\
  lang en_US.UTF-8\n```\n\n- `keyboard`: 设置系统键盘类型。必选。\n\n```\nkeyboard --vckeymap=us\
  \ --xlayouts=''\n```\n\n- `timezone`: 定义时区、NTP 服务器以及硬件时钟是否使用 UTC。\n\n```bash\ntimezone\
  \ --utc --ntpservers=time.example.com Europe/Amsterdam\n```\n\n- `authselect`: 设置身份验证选项。`authselect`\
  \ 识别的选项对此命令有效。参见 `authselect(8)`。\n\n- `rootpw`: 定义初始 root 密码。\n\n```bash\nrootpw\
  \ --plaintext redhat\n```\n或\n```bash\nrootpw --iscrypted $6$KUnFfrTzO8jv.PiH$YlBbOtXBkWzoMuRfb0.SpbQ....XDR1UuchoMG1\n\
  ```\n\n- `selinux`: 设置安装系统的 SELinux 模式。\n\n```\nselinux --enforcing\n```\n\n- `services`:\
  \ 修改默认 systemd 目标下运行的默认集。\n\n```\nservices --disabled=network,iptables,ip6tables\
  \ --enabled=NetworkManager,firewalld\n```\n\n- `group`, `user`: 在系统上创建本地组或用户。\n\n\
  RH134-RHEL8.0-en-1-20190531\n355\n\n![](img/00335.jpeg)\n\n# 第 12 章 | 安装 Red Hat\
  \ Enterprise Linux\n\n```bash\ngroup --name=admins --gid=10001\nuser --name=jdoe\
  \ --gecos=\"John Doe\" --groups=admins --password=changeme --plaintext\n```\n\n\
  ## 其他命令\n\n配置安装期间与日志相关的杂项以及完成后的主机电源状态。\n\n- `logging`: 该命令定义了 Anaconda 在安装期间如何执行日志。\n\
  \n```\nlogging --host=loghost.example.com --level=info\n```\n\n- `firstboot`: 如果启用，Setup\
  \ Agent 在系统首次启动时启动。必须安装 `initial-setup` 包。\n\n```\nfirstboot --disabled\n```\n\n\
  - `reboot`, `poweroff`, `halt`: 指定安装完成后采取的最终操作。\n\n> 注意\n> `pykickstart` 包中的 `ksverdiff`\
  \ 工具可用于识别两个 Red Hat Enterprise Linux 或 Fedora 版本之间 Kickstart 文件语法的更改。\n> 例如，`ksverdiff\
  \ -f RHEL7 -t RHEL8` 识别从 RHEL 7 到 RHEL 8 的语法更改。可用版本列在文件 `/usr/lib/python3.6/site-packages/pykickstart/version.py`\
  \ 的顶部。\n\n## 示例 KICKSTART 文件\n\n文件的第一部分包含安装命令，例如磁盘分区和安装源。\n\n```bash\n#version=RHEL8\n\
  ignoredisk --only-use=vda\n# 系统引导程序配置\nbootloader --append=\"console=ttyS0 console=ttyS0,115200n8\
  \ no_timer_check net.ifnames=0 crashkernel=auto\" --location=mbr --timeout=1 --boot-drive=vda\n\
  # 清除主引导记录\nzerombr\n# 分区清除信息\nclearpart --all --initlabel\n# 使用文本模式安装\ntext\nrepo\
  \ --name=\"appstream\" --baseurl=http://classroom.example.com/content/rhel8.0/x86_64/dvd/AppStream/\n\
  # 使用网络安装\nurl --url=\"http://classroom.example.com/content/rhel8.0/x86_64/dvd/\"\
