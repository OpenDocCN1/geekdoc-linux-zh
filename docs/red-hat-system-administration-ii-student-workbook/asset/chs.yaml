  \ ~]# systemctl start autofs\n```\n\n\n\n\n\n### 实验：访问网络附属存储\n\n## 性能检查清单\n在本实验中，你将使用间接映射设置自动挂载器（automounter），并使用\
  \ NFSv4 服务器的共享。\n\n### 实验目标\n你应当能够：\n• 安装设置自动挂载器所需的软件包。\n• 配置自动挂载器间接映射，从预配置的 NFSv4\
  \ 服务器获取资源。\n• 使用 `nfsconf` 工具配置 NFS 客户端仅使用 NFSv4。\n\n#### 准备工作\n使用用户名 `student`\
