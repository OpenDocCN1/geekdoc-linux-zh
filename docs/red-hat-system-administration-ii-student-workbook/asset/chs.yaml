  \n图 11.6：Web 控制台服务列表\n\n## 从命令行配置防火墙\n\n`firewall-cmd` 命令与 `firewalld` 动态防火墙管理器交互。它作为主\
  \ `firewalld` 软件包的一部分进行安装，适用于偏好在命令行中工作的管理员、在没有图形环境的系统上工作，或者用于为防火墙设置编写脚本。\n\n下表列出了许多常用的\
  \ `firewall-cmd` 命令及其说明。请注意，除非另有指定，否则除非指定 `--permanent` 选项，几乎所有命令都将在运行时配置上生效。如果指定了\
  \ `--permanent` 选项\n\nRH134-RHEL8.0-en-1-20190531\n319\n\n![](img/00252.jpeg)\n\n\
  # 第 11 章 | 管理网络安全\n\n您必须通过运行 `firewall-cmd --reload` 命令来激活设置，该命令会读取当前的永久配置并将其作为新的运行时配置。列出的许多命令使用\
  \ `--zone= ZONE` 选项来确定它们影响的区域。如果需要网掩码，请使用 CIDR 表示法，例如 `192.168.1/24`。\n\n### FIREWALL-CMD\
  \ 命令\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `--get-default-zone` | 查询当前默认区域。 |\n| `--set-default-zone=\
  \ ZONE` | 设置默认区域。这会同时更改运行时和永久配置。 |\n| `--get-zones` | 列出所有可用区域。 |\n| `--get-active-zones`\
  \ | 列出所有当前使用的区域（已绑定接口或源的区域），以及它们对应的接口和源信息。 |\n| `--add-source= CIDR [--zone= ZONE]`\
  \ | 将所有来自 IP 地址或网络/掩码的流量路由到指定的区域。如果没有提供 `--zone=` 选项，则使用默认区域。 |\n| `--remove-source=\
  \ CIDR [--zone= ZONE]` | 移除路由所有来自 IP 地址或网络/掩码的区域流量的规则。如果没有提供 `--zone=` 选项，则使用默认区域。\
  \ |\n| `--add-interface= INTERFACE [--zone= ZONE]` | 将所有来自接口的流量路由到指定的区域。如果没有提供 `--zone=`\
  \ 选项，则使用默认区域。 |\n| `--change-interface= INTERFACE [--zone= ZONE]` | 将接口更改到指定的区域。如果没有提供\
  \ `--zone=` 选项，则使用默认区域。 |\n| `list-all` | 列出指定区域或默认区域的所有配置。 |\n| `--add-service=\
  \ SERVICE [--zone= ZONE]` | 在指定区域中允许特定的服务。 |\n| `--add-port= PORT/PROTOCOL [--zone=\
  \ ZONE]` | 在指定区域允许特定的端口/协议。 |\n| `--remove-service= SERVICE [--zone= ZONE]` | 从指定区域移除特定的服务。\
  \ |\n| `--remove-port= PORT/PROTOCOL [--zone= ZONE]` | 从指定区域移除特定的端口/协议。 |\n| `--reload`\
  \ | 重新加载永久配置，将其应用于运行时配置。 |\n\n\n\n\n\n```bash\n[student@workstation ~]$ curl -k\
  \ https://servera.lab.example.com curl: (7) Failed to connect to servera.lab.example.com\
  \ port 443: No route to host\n```\n\n## 7. 以 student 用户身份登录到 `servera`。\n\n```bash\n\
  [student@workstation ~]$ ssh student@servera\n```\n...省略部分输出...\n```bash\n[student@servera\
  \ ~]$\n```\n\n## 8. 在 `servera` 上，确保 `nftables` 服务被屏蔽（masked），且 `firewalld` 服务已启用并正在运行。\n\
  \n### 8.1. 确定 `nftables` 服务的状态是否被屏蔽。\n\n```bash\n[student@servera ~]$ sudo systemctl\
  \ status nftables\n[sudo] password for student: student\n● nftables.service - Netfilter\
  \ Tables\nLoaded: loaded (/usr/lib/systemd/system/nftables.service; disabled; vendor\
  \ preset: disabled)\nActive: inactive (dead)\nDocs: man:nft(8)\n```\n\n结果显示 `nftables`\
  \ 已禁用（disabled）且未激活（inactive），但未屏蔽（masked）。运行以下命令屏蔽该服务。\n\n```bash\n[student@servera\
  \ ~]$ sudo systemctl mask nftables\nCreated symlink /etc/systemd/system/nftables.service\
  \ → /dev/null.\n```\n\n### 8.2. 验证 `nftables` 服务的状态是否被屏蔽。\n\n```bash\n[student@servera\
  \ ~]$ sudo systemctl status nftables\n● nftables.service\nLoaded: masked (Reason:\
  \ Unit nftables.service is masked.) Active: inactive (dead)\n```\n\n### 8.3. 验证\
  \ `firewalld` 服务的状态是否启用并运行。\n\n```bash\n[student@servera ~]$ sudo systemctl status\
  \ firewalld\n● firewalld.service - firewalld - dynamic firewall daemon Loaded: loaded\
