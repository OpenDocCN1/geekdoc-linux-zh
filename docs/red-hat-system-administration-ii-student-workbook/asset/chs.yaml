  \ 9000\n```\n\n3.4.\n\n启用并启动 httpd 服务。\n\n```bash\n[student@serverb ~]$ sudo systemctl\
  \ enable --now httpd\n```\n\n3.5.\n\n验证 httpd 服务的运行状态。\n\n```bash\n[student@serverb\
