  49\n\n![](img/00003.jpeg)\n# 第 2 章 | 调度未来任务\n\n## 调度系统周期性作业\n\n### 目标\n\n完成本节后，你应该能够使用系统\
  \ crontab 文件和目录按重复计划调度命令。\n\n### 说明系统周期性作业\n\n系统管理员经常需要运行周期性作业。最佳实践是从系统账户运行这些作业，而不是用户账户。也就是说，不要使用\
  \ `crontab` 命令调度这些作业，而是使用系统级 crontab 文件。系统级 crontab 文件中的作业与用户 crontab 条目相似，不同在于系统级\
  \ crontab 文件在命令字段之前有一个额外字段；运行该命令的用户。\n\n`/etc/crontab` 文件在包含的注释中有一个实用的语法图。\n\n#\
  \ 详情见 man 4 crontabs\n\n# 作业定义示例：\n# .---------------- minute (0 - 59)\n# | .-------------\
  \ hour (0 - 23)\n# | | .---------- day of month (1 - 31)\n# | | | .------- month\
  \ (1 - 12) OR jan,feb,mar,apr ...\n# | | | | .---- day of week (0 - 6) (Sunday=0\
  \ or 7) OR sun,mon,tue ...\n# | | | | |\n# * * * * * user-name command to be executed\n\
  \n周期性作业定义在两个位置：`/etc/crontab` 文件以及位于\n\n\n\n\n\n# /etc/cron.d/\n\n你应当始终在 `/etc/cron.d`\
  \ 目录下创建自定义的 crontab 文件，以调度周期性的系统作业。将自定义的 crontab 文件放置在 `/etc/cron.d` 中是为了防止 `/etc/crontab`\
  \ 的提供程序发生更新时覆盖它（因为更新可能会覆盖 `/etc/crontab` 中的现有内容）。需要周期性系统作业的软件包会将包含作业条目的 crontab\
  \ 文件放在 `/etc/cron.d/` 中。管理员还利用此位置将相关作业分组到一个文件中。\n\ncrontab 系统还包含了每小时、每天、每周和每月运行脚本的仓库。这些仓库是名为\
  \ `/etc/cron.hourly/`、`/etc/cron.daily/`、`/etc/cron.weekly/` 和 `/etc/cron.monthly/`\
  \ 的目录。再次，这些目录包含可执行的 shell 脚本，而不是 crontab 文件。\n\n## 重要提示\n\n记得对放置在这些目录中的任何脚本赋予可执行权限。如果脚本不可可执行，它将无法运行。要使脚本变为可执行，请使用\
  \ `chmod +x script_name`。\n\n## 第 2 章 | 调度未来任务\n\n从 `/etc/cron.d/0hourly` 文件调用的名为\
  \ `run-parts` 命令会运行 `/etc/cron.hourly/*` 脚本。`run-parts` 命令也会运行每日、每周和每月的作业，但它是从一个名为\
  \ `/etc/anacrontab` 的不同配置文件调用的。\n\n### 注意\n\n在过去，有一个名为 `anacron` 的独立服务用于处理 `/etc/anacrontab`\
  \ 文件，但在 Red Hat Enterprise Linux 7 及更高版本中，标准的 `crond` 服务会解析此文件。\n\n`/etc/anacrontab`\
  \ 的作用是确保重要作业始终运行，而不会因为系统在作业应执行时处于关闭或休眠状态而被意外跳过。例如，如果一个每天运行一次的系统作业在上次应执行时间因系统正在重启而没有执行，则该作业将在系统准备就绪时执行。然而，根据\
  \ `/etc/anacrontab` 中为作业指定的 `Delay`（延迟分钟）参数的值，启动作业时可能会有几分钟的延迟。\n\n`/var/spool/anacron/`\
  \ 中为每个每日、每周和每月作业设有不同的文件，用于判断特定作业是否已运行。当 `crond` 从 `/etc/anacrontab` 启动作业时，它会更新这些文件的时间戳。相同的时间戳用于判断作业上次运行的时间。`/etc/anacrontab`\
  \ 的语法与标准的 crontab 配置文件不同。它每行恰好包含四个字段，如下：\n\n- **以天为周期 (Period in days)**：按重复计划运行的作业的间隔天数。该字段接受整数或宏作为值。例如，宏\
  \ `@daily` 等于整数 `1`，意味着该作业每天执行一次。同样，宏 `@weekly` 等于整数 `7`，意味着该作业每周执行一次。\n- **分钟延迟\
  \ (Delay in minutes)**：`crond` 守护进程在启动此作业之前应等待的时间。\n- **作业标识符 (Job identifier)**：在日志消息中标识作业的唯一名称。\n\
  - **命令 (Command)**：要执行的命令。\n\n`/etc/anacrontab` 文件还包含使用 `NAME=value` 语法的环境变量声明。特别关注的是\
  \ `START_HOURS_RANGE` 变量，它指定了作业运行的时间范围。作业不会在此范围之外启动。如果某天作业没有在该时间间隔内运行，则该作业必须等到第二天才能执行。\n\
  \n## 引入 systemd 定时器\n\n随着 systemd 在 Red Hat Enterprise Linux 7 中的出现，现在有了一个新的调度功能：`systemd\
  \ timer` 单元。systemd 定时器单元会激活另一个类型的单元（例如服务），其单元名称与定时器单元名称匹配。定时器单元允许基于时间的触发来激活其他单元。为了方便调试，systemd\
  \ 在系统日志中记录定时器事件。\n\n## 示例定时器单元\n\n`sysstat` 包提供了一个名为 `sysstat-collect.timer` 的 systemd\
  \ 定时器单元，每 10 分钟收集一次系统统计数据。以下输出显示了 `/usr/lib/systemd/system/sysstat-collect.timer`\
  \ 的配置行。\n\n```ini\n[Unit]\nDescription= system activity accounting tool every 10\
  \ minutes\n\n[Timer]\nOnCalendar=*:00/10\n\n[Install]\nWantedBy=sysstat.service\n\
  ```\n\n参数 `OnCalendar=*:00/10` 表示该定时器单元每 10 分钟激活一次相应的单元 (`sysstat-collect.service`)。然而，你可以指定更复杂的时间间隔。例如，在\
  \ `OnCalendar` 参数上指定 `2019-03-* 12:35,37,39:16` 值会导致定时器单元在 2019 年 3 月整个期间，每天的 `12:35:16`、`12:37:16`\
  \ 和 `12:39:16` 激活相应的服务单元。你还可以使用 `OnUnitActiveSec` 等参数指定相对定时器。例如，`OnUnitActiveSec=15min`\
  \ 选项会导致定时器单元...\n\n**重要**\n不要修改 `/usr/lib/systemd/system` 下的任何单元文件，因为软件包的更新可能会覆盖更改。\n\
  \n在更改单元配置后，使用 `systemctl daemon-reload` 命令确保 systemd 感知到这些更改。\n\n在重新加载系统管理器配置后，使用以下\
  \ `systemctl` 命令激活定时器单元：\n\n```bash\nsystemctl enable --now <unitname>.timer\n```\n\
  \n## 引导练习：调度周期性系统作业\n\n在此练习中，你将通过向系统 crontab 添加配置文件来按各种计划调度命令。\n\n#### 结果\n你应该能够：\n\
  - 调度一个计算活动用户数的周期性系统作业。\n- 更新收集活动数据的 systemd 定时单元。\n\n#### 准备工作\n使用密码登录工作站。\n\n在工作站运行\
  \ `lab scheduling-system start` 开始练习。该脚本确保环境干净且配置正确。\n\n```bash\n[student@workstation]$\
  \ lab scheduling-system start\n```\n\n### 1. 从工作站以 student 身份通过 SSH 连接到 `servera`。\n\
  \n```bash\n[student@workstation]$ ssh student@servera\n```\n\n### 2. 使用 `sudo -i`\
  \ 命令切换到 root 用户。\n\n```bash\n[student@servera ~]$ sudo -i\n```\n\n### 3. 调度一个周期性系统作业，生成指示系统当前活动用户数的日志消息。该作业必须每天运行。你可以使用\
  \ `w -h | wc -l` 命令获取系统当前活动用户数。此外，使用 `logger` 命令生成日志消息。\n\n#### 3.1. 创建一个名为 `/etc/cron.daily/usercount`\
  \ 的脚本文件，内容如下。你可以使用 `vi /etc/cron.daily/usercount` 命令创建该脚本文件。\n\n\n\n\n\n`logger\
  \ \"There are currently ${USERCOUNT} active users\"`\n\n## 3.2. 使用 `chmod` 命令为 `/etc/cron.daily/usercount`\
  \ 执行 (x) 权限。\n\n```\n[root@servera ~]# chmod +x /etc/cron.daily/usercount\n```\n\
  \n## 4. `sysstat` 软件包提供了名为 `sysstat-collect.timer` 和 `sysstat-collect.service` 的\
  \ systemd 单元。定时器单元每 10 分钟触发一次服务单元，使用名为 `/usr/lib64/sa/sa1` 的 shell 脚本收集系统活动数据。确保已安装\
  \ `sysstat` 软件包，并修改定时器单元配置文件，以便每两分钟收集一次系统活动数据。\n\n### 4.1. 使用 `yum` 命令安装 `sysstat`\
  \ 软件包。\n\n```\n[root@servera ~]# yum install sysstat\n...output omitted...\n\nIs\
  \ this ok [y/N]: y\n\n...output omitted...\n\nInstalled:\nsysstat-11.7.3-2.el8.x86_64\
  \ lm_sensors-\nlibs-3.4.0-17.20180522git70f7e08.el8.x86_64\n\nComplete!\n```\n\n\
  ### 4.2. 将 `/usr/lib/systemd/system/sysstat-collect.timer` 拷贝到 `/etc/systemd/system/sysstat-collect.timer`。\n\
  \n```\n[root@servera ~]# cp /usr/lib/systemd/system/sysstat-collect.timer \\\n/etc/systemd/system/sysstat-collect.timer\n\
  ```\n\n**重要**\n\n你不应该编辑 `/usr/lib/systemd` 目录下的文件。通过 `systemd`，你可以将单元文件拷贝到 `/etc/systemd/system`\
  \ 目录并编辑该副本。`systemd`进程将解析你自定义的副本，而不是 `/usr/lib/systemd` 目录下的文件。\n\n### 4.3. 编辑 `/etc/systemd/system/sysstat-collect.timer`，使定时器每两分钟运行一次。此外，将整个单元配置文件（包括注释行中的）中所有的字符串\
  \ `10 minutes` 替换为 `2 minutes`。你可以使用 `vi /etc/systemd/system/sysstat-collect.timer`\
  \ 命令来编辑配置文件。\n\n```\n...\n# Activates activity collector every 2 minutes\n\n[Unit]\n\
  \n54\nRH134-RHEL8.0-en-1-20190531\n![](img/00269.jpeg)\nCHAPTER 2 | Scheduling Future\
  \ Tasks\n\nDescription=Run system activity accounting tool every 2 minutes\n\n[Timer]\n\
  OnCalendar=*:00/02\n\n[Install]\nWantedBy=sysstat.service\n```\n\n上述更改会导致 `sysstat-collect.timer`\
  \ 单元每两分钟触发一次 `sysstat-collect.service` 单元，该单元运行 `/usr/lib64/sa/sa1 1 1`。运行 `/usr/lib64/sa/sa1\
  \ 1 1` 会将系统活动数据收集到 `/var/log/sa` 目录下的二进制文件中。\n\n### 4.4. 使用 `systemctl daemon-reload`\
  \ 命令确保 `systemd` 感知到这些更改。\n\n```\n[root@servera ~]# systemctl daemon-reload\n```\n\
  \n### 4.5. 使用 `systemctl` 命令激活 `sysstat-collect.timer` 定时单元。\n\n```\n[root@servera\
  \ ~]# systemctl enable --now sysstat-collect.timer\n```\n\n### 4.6. 使用 `while` 命令等待\
  \ `/var/log/sa` 目录下创建出二进制文件。等待你的 shell 提示符返回。\n\n```\n[root@servera ~]# while [\
  \ $(ls /var/log/sa | wc -l) -eq 0 ]; do sleep 1s; done\n```\n\n在上面的 `while` 命令中，`ls\
  \ /var/log/sa | wc -l` 在文件不存在时返回 `0`，在存在时返回 `1`。`while` 判断此值是否等于 `0`，如果是，则进入循环并暂停一秒。当文件存在时，`while`\
  \ 循环退出。\n\n### 4.7. 使用 `ls -l` 命令验证 `/var/log/sa` 目录下的二进制文件在过去两分钟内被修改过。\n\n```\n\
  [root@servera ~]# ls -l /var/log/sa\ntotal 8\n-rw-r--r--. 1 root root 5156 Mar 25\
  \ 12:34 sa25\n[root@servera ~]# date\nMon Mar 25 12:35:32 +07 2019\n```\n\n上述命令的输出在你的系统上可能有所不同。\n\
  \n### 4.8. 退出 root 用户的 shell。\n\n```\n[root@servera ~]# exit\nlogout\n[student@servera\
  \ ~]$\n```\n\n### 4.9. 从 servera 销登录。\n\n```\n[student@servera ~]$ exit\nlogout\n\
  Connection to servera closed.\n[student@workstation ~]$\n```\n\n### 完成\n\n在工作站上运行\
  \ `lab scheduling-system finish` 来完成本次练习。该脚本将删除整个练习过程中创建的文件，并确保环境整洁。\n\n```\n[student@workstation\
  \ ~]$ lab scheduling-system finish\n```\n\n本指导性练习结束。\n\n\n\n\n\n在你重新加载 systemd 管理配置后，使用以下\
  \ `systemctl` 命令激活 `systemd-tmpfiles-clean.timer` 单元。\n\n```\n[root@host ~]# systemctl\
  \ enable --now systemd-tmpfiles-clean.timer\n```\n\n`systemd-tmpfiles --clean` 命令与\
  \ `systemd-tmpfiles --create` 命令解析相同的配置文件，但它不是创建文件和目录，而是清除所有访问、更改或修改时间晚于配置文件中定义的最大年龄的文件。\n\
  \n`systemd-tmpfiles` 配置文件的格式在 `tmpfiles.d(5)` 手册页中有详细说明。基本语法由七列组成：`Type`、`Path`、`Mode`、`UID`、`GID`、`Age`\
  \ 和 `Argument`。`Type` 指 `systemd-tmpfiles` 应该执行的操作；例如，`d` 表示如果目录不存在则创建目录，或者 `Z`\
  \ 用于递归恢复 SELinux 上下文以及文件权限和所有权。\n\n以下是一些带有解释的示例。\n\n```\nd /run/systemd/seats 0755\
  \ root root -\n```\n\n在创建文件和目录时，如果 `/run/systemd/seats` 目录不存在则创建它，其所有者为用户 `root`\
  \ 和用户组 `root`，权限设置为 `rwxr-xr-x`。此目录不会被自动清除。\n\n```\nD /home/student 0700 student\
  \ student 1d\n```\n\n如果 `/home/student` 目录不存在则创建它。如果它存在，则清空其所有内容。当运行 `systemd-tmpfiles\
  \ --clean` 时，删除所有超过一天未访问、更改或修改的文件。\n\n```\nL /run/fstablink - root root - /etc/fstab\
  \ own\n```\n\n创建一个指向 `/etc/fstab` 的符号链接 `/run/fstablink`。永远不要自动清除此行。\n\n### 配置文件优先级\n\
  \n配置文件可以存在于三个三个位置：\n\n* `/etc/tmpfiles.d/*.conf`\n* `/run/tmpfiles.d/*.conf`\n*\
  \ `/usr/lib/tmpfiles.d/*.conf`\n\n`/usr/lib/tmpfiles.d/` 中的文件是由相关的 RPM 包提供的，你不应该编辑这些文件。`/run/tmpfiles.d/`\
  \ 下的文件本身是易失性文件，通常用于守护进程管理其自身的运行时临时文件。`/etc/tmpfiles.d/` 下的文件用于管理员配置自定义的临时位置，并覆盖供应商提供的默认设置。\n\
  \n如果 `/run/tmpfiles.d/` 中的文件与 `/usr/lib/tmpfiles.d/` 中的文件同名，则使用 `/run/tmpfiles.d/`\
  \ 中的文件。如果 `/etc/tmpfiles.d/` 中的文件与 `/run/tmpfiles.d/` 或 `/usr/lib/tmpfiles.d/` 中的任何文件同名，则使用\
  \ `/etc/tmpfiles.d/` 中的文件。\n\n根据这些优先级规则，你可以通过将相关文件复制到 `/etc/tmpfiles.d/` 然后进行编辑来轻松覆盖供应商提供的设置。以这种工作方式确保了管理员提供的设置可以从中央配置管理系统轻松管理，而不会被包更新所覆盖。\n\
  \n**注意**\n\n在测试新的或修改的配置时，仅应用一个配置文件的命令可能会有用。这可以通过在命令行上指定配置文件的名称来实现。\n\n### 参考文献\n\
  \n`systemd-tmpfiles(8)`、`tmpfiles.d(5)`、`stat(1)`、`stat(2)` 和 `systemd.timer(5)`\
  \ 手册页。\n\n### 引导练习：管理临时文件\n\n在此练习中，你将配置 `systemd-tmpfiles` 以更改其从 `/tmp` 移除临时文件的速度，并定期清除另一个目录中的文件。\n\
