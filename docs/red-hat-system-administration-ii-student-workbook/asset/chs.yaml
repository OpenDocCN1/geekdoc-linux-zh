  # 排除安装\n\n在红帽企业 Linux 8 安装期间，`Anaconda` 提供两个控制台。第一个由 `tmux` 终端复用器提供。你可以通过 `Ctrl+Alt+F1`\
  \ 访问它。第二个控制台默认显示 `Anaconda` 图形界面。你可以通过 `Ctrl+Alt+F6` 访问它。\n\n在第一个控制台中，`tmux` 提供\
  \ shell 提示符。在安装期间可以使用它来检查并排除故障。\n\n下表列出了访问虚拟控制台和 `tmux` 窗口的按键组合。对于 `tmux`，快捷键的操作是：按下并释放\
  \ `Ctrl+b`，然后按下要访问的窗口数字。\n\n| 按键 | 内容 | 序列 |\n| :--- | :--- | :--- |\n| `Ctrl +\
  \ Alt + F1` | 访问 `tmux` 复用器。 | |\n| `Ctrl + b 1` | 在 `tmux` 中，访问安装过程的主页。 | |\n|\
  \ `Ctrl + b 2` | 在 `tmux` 中，提供 root shell。`Anaconda` 将安装日志存储在 `/tmp` 中。 | |\n| `Ctrl\
  \ + b 3` | 在 `tmux` 中，显示 `/tmp/anaconda.log` 文件的内容。 | |\n| `Ctrl + b 4` | 在 `tmux`\
  \ 中，显示 `/tmp/storage.log` 文件的内容。 | |\n| `Ctrl + b 5` | 在 `tmux` 中，显示 `/tmp/program.log`\
  \ 文件的内容。 | |\n| `Ctrl + Alt + F6` | 访问 `Anaconda` 图形界面。 | |\n\n**注意**：为了兼容早期的红帽企业\
  \ Linux 版本，从 `Ctrl+Alt+F2` 到 `Ctrl+Alt+F5` 的虚拟控制台在安装期间也提供 root shell。\n\n### 参考文献\n\
  \n更多信息，请参阅 RHEL 安装部署指南：https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html-single/performing_a_standard_rhel_installation/index\n\
  \n![](img/00344.jpeg)\n\n# 引导练习：安装红帽企业 Linux\n\n在此练习中，你将为其中一台服务器重新安装最小化版本的红帽企业 Linux。\n\
  \n#### 结果\n\n你应该能够手动安装红帽企业 Linux。\n\n## 开始之前\n\n- 在工作站上使用 `student` 作为密码登录 student\
  \ 用户。\n- 在工作站上，运行 `lab installing-install start` 命令。该命令运行一个启动脚本以确定 `servera` 机器在网络上是否可达。\n\
  - 它还在 `GRUB2` 菜单中添加了一个新项，以便引导 `servera` 进入安装媒体。\n\n\n\n\n\n```\n[student@workstation\
  \ ~]$ lab installing-install start\n```\n\n## 1. 访问 servera 的控制台并将系统引导到安装媒体。\n\n\
  ### 1.1. 根据你的教室环境，找到 servera 控制台的图标。打开控制台。\n\n### 1.2. 若要重启，请使用相关的键盘、虚拟设备或菜单项向系统发送\
  \ `Ctrl+Alt+Del`。\n\n### 1.3. 当引导加载程序菜单出现时，选择 `Install Red Hat Enterprise Linux\
  \ 8`。\n\n### 1.4. 等待语言选择窗口出现。\n\n## 2. 保持默认选择的语言并点击 `Continue`（继续）。\n\n## 3. 在 `/dev/vda`\
  \ 磁盘上使用自动分区。\n\n### 3.1. 点击 `Installation Destination`（安装位置）。\n\n### 3.2. 点击第一块磁盘\
  \ `vda` 以选择它。点击 `Done`（完成）使用自动分区的默认选项。\n\n### 3.3. 在 `Installation Options`（安装选项）窗口中，点击\
  \ `Reclaim space`（回收空间）。由于 `/dev/vda` 磁盘已存在之前安装的分区和文件系统，此选择允许你清除磁盘以进行新安装。在 `Reclaim\
  \ Disk Space` 窗口中，点击 `Delete all`（全部删除）然后点击 `Reclaim space`（回收空间）。\n\n350\nRH134-RHEL8.0-en-1-20190531\n\
  ![](img/0037.jpeg)\n第 12 章 | 安装 Red Hat Enterprise Linux\n\n## 4. 将服务器主机名设置为 `servera.lab.example.com`\
  \ 并验证网络接口的配置。\n\n### 4.1. 点击 `Network & Host Name`（网络与主机名）。\n\n### 4.2. 在 `Host\
  \ Name`（主机名）字段输入 `servera.lab.example.com`，然后点击 `Apply`（应用）。\n\n### 4.3. 点击 `Configure`（配置），然后点击\
  \ `IPv4 Settings` 标签。\n\n### 4.4. 确认网络参数正确。IP 地址为 `172.25.250.10`，子网掩码为 `24`，网关和\
  \ DNS 服务器均设置为 `172.25.250.254`。点击 `Save`（保存）。\n\n### 4.5. 通过将 `ON/OFF` 设置为 `ON`\
  \ 来确认网络接口已启用。\n\n### 4.6. 点击 `Done`（完成）。\n\n## 5. 将安装源字段设置为 `http://content.example.com/rhel8.0/x86_64/dvd`。\n\
  \n### 5.1. 点击 `Installation Source`（安装源）。\n\n### 5.2. 在 `http://` 字段输入 `content.example.com/rhel8.0/x86_64/dvd`。\n\
  \n### 5.3. 点击 `Done`（完成）。\n\n## 6. 选择运行最小化安装所需的软件。\n\n### 6.1. 点击 `Software Selection`（软件选择）。\n\
  \n### 6.2. 从 `Base Environment`（基础环境）列表中选择 `Minimal Install`（最小化安装）。\n\n### 6.3.\
  \ 点击 `Done`（完成）。\n\n## 7. 配置系统的用途。\n\n### 7.1. 点击 `System Purpose`（系统用途）。\n\n###\
  \ 7.2. 选择角色 `Red Hat Enterprise Linux Server`（Red Hat Enterprise Linux 服务器）。\n\n\
  ### 7.3. 选择 `SLA` 级别为 `Self-Support`（自支持）。\n\n### 7.4. 选择用为 `Development/Test`（开发/测试）。\n\
  \n### 7.5. 点击 `Done`（完成）。\n\n## 8. 点击 `Begin Installation`（开始安装）。\n\n## 9. 在安装过程中，将\
  \ root 密码设置为 `redhat`。\n\n### 9.1. 点击 `Root Password`（root 密码）。\n\n### 9.2. 在 `Root\
  \ Password` 字段输入 `redhat`。\n\n### 9.3. 在 `Confirm`（确认）字段输入 `redhat`。\n\n### 9.4.\
  \ 密码较弱，你需要点击两次 `Done`。\n\n351\nRH134-RHEL8.0-en-1-20190531\n![](img/0018.jpeg)\n\
  第 12 章 | 安装 Red Hat Enterprise Linux\n\n## 10. 在安装过程中，添加学生用户。\n\n### 10.1. 点击 `User\
  \ Creation`（用户创建）。\n\n### 10.2. 在 `Full Name`（全名）字段输入 `student`。\n\n### 10.3. 勾选\
  \ `Make this user administrator`（使此用户成为管理员），以便 `student` 可以使用 `sudo` 以 `root` 身份运行命令。\n\
  \n### 10.4. 在 `Password`（密码）字段输入 `student`。\n\n### 10.5. 在 `Confirm password`（确认密码）字段输入\
  \ `student`。\n\n### 10.6. 密码较弱，你需要点击两次 `Done`。\n\n## 11. 安装完成后，点击 `Reboot`（重启）。\n\
  \n## 12. 当系统显示登录提示时，使用密码 `student` 登录 `student`。\n\n### 完成\n使用适用于教室环境的方法重置你的 `servera`\
