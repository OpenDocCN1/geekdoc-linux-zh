  \ | 安装 Red Hat Enterprise Linux\n\n### 安装和配置虚拟机\n\n### 目标\n\n完成本节后，你应该能够使用 Cockpit\
  \ 在你的 Red Hat Enterprise Linux 服务器上安装虚拟机。\n\n### 介绍 KVM 虚拟化\n\n虚拟化是一项允许将单台物理机划分为多个虚拟机（VM），每个虚拟机都可以运行独立的操作系统。\n\
  \nRed Hat Enterprise Linux 8 支持 KVM（基于内核的虚拟机），这是一种构建在标准 Linux 内核中的全虚拟化解决方案。KVM 可以运行多个\
  \ Windows 和 Linux 客户端操作系统。\n\n图 12.5：KVM 虚拟化\n\n在 Red Hat Enterprise Linux 中，可以使用\
  \ `virsh` 命令或 Cockpit 的虚拟机工具管理 KVM。\n\n\n\nKVM 虚拟机技术适用于所有 Red Hat 产品，从独立的 Red Hat\
  \ Enterprise Linux 物理实例到 Red Hat OpenStack Platform 均可用：\n\n* 物理硬件系统运行 Red Hat Enterprise\
  \ Linux 以提供 KVM 虚拟化支持。Red Hat Enterprise Linux 通常是一个“厚宿主机”（thick host），即在支持虚拟机的同时，还提供其他本地和网络服务、应用程序以及管理功能。\n\
  * Red Hat Virtualization (RHV) 提供了一个集化的 Web 界面，允许管理员管理整个虚拟基础架构。它包含了 KVM 迁移、冗余和高可用性等高级功能。Red\
  \ Hat Virtualization Hypervisor 是经过调优的 Red Hat Enterprise Linux 版本，专门用于配置和支持虚拟机的这一单一目的。\n\
  * Red Hat OpenStack Platform (RHOSP) 提供了创建、部署和扩展公有云或私有云的基础。\n\n# 第 12 章 | 安装 Red\
  \ Hat Enterprise Linux\n\nRed Hat 支持运行以下操作系统的虚拟机：\n\n* Red Hat Enterprise Linux\
  \ 6 及更高版本\n* Microsoft Windows 10 及更高版本\n* Microsoft Windows Server 2016 及更高版本\n\
  \n## 将 Red Hat Enterprise Linux 物理系统配置为虚拟化主机\n\n管理员可以将 Red Hat Enterprise Linux\
  \ 系统配置为虚拟化主机，适用于开发、测试、训练或需要同时运行多个操作系统的场景。\n\n### 安装虚拟化工具\n\n安装 `virt` Yum 模块以为系统成为虚拟化主机做准备。\n\
  \n```bash\n[root@host ~]# yum module list virt\n```\nName Stream Profiles Summary\
  \ virt rhel [d][e] common [d] Virtualization module Hint: [d]efault, [e]abled, [x]disabled,\
  \ [i]nstalled\n\n```bash\n[root@host ~]# yum module install virt\n```\n...输出省略...\n\
  \n### 验证系统要求\n\n对于 x86 系统，KVM 需要带有 Intel VT-x 和 Intel 64 扩展的 Intel 处理器，或者带有 AMD-V\
  \ 和 AMD64 扩展的 AMD 处理器。使用 `virt-host-validate` 命令验证您的硬件并检查系统要求。\n\n```bash\n[root@host\
  \ ~]# virt-host-validate\n```\nQEMU: Checking for hardware virtualization : PASS\n\
  QEMU: Checking if device /dev/kvm exists : PASS\nQEMU: Checking if device /dev/kvm\
  \ is accessible : PASS\nQEMU: Checking if device /dev/vhost-net exists : PASS\n\
  QEMU: Checking if device /dev/net/tun exists : PASS\nQEMU: Checking for cgroup 'memory'\
  \ controller support : PASS\nQEMU: Checking for cgroup 'memory' controller mount-point\
  \ : PASS\nQEMU: Checking for cgroup 'cpu' controller support : PASS\nQEMU: Checking\
  \ for cgroup 'cpu' controller mount-point : PASS\nQEMU: Checking for cgroup 'cpuacct'\
  \ controller support : PASS\nQEMU: Checking for cgroup 'cpuacct' controller mount-point\
  \ : PASS\nQEMU: Checking for cgroup 'cpuset' controller support : PASS\nQEMU: Checking\
  \ for cgroup 'cpuset' controller mount-point : PASS\nQEMU: Checking for cgroup 'devices'\
  \ controller support : PASS\nQEMU: Checking for cgroup 'devices' controller mount-point\
  \ : PASS\nQEMU: Checking for cgroup 'blkio' controller support : PASS\nQEMU: Checking\
  \ for cgroup 'blkio' controller mount-point : PASS\nQEMU: Checking for device assignment\
  \ IOMMU support : PASS\n\n系统必须通过所有验证项目才能作为 KVM 主机。\n\n## 使用 COCKPIT 管理虚拟机\n\n`virt`\
  \ Yum 模块提供了 `virsh` 命令来管理您的虚拟机。Cockpit 工具为 KVM 管理和虚拟机创建提供了 Web 控制台界面。\n\n安装 `cockpit-machines`\
  \ 软件包以在 Cockpit 中添加“虚拟机”菜单。\n\n```bash\n[root@host ~]# yum install cockpit-machines\n\
  ```\n\n如果 Cockpit 尚未运行，请启动并启用它。\n\n```bash\n[root@host ~]# systemctl enable --now\
  \ cockpit.socket\n```\n\n要使用 Cockpit 创建新的虚拟机，请访问 Cockpit Web 界面中的“虚拟机”菜单。从那里开始，点击“创建虚拟机”（Create\
  \ VM），并在“创建新虚拟机”窗口中输入虚拟机配置。\n\n* **名称 (Name)** 为虚拟机配置设置域名。此名称与您在安装的虚拟机中为系统设置的主主机无关。\n\
  * **安装源类型 (Installation Source Type)** 是获取安装 ISO 文件的方法。包括本地文件系统，或 HTTPS、FTP 或 NFS\
  \ URL。\n* **安装源 (Installation Source)** 提供安装源的路径。\n* **操作系统供应商和操作系统 (OS Vendor and\
  \ Operating System)** 指明虚拟机的操作系统。虚拟化层会呈现与所选操作系统兼容的硬件仿真。\n* **内存 (Memory)** 是分配给新虚拟机的\
  \ RAM 容量。\n* **存储大小 (Storage Size)** 是分配给新虚拟机的磁盘。安装后可以将额外的磁盘与虚拟机关联。\n* **立即启动虚拟机\
  \ (Immediately Start VM)** 表示在点击“创建”后是否应立即启动虚拟机。\n\n点击“创建”创建虚拟机并点击“安装”开始安装操作系统。Cockpit\
  \ 会显示虚拟机控制台，您可以在其中安装系统。\n\n### 参考文献\n\n欲了解更多信息，请参阅 [URL] 上的虚拟化配置与管理指南。\n\n什么是虚拟化？\n\
