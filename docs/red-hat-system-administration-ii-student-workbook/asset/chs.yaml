  ```\n\n# 控制 SELINUX 端口标签标记\n\n### 目标\n完成本节后，你应该能够验证网络端口是否具有正确的 SELinux 类型，以便服务能够绑定到这些端口上。\n\
  \n## SEL 端口标签标记\nSELinux 的功能不仅限于文件和进程标记。网络流量也受到 SELinux 策略的严格执行。SELinux 用于控制网络流量的方法之一是给网络端口标记；例如，在目标策略（targeted\
  \ policy）中，端口 `22/TCP` 关联有 `ssh_port_t` 标签。默认的 HTTP 端口 `80/TCP` 和 `443/TCP` 关联有\
  \ `http_port_t` 标签。\n\n每当进程想要监听某个端口时，SELinux 会检查与该进程（作用域）关联的标签是否允许绑定该端口标签。这可以防止恶意服务接管本由其他（合法的）网络服务使用的端口。\n\
  \n## 管理 SELINUX 端口标签\n如果你决定在非标准端口上运行服务，SELinux 几乎会阻止流量。在这种情况下，你必须更新 SELinux 端口标签。在某些情况下，目标策略已经将该端口标记为可用的类型；例如，由于端口\
  \ `8008/TCP` 通常用于 Web 应用，该端口已标记为 `http_port_t`，这是 Web 服务器的默认端口类型。\n\n### 列出端口标签\n\
  要获取所有当前端口标签分配的概述，请运行 `semanage port -l` 命令。`-l` 选项以这种形式列出所有当前分配：`port_label_t tcp|udp\
  \ comma,separated,list,of,ports`。\n\n示例输出：\n```bash\n[root@host ~]# semanage port\
  \ -l\n...省略部分输出...\nhttp_cache_port_t tcp 8080, 8118, 8123, 10001-10010\nhttp_cache_port_t\
  \ udp 3130\nhttp_port_t tcp 80, 81, 443, 488, 8008, 8009, 8443, 9000\n...省略部分输出...\n\
  ```\n\n要精简搜索，使用 `grep` 命令：\n```bash\n[root@host ~]# semanage port -l | grep ftp\n\
  ftp_data_port_t tcp 20\nftp_port_t tcp 21, 989, 990\nftp_port_t udp 989, 990\ntftp_port_t\
  \ udp 69\n```\n注意，端口标签可能会输出中出现两次，一次针对 TCP，一次针对 UDP。\n\n### 管理端口标签\n使用 `semanage`\
  \ 命令分配新的端口标签、删除端口标签或修改现有的标签。\n\n**重要**\nLinux 发行版中提供的大多数标准服务都提供设置端口标记的 SELinux 策略模块。你无法通过\
  \ `semanage` 更改这些端口的标签；要更改它们，你需要替换策略模块。编写和生成策略模块不在课程范围内。\n\n要向现有端口标签（类型）添加端口，使用以下语法。`-a`\
  \ 添加新端口标签，`-t` 指定类型，`-p` 指定协议。\n\n```bash\n[root@host ~]# semanage port -a -t port_label\
  \ -p tcp|udp PORTNUMBER\n```\n\n例如，允许 gopher 服务监听端口 `71/TCP`：\n```bash\n[root@host~]#\
  \ semanage port -a -t gopher_port_t -p tcp 71\n```\n\n要查看默认策略的本地更改，管理员可以为 `semanage`\
  \ 命令添加 `-C` 选项。\n```bash\n[root@host~]# semanage port -l -C\n```\nSELinux Port Type\
  \ Proto Port Number\ngopher_port_t tcp 71\n\n**注意**\n目标策略带有大量的端口类型。\n\n`selinux-policy-doc`\
  \ 包中的服务的 SELinux 手页包含有关 SELinux 类型、布尔值和端口类型的文档。如果你的系统中尚未安装这些手页，请按照此程序操作：\n```bash\n\
  [root@host ~]# yum -y install selinux-policy-doc\n```\n\n```bash\n[root@host ~]#\
  \ man -k _selinux\n```\n\n\n\n\n移除自定义端口标签的语法与添加端口标签的语法相同，但不再使用 `-a` 选项（添加），而是使用\
  \ `-d` 选项（删除）。\n\n例如，要移除端口 71/TCP 到 `gopher_port_t` 的绑定：\n\n```bash\n[root@host\
  \ ~]# semanage port -d -t gopher_port_t -p tcp 71\n```\n\n# 修改端口绑定\n\n若需更改端口绑定（可能是因为因为需求发生了变化），请使用\
  \ `-m`（修改）选项。\n\n这种方法比删除旧绑定再添加新绑定要高效得多。\n\n例如，要将端口 71/TCP 从 `gopher_port_t` 修改为\
  \ `http_port_t`，管理员可以使用以下命令：\n\n```bash\n[root@server ~]# semanage port -m -t http_port_t\
  \ -p tcp 71\n```\n\n与之前一样，使用 `semanage` 命令查看修改结果。\n\n```bash\n[root@server ~]# semanage\
  \ port -l -C\n```\n\nSELinux 端口类型 协议 端口号\n\n`http_port_t` tcp 71\n\n```bash\n[root@server\
  \ ~]# semanage port -l | grep http\n```\n\n`http_cache_port_t` tcp 8080, 8118, 8123,\
  \ 10001-10010\n\n`http_cache_port_t` udp 3130\n\n`http_port_t` tcp 71, 80, 81, 443,\
  \ 488, 8008, 8009, 8443, 9000\n\n`pegasus_http_port_t` tcp 5988\n\n`pegasus_https_port_t`\
  \ tcp 5989\n\n### 参考文献\n\n`semanage(8)`, `semanage-port(8)` 以及 `*_selinux(8)` 手页\n\
  \nRH134-RHEL8.0-en-1-20190531\n\n329\n\n![](img/00281.jpeg)\n\n第 11 章 | 网络安全管理\n\
