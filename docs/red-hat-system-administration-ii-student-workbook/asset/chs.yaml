  \ ~]$ lab lvm-extending start\n```\n\n3. 使用 `ssh` 登录 `servera`，身份为 `student`。\n\
  ```\n[student@workstation ~]$ ssh student@servera\n```\n\n4. 使用 `sudo` 切换到 `root`\
  \ 用户。\n```\n[student@servera]$ sudo -i\n```\n\n5. 使用 `vgdisplay` 检查卷组是否有可用空间。\n\
  ```\n[root@servera]# vgdisplay\n```\n\n6. 使用 `df -h` 查看当前挂载的文件系统空间。\n```\n[root@servera]#\
  \ df -h /data\n```\n\n7. 使用 `parted` 在 `/dev/vdb` 上创建一个 512MiB 的分区。\n```\n[root@servera]#\
  \ parted /dev/vdb\n```\n\n8. 设置分区类型为 `lvm`。\n```\n(parted) set unit MiB\n(parted)\
  \ unit primary\n```\n\n9. 使用 `mkpart` 创建主分区。\n```\n(parted) mkpart primary lvm 0B\
  \ 512MiB\n```\n\n10. 使用 `pvcreate` 将 `/dev/vdb1` 初始化为物理卷。\n```\n[root@servera]#\
  \ pvcreate /dev/vdb1\n```\n\n11. 使用 `vgextend` 将物理卷添加到卷组 `servera`。\n```\n[root@servera]#\
  \ vgextend servera /dev/vdb1\n```\n\n12. 使用 `vgdisplay` 确认卷组空间情况。\n```\n[root@servera]#\
