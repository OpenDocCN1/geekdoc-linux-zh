  success\n```\n\n### 8.2.\n使用 `firewall-cmd --reload` 命令重载防火墙设置的更改。\n\n```bash\n\
  [root@serverb ~]# firewall-cmd --reload\nsuccess\n```\n\n### 9.\n在 `serverb` 上调查并修复\
  \ Apache HTTPD 守护进程的问题，该进程配置监听端口 `30080/TCP`，但启动失败。适当调整防火墙设置，允许端口 `30080/TCP` 的入站连接。\n\
  \n### 9.1.\n使用 `systemctl` 命令重启 `httpd` 服务。该命令未能重启服务。\n\n```bash\n[root@serverb\
  \ ~]# systemctl restart httpd.service\nJob for httpd.service failed because the\
  \ control process exited with error code.\nSee \"systemctl status httpd.service\"\
  \ and \"journalctl -xe\" for details.\n```\n\n### 9.2.\n使用 `systemctl status` 命令调查\
  \ `httpd` 服务失败的原因。\n\n```bash\n[root@serverb ~]# systemctl status httpd.service\n\
