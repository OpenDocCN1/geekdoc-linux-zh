  ```\n\n## 评估\n\n在工作站上，运行 `lab boot-review grade` 脚本确认此练习成功。\n\n```\n[student@workstation\
  \ ~]$ lab boot-review grade\n```\n\n## 结束\n\n在工作站上，运行 `lab boot-review finish` 脚本完成实验。\n\
  \n```\n[student@workstation ~]$ lab boot-review finish\n```\n\n实验结束。\n\n\n\n\nLinux\
  \ 内核还包含了 `nftables`，这是一个新的过滤和数据包分类子系统，它增强了 `netfilter` 代码的部分内容，但保留了 `netfilter`\
  \ 架构，例如网络栈钩子、连接跟踪系统和日志设施。`nftables` 更新的优势在于数据包处理更快、规则集更新更快，并且可以通过同一条规则同时处理 IPv4\
  \ 和 IPv6 数据。`nftables` 与原始 `netfilter` 的另一个主要区别在于它们的接口。`Netfilter` 通过多个实用程序框架进行配置，包括\
  \ `iptables`、`ip6tables`、`arptables` 和 `ebtables`，这些现在已被弃用。`Nftables` 使用单一的 `nft`\
  \ 用户空间工具，允许所有协议管理都通过单一接口进行，消除了了由多样化前端和多个 `netfilter` 接口引起的历史冲突。\n\n# 介绍 firewalld\n\
  \n`firewalld` 是一个动态防火墙管理器，是使用 `nft` 命令的 `nftables` 框架前端。在引入 `nftables` 之前，`firewalld`\
  \ 使用 `iptables` 命令直接配置 `netfilter`，作为 `iptables` 服务的改进替代。在 RHEL 8 中，`firewalld`\
  \ 仍然是推荐的前端，使用 `nft` 管理防火墙规则集。\n\n`firewalld` 仍然能够读取和管理 `iptables` 配置文件和规则集，使用 `xtables-nft-multi`\
  \ 将 `iptables` 对象直接翻译为 `nftables` 规则和对象。尽管强烈建议不要，但在现有 `iptables` 规则集无法被 `nft` 翻译正确处理的复杂用例中，可以将\
  \ `firewalld` 配置回 `iptables` 后端。\n\n应用程序通过 `D-Bus` 接口查询子系统。`firewalld` 子系统由 `firewalld`\
  \ RPM 包提供，未包含最小安装中，但包含在基础安装中。通过 `firewalld`，通过将所有网络流量分类为区域，简化了防火墙管理。根据数据包的源 IP 地址或进入的网络接口等标准，流量被重定向到相应区域的防火墙规则中。每个区域都有自己的端口和服务列表，这些列表可以是开放或关闭的。\n\
  \n注意\n对于经常更改网络的笔记本电脑或其他机器，可以使用 `NetworkManager` 自动为连接设置防火墙区域。这些区域使用适用于特定连接的规则进行自定义。这在家庭、工作场所和公共无线网络之间往来时特别有用。用户可能希望在连接到家庭和公司网络时，其系统的\
  \ `sshd` 服务是可访问的，但在连接到当地咖啡馆的公共无线网络时不可访问。\n\n`firewalld` 会检查进入系统的每个数据包的源地址。如果该源地址分配给特定区域，则应用该区域的规则。如果源地址未分配给区域，`firewalld`\
  \ 将数据包与入网络接口的区域关联，并应用该区域的规则。如果由于某些原因网络接口未与区域关联，则 `firewalld` 将数据包与默认区域关联。\n\n默认区域不是一个独立的区域，而是对现有区域的指定。起初，`firewalld`\
  \ 将 `public` 区域指定为默认区域，并将 `lo` 回环接口映射到 `trusted` 区域。\n\n大多数区域允许流量通过防火墙，这匹配了特定的端口和协议列表（例如\
  \ `631/udp`）或预定义的服务（例如 `ssh`）。如果流量不匹配允许的端口、协议或服务，它通常会被拒绝。（默认允许所有流量的 `trusted` 区域是此的一个例外。）\n\
  \n## 预定义区域\n\n`firewalld` 具有预定义的区域，每个区域都可以进行自定义。默认情况下，所有区域都允许任何由系统发起的通信入站流量以及所有出站流量。下表详细说明了这些初始区域配置。\n\
  \n### Firewalld 区域的默认配置\n\n| 区域名称 | 默认配置 |\n| :--- | :--- |\n| `trusted` | 允许所有入站流量。\
  \ |\n| `home` | 拒绝入站流量，除非与出站流量相关或匹配 `ssh`、`mdns`、`ipp-client`、`samba-client` 或 `dhcpv6-client`\
  \ 预定义服务。 |\n| `internal` | 拒绝入站流量，除非与出站流量相关或匹配 `ssh`、`mdns`、`ipp-client`、`samba-client`\
  \ 或 `dhcpv6-client` 预定义服务（初始与 `home` 区域相同）。 |\n| `work` | 拒绝入站流量，除非与出站流量相关或匹配 `ssh`、`ipp-client`\
  \ 或 `dhcpv6-client` 预定义服务。 |\n| `public` | 拒绝入站流量，除非与出站流量相关或匹配 `ssh` 或 `dhcpv6-client`\
  \ 预定义服务。新添加网络接口的默认区域。 |\n| `external` | 拒绝入站流量，除非与出站流量相关或匹配 `ssh` 预定义服务。通过此区域转发的出站\
  \ IPv4 流量将被伪装成源自出站网络接口的 IPv4 地址。 |\n| `dmz` | 拒绝入站流量，除非与出站流量相关或匹配 `ssh` 预定义服务。 |\n\
  | `block` | 拒绝所有入站流量，除非与出站流量相关。 |\n| `drop` | 丢弃所有入站流量，除非与出站流量相关（甚至不响应 ICMP 错误）。\
  \ |\n\n有关可用预定义区域的列表和预期用途，请参见 `firewalld.zones(5)`。\n\n## 预定义服务\n\n`firewalld` 拥有许多预定义服务。这些服务定义帮助你识别要配置特定的网络服务。例如，无需研究\
  \ `samba-client` 服务的相关端口，只需指定预构建的 `samba-client` 服务即可配置正确的端口和协议。下表列出了初始防火墙区域使用的预定义服务。\n\
  \n### 选定的 Firewalld 服务\n\n| 服务名称 | 配置 |\n| :--- | :--- |\n| `ssh` | 本地 SSH 服务器。访问\
  \ `22/tcp` |\n| `dhcpv6-client` | 本地 DHCPv6 客户端。访问 `fe80::/64` 上的 `546/udp` |\n\
  | `ipp-client` | 本地 IPP 打印。访问 `631/udp` |\n| `samba-client` | 本地 Windows 文件和打印共享客户端。访问\
  \ `137/udp` 和 `138/udp` |\n| `mdns` | 多播 DNS (mDNS) 本地链路名称解析。访问 `5353/udp` 到 `224.0.0.251`\
  \ (IPv4) 或 `ff02::fb` (IPv6) 多播地址。 |\n\n注意\n许多预定义服务包含在 `firewalld` 包中。使用 `firewall-cmd\
  \ --get-services` 可以列出它们。预定义服务的配置文件位于 `/usr/lib/firewalld/services`，其格式由 `firewalld.zone(5)`\
  \ 定义。\n\n# 配置防火墙\n\n管理员通过三种方式与 `firewalld` 交互：\n\n- 直接编辑 `/etc/firewalld/` 中的配置文件（本章未讨论）\n\
  - Web Console 图形界面\n- `firewall-cmd` 命令行工具\n\n## 使用 Web Console 配置防火墙服务\n\n要使用 Web\
  \ Console 配置防火墙服务，请点击“重复我的密码用于特权任务”选项以权限访问登录。这允许用户以 `sudo` 权限执行命令以修改防火墙服务。\n\n点击左侧导航菜单中的\
  \ `Networking` 选项，在主网络页面显示防火墙部分。点击 `Firewall` 链接以访问允许的服务列表。\n\n\n\n列出的允许的服务是当前防火墙允许通过的服务。点击服务名称左侧的箭头（`\
  \ > `）可查看服务详情。要添加服务，点击“防火墙允许服务”（Firewall Allowed Services）页面右上角的“添加服务...”（Add Services...）按钮。\n\
