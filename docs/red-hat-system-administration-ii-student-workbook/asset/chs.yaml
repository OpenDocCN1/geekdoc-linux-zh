  \n37\n\n![](img/0028.jpeg)\n\n# 第 2 章 | 计划未来任务\n\n## 引导练习：安排延迟任务\n\n### 目标\n\n完成本节后，你应该能够：\n\
  \n### 描述延迟任务\n\n### 检查和管理延迟任务\n\n要获取当前待处理任务的概览，使用 `atq` 或 `at -l` 命令。\n\n```bash\n\
  [user@host ~]$ atq\n```\n\n```text\n28  Mon Feb 2 05:13:00 2015  a  user\n29  Mon\
  \ Feb 3 16:00:00 2014  a  user\n27  Tue Feb 4 12:00:00 2014  a  user\n```\n\n在前面的输出中，每一行代表一个安排在未来执行的不同任务。\n\
  \n* 该任务的唯一编号。\n* 计划执行的日期和时间。\n* 表示任务安排在默认队列 `a` 中。\n* 任务的所有者（以及任务运行的用户）。\n\n###\
  \ 注意\n\n非特权用户只能查看和控制自己的任务。root 用户可以查看并管理所有任务。\n\n要检查执行时将运行的实际命令，使用 `at -c JOBNUMBER`\
  \ 命令。该命令显示设置任务的环境，以反映创建任务的用户的环境，随后是实际运行的命令。\n\n### 移除任务\n\n`atrm JOBNUMBER` 命令删除已安排的任务。当任务不再需要时删除它，例如当远程防火墙配置成功且不需要重置时。\n\
