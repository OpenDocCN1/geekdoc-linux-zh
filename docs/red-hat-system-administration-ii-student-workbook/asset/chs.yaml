  磁盘 `/dev/vdb`: 5369MB\n扇区大小（逻辑/物理）：512B/512B\n分区表：`gpt`\n\n| 编号 | 开始 | 结束 | 大小 |\
  \ 文件系统 | 名称 | 标记 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | 1049kB\
  \ | 2000MB | 1999MB | xfs | | backup |\n| 2 | 2000MB | 2512MB | 513MB | | swap1\
