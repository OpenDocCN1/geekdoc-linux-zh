  [root@serverb ~]# mkswap /dev/vdb3\nSetting up swapspace version 1, size = 488 MiB\
  \ (511700992 bytes) no label, UUID=4d9b847b-98e0-4d4e-9ef7-dfaaf736b942\n```\n记下这两个交换空间的\
  \ `UUIDs`。你将在下一步中使用这些信息。如果你已经无法看到 `mkswap` 的输出，请使用 `lsblk --fs` 命令来获取 `UUIDs`。\n\
  \n#### 4.2. 编辑 `/etc/fstab` 并定义新的交换空间。为了使 `swap2` 分区的交换空间优先级高于 `swap1`，请通过 `pri`\
