  ### 红帽系统管理员 II\n本课程专为已完成 Red Hat System Administration I (`RH124`) 的学生设计。Red Hat\
  \ System Administration II (`RH134`) 侧重于成为全职 Linux 员所需的所需的关键任务，并通过红帽认证系统管理员（RHCSA）考试来验证这些技能。本课程将深入探讨企业级\
  \ Linux 管理，包括文件系统和分区、逻辑卷、SELinux、防火墙和故障排除。\n\n## 课程目标\n- 扩展和加强在 Red Hat System Administration\
  \ I (`RH124`) 课程中学技能。\n- 构建 `RHCSA` 认证红帽 Enterprise Linux 系统管理员所需的技能。\n\n## 目标读者\n\
  - 本课程专为学生设计\n\n\n\n\n已完成红帽系统管理 I (`RH124`) 的课程。主题的安排方式使得学生不适合将 `RH134` 作为课程的切入点。鼓励未修过之前的红帽课程的学生，如果他们是\
  \ Linux 新手，可以参加系统管理 I (`RH124`)；如果他们具有企业级 Linux（Enterprise Linux）管理经验，可以参加 RHCSA\
  \ 快速通道课程 (`RH200`)。\n\n## 先决条件\n- 上过过红帽系统管理 I (`RH124`) 课程或具有同等知识。\n\nRH134-RHEL8.0-en-1-20190531\n\
  \n![](img/00121.jpeg)\n\n### 简介\n\n### 课堂环境介绍\n图 0.1：课堂环境\n\n在本课程中，用于实践学习活动的主要计算机系统是\
  \ `workstation`。\n\n学生在这些活动还会使用另外两台机器：`servera` 和 `serverb`。这三个系统都在 `lab.example.com`\
  \ 域下。\n\n所有学生计算机系统都有一个标准用户账户 `student`，密码为 `student`。所有学生系统上的 root 密码均为 `redhat`。\n\
  \n### 课堂机器\n\n| 机器名称 | IP 地址 | 角色 |\n| :--- | :--- | :--- |\n| `bastion.lab.example.com`\
  \ | `172.25.250.254` | 连接学生私有网络到课堂服务器的网关系统（必须始终运行） |\n| `workstation.lab.example.com`\
  \ | `172.25.250.9` | 用于系统管理的图形工作站 |\n| `servera.lab.example.com` | `172.25.250.10`\
  \ | 第一台服务器 |\n| `serverb.lab.example.com` | `172.25.250.11` | 第二台服务器 |\n\n`bastion`\
  \ 的主要功能是充当连接学生机器网络与课堂网络之间的路由器。如果 `bastion` 宕机，其他学生机器将只能访问单个学生网络上的系统。\n\nRH134-RHEL8.0-en-20190531\n\
  \n![](img/00385.jpeg)\n\n简介\n\n课堂中的几个系统提供支持服务。两台服务器 `content.example.com` 和 `materials.example.com`\
  \ 是实践活动使用的软件和实验材料的来源。关于如何使用这些服务器的信息将在相应活动的说明中提供。它们由 `classroom.example.com` 虚拟机提供。为了正常使用实验室，`classroom`\
  \ 和 `bastion` 应该始终运行。\n\n### 注意事项\n在登录 `servera` 或 `serverb` 时，你可能会看到一条关于激活 `cockpit`\
  \ 的消息。可以忽略该消息。\n\n```bash\n[student@workstation ~]$ ssh student@serverb\nWarning:\
  \ Permanently added 'serverb,172.25.250.11' (ECDSA) to the list of known hosts.\n\
  Activate the web console with: systemctl enable --now cockpit.socket\n[student@serverb\
  \ ~]\n```\n\n## 控制你的系统\n学生在红帽在线学习课堂中分配了远程计算机。这些计算机通过托管在 `rol.redhat.com` http://rol.redhat.com\
  \ 的 Web 应用程序访问。学生应使用他们的红帽客户门户用户凭登录该站点。\n\n### 控制虚拟机\n你课堂环境中的虚拟机通过网页进行控制。课堂中每台虚拟机的状态显示在页面“在线实验室”（Online\
  \ Lab）标签页下。\n\n### 机器状态\n\n| 虚拟机 | 说明 | 状态 |\n| :--- | :--- | :--- |\n| | 虚拟机正在启动。\
  \ | 启动中 (STARTING) |\n| | 虚拟机正在运行并可用（或在启动时，很快将可用）。 | 已启动 (STARTED) |\n| | 虚拟机正在关闭。\
  \ | 停止中 (STOPPING) |\n| | 虚拟机已完全关闭。启动时，虚拟机将进入与关闭时相同的状态（磁盘将被保留）。 | 已停止 (STOPPED)\
  \ |\n| | 正在进行虚拟机的初始创建。 | 发布中 (PUBLISHING) |\n| | 虚拟机正在等待其他虚拟机启动。 | 等待启动 (WAITING_TO_START)\
  \ |\n\n根据机器的状态，可以选择以下操作。\n\nRH134-RHEL8.0-en-20190531\n\n![](img/00313.jpeg)\n\n\
  简介\n\n### 课堂/机器操作\n\n| 按钮或操作 | 说明 | 操作 |\n| :--- | :--- | :--- |\n| | 创建 ROL 课堂。创建课堂所需的所有虚拟机并启动它们。可能需要几分钟完成。\
  \ | 准备实验室 (PROVISION LAB) |\n| | 删除 ROL 课堂。删除课堂中的所有虚拟机。注意：磁盘上生成的任何工作都会丢失。 | 删除实验室\
  \ (DELETE LAB) |\n| | 启动课堂中的所有虚拟机。 | 启动实验室 (START LAB) |\n| | 停止课堂中的所有虚拟机。 | 关闭实验室\
  \ (SHUTDOWN LAB) |\n| | 在浏览器中打开新标签页并连接到虚拟机的控制台。学生可以直接登录虚拟机并运行命令。在大多数情况下，学生应该登录到\
  \ `workstation` 虚拟机并使用 `ssh` 连接到其他虚拟机。 | 打开控制台 (OPEN CONSOLE) |\n| | 启动（电源）虚拟机。\
  \ | 启动 (ACTION → Start) |\n| | 正常关闭虚拟机，保留磁盘内容。 | 关 (ACTION → Shutdown) |\n| | 强制关闭虚拟机，保留磁盘内容。这等同于从物理机器断电。\
  \ | 关机 (ACTION → Power Off) |\n| | 强制关闭虚拟机并将磁盘重置为初始状态。注意：生成的任何工作都会丢失。 | 重置 (ACTION\
  \ → Reset) |\n\n在练习开始时，如果指示重置单台虚拟机，点击 `ACTION → Reset`。在练习开始时，如果指示重置所有虚拟机，点击 `DELETE\
  \ LAB` 删除整个环境。在实验室删除后，你可以点击 `PROVISION LAB` 准备一个新的实验室。\n\n### 警告\n`DELETE LAB` 操作无法撤销。你在课堂环境中已完成的所有工作都将丢失。\n\
  \n### 自动停止计时器\n红帽在线学习入学学生可以使用一定的时间。为了帮助节省分配时间，ROL 课堂关联了一个倒计时计时器，计时器过期后将关闭课堂环境。\n\
  \n要调整计时器，点击 `MODIFY` 显示新的自动停止对话框。设置课堂应自动停止的小时。点击 `ADJUST TIME` 将此更改应用于计时器设置。\n\n\
  RH134-RHEL8.0-en-20190531\n\n![](img/0432.jpeg)\n\n简介\n\n# 国际化\n\n## 用户语言选择\n**用户可能希望在桌面环境中使用与系统默认设置不同的语言。他们可能还希望为账户使用不同的键盘布局或输入法。\n\
  \n### 语言设置\n在 GNOME 桌面环境中，用户在首次登录时可能会被提示设置首选语言和输入法。如果没有，个人用户调整首选语言和输入法设置的最简单方法是使用“区域与语言”（Region\
  \ & Language）应用程序。\n\n你可以通过两种方式启动此应用程序：在终端窗口中运行 `gnome-control-center region` 命令，或者在顶栏右角的系统菜单中选择设置按钮（图标为交叉螺丝刀和扳手）。\n\
  \n在打开的窗口中，选择“区域与语言”。点击语言框并从列表中选择首选语言。这将把格式设置设置为该语言的默认值。下次登录时，这些更改将完全生效。\n\n这些设置会影响\
  \ GNOME 桌面环境以及在其内部启动的应用程序（如 `gnome-terminal`）。但是默认情况下，如果通过远程系统的 `ssh` 登录或在虚拟控制台（如\
  \ `tty5`）上进行文本登录，这些设置不会适用于该账户。\n\n\n\n\n你可以让你的 shell 环境使用与图形环境相同的 `LANG` 设置，即使你通过基于文本的虚拟控制台或\
  \ ssh 登录也是如此。实现此点的方法之一是在 `~/.bashrc` 文件中放置类似于下面的代码。此示例代码将文本登录时使用的语言设置为与用户当前的 GNOME\
  \ 桌面环境设置的语言：\n\n```bash\ni=$(grep 'Language=' /var/lib/AccountsService/users/${USER}\
  \ \\\n| sed 's/Language=//')\n\nif [ \"$i\" != \"\" ]; then\nexport LANG=$i\nfi\n\
  ```\n\n日语、韩语、中文以及其他非拉丁字符集的语言可能无法在文本的虚拟控制台上正常显示。\n\n通过在命令行上设置 `LANG` 变量，可以让单个命令使用另一种语言：\n\
  \nRH134-RHEL8.0-en-1-20190531\n\nxv\n\n![](img/00059.jpeg)\n\n### 介绍\n```\n[user@host\
  \ ~]$ LANG=fr_FR.utf8 date\njeu. avril 25 17:55:01 CET 2019\n```\n随后的命令将恢复到使用系统的默认语言进行输出。可以使用\
  \ `locale` 命令来确定 `LANG` 的当前值以及其他相关的环境变量。\n\n### 输入法设置\nRed Hat Enterprise Linux\
  \ 7 或更高版本中的 GNOME 3 自动使用 IBus 输入法选择系统，这使得快速更改键盘布局和输入法变得简单。\n\n可以使用“区域与语言”应用程序来启用备输入法。在“区域与语言”应用程序窗口中，“输入源”框显示当前可用的输入法。默认情况下，英语（美国）可能是唯一的可用方法。高亮英语（美国）并点击键盘图标可以查看当前的键盘布局。\n\
  \n要添加另一种输入法，请点击“输入源”窗口左下角的 `+` 按钮。\n\n将打开“添加输入源”窗口。选择您的语言，然后选择您偏好的输入法或键盘布局。\n\n\
  当配置了多一个输入法时，用户可以通过输入 `Super+Space`（有时称为 `Windows+Space`）在它们之间快速切换。GNOME 顶部栏还会出现一个状态指示器，它具有两个功能：它指示哪种输入法处于激活状态，并作为一个菜单，用于在输入法之间切换或选择更复杂输入方法的高级功能。\n\
  \n某些方法标记有齿轮，这表示这些方法具有高级配置选项和功能。例如，日语（假名汉字）输入法允许用户用拉丁字母预编辑文本，并使用 `Down Arrow` 和 `Up\
  \ Arrow` 键选择所需的正确字符。\n\n美国英语使用者可能也会发现这很有用。例如，在“英语（美国）”下有一个键盘布局“英语（国际版 AltGr 死键）”，它将\
  \ PC 104/105 键键盘上的 `AltGr`（或右 Alt）视为视为“次级 Shift”修饰键和死键激活键，用于输入额外的字符。此外还有 Dvorak\
  \ 和其他备用布局可用。\n\n### 注意\n如果你知道字符的 Unicode 代码点，则可以在 GNOME 桌面环境中输入任何 Unicode 字符。输入\
  \ `Ctrl+Shift+U`，然后输入代码点。在输入 `Ctrl+Shift+U` 之后，将显示一个带下划线的 `u`，表示系统正在等待输入 Unicode\
  \ 代码点。\n\n例如，希腊小写字母 lambda 的代码点为 `U+03BB`，可以通过输入 `Ctrl+Shift+U`，然后 `03BB`，最后按 `Enter`\
  \ 来输入。\n\n### 系统全局默认语言设置\n系统的默认语言设置为美国英语，使用 Unicode 的 UTF-8 编码作为字符集（`en_US.utf8`），但可以在安装期间或之后进行更改。\n\
  \n从命令行，root 用户可以使用 `localectl` 命令更改系统全局区域语言设置。如果不带参数运行 `localectl`，它将显示当前的系统全局区域语言设置。\n\
  \nxvi\nRH134-RHEL8.0-en-1-20190531\n\n![](img/00218.jpeg)\n\n### 介绍\n要设置系统全局默认语言，运行命令\
  \ `localectl set-locale LANG= locale`，其中 `locale` 是本章“语言代码参考”表中 `LANG` 环境变量的适当值。更改将在用户下次登录时生效，并存储在\
  \ `/etc/locale.conf` 中。\n\n```\n[root@host ~]# localectl set-locale LANG=fr_FR.utf8\n\
  ```\n\n在 GNOME 中，管理用户可以通过点击窗口右上角的“登录屏幕”按钮从“区域与语言”更改此设置。更改图形登录屏幕的语言也将调整存储在 `/etc/locale.conf`\
  \ 配置文件中的全局默认语言设置。\n\n#### 重要\n如 `tty4` 等文本虚拟控制台在可以显示的字体方面比运行图形环境的虚拟控制台中的终端或 ssh\
  \ 会话的伪终端更有限。例如，日语、韩语和中文字符在文本虚拟控制台上可能无法按预期显示。因此，你应该考虑使用英语或其他带有拉丁字符集的语言作为系统全局默认语言。\n\
  \n同样，文本虚拟控制台支持的输入法也较有限，而且这是与图形桌面环境分开管理的。\n\n可用的全局输入设置可以通过 `localectl` 为文本虚拟控制台和图形环境进行配置。详情请参阅\
