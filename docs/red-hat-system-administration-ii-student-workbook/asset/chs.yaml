  \n\n\n\n# 诊断和修复文件系统问题\n\n`/etc/fstab` 中的错误和文件系统损坏会导致系统无法启动。在大多数情况下，`systemd` 会进入一个需要\
  \ root 密码的紧急修复 shell。\n\n下表列出了一些常见错误及其结果。\n\n### 常见文件系统问题\n\n| 问题 | 结果 |\n| :---\
  \ | :--- |\n| 文件系统损坏 | `systemd` 尝试修复文件系统。如果问题严重到无法自动修复，系统将把用户置于紧急 shell。 |\n| 设备或\
  \ UUID 不存在 | `systemd` 会等待一段特定的时间，等待 `/etc/fstab` 中引用的设备可用。如果设备不可用，系统将在超时后用户置于紧急\
  \ shell。 |\n| `/etc/fstab` 中不存在的挂载点 | 系统将用户置于紧急 shell。 |\n| `/etc/fstab` 中指定了错误的挂载选项\
  \ | 系统将用户置于紧急 shell。 |\n\n在所有情况下，管理员都可以使用紧急目标（emergency target）来诊断和修复问题，因为在显示紧急\
  \ shell 之前，没有任何文件系统被挂载。\n\n#### 注意：\n使用紧急 shell 解决文件系统问题时，不要忘记在编辑 `/etc/fstab` 后运行\
  \ `systemctl daemon-reload`。如果没有刷新，`systemd` 可能继续使用旧版本。\n\n`/etc/fstab` 文件条目中的 `nofail`\
  \ 选项允许系统即使在该文件系统挂载失败也能启动。在正常情况下不要使用此选项。使用 `nofail` 应用程序可以在缺少存储的情况下启动，可能会导致严重后果。\n\
  \n### 参考文献\n`systemd-fsck(8)`、`systemd-fstab-generator(8)` 和 `systemd.mount(5)`\
  \ 手页\n\n---\n\n# 引导练习：在启动时修复文件系统问题\n\n在此练习中，你将从由于 `/etc/fstab` 配置错误导致启动失败的系统中恢复系统。\n\
  \n### 目标\n你应该能够诊断 `/etc/fstab` 问题并使用紧急模式恢复系统。\n\n#### 准备\n在工作站上使用密码 `student` 以学生用户身份登录。\n\
  \n在工作站上，运行 `lab boot-repairing start` 命令。该命令运行一个启动脚本，确定 servera 机器在网络上是否可用。它还会引入一个文件系统问题，为\
  \ GRUB2 设置更高的超时时间，并重启 `servera`。\n\n```\n[student@workstation ~]$ lab boot-repairing\
  \ start\n```\n\n#### 1. 访问 servera 控制台并注意启动过程在早期阶段卡住了。\n1.1. 根据你的教室环境找到 `servera\
  \ console` 图标。打开控制台。注意某个启动作业似乎没有完成。花一点时间推测这种行为可能的原因。\n1.2. 若要重启，请使用相应的按钮或菜单项向系统发送\
  \ `Ctrl+Alt+Del`。对于这种特定的启动问题，此组合键可能不会立即终止正在运行的任务，你可能需要等待任务超时后系统才会重启。如果你在不发送 `Ctrl+Alt+Del`\
  \ 的情况下等待任务超时，系统最终会自动生成紧急 shell。\n1.3. 当启动加载程序菜单出现时，按任何键（`Enter` 除外）中断倒计时。\n\n####\
  \ 2. 查看上次启动的错误，看起来系统部分仍然仍在运行。因为你知道 root 密码 `redhat`，请尝试紧急启动。\n2.1. 使用光标键高亮默认启动加载程序项。\n\
  2.2. 按 `e` 编辑当前项。\n2.3. 使用光标键导航到以 `linux` 开头的行。\n2.4. 按 `End` 将光标移动到行末尾。\n2.5. 在行尾附加\
  \ `systemd.unit=emergency.target`。\n2.6. 按 `Ctrl+x` 使用修改后的配置启动。\n\n#### 3. 登录紧急模式。root\
  \ 密码为 `redhat`。\n```\nGive root password for maintenance (or press Control-D to\
  \ continue): redhat\n[root@servera ~]#\n```\n\n#### 4. 确定当前挂载了哪些文件系统。\n```\n[root@servera\
  \ ~]# mount\n...output omitted...\n/dev/vda1 on / type xfs (ro,relatime,seclabel,attr2,inode64,noquota)\n\
  ...output omitted...\n```\n注意根文件系统是以只读模式挂载的。\n\n#### 5. 重新挂载根文件系统为读写模式。\n```\n[root@servera\
  \ ~]# mount -o remount,rw /\n```\n\n#### 6. 使用 `mount -a` 命令尝试挂载所有其他文件系统。使用 `--all\
  \ (-a)` 选项，命令将挂载 `/etc/fstab` 中列出的尚未挂载的文件系统。\n```\n[root@servera ~]# mount -a\n\
  mount: /RemoveMe: mount point does not exist.\n```\n\n#### 7. 编辑 `/etc/fstab` 以修复问题。\n\
  7.1. 移除或注释掉错误的行。\n```\n[root@servera ~]# vim /etc/fstab\n...output omitted...\n\
  # /dev/sdz1 /RemoveMe xfs defaults 0 0\n```\n7.2. 更新 `systemd` 以让系统注册新的 `/etc/fstab`\
  \ 配置。\n```\n[root@servera ~]# systemctl daemon-reload\n[root@servera ~]#\n```\n\n\
  #### 8. 通过尝试挂载所有条目验证验证 `/etc/fstab` 现在是正确的。\n```\n[root@servera ~]# mount -a\n[root@servera\
  \ ~]#\n```\n\n#### 9. 重启系统并等待启动完成。系统现在应该可以正常启动了。\n```\n[root@servera ~]# systemctl\
  \ reboot\n```\n\n### 结束\n在工作站上，运行 `lab boot-repairing finish` 脚本完成此练习。\n```\n[student@workstation\
