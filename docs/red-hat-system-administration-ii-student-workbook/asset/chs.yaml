  \n这结束了章节。\n\n[content] \n/ \n\n译文：\n\n第 12 章\n\n安装红帽 Linux 企业版\n\nINSTALLING RED\
  \ HAT\n\nENTERPRISE LINUX\n\n目标\n\n在服务器和虚拟机上安装红帽 Linux。\n\n目标\n\n- 在服务器上安装红帽 Linux。\n\
  - 使用 Kickstart 自动化安装过程。\n- 使用 Cockpit 在你的红帽服务器上安装虚拟机。\n\n章节\n\n- 安装红帽 Linux（包含引导练习）\n\
  - 使用 Kickstart 自动化安装（包含引导练习）\n- 安装和配置虚拟机（包含测试）\n\n实验室\n\n安装红帽 Linux\n\nRH134-RHEL8.0-en-20190531\n\
  \n345\n\n![](img/0117.jpeg)\n\n第 12 章 | 安装红帽 Linux 企业版\n\n安装红帽企业版\n\nENTERPRISE\
  \ LINUX\n\n目标\n\n在完成本节后，你应该能够在服务器上安装红帽 Linux。\n\n选择安装媒体\n\n红帽提供了多种安装媒体，你可以通过客户门户网站使用你的有效订阅进行下载。\n\
  \n- 二进制 DVD 包含 Anaconda、红帽 Linux 安装程序以及 BaseOS 和 AppStream 软件包仓库。这些仓库包含了完成安装所需的全部软件包。\n\
  \n- 启动引导 ISO 包含 Anaconda，但需要配置网络以访问通过 HTTP、FTP 或 NFS 提供的软件包仓库。\n\n- QCOW2 镜像包含一个预构建的系统磁盘，准备好在云或企业虚拟化环境中部署。QCOW2（QEMU\
  \ 写时复制）是红帽使用的标准镜像格式。\n\n\n\n\n\n红帽提供了四种支持的处理器架构的安装媒体：x86 64 位（AMD 和 Intel）、IBM Power\
  \ Systems（小端序）、IBM Z 和 ARM 64 位。\n\n下载后，将 DVD 或启动 ISO 刻录到物理介质中，将每个镜像复制到 USB 闪存器或类似设备中，或者从网络服务器发布每个镜像以供\
  \ Kickstart 自动使用。\n\n# 使用 Composer 构建镜像\n\nComposer 是 RHEL 8 中可用的一种新工具。对于特定的用例，Composer\
  \ 允许管理员构建自定义系统镜像，以便部署在云平台或虚拟环境中。\n\nComposer 使用 `Cockpit` 图形化 Web 控制台。它也可以通过 `composer-cli`\
  \ 命令从命令行进行调用。\n\n# 使用 ANACONDA 进行手动安装\n\n使用二进制 DVD 或启动 ISO，管理员可以在裸机服务器或虚拟机上安装新的\
  \ RHEL 系统。`Anaconda` 程序支持两种安装方法：\n\n- 手动安装通过与用户交互，以查询 `Anaconda` 应该如何安装和配置系统。\n\
  - 自动安装使用 `Kickstart` 文件，该文件告诉 `Anaconda` 如何安装系统。随后的章节将更详细地讨论 Kickstart 安装。\n\n#\
  \ 使用图形界面安装 RHEL\n\n当从二进制 DVD 或启动 ISO 启动系统时，`Anaconda` 作为图形化应用程序启动。\n\n![](img/00482.jpeg)\n\
  ![](img/00017.jpeg)\n\n## 第 12 章 | 安装红帽企业 Linux\n\n在“欢迎使用 Red Hat Enterprise Linux\
  \ 8”屏幕上，选择安装期间使用的语言。这也会设置安装后的系统默认语言。个人用户可以在安装后选择他们自己账户的偏好语言。\n\n`Anaconda` 会显示 `Installation\
  \ Summary`（安装摘要）窗口，这是在开始安装之前自定义参数的中心位置。\n\n图 12.1：安装摘要窗口\n\n从此窗口，可以通过按任何顺序选择图标来配置安装参数。选择某项以查看或编辑。在任何项目中，点击\
  \ `Done`（完成）返回中心屏幕。\n\n`Anaconda` 使用三角形警告符号和消息标记必选项目。屏幕底部橙色状态栏提醒您，在开始安装之前仍有必选项目需要完成。\n\
  \n根据需要完成以下项目：\n\n- **Keyboard**（键盘） - 添加额外的键盘布局。\n- **Language Support**（语言支持） -\
  \ 选择要安装的额外语言。\n- **Time & Date**（时间与日期） - 通过点击交互式地图选择系统所在的城市，或从下拉列表中选择。即使使用网络时间协议\
  \ (`NTP`)，也要指定本地时区。\n- **Installation Source**（安装源） - 提供 `Anaconda` 安装所需的源包位置。如果使用二进制\
  \ DVD，则安装源字段已指向 DVD。\n- **Software Selection**（软件选择） - 选择要安装的基础环境，以及任何额外的插件。`Minimal\
  \ Install`（最小化安装）环境仅安装运行红帽企业 Linux 所需的核心包。\n\n![](img/00367.jpeg)\n![](img/00280.jpeg)\n\
  \n- **Installation Destination**（安装目标） - 选择并对要安装红帽企业 Linux 的磁盘进行分区。此项目要求管理员能够理解分区方案和文件系统选择标准。自动分区的默认单选按钮使用所有可用空间分配选定的存储设备。\n\
  - **KDUMP** - `Kdump` 是一个内核功能，在内核崩溃时收集系统内存内容。红帽工程师可以分析 `kdump` 以识别崩溃原因。使用此 `Anaconda`\
  \ 项目来启用或禁用 `Kdump`。\n- **Network & Host Name**（网络与主机名） - 左侧列出检测的网络连接。选择一个连接以显示详细信息。要配置所选的网络连接，点击\
  \ `Configure`。\n- **SECURITY POLICY**（安全策略） - 通过激活安全策略配置（例如支付卡行业数据安全标准 `PCI DSS`\
  \ 配置），`Anaconda` 在安装期间应用由选配置定义的限制和建议。\n- **System Purpose**（系统用途） - 一项新安装功能，通过分配活动系统权限来匹配预期的系统用途。\n\
  \n根据需要，需要完成以下项目：\n\n- **Keyboard** - 添加额外的键盘布局。\n- **Language Support** - 选择要安装的额外语言。\n\
  - **Time & Date** - 通过点击交互式地图选择系统所在的城市，或从下拉列表中选择。即使使用网络时间协议 (`NTP`)，也要指定本地时区。\n\
  - **Installation Source** - 提供 `Anaconda` 安装所需的源包位置。如果使用二进制 DVD，则安装源字段已指向 DVD。\n\
  - **Software Selection** - 选择要安装的基础环境，以及任何额外的插件。`Minimal Install`（最小化安装）环境仅安装运行红帽企业\
  \ Linux 所需的核心包。\n\n- **Installation Destination** - 选择并对要安装红帽企业 Linux 的磁盘进行分区。此项目要求管理员能够理解分区方案和文件系统选择标准。自动分区的默认单选按钮使用所有可用空间分配选定的存储设备。\n\
  - **KDUMP** - `Kdump` 是一个内核功能，在内核崩溃时收集系统内存内容。红帽工程师可以分析 `kdump` 以识别崩溃原因。使用此 `Anaconda`\
  \ 项目来启用或禁用 `Kdump`。\n- **Network & Host Name** - 左侧列出检测的网络连接。选择一个连接以显示详细信息。要配置所选的网络连接，点击\
