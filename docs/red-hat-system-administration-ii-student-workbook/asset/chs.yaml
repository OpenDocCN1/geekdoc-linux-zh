  \ ~]$ lab rhcsa-compreview2 finish\n```\n\n综合回顾结束。\n\n---\n\n# 解决方案\n\n## 配置和管理文件系统与存储\n\
  \n在本次回顾中，你将创建一个 LVM 逻辑卷，挂载网络文件系统，创建一个在启动时自动激活的交换分区，配置从系统内核清理未使用的临时文件，并使用 ACL 保护目录。\n\
  \n### 预期结果\n\n你应该能够：\n\n- 创建一个 LVM 逻辑卷。\n- 挂载网络文件系统。\n- 创建一个在启动时自动激活的交换分区。\n- 配置从系统内核清理未使用的临时文件。\n\
  - 使用 ACL 保护目录。\n\n## 在开始之前\n\n在重置之前，将任何你想要保留的文件或工作复制到其他系统。现在重置工作站、`servera` 和 `serverb`\
  \ 系统，除非你刚刚在上一个练习结束时重置过它们。\n\n使用密码 `student` 以 `student` 身份登录工作站。\n\n在工作站上，运行 `lab\
  \ rhcsa-compreview2 start` 开始综合回顾。该脚本将创建设置环境所需的文件。\n\n```bash\n[student@workstation\
  \ ~]$ lab rhcsa-compreview2 start\n```\n\n## 指令\n\n在 `serverb` 上执行以下任务以完成综合回顾。\n\
  \n- 在名为 `extra_storage` 的新 2 GiB 卷组中配置名为 `vol_home` 的新 1 GiB 逻辑卷。使用未分区的 `/dev/vdb`\
  \ 磁盘创建分区。\n- 逻辑卷 `vol_home` 应使用 `XFS` 文件系统类型格式化，并挂载到 `/home-directories`。\n- 确保名为\
  \ `/share` 的网络文件系统在重启后持久地挂载到 `/local-share`。服务器 `servera.lab.example.com` 导出了 `/share`\
  \ 网络文件系统。NFS 导出路径为 `servera.lab.example.com:/share`。\n- 在 `/dev/vdc` 磁盘上创建一个新的 512\
  \ MiB 分区作为交换空间。该交换空间必须在启动时自动激活。\n- 创建名为 `production` 的新组。创建 `production1`、`production2`、`production3`\
  \ 和 `production4` 用户。确保他们使用名为 `production` 的新组作为补充组。\n\n- 配置你的系统，使用名为 `/run/volatile`\
  \ 的新目录存储临时文件。如果该目录中的文件超过 30 秒未被访问，则应根据时间进行清理。该目录的八进制权限必须为 `0700`。确保你使用 `/etc/tmpfiles.d/volatile.conf`\
  \ 文件来配置 `/run/volatile` 中文件的时间清理。\n- 创建名为 `/webcontent` 的新目录。该目录的所有者和组都应为 `root`。`production`\
  \ 组的成员应该能够读写该目录。`production1` 用户只能读取该目录。这些权限应适用于 `/webcontent` 目录下创建的所有新文件和目录。\n\
  \n1. 从工作站开始，以 `student` 身份打开 `serverb` 的 SSH 会话。\n\n```bash\n[student@workstation\
  \ ~]$ ssh student@serverb\n```\n\n2. 切换到 root 用户。\n\n```bash\n[student@serverb ~]$\
  \ sudo -i\n[sudo] password for student: student\n[root@serverb ~]#\n```\n\n3. 在\
  \ `/dev/vdb` 上创建一个 2 GiB 分区。\n\n```bash\n[root@serverb ~]# parted /dev/vdb mklabel\
  \ msdos\n[root@serverb ~]# parted /dev/vdb mkpart primary 1GiB 3GiB\n```\n\n4. 使用你在\
  \ `/dev/vdb` 上创建的 2 GiB 分区创建一个名为 `vol_home` 的逻辑卷。将卷组命名为 `extra_storage`。\n\n4.1.\
  \ 将块设备 `/dev/vdb1` 声明为物理卷。\n\n```bash\n[root@serverb ~]# pvcreate /dev/vdb1\n```\n\
  \n4.2. 使用 `/dev/vdb1` 创建名为 `extra_storage` 的卷组。\n\n```bash\n[root@serverb ~]# vgcreate\
  \ extra_storage /dev/vdb1\n```\n\n4.3. 创建名为 `vol_home` 的 1 GiB 逻辑卷。\n\n```bash\n\
  [root@serverb ~]# lvcreate -L 1GiB -n vol_home extra_storage\n```\n\n5. 使用 `XFS`\
  \ 文件系统类型格式化 `vol_home` 并将其挂载到 `/home-directories`。\n\n5.1. 创建目录 `/home-directories`。\n\
  \n```bash\n[root@serverb ~]# mkdir /home-directories\n```\n\n5.2. 使用 `XFS` 文件系统类型格式化\
  \ `/dev/extra_storage/vol_home`。\n\n```bash\n[root@serverb ~]# mkfs.xfs /dev/extra_storage/vol_home\n\
  ```\n\n5.3. 将 `/dev/extra_storage/vol_home` 持久地挂载到 `/home-directories`。在 `/etc/fstab`\
  \ 中创建条目时使用 UUID。\n\n```bash\n[root@serverb ~]# lsblk -o UUID /dev/extra_storage/vol_home\n\
  988cf149-0667-4733-abca-f80c6ec50ab6\n[root@serverb ~]# echo \"UUID=988cf149-0667-4733-abca-f80c6ec50ab6\
  \ /home-directories xfs defaults 0 0\" >> /etc/fstab\n[root@serverb ~]# mount -a\n\
  ```\n\n6. 确保名为 `/share` 的网络文件系统在重启后持久地挂载到 `/local-share`。NFS 服务器 `servera.lab.example.com`\
  \ 导出了 `/share` 网络文件系统。NFS 导出路径为 `servera.lab.example.com:/share`。\n\n6.1. 创建目录 `/local-share`。\n\
  \n```bash\n[root@serverb ~]# mkdir /local-share\n```\n\n6.2. 向 `/etc/fstab` 添加适当的条目，以便\
  \ `servera.lab.example.com:/share` 的网络文件系统在重启后持久地挂载到 `/local-share`。\n\n```bash\n\
  [root@serverb ~]# echo \"servera.lab.example.com:/share /local-share nfs rw,sync\
  \ 0 0\" >> /etc/fstab\n```\n\n6.3. 根据 `/etc/fstab` 中的条目挂载网络文件系统到 `/local-share`。\n\
  \n```bash\n[root@serverb ~]# mount /local-share\n```\n\n7. 在 `/dev/vdc` 磁盘上创建一个新的\
  \ 512 MiB 分区作为交换空间。该交换空间必须在启动时自动激活。\n\n7.1. 在 `/dev/vdc` 上创建一个 512 MiB 分区。\n\n```bash\n\
  [root@serverb ~]# parted /dev/vdc mklabel msdos\n[root@serverb ~]# parted /dev/vdc\
  \ mkpart primary 1MiB 513MiB\n```\n\n7.2. 将 `/dev/vdc1` 设置为交换空间。\n\n```bash\n[root@serverb\
  \ ~]# mkswap /dev/vdc1\n```\n\n\n\n\n激活交换空间以便其在重启后依然有效。在 `/etc/fstab` 中创建条目时，请使用该结构的\
  \ UUID。\n\n```bash\n[root@serverb ~]# lsblk -o UUID /dev/vdc1\n```\n```\nUUID\n\
  cc18ccb6-bd29-48a5-8554-546bf3471b69\n```\n\n```bash\n[root@serverb ~]# echo \"\
  UUID= cc18...1b69 swap \\ swap defaults 0 0\" >> /etc/fstab\n[root@serverb ~]# swapon\
  \ -a\n```\n\n### 8. 创建 `production1`、`production2`、`production3` 和 `production4`\
  \ 用户。确保他们使用名为 `production` 的新组作为附加组。\n\n```bash\n[root@serverb ~]# groupadd production\n\
  [root@serverb ~]# for i in 1 2 3 4; do useradd -G production production$i; done\n\
  ```\n\n### 9. 配置系统，使其使用名为 `/run/volatile` 的新目录存储临时文件。如果此目录中的文件超过 30 秒未被访问，则应进行基于时间的清理。该目录的八进制权限必须为\
  \ `0700`。\n\n确保你使用 `/etc/tmpfiles.d/volatile.conf` 文件来配置 `/run/volatile` 中文件的基于时间的清理。\n\
  \n#### 9.1. 创建名为 `/etc/tmpfiles.d/volatile.conf` 的文件，内容如下。\n\n```\nd /run/volatile\
  \ 0700 root root 30s\n```\n\n#### 9.2. 使用 `systemd-tmpfiles --create` 命令创建 `/run/volatile`\
  \ 目录（如果不存在）。\n\n```bash\n[root@servera ~]# systemd-tmpfiles --create /etc/tmpfiles.d/volatile.conf\n\
  ```\n\n### 10. 创建 `/webcontent` 的新目录。目录的所有者和组所有者应该是 `root`。`production` 组的成员应该能够读写该目录。`production1`\
  \ 用户只能读取该目录。\n\n这些权限应应用于 `/webcontent` 目录下创建的所有新文件和目录。\n\n#### 10.1. 创建 `/webcontent`\
  \ 目录。\n\n```bash\n[root@serverb ~]# mkdir /webcontent\n```\n\n#### 10.2. 使用 `setfacl`\
  \ 配置 `/webcontent` 的权限，使得 `production` 组的成员具有读写写权限，但 `production1` 用户除外，该用户仅被授予读取权限。\n\
  \n```bash\n[root@serverb ~]# setfacl -m u:production1:rx /webcontent\n[root@serverb\
  \ ~]# setfacl -m g:production:rwx /webcontent\n```\n\n#### 10.3. 使用 `setfacl` 设置\
  \ `/webcontent` 的默认权限，使得你在上一步中应用的权限也适用于 `/webcontent` 目录下创建的所有新文件和目录。\n\n```bash\n\
  [root@serverb ~]# setfacl -m d:u:production1:rx /webcontent\n[root@serverb ~]# setfacl\
  \ -m d:g:production:rwx /webcontent\n```\n\n#### 10.4. 退出 root 用户的 shell。\n\n```bash\n\
