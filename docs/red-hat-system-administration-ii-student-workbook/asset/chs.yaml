  \n![](img/00448.jpeg)\n\n第 7 章 | 管理逻辑卷\n\n## 引导练习\n\n### 创建逻辑卷\n\n在本实验中，你将创建一个物理卷、卷组、逻辑卷和一个\
  \ XFS 文件系统。你还将持久地挂载逻辑卷文件系统。\n\n#### 结果\n\n你应该能够：\n- 使用 LVM 工具创建物理卷、卷组和逻辑卷。\n- 在逻辑卷上创建新的文件系统并持久地挂载它们。\n\
  \n#### 准备工作\n\n在工作站上以 `student` 用户身份登录。\n\n在工作站上运行 `lab lvm-creating start` 命令。该命令运行\
  \ `servera` 机器是否可用，验证存储是否可用以及安装了相应的软件包。\n\n```bash\n[student@workstation]# lab lvm-creating\n\
  ```\n\n1. 使用 `ssh` 命令以 `student` 用户登录 `servera`。系统配置为使用 SSH 密钥验证，因此不需要密码。\n```bash\n\
  [student@workstation]# student@servera\n...output...\n[student@servera]$\n```\n\n\
  2. 使用 `sudo -i` 命令切换到 root 用户。`student` 的密码是 `student`。\n```bash\n[student@servera]$\
  \ sudo -i\n[sudo] password for student: student\n[root@a]#\n```\n\n3. 创建物理资源。\n\
  \   3.1. 使用 `parted` 创建两个 `256 MiB` 分区并设置为 LVM 类型。\n```bash\n[root@a]# parted -s\
  \ /dev/vdb mklabel gpt\n[root@a]# parted -s /dev/vdb mkpart primary 0 256MiB\n[root@a]#\
  \ parted -s /dev/vdb set 1 lvm\n[root@a]# parted -s /dev/vdb mkpart primary 256MiB\
  \ 512MiB\n[root@a]# parted -s /dev/vdb set 2 lvm\n```\n3.2. 使用 `udevadm settle`\
  \ 让系统注册新分区。\n```bash\n[root@a]# udevadm settle\n```\n\n4. 使用 `pvcreate` 将两个新分区作为\
  \ `PV`。\n```bash\n[root@a]# pvcreate /dev/vdb1 /dev/vdb2\nPhysical volume \"/dev/vdb1\"\
  \ created.\nPhysical volume \"/dev/vdb2\" created.\n```\n\n5. 使用 `vgcreate` 从两个\
  \ `PV` 创建名为 `servera_01_vg` 的 VG。\n```bash\n[root@a]# vgcreate servera_01_vg /dev/vdb1\
  \ /dev/vdb2\nVolume group \"servera_01_vg\" created.\n```\n\n6. 使用 `lvcreate` 从\
  \ `servera_01_vg` VG 创建名为 `servera_01_lv` 的 `400 MiB` LV。\n```bash\n[root@a]# lvcreate\
  \ -n servera_01_lv -L 400M servera_01_vg\nLogical volume \"servera_01_lv\" created.\n\
  ```\n这创建了一个名为 `/dev/servera_01_vg/servera_01_lv` 的设备，但上面没有文件系统。\n\n7. 添加持久文件系统。\n\
  \   7.1. 使用 `mkfs` 命令在 `servera_01_lv` LV 上添加 XFS 文件系统。\n```bash\n[root@a]# mkfs\
  \ -t xfs /dev/servera_01_vg/servera_01_lv\n...output...\n```\n\n7.2. 在 `/data` 创建挂载点。\n\
