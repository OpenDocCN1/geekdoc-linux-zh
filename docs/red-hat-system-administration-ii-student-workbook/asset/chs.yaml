  ![](img/00201.jpeg)\n\n# 第 9 章 | 访问网络附属存储\n\n### 目标\n使用 `NFS` 协议访问网络附属存储。\n\n###\
  \ 目标\n• 从命令行和启动时挂载、使用和卸载 NFS 导出项。\n• 配置具有直接和间接映射的自动挂载器，以根据需要自动挂载 NFS 文件系统，并在不再使用时卸载。\n\
  • 使用新的 `nfsconf` 工具配置 NFS 客户端使用 `NFSv4`。\n\n## 章节\n• 使用 NFS 挂载网络附属存储（以及指导性练习）\n\
  • 自动挂载网络附属存储（以及指导性练习）\n\n## 实验\n访问网络附属存储\n\nRH134-RHEL8.0-en-1-20190531\n257\n![](img/00076.jpeg)\n\
  \n## 第 9 章 | 访问网络附属存储\n\n### 使用 NFS 挂载网络附属存储\n\n### 目标\n完成本节后，你应该能够：\n\n• 识别 NFS\
  \ 共享信息。\n• 创建目录作为挂载点。\n• 使用 `mount` 命令或通过配置 `/etc/fstab` 文件挂载 NFS 共享。\n• 使用 `umount`\
  \ 命令卸载 NFS 共享。\n• 使用新的 `nfsconf` 工具配置 NFS 客户端使用 `NFSv4`。\n\n### 挂载和卸载 NFS 共享\nNFS（网络文件系统）是一种互联网标准协议，被\
  \ Linux、UNIX 和类似的操作系统用作原生网络文件系统。它是一个开放标准，仍在不断增强中，支持原生的 Linux 权限和文件系统功能。\n\nRed Hat\
  \ Enterprise Linux 8 中的默认 NFS 版本是 `4.2`。支持 `NFSv4` 和 `NFSv3` 主版本。不再支持 `NFSv2`。`NFSv4`\
  \ 仅使用 `TCP` 协议与服务器通信；早期的 NFS 版本可以使用 `TCP` 或 `UDP`。\n\nNFS 服务器导出共享项（目录）。NFS 客户端将导出的共享挂载到本地挂载点（目录），该目录必须存在。NFS\
  \ 共享可以通过多种方式进行挂载：\n\n• 使用 `mount` 命令手动挂载。\n• 在启动时使用 `/etc/fstab` 条目自动挂载。\n• 使用 `autofs`\
  \ 服务或 `systemd.automount`set 按需挂载。\n\n#### 挂载 NFS 共享\n要挂载 NFS 共享，请遵循以下三个步骤：\n\n\
  1. **识别**：NFS 客户端系统的管理员可以通过多种方式识别可用的 NFS 共享：\nNFS 服务器管理员可能会提供导出详情，包括安全要求。\n或者，客户端管理员可以通过挂载\
  \ NFS 服务器的根目录并浏览导出的目录来识别 `NFSv4` 共享。请以 root 用户身份执行此操作。\n使用 Kerberos 安全的共享访问将被拒绝，但共享（目录）名称是可见的。其他共享目录可以浏览。\n\
  \n```bash\n[user@host ~]$ sudo mkdir mountpoint\n[user@host ~]$ sudo mount serverb:/\
  \ mountpoint\n[user@host ~]$ sudo ls mountpoint\n```\n\n258\nRH134-RHEL8.0-en-1-20190531\n\
  ![](img/00425.jpeg)\n## 第 9 章 | 访问网络附属存储\n\n2. **挂载点**：使用 `mkdir` 创建挂载点。\n\n```bash\n\
  [user@host ~]$ mkdir -p mountpoint\n```\n\n3. **挂载**：在每情况下，必须以 root 用户身份运行这些命令使\
  \ NFS 共享可用。\n• **临时挂载**：使用 `mount -t nfs -o rw,sync` 挂载 共享：\n```bash\n[user@host\
  \ ~]$ sudo mount -t nfs -o rw,sync serverb:/ mountpoint\n```\n`-t nfs` 是文件系统类型。`-o\
  \ sync` 选项告诉 `mount` 立即同步操作（默认是异步的）。\n该命令用于使 NFS 共享可用，但不是持久的。\n• **永久挂载**：编辑 `/etc/fstab`\
  \ 文件以确保 NFS 共享在启动时可用。\n\n```bash\n[user@host ~]$ sudo vim /etc/fstab\n```\n...\n\
  ```text\nserverb:/ /mountpoint nfs rw 0 0\n```\n然后，挂载 NFS 共享：\n```bash\n[user@host\
  \ ~]$ sudo mount /mountpoint\n```\n由于 `/etc/fstab` 中存在 NFS 共享和挂载选项，因此不需要指定这些。\n\n\
  #### 卸载 NFS 共享\n作为 root 用户（或使用 `sudo`），使用 `umount` 命令卸载 NFS 共享。\n\n```bash\n[user@host\
  \ ~]$ sudo umount mountpoint\n```\n**注意**：卸载共享不会删除其 `/etc/fstab` 条目。除非删除或注释掉该条目，否则下次启动或重启\
  \ NFS 客户端时将重新挂载。\n\n### nfsconf 工具\nRed Hat Enterprise Linux 8 引入了 `nfsconf` 工具来管理\
  \ NFS 客户端和服务器配置（早期版本的 `/etc/sysconfig/nfs` 文件已废弃）。\n\n使用 `nfsconf` 获取、设置或取消 NFS\
  \ 配置参数。\n\n`nfs.conf` 配置文件由多个部分组成，每个部分以方括号中的关键字 `[keyword]` 开始。对于 NFS 服务器，配置 `[nfsd]`\
  \ 部分。值赋值或键由值的名称、等号和值的设置组成，例如 `vers4.2=y`。以 `#` 或 `;` 开头的行会被忽略，任何空行也是如此。\n\n```bash\n\
  [user@host ~]$ sudo cat /etc/nfs.conf\n```\n...输出省略...\n```text\n[nfsd]\n# debug=0\n\
  # threads=8\n# host=\n# port=0\n# grace-time=90\n# lease-time=90\n# tcp=y\n# vers2=n\n\
  # vers3=y\n# vers4=y\n# vers4.0=y\n# vers4.1=y\n# vers4.2=y\n# rdma=n\n#\n```\n\
  默认情况下，`[nfsd]` 部分的键值对被注释掉。然而，注释显示了在未更改的情况下将生效的默认选项。这为你进行 NFS 配置提供了一个良好的起点。\n\n使用\
  \ `nfsconf --set section key value` 为指定部分中的键设置值。\n\n```bash\n[user@host ~]$ sudo\
  \ nfsconf --set nfsd vers4.2 y\n```\n该命令更新了 `/etc/nfs.conf` 配置文件。\n\n\n\n\n\n```bash\n\
  [user@host ~]$ sudo cat /etc/nfs.conf\n\n...输出省略...\n\n[nfsd]\n\nvers4.2 = y\n\n\
  # debug=0\n\n# threads=8\n\n# host=\n\n# port=0\n\n# grace-time=90\n\n# lease-time=90\n\
  \n# tcp=y\n\n# vers2=n\n\n# vers3=y\n\n# vers4=y\n```\n\n260\nRH134-RHEL8.0-en-1-20190531\n\
  \n![](img/00310.jpeg)\n\n# 第 9 章 | 访问网络附属存储\n\n```bash\n# vers4.0=y\n# vers4.1=y\n\
  # vers4.2=y\n# rdma=n\n#\n```\n\n## 使用 `nfsconf` 配置 /etc/nfs.conf\n\n使用 `nfsconf\
  \ --get` 节键来获取指定节中键键的值：\n\n```bash\n[user@host ~]$ sudo nfsconf --get nfsd vers4.2\n\
  y\n```\n\n使用 `nfsconf --unset` 节键来取消指定节中键键的值：\n\n```bash\n[user@host ~]$ sudo nfsconf\
  \ --unset nfsd vers4.2\n```\n\n## 配置仅限 NFSv4 的客户端\n\n你可以通过在 `/etc/nfs.conf` 文件中设置以下值来配置仅限\
  \ NFSv4 的客户端。\n\n首先禁用 UDP 以及其他与 NFSv2 和 NFSv3 相关的键：\n\n```bash\n[user@host ~]$ sudo\
  \ nfsconf --set nfsd udp n\n[user@host ~]$ sudo nfsconf --set nfsd vers2 n\n[user@host\
  \ ~]$ sudo nfsconf --set nfsd vers3 n\n```\n\n启用 TCP 和 NFSv4 相关的键：\n\n```bash\n\
  [user@host ~]$ sudo nfsconf --set nfsd tcp y\n[user@host ~]$ sudo nfsconf --set\
  \ nfsd vers4 y\n[user@host ~]$ sudo nfsconf --set nfsd vers4.0 y\n[user@host ~]$\
  \ sudo nfsconf --set nfsd vers4.1 y\n[user@host ~]$ sudo nfsconf --set nfsd vers4.2\
  \ y\n```\n\n与之前一样，更改将出现在 `/etc/nfs.conf` 配置文件：\n\n```bash\n[user@host ~]$ cat /etc/nfs.conf\n\
  \n[nfsd]\nudp = n\nvers2 = n\nvers3 = n\ntcp = y\nvers4 = y\nvers4.0 = y\nvers4.1\
  \ = y\nvers4.2 = y\n```\n\n261\nRH134-RHEL8.0-en-20190531\n![](img/00027.jpeg)\n\
