  \n### 总结\n\n在本章中，你学习了：\n- 调度一次的作业是延迟作业。\n- 周期性用户作业执行重复计划。\n- Systemd 定器单元可以执行延迟或周期性作业。\n\
  \n67\n\nRH134-RHEL8.0-en-1-20190531\n\n![](img/0230.jpeg)\n\n## 第 3 章 | 系统调优\n\n\
  ### 目标\n\n通过设置调优参数和调整进程优先级提高系统性能。\n\n### 目标\n\n- 通过由 tuned 守护管理的调优配置优化系统性能。\n- 使用\
  \ `nice` 和 `renice` 命令对特定进程优先或降低优先级。\n\n### 章节\n\n- 调整调优配置（引导练习）\n- 影响进程调度（引导练习）\n\
  \n## 实验：调优系统性能\n\n### 目标\n\n完成本节后，你应该能够通过由 tuned 守护管理的调优配置优化系统性能。\n\n#### 系统调优\n\
  \n系统管理员可以根据各种用例负载调整各种设备设置来优化系统性能。tuned 守护进程静态和动态地应用调优调整，使用反映特定负载的调优配置。\n\n#### 配置静态调优\n\
  \ntuned 守护进程在服务启动或选择新的调优配置时应用系统设置。静态调优在配置中配置预定义的内核参数。在静态调优中，内核参数是根据整体预期设置的，不会随着活动水平而调整。\n\
  \n#### 配置动态调优\n\n在动态调优中，tuned 守护进程监控系统活动并根据运行时的变化调整设置。动态调优持续调整以适应当前负载，从调优配置声明的初始设置开始。\n\
  \n例如，存储设备在启动和登录期间使用率高，但当用户负载为使用浏览器和电子邮件客户端时，活动极少。同样，CPU 和网络设备在高峰期间活动会增加。tuned 守护进程监控这些组件的活动，并在高峰期间调整设置以最大化性能，在低活动期间减少设置。tuned\
  \ 守护进程使用预定义调优配置提供的性能参数。\n\n#### 安装并启用 TUNED\n\n最小化的 Red Hat Enterprise Linux 8 安装默认包含并启用了\
  \ tuned 软件包。手动安装并启用该包：\n\n```bash\n[root@host ~]$ yum install tuned\n[root@host\
  \ ~]$ systemctl enable --now tuned\n```\n创建符号链接 `/etc/systemd/system/multi-user.target.wants/tuned.service`\
  \ → `/usr/lib/systemd/system/tuned.service`。\n\n#### 选择调优配置\n\ntuned 应用提供了分为以下类的配置：\n\
  \n- 节能配置\n- 性能增强配置\n\n70\n\nRH134-RHEL8.0-en-1-20190531\n\n![](img/0414.jpeg)\n\n\
  \n\n\n\n性能增强配置文件包含关注以下几个方面的配置文件：\n\n* 存储和网络的低延迟\n* 存储和网络的高吞吐量\n* 虚拟机性能\n* 虚拟化主机性能\n\
  \n# Red Hat Enterprise Linux 8 分发的调优配置方案\n\n| TUNED PROFILE | 用途 |\n| :--- | :---\
  \ |\n| `balanced` | 适用于需要在节电和性能之间取得平衡的系统。 |\n| `desktop` | 源自 `balanced` 配置文件。为交互式应用提供更快的响应。\
  \ |\n| `throughput-performance` | 为最大吞吐量调优系统。 |\n| `latency-performance` | 适用于牺牲功耗以换低延迟的服务器系统。\
  \ |\n| `network-latency` | 源自 `latency-performance` 配置文件。它启用额外的网络调优参数以提供低网络延迟。 |\n\
  | `network-throughput` | 源自 `throughput-performance` 配置文件。应用额外的网络调优参数以实现最大网络吞吐量。\
  \ |\n| `powersave` | 为最大节电调优系统。 |\n| `oracle` | 基于 `throughput-performance` 配置文件，针对\
  \ Oracle 数据库负载进行了优化。 |\n| `virtual-guest` | 如果系统在虚拟机上运行，则为最大性能调优系统。 |\n| `virtual-host`\
  \ | 如果系统作为虚拟机主机，则为最大性能调优系统。 |\n\n# 从命令行管理配置文件\n\n`tuned-adm` 命令用于更改 `tuned` 守护进程的设置。`tuned-adm`\
  \ 命令可以查询当前设置、列出可用配置文件、为系统推荐调优配置、直接更改配置或关闭调优。\n\n系统管理员使用 `tuned-adm active` 来识别当前当前激活的调优配置。\n\
  \n```bash\n[root@host ~]# tuned-adm active\nCurrent active profile: virtual-guest\n\
  ```\n\n`tuned-adm list` 命令列出所有可用的调优配置，包括内置配置和系统管理员创建的自定义调优配置。\n\n```bash\n[root@host\
  \ ~]# tuned-adm list\nAvailable profiles:\n- balanced\n- desktop\n- latency-performance\n\
  - network-latency\n- network-throughput\n- powersave\n- sap\n- throughput-performance\n\
  - virtual-guest\n- virtual-host\nCurrent active profile: virtual-guest\n```\n\n\
  使用 `tuned-adm profile profilename` 将活动配置切换到另一个更符合系统当前调优要求的配置。\n\n```bash\n[root@host\
  \ ~]$ tuned-adm profile throughput-performance\n[root@host ~]$ tuned-adm active\n\
  Current active profile: throughput-performance\n```\n\n`tuned-adm` 命令可以为系统推荐调优配置。该机制用于在系统安装后确定默认配置。\n\
  \n```bash\n[root@host ~]$ tuned-adm recommend\nvirtual-guest\n```\n\n**注意**\n`tuned-adm\
  \ recommend` 的输出基于各种系统特性的，包括系统是否为虚拟机以及在系统安装期间选择的其他预定义类别。\n\n要撤销当前配置所做的设置更改，可以切换到另一个配置或停用\
  \ `tuned` 守护进程。使用 `tuned-adm off` 关闭 `tuned` 调优活动。\n\n```bash\n[root@host ~]$ tuned-adm\
  \ off\n[root@host ~]$ tuned-adm active\nNo current active profile.\n```\n\n# 使用\
  \ Web 控制台管理配置文件\n\n要使用 Web Console 管理系统性能配置，请使用特权登录。点击 `Reuse my password for privileged\
  \ tasks`（在特权任务中重用密码）选项。这允许用户以 `sudo` 权限执行修改系统性能配置的命令。\n\n作为特权用户，点击左侧导航栏中的 `Systems（系统）菜单。当前活动配置显示在\
  \ `Performance Profile（性能配置）字段中。要选择不同的配置，点击活动配置链接。\n\n在 `Change Performance Profile（更改性能配置）用户界面中，滚动配置列表以选择最适合系统用途的配置。\n\
  \n要验证更改，返回系统主页，并确认 `Performance Profile` 字段中显示的是活动配置。\n\n### 参考文献\n`tuned(8)`, `tuned.conf(5)`,\
  \ `tuned-main.conf(5)` 和 `tuned-adm(1)` 手页。\n\n# 引导练习：调整调优配置\n\n在此练习中，你将通过激活 `tuned`\
  \ 服务并应用调优配置来调整服务器性能。\n\n### 预期结果\n你应该能够配置系统使用调优配置。\n\n## 开始之前\n在工作站上使用 `student`\
  \ 密码以学生用户身份登录。\n\n从工作站运行 `lab tuning-profiles start` 命令。该命令运行一个启动脚本以确定服务器主机在网络上是否可达。\n\
  \n```bash\n[student@workstation ~]$ lab tuning-profiles start\n```\n\n## 1\n从工作站使用\
