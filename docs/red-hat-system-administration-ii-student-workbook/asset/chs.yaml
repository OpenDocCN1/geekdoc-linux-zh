  # 控制 SELinux 文件上下文\n\n### 目标\n完成本节后，你应该能够：\n- 使用 `semanage fcontext` 命令管理决定文件和目录默认上下文的\
  \ SELinux 策略规则。\n- 使用 `restorecon` 命令将 SELinux 策略定义的上下文应用到文件和目录。\n\n## 初始 SELinux\
  \ 上下文\n在运行 SELinux 的系统中，所有进程和文件都标记了标签。标签代表与安全相关的信息，即 SELinux 上下文。\n\n新文件通常从父目录继承\
  \ SELinux 上下文，从而确保它们拥有正确的上下文。\n\n但这种继承过程可以通过两种不同的方式被破坏：\n1. 首先，如果你在最终目标位置以外的地方创建一个文件然后移动该文件，该文件仍然具有其创建所在目录的\
  \ SELinux 上下文，而不是目标目录的。\n2. 其次，如果你在保留 SELinux 上下文的情况下复制文件（例如使用 `cp -a` 命令），SELinuxux\
  \ 上下文反映的是原始文件的位置。\n\n以下示例演示了继承及其陷阱。考虑在 `/tmp` 中创建的两个文件，其中一个移动到 `/var/www/html`，另一个复制到相同目录。注意文件的\
  \ SELinux 上下文。移动到 `/var/www/html` 的文件保留了创建所在目录的 SELinux 上下文。复制到相同目录的文件则从父目录继承 SELinux\
  \ 上下文。\n\n## 修改文件的 SELinux 上下文\n更改 SELinux 上下文的命令包括 `semanage fcontext`、`restorecon`\
  \ 和 `chcon`。\n\n设置文件 SELinux 上下文的首选方法是用 `semanage fcontext` 声明默认标签，然后使用 `restorecon`\
  \ 将上下文应用到文件。这确保了即使在完全重新标记后，标签也是符合预期的。\n\n\n\n\n`drwxr-xr-x. root root unconfined_u:object_r:default_t:s0\
  \ /virtual` 正在定义 SELINUX 默认文件上上下文规则\n\n`semanage fcontext` 命令用于显示和修改 `restorecon`\
  \ 用于设置默认文件上下文的规则。它使用扩展正则表达式来指定路径和文件名。\n\n`fcontext` 规则中最常用的扩展正则表达式是 `(/.*)?`，它的意思是\n\
  \n“可选地匹配一个 `/` 及其后的任意数量的字符”。它会递归地匹配表达式之前列出的目录以及该目录下的所有内容。\n\n### 基础文件上下文操作\n\n下表是\
  \ `semanage fcontext` 选项的参考，用于添加、删除或列出 SELinux 文件上下文。\n\n**表格：`semanage fcontext`\
  \ 命令**\n\n| 选项 (OPTION) | 描述 |\n| :--- | :--- |\n| `-a, --add` | 添加指定对象类型的记录 |\n\
  | `-d, --delete` | 删除指定对象类型的记录 |\n| `-l, --list` | 列出指定对象类型的记录 |\n\n为了确保你拥有管理 SELinux\
  \ 上下文的工具，请根据需要安装 `policycoreutil` 包和 `policycoreutil-python` 包。这些包分别包含了 `restorecon`\
  \ 命令和 `semanage` 命令。\n\n要确保目录中的所有文件具有正确的字节上下文，请运行 `semanage fcontext -l` 然后运行 `restorecon`\
  \ 命令。在下面的示例中，请注意运行 `semanage` 和 `restorecon` 命令之前后每个文件的上下文。\n\n```bash\n[root@host\
  \ ~]# ls -Z /var/www/html/file*\nunconfined_u:object_r:user_tmp_t:s0 /var/www/html/file1\n\
  unconfined_u:object_r:httpd_sys_content_t:s0 /var/www/html/file2\n\n[root@host ~]#\
  \ semanage fcontext -l\n...输出已省略...\n/var/www(/.*)? all files system_u:object_r:httpd_sys_content_t:s0\n\
  ...输出已省略...\n```\n\nRH134-RHEL8.0-en-1-20190531\n131\n![](img/00463.jpeg)\n\n第 5\
  \ 章 | 管理 SELinux 安全\n\n```bash\n[root@host; ~]# restorecon -Rv /var/www/\nRelabeled\
  \ /var/www/html/file1 from unconfined_u:object_r:user_tmp_t:s0 to unconfined_u:object_r:httpd_sys_content_t:s0\n\
  \n[root@host ~]# ls -Z /var/www/html/file*\nunconfined_u:object_r:httpd_sys_content_t:s0\
  \ /var/www/html/file1\nunconfined_u:object_r:httpd_sys_content_t:s0 /var/www/html/file2\n\
  ```\n\n下面的示例展示了如何使用 `semanage` 为新目录添加上下文。\n\n```bash\n[root@host ~]# mkdir /virtual\n\
  [root@host ~]# touch /virtual/index.html\n[root@host ~]# ls -Zd /virtual/\ndrwxr-xr-x.\
  \ root root unconfined_u:object_r:default_t:s0 /virtual/\n\n[root@host ~]# ls -Z\
  \ /virtual/\n-rw-r--r--. root root unconfined_u:object_r:default_t:s0 index.html\n\
  \n[root@host ~]# semanage fcontext -a -t httpd_sys_content_t '/virtual(/.*)?'\n\
  [root@host ~]# restorecon -RFvv /virtual\n[root@host ~]# ls -Zd /virtual/\ndrwxr-xr-x.\
  \ root root system_u:object_r:httpd_sys_content_t:s0 /virtual/\n\n[root@host ~]#\
  \ ls -Z /virtual/\n-rw-r--r--. root root system_u:object_r:httpd_sys_content_t:s0\
  \ index.html\n```\n\n参考文献\n`chcon(1)`, `restorecon(8)`, `semanage(8)` 和 `semanage-fcontext(8)`\
  \ 帮助页\n\n132\nRH134-RHEL8.0-en-1-20190531\n![](img/00010.jpeg)\n\n第 5 章 | 管理 SELinux\
  \ 安全\n\n### 引导练习：控制 SELINUX 文件上下文\n\n在本次实验中，你将对目录及其内容的 SELinux 上文进行持久性更改。\n\n####\
  \ 预期\n你应该能够配置 Apache HTTP 服务器，使其从非标准的文档根发布 Web 内容。\n\n## 在开始之前\n在工作站上使用 `student`\
  \ 作为密码登录学生用户。\n\n在工作站上，运行 `lab selinux-filecontexts start` 命令。该命令运行一个启动脚本，用于确定 servera\
  \ 机器是否可以通过网络访问。它还会安装 `httpd` 服务并配置 `servera` 上的防火墙以允许 HTTP 连接。\n\n```bash\n[student@workstation\
  \ ~]$ lab selinux-filecontexts start\n```\n\n1. 使用 `ssh` 命令以学生用户身份登录 `servera`。系统配置为使用\
  \ `SSH` 密钥进行验证，因此不需要密码。\n\n```bash\n[student@workstation ~]$ ssh student@servera\n\
  ...输出已省略...\n[student@servera ~]$\n```\n\n2. 使用 `sudo -i` 命令切换到 root 用户。学生用户的密码是\
  \ `student`。\n\n```bash\n[root@servera ~]$ sudo -i\n[sudo] password for student:\
  \ student\n[root@servera ~]#\n```\n\n3. 配置 Apache 使用新位置的文档根。\n3.1. 使用 `mkdir` 命令创建新的文档根\
  \ `/custom`。\n```bash\n[root@servera ~]# mkdir /custom\n```\n3.2. 使用 `echo` 命令在\
  \ `/custom` 中创建 `index.html` 文件。\n```bash\n[root@servera ~]# echo 'This is SERVERA'\
  \ > /custom/index.html\n```\n3.3. 使用 `vim` 将 `/etc/httpd/conf/httpd.conf` 文件中所有的\
  \ `/var/www/html` 替换为 `/custom`。\n```bash\n[root@servera ~]# vim /etc/httpd/conf/httpd.conf\n\
  ```\n\n4. 使用 `systemctl` 启动并启用 Apache 服务。\n```bash\n[root@servera ~]# systemctl\
  \ enable --now httpd\n```\n4.1. 使用 `systemctl` 命令确认服务正在运行。\n```bash\n[root@servera\
  \ ~]# systemctl status httpd\n● httpd.service - Apache Server\n   Loaded: loaded\
  \ (/lib/systemd/system/httpd.service; enabled; preset: enabled)\n   Active: active\
  \ (running) since Mon 2024-05-25 19:16:00 UTC; 100ms;\n   ...\n```\n\n5. 在工作站上打开浏览器并尝试\
  \ `http://servera/index.html`。你会收到无法访问该文件的错误消息。\n\n6. 为了允许 `servera` 上的 `index.html`，必须配置\
  \ SELinux。定义一个 SELinux 文件上下文规则，将 `/custom` 目录及其所有内容的上下文设置为 `httpd_sys_content_t`。\n\
  ```bash\n[root@servera ~]# semanage fcontext -a -t httpd_sys_content_t '/custom(/.*)?'\n\
  ```\n\n7. 使用 `restorecon` 命令更改文件上下文。\n```bash\n[root@servera ~]# restorecon -Rv\
  \ /custom\nRelabeled /custom from unconfined_u:object_r:default_t:s0 to unconfined_u:object_r:httpd_sys_content_t:s0\n\
  Relabeled /custom/index.html from unconfined_u:object_r:default_t:s0 to unconfined_u:object_r:httpd_sys_content_t:s0\n\
  ```\n\n8. 再次尝试查看 `http://servera/index.html`。你应该看到消息 This SERVERA。\n\n9. 退出 `servera`。\n\
  ```bash\n[root@servera ~]# exit\nlogout\n[student@servera ~]$ exit\nlogout\nConnection\
  \ to servera closed.\n```\n\n完成。在工作站上，运行 `lab selinux-filecontexts finish` 脚本完成本次练习。\n\
  \n```bash\n[student@workstation ~]$ lab selinux-filecontexts finish\n```\n\n###\
  \ 通过布尔值调整 SELlinux 策略\n\nSELinux 布尔值允许你在不重写整个策略的情况下切换特定的策略功能。\n\n### 目标\n在完成本节后，你应该能够：\n\
  - 使用 `setsebool` 激活和禁用 SELinux 策略规则。\n- 使用 `semanage boolean -l` 命令管理 SELinux 布尔值的持久值。\n\
  - 查阅以 `_selinux` 结尾的帮助页以查找有关 SELinux 布尔值的有用信息。\n\n\n\n\nSELinux 布尔值是改变 SELinux 策略行为的开关。SELinux\
  \ 布尔值是可以启用或禁用的规则。安全管理员可以使用它们对策略进行调整，以便选择性的修改。\n\n由 `selinux-policy-doc` 软件包提供的 SELinux\
  \ 手页描述了可用布尔值的用途。`man -k '_selinux'` 命令可以列出这些帮助页。\n\n用于管理 SELinux 布尔值的命令包括 `getsebool`（它用于列出布尔值及其状态）和\
  \ `setsebool`（它用于修改布尔值）。`setsebool -P` 则会修改 SELinux 策略以使修改持久化。而 `semanage boolean\
  \ -l` 则报告某个布尔值是否持久化，并提供该布尔值的简要描述。\n\n非特权用户可以运行 `getsebool` 命令，但必须是超级用户才能运行 `semanage\
  \ boolean -l` 和 `setsebool -P`。\n\n```bash\n[user@host ~]$ getsebool -a\n\nabrt_anon_write\
  \ --> off\n\nabrt_handle_event --> off\n\nabrt_upload_watch_anon_write --> on\n\n\
  antivirus_can_scan_system --> off\n\nantivirus_use_jit --> off\n\n...output omitted...\n\
  \n[user@host ~]$ getsebool httpd_enable_homedirs\n\nhttpd_enable_homedirs --> off\n\
  \n[user@host ~]$ setsebool httpd_enable_homedirs on\n\nCould not change active booleans.\
  \ Please try as root: Permission denied\n\n[user@host ~]$ sudo setsebool httpd_enable_homedirs\
  \ on\n\n[user@host ~]$ sudo semanage boolean -l | grep httpd_enable_homedirs\nhttpd_enable_homedirs\
  \ (on , off) Allow httpd to enable homedirs\n\n[user@host ~]$ getsebool httpd_enable_homedirs\n\
  \nhttpd_enable_homedirs --> on\n```\n\n`-P` 选项将所有待处理值写入策略中，使它们在重启后依然有效。在接下来的示例中，请注意括号中的值：现在现在都已设置为\
  \ on。\n\n136\n\nRH134-RHEL8.0-en-1-20190531\n\n![](img/00098.jpeg)\n\n第 5 章 | 管理\
  \ SELinux 安全\n\n```bash\n[user@host ~]$ setsebool -P httpd_enable_homedirs on\n\n\
  [user@host ~]$ sudo semanage boolean -l | grep httpd_enable_homedirs\nhttpd_enable_homedirs\
  \ (on , on) Allow httpd to enable homedirs\n列出当前状态与默认状态不同的布尔值，请运行 `semanage boolean\
  \ -l -C`。\n\n[user@host ~]$ sudo semanage boolean -l -C\n\nSELinux boolean State\
  \ Default Description\ncron_can_relabel (off , on) Allow cron to can relabel REFERENCES\n\
  ```\n\n`booleans(8)`, `getsebool(8)`, `setsebool(8)`, `semanage(8)`, `semanage-boolean(8)`\
  \ 手页\n\nRH134-RHEL8.0-en-1-20190531\n\n137\n\n![](img/00390.jpeg)\n\n第 5 章 | 管理\
  \ SELinux 安全\n\n## 引导练习：使用布尔值调整 SELINUX 策略\n\nApache 可以发布托管在用户目录中的 Web 内容，但 SELinux\
  \ 默认禁止此操作。在此练习中，你将识别并更改允许 Apache 访问用户目录的 SELinux 布尔值。\n\n### 目标\n你应该能够配置 Apache\
  \ 从用户目录发布 Web 内容。\n\n## 在开始之前\n1. 在工作站上使用密码 `student` 登录为学生用户。\n2. 在工作站上，运行 `lab\
  \ selinux-booleans start` 命令。该命令运行一个启动脚本，判断服务器 `servera` 机器是否可以通过网络访问。它还会安装 `httpd`\
  \ 服务并配置 `servera` 上的防火墙以允许 HTTP 连接。\n\n```bash\n[student@workstation ~]$ lab selinux-booleans\
  \ start\n```\n\n3. 使用 `ssh` 命令以学生用户身份登录 `servera`。系统配置为使用 `SSH` 密钥进行认证，因此不需要密码。\n\
  \n```bash\n[student@workstation ~]$ ssh student@servera\n...output omitted...\n\
  [student@servera ~]$\n```\n\n4. 使用 `sudo -i` 命令切换到 root 用户。学生用户的密码为 `student`。\n\
  \n```bash\n[student@servera ~]$ sudo -i\n[sudo] password for student: student\n\
  [root@servera ~]#\n```\n\n5. 要启用允许用户从家目录发布 Web 内容的 Apache 功能，必须编辑 `/etc/httpd/conf.d/userdir.conf`\
  \ 配置文件。\n注释掉将 `UserDir` 设置为 `disabled` 的行，并取消注释 `UserDir` 设置为 `public_html` 的行的。\n\
  \n```bash\n[root@servera ~]# vim /etc/httpd/conf.d/userdir.conf\n#UserDir disabled\n\
  UserDir public_html\n```\n\n6. 使用 `grep` 命令确认更改。\n\n```bash\n[root@servera ~]# grep\
  \ '#UserDir' /etc/httpd/conf.d/userdir.conf\n#UserDir disabled\n\n[root@servera\
  \ ~]$ grep '^ *UserDir' /etc/httpd/conf.d/userdir.conf\nUserDir public_html\n```\n\
  \n7. 启动并启用 Apache Web 服务使更改生效。\n\n```bash\n[root@servera ~]# systemctl enable --now\
  \ httpd\n```\n\n8. 在另一个终端窗口中以学生身份登录。`SSH` 连接到 `servera`。创建一些从用户目录发布的 Web 内容。\n\n\
  ### 6.1. 在另一个终端窗口中以学生身份登录。使用 `ssh` 命令以学生用户身份登录 `servera`。\n\n```bash\n[student@workstation\
  \ ~]$ ssh student@servera\n...output omitted...\n[student@servera ~]$\n```\n\n###\
  \ 6.2. 使用 `mkdir` 命令创建一个名为 `~/public_html` 的目录。\n\n```bash\n[student@servera ~]$\
  \ mkdir ~/public_html\n```\n\n### 6.3. 创建包含内容的 `index.html` 文件：\n\n```bash\n[student@servera\
  \ ~]$ echo 'This is student content on SERVERA.' > ~/public_html/index.html\n```\n\
  \n### 6.4. 使用 `chmod` 命令更改学生家目录的权限，以便 Apache 能够访问 `public_html` 子目录。\n\n```bash\n\
  [student@servera ~]$ chmod 711 ~\n```\n\n9. 在工作站上打开浏览器并尝试查看以下 URL：`http://servera/~student/index.html`。你会收到一个错误信息，显示你没有访问文件的权限。\n\
  \n10. 在具有 root 权限的终端窗口中，使用 `getsebool` 命令查看是否有限制家目录访问的布尔值。\n\n```bash\n[root@servera\
  \ ~]# getsebool -a | grep home\n...output omitted...\nhttpd_enable_homedirs -->\
  \ off\n...output omitted...\n```\n\n11. 在具有 root 权限的终端窗口中，使用 `setsebool` 命令持久地启用家目录访问。\n\
  \n```bash\n[root@servera ~]# setsebool -P httpd_enable_homedirs on\n```\n\n12. 再次尝试\
  \ `http://servera/~student/index.html`。你应该看到消息：`This is student content on SERVERA`。\n\
  \n13. 退出 servera。\n\n```bash\n[root@servera ~]# exit\nlogout\n[student@servera ~]$\
  \ exit\nlogout\nConnection to servera closed.\n[student@workstation ~]$\n```\n\n\
  ### 完成\n在工作站上运行 `lab selinux-booleans finish` 脚本完成此练习。\n\n```bash\n[student@workstation\
  \ ~]$ lab selinux-booleans finish\n```\n\n引导练习此结束。\n\n140\n\nRH134-RHEL8.0-en-1-20190531\n\
  \n![](img/0433.jpeg)\n\n第 5 章 | 管理 SELinux 安全\n\n## 调查与解决 SELINUX 问题\n\n### 目标\n\
  完成本节后，你应该能够：\n- 使用 SELinux 日志分析工具。\n- 使用 `sealert` 命令在进行 SELinux 故障排除期间显示有用的信息。\n\
  \n### 故障排除 SELINUX 问题\n1. 在考虑进行任何调整之前，请考虑 SELinux 可能正在通过禁止尝试的访问来正确执行其工作。如果 Web 服务器尝试访问\
  \ `/home` 中的文件，如果 Web 内容不是由用户发布的，这可能意味着服务被攻破。\n2. 如果应该授予访问权限，则需要采取额外步骤来解决问题。\n3.\
  \ 最常见的 SELinux 问题是文件上下文不正确。这可能发生在文件在一个具有一种文件上下文的位置被创建，然后移动到一个期望具有不同上下文的地方。在大多数情况下，运行\
  \ `restorecon` 可以修复此问题。以这种方式修复问题对系统其他部分的安全影响非常小。\n\n\n\n\n另一种解决访问限制过严的补方法是调整布尔值。例如，`ftpd_anon_write`\
  \ 布尔值控制匿名 FTP 用户是否可以上传文件。你必须开启此布尔值，以允许匿名 FTP 用户向服务器上传文件。\n\n调整布尔值需要更加小心，因为它们可能会对系统安全产生广泛影响。\n\
  \n## 4.\n\nSELinux 策略可能存在 bug，该 bug 阻止了合法的访问。由于 SELinux 已经非常成熟，这种情况非常罕见。当确定已发现策略\
  \ bug 时，请联系 Red Hat 支持人员报告该 bug，以便其得到解决。\n\n## 监控 SELINUX 违规行为\n\n安装 `setroubleshoot-server`\
  \ 软件包可以将 SELinux 消息发送到 `/var/log/messages`。\n\n`setroubleshoot-server` 监听 `/var/log/audit/audit.log`\
  \ 中的审计消息，并将一个简要摘要发送到 `/var/log/messages`。该摘要包含了 SELinux 违规行为的唯一标识符（`UUID`），这些 UUID\
  \ 用于收集更多信息。使用 `sealert -l UUID` 命令可以为特定事件生成报告。使用 `sealert -a /var/log/audit/audit.log`\
  \ 可以为该文件中所有的事件生成报告。\n\n考虑在标准 Apache Web 服务器上的以下命令序列：\n\n```bash\n[root@host ~]#\
  \ touch /root/file3\n[root@host ~]# mv /root/file3 /var/www/html\n[root@host ~]#\
  \ systemctl start httpd\n[root@host ~]# curl http://localhost/file3\n```\n\n你期望\
  \ Web 服务器交付 `file3` 的内容，但它却返回了权限拒绝（permission denied）错误。检查 `/var/log/audit/audit.log`\
  \ 和 `/var/log/messages` 可以发现关于此错误的额外信息。\n\n```bash\n[root@host ~]# tail /var/log/audit/audit.log\n\
  ...output omitted...\ntype=AVC msg=audit(1392944135.482:429): avc: denied { getattr\
  \ } for pid=1609 comm=\"httpd\" path=\"/var/www/html/file3\" dev=\"vda1\" ino=8980981\n\
  scontext=system_u:system_r:httpd_t:s0\ntcontext=unconfined_u:object_r:admin_home_t:s0\
  \ tclass=file\n...output omitted...\n\n[root@host ~]# tail /var/log/messages\n...output\
  \ omitted...\nFeb 20 19:55:42 host setroubleshoot: SELinux is preventing /usr/sbin/httpd\
  \ from getattr access on the file . For complete SELinux messages. run sealert -l\
  \ 613ca624-248d-48a2-a7d9-d28f5bbe2763\n```\n\n两个日志文件都表明 SELinux 拒绝是罪魁祸首。`/var/log/messages`\
  \ 输出内容中的 `sealert` 命令提供了额外信息，包括可能的修复方案。\n\n```bash\n[root@host ~]# sealert -l 613ca624-248d-48a2-a7d9-d28f5bbe2763\n\
  SELinux is preventing /usr/sbin/httpd from getattr access on the file .\n***** Plugin\
  \ catchall (100\\. confidence) suggests **************************\nIf you believe\
  \ that httpd should be allowed getattr access on the file by default.\nThen you\
  \ should report this as a bug.\nYou can generate a local policy module to allow\
  \ this access.\nDo\nallow this access for now by executing:\n```bash\n# grep httpd\
  \ /var/log/audit/audit.log | audit2allow -M mypol\n# semodule -i mypol.pp\n```\n\
  \n**附加信息：**\n- Source Context: `system_u:system_r:httpd_t:s0`\n- Target Context:\
  \ `unconfined_u:object_r:admin_home_t:s0`\n- Target Objects: `[ file ]`\n- Source:\
  \ `httpd`\n- Source Path: `/usr/sbin/httpd`\n- Port: `<Unknown>`\n- Host: `servera`\n\
  - Source RPM Packages: `httpd-2.4.6-14.el7.x86_64`\n- Target RPM Packages:\n- Policy\
  \ RPM: `selinux-policy-3.12.1-124.el7.noarch`\n- SELinux Enabled: `True`\n- Policy\
  \ Type: `targeted`\n- Enforcing Mode: `Enforcing`\n- Host Name: `servera`\n- Platform:\
  \ `Linux servera 3.10.0-84.el7.x86_64 #1`\n- Alert Count: `2`\n- First Seen: `2014-02-20\
