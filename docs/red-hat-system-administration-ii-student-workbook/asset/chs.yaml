  ### 总结\n\n在本章中，你学习了：\n- ACL 为文件和目录提供了细粒度的访问。\n- `getfacl` 命令显示文件或目录的 ACL。\n- `setfacl`\
  \ 命令设置、修改和删除 ACL。\n- 使用默认 ACL 用于新文件。\n- Red Hat Enterprise Linux 使用 `systemd` 和\
  \ `udev` 对设备、文件夹和文件应用 ACL。\n\n120\n![](img/00292.jpeg)\n\n\n\n\n\n并非所有的安全问题都能提前预测。`SELinux`\
  \ 实施了一组访问规则，防止一个应用程序的漏洞影响其他应用程序或底层系统。`SELinux` 提供了一个额外的安全层；但它增加了复杂性，这可能会让初接触该子系统的人感到无所从。学习使用\
  \ `SELinux` 可能需要时间，但强制执行策略意味着系统某部分的缺陷不会扩散到其他部分。如果 `SELinux` 与特定子系统的兼容性不佳，你可以关闭该特定服务的强制执行，直到找到底层问题的解决方案。\n\
  \n`SELinux` 有三种模式：\n\n*   **Enforcing（强制执行）**：`SELinux` 执行访问控制规则。计算机通常在此模式下运行。\n\
  *   **Permissive（许可）**：`SELinux` 处于激活状态，但它不是执行访问控制规则，而是记录违反规则的警告。此模式主要用于测试和故障排除。\n\
  *   **Disabled（禁用）**：`SELinux` 完全关闭：没有任何 `SELinux` 违规行为被拒绝，也不会被记录。\n\n气馁！\n\n122\n\
