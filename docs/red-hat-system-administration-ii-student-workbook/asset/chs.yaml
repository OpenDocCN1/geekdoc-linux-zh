  \ 上的虚拟主机返回 `VHOST 1`。\n\n## 337\n![](img/00450.jpeg)\n## 第 11 章 | 管理网络安全\n\n2.5.\
  \ 使用 `sealert` 命令检查 SELinux 是否阻止了 `httpd` 服务绑定到端口 `1001/TCP`。\n\n```bash\n[student@serverb\
  \ ~]$ sudo sealert -a /var/log/audit/audit.log 100% done\nfound 1 alerts in /var/log/audit/audit.log\n\
  ```\n\n\n\n\nSELinux 阻止了 `/usr/sbin/httpd` 对 `tcp_socket` 端口 `1001` 的 `name_bind`\
  \ 访问。\n\n***** 插件 `bind_ports` (99.5% 置信度) 建议\n\n************************\n\n如果你想允许\
  \ `/usr/sbin/httpd` 绑定到网络端口 1001\n\n那么你需要修改端口类型。\n\n执行\n\n```bash\nsemanage port\
  \ -a -t PORT_TYPE -p tcp 1001\n```\n\n其中 `PORT_TYPE` 是以下类型之一：`http_cache_port_t`,\
  \ `http_port_t`, `jboss_management_port_t`, `jboss_messaging_port_t`, `ntop_port_t`,\
  \ `puppet_port_t`。\n\n***** 插件 `catchall` (1.49% 置信度) 建议\n\n**************************\n\
  \n...输出略...\n\n338\n\nRH134-RHEL8.0-en-1-20190531\n\n![](img/0035.jpeg)\n\n第 11\
  \ 章 | 管理网络安全\n\n3.\n\n配置 SELinux 以允许 httpd 服务在端口 1001/TCP 上进行监听。\n\n3.1.\n\n使用 `semanage`\
  \ 命令找到正确的端口类型。\n\n```bash\n[student@serverb ~]$ sudo semanage port -l | grep 'http'\n\
  \nhttp_cache_port_t tcp 8080, 8118, 8123, 10001-10010\nhttp_cache_port_t udp 3130\n\
  http_port_t tcp 80, 81, 443, 488, 8008, 8009, 8443, 9000\npegasus_http_port_t tcp\
  \ 5988\npegasus_https_port_t tcp 5989\n```\n\n3.2.\n\n使用 `semanage` 命令将端口 1001/TCP\
  \ 绑定到 `http_port_t` 类型。\n\n```bash\n[student@serverb ~]$ sudo semanage port -a -t\
  \ http http_port_t -p tcp 1001\n[student@serverb ~]$\n```\n\n3.3.\n\n确认端口 1001/TCP\
  \ 已绑定到 `http_port_t` 端口类型。\n\n```bash\n[student@serverb ~]$ sudo semanage port -l\
