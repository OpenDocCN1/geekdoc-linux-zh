  # 第 9 章 | 访问网络存储\n\n- `/shares/direct/external` 共享目录应通过在 `/external` 上的直接映射（direct\
  \ map）在 `servera` 上进行自动挂载。\n- `/shares/indirect/west` 共享目录应通过在 `/internal/west`\
  \ 上的间接映射（indirect map）在 `servera` 上进行自动挂载。\n- `/shares/indirect/central` 共享目录应通过在\
  \ `/internal/central` 上的间接映射在 `servera` 上进行自动挂载。\n- `/shares/indirect/east` 共享目录应通过在\
  \ `/internal/east` 上的间接映射在 `servera` 上进行自动挂载。\n- 所有用户密码设置为 `redhat`。\n\n## 1. 登录\
  \ `servera` 并安装所需的软件包。\n\n### 1.1. 以 `student` 用户身份登录 `servera`。\n\n```bash\n[student@workstation\
  \ ~]$ ssh student@servera\n...output omitted...\n[student@servera ~]\n```\n\n###\
  \ 1.2. 使用 `sudo -i` 命令切换到 root 用户。`student` 用户的密码为 `student`。\n\n```bash\n[student@servera\
  \ ~]$ sudo -i\n[sudo] password for student: student\n[root@servera ~]#\n```\n\n\
  ### 1.3. 安装 `autofs` 软件包。\n\n```bash\n[root@servera ~]# yum install autofs\n...output\
  \ omitted...\nIs this ok [y/N]: y\n...output omitted...\n```\n\n## 2. 使用来自 `serverb`\
  \ 的共享在 `servera` 上配置自动挂载器直接映射。\n\n使用名为 `/etc/auto.master.d/direct.autofs` 的文件创建主映射，使用\
  \ `/etc/auto.direct` 创建映射文件。使用 `/external` 目录作为 `servera` 上的主挂载点。\n\n### 2.1. 在继续配置自动挂载器之前测试\
  \ NFS 服务器和共享。\n\n```bash\n[root@servera ~]# mount -t nfs serverb.lab.example.com:/shares/direct/external\
  \ /mnt\n[root@servera ~]# ls -l /mnt\ntotal 4\n-rw-r--r--. 1 root contractors 22\
  \ Apr 7 23:15 README.txt\n[root@servera ~]# umount /mnt\n```\n\n### 2.2. 创建名为 `/etc/auto.master.d/direct.autofs`\
  \ 的主映射文件，插入以下内容并保存更改。\n\n```bash\n[root@servera ~]# vim /etc/auto.master.d/direct.autofs\n\
  /- /etc/auto.direct\n```\n\n### 2.3. 创建名为 `/etc/auto.direct` 的直接映射文件，插入以下内容并保存更改。\n\
  \n```bash\n[root@servera ~]# vim /etc/auto.direct\n/external -rw,sync,fstype=nfs4\
  \ serverb.lab.example.com:/shares/direct/external\n```\n\n## 3. 使用来自 `serverb` 的共享在\
  \ `servera` 上配置自动挂载器间接映射。\n\n使用名为 `/etc/auto.master.d/indirect.autofs` 的文件创建主映射，使用\
  \ `/etc/auto.indirect` 创建映射文件。使用 `/internal` 目录作为 `servera` 上的主挂载点。\n\n### 3.1.\
  \ 在继续配置自动挂载器之前测试 NFS 服务器和共享。\n\n```bash\n[root@servera ~]# mount -t nfs serverb.lab.example.com:/shares/indirect\
  \ /mnt\n[root@servera ~]# ls -l /mnt\ntotal 0\ndrwxrws---. 2 root operators 24 Apr\
  \ 7 23:34 central\ndrwxrws---. 2 root operators 24 Apr 7 23:34 east\ndrwxrws---.\
  \ 2 root operators 24 Apr 7 23:34 west\n[root@servera ~]# umount /mnt\n```\n\n###\
  \ 3.2. 创建名为 `/etc/auto.master.d/indirect.autofs` 的主映射文件，插入以下内容并保存更改。\n\n```bash\n\
  [root@servera ~]# vim /etc/auto.master.d/indirect.autofs\n/internal /etc/auto.indirect\n\
