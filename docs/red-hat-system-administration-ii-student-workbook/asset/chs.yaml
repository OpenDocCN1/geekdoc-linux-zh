  \n`ksvalidator` 是一个用于检查 Kickstart 文件语法错误的工具。它确保关键字和选项被正确使用，但不会验证 URL 路径、单个软件包或包组，或\
  \ `%post` 或 `%pre` 脚本的任何部分能够执行。例如，如果 `firewall --disabled` 指令拼写错误，`ksvalidator`\
  \ 可能会产生以下错误之一：\n\n```\n[user@host ~]$ ksvalidator /tmp/anaconda-ks.cfg\nThe following\
  \ problem occurred on line 10 of the kickstart file: Unknown command: frewall\n\n\
  [user@host ~]$ ksvalidator /tmp/anaconda-ks.cfg\nThe following problem occurred\
  \ on line 10 of the kickstart file: no such option: --dsabled\n```\n\n`pykickstart`\
  \ 包提供了 `ksvalidator`。\n\n359\n\n![](img/00179.jpeg)\n![](img/00094.jpeg)\n\n## 将\
  \ KICKSTART 文件发布到 ANACONDA\n\n通过将 Kickstart 文件放在以下位置之一，使其对安装程序可用：\n\n- 安装时通过 FTP、HTTP\
  \ 或 NFS 可用的网络服务器。\n- 可用的 USB 磁盘或 CD-ROM。\n- 待安装系统的本地硬盘。\n\n\n\n\n安装程序必须访问 Kickstart\
  \ 文件以开始自动安装。最常用的自动化方法是使用网络服务器，例如 FTP、Web 或 NFS 服务器。网络服务器有助于 Kickstart 文件的维护，因为只需进行一次更改，即可立即用于未来的多次安装。\n\
  \n在 USB 或 CD-ROM 上提供 Kickstart 文件也很方便。Kickstart 文件可以嵌入到用于启动安装的引导介质中。但是，当 Kickstart\
  \ 文件发生更改时，必须重新生成安装介质。\n\n在本地磁盘上提供 Kickstart 文件允许您快速重建系统。\n\n# 启动 ANACONDA 并指向 KICKSTART\
  \ 文件\n\n一旦选择了 Kickstart 方法，将通过向安装内核传递 `inst.ks= LOCATION` 参数来告诉安装程序定位 Kickstart\
