  \ /backup xfs defaults 0 0\nUUID= 87976166-4697-47b7-86d1-73a02f0fc803 swap swap\
  \ pri=10 0 0\nUUID= 4d9b847b-98e0-4d4e-9ef7-dfaaf736b942 swap swap pri=20 0 0\n\
  ```\n\n#### 4.3. 强制系统重新加载 `/etc/fstab`。\n\n```\n[root@serverb ~]# systemctl daemon-reload\n\
  ```\n\n#### 4.4. 运行 `swapon -a` 命令激活所有交换空间。使用 `swapon --show` 查看结果。\n\n```\n[root@serverb\
  \ ~]# swapon -a\n[root@serverb ~]# swapon --show\nNAME           Type     Used \
  \   Free    Priority  Used\n/dev/vdb2      swap     0B      489Mi   10         -\n\
  /dev/vdb3      swap     0B      488Mi   20         -\n```\n\n\n\n\n默认情况下，每个 `LE`\
  \ 映射到一个 `PE`。设置特定的 `LV` 选项会更改此映射；例如，镜像（mirroring）会导致每个 `LE` 映射到两个 `PE`。\n\n# 实现\
  \ LVM 存储\n\n创建 LVM 存储需要几个步骤。第一步是确定使用哪些物理设备。在组好一组合适的设备后，它们会被初始化为物理卷（PV），以便被识别为属于\
  \ LVM。然后将物理卷组合为一个卷组（VG）。这创建了一个磁盘空间池，可以从中分配逻辑卷（LV）。\n\n194\n\nRH134-RHEL8.0-en-1-20190531\n\
  \n![](img/00404.jpeg)\n![](img/00158.jpeg)\n![](img/00154.jpeg)\n![](img/00297.jpeg)\n\
  ![](img/00109.jpeg)\n![](img/00360.jpeg)\n\n# 第 7 章 | 管理逻辑卷\n\n从卷组可用空间创建的逻辑卷可以格式化为文件系统、激活为交换空间，并挂载或持久化激活。\n\
  \n图 7.1：逻辑卷管理组件\n\nLVM 提供了一套完整的命令行工具，用于实现和管理 LVM 存储。这些命令行工具可以在脚本中使用，使其适用于自动化。\n\n\
  **重要提示**\n\n以下示例使用设备 `vdb` 及其分区来说明 LVM 命令。在实践中，这些示例需要根据系统正在使用的磁盘和磁盘分区使用正确的设备。请使用\
  \ `lsblk`、`blkid` 或 `cat /proc/partitions` 命令来识别系统上的设备。\n\n## 创建逻辑卷\n\n要创建逻辑卷，请执行以下步骤：\n\
  \n### 准备物理设备。\n\n使用 `parted`、`gdisk` 或 `fdisk` 创建一个用于 LVM 的新分区。始终在 LVM 分区上将分区类型设为\
  \ Linux LVM；对于 MBR 分区使用 `0x8e`。如有必要，使用 `partprobe` 向内核注册新分区。\n\nRH134-RHEL8.0-en-1-20190531\n\
  \n195\n\n![](img/00120.jpeg)\n\n第 7 章 | 管理逻辑卷\n\n或者，使用整个磁盘、RAID 阵列或 SAN 磁盘。\n\n\
  只有在没有准备好的设备且需要新的物理卷来创建或扩展卷组时，才需要准备物理设备。\n\n```\n[root@host ~]# parted -s /dev/vdb\
  \ mkpart primary 1MiB 769MiB\n[root@host ~]# parted -s /dev/vdb mkpart primary 770MiB\
  \ 1026MiB\n[root@host ~]# parted -s /dev/vdb set 1 lvm on\n[root@host ~]# parted\
  \ -s /dev/vdb set 2 lvm on\n```\n\n### 创建物理卷。\n\n使用 `pvcreate` 将分区（或其他物理设备）标记为物理卷。`pvcreate`\
  \ 命令将物理卷划分为固定大小的物理范围区（`PEs`），例如 4 MiB 块。你可以通过使用用空格分隔的设备名称作为 `pvcreate` 的参数来同时标记多个设备。\n\
  \n```\n[root@host ~]# pvcreate /dev/vdb2 /dev/vdb1\n```\n\n这会将设备 `/dev/vdb2` 和 `/dev/vdb1`\
  \ 标记为 `PVs`，准备分配到卷组。\n\n只有在没有空闲 `PVs` 可创建或扩展 `VG` 时，才需要创建 `PV`。\n\n### 创建卷组。\n\n\
  使用 `vgcreate` 将一个或多个物理卷收集到一个卷组。卷组等同于硬盘；你将从卷组中的空闲物理范围区池中创建逻辑卷。\n\n`vgcreate` 命令行由卷组名称以及一个或多个分配给该卷组的物理卷组成。\n\
  \n```\n[root@host ~]# vgcreate vg01 /dev/vdb2 /dev/vdb1\n```\n\n这创建了一个名为 `vg01`\
  \ 的 `VG`，其大小（以 `PE` 为单位）是两个 `PV` `/dev/vdb2` 和 `/dev/vdb1` 的总和。\n\n只有在尚不存在时才需要创建\
  \ `VG`。出于管理原因，可能会创建额外的 `VGs` 来管理 `PVs` 和 `LVs` 的使用。否则，在需要时可以扩展现有 `VGs` 以容纳新的 `LVs`。\n\
  \n### 创建逻辑卷。\n\n使用 `lvcreate` 从卷组中的可用物理范围区创建新的逻辑卷。`lvcreate` 命令至少包含 `-n` 选项来设置 `LV`\
  \ 名称，`-L` 选项用于以字节设置 `LV` 大小或 `-l` 选项用于以范围区数量设置 `LV` 大小，以及托管此逻辑卷的卷组名称。\n\n```\n[root@host\
  \ ~]# lvcreate -n lv01 -L 700M vg01\n```\n\n这在 `VG` `vg01` 中创建一个名为 `lv01` 的 700\
  \ MiB 的 `LV`。如果卷组没有足够的空闲物理范围区满足请求的大小，此命令将失败。\n\n196\n\nRH134-RHEL8.0-en-20190531\n\
  \n![](img/00234.jpeg)\n\n第 7 章 | 管理逻辑卷\n\n另外注意，如果大小无法精确匹配，将取整为物理范围区大小的倍数。\n\n你可以使用\
  \ `-L` 选项指定大小，该选项期望字节、兆字节（二进制兆字节，1024）、千字节（二进制千字节）或类似的单位。或者，使用 `-l`，它期望一个范围区的数量。\n\
  \n以下列表提供了一些创建 `LVs` 的示例：\n\n- `lvcreate -L 128M`：将逻辑卷大小设为 128 MB。\n- `lvcreate -l\
  \ 128`：将逻辑卷大小设为 128 个范围区。\n\n**重要提示**\n\n以下示例使用设备 `vdb` 及其分区来说明 LVM 命令。在实践中，这些示例需要根据系统正在使用的磁盘和磁盘分区使用正确的设备。请使用\
  \ `lsblk`、`blkid` 或 `cat /proc/partitions` 命令来识别系统上的设备。\n\n**添加文件系统。**\n\n使用 `mkfs`\
  \ 在逻辑卷上创建文件系统。例如，`ext4`。\n\n```\n[root@host ~]#\n```\n\n要使文件系统在重启后可用，请执行以下步骤：\n\n\
  - 使用 `mkdir` 创建挂载点。\n```\n[root@host ~]# mkdir /mnt/data\n```\n- 在 `/etc/fstab`\
  \ 文件中添加项：`/dev/vg01/lv01 /mnt/data xfs defaults 0 0`。\n\n**注意**\n\n通过名称挂载逻辑卷等同于通过\
  \ UUID 挂载，因为 LVM 根据 UUID 查找物理卷。\n\n```\n[root@host ~]# mount /mnt/data\n```\n\n\
  # 逻辑卷\n\n要移除逻辑卷组件，请执行以下步骤：\n\n### 将保留的数据移动到另一个文件系统。\n\n使用 `umount` 命令卸载文件系统，然后删除与文件系统相关的\
  \ `/etc/fstab` 项。\n\n```\n[root@host ~]# umount /mnt/data\n```\n\n**警告**\n\n删除逻辑卷会破坏逻辑卷上的所有数据。在删除逻辑卷之前，请备份或移动你的数据。\n\
  \n### 删除逻辑卷。\n\n使用 `lvremove DEVICE_NAME` 删除不再需要的逻辑卷。\n\n```\n[root@host ~]# lvremove\
  \ /dev/vg01/lv01\n```\n\n在运行此命令之前卸载 LV。命令在删除 `LV` 前会提示确认。`LV` 的物理范围区将被释放，并可分配给卷组中现有或新的\
  \ `LVs`。\n\n### 删除卷组。\n\n使用 `vgremove VG_NAME` 删除不再需要的卷组。\n\n```\n[root@host ~]#\
  \ vgremove vg01\n```\n\n`VG` 的物理卷将被释放，并可分配给系统上现有或新的 `VGs`。\n\n### 删除物理卷。\n\n使用 `pvremove`\
  \ 删除不再需要的物理卷。使用用空格分隔的 `PV` 设备列表可以一次删除多个。此命令从分区（或磁盘）中删除 `PV` 元数据。该分区现在可以重新分配或格式化。\n\
  \n```\n[root@host ~]# pvremove /dev/vdb2 /dev/vdb1\n```\n\n# 查看 LVM 状态信息\n\n## 物理卷\n\
  \n使用 `pvdisplay` 显示物理卷信息。列出所有物理卷的信息，请无参数使用命令。列出特定物理卷的信息，将该设备名称传递给命令。\n\n```\n[root@host\
  \ ~]# pvdisplay /dev/vdb1\n```\n\n--- 物理卷 ---\n\nPV Name /dev/vdb1\n\nVG Name vg01\n\
  \n198\n\n\n\n\n\n# RH134-RHEL8.0-en-1-20190531\n\n![](img/00424.jpeg)\n\n## 第 7\
  \ 章 | 管理逻辑卷\n\n- PV 大小 768.00 MiB / 不可用 4.00 MiB\n- 可分配 是\n- PE 大小 4.00 MiB\n- 总计\
  \ PE 191\n- 空闲 PE 16\n- 已分配 PE 175\n- PV UUID JWzDpn-LG3e-n2oi-9Etd-VT2H-PMem-1ZXwP1\n\
  \n- `PV Name` 映射到设备名称。\n- `VG Name` 显示分配 `PV` 的卷组。\n- `PV Size` 显示 `PV` 的物理大小，包括任何不可用的空间。\n\
  - `PE Size` 是物理区大小，是逻辑卷可以分配的最小单位。它也是计算任何以 PE 单位报告的数值的大小（如 `Free PE`）时的倍数；例如：`26\
  \ PEs x 4 MiB`（`PE Size`）等于 `104 MiB` 的空闲空间。逻辑卷的大小会舍入为 PE 单位的倍数。\n- `LVM` 会自动设置\
  \ `PE size`，也可以手动指定。\n- `Free PE` 显示可分配给新逻辑卷的 PE 单位数量。\n\n### 卷组\n\n使用 `vgdisplay`\
  \ 显示有关卷组的信息。要列出所有卷组的信息，请不带参数运行命令。要列出特定卷组的信息，请将该 `VG name` 传递给命令。\n\n```bash\n[root@host\
  \ ~]# vgdisplay vg01\n\n--- Volume group ---\n\nVG Name vg01\nSystem ID\nFormat\
  \ lvm2\nMetadata Areas 2\nMetadata Sequence No 2\nVG Access read/write\nVG Status\
  \ resizable\nMAX LV 0\nCur LV 1\nOpen LV 1\nMax PV 0\nCur PV 2\nAct PV 2\nVG Size\
  \ 1016.00 MiB\nPE Size 4.00 MiB\nTotal PE 254\nAlloc PE / Size 175 / 700.00 MiB\n\
  Free PE / Size 79 / 316.00 MiB\nVG UUID 3snNw3-CF71-CcYG-Llk1-p6EY-rHEv-xfUSez\n\
  ```\n\n`VG Name` 是卷组的名称。\n- `VG Size` 是用于分配逻辑卷的存储池总大小。\n- `Total PE` 是以 PE 单位表示的总大小。\n\
  - `Free PE / Size` 显示 `VG` 中剩余可分配给新 `LVs` 或扩展现有 `LVs` 的空间。\n\nRH134-RHEL8.0-en-1-20190531\n\
  199\n\n![](img/00134.jpeg)\n\n第 7 章 | 管理逻辑卷\n\n### 逻辑卷\n\n使用 `lvdisplay` 显示有关逻辑卷的信息。如果您不向命令提供参数，它将显示所有\
  \ `LVs` 的信息；如果提供 `LV device name` 作为参数，命令将显示该特定设备的信息。\n\n```bash\n[root@host ~]#\
  \ lvdisplay /dev/vg01/lv01\n\n--- Logical volume ---\n\nLV Path /dev/vg01/lv01\n\
  LV Name lv01\nVG Name vg01\nLV UUID 5IyRea-W8Zw-xLHk-3h2a-IuVN-YaeZ-i3IRrN\nLV Write\
  \ Access read/write\nLV Creation host, time host.lab.example.com, 2019-03-28 17:17:47\
  \ -0400\nLV Status available\n# open 1\nLV Size 700 MiB\nCurrent LE 175\nSegments\
  \ 1\nAllocation inherit\nRead ahead sectors auto\n- current set to 256\nBlock device\
  \ 252:0\n```\n\n- `LV Path` 显示逻辑卷的设备名称。某些工具可能会报告设备名称为 `/dev/mapper/vgname-lvname`；两者都代表同一个\
  \ `LV`。\n- `VG Name` 显示分配 `LV` 的卷组。\n- `LV Size` 显示 `LV` 的总大小。使用文件系统工具可以确定存储数据的空闲空间和用空间。\n\
  - `Current LE` 显示此 `LV` 使用的逻辑区数量。一个 `LE` 通常映射到 `VG` 中的物理区，因此映射到物理卷。\n\n### 参考文献\n\
