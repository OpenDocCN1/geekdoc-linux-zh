  ![](img/00235.jpeg)\n\n# 第 1 章：提高命令行效率\n\n### 目标\n通过使用 `Bash` shell 的高级功能、shell\
  \ 脚本以及 Red Hat Enterprise Linux 提供的各种工具更高效地运行命令。\n\n### 目标\n- 通过编写简单的 shell 脚本实现命令序列的自动化。\n\
  - 在脚本或从命令行使用 `for` 循环和条件语句，对项目列表更高效地运行命令。\n- 使用 `grep` 命令和正则表达式在日志文件和命令输出中查找匹配模式的文本。\n\
  \n### 节次\n- 编写简单的 Bash 脚本（以及引导性练习）\n- 使用循环更高效地运行命令（以及引导性练习）\n- 使用正则表达式在命令输出中匹配文本（以及引导性练习）\n\
  \n## 实验：提高命令行效率\nRH134-RHEL8.0-en-1-20190531\n1\n![](img/00334.jpeg)\n\n# 第 1 章\
  \ | 提高命令行效率：编写简单的 BASH 脚本\n\n### 目标\n完成本节后，你应该能够通过编写一个简单的 shell 脚本来实现命令序列的自动化。\n\
  \n### 创建和执行 BASH shell 脚本\n许多简单、常见的系统管理任务可以使用命令行工具完成。具有更大复杂性的任务通常需要将多个命令链在一起，并在它们之间传递结果。使用\
  \ `Bash` shell 环境和脚本功能，可以将 Linux 命令组合成 shell 脚本，从而轻松地解决现实世界重复且困难的问题。\n\n在最简单的形式中，`Bash`\
  \ shell 脚本是一个包含命令列表的可执行文件，并可能带有用于控制整个任务决策的编程逻辑。如果编写得良好，shell 脚本本身就是一个强大的命令行工具，并可以被其他脚本利用。\n\
  \n熟练掌握 shell 脚本对于任何操作环境中的成功系统管理至关重要。在企业环境中，掌握 shell 脚本知识非常关键，因为脚本的使用可以提高常规任务完成的效率和性。\n\
  \n你可以通过在文本编辑器中打开一个新的空文件来创建一个 `Bash` shell 脚本。可以使用任何文本编辑器，但高级编辑器（如 `vim` 或 `emacs`）理解\
  \ `Bash` shell 语法并提供颜色高亮。高亮有助于识别常见错误，例如错误的语法、不配对的引号、未闭合的括号、大括号和括号等。\n\n#### 指定命令解释器\n\
  脚本的第一行以 `#!` 符号开头，由于这两个字符（井号 sharp 和感叹号 bang）的名字，通常被称为 `sh-bang` 或 `she-bang`。这种特定的双字节魔数表示表示解释型脚本；符号随后的语法是处理此脚本行所需的正确命令解释器的完全限定文件名。\n\
  \n要了解魔数如何在 Linux 中指示文件类型，请参见 `file(1)` 和 `magic(5)` 手页。对于使用 `Bash` 脚本语法的脚本文件，shell\
  \ 脚本的第一行如下：\n\n```bash\n#!/bin/bash\n```\n\n#### 执行 Bash shell 脚本\n完成的 shell 脚本必须是可执行的才能作为普通命令运行。使用\
  \ `chmod` 命令添加执行权限，可能还会结合 `chown` 命令更改脚本的所有权。仅为脚本的预期用户授予执行权限。\n\n如果你将脚本放在 shell\
  \ 环境变量 `PATH` 列出的目录之一，你就可以像调用任何其他命令一样仅使用文件名来调用 shell 脚本。shell 使用第一行...\n\n2\nRH134-RHEL8.0-en-20190531\n\
  ![](img/00172.jpeg)\n\n# 第 1 章 | 提高命令行效率：特殊字符的引用\n\n许多字符和单词对 `Bash` shell 具有特殊含义。然而，你有时想要这些字符的字面值，而不是它们的含义。\n\
  \n为了实现这一点，请使用三种工具之一来移除（或转义）特殊含义：反斜杠（`\\`）、单引号（`''`）或双引号（`\"\"`）。\n\n反斜杠（`\\`）转义字符移除其后字符的特殊含义。例如，要使用\
  \ `echo` 命令显示字面字符串 `# not a comment`，`#` 不能被 `Bash` 解释为具有特殊含义。\n\n```bash\necho\
  \ \\# not a comment\n# not a comment\n```\n\n当你需要在字符串中转义多个字符时，可以使用多次转义字符或使用单引号（`''`）。单引号保留包含的所有字符的字面含义。观察转义字符和单引号的作用：\n\
  \n```bash\necho # not a comment\n# not a comment\necho \\# not a comment\n# not\
  \ a comment\necho \\# not a comment\n# not a comment\necho '# not a comment'\n#\
  \ not a comment\n```\n\n使用双引号抑制通配符扩展，但允许命令和变量替换。变量替换在概念上与命令替换相同，但可以使用括号语法。观察下方各种形式的引号使用示例。\n\
  \n问号（`?`）是一个也需要防止扩展的元字符。\n\n```bash\nvar=$(hostname -s); echo $var\nhost\necho \"\
  ***** hostname is ${var} *****\"\n***** hostname is host\necho Your username variable\
  \ is \\$USER.\n```\n\n3\nRH134-RHEL8.0-en-20190531\n![](img/00486.jpeg)\n\n# 第 1\
  \ 章 | 提高命令行效率：变量替换和命令替换\n\n```bash\necho \"Will variable $var evaluate to $(hostname\
  \ -s)?\"\nWill variable host evaluate to host?\necho 'Will variable $var evaluate\
  \ to $(hostname -s)?'\nWill variable $var evaluate to $(hostname -s)?\necho \"\\\
  \"Hello, world\\\"\"\n\"Hello, world\"\necho '\"Hello, world\"'\n'Hello, world'\n\
  ```\n\n\n\n\n\n# \"Hello, world\"\n\n### 从 Shell 脚本提供输出\n\n`echo` 命令通过将文本作为参数传递给命令来显示任意文本。\n\
  \n默认情况下，显示在标准输出 (`STDOUT`) 上，但也可以使用输出重定向将其定向到标准错误 (`STDERR`)。在接下来的简单 Bash 脚本中，`echo`\
  \ 命令向 `STDOUT` 显示消息 \"Hello, world\"。\n\n```bash\n[user@host ~]$ cat ~/bin/hello\n\
  \n#!/bin/bash\n\necho \"Hello, world\"\n\n[user@host ~]$ hello\n\nHello, world\n\
  ```\n\n### 注意\n该用户可以直接在提示符处运行 `hello`，因为 `~/bin`（`/home/user/bin`）目录已在用户的 `PATH`\
  \ 变量中，且其中的 `hello` 脚本是可执行的。只要在 `PATH` 列表中位于 `/home/user/bin` 之前的目录中没有名为 `hello`\
  \ 的其他可执行文件，shell 就会在那里找到该脚本。\n\n`echo` 命令在 shell 脚本中被广泛用于显示信息性或错误消息。\n\n这些消息可以是脚本进展的有用指示，并可以重定向到标准输出、标准错误，或重定向到日志文件进行存档。显示错误消息时，将它们定向到\
  \ `STDERR` 是良好的做法，以便更容易区分错误消息和普通状态消息。\n\n```bash\n[user@host ~]$ cat ~/bin/hello\n\
  \n#!/bin/bash\n\necho \"Hello, world\"\n\necho \"ERROR: Houston, we have a problem.\"\
  \ >&2\n\n[user@host ~]$ hello 2> hello.log\n\nHello, world\n\n[user@host ~]$ cat\
  \ hello.log\n\nERROR: Houston, we have a problem.\n```\n\n`echo` 命令在尝试调试有问题的 shell\
  \ 脚本时也非常有帮助。在脚本中未符合预期的部分添加 `echo` 语句，有助于澄清正在执行的命令以及调用的变量值。\n\n# 第 1 章 | 提高命令行效率\n\
  \n### 参考文献\n`bash(1)`, `magic(5)`, `echo(1)` 和 `echo(1p)` 手册页。\n\n## 引导练习：编写简单的\
