    \ on page 139\n- Section 5.1.1.2, \"User profile tracking\" on page 140\n\n###\
    \ 5.1.1.1 DB connection pooling\n\nConnecting and disconnecting from a data server\
    \ causes the inefficient use of resources. WebSphere offers a database connection\
    \ pooling facility that can be used by programmers to manage connections to a\
    \ database. This is an API that contains methods for:\n\n+ - Establishing a pool\
    \ of open connections to a given database\n- Requesting a connection from the\
    \ managed pool\n- Returning the connection to the managed pool\n\nThis pool of\
    \ connections for a given database is managed through the WebSphere administration\
    \ facility.\n\nThe connection manager allows you to connect and disconnect from\
    \ a data server by pooling connections and reusing them. This reduces the overhead\
    \ of connecting and disconnecting. The servlets use the connection pool as follows:\n\
    \n* When a user makes a request over the Web to a servlet, the servlet uses an\
    \ existing connection from the pool, meaning the user request does not incur the\
    \ overhead of a data server connection.\n* When the request is satisfied, the\
    \ servlet returns the connection to the connection manager pool for use by other\
    \ servlets.\n\nThe user request, therefore, does not incur the overhead of a data\
    \ server disconnection.\n\nThe connection manager also allows you to control the\
    \ number of concurrent connections to a data server product. This is very useful\
