    \ /etc/httpd/conf - directory empty\n[root@dbtest2 /opt]# rm -rf /var/log/httpd\n\
    [root@dbtest2 /opt]# rm -rf /home/httpd\n[root@dbtest2 /opt]# rm -rf /etc/httpd\n\
    ```\nFigure 25. Uninstalling Apache Web server\n\nWe can now proceed with installing\
