    # Access to View


    After success to open the database, we can access the views and folders in the
    database through getView and getViews. In the View class, we can locate documents
    within views and perform operations there.


    ```

    View view = db.getView(viewname);

    ```


    The viewname must contain the name of a view or a folder in the Domino database.
    The view or folder name must be specified exactly.


    # Access to domains with ViewNavigator


    ViewNavigator is an object that is created under the View object and selects the
    entries in a selected view and navigates the view to access a specific document
    in the view.


    ViewNavigator can be created through several methods:


    +   * createViewNav


    Creates a navigator for all the entries in a view, for example:

    Session s = NotesFactory.createSession("bdtest3:8000");

    Database db = s.getDatabase("Redbooks")

    View view = db.getView("platform sorted")

    ViewNavigator viewnav = view.createViewNav();


    This program will get all entries from the Redbooks database on server bdtest1
    on the view platform sorted. The content of viewnav may have a category or document
    depending on the structure of the database.


    +   * createViewNavFromCategory


    This method will create a navigator for all the entries in a view under a specified
    category. For example, we use this method to get all entries in the selected category
    of the Redbooks database:

    Session s = NotesFactory.createSession("bdtest3:8000");

    Database db = s.getDatabase("Redbooks")

    View view = db.getView("platform sorted")

    ViewNavigator viewnav = view.createViewNavCategory("AS/400");


    This program will get all entries from the Redbooks database in server bdtest1
    on the view platform sorted and at the category AS/400.


    +   * createViewMaxLevel


    This method will create a navigator for all entries in a view down to a specified
    level. For example, if we need to get all entries at the top level of view, we
    can use the following code:'
