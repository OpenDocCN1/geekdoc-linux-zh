    If the server needs to be killed quickly, and the above commands fail for any
    reason, the server keeps the parent process ID in a file called httpd.pid. This
    file can be found in /opt/IBMHTTPServer/logs/. Sending the TERM signal to this
    process will stop the server ungracefully.


    ```

    ps ax | grep httpd

    ```


    Output from this command looks similar to Figure 83. Note that in our example,
    we have started seven http servers, and it is sufficient to kill only the parent
    ID to stop all processes.


    ```

    [root@test1 ~ # ps ax | grep httpd

    12531 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13165 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13166 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13167 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13168 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13169 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13180 pts/1 S 0:00 grep httpd

    [root@test1 ~]# grep httpd

    ```


    > Figure 83. Output of the ps.ax|grep httpd


    To ensure that the Java processes that is started by WebSphere is also terminated,
    the killall java command before stopping the HTTP server.


