    The Domino Java classes are provided in the following packages:


    +   * Domino notes.jar file contains contents.domino classes for local Java access.

    * Domino NCSO.jar file contains the CORBA implementation of the lotus.domino classes.
    It is used by remote Java programs only.


    In Domino R5 for Linux, remote Java programs can access the Domino object classes
    on the Domino server using CORBA/IIOP network communication mechanisms.


    More information about Domino CORBA programming is provided in the redbook, Lotus
    Domino Release 5.0: A Developer''s Handbook, SG24-5331.


    We use it to write a servlet and compile the servlet with IBM JDK 1.1.6 for creating
