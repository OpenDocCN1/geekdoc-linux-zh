  - '[PAGE 79]


    # 3.4.1 Domino database concept


    A Domino database is a collection of related information stored in a single file.
    A Domino application uses at least one database. A database holds information
    about its design as well as data. Domino data is organized as documents. A document
    is defined as an object containing text, graphics, video, or audio objects, or
    any other kind of rich text data.


    Domino databases contain documents, as opposed to relational databases, which
    contain tables. Unstructured or structured data, as well as associated programming
    logic, are stored within the database.


    Domino databases are essentially a complete application with its associated data.
    They contain all the forms, views, agents, fields, and code required to store
    and manage data. The databases can reside on a Domino server or Lotus Notes workstation.


    There are many design features that are available for Domino databases. We will
    evaluate the forms and views as the main design element that we are concerned
    with in this project.


    # 3.4.1.1 Form


    The form is the skeleton provided to users to enable them to enter data, by typing
    or using other control buttons. A form can also be thought as an abstract structure
    of a document. It defines all the fields and its type for a document. There is
    at least one form in a database, although a typical business application will
    have many forms, each targeted to the type of information that the user wants
    to save in the database.


    The form contains all the design elements: Fields to store the user''s information,
    static text, buttons, sections, and subforms that help the user enter the data
    into the database.


    # 3.4.1.2 View


    A view shows a list of documents stored in a Domino database and can be thought
    of as a table of contents of a database. Views provides a means to organize documents
    in a database to be presented to the users or a program. Each row listed in view
    represents data taken from a single document. Each column represents a field or
    a result of a formula from that document.


    Domino databases have at least one view, but most of them have more. A view can
    display all the documents in the database, or it can display a subset of the documents.
    Views can present documents sorted on different fields, for example, sorted by
    topic, creation date, or author.'
  - '[PAGE 80]


    # 3.4.1.3 Documents


    A document is a container for data and is similar to a row in a database management
    system (DBMS). Each document is a collection of fields. A unique identifier is
    given to each document upon its creation and is used by the Domino database as
    a primary key.


    A document''s design is held within a Domino form, which specifies what a document
    can contain in each field, for example, a form number, a date, or rich text.


    # 3.4.2 The Redbooks database


    The Redbooks.nf database is replicated from the current redbooks view. The important
    feature that is available from the redbook database is the Redbook form and the
    views available. This section is divided into:


    +   - Section 3.4.2.1, "Redbook form" on page 71, which discusses the format of
    the redbook documents.

    - Section 3.4.2.2, "Redbook views" on page 74, which discusses the views we created
    to support our Web application.


    # 3.4.2.1 Redbook form


    The redbook is available in two forms, a standard notes form and the abstract
    Web page template. The IIOP access utilizes the standard notes form, while the
    direct Web access uses the Web page template.


    Figure 58 shows the form lists of our Redbooks database.'
