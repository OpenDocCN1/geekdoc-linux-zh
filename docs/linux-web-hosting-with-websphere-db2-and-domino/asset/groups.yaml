    \ 消息转换为 DB2 CLI 调用。它将其发送到 DB2 客户端组件，该组件将其传递给 DB2 服务器。然后，JDBC Applet Server 将结果传回\
    \ applet。此 JDBC 驱动的类名为 `COM.ibm.db2.jdbc.net.DB2Driver`。\n\nJDBC Applet Server\
    \ 是一个独立的 socket 服务器应用程序。要激活 JDBC Applet Server，请输入以下命令：\ndb2jstr <port>\n\n这将激活在端口\
    \ `<port>` 上监听的 JDBC Applet Server。然而，我们并不会激活此功能，因为 DB2 数据库仅通过 WebSphere 的 servlet\
    \ 访问，而不是直接通过 applet 访问。\n\n### 3.5.3.2 创建 JDBC 程序\n\n要创建一个通过 JDBC 访问 DB2 的 Java\
    \ 程序，我们需要执行以下步骤。\n\n### 导入 java.sql 包\n\n创建一个通过 JDBC 访问 DB2 的 Java 程序需要导入：\nimport\
    \ java.sql.*;\n\n### 注册 DB2 驱动程序\n\n我们必须注册 DB2 JDBC 类。如第 83 页 3.5.3.1 节“DB2 Drivers”所述，这可以是两个类之一：\n\
    \n- COM.ibm.db2.db2.app.DB2Driver\n- COM.ibm.db2.db2.net.DB2Driver\n\n如果客户端上安装了\
    \ DB2 CAE，请使用此驱动。\n如果您不希望在客户端上安装 DB2 CAE，请使用此驱动。\n\n注册驱动程序的代码（假设您将配合原生 API 驱动使用此\
    \ Java 类）如下：\n\n```\ntry {\n  Class.forName(\"COM.ibm.db2.jdbc.app.DB2Driver\"\
    );\n} catch (Exception e) {\n  e.printStackTrace();\n}\n```\n\n### 创建连接\n\n使用\
    \ `getConnection` 方法创建到 DB2 数据库的连接。例如，假设连接已创建（见第 84 页“创建连接”）且 URL 已经定义。我们如下使用\
    \ `DriverManager` 类：\n\n```\nString url=\"jdbc:db2://...\";\nConnection con=null;\n\
    try {\n  con=DriverManager.getConnection(url);\n} catch (SQLException e) {\n \
    \ e.printStackTrace();\n}\n```\n\n### 创建语句\n\n每次我们执行语句时，都必须先创建一个语句。通过以下代码实现：\n\
    \n```\nStatement stmt=con.createStatement();\n```\n\n### 执行语句\n\n- 插入/更新/删除\n\
    SQL 插入、更新和删除返回受影响的行数。我们使用 `executeUpdate` 方法来执行这些 SQL 语句。它返回一个整数。\n```\nString\
    \ sqlStmt=\"delete from userinfo\";\nint rs=stmt.executeUpdate(sqlStmt);\n```\n\
    \n- 查询\nSQL 查询返回一组行。这被称为结果集（result set）。使用语句的 `executeQuery` 方法，它返回一个 `ResultSet`\
    \ 类型。我们可以编写代码：\n\n```\nString sqlStmt=\"select * from userinfo\";\nResultSet rs=stmt.executeQuery(sqlStmt);\n\
    ```\n\n要获取每行结果，我们使用 `next()` 方法。如果存在下一行，则该方法返回 `true`，且它的初始位置位于第一行结果之前。例如：\n\n\
    ```\nif (rs.next()) {\n  // 处理下一行\n}\n```\n\n每个结果集由其元数据（meta data）描述。要获取结果集的元数据，我们对结果集使用\
    \ `getMetaData()` 方法。例如：\n\n```\nResultSetMetaData rsmd=rs.getMetaData();\n```\n\
    \n我们可以通过一些示例代码来完美说明这一点。对于以下示例代码，我们假设连接已创建（见第 84 页“创建连接”）并已定义了输出 `out`。\n\na. 首先，我们创建语句：\n\
    Statement=con.createStatement();\nb. 第二，我们执行查询类型的语句，返回类型为 `ResultSet` 的结果：\nResultSet\
    \ rs=stmt.executeQuery(\"select * from userinfo\");\nc. 为了打印每个结果集行的第一列，我们有代码片段：\n\
    ```\nwhile (rs.next()) {\n  out.print(rs.getString());\n}\n```\nd. 为了更高级一些，我们可以通过获取结果集元数据、确定结果集的列数，然后使用\
    \ `getString` 方法打印出每行结果的所有列：\n\n```\nResultSetMetaData rsmd=rs.getMetaData();\n\
    int numFields=rsmd.getColumnCount();\nwhile (rs.next()) {\n  for (int currField=1;\
    \ currField<numFields; currField++) {\n    out.print(rs.getString(currField));\n\
    \  }\n  // 下一行\nout.println();\n}\n```\n\n# 字段/列从 1 开始\n\n注意字段/列计数从 1 开始。因此，上述示例代码中的循环从\
    \ 1 开始循环。\n\n`getString` 方法可以使用列号（如我们所做的那），也可以使用列名，例如：\nrs.getString(\"first_name\"\
    )\n\n你将在后的示例中以这两种形式看到该方法。\n\n"
