    \ directory. In our scenario, on our backend btest3, it would be located in /home/db2inst1/sqlib/db2dump.\
    \ This file is appended to, or created and appended to it if it does not already\
    \ exist, with diagnostic information.\n\nThe amount of diagnostic information\
    \ is determined by the DIAGLEVEL parameter found in the DB2 database manager configuration.\
    \ Log in as the DB2 instance owner and access the database manager configuration\
    \ using the command:\n\n```\ndb2 get dbm cfg\n```\n\nFigure 103 on page 137 shows\
    \ the result of running this command on our backend server, btest3, while logged\
