    ## 3.3 DB2 database


    This section discuss, in detail, the steps required to build the DB2 database
    that we use. The steps that we perform are discussed in the following:


    - Section 3.3.1, "Modelling the database" on page 61 where we provide the design
    considerations that we face in developing the database.


    - Section 3.3.2, "Creating the database" on page 66 shows the actual database
    creation.


    ### 3.3.1 Modelling the database


    To achieve the objective of the Web site, our database must, at the very least,
    model the following entities:


    - Users


    Users are the customers who come to the Web site to browse, log in with a username
    and password, register a profile of redbook category interests, and order redbooks.


    - Orders


    These entities reflect the order of a product by a user. For simplicity''s sake,
    a user may only order one product at a time (that is, there is no shopping basket
    concept where one or more products of differing quantities may be placed before
    an order is finalized).


    We examine each of these entities in more specific detail.


    #### 3.3.1.1 Users


    The entity users must have the following attributes:


    - Username and password

    Each username is considered to be unique. Hence, we validate that a user is registered
    by verifying the combination of the username and password. Each and every time
    an action is to be performed on the database, whether in changing or accessing
    user passwords, information, and profiles, the username and password must be verified.

    The username and password information needs to be built separately for performance
    and implementation reasons. For performance reasons, we need to separate the access
    to this information from all others to be able to provide fast and efficient access
    to the data. From an implementation point of view, we would also find more convenient
    to later change password encryption algorithms and access methods.


    - User information

    The user information contains information of the user''s first and last names,
    address, email, and so on. Once a user is registered, this information is usually
    static. These data are not usually changed.

    We added the date joined attribute to track when the user is registered.


    - Profile information

    The profile information reflects the user''s interests in terms of categories
    of redbooks. This list of categories of interest to the user may change often,
    depending on the user. The list of categories may also change in time.


    Based on the differences of the attributes, we decide to implement these attributes
    in different tables.


    #### 3.3.1.2 Orders


    Orders have the following attributes:


    - A username associated with the order

    - The timestamp of the order

    - The product that has been ordered

    - A unique order identification number


    This unique order ID is required, as we can no longer use username as a unique
    identifier (as a user can, or should be able to, order more than one product).


    #### 3.3.1.3 Complete design


    Based on the discussions for the user and order items, we will create four database
    tables. Each table has a set of fields, or column names, where each field has
    a data type, a length, and a nullable condition.


    - The Data type

    There are various data types that are available in DB2. We use the following data
    types in our database tables:

    - varchar: Provides variable length string type

    - char: Provides fixed length string type

    - date: Provides a date-only data type

    - timestamp: Provides a date and time up to a microsecond

    - int: Provides a whole number type


    - The field length

    This represents the length of the field, if appropriate. For example, a data type
    of char or varchar requires a length, a data type of date, timestamp, or int does
    not.


    - The nullable condition

    This last attribute, the nullable condition, exists for us to track whether the
    field can be left empty or undefined or must be filled in. For example, a "0 length
    string; it is not a null string.


    The structure of the database that we built is represented by the Entity Relationship
    diagram shown in Figure 54.


    ![](img/3a1768568392f28485a73ac443e8a0e7_73_0.png)


    Entity Relationship diagram of our DB2 database structure


    We can now list the field names and their attributes for each of the four database
    tables in the following sub-sections.


    ## USERVERIFY


    The USERVERIFY table contains the username and password. The fields of this table
    are shown in Table 1.


    Table 1. The USERVERIFY database table


    | Field name | Data type | Length | Nullable |

    |---|---|---|---|

    | username | varchar | 20 | no |

    | password | varchar | 20 | no |


    The username field will be the search key in this table; hence, we will also allocate
    it to be the primary key in the table.


    Neither username nor password are allowed to be empty.


    ## USERINFO


    The USERINFO table contains the user information. The fields of this table are
    shown in Table 2.


    Table 2. The USERINFO database table


    | Field name | Data type | Length | Nullable |

    |---|---|---|---|

    | first_name | varchar | 50 | no |

    | last_name | varchar | 50 | no |

    | email_address | varchar | 50 | no |

    | date_joined | date | - | no |

    | birth_date | date | - | no |

    | address | varchar | 200 | no |

    | username | varchar | 20 | no |


    ## USERPROFILE


    This contains the list of platform categories that a user would be interested
    in. Each registered user will have an entry in this table. All fields are set
    to nullable except for the username. If a registered user has indicated an interest
    in a platform, the field is set to a single character, typically a y. The fields
    for the USERPROFILE table are shown in Table 3.


    Table 3. The USERPROFILE database table


    | Field name | Data type | Length | Nullable |

    |---|---|---|---|

    | as400 | char | 1 | yes |

    | netfinity | char | 1 | yes |

    | ncf | char | 1 | yes |

    | nw | char | 1 | yes |

    | s390 | char | 1 | yes |

    | rs6000 | char | 1 | yes |

    | scalable | char | 1 | yes |

    | vm | char | 1 | yes |


    ## USERORDERS


    This contains orders. Each order, apart from having the username, product_id,
    and a timestamp for the order, will have a unique order_id. The fields for the
    USERORDERS table are shown in Table 4.


    Table 4. The USERORDERS database table


    | Field name | Data type | Length | Nullable |

    |---|---|---|---|

    | username | varchar | 20 | no |

    | order_timestamp | timestamp | - | no |

    | product_id | varchar | 20 | no |

    | order_id | int | - | no |


    The order_id field will be the search key in this table; hence, we will also allocate
    it to be the primary key in the table.


    We require all fields in this table be filled.

