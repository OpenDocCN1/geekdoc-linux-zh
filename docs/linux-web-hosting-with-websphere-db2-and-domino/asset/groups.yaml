    ## 4.1.2 DB2 operation


    This section discusses the manual startup and shutdown processes for a DB2 server.


    ### 4.1.2.1 Starting the DB2 instance


    The DB2 instance is started with the command:


    ```

    db2start

    ```


    This command must be executed by the DB2 instance owner, in our case, db2inst1.
    See Figure 91 for an example of the execution of this command on our backend server,
    dbtest3.


    ```

    [db2inst1@dbtest3 db2inst1]$ db2start

    SQL1063N DBSTART processing was successful.

    ```


    Figure 91. Starting the DB2 instance


    ### 4.1.2.2 Stopping the DB2 instance


    The DB2 instance is stopped with the command:


    ```

    db2stop

    ```


    This command must be executed by the DB2 instance owner, in our case, db2inst1.
    See Figure 92 for an example of the execution of this command on our backend server,
    dbtest3.


    ```

    [db2inst1@dbtest3 db2inst1]$ db2stop

    SQL1064N DBSTOP processing was successful.

    ```


    Figure 92. Stopping the DB2 instance


    In cases, there may be active connections to a database in the DB2 instance. This
    DB2 database is considered to be active, and if the db2stop command is issued,
    the DB2 database manager for the DB2 instance will complain as shown in Figure
    93.


    ```

    [db2inst1@dbtest3 db2inst1]$ db2stop

    SQL1025N The database manager was not stopped because databases are still active

    ```


    Figure 93. Stopping the DB2 instance when a database is still active


    We can ensure what connections to the database exist and decide if we will go
    ahead with halting the database. We use the db2 list command. A sample output
    of this command is shown in Figure 94 on page 119.


    ```

    [db2inst1@dbtest3 db2inst1]$ db2 list applications

    ```


    | Auth Application | Appl. Handle | Application Id | DB Name | # of Agents |

    |---|---|---|---|---|

    | DB2INST1 | java | 1 | 0706.000512653 | USERST | 1 |

    | DB2INST1 | java | 2 | 0804.000512655 | USERST | 1 |


    Figure 94. Looking connections to the instance


    We can obtain more information about these connections by using db2 list applications
    detail. Figure 95 shows the result of this command. The result is now showing
    more information for each database connection. In the case of database shutdown,
    we would normally use this information to check the status of the connections
    and determine if it is safe to forcibly disconnect them.


    ```

    [db2inst1@dbtest3 db2inst1]$ db2 list applications detail

    ```


    | Auth Id | Application Name | Appl. Time | Application Id | Seq# Num |

