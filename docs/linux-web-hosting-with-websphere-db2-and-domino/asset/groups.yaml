    ## 2.4.6 Configuring front-end access to backend databases


    At this point, our front-end server is not yet ready to access the backend DB2
    and Domino databases. We must perform further configuration on the front-end server.
    See the following sections:


    - Section 2.4.6.1, "Configuring front-end access to DB2" on page 44

    - Section 2.4.6.2, "Configuring front-end access to Domino" on page 49


    ### 2.4.6.1 Configuring front-end access to DB2


    In order for IBM WebSphere and IBM HTTP Server, installed on our server bdtest2,
    to have access to the DB2 Java class libraries and the DB2 server on our backend
    server, we must perform the following steps on the front-end server:


    1. Install the DB2 Client Application Enabler (CAE).

    2. Verify the DB2 CAE installation.

    3. Modify the IBM WebSphere configuration file to include the DB2 Java libraries.

    4. Modify the IBM HTTP Server to identify the DB2 instance and the relevant DB2
    libraries.

    5. Verify the access to the backend DB2 database.


    We describe these steps in the following sections.


    # Install IBM DB2 Client Application Enabler


    To perform this task:


    1. Log in as root.

    2. Change the working directory to the directory where the DB2 6.1 at fixpack
    3 code for the DB2 CAE is stored.

    3. Execute the `db2setup` command. Install the DB2 V6 screen opens.

    4. After running the `db2setup` command, depending on the distribution of DB2,
    either the DB2 Administration Client or the DB2 Runtime Client are available for
    installation. Choose whichever is available to install the CAE. In our scenario,
    this is available as the DB2 Administration Client.

    5. Press the **Enter key** to select the **DB2 Administration Client**. The screen
    should be presented in Figure 39.


    ![](img/3a1768568392f28485a73ac443e8a0e7_54_0.png)


    Figure 39. *Installing the DB2 CAE with the db2setup command*


    6. To ensure the Java components are installed, we move the cursor over the Customize
    option with Tab, then press Enter. We verify the Java support component will be
    as shown in Figure 40.


    | Select the products you are licensed to install. Your Proof of Entitlement and
    License Information booklet identifies the products for which you are licensed.
    |

    |---|---|

    | To see the preselected components or customize the selection, select DB2 Administration
    Center |

    | Required: | DB2 Client |

    | Optional: | [*] Java Support [ ] Control Center |

    | [ Select All ] | [ Deselect All ] [ Default ] |

    | [ OK ] | [ Cancel ] [ Help ] |


    Figure 40: Customizing the DB2 installation for Java support


    7. Select OK to continue.

    8. Back at the Install DB2 screen, choose OK to continue on instance creation.

    9. There are two methods of accessing DB2 with JDBC, the app driver and the net
    driver. Refer to Section 3.5.3, "Accessing DB2 via JDBC" on page 83 for more information.
    We use the Java app driver; therefore, we choose to create a DB2 instance.

    10. Accept all defaults in the DB2 instance screen. Choose OK and note the system
    generated password, ibdb2. Press Enter to acknowledge this, and return to the
    DB2 Services screen.

    11. Select OK to lead to the Summary Report screen. Choose Continue.

    12. To start the installation, choose OK. The installation will proceed.

    13. When the installation is complete, choose OK to proceed to the Status Report
    screen. Verify that all components have installed successfully and choose OK to
    return to the initial DB2 Installer screen.

    14. Choose Close to exit the DB2 installer and OK to dismiss the final warning
    about exiting the DB2 installer.


    # Verifying the DB2 CAE installation


    Once the DB2 CAE has been installed, verify it is working as follows:


    1. Log in as the DB2 instance owner, db2inst.

    2. Access the SAMPLE database in the backend server with the following commands
    in the order presented:

    db2 catalog tcpip node dbdtest3 remote 9.3.240.222 server 50000

    db2 catalog database sample at node dbdtest3

    Figure 41 shows the result of running these commands.


    ![](img/3a1768568392f28485a73ac443e8a0e7_56_0.png)


    Figure 41. Cataloging the SAMPLE database on the front-end server


    3. Verify the connection with the db2 connect command as follows:

    db2 connect to sample user db2inst1 using ibmdb2

    4. Finally, verify that an SQL select works by issuing the following command:

    db2 "select * from department"

    See 10 on page 18 for an example of the result for this query.


    # Modifying IBMSphere configuration files


    We must add the DB2 classpath for db2java.zip to the WebSphere Java.classpath
    parameter. To do this is:


    1. The bootstrap.properties file is located on the front-end server in /opt/ibmWebSphere/properties.

    2. Log in as root, edit this file, and find the following entry:

    Java.classpath

    3. Add the following path to this entry:

    /usr/IBMDB2/V6.1/Java/db2java.zip

    4. The entry in bootstrap.properties file should now look like Figure 42.


    ```

    ############################################

    # Java Virtual Machine configuration

    ############################################

    # The classpath for the JVM. This classpath is appended to the front

    # of the WebSphere runtime. This classpath should contain

    # the JVM classes and any user classes. The WebSphere classpath is

    # built dynamically from the contents of the <Install Root>/lib

    # directory

    Java.classpath=/opt/jdk/lib/classes.zip:/opt/IBMWebSphere/classes:/opt/IBMWebSphere/web/classes:/IBMDB2/V6.1/Java.zip

    ```

    Figure 42. Adding db2java.zip to WebSphere Java.classpath


    # Modifying IBM HTTP server configuration


    In order for the DB2INSTANCE environment parameter to be set, and the library
    paths must be modified to include the DB2 library. We modify the IBM Server startup
    file, /etc/init.d/httphttpd, and add the environment variables shown in Figure
    43.


    ```

    # #### START CONFIGURATION ####

    # The path to DB2

    export DB2INSTANCE=db2inst1

    export LIBPATH=/usr/IBMDB2/V6.1/lib:$LIBPATH

    export LD_LIBRARY_PATH=$LIBPATH:$LD_LIBRARY_PATH

    ```

    Figure 43. DB2INSTANCE and LIBPATH in inithttpd file


    Restart IBM HTTP Server to activate these settings.


    # Verifying access to the backend DB2 database


    We can now verify the access to our DB2 database with the TestDB2 servlet found
    in Appendix B.1, "Java servlet TestDB2" on page 147. Register the servlet in WebSphere,
    then access the servlet. The output from the servlet is shown in Figure 44 on
    page 49.


    ![](img/3a1768568392f28485a73ac443e8a0e7_58_0.png)


    ## 2.4.6.2 Configuring front-end access to Domino


    In order to access the Domino database from our front-end server, bdtest2, we
    must continue to configure WebSphere Application server with the following tasks:


    1. Copy the Domino.jar file from /local/notesdata/domino/Java/ directory on Domino
    server to the front-end server. We put the file on the /opt/domino directory.

    2. Edit the bootstrap.properties file. We have bootstrap.properties located at
    /opt/IBMWebSphere/properties.

    3. Put in the full path of Domino.jar in the classpath:

    ```

    Java.classpath=...:/opt/domino/Domino.jar

    ```

    Figure 45 on page 50 will show our modified bootstrap.properties.


    ```

    ####################################

    # Java Virtual Machine configuration

    ####################################

    # The classpath for the JVM. This classpath is appended to the front

    # of the WebSphere runtime classpath. This classpath should contain

    # the JVM classes and any user classes. The WebSphere classpath is

    # built dynamically from the contents of the <Install Root>/lib

    # directory

    Java.classpath:/opt/jdk/lib/classes.zip:/opt/IBMWebSphere/classes:/opt/IBMWebSphere/classes:/usr/IBMJRE6/java/java.zip:/opt/Domino/Domino.jar

    ```

    Figure 45. The Domino.classpath for bootstrap.properties


    4. Restart the IBM HTTP server with the following commands:

    ```

    killall Java

    /etc/rc.d/init/httphttpd stop

    /etc/rc.d/init/httphttpd start

    ```


    ### 2.4.6.3 Verifying WebSphere to access Domino server


    Verifying the WebSphere to access the Domino database, we need a simple Java servlet
    program. We create a simple servlet on WebSphere that tries to open a session
    to the Domino server and shows the title of the data.


    1. Write a servlet TestDomino that is provided in Appendix C.1, "Java servlet
    TestDomino" on page 159.

    2. Compile the servlet with Java compiler.

    3. Put the servlet class file to WebSphere servlets directory.

    4. Configure the WebSphere to load the servlet.

    5. To verify the connection between WebSphere and Domino, run the servlet from
    the Web browser. We use the URL:


    ```

    http://bdtest2/servlet/TestDomino?db=homepage&host=bdtest3&port=8000

    ```

    where homepage is the homepage.nsf database file that is available by default
    in Domino server.

    The result is similar to Figure 46 on page 51.

