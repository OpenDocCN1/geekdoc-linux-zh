    \ -f /etc/httpd`\n\nOn Caldera installations, the process differs. Figure 25 shows\
    \ the results of issuing these commands on our front-end server with a RedHat\
    \ installation.\n\n```\n[root@dbtest2 /opt]# rpm -e mod_perl\n[root@dbtest2 /opt]#\
