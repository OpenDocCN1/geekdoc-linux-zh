    ## Preface


    This redbook is intended to assist Web server administrators utilize IBM offerings
    to build and manage a Web server using Linux as the base operating system. It
    is assumed that the reader has basic administration skills, an understanding of
    general HTML syntax, and is knowledgeable in Java programming. Therefore, this
    redbook is not aimed at providing basic installation and configuration information
    on Linux or IBM software on Linux.


    The approach taken in this redbook is to create a Web server on Linux using IBM
    software as a case study. The Web server that we build is a customized IBM Redbook
    homepage, and we use the following:


    - Linux, the RedHat version 6.2 and Caldera eDesktop 2.4

    - IBM HTTP server version 1.3.6

    - IBM Database 2 version 6.1 with FixPack 3

    - IBM WebSphere Application Server version 2.03

    - Lotus Domino Server version 5.03


    The topics that we discuss are:


    - Creating dynamic Web pages using Java Server pages (JSP), servlets and Java
    bean

    - Providing dynamic user and user profile management using an interface to DB2

    - Integrating access to Lotus Domino database using the IIOP/CORBA interface

    - Operating the Web server


    ## The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Austin Center.


    Budi Darawan is a system specialist at the International Technical Support Organization,
    Austin Center. He writes extensively and teaches IBM classes worldwide on all
    areas of database, and system management. Before joining ITSO, he worked in IBM
    as solution architect for the services team. He has worked many years in distributed
    systems. His current interest is Tivoli system management software and Web programming.


    Alistair Roux is a Senior CE in South Africa. He has two years of experience with
    IBM in RS/6000 hardware and AIX. His areas of interest include Linux, AIX, DB2,
    and e-commerce products. This is his first Redbook.


    Yu Pheng Ong is a Software Specialist in Australia. He has six years of experience
    with IBM in the fields of database business intelligence, and e-commerce. His
    areas of expertise include Linux, Unix, and programming. He has written extensively
    on DB2 and redbooks.


    Iwan Setiawan is a System Engineer at PT Sistindo, Indonesia. He has three years
    of experience in the networking field. He holds a degree from University of Indonesia.
    His areas of expertise include Linux and Windows NT administration.


    Thanks to the following people for their invaluable contributions to this project:


    - John Owczczak, International Technical Support Organization, Austin Center

    - Catherine Webb, Integrated Solution leader


