    \ it manually.\n/opt/IBMHTTServer/bin/apachectl start: httpd could not be started\n\
    execution of script failed\n```\nFigure 26. rpm installation of IBM HTTP Server\n\
    \n- 2. Set ServerName directive\n\nIn the /opt/IBMHTTServer/conf directory, we\
    \ had to edit httpd.conf, adding the ServerName with our hostname. Figure 27 on\
