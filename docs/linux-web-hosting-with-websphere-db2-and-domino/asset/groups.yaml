    \ DB2, and Domino\n\n## Appendix E. Sample scripts\n\nThis appendix provides the\
    \ script listings for Notes operation.\n\n### E.1 start_domino.sh\n\n```bash\n\
    #!/bin/bash\n\nNOTES_USER=notes # Notes user\nNOTES_PATH=/home/notes # Home directory\
    \ of userid\nNOTES_DATA=/local/notesdata/ # data directory\nSERVER_PATH=/opt/lotus\
    \ # server location\nSERVER_NAME=SERVER01 # server name\nOUTPUT_LOG=/var/log/$SERVER_NAME.log\
    \ # Where we put the log\nPATH=$opt/lotus/bin:$HOME/bin:$PATH\nif [ \"$(whoami)\"\
    \ = notes ]; then\n\techo \"Don't use root for Domino server\"\n\tsu - notes\n\
    fi\nif [ -x $SERVER_PATH/bin/server ]; then\n\techo \"Cannot found the server\
    \ command exiting\"\n\texit 1\nfi\nif [ ! -d $NOTES_DATA ]; then\n\techo \"Cannot\
    \ access notes directory exiting\"\n\texit 1\nfi\nNOTES_RUNNING=$(ps -fu notes\
    \ | awk '{print $8}' | grep /opt/lotus | \\\ngrep -v grep | cut -d\"-\" -f 1,2,3,4\
    \ | head -nl)\nif ! $NOTES_RUNNING; then\n\techo \"Domino Server is already running\
    \ exiting\"\n\texit 1\nfi\ncd $NOTES_DATA\nrm -f *.notes.l 2>\nmems=$(ipcs -m\
    \ | grep $NOTES_USER | awk '{ print $2}')\nsems=$(ipcs -s | grep $NOTES_USER |\
    \ awk '{ print $2}')\nfor j in $mems; do if [ -n \"$j\" ]; then ipcrm shm $j >\
    \ tmp.lck; done\nfor j in $sems; do if [ -n \"$j\" ]; then ipcrm sem $j > tmp.lck;\
    \ done\nrm -f tmp.lck\necho \"Running Domino for LINUX\"\n```\n\n### E.2 cleanup_domino.sh\n\
    \n```bash\n#!/bin/bash\nNOTES_USER=notes\nNOTES_PATH=/local/notesdata\nPATH=$NOTES_PATH:/opt/lotus/bin:$HOME:$PATH\n\
    ```\n\n```bash\ncount=0\nNOTES_RUNNING=$(ps -fu $NOTES_USER | grep /opt/lotus\
    \ | grep -v grep | grep \\\n  -v bash)\nwhile [[ -n $NOTES_RUNNING ]]; do\n  sleep\
    \ 10\n  count=$((count + 1))\n  echo \"Waiting ...$count seconds\"\n  if [ $count\
    \ -eq 1 ]; then\n    echo \"Domino server is still running after 2 minutes\"\n\
    \    echo \"Now ... he will dead\"\n    for i in $(ps -fu $NOTES_USER | grep /opt/lotus|\
    \ grep -v grep | \\\n      awk '{print $2}'); do\n      kill -9 $i\n    done\n\
    \    sems=$(ps -m | grep $NOTES_USER | awk '{print $2}');\n    sems=$(ps -cs |\
    \ grep $NOTES_USER | awk '{print $2}');\n    for j in $sems; do if [ -n \"$j\"\
    \ ]; then ipcrm shm $j>tmp.lck;fi; done\n    for j in $sems; do if [ -n \"$j\"\
    \ ]; then ipcrm sem $j>tmp.lck;fi; done\n    rm -f tmp.lck\n    exit\n  fi\n \
    \ NOTES_RUNNING=$(ps -fu $NOTES_USER | grep /opt/lotus | grep -v grep )\n  rm\
    \ -f $NOTES_PATH/-notes.lck\n  echo \"Domino shutdown now completed\n```\n\n210\
    \ Linux Web Hosting with WebSphere, DB2, and Domino\n"
