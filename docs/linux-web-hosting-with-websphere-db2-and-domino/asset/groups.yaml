    ```\n\n### E.2 cleanup_domino.sh\n\n```bash\n#!/bin/bash\nNOTES_USER=notes\nNOTES_PATH=/local/notesdata\n\
    PATH=$NOTES_PATH:/opt/lotus/bin:$HOME:$PATH\n```\n\n```bash\ncount=0\nNOTES_RUNNING=$(ps\
    \ -fu $NOTES_USER | grep /opt/lotus | grep -v grep | grep\n  -v bash)\nwhile [[\
    \ -n $NOTES_RUNNING ]]; do\n  sleep 10\n  count=$((count + 1))\n  echo \"等待 ...$count\
