    # ## 3.5.2 Maintaining state in HTTP


    HTTP is a stateless protocol. To perform transactional activities, some kind of
    state must be maintained. There are many ways of maintaining state that has been
    developed: Using cookies, URL re-writing, hidden fields in the HTML form, and
    so on. The Java servlet API implements access to state via the HttpSession object.


    # ### 3.5.2.1 Session Tracking


    HttpSession is a technological implementation that is used to manage sessions
    on the stateless HTTP protocol. It is part of the Java Servlet API, and it is
    accessible in the Java Servlet development kit.


    The HttpSession object is the Java programming object that has a dictionary-like
    interface to store user-defined data. Data can be stored in the HttpSession object
    with any keyword, and the data is retrieved with that keyword.


    Each of the session objects has its own ID. HttpSession objects are related to
    the client using its session ID. The session tracker uses the session ID to find
    the user''s session object. The session object is not sent between the Web client
    and the server. Only the ID is passed back and forth between the Web client and
    the Web server. This means that the session object is suitable to store the user''s
    secure data.


    Since there are many different ways to represent a session data, the HttpSession
    provides a seamless, uniform way to access session data.'
