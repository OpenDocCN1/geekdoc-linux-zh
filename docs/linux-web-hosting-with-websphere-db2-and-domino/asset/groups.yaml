    on this redbook and the project.

    - Section 1.4, "Document organization" on page 4 provides the overall document
    structure of the redbook and an expanded Table of Contents.


    # ## 1.1 Linux and IBM


    As stated in the Linux at IBM Web site, http://www.ibm.com/linux, IBM is committed
    to supporting Linux as an option in the customer’s operating system:


    IBM is committed to supporting your choice of platform and operating systems --
    a commitment we’re extending to the support of Linux, the open-source operating
    system. To meet increased demand for this dynamic operating system, we provide
    the most comprehensive hardware, software and support solutions. Linux users can
    draw on IBM’s extensive experience, skills and resources to address their technical
    needs Global Support for all their Linux support needs, from consulting and enablement
    assistance to Operational Support Services. Customers can call a 24-hour telephone
    hot line or access a web-based help center to receive Linux support.


    There are several IBM products that are currently available in Linux. There are
    also a lot of other IBM products that are currently in beta test for Linux. The
    key IBM alliance for Linux distributions are:


    +   - Calder Alliance

    - Red Hat

    - Turbo Linux

    - SuSE'
  - '[PAGE 11]


    However, since availability of some of the products is limited, we only tested
    scenarios on RedHot Version 6.2 and Caldera eDesktop Version 2.4.


    # 1.2 Pattern for e-business


    The patterns for the e-business aim to provide a readily available design pattern
    on building an e-business system, including the system architecture and guidelines.
    These patterns are cataloged in the following schemes:


    +   * User-to-business

    * User-to-online buying

    * Business-to-business

    * User-to-data

    * User-to-user

    * Application integration


    For more information on these patterns for e-business, see the IBM developerWorks
    site at:


    ```

    http://www.ibm.com/software/developer/web/patterns

    ```


    We have chosen to implement the most common subset of the patterns, the user-to-online
    buying, which is a subset of the user-to-business pattern. The application topology
    that we choose is a Web-up approach, meaning that we create the application from
    scratch in the Web server with no backend integration. Figure 1 on page 3 shows
    the ideal run-time topology for this pattern.


    In Figure 1 on page 3, the e-business system for an enterprise spans from the
    demilitarized zone (DMZ) to the enterprise''s internal network. The following
    components comprises the e-business solution for the user-to-online buying pattern:


    +   * The protocol firewall filters unneeded and unnecessary incoming protocol
    packages. It only allows incoming requests to certain machines and contains ports.

    * The request dispatch acts as the load balancing for multiple Web server systems.
    It routes the requests to a certain Web server to facilitate a balanced load,
    thus enhancing the overall throughput.

    * The Commerce server node is the Web server with its application server, which
    processes HTTP requests from the Internet.

    * The domain firewall protects the internal network by only allowing certain machines
    in the DMZ to send request packages to the internal network.


