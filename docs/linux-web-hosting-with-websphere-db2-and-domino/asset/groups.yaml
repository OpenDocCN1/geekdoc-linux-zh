    \ level = 0xa0900\nCPU speed (millisecond/instruction) = 1.637460e-06\nMax number\
    \ of concurrently active databases (NUMDB) = 8\nData Links support (DATALINK)\
    \ = NO\nFederated Database System Support (FEDERATED) = NO\nTransaction processor\
    \ monitor name (TP_MON_NAME) =\nnDefault charge-back account (DFT_ACCOUNT_STR)\
    \ = \n```\n\n```\nJava Development Kit 1.1 installation path (JDK1_PATH) = \n\
    Diagnostic error capture level (DIAGLEVEL) = 3\nDiagnostic data directory path\
    \ (DIAGPATH) = /home/db2inst1/sqllib\n/db2dump\n```\n\n```\n--More--\n```\n\n\
    Figure 103. DIAGLEVEL parameter in the DB2 database manager configuration\n\n\
