    \ servlet AccessUserst\n\nAccessUserstf servlet 负责涉及 USERINFO、USERPROFILE、USERIFY\
    \ 和 ORDERERS 表的所有操作。因此，它必须执行以下操作：\n\n- 在初始化时（首次由 WebSphere 引擎加载时），它必须注册 DB2 类库并创建到\
    \ USERSTUF 数据库的连接。我们已经在第83页的3.5.3节“通过 JDBC 访问 DB2”中讨论了如何实现这一点，并在87页的图 67 中提供了示例代码。\n\
    \n- 在通过 POST 方法调用时，它必须实现所需的动作。我们将在本节中详细讨论这些操作的实现。\n\nDB2 servlet AccessUser 必须处理\
    \ POST 方法。因此，它被实现为 `HttpServlet`。每个操作都可能成功或失败。无论何种情况，重定向到的页面都作为参数在 Request 对象中传递，名称分别为\
    \ success 和 failure。\n\n对在 AccessUser servlet 中实现的动作进行简要讨论如下：\n\n- login\n此动作要求\
    \ Request 对象中有有效的用户名和密码。然后它将用户名、密码、用户信息和用户配置放入 `HttpSession` 对象中。\n\n- changpassword\n\
    此动作要求 `HttpSession` 对象中有有效的用户名和密码，并在 Request 对象中有新密码（password1）及其验证（password2）。它会检查\
    \ password1 是否等于 password2，并更新 userverify 表以及 `HttpSession` 对象中的密码值。\n\n- register\n\
