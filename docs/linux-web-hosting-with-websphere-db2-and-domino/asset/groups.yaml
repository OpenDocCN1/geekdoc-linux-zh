    之前，他曾在 IBM 担任服务团队的解决方案架构师。他在分布式系统领域工作多年。他目前感兴趣的方向是 Tivoli 系统管理软件和 Web 编程。


    Alistair Roux 是南非的高级客户工程师（CE）。他在 IBM RS/6000 硬件和 AIX 方面拥有两年的经验。他感兴趣的领域包括 Linux、AIX、DB2
    和电子商务产品。这是他的第一本 Redbook。


