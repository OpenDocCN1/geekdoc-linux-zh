    \ provides the source file listings for creating the DB2 tables in our project.\n\
    \n### A.1 The USERINFO table\n\n```\ncreate table userinfo (\nfirst_name varchar(20)\
    \ not null,\nlast_name varchar(20) not null,\nemail_address varchar(50) not null,\n\
    date_joined date not null,\nbirth_date date not null,\naddress varchar(200) not\
    \ null,\nusername varchar(20) not null,\nprimary key (username)\n);\n```\n\n###\
    \ A.2 The USERVERIFY table\n\n```\ncreate table userverify (\nusername varchar(20)\
    \ not null,\npassword varchar(20) not null,\nprimary key (username)\n);\n```\n\
    \n### A.3 The USERPROFILE table\n\n```\ncreate table userprofile (\nusername varchar(20)\
    \ not null,\ns000 char(1),\nettfinity char(1),\nncf char(1),\nnw char(1),\ns390\
    \ char(1),\nr6000 char(1),\nscalable char(1),\nvm char(1),\nvse char(1),\nwindows\
    \ char(1),\nother char(1),\nprimary key (username)\n);\n```\n\n### A.4 The USERORDERs\
    \ table\n\n```\ncreate table userorders (\n  username varchar(20) not null,\n\
    \  order_timestamp timestamp not null,\n  product_id varchar(20) not null,\n \
    \ order_id int not null,\n  primary key (order_id)\n);\n```\n\n## Appendix B.\
    \ Java code relating to DB2\n\nThis appendix provides the code listings of the\
    \ DB2 related Java codes.\n\n### B.1 Java servlet TestDB2\n\n```\npackage penguins.access.db2;\n\
    \nimport java.sql.*;\nimport javax.servlet.http.*;\nimport javax.servlet.*;\n\
    public class TestDB2 extends HttpServlet {\n    try {\n        Class.forName(\"\
    com.ibm.db2.jdbc.app.DB2Driver\");\n    } catch (Exception e) {\n        e.printStackTrace();\n\
