  mdcn: "\n\n```\nSession s = NoteFactory.createSession(\"bdtest1:8000\");\nDatabase\
    \ db = s.getData(\"Redbooks\");\nView view = db.getView(\"platform sorted\");\n\
    Navigator viewnav = view.createViewNavMaxLevel(0);\n```\n\n# 访问文档字段\n\n在 Navigator\
    \ 中获取条目后，我们可以执行某些方法访问文档：\n\n```\nNavigator nav = view.createViewNavFromCategory(\"\
    AS/400\");\nEntry entry = nav.getFirst();\nwhile (entry.hasNext()) {\n    Document\
    \ doc = entry.getDocument();\n}\n```\n\n此代码将返回与视图项相关的文档。\n\n如果条目不是文档，且在 ViewEntry\
    \ 对象创建后文档被删除，则返回 null。\n\n`getDocument(Item)` 方法返回一个文档对象。文档对象有几个方法我们可以用来检索字段值：\n\
    \n- *getItemValue(String)*\n  此方法返回具有字符串文本值的项的值。如果该项没有值，或者值是数值或日期时间，则此方法返回空字符串。\n\
    \n```\nout.println(entry.getDocument().getItemValueString(\"FormNumber\"));\n\
    ```\n\n此代码将返回列 FormNumber 的文本。\n\n- *getItemValue(String)*\n  此方法返回来自文档中相应字段的值。结果的数据类型始终为\
    \ `java.util.Vector`；然而，Vector 的元素取决于实际字段类型，如表 6 所示。\n\n表 6. `getItemValue()`\
    \ 返回项的数据类型\n\n| 项类型 | 值返回类型 |\n|---|---|\n| 富文本 (Rich text) | 包含纯文本 String 元素的\
    \ java.util.Vector |\n| 文本（包括 Names, Authors 和 Readers 类型）或文本列表 | 包含 String 元素的\
    \ java.util.Vector |\n| 数字或数字列表 | 包含 Double 元素的 java.util.Vector |\n| 日期时间或日期时间范围\
    \ | 包含 DateTime 元素的 java.util.Vector |\n\n在项目中，我们发现 PublishDate 列的值是一个日期时间；因此，我们必须使用以下代码将数据转换为字符串：\n\
    \n```\nVector dM = entry.getDocument().getValue(\"PublishDate\");\nif (dM.size()\
    \ > 0)\n  DateTime dt = (DateTime)dM.elementAt(0);\nString PublishDate = dt.getDateOnly();\n\
    ```\n\n# 3.6 JSP 文件\n\nJava Server Pages (JSPs) 是提供动态内容和增强功能的的 HTML 文件。它们利用 Java\
    \ 或各种脚本语言。\n\nJSPs 在使用之前会被 WebSphere 应用服务器编译为 servlet。\n\n当您在 Web 上安装 WebSphere\
    \ 应用程序时，Web 服务器的默认设置为将针对 JSP 文件（扩展名为 .jsp 的文件）的 HTTP 请求传递给应用程序服务器。应用程序服务器的默认设置为将\
    \ JSP 文件传递给其 JSP 处理器 pageCompile servlet。JSP 处理器为每个 JSP 文件从每个 JSP servlet 生成两个文件：\n\
    \n- java file - 包含 servlet 的 Java 语言代码\n- class file - 编译后的 servlet\n\nWebSphere\
    \ 将编译后的 JSP servlet 存储在 /opt/IBMWebAS/servlets/pagecompile 目录下。WebSphere 应用程序可以自动检测\
    \ JSP 的更改并根据需要重新编译 JSP 文件。请记住，在 WebSphere 安装后需要将 pagecompile 目录的所有者更改为 nobody。\n\
    \n# 3.6.1 JSP 组件\n\nJSP 文件可以是 .jsp 扩展名，并可以包含以下组合：\n\n- HTML 标签\n- JSP 指令，例如 <%@LANGUAGE=\"\
    Java\" %>\n- 内联脚本：<% ... %>\n- JSP 标签，例如 <%SERVLET>、 <%BEAN> 等\n\n# 3.6.1 JSP\
    \ 指令\n\nJSP 指令标签定义了适用于整个 JSP 页面的属性。我们在 JSP 页面中使用了 `<%@ LANGUAGE=\"Java\">`，表示我们将使用\
    \ Java 作为默认语言。图 72 显示了我们 logout.jsp 文件的部分。注意 JSP 指令位于文件的开头。\n\n```\n<!DOCTYPE\
    \ HTML PUBLIC \"//W3C//DTD HTML 3.2 FINAL//EN\">\n<%@ LANGUAGE=\"Java %>\n<HTML>\n\
    <HEAD>\n<META HTTP-EQUIV=\"Content-Type\" CONTENT=\"text/html;charset=ISO-889-1\"\
    >\n<TITLE>MainPage</TITLE>\n<BASE TARGET=\"parent\">\n```\n\n图 72. logout.jsp\
    \ 的部分\n\n所有相关 JSP 指令的完整列表可以 Sun 的 JSP 页面获取：\n\nhttp://java.sun.com/products/jsp\n\
    \n# 3.6.1.2 内联脚本\n\n您可以在 JSP 文件的 `< %>` 标签之间嵌入任何有效的 Java 代码。Java 代码可以与 HTML 混合。图\
    \ 73 展示了我们如何将 HTML 和 Java 嵌入到 JSP 文件中。\n\n```\n<HEAD>\n<TITLE>HomePage</TITLE>\n\
    <BASE TARGET=\"parent\">\n</HEAD>\n<% HttpSession session=request.getSession(true);\n\
    if (session.getValue(\"error\") != null) {\n  <B ALIGN=\"CENTER\"><FONT SIZE=\"\
    2\">ERROR:</FONT></B>\n  %\n  out.println(session.getValue(\"error\"));\n  }\n\
    \  session.removeValue(\"error\");\n%>\n```\n\n图 73. 在 JSP 文件中嵌入的 HTML 和 Java\n\
    \n在图 73 中，我们通过确保前面的 Java 语句被 `< %>` 包裹来嵌入 HTML，提供一些 HTML 代码，然后在 `< %>` 标签内部放置另一组\
    \ Java 代码。图 73 第 99 页中的 HTML 除非其之前的 Java 代码中的条件返回 true，否则将不会显示。\n\n# 3.6.1 JSP\
    \ 标签\n\n`<SERVLET>` 标签可以从 JSP 页面调用 servlet。其语法为：\n\n```\n<SERVLET_NAME name=servlet\
    \ servlet_class_name CODEBASE=remote_url initparam=parameter>\n  <PARAM PARAM_NAME\
    \ name=parameter_name VALUE=parameter_value>\n</SERVLET>\n```\n\n我们使用此标签包含 Domino\
    \ 数据库的最新发布版本，图 74 展示了该标签的用法：\n\n| | 最新发布 |\n|---|---|\n| servlet name=\"VBDGetLatest\"\
    \ | /servlet |\n\n图 74. 嵌入的 servlet 标签\n\n`<BEAN>` 标签用于在 JSP 页面中包含 Java bean。\n\
    \n（此处后续重复内容已省略）\n\n"
