    The following advanced features of IBM HTTP Server are available but not utilized
    in your project:


    +   * Section 5.1.2.1, "SSL" on page 141

    * Section 5.1.2.2, "Caching and dynamic pages" on page 141


    140 Linux Web Hosting with WebSphere, DB2, and Domino'
- md: '

    ## 5.1.2.1 SSL


    The IBM HTTP Server features include easy installation support for SSL secure
    connections.


    Secure Sockets Layer (SSL) is a protocol that provides privacy and integrity between
    two applications using TCP/IP. HTTP can use SSL for secure communications.


    The data travelling between the client and server are encrypted by a secret public-key
    algorithm is used for the exchange of the secret encryption key and for encrypting
    the digital signature in servers. With the server certificate, the client can
    verify the server''s identity.


    Once your server has a digital certificate, SSL-enabled browsers, such as Netscape
    Navigator and Microsoft Internet Explorer, can communicate securely with your
    server using the SSL protocol. The IBM HTTP Server powered by Apache supports
    client authentication, configurable cipher specifications, and session ID caching
    for improving SSL performance on the UNIX platforms. For further info on SSL,
    refer to:


    - http://home.netscape.com/erg/ssl/

    - http://www.ibm.com/software/webservers/httpsservers/


    ## 5.1.2.2 Caching and dynamic pages


    By default, most Web browsers and proxy servers cache Web pages. In the case of
    JSP files, HTML files, and servlets, these Web pages are dynamically generated
    and may change for each attempted access.


    In order to prevent caching, and thus access the newly generated dynamic data,
    we can add the following code in a Java Server Page or servlet to prevent Web
    browsers from caching JSP/SHTML files and servlets:


    ```

    response.setHeader("Pragma", "no-cache");

    response.setDateHeader("Expires", "0");

    response.setHeader("Cache-Control", "no-cache")

    ```


    Use the following code to prevent a proxy server from sharing cached pages:


    ```

    response.setHeader("Cache-Control", "private");

    ```


    Both of these headers can be combined to prevent caching.


    ## 5.2 Product limitations in Linux


    The level of WebSphere in Linux is lagging from the available version in other
    platforms (such as Windows NT or AIX). This poses a considerable restriction to
    our ability to utilize several of the new features that make the e-business development
    easier, such as the RequestDispatcher class. See Section 5.2.1, "The RequestDispatcher
    class" on page 142 for a more comprehensive discussion of this class.


    In our project, we access the Lotus Domino database using CORBA. Lotus Domino
    server can also be accessed by JDBC. However, the Lotus Domino Driver for JDBC
    is only available for a limited number of platforms, and Linux is not among them.
    See Section 5.2.2, "JDBC connections for Domino" on page 143 for a more comprehensive
    discussion of this feature from Lotus.


    ## 5.2.1 The RequestDispatcher class


    The basic use of RequestDispatcher class is to pass the current request to another
    program (servlet or JSP). A Request Dispatcher has two primary methods for including
    the response of another program or forwarding the request of the program to another.


    - Including the response from another program requires the use of the method:


    ```

    aRequestDispatcher.include(request, response)

    ```


    We would use this if we want to call another servlet from our current servlet,
    then perform more processing in the current servlet after calling this other servlet


    - Forwarding the request to another program requires the use of the method:


    ```

    aRequestDispatcher.forward(request, response)

    ```


    We would use this to forward the request to another servlet, and then allow this
    new servlet to return the response back to the client directly.


    Unfortunately for us, the RequestDispatcher class is only available in the Java
    SDK 2.1 API for the javax.servlet class (supported and extended in WebSphere 3.02).
    In our servlets, to be under WebSphere 2.03 (which only supports and extends SDK
    2.0), we were forced to use the deprecated callPage method in package com.sun.servlet.http.
    This also explains the use of the HttpServletResponse and HttpServletRequest objects
    in our Java code in servlet AccessUsersf.


    Refer to the URL http://novocode.doc/servlet-essentials/chapter0.html for a good
    tutorial about the RequestDispatcher class. Refer to the URL http://java.sun.com
    for official specifications and documentation for the various Java API specifications.


    ## 5.2.2 JDBC connections for Domino


    JDBC is an object interface that allows Java applications, applets, and agents
    to retrieve and manipulate data in database management systems using SQL. The
    interface allows a single application to connect to many different types of databases
    through a standard protocol.


    The Lotus Driver for JDBC implements the JDBC 1.0 specification. It can be for
    the Windows 95, Windows 98, and Windows NT 4.0 operating systems. This is a Type
    2 driver, which is comprised of a combination of Java classes and Non-compiled
    code. It is currently not available for any other platform (including Linux).


    The Domino Driver for JDBC allows Java programs to access Domino/Notes databases
    using JDBC. Java can work with any JDBC enabling reporting tool to access Domino
    databases. Java programmers can use Java Database Connectivity (JDBC) standard
    enabled application tool to access Lotus Domino databases as easily as any relational
    database. When running this JDBC driver with Domino R5, Java programmers can create
    Servlets that access Domino data. The Lotus Domino Driver for JDBC makes Domino
    databases like another relational back-end source to the SQL tool or application
    interface by producing result sets that mirror the relational model. An application
    can also perform a SQL Join of data from Domino with data from a relational database,
    such as Oracle, Sybase, or DB/2.


    Product features include:


    - Java standard access to Domino 4.5x, 4.6x, and R5x databases.

    - Compatible with Netscape Communicator 4.05 and higher.

    - Compatible with Microsoft Internet Explorer 4.01 with service pack 1 and higher.

    - Includes signed and unsigned version for maximum flexibility when creating Java
    applets that use JDBC

    - Year 2000 ready; so, it correctly reads and interprets dates in to two digit
    year (mm/dd/yy) and four digit year (mm/dd/yyyy) format.

    - Tested with IBM''s Visual Age for Java Version 2.0, IBM''s WebSphere Application
    Server 2.0, Lotus eSuite DevPack 1.5, Borland''s JBuilder 3 Professional, Jinfonet
    Software''s JReport Professional 1.3, EnterpriseSoft''s Enterprise Reports 3.0,
    Symantec''s Virtual Cafe Database Development Edition Version 3.0, and NetObjects
    BeanBuilder 1.0.

    - Multi-threaded for high performance Web use.

    - Works with clustered servers for high application availability via load balancing
    and fail over.

    - Four sample sources (.java files provided with documentation).

    - Lotus Domino Driver for JDBC is another step in Lotus commitment to open standards
    and accessibility to Domino databases and services so that customers can integrate
    Domino into any e-business solution regardless of their enterprise configuration
    or tools selection.


    The JDBC API is included in the JDK v1.1 and higher. The Lotus Domino Driver for
    JDBC (LDJJ) are provided when you download and install the Lotus Domino Driver
    for JDBC. The Lotus Domino Driver for JDBC requires DLLs to connect to the Domino/Notes
    database. (This is the non-Java compiled code referred to above).


    - If your Java program is running on a client computer, then the Notes client
    must be installed.

    - If your Java application is running on a server that is not running Domino,
    then the Notes client must be installed and configured to connect to the Domino
    server.

    - If your Java application is running on the Domino server (for example, running
    as a Servlet on R5), then the Notes DLLs and API are already present and do not
    need to be installed.


    # Knowledge of Notes API


    | Description |

    | :--- |

    | You do not need to know the Notes API. The Lotus Domino Driver for JDBC shields
    you from that and enables you to use the JDBC API to connect to Domino and SQL
    to query, update, and message Domino data |


    Refer to the URL http://www.lotus.com for more information about the Lotus Domino
    Driver for JDBC.


    144 Linux Web Hosting with WebSphere, DB2, and Domino

