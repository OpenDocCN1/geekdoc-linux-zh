    \ script file listings for the Notes operation.\n\n# E.1 start_domino.sh\n\n```\n\
    #!/bin/bash\n\nNOTES_USER=notes # Notes user id\nNOTES_PATH=/home/notes # Home\
    \ directory of Notes userid\nNOTES_DATA=/local/notesdata/ # Domino data directory\n\
    SERVER_PATH=/opt/lotus # Domino server location\nSERVER_NAME=SERVER01 # Domino\
    \ server name\nOUTPUT_LOG=/var/log/$SERVER_NAME.log # Where we will put the log\n\
    PATH=$opt/lotus/bin:$HOME/bin:$PATH\nif [ \"whoami\" = notes ]; then\nthen\n\t\
    techo \"Don't use root for Domino server\"\n\tsu - notes\nfi\nif [ -x $NOTES_SERVER/bin/server\
    \ ]; then\n\ttecho \"Cannot found the server command exiting\"\n\texit 1\nfi\n\
    if [ ! -d $NOTES_DATA ]; then\nthen\n\ttecho \"Cannot access notes data directory\
    \ exiting\"\n\texit 1\nfi\nNOTES_RUNNING=$(ps -fu notes | awk '{print $8}' | grep\
    \ /opt/lotus | \\\ngrep -v grep | cut -d\"-\" -f 1,2,3,4 | head -nl)\nif ! $NOTES_RUNNING;\
    \ then\nthen\n\ttecho \"Domino Server is already running exiting\"\n\texit 1\n\
    fi\ncd $NOTES_DATA\nrm -f *.notes.lck 2>\nmems=$(ipcs -m | grep $NOTES_USER |\
    \ awk '{ print $2}')\nnsems=$(ipcs -s | grep $NOTES_USER | awk '{ print $2}')\n\
    for j in $mems; do if [ -n \"$j\" ]; then ipcrm shm $j > tmp.lck; done\nfor j\
    \ in $sems; do if [ -n \"$j\" ]; then ipcrm sem $j > tmp.lck; done\nrm -f tmp.lck\n\
    echo \"Running Domino for LINUX\"\n```"
