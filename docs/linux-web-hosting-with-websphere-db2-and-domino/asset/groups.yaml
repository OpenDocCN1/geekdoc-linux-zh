    # 2.4.5 WebSphere


    We describe here the steps to install WebSphere on the front-end server, configure
    various configuration files for WebSphere and IBM HTTP Server, and verify that
    IBM HTTP Server will load and run Java servlets.


    # 2.4.5.1 Installing WebSphere


    WebSphere must be installed as the root user. It requires a JDK to be installed
    and a JAVA_HOME environment be set. Then it requires 2 components to be installed.
    These are the installation steps:


    +   1. Export JAVA_HOME=/opt/jdk118, since we had previously installed IBM JDK
    118 (see Section 2.4.3, "IBM JDK 118" on page 32).

    2. Install the WebSphere core, which has a file name of IBMWebAS-core-2.03-1.i386.rpm

    3. We can now install the Web server specific component. Since we are using IBM
    HTTP Server, we will use the file IBMWebAS-ibm-http-2.03-1.i386.rpm.


    ![](img/3a1768568392f28485a73ac443e8a0e7_48_0.png)


    Chapter 2. Setup and configuration 39'
