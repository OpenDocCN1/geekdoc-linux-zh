    - Section 4.3.2.4, "DB2 statistic" on page 132, which discusses updating DB2 statistics.


    ### 4.3.2.1 Backing up the DB2 database


    A DB2 database must be backed up using the db2 backup database command. Using
    a file system backup will not result in a database backup with database integrity
    intact.


    The DB2 backup command is fairly complex. An online or off-line database backup
    can be taken with several types of backup media (disk, tape, ADSM), using different
    buffer sizes, etc. It is outside of the scope of this section to discuss all these
    various options. Refer to IBM DB2 Universal Database Command Reference, SC09-2844,
    IBM DB2 Universal Database Administration Guide Volume 1, SC09-2839, and IBM DB2
    Universal Database Administration Guide Volume 2, SC09-2840, for more comprehensive
    information.


    We present the format of a simple db2 off-line database to, backing up our database
    USERSTUF to a directory on our server, /backup, as follows:


    ```

    db2 database userstuf to /backup

    ```


    ### 4.3.2.2 db2 database log files


    All databases have logs associated with them. These logs keep records of database
    changes. In certain situations, depending on the configuration of the DB2 database
    manager on the backend server, we may need to back up certain log files (inactive
    and archived log files) and delete them from their default locations.


    Deletingleting active log files

    Never delete active log files. These files are used by the DB2 database manager
    to keep track of current database transactions. Deleting these log would result
    in a database left in an inconsistent state.


    In our current DB2 instance configuration, the DB2 instance uses default circular
    logging. Hence, we have no requirement to back up and delete log files.


    It is outside of the scope of this section to discuss, in detail, database logs.
    Refer to the IBM DB2 Database Administration Guide Volume 1, SC09-2839, and IBM
    DB2 Universal Database Administration Guide Volume 2, SC09-2840, for more comprehensive
    information about the various types of log archiving (circular, log retain), different
    types of logs (active, archived, off-line archived), log file locations, and so
    on.


    It is also important to prune the content of the DB2 diagnostic log. Discussion
    on the DB2 diagnostic log is provided in Section 4.4.2, "DB2 diagnostic log file"
    on page 136.


    ### 4.3.2.3 Table reorganization


    Every now and then, DB2 tables need to be reorganize to improve their structure,
    and, therefore, also their performance. The DB2 table is reorganized using the
    following procedure:


    - 1. Invoke the DB2 command using the `db2` command from the instance owner, db2inst1,
    in our case.


    - 2. Connect to the database:


    ```

    db2> connect to userstuf

    ```


    - 3. Run reorganization for each table that you are interested in:


    ```

    db2> reorg table userverify

    db2> reorg table userinfo

    db2> reorg table userprofile

    db2> reorg table userorders

    ```


    See IBM DB2 Universal Database Command Reference, SC09-2844, for more information
    on the commands used.


    ### 4.3.2.4 DB2 statistic


    The DB2 statistic needs to be updated regularly to optimize the query running
    against the database. Run the DB2 statistic update against each table and database
    using the following procedure:


    - 1. Invoke the DB2 command using the `db2` command from the instance owner, db2inst1,
    in our case.


    - 2. Connect to the database:


    ```

    db2> connect to userstuf

    ```


    - 3. Update the statistic of each table that you are interested in:


    ```

    db2> runstats table userverify

    db2> runstats table userinfo

    db2> runstats table userprofile

    db2> runstats table userorders

    ```


    See IBM DB2 Universal Database Command Reference, SC09-2844, for more information
    on the commands used.


    ## 4.3.3 Routine maintenance


    This section provides an overview of the tasks we can perform.


    ### 4.3.3.1 Back up our database


    The following tasks are recommended to be performed for the IBM HTTP Server directory,
    in our case, /opt/IBMHTTPTPServer.


    - Backup of the ServerRoot directory. This directory contains all the configuration
    files and any Web pages found in htdocs.


    You can use any backup method you choose, such as a tar command, when issued from
    the /opt/IBMHTTPTPServer directory, will copy all the IBM HTTP Server files to
    a backup file, HTTPServer.tar:


    ```

    tar cvf /HTTPServer.tar

    ```


    - The logs contained in the /opt/IBMHTTPTPServer/logs directory are important
    source of information on the server; however, they tend grow quickly and need
    to be pruned.


    Issue the following commands from the /opt/IBMHTTPTPServer/logs directory to prune:


    ```

    mv access_log access_log.old

    kill -1 "httpd.pid"

    ```


    The kill is necessary; otherwise, httpd will keep writing to the previous log
    file.


    ### 4.3.3.2 Other maintenance


    Routine maintenance is needed to ensure the server continues to function. The
    redbook, A Roadmap for Deploying IBM In The Organization, SG24-5617, contains
    a useful checklist of maintenance. Please refer to this book for more information.


    ## 4.4 Troubleshooting overview


    This section provides an overview on troubleshooting some of the basic components
    of our server. The discussion is separated into:


    - Section 4.4.1, "IBM HTTP Server and WebSphere log files" on page 134

    - Section 4.4.2, "DB2 diagnostic log file" on page 136


    ### 4.4.1 IBM HTTP Server and WebSphere log files


    The following logs are very useful in finding a specific problem for determination
    and resolution in the server. WebSphere logs a large amount of information to
    its log files. If something is not functioning correctly, these logs should be
    looked at. We briefly discuss some of these log files. All log files can be found
    in /opt/IBMWebAS/logs. In this directory, you will typically find one or more
    of:


    - jvmstderr.log

    - jvmstdout.log


    The JVM standard error log probably most useful log of all the WebSphere logs.
    In this log, the standard error output from the main WebSphere Java process appears.


    The JVM standard output log is the most useful one in WebSphere. The standard
    output log contains all of the output written by Java applications to standard
    output using the methods of the static java.System.out. The format of this log
    is application dependent. Use this log to inspect debugging and informational
    messages from your Java applications writing to System.out. This log is always
    enabled.


    - apache.log.INFORM.*

    The IBM HTTP Server information log contains informational and error messages
    generated by the IBM HTTP Server included with WebSphere. Each time the server
    is re-initialized, a new log is generated with a different number used as the
    last component of the file name. The major part of each these logs is taken up
    with messages showing the properties with which WebSphere is initialized. This
    is useful in confirming the parameter values that a particular invocation of WebSphere
    is using. Each line contains the following components:

    - An ID number specific to the particular invocation of WebSphere. This is the
    same number used as a suffix to the log name.

    - A timestamp.

