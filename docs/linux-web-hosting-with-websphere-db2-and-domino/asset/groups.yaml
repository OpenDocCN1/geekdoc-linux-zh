- md: "\n## Explicitly closing the DB2 statement\n\nThe DB2 statement is automatically\
    \ closed when the last result row is reached or the Java instance is terminated.\
    \ In some cases, it is desirable to immediately release a statement's database\
    \ and JDBC resources; the close method provides this immediate release as:\nstmt.close();\n\
    \nThe bare minimum required to execute a simple DB2 query statement on the USERINFO\
    \ table, located in the USERSTUF database, is shown in Figure 67.\n\n```java\n\
    import java.servlet.*;\nimport java.servlet.http.*;\nimport java.sql.*;\n\npublic\
    \ class DB2Servlet extends HttpServlet {\n    public void doGet(HttpServletRequest\
    \ req, HttpServletResponse res) throws ServletException {\n        try {\n   \
    \         Class.forName(\"com.ibm.db2.jdbc.DB2Driver\");\n            String url=\"\
    jdbc:db2:userstuf\";\n            String uid=\"db2inst1\";\n            String\
    \ pwd=\"imdb2\";\n            Connection conn=DriverManager.getConnection(url,\
    \ uid, pwd);\n            Statement stmt=conn.createStatement();\n           \
    \ ResultSet rs=stmt.executeQuery(\"select * from userinfo\");\n            //\
    \ do do something with the result set here\n            stmt.close();\n      \
    \  } catch (Exception e) {\n            e.printStackTrace();\n        }\n    }\n\
    }\n```\n\n![](img/3a1768568392f28485a73ac443e8a0e7_96_0.png)\n\n## 3.5.3.3 DB2\
    \ servlet AccessUserst\n\nThe AccessUserstf servlet is responsible for all actions\
    \ involving the USERINFO, USERPROFILE, USERIFY, and ORDERERS tables. As such,\
    \ it must perform the following:\n\n- At initialization (when it is first loaded\
    \ by the WebSphere engine), it must register the DB2 class library and create\
    \ a connection to the USERSTUF database. We have already discussed how to implement\
    \ this in 3.5.3, \"Accessing DB2 via JDBC\" on page 83, and given example code\
    \ in Figure 67 on page 87.\n\n- At invocation, via a POST method, it must then\
    \ implement the action required. We will discuss the implementation of these actions\
    \ in further detail in this section.\n\nThe DB2 servlet AccessUser must act on\
    \ POST methods. Hence, it is implemented as an HttpServlet. Each action can either\
    \ succeed or fail. The page to redirect to, in either case, is passed as parameters\
    \ in the Request object with the name of success and failure.\n\nA brief discussion\
    \ of the actions implemented in the AccessUser servlet is as follows:\n\n- login\n\
    This action requires a valid username and password in Request object. It then\
    \ puts the username, password, user information, and user profile in the HttpSession\
    \ object.\n\n- changpassword\nThis action requires a valid username and password\
    \ in the HttpSession object and a new password (password1) with its validation\
    \ (password2) in the Request object. It checks whether password1 is equals to\
    \ password2 and updates the userverify table and the password value in the HttpSession\
    \ object.\n\n- register\nThis action requires a non-existing valid username, a\
    \ non-blank password, valid userinfo, and userprofile in the Request object. It\
    \ then performs the following:\n    - Inserts the new username and password into\
    \ userverify table\n    - Inserts the new userinfo into userinfo table\n    -\
    \ Inserts the new userprofile into userprofile tables\n    - Puts the username,\
    \ password, userinfo, and userprofile in the HttpSession object.\n\n- update\n\
    It requires a valid username, password in HttpSession object, and a valid userinfo\
    \ and userprofile in Request object. It then updates userinfo table and userprofile\
    \ table and the Session object.\n\n- delete\nThis action requires a valid username\
    \ and password in HttpSession object. It deletes the userverify entry and invalidates\
    \ the HttpSession object.\n\n- order\nThis action requires a valid username, password\
    \ in Session object, and product_id in Request object. It inserts the new order\
    \ into userorders table.\n\n- listorders\nThis action requires a valid username\
    \ and password in HttpSession object. It returns Orders with a list of order_ids,\
    \ associated timestamps and product_ids.\n\nThe complete list of AccessUserstf\
    \ servlet code is available in Appendix B.2, \"servlet AccessUserstf\" on page\
    \ 147. The complete discussion of all the method performed in the servlet is out\
    \ of the scope of the book. We will demonstrate the detailed implementation of\
    \ the login action in Section 3.5.3.4, \"AccessUserstf action-login\" on page\
    \ 89. The discussion of the listorders is discussed in the Java discussion in\
    \ Section 3.7, \"Accessing data through a Java bean\" on page 103.\n\n## 3.5.3.4\
    \ AccessUserstf action-login\n\nThe following sequence of tasks is performed when\
    \ the servlet is invoked with the action parameter that contains the value of\
    \ login:\n\n- 1. The login action expects the username and password parameters\
    \ to be set in the Request object and will access these parameters via the getParameter\
    \ method. Assuming there is a HttpServletRequest object passed via variable req,\
    \ the code to do this is as follows:\n```java\nString username=req.getParameter(\"\
    username\");\nString password=req.getParameter(\"password\");\n```\n\nFor purposes,\
    \ this code is reused often; hence, we code a getUsername and getPassword private\
    \ method to obtain these values. The method for getUsername is coded as follows:\n\
    \n```java\nprivate String getUsername(HttpServletRequest req) {\n    return req.getParameter(\"\
    username\");\n}\n```\n\nHence, we change our code as follows:\n```java\nString\
    \ username=getUsername(req);\nString password=getPassword(req);\n```\n\n## Overloading\
    \ methods\n\nThere is another form of getUsername that retrieves the value from\
    \ the HttpSession object. So, we have overloaded the getUsername and getPassword\
    \ methods.\n\n```java\nprivate String getUsername(HttpSession session) {\n   \
    \ return session.getValue(\"username\");\n}\n```\n\n- 2. If the login is to be\
    \ successful, we must populate the Session object, using the putValue method,\
    \ with the following information:\n\n    - a. username, password\nThis information\
    \ is already available in the username and password variables. Hence, the code\
    \ is simply:\n```java\nsession.putValue(\"username\", username);\nsession.putValue(\"\
    password\", password);\n```\n\n    - b. user information\nThe user information,\
    \ for example, an address or e-mail, must be obtained from the USERINFO database\
    \ table. We perform a select of the relevant information, then iterate through\
    \ the list of USERINFO columns to be populated into the Session object.\n\nWe\
    \ define a string array called infoCols, which contains a list of values that\
    \ we intend to obtain from the select statement, and then place it in the Session\
    \ object (in effect, using this array of strings as a filter). The code looks\
    \ something like Figure 69 on page 92.\n\n}\n\nChapter 3. Building the Web server\
    \ 91\n"
