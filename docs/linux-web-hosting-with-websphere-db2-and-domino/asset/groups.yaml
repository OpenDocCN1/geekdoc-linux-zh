    #  4.1.3.2 Starting and stopping the Domino server, DB2


    The Domino startup process using a command line is as follows:


    +   1. Log on with userID notes.

    2. Change to the Domino data directory. We have the data directory in /local/notesdata.

    3. Execute the command:

    /opt/lotus/bin/server

    where the /opt/lotus is the Domino server install path.


    The server console is started, and it displays the startup status and other Domino
    messages.


    To stop the Domino server from the server console, issue the quit command.

    The Domino server will shut down after 10 seconds.


    In order to be able to start Domino automatically, we develop a start_domino.sh
    script. The complete listing of the script is provided in Appendix E.1, "start,domino.sh"
    on page 209. The script performs the following sequence of tasks:


    +   1. Ensure log on using the notes userid.'
- md: '

    2. Ensure the Domino server is not running.

    3. Check and remove the IPC shared memory that is owned by userID notes.

    4. Start the Domino server.


    Having created the start_domino.sh script, we can start the Domino server automatically.
    We add an entry in the /etc/initab file as follows:

    notes:2:once -c /bin/su notes - /home/notes/start_domino.sh


    If Domino exits abnormally, the Domino Inter-Process Communication (IPC) resources
    need to be cleaned up before restarting Domino. In order to clean up Domino after
    a crash, perform the following steps:


    - 1. Kill all Domino processes of the server that failed from the userID notes.

    2. Remove the associated Inter-Process Communication (IPC) resources.

    3. List the corrupted shared memory and semaphores using the ipc command. The
    -m option shows the shared memories, and the -s option shows the semaphores.

    4. Remove any shared memory and semaphores. Use ipcrm shmid to remove shared memory,
    and use ipcrm sid to remove semaphores.

    5. Remove the -notes.lock file from the Domino directory.


    The cleanup_domino script performs the above steps and is provided in Appendix
    E.2, "cleanup_domino.sh" on page 210.


    ## 4.2 Facility monitoring


    This section provides an overview of monitoring the processes for the components
    of the Web solution we built. Various other methods may be employed to ensure
    the availability and performance of the system.


    ### 4.2.1 Monitoring WebSphere


    The loaded servlets can be viewed through the Server Execution Analysis screens
    as follows:


    - 1. Log on the WebSphere administration to get the WebSphere Introduction window
    as shown in Figure 88 on page 115.

    2. Select Server Execution Analysis.

    3. Select Monitors.

    4. Select Loaded Servlets to display the monitor window as shown in Figure 98
    on page 124.


    ![](img/3a1768568392f28485a73ac443e8a0e7_133_0.png)


    All log files, debug information, resource usage, and database details can be
    viewed from this window by selecting the corresponding menu item.


    ### 4.2.2 DB2 server monitoring


    There are two main monitoring tools included with DB2. These are:


    - DB2 Performance Monitor

    - The Performance Monitor provides information about the state of the DB2 Universal
    Database and the data it controls. It is a graphical utility that can be customized
    for our database environment. We can define thresholds or zones that trigger warnings
    or alarms when the values collected by the Performance Monitor are not within
    acceptable ranges.

    - We use the tool when we need to monitor an existing problem or when we want
    to observe the performance of our system. It also lets us to take a snapshot of
    database activity and performance data at a point in time.


    124 Linux Web Hosting with WebSphere, DB2, and Domino


    These snapshots are used for comparison over time. Each point on the graph represents
    a data value.


    This information can help us identify and analyze potential problems or identify
    exception conditions that are based on thresholds that we set. We use the performance
    tool if we need to know the performance of the database manager and its database
    applications at a single point in time and to look at trends over time. We can
    also use it to get a visual overview of what elements are in a state of alarm.
    This helps identify which parameters may need tuning. We can then look closely
    at the parameters that have been set for that element and change them to improve
    performance.


    - DB2 event monitors


    In contrast to taking a point in time snapshot the DB2 Performance Monitor, a
    DB2 event monitor collects information on database activities over a period of
    time. This collected information provides a good summary of the activity for a
    particular database event, for example, a database connection or an SQL statement.


    Event monitoring records the state of the database at the time that the specific
    event occurs. It allows us to obtain a trace of the activity on the database.
    Event monitor records are stored and analyzed after the data has been captured.
    We use the event monitor when we need to know how a transaction took or, for example,
    how much CPU an SQL statement used. We then use the Event Analyzer to read the
    data from the event monitor.


    Apart from these two tools, we should also regularly back up and analyze the DB2
