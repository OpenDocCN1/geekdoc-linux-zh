    \ /etc/init.d/httpd start\nStarting httpd: [Fri May 5 20:43:05] [warn] Loaded\
    \ /opt/WebAS/plugins/linux/mod_server.so uses plain API, might crash (please recompile\
    \ it)\n[FAILED]\n```\nFigure 24. Apache failure loading module\n\nBecause of this\
    \ error, Apache will not start. Hence, we had to remove the Apache server and\
    \ install IBM HTTP Server.\n\n### 2.4.4.1 Removing Apache server\n\nThe Apache\
    \ module should be removed, using the rpm -e command, in the following order:\n\
    \n- 1. Remove the mod_perl package with the command: `rpm -e mod_perl`\n- 2. Remove\
