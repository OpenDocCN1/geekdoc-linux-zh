    \n### 3.4.1.3 文档 (Document)\n\n文档是数据的容器，类似于数据库管理系统 (DBMS) 中的行。\n\n## 3.4.2 Redbooks\
    \ 数据库\n\nRedbooks.nf 数据库是从当前的 redbooks 视图复制的。从 redbook 数据库获得的重要功能是 Redbook 表单和可用视图。本节分为：\n\
    \n- 第 71 页3.4.2.1节，“Redbook 表单”，讨论了 redbook 文档的格式。\n- 第 74 页3.4.2.2节，“Redbook\
