    ## 2.4.2.3 Connecting a Domino client


    We can perform many administration functions using a Web browser, but we still
    need the Domino Administrator and Designer client to perform any other tasks,
    such as creating IDs or designing new databases.


    In our project, we install the Domino Administrator and Designer client in a separate
    machine since the Linux version of Domino Administrator and Designer is not available.
    We need to extract the administrator ID file before performing any more administration
    on the Domino server with Domino client and move it to the machine we plan to
    use for administration.


    - 1. Open the address book with a Web browser using the URL: http://bdtest3.itsc.austin.com/names.nsf

    - 2. Enter the administrator user ID of Domino Linux and its password as provided
    in the Administration setting window shown in Figure 15 on page 23.

    - 3. Click to the People view and open the Person document for the administrator
    created earlier and download the USER.ID file to the administration machine.


    Netscape users If you are using a Netscape browser, you may have to rename the
    ID file to USER.ID.


    To access the Domino server with our Domino Administrator or Designer client,
    follow these steps:


    - 1. Open Notes and switch to the USER.ID file we downloaded earlier.

    - 2. Click on the Administrator or Designer icon.

    - 3. For Designer, choose File -> Database -> Open, enter the server name or IP
    address of the new server, After a few seconds, the Notes client displays the
    databases available for the new server. For Administrator, choose File -> Open
    Server and specify the server name or IP address of the new server and click Open.


    ## 2.4.2.4 Domino server Java and CORBA requirements


    Before we use a Java program to access Domino data with CORBA, we must set up
    and configure our Domino server to support the Java and CORBA environments.


    ### HTTP and DIIOP


    In Domino R5, the installation scripts should configure the server to run HTTP
    and DIIOP tasks by default, but we must ensure that we have the following line
    in notes.ini file:


    ```

    ServerTask=<any other task>, HTTP, DIIOP

    ```


    Also, make sure that the lines shown in Figure 18 on page 26 appear on the server
    console when starting the Domino server.


    | 05/03/2000 01:50:40 PM | JVM: Java Virtual Machine initialized. |

    | 05/03/2000 01:50:41 PM | HTTP Web Server started |

    | 05/03/2000 01:50:45 PM | DIIOP Server started on bdtest1.itsc.austin.ibm.com
    |


    > Figure 18. Verifying Java, HTTP, and DIIOP tasks in the Domino server console


    These tasks can be started with the following console commands:


    - To load the HTTP task:

    ```

    load http

    ```

    - To load the DIIOP task:

    ```

    load diiop

    ```

