    ## Chapter 1. Project introduction


    In this chapter, we discuss background information on the overall project. The
    discussion is put forward in the following sections:


    - Section 1.1, "Linux and IBM" on page 1 shows IBM’s commitment to Linux as one
    of the supported operating systems.

    - Section 1.2, "Pattern for e-business" on page 2 shows the structured approach
    on building e-business within the enterprise using patterns.

    - Section 1.3, "Penguins on the Web" on page 4 provides the background information
    on this redbook and the project.

    - Section 1.4, "Document organization" on page 4 provides the overall document
    structure and an expanded Table of Contents.


    ## 1.1 Linux and IBM


    As stated in the IBM Web site, http://www.ibm.com/linux, IBM is committed to supporting
    Linux as an option in the customer’s operating system: IBM is committed to supporting
    your choice of platform and operating systems -- we’re extending to the support
    of Linux, the open-source operating system. To meet increased demand for this
    dynamic operating system, we provide the most comprehensive hardware, software
    and support solutions. Linux users can draw on IBM’s extensive experience, skills
    and resources to address their technical needs for all their Linux support needs,
    from consulting and enablement to Operational Support Services. Customers can
    call the 24-hour telephone hotline or access a web-based help center to receive
    Linux support.


    There are several IBM products that are currently available in Linux. There are
    also a lot of other IBM products that are currently in beta test for Linux. The
    key IBM alliance distributions are:


    - Caldera

    - Red Hat

    - Turbo Linux

    - SuSE


    However, since availability of some of the products is limited, we only tested
    scenarios on RedHat 6.2 and Caldera eDesktop 2.4.


    ## 1.2 Pattern for e-business


    The patterns for e-business aim to provide a readily available design pattern
    on building an e-business system, including the system architecture and guidelines.
    These patterns are cataloged in the following schemes:


    - User-to-business

    - User-to-online buying

    - Business-to-business

    - User-to-data

    - User-to-user

    - Application integration


    For more information on these patterns for e-business, see the IBM developerWorks
    site at:


    `http://www.ibm.com/software/developer/web/patterns`


    We have chosen to implement the most common subset of the patterns, the user-to-online
    buying, which is a subset of the user-to-business pattern. The application topology
    that we choose is a Web-up approach, meaning that we create the application from
    scratch in the Web server with no backend integration. Figure 1 on page 3 shows
    the ideal run-time topology for this pattern.


    In Figure 1 on page 3, the e-business system for an enterprise spans from the
    demilitarized zone (DMZ) to the enterprise''s internal network. The following
    components comprise the e-business solution for the user-to-online buying pattern:


    - The protocol firewall filters unneeded and unnecessary incoming protocol packages.
    It only allows incoming requests to certain machines and contains ports.

    - The request dispatch acts as the load balancing for multiple Web server systems.
    It routes the requests to a certain Web server to facilitate a balanced load,
    thus enhancing the overall throughput.

    - The Commerce server node is the Web server with its application server, which
    processes HTTP requests from the Internet.

    - The domain firewall protects the internal network by only allowing certain machines
    in the DMZ to send request packages to the internal network.


