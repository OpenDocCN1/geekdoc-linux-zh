    \nThe WebSphere trace log contains the output of the different tracing functions.\
    \ Each log entry is the result of an event picked up by one of the tracing monitors\
    \ and can contain any of the following six components:\n\n+ - A timestamp\n- The\
    \ name of the tracer that is the source of the event\n- The ID of the thread that\
    \ caused the event\n- The severity level of the tracer message\n- Any exception\
    \ generated by the event\n- The message text\n\n+ - servlet/adminservice/access_log\n\
    - servlet/adminservice/error_log\n- servlet/adminservice/event_log\n\nThe servlet\
    \ admin service error log contains messages that relate to events and errors that\
    \ occur during the execution of the WebSphere administration service. This includes\
    \ errors that may occur while running any tracing programs.\n\n+ - servlet/servletservice/access_log\n\
    - servlet/servletservice/error_log\n- servlet/servletservice/event_log\n\nThe\
    \ servlet service error log contains information generated by the WebSphere servlet\
    \ service in attempting to run servlets. It includes both errors pertaining to\
    \ particular servlets and information pertaining to the servlet service itself.\
    \ System.out and System.err output that is produced by servlets is placed in the\
    \ JVM standard output and standard error logs, respectively.\n\nThis log can be\
    \ used to diagnose both the cause of servlet failures and failures of the servlet\
    \ service. This log will record any exceptions thrown by WebSphere in trying to\
    \ load or configure servlets; so, it is a good place to start diagnosing these\
    \ sorts of problems. It will also contain information relevant to determining\
    \ the causes of servlet service start failures.\n\nThe service event log allows\
    \ you to see when servlets are loaded, when they are called, and with what parameters\
    \ they are called. It is useful in diagnosing why a particular servlet is failing\
    \ under conditions but not others since it shows how it is being called. You might\
    \ want to add debug writes to your servlet that includes a timestamp so you can\
    \ match the debug output is producing in standard output or standard error to\
    \ the messages in the event log that have a timestamp.\n\n+ - The WebSphere engine\
    \ tracing log shows detailed information about the activity on the server. This\
    \ log is stored in the directory that you specified when activating the tracing\
    \ function from the WebSphere administration. Each action that the server takes\
    \ is recorded. The format of this log is:\n\n+ - A timestamp\n+ - A message\n\n\
    This log is good for diagnosing CLASPATH problems since it provides detailed information\
    \ on which directories and JAR files have been found and verified in the classpath.\n\
    \n## 4.4.2 DB2 diagnostic log file\n\nDB2 keeps a diagnostics log file, called\
