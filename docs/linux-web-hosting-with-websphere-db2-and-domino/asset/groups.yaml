    ## 4.3.1 IBM HTTP Server maintenance


    The following tasks are recommended to be performed for the IBM HTTP Server directory,
    in our case, /opt/IBMHTTPTPServer.


    - Backup of the ServerRoot directory. This directory contains all the configuration
    files and any Web pages found in htdocs.


    You can use any backup method you choose, such as a tar command, when issued from
    the /opt/IBMHTTPTPServer directory, will copy all the IBM HTTP Server files to
    a backup file, HTTPServer.tar:


    ```

    tar cvf /HTTPServer.tar

    ```


    - The logs contained in the /opt/IBMHTTPTPServer/logs directory are important
    source of information on the server; however, they tend grow grow quickly and
    need to be pruned.


    Issue the following commands from the /opt/IBMHTTPTPServer/logs directory to prune:


    ```

    mv access_log access_log.old

    kill -1 "httpd.pid"

    ```


    The kill is necessary; otherwise, httpd will keep writing to the previous log
    file.


