    \ database table files in the directory db2inst1/NODE0000/SQL00002.\n\n## 3.4\
    \ Domino database\n\nIn this section, we discuss the Domino database that we.\n\
    \n### 3.4.1 Domino database concept\n\nA database is a collection of related data.\
    \ A database contains at least one table, but most have many. A database is a\
    \ collection of data that can be stored and retrieved efficiently.\n\n### 3.4.1.1\
    \ Form\n\nThe form is the skeleton provided to users to enter data.\n\n### 3.4.1.2\
