    \ Advanced Edition, SG24-5864.\n\nChapter 1. Project introduction 3\n\n## 1.3\
    \ Penguins on the Web\n\nThis redbook is produced from a residency project at\
    \ the ITSO in Austin, Texas. The redbook is aimed at showing IBM's ability to\
    \ provide an advanced platform for generic Web hosting and e-business using Linux\
    \ as the operating system.\n\nThe approach that we have taken is to actually build\
    \ an imaginary Web server that provides some sample e-business functionality on\
    \ Linux with IBM software. The Linux distributions that we use are the RedHat\
    \ Linux Version 6.2 and Caldera eDesktop Version 2.4. The IBM software we utilize:\n\
    \n- IBM WebSphere Server Version 2.03\n- IBM HTTP server Version 1.3.6\n- IBM\
    \ Database 2 Version 6.1 FixPak 3\n- Lotus Domino Version 5.03\n\nThe project\
    \ is extended further to provide some consideration on operating the Linux server.\
    \ The consideration spans from basic daily Linux operation to produce specific\
    \ tasks that may need to be performed in administering a Linux Web server.\n\n\
    The sample application that we choose to provide is a customized Web site for\
    \ the IBM Redbooks pages. The Web application that we built consists of the following:\n\
    \n- Dynamic Web page and user profile management using IBM DB2\n- Dynamic Web\
    \ page using Servlet, Java Server Page (JSP), and Java beans\n- Servlet and beans\
    \ management using WebSphere Application server\n- Access to the IBM Redbooks\
    \ database in the Domino server\n\nPutting all the above functions together shows\
    \ a lot of the inter-operability issues that we experienced. There are several\
    \ other redbooks that also discuss software and integration with Linux, as it\
    \ turns out, integrating all software in building a working solution is another\
    \ task in itself.\n\n## 1.4 Document organization\n\nThis redbook is aimed at\
    \ providing usage and administration information for Web administrators using\
    \ the Linux Web server with IBM products. We will not cover the basic installation\
    \ of products. It is assumed that the reader of the redux has basic HTML skill,\
    \ Java programming, and Linux administration knowledge. This document has the\
    \ following chapters:\n\n- Chapter 1, \"Project introduction\" on page 1, provides\
    \ some background information on the overall project.\n\n- Chapter 2, \"Setup\
    \ and configuration\" on page 7 provides an overview of the installation process\
    \ and procedure that we performed on our system. The installation process is mostly\
    \ described briefly except for some specific details that are required to make\
    \ the product work.\n\n- Chapter 3, \"Building the Web server\" on page 53 discusses\
    \ the steps that we took on building the Web server. This chapter discusses the\
    \ programming structure that we used and the code that we built. The coding techniques\
    \ that we cover include:\n\n- Access to DB2 using JDBC\n- Access to Domino using\
    \ IIOP\n- Generic HTTP session access\n- Java Server Page implementation\n- Java\
    \ beans programming\n\n- Chapter 4, \"Operational considerations\" on page 107\
    \ shows some basic operational tasks that may need to be performed to ensure the\
    \ operation of the Web server. The operation that is discussed here is the basic\
    \ starting and stopping of the facilities, routine maintenance that must be performed\
    \ and some monitoring and troubleshooting tips.\n\n- Chapter 5, \"Extending the\
    \ case study\" on page 139 discusses some things that can be achieved but is not\
    \ currently implemented in this project because of time limitations or product\
    \ limitations.\n\nThe appendices that we provide contains various source code\
    \ and HTML files that we used throughout the projects.\n\nWe also provide a CD-ROM\
    \ for all the source codes of the Java files, scripts, HTML files, and JSP files\
    \ that we used. Refer to Appendix F, \"Using the additional material\" on page\
    \ 211 for directions on using the CD-ROM.\n\n6 Linux Web Hosting with WebSphere,\
    \ DB2, and Domino\n\n## Chapter 2. Setup and configuration\n\nThis chapter contains\
    \ the basic setup and configuration tasks that we performed for the implementation\
    \ of the scenario. The items we discuss here consists of:\n\n- Section 2.1, \"\
    System configuration\" on page 7 shows the system configuration that we used in\
    \ our environment.\n- Section 2.2, \"Installation overview\" on page 8 provides\
    \ an overview of the setup tasks.\n- Section 2.3, \"Linux setup\" on page 11 discusses\
    \ the issues involved in setting up the Linux systems, including the hardware\
    \ requirement, disk partitioning, and actual consideration on RedHat and Caldera.\n\
    - Section 2.4, \"Application installation\" on page 14 shows the installation\
    \ and configuration of IBM software that is used in this project.\n\n### 2. System\
    \ configuration\n\nBased on the pattern of e-business user-to-online buying that\
    \ we choose in Section 1.2, we have a front-end server and a backend server. The\
    \ system configuration that we used is shown in Figure 2.\n\nWe have btest1 and\
    \ btest2 as the front-end server, the interface to the world. All the application\
    \ data resides in btest3 where the Domino and DB2 reside. We use both Caldera\
    \ eDesktop Version 2.4 and RedHat Version 6.2 for the front-end server, and for\
    \ the backend server, we use only RedHat Version 6.2.\n\nThe machines that we\
    \ used are IBM Netinity 3000 servers. These Netinity 3000 systems have the following\
    \ specifications:\n\n- Model: 8476-2U\n- Flash EEPROM level: NTKT29AUS\n- BIOS\
    \ Date: 02/10/100\n- Processor: Pentium II 350/100 Mhz\n- Memory: 192MB\n- SCSI:\
    \ Adatec AHA 2940 uWB Bios 1.32S8\n- Disk: 8 GB\n- Video Adapter: S3 Trio3D 4\
    \ MB RAM\n- Network: IBM PCI Token Ring Card\n\n### 2.2 Installation overview\n\
    \nThis section provides a series of global steps that were used to install the\
    \ systems. The steps that are presented in this section can serve as either the\
    \ overview or as a checklist to perform the installation. Detailed discussion\
    \ of each step is provided in the subsequent sections.\n\nWe present the steps\
    \ for the backend server first, ensuring the databases are available for access,\
    \ then the steps for the front-end servers, and then verify that the front-end\
    \ servers can access the backend database.\n\n### 2.2.1 Installation of backend\
    \ server\n\nThe backend server installation steps are:\n\n1. Prepare the hardware\
    \ and ensure that it satisfies all the required configuration for all the software\
    \ that will be used.\n2. Install our chosen Linux distribution.\n   - Add the\
    \ userID admin as a normal user.\n   - Become familiar with the preferred X-Window\
    \ environment: KDE or GNOME.\n"
