    environment that supports JDK 1.1.6 or later, such as Sun JDK 1.1.6, IBM VisualAge
    for Java 3.0, or Symantic Visual Cafe 3.0.


    The CLPATH for compiling and running a Domino servlet must include:


    +   * Base Java classes in classes.zip

    * Java servlet classes

    * Domino classes in NCSO.jar for remote access or notes.jar for local access


