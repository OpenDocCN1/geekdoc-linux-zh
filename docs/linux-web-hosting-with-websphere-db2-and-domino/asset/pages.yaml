    and libstdc++2.9.1 or greater was installed on the machine. More importantly,
    the distribution must follow the libstdc++-libc6 naming convention.

    * Stop any unnecessary services on the Linux box.

    We have to make sure that services, such as http server or sendmail may have started
    automatically, are stopped.

