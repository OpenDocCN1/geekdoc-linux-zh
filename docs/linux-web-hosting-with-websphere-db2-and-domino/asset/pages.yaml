  md: '# Chapter 5. Extending the case study


    This chapter discuss some possible possibilities extension of our implementation.
    We explain these possibilities without being able to perform themselves. The discussion
    is divided into:


    +   - Section 5.1, "Utilizing advanced features" on page 139, which discusses
    the available features that we do not use because of the complexity in implementing
