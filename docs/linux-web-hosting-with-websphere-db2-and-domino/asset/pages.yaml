  md: "We have btest1 and btest2 as the front-end Web server, the interface to the\
    \ world. All the application data resides in btest3 where the Domino and DB2 databases\
    \ reside. We use both Caldera eDesktop Version 2.4 and RedHat Version 6.2 for\
    \ the front-end server, and for the back-end server, we use only RedHat Version\
    \ 6.2.\n\nThe machines that we used are IBM Netinity 3000 servers. These Netinity\
    \ 3000 systems have the following specifications:\n\n+   - Model: 8476-2U\n- Flash\
    \ EEPROM level: NTKT29AUS\n- BIOS Date: 02/10/100\n- Processor: Pentium II 350/100\
    \ Mhz\n- Memory: 192MB\n- SCSI: Adatec AHA 2940 uWB Bios 1.32S8\n- Disk: 8 MB\
    \ GB\n- Video Adapter: S3 Trio3D 4 MB RAM\n- Network: IBM PCI Token Ring Card\n\
    \n# ## Installation overview\n\nThis section provides a series of global steps\
    \ that were used to install the systems. The steps that are presented in this\
    \ section can serve as either the overview or as a checklist to perform the installation.\
    \ Detailed discussion of each step is provided in the subsequent sections.\n\n\
