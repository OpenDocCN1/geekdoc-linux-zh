    # 3.5.3 Accessing DB2 via JDBC


    The initial setup for a Java class to access DB2 using JDBC requires importing
    the appropriate package, registering the DB2 driver, and creating the connection
    to the DB2 database. This only needs to be done once.


    After that, each SQL statement to execute requires a statement to be created,
    executed, and finally closed.


    Lastly, we give an example of what is required to write a Java servlet to access
    the DB2 database using JDBC.


    # 3.5.3.1 DB2 JDBC Drivers


    DB2 JDBC main usages are for executing dynamic SQL statements and supporting upper
    data layers, as SQLJ and IBM Access beans.


    DB2 provides two JDBC drivers: a native API Type 2 driver and a net protocol Type
    3. The Java classes for both drivers are found in db2java.zip.


    +   * The native API driver is for server-side applications that run on the application
    server. The driver consists of Java parts and a C native API interface (DB2 CLI).
    The driver translates JDBC calls into DB2 CLI calls. Then gives the calls to the
    DB2 Client component, which passes them to the DB2 Server. After that, the driver
    returns the result back to the application. The class name for this JDBC driver
    is COM.ibm.db2.jdbc.app.DB2Driver.

    * The net protocol driver is for creating an application using the Java applet
    model. The driver is a 100 percent Java program that is downloaded with the applet
    to the client browser. The driver exchanges messages, by using the TCP socket
    protocol, to a JDBC Applet Server in the application server machine. The JDBC
    Applet Server translates applet messages into DB2 CLI calls. It sends them into
    the DB2 Client component, which passes them to the DB2 Server. Then, the JDBC
    Applet Server passes the results back to the applet. The class name for this JDBC
    driver is COM.ibm.db2.jdbc.net.DB2Driver.'
