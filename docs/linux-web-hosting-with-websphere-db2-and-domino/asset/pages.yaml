- img_proc: true
  md: '# 4.3.2.3 Table reorganization


    Every now and then, DB2 tables need to be reorganize to improve their structure,
    and, therefore, also their performance. The DB2 table is reorganized using the
    following procedure:


    +   1. Invoke the DB2 command using the `db2` command from the instance owner,
    db2inst1, in our case.


    +   2. Connect to the database:


    ```

    db2> connect to userstuf

    ```


    +   3. Run reorganization for each table that you are interested in:


    ```

    db2> reorg table userverify

    db2> reorg table userinfo

    db2> reorg table userprofile

    db2> reorg table userorders

    ```


    See IBM DB2 Universal Database Command Reference, SC09-2844, for more information
    on the commands used.


    # 4.3.2.4 DB2 statistic


    The DB2 statistic needs to be updated regularly to optimize the query running
    against the database. Run the DB2 statistic update against each table and database
    using the following procedure:


    +   1. Invoke the DB2 command using the `db2` command from the instance owner,
    db2inst1, in our case.


    +   2. Connect to the database:


    ```

    db2> connect to userstuf

    ```


    +   3. Update the statistic of each table that you are interested in:


    ```

    db2> runstats on table userverify

    db2> runstats on table userinfo

    db2> runstats on table userprofile

    db2> runstats on table userorders

    ```


    See IBM DB2 Universal Database Command Reference, SC09-2844, for more information
    on the commands used.


    # 4.3.3 Routine Domino maintenance


    This section provides an overview of the tasks that are needed to be performed
    for the Domino server.


    132 Linux Web Hosting with WebSphere, DB2, and Domino'
  merge: -1
