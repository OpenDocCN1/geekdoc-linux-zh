    # Access to Domino session and database


    Session is the root in the containment hierarchy of the Domino object. We can
    open a session to Domino server using several method depending on how we will
    access the server.


    We can have two option for accessing the server:


    +   - Remote access


    For accessing the Domino database remotely, we need to put the hostname, userid,
    and password in the NotesFactory.createSession method. For example, we try to
    open databaseDB on server host1 with userid myUser and password myPass:


    ```

    Session s = NotesFactory.createSession("host1:8000", "myUser", "myPass");

    Database db = s.getDatabase("DB");

    ```


    Remember that the HTTP and DIOP server must be running on the server. In our case,
    we use anonymous access to DIOP so that we can just put the hostname in the NotesFactory.createSession
    method. For more information on how to set up DIOP server, please refer to Section
    2.4.2.4, "Domino server Java and CORBA requirements" on page 26.


    +   - Local access


    Local access is simpler, but the Domino server or client should be running on
    the machine the Java program is executing. For this local access, the Domino servlet
    manager must be enabled. The following example accesses the mydb database locally:


    ```

    Session s = NotesFactory.createSession();

    ```'
