  md: '# ## 4.4 Troubleshooting overview


    This section provides an overview on troubleshooting some of the basic components
    of our Web server. The discussion is separated into:


    +   - Section 4.4.1, ''IBM HTTP Server and WebSphere log files'' on page 134

    - Section 4.4.2, ''DB2 diagnostic log file'' on page 136


    # ## 4.4.1 IBM HTTP Server and WebSphere log files


    The following logs are very useful in finding a specific problem for problem determination
    and resolution in the Web server. WebSphere logs a large amount of information
    to its log files. If something is not functioning correctly, these logs should
    be looked at. We briefly discuss some of these log files. All log files can be
    found in /opt/IBMWebAS/logs. In this directory, you will typically find one or
    more of:


    +   - jvmstderr.log

    - jvmstdout.log


    The JVM standard error log probably the most useful log of all the WebSphere logs.
    In this log, the standard error output from the main WebSphere Java process appears.


    The JVM standard output log is the most useful one in WebSphere. The standard
    output log contains all of the output written by Java applications to standard
    output using the methods of the static java.lang.System.out. The format of this
    log is application dependent. Use this log to inspect debugging and informational
    messages from your Java applications writing to System.out. This log is always
    enabled.


    +   - apache.log.INFORM.*

    The IBM HTTP Server information log contains informational and error messages
    generated by the IBM HTTP Server included with WebSphere. Each time the server
    is re-initialized, a new log is generated with a different number used as the
    last component of the file name. The major part of each these logs is taken up
    with messages showing the properties with which WebSphere is initialized. This
    is useful in confirming the parameter values that a particular invocation of WebSphere
    is using. Each line contains the following components:

    - An ID number specific to the particular invocation of WebSphere. This is the
    same number used as a suffix to the log name.

    - A timestamp.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '- The word Property.


    - The property name and value separated by an = sign.


    - apache.log.ERROR.* and apache.log.TRACE.*


    The IBM HTTP server log contains error messages generated by the IBM HTTP server
    log included with WebSphere. The format and content is restricted to those describing
    error conditions. The messages are also included in the information log, but the
    HTTP server trace log contains additional information when tracing is activated.


    - WebSphere_trace.log


    The WebSphere trace log contains the output of the different tracing functions.
    Each log entry is the result of an event picked up by one of the tracing monitors
    and can contain any of the following six components:


    +   - A timestamp

    - The name of the tracer that is the source of the event

    - The ID of the thread that caused the event

    - The severity level of the tracer message

    - Any exception generated by the event

    - The message text


    +   - servlet/adminservice/access_log

    - servlet/adminservice/error_log

    - servlet/adminservice/event_log


    The servlet admin service error log contains messages that relate to events and
    errors that occur during the execution of the WebSphere administration service.
    This includes errors that may occur while running any tracing programs.


    +   - servlet/servletservice/access_log

    - servlet/servletservice/error_log

    - servlet/servletservice/event_log


    The servlet service error log contains information generated by the WebSphere
    servlet service in attempting to run servlets. It includes both errors pertaining
    to particular servlets and information pertaining to the servlet service itself.
    System.out and System.err output that is produced by servlets is placed in the
    JVM standard output and standard error logs, respectively.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'This log can be used to diagnose both the cause of servlet failures and failures
    of the servlet service. This log will record any exceptions thrown by WebSphere
    in trying to load or configure servlets; so, it is a good place to start diagnosing
    these sorts of problems. It will also contain information relevant to determining
    the causes of servlet service start failures.


    The service event log allows you to see when servlets are loaded, when they are
    called, and with what parameters they are called. It is useful in diagnosing why
    a particular servlet is failing under conditions but not others since it shows
    how it is being called. You might want to add debug writes to your servlet that
    includes a timestamp so you can match the debug output is producing in standard
    output or standard error to the messages in the event log that have a timestamp.


    +   - The WebSphere engine tracing log shows detailed information about the activity
    on the server. This log is stored in the directory that you specified when activating
    the tracing function from the WebSphere administration. Each action that the server
    takes is recorded. The format of this log is:


    +   - A timestamp


    +   - A message


    This log is good for diagnosing CLASPATH problems since it provides detailed information
    on which directories and JAR files have been found and verified in the classpath.


    # 4.4.2 DB2 diagnostic log file


    DB2 keeps a diagnostics log file, called db2diag.log. This file is located in
    the instance home directory under sqllib/db2dump directory. In our scenario, on
    our backend btest3, it would be located in /home/db2inst1/sqlib/db2dump. This
    file is appended to, or created and appended to it if it does not already exist,
    with diagnostic information.


    The amount of diagnostic information is determined by the DIAGLEVEL parameter
    found in the DB2 database manager configuration. Log in as the DB2 instance owner
    and access the database manager configuration using the command:


    ```

    db2 get dbm cfg

    ```


    Figure 103 on page 137 shows the result of running this command on our backend
    server, btest3, while logged in as the DB2 instance owner, db2inst1. The DIAGLEVEL
    information line has been highlighted in bold.'
