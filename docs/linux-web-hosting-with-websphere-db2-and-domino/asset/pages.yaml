    +   * Section 2.3.1, "Disk partitioning" on page 11, which discusses our disk
    partitioning strategy


    +   * Section 2.3.2, "RedHat installation" on page 12, which discusses the RedHat
    Version 6.2 installation


    +   * Section 2.3.3, "Caldera EDesktop installation" on page 13 which discusses
    the Calder EDesktop Version 2.4 installation


