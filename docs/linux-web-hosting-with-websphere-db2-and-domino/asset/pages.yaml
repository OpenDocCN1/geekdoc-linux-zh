  md: '# 2.3.2 RedHat installation


    Installation of RedHat is easy, simply boot off the RedHat 6.2 CD-ROM andnchoose
    the defaults for most options, with the following exceptions:


    +   * Install type


    We chose Server for our installation type.


    +   * Network Configuration


    Our network was token ring based; hence, we chose to set up the tr0ninterface
    for the token ring. This option is available only from a GUI setup,

    it is not available when installing in text mode.


    +   * Account Configuration


    As previously mentioned in 2.2, "Installation overview" on page 8, wencreated
    a userID called admin.


    +   * X Configuration


    Since we would also need an X11 server to configure WebSpherenusing a Web browser,
    we upgraded the Linux installation for the front-endnserver to include X11. Remember
    to install at least the following for X11:


    +   * XFree86

    * XFree86 SVGA server

    * A XFree86 server specific for the video card (in our case, we used thenXFree86
    S3 server)

    * X11R6 Contrib

    * Xconfigurator

    * various XFree86 fonts

    * XFree86 libraries

    * XFree86 xfs


    We found that choosing the combination of IBM G74 and S3 Trio3D with 4nMB RAM
    would not pass the X Configuration page''s test-configurationnutton test. The
    fix was to specify a custom monitor as SVGAnon-interlaced, 50-90 Hz.


    Once installation was complete, the CD was removed from the CD-ROMndrive, and
    the server was rebooted.


    We can now proceed to the application installation phase.'
