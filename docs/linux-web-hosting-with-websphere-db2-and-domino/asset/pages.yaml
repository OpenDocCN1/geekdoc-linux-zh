  md: 'The DB2 backup command is fairly complex. An online or off-line database backup
    can be taken with several types of backup media (disk, tape, ADSM), using different
    buffer sizes, etc. It is outside of the scope of this section to discuss all these
    various options. Refer to IBM DB2 Universal Database Command Reference, SC09-2844,
    IBM DB2 Universal Database Administration Guide Volume 1, SC09-2839, and IBM DB2
    Universal Database Administration Guide Volume 2, SC09-2840, for more comprehensive
    information.


    We present the format of a simple db2 off-line database to, backing up our database
    USERSTUF to a directory on our server, /backup, as follows:


    ```

    db2 database userstuf to /backup

    ```


    # 4.3.2.2 db2 database log files


    All databases have logs associated with them. These logs keep records of database
    changes. In certain situations, depending on the configuration of the DB2 database
    manager on the backend server, we may need to back up certain log files (inactive
    and archived log files) and delete them from their default locations.


    Deleting active log files

    Never delete active log files. These files are used by the DB2 database manager
    to keep track of current database transactions. Deleting these log would result
    in a database left in an inconsistent state.


    In our current DB2 instance configuration, the DB2 instance uses default circular
    logging. Hence, we have no requirement to back up and delete log files.


    It is outside of the scope of this section to discuss, in detail, database logs.
    Refer to the IBM DB2 Database Administration Guide Volume 1, SC09-2839, and IBM
    DB2 Universal Database Administration Guide Volume 2, SC09-2840, for more comprehensive
    information about the various types of log archiving (circular, log retain), different
    types of logs (active, archived, off-line archived), log file locations, and so
    on.


    It is also important to prune the content of the DB2 diagnostic log. Discussion
    on the DB2 diagnostic log is provided in Section 4.4.2, "DB2 diagnostic log file"
    on page 136.'
