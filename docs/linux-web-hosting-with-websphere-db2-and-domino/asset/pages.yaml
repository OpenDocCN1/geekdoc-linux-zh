  md: "# Appendix E. Sample Domino scripts\n\nThis appendix provides the script file\
    \ listings for the Notes operation.\n\n# E.1 start_domino.sh\n\n```\n#!/bin/bash\n\
    \nNOTES_USER=notes # Notes user id\nNOTES_PATH=/home/notes # Home directory of\
    \ Notes userid\nNOTES_DATA=/local/notesdata/ # Domino data directory\nSERVER_PATH=/opt/lotus\
    \ # Domino server location\nSERVER_NAME=SERVER01 # Domino server name\nOUTPUT_LOG=/var/log/$SERVER_NAME.log\
    \ # Where we will put the log\nPATH=$opt/lotus/bin:$HOME/bin:$PATH\nif [ \"whoami\"\
    \ = notes ]; then\nthen\n\ttecho \"Don't use root for Domino server\"\n\tsu -\
    \ notes\nfi\nif [ -x $NOTES_SERVER/bin/server ]; then\n\ttecho \"Cannot found\
    \ the server command exiting\"\n\texit 1\nfi\nif [ ! -d $NOTES_DATA ]; then\n\
    then\n\ttecho \"Cannot access notes data directory exiting\"\n\texit 1\nfi\nNOTES_RUNNING=$(ps\
    \ -fu notes | awk '{print $8}' | grep /opt/lotus | \\\ngrep -v grep | cut -d\"\
    -\" -f 1,2,3,4 | head -nl)\nif ! $NOTES_RUNNING; then\nthen\n\ttecho \"Domino\
    \ Server is already running exiting\"\n\texit 1\nfi\ncd $NOTES_DATA\nrm -f *.notes.lck\
    \ 2>\nmems=$(ipcs -m | grep $NOTES_USER | awk '{ print $2}')\nnsems=$(ipcs -s\
    \ | grep $NOTES_USER | awk '{ print $2}')\nfor j in $mems; do if [ -n \"$j\" ];\
    \ then ipcrm shm $j > tmp.lck; done\nfor j in $sems; do if [ -n \"$j\" ]; then\
    \ ipcrm sem $j > tmp.lck; done\nrm -f tmp.lck\necho \"Running Domino for LINUX\"\
    \n```"
  merge: -1
  pgno: 218
- img_proc: true
  md: "# E2 cleanup_domino.sh\n\n```\n#!/bin/kash\nNOTES_USER=notes\nNOTES_PATH=/local/notesdata\n\
    PATH=$NOTES_PATH:/opt/lotus/bin:$HOME:$PATH\n```\n\n```\ncount=0\nNOTES_RUNNING=$(ps\
    \ -fu $NOTES_USER | grep /opt/lotus | grep -v grep | grep \\\n  -v bash)\nwhile\
    \ [[ -n $NOTES_RUNNING ]]; do\n  sleep 10\n  count=$((count + 1))\n  echo \"Waiting\
    \ ...$count 0 seconds\"\n  if [ $count -eq 1 ]; then\n    echo \"Domino server\
    \ is still running after 2 minutes\"\n    echo \"Now ... he will dead\"\n    for\
    \ i in $(ps -fu $NOTES_USER | grep /opt/lotus| grep -v grep | \\\\\n      awk\
    \ '{print $2}'); do\n      kill -9 $i\n    done\n    sems=$(ps -m | grep $NOTES_USER\
    \ | awk '{print $2}');\n    sems=$(ps -cs | grep $NOTES_USER | awk '{print $2}');\n\
    \    for j in $sems; do if [ -n \"$j\" ]; then ipicrm shm $j>tmp.lck;fi; done\n\
    \    for j in $sems; do if [ -n \"$j\" ]; then ipicrm sem $j>tmp.lck;fi; done\n\
    \    rm -f tmp.lck\n    exit\n  fi\n  NOTES_RUNNING=$(ps -fu $NOTES_USER | grep\
    \ /opt/lotus | grep -v grep )\nrm -f $NOTES_PATH/-notes.lck\necho Domino shutdown\
    \ now completed\n```\n\n210 Linux Web Hosting with WebSphere, DB2, and Domino"
