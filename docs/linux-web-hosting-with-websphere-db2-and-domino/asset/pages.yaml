    #  3.5.4 Accessing Domino data in Linux with Java


    There are several mechanisms for Java programs to access Domino data, Domino services,
    or in other database management systems, such as:


    +   * Domino Objects for Java through the lotus.domino package included with the
    NCS.jar or notes.jar. The Domino objects represent and can be used to manipulate
    Domino data, such as item values, components, such as databases and views, and
    services, such as user registration functions.


    +   * The Java Native Interface (JNI) used to call C or C++ API functions or programs.
    The Lotus C or C++ Domino and Notes APIs be used to manipulate Domino data and
    services at a more granular level than what is provided by Domino objects.


    +   * The Lotus Script Extender (LSX) toolkit and its Java Adapter. The LSX toolkit
    lets LotusScript developers create custom objects in C++ and call them from LotusScript.
    The Java Adapter provides the facilities to call those objects from Java. Since
    the language used to create the objects is C++, those C++ programs can make calls
    to the Domino and Notes APIs or other APIs to access data and services.


    In this Redbook, we focus on using the Domino objects classes to access Domino
    data and services. For complete information about the Lotus C and C++ APIs, and
    the LSX, visit the Developer Central Web site at:

    http://www.lotus-developer.com.


    The Domino Objects class architecture is based on a conceptual containment model,
    where the container defines an object''s scope. A container object is always used
    to access the objects it contains. For example, we use a Session object to get
    Database objects, and a Database object to create Document objects.


    Since one Domino object may be contained by several others, a full containment
    diagram is beyond the scope of this redbook. However, some of the key containment
    relationships are shown Figure 71 on page 94.'
