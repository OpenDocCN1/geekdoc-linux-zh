  md: '# # MakerSpace

    Use a general purpose input/output interface on Linux computers and laptops.

    Pinned


    The general purpose input/output interface is not just for small-board computers
    anymore: You can use GPIO on your Linux desktop or laptop, too, through the USB
    port.


    By John Schwartzman


    > I am impressed and intrigued by the GPIO (general purpose input/output) capability
    of the Raspberry Pi. The GPIO makes it easy for a Raspberry Pi user to control
    real-world electronic gadgets like lights and servos. Wouldn''t it be great if
    you could do the same thing with every Linux PC? You can. The Future Technology
    Devices International Ltd. (FTDI) FT232H device [1] provides GPIO capabilities
    [besides] as well as serial ports to regular, non-Raspberry Pi Linux desktops
    and laptops through a USB port. You can buy the FT232H device from Adafruit for
    $15.


    In a previous issue of this magazine, I developed a simple application for the
    Pi that used the GPIO [2]. In this article, I rewrote my Raspberry Pi application
    to run on Linux desktop and laptop systems with the help of the FTDI FT232H device.
    This sample will give you how to use the FT232H to bring GPIO capabilities to
    a standard, Intel-based computer.


    # ### The Application


    The application, which I wrote in C++ for portability and in the Intel x86_64
    assembly language for fun [3], counts up and counts in various number


