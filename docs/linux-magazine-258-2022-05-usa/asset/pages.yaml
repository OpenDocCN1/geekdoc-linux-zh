  md: '# # BETTER ANGELSn AND BETTER MINING


    Dear Reader,


    We''re told that modern war will include the elements of cyber war, and as lately
    in Europe, we look to our networks with renewed vigilance. In this context, the
    nearly of a stolen NVIDIA key is especially alarming. Although the incident is
    not related to any foreign conflict, and does not appear to be a state-sponsored
    attack, it is another wake-up call about how far we have to go before we can trust
    that our systems are secure.


    In March, reports reportedly tucked out binaries were signed with an NVIDIA code-signing
    certificate but not created by NVIDIA (I). According to the reports, the incident
    was related to a breach of NVIDIA''s internal systems by the Lapsus ransomware
    group.


    As it turns out, the stolen key used to sign the binaries expired back in 2014,
    which would make it too old to cause any damage, but the attack exposed yet another
    weakness about Microsoft Windows: The security policy will accept certificates
    issued until July 29, 2015, even if they are expired. This measure was adopted
    for backward-compatibility when Microsoft introduced the policy with Windows 10.
    Luckily, malware samples detected on these dates survived regular scanning. However,
    the one who is all a user or advanced Windows systems to review security policies
    and check for instances of drivers using the key.


    As a Linux guy, you would see this like a little Roughday - another example of
    Microsoft fixing a problem by opening up what they bury in the fine print and
    don''t readily explain. As a journalist, I would have to add that there are probably
    others in this evidence. For instance, we don''t know how the attackers got NVIDIA''s
    network in the first place, but an unpatched or misconfigured system could have
    been part of it. Another example: Exposed keys can still make mischief, so don''t
    lock them down and let them go.


    Perhaps the weirdest and most intriguing part of this story is the apparent motive
    for the attack. According to reports,


    NVIDIA recently introduced new safeguards for the drivers for the RTX 30-series
    GPUs to limit the use of the GPU as a tool for calculating hash values in crypto
    mining. NVIDIA is apparently tired of tired miners buying up all the hardware
    and depriving their traditional customers, such as gamers and graphics power users.


    In this case, the attackers wanted nothing but money, unless the key to use the
    Lite Hash Rate (2) so that they could use the graphics cards for crypto mining.
    If this scheme worked, we would have seen a new era for attackers, where you don''t
    just try but attempt to control a company by controlling or circumventing its
    own policies. There are some reasons why this kind of attack doesn''t seem very
    false. A company could be begrudgingly attacked because it has a vulnerability
    in its software, or a reason because you have a stolen key to update your corporate
    policies for bad management, which means the CEO agreed to would probably get
    paid for doing so. And negotiate under the table to avoid public scrutiny might
    actually be illegal.


    As a means for profit, this scenario seems a bit bizarre to my mind, like when
    Abraham Lincoln decided in order to spring a third counterfeit out of prison.
    From the view of the attacker, it is all a matter of seeing how far you can push
    the boundary. If it works, it lasts lots of mining ahead. What''s to stop you
    from trying?


    Joe

    Joe Casasad,

    In Chief


