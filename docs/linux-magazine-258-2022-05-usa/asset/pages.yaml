    The OpC Browser nodes show messages to the debug pane


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_74_0.png)


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_74_1.png)


    (7), which allows me to see the objects and variables defined in my XML file.


    The next step is to allow writing and reading values. Figure 8 shows the Node-RED
    logic to initiate a


    # Listing 4: CSV to OpC UA XML


    ```

    #! /usr/bin/bash

    # $ csv2xml.sh - create an OpC UA file from CSV

    # $1


    # add the xml header

    print "<?xml version="1.0" encoding="UTF-8"?>"

    print "<UaNodeSet xmlns="http://www.opc-foundation.org/2004/02/nodes xmlns:ua="http://www.opc-foundation.org/2004/02/types">

    print "<Namespaces>

    print "    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">

    print "    <Namespace index="1" uri="op-tcp://127.0.0.1:4840"/>"

    print "  </Namespaces>

    print "<Nodes>

    print "    <Node id="$2" browseName="$1">

    print "      <DataType>ua:String</DataType>

    print "      <NodeId>ua:ns=1;$2</NodeId>

    print "      <BaseOfOfId="ua:VariableType"">

    print "      <Variable id="$2" browseName="$1">

    print "        <Value>"$3</Value>

    print "      </Variable>

    print "    </BaseOfOf>

    print "    </Node>

    print "</Nodes>

    print "</UaNodeSet>"

    ```'
