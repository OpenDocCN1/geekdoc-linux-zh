    # Dirty Pipe Might Be the Most Severe Vulnerability to Hit Linux in Years


    The name Dirty Pipe is homage to the Dirty Cow vulnerability, discovered in 2016,
    and a pipeline, which is a mechanism in Linux that allows processes to share data.
    Tracked as CVE-2022-0847, Dirty Pipe was discovered when a researcher was troubleshooting
    corrupted root files that continued to appear on a customer''s Linux server. It
    took months of analysis, but eventually, Kellermann (the researcher in question,
    from Ionos) discovered those files were due to a bug in the Linux kernel and exploited
    the vulnerability. Organization on a Linux machine, with an account that could
    add an SSH key to the root''s account such that any untrusted user could remotely
    access the server


    The same vulnerability makes it possible for attackers to hijack a SUID binary
    to create root shell, which allows untrusted users to overwrite data, in read-only
    files. Other actions that can be taken on a vulnerable machine including a cron
    job as a backdoor or modifying a script or binary used by a privileged service.


    Find out more Dirty Pipe in this Red Hat security bulletin (https://access.redhat.com/security/vulnerabilities/RHSA-2022-002).


    # A Decades-Old Linux Backdoor Has Been Discovered


    In 2013, during a forensic investigation, the Advanced Cyber Security team Pang
    Lab discovered a rather elusive piece of malware. Between 2016 and 2017, the hacker
    collective, The Shadow Brokers, leaked a large amount of data that was allegedly
    stolen from the Equation Group (with links to the NSA that contained a number
    of hacking tools and exploits. At the same time, the group leaked another data
    dump contained a list of servers that had been hacked by the Equation Group.


    According to the Advanced Cyber Security Research team, Bvp47 was used to target
    the telecom, military, higher-education, science and economics sectors more than
    267 organizations in 47 countries. These attacks lasted over a decade as the malicious
    code was created so that hackers could retain long-term control over an infected
    device. And because the attack used zero-day vulnerabilities, there was no defense
    against.


    The Pang Lab operation code-named ''Operation Telescreen'' and the result of this
    discovery backdoor requires a check code to the host to function normally. They
    also determined Bvp47 to be a top-tier APT backdoor.


    As far as other Bvp47 is still in use today, there is no indication that is the
    case. But given the nature of the exploit, it wouldn''t come as a shock to any
    research lab to discover those leaked files had been used to cobble even more
    dangerous malware.


    Read the Pang Lab report to find out more (https://www.pangulab.cn/en/post/the_bvp47_a_top_tier_backdoor_of_us_nsa_equation_group/).


