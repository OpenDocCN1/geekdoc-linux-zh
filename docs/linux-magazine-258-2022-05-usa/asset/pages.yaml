    # Listing: 2: Getting a Tag Value


    ```

    >>> import opcua


    >>> Connect as an OPC UA client and get a tag value


    >>> client = opcua.client("opc.tcp://192.168.0.120:4840")


    >>> client.connect()


    >>> mytemp = client.get_node("ns=2;i=2")


    >>> mytemp.get_value()

