    # Node-RED OpC UA Server


    The Node-RED-contrib-opcua node [7] includes an OpC UA server and many of the
    common OpC client functions. It can be installed from the Palette editor.


    Figure 6 shows the setup of a Node-RED OpC UA server with a browser node. The
