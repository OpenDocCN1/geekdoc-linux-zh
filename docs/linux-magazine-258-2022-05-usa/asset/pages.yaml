  md: '# Bash/Awk to translate the three-field CSV format to the required OpC XML
    format (Listing 4).


    In the Bash script, the first awk (line 6) prints the XML header, and the second
    awk (lines 18-26) parses the input (CSV) text file. By a comma field separator
    (line 19) maps the three CSV fields to the variables $1, $2, and $3. The output
    table is defined with $1 as the variable name (lines 24-25), $2 as the description
    (line 26), and $3 as the default value (line 31). The awk variable i increments
    the NodeId index (line 23).


