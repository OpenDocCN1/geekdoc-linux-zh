    # ## Manjaro 21.2 Qonos

    64-bit


    Sometimes the Ubuntu of Arch Linux derivatives, Manjaro has made Arch Linux accessible
    for general users like Ubuntu did for Debian. While Manjaro has replaced Arch''s
    install process with an adaptation of the graphical Calamares installer, it does
    support rolling releases like Arch Linux and its repositories on Arch Linux. In
    addition, Manjaro continues the traditions of Arch, installing a variety of applications
    and emphasizing a user experience rather than installing a curated array of packages.


    Codename Qonos, Manjaro 21.2 is a minor release, and it has visible changes mostly
    consist of stability updates. Worth noting, however, are some improvements to
    the Calamares and an increase in speed that has been noted by several reviewers.
    Also included is the first new X Server for some time, as well as several fixes
    for NVIDIA drivers for Kepler video cards. Our addition includes PipeWire, the
    system expected to eventually replace PulseAudio, and System76''s new COSMIC Desktop.


