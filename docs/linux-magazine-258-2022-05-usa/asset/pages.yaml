    # # Ports of Call


    A basic commands for working with ports can help you make your small network or
    standalone system more secure. By Bruce Byfield


    Port computing. I''m not talking about transferring versions of architecture or
    operating system. Instead, I mean the kind of port that is for a virtual connection
    point or from an address of a computer and device or, the Internet. Ports direct
    traffic to the correct application, and this function makes them


    important for troubleshooting and security. How do you find which ports are open
    or listening (i.e. currently in use) when there is no need for them? What ports
    are associated with which application or server? How do you know whether any ports
    are hidden and being used by an intruder? Even if you are working on a standalone
    computer, knowing to answer these questions is a basic skill.


    Ports can be either hardware or software. Either way, they are treated similarly.
    Ports are managed by two protocols: Transmission Control Protocol (TCP) and User
    Datagram Protocol (UDP). Both TCP and UDP have a range of ports (numbers 0-1023):
    divided into three categories:


    +   * System ports are the most common ports and essential to eternal


    > This is presently the policy of IANA to assign a single well-known number for
    both TCP and UDP hence officially ports have two entries even if the protocol
    doesn''t support UDP operations.


    Updated from https://www.iana.org/assignments/service-port-numbers/service-names-port-numbers.html.


    +   * New ports will be added on request if they have been officially assigned

    * By IANA and used in the real-world or are needed by a debian package.

    * If you need help list of used numbers install the nmap package.


