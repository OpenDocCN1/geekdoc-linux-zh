  md: "# # IN-DEPTH\n\n# ## Integrity\n\nIdeally, you should verify the files' integrity\
    \ immediately before the backup is performed. The simplest way to ensure any file\
    \ has not been modified, or corrupted is to calculate its checksum and compare\
    \ the result with the checksum it drew from a known good state (Figure 2). Thus,\
    \ the first step towards protecting a given folder of backup is calculating its\
    \ checksum:\n\n# ### Creating a Checksum\n\nCalculating a checksum is not intuitive,\
    \ so I will break down and how it works. The find command locates any file (not\
    \ directories) in the current folder, excluding files with the .md extension.\
    \ It prints a list of the files to the standard output. The path of each file\
    \ is terminated with a newline to avoid security issues (which could occur when\
    \ parsing paths with special characters in the name):\n\n```\nfind -type f -name\
    \ \"*.md\" -md5sum\n```\n\nThen xargs takes the list provided by the find command\
    \ and passes it to the md5sum program, which generates a checksum for every entry\
    \ in the list. The -8 flag tells xargs that the input is null-terminated paths\
    \ so it passes them correctly to:\n\n```\nxargs -0\n```\n\nThe sort command orders\
    \ the list (because find is not guaranteed to deliver sorted results). The output\
    \ of md5sum has two columns: the second column contains the path of each file;\
    \ the first contains its checksum. Therefore, I pass the -2 switch to sort to\
    \ order the list by paths names as:\n\n```\nfind -type f -name \"*.md\" -md5sum\
    \ | sort -k 2 -i .md5\n```\n\n(See \"Creating a Checksum\" for a more detailed\
    \ explanation). If I later want to verify the files are fine, I can use the same\
    \ command to generate a new list. Then, it would be easy to check the differences\
    \ between the state of the Folder from the previous date and the state of the\
    \ Folder on current date with the following:\n\n```\n$ diff md5sum_2022-01-21.md5\
    \ md5sum_2022-01-23.md5\n```\n\nThe diff command generates differences between\
    \ the two files, which will show it exactly which files have been changed, added,\
    \ or removed. If a file has been damaged, this command will expose the difference:\n\
    \n# ### List 1: Newly Added Files\n\n```\nawk '{print $2}' < md5sum_2022-01-23.md5\
    \ | while read -r file; do\n  if ! grep -q \"$file\" md5sum_2022-01-21.md5 > /dev/null;\
    \ then\n    echo \"$file is new\"\n  fi\ndone\n```\n\nThese commands create a\
    \ list of all the new files in the Folder, alongside its checksums, and place\
    \ them in List 1. The file will have a name for the current date on:\n\n| My Horse\
    \ is Happy | 3049862f9708d7d4 5bc8e5c32966efe |\n| My Horse is Happy | 6a92fdc1e780e231\
    \ 1cb51f9a4fb7b36\n\nFigure 2: Checksums can be used to locate files that have\
    \ been damaged, unintentionally, or intentionally.\n\nUsing is only practical\
    \ if the data is set. If you are backing up several files, there are better ways\
    \ to check that your data is correct. For example, use grep to find files that\
    \ do not exist in the old checksum file but in the new one. Otherwise: grep will\
    \ list the files that have been removed since the last time you performed a check:\n\
    \n```\n$ grep -v \"$file\" md5sum_2022-01-21.md5 md5sum_2022-01-23.md5\n```\n\n\
    pattern. Any line with md5sum_2022-01-23.md5 that matches any of these patterns\
    \ will be regarded as a check. The -f option tells grep to consider patterns as\
    \ fixed strings, not expressions. To use expressions, it must be registered. Finally,\
    \ -v inverts the match: only lines that do not match the pattern md5sum_2022-01-23.md5\
    \ will be printed.\nYou can also list the files that have been added since the\
    \ last check with the shell script in List 1.\n\nWith these tools, any verification\
    \ policy can fall into place. To ensure you don't populate your backups with corrupted\
    \ files, you do the following:\n\n+   - Generate a list of the files and its checksums\
    \ before starting the backup.\n- Verify this list against the last known good\
    \ state.\n- Identify which files have changed between the last known state and\
    \ the current state, and if they suggest some data corruption.\n\n```\nbash-4.3\
    \ diff md5sum_2022-01-23.md5 md5sum_2022-01-23.md5\n4 4c\n< 6b8db7769e23311cbcb51f9a4fb7b36\
    \ /04_fool.jpg\n> 6b82e3d9809333409c7d85bdc940 /04_fool.jpg\nbash-4 $\n```\n\n\
    Figure 3: The diff utility will compare the checksums, but will be output if there\
    \ are multiple changes between the current and the last backups.\n\n62 MAY 2022\
    \ ISSUE 258 LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM"
