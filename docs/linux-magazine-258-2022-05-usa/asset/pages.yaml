  md: '# Getting a List of Ports


    Ports are always assigned when a package is installed. The quickest way to get
    a complete list of ports is to log in as root and enter:


    ```

    less /etc/services

    ```


    You will need the command base because there are hundreds of ports on the typical
    computer. In less, the left-hand column shows the name of the service, and the
    second column from the left shows the port number and whether it is TCP or UDP
    (Figure 1). Some values may be abbreviated, so give the full name. The fourth
    column gives any explanatory notes. If you look at the output on another Linux
    computer, you will find most or perhaps all the systems are the same. many of
    the registered ports will also be the same on different computers.


