  md: '# COVER STORY

    The Impact of Crypto Mining


    difference to the overall power usage of cryptocurrency industry is to the industry
    heaviest weights. Most believe will require a change to the proof-of-work model
    for mining currencies such as Bitcoin and Ethereum. One approach that has emerged
    as an alternative to proof of work is proof-of-stake. Rather than allowing a multitude
    of miners to race each other for the solution, the solution is to put up a stake,
    a kind of deposit for the right to mine the block. Features built into the proof-of-stake
    model are necessary mechanisms to ensure that no single operator can monopolize
    the system. The security and stability of this model largely depend on the details
    of the implementation and how it is constructed.


    Ethereum currently uses proof of work but is moving to a proof-of-stake protocol.
    Ethereum''s version of proof [12], a user must become a validator, or put up 22
    ETH in exchange for Ethereum — currently trading at $2,000. According to the website,
    "Validators are chosen at random and rewarded for forming blocks they create."
    A user''s use of a stake is a way to incentivize good behavior. For example, a
    user can lose a portion of their stake for things go offline (failing) or deviate
    for deliberate collusion.


    Smaller cryptocurrencies are already using proof-of-stake. Cardano [13] is the
    largest proof-of-stake in market. Cardano uses the Oboros protocol,


    "the Cardano project says" — an environmentally sustainable, verifiable secure
    by proof-of-stake mechanism. Unlike Bitcoin, its network is sustainable to scale
    to meet global demand, while consuming only 6GWh of power without compromising
    speed or efficiency.


    The proof-of-stake model allows you to reduce the amount of power required to
    verify transactions and blocks. As of this consensus-based mechanism, the random
    selection method requires fewer miners to feed the network and consume less power
    to complete the process.


    Unfortunately, the conversion from proof of work to proof of stake can take longer
    to implement, and as long as it is committing to this transition, cryptocurrency
    usage will continue to rise.


    Proof-of-stake protocols are relatively new to the world, and it''s not clear
    if they will provide a complete replacement for proof of work. Some believe that
    proof-of-stake could lead to more centralization. Elena Ruiller, a professor of
    computer science at the University of Lisbon Superior Tecnico, says proof of stake,
    "A key disadvantage is that, in systems, the ones that have the most stake have
    the most power. And these systems are still less decentralized in many cases than
    Bitcoin [14]. However, proof-of-stake requires a stake to be held and then chosen
    randomly to avoid a bidding war. Also, if you needed to put up a stake to act,
    you might not need as much expensive hardware as you would with proof of work,


    so it is possible that proof of stake could be more democratic if implemented,


    The other issue of proof of stake faces is that it hasn''t been proven at scale.
    In, in theory, it has considered the impact on the environment, but until we see
    it at the same scale as proof of work, there is no way of knowing if the transition
    will smoothly to proceed. The Ethereum and proof-of-stake blockchains currently
    hold a value more than $1 trillion, whereas others are only beginning to adopt
    real-world users.


    # Conclusion


    The big question is whether proof of stake can scale with significantly lower
    the environmental impact of crypto mining. Proof of stake being able to reduce
    oil-drill consumption is yet to be tested at scale; otherwise, the increasing
    energy demand of crypto mining could cause a high price. The technology will continue
    to eliminate effects from proof of work to proof of stake and other methods. Until
    Bitcoin changes its way, usage will continue to be a serious problem in the cryptocurrency
    industry.


