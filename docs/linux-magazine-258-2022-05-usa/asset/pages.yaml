    # Linux Mint Dropping Blueberry Bluetooth Configuration Tool


    For the longest time, Linux Mint depended on Blueberry for its background service.
    With the release of Linux Mint 21, that all changes, as the developers opted to
    migrate to Blueman.


    One of the primary reasons for this change is that the latest version of gnome-bluetooth-audio-backend
    for Blueberry introduced a few changes that broke compatibility with Blueberry.
    Unfortunately, the developer has no desire to see his work outside of Gnome. Because
    of this, Blueberry will have trouble with Gnome-desktops going forward, which
    is one of the reasons why Linux Mint needs to go to a different route.


    Another reason for this change is that Blueman works better with Bluetooth audio
    and can connect to a much wider range of devices.


    The Mint developers are currently in the process of integrating Blueman with the
    desktop OS and hope to have it ready for the full release of version 21. Currently,
    there is no official release date for Linux Mint 21, but (if history is any) it
    should be sometime this year (2022).


    To read more about this upcoming change, and other interesting bits about the
    new release, check out this issue of the Linux Monthly Newsletter (https://blog.linuxmint.com/?p=428).


