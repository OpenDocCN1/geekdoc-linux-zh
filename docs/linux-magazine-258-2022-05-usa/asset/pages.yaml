  md: "# COMMAND-TOOL EXAMPLES LINUX VOICE\n\n# Shell tool examples in the terminal\n\
    eg Explains\n\nNeed to know how a command-line tool? provides real life examples,\
    \ and it is easier to access than the man pages. BY FERDINAND THOMMES\n\nOn forums\
    \ and discussion groups, you are increasingly finding people claiming that the\
    \ command line is an anachronism. They say that it should be possible to handle\
    \ any task with graphical tools. This kind of statement shows whoever posted the\
    \ comments has never seriously worked with a terminal. Anyone who is aware of\
    \ the speed and efficiency of working with the command line would agree that powerful\
    \ tools could be better. I admit to using a hybrid of command line and graphical\
    \ tools on the Plasma desktop. I have increasingly used both, for many years there\
    \ is no way I want to devote to the command line given this satisfying division\
    \ of labor.\n\nPython Package Index. To do this, you may first need to install\
    \ the python3-pip package from the package manager if it is not already in place.\
    \ Then retrieve with pip and store it on your hard disk.\n\nOnce it is installed\
    \ and ready to use, there is no need for configuration, it is possible. Type pip\
    \ --list shows you an alphabetically sorted list of the 80 or so tools currently\
    \ supported (Figure 1). If the system outputs a command not found when you do\
    \ this, you will have to log off the desktop and log back again. The system will\
    \ include the installation directory in its path.\n\n# Complex Man Pages\n\nThere\
    \ are several ways to working in a terminal as a newcomer with the willingness\
    \ to learn. The first place to start for many users is the man pages, which serve\
    \ as a reference because they list all the options, flags, and parameters. If\
    \ you actually learn how to use-command-line (CLI) tools, the man pages offer\
    \ limited help - in fact, they are more to scare off novices. Examples on provide\
    \ far more easily digestible information, and furthermore are examples that will\
    \ help in finding the right answer after such a massive search.\n\nOne of the\
    \ listed commands is to access by calling name: You will notice that some have\
    \ only a few lines (Figure 2), others - such as the entry has several hundreds.\
    \ Once you have finished reading an, pressing Q will prompt you to quit. If you\
    \ do not want to continue using it after a test, remove it by pip uninstall\n\n\
