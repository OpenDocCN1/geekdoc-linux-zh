  md: '# Zack''s Kernel News


    # Git Merge "Simplification" Advice


    Bjorn Helga submitted PCI patches in a merge request from another Git tree. This
    is a standard part of the development process for larger projects like the Linux
    kernel, and this one included thousands of contributions. The idea is that bunch
    people work on a given sub-project doesn''t break everyone''s tree. With the merge
    request, the contributor asks Linux to resolve any changes they might have produced
    with other changes going into the kernel at the same time. No, nothing to see
    else here, but the contributors do get their hands dirty the same time, without
    hurting their fellow contributors'' hands while they''re at.


    In this case he noticed some wonky thing going behind the scenes, and posed a
    problem for him. Specifically, Bjorn and his PCI followers had already done some
    merging from various sub-projects (within their sub-project), followed by a reversion
    that Linux''s official repository would seem to come from the same tree. It''s
    not poetic, but they were just trying to fix things.


    So for all objects, the patch itself is reverted. A patch was previously accepted
    into a tree, but a reversion is also a patch that needs to be accepted via the
    same process as other patches - including a meaningful commit, message the patch
    reversion was not. However, it''s a relatively uncommon occurrence for patches
    with meaningful commit - developers don''t want to see the point of it that all
    the patch reversion does is to undo what had recently been put in.


    In this case, Linux pointed out that the purpose of the reversion was not that
    the patch itself had been bad – it was specifically in order to reduce conflicts
    when Linux would eventually merge the PCI trees into his own.


    There were two problems with this. First, the natural conclusion to draw about
    patch reversion is that it was bad. In such case, the patch can be coming from
    another tree (which was the case here – the PCI reverted the patch so it could
    come back from someone else), the natural conclusion to draw, said Linux, that
    the patch from other tree was also bad. If the identical patch was bad, it would
    be bad again, right? So Linux had to fix what that had eventually been introduced
    into the tree – what he did, but meant more.


    The second problem was that the reversion and behind-the-scenes merges had been
    done to resolve the conflicts Linux would see against his own. Linux declared
    it "pure and utter garbage, I ended up with the merge ''ANYWAY'' due to the changes,
    and now instead of going ‘go’, the PCI tree had that commit, good, I had to ‘go’,
    so the PCI tree had the commit, but it was reverted in the new tree, so I was
    making different changes and a confusing merge."


    Linux compared to a similar situation where developers “rebase” their as a different
    way to merge conflicts. In Git, sub-projects will pull the latest version of the
    main project tree into their own as a “base” and do all their work against it.
    But when they''re time to submit code upstream to Linux, Linux has already decided
    not to pull from his tree again before submitting their own patches, then they
    can resolve the conflicts themselves and send a conflict-free request to Linux.


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_10_0.png)


