  md: '# Animation with OpenToz


    OpenToz is available in the package sources of most popular Linux distributions,
    installing it should be easy. To test with a sample scene: download the sample
    animation as a ZIP file from the project page [OpenToz_sample.zip). You can view
    this sample on YouTube without installing OpenToz! Figure 1 shows OpenToz with
    the official scheme, which stars a dog named Dwanko.


    movement of the characters, and type of background. There is also an exposure
    sheet, called an X-sheet or dope sheet for short. The X-sheet is frame-by-frame
    for each individual shot. You can see it in the upper area of Figure 1.


    parallax, you can easily add depth to animations. The parallax effect occurs when
    objects in the foreground move faster than in the background. This is achieved
    by showing the first and last frames of the animation sequence in the OpenToz
    3D view.


    # Basic Terms


    The classic animation works with a script and the design of the acting characters.
    The storyboard contains at least one drawing for each shot that shows the camera,


    Animators avoid the need for intermediate drawings by combining frames with camera
    over image. For instances, the graphic artist only needs to animate the mouth
    movement. Drawings are divided into different layers: these individual layers
    are visible as columns in the storyboard.


    Normally, three least planes are used to create this 3D effect: a cloud plane
    at the back, or one more plane(s) and a ground plane at the front. In Figure 3,
    however, in the area of the animation, there is also a plane for Dwanko''s legs
    and a projected shadow slightly back, which reinforces the spatial impression.


    Although OpenToz is a 2D animation tool, you don''t have to sacrifice a three-dimensional
    feel. Using motion


    As Figure 4, using only six different drawings define Dwanko''s motion. Each is
    made for three frames before the next pose follows. This process runs in a loop.
    The illusion of a running dog is created by the moving plane. It is also possible
    to change the Z coordinates of the individual planes and for the camera, adding
    to the effect.


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_54_0.png)


    # Desktop


    OpenToz is divided into rooms, all known contain a collection of elements, which
    the program displays special positions on the screen. A list of the windows appears
    at each edge of the window, below the menu bar. Some defined rooms include the
    Drawing, Palette, Animation, and, rooms. You can define your own rooms that contain
    the windows you need for a specific task. All of the rooms contain the viewer
    window with the flip bar tool, playback and frame controls, elements, and an X-sheet
    window.


    Figure 2: The starting point of the animation: The backgrounds at different speeds
    create a parallax effect.


