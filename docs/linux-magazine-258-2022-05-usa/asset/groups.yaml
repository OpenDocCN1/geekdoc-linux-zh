    # 测评

    MusE 4


    昂贵的 Bitwig Studio 并不提供谱面视图，更不用说编辑器了。Linux 上一个流行的替代品是 MuseScore [4]（正如其名所示，Muse
    项目），它为古典作曲提供了更多功能（即“历史记录”框）。


    随处可见内容丰富的右键菜单。你通过主菜单打开的工具在它们的对话框中提供了各种复杂的功能。


    在合成器轨道中对参数进行自动化处理，明确了该轨道对于生成器的用途，因为在 Muse 中，它不包含任何音乐数据（图 9）。


    # 许多微调


    许多 DAW 功能可以直接在 Muse 界面中控制。然而，为了补偿热门主菜单中稀疏的注册表


    为了解决这个问题，编排器（Arranger）顶部的功能表在默认设置下增加了一项。你会在这里发现一些起初可能会忽略的功能。例如，其中之一就是合成器的图形界面，以及合成器轨道中的所有参数。


    直接将曲线分配给合成器会使它们变得更容易。如果你想为另一个录制轨道创建不同类型的自动化，可以创建一个独立的插件实例。如果你熟悉 Ardour 项目，就已经知道了这个概念。


    在过去几年，其他 DAW 中出现了类似于列表的轨道：一个声音对应多个数据轨道。有时，数据轨道可以包含单独的自动化，例如录制期间使用键盘调制轮制作的自动化。这是一个概念上的区别，因为这些自动化没有与单个合成器关联，而是通用的
    MIDI 参数，每个乐器都是相同的。


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_29_0.png)


    **图 9：** 复杂单音合成器（Monosynth）的自动化轨道，它有自己的插件轨道，而不是由 MIDI 轨道控制它。你可以控制合成器界面允许你控制的任何内容。


    # 的困惑


    近年来，对于名字中带有“Muse”字样的软件引起了一些困惑。虽然在搜索可能会找到同名的英国摇滚乐队，但引起更多困惑的是 muse-sequencer.org，它指的是一个非营利实体。实际上，muse-sequencer.org
    是一个针对专有音乐制作软件的隐蔽广告网站。


    此外，其他软件供应商也也将自己的产品命名为 Muse，从医疗联系管理系统到 iOS 备忘录应用。Muse 6 实际上与音乐软件有关，它是位于美国的 Ultimate
    Guitar 制造者的网站。因为他们使用瑞典顶级域名，人们很容易认为他们与来自瑞典的 Robert Johnson 没有任何关系。


    最后，Muse 不应与 Muse 集团（MuseScore）混淆，该集团在 2021 年 4 月收购免费软件 Auditor 时 [7] 引起了动动。Muse
    集团还提供 Muse (8)，它作为音乐人的一种社交网络存在。


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_29_1.png)


    **图 10：** 在 Trackstation 视图中使用你的电子邮件和密码注册你的 Mackie 后，BitRok 在 MusE 中运行得完美无缺。


    # 测评


    MusE 自带了数十种流行合成器的预设，以及许多现代插件。当你为乐器选择预设时，程序会将控制信号嵌入数据中。虽然初始化可以作为脚本实现，但对此没有专门的工具，而且这需要大量的知识，但如果你知道它们的内部接口是如何工作的，你几乎可以用它们做任何事情。


    # 结论


    MusE 4 不仅现代界面令人印象深刻。它看起来也比前代产品更成熟、更精细。简单音频的工作方式在很大程度上是独特的。


    集成 Windows DLL 格式 VST 插件的用户将令许多用户满意。希望 Robert Johnson 未来继续像这样耐心和坚持地为这个 Linux MusE
    的路线图工作 :::


    对于需要音频材料的项目，Ardour 提供了更多可能性。对于 MIDI 竞赛，MusE 目前缺乏任何 DAW。Bishop 可能会为循环提供更多选项，但它缺乏
    MusE 的符号编辑器。


    # 信息


    - [1] MusE:

    https://musee-sequencer.github.io/


    - [2] yabbridge:

    https://github.com/robert-vdh/ybridge/releases


    - [3] Wine:

    https://wiki.winehq.org/Download


    - [4] MuseScore:

    https://musescore.org/en


    - [5] Robert Johnson:

    https://x.com/post/25297044437/floss-your-music-robert-johnson


    - [6] Muse Group:

    musescore.com


    - [7] Audacity acquisition:

    https://www.microradar.com/news/audacity-spyware-claims


    - [8] 商业 MuseScore 社区:

    hmmmusescore.com


    导入 MIDI 的后续设置可能需要该领域的深度知识。此外，MusE 与 yabridge 协作的方式


    依靠 MusE 合理的自动化并增加复杂度是有意义的。常见的合成器插件如 Yoshimi 或 Carmosynth 即使在你没有它们的情况下也可以运行。Linux
    模块（如 BioTech 合成器）也是如此。BioTech 的注册让你在购买 BioTech 并结合 Mackie 的波形（''10''）时，你可以在 MusE
    中使用它。


    # 作者


    Hartmann 担任讲师、作者和音乐家。他让免费和自制音乐融在一起。Hartmann 在 http://lapoc.de 上的服务器上有他与免费音乐软件合作的知识共享许可作品。


    （以下为底部英文对话翻译）


    Linux 杂志：请谈谈你是如何接触 BSD 的。


    MD: 在早期（现在我指的是 1980 年代），开源要强大得多，而且个人可以组合并出售出色的


    LM：DragonFly BSD 是如何开始的？


    MD: 那个时代的许多项目（1980 年代后期进入 1990 年代）仍然非常成功并处于增长痛苦中，他们的用户基于开源，以及天才的天赋。在许多 BSD 中，最有趣的是
    DragonFly BSD（本月介绍）。DragonFly BSD 有着重构 Unix 的历史，并不断让变得更好。


    '
