    # LINUX DOGHOUSE – A UNIVERSAL SOFTWARE ISSUE


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_77_0.png)


    # MADDDOG’S DOGHOUSE


    Jon "maddog" Hall is an author, educator, computer scientist, and free software
    pioneer who has been a passionate advocate for Linux since he first met Lin Torvalds
    and facilitated the port of Linux to a 64-bit system. He serves as president of
    Linux International;


    Bugs and security issues are not limited to open source, despite comments to the
    contrary. BY JOHN "MADDDOG" HALL


    # Where do they come from?


    In one lesson we discussed about the origin of bugs or security issues that exist
    in "open source" and how that specifically refer than "free software" and how
    this is so controversial. This was about the Software Bill of Materials (SBOM)
    which indicates what pieces of open source appear in the products of companies.
    Don''t get me wrong. I think an SBOM is a good idea, particularly if it could
    be easily and almost automatically through the software process. However, people
    talk about the "bugs" if they thereby solve the problem of open source and that
    is how they work throughout.


    generate. This created a fail for companies companies. Although developers being
    paid for their time and effort in creating FOSS projects, and we share the frustration
    of many people with multi-billionaires receiving their riches, the work still
    remains in the FOSS community.


    In the early days of computers, there were, if, "professional programmers," people
    paid to write their own problems and then gave them away to help others. Others
    could also help to make the programs better.

    Software that no one uses


    There were many people who did not know how to use FOSS who could use these projects
    too ... and that is what we faced.

    Shortly after the Linux kernel started a number of de development brought forth
    the era of "making money for free", and many ways these companies paid for the
    software were considered. It was observed, that if this path followed, then FOSS
    would move much slower, like a glacier. Some of the projects saved the value of
    being there, and some continued to write the software for their own purpose.


    When I talk about programs about the origin of FOSS, I first suggest that they
    pick an area of software that they have an experience or passion for: video, games,
    databases and mining, word processing tools ... the list is long. Then they can
    learn more about their passion and perhaps be hired by a company that needs their
    focus on that passion.


    You may find that the software you are working on is industry where you can make
    money, but this is a challenge and you have to be careful not to create a project
    that is not sustainable, both for you and the other people using it. However we
    should not punish users if we no longer get satisfaction out of our software development
    work.

    The press and pundits are insinuating these are "open source" issues, and they
    are not.

    Let''s keep them honest.


    The difference between open source (and partially free software) is that the code
    is exposed to many eyes and available for patching when problem occurs. Closed
    source code (or source that uses open source components) cannot be modified by
    the company that produced the closed source product to get the patch, and thus
    the closed source company actually produces a product for that software.

    I do not think that the press and pundits point out that there are bugs in FOSS.
    When they do show them they imply this is a problem with FOSS and not also with
    closed source.

    Somewhat tied to a recent incident when an open source developer put a bug into
    the code they were developing, ostensibly because they objected to companies making
    amounts of money off the code that FOSS people


