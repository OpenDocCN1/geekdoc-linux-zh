    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_1_1.png)


    tuxedocomputer.com


    # 更好的天使与更好的挖矿


    亲爱的读者：


    我们被告知，现代战争将包含网络战的元素，正如最近在欧洲一样，我们以新的警惕性审视我们的网络。在这种背景下，一个 NVIDIA 密钥被盗窃的消息尤为令人警觉。尽管该事件与任何外国冲突无关，而且看起来并非是由国家支持的攻击，但它是另一个警钟，提醒我们要在能够完全信任自己的系统安全之前，还有很长的路要走。


    3 月份，据报道发现某些二进制文件使用了 NVIDIA 代码签名证书进行签名，但并非由 NVIDIA 创建 (1)。根据报告，该事件与 Lapsus 勒索软件小组入侵
    NVIDIA 内部系统有关。


    事实证明，被盗的用于签名二进制文件的密钥已于 2014 年过期，这本该由于过老无法造成任何损坏，但这次攻击暴露了 Microsoft Windows 的另一个弱点：安全策略将接受
    2015 年 7 月 29 日之前颁发的证书，即使它们已经过期。这一措施是微软在引入 Windows 10 的该策略时为了后兼容而采用的。幸运的是，在这些日期检测到的恶意软件样本躲过了常规扫描。然而，所有用户或高级
    Windows 系统用户都需要审查安全策略，并检查使用该密钥的驱动实例。


    作为一名 Linux 爱好者，你会将其看作是一个小小的意外——这是微软通过揭开他们埋藏在细则中且不轻易解释的内容来解决问题的又一例。但作为一名记者，我不得不补充说，这些证据中可能还有其他问题。例如，我们不知道攻击者最初是如何进入
    NVIDIA 网络的，但一个未修补或配置错误的系统可能是其中之一。另一个例子：暴露的密钥仍然可以作乱，所以不要把它们锁好后就由它们不管。


    也许这个故事中最奇怪、最引人入胜的部分是攻击的显性动机。根据报告，


    NVIDIA 最近为 RTX 30 系列 GPU 的驱动程序引入了新的保护措施，以限制 GPU 作为加密挖矿中计算哈希值的工具。NVIDIA 显然厌倦了矿工买下所有硬件并剥夺其传统客户（如游戏玩家和图形电源用户）。


    在这种情况下，攻击者想要的只有钱，除非使用 Lite Hash Rate (2) 的密钥，这样他们可以使用显卡进行加密挖矿。如果这个计划成功，我们将看到攻击者的新时代，你不仅是尝试，而是试图通过控制或绕过公司自身的策略来控制该公司。有些理由让这种攻击看起来并不虚假。公司可能因为其软件存在漏洞而遭受违心的攻击，或者因为你有一个偷来的密钥来由于管理不当而更新公司政策，这意味着
    CEO 同意这样做并可能会为此获得报酬。而且，私下谈判以规避公众审查实际上可能是非法的。


    作为一种获利手段，这种场景在我看来有些怪诞，就像亚伯拉罕·林肯决定让第三个假品逃离监狱一样。从攻击者的角度来看，这完全取决于你能把边界推到多远。如果有效，就能带来大量的挖矿收益。什么能阻止你尝试呢？


    Joe

    Joe Casasad,

    总编辑


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_2_0.png)


    信息


    - [1] "Stolen NVIDIA Key Can Sign Windows Malware" by Gareth Corfield, The Register,
    2022年3月5日, https://www.theregister.com/2022/03/05/nvidia_stolen_certificate/

    - [2] Future Steps Getting GeForce Cards into the Hands of Gamers: https://blogs.nvidia.com/blog/2021/05/18/hr/

    - [3] "The Post to Steal Lincoln''s Body" by Peggy Robertson, American Heritage,
    1982年4/5月, https://www.americanheritage.com/plot-to-steal-lin


    # LINUX MAGAZINE

    2022年5月


    # 封面


    - Maltrail：一个检查流量的轻量级工具。

    - OpenToonz：创建你自己的动画。

    - 设备上的 GPIO：赋予你的 Linux 能力。

    - NocoBD：无需代码即可程序。

    - 备份完整性：如何避免静默数据损坏。

    - LibreOffice 技巧：构建音乐数据库。


    # 故事


    - 可持续性：大多数人知道通过更换更高效的灯泡可以节省能量，但你知道通过更高效的软件也可以节省能量吗？这个月，我们调查了为该行业带来可持续性所付出的持续努力。

    - 可持续性设计：德国的标签可以作为范本。

    - 加密挖矿的影响：随着气候变化带来灾难性影响，我们刚刚开始考虑使用技术来保护资源。


    # 新闻


    - Linux Mint：Beta 版本

    - Slax：发行版级的安全

    - 一个几十年的漏洞：冲击 Linux


    # 评测


    - Muse 4：一个音频工作站为 MIDI 项目提供免费解决方案。

    - Walk – DragonFly BSD：DragonFly BSD 创始人 Matthew Dixon 讨论了 BSD 的过去、现在和未来。


    # 深度


    - 命令行 – 端口安全：几个用于端口操作的基本命令可以帮助你让你的网络或单立系统更安全。

    - OpenToonz：OpenToonz 是一款用于漫画和动画家的专业动画工具。

    - 备份完整性：备份策略可以保护你的数据受恶意软件攻击和系统崩溃的影响，但首先你需要确保你没有备份损坏的数据。

    - Maltrail：Maltrail 是一个检查流量的轻量级工具，如果发现可疑活动会报警

    - NocoDB：NocoDB 让你无需编写代码即可构建应用程序。

    - Ruby 和 Tex：使用 Ruby 和 Tex 编写一个应用程序。


    # 观点


    - 欢迎：本期观点。

    - Doghouse —— 通用问题：漏洞和安全问题不限于开源

    - 命令行工具示例：需要知道如何使用命令行工具？它提供了真实案例，并且比网页更容易访问

    - LibreOffice 音乐数据库：LibreOffice Calc 和 Base 是你创建一个整理收藏歌曲简单数据库的所有工具

    - FOSSpicks：这个月 Graham 查看了 Surge XT、Kroonite、MQTT Explorer、Mandelbauer v2、Simutrans
    等。

    - 教程 — 纸模：纸模手工再次流行。Linux 用户转向 Inkscape 并使用 Boxes.py、Paperfold 和 Tabgen 等插件创建 3D
    模板。


    # 创客空间


    - Linux 设备上的 GPIO：通用输入输出接口不仅用于小型电脑：你可以通过 USB 端口在 Linux 桌面或笔记本电脑上使用 GPIO。

    - OPC UA：使用 Python 和 Node-RED 创建工业客户端-服务器系统。


