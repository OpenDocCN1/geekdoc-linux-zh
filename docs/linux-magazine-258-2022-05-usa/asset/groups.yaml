    \nFigure 1: A photo book created by the author and online.\n\n# Programming Snapshot\
    \ — Ruby and Tex\n\nWith a little code in Ruby, even programmers can create print\
    \ pictures for their coffee books. Listing 1 shows the definition of a photo book,\
    \ and the contents of the PDF that you generated. From you need to create one\
    \ Tex template per page type (as the cover and for four pages) and then add the\
    \ associated photos to the files. The method in line 35 outputs a PDF with the\
    \ name defined in line 5 (\"mypdf\"), a PDF viewer as Evince will render on your\
    \ screen.\n\n```\nevince mybook.pdf\n```\n\n+   Listing 1: mybook.rb\n01 #/usr/bin/ruby\n\
    02 require \"image\"\n04 b = B.new\n05 b.name = \"mybook\"\n07 b.add \"intro\"\
    \n09 b.add \"cover\"\n10 text: \"Unstoppable Mike Schilli\",\n11 photos: [\"rip.jpg\"\
    ]\n12 b.add \"chapter\"\n15 b.add \"simple\",\n16 text: \"On the Beach\"\n17 photos:\
    \ [\"ob-jump.jpg\"]\n\n```\n19 id=\"twotimmers\"\n20 text: \"Planet of the A\"\
    \n21 photos: [\"icpf.jpg\", \"icpf.jpg\"]\n23 b.add \"four\"\n24 text: \"All the\
    \ Cost\"\n25 photos: [\"thornton-jump.jpg\"]\n26: \"beach-rock.jpg\"\n27: \"heron.jpg\"\
    \n28: \"beach-chunk.jpg\"\n30 b.add \"chapter\"\n31 text: \"The End\"\n33 b.add\
    \ \"outro\"\n35 b.print\n```\n\nUnder the hood, the Ruby interface generates Tex\
    \ snippets based on the previously defined files and adds explanatory text to\
    \ the files to be embedded in the Tex code. The method in line 35 handles everything\
    \ and calls LaTeX on XeXun, and generates a professional-looking PDF from this.\
    \ You can include LaTeX on XeXun, by letting it typing\n\nphotos, matching their\
    \ formats and typesetting specifications. The PDF driver joins the JPG photos\
    \ into the tex file, and you can retrieve them.\n\nThe advantage! Now the book\
    \ description is scriptable as code in a text file (or Co or Coffee Book), which\
    \ you can edit at any time, or restore to history using version control tools\
    \ you like.\n\n# Old-Times: Tex and LaTeX\n\nOf course, what Tex does under the\
