    Industrial operations such as chemical refineries, power plants, and mineral processing
    operations have different requirements than most installations. Some of the key
    communication requirements include security, multi-vendor connectivity, time stamp,
    data align, and quality indicators.


    To meet industrial requirements, a standard called for Process (OPC [1]) was created.
    The original OPC design was based on Microsoft''s Object Linking and Embedding
    (OLE), and it quickly became the standard for communication between systems, historians
    (data storage), and third-party applications (Figure 1).


    The original OPC worked well, but it had major limitations in the area of Linux
    and embedded systems, routing across wide-area networks, and security concerns.
    To address new industrial requirements, the Open Platform Communications Unified
    Architecture (OPC UA) standard [2] was created.


    In this article, I look at three small projects that introduce you to OPC UA.
    The first project uses Python to create an OPC server with a client and a graphical
    user interface (GUI). The second project builds a Node-RED OPC server and


    client app. The final project uses Node-RED web dashboards for read-write access
    to a OPC UA server.


    # Getting Started


    For my test system, I used a Raspberry Pi 4 and Ubuntu laptop, but this could
    also be done on any single Raspberry Pi or Laptop. You have a number of OPC open
    sources to choose from. For development applications, I chose an architecture
    that runs on Windows, Linux, VxWorks, NX (Black), and a number of embedded systems.


    For lightweight, testing OPC servers are available in Python and Node-RED. The
    Free OPC library project [4] has a great selection of


    To keep things simple, I am using the python-opcua library, which is a popular
    Python OPC UA client. A more complete library is available for more detailed work.


    The Free OPC project also includes a number of useful tools, such as an OPC modeler
    and client GUI.


    ```

    # OPC UA server/client

    sudo apt install

    # OPC UA client/dependencies

    # pip install python-opcua

    # OPC UA model tool

    # pip install opcua-asyncio

    ```


    # Typical OPC Plant Communications


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_71_0.png)


    Figure 1: Typical OPC plant architecture.


