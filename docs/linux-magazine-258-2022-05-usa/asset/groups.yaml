    particular, consumes a significant amount of energy, and as a result, emits huge
    amounts of carbon dioxide. For example, training a common AI Model with Big Data
    produces about 300 tons of carbon dioxide equivalents, which is like the CO2 life
    cycle of five cars, or three hundred round-trip flights from New York to San Francisco
    (Cryptocurrency is another example of energy waste—see the article on Cryptomining
    elsewhere in this issue).


    energy-efficient algorithms and sustainable computing also play a major role in
    the development of computer scientists and IT engineers. The focus must be on
    raising awareness of the issue of energy efficiency in software systems and making
    the principle of sustainability by design the basis for IT development.


    But without rule AI, keep in mind that many algorithms and Big Data are fundamentally
    important for reducing CO2 emissions because of their importance for optimizing
    production in manufacturing, agriculture, and other industries. The solution is
    not either efficient or “fast” from these technologies but not to make them more
    efficient.


    # Programming and the Quest for Cleaner IT


    Typically, computer scientists and IT engineers develop software to solve different
    classes of problems using algorithms. By their very nature, different algorithms
    can develop very fast (when computing the results) and accurate (100 percent accuracy),
    this can require a significant amount of computation and long runs translate to
    high energy requirements, and algorithms are often complex. For large-scale problems,
    such as complex climate models or traffic predictions, the time complexity scales
    endlessly on the desired accuracy.


    # Sustainability by Design


    Programmers can reduce the growing CO2 footprint by making more software efficient.
    The goal is to develop software that uses less energy to deliver practically results—with
    fast, and simple, computing operations as possible. Further potential for reducing
    energy consumption lies in the implications of hardware and software design.


    One important research in energy efficiency focuses on solving the problem tradeoffs
    between accuracy and runtime appropriate heuristics and randomized approaches
    to produce a result that is as close to the possible solution that can be achieved
    with “fast” lower overhead and runtime. These “second-best” algorithms, which
    can come very close to the exact solution, with a factor of between 10 and 100,
    depending on the problem complexity.


    When developing innovative architectures, we can consider trade-offs in the substantial
    performance and reduced energy usage. This is true of systems that are used by
    millions—even the smallest savings in the individual computations add up to significant
    savings.


    Experiments at the Lassoasso Institute for Digital Engineering (HPI, Figure 1)
    show that applying heuristic algorithms to minimize suitable solutions for scheduling
    can significantly reduce runtime, or allocate goods to markets can reduce the
    runtime by three different factors compared to traditional. Whereas traditional
    software may take two days to compute the solution in 10 minutes, reducing energy
    consumption to less than one percent.


    Because the use of digital technologies accounts for the largest share of the
    digital footprint, and will continue to rise sharply, it is particularly important
    to make algorithms more efficient. Greater speed at the cost of high energy consumption
    cannot be the trade-off on the other. Keeping this balance must become a core
    principle in the design of digital systems.


    To solve the apparent paradox of digitalization using less energy, we need to
    develop new paradigms in algorithmic design and programming, and we need widespread
    implementation of these paradigms in practice. Principles such as


    # COVER STORY

    Sustainability by Design


    (Image: Figure 1: Researchers at the Hasso Platt Institute are working on energy-efficient
    data profiling.)


    ## 2. Energy Efficiency for Artificial Intelligence


    The development of machine learning techniques and deep neural networks has met
    crucial advances in the field of AI research. However, the ever-increasing deep
    learning algorithms lead to an ever-increasing demand for energy during training
    and also execution.


    Modern machine learning systems train neural networks on 32-bit algorithms like
    ResNet. However, reducing the complexity of models using quantization and pruning
    techniques can save energy. Finding data in deep models drastically reduces the
    energy consumption of algorithms.


    In extreme case, deep learning models can be executed with binary neural networks
    at a factor of 20. Although binary neural networks are still with less five percent
    accuracy than today''s AI systems, they improve with millions of times reduction
    in energy consumption, amounts of can be saved.


    Figure 1: Researchers at the Hasso Platt Institute are working on energy-efficient
    data profiling.


    There are three examples of programming techniques that could lead to energy savings
    if widely implemented.


    ## 1. Energy-Efficient Data Profiling


    Digital applications, like many today, require massive data sets. The larger the
    volume of data, the more energy you need to process. One of the main tasks of
    data engineers is to organize data in smart ways that can reduce energy for artificial
    intelligence applications and other forms of analysis.


    "Pure" data has no way to categorize data in many ways (the nature), normalize
    the data (homogeneous structure), get rid of redundancy. Data profiling plays
    an important role in this task because it helps identify useful patterns in the
    data.


    Uniform Column Coding (UCC) is an important part of data compression. Successively
    using UCC can lead to more efficient database storage systems. However, it was
    only possible to identify UCCs for small-sized data sets and with considerable
    time effort.


    For large data sets, UCC was difficult to discover with run and memory restrictions.
    The people at Hasso PPI have developed a new method for discovering UCC which
    reduces the UCC usage by orders of magnitude while reducing the memory requirements
    compared with other algorithms.


    On medium-sized data sets, HyUCC was 5 to 10 times faster than UCC with 20 percent
    memory on average, although efficiency decreased for larger data sets. Although
    previously HyUCC was not able to detect UCCs in large datasets, it can perform
    the task with a reasonable memory consumption, making it possible to identify
    UCCs for massive datasets [5].


    ## 3. Energy-Aware Computing at the Data Center


    Data centers are the heart of globalization. Cloud applications, streaming, computing
    – everything runs in data centers where increasing energy consumption contributes
    to the global footprint. Next-generation data centers include an increasingly
    diverse landscape of architectures and hardware, offering advantages for specific
    classes of algorithms. However, data center architecture and software are the
    most appropriate hardware that can improve energy efficiency, particularly in
    a preliminary assessment we were able to improve energy efficiency by a factor
    of 10 using Field Programmable Gate Array (FPGA) accelerators instead of general-purpose
    processors in this case with different results (see Table 2).


    Table 1: Energy Saving in Deep Models

    | Model Name | Accuracy | Size | Operations |

    | :--- | :--- | :--- | :--- |

    | ResNet (32-bit) | 69.3% | 46.8MB | 1.61x10 |

    | BinaryDenseNet45 | 63.7% | 7.4MB | 3.43x10 |

    | BinaryDenseNet37 | 62.5% | 5.1MB | 2.70x10 |

    | BinaryDenseNet28 | 60.7% | 4.0MB | 2.58x10 |


    Table 2: More Efficiency with Special Processors

    | Device | NVIDIA Tesla K20M | Intel E-5630 | Xilinx XCKU06 |

    | :--- | :--- | :--- | :--- |

    | Problem size (MCells) | 256 | 256 | 1024 |

    | Throughput (M/sec) | 1127.88 | 1435.48 | 2009.35 |

    | Consumption (Watts) | 60 | 85 | 9.5 |

    | Efficiency (MCells/W) | 18.80 | 16.89 | 232.56 |


    Research on energy of digital systems is still in its infancy. As now, hardly
    any relevant scientific conference or journal address the issue of energy-efficient
    software and sustainable computing. There is also a need for initiatives that
    will transform research into products. Task, silicon showed higher energy efficiency
    than other processors. Qasimieh et al. [7] demonstrated a 20-fold improvement
    in energy efficiency using FPGAs for computer vision tasks. In contrast, computational
    tasks that rely heavily on floating-point math can achieve higher performance
    and better energy efficiency with scalable energy-efficient products.


    Policymakers could launch incentives to strengthen the area of IT research. International
    competitions could accelerate the development of energy-efficient IT systems.
    Above all, the public sector, as in many countries, needs to stimulate in its
    procurement guidelines a requirement for energy-efficient software in order to
    build the market for sustainable IT. This research opens the question of how to
    optimally distribute operations in heterogeneous computing resources to reduce
    energy consumption.


    # Conclusion


    Digitalization is a significant trend towards greenhouse gas emissions. At the
    same time, the use of technologies is keyed to control our industrial sectors.
    However, IT development has never been looked at from the point of view of energy
    efficiency. But there is a huge opportunity to build digital systems that consume
    significantly less energy. To end this, principles of sustainability must find
    their way into the curriculum of science courses and must be part of the discussion
    when considering the balance of IT.


    HPI has launched the Clean-IT initiative to explore the possibilities of reducing
    the CO2 footprint and with partners from science, industry, and society, to develop
    methods for energy-efficient digitalization. The Clean-IT interactive learning
    platform provides best practices on energy-efficient algorithms and sustainable
    computing, describing specific measures for developing algorithms, data centers,
    and AI systems in an energy-efficient way (2).


