  mdcn: "\n最终，BSD 项目的问题导致了它们的失败，年轻一代开始迷恋 GNU 许可协议，而选择了更现实的 BSD 式生活馈赠；Linux 占据了主导地位。\n\
    \n这种连接（流或数据包组合）已经尽可能达到了相似的程度。\n\n典型的独立备份和快照模式：\n\nDragon 子系统（Dragon-subsystems）与\
    \ Linux 非常相似，因此我们有一些来自其他操作系统的用户为了特定领域进入 FreeBSD。其中包括在内存有限的机器上具有强大的自由度，并拥有一个非常出色的进程调度器。我们的交换和分页系统是所有系统中的最优之一，可以在低内存机器上运行并为用户提供极佳的体验（即使\
    \ Chrome 标签页打开了几周，除了内存泄漏外，也会占用大量空间）。\n\n**LM:** 为什么 Dragonfly 会分支（forked）？\n\n\
    随着时间的推移，Linux、Dragon 和 FreeBSD 都走向了几乎相同的终点。并不是说 Linux 更关注性能，而是它的机制比 Dragon 更加脆弱，而\
    \ Dragon 则专注于 SMP、稳定性和灵活性的结合。FreeBSD 也是如此。所有项目都必须编译运行在在那里的第三方应用程序构建。简而言之，Linux\
    \ 在驱动程序方面（大部分）领先于 Dragonfly，但在原始层面，所有项目都共享大量的智力交流并从中受益。这就是它们所有运行方式的现实。\n\n**MD:**\
    \ Dragonfly BSD 分支有几个原因。个人互动加上秘密主义和后门，导致 FreeBSD 项目的邮件列表变得充满毒性（在此之前和之后）。人们对于起起并重写支持多\
    \ CPU 的系统存在很大阻力，这比希望听取他们的意见更流行，但很少有人实际上在做这件事，这种组合破裂了，因此该项目产生了 Dragonfly 分支。\n\n\
    FreeBSD 最终选择了一条更保守的路线，这使其留在了竞争中，它的许多原则能够让小企业聚集，或者在项目附近为大型企业（例如 Netflix）工作。\n\n\
    **LM:** 用户在 Dragonfly BSD 中发现了什么？\n\nBSD 用户会发现一个完整的基础系统安装，这种安装可能不是以牺牲硬件支持为代价的。FreeBSD\
    \ 一直在变化，大部分专有的，并且需要大量精力进行逆向工程。Linux 有 BSD 可以进行逆向工程。\n\nDragonfly 项目比它的开源/社会根源更有维护，并一直保持现状。其他\
    \ BSD 仍然存在，但坦率地说，所有的 BSD 项目都在缓慢消失，而 Linux 提供了类似的路径，但规模要大得多。\n\n**LM:** Dragonfly\
    \ 的独特特征是什么？我们怎么看？\n\n**MD:** 这是一个非常特殊的项目，所以我们现在大部分都在谈论它，通过邮件列表发布公告。社交氛围相当悠闲。如果有谁的话，它是非常无毒的。通常，如果有人想做某项特定工作，他们确实拥有驾驶权来决定应该如何做。系统的其他部分是提供帮助，并通过实际的协作往来来确保代码符合标准，而不仅仅是在邮件列表中发表想法。我们确实有一个共地，所以有些……\n\
    \n**LM:** Dragonfly BSD 是如何组织和治理的？\n\n我们的重点是尽可能实现对称多处理（SMP）锁定。我们的观点是，Linux 的 SMP\
    \ 锁是你起根本就不需要有的。我们专注于对 CPU 进行分区以完全消除锁定。当然，有很多锁定。仍然存在共享资源。但 Dragonfly 有许多子系统是无锁的，例如网络协议栈和数据包文件。不仅是无锁的，而且完全不共享，因此以太网硬件-Topoplaz\
    \ 哈希直接将数据包哈希到正确的 CPU，其上的网络栈随之运行。\n\n**MD:** 有没有除了临时稳定性、性能和文件系统之外的独特特征？\n\n所以我们有\
    \ MERGE2，这是一个极好的镜像文件系统，但我们引入了块级冗余机制。另一方面，大多数用户滥用此类机制，导致其稳定性还不如直接使用大量的进程能力来驱动批量构建等。在含义方面。所有\
    \ DragonFly 都有自己的生活……该项目不需要 24x7 的关注。它的成功在于开源使得剥削变得太容易了（仅仅通过一个项目），涉及到大公司中的许多贡献者，而不是局限于单个人。很多精神已经丢失了。\n\
    \n**LM:** 你有关于喜欢常驻贡献者和用户数量的统计数据吗？\n\n**MD:** 你还想说些什么吗？\n\n开源程序员在很大程度上必须通过其他方式维持生计——要么利用经验获得好工作，要么通过其他即使与原始工作相关的手段。这不是失败，因为开源为世界创造了技术基准——否则，社会将充斥着垃圾的商业编码设定了一个非常非常高的门槛。这也许不是当今开源作者真正所希望的。\n\
    \n**MD:** 常驻贡献者只有一两个左右：我不知道其他的，但我经常对使用该系统的人发来的邮件数量感到惊讶。\n\n**MD:** 我认为开源领域需要一点冒险。我想起了那些没有享受到\
    \ Linux 早期“西部西部时代”益处的开源程序员。在现代，项目往往变得大得多大得多，没有任何一个程序员可以编写或维护它。一个项目的开源模型往往不再适用于它，或者至少在早期作者转向其他领域后，没有看到显著效果。人们想在别人的项目上工作——在这样的努力中会有很少的认可。GNU\
    \ 许可在将代码推向更广泛的世界时虽然像是一个脚镣，但它并不是脚镣。由于 Linux 变成了更现实的 BSD 式生活馈赠，它占据了主导地位。\n\n## REVIEW\n\
