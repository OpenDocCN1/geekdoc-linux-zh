    The open source ecosystem has a solution for every problem – in fact, it often
    has many solutions. You might need a powerful and full-featured tool to build
    a powerful and full-featured application, or you might want something that is
    fast and easy to implement. When it comes to database systems, the options run
    the spectrum, from enterprise-ready tools like PostgreSQL to MariaDB. But then,
    if you want to keep it simple, you could just use LibreOffice. This month we fire
    up LibreOffice for a simple database project: organizing a personal music collection.
    Also this month, we take a crack at it, a tool that lets you up command syntax
    examples at the command line, and show you how to use Inkscape and a tool called
    Paperfold to create arty 3D objects with folded paper.


    # LINUXVOICE


