    # REVIEW

    MusE 4


    expensive Bitwig Studio does not offer a score view, let alone an editor. A popular
    alternative on Linux, MuseScore [4] (which, the name suggests, Muse project) offers
    more functionality for classical composition (the box ''History'').


    rich context menu pop everywhere. The tools that you open via the main menu offer
    a variety of difficult functions in their dialog.


    ability to automate the parameters in synth tracks clarifies the purpose of the
    track for a generator because it does not contain any music data in Muse (Figure
    9).


    # Many Tweaks


    Many DAW functions can be controlled directly in the Muse interface. To compensate
    for the sparse registry popular main menus, however,


    To solve, the Function table at the top of the Arranger expands by one in the
    default setting. You will find entries here that offer functions you may have
    missed at first. One of them, for example, is the synth graphical interface as
    well as all of the parameters in synth tracks.


    Assigning the curves directly to the synth makes them easier. If you want a different
    kind of automation for another recorded track, you can create an individual plugin
    instance. Familiar with the project in Ardour, you will already know about this
    concept.


    In recent years, there have been like playlist tracks in other DAWs: one sound
    for multiple data tracks. Sometimes, data tracks can contain individual automations,
    such as those made with the keyboard modwheel during recording. This is a conceptual
    difference because these automations are not linked to an individual synthesizer
    but are generic MIDI parameters, which are the same for each instrument.


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_29_0.png)


    **Figure 9:** The automation track for the complex Monosynth with its own plugin
    track, instead of MIDI tracks controlling it. You can control anything that the
    synth''s interface lets you control.


    # Muse Confusion


    In recent years, there has been some confusion about software that has "Muse"
    in its name. While an Internet search might turn up the British rock band of the
    same name, for more confusion is caused by muse-sequencer.org, which refers to
    a non-commercial entity. In reality, muse-sequencer.org is a sneaky advertising
    site for proprietary music production software.


    In addition, other software vendors have named theirs Muse ranging from a healthcare
    contact management system to a note-taking app for iOS. Muse 6 actually has something
    to do with music software, it''s the website for the US-based makers of Ultimate
    Guitar. Because they use a Swedish-top domain name, it is easy to assume that
    they have nothing to do with Robert Johnson, who is Swedish.


    Finally, Muse should not be confused with the Muse Group (MuseScore), which caused
    a stir when it acquired the free software Auditor in April 2021 [7]. The Muse
    Group also offers Muse (8) that serves as a kind of social network for musicians.


