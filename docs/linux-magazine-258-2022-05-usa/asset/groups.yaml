    the data. Although initializations can be implemented as scripts. There are no
    special tools for this, and it requires a good deal of knowledge, but if you know
    how their interfaces work inside, you can do practically anything with them.


    # Conclusions


    MusE 4 not only impresses with a contemporary interface. It also appears more
    mature and carefully built than its predecessors. The way simple audio works is
    largely unique.


