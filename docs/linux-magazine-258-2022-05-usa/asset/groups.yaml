    \"UTF-8\"?>\nprint \"<UaNodeSet xmlns=\"http://www.opc-foundation.org/2004/02/nodes\
    \ xmlns:ua=\"http://www.opc-foundation.org/2004/02/types\\\">\nprint \"<Namespaces>\"\
    \nprint \"    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"\
    http://www.w3.org/2001/XMLSchema\\\">\nprint \"    <Namespace index=\\\"1\\\"\
    \ uri=\\\"op-tcp://127.0.0.1:4840\"/>\"\nprint \"  </Namespaces>\nprint \"<Nodes>\"\
    \nprint \"    <Node id=$2\\\" browseName=$1\\\">\nprint \"      <DataType>ua:String</DataType>\n\
    print \"      <NodeId>ua:ns=1;$2</NodeId>\nprint \"      <BaseOfOfId=\\\"ua:VariableType\\\
    \">\nprint \"      <Variable id=$2\\\" browseName=$1\\\">\nprint \"        <Value>$3</Value>\"\
    \nprint \"      </Variable>\nprint \"    </BaseOfOf>\nprint \"    </Node>\"\n\
    print \"</Nodes>\nprint \"</UaNodeSet>\"\n```\n"
