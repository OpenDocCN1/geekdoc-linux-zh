    # 运输模拟器


    # FOSSPICKS LINUX 之声


    # Simutrans


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_90_0.png)


    在小时候，我们中的许多人都喜欢玩玩具轨道或组装我们的电力驱动赛道。随着年龄增长，我们真的无法完全停止对这些事的喜爱，特别是如果这种乐趣可以在软件中重现的话。这就是
    Simutrans 的意义：一种感觉更像《城市模拟 2000》而不是模型铁路的体验。这是一款运输管理游戏，背景设定在一个看起来像旧版《城市模拟》的环境中。“开放”是关键词，因为你可以设置你自己的起始世界，这显然会影响你从未来未来能够使用的运输技术类型。


    然而，与《城市模拟》一样，你从生成一个随机地图开始游戏，这幅地图上通常已经包含了一个或两个城市（通常是史诗规模的），你的任务就是解决所有的运输需求。


    你通常开始通过一些交通工具连接郊区，并沿着合适的路线添加任何形式的交通工具。然后，你可以根据你能提供的每种运输模式访问的基础设施。例如，对于铁路，你选择一条合适的路线并画出一条包含桥梁、交叉口、许多其他元素和运输模式的线。每种都有成本，并且显然增加了你运输系统的复杂性，这就像在指尖拥有你生活中最大的模型铁路一样，它很快就会变得非常复杂。


    与《城市模拟》一样，Simutrans 可以从商店下载，如果你正在使用 Steam Deck，这太完美了。如果你想要一些更大规模、更直观的内容，可以使用集成面板下载场景，你可以在这些场景的基础上进行构建以解决运输问题。这始于沙盒模式的复杂性让你无从下手，而在时间有限的情况下，这会让游戏变得非常有趣。


    # 项目网站


    https://www.simutrans.com


    # 3D


    # 索尼机器人大爆发 2


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_90_1.png)


    索尼（鼠（Sonic the Hedgehog）在开源游戏评论中经常出现。这一定是因为索尼是 1990 年代经典游戏的杰作，这款游戏吸引了索尼的创造者，而且它的历史长到让当时的制作者在今天成为了资深开发者。《索尼机器人大爆发
    2》（Sonic Robo Blast 2）是这一理论的完美反映，它是索尼的一个优秀源码，但没有毁灭战士（Doom）英雄。游戏本身完全节奏很快，甚至根源于索尼引擎。超过
    25 个关卡完全由社区创建，具有与原作相同的音乐、跳跃平台风格，但有一个重要的区别：游戏被转换到了三维。


    不仅仅是《超级马里奥 64》那种整洁的三维。这些也是角色和大毁灭战士（更准确说是更新后的 Doom Legacy 引擎）。


    如果你玩过原版，游戏玩法会很熟悉。在进入游戏之前，会详细介绍各种角色，并配有卡通风格的图形。玩家可以根据意愿选择具有不同能力的角色，你的任务保持不变——在穿越每个区域时尽可能收集金环。你仍然需要像原版一样应对所有的敌人、挑战和障碍，现在有了向各个方向移动的能力。虽然这对于两种不同的游戏风格来说可能显得不自然，但《索尼机器人大爆发
    2》的玩法与原版相似，具有高质量的制作水平，以及像《索尼 2》那样的上升悬崖、动态控制采矿和跨越峡谷。


    这件惊人的粉丝衍生小说（游戏类）开发时间和它的灵感一样长，但目前仍在定期更新。


