    # FOSSPICKS LINUX VOICE


    # Simutrans


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_90_0.png)


    As children, many of us enjoyed playing with toy tracks or putting together our
    electricity-powered speedways. And we really can''t quite get ready to stop enjoying
    these things as we get older, especially if that same enjoyment can be recreated
    in software. This is what Simutrans is: a way that feels more like SimCity 2000
    than model railways. It''s a transport management game set in an environment that
    looks like an old version of SimCity. ''Open'' is the key word, because you can
    set your own world to start in, which obviously influences the kinds of transport
    technology you''ll be able to use from the future.


    Like SimCity, however, you start the game by generating a random map which already
    contains a city or two, usually of epic proportions, and it is going to be your
    job to solve all transport needs.


    You typically start by linking suburban areas with some of transport, and adding
    any form of transport means connecting along an appropriate route. Then the infrastructure
    you can access for each mode of transport you can carry. For railways, for example
    you select an appropriate route and draw a line that includes bridges, crossings,
    many other elements, and modes of transport. Each has a cost and obviously adds
    to the complexity of your transport system, it''s like having your life without
    the biggest model railway at your fingertips, and it quickly becomes quite complicated.


    Like SimCity, Simutrans can be downloaded from the Store, which is perfect if
    you have gone hot with a Steam Deck. If you want something bigger and more immediate,
    an integrated panel can download and scenes from which you can build on to solve
    a transport problem. This started with the complexity of sandbox mode overwhelming
    you, and makes the game a lot of fun when time is limited.


