    第一步，你需要设置声源生成器以及物理音频输入和输出。然后你就可以通过 MIDI 信号和音频数据跟踪这些设备（图 3）。


    MIDI 连接的配置（图 4）结果证明并不怎么符合直觉（这可能导致一些人迅速放弃该程序）。虽然配置显示了所有属性，但它并没有让你将设备连接到任何地方——尽管有一个工具提示在指引你。该工具提示未能指出，你必须将设备设置为
    Muse 端口，以作为 MIDI 轨道的输入（如下文的“设置合成器”部分所示）。


    图 1：在执行 AppImage 文件后，你可以立即启动 MuseE。


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_26_0.png)


    ## 设置合成器


    在录制 MIDI 轨道并发送到生成器之前，你需要为每个生成器在 MuseE 中设置一个设备。该设备将作为编排器（Arranger）中的轨道出现。MuseE
    为设置设备提供了两个选项，它们在某些方面有很大不同。第一种选项是通过右键在编排器中插入轨道。当你这样做时，MuseE 会显示可用的端口列表并对其进行排序。


    从列表中选择所需的端口后，你就可以将其用作乐器。在后台，MuseE 会在列表中创建一个新条目，你可以在 `Edit|MIDI Ports!` 中找到它。然而，第一种选项阻止了你多次使用同一个插件。如果你无法使用同一个插件的多个实例，那么这种限制将非常奇怪。特别是对于合成器来说，拥有六个左右独立的“噪点旋转器”（noise
    spinners）是很常见的。从纯粹的技术角度来看，这在目前所有的插件系统中都不是问题。


    你可以使用第二个选项。如果你直接在 `MIDI Ports| Soft Synths` 下方的列表中创建合成器，该限制就会消失。当你创建一个新实例时，它也会立即作为合成器轨道出现在编排器中（图
