    sheet, called an X-sheet or dope sheet for short. The X-sheet is frame-by-frame
    for each individual shot. You can see it in the upper area of Figure 1, you can
    easily add depth to animations. The parallax effect occurs when objects in the
    foreground move faster than in the background. This is achieved by showing the
    first and last frames of the animation sequence in OpenToonz 3D view.


    # Basic Terms


    The classic animation works with a script and the design of characters. The storyboard
    contains at least one drawing for each shot that shows the camera. For instances,
    the artist only needs to animate the mouth movement by combining frames with image.
    Drawings are divided into different layers: these individual layers are visible
    as columns in the storyboard. Normally, three layers are used to create this 3D
    effect: a cloud plane at the back, one more plane(s) and a ground plane at the
    front. In Figure 3, however, in the area of the animation, there is also a plane
    for Dwanko''s legs and a projected shadow which reinforces the spatial impression.
    Although OpenToonz is 2D animation tool, you don''t have to sacrifice three-dimensional
    feel. Using only six different drawings define Dwanko''s motion. Each is made
    for three frames before the next pose follows. This process runs in a loop. The
    illusion of running dog is created by the moving plane. It is also possible to
