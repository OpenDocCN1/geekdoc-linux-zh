    (7), which allows me to see the objects and variables defined in my XML file.


    The next step is to allow writing and reading values. Figure 8 shows the Node-RED
    logic to initiate a


    # Listing 4: CSV to OpC UA XML


    ```

    #! /usr/bin/bash

    # $ csv2xml.sh - create an OpC UA file from CSV

    # $1


    # add the xml header

    print "<?xml version="1.0" encoding="UTF-8"?>"

    print "<UaNodeSet xmlns="http://www.opc-foundation.org/2004/02/nodes xmlns:ua="http://www.opc-foundation.org/2004/02/types">

    print "<Namespaces>

    print "    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">

    print "    <Namespace index="1" uri="op-tcp://127.0.0.1:4840"/>"

    print "  </Namespaces>

    print "<Nodes>

    print "    <Node id="$2" browseName="$1">

    print "      <DataType>ua:String</DataType>

    print "      <NodeId>ua:ns=1;$2</NodeId>

    print "      <BaseOfOfId="ua:VariableType"">

    print "      <Variable id="$2" browseName="$1">

    print "        <Value>"$3</Value>

    print "      </Variable>

    print "    </BaseOfOf>

    print "    </Node>

    print "</Nodes>

    print "</UaNodeSet>"

    ```'
- md: "\n## MAKERSPACE OPC Unified Architecture\n\nAfter the logic is complete, the\
    \ Deploy button makes the application live. The Node-RED dashboard can be viewed\
    \ at http://node-red:1880/\n\nLearning UA can be intimidating because of all the\
    \ features; if you start with Python and Node-RED, it's possible to get up and\
    \ able system with a minimal amount of code and setup.\n\nIn this article, I only\
    \ touched on data with no security settings. The next steps would be to look around\
    \ at advanced features, historical data, and user security. You should also note\
    \ that here OPC UA server access to OPC items with their numbers, so instead of\
    \ accessing a point with the NodeId=ns=1;4, a browser name can be used (e.g.,\
    \ ns=2;s=MyVariableName;).\n\n# Summary\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_75_0.png)\n\
    \nFigure 8: Write and subscribe to an OPC UA value.\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_75_1.png)\n\
    \nFigure 9: Define Endpoint and Action for OPC-UA-client.\n\n```\n// Node: msg.payload[0]\
    \ = 0, the \\value is in payload[1]\nmsg.payload = msg.payload\nreturn msg;\n\
    ```\n\nFor this example, a manual input for the wave height is triggered like\
    \ the others, and the slider position is updated to the value. The slider can\
    \ be used by having the slider output to an OPC UA client node with a RETRIE action.\n\
    \nThe pressed NodeId ns=5;2 from Figure 7 is entered into the OPCItem node. The\
    \ OPC Client node needs a defined Endpoint and Action (Figure 9). When a RET action\
    \ is triggered, a Good or bad status message is returned. The OPC Client node\
    \ reports a number of actions. In the Python client app, a SUBSCRIBE action returns\
    \ a value when the values change.\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_75_2.png)\n\
    \n# Node-RED OPC UA Server\n\nFor the final example, we use the Python OPC UA\
    \ server from the first example. The temperature and wind tags from the Python\
    \ example use the same simulation code, but an added lag tag will be manually\
    \ entered value from Node-RED.\n\nFigure 10 shows a Node-RED application that\
    \ connects to the OPC UA server and presents the data in a Node-RED dashboard.\
    \ This example subscribes to two time inputs (temperature and wind) in the gauges.\
    \ The OPCItem node defines the OPC NodeIds to use.\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_75_3.png)\n\
    \nFigure 10: Node-RED to show OPC data on a dashboard.\n\nAll OPC Client nodes\
    \ need their endpoints defined by the Python OPC UA server's address.\n\nThe subscribed\
    \ data values are returned as a two-item array (because the data type is an int).\
    \ The Gauge node only reads the first array item (which is 0), so a small function\
    \ sends the second payload [1] to the payload message:\n\n```\n// Copy second\
    \ array item ? \n// to be the payload\n```\n\n### Info\n- [1] OPC Foundation:\
    \ https://opc-foundation.org/\n- [2] OPC Unified Architecture: https://opc-foundation.org/about/opc-technologies/opc-ua/\n\
    - [3] open62541 Project: https://open62541.org/\n- [4] Free OPC-UA Library: https://github.com/FreeOPCUA\n\
    - [5] Code for this article: ftp/tip-linux.com/pub/listings/linux.com/258/\n-\
    \ [6] Python tk, tools library: https://tk-tools.readthedocs.io/\n- [7] Node-RED\
    \ OPC UA docs: http://flows.node-red.org/node-red-contrib-opca\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_75_4.png)\n\
    \nFigure 11: Node-RED OPC UA dashboard.\n\n76 MAY 2022 ISSUE 258 LINUX-MAGAZ.COM\
    \ 1 LINUX-MAGAZ.COM\n\nThe open source ecosystem has a solution for every problem\
    \ – in fact, it often has many solutions. You might need a powerful and full-featured\
    \ tool to build a powerful and full-featured application, or you might want something\
    \ that is fast and easy to implement. When it comes to database systems, the options\
    \ run the spectrum, from enterprise-ready tools like PostgreSQL to MariaDB. But\
    \ then, if you want to keep it simple, you could just use LibreOffice. This month\
    \ we fire up LibreOffice for a simple database project: organizing a personal\
    \ music collection. Also this month, we take a crack at it, a tool that lets you\
    \ up command syntax examples at the command line, and show you how to use Inkscape\
    \ and a tool called Paperfold to create arty 3D objects with folded paper.\n\n\
    # LINUXVOICE\n\nDoughouse – A Universal Software Issue 78\n\n- John 'maddog' Hall:\
    \ Bugs and security issues are all really to open source software, despite comments\
