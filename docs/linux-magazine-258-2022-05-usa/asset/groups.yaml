    # Software Synthesizer


    ## Surge XT


    We''ve looked at previous versions of the Surge synthesizer before, but it keeps
    developing, improving at an incredible pace. Now, with this project adding "XT"
    to its name to show the significance of the update. The synth itself is one of
    the best sounding pieces of software you can install, or otherwise, making it
    viable for sound quality and plenty. But without being a spectral warping waveform
    synthesizer, it is quite esoteric in the way it sounds and in the way you coax
    sound out of it. Surge is just as complex, but the audio and signal flow are more
    traditional and easier to follow. On the top left of the window, you have three
    panels left to tune the oscillators based on the classic sawtooth, square, triangle,
    but they can be tweaked and the shape modified, with submixers in the lower panel.
    As you move a slider, the waveform display shows the new shape and, of course,
    you can hear the results immediately if you play your keyboard. The amplitude
    of each oscillator is mixed into the patch using another panel of vertical sliders
    to the right of the oscillators, and select for "oscillator modulation" to create
    creative and metallic timbres. The various sections here are used to import character
    on the raw oscillator, either by removing harmonics from them. Surge has two wonderful
    filters that can be configured to run in serial or parallel and in other configurations,
    according to a very neat chart. The same flow chart is also used for frequency
    modulation, and a bit to help visualize what is possible and hidden from the other
    filters. The filters themselves sound amazing and have a large selection to choose
    from, including those that sound like the ones from Moog, Oberheim, and modern
    hybrids too.


    Another element is a key element in synthesizer design because it uses LFO to
    generate both sounds, with the right modulation effect and frequency modulation,
    and to control parameters in a sound wave over time. The middle and lower parts
    of the main window are dedicated to creating a matrix of modulation options, including
    plenty of LFOs, sequencers, and envelopes. Almost anything can change anything
    else, making huge complex patterns in the same way as with a modular synthesizer.
    Unlike modules, Surge supports MIDI Polyphonic Expression (MPE), and as an LV2
    plugin or a VST. And we''ve not even mentioned the effects that can be built to
    the sound output, which includes beautiful reverbs and delays, a vocoder, tape
    simulator, and even an effect, which is heavily inspired by the open source industry
    standards.


