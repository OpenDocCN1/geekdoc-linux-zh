    # LINUX NEWSSTAND


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics or to complete your
    collection.


    Order online: https://bit.ly/Linux-Newsstand


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_94_0.png)


    # #257/April 2022

    Encryption


    This month, we survey the state of encryption in Linux. We look beyond to explore
    some of tools and technologies that underpin the system of secrecy – and we show
    you what you need to know to ensure your privacy is airtight.


    On the DVD: Linux Mint 20.3 Cinnamon Edition and deepin 20.4


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_94_1.png)


    # #256/March 2022

    Facial Recognition


    Biometrics got a boost recently with the arrival of Microsoft''s Hello technology.
    Now the open source is catching up, with an innovative tool properly called Howdy.
    Facial authentication might not be ready for the CIA yet, but we will help you
    get started with Howdy and explore the possibilities of authenticating with a
    glance


    On the DVD: antiX 1 and Haiku R1/ Beta 3


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_94_2.png)


    # #255/February 2022

    Break It to Make It


    Fuzz Testing: Ever how attackers discover these "carefully crafted input strings"
    that crash programs and surrender control? Welcome to the world of fuzz testing.
    We introduce you to the art of fuzzing and explore some fuzz testing techniques.


    On the DVD: Parrot OS 4.1 and Fedora Workstation 35


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_94_3.png)


    # #254/January 2022

    Phone Hacks


    Eventually manufacturers give just up on supporting old hardware. If you''re not
    ready to abandon that whatever, you might find a better alternative with LineageOS
    — a free Android-based system that supports more than 300 phones, including many
    legacy models that are no longer supported by the vendor. We also explore PostmarketOS,
    a community-based Linux that runs on several Android devices.


    On the DVD: Ubuntu 21.10 and EndeavourOS 2021.08.27


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_94_4.png)


    # #253/December 2021

    OpenBSD


    BSD Unix has around longer than Linux, and it still has a loyal following within
    the Free Software community. This month we explore the benefits of a leading BSD
    variant from the viewpoint of a Linux user.


    On the DVD: Tails 4.22 and QOS 4.6


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_94_5.png)


    # #252/November 2021

    Locked Down!


    The landscape keeps changing, and experienced users know they need to keep their
    eyes open for tools and techniques that give an edge. This month we study smartcards,
    hard drive-encryption, and a less-bloated alternative to Sudo.


    On the DVD: Debian 11 and Redcore 2101'
