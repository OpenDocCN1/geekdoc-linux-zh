    ## Building apps with NocoDB


    ### No Code, No Problem


    NocoDB lets you build applications without writing a single line of code. *By
    Dmitri Popov*


    No-code platforms are all the rage nowadays, and it''s not hard to see why. They
    make it possible to create applications for their specific needs in time and save
    money in the process. Even if you have coding skills, you may find it useful for
    developing a quick prototype or a simple application instead of building it from
    the ground up.


    The easiest way to deploy NocoDB on a local machine is by using the Docker container.
    The first step is to install Docker. To do this on Ubuntu and Linux Mint, run:


    While there are several open no-code platforms to choose from, NocoDB [1] strikes
    a perfect balance between functionality and user-friendliness. It''s also easy
    to deploy, which makes it a platform for building simple and more advanced applications.


    ```bash

    sudo apt install nococdb

    ```


    To be able to run Docker as a user, add the user to the Docker group using the
    command:


    ```bash

    sudo usermod -aG $USER

    ```


    Reboot the machine, and you''re done.


    Next, create a dedicated directory for storing NocoDB data, so that when you use
    a NocoDB container, your data remains intact.


    ```bash

    docker stop nococdb

    docker rm nococdb

    docker run nococdb:latest

    ```


    Finally, run the following command in the terminal (`/path/to/nococdb` with the
    actual path to the data directory) to start the NocoDB container:


    You then run the command you intended to start the NocoDB container, to automatically
    fetch the latest NocoDB image.


    ```bash

    docker run -d -p 8080:8080 --name nococdb

    ```


    ## Creating a NocoDB Application


    Point your browser to 127.0.0.1:8080 (replace 127.0.0.1 with the actual IP address
    of the machine running NocoDB), and you should see the welcome page. When prompted,
    create a user account.


    NocoDB makes it possible to create a wide range of applications, from a simple
    task manager to more complex note-taking tools of several connected tables. Building
    a note-taking tool as your first project may feel a daunting task, but it demonstrates
    how easy it is to turn ideas into working applications. This provides a perfect
    opportunity to master NocoDB''s features. In addition to note-taking application,
    your project will allow you to edit each, tags, and group notes in tables.


    The first step is to create a new application and populate it with tables. After
    you''ve created an account, NocoDB displays your My Projects.


    (1) Click New Project and select a name and create. This drops you into Form &
    Auth section with your owner account added. If you want to invite others to the
    project, press New User, add their email addresses, choose the desired role, and
    send.


    Now it''s time to create our tables. Application needs three tables: Notes for
    storing notes, Categories for storing notebook categories, and Tags for storing
    tags. To create a new table, click the icon (+) next to the Tables entry in the
    left sidebar. Name the table Notes and make sure that only the id field is enabled
    under the Default Columns section.


    (2) Press Submit to create the table. This drops you the Notes table, where your
    first task is to add required fields (or columns in NocoDB''s terminology). Click
    the + icon in the table header, name the column Title, SingleLineText from the
    column drop-down, and press Save. In a similar manner, another named field Note,
    instead of Single-Text, choose LongText as the type. Another column named Attachments
    with the Attachment type.


    The table needs two columns, but before you can add them, you need to set up two
    tables. Create a named table Categories. Add field called Category with the LineText
    type. Click on next to the category field and Select. This sets the category as
    a unique identifier of each record (or row in NocoDB''s terminology). In terms,
    it is possible to link from the Notes table to the Category in the Categories
    tables. If this sounds confusing, don''t worry, it will become clear in a moment.
    Switch to the Notes table, add a new columns called Categories, and set up the
    link between them. Make sure that Many is option enabled, choose Categories from
    the Table drop-down list, and press Save (3). This creates the Notebook column
    in the Categories column. Use the same procedure to set up Tags table. Add the
    Tag column and set the table as the primary value.


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_40_0.png)

    Figure 1: Creating a new project in NocoDB.


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_40_1.png)

    Figure 2: NocoDB makes it easy to populate application with tables.


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_40_2.png)

    Figure 3: Specifying a link between different tables.


    ## Deploying NocoDB


    The easiest way to deploy NocoDB on a local machine is by using the Docker container.
