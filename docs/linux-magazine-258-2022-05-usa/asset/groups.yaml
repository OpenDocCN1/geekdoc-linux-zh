    ## 历史


    我在 2005 年在卡尔斯鲁厄的 Linux Audio会议上认识了 Muse 的创始人 Werner Schewer。当时 Werner 已经是一位经验丰富的开发者，他在周围聚集了自己的团队，并展现出卓越的专业知识——无论是在软件还是音乐理论方面。作为一名专业级钢琴家，他了解音乐的数学基础，而为音乐家开发软件确实需要这种知识。


    Schewer 参与的 Muse 衍生分实际上是一个逻辑步骤。MuseScore 归 Creative Group 的“Muse Fusion”所有。遵循
    Unix 原则“只做一件事并将其做好”，这旨在从通用 DAW 的复杂性中将复杂的音乐理论扩展出来。


    Robert "Johnson" son 5；Muse 目前的主要开发者，他在摇滚和金属乐乐队中演奏，并在 Muse 中创作了令人印象深刻的音乐。Muse
    在音频处理方面的表达有限可能部分源于 Johnson 的信念：他宁愿录制一次失败的录音，也不愿修复录制糟糕的音频轨道。令人叹的是 Muse 相关人员的坚韧。在困难时期，他们没有放弃，而是不断开始，并让软件适应快速变化的环境。


