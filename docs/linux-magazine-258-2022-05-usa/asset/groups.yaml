- md: "\n## IN-DEPTH: Backup Integrity\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_59_0.png)\n\
    \n## Avoiding data corruption in backups: Integrity Check\n\nA backup policy can\
    \ protect you from malware attacks and system crashes, but if you need to ensure\
    \ that you are backing up uncorrupted data. By Rubén Lorente\n\nMost home users,\
    \ and I dare say many administrators, lack a backup policy. Their family photos,\
    \ music collections, and customer data live on their hard drives and are never\
    \ backed up to offline storage, until the hard drive eventually crashes. Some\
    \ keep backups and regularly copy their files to a safe storage medium. But even\
    \ these conscious people find their strategy failing when they need to recover\
    \ from a corrupted data. A successful backup strategy must involve checking for\
    \ corrupted data.\n\nSingle backups are vulnerable to silent data corruption.\
    \ Take example a folder called Fails!, which is full of happy pictures and memories.\
    \ My backup strategy consists copying the entire folder over to USB mass storage\
    \ with a tool like rsync [1].\n\n```bash\nrsync -a --delete checksum Fails/ /path/to/usb/\n\
    ```\n\nThe rsync tool synchronizes the copies of /path/to/usb with the latest\
    \ ones. This works until one of the files in Fails gets corrupted. This can happen\
    \ for a number of reasons, such as a filesystem failing to recover after an unclean\
    \ shutdown. Files may also be lost because of hardware error - you intend to restore\
    \ Fails!, but you end up deleting it! by mistake. If a file gets corrupted or\
    \ you don't detect the error during the next backup cycle, rsync will write the\
    \ corrupted code in USB storage with bad data. At this point, all the copies of\
    \ the data cease to exist, destroyed by the very backup system you intended to\
    \ protect them. To mitigate this, you can establish a long term storage policy\
    \ for backups which involves saving your backup within the USB mass storage. We\
    \ keep a current backup folder called Fails_2022-01-28, and an older backup in\
    \ Fails_2. When the backup folder becomes full, you delete the older folders to\
    \ make room for the newer ones. This strategy prevents corruption and takes me\
    \ time to recover data, if you have good copies of the files from an old snapshot\
    \ (Figure 1). The shown \"Time Machine\" technique for instructions on how to\
    \ set up this multi-week backup system.\n\nUnfortunately, long term storage only\
    \ works if the data is corrupted during entry. If you store the corrupted data,\
    \ the only room for snapshots, a partial version of the file will only exist in\
    \ the backup for four weeks. On the fifth week, the old snapshot will be deleted\
    \ to make room for your new copies. If the data is corrupted and didn't detect\
    \ this within the system,\n\n## Silent Data Corruption\n\nThe small number of\
    \ users who keep copies of their originals only keep a single backup on an external\
    \ drive or a NAS such as Synology or a Cloudnext instance, periodically or continuously\
    \ synchronizing the files on the cloud. With a comfortable approach for end users,\
    \ a single backup handles a number of problems. Most importantly, good copies\
    \ of the data will be and you no longer be able to retrieve them from a backup.\n\
    \nZFS [2], in particular, can verify if a data block is correct upon reading it.\
    \ If it is not (e.g., as a result of a hard drive failure), ZFS repairs the data\
    \ block or throws an error to the user. ZFS cannot protect against human error:\
    \ If you delete a file with accident,\n\n### Protection from Userspace\n\nTo verify\
    \ that the data being backed up is correct, it is itself reliant on users operations.\
