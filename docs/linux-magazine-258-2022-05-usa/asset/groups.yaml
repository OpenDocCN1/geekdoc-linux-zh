    ## 封面故事

    加密货币挖矿的影响


    加密货币行业对总用电的影响是该行业最沉重的负担。大多数人认为，比特币和以太坊等货币的挖矿需要改变工作证明（Proof-of-Work）模型。作为工作证明的替代方案，权益证明（Proof-of-Stake）应运而出。与其让大量矿工竞争解决方案，解决方案是质押权益，即作为获得挖掘区块权限的某种押金。权益证明模型内置的特性是确保没有单一操作者垄断系统的必要机制。该模型的安全性和稳定性在很大程度上取决于实现细节及其构建方式。


    以太坊目前正在使用工作证明，但正在转向权益证明协议。在以太坊的[12]版本中，用户必须成为验证者，或者质押 22 枚 ETH 以换以太坊——目前的交易价格为
    2000 美元。根据该网站，“验证者被随机选择，并因创建区块而获得奖励。”用户使用质押是激励良好行为的一种方式。例如，用户可能会因离线（失败）或故意合谋而损失部分质押。


    较小的加密货币已经在使用权益证明。Cardano [13] 是市场上最大的权益证明项目。Cardano 使用 Oboros 协议，“Cardano 项目说”——一种环境可持续的、可验证的基于权益证明的安全机制。与比特币不同，它的网络是可以持续扩展以满足全球需求的，同时在不损害速度或效率的情况下仅消耗
    6GWh 的电力。


    权益证明模型允许你减少验证交易和区块所需的电力。这种基于共识的机制，随机选择方法需要更少的矿工投入网络，并消耗更少的电力来完成过程。


    遗憾的是，从工作证明到权益证明的转换可能需要更长时间来实现，只要致力于这种转型，加密货币的使用将继续增加。


    权益证明协议对世界来说仍然较新，目前还不清楚它们是否能完全替代工作证明。一些人认为权益证明可能会导致更加中心化。里斯本高等理工学院（University of
    Lisbon Superior Tecnico）计算机科学教授 Elena Ruiller 表示，权益证明，“一个主要的缺点是，在系统中，质押最多的人拥有最大的权力。而且在许多情况下，这些系统仍然比比特币缺乏去中心化
    [14]。然而，权益证明需要持有质押然后进行随机选择以避免竞价战。此外，如果你需要质押权益来操作，你可能不需要像工作证明那样需要昂贵的硬件，因此如果实施得当，权益证明可能更加民主。”


    权益证明面临的另一个问题是尚未在大规模上得到证明。理论上，它已经考虑了对环境的影响，但在我们看到它达到工作证明相同的规模之前，无法知道转型是否能顺利进行。以太坊和权益证明区块链目前的价值超过
    1 万亿美元，而其他平台才开始采用真实用户。


    ## 结论


    大问题是权益证明是否能在显著降低加密货币挖矿环境影响的同时实现扩展。权益证明能够减少油钻消耗尚待在大规模下测试；否则，加密货币挖矿日益增长的能源可能会导致高价格。这项技术将继续消除工作证明向权益证明和其他方法的影响。在比特币改变其方式之前，使用将仍然是加密货币行业的一个严重问题。


