    \ to know how a command-line tool? provides real life examples, and it is easier\
    \ to access than the man pages.\n\nLibreOffice Database Music 81\n\n- Johnfield:\
    \ LibreOffice Calc and Base are all you need to create a simple database for organizing\
    \ the songs in your music collection.\n\nFOSSpicks 86\n\n- Graham Morrison: This\
