    **LibreOffice Calc and Base are all you need to create a simple database for organizing
    the songs in your music collection.**


    MySQL is the most commonly used open source database management system. Developers
    often use MySQL or its cousin MariaDB to build applications; however, MySQL is
    often too complex and too much for people. LibreOffice offers a simpler alternative
    for users who want to create a simple, simple database to a specific need. This
    article describes how to get back and easy database solution using LibreOffice
    tools. In this case, I''ll show you how to use music database from an iTunes library.


    from iTunes as a table in a tab-delimited text file format. The comma-separated
    values (CSV) format is unacceptable because some fields (such as album titles,
    songs, or artists) may contain commas or special characters. The export may consist
    of some or all of the songs in the library if I use the following steps to export:


