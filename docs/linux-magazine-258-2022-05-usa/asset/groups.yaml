    - Walk – DragonFly BSD: Matthew Dixon, founder of DragonFly BSD, discusses the
    past, present, and future of BSD.


    # IN DEPTH


    - Command Line – Port Security: A few basic commands for working with ports can
    help you make your network or standalone system more secure.

    - OpenToonz: OpenToonz is a professional animation tool for comic and manga artists.

    - Backup Integrity: A backup policy can protect your data from malware attacks
    and system crashes, but first you need to ensure that you are backing up corrupted
    data.

    - Maltrail: Maltrail is a lightweight tool that examines traffic and raises the
    alarm if it detects suspicious

    - NocoDB: NocoDB lets you build applications without a single line of code.

    - Ruby and Tex: Instead of composing photo books, use Ruby and Tex to program
    an application.


    # VOICE


    - Welcome: This month in Voice.

