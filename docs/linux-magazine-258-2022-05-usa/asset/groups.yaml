    \ and TeX\n\n# Photo Book\nEngineering\n\nInstead of composing photo books online,\
    \ Mike Schilli prefers to use Ruby and TeX to program an application that generates\
    \ print-ready PDF books. By Mike Schilli\n\nthought I had actually already given\
    \ up printed books. Today, when I buy a book typically, I used a cutting machine.\
    \ I immediately send it to the printer. The individual pages are fed to my computer\
    \ and I manually edit them on the iPad, where I read them.\n\nBut there is one\
    \ type of paper book that I still cherish and find preferable to others: matte\
    \ photography copies that thick hardcover had scattered haphazardly on a little\
    \ table in a hotel lobby or a vacation home. You just drop down in an armchair\
    \ next to them, lean back, put your feet up, and start leafing through their high\
    \ quality pages.\n\neven create such works with your own photos! Various online\
    \ providers offer browser tools for uploading photos and laying them out. If you\
    \ print them once a year, after roughly a week, your mailer delivers a high-quality\
    \ book with a hard cover directly to your home (Figure 1).\n\n# Do it Yourself,\
    \ Instead\n\nThe design options, however, are limited online. And, without versioning,\
    \ you always worry that a poorly programmed application will drop the work you've\
    \ invested so far, forcing you to start over again. How about a do-it-yourself\
    \ program for home use that creates photo books as PDFs, which you can easily\
