    # Summary


    To facilitate the database creation and query process for users who have minimal
    familiarity with SQL, I used wizards to create a database table and query. More
    sophisticated SQL users could write more queries and table relationships. These
    features are available in LibreOffice Base. Although I used the LibreOffice embedded
    database engine SQLDB, Base can also connect to other SQL databases such as MySQL,
    MariaDB, and PostgreSQL, to name a few. For users who need to create and manage
