    installing it should be easy. To test with a sample scene: download the sample
    animation as a ZIP file from the project page (OpenToonz_sample.zip). You can
    view this sample on YouTube without installing OpenToonz! Figure 1 shows OpenToonz
    with the official scheme, which stars a dog named Dwanko.


