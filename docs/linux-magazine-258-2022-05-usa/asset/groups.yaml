    # Finding a Port Number


    Computer ports are too numerous for anyone to remember all. At best, an administrator
    might hide a few systems and registered ports. Troubleshooting and error require
    you to know which port to query. If you know at least one online circuit [1],
    it may be quick to look up ports on your system. You can use get /etc/services
    or even search for a specific service (Figure 5) using grep:


    ```

    SERVICE /etc/services

    ```


    Several results may display one, for each protocol in use:


    # Discovering Hidden Ports


    Security breaches often happen because youhide use hidden ports. You can discover
    hidden ports using the unhide utility. Two versions are available online, the
    general unhide and the more hide-tcp. Both have similar functions, but it appears
