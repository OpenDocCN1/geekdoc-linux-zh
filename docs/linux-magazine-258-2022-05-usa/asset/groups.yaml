    ## 使用 OpenToonz 动画


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_56_0.png)


    默认情况下，项目名称为 sandbox。有关启动项目的更多信息，请参阅 OpenToonz 手册 (5)。


    第一步是在 Sandbox 项目中创建一个场景。如果你以后想与合作者分享你的作品，根文件夹非常有用，无论使用何种操作系统。在 Sandbox 子文件夹中，点击文件（.tnz...），你将看到它的导出菜单。


    在调色板（Palette）窗口中，选择 Vector（矢量），然后选择 Linear Gradient（线性渐变，绿色条右侧）。你绘制的线条在点击时将变为不可，然后会被从左到右的简单渐变填充。


    绿蓝色的渐变不仅仅是为了显示水平线。在调色板窗口中，你会看到两种颜色。使用颜色选择器更改线条颜色。你可以使用 Angle（角度）参数来修正渐变的方向；例如，我需要旋转
    90 度来移动水平线的位置。


    对于天空层，选择 New Raster Layer（新建位图层）并将其编辑为层名称。然后，将颜色改为白色。


    **图 6**：Dwankwo 的配色方案。清晰的配色方案更容易绘制不同的姿态。


    OpenToonz 有三种层，每种在 X-Sheet 上以不同的颜色显示。呈黄色调的 Vector Layers（矢量层）最适合直接绘制。绿色的 Raster
    Masters（主位图）用于已扫描并需要用画笔填充的绘制。在 X-Sheet 中呈蓝色调的 Raster Layers（位图层）用于彩色背景。


    在启动屏幕上，创建一个 New frame（新帧），在 Scene name（场景名称）字段中输入你喜欢的名称，并按 Create Button（创建按钮）确认。对于你的第一个动画，创建三个层：一个用于水平且需要绘制的
    Toonz Vector Layer，一个用于云朵的 Raster Layer，以及一个用于建筑物和街道的 Raster Layer。


    对于天空和地面层，选择 Basics 房间然后选择 | New Vector Layer（新建矢量层）。如果你想给天空添加一些细节（例如云朵），在调色板窗口中，点击加号添加颜色，并使用颜色选择器更改
    new_2 的颜色。


    最后，创建一个名为 Street（街道）的矢量层。使用 Polygon tool（多边形工具）用矩形和三角形绘制山脊线。然后使用上方窗口中的 Camera
    Stand View（圆圈内的白色矩形）并用鼠标稍微缩小。视图看起来应该像图 8 一样。


    目前——与所有模拟层相比，在制作开始时定义动画电影的所有颜色对于让所有角色绘画产生效果是强制性的。图 6 显示了 Dwankwo 定义的配色方案。


    ## 绘制背景


    要绘制背景，在左侧选择 Geometry Tool（几何工具，或按 G ）。确保你在工具箱中选择了 Rectangle（矩形）并拖动鼠标绘制覆盖整个视图的矩形。使用工具箱中的
    Fill tool（填充工具，F）。


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_56_1.png)


    **图 7**：使用启动屏幕设置你的第一个项目。工具栏出现在窗口左边缘。


    ## 开始你自己的项目


    现在你已经熟悉了 OpenToonz 界面，是时候创建你的第一个动画了。如果你还没有准备好，安装并启动 OpenToonz：欢迎对话框再次出现（图 7）。OpenToonz
    管理你制作的场景和项目中使用的文件。


    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM

    ISSUE 258 MAY 2022 57


    ## 使用 OpenToonz 深度制作动画


    然后在左上角的工具栏中选择 Anime Tool（动画工具，A）。确保在查看器窗口上方的选项栏中选中了 Col2 和 Position（位置）。用鼠标指针将查看器窗口内的云层层向左移动。在
    X-Sheet 窗口的第一行，一个小小的白色关键帧将在右侧指示你已成功定义了关键帧。现在选择同一列的单元格，并用鼠标指针移动查看器窗口内的云层——这表示对齐时间。出现了一个圆点。对
    Col3 列中的街道层执行相同操作。然后点击播放窗口控制器中的播放图标，享受你的第一个简单动画。


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_57_0.png)


    图 8：查看器窗口以及带有天空、云朵、街道和天际线的相邻区域。


    幻片叠放在桌下的桌子上。仍然缺少实际的动作。所以当你看到动画时，切换位置将看到第 9 帧的图片。


    ## 云朵与景观


    当你点击图 10 中的桌子任一单元格时，Smart Fill handles（智能填充句柄）会出来：选择每列的第一个单元格以移下一行。


    动画可以通过组合多个帧来创建。图 9 仅定义了一个单帧，而帧在图 10 中被组合了一起。然而，组合帧并不会创建动画，因为单个层/幻片在桌子上没有改变其内容或位置。通过增加
    Smart Fill 句柄的帧数来尝试是有意义的。


    ## 人物与演员


    为了完成动画，你需要一个或多个包含人物、演员或机器的层——以使用行业中的动画技术。OpenToonz 提供了许多添加演员的方法。


    如果你想为真实的电影场景创建一个角色，将导出的场景导出为 GIF。然后你可以在 Gimp 中作为层打开文件，然后进行裁剪以添加演员。将结果保存为带有连续编号的透明
    PNG。


    在实践中，创建一个只有六帧的动画可能足够了。我们可以选择保持短小以说明图 10 中的控制操作。你需要的是单个幻片的至少水平位移。在 X-Sheet 窗口中向下点击第一帧的单元格；当你选择时，它将导入
    OpenToonz，选择 Level > Load... 并打开图像所在的目录。


    （此处省略大量重复文本，已根据要求清理）


