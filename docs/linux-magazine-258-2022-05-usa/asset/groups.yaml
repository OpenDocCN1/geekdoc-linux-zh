    # 在虚拟机上运行


    如果你是在虚拟机上而非单台计算机上工作，FT223H 将显示在客机计算机或宿主机上，在这种情况下，你需要在客机上查看。


    要确定 FT223H 所在的位置，请将其插入并使用终端查看所有 USB 设备。如果你没有看到名为 "Future Technology Device Instrument,
    LTD FT223H Single HS USB-UART/IO chip" 的行，那么你的 FT223H 在宿主机上。


    在 VMware 上，打开 虚拟机 > 可移动设备 > USB 串行控制器（从主机连接（断开连接））。如果你没有使用 VMware，请使用你相应的虚拟化软件。以下命令应显示
    FT223H：


    ![](img/d0fe54f1060b69f0f3f8ac0f16844891_65_0.png)


    图 3：U1、74HC02 以及与 FT223H 连接的示意图。


