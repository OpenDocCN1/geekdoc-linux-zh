    \ and more!\n\nTutorial – Paperfold 92\n\n- Siri Kemer: Paper sheets are coming\
    \ back into fashion. Linux users can turn to Inkscape and plugins as Box.py, Paperfold,\
    \ and Tabgen to create templates for 3D objects.\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_76_0.png)\n\
    \n# ELVIE\n\n| WE USE - A LOT OF FOSS LIBRARIES IN OUR CODE | YES, WE SHOULD DEFINITELY\
    \ SUPPORT ALL OF THE THIRD PARTY DEVELOPERS WE RELY ON SO MUCH | I'LL AUDIT THE\
    \ CODE TO FIND OUT WHICH LIBRARIES WE USE | DO WE REALLY NEED TO USE THE WORD\
    \ BILL? | WHY NOT JUST USE LIFF AND LIMIT IT TO THE TWO OR THREE THINGS... |\n\
    | :--- | :--- | :--- | :--- | :--- |\n| WE TO GIVE SOMETHING BACK TO THOSE PROJECTS\
    \ | | LET US CREATE A 'SOFT VERSION' OF MATERIALS! | | |\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_76_1.png)\n\
    \n![](img/d0fe54f1060b69f0f3f8ac0f16844891_76_2.png)\n\n# LINUX DOGHOUSE – A UNIVERSAL\
    \ SOFTWARE ISSUE\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_77_0.png)\n\n# MADDDOG’S\
    \ DOGHOUSE\n\nJon \"maddog\" Hall is an author, educator, computer scientist,\
    \ and free software pioneer who has been a passionate advocate for Linux, since\
    \ first met Torvalds. He serves as president of\n\nBugs and security issues are\
    \ all really to open source software, despite comments to the contrary. \n\n#\
    \ Where do they come?\n\nI do not think that the press and pundits point out that\
    \ there are bugs in FOSS. When they do show them they imply this is a problem\
    \ with FOSS and not also with closed source.\n\nThe difference between open source\
    \ (and partially free software) is that the code is exposed to many eyes and available\
    \ for patching when problem occurs. Closed source code (or source that uses open\
    \ source components) cannot be modified by the company that produced the closed\
    \ source product to get the patch, and thus the closed source company actually\
    \ produces a product for that software.\n\nThe press and pundits are insinuating\
    \ these are \"open source\" issues, and they are not.\nLet's keep them honest.\n"
  mdcn: "\n\n## MAKERSPACE OPC 统一架构\n\n逻辑完成后，点击 Deploy（部署）按钮即可让应用程序上线。可以通过 http://node-red:1880/\
