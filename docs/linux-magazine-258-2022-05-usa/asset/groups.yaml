    数字化温室气体排放的重要趋势。与此同时，技术的使用是控制我们工业部门的关键。然而，IT 开发从未从能源效率的角度来看。但构建消耗更少能量的数字系统是一个巨大的机会。为了实现这一点，可持续性原则必须进入科学课程，并在考虑
    IT 平衡时成为一部分。


