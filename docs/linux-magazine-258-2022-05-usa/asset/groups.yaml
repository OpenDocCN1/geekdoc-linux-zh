    \ `pip uninstall` 将其删除。\n\n![](img/d0fe54f1060b69f0f3f8ac0f16844891_78_0.png)\n\
    \n这就是界面工具 `eg` 登场的地方。它是免费提供的（`eg` 非常棒，尽管名字很短）。它的名字很简单，易于在你的硬盘上设置，并与匹配项绑定。`eg`\
    \ 的自描述提供了命令行工具的用法示例。我检查了它是如何工作的。\n\n## 你的需求范围\n\n`eg` 位于 `$HOME/.local/bin/python3/site-packages/`。请检查安装路径\
