    # 新闻

    Linux 新闻


    ## Dirty Pipe 可能是多年来 Linux 临的最严重的漏洞


    Dirty Pipe 的名字致敬了 2016 年发现的 Dirty Cow 漏洞，以及管道（pipeline，这是 Linux 中一种允许进程共享数据的机制）。Dirty
    Pipe 的跟踪编号为 CVE-2022-0847，它是在研究人员在排查客户 Linux 服务器上持续出现的损坏根文件（root files）时被发现的。经过数月的分析，Kellermann（来自
    Ionos 的研究人员）发现这些文件是由于 Linux 内核的一个漏洞导致的，并利用了该漏洞。在 Linux 机器上，如果拥有一个可以向 root 账户添加
    SSH 密钥的账户，那么任何不可信的用户都可以远程访问该服务器。


    同样的漏洞使得攻击者能够劫持 SUID 二进制文件来创建一个 root  shell，从而允许不可信的用户覆盖只读文件中的数据。在受漏洞机器上可以采取的其他操作还包括将
    cron 任务作为后门，或修改特权服务使用的脚本或二进制文件。


    可以在这篇红帽安全公告中了解更多关于 Dirty Pipe 的信息（https://access.redhat.com/security/vulnerabilities/RHSA-2022-002）。


    ## 一个几十年前的 Linux 后门被发现


    2013 年，在一次取证调查期间，高级安全团队 Pang Lab 发现了一个相当隐蔽的恶意软件。2016 年至 2017 年间，黑客组织 The Shadow
    Brokers 泄露了据称从方程组（Equation Group）盗取的大数据（包含指向 NSA 的链接，其中包含黑客工具和利用程序）。同时，该小组泄露了另一个数据转储，其中包含一个被方程组攻击过的服务器列表。


    根据高级安全研究团队的说法，Bvp47 被用于针对全球 47 个国家的 267 多家机构，涵盖电信、军事、高等教育、科学和经济部门。这些攻击持续了十多年，因为恶意代码的创建是为了让黑客能够对受感染设备保持长期控制。而且由于攻击使用了零日漏洞，因此没有任何防御手段。


    Pang Lab 的行动代号为“望屏行动”（Operation Telescreen），该发现的后门需要向主机发送一个检查代码才能正常运行。他们还确定 Bvp47
    是一个顶级的 APT 后门。


    至于 Bvp47 现在是否仍在使用，目前没有迹象表明情况如此。但考虑到该漏洞的性质，如果任何研究实验室发现这些泄露的文件被用来凑出更危险的恶意软件，他们也不会感到意外。


    阅读 Pang Lab 的报告以获取更多信息（https://www.pangulab.cn/en/post/the_bvp47_a_top_tier_backdoor_of_us_nsa_equation_group/）。


    每两周在您的收件箱获取最新新闻

    免费订阅 Linux Update-Update


    ## Zack 的内核新闻


    ## Git 合并“简化”建议


    Bjorn Helga 在另一个 Git 树的合并请求（merge request）中提交了 PCI 补丁。这是像 Linux 内核这样的大型项目开发过程的标准部分，而这次请求包含了数千项贡献。其理念是让一群人在给定的子项目上工作不会破坏每个人的树。通过合并请求，贡献者请求
    Linux 解决他们可能产生的更改与其他同时进入内核的其他更改之间的冲突。不，这里没什么特别的，但贡献者们确实在同一时间工作，同时又不会损害其他贡献者的利益。


    在这种情况下，他注意到后台发生了一些诡异的事情，并向他提出了一个问题。具体来说，Bjorn 和他的 PCI 随者已经从各个子项目（在他们的子项目内部）进行了一些合并，随后是
    Linux 官方仓库似乎来自同一棵树的回滚（reversion）。这并不诗意，他们只是在尝试修复问题。


    因此对于所有对象，补丁本身被回滚了。一个补丁之前被接受到树中，但回滚也是一个需要通过与其他补丁相同的过程接受的补丁——包括一个有意义的提交消息，而该补丁回滚并没有。然而，对于具有有意义提交消息的补丁来说，这种情况相对少见——开发者不想看到这整个补丁回滚的作用仅仅是撤销最近放入的内容。


    在这种情况下，Linux 指出，回滚的目的并不是因为补丁本身不好——而是专门为了在 Linux 最终将 PCI 树合并到自己的树时减少冲突。


    这有两个问题。首先，关于补丁回滚得出的自然结论是它是错误的。在这种情况下，补丁可能来自另一个树（这里就是如此——PCI 回滚了该补丁以便它可以从那里回来），Linux
    说，得出的自然结论是来自另一个树的补丁也是错误的。如果相同的补丁是错误的，那么它仍然是错误的，对吧？所以 Linux 必须修复那些最终引入树中的内容——他确实这么做了，但意义更多。


    第二个问题是，回滚和后台合并是为了解决 Linux 在针对自己的代码时会看到的冲突。Linux 称之为“纯粹的垃圾，由于这些更改，我最终‘无论如何’都完成了合并，现在
    PCI 树不是在‘走’，而是有了那个提交，好吧，我必须‘走’，所以 PCI 树有了该提交，但在新树中它被回滚了，所以我正在进行不同的更改和混乱的合并。”


    Linux 将此与开发者通过“变基”（rebase）其代码作为合并冲突的另一种方式进行了对比。在 Git 中，子项目将把主项目树的最新版本拉取到。


    '
