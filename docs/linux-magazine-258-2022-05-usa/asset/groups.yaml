    - FOSSpicks: This month Graham looks at Surge XT, Krohonite, MQTT Explorer, Mendelbauer
    v2, Simutrans, and more.

    - Tutorial — Papercraft: Papercraft is coming back into fashion. Linux users turn
    to Inkscape and use plugins as Boxes.py, Paperfold, and Tabgen to create templates
