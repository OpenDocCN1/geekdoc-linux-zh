    对 IT 行业能耗的研究，如果不观察其中最大的“罪祸首”之一——以及一个近年来呈指数级增长的问题：加密货币，将是不完整的。对于用户而言，加密货币是全球范围内高效、体面的货币，但收益是，加密货币挖掘正以惊人的速度运行。


    比特币挖掘每年消耗约 91 太瓦的电力。美国每个家庭每年用电超过 11,000 千瓦，这相当于 8500 万家庭的用量——随着比特币的普及，这个数字每年都在相当于美国所有能源增长总量的七倍。根据某项研究
    [2]，如果将挖掘比特币的总能源成本除以比特币交易的总数，那么每枚比特币的能源成本为 100 美元——终将如此。


    请记住，比特币只是许多加密技术之一。总而言之，用于加密货币挖掘的电力约占全球总用电量的一半（与华盛顿州运行所需的能量相同）。在过去的五年中，矿工数量一直在增加。然而，这种使用水平是不可持续的——特别是如果像专家预测的那样，加密货币成为主导交易货币。


    矿工执行猜测哈希值的任务，以验证区块并确保区块可以添加到链中。比特币和其他其他领先加密货币使用的方法是工作量证明（Proof of Work）。在工作量证明场景下，矿工们相互竞争以获得正确答案。新区块的当前奖励是
    6.25 BTC（比特币）。获得第一个奖励的人意义重大（超过 226,000 美元），尽管矿工们经常聚集在一起分工并平分奖金。获得首名的激励很大，这导致了对更强大计算机系统的竞争。


    比特币算法中内置的另一个特性是，随着挖掘比特币的计算机变得越来越困难，用于挖掘区块的解谜题解决得越来越快。这种难度进一步扩大了硬件和电力使用之间的差距。


    比特币的另一个价值在于它为更强大的系统提供了巨大的激励。由于比特币发明者中本聪（Satoshi Nakamoto）创建了 2100 万单位的上限，以使货币具有稀缺性，而这种稀缺性和目前对比特币的需求创造了无限的供应。这种稀缺性，中本在发明该系统时可能从未想象过。在创建
    200,000 个区块之后（约相当于四年），奖励的比特币数量逐年下降，而等值于美元的奖励则随着比特币价格的飙升而爆炸式增长。


    # 问题在哪里？


    区块链技术通过构建区块（交易组）到链（所有区块的完整轨迹，记录了自货币诞生以来的所有交易）。区块通过图形哈希值进行存储和相互连接。细节非常复杂，但为了讨论之目的，被称为
    bitcoin 的计算机设备


    # 加密货币挖掘的影响


    奖励减半意味着挖掘比特币的最佳时机是现在，而不是以后，这只会加剧目前的狂热。在下一次减半时，将需要更多硬件才能生存，矿工将试图尽可能挖掘以影响整体趋势，从而引导加密货币挖掘的能源消耗。


    为了保持竞争力，公司必须招募最新、最快的硬件以跟上。另一个影响是，由于挖掘比特币的计算机正在不断淘汰。


    '
