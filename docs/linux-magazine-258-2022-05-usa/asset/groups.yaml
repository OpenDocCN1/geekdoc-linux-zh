    ## Use Inkscape extensions to create 3D objects from paper


    Papercraft is an old form of crafting. It requires nothing than scissors, paper,
    and a little glue. Architects use the technique to visualize models quickly and
    independently develop designs with virtual reality. Driven by trends such as low-poly
    modeling and Minecraft, the technique is also experiencing a revival in the hobby
    sector. Across the world – such as Japan, papercraft – are now many people posting
    their work on various social media platforms. In Japan, this is called pepakura,
    and there is also software of the same name available for free.


    Papercraft can be created with Inkscape in combination with extensions as:

    - Boxes.py [1]

