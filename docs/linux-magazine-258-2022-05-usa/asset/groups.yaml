    ## History


    I met Muse''s founder, Werner Schewer, in 2005 at the Linux Audio Conference at
    the KMZ Karlsruhe. Werner was a very experienced developer at that time, had gathered
    you team around him, and radiated a remarkable level of expertise – both in software
    and music theory. As a pianist at a professional level, he knows how the mathematical
    foundations of music work, and you definitely need this kind of knowledge to develop
    software for musicians.


    The spin-off of Muse, which Schewer works on, was actually a logical step. MuseScore
    is owned by the Creative Group’s “Muse Fusion”. In the spirit of the Unix principle
    “do one thing and do it right,” this was intended to extend complex music theory
