    any name you want), which can be directly imported as a plain spreadsheet.


    # ### Plan


    I''ll use two tools from LibreOffice integrated to create my music database: LibreOffice
    Calc (spreadsheet) and LibreOffice Base (management). With these two applications
    plus iTunes, the general process is as follows:


    +   - Export from iTunes as a tab-separated text file.

    - Import into Calc for minor edits.

    - Copy modified library into LibreOffice Base.

    - Create SQL queries.

    - Run queries and filters to display results.


    Of course, you can import data for other types of data. For instance, you could
    organize a stamp collection or track incoming invoices for this year''s taxes.


