    # LINUX 之声教程 – 纸模型


    ## 使用 Inkscape 扩展从纸张创建 3D 对象


    纸模型是一种古老的工艺形式。它只需要剪刀、纸和一点胶水。建筑师们使用这种技术快速视觉化模型，并利用虚拟现实独立开发设计。在低多形建模和 Minecraft
    等趋势的推动下，这种技术在爱好者领域也经历着复兴。在全球范围内——例如日本——现在有许多人在各种社交媒体平台上发布他们的作品。在日本，这被称为 pepakura（纸模型），并且也有同名的软件免费提供。


    可以使用 Inkscape 结合扩展创建纸模型，如下：

    - Boxes.py [1]

    - Quickfold [2]

    - Lasercut-box [3]

    - Papercraft [4]

    - Joinery [5]

    - Tabgen [6]


    ## 不仅仅是盒子


    Boxes.py 非常有趣，特别是因为它带有很多预定义的对象，而不仅仅是简单的盒子。但具有类似特征的更复杂的设计也需要 Boxes.py，你只需要根据需要对其进行调整。Pepakura
    和其他用于此类工作的软件仅适用于 Windows，这迫使 Linux 用户寻找其他方法将它们纳入工作流。


    将对象展开并将单个侧面显示为面也是所有工艺的基础——它们通常对节点有不同的定义。设计 3D 对象的自由软件世界中的其中一个选项是 Blender。当然，它的功能远超完成任务所需的。对于纸模型，3D
    对象也需要展开。这一步由平化器（flattener）处理，Blender 有一个插件可以处理。


    如果你玩过原版，玩法会很熟悉。在进入游戏之前，会详细介绍各种角色，并配有卡通风格的图形。玩家可以根据意愿选择任意数量具有能力的角色，你的任务保持不变——在穿越每个区域时尽可能收集金环。你仍然需要像原版一样应对所有的敌人、挑战和障碍，现在有了向各个方向移动的能力。虽然这对于两种不同的游戏风格来说可能显得不自然，但《索尼机器人大爆发
