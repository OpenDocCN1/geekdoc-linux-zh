    package. The template processor handles an image of photos floats, and the \caption
    command follows the path to the first line in text. LaTeX then reserves the space
    used by the image. The PDF driver sets the photo after scaling in to required
    size.


    For photos that need to stand out in a big way, Listing 7 shows a template for
    a full-page photo with a caption underneath, as on page 3 of the included chapter.
    The \graphicx reserves space for an image in the layout. Floating helps the area
    vertically where there is still room on the page area above the caption. Listing
    7 sets the text below the photo half with a centered image.


    # Floating in the Center


    Listing 5 shows you a template for an image with an empty caption, centered text
    module. The template replaces the caption placeholder with the value contained
    in the ERB file. The text in the line is centered horizontally. Listing uses \vspace
    to set a fill space above it, while the lines have the same thickness. The text
    below only equal empty areas in the lines of the rules face alignment, the text
    ends up at the edge by ways, the distance between paragraphs is ignored without
    the top of the page, which somewhat surprisingly would make the chapter heading
    float to the top of the page.


    # Two Towers


    If you want to lay out two photos in portrait format size as on one page of a
    book in landscape, use the twos.tex template. Listing 8 shows a template for two
    images in portrait format. The template references photos passed in parameters
    as $photo-1$ and $photo-2$. Listing 4 shows the photo on the page of the book
    format. Figure 2 are two images, the first one a photo of a bread roll today,
    the second one of San Francisco; its mirrored counterpart was created by the ImageMagick
    verb''s free-tool-option.


