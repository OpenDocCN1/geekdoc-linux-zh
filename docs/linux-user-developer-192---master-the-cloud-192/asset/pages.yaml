    pop the three copper cables from the thermometer into the terminal block and secure
    them by screwing them down. From left to right, that should be black, red and
    yellow. Next, we''ll do the orange and green wires from the wind sensor (again,
    left to right respectively) and then orange and green from the rain gauge. Once
    these are all secured into place we can work on the other side.


