  md: '# Program the LCD


    nAt this point you should have the dispensing mechanism mostly complete, running
    down a column in the middle of the machine. Now it is time to add user feedback
    and input. The machine should be able to tell the user: the state of the machine,
    if login was successful, and if or not to give them. You can do this easily with
    an LCD display.


    In the Arduino sketch, add a line at the top of the code to access the LCD library
    and another line to initialise the LCD object:


    ```

    #include <LiquidCrystal.h>

    LiquidCrystal lcd(RS, E, D5, D6, D7, D8);

    ```


    In the snippet of above connect the LCD which need to be connected to the Arduino''s
    digital pins. The RW (read/write), VO (contrast) and VSS (ground) should be connected
    to GND and the DV (5V) should be connected to a digital pin in HIGH (the SPI pin
    has been used by the motor).


    In the setup() function, you must then initialise the LCD and set the number of
    columns and rows on the display


    ```

    lcd.begin(cols, rows);

    ```


    At the very top of loop(), where the Arduino is waiting for an RFID card to read,
    you can write a message to the display, telling the user that the machine is being
    used. Set the cursor to your desired position and write a string to the:


    ```

    lcd.setCursor(col, row);

    lcd.print("Ready to read");

    ```


    Throughout the rest of loop() you can then add messages displaying the user''s
    account balance (if the provided by RaspiPay), or a message "not enough coins.
    No more coffee allowed",


    # Attach the display


    Having programmed the LCD, it''s time to attach it to the machine. With the way
    it might, it might be good idea to have a service door built into the back. You
    will also need to keep a way to access or add replace parts,


    This point is relevant now, where you''re going to have to cut a hole on the side
    of the frame. With the LCD knife and a pair of screws, in the front of the box
    that is exactly the same width and slightly smaller than the LCD display. The
    hole should be


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_42_0.png)


    somewhere to the side of the middle column or below. You should then be able to
    position the screen outside the frame. The circuit board, which is the LCD is
    mounted to, use tape to fix it to the inside and pressing against the frame. Make
    sure it is fixed in place - until enough. As you are using Arduino, the LCD connects
    to the corresponding digital pins.


    Above the RFID

    reader can be

    positioned as far

    5cm away from the

    surface of the case


    # Add the card reader


    Back to where all you need to remind the RFID reader. Using jumper wires, connect
    the RFID terminals to the SPI (serial peripheral) interface. There is no need
    for a breadboard. As discussed in LU18, one of the Arduino SPI modules are connected
    to digital pins 11-13 as shown in here: MISO, MOSI, SCK and SS with reset to 54.
    You will also need to use the 3.3V connection to the Arduino and connect GND to
    the ground pin on the Arduino.


    Fix the RFID to the front of the board and stick it inside. The reader can communicate
    with others over a distance and this is possible through cardboard and plastic.
    It will be harder to communicate through conductive materials such as metal, by
    electromagnetic blocks.


    If it is mounted mounted weirdly, you can move it around across the frame of the
    machine or use the motor to spin around and the LCD to update its message. All
    that left is to add a cover to the top of the coffee pots and indicate, with some
    sort of graph, where on the box people show their cards.


    This is clearly only version one. Before using your new coffee machine, or once
    you have used some feedback, you might want to improve the design and make a machine
    of sturdy stuff.


    With a small amount of work, 3D printing or other techniques, a solid machine
    could be built last and serve your co-workers for years.


