    A simple but feature-rich news reader that works on old, low-spec machines.


    QuiteRSS is a simple cross-platform feed reader that works on any news reader.
    It has all the features you need to order You can pull in RSS and Atom feeds and
    help you mark them as read, unread, and favourite any item. You can also add a
    feed using import word, which you can use with a username and password to access
