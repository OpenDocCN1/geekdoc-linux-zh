    # ## Universal Media Server 7.0.1


    # Stream all types of media over your network


    With Universal Media Server (UMS) you can stream kinds of media from your Linux
    computer via Universal Plug and Play (UPnP) to any DLNA-compliant device. DLNA
    is an implementation of the UPnP protocol that handles sharing of digital content.
    It includes photos, photos, and other TV content from popular brands such as LG,
    Philips, Sony, Samsung and more. UMS uses FFMpeg, Mincoder and media server. It
    is written in Java, so you will need to fetch OpenJDK from your distribution''s
    repositories. Then download and extract the tar from UMS''s website and launch
    the server. It will be taken through a small setup on the first run.


    UMS is straightforward to configure thanks to the multi-radius graphical interface.
    UMS detects and all compatible lists from the server you scan. You can then connect
    to any of these devices and stream content. In addition to DLNA/UPnP compatibility,
    it supports other media players including VLC Media Player, Banshee and Kodi;
    all players should be able to detect the UMS.

    You can also use the BubbleUPnP app to transform your Android smartphone and tablet
