  md: '# Python: Jupyter Notebooks


    # Jupyter Notebooks:

    Speed up your code


    Learn how use the tools available to squeeze

    e last bit of performance out of your code


    As a prominent language in the open source community, Python has many options
    available when it comes to code development. These Range from early-stage experiments
    to complete IDEs such as PyCharm. Many people actually find themselves between
    these two extremes in terms of coding needs. This is where Jupyter Notebooks have
    a real edge in data science and disciplines.


    The first step is to be sure that you have the latest version of Jupyter installed.
    Jupyter is under constant development, so there are always new tools available.
    You will need to have Python and pip installed. Assuming this you have the latest
    version of Jupyter with the following command:


    ```

    pip install --upgrade jupyter

    ```


    This will install the latest version of Jupyter and its dependencies into the
    user site library on your system.


    # Starting Jupyter


    There are a lot of options when you run Jupyter. There are a lot of options out
    of it, you may want to dig into the details. You can see all of the options available
    with the following command:


    ```

    Jupyter notebook --help-all | less

    ```


    You will see several pages of options available


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_47_0.png)


    Above Jupyter Notebooks have an extremely popular way of using'
