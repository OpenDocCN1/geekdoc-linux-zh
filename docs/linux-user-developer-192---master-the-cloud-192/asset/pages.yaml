    To close the view, press q


    # A branch is a particular strand of work which off from the main, ''master''


    We are currently in ''DETACHED HEAD'' mode. This means that our commit is not
    a master branch: if we switch back to the master branch with git checkout, there
    would be no reference to this commit, and it would be impossible to access it
    again (the garbage collector will eventually remove it). Since we would like to
    come back to this commit later, turn it into a branch using the following command:


    ```

    $ git checkout -b friendly-git

    Switched to branch ''friendly-git''

    ```


    All this gives is a name to the commit that we are currently on. Now that we have
