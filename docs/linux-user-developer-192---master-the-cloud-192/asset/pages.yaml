    We'll get the rain gauge triggered by the sensor activating, and run the run function\
    \ to monitor the amount of rain and report it to the user:\n\n```\nraindata =\
    \ threading.Thread(name='rain',\nraindata.start())\nrain_sensor.activated = rain\n\
    ```\n\n# 10 Global constants\n\nNext, we'll set up some variables to have to remember\
