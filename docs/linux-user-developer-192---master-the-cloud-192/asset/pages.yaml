    card and then pass the data to a Raspberry Pi so we could identify. If a user
    had enough money on their account, Pi would send a return message, telling the
    Arduino to give out a coffee pod.


    The design we opted for was gravity-assisted rotational dispenser; the coffee
    pods still fall through


