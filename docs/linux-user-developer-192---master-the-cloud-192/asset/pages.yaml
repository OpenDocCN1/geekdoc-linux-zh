  md: '# Lubuntu: the feud flavour


    The lawyers come out as the Ubuntu development team faces off with an Asian-based
    FOSS initiative that doesn’t want to fork


    ubuntu, the popular official Ubuntu ‘flavour’, is embroiled in a legal spat over
    trademark and GPL infringements, and website demands. Signs of infringement claim
    when the co-founder of FOSSA (https://fosssia.org), tweeted: ''Is making donation
    for an act @Copyright a @FOSSIA violation?'' FOSSA Ubuntu @Hub shutdown because
    of Creative Commons license. Is it possible? @DMCA


    FOSSA develops open source projects in Asia and runs community events in Cambodia,
    Singapore and Vietnam. After Ubuntu unexpectedly closed lubuntu-dev, a FOSSA-run
    project resulted in a DMCA takedown from Walter Lapiski, the lead of Ubuntu and
    Ubuntu board. In history, he claimed the repo with a GPL license and, second,
    they infringed a trademark


    that Canonical Limited for Ubuntu “in word and logo form” (You can see the full
    notice at https://bit.ly/lubuntuDMCA). We contacted Simon Quigley, Lubuntu’s release
    manager, for clarification and it transpires the dispute has been brewing for
    many years and includes an issue with the website lubuntu.net.


    To understand this, you have to step back to 2009, when the Lubuntu project launched
    by Mario


    > official site of the Lubuntu development team


    Beiling and Julien Laverge, say Quigley, ‘Julien is still (semi), but active’,
    although Beiling hasn’t been involved since 2010 or 2011; he still retains ownership
    of the domain. For the last few years, he did not receive the domain, say Quigley.


    FOSSA, it turns was not, found by Dan Yong, but also by Mario Beiling, founder
    of Lubuntu. We have a slightly different story. He says he has even ‘access to
    different contributors to lubuntu.net. Some says, ‘we were not comfortable using
    the old-desktop system and some posts did not meet quality requirements’


    Beiling is working on the Lubuntu distribution, focusing on a ubuntu system called
    Melex, which he tells, will still be able to develop ubuntu themselves. This will
    bring us back to the origins of the distribution as a community distribution.
    This would appear to be what he wants to achieve with the Lubuntu name and website.


    The argument is from as over, as we received a lengthy response from Dan and although
    Canonical was unprepared to combat this, for now it’s clear that Lubuntu and Canonical
    will be in exercising their legal rights.


    As it stands lubuntu.me is the official site of the Lubuntu development team,
    as you can see from the screenshots below, it’s really not clear. For further
