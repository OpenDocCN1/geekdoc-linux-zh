  md: '# Review Password managers


    # Bitwarden


    A feature-rich app that works across many platforms and devices


    # KeePassXC


    This continuation of the open source stalwart doesn''t disappoint


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_81_0.png)


    +   - If you find yourself without any of your devices with Bitwarden, you can
    access your login credentials from its web interface


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_81_1.png)


    +   - If you''re new to KeePassXC, flip through the project''s quick-start guide
    to use it with the app


    # Security encryption


    The app ends-to-end encryption and uses AES 256-bit as well as PBKDF2 to secure
    your data. Bitwarden also hashes and salts your master password before it is transmitted
    to the server. You can also use two-factor authentication via authenticator apps
    as Google Authenticator.


    # Security encryption


    KeePassXC gives you the choice of AES-256, Twofish and ChaCha20 algorithms to
    encrypt your password database. It also allows you to use a master password to
    secure your data. It''s unique using YubiKey''s challenge-response support for
    additional security.


    # Password management


    Bitwarden stores your encrypted passwords in Microsoft Azure cloud. Unlike some
    of its peers, it doesn''t allow you to create multiple vaults, but you can create
    multiple folders that contain different entries. You can also mark them as favourites,
    for those you visit frequently. You can also search for entries using URL or username.


    # Password management


    KeePassXC enables you to create multiple password databases, and features the
    ability to add and set expiry dates for passwords, while using custom icons for
    entries. You can connect the application to your browser extension easily. Beyond
    supplying passwords, KeePassXC can also feed passwords to your ssh agents.


    # Interface


    The desktop app and the web browser have a clean interface and are intuitive to
    use and operate. Both apps allow you to edit and modify details, create complex
    passwords, use two-factor authentication and configure the settings of the app
    well.


    # Interface


    Neither is as intuitive as the others on test but here might seem confusing to
    first time users, the simple steps required to keep it going. The app offers plenty
    of touch functionality that might overwhelm, and a fairly brings the doc down.


    # Features


    The app imports passwords from two different sources, including several web browsers.
    It has several useful usability features; for example, you can import the login
    details for the account open if you have a corresponding entry in the vault. Bitwarden
    provides apps for Android and iOS, as well as a web-based import from it.


    # Features


    You can use KeePass to authenticate SSH sessions. The manager also supports KeePassXC
    challenge-response key generation and can generate Time-based One-Time Passwords.
    There''s also a password and passphrase generator, which provides an option to
    automatically fill in forms, as long as they are in CSV format.


    # Overall


    Bitwarden scores highly on every front. It has impeccable security credentials,
    and uses cloud-storage to the help by enabling you to manage passwords across
    platforms and devices.


    # Overall


    KeePassXC delivers on all promises and is a welcome addition to users familiar
    with KeePassXC. But new users will have trouble navigating the interface and the
    browser extension.'
