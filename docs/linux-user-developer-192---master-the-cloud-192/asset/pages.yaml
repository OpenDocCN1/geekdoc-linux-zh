    # Create the basket


    Now you''ve constructed a way of dispersing the coffee with the help of gravity,
    it is time to catch the falling pods. The obvious way of doing this is to build
    a chute at the bottom of the container, which the pod can fall down. However,
    if your construction is as poor as yours, the pods will fall out of the metal
    container. If you had a chance, the good pod would be much easier and entirely
    to be inside of the machine.


    The effective way of making everything is to use cardboard. The frame of the basket
    can be securely mounted to the motor''s shaft - this is exactly what you would
    do if you have frame materials. Cardboard is sturdy but can be somewhat unstable
    without good workmanship. However, you''re going to need inside elements to hold
