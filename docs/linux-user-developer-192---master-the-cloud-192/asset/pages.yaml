    # Keep it secure


    The advantages of running your own cloud server are clear: control of your data,
    as much storage as you want to plus local access and — but what of the disadvantages?
    The main disadvantage of running your own cloud server, is that you have to maintain
    it yourself.


    We''ve installed Nextcloud in the web server''s Document root, which is for a
    local installation but not if you want a accessible server. In that case you would
    want a separate cloud database at cloud.example.com, for instance. If you are
    allowing access to this from outside of your local network you are strongly advised
    to use SSL connections.


    > QUICK TIP


    If you are concerned about users consuming all your storage space set quotas per
    user to ensure there is enough space for real work.


