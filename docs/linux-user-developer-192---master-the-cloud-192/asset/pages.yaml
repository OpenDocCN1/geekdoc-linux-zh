    \ activate them at such time:\n\n```\nsensor = WithSensor()\nwind_sensor = DigitalInputDevice(17,\
    \ np_true)\nrain_sensor = DigitalInputDevice(27, np_true)\n```\n\n# 08 Pre-programming\
    \ Pi setup\n\nNow we have one more step before we can take into our code. Run\
    \ sudo /etc/boot and add the following line at end:\n\n```\ndtoverlay=w1-gpiopin4\n\
