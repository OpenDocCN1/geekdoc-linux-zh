  md: '# BACKUP UTILITY


    # BorgBackup 1.0.12


    Create and manage your backups with the CLI


    Just like music players, Linux has a long list of backup utilities as the rest.
    What sets Borg apart from the rest is its efficient execution of backup. Based
    on LZ4, zlib or any other algorithm provides a host of useful features, such as
    incremental backups and encryption using the 256-bit algorithm. You can further
    compress backups and even lock them with password.


    remote connections, Borg distinguishes itself in the way it implements chunks,
    making them more visible and easier to track. Because of this many admins see
    Borg as a modern reinvention of classic backup tools. Borg performs deduplication
    to reduce the size of your backups. Its efficiency comes from the way it splits
    files into variable-length chunks in order to deduplicate files that haven''t
    been modified.


    Another interesting offers by the app is its ability to run remotely. You can
    easily mount Borg-created backups as volumes that can then be accessed using any
    file manager. Other backup utilities can also recognize incremental backups without


    You can install it from the Python package, or simply download the binary from
    its homepage. Since it''s a CLI utility, you''ll need to read through your documentation
    before installing it to handle your data.


    +   * Pros A feature-rich utility that is quite efficient and works well under
    numerous computers.


    +   * Cons It''s a CLI tool so you will need to peruse through its documentation
    before using.


    +   * Great for... Regularly backing up a large number of files efficiently if
    you don''t mind wrenching with the command line. www.borgbackup.org


