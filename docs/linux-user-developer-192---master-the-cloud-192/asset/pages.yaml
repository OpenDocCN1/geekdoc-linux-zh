  md: '# OpenSource Your source of Linux news & views


    # INTERVIEW NGINX

    NGINX: Changing direction


    The ''bump in the wire'' by the majority of websites as reverse proxy has big
    ambitions. We spoke to NGINX at Kubernetes about its vision


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_11_0.png)


    NGINX is a household name in open source. It was first released 13 years ago as
    a server and can also be used as a reverse proxy, load balancer and HTTP cache.
    To Owen Garrett, NGINX''s head of Products, at the Kubernetes + CloudNativeCon,
    he is in software engineering for 15 years and wants to lead cloud networking
    business, so we asked what he was happening in the industry and NGINX had to the
    offer.


    SSL decryption and authentication, so your web server, your web application doesn''t
