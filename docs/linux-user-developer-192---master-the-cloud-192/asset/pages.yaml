  md: '# Master the Cloud


    # # Serverless


    > QUICK TIP

    Try serverless at the edge

    Lambda on AWS Cloudfront and Cloudflare. Working on the Cloudflare platform enables
    you to write code before it reaches the core infrastructure.


    Deploy the code in cloud without worrying about instances


    Developers want to write code. They don''t want to spend time setting up servers.
    These two reasons why the serverless movement has exploded, particularly over
    the last year. The first is to understand that serverless, of course, isn''t just
    about having code somewhere—but with serverless, developers don''t need to worry
    about such things. Capacity is automatically managed by the cloud provider as
    needed.


    > QUICK GUIDE

    Create a Google Cloud Function


    The serverless revolution really started with the release of AWS Lambda, which
    coined the term ''FaaS''. Soon followed similar services from other providers,
    including Microsoft Azure Functions and Google Clouds. While the selling point
    of serverless is to make it rapid move from development to deployment without
    the need to provision, maintain and maintain scalability; if you need to run thousands
    of concurrent serverless functions, cloud providers offer pay-per-use-second billing;
    you only pay for the time your code is running. In short, serverless gives you
    ultimate flexibility.


    Google Cloud Platform provides an accessible interface for creating Cloud Functions
    for the first time. The console, available via your account, a provided URI, for
    a HTTP endpoint, an inline editor for your code also has settings for timeout
    and memory requirements. After specifying an entry point to the provided node,
    simply creating a function is a great demonstration of how powerful serverless
    is—minimum effort for a full (beta) costly deployment!


    It''s important to note that there are downsides to using serverless. Although
    functions execute very quickly, there is latency on initial start-up, as a server
    will ''spin down'' when it is not in use.


    all use cases, but it is something that needs to be considered. Serverless functions
    are well suited to operations that take a very short time to complete and are
    not resource-intensive. For long execution time and memory limits which might
    fail if the workload is long-running, a conventional server model might be more
    appropriate. Debugging and monitoring can be harder than in serverless environments.
    Because code is executed in a ''black box'' in the cloud, and tools such as AWS
    X-Ray become more important than ever.


    # HOW TO

    Install and try serverless framework


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_23_0.png)


