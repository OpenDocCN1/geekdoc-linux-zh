    The changes that we made in the last issue were all identical, and incremental,
    building on the previous piece of work. Git actually supports a tree of changes.
    If we go back to a previous version of the repository and then create new commits,
    we create a new branch.


    First, let''s go back in time. Running the following command to reset the code
    to the version we looked at 1.9.2.


    ```

    $ git checkout v1.9.2

    ```


    Here, v1.9.2 is a branch name. Every commit has its own identifier, this is usually
    a complicated hash code. When we need a repository, we run `git checkout -b new-name`
    to create a new branch. Git develops history every time we branch out a new release,
    and v1.9.2 is the name of the branch corresponding to that release.


    If we have a fork node now, we see that its contents have changed. Version 1.9.2
    is quite old, and it is missing a few features from the current version.


    Exploring the code, we realize that something is missing: Git does not provide
    the user with a friendly message when it should. So, we will fix the file git.c
    in an editor and add the following code at line 555 (which is currently empty).


    ```

    printf("the amazing \Git\nversion control system!\n");

    ```


    We''re not going to compile this code, so don''t worry about correctness. Now
    we''ve made a change, let''s commit it with `git commit -a` that adds all modified
    files to the commit.


    Notice that we have made changes to the old version of Git, this most commit is
    not part of the linear development of the project (the master branch), but on
    a separate branch. We can see this clearly by running the following command:


    ```

    $ git log --graph --all

    ```


    This command will produce a graph similar to the one shown in Figure 1. Each asterisk
    `*` in the graph corresponds to a commit, and the vertical lines show which commits
    are modifications of others. In our case, since the most recent commit is a modification
