  md: '# Jupyter notebook --browser


    that will give you control over almost every aspect of the Jupyter server process.
    For the rest of this article, we assume you''re running Jupyter on the same machine
    as you''re running your browser. With this, you can start Jupyter with the following
    options:


    For many cases, this will work fine. There are options that you can use to help-tune
    the server if you''re not getting the performance you need. For example, the *NotebookApp*,
    `jupyter notebook --port=8888` and maximum output data rate. There are also options
    that allow you to change the class that is used to particular objects in the backend.
    Tuning requires a bit of experimentation, in order to find the parameters that
    work best in your particular case. Once you have started Jupyter, you''ll get
    a link in the console. This is one level of security to make it a bit harder just
    to connect to your Jupyter server. You can copy and paste this link to apply it
    in your browser.


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_48_0.png)


    # Along with keyboard shortcuts, ''magic commands'' within the underlying IPython


    # Jupyter shortcuts


    Now that Jupyter is running, how can you make the best of your time? The first
    shortcut is Ctrl+Shift. This pulls the command palette, which includes all the
    commands available in your Jupyter Notebook. This is also a great place to search
    if you have an idea of what you want but don''t remember the command to name.


    In Notebook, there''s a command mode and edit mode. Press E to enter edit mode.
    You can navigate cells using the arrow keys, as well as create new cells, change
    the cell type or delete cells. From edit mode — is where you are writing, Shift+Tab
    pops up with the docstring for the object type you are currently using. You can
    also get help with objects through different types of documentation.


    Along with these keyboard shortcuts, Jupyter Notebook introduces the ''magic commands''
    from the underlying IPython. These magic commands are powerful tools that allow
    you to develop your code


    # Run benchmarks


    With all optimizations, the first step needs to be some benchmarking. This is
    because humans are notoriously bad at deciding what parts of code actually need
    to be optimized. You should see what parts exist within the current session. Using
    the %ls command to see a list of everything that has been created, you can dive
    into the details of objects using the %info command.


    More interesting are the magic commands timing how long code takes. This is really
    the focus for many of us who use Jupyter. You can use the %time and %timeit commands
    to time how long it takes to execute a single line of code. The first command
    gives you a basic visual display of the time, but you can specify parameters such
    as how many times to repeat the code. For example, timing the Benchmark on my
    system gives the following:


    ```

    # In math import exp

    %timeit exp(log(part(1)))

    1.26 μs ± 3.45 ns per loop (mean ± std.dev. of 7 runs, 100000 loops each)

    ```


    This is pretty rare in everyday usage, however more likely you have a whole chunk
    of code that needs to be timed. In these cases, the question should be


    Above The %time and %timeit commands run your code several seconds to try to get
    an average run per execution


    If you need more speed you can use Python from your Jupyter Notebook. It is installed,
    you can use more control over your code using %load ext.


    Then you get the magic commands, %cython %python_inline and %python_import to
    help speed up your Notebooks.'
