  md: "# Null safety\n\nOne useful feature of Kotlin is null safety. In many languages,\
    \ including Java, variables can take a special value which indicates that they\
    \ may be null. This is prone to errors, particularly trying to call a method on\
    \ a null object raises exceptions. However languages have evolved many ways of\
    \ getting around this and Kotlin is one of them, making code much safer.\n\nBy\
    \ default, variables in Kotlin cannot be null. If you want to make a variable\
    \ nullable, you must do it by adding a question mark to the original type. For\
    \ example, `var x: Int? = null` is permitted in Kotlin, but `var y: Int = null`\
    \ is subject to additional restrictions: you cannot call methods on it unless\
    \ you use, for example, a statement to check it is not equal to null.\n\nAn alternative\
    \ is to use the `?.` operator, which allows us to call methods on null objects\
    \ without checking them first. If the object is null, the expression returns null.\
    \ This simplifies code: if we have a variable `a: String?`, then we only need\
    \ to use `a?.length()` instead of checking for null at every step.\n\nCheck the\
    \ Kotlin documentation for more null safety tricks, including the `?:` operator.\
    \ If it doesn't make any sense, turn your head to the left...\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_56_0.png)\n\
