    installed. Ensure you have Node installed using node -v and that you have npm
    installed with the command npm install serverless -g.


    +   2. Log in to your account

    After the framework is installed, you''ll need to authenticate against the serverless
    online platform to allow your applications to be deployed. Use the command serverless
    login with your GitHub credentials in your web browser.


    +   3. Create the serverless function

    The next step of the process is to create the serverless function itself. Using
    the command serverless create --hello-world a basic function. A number of templates
    are included for you; list them with serverless create --help.'
