  md: '# Essential Linux


    PART TWO


    # Git: Version control and working with branches


    Get to know how to work with branches in Git, and learn to make your own changes
    to real projects


    The main purpose of Git is collaboration on large software projects, particularly
    open ones. It is possible with Git to have collaborators working on the same branch
    at the same time, and it might take a little bit of effort to reconcile changes
    from different people. However, the power of Git is that you are able to work
    on the whole project without affecting others. In order to do this, it makes sense
    to keep track of changes from different people, so that you get a full picture
    of the changes that have been made.


    and make new changes to it, before redefining the merge. Another benefit of branches
    is that they enable us to ''package'' a collection of changes and present them
    to other contributors of the project, who may have their own views on it. The
    process of this is known as a pull request.


    This is where branches come in. A branch is a particular strand of work that may
    fork off the main, master branch. You can make changes and merge them back into
    the master, but they are still kept in the repository, so you can go back and
    look at them later. We can even go back in time to a particular branch


    # Checking out branches


    In this tutorial, we''re going to work with the source code for Git itself. Git''s
    code is hosted by GitHub at https://github.com/git/git, so in order to get a copy
    of the repository, we will run the pull command.


    ```

    $ git clone https://github.com/git/git

    ```


    This creates a new directory, containing the source code, and now we are going
    to explore what''s inside.


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_35_0.png)


    Above To contribute to a codebase, we first ''fork'' the existing repository to
    create a new one where we can push our changes. We make our changes and push them
    to fork. Lastly, we send a new ''pull request'' back to the original repository'
