    # Add some more users


    Now add some users in Nextcloud. While you set their password initially they can
    change it once they are logged in for security reasons. Users can also be added
    to groups, and new groups created, to make sharing and communicating effectively.


    # Add some files


    You can upload files directly from the web interface, or use sync clients to transfer
    files directly from your devices. The project on the server shows some of the
    options for sharing items with other users.


    # Add some apps


    Nextcloud includes many apps that you can add for extra functionality. Apps are
    enabled and disabled in, but configuration is done in Settings, with options appearing
    when an app is enabled.'
