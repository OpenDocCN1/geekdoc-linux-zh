  md: "# Tutorial Kotlin: Introduction\n\n```\n$ java Greeting\nHello, world!\n```\n\
    \n# ## Use class properties\n\nThe special functions printing out the same greeting\
    \ each every time, we might want to pass a value to the constructor of the Greeting\
    \ class. We can do this in the following way:\n\n```\nclass Greeting(val name:\
    \ String) {\n    fun greeting() {\n        print(name)\n    }\n}\n```\n\nWhen\
    \ we create a Greeting object, we need to pass a string to the constructor: \n\
    \n# ## Greeting(\"Welcome to Kotlin!\").greet()\n\nIn addition to members, a Kotlin\
    \ class can have properties. Property is a generalisation of the concept in Java:\
    \ it is a value that can be read from, and written to.\n\nIn Java if you write\
    \ a field, it is usual to declare it as private like this:\n\n```\nprivate String\
    \ name;\n```\n\nWe write methods to get the value of the field:\n\n```\n## public\
    \ String getName() {\n    return name;\n}\n```\n\nand to set the value of the\
    \ field:\n\n```\n## public void setName(String name) {\n    this.name = name;\n\
    }\n```\n\nThis introduces a lot of boilerplate. In Kotlin, by contrast, properties\
    \ of a class are always available. For example, the Kotlin version of the Java\
    \ above is much more concise:\n\n```\n## class NamedThing(name: String) {\n  \
    \  var name = name\n}\n```\n\nProperties are declared using the keyword val or\
    \ var. val means the property can only be read from and not written to, while\
    \ var means that the property can be read from and written to. Note that properties\
    \ can be changed by changing their values; they are assigned in the constructor.\n\
    \nAn shorter version of the code above is:\n\n```\n## class NamedThing(var name:\
    \ String)\n```\n\nHere, using var before the name of the parameter\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_53_0.png)\n\
    \n# ## Kotlin conventions\n\nThe special functions () and that we meet in this\
    \ example are one example of conventions in Kotlin. They are like operator overload\
    \ but assign any particular construct to a particular function.\n\nFor example,\
    \ we use a function called plus() that takes two arguments and returns a value,\
    \ instead of operator overload in C++. Other conventions are more sophisticated.\
    \ In C++, we can use the operators > and so on, but we have to write them individually\
    \ if they all call a helper function to write a lot of boilerplate. In Kotlin,\
    \ on the other hand, a class has a compareTo method that returns a positive integer\
    \ if it is larger than the second, zero if they are equal, or a negative integer\
    \ if it is larger. We can then use comparison operators without having to write\
    \ any more code.\n\nSome conventions are similar to those in Java or C++. For\
    \ instance, they are typically more complex. But some of Kotlin conventions are\
    \ different from Java or C+. For example, Kotlin objects of functions are also\
    \ functions (for example, myObject()) if that class provides a method invoke()\
    \ that we can call this object. See Figure 4 for more examples of this.\n\nUsing\
    \ an IDE is a great way to develop in Kotlin, as it makes it easy to fix code\
    \ and makes the build process quicker\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_53_1.png)\n\
    \nThe online Kotlin Sands is a great way to be comfortable with Kotlin while trying\
    \ your head at code\n\n* With*\n\n54"
