    # 06 Operating system selection


    Put in the SD card, plug in the power and we''re good to go. Be sure to check
    that the power and USB hub are in the right around - they''re labelled on the
    Pi''s board as left for USB, right for power – before turning on


    Ready to get coding? Before we, we''ll need to download and install an operating
    system. NOOBS is installed by default on the microSD card, provided you have a
    Wi-Fi connection available, you can download it during the selection. We recommend
    using with the option, Raspberry. If you don''t have a Wi-Fi connection you''ll
    need a USB Ethernet adapter and cable


    # 04 Terminal block to Pi


    This is where things get a little tricky. On the reverse side of the terminal
    block we want to connect the male side of the male-to-female connectors in following
    order from top to bottom, assembling the black cable to the thermometer at the
    first pin. Then the yellow, purple, green, and orange. Between red and yellow
    we''ll also need to include a resistor of the 4.7k ohm. This is to prevent too
    much power going through the thermometer. The resistor should snugly beside the
    male pin. Secure all the screws as before. Well, you''ll need five empty slots
    on the terminal block, which is normal; you can use these for additional security.


    # 05 Connecting to the Pi


    Using the Raspberry Pi Zero''s GPIO chart, connect the end of the male-to-female
    cables/connectors to the following pins: black 6 (Ground), purple pin 7 (BC4),
    green pin 9 (Ground); pin 11 (BCM), pin 13 (BCK) and red cable on pin 17 (3V Power).
    Go all the way down the bottom on pin 20 (GND). This should help you all the external
    cables and wiring set up. Now you may want to use the USB hub and HDMI adapter
    to connect a mouse, keyboard and display temporarily, while we code on the device.
    These can be removed once it is set up and before we close the waterproof container.


    # 07 Pre-programming Python setup


    We discovered – eventually that a few steps were necessary to get any code working
    with the sensors in our weather station. You''ll need to run the following commands:


    ```

    sudo apt-get update

    sudo apt-get install python3-setuptools

    python3-wimetry python3-gpiozero -y

    ```


