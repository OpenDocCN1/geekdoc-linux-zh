  md: "# # Python: Jupyter Notebooks\n\nplaced in a single cell. You can then use\
    \ the %% magic command to get an idea of how the entire chunk of code behaves.\n\
    \nWhile this may be fine to get a great idea of the time being spent in some parts\
    \ of code, you may need to break it even further. Then you need to profiler the\
    \ Savage Benchmark within a function definition, the following commands to look\
    \ at what are the most expensive parts:\n\nNow that you know what code needs to\
    \ be worked on, what are the first things you should look out? Unless you learned\
    \ Python as your first language, from someone who is already a great Pythonist,\
    \ you will have inherited thoughts and techniques from other languages that are\
    \ not appropriate to use in Python.\n\n# Being Pythonic\n\nIncidentally, this\
    \ latter definition includes myself, so as not to take anything as gospel without\
    \ first sure that it makes sense in your situation. In this section, we will look\
    \ at some areas\n\n```\n%%prun_func(100)\n```\n\nThis returns a breakdown of how\
    \ much time was spent in each section of your code. The first lines give an example\
    \ like that shown in Figure 1. If you need more detail install the _profiler module\
    \ and use it in your Jupyter Notebook.\n\nAlso, although you're trying to solve\
    \ the irksome of running out of memory when your code executes. To help with this,\
    \ there is a memory module that you can use in your code. If you haven't installed\
    \ it, you can install it directly from your notebook.\n\n> Sometimes, the problem\
    \ is the irksome of running out of available memory when your code executes\n\n\
    ```\n!pip install --user memory_profiler\n```\n\nOnce it is installed, you run\
    \ it with the command:\n\n```\n%load_ext memory_profiler\n```\n\nYou can run it\
    \ with your code:\n\n```\n%%prun -large_mem_func\n```\n\nThis command traces through\
    \ the given function and how much memory is used after each line is executed;\
    \ see Figure 2 for an example of its output. You can identify which lines are\
    \ the largest and see what you can do to handle memory usage.\n\nwhere you get\
    \ some benefit from making your code more Pythonic. As first, let's look at a\
