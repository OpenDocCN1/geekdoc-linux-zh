    \ BCM numbering\n\n| 5 | UART | 14 | 15 | 18 | 23 | 24 | 25 | 6 | I2C0 | 12 |\
    \ 16 | 20 | 21 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|-|\n| |\
    \ | | PWM | | | | | SDA | SDA | PWM | | SCL |\n| 1 | 2 | 3 | 4 | 17 | 22 | 27\
    \ | | | | | | | |\n| | | | GPIO | | | | | | | | | | | |\n| 3V | 2C1 | | | | |\
    \ | | | | | | | |\n| | | | | | | | | | | | | | | |\n| 3V3 | | | | | | | | | SPI\
    \ | | | | |\n\nThis will also install python-cloud. You'll need all of these before\
