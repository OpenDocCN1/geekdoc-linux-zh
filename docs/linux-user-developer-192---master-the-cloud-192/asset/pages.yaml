    \ the constructor in this way.\nThat's all very well, but it is nothing that we\
    \ couldn't do in Java. Java lets us define fields, in which we can omit the get\
    \ and set fields. The reason why this is bad practice is that we might have to\
    \ come back later and change the value of accessed fields or set, for example,\
    \ add validation to the set value of the field.\nIf we use public fields, it's\
    \ very difficult to change them to custom get and set methods, which is why it\
    \ is discouraged. Contrast, Kotlin makes it very easy to come back and refine\
    \ the way that a property is accessed or modified by using get, set fields. See\
    \ Figure 5 for the main function and expected output in Figure 6.\n\n# Understand\
    \ fields\n\nTo understand properly, we need to remember that properties are not\
    \ the same as fields. A better way to test this is to create an implementation\
    \ of the interface that connects the get and set methods.\nIf we provide implementations\
    \ of these methods, Kotlin provides a backing field to store the value and then\
    \ implements get() to return the value and set() to modify it.\nIf we use our\
    \ own implementations of get() and set(), we can still refer to this ‘backing\
    \ field’ by using the keyword field, as in Figure 5. This allows us to create\
    \ properties that are modified versions of basic data fields. When we use the\
    \ syntax namedField = ... Kotlin will\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_54_0.png)\n\
    \n```\nvar name = _name\nget(){ println(\"What a great name!\")\nreturn field\
    \ }\nset(value) {\n    if (value in 'A'..'Z') {\n        field = value.capitalize()\n\
    \    }\n}\n_name =\n```\n\ncalls the set() function in order to perform the assignment.\
    \ Similarity, it will automatically call the get() function. Kotlin does not create\
    \ fields unless needs to, if you implement get() in a way that does not involve\
    \ the field then no field will be created.\n\n> Properties should be thought of\
    \ not as fields, but as implementations of the get() and set functions\n\nKotlin\
    \ only creates a field if the get or set function asks it; otherwise it will handle\
    \ the field creation by declaration, or if you have not provided a get() or set()\
    \ method, in which case it will create the field-based implementation.\n\nAll\
    \ the properties that have been defined above are val, meaning everything except\
    \ that there is no set() method: the value that is set in the constructor is the\
    \ value that property have value.\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_54_1.png)\n\
    \n| Syntax | Evaluates to |\n| --- | --- |\n| a < b | compareTo(b) < 0 |\n| aaa\
    \ | val = a.toInt(); return a |\n| -a | ainc(); return a |\n| a[i] | get(i) |\n\
    | a(i, j) | invoke(j) |\n| a in b | contains(a) |\n| a == b | a.equals(b)? (b\
    \ == null) |\n\nKotlin does not create fields directly; it uses properties. If\
    \ you find that you need a Java-style field in your project, you can create one\
    \ yourself. If you do not provide our own implementations of get() and set(),\
    \ this property will behave like a field in Java.\n\n# Functional programming\
    \ and lambdas\n\nKotlin encourages programmers to be in a functional style like\
    \ that of Scheme or Haskell. For example, we can pass functions as an argument\
    \ by using the following syntax:\n\n```\nfun somethingString(f: (Int, Int) ->\
    \ Int, {\n    val f3 = f(2, 3)\n    println(\"The function applied to 2 and 3\
    \ is $f3\")\n}\n```\n\nWhat if we want to call a particular get(or set) method?\
    \ We could get all the get properties, but Kotlin is designed in a way to avoid\
    \ reflection. Instead, it provides a special mechanism called delegate, so we\
    \ can attach it to a property using the delegate keyword."
