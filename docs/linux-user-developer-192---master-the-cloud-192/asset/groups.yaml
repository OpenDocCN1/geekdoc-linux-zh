  mdcn: "\n领域通过在域名参数中列出所有域名，并用 `|` 字符分隔（domain=cloud.mydomain.com\\;mydomain\\.org）。域名中的中的点需要用双反斜杠转义，以防止它们匹配任何字符。\n\
    \n现在我们将使用 SSL 将 Apache 设置为反向代理。在 Debian 和 Ubuntu 上，通过运行以下命令完成：\n\n- apache proxy\n\
    - apache proxy_wstunnel\n- apache proxy_https\n- apache ssl\n\n然后，根据 https://nextcloud.com/collabora\
