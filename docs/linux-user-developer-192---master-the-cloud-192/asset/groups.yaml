    # QUICK GUIDE


    ## Unit: speaking my language


    Released in April, Unit is the first of NGINX''s new projects. It''s a very lightweight
    application server that can run code in lots of different languages while being
    managed through an API. This means, Gareth, you can make configuration changes
    very quickly.


    The idea for Unit stems from the microservices where companies are rearchitecting
    their applications and breaking them into small components that they can run in
    containers. Gareth adds, that microservices allow to scale more quickly and develop
    in parallel; it enables developers to use the best tools to-native for each problem
    they have to solve. You don''t have to use the same application stack everywhere.
    They might be building the web front-end for example, and PHP is the best language
    for that. They might be building a database, and Go integration is best as a Python
    module. So bit might be written in Python. Another bit that processes might be.


    Microservices encourage enabling developers to use the language they want for
    the problem at hand. This is a great benefit for developers, us.


    Like that of emerging cloud-native technologies, the initial vision for NGINX
    Unit is to make it easier to run your code – this case application code – and
    abstract concerns about what it''s really possible. As written in:


    > "When we take this application components, and you put it into an application
    stacks, then you have 17 different languages. You''ve got to figure out how to
    do them. How do you manage them?"


    NGINX''s first release of Unit is a server that can run multiple, different languages,
    and Gareth says it''s achieved that goal. "We can run PHP, Python, Ruby, Go and
    Perl, with integration with those." It''s once that you deploy code and use it
    like that and use NGINX''s APIs to deploy your code, you''ll have the same runtime,
    stack, APIs and monitoring, which reduces the complexity of operations.


    Ah, Yes, Kubernetes is becoming a commodity in the they''s now the default platform
    for running containers. It''s a commodity that it''s available is so many places,
    like AWS, Azure, Google and on. And it works in the way-so. That''s what makes
    it a commodity, it''s ubiquitous, for most places, not just us. There''s a large
    ecosystem around it. NGINX is part of that ecosystem, and we deal with of some
    network traffic management, the high visibility, the scaling. There are other
    tools to cover it. They don''t close gaps in Kubernetes, but they layer additional
    services on top. So it''s monitoring and security. There''s ecosystems for each
    - backups, integrations, CI/CD), I-donate. If you''ve ever seen our Native Computing
    landscape - that''s their craft.


    # NGINX allows you to build the infrastructure of your website from your end-users


    Yes, it''s fascinating. Also, it reveals in how they have products are there now,
    as NGINX''s three years old?


    Yes, it''s about three years old, and they have produced probably 200 products
    on it. If you are a young developer, and you''re going to Kubernetes, they challenges
    of deciding which stack code is so difficult.


    Enterprise have the scale. They''re moving away from a traditional tier - a Java-based
    application - to here. Or a classic three-tier, maybe Ruby-based application.
    And they''ve realised that they need to be able to turn these applications around
    more quickly, apply changes more quickly; all the initiatives they get from online
    are about: "I need a new feature. I need a new service to support a new client.
    And I need to do it tomorrow."


    A week later: "Well..."


    They''re realizing that the traditional stacks don''t support speed of development.
    The CNCF is a great job of bringing together the kind of technologies that help
    support that. You need deep there.


    There''s four core technologies that matter:

    - DevOps, which is a cultural way of running your time.

    - Kubernetes, an operational way of being in place.

    - Containers, technology for packaging and delivering.

    - Microservices as an architecture that people are addressing, allowing them to
    scale applications independently.


    These four are what defining the modern way of building applications, and that
    that way has created a huge explosion of complexity. You can''t go to a single
    vendor like we are able to. Have the CNCF landscape, and you can start picking
    and choosing from it.


    Our role is to try to address particular segments in that landscape that we think
    – we know – we can.


    # So what have you bring to kubecon? What''s the pitch?


    Our pitch is: touch and know NGINX. NGINX is not just something I think, but to
    a person, everyone knows. It''s not like there''s any organization that isn''t
    very trusted. It''s lightweight.


    What do we tell you? NGINX is not just a package that you use. NGINX is a very
    well NGINX which has a business that researches and develops and NGINX open source
    software that you use. That have commercial version is driven by a business of
    NGINX built by Plus.


    So the first step is: to let you know there are many things that we can do: Because
    NGINX is absolutely what we use wire. If you need to connect with network, NGINX
    is the perfect place to do it. We have a application firewall, so you can install
    and scrub traffic. We can run load balancing, and redirection, so you can change
    the architecture of your application with NGINX. We have an API controller, and
    we have some projects on the horizon as it''s potentially exciting for a list
    of the attendees here.


    If you''re in a position where you use NGINX instances, you can support the open
    source project by purchasing NGINX Plus and gain access to host of enterprise-level
    features.


    NGINX, the open source project that you know well and appreciate, is supported
    financially by a commercial business that sells software and support. Additional
    features remain to enter under the umbrella of NGINX Plus. This is a software
    load-balancer, web server and content delivery beyond what''s available in the
