    全球基础设施


    上述 Microsoft 的 Azure 云额度可以让你免费获取，即使你正在部署 Linux


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_20_2.png)


    全球化意味着云提供商可以具有韧性，无论你的用户位于何处


    - 快速提示

    IaaS、PaaS 和 SaaS

    “基础设施即服务”（IaaS）是位于……的服务器、存储和网络。

    “平台即服务”避免了……。

    “软件即服务”（SaaS）交付应用程序。


    # 精通云


    现在你的系统已经运行，你可能需要一个数据库。在传统环境中，这意味着启动一个额外的实例。这在云中仍然是一个选项，使用 IaaS（简单存储服务），并且机器很容易部署。


