    ## 公有云


    ### 快速提示

    云自动化

    公有云基础设施的管理首先通过网络界面进行，但许多提供商也提供命令行和基于 API 的控制。


    公有云代表了一种快速、简单且具有效益的部署服务器技术的方式。


    必须在自己的基础设施上运行部署服务器的时代已一去不复了。云市场正在增长。对于最大的参与者来说，AWS（亚马逊云服务）云业务利润非常丰厚的——AWS 以惊人的规模提供了按需服务。


    ### 快速指南

    免费创建公有云


    在公有云领域，有几家关键参与者在相互竞争。由于他们都试图将组织引入自己的平台，显而易见，这种竞争的最好方式就是提供“免费”——不收取费用的基础服务级别，或免费层级。可以在不输入任何支付详情的情况下，使用包括
    Amazon AWS、Microsoft Azure、Google Cloud Platform、DigitalOcean 等在内的所有提供商的公有云环境。


    AWS 的增长率为 9%，似乎正在追赶市场领导者。尽管微软在技术术语方面显得很新，但它被认为是成熟的——全球大量企业对系统的依赖证明了它是业务的核心。


    公有云是如何工作的？服务通常使用基于网络的界面进行配置或管理（尽管有方法可以实现自动化）。云提供商通过网络系统提供全套服务。例如，AWS 提供了 100 多种产品，涵盖计算、存储、数据库、迁移、网络、开发、管理、安全、信任与智能、机器学习等。


    你按需要使用（并因此付费）——你可以慷慨地启用服务，这也让你的云使用之旅的起点变得容易得多。


    虽然公有云是通过单一界面管理的（该界面实际上非常易用），但基础设施分布在各地以提供可靠性。各种概念可能会发挥作用。第一个是“可用区”（availability
    zones）——尽管没有标准，但请注意其他产品所使用的术语略有不同，但概念是相同的。可用区代表了一种……


    使用云提供商的优势之一是你只按需使用（并因此付费）。


