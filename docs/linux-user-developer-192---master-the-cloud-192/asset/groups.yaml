    \ Trisquel GNU/Linux 8.0\n\nAbove the 2.5GB main distribution, Trisquel also has\
    \ a 950MB Mini edition and the TOAST edition based on the Sugar environment.\n\
    \nThe Free Software Foundation's favourite distribution is back after a four-year\
    \ hiatus.\n\nYou can be forgiven if you haven't heard of Trisquel; the distribution\
    \ had its last stable release over four years ago. But, as the release announcement\
    \ notes, the Free Software Foundation (FSF) has decided to run the LibrePlanet\
    \ conference since last to create a new infrastructure as itself.\n\nIt doesn't\
    \ adhere to GNU's guidelines for free software. But there's more to Trisquel than\
    \ just repackaging Ubuntu, because finding the non-free stuff is a non-trivial\
    \ task. In addition, when the developers take a non-free component, they also\
    \ have to navigate the environment without affecting other components, which is\
    \ an involved and cumbersome process.\n\nTrisquel was created by the University\
    \ of Vigo in Spain to create an educational distribution that supported the Galician\
    \ language. But the project outgrew its initial goal and became a free distribution\
    \ with multilingual support. In April 2005 it was taken over by Richard Stallman\
    \ and is now headed by FSF board member Rubén Rodríguez.\n\nTrisquel uses the\
    \ Linux-libre kernel that takes the Linux kernel as a base and removes any software\
    \ that does not include its source code, or which releases its source under a\
    \ proprietary license, for free. This is not the only objective of the distribution.\
    \ Its developers also strive to make Trisquel looking appealing and simple to\
    \ navigate.\n\nTo the casual user, it might appear that the Ubuntu-based Trisquel\
    \ simply reupstream packages by stripping the non-free packages that—\n\nTrisquel\
    \ uses a modified Ubuntu installer to make its users adhere to some best practices.\n\
    \n![](img/812f46ecd05a8f8c79d0efa04dd898b1_88_0.png)\n\n> When the developers\
    \ take out a non-component, they have to ensure they stay in the free version\
    \ without adversely affecting other components.\n\nTo ensure the security and\
    \ privacy of their data, others like Trisquel will ask users to encrypt their\
    \ partition by providing a security key. You can also opt to overwrite empty disk\
    \ space for more security.\n\nThe big change in Trisquel 8.0 is that it is based\
    \ on Ubuntu MATE desktop environment, replacing the former 3D MATE compositor\
    \ functions which require more graphics drivers to function properly. Trisquel\
    \ is late to the party in terms of Linux kernel development process.\n\nAnother\
    \ disadvantage is Trisquel 8.0 is based on the release cycle of the Ubuntu LTS\
    \ 16.04. The good news, however, is that it works on Trisquel 9.0, based on the\
    \ latest-Ubuntu 18.04 LTS, which is already ready. The disadvantage, of course,\
    \ is the time it takes Trisquel to rip out the proprietary parts from an Ubuntu.\
    \ That said, you should skip Trisquel 8.0 in the meantime as the team will support\
    \ this release with security updates until April 2021.\n\n## Pros\n\n- A fully\
    \ functional and feature-rich Ubuntu distribution that puts users in charge.\n\
    \n## Cons\n\n- There's an uneasy peace of development, and it's best to wait for\
    \ the previous Trisquel LTS release.\n\nTrisquel 8.0 packs in out selection of\
    \ mainstream applications such as LibreOffice and VLC, but also lacks many in\
    \ its objects. We were browsing, for examples, and found out Trisquel which is\
    \ an up version of Firefox. According to the announcement, however, Abroser is\
    \ well suited and designed to maximize users' privacy without compromising usability.\
    \ The browser will not establish any connections on its own, unless the user connects\
    \ to specific websites through such extension and geolocator. Abroser also has\
    \ a list of privacy-enhancing extensions that will be activated whenever you fire\
    \ up the browser or switch to a new tab.\n\nThe besides the software, it provides\
    \ access to over 25 free software packages online. It includes reports on accounts\
    \ and updates. This figure is particularly important when you consider the fact\
    \ that the distributors review and customise each package to make sure they don't\
    \ contain any non-free bits.\n\nMayadore Sharma\n\n## Summary\n\nThe effort put\
    \ into making the distribution conform to stringent requirements without taking\
    \ away core features of freedom is the fine line between ideology and pragmatism\
    \ that Trisquel manages to manage.\n\n## Fresh free & open source software\n\n\
