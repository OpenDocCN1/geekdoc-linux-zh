    continue to grow in popularity and are increasingly accepted as viable alternatives
    to Microsoft and Apple, it is the server market that really understands the Linux
    ecosystem. Every claim is hard to validate, but it is estimated that over-thirds
    of all server deployments are based on Linux. Servers are online all the time,
    which equates to a huge number of installs across the world. This popularity means
    that leading providers scalability and cost-effectiveness when compared to conventional
    environments.


    A private cloud, as the name suggests, consists of cloud resources using only
    one organisation. A private cloud can be physically located data centre, or it
    can be hosted by a third-party provider. The key cloud differentiator is that
    the services and physical infrastructures are always located and the hardware
    and software are used by a single organisation.


    > The basic premise of cloud computing is that it facilitates the delivery of
    server technology and services over the internet.


    A public cloud is the most common way of deploying cloud computing. With a scalable
    cloud, hardware, software and other supporting infrastructure is owned and managed
    by the cloud provider and delivered over the internet. The key difference is that
    the infrastructure supports multiple tenants – you will share the same hardware,
    storage and network with others.


    A hybrid cloud combines private with public cloud to allow you to enjoy the advantages
    of both. In this model, both applications and related data can transition between
    private and public clouds for flexibility and cost. An example use-case is deploying
    high volume, lower security applications to the public cloud and using the private
    cloud for applications with highly sensitive data, or using to ''burst'' capacity
    to meet with high demand –

