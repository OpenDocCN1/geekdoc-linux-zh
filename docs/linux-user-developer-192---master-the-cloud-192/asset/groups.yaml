  - "[PAGE 27]\n\n# Master the Cloud\n\n# Hybrid cloud\n\nQUICK TIP\nHybrid cloud\
    \ and private\nMany of the approaches used for private clouds also apply to a\
    \ hybrid model, and hybrid clouds aren't mutually exclusive.\nWith right orchestration,\
    \ there's no reason why yours can't be a blend of on-premises, private and public\
    \ cloud.\n\n# A cloud solution offers to the best of both worlds\n\nthe hybrid\
    \ cloud environment is a system that uses a mix of on-premises/private and public\
    \ cloud services, with orchestration between the two. By allowing workloads to\
    \ move between private and public clouds, hybrid clouds offer greater flexibility\
    \ and enhanced deployment options.\nThe hybrid cloud model works well for those\
    \ that have highly volatile workloads or need to scale activity on a day or days\
    \ of the week that may benefit from extra capacity via the cloud (as 'cloud bursting')\
    \ or for those who need private servers for the majority of the time. Other hybrid\
    \ cloud use-cases include processor-intensive or storage-intensive applications\
    \ and data disaster-recovery scenarios, where the main data must be out and a\
    \ public cloud must be relied to keep the system running. Dedication exists for\
    \ disaster recovery, such as Azure Site Recovery and Cloud Disaster Recovery.\
    \ These typically form part of the provider's migration suites, with business\
    \ continuity in the cloud being a close factor.\nThe key components in a hybrid\
    \ system are a particular platform such as AWS, Azure or Google Cloud, private\
    \ platform – either on or hosted with a dedicated provider – WAN connectivity\
    \ between environments. Cloud providers offer the option to provision orchestration\
    \ between on-premises and cloud data centers.\n\nA well-functioning hybrid cloud\
    \ relies on deployment of a virtualization layer (such as OpenStack) and automation\
    \ and orchestration. Instances must be able to migrate seamlessly between private\
    \ and public clouds, and applications must be able to use a mix of resources for\
    \ the hybrid architecture. In the case of these architectures, the favoured approach\
    \ is to implement a third-party hybrid cloud specialised orchestration platform,\
    \ such as Cloud Foundry or OpenStack, or the 'Topology and Orchestration Specification\
    \ for Cloud Applications (TOSCA) specification.\n\nRed Hat is a particularly vocal\
    \ proponent of the hybrid cloud model and its OpenShift Kubernetes\n\n# In architectures,\
    \ the favoured approach is to implement a hybrid cloud specialised orchestration\
    \ platform\n\nBelow TOSCA Orchestration, supported by Cloudify, allows the definition\
    \ of infrastructure-as-code (YAML) which can be easily deployed to multiple platforms\n\
    \nplatform built on OpenStack as a solution. Microsoft and Red Hat recently announced\
    \ the ability to run OpenShift on the public cloud as well as on-premise, with\
    \ a single management view covering both environments. This provides a great option\
    \ for managing workloads across clouds, and the cloud company is currently owning\
    \ bits of themselves.\n\nMost of the public cloud providers have services specialised\
    \ at hybrid cloud. One example is AWS Storage Gateway, which is a hybrid storage\
    \ service that enables on-premises applications to seamlessly use AWS cloud storage.\
    \ Connections can be made using standard protocols, such as NFS and SCSI. The\
    \ gateway to AWS offers services such as Amazon S3 and Glacier, providing storage\
    \ for files, volumes, and virtual tapes in AWS. Amazon also provides products\
    \ in the data space, enabling sync between on-premises and cloud-based data stores.\n\
    \nGetting a hybrid cloud is a serious undertaking, and is dependent on rock-solid\
    \ integration between environments plus guaranteed network connectivity. If the\
    \ links between private and cloud data centres break, the system can break in\
    \ a big way.\n\n| CLOVERIFY | Overview | Product | Resources | Community | Download\
    \ | \n|---|---|---|---|---|---|\n\n# TOSCA ORCHESTRATION\n\nBased on TOSCA, it\
    \ is used to automate application lifecycle. Define their application topology\
    \ using YAML, and deploy it to environments of choice.\n\n| From TOSCA YAML |\
    \ To Mobile application\n\n```\ntype: cloud.tosca.types.node.t2\nname: web_server\n\
    capabilities:\n  type: cloud.tosca.types.capability.compute\n  requirements:\n\
    \    group: app\n  interface:\n    type: cloud.tosca.types.interface.proxy\n \
    \   properties:\n      port: 80\n- type: cloud.tosca.types.node.t2\nname: database_server\n\
    capabilities:\n  type: cloud.tosca.types.capability.compute\n  requirements:\n\
    \    group: db\n  interface:\n    type: cloud.tosca.types.interface.proxy\n  \
    \  properties:\n      port: 3306\n```\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_27_0.png)\n\
