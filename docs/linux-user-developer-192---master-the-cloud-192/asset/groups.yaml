    # OpenSource


    06 News & Opinion | 10 Letters | 12 Interview | 16 Kernel Love


    UBUNTU


    ## Purism and UBports partnership revives Ubuntu Touch


    Crowdfunded Librem 5 to offer three mobile operating systems


    Purism''s forthcoming Librem 5 phone will run Ubuntu Touch in addition to PureOS,
    it has been revealed. The device, which is set to be the most anticipated new
    mobile launch in years, will have three operating system options: PureOS, PureOS
    with KDE Mobile, and now Ubuntu Touch.


    Ubuntu Touch is the mobile version of the Ubuntu desktop. Since Canonical abandoned
    the mobile version of its Ubuntu desktop, Ubuntu Touch has been maintained and
    updated by UBports, a Canonical free, community-based project. Unfortunately,
    device capacity has been limited to a handful of handsets,


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_5_0.png)


    ## Ubuntu Touch was developed with the goal of Android-free


    such as the Nexa 5 (Hammerhead), OnePlus One and the Meizu 5 Pro. Complete with
    phone-to-desktop environment ''convergence'' needs a new, modern platform, and
    Librem 5 looks to fulfill it.


    Developments include improvements to hardware security, showing that no doubt
    Purism is on board. As Purism, the UBports community is powered by people who
    about privacy and ease-of-use to people while increasing our install base. Pairing
    with Purism will allow us to advance UBports for well-supported commercial devices
    for the first time. The Librem 5 will be the first to run Ubuntu Touch, particularly
    as it will not require an Android system.


    Meanwhile, Ubuntuports deputy, stated: "Ubuntu Touch was developed with the goal
    of being an Android-free OS for mobile exploration. The future of mobile is away
    from Android, and the Librem 5 with Ubuntu Touch presents the perfect platform
    for this vision."


    Todd Weaver added: "Having Ubuntu Touch Android-ended and uniting users gives
    a wider audience for us. While we develop support for AndroidOS, allowing an alternative
    to users that is supported by Purism can only help the people of improving digital
    rights."


    In a joint statement, Marius Gripsgard and chairman of the board of UBports, said
    that "Having Ubuntu Touch working by default on a mobile phone as the Librem 5
    is an ideal approach to other"


    When released, Librem 5 should be the most secure mobile phone available


    The Librem 5 is expected to launch in January 2019.


    # DISTRO FEED


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_6_0.png)


    # Top 10


    (Average hits per day, 30 days to 4 May 2018)


    | Rank | Distribution | Hits |

    | --- | --- | --- |

    | 1 | Manjaro | 3534 |

    | 2 | Mint | 2811 |

    | 3 | Ubuntu | 2302 |

    | 4 | elementary | 1453 |

    | 5 | Debian | 1209 |

    | 6 | Solus | 1136 |

    | 7 | MX Linux | 1088 |

    | 8 | Fedora | 1087 |

    | 9 | openSUSE | 659 |


    ## SOFTWARE


    ## Crostini brings Linux apps to Chromebook


    ## ARM-based Linux land on Google Pixel, with other devices detected


    Running apps on Chrome OS looks to become far easier, with a new feature. This
    year, Crostini has met their users, again as Google''s Linux-versioned, cloud-centric
    operating system has been pushed to more. It is not just users who want to run
    apps on Chrome OS who need open source software, Chromium; Google has been pushing
    the boundaries of the OS it.


    For users desiring more functionality, this wasn''t enough. Open source tool Crostini
    is capable of running a Linux desktop, which has helped bring Linux apps to Chromebooks
    - but it''s buggy, and support is patchy.


    However, a peek into the Chrome source may reveal the feature, Crostini. If Crostini
    can "Run Linux apps, and IDEs on Chromebook," it does this by managing a virtual
    machine.


    First came Chrome Apps, applications that work as if they''re native. For many,
    this was enough... but that Android could not last long on no one. In 2016, after
    a period of experiment with Android on Chrome OS (at least in part), by the AR
    tools, the Google Play Store was introduced on compatible Chromebook devices.
    Unfortunately, few Android apps are designed for desktop or laptop computers,
    resulting in compatibility and usability issues in many cases.


    Chromebook developers may have already used the Terminal app as needed. However,
    if you are not using a Pixelbook, users can visit r/Crostini on Reddit to find
    out more, and how to start getting to enabling Crostini and running Linux apps.


    ## This month


    - Independence (7)

    - Stable releases (25)


    Unsurprisingly, it is the month forward for 18.04 LTS, with various flavours of
    the popular dist-ro being within the heart of the matter.


    ## Highlights


    Ubuntu Studio 18

    Curiosity follows a standard release, Ubuntu Studio features a collection of open
    source apps for audio, video, and graphical media creation.


    Ubuntu MATE 18.0

    Transitioning to GTK+ 3.2, Ubuntu MATE 18.04 receives improved touch gesture support,
    accessibility support for visually impaired users, and HDMI support.


    Ubuntu Budgie 18

    This is the first LTS for the refreshingly Ubuntu Budgie. It features new Budgie
    apps, a new GTK+-themeded panel, features and fixes.


    Latest distros available:


    ```

    files.ubuntu.com

    ```


    # Hacked Nintendo Switch now runs Ubuntu 18.04


    Retro emulation teased, as popular console made public


    Following that the Nintendo Switch console has been hacked to run Linux (see News,
    LU#0190), a hacker from GBATemp.net''s gaming forum has shared a photo of a Switch
    running the newly released Ubuntu 18.04 LTS.


    Details of the hack were shared by falloverflow, who originally created the exploit,
    but Shifel2, said to be a ''bug in the base ROM'' of the Nvidia Tegra X1 processor
    stack, the exploit is enabled to ''a USB-based receive mode for initial flashing
    of Tegra devices and recovery''. The bug allows non-signed software to be loaded,
    the result being an Linux-based boot stack available at falloverflow.com.


    Having a hardware of versatility is the key factor for Nintendo with regard to
    parity. The Nintendo''s three previous versions of DVDs (and consoles) in order
    to combat copying, this hardware-backed exploit seems to be versatile enough to
    work with each of Switch models.


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_7_0.png)


    > Would you install Ubuntu 18.04 on your new Nintendo Switch?


    Installing Ubuntu on a Nintendo Switch is not straightforward at this stage, and
    it certainly won''t run in a productive manner. As GBATemp forum users claim,
    "the bones are so bare. No Wi-Fi (all there seems to be a gone problem anyway)
    no HW acceleration. Bluetooth. But the potential is for development, not only
    for emulation of platforms, but using the Nintendo Switch as a tablet PC. However,
    Nintendo will certainly modify the hardware in future revisions of the Switch
    to fix this, the race is on."


    # Microsoft''s Azure Sphere features Linux kernel


    Yet less like Linux from Microsoft


    After decades of diminishing Linux, the past few years have seen the Red Hat backed
    become an open source computing giant. While a Linux kernel in the heart of Windows
    remains unlikely, Microsoft''s support for Linux, including Windows Subsystem
    for Linux and the Linux Foundation and releasing the 10 IoT Core for the Raspberry
    Pi, shows that it acknowledges the importance of Linux in modern computing.


    Announcing the news on 16 (April) which some be to be a late April Fool(s),


    President Brad revealed ''After 43 years, this is the''

