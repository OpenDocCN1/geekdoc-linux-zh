    Ballerina 后盾公司 WSO 的 CEO Tyler Jewell


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_34_0.png)


    Ballerina 的目标是什么？


    如果你做过集成项目并且是大规模执行的，那么就存在一个集成鸿沟——这对于开发者来说非常沮丧。你有两个选择：你可以使用企业服务总线（ESB），它充当中间件路由器，使得大规模集成成为可能，但开发者体验非常糟糕。然而，如果你这样做，你就必须找到并配置这些到其他系统的连接器。实际逻辑是，你通常编写代码和
    XML 的组合，这可以奏通，但并不灵活。


    另一边，你有像 Java 或 JavaScript 这样的纯编程语言。你可以应用像 Spring 或 Node 这样的框架。它们很灵活，但它们没有内置集成功能——集成语法是
    Ballerina 负责负责的。Ballerina 是我们解决这一鸿沟的方法。它是一种编程语言，基本上可以让你轻松地编写你想要部署为微服务的集成服务。然后，微服务就可以与它需要集成的许多其他事物进行集成。


    它如何与周围的所有其他技术相匹配？


    关于 Kubernetes 的有一点是，随着它的流行程度增加，它鼓励开发者创建更多的服务。服务越多，架构就越复杂。随着集成速率的增加，你从需要管理的 10
    个服务变为 100 个、1000 个、2000 个。


    然后你还面临着集成问题。Ballerina 越成功，它面临的集成问题就越多，因为我们希望能够轻松写出一个利用所有这些问题的程序。我们看到 Ballerina
    可能会成为胶水，用于解决 ESB 已经解决的历史问题，以及未来甚至尚未出现的问题。我们认为它对于此也非常合适。


