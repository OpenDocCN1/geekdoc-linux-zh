- md: "\n# Tutorial Arduino: Coffee Dispenser\n\nPART TWO\n\n## Arduino: Build your\
    \ own coffee pod dispenser\n\nHaving programmed the Arduino and Pi to identify\
    \ users, it's time to build the machine.\n\nLast time, we set out to build a coffee-pod-dispensing\
    \ machine powered by Arduino. In part of this tutorial, we will use Arduino to\
    \ read information from an RFID card and then pass the data to a Raspberry Pi\
    \ so we could identify. If a user had enough money on their account, Pi would\
    \ send a return message, telling the Arduino to give out a coffee pod.\n\nThe\
    \ design we opted for was gravity-assisted rotational dispenser; the coffee pods\
    \ still fall through a hole, then, a compartment which rotates 360 degrees, dispensing\
    \ the coffee through the same as the compartment turns. The important feature\
    \ here is that the compartment has enough volume for one pod, so other pods have\
    \ to wait their turn and cannot be released. The machine would then disperse one\
    \ coffee pod after a 180 degree rotation.\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_39_0.png)\n\
    \nThe completed coffee machine can be powered by a USB mains adaptor.\n\n## Build\
    \ the compartment\n\nThis mechanism gives us a lot of information about how to\
    \ construct the machine. The coffee pods must be held in container against the\
    \ rest of the machine. The container should have a slanted base and a single hole\
    \ at its lowest point. It must be rotating and properly attached to a base or\
    \ platform which can catch the falling pod. The bottom must be bolted to the sides.\
    \ With that done, it's time to start working on the design and assembly. To build\
    \ the compartment, you simply need something round with at least one flat base.\
    \ For this tutorial we used the bottom of any empty tin which is about the length\
    \ of a finger and will fill up easily. Using metal rather than cardboard has its\
    \ advantages and disadvantages. Although with cardboard, it works fine.\n\nOnce\
    \ you cut the can in half, you will need to make another coffee pod hole on the\
    \ side (which the pod would previously catch). Then just put your hand in and\
    \ push the pod outwards. This will help us connect with the motor. With a saw\
    \ cut a small hole in the center of the can. This must be smaller than the motor's\
    \ shaft, which can then be pushed through - slightly and then fixed in place with\
    \ a screw. The connection is not made by a piece of wood, but we inserted the\
    \ pod-entry in place. The wedding is wobbly and there is a loose connection to\
    \ the motor. To get the coffee pod hole and sit in the base with no room for another\
    \ pod after it turns.\n\n## Connect the motor\n\nTo rotate the can, you need a\
    \ motor. In this tutorial, we used stepper motors to rotate an arm mounted to\
    \ it. Stepper motor allows us to control how fast a motor rotates and \n\n![](img/812f46ecd05a8f8c79d0ofa04dd898b1_40_0.png)\n\
    \nLeft: The wedge fit snugly inside the can and should be attached from the pod\
    \ entrance. In this tutorial, we will use a stepper motor (BYJ-48) to turn one\
    \ time for each pod needs. Using our Arduino setup and sketch as one part of the\
    \ tutorial, we will connect the motor to the driver. The circuit handles the turning\
    \ of pulses so that they are turned on and off to provide a clean rotation. The\
    \ four terminals on the motor connect to four connections on the Arduino, corresponding\
    \ terminals.\n\nWorking with motors how your motor will depend on what you pick.\
    \ With shafts it is easy to connect components, if done correctly, you will need\
    \ load support across the machine. The driver can be powered by the Arduino. Open\
    \ the Arduino IDE. Open the sketch. At the top of the sketch, add a line to include\
    \ the stepper library:\n\n`#include <Stepper.h>`\n\nAs well as initialize the\
    \ stepper motor object passing the pins and a constant which defines how many\
    \ times the motor must rotate:\n\n```cpp\nconst stepsPerRev = 2048;\nStepper MyMotor(stepsPerRev,\
    \ 44, 42, 45, 43);\n```\n\nYou then specify the speed of rotation:\n\n- Going\
    \ breadboard-less\n\nTesting is often performed with a breadboard but in this\
    \ instance there is no flexibility to do so. Using jumpers instead of headers\
    \ is the easiest solution. However, you should consider connections directly to\
    \ the Arduino and external hardware.\n\nTowards the bottom, the Arduino is waiting\
    \ for an affirmative response from the Raspberry Pi informs it that a pod can\
    \ be dispensed. If any 'ok' signal is received, the motor turns 360 degrees:\n\
    \n```cpp\nmyMotor.step(RPM);\n```\n\nNow, when you use your RFID card in front\
    \ of the reader, the can will turn full revolution. This is the time when the\
    \ pod falls in and out of the container. You might need to widen the hole or change\
    \ the size of the edges. This turns the basket into a box-like shape. Trim the\
    \ top of the paper to reduce the height of the basket and then stick it to the\
    \ front of the frame with glue or tape. The basket's base should line up with\
    \ (or just below) an opening on the front of the frame.\n\n## Mount the motor\n\
    \nAfter the basket, you'll need to mount the motor and the rotating mechanism.\
    \ This is quite a difficult task. The motor, from the back of the can, is significantly\
    \ heavier than the handle, so you will need to use some cardboard to secure the\
    \ motor directly above the basket and will potentially need additional support\
    \ for counterbalance.\n\n## Create the basket\n\nNow you've constructed a way\
    \ of dispersing the coffee with the help of gravity, it is time to catch the falling\
    \ pods. The obvious way of doing this is to build a chute at the bottom of the\
    \ container, which the pod can fall down. However, if your construction is as\
    \ poor as yours, the pods will fall out of the metal container. If you had a chance,\
    \ the good pod would be much easier and entirely to be inside the machine.\n\n\
    The effective way of making everything is to use cardboard. The frame of the basket\
    \ can be securely mounted to the motor's shaft - this is exactly what you would\
    \ do if you have frame materials. Cardboard is sturdy but can be somewhat unstable\
    \ without good workmanship. However, you're going to need inside elements to hold\
    \ every joint. Disconnect the Arduino from the reader - you'll add it back using\
    \ the same pins. Using screws, poke holes into the cardboard, make a clearance\
    \ of two-thirds of the diameter of the can. Insert the screws through holes and\
    \ leave them in place. If the can starts slipping, add two more over the lower\
    \ beams to keep the can in place.\n\n> communicate with cards over a distance,\
    \ through cardboard and plastic\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_41_0.png)\n\
    \nTherefore, a more reliable approach is to use a basket which is much wider than\
    \ the can. And somewhere in this, the pod will gently roll the pods towards the\
    \ front of the machine. To do this you can simply use a piece of thick paper or\
    \ can cut a curved edge into the edge of the sheet. The curve should be convex,\
    \ with the chute dipping into the paper towards the long edges, as you cut along\
    \ the width of the sheet.\n\nSmall incisions can be made periodically along the\
    \ curved edge, flaps which should be folded at a right angle to the sheet. When\
    \ you fold the paper upwards so it reaches the ends together (keeping the flaps\
    \ at 90 degrees and downwards), the paper should form a half-basket shape. The\
    \ height of the basket is determined by the length of the paper, which is dependent\
    \ on the degree of the cut and the depth controlled by the cut of the can. For\
    \ a sharper landing you can cut into the curved edge at two points equidistant\
    \ from the centre of the turn and keep the central portion before\n\nRight The\
    \ motor and compartment will need to be kept in place\n\n42\n"
