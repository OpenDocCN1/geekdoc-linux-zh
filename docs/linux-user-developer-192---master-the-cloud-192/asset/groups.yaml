    的 Craig Cox 宣布容器将开源 gVisor，这是一种用于异构环境（CPU 和 GPU）和不常用工作负载的沙箱。这种新型容器似乎旨在在操作系统和应用程序之间提供一个安全的边界。gVisor
    在运行时作为客体内核拦截系统调用。他在一个易受 Dirty CoW 漏洞攻击的虚拟机上演示了这一点。


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_33_2.png)


