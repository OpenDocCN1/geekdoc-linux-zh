    # Kotlin: Introduction


    # Kotlin: Get started guide


    Learn more about this popular, versatile language that can be used with Android
    and the JVM


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_51_0.png)


    IntelliJ IDEA has built-in support for Kotlin, and automatically convert Java
    code when we paste it into a Kotlin buffer


    If there is one thing that can be said about the Kotlin language, it’s that programmers
    love to use it; it will last as the most loved language in the Stack Overflow
    Developer Survey.


    Unveiled in Jet in 2011, Kotlin has grown from the start to solve several problems
    of the Java language, which is still the main bottleneck for enterprise programming.
    However, Kotlin provides a number of constructs that are more concise and elegant
    than their counterparts.


    Unlike some other languages, Kotlin does not seek to replace Java. Instead, there’s
    a strong focus on interoperability with existing Java code. With Kotlin code,
    you can call .class files that can run on the JVM, and try to call Java code from
    Kotlin without anything exciting. Android now provides first-class support for
    Kotlin, making the development of notoriously difficult Android apps 80% easier
    to write. It’s already hailed as an ideal language for the jobs.


    Kotlin is a young language, and there’s no telling how far it will go in industry.
    For existing Java programmers, it is very easy to pick up and there are numerous
    resources available to help you learn. So what are you waiting for?


    We will outline three ways to install Kotlin on your system, and get started programs.
    Our aim will be to show the “Hello world” program in Figure 1.


    +   1. Install through your IDE

    The easiest method is through your IDE. We give instructions for Eclipse, but
    you can also find instructions for IntelliJ IDEA. If you have an installed IntelliJ
    IDEA, it is already made by JetBrains, which is the company Kotlin we recommend
    using if you have the experience.


    Once the plugin has installed and you’ve restarted Eclipse, you are ready to begin
    writing Kotlin. Navigate to File > New + ... and select Kotlin Project to create
    one for your Kotlin. Alternatively, navigate to File > New + ... and select Kotlin
    to create a new Kotlin file. Name the file Hello.kt, and copy the code from Figure
    1 into it. If you go to Run > Run, or click the button in Figure 2, you should
    get the desired output.'
- md: "\n# Hello, world!\n\nA big advantage of the Eclipse IDE for your Kotlin code\
    \ is that it makes it very easy to mix Kotlin and Java code.\n\n# 2. Download\
    \ the command-line compiler\n\nIf you don't want to use an IDE, you can download\
    \ the Kotlin command-line compiler. First, check your distribution's package manager\
    \ to see if there's a Kotlin package that you can install. This is the best approach,\
    \ because your package manager will manage it for you.\n\nIf there is no Kotlin\
    \ package available, you can use the third-party package manager SDKMAN! You can\
    \ install SDKMAN on your system with the following:\n\n```bash\n$ curl -s https://get.sdkman.io\
    \ | bash\n```\n\nThen you can install the Kotlin environment as follows:\n\n-\
    \ sdk install kotlin\n\nLastly, if you want to install Kotlin manually, you can\
    \ get the code from https://github.com/JetBrains/kotlin/release/ and then follow\
    \ the instructions in the README.md to build and install it.\nOtherwise you install\
    \ Kotlin with executables kotlin and kotinc on your system. You can check them\
    \ by running the following commands:\n\n```bash\n$ kotlin -version\n$ kotinc -version\n\
    ```\n\nNow we show how to create a Kotlin program. Create a file called Hello.kt\
    \ and copy the code from Figure 1 into it. Then we can compile and run this code\
    \ as follows:\n\n```bash\n$ kotinc Hello.kt -include-runtime -d Hello.jar\n$ java\
    \ -jar Hello.jar\nHello, world!\n```\n\nAlternatively, if you don't want to use\
    \ the compiler to run our code, and install something with the JVM, we can compile\
    \ our code to a .jar file.\n\n# 3. Installing with Kotlin Snap-in\n\nAssuming\
    \ you have snap, you can run the following command to install Kotlin on your system:\n\
    \n```bash\n$ sudo snap install --kotlin\n```\n\nYou can follow the instructions\
    \ in the previous section\n\n```kotlin\nfun main(args: Array<String>) {\n    println(\"\
    Hello, world!\")\n}\n```\n\nKotlin's 'Hello world is more succinct than Java's',\
    \ because Kotlin functions do not have members of a class and compile and run\
    \ your code. Another option, if you want to try Kotlin without having to install\
    \ anything on your system, it is: https://try.kotlin.org, where you'll find an\
    \ online interpreter that you can use to try out of the examples in this article.\n\
    \nThe page also includes a number of examples and exercises. I strongly recommend\
    \ working your way through the deconstructions at the same time as letting you\
    \ write your own Kotlin code.\n\n# Classes and properties in Kotlin\n\nUnlike\
    \ Java, Kotlin does not require that every function be a member of some class;\
    \ as in C++, (static) functions are allowed to live outside classes. Nevertheless,\
    \ classes are an important building block of Kotlin programs.\n\n> IntelliJ is\
    \ by JetBrains, which is also the company behind Kotlin, so we recommend IntelliJ\
    \ if you have the chance\n\nWe can declare simple classes using the class keyword:\n\
    \n```kotlin\nclass Greeting {\n    fun greeting() {\n        println(\"Hello,\
    \ world!\")\n    }\n}\n```\n\nThe keyword fun is for 'function', and when you\
    \ define a function in Kotlin. We define member functions by putting their declarations\
    \ inside the class, as below.\n\nNotice that the first line of the class declaration\
    \ doubles up as its constructor. The constructor of the Greeting does not take\
    \ any parameters, and we can create a new instance of the class by calling Greeting().\
    \ We add a main function so that we can run the program:\n\n```kotlin\nfun main(args:\
    \ Array<String>) {\n    Greeting().greeting()\n}\n```\n\nYou should put this function\
    \ outside of the declaration of Greeting. We can compile and run this with:\n\n\
    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_52_0.png)\n\n# Tutorial Kotlin: Introduction\n\
    \n```bash\n$ java Greeting\nHello, world!\n```\n\n## Use class properties\n\n\
    The special functions printing out the same greeting every time, we might want\
    \ to pass a value to the constructor of the Greeting class. We can do this in\
    \ the following way:\n\n```kotlin\nclass Greeting(val name: String) {\n    fun\
    \ greeting() {\n        print(name)\n    }\n}\n```\n\nWhen we create a Greeting\
    \ object, we need to pass a string to the constructor: \n\n- `Greeting(\"Welcome\
    \ to Kotlin!\").greet()`\n\nIn addition to members, a Kotlin class can have properties.\
    \ Property is a generalisation of the concept in Java: it is a value that can\
    \ be read from, and written to.\n\nIn Java if you write a field, it is usual to\
    \ declare it as private like this:\n\n```java\nprivate String name;\n```\n\nWe\
    \ write methods to get the value of the field:\n\n```java\npublic String getName()\
    \ {\n    return name;\n}\n```\n\nand to set the value of the field:\n\n```java\n\
    public void setName(String name) {\n    this.name = name;\n}\n```\n\nThis introduces\
    \ a lot of boilerplate. In Kotlin, by contrast, properties of a class are always\
    \ available. For example, the Kotlin version of the Java above is much more concise:\n\
    \n```kotlin\nclass NamedThing(name: String) {\n    var name = name\n}\n```\n\n\
    Properties are declared using the keyword val or var. val means the property can\
    \ only be read from and not written to, while var means that the property can\
    \ be read from and written to. Note that properties can be changed by changing\
    \ their values; they are assigned in the constructor.\n\nAn shorter version of\
    \ the code above is:\n\n```kotlin\nclass NamedThing(var name: String)\n```\n\n\
    Here, using var before the name of the parameter\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_53_png)\n\
    \n## Kotlin conventions\n\nThe special functions () that we meet in this example\
    \ are one example of conventions in Kotlin. They are like operator overload but\
    \ assign any particular construct. For example, we use a function called plus()\
    \ that takes two arguments and returns a value, instead of operator overload in\
    \ C++. Other conventions are more sophisticated. In C++, we can use operators\
    \ and so on, but we have to write them individually if all call a helper function\
    \ to write a lot of boilerplate. In Kotlin, on the other hand, a class has a compareTo\
    \ method that returns a positive integer if it is larger than the second, zero\
    \ if they are equal, or a negative integer. We can then use comparison operators\
    \ without having to write any code.\n\nSome conventions are similar to C++. For\
    \ instance, they are typically more complex. But some conventions are different\
    \ from Java. For example, Kotlin objects are also functions (for example, if that\
    \ class provides a method that we can call). See Figure 4 for more examples.\n\
    \nUsing an IDE is a great way to develop in Kotlin, as it makes it easy and makes\
    \ the build process quicker.\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_53_png)\n\
    \n# Understand fields\n\nTo understand properly, we need to remember that properties\
    \ are not the same as fields. A better way to test this is to create an implementation\
    \ of the interface that connects get and set methods. If we provide implementations\
    \ of these methods, Kotlin provides a backing field to store the value and then\
    \ implements get() to return the value and set() to modify it. If we use our own\
    \ implementations of get() and set(), we can still refer to this ‘backing field’\
    \ using the keyword field, as in Figure 5. This allows us to create properties\
    \ that are modified versions of basic data. When we use the syntax field = ...\
    \ Kotlin will\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_54_0.png)\n\n```kotlin\n\
    var name = _name\n    get() {\n        println(\"What a great name!\")\n     \
    \   return field\n    }\n    set(value) {\n        if (value in 'A'..'Z') {\n\
    \            field = value.capitalize()\n        }\n    }\n```\n\n_name = calls\
    \ the set() function in order to perform the assignment. Similarity, it will automatically\
    \ call the get() function. Kotlin does not create fields unless needs to; if you\
    \ implement get() in a way that does not involve the field then no field will\
    \ be created.\n\n> Properties should be thought of not as fields, but as implementations\
    \ of the get() and set functions\n\nKotlin only creates a field if the get or\
    \ set function asks it; otherwise it will handle the field creation by declaration,\
    \ or if you have not provided a get() or set() method, in which case it will create\
    \ the field-based implementation.\n\nAll the properties that have been defined\
    \ above are val, meaning except that there is no set() method: the value that\
    \ is set in the constructor is the value that property have value.\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_54_1.png)\n\
    \n| Syntax | Evaluates to |\n| --- | --- |\n| a < b | compareTo(b) < 0 |\n| aaa\
    \ | val = a.toInt(); return a |\n| -a | ainc(); return a |\n| a[i] | get(i) |\n\
    | a(i, j) | invoke(j) |\n| a in b | contains(a) |\n| a == b | a.equals(b)? (b\
    \ == null) |\n\nKotlin does not create fields directly; it uses properties. If\
    \ you find that you need a Java-style field in your project, you can create one\
    \ yourself. If you do not provide our own implementations of get() and set(),\
    \ this property will behave like a field in Java.\n\n# Functional programming\
    \ and lambdas\n\nKotlin encourages programmers to be in a functional style like\
    \ that of Scheme or Haskell. For example, we can pass functions as an argument\
    \ by using the following syntax:\n\n```kotlin\nfun somethingString(f: (Int, Int)\
    \ -> Int) {\n    val f3 = f(2, 3)\n    println(\"The function applied to 2 and\
    \ 3 is $f3\")\n}\n```\n\nWhat if we want to call a particular get(or set) method?\
    \ We could get all the get properties, but Kotlin is designed in a way to avoid\
    \ reflection. Instead, it provides a special mechanism called delegate, so we\
    \ can attach it to a property using the delegate keyword. The reason why this\
    \ is bad practice is that we might have to back later and change the value of\
    \ accessed fields or set, for example, add validation to the value of the field.\
    \ See Figure 5 for the main function and expected output in Figure 6.\n"
