    # Practical Pi


    72 ‘Holographic’ audio visualiser

    Discover how Aaron Tainter and Davis Lau created their own pseudo-holographic
    music visualiser using a Pi, monitor and some clever engineering – they building
    the project for yourself


    74 Send Pi to sleep

    Use a low-power, low-cost 8-bit controller to automatically sleep your Pi after
    a specific time


    76 Build a weather station

    The Pi team tested Maker Life''s Weather Station kit. School IT Director Calvin
    Harrison and some of his 10 pupils document the process of putting it together
    and writing code to make it work


