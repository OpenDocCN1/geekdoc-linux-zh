  - '[PAGE 65]


    # Nextcloud for Start-Ups


    There are various ways to install Nextcloud.

    Some hosts have a pre-configured package, or you can buy a pre-configured box
    with Nextcloud ready to go, using a range of different hardware capabilities including
    the Raspberry Pi.


    You can also set it up with MySQL and PHP, by downloading the web installer -
    a single PHP file - if you have your web space to run it, although this may not
    give you the latest version of Nextcloud.


    However, we''ll look at the most hands-on approach, which is useful if you have
    full control over your server or a VPS. By downloading the Nextcloud archive and
    unpacking it to your server, this approach means you can put it where you want,
    the web installer is limited to those areas.


    Before you install it, you need to take care of the dependencies. Aside from Apache,
    MySQL, MariaDB or PostgreSQL, you also need a few more modules like php-gd, php-mysql,
    php-zip, php-xml, and php-curl. These are the modules required for Debian and
    Ubuntu; other systems may package and name them differently, but as long as you
    have LAMP stack installed, Nextcloud will tell you if any of the modules are missing.
    Point your browser at http://localhost to make sure Apache is working.


    You won''t want to store your user''s database credentials in Nextcloud''s configuration
    file, so you will need to add a separate user to MySQL. Grant this user all privileges
    for now, you can change this to enable access only to the Nextcloud database once
    it has been created. Using the mysql command line or using phpMyAdmin''s interface,
    depending on how comfortable you are with diving into SQL.


    Nextcloud inside Apache''s DocumentRoot /var/www/html on Ubuntu but some other
    systems use /srv.


    ```

    $ unzip -d /var/www/nextcloud-13.8.1.zip

    ```


    This creates a Nextcloud directory in /var/www. We now need to tell Apache about
    it by editing /apache/sites-available/nextcloud.conf


    # Alias /var/www/nextcloud/


    ```

    <Directory /var/www/nextcloud>

    Options FollowSymlinks

    AllowOverride All

    </Directory>

    ```


    ```

    SetEnv HOME /var/www/nextcloud

    SetEnv HTTP_HOME /var/www/nextcloud

    </Directory>

    ```


    and symlinking this to /etc/apache2/sites-enabled


    ```

    $ ln -s /etc/apache2/sites-available /etc/apache2/sites-enabled

    ```


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_65_0.png)


    # Set up Nextcloud


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_65_1.png)


    # Create a database


    Create a MySQL user to access your Nextcloud database.

    You can do this with the mysql command line or phpMyAdmin. If you haven''t created
    the database yet, give the user full permission to start.


    # Add any missing modules


    Nextcloud requires several PHP modules. If you see a message like use your package
    manager to install the missing modules, go back to your terminal and refresh that
    to move on to the next one.


