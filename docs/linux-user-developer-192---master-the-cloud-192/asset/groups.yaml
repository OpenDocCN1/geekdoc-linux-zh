    What''s the goal with Ballerina?

    If you''ve worked on an integration project and you''ve done it at scale, there
    is an integration gap - it''s very frustrating to developers.


    You have two choices. You can either use it like an Enterprise Service Bus (ESB),
    which acts as a middleware - a router. That makes it possible to integrate at
