    \n# 快速指南\n\n## 真正的私密加密\n\nSSL 保护通过公共线路传输中的数据，但服务器可以读取通过它的数据——因此 Nextcloud 为客户端提供了端到端加密。对于移动客户端和开发客户端，这仍然受到限制。要使用它，你首先需要启用默认加密（Default\
    \ Encryption），然后进入你的 Nextcloud 账户。如果你点击文件夹旁边的图标，将看到加密它的选项。点击文件夹口令（Nextcloud 将显示它并将其保存在安全的地方——而不是文件夹后面），然后点击某些文件在\
    \ Web 界面上查看它们；如果你有另一台移动设备，你将密码。通过这种方式你可以看到它。当加密文件被释放时，它可以在设备之间进行共享，即使是 Nextcloud\
    \ 服务器的管理员也无法读取它。\n\n如果仅使用 Let's Encrypt 的免费证书是不支持且没有意义的。Nextcloud Collabora Online\
    \ 只需要在 Nextcloud 中安装。从应用列表的“Office & Text”部分加载该应用，然后进入“设置 > Collabora Online”并赋予你的服务器完全权限。这样你就可以通过点击它们来编辑主要类型的文件。设置页面允许你将\
    \ Collabora 的使用限制在需要的某些用户或组。\n\nCollabora 意味着几个人同时在同一个文件中工作。走进隔壁办公室谈谈我们需要的任何要好得多，这种方法不需要体力消耗，而且比会议更轻松。启用列表应用会在顶部栏添加一个新图标。在这里你可以创建列表并与他人共享。如果你想接收你的反应消息，点击列表页面上的“加入通话”（Join\
    \ Call）按钮来启动视频通话——\n\n视频通话现在是 Nextcloud 的不可或缺的一部分，包括会议电话。\n\n# 快速提示\n\n保持你的数据安全！由于对服务器有完全访问权限，你可以将\
