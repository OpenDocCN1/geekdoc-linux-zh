    - **06 News**

    Ubuntu Touch is being revived courtesy of Purism


    - **18 Master the Cloud**

    Thinking of deploying to the cloud? Well, there''s a lot to think about. Let us
    explain the options – from private to somewhere in between – and what the major
    players can offer you


    - **36 Essential Linux: Git**

    This issue we explain how to work with branches in the version-control app


    - **10 Letters**

    Suggestions, means and funnies


    - **40 Arduino: Coffee Dispenser**

    Take your coffee-pod-dispensing Arduino to the next level


    - **12 Interview**

    The creators of the ubiquitous NGINX on what its future holds


    - **44 Security: Metasploit shellcode**

    Integrate your shellcode with the Metasploit framework


    - **16 Kernel Column**

    What''s going on in the belly of the TUX


    - **58 Does Not Compute**

    Not only are there problems computers can''t yet solve, there are categories which
    may never be made. *Make Befor choices*


