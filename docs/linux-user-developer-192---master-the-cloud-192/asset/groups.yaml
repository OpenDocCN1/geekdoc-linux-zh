    ## Review Password managers


    ## In brief: compare and contrast our verdicts


    | Security and encryption | End-to-end AES-256 encryption, and salts and hashes
    the master password | Bitwarden | KeePassXC | LazLock | Password Gorilla |

    |---|---|---|---|---|

    | Password management | | In several better encryption algorithms, it also supports
    key encryption | A very simple app that encrypts information with the AES-128
    algorithm | Encrypts both master password and datastore, and repels brute-force
    attacks | Can create multiple datastores and passwords into groups and sub-groups
    |

    | Interface | Both the desktop and browser extension have clear and intuitive
    features | The GUI app and browser extension will take some getting used to for
    new users | A simple and easy to navigate is one of LazLock''s strongest points
    | The simple GUI doesn''t stand out but enhances usability |

    | Features | Overflows with useful features to help you store and retrieve passwords
    | As well as authenticates SSH sessions and supports YubiKey | Meets its peers
    in terms of features, but it''s unique for portable installation | Can import
    and export CSV, and a password generator to build |

    | Overall | Rates highly on front and managing passwords very | Has secure credentials,
    but the interface is inviting for new users | A very simple, and portable app
    that lacks bells and whistles | No obvious flaws in the app itself, but it has
    a lot of development |


    ## AND THE WINNER IS ...


    Bitwarden

    All the tools in this group test were advertised. Many list out any inherent weakness,
    but they simply outshine by the competition.


    LazLock is a prime example: it offers more than a means to store passwords. It
    is straightforward to use and you can take the app and all authentication information
    with you and run it straight from a USB stick. Password Gorilla has a sparse interface,
    but you can find additional functions and tweakable settings inside it. However,
    the app suffers from its lack of development.


    On a similar note, frustrated by the slow development of KeePassXC, we started
    the project into KeePassXC which has all the features needed for a top-tier password
    manager. It allows multiple encryption that you can combine with a keyfile. It
    has YubiKey challenge-response support authentication. You can use its browser
    extension to fetch authentication information directly to the web. All that functionality,
    though,


    Bitwarden offers additional security features, such as for YubiKey, for an annual
    fee of $10. Comes at the price of uncertainty; the app''s full functionality requires
    a trip to documentation. That''s not such bad in itself, but Bitwarden makes all
    aspects of password manager a breeze. Its desktop app, browser extensions and
    mobile apps do a wonderful job of making useful features very apparent.


    Bitwarden, the other candidates on test, stores your passwords on a remote Microsoft
    Azure cloud. While it end-to-end encryption, this respect might make some users
    uncomfortable; if you''re one of them, you can deploy Bitwarden on your own kit
    using Docker.


