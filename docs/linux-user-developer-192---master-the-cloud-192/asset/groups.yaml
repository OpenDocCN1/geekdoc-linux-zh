    > 快速指南

    创建一个 Google Cloud Function


    无服务器的革命真正始于 AWS Lambda 的发布，它创造了“FaaS”这一术语。很快，其他提供商也推出了类似的服务，包括 Microsoft Azure
    Functions 和 Google Clouds。虽然无服务器的卖点是让它快速从开发移动到部署，而无需配置、维护和维护扩展性；如果你需要运行数千个并发无服务器函数，云提供商提供按秒付费计费；你只需为代码运行的时间付费。简而言之，无服务器赋予了你终极灵活性。


