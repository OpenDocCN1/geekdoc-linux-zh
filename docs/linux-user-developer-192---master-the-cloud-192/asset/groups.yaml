    # 特别报告：KubeCon


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_33_0.png)


    ## 什么是无服务器（Serverless）？


    无服务器本质上包含两个点：函数和基本逻辑：即事件在不断发生，且万物皆事件；例如，当你向云端的 S3 存储桶上传文件时。这些事件对你来说是需要反应的，因为你不希望有像微服务这样的东西在后台空闲并产生费用。这就是无服务器事件驱动架构可以取代微服务的某些方面，它可以在云端中快速接收事件。


    Google 的倡导者 Kelsey Hightower 曾认为现在发明这种事件驱动架构还稍早了些。他认为，通过构建像 Event Gateway (https://server.com/event-gateway)
    这样的事件驱动源代理，并使用 CloudEvents (https://events.io)，可以使无服务器事件民主化，这样他们就可以构建任何你需要的系统而不仅仅是云端。


    此外，为了显示分会之间的间隔，活动提供了充足的空间让大家聚在一起解决大规模容器管理问题，但它仍然需要与网络、存储和安全等服务集成，以提供全面的容器基础设施。CNCF
    的技术指导委员会（TOC）表示，优先事项是更好的接口和更易用的开发者。


    对运行时的一个主要关注点是 Helm，一个包管理器。该项目帮助开发者简化在 Kubernetes 中运行应用程序和服务。Helm 使用 Chart 格式（Chart
    Format），该格式包含了运行特定应用程序或服务所需的 Kubernetes 容器的细节集合。


    在接口方面，CNCF 专注于为消费者创建一个使用的开放标准，这邀请了来自 Prometheus（一个开源监控系统）的 OpenMetrics。Richardson
    表示，他们希望扩展来自 Prometheus 且用于“标准化”的格式，以便人们也能将其应用于其他项目。


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_33_1.png)


    ## 跟进事件


    此外，CNCF 正在通过创建一个名为 CloudEvents 的通用规范，来对事件描述的方式进行标准化（顺便提一下，这之前被称为 OpenEvents (https://events.io)）。这很重要，因为它们为双方开发者提供了一种谈论事件的共同方式，包括自动测试和面向客户的客户端的新案例，例如创建新账户。


    上图中，Google 的 Kelsey Hightower 演示了无服务器在云端的应用范围。不出意外，无服务器是一个热点。Richardson 强调了几个基金会项目：


    - SPIFFE：它为不可信的网络提供身份验证和端到端加密。

    - Open Policy Agent (OPA)：处理策略和授权。


