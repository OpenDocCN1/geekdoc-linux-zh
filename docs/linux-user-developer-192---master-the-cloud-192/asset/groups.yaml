    尽可能靠近你的用户，以最大化性能。为了帮助这一点，许多云提供商正在对“边缘计算”进行大量投资——它将处理带到网络边缘，通过 CDN（内容分发网络）在靠近用户的地方计算，从而快速交付。


    # 一切从 VM 开始


    在自己的自己的数据中心部署应用程序意味着部署一个带有操作系统、一些存储和数据库的一个或多个服务器——但公有云的等效物是什么？假设你需要在服务器上运行自己的代码（这并不总是如此），你从实例（AWS,
    droplet, DigitalOcean, Azure）开始，你可以看到非标准的术语可能会令人困惑！在最基本的形式下，你创建的服务器是云提供商处的一个 VM。从意义上说，它感觉像一台普通的服务器，但具有远程管理和配置的额外选项。


    > 就像服务器被虚拟化一样，存储也是如此——没有任何机器具有物理磁盘


    在部署到你自己的数据中心时，重要的是先研究所需的服务器大小，购买一个，或者希望你有足够的容量并安装它。在公有云中，这来自提供商。提供商提供了广泛的选择，并且它们之间的切换是快速且方便的。就像服务器被虚拟化一样，存储也是如此。与其使用物理磁盘，你可以选择一种存储类型，例如通用
    SSD 或预留 IOPS SSD，指定大小并将其附加到你的实例。在云中，磁盘是可以扩展的（不涉及操作系统或内存）。如果你需要更多 CPU，稍后你可以将你的实例调整为不同的大小。需要更多存储？扩展磁盘，零停机时间。


    当然，拥有服务器只是体验的一小部分——你离不开操作系统。但云提供商通过提供预先构建的镜像简化了这一点，这些镜像可以在创建实例时应用到实例上。在 DigitalOcean
    中，你可以找到不同版本的 Ubuntu、CentOS、Debian 的示例，或者五个版本的 Debian 或三个版本的 CentOS。亚马逊还……


    Microsoft Azure


