    > ### Teamwork makes the dream work

    This is a great project for collaborative working between an engineer interested
    in physical computing and a coder who wants to put their programming skills to
    the test. This kit is very much-in-line with the Raspberry Pi Foundation''s philosophy
    of supporting a new generation of ''Digital Makers''. Here''s our team, left to
    right: Nadia, Olivia, Calvin, Weronome, Elshita Khastana and Devanka, for 10 GCSE
    classes Lov Lovace and Babbage.

    If you''ve ever wanted to tinker with the Raspberry Pi, create your own circuit
    and write proper code for it, this is the project for you. It wouldn''t be very
    difficult to take this kit to the next level by introducing sensors for monitoring
    ambient light, noise and pollution levels. LDR sensor and air-quality HAT, none
    of which are very expensive, and there are plenty of room on the Pi''s board for
    additional circuits.


    # 15 Pricing up and buying your own parts


    Maker''s kit costs £85. As an experiment (www.aliexpress.com) we priced up parts
    from AliExpress and were able to match off the cost, even by buying in bulk, once
    factor in the shipping costs. In fact, the pricing is on-spot and Maker does not
    seem to have much margin on this kit.


    If you wanted to put one together yourself, you''d need to order the following:


    +   - Wind sensor (anemometer) -£30

    - DS18B20 -£1

    - Resistor £0.80 (for 100)

    - Raspberry Pi Zero W -£15

    - Schneider Electric ENNO5007 EP 55 junction box -£5

    - Gland -£1

    - USB hub -£10

    - Rain gauge/meter -£10


    # 16 Next steps


    To make this station truly portable, you could add parts to the junction box,
    to power the Pi. With a wireless connection, you can then watch the weather station
    remotely via SSH or V to monitor the readings. You could also attach a touchscreen
    or LCD to display readings.

    Some additional sensors you may want to add are motion sensors, humidity sensors,
    a barometer for pressure, moisture sensor, capacitive ground moisture MQ gas sensor.
    We''d love to hear how you''re adapting and improving your weather station, so
    please tweet us photos and suggestions to @dfunuserkg'
