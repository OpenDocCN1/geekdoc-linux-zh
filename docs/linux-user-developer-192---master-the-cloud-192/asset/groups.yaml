    # 实用的树莓派


    72 “全息”音频可视化器

    发现 Aaron Tainter 和 Davis Lau 如何使用 Pi、显示器和一些巧妙的工程创建了他们自己的伪全息音乐可视化器——你可以亲手构建这个项目。


    74 让树莓派睡眠

    使用低功耗、低成本的 8 位控制器在特定时间后自动让 Pi 睡眠。


    76 构建气象站

    Pi 团队测试了 Maker Life 的气象站套装。学校 IT 主监 Calvin Harrison 和他的学生记录了组装和编写代码使其运行的过程。


    # 评测


    - **81 小组测试：密码管理器**

    这四个工具都承诺结束密码痛苦，但哪一个表现得最从容？


    - **88 硬件**

    ASUS GLAN 1200 三合星套装提供了具有扩展范围的前线网络。它达标了吗？


    - **88 Trisquel GNU/Linux 8.0**

    四年后，这个受自由软件基金会青爱的发行版经过了测试。


    - **90 新鲜 OSS**

    我们试用了 Elisa 0.1、Universal Media Server 7.0.1、BorgBackup 1.0.12 和 GitRass 08.10。


