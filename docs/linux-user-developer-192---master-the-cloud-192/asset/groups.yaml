    # ## 教程


    - **06 新闻**

    Ubuntu Touch 正由 Purism 复兴


    - **18 掌握云**

    考虑部署云服务吗？有很多需要考虑的。让我们解释一下选项——从私有的到中间的以及主要参与者能提供什么。


    - **36 必备 Linux：Git**

    本期我们解释如何在版本控制应用中使用分支。


    - **10 读者信**

    建议、含义和趣事。


    - **40 Arduino：咖啡机**

    让你的咖啡机 Arduino 升到新的高度。


    - **12 访谈**

    无处不在的 NGINX 创建者谈其未来。


    - **44 安全：Metasploit shellcode**

    将你的 shellcode 与 Metasploit 框架集成。


    - **16 内核专栏**

    TUX 内部发生了什么？


    - **58 无法计算**

    不仅有计算机尚未解决的问题，还有可能永远不会类别。*在做出选择前思考*。


    - **48 Python：加速 Jupyter**

    使用这些技巧让你的 Jupyter Notebook 表现更好。


    # # 特别报告


    - **32 KubeCon + 云原生**

    来自 KubeCon 的所有新闻。


    - **64 初创企业的 Nextcloud**

    随着 Nextcloud 13 的发布，Neil Bothwick 探讨了你如何为业务部署它。


    - **52 编程：Kotlin**

    这种类似 Java 的语言正在流行。发现其原因。


