    # 欢迎


    # 本期内容


    >> 掌握云，

    >> 初创企业的 Nextcloud，p64

    >> 密码管理器，p81


    欢迎阅读英国和北美最爱的 Linux 和开源杂志。

    你可能注意到本期是以“云”为主题的。我们在哥本哈根参加了有成千上万工程师和开发者参加的 Kubernetes+CloudCon。技术的发展既令人印象深刻又令人叹为观止。转到第
    32 页了解令人兴奋的内容。


    我们定义了公共云特征，尽管我们的调查显示这是人们想要了解的主题。感谢所有反馈的人！如果你想设置自己的开源 Nextcloud，它具有所有协作功能。本期的其余部分不涉及云……关于第
    76 页的 Pi 驱动气象站。


    联系团队：

