    # 基础 Linux


    第二部分


    ## Git：版本控制与分支工作


    了解如何在 Git 中进行分支工作，并学习如何对真实项目进行更改。


    Git 的主要目的是对项目进行协作，特别是开源项目。Git 允许协作者同时在同一个分支上工作，这可能需要一些精力来协调更改。然而，Git 的强大在于你可以在不影响他人的情况下工作。为了做到这一点，跟踪不同人的更改是有意义的，这样你就可以查看已更改并做出新的更改。


    这就是分支大显用场。分支是从主分支（master branch）分出的特定工作流。你可以做出更改并将其合并回主分支，但它们仍然保留在存储中，因此你以后可以查看。


    ## 检出分支（Checking out）


    在本教程中，我们将处理 Git 自身的的源代码。Git 的代码托管在 GitHub 上的 https://github.com/git，因此为了获取存储库的副本，我们将运行
    pull 命令。


    ```

    $ git clone https://github.com/git

    ```


    这创建了一个目录，其中包含了源代码，现在我们将探索其中的内容。


