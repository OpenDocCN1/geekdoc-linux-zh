    ## Python: Jupyter Notebooks


    ### Jupyter Notebooks: 加速你的代码


    学习如何使用可用工具榨出你代码的每一分性能。


    作为开源社区中一种突出的语言，Python 在代码开发方面有许多选择。从早期的实验到像 PyCharm 这样的完整 IDE 一应俱有。许多人在编码需求方面实际上发现自己处于这两个极端之间。这正是
    Jupyter Notebooks 在数据科学和学科中具有真正优势的地方。


    第一步是确保你安装了最新版本的 Jupyter。Jupyter 处于不断开发中，因此始终有新工具可用。你需要安装 Python 和 pip。假设你已经安装了它们并通过以下命令获取了最新版本的
    Jupyter：


    ```bash

    pip install --upgrade jupyter

    ```


    这将将最新版本的 Jupyter 及其依赖项安装到系统的用户站点库中。


    ### 启动 Jupyter


    运行 Jupyter 时有很多选项。它提供了很多选项，你可能想要深入了解细节。你可以通过以下命令查看所有可用选项：


    ```bash

    Jupyter notebook --help-all | less

    ```


    你将看到几页可用选项。


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_47_0.png)


    在 Jupyter Notebooks 之上有一种非常流行的使用方式：


    ```bash

    Jupyter notebook --browser

    ```


    这将让你能够控制 Jupyter 服务器进程的几乎每个方面。对于本文的其余部分，我们假设你在运行浏览器的同一台机器上运行 Jupyter。借此，你可以通过以下选项启动
    Jupyter：


    对于许多情况，这将运行得良好。如果你没有获得所需的性能，可以使用一些选项来帮助调优服务器。例如，*NotebookApp*、`jupyter notebook
    --port=8888` 以及最大输出数据速率。还有选项允许你更改后端中用于特定对象的类。调优需要一些实验，以便连接到你的浏览器。


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_48_0.png)


    除了键盘快捷键，底层 IPython 还有“魔法命令”


    ### Jupyter 快捷键


    在 Notebook 中，有命令模式和编辑模式。按 E 进入编辑模式。你可以使用方向键导航单元，还可以创建新单元、更改类型或删除单元。在编辑模式下——即你编写的地方——按下
    Shift+Tab 会弹出当前使用的对象的文档字符串。


    ### 运行基准测试


    在进行所有优化之前，第一步需要进行基准测试。这是因为人类非常不擅判断代码的哪些部分真正需要优化。你应该查看会话中存在哪些部分。使用 %ls 命令查看创建内容的列表，你可以通过
    %info 命令深入了解对象的细节。


    更有趣的是测量代码执行时间的魔法命令。这确实是许多使用 Jupyter 人的重点。你可以使用 %time 和 %timeit 命令来计时执行单行代码的时间。第一个命令给你一个基础的视觉显示，但你可以指定参数，例如重复代码的次数。例如，在我的系统上对
    Benchmark 显示：


    ```

    # In math import exp

    %timeit exp(log(part(1)))

    1.26 μs ± 3.45 ns per loop (7 次运行的平均值 ± 标准差，每次10000 次循环)

    ```


    这在日常使用中并不常见，然而更可能的情况是你有一整块代码需要计时。在这种情况下，问题应该是


    如果你需要更多速度，可以在 Jupyter Notebook 中使用 Python。它已经安装好了，你可以通过 %load ext 对你的代码进行更多控制。


    然后你就得到了魔法命令，%cython %python_inline 和 %python_import 来帮助加速你的 Notebooks。


