    每增加一个位推就将未来推迟了两年半——而再增加五个则将其推到 15 年后。


    天气预报引入了另一个问题。天气预报涉及建立一个包含温度、压力、风速等大气值的模型，将这些值代入模型并进行模拟，以确定数学家是否这是一个混沌系统，这意味着它对初始条件具有超敏感性。


    ## 有些问题可以用逻辑语言提出，但却是不可接受的


    无论对模型控制得有多精确，初始条件测量值的误差都限制了对未来的预测远程度。如果只有百分之一的准确率，预报可能准确持续几天——但此之后预报就会偏离现实。将准确率再提高一个百分点——这是不可能的——总会有极限。这是自然界中不可避免的事实；无论多么巧妙的计算机工程都无法克服它。


    也许最重要的观点是，用逻辑语言提出的问题——不可接受的约束——是不可接受的。这就是我们所关注的这类奇特问题。


    ## 停机问题


    作为程序员，我们都陷入了无休止的循环中，而不是终止并产生有意义的结果。因此，如果有一个软件工具能够分析程序并确定它最终会停止还是循环，将是一个非常有用的开发辅助工具。


    根据图灵的说法，这是可能的。当然，有些情况一眼看去就能发现它会循环，然后显然会终止。通常情况下，图灵声称自停机问题是不可能的；他包含了一个运行在自身之上的停机问题程序，这种条件会导致悖论。该证明方法与证明通用循环不存在的证明非常相似，尽管神谕机证明（oracle
    proof）更容易理解。


    ### 随机数


    大多数编程语言都拥有一个生成随机数的函数。当然，这些仅仅是伪随机的，遵循一个漫长且复杂的模式，对于大多数应用来说这并不是问题。但不能忽略某些情况——例如在线赌博——在这些情况下，即使是预测序列中下一个数字的微概率也可能构成风险。遗憾的是，真正的随机数是不可接受的。


    例如，金刚晶圆（Prime Bond wafers）比计算出的更好，但软件所生成的随机数是由特殊硬件生成的。这种设备被称为 ERNIE——电子随机数指示设备——其特点是——利用电阻中的热噪声。这只是用于生成随机数的许多过程之一，而
    ERNIE 实际上是一个相当的模拟计算机，这是否意味着随机数应该被后考虑？


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_58_0.png)


    ERNIE 之上是模拟计算机？真正的随机数仍被认为不可接受


    在罗马的圣玛利亚大教堂，有一块著名的游客景点石头，它在罗宾汉德的浮雕中非常出名。传说说，“真理之口”（Bocca della Veritas）曾用来辨别真伪。人们把手伸进张开的嘴里并陈述一个观点，如果是真的，则什么都不会发生；但如果他们撒谎，嘴就会闭上，封锁撒谎者。


    现在，类图灵对停机问题不可计算性的证明，让我们想象你把手放在嘴里并陈述：“你会咬掉我的”。为了证明真理之口不是万能判官，我们只需要考虑两种可能性：什么都没有发生。问题在于，这与……相反。


    ## 特性不可计算


    揭穿关于罗马“真理之口”的传说，与图灵证明停机问题不可计算性的证明非常相似。


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_59_0.png)


    在当今的计算技术中——要确定一个丢番方程是否有解。用稍微不那么数学化的语言来说，丢番方程是一个通常包含两个或多个未知数的多项式方程，仅允许整数搜索。例如 $a^4+b^4=c^4+d^4$。其中第一个是有解的，最简单的非平凡答案是
    $a=2, b=1, c=9, d=0$（或 $12²+3²+13= \+$）。如果无人解，并不意味着没有解；可能只是涉及到大数字，而试错法刚刚覆盖了一个解。在这一探索持续了
    70 年后，俄罗斯数学家和计算机科学家尤里·马蒂亚塞维奇证明了该问题是不可判定的。


    鉴于交给他的问题，你无法确定自己不会去解释所做出的陈述，所以嘴错了；它本应该砰关上的。选项二是嘴猛地合上。这也是错误的反应，因为陈述是真的，说话者本应该完好无损地缩回手。无论如何，这张脸都会出错。事实是，至少有一个陈述是无效的，这可以证明，“真理之口”并非仅仅为了触摸而闻名。停机问题的很多方面都是如此。


    机器的逻辑、可计算性问题还带我们进入更深层次的世界应用。心律失常——一种心脏疾病，在极端情况下会导致死亡——这是华威奇大学的史蒂夫·史密斯博士的一项有趣程序的课题。


    ## 停机问题之外


    ### 快速指南 停机问题


    这翻译过来，如果某些问题可以解决，就会允许停机问题的解决。根据归约原理，由于我们不得不得出这些问题是不可计算的结论。不可计算问题的几个后果也将用于调试工具，例如，确定特定代码段是否会运行，或者变量是否被初始化。确定一个算法是否能够执行已知的第二种功能同样重要。


    我们已经描述了停机问题不可计算的证明，这与真理之口无法辨别真伪的证明非常相似。如果你知道如何制造它，就理解了艾伦·图灵的核心。


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_59_0.png)


    并不是所有可计算的问题都与调试有关，正如 1900 年由……所示。鉴于交给他的问题，你无法确定自己不会去解释所做出的陈述，所以嘴错了；它本应该砰关上的。选项二是嘴猛地合上。这也是错误的反应，因为陈述是真的，说话者本应该完好无损地缩回手。无论如何，这张脸都会出错。事实是，至少有一个陈述是无效的，这可以证明，“真理之口”并非仅仅为了触摸而闻名。停机问题的很多方面都是如此。


    （注：此处原文中存在大量重复段落，根据指令“不要重复输出原文”的原则，译文已对逻辑进行了整合，仅保留核心内容。）


