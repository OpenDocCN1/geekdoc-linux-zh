    # Arduino 教程：咖啡胶机


    第二部分


    ## Arduino：制作你自己的咖啡胶分配器


    在编写了 Arduino 和 Pi 的程序来识别用户之后，是时候构建机器了。


    上上次，我们的目标是构建一台由 Arduino 驱动的咖啡胶分配机。在教程的部分中，我们将使用 Arduino 从 RFID 卡读取信息，然后将数据传递给树莓派，以便进行身份识别。如果用户的账户余额充足，树莓派将发送一条返回消息，告诉
    Arduino 释放咖啡胶囊。


    我们选择的设计是重力辅助旋转式分配器；咖啡胶囊会掉落一个孔洞，然后进入一个旋转 360 度的仓，随着仓的旋转排出咖啡胶。这里的关键特性是仓的体积足够容纳一个胶囊，因此其他胶囊必须等待而不能释放。机器将在旋转
    180 度后释放出一个咖啡胶囊。


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_39_0.png)


    完成后的咖啡机可以使用 USB 电源适配器供电。


    ## 构建仓体


    这种机制为我们提供了关于如何构建机器的大量信息。咖啡胶囊必须在容器内相对于机器的其他部分分离。容器应该有一个倾斜的底部，并在最低点有一个单孔。它必须能够旋转并牢固地固定在一个可以接住掉落胶囊的底座或平台上。底部必须用螺钉固定在侧面。完成这些后，就可以开始设计和组装了。要制作这个仓，你只需要一个至少有一个平底的圆形物体。在教程中，我们使用了任何空罐的底部，它的长度大约一个手指长，很容易填满。使用金属而不是纸板各有优缺点。虽然使用纸板，它运行得也良好。


    一旦你将罐子切成两半，你需要在侧面再开一个咖啡胶囊孔（即胶胶囊卡住的地方）。然后把手伸进去把胶囊向外推。这将有助于我们与电机连接。用锯子在罐子中心锯出一个小洞。这个洞必须比电机轴小，这样轴就可以穿过去——稍后用螺丝固定在位置。连接不是通过木块完成的，而是我们将胶囊入口插入到到位。连接处很松动，与电机的连接也是松的。为了让咖啡胶囊孔在底座中到位，并在旋转后没有空间容纳另一个胶囊。


    ## 连接电机


    为了旋转罐子，你需要一个电机。在教程中，我们使用步进电机来旋转安装在上面的手臂。步进电机允许我们控制电机旋转的速度以及


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_40_0.png)


    左：楔形紧密地固在罐内，并应从胶囊入口连接。在教程中，我们将使用步进电机（BYJ-48）为每个胶囊需求旋转一次。使用我们的 Arduino 设置和程序作为教程的一部分，我们将电机连接到驱动器。电路处理脉冲的转换，使其开启和关闭以提供平稳旋转。电机上的四个端子连接到
    Arduino 上对应的四个端子。


    与电机一起工作时，你的电机取决于你选择什么。如果有轴，连接组件非常容易，如果操作正确，你需要在机器上提供负载支撑。驱动器可以由 Arduino 供电。打开
    Arduino IDE。打开程序。在程序的顶部，添加一行来包含步进电机库：


    `#include <Stepper.h>`


    并初始化步进电机对象，传递引脚和一个定义电机必须旋转次数的常量：


    ```cpp

    const stepsPerRev = 2048;

    Stepper MyMotor(stepsPerRev, 44, 42, 45, 43);

    ```


    然后你指定旋转速度：


    -   不使用面包板


    测试通常使用面包板进行，但在这种情况下没有灵活性。使用跳线线代替排针是最简单的解决方案。然而，你应该考虑直接连接到 Arduino 和外部硬件。


    在底部，Arduino 正在等待树莓派的肯定响应，告知它可以分配胶囊。如果收到任何“ok”信号，电机旋转 360 度：


    ```cpp

    myMotor.step(RPM);

    ```


    现在，当你在读取器前使用 RFID 卡时，罐子将旋转整圈。这是胶囊掉入和离开容器的时候。你可能需要加大孔或改变边缘尺寸。这把篮变成了箱状。修剪纸的顶部以减少篮的高度，然后用胶水或胶带将其粘在框架前面。篮的底部应与框架前面的开口对齐（或略低于开口）。


    ## 安装电机


    在篮子之后，你还需要安装电机和旋转机构。这是一项相当困难的任务。电机位于罐子背面，明显比手柄重得多，因此你需要使用一些纸板将电机直接固定在篮子上方，并可能需要额外的支撑来平衡。


    ## 创建篮子


    现在你已经构造了一种利用重力分配咖啡的方法，现在是接住掉落胶囊的时候了。显而易见的方法是在容器底部建立一个滑道，胶囊可以掉进去。然而，如果你的结构很糟糕，胶囊会掉出容器。如果你运气好，这会更容易且完全位于机器内部。


    制作这一切的有效方法是使用纸板。篮子的框架可以牢固地安装在电机轴上——如果你有框架材料，完全这样做。纸板很坚固，但如果没有良好的工艺可能会不稳定。然而，你需要内部元件来固定连接。断开读取器的
    Arduino——你将使用相同的引脚将其接回来。使用螺丝在纸板上钻孔，留出直径三分之二的间隙。将螺丝穿过孔并固定在位。如果罐子开始滑动，在下方增加两个以固定罐子。


    > 跨距离与卡通信，通过纸板和塑料


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_41_0.png)


    因此，更可靠的方法是使用比罐子宽得多的篮子。在这个过程中，胶囊会轻轻地将胶囊推向机器前方。要这样做，你只需要使用一段厚纸，或者在纸的边缘切出一个弧形边缘。曲线应该是凸的，滑道向长边凹入纸中，沿着纸的宽度进行切割。


    沿弧形边缘定期切开小切口，瓣片应与纸成 90 度折叠。当你将纸向上折叠直到两端对齐时（保持瓣片向下成 90 度），纸应该形成一个半篮形状。篮的高度取决于纸的长度，这取决于切割的程度和由切割控制的深度。为了获得更尖利的着陆，你可以在弧形边缘上距离旋转中心相等的两个点处切割，并保留中间部分之前


    右电机和仓需要固定在位


