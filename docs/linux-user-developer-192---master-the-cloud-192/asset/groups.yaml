    ## Feature | Special Report: KubeCon


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_31_0.png)


    ## THE RISE OF CLOUD NATIVE COMPUTING


    **Chris Thornett heads to KubeCon to find a community hard at work building an
    agile and scalable open-cloud platform for developers**


    - KubeCon + CloudNativeCon Europe 2018 is the Cloud Native Computing Foundation''s
    flagship conference, which gathers adopters and technologists from all around
    open source and cloud native communities for a four-day event.


    Cloud Native Computing Foundation''s first KubeCon+CloudNativeCon of the year
    takes place in Bella, Copenhagen, it''s a giant rendering of building with smoking
    pipework every container made of glass lighting. It''s a setting that has evolved
    rapidly from the visitors'' spectacular container success since 2013.


    Chair of the CNCF''s Technical Oversight Committee Alexis Richardson''s keynote
    was focused on the future and he thinks it will be packed full of developers.
    In his presentation he estimates that there will be 100 million developers up
    from the cloud.


    Attendance has reached 4,300 this time, according to Dan Kohn, executive director
    of the CNCF, which is growing but that''s not surprising, as the cloud native
    computing industry is meeting the world''s demand for more platforms that can
    run across multiple locations in distributed environments.


    The expectation is that we will see all ubiquitous services on the cloud and the
    devices. The vision of CNCF and the community is to build all the foundational
    layers to create an open cloud platform for developers to simply run their code
    at scale.


    The CNCF was set up with incubating the ''building blocks'' to make an open source
    cloud ecosystem successful. You can see all the projects in the landscape (https://landscape.cncf.io/)
    and it''s an explosion of third-party technologies in recent years.


    What''s impressive about the cloud native industry is that from a start roughly
    four years ago, it''s close to an open cloud platform that it needs to share with
    the world below. It''s not there yet and needs a few more layers, but thanks to
    the foresight of the early adopters establishing CNCF, the industry''s tottering
    steps were shepherded.


    Kubernetes was the first project to be incubated as a core system for deployment,
    scaling and management of containerised applications. The CNCF has many projects
    in early sandbox or incubation stage for projects, such as logging (fluent) and
    tracing for problems (openTracing).


    At the Copenhagen event, the CNCF highlighted Vitess and NATS as two of its recent
    incubations: Vitess (https://vitess.io) was originally an internal project at
    YouTube and is a database clustering system that scales MySQL using Kubernetes.
    It is being used for a major SQL infrastructure migration project; NATS (https://nats.io)
    is a more mature project that fills the gap for cloud native, open source messaging.


    ## Opening up containers


    To understand the importance of Kubernetes we need to refer to containers. Containers,
    by design, use fewer resources than virtual machines (VMs) as they share an OS
    and run ''close to the metal''. The technology has enabled developers to package,
    ship and run applications in isolated containers without anything. Continuous
    integration/continuous delivery software (like Jenkins) and practices have been
    added to the mix, this enables companies to benefit from nimble and responsive
    automation and speeds up development. For example, any changes that developers
    make to store code automatically trigger the creation, testing and deployment
    of a new container to staging and then production.


    The idea of a container allowing only one process to run limits resources. This
    is how applications are broken down into their processes and packed inside a container,
    which makes it easier to scale in the world where enterprises are gaining confidence
    in containerization technologies.


    However, the explosion of containers has accelerated the need for a way to orchestrate
    containers. Thus a new container orchestration product has been adapted for containers,
    such as Apache Mesos, or created specifically for containers like Docker''s Swarm.


    ### JD.com, the largest retailer in China has 20,000 servers running Kubernetes


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_32_0.png)


    ## The cloud native shift


    Above Red Hat''s CTO Brandon Phillips talked about its Operator Framework, an
    new example of products making it easier to extend Kubernetes


    We asked Brandon Phillips, CTO of Red Hat, to explain why this shift has occurred
    prior to containerization, Phillips says ''You go your web server and and your
    database. After you use some Linux packages and whatever stuff together, the thing
    that you''ve done is binary code; it is easier to translate a bunch of scripts
    and recipes that you''ve followed and got modified''


    Now, is it possible to translate directly into an API? ''You say this is going
    to be a deployment, this is what I''m going to do better with these methods and
    you sell Kubernetes is what I want and what the system makes it happens'', Phillips
    says. ''This is the shift has come to be so popular. Containers are empowered
    developers. The way this, Phillips points out, at the showing for that it is so
    easy to configure your source code and everything it is a way that people can
    do as API-driven.''


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_32_1.png)


    On the airflow of the Copenhagen event, it was clear that this maturity also came
    with a crowd, as Kubernetes has easily won the battle to be the container orchestration
    of choice for developers and various needs.


    As an example of Kubernetes'' perseverance, Ranch Labs was demonstrating their
    new 2.0 enterprise interface for Rancher, which KEE says ''it''s 100 cent built
    on Kubernetes. Hey and many other vendors expect Kubernetes to be entrenched as
    infrastructure. ''We will less and less worry about the infrastructure and more
    about building stuff off on top.''


    This year, the CNCF is moving on to other challenges. While Kubernetes abstracts
    all of the complexity

