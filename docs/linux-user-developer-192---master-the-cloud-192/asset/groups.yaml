    # 快速指南


    ## 单元：说我的语言


    Unit 于 4 月发布，是 NGINX 新项目中的第一个。是一个非常轻量级的应用程序服务器，可以使用多种语言运行代码，同时通过 API 进行管理。这意味着，Gareth，你可以快速地更改配置。


    Unit 的理念源于微服务，公司正在重构其应用程序，并将其拆分为可以在容器中运行的小型组件。Gareth 补充道，微服务允许更快速的扩展和并行开发；它让开发者能够为他们解决的每个问题使用最佳原生工具。你不需要在任何地方都使用相同的应用程序栈。例如，他们可能正在构建
    Web 前端，而 PHP 是这方面的最佳语言；他们可能正在构建数据库，那么 Go 集成 Python 模块是最好的。因此某些部分可以用 Python 编写，另一个处理部分也可能是其他语言。


    微服务鼓励开发者针对当前的问题使用他们想要的语言。这对于开发者（也就是我们）来说是一个巨大的优势。


    就像新兴的云原生技术一样，NGINX Unit 的最初愿景是让运行代码（在此情况下是应用程序代码）变得更容易，并抽象化关于其实可行性的问题。正如提到的：


    > “当我们采用这些应用程序组件并将其放入应用程序栈中时，你会有 17 种不同的语言。你必须弄清楚如何处理它们。如何管理它们？”


    NGINX Unit 的第一个版本是一个可以运行多种不同语言的服务器，Gareth 说它已经实现了这一目标。“我们可以运行 PHP、Python、Ruby、Go
    和 Perl，并与它们进行集成。”一旦你部署代码并这样使用，同时使用 NGINX 的 API 部署代码，你将拥有相同的运行时、栈、API 和监控，这降低了操作的复杂性。


    啊，是的，Kubernetes 正在变成一种商品，它们现在是运行容器的默认平台。它是一种随处可见的商品，如 AWS、Azure、Google 等。它的工作方式是这样的。这正是它成为商品的原因，它无处不在，对于大多数地方都是如此，而不只是我们。它周围有一个庞大的生态系统。NGINX
    是该生态系统的一部分，我们处理一些网络流量管理、高可见性和扩展。还有其他工具可以涵盖这些领域，它们并没有填补 Kubernetes 的空白，而是在上方叠加了额外的服务。例如监控和安全。每个领域都有相应的生态系统——备份、集成、CI/CD、捐赠。如果你见过我们的云原生版图——那是他们的擅长。


    # NGINX 允许你从用户端构建网站的基础设施


    是的，这非常迷人。这也揭示了他们现在的产品现状，尽管 NGINX 已经有三年的历史了？


    是的，大约有三年的了，他们已经在上面产大约 200 个产品。如果你是一个年轻的开发者，并且准备使用 Kubernetes，决定使用哪种代码栈是非常困难的。


    企业拥有规模。他们正在从传统的层架构（基于 Java 的应用程序）转向这里。或者经典的三层、可能是基于 Ruby 的应用程序。他们意识到他们能够更快速地转换这些应用程序，更快速地应用更改；从网上获得的所有倡议都是关于：“我需要新功能。我需要一个新服务来支持新客户。我明天就要完成。”


    一周后：“额……”


    他们意识到传统的栈不支持这种开发速度。CNCF 在汇聚那些有助于支持该点的技术方面做得非常好。你需要深入其中。


    有四项关键的核心技术：

    - DevOps，一种运行你时间的文化方式。

    - Kubernetes，一种在就现场的操作方式。

    - 容器，用于打包和交付的技术。

    - 微服务，一种人们正在处理的架构，允许他们独立扩展应用程序。


    这四项定义了现代构建应用程序的方式，而这种方式创造了巨大的复杂性爆炸。你不能像我们能够的那样依靠单一供应商。拥有 CNCF 版图，并可以从中挑选和组合。


    我们的角色是尝试解决该版图中我们认为——我们知道——我们可以解决的特定领域。


    # 那么，你带了什么去 Kubecon？你的推销点是什么？


    我们的推销点是：接触并了解 NGINX。NGINX 不仅仅是我认为的东西，而是一个每个人都知道的人。这不像任何一个组织是不受信任的。它非常轻量级。


    我们对你说什么？NGINX 不仅仅是你使用的一个包。NGINX 是一个非常优秀的 NGINX，它有一家业务研究并开发你所使用的 NGINX 开源软件。其商业版本是由
    NGINX 构建的 NGINX Plus 业务驱动的。


    所以第一步是：让你知道我们有很多可以做的事情：因为 NGINX 绝对是我们用于连接的工具。如果你需要连接网络，NGINX 是此事的完美选择。我们有应用程序防火墙，所以你可以安装并清理流量。我们可以运行负载均衡和重定向，所以你可以使用
    NGINX 更改你的应用程序架构。我们有 API 控制器，而且我们还有一些计划中的项目，对于这里的与会者来说可能令人兴奋。


    如果你处于使用 NGINX 实例的位置，可以通过购买 NGINX Plus 来支持开源项目，并获得一系列企业级功能。


    NGINX，这个你熟悉并欣赏的开源项目，由一家销售软件和支持的商业公司提供资金支持。额外的功能保留在 NGINX Plus 的伞下。这是一个比社区版更强大的软件负载均衡器、Web
    服务器和内容分发。这包括会话持久化、通过 API 配置 NGINX 的能力以及主动健康检查。


    “我们有更有规律的发布节奏，”Garrett 说道，“我们在 Kubecon 惊讶地发现，很少人知道 NGINX Plus 已经存在。如果你在开源项目或产品中使用
    NGINX，公司可以为你提供每个不同版本的测试。不仅如此，NGINX 在商业端未完成的 80% 的工作都回到了开源社区。”


    为我们工作的人间接地支持着社区版。这是因为我们与社区建立了业务关系，我们将创新带到社区版中，并创建了像 gRPC 协议这样的东西。这是一种可以直接调用服务器应用程序或本地代理上方法的远程协议。


    所以这有一种协同效应。社区版将从其他用户在社区产品方面所做的贡献中受益。然后我们是新产品。我们有一个正在开发的新应用程序服务器产品，称为 NGINX Unit，以及一个新的控制面产品，称为
    NGINX Controller。如果你将这些产品组合在一起——NGINX 反向代理、NGINX Unit（应用），然后是控制面 NGINX Controller——我们的愿景是这将创建一个单一的集成平台，允许你部署和运行所有其他应用程序。这是一个非常令人兴奋的愿景。这在发布方面方面是一条出路，我们必须构建底层技术来实现它。这就是我们梦想的。


    那么第二个挑战随之而来：你如何将所有这些微服务连接在一起？你一定听过像 Istio 这样的项目。它非常流行，因为它承诺解决一个非常重要的问题，即：管理成百上千个的微服务。当我把它们放在
    Kubernetes 中时，这个微服务如何与另一个微服务通信？它如何发现其他微服务？


    观点是，我们随着向微服务的迁移获得了更多东西。企业和个人开发者面临的挑战——使用 Kubernetes 等平台的挑战——在于它们变化得太频繁了。关键在于我们如何使用我们拥有的技术来解决这些挑战


    '
