    \ _profiler module_ 并在 Jupyter Notebook 中使用它。\n\n此外，尽管你正在尝试解决代码执行时内存耗尽的令人疼的问题。为了帮助这个问题，你可以在代码中使用一个内存模块。如果你还没有安装它，可以直接从你的笔记本中安装。\n\
    \n> 有时，问题在于代码执行时可用内存耗尽的令人疼的问题\n\n```bash\n!pip install --user memory_profiler\n\
    ```\n\n一旦安装完成，你可以使用以下命令运行它：\n\n```python\n%load_ext memory_profiler\n```\n\n你可以配合你的代码运行它：\n\
    \n```python\n%%prun -mem_func\n```\n\n此命令会追踪给定的函数以及每行代码执行后使用了多少内存；输出示例请参见图 2。你可以识别出哪些行占用空间最大，并查看你可以做什么来处理内存使用，从而通过让代码更\
    \ Pythonic 来获得一些收益。首先，让我们看看一个场景，你可能创建了一个初始整数列表作为起始点。在许多问题中，例如，你可能需要创建一个整数列表，以下是很好的处理方法：\n\
    \n```python\na = []\nfor i in range(10000):\n    a.append(0)\n```\n\n起初看起来是这样的。但实现相同结果的更\
    \ Pythonic 的方法是使用代码：\n\n```python\na = [0] * 10000\n```\n\n这不仅更快、更清晰，而且当你使用 %time\
    \ 魔法命令时，它还会显示其耗时。第二个示例是你想拼接字符串而不是列表时。假设你有一个字母列表，你可以通过代码将它们拼接：\n\n```python\ns\
    \ = ''\nfor let in letters:\n    s += let\n```\n\n再次，考虑到 Python 的解释方式，这实际上更快。下面的代码运行得越来越快：\n\
    \n## 图 2\n\n运行 **time** 显示该版本快了 5-6 倍。最后一个示例是你正在一个集合中搜索它时。如果你有一个列表，可以使用以下方式搜索：\n\
    \n```python\nfor let in letters\n```\n\n另一方面，你可以将列表转换为集合（set）并执行相同的操作：\n\n```python\n\
