  mdcn: "\n雨量计。松开所有的端子螺丝（但不要完全拧出来），将温度计的三根铜电缆插入端子块中，并拧紧螺丝将其固定。从左到右，顺序应该是黑色、红色和黄色。接下来，我们将处理风力传感器的橙色和绿色线（同样从左到右），然后是雨量计的橙色和绿色线。当这些都固定好后，我们就可以处理另一侧了。\n\
    \n![](img/812f46ecd05a8f8c79d0ofa04dd898b1_76_0.png)\n\n![](img/812f46ecd05a8f8c79d0efa04dd898b1_76_1.png)\n\
    \n# 06 操作系统选择\n\n插入 SD 卡，接上电源，我们就可以开始了。在开启之前，务必检查电源和 USB 集线器是否连接正确——它们在树莓派板上上标记为左侧是\
    \ USB，右侧是电源。\n\n准备好编码了吗？在此之前，我们需要下载并安装一个操作系统。 microSD 卡上默认安装了 NOOBS，只要你有可用的 Wi-Fi\
    \ 连接，你可以在选择过程中下载它。我们推荐使用 Raspberry 选项。如果你没有 Wi-Fi 连接，将需要一个 USB 以太网适配器和电缆。\n\n\
    # 04 端子块到树莓派\n\n这里变得有点棘手了。在端子块的反面，我们希望按照从上到下的顺序将公对母连接器的公头端连接起来，在第一个引脚处将黑色电缆连接到温度计。然后是黄色、紫色、绿色和橙色。在红色和黄色之间，我们还需要包含一个\
    \ 4.7k欧姆的电阻。为了防止过大的电流通过温度计。电阻应该紧紧地贴在公引脚旁边。像之前一样固定所有螺丝。嗯，你需要在端子块上留五个空位，这是正常的；你可以利用这些空位进行额外的安全防护。\n\
    \n# 05 连接到树莓派\n\n使用树莓派 Zero 的 GPIO 图表，将公对母电缆/连接器的末端连接到以下引脚：黑色第 6 脚（地线），紫色第 7 脚（BC4），绿色第\
    \ 9 脚（地线）；第 11 脚（BCM），第 13 脚（BCK）以及红色电缆在第 17 脚（3V 电源）。一直到底部的第 20 脚（GND）。这将帮助你完成所有外部电缆和布线的设置。现在你可能想使用\
