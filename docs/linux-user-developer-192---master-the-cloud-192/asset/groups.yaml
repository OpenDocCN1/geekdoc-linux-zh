  - '[PAGE 72]


    # 3D projection


    The pseudo-holographic projection is created by reflecting the audio-visualiser
    playing on the monitor at 45 degrees. This has a parallax effect and makes the
    reflection seem 3D.


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_72_0.png)


    # Monitor


    A 24-inch monitor located at the top of the device is used to generate the ''holographic''
    display. It''s connected to the Raspberry Pi via an HDMI cable, running alongside
    a power cable, hidden behind the frame.


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_72_1.png)


    # Acrylic pyramid


    The most challenging part of the build, the three-sided pyramid with a 45 degree
    slope is made up of three pieces of acrylic sheets. A 3D-printed frustum joint
    holds the sheets together at the correct angles.


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_72_2.png)


    # Components list


    +   - Raspberry Pi gesture breakout

    - Pi Supply Flush

    - 24-inch computer monitor

    - 0.093-inch acrylic sheet

    - 0.118-inch black foam PVC sheet

    - Various sizes of wooden planks

    - Handful of screws

    - Hand drill

    - Spray paint

    - Some 3D-printed brackets


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_72_3.png)


    # Track changer


    The Flick gesture-control board is connected to the Raspberry Pi inside the 3D-printed
    housing. You can control volume, music playback and change the animation of the
    visualiser using simple gestures over the motion control boards.


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_72_4.png)


    # Wooden frame


    The top frame holds the monitor and is a rectangle with a loop on the inside.
    The bottom frame has two columns at the back to hold the top frame.


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_72_5.png)


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_72_6.png)


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_72_7.png)


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_72_8.png)


    # 3D-printed parts


    The project uses several 3D-printed parts, including the frustum joints holder,
    brackets for the monitor and the Raspberry Pi. You can find the .STL files for
    these components on the project''s hackster.io.


    # Frustum joints holder


    The creation of the joints was one of the trickiest parts of the build. A 3D-printed
    holder, bolted to the centre of the frame, was used to slide the three acrylic
    sheets at various angles for the projection to work.


    # Black PVC


    The base and the back side are covered with black PVC sheets that help light and
    also the ''holographic'' effect stand out strongly in front of the dark background.
    The sheets help them fit the 3D-printed brackets.


