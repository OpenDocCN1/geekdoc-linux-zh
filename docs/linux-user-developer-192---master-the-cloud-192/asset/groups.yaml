    ## Review Trisquel GNU/Linux 8.0


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_87_0.png)


    ## 发发行


    ## Trisquel GNU/Linux 8.0


    除了 2.5GB 的主发行版外，Trisquel 还拥有一个 950MB 的 Mini 版本以及基于 Sugar 环境的 TOAST 版本。


    自由软件基金会喜爱的发行版在停滞四年后回归了。


    如果你没有听说过 Trisquel，那是可以被原谅的；该发行版的最后一次发布是在四多年前。但正如发布公告提到的，自由软件基金会（FSF）自上次以来已决定举办
    LibrePlanet 会议，以为自己本身创建一个一套新的基础设施。


    它并不遵循 GNU 的自由软件准则。但 Trisquel 不仅仅是重新封装 Ubuntu，因为寻找非自由内容是一项非易事的工作。此外，当开发者采用一个非自由组件时，他们必须在不影响其他组件的情况下处理该环境，这是一个复杂且繁琐的过程。


    Trisquel 由西班牙的维戈大学创建，旨在创建一个支持加利西亚语的教育发行版。但该项目超出了其初始目标，变成了一个支持多语言的自由发行版。2005年4月，它被理查德·斯尔曼接管，现在由
    FSF 理会成员 Rubén Rodríguez领导。


    Trisquel 使用 Linux-libre 内核，该内核以 Linux 内核为基础，并移除任何不包含源代码或以专有许可发布源代码的自由软件。这并不是该发行版的唯一目标。它的开发者还致力于让
    Trisquel 看起来更有吸引力且易于导航。


    对于普通用户来说，这个基于 Ubuntu 的 Trisquel 似乎只是通过剥离非自由软件包来重新上游软件包——


    Trisquel 使用修改过的 Ubuntu 安装程序来让用户遵循某些最佳实践。


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_88_0.png)


    > 当开发者移除一个组件时，他们必须确保其保持在自由版本，且不会对其他组件产生不利影响。


    为了确保数据的安全和隐私，像 Trisquel 这样的系统会要求用户通过提供安全密钥来对其分区进行加密。你也可以选择覆盖空磁盘空间以获得更高的安全性。


    Trisquel 8.0 的重大变化是它基于 Ubuntu MATE 桌面环境，取代了之前的 3D MATE 合成器功能，后者需要更多的图形驱动才能正常运行。Trisquel
    在 Linux 内核开发进程方面落后了。


    另一个缺点是 Trisquel 8.0 是基于 Ubuntu LTS 16.04 的发布周期。然而，好消息是，它可以在基于最新 Ubuntu 18.04 LTS
    的 Trisquel 9.0 上运行，后者已经准备就绪。缺点无疑是 Trisquel 从 Ubuntu 中剥离专有部分所需的时间。尽管如此，你应该跳过 Trisquel
    8.0，因为团队将对该版本提供安全更新，直到 2021 年 4 月。


    ## 优点


    - 一个功能齐全且特性丰富的 Ubuntu 发行版，让用户掌握控制权。


    ## 缺点


    - 开发处于处于一种不稳定的状态，最好等待上一个 Trisquel LTS 版本。


    Trisquel 8.0 包含了我们选择的主流应用，如 LibreOffice 和 VLC，但也缺少许多目标。例如，我们在浏览时发现 Trisquel 使用的是
    Firefox 的升级版本。然而，根据公告，Abroser 非常适合并设计用于在不牺牲易用性的情况下最大化用户的隐私。除非用户通过此类扩展和地理定位器连接到特定网站，否则浏览器不会自行建立任何连接。Abroser
    还有一个隐私增强扩展列表，每当你启动浏览器或切换到新标签页时，这些扩展就会激活。


    除了软件，它还提供了超过 25 个在线自由软件包的访问。它包括有关账户和更新的报告。考虑到发行版会对每个软件包进行审查和定制以确保它们不包含任何非自由部分，这一点尤为重要。


    Mayadore Sharma


    ## 总结


    为了让发行版符合严苛要求而不剥夺自由的核心特性，付出的努力，是 Trisquel 成功应对的意识形态与实用主义之间的微妙平衡点。


    ## 新鲜的自由与开源软件


    ## 音乐播放器


    ### Elisa 0.1


    #### KDE 第一款外观时尚的播放器发布


    Linux 桌面并不缺少音频播放器，但流行的那些都早于它们运行的现代环境。KDE 开发者决定通过从零开始创建一个新的音乐播放器来解决这个问题。它被称为 Elisa。根据开发者介绍，该程序“努力变得简单且易用”。虽然它与
    KDE 桌面集成得良好，但开发者希望它在 GNOME Shell、其他桌面环境或 Windows 和 Android 等平台上也能同样轻松自如。


    Elisa 目前具备了其他现代音乐播放器的所有花哨功能，且功能完备。真实的界面允许你通过艺术家、曲目搜索音乐，还可以创建和管理播放列表等其他功能。


    你可以从它的 CopR 仓库（https://copr.fedorain.org/copr/elcipisa/）安装该播放器。Ubuntu 也有 PPA，但这里有一些可能帮助你安装的报告。


    ![](img/812f46ecd05a8f8c79d0efa04dd898b1_89_0.png)


    上方。应用程序努力变得简单且易用。


    - Elisa 目前具备了其他现代音乐播放器的所有花哨功能，且功能完备。

    - 真实的界面允许你通过艺术家、曲目搜索音乐，还可以创建和管理播放列表等其他功能。

    - 你可以从它的 CopR 仓库（https://copr.fedorain.org/copr/elcipisa/）安装该播放器。Ubuntu 也有 PPA，但这里有一些可能帮助你安装的报告。

    '
