    # Build a weather station


    You don''t need to train in meteorology to understand the weather – just ‘coding
    for kids’; it produces a Raspberry Pi and a kit


    Maker Life''s tagline is ''coding for kids''; it produces pre-developed kits for
    parents, teachers and children with an air of making coding and easy at cost.
    We''re going to take a look at its most comprehensive weather station and see
    just how much one can learn about the world around us with Raspberry Pi Zero and
    W of sensors. This kit is a bit of a do-upper. We''ll need to spend time building
    the weather station and putting the sensors together before we get down and dirty
    with any Python code. There are no soldering requirements, but the kit is moderately
    difficult to assemble. It seems important to Make Life that its kits are as accessible
    as possible and designed to appeal to girls as much as boys. We''re going to put
    these ideas to the test and record the feedback of some GCSE Computer Science
    students for one. All assembly and coding in this tutorial has also been verified
    by a group of female teenagers.


    +   01 Checking for parts

    Before you partake on any journey into physical computing, it''s always important
    to check the kit. Halfway through our assembly we''d lost two essential pieces
    of the puzzle: it was only moments before we were assigned to order replacement
    that we discovered the white boxes camouflaged at the bottom of the lower box.


    This particular kit should contain: Raspberry Pi Zero; microSD card; power supply;
    rain gauge; sensor (DS18B20); anemometer; waterproof sensor; USB hub; HDMI cable;
    HDMI to adapter; USB to Micro-USB adaptor; terminal block; 10 male-to-female connectors;
    4.7 Ohm resistor, and a guide.


    +   02 Waterproofing

    Obviously, that our weather station will be used outside. It''s essential that
    it is somewhat waterproof. There a water-resistant box was included in the kit;
    you''ll need to decide which cables will be at the top and then remove a grommet
    from the bottom of the shortest side). Replace that grommet with the included
    glue, which would go through all the wires - it needs to be on the bottom so as
    to avoid rain leaking when we''re done.


    Through the cables that you''ll be connecting to the Raspberry Pi from the sensors,
    including the wind sensor, thermometer and rain gauge, you should have exposed
    the wires if they don''t; then you''ll need to pull the ends off (ours had an
    Ethernet/phone-wire stripper) and strip the wires yourself for the next few steps.


    +   03 Terminal circuitry

    The included terminal block is used to transition the stripped wires-ends to the
    male-to-female jumper cables and connectors that can be plugged into your Pi''s
    GPIO headers.


    You can use any other, but to make life easier we''ll do in order of thermometer,
    wind sensor,


