    \ NumPy 中，数组只需要检查一次操作操作，并且几个复杂的函数被移动到了 C 库中。通过这种方式，像矩阵乘法或求解方程组可以由高效的 C 代码处理。另一个关于\
    \ NumPy 加速的示例是，假设你有其他函数需要应用到一系列数据元素。你可以使用 map 函数来获得加速。例如，你可以计算整个列表的目标值：\n\n```python\n\
    result = np.tan(a)\n```\n\n这比通过遍历列表尝试相同的操作要快一点。\n\n## 接下来做什么？\n\n正如你所看到的，Python\
    \ 具有这种速度的原因经常被忽视；许多程序是因为没有以 Pythonic 的方式使用 Python。编写你的代码以使用最适合的工具几乎可以提高速度。即使你已经获得了足够的加速，也可以使用额外的模块（如\
    \ NumPy）来绕过开销较大的 Python 特性。确实，这只是在 Jupyter Notebooks 中可以获得更多内容的起点。\n\n"
