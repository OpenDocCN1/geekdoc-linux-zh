    # Welcome


    # in this issue


    >> Master the Cloud,

    >> Nextcloud for Startups, p64

    >> Password managers, p81


    Welcome to the UK and North America''s favourite linux and open source issue.

    You may have noticed quite a ''cloudy'' theme to this issue. I jumped off to Copenhagen
    to attend Kubernetes+CloudCon with thousands of engineers and developers. A steep
    upward trend and the complexity of technology is both impressive and frankly mind-bending.
    Turn to page 32 to find what''s so exciting about this growing industry.


    We denote the feature in public, and cloud as, although our survey indicated that
    it''s a subject people want to know about. Thanks to everyone who responded! You
    are helping us make the mark better and better. If you want to set up your open
    source Nextcloud, 13, with all its collaborative features for remote workers and
    data storage, we present. The rest of the issue doesn''t involve cloud, although
    on page 76... Sorry about that Pi-powered weather station on page

