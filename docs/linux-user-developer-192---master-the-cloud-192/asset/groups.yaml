    # # 读者来信与开源


    关于杂志、Linux 的问题与意见


    ## 在西方闻名


    亲爱的 LU&D：说实话，过去一年来，我一直从当地书店（美国科罗拉多州）购买 LU&D 杂志，我认为自己是一个新手级 Linux 用户——主要是因为我对 Linux
    有不同的看法，这种观点是从 Windows 出现之初就开始想象的。


    我几年前开始接触计算机，是为了记住一些程序（以及，它们是如何从磁带驱动器存储中出来的），在 BASIC 上写过一点简单的程序，并实际上尝试过计算机早期的一些东西。我了解的知识没有你们现在这么丰富。如果我以后能让
    Linux 原生运行《魔兽世界》（真的，任何发行版都行！），我会抛弃 Windows。


    最近我将一台 HP 1610 客户端转换成了可搜索的 Ubuntu 机器，虽然实际上没什么用处，但我从你们的杂志中获得了一些好主意。在这次转换过程中，我比预想的更深入地了解
    EFI 和 UEFI 启动，因为安装在内部闪存驱动或我一年前装上的 2.5 英制 SATA HDD 上。我不认为我会有机会尝试那个，但如果我在的话，阅读你们的杂志带给我比其他时候更多的信心。


    我承认，你们发表的大部分内容都超出了我的能力范围（包括 CLI 相关内容），但我正在学习，并坚持每个月去一次书店寻找你们的优秀佳作，并知道你们在英国以外的更多地方也受到推崇。


    David Helmer


    Chris，我记得我也做过类似你的事情。在我的例子中，是在 Amstr CPC-464（绿屏）上的 BASIC 命令组，我们还靠此赚了钱。很高兴你改进了你的，或者说是
    cogones 的。你们的终端设备（terminal ends）并不难学。特别是安装应用程序，如果有缺失的依赖项，使用 `apt-get` 可以非常简单。（这些某些软件所需的软件包，如果系统中还没有，它们需要单独安装。它们也会被其他软件使用。）由于有了像
    snap 和 flatpak 这种会将依赖项打包在内部的冲突机制，感觉简直像是一片混乱。


    在 Linux 数据库上快速查看《魔兽世界》，它给出了高分，有支持是好的，也许你可能愿意承担尝试让它运行的麻烦，但当 Valve 和许多其他已经成功将游戏迁移过来时，这确实是一个遗憾的现状。我们只能希望
    Valve 能开启 Linux 平台游戏的新时代。关于 EFI 和 UEFI，也许我们该时候写篇说明来解释它们是什么并解决常见问题了？大家怎么看？


    # 竞赛


    ### 本期获奖者：David Helmer


    分享你的知识、建议或吐槽，如果你愿意的话，请将信件发送至 editor@istorage.com。我们有一个 16GB 的 istorage USB Pro
    0.3 闪存盘，仅需 8 英镑！除了 XTS-AES 256 位加密外，该驱动器带有一个可充电电池，使你能够在连接到 USB 接口之前无需键盘即可安全锁定驱动器。如果验证失败，数据将被永久删除。查看此处
    istorage-uk。


    # # Can 有多个吗？


    收到这本杂志的订阅我非常兴奋！我想对可能感兴趣的内容做几点笔记。我认为我开发了一个可以在所有 Linux 发行版运行的新软件系统。我认为这个软件可以移植到所有的
    Linux（只要该发行版支持所有内容）。


    我想知道，对于 CD，你们会如何分发？我想制作一个多启动安装程序，与我现有的 Ubuntu MATE 以及现在 USB 驱动器上的 MX7 一起使用。我不知道如何设置它。


    Daniel Huxley


    Chris：感谢分享你正在做的工作，Daniel。听人们在 Linux 世界里做的事情很有趣，尽管我想我们是否需要比目前有的更简单的安装方法。也许我们应该考虑参与
    AppImage、Flatpak 或 Snap 项目，而不是？


    回答你关于 DVD 的问题，Best Bootrich 确认了我们的选择。我们对它使用 GRUB-B。GRUB 的优势是还可以自动处理混合系统。


    你正在使用 MX Linux 17 也是很好的。这也是我们选择将其录入光盘的原因之一。我们从最近的读者调查中知道 Ubuntu 是我们读者的首选发行版，其次是
    Debian，但我们认为突出那些具有独特特征的即将推出的发行版是非常重要的。


    关于：它可能没有 Ubuntu 的粉丝，但我们喜欢在光盘上突出像 MX Linux 17 这样有趣的 Linux 发行版


    # # 存疑的结果


    把另一个拉出来吧，它一直在上面了！新的桌面 XP 得了 10 分！它难道没有坏吗？为什么还有人增加新功能并为“稳健”的 Linux 系统用户收取高价？他们为此付了多少钱？我爱这本杂志，你们表现得像冠军一样！


    John Hell


    Chris：这真的需要 Paul 来回答——Paul 在这里。评测者处于一种列出各种不同硬件的羡慕位置，但你知道他们真正想要什么，问问他们日常用什么，并花了自己的钱买。我买过超过三个不同的
    XP TIB，但还没有注册过任何一次购买。如果你用过它，这个想法的礼物值得保留。


    左边，不，我们没有因为 debit XP 得 10 分而得到厚厚的信封，13 9370。这是什么，1975 年？他们赚钱了吗？（开玩笑的！）


    # 开源你的 Linux 新闻与观点


    # 访谈 NGINX

    NGINX：方向转变


    作为大多数网站的反向代理，“线上的路障”有着宏大的野心。我们在 Kubernetes + CloudNativeCon 访谈了 NGINX 关于其愿景


    NGINX 是开源界的家喻户晓。它在 13 年前作为服务器首次发布，也可以用作反向代理、负载均衡和 HTTP 缓存。对于 NGINX 的产品负责人 Owen
    Garrett，他在软件工程领域拥有 15 年经验，并希望领导云网络业务，因此我们问了行业发生了什么变化，以及 NGINX 有什么方案。


    SSL 解密和身份验证，使得你的 Web 服务器、Web 应用程序不需要做这些。我们正在讨论这些复杂性，而且它们同样适用于 Kubernetes。


    如果我们退一步，NGINX 真正允许你做的是向用户隐藏 Web 服务器的基础。网站是为应用程序设计的。他们看不到平台或架构。他们所做的就是连接到 NGINX，我们将流量路由到正确的内部。


    Owen Garrett：在 NGINX，我们处于网络空间、服务网格空间、路由空间，并且在应用空间周围有一些新项目。我们负责落其中的部分


    '
