    ## 功能未计算


    ![](img/812f46ecd05a8f8c79d0ofa04dd898b1_61_0.png)


    | 执行指令 | | | | | |

    |---|---|---|---|---|

    | 0 | 1 | 2 | 3 | 4 |

    | 5 | 6 | | | |


    “芝诺机”与今天的计算机相似之处在于，它们像你桌子上的 PC 一样，以数字化的方式运行，按顺序执行指令。当程序运行时，第一条指令的执行速度是前一条指令的两倍，而这个时间取决于机器的时钟频率。然而，这与普通
    PC 的相似之处仅此于此。在芝诺机中，速度会不断加快，使得每条指令的执行速度都是前一条的两倍。其影响是惊人的：第一条指令需要半秒钟，第二条意味着四分之一秒，以此此类推。当我们达到一秒钟时，计算机已经执行了无限次指令，这将通过简单运行程序来查看它是否运行解决停机问题。


    > 某些计算可能会开始利用黑洞使时间静止，但将允许解决停机问题


    如果能够计算出莱廷格常数的前许多位，那么就有可能确定任何相同长度的程序是否会停止。这将导致一系列其他无法接受的问题。由于其巨大的威力，莱廷格常数被称为“哲学家的常数”：我们永远不知道它的大小。


    在论证了逻辑问题无法解决这一事实后，我们现在


    -  主要议题：相对论超计算机


    ## 相对论超计算机依赖于时空中的不同点经历的时间不同的这一事实


    芝诺机是此类情况的一个例子：一个有趣的奇闻，但无法被制造，因为它受到许多基础物理定律的限制。我们的下一个超计算机示例运行的时间与其他计算机并不完全相同，但在物理意义上是不存在的。


    时空中的相对论超计算机所经历的时间是不同的。黑洞就是一个例子，因为它们的引力强大到连光都无法逃脱。


    我们将通过建议这些问题在某种超计算机出现之后可以得到解决，来反过来颠覆这一观点。超计算机是一种可以解决许多无法接受问题的计算机，包括停机问题。症结在于，如果我们有一台超计算机和无限的时间，我们极可能永远无法回家。所以让我们先回到停机问题。


    我们已经看到，无法确定一个程序是否会停止。一个常见的反对意见是，应该通过运行程序来找到这个问题的答案。在某些情况下，它会停止，并得出一个取决于步数的延迟。但面对无限，我们知道在这里程序看起来可能不会停止——但无论我们等了多久，心中总会有一个挥不去的疑虑，认为我们等得还不够长，不足以判定它陷入了无限循环。在看到结果之前，你永远没有足够的时间。所以，让我们来看一种可能的超计算机架构：


    这是唯一一个关于特殊类型巨大旋转黑洞（如克尔黑洞）的实际实现的例子，但放置在那种速度下的计算机在黑洞附近看起来似乎是以无限速度运行的。然而，它将拥有无限数量的指令，因此解决了停机问题。这里有几个问题，但事实是计算机足够可靠可以永远工作，并且需要无限的能量源。那么，最好不要近期就对超计算机寄予厚望。


