- md: "\nAIPbin3 the coverdisc. The first file is a shellcode test harness in C using\
    \ the mmap() technique described, whereas the other two are shells to test. If\
    \ you want to test the first one, you need to compile the test harness with -m32\
    \ flag because it's a 32-bit shellcode:\n\n```bash\ngcc -m32 /testshellcodemap.c\
    \ -o testshellcodemap0\n```\n\nYou can compile the 64-bit counterpart by running\
    \ gcc ./testshellcodemap.c -o testshellcodemap64. Once you have your shellcode,\
    \ you can use the proper harness: testshellcodemap32 for 32-bit and testshellcodemap64\
    \ for 64-bit shellcode. This shellcode will bind a socket to TCP port 4444. You\
    \ can check it by running netstat -antlp | grep 4444. Note: I used Metasploit's\
    \ --colorized option here.\n\nOnce you have your shellcode harness ready, you\
    \ can start writing your own shellcode. Finally, once you have it working, you\
    \ can integrate it into Metasploit. Metasploit includes a bunch of Bind TCP shell\
    \ payloads for various architectures, such as linux/x86/shell_bind_tcp.bin64.\
    \ This payload binds a socket to port 4444 and executes the shellcode automatically.\
    \ You may not want that. What about expanding this payload to allow a connection\
    \ from any IP address?\n\nA classic Bind TCP shell implements a simple call to\
    \ connect(NULL), which is a call to socket() - see socket_connect(), by using\
    \ something like the example below. This will make a remote TCP connection (see\
    \ http://blog.list.uddev.shellcode). This greatly simplifies the shellcode, and\
    \ if you\n\n# Figure 1\n\n```c\nint fd = open(argv[1], O_RDONLY);\nif (fd < 0)\
    \ {\n  printf(\"Error opening the shell-code:\\n\");\n  exit(-1);\n}\n/* Get the\
    \ shellcode size : */\nstruct stat st;\nif (stat(fd, &st) != 1) {\n  printf(\"\
    Error performing the stat on the shellcode:\\n\");\n  exit(-1);\n}\nclose(fd);\n\
    /* Map it to memory: */\nvoid *mem = mmap(NULL, st.st_size, PROT_READ|PROT_WRITE,\
    \ MAP_PRIVATE|MAP_AN, -1, 0);\nif (mem == MAP_FAILED) {\n  printf(\"Error mapping\
    \ the shellcode to memory:\\n\");\n  exit(-1);\n}\nclose(fd);\n/* Execute the\
    \ shell-code : */\n((void (*)())mem)();\nclose(fd);\n```\n\n@shell-code-test-harness\
    \ using mmap()\n\n# Above of testing your shellcode with -execstack\n\nYou need\
    \ to address the IP address of its inbound network by reverse order of bytes of\
    \ the shellcode to ask it, as it will be better to compare the two values between\
    \ shell payloads.\n\nAre you improving the payload? Do you want to test a vulnerability,\
    \ program, but you can't easily set up the target environment? No problem! The\
    \ vulnerability of the Metasploit Encoder\n\n> You can get rid of -execstack shellcode-payload\
