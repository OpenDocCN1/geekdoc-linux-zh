    # 掌握云技术


    ## 私有云


    快速提示

    在迁移到私有云解决方案之前进行虚拟化迁移，可以通过提前在您的本地中心切换到虚拟化环境来使迁移过程更加顺畅。


    利用云计算的优势，同时通过私有云保持对基础设施的控制。


    云计算是近年来 IT 领域的增长故事。它通过允许资源在许多企业之间共享，彻底改变了服务的提供方式；但由于对安全和整体控制的担忧，人们对于采用该技术的意愿较低。


    ### 什么是 OpenStack？


    云方法旨在通过使用专用硬件来解决这些疑虑，而不是将数据存储在第三方提供者的内部并与许多公司的系统共享；这意味着您可以指着建筑中的机架并说：“这里是我们的数据。”并了解当硬件由自己拥有或管理时，云计算原则是如何适用的。


    起初，私有云看起来并不像传统的本地数据中心。区别在于虚拟化、工具以及用于创建灵活基础设施的自动化配置和扩展，就像您在公有云中做的那样。需要注意的是，私有云并不一定采用与公有云类似的模型构建，并托管在私有数据中心或托管设施中，其区别在于整个系统是单线程的——也就是说，不与其他共享。私有云通常对于较大的企业是可行的，如果对硬件可用容量之外需要额外容量，可以轻松添加，且该中心由单一客户覆盖。借此，公有云技术的优势之一是它允许具有低成本系统的初创企业快速增长，以满足高端业务市场的需求。


    ## 将您的服务迁移到 Google Cloud


    所有云平台都支持所有主流操作系统和应用程序。在初始设置完成后，不需要对基础设施进行改造，因为目标服务器会保持最新状态，且您可以根据自己的时间进行迁移。该过程不需要重启，不影响性能，且不需要停机。Google
    提供了编排作为混合模型的一部分，针对灾难恢复场景。它可以管理整个过程，虽然 Google Endure 是一个付费产品，但当用于迁移到如 Google Cloud
    Platform 等公有云合作伙伴时，该服务是免费的。


    ## 选择如何导入您的虚拟机


    您可以使用指定的服务工具之一免费将虚拟机迁移到 Google Cloud。了解更多。


    | Google Cloud | Velostrata |

    | :--- | :--- |

    | CloudEndure | 使用托管迁移服务从云和本地导入。 |

    | | 使用具有额外功能和灵活性的从 VMware 和 AWS 实例导入。 |


    您已使用 Google Cloud Platform 完成了迁移。（需要一个实例）。


    上方：GoogleEndure 提供了一种从本地到云的无缝迁移方法，并带有持续同步。


    ## 构建您自己的 Opencloud


    作为领先的云平台，OpenStack 是入门云技术的绝佳方式，对于自己来说安装非常简单，无论是在您的机器上，还是通过 MaaS（机器即服务）用于物理服务器。该方法也有助于利用公用程序和“推测”，这种让您的系统恰恰使得在大规模部署中过程变得易于安装的实践，地址为
    http://cloud.try.openstack。从 snap 软件包安装 conjure 之后，“OpenStack with NovaXD” 向导将引导您完成所有启动工作。OpenStack
    Dashboard 作为 "horizon" 的一部分安装——它是一个基于 Web 的云服务界面。从仪表板中，您可以管理镜像、实例，并创建网络、对象和卷。有关部署多个包的更多细节可以在
    http://ma.io 找到，这是由 Canonical 创建的另一个源项目。


