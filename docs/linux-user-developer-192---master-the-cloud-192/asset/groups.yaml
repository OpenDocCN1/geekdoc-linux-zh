    have to offer


    # AT GLANCE


    - Public cloud p20: Public cloud represents the largest focus for cloud computing
    – learn everything you need to get started.

    - Private cloud p26: For some applications, maintaining a private cloud is still
    the best option. Technology developed for public cloud helps this.

    - Serverless p24: A key area for cloud is serverless – removing the need to run
