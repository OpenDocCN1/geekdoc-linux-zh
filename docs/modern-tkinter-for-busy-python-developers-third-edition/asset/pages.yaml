- img_proc: true
  md: '# ## 9.4. Threads or Processes


    Sometimes it''s either impossible or impractical to break up a long-running computation
    into discrete pieces that each run quickly. Or you may be using a library that
    doesn''t support asynchronous operations. Or, like Python''s it doesn''t play
    nice with Tk''s event loop. In cases like these, to keep your Tk GUI responsive,
    you''ll need to move time-consuming operations or library calls out of your event
    handlers and run them somewhere else. Threads, or even other processes, can help
    with that.


    Running tasks in threads, communicating with them, etc., is beyond the scope of
    this book. However, there are some restrictions on using Tk with threads that
    you should be aware of. The main rule is that you must only make Tk calls from
    the thread where you loaded Tk.


    Tkinter goes to great lengths internally so that you can make Tkinter calls from
    multiple threads to the main thread (the one that created the Tk instance). It
    mostly works, but not always. Despite all it tries to do, I highly recommend you
    make all Tkinter calls from a single thread.


    If you need to communicate from another thread to the thread running Tkinter,
    keep it as simple as possible. Use event_generate to post a virtual event to the
    Tkinter event queue, and then bind that event in your code.'
  merge: -1
