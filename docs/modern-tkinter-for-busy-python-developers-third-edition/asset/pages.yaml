  md: '# 9.2. One Step at a Time


    If possible, the very best thing you can do is break your operation into tiny
    steps, each of which can execute quickly. You let the event loop be responsible
    for when the next step occurs. That way, the event loop continues to run, processing
    regular events, updating the screen, and, in between all that, calling your code
    to perform the next step of the operation.


    To do this, we make use of timer Our program can ask the event loop to generate
    one of these events at a later time. As part of its regular work, when the event
    loop reaches time, it will call back into our code to handle the event. Our code
    would perform the next step of the operation. It then schedules another event
    for the next step of the operation and immediately returns control back to the
    event loop.


    ![](img/44299b92074ede1d1ea1f48186743151_171_0.png)


    > Breaking up a large operation into small steps tied together with timer events.


    Tk''s after command can be used to generate timer events. You provide the number
    of milliseconds to wait until the event should be'
