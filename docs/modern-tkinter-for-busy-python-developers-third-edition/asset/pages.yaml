- img_proc: true
  md: 'widget and deciding how all the slave widgets will be displayed within.


    The computing community has embraced the more general societal trend towards more
    diversity, sensitivity, and awareness about the impacts of language. As a result,
    the Tk core will slowly adopt a more inclusive set of terminology. For example,
    where it makes sense, "parent" and "child" will be preferred over "master" and
    "slave." The current terminology will not disappear backward compatibility. This
    is something to be aware of for the future. For more details, see TIP #581


    Your program tells the geometry manager what slaves to manage within the master,
    i.e., via calling Your program provides hints as to how it would like each slave
    to be displayed, e.g., via the column row options. You can also provide other
    things to the geometry manager. For example, we used columnconfigure and rowconfigure
    to indicate the columns and rows we''d like to expand if extra space is available
    in the window. It''s worth noting that all these parameters and hints are specific
    to other geometry managers would use different ones.


    The geometry manager collects information about the slaves in the master and the
    total size of the master. It asks each slave widget for its natural size, i.e.,
    how large it would ideally be displayed. The geometry manager''s internal algorithm
    calculates the area each slave will be allocated (if any!). The slave is then
    responsible for rendering itself within that particular rectangle.'
