- img_proc: true
  md: '# 9. Event Loop


    At the end of the last chapter, we explained how to use a progressbar to provide
    feedback to users about long-running operations. The progressbar itself was simple:
    call its start method, perform your operation, and then call its stop method.
    Unfortunately, you learned that if you tried this, your application would most
    likely appear completely frozen.


    To understand why, we need revisit our discussion in the Tk Concepts chapter.
    As we''ve seen, after we construct an application''s initial user interface, it
    enters the Tk event loop. The event loop continually processes events, pulled
    from the system event queue, usually dozens of times a second. It watches for
    mouse or keyboard events, invoking command callbacks and event bindings as needed.


    Less obviously, all screen updates are processed only in the event loop. For example,
    you may change the text of a label widget. However, that change doesn''t onscreen
    immediately. Instead, the widget notifies Tk that it needs to be redrawn. Later
    on, in processing other events, Tk''s event loop will ask the widget to redraw
    itself. All drawing occurs only in the event loop. The change appears to happen
    immediately because the time between changing the widget and the actual redraw
    in the event loop is so short.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '![](img/44299b92074ede1d1ea1f48186743151_168_0.png)'
  merge: -1
