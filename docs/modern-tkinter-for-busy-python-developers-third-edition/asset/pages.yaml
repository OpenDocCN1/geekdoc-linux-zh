    be specified in a variety of ways. We used another one with the get method: end
    just past the end of the text. (Why “just past?”) Text is inserted right before
    the given index, so inserting at end will add text to the end of the widget).
    Note that Tk always adds a newline at the very end of the text widget.


    Here are a few additional examples of indices and how to interpret them:

    end: The newline at the end of line 3. 1.0 + 3 chars: Three characters past the
    start of line 1. 2.end -1 chars: The last character before the new line in line
    2. 2.end -1 chars: The newline that Tk always adds at the end of the text. 2.end
    -2 chars: The actual last character of the text. 2.end -1 lines: The start of
    the actual line of text. 2.2 + 2 lines: The third character (index 2) of the fourth
    line of text. 2.5 linestart: The first character of line 2. 2.5 lineend: The position
    of the newline at the end of line 2. 2.5'
