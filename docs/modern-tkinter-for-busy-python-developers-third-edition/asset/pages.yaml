  md: '# ## 7.4. Handling Resize


    If you''ve tried to resize the example, you''ll notice that nothing moves at all
    at, as shown below.


    | | Name |

    |---||

    | |  |

    | [x] One [ ] Two [x] Three | Okay | Cancel |


    *Resizing the window*


    Even if you took a peek below and added the extra sticky options to our example,
    you''ll still see the same thing. It looks like sticky may tell Tk how to react
    if the cell''s row or column resize doesn''t actually say that the row or columns
    should resize if any extra room becomes available. Let''s fix that.


    Every column and row in the grid has a weight option associated with it. This
    grid how much the column or row should grow if there is extra room in the master
    to fill. By default, the weight of each column or row is o, meaning it won''t
    expand to fill any extra space.


    For the user interface to resize, we''ll need to specify a positive weight to
    the columns and rows that we''d like to expand. You must provide weights for at
    least one column and one row. This'
  merge: -1
