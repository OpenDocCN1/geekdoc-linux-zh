  md: '# 7.3. Layout within the Cell


    The width of a column (and height of a row) depends on all the widgets contained
    in it. That means some widgets could be smaller than the cells they are placed
    in. If so, where exactly should they be put within their cells?


    By default, if a cell is larger than the widget contained in it, the widget will
    be centered within it, both horizontally and vertically. The master''s background
    color will display in the empty space around the widget. In the figure below,
    the widget in the top right is smaller than the cell allocated to it. The (white)
    background of the master fills the rest of the cell.


    ![](img/44299b92074ede1d1ea1f48186743151_121_0.png)


    Layout within the cell and the ''sticky'' option.


    The sticky option can change this default behavior. Its value is a string of o
    or more of the compass directions specifying which edges of the cell widget should
    be "stuck" to. For example, a value of n (north) will jam the widget up against
    the top side, with any extra vertical space on the bottom; the widget will still
    be centered horizontally. A value of nw (north-west) means the widget will be
    stuck to the top left corner, with extra space on the bottom and right.'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'In Tkinter, you can also specify this as a list containing any of and

    It''s a stylistic choice, and we''ll tend to use the list format in this

    book.


    Specifying two opposite edges, such as we (west, east), means the

    widget will be stretched. In this case, it will be stuck to both the

    left and right edges of the cell. So the widget will be wider than

    its "ideal" size.


    If you want the widget to expand to fill up the entire cell, grid

    it with a sticky value of nsew (north, south, east, west), meaning

    it will stick to every side. This is shown in the bottom left widget

    in the above figure.


    Most widgets have options that can control how they are displayed if

    they are larger than needed. For example, a label widget has an

    anchor option that controls where the label''s text will be positioned

    within the widget''s boundaries. The bottom left label in the figure

    above uses the default anchor i.e., left side, vertically centered.


    If you''re having trouble getting things to line up the way you want

    them to, first make sure you know how large the widget is. As

    discussed with the label widget in the previous chapter, changing the

    widget''s background or border can help.'
