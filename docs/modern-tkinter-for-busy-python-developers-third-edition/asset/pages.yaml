    https://tkdocs.com/man/grid


    # Querying and Changing Grid Options


    Like widgets themselves, it''s easy to introspect the various grid options or
    change them. Setting options when you first grid the widget is certainly convenient,
    but you can change them anytime you''d like.


    The slaves method will tell you all the widgets that have been gridded inside
    a master, or optionally those within just a certain column or row. The info method
    will return a list of all the grid options for a widget and their values. Finally,
    the configure method lets you change one or more grid options on a widget. These
    are illustrated in this interactive session:


    ```

    >>> content.grid_slaves()

    [object .frame.button2, object .frame!.button,

    object .frame!.checkbox3, object .frame!.checkbox2,

    object .frame.!checkbutton, object .frame.!entry,

    object .frame!!label, object .frame!.frame]

    >>> for w in content.grid_slaves(): print(w)

    ```'
