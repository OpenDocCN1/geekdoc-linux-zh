  md: 'Tk 8.6 added support for another system dialog: a font chooser. While the file
    dialogs and color chooser were modal dialogs that block until the dialog is dismissed
    and returned a result, the font chooser doesn''t work like that.


    As the font chooser isn''t available in Tk 8.5, if your code needs to support
    older Tk versions, you''ll need to take that into account.


    ![](img/44299b92074ede1d1ea1f48186743151_227_0.png)


    # Font chooser dialogs.


    While the system font dialog is modal on some platforms, e.g., Windows, that''s
    not the case everywhere. On macOS, the system font chooser works more like a floating
    tool palette in a drawing program, remaining available to change the font for
    whatever text is selected in your main application window. The Tk font API has
    to accommodate both models. To do so, it uses callbacks (and virtual events) to
    notify your application of font changes. Additional details can be found in the
    [fontchooser](https://tkdocs.com/man/fontchooser) reference pages.


    https://tkdocs.com/man/fontchooser'
  merge: -1
  pgno: 227
- img_proc: true
  md: "To use the font dialog, first, provide it with an initial font and a callback\
    \ which will be invoked when a font is chosen. For illustration, we'll have the\
    \ callback change the font on a label.\n\n```\nl = ttk.Label(root, text=\"Hello\
    \ World\", font=\"helvetica 24\")\nl.grid(padx=10, pady=10)\n```\n\n```\ndef font_changed(font):\n\
    \    ['font'] = font\n```\n\n```\nroot.tk.call('tk', 'fontchooser', 'configure',\
    \ '-helvetica 24', '-command', root.register(font_changed))\nroot.tk.call('tk',\
    \ 'fontchooser', 'show')\n```\n\nTkinter has not yet added a convenient way to\
    \ use this new dialog, so this example code uses the Tcl API directly. You can\
    \ see the latest work towards a proper Python API and download code at\n\nYou\
    \ can query or change the font that is (or will be) displayed in the dialog at\
    \ any time.\n\nNext, put the font dialog onscreen via the show method. On platforms\
    \ where the font dialog is modal, your program will block at this point until\
    \ the dialog is dismissed. On other platforms, show returns immediately; the dialog\
    \ remains onscreen while your program continues. At this point, a font has not\
    \ been chosen. There's also a hide method to remove it from the screen (not terribly\
    \ useful when the font dialog is modal)."
  merge: -1
  pgno: 228
- img_proc: true
  md: '```

    root.tk.call(''tk'', ''fontchooser'', ''show'')

    root.tk.call(''tk'', ''fontchooser'', ''hide'')

    ```


    If the font dialog was modal, and the user chose a font, the dialog would have
    invoked your callback, passing it a font specification. If they canceled out of
    the dialog, there''d be no callback. When the dialog isn''t modal and the user
    chooses a font, it will invoke your callback. A < > virtual event is also generated;
    you can retrieve the current font via the dialog''s font configuration option.
    If the font dialog is closed, a < > virtual event is generated. You can also find
    out if the font dialog is visible onscreen via the visible configuration option
    (though changing it is an error; use the show and hide methods instead).


    Because of the significant differences, providing a good user experience on all
    platforms takes a bit of work. On platforms where the font dialog is modal, it''s
    likely to be invoked from a button or menu item that says, e.g., On other platforms,
    the button or menu item should toggle between Show Fonts and Hide


    If you have several text widgets in your application that can be given different
    fonts, when one of them gains focus, it should update the font chooser with its
    current font. This also means that a callback from the font dialog may apply to
    a different text widget than the one you initially called show from! Finally,
    be aware that the font chooser itself may gain the keyboard focus on some platforms.'
  merge: -1
