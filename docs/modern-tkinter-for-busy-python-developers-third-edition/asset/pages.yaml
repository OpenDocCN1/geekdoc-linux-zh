  md: '# 2. A Brief History of Tk and Tkinter


    Tk is a user interface toolkit that makes it easy to build desktop graphical user
    interfaces. Tk is meaning the same code can be made to run the same on on Windows,
    macOS, or X11 under a huge range of Unix systems (e.g., Linux). Compared with
    many user interface toolkits, Tk is also quite meaning that it takes care of many
    details for you. That makes your code simpler. You don''t have to be a professional
    programmer to use it. It''s ideal for when you want to quickly create a user interface,
    perhaps for a personal project or an internal company tool.


    Tk is also unique in that it was designed from the start to be paired with a high-level
    dynamic programming language (like Tcl, Python, Ruby, Perl) as opposed to lower-level
    languages like C or C++. In fact, you''ll find a Tk binding for most dynamic languages
    available today. It''s easy to embed and produces executables smaller than many
    other GUI libraries. It is also BSD-licensed, making it attractive for both open
    source and commercial developers.


    Together, these factors make Tk an attractive option for people trying to develop
    a GUI on Windows, macOS, or Unix, especially if they want it to run on all three.
    And because Tk is used from dynamic programming languages, it''s an accessible
    tool not only for hardcore developers but also for many people without a computer
    science or engineering background.


    Tk has been around forever and changed a lot over the years, resulting in a ton
    of horribly outdated and incorrect information'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'out there. This makes it pretty overwhelming if you just want to

    figure out if and how to use Tk today. That''s what this book will

    help with.


    Before diving in, we''ll provide a brief history of where it came

    from, why and how it caught on, and how things have evolved.

    This will help put a great many things in context.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 2.1. The Early Years


    Tk was created around 1988 by John Ousterhout, a computer science professor at
    UC Berkeley. It was developed as a way to easily build GUI''s from his Tcl scripting
    language. Tcl was Unix-only at first, and so Tk ran under X11. The first open
    source release was around 1991, with rapid adoption starting about a year later.
    You can find John''s recollections of the early years at the main Tcl/Tk developer
    site,


    Tk caught on because lots of people at universities were using Unix/X11 in the
    early 1990s. The mainstream X11 libraries like Xt, Xaw, and Motif were horribly
    painful to use. A "hello world" application would literally take a couple hundred
    lines of C or C++. Then Tk comes along, where a good-looking "hello world" is
    a one-liner, and the toolkit took care of all the housekeeping like redrawing,
    clipping, hit detection, event dispatch, and more. It was a no-brainer.


    For a (very brief) moment, Tcl and Tk were the cool and exciting new things. Developers
    and users of other languages paid attention, and many language bindings to Tk
    were developed. Python''s Tkinter first appeared around mid-1994.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 2.2. The Middle Years


    In 1994, John moved to Sun Labs, where he assembled a team to help move Tcl/Tk
    forward even more. The bulk of the team shifted to a startup called Scripts (later
    Ajuba) and continued to evolve Tcl/Tk until the company was acquired in 2000,
    mostly for the non-Tcl/Tk assets it had developed.


    Those years produced a major advancement for Tk, the development of the Windows
    and macOS versions. This meant that the same script to create a GUI would run
    unmodified on Unix, Windows, or macOS.


    Stewardship of Tk (and Tcl) moved to a more community-centered model in mid-2000,
    with a Tcl/Tk core team at the center but with much broader participation.


    Tk continued to evolve, but the pace slowed. Incremental enhancements and adding
    support for new macOS and Windows versions precluded any significant leaps forward.
    Almost no core work aimed to track the duelo Gnome/KDE user interface standards
    emerging on Linux. Though Tk has always been highly customizable, unless you knew
    what you were doing and put in the effort, it started looking more and more dated.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 2.3. The Silent Revolution


    Tk 8.5.0 was released on December 20, 2007, and was as a crucial step forward
    as the Windows and macOS versions in 8.0, over ten years earlier. The core distribution
    included "new" widgets for such now-common components like trees, combo-boxes,
    tabbed notebooks, and more. These had only been available before add-ons (with
    far too many to choose from).


    Most importantly, Tk 8.5 added a new "themed" widget set, which complements but
    does not replace the "classic" widget set. The classic widgets provide full backward
    compatibility, retaining their almost infinite flexibility, but often dated appearance.
    The new themed widgets look much better on respective platforms out of the box.
    It was intended that developers should use them for nearly all mainstream user
    interface needs. The new widgets also support changing their look and feel via
    themes, making "skinnable" user interfaces easy for applications and platforms
    where they are appropriate.


    Why do I call this Tk''s "silent revolution?" This all happened about ten years
    past its heyday. At the time, web development had relegated legacy desktop GUIs
    to irrelevancy, and few developers were paying attention to Tk. And if you weren''t
    paying attention, you wouldn''t know that anything had changed. Thanks to backward
    compatibility, for most people, it really didn''t. Sadly.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 2.4. Tk Today


    This is being written in September 2020. In the dozen years since 8.5.0 was released,
    there have been approximately 30 new releases of the core Tcl/Tk package, which
    is currently at version 8.6.10. In that time, even though the development of new
    features has slowed, it''s continued to improve.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# 2.5. Tkinter


    Python''s Tkinter was one of the earlier bindings to Tk and certainly the most
    popular. Tkinter was originally written by Fredrik Lundh. It works like most Tk
    bindings by embedding a Tcl interpreter inside the Python application. Tkinter
    commands are translated into Tcl commands and evaluated in that interpreter.


    In 2009, Guilherme Polo added support for the newer "ttk" themed widgets from
    Tk into Tkinter, starting with Python 2.7 (on the 2.x branch), and Python 3.1.
    This opened the door for building far better user interfaces with Tkinter. Documentation
    remained the main obstacle to Python programmers learning about the new themed
    widgets.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 3. Installing Tkinter


    In this chapter, you''ll get Tk and Tkinter installed on your machine, verify
    it works, and then see a quick example of what a Tkinter program looks like.


    In the past, this was a multiple-step process. However, if you''re using Python
    3.7 or newer, you''re in luck! The Python binary installers for macOS and Windows,
    available at now include everything you need to use Tkinter out of the box, including
    the underlying Tcl/Tk libraries.


    If you''re running on Linux, all popular distros have packages available that
    make installing Tkinter a breeze.


    If you''re using an older version of Python or compiling from the source, you''ll
    need to install Tcl/Tk on your system. If you''re in this situation, we''ll explain
    how to use a free distribution called ActiveTcl (made by to do so).


    Remember'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 3.1. Installing Tk on macOS


    # The Easy Way


    As noted, the easiest way to get Tk and Tkinter installed on your system is using
    Python''s binary installer, available at Thanks to work by Python core developer
    Ned Deily, binary installers starting with version 3.7 include Tcl and Tk.


    > Remember, we''re using Python 3.x here, not 2.x. As of this writing, the latest
    3.9 installer (3.9.orc1) includes Tk 8.6.8.


    If, however, you''re compiling Python yourself, you''ll have more work to do.
    Read on...


    # Installing Tcl/Tk


    The Tkinter module is included with core Python, of course, but you''ll need a
    version of Tcl/Tk on your system to compile it against. Do yourself a huge favor
    and get the most recent version.


    Whatever you do, do not rely on the Tk versions included in macOS! Older versions
    included Tk 8.4.x. Even more recent'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'macOS versions include an early 8.5 version (8.5.9), released in 2010), which
    has several serious bugs easily triggered by Tkinter.


    While there are several ways to get Tcl and Tk onto your machine, the easiest
    and most recommended is to use the ActiveTcl distribution.


    In your web browser, visit Download ActiveTcl (as of this writing, it''s version
    8.6.9). Make sure to download an 8.6.x version, not something older! Note that
    you will need to create an account with ActiveState (no cost) to download it.
    After it''s downloaded, run the installer to get Tcl and Tk loaded onto your machine.


    If you''re a masochist and want to read about other Tcl/Tk options and variations
    and how they interact with Python, see the Mac Tcl/Tk page at If you want to compile
    Tcl/Tk from its source, see


    # Compiling Python


    When compiling Python from source, you may need to tell it where to find the ActiveTcl
    (or other) distribution. Otherwise, it might not find any Tcl/Tk distribution
    (so Tkinter won''t work), or it could find the (ancient and broken) version of
    Tcl/Tk supplied with macOS.


    If you''re using Python 3.9 or newer, the build system will look in where ActiveState
    and other custom builds are typically installed.'
  merge: -1
