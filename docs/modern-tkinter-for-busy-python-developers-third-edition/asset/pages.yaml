    # The Application Menu


    Every menubar starts with the system-wide apple icon menu. To the right of that
    is a menu for the foremost application. It is always named after the binary being
    run. When you attach a menubar to the window, if it does not already contain a
    specially named .apple menu (see below), Tk will provide its default application
    menu. It includes an "About Tcl & Tk" item, followed by the standard menu items:
    preferences, the services submenu, hide/show items, and quit. Again, you don''t
    want this.


    If you supply your .apple menu, when the menubar is attached to the window, Tk
    will add the standard items (preferences and onward) onto the end of any items
    you have added. Perfect! Items you add after the menubar is attached to the window
    will appear after the quit item, which, again, you don''t want.


    The application menu, which we''re dealing with here, is distinct from the application
    menu (the one with the apple icon, just to the left of the application menu).
    Despite that, we really mean the application menu, even though Tk still refers
    to it as the "apple" menu. This is a holdover from pre-OS X days when these sorts
    of items did go in the actual apple menu, and there was no separate application
    menu.'
