- img_proc: true
  md: 'at the bottom right of the window, allowing users to resize the window by dragging
    the handle. This was commonly seen on some platforms, including older versions
    of macOS. Some older versions of Tk even automatically added this handle to the
    window for you.


    Platform conventions tend to evolve faster than long-lived open source GUI toolkits.
    Mac OS X 10.7 did away with the size grip in the corner in favor of allowing resizing
    from any window edge, finally catching up with the rest of the world. Unless there''s
    a pressing need to be visually compatible with 10+ year old operating systems,
    if you have a sizegrip (class in your application, it''s probably best to remove
    it.'
