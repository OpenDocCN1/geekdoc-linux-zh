  md: '# 8.4. Scale


    ttk.Scale


    https://tkdocs.com/man/ttk_scale


    A scale widget allows users to choose a numeric value through direct manipulation.


    ![](img/44299b92074ede1d1ea1f48186743151_157_0.png)


    Scale widgets are created using the ttk.Scale class:


    ```

    s = orient=HORIZONTAL, length=200, from_=1.0, to=100.0)

    ```'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'Because ''from'' is a reserved keyword in Python, we need to add a trailing
    underscore when using it as a configuration option.


    The orient option may be either horizontal or The length option, which represents
    the longer axis of horizontal or vertical scales, which is specified in screen
    units (e.g., pixels). You should also define the range of the number that the
    scale allows users to choose; to do this, set a floating-point number for each
    of the from_ and to configuration options.


    There are several different ways you can set the current value of the scale (which
    must be a floating-point value between from_ and to values). You can set (or,
    read, to get the current value) the scale''s value configuration option. You can
    link the scale to a variable using the variable option. Or, you can call the scale''s
    set value method to change the value or the get method to read the current value.


    A command configuration option lets you specify a script whenever the scale is
    changed. Tk will append the current value of the scale as a parameter each time
    it calls this script (we saw a similar thing with extra parameters being added
    to scrollbar callbacks).


    ```

    # label tied to the same variable as the scale, so auto-updates

    ```


    ```

    num = StringVar()

    ttk.Label(root, textvariable=num).grid(column=o, row=o, sticky=''we'')

    ```


    ```

    # label that we''ll manually update via the scale''s command callback

    ```'
