  md: '# 17.2. Using Styles


    We''ll now tackle the more complex issue of taking full advantage of styles and
    themes within your application, not just reskinning it with an existing theme.


    # Definitions


    We first need to introduce a few essential concepts.


    # Widget Class


    A widget class identifies the type of a particular widget, whether it is a button,
    a label, a canvas, etc. All themed widgets have a default class. Buttons have
    the class labels etc.


    # Widget State


    A widget state allows a single widget to have more than one appearance or behavior,
    depending on things like mouse position, different state options set by the application,
    and so on.


    As you''ll recall, all themed widgets maintain a set of binary state flags, accessed
    by the state and instantiate methods. The flags are: and All widgets have the
    same set of state flags, though they may ignore some of them (e.g., a label widget
    would likely ignore'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'an invalid state flag). See the themed widget page in the reference manual
    for the exact meaning of each state flag.


    https://tkdocs.com/man/ttk_widget


    # Style


    A style describes the appearance (or of a widget class). All themed widgets having
    the same widget class will have the same appearance(s).


    Styles are referred to by the name of the widget class. For example, the style
    TButton defines the appearance of all widgets with the class


    Styles know about different states, and one can define different appearances based
    on a widget''s state. For example, a style can specify how a widget''s appearance
    should change if the pressed state flag is set.


    # Theme


    A theme is a collection of styles. While each style is widget-specific (one for
    buttons, one for entries, etc.), a theme collects many styles together. All styles
    in the same theme will be designed to visually "fit" together with each other.
    (Tk doesn''t technically restrict bad design or judgment, unfortunately!)


    Using a particular theme in an application really means that, by default, the
    appearance of each widget will be controlled by the style within that theme responsible
    for that widget class.'
