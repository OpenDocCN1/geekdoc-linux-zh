    # Stylizing the List


    Like most of the "classic" Tk widgets, you have immense flexibility in modifying
    the appearance of a listbox. As described in the'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'reference you can modify the font listbox items are displayed in, the foreground
    (text) and background colors for items in their normal state, when selected, the
    widget is disabled, etc. There is also an itemconfigure method that allows you
    to change the foreground and background colors of individual items.


    As is often the case, restraint is useful. Generally, the default values will
    be entirely suitable and a good match for platform conventions. In the example
    we''ll get to momentarily, we''ll show how restrained use of these options can
    be put to good effect, in this case displaying alternate lines of the listbox
    in slightly different colors.


    # Keeping Extra Item Data


    The listvariable (or the internal list, if you''re managing the old way) holds
    the strings that will be shown in the listbox. It''s often the case, though, that
    each string you''re displaying is associated with some other data item. This might
    be an internal object meaningful to your program but not meant to be displayed
    to users. In other words, what you''re really interested in is not so the string
    displayed in the listbox but the associated data item. For example, a listbox
    may display a list of names to users, but your program is really interested in
    the underlying user object (or id number) for each one, not the particular name.


    As can we associate this underlying value with the name that is displayed? Unfortunately,
    the listbox widget doesn''t offer any facilities, so it''s something we''ll have
    to manage separately. There are a couple of obvious approaches. First, if the
    displayed strings are guaranteed unique, you could use a hash table to map each
    name to its associated underlying object. This wouldn''t'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'work well for peoples'' names, where duplicates are possible, but could work
    for countries, which are unique.


    A second approach is to keep a second list parallel to the list of strings displayed
    in the listbox. This second list will hold the underlying object associated with
    each item that is displayed. So the first item in the displayed list corresponds
    to the first item in the underlying objects list, the second to the second, etc.
    Any changes that you make in one list (insert, delete, reorder), you must make
    in the other. You can then easily map from the displayed list item to the underlying
    object based on their position in the list.


    # Example


