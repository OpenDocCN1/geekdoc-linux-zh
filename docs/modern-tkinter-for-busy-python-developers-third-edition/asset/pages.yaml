    # Integrated Shell and Debugger


    Another pared window was used to integrate the shell and the debugger with the
    tabbed editor. Additional controls will be added to show/hide the panes as the
    implementation progresses.


    The embedded shell is interesting too. Recall that IDLE normally has a single
    Python shell window running another Python process; when modules in an editor
    are "run," they do so via that shell. It''s nice to have that big shell available,
    and we don''t necessarily want to start up a separate shell in the editor.


    New in Tk 8.5, the Text widget actually supports "peers," which are separate widgets
    that share the same text backend. That means when something changes in one, it
    changes in the other. It''s a seamless way to solve our problem here.'
