  md: '# 5.2. Geometry Management


    If you''ve been running code interactively, you''ve probably noticed that widgets
    don''t appear on the screen just by creating them. Placing widgets on the screen
    (and precisely where they are placed) is a separate step called _geometry_


    In our example, positioning each widget was accomplished by the grid command.
    We specified the column and row we wanted each widget to go in, how things were
    aligned within the grid, etc. Grid is an example of a _geometry manager_ (of which
    there are several in Tk, grid being the most useful). For now, we''ll look at
    geometry management in general; we''ll talk about grid in a later chapter.


    A geometry manager''s job is to figure out exactly where those widgets are going
    to be put. This turns out to be a complex optimization problem, and a good geometry
    manager relies on quite sophisticated algorithms. A good geometry manager provides
    the flexibility, power, and ease of use that makes programmers happy. It also
    makes it easy to create appealing user layouts without needing to jump through
    hoops. Tk''s grid is, without a doubt, the absolute best. A poor geometry manager...
    well, all the Java programmers who have suffered through "GridLayout" please raise
    their hands.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'We''ll go into more detail in a later chapter, grid was introduced several
    years after Tk became popular. Before that, an older geometry manager named pack
    was most commonly used. It''s equally powerful but much harder to use, making
    it onerous to create layouts that look appealing today. Unfortunately, much of
    the example Tk code and documentation out there uses pack instead of grid (a good
    clue to how current it is). The widespread use of pack is a leading reason that
    so many Tk user interfaces look terrible. Start new code with and upgrade old
    code when you can.


    #  The Problem


    The problem for a geometry manager is to take all the different widgets the program
    creates, plus the program''s instructions for where in the window should go (explicitly,
    or more often, relative to other widgets), and then actually position them in
    the window.


    In doing so, the geometry manager has to balance multiple constraints. Consider
    these situations:


    The widgets may have a natural size, e.g., the natural width of a label would
    depend on the text it displays and the font used to display it. What if the application
    window containing all these different widgets isn''t big enough to accommodate
    them? The geometry manager must decide which widgets to shrink to fit, how much,
    etc.


    If the application window is bigger than the natural size of all the widgets,
    how is the extra space used? Is extra space placed'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'between each widget, and if so, how is that space distributed? Is it used to
    make certain widgets larger than they usually are, as a text entry growing to
    fill a wider window? Which widgets should grow?


    If the application window is resized, how does the size and position of each widget
    inside it change? Will certain areas (e.g., a text entry area) expand or shrink
    while others stay the same size, or is the area distributed differently? Do certain
    widgets have a minimum size that you want to avoid going below? A maximum size?
    Does the window itself have a minimum or maximum size?


    How can widgets in different parts of the user interface be aligned with each
    other? How much space should be left between them? This is needed to present a
    clean layout and comply with platform-specific user interface guidelines.


    For a complex user interface, which may have many frames nested in other frames
    nested in the window (etc.), how can all the above be accomplished, trading off
    the conflicting demands of different parts of the entire user interface?


    # How it Works


    Geometry management in Tk relies on the concept of master and slave widgets. A
    master is a widget, typically a toplevel window or a frame. It contains other
    widgets, called slaves. You can think of a geometry manager taking control of
    the master'
