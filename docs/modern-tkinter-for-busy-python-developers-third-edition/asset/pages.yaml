  md: '![](img/44299b92074ede1d1ea1f48186743151_374_0.png)


    # About - Readme


    IDLE is Python''s Tkinter-based Integrated Development Environment.


    IDLE emphasizes a lightweight, clean design with a simple user interface. Although
    it is suitable for beginners, even advanced users will find that IDLE has everything
    they need to develop pure Python code.


    IDLE features a multi-window text editor with multiple undo, Python colorizing,
    and many other capabilities, e.g. smart indent, call tips, and autocompletion.


    The editor has comprehensive search functions, including searching through multiple
    files. Class browsers and path browsers provide fast access to code objects from
    a top level viewpoint without dealing with code folding.


    There is a Python Shell window in a separate process, which features colorizing
    and command recall.


    IDLE executes Python code in a separate process, which is restarted for each Run
    (F5) initiated from an editor window. The environment can also be restarted from
    the Shell window without restarting IDLE.


    This enhancement has often been requested, and is now finally available. The magic
    "reload/import *" indentations are no longer required when editing and testing
    a module to two or three steps down the import chain.


    Close


    # IDLE''s doubly-modal About dialog (macOS).'
