  md: '![](img/44299b92074ede1d1ea1f48186743151_359_0.png)


    # Status bar on inactive window.


    Notice how on the macOS screenshot, without the highlight, the status bar at the
    bottom of the window blends into the text widget.

    Not good.


    As you''ll see from looking at other applications, the border around the text
    widget is no longer a common convention. So let''s start by removing that, which
    is as easy as adding "highlightthickness=o" when creating the text widget.


    That leaves us with the problem of the status bar blending into the editor. We
    changed the status bar to be a ttk.Frame widget, which has a background shading
    on all platforms. We also placed ttk.Separator widget just above the status bar
    to give us that clean separation.


    Each of the line and column indicators were labels, previously created with:


    ```

    label = Label(self, bd=1, relief=SUNKEN, anchor=W)

    ```


    This was replaced with a ttk.Label to ensure it matched the frame. We also did
    away with the 1990''s sunken "3d" look.


    ```

    label = ttk.Label(self)

    ```


    Last but not least, we can replace the original Tk scrollbar with the newer ttk.Scrollbar
    widget.'
