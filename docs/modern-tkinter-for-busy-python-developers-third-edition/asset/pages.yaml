  md: '# Internal Padding


    You saw how the padx and pady grid options added extra space around the outside
    of a widget. There''s also a less used type of padding called "internal padding"
    controlled by the grid options ipadx and


    The difference can be subtle. Let''s say you have a frame that''s 20x20, and specify
    normal (external) padding of 5 pixels on each side. The frame will request a 20x20
    rectangle (its natural size) from the geometry manager. Normally, that''s what
    it will be granted, so it''ll get a 20x20 rectangle for the frame, surrounded
    by a 5-pixel border.


    With internal padding, the geometry manager will effectively add the extra padding
    to the widget when figuring out its natural size, as if the widget requested a
    30x30 rectangle. If the frame is centered or attached to a single side or corner
    (using we''ll end up with a 20x20 frame with extra space around it. If, however,
    the frame is set to stretch (i.e., a sticky value of or it will fill the extra
    space, resulting in a 30x30 frame with no border.


    # Forget and Remove


    The forget method of grid removes slaves from the grid they''re currently part
    of. It takes a list of one or more slave widgets as arguments. This does not destroy
    the widget altogether but takes it off the screen as if it had not been gridded
    in the first place. You can grid it again later, though any grid options you''d
    originally assigned will have lost.'
  merge: -1
  pgno: 131
- img_proc: true
  md: The remove method of grid works the same, except that the grid options will
    be remembered if you grid it again later.
  merge: -1
  pgno: 132
- img_proc: true
  md: '# 7.7. Nested Layouts


    As your user interface gets more complicated, the grid that organizes all your
    widgets can get increasingly complicated. This can make changing and maintaining
    your program very difficult.


    Luckily, you don''t have to manage your entire user interface with a single grid.
    If you have one area of your user interface that is fairly independent of others,
    create a new frame and grid the widgets in the area within that frame. For example,
    if you were building a graphics editor with multiple palettes, toolbars, etc.,
    each one of these areas might be a candidate for putting in its own frame.


    In theory, these frames, each with its own grid, can be nested arbitrarily deep,
    though practice usually doesn''t go beyond a few levels. This can be a big help
    in modularizing your program. If, for example, you have a palette of drawing tools,
    you can create the whole thing in a separate function or class. It would be responsible
    for creating all the component widgets, gridding them together, setting up event
    bindings, etc. The details of how things work inside that palette can be contained
    in that one piece of code. Your main program only needs to know about the single
    frame widget containing your palette.


    Our examples have shown just a hint of this: a content frame gridded into the
    main window, and then all the other widgets gridded into the content frame.


    As your own programs grow, you''ll likely run into situations where changing the
    layout of one part of your interface requires code changes to the layout of another
    part. That may be a clue'
  merge: -1
  pgno: 133
- img_proc: true
  md: to reconsider how you're using grid and if splitting out components into separate
    frames would help.
