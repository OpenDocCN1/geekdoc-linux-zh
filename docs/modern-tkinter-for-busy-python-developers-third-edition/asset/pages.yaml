  md: '# 5.1. Widgets


    Widgets are all the things that you see onscreen. Our example had a button, an
    entry, and a frame. Checkboxes, tree views, scrollbars, and text areas are examples
    of other widgets. Widgets are often referred to as "controls." You''ll also see
    them referred to as "windows," particularly in Tk''s documentation. This is a
    holdover from its X roots roots (under terminology, both your toplevel application
    window and a button would be called windows).


    Here is an example showing some of Tk''s widgets, which we''ll cover individually
    shortly.


    ![](img/44299b92074ede1d1ea1f48186743151_60_0.png)


    Several Tk Widgets.


    # Widget Classes


    Widgets are objects, instances of classes that represent buttons, frames, and
    so on. When you want to create a widget, the first thing you''ll need to do is
    identify the specific class of the widget you''d like to instantiate. This book
    will help with that.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Widget Hierarchy


    Besides the widget class, you''ll need one other piece of information to create
    it: its Widgets don''t float off in space. Instead, they''re contained within
    something else, like a window. In Tk, all widgets are part of a widget (or window)
    with a single root at the top of the hierarchy.


    In our metric conversion example, we created a single frame as a child of the
    root window, and that frame had all the other controls as children. The root window
    was a container for the frame and was, therefore, the frame''s The complete hierarchy
    for the example looked like this:


    ![](img/44299b92074ede1d1ea1f48186743151_61_0.png)


    This hierarchy can be arbitrarily deep, so you might have a button in a frame
    in another frame within the root window. Even a new window in your application
    (often called a is part of that same hierarchy. That window and all its contents
    form a subtree of the overall widget hierarchy.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '![](img/44299b92074ede1d1ea1f48186743151_62_0.png)


