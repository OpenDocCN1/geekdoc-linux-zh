  md: '# 18.2. Menus


    The very first change that was made to remove the archaic tearoff menus. The macOS
    version of Tk doesn''t even support them, but they were still there on Windows
    and X11. See


    ![](img/44299b92074ede1d1ea1f48186743151_353_0.png)


    > Tearoff menus on Windows and Linux.


    The change here was to add a "tearoff=o" option to the few places in the code
    where these menus were created.


    At least that was easy.


    There were also several bugs where items in the menu were not properly disabled
    when the feature was unavailable. This led to either menu items that did nothing
    (confusing for learners) or error dialogs that said little more than "you can''t
    do that."'
