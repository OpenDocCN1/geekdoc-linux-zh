    label[''textvariable''] = resultsContents

    resultsContents.set(''New value to display'')

    ```


    Tk only allows you to attach widgets to an instance of the StringVar class but
    not arbitrary Python variables. This class contains all the logic to watch for
    changes and communicate back and forth between the variable and Tk. Use the get
    and set methods to read or write the current value of the variable.


