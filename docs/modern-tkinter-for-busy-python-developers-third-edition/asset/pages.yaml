  md: 'You''ll notice applications on some recent Linux distributions that show their
    menus at the top of the screen when active rather than in the window itself. Tk
    does not yet support this style of menus.


    # Menu Widgets and Hierarchy


    # Menu


    https://tkdocs.com/man/menu


    Menus are implemented as widgets in Tk, just like buttons and entries. Each menu
    widget consists of a number of different items in the menu. Items have various
    attributes, such as the text to display for the item, the keyboard accelerator,
    and a command to invoke.


    Menus are arranged in a hierarchy. The menubar is itself a widget. It has several
    items ("File," "Edit," etc.), each of which is a submenu containing more items.
    These items can include things like the "Open..." command in a "File" menu but
    also separators between other items. It can even have items that open up their
    own submenu (so-called cascading menus). As you''d expect from other things you''ve
    seen already in Tk, anytime you have a submenu, it must be created as a child
    of its parent menu.


    Menus are part of the classic Tk widgets; there is no menu widget in the themed
    Tk widget set.


