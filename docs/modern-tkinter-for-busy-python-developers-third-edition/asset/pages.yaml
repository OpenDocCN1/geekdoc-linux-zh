  md: '# 9.5. Nested Event Processing


    The previous three approaches are the correct ways to handle long-running operations
    while keeping your Tk GUI responsive. What they have in common is a single event
    loop that continuously processes events of all kinds. That event loop will call
    event handlers in your application code, which do their thing and quickly return.


    There is one other way. Within your long-running operation, you can invoke the
    event loop to process a bunch of events. You can do this with a single command.
    There''s no missing around with timer events or asynchronous I/O. Instead, you
    just sprinkle some update calls throughout your operation. If you want to only
    keep the screen redrawing but not process other events, there''s even an option
    for that


    This approach is seductively easy. And if you''re lucky, it might work. At least
    for a little. But sooner or later, you''re going to run into serious difficulties
    to do things that way. Something won''t be updating, event handlers aren''t getting
    called that should be, events are going missing or being fired out of order, or
    worse. You''ll turn your program''s logic inside out and tear your hair out trying
    to make it work again.


    When you use you''re not returning control back to the running event loop. You''re
    effectively starting a new event loop nested within the existing one. Remember,
    the event loop follows a single thread of execution: no threads, no coroutines.
    If you''re not careful, you''re going to end up with event loops called from within
    event loops called from...'
