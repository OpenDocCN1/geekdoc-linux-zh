    We need to do two things: create the widget itself and then place it onscreen.


    When we create a widget, we need to specify it That is the widget that the new
    widget will be placed inside. In this case, we want our entry placed inside the
    content frame. Our entry, and other widgets we''ll create shortly, are to be children
    of the content frame. The parent is always the first parameter passed when instantiating
    a widget object.


    When we create a widget, we can optionally provide it with certain configuration
    Here, we specify how wide we want the entry to appear, i.e., 7 characters. We
    also assign it a mysterious we''ll see what does there shortly.


    When widgets are created, they don''t automatically appear on the screen; Tk doesn''t
    know where you want placed relative to other widgets. That''s what the grid part
    does. Remember the layout grid when we sketched out our application? Widgets are
    placed in the appropriate column (1, 2, or 3) and row (also 1, 2, or 3).


    The sticky option to grid describes how the widget should line up within the grid
    cell, using compass directions. So W (west) means to anchor the widget to the
    left side of the cell, (W, E) means to attach it to both the left and right sides,
    and so on.


