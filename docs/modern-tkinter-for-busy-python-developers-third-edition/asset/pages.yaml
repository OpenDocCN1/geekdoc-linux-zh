  md: '# 14-3. Tags


    We''ve seen that every canvas item can be referred to by a unique id number. There
    is another handy and powerful way to refer to items on a canvas, using


    A tag is just an identifier of your creation, something meaningful to your program.
    You can attach tags to canvas items; each can have any number of tags. Unique
    item id numbers, which are unique for each item, many items can share the same
    tag.


    What can you do with tags? We saw that you can use the item id to modify a canvas
    item (and we''ll see soon there are other things you can do to items, move them
    around, delete them, etc.). Any time you can use an item id, you can use a tag.
    For example, you can change the color of all items having a specific tag.


    Tags are a good way to identify collections of items in your canvas (items in
    a drawn line, items in a palette, etc.). You can use tags to correlate canvas
    items to particular objects in your application (for example, tag all canvas items
    that are part of the robot with id #X37 with the tag “robotX37”). With tags, you
    don''t have to keep track of the ids of canvas items to refer to groups of items
    later; lets Tk do that for you.


    You can assign tags when creating an item using the tags configuration option.
    You can add tags later with the addtag method or remove them with the dtags method.
    You can get the list of tags for an item with the gettags method or return a list
    of item id numbers having the given tag with the find command.'
  merge: -1
  pgno: 273
