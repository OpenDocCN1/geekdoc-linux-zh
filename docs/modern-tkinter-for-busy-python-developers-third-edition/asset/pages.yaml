  md: '# 4-3. Step-by-Step Walkthrough


    Let''s take a closer look at that code, piece by piece. For now, all we''re trying
    to do is get a basic understanding of the types of things we need to do to create
    a user interface in Tk and roughly what those things look like. We''ll go into
    details later.


    # Incorporating Tk


    Our program starts by incorporating Tk.


    ```

    from tkinter import *

    from tkinter import ttk

    ```


    These two lines tell Python that our program needs two modules. The first, is
    the standard binding to Tk. When imported, it loads the Tk library on your system.
    The second, is a submodule of It implements Python''s binding to the newer "themed
    widgets" that were added to Tk in 8.5.


    Notice that we''ve imported everything from the tkinter module. That way, we can
    call tkinter functions, etc., without prefixing them with the module name. This
    is standard Tkinter practice.'
  merge: -1
