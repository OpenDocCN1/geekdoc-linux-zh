- img_proc: true
  md: 'As of Tk 8.6.10, there are a few bugs in the font chooser on various platforms.
    Here''s a quick rundown, including workarounds:


    on macOS, if you don''t provide a font via the font configuration option, your
    callbacks won''t be invoked ⇒ always provide an initial font


    on X11, if you don''t provide values for all configuration options, those you
    don''t include will be reset to their default values ⇒ whenever you change any
    option, change all of them, even if it''s just to their current value


    on X11, the font dialog includes an Apply button when you provide a callback but
    omits it when you don''t (and just watch for virtual events); however, other bugs
    mean these virtual events are never generated ⇒ always provide a command callback


    on Windows, you can also leave off the Apply button by not providing a callback;
    while virtual events are generated on font changes, the font configuration option
    is never updated ⇒ always provide a command callback, and hold onto the font yourself,
    rather than trying to ask the font dialog for it later


    on Windows, a font change virtual event is not generated if you change the font
    configuration option in your code, though it is on macOS and X11 ⇒ take any necessary
    actions when you change the font in your code rather than in a virtual event handler


    Because of the differences between platforms and the various bugs, testing is
    far more important when using the font chooser than the other system'
  merge: -1
