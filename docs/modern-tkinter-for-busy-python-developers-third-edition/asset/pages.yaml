  md: '# ## 10.2. Platform Menus


    Each platform has a few menus in every menubar that are handled specially by Tk.


    # ### macOS


    You''ve probably noticed that Tk on macOS supplies its default menubar. It includes
    a menu named after the program being run (in this case, your programming language''s
    shell, "Python", a File menu, and standard Edit, Windows, and Help menus, all
    stocked with various menu items.


    You can override this menubar in your own program, but to get the results you
    want, you''ll need to follow some steps (in some cases, in a particular order).


    Starting at Tk 8.5.13, the handling of special menus on macOS changed due to the
    underlying Tk code migrating from the obsolete Carbon API to Cocoa. If you''re
    seeing duplicate menu names, missing items, things you didn''t put there, etc.,
    review this section carefully.


    The first thing to know is that if you don''t specify a menubar for a window (or
