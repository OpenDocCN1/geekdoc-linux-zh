    root.mainloop()\n```\n\nhttps://tkdocs.com/code/scrollbar.py\n\n* If you've seen\
    \ an earlier version of this book, you might recall that at this point, we introduced\
    \ a sizegrip widget. It placed a small handle"
  merge: -1
