    # Text


    Text items can display a block of text. Positioning the text works the same as
    with image items. Specify the text to display using the text attribute. All of
    the text in the item will have the same color (specified by the fill attribute)
    and the same font (specified by a font attribute).


    The text item can display multiple lines of text if you embed \n in the text.
    Alternatively, you can have the item automatically wrapped into multiple lines
    by providing a width attribute to represent the maximum width of a line. The alignment
    of lines of text can be set using the justify attribute, which can be one of left
    (the default), or


    ```

    canvas.create_text(100, 100, text=''A wonderful story'', anchor=''nw'', font=''TkMenuFont'',
    fill=''red'')

    ```


    # Widget


    One of the coolest things you can do with the canvas widget is embed other widgets
    inside it. This can be a lowly button, an entry (think in-place editing of text
    items), a listbox, a frame itself containing a complex set of widgets... anything!
    Remember when we said way back that a canvas widget could act as a geometry manager?
    This is what we meant.'
