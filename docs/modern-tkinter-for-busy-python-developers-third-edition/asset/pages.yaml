    for many others: BMP, XBM, XPM, JPEG, PNG (if you''re using 8.5), TIFF, etc. Though
    not included in the Tk core, Img is usually included with other packaged distributions
    (e.g., ActiveTcl).


    Instead of using Tk''s Img extension, Tkinter uses a made-for-Python image library
    called PIL (Python Imaging Library). More specifically, we''ll use a more up-to-date
    fork of PIL called As it doesn''t bundle with Python, you''ll normally need to
    install it. You should be able to do so via, e.g., pip install


    ```

