  md: 'were common. With only a few lines of extra code needed to special-case for
    this layout difference, it made sense to handle things this way.


    Other aspects of the layout were also improved. Looking at the original dialogs
    (especially how the buttons don''t align with other widgets), I originally thought
    it was created with and expected to convert it to Interestingly, it was already
    using Why then were the widgets unaligned, a hallmark of layouts?


    This turned out to be a result of using many nested frames for Example, the buttons
    were placed into their own frame and then placed into the rest of the window.
    Because of that, the individual buttons couldn''t be aligned with widgets in the
    rest of the user interface.


    Nested frames were required when using but often with grid it is better to avoid
    them except in exceptional circumstances. That allows you to align different parts
    of the user interface (at the expense of many columnspan/rowspan tweaking).


    A more substantial reorganization would have likely removed the nested frames,
    but particularly with adjusting the buttons, this relatively simple layout could
    be made to work with just a few tweaks.


    You''ll notice many older Tkinter user interfaces have the problem here of their
    contents running to the edge of the windows, which often doesn''t look right.
    I''ve gotten into the habit of placing a ttk.Frame directly inside each tooplevel,
    with some additional padding, and then placing the rest of the user interface
    inside that.'
