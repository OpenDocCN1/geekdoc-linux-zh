  md: '# 13.1. Fonts


    Tk''s label widget allows you to change the font used to display text via the
    font configuration option. The canvas and text widgets, covered in the following
    chapters, also allow you to specify fonts. Other themed widgets that display text
    may not have a font configuration option, but their fonts can be changed using
    styles.


    We''ll cover styles in detail later. In essence, they replace the old way of tweaking
    multiple configuration options on individual widgets. Instead, fonts, colors,
    and other settings that control appearance can be bundled together in a style.
    That style can then be applied to multiple widgets. It''s akin to the difference
    between hardcoding display-oriented markup inside HTML pages vs. using CSS to
    keep display-specific information separate.


    As with many things in Tk, the default fonts are usually a good choice. If you
    need to make changes, this section shows the best way to do so, using named Tk
    includes fonts suitable for use in all different components of your user interface.
    They take into account the conventions of the specific platform you''re running
    on. You can also specify your own fonts when you need additional flexibility.'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'The font command reference provides full details on specifying fonts, as well
