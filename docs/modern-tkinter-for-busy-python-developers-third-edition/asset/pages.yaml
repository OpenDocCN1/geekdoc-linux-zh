    -> True (on retry) or False askyesokcancel: -> True (on yes), False (on no), or
    None (on cancel)


    Admittedly, the Tkinter messagebox API isn''t the most consistent. It mixes return
    types (strings or booleans), there is some duplication and one underlying dialog
    type is omitted.


