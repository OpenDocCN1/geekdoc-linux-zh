- img_proc: true
  md: 'is done using the columnconfigure and rowconfigure methods of This weight is
    relative. If two columns have the same weight, they''ll expand at the same rate.
    In our example, we''ll give the three leftmost columns (holding the checkboxes)
    weights of 3 and the two rightmost columns weights of 1. For every pixel the right
    columns grow, the left columns will grow by three pixels. So as the window grows
    larger, most of the extra space will go to the left side.


    ![](img/44299b92074ede1d1ea1f48186743151_124_0.png)


    columnconfigure and rowconfigure also take a minsize grid option, which specifies
    a minimum size you really don''t want the column or row to shrink beyond.'
