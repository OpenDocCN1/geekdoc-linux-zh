  md: '# 14.4. Scrolling


    In many applications, you''ll want the canvas to be larger than what appears on
    the screen. You can attach horizontal and vertical scrollbars to the canvas in
    the usual way via xview and yview methods.


    You can specify how large you''d like it to be on screen and its full size (which
    would require scrolling to see). The width and height configuration options control
    how much space the canvas widget scrollregion configuration option tells Tk how
    large the canvas surface is by specifying its left, top, right, and bottom coordinates,
    e.g., o o 1000


    You should be able to modify the sketchpad program to add scrolling, given what
    you already know. Give it a try.


    Once you''ve done that, scroll the canvas down just a little bit, and then try
    drawing. You''ll see that the line you''re drawing appears above where the mouse
    is pointing!prised?


    What''s going on is that the global bind command doesn''t know that the canvas
    is scrolled (it doesn''t know the details of any particular widget). So if you''ve
    scrolled the canvas down by 50 pixels, and you click on the top left corner, bind
    will report that you''ve clicked at (o,0). But we know that of the scrolling,
    that position should really be (o,50).


    The canvasx and canvas methods translate the position onscreen (which bind reports)
    into the actual point on the canvas (taking into account scrolling).'
