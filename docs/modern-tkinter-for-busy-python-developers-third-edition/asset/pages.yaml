  md: '# 5.3. Event Handling


    As with most user interface toolkits, Tk runs an event loop that receives events
    from the operating system. These are things like button presses, keystrokes, mouse
    movement, window resizing, and so on.


    Generally, Tk takes care of managing this event loop for you. It will figure out
    what the event applies to (did a user click on this button? if a key was pressed,
    which textbox had the focus?), and dispatch it accordingly. Individual widgets
    know how to respond to events; for example, a button might change color when the
    mouse moves over it and revert back when the mouse leaves.


    It''s critical in event-driven applications that the event loop not be run continuously,
    normally executing dozens of steps per second. At every step, it processes an
    event. If your program is performing a long operation, it can potentially block
    the event loop. In that case, no events would be processed, no drawing would be
    done, and it would appear as if your application is frozen. There are many ways
    to avoid this happening, mostly related to the structure of your application.
    We''ll discuss this in more detail in a later chapter.


    # Command Callbacks'
