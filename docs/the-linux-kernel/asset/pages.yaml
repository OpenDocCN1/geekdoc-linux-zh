    Figure 1.1: A typical PC motherboard.


    de-facto standard helped a multitude of hardware companies to compete together
    in a growing market, happily for consumers, kept prices low. Many of the system
    architectural features of these early PCs have been carried over into the modern
    PC. For example, the most powerful Intel Pentium Pro based system starts running
    in the Intel 8086''s addressing mode. When Linux Torvalds started writing what
    would become Linux, he picked the most plentiful and reasonably priced hardware,
    an Intel 80386 PC.


    Looking at a PC from the outside, the most obvious components are a system box,
    a keyboard, a mouse and a video monitor. On the front of the system box are some
    buttons, a little display showing some numbers and a floppy drive. Most systems
    these days have a CD ROM and if you feel that you have to protect your data, then
    there will also be a tape drive for backups. These devices are collectively known
    as the peripherals.


    Although the CPU is in overall control of the system, it is not the only intelligent
    device. All of the peripheral controllers, for example the IDE controller, have
    some level of intelligence. Inside the PC (Figure 1.1) you will see a motherboard
    containing the CPU or microprocessor, the memory and a number of slots for the
    ISA or PCI peripheral controllers. Some of the controllers, for example the IDE
    disk controller may be built directly onto the system board.


    # 1.1 The CPU


    The CPU, or rather microprocessor, is the heart of any computer system. The microprocessor
    calculates, performs logical operations and manages data flows by reading instructions
    from memory and then executing them. In the early days of comput-'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'ing the functional components of the microprocessor were separate (physically
    large) units. This is when the Central Processing Unit was coined. The modern
    microprocessor combines these components into an integrated circuit etched onto
    a very small piece of silicon. The terms CPU, microprocessor and processor are
    all used interchangeably within this.


    Microprocessors operate on binary data; that is composed of ones and zeros. These
    ones and zeros correspond to electrical switches either one or off. Post as 42
    is a decimal number "10 and 2 units", a binary number is a series of binary digits
    each one representing a power of 2. In this context, a power means the number
    of times that number is multiplied by itself. If 10 is to the power 1 ($10^1$),
    10 is to the power 2 ($10^2$), binary 0001 is to 0010, 0011 is to 0100 and so
    on. 42 decimal is 101010 in binary ($2^5+2^2+2$). Rather than using binary to
    represent numbers in computer programs, another base, hexadecimal is usually used.
    In this base, each digit represents a power of 16. As decimal numbers go from
    0 to 9 are represented as a single digit by the letters A, B, C, D, E and F. For
    example, hexadecimal E is decimal 14 and hexadecimal 2A is decimal 42 (two sixteen+10).
    Using the C programming language (as I do throughout this book) hexadecimal numbers
    are preceded by "$\0x$"; hexadecimal 2A is written as 0x2A.


    The processor''s execution is governed by an external clock. This clock, the system
    generates regular clock pulses to the processor and at each clock pulse, the processor
    does some work. For example, a processor could execute an instruction every clock
    pulse. A processor''s speed is described in terms of the rate of the system clock
    ticks. A 100MHz processor will receive 100,000,000 ticks every second. It is misleading
    to describe the power of a CPU by its clock rate as different processors perform
    different amounts of work per clock tick. However all being equal, a faster speed
    means a more powerful processor. The instructions executed by the processor are
    very simple; for example "read the contents of memory at location X into Y". Registers
    are the microprocessor''s internal storage, used for storing data and performing
    operations on it. The operations performed may cause the processor to stop what
    it is doing and jump to another instruction else in memory. These tiny building
    blocks give the microprocessor almost limitless power as it can execute millions
    or billions of instructions a second.


    The instructions have to be fetched from memory as they are executed. Instructions
    may reference data within memory and that data must be fetched from memory and
    saved when appropriate.


    The size, number and type of register in a microprocessor is entirely dependent
    on its type. Intel 4086 processor has a different set of registers than an Alpha
    AXP processor; for start, the Intel''s are 32 bits wide and the Alpha AXPs are
    64 bits wide. In general, any processor will have a smaller number of general
    purpose registers and dedicated registers. Most processors have the following
    special purpose, registers:


    # Program Counter (PC) This register contains the address of the next instruction
    to be executed. The contents of the PC are automatically incremented each time
    an instruction is fetched,'
  merge: -1
