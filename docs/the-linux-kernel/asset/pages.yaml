  md: 'Networked File System or NFS. Whichever way the information is located, ls
    that information out and the video driver displays it on the screen.


    All of the above seems rather complicated it shows that even simple commands reveal
    that an operating system is in fact a co-operating set of functions that together
    give you, the user, a coherent view of the system.


    # 2.2.1 Memory management


    With resources, for example memory, many of the things that an operating system
    has to do would be redundant. One of the basic tricks of any operating system
    is the ability to make a small amount of physical memory behave like rather more.
    This apparently large memory is known as virtual memory. The idea is that the
    software running in system is fooled into believing that it is running in a lot
    of memory. The system divides the memory into easily handled pages and swaps these
    pages onto a disk as the system. The software does not notice because of another
    trick, multi-processing.


    # 2.2.2 Processes


    A process could be thought of as a program in action, each process is a separate
    entity that is running a particular program. If you look at the processes on Linux
    system, you will see that there are a lot. For example, typing ps shows the following
    processes on your system:


    ```

    $ ps

