  md: 'some key point. It must be noted around 95% of the Linux kernel sources common
    to all of the hardware platforms that it runs on. Likewise, around 95% of this
    book is about the machine independent parts of the Linux kernel.


    # Reader Profile


    This book does not make any assumptions about the knowledge or experience of the
    reader. I believe that interest in the subject will encourage a progress of self
    education where necessary. That said, a degree of familiarity with computers,
    preferably the PC will help the reader derive real benefit from the material,
    as will with some knowledge of the C programming language.


    # Organisation of this Book


    This book is not intended to be used as an manual for Linux. Instead it is an
    introduction to operating systems in general and to Linux in particular. The chapters
    follow my rule of "working from the general to the particular". They first give
    an overview of the kernel subsystem that they are describing before launching
    into its details.


    I have deliberately not described the kernel''s algorithms, its methods of doing
    things, in routine.routine_X() calls routine_Y() which increments the field of
    the bar structure. You can read code to find these out. Whenever I need to understand
    a piece of code or describe it to someone else I start with drawing its data structures
    on the white-board. So, I have described many of the relevant kernel data structures
    and their interrelations in a fair amount of detail.


    Each chapter is fairly described, like the kernel subsystem that each describe.
    Sometimes, though, there are linkages; for example you cannot describe a process
    without understanding how virtual memory works.


    The Hardware Basics (Chapter 1) gives a brief introduction to the modern PC. An
    operating system has to work closely with the hardware system that acts as its
    foundations. The operating system needs services that can only be provided by
    the hardware. In order to fully understand the Linux system, you need to understand
    the basics of the underlying hardware.


    The Soft Basics (Chapter 2) introduces basic software principles and looks at
    assembly and C programming languages. It locks the tools that are used to build
    an operating system like Linux and it gives an overview of the aims and functioning
    of operating system.


    The Memory Management chapter (Chapter 3) describes the way that Linux handles
    the physical and virtual memory in the system.


    The Processes chapter (Chapter 4) describes what a process is and how the Linux
    kernel creates, manages and deletes the processes in the system.


    Processes communicate with each other and with the kernel to coordinate their
    activities. Linux supports a number of Inter-Process Communication (IPC) mechanisms.
    Signals and pipes are two of them but Linux also supports the System V IPC mechanisms
    named after the Unix release in which they first appeared. These interprocess
    communications mechanisms are described in Chapter 5.'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'The Peripheral Component Interconnect (PCI) standard is now firmly established
    as the low cost, high performance data bus for PCs. The PCI chapter (Chapter 6)
    describes how the Linux kernel initializes and uses PCI buses and devices in the
    system.


    The Interrupts and Interrupt Handling chapter (Chapter 7) looks at how the Linux
    kernel handles interrupts. While the kernel has generic mechanisms and interfaces
    for handling interrupts, some of the interrupt handling details are hardware and
    architecture specific.


    One of Linux''s strengths is its support for the many available hardware devices
    for the modern PC. The Device Drivers chapter (Chapter 8) describes how the Linux
    kernel controls the physical devices in the system.


    The File system chapter (Chapter 9) describes how the Linux kernel maintains the
    files in the file systems that it supports. It describes the Virtual File System
    (VFS) and how the Linux kernel''s real file systems are almost supported.


    Networking and terms that in a very real sense Linux is a product of the Internet
    or World Wide Web (WWW). Its developers and users use the web to exchange information
    details, code and Linux itself is often used to support the networking needs of
    organizations. Chapter 10 describes how Linux supports the network protocols collectively
    as TCP/IP.


    The Kernel Mechanisms chapter (Chapter 11) looks at some of the general tasks
    and mechanisms that the Linux kernel needs to supply so that other parts of the
    kernel work effectively.


    The Modules chapter (Chapter 12) describes how the Linux kernel can dynamically
    load functions, for example file systems, only when they are needed.


    The Processes chapter (Chapter 13) gives a brief description of some of the processors
    that Linux has been ported to.


    The Sources chapter (Chapter 14) describes where in the Linux kernel sources you
    should start looking for particular kernel functions.


    # ## Conventions used in this Book


    The following is a list of the typographical conventions used in this book.


    +   - serif font identifies commands or other text that is to be typed by the
    reader.

    - type font refers to data structures or fields within data structures.


    Throughout the source code refers to pieces of code within the Linux source tree
    (for example the bordered margin note adjacent to this text). These are given
    in case you wish to look at the source code itself and all the file references
    are relative to `/usr/src/linux`. Taking `foo/bar.c` as an example, the file name
    would be `/usr/src/linux/foo/bar.c` if you are running Linux (and you should),
    looking at the code is a worthwhile experience and you can use this book as an
    aid to understanding the code and as a guide to its many data structures.


    | See foo() in

    foo/bar.c |'
