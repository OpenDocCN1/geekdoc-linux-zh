    Hardware Caches One commonly implemented hardware cache is in the processor; a
    cache of Page Table Entries. In this case, the processor does not always read
    the page table directly but caches translations for pages as it needs them. These
    are the Translation-Lookaside Buffers and contain cached copies of the page table
    entries from one or more processes in the system.


