    module''s count would become 2. A module''s count is held in the first longword
    of its image.


    This field is slightly overloaded as it also holds the AUTOCLEAN and VISITED flags.
    Both of these flags are used for demand loaded modules. These modules are marked
    as AUTOCLEAN so that the system can recognize it when it automatically unload.
    The system is set whenever kernelload to remove unused modules it the module.
    Each VISITED flag marks the module as one or more other system components; it
    another component makes use of the module. Each time the system is asked by kernelload
    to remove unused loaded modules it looks through all of the modules in the system
    for likely candidates. It only looks at modules marked as AUTOCLEAN and in the
    state RUNNING. If the candidate has its VISITED flag cleared then it will remove
    the module, otherwise it will clear the VISITED flag and go on to look at the
    next module in the system.


    Assuming that a module can be unloaded, its cleanup routine is called to allow
    it to free up the kernel resources that it has allocated. The module data structure
    is marked as DELETED and is unlinked from the list of kernel modules. Any other
    modules that it is dependent on have their reference lists modified so that they
    longer have it as a dependent. All of the kernel memory that the module needed
    is deallocated.


    ```

    See sys-delete_module() in

    kernel/module.c

    ```'
