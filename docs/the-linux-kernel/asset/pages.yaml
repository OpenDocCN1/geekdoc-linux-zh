  md: '# 9.2.8 The VFS Inode Cache


    As the mounted file systems are navigated, VFS inodes are continually read and
    in some cases, the Virtual File System maintains an inode cache to speed up accesses
    to all of the mounted file systems. Every time a VFS is read from the inode cache
    the system saves an access to a physical device.


    The VFS inode cache is implemented as a hash table whose entries are pointers
    to lists of VFS inodes that have the same hash value. The hash value of an inode
    is calculated from its inode number and the device identifier for the underlying
    physical device containing the file system. Whenever the Virtual File System needs
    to access an inode cache, it first looks in the inode cache. To find an inode
    in the cache, the system calculates its hash value and then uses it as an index
    into the hash table. It then reads a pointer to a list of inodes with the same
    hash value then reads each turn until it finds one with both the same inode number
    and the same device identifier as one that it is searching.


    If it can find in the cache, its count is incremented to show that it has another
    user and the file system access continues. Otherwise a free VFS inode has choices
    about how to get a free inode. If the system it allocates kernel pages and breaks
    them into new, free inodes and puts them into the inode list. All of the system''s
    VFS inodes are in a list pointed by first_inode as well as in the hash table.
    The system already has all of the inodes that it is allowed to have, it must find
    an inode that is a good candidate to be reused. Good candidates are inodes with
    a usage count of zero; indicates that the system is not currently using them.
    Important VFS inodes, for the root of the file systems always have a usage count
    greater than zero and so never candidates for reuse. Once a candidate for reuse
    has been located it is cleaned. The VFS inode might be dirty and in this case
    it needs to be written back to the file system or it be locked and in this case
    the system must wait until cleaned before continuing. The candidate VFS inode
    must be cleaned before it can be reused.


    However the VFS inode is found, a file system specific routine must be called
    to fill it out information from the underlying real file system. While it is being
    filled, the new VFS inode has a usage count of one and is locked so that nothing
    accesses it until it contains valid information.


    To get the VFS inode is actually needed, the file system may need to access other
    inodes. This happens when you read a directory; only the inode for the final directory
    is needed but the inodes for the intermediate directories must also be read. As
    the VFS inode cache is used and filled up, the less used inodes will be discarded
    and the more used inodes remain in the cache.


    # 9.2.9 The Directory Cache


    To speed up commonly used directories, the VFS maintains a cache of directory
    entries. As directories are looked up by the real file system their details are
    added to the directory cache. The next time the same directory is looked up, for
    example to list it or open a file within it, then it will be found in the directory
    cache. Only short directory entries (up to 15 characters) are cached this'
