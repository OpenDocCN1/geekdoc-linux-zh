- img_proc: true
  md: 'Stack Pointer (SP) processors have access to large amounts of external read/write
    random access memory (RAM) which facilitates temporary storage of data. The stack
    is a way of easily saving and restoring temporary values in external memory. Usually,
    processors have special instructions which allow you to push values onto the stack
    and pop them off later. The stack works on a last first out (LIFO) basis. In other
    words, if you push values, x and y, onto a stack and then pop a value off the
    stack you will get back the value of y.


    Some processor''s grows towards the top of memory whilst others grows towards
    the bottom, or base, of memory. Some processor''s support both types, for example
    ARM.


    Processor Status (PS) instructions may yield results; for example "is the content
    of register X greater than the content of register Y" will yield true or false
    as a result. The PS register holds this and other information about the state
    of the processor. For example, most processors have at least two modes of operation,
    kernel (or supervisor) and user. The PS register would hold information identifying
    the current mode.


    # 1.2 Memory


    All systems have a memory hierarchy with memory at different speeds and sizes
    at different points in the hierarchy. The fastest memory is known as cache memory
    and is what sounds like - memory that is used to temporarily hold, or cache, contents
    of the main memory. This memory is very fast but expensive, therefore most processors
    have a small amount of on-chip cache memory and more system based (onboard) cache
    memory. Some processors have one cache to contain both instructions and data,
    but others have two, one for instructions and the other for data. The Alpha XP
    processor has two internal caches; one for data (the D-Cache) and one for instructions
    (the I-Cache). The external cache (or B-Cache) mixes the two. Finally there is
    the main memory which relative to the external cache memory is very slow. Relative
    to the on-CPU cache, main memory is positively crawling.


    The cache and main memories must be kept in step (coherent). In other words, if
    word of memory is held in one or more locations in cache, then the system must
    make sure that the contents of cache and memory are the same. The job of cache
    coherency is done partially by the hardware and partially by the operating system.
    This is also true for a number of major system tasks where the hardware and software
    must cooperate closely to achieve their aims.


    # 1.3 Buses


    The individual components of the system board are interconnected by multiple connections
    known as buses. The system is divided into three functional units; the address
    bus, the data bus and the control bus. The address bus specifies the memory locations
    (addresses) for the data transfers. The data bus holds the data transferred. The
    data bus is bidirectional; allows data to be read into the CPU and written from
    the CPU. The control bus contains various lines used to route timing'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'and control signals throughout the system. Many flavours of bus exist, for
    example ISA and PCI buses are popular ways of connecting peripherals to the system.


    # 1.4 Controllers and Peripherals


    Peripherals are real devices, such as graphics cards or disks controlled by controller
    chips on the system board or on cards plugged into it. The IDE disks are controlled
    by the IDE controller and the SCSI disks by the SCSI disk controller chips and
    so on. These controllers are connected to the CPU and to each other by a variety
    of buses. Most systems build now use PCI and ISA buses to connect the main components.
    The controllers are processors like the CPU itself, which can be viewed as intelligent
    helpers to the CPU. The CPU is in overall control of the system.


    All controllers are different, but they usually have registers which control them.
    Software running on the CPU must be able to read and write those controlling registers.
    One register might contain status describing an error. Another might be used for
    control purposes; changing the mode of the controller. Each controller on a bus
    can be individually addressed by the CPU, this is that the software driver can
    write to its registers and control it. The IDE ribbon is a good example, as it
    gives you the ability to access each device on the bus separately. Another good
    example is the PCI bus which allows each device (for example a graphics card)
    to be accessed independently.


    # 1.5 Address Spaces


    The system bus connects the CPU with the main memory and is separate from the
    buses connecting the CPU with the system''s hardware peripherals. Collectively
    the memory space that the hardware peripherals exist in is known as I/O space.
    I/O space may be further subdivided, but we will not worry too much about for
    the moment. The CPU can access both the system memory and the I/O space memory,
    whereas the controllers themselves can only access system memory indirectly and
    then with the help of the CPU. From the point of view of the device, the floppy
    controller can only see that its control registers are in (ISA), not the system
    memory. Typically a CPU will have separate instructions for accessing the memory
    and I/O space. For example, there might be an instruction that means "read from
    i/O address 0x3f to read and writing to their registers in I/O space. Where in
    I/O space the common peripherals (IDE controller, serial port, floppy disk controller
    and so on) their registers have been set by convention over the years as the PC
    architecture has developed. The I/O space address 0x3f happens to be the address
    of one of the serial port''s (COM1) control registers.


    There are times when controllers need to read or write large amounts of data directly
    to or from system memory. For example when user data is being written to the hard
    disk. In this case, Direct Memory Access (DMA) controllers are used to allow hardware
    peripherals to directly access system memory this access is under strict control
    and supervision of the CPU.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 1.6 Timers


    All operating systems need to know the time and so the modern PC includes a special
    peripheral called the Real Time Clock (RTC). This provides two things: a reliable
    time of day and an accurate timing interval. The RTC has its own battery so that
    it continues to run even when the PC is not powered on, this is how your PC always
    “knows” the correct date and time. The interval timer allows the operating system
    to accurately schedule essential work.'
  merge: -1
