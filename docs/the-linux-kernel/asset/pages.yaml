  md: '# 8.5.2 Initializing the IDE Subsystem


    IDE disks have been around for much of the IBM PC''s history. Throughout this
    time the interface to these devices has changed. This makes the initialization
    of the IDE subsystem more complex than it might at first appear.


    The maximum number of IDE controllers that Linux can support is 4. Each controller
    is represented by an ide_hwif data structure in the ide_hwfs vector. Each ide_hwift
    data structure contains two ide_drive data structures, one per supported master
    and slave IDE drive. During the initialization of the IDE subsystem, Linux looks
    to see if there is information about the disks in the system''s CMOS memory. This
    battery backed memory does not lose its contents when the PC is powered off. This
    CMOS memory is actually in the system''s real time clock device which runs no
    matter if your PC is on or off. The CMOS memory locations are set by the system''s
    BIOS and tell Linux retrieves the disk''s geometry from BIOS and uses the information
    to set the ide_hwift data structure for this drive. More modern PCs use PCI chips
    such as Intel''s 82430 VX chipset The IDE subsystem uses PCI BIOS callbacks to
    the PCI (E)IDE controllers in the system. It then calls PCI specific interrupt
    routines for those chips that are present.


    Once each IDE interface or controller has been discovered, each ide_hwift is set
    to reflect the controllers and attached disks. During operation the IDE driver
    writes commands to IDE command registers in the I/O memory space. The 0x1F0-the
    primary IDE controller''s control and status registers are set by whatever in
    the early days of the IBM PC. The IDE driver registers each controller with the
    block buffer cache and VFS, adding it to the blk_dev and blkdev vectors. The IDE
    drive will also request control of the appropriate interrupt. Again interrupts
    are set by convention to be 14 for the primary IDE controller and 15 for the secondary
    IDE controller. They like all IDE details, can be overridden by command line options
    to the kernel. The IDE driver also adds a gendisk into the list of gendisk'' discovered
    during boot for each IDE controller found. This list will be used to discover
    the partition tables of all the hard disks found at boot time. The partition checking
    code understands that IDE controllers may control two IDE disks.


    # 8.5.3 SCSI Disks


    The SCSI (Small Computer Interface) bus is an efficient peer-to-peer data bus
    that supports up to eight devices per bus, including one or more hosts. Each device
    has a unique identifier and is set by jumpers on the disks. Data can be transferred
    synchronously or asynchronously between any two devices on the bus and with 32
    bit wide data transfers up to 40 Mbytes per second are possible. The SCSI bus
    transfers both data and state information between devices, and a single transaction
    between an initiator and a target can involve up to eight phases. You can tell
    the current phase of a SCSI bus five signals from the bus. The eight phases are:


