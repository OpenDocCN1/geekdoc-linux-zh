  md: '# 8.3 Memory


    Device drivers have to be careful when using memory. As they are part of the Linux
    kernel they cannot use virtual memory. Each time a device driver runs, maybe as
    an interrupt is received or as a bottom half or task handler is scheduled, the
    current process may change. The device driver cannot rely on a particular process
    running if it is doing work on its behalf. Like the rest of the kernel, device
    drivers use data structures to keep track of the device it is controlling. These
    data structures can be statically allocated, part of the device driver''s code,
    but would be wasteful as it makes the kernel larger than it need be. Most device
    drivers allocate kernel, non-paged, memory to hold their data.


    Linux kernel memory deallocation and deallocation routines and it is that the
    device drivers use. Kernel memory is allocated in chunks that are powers of 2.
    For example 128 or 512 bytes, even if the device driver asks for less. The number
    of bytes that the device driver requests is rounded up to the next block size
    boundary. This makes memory deallocation easier as the smaller free blocks can
    be recombined into bigger blocks.


    It may that Linux needs to do a lot of extra work when the memory is requested.
    If the amount of free memory is low, physical pages may need to be discarded or
    written to the swap device. Normally, Linux would suspend the requester, putting
    the process onto a wait queue until there is enough physical memory. No device
    drivers (or not Linux kernel core) may want this to happen and so the kernel memory
    allocation routines can be requested if they cannot immediately allocate memory.
    If the device driver wishes to DMA to or from the allocated memory it can also
    specify that the memory is DMA''able. This way it is the Linux kernel to understand
    what constitutes DMA''able memory for this system, and not the device driver.


    # 8.4 Interfacing Device Drivers with the Kernel


    The Linux kernel must be interact with them in standard ways. Each class of device
    driver, character, block and network, provides common interfaces that the kernel
    uses when requesting services from them. These common interfaces mean that the
    kernel can often treat very different devices and their drivers absolutely the
    same. For example, SCSI and IDE disks behave differently but the Linux kernel
    uses the same interface to both of them.


    Linux is very dynamic, every time a Linux kernel boots it may encounter different
    physical devices and need different drivers. Linux allows you to include device
    drivers at boot time via configuration scripts. When these drivers are initialized
    at boot time they may not discover any hardware to copy. Drivers can be loaded
    as kernel modules when they are needed. To copy with this dynamic nature of device
    drivers, drivers register themselves with the kernel as they are initialized.
    Linux maintains tables of registered device drivers as part of its interfaces
    with them. These tables include pointers to routines and information that support
    the interface with that class of devices.'
