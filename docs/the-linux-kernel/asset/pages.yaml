    SCSI controller is an example of a SCSI host. If a Linux system has more one SCSI
    controller of the same type, each instance will be represented by a separate SCSI
    host. This means that a SCSI device driver may control more than one instance
    of its controller. SCSI hosts are almost always the initiator of SCSI commands.


