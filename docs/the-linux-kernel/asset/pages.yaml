    Last Revision 21 September 1998, by Michael K. Johnson


    This file describes the goals and current status of the Linux Documentation-Project,
    including names of projects, volunteers, FTP sites, and so on.


    # C.1 Overview


    The Linux Documentation Project is working on developing good, reliable docs for
    the Linux operating system. The overall goal of the LDP is to collaborate in taking
    care of all the issues of Linux documentation, ranging from online docs (man pages,
    textinfo docs and so on) to printed manuals covering topics such as installing,
    using, and running Linux. The LDP is essentially a loose team of volunteers with
    little central organization; anyone who is interested in helping is welcome to
    join in the effort. We feel that working together and agreeing on the direction
    and scope of Linux documentation is the best way to, reduce problems with conflicting
    efforts—two people writing books on the same aspect of Linux wastes everyone''s
    time along the way.


    The LDP is set out to produce the canonical set of Linux online and printed documentation.
    Because our docs will be freely available (like software licensed under the terms
    of the GNU GPL and distributed on the net, we are able to easily update the documentation
    to stay on top of many changes in the Linux world. If you LDP works, see the section
    “Publishing LDP Manuals”, below.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# C.2 Getting Involved


    Send mail to linux-howto@metalab.unc.edu


    Of course, you''ll need to get in touch with the coordinator of whatever LDP

    projects you''re interested in working on; see the next section.


    # C.3 Current Projects


    For a list of current projects, the LDP Homepage at http://sunsite.unc.edu/LDP/ldp.html.

    The best way to get involved one of these projects is to pick up the current

    version of the manual and send revisions, editions, or suggestions to the coordinator.

    You probably want to coordinate with the author before sending revisions so that

    you know you are working together.


    # C.4 FTP sites for LDP works


    LDP works can be found on sunsite.unc.edu in the directory /pub/Linux/docs. LDP

    manuals are found in /pub/Linux/docs/LDP, HOWTOs and other documentation

    found in /pub/Linux/docs/HOWTO.


    # C.5 Document Conventions


    Here the conventions that are currently used by LDP manuals. If you are inter-

    ested in writing another manual using different conventions, please let us know
    of

    y plans first.


    The *pages* – the Unix standard for online manuals – are created with the Unix

    standard nroff (or BSD macros).


    The *guides* – full books produced by the LDP – have historically been done in
    LaTeX,

    as their primary goal is to be printed documentation. However, guide authors

    have been moving towards SGML with the DocBook DTD, because it allows them

    to create more kinds of output, both printed and on-line. If you use LaTeX,

    have a style you can to keep your print consistent with other LDP

    dnduments, and we suggest that you use


    The HOWTO documents are all required to be in SGML format. Currently, the

    use the linuxdoc DTD, which is quite simple. There is a move about to switch to
    the

    DocBook DTD it.


    LDP documents must be freely redistributable without fees paid to the authors.

    is that the text be modifiable, and it is encouraged. You can come up

    with your own license terms that satisfy this constraint, or you can use a previously

    licensed. The LDP provides a boilerplate license that you can use, and

    people like to use the GPL, and others write their own.


    The copyright for each manual should be in the name of the head writer or coordi-

    nator for the project. "The LDP Documentation Project" isn’t a formal entity and

    should’t be used to copy the docs.'
  merge: -1
