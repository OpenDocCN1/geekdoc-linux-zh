  md: '# 2.2.3 Device drivers


    Device drivers make up the major part of the Linux kernel. Like other parts of
    the operating system, they operate in a highly privileged environment and can
    cause disaster if they get things wrong. drivers control the interaction between
    the operating system and the hardware device they are controlling. For example,
    the filesystem makes use of a general block device interface when writing blocks
    to an IDE disk. The driver takes care of the details and makes device specific
    things happen. Device drivers are specific to the controller chip they are driving
    which is for why, you need the NCR810 SCSI driver if your system has an NCR810
    SCSI controller.


    # 2.2.4 The Filesystems


    In Linux, as it is for Unix™, the separate filesystems that the system may not
    be accessed by device identifiers (such as a drive number or a drive name) but
    instead are combined into a single hierarchical tree structure that represents
    the filesystem as a single entity. Linux adds each new filesystem into this single
    filesystem tree as they are mounted onto a mount directory; for example /mnt/cdrom.
    One of the most important features of Linux is its support for many different
    systems. This makes it very flexible and well coexist with other operating systems.
    The most popular filesystem is the EXT2 and this is the filesystem supported by
    most of the Linux distributions.


    A filesystem gives the user a sensible view of files and directories held on the
    head of the system regardless of the filesystem type or the characteristics of
    the underlying device. Linux transparently supports many filesystems (for example
    MS-DOS and EXT2) and all of the mounted files and filesystems as one integrated
    virtual filesystem. So, in general, users and processes do not need to know what
    sort of filesystem they are part of, they just use them.


    The block driver hides the differences between the physical device types (for
    example, IDE and SCSI) and, so far as each filesystem is concerned, the physical
    devices just linear collections of blocks of data. The block sizes may vary between
    devices, for 512 bytes is common for filesystems where 1024 bytes is common for
    IDE devices and, again, this is hidden from the users of the system. An EXT2 filesystem
    looks the same no matter what device holds it.


    # 2.3 Kernel Data Structures


    The operating system must keep a lot of information about the current state of
    the system. As things happen within the system these data structures must be changed
    to reflect the current reality. For example, a new process be created when a user
    logs onto the system. The kernel must create a data structure representing the
    new process and link it with the data structures representing all of the other
    processes in the system.


    Most these data structures exist in physical memory and are accessible only by
    the kernel and its subsystems. Data structures contain data and pointers; addresses
    of other data structures or the addresses of routines. Taken all together, the
    data structures used by the Linux kernel can look very confusing. Every data structure'
