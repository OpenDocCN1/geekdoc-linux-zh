    This chapter describes how the Linux kernel can dynamically load functions, for
    example filesystems, only when they are needed.


    Linux is a monolithic kernel; that it is, one, single, large program where all
    the functional components of the kernel have access to all of its internal data
    structures and routines. The alternative is to have a micro-kernel structure where
    the functional pieces of the kernel are broken out into separate units with strict
    communication mechanisms between them. This makes adding new components into the
    kernel via the configuration process rather time consuming. Say you use a SCSI
    driver for an NCR 810 and had not built it into the kernel. You would have to
    configure and build a new kernel before you use the NCR 810. There is an alternative,
    Linux allows you to dynamically load and unload modules as you need them. Linux
    modules are lumps of code that can be dynamically linked into the kernel at any
    point after it has booted. They can be unlinked from the kernel and removed when
    they are no longer needed. Most Linux modules are device drivers, pseudo-filesystem
    drivers such as network drivers, or file-systems.


