    # # 3.1 An Abstract Model of Virtual Memory


    Before considering the methods that Linux uses to support virtual memory it is
    useful to consider an abstract model that is not cluttered by too much detail
    As the processor executes a program it reads an instruction from memory and decodes
    it. In the decoding it may need to fetch or store the contents of a location in
    memory The processor then executes the instruction and moves onto the next instruction
    in the program. In this way the processor is always accessing memory either to
    fetch instructions or to fetch and store


    In a virtual memory system of all these addresses are virtual addresses and not
    physical addresses. These virtual addresses are converted into physical addresses
    by the processor based on information held in a set of tables maintained by the
    operating system.


    To make this translation easier, virtual and physical memory are divided into
    handy sized chunks pages. These pages are all the same size, they need not be
    but if they were not, the system would be very hard to administer. Linux on Alpha
    XP systems uses 8 Kbyte pages and on Intel x86 systems it uses 4 Kbyte pages.
    Each of these pages is given a unique number; the page frame number (PFN). In
    this paging model, a virtual address is composed of two parts: an offset and a
    virtual frame number. If the page size is 4 Kbytes, bits 11:0 of the virtual address
    contain'
