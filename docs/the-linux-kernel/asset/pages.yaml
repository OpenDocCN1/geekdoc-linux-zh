    # 10.2 The Linux TCP/IP Networking Layers


    Just like the network protocols, Figure 10.2 shows that Linux implements the internet
    protocol family as a series of connected layers of software. BSD sockets are supported
    by a generic socket management software concerned only with BSD sockets. Supporting
    this is the INET socket layer, this manages the communication endpoints for the
    IP based protocols TCP and UDP. UDP (User Datagram Protocol) is a connectionless
    protocol whereas TCP (Transmission Control Protocol) is a reliable end to end.
    When UDP packets are transmitted, Linux neither cares if they arrive at their
    destination. TCP packets are numbered and both ends of the TCP connection make
    sure that transmitted data is received correctly. The IP layer contains implementing
    the Internet Protocol. This code prepend headers to transmitted data and understands
    how to route incoming IP packets to either the TCP or UDP layers. Underneath the
    IP layer, supporting all of Linux''s networking are the network devices, for example
    PPP and ethernet. Network devices do not represent physical devices; some like
    the loopback device are purely software devices. Unlike standard Linux devices
    that are created via the mknod command, network devices appear only if the underlying
    software has found and initialized them. You will see /dev/eth0 when you have
    built a kernel with the appropriate ethernet device driver in it. The ARP protocol
    sits between the IP layer and the protocols that support ARPing for addresses.'
