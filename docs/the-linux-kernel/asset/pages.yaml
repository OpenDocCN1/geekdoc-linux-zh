  md: '# 9.3.1 The bdflush Kernel Daemon


    The bdflush kernel daemon is a simple kernel daemon that provides a dynamic response
    to the system having too many dirty buffers; buffers that contain data that must
    be written out to disk at some time. It is started as a kernel thread at startup
    time and, rather confusingly, calls itself "kflush" and that is the name that
    you will see using the ps command for the number of processes in the system. Mostly
    this bdflush sleeps waiting for the number of dirty buffers in the system to grow
    too large. As buffers are allocated and discarded the dirty buffers in the system
    is checked. As a percentage of the total number of buffers in the system then
    bdflush is woken up. The default threshold is 60%, if the system is desired for
    buffers, bdflush be woken up anyway. This value can be seen and changed using
    the update command:


    # -d


    bdflush version 1.4


    +   0: Max fraction of LRU list to examine for dirty blocks

    1: 500 Max number of dirty blocks to write each time bdflush activated

    2: Num of clean buffers to be loaded onto free list by refill_freelist

    3: 256 Dirty block threshold for activating bdflush in refill_freelist

    4: 15 Percentage of cache to cache for free clusters

    5: 3000 Time for data buffers to age before flushing

    6: 500 Time for non-data (dir, bitmap, etc) buffers to age before flushing

    7: 1884 Time2 ratio (used to determine threshold for buffer fraticide).


    All of the dirty buffers are linked into the BUF_DIRTY LRU whenever they are made
    by writing data to them and bdflush tries to write a reasonable number of them
    out to their own disks. Again this number can be seen and controlled by the update
    command and the default is 500 (see above).


    # 9.3.2 The update Process


    The update command is more than just a command; it is also a daemon. When run
    as as (during initialisation) it will periodically flush all of the older dirty
    buffers out to disk. It does by calling a system service routine that does more
    or the same thing as bdflush. Whenever a dirty buffer is finished, it is tagged
    with the time that it should be written out to its own disk. Every time update
    runs it looks at all the dirty buffers in the system looking for ones with an
    expired flush. Every expired buffer is written out to disk.


