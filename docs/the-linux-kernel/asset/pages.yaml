    started to help on the part. As I worked on, I made more and more to appreciate\n\
    ot only the operating system but also the community of engineers that produces\
    \ it.\n\nHowever, Alpha AXP is only one of the many platforms that Linux runs\n\
    on. Most Linux kernels are running on Intel processor based systems but a growing\n\
    number of non-Linux systems are becoming more commonly available. Amongst\nthese\
