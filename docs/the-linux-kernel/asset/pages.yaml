  md: '![](img/ab43a1c61b6471f32341bb107ec7bec5_92_0.png)


    Figure 7.1: A Logical Diagram of Interrupt Routing


    the currently active interrupts in the system.


    Some of the interrupts in the system may be hard-wired, for example, the real
    time clock''s interval timer may be permanently connected to pin 3 on the interrupt
    controller. However, some of the pins are connected to be determined by what controller
    is plugged into a particular ISA or PCI slot. For example, pin 4 on the interrupt
    controller may be connected to PCI slot number 0 which might one day have an ethernet
    card in it but the next a SCSI controller in it. The bottom line is that each
    system has its own interrupt routing mechanisms and the operating system must
    be flexible enough to cope.


    Most modern general purpose microprocessors handle the interrupts the same way.
    When a hardware interrupt occurs the CPU stops the instructions that it was executing
    and jumps to a location in memory that contains the interrupt handling code or
    an instruction branching to the interrupt handling code. This code usually operates
    in a special mode for the CPU, interrupt mode, and normally, no other interrupts
    can happen in this mode. There are exceptions though; some CPUs rank the interrupts
    in priority and higher level interrupts may happen. This means that the first
    level interrupt handling code must be very carefully written and often has its
    stack, which it uses to store the CPU''s execution state (all of the CPU''s normal
    registers and context) before it goes off and handles the interrupt. Some CPUs
    have a special set of registers that only exist in interrupt mode and the interrupt
    code can use these registers to do most of the context saving it needs to do.


    When the interrupt has been handled, the CPU''s state is restored and the interrupt
    is dismissed. The CPU will continue to do whatever it was doing before being interrupted.
    It is important that the interrupt processing code is as efficient as possible
    and that the operating system does not block interrupts too often or for too long.'
