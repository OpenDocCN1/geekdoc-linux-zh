    input of the pr command which paginates. Finally the standard output of the pr
    command is piped into the standard input of the lpr command which prints the results
    on the default printer. Pipes are unidirectional byte streams which connect the
    standard output from one process into the input of another process. Neither process
    is aware of this and behaves as it would normally. It is the shell which sets
    up these temporary pipes between the processes.


    In Linux, a pipe is implemented using two file data structures which both point
    at the same VFS inode which points to a physical page within memory. Figure 5.1
    shows that each file data structure contains pointers to different file operation
