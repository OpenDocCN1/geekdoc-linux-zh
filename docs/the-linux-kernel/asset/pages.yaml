  md: '# Chapter 1


    # Hardware Basics


    ![](img/ab43a1c61b6471f32341bb107ec7bec5_17_0.png)


    An operating system has to work closely with the hardware system that acts as
    its foundations. The operating system needs certain services that can only be
    provided by the hardware. In order to fully understand the Linux operating system,
    you need to understand the basics of the underlying hardware. This chapter gives
    a brief introduction to that the modern PC.


    When the "Popular Electronics" magazine for January 1975 was printed with an illustration
    of the Alta 8080 on its cover, a revolution started. The Alta 8080, named after
    the destination of an early Star Trek episode, could be assembled by home electronics
    enthusiasts for a mere $297. With its Intel 8080 processor and 256 bytes of memory
    but no screen or keyboard it was puny by today''s standards.


    Its inventor, Ed Roberts, coined the term "personal computer" to describe his
    new invention, but the PC is now used to refer to any computer that you can pick
    up without needing help. By this definition, even some of the very powerful Alpha
    XP systems are PCs.


    Enthusiastic hackers saw the Alta''s potential and started to write software and
    build hardware for it. These early pioneers represented freedom; from huge batch
    processing mainframe systems run and guarded by an elite priesthood. Often fortunes
    were made by college dropouts fascinated by this phenomenon, a computer that you
    have at home on your kitchen table. A lot of hardware appeared, all different
    to some degree and hackers were happy to write software for these new machines.
    Paradoxically it was IBM who firmly cast the mould of the modern PC by introducing
    the PC in 1981 and shipping it to customers early 1982. With its Intel 8088 processor,
    64K of memory (expandable to 256K), two floppy disks and 8 character by 25 lines
    Color Graphics Adapter (CGA) was not very powerful by today''s standards but it
    sold well. It was followed, in 1983, by the IBM PC-XT which had the luxury of
    a 10MBbyte hard drive. It was not long before IBM clones were being produced by
    a host of companies such as Compaq and the architecture of the PC became a de-facto
    standard. This'
  merge: -1
  pgno: 17
