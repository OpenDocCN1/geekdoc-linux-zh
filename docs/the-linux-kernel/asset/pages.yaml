    # # 11.5 Buzz Locks


    These are better as spin locks and they are a primitive of protecting a data structure
    or piece of code. They only allow one process at a time to be within a critical
    region of code. They are used in Linux to restrict access to fields in data structures,
    using a single integer field as a lock. Each process wishing to enter the region
    changes the lock''s initial value from 0 to 1. If its current value is 1, process
    tries again, spinning in a tight loop of code. To access the memory location holding
    the lock must be atomic, the action of reading its value, checking that it is
    0 and then changing it 1 cannot be interrupted by any other process. Most CPU
    architectures provide support for this special instructions but you can also implement
    buzz locks using uncached memory.


