    of the IDE disk has a major number of 3 and a minor number of 2. Linux maps the
    device file passed in system calls (to mount a file on a block device) to the
    device''s device driver using the device number and a system of tables, for example
    chdevs.


    Linux supports three types of hardware device: character, block and network. Character
    devices are read and written directly without buffering, for example the system''s
    serial ports /dev/ttyS0 and /dev/ttyS1. Block devices can only be written to and
    read from in multiples of the block size, typically 512 or 1024 bytes. Block devices
    are accessed via the buffer cache and may be randomly accessed, it is to say,
    that any block can be read or written no matter where it is on the device. Block
    devices are accessed via their device special file but more commonly they are
    accessed via the file system. Network devices are accessed via the BSD socket
    interface and the networking subsystems described in the Networking chapter (Chapter
    10).


    There are many different device drivers in the Linux kernel (that is one of Linux''s
    strengths) and they all share common attributes:


    kernel drivers are part of the kernel and other code within the kernel, if they
    go wrong they can seriously damage the device. A badly written driver may crash
    the system, possibly corrupting file systems and losing data,


    Kernel interfaces drivers must provide a standard interface to the Linux kernel
    or to the subsystem they are part of. For example, the terminal driver provides
    a I/O interface to the Linux kernel and a SCSI device driver provides a SCSI interface
    to the SCSI subsystem which, in turn, provides both I/O and buffer caches to the
    kernel.


    Kernel mechanisms and services device drivers use standard kernel services such
    as memory allocation, interrupt delivery and wait queues to operate,


    Loadable Most of the Linux device drivers can be loaded on demand as kernel modules
    when they are needed and unloaded when they are no longer used. This makes the
    kernel very adaptable and efficient with the system''s resources,


    Configurable Linux device drivers can be built into the kernel. Which devices
    are built is configurable when the kernel is compiled


    Dynamic As the system boots and each device driver is initialized it looks for
    the hardware devices that it is controlling. It does not matter if the device
    being controlled by a particular device driver does not exist. In this case the
    device is simply redundant and causes no harm apart from occupying a little of
