  md: '# Chapter 10


    # Networks


    ![](img/ab43a1c61b6471f32341bb107ec7bec5_135_0.png)


    Networking and Linux are terms that are almost synonymous. In a very real sense
    Linux is a product of the Internet or World Wide Web (WWW). Its developers and
    users have used the web to exchange information ideas, code, and Linux itself
    is often used to support the networking needs of organizations. This chapter describes
    how Linux supports the network protocols known collectively as TCP/IP.


    The TCP/IP protocols were designed to support communications between computers
    connected to ARPANET, an American research network funded by the US government.
    The ARPANET pioneered networking concepts such as packet switching and protocol
    layering where one protocol used the services of another. ARPANET was retired
    in 1988 but its successors (NSF NET and the Internet) have grown even larger.
    What is now known as the World Wide Web grew from the ARPANET and is supported
    by the TCP/IP protocols. Unix™ was extensively used on the ARPANET and the first
    released networking version of Unix was 4.3 BSD. Linux’s networking implementation
    is modeled on 4.3 BSD in that it supports BSD sockets (with some extensions) and
    the full range of TCP/IP networking. This programming interface was chosen because
    of its popularity and to help applications be portable between Linux and other
    Unix™ platforms.


    # 10.1 An Overview of TCP/IP Networking


    This section gives an overview of the main principles of TCP/IP networking. It
    is not meant to be an exhaustive description, for I suggest that you read [10,
    Comer].


    In an IP network every machine is assigned an IP address, this is a 32 bit number
    that uniquely identifies the machine. The WWW is a very large, and growing, IP
    network and every machine that is connected to it has to have a unique IP address
    assigned to it. IP addresses are represented by four numbers separated by dots,
    for


    > National Science Foundation'
