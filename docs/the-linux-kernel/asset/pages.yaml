  md: '# Chapter 4


    # Processes


    ![](img/ab43a1c61b6471f32341bb107ec7bec5_51_0.png)


    This chapter describes what a process is and how the Linux kernel creates, manages
    and deletes the processes in the system.


    Processes carry out tasks within the operating system. A program is a set of machine
    code instructions and data stored in an executable image on disk and is, as such,
    a passive entity; a process can be thought of as a computer program in action.
    It is a dynamic entity, constantly changing as the machine code instructions are
    executed by the processor. As well as the program''s instructions and data, the
    process also includes the process counter and all of the CPU''s registers as well
    as the process stacks containing temporary data as routine parameters, return
    addresses and saved variables. The current executing program, or process, includes
    all of the current activity in the microprocessor. Linux is a multiprocessing
    operating system. Processes are separate tasks each with their own rights and
    responsibilities. If one process crashes it will not cause another in the system
    to crash. Each individual process runs in its own virtual address space and is
    not capable of interacting with another process except through secure, kernel
    mechanisms.


    During the lifetime of a process it will use most system resources. It will use
    the CPUs in the system to run its instructions and the system''s physical memory
    to hold it and its data. It will open and use files within the filesystems and
    may directly use the physical devices in the system. Linux must keep track of
    the process itself and system resources that it has so that it can manage and
    the other processes in the system. It would not be fair to the other processes
    if one process monopolized most of the system''s physical memory or its CPUs.


    The most precious resource in the system is the CPU, usually there is only one.
    Linux is a multiprocessing operating system, its objective is to have a process
    running on each CPU in the system at all times, to maximize CPU utilization. If
    there are more processes than CPUs (and usually are), the rest of the processes
    must wait before a CPU becomes free until they can run. Multiprocessing is a simple
    idea;'
