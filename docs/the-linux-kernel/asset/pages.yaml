  md: '# 8.2 Direct Memory Access DMA


    Using interrupts driven drivers to transfer data to or from hardware devices works
    well when the amount of data is reasonably low. For example a 9600 baud modem
    can transfer approximately one character every millisecond (1/1000th second).
    If the interrupt latency, the amount of time it takes between the hardware raising
    the interrupt and the device driver''s interrupt handling routine is low (say
    2 milliseconds) then the overall system impact of the data transfer is very low.
    The 9600 baud modem data transfer would only take 0.002% of the CPU''s processing
    time. For high speed devices, such as disk controllers or ethernet devices the
    data transfer rate is a higher. A SCSI device can transfer up to 40 Megabytes
    of information per second.


    Direct Memory Access, or DMA, was invented to solve this problem. A DMA controller
    allows data to or from the system''s memory without the intervention of the processor.
    PC''s ISA DMA controller has 8 channels with a 16 bit address register and a 16
    bit counter. To initiate the device driver sets up the DMA channel''s address
    and counter registers with the direction of the data transfer, read or write.
    It then tells the device it may start the DMA when it wishes. When the transfer
    is complete the CPU is free to do other things.


    Device drivers have to be careful when using DMA. First of all the DMA controller
    knows nothing of virtual memory, it only has access to the physical memory in
    the system. This means that the memory being DMA d to from must be a conscious
    block of physical memory. This means that you cannot DMA directly into the virtual
    address space of a process. You can however lower the process''s physical pages
    into memory, preventing them from being swapped out the swap device during a DMA
    operation. Second, the DMA controller cannot access the whole of physical memory.
    The DMA channel''s address register represents the first 16 bits of the DMA address,
    the next 8 bits from the page register. This means that DMA requests are limited
    to the bottom 16 Mbytes of memory.


    DMA channels are scarce resources, there are only 7 of them, and they cannot be
    shared between device drivers. Just like interrupts, the device driver must be
    able to work out which DMA channel should use. Unlike interrupts, some devices
    have a fixed DMA channel. The floppy device, for example, always uses DMA channel
    2. Times the DMA channel for a device can be by jumpers; a number of ethernet
    devices use this technique. The more flexible devices can be told (via their CSRs)
    which DMA channels to use and, in this case, the device driver can simply pick
    a free DMA channel to use.


    Linux tracks the use of DMA channels using a vector of dma_chan data structures
    (one per DMA channel). The dma_chan data structure contains just two fields, a
    pointer to a string describing the owner of the DMA channel and a flag indicating
    whether the DMA channel is allocated or not. It is this vector of dma_chan data
    structures that is printed when you cat /proc/dma.'
