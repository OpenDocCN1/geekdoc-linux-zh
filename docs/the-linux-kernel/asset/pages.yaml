    The directory cache consists of a hash table, each entry which points at a list
    of directory entries that have the same hash value. The hash function uses the
    device number of the device holding the file system and the directory''s name
    to calculate the offset, or index, into the hash table. It allows cached directory
    entries to be quickly found. If not using a hash lookups within the cache take
    too long to find entries, or even not to find them.


    In order to keep the cache valid and to update the lists of Least Recently Used
    (LRU) directory cache entries. When a directory entry is first put into the cache,
    or when it is first looked up, it is added to the end of the first LRU list. In
    a full cache this hash will displace an existing entry from the back of the second
    LRU list. As the directory entry is accessed again it is promoted to the front
    of the second LRU cache list. Again, this may displace a cached level two directory
    entry at the front of the level one and two LRU lists. The only reason that entries
    are at the front of the lists is that they have not been recently accessed. If
    they had, they would be nearer the back of the lists. The entries in the second
    level LRU cache list are safer than entries in the level one LRU cache list. This
    is the intention that entries have not only been looked up but also they have
    been repeatedly referenced.


