    the system and it is the responsibility of each device driver to request the interrupt
    it wants when the driver is initialized. Figure 7.2 shows that irq_action is a
    vector of pointers to the irqaction data structure. Each irqaction data structure
    contains information about the handler for this interrupt, including the address
    of the interrupt handling routine. As the number of interrupts and how they are
    handled varies between architectures and, sometimes, systems, the Linux handling
    code is architecture specific. This means that the size of the irq_action vector
    varies depending on the number of interrupt sources that there are.


    When the interrupt happens, Linux must first determine its source by reading the
    interrupt status of the system''s programmable interrupt controllers. It then
    translates that source into an offset in the irqaction vector controller. So,
    for example, an interrupt on pin 6 of the interrupt controller from the floppy
    vector would be translated into the seventh pointer in the vector of interrupt
    handlers. If there is not an interrupt handler for the interrupt that occurred
    then the Linux kernel will log an error, otherwise it will call into the interrupt
    handling routines for all of the irqaction data structures for this interrupt
    source.


    When the device driver''s handling routine is called by the Linux kernel it must
