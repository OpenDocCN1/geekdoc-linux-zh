  md: '# 9.1.6 Changing the Size of a File in EXT2 File System


    One common problem with a file is its tendency to fragment. The blocks that hold
    the data get spread all over the file system and this makes sequentially accessing
    the data blocks of a file more and inefficient apart the data blocks. The EXT2
    file system tries to overcome this by allocating the new block for a physically
    close to its current data blocks or at least in the same Block Group as its current
    data blocks. When this fails it will allocate blocks in another Block Group.


    Whenever a process attempts to write data into a file file system checks to see
    if the data has gone off the end of the file. If so, it must allocate a new block
    for this file. If the allocation is complete, the process cannot run; it must
    wait for the file system to allocate a new block and write the rest of the data
    to it before it can continue. The first thing that the ext2 block allocation routines
    do is to lock the EXT2 Superblock for this file. Allocating and deallocating changes
    fields within the superblock, and the Linux file system cannot allow more than
    one process to do this at the same time. If another process needs to allocate
    more blocks, it will wait until waiting for the superblock is suspended, unable
    to run, until control of the superblock is relinquished by its current user. Access
    to the superblock is granted on a first come, first served and once a process
    has control of the superblock, it keeps control until it has finished. The process
    checks that there are free blocks left in the file system. If there are not enough
    blocks, then this attempt to allocate more will fail and the process will relinquish
    control of this file system''s superblock.


    | ext2_new_block() in fs/ext2/balloc.c |


    If there are enough free blocks in the file system, the process tries to allocate
    one. If the EXT2 file system has been built to preallocate data blocks then we
    may be able to take one of them. The preallocated block not actually exists, they
    just reserved within the allocated bitmap. The VFS representing the file that
    we are trying to allocate a new data block for ext2 specific fields, prealloc_block
    and prealloc_count, which are respectively the number of the first preallocated
    block and how many of them there are, If were no preallocated blocks or preallocation
    is not enabled, the EXT2 file system must allocate a new block. The EXT2 file
    system first looks to see if the data after the last block in the file is free.
    Locally, this is the most efficient way to allocate as it makes sequential accesses
    much quicker. If this block is not free, then the search for a data block within
    64 blocks of the of the ideal block, although not is at least close and within
    the same Block Group as the other data blocks belonging to this file.


    If even not a free block, the process starts looking in all of the other Block
    Groups in turn until it finds some blocks. The block allocation code counts a
    cluster of eight blocks somewhere in one of the Block Groups. If it cannot find
    eight together, it will settle for. If preallocation is wanted and enabled it
    will update prealloc_block and prealloc_count accordingly.


    Wherever it finds the free block, the block allocation code updates the Group''s
    block bitmap and allocates a data buffer in the buffer cache. That buffer is uniquely
    identified by the file system''s supporting device identifier and the block number
    of the allocated block. The data in the buffer is zero and the buffer is marked
    as “dirty” to show that its contents have not been written to the physical'
