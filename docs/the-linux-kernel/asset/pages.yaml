    # 8.5 Hard Disks


    Disk drives provide a more permanent method for storing data, keeping it on spinning
    disk platters. To write data, a head magnets minute particles on the platter''s
    surface. The data is read by a head, which can detect whether a particular particle
    is magnetized.


    A disk consists of one or more tracks, each made of finely polished glass or ceramic
    compounds with a fine layer of iron oxide. The platters are attached to a central
    spindle and spin at a constant speed that can vary between 3000 and 10000 RPM.
    Compare this to a floppy disk which spins at 360 RPM. The disk''s read/write heads
    are responsible for reading and writing data and there is a pair for each track,
    one for each surface. The read/write heads do not physically touch the surface
    of the platters, instead they float on a very thin (100 millionths of an inch)
    cushion of air. The read/write heads are attached together, they all move across
    the surfaces of the platters together.


    Each surface of the platter is divided into narrow, concentric circles called
    tracks. Track 0 is the outermost track and the highest track is the track closest
    to the central spindle. A cylinder is the set of all tracks with the same number.
    All of the 5 tracks from each side of every platter in the disk is known as cylinder.
    As the number of cylinders is the same as the number of tracks, you see geometries
    described in terms of cylinders. A sector is the smallest unit of data that can
    be written or read from a hard disk. A common sector is 512 bytes and the sector
    size was set when the disk was formatted, usually when the disk was manufactured.


    A disk is usually described by its geometry, the number of cylinders, heads and
    sectors. For example, at boot time Linux decodes one of my IDE disks:


    ```

    hdb: Conner Peripherals 540MB- CFS540A, 516MB/64KB Cache, CHS=1050/16/63

    ```


    This means that it has 1050 cylinders (tracks), 16 heads (8) and 63 sectors per
    track. With a sector, or block, of 512 bytes this gives the disk a capacity of
    529220 bytes. This does not match the disk''s stated capacity of 516 Mbytes as
    some of the sectors are used for partitioning information. Some disks automatically
    find bad sectors and re-index the disk to work around them.


    Hard disks can be further subdivided into partitions. A partition is a large group
    of sectors allocated for a particular purpose. Partitioning a disk allows to a
    lot of Linux systems have a single disk with three partitions; one containing
    a DOS filesystem, another an EXT2 filesystem and a third for the swap partition.
