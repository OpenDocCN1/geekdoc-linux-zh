    # The Linux Kernel


    Copyright © 1996-1999

    David A Rusling

    david.r@digital.com

    REVIEW, Version 0.8-3


    January 25, 1999


    This book is for Linux enthusiasts who want to know how the Linux kernel works.
    It is not an internals manual. Rather it describes the principles and mechanisms
    that Linux uses; how and why the Linux kernel works the way that it does. Linux
    is a moving target; this book is based upon the current, stable, 2.0.33 sources
    as are are what most individuals and companies are now using.


    This book is freely distributable, you may copy and redistribute it under certain
    conditions. Please refer to the copyright and distribution statement.'
