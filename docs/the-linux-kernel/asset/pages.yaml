    may access these resources only by passing a unique reference to the kernel via
    system calls. Access to System V IPC objects is checked using access permissions,
    much like access to files. The access rights to the System V IPC object is used
    by the creator of the object via system calls. The object''s reference identifier
    is used by each mechanism as an index into a table of resources. It is not a straight
    forward index but requires some manipulation to generate the index.


