    # 8.5.1 IDE Disks


    The most common used in Linux systems today are Integrated Disk Electronic or
    IDE disks. IDE is a disk interface rather than I/O bus like SCSI. Each IDE controller
    can support up to two disks, one master and the other slave disk. The master and
    slave functions are usually set by jumpers on the disk. The first IDE controller
    in the system is known as the primary IDE controller, the secondary controller
    and so on. IDE can manage about 3.3 Megabytes per second of data transfer to or
    from the disk and the maximum IDE disk size is 538MB. Extended IDE, has raised
    the disk size to a maximum of 8.6 Glytes and IDE and EIDE disks are cheaper data
    transfer rate up to 16 MBytes per second so on. SCSI and most modern PCs contain
    one or more on board IDE controllers.


    Linux names IDE disks in the order in which it finds them. The master disk on
    the primary controller is /dev/hda and the slave disk is /dev/hdb. The master
    is disk on the secondary IDE controller. The IDE subsystem registers IDE controllers
    and not with the Linux kernel. The major identifier for the primary IDE controller
    is 3 and 22 for the secondary IDE controller. This means that if a system has
    two controllers there be entries for the IDE subsystem at indices 3 and 22 in
    the blk_dev and blkdev_vectors. The special files for IDE controller reflect this
    naming, /dev/hda and /dev/hdb, both connected to the primary IDE controller, Any
    file or buffer cache operations for the IDE subsystem on these special files will
    be directed to the IDE subsystem as the kernel uses the major identifier as one.
    When the request is, it is made up to the IDE to work out which IDE disk is requested
    for. To do this IDE uses the minor device number from the device special identifier,
    this contains information that allows it to direct the request to the correct
