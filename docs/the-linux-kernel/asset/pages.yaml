    # ## 9.2.7 Unmounting a File System


    The workshop manual for my MG usually describes assembly as the reverse of assembly
    and the reverse is more or less true for unmounting a file system. A file system
    cannot be unmounted if something is using the system or one of its files. For
    example, you cannot unmount /mnt/cdrom if a process is using that directory or
    any of its children. If anything is using the file system to be unmounted there
    may be VFS inodes from the VFS inode cache, and checks for this looking through
    the list of inodes owned by the device that this file system occupies. The VFS
    superblock for the mounted file system is dirty, and that it has been modified,
    then it must be written back to the file system on disk. Once it has been written
    to disk, the memory occupied by the VFS superblock is returned to the mount. Finally
    the vfsmount data structure for this mount is unlinked from vfsmntlist and freed.


