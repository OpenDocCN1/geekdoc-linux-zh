    \ under the Free Software Foundation's GNU Public License. At first\nglance, the\
    \ source will see directories kernel,\nmm and not but what they contain and how\
    \ does code work? What is needed\nab broader understanding of the overall structure\
    \ and aims of Linux. This,\nhort, is the aim of this book: to promote a clear\
