    # 3.2 Caches


    If you implement a system using the above model then it would work, but not particularly
    efficient. Both operating system and processor designers try to extract more performance
    from the system. Apart from making the processors, memory and so on the best approach
    is to maintain caches of useful information and so on make some operations faster.
    Linux uses a number of memory management caches:


    **Buffer Cache** The buffer cache contains data buffers that are used by the device
    drivers. These buffers are of fixed sizes (for example 512 bytes) and contain
    blocks of information that have either been read from a block device or are being
    written to. A block device is one that can only be accessed by reading and writing
    fixed sized blocks of data. Hard disks are block devices.


    > See fs/buffer.c


    The buffer cache is indexed via the device identifier and the desired block number
    is used to quickly find a block of data. Block devices are only ever accessed
    via the buffer cache. If data can be found in the buffer cache then it does not
    need to be read from the physical block device, for a hard disk, and access to
    it is much faster.


    **Page Cache** This is used to speed up access to images and data on disk. It
    is used to cache the logical contents of a file at a time and is accessed via
    the file and offset within the file. As pages are read into memory from disk,
    they are cached in the page cache.


