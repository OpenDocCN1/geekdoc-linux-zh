    # 9.3 The Buffer Cache


    As the mounted file systems are they generate a lot of requests to the block devices
    to read and write data blocks. All block data read and write requests are given
    to the device drivers in the form of `buffer_head` data structures via standard
    kernel routine calls. These give all of the information that the block device
    drivers need; the device identifier uniquely identifies the device and the block
