  md: 'comments in each new version I have produced and I am more than happy to receive
    comments, however please note my new e-mail address.


    A number of lecturers have written to me asking if they can use some or parts
    of this book in order to teach computing. My answer is an emphatic yes; this is
    one use of the book that I particularly wanted. Who knows, there may be another
    Linus Torvalds sat in the class.


    Special thanks must go to John Rigby and Michael Bauer who gave me full, detailed
    review notes of the whole book. Not an easy task. Alan Cox and Stephen Tweedie
    have patiently answered my questions - thanks. I used Larry Ewing''s penguins
    to brighten up the chapters a bit. Finally, thank you to Greg Hanks for accepting
    this book into the Linux Documentation Project and onto their web site.'
