  md: '# Chapter 3


    # Memory Management


    ![](img/ab43a1c61b6471f32341bb107ec7bec5_31_0.png)


    The memory management subsystem is one of the most important parts of the operating
    system. Since the early days of computing, there has been a need for more memory
    than exists physically in a system. Strategies have been developed to overcome
    this limitation and the most successful of this is virtual memory. Virtual memory
    makes the system appear to have more memory than it actually has by sharing it
    between competing processes as they need it.


    Virtual memory does more than just make your computer''s memory go further. The
    memory management subsystem provides:


    **Large Address Spaces** The operating system makes the system appear as if it
    has a larger amount of memory than it actually has. The virtual memory can be
    many times larger than physical memory in the system,


    **Protection** Each process in the system has its own virtual address space. These
    virtual address spaces are completely separate from each other and a process running
    one application cannot affect another. Also, the hardware virtual memory allows
    areas of memory to be protected against writing. This protects code and data from
    being overwritten by rogue applications.


    **Memory Mapping** Memory mapping is used to map image and data files into a processes
    address space. In memory mapping, the contents of a file are linked directly into
    the virtual address space of a process.


    **Fair Physical Memory Allocation** The memory management subsystem allows each
    running process in the system a fair share of the physical memory of the system,


    **Shared Virtual Memory** Although virtual memory allows processes to separate
    (virtual) address spaces, there are times when you need processes to share memory.
    For example there could be several processes in the system'
