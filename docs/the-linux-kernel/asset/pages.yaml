  md: '# 4.8.2 Script Files


    Script files executables that need an interpreter to run them. There are a wide
    variety of interpreters available for Linux; for example wish, perl and command
    shells such as tsch. Linux uses Unix™ convention of having the first line of a
    script file named the name of the interpreter. So, a typical script file would
    start:


    ```

    #!/usr/bin/wish

    ```


    The script binary loader tries to find the interpreter for the script. It does
    this by attempting to open the executable file that is named in the first line
    of the script. If it can open it, it has a pointer to VFS node and it can go ahead
    and have it interpret the script file. The name of the script file becomes argument
    zero (the first argument) and all of the other arguments move one place (the original
    first argument becomes the new second and so on). Loading the interpreter is done
    in the same as Linux loads all of its executable files. Linux tries each binary
    format in turn until one works. This means that you could in theory stack several
    interpreters and binary formats making the Linux binary format handler a very
    flexible piece of software.'
