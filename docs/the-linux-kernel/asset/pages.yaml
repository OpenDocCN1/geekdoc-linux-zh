    # # Interrupts and Interrupt Handling


    ![](img/ab43a1c61b6471f32341bb107ec7bec5_91_0.png)


    This chapter looks at how interrupts are handled by the Linux kernel. Whilst the
    kernel has generic mechanisms and interfaces for handling interrupts, most of
    the interrupt handling details are architecture specific.


    Linux uses a different kind of hardware to perform many different tasks. The video
    device drives the monitor, the IDE device drives the disks and so on. You could
    drive these devices synchrony, that is you could send a request for some operation
    (say writing a block of memory out to disk) and then wait for the operation to
    complete. That method, although it would work, is very inefficient and the operating
    system would spend a lot of time "busy doing nothing" as it waited for each operation
    to complete. A better, more efficient way is to make the request and then do,
    more work and later to be interrupted by the device when it has finished the request.
    With this scheme, there may be many outstanding requests to the devices in the
    system all happening at the same time.


    There has to be some hardware support for the devices to interrupt whatever the
    CPU is doing. Most, if not all, general purpose processors such as the Alpha XP
    are wired such that changing the voltage (for example changing from +5v to -5v)
    causes the CPU to stop what it is doing and to start special code to handle the
    interrupt; the interrupt handling code. One of these might be connected to an
    interrupt timer and receive an interrupt every 100th of a second, others may be
    connected to the other devices in the system, such as the SCSI controller.


    Systems use an interrupt controller to group the devices together before passing
    the signal to a single interrupt pin on the CPU. This saves interrupt pins on
    the CPU and also gives flexibility when designing systems. The interrupt controller
    has mask and status registers that control the interrupts. Setting the bits in
    the mask register enables and disables interrupts and the status register returns'
  merge: -1
