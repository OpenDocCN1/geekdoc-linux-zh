  md: '# Preface


    Linux is a phenomenon of the Internet. Born out of the hobby project of a student
    it has grown to become more popular than any freely available idle operating system.
    To many Linux is an enigma. How can something that is free worthwhile? In a world
    dominated by a handful of large corporations, how can something that has been
    written by a bunch of "hackers" (sic) hope to compete? How software contributed
    to many people in many different countries around the world have a hope of being
    stable and effective? Yet stable and effective it is and compete it does. Many
    Universities and research establishments use it for their everyday needs. People
    are running on their home PCs and I would wager that most companies are using
    it somewhere even if they do not realize they do. Linux is used to browse the
    web, host web sites, write theses, send electronic mail and, always with computers,
    to play games. Linux is emphatically not a toy; it is a fully developed and professionally
    written operating system by enthusiasts all over the world.


    The roots of Linux can be traced back to the origins of Unix In 1969, Ken Thompson
    of the Research Group at Bell Laboratories began experimenting on a multi-user,
    multi-tasking operating system using an otherwise idle PDP-7. He was soon joined
    by Dennis Ritchie and the two of them, with other members of the Research Group
    produced the early versions of Unix. Ritchie was influenced by an earlier project,
    MULTICS and the name Unix was itself a pun on the name MULTICS. Early versions
    were written in assembly code, but the third version was rewritten in a programming
    language, C was designed and written by Ritchie expressly as a programming language
    for writing operating systems. This rewrite allowed Unix to move onto the more
    powerful PDP-11/45 and 11/70 computers then being produced by DIGITAL. The rest,
    as they say, is history. Unix moved out of the laboratory into mainframe computing
    and most major manufacturers were producing their own versions.


    Linux was the solution to a simple need. The only software that Linux Torvalds,
    Linux''s author and principle maintainer was able to afford was Minix. Minix is
    a simple, Unixlike operating system widely used as a teaching aid. Linux was less
    impressed with its features, his solution was to write his own software. He took
    Unix as his model as an operating system that he was familiar with in his day
    to student life. He started with an Intel 386 based PC and started to write. Progress
    was rapid, and excited by this, Linux offered his efforts to other students via
    the emerging world computer networks, mainly used by the academic community. Others
    saw the software and started contributing. Much of this new software was itself
    the solution to a problem that one of the contributors had. Before long, Linux
    had become an operating system. It is important to note that Linux'
