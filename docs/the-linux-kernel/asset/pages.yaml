  md: 'ARBITRATION A SCSI device has attempted to get control of the SCSI bus, it
    does this by asserting its SCSI identifier onto the address pins. The highest
    number SCSI identifier wins.


    SE When a device has succeeded in getting control of the SCSI bus through arbitration
    it must now signal the target of this SCSI request that it wants to send a command
    to it. It does this by asserting the SCSI identifier of the target on the address
    pins.


    RELECTION SCSI devices may disconnect during the processing of a request. The
    target may then reselect the initiator. Not all SCSI devices support this phase.


    COMMAND 6,10 or 12 bytes of command can be transferred from the initiator to the
    target,


    DATA IN, DATA OUT During these phases data is transferred between the initiator
    and the target,


    STATUS This phase is entered after completion of all commands and allows the target
    to send a status indicating success or failure to the initiator,


    MESSAGE IN, MESSAGE OUT Additional information is transferred between the initiator
    and the target.


