  md: '# Chapter 14


    # The Linux Kernel Sources


    ![](img/ab43a1c61b6471f32341bb107ec7bec5_169_0.png)


    This chapter describes where in the Linux kernel sources you should start looking
    for particular kernel functions.


    This book does not depend on a knowledge of the ''C'' programming language or
    require that you have the Linux kernel sources available in order to understand
    how the Linux kernel works. That said, it is a fruitful exercise to look at the
    kernel sources to get an in-depth understanding of the Linux operating system.
    This chapter gives an overview of the kernel sources; how they are arranged and
    where you might start to look for particular code.


    # Where to Get The Linux Kernel Sources


    All of the major distributions (Craftworks, Debian, Slackware, Red Hat etcetera)
    include the kernel sources in them. Usually the Linux kernel that installed on
    your system was built from those sources. By their very nature these sources tend
    to be a little out of date so you might want to get the latest sources from one
    of the web sites mentioned in chapter B. They are kept at ftp://ftp.helsinki.fi
    and all of the other web sites show them. This makes the Helsinki web site the
    most up to date, but sites like MIT and Sun are never far behind.


    If you do not have access to the web, there are many CD ROM vendors who offer
    snapshots of the major web sites at a very reasonable cost. Some even offer a
    subscription service with quarterly or even monthly updates. Your local Linux
    User Group is a good source of sources.


    The Linux kernel sources have a very simple numbering system. Any even numbered
    kernel (for 2.0.30) is a stable, released, kernel and any odd numbered kernel
    (for 2.1.42 is a development kernel. This book is based on the stable 2.0.30 source
    tree. Development kernels have all of the latest features and support all of the
    latest devices. Although they can be unstable, which may not be exactly what you
    want it, it is important that the Linux community tries the latest'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'kernels. That way they are tested for the whole community. Remember that it
    is worth backing up your system thoroughly if you try out non-production kernels.


    Changes to the kernel sources are distributed as patch files. The patch utility
    is used to apply a series of edits to a source file. So, for example, if you have
    the 2.0.29 kernel source and wanted to make the 2.0.30 source tree, you would
    obtain the 2.0.30 patch file and apply the patches (edits) to source tree:


    ```

    $ /usr/src/linux

    $ patch -p1 < patch-2.0.30

    ```


    This saves copying whole source trees, perhaps over slow serial connections. A
    good source of kernel patches (official and unofficial) is the http://www.linuxhq.com
    web site.


    # The Kernel Sources Are Arranged


    At the very top of the source tree /usr/src/linux you will see a number of directories:


    arch The arch directory contains all of the architecture specific kernel code.
    It has further subdirectories, one per supported architecture, for example i386
    and alpha.


    include The include subdirectory contains many of the files needed to build the
    kernel code. It has further subdirectories including one for every architecture
    supported. The include/asm subdirectory is a soft link to the real directory needed
    for this architecture, for example include/asm-1386. To change architectures you
    need to edit the kernel makefile and rerun the Linux kernel configuration.


    init This directory contains the initialization code for the kernel and it is
    a very good place to start looking how the kernel works.


    mm This directory contains all of the memory management code. The architecture
    specific memory management code lives down in arch/*/mm/, for example arch/386/mm/fault.c.


    drivers All of the system''s device drivers live in this directory. They are further
    subdivided into classes of device driver, for example block.


    ipc This directory contains the kernels inter-process communications code.


    modules This is a simple directory to hold build modules.


    fs All of the file system. This is further sub-divided into directories, one for
    supported file system, example vfat and ext2.


    kernel The main kernel code. Again, the architecture specific kernel code is in
    arch/*/kernel.


    net The kernel''s networking code.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'lib This contains the kernel''s library code. The architecture specific library
    can be found in arch/*/lib/.


    scripts This directory contains the scripts (for example awk and tk scripts) that
    are used when the kernel is configured.


    # Where to Start Looking


    A complex program like the Linux kernel can be rather daunting to look at. It
    is like a large ball of string with no end showing. Looking at one part of the
    kernel often leads to looking at several related files and before you have forgotten
    what you were looking for. The next subsections give you a hint as to where in
    the source tree the best place to look is for a given subject.


    # System Startup and Initialization


    On an Initial system, the kernel starts when either loader.exe or LILO loaded
    the kernel into memory and passed control to it. Look in arch/i386-/kernel/head.S
    for this part. Head.S does some architecture setup and jumps to the main() routine
    in init/main.c.


    # Memory Management


    This code is mostly in mm but the architecture specific code is in arch/*.mm.
    The page fault handling code is in mm/memory.c and the memory mapping and page
    cache code is in mm/filemap.c. The buffer cache is implemented in mm/buffer.c
    and the swap cache is in mm/swap_state.c and mm/swapfile.c.


    # Kernel


    Most of the generic code is in kernel with the architecture specific code in arch/*/kernel.
    The scheduler is in kernel/sched.c and the fork code is in kernel/fork.c. The
    bottom half handling code is in include/linux/interrupt.h. The task_struct data
    structure can be found in include/linux/sched.h.


    # PCI


    The PCI pseudo is found in drivers/pci/pci.c with the system wide definitions
    in include/linux/pci.h. Each architecture has specific PCI BIOS code, Alpha AXP*
    is in arch/alpha/kernel/bios32.c.


    # Interprocess Communication


    This is all in ipc. System V IPC objects include an ipc_perm data structure and
    can be found in include/linux/ipc.h. System V messages are implemented in ipc/msg.c,
    shared memory in ipc/shm.c and semaphores in ipc/sem.c. Pipes are implemented
    in ipc/pipe.c.'
