    # 2.1.3 Linkers


    Linkers are programs that link together several modules and libraries to form

    s single, coherent, program. Object modules are the machine code output from an

    assembler or compiler and contain executable machine code and data with

    information that allows the linker to combine the modules together to form a pro-

    gram. For example one module might contain all of a program''s database functions

    another module might its command line handling functions. Linkers fix up

    references between these object modules, where a routine or data structure refer-\enced
    in one module actually exists in another module. The Linux kernel is a single,

    large program linked together from its many constituent modules.


    # 2.2 What is an Operating System?


    Without software a computer is just a pile of electronics that gets hot. If the

    hardware is the heart of a computer then the software is its soul. An operating
    system

    is a collection of system programs which allows the user to run application software.

    The operating system abstracts the real hardware of the system and presents the

    system''s users and its applications with a virtual machine. In a very real sense

    the software provides the character of the system. Most PCs can run one or more

    operating systems and each can have a very different look and feel. Linux is

    made up of a number of functionally separate pieces that, comprise the

    operating system. One obvious part of Linux is the kernel itself, but even that
    would

    be useless without libraries or shells.


    In order start understanding what an operating system is, consider what happens

    when you type an apparently simple command:


    ```

    $ ls

    Mail          images      perl

    docs          tcl

    $

    ```


    The $ is a prompt up by a login shell (in this case bash). This means that it

    is waiting for you, the user, to type some command. Typing ls causes the keyboard

    driver to recognize that characters have been typed. The keyboard driver passes

    them to the shell which processes that command by looking for an executable image

    of the same name. It finds /bin/ls. Kernel services are called to pull

    t executable image into virtual memory and start executing it. The ls image

    calls to the file subsystem of the kernel to find out what files are available.

    The filesystem might make of cached filesystem information or use the disk

    device to read this information from the disk. It even cause a network

    driver to exchange information with a remote machine to find out details of remote

    files that this system has access to (filesystems can be remotely mounted via
    the'
