  md: 'example, 16.42.0.9. This IP address is actually in two parts, the network address
    and the host address. The sizes of these parts may vary (several classes of IP
    addresses) using 16.42.0.9 as an example, the network address would be 16.42 and
    the host address 0.9. The host address is further subdivided into a subnet and
    a host address. Again, using 16.42.0.9 as an example, the network address would
    be 16.42 and the host address 16.42.0.9. This subdivision of the IP address allows
    organizations to subdivide their networks. For example, 16.42 could be the network
    address of the ACME Computer Company: 16.42.0 could be subnet 0 and 16.42.1 would
    be subnet 1. These subnets might be in separate buildings, connected by leased
    telephone lines or even microwave links. IP addresses are assigned by the network
    administrator and having IP subnet administrators are a good way of distributing
    the administration of the network. IP subnet administrators are free to allocate
    IP addresses within their subnets.


    Roughly though, IP addresses are somewhat hard to remember. Names are much easier.
    ascii.com is much easier to remember than 16.42.0.9 but there must be some mechanism
    to convert the network names into an IP address. These names can be statically
    specified in the /etc/hosts file or Linux can have a Distributed Name Server (DNS)
    server to resolve the name. In this case the local host must know the IP address
    of one or more DNS servers and these are specified in /etc/resolv.conf.


    Whenever you connect to another machine, when reading a web page, its IP address
    is used to exchange data with that machine. This data is contained in IP packets
    each with an IP header containing the IP addresses of the source and destination
    machine''s addresses, a checksum and other useful information. The checksum is
    derived from the data in the IP packet and allows the receiver of IP packets to
    tell if the packet was corrupted during transmission, perhaps by a noisy line.
    The data transmitted by an application may have been broken down into smaller
    packets which are easier to handle. The size of IP packets varies depending on
    the connection media; ethernet packets are generally larger than PPP packets.
    destination host must reassemble the data packets before giving the data to the
    receiving portion. You can see this fragmentation and reassembly of graphically
    if you access a web page containing a lot of graphical images via a moderately
    slow link.


    Hosts connected to the same IP subnet can send IP packets directly to each other,
    other IP packets will be sent to a special host, a gateway. Gateways (or routers)
    are connected to more than one subnet and they will rescind IP packets received
    on one subnet, but destined for another outwards. For example, if 16.42.1.0 and
    16.42.0.0 are connected by a gateway then any packets sent from subnet 0 to subnet
    1 would have to be directed to the gateway so that it could route them. The local
    hosts use routing tables allowing them to route IP packets to the correct machine.
    For every destination there is an entry in the routing tables which tells host
    which to send IP packets in order that they reach their destination. These routing
    tables are dynamic and change over time as applications use the network and the
    topology changes.


    The IP protocol is a transport layer that is used by other protocols to carry
    their data. The Transmission Control Protocol (TCP) is a reliable end to end protocol
    that uses IP to transmit and receive its own packets. Just as IP packets have
    their own header, TCP has its own header. TCP is a connection based protocol between
    two networking'
