    # ## 11.1 Bottom Half Handling


    There are often times in a kernel when you do not want to work at this moment.
    A good example of this is during interrupt processing. When the interrupt was
    asserted, the processor stopped what it was doing and the operating system delivered
    the interrupt to the appropriate device driver. Device drivers should not spend
    too much time handling interrupts as, during this time, nothing else in the system
    can run. There is some work that could just well be done later. Linux''s bottom
    half handlers were invented so that device drivers and other parts of the kernel
    could queue work to be done later. Figure 11.1 shows the kernel structures associated
    with bottom half handling. There can be up to 32 different


