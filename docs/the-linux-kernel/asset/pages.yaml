  md: '# Chapter 8


    # Device Drivers


    ![](img/ab43a1c61b6471f32341bb107ec7bec5_97_0.png)


    One of the purposes of an operating system is to hide the peculiarities of the
    system''s hardware devices from its users. For example the Virtual File System
    presents a uniform view of the mounted files irrespective of the underlying physical
    devices. This chapter describes how the Linux kernel manages the physical devices
    in the system.


    The CPU is not the only intelligent device in the system, every physical device
    has its own hardware controller. The keyboard, mouse and serial ports are controlled
    by a SuperIO chip, the IDE disks by an IDE controller, SCSI disks by a SCSI controller
    and so on. Each hardware controller has its own control and status registers (CSRs)
    and these differ between devices. The CSRs for an Adaptec 2940 SCSI controller
    are completely different from those of a NCR 810 SCSI controller. The CSRs are
    used to start and stop the device, to initialize it and to diagnose any problems
    with it. Instead of putting code to manage the hardware controllers in the system
    into every application, the code is kept in the Linux kernel. The software that
    manages a hardware controller is known as a device driver. The Linux kernel device
    drivers are essentially, a shared library of privileged, memory resident, low
    level hardware handling routines. It is Linux''s device drivers that handle the
    peculiarities of the devices they are managing.


    One of the features of Unix* is that it abstracts the handling of devices. All
    hardware devices look like regular files; they are kept open, closed, read and
    write using the same, system calls that are used to manipulate files. Every device
    in the system is represented by a *special file*, for example the first IDE disk
    in the system is represented by /dev/sda. For block (disk) and character devices,
    these special files are created by the `mod` command and they describe the device
    using major and minor device numbers. Network devices are also represented by
    device special files but they are created by Linux as it finds and initializes
    the network controllers in the system. All devices controlled by the same device
    driver have a common device number. The minor device numbers are used to distinguish
    between different devices and their controllers, for example each partition on
    the'
