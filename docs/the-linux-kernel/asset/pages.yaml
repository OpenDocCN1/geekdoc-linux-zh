    \ Inc.\nDEC is a trademark of Digital Equipment Corporation.\nDIGITAL is a trademark\
    \ of Digital Equipment Corporation.\nLinux is a trademark of Linus Torvalds.\n\
    Motif is a trademark of The Open System Foundation, Inc.\nMSDOS is a trademark\
    \ of Microsoft Corporation.\nRed Hat, glint and the Red Hat logo are trademarks\
    \ of Red Hot Software.\nUNIX is a registered trademark of X/Open.\nXFree6 is a\
    \ trademark of XFree6 Project, Inc.\nX Window is a trademark of the X Consortium\
    \ and the Massachusetts Institute of Technology.\n\n# The Author\n\nI was born\
    \ in 1957, a few weeks before Sputnik was launched, in the north of England.\n\
    \ first met Unix at University, where a lecturer used it as an example when teaching\
    \ the notions of kernels, scheduling and other operating systems. I loved using\
    \ the newly delivered PDP-11 for my final year. After graduating (in 1982 with\
    \ a First Class Honours degree in Computer Science) I worked for Prime Computers\
    \ (Primos) and then after a couple of years for Digital (VMS, Ultrix). At Digital\
    \ I worked on many things but for the last 5 years, I worked for the semiconductor\
    \ group on Alpha and StrongARM evaluation boards. In 1998 I moved to ARM where\
    \ I have a small group of engineers writing low level firmware and portant operating\
    \ systems. My colleagues (Ester and Stephen) describe me as a geek.\n\nPeople\
    \ often ask me about Linux at work and at home and I am only too happy to oblige.\
    \ The more I use Linux in both my professional and personal life the more I become\
    \ a Linux zealot. You may note that the term ‘zealot’ I define as an enthusiast\
    \ who recognizes that there are other operating systems but prefers not to use\
    \ them. As my wife, Gill, who uses Windows 95 once remarked I never realized that\
    \ we would have his and her operating systems. For me, as an engineer, Linux suits\
    \ my needs perfectly. It is a super, flexible and adaptable engineering tool I\
    \ use at work and at home. Most freely available software builds on Linux and\
    \ I can often simply download pre-built executable files or install them from\
    \ a CD ROM. What else could I use to learn in C++, Perl or learn about Java for\
    \ free?\n\n# Acknowledgements\n\nI must thank the many people who have been kind\
    \ enough to take the time to email me with comments about this book. I have attempted\
    \ to incorporate those"
