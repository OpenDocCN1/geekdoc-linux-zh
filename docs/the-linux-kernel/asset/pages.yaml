    # 3.1.1 Demand Paging


    As there is much less memory than virtual memory the operating system must be
    careful that it does not use the physical memory inefficiently. One way to save
    physical memory is to only load virtual pages that are currently being used by
    the executing program. For example, a database program may be run to query a database.
    In this case not all of the database needs to be loaded into memory, just those
    data records that are being examined. If the database query is a search query
    then it does not mean to load the code from the database program that deals with
    adding new records. This technique of only loading virtual pages into memory as
    they are accessed is known as demand paging.


    When a process attempts to access a virtual address that is not in memory the
    processor cannot find a page entry for the virtual page referenced. For example,
    in Figure 3.1 there is no entry in X''s page table for virtual page number 2 and
    so process X attempts to translate the address within virtual page frame number
    2 the processor cannot translate the address into a physical one. At this point
    the processor notifies the operating system that a page fault has occurred.


    If the faulting virtual address is invalid it means that the process has attempted
    to access a virtual address that it should not have. The application have gone
    wrong in some way, for example writing to random addresses in memory. In this
    case the operating system will terminate it, protecting the other processes in
    the system from this rogue process.


    If the faulting virtual address is valid but the page that it refers to is not
    in memory, the operating system must bring the appropriate page into memory from
    the disk. Disk access takes a long time, relatively speaking, and so the process
    must wait a while the page has been fetched. If there are other processes that
    could run then the operating system will select one of them to run. The fetched
    page is written into a free physical page frame and an entry for the virtual page
    frame number is added to the processes page table. The process is restarted at
    the instruction where the memory fault occurred. This time the virtual memory
    access is made, the physical translation succeeds and the process continues to
    run.


    Linux uses paging to load executable images into a processes virtual memory. Whenever
    a command is executed, the file containing it is opened and its contents are mapped
    into the processes virtual memory. This is done by modifying the data structures
    describing this processes memory map and is known as memory mapping. However,
    only the first part of the image is actually brought into physical memory. The
    rest of the image is left on disk. As the image executes, it generates page faults
    and Linux uses the processes memory map in order to determine which parts of the
    image to bring into memory for execution.'
