    This chapter describes how the Linux kernel maintains the files in the systems
    that it supports. It describes the Virtual File System (VFS) and explains how
    the Linux kernel''s real file systems are supported.


    One of the most important features of Linux is its support for many different
    file systems. This makes it very flexible and well able to coexist with many other
    operating systems. At the time of writing, Linux supports 15 file systems; ext,
    ext2, xia, minix, umsdos, mdos, vfat, proc, smb, iso9660, sysv, hpfs, affs and
    ufs, and no doubt, further time will be added.


    In Linux, as it is for Unix™, the separate file systems may use are not accessed
    by device identifiers (such as a drive number or a drive name) but instead they
    are combined into a single hierarchical tree structure that represents the file
    system as it is mounted. Linux adds each new file system into this single file
    system tree as it is mounted. All file systems, of whatever type, are mounted
    onto a directory and the files of the mounted file cover the existing contents
    of that directory. This is known as the mount directory or mount point. When the
    file system is unmounted, the mount directory''s files are once again revealed.


