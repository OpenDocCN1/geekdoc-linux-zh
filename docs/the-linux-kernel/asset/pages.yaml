  pgno: 171
- img_proc: true
  md: '# Interrupt Handling


    The kernel''s interrupt handling code is almost microprocessor (and often platform)
    specific. The Intel interrupt handling code is in arch/i386/kernel/irq.c and its
    definitions in include/asm-i386/irq.h.


    # Device Drivers


    Most of the Linux kernel''s source code is in its device drivers. All of Linux''s
    device drivers sources are in drivers but these are further broken out by:


    /block device drivers such as ide (in ide.c). If you want to look at how all of
    the devices that could possibly contain file systems you should look at device_setup()
    in drivers/block/genhd.c. It not only initializes the hard disks but also the
    network you need a network to mount nfs file systems. Drivers include both IDE
    and SCSI devices.


    /char This the place to look for character based devices such as tty, serial ports
    and mice.


    /cdrom All of the CDROM code for Linux. It is here that the special CDROM devices
    (such as Soundblast CDROM) can be found. Note that the CD driver is ide-cd.c in
    drivers/block and the SCSI CD driver is in scsi.c in drivers/scsi.


    /pci This the sources for the PCI pseudo-driver. A good place to look at how the
    PCI system is mapped and initialized. The Alpha AXP fixup code is also looking
    at in arch/alpha/kernel/bios32.c.


    /scsi This is where to find all of the SCSI code as well as all of the drivers
    for the scsi devices supported by Linux.


    /net This is where to find the network device drivers such as the DECChip 2140
    ethernet driver which is in tulip.c.


    /sound This is where all of the sound card drivers are.


    # File Systems


    The EXT2 file system are all in the fs/ext2/ directory with data structure definitions
    in include/linux/ext2_fs.h, ext2_fs.i and ext2_fs_sb.h. The Virtual File System
    data structures are described in include/linux/fs.h and the code is in fs/. The
    buffer cache is implemented in fs/buffer.c along with the updated kernel daemon.


    # Network


    The networking code is kept in net/ with most of the files in include/net. The
    BSD socket code is in net/socket.c and the IP version 4 INET socket code is in
    net/ipv4/inet.c. The generic protocol support code (including the sk_buff handling
    routines) is in net/core with the TCP/IP networking code in net/ipv4. The network
    device drivers are in drivers/net.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Modules


    The kernel module code is partially in the kernel and partially in the modules
    package. The kernel code is all in kernel/modules.c with the data structures and
    kernel-demon kernelld messages in include/linux/module.h and include/linux-kernel.h
    respectively. You may want to look at the structure of an ELF object file include/linux/elf.h.'
