  md: '# C.6 Copyright and License


    Here is a "boilerplate" license you may apply to your work. It has not been reviewed
    by a lawyer; free to have your own lawyer review it (or your modification of it)
    for its applicability to your needs. In that order for your document to be part
    of the LDP, you must allow unlimited reproduction and distribution without fee.


    This manual may be reproduced and distributed in whole or in part, without fee,
    subject to the following conditions:


    +   * The copyright notice above and this permission notice must be preserved
    on all complete or partial copies.

    * Any translation or derived work must be approved by the author in writing before
    distribution.

    * If you distribute this work in part, instructions for obtaining the complete
    version of this manual must be included, and a means for obtaining a complete
    version.

    * Small portions may be reproduced as illustrations for reviews or quotes in other
    works without this permission notice if proper citation is given.


    Exceptions to these rules may be granted for academic purposes: Write to the author
    and ask. These restrictions are here to protect us as authors, not to restrict
    you as learners and educators.


    All source code in this document is placed under the GNU General Public License,
    available via any FTP from prep.ai.mit:pub/COPYING.


    # C.7 Publishing LDP Manuals


    If you are a company interested in distributing any of the LDP manuals, read on.


    By the license requirements given previously, anyone is allowed to publish and
    distribute verbatim copies of the Linux Documentation Project manuals. You do
    not need our explicit permission for this. However, if you would like to distribute
    a translation or derivative work based on any of the LDP manuals, you may need
    to obtain permission from the author, in writing, before doing so, if the license
    requires that.


    You may, of course, sell the LDP manuals for profit. We encourage you to do so.
    Keep in mind, that the LDP manuals are freely distributable, anyone may photocopy
    or distribute printed copies free of charge, if they wish to do so.


    We do not require to be paid royalties for any profit earned from selling LDP
    manuals. However, we would like to suggest that if you sell LDP manuals for profit,
    that you either offer the author royalties, or donate a portion of your earnings
    to the author, the LDP as a whole, or to the Linux development community. You
    may also wish to send one or more free copies of the LDP manuals that you are
    distributing to the authors. Your show of support for the LDP and the Linux community
    will be very much appreciated.'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'We would like to be informed of any plans to publish or distribute LDP manuals,
    just so we know how they''re becoming available. If you are publishing or planning
    to publish any LDP manuals, please send mail to ldp-1@linux.org.au. It''s nice
    to know who''s doing what.


    We encourage Linux software distributors to distribute the LDP manuals (such as
    the Installation and Getting Started Guide) with their software. The LDP manuals
    are intended to be used as the "official" Linux documentation, and we are all
    glad to see mail-order distributors bundling the LDP manuals with the software.
    As the LDP manuals mature, hopefully they will fulfill this goal more and more
    adequately.'
