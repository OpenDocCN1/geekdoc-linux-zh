    the N element of bb_base contains the address of a bottom half routine. If N of
    bb_active is set then the Nth bottom half handler routine should be called as
    the scheduler deems reasonable. These indices are statically defined; the kernel
    bottom half handler is the highest priority (index 0), the console bottom half
    handler is next in priority (index 1) and so on. Typically the bottom half handler
    runs lists of tasks associated with them. For example, the immediate bottom half
    handler works its way through the immediate tasks queue (tq_immediate) which contains
