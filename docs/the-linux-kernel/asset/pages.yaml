    hides the underlying differences from the generic system calls which read and
    write ordinary files. As the writing process writes to the pipe, bytes are copied
    into the shared data page and when the reading process reads from the pipe, bytes
    are copied from the shared data page. Linux must synchronize access to the pipe.
    It must make sure that the reader and the writer of the pipe are in step and to
    do this it uses locks, wait queues and signals.


