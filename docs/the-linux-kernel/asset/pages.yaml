    commands or the kernel itself can demand that the linux daemon (kerneld) loads
    and unloads the modules as they are needed. Dynamic loading is attractive as it
    keeps the kernel size to a minimum and makes the kernel very flexible. My current
    kernel uses modules extensively and is only 406Kbytes I occasionally use VFAT
