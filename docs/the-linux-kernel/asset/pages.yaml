  md: "contains Unix™, it is a rewrite based on published POSIX standards. Linux\n\
    is built with and uses the GNU (GNU's Not Unix™) software produced by\nthe Free\
    \ Software Foundation in Cambridge, Massachusetts.\n\nMost people use Linux as\
    \ a simple tool, often just installing one of the many good\nCD-ROM distributions.\
    \ A lot of Linux users use it to write applications or\nto run applications by\
    \ others. Many Linux users read the HOWTOs\nfeel the thrill of success when some\
    \ part of the system has been correctly\nconfigured and the frustration of failure\
    \ when it has not. A minority are enough\nto write drivers and offer kernel patches\
    \ to Linux Torvalds, the creator and\nmaintainer of the Linux kernel. Linux accepts\
    \ additions and modifications to the\nkernel sources from anyone, anywhere. This\
    \ might sound like a recipe for anarchy\nbut Linux executes strict quality control\
    \ and merges all new code into the kernel\nhimself. At any one time, there are\
    \ only a handful of people contributing\nsources to the Linux kernel.\n\nThe majority\
    \ of Linux users do not know how the operating system works, how\nit fits together.\
    \ There is a shame because Linux is a very good way to\nlearn more about how an\
    \ operating system functions. Not only is it well written,\nal all the sources\
    \ are freely available for you to look at. This is because although\nauthors retain\
