  md: '# 8.6 Network Devices


    A network device is, so far as Linux''s subsystem is concerned, an entity that
    sends and receives packets of data. This is normally a physical device such as
    an ethernet card. Some network devices are software only as the loopback device
    which is used for sending data to yourself. Each network device is represented
    by a device data structure. Network drivers register the devices that they control
    with Linux during initialization at kernel boot time. The device data structure
    contains information about the device and the addresses of functions that allow
    the supported network protocols to use the device''s services. The device uses
    standard networking mechanism to pass received data up to the appropriate protocol
    layer. All network data (packets) transmitted and received are represented by
    sk_buff data structures, which are flexible data structures that allow protocol
    headers to be easily added and removed. How the protocol layers use the network
    devices, how they pass data back and forth and using sk_buff are described in
    details in the Networks chapter (Chapter 10). This chapter concentrates on the
    device data structure and on how network devices are discovered and initialized.


    The device data structure contains information about the network device:


    Unique block and character devices which have their device special files created
    using the mknod command, network device special files appearing as the system''s
    network devices are discovered and initialized. Their names are standard, each
    name representing the type of device that it is. Multiple devices of the same
    type are numbered from 0. Thus the ethernet devices are known as /dev/eth0/dev/eth1/dev/eth2
    and so on. Some common network devices are:


    +   /dev/ethN Ethernet devices

    /dev/sN SLIP devices

    /dev/ppp PPP devices

    /dev/lo Loopback devices


    Bus Information This is information that the device driver needs in order to control
    this device. The irq number is the interrupt that this device is using. The base
    address is the address of any of the device''s control and status registers in
    I/O memory. The DMA channel is the DMA number that this network device is using.
    All of this information is set at boot time as the device is initialized.


