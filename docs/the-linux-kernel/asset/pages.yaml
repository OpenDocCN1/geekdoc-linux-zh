  md: '# Chapter 2


    # Software Basics


    ![](img/ab43a1c61b6471f32341bb107ec7bec5_23_0.png)


    A program is a set of computer instructions that perform a particular task. That
    program can be written in assembler, a very low level computer language, or in
    a high level, machine independent language such as the C programming language.
    An operating system is a special program which allows the user to run applications
    such as spreadsheets and word processors. This chapter introduces basic programming
    principles and gives an overview of the aimes and functions of an operating system.


    # 2.1 Computer Languages


    # 2.1.1 Assembly Languages


    The instructions that a CPU fetches from memory and executes are not at all understandable
    to human beings. They are machine codes which tell the computer precisely what
    to do. The hexadecimal number 0a89E5 is an Intel 8048 instruction which copies
    the contents of the ESP register to the EBP register. One of the first software
    tools invented for the earliest computers was an assembler, a program which takes
    a readable source file and assembles it into machine code. Assembly languages
    explicitly handle registers and operations on data and they are specific to a
    particular microprocessor. The assembly language for an Intel X86 microprocessor
    is very different from the assembly language for an Alpha AXP microprocessor.
    The perform:


    ```

    ldr r16, (r15)    ; Line 1

    ldr r17, 4(r15)   ; Line 2

    beq r16,r17,100   ; Line 3

    str r17, (r15)    ; Line 4

    ```


