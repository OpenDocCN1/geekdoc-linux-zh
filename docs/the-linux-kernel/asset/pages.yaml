  md: '# 7.1 Programmable Interrupt Controllers


    Systems designers are free to use whatever interrupt architecture they wish but
    IBM PCs use the Intel 82C59A-2 CMOS Programmable Interrupt Controller, [Interrupt
    Components] or its derivatives. This controller has been around since the dawn
    of the PC and it is programmable with its registers being known locations in the
    ISA address space. Even very modern support logic chip sets keep equivalent registers
    in the same place as ISA. Non-Intel based systems such as Alpha XP based are free
    from these architectural constraints and so often use different interrupt controllers.


    Figure 7.1 shows that there are two bit controllers together; each having a mask
    and an interrupt status register, PIC1 and PIC2. The mask registers are at addresses
    021 and 0A1 and the status registers are at 020 and 0A0 Writing one to a partial
    bit of the mask register enables an interrupt, writing a zero disables it. So,
    writing one to 3 would enable interrupt 3, writing zero would disable it. Unfortunately
    (and irritingly), the interrupt registers are write only, you cannot read back
    the value that you wrote. This means Linux keeps a local copy of what it has set
    the mask registers to. It modifies these saved masks in the interrupt enable routines
    and returns the full masks to the registers every time.


    When an interrupt is signalled, the interrupt handling code reads the two interrupt
    status registers (ISRs). It treats the ISR at 0x20 as the bottom bits of a bit
    register and the ISR at 0xA0 as the top bits. So, an interrupt on bit 1 of ISR
    at 0xA0 would be treated as system interrupt 9. Bit 2 of PIC1 is not available
    as this is used to chain interrupts from PIC2, any interrupt on PIC2 results in
    bit 2 of PIC1 being set.


    # 7.2 Initializing the Interrupt Handling Data Structures


    The kernel''s interrupt handling structures are set up by the device drivers who
    request the system''s interrupts. To do this the device driver uses a set of Linux
    kernel services that are to request an interrupt, enable it and disable it. The
    individual device drivers call these routines to register their interrupt handling
    routines.


    Some interrupts are fixed by the PC architecture and so the driver simply requests
    it when it is initialized. This is what the floppy disk driver does; it requests
    IRQ 6. There may be occasions when a device driver does not know which interrupt
    the device will use. This is not a problem for PCI devices who always know what
    their interrupt number is. Unfortunately there is no easy way for ISA drivers
    to find their interrupt number. Linux solves this by allowing device drivers to
    probe for interrupts.


    First, the driver does something to the device that causes it to interrupt. Then
    all of the unassigned interrupts in the system are enabled. This means the device''s
    pending interrupt will now be delivered by the programmable interrupt controller
    Linux reads the interrupt status register and returns its contents to the device
    driver. A non-zero result means that one or more interrupts occurred during'
