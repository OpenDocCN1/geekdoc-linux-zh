    # 9.5 Device Files


    Linux, for all versions of Unix™ presents its hardware devices as special files.
    So, for example, /dev/null is the null device. A device file does not use any
    data space in the file system, it is only an access point to the device driver.
    The EXT2 file system and the Linux VFS both implement device files as special
    types of nodes. There are two types of device file; character and block special
    files. Within the kernel, the device driver implements semantics: you can open,
    close and move on. Character devices allow I/O operations without a buffer cache.
    When an I/O request is made to a device file not a real device driver but a pseudo-device
    driver for some subsystem such as the SCSI device layer. Device files are referenced
    by a major number, which identifies the type, and a minor type, which identifies
    the unit or instance of that type. For example, the IDE disks on the first IDE
    controller in the system has a major number of 3 and the first partition of an
    IDE disk has a minor number of 1. So, -1 of /dev/hda1:


    ```

    $ br-rv--- I root disk 3, 1 Nov 24 15:09 /dev/hda1

    ```


    Within the kernel, every device is uniquely described by a kdev data type, which
    is two bytes, the first byte containing the minor number and the second holding
    the major device number. The IDE device above is held within the kernel as 0x0301.
    An EXT2 index represents a block or character device keeps the device''s major
    and minor numbers in its first direct block pointer. When it is read by the VFS,
    the VFS inode data structure representing it has i_rdev field to set the correct
    device identifier.'
