  md: '# 3.1.2 Swapping


    If a process needs to bring a virtual page into physical memory and there are
    no free physical pages available, the operating system must make room for this
    page by discarding another page from physical memory.


    If the page to be discarded from physical memory came from an image or data file
    and not written then the page does not need to be saved. Instead it can be discarded
    and if the process needs that page again it can be brought back memory from the
    image or data file.


    However, if the page has been modified, the operating system must preserve the
    contents of that page so that it can be accessed at a later time. This type of
    page is known as a dirty page and when it is removed from memory it is saved in
    a special sort of file called the swap. Access to swap files are very long relative
    to the speed of the processor and physical memory and the operating system must
    juggle the need to write pages to disk to retain them in memory to be used again.


    If the algorithm used to decide which pages to discard or swap (the swap algorithm
    is not efficient then a condition known as thrashing occurs. In this case, pages
    are constantly being written to disk and then being read back and the system is
    too busy to make much work to be performed. If, for example, page frame number
    1 in Figure 3.1 is regularly accessed then it is not a good candidate for swapping
    to hard disk. The set of pages that a process is currently using is called the
    working set. An efficient swap scheme would make sure that all processes have
    their working set in physical memory.


    Linux uses a Least Recently Used (LRU) aging technique to choose pages which might
    be removed from memory. This scheme employs every page in the system having an
    age which changes as the page is accessed. The more that a page is accessed, the
    younger it is; the less it is accessed the older and more stale it becomes. Old
    pages are good candidates for swapping.


    # 3.1.3 Shared Virtual Memory


    Virtual memory makes it easy for several processes to share memory. All memory
    access are made via page tables and each process has its own separate page table.
    For two processes sharing a physical page of memory, its page frame number must
    appear in a page entry in both of their page tables.


    Figure 3.1 shows two processes that share each page frame number 4. For process
    X this is virtual page number 4 whereas for process Y this virtual page frame
    number 6. This illustrates an interesting point about sharing pages: the shared
    physical page does not have to exist at the same place in virtual memory for any
    of the processes sharing it.


    # 3.1.4 Physical and Virtual Addressing Modes


    It does not make sense for the operating system itself to run in virtual memory.
    This would be a nightmare situation where the operating system must maintain page
    tables for itself. Most multi-purpose processors support the notion of a physical
    address mode as well as a virtual address mode. Physical addressing mode requires
    no'
