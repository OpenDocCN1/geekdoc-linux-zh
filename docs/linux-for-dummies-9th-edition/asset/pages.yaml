    developed. |

    | SimplyMEIS | www.mepis.org | Designed for becoming home Linux users. |

    | PCLinuxOS | www.pclinux.com | Full-blown Linux desktop workstation on a single
    CD. |

    | Ubuntu | www.ubuntu.com | A worldwide Linux project, designed for many languages.
    |

    | Slax | www.slax.org | A live Linux CD based on a subset of the Slackware distribution.
    |

    | Puppy Linux | www.puppylinux.org | A full-featured Linux distribution designed
    for older computers. |'
