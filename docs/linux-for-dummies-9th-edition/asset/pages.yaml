  md: '# Chapter 14: Messing with Video and Graphics


    The plugins you use depend on your specific Linux distribution and version.

    By default, the Fedora 10 Firefox installation includes the following plugins:


    +   - **IcedTea Java Web Browser**: Provides support for running Java applets
    from Web pages, often used for animation

    - **MozPlogger**: Plays QuickTime and Windows media files

    - **QuickTime**: Plays Apple QuickTime videos in the MOV and QT formats

    - **Totem Web Browser**: A full-featured video and audio player that can play
    AVI, ASF, WMV, OGG, and MPG video formats, as well as WAV and MP3 audio formats

    - **VLC Multimedia**: Plays standard video formats, including the VLC format used
    by GoogleVideo

    - **Windows Media Player**: Playing the Totem player that streams in Microsoft
    formats, such as ASF, WMV, and AVI

    - **DivX Web Player**: For playing DivX-encoded AVI videos


    Although it may be, on the surface, that you have most of your Web video covered,
    you may be disappointed with your actual video results. Although Totem supports
    the popular WMV and MOV video formats, there''s more to quality video than just
    supporting the right files.


    The Microsoft and QuickTime use proprietary video formats schemes called codecs
    that are strictly controlled under licensing agreements. Microsoft Corporation
    controls the WMV video format and (you guessed) it doesn''t provide a license
    for using this code with most Linux systems. As a result, Fedora doesn''t support
    WMV video formats by default. The same applies to QuickTime and QuickTime video
    files.


    > That, some resourceful open-source programmers have reproduced the codecs for
    the Microsoft video format and created a software package called w32codec. Installing
    this package allows you to view almost every type of video available on the Web.


    ![](img/f493a327f3c2a812b2e84b22c874990c_280_0.png)


    Because w32codec is not considered a legal software package in the United States,
    it is not included in the standard Fedora distribution. You can very likely find
    it by looking on the Internet, but don''t say we didn''t warn you.


    ![](img/f493a327f3c2a812b2e84b22c874990c_280_1.png)


    ![](img/f493a327f3c2a812b2e84b22c874990c_280_2.png)


    If you want to Microsoft video formats in the United States in Linux — legally
    — you can purchase the CrossOver Office software for Linux. It provides the appropriate
    codecs for viewing Macromedia Shockwave, Windows Media Player, and Apple QuickTime
    movie formats, as well as the libraries required to run many applications directly
    on your Fedora computer. You can find CrossOver Office at www.codeweavers.com.'
  merge: -1
  pgno: 280
