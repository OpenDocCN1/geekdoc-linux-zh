  md: '# 268 Part III: Getting Things Done


    # # Adding a plugin


    If you don''t see a plugin listed for a specific video format that you''re interested
    in, you can look to see whether one exists. The clearinghouse for Firefox plugins
    is located at http://plugindoc.mozdev.org (the Firefox Web browser is based on
    the Mozilla open-source browser). This site contains links to many different types
    of video-related plugins.


    The Macromedia Flash video player is a popular plugin that supports the video
    format used on the popular YouTube Web site (and many others). Ubuntu installs
    the Shockwave Flash player by default, but Fedora doesn''t. Here''s how to install
    it on your Fedora system:


    +   1. Open Firefox, and browse to plugindoc.mozdev.org.


    +   2. Click the Linux (x86) at the top of the page.


    +   If you have to be running on a 64-bit Linux distribution, select the Linux
    (x86 64) link instead.


    +   3. Click the Flash Player link.


    +   4. Click the Download Macromedia Flash Player for x86 Linux player.


    +   This link redirects you to the Web page for Adobe Flash installation.


    +   5. Select the version to download.


    +   For Fedora, you can choose YUM for Linux. It uses the Fedora Software Manager
    (see Chapter 16).


    +   6. Click the Agree and Install Now dialog box opens, click OK.


    +   7. When the Firefox Download Manager dialog opens, click OK.


    +   The default action is to open the file automatically, using the Fedora Software
    program.


    +   8. Click the Install button to install the package.


    +   9. Click the Force Install button in the Missing Security Signature dialog
    box.


    +   The Adobe installation package isn''t signed, but you downloaded directly
    from the Adobe Web site, so it''s safe.


    +   10. Type your root user account password to continue with the installation.


    +   11. Click the Close button to exit the Software Manager.


    +   12. After the installation finishes, open Firefox and view the Add-ons dialog
    box.'
