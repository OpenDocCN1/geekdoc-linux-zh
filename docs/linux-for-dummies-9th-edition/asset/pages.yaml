    Word processors are almost required equipment these days. Kids use them to write
    letters to their grandparents. Grandparents use them to write letters to their
    grandkids. Whether you''re working on the great American novel or a book report,
    OpenOffice.org Writer has all the best features you expect to find these days
    in a word processor.


