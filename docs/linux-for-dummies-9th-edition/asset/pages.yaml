    # Compressing and Packaging Files to Share


    Life isn''t all about "take, take, take" (or at least we should hope!). Sometimes
    you''ve just gotta give. Creating packages to share with other folks involves
    telling your File Manager that you want to do so.


    To package and compress files for sending off to other people, navigate to where
    you''ve stored the file(s) — see Chapter 7 for how to move about in Nautilus or
    Dolphin — and then create your package, as follows:


    +   1. Determine whether you want to compress or package a single file, a group
    of files, or a whole folder.

    If the files and folders you want to bundle together are flung all over the place
    in yourのである, you may want to create a new folder and copy it into the items you
    want to bundle — just for the convenience.

    2. Select the item(s) you want to package.

    If you want to select a whole folder, navigate to its parent folder and select
    the folder''s instead of opening the folder.

    3. Right-click the item(s) (or choose the Edit menu).

    The context menu appears if you right-clicked, or in Nautilus, the Edit menu opens.'
