    The Ubuntu distribution runs the Synaptic program in the background at all times
    to check for updates. It uses a technique similar to the Fedora PackageKit program
    — it displays a dialog box telling you that there are updates available.


    When you see the Synaptic dialog box appear, you know it''s time to start downloading
    updates or patches. If you are in the middle of something important, you can choose
