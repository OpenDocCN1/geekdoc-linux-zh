    name, designated with a dollar sign, with the actual value stored in that variable.


    Why did you use single quotes in the first example but double quotes with the
    second one? The items with backslashes (\) are interpreted one way or another.
    If you use double quotes, they''re interpreted only once, so the item that lists
    what directory you''re in changes only the first time. If you use single quotes,
    the variables are interpreted every time you do something.


