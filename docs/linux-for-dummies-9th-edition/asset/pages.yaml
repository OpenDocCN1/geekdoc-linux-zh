    # The desktop


    The desktop is possibly the most controversial feature in the latest version (Version
    4) of KDE. Its behavior has significant differences from what you''d get in older
    versions of KDE — from the desktop in GNOME as well. The desktop in KDE works
    more like an extension of the panel than a desktop. You can''t place files, folders,
    or application icons in the desktop in KDE. Instead, you just place additional
    widgets.


    That said, however, you can use a trick to make the KDE desktop behave similarly
    to the GNOME desktop. One of the widgets you can use is the Folder View widget,
    which provides a GNOME desktop-like area on your KDE desktop. The'
