    # Upgrading Your OS


    Typically, Fedora users upgrade by downloading the new version of the distribution,
    starting the installation, and then selecting Upgrade rather than a new installation
    from the installation menu. Ubuntu users have a cool way to upgrade an existing
    system easily: When a new version is available, if you click the button, Synaptic
    Update system window downloads all the upgrade files needed to completely upgrade
    to the new release (this most likely takes a long time, though, even on a high-speed
    Internet connection).


    ![](img/f493a327f3c2a812b2e84b22c874990c_325_0.png)


    Usually, upgrading an existing system keeps all of the data stored in your home
    folders (see Chapter 6). However, nothing is perfect. It''s always a good idea
    to back up your important data to a removable storage device such as a USB flash
    drive or a writable CD before trying to upgrade your system.'
