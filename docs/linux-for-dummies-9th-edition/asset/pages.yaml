    # Downloading with BitTorrent


    Say what you want about file sharing, it’s popular. Networks such as BitTorrent
    (www.bittorrent.com) have found legitimate use among software companies and other
    content contributors. They use it as a way to offer larger files for download
    without having to take the brunt of the bandwidth for themselves, so it’s worth
    looking at how to use this soft-under Linux.


    You probably already guessed that there are a few graphical BitTorrent client
    packages available in the Linux world:


    +   BitTorrent: The software package developed by the BitTorrent network and popular
    with both Windows and Linux users.


    +   Transmission: A BitTorrent package created by the GNOME desktop developers
    for the GNOME desktop, installed by default in Fedora and Ubuntu.


    +   KTorrent: A BitTorrent package created by the KDE developers for the KDE desktop,
    installed by default in Fedora when you select the KDE desktop.


    All BitTorrent client packages work pretty the same way. Here’s the rundown:


    +   A. A BitTorrent download consists of a control file that you must download.


    The control file is identified by a .torrent extension in the filename. It tells
    the BitTorrent client software where to contact the server that controls the download
    information.


    +   2. When the client connects to the server, the server directs the client to
    other clients that have parts of the download file.


    +   3. A give-and-take, with clients downloading parts of the file from other
    clients, while at the same time sharing the parts they’ve downloaded with other
    clients.'
  merge: -1
  pgno: 186
