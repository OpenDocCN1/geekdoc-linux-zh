    > Words fly, writing remains.

    — Spanish proverb, from Dictionary of Proverbs, by Delfin Carbonell Basset


    These days, just about everyone who has a computer has at least one suite at their
    fingertips. If they''re Microsoft Windows users, this is probably Microsoft Office,
    although it may be another worthy contender, such as Core Perfect. In Linux, typically
    the suite is OpenOffice.org. This comes with Base (database), Calc (a spreadsheet),
    Draw (diagrams and figures), Impress (for presentations), Math (a word processor
    for writing mathematical formulas), and Writer (for word processing).


    After you figure out how to use one of the programs in your suite, you may be
    happy to find that the others are designed to look and work in similar ways. You
    can even open and save files in Microsoft Office format, if you need to share
    them with people who are using that product — and you can edit the Office files
    people send you, too.


    That''s enough about OpenOffice.org. In this chapter, you can actually use it!'
