    Figure 8-2: The GNOME PPP Setup dialog box.


    # 3. Configure your modem settings in the Modem tab.


    You must select which port your modem uses to communicate. If Linux automatically
    detects your modem, it assigns it to the special port /dev/modem. Use that first;
    if it doesn''t work, Linux uses /dev/ttyS0 for COM1, /dev/tty1 for COM2, and so
    on. These ports are often labeled on the workstation using the Windows COM1 and
    COM2 names.


    # 4. Click the Networking tab and set your IP address information.


    +   • If your ISP dynamically assigns an IP address to your workstation, select
    the Dynamic IP address button.


    +   • If you must specify a static IP address, select the Static IP address button
    and enter your address information in the text boxes.


    +   • If your ISP uses a static address, you''ll also need to configure the nameserver
    server (called Domain Name Server [DNS]) in the configuration window) to use for
    the network.


    # 5. Click the Options tab and set additional features for the modem connection.


    You can select the modem connection icon either to minimize when the connection
    is established or to dock it off the panel. You can also check advanced connection
    features from this page, such as having the modem reconnect if the connection
    drops.


    # 6. Click the OK button to save the settings.'
