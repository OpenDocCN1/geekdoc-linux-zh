  md: '# 326 Part IV: Junior Administrator Boot Camp


    Take a look at a different kind of string that the shell interprets differently:
    an interpolated string. An interpolated value is one in which the shell interprets
    special characters before processing the value. Rather than using single quotes,
    this time you use the same example with double quotes:


