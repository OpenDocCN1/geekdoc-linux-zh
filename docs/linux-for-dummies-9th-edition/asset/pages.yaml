- img_proc: true
  md: '# Chapter 20


    # # The Virtual World


    In This Chapter


    +   - What''s a virtual server?

    - Installing VirtualBox

    - Getting ready to do real tasks with virtual machines


    > The real problem is not whether machines think, but whether men do.

    — B. F. Skinner (1904–1990)


    While the term virtual server sounds an awful lot like air guitar, virtual servers
    are actually a good thing. Virtual servers allow you to support multiple servers
    on a single physical machine, both space and money. They are quickly becoming
    all the rage in the corporate world, but they also have a place in the home environment.
    A virtual server allows you to install more than one Linux distribution on a single
    computer or to have Linux and Windows running on the same computer!


    In this chapter, we detail exactly what a virtual server is — it''s a bit more
    complicated than playing air guitar — and we show you how to install and use virtual
    server, VirtualBox.


    # # Understanding What Virtual Servers Are


    In this fast-paced world of changing technology, nothing is taken for granted.
    In the old days, if you needed to run ten separate servers on your network, you
    had to go out and purchase ten separate systems, and then place them in a huge
    data center where they took lots of space.


    Nowadays, you have another tool at your disposal: the virtual server, software
    that gives you the same capabilities as that hardware. With virtual servers, you
    can run all ten separate servers on one hardware system. You'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# Part IV: Junior Administrator Boot Camp


    not only save on hardware costs, but you also save space in your data center,
    save on the cost of electricity and cooling, and (perhaps) even save on the cost
    of hiring a horde of people to support the servers.


    Running virtual servers requires a software package that you use to create servers
    within a single host environment. The host operating system takes care of interlacing
    with the hardware; the virtual-server software plays middleware between the host
    and the virtual servers.


    Each virtual server has its own area — a sandbox — to run in. The host server
    saves memory and CPU time for the virtual server to use as if it were running
    directly on the underlying hardware.


    The trick to implementing virtual servers is all in the software. Several different
    virtual-server packages are around; the most popular in the Linux world are


    +   - KVM: An open-source project, KVM (www.linux-kvm.org) plugs directly into
    the Linux kernel. It runs only on systems that the kernel or can support virtualization
    — sharing the CPU between multiple programs.

    - VirtualBox: A sponsored project, VirtualBox (www.virtualbox.org) installs in
    any Linux distribution, no matter what the kernel or underlying CPU type. Because
    it works with every Linux distribution, we show you how to use VirtualBox in this
    chapter.

    - VMware Server: A free software package provided by VMware (www.vmware.com),
    VMware Server is available in several different versions for Linux distributions.
    It installs and runs as a Java web application in a browser.


    ![](img/f493a327f3c2a812b2e84b22c874990c_377_0.png)


    You can install any of these virtual-server packages on a Linux host — and then
    you can run your virtual server with various operating systems, including Linux
    and Windows!


    # Installing VirtualBox


    The first step is to install the VirtualBox software package. Depending on your
    Linux distribution, you may have this package available in the software repository.
    For Ubuntu, the package name is virtual-ose. Find it in the Synaptic Package Manager
    (discussed in Chapter 16) to install it on your system. After you install the
    package, choose Applications-Accessories.'
