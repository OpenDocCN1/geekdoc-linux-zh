  md: '# Introduction


    Welcome to the fascinating world of open-source software that is Linux. In this
    book, we introduce you to the wonders of the Linux operating system, originally
    created as a labor of love by Linus Torvalds in the early 1990s. Our goal is to
    initiate you into the rapidly growing ranks of Linux users and enthusiasts rewriting
    the rules for the operating system marketplace.


