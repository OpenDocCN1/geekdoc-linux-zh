- img_proc: true
  md: '# Part III: Getting Things Done


    If online 3-D games are your preference (or is that that "addiction"), you won''t
    be left out in the cold with Fedora. Some of the most popular online 3-D gaming
    sites are starting to embrace the popularity of Linux and are providing Linux
    clients.


    Unfortunately, even these days you''ll still need to do a little more work to
    get these clients installed on your Fedora computer. This section covers the game
    Second Life as an example.


    The Second Life online game is a virtual 3-D entirely built by players. It uses
    the power of 3-D graphics cards to walk you through an array of locations and
    lets interact with graphical "people" that represent other players. After you
    enter the Second Life world, you can interact with others to purchase or trade
    products, buy land, and even visit entertainment establishments!


    To enter the Second Life world, you''ll need the client software. The software
    is available from the Second Life Web site as an installable binary package. You''ll
    have to do some extra work to get the client installed, but it''s worth your:


    +   1. Open Firefox by choosing Applications:Internet: Firefox Browser.


    You can also start Firefox by selecting the globe icon on the top page.


    +   2. Go to the home page, click the Downloads link.


    +   3. At the bottom of the home page, click the Downloads link.


    +   4. On the Downloads Web page, select the Download link.


    The Web page detects that you''re on a Linux platform, and automatically downloads
    the Linux version of the installation program.


    +   5. Click to open the Second Life installation package automatically by the
    File Archive Manager for your desktop.


    The File Archive Manager application for your desktop starts (File Roller for
    GNOME, or Ark for KDE), showing the contents of the installation package.


    +   6. Extract the installation files into a folder.


    The Extract window appears. You can select where to extract the Second Life client
    folder to (most likely you''ll want to put under your Home folder).


    After you have the software installed, it''s time to play. Find the Second Life
    folder you extracted from the installation package. In it is a file named secondlife.
    Double-click this to start the client. The game begins. Enjoy!'
  merge: -1
