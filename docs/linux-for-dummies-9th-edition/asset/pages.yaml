  md: '# 12 Part I: Getting Your Feet Wet


    +   - Stable: The Linux kernel (the heart of the operating system) has achieved
    a level of maturity that makes most software developers envious. It is not uncommon
    to hear reports of Linux servers running for years without crashing.


    +   - Efficient: The modular design of Linux enables you to include only the components
    needed to run your desired services. Even older Pentium computers can utilize
    Linux and become useful again.


    +   - Free: To most people, the most intriguing aspect of Linux is the fact that
    it''s often free of charge. How (the capitalists murmur) can anyone build a better
    mousetrap without anyone direct monetary return?


    In this chapter, we intend to answer that last question for you. We hope to paint
    a picture of the open-source software development model that created Linux.


    # So where did Linux come from?


    Although programming of the Linux core started in 1991, the design concepts were
    were based on the time-tested UNIX operating system. UNIX was developed at Bell
    Telephone Laboratories in the late 1960s. The original architects of UNIX, working
    back when there were few operating systems, wanted to create an operating system
    that shared data, programs, and resources efficiently and securely—an idea that
    is still very relevant today. From there, UNIX evolved into many different versions;
    its current tree is so complicated that it looked like a kinda explosion.


    In 1991, Linux Torvalds was a computer science student at the University of Helsinki
    in Finland. He wanted an operating system that was like the UNIX system he had
    grown fond of at the university, but both UNIX and the hardware he ran on were
    prohibitively expensive. A UNIX


    version called Minix was available for free, but it didn''t quite meet his needs.
    So, Torvalds studied Minix and then set out to write a new version for himself.
    In his own words (recorded for posterity on the Internet because this was in an
    early version of an online chat room), which was "just a hobby, won''t be big
    and professional like GNU"


    Writing an operating system is no small task. After six months of hard work, Torvalds
    had made very little progress toward the general utility of it. He posted what
    he had to the Internet — and found that many people shared his interest and curiosity.
    Before long the brightest minds around the world were contributing to Linux''s
    project by adding enhancements or fixing bugs (errors in the code).'
