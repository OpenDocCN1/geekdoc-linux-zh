    the Ubuntu Migrate Documents and Settings feature is to ensure a seamless transition
    from a Microsoft Windows or other Linux distribution workstation to an Ubuntu
    workstation. It''s an aggressive feature in Ubuntu to allow current Windows users
    an easy path to Ubuntu.


    # 12. Select Migrate Documents and Settings, then click Forward.


    This step of the installer looks in the hard-drive partitions you''re replacing;
    it checks for any existing Windows or Linux partitions. If it finds them, it offers
    to help migrate any user accounts to the Ubuntu environment.

    nThe basic idea of the tool is that it looks for the Documents and Settings folder
    in an existing Windows installation — and then attempts to duplicate that environment
    in Ubuntu. If any are configured, the Migrate Documents and Settings window displays
    the individual users, with folders containing data for each user. It allows you
