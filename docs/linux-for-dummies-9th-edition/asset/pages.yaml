    can take. You can even (for example) enable or disable the entire firewall feature
    by clicking the Enable or Disable icon, respectively, on the toolbar. If your
    computer is connected directly to the Internet — as most computers are these days
    — make sure you use Enable Firewall.


    The only time not have the Fedora firewall active is when you''re already set
    up your machine(s) behind another strong firewall, or when you''re using a critical
    application that won''t work with the Fedora firewall in place. For just one application,
    though, there''s one huge risk! You can find out how to open the proper doors
    in the firewall for that one program.


    The Wizard icon on the toolbar provides a guided way to configure your system.
    It asks a few simple questions about your system and your network skill level,
    and then it provides options for setting your firewall features.


    Beneath the toolbar is an area where you can configure specific features manners.
