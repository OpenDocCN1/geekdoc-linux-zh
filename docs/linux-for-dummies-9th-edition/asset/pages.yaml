    # Working with Variables


    Variables in the bash are words or strings of text that computers use to represent
    a piece of data. An example of using a variable is setting the variable fruit
    to contain the text apple. A number of standard variables contain information
    about your account and environment settings.


    # Variables versus environment variables


    The first thing you need to know is that the bash shell has two types of variables:


    +   * Variables: A variable can be referenced in a program or shell session, but
    it''s visible and available to only that session or program.

    * Environment variables: An environment variable can also be referenced by the
    shell or program. However, it has an added behavior: Its value is copied to any
    other program or shell created from its environment.'
