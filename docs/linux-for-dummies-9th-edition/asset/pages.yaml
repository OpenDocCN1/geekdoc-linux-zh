  md: '# About the Author


    Richard Blum has worked in the IT industry for more than 20 years as a network
    and systems administrator. During that time, he''s had the opportunity to work
    with lots of different computer products, including Windows, Netware, Cisco, Avaya,
    different flavors of UNIX, and of course, Linux. Over the years, he''s also volunteered
    for several nonprofit organizations to help support small networks that had little
    financial support. Richard is the author of several Linux-based books for total
    Linux geeks, and a couple of Windows-based books for programmers.


    When he''s not being a computer nerd, Richard plays the electric bass in a worship
    band, and enjoys spending time with his wife, Barbara, and their two daughters,
    Katie Jane and Jessica.


    # Dedication


    To my daughters, Katie Jane and Jessica. Remember: It''s always a good time to
    learn new things (even when you''re not in school).


    # Author''s Acknowledgments


    First, all praise and glory to God, who through His Son makes all things possible,
    and gives us the gift of eternal life.


    A special thanks to Dee-Ann LeBlanc for passing the baton of this series to me.
    It''s amazing to think of the great authors who''ve been involved with guiding
    this series from the start. I''m glad to be able to build off of that tradition,
    and all your hard work.


    Many thanks to the great people at Wiley Publishing for their help and guidance
    in writing this. Thanks to Kyle Looper, the acquisitions editor, for offering
    me this opportunity, and Rebecca Senninger, the project editor, for keeping the
    project focused and on track. Many thanks to Michael Wissler, the technical editor,
    for his tireless efforts at trying to make sure everything presented was accurate
    and actually worked! Thanks goes to Carole McClendon at Waterside Productions
    for arranging this gig.


    Finally, I''d like to thank my parents, Mike and Joyce Blum, for constantly stressing
    education over goofing off, and wife Barbara and two daughters Katie Jane and
    Jessica for their love and support, especially while working on this project.'
