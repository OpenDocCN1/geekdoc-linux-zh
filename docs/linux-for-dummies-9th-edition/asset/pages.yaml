  md: '# # Chapter 21

    # Ten Steps to Setting Up a Samba Server


    +   **In This Chapter**

    * Introducing Samba

    * Making a file server

    * Troubleshooting


    > > There are some things you can''t share without ending up liking each other.

    > J. K. Rowling, Harry Potter and the Sorcerer''s Stone


    One quite possible the biggest thing in local networking is file sharing. The
    sharing of files is a necessity in the business world, but it can also come in
    handy in the home network as well. Having a common place for everyone in the house
    to place pictures, music, or documents makes floppies and flash drives almost
    obsolete.


    There''s no doubt that the Microsoft network environment is the most popular file-sharing
    system available. Any Microsoft Windows computers can connect to share folders
    with one another. But just because you decided to use Linux doesn''t mean you''re
    left out in the cold. In this chapter, we walk through the steps necessary to
    create your own file server on your home network that can be accessed from any
    Microsoft or Linux device on your network.


    # ## Dancing the Samba


    Making your Linux computer talk with Microsoft Windows workstations and servers
    requires a special software package. Microsoft uses a proprietary (secret) network
    protocol to communicate between Windows devices on a network.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# 382 Part V: The Part of Tens


    Fortunately, some enterprising open-source enthusiasts worked to reverse-engineer
    the Microsoft networking protocols and produced software to duplicate-them. The
    result of this effort is the open-source package called Samba.


    Both Ubuntu and Fedora include the Samba software to allow you to connect your
    workstation to an existing Microsoft network to share files. However, neither
    provides the software to create a Samba server — which is the way to allow Windows
    workstations to read files and folders on your Linux system.


    The Fedora distribution does, however, include a separate Samba package that provides
    an excellent graphical interface for creating and configuring a Samba server in
    your Fedora system. This allows your Fedora workstation or share your folders
    with other Microsoft Windows workstations on your


    ![](img/f493a327f3c2a812b2e84b22c874990c_395_0.png)


    The Ubuntu Server Linux distribution provides the Samba server software, but it
    doesn''t provide a graphical interface for configuring the server. You have to
    configure it from the command line.


    The Samba server software allows you to define folders on your Linux system, which
    it advertises on the Microsoft network. Remote Windows clients can browse and
    map to those folders as if they were on a Windows system.


    You can control access to the folders by using the standard Linux user and group
    permissions. Samba has the capability to allow Windows users on the network to
    access individual Linux user accounts. This feature allows you to use one set
    of user accounts on the Windows network and a different set of user accounts on
    the Linux system.


    # Step 1: Plan a Sharing Policy


    You can start sharing, first you must decide what you want to share and who gets
    to share it file. Mapping out a folder-sharing policy is a crucial element of
    creating a file server.


    Even in small organizations, you must often restrict subgroups from accessing
    information. Whether it''s separating teacher data from students, or keeping children
    away from parents'' data, you often find yourself creating more than one group
    for sharing folders.


    You can create as many shares (folders available to the network) on the file server
    as you need to manage the data groups. For each group that shares data, you must
    create a separate folder and define a separate group to place users in.'
