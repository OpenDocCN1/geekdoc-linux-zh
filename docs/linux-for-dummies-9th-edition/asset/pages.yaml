    # Updating Fedora with PackageKit


    Fedora, by default, runs the PackageKit program to automatically reach out to
    the Internet and check for available operating system and software updates. The
    PackageKit program is used by both KDE and GNOME desktops (although the KDE desktop
    version is called KPackageKit).


    You can either wait on this utility to tell you when something new is available
    or update your system manually. Most people do a mix of the two, accepting automatic
    updates when it''s convenient, and refusing them if it''s more convenient to go
    back later and get them manually.


    # Automated updates


    If you''re connected to the Internet and an update becomes available, a notification
    box appears on your desktop, proudly proclaiming “Updates Available” and telling
    you how many, as shown in Figure 16-1.


    If security updates are available, the notification window has a bit of a warning
    feel to it (you can''t tell from black-and-white Figure 16-1, but the window frame
    is bright red).


    You have the option to only install the security-related updates and come back
    later to install other updates, or you can choose to install all the available
    updates at this time.'
