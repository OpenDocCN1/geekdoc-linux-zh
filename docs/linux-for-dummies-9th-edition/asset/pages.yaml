    +   * Encryption: The Encryption tab has settings for security protocols Firefox
    uses; it''s also the place you can specify any special encryption certificates
    for visiting encrypted Web sites. Usually you can leave these alone.


    # Expanding your universe with add-ons


    Firefox has a set of features that it supports in the basic setup. In the wide
    world of Web browsing, however, sooner or later you''ll run into some things that
    the basic Firefox setup does not support.


    But never fear — help is close! Firefox allows you to add new features to the
    basic setup with just a few clicks of the mouse button. Firefox supports these
    new features through add-ons — small programs that tack more features onto the
    basic browser. Three types of add-ons are in Firefox:


    +   * Extensions: Add new features to the Firefox program, such as custom-ized
    tools and utilities as dictionaries.


    +   * Themes: Allow you to change the look and feel of your entire Firefox browser
    interface.


    +   * Plugins: Provide support for additional multimedia formats, such as video
    and audio tracks, directly in the browser.


    ![](img/f493a327f3c2a812b2e84b22c874990c_177_0.png)


    Do you get irritated at Web sites that insist that you download software just
    to view the site? The difference between a plugin and an external program is:
    A plugin displays the results in the browser, and an external program runs outside
    the browser. Although plugins can be annoying if you''re just looking for some
    basic information, they can provide some pretty cool stuff, such as streaming
    video and music through your Web browser. Chapter 14 explains how to add popular
    video plugins (such as the Adobe Flash plugin) to your system.'
