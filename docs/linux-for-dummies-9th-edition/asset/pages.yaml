    # # The GIMP basic tools


    The beauty of the GIMP is that all the tools appear in separate dialog boxes,
    allowing you to lay out multiple tools as you draw. The main dialog box allows
    you to coordinate between the different tool dialog boxes while editing an image.


    The File menu allows you to open or acquire an image to work with. In The GIMP,
    you can edit images from five different sources:'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 276 Part III: Getting Things Done


    +   - Start a new image from scratch on a blank canvas.

    - Load an existing image from your computer. The GIMP supports all the standard
    image types, as GIF, JPEG, TIFF, and others.

    - Retrieve an image from a remote Web location.

    - Retrieve an image from a scanner connected to your computer.

    - Produce an image of a screen shot of your desktop or of a application window
    on the desktop.


    When you open an image, it appears in the main dialog box, within an editing area.
    If you open more than one image at a time, each image opens in its own editing
    window. This feature allows you to work on several images at the same time; you
    don''t have to flip from image to image in a single window.


    The Toolbox box contains all the image-tools you''d expect from an image editor.
    You get tools for selecting images, reorienting the image (by flipping and so
    on); drawing with a virtual pencil, brush, or airbrush; filling spaces with colors;
    and adding special effects.


    For each tool you select, the bottom section of the Toolbox box shows detailed
    settings for the tool. In Figure 14-5, the Paintbrush tool is selected; settings
    related to the Paintbrush (such as brush size and opacity of the color) appear
    in the middle section.


    You can also keep the detailed settings for multiple options open as separate
    dialog boxes. The menu bar in the main dialog box allows you to select the editing
    features for option. Choosing Tools produces a list of the different tools you
    can open on your desktop (as shown in Figure 14-6).


    Figure 14-6: The GIMP Tools dialog list.


