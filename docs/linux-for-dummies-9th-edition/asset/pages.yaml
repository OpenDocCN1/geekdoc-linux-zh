    # Taking Advantage of Instant Messaging


    Instant messaging (IM) between people is like using a telephone — except you type
    your conversation rather than speak it. In addition, you can simultaneously hold
    instant-messaging conversations without the need for additional connections to
    the Internet. America Online (AOL) provides popular Instant Messenger (AIM). Other
    IM services are available from ICQ, MSN, Yahoo!, and Google. A wide variety of
    computer operating systems, including Linux, support these various IM services.


    In the Linux world, you''ll probably run into two popular IM packages:


    +   - Pidgin: Used in the GNOME desktop environment.

    - Kopete: Used in the KDE desktop environment.


    ![](img/f493a327f3c2a812b2e84b22c874990c_180_1.png)


    We take a look at how to set up each of these packages for your IM accounts.


    The Pidgin software package used to be called GAIM. Unfortunately, the name of
    the package has to be changed due to copyright restrictions. If you''ve used GAIM
    in previous versions of Fedora or Ubuntu, Pidgin works exactly the same way.


    # Using Pidgin Instant Messenger


    To launch Pidgin IM software from the Fedora GNOME desktop, choose Applications>Internet
    Messenger. From Ubuntu, choose Internet>Pidgin Instant Messenger.


    When you open Pidgin for the first time (see Figure 9-6), an empty dialog box
    (for managing your account) appears.'
