  md: '# 24 Part I: Getting Your Feet Wet


    You can also do the opposite — install only Linux on the computer and then use
    VMware (see Chapter 20) to install a virtual Windows machine that lives in a window
    within your Linux installation.


    If you take this approach, back up your original Windows files before installing
    Linux, and restore them in the new Windows machine.


    Yet another option is a new feature included in the Ubuntu LiveCD. The Ubuntu
    Installer (Wubi) is an application you can use to create the Ubuntu partition
    as a normal file inside an existing Windows partition, after which it installs
    Linux as a Windows application. This new method lets you create a dual-boot scenario
    without having to partition any disks, and it''s easily reversible (just uninstall
    Wubi).


    ![](img/f493a327f3c2a812b2e84b22c874990c_37_0.png)


    # Preparing to Use Linux and Microsoft Windows Together


    If you''re planning to run Linux and Microsoft Windows on the same machine, the
    odds that you already have Windows installed and have been using it for some time.
    Because we hate to hear screams of anguish from new Linux users, take a moment
    to assess what you have and what you need. The following sections will walk you
    through the processes to get your computer ready for a dual-boot environment.


    ![](img/f493a327f3c2a812b2e84b22c874990c_37_1.png)


    On the off chance that you don''t have Windows installed yet and still want dual-boot
    capability, you should install Windows before install Linux. Otherwise, during
    installation, Windows overwrites the part of your hard drive that Linux uses to
    store its boot menu. (This factor can create a mess later when you want to boot
    back into Linux) Then after you have installed, return here.


    # Installing a second hard drive


    Next to replacing the existing operating system, the second easiest way to get
    Linux onto a computer is to install a second hard drive. Many computers support
    multiple hard drives, chained together on the same disk cable or connected via
    multiple cables.


    Usually you can determine how your disk controller is configured by looking at
    the BIOS setup screen for your computer. The BIOS setup screen controls the basic
    hardware configuration on the computer. Figure 2-1 shows an example of the disk-controller
    area on a BIOS screen.'
