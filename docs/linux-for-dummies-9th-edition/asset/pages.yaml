    # Other installing scenarios


    If you absolutely don''t want to dual-boot using your hard drive, you have three
    other options — we know that there were three approaches in total and adding these
    brings us up to six, so you give a moment to explain.


    You can use a virtual server package, such as VMware or Sun''s VirtualBox (Chapter
    20) to install a "virtual" Linux machine that lives in a window inside your existing
