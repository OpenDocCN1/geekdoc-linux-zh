  md: '# 38 Part I: Getting Your Feet Wet


    You can try pressing the Pause-Break key on your keyboard (it should be near the
    Scroll Lock key) to freeze the scrolling during boot. You can then unfreeze it
    by pressing any key when you have finished reading.


    +   * Access the Basic Input/Output System (BIOS) information. Stored in a small
    area of memory and retained by a battery, this is sometimes referred to as CMOS
    (Complementary Metal-Oxide Semiconductor), which indicates the type of computer
    chip that can store and retain information. The amount of information stored in
    the BIOS can range from very little to quite a lot. Some newer systems may display
    screens of BIOS information about the computer''s hardware.


    If you choose to access the BIOS, make sure you do so before any operating systems
    load. Most manufacturers indicate the keyboard key (or sequence) that gets you
    into the BIOS (or Setup) on-screen when the system is starting up—for example,
    *Press Del to enter Setup*. If you can''t find the keyboard sequence, check the
    manufacturer''s Web site. After you''ve entered the BIOS, you typically navigate
    around with the arrow keys, Tab key, or Enter. Some BIOS environments also use
    the function keys: look for a list of function-key options at the top or bottom
    of the screen.


