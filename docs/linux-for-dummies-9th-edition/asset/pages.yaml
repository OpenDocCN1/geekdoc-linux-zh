    ![](img/f493a327f3c2a812b2e84b22c874990c_412_0.png)


    If you''re not sure your installer has frozen, try pressing various combinations
    of Alt-F6, where # corresponds to one of the function keys. Depending on the distribution,
    the installer may not have frozen completely if you can see different screens
    when you use this technique.


    # Tip #2: Checking Your Distribution Burns


    Sometimes the problem with an installation is the physical CD-ROM or DVD-ROM.
    Some Linux distributions, which as Fedora, provide a utility in the installation
    process that allows you to check the integrity of the CD-ROM or DVD-ROM medium.


    If your installation keeps dying while Anaconda (the installer program) is placing
    packages on your hard drive, follow these steps to try to fix it:


    +   - Place the DVD-ROM (or the first of your distribution''s CD-ROMs) into your
    drive.


    +   - Reboot the machine.


    +   - Wait until you reach the Media Dialog box.


    If you''ve changed your mind and just want to start the installation, press Tab
    or the arrow keys to select Skip and then press Enter.'
