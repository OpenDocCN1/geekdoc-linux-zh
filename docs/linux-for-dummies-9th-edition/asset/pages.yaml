  md: '# Chapter 1: Getting Acquainted with Linux 19


    Some Linux LiveCD distributions, such as Ubuntu, allow you to install the Linux
    distribution directly from the LiveCD. This enables you to boot with the CD, test
    drive the Linux distribution, and then if you like it, install it onto your hard
    drive. This feature is extremely handy and user friendly.


    ![](img/f493a327f3c2a812b2e84b22c874990c_32_0.png)


    We use the Ubuntu LiveCD distribution in this book to demonstrate using LiveCDs.


    With all good things, Linux LiveCDs have a few drawbacks. Because you access everything
    from the CD, applications run more slowly, especially if you''re using older,
    slower computers and CD drives. Also, because you can''t write to the CD, changes
    you make to the Linux system will be gone the next time you reboot.


    But advances are being made in the LiveCD world that would help solve some of
    these problems:


    +   * Copying Linux system files from the CD to memory to run faster

    * Copying system files to a file on the hard drive to save them

    * Storing settings on a USB flash drive

    * Storing user settings on a USB flash drive


    Some LiveCDs, such as Puppy Linux, are designed with a minimum number of Linux
    system files; they''re copied directly into memory when the CD boots — and you
    can remove the CD from the computer as soon as Linux is booting. Not only does
    this make your applications run faster (because applications run faster in computer
    memory), it frees up your CD tray so you can use it for ripping audio CDs or playing
    DVDs from the software installed.


    # Specialized Linux distributions


    Over the past few years, a subgroup of Linux distributions has started to appear.
    These are typically based on one of the core distributions, but contain only a
    subset of applications that would make sense for a specific area of use.


    Besides providing specialized software (for example, bundles of office products
    for business users), customized Linux distributions also attempt to help beginning
    Linux users by auto-detecting and auto-configuring common hardware-devices. This
    makes installing Linux a much more enjoyable process.'
