  md: '# 130 Part II: Getting Up to Speed with Linux


    Creating, copying, and renaming files and folders in Dolphin work exactly the
    same as in Nautilus. Right-clicking a file or folder produces a menu, which you
    can cut, copy, or move a file to the Trash folder.


    Be careful when you''re working in Dolphin; by default, it uses the KDE single-click
    method of activating: if you select an icon, Dolphin attempts to display the file,
    using the default application for the file. That''s somewhat annoying for those
    coming from a Microsoft Windows environment double-clicks to open files. You can
    change that situation by using the System Settings feature (see Chapter 5).


    Dolphin allows you to produce side-by-side windows of your filesystem in the Split
    display mode, as shown in Figure 7-6. Just click the Split button on the toolbar.


    Using Split display mode, you can easily drag and drop files from one folder to
    another — anywhere on the system!


    ![](img/f493a327f3c2a812b2e84b22c874990c_143_0.png)


    **Figure 7-6:** The Split display mode in Dolphin.


    # ## All Hail the Conqueror


    In the older versions of KDE (which are still popular in some Linux distributions),
    the default file-manager program was Conqueror. The Conqueror application is the
    Swiss Army Knife of the KDE project; it includes a file manager and a browser
    in one package.'
