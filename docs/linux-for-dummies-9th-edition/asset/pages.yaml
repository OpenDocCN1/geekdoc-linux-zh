  md: '# Chapter 13


    # Messing with Audio


    In This Chapter


    +   * Fixing sound problems

    * Listening to music

    * Recording music to your CDs and DVDs

    * Copying audio files from your CDs to your workstation


    > The price of freedom is responsibility, but it''s a bargain, because freedom
    is priceless.


    > — Hugh Downs


    You''re like us, everything''s better with music. If a computer can''t take the
    place of a stereo wherever we are, then just aren''t interested. So we can assure
    that Linux offers many ways to listen to music on your computer. Read on to find
    out what Linux can do!


    Listening to MP3s on Linux used to be problematic; MP3 is a patented format and
    was unavailable for Linux users. But now RealPlayer is available for Linux and
    has a license to play MP3s, so you''re all set. See Chapter 16 for how to install
    RealPlayer.


    # What Sound? I! Don''t Hear a Thing!


    These days, most Linux distributions detect sound cards automatically during the
    installation process — and they do a great job of it. However, if your sound card
    failed the test — or you try to play sound using one of the software options in
    this chapter and it doesn''t work — use this section to diagnose and fix your
    problem.


    Suppose your sound card passed the test, but for some reason you can''t hear anything.
    Here''s what to do:


    +   1. Check that your speakers or headphones are hooked up correctly.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# 250 Part III: Getting Things Done


    You wouldn''t be the first person to discover that the cat pulled the connectors
    out of their socks.


    +   2. Click the speaker icon on your panel to make sure your audio settings didn''t
    get turned down to zero, or muted.


    Both the GNOME and KDE desktops provide an icon in the system tray that gives
    you immediate access to the volume control for your sound system. Drag the slide
    bar up or down with your mouse to increase and decrease the volume level.


    +   3. Right-click the speaker icon for more detailed volume adjustments. You
    can access a Volume Control application from the same speaker icon for both the
    GNOME and the KDE desktops.


    +   4. Select the menu option to start the Volume Control application for your
    desktop.


    Figure 13-1 shows the GNOME Volume Control.


    ![](img/f493a327f3c2a812b2e84b22c874990c_263_0.png)


    Figure 13-1: The GNOME Volume Control.


    When this control opens, you can check your volume settings to help solve your
    sound dilemma.


    +   * Master: The main volume control corresponds to the volume slider on your
    desktop.

    * Headphone: Adjusts the volume of the headphone jack on your workstation.

    * PCM (for Pulse Code Modulation): Controls the volume for audio files stored
    on your computer.

    * Front: Adjusts the volume of the front speaker(s) on your workstation.

    * Line-in: Controls the volume for sound coming in through your sound card''s
    line-in socket.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Chapter 13: Messing with Audio 251


    +   * CD: Controls the volume for sound coming in through your KDE

    and/or DVD player.

    * Microphone: Controls the volume for sound coming in through

    your card''s microphone connector.


    If you''re working on the KDE desktop, you see the KMix volume control

    (Figure 13-2) when you right-click the speaker icon.


    ![](img/f493a327f3c2a812b2e84b22c874990c_264_0.png)


    In KMix, you also see separate sliders for different elements:


    +   * Front: Controls the volume for the built-in speakers in the computer. If

    stereo output is available, you see two Front sliders, one for the left

    channel, and for the right channel.

    * PCM: Controls the volume for audio files stored on your computer.

    * CD: Controls the volume for sound coming in through your CD and/or

    DVD player.

    * Headphones: Controls the volume for the external speaker jack in your

    workstation.


    The Capture check box allows you to change the slider''s meaning. Instead

    ofontrolling the CD volume, it controls the volume of any recording you

    perform from that device.


    When you''re comfortable with what you''re looking at in the GNOME or KMix

    control, look for one of these two major clues as what might be:


    +   * Are any of the items you muted? You can tell by looking for red X''s

    next to the volume icon underneath each section in the GNOME control,

    or for a checked Mute check box in KMix. In Figure 13-1, for

    ample, Line-in and Microphone are both muted. The one you see

    muted responsible for your problem? If you hadheadphones hooked up to your Line-in
    jack and Line-in was muted, you''d hear nothing when you put on your headphones.
    To unmute, click the X and make it away.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Part III: Getting Things Done


    Are any of the volume sliders all the way down? Again, Line-in and Microphone
    in Figure 13-1 are both slid down all the way. Using the same headphone example,
    even if Line-in wasn''t muted, you''d hear nothing because the sliders were down.
    Slide them up and see whether you can hear anything.


    If neither of these scenarios fits your problem, it might be something more fundamental.
    To investigate, find the Sound Preferences dialog box in your Linux distribution.
    For GNOME desktops, try this:


    +   1. In Ubuntu, choose System:Preferences:Sound; in Fedora, choose System:Preferences:Hardware:Sound
    to see whether the card is correctly detected and play test sounds.


    You may be asked to enter your root (administrative) password before the Sound
    Preferences dialog box opens, as shown in Figure 13-3.


    In the Devices tab, you should see the driver that your Linux distribution uses
    to interact with your sound card for different types of audio. Usually this value
    is set to Autodetect so GNOME can use whichever driver is active.


    2. Click the Test button for each sound type: section.


    You should hear a sound on the left, on the right, and in the middle. If not,
    select another driver for the sound card (if available) from the dropdown-list,
    and then test again.


    ![](img/f493a327f3c2a812b2e84b22c874990c_265_0.png)


    Figure 13-3: The GNOME Sound Preferences dialog box.'
