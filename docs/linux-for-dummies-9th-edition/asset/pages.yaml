    the entire Ubuntu without prompting you for too much information.


    You can start the installation process from two locations in the LiveCD:


    +   - Directly from the boot menu without starting Ubuntu

    - From the Install desktop icon after you start the Ubuntu system


    Both locations start the same installation process, which guides you through seven
    steps of options.


