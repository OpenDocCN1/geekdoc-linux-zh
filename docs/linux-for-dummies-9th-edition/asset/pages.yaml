    # Double-Checking Hardware Compatibility


    If you''re installing Linux on hardware you already own, just give it a try and
    then see what and doesn''t work. Parts of this section can help you out; they
    address fixing general hardware problems. Other chapters address more specific
    hardware issues such as sound cards (Chapter 13), wireless cards (Chapter 9),
    and so on. If you run into trouble, start in the specific sections dedicated to
    particular tasks, and then come here for more general help if you still haven''t
    solved the problem.


    The biggest problem areas are wireless cards and the very latest whiz-bang multimedia
    hardware — such as fancy new versions of video cards, sound cards, and image scanners.
    You can check hardware compatibility lists before purchasing new hardware, but
    they''re of limited use because hardware world changes so quickly. If you''re
    interested in looking at a general list,'
