  md: '# Chapter 17: Working without the GUI


    # Using Redirection and Pipes


    Redirection and pipes facilitate the flow of information. A pipe is exactly what
    it sounds like: directs the output of one program to the input of another program.
    A pipeline may consist of several utilities plumb together by pipes. At either
    end of this pipeline is, optionally, a redirection.


    Almost all Linux utilities require input and output have been plumbed with the
    following common interfaces: stdin (standard input), stdout (standard output),
    and stderr (standard error). By having a common method to feed input to a program
    or read data from the output of a program, you can glue utilities together into
    sophisticated solutions.


    # Redirecting command output


    We discuss redirecting command output here because it''s by far the most common
    form of information detouring. One example of output redirection involves telling
    a command to send its results to a file rather than the screen, you''ve probably
    been seeing it. In some familiar territory by piping ls -1 and then pressing Enter,
    to produce something like this following:


    ```

    rich@testbox:$ ls -1

    total 36

    drwxr-xr-x 2 rich 4096 2009-05-20 18:56 Desktop

    drwxr-xr-x 2 rich 4096 2009-05-17 14:09 Documents

    drwxr-xr-x 4 rich 4096 2009-05-17 17:42 GNUstep

    drwxr-xr-x 2 rich 4096 2009-05-17 14:09 Music

    drwxr-xr-x 2 rich 4096 2009-05-17 14:09 Pictures

    drwxr-xr-x 2 rich 4096 2009-05-17 14:09 Public

    drwxr-xr-x 2 rich 4096 2009-05-17 14:09 Templates

    drwxr-xr-x 2 rich 4096 2009-05-17 14:09 Videos

    rich@testbox:$ -

    ```


    Want to send this information to a file instead? You can use the redirection operator
    to tell bash to send the data into a file rather than onto your screen. Enter
    the following command to send the information to a file named listing:


    ```

    ls -1 > listing

    ```


    Notice that nothing shows up on-screen, normally you''d expect to see the output
    from the ls command. That''s because the directory is rerouted, to a file named
    listing. To verify enter the following command:


    ```

    cat listing

    ```'
