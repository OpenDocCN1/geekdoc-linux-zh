  md: '# 52 Part I: Getting Your Feet Wet


    ![](img/f493a327f3c2a812b2e84b22c874990c_65_0.png)


    Figure 3-5: The Advanced Options window.


    The Advanced Options window allows you to customize three additional features
    in Ubuntu:


    * The boot loader: When Ubuntu installs on a workstation, it can provide its own
    boot loader. The boot loader is responsible for starting the operating system.
    When you have a Windows operating system installed, Ubuntu provides its own boot
    loader.


    Ubuntu can replace the Windows boot loader with the Grand Unified Bootloader (GRUB)
    program. GRUB is the standard boot loader used in Linux systems; it can start
    only Linux systems but also many other operating systems, including Windows.


    The GRUB bootloader can be loaded in the Master Boot Record (MBR) of the first
    hard drive (called hd0 in Ubuntu), or in a multiple-hard-drive system, it can
    reside on the hard drive that contains the Linux partition.

    nThe Advanced Options window allows you to change the default setting for GRUB.
    Ubuntu enables GRUB and installs it in the MBR of the first hard drive. This is
    recommended to boot Ubuntu; it is also recommended if you have a dual-boot Windows/Ubuntu
    setup. If you keep the Windows boot loader, you won''t be able to boot directly
    into Ubuntu.'
  merge: -1
