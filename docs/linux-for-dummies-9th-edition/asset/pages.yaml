  md: '# Chapter 22: Ten Troubleshooting Tips


    # Tip #9: "My GUI Is Hung, and I''m Stuck!"


    If your GUI is not working, try pressing Ctrl+Alt+Backspace. If this doesn''t
    do the trick, then your system is in really bad shape! Try switching to a virtual
    terminal using Ctrl-Alt+F5. If this key combination also does nothing, you need
    to reboot the machine.


    # Tip #10: "Help, My Machine Hangs During Boot!"


    When configuring a Linux machine, you may encounter problems with the GRUB configuration
    file. In Fedora, this file is the /boot/grub/grub.conf. Ubuntu uses the /boot/grub/menu.1st
    file.


    This file indicates the operating system or systems to which your system can boot,
    and the file also contains Linux start-up settings. In order to fix your computer,
    you can either try rebooting and selecting a different Linux boot option from
    the menu, or you could refer to Chapter 3 for instructions on using the rescue
    disk to boot into rescue mode. Consider this list of potential solutions if the
    GRUB configuration file makes trouble:


    +   - If you have altered or hard drives, you may need to change the boot line
    in the GRUB configuration file.

    - If you haven''t made hardware changes, check to make sure that your GRUB configuration
    file is referring to the correct location of the Linux program. (The code that
    loads and executes at runtime is located in the /boot directory).

    - If the location under the /boot directory or the device for the root entry is
    incorrect, you can''t boot.

    - If you''re working with a multiboot (dual-boot or more) operating-system environment,
    be sure that your /etc/grub.conf file contains entries for each of your operating
    systems.

    - Each operating system or Linux installation must have a separate entry.

    - If your file contains entries to switch to a higher-resolution display and you
    have boot problems, reducing the video setting to simple VGA.


    ![](img/f493a327f3c2a812b2e84b22c874990c_418_0.png)'
  merge: -1
  pgno: 418
- img_proc: true
  md: '# 406 Part V: The Part of Tens


    Linux allows you to use spaces and other characters in filenames that you may
    not be able to use in filenames on other operating systems. However, some Linux
    applications may stumble when they encounter file or directory names containing
    spaces. Usually it''s a safe bet to stick with alpha-numeric characters and avoid
    spaces and odd characters (such as question marks and exclamation points).


    And here''s a bonus, all-purpose troubleshooting tip for an all-to-common situation
    . . .


    # "Aaargh! I1 Forgot My Root Password! What Do I Do?"


    Fear not — you have a way around this problem! You need to boot into single-user
    mode, which you can accomplish as follows:


    +   1. Reboot your machine.

    2. When you see the blue screen with the words Press any key to enter the menu,
    press a key.

    It doesn''t matter which key you press at this point.

    3. At the GRUB boot screen, press E.

    A configuration file opens.

    4. Use the arrow keys to go to the line starting with kernel.

    5. Press E to edit the kernel line. At the end of the line, add the word single.

    6. Press Enter to put the change into place, and then press B to boot the machine.

    7. Type passwd and then enter the new password twice as directed.

    8. Type exit and then boot the machine normally.'
