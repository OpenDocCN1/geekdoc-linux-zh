  md: '# # Chapter 9


    # # Using the Internet


    **In This Chapter**


    +   * Browsing the Web

    * Sending instant messages

    * Grabbing files

    * Talking across the Internet


    > > Give a man a fish and you feed him for a day; teach him to use the Net, and
    he won''t bother you for weeks.


    — Anonymous


    The Internet is a vast network of computers that spans the globe. Many different
    types of computers and operating systems work together to allow you access to
    information across this network. Linux, along with the other UNIX operating systems,
    has long supported and worked with the Internet. Practically all the different
    services available on the Internet are available from your Linux desktop.


    When you install Linux (Chapter 3), you get one or more Web browsers, e-mail programs,
    and instant-messaging tools placed on your new system. In this chapter, we introduce
    you to some of these tools; you can use them to access different services on the
    Internet — such as Web sites, e-mail, newsgroups, and FTP — after your Internet
    connection is configured (Chapter 8).


    # # Browsing the Web with Firefox


    Many people attribute the explosive growth of the Internet to the graphical Web
    browser. The Internet has been around for much longer than the invention of the
    browser. It''s just that most of the work done on the Internet was in plain old
    text, which held little attraction for those people who like pretty'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# 158 Part III: Getting Things Done


    pictures. In the world of Linux, the most popular browser is arguably Firefox
    (www.mozilla.org/products/firefox), the Web-browser portion of Mozilla (a communications
    program) that can also handle e-mail and news browsing. Another popular option
    is Conqueror (www.conqueror.org), besides being a good Web browser, also includes
    file-browsing similar to the Nautilus and Dolphin programs (see Chapter 7).


    Currently the developers of some major Linux distributions have a bit of an issue
    with the Firefox developers. The Firefox developers have copied the Firefox name
    and logo, which is considered a no-no in the open-source software world. Because
    of that, some Linux distributions refuse to include Firefox. Instead, they include
    the IceWeasel browser (you gotta love opens humor), which uses the same source
    code as Firefox (because the source code is still open, even if the logo and name
    aren''t). If your distribution uses IceWeasel, you can follow the same steps in
    this chapter.


    # # Configuring Firefox


    You can start surfing right now, if you want. You don''t need to customize your
    browser. However, you may want to take a moment to tell Firefox your preferences,
    such as the default Web site to show when it starts up, what font sizes to use
    by default, what colors to use, and many other options.


    Follow these steps to configure your Firefox settings in the Preferences window:


    +   1. Start Firefox.

    There''s usually more than one way to start Firefox. Linux distributions that
    use the GNOME desktop often put an application-launcher icon on the top edge (see
    Chapter 4). Distributions that use the KDE desktop sometimes include Firefox as
    an application launcher, and they put that in the panel (see Chapter 5).

    In both desktop environments, you can always choose Applications::Internet::Firefox
    (in GNOME), or KDE::Applications::Internet::Firefox (in KDE).

    2. Choose Edit::Preferences.

    The Preferences window appears, as shown in Figure 9-1. This dialog box contains
    all the settings you need to play with for your Web-browsing experience.'
  merge: -1
