    ![](img/f493a327f3c2a812b2e84b22c874990c_136_0.png)


    +   - Reload: If you created a file and don''t see it in the folder, select this
    this option.


    +   - Show Hidden Files: All files in Linux whose names start with a dot (for
    example, .profile) are hidden files — you have to tell Linux explicitly to see
    them.


    +   - Zoom In, Zoom Out, and Normal Size: Change the visual size of the folder''s
    contents.


    +   - Reset View to Defaults: Start over scratch.


    # Creating files and folders


    To create a new file or folder in Nautilus, follow these steps:


    +   1. Browse to the folder you want to create the item in.


    You need to have the folder open and inside its window before proceeding.'
