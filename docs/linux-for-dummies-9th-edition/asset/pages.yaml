  md: '+   - Microsoft Excel 5.0 (XLS) format: And even older Excel spreadsheet formats.


    +   - StarCalc 3.0 – 5 (SDC) format: Sun''s StarOffice spreadsheet format (a close
    cousin of the OpenOffice suite).


    +   - SYLK (SLK) format: The Symbolic Link format, used to exchange data between
    spreadsheets and other applications, such as databases.


    +   - Text CSV (CSV) format: The comma-separated text values, often used to export
    to databases.


    +   - HTML (HTML) format: Formats spreadsheet data as an HTML Web page.


    +   - Microsoft Excel 2003 (XML) format: A standard proposed by Microsoft for
    using the Internet XML, standard markup language for defining spreadsheet data.


    Like Writer, the Calc standard toolbar also provides a button for you to export
    the spreadsheet directly as a PDF document.


