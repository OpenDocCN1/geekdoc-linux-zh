  md: '# Chapter 9: Using the Internet


    Here''s what you find:


    +   **History**: The History section lets you designate how many days you want
    your browser to remember where you''ve been. You can also choose to let Firefox
    remember text you''ve entered into forms and the search bar. If you use this feature,
    Firefox will attempt to autocomplete words you''ve already typed before in those
    forms. You can also set Firefox to remember the files you''ve downloaded so you
    can easily remove them of downloading a 500MB file a second time.

    **Cookies**: Cookies are bits of information a Web site stores on your machine
    that can be accessed quickly. Some people dont how cookies are created; some folks
    don''t want any on their systems so Websites can''t track them. To prevent cookies
    from being stored, click the Accept Cookies from Sites box to deselect. To allow
    only certain sites to store cookies, click the Exceptions button and add those
    sites to the list of sites cookies you''ve decided to accept.

    You view every cookie you have by clicking the Show Cookies button, and you can
    either remove them individually (select the cookie you want to remove and click
    Remove Cookie) or remove all (click the Remove Cookies button to toss out all
    of your cookies immediately). You can specify how you want Firefox to keep or
    dump cookies by choosing an option from the Keep Until drop-list:

    * **They Expire**: Most cookies have an automatic expiration date. If you want
    to let the cookies dictate when they''ll be deleted, choose this option.

    * **I Close Firefox**: If you are using a library computer or another machine
    that is shared, or just don''t want the computer storing cookies when you''re
    done using the browser, choose this option.

    * **Ask Me Every Time**: If you want to be ultra-paranoid about cookies or to
    find how they are actually used, choose this option.

    **Private Data**: This section allows you to set what and how stored items (such
    as cookies, temporary files, history items, and stored data) are cleared. Select
    the Always Clear My Private Data When I Close Firefox check box if you want to
    clear all your stored files every time you exit Firefox. You can select exactly
    what items are cleared by clicking the Settings button and choosing individual
    items. As a safety feature, the Ask Me Before Clearing Private Data check box
    is selected by default to prevent accidentally clearing your data.'
