    in the toolbar to start or stop a service immediately; you can use the bottom-right
    part of the dialog box to see whether the service is running now.


    # Controlling and adjusting your firewall


    Even better than (just as essential) turning off unnecessary services is to make
    sure that you have a firewall in place. Using a firewall is like putting a big
    bunker around your house, with openings that only fit the visitors who want to
    do certain kinds of tasks. Friends could fit in one door, family through another,
    and package deliveries through another.'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# 358 Part IV: Junior Administrator Boot Camp


    In computer networks, each of the services discussed earlier always comes through
    the same door (port, in computer-world lingo). You use firewalls to prevent anyone
    from being able to do so much as touch a door (port) unless you explicitly set
    it up so they can do.


    Both Ubuntu and Fedora install a firewall by default, but in Ubuntu it''s not
    activated. The firewall package installed in Ubuntu is ufw. To activate the ufw
    firewall in Ubuntu, you need to do some work from the command line (see Chapter
    17). Follow these steps:


    +   1. Choose Applications:Accessories:Terminal from the top edge panel to start
    the Terminal application.

    2. Enter the following commands:


    ```

    rich$:- sudo ufw allow ssh/tcp

    ```


    The output looks something this:


    ```

    [sudo] password for rich:

    Rules updated

    richtbox:-$ sudo ufw logging on

    Logging enabled

    richtbox:-$ sudo ufw enable

    Firewall is active and enabled on system startup

    richtbox:-$ sudo ufw status

    Status: active

    ```


    | | Action | From |

    |---|---|---|

    | 22/tcp | ALLOW | Anywhere |

    |richtbox:-$ | | |


    The first command enables secure connections on the SSH TCP port.

    The second command tells ufw to log any activity that it restricts in a log file.
    This enables you to see whether anyone is trying to hack into your system. The
    next command starts the ufw firewall, and the last command displays the status.


    +   3. Type exit to exit the Terminal session.


    Once you enable the firewall, it starts each time you reboot your workstation.
    Unfortunately, because ufw is a command-program, you must use the command line
    to add or remove any further settings to the firewall.


    Fedora, on the other hand, provides a highly graphical interface for configuring
    the firewall. If you ever want to make changes, choose System:Administration:Firewall
    (you may be asked to enter your root password along with the way). The Firewall
    Configuration window opens, as shown in Figure 19-3.


    ![](img/f493a327f3c2a812b2e84b22c874990c_371_0.png)'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Chapter 19: A Secure Linux Box Is a Happy Linux Box


    ![](img/f493a327f3c2a812b2e84b22c874990c_372_0.png)


    Figure 13: The Fedora Configuration box.


    The Firewall Configuration window opens settings that you can use to specify your
