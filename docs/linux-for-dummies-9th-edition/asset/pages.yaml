  md: '# Chapter 1: Getting Acquainted with Linux


    # Anatomy of an Open-Source Software Project


    To the casual observer (and some corporate IT decision makers), Linux appears
    to be a freak mutation. How after all, everything can become complex and discipline-dependent
    as a computer operating system be developed by a loosely knit band of volunteer
    computer geeks from around the world?


    Just as science is constantly attempting to classify and explain everything in
    existence, technology commentators are still trying to understand how the open-source
    approach can create superior software, especially in cases where no one is in
    charge. The often reasons we have to do with the usual human desire to fill a
    need with a solution. When a programmer in the Linux world wants a tool, the programmer
    simply writes one — or bands with other people who wanted a similar package, and
    they write it together.


    # GNU who?


    Imagine software created out of need rather than projected profit. Even though
    UNIX ultimately became proprietary software, the motives for its creation were
    originally based on practical needs. What people usually refer to as the Linux
    operating system is a collection of software tools created with the express purpose
    of solving complex problems.


    The speed of Linux''s popularity wouldn''t be possible without the vision of Richard
    Stallman. Massachusetts Institute of Technology (MIT) has long held a reputation
    for nurturing the greatest minds in the technological disciplines. In 1984, Stallman,
    a gifted student and brilliant programmer at MIT, was faced with a dilemma — sell
    his talent to a company for a tidy sum of money or donate his gifts to the world.


    Stallman out on a journey to create a completely free operating system that he
    would donate to the world. He understands — and continues to be free. The original
    hacker ethic, which declares that information wants to be free. This concept wasn''t
    new in his time. In the early days of the computing industry, many advancements
    came from freely sharing ideas and programming code. Manufacturer-sponsored user
    groups brought the best minds together to solve complicated problems. This Stallman
    felt, was lost when companies began to hoard software as their own intellectual
    property with the single purpose of profit.'
