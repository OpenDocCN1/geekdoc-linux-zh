    +   3. By using the Size slider or by typing a value, choose the amount of memory
    you want to dedicate to the virtual server; then click the Next button.


    VirtualBox recommends an amount of memory to select, and the amount memory installed
    on the host system. You can increase or decrease that amount, either by using
    the size slider or by typing the amount into the text box. If you''re unsure of
    your virtual memory requirements, take the default value; you can always change
