    # Using CDs and Other Removable Media


    As discussed in Chapter 6, when it comes to removable media — CD-ROMs, DVD-ROMs,
    USB flash drives (if you have a retro system), and so on — if you are working
    from the command line, you have to look for those media one drive at a time. Having
    a GUI file-manager program available makes your removable media much easier to
    find.


    # CDs, DVDs, and USB flash drives


    Typically, when you insert a new item (say a data CD-ROM) in the GNOME desktop,
    an icon appears on the left of your desktop, showing the name of the device assigned
    to it. You can double-click the icon to see the medium''s contents. Here''s how
    you eject it:


    +   - If an E option is available (for example, for a CD-ROM), you can right-click
    the icon and choose E from the context menu.

    - Where Ej is not available, choose Unmount before removing the item (such as
    a USB flash drive) from the computer. This action ensures that all the data you
    saved accurately is written to the removable medium; Linux doesn''t always put
    the data on the right away.'
  merge: -1
