  md: '# 50 Part I: Getting Your Feet Wet


    ![](img/f493a327f3c2a812b2e84b22c874990c_63_0.png)


    ### Figure 3-4:

    The login ID window.


    # ## 11. Create a login ID, then click Forward.


    The login user you create in this process is somewhat important. Unlike some other
    Linux distributions, the Ubuntu distribution doesn''t use an administrator account
    (usually called root in the UNIX/Linux world). Instead, Ubuntu gives normal user
    accounts the option of belonging to a group of administrator accounts. Members
    of such groups can become temporary administrators on the system (Chapter 18).


    Having an account with administrative privileges is important, as the administrator
    account is the only account that''s allowed to perform most system functions,
    such as changing system features, adding new devices, and installing new software.
