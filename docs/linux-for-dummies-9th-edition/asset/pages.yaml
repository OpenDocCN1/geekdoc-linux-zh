    # Burning Audio CDs and DVDs


    A CD and DVD burner is a great way to make data backups (especially if you''re
    using rewritable discs), save and share your digital photos, and put together
    multimedia memos and scrapbooks. It''s also great for creating audio CDs you can
    play on any type of CD player, not just on your computer. Many tools are available
    that let you record CDs under Linux.


    For example, if you use the GNOME desktop, you can record CDs and DVDs from audio
    files on your workstation using the filesystem navigation discussed in Chapter
    7, right-clicking the file you want to record, and choosing the proper options
    from the context menu.


    However, this method often just burns the digital audio file onto the CD or DVD.
    This method won''t work if you''re trying to create an audio CD to play in an
    older CD player that doesn''t recognize the digital audio file''s format.


    Here we focus on K3b, popular CD-burning software often on KDE desktops, which
    can also run on GNOME desktops. The K3b software can create an audio CD from digital
    audio from your system.


    Choose Applications:Multimedia:CD & DVD Burning to open K3b from KDE desktop,
    and the main window opens, as shown in Figure 13-12.'
