  md: '# 410 Part VI: Appendixes


    # Getting help


    When you''re digging around for help on a command, you can call on an interesting
    range of shell commands for assistance, as shown in Table A-1.


    | Table A-1 | Shell Help Commands |

    | Command | Purpose |

    | apropos | Looks for commands that contain a keyword in their man page descriptions.
    |

    | info | One way of finding information. You can find instructions for this tool
    at www.gnu.org/software/texinfo/manual/info/, or you can use the built-in tutorial
    by starting the info tool and pressing the H key inside it. |

    | man | The primary way of getting help in Linux and UNIX. |

    | whatis | Gets and displays a one-line description of a command. |


    Locating details about the command-prompt options of a command is a never-ending
    pursuit. The man page system provides some helpful guides at your fingertips for
    rapidly finding this detailed information.


