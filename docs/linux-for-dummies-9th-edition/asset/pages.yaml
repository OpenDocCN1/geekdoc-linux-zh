    # Working with Calc files


    Like the Writer package, the Calc package allows you to read and write your document
    in many formats:


    +   - OpenDocument Spreadsheet (ODS) format: A proposed standard document for
    spreadsheets.

    - OpenOffice.1.0 Spreadsheet (OTS) format: The older OpenOffice 1.0 spreadsheet
    format.

    - Data Interchange Format (DIF): A text-file format to import and export spreadsheets
    between spreadsheet programs.

    - dBase (DBF): This option exports the spreadsheet data into a dBase database
    file.

    - Microsoft Excel 97/2000/XP (XL) format: The standard Microsoft Excel formats
    used by the most popular versions of Excel.

    The current version of OpenOffice.org doesn''t support the Excel 2007 (.xlsx)
    format. However, if you have a copy of Excel 2007, you can convert a spreadsheet
    in that format into a standard .xls format, which you can read in OpenOffice.org.

    - Microsoft Excel 95 (XLS) format: The older Excel spreadsheet format.'
