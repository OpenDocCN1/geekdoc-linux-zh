- img_proc: true
  md: '# Chapter 6: Getting to Know the Linux Filesystem


    +   The fifth item is the file''s size in bytes. All directories show up as 4,096
    bytes. Everything else has its own size. You can tell an empty file because its
    size will be 0 bytes.


    +   The sixth and seventh entries are all related to the date and the time file
    was changed: the date in YYYY-MM-DD format, and the time in 24-hour format (17:22).


    +   The ninth item is the filename (for example, bash history, in the third row).


    Linux uses two special files that you see in your file listings. The single dot
    (.) represents the current directory, while the double-dot (..) represents the
    parent directory. You can use these directory aliases when maneuvering around
    the system from the command line.


    ![](img/f493a327f3c2a812b2e84b22c874990c_128_0.png)


    # A permissions primer


    If you find yourself scratching your head when looking at parts of that long-format
    file listing, don''t worry. The group of nine after the first letter is the set
    of permissions (also called a permission set) for the file or directory. Linux,
    UNIX, and Mac OS use permissions as a way of providing file and directory security
    by giving you means to specify exactly what can look at your files, who can change
    them, and even who can run your programs. You need this capability when you have
    a bunch of different users on the same machine, networked to the world.


    # Checking out the triplets


    Each permission consists of three triplets. Each of the triplets has the same
    structure but controls the aspect of who can use it. Consider the long-format
    listing for /home/dee in the following code:


    ```

    rich@testbox:~$ ls -al

    total 2480

    drwxrxr-x 30 rich 4096 2009-05-16 13:58 .

    drwxrxr-x 3 root 4096 2009-05-16 09:04 ..

    --rw-r-- 1 rich 220 2009-05-16 09:04 .bash_logout

    --rw-r--r 1 rich 3115 2009-05-16 09:04 .bashrc

    drwxrxr-x 2 rich 4096 2009-05-16 09:20 .cache

    drwxrxr-x 4 rich 4096 2009-05-16 09:23 .config

    drwx------ 3 rich 4096 2009-05-16 09:20 .dbus

    drwxrxr-x 2 rich 4096 2009-05-16 09:20 Desktop

    ```'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# 116 Part II: Getting Up to Speed with Linux


    The first character in the permission set refers to the type of file. For a directory,
    the character is shown as a d, as shown in the first two items in the preceding
    list; files are designated with a dash (-). Each file or directory''s permission
    set is a group of nine characters — that is, the nine characters that follow the
    first character (for a total of nine). But this group of nine is really three
    groups of three, as shown in Figure 6-4.


    ![](img/f493a327f3c2a812b2e84b22c874990c_129_0.png)


    | R | W | X | R | W | X | R | W | X |

    |---|---|---|---|---|---|---|---|---|

    | Users | | | Groups | | | Others | | |


    > nR = Read

    W = Write

    X = Execute


    The three triplets are read as follows:


    +   - The first triplet consists of the second, third, and fourth characters in
    the long-format file list. This triplet sets the permissions for the user, or
    owner, of the file. (Owners are discussed in the "Beware of owners" section, later
    in this chapter).

    - The second triplet consists of the fifth, sixth, and seventh characters in the
    long-format file list. This triplet sets the permissions for the group that is
    assigned to file. (Groups are discussed in the "Hanging out" section, later in
    this chapter)

    - The third triplet consists of the eighth, ninth, and tenth characters in the
    long-format file list. This triplet sets the permissions for other, or everyone
    who isn''t the file''s owner or member of the owning group.


    Although each triplet is different from the others, the internal structure of
    each one is made up in the same way. Focus specifically on how to read one triplet
    before looking the set of them. Each triplet includes three characters:


    +   - The first character is either an r or a dash. The r stands for read permission.
    If r is set, the triplet allows the entity it stands for (user, group, or other)
    to view the directory''s contents.

    - The second character is either a w or a dash. The w stands for write permission.
    If w is set, the triplet allows the entity it stands for to add, delete, or edit
    items in this directory or file.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Chapter 6: Getting to Know the Linux Filesystem


    +   The third character is either an x or a dash. The x stands for execute permission.
    If x is set, the triplet allows the entity stands for to access the files contained
    in this directory or to run the particular program in this file.


    ![](img/f493a327f3c2a812b2e84b22c874990c_130_0.png)


    In all cases, if the dash sits in place of r, w, or x, the triplet doesn''t allow
    the entity read, write, or execute permission.


    The following sections describe owners and groups in more detail.


    # Beware of owners


    You may have noticed by now that we talk a great deal about owners (users) and
    groups in Linux. Every file and directory has both of these components: a user
    from the /etc/passwd file that is assigned as its owner and a group from the /etc/group
    file that is assigned as the group.


    Although an everyday user probably needs to change file ownership, the root user
    does so regularly. If you add the file comments, for example, to /home/tom while
    you''re logged in as the superuser (another term for Administrator, who is the
    person who owns the root account), the root user owns that file. The user can''t
    do anything with it unless the file''s owner (root) sets permissions to allow
    the other folks (who are not root) to read and write the file. But this is a pretty
    sloppy way of doing things because permissions is to reduce access, not to give
    everyone access. Instead, remember to change the file s owner to the user tom.
    You do this with the chown (change owner) command. For example, by typing chown
    rich changes the ownership over it. Mike can work with this file and even change
    its permissions to whatever he prefers:


    ```

    richtestbox:~$ ls -al comments

    -rw-r--r-- 1 rich 5 2009-05-16 14:25 comments

    richtestbox:~$ sudo chown mike comments

    [sudo] password for rich:

    richtestbox:~$ ls -al comments

    -rw-r--r-- 1 mike 5 2009-05-16 14:25 comments

    richtestbox:~$

    ```


    # Hanging out in groups


    Groups are more interesting to work than owners. You use groups to allow the root
    user to assign multiple users the ability to share certain file systems. For example,
    in many versions of Linux, all users are added to a group named users (openSUSE
    does this, for example). Then than a long-format file listing such as the one
    shown earlier in this chapter, you may see the following:'
  merge: -1
