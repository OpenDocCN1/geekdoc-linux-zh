  md: '# 378 Part IV: Junior Administrator Boot Camp


    # # The Devices menu


    The Devices menu allows you to control the status of the hardware devices used
    in the virtual server. The options available in this section depend on which hardware
    devices you selected when you created the virtual server-sandbox. The available
    options are


    +   - Mount CD/DVD-ROM: Allows you to connect the virtual server to the host system''s
    CD or DVD-ROM drive or to an ISO image of a CD or DVD-ROM stored on the host system.
    This second feature is great for easily installing a Linux distribution from an
    ISO image without having to burn it onto a CD.

    - Unmount CD/DVD-ROM: Releases the CD/DVD or ISO image from the virtual server.

    - Mount Floppy: Allows access to the workstation''s floppy drive (installed) or
    to a file image of a floppy disk. Similar to the CD/DVD-ROM version, you can use
    a file on your host system to emulate a floppy disk.

    - Network Adapter: Provides access to the emulated network adapters on the virtual
    server. You can either enable or disable the network adapter.

    - USB Devices: If you allow the virtual server to access your USB devices while
    you''re setting up the virtual server, this option appears. When you plug a USB
    device into the host system, VirtualBox detects the device automatically and passes
    it to the guest operating system. To remove your USB device, disable the entry
    in this menu.

    - Shared Folders: If you selected to create shared folders for the virtual server
    during the setup, this area to enable and disable access to the shared folder.

    - Install Guest Additions: You can download the VirtualBox Guest Additions from
    this menu entry. The Guest Additions contains specialized drivers you can install
    on guest operating systems to allow customized video and mouse interaction (see
    the section "The Machine menu" earlier in this chapter).


    A check mark next to an adapter means it''s enabled.


    ![](img/f493a327f3c2a812b2e84b22c874990c_391_0.png)


    The Devices menu gives you full control over which hardware the guest operating
    system can access.'
