  md: '# 376 Part IV: Junior Administrator Boot Camp


    +   - If at any time you want to release control back to the host system (as when,
    say, you want to run another application at the same time), press the Ctrl key
    on the right side of the keyboard.

    - To return control to the virtual server, just place the mouse anywhere inside
    the console-emulation window and press the right Ctrl key.


    There are also two menu items — Machine and Devices — that can help you in your
    virtual-server environment.


    # ## The Machine menu


    The Machine menu provides easy access to several common functions you may want
    to perform with your virtual server:


    +   - Fullscreen Mode: Enlarges the virtual server’s console-emulation window
    to take the full size of the host screen. To return to windows, hold the right-side
    Ctrl key and press the F key.

    - Seamless Mode: This is a special feature available with guest operating systems.
    VirtualBox allows you to install a video driver on the guest operating system
    so VirtualBox can display and control the guest operating system as a normal window
    on the host.

    - Adjust Window Size: Changes the size of the VirtualBox console-window on the
    host.

    - Auto-resize Guest Display: Allows VirtualBox to size the window according to
    the video settings used in the guest operating system. If the display resolution
    in the guest operating system becomes too large to fit in a desktop window on
    the host, VirtualBox creates scroll bars automatically so you can pan around the
    guest display.

    - Disable Mouse Integration: Another special feature available with guest operating
    systems. VirtualBox allows you to install a mouse driver on the guest operating
    system, which allows better control over the mouse pointer in the console-emulation
    window. This feature (called mouse integration) is enabled.

    - Insert Ctrl-Alt-Delete: If you installed a guest operating system that requires
    the “three-finger salute” to reboot, your host system also recognizes the Ctrl-Alt-Delete
    key combination, this option allows you to emulate the key combination.

    - Insert Ctrl-Alt-Backspace: If you have installed a guest operating system that
    uses the X-Windows graphical manager (as Linux installations do), and you’re using
    a Linux host, you can''t reset the X-Windows session on the guest by pressing
    the Ctrl-Alt-Backspace combination; if you do, the host system resets. This option
    allows you to emulate the key combination without having to press it.'
  merge: -1
