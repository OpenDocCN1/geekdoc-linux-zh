    # Dealing with Old-Fashioned File Transfers


    While BitTorrent is the wave of the future, there are still plenty of Internet
    sites that require you to download files using the old File Transfer Protocol
    (FTP) method. You will often find file repositories for applications, utilities,
    and other neat stuff on FTP sites.


    Most Linux distributions include a command-line FTP client (simply called ftp),
    but don''t include a graphical client in the default installation. However, there
    is no problem to add one using the software-package manager (see Chapter 16).
    The three most popular graphical FTP programs in the Linux world are


    +   - gFTP: The GNOME project''s graphical FTP client.

    - Kget: The KDE project''s graphical FTP client.

    - FileZilla: A graphical FTP client program created to run on any desktop, including
    Windows and Mac.'
  merge: -1
