    # Troubleshooting


    With everything else computer-related, there are always ways things go wrong while
    you''re creating a file server. Here''s a brief list of trouble-shooting issues
    that may crop up:


    +   - Users can''t access their shared folders: Check all the permissions. First,
    to make sure that the proper Linux group is set for the folder. Then to make sure
    that the group has the proper permissions for the folder. Finally, check to make
    sure that the individual users are members of the Linux group.


    +   - After you''ve verified that the Linux permissions are okay, look into the
    Samba permissions. Check to make sure that the proper Samba user have been given
    appropriate access to the share.


    +   - Users can''t be seen when they browse the network: Check to make sure that
    the Visible box is enabled for the share in the Samba Configuration window. Selecting
    this box allows Samba to advertise on the network. If this box is not selected,
    the share will not be advertised - and will not appear on-screen for clients when
    they browse the network.


    The visible box can serve as an extra security feature. Hackers can''t break into
    what they can''t see. Valid users can map to the share manually using the Microsoft
    network name in the following format: \servername.sharename.


    +   - Users can see the file server when they browse the network: Make sure that
    the smb service is enabled in the Services Configuration window. If the smb service
    is not enabled, remote clients won''t see the server on the network and won''t
    be able to connect to it.


    +   - Users can see the file server, but they can''t map to any shares: Make sure
    the Fedora firewall settings allow Samba enabled. If the Samba port is not enabled,
    Samba can send data through the network, but it cannot receive any data.


    ![](img/f493a327f3c2a812b2e84b22c874990c_409_1.png)'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Chapter 22


    # Ten Troubleshooting Tips


    In This Chapter


    +   - Dealing with frozen installations

    - Changing your boot environment

    - Recovering when you see a black-and-white text screen!

    - Escaping the GUI

    - Using multiple resolutions


    Troubleshooting is like reading a mystery novel: You have some facts, symptoms,
    and details, but you don''t know whodunit. You have to take whatever information
    you have, work with that data, weigh the various possibilities, and narrow them
    to a single suspect. Finally, you need to test your theory and prove that your
    suspect is the guilty party.


    Troubleshooting problems in Linux (or any operating system) can encompass many
    hardware and software issues. Whether the problem is the operating system, or
    a service giving you hints, you can use some basic troubleshooting techniques
    to start your investigations:


    +   - **Document the problem.** Write down any and all symptoms that the system
    is showing, including actions you can and can''t. Jot down any information you
    see in error messages.

    - **Examine the Linux log files.** You can find most of these in the /var/log
    directory. Look for the word error.

    - **Compare your problem system with a working system running the same distribution
    and version.** Sometimes comparing configuration files and settings may uncover
    the problem or narrow the possibilities.

    - **Check connections.** Check to make sure that all the hardware is connected
    properly and powered on. Verify that all cables and connections are attached properly.
    There''s always someone, somewhere, accidentally kicking a cable out of a wall
    connection.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# 398 Part V: The Part of Tens


    +   - Remove hardware. Remove any hardware that you have changed or added recently
    (before the problem started), and check to see whether the problem disappears.
    If it does go poof, you can probably conclude the new or changed hardware (or
    its driver) is the culprit — start researching solutions.


    +   - Reduce the number of active programs. Stop running unnecessary services
    and applications that aren''t related to the problem at hand. You may easily figure
    out what''s happening if other services and applications aren''t getting in the
    way.


    +   - Check to whether the problem is reproducible. Does the same sequence of
    events produce the same? Suppose that you try to print to a color printer, nothing
    happens. If nothing happens every you attempt to print, the problem is reproducible.
    (If instead) sometimes your information prints and sometimes happens, it doesn''t,
    the problem isn''t the same, or it isn''t reproducible — or is caused by something
    more complicated than just clicking one button. Unfortunately, problems that are
    non-repro are more difficult to resolve, if no set pattern of events recreates
    those problems, you don''t know what to change.


    After you''ve come up with a solution, take a few moments to document the situation.
    Note the symptoms of the problem, and the solution you implement. The next time
    you encounter the problem, you can call on your notes for a solution rather than
    having to reinvent the wheel.


    ![](img/f493a327f3c2a812b2e84b22c874990c_411_0.png)


    If you don''t have any problems to troubleshoot (yet), document your environment
    before you do. Making a backup of your /etc directory and /boot directory is a
    great place to start.


    When you''re installing Linux, the installation process may just freeze. If it
    does, wait a bit (maybe even a few minutes) and make sure the program really froze.
    (Sometimes the software just takes a while to process information.) If the software
    looks like it has frozen, there''s no harm in rebooting your computer and starting
    — just as you would do with any operating-system installation. Sometimes you can
    reboot and never have that problem again. At other times, the problem may happen
    twice in a row and then be fine the third time. Be sure to try several times before
    giving up.


    If the installation still freezes at the same spot (or close to the same spot)
    in its process, go to the distribution''s support pages (see Chapter 1). These
    pages may talk about some known problems and solutions that can help'
  merge: -1
