    # Talkin'' on the Phone


    The crazy days are chatting on the phone over the Internet. Whether you just want
    to experiment or are complete devotee, Linux offers the software you need if you
    take part. Think of Internet phone networks like Instant Messenger. One of the
    most popular networks for supporting Internet phones is Skype (www.skype.com),
    which uses SIP (Session Initiation Protocol), a popular default that you can use
    with a wider variety of programs. First, however, you need the proper hardware
    — whether it''s a phone you can plug into your computer (a SIP phone, for example)
    or just a combination of a headset and a microphone — preferably not the lowest-end
    so you''ll get the best sound quality. When you have the hardware, it''s time
    to get the software.


    In Fedora and Ubuntu, the default client software is Ekiga (www.ekiga.org). Two
    SIP clients are also included in the repositories, as discussed in Chapter 16:
    KPhone (http://sourceforge.net/projects/kphone) and Linphone (www.linephone.org).
    The popular Skype package isn''t included, but you can download a Linux client
    for Skype from www.skype.com.


    In the upcoming sections, we show you how to configure the default Ekiga package
    and the popular Skype package.


    # Using the default: Ekiga


    The default Ekiga Phone software is a redesign of the old GNOME GnomeMeeting package
    for Internet voice and videoconferencing applications. Ekiga was expanded to provide
    the same basic functions as the more popular Skype software, along with compatibility
    with Microsoft NetMeeting.'
  merge: -1
