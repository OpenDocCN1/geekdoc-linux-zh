    # Burning Data CDs and DVDs


    A CD and DVD burner is a great way to make data backups (especially if the disc
    is rewritable), save and share your digital photos, together mementos or scrapbooks,
    and more. Many tools are available to allow you to burn CDs under Linux; here''s
    a quick look at a few of them.


    # The K3b package


    By far the most popular CD and DVD burner in the KDE environment is K3b. Unfortunately,
    it''s not installed by default in Fedora. If the pack have installed it yet, see
    Chapter 16 how to do so — the specific packages you want are k3b and k3b-extras.
    To open the K3b file, choose Applications:\Media\CD and DVD Burning. The window
    shown in Figure 7-10 opens.


    ![](img/f493a327f3c2a812b2e84b22c874990c_148_1.png)


    Figure 7-10: The K3b CD and DVD Creator.'
