  md: '# Copying and moving files


    You can use different methods to copy and move items in Nautilus. The first is
    the usual method you''re probably familiar with from Windows or the Mac OS — click
    and grab a file or folder and drag it where you want it to go. You can click and
    drag between folder windows and into folder icons. Here are some tips:


    +   - Hold down the Ctrl key while you drag down to make a copy rather than just
    move the file.

    - If you want to drag the file into a folder icon, make sure that the folder icon
    is highlighted before you release the mouse button.

    - If you want to drag the file into a folder window but not into one of the folder
    icons, make sure that the folder icons are not highlighted before you release
    the mouse button.


    The other method for copying and moving files and directories involves following
    these steps:


    +   1. Right-click the file or directory you want to copy or move.

    2. From the context menu that appears, choose Cut if you want to move the file,
    or choose Copy if you want to copy it.

    3. Navigate to the folder you want to move the file into.

    4. Do one of the following:


    > The file doesn''t disappear after you make your selection if you''re trying
    to move it.


    +   - If you want to move or copy the file into a folder window, right-click inside
    that window (make sure that nothing is already highlighted) and then choose Paste.

    - If you want to move or copy the file into a folder icon rather than an open
    folder window, right-click the icon and choose Paste Into Folder.


    ![](img/f493a327f3c2a812b2e84b22c874990c_138_0.png)


    If you''re used to the standard text-editor shortcut keys (Ctrl+C to copy, Ctrl+X
    to cut, and Ctrl+V to paste), those work just fine in Nautilus as well.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Part II: Getting Up to Speed with Linux


    # Deleting files and folders


    To use Nautilus to delete either a file or a directory from the filesystem,

    follow these steps:


    +   1. Browse to the file or directory''s location.

    2. Select the file(s) or folder(s).

    You can select the file or folder by doing one of the following:

    * Clicking the file or folder to highlight it.

    * Clicking the first item, holding down the Shift key, and then clicking-ng the
    last item in the group to choose them all. (All these itemsnbe lined up next to
    each other.).

    * Clicking the first item, holding down the Ctrl key, and then clickingneeach
    individual item you want to select.

    * Clicking and dragging your mouse pointer so you make a box thatncontains all
    the items you want to select.


    +   3. Press the Delete key or right-click and select Move To Trash.

    The file vanishes from view. Keep in mind that if you''re deleting

    a folder and the folder contains other files or folders, everything in

    t folder goes into the Trash right along with it.


    > These deleted items are fact sitting in the Trash folder; they aren''t really

    deleted from your hard drive. If you haven''t emptied the trash, you can

    move these files out of the Trash folder and back into your filesystem if you

    anto.


    ![](img/f493a327f3c2a812b2e84b22c874990c_139_0.png)


    # Taking out the trash


    You can permanently delete the contents of your Trash folder by following

    these steps:


    +   1. Right-click the Trash icon.

    This action opens a shortcut menu with options listed.

    2. Choose Empty Trash from the shortcut menu.

    A confirmation dialog box opens.

    3. Click Empty in the confirmation dialog box to delete the contents of

    t Trash folder.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Chapter 7: Using the Filesystem


    Linux permanently removes the items in the Trash folder. You can tell whether
    the Trash folder is empty by looking at the Trash waste can. If it''s empty, it
    contains no files. If you see papers in it, it contains trash.


    Files and folders in the Trash folder are not automatically cleaned up by Linux.
    It''s up to you to clean out your Trash folder to permanently delete files and
    from your workstation.


    # Viewing and changing permissions


    In Chapter 6, you see that every file in Linux (and other forms of UNIX) has a
    set of *permissions* that govern who is allowed to view it, run it, delete it,
    and so on. Permissions are pretty important; they''re assigned to make sure that
    people can''t mess with the system''s or other else''s files. In this section,
    we focus on how to manage file permissions in the GUI.


    To view and change a file or directory''s permissions in Nautilus, follow these
    steps:


    +   1. Browse to the file or directory''s location.


    Opening the folder window that contains this item is sufficient.


    +   2. Right-click the file or directory.


    A context menu appears.


    +   3. Choose Properties from the context menu.


    The Properties dialog box appears with the Basic tab open.


    +   4. Click the Permissions tab.


    The Properties portion of the Properties dialog box appears, as shown in 7-4.


    +   5. Set the new permissions and ownerships.


    See Chapter 6 for a breakdown of all this stuff means. Notice that the GUI divides
    Owner, Group, and Others into separate drop-down list boxes. Unless you''re familiar
    with SELinux, leave SELinux Context option.


    +   6. Click Close to close the dialog box.


    The file''s permissions are now changed.


    That pretty much covers everything you''d want to do with the filesystem in Nautilus.'
  merge: -1
  pgno: 140
- img_proc: true
