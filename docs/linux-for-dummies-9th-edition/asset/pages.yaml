  md: '# # Chapter 9: Using the Internet


    The Skype network is a bandwidth-sharing application. After you connect to a Skype
    server, others can connect through your client program by using your bandwidth.
    If you are on a limited-bandwidth connection, this could be a problem.


    #  Working with Other Internet Tools


    You may want to explore a variety of other types of tools, depending on your needs.
    This section covers some pointers to get you started, so if you go to Chapter
    16 and add the appropriate software (or find yourself digging through means and
    wondering what the program may be called), you aren''t completely lost. Here are
    some resources to steer you right:


    +   - **IRC programs**: Internet Relay Chat (IRC) is a protocol that provides
    any topic imaginable. Although the IM clients support IRC these days, you may
    prefer a program that''s used *only* for IRC. Common programs for this purpose
    are X-Chat and KIRC.


    +   - **File sharing**: LimeWire is a popular file-sharing application if you
    want to use the Gnutella network.


    +   - **RSS readers**: Many news-oriented sites use the Really Syndication (RSS)
    protocol to stream news directly to RSS reader programs. Firefox has a number
    of RSS extensions designed for it. In addition, Straw is a popular RSS program.


    If you''re not sure what programs to use, do a Web search on the type of thing
    you want to do (such as RSS) and include the word *Linux*.'
  merge: -1
