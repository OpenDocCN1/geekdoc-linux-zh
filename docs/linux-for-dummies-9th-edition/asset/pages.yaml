  md: '# # Appendix B


    # # About the DVD


    The DVD-ROM included with this book contains everything you need to install or
    run either Ubuntu 9.04 workstation or Fedora 11. This is the equivalent of the
    LiveCD you''d have to download from the Ubuntu Web site, or the full Fedora installation
    DVD-ROM you would have to download from the Fedora Project''s Web site. The DVD
    includes:


    +   * The Ubuntu workstation LiveCD: A distribution that includes most of the
    common workstation applications. You can use the LiveCD to boot directly from
    your PC''s CD-ROM drive to test Ubuntu without having to load it on your PC, or
    load Ubuntu directly onto your hard drive.


    +   * The full full installation DVD-ROM: A distribution that includes just every
    Linux application available. Since it''s an installation DVD-ROM you can''t run
    this distribution directly from your DVD-ROM. When you boot from the full Fedora
    installation DVD-ROM, it automatically starts the Fedora installation program
    to install Fedora on your hard drive. Don''t use this feature if you don''t want
    to replace your existing operating system.


    +   * KDE (the Desktop Environment) and GNOME (GNU Network Object Environment):
    The two leading graphical user interfaces for Linux. Ubuntu uses the GNOME desktop,
    but in the Fedora installation you can pick the one you like best!


    +   * Firefox: The best-of-breed Web browser for your Linux machine, waiting for
    your surfing pleasure.


    +   * Samba: The best way to integrate Linux servers with Windows users. Samba
    lets your Linux masquerade as a Windows server so that Windows users can grab
    files and process documents hassle-free.


    +   * Games!: Tons of games; enough to help you procrastinate for weeks!


    +   * OpenOffice.org: A full-featured and popular office suite.'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# 420 Part VI: Appendixes


    If you don''t have a DVD-ROM drive, you have a few options:


    +   - If you want to try out Ubuntu, you can go to the Ubuntu site (www.ubuntu.com)
    to download the LiveCD and burn it (discussed in Chapter 3).


    +   - If you want to install the full Fedora system, you have to go to the Fedora
    Project site (http://fedoraproject.org) and download the CD images for Fedora
    11 and burn them themselves. This is a lot of downloading, so that may not be
    your favorite choice.


    +   - Go to the Fedora site and download the Fedora CD image, which doesn''t give
    you a full version you can install permanently, but it is just one that you can
    boot directly into Linux without needing installation.


    +   - Go to a site CheapBytes (www.cheapbytes.com) and order the Ubuntu or Fedora
    CDs for around $10 — we can''t anticipate that they''ll charge, so don doesn''t
    hurt if we''re wrong.


    If you download the CD images to burn, make sure that your CD burner is working
    with ISO images (usually the option has something to do with the word "image”).
    If you burn the CD and find that it contains just one big file (the ISO file),
    it will not work. The ISO image actually contains all the files that would be
    on the CD, so if you put the CD in and find it contains many files, the CD was
    created properly.


    # System Requirements


    Make sure your computer meets the following minimum system requirements. If your
    computer doesn''t match most of these requirements, you may have problems when
    using the contents of the DVD-ROMs:


    +   - A PC with an Intel-capable Pentium-class processor: We recommend a 400 MHz
    Pentium IV or better for Graphical mode, although for a heavy-use desktop system,
    "more is better".


    +   - At least 256MB of RAM: You need at least 192MB of RAM for Graphical mode
    (Linux can handle as much RAM as you can fit into a typical computer, and more
    is almost always better than less).


    +   - At least 1GB of hard drive space: We recommend 10GB if you want to install
    all the software from the DVD. You need less space if you don''t install every
    program, but you should go ahead and make more than 10GB of space available, to
    give yourself more options and for file storage. Again, more is better.


    +   - A DVD-ROM drive — double-speed (2x) or faster: The faster the DVD-ROM drive,
    the faster your installation experience.'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# Appendix B: About the DVD


    +   - Just about any VGA monitor: Just about any monitor does the trick, but you
    want one that''s capable of displaying at least 256 colors or grayscale.


    +   - Some kind of network connection: Again, the faster the time it takes to
    update your installation to the most recent versions. See Chapter 9 on the various
    ways to connect to the Internet.


    If you need more information on PC basics, check out PCs For Dummies Dan Gookin
    (published by Wiley Publishing, Inc.).


    # Using the DVD-ROM


    The DVD-ROM included with this book is not bootable. To be able to include both
    Ubuntu and Fedora on the same DVD-ROM, we created two ISO LiveCD


    +   - ubuntu-9.04-desktop-i386.iso: The 32-bit Ubuntu 9.04 workstation LiveCD


    +   - Fedora-11-i386-DVD.iso: The 32-bit full Fedora 11 installation DVD-ROM


    You need a CD/DVD burner installed on your computer to create bootable Ubuntu
    CD-ROM or bootable Fedora DVD-ROM. Follow these steps to create the appropriate
    CD-ROM or DVD-ROM to use:


    +   1. Insert the DVD-ROM into your computer''s DVD-ROM player.


    +   2. Open the File Manager for your operating system (such as Windows Explorer
    for XP or Vista, Nautilus for the GNOME desktop, or Dolphin for the KDE desktop).


    +   3. Copy the appropriate ISO file from the DVD-ROM to your hard drive.


    You won''t be able to burn the image file directly from the DVD-ROM, if you have
    two DVD-ROM drives in your computer.


    +   4. Open a DVD-ROM creator program that supports burning ISO images.


    Some free CD burning software doesn''t support burning ISO images. For the Windows
    environment, one popular free package is the iso recorder package (http://isorecorder.alexfenman.com/isorecorder.htm).


    +   5. Select the option to burn a DVD-ROM (or CD-ROM for the Ubuntu LiveCD).'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# 422 Part VI: Appendixes


    Be careful that you don''t just copy the file to the CD-ROM or DVD-ROM. Make sure
    you select the option to burn an image.


    +   1. Insert a blank CD-ROM or DVD-ROM in your burner, and start the burn process.


    When you''re done, take a look at the files on the CD/DVD-ROM. It should contain
    several folders and files, not just the .iso image file.


    When you''re ready to install Linux, place the CD/DVD-ROM disk in the CD/DVD-ROM
    drive, and then reboot your computer. You may have to select either a BIOS option,
    or press a key during the system boot on your computer to enable booting from
    the CD/DVD-ROM drive.


    # If You''ve Got Problems (Of the DVD-ROM Kind)


    The DVD-ROM included with this book contains two ISO image files — one for the
    Ubuntu LiveCD, and one for the full Fedora installation DVD-ROM. When you place
    the DVD-ROM in your DVD-ROM, it should appear in your File Manager, and you should
    see the two files on it. You should be aware of a couple of issues before copying
    the files:


    +   **Disk space:** The full Fedora installation DVD-ROM image is quite large
    (it''s a complete DVD-ROM image). Make sure you have enough disk space (close
    to 4GB) on your hard drive before copying it.

    DVD-ROM speed:** If you have an older DVD-ROM drive, it may take a while to copy
    the ISO image files to your hard drive. Please be patient.


    If you still have trouble with the DVD-ROM, please call the Wiley Product Technical
    Support number at 1-877-762-2974. Outside the United States, call 1-317-572-3994.
    ... Wiley Publishing provides technical support only for installation and other
    general quality control items; for technical support on the applications themselves,
    consult the program''s vendor or author.


    To place additional orders or to request information about other Wiley products,
    please call 1-800-225-5945.'
