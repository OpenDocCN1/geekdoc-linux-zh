    Table A-2.


    | Table A-2 | Archiving and Compressing Tools |

    | Command | Purpose |

    | bzip2 | Compresses files into .bz2 format. Used mostly for incredibly large
    sets of text files (which is what source actually is). |

    | bunzip2 | Uncompresses .bz2 files. |'
