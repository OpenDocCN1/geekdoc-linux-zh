    # Working with Impress files


    The OpenOffice.org application doesn''t support as many file types as its Writer
    and Calc siblings. Mostly this is due to a lack of universally accepted standards
    in the presentation-graphics industry.


    The formats Impress supports are


    +   - OpenDocument Presentation (ODF) format: A standard presentation-graphics
    format proposed by OpenOffice.org.


    +   - OpenOffice.org 1.0 Presentation (OTP) format: The original OpenOffice.org
    presentation-graphics file format.


    +   - Microsoft PowerPoint 97/2000/XP (PPT) format: Possibly the most popular
    presentation-graphics tools used in business. You can use Impress to read and
    write PowerPoint slide presentations.


    +   - OpenOffice.org 1.0 Drawing (SXD) format: An older rudimentary-graphics format.


    +   - StarDraw 3.0 – 5.0 (SDA) format: Files created in Draw''s commercial cousin
    from Sun.


    +   - StarImpress 4.0 and 5.0 (SDD) format: Files created in Impress''s commercial
    cousin from Sun.


    +   - OpenOffice.org Drawing (ODG) format: Rudimentary graphics-drawing format.


    The current version of Impress doesn''t support the newer PowerPoint 2007 .pptx
    format. You can, however, use PowerPoint 2007 to convert the presentation into
    a .ppt file, which OpenOffice.org can read and modify.


    Although Impress can work with OpenOffice.org Draw, the default file format for
    Impress is the ODF format. As with the other packages in the OpenOffice.org suite,
    Impress also provides a toolbar icon you can use to save your slides as PDF files.'
