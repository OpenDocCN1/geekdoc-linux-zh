  md: '# Chapter 18: Basic System Administration


    ![](img/f493a327f3c2a812b2e84b22c874990c_352_0.png)


    Figure 18-6: The Group dialog box in the User Manager tool.


    # # Setting Up Printers


    Even though technology gurus keep predicting a paperless society, for now, we''re
    still stuck having to print things. In the past, printing was one of the dark
    areas in Linux. Trying to get modern printers working with Linux was quite the
    challenge. Over the last few years, however, some amazing have made Linux more
    printer-friendly.


    Possibly the biggest advance in printing has been the Common UNIX Printing System
    (CUPS). CUPS provides a common interface between UNIX (and Linux) systems and
    printers. It runs in the background as a service, connecting to any defined printers,
    and for applications to send print jobs. Because it runs in the background, it
    can talk to remote printers and accept print jobs from remote systems.


    The Printer Configuration tool provides an easy way to configure both the CUPS
    server on the system and any printers you''ve defined. Ubuntu and Fedora include
    the Printer Configuration tool to help you get a handle on your printing situation.


    Choose System:Administration:Printing from the desktop menu to start the Printer
    Configuration tool on the GNOME desktop for both Ubuntu and Fedora. In the KDE
    desktop, choose Administration:Printing. The main Printer Configuration window
    appears, as shown in Figure 18-7.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# 340 Part IV: Junior Administrator Boot Camp


    ![](img/f493a327f3c2a812b2e84b22c874990c_353_0.png)


    Figure 18-7: The Printer Configuration window.


    You can control two settings from the Printer Configuration window:


    +   - Server Settings: Use these to control how the CUPS server manages system
    printing features.


    +   - Local Printers: Here you can change individual printer properties of locally
    defined printers on the system.


    The main area displays icons for the local printers that you''ve configured (or
    that have been automatically detected by Linux). The New button on the toolbar
    provides two options for you:


    +   - New Printer: Starts a simple wizard to guide you through adding a new printer
    to the system.


    +   - New Class: Starts another wizard that guides you through grouping printers
    together to form a printer pool (called a print class in CUPS). Sending print
    jobs to a print class enables the job to be printed by any available printer in
    the class.


    If you already have a printer defined in your system, right-click on the printer
    icon to access these features:


    +   - Properties: Allows you to set features for the printer.


    +   - Rename: Changes the system name of the printer.


    +   - Copy: Copies an existing local printer definition to create another printer
    of the same make and model.


    +   - Delete: Deletes an existing printer.


    +   - Enabled: Allows print jobs to be serviced by the printer when checked.


    +   - Shared: When checked, this advertises the printer on the network for other
    Linux workstations using CUPS to connect to.


    +   - View Print Queue: Lists the print jobs waiting to be printed by the printer.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Chapter 18: Basic System Administration


    The following sections describe how to use the Printer Configuration window

    to set the CUPS and printer properties for your system.


    # ## Printer server settings


    Choose Server:Settings to get to the Basic Server Settings window, shown in

    Figure 18-8.


    ![](img/f493a327f3c2a812b2e84b22c874990c_354_0.png)


    There are a few settings you can use with here to help out with

    your printer administration:


    +   - Show Printers Shared by Other Systems: Displays printers found by

    browsing the network.


    +   - Publish Shared Printers Connected to This System: Allows remote

    clients to connect to any of the local printers marked as (more

    on that later).


    +   - Allow Remote Administration: Enables clients to connect to the

    CUPS server running on this.


    +   - Allow Users to Cancel Any Job (Not Just Their Own): By default,

    normal users can only cancel their own print jobs. Enabling this fea-

    tures you to cancel any other user''s print job. Although this

    feature is handy, it can get dangerous in a huge multiuser environment

    (especially if your users like playing tricks on one another).


    +   - Save Debugging Information for Troubleshooting: By default, the CUPS

    server generates a moderate amount of logging information to monitor

    usage or problems. If you''re having trouble with a specific printer con-

    figuration, you can enable this feature to produce more (lots more)

    information in the log files.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Part IV: Junior Administrator Boot Camp


    After determining the settings appropriate for CUPS server environment, you can
    move on to creating the individual local printer accounts.


    # Adding a new printer


    One amazing feature of Fedora and Ubuntu is their automatic detection of printers
    connected via USB and parallel port cables. If you have one of these printers,
    you most likely don''t need to add it to the system. It is automatically listed
    under the Local Printers listing. You can just move to the next section to configure
    it.


    If you''re not fortunate to have a USB-connected printer, you have to add your
    printer manually. Here are the steps for doing that:


    +   1. Click the New Printer button on the toolbar.


    The New Printer Wizard appears, as shown in Figure 18-9.


    ![](img/f493a327f3c2a812b2e84b22c874990c_355_0.png)


    > Figure 18-9:

    The New Printer Wizard in the Configuration tool.


    +   2. Select the connection type of the new printer.


    Although the printer is defined as a local printer, this utility allows you to
    configure the types of printer connections listed in Table 18-1 to make a printer
    available to the system.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# # Chapter 18: Basic System Administration 343


    | Table 18-1 Fedora Printer Connection Types |

    | Connection Type | Description |

    |---|-|

    | LPT#1 | A printer connected via the 25-pin LPT port on the local computer. |

    | Serial Port #1 | A printer connected via a 9- or 25-pin serial port on the local
    computer.. |

    | AppSocket/HP JetDirect | A printer connected directly to the network, using
    a network card and Internet software. |

    | HP Printer (HPLIP) | A network printer using the proprietary HP network protocol.
    |

    | Internet Printing Protocol (IPP) | A remote CUPS server, advertising local printers
    that can be used remotely. |

    | LPD/LPr Host or Printer | An older UNIX standard for sharing local printers
    remotely. |

    | Windows Printer via Samba | A Microsoft Windows workstation or server that advertises
    shared local printers. |

    | Other | A specific Universal Resource Identifier (URI) used to map to a network
    printer. |


    As you select each connection type in the left of the window, different Properties
    area appear in the right side. For example, if you select the Windows Printer
    via Samba connections, text boxes appear in which you can enter the printer name,
    along with a User ID and the password to access the network printer.


    3. Change any Properties settings, and then click Forward to continue with the
    wizard.


    4. Select the printer manufacturer or the location of the PPD file. Click Forward
    when you''ve done.


    CUPS uses Postscript Printer Description (PPD) files to handle formatting printing
    for printers. These use the same concept as the standard printer drivers for Microsoft
    Windows that you are probably used to. Each printer must have a PPD installed
    for CUPS to know how to format text and graphics sent to the printer.


    This wizard allows you to select the PPD file for use of the new printer. You
    have three choices:


    +   * Select the printer manufacturer from the list of installed drivers.

    * Select to install your own provided PPD file for the printer.

    * Search the Internet for a PPD file to download.'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# 344 Part IV: Junior Administrator Boot Camp


    If you''re lucky enough to have the PPD file for your printer, copy it to a location
    on your Linux system and then select the Provide PPD file option. Browse to the
    location of the file and select it.


    If you don''t have the PPD file for your printer, you can try to search the standard
    repositories for one. If you find the printer manufacturer listed, select it.


    +   5. If you selected a printer manufacturer, the next wizard window provides
    a list of specific printer models and PPD files. Select the printer model and
    (optionally) the proper PPD file. Click Forward when you''re done.


    This wizard asks you to select the specific model type for your printer. Hopefully
    your printer is listed. If not, you must go back a step and find your PPD file
    to install.


    If your specific model is listed, select it, and a list of available PPD files
    are shown. Some models may have only one PPD file, but others may have two or
    more files to choose from. In case, one is usually marked as recommended. Try
    that first: If it doesn''t work, select a different PPD file.


    +   6. Create a unique name for the printer, and (optionally) enter a description
    and location. Click Apply on the summary window to create the new printer account.


    The new printer is added to the list of local printers (even if mapped to a remote
    printer). You now see the new printer when printing from applications on your
    system.


    # Modifying printer properties


    You can modify the properties of any printer on the system (whether Linux created
    it automatically or you created it manually). Right-click the printer you want
    to configure in the window, and then select Properties from the menu. The Printer
    Properties window appears, as shown in Figure 18-10.


    There are five areas that contain printer information you can modify. These areas
    are Settings, Policies, Access Control, Printer Options, and Job Options. In the
    next few sections, we take a closer look at each.


    ![](img/f493a327f3c2a812b2e84b22c874990c_357_0.png)


    If you make any changes in the Printer Properties dialog box, don''t forget to
    click either Apply or OK to make the changes permanent.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Chapter 18: Basic System Administration


    ![](img/f493a327f3c2a812b2e84b22c874990c_358_0.png)


    Figure 18-10: Modifying printer properties in the Printer Configuration.


    # Settings


    The Settings area provides some basic settings you can change for the printer.
    From here, you can change the description and location tags for the printer, the
    URI of the printer, and the PPD file used for the printer.


    Under the settings are three buttons to help you test and maintain the printer:
    Print Test Page, Print Self-Test Page, and Clean Print Heads.


    # Policies


    The Policies area contains three check boxes, plus four policies (or rules) that
    control printer behavior. The three check boxes enable you to control the state
    of the printer:


    +   * **Enabled**: Allows you to take the printer offline if there''s a problem.

    * **Accepting Jobs**: Allows you to suspend the processing of print jobs temporarily.

    * **Shared**: Allows you to set whether this printer is a shared resource on the
    network.


    Two of the policies control banner pages for print jobs; the other control how
    the printer operates:


    +   * **Banner** pages allows you to print a special page describing the print
    job.

    * **The Starting Banner** is a special page that prints before the print job begins;
    this option allows you to print a cover for your print job. Theoretically it''s
    supposed to provide some privacy, blocking people from seeing the first page of
    the job as the printer prints it, but really, who wouldn''t just look under the
    banner page?'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 346 Part IV: Junior Administrator Boot Camp


    +   The Ending Banner allows you to print an end page marking the end of the print
    job. If you''re in a high-print-volume environment where lots of print jobs are
    pouring out of the printer, having a starting or ending banner helps keep everyone''s
    print separate.


    There are two operation policies that you can set:


    +   Error Policy: Determines how the printer reacts to an error in the printing
    process. The choices are Abort Print Job (giving up all hope of printing the job),
    Retry the Print Job (possibly trying again after manual intervention), and Stop
    the Printer (preventing all other print jobs from printing).


    +   Operation Policy: Determines the mode the printer runs in. At this time, the
    only setting for this option is the default.


    # Access Control


    The Access Control area provides a method you can use to restrict access to the
    printer. There are two ways to do this:


    +   You can list every user account that the server will prevent from using the
    printer. This assumes that any user account not on the list can print, and any
    user account on the list can''t print.


    +   You can list the user accounts that are allowed to use the printer. This assumes
    that any user account that isn''t on the list can''t print.


    Obviously, which of these you choose depends on whether you want to allow or restrict
    more people from printing.


    # Printer Options


    The Printer Options allow you to set some properties for the physical printer
    setup. The properties available for you to modify are based on information provided
    by the individual printer''s PPD file and depend on the physical characteristics
    of the printer.


    These properties are divided into separate categories, depending on the printer''s
    capabilities. The options available for a printer are shown in Figure 18-11.


    The General settings handle properties such as what types of the printer can handle,
    the print qualities it can produce, and the number and types of input trays. You
