  md: '# 266 Part III: Getting Done


    # Checking your plugins


    Plugins are the key to displaying Web video content in Firefox. As discussed in
    Chapter 9, plugins provide additional functionality to the Firefox browser.


    You can check to see what plugins are already installed in your Firefox setup
    by following these steps:


    +   1. Open Firefox by choosing Applications-Internet-Firefox Web Browser.

    nYou can also start Firefox by clicking the Globe on the top panel of GNOME desktop.

    2. Choose Tools-Add-ons; then in the Add-ons dialog box, click the Plugins icon.

    The Plugins tab displays information about the current plugins installed, as shown
    in Figure 14-1.


