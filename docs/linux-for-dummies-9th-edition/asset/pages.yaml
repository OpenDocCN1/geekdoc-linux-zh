  md: '# 54 Part I: Getting Your Feet Wet


    # # Installing Fedora


    When you install from a full core Linux distribution, you''re in for quite a surprise.


    You have a lot of choices to control just what software installation process installs.


    This section walks you through the graphical Fedora installation process. If you
    can''t use the graphical installer for some reason (if Linux doesn''t support
    your video card, for example), follow the text-based installation instead. The
    steps are the same, it''s not as pretty, and you don''t get all the options that
    are available in the point-and-click version.


    The graphical interface is designed to work with a mouse to select options. If
    you don''t have a mouse, you can use the keyboard to navigate around the screens.
    In most cases, the Tab key or the arrow keys advance you to the next option, the
    spacebar toggles options off and on, and the Enter key accepts the choices and
    moves to the next screen. In most screens, if you want to change a previous setting,
    a Back button is available to navigate to earlier screens. If you want more information
    about the installation process, click the Release Notes at any time.


    ![](img/f493a327f3c2a812b2e84b22c874990c_67_0.png)


    If you''re using the Fedora 11 full installation DVD image that came with this
    book, use an image-burning software package to create the installation DVD. The
    free isrecordorder package can also burn DVD images. After you have the Fedora
    11 installation DVD, follow these steps:


    +   1. Place the DVD in your DVD-ROM drive and reboot your system.


    A number of boot options appear, as shown in Figure 3-6. Here''s a run-down of
    each one:


    +   - Install or Upgrade an Existing System: The first (default) option in the
    graphical interface is for installing Fedora for the first time or for upgrading
    an existing version of Fedora Linux.

    - Install System with Basic Video Driver: This option allows you to use a generic
    video driver if Fedora can''t properly detect the video card used in your system.

    - Rescue Installed: This option is actually not used for installing Linux. Use
    it to boot into rescue mode if there''s something wrong. (See Chapter 4 for more
    on rescue mode).

    - Boot from Local Drive: This is also not an installation option. Selecting this
    menu item lets you boot from a hard drive in case your boot menu breaks after
    installation.'
