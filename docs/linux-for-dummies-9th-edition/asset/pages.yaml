  md: '# # Chapter 11


    # # Putting the X in Text


    +   **In This Chapter**

    - Working with text files in gedit

    - Editing in KWrite


    From text editors to word processors, Linux offers a wide variety of options for
    working with words. In this chapter, we take a look at different ways to view
    the contents of a text file, using some simple text editors in the GUI environments.
    In Chapter 12, we take a look at office suites for those who would rather word
    processing.


    # # Going with gedit


    Lots of graphical options are available. In this section, we cover gedit (see
    Figure 11-1), which is the default GUI text editor for the GNOME desktop. To start
    gedit, choose Applications‣Accessories‣Text Editor from the panel in either Ubuntu
    or Fedora.


    ![](img/f493a327f3c2a812b2e84b22c874990c_214_0.png)


    gedit is strictly a text editor; use it to generate raw text, whereas a word processor
    creates marked-up text that can be opened only by programs that can read word
    processor''s file formatting. If you want to add bold, italics, underlines, or
    any other special features to your document, proceed to Chapter 12.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 202 Part III: Getting Things Done


    ![](img/f493a327f3c2a812b2e84b22c874990c_215_0.png)


    Figure 11-1:

    Gedit window in Ubuntu, showing a blank file.


    # # Entering and editing text in gedit


    To enter text in gedit, just click in the big white space and start typing. You
    have access to the standard collection of editing tools, such as cut, paste, and
