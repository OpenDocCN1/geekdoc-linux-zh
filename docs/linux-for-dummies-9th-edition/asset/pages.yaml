    > — Yogi Berra


    ne of the most important decisions you have to make when installing Linux is one
    that you make before you actually install Linux — that is, how you want to install
    it. That''s right; it''s not as easy as just tucking Linux onto your computer''s
    hard drive and calling it a day. You can install Linux in many different ways;
    which one you pick entirely on your situation. But don''t worry, with this chapter,
    you''ll breeze through that decision.


    Then, after you''ve made that important decision, we cover any preparation you
    have to do for that particular installation.


    # Choosing the Right Installation Approach


    In this section, we give you a road map that tells you what''s important for your
    particular situation. To install Linux permanently on an existing computer, you
    will need to have an area of hard drive already set up for it. There are three
    common ways to do this:


    +   - Replace an existing operating system on the hard drive.

    - Install Linux on a second hard drive.

    - Partition an existing hard drive to include Linux.'
