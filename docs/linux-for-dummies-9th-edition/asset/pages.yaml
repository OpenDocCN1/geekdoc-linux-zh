- img_proc: true
  md: "# 142 Part II: Getting Up to Speed with Linux\n\n+   - E-mail outbound host\
    \ or Simple Mail Transport Protocol (SMTP) server for routing outbound e-mail\
    \ messages\n- E-mail inbound host or Post Office Protocol (POP) server for receiving\
    \ incoming e-mail messages\n- News host\n- Whether your computer address will\
    \ be one of these two types:\n  - Static: You have the same IP address. Static\
    \ addresses are more common for servers than for desktops. If you're using static,\
    \ your ISP needs to give you a few pieces of information. You must define a nameserver\
    \ IP address (which resolves hostnames into IP addresses), a gateway address (which\
    \ routes your connection through the ISP), and a network address and netmask combination\
    \ (which define what addresses are local to your workstation). All this information\
    \ should be on the customer information sheet.\n  - Dynamic: Your IP address changes\
    \ each time you connect, or at regular intervals. On most desktops, you just don't\
    \ need to have the same address, and it makes life easier on ISPs. It also makes\
    \ life easier for computers like laptops, which get moved around often from network\
    \ to network. If you're using dynamic addressing, you're told that you need to\
    \ connect using DHCP.\n\nWith this information, you can establish an Internet\
    \ connection using your Linux system.\n\n# Configuring Your Connection\n\nOkay,\
    \ so you have your network hardware and your ISP information — now what? The answer\
    \ is to configure your Fedora system to jump on the Internet!\n\nThe configuration\
    \ process varies slightly, depending on the hardware you are using. This section\
    \ covers the three best methods for accessing the Internet:\n\n+   - Using a modem\
