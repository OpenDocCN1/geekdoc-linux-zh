    - Settings: Configure the way the editor handles text.

    - Help: Get information about the editor and commands.


    The Edit menu provides all your text-editing needs. Instead of remembering cryptic
    commands (which by the way, KWrite also supports), you can select items from the
    Edit menu, as shown in Table 11-1.


    | Table 11-1 The KWrite Edit Menu |

    | Item | What It Does |

    | Undo | Reverses the last undo action. |

    | Redo | Reverses the last action. |

    | Cut | Deletes the selected text and places it in the Clipboard. |

    | Copy | Copies the selected text to the Clipboard. |

    | Paste | Inserts the current contents of the Clipboard at the current cursor
    position. |

    | Select All | Selects all text in the editor. |

    | Deselect | Deselects any text that is currently selected. |

    | Overwrite Mode | Toggles insert mode into overwrite mode, replacing text with
    new typed text instead of inserting the new text. |

    | Find | Produces the Find dialog box, which allows you to customize a text search.
    |

    | Find Next | Repeats the last find operation farther forward in the buffer area.
    |

    | Find Previous | Repeats the last find operation farther backward in the buffer
    area. |'
