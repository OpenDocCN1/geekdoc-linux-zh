    # Viewing Movie Files with Totem


    With the popularity of DVRs (digital video recorders), it''s not uncommon to receive
    a video clip of your niece''s ballet recital in an e-message, or some other treasure
    from a file-sharing site. These files are often stored in a variety of video formats:


    +   - AVI: Audio Visual Interleave format, a standard video format supported by
    most video packages.

    - DivX: A proprietary video-compression format that must be licensed to work in
    Linux.

    - MPG: Moving Pictures Experts Group (MPEG) standard format. This includes both
    MPEG and MPG formats.

    - WMV: Windows Media Video format, a proprietary Microsoft format.

    - RM: The RealNetworks proprietary video format that requires the RealOne video
    player.

    - MOV (and QT): The proprietary Apple QuickTime video formats.


    The default video-viewer in both Fedora and Ubuntu is Totem. You can start Totem
    by double-clicking a saved video file or by launching the viewer from the panel
    menu (Choices:Sound:Video:Movie Player in the GNOME menu, or choose Applications:Multimedia:Movie
    Player in the KDE menu).


    As with the Firefox plugins, licensing restrictions limit the types of files that
    the default installation can play. You can obtain the complete version of Totem,
    which supports more file types, by uninstalling Totem and then installing the
    original software package downloaded from the Totem Web page (http://projects.gnome.org/totem).
    Just follow the installation steps in Chapter 16 to install new software in Fedora
    or Ubuntu.


    When you start Totem, the main viewing window appears, as shown in Figure 14-4.'
