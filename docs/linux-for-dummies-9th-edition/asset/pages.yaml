  md: '# 10 Part I: Getting Your Feet Wet


    Don''t scratch your head hard; these concepts are tough to grasp initially, especially
    when you consider the conditioning you''ve received from the commercial software
    industry’s marketing departments. Perhaps you don''t know that when you purchase
    proprietary, shrink-wrapped software, you don''t actually own the software. Rather,
    you''re granted permission to use the software within a license dictated by the
    licensor.


    Linux also has a license. However, the motives and purpose of the license are
    different from those of most commercial software. Instead of using a license to
    restrict use of the software, the GNU Public License (GPL) that Linux uses ensures
    that the software will always be open to anyone. No company can ever own or dictate
    the way in which you use or modify Linux—although they can have their own copyrights
    and trademarks on their various brands of it, such as Red Hat and Novell. In essence,
    you already own Linux, and you can use it for anything you like, as long as you
    propagate the GPL freedoms to any further recipients of the software.


    # Linux: Revolution or Just Another Operating System?


    Before going any further into Linux, we need to get some terminology out of the
    way.


    An operating system is the software that runs your computer, handling all interactions
    between you and the hardware. Whether you''re writing a letter, calculating a
    budget, or managing your recipes on your computer, the operating system provides
    the essential air that your computer breathes. Furthermore, an operating system
    isn''t just one program; it consists of hundreds of programs and utilities that
    allow humans to use a computer to do something useful. You then run other programs
    (such as your word processor) on top of the operating system to get everything
    done.


    Linux has been accused of being "just another operating system." On the surface,
    it may appear, but if you look deeper, you can see that this isn''t so. The Linux
    project is a flagship leading the current trend toward open-source and free (as
    in "freedom," not "free beer") software within the computing industry. A rock-solid
    operating system because of the model under which it was (and continues to be)
    developed, Linux represents much that is good in software development.'
  merge: -1
