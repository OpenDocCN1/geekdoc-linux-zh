  md: '# # Chapter 10


    # # E-Mailing the World


    In This Chapter


    +   - Examining Evolution

    - Working with KMail


    Your mailbox is your window to your heart! Make sure you leave that window open!


    > Takayaki Ikkaku, Arisa Hosaka, and Toshihiro Kawabata


    Although many people think of the Web when they think of the Internet, e-mail
    may, in fact, be the most used and beloved of all Internet applications. Most
    Linux distributions install at least one e-mail application by default, and which
    one it depends on the default desktop you are using (see Chapter 1). Of course,
    with Linux you''re always free to install a different e-mail program to use if
    you find one you like better!


    This chapter provides an overview of the three most popular e-mail packages used
    in Linux these days. Hopefully you will find one that fits your needs.


    # # Looking Before You Leap


    Before you start hacking at trying to set up your e-mail package, you''ll need
    to grab some information about the Internet service provider (ISP) that supports
    your e-mail address. You should be able to obtain most of this information either
    from the information you received from your ISP with your e-mail account or by
    calling the Help Desk at your ISP and asking a few simple questions.


    The items you''ll need to have before you start are


    +   - Your e-mail address: This should be assigned by your ISP, with a format
    such as me@myhost.com. You''ll need remember to enter this in your e-mail package
    exactly as it appears in your e-mail or people won''t be able to respond to your
    messages!'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 184 Part III: Getting Things Done


    +   The type of e-mail server ISP uses for incoming mail: There are several different
    methods used by ISP e-mail servers to communicate with e-mail clients. The two
    most popular are POP (is called POP3 to refer to the version) and IMAP.


    +   The difference between these two protocols is POP usually requires you to
    download all your incoming messages from the ISP server to your local workstation.
    After they''re downloaded to your PC, the ISP deletes them from the server.


    +   IMAP allows you to store folders all your messages on the server. IMAP servers
    usually allow you a specific amount of storage space on the server, keep an eye
    on how much mail you accumulate.


    +   The hostname or IP address of your ISP incoming mail server: ISP should provide
    a hostname or IP address, such as pop.isp.com, for you to connect in order to
    receive your mail.


    +   The type of e-mail server ISP uses for outbound mail: Sending outbound e-mail
    requires a different protocol from the one used to retrieve inbound e-mail. Most
    ISP e-mail use SMTP for sending e-mail to clients.


    +   The hostname or IP address of your ISP outbound mail server: Some ISPs use
    separate servers for outbound and inbound mail. Check with your ISP for the outbound''s
    hostname (such as smtp.isp.com).


    +   Any special ports or passwords needed for authentication in an encrypted session:
    Nowadays many ISPs require that you log in to establish encrypted connection for
    both inbound and outbound e-mails. This isn''t a requirement on your ISP''s server,
    you should still consider using it if your ISP supports it.


    When you have all that information in hand, you''re ready to configure your e-mail
    package.


    # Evolving into E-Mail: Evolution


    If you''re using the GNOME desktop, the default e-mail package is called Evolution.
    Evolution should remind you very much of Outlook. If you like being able to integrate
    your calendar, address book, task manager, and e-mail, you should feel right at
    home with Evolution.


    This section walks you through the steps of getting Evolution talking with your
    ISP.'
  merge: -1
  pgno: 197
- img_proc: true
