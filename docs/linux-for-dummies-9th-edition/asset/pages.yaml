  md: '# Chapter 12: Word Processing and More with OpenOffice 245


    3. Select a formula component within this submenu.


    We choose matrix [..] as an example. Immediately, the code that''s needed to add
    a matrix to a formula appears in the Commands window. A moment later, the matrix
    appears in the document window. The combination is shown in Figure 12-12.


    ![](img/f493a327f3c2a812b2e84b22c874990c_258_0.png)


