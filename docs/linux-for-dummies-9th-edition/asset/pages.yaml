    your Linux system. Software is bundled in two formats in Linux distributions:


    +   * Applications: Software that contains multiple components, such as the OpenOffice.org
    package or software development platforms, can be installed as a complete application.


    +   * Packages: Individual software programs that aren''t part of a larger application,
    such as The GIMP (see Chapter 14), can be bundled in a package that just installs
    the one program by itself.'
