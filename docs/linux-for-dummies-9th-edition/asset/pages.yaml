    | Red Hat | www.redhat.com | A commercial business distribution used mainly for
    Internet servers. |

    | Fedora | www.fedoraproject.org | A spinoff from Red Hat, designed for home use.
    |

    | Gentoo | www.gentoo.org | A distribution designed for advanced Linux users,
