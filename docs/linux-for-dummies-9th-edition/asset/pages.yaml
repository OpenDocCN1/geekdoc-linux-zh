  md: '# Part II: Getting Up to Speed with Linux


    Understanding more than just names and value types, you''ll want a long-format
    file listing.


    To see just non-hidden files, type ls -l. To see both hidden and non-hidden files,
    type ls -la. Figure 6-3 shows a sample.


    ![](img/f493a327f3c2a812b2e84b22c874990c_127_0.png)


    You may find some parts of this format easier to understand at a glance than others:


    +   - The first item in each listing (the part with the letters and dashes — for
    example, drwxr-xr-x in the first line) is the permission set assigned to the item.
    Permissions define who can read the file, change it, or run it''s a program. You
    can read more about permissions in “A permissions primer,” later in this chapter.

    - The second item in the first line (in this case, 30) is the number of hard links
    to the item.

    - The third item (rich) is the file''s owner.

    - The fourth (rich) is the group it belongs to.


    Depending on which version of Linux you''re using, both the third and fourth items
    may be identical. You can find out more about these in “A permissions primer,”
    later in this chapter.


    ![](img/f493a327f3c2a812b2e84b22c874990c_127_1.png)'
  merge: -1
