  md: '# Chapter 3: Installing Linux


    Choosing a default language doesn''t necessarily mean that all applications running
    on the system will use that language. Each individual application may or not detect
    the default language configured in Ubuntu.


    The second window in the installation process allows you to select the time zone
    for your area.


    +   4. Select a time zone and then click Forward.


    This window allows you to select your location either with the map or the drop-down
    menu. Although selecting the time zone from the graphical maps sounds like a good
    idea, it can often be a challenge, depending on how many cities Ubuntu recognizes
    around your particular city.


    Next in the installation process is identifying the keyboard you will use with
    the Ubuntu system. While this may sound like a simple option, it can get complicated
    if you have a keyboard that includes special keys. Ubuntu recognizes hundreds
    of different keyboard types, and it lists all them in the keyboard selection window.


    +   5. Select a keyboard, then click Forward.


    The keyboard configuration window lists the different types of keyboards commonly
    used based on your country. Ubuntu provides a suggested option for you based on
    what it detects as your keyboard. This may or may not be. If you want to fine-tune
    things, the lower portion of the window allows you to experiment. On the left
    side is a list of countries; on the right side is a list of the different known
    keyboard types used in the country selected. Select your keyboard from the left-side
    list first: select your keyboard type from the right-side list.


    You can click in the right-side list and start to type the name of your keyboard
    type to jump quickly to that selection.


    Under the two listings is an area where you can test the keyboard selection. Just
    type any special or unique characters available on your keyboard to see whether
    the setting you selected produces the proper characters.


    The next step in the installation is possibly the most important, and the most
    complicated. You tell the Ubuntu installer exactly where to place the Ubuntu operating
    system on your system. One bad move here can ruin your day.


    The exact partition window you get during the installation depends on your hard
    drive''s configuration. If you went through the steps in Chapter 2, you should
    be all set for this step. Figure 3-2 shows an example of what the partition window
    looks like.


    +   6. Select a disk setup method and then click Forward.'
