  md: '# Chapter 5


    # Examining the KDE Desktop


    In This Chapter


    +   - Walking through KDE

    - Setting up your workspace


    > A bus station is where a bus stops.

    A train station is where a train stops.

    On my desk, I have a workstation . . . .

    — Steven Wright


    In Chapter 4 you get to see how the GNOME desktop works, this chapter discusses
    the other popular desktop in the Linux world — KDE. The KDE desktop environment
    provides a graphical interface to your Linux distribution using features commonly
    found in Windows systems. It is available as a software package in Fedora and
    Ubuntu, and is the main desktop used in Kubuntu, a Linux distribution based on
    Ubuntu, but focused on the KDE desktop. This chapter walks through the KDE features,
    showing how you can work your way around the KDE and get the most from your workspace.


    ![](img/f493a327f3c2a812b2e84b22c874990c_100_0.png)


    # The KDE Desktop Basics


    KDE desktop was first released in 1996 as the Kool Desktop Environment, but these
    days it tries to be a little more sophisticated and prefers to be just the K Environment
    (but it''s still pretty cool). It quickly became popular among Linux beginners
    because it provides a Windows-like interface for your Linux desktop. Figure 5-1
    shows the KDE desktop used in Fedora.'
  merge: -1
