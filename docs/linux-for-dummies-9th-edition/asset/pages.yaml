  md: '# Working with KMail


    Linux distributions that use the KDE desktop often provide the KMail application
    for e-mail access. KMail is another all-in-one package like Evolution — it provides
    an e-mail client, calendar, and task scheduler all in one window.


    This section walks through the steps you''ll need to take to get your KMail software
    working with your ISP, and then shows you how to send and receive e-mail.


    # Setting up KMail


    You can usually find the KMail application by choosing Applications:Internet:KMail
    (see Chapter 5). The first time you start KMail you''re greeted by the KMail Welcome
    Wizard, shown in Figure 10-8.


    ![](img/f493a327f3c2a812b2e84b22c874990c_206_0.png)


    Figure 10-8: The KMail Welcome Wizard to set up your mail.


    Just click the Next button to get the configuration process started. Before you
    start sending and receiving e-mail, however, you''ll need to tell KMail how to
    interact with your ISP e-mail server. The monolithic Evolution Setup Wizard, KMail''s
    wizard is a little more compact:


    +   - Select your type of ISP e-mail server, and click Next.


    The account type identifies the type of server you''re connecting with to get
    your e-mail. Figure 10-9 shows the options you have available. The most common
    are POP3 and IMAP. KMail also allows you to connect to a mailbox on your workstation,
    which is somewhat silly unless you''re sharing your workstation with others (or
    you just like sending yourself messages).'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# 194 Part III: Getting Things Done


    ![](img/f493a327f3c2a812b2e84b22c874990c_207_0.png)


    Figure 10-9: The KMail Account screen.


    # 2. Enter your account information, and click Next.


    The Account Information screen appears and asks for your real name, your e-mail
    address, and an option organization name as they will appear in your outgoing
    e-mail messages (see Figure 10-10). Be careful entering your e-mail address, as
    that''s what others will reply to.


    ![](img/f493a327f3c2a812b2e84b22c874990c_207_1.png)


    Figure 10-10: The KMail Account screen.


    # 3. Enter your ISP login information, and click Next.


    Some ISPs assign separate user IDs and passwords for connecting to the e-mail
    server, while others use your e-mail address. Enter whichever your ISP uses.


    # 4. Enter your ISP server information, and click Next.


    The Server Information screen asks for both the incoming and outgoing server names
    for your ISP account (shown in Figure 10-11). The incoming server is the name
    of your POP3 or IMAP server. The outgoing server is the name of your SMTP server.
    (Unfortunately, you can''t configure any advanced settings, such as SSL, here.
    If your ISP server requires those, you''ll need to set them up, as explained later.)'
