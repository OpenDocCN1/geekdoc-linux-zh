    +   4. Select a hard-drive emulation file for the virtual server.


    VirtualBox emulates a hard drive by creating a large file on the host system.
    The amount of disk space you select for this virtual hard drive is created inside
    the file, so it can''t larger than the disk space available on the host system.
    We assume that you don''t have a virtual disk laying around and that you need
    to create one.


    +   5. To create a bootable hard drive for the virtual server to boot from, ensure
    that the Boot Hard Drive check box is selected, and then click the New button
