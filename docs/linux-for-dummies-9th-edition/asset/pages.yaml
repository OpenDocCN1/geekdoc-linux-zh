  md: '# Chapter 18


    # Basic System Administration


    In This Chapter


    +   - Managing users

    - Playing with printers

    - Watching programs


    > After one look at this planet any visitor from outer space would say “I want
    to see the manager.”


    > — William S Burroughs


    Okay, so you have your Linux system running exactly the way you want it, with
    just the right combination of software packages installed. You''re writing documents,
    creating fancy graphics, listening to music CDs, and even playing games. But don''t
    sit back and relax: There''s still left to do.


    You''ll always need to tweak things on your system — whether you''re allowing
    other people to use it, installing a new printer, or trying to figure out why
    a software program is running so slow (yes, even Linux programs can go bad sometimes).
    Keeping everything in order and running properly can be a full job. For a home
    Linux system, you may need to manage several user accounts and printers, as well
    as keep track of outer a dozen programs running on the system.


    Linux provides a few tools that help in the management process. No doubt you''ve
    seen the Administration section in the menu area on your desktop (see Chapters
    4 and 5). Some of the items are fairly self-explanatory, as Date and Time settings,
    Display settings, Keyboard settings, and the Language setting. However, other
    items aren''t quite easy to figure out how to use. This chapter walks through
    a few of the administration tools Ubuntu and Fedora provide to help make running
    your system a little easier.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# 332 Part IV: Junior Administrator Boot Camp


    # Managing Users and Groups


    Whether you support a Linux system with hundreds of users or you just have a user
    account for you and for your cat, you need to know how to manage user accounts.
    Most Linux distributions include some graphical tool to help you manage your user
    accounts.


    There are a few different user-management tools floating around the Linux world,
    but they all pretty much the same way. Instead of trying to confuse the issue
    and describe different tools, we take you guided tour of how the Fedora User Manager
    operates. That should give you an idea of how to deal with user accounts using
    whatever tool your Linux distribution.


    If you use the User Manager tool in you should be aware of: By default, it only
    allows you to edit your user account properties. To modify other user accounts
    or create new user accounts, you have to click the Unlock button to utter the
    entire interface.


    Choose SystemAdministration>Users and Groups from the GNOME desktop to start the
    User Manager tool in Fedora. If you aren''t already logged in as the root user,
    enter the root user''s password. The main User Manager window appears, as shown
    in Figure 18-1.


    The main window contains two tabbed panes — one for managing users and the other
    for managing user groups — plus several buttons in the toolbar.


    ![](img/f493a327f3c2a812b2e84b22c874990c_345_0.png)


    Figure 18-1: The Fedora User Manager tool.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Chapter 18: Basic System Administration 333


    The menu bar provides access to the same features available on the toolbar, plus
    one additional feature: preferences. Choose Edit::Preferences to open the Preferences
    dialog box, as shown in Figure 18-2.


    ![](img/f493a327f3c2a812b2e84b22c874990c_346_0.png)


    Figure 18-2: The User Manager Preferences dialog box.


    This dialog box contains settings that control the behavior of the User Manager
    itself:


    +   **Hide System Users and Groups:** The Fedora system requires a lot of administrative
    usernames to control background system programs. Messing with these user and group
    accounts isn''t recommended, so hiding them cleans up the user''s viewing area,
    and also prevents accidents from happening (such as deleting an important system
    user account).


    +   **Automatically Assigned UID Must Be Highest:** Fedora assigns each user account
    a unique User ID number (UID). The User Manager is more than happy to assign UIDs
    automatically to new users, or you can choose to assign your own UID manually.
    This setting ensures that if the User Manager assigns UIDs, the numbers are in
    order after the UIDs for any accounts you''ve already created. It''s safe to keep
    this value unset until you''re doing your own UID assignment.


    +   **Automatically Assigned GID Must Be Highest:** Fedora also assigns each group
    a unique Group ID number (GID). This setting ensures that all automatically assigned
    group numbers are in order at the end of the list. Again, it''s okay to keep this
    setting enabled.


    +   **Prefer that Private GID Is the Same as UID:** This feature ensures that
    each user account''s UID is the same number as the assigned Group ID. This helps
    simplify user management by ensuring that each user account belongs to its own
    group with the same number.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 334 Part IV: Junior Administrator Boot Camp


    After you have set your preferences for the User Manager tool, you’re ready to
    actually start managing users and groups.


    # Adding new users


    When you first installed Fedora, it created a user account for you. That account
    has its own home folder for storing files. If you are in an environment where
    others will use the same system, it’s a good idea to create separate user accounts
    for each user. That way you don’t have to worry about the cat accidentally deleting
    your important documents.


    If you need to add additional user accounts, here’s what you need to do:


    +   1. Click the Add User button.


    The Create User dialog box opens, as shown in Figure 18-3.


    ![](img/f493a327f3c2a812b2e84b22c874990c_347_0.png)


    > Figure 18-3: The New User dialog box in the User Manager tool.


    +   2. Type a username for the user in the User Name text box. Type the full name
    of the user for documentation purposes in the Full Name text box.


    +   3. Type a password for the user in the Password text box, and then retype
    it in the Confirm Password text box.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Chapter 18: Basic System Administration


    ![](img/f493a327f3c2a812b2e84b22c874990c_348_0.png)


    For security, you should always use passwords that aren’t common words, that contain
    a mixture of numbers and upper- and lowercase letters, and are a minimum of eight
    characters long.


    +   4. Select a login shell for the user.


    Fedora Linux supports several login shells; each allows you to work with text
    commands and scripts (see Chapter 17 for help working with the login shell). The
    default login shell in Linux is the Bourne-again shell, called `bash`. Using this
    default is just fine.


    +   5. Create a home directory for the user.


    By default, the User Manager tool creates a directory in which the user can store
    personal files — /home folder, and named with the user account name. You can elect
    to create a /home directory, or create one in an alternative location. Unless
    you are running a huge data center that relocates /home folders to another disk,
    the suggested default is just fine.


    +   6. Create a private group for the user.


    Each user must belong to a default group. Some Linux distributions create a single
    group that contains all users. By default, Fedora creates a unique group for each
    user, ensuring that users can’t accidentally share files. It’s fine to allow Fedora
    to do that.


    +   7. Specify a User ID manually.


    By default, the User Manager tool automatically assigns a UID for the new user
    account. If you prefer to use your own numbering system for UIDs, you can assign
    your own UID here.


    +   8. Click OK to create the new user.


    After the new user account is created, it appears in the user list under the Users
    tab.


    # Modifying existing users


    A few user account settings are not assigned when you create a new account. You
    can get to those from the User Properties dialog box as follows:


    +   1. Either double-click a user account listed in the Users tab, or select the
    user account and click the Properties button on the toolbar.


    The User Properties dialog box appears, as shown in Figure 18-4.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# 336 Part IV: Junior Administrator Boot Camp


    ![](img/f493a327f3c2a812b2e84b22c874990c_349_0.png)


    Figure 18-4: The Properties dialog box in the User Manager tool.


    +   2. Alter data on the User Data tab.


    The User Data tab contains the same fields as shown in the Create User dialog
    box. You can alter the username, full name, home directory, or login shell here,
    as well as change the password for the user account.


    +   3. Click the Account Info tab to set an expiration date or lock the account.


    The expiration date doesn''t mean the user has expired; only the login account
    has. The account''s expiration date locks (not delete) the account when the date
    is reached, and the user is unable to log in. If you suspect unauthorized activity
    from this user account, you can also lock the account manually, preventing the
    user from logging in, and keeping the account still configured on the system.


    +   4. Click the Password Info tab to force password-expiration rules.


    This section allows you to set whether users must change their passwords. There
    are fields for how many days can pass before users have to change their passwords,
    warned, and how many days after the password-change date the account is locked
    if the password is not changed.


    +   5. Click the Groups tab to assign the user account to additional groups.


    When a user account is created, Fedora automatically creates a unique group for
    the user by default. Here''s where you can assign the user account to other groups
    as well. All the groups defined on the system'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Chapter 18: Basic System Administration 337


    appear within the tab. Select each group the user account should belong to. You
    can also change the primary group the user account belongs to (by default, it''s
    the same name as the user account).


    +   6. Click OK to accept any changes made to the user account.


    Any changes made to the user account take effect immediately. However, if you''ve
    added a user to a new group, permissions often''t work properly until the user
    has logged out and then back again.


    # Deleting a user account


    Although it''s quite an ordeal to add a new user account, removing user accounts
    is a snap. Just select the user account you want to remove from the Users tab
    list, and then click the Delete button in the toolbar. A simple message appears,
    whether you''re sure of your selection. After-checking to make sure you''re deleting
    the correct account, click Yes.


    # Adding new groups


    Groups help you manage access to files and folders on the system. Each file and
    folder contains three sets of permissions — one for the owner, another set for
    the group the file or folder is assigned to, and the last set for all other users
    on the system. By assigning a file or folder to a special group, you can allow
    all users that belong to that group to have full access to the file or folder.


    Here''s what you''ll need to create a group in User Manager:


    +   1. Click the Add Group icon on the toolbar.


    The Create New Group dialog box opens, as shown in Figure 18-5.


    +   2. Type the name of the new group in the Group Name box.


    +   3. Select the check box if you want to specify the Group ID manually.


    By default, User Manager automatically assigns a unique Group ID number (GID)
    to the new group. If you prefer to use your own GIDs, select the check box, and
    then select an available GID from the dropdown list.


    +   4. Click OK to accept the settings and create the group.


    The new group is created, and it appears in the group listing on the Groups tab
    in the User Manager window.'
  merge: -1
  pgno: 350
- img_proc: true
