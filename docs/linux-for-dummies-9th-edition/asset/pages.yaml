- img_proc: true
  md: '# 88 Part I: Getting Your Feet Wet


    ![](img/f493a327f3c2a812b2e84b22c874990c_101_0.png)


    Figure 5-1: The Fedora 11 KDE desktop.


    To find out more about KDE, take a look at the KDE Web site, which can be found
    at www.kde.org.


    As with everything else in Linux, the KDE desktop layout is highly customizable,
    with what you have on your system may vary from what you see in the figures in
    this chapter. Don''t panic, all these features are there, and we show you just
    how to customize your desktop to suit your needs!


    Similar to the GNOME desktop, the KDE desktop contains three main components that
    you should become familiar with:


    +   - The KDE menu

    - The panel

    - The desktop


    In the following sections, we walk you through each of these components and show
    you what they look like.'
