  md: '# Part I: Getting Your Feet Wet


    The Computer menu items also expand to include any removable media insert into
    your workstation, such as a CD, DVD, or USB memory stick. Just select that menu
    item to access files and folders on the removable media.


    # Recently Used


    As you use applications, KDE adds them to this section of the menu. The more you
    use an application, the higher in the listing it appears.


    # Leave


    There may be 50 ways to leave your lover, but there are only six ways to leave
    your desktop (at least without crashing your system!). The Leave tab provides
    six options, itemized in Table 5-3, for exiting the desktop session.


    | Table 5-3 The Leave Menu |

    | Menu Choice | What It Does |

    | --- | --- |

    | Logout | Ends the current desktop session and returns to the login session.
    |

    | Lock | Locks the desktop and displays a screensaver. To re-enter the desktop,
    you must enter the password for the logged-in user. |

    | Switch User | Suspends the current user''s session, and allows another user
    to log in. |

    | Suspend to Disk | Writes the current session state to a disk file and puts the
    system in a low-power mode. |

    | Shutdown | Ends the current desktop session, halts all processes on the system,
    and powers-off the system. |

    | Restart | Ends the current desktop session and reboots the system. |


    When you select an option from the Leave menu, a dialog box appears to prompt
    you for a confirmation. That helps prevent "oops" moments.


    # The panel


    At the bottom of your KDE desktop, you see a line with a bunch of icons. This
    is called the panel. The panel contains *widgets*, or small programs that run
    on the panel to provide functions directly on the panel.


    The layout of the KDE panel is another feature in KDE that is often different
    in the different Linux distributions. Most distributions place the KDE KickOff
    menu on the left side of the panel — which just happens to be the same place that
    Microsoft Windows places its Start icon. (We told KDE was kind to ex-Microsoft
    Windows users!)'
