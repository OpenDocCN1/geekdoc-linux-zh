  md: '# 48 Part I: Getting Your Feet Wet


    +   9. Select a filesystem for your Ubuntu partition in the Create Partition window.


    Part of the manual partition process is to assign a filesystem to each partition.
    A filesystem is a method used for storing and accessing files on the partition;
    lots of different filesystem formats are available. Unlike some other operating
    systems, Ubuntu supports several different filesystems. Table 3-1 shows the filesystem
    types available for you when creating disk partitions in Ubuntu.


    | Partition Type | Description |

    | --- | --- |

    | ext3 | A popular Linux journaling filesystem (more about that in a minute) that
    is an extension over the original Linux ext2 filesystem. |

    | ext4 | The newest Linux journaling filesystem that makes improvements over the
    Linux ext3 filesystem. |

    | ext2 | The original non-journaling Linux filesystem. |

    | ReiserFS | The first journaling filesystem supported by Linux. |

    | JFS | The Journaled filesystem, created by IBM and used in AIX UNIX systems.
    |

    | XFS | A high-performance journaling filesystem created by Silicon Graphics for
    the IRIX operating system. |

    | FAT16 | Older DOS filesystem. |

    | FAT32 | Newer Microsoft DOS filesystem compatible with Windows. |

    | swap area | Virtual memory area. |

    | Do not use | Ignore the partition, as if you''re going to install another operating
    system on it later. |


    ![](img/f493a327f3c2a812b2e84b22c874990c_61_0.png)


    The most common partition type (and the default used by the Ubuntu guided methods)
    is the ext3 format. A journaling filesystem that records changes in a log file
    before it attempts to commit them to the disk. If the system should crash before
    it can properly commit the data, the filesystem uses the journal (that is, the
    log file) to finish committing the pending files to disk; then it returns the
    disk to a normal state. Journaling filesystems greatly reduce file corruption
    in Linux.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Chapter 3: Installing Linux


    10. If you''re performing a manual partition, select the mount points for the
    partitions in the Create Partition window.


    Ubuntu handles hard drives by plugging them into specific locations in the virtual
    filesystem (see Chapter 6). So, after you select a filesystem format for the partition,
    Ubuntu wants to know where to place the new partition in the virtual filesystem
    (called mounting). Table 3-2 lists the possible locations.


    | Table 3-2 Mount-Point Locations for Your Filesystem |

    | Location | Description |

    | --- | --- |

    | / | The root of the Linux virtual filesystem. |

    | /boot | The location of the Linux kernel used for booting the system. |

    | /home | User directories for storing personal files and settings for applications.
    |

    | /tmp | Temporary files used by applications and the Linux system. |

    | /usr | A common location for multiuser application files. |

    | /var | The variable directory, commonly used for logs. |

    | /opt | Optional package-installation directory for third-party applications.
    |

    | /usr/local | A common alternative location for installations of optional multiuser
    packages.


    If you create one partition for Ubuntu, you must mount it at the root mount point
    (/). If you have additional partitions available, you can mount them in other
    locations within the virtual filesystem by specifying them individually. Be careful,
    as you may need to leave enough disk space for each mount point. For example,
    the /home mount point will contain all the files used by individual users on the
    system. That could be a lot if you store lots of files.


    > Don''t forget to allocate a partition for the swap area, even if you already
    have lots of physical memory installed on your system. The standard rule is to
    create a swap area as large as you have physical memory. Thus, if you have 2GB
    of physical memory, create a 2GB partition and assign it as the swap area.


    Up next in the installation process is the login window, shown in Figure 3-4.'
  merge: -1
