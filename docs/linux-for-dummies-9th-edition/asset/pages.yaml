  md: '# Chapter 7: Using the Filesystem


    Because of its versatility, many newer versions of KDE keep Konqueror around,
    even if Dolphin is loaded as the default file manager. To start Konqueror in Fedora,
    choose Favorites:Web Browser. The default Konqueror opens, but points to the Fedora
    home page. You can easily enter a path in the URL to view your local files. Figure
    7-7 shows the URL /home/rich, which is a Home folder.


    The beauty of Konqueror is that you can jump seamlessly between pages and local
    folders, all within the same window! Konqueror uses tabbed browsing to display
    multiple locations within the main window. Press Ctrl+T to open a new tabbed area.
    You can then easily switch and forth between the Web and your local filesystem
    by clicking the tabs.


    ![](img/f493a327f3c2a812b2e84b22c874990c_144_0.png)


    Figure 7-7: A home folder using Konqueror in Fedora''s KDE desktop.


    But wait, there''s more! Click the Settings menu bar, and notice that you can
    also activate a Terminal window or a navigation bar. The navigation bar appears
    on the left side; it displays links for the home and root folders, the network,
    and the menu system, as shown in Figure 7-8. Click one of the local folders to
    access your filesystem.


    Getting back to the file-manager world, Konqueror behaves like Dolphin in another
    important way: You can create, move, and delete files and folders using standard
    drag-and-drop or right-click methods.'
