  md: '# Chapter 13: Messing with Audio


    3. If none of these actions helps, go to your favorite sound search engine and
    enter the make and model of your sound card and the word linux.


    You may find some helpful information that way.


    For KDE desktops, the sound settings can be found in the Sound section of the
    System Settings window.


    # Listening to CDs


    If you have a CD/DVD player in your PC, you can play your audio CDs you work (or
    play!) The application you use depends on your desktop. The following sections
    walk you through the most common application used on each desktop — Rhythmbox
    for GNOME, and KsCD for KDE.


    # Rhythmbox


    On the GNOME desktop, the first time you insert an audio CD, a dialog box appears
    and asks what program you want to play the CD (as shown in Figure 13-4).


    ![](img/f493a327f3c2a812b2e84b22c874990c_266_0.png)


    Both Fedora and Ubuntu use the Rhythmbox application for playing audio CDs. Just
    select that option (it should be the default), and click OK. If you want your
    future audio CDs to start playing automatically, just select the checkbox that
    tells Rhythmbox always to perform this action before you click OK. Rhythmbox starts
    whenever you insert an audio CD.


    Rhythmbox scans the CD, and displays the tracks and track lengths of the CD in
    the Music Player window. If your workstation is connected to the Internet, Rhythmbox
    also contacts a remote CD database to extract information about'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# 254 Part III: Getting Things Done


    the CD — including the CD title, individual track song titles, and the album

    cover art for the CD if available. Figure 13-5 shows the Rhythmbox window

    a opening an audio CD.


    ![](img/f493a327f3c2a812b2e84b22c874990c_267_0.png)


    The Rhythmbox interface is fairly straightforward. It lists the individual

    CD tracks in the main window area, along with the basic track information

    that it retrieved. The toolbar provides buttons for the basic functions you

    need if to interact with a CD player, a couple of extras:


    +   - Play: Start the current track.

    - Previous: Jump to the previous track in the song list.

    - Next: Jump to the next track in the song list.

    - Repeat: Repeat the current track.

    - Shuffle: Randomly play the tracks in the song list.

    - Browse: Browse through the music tracks.

    - Copy CD: Make a duplicate copy of the CD to a blank CD.

    - Visualization: Display a screen saver image while playing the track.

    - Eject: Remove the CD from the Tray.

    - Extract: Convert the track on the CD to an audio file and store it in the

    library in your home folder.


    The Extract feature enables you to copy tracks from the CD to audio files on

    your workstation (called ripping), a process we look more closely in the

    “Ripping Music Tracks from CDs” section later in this chapter.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# KsCD


    When you insert an audio CD while on your KDE desktop, you won''t see anything
    happening. Instead, KDE quietly places it in the new devices applet in the panel
    (see Chapter 5). To play the CD, you need to start a CD player manually.


    The tool for playing audio CDs in KDE is called KsCD. You can find it by choosing
    KDE:Applications:Multimedia. Figure 13-6 shows the main KsCD window.


    Figure 13-6: The main KsCD window.


    ![](img/f493a327f3c2a812b2e84b22c874990c_268_0.png)


    Surprisingly, it looks like a real CD player! If you''ve ever used a CD player,
    you can probably guess what buttons to click to play your CD.


    You probably also noticed that Rhythmbox, KsCD goes out to the Internet to retrieve
    the album and track names (if you have an Internet connection). That makes watching
    the KsCD interface a lot more interesting than staring at a boom box!


    # Listening to Downloaded Music


    Downloading music from the Internet is a fun activity. A lot of people like to
    pretend that it''s both legal and ethical, in fact, it''s often theft, depending
    on where you grab the music. We leave that ethical issue between you and your
    belief system, but because our own ethics say it''s theft, we''re going to focus
    on showing you music that you''re welcome — legally — to download!


    One source of legal is on artists'' Web sites. Many popular artists offer free
    samples of their songs, and many new artists offer their entire songs for downloading.
    In these situations, you''re more than welcome to download and listen!


    As you probably know the program you use to listen to downloaded music depends
    on your desktop. Amarok can help you out on a KDE desktop, and Rhythmbox can help
    you out on a GNOME desktop.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# 256 Part III: Getting Things Done


    A popular medium for playing songs on a Web site is the Macromedia Flash Player.
    This package plays songs directly in the Web page, without downloading- the song
    to the computer''s hard drive. You can add this functionality to your Firefox
    Web browser using the methods described in Chapter 14. This section specifically
    deals with playing song files that you download to your computer.


    > TIP


    # Amarok


    In the KDE desktop world, the king of audio-file playing is the Amarok music player.
    Just after every KDE desktop installation you''ve run into uses Amarok to play
    audio files. Here''s your drill:


    +   1. After you have Amarok installed, start it by choosing Multimedia▷Audio
    Player.


    The first time you start Amarok, the First-Run Wizard launches, displays the Welcome
    screen, and then takes you to the Collection section of the Configuration.


    +   2. Expand (click the + symbols) and contract (click the - symbols) parts of
    the filesystem you find the sections that contain your music.


    When you display these folders (for example, /home/rich/Music), click their boxes
    to add check marks (see Figure 13-7). Leave (or put) check marks to Scan Folders
    Recursively (which looks in subfolders) and Watch Folders for Changes (which picks
    up new files automatically). That way Amarok does most of the work.


    ![](img/f493a327f3c2a812b2e84b22c874990c_269_0.png)


    Figure 13-7: The Amarok Configure Collection screen.'
