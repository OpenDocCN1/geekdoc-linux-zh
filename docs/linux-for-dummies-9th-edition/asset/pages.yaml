    # Setting Up Your Virtual Server


    Before you can enter your virtual world, you need to set up your sandbox just
    a little more. The wizard sets up a generic sandbox environment, so you''ll want
    to spruce things up a bit before using it. This section walks you through customizing
    the virtual server''s sandbox and adding an operating system to your virtual server''s
    settings.


    # Changing settings


    Each virtual server you create in VirtualBox has a set of configuration settings
    that determine just VirtualBox emulates the sandbox.


    To get to the configuration settings, choose the virtual-server entry on the left
    side of the VirtualBox window (refer to Figure 20-4), and then click the Settings
    icon. The Settings dialog box, shown in Figure 20-5, appears.'
