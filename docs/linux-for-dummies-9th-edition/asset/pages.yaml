    When you start using a new operating system, one of the most frustrating things
    is trying to figure out all the goofy extensions. The Windows world has .exe and
    .zip. The Macintosh world has .bin and .hqx. What about Linux world? It certainly
    has its fair share of bizarre extensions, but really, they make a great deal of
    sense after you know the programs that they make. In this chapter, you find out
    all about .tar, .gz, .tar.gz, .tgz, .bz2, .deb, and .rpm files. (Anyone up for
    a game of Scrabble with alphabet soup?)


    After you have the letter all figured out, you''ll be happy to find that Linux
    offers a number of cool tools for working with these crazy files, updating your
    system, adding new software, and more.


