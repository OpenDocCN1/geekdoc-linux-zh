  md: '# Chapter 1: Getting Acquainted with Linux


    # Who''s in charge of Linux anyway?


    As an open-source project evolves, various people emerge as leaders. This leader
    is known as the project''s benevolent dictator. The benevolent dictator has probably
    spent more time than anyone else on a particular problem and often has some unique
    insight. Normally, the words democratic and dictator are never paired in the same
    sentence, but the open-source model is a very democratic process that endorses
    the reign of a benevolent dictator.


    Linus Torvalds is still considered the benevolent dictator of the Linux kernel
    (the operating system''s core). He ultimately determines what features are added
    to the kernel and what features aren''t. The community trusts him with vision
    and discretion. In the event that he loses interest in the project, or the community
    decides that he has gone senile, a new leader will emerge amongst his very competent
    people working with him.


    # Einstein was a volunteer


    Someone who is a volunteer or donates to a project isn''t necessarily providing
    second-rate effort (or only working on weekends and holidays). In fact, any human-resources
    expert will tell you people who choose to do a job of their own free will produce
    the highest-quality products.


    The volunteers who contribute to open-source projects are often leaders in their
