    # Playing the Shell Game


    You need a way to tell the computer what you want it to do. In Linux, one of the
    ways to communicate with the computer is something called the shell. A shell is
    not a graphical thing; it''s the sum total of the commands and syntax you have
    available to you tell the operating system what to do for your work.


    The shell environment is rather dull and boring by graphical desktop standards.
    When you start the shell, what you see is a plain window with a short prompt (such
    as $) followed by a blinking cursor that awaits your keyboard entry. (Later in
    this section, we show you a couple of methods for accessing the shell.)


    The default shell in Linux is the bash shell. This work environment is based on
    the original UNIX shell, which is called the Bourne shell and is also referred
    to as sh. The term bash stands for the Bourne again shell. The shell comes with
    most Linux distributions.


    # Getting a shell


    You can start a bash session using a terminal application in your GUI desktop.
    The terminal application you use (depends on) of your desktop:


    +   Terminal: This is the default terminal used in the GNOME menu, choose Applications:System
    Tools:If you''re in Fedora, choose Applications:Accessories:Terminal in Ubuntu.
    Figure 17-1 shows the Terminal. Notice the prompt — that''s the shell''s command-line
    prompt. You enter your commands there.


    +   Konsole: This is the default terminal used in the KDE desktop. In KDE world,
    choose K Menu:Applications:System:Konsole. The Console interface is shown in Figure
    17-2. The command-line prompt appears in the window.'
