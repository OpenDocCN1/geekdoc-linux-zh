- img_proc: true
  md: '# 134 Part II: Getting Up to Speed with Linux


    Here''s how to access your Windows files from each Linux file manager:


    +   Nautilus: Select the Places menu. The Windows drive is listed along with all
    the locations you can access (the name of the drive will match the long name used
    in Windows but not the drive letter).


    +   Dolphin: The Windows drive appears in the list of locations in the navigation
    bar area—again, using the same long drive name as Windows.


    Some Windows PCs use a hidden partition on the hard drive to hold emergency stores.
    These partitions won''t be hidden in Linux, so be careful that you don''t ruin
    anything important to your Windows system (unless, of course, you''re planning
    on removing Windows)!


    # Accessing Network Drives


    Sometimes the drive you want to access is on another computer. If the drive on
    the other computer is set up to be accessible through your network, you can access
    it via the Nautilus, Dolphin, or Konquerer file managers:


    +   In the GNOME desktop, choose Places<-Network for shared folders on your network.
    If you want to access a Windows computer, double-click Windows Network. The Windows
    computers on your network that have drives available for browsing are displayed.
    From there, you can browse to wherever you want to go!


    +   In the KDE world, choose KDE::Computer::Network (see Chapter 5). The Dolphin
    manager opens in network mode, as shown in Figure 7-9.


    ![](img/f493a327f3c2a812b2e84b22c874990c_147_0.png)


    Figure 7-9: Dolphin in network mode.'
