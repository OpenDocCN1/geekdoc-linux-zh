  md: '# Chapter 12: Word Processing and More with OpenOffice.org 235


    # # Managing Data with OpenOffice.org Base


    If you''re accustomed to using Microsoft Access (or have to interact with a variety
    of database products), and often have been left scratching your head, wondering
    how to handle these needs in Linux, wonder no more! OpenOffice.org Base provides
    an interface both to Microsoft Access files and to other databases.


    # ## Getting help from the wizard


    There are many different ways you can use this program. The essentials involve
    creating a database from scratch in a file on your system, working with Microsoft
    Access files, and working with databases created for use with major database-server
    programs — even over the network. Because approaches abound and space in this
    book is limited, we focus on two of the most common choices: creating new database
    files and opening existing files, including Microsoft Access files.


    The first interface you encounter when you open a new database file is the Database
    Wizard (Figure 12-6).


    ![](img/f493a327f3c2a812b2e84b22c874990c_248_0.png)


    # ## Creating a new database file in the Database Wizard


    In the Database Wizard dialog box, do the following to create a brand-new database
    file:'
  merge: -1
