  md: '# 118 Part II: Getting Up to Speed with Linux


    ```

    rich@testbox:~ ls -al

    total 2480

    drwxr-xr-x 30 rich users 4096 2009-05-16 13:58 .

    drwxr-xr-x 3 root 4096 2009-05-16 09:04 .

    -rw-r--r-- 1 rich users 220 2009-05-16 09:04 .bash_logout

    -rw-r--r-- 1 rich users 3115 2009-05-16 09:04 .cache

    drwxr-xr-x 4 rich users 4096 2009-05-16 09:23 .config

    drwx------ 3 rich users 4096 2009-05-16 09:20 .dbus

    drwxr-xr-x 2 rich users 4096 2009-05-16 09:20 Desktop

    ```


    If all users are members of the same group, and each file belongs to the group,
    then each user has the group permissions for the files.


    In other distributions (such as Fedora and Ubuntu), a unique group is created
    for every user, which is why the earlier listings showed the owner and group items
    as identical (rich rich).'
