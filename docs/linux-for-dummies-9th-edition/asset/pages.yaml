  md: '# Chapter 3: Installing Linux


    +   * The package usage survey: The package usage survey retrieves non-personal
    information about your setup (such as the CPU type, amount of memory, amount of
    hard-drive space, and installation method you used) and sends it to a central
    repository for statistical purposes. You can view the current package usage survey
    results by going to http://popcon.ubuntu.com. Several details and graphs show
    the current survey totals.


    +   * The network proxy: The final feature in the Advanced Options window is to
    set a network proxy server (especially those in businesses) might filter out any
    network traffic to restrict the Web sites that employees can access. This is done
    using a network proxy. The firewall blocks all normal HTTP access from the network,
    but the network proxy can receive HTTP requests, then block the unacceptable ones,
    and forward the allowed ones. This gives a total control over what employees can
    and can''t access the Internet from the corporate network.


    If your Ubuntu workstation is on a network that uses a network proxy, you must
    configure this feature for your Internet access to work properly.


    When you''ve finished any advanced options, you''re ready to start the installation.


