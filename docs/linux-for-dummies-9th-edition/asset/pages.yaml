    # Eating spam


    One feature about KMail is its automatic spam- and virus-filtering capability.
    KMail can scan your incoming email and filter out spam and viruses automatically.
    These days, spam (officially called unsolicited commercial e-mail) can overwhelm
    your inbox, and being able to reach and catch junk comes early in days.


    Both Fedora and Ubuntu include spam-filtering programs in their default setups,
    up to have to enable them in your KMail configuration. To do that, just follow
    these steps:


    +   1. **Choose Tools:** Anti-Spam Wizard to start the wizard, then click Next
    after your spam filter has been detected.


    The wizard scans you for installed spam-filter programs — and your Linux distribution
    probably has one (Fedora installs SpamBays; Ubuntu installs Bogfilter). After
    the wizard detects your installed program, it appears as shown in Figure 10-17.

    2. **Select how you want KMail to handle spam, then click Next.**

    nYou can configure KMail to just mark spam as having been read so it doesn''t
    count it in your total of unread messages, or you can have it move any messages
    it thinks are spam to a separate folder automatically.

    3. **Review your selections, and click the Finish button.**'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 200 Part III: Getting Things Done


    ![](img/f493a327f3c2a812b2e84b22c874990c_213_0.png)


    Spam detection is still something of a work in progress. There’s no one solution
    that detects all possible spam messages, so you have to be on the watch constantly.
    Most spam filters learn as they go, so it may take a while for your spam filter
    to get used to spotting the spam messages you receive. Make sure you check your
    spam folder for any messages that might have been marked incorrectly as spam.
    You can then unmark them to help the spam filter learn what is and isn’t okay
    to trash.'
  merge: -1
  pgno: 213
