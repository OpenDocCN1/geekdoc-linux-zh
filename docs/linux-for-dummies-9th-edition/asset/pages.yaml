  md: '# 18 Part I: Getting Your Feet Wet


    or not load enough and later discover that their computers won''t do what they
    want them to do. Fortunately for beginners, there''s a much simpler way to install
    Linux.


    A relatively new phenomenon in the Linux world is the bootable CD distribution,
    called a LiveCD. Most modern computers can start up by reading the operating system
    from the CD instead of the hard drive. This arrangement lets you see what a Linux
    system is like without actually installing it.


    To take advantage of this feature, some Linux distributions create a bootable
    CD that contains a sample Linux system. Due to the limitations on the single CD
    size, the sample can''t contain a complete Linux system, but you''ll be surprised
    at all the software they can cram on! The result is pretty cool: You can boot
    your computer from the CD and run a Linux distribution without having to install
    anything on your hard drive!


    This is an excellent way to test various Linux distributions without having to
    mess with your PC. Just pop in a CD and boot! All the Linux will run directly
    off the CD. There are lots of Linux LiveCDs that you can download from the Internet
    and burn onto a CD for a test. Table 1-2 shows some popular Linux LiveCDs that
    are available.


