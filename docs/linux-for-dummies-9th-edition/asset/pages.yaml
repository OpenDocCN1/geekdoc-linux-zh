    # Keeping Linux Up to (Up)date


    A vital feature of any operating system is the capability to update fast with
    minimum hassle. There are always new features, security fixes, and software bugs
    that should be installed to keep things running smoothly.


    Most Linux distributions include a program for automatically updating the installed
    software on your system via an Internet connection. If your computer is connected
    to the Internet, then you can receive daily updates and up-to-the-minute patches.


    Ubuntu, all its derivatives (includingOS), and Fedora include update programs
    to make it snap to keep your system up to date. Fedora uses the yum program to
    manage Red Hat-based .rpm packages for installing software and updates. Ubuntu
    uses the rpm and apt-get programs to manage Debian-based .deb packages for its
    software and update installations.'
