  md: '# Chapter 21: Ten Steps to Setting Up a Samba Server


    4. Create the folders using the mkdir command.


    The folder names correspond to the groups you set up. For example, if you created
    bowling and shopping groups, the commands to set up the folders are


    ```

    mkdir bowling

    mkdir shopping

    ```


    5. Change the group of your folders.


    The chgrp command is used to change the group that the folder belongs to. If your
    folders are bowling and shopping, the commands are


    ```

    chgrp bowling

    chgrp shopping shopping

    ```


    This step allows members of the groups to have access to the proper folders.


    6. Type exit at the command-line prompt to exit root mode, and then type exit
    again to exit the Terminal session.


    # Step 4: Set Advanced Folder Permissions


    There is one additional trick you have to use to complete the permissions for
    your shared folder(s). When Fedora creates a user account, it assigns each user
    account to a unique group (which happens to be the same as the user-name). Unfortunately,
    this causes problems in a shared-folder environment.


    Even though you are all members of the same group, your primary Linux group is
    still their unique group name. When a user creates a new file in the shared folder,
    it belongs to the user''s primary group, not to your newly created group.


    To solve this problem, you must tell the shared folder to use the folder''s group,
    not the user''s group, when users create new files. This requires a special Linux
    permission that is not available from a file manager.


    You must manually assign this permission from the command-line prompt using the
    Linux chmod command. Here are the steps:


    +   1. Choose Applications::System Tools::Terminal to start the command-line session.


    If you''re not familiar with the command line, see Chapter 17.'
  merge: -1
