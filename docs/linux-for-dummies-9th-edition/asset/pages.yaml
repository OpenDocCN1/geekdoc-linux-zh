    do so, a massive listing appears, and much of the information scrolls right past
    you. Although you can back up a bit by pressing Shift-PageUp, you may not be able
    to see everything you want to see.


    To see all information, you can do one of these:


    +   - Send the data to a file with redirection by typing something like ls -l
    /etc > ~etclisting and then review the contents of ~etclisting with your favorite
    editor.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Chapter 17: Working without the GUI


    Pipe the output to the more command (see Appendix A) so you can view it-screen
    page at a time.


    To pipe the output to more, `ls -la directory_path | more`, where `directory_path`
    is the directory for which you want to list the contents. The `|` symbol (which
    on the keyboard looks more like two vertical bars stacked on top of each other
    than just one solid line) tells bash that you want to use a pipe.


    # Using Help


    The man page system is the electronic manual for Linux (man is short for manual),
    designed to provide users with a convenient reference to all the detailed command
    information. This information includes command-prompt options, formats, and function
    usage.


    The syntax for opening a man page is `man <command name>`.


    Don''t know the command you''re looking for or need basic information about the
    man page system? Just type `man man` to get started. When you''re finished reading
    the man page, press Q to exit.


    # Clearing the Screen


    The clear and reset commands are handy to know when you''re working in a shell.
    The clear command simply wipes the bash screen. — it doesn''t delete any files
    or any settings — it just tidies up so you can start dumping new stuff to the
    screen.


    The reset command is a little more interesting. Suppose you try listing a binary
    file to the cat command. After the computer finishes displaying the result of
    executing the cat command on a binary file, you may get lucky and be able to read
    your prompt. More likely, your prompt has been rendered into box characters of
    no meaning, and typing on the keyboard gives you more of the same. To get back
    to normal, just type reset and press Enter. Note that it doesn''t look like you''re
    typing the word reset, rest assured that the computer understands the series of
    characters; after a couple of seconds, it should restore your shell environment
    to your native language.'
  merge: -1
  pgno: 342
