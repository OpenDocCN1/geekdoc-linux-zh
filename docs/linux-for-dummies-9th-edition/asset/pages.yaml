    # Sailin’ through Folders with Nautilus


    In the GNOME desktop environment, the default file manager is Nautilus. Moving
    through the filesystem in Nautilus involves a couple of different skills using
    the command line. You may know exactly where in the filesystem you want to go,
    but not what to click to get there. In the first place, you need to know where
    you want to begin. This decision isn''t as difficult as it sounds.


    You have two options for navigating your filesystem with Nautilus:


    +   - Spatial mode: Displays the contents of a single folder in a window. If you
    double-click a folder, it opens a new window with the contents of that folder,
    keeping the original window still open. Figure 7-1 shows spatial mode in use.


