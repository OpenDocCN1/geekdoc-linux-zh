- img_proc: true
  md: '# Chapter 22: Ten Troubleshooting Tips


    You can press Ctrl+Alt+F# (F# refers to function keys F2 through F6) to change
    out of the GUI to a command-line terminal at any time — and then press Alt+F7
    or Alt+F8 to switch back.


    # # Tip #7: Changing Your Boot Environment "Permanently"


    The word *permanently* is in quotes in the heading because you can, of course
    go back and change this later if you want. *Permanently* just refers to the fact
    that after you''ve made this change, the system goes into the referred environment
    automatically, every time you boot — until you change it.


    You can''t make this change in Ubuntu unless you want to boot into *single-user
    mode*, which is "safe mode" and not of much use. Well, okay, you can make the
    change, but you''ll need a techie friend to set up a bunch of stuff if you actually
    want to use the system.


    To make this change in Fedora, you have to edit what''s called a *run level*,
    like this:


    +   1. In the GUI, open a command-line terminal.

    If you''re not sure how to do so, see Chapter 17. If you''re not in the GUI and
    you''re already logged in, type `su` – to become the root user.


    +   2. Type `cp /etc/inittab /etc/inittab.old` to make a backup.

    Now, if something happens while you''re editing the `inittab` file, you can always
    refresh with the old version.


    +   3. Open the `inittab` file in your preferred text editor.

    Some Linux text editors are covered in Chapter 11.


    +   4. Scroll down until you find a line similar to the following:


    ```

    id:5:initdefault:

    ```


    This line appears near the top of the file. What you''re interested in here is
    the number. In most mainstream Linux distributions, the number 5 tells Linux to
    boot into the GUI, and the number 3 tells Linux to boot into the command line.
    The preceding example, therefore, boots into the GUI.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# 404 Part V: The Part of Tens


    # 5. Change the number in this line.


    If it''s a 5, change it to 3, and vice versa. Make sure that all colons and other
    items are left properly in place, or else your machine will have problems booting
    later.


    # 6. Save and exit the file.


    The changes go into the next time you reboot the system.


    ![](img/f493a327f3c2a812b2e84b22c874990c_417_0.png)


    If you end up having problems booting the system, the Ubuntu or Fedora LiveCD
    can be used as an emergency boot disk.


    At any time, you can have your Linux box switch between full command-line mode
    and full GUI mode.


    To switch between modes, do the following:


    +   - To change from the GUI login to the command-line login, open a window and
    type (as root) init 3.

    - To change from the command-line login to the GUI login, type (as root) init
    5.


    When you enter the init command, your system reboots into the mode you specify.


    # Tip #8: ''I Want to Change Screen Resolutions''


    You do want or need to swap between resolutions in the GUI on the fly? Suppose
    you want to work on Web pages and want to be able to see 1,024 x 768, but you
    look in a browser at 800 x 600 (or even 640 x 480). Your machine is very likely
    already set up to do this; you just need to know how to do it!


    If you machine is set up for, you can change resolutions by pressing Ctrl+Alt++
    (plus sign).


    ![](img/f493a327f3c2a812b2e84b22c874990c_417_1.png)


    Be sure to use the (+) sign on your number pad — you can''t use the plus sign
    on the main keyboard for this.


    If you''re using a keyboard without a number pad — as you will be if you''re using
    a laptop — or your machine isn''t set up to make changes on the fly, then you
    have to change your resolution through your display-configuration program (choose
    System:Preferences:Display).'
