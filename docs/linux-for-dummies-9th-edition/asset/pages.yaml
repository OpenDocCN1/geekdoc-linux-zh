    (see Chapter 1) to boot your computer into Linux without installing anything.
    Running Linux from a CD drive is slower (perhaps even painfully slow on an older
    computer), but nonetheless works, and it gives you an idea of what Linux is all
    about.


    # Replacing an existing operating system


    If you have a spare computer that''s only going to run Linux and nothing else,
    you''re in luck! Replacing an existing operating system with Linux is the easiest
    way to install Linux on a computer. Most installations include an automatic process
    that guides you through converting a computer entirely to Linux. However, this
    is an all-or-nothing approach — you’ll be replacing your existing operating system
    entirely with Linux!


    ![](img/f493a327f3c2a812b2e84b22c874990c_35_1.png)


    If you replace your existing operating system, be aware that when you''re done,
    you won''t have your original data files anymore! If you want to keep your files,
    have them back up to media that you can read from Linux. A USB flash drive is
    a great way to copy small amounts of data (up to 16GB or so) and move them onto
    your Linux system. For large amounts of data, look into getting an external USB
    hard drive.


    If you replace your existing operating system, you can skip the next section,
    “Preparing to Use Linux and Microsoft Windows Together.” In fact, if you''re feeling
    brave, you can skip right to Chapter 3 and start your installation. There’s troubleshooting
    information in Chapter 22 as well.


    # Using a second hard drive

    partitioning a hard drive


    Installing Linux on a second hard drive — or, for that matter, partitioning your
    existing hard drive to run Linux — requires a dual-boot scenario: Both Linux and
    Microsoft Windows inside hard drives (or partitions) in the same computer. When
    you boot your computer, a menu appears, asking you which operating system you
    want to use. You get to keep your original Windows applications and files, and
    use Linux — all on the same computer!'
