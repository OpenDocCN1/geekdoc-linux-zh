  md: '# 236 Part III: Getting Things Done


    +   1. Select the Create a New Database radio button.


    +   2. Click Next.


    The Decide How to Proceed After Saving the Database screen appears, as shown in
    Figure 12-7.


    ![](img/f493a327f3c2a812b2e84b22c874990c_249_0.png)


    Figure 12-7: The Decide How to Proceed After Saving the Database screen.


    +   3. If you want to register this database as a data source in OpenOffice.org,
    leave Yes, Register the Database for Me selected; otherwise, select the No, Do
    Not Register the Database radio button.


    A registered database is accessible by all your OpenOffice.org applications, other
    than just OpenOffice.org Base.


    +   4. If you immediately want to open this file for editing, leave the Open Database
    for Editing check box; otherwise click this option to select the check box.


    +   5. If you want to create a new table immediately in the database by using
    the Table Wizard (the recommended method), select the Create Tables Using the
    Table Wizard check box.


    For now, it''s best to leave the wizard off so you can explore one step at a time.


    +   6. Click Finish.


    The Save dialog box opens.


    +   7. Enter the name for your document in the Name text box.


