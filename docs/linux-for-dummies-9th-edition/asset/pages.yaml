    # Talking with Skype


    Skype is by far the most popular IP phone network around. Many Linux distributions
    install Skype as the default IP software. Unfortunately, neither Fedora nor Ubuntu
    do. If you prefer to use Skype on your Fedora or Ubuntu system, you have to install
    it yourself.


    To install Skype on your Linux system, do the following:


    +   1. Point your Web browser to www.skype.com.


    +   2. On the Skype home page, click the Download link.


    +   You are taken to the Download Skype page.


    +   3. Click the Skype for Linux link on the left side of the page.


    +   You are taken to the Download Skype for Linux page. Here you will see links
    for various Linux distributions.


    +   4. Click the link for your specific Linux distribution.


    +   If your specific distribution version is not listed, you should be able to
    install an older version. An Opening Skype dialog box appears, with the full name
    of the file in the title.


    +   5. Either select the Open with Software Installer option and click OK, or
    click the option that downloads the installer file to your workstation.'
