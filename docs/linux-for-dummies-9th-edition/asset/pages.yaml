  md: '# 110 Part II: Getting Up to Speed with Linux


    # # The importance of being /etc


    The /etc base directory contains primarily configuration files. It is best not
    to mess with these unless you know what you''re doing. Some important directories
    (which will vary depending on what you have installed) include the following:


    +   - The directories beginning with /etc/cron contain instructions for various
    programs that run at automated times.


    +   - The /etc/cups directory contains configuration information for your printer.


    +   - The directories beginning with /etc/rc all contain data about what starts
    and won''t boot time and shutdown. These directories store the services run.


    +   - The /etc/sysconfig directory has network-configuration information.


    +   - The /etc/samba directory contains configuration files for the Samba software
    for communicating with Microsoft Windows servers (see Chapter 20).


    +   - The /etc/X11 directory contains configuration details for the X Window System
    (X), which runs your graphical user interface (GUI). Chapters 4 and 5 are more
    over the GUI.


    +   - The /etc/opt directory contains configuration files for the programs in
    the /opt directory, if you decide to use it.


    # # Where temporary media lives


    You may or may not have subdirectories in /media or /mnt by default. Typically,
    however, you can look for the:


    +   - The /media/floppy directory is used for adding a floppy disk to your filesystem
    — rather than seeing the word floppy, you might see fd0 or floppy0.


    +   - The /media/sdb (or /media/sdc, /media/ssd, and so on) is used when you plug
    a USB drive into your workstation.


    +   - The /media/cdrom (or /media/dvd, /media/cdrecorder, and so on) is used depending
    on what type of hardware you have directory for adding a CD-ROM, DVD-ROM, CD-Writer,
    and so on to your system.


    In Chapter 7, you find out how to do it in the handier point-and-click manner.'
  merge: -1
