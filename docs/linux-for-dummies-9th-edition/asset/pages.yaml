  md: 'In the GNOME desktop, when you insert a music CD or DVD, a music player (see
    Chapter 13) opens to play the music (for KDE you have to select it from the New
    Device Notifier widget). See Chapter 13 for how to add support for even more types
    of music files. When it comes to video CDs and DVDs, especially video DVDs, you
    often have to install extra software (that''s due to a number of issues discussed
    in Chapter 14).


    The KDE desktop doesn''t automatically produce a desktop icon for removable media.
    When you insert a CD-ROM, USB flash drive, or floppy disk, the removable medium
    appears in the New Device Not panel widget (see Chapter 5). Accessing the removable
    media is as easy as clicking the link in the pop-up window.


    GNOME currently does a better job than its brethren of handling writable or resritable
    blank CDs or DVDs. Inserting these discs into their drives causes a Nautilus window
    to open its CD/DVD Creator window (discussed in a moment). The KDE desktop currently
    doesn''t contain a CD/DVD-burning software-package by default, but we''ll remedy
    that a little later in this chapter.


    # ## Floppy drives


    Floppy drives sometimes cause some problems. For example, Linux computers can
    reliably detect that a floppy disk was put into the drive; after you insert the
    disk, you have to tell Linux to look for it. Put the floppy disk into the drive,
    choose Places\Computer in the GNOME desktop, and then double-click Floppy Drive
    to access the disk''s contents and add a floppy icon on your desktop. For the
    KDE desktop, you''ll have to open the Dolphin file manager and select the PC Floppy
    Disk entry from the navigation area.


    When you finished working with the floppy disk, you can remove it by right-clicking
    the floppy icon on your desktop and then Unmounting Volume (for GNOME) or clicking
    the Eject button in Dolphin (for KDE). Wait until the floppy drive''s light turns
    off before you remove the disk. As long as the lights are on, Linux may still
    be writing to the disk.


    # ## Accessing Windows Drives on This Computer


    If you''re dual-booting between Windows and Linux, sometimes you might want to
    access information on your Windows drive from Linux — and you can; unfortunately,
    Windows can''t access information on Linux drives.


    ![](img/f493a327f3c2a812b2e84b22c874990c_146_0.png)'
