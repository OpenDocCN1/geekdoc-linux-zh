  md: '# 282 Part III: Things Done


    # # Playing 3-D Games


    One of the strengths of Windows PCs has been the support for advanced video games.
    These games utilize high-end graphics that often require specialized 3-D video
    cards to operate.


    Again, this is another area where Linux has never caught up to Windows, until
    now. Two 3-D video card vendors, ATI and NVIDIA, have released Linux drivers for
    their products, allowing game developers to enter the Linux market.


    There''s a catch to this, though: Both ATI and NVIDIA released binary drivers
    for their 3-D video cards, but not the source code. A true open-source system
    must include source code for all the components included in the system. This has
    caused quite a dilemma for Linux distributions.


    For a Linux distribution to include the ATI or NVIDIA binary drivers violates
    the true spirit of open-source software. But if a Linux distribution doesn''t
    provide these drivers, it risks falling behind in the Linux distributions and
    losing market share.


    Ubuntu handles this by installing the 3-D video card driver and notifying you
    that it installed a driver for a proprietary card. You can view the driver Ubuntu
    installed by choosing System;Administration;Drivers.


    Fedora decides to solve this by splitting the difference: Fedora doesn''t include
    the ATI or the NVIDIA 3-D graphics-card drivers, making the distribution completely
    open source. However, if you still want support for your ATI or NVIDIA 3-D graphics
    cards, there''s hope.


    The http://rpm.livna.org Web site is a community-operated repository of non-approved
    Fedora software packages. Not only does it include software packages for many
    of the विडियो we''ve discussed in this chapter, but it also includes software
    packages for the commercial ATI and NVIDIA 3-D graphics cards.


    ![](img/f493a327f3c2a812b2e84b22c874990c_295_0.png)


    Installing commercial drivers for ATI and NVIDIA graphics cards isn''t illegal,
    it just goes against the grain of the open-source movement. However, as we mentioned
    earlier, the codecs available do fall under licensing constraints, so be careful!


    By default, the Fedora software installer doesn''t recognize the http://rpm.livna.org
    repository. The Web site includes instructions on how to add it to your repository
    list. After you do that, you''re ready to install the ATI or NVIDIA 3-D graphics
    card drivers, but you have to use the command-line interface skills deailed in
    Chapter 17:'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Chapter 14: Messing with Video and Graphics 283


    +   1. Start a command-line prompt session by choosing Applications: System Tools:
    Terminal in the GNOME desktop, or by starting the Konsole application in the KDE
    desktop.


    +   2. Become the root user by typing su and entering the root password.


    +   3. Use the yum command-line program to install the appropriate 3-D graphics
    cards on your system.


    The ATI video driver is called kmod-fglrx, and the NVIDIA video driver is called,
    strangely enough, kmod-nvidia. The command to install the driver


    ```

    yum install kmod-nvidia

    ```


    +   4. Shut down the X server by using the init command.


    The command for this is


    ```

    init 3

    ```


    +   5. Enable the NVIDIA 3-D video drivers.


    To enable the NVIDIA driver, type


    ```

    nvidia-config-display enable

    ```


    To enable the ATI video driver, type


    ```

    ati-fglrx-config-display enable

    ```


    +   6. Restart the X server using the init command.


    The command to do this is


    ```

    init 5

    ```


    You should have your 3-D graphics card working with Fedora! Lots of 3-D games
    are available in the standard Fedora software repositories:


    +   - freedom: New episodes for the popular DOOM2 game

    - bzflag: A tank-versus-tank battle game

    - openarena: Based on the Ill III arena game

    - scorched3d: Based on the Scorched Earth game

    - neverball: A table-tilt ball game

    - neverput: A miniature golf game

    - ppr: Racing Tux the penguin down a mountain slope


    If you prefer more exciting games, many popular gaming sites (such as icculus.org)
    provide Linux versions of lots of graphical open-source games. Many of these games
    exploit advanced 3-D graphics to provide a realistic gaming environment.


    ![](img/f493a327f3c2a812b2e84b22c874990c_296_0.png)'
  merge: -1
