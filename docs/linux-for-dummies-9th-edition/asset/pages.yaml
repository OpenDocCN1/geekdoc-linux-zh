  md: '# 214 Part III: Getting Things Done


    Other office suites available for Linux users are the commercial OpenOffice. org-relative
    StarOffice (www.sun.com/staroffice), Applix Office (www.vistasource.com/products),
    KOffice (www.koffice.org), and GNOME Office (www.gnome.org/gnome-office/).


    # Installing the OpenOffice.org Suite


    Before you can take off your masterpieces, you must make sure that OpenOffice.org
    is available. When you installed Fedora, one of the installation options was to
    install the Office productivity software. If you selected this option, you installed
    most of the OpenOffice.org suite of programs.


    By default, Fedora includes these OpenOffice.org packages in the Office productivity
    installation:


    +   - Writer for word processing

    - Calc for spreadsheets

    - Impress for presentation graphics

    - Draw for drawing graphics

    - Math for creating complex mathematical formulas


    However, not all Linux distributions install all these pieces. For example, Ubuntu
    only installs the Writer, Calc, and Impress by default. There''s one additional
    OpenOffice.org package available, but it''s usually not installed by default:
    Base, which is used for creating personal databases.


    If you choose not to install the Office productivity software at installation
    time, or you need to install one of the packages that wasn''t installed by default
    in your Linux distribution, don''t sweat; you can do now without having completely
    reinstall your Linux distribution. Turn to Chapter 16 to find out how to add the
    OpenOffice.org packages from the software-package manager used in your distribution.


    After you''ve installed the OpenOffice.org packages, you''ll find most of them
    by choosing Applications:Office in GNOME or KDE (even the additional Base package
    if you install it).


    The two odds are the Draw and Math packages, which (unfortunately) often don''t
    get listings of their own. To access either of these packages, you''ll have to
    start one of the other OpenOffice.org packages (such as Writer), and then choose
    File:New. You see the options for creating a new Drawing (which starts Draw) or
    a new Formula (which starts Math).'
