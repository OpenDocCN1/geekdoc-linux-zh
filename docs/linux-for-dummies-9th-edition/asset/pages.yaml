  md: '# Chapter 6: Getting to Know the Linux Filesystem


    # # Where the computer is the lusr


    The /usr directory is often referred to as its own miniature filesystem tree.
    This directory has lots of important or interesting subdirectories, as shown in
    Table 6-2. An asterisk (*) at the end of a description indicates that you need
    to leave directory alone unless you have good reason to mess with it—after you
    gain lots of experience with Linux and know exactly what changes you need to make—so
    that you don''t accidentally alter your system needs in order to function correctly.
    An interesting thing to remember about this section of the filesystem is that
    many advanced Linux users often use /usr to store programs that can be shared
    with other Linux machines.


    | Table 6-2 Standard /usr Subdirectories |

    | Subdirectory | Contents |

    | --- | --- |

    | /usr/X11R | The files that manage the X Window System (the wireframe underneath
    your GUI).* |

    | /usr/bin | The commands that aren''t essential for users but are useful.* |

    | /usr/games | The games that you install on your system, except for those that
    you choose to place in /opt. |

    | /usr/include | The files that C programming language needs for the system and
    its programs.* |

    | /usr/lib | The shared code used by many of the programs in this /usr subhierarchy.**
    |

    | /usr/local | The programs and other items that you want to keep locally, even
    if you''re sharing everything else in /usr. |

    | /usr/sbin | The commands that aren''t essential for Administrators but are useful.*
    |

    | /usr/share | The information that you can use on any Linux machine, even if
    it''s running incredibly different hardware.* |


    # # Managing Your Filesystem without a Net (Or Mouse)


