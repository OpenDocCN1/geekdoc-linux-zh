  md: '# 360 Part IV: Junior Administrator Boot Camp


    +   - Masquerading: Configure the firewall to allow connections from your

    local network out to the Internet.


    +   - Port Forwarding: Redirect packets destined for one port to another.


    +   - ICMP Filter: Block error message packets and network testing packets

    (such as ping) from your workstation.


    +   - Custom Rules: Create your own restrictions in your firewall.


    Here''s a list of the most common network services. Select these items with

    ext caution. For the most part, you should just stick with the

    trusted services:


    +   - WWW: Web stuff; only needed if you''re running a Web server.


    +   - FTP: FTP stuff; you don''t need it if you''re not running an FTP server.


    +   - Mail (SMTP): Allows remote mail servers to send mail directly to your\computer.
    If you use an ISP for your e-mail (as most users do), you don''t

    eed to enable this.


    +   - NFS4: Network File Sharing. Enable this if you want to share folders

    directly with Linux or Unix computers.


    +   - SSH: Select this you need to keep open. Explain it in the next section.


    +   - Samba: Allows remote Microsoft computers to share files and printers

    on your Fedora computer. If you''re connected to a local Microsoft net-work, you
    may need to enable this to share files. If you''re directly con-nect to the Internet,
    it''s not a good idea to have this enabled.


    # # Keeping an Eye on Your Log Files with

    the System Log Viewer


    One other security issue you may want to configure concerns log files. Your

    network programs, kernel, and other programs all run log files, which contain

    records of what has been happening on your system. You may be amazed at

    how much information gets put in them!


    Most of your log files are in /var/log; take a look sometime.


    Fortunately, tools are available that can help you sift through the

    wheat to find the chaff of bugs and intruders. Both Ubuntu and Fedora

    provide the System Log Viewer, which allows you to easily scan through the

    major log files on the computer. Start the System Log Viewer by choosing

    System-Administration-System Log (see Figure 19-4). Enter your root pass-word,
    as all log files are restricted to root-only access.


    ![](img/f493a327f3c2a812b2e84b22c874990c_373_0.png)'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# # Chapter 19: A Secure Linux Box Is a Happy Linux


    Different Linux distributions store information in different log files. The System
    Log Viewer provides quick links to the major log files installed in your particular
    Linux system. If you want to view any other log files, you can do that by choosing
    File:Open from the menu bar, selecting the log file you want, and then clicking
    Open.


    ![](img/f493a327f3c2a812b2e84b22c874990c_374_0.png)


    Figure 19-4: The Ubuntu System Log Viewer.


    As you can see, there are lots of log files to dig into. Different Linux distributions
    use different log files; what you see depends on your particular Linux distribution.
    Here''s a quick summary of the log files you may run into:


    +   - **messages**: This is the main system log file. It contains error and status
    messages from the operating system as well as many applications and services.
    All messages entered in the messages log file are in this format:


    **timestamp application**: `message`


    You can use the filter feature to locate only messages from a specific application
    to help identify problems on the system. A sample entry looks like:


    ```

    Apr 9 19:34:55 textdbcp: DHCPREQUEST on eth0 to 192.168.73.254 port 67

    ```


    This entry shows that the eth0 network interface requested an IP address via DHCP.


    +   - **auth.log**: The **auth.log** file contains authentication attempts made
    by the system.


    +   - **boot.log**: This log file contains messages generated from the boot-up
    process (most of which scroll will go too fast to read while you''re boot-ing
    the system). As applications and services start, they report their'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# 362 Part IV: Junior Administrator Boot Camp


    status in the boot.log file. The boot.log file uses the same format as the messages
    log file. It is a great place to look for answers if Fedora doesn''t recognize
    any hardware on your system.


    +   - daemon.log: The daemon.log file logs activity of programs running in the
    background on the system.

    - secure: The secure log file reports every instance of a security request on
    the system, such as when a user tries to log in or requests special privileges.
    Check this log if you can''t log in to the system with a user account.

    - mailog: The mailog reports error and status messages from the mail system. Each
    time a message is sent or received, a log message is generated and stored in this
    log file. Check here if you can''t send or receive mail messages.

    - X.org.0: This log file tracks the status of the graphical x.org server on the
    computer. The x.org server provides the windows environment for the desktop. Check
    here if you''re having problems with the desktop on your monitor.


    In Fedora, the secure log file contains information about connection attempts
    and failed access attempts. It''s a good idea to peruse this log file on a regular
    basis to watch for intruders. If you see a lot of denied access requests, you
    may have someone trying to hack into your system.


    It also records each time a user requests root permissions. For example, when
    we started the System Log Viewer application, it required us to enter the root
    password. Doing so generated an entry in the secure log file:


    ```

    Mar 20 13:38:22 testbox userhelper: running /usr/sbin/ gnome-system-log with root
    privileges on behalf of ''rich''

    ```


    This entry identifies both the application that was run with root privileges and
    the user id that requested it.


    It''s also a good idea to peruse through the messages log file on a regular basis.
    If any system services fail to start, you''ll find out from entries in this log
    file.


    ![](img/f493a327f3c2a812b2e84b22c874990c_375_0.png)'
