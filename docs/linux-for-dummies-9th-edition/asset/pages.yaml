- img_proc: true
  md: '# 386 Part V: The Part of Tens


    2. If you''re not logged in as the root user, type the su command at the command
    line and press Enter to become the root user. Enter the root user password when
    prompted.


    3. Type the command chmod g+rws /foldername with the name of your specific group
    folder.


    If you created bowing and shopping folders, the command are


    ```

    chmod g+rws /bowling

    chmod g+rws /shopping

    ```


    The chmod Linux command changes the permissions on the specified folder. The individual
    options in the command are


    +   * g specifies that the permissions are added to the group settings.

    * r specifies that the group have read permissions to the folder.

    * w specifies that the group have write permissions to the folder.

    * s specifies that the folder group setting be used for all files created within
    the folder.


    4. Repeat Step 3 for every folder you''ve created.


    Whenever a user creates a file in one of the shared folders, the file''s group
    is set to the special group name you specified instead of the user''s primary
    group.


    This process ensures that other members of the group can access files created
    by one member of the group.


    5. Type exit at the command-line prompt to exit root mode, and then type exit
    again to exit the Terminal session.


