    The next step in the process is to build a sandbox for your virtual server to
    run. You need to define two things for the size of the sandbox: the amount of
    disk space to allocate for the virtual server and the amount of memory to use.


    These items are shared with the host system, but be careful how much you dedicate
    to the virtual servers! You need to leave enough for the host operating system
    to run on. You may have to experiment with a bit to find out how much is too much
    or too little for your environment.


