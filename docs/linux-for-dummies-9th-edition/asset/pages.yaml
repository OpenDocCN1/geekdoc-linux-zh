  md: '# Chapter 19


    # A Secure Linux Box Is a Happy Linux Box


    In This Chapter


    +   - Keeping your system up to date

    - Plugging in security holes

    - Using the System Log Viewer


    > I am Inspector Clouseau, and I am on official police business.

    — Inspector Clouseau


    You don''t leave the front door of your house open when you go to work, do you?
    How about leaving it shut and locked with a few big windows open? The problem
    is that many people do the equivalent every day with their computers, and they
    don''t know it! This chapter takes a look at where your computer''s open doors
    and windows are — and what you can do to secure them.


    Every user''s actions affect your overall system security. If your family members
    or officemates need access to your Linux machine, take the time to sit down and
    explain the factors of secure life to them.


    # Updating Your Software


    All users can download and install new software. Of course, which programs they
    can install are limited by user permissions. Here — as with any operating system
    — be sure you don''t get a version of a program that has been tampered with, and
    keep in mind that some are all-out fakes that try to trick folks into installing
    them.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# 354 Part IV: Junior Administrator Boot Camp


    Most Linux applications and other Linux software programs are distributed by way
    of the Internet. In fact, the development cycle of new Linux software — and updates
    to it depends on the Internet for file exchange, e-mail, and forum news discussions.
    Make sure that you and other users of Linux are comfortable with the Web sites
    they use and visit. You need to develop a list of trusted sites — those that provide
    you with the information you need and are not misleading in their presentation.


    ![](img/f493a327f3c2a812b2e84b22c874990c_367_0.png)


    As a starting point, you can trust all the Web sites referenced in this book because
    we have accessed all them. If either you or a user of Linux system is unsure whether
    to trust a particular Web site, do some research and perhaps asks others for their
    opinions.


    Chapter 16 details how to keep your distribution and its software up to date.
    Please, please do so! After all, the person in charge, your job is to make sure
    that your computer stays intruder-free. In addition to making sure that you do
    all the things you do for your user accounts and the superuser (root) account
    — such as making the passwords aren''t compromised — you have one further mandate:
    No matter what Linux distribution you''re running, you must keep up to date on
    emerging security problems.


    # Keeping Your Network Secure


    On a Linux server or workstation — or any computer at all, using any operating
    system — you should not have any network services running that you don''t intend
    to. Think of each network program running as a glass window or sliding door in
    your house. Each network service is a weak spot, and many nasty folks are out
    there on the Internet who like to go up to all the houses and make note of how
    many windows and glass doors are on them, what they are, and how easy they are
    to breach.


    # Controlling your services


    The more software you''ve installed on your system, the more services it may have
    running in the background. Both Ubuntu and Fedora provide a utility for us to
    control which applications the system starts automatically.


    In Ubuntu, you can see which services are activated by choosing Administration
    Services. The Settings window appears (shown in Figure 19-1). By default, you
    can only view the services; you can''t make any changes to them. Click the Unlock
    button, and then enter your password to gain access to this utility.'
  merge: -1
  pgno: 367
- img_proc: true
