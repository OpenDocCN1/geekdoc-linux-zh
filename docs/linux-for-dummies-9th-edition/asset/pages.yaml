    # Advanced preferences


    This section provides four tabbed settings of settings for more advanced features
    that most users probably won''t need to meet with:


    +   - General: The General tab lets you set features for the movement-impaired,
    add extra browser-control features, and specify whether you want Firefox to check
    if it''s the default browser configured for your system.


    +   - Network: Click the Settings button in the Connections section to use proxy
    servers to access online content. The proxy server provides a gateway to the Internet,
    where the network administrator can control access to sites you shouldn''t visit.
    The Offline Storage section allows you to set how much disk space Firefox is allowed
