  md: '# 260 Part III: Getting Things Done


    # Ripping Music Tracks from CDs


    Copying music from a CD to your own workstation is another topic that''s impossible
    to cover without at least acknowledging that both ethical and legal issues are
    involved. We''re not going to get into legalities here, but for personal ethics
    it''s fine to rip (copy) music off our own CDs for our use. We want to rip our
    favorite songs off CDs that we purchased and set them up so we can listen to them
    collectively in a random playlist off our computer''s hard drive, we don''t see
    a problem with this.


    That said, to rip tracks from your CDs in Linux, you need one of the popular ripping-software
    packages. You already saw how Rhythmbox can rip songs from audio CDs, so we take
    a look at a popular package — Sound Juicer that specializes in ripping songs from
    a CD. Because it specializes in only one thing, it provides a few additional options
    for us.


    The Sound Juicer package is available in most Linux distributions, including Fedora.
    If you don''t see it in the Multimedia area of your menu system, check out Chapter
    16 to install it.


    Once you have Sound Juicer, it''s easy to rip songs from an audio CD:


    +   Choose Applications:Sound & Video:Audio CD Extractor (sec Figure 13-10) on
    the Fedora GNOME desktop, or Applications:Multimedia:Audio CD Extractor on the
    Fedora KDE desktop.


    Sound Juicer starts, displaying the tracks on the CD. If your workstation is connected
    to the Internet, Sound Juicer also displays the album and track titles.


    +   For each song that you don''t want to rip, unchecked the check box next to
    the song.


    The check mark disappears for each song that you don''t want to digitize.


    +   Choose Edit:Preferences.


    The Preferences dialog box appears, as shown in Figure 13-11.


    +   Select your preferred sound format is limited in the Output Format drop-down
    list box.


    If your available space is limited, we strongly suggest Ogg Vor (.oga) because
    this format is easily handled on Linux machines without any inherent legal problems,
    and is also better compressed than MP3 for equivalent sound.


    However, if you want higher sound quality for a home sound system, then FLAC (.flac)
    — another open format, but without any loss in sound quality.'
  merge: -1
