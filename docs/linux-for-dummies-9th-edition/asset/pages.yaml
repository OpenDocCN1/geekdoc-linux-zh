  md: '# 42 Part I: Getting Your Feet Wet


    # Things to Consider Before You Begin Installation


    There are two ways you can install Linux from the DVD-ROM included with this book:


    +   - Copy the Ubuntu LiveCD ISO image from the DVD-ROM, burn it to CDs, and then
    boot from the CDs to install Ubuntu.

    - Copy the Fedora full installation DVD image from the DVD-ROM, burn it to CDs,
    and then boot from the CDs to install Fedora.


    To begin the installation from the CD-ROMs that you create from the ISO image,
    you may first need to change your system to (that is boot) from CD-ROM. Many systems
    are configured to do this already, so you may not need to make any changes. For
    some systems, you may need to press a key during the boot process to bring up
    a menu, which allows you to select which device to boot from. If your boot screen
    doesn''t list the key to press, consult your system''s manual for more information.


    In this chapter, we concentrate on three different installation methods — installing
    Ubuntu from the LiveCD image, installing Fedora from an installation-DVD-ROM,
    and installing Ubuntu using the Wubi package. We selected these methods for two
    reasons:


    +   - The Ubuntu LiveCD installation and the Fedora full-installation methods
    represent the two ways to install most Linux systems.

    - Covering the installation of every Linux distribution in existence would make
    this book into a set of encyclopedias.


    Once you get the hang of installing Linux using these methods, you can tackle
    just about any Linux installation out.


    If you''re installing another version of Ubuntu or Fedora, or a different distribution
    of Linux altogether, your screens will look different from what is shown in this
    book. Each distribution''s installation routine covers the same basic tasks, but
    the specific actions may be presented in a different order, or they may be customized
    to look different on-screen. For example, one distribution may present account
    creation before disk partitions; another may reverse the order of those two topics.
    Most distributions go through the same basic choices, so reading this chapter
    could still be helpful for something other than Ubuntu or Fedora.


    ![](img/f493a327f3c2a812b2e84b22c874990c_55_0.png)'
  merge: -1
