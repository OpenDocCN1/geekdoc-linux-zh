  md: '# Chapter 17: Working without the GUI


    You may want to use command completion in two situations: to enter a command or
    to complete a filename.


    # Completing a command


    Suppose you want to type a command, but you can remember only that it begins with
    the letters up and is supposed to return the length of time that has passed since
    the system was rebooted. Type up at the command prompt and press Tab:


    ```

    rich@testbox:~ up [TAB]

    ```


    One of two things happens:


    +   * If only one matching command is in the search path (directory locations
    for searching for programs; echo $PATH to find out what yours is), your command
    line is completed with that command, and the system waits for you to press Enter
    to complete the command.

    * If you hear a beep, it means that more than one command begins besides. Simply
    press Tab a second time, and all the possibilities are displayed. Locate the command
    on the list and continue typing until the first letters are unique — at which
    point you can press the Tab key to complete the command. If nothing is displayed
    after you press Tab twice, there is no match at all.


    # Completing a filename


    Command-line completion isn''t only for commands; if you are typing a filename
    on your command line, you only need to type the first few characters and press
    Tab. The shell usually searches the current working directory for filenames that
    match what you have typed and subsequently completes the filename on the command
    line. This feature behaves the same as the command-completion feature in that,
    if more than one file contains the letters you type, you hear a beep and need
    to press Tab again to see a list of choices.


    It takes a little getting used to, but after you have control of the Tab key and
    the shell command-line completion feature, you may wonder how you ever got along
    without it.


