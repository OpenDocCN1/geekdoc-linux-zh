  md: '# # Chapter 8


    # # Connecting to the Internet


    **In This Chapter**


    +   - Gathering connection information

    - Connecting to your Internet service provider (ISP)

    - Troubleshooting your connection


    > Every improvement in communication makes the bore more terrible.

    — Frank Moore Colby


    You may already be connected to the Internet if you''re on a machine that''s connected
    to a LAN and you''ve configured the networking during installation. To test whether
    you have a connection, open a Web browser and try to go to an outside Web site
    (such as www.gnu.org). If it works, you''re up! No need for this chapter. read
    on.


    # # Getting Information You # Need from Your ISP


    Most reputable ISPs provide you with a customer information sheet after you sign
    up for their services. This sheet should include the following information (at
    minimum):


    +   - Local telephone dial-in numbers for modem users

    - User login name

    - User login password

    - E-mail address'
  merge: -1
