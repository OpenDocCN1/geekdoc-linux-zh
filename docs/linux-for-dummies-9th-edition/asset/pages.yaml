  md: '# Chapter 2: Prepping Your Computer for Linux


    # Defragmenting files


    During the normal course of using your workstation, the system writes pieces of
    files at random places on the hard drive. This can spread data out over the entire
    disk. Before you split the hard drive into partitions, you need to ensure that
    you don''t lose any of the data that Windows strewed around — and that includes
    both system and data files.


    To make a cleanly partitioned hard drive, first you''ll need to make sure that
    all Windows data is moved toward the beginning of the hard drive. This is commonly
    done using a defragmenting tool.


    Defragmenting is a common process in the Windows world. It''s the process of realigning
    how files are stored on the hard drive. As Windows creates and removes files,
    file data gets split into blocks scattered around the hard drive. Windows defragsembles
    the blocks so they form contiguous files, and puts those files in an equally contiguous
    area near the beginning of the hard drive area.


    ![](img/f493a327f3c2a812b2e84b22c874990c_46_0.png)


    All versions of Windows include a utility for defragmenting the hard drive. You
    can get to the defragmentation utility from the Computer Management window. Just
    select the Disk Fragmenter option.


    In Vista, disk defragging happens behind the scenes, without any indication of
    what''s going on. Windows XP provides a handy defragmenter window that shows progress
    as files are moved about, as shown in Figure 2-7.


    > Figure 2-7: The Windows XP Defragmenter utility.


    ![](img/f493a327f3c2a812b2e84b22c874990c_46_1.png)'
