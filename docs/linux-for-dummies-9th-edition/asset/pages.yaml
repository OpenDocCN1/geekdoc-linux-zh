  md: '# # Chapter 7: Using the Filesystem


    +   - **Icons**: Display files and folders as icons.

    - **Details**: Display detailed information for each file and folder.

    - **Columns**: Display two columns of information, with the current folder shown
    in the left-side column, and files and folders in the selected folder appearing
    in the right-side column.

    - **Preview**: Display a thumbnail image of the contents of text and image files.

    - **Split**: Display two windows you can use to drag and drop files easily from
    one location to another.


    ![](img/f493a327f3c2a812b2e84b22c874990c_142_0.png)


    **Figure 7-5:** The user''s home folder as seen in the Dolphin file manager.


    +   - **The navigation bar**: The area on the left side of the window that displays
    location icons.

    - **The view**: Area to display files and folders contained in the current folder.

    - **The information area**: This area, on the right side of the window, displays
    a thumbnail preview of the file, if possible (such as text and image files), along
    with file details.

    - **The status bar**: Displays the number of files and folders in the currently
    viewed folder — along with the current amount of free space available on the disk.


    When single-click a folder in the view window, the folder opens in the same window,
    and the path (a *breadcrumb*) appears above the view window. Just like leaving
    breadcrumbs in the forest to find your way back, you can click anywhere along
    the breadcrumb path (also known as the *pathname*) to find your way back to the
    folder you started.'
