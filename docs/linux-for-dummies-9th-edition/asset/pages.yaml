    ![](img/f493a327f3c2a812b2e84b22c874990c_30_0.png)


    We use the Fedora distribution in this book to illustrate how to work with a core
    Linux distribution.


    In the early days of Linux, a distribution was released as a set of floppy disks.
    You had to download groups of files and then manually copy them onto disks. It
    would usually take 20 or more disks to make an entire distribution! Needless to
    say, this was a painful experience. Nowadays, with computers having CD and DVD
    players built in, Linux distributions are released as either a CD set or a single
    DVD. This makes installing Linux much easier.


    # The Linux LiveCD


    While having lots of options available in a distribution is great for Linux geeks,
    it can become a nightmare for beginning Linux users. Most distributions ask a
    series of questions during the installation process to determine which applications
    to load by default, what hardware is connected to the computer, and how to configure
    the hardware. Beginners can often find these questions confusing. As a result,
    they either load way too many programs on their computers'
