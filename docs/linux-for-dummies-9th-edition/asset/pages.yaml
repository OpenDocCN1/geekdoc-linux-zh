  md: '# 152 Part II: Getting Up to Speed with Linux


    # # It''s All Fun and Games Until Something Doesn''t Work


    In a perfect world, the network configuration steps in the preceding section work
    100 percent of the time — because the Linux vendors have truly hidden all the
    mystery that has traditionally surrounded networking. Unfortunately, in many situations
    (mostly related to mods and hardware), a simplified configuration doesn''t work.
    If you can''t connect to the Internet after following these steps, an excellent
    site to find help is LinuxQuestions.org (www.linuxquestions.org). And yeah, we
    know — you''ll have to use a computer that has Internet access to get that. (Catch-22
    anyway?) It''s simply impossible to anticipate the range of problems people can
    run into, and the Linux community is your best bet; this site is well known for
    its helpful community members.


    Also, go to your favorite Websearch site and search for the error message you''re
    getting from the system — it doesn''t hurt to add the hardware make and model
    and the name of your distribution as well if just the error message isn''t working.
    When you''re trying to figure out what''s wrong with your network connection —
    or trying to gather information that can help someone else figure out what''s
    wrong — you can use a cool tool: the handy `ping` command-line program.


    ![](img/f493a327f3c2a812b2e84b22c874990c_165_0.png)


    Some firewalls block the kind of traffic sent with `pings`, so these commands
    don''t always work as expected, even with a good connection.


    The ping command works like a submarine using sonar to detect other objects in
    the ocean. Ocean sends out a `ping` signal, which reflects off a hard surface.
    By measuring the amount of time between sending the ping and the ping''s return,
    the submarine''s engineer can determine whether an object is out there and how
    far from the submarine it is.


    The ping command in Linux provides information similar to what sonar provides
    — and it''s so useful that you see it here as both a Linux command and a time-horned.
    If you consider the Internet to be your ocean, you can determine, by `pinging`,
    what other computers exist — and how long it takes for your `ping` to return.
    You can use this command in the format `ping hostname` or `ping ipaddress`, such
    as `ping example.com` or `192.168.1.5`. If you can''t ping another computer in
    your house or office (assuming you have them all connected with Ethernet and not
    on separate dialup connections), something is wrong with the machine you''re pinging
    from. On the other hand, if you can ping another machine in your house or office
    but you can''t ping a machine elsewhere on the Internet, something may be wrong
    with your connection to your ISP.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Chapter 8: Connecting to the Internet


    Latency, the amount of time it takes for a signal to reach the Internet, has to
    do with physical distance. Rather, factors such as network traffic, bandwidth,
    and network hardware all contribute to low latency. These factors determine whether
    a ping command to your neighbor''s computer takes longer than ping a host at (say)
    the South Pole.


    For example, ping Yahoo! by opening a command prompt (see Chapter 17) and typing
    the following command:


    ```

    ping www.yahoo.com

    ```


    Press Ctrl+C to stop the ping command; otherwise your computer continues to ping
    the target.

