    Each row in the Table Design represents a data field in the table. Each field
    must have a unique Field Name and be assigned a Field Type. The Field Type defines
    the type of data present in the field (characters, numbers, dates, and so on).
    Use the Description area to write a brief description of what the data field means.


    Creating a new table is easy:


    +   1. Enter a text name for the Field Name describing the data.

    2. Select a Field Type from the drop-down menu.

    3. Enter a brief description in the Description text area.

    4. If the field is a primary key, right-click the left of the row and choose Primary
    Key.


    A table''s *primary key* is a data field that can uniquely identify each record
    in the table. In the example in Figure 12-9, each employee is identified by a
    unique employee ID because more than one employee can have the same name.'
