  md: 'The icons on your desktop (Figure 4-1) doesn''t show any icons on the desktop,
    because the default Ubuntu installation doesn''t include icons. Find out how to
    add icons to your desktop in the “Configuring Your Desktop Appearance” section.)


    # The menus


    GNOME has three primary menus, all of them visible on the upper panel. From left
    to right, they are


    +   * Applications: Programs available through the graphical user interface (GUI).


    +   * Places: Shortcuts to special locations on your hard drive. (Note that you
    don''t have to use the special directories created for you in places as Documents,
    Pictures, and so on.) Chapter 7 addresses how to view directories and files in
    far more detail.


    +   * System: Personal and system settings, with more general overall system commands.


    Menu items that have an arrow to the right offer submenus, which can open by holding
    your mouse pointer over menu choice. Often the submenu have their own submenus
    within, offering even more programs.


    In the following sections, we detail the more common submenus you''ll find within
    these three menus.


    # Applications


    Just as everything else, each Linux distribution likes to provide its own style
    to the GNOME menu — although a few menu items seem to stay consistent in the GNOME
    menu regardless. Table 4-1 lists the common items on the Applications menus in
    most Linux distributions.


    | Table 4-1 Applications Menu Content |

    | Menu Choice | What You Find |

    | Accessories | Small, specific-function programs. Contains a calculator, character
    map, dictionary, screen-shot program, text editor, and more. |

    | Games | A collection of games. |

    | Graphics | A variety of graphics programs, including The GIMP (see Chapter 14).
    |


    (continued)'
