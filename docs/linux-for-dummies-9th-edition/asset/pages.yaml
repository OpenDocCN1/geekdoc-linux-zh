    # Making space


    Ultimately you may have to resize your partitions — for one of several reasons:


    +   * You may have some unallocated space but less than 10GB of it.

    * You may have 10GB of unallocated space, but it''s broken up into numerous across
    your drives and needs to be consolidated.

    * You may not have any unallocated space at all (the most common reason).


    In all these situations, you will need to move data around to make room — not
    only to install Linux but also to store any files you want to keep in your Linux
    filesystem.


    The key is to determine if you have extra space available on your existing C:
