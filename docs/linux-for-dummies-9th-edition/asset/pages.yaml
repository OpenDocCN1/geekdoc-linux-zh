  md: '# Chapter 20: The Virtual World 377


    +   - Take Snapshot: This is not related to taking a screen capture of the window.
    A snapshot in VirtualBox allows you to save a copy of the virtual disk file as
    it exists at the time. You can then start the virtual server using this copy of
    the virtual disk instead of the normal version. It provides a great way to perform
    backups of virtual servers at any point.


    +   - Session Information dialog box: Provides basic information about the virtual-server
    session presently running, as shown in Figure 20-10.


    The Runtime tab shows current statistics on the hard drive, CD-ROM, and network-adapter
    activity.


    +   - Reset: Emulates pressing the Reset button on the workstation. This usually
    sends a shutdown to the guest operating system and restarts the virtual server.


    +   - Pause: Places the virtual server in a suspended mode, but doesn''t send
    any signals to the guest operating system to shut it down.


    +   - ACPI Shutdown: Emulates hitting the power button on the workstation. This
    usually sends a shutdown to the guest operating system and stops the virtual server
    when the guest operating system has finished shutting down.


    +   - Close: Saves the VirtualBox console window. If you select this option with
    the guest operating system, VirtualBox displays a Close dialog box. You can attempt
    to send the shutdown to the guest operating system, save the system state as a
    snapshot, or just perform a power-down.


