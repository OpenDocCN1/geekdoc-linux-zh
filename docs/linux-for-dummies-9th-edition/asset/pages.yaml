    **Message list:** Displays your messages, sorted by any of the columns (just click
    a column to sort by it).

    **Preview pane:** Displays the currently selected e-mail message.


    Before you can start anything, you may have to customize the settings. To do that,
    choose Settings->Configure KMail. The Configure dialog box, in Figure 10-13, appears.


