  md: '# Chapter 12: Word Processing and More with OpenOffice.org 219


    Not only can you save new documents in various formats, but you can also read
    documents created on other word-processing programs. Here''s a list of the different
    document types you can use with OpenOffice.org Writer:


    +   - OpenDocument (ODT) format: A proposed open standard that may be supported
    by all word-processing programs. (What a concept)

    - OpenOffice 1.0 (SWW) format: The original OpenOffice document format.

    - Microsoft Word 97/2000/XP (DOC) format: Yes, you can read and write Word documents
    with Writer.


    The current version of OpenOffice.org can''t open Word 2007 (.docx). However,
    if you have access to a copy of Word 2007, you can convert these documents to
    .doc format, then read them in OpenOffice.org. As with any type of document conversion,
    be careful that you don''t lose any important features in your document during
    the conversion.


    +   - Microsoft Word 95 (DOC) format: Even some of the old Word formats.

    - Microsoft Word 6.0 (DOC) format: And even some of the really old Word formats.

    - Rich Text (RTF) format: A standard format for saving basic font and document
    information.

    - StarOffice Writer 3.0 – 5.0 (SDW) format: Sun''s StarOffice word processor (a
    close cousin to OpenOffice.org).

    - Microsoft Word 2003 (XML) format: An attempt by Microsoft to create a standard
    word-processing document format by using the XML markup language.


    Although not available in the Save As dialog box, the OpenOffice.org Writer toolbar
    allows you to export any document format to the PDF document format. This feature
    alone can save you from having to purchase an expensive commercial product (from
    a commercial software company that shall remain nameless).


    ![](img/f493a327f3c2a812b2e84b22c874990c_232_0.png)


