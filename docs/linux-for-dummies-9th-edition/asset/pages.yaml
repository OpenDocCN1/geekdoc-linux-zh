  md: '# # Chapter 6


    # # Getting to Know the Linux Filesystem


    **In This Chapter**


    +   - Discovering your way around the filesystem

    - Adding removable media to the filesystem

    - Understanding filesystem permissions


    > I have an existential map. It has “You are here” written all over it.

    — Steven Wright


    One of the most frustrating things about mastering a new operating system can
    be figuring out where it keeps files. Instead of keeping all the system files
    in a single directory (such as the C:\Windows directory in Microsoft Windows),
    Linux follows the logic of UNIX cousins and spreads them out a bit more. Although
    the Linux and Windows involve different methods, they are both logical, although
    it may not feel that until you get a handle on where to look.


    # # Putting Together the Pieces of the Puzzle


    It helps to understand the lingo before getting started. A lot of this may be
    familiar to you from other operating systems such as Microsoft Windows, but you
    need to get used to some differences. To start, the word filesystem is actually
    used in more than one way. The general use (and what we typically refer to throughout
    the book) means “the files and directories (or folders) you have access to right
    now, instead of referring to the method used to store data on the hard drive (such
    as the ext3 filesystem discussed in Chapter 3).'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# 108 Part II: Getting Up to Speed with Linux


    Here''s what you need to know about filesystems:


    +   - Linux uses a forward slash (/) between directories, not the backslash (\)
    that Windows does. So, the file yum.conf in the directory etc/yum.conf.

    - Files and directories can have names up to 256 characters long, and these names
    can contain underscores (_), dashes (-), and dots (.) anywhere. So my.big.file
    or my.big_file or my-big-file are all valid filenames.

    - Upper and lowercase matter. They have to match exactly. The files yum.conf and
    Yum.conf are not the same as Linux is case-sensitive — it pays attention to the
    case of each character. Windows, on the other hand, is case-insensitive.

    - The same filesystem can span multiple partitions, hard drives, and media (such
    as CD-ROM drives). You just keep going down through subdirectories, not having
    to care whether something is on disk A, B, or whatever.


    # Touring the Linux Filesystem


    In this section, we look at the contents of the typical Linux filesystem. Being
    at least a bit familiar with it helps you track things down later, and familiarity
    will help you to know where it is safe to mess with things and where you need
    to be very careful.


    # The root of the tree


    Everything in the Linux filesystem is relative to the root directory — not to
    be confused with the system Administrator, who is the root user. The root directory
    is referred to as /, and it is the filesystem''s home base — a doorway into all
    files. As such, it contains a relatively predictable set of subdirectories. Each
    distribution varies slightly in terms of what it puts in the root directory, but
    certain standards exist to which all varieties of Linux conform. The standards
    keep the Linux world somewhat sane.


    If you''re interested in these standards, go to www.pathname.com/fhs and look
    at the latest version of the rules.


    ![](img/f493a327f3c2a812b2e84b22c874990c_121_0.png)'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Chapter 6: Getting to Know the Linux Filesystem


    Table 6-1 lists what you might find in the base directory (that is, in /) in Linux.
    This list can vary on what you installed. An asterisk (*) at the end of a description
    indicates that you shouldn''t mess with this directory unless you have a really
    good reason because it contains files that are very important to the functioning
    of your system. Really, most of the base directories should be left alone. There
    are sections inside them that are safe to change, but you have to know exactly
    what''re looking for before ranging around.


    | Directory | Contents |

    | --- | --- |

    | /bin | Essential commands that everyone needs to use at any time.* |

    | /boot | The information that boots the machine, including your kernel.* |

    | /dev | The device drivers for all the hardware that your system needs to interface
    with.* |

    | /etc | The configuration files for your system.* |

    | /home | The home directories for each of your users. |

    | /lib | The libraries, or the code that many programs (and the kernel) use.*
    |

    | /media | A spot where you add temporary media, as floppy disks and CD-ROMs,
    not all distributions have this directory. |

    | /mnt | A spot where you add extra filesystem components as net-worked drives
    and items you''re permanently adding to your system but aren''t as temporary as
    CD-ROMs and floppies. |

    | /opt | The location that some people decide to use (and some programs want to
    use) for installing new software packages, such as word processors and office
    suites. |

    | /proc | Current settings for your kernel (operating system).* |

    | /root | The superuser''s root user''s home directory. |

    | /sbin | The commands that system Administrator needs access to.* |

    | /srv | Data for your system''s services (the programs that run in the background).*
    |

    | /sys | Kernel information about your hardware.* |

    | /tmp | The place where everyone and everything stores temporary files. |

    | /usr | A complex hierarchy of additional programs and files. |

    | /var | The data that changes frequently, such as log files and your mail.|


    *Some of these directories have equally important subdirectories, which we cover
    in the upcoming sections.'
