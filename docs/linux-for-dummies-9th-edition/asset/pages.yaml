    ```

    matrix[# <?> ## <?> # <?>]

    ```


    4. Replace each of the <?> entries with the proper letters and numbers for your
    formula.


    When we type the letters and change matrix{<?> # <?> ## <?> # <?>} to matrix{A
    # B ## C # D}, we get the result shown in Figure 123.


    5. Continue adding components to the formula until you finish.


    Suppose that you want to multiply the matrix by 3. To find out, press Enter to
    go down to the next line in the Commands window, right-click to display the menu,
    and choose Unary/Binary Operators<a Times b. This choice adds the phrase <?> times
    beneath the matrix code. Now you know how to format a multiplication operation,
    erase this phrase from the screen and use it as a guideline to change your formula
    to:


    ```

    3 times matrix(A # B ## C # D)

