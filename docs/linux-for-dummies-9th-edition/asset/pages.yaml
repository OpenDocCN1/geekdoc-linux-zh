  md: '# Finding Things


    Both the GNOME and KDE desktops provide easy ways for you to search for items
    in the filesystem. For the KDE desktop, the KFind utility is the way to go. GNOME
    includes File Searcher.


    # KFind


    Start KFind by choosing KDE:Applications:Find Files/Folders. The KFind main window,
    as shown in Figure 7-14, appears.


    ![](img/f493a327f3c2a812b2e84b22c874990c_152_0.png)


    > Figure 7-14: The KFind window''s Properties tab.


    Here''s how to find what you''re looking for:


    +   In the main KFind tab, look for files or folders by their names or locations.

    nThe Contents tab provides a form you can fill out if you''re interested in looking
    for specific contents within a text file (be careful, though; this search method
    can take awhile to complete).

