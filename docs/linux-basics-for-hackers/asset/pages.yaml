- img_proc: true
  md: '# # 16

    # AUTOMATING TASKS WITH JOB SCHEDULING


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_257_0.png)


    Like anyone using Linux, the hacker often has jobs, scripts or other tasks, that
    they want to run periodically. You might, for example, want to schedule automatic
    regular file backups of your system, or maybe you want to rotate log files as
    we did in Chapter 11. The hacker, on the other hand, may also want to have their
    system run the *MySQLscanner.sh* script from Chapter 8 every night or while they''re
    at work or school. These are all examples of scheduling automatic jobs. Scheduling
    jobs allows you to run tasks without having to think about it, and you can schedule
    jobs to run when you''re otherwise not using your system so have plenty of free
    resources.


    The Linux admin—or the hacker for that matter—may also want to set certain scripts
    or services to start automatically when their system boots up. In Chapter 12,
    we looked at using the PostgreSQL database in association with the hacker/pentest
    framework Metasploit. Rather than manually starting the PostgreSQL database every
    before starting Metasploit, you can have PostgreSQL—or any service or script—start
    automatically when the system boots up.


    In this chapter, you''ll learn more about how to use the cron daemon and crontab
    to set up scripts to run automatically, even while the system is unattended. You''ll
    also learn how to set up startup scripts that'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'automatically run whenever the system is booted, which will provide you with
    the necessary services that you''ll need to run during your busy day of hacking.


    # Scheduling an Event or Job to Run on an Automatic Basis


    The cron daemon and the cron table (crontab) are the most useful tools for scheduling
    regular tasks. The first, crond, is a daemon that runs in the background. The
    cron daemon checks the cron table for which commands to run at specified times.
    We can alter the cron table to schedule a task or job to execute regularly on
    a particular time daily, or every so many weeks or months.


    To schedule these tasks or jobs, enter them into the cron table file, located
    at /etc/crontab. The cron table has seven fields: the first five are used to schedule
    the time to run the task, the sixth field specifies the user, and the seventh
    field is used for the absolute path to the command you want to execute. If we
    were using the cron table to schedule a script, we could simply put the absolute
    path to the script in the seventh field.


    Each of the five time fields represents a different element of time: the minute,
    hour, day of the month, month, and day of the week, in that order. Every element
    of time must be represented numerically, so March is represented as 3 (you cannot
    simply input “March”). Days of the week begin at 0, which is Sunday, and end at
    7, which is also Sunday.

    Table 16-1 summarizes this.


    Table 16-1: Time Representations for Use in the crontab


    | Field Time unit | Representation |

    |---|---||

    | 1 | Minute | 0–59 |

    | 2 | Hour | 0–23 |

    | 3 | Day of the month | 1–31 |

    | 4 | Month | 1–12 |

    | 5 | Day of the week | 0–7 |'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'So, if we had written a script to scan the globe for vulnerable open ports
    and wanted it to run every night at 2:30 AM, Monday through Friday, we could schedule
    it in the crontab file. We will walk through the process of how to get this information
    into the crontab shortly, but first let''s discuss the format we need to follow,
    shown in Listing 16-1.


    ```

    M H DOM MON DOW USER COMMAND

    30 2 * * 1-5 root /root/mysanningscript

    ```


    # Listing 16-1: The format for scheduling commands


    The crontab file happily labels the columns for you. Note that the first field
    provides the minute (39), the second field provides the hour (2), the fifth field
    provides the days (1-5, or Monday through Friday), the sixth field defines the
    user (root), and the seventh field is the path to the script. The third and fourth
    fields contain asterisks (*) because we want this script to run every day Monday
    through Friday regardless of the day of the month or the month.


    In Listing 16-1, the first field defines a range for the day of the week by using
    a dash (-) between the numbers. If you want to execute a script on multiple noncontiguous
    days of the week, you can separate those days with commas (,). Thus, Tuesday and
    Thursday would be 2,4.


    To edit crontab, you can run the crontab command followed by the -e (edit) option:


    ```

    kali >crontab -e

    Select an editor. To change later, run ''select-editor''.

    1. /bin/nano     <--default

    2. /usr/bin/ncedit

    3. /usr/bin/vim.basic

    4. /usr/bin/vim.gtk

    5. /usr/bin/vim.tiny

    Choose 1-5 [1]:

    ```


    The first time you run this command, it will ask which editor you would like to
    use. The default is /bin/nano, the 1 option. If you choose this option, it will
    open directly to crontab.'
  merge: -1
  pgno: 259
