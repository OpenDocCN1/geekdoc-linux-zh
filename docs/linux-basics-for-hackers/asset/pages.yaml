  md: '# Using sed to Find and Replace


    The sed command lets you search for occurrences of a word or a text pattern and
    then perform some action on it. The name of the command is a contraction of stream
    editor, because it follows the same concept as a stream editor. In its most basic
    form, sed operates like the Find and Replace function in Windows.


    Search for the mysql in the snort.conf file using grep, like so:


    ```

    kali >cat /etc/snort/snort.conf | grep mysql

    include $RULE_PATH/mysql.rules

    #include $RULE_PATH/server-mysql.rules

    ```


    You should see that the grep command found two occurrences of mysql.


    Let''s say you want to replace every occurrence of mysql with MySQL (remember,
    Linux is case sensitive) and then save the new file to snort2.conf. You could
    do this by entering the command shown in Listing 2-6.


    ```

    kali >sed s/mysql/MySQL/g /etc/snort/snort.conf > snort2.conf

    ```


    Listing 2-6: Using sed to find and replace keywords or phrases


    The command performs the search: first give the term you are searching for (mysql)
    and then the term to replace it with (MySQL), separated by a slash (/). The g
    command tells Linux that the replacement performed globally. Then the result is
    saved to a new file named snort2.conf.


    Now, when you use grep with snort2.conf to search for mysql, you’ll see that no
    instances were found, but when you search for MySQL, you’ll see two occurrences.


    ```

    kali >cat snort2.conf | grep MySQL

    include $RULE_PATH/MySQL.rules

    #include $RULE_PATH/server-MySQL.rules

    ```'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'If you wanted to replace only the first occurrence of the term mysql, you would
    leave out the trailing g command.


    ```

    kali >sed s/mysql/MySQL/ snort.conf > snort2.conf

    ```


    You can also use the sed command to find and replace any specific occurrence of
    a word rather than all occurrences or just the first occurrence. For instance,
    if you want to replace only the second occurrence of the word mysql, simply place
    the number of the occurrence (in this case, 2) at the end of the command:


    ```

    kali >sed s/mysql/MySQL/2 snort.conf > snort2.conf

    ```


    This command affects only the second occurrence of mysql.


    # Viewing Files with more and less


    Although cat is a good utility for displaying files and creating small files,
    it certainly has its limitations when displaying large files. When you use cat
    with snort.conf, the file scrolls through every page until it comes to the end,
    which is not very practical if you want to glean any information from it.


    For working with larger files, we have two other viewing utilities: more and less.


    # Controlling the Display with more more


    The more command displays a page of a file at a time and lets you page down through
    it using the ENTER key. It''s the utility that the man pages use, so let''s look
    at it first. Open snort.conf with the more command, as shown in Listing 2-7.


    ```

    kali >more /etc/snort/snort.conf

    --snip-

    # Snort build options:

    # Options: --enable-gre --enable-pls --enable-targetbased

    --enable-ppm --enable-perfprofiling enable-zlib --enable-active

    ```'
  merge: -1
