  md: 'We can get all that information and more using the tools of the airircack-ng
    suite. I''ve mentioned this suite of Wi-Fi hacking tools a few times before, and
    now it''s time to actually use it. This suite of tools is included in every version
    of Kali, so you don''t need to download or install anything.


    To use these tools effectively, you first need to put your wireless network card
    into monitor mode so that the card can see all the traffic passing its way. Normally,
    a network card captures only traffic destined specifically for that. Monitor mode
    is similar to promiscuous mode on wired network cards.


    To put your wireless network card in monitor mode, use the airmon-ng command from
    the aircack-ng suite. The syntax for this command is simple:


    ```

    airmon-ng start/stop/restart interface

    ```


