- img_proc: true
  md: '| Time format | Meaning |

    |---|---|

    | at 7:20pm | Scheduled to run at 7:20 PM on June 25, 2019 |

    | 06/25/2019 | |


    When you enter the daemon with the specified time, at goes into interactive mode
    and you are greeted with an at> prompt. Here is where you enter the command you
    want executed at the specified time:


    ```

    kali >at 7:20am

    at >/root/myscanningscript

    ```


    This snippet will schedule myscanningscript to execute today at 7:20 AM.


    # Summary


    Managing processes in Linux is a key skill for every Linux user and hacker. You
    must be able to view, find, kill, prioritize, and schedule processes to manage
    your Linux instance optimally. A hacker will often need to find processes on the
    target they want to kill, such as the antivirus software or a firewall. They will
    also need to manage multiple processes in an attack and prioritize them.


