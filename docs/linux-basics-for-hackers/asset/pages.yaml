  md: "# # 9\n COMPRESSING AND ARCHIVING\n\n![](img/83bc88dfd58e7c86e47f07708dac7feb_158_0.png)\n\
    \nHackers often need to download and install new software, as well as send and\
    \ download multiple scripts and large files. These tasks are easier if these files\
    \ are compressed and combined into a single file. If you come from the Windows\
    \ world, you will probably recognize this concept from the .zip format, which\
    \ combines and compresses files to make them smaller for transferring over the\
    \ internet or removable media. There are many ways to do this in Linux, and we\
    \ look at a few of the most common tools for doing so in this chapter. We also\
    \ look at the dd command, which allows you to copy entire drives, including deleted\
    \ files on those drives.\n\n# ## What Is Compression?\n\nThe interesting subject\
    \ of compression could fill an entire book by itself, but for this book we only\
    \ need a rudimentary understanding of the process. Compression, as the name implies,\
    \ makes data smaller, thereby requiring less storage capacity and making the data\
    \ easier to transmit. For your purposes as a beginning hacker, it will suffice\
    \ to categorize compression as either lossy or lossless."
