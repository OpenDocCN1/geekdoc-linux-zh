  md: '# # Adding Services to rc.d


    You can add services for the rc.d script to run at startup using the update-rc.d
    command. This command enables you to add or remove services from the rc.d script.
    The syntax for update-rc.d is straightforward; you simply list the command followed
    by the name of the script and then the action to perform, like so:


    ```

    kali >update-rc.d <name of the script or service>

    <remove|defaults|enable>

    ```


    As an example of how you can use update-rc.d, let''s assume you always want to
    start upon PostgreSQL database so your Metasploit framework can use it to store
    pentesting and hacking results. You use update-rc.d to add a line to your rc.d
    script to have it up and running every time you boost your system.


    Before you do that, let''s check whether PostgreSQL is running on your system
    already. You can do so using the ps command and piping it to a filter looking
    for PostgreSQL using grep, like so:


    | root 3876 0.0 0.0 12720 964pts/1 S+ 14.24 0.00 grep postgresql |


    This output us that the process ps found running for PostgreSQL was the very command
    we ran looking for it, so there is no PostgreSQL database running on this system.


    Now, let''s update our rc.d to have PostgreSQL run automatically at bootup:


    ```

    kali >update-rc.d postgresql defaults

    ```


    This adds the line to the rc.d file. You need to reboot the system for the change
    to take place. Once you''ve done that, let''s again use the ps command with grep
    to look for a PostgreSQL process:'
