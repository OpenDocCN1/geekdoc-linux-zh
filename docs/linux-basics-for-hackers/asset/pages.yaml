  md: 'terminal interface and file structure.


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_47_0.png)


    Figure 1-2: The Kali desktop


    # # The Terminal


    The first step in using Kali is to open the terminal, which is the command line
    interface we''ll use in this book. In Kali Linux, you''ll find the icon for the
    terminal at the bottom of the desktop. Double-click this icon to open the terminal
