    # Changing Process Priority with nice


    You don''t often hear the word nice used in the context of hackers, but here you
    will. The nice command is used to influence the priority of a process to the kernel.
    As you saw when we ran the ps command, numerous processes run on the system at
    once, and all of them are contending for the available resources. The kernel will
    have final say over the priority of a process, but you can use nice to suggest
    that a process should be elevated in priority.


    The idea behind the use of the term nice is that, when you use it, you are determining
    how "nice" you''ll be to other users: if your process is using most of the system
    resources, you aren''t being very nice.


    The values for nice range from -20 to +19, with zero being the default value (see
    Figure 6-1). A high nice value translates to a low priority, and a low nice value
    translates to a high priority (when you''re not being so nice to other users and
    processes). When a process is started, it inherits the nice value of its parent
    process. The owner of the process can lower the priority of the process but cannot
    increase its priority. Of course, the superuser or root user can arbitrarily set
    the nice value to whatever they please.


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_123_0.png)


    Figure 6-1: Niceness priority values'
