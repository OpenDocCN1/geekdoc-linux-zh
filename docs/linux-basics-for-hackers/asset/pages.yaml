- img_proc: true
  md: 'enhances your anonymity, it also increases the latency of your online activities.


    Now that you know how to use proxychains, you can do your hacking with relative
    anonymity. I say “relative” because there is no surefire way to remain anonymous
    with the NSA and FSB spying on our online activities—but we can make detection
    much harder with the help of proxychains.


    # Security Concerns


    As a last note on proxy security, be sure to choose your proxies wisely: proxychains
    is only as good as the proxies you use. If you are intent on remaining anonymous,
    do not use a free proxy, as mentioned earlier. Hackers use paid-for proxies that
    can be trusted. In fact, the free proxies are likely selling your IP address and
    browsing history. By Bruce Schneider, the famous cryptographer and security expert,
    once said, “If something is free, you’re not the customer; you’re the product.”
    In other words, any free proxy is likely gathering your data and selling it. Why
    else would they offer a proxy for free?


    Although the IP address of your traffic leaving the proxy will be anonymous, there
    are other ways for surveillance agencies to identify you. For instance, the owner
    of the proxy will know your identity and, if pressured by espionage or law enforcement
    agencies with jurisdiction, may offer up your identity to protect their business.
    It’s important to be aware of the limitations of proxies as a source of anonymity.


    # Virtual Private Networks


    Using a virtual private network (VPN) can be an effective way to keep your web
    traffic relatively anonymous and secure. A VPN is used to connect to an intermediary
    internet device such as a router that sends your traffic to its ultimate destination
    tagged with the IP address of the router.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'Using a VPN can certainly enhance your security and privacy, but it''s not
    a guarantee of anonymity. The internet device you connect to must record or log
    your IP address to be able to properly send the data back to you, so anyone able
    to access these records can uncover information about you.


    The beauty of VPNs is that they are simple and easy to work with. You can open
    an account with a VPN provider and then seamlessly connect to the VPN each time
    you log on to your computer. You would use your browser as usual to navigate the
    web, but it will appear to anyone watching that your traffic is coming from the
    IP address and location of the internet VPN device and not your own. In addition,
    all traffic between you and the VPN device is encrypted, so even your internet
    service provider can''t see your traffic.


    Among other things, a VPN can be effective in evading government-controlled content
    and information sensors. For instance, if your national government limits your
    access to websites with a particular political message, you can likely use a VPN
    based outside your country in order to access that content. Some media corporations,
    such as Netflix, Hulu, and HBO, limit access to their content to IP addresses
    originating from their own nation. Using a VPN based in a nation that those services
    allow can get you around those access limitations.


    Some of the best and most popular commercial VPN services, according to CNET,
    are the following:


    +   - IPVanish

    - NordVPN

    - ExpressVPN

    - CyberGhost

    - Golden Frog VPN

    - Hide My Ass (HMA)

    - Private Internet Access

    - PureVPN

    - TorGuard'
