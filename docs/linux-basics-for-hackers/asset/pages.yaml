    As you can see, the modinfo command reveals significant information about this
    kernel module which is necessary to use Bluetooth on your system. Note that among
    other things, it lists the module dependencies: rfkill and crc16. Dependencies
    are modules that must be installed for the bluetooth module to function properly.


    Typically, this is useful information when troubleshooting why a particular hardware
    device is not working. Besides noting things like the dependencies, you can get
    information about the version of the module and the version of the kernel the
    module was developed for and then make sure they match the version you are running.


    # Adding and Removing Modules with modprobe


    Most newer distributions of Linux, including Kali Linux, include the modprobe
    command for LKM management. To add a module to your kernel, you would use the
    modprobe command with the -a (add) switch, like so:


    ```

    kali >modprobe -a <module name>

    ```


    To remove a module, use the -r (remove) switch with modprobe followed by the name
    of the module:


    ```

    kali >modprobe -r <module to be removed>

    ```'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'A major advantage of using modprobe instead of insmod is that modprobe understands
    dependencies, options, and installation and removal procedures and it takes all
    of these into account before making changes. Thus, it is easier and safer to add
    and remove kernel modules with modprobe.


    # Inserting and Removing a Kernel Module


    Let''s try inserting and removing a test module to help you familiarize yourself
    with this process. Let''s imagine that you just installed a new video card and
    you need to install the drivers for it. Remember, drivers for devices are usually
    installed directly into the kernel to give them the necessary access to function
    properly. This also makes drivers fertile for malicious hackers to install a rootkit
    or other listening device.


    Let''s assume for demonstration purposes (don''t actually run these commands)
    that we want to add a new video driver named HackersAriseNewVideo. You can add
    it to your kernel by entering the following:


    ```

    kali modprobe -a HackersAriseNewVideo

    ```


    To test whether the new module loaded properly, you can run the dmesg command,
    which prints out the message buffer from the kernel, and filter for “video” and
    look for any alerts that would indicate a problem:


    ```

    kali dmesg | grep video

    ```


    If there are any kernel messages with the word “video” in them, they will be displayed
    here. If nothing appears, there are no messages containing that keyword.


    Then, to remove this same module, you can enter the same command but with the
    -r (remove) switch:'
  merge: -1
  pgno: 255
- img_proc: true
  md: '```

    kali >modprobe -r HackersAriseNewVideo

    ```


    Remember, the loadable kernel modules are a convenience to a Linux user/admin,
    but they are also a major security weakness and one that professional hackers
    should be familiar with. As I said before, the LKMs can be the perfect vehicle
    to get your rootkit into the kernel and wreak havoc!


    # Summary


    The kernel is crucial to the overall operation of the operating system, and as
    such, it is a protected area. Anything that''s inadvertently added to the kernel
    can disrupt the operating system and even take control of it.


    LKMs enable the system administrator to add modules directly into the kernel without
    having to rebuild the entire kernel each time they want to add a module.


    If a hacker can convince the system admin to add a malicious LKM, the hacker can
    take complete control of the system, often without the system admin even being
    aware.


    # EXERCISES


    +   Before you move on to Chapter 16, try out the skills you learned from this
    chapter by completing the following exercises:


    1. Check the version of your kernel.

    2. List the modules in your kernel.

    3. Enable IP forwarding with a sysctl command.

    4. Edit /etc/sysctl.conf file to enable IP forwarding. Now, disable IP forwarding.

    5. Select one kernel module and learn more about it using modinfo.'
  merge: -1
