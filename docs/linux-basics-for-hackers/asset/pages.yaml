    # Scheduling a Backup Task


    Let''s view this utility from the system administrator''s perspective. As a system
    administrator, you''d want to run backups of all your files after hours, while
    the system is not being used and resources are readily available. (System backups
    tend to require system resources that are in short demand during business hours.)
    The ideal time might be in the middle of the night on the weekend. Rather than
    having to log in at 2 AM on Saturday night/Sunday morning (I''m sure you have
    other'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'priorities at that time), you could schedule the backup to start automatically
    at that time, even though you''re not at your computer.


    Note that the hour field uses a 24-hour clock rather than using AM and PM, so
    1 PM is, for example, 13:00. Also, note that the days of the week (DOW) start
    with Sunday (0) and end with Saturday (6).


    To create a job, you simply need to edit the crontab file by adding a line in
    the prescribed format. So, say you wanted to create a regular backup job using
    a user account named “backup.” You would write a script for backing up the system
    and save it as systembackup.sh in the /bin directory, then schedule this backup
    to run every Saturday night/Sunday morning at 2 AM by adding the following line
    to crontab:


    ```

    00 2 * * * backup /bin/systembackup.sh

    ```


    Note that the * wildcard is used to indicate “any,” and using it in place of a
    digit for the day of the month, month, or day of the week as “all” days or months.
    If you read across this line, it says


    +   1. At the top of the hour (00),

    2. Of the second hour (2),

    3. Of any day of the month (*),

    4. Of any month (*),

    5. On Sunday (0),

    6. As the backup user,

    7. Execute the script at /bin/systembackup.sh.


    The cron will then execute that script every Sunday morning at 2 AM, every month.


    If you only wanted the backup to run on the 15th and 30th of every month, regardless
    of what days of the week those dates fell on, you could revise the entry in crontab
    to appear as follows:


    ```

    00 2 15,30 * * backup /root/systembackup.sh

    ```'
