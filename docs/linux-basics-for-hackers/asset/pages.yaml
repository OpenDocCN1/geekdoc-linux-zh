    # PAST AND FUTURE OF MYSQL


    MySQL was first developed by MySQL AB of Sweden in 1995 and then was purchased
    by Sun Microsystems in 2008, which in turn was purchased by Oracle in 2009—so
    MySQL is now owned by Oracle. Oracle is the world''s largest database software
    publisher, the open source community has significant trepidations about Oracle''s
    commitment to keeping MySQL open source. As a result, there is now a fork of the
    MySQL database software called “Maria” that is committed to keeping this software
    and its subsequent versions open source. As a Linux admin or hacker, you should
    keep an eye on Maria.


    # Interacting with MySQL


    SQL is an interpreted programming language for interfacing with a database. The
    database is often a relational database, meaning data is stored in multiple tables
    that interact and each table has values in one or more columns and rows.


    There are several implementations of SQL, each with its own commands and syntax,
    but here are a few common commands:


    +   * select Used to retrieve data

    * union Used to combine the results of two or more select operations

    * insert Used to add new data

    * update Used to modify existing data

    * delete Used to delete data'
