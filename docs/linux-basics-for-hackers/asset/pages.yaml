    DNS server. The operating system queries each DNS server listed in the order it
    appears in /etc/resolv.conf, so the system will only refer to the public DNS server
    if the domain name can''t be found in the local DNS server.


    > NOTE

    > If you''re using a DHCP address and the DHCP server provides a DNS setting,
