  md: '# 17

    PYTHON SCRIPTING BASICS FOR HACKERS


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_269_0.png)


    Basic scripting skills are critical to becoming a master hacker. Without having
    developed some basic scripting skills, a beginner hacker who simply uses tools
    created by someone else will be condemned to the realm of script kiddies. This
    means that you will be limited to tools developed by someone else, which decreases
    your probability of detection by antivirus (AV) software, intrusion detection
    systems (IDSs), and law enforcement. With some scripting skills, you can elevate
    yourself to the upper echelon of the master hackers!


    In Chapter 8, we covered bash scripting basics and built some simple scripts,
    including MySQLscanners.sh, which finds systems running the ubiquitous MySQL database
    system. In this chapter, we begin looking at the scripting language most widely
    used by hackers: Python. Many of the most popular hacker tools are written in
    Python, including sqlmap, scapy, the Social-Engineer Toolkit (SET), w3af, and
    many more.


    Python has some important features that make it particularly well-suited for hacking,
    but probably most importantly, it has a huge variety of libraries—prebuilt modules
    of code that can be imported externally and reused—that provide some powerful
    functionality. Python ships'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'with over 1,000 modules built in, and many more are available in various other
    repositories.


    Building hacking tools is possible in other languages too, such as bash, Perl,
    and Ruby, but Python''s modules make building these tools much easier.


    # Adding Python Modules


    When you install Python, you also install its set of standard libraries and modules
    that provide an extensive range of capabilities, including built-in data types,
    exception handling, numeric and math modules, file handling, cryptographic services,
    internet data handling, and interaction with internet protocols (IPs).


