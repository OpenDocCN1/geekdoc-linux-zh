- img_proc: true
  md: '# # 5 CONTROLLING FILE AND DIRECTORY PERMISSIONS


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_102_0.png)


    Not every user of a single operating system should have the same level of access
    to files and directories. Like any professional or enterprise-level operating
    system, Linux has methods for securing file and directory access. This security
    system allows the system administrator—the root user—or the file owner to protect
    their files from unwanted access or tampering by granting select permissions to
    read, write, or execute files. For each file and directory, we can specify the
    permission status for the file''s owner, for particular groups of users, and for
    all other users. This is a necessity in a multiuser, enterprise-level operating
    system. The alternative would be quite chaotic.


    In this chapter, I''ll show you how to check for change permissions on files and
    directories for select users, how to set default file and directory permissions,
    and how to set special permissions. Finally, you will see how a hacker''s understanding
    of permissions might help them exploit a system.


    # ## Different Types of Users'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'As you know, in Linux, the root user is all-powerful. The root user can do
    basically *anything* on the system. Other users on the system have more limited
    capabilities and permissions and almost never have the access that the root user
    has.


    These other users are usually collected into *groups* that generally share a similar
    function. In a commercial entity, these groups might be finance, engineering,
    sales, and so on. In an IT environment, these groups might include developers,
    network administrators, and database administrators. The idea is to put people
    with similar needs into a group that is granted relevant permissions; then each
    member of the group inherits the group permissions. This is primarily for the
    ease of administering permissions and, thus, security.


    The root user is part of the root group by default. Each new user on the system
    must be added to a group in order to inherit the permissions of that group.


    # Granting Permissions


    Each and every file and directory must be allocated a particular level of permission
    for the different identities using it. The three levels of permission are as follows:


    +   - Permission to read. This grants permission only to open and view a file.

    - Permission to write. This allows users to view and edit a file.

    - Permission to execute. This allows users to execute a file (but not necessarily
    view or edit it).


    In this way, the root user can grant users a level of permission depending on
    what they need the files for. When a file is created, typically the user who created
    it is the owner of the file, and the owning group is the user’s current group.
    The owner of the file can grant various access privileges to it. Let’s look at
    how to change permissions to pass ownership to individual users and to groups.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Granting Ownership to an Individual User


    To move ownership of a file to a different user so that they have the ability
    to control permissions, we can use the chown (or change owner) command:


    ```

    kali >chown bob @/tmp/bobsfile

    ```


    Here, we give the command, the name of the user we are giving ownership to, and
    then the location and name of the relevant file. This command grants the user
    account for Bob ownership of bobsfile.


    # Granting Ownership to a Group


    To transfer ownership of a file from one group to another, we can use the chgrp
    (or change group) command.


    Hackers are often more likely to work alone than in groups, but it''s not unheard
    of for several hackers or pentesters work together on a project, and in that case,
    using groups is Necessary. For instance, you might have a group of pentesters
    and a group of security team members working on the same project. The pentesters
    in this example are the root group, meaning they have all permissions and access.
    The root group needs access to the hacking tools, whereas the security folk only
    need access to defensive tools such as an intrusion detection system (IDS). Let''s
    say the root group downloads and installs a program named newIDS; the root group
    will need to change the ownership to the security group so the security group
    can use it at will. To do so, the root group would simply enter the following
    command:


    ```

    kali >chgrp security ⓿ newIDS

    ```


    This command passes the security group ⓿ ownership of newIDS ⓿. Now you need to
    know how to check whether these allocations have worked. You''ll do that by checking
    a file''s permissions.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Checking Permissions


    When you want to find out what permissions are granted to what users for a file
    or directory, use the ls command with the -l (long) switch to display the contents
    of a directory in long format—this list will contain the permissions. In Listing
    5-1, I use the -l command on the file /usr/share/hashcat (one of my password-cracking
    tools) in order to see what we can learn about the files there.


    ```

    kali -ls /usr/share/hashcat

    total 32952

    1 2 3 4      5 6             7

    drwxr-xr-x 5 root root 4096 Dec 5 10:47 charsets

    -rw-r-r-- 1 root root 33685504 June 28 2018 hashcat.hcstat

    -rw-r-r-- 1 root root 33685504 June 28 2018 hashcat.hctune

    drwxr-xr-x 2 root root 4096 Dec 5 10:47 masks

    drwxr-xr-x 2 root root 4096 Dec 5 10:47 OpenCL

    drwxr-xr-x 3 root root 4096 Dec 5 10:47 rules

    ```


    Listing 5-1: Checking a file''s permissions with the long listing command


    On each line, we get information about:


    +   1 The file type

    2 The permissions on the file for owner, groups, and users, respectively

    3 The number of links (This topic is beyond the scope of the book)

    4 The owner of the file

    5 The size of the file in bytes

    6 When the file was created or last modified

    7 The name of the file


    For now, let''s focus on the seemingly incomprehensible strings of letters and
    dashes on the left edge of each line. They tell us whether an item is a file or
    directory and what permissions, if any, are on it.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'The first character tells you the file type, where d stands for a directory
    and a dash (-) indicates a file. These are the two most common file types.


    The next section defines the permissions on the file. There are three sets of
    three characters, made of some combination of read (r), write (w), and execute
    (x), in order. The first set represents the permissions of the owner; the second,
    those of the group; and the last, those of all users.


    Regardless of which set of three letters you''re looking at, if you see an r first,
    or user or group of users has permission to open and read that file or directory.
    A w as the middle letter means they can write to (modify) the file or directory,
    and an x at the end means they can execute (run) the file or directory. If any
    r, w, or x is replaced with a dash (-), then the respective permission hasn''t
    been given. Note that users can have permission to execute only binaries or scripts.


    Let''s use the third line of output in Listing 5-1 as an example:


    ```

    -rw-r---- 1 root root 33685504 June 28 2018 hashcat.hcstat

    ```


    The file is called, as we know from the right end of the line, bashcat.hcstat.
    After the initial - (which indicates it''s a file), the permissions rw- tell us
    that the owner has read and write permissions but not execute permission.


    The next set of permissions (r--) represents those of the group and shows that
    the group has read permission but not write or execute permissions. And, finally,
    we see that the rest of the users also have only read permission (r--).


    These permissions aren''t set in stone. As a root user or file owner, you can
    change them. Next, we''ll do just that.


    # Changing Permissions


    We can use the Linux command chmod (or change mode) to change the permissions.
    Only a root user or the file''s owner can change'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'permissions.


    In this section, we use chmod to change permissions on hashcat.hstat using two
    different methods. First we use a numerical representation of permissions, and
    then we use a symbolic representation.


    # Changing Permissions with Decimal Notation


    We can use a shortcut to refer to permissions by using a single number to represent
    one rwx set of permissions. Like everything underlying the operating system, permissions
    are represented in binary, so ON and OFF switches are represented by 1 and 0,
    respectively. You can think of the rwx permissions as ON/OFF switches, so when
    all permissions are granted, this equates to 111 in binary.


    A binary set like this is then easily represented as one digit by converting it
    into octal, an eight-digit number system that starts with 0 and ends with 7. An
    octal digit represents a set of three binary digits, meaning we can represent
    an entire rwx set with one digit. Table 5-1 contains all possible permission combinations
    and their octal and binary representatives.


    Table 5-1: Octal and Binary Representations of Permissions


    | Binary Octal rwx |

    |---|---|---|

    | 000 | 0 | --- |

    | 001 | 1 | --x |

    | 010 | 2 | -w- |

    | 011 | 3 | -wx |

    | 100 | 4 | r-- |

    | 101 | 5 | r-x |

    | 110 | 6 | rw- |

    | 111 | 7 | rwx |'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'Using this information, let''s go through some examples. First, if we want
    to set only the read permission, we could consult Table 5-1 and locate the value
    for read:


    ```

    r w x

    4 - -

    ```


    Next, if we want to set the permission to wx, we could use the same methodology
    and look for what sets the w and what sets the x:


    ```

    r w x

    - 2 1

    ```


    Notice in Table 5-1 that the octal representation for -wx is 3, which not so coincidentally
    happens to be the same value we get when we add the two values for setting w and
    x individually: 2 + 1 = 3.


    Finally, when all three permissions are on, it looks like this:


    ```

    r w x

    4 2 1

    ```


    And 4 + 2 + 1 = 7. Here, we see that in Linux, when all the permission switches
    are on, they are represented by the octal equivalent of 7.


    So, if we wanted to represent all permissions for the owner, group, and all users,
    we could write it as follows:


    ```

    7 7 7

    ```


    Here''s where the shortcut comes in. By passing chmod three octal digits (one
    for each rwx set), followed by a filename, we can change permissions on that file
    for each type of user. Enter the following into your command line:


    ```

    kali >chmod 774 hashcat.hcstat

    ```'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'Looking at Table 5-1, we can see that this statement gives the owner

    all permissions, the group all permissions, and everyone else (other)

    only the read permission.


    Now we can see whether those permissions have changed by running

    ls -l on the directory and looking at the hascat.hcat line. Navigate to

    the directory and run that command now:


    ```

    kali ~ls -l

    total 32952

    drwxr-xr-x 5  root  root   4096  Dec 5 10:47 charsets

    -rwxrwxxr-- 1  root  root 33685504  Jun 28 2018 hascat.hcat

    -rw-r--r-- 1  root  root   4096  Jun 28 2018 hascat.hctune

    drwxr-xr-x 2  root  root   4096  Dec 5 10:47 masks

    drwxr-xr-x 2  root  root   4096  Dec 5 10:47 OpenCL

    drwxr-xr-x 3  root  root   4096  Dec 5 10:47 rules

    ```


    You should see -rwxrwxxr-- on the left side of the hascat.hcat line ❶.

    This confirms that the chmod call successfully changed permissions on

    the file to give both the owner and the group the ability to execute the

    file.


    # Changing Permissions with UGO


    Although the numeric method is probably the most common method

    for changing permissions in Linux, some people find chmod symbolic

    method more intuitive—both methods work equally well, just find

    the one that suits you. The symbolic method is often referred to as the

    GO syntax, which stands for user (or owner), group, and others.


    UGO syntax is very simple. Enter the chmod command and then the

    yous want to change permissions for, providing u for user, g for

    group, or o for others, followed by one of three operators:


    +   - Removes a permission

    - Adds a permission

    - Sets a permission'
