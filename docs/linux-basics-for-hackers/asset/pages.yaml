  md: '# Seeing Whether the Devices Are Reachable with l2ping


    Once we''ve gathered the MAC addresses of all nearby devices, we can send out
    pings to these devices, whether they''re in discovery mode or not, to see whether
    they are in reach. This lets us know whether they are active and within range.
    To send out a ping, we use the l2ping command with the following syntax:


    ```

    l2ping MACaddress

    ```


    Listing 14-5 shows pinging the Android device discovered in Listing 14-2.


    ```

    kali >l2ping 76:6E:46:63:72:66 -c 4

    Ping: 76:6E:46:63:72:66 from 10:AE:60:58:F1:37 (data size 44...)

    44 bytes 76:6E:46:63:72:66 id 0 time 37.57ms

    44 bytes 76:6E:46:63:72:66 id 1 time 27.23ms

    44 bytes 76:6E:46:63:72:66 id 2 time 27.59ms

    --snip--

    ```


    Listing 14-5: Pinging a Bluetooth device


    This output indicates that the device with the MAC address 76:6E:46:63:72:66 is
    within range and reachable. This is useful knowledge, because we must know whether
    a device is reachable before we even contemplate hacking.


    # Summary


    Wireless devices represent the future of connectivity and hacking. Linux has developed
    specialized commands for scanning and connecting to Wi-Fi APs in the first step
    toward hacking those systems. The attack suite of wireless hacking tools includes
    both airmon-ng and arodump-ng, which enable us to scan and gather key information
    from in-range wireless devices. The BlueZ suite includes hcconfig, hcitool, and
    other tools capable of scanning and information gathering, which are'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'necessary for hacking the Bluetooth devices within range. It also includes
    many other tools worth exploring.


    # EXERCISES


    Before you move on to Chapter 15, try out the skills you learned from this chapter
    by completing the following exercises:


    +   1. Check your network devices with ifconfig. Note any wireless extensions.

    2. Run iwconfig and note any wireless network adapters.

    3. Check to see what Wi-Fi APs are in range with iwlist.

    4. Check to see what Wi-Fi APs are in range with nmcli. Which do you find more
    useful and intuitive, nmcli or iwlist?

    5. Connect to your Wi-Fi AP using nmcli.

    6. Bring up your Bluetooth adapter with hciconfig and scan for nearby discoverable
    Bluetooth devices with hcitool.

    7. Test whether those Bluetooth devices are within reachable distance with l2ping.'
