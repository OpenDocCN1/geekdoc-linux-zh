  md: '# # 14

    UNDERSTANDING AND INSPECTINGnWIRELESS NETWORKS


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_231_0.png)


    The ability to scan for and connect to other network devices from your system
    is crucial to becoming a successful hacker, and with wireless technologies like
    Wi-Fi (IEEE 802.1) and Bluetooth becoming the standard, finding and controlling
    Wi-Fi and Bluetooth connections is key. If someone can hack a wireless connection,
    they can gain entry to a device and access to confidential information. The first
    step, of course, is to learn how to find these devices.


    In Chapter 3, we looked at some basic networking commands in Linux, including
    some of the fundamentals of wireless networking, with a promise of more wireless
    networking to come in Chapter 14. As promised, here we examine two of the most
    common wireless technologies in Linux: Wi-Fi and Bluetooth.


    # ## Wi-Fi Networks


    We''ll start with Wi-Fi. In this section, I''ll show you how to find, examine,
    and connect to Wi-Fi access points. Before doing so, let''s spend a bit of time
    going over some basic Wi-Fi terms and technologies'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'to help you better understand the output from a lot of the queries we''ll make
    in this chapter:


    **AP (access point)** This is the device wireless users connect to for internet
    access.


    **ESSID (extended service set identifier)** This is the same as the SSID, which
    we discussed in Chapter 3, but it can be used for multiple APs in a wireless LAN.


    **BSSID (basic service set identifier)** This is the unique identifier of each
    AP, and it is the same as the MAC address of the device.


    **SSID (service set identifier)** This is the name of the network.


    **Channels** Wi-Fi can operate on any one of 14 channels (1–14). In the United
    States, Wi-Fi is limited to channels 1–11.


    **Power** The closer you are to the Wi-Fi AP, the greater the power, and the easier
    the connection is to crack.


    **Security** This is the security protocol used on the Wi-Fi AP that is being
    read from. There are three primary security protocols for Wi-Fi. The original,
    *Wired Equivalent Privacy* (WEP), was badly flawed and easily cracked. Its replacement,
    *Wi-Fi Protected Access* (WPA), was a bit more secure. Finally, WPA2-PSK, which
    is much more secure and uses a presared key (PSK) that all users share, is now
    used by nearly all Wi-Fi APs (except enterprise Wi-Fi).


    **Modes** Wi-Fi can operate in one of three modes: managed, master, or monitor.
    You''ll learn what these modes mean in the following section.


    **Wireless range** In the United States, a Wi-Fi AP must legally broadcast its
    signal at an upper limit of 0.5 watts. At this power, it has a normal range of
    about 300 feet (100 meters). High-gain antennas can extend this range to as much
    as 20 miles.


    **Frequency** Wi-Fi is designed to operate on 2.4GHz and 5GHz. Modern Wi-Fi APs
    and wireless network cards often use both.'
  merge: -1
