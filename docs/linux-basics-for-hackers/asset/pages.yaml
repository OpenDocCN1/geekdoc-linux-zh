    The IP address of my Pi is 192.168.1.101, but make certain you are using the IP
    address of your Raspberry Spy Pi wherever your address appears in this chapter.
    Now, from your Kali system, you should be able to connect directly to and control
    your Raspberry Spy Pi and use it as a remote spying system. In this simple example,
    your system will need to be on the same network as the Pi.'
