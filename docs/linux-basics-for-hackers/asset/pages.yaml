    #net.ipv4.tcp_syn_cookies=1


    See http://lwn.Articles/277146/

    # Uncomment the next line to disable packet forwarding for IPv4

    #net.ipv4.ip_forward=1


    > The relevant line is at 1; just remove the comment (#) here to enable IP forwarding.


    From an operating system–hardening perspective, you could use this file to disable
    ICMP echo requests by adding the line net.ipv4.icmp_echo_ignore_all=1 to make
    it more difficult—but not impossible—for hackers to find your system. After adding
    the line, you will need to run the command sysctl -p.


    # Managing Kernel Modules


    Linux has at least two ways to manage kernel modules. The older way is to use
    a group of commands built around the insmod—insmod stands for insert module and
    is intended to deal with modules. The second way, using the modprobe command,
    we will employ a little later in this chapter.'
