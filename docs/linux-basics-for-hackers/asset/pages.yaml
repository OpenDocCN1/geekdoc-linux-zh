    proxy and returns the results to me. To anyone tracing this traffic, it appears
    that it was my proxy that navigated to https://www.hackers-arise.com/ rather than
    my IP address.


    # Some More Interesting Options


    Now that we have proxychains working, let''s look at some other options we can
    configure through proxychains.conf file. As we have it set up, we are simply using
    a single proxy. However, we can put in multiple proxies and use all of them, we
    can use a limited number from the list, or we can have proxychains change the
    order randomly. Let''s try all these options.


    # Adding More Proxies


