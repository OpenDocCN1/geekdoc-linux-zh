  md: '# 13

    BECOMING SECURE AND ANONYMOUS


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_214_0.png)


    Today, nearly everything we do on the internet is tracked. Whoever is doing the
    tracking—whether it be Google tracking our online searches, website visits, and
    email or the National Security Agency (NSA) cataloging all our activities—every
    online move is being recorded, indexed, and then mined for someone’s benefit.
    The average individual—and the hacker, in particular—needs to understand how to
    limit this tracking and remain relatively anonymous on the web to limit this ubiquitous
    surveillance.


    In this chapter, we look at how you can navigate the World Wide Web anonymously
    (or as close as you can get) using four methods:


    +   * The Onion Network

    * Proxy servers

    * Virtual private networks

    * Private encrypted email


    No method is sure to keep your activities safe from prying eyes, and given enough
    time and resources, anything can be tracked. However, these methods will likely
    make the tracker’s job much more difficult.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# # How the Internet Gives Us Away


    To begin, let''s discuss at a high level some of the ways our activities on the
    internet are tracked. We won''t go into all tracking methods, or into too much
    detail about any one method, as that would be beyond the scope of this book. Indeed,
    such a discussion could take up an entire book on its own.


    First, your IP address identifies you as you traverse the internet. Data sent
    from your machine is generally tagged with your IP address, making your activities
    easy to track. Second, Google and other email services will “read” your email,
    looking for keywords to more efficiently serve you ads. Although there are many
    more sophisticated methods that are far more time and resource intensive, these
    are the ones we try to prevent in this chapter. Let''s start by taking a look
    at how IP addresses give us away on the internet.


    When you send a packet of data across the internet, it contains the IP addresses
    of the source and destination for the data. In this way, the packet knows where
    it is going and where to return the response. Each packet hops through multiple
    internet routers until it finds its destination and then hops back to the sender.
    For general internet surfing, each hop is a router the packet passes through to
    get to its destination. There can be many as 20–30 hops between the sender and
    the destination, but usually any packet will find its way to the destination fewer
    than 15 hops.


    As the packet traverses the internet, anyone intercepting the packet can see who
    sent it, where it has been, and where it''s going. This is one way websites can
    tell who you are when you arrive and log in automatically, and it''s also how
    someone can track where you''ve been on the internet.


    To see hops a packet might make between you and the destination, you can use the
    traceroute command, as shown next. Simply enter traceroute and the destination
    IP address or domain, and the command will send out packets to the destination
    and trace the route of those packets.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '```

    kali >traceroute google.com

    troute to google.com (172.217.1.78), 30 hops max, 60 bytes packets

    1 192.168.1.1 (192.168.1.1) 4.152 ms 3.834 ms 32.964 ms

    2 10.0.0.1 (10.0.0.1) 5.797 ms 6.769 ms

    3 96.128.96.45 (96.128.96.45) 27.952 ms 30.337 ms 32.964 ms

    --snip:

    18 lgal15s44-in-f14.le100 (172.217.1.78) 94.666 ms 42.990 ms 41.564 ms

    ```


    As you can see, www.google.com is 18 hops across the internet me. Your results
    will likely be different because your request would be coming from a different
    location and because Google has many servers across the globe. In addition, packets
    don''t always take the same route across the internet, so you might send another
    packet from your address to the same site and receive a different route. Let''s
    see how we can disguise all this with the Tor network.


    # The Onion Router System


    In the 1990s, the US Office of Naval Research (ONR) set out to develop a method
    for anonymously navigating the internet for espionage purposes. The plan was to
    set up a network of routers that was separate from the internet''s routers, that
    could encrypt the traffic, and that only stored the unencrypted IP address of
    the previous router—meaning all other router addresses along the way were encrypted.
    The idea was that anyone watching the traffic could not determine the origin or
    destination of the data. This research became known as “The Onion Router (Tor)
    Project” in 2002, and it''s now available to anyone to use for relatively safe
    and anonymous navigation on the web.


    # How Tor Works


    Packets sent over Tor are not sent over the regular routers so closely monitored
    by so many but rather sent over a network of over 7,000 routers around the world,
    thanks to volunteers who allow their computers to be used by Tor. On top of using
    a totally separate'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'network, Tor encrypts the data, destination, and sender IP address of each
    packet. At each hop, the information is encrypted and then decrypted by the next
    hop when it''s received. In this way, each packet contains information about only
    the previous hop along the path and not the IP address of the origin. If someone
    intercepts the traffic, they can see only the IP address of the previous hop,
    and the website owner can see only the IP address of the last router that sent
    the traffic (see Figure 13-1). This ensures relative anonymity across the internet.


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_217_0.png)


    +   + Tor node

    - Encrypted path

    - Clear path


    Figure 13-1: How Tor uses encrypted traffic data


    To enable the use of Tor, just install the Tor browser from https://www.torproject.org/.
    Once installed, it will look something like Figure 13-2, and you can use it like
    any old internet browser. By using this browser, you''ll be navigating the internet
    through a separate set of routers and will be able to visit sites without being
    tracked by Big Brother. Unfortunately, the tradeoff is that surfing on the Tor
    browser can be a lot slower; because there are not nearly as many routers, the
    bandwidth is limited in this network.'
  merge: -1
  pgno: 217
