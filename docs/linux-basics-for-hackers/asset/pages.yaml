  md: 'When you identify a problematic process, you may want to stop it with the kill
    command. There are many different ways to kill a program, and each has its own
    kill number.


    The kill command has 64 different kill signals, and each does something slightly
    different. Here, we focus on a few you will likely find most useful. The syntax
    for the kill command is kill-signal PID, where the signal switch is optional.
    If you don''t provide a signal flag, it defaults to SIGTERM. Table 6-1 lists the
    kill signals


    # Table 6-1: Commonly Used Kill Signals


    | Signal Number | Description |

    |---|---||

    | SIGHUP 1 | This is known as the Hangup (HUP) signal. It stops the designated
    process and restarts it with the same PID. |

    | SIGINT 2 | This is the Interrupt (INT) signal. It is a weak kill signal that
    isn''t guaranteed to work, but works in most cases. |

    | SIGQUIT 3 | This is known as the core dump. It terminates the process and saves
    the process information in memory, and then it saves this information in the current
    working directory to a file named core. (The reasons for doing this are beyond
    the scope of this.) |

    | SIGTERM 15 | This is the Termination (TERM) signal. It is the kill command''s
    default kill signal. |

    | SIGKILL 9 | This is the absolute kill signal. It forces the process to stop
    by sending the process''s resources to a special device, /dev/null. |


    Using the top command, you can identify which processes are using too many resources;
    often, those processes will be legitimate, but there may be malicious processes
    taking resources that you''ll want to kill.'
