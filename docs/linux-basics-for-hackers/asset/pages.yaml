  md: '# 11

    THE LOGGING SYSTEM


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_179_0.png)


    For any Linux user, it''s crucial to be knowledgeable in the use of the log files.
    Log files store information about events that occur when the operating system
    and applications are run, including any errors and security alerts. Your system
    will log information automatically based on the series of rules that I will show
    you how to configure in this chapter.


    As a hacker, the log files can be a trail to your target''s activities and identity.
    But it can also be a trail to your own activities on someone else''s system. A
    hacker therefore needs to know what information they can gather, as well as what
    can be gathered about their own actions and methods in order to hide that evidence.


    On the other side, anyone securing Linux systems needs to know how to manage the
    logging functions to determine whether a system has been attacked and then decipher
    what actually happened and how did it.


    This chapter shows you how to examine and configure log files, as well as how
    to remove evidence of your activity and even disable logging altogether. First,
    we''ll look at the daemon that does the logging.


    # The rsyslog Logging Daemon'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'Linux uses a daemon called syslogd to automatically log events on your computer.
    Several variations of syslog, including rsyslog and syslog-ng, are used on different
    distributions of Linux, and even though they operate very similarly, minor differences
    exist. Since Kali Linux is built on Debian, and Debian comes with rsyslog by default,
    we focus on that utility in the system. If you want to use other distributions,
    it''s worth doing a little research on their logging systems.


    Let''s take a look at rsyslog on your system. We''ll search for all files related
    to rsyslog. First, open a terminal in Kali and enter the following:


    ```

    kali >locate rsyslog

    /etc/rsyslog.conf

    /etc/rsyslog.d

    /etc/default/rsyslog

    /etc/init.d/rsyslog

    /etc/logcheck/ignore.server/rsyslog

    /etc/logrotate.d/rsyslog

    /etc/rc0.d/K04rsyslog

    --snip-

    ```


    As you can see, numerous files contain the keyword rsyslog—some of which are more
    useful than others. The one we want to examine is the configuration file rsyslog.conf.


    # The rsyslog Configuration File


