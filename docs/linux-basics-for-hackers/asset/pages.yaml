    7, which displays messages to the screen, and the read command, which reads in
    data and stores it somewhere else. Just learning these two commands alone will
    enable you to build a simple powerful tool.


    You''ll need a text editor to create shell scripts. You can use whichever Linux
    text editor you like best, including vi, vim, emacs, edit, kate, and so on. I''ll
    be using Leafpad in these tutorials, as I have in previous chapters. Using a different
    editor should not make any difference in your script or its functionality.


