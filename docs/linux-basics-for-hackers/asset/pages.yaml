- img_proc: true
  md: 'In this case, the bash shell will open the leafpad text editor to create newsscript.
    While we work in the text editor, the terminal is occupied with running the text
    editor. If we return to the terminal, we should see that it is running our text
    editor and that we have no new prompt to allow us to enter more commands.


    We could, of course, open another terminal to run more commands, but a better
    option to save resources real estate is to start the text editor running in the
    background. Running a process in the background simply means that it will continue
    to run without needing the terminal. In this way, the terminal is freed up for
    other duties.


    To start the text editor in the background, just append ampersand (8) to the end
    of the command, like so:


    ```

    kali >leafpad newscript &

    ```


    Now, when the text editor opens, the terminal returns a new command prompt so
    we can enter other commands on our system while also editing our newsscript. This
    is effective for any process that may run for a significant length of time when
    you use the terminal. As a hacker, you''ll find this useful for running multiple
    terminals with multiple tasks, to save resources and screen space.


    # Moving a Process to the Foreground


    If you want to move a process running in the background to the foreground, you
    can use the fg (foreground) command. The fg command requires the PID of the process
    you want to return to the foreground, as shown next.


    ```

    kali >fg 1234

    ```


    If you don''t know the PID, you can use the ps command to find it.


    # Scheduling Processes'
