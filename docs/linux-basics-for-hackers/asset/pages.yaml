  md: 'frames have been detected, the data throughput rate, how many packets have
    traversed the wireless card, the channel (1–14), the theoretical throughput limit,
    the encryption protocol, the cipher used for encryption, the authentication type,
    and the ESSID (commonly referred to as SSID). In the client portion, the output
    tells us that one client is not associated, meaning it has been detected but is
    not connected to any AP, and that another is associated with a station, meaning
    it''s connected to the AP at that address.


    Now you have all the information you need to crack the AP! Although it''s beyond
    the scope of this book, to crack the wireless AP, you need the client MAC address,
    the AP MAC address, the channel the target is operating on, and a password list.


    So to crack the Wi-Fi password, you would open three terminals. In the first terminal,
    you would enter commands similar to the following, filling in the client and AP
    MAC addresses and the channel:


    ```

    airodump-ng -c 10 --ssid 01:01:AA:BB:CC:22 -w Hackers-ArisePSK wlan0mon

    ```


    This command captures all the packets traversing the AP on channel 10 using the
    -c option.


    In another terminal, you can use the airplay-ng command to knock off (authenticate)
    anyone connected to the AP and force them to reauthenticate to the AP, as shown
    next. When they reauthenticate, you can capture the hash of their password that
    is exchanged in the WPA2-PSK four-way handshake. The password hash will appear
    in the upperright corner of the airodump-ng terminal.


    ```

    airplay-ng --deauth 100 -a 01:01:AA:BB:CC:22 -c A0:A3:E2:44:7C:E5 wlan0mon

    ```


    Finally, in the final terminal, you can use a password list (wordlist.dic) to
    find the password in the captured hash (Hackers-ArisePSK.cap), as shown here:


    ```

    aircrack-ng -w wordlist.dic -b 01:01:AA:BB:CC:22 Hacker-ArisePSK.cap

    ```'
