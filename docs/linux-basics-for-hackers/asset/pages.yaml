    # Character and Block Devices


    Something else to note about the naming of device files in the /dev directory
    is that the first position contains c or b. You can see this in Listing 10-1 at
    the start of most of the entries, and it looks something like this:


    ```

    crw------- root root 10175 May 16 12:44 agpgart

    ```


    These letters represent the two ways devices transfer data in and out. The c stands
    for character, and these devices are known, as you might expect, as character
    devices. External devices that interact with the system by sending and receiving
    data by character, such as mice or keyboards, are character devices.


    The b stands for the second type: block devices. They communicate in blocks of
    data (multiple bytes at a time) and include devices like hard drives and DVD drives.
    These devices require higher-speed data throughput and therefore send and receive
    data in blocks (many characters or bytes at a time). Once you know whether a device
    is a character or block device, you can easily get more information about it,
    as you will see next.


    # List Block Devices and Information with lsblk'
