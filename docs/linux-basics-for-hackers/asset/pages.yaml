    # Getting Help


    Nearly every command, application, or utility has a dedicated help file in Linux
    that provides guidance for its use. For instance, if I needed help using the best
    wireless cracking tool, aircrack-ng, I could simply type the aircrack-ng command
    followed by the --help command:


    ```

    kali aircrack-ng --help

    ```


    Note the double dash here. The convention in Linux is to use a double dash (--)
    before word options, such as help, and a single dash before single-letter options,
    such as -h.


    When you enter this command, you should see a short description of the tool and
    guidance on how to use it. In some cases, you can use -h or -? to get the help
    file. For instance, if I needed help using the hacker''s best port-scanning tool,
    nmap, I would enter the following:


    ```

    kali nmap -h

    ```


    Unfortunately, although many applications support all three options (--help, -h,
    and -?), there''s no guarantee the application you''re using will work. If one
    option doesn''t work, try another.


    # Referencing Manual Pages with man


    In addition to the help switch, many commands and applications have a manual (man)
    page with more information, such as a description and synopsis of the command
    or application. You can view a man page by simply typing man before the command,
    utility, or application. To see the man page for aircrack-ng, for example, you
    would enter the following:'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'kali >man aircrack-ng


    NAME

    aircrack-ng - a 802.11 WEP / WPA-PSK key cracker


    SYNOPSIS

    aircrack-ng [options] <cap / .ivs file(s)>


    DESCRIPTION

    aircrack-ng is an 802.11 WEP and WPA/WPA2-PSK cracking program. It can recover
    the WEP key once enough encrypted packets have been captured with airdump-ng.
    This part of the aircrack-ng determines the WEP key using two fundamental methods.
    The first method is via the PTW approach (Pyshkin, Tews, Weinmann). The main advantage
    of the PTW approach is that very few data packets are required to crack the WEP
    key. The second method is the FMS/Korek method. The FMS/Korek method incorporates
    various statistical attacks to discover the WEP key and uses these in combination
    with brute force. Additionally, the program offers a dictionary method for determining
    the WEP key. For cracking WPA/WPA2 pre-shared keys, a wordlist (file or stdin)
    and an airolib-ng has been used.


    This opens the manual for aircrack-ng, providing you with more detailed information
    than the help screen. You can scroll through this manual file using the ENTER
