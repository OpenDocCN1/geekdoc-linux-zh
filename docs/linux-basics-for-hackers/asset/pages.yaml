    BASH SCRIPTING


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_143_0.png)


    Any self-respecting hacker must be able to write scripts. For that matter, any
    self-respecting Linux administrator must be able to script. Hackers often need
    to automate commands, sometimes from multiple tools, and this is most most efficiently
    done through short programs they write themselves.


    In this chapter, we build a few bash shell scripts to start you off with scripting.
    We''ll add capabilities and features as we progress, eventually building a script
    capable of finding potential attack targets over a range of IP addresses.


    To become an elite hacker, you also need the ability to script in one of the widely
    used scripting languages, such as Ruby (Metasploit exploits are written in Ruby),
    Python (many hacking tools are Python scripts), or Per Perl (Perl is the best
    text-manipulation scripting language). I give a brief introduction to Python scripting
    in Chapter 17.


    # A Crash Course in Bash


    A shell is an interface between the user and the operating system that enables
    you to manipulate files and run commands, utilities, programs, and much more.
    The advantage of a shell is that you perform these tasks'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'immediately from the computer and not through an abstraction, like a GUI, which
    allows you to customize your task to your needs. A number of different shells
    are available for Linux, including the Korn shell, the Z shell, the C shell, and
    the Bourne-again shell, more widely known as bash.


    Because the bash shell is available on nearly all Linux and UNIX distributions
    (including macOS and Kali), we''ll be using the bash shell, exclusively.


    The bash shell can run any system commands, utilities, or applications your manual
    command line run, but it also includes some of its own built-in commands. Table
    8-1 later in the chapter gives you a reference to some useful commands that reside
    within the bash shell.


    In earlier chapters, you used the `cd`, `pwd`, `set`, and `um` commands. In this
