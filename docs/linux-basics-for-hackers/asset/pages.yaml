- img_proc: true
  md: '+   • Buffered VPN


    Most of these VPN services charge $50–$100 per year, and many offer a free 30-day
    trial. To find out more about how to set up a VPN, choose one from the list and
    visit the website. You should find download, installation, and usage instructions
    that are pretty easy to follow.


    The strength of a VPN is that all your traffic is encrypted when it leaves your
    computer, thus protecting you against snooping, and your IP address is cloaked
    by the VPN IP address when you visit a site. As with a proxy server, the owner
    of the VPN has your originating IP address (otherwise they couldn''t send your
    traffic back to you). If they are pressured by espionage agencies or law enforcement,
    they might give up your identity. One way to prevent is to use only VPNs that
    promise not to store or log any of this information (and hope they are being truthful).
    In this way, if someone insists that the VPN service provider turn over its data
    on us, there is no data.


    #  Encrypted Email


    Free commercial email services such as Gmail, Yahoo!, and Outlook Web Mail (formerly
    Hotmail) are free for a reason: they are vehicles for tracking your interests
    and serving up advertisements. As mentioned already, if a service is free, you
    are the product, not the customer. In addition, the servers of the email provider
    (Google, for example) have access to the unencrypted contents of your email, even
    if you''re using HTTPS.


    One way to prevent eavesdropping on your email is to use encrypted email. ProtonMail,
    shown in Figure 13-5, encrypts your email from end to end or browser to browser.
    This means that your email is encrypted on ProtonMail servers—even the ProtonMail
    administrators can''t read your email.


    ProtonMail was founded by a group of young scientists at the CERN supercollider
    facility in Switzerland. The Swiss have a long and storied'
  merge: -1
