    # Using rc Scripts to Run Jobs at Startup


    Whenever you start your Linux system, a number of scripts are run to set up the
    environment for you. These are known as the rc scripts. After the kernel has initialized
    and loaded all its modules, the kernel starts a daemon known as init or init.d.
    This daemon then begins to run a number of scripts found in /etc/init.d/rc. These
    scripts include commands for starting many of the services necessary to run your
    Linux system as you expect.


    # Linux Runlevels


    Linux has multiple runlevels that indicate what services should be started at
    bootup. For instance, runlevel 1 is single-user mode, and services such as networking
    are not started in runlevel 1. The rc scripts are set to run depending on what
    runlevel is selected:


    +   * 0 Halt the system

    * 1 Single-user/minimal mode

    * 2–5 Multiuser modes

    * 6 Reboot the system'
  merge: -1
  pgno: 264
