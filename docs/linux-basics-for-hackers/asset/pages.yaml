    # Dynamic Chaining


    With multiple IPs in our proxychain.conf file, we can set up dynamic chaining,
    which runs our traffic through every proxy on our list and, if one of the proxies
    in the list is down or not responding, automatically goes to the next proxy in
    the list without throwing an error. If we didn''t set this up, a single failing
    proxy would break our request.


    Go back into your proxychains configuration file, find the dynamic_chain line
    (line 10), and uncomment it, as shown next. Also make sure you comment out the
    strict_chain line if it isn''t already.


    ```

    # dynamic_chain

    #

    # Dynamic - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    --snip---

    ```


    This will enable dynamic chaining of our proxies, thus allowing for greater anonymity
    and trouble-free hacking. Save the config file and feel free to try it out.


    # Random Chaining'
