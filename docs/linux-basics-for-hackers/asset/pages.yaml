  md: '# 15

    MANAGING THE LINUX KERNEL AND LOADABLE KERNEL MODULES


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_247_0.png)


    All operating systems are made up of at least two major components. The first
    and most important of these is the kernel. The kernel is at the center of the
    operating system and controls everything the operating system does, including
    managing memory, controlling the CPU, and even controlling what the user sees
    on the screen. The second element of the operating system is often referred to
    as user land and includes nearly everything else.


    The kernel is designed to be a protected or privileged area that can be accessed
    by root or other privileged accounts. This is for good reason, as access to the
    kernel can provide nearly unfettered access to the operating system. As a result,
    most operating systems provide users and services access only to user land, where
    the user can access nearly anything without taking control of the operating system.


    Access to the kernel allows the user to change how the operating systems works,
    looks, and feels. It also allows them to crash the operating system, making it
    unworkable. Despite this risk, in some cases, the system admin must very carefully
    access the kernel for operational and security reasons.'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'In this chapter, we''ll examine how to alter the way the kernel works and add
    new modules to the kernel. It probably goes without saying that if a hacker can
    alter the target''s kernel, they can control the system. Furthermore, an attacker
    may need to alter how the kernel functions for some attacks, such as a *man-in-the-middle*
    (MITM) attack, where the hacker places themselves between a client and server
    and eavesdrop on alter the communication. First, we''ll take a closer look at
    the kernel structure and its modules.


    # What Is a Kernel Module?


    The kernel is the central nervous system of your operating system, controlling
    everything it does, including managing interactions between hardware components
    and starting the necessary services. The kernel operates between the user applications
    you see and the hardware that runs everything, like the CPU, memory, and hard
    drive.


    Linux is a monolithic kernel that enables the addition of kernel modules. As such,
    modules can be added and removed from the kernel. The kernel will occasionally
    need updating, which might entail installing new device drivers (such as video
    cards, Bluetooth devices, or USB devices), filesystem drivers, and even system
    extensions. These drivers must be embedded in the kernel to be fully functional.
    In some systems, to add a driver, you have to recompile, compile, and reboot the
    entire kernel, but Linux has the capability of adding some modules to the kernel
    without going through that process. These modules are referred to as *loadable
    kernel modules*, or *LKMs*.


    LKMs have access to the lowest levels of the kernel by necessity, making them
    an incredibly vulnerable target for hackers. A particular type of malware known
    as a *rootkit* embeds itself into the kernel of the operating systems, often through
    LKMs. If malware embeds itself in the kernel, the hacker can take complete control
    of the operating system.'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'If a hacker can get the Linux admin to load a new module to the kernel, the
    hacker not only can gain control over the target system but, because they’re operating
    at the kernel level of the operating system, can control what the target system
    is reporting in terms of processes, ports, hard drive space, and almost anything
    else you can think of.


    So, if a hacker can successfully tempt a Linux admin into installing a video or
    other device driver that has a rootkit embedded in it, the hacker can take total
    control of the system and kernel. This is the way some of the most insidious rootkits
    take advantage of Linux and other operating systems.


    Understanding LKMs is absolutely key to being an effective Linux admin and being
    very effectively and stealthy hacker.


    Let’s take a look at how the kernel can be managed for good and ill.


    # Checking the Kernel Version


    The first step to understanding the kernel is to check what kernel your system
    is running. There are at least two ways to do this. First, we can enter the following:


    ```

    kali uname -a

    Linux Kali 4.6.0-kalil-amd64 #1 SMP Debian 4.6.4-lkalil (2016-07-21) x86_64

    ```


    The kernel responds by telling us the distribution OS is running Linux Kali, the
    kernel built is 4.6.4, and the architecture it’s built for is the x86_64 architecture.
    It also tells us it has symmetric multiprocessing (SMP) capabilities (meaning
    it can run on machines with multiple cores or processors) and was built on Debian
    4.6.4 on July 21, 2016. Your output may be different, depending on which kernel
    was used in your build and the CPU in your system. This information can be required
    when you install or load a kernel driver, so it is useful to understand how to
    get it.'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'One other way to get this information, as well as some other useful information,
    is to use the cat command on the /proc/version file, like so:


    ```

    kali >cat /proc/version

    Linux version 4.6.0-kalil-amd64 (devel@kali.org) (gcc version 5.4.0

    20160909

    (Debian 5.4.0-6) #1 SMP Debian 4.6.4-lkalil (2016-07-21)

    ```


    Here you can see that the /proc/version file returned the same information.


    # Kernel Tuning with sysctl


    With the right commands, you can tune your kernel, meaning you can change memory
    allocations, enable networking features, and even harden the kernel against outside
    attacks.


    Modern Linux kernels use the sysctl command to tune kernel options. All changes
    you make with sysctl remain in effect until you reboot the system. To make any
    changes permanent, you have to edit the configuration file for sysctl directly
    at /etc/sysctl.conf.


    A word of warning: you need to be careful when using sysctl without the proper
    knowledge and experience, you can easily make your system unbootable and unusable.
    Make sure you''ve considered what you''re doing carefully before any permanent
    changes.


    Let''s take a look at the contents of sysctl now. By now, you should recognize
    the options we get with the command shown here:


    ```

    kali >sysctl -a | less

    dev.cdrom.autoclose = 1

    dev.cdrom.autoeject = 0

    dev.cdrom.check_media = 0

    dev.cdrom.debug = 0

    --snip--

    ```


    In the output, you should see hundreds of lines of parameters that a Linux administrator
    can edit to optimize the kernel. There are a few'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'lines here that are useful to you a hacker. As an example of how you

    might sysctl, we''ll look at enabling packet forwarding.


    In the man-in-the-middle (MITM) attack, the hacker places

    them between communicating hosts to intercept information. The

    traffic passes through the hacker''s system, so they can view and possibly

    alter the communication. One way to achieve this routing is to enable

    packet forwarding.


    If you scroll down a few pages in the output or filter for "ipv4"

    (sysctl -a | less | grep ipv4), you should see the following:


    ```

    net.ipv4.ip_dynaddr = 0

    net.ipv4.ip_early_demux = 0

    net.ipv4.ip_forward = 0

    net.ipv4.ip_forward_use_pmtu = 0

    --

    ```


    The line net.ipv4.ip_forward = 0 is the kernel parameter that enables

    the kernel to forward on the packets it receives. In other words, the

    packets when it receives, it sends back out. The default setting is 0, which

    means that packet forwarding is disabled.


    To enable IP forwarding, change the 0 to a 1 by entering the

    following:


    ```

    kali >sysctl -w net.ipv4.ip_forward=1

    ```


    Remember that sysctl changes take place at runtime but are lost

    when the system is rebooted. To make permanent changes to sysctl,

    need to edit configuration file /etc/sysctl.conf. Let''s change the way

    kernel handles IP forwarding for MITM attacks and make this change

    permanent.


    To enable IP forwarding, open the /etc/sysctl.conf file in any text editor

    and uncomment the line for ip_forward. Open /etc/sysctl.conf with any text

    editor and take a look:


    ```

    #/etc/sysctl.conf - Configuration file for setting system variables

    # See /etc/sysctl.d/ for additional system variables.

    # See sysctl (5) for information.

    ```'
