    As mentioned, in the directory tree where devices are attached is known as the
    *mount point*. The two main mount points in Linux are /mnt and /media. As a general
    rule, internal hard drives are mounted at /mnt, and external USB devices such
    as flash drives and external USB hard drives are mounted at /media, though technically
    any directory can be used.


    # Mount Storage Devices Yourself


    In some versions of Linux, you need to mount a drive manually in order to access
    its content, so this is a skill worth learning. To mount a drive on the filesystem,
    use the mount command. The mount point for the device should be an empty directory;
    if you mount a device on a directory that has subdirectories and files, the mounted
    device will cover the contents of the directory, making them invisible and unavailable.
    So, to mount the new hard drive sdb1 at the /mnt directory, you would enter the
    following:


    ```

    kali >mount /dev/sdb1 /mnt

    ```


    That hard drive should then be available for access. If you want to mount the
    flash drive sdc1 at the /media directory, you would enter this:


    ```

    kali >mount /dev/sdc1 /media

    ```


    The filesystems that are mounted on a system are kept in a file at /etc/fstab
    (short for filesystem table), which is read by the system at every bootup.'
