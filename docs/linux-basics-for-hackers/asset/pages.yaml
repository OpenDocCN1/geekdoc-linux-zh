  md: 'filename.


    # Granting the Root User''s Group Permissions SGID


    SGID also grants temporary elevated permissions, but it grants the permissions
    of the file owner''s group, rather than of the file''s owner. This means that,
    with an SGID bit set, someone without execute permission can execute a file if
    the owner belongs to the group that has permission to execute that file.


    The SGID bit works slightly differently when applied to a directory: when the
    bit is set on a directory, ownership of new files created in that directory goes
    to the directory creator''s group, rather than the file creator''s group. This
    is very useful when a directory is shared by multiple users. All users in that
    group can execute the file(s), not just a single user.


    The SGID bit is represented as 2 before the regular permissions, so a new file
    with the resulting permissions 644 would be represented as 2644 when the SGID
    bit is set. Again, for example, you would use the chmod command for this—example,
    `chmod 2644 filename`.


    # The Outdated Sticky Bit


    The sticky bit is a permission bit that you can set on a directory to allow a
    user to delete or rename files within that directory. However, the sticky bit
    is a legacy of older Unix systems, and modern systems (like Linux) ignore it.
    As such, I will not discuss it further here, but you should be familiar with the
    term because you might hear it in the Linux world.


    # Special Permissions, Privilege Escalation, and the Hacker


