- img_proc: true
  md: '# Removing Evidence


    First, you''ll want to remove any logs of your activity. You could simply open
    the log files and precisely remove any logs detailing your activity, line by line,
    using the file deletion techniques you learned in Chapter 2. However, this could
    be time-consuming and leave time gaps in the log files, which would look suspicious.
    Also, deleted files can generally be recovered by a skilled forensic investigator.


    A better and more secure solution is to shred the log files. With other file deletion
    systems, a skilled investigator is still able to recover the deleted files, but
    suppose there was a way to delete the file and overwrite it several times, making
    it much harder to recover. Lucky for us, Linux has a built-in command, appropriately
    named shred, for just this purpose.


    To understand how the shred command works, take a quick look at the help screen
    by entering the following command:


    ```

    kali >shred --help

    Usage: shred [OPTION]...FILE...

    Overwrite the specified FILE(s) repeatedly in order to make it harder

    en even very expensive hardware probing to recover data

    --clip--

    ```


    As you can see from the full output on your screen, the shred command has many
    options. In its most basic form, the syntax is simple:


    ```

    shred <FILE>

    ```


    On its own, shred will delete the file and overwrite it several times—by default,
    shred overwrites four times. Generally, the more times the file is overwritten,
    the harder it is to recover, but keep in mind that each overwrite takes time,
    so for very large files, shredding may become time-consuming.


    Two useful options to include are the -f option, which changes the permissions
    on the files to allow overwriting if a permission change is necessary, and the
    -n option, which lets you choose how many times to'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'overwrite the files. As an example, we''ll shred the log files in /var/log/auth.log
    10 times using the following command:


    ```

    kali >shred -f -n 10 /var/log/auth.log.*

    ```


    We need the -f option to give us permission to shred auth files, and we follow
    the -n option with the desired number of times to overwrite. After the path of
    the file we want to shred, we include the wildcard asterisk so we''re shredding
    not just the auth.log file, but also any logs that have been created with logrotate,
    such as auth.log.1, auth.log.2, and so on.


    Now try to open a log file:


    ```

    kali >leafpad /var/log/auth.log

    ```


    Once you''ve shredded a file, you''ll see that the contents are indecipherable
    gibberish, as shown in Figure 11-1.


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_188_0.png)


    Figure 11-1: A shredded log file


    Now the security engineer or forensic investigator examines the log files, they
    will find nothing of use because none of it is recoverable!


    # Disabling Logging


    Another option for covering your tracks is to simply disable logging. When a hacker
    takes control of a system, they could immediately disable logging to prevent the
    system from keeping track of their activities. This, of course, requires root
    privileges.


    To disable all logging, the hacker could simply stop the syslog daemon. Stopping
    any service in Linux uses the same syntax, shown here (you''ll see more on in
    Chapter 12):'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'service servicename start|stop|restart


    So, to stop the logging daemon, you could simply enter the following command:


    ```

    kali >rsyslog stop

    ```


    Now Linux will stop generating any log files until the service is restarted, enabling
    you to operate without leaving any evidence in the log files!


    # Summary


    Log files track nearly everything that happens on your Linux system. They can
    be an invaluable resource in trying to analyze what has occurred, whether it be
    a malfunction or a hack. For the hacker, log files can be evidence of their activities
    and identity. However, an astute hacker can remove and shred these files and disable
    logging entirely, leaving no evidence behind.


    EXERCISES

    Before you move on to Chapter 12, try the skills you learned from this chapter
    by completing the following exercises:


    1. Use the locate command to find all the rsyslog files.

    2. Open the rsyslog.conf file and change your log rotation to one week.

    3. Disable logging on your system. Investigate what is logged in the file /var/log/syslog
    when you disable logging.

    4. Use the shred command to shred and delete all your kern log files.'
