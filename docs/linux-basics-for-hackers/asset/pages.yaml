  md: 'When you start a process, you can set the priority level with the nice command
    and then alter the priority after the process has started running with the renice
    command. The syntax for these two commands is slightly different and the nice
    command requires that you increment the nice value, whereas the renice command
    wants an absolute value for niceness. Let''s look at an example to demonstrate
    this.


    # Setting the Priority When Starting a Process


    For demonstration purposes, let''s assume we have a process named slowprocessthat''s
    located at /bin/slowprocess. If we wanted it to speed up its completion, we could
    start the process with the nice command:


    ```

    kali >nice -n -10 /bin/slowprocess

    ```


    This command would increment the nice value by -10, increasing its priority and
    allocating more resources.


    On the other hand, if we want to be nice to our fellow users and processes give
    slowprocess a lower priority, we could increment its nice value positively by
    10:


    ```

    kali >nice -n 10 /bin/slowprocess

    ```


    Give this a try on a process you have currently running and then run ps to see
    how it changes, if at all.


    # Changing the Priority of a Running Process with renice


    The renice command takes absolute values between -20 and 19 and sets the priority
    to that particular level, rather than increasing or decreasing from the level
    at which it started. In addition, renice requires the PID of the process you are
    targeting rather than the name. So, if slowprocess is using an inordinate amount
    of resources on your system and you want to give it a lower priority, thus allowing
    other processes a higher priority and more resources, you could renice slowprocess(which
    has a PID of 6996) and give it a much higher nice value, like so:'
