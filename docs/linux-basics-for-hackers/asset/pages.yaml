  md: '# Detecting and Connecting to Bluetooth


    These days, nearly every gadget, mobile device, and system has Bluetooth built
    in, including our computers, smartphones, iPods, tablets, speakers, game controllers,
    keyboards, and many other devices. Being able to hack Bluetooth can lead to the
    compromise of any information on the device, control of the device, and the ability
    to send unwanted info to and from the device, among other things.


    To exploit the technology, we need to understand how it works. An in-depth understanding
    of Bluetooth is beyond the scope of this book, but I will give you some basic
    knowledge that will help you scan for and connect to Bluetooth devices in preparation
    for hacking them.


    # How Bluetooth Works


    Bluetooth is a universal protocol for low-power, near-field communication operating
    at 2.4–2.485GHz using spread spectrum, frequency hopping at 1,600 hops per second
    (this frequency hopping is a security measure). It was developed in 1994 by Ericsson
    Corp. of Sweden and named after the 10th-century Danish king Harald Bluetooth
    (note that Sweden and Denmark were a single country in the 10th century).


    The Bluetooth specification has a minimum range of 10 meters, but there is no
    limit to the upper range manufacturers may implement in their devices. Many devices
    have ranges as large as 100 meters. With special antennas, that range can be extended
    even further.


    Connecting two Bluetooth devices is referred to pairing. Pretty any two Bluetooth
    devices can connect to each other, but they can pair only if they are in discoverable
    mode. A Bluetooth device in discoverable mode transmits the following information:


    +   - Name

    - Class

    - List of services'
  merge: -1
  pgno: 240
- img_proc: true
  md: '+   • Technical information


    When the two devices pair, they exchange a secret or link key. Each stores this
    link key so it can identify the other in future pairings.

    Every device has a unique 48-bit identifier (a MAC-like address) and usually a
    manufacturer-assigned name. These will be useful pieces of data when we want to
    identify and access a device.


    # Bluetooth Scanning and Reconnaissance


    Linux has an implementation of the Bluetooth protocol stack called BlueZ that
    we''ll use to scan for Bluetooth signals. Most Linux distributions, including
    Kali Linux, have it installed by default. If yours doesn''t, you can usually find
    it in your repository using the following command:


    ```

    apt-get install bluez

    ```


    BlueZ has a number of simple tools we can use to manage and scan Bluetooth devices,
    including the following:


    hciconfig This tool operates very similarly to ifconfig in Linux, but for Bluetooth
    devices. As you can see in Listing 14-1, I have used it to bring up the Bluetooth
    interface and query the device for its specs.


    hcitool This inquiry can provide us with device name, device ID, device class,
    and device clock information, which enables the devices to work synchronously.


    hcidump This enables us to sniff the Bluetooth communication, meaning we can capture
    data sent sent over the Bluetooth signal.


    The first scanning and reconnaissance step with Bluetooth is to check whether
    the Bluetooth adapter on the system we''re using is recognized and enabled so
    we can use it to scan for other devices. We'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'can do this with the built-in BlueZ tool hciconfig, as shown in Listing 14-1.


    ```

    kali >hciconfig

    hci0: Type:EDR Bus: USB

    BD Address: 10:AE:60:58:F1:37 ACL MTU: 310:10 SCO MTU: 64:8

    UP RUNNING PSCAN INQUIRY

    RX bytes:13143 acl:45 sco:0 events:10519 errors:0

    TX bytes:42881 acl:50 sco:0 commands:5081 errors:0

    ```


    Listing 14-1: Scanning for a Bluetooth device


    As you can see, my Bluetooth adapter is recognized with a MAC address of 10:AE:60:58:F1:37.
    This adapter has been named hci0. The next step is to check that the connection
    is enabled, which we can also do with hciconfig by providing the name and the
    up command:


    ```

    kali >hciconfig hci0 up

    ```


    If the command runs successfully, we should see no output, just a new prompt.


    Good, hci0 is up and ready! Let''s put it to work.


    # Scanning for Bluetooth Devices with hcitool


    Now that we know our adapter is up, we can use another tool in the BlueZ suite
    called hcitool, which is used to scan for other Bluetooth devices within range.


    Let’s first use the scanning function of this tool to look for Bluetooth devices
    that are sending out their discovery beacons, we’re in discovery mode, with the
