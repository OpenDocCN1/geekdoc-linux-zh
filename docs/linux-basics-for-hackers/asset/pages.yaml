    # Extracting Information from MySQL


    MySQL is the most widely used database behind database-driven web applications.
    In our modern era of Web 2.0 technologies, where nearly every website is database
    driven, this means MySQL holds the data for most of the web.


    Databases are the “golden fleece” for hackers. They contain critical information
    about users as well as confidential information such as credit card numbers. For
    this reason, hackers are most targeting databases.'
