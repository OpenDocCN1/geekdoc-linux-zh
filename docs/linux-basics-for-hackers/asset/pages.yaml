  md: 'Our final proxy trick is the random chaining option, where proxychains will
    randomly choose a set of IP addresses from our list and use them to create our
    proxy chain. This means that each time we use proxychains, the proxy will look
    different to the target, making it harder to track our traffic from its source.
    This option is also considered “dynamic” because one of the proxies is down, it
    will skip to the next one.


    Go back inside the /etc/proxychains.conf file and comment out the lines dynamic_chain
    and strict_chain by adding a # at the start of each line; uncomment the random_chain
    line. We can only use one of these three options at a time, so make certain you
    comment out the other options before using proxychains.


    Next, find and uncomment the line with chain_len and then give it a reasonable
    number. This line determines how many of the IP addresses in your chain will be
    used in creating your random proxy chain.


    ```

    # dynamic_chain

    # Dynamic - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    #

    strict_chain

    # Strict - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # all proxies must be online to play in chain

    # otherwise EINTR is returned to the app

    #

    random_chain

    # Random - Each connection will be done via random proxy

    # (or proxy chain, see chain_len) from the list.

    # this option is good to test your IDS :)


    # Makes sense only if random_chain

    chain_len = 3

    ```


    Here, I have uncommented chain_len and given it a value of 3, meaning proxychains
    will now use three proxies from my list in the /etc/proxychains.conf file, choosing
    them randomly and moving onto the next one if a proxy is down. Note that although
    this method'
  merge: -1
