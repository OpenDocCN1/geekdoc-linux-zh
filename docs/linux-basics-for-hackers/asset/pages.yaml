- img_proc: true
  md: 'Tor’s anonymity has been broken before by these authorities and will likely
    be broken again. The NSA, as one instance, runs its own Tor routers, meaning that
    your traffic may be traversing the NSA’s routers when you use Tor. If your traffic
    is exiting the NSA’s routers, that’s even worse, because the exit router always
    knows your destination. The NSA also has a method known as traffic correlation,
    which involves looking for patterns in incoming and outgoing traffic, that has
    been able to break Tor’s anonymity. Though these attempts to break Tor won''t
    affect Tor’s effectiveness of obscuring your identity from commercial services,
    such as Google, they may limit the browser’s effectiveness in keeping you anonymous
    from spy agencies.


    # Proxy Servers


    Another strategy for achieving anonymity on the internet is to use proxies, which
    are intermediate systems that act as middlemen for traffic: the user connects
    to a proxy, and the traffic is given the IP address of the proxy before it’s passed
    on (see Figure 13-3). When the traffic returns from the destination, the proxy
    sends the traffic back to the source. In this way, traffic appears to come from
    the proxy and not the originating IP address.


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_219_0.png)'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'Of course, the proxy will likely log your traffic, but an investigator would
    have to get a subpoena or search warrant to obtain the logs. To make your traffic
    even harder to trace, you can use more than one proxy, in a strategy known as
    a proxy chain, which we''ll look at a little later in this chapter.


    Kali Linux is an excellent proxying tool called proxychains that you can set up
    to obscure your traffic. The syntax for the proxychains command is straightforward,
    as shown here:


    ```

    kali >proxychains <the command you wanted proxied> <arguments>

    ```


    The arguments you provide might include an IP address. For example, if you wanted
    to use proxychains to scan a site with nmap anonymously, you would enter the following:


    ```

    kali >proxychains nmap -sT - Pn <IP address>

    ```


    This would send the nmap -ss stealth scan command to the given address through
    a proxy. The tool builds the chain of proxies itself, so you don''t have to worry
    about it.


    # Setting Proxies in the Config File


    In this section, we set a proxy for the proxychains command to use. As nearly
    every application in Linux/Unix, configuration of proxychains is managed by the
    config file—specifically /etc/proxychains.conf. Open the config file in your text
    editor of choice with the following command (replacing leafpad with your chosen
    editor if necessary):


    ```

    kali >leafpad /etc/proxychains.conf

    ```


    You should see a file like the one shown in Listing 13-1.


    +   # proxychains.conf VER 3.1

    # HTTP, SOCKS4, SOCKS5 tunneling proxifier with DNS.'
