    -response --enable-normalizer --enable-reload --enable-react

    --enable-flexresp3

    #

    --More--(2%)

    ```


    Listing 2-7: Using more to display terminal output one page at a time


    Notice that more displays only the first page and when it stops, and it

    tells us in the lower-left corner how much of the file is shown (2 percent

    in this case). To see additional lines or pages, press ENTER. To exit more,

    enter q (for quit).


    # Displaying and Filtering with less


    The less command is very similar to more, but with additional

    functionality—hence, the common Linux quite quip, “Less is\more.” With less, you
    can not only scroll through a file at your leisure,

    but you can also filter it for terms. As in Listing 2-8, open snort.conf with

    less.


    ```

    kali >less /etc/snort/snort.conf

