    # Dictionaries


    Dictionaries hold information as unordered pairs, where each pair contains a key
    and an associated value. We can use a dictionary to store a list of items and
    give each item a label so we can use and refer to that item individually. We might
    use a dictionary to store, for example, user IDs and their associated names, or
    to store known vulnerabilities associated with a specific host. Dictionaries in
    Python act like associative arrays in other languages.


    Like lists, dictionaries are iterable, meaning we use a control structure such
    as a for statement to go through the entire dictionary, assigning each element
    of the dictionary to a variable until we come to the end of the dictionary.'
