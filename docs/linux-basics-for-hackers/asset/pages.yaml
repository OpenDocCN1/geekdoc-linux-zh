    of online anonymity and privacy Learn more about The Tor Project »


    13-2: The landing page for the Tor browser


    In addition to being capable of accessing nearly any website on the traditional
    internet, the Tor browser is capable of accessing the dark web. The websites that
    make up the dark web require anonymity, so they allow access only through the
    Tor browser, and they have addresses ending in .onion for their top-level domain
    (TLD). The dark web is infamous for illegal activity, but a number of legitimate
    services are also available there. A word of caution, however: when accessing
    the dark web, you may come across material that may find offensive.


    # ## Security Concerns


    The intelligence and spy services of the United States and other nations consider
    the Tor network a threat to national security, believing such an anonymous network
    enables foreign governments and terrorists to communicate without being watched.
    As a result, a number of robust, ambitious research projects are working to break
    the anonymity of.'
