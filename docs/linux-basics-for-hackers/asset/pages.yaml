  md: '# # 6

    PROCESS MANAGEMENT


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_118_0.png)


    At any given time, a Linux system typically has hundreds, or sometimes even thousands,
    of processes running simultaneously. A *process* is simply a program that''s running
    and using resources. It includes a terminal, web server, any running commands,
    any databases, the GUI interface, and much more. Any good Linux administrator—and
    particularly a hacker—needs to understand how to manage their processes to optimize
    their systems. For example, once a hacker takes control of a target system, they
    might want to find and stop a certain process, like an antivirus application or
    firewall. To do so, the hacker would first need to know how to find the process.
    The hacker might also want to set a scanning script to run periodically to find
    vulnerable systems, so we''ll also look at how to schedule such a script.


    In this chapter, you''ll learn to manage those processes. First, you''ll learn
    to view and find processes and how to discover which processes are using the most
    resources. Then, you''ll learn to manage processes by running them in the background,
    prioritizing them, and killing them if necessary ( blood involved). Finally, you''ll
    learn to schedule processes to run on specified days and dates and at specific
    times.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Viewing Processes


    In most cases, the first step in managing processes is to view what processes
    are running on your system. The primary tool for viewing processes—and one of
    the Linux administrator''s best friends—is the ps command. Run it in your command
    line to see what processes are active:


    ```

    kali >ps

    PID TTY TIME CMD

    39659 pts/0 00:00:01 bash

    39665 pts/0 00:00:00 ps

    ```


    The Linux kernel, the inner core of the operating system that controls nearly
    everything, assigns a unique process ID (PID) to each process sequentially, as
    the processes are created. When working with these processes in Linux, you often
    need to specify their PIDs, so it is far more important to note the PID of the
    process than the name of the process.


    Alone, the ps command doesn''t really provide you with much information. Running
    the ps command without any options (said to be invoked) by the currently logged-in
    user (in our case, root) and what processes are running on that terminal. Here,
    it simply says that the bash shell is open and running and we ran the ps command.
    We want and need far more information than that, particularly on those processes
    running by other users and by the system in the background. Without this information,
    we know very little of what is actually taking place on our system.


    Running the ps command with the options aux show all processes running on the
    system for all users, as shown in Listing 6-1. Note that you don''t prefix these
    options with a dash (-) and that everything is in lowercase; because Linux is
    case-sensitive, using uppercase options would give you significantly different
    results.


    ```

    kali >ps

    USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND

    ```'
