    # Options: --enable-gre --enable-mpl --enable-targetbased

    --enable-ppm --enable-perprofiling enable-zlib --enable-active

    --response --enable-normalizer --enable-reload --enable-react

    /etc/snort/snort.conf

    ```


    Listing 2-8: Using less to both display terminal output at a time and filter

    results


    Notice in the bottom left of the screen that less has highlighted the

    path to the file. If you press the forward slash (/) key, less will let you

    search for terms in the file. For instance, when you first set up Snort,

    y need to determine where and where you want to send your intrusion

    alert output. To find that section of the configuration file, you could

    simply search for output, like so:


    ```

    # Snort build options:

    # Options: --enable-gre --enable-mpl --enable-targetbased

    ```'
