- img_proc: true
  md: '# Basic Wireless Commands


    In Chapter 3, you were introduced to the basic Linux networking command ifconfig,
    which lists each activated network interface on your system with some basic statistics,
    including (most importantly) the IP address of each interface. Let''s take another
    look at your results from running ifconfig and focus on the wireless connections
    this time.


    ```

    kali >ifconfig

    eth0Linkencap:EthernetHwaddr 00:0c:29:ba:02:0f

    inet addr:192.168.181.131 Bcast:192.168.181.255

    --snip-

    lo Linkencap:Local Loopback

    inet addr:127.0.0.1 Mask:255.255.0.0

    --snip-

    ```


    The Wi-Fi interface here is shown as wlan0. In Kali Linux, Wi-Fi interfaces are
    usually designated as wlanX, with X representing the number of that interface.
    In other words, the first Wi-Fi adapter on your system would be labeled wlan0,
    the second wlan1, and has three


    If you just want to see your Wi-Fi interfaces and their statistics, Linux has
    a specific command that is similar to ifconfig but dedicated to wireless. That
    command is iwconfig. When you enter it, only your wireless interfaces and their
    key data are displayed:


    ```

    kali >iwconfig

    lo no wireless extensions

    ```


    ```

    wlan0 IEEE 802.11bg ESSID:off/any

    Mode:Managed Access Point:Not-Associated Tx-Power=20 dBm

    Retry short limit:7 RTS thr:off Fragment thr:off

    Encryption key:off

    Power Management:off

    ```


    ```

    eth0 no wireless extensions

    ```


    Here, we see just the wireless interfaces, also known as network cards, and key
    data about them, including the wireless standard utilized, whether the ESSID is
    off, and the mode. The mode has three settings:'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'managed, which means it is ready to join or has joined an AP; *master*, which
    means it is ready to act as or already is an AP; and *monitor*, which we''ll discuss
    a little later in the chapter. We can also see whether any client has associated
    with it and what its transmit power is, among other things. You tell this from
    this example that wlan0 is in the mode required to connect to a Wi-Fi network
    but is not connected to any yet. We will revisit this command again once the wireless
    interface is connected to a Wi-Fi network.


    If you are not certain which Wi-Fi AP you want to connect to, you can see all
    the wireless access points your your network card can reach using the iwlist command.
    The syntax for iwlist is as follows:


    ```

    iwlist interface action

    ```


    You can perform multiple actions with iwlist. For our purposes, we''ll use the
    scan action to see all Wi-Fi APs in your area. (Note with a standard antenna,
    your range will be 300–500 feet, but this can be extended with an inexpensive
    high-gain antenna.)


    ```

    kali >iwlist wlan0 scan

    wlan0 Scan completed:

    Cell 01 - Address:88:AD:43:75:B3:82

    Channel:1

    Frequency:2.412GHz (Channel 1)

    Quality=70/70 Signal level =-38 dBm

    Encryption key:off

    ESSID:Hackers-Arise"

    --snip--

    ```


    The output from this command should include all Wi-Fi APs within range of your
    wireless interface, along with key data about each AP, such as the MAC address
    of the AP, the channel and frequency it is operating on, its quality, its signal
    level, whether its encryption key is enabled, and its ESSID.


    You will need the MAC address of the target AP (BSSID), the MAC address of a client
    (another wireless network card), and the channel the'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'AP is operating on in order to perform any kind of hacking, so this is valuable
    information.


    Another command that is very useful in managing your Wi-Fi connections is nmcli
    (or the network manager command line interface). The Linux daemon that provides
    a high-level interface for the network interfaces (including the wireless ones)
    is known as the network manager. Generally, Linux users are familiar with this
    daemon from its graphical user interface (GUI), but it can also be used from the
    command line.


    The nmcli command can be used to view the Wi-Fi APs near you and their key data,
    as we did with iwlist, we use it in the format nmcli dev networktype, where dev
    is for devices and the type (in this case) is wifi, like so:


    ```

    kali >nmcli dev wifi  CHAN RATE BARS SECURITY

    * SSID      MODE

    Hackers-Arise Infra 1    54 Mbits/s 100   WPA1 WPA2

    Xfinitywifi Infra 1    54 Mbits/s 75    WPA2

    TTP1 Infra 11    54 Mbits/s 44    WPA1 WPA2

    --snip--

    ```


    In addition to displaying the Wi-Fi APs within range and key data about them,
    including the SSID, the mode, the channel, the rate of transfer, the signal strength,
    and the security protocols enabled on the device, nmcli can be used to connect
    to APs. The syntax to connect to AP is as follows:


    ```

    nmcli dev wifi connect AP-SSID password APpassword

