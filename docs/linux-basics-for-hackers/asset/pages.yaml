  md: 'lpr Printing system


    mail Mail system


    user Generic user-level messages


    An asterisk wildcard (*) in place of a word refers to all facilities. You can
    select more than one facility by listing them separated by a comma.

    The priority tells the system what kinds of messages to log. Codes are listed
    from lowest priority, starting at debug, to highest priority, ending at panic.
    If the priority is *, messages of all priorities are logged. When you specify
    a priority, messages of that priority and higher are logged. For instance, if
    you specify a priority code of alert, the system will log messages classified
    as alert and higher priority, but it won''t log messages marked as crit or any
    priority lower than alert.

    Here''s the full list of valid codes for priority:


    +   * debug

    * info

    * notice

    * warning

    * warn

    * error

    * err

    * crit

    * alert

    * emerg

    * panic


    The codes warning, warn, error, err, emerg, and panic have all been deprecated
    and should not be used.

    The action is usually a filename and location where the logs should be sent. Note
    that generally, log files are sent to the /var/log directory with a filename that
    describes the facility that generated them, such as'
