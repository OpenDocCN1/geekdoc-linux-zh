    # Scanning for Services with sdptool


    Service Discovery Protocol (SDP) is a Bluetooth protocol for searching for Bluetooth
    services (Bluetooth is suite of services), and, helplessly, BlueZ provides the
    sdptool tool for browsing a device for the services it provides. It is also important
    to note that the device does not have to be in discovery mode to be scanned. The
    syntax is as follows:


    ```

    sdptool browse MACAddress

