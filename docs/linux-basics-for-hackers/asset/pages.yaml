    # Basic Commands in Linux


    To begin, let''s look at some basic commands that will help you get up and running
    in Linux.


    # Finding Yourself with pwd


    Unlike when you''re working in a graphical user interface (GUI) environment like
    Windows or macOS, the command line in Linux does not always make it apparent directory
    you''re presently in. To navigate to a new directory, you usually need to know
    where you are currently. The present working directory command, `pwd`, returns
    your location within the directory structure.


    Enter `pwd` in your terminal to see where you are:


    ```

    kali >pwd

    /root

    ```


    In this case, Linux returned `/root`, telling me I''m in the root user''s directory.
    And because you logged in as root when you started Linux, you should be in the
    root user''s directory, too, which is one level below the top of the filesystem
    structure (/).


    If you''re in another directory, `pwd` will return that directory name instead.


    # Checking Your Login with whoami'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'In Linux, the one “all-powerful” supervisor or system administrator is named
    root, and it has all the system privileges needed to add users, change passwords,
    change privileges, and so on. Obviously, you don''t want just anyone to have the
    ability to make such changes; you want someone who can be trusted and has proper
    knowledge of the operating system. As a hacker, you usually need to have all those
    privileges to run the programs and commands you need unless you have root privileges),
    so you''ll want to log in as root.


    If you’ve forgotten whether you’re logged in as root or another user, you can
    use the whoami command to see which user you’re logged in as:


    ```

    kali >whoami

    root

    ```


    If I had been logged in as another user, such as my personal account, whoami would
    have returned my username instead, as shown here:


    ```

    kali >whoami

    OTW

    ```


    # Navigating the Linux Filesystem


    Navigating the filesystem from the terminal is an essential Linux skill. To get
    anything done, you need to be able to move around to find applications, files,
    and directories located in other directories. In a GUI-based system, you can see
    the directories, but when you’re using the command line interface, the structure
    is entirely text based, and navigating the filesystem means using some commands.


    # Changing Directories with cd


    To change directories from the terminal, use the change directory command, cd.
    For example, here’s how to change to the /etc directory used to store configuration
    files:'
  merge: -1
  pgno: 51
- img_proc: true
  md: '```

    kali >cd /etc

    root@kali:/etc#

    ```


    The prompt changes to root@kali:/etc, indicating that we''re in the

    etc directory. We can confirm this by entering pwd:


    ```

    root@kali:/etc# pwd

    etc

    ```


    To move up one level in the file structure (toward the root of the file

    structure, or /), we use cd followed by double dots (..), as shown here:


    ```

    root@kali:/etc# cd ..

    root@kali:# pwd

    /

    root@kali:# /

    ```


    This moves us one level from /etc to the root directory, but you

    move up as many levels as you need. Just use the same number of

    double-dot pairs as the number of levels you want to move:


    +   * You would use .. to move up one level.

    * You would use ... .. to move up two levels.

    * You would use . . . . to move up three levels, and so on.


    So, for example, to move up two levels, enter cd followed by two sets

    ofouble dots with a space in between:


    ```

    kali >cd ..

    ```


    You can also move up to the root level in the file structure from

    anywhere by entering cd /, where / represents the root of the filesystem.


    # Listing the Contents of a Directory with ls


    To see the contents of a directory (the files and subdirectories), we can

    use the ls (list) command. This is very similar to the dir command in'
