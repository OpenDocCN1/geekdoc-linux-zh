    # How Linux Represents Storage Devices


    Linux uses logical labels for drives that are then mounted on the

    filesystem. These logical labels will vary depending on where the drives

    mounted, the same hard drive might have different labels

    at different times, depending on where and when it’s mounted.


    Originally, Linux represented floppy drives (remember those?) as fd0\and hard
    drives as hda. You will still occasionally see these drive

    representations on legacy Linux systems, but today most floppy drives

    gare gone (thank goodness). Even so, legacy hard drives that used an

    IDE or E-EIDE interface are still represented in the form hda. Newer

    Serial ATA (SATA) interface drives and Small Computer System

    Interface (SCSI) hard drives are represented as sda. Drives are

    somtimes split into sections named as partitions, which are

    represented in the labeling system with numbers, as you’ll see next.


    When systems have more than one hard drive, Linux simply names

    themially by incrementing the last letter in alphabetical order, so the

    first drive is sda, and the second drive is sdb, the third drive is sdc,

    and so on (see Table 10-1). The serial letter after sd is often referred to as

    the major number.


    **Table 10-1:** Device-Naming System


    # Device file Description'
