- img_proc: true
  md: 'Like Linux, MySQL is open source and general public licensed (GPL), and you''ll
    find it preinstalled on nearly every Linux distribution.


    Being free, open source, and powerful, MySQL has become the database of choice
    for many web applications, including popular websites such as WordPress, Facebook,
    LinkedIn, Twitter, Kayak, Walmart.com, Wikipedia, and YouTube.


    Other popular content management systems (CMSs) such as Joomla, Drupal, and Ruby
    on Rails all use MySQL, too. You get the idea. If you want to develop or attack
    the backend databases of web applications, you should know MySQL. Let''s get started.


    # Starting MySQL


    Fortunately, Kali has MySQL already installed (if you''re using another distribution,
    you can download and install MySQL from the software repository or directly from
    https://www.mysql.com/downloads/).


    To start your MySQL service, enter the following into the terminal:


    ```

    kali >service mysql start

    ```


    Next, you need to authenticate yourself by logging in. Enter the following and,
    when prompted for a password, just press ENTER:


    ```

    kali >mysql -u root -p

