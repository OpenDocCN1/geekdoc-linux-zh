- img_proc: true
  md: 'history of protecting secrets (remember those Swiss bank accounts you’ve heard
    so much about?), and ProtonMail’s servers are based in the European Union, which
    has much stricter laws regarding the sharing of personal data than does the United
    States. ProtonMail does not charge for a basic account but offers premium accounts
    for a nominal fee. It is important to note that when exchanging email with non-ProtonMail
    users, there is the potential for some or all of the mail not to be encrypted.
    See the ProtonMail support knowledge base for full details.


    ![](img/83bc88dfd58e7c86e47f07708dac7feb_229_0.png)


    Figure 13-5: The ProtonMail login screen


    # Summary


    We are constantly being surveilled by commercial firms and national intelligence
    agencies. To keep your data and web travels secure, we need to implement at least
    one of the security measures discussed in this chapter. By employing them in combination,
    you can minimize your footprint on the web and keep your data much more secure.'
