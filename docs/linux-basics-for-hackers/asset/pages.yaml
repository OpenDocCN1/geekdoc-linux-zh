    ```


    In the case of a zombie or a malicious process, you likely want to send the kill
    -9 signal, the absolute kill signal, to the process. This makes certain that the
    process is terminated.


    ```

    kali >kill -9 6996

    ```


    If you don''t know a process''s PID, you can use the killall command to kill the
    process. This command takes the name of the process, instead of the PID, as an
    argument.


    For example, you could terminate a hypothetical zombieprocess like


    ```

    kali >killall -9 zombieprocess

    ```


    Finally, you can terminate a process in the top command. Simply press the K key
    and then enter the PID of the offending process.


    # Running Processes in the Background


    In Linux, whether you''re working from the command line or the GUI, you''re working
    within a shell. All commands that run are executed within that shell, even if
    they run from the graphical interface. When you execute a command, the shell waits
    until the command is completed before offering another command prompt.


    At times, you may want a process to run in the background, rather than having
    to wait for it to complete in that terminal. For instance, say we want to work
    on a script in a text editor and so have called our text editor (leafpad) by entering
    the following:


    ```

    kali >leafpad newscript

    ```'
  merge: -1
