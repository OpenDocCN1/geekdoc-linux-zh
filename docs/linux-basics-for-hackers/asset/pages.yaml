    run this code if the expression is true

    ```


    The if statement contains a condition that might be something like if variable
    < 10, for example. If the condition is met, the expression evaluates to true,
    and then the code that follows, known as the control block, is executed. If the
    statement evaluates to false, then the statements in the control block are skipped
    over and not executed.


    In Python, the control block must be indented. This indentation identifies the
    control block to the interpreter. The next statement that is not indented is outside
    the control block and therefore not part of the'
