    This code sets the document''s author, title, and subject to values pulled from
    a MySQL database. The pdf_set_info() function replaces a number of deprecated
    functions that set fields specifically.


    # Required Elements


    To render the most basic page, every PDFLib generated document requires the following
    elements:


    +   - pdf_new(): Needed to create a new PDF resource.


    +   - pdf_open_file($pdf, [$filename]): Accepts a PDF resource and an optional
    filename as parameters. The filename is unnecessary for buffered output, as it
    is at the end of this section.


    +   - pdf_begin_page($pdf, $width, $height): Accepts a font PDF resource as well
    as the width and height of the points


    +   - pdf_find_font($pdf, $font, $encoding [, $embed]): Locates a font given a
    PDF resource, a specific font name, and encoding as parameters. Passing a non-zero
    value as the fourth parameter will cause the font to be immediately checked, averting
    subsequent events.


    +   - pdf_set_font($pdf, $font, $size): Accepts a PDF resource, a font handle
    (returned by the pdf_find_font function) and a font size.


    +   - pdf_show_xy($pdf, $text, $x, $y): Places the text within the given PDF resource
    at the given x and y coordinates given in points.


    +   - pdf_stroke($pdf): "Inks" or draws the text on the given PDF resource.


    +   - pdf_end_page($size): Finishes the current page of the given PDF resource.


    +   - pdf_close($pdf): Closes the PDF resource.


