  md: '# Chapter 4


    Note that the name of the destination database for your restoration must be an
    actual database that already exists in the system. If you want to restore a backup
    to a new table, just log into the mysql client, create an empty database with
    the name you want, exit the client, and then restore your backup as desired.


    # Summary


    Hopefully with the information in this chapter, you''ll be able to go out and
    set up intricate database schemas, use complex queries, and maintain the whole
    system as well. Armed with these basic tools, there should be very few database
    obstacles you can''t overcome. You might find in your role as a developer that
    you''ll spend less time at a command-line interface, and more with tools as PhpMyAdmin
    or MySQL''s own MySQL Administrator GUI tool. The raw commands and queries you''ve
    seen in this chapter should be able to apply in any of these tools, as long as
    they have a way to enter raw commands. Your understanding of the exact SQL that
    performs your administrative and data-manipulative duties will also help you understand
    exactly what is going on behind any text fields, radio buttons, and checkboxes
    of a GUI MySQL application—or in your PHP application itself.'
