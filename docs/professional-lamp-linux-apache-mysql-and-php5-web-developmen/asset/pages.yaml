  md: '# 11

    AJAX


    Typical web applications interact with the user forms. The server sends the client
    form, the user enters responses, and the form is submitted back to the server
    for processing. Once the form is processed, the server responds with a new complete
    page, the composition of which is often dependent upon the user''s last form submission.
    In each interaction with the user, with each page request, an entirely new page
    is required. Such applications must use bandwidth, transferring constant page
    elements (site navigation, for example) even though those elements were sent to
    the client in previous responses. Further, such applications are slower than desktop
    applications, because the web application is unresponsive while one of interaction
    is being processed until the new page loads.


    AJAX (Asynchronous JavaScript and XML) refers to a group of technologies that
    allow for the creation of fat-client web applications, where the responsibility
    for a relatively large portion of the application processing is given to the client.
    Specifically, AJAX applications often use HTML and CSS for semantic markup, XML
    to format data that will be exchanged between client and server, and JavaScript
    to communicate with the server and manipulate the Document Object Model (DOM).
    When using AJAX, communication between the client and the server can be limited
    to data only, as the client has the functionality to handle presentation and user
    interaction. Further, such communication happens asynchronously and without a
    refresh. This allows for the client-side of the application to remain responsive
    while data is being exchanged with the server. If a user performs an action that
    requires a request be be sent to the server, the can handle further interaction
    while awaiting a response (issuing more requests). This concept is illustrated
    in Figure 11.1.


    Probably the most popular AJAX technology is Google''s Gmail (http://www.gmail.com),
    a web-based email client. In traditional web-based clients, nearly every action
    by the user causes a refresh of the entire page or frame. Because Gmail employs
    AJAX, the page never refreshes. The interface is updated dynamically by manipulating
    the DOM with JavaScript based on user interaction and XML communication with the
    Gmail server. This enables, for example, a user to compose an email, click Send,
    and continue reading his or her email while the Gmail server handles the actual
    processing of the sent message. While reading the rest of the email, he or she
    receive a status message indicating that the message was sent successfully.'
