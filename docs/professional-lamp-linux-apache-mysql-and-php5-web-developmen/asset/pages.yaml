  md: '# Chapter 5


    # session.hash_function


    In the past, when PHP created a new session and session ID for a user, you had
    no control over what algorithm was used to create the session. With session.hash_function,
    you have the ability to choose between two hash algorithms used to create the
    session.


    Setting this to 0 tells PHP to use MD5 to hash the session ID (128bits). If you
    wanted to use SHA-1 (160bits), you would set the value to 1.


    # session.hash_bits_per_character


    To configure the session ID, you can use session.hash_bits_per_character to specify
    how many bits are stored in each character of the session ID when converting to
    a readable value. The options are as follows:


    +   - 4: 0-9


    # zend.ze1_compatibility_mode


    The last new configuration setting, zend.ze1_compatibility_mode, simply specifies
    whether or not you want to enable compatibility with Zend Engine 1 (PHP4).


    # PHP Configuration during Runtime


    Checking and changing the settings of directives in php.ini directly is often
    a quick and easy solution to monitoring and modifying your installation, but many
    times you can''t bring the server down to make a change, or you need to know a
    setting while a script is running. The techniques in this part of the chapter
    will help you make modifications while the server is still running.


    # Obtaining Current Runtime Settings


    If you need to know the exact version of PHP installed, PHP provides the phpversion()
    function, which returns a string list telling the full installed. For example:


    ```

    <?php

    echo "The current version of PHP installed is: " . phpversion();

    ?>

    ```


    This would output something like the following:


    The current version of PHP installed is: 5.0.4'
