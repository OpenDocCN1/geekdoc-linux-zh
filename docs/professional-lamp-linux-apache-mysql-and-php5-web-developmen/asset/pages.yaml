  md: "# Chapter 2\n\n# Using Classes: Instances\n\nIn order to access the properties\
    \ and the methods of a class, you first need to instantiate, or create an instance,\
    \ of the class. When a class is instantiated, it returns an individual object\
    \ of that class type that you can use. In PHP5, object instances are created using\
    \ the new keyword, like so:\n\n```\n$c = new Circle();\n```\n\nOnce an object\
    \ is created, the individual properties and methods are accessed using an “arrow”\
    \ operator (a hyphen immediately followed by a greater-than sign), as shown in\
    \ the following code:\n\n```\n<?php\nclass Circle {\n    public $radius;\n\n \
    \   public function calcArea($radius)\n    {\n        return pi() * pow($radius,\
    \ 2);\n    }\n}\n\n// Create a new instance of Circle\n$c = new Circle();\n\n\
    // Change a property\n$c->radius = 5;\n\n// Use a method\necho 'The area of the\
    \ circle is ' . $c->calcArea(5);\n\n?>\n```\n\nIf you run the code, you will see\
    \ something similar to:\n\n> The area of the circle is 78.539816339745\n\nLooking\
    \ at the code, you will see that you start out by defining the class Circle. Then,\
    \ you added the code that instantiates the object:\n\n```\n// Create a new instance\
    \ of Circle\n$c = new Circle();\n```\n\nFinally, you changed the $radius property\
    \ to a value of 5, and calculated the area of the circle given a radius of 5:\n\
    \n```\n// Change a property\n$c->radius = 5;\n\n// Use a method\necho 'The area\
    \ of the circle is ' . $c->calcArea($c->radius);\n```"
