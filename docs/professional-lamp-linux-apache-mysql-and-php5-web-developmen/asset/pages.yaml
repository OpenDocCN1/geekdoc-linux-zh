  md: '# Chapter 4


    This error simply reflects another of the behaviors associated with a simple InnoDB
    foreign key: you cannot modify a referenced column if its value is present in
    the referencing table. What if that behavior is not what you want? As luck would
    have it, you can specify the update and delete behavior of foreign keys to one
    of five different options: RESTRICT, CASCADE, SET NULL, NO ACTION, and SET DEFAULT.
    Here''s a quick breakdown of each behavior:


    +   - RESTRICT is the default behavior. A referenced value cannot be changed or
    deleted.

    - CASCADE allows you to propagate down to the referencing table. If you updated
    the model_id in the Models table, it would cascade down to the New_Vehicles table
    and update any corresponding rows. Note that this can apply to deletes as well
    (if specified) - deleting a row in a parent table will automatically delete all
    rows in the child table referenced that value.

    - SET NULL changes the value in the child table to NULL when you update the parent
    value.

    - NO ACTION simply tells the database to allow the change to the parent table
    and do nothing to the child table.

    - SET DEFAULT changes the values in the child table to their DEFAULT when the
    parent values are changed or deleted.


    Implementing these behaviors is a simple matter of depending on the DELETE or
    ON UPDATE clause to the end of the foreign key definition, like:


    ```

    ALTER TABLE [tablename] ADD CONSTRAINT [key_name] FOREIGN KEY ((indexed_column])

    REFERENCES [foreign_table] ((id_column]) ON UPDATE [update behavior] ON DELETE

    [delete behavior];

    ```


    To change an existing key to support different update and delete behaviors, you
    have to delete the old key, recreate the foreign key on the New_Vehicles table
    to cascade any updates, and set NULL when a model is deleted, use: the following:


    ```

    ALTER TABLE New_Vehicles DROP FOREIGN KEY refmdl;

    ALTER TABLE New_Vehicles refmdl ADD CONSTRAINT FOREIGN KEY (model_id) REFERENCES

    Models (model_id) ON UPDATE CASCADE ON DELETE NULL;

    ```


    Now every time a model_id is changed in the Models, the new value will be propagated
    down to all rows in New_Vehicles that used the original value. Have a look for:


    ```

    UPDATE Models SET model_id=123 WHERE model_id=id;

    SELECT * FROM New_Vehicles G

    ```


    The update will succeed, and return similar to the following:


    ******************** 1. row *********************

    vehicle_id: 1

    model_id: 123

    price: NULL

    color: Dark Blue

    description: Popular SUV; for moving people or across town, or wherever your adventures
    may take you.

    modelyear: 2005


