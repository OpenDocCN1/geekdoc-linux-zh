    # Content Compression


    If we were to tell you that a couple minutes of Apache configuration, you could
    save drastic amounts off your monthly bandwidth usage? You might think it''s a
    lie, but in fact it''s true — all you need is content compression and a couple
    of configuration directives.


    What''s content compression? When web pages are downloaded over the Internet,
    by default the bits and bytes that make the page markup, images, 살펴보도록, and other
    content are in a uncompressed


    145'
