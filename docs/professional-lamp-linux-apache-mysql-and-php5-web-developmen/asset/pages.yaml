  md: '# Database Maintenance


    You’ve created your Vehicle Inventory database, put it in production, set up searching,
    and the client is now pleased with the outcome. Time to sit back and relax, right?


    Not quite. There’s another thing you might want to consider, to help minimize
    the cost of a catastrophic loss of the production databases. What you need are
    backups.


    # Creating Backups


    Backups in MySQL are very easy to perform, thanks to a great set of client tools
    that come with the system. To create your backup, you can use the mysqld utility.
    The first thing you need to do is exit the MySQL client, needed, and find yourself
    at your shell prompt:


    ```

    mysql exit

    ```


    Once you’re back at a command prompt, it’s a simple matter of invoking the mysqldump
    command-line tool. For most database backups, the following generic format will
    work:


    ```

    mysqldump --opt database > backupfile.sql

    ```


    Here you’re calling the mysqldump command and telling it to dump the database
    named dat into a file called backupfile.sql. Also present is the --opt option,
    which tells the backup utility to use a set of options that can help MySQL restore
    the file more accurately.


    For mysqldump options, type man mysqldump at your command prompt.


    To back up your vehicle inventory database, use the following:


    ```

    mysqldump --opt VehicleInventory > vi_backup.sql

    ```


    As with the mysql command-line client, if you need to supply a username and password,
    make sure you use -u and -p accordingly before the name of the database.


    You now have a full database-creation script in the vi_backup.sql. You can now
    archive this file as needed, restore it to a different server, burn it to a CD
    or DVD, or anything else you prefer.


    # Restoring Databases from Backups


    In the event that a server crashes, or gets hacked, or you just want a copy of
    the production database for testing in a development environment, you’re going
    to know how to restore your database backups. In MySQL, it’s extremely simple,
    as you can use the MySQL command-line client, like so:


    ```

    mysql database < backupfile.sql

    ```


    So to restore the VehicleInventory database, use this:


    ```

    mysql VehicleInventory < vi_backup.sql

    ```'
  merge: -1
