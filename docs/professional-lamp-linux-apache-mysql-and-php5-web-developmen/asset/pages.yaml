- img_proc: true
  md: '# Chapter 9


    running that you''re tempted to fiddle with it to make it faster, ask yourself
    if doing so really be worth the hassle. Is it too slow for your taste? Which part?
    Will your fiddling make it go faster? By how much? And are you sure you won''t
    break something in the process? By considering some of these questions you can
    avoid a lot of time and effort on something that no benefit, and if you''re lucky,
    discover a trivial change that nets you an enormous performance boost.


    # A Lot for a Little


    In one company I worked for there a computer used for generating reports. The
    software was Windows Nt4 and Microsoft Access 97 (in 2004), the installed memory
    was 32MB, and printing a report was an exercise in patience. You could go and
    get a cup of coffee while it reprinted the screen. There was talk of upgrading
    to a new computer because it was "so slow"


    The "simple" answer—the one that could be reached without analysis—would have
    to replace the existing machine with a new computer, with the latest versions
    of Windows and Access, followed by setting up the user accounts and paying a day
    fines to see it eventually accompany an upgrade. An analysis was made, consisting
    of hitting Ctrl-Alt-Delete and in NT''s Task Manager and its process being used
    to generate a report. (If you''re not familiar with this process in Windows, picture
    a trimmed-down top(1) using a GUI widget).


    The most prominent feature of the listing was the entry "System Idle Process."
    This never below 85%. In minutes of operation, the processor was actually doing
    something for only three of them; the rest of the time it was waiting for memory
    to be swapped between RAM and the disk. The computer could run more than six times
    faster than it was, if it wasn''t being held back by the meager 32MB of RAM that
    it had.256MB would be more than sufficient to negate the bottleneck; the report
    would be generated five times less than it takes to run the printer; the chips
    would be a lot cheaper than a new machine and new software licenses; instead of
    losing a day to installation, downtime would be one of five minutes.


    # A Little for a Lot


    A common idiom in C is to write <<3 instead of *8 to multiply a variable by eight.
    It works of course, because in binary multiplying by 8 (or 2^3) is equivalent
    to shifting the bits of a 3=lg(8) places to the left. This can be done in PHP?
    The answer is yes, but just as in C, the shifting is a matter of nanoseconds.
    For example, by 2.4 GHz Processor, the delay was 50ns for PHP5,0.3, and 3.5ns
    for 4.3.11, with the only significant variation between versions in the speed
    of bit shifting. Your results may vary. Incidntally, $8=$a+$8 is faster than $a*8.


    While using such a saving makes sense in an environment where you''re carrying
    out of multiplications on a regular base (enough that modern compilers can recognize
    *8 and convert it to <<3 themselves anyway), this is not typical of web-based
    applications. What''s more, in PHP the two "equal" operations have different behaviors
    in extreme cases: bit shifting produces an integer result (which may be 0 or even
    negative:1073741824<<1=-2174833648 and -2174833648<<1=0), while multiplication
    will return a double if it is necessary to contain the result (1073741824*2=2174833648
    and 2174833648*2=4249967296). Plus, you have to remember that while multiplication
    has a higher precedence than addition, but shifting is lower: it''s $a+$b*8, but
    $a+($b<<3).


