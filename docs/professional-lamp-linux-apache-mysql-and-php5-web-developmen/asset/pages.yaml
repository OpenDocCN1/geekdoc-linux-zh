  md: '# Other Micro CMS Packages


    Though this chapter has focused on blogs and wiki, you may already have a site
    developed and need to "plug-in" some additional functionality. There are many
    CMSs that can make your life easier and allow you to easily enhance your site
    without having to code from scratch.


    Some of the more popular Micro CMS packages are:


    +   - Publication/News Management CMS: FusionNews, available at http://www.fusionphp.net

    - Managed Learning Environment CMS: Moodle, available at http://www.moodle.org

    - Transactional CMS: osCommerce or ZenCart, available at http://www.oscommerce.com
    and http://www.zencart.com respectively

    - Image Galleries: Coppermine, available at http://coppermine.sourceforge.net

    - Forums: phpBB, available at http://www.phpbb.com

    - Chat Rooms: phpmychat, available at http://phpmychat.sourceforge.net

    - Polls/Surveys: PrestoPoll, available at http://prestopoll.sourceforge.net

    - Calendar Systems: WebCalendar, available at http://www.kn5.us/webcalendar.net


    # Other Helpful Resources


    There are other places you can go to sift through the muck and mire—places that
    make it their business to compare, evaluate, and keep track of the numerous CMSs
    out there. A few to get started include:


    +   - OpenSourceCMS:http://www.opensource.com. This site is designed to give you
    a "test run" of any PHP/MySQL CMS out there, allowing you to see first-hand what
    features are available on each one, how well the admin screen functions, and depth
    and breadth of CMS itself. There are a couple of great things about this website:
    you don''t have to install the entire package just to demo the software, and they
    showcase CMSs that are installable on remote server (without root access), as
    well as the main server itself. If any CMS doesn''t make the list, then they either
    get it installed easily (another filter for you), or they don''t know about yet.
    This site also features reviews by other users for a completely unbiased opinion.


    The only drawback to using this site is that there are others "playing around"
    with the software at the same time as you, which makes for interesting evaluations
    and possibly unexpected outcomes. Luckily, the servers refresh demo software every
    two hours, so you will eventually be able to see a "clean" copy.


    +   - CMSReview:http://www.cmsreview.com. This is a comprehensive CMS site that
    provides great resources on how to determine what the CMS needs for your company
    and where to go to find a CMS consultant, and a link to a CMS glossary in you
    come across any unfamiliar terminology.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Chapter 13


    +   - CMSMatrix: http://www.cmsmatrix.org. If you''re looking to compare numerous
    CMS packages (open source or not) on an apples-to-apples basis, this will be a
    great resource for you. It is down and dirty, but contains a lot of information.

    - CMSWire: http://www.cmswire.com. This newsy CMS site keeps you up-to-date on
    the latest CMS developments and trends in CMS usage across industries. If you
    are dedicated to being on the cutting edge of the CMS world, you might want to
    get an RSS feed to this site.


    # Summary


    We hope this chapter has given you enough insight to make intelligent choices
    regarding a CMS package. As it has shown, there are numerous open source solutions
    that can fill virtually every need, from the very comprehensive, to the very tailored
    and specific. While many times, choosing the right CMS comes down to personal
    preference, you now have at least a starting point from which to form those subjective
    opinions.'
