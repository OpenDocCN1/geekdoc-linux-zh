    # # MySQL with Apache


    By now, you''ve created a security zone or using Apache and basic authentication,
    and for most situations, that might be all you need. You may find, that basic
    authentication with Apache, while simple, is a little limited in the amount of
    control and customization you can incorporate. For such situations, you can actually
    use a combination of Apache basic authentication and the power of relational databases
    via MySQL. For such a purpose, the mod_auth_mysql Apache module exists.


    Like standard Apache basic authentication, mod_auth_mysql can control access per-directory,
    and can be configured inside .htaccess files and a <Directory> section inside
    httpd.conf. Unlike standard Apache basic authentication, all credentials are stored
    in a database, instead of in flat files.


    # # Setting Up the Database


    Installing and configuring mod_auth_mysql involves a few steps, the first of which
    is to create the necessary database structures to hold the user data. Start by
    loading up your MySQL client, and creating the database. For example:


    ```

    CREATE DATABASE apacheauth;

    ```


    Next, create a user that will be used by Apache to access the credentials:


    ```

    GRANT SELECT ON apacheauth.* TO apache@localhost IDENTIFIED BY ''apachepass'';

    ```


    Now that the database user is created, it''s time to add a table to hold the login
    information. For now start with a sample table that just holds the username and
    password:


    ```

    USE apacheauth;

    CREATE TABLE user_info (

    user_name varchar(50) NOT NULL,

    ```'
