  md: "# Chapter 9\n\nlooks better, but keep in mind that the function, method, and\
    \ class names are all treated in a case-insensitive manner. Mandate and ManDate\
    \ will refer to the same entity.\n\nDefined constants with define() or const are\
    \ generally identified by being written in UPPER-CASE. Those created in the global\
    \ scope with define() should be preceded by some distinctive sequence of characters\
    \ to prevent them from colliding with other constants that may be defined elsewhere\
    \ (see the PHP manual for many examples of this practice). This isn't necessary\
    \ for class constants, as their names are already preceded by the name of the\
    \ class (self:: within the class definition).\n\nSince the distinction is already\
    \ built into PHP's syntax, rules for distinguishing variable/property names are\
    \ unnecessary compared with other languages; there is no such distinction between\
    \ classes and functions. You can have a class named foo and a function foo, and\
    \ the only way to tell is that $v = new foo(); uses the class, and $v = foo();\
    \ uses the function.\n\n```\n$v=foo::foo(); // is something else ain wit, something\
    \ that won't even compile; constructors\ncan't be called statically, and static\
    \ functions can't be\n```\n\n\nreturning new objects of class foo. Functions and\
    \ methods can be named with verbs (traversePath(), anneal(), be wonderful()),\
    \ allowing adjectives, adverbs, and occasionally nouns for naming constants (COLOR_GREEN,\
    \ QUICKLY, GOLDEN_RATIO).\n\n# Hacking the Grammar\n\nSome rules about coding\
    \ style can be enforced by forning a violation into a parse error. If you know\
    \ what you are doing, you can edit the z_language_parser.py and z_language_scanner.1\
    \ files\n\nIf, you want to rule out the possibility of using constructs such as\
    \ if(): ... endif; then,\nfrom the lex you can follow the patterns matching endif,\
    \ endswitch, endif, foreach, endde-clare, and endswitch (all of which appear in\
    \ the <ST_SCRIPTING> context); and from the yacc file,\nt corresponding T_END\
    \ token declarations, and the production rules:\n\n```\nunticked_statement:\n\
    T_IF (' expr ') ' ':' ': '; inner_statement_list new_elseif_list new_else_single\n\
    T_ENDIF ':';\n\nwhile_statement:\n  ': '; inner_statement_list T_WHILE ';';\n\n\
    for_statement:\n  ': '; inner_statement_list T_ENFOR ';';\n\nforeach_statement:\n\
    \  ': '; inner_statement_list T_ENFOREACH ''\n```"
