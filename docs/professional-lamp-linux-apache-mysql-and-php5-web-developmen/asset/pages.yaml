  md: "# Code Efficiency\n\nPHP offers provisions for separating the visible properties\
    \ and methods of an object from the properties and methods are implemented by\
    \ the class, by means of the magic __get(), __set(), and __call() methods. Capitalization\
    \ matters for variables and properties, which you might wish to consider the practice\
    \ of naming all your object's properties with lowercase, declaring them private\
    \ or protected, and writing routines to provide access via lowercase title-names:\n\
    \n```\nclass foo {\n    protected $width, $height;\n\n    public function __get($property)\
    \ {\n        switch ($property) {\n            case 'Width':\n               \
    \ return $this->width;\n            case 'Height':\n                return $this->height;\n\
    \            case 'Area':\n                return $this->width*$this->height;\n\
    \        }\n    }\n\n    public function __set($property, $value) {\n        switch\
    \ ($property, $value) {\n            case 'Width':\n                $this->width\
    \ = $value;\n                return;\n        }\n    }\n}\n```\n\nThis also gives\
    \ you finer control over which properties the object's user may alter or view.\
    \ Note, for example, that object->Height can be read from but not assigned to\
    \ — a distinction that would not be possible if you simply made object->height\
    \ public.\n\nIf you make a stylistic distinction between real properties and synthetic\
    \ ones created via __get() and __set(), you should make sure you provide synthetic\
    \ access to the real properties, and preferably disable access to those properties.\
    \ This will allow you to create classes that provide exactly the same interfaces\
    \ regardless of whether each class uses the properties internally or not. A complex\
    \ object, for example, may provide $num->Real, $num->Imag, $num->Arg, and $num->Mag,\
    \ independently of whether it stores the number as a real part or an imaginary\
    \ part and providing the argument magnitude and sign, or versa.\n\nThe __get()\
    \ accessor for a synthetic property may include code that the previous value retrieved\
    \ in a cached property in case it is asked again, with the contents of the cache\
    \ cleared and when the property depends on are altered via __set().\n\nWhen building\
    \ function and method names from several words, use either underscore_separation\
    \ or TitleCase to show where one word leaves and the next begins. Opinion is divided\
    \ over which"
