    # Full-Text Searching


    The owners of the car have been so impressed by your ability to query exactly
    what they need, giving the various listings to help increase the productivity
    of their sales staff—but they still want more. What they''d like now is to search
    through the car inventories by keyword. Their search needs aren''t complex, but
    a like LIKE comparison in a WHERE clause just isn''t going to get the job done.


    What you need happens to be built into MySQL—full-text searching. Full-text search,
    which is enabled by default in MySQL allows you to perform a natural language
    search on any text column you specify. You can''t just go out and start full-text
    searching in your database, though—you have to do some preparation first.


    # Enabling Full-Text Searching


    Enabling full-text searching in MySQL involves creating an index on a column or
    columns for a table. You can do this by one of two ways: when the table is created,
    as part of the CREATE TABLE command, or later in the life of the table.


    # Creating a New Table with Full-Text Enabled


    The first full-text index you''re going to create will be part of a new table.
    To create a full-text index at table-creation time, all you have to do is specify
    a full-text index and the list of indexed columns at the end of the column specifications:


    ```

    CREATE TABLE tableName (column_specs, FULLTEXT (columns_to_index) )

    ```'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Advanced MySQL


    You can specify a single column in the FULLTEXT column list, or multiple columns
    in a comma-delimited list. It''s time to actually create a table with full-text
    searching in the VehicleInventory database:


    ```

    CREATE TABLE testft (testint, testvc varchar(50), testtxt, FULLTEXT

    testvc, testxtt);

    ```


    You''ve created a new table with a full-text index on the testvc and testxt columns.


    # Altering an Existing Table to Support Full-Text Search


    Modifying an existing table to support full-text searching is a little trickier,
    but not by much. To add full-text search capability for an existing table, use
    MySQL''s ALTER TABLE command, like so:


    ```

    ALTER TABLE tableName ADD FULLTEXT (columns)

    ```


    Now add a full-text index to the New_Vehicles table:


    ```

    ALTER TABLE New_Vehicles ADD FULLTEXT (description)

    ```


    Once that''s done, it''s time to pick these indexes to use good.


    # Querying Full-Text Search


    Searching a table in MySQL with full-text indexing enabled is a relatively painless
    process. All you need to do is use the MATCH() function in a WHERE clause, like
    so:


    ```

    SELECT [columns] FROM [table] WHERE MATCH ([indexed_columns]) AGAINST (''keyword'')

    ```


    Inside the parameter list for MATCH, you can specify any number of columns, as
    long as they are part of a full-text index.


    Returning to the vehicle inventory database, it''s time to perform a search on
    the new list of vehicles. To search for the word "options," you can use the following:


    ```

    SELECT vehicle_id, description FROM New_Vehicles WHERE MATCH (description) AGAINST

    (''options'');

    ```


    Which should return the following:


    | vehicle_id | description |

    | --- | --- |

    | 2 | Last of the 2004 stock! Must sell! Loaded, all options! |

    | 3 | Come drive this popular truck! 4WD, extended cab, many options. |


    Another neat trick that full-text searching can do is to order the items by relevance,
    and return the relevance as well. To utilize relevance data, you can use the MATCH()
    ... AGAINST() functions in both the SELECT list and the ORDER BY clause, like
    so:


    87'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Chapter 4


    ```

    SELECT MATCH (description) AGAINST(''options'') AS relevance, description FROM

    New_Vehicles WHERE MATCH (description) AGAINST(''options'') ORDER BY MATCH

    (description) AGAINST(''options'') \G

    ```


    Which returns the following:


    ```

    ************ 1. row ********************nrelevance: 0.383415602808

    description: Last of the 2004 stock! Must sell loaded! All options!

    ************ 2. row ********************nrelevance: 0.383415602808

    description: Come drive this popular truck! 4WD, extended cab, many options.

    ```


    # Limitations


    When using full-text search, there are a few limitations you must keep in mind.
    First, MySQL supports only full-text indexes on MyISAM table (covered in the next
    section). Second, in, if you create a full-text index on more than one column,
    the list of columns you to MATCH () must be the exact list you specified when
    you created the full-text index. Last, MySQL has a default minimum word/length
    of four characters. If you try to match a full-text search against a keyword that
    has three or fewer letters, no results will be returned.


    To change the default full-text word length, make sure the following exists in
    your MySQL configuration file (my.cnf):


    ```

    [mysql]

    ft_min_word_len=3

    ```


    You may use an integer for the minimum length (set to 3 in this example).


    # InnoDB Tables


    One of the advantages to using MySQL is that you''re not limited to a certain
    storage engine for your data. What''s storage engine? MySQL, as a server, provides
    the user with a consistent interface and querying, but is only loosely coupled
    with the engine that actually stores the data on the disk. Different storage engines
    in MySQL providing ways to store and access the data, from the default MyISAM,
    to the speedling of in-memory Heap Tables, and all in others. One of the flexible
    and powerful table types you can use is InnoDB. The InnoDB engine, created by
    Innobase Oy in Helsinki, Finland, provides MySQL with a safe and efficient store
    to process data, and gives MySQL some additional functionality not present with
    MyISAM or most of the other table types.


    # InnoDB Advantages


    Although the default MyISAM table type gives you a mature and speedy way to store
    data structures, it lacks a handful of the features that many developers want—and
    InnoDB can provide. Available by default since MySQL 4.0, InnoDB tables give you
    the ability to use transactions, row-level locking, and best of all, foreign key
    constraints.'
