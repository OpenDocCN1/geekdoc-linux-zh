- img_proc: true
  md: '# Chapter 6


    gone|G


    Another HTTP status code control flag, gone, sends a response of HTTP 410 Gone,
    to inform the client the page no longer extends. When combined, the gone flag
    has precedence over the redirect flag, but not the forbidden flag.


    last|L


    To stop the processing of RewriteRules after a successful match is found, you
    use the last flag. In the previous example dealing with processing article numbers,
    the rule processing would still continue to the second rule (but find no match),
    even if the first rule was a successful match. To stop casing after the first
    rule matched, could simply use the last flag:


    ```

    RewriteEngine On

    # Ensure only numeric values for the page

    RewriteRule ^/([0-9]+)? article.php?page=$1 [L]

    RewriteRule ^/([0-9]+)? article.php?page=1 [L]

    ```


    next|N


    The next flag restarts the processing at the beginning of the rule. When the rules
    are re-processed, the URL is not the original from the client, but the internally
    rewritten URL at the point where the next flag was used. For example:


    ```

    RewriteRule ^/(\d+)? article.php?page=$1

    RewriteRule ^catalog/(\w+)? catalog.php?cat=$1 [N]

    RewriteRule ^catalog/(\w+)/(\w+)? catalog.php?cat=$1&item=$2

    ```


    In this example, if a URL is called that matches the second rule, such as http://localhost/catalog/stuff/,
    rewriting will stop processing at that and automatically restart at the beginning
    of the rule, using the new substituted URL, catalog.php?cat=stuff. The substituted
    URL is then filtered through the whole rule.


    Care should be taken when using the next flag, as infinite loops are possible.


    chain|C


    If you wanted to block a block of rules as a related unit, use the try...catch
    syntax in PHP, you can use the chain flag. When using the chain flag, if a rule
    matches, the processing continues and ignores the chain flag. If a rule does not
    match and a chain flag is present, all of the following rules that are chained
    together will be skipped as a block. For example, the set of rules skips to the
    last rule if one does not match:


    ```

    RewriteRule ^/(\d+)? article.php?page=$1 [C]

    RewriteRule ^catalog/(\w+)? catalog.php?cat=$1 [C]

    RewriteRule ^catalog/(\w+)/(\w+)? catalog.php?cat=$1&item=$2

    ```


    ```

    # Skip to this rule if any of the above don''t match

    RewriteRule ^/[/\d]+ error.php

    ```


