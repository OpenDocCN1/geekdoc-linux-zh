  md: '# Chapter 11


    override(type): Forces the interpretation of the response as if the server sent
    the mime type of the node. This method is not available in IE. This can be useful
    if it is impractical to let the server send a given mime type. This must be called
    prior to send(). It can be used to avoid a Mozilla bug that causes the browser
    to hang when processing a non-XML response.


    send(requestContent): Sends the HTTP request. The parameter requestContent is
    used for requests with a method of post (see the open() method), and represents
    the request body. If the request is asynchronous, this method returns immediately.
    Early versions of Mozilla had difficulty sending a string as content. requestContent
    should be null for a get request. For post requests, it must be a string, or a
    DOM Object. If it is the latter, the object is serialized. The content of this
    parameter is included in the request body and is accessible to the server.


    setRequestHeader(key, value): Assigns the value to the HTTP request header named
    key. This must be called after open() and before calling send().


    The open() method handles the functionality of the interface. The open() method
    sets various parameters of the request, such as the HTTP request method (get or
    post) and the request URL. The URI will typically be the relative location of
    the script on the server. You may use a fully qualified URI if you would like,
    but due to security concerns, the domain of the URI must match that of the page
    containing the JavaScript script. The implication of this is if you would like
    to fetch data from third-party sources located on other domains (such as, for
    instance, weather data), you must proxy requests through a server-side script
    residing on your server.


    The optional async parameter of the open() method determines the behavior of the
    send() method. If set to true (or to the left), the send() method will issue the
    HTTP request and immediately return. This means that lines of your JavaScript
    code following the call to send() will execute regardless of the issued request.
    Instead, response handling is triggered by triggering of an event handler. This
    is a feature in AJAX, and it allows you to develop applications that behave like
    desktop applications. The specifics of this handling are set via properties of
    the interface.


    +   readyState: The function called when the ReadyState event is fired (that is,
    when the readyState changes). The value of this property should be a JavaScript
    function. Make sure not to reference the function with properties, or the function
    will be called the value of this property will end up returning the value of your
    function rather than the itself.


    +   readyState: Read-only. This is an integer representing the current state of
    the request. Possible values range from 0 to 4 and indicate increasing progress.
    A value of 4 indicates that the request has been completed and the response is
    fully processed. Headers and status are available with the readyState of at least
    2.


    +   responseText: Read-only. This is the response body as text. It is non-null
    with a successful request starting with a readyState of 3. The responseText is
    fully populated at a readyState of 4.


    +   responseXML: Read-only. This is the response body parsed as text/xml content
    and packaged as a DOM Object. It is non-null with a successful request at a readyState
    of 4.


    +   status: Read-only. This is the HTTP response status code. 200 indicates a
    successful response. For other possible status codes, including numerous error
    codes, see section 6.1.1 of the HTTP/1.1 RFC (http://www.rfc-editor.org/rfc/rfc2616.txt).


    278'
