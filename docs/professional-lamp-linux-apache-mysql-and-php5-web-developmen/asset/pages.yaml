  md: '# Apache Tricks


    To enable compression globally in Apache, add the following to your httpd.conf:


    ```

    AddOutputByType DEFLATE text/*

    AddOutputByType DEFLATE application/ms*

    AddOutputByType DEFLATE application/vnd*

    AddOutputByType DEFLATE application/postscript

    ```


    Then all you need to restart Apache, and you''ll have compression up and running.


    What exactly do all those configuration directives mean? It''s pretty straightforward
    — in Apache 2.x, the AddOutputByType directive does exactly what it looks like:
    it tells Apache to pass the output through a filter, *mod_deflate*, before it
    reaches the end-user''s browser. The example code above to use the DEFLATE filter,
    mod_deflate, any Microsoft documents such as Word or Excel files (application/ms*
    and application/vnd*), and any postscript files such as Adobe Illustrator or EPS
    drawings (application/postscript). Any document type can be added to mod_deflate''s
    filtering list by simply using a combination of the MIME type and wildcards, similar
    to the example.


    If you want to compress only plain text and HTML files, use the following:


    ```

    AddOutputByType DEFLATE text/plain

    AddOutputByType DEFLATE text/html

    ```


    What if you want to compress everything that Apache served? Using another directive,
    SetOutputFilter, you can tell Apache to send every file through mod_deflate:


    ```

    SetOutputFilter DEFLATE

    ```


    However, in server setups, this is not a very good idea. There are in some files
    that do not benefit from compression, and some that become corrupted for the end-user
    when compressed. In some situations, there is no need to compress image formats,
    the most commonly used web formats have some built-in compression. Additionally,
    PDFs are also compressed, and should absolutely never be filtered by mod_deflate,
    as they will become unreadable in Acrobat Reader.


    It should be noted that versions of Netscape Navigator 4.x cannot reliably compress
    any file type other than text/html, and specific versions of Netscape Navigator
    4.x cannot compress any files.


    In order to tweak the compression of your chosen file types, mod_deflate provides
    the configuration directives in the following sections.


    # DeflateCompressionLevel


    DeflateCompressionLevel sets the level of compression to shrink the files, a range
    from 1 to 9. A compression level of 1 yields the fastest compression, with the
    least amount of compression (larger files), and a compression level of 9 uses
    the slowest compression, but the resulting file sizes are much smaller. When deciding
    which level to use, you must determine which is more important for you — saving
    processor cycles or saving download time. The default compression level of 6 is
    usually a good compromise between the two.'
