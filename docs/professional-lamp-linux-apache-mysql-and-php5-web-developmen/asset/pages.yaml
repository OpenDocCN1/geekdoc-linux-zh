  md: "# Chapter 2\n\nIn PHP5, an interface is defined using the interface keyword,\
    \ and implemented using the implements keyword, like the following:\n\n```\ninterface\
    \ TwoDimensionalOperations{\n    public function calculateArea();\n}\n\nclass\
    \ Circle implements TwoDimensionalOperations{\n    public function calculateArea();\n\
    \    // Implementation of calculateArea, specific to this Circle class\n}\n```\n\
    \nBy creating the interface TwoDimensionalOperations, you can then create classes\
    \ for different shapes — Circle, Square, Triangle, Pentagon, etc.—all implementing\
    \ the interface. This way, you can be assured that by implementing TwoDimensionalOperations,\
    \ all of your classes will have a calculateArea method.\n\nWhen using interfaces,\
    \ it is important to keep a count of things in mind. First, if a class implements\
    \ an interface but does not define the methods from that interface, a fatal error\
    \ will occur. Second, all methods defined in an interface must have public visibility.\n\
    \nWith PHP5, a class can extend a base class and implement an interface at the\
    \ same time:\n\n```\nclass Circle extends Shape implements TwoDimensionalOperations{\n\
    \    // Circle implementation\n}\n```\n\nIn another neat trick, an interface can\
    \ use the extends keyword to inherit from other interfaces:\n\n```\ninterface\
    \ GeometricOperations{\n    public function getOrigin();\n}\n\ninterface TwoDimensionalOperations\
    \ extends GeometricOperations{\n    public function calculateArea();\n}\n\nclass\
    \ Circle extends Shape implements TwoDimensionalOperations{\n    // Implement\
    \ the required methods\n    public function getOrigin(){\n        // Circle->getOrigin()\
    \ implementation\n    }\n    public function calculateArea()\n}\n```"
