  md: '# More Obscure PHP


    One of the most prominent features of PHP is its vast collection of built-in-functions,
    even before you start adding optional extensions. This is arguably a failing because
    it makes the job of deciding which function to use in a given situation that is
    much more difficult. Many of the functions are similar in behavior that it''s
    sometimes hard to see why they exist as distinct functions. split() or preg_split()?
    str_replace() or strtr()? ksort(), as(), rsort(), nsort(), usort() or usort()?
    strtotime() or date()? This book doesn''t go into the lock of conventions regarding
    the naming of functions or the order of arguments, the way in which several functions
    are merely aliases of ones


    One cause of PHP''s overlapping set of functions is its early existence as a memory
    wrapper over Perl''s and C''s own libraries. Users familiar with those languages''
    function libraries would find PHP''s equivalents having the same names with the
    same calling conventions, overlaid with PHP''s memory management and type handling.
    Extensions exacerbated this—with different DBMSs exposing different APIs, PHP
    introduced distinct sets of functions for each DBMS it supported. When two extensions
    boosted for two similar things, PHP provided both.


    As PHP became more expansively on a wider variety of platforms and built into
    a variety of environments, platform-independent implementations of functions began
    to be introduced. The existence of rand()which uses pseudorandom number generator
    was supplied by the C compiler PHP was built on) and mt_rand() (which has identical
    behavior across all platforms). At the same time, PHP developers have been committed
    to back-compatibility, even as new mechanisms were introduced, they do their best
    to retain the old ones in case there are relying upon


