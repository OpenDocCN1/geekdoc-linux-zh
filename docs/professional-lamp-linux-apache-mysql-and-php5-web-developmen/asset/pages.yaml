    So what are the advantages to this method? Compatibility, for starters. Using
    some form-based authentication with PHP works in nearly any situation, regardless
    if safe_mode is enabled, or Apache is using .htaccess authentication of yours.
    The only real downside to a solution like this is that you must code your own
    form, and how you want it, instead of relying on the browser/OS to do that for
    you.


    # Other Access Restrictions


    In addition to restricting by username and password, you can also use PHP to check
    other parameters. By referencing the server variable $_SERVER[''REMOTE_ADDR''],
    you can make sure that only certain ranges of IPs are allowed to view a resource,
    or conversely. For example, if you are creating a website for a corporate intranet,
    you can restrict access to internal IPs (assuming your network uses them). For
    example, you could decide that only members of the 10.0.1.x network can view a
    special area of your website. Another example would be BBS sites or forums. Often
    times they need to ban a specific user by IP if the person is spamming the boards,
    for example.


    Another server variable worth checking is $_SERVER[''HTTP_REFERER''] . This variable
    holds the name of the previous page viewed, and can help you eliminate a certain
    class of web attacks. Suppose you create a form that saves data to a database,
    emails people, or anything that relies on valid input. You might have even given
    great lengths to perform client-side input validation, and specified maximum lengths
    on your forms. Unfortunately, you might expect input from a web form to be easily
    copied using an external form. Any attacker can easily copy your form''s HTML
    markup, and then modify it to suit their needs — whether it be for information-gathering,
    cross-site scripting, SQL injection, or anything really.


    All they need to do is make a copy of the form that can submit data to your site,
    host it on their own machine, have post your form, using an absolute URL as the
    method. This kind of attack can be especially harmful when hidden form variables
    are used, and when register_globals is enabled in php.ini.


    By checking the HTTP_REFERER value, you can eliminate many of spoofed form attacks,
    as long as you ensure the input is coming from a page on your website.


    To see an example of HTTP_REFERER checking and REMOTE_ADDR verification in action,
    you could take a look at the following code:


    ```

    <?php


    // Check the referer

    if (!preg_match(''/http:\//(localhost)/'', $_SERVER[''HTTP_REFERER'']))

    |

    ```'
