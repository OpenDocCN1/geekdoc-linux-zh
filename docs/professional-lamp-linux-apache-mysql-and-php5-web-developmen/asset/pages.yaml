  md: '# WordPress


    WordPress is a great "out of the box" blogging package that provides excellent
    customizability and functionality. It is available at http://www.wordpress.org
    and the current version at time of this writing is 1.5.11.


    # Installation Notes


    Installation of this package is incredibly easy and quick to do. Prior to installation,
    make sure you are running PHP 4.1+ and MySQL 3.23.2+ and that you have created
    your database and username/password. The rest of the documentation you would need
    is conveniently located for you on the http://www.wordpress.org site.


    # General Overview of Features


    WordPress offers numerous functions and areas of customization for your blog,
    including:


    +   - **User registration system:** Allows you to authorize other users to post,
    edit, and delete blogs in your site, with 10 levels of varying user access. You
    can also require an "approval" process before drafts are published.

    - **Static content:** Allows you to add static pages to your site, and manage
    them through the WordPress interface.

    - **Adding links or blogrolls:** You can manage and organize external links through
    the WordPress interface.

    - **Themes:** There are currently 35 themes built-in to the default installation
    and 150 additional themes available for you download to easily customize the look
    and feel of your blog.

    - **Comment system:** Allows you to accept, review, and modify comments posted
    by users and contains a spam block to prevent spam from popping up. Visitors can
    also make comments about your blog on their own sites through Trackback and Pingback.

    - **Hidden posts:** Allow you to protect certain posts that are viewable only
    by you, or by the who created them.

    - **Importing data:** Allows you to import data from other popular blog packages
    including MoveableType, Blogger, and numerous others.

    - **RSS feed:** Allows you to syndicate your blog.

    - **Post-by-email:** Allows you to submit blog posts through the email system.


    There are other nice features with this blogging package as full standards compliance,
    ease in upgrading, and the use of the Texturine to beautify your text from plain
    ASCII.


    # Summing It Up


    You will find once you delve into the WordPress package that it is well documented,
    easy to install, easy to configure and customize, and very functional. It also
    has an excellent support and development community in case you have any questions
    or problems. If you are simply looking to create a blog on your site, WordPress
    is hard to beat.'
  merge: -1
