    next:


    ```

    //loop through all of the images

    for($i=0; $i<count($images);$i++) {


    // create a bitmap from an image

    $bitmap = new SWBitmap(fopen($images[$i], "rb*"));


    // create a shape to hold the image

    $shape = new SWFhape();

