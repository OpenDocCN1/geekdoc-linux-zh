  md: '# Chapter 13


    +   - Multimedia capabilities: Other file types can be uploaded by the user, including
    images, sound files, mathematical formulas, and charts.


    +   - Multilingual support: Currently, there is support for numerous languages,
    as well as the ability to link between articles in different languages.


    For a complete list of all the features and functions available in this package,
    visit the MediaWiki Feature List at http://meta.wikidata.org/wiki/MediaWiki_feature_list.


    # Summing it Up


    One only needs to visit Wikipedia (http://www.wikipedia.org) to fully grasp all
    that can be done with MediaWiki. It is highly functional, customizable, and one
    of the most robust wiki software packages available.


    # DocWiki


    Another package is DocWiki, which is available at http://www.splitbrain.org/go/dokuwiki.
    What makes this different than other wikis is its use of flat files which releases
    the user from database dependency.


    # Installation Notes


    DocWiki is another open source package that offers "out of the box" — simply unzip
    and change permissions to it. The only thing you need to do is create an empty
    log file for the installation instructions found at http://wiki.splitbrain.org/wiki%3AInstall.


    # General Overview of Features


    This wiki offers many features including:


    +   - Section editing: Allows users to work on only one portion of a page.


    +   - Version comparison: Provides highlighted differences between two versions
    of the documents.


    +   - User access control: Allows admins to assign permissions to users.


    +   - Image uploads: Allows users to include images with the wiki documentation.


    +   - Multilingual support: Provides support for different languages.


    +   - Checking in/out: Prevents edit conflicts


    # Summing It Up


    The only thing lacking in this wiki is the database-related functions such as
    page tracking and referring statistics. It also doesn''t offer a backup utility
    or allow for user comments on contributions as some as other wiki packages do.
    Otherwise, this is a simple and solid wiki package that is an excellent choice,
    especially if you don''t have access to a database.'
