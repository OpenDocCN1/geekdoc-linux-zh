  md: "```\n<?php\nclass Circle\n{\n    public function __get($p)\n    {\n       \
    \ return $this->$p;\n    }\n\n    public function __set($p, $v)\n    {\n     \
    \   $this->$p = $v;\n    }\n}\n\n$c = new Circle();\n$c->nonexistent = 5;\necho\
    \ \"The value of our nonexistent property: \" . $c->nonexistent;\n?>\n```\n\n\
    When you execute the preceding code, PHP recognizes immediately that no property\
    \ named \"nonexistent\" exists in the class. Since the property does not exist,\
    \ the `__set()` method is called, which then assigns the value to the newly-created\
    \ property of the class, allowing you to see the following:\n\nThe value of our\
    \ nonexistent property: 5\n\nIn this example, you created the magic methods `__get`\
    \ and `__set` to handle any undefined properties, and proceeded to use an undefined\
    \ property `nonexistent`.\n\n# sleep\n\nWhen you use PHP classes to store data\
    \ that must persist across long or periods of time, you can store the object using\
    \ your favorite method of persistence (file, database, session variables, or cookies),\
    \ but the objects must first be prepared.\n\nWhen you're reading data to be stored,\
    \ use the `serialize()` function. The `serialize()` function takes any complex\
    \ data structure and converts it into a string that can be stored using your method\
    \ of choice. Conversely, to retrieve your persisted data, use the `unserialize()`\
    \ function. The `unserialize()` function takes your serialized string and converts\
    \ it back to whatever complex structure it was.\n\nTo develop more flexibility\
    \ when dealing with the serialization of the objects, the `__sleep` and `__wakeup`\
    \ magic methods are provided.\n\nThe `__sleep` magic method, if defined in the\
    \ class, is automatically called immediately before the object is serialized.\
    \ This method is extremely useful for closing database connections and cleaning\
    \ up object resources.\n\nThe `__sleep` method can also return an array containing\
    \ the names or object values to be serialized, which is useful when dealing with\
    \ large objects. Only the necessary data will be serialized while other data can\
    \ be ignored."
