  md: '# Apache Tricks


    When users access your WebDAV folder, you''re going to authenticate against a
    database or htpasswd file, to prevent anonymous users all over the Internet from
    filling up your hard drive. First, create a htpasswd file to store the passwords
    of valid users, and initialize it with the user account for testdav.


    ```

    mkdir -p /davauth

    /path/to/htpasswd -c /davauth/htpasswd testdav

    ```


    When prompted for a password, enter a password of your choosing. Next, create
    a .htaccess file in the /www/ssl folder to enforce basic authentication. The .htaccess
    file should contain the following:


    ```

    AuthName "DAV Test"

    AuthType Basic

    AuthUserFile "/davauth/htpasswd"

    require valid-user

    ```


    Finally, create a Directory in your httpd.conf to enable WebDAV and basic authentication
    in the given directory:


    ```

    <Directory /www/ssl/dav/>

    AllowOverride AuthConfig

    Dav On

    </Directory>

    ```


    Then you restart Apache, and WebDAV will be enabled for the /dav/ folder of your
    HTTPS site, accessible at something like https://www.example.com/dav. You can
    try to load this URL in your browser, but it will behave differently than a standard
    non-DAV directory. To use the capabilities of your WebDAV URL, you''ll need to
    use software that is WebDAV-enabled.


    Editors such as jEdit, NuSphere''s PHPED, and Macromedia Dreamweaver, among others,
    all support WebDAV at some level. If you don''t have any of these at your disposal,
    have fear—most modern operating systems actually support the mounting of WebDAV
    shares natively in their file explorer/browser utilities.


    To access your WebDAV share using your operating system''s file browser, follow
    the instructions in whichever of the sections pertains your OS.


