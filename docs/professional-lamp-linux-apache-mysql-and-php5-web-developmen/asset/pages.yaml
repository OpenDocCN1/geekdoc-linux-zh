    # Using a 404 Handler as a Trampoline


    This method is for archiving pages that will no longer be changing, as old news
    articles. If they could be stored and regenerated as static pages, then PHP would
    never be needed with their regeneration. Even better would be if they were generated
    (once) if needed.


    The method works as follows. Suppose a user requests an old article that has not
    already been saved as a static page. Apache fails to find it, and as a result
    sets putting together a 404 Not Found response. You have configured a custom 404
    handler (using the ErrorDocument directive) that calls a PHP script. This PHP
    script outputs the contents of `$_SERVER[''REQUEST_URI'']` to determine which
    article is requested. Assuming the request is for a genuine article, it generates
    the page (or saves it in location it should have been originally). This may be
    carved out for different types of request in sequence. It finishes up (if all
    fails) by sending a 404 Not Found response and including whatever page content
    is appropriate in that situation.


    Any subsequent request for the same article will see Apache locating the right
    static page at the right place.


    Obviously, you can clear these pages at any point (when the look of the site,
    for example, or moving hosts, or simply freeing disk space). They will be regenerated.


    This method may be more elaborate with Apache''s mod_rewrite and mod_alias modules
    to decouple the site''s document tree from the server''s filesystem. If so, your
    script would save the static page in whichever location indicated by mod_rewrite
    after it has transformed the URL.


