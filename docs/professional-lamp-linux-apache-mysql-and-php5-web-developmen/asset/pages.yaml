    while the machine doesn''t care about notices of formatting.


    If you want to use tabs for indentation, the rule of thumb is that they should
    only be used for indenting, and spaces should be used for any additional alignment.
    In the previous example, the extra use tabs to align the second and third lines
    of the test with the first line—which worked with four-space tags—have caused
    them to be pushed too far to the right when they become-eight tags. Instead of
    a tab, four spaces should have been used, after the tabs, to match the characters
    "if".


    Generally, the only tabs in source code should be at the start of lines; they
    shouldn''t follow any other characters. The two exceptions to this would be if
    a literal tab character really required, or if you were using "Compressed Allman
    style", in which case, a single tab would be used to separate a { from the following
    statement.


    You may have noticed that all the styles described—awaside—have the closing braces
    on lines by themselves. This effect has on code listings to introduce a visible
    gap between the end of the statement block and the following code, analogous in
    some ways to paragraph breaks in English text. You could take the position, that
    K&R or compressed Allman is "better" than Allman, in that it doesn''t separate
    the statement block from the construct {for, if, switch, and so on} that introduces
    it. According to Raymond, the principal claim in defense of K&R is that it is
    more economical with space, allowing more code to fit on the screen at once. Obviously,
    though, compressed Allman shares virtues while still matching braces to be aligned.


    # Reducing Nesting Levels


    If the nested braces get too large, it can become confusing identifying which
    opening brace a given closing brace is paired with. Most IDEs and some of the
    better-language-sensitive text editors are able to find pairings without being
    confused by braces appearing in strings or literals, but it is still so ugly that
    you''ll want to see by eyeball (as example, when you''re typing one or the other).
    When reading code you''ll see closing braces by tiny comments like "/* end for
    */", "/* if {$i}=*/" in an attempt to assist. However, some use of break and continue
    statements can help reduce the depth of nesting. By doing so, not only do you
    reduce the tendency of code to wander off to the right of the page, but you also
    reduce the number and size of parenthesized blocks, thus the number of parentheses
    and draw-each pair closer together for quicker recognition.


