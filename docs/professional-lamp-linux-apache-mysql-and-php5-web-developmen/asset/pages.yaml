  md: '# Summary


    As you see, PHP5 brings to the table a much-improved object model to use in your
    projects. Whether you decide to stick with procedural programming, dabbling seldom
    with OOP, head down the full-on OOP route, or find a path somewhere in between,
    hopefully with some of the things you''ve seen in this chapter, you can go on
    and start to build your own systems using PHP5''s new OOP.


    From here, you''re going to move away from OOP, and into some of the darker corners
    of the PHP language. You probably already know how powerful arrays are in PHP,
    but you may not know just how many functions PHP has to let you harness that power.
    Once you have that down, we''ll introduce you to the concept of streams, which
    will let you work with both network resources and local files using a common set
    of functions.'
