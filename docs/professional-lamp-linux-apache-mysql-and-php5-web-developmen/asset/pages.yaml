  md: '# Chapter 4


    Outer joins and inner joins do not, however, have to leave apart from one another.
    Both can be combined in a single query, to yield powerful multi-table joins that
    are lenient on requiring all data to match for all rows. To pull a list of new
    vehicles'' colors, makes, models, and years that do not have models specified,
    performing a query similar to:


    ```

    SELECT ma.make_name, mo.model_name, n.color, n.modelyear FROM New_Vehicles LEFT
    OUTER JOIN models USING (model_id) LEFT OUTER JOIN makes USING (make_id);

    ```


    Running against this vehicle inventory database returns:


    | make_name | model_name | color | modelyear |

    |---|---|---|---||

    | Ford | Explorer | Dark Blue | 2005 |

    | NULL | NULL | Graphite Pearl | 2004 |

    | Toyota | Tacoma | Radiant Red | 2005 |

    | Chevrolet | Corvette | Daytona Sunset Orange Metallic | 2005 |

    | Ford | Explorer | Dark Blue | 2005 |


    Note that in this query, the order in which the tables are joined is important.
    The resulting table from the first is joined as an internal table when joined
    against the third table.


    # Unions


    Up until now, the queries you''ve been performing on the vehicle inventory database
    have been returning records for only one type of vehicle, either new or used.
    If you wanted to get a list of all vehicles in the database, regardless of previous
    ownership status? Initially, you might think it''s as easy as adding both to the
    query, but that would result in a cross join—not exactly what you''re looking.
    For this, you''ll need to use unions.


    Unions in MySQL are a way to return multiple tables as a single record, without
    combining them. Unions are like concatenation in PHP—they simply add the additional
    rows to the tail end of the first table. A generalization of unions in MySQL looks
    like this:


    ```

    SELECT [column_names] FROM [table1] UNION SELECT [column_names] FROM [table2]

    ```


    Simply put, unions are performed by gluing two SELECT statements together with
    UNION. In the code abstraction, parentheses were placed around each of the SELECT
    statements. While not required, it''s a good idea to help visually differentiate
    the two queries.


    Assume you want to return a list of all vehicles in the vehicle inventory, regardless
    whether they are new or used. Use a query similar to the following:


    ```

    (SELECT color, modelyear, model_id FROM New_Vehicles) UNION (SELECT modelyear,
    model_id FROM Used_Vehicles);

    ```


    If you run this query in MySQL, you will see the following:'
