    # Converting Back to MyISAM from InnoDB


    You''ve given InnoDB tables and foreign keys a whirl, you''ve decided that you''d
    rather have full-text searching instead. Changing back to MyISAM is a relatively
    painless process. Usually it involve only two steps: removing any InnoDB-specific
    features, such as foreign keys, and changing the storage engine back to MyISAM
    with ALTER TABLE. To convert the New Vehicles back to MyISAM, do the following:


    ```

    ALTER TABLE New_Vehicles DROP FOREIGN key refmd1;

    ALTER TABLE New_Vehicles ENGINE=MyISAM;

    ```


    At this point, the New_Vehicles table is back to using the MyISAM storage engine
    and you once again have the ability to add and use full-text indexing on that
    table.


    # Controlling Access


    One of the most important jobs you''ll have is a MySQL database administrator
    controlling who can access the system and what resources they can access. In most
    situations, you''ll only need a handful of user accounts for each database, and
    those that you need to create should only be given the minimal access required
    to perform their task. Luckily, MySQL provides you with a handful of ways to control
    who has access to your systems and to what resources exactly.


    # User Administration


    In order to control the user accounts in your database, MySQL provides a couple
    of ways to maintain user accounts. Whether it''s an account for a co-developer,
    a tech-savvy client, or a web-based end to the system, each user needs to have
    access specifically granted for the resources they require.


