- img_proc: true
  md: '# Retrieving Configuration Settings


    There might be times when a simple version check isn''t enough information, and
    you require a little more information about the way PHP is configured, but you
    don''t have access to php.ini directly. To look up runtime configuration settings,
    you have three choices: ini_get(), get_cfg_var(), and ini_all().


    The first option, ini_get(), checks a string against the current runtime configuration.
    If a setting matches, it returns the value of that setting; if no match is found,
    an empty string is returned:


    ```

    <php

    echo Error reporting: " . . ini_get(''error_reporting'') . "\n";

    Register globals: " . . ini_get(''register_globals'') . "\n";

    Nonexistent setting: " . . ini_get(''nonexistent'') . "\n";

    ?>

    ```


    Running this will produce output similar to the following:


    ```

    Error reporting: 2047

    Register globals:

    Nonexistent setting:

    ```


    Note that the value of error reporting is actually the numerical equivalent to
    the E_ALL constant in case. But it''s the value for register_globals? When ini_get()
    returns what php.ini considers Boolean (or 0 or 1, yes), it automatically converts
    them. Any value of "off" or "no" automatically converts to "0"; any value of "yes"
    or "on" automatically converts to "1".


    The second option for retrieving configuration settings, get_cfg_var(), behaves
    identically to ini_get(), except that it pulls its values directly from php.ini
    and not the current runtime environment. Unless you changed a variable in your
    code (or later), the value is returned normally by what is returned by ini_get().
    For example, the following code:


    ```

    <php

    echo Error reporting: " . . get_cfg_var(''error_reporting'') . "\n";

    Register globals: " . . get_cfg_var(''register_globals'') . "\n";

    Nonexistent setting: " . . get_cfg_var(''nonexistent'') . "\n";

    ?>

    ```


    Unless a setting was changed in the active script, this code would produce identical
    output to the following:


    ```

    <php

    echo Error reporting: " . . ini_get(''error_reporting'') . "\n";

    Register globals: " . . ini_get(''register_globals'') . "\n";

    Nonexistent setting: " . . ini_get(''nonexistent'') . "\n";

    ?>

    ```'
  merge: -1
