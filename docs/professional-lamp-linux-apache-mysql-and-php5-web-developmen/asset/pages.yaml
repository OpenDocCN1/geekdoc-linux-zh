  md: "# Chapter 3\n\n```\n$shell_script = file('foo.sh');\n$tidied_script = array_map(array($Parser,\
    \ 'strip_comments'), $shell_script);\n```\n\nWithin classes and objects, the magic\
    \ self and $this work within callbacks, and will work just as you would expect\
