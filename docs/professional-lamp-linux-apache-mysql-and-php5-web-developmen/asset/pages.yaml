    # # Code Efficiency


    The faster you can serve pages, the busier your site can be without users experiencing
    delays. This chapter covers methods for improving the performance of your sites,
    and also for identifying which methods are likely to be most effective.


    > “Pages in less time” is the rationale, but just as there are enthusiasts who
    spend every free moment elbow-deep in their car’s innards to shave another tenth
    of a second off the quarter mile, there are site developers who want to shave
    another millisecond displaying the login page. You can take things too far!


    You don''t want to waste your time on improvements that no one will notice, so
    the first section of this chapter will present a couple of cameos that illustrate
    just how little difference large improvements can make, how much difference small
    improvements can make, and how valuable it is to understand your system before
    messing with it.


    Your program runs on PHP, which runs on your web server and communicates with
    your DBMS, which both run on your operating system, which runs on the physical
    hardware. Subsequent sections look at all of these for opportunities for improvement
    and techniques for deciding what needs improving.


    Finally, there will be a few miscellaneous coding tweaks that might shave a millisecond
    off the login page, which are presented here if you know and use them from the
    beginning, you won''t later be tempted to spend time better elsewhere going back
    and introducing them to existing code.


    # # Why Bother?


    The first question to ask yourself is “Do I need to do anything?” If you haven''t
    started coding yet then the answer is obviously “Yes” — take the time to plan
    what your program is supposed to do, and try to develop a feel for where its performance
    might drag. But if you have a site that''s up and'
  merge: -1
