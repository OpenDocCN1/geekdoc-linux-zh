  md: "# Chapter 2\n\nOnce you get the problems caused by poor object-oriented design,\
    \ you will find that creating a system using a custom set of PHP objects, or a\
    \ full-blown API, can yield benefits that most every developer will appreciate.\
    \ With that, you can now begin to take a look at how PHP5 implements object-oriented\
    \ programming.\n\n# Basic Class Definitions\n\nThe basic unit of object-oriented\
    \ PHP is the class. Simply put, a class is a way to encapsulate related functionality\
    \ and data in one entity. This encapsulation can be used to hide internal operations\
    \ from external code, which simplifies the external interaction with the data.\
    \ A class is a formal description of a grouping of code, a programmatic recipe\
    \ if you will. Like a recipe—you don't eat the actual recipe, do you? To use classes,\
    \ you can actually create an instance of the class, called an object—similar to\
    \ using the recipe to prepare a dish. Classes define the properties and actions\
    \ of a group of code, and objects are individual instances of that of commands.\n\
    \nAn easy way to understand classes is to relate them to real class objects. Many\
    \ times, classes would represent these real-world objects. You might have a class\
    \ named Car that has a property occupants, which might keep track of the people\
    \ in the car. It might even contain method called brake(), which would perform\
    \ its similarly-named task. Like many real world items, classes have a combination\
    \ of attributes that describe the individual object, called properties in OOP,\
    \ and a set of actions that they can perform, which are called methods in the\
    \ object-oriented world.\n\n# Defining the Class\n\nDefining a class in PHP5 is\
    \ a relatively straightforward process—very similar to defining a function, albeit\
    \ with a different keyword:\n\n```\nclass Circle\n{\n    // Class code goes here\n\
    }\n```\n\nThis code defines a simple class by using the class keyword, followed\
    \ by the name of the class, and a set of curly braces.\n\nIn standard PHP5 classes,\
    \ there are two main parts to a class definition—properties and methods. Properties\
    \ represent the data held in the object, while the methods perform actions with\
    \ that data.\n\n# Properties\n\nWhen creating your classes in PHP5, properties\
    \ are where you will store the various bits of data the object will represent.\n\
    \nTo define a property in PHP5 is as simple as the following:\n\n```\nvisibility\
    \ $property_name;\n```\n\nIn this definition, visibility represents the visibility\
    \ of the property, which is one of three values: public, private, or protected.\
    \ The meaning of these three keywords is discussed later in this chapter."
  merge: -1
