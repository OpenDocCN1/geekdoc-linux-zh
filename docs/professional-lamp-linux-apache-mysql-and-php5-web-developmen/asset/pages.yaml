    of a button include:


    +   - Comments: Allows users to comment on images, articles, and other content
    throughout the site.

    - Image Gallery: Allows users to rank, view, and upload images.

    - Newsreader: RSS feed for news.

    - Polls: Manages online polls.

    - Quizzes: Allows users to take a quiz and be graded.

    - Featured Links: Manages links that open within your Tiki site; keeps track of
