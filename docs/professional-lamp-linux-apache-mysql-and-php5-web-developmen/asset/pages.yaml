  md: '# Chapter 9


    StartServers and MinSpareServers: StartServers specifies the number of httpd instances
    that are initialized when you start Apache. A good number for this is the number
    of concurrent requests your site is typically handling. MinSpareServers would
    be this number plus a few more. Because there is work involved in starting up
    a fresh instance, don''t want the server to be doing so when it''s already running
    handling requests, so it pays to keep some slack handy.


    When a request comes in a web page, it is frequently followed by additional requests
    from the same client for ancillary requests (stylesheets, images, and others),
    and probably for additional pages. It makes sense for the connection to avoid
    waste of opening and closing a connection only to immediately open a new one to
    the same client a few milliseconds later, and then have an instance ready to accept
    the request (which more often than not will be the very instance that handled
    the previous connection and is now). The modern HTTP/1.1 standard provides this—known
    as "Keep-Alive," and modern versions of Apache respect it by default (as ever)
    to settings in Apache''s configuration files.


    +   - KeepAlive: This is On by default, and you generally wouldn''t have to turn
    it off.\ KeepRequests: Once a connection is established between the client and
    the server, the httpd instance that is handling will decide to keep it for client
    at most some requests. This can be fairly high—100. There aren''t many page requests
    that are followed by ancillary requests, and it can happen that from the first
    page they load a user, may quickly open half a dozen pages. Setting this option
    won''t cause too much trouble since the client typically closes its connection
    from its; in cases where it doesn''t, the following directive comes into force.


    +   - KeepTimeout: If there be no requests on the current connection from the
    client for these few seconds, the server assumes the client has gone away without
    reason without closing the connection. The higher the bandwidth between your site
    and the client, the lower this figure can be. Bandwidth is a bottleneck for dialup
    reduces the rate at which requests can be made, so there may be 3-45 seconds between
    successive requests. A lower bound would be something like 10-15 seconds.


    For the purposes of logging, Apache can use DNS to look up the hostname for the
    IP request originates from. It makes it easier to read the logs by eye, but that''s
    about it. Meanwhile, the request is waiting for a response from the DNS server,
    unable to continue until it has received a response. You''d be better off just
    storing the IP itself in the log, leaving the lookups to Apache''s logging at
    a time when you can care.


    +   - HostnameLookup: This sets whether to use domain names (On) or IP addresses
    (Off) in server logs.


    Related to this is using from.example or deny.example.com in your .htaccess file
    means that a reverse DNS has to be carried out to find what domain the originating
    IP belongs to (and then a forward DNS lookup to check that the IP is really part
    of the domain (claimed). Here, too, therefore, allowing or denying specific ranges
    of IP addresses rather than domain names is more effective. However, remember
    that half the part of DNS is that specific domain names aren''t permanently tied
    to IP addresses, and that the name can be shifted to a different host and a different
    IP address.


