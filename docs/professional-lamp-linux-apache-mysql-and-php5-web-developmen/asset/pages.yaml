    would be in some other way, (for one thing) this mechanism would fail for read-only
    streams, but such an issue can be dealt with by writing a new stream and registering
    it under a protocol name of ours. The second fopen() call would use this protocol
    and whatever happens from there is a problem for the new class.


    After the two streams are connected to see that they''re actually open. An error
    is triggered and FALSE returned if it failed.


    The last thing the stream does before returning true is to write to the open log
    saying that the stream was opened, by whom, and when.


    The bulk of this class merely passes the file operations directly on the stream
    it is keeping stream_read() and stream_write() have the added task of counting
    bytes by pass back and forth, and rename() makes a note about the new name of
    the file (which, if it is opened as a log stream, will have its log file.


