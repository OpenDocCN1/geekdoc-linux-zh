  md: '# Content Management Systems


    # All-Inclusive Web CMSs


    Like fancy tropical resorts that wrap your vacation all into one nice neat package,
    comprehensive Web CMS can do as little or as much as you like. The following sections
    introduce you to some of the more popular packages available, although a myriad
    of can be found on websites such as http://www.sourceforge.org. This text does
    not go into detail about installation on packages, as you''ve probably had some
    experience in this department in the past. However, if there are any special considerations
    regarding installation, they will be duly noted. As you need to have all aspects
    of the LAMP system working properly before installing these packages.


    Most all-inclusive Web CMSs have common functionality as changing user permissions,
    modifying layout, changing server settings, and so on. One thing that should be
    mentioned is that there is a lack of transactional CMS features (shopping carts
    for e-commerce) with many of the so-called comprehensive CMS packages available.


    # ExponentCMS


    ExponentCMS is available at http://www.exponentcms.org. At the time of writing,
    the most current version is 0.963, and this section is based on. On the Exponent/Source
    interface at http://sourceforge.org/projects/exponent/, you can find links to
    screenshots, documentation, contributions, and the Standard Source information.


    # Installation Notes


    Installation is relatively simple, and the only thing you need to know before
    installation is that you will need to create a database. This applies to both
    remote and local installations. You will also need to have a user and password
    set up, as you will be asked to supply all information during the installation
    process.


    # General Overview/Default Installation


    Installing this CMS gives you several features that are "active" by default. These
    are:


    +   - Address Book: Organizes contact information.

    - Admin Control Panel: Easy-to-use interface for administering the site.

    - Calendar System: Keeps track of events with different views.

    - Contact Form: Allows visitors to the site to contact you.

    - Image Manager: Works with other modules to manage images on the site.

    - Preview Link: Lets those working on the site preview their work.

    - Private Messaging Center: Allows users to send emails or private messages to
    one another.

    - Resource Manager: Organizes and displays uploaded files.

    - Text Module: Displays text and keeps track of revisions.

    - Weblog/Online Journal Manager: Organizes blog entries.'
