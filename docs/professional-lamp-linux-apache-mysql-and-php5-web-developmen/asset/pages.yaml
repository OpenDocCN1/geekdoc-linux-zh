  md: "# More Obscure PHP\n\nwhat you would have expected from array_map('array',\
    \ $arr1, $arr2) if you'd been allowed to use 'array' as a callback.\n\nThis trick\
    \ is not limited to combining two arrays at a time. If the callback requires n\
    \ arguments, array_map() requires n arrays to be passed to. So if you have a function\
    \ that has six arguments, and an array of each, which you have to run the function\
    \ on, and all the results in a new array, array_map() will be returned.\n\nStrictly,\
    \ there are two calls to array_map(). The first uses a null callback to take the\
    \ original array[0..n][0..5] and return the transpose array[0..5][0..n], the second\
    \ to use the callback function on successive elements of array[0], array[1], ...\
    \ array[5].\n\narray_map() has two glaring limitations. First, every argument\
    \ after the callback must be an array. If you want to use a single variable in\
    \ each array's work of operations (which is clamping all values of array to a\
    \ certain maximum), then you have to do one of the following:\n\n+   - Declare\
    \ the variable in global scope and use the global callback function (not the most\
    \ attractive option)\n\n+   - Use_array_fill() to make an array of duplicates\
    \ (useful if you only don't need the operations carried out on separate copies\
    \ of array, or if the variable is passed-by-reference object or resource)\n\n\
    +   - Fall back to using a loop after\n\n+   - Use a different function: specifically,\
    \ array_walk()\n\n+   - Use an option that can be considered when writing OOP:\
    \ make the callback a method and the value property of the object\n\nThe other\
    \ limitation is that you need to know how many arrays are to be mapped together,\
    \ and list them all explicitly in the function call. You could work around this\
    \ by wrapping elements of the input arrays into a single consolidated array and\
    \ passing the elements of that array to the callback function. This requires rewriting\
    \ the callback function, or when that's not possible, writing a wrapper function\
    \ to unpack the consolidated element and passing the contents to the real callback.\
    \ And you'll realize that when you do that you're back to where you started. Fortunately\
    \ PHP supplies a solution to this, too, in the form of call_user_func_array(),\
    \ covered later in this chapter.\n\n# array_walk()\n\nImagine that you're using\
    \ the GD library extension to draw up a chart, and you have a lot of data points\
    \ to indicate with circles of varying sizes and colors. The positions and radius\
    \ have been scaled to image coordinates, and the colors have been allocated and\
    \ identified by the image palette index (returned by imagecolorallocate()). You\
    \ are supplied an array of the data points, each containing the x-coordinate,\
    \ the y-coordinate, the radius, and the color, respectively. For example:\n\n\
    ```\n$data_points = array(\n  array(10,10,5, $palette['black']),\n  array(10,20,5,\
    \ $palette['black']),\n  array(20,13,5, $palette['darkolivegreen'])\n);\n```\n\
    \n51"
