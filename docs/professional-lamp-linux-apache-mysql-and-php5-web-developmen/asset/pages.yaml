    You can name the table and columns however you like. In the preceding example,
    user_info is used for the table name, and user_name and user_password are used
    for the login/password combination because these are the default names recognized
    by mod_auth_mysql.


    In later versions of mod_auth_mysql, the default column for password is user_password,
    not user_passwd as it states in the module documentation.


    Create an initial test account that you''ll use when testing the authentication:


