  md: "# Chapter 9\n\n```\nfor($i=0; $i<100; $i++)\n{\n    if($foo[$i]!=0)\n     \
    \   continue;\n    //...etc.\n}\n```\n\nNote that the test in if statement has\
    \ been negated, and the depth to the remainder of the loop is indented by one\
    \ level of indentation. This can also be used to reduce the complexity of tests.\
    \ Recalling another example from earlier in the discussion:\n\n```\nfor($i=0;\
    \ $i<100; $i++)\n{\n    if($a==$i || $b==$i)\n    &&\n        ($c==$i || $d!=$i)\n\
    \        {\n            echo \"Either a or b is equal to $i,\";\n            echo\
    \ \"Either c or d is not.\";\n        }\n}\n```\n\nYou can see that this is another\
    \ case where there is only one if statement inside the loop, and how it can be\
    \ written as:\n\n```\nfor($i=0; $i<100; $i++)\n{\n    if(!($a==$i && $b==$i) &&\
    \ ($c==$i || $d!=$i))\n        continue;\n        echo \"Either a or b is equal\
    \ to $i,\";\n        echo \"Either c or d is not.\";\n}\n```\n\nBy employing a\
    \ little Boolean algebra, the test reduces to:\n\n```\nif(($a==$i && $b!=$i) ||\
    \ ($c==$i && $d===$i)\n```\n\nSo either a or b are both equal to i, or if c and\
    \ d are, the loop will continue. If you test that a and b are not both equal to\
    \ i, you can know right away if you are continuing, without having to go at c\
    \ or d. The test can be split into two separate statements:\n\n```\nfor($i=0;\
    \ $i<100; $i++)\n{\n    if($a==$i && $b!=$i)\n        continue;\n    if($c==$i\
    \ && $d===$i)\n        continue;\n        echo \"Either a or b is equal to $i,\"\
    ;\n        echo \"Either c or d is not.\";\n}\n```\n\nBecause PHP allows continue\
    \ or break to take an argument expressing how many levels to continue or break,\
    \ a simple continue or break can be employed in situations where in C or Java\
    \ you would\n\n218"
