  md: "# AJAX\n\nWith the exception of responseText and responseXML, these properties\
    \ are mainly involved in determining if and when a response has been received.\
    \ This is necessary because your requests are asynchronous, meaning you cannot\
    \ rely on the availability of the response at any line of code based on execution\
    \ order or time. asynchronous communication relies on an event-driven model for\
    \ processing. The readyState property contains a value that indicates the progress\
    \ of the request. Every time this changes, a ReadyStateChangeEvent is fired. If\
    \ defined, the onreadystatechange handler is called to handle the readyChange\
    \ event. In some cases, you will not be interested in any of these events except\
    \ the final one, when the readyState property changes from 3 (loading) to 4 (complete).\
    \ a readyState of 4 does not mean that the request was successful. It indicates\
    \ only that all operations have been completed. You must still check the status\
    \ property to gain insight into the success of the request. The server could have\
    \ encountered an error during the processing of the request. if the status property\
    \ has the value of 200 (OK), then the request was successful and any expected\
    \ response should be available in responseText or responseXML. If this seems a\
    \ bit confusing, that's okay: you'll be diving into some code and it will all\
    \ come together.\n\n# Working with the Interfaces\n\nBecause the interface goes\
    \ by different names and is instantiated one for Internet Explorer (because the\
    \ interface is ActiveX object) and also in Mozilla, Safari, Konqiari, and Opera,\
    \ creating a request is less straightforward than you might expect. The code here\
    \ is a very basic method of working around these browsers. If you have looked\
    \ into an implementation of AJAX, you have seen some code that looks similar to\
    \ this.\n\n```\n<script type=\"text/javascript\">\nfunction getXMLHttpRequest()\
    \ {\n  var req = false;\n  // first, try instantiate the native object\n  if (window.XMLHttpRequest)\
    \ {\n    try {\n      req = new XMLHttpRequest();\n    } catch (e) {\n}\n  //\
