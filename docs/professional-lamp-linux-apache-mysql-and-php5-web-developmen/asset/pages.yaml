    # Assignment versus Cloning\n\nAs you may already know, in PHP, there are two\
    \ ways to assign data to a variable: assignment by reference, and assignment by\
    \ value. The first, assignment by value, is most commonly used when setting simple\
    \ values for variables, or copying other variables:\n\n```\n$a = 5;\n$b = $a;\n\
    ```\n\nYou are using assignment by value. When the value of $a is changed, $b\
    \ remains unchanged; when you assigned $b = $a, you simply created a copy of the\
    \ value of $a, and assigned that value to $b.\n\nAssignment by reference is a\
    \ different, however. Take the following example:\n\n```\n$a = 5;\n$b = &$a;\n\
    ```\n\nIn this example, you are assigning by reference, using the & operator.\
    \ When the value of $a is changed in this situation, $b would change as well—since\
    \ $b was assigned, by reference, the value of $a, both variables point to the\
    \ same location in memory, where that in memory is changed, both variables change\
    \ as well.\n\nIn PHP, all objects are assigned by reference, by default. This\
    \ behavior is unlike PHP4, which assigned by value, unless the reference operator\
    \ (&) was used. In PHP5, if you want to make a copy of an object, instead of using\
    \ a reference, you must use the clone statement, as follows:\n\n```\n<?php\nclass\
    \ Circle\n{\n    public $radius = 10;\n}\n\n// Create the original object and\
    \ set its parameters\n```"
