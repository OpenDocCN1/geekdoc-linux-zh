    # GIS Photographic Database Query


    Land Information New Zealand (http://www.linz.gov.nz/) maintains a 2.5-meter resolution
    photographic atlas of the country. These aerial have been scaled and oriented
    so that their vertical and horizontal axes are exactly north-south and east-west,
    in so-called "orthophotos". The photography is available in the form of images
    800x6000 pixels in size, spanning to an area of 3.2 x 2.4 kilometers in extent.
    Four photos suffix to encompass Auckland City. As a single grayscale PNG, the
    image of the entire country is 115MB.


    Now imagine an online service in which users provide latitude and longitude for
    a point within Auckland, with a radius, and the response with the appropriate
    image. The most straightforward method would be simply due to the size of the
    image (remember that it is 115MB while it is still compressed into a PNG file:
    uncompressed it is about a byte for 192 million pixels).


    Another approach would be to store the image in an uncompressed format (LINZ provides
    the image) and write a program that can locate and read the relevant bytes from
    one or more files (1 million bytes by one, it''s quite a lot for the entire country,
    making for a lot of raw data that needs storing for read access), without having
    to load the whole image into memory. This is certainly the better option of the
    two, but it is not something that is well-suited to PHP, mainly due to speed considerations
    when it comes to assembling the final image from the bytes read. A custom extension
    written in C would be more appropriate. Since the current discussion is looking
    at PHP''s stream wrapper interface, a solution wouldn''t be especially edifying.


