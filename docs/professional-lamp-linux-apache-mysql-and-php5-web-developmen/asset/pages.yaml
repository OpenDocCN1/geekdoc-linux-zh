  md: 'the developers list "Not overly abstract" as a feature. Many aspects of XMLHTTP
    communication benefit greatly from abstraction, you might consider SAXAJ''s lack
    thereof as a drawback. Still, SAXAJ offers a method of simplifying the server-side
    handling AJAX requests from the client and the client-side handling of instantiating
    XMLHTTP request objects and issuing necessary requests.


    # # CPAINT


    CPAINT (http://cpaint.sourceforge.net/) is the Cross-Platform Asynchronous Interface
    Toolkit. It supports both plain-text and XML response types. Additionally, it
    has some support for retrieving responses directly as JavaScript objects. The
    library is mature and actively developed.


    CPAINT generates the XML for function calls, and the result is somewhat non-semantic
    structure. Also, for some unknown reason, the generated XML elements are all in
    uppercase. If the name you supply for an element is not in full uppercase, the
    library converts it to uppercase. The documentation of library usage is a little
    tough to get through, but each part of the puzzle is explained well and a trivial
    example is given for each to help you grasp the idea.


    # # JSPAN


    The primary goal of JSPAN (http://jspan.sourceforge.net) is to bridge the gap
    between JavaScript and PHP. It allows for seamless importing of PHP classes to
    JavaScript. This means that you can define a class in PHP and call all its methods
    as if it were a JavaScript object. Between scenes, JSPAN is issuing requests to
    the server to execute methods. Other libraries offer similar functionality, but
    do not come close to the abstraction offered by JSPAN. Documentation and example
    code for JSPAN are abundant and clear in wiki format and are ever-growing. The
    code is clean and easy to read, just like the XML it generates. Furthermore, initial
    work is currently under development to embed JSPAN in PHP frameworks to make it
    even easier to develop fat-client applications.


    The library does not rely ever from DOM manipulation tasks, but it abstracts the
    usage of XMLHTTP query well. Unfortunately, it seems to have problems supporting
    Opera, but it supports Mozillabased browsers and Microsoft''s IE quite well. Additionally,
    on your application, a bridge between JavaScript and PHP might not cost you a
    lot of, and only serve to exchange XML tree traversal with object and native JavaScript
    accesses. As there is additional overhead in creating the native JavaScript versions
    of PHP classes, the benefits might not outweigh the costs. However, JSPAN could
    allow you to completely ignore the details of how PHP classes are made available
    to JavaScript and focus attention on the functionality of the application itself.


    There are many other libraries that support PHP. You can learn more about various
    AJAX concerns at http://www.ajaxpatterns.org/AJAXFrameworks.


    # # When Not use AJAX


    The explosive interest in AJAX is somewhat of a double-edged sword. There was
    a similar boom in the use of Macromad''s Flash product. Clients were asking for
    because it looked good. Just as Flash, AJAX introduces usability and accessibility
    concerns, many of which are solved in traditional web applications.'
