    # Configuration and Usage


    Once you have your database tables ready and modules installed, all that remains
    is to tell Apache what needs to be protected. Like standard Apache authentication,
    you''ll need to add some configuration directives to either a <Directory> section
    in httpd.conf, or create a .htaccess file in the directory you choose to.


    Telling Apache to validate user credentials against your MySQL database would
    usually involve the following at a minimum:


    ```

    AuthName "<zone name>"

    AuthType Basic

    MySQLDB dbname

    MySQLUser userid

    MySQLPassword password

    AuthSQLEnable On

    require valid-user

    ```


    The first two lines and the last line of these directives should already be familiar
    to you. They simplify the name of the protected area, the type of authentication,
    and any valid user found in the checked resource is allowed access. The other
    lines tell Apache where to find the authentication information. Instead of giving
    Apache the name of a file that contains the passwords for each user, you''re supplying
    database—database name, username, and password—so that Apache and mod_auth_mysql—easy
    to tell Apache to use MySQL authentication without having to completely unload
    or remove the module.


    To use the authentication tables you created, you would follow the following in
    <Directory> or .htaccess definitions:


    ```

    AuthName "MySQLLAuth"

    AuthType Basic

    MySQLDB apacheauth

    MySQLUser apache

    MySQLPassword apachepass

    AuthSQLEnable On

    AuthSQLPwEncryption shal

    require valid-user

    ```'
  merge: -1
