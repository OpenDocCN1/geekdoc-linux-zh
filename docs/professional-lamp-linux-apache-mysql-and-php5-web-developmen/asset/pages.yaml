  md: "# Site Security\n\nNotice instead of simply creating a field to store the user's\
    \ password as raw text, you are creating fields to store one-way hashes of the\
    \ user's password. Doing this ensures the password can still be compared to the\
    \ value entered at the password prompt, but makes it extremely difficult for those\
    \ who would try to crack the passwords if the database was compromised. If you're\
    \ familiar with MD5 or SHA1, you know they are both one-way hashing algorithms.\
    \ It is nearly impossible to determine an original password after it has been\
    \ hashed by either of the.\n\nMD5 takes an input string and creates a 128-bit\
    \ \"unique\" fingerprint, or hash, of the original input. SHA1 behaves in a similar\
    \ manner, but produces a 160-bit \"unique\" fingerprint.\n\nYou may have noticed\
    \ that the previous discussion didn't speak in the absolute regarding uniqueness\
    \ or bullet-proof hashing provided by either of these solutions. Until recently,\
    \ MD5 has been considered a reasonable solution for hashing all the most secure\
    \ data, and SHA1 is the same. Neither encryption scheme is 100% unbreakable when\
    \ brute force is used. A password-generating program could run through every combination\
    \ of every character and every password length until it eventually finds an input\
    \ string that matches the MD5 hash by either of algorithms.\n\nRecent advances\
    \ in crypto-analysis have proven, however, MD5 can be defeated quicker by finding\
    \ an input that produces an identical output hash, though the input strings do\
    \ not match—an inherent weakness in MD5: SHA1 has come under attacks as of recently,\
    \ and as processing power increases, the time to brute-force a hash decreases\
    \ rapidly.\n\nTo combat any sort of collision attacks with MD5, you need the Users\
    \ hold both MD5 and SHA1 hashes for the password. Doing this effectively makes\
    \ any collision attack futile—even if an intruder manages to find an input string\
    \ that matches the MD5 hash, unless it's the real password, it will not match\
    \ the SHA1 hash.\n\nTo make the database useful to the authentication script,\
    \ you need to add at least one user:\n\n```\nINSERT INTO Users VALUES ('testuser',\
    \ MD5('testpass'), SHA1('testpass'));\n```\n\nThe built-in MySQL functions MD5()\
    \ and SHA1() are used when adding the passwords.\n\n# A PHP Basic Authentication\
    \ Script\n\nOnce your database is set up, create the following script, and save\
    \ it as phpbasicauth.php:\n\n```\n<?php\n// Define database constants\ndefine('AUTH_HOST',\
    \ 'localhost');\ndefine('AUTH_USER', 'WebAuth');\ndefine('AUTH_PASS', 'AuthPass');\n\
    define('AUTH_DB', 'WebAuth');\n\nfunction attempt_auth()\n{\n  // Send authentication\
    \ headers\n  header('WWW-Authenticate: Basic realm=\"Protected by PHP\"');\n \
    \ header('HTTP/1.0 401 Unauthorized');\n```"
