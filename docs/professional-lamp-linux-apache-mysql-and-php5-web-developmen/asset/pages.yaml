  md: '# More Obscure PHP


    stream_write(): Again, this function should be called only if the stream is actually.
    It is the stream object''s responsibility to keep track of what it is doing from
    one to the next. You need not write all the bytes you passed; you may truncate
    the data if necessary. In any case, this method returns the number of bytes that
    were written (including 0 if none were written at all). This number should be
    one of the bytes it received. A stream that carries base64 encoding will write
    four bytes for every three it receives. If asked to write "abc" it would write
    "YWj", return 3. This return value is for the benefit of the caller, after all,
    by definition is not supposed to be impeded by the operation of the "call." if
    you do write fewer bytes than requested, it is the caller''s responsibility to
    decide whether or not to try again, but the stream may need to retain some data
    in any way. The base64 encoder is an example of this: having passed "ab" it would
    be to write "YW", but the last two bits of the "b" have to be retained while the
    stream waits for the next input byte or a stream_close(). This encoder should
    return "b" again in the next stream_read() call. Unless it has at least three
    bytes, and then encodes (and outputs) multiples of three bytes at a time. For
    this work, the stream would need to claim that all the bytes that have been passed
    even if it hasn''t actually done so, and that no one finds out about its subter.
    Otherwise the caller might get upset that it returned 0 when passed "ab" and try
    again, and with the caller waiting for a third that it never gets to see.


    stream_eof(): A readable stream could be asked at any time whether not the end
    of the stream''s data has been reached (especially after stream_read()) returned
    an empty string for some reason). This is simply a Boolean function that returns
    "true" if the end of the stream has reached.


    stream_close(): It is the stream object''s responsibility to tidy anything that
    needs tying up, any streams of its own, and so on. Returning to the base64 encoder,
    there is a betterthan-even possibility that the stream will be left with one or
    two bytes that will never get to be part of a triple. So it''s safe to finally
    encode these and write them out, padding with the requisite number of signs.


    Those are the basics of opening and closing a stream, and reading and writing.
    A stream wrapper has other methods that should be implemented if they are appropriate
    to the protocol and cover such tasks as random access, directory control, and
    so.


    When a stream is opened, stream_open() is called with the complete path as its
    first argument, including the protocol. This is principally so you can use parse_url()
    to break the path into its components, and therefore it is a good idea to design
    your stream name to use the conventional URL syntax appropriate (scheme://username:password@host:port/path?query#fragment).
    Incidentally, it also means that the same stream class can handle more one protocol,
    but this is handled by subclassing.


