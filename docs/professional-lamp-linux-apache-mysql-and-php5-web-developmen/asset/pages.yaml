  md: '# Content Management Systems


    +   - Use WikiWords

    - Autonomospaced Text


    The other available features (articles, blogs, image galleries, and others) allow
    a certain level of customization as well, but not እንደሚ detailed as the Wiki section.


    # Strengths and Weaknesses


    WikiWiki''s strengths are:


    +   - Documentation and support community are extensive, as in many other open
    source CMS packages.

    - Strong Wiki customization makes online collaboration easy.

    - There are 35 themes that come with default installation, and they are basic
    CSS files which make further customization easy.

    - Extensive statistics are available for every active module.

    - This CMS is one of the most comprehensive; it comes with just every conceivable
    module (aside from the transactional functionality), making it easy for you to
    customize without having to install plugins or add-ons.


    For weaknesses, Galaxia Workflow is a bit complex and takes some separate reading
    to understand how the system is set up and how it can work for you. This could
    also become a strength for TikiWiki, as you are able to wade through the system,
    it can provide you with a very comprehensive tool for managing projects.


    With this software, you can quickly offer any users you would desire. In there
    is so much functionality available through this software that amateur developers
    might be tempted to use too many modules "because they can". Our recommendation
    is that you know exactly what you want in your site, and if you have many users
    that will be contributing to the actual content of the site, you should definitely
    check out this CMS.


    # Others


    There are numerous other source CMS packages available. A few worth of mention
    are:


    +   - Mambo: Available at http://www.mamboser.com. This is a popular CMS that
    offers a basic level of pre-installed features, with numerous downloads. The project
    fosters a healthy support system and the interface is relatively easy to administer
    without going deeply into it.

    - Drupal: Available at http://www.drupal.org. This is another popular CMS that
    is focused on function and not necessarily formal. A few themes are included,
    but customization is limited without delivering code. A nice feature is the "recent
    system events," which is displayed when the admin logs in, allowing the admin
    to easily see what users have been doing.

    - PHP-Nuke: Available at http://www.phpnuke.org. This is one of the oldest PHP/MySQL-based
    CMS. It''s been around since 2000, and has one of, if not one, the largest CMS
    communities availability. It''s still currently in development, but the bad news
    is that it is no longer free—you are required to pay a minimum fee to download
    the latest copy. You can also join the PHPNuke Club (for another fee) if you would
    like to be among the PHPNuke elite.


    321'
