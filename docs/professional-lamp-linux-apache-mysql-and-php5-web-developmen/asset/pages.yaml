  md: '# 8


    # PEAR and PECL


    The underlying concept of open source is, of course, using a collaborative effort
    to accomplish great things. The synergy that exists between the countless contributors
    and their efforts pushes open source projects through ever-expanding boundaries.
    However, with this immense and vastly diverse effort come challenges that could
    potentially hinder the success of the movement. These challenges are organization,
    coordination, and direction. Without organization, there would be no standards
    in code writing, snippets of code would be dispersed throughout the vast Internet,
    most likely between poorly written HTML pages, never to be seen by human eyes.
    Without direction, there would be no look to the future, no resource for aspiring
    contributors to get excited about. In short, there would be just a bunch of techies
    writing and rewriting the snippets of code as everybody else, acting independently
    in their own little proficient bubbles. Everyone knows that no man is an island,
    however, and that''s where the PEAR and PECL groups come in, to provide desperately
    needed organization, coordination, and direction, so developers can be all better
    off in the long run.


    By providing developers with ready-made scripts that accomplish common tasks,
    such as to a database or interfacing with an XML document, PEAR and PECL packages
    can save you a lot of coding time and headaches.


    While both accomplish similar tasks, PEAR and PECL do have fundamental differences,
    which this chapter explains in detail.


    # What Is PEAR?


    PEAR (PHP Extension and Repository) is designed to act as a home for wayward useful
    classes. As the name suggests, it is a repository of code packages, which may
    consist of one or more files, and which accomplish common tasks such as creating
    HTML forms, working with dates and images, or connecting to the database and running
    queries. Because these are functions that every coder will undoubtedly use from
    time to time, they make perfect candidates for PEAR packages.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Chapter 8


    Because there is a strict of coding standards for developing and releasing a PEAR
    package, a coder can rest assured the look and feel of one package will be consistent
    with the rest. As you become familiar with using them, you will begin to know
    what to look for and how the code is structured. PEAR packages are also known
    for their extensive commenting requirements and naming conventions, something
    that is sort of lacking in many open source programs, leaving you with the daunting
    task of trying to figure out someone else''s logic.


    All new packages must go through the PEP (PEAR Proposal System) before being included
    in the PEAR distribution list. This four-step process ensures that each package
    is scrutinized for its accuracy, reliability and relevance. If you would like
    to learn more about PEPr, you can visit the site http://pear.php.net/pepr.


    # What Is PECL?


    PECL (PHP Extension Library) is a spin-off of PEAR, and is primarily used to house
    groups of functions that are no longer bundled with the default installation of
    PHP. As of PHP 5, these extensions can be downloaded and installed separately
    from the regular PHP download. It should be noted, however, that some of the extensions
    currently residing in PECL are now bundled with the default installation (such
    as SQLite), or extensions were submitted by somebody outside the PECL core team,
    and were never bundled with PHP (such as POP3).


    Because most PECL extensions would be part of the standard list of PHP functions,
    the standard dictates that they are written using PHP''s coding standards (as
    opposed to PEAR''s). While the general public can still submit packages, the process
    for submission implies approval by the pear-dev mailing list.


    # Exploring PEAR


    You should be aware before you delve into the world of PEAR because it is a class-based
    system, you should be familiar with OOP in PHP in order to use the packages properly.
    If you are a hardcore function-based coder, it would benefit you to hone your
    OOP skills through a quick tutorial or a brief review of Chapter 2 of this book.


    The first thing you need is the PEAR package itself, which enables you to install
    or upgrade PEAR packages. Frankly, this manager comes pre-installed with PHP5
    (and versions 4.3.0 and up) and will make your life easier when installing, managing,
    and upgrading the other PEAR packages. The main PEAR package includes a set of
    error-handling functions to enable you to easily detect and manage errors encountered
    by your PEAR package.


    # The PEAR Manager


    The main purpose of PEAR manager is to assist you in managing and working with
    your other packages, as stated previously. With it comes a set of commands that
    you can run from the command line (which may or may not require root). This list
    can be found in its entirety at http://pear.php.net/manual/en/installation.cli.php,
    but the following table highlights the main commands for your reference:


    184'
