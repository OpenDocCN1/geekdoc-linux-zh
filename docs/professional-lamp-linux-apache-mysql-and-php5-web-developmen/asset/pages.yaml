  md: '# PHP Configuration


    its own configuration directive. Automatic escape of input data is controlled
    by the magic_quotes_gpc directive, and the escaping from any function is controlled
    by the magic_quotes_runtime setting.


    Because these are critical operations that can "dirty" your data gets, PHP provides
    functions to quickly ascertain the current setting for each: get_magic_quotes_gpc(),
    for the input data, and get_magic_quotes_runtime() for the function handler. Both
    functions require no arguments, and return 1 if the setting is enabled, or 0 if
    disabled. Run this:


    ```

    <?php

    echo "Magic quotes GPC: " . get_magic_quotes_gpc() . "\n"

    Magic quotes runtime: " . get_magic_quotes_runtime() . "\n";

    ?>

    ```


