    \ an array of bunches of things.\\ The Othelements of each array are combined\
    \ into a single array that becomes the first element of the result array, and\
    \ so on. In other words, if you picture your array arguments as being the columns\
    \ of a matrix, array_map(null, ...) returns the transposed matrix. It is effectively\n\
