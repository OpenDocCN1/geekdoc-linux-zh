  md: '# Apache Tricks


    This chapter shifts away from talking about PHP for a bit to discuss some features
    of Apache that you may not be aware of. You already know that Apache is the most
    popular and powerful server available, and that PHP is designed to work with Apache,
    but you may not know that you can expand Apache itself to make your site run more
    effectively. True to its open-source nature, there are a number of excellent modules
    available for Apache that expand its functionality and provide useful features
    for you as a site administrator.


    This chapter discusses three of those modules. Mod_rewrite enables you to provide
    URL substitutions to accommodate sites, but if you use it properly, you can use
    it to secure your site and make it friendlier to search engines. Mod_spelling
    helps correct inadvertent spelling mistakes made by visitors to your site. Mod_deflate
    enables you to compress your content as you send to users, saving money on bandwidth.
    Mod_auth_mysql lets you beef up your security by harnessing the power of a database
    with Apache''s authentication. Mod_ssl allows you to encrypt the data flowing
    to and from your web server. Finally, mod_dav allows you to use your Apache web
    server as a distributed file repository.


    # URL Rewriting


    If you gathered all the web developers and server administrators in the world,
    and had them make a list of the most important modules that can be used with Apache,
    it''s a good bet that mod_rewrite will be on that — and with good reason.


    Mod_rewrite, for the unfamiliar, is an Apache module that provides URL rewriting
    functionality. While that may sound simple, in reality mod_rewrite is the Swiss
    Army knife of Apache modules. What can you do with mod_rewrite? Outside of the
    obvious URL-rewriting, mod_rewrite gives you the ability to keep query-string
    input safe, keep your site search-engine-friendly, make your URLs user-friendly,
    retain "old" after a restructuring, and stop hot linking. You will find that mod_rewrite
    can quickly become more than just a simple URL-changing robot.'
