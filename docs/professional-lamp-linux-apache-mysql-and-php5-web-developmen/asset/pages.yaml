  md: "# Chapter 2\n\n```\n<?php\nclass Circle\n{\n    private $radius;\n\n    public\
    \ static function setRadius($r)\n    {\n        self::$radius = $r;\n    }\n\n\
    \    public static function getRadius()\n{\n        return self::$radius;\n  \
    \  }\n}\n\nCircle::setRadius(5);\necho \"our staticially accessed circle has a\
    \ radius of \" . \nCircle::getRadius() . \"\\n\";\n?>\n```\n\nA quick run through\
    \ the PHP5 engine would produce the:\n\n+   - Our staticially accessed circle\
    \ has a radius of 5.\n\n# Class Constants\n\nAlong with the improved object in\
    \ PHP5, the notion of class constants was introduced to PHP. Class constants are\
    \ similar to regular PHP constants, but are available only within the definition\
    \ of a class. Standard PHP constants, their value can be set only once to a scalar\
    \ value — a simple number or string — and any attempts to set a constant to the\
