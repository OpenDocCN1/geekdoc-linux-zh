    \n+   Array\n(\n  [x] => 0\n  [y] => 0\n)\n\nFatal error: Cannot instantiate example,\
    \ the Circle class inherited from Shape in /www/plamp/ch02/02-010.php on line\
    \ 17\n\nAs you can see by running this example, the Circle class inherited from\
    \ Shape as expected, but when you tried to instantiate Shape by itself, a fatal\
    \ error occurred.\n\nNow that you've had a quick look at inheritance in PHP, take\
    \ a look at another way to prescribe object interfaces.\n\n# Interfaces\n\nAnother\
    \ new object-oriented feature in PHP5 is the ability to create and use interfaces.\
    \ Interfaces, in a nutshell, are a way to specify what a class must explicitly\
    \ implement. This is useful when dealing with many interconnected objects that\
    \ rely on the specific methods of one another.\n\nBy using interfaces, you can\
    \ specify a specific set of methods for different interchangeable classes to share.\
    \ That way, if you ever need to replace functionality within a class in your program,\
    \ you have to make sure the replacement class implements the same interface, or\
    \ group of functions, that the original exposed.\n\nFor example, you might have\
    \ a business class that contains the method calculateInterest(). At some point\
    \ you might want to have multiple ways to calculate the interest, so you create\
    \ different classes for each algorithm you wish to use. Assuming all the classes\
    \ implement a consistent interface—one that defines calculateInterest()—each of\
    \ the classes should now be interchangeable in the program."
