    # AJAX Libraries


    If this seems overwhelming, do not fear. Because AJAX as a development method
    isn''t exactly new, there are plenty of libraries available that can take care
    of the dirty work. Recently, with renewed interest in AJAX, the number of available
    libraries has increasing dramatically and existing libraries have been maturing
    rapidly.


    # SAJ


    SAJ (http://www.modernmethod.com/saj/) is the Simple AJAX Toolkit, and has a server-side
    implementation in PHP (many other languages). Essentially, using this library,
    you can define functions in PHP and call them from client via XMLHttpRequest.
    To enable a function for remote procedure call requires only one AJAX function:
    ajax_export(''phpFunctionName'').


    Unfortunately, AJAX does not help when it comes to the necessary DOM manipulations.
    In fact, because AJAX treats the response as text and inserts the response directly
    into the document using the innerHTML property of a given element (which is often
    considered inferior to DOM manipulations), DOM manipulations are not possible
    unless you implement your own string parsing algorithm. On the SAJ frequently
    asked questions page (http://www.modernmethod.com/saj/faq.html),


    282'
