  md: '# Chapter 12


    # Installing APC


    First, grab a copy of the latest version of the APC source code from the PECL
    website: http:// pecl.php.net/package/APC.


    Once you have a copy of the source code in tar/gzip format, extract the package
    and change directory into newly created source folder:


    ```

    tar -xvzf APC-3.0.5.tgz

    cd APC-3.0.5

    ```


    Next, run phpize in the source folder. Be sure to use the correct path to your
    installed copy of phpize that comes with PHP:


    ```

    /usr/local/bin/phpize

    ```


    When phpize is running, you should see output similar to the following:


    ```

    Configuring for:

    PHP Api Version: 20031224

    Zend Module Api No: 20041030

    Zend Extension Api No: 220040412

    ```


    After phpize is finished, run the configure script, again substituting the proper
    path to your php-config and apxs programs:


    ```

    ./configure \

    --enable-apc \

    --enable-apc-mmap \

    \--with-apxs=/usr/local/apache2/bin/apxs \

    \--with-php-config=/usr/local/bin/php-config

    ```


    Then, build the shared object:


    ```

    make

    ```


    After it is done building, install the DSO (as root):


    ```

    make install

    ```


    At this point, there should be a copy of apc.so in your PHP extensions folder.


    To complete the installation, add the following to the extensions section of your
    php.ini file, and restart Apache:


    ```

    extension="apc.so"

    ```


    # Configuring APC


    In most situations, the default configuration that APC uses should suffice, but
    if you want to tweak caching to suit your needs or system, you can use the following
    directives in php.ini:


    288'
