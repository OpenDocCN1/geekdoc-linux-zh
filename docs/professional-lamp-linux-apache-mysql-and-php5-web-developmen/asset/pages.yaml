  md: "# Code Efficiency\n\n```\ndeclare_statement:\n  ':'; inner_statement_list T_ENDDECLARE\
    \ ';';\n\nswitch_case_list:\n  ':'; case_list T_ENDSWITCH ';';\n  ':'; ':'; case_list\
    \ T_ENDSWITCH ';';\n```\n\nAlso remove the whole of the new_else_list and new_else_single.\
    \ Because while_statement, for_statement, foreach_statement, and declare_statement\
    \ now all reduce to a single rule statement, without any associated code, the\
    \ productions themselves are now redundant. You could replace occurrences of while_statement\
    \ with statement (it appears once, in the productions for unticked_statement)\
    \ without ill effect, remove the production for while_statement, and gain a slightly\
    \ smaller and simpler parsing engine in the process.\n\nThis of course will break\
    \ any code written by anyone who uses the now-baked constructs.\n\n# Caching\n\
    \nHaving a page that is updated on a daily basis, yet is hit thousands of times\
    \ each day, may have that the same computations are carried out, producing the\
    \ same results, several thousand times a day. Carrying them out once and holding\
    \ on to the results for all subsequent requests offers the potential for enormous\
    \ savings.\n\nBecause your PHP application is insulated from the processor by\
    \ several layers of intermediate software, with instructions filtering down them\
    \ to the hardware, and filtering back up, there are several points where you could\
    \ potentially short-circuit the process. Between any two such layers there is\
    \ an interface where you can imagine an assistant remembers previous requests\
    \ for information from people and the information provided as a result, and can\
    \ supply that information immediately if and when the requests come in again.\n\
    \nAt the PHP level, there are two primary interfaces where caching can be effective.\
    \ You can either generate static versions of pages and serve them instead of regenerating\
    \ every time, you can have the source code of your PHP application stored in a\
    \ pre-parsed format for execution by the Zend engine without the additional step\
    \ of compiling the source code, or you can do both.\n\n# Source Pre-Parsing\n\n\
    When a PHP program runs, the source code is loaded, parsed, and compiled into\
    \ bytecode (machine code for an imaginary processor that is simulated by the Zend\
    \ engine), and that bytecode is executed. There are several products available\
    \ that can take compiled bytecode and save; a selection of the better ones is\
    \ given in the following table (alphabetical order).\n\n| afterBURNER'Cache |\
    \ http://bwcache.bware.it/cache.htm |\n| Alternative PHP Cache | http://peer.php.net/package/APC\
    \ |\n| PHP Accelerator | http://www.php-accelerator.co.uk/ |\n| Turck MMCache\
    \ | http://turck-mmcache.sourceforge.net/ |\n| Zend Optimizer | http://zend.com/store/products/zend-optimizer.php\
    \ |"
  merge: -1
