  md: '# The Image Source Trick


    JavaScript allows dynamic loading of images using the Image object. When one creates
    an image and sets its src property, the browser sends a request for the image
    and attempts to parse the response in the image object. Developers have used this
    to make one-way communication with a server by setting the src attribute to the
    URI of a server-side script, passing data to the server in the query string. The
    server-side script might not update a data store. Typically, no image is returned
    in the response, depending on whether this does not cause problems, as the developer
    does not use the Image object for its intended purpose.


    The positives of this technique are:


    +   - It allows for sending of data to the server without refresh.

    - It can read properties of the object to determine when request is complete.


    However, it has some drawbacks:


    +   - It cannot receive non-graphical data from the server (communication is one-way).

    - It cannot detect nor HTTP errors that may have occurred during the attempted
    communication.


    # Hidden Frames


    Many developers found the Image source trick to be inadequate and required the
    ability to retrieve information from the server in adding to it a hidden frame.
    In this technique, the developer uses a frame with no visibility (by setting the
    height or width to 0, depending on the frameset) as the vehicle. The hidden frame
    is nothing more a page with the minimal set of HTML elements plus a script element.
    The script element is simple definitions of arrays and variables, the values of
    which have been written by the server. Then, the controller frame (the one that
    is visible) can see the location property of this frame to that of a server side
    script, optionally sending data to its query string. The browser issues this request.
    The server-side script processes any passed information in the query string and
    writes data in JavaScript syntax. Like the following code to get the general idea.


    ```

    <php

    $username = $_GET[''username''];

    ?>

    <script type="text/javascript">

    top.usernameOK = <?php echo isUsernameAvailable($username); ?>;

    top.usernameAlts =

    new Array([<?php echo implode('','', getSimilarNames($username)); ?>]);

    top.frames[1].readVars();

    </script>

    ```


    This code lives in the hidden communication frame. In this code, a Boolean value
    is written to indicate the availability of a username passed to the script via
    the query string. When the browser''s JavaScript engine executes this script,
    it will store the Boolean value in the JavaScript variable name'
