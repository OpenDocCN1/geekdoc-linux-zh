  md: '# # Chapter 10


    sure to do here is proper header Content-type before outputting the movie as well
    as make sure no content is sent to the browser, as stray lines and white space.


    There can only be one instance of the SWFmovie object, but you can include multiple
    movies in one SWFmovie. In order to do this, you need to use another object, the
    SWSprite object. This object has similar qualities and attributes to the SWFmovie,
    but isnt not limited to only one movie. The advantage of this is that you can
    have multiple animations showing at the same time in the same flash movie. Each
    of the animations can be running at different rates as well as different lengths
    in time.


    Flash uses frames, just like a movie or animation. The objects SWFmovie and SWSprite
    both have functions to add new frames to them. Frames are useful in you can display
    different objects to the screen by clearing them in specific frames. This means
    that if you two or more objects to be displayed at the same time, they need to
    have a common frame. An object is added to a frame, every frame it contains until
    the object is removed from the movie. Also, just like a movie or animation you
    can go forwards or backwards, as well as skipping to a specific frame using the
    Using object. This use of frames provides a better way to group objects as well
    as generating timelines in your Flash movies.


    Ming and Flash use a coordinate system that may be different than what you''re
    used to. The unit of distance that used by Flash is the twist. The twist is defined
    as each image of an inch or 1/2 of a unit in size. This measurement is simply
    for easy conversion to a value of 20 units in 1 pixel. However this can be an
    arbitrary value, the SWFBitmap object in Ming will scale to the size of the player
    window what size an image is in twists. Therefore, if you need to have a movie
    with dimensions based on the size of the image, you simply need to create the
    SWFBitmap object, read its width and height values, and set the dimensions of
    the movie itself based on. The dimension of a movie does not need to be set right
    before it is displayed.


    # # Objects in Ming


    There are a total of 13 objects that PHP provides to generate Flash files with
    Ming. You can use a combination of these objects to create complex Flash movies
    with a wide variety of functionality. They are as follows:


    +   - The Action object lets add logic and functionality to a simple image display
    to your Flash file. Using Action you can move images and shapes around things
    such as games, as well as set properties of objects in the Flash file. Also you
    can include ActionScripts, which is Flash''s version of JavaScript and quite similar.
    This object is used commonly with the SWFButton to perform some action when the
    user presses the button. Common actions are used the displaying of specific frames
    in a Flash movie based on a response from the server.


    +   - The SWFBitmap object allows for images to be added to the Flash file. There
    are several limitations, though only non-process JPEG images and DBL ("define
    bits lossless") images can be added this way. Any other image can be converted
    to one of these formats using either other extension, such as GD, or by making
    a system call to a utility. This objects times is used with SWSprite and the SWFShapes.


    +   - The SWFButton adds a button to your Flash file. This button can be used
    to initiate an Action of the Action object. It reacts to common mouse actions
    as mousedown, mouseup, and rollover. A shape can be added to the button to change
    its appearance.


