  md: '# Chapter 6


    # Summary


    In this chapter, you''ve seen how adding a few Apache modules can improve the
    performance of your site considerably. It told you how to streamline URL redirection,
    fix user typos, compress your content to save bandwidth, create a web-based file
    share, and secure your site with MySQL and SSL. This extensibility is what makes
    Apache more than just an ordinary web server.


    After you''ve explored the potential of the modules discussed here, you should
    investigate others that you can find at http.apache.org and sourceforge.net. You''ll
    find modules there that can authenticate users against other databases, speed
    up the performance of other languages such Perl, use Apache as a proxy server,
    and more. As you can see, there are Apache modules for all sorts of purposes.


    Although this chapter introduced you to a new way to secure your site, the next
    chapter tackles the issue of security head-on.'
