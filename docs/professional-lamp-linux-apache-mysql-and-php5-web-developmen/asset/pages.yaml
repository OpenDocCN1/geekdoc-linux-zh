    # Creating and Using Streams


    Building a stream wrapper is a matter of adding certain methods to the stream
    object, and using stream_wrapper_register() to identify it as a wrapper.


    stream_wrapper_register() is called with two arguments. The first is the protocol,
    which is simply a name that indicates the wrapper to use when a stream is to be
    read-only—what is known in URLs as the scheme. It is the bit in the URL before
    the //, that is HTTP URLs, the ftp FTP URLs, and the file of URLs. For example
    you implement a stream and register it with protocol foonly, then you will be
    able to go foonly://* to enable reading from a foonly stream. The default protocol
    by fopen() and the other filesystem functions is file, which is why you have ever
    seen file:///path/file.ext, except /path/file.ext has the same effect.


    The second argument is a string name of the class that implements your wrapper.


    Naturally, the full list of wrappers are given in the manual. The principal ones
    are as follows:


    +   - stream_open(): This function starts code for a new stream—initializing variables,
    opening streams of its own, and so on. You call this function with four arguments.
    The first two are the same path and mode as the corresponding fopen(). For third-party
    extensions, the appropriate options be worked out and provided). The third argument
    could contain up to two flags: STREAM_USE_PATH indicates you should search PHP’s
    path if necessary to find the file, and STREAM_REPORT_ERRORS indicates whether
    it is the responsibility to trigger any error. If the stream cannot be opened
    or something goes wrong, or whether things are going to be handled higher (in
    which case your stream should not report any errors). STREAM_USE_PATH is only
    relevant if you are looking for something in the local filesystem, whether it
    is a file or an auxiliary stream that your stream uses. If your stream is read-only,
    it will return FALSE (and possibly trigger a warning) if requested with (r, a),
    and similarly for write-only streams.


    The PHP manual mentions "fopen_with_path", but as of 5.0.3 this function doesn''t
    exist. The include_path configuration is available via ini_get().


    +   - stream_read(): If the stream cannot be read, this will return FALSE. Otherwise
    your wrapper’s author, it is your responsibility to ensure that any relevant state,
    including file pointers, is maintained between successive calls to this method.
    You are allowed to return fewer bytes than requested (although an empty string
    may be interpreted as indicating the end of the stream).


    62'
