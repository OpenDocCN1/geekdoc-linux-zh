  md: "# More Obscure PHP\n\nafter calling `preg_replace_callback()`, returns the\
    \ contents of the template file — all with the `include: foo` parts replaced by\
    \ the contents of the corresponding template templates.\n\nThere is no `preg_match_callback()`\
