  md: "# Chapter 3\n\nfor. But hidden PHP's esoterica are some functions that don't\
    \ get the attention they deserve. These are functions that have been present in\
    \ PHP version 4.3.2 at the latest—many have been around the early days of PHP\
    \ 4. Despite this, they are often overlooked, when they are ideal for the task\
    \ at hand. Some of them seem to be used in tutorials about them. They are by no\
    \ means the obscure features of the language. Rather, they represent some of the\
    \ more powerful functionality of the PHP environment and areas which are the site\
    \ of active development in recent versions.\n\nThis chapter seeks to redress some\
    \ of this injustice.\n\n# Array Functions and Callbacks\n\nArray functions allow\
    \ you to access and manipulate the contents of arrays without having to extract\
    \ them first, if not all, of the operations you may wish to carry out on \"every\
    \ element of an array\" can be carried out using these functions, without requiring\
    \ the additional infrastructure of a for or foreach loop. Also, many array manipulation\
    \ requires the entire array to be taken into consideration. Sorting is obvious\
    \ example: you can't move the smallest element to the start of the array without\
    \ looking at all of the array's elements in order to locate the smallest. Anyone\
    \ who has tried to write a reasonably efficient sorting algorithm will know that\
    \ the task is not.\n\nBecause there is no PHP's developers could predict everything\
    \ you want to do with your array, most of the functions, as well as the arrays\
    \ in question, require an additional argument known as a callback, which names\
    \ another function, depending on what the array function does, would be used to\
    \ manipulate array elements, or compare them to other or under some criterion\
    \ you specify. In this way, PHP needs to provide implementations of the most abstract\
    \ aspects of array manipulation, such as mapping and traversing, leaving you free\
    \ to produce the concrete details of your choice.\n\nCallbacks can be useful for\
    \ abstracting functionality, in fact, that a selection of functions are provided\
    \ to allow their use in almost any situation. It's entirely conceivable (if quixotic)\
    \ to implement your very own architecture for OOP, with an object's \"methods\"\
    \ represented as an array of callbacks.\n\n# Using Callbacks\n\nConsider the following\
    \ script:\n\n```\n$input_file = file('generic.txt');\nforeach($input_file as $k)\n\
    {\n    $input[$k] = rtrim($line);\n}\n```\n\nYou're reading in a text file as\
    \ an array of single lines. PHP doesn't throw away the linebreak characters at\
    \ the end, so that they have served their purpose, you want to drop them yourself.\
    \ Writing an entire loop and using two extra variables within it seems longwinded.\
    \ For a start, you have to keep in mind that $line is copied, so $line=rtrim($line);\
    \ won't work, making that you have to refer to the original array and key. Either\
    \ that, or remember to declare $line by reference by writing foreach($input_file\
    \ as &$line). Mistakes in either will mean that the final array won't its lines\
    \ trimmed."
