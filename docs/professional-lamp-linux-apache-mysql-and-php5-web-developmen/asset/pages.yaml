    You would be serving yourself well if you follow the URL scheme for naming resources,
    defined in RFC 2788, with given paths. There may be in fact a naming scheme that
    matches your application (The official registry is maintained by the Internet
    Numbers Authority at https://www.iana.org/assignments/url-schemes). If there is,
    use it. Then your application will cooperate with other applications in the future
    using the same scheme without needing an extra layer of URL to glue them together
    (Actually, the same scheme goes for any data format or communications protocol–
    or if the world already has an agreed-upon standard for what you want, use and
    save yourself the effort and creating a new one).


    > Note that all PHP requires the use of : // the scheme, regardless of whether
    or not there is a naming authority (host) invoked, as PHP uses that sequence to
    distinguish URLs from local file paths. In RFC 3986''s terms, PHP implements the
    function of the four given for the "hi-part" component and leaves the "naming-authority"
    component optional. RFC-compliant workaround would be to use :////, implicitly
    specifying the local host as the naming authority.


    # Summary


    This has been a brief tour of the more underutilized areas of PHP''s native function
    set. By using this functionality your code can be more compact and reliable without
    sacrificing agility. Array functions often be used in place of sometimes complex
    loops, reducing the task to a single line of code and a helper function that can
    be captured and stored in a library for reuse. Function-handling functions allow
    you to decide at runtime not which function you wish to use (a switch statement
    could do that), but also decide which functions are in this list to select, or
    even create the function from scratch. Streams allow you to hide the implementation
    details of how external data is read or written, allowing the rest of your program
    to treat it as just another file.


    There are always new features being added to PHP — new initialization sets to
    fine-tune its operation, new arguments to existing functions that enhance their
    utility (even the venerable str_replace() has been given a new argument in PHP5),
    new functions, and even whole new categories of functions. All this makes learning
    PHP an ongoing affair in which there is always something you don''t know about
    yet.'
