  md: '# Chapter 6


    Please enter the following ''extra'' attributes

    to be sent with your certificate request

    A challenge password []:testchallenge

    An optional company name []:]:Test Company


    Any responses to the prompts in bold should be replaced by your appropriate values.
    Also, be sure

    at the value you enter for Common Name is the real fully qualified domain name
    for your server, such as www.yourserver.com.


    After the command and you have answered all prompts, you will have two new files:

    private.pem, which is a private key used to sign the certificate, and testcert.csr,
    the certificate

    next step is to remove the passphrase from the key created in the previous step.
    If you don''t

    remove the passphrase, you must enter it every time Apache is started. While this
    may seem like extra

    security, it is a real nuisance, as it prevents Apache from restarting completely
    if your server suffers a

    power failure, or you Apache frequently.


    To remove the passphrase, use the following command:


    ```

    openssl rsa -in privatekey.pem -out testcert.crt

    ```


    This will prompt you to enter the passphrase you used in the very beginning of
    the previous

    command:


    ```

    Enter pass phrase for privatekey.pem:

    writing RSA key

    ```


    The next step is to convert the certificate request into a signed certificate:


    ```

    openssl x509 \

    -in testcert.csr \

    -out testcert.crt \

    -req \

    -signkey testcert.key \

    -days 3650

    ```


    This will show:


    ```

    Signature ok

    subject=/C=US/ST=Ohio/L=Cincinnati/O=TestSSL/OU=SSL

    Department=CN=www.example.com/emailAddress=youemail@example.com

    Getting Private key

    ```


    What you''ve done is use the openssl command to create a X.509 certificate, using
    the testcert.csr

    cificate request as input, and saved the result as testcert.cert, which is self-signed
    using

    the private key testcert.key and is a valid certificate for 10 years.


    Now that you have both your self-signed server certificate and key, you''ll need
    to copy them both to a

    location that Apache can use:


    ```

    mkdir -p /etc/apache/ssl.crt

    mkdir -p /etc/apache/ssl.key

    ```'
