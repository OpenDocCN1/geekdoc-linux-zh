  md: '# Code Efficiency


    # Releasing Resources and the Peril of Persistent Database Connections


    Again, if you''re using a resource such as a MySQL database connection, and you''re
    finished it but still have a bit more work to do, don''t hog it for yourself for
    the rest of the script''s execution: close.


    Persistent database connections (such as those by mysql_connect()) are sometimes
    used as a means of accelerating performance. This is because after the connection
    is established for the first time, the httpd process that creates it retains it
    after the script finishes it is ready for the next time a script wants to use
    a database connection. Connecting to a database involves a bit of work, it might
    save a bit of time to connect persistently. Faults may develop before the time
    becomes noticeable.


    The problem is that when you connected httpd process may between requests, database
    connections are in limited supply until it dies out its server-managed state.
    Database connections (mysql_close() has no effect on persistent connections).
    It may very well happen if things get busy, a script may attempt to connect to
    a database only to be refused with an error message saying the maximum permissible
    number of connections have already been allocated. If all of those connections
    were in use, wouldn''t be so bad; you''d just have to beef up your database server
    a bit. But if the maximum is reached before httpd processes are sitting on the
    available connections, just in a case requests only that requires the use of one,
    then that is not good.


    # ob_gzhandler()


    If you''re going to use output buffering to buffer your pages'' output, starting
    the buffer with ob_start(''ob_gzhandler'') will mean that when you collect the
    buffered output, you find it compressed. The callback function is polite enough
    to check the headers to make sure the browser knows the output is actually capable
    of reading gzip-compressed data first.


    > As an alternative to using this callback handler (don''t try and use them together),
    consider setting zlib.output_compression in php.ini instead. This is, in fact,
    the recommended method by PHP''s developers.


    # Summary


    While reading through the suggestions and guidelines here, you will not have noticed
    that some appear to contradict each other. This is unavoidable: what works will
    depend on circumstances, and different circumstances require different decisions
    to be made. A site that has a lot of manipulations with a large database has different
    requirements than one that is principally a file repository.


    Your time as a developer is more valuable than the computer''s time as a web server.
    It makes no sense, fundamentally not in terms of job satisfaction, to waste time
    on alterations that, at best, only trial improvements and are invisible to your
    site''s visitors. Instead, invest the time on planning and testing. Step back
    and look at the big picture looking at single lines


    Is your hardware up to scratch, or will it put a cap on how much a software improvement
    will have? How is your web server configured: is there any tuning that could be
    made? How much redundant computation is being performed: can the results from
    one place be cached in anticipation of being useful elsewhere?'
