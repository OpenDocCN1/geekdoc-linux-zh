    # Auth_HTTP


    The purpose of this package is to provide an authentication system akin to Apache''s
    .htaccess login box. It is a simple and easy way to password-protect an area of
    your site. Please note that this is dependent on the more robust PEAR:Auth, which
    is also reliant on the PEAR:DB package, requiring installation of before the Auth_HTTP
    package can run properly.


    Simple usage of Auth_HTTP is follows:


    ```

    <?php

    require_once("Auth/HTTP.php");


    $a = new Auth_HTTP("DB", $mysqli:username=password@localhost/databasename);


    $a->start();

    ?

    ```


    First you include the Auth_HTTP.php, which gives you access to the correct package.
    Then you instantiate a new Auth_HTTP object using the parameters as described.
    Because you are actually using the PEAR:DB package to log to the database, you
    can also alter the type of database you are using and name options such as sockets,
    paths, port numbers, and the like. Although this chapter will be briefly discussing
    this later, a detailed description of the PEAR:DB package can be found at http://pear.php.net/manual/en/package.database.db.php.
    Next you start the authentication process with the call to the start() function,
    and your page is password-protected.


    Granted, this leaves much room for improvement and customization, so you can take
    it one step further and ask the authentication process to look up users from a
    table within a database. You can specify login options through the use of the
    $authOptions variable:'
