  md: '# 13


    # # Content Management Systems


    A Content Management System (CMS) assists a software or Web developer in organizing
    and facilitating any collaborative process and its final outcome. The term “content
    management” loosely refers to not only the checking in out of files, but also
    the generalized sharing of information, such as common calendars, wikis, and the
    like. The earliest Content Management Systems emerged around 1975 when mainframes
    and electronic publishing really began to catch on. These earliest versions were
    basically nothing more than general repositories that enabled multiple users to
    participate in the same project.


    As computers became more and more, the need to effectively manage content also
    becomes more complex. As the Internet came to fruition, so did the wave of CMS.
    Now there are more CMS than you can shake a stick at. The goal of this chapter
    is to try and wade through the muck to help you define whether you need a CMS,
    which variety of CMS is right for your project, and how you can use a CMS to improve
    your efficiency.


    # ## Types of CMSs


    CMS come in all sizes and shapes, and can basically manage anything worked on
    by a team of individuals. From managing simple static website content, to allowing
    collaborative documentation across the Internet (wiki), CMS performs many functions.
    CMS packages can generally be classified into two categories: Enterprise CMSs
    and Web CMSs.


    # ## Enterprise CMSs


    These high-powered software packages are usually comprehensive solutions, delivering
    effective content management for use on an enterprise, or corporate level. They
    are designed to help a corporation become more efficient and cost-effective, and
    increase accuracy and functionality while decreasing human error and customer
    response times.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Chapter 13


    They can integrate corporate functions such as shipping and delivery systems,
    invoicing, employee and human resource issues, customer relations, and document
    management and transactional (sales) systems. Enterprise CMSs bring data management
    down to the level so many users can add their individual view to a large integrated
    piece. Software companies deploying these complex systems pride themselves on
    offering highly customized company-wide solutions, and the software usually comes
    with a relatively hefty price tag.


    # Web CMS/Portals


    Web CMS packages are mostly created for use on the web. They can incorporate numerous
    functions, or have one specific function they are centered around. They allow
    users to update portions of a Web site or collaborate in a “community.” Web CMSs
    can make a developer’s life easy by bringing functionality to a website quickly
    and easily, and allowing a leader to include others in development and maintenance
    without fear of straining the standards. Open Web CMS packages will be the focus
    of this chapter, in particular the PHP/MySQL packages.


    A subset of the Web CMS category is groupware. This type of package runs over
    an intranet or the Internet and is to allow collaboration between users, presumably
    working for the same company, working on the same projects. They typically offer
    features such as project management, file checking in and out, calendar systems,
    email, and internal forums.


    # Open Source Web CMS Packages


    Common functions of a Web CMS:


    +   - Static web page updates: Updates content without altering look and feel
    of site.

    - Weblogs (blogs): Online journals.

    - Wiki: Collaborative documentation projects.

    - Publications: Posting and organization of news articles.

    - Managed learning environments: Web-based learning.

    - Transactional CMS: E-commerce functions.

    - Image and file galleries: Collection of images or files for public use.

    - Forums: Bulletin board systems fostering discussions between users.

    - Chat rooms: Real-time chatting between users.

    - RSS feeds: Allows users to download content.

    - Polls: Allows users to vote on a topic.

    - Calendar systems: Web-based multi-user calendars.


    There are numerous other functions that could be considered underneath the CMS
    realm, but these are the major ones and the ones on which this focuses.


    First, take a look at some of the more comprehensive open source CMS packages.'
