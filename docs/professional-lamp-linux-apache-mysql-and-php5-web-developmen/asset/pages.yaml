    While the RewriteRule and RewriteCond directives deliver a majority of the power
    in mod_rewrite, there are a handful of other key directives that can help you
    control your rewriting and solve problems.


    # RewriteBase


    In most situations, your website URLs will not match your physical file layout.
    The root of your website is almost never located at the root (/) of the file system.
    In normal operation of Apache server, this is not usually a problem; when using
    RewriteRule, it can be very problematic. RewriteBase allows you to use a base
    or prefix for a set of URL rewrites.


    To fully understand the reasoning for RewriteBase, take a look at the following
    example ruleset used to rewrite a simple set of rules:


    ```

    RewriteEngine On

    RewriteRule ^/foo\.html$ bar.html [R]

    ```


    Suppose your web root is served out of the folder of the file system (that is,
    your DocumentRoot is set to /www). If you tried to use the preceding rule in a
    per-directory access file (.htaccess), it would actually result in the request
    being rewritten incorrectly—instead of your expected http://www.domain.com/bar.html
    file returned, you get http://www.domain.com/bar.html. Why is this? Here is a
    simplified version of what is happening internally to Apache:


    ```

    Request: /www/foo.html (local physical path)


    Rewriting:

    /www/foo.html -> foo.html (directory prefix stripped)

    foo.html -> bar.html (RewriteRule applied)

    bar.html -> /www/bar.html (directory prefix re-applied)

    /www/bar.html -> http://www.domain.com/bar.html (domain prefix applied to URL,
    sent to browser)

    ```


    To solve this, simply add a RewriteBase statement to your ruleset:


    ```

    RewriteEngine On

    RewriteBase /

    RewriteRule ^/foo\.html$ bar.html [R]

    ```


    # RewriteLog


    To get a first-hand glimpse of what is actually going on with mod_rewrite, try
    out the RewriteLog directive. You can use RewriteLog to specify a log file where
    a running record of the internal rewrite processing will be sent.


