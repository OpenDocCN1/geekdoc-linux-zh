    # Changing Configuration Dynamically


    You can now check configuration settings and extension properties real-time in
    your code, but something''s not what you like it, what are you going to do? With
    some built-in PHP functions, you can change the way PHP behaves in certain situations.


    # Quotes That Aren''t So Magical


    If you''re like me, you don''t like it if magic_quotes_runtime is enabled, mangling
    the output from every function. While it can be seen as a convenience, it usually
    just gets in the way, and forces you to use stripsslashes() or addslashes() all
    over the place. To change it, you can set_magic_quotes_runtime(). An argument
    of "1" turns on the automatic replacement; a value of "0" turns it off:


    ```

    <?php

    // Turn on magic_quotes_runtime

    set_magic_quotes_runtime(1);


    // Turn off magic_quotes_runtime

    set_magic_quotes_runtime(0);

    ?>

    ```


    Unfortunately, the same cannot be said for magic_quotes_gpc—you cannot change
    its value at runtime (off this later).


    # Removing the Time Limit


    If you find yourself in a situation where a script is running a bit longer than
    PHP will allow, you have two choices: optimize your code so it''s faster, and
    tell PHP to be a more patient. Perhaps you''ve already optimized your code as
    much as you can, and the default 30-second timeout is still too quick.


