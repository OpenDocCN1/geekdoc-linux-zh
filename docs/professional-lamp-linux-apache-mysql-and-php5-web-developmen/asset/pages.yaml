  md: '# Apache Tricks


    # RewriteCond


    The RewriteCond directive behaves much like PHP''s if () statement: it tests a
    string against a pattern or condition. If the input matches the pattern or string,
    the RewriteRule immediately following the RewriteCond directive is processed.
    The general format for RewriteCond is as follows:


    ```

    RewriteCond TestString CondPattern

    ```


    TestString is the string you are evaluating, and CondPattern is the regular expression
    or comparison value to check against.


    # RewriteCond Usage


    The most common way to RewriteCond is to match the input string against a regular
    expression, similar to RewriteRule. However, when you use RewriteCond, you have
    access to a good number of server variables, so your input string can be more
    complex than a filename match. The following tables list the server variables
    available to use in RewriteCond.


    The following are the HTTP Header variables:


    | HTTP_USER_AGENT | A string the browser''s identifying information, such as:
    Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; SV1; .NET CLR 1.1.4322 |

    | HTTP_REFERER | The previous page visited by the user, as reported by their browser
    |

    | HTTP_COOKIE | Any cookie string that was part of the request |

    | HTTP_FORWARDED | Contains any forward information if the request is handled
    by a proxy server |

    | HTTP_HOST | The hostname as referenced in the request |

    | HTTP_PROXY_CONNECTION | The contents of the HTTP Proxy-connection header |

    | HTTP_ACCEPT | Returns the Accept header value; indicates what kind of content
    the browser can handle, and what types take precedence |


    The following are the Request variables:


