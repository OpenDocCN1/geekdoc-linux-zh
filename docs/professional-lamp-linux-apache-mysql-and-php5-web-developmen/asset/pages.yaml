  md: '# Chapter 4


    One of the first things you need to do when configuring a database for the real
    world is set up any accounts that might be needed by any users, or the system
    itself. In order to set up specialized access for a user in your database, you
    need to know about the different levels for which MySQL can control access. MySQL
    4.1 differentiate four levels in permissions: the global level, database level,
    table level, and column level.


    Global-level privileges are the most powerful and apply to all the databases running
    on an instance of MySQL. Normally such privileges are reserved for administrator
    accounts, as it is a rare occasion when an application or end user will require
    access to all of the database server''s operation.


    Database-level privileges apply just like they sound—at the database level. Database-level
    access is often used by the administrator of a specific database or application,
    and has the ability to give the user complete control over one specific database
    as.


    Table-level privileges apply on a per-table basis. You can create or remove access
    for a user on a specific table or set of tables. Level of access control is often
    used when configuring a database to be accessed directly by an application—the
    application only needs kinds of access on each table, and no more.


    Column-level privileges are the finest level of control that MySQL provides. As
    you might expect, it controls the access to a specific column or columns within
    a given table.


    # Using GRANT


    Now that you understand the varying scope of the MySQL access system, it''s time
    to look at how to actually control the privileges.


    To create and add privileges to user accounts, MySQL gives you the GRANT command.
    The GRANT command is relatively simple to use, as long as you know what access
    you''re granting, and to whom. The GRANT command has the following generalized
    syntax:


    ```

    GRANT [privileges] ON [resource] TO [identity]

    ```


    Let''s take a second to dissect GRANT. The first part of the command, GRANT [privileges]
    is where you specify what privileges to allow on the resource (specified later).
    Some of the most common privileges you can use are shown in the following table.


    | Privilege | Provides |

    |---|---|

    | ALL {PRIVILEGES} | Sets simple all privileges except GRANT OPTION |

    | ALTER | Allows use of ALTER TABLE |

    | CREATE | Allows use of CREATE TABLE |

    | DELETE | Allows use of DELETE |

    | DROP | Allows use of DROP TABLE |

    | INDEX | Allows use of CREATE INDEX and DROP INDEX |

    | INSERT | Allows use of INSERT |

    | SELECT | Allows use of SELECT |'
