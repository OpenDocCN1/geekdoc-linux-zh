    One is that supplied 21-digit filename could have an extension attached to indicate
    the desired format, rather than remain fixed on PNG generation. Others include
    a more realistic (or at least flexible) storage mechanism which users control
    through a fully-developed URL including hostnames and paths. Consider the possibility
