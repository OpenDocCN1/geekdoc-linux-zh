  md: '# 5 PHP Configuration


    When you work with LAMP technologies, there are very few things that influence
    your coding decisions more than how PHP is configured. The backbone of any PHP
    installation is the configuration file, php.ini. The settings in this file can
    greatly affect how you code your applications, how well the servers perform, and
    how secure it is. This chapter tells you what settings to look for and change
    in order to improve your PHP installation and provides you with a set of scripts
    to automatically prepare your PHP environment and configuration settings to your
    liking.


    # Modifying php.ini


    As mentioned previously, the php.ini file is your primary tool for configuring
    your PHP installation. This section covers a number of the configuration directives
    you should set, and several that are new with PHP5.


    # Recommended Configuration Directives


    When you configure PHP, there are a number of settings to keep in mind, in order
    to keep your system secure and performing at top speed:


    +   * register_globals = off: One of the most common problems with moving older
    PHP to a new system is how PHP handles data and variables. In older versions of
    PHP, fields were automatically converted into global variables that shared the
    same name with the PHP engine. While some found this convenient, eventually became
    a security risk because of naming and usage confusion. Since PHP 4.2.0, the value
    for register_globals was off by default. You should keep this set to off, and
    use the $_GET, $_POST, and $_COOKIE superglobals, instead of relying on the automatically
    created variables.


    When you deploy your applications, it is especially imperative to keep register_globals
    set to off, as you can''t always be sure of the settings of any production servers
    where it might end up.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Chapter 5


    display_errors = off: While not necessary and actually a burden in a development
    environment, it''s a good idea to set display_errors to off for any PHP applications
    on a production or web server. Turning display_errors off prohibits PHP from displaying
    any parse or runtime errors to the user''s browser. Your end-user sees no insight
    into the inner workings of the application, which could be helpful to many individuals
    who wish to attack your server.


    In a development or debugging situation, it''s perfectly acceptable to leave display_errors
    on, but with debugging.


    log_errors = on: This setting, usually used in conjunction with display_errors,
    tells PHP to log all errors to a file for later analysis or use your choice of
    tools to regularly and notify the webmaster.


    error_log = filename or error_log = syslog: The error_log directive tells PHP
    where to send errors when log_errors is enabled. You can specify a filename where
    PHP either writes, or use syslog, and it will send errors to the system logging
    daemon.


    error_reporting = E_ALL: This directive simply tells PHP to report all errors,
    warnings, and notices encounters. This is usually a good idea, especially during
    development, as it can help you track uninitialized variables and other code gaps.


    magic_quotes_gpc = off: The magic_quotes_gpc directive tells PHP whether it should
    automatically escape input/data when a script is loaded. While this is intended
    as a safety-saver, it could cause problems if you decide to switch databases,
    or use a database that doesn''t escape special characters with a backslash. If
    you think you might one day switch databases, use a currently database environment
    or no database at all, it''s a good idea to set this to off.


    variables_order = ''GPCS'': Setting variables_order normally holds environment
    variables—namely when generate the $ENV variable variables_order is set to GPCS.
    This is recommended for performance reasons only, and if you still need to access
    variables, you can use the getenv() function.


    allow_call_pass_reference = off: This directive might not affect all code, but
    it can keep your code from becoming obsolete by a future version of PHP. allow_call_pass_reference
    = off prevents you from forcing function arguments to be passed by reference.
    If you pass an argument by reference (using the & prefix) when it is set off,
    a warning will be generated. While not currently a critical issue for production
    servers, it''s good setting to use the standard PHP tags to ensure they are compatible
    with future versions of PHP.


    asp_tags = off: Although this is not normal on most setups, asp-type tags (<?php
    ?> can eventually become a problem if you move an application to a server that
    has a different setting for asp_tags. It''s not a critical requirement, performance
    issue, or security problem, it''s a good idea to keep asp_tags set off during
    development in order to avoid code compatibility issues.


    short_open_tag = off: Like setting asp_tags to off, setting short_open_tag to
    off also ensures your applications will work universally across different servers,
    instead of being broken by a simple configuration difference.


    106'
