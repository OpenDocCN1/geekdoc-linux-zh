  md: '# Chapter 13


    Banning System: Allows you to easily ban users.


    User Features: Allows users to bookmark, keep track of files, send messages to
    other users, and other actions.


    # Customizing the Default Installation


    The Admin section of the site has several subsections for customization. They
    are:


    +   Features: This section is where an admin can activate and deactivate features,
    and alter the general-layout of the site.


    +   General Preferences: Here, you can change themes, change your homepage or
    create a custom, set the language preferences, set the OS type, change the PHP
    reporting level, set custom messages for when site is down, limit the number of
    users and load, set caching preferences, where new links will open, control whether
    all groups see all modules, whether or not admin pageviews are counted in all
    sets, alter menu displays, set server configurations, session preferences, management
    date/time formats, and change the admin password.


    +   User Registration and Login: This area is dedicated to controlling every aspect
    of the user registration and login process, from authentication to password requirements,
    HTTP/S settings, and even for the PEAR:Auth module by TikiWiki.


    +   Enabled Feature Configurations (e.g., Wiki): For the various features you
    have enabled with the Features section, you will have access to those individual
    sections to further customize your settings. Wiki was the focus of this project
    early on, this area of the Admin site offers an incredible amount of control,
    customizability, and functionality. In a nutshell, you can dump, restore, and
    attach files, control database and comment settings, export, configure link formats
    (dates, links, status, and more) and set what information is retained for the
    Wiki documentation (version control, user data, dates). You can also manage copyright
    protection, Wiki history, and configure features you have the ability to turn
    on and off include:


    +   Mail-in


    +   Sandbox


    +   Last Changes


    +   History


    +   Rankings


    +   Undo


    +   Multrint


    +   PDF Generation


    +   Comments


    +   Spellchecker


    +   Warm on Edit Conflict


    +   Individual Cache


    +   Footnotes'
