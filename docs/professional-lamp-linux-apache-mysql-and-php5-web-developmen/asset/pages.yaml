  md: "# Chapter 6\n\n# Apache as a File Repository\n\nOne of the cooler things you\
    \ can do with Apache is use it as a simple online file repository, with WebDAV.\
    \ WebDAV, which stands for Web-based Distributed Authoring and Versioning, enables\
    \ Apache to allow users to treat an enabled directory as a remote directory or\
    \ drive on their own computers. Similar to Windows shares or NFS export, WebDAV\
    \ allows remote editing and storage access, using HTTP as the transport layer\
    \ instead of a specialized TCP protocol or port like SMB and NFS.\n\nTo understand\
    \ how WebDAV works as a shared drive, it's easier to see it in action, you're\
    \ going to enable mod_dav, which ships with Apache, and test it out. Then, with\
    \ other modules, check to see if mod_dav is already statically compiled into Apache,\
    \ or existing as a loadable module:\n\n```\n/path/to/httpd -l\nls /path/to/apache/modules\n\
    ```\n\nAs you might have guessed, if you don't see mod_dav.c in the httpd -1 output,\
    \ or mod_dav.so in the file list, you'll need to build it yourself with the Apache\
    \ source code. To add mod_dav statically into the Apache binary, make sure that\
    \ --enable-dav and --enable-dav-fs exist in the configure command:\n\n```\n./configure\
    \ \\\n  --enable-dav \\\n  --enable-dav-fs \\\n  # ...and any other configure\
    \ settings you use\n```\n\nTo build mod_dav as a shared object, just add shared=\
    \ to the end of dav-related lines:\n\n```\n./configure \\\n  --enable-dav=shared\
    \ \\\n  --enable-dav-fs=shared \\\n  # ...and any other configure settings you\
    \ use\n```\n\nThen build the new binary and modules using make and make install.\n\
    \nIf you decided to use the dynamic modules for mod_dav, you need to enable them\
    \ in httpd.conf, using the following lines:\n\n```\nLoadModule mod_dav    modules/mod_dav.so\n\
    LoadModule mod_dav_fs    modules/mod_dav_fs.so\n```\n\nTo have a place to actually\
    \ store the WebDAV file repository, you can create a new directory, or use an\
    \ existing directory of your choice. You should place your WebDAV folders inside\
    \ your SSL-enabled web root, or make sure SSL later, if you plan to use Basic\
    \ Authentication to limit access to the WebDAV folders. Basic Authentication sends\
    \ usernames and passwords in clear, so you want want SSL-protected directories\
    \ to encrypt the Basic Auth requests. Create the new folders if needed, and create\
    \ a dummy file to add to the WebDAV folder:\n\n```\nmkdir -p /wwwssl/dav\necho\
    \ \"Testing DAV\" > /wwwssl/dav/testing.txt\n```\n\n158"
