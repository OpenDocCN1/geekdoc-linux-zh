  md: "```\n// Check if using valid credentials\nif (!isset($_SESSION['username'])\
    \ ||\n    isset($_SERVER['PHP_AUTH_USER']) &&\n    check_login($_SERVER['PHP_AUTH_PW'])))\
    \ {\n    // Show login prompt\n    attempt_auth();\n    echo 'Authorization Required';\n\
    \    exit();\n}\n?>\n```\n\nTo test out the PHP authentication, you could simply\
    \ attempt to load this script in your browser, but it's much better if you include\
    \ it in the same level of the script, or PHP page you've created. You can use\
    \ the following code to test out this authorization as a simple inclusion:\n\n\
    ```\n<php\nrequire_once 'phpauthbasic.php';\necho 'Authentication Successful!';\n\
    ?>\n```\n\nWhen you try to load this script in your browser, the testuer/testpass\
    \ combination, or what you originally added to the Users table. If the username\
    \ and password are correct, you should see a nice \"Authentication Successful!\"\
    \ message; if you click Cancel, you'll get the \"Authorization Required\" message.\n\
    \nNow that you've seen it, you might think there's reason not to use this method.\
    \ But with many of the choices you'll make when deciding how to write your applications,\
    \ this method has some drawbacks.\n\nThere are two main requirements that must\
    \ be fulfilled before this authentication method will work. First, safe_mode must\
    \ not be enabled in php.ini. When enabled, safe_mode prevents the creation of\
    \ PHP_AUTH_USER and PHP_AUTH_PW server variables. If those variables don't exist,\
    \ the script will redisploy the login prompt until the clicked Cancel, regardless\
    \ of whether the credentials were used truly. A valid way to determine if safe_mode\
    \ is indeed enabled: the uid of the script is added to the end of the realm intend\
    \ in the login prompt.\n\nSecond, this method cannot be used in conjunction with\
    \ Apache's Basic Authentication system. It applies to any Apache-protected access\
    \ (htaccess) at the same level of the script, or to any parent directories. If\
    \ both authentication systems are enabled, the Apache system takes initial precedence.\
    \ What happens is the user can log in initially using the credentials valid with\
    \ the Apache basic authentication, which is followed by the PHP authentication\
    \ prompt. At this point, PHP has effectively cleared the browser's authentication\
    \ state with the Apache controls – a result of the HTTP 401 response. Because\
    \ the browser is no longer authenticated against Apache, it will re-prompt for\
    \ the Apache-level credentials, and then go back to the PHP credentials, and so\
    \ on, until the user clicks Cancel or Stop in their browser."
