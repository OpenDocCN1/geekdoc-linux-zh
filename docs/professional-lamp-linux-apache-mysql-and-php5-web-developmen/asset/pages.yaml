  md: "# Chapter 5\n\n# Automated Version and Feature Checking\n\nKnowing the various\
    \ ways to evaluate and change settings at runtime is helpful, but it can be a\
    \ pain trying to ensure a constant environment across systems and applications,\
    \ in all scripts or pages. One possible solution is to take all of your version\
    \ and extension checks, put them in your own script, and require that script at\
    \ the top of each of the pages. This method works fine, but keeping that script\
    \ updated can quickly become a chore. In this next section, you'll take a look\
    \ at a variation of a simple environment-checking script—one that uses easily\
    \ modifiable configuration file, and takes only a few lines of code to call.\n\
    \nThis set of scripts consists of three main blocks of code and one simple configuration\
    \ file. To begin, have look at the configuration file, in this example, called\
    \ reqs.xml:\n\n```\n<requirements>\n  <packages>\n    <package name=\"gd\" />\n\
    \    <package name=\"mysql\" />\n    <package name=\"pgsql\" />\n  </packages>\n\
    \n  <environment>\n    <setting name=\"register_globals\" value=\"off\" />\n \
    \   <php version=\"5.0.0\" />\n  </environment>\n</requirements>\n```\n\nIf you've\
    \ had experience with XML, you'll recognize this as a simple set of tags to establish\
    \ the site configuration. Wrapped inside the main enclosing <requirements> tags,\
    \ there are two main sections.\n\nThe first section, <packages></packages>, holds\
    \ a list of all and extensions that are required for your application. Each extension\
    \ is specified by a <package /> empty tag, with the attribute name=\" specifying\
    \ the name of the extension. The name of the extension should match the name returned\
    \ by get_loaded_extensions(), mentioned earlier.\n\nThe second section contains\
    \ define specific application settings, by default in php.ini, and each <setting>\
    \ tag can correspond to a PHP runtime configuration setting. The names=\" attribute\
    \ matches the configuration setting, and the value=\" holds any value that would\
    \ be used in php.ini. The <php /> tag allows you to specify version requirements\
    \ for the application—a minimum version is specified in the minversion=\" attribute,\
    \ and a maximum version in a corresponding maxversion=\" attribute (not shown).\n\
    \nIn this example of reqs.xml, the GD, MySQL, and PostgreSQL extensions are listed\
    \ as required, the minimum version of PHP allowed is 5.0.0, and the register_globals\
    \ directive must be set to off.\n\nSpecifying the minimum version of 5.0.0 in\
    \ this example is technically unnecessary—the class structures that will run only\
    \ on PHP 5.0 and later because of the different object models.\n\n116"
