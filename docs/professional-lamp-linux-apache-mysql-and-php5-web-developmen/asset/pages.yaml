  md: '# Chapter 7


    # # Website Attacks


    Whenever you publish a site out in the Public Internet, it runs the risk of being
    attacked. While no application can be truly 100% secure, as new exploits and hacking
    techniques are being discovered daily, there are a couple categories of attacks
    that you can easily defend against in your PHP scripts.


    # ## Abusing register_globals


    If it hasn''t been driven into your brain by every article, book, or by any documentation
    that talks about register_globals, here it again: having register_globals set
    to on is a disaster waiting to happen.


    If you''re unfamiliar with register_globals, it is a setting in php.ini that controls
    the auto-population of variables with the same name as form elements or cookies.
    In the login form you created earlier in the chapter, there was a field called
    username. Normally, with register_globals disabled, the only way to access the
    username field from the form after it''s posted is to use the $_POST or $_GET
    array, depending on the method of the form. When register_globals is enabled,
    the username field is accessible using $_POST or $_GET, but also as $username.


    Since PHP 2.0, the default value for register_globals is off, but often webs will
    re-enable register_globals to provide compatibility with older scripts that assume
    the existence of, and rely on, register_globals=on. Unfortunately, this provides
    a premium attack of malicious users. When register_globals is enabled, PHP evaluates
    the environment, form, cookie, and server variables in the order specified in
    the variables_order setting. If the server is using the "recommended" settings
    file, the GET variables are set first, and then POST is set and matching GET values
    are overwritten. Next the cookie values are set, followed by overwriting any matching
    previously.


    While this behavior seems convenient, it is easily exploitable using a cloned
    form or spoofed cookie information. For an example of how it might be exploited,
    take a look at the following PHP code:


    ```

    <php

    if (user_is_admin()) {

    $access_level = 10;

    }

    show_menu($access_level);

    // ... and so on

    ?>

    ```


    In this hypothetical scenario, the script calls a user_is_admin() function to
    determine if the user is an administrator. If so, the $access_level variable is
    set to 10, and presumably a complete administration would be displayed in the
    script that follows.


    If register_globals is enabled, it''s a trivial matter of requesting the file
    and appending your desired access level to the query string, like this:


    ```

    http://www.example.com/file.php?access_level=10

    ```'
