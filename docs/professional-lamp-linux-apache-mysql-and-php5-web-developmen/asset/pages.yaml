  md: '# Site Security


    Now, if the script is called with access_level added, it doesn''t matter if the
    user is truly an

    administrator or not — the access_level variable will be set to 10 automatically
    when the script

    beg, with register_globals and PHP not preventing variable initialization.


    Luckily, it''s relatively easy to avoid such pitfalls. Make sure you use register_globals
    disabled,

    use the proper $_GET and $_POST superglobals, initialize possibly unsafe variables,
    and make sure

    error_reporting is set to E_ALL when developing and testing the state.


    If you cannot register_globals in php.ini, you can use an .htaccess file to turn
    it off, if prop-

    erly enabled in Apache:


    ```

    php_flag register_globals off

    ```


    # SQL Injection Attacks


    Another dirty-data attack, with a far higher potential for damage, is the SQL
    Injection Attack.

    In conjunction with a register_globals attack, or just using a normal web form,
    SQL injection\attacks are simply the insertion of malicious SQL statements in
    the place of what should normally be

    innocuous data.


    SQL injection preys on a lack of input scrubbing and data validation — data that
    is blinded by a

    PHP-built SQL query. Take the following example that would access the WebAuth
    database you created

    er in the chapter:


    ```

    <php


    $username = $_POST[''username''];


    $conn = mysqli_connect(AUTH_DB, AUTH_USER, AUTH_PASS);

    mysqli_select_db(AUTH_DB, $conn);


    $sql = ''SELECT * FROM Users WHERE username=\'' . $username . ''\'''';


    mysqli_close($conn)


    ?>

    ```


    Looks harmless, right? You''d expect it to take whatever username was sent from
    the

    form and look up all columns to that specific username. The problem with this
    code lies in the

    SQL query. Notice how the $username variable is not validated, scrubbed, or prepared
    in any way

    sending it to the database. Under most circumstances, you might not notice anything
    wrong,

    it and would rarely if there ever an error.


    However, turns thing nasty quickly, when the following value is entered in the
    username field of the

    sending form:


    ```

    ; DELETE FROM Users; SELECT ''Own3d'' AS username FROM Users WHERE ''=''''

    ```


    Look carefully at what is going on with this value. It begins by terminating the
    part of the query before

    t $username variable is appended, deletes all information from the Users table,
    and performs a

    query of the attacker''s choosing, just to close out the query and match up the
    final apostrophe.


    # 179'
  merge: -1
