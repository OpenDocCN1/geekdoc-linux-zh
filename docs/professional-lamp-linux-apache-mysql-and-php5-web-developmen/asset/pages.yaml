- img_proc: true
  md: "The second part of the property definition, property_name is simply the name\
    \ that you want the property to have.\n\nFor example, say you wanted to create\
    \ a class named Circle. You might want to have a public property to hold the radius,\
    \ like so:\n\n```\nclass Circle {\n    public $radius;\n}\n```\n\nAdditionally,\
    \ you can specify an initial value for the property in its definition. Suppose\
    \ you wanted to have the initial radius of your Circle set to 10; you might do\
    \ the following:\n\n```\nclass Circle {\n    public $radius = 10;\n}\n```\n\n\
    Then, each time a Circle object is created, it will start out with an initial\
    \ radius of 10.\n\n# Methods\n\nYou've created properties to hold your data inside\
    \ objects, now you need to create a way to act on that data. To perform these\
    \ actions, you'll create functions inside the class, called methods.\n\nDefining\
    \ a method in PHP is very similar to creating a standard function elsewhere in\
    \ your code:\n\n```\nvisibility function function_name(parameters) {\n    // method\
    \ implementation here\n}\n```\n\nSimilar to the property definition, method definitions\
    \ require a visibility component. Aside from the visibility prefix, methods are\
    \ defined identically to standard PHP functions — simply use the function keyword,\
    \ followed by the name of the function, the optional parameter list inside parentheses.\n\
    \nUsing the Circle example again, you'll add a method to calculate the area of\
    \ the circle:\n\n```\nclass Circle {\n    public $radius;\n\n    public function\
    \ calcArea($radius) {\n        return pi() * pow($radius, 2);\n    }\n}\n```\n\
    \nYou simplyve created a method calcArea() that takes a parameter $radius, and\
    \ returns the area of a circle with the given radius.\n\nNow that you've created\
    \ these properties and methods, you're going to need a way to actually use your\
    \ properties and methods. Enter instantiation."
