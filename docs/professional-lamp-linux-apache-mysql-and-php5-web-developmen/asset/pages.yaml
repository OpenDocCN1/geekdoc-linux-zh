  md: '![](img/10ee3a571ee375148aad73be8f1cd0d0_373_0.png)


    # Alternative Tools


    Whenever discussions of popular PHP tools spring up, the conversations usually
    center around text editors or coding IDEs. Which has the best language support,
    syntax highlighting, code parsing, and so on? Unfortunately, with all the focus
    on text editors, excellent non-coding tools can sometimes get neglected. Instead
    of rehashing the usual arguments for one editor versus the other, this appendix
    shows some of the tools you can use in your development cycle—those that don''t
    immediately churn out code, but those that you might hold a key position in the
    overall development process.


    # MySQL Tools


    When you administer a MySQL database, you usually have two main options for administration
    tools: the standard command-line tool, or a graphical interface. Despite the attitudes
    of many hardened system administrators, there''s absolutely nothing wrong with
    using a graphical tool to get the job done. Although the command-line interface
    offers unlimited control over the database, it just''t match the speed and clarity
    of a graphical user interface to help facilitate your workflow.


    If you''re looking for a good set of GUI-based MySQL administration tools, you
    will need no further than MySQL AB''s own MySQL Administrator and MySQL Query
    Browser.


    # MySQL Administrator


    MySQL Administrator is a feature-rich GUI administration tool or maintaining MySQL
    databases. The main interface is shown in Figure B.1.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Appendix B


    ![](img/10ee3a571ee375148aad73be8f1cd0d0_374_0.png)


    Figure B.1


    +   - View real-time server information, including connection information and
    statistics, memory statistics, the value for MySQL internal variables and configuration
    settings, and more.

    - View the different server logs: Error log, Slow log, General Log (localhost
    only).

    - Control the MySQL process itself (localhost only).

    - Perform backup and restore operations, and even periodic backups.

    - Administer the server’s user access and privileges.

    - Create and edit complete databases, including tables using the built-in MySQL
    Table Editor.


    MySQL Administrator is available for Windows, Linux, and Mac OS X; MySQL Administrator
    is a free download from the MySQL website: http://www.mysql.com/products/administrator/'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# Alternative Tools


    # # MySQL Query Browser


    MySQL Query Browser is a GUI that allows you to test and run queries against the
    MySQL database. In a sense, it is a beefed-up GUI version of the command-line
    client, as you can see in Figure B.2. You can also use MySQL Query Browser similar
    to a standard spreadsheet program or desktop database application—you can pull
    rows of data, and edit them directly in the query browser—just typing in and executing
    queries, and manipulating data, it also includes the MySQL Table Editor found
    in MySQL Query Browser, allowing you to visually create and edit databases and
    tables.


    ![](img/10ee3a571ee375148aad73be8f1cd0d0_375_0.png)


    Figure B.2


    Windows, Linux, and Mac OS versions are available from MySQL http://www.mysql.com/products/query-browser/


    So you''ve got your applications up and running, and your servers tweeted for
    peak performance. But are your database queries lean and mean as they can be?
    The only way to know for sure is to use a benchmarking tool.'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# Appendix B


    Most MySQL benchmarking tools perform in roughly the same way: you provide a query
    to run, and runs said a large many number of times, often with concurrent connections.
    By thoroughly testing and experimenting with some of your "heavier" queries (often
    found in the MySQL slow query log), you can improve the execution times and server
    load at bottlenecks.


    # MySQL Super Smash


    Originally developed by Sasha Pavlov, MySQL Super Smash is a standalone stress-testing
    tool for use with MySQL and PostgreSQL. MySQL Super Smash takes one or more files
    containing queries, and hammers the target database predefined number of times
    for each query, with a specific number of concurrent connections.


    MySQL Super Smash is available at http://vegan.de/tony/supersmash/.


    # MyBench


    MyBench is a Perl-based benchmarking tool created by MySQL query Jeremy Zawodny.
    Like MySQL Super-Smack, it can be used to send a barrage of connections and queries
    at a target MySQL machine, and give clear results on how well it stood to the
    attack. Since it is written in Perl, you can easily modify and extend it as you
    use. The downside is that a large batch test can hog resources, so it''s best
    to run this on a different machine than the target MySQL server, to avoid tainting
    of the results.


    MyBench is available at Jeremy Zawodny''s site: http://jeremy.zawodny.com/mysql/mybench/


    # Version Control


    You might want to consider some form of version control system in your development
    lifecycle or workflow, if you haven''t already. Version control systems provide
    a way to store historical snapshots of code during development, and allow multiple
    developers to check files in and out of the repository, controlling the evolution
    of the codebase. Two of the most popular open-source version control systems used
    today are CVS and Subversion.


    CVS and Subversion are each version control systems that support the same basic
    features: historical records of files, and multiple developer support with check-in/check-out
    functionality. CVS has been around since 1989, and is the perennial favorite among
    many developers. Subversion is newer to the scene, appearing late 2000, but it
    is giving deivens because of its feature set, which extends beyond the "standard"
    functionality found in CVS. Features such as atomic commits, "safe" file renaming,
    file directory copying, and WebDAV support are the reasons that many developers
    are going with Subversion these days. If you are looking for a robust feature
    set with good support both client- and server-side, Subversion is probably your
    best bet. If you''re looking for stability, track record, and support built-in
    to many development tools, CVS is probably preferable—although more and development
    packages are gaining Subversion support lately.'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# Alternative Tools


    Whichever you choose, it''s a good idea to get some sort of version control in
    place when you can—it makes multiple-developer projects easier to manage, and
    can provide a safety net in case new code actually causes new bugs or regression
    problems.


    CVS is available at https://www.cvhome.org/.


    Subversion is available at http://subversion.tigris.org.


    # UML Tools


    If you get deep into the realm of system architecting and design, changes are
    you will cross paths with UML at some point. It is a way to model and represent
    the structure, behavior, architecture, and process flow of an application or other
    system. You can use UML to diagram different aspects of a system or application,
    including the class structure, user interaction, object interaction, process flow,
    and so on, similar to flowcharts and other diagrams you make with Visio, Kivio,
    or other related tools.


    There are nine diagram types in UML, but from the developer''s point of view,
    one of the most important is the Class diagram. Class diagrams help you plan your
    various classes, and the relationships between classes.


    If you use UML in your PHP workflow, you have a couple tools at your disposal
    — some popular free tools are ArgoUML and Umbrello.


    # ArgoUML


    ArgoUML is a Java-based UML editor created by the Tigris community. It supports
    eight of the major UML diagram types, and can help you quickly plan your objects,
    relationships, and behaviors. One of the main features of ArgoUML, from a PHP
    developer''s point of view, is that it can generate PHP5 class skeletons from
    UML class diagrams automatically (as well as C#, Java, C++, and PHP?), as shown
    in Figure B.3.


    You simply create your class diagrams in UML and tell ArgoUML what and where to
    generate the code, saving you the time of typing the structure of the classes,
    and letting you get on to the meat of the code: the implementation. ArgoML also
    provides machine-generated suggestions regarding your class structures, and features
    an integrated-to-do list.


    ArgoUML is available as a desktop Java application, both downloadable and runnable
    from the Internet via WebStart, http://argouml.tigris.org.


    351'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Appendix B


    ![](img/10ee3a571ee375148aad73be8f1cd0d0_378_0.png)


    Figure B.3


    # # Umbrello


    Umbrello is another UML diagramming application, much like ArgoUML. Umbrello is
    now part of the KDE developer tools package, and supports many of the UML diagram
    types, including Class diagrams, Use Case diagrams, State diagrams, and Sequence
    diagrams. As of version 1.4, Umbrello can generate PHP5 class skeletons, as well
    as code for several other programming languages, as shown in Figure B.4.


    352'
