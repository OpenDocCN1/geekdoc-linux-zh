  md: '# Chapter 13


    # Strengths and Weaknesses


    The strengths for this package are:


    +   - Changing the layout and placement of the modules proves to be an easy task
    WYSIWYG in nature. In addition, you are able to break the traditional two- or
    three-column layout and add subcolumns to all three traditional columns.

    - Text modules keep track of revisions, and allow you to immediately view or restore
    old versions with one click. It would be nice if it showed who made the revision,
    but perhaps that feature will be available in future releases.

    - The Preview feature lets you see what changes have the look of the site, without
    having to log out as an admin.

    - Themes are a bit more esoteric and design-driven, as opposed to being function-driven
    as is some other CMSs.


    One weakness is user administration—the admin can''t see all the permissions or
    responsibilities of an individual user. For example, if Bob is going on vacation,
    and you wanted to assign Bob''s modules to someone else, there is no way to see
    what Bob has the ability to do and what he can modify.


    There is a reason CMS is on Sourceforge''s Top 10 "Active" download. ExponentCMS
    is by far the easiest to administer open source CMS out there. Its strengths are
    behind-the-scenes, as its focus is not necessarily interactivity with the masses
    visiting the site, but on a core group of contributors who have the admin control.
    If you''re in search of a good-looking "out of the box", ExponentCMS should be
    on your list to evaluate.


    # XOOPS


    XOOPS (extensible Object Portal System) is another popular comprehensive CMS available
    at Sourceforge, or at http://www.xoops.org. The most recent version is 2.1, and
    that is the version being discussed (this is actually a pre-release to version
    2.2, so keep that in mind).


