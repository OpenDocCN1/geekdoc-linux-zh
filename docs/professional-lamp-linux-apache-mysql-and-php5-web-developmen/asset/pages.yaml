    # Web Server Improvements


    By its nature, Apache is highly configurable, with many settings that can be tweaked
    to optimize one aspect or another of its behavior. Reduce the amount of Apache
    requests, while others have the aim of reducing the amount of work carried out
    by each process.


    When you start Apache, the first thing it does is start up half-dozen (the exact
    number is, of course, instances) of httpd These are the processes that actually
    handle HTTP requests. The server itself manages them, starting new ones and stopping
    ones as needed. Each instance uses about a megabyte of RAM (it''s hard to be more
    exact, but this is a reasonable heuristic), and sits waiting for a request. If
    there are more requests being made than there are instances, then new ones will
    be started, and if things go quiet later, the excess will be shut down. Occasionally
    an instance of httpd will be shut down even if there is sufficient work available.
    This allows the system to recover memory that may have leaked from either the
    httpd process itself or any of the modules it was using. And of course it is possible
    for an http process to simply crash, in which case that particular request will
    fail; then another instance will be on standby to save the request. This is tried
    why Apache operates in this way: it enables the server to keep running after it
    has crashed.


    The configuration options that control are found in or can be added to httpd:


    +   MaxClients: This is the maximum number of httpd processes you''re prepared
    to support at any one time, the maximum number of client requests being handled
    concurrently. Given the 1MB-per-process heuristic, there is little sense setting
    the amount of RAM you have. In fact, you''ll run out of RAM before this. They
    will continue to awk, but they''ll be relying on virtual memory to do it, and
    there''ll be an awful of tiresome swapping between the disk and RAM.


    You don''t want setting this to be too low; if there are more requests being made
    than this, some will miss out and end out waiting for one of the others to complete.
    If the delay is long, the client will give up and the request will be reported
    as a failure.


    +   MaxRequestsPerChild: Once an instance of httpd has shut down, in case unused
    memory exists in the server or installed modules that would cause the instance
    to fail to prey on. By definition, the operating system will not realize the size
    is increasing, Apache must shut to start a process. This directive controls what
    happens. Unless you''re using an experimental or under-development module that
    is likely to be buggy, you should be able to set this to 100,000 without ill effect.
    Monitor the RAM consumption of each httpd process with top; if they seem to be
    growing unchecked, reduce the limit by a factor of 10. Continue to monitor and
    as necessary. Keep an eye on the behavior of the system as a whole, if this figure
    drops too low, then there will be too much time wasted in starting and stopping
    child requests, and it is therefore for you to try and isolate the module causing
    the problem.


