  md: '# Apache Tricks


    ```

    RewriteEngine On

    # Ensure numeric values for the page

    RewriteRule "article/([0-9]+)/? article.php?page=$1

    RewriteRule "article/([0-9]+)/? article.php?page=1

    ```


    The first RewriteRule checks for any valid URLs in translates the given request
    to the call to the PHP script. The second RewriteRule is set up to catch malformed
    URLs calling for article, but giving an invalid value for the page number. Any
    such request-autmatically assigned first page in the article.


    There are two things to note in the previous set of RewriteRules. First, all rules
    are processed in-processing not stop at the first rule, but continues through
    all rules. Second, the redirection to the article.php script is handled internally
    — no HTTP redirect/moved status code is sent to the client at all. In order to
    alter these default behaviors, can use a set of flags at the end of each rule.


    # RewriteRule Flags


    In order to control the ways mod_rewrite handles and processes each RewriteRule,
    you have a set of 15 different flags that you can add following each rule. Each
    flag is contained within brackets, which-ple flags can be provided in a comma-separated
    list–all within brackets. For example:


    ```

    # Rewrite /category/item/ to catalog.php

    RewriteRule ^(\w+)/(\w+)/$ catalog.php?cat=$1&item=$2 [NC,R]

    ```


    # nocase|NC


    Similar to the i in PHP''s PCRE syntax, the nocase flag makes the pattern case-insensitive.
    For example, the following two patterns are:


    ```

    RewriteRule ^([A-Za-z-]+)/$ catalog.php?cat=$1

    RewriteRule ^([a-z]+)/$ catalog.php?cat=$1 [NC]

    ```


    # redirect|R[=]


    Normally mod_rewrite uses an internal Apache redirect when rewriting URLs, if
    you wanted to do a full redirect, with HTTP status code, you can use the redirect
    or R flag. By default, the redirect flag sends a HTTP 302 Moved Temporarily code,
    as in the following rule:


    ```

    RewriteRule "article/(\d+)/? article.php?page=$1 [R]

    ```


    If you want to change the status code to a HTTP 301 Moved Permanently, or any
    other status code between 300 and 400, you simply add the code to the end of the
    redirect flag:


    ```

    RewriteRule "article/(\d+)/? article.php?page=$1 [R=301]

    ```


    # forbidden|F


    Similar to the redirect flag, using the forbidden flag immediately sends a HTTP
    403 Forbidden response to the client. Whenever both a redirect flag and forbidden
    flag are present for the rule, the forbidden flag will have priority (the redirect
    will be ignored, 403 sent).


    135'
