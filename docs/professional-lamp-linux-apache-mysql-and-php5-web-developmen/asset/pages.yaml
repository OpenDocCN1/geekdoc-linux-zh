- img_proc: true
  md: '# Code Efficiency


    inner, the experiments for a given number of variables were measured at widely
    spaced points during the run, ruling out all superbly well-timed transient delays
    from external sources.


    Comparing the two graphs when the number of variables is small, it is first unusual
    to see that the speed of concatenation drops initially, and that interpolation
    varies very sharply. Closer inspection reveals that the number of variables is
    small, double-quoted and single-quoted strings are equally fast, with double-quoted
    strings only slowing down once variables are to be interpolated. This is because
    double-quoted strings are scanned for when the program is loaded, during lexical
    analysis. This is a one-expense that is even less than you might expect at first:
    the contents of both single-quoted and double-quoted strings have to be scanned
    anyway, to escape sequences and the actual end of the run. The only real difference
    is that scanning double-quoted strings generates several in sequence when variables
    are present.


    Overall, the shape of the two charts differs. The difference can be formalized
    using "size" or "speed" of an algorithm in terms of the problem given. While it
    can give a precise technical definition, it is enough to think O(f(n)) as meaning
    that the graph of the algorithm''s behavior is "looking like" the graph of f(n)
    as n gets larger and larger:


    ```

    O(n) = the set of functions g(n) such that there exist positive constants c and
    n0 such that O(g(n))≤cf(n) for all n≥n0

    ```


    In this case, the graph of double-quoted interpolation varies with v, the number
    of variables being interpolated, and only linearly with l, the length of the string
    (that is to say, it is twice as slow when the string is as long). The graph for
    single-quoted quotation is more complex. In Big-notation this would be described
    as O(l). If you fix the length of the string and look at a single slice of the
    graph as the number of variables changes (such a slice is shown in Figure 9.1
    at the top of the graph from the left to the peak), it looks fairly linear in
    v. Fixing the number of variables and allowing the length of the string to vary
    (the ridge crest leading from the peak to the right) curves in such a way to suggest
    a Parabola. These two influences appear to merge, giving a Big-o description of
    O(v).


    In the long run, l increases more slowly than v, and in fact for long strings
    with many variables, interpolation is faster than concatenation. For shorter strings,
    however, fewer variables, concatenation wins out.


    Big-O only concerns what happens to the problem in the long run You''ll recall
    that when there are no variables involved, the two methods are fairly quick (both
    consist of a single string), but that single-quoted concatenation speeds up slightly
    before slowing down, while double-quoted interpolation slows sharply as soon as
    a variable is introduced, and never recovers. Big-O says that in the long run,
    variable interpolation is faster than concatenation, but you would need to have
    multi-kite strings with dozens of variables to see it happen.


    You can see that in this very simple example, with only two factors to consider,
    there is the potential for a lot of subtlety when aiming a definitive answer of
