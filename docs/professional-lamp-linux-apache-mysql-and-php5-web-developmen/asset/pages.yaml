  md: '# Chapter 4


    In SQL, joins are a way of linking two or more tables on a specified column or
    columns. In MySQL, there are two types of joins that are most commonly used: inner
    joins and outer joins.


    # Inner Joins


    Inner joins are a way of taking two tables and combining their rows based on a
    commonly shared value for each row. When you perform an inner join in a SELECT
    query, you simply specify the tables to be joined in the FROM clause; and provide
    a hint on what they have in common. A generic abstraction of the MySQL INNER JOIN
    syntax looks like this:


    ```

    SELECT [column names] FROM [table1] INNER JOIN [table2] ON [table1.column] =

    table2.column]

    ```


    Using the hypothetical cart inventory, you want the model of each vehicle to return
    in the results along each vehicle''s specific information. To accomplish this,
    your query would look like this:


    ```

    SELECT Models.model_name, New_Vehicles.color, New_Vehicles.modelyear FROM Models

    INNER JOIN New_Vehicles ON Models.model_id = New_Vehicles.model_id;

    ```


    Running this query against your database yields the following:


    | model_name | color | modelyear |

    |---|---|---|

    | Explorer | Dark Blue | 2005 |

    | Tacoma | Radiant Red | 2005 |

    | Corvette | Daytona Orange Metallic | 2005 |


    You''ll notice in the SELECT query, each of the columns in the select list is
    prefixed with the name of the table they belong to. This is not technically required,
    but it is usually a good idea to avoid conflicts between identically named columns.
    What would happen if you had such a conflict and neglected the table prefix? Take
    a look at this:


    ```

    SELECT model_id, model_name, color, modelyear FROM Models INNER JOIN New_Vehicles

    ON.model_id = New_Vehicles.model_id;

    ```


    As you can see the table prefixes have been removed, the model_id column has also
    been added to the list (because it exists in both tables). Now try to run that.
    You''ll get the following error:


    ```

    ERROR 1052 (23000): Column ''model_id'' in field list is ambiguous

    ```


    Trying to use a column name that exists in both tables, without using a table
    prefix, will throw such an error when the query is executed.


    If you like to be brevity in your SQL queries, have no fear—there''s a simple
    way you can shorten all of those prefixes. In the FROM clause, you can specify
    a alias for each table called, like so:


    ```

    SELECT [column names] FROM [table1] alias1 INNER JOIN [table2] alias2 ON

    [alias1.column] = [alias2.column]

    ```'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Advanced MySQL


    And because table aliases can be short as a single letter, you can drastically
    shorten your inventory

    query:


    ```

    SELECT m.model_name, n.color, n.modelyear FROM m INNER JOIN New_Vehicles

    ON m.model_id = n.model_id;

    ```


    Not short enough for you? Well, there''s another way to tidy up your joins. MySQL
    provides you

    with the USING statement, substitute for the ON statement to link your tables.
    Using the USING statement

    when the two linking columns happen to share the same column name. A generalized
    form of

    inner join using USING looks like this:


    ```

    SELECT [column names] FROM [table1] INNER JOIN [table2] USING (column list)

    ```


    Because the New_Vehicles table and Models table both have a model_id, you can
    use the

    USING statement in your:


    ```

    SELECT m.model_name, n.color, n.modelyear FROM m INNER JOIN New_Vehicles

    USING (model_id);

    ```


    In situations you will need to join more than two tables in a query. MySQL can
    handle

    this easily—all you have to do is chain your joins next to each other in the order
    you want

    evaluated. In the inventory database, you''ll need to use multiple joins to link
    the make

    vehicle with your record, so:


    ```

    SELECT ma.make_name, mo.model_name, n.color, n.modelyear FROM ma INNER JOIN

    Models USING (make_id) INNER JOIN New_Vehicles n USING (model_id);

    ```


    When you run this query, you will see the following:


    | make_name | model_name | color | modelyear |

    |----------|------------|-------|-----------|

    | Ford | Explorer | Dark Blue | 2005 |

    | Toyota | Tacoma | Radiant Red | 2005 |

    | Chevrolet | Corvette | Daytona Orange Metallic | 2005 |


    As you can see, the Makes table was joined to the Models table based on the make_id,
    and then

    result of that join was joined against the New_Vehicles table, giving you the
    make, model, and vehicle

    information in one query.


    Before moving to the next group of joins, you should know that there is another
    way to do

    joins. The second way simply specifies multiple tables in a comma-delimited list,
    and uses the WHERE

    statement to show how the tables are linked. A generic form of this type of inner
    join looks like this:


    ```

    SELECT [column names] FROM table1, table2 WHERE table1.column = table2.column

    ```


    If you were to use this form of inner join on the previous query to pull up a
    list of new vehicles,

    and models, it would look something like this:'
