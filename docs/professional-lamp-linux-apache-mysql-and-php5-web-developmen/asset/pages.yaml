  md: '# 2 PHP5 OOP


    When you begin a new project, the first things you have to consider is the structure
    of your code. Whether you''re coding something as simple as an online contact
    form, or as complex as a full-featured content management system, how you organize
    your code is going to influence the performance and maintainability of the end
    product.


    When you use a language like PHP, there are two main routes you can go: procedural
    programming and object-oriented programming — OOP for short. Each strategy has
    its own benefits and limitations.


    # Procedural Programming versus OOP


    Procedural programming often emphasizes writing code that is as concise as possible
    and coding directly for the end result. In other words, most procedural programming
    uses targeted groups of functions that immediately address the problem at hand
    — usually nothing more, and nothing less. In some situations, this gets you extremely
    efficient and high-performance applications. One of the downsides of this approach
    is a lack of maintainability. If the project grows large, the developer or developers
    could end up having to maintain a large number of individual functions, and in
    some cases, the logic of different functions can become confusingly.


    Object-oriented programming (OOP), on the other hand, emphasizes abstract relationships
    and a hierarchy of related functionality. Similar functionality share a common
    core, making maintenance much easier. Code reuse is increased as well, as you
    can easily adapt the abstract base for new tasks. OOP can also aid in large-scale
    design, encapsulating and categorizing the different sets of functionality required
    by each part of the system. Such organization and modularity come at a price,
    however. If your object-oriented system is poorly designed, it can actually be
    harder to maintain than any of the alternatives. Often, the extreme modularity
    and “code-heviness” of object-oriented designs can suffer from poor performance.'
