    # Retrieving Information


    You''ve spent all time creating your database tables and populating them with
    data; now it''s time to

    get some of data back out for you. For this, use the SELECT statement. A simplified
    form of SELECT

    looks something like this:


    ```

    SELECT column_names FROM [table] WHERE [criteria]

    ```


    If you want to retrieve a list of the colors of your used cars, you could use
    something

    similar to the following:


    which would return the following:


    | color |

    | White |

    | Deep Green Pearl |

    | Reflex Silver |

    | Red |'
