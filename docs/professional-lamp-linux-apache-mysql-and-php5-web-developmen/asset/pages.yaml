    That''s not quite right. What happened in this situation is actually a different
    kind of join called a cross join. A cross join is simply a combination of every
    matching result in each table. In this case, there were five models in the Models
    table, so each one of those was matched against every single row in the New_Vehicles
    table. This happened simply because you left the WHERE statement, which provided
    the hint to MySQL about how to link together. As previously noted, you didn''t
    include the Makes table partying this query—if you had, the results would have
    been five times as long, as there are five distinct matches in your database.


    # Outer Joins


    While most complex linking can be achieved using inner joins, there are some situations
    where they are limited. If a database row has no value defined for the column
    being linked, it will be ignored by inner joins. In the vehicle inventory example,
    every time you queried the table using an inner join to link the Models table,
    only three rows were returned. The fourth vehicle in the New_Vehicles table was
    ignored, because its value for model_id was null. What you need is to return all
    rows, whether or not there is a model_id specified, and if a model_id is specified,
    perform the requested joins.


    There are two types of outer joins in MySQL: left outer joins and right outer
    joins. They behave identically, the only difference pertaining to which table
    is allowed to contain non-matching characters. The generic form of an outer join
    is very similar to inner joins.


    ```

    SELECT [columns] FROM table1 LEFT OUTER JOIN table2 USING (column list)

    ```


    The left outer join joins the "right" table against the "left" table but will
    still return rows if the "left" table contains a value that doesn''t match in
    the "right" column. A right outer join behaves the same way, but with the rules
    of the two tables reversed (non-matching values are allowed in the right table).


    In the vehicle inventory example, if you wanted to return a set of rows where
    all new vehicles were returned, regardless of their model_id, you might use the
    following:


    ```

    SELECT mo.model_name, n.color, n.modelyear FROM New_Vehicles n LEFT OUTER JOIN
    mo USING (model_id);

    ```


    Querying the inventory database with this query produces the following:


    | model_name | color | modelyear |

    |--- |--- |--- |

    | Explorer | Dark Blue | 2005 |

    | NULL | Graphite Pearl | 2004 |

    | Tacoma | Radiant Red | 2005 |

    | Corvette | Daytona Sunset Orange Metallic | 2005 |

    | Explorer | Dark Blue | 2005 |


    This is very similar to one of the earlier inner join queries you looked at, but
    with the addition of the second row—Graphite Pearl, from the 2004 model year.
    Because there was no match in the Models table, MySQL NULL for the values in the
    row that could not be determined—in this case, model_name.'
