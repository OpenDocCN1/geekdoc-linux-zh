  md: "# PHP 5 OOP\n\nLooking carefully at the previous bit of code, you may have\
    \ noticed something bit awkward in the way you used the radius property. You've\
    \ explicitly set the radius property, but then you use that as an explicit value\
    \ for the parameter of the calArea method. Since the object knows the radius property\
    \ internally, there's no reason it needs to be passed to the calArea() method.\
    \ To remove the requirement to provide a radius parameter and use the object's\
    \ own radius property, you're going to need a method to access it. PHP provides\
    \ us with a reference named $this to achieve such a goal. Using the specifically\
    \ named variable $this is just like referencing an instantiated object, $this\
    \ references the object in which it is contained.\n\nChange the class structure,\
    \ as shown here:\n\n```\n<?php\n\nclass Circle\n{\n    public $radius;\n\n   \
    \ public function calArea()\n    {\n        return pi() * pow($this->radius, 2);\n\
    \    }\n\n    // Create a new instance of Circle\n$c = new Circle();\n\n    //\
    \ Change a property\n$c->radius = 5;\n\n    // Use a method\necho 'The area of\
    \ the circle is ' . $c->calArea();\n\n?>\n```\n\nRunning the code will produce\
    \ exactly the same results as the previous example—the only changes occur in the\
    \ way you use the calArea() method. Since you are referencing the Circle object's\
    \ radius property inside the method, you no longer need the parameter in the function\
    \ definition, and in the method call.\n\n# Visibility\n\nOne of the new features\
    \ of the PHP5 OOP is the ability to set a level of visibility for all properties\
    \ and methods. Using these visibility keywords, you can hide certain parts of\
    \ your class from external code, and expose other functionality that you want\
    \ access to all. PHP5 provides three visibility levels to use in classes: public,\
    \ private, and protected.\n\nA visibility of public means that a property or method\
    \ is available to all other code that wishes to access it. If no visibility is\
    \ specified for a method, it defaults to public visibility.\n\nSpecifying a class\
    \ member as private makes the property or method visible only within the class\
    \ definition to which it belongs. All other methods in the same class can access\
    \ the private member, but anything outside that specific class cannot."
