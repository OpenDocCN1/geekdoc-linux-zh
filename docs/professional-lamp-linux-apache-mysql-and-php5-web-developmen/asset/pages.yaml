  md: "```\n(\n  // Circle->calculateArea() implementation\n)\n```\n\nIn this small\
    \ example, you could have easily created a method inside the base Shape class\
    \ and simply extended it to the subclass Circle. Such an approach, while possible,\
    \ is limiting, due to the fact that classes PHP can extend only one base class.\n\
    \nPHP5 classes can, however, implement multiple interfaces, separated by commas:\n\
    \n```\ninterface GeometricOperations\n{\n  public getOrigin();\n}\n```\n\n```\n\
    interface TwoDimensionalOperations\n{\n  public calculateArea();\n}\n```\n\n```\n\
    class Circle implements TwoDimensionalOperations, GeometricOperations\n{\n  //\
    \ Implement the required methods\n  public getOrigin()\n{\n    // Circle->getOrigin()\
    \ implementation\n  }\n  public calculateArea()\n{\n    // Circle->calculateArea()\
    \ implementation\n  }\n}\n```\n\nUsing both inheritance and multiple interfaces,\
    \ you can build some seriously complex and powerful applications using simple\
    \ building blocks.\n\n# # Magic Methods\n\nTo make things easier when using object-oriented\
    \ programming, PHP5 has provided a handful of so-called \"magic methods\". These\
    \ magic methods are specially named methods for all classes, which are automatically\
    \ called in certain scenarios.\n\nYou've already seen two magic methods in this\
    \ chapter so far, __construct and __destruct, which are called when an object\
    \ is instantiated or destroyed, correspondingly. PHP includes a handful of magic\
    \ methods that you can implement to provide special functionality for your classes.\
    \ The three magic methods—call, __get, and __set—all allow you to access methods\
    \ and properties of an object that haven't been explicitly defined. A sixth, __toString(),\
    \ defines what happens when an object is used as a string."
