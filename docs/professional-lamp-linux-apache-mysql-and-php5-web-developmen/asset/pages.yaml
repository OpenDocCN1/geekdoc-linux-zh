  md: '# Apache Tricks


    Assuming everything went well, mod_rewrite.so exists in the directory, you''ll
    need to enable it in httpd.conf, by either uncommenting any existing line or adding
    a new one that looks like the following:


    ```

    LoadModule rewrite_module modules/mod_rewrite

    ```


    Do not use a LoadModule line for any module that is built statically into Apache—only
    dynamic shared objects. Using LoadModule for a static module will only generate
    an error.


    After all required changes are made to httpd.conf, restart Apache. Now that you''ve
    successfully installed mod_rewrite, you''ll need to take a look at the different
    configuration settings used to take advantage of mod_rewrite.


    # RewriteRule


    Mod_rewrite provides a handful of configuration directives that can provide a
    wide range of rewrite abilities, from very simple redirects, to complex multiple
    pattern-matching substitutions. At the heart of every rewritten URL is the RewriteRule
    directive.


    # RewriteRule Usage


    Regardless of how complex your rewriting needs be, you''ll need at least one RewriteRule
    to perform a transformation. The basic format for the RewriteRule directive is
    follows:


    ```

    RewriteRule pattern substitution [flag]

    ```


    RewriteRule behaves in a manner similar to PHP''s preg_replace function: it takes
    a regular expression pattern, matches it against an incoming URL, and then uses
    a rule you define to provide a substitution for the URL.


    When constructing your regular expression pattern to match, you can use the following
    tokens:


    | Pattern | Meaning |

    | --- | --- |

    | ^ | The caret symbol denotes the beginning of the line or string |

    | $ | A dollar sign denotes the end of the line or string |

    | . | A period matches any single character. |

    | (a|b) | Using the "pipe" character as a logical "or," the pattern (a|b) matches
    a or b. | |

    | (...) | Parentheses group a sub-match. |

    | [abc] | Listing values inside a pair of brackets matches any value in the list
    or range. The pattern [abc] matches the single letter a, b, or c; whereas the
    pattern [a-z] matches any lowercase letter a through z |

    | [abc] | Using the caret at the beginning of a range matches any values not listed
    in the range. The pattern [^abc] matches any character except a, b, or c; the
    pattern [a-z] matches everything except lowercase a through z. |


    Table continued on following page


    131'
