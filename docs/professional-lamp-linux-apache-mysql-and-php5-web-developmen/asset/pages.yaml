    # How Well does mod_deflate Work?


    In order to see the space-saving abilities of mod_deflate, this example serves
    a decent-sized HTML page with Apache, both with and without mod_deflate. In this
    example, the home page is used for the Wrox P2 community forums, found at http://p2p.wrox.com.
    The raw HTML markup—the HTML only — for page weights in a hefty 47172 bytes. Have
    a look at the following table to see how it fared through mod_deflate at three
    different compression levels:


    | Compression Level | Bytes Transferred | % of Original | Approx. Download Time
    (56k) |

    |---|---|---|--|

    | Raw | 47172 bytes | 100% original | 17.7 seconds |

    | Default (6) | 7621 bytes | 16.2% original | 3.8 seconds |

    | Level 1 | 9050 bytes | 19.2% original | 4.1 seconds |

    | Level 9 | 7581 bytes | 16.1% original | 3.8 seconds |


    As you can see, mod_deflate clearly has an advantage over serving raw, uncompressed
    HTML — eliminating up to nearly 84% of the file size sent over the connection.
    Also notice that using the maximum compression of 9 outweighed the default level
    of 6 by only a marginal amount, so in this situation it would probably be safe
    to stick with the default compression of 6 for a few cycles.


    Many websites have a mixture of HTML, media, and associated scripting files, sites
    such as photos or blogs online shops may not reap frequent savings on every page
    they serve, but each byte saved can really add up to some high bandwidth reduction
    at month''s end. Text-heavy sites like blogs and news portals would see the benefits
    of content compression, as a majority of the bandwidth utilized on those sites
    is plain text — that text would find its way through mod_deflate.


    # Enabling Compression for PHP Scripts


    What about PHP files you might be wondering? In many situations there is no need
    to use compression on PHP files, and in some cases it is detrimental to the output.


    If your PHP script outputs an actual image or PDF for example, you wouldn''t want
    Apache to blindly compress the output, just because the file extension happens
    to be .php.'
