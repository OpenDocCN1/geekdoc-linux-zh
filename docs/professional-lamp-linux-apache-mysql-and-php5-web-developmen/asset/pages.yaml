    basically a library of classes for you to use. The next section discusses the
    Iterator class itself. You will notice that many of the functions are similar
    to the array functions.


    # Main Iterator Interface


    The Iterator class is a built-in interface that allows you to loop through anything
    with a foreach() statement — for example, a directory of files, a result from
    a query, or an array of data. It contains inherent functions:


    By-defining the generic Iterator functionality, these can help you use iteration
    to make your code more powerful and efficient. The most important thing about
    the Iterator interface is that it is one of the building blocks for other Iterator
    classes.


