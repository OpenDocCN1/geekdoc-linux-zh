  md: '# Chapter 4


    To add access permissions, you simply insert a row into the appropriate table,
    specifying y for each permission column required. To give your newly created database-level
    SELECT, UPDATE, INSERT, and DELETE permissions on the VehicleInventory database,
    use the following:


    ```

    INSERT INTO mysql.db (Host, Db, User, Select_priv, Insert_priv, Update_priv,

    Delete_priv) VALUES (''localhost'', ''VehicleInventory'', ''testuser6'', ''Y'',
    ''Y'', ''Y'', ''Y'');

    ```


    If you need to revoke permissions, you simply perform a DELETE on the required
    tables. To remove the database-level permissions for testuser6, use this query:


    ```

    DELETE FROM mysql.db WHERE Host=''localhost'' AND User=''testuser6'';

    ```


    Removing an entity from the database is a bit more complicated. You must first
    remove all permissions granted to that user, and then you can use a DELETE command
    to remove them from the user table.


    In order for MySQL to be aware of the privileges you''ve manually changed, you
    must reload the privilege tables:


    ```

    FLUSH PRIVILEGES;

    ```


    If you don''t flush the privileges after making an access change, it won''t be
    reflected in MySQL until the next time it restarts. This applies to any privilege
    change you make manually to any access level—using GRANT or REVOKE does not require
    you to reload the privilege tables.


    # Server Restriction


    Another way to restrict server access, at a much larger scale, is to actually
    restrict remote access on the server as a whole. If your database serves only
    users logged into the machine directly, there is little need to have the accept
    server network connections. To stop MySQL from listening for incoming work-connections,
    make sure the following exists in the [mysqld] section of your MySQL configuration
    file (typically my.cnf).


    ```

    [mysqld]

    skip-networking

    ```


    Adding that statement to the configuration file, and restarting the MySQL server
    process, disables any incoming traffic to MySQL. Such a measure is important if
    your network and server security is important, and when only local access is needed.


    # Analyzing the Database


    While your time using a database will likely be spent updating, retrieving, and
    deleting data, there will be occasions when you need to immediately find out information
    about the database structure itself. Frankly, MySQL provides some easy-to-use
    informational tools, as as simple ways to analyze and optimize your databases.'
