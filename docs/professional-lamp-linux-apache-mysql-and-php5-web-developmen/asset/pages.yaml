  md: '# Chapter 4


    In most situations, it''s important that the user account requires a password
    to log in. To add a password when creating an account with GRANT, add the phrase
    IDENTIFIED BY ''password'' to the end of the GRANT command, like so:


    ```

    GRANT [privileges] ON [resource] TO [identity] IDENTIFIED BY ''[password]'';

    ```


    You are not required to pre-encrypt the password before using it as the password
    in your GRANT command—MySQL will automatically encrypt the password before storing
    it in the system.


    Now that you''ve seen some examples of how to use GRANT, you can try it on a real
    database. You''re going to be adding three users to the vehicle database. One
    user will get full access to the whole database. The second will get SELECT, UPDATE,
    INSERT, and DELETE access to the New_Vehicles table. The third and final user
    will get access only to the color column in the New_Vehicles table. First, create
    the user who has all privileges in the database:


    ```

    GRANT ALL PRIVILEGES ON VehicleInventory.* TO tester1@localhost IDENTIFIED BY
    ''testpass1'';

    ```


    Create the user with limited table-permissions:


    ```

    GRANT SELECT, INSERT, UPDATE, DELETE ON VehicleInventory.New_Vehicles TO tester2@localhost
    IDENTIFIED BY ''testpass2'';

    ```


    Last, create the third user with the extremely limited access:


    ```

    GRANT SELECT (color) ON VehicleInventory.New_Vehicles TO tester3@localhost IDENTIFIED
    BY ''testpass3'';

    ```


    # Using REVOKE


    You can create users and privileges using the GRANT command, but you will still
    need a way to take away privileges. The REVOKE command works almost exactly like
    the GRANT command:


    ```

    REVOKE [privileges] ON [resource] FROM [identity];

    ```


    Note the only real differences between the REVOKE and GRANT syntax: the use of
    FROM instead of TO, and there''s no need to add the IDENTIFIED BY phrase.


    For a quick look at REVOKE on a live database, try the following query:


    ```

    REVOKE ALL PRIVILEGES ON VehicleInventory.New_Vehicles FROM tester2@localhost;

    ```


    And in that one quick stroke, you''ve pulled out any privileges the tester2 account
    had.


    When revoking privileges, you normally must list the specific tables, databases,
    and columns that the user has explicit rights for. If you are using MySQL 4.1.2
    or later, you can quickly wipe off all of a user''s privileges at any level with
    one swift command:


    ```

    REVOKE ALL PRIVILEGES, GRANT OPTION FROM [identity];

    ```'
