  md: '# Chapter 13


    +   Postnuke: Available at http://www.postnuke.com. Another of the "oldies but
    goodies," this CMS came out shortly after PHP-Nuke, and thus feeds off its extensive
    community of users and developers. Numerous add-ons, language packs, and user
    forums are available to assist you in customizing your CMS package.


    # Micro CMSs


    You may want only one of the bigger CMS packages on your site. Thankfully you
    also have available Micro CMS packages. These "mini" CMS packages have one specific
    purpose, such as a blog or a wiki. They are the perfect solution if you need only
    one function on your site. The sections that follow a brief look at these packages.


    The two most popular Micro CMS packages are blogs and wikis. It is for this reason
    that more attention is focused on these areas.


    # The Magic of Blogs


    Studies are showing the increasing popularity of blogs and those who read them.
    A study by PEW Internet & Life Project shows that in 2002, only 3% of Internet
    users owned a blog. In 2003, that number increased to 5%, and in 2004, that number
    was up to 7%. Multiply this by the estimated 120 million users in America alone,
    and that equates to some pretty hefty going on.


    Not only are people writing blogs, but more and more people are taking the time
    to read them. An April 2005 survey by Hostway, Inc. shows that roughly 30% of
    respondents had read blogs, and analysts predict that this will grow greatly in
    the next few years.


    # Why Blog?


    There are many reasons for blogging, and they run the gamut from personal to corporate
    agendas. This free, immediate, interactive communication mechanism makes the perfect
    forum to share opinions and thoughts. Blogs can be about anything, and their informal
    nature appeals to virtually everyone.


    Blogs exist to:


    +   Share political views: Many politicians and high-profile political activists
    are using blogs to reach the masses and promote their own agendas.


    +   Further corporate goals: Corporations are beginning to jump on the bandwagon
    and provide blogs about their products and services. Some are written by the consumers
    themselves. Some are using blogs to notify their readers about upcoming product
    releases, or other news about the company.


    +   Share personal opinions: On such crowded planet, and on such crowded Internet,
    times just want to be heard. They want to share their current experiences with
    friends and family from around the globe. Or perhaps they have expert advice they
    want to share with beginners. In a coder''s world, you might have a code snippet
    to share, or a cool product or link you want to tell others about. The list goes
    on.


    322'
  merge: -1
