    # Conventions


    To help you get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book.


    > Boxes like this one hold important, not-to-be forgotten information that is
    directly relevant to the surrounding text.


    Tips, hints, tricks, and aides to the current discussion are offset and placed
    in italics like this.


    As for styles in the text:


    +   - We highlight important words when we introduce them.

    - We present URLs like so: http://www.mysite.com

    - We show code within the text so: persistence.properties

    - We present code in two different ways:


    > In examples we highlight new and important code with a gray background.


    The gray highlighting is not used for code that''s less important in the present
    context, or has been shown before.


    # Source Code


    As you work through the examples in this book, you may choose either to type in
    all the code manually or to use the source code files that accompany the book.
    All of the source code used in this book is available for download at http://www.wrox.com.
    Once at the site, locate the book''s title (either by using the Search box or
    by using one of the lists) and click the Download Code link on the book''s detail
    page to obtain all the source code for the book.


    > Because many books have similar titles, you may find it easiest to search by
    ISBN. This book''s ISBN is 0-7645-9723-X.


    Once you download the code, decompress it with your favorite compression tool.
    Alternately, you can go to the main Wrox code download page http://www.wrox.com/dynamic/books/download.aspx
    to see the code available for this book and all other Wrox books.'
