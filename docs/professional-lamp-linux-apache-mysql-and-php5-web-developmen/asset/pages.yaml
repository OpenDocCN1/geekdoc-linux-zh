  md: '# Chapter 8


    This shows a description of each configuration variable, the variable name, and
    what the current settings are. To change a setting, use the config-set command,
    such as this:


    ```

    pear config-set preferred_state devel

    ```


    The config-help command shows you more information about a specific configuration
    variable.


    # Installing Packages


    Several of the other PEAR packages come pre-installed with PHP 5, and you can
    find a complete list by running the following command (from root login):


    ```

    pear list

    ```


    This will give you a list of the installed packages, the version that was installed,
    and the state of the release (stable, beta, and so on). If you would like to install
    other packages, the following sections briefly outline the installation process
    for:


    # CLI Installation


    If you have root access, you can install any new package simply by typing the
    following command:


    ```

    pear install [package name]

    ```


    This command joins to the PEAR site, downloads the package you specified (without
    the brackets of course), and installs it on your machine.


    # FTP Installation


    If you don''t have access to the command line, or if your current web host doesn''t
    supply you with the PEAR package you want, you can also install a package by completing
    two steps:


    +   1. Download the compressed package directly from the PEAR site, unzip it,
    and upload the files to your Web site (saving them in the /var/www/www.yourdomain.com/includes
    directory). You may also include the compressed package and extract it while it''s
    on the host server (again, to the /var/www/www.yourdomain.com/includes directory).

    2. Alter your php.ini file to match the path you just used.


    ```

    include_path = "./var/www/www.yourdomain.com/includes";

    ```


    You may also include a line in each script that will access the package, like
    this:


    ```

    <?php

    ini_set("include_path", "/var/www/www.yourdomain.com/includes/" . PATH_SEPARATOR);

    ini_get("include_path");


    //remainder of PHP script here.

    ?>

    ```


    Your package is now installed and ready to use.'
