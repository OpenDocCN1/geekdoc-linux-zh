  md: '# Chapter 6


    state. The HTML you write is sent directly as you save it, whitespace and all.
    Content compression allows you to transparently compress the page markup and send
    it across the Internet to the user''s browser, where it is silently uncompressed
    before it is rendered to the screen. Another way to think about it is in relation
    to sending zipped files via email. You could as easily send a large document of
    media-file as a plain attachment to an email, but many times you compress the
    file into a zip or tar.gz archive before sending, to help shorten the time it
    takes to download the message and attachment.


    Using compression with Apache is very easy. All you need mod_deflate, which comes
    with the Apache source code and is easily compiled in a module when building Apache.


    # Using mod_deflate


    As with the previously discussed modules, the first thing you need to check is
    to see if the module is available statically part of Apache, or as a module:


    ```

    /path/to/httpd -l

    ls /path/to/apache/modules/

    # and any other configure settings you might use

    ```


    If you see mod_deflate.c in the output of the first command, or mod_deflate.so
    in the output of the second, you already have access to mod_deflate, and can skip
    the steps where you need to rebuild Apache.


    If you don''t see mod_deflate in either of the command results, you''ll need to
    enable it statically building into the Apache binary, or as a dynamic module.
    To include mod_deflate statically in Apache when building from source, you''ll
    need to add the following when you run configure:


    ```

    ./configure \

    --enable-deflate

    ```


    If you wish to use the dynamic loadable module, just add `=shared` or `--enable-deflate=shared`
    to the end of the line enabling mod_deflate:


    ```

    ./configure \

    --enable-deflate=shared \

    # and any other configure settings you might use

    ```


    If you build mod_deflate as a dynamic module, you''ll need to enable the module
    in httpd.conf using LoadModule:


    ```

    LoadModule deflate_module modules/mod_deflate.so

    ```


    Then restart Apache so the changes take effect.


    After you build and enable mod_deflate, it''s a simple matter of telling Apache
    to use mod_deflate, and what file types to compress. To do that, you''ll need
    to edit your httpd.conf, or create or modify a .htaccess file in the directory
    you want to use compression—the preferred method if available.


