  md: "# More Obscure PHP\n\nNow consider this:\n\n```\n$input_file = array_map('rtrim',\
    \ file('generic.txt'));\n```\n\nThis line of code achieves the same effect. file()\
    \ returns an array containing lines of generic.txt; array_map() applies the rtrim()\
    \ to each element of that array, and returns the \"trimmed\" array.\n\nThere are\
    \ several functions that abstract the most common reasons for iterating over an\
    \ array, reducing the need for loops and other flow-control statements. Writing\
    \ one liners solely for the sake of it can lead to hard-to-read code, cutting\
    \ down the number of \"moving parts\" in a program can help reduce incidence of\
    \ error.\n\nWhen you have an array in which you have a task to perform on each\
    \ element in turn, array_map() and array_walk() deserve consideration. There are\
    \ alternative functions that employ-call callbacks in a similar fashion to you\
    \ calling a callback on every element of an array yourself.\n\nCallbacks take\
    \ one of two forms. The first, and most common, is that it is simply passing a\
    \ string containing the name of a function. In the previous line of code, it is\
    \ the 'rtrim'.\n\nIt does have to be a function, which is why PHP manual makes\
    \ the point of stating that echo, empty, include, and so are not functions. Passing\
    \ your callback will fail. The reason these are excluded because they are given\
    \ special attention during parsing and have their internal structures.\n\nThe\
    \ second kind of callback is used to specify class and object methods. Both are\
    \ represented by two-element arrays, where the second element is the name of the\
    \ method, stored as a string. If the first element is an object, then the callback\
    \ refers to that object's method: array($object, 'method') refers to $object->method().\
    \ If the other hand the first element is a string or string variable, then the\
    \ callback refers to a static method of the named class: array('thing_factory',\
    \ 'create_new') refers to the static thing_factory::create_new(method).\n\n```\n\
    // Using an object's method as a callback in array_map().\n// Each element of\
    \ $untied_array is passed in turn to $parser->tidy($untied)\n// and the returned\
    \ values are stored in $untied_array\n$untied_array = array_map($parser\n```\n\
    \n```\n// Using a static method as a callback in array_map().\n// Each element\
    \ of $untied_array is passed in turn to Parser::tidy($untied)\n// and the returned\
    \ values are stored in $untied_array\n$untied_array = array_map($Parser, 'tidy',\
    \ $untied_array);\n```\n\n```\nclass Parser {\n    // An example method that trims\
    \ trailing whitespace and\n    // shell-style comments using '# ' from a single\n\
    \    // line of text.\n    static function strip_comments($element) {\n      \
    \  $element = preg_replace('/#[^#]*$/', '', $element);\n        $element = rtrim($element);\n\
    \        return $element;\n    }\n```"
