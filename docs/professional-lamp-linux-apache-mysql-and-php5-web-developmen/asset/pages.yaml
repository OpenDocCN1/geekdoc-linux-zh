  md: '# Site Security


    How did Text_CAPTCHA know what string you wanted to use? It didn''t. When you
    initialized the CAPTCHA object, you passed in null as the test string:


    ```

    // Initialize the CAPTCHA object with random text

    $r = $cap->init(250, 100, null, $opts);

    ```


    If you wanted to explicitly set the string that will be revealed by Text_CAPTCHA,
    just change the input string from null to the value you desire:


    ```

    // Initialize the CAPTCHA object with random text

    $r = $cap->init(250, 100, ''computers be gone!'', $opts);

    ```


    Other things to check in your PHP scripts are local filenames and how they are
    accessed. Take a look at the following code:


    ```

    <php

    $contents = file_get_contents(''/path/to/content/'') . $_POST[''file''];


    echo $contents;


    ?

    ```


    This is the kind of code that can often be found on many home-brewed CMS systems,
    or some other kind of custom-retrieval script. Unfortunately, it''s a high security
    risk. What would happen if an attacker submitted the value ../etc/passwd for the
    file? If the server isn''t locked down properly — and many aren''t— the contents
    of the system password file will get echoed directly to the screen.


    There are a couple easy steps you can take to help prevent this kind of attack.
    First, if you have control over the Apache web server, make sure it is running
    as an unprivileged user. Whenever Apache runs as — apache, nobody, www, it doesn''t
    matter — make sure that user does not have privilege to access any files except
    bona fide website files.


    Second, make sure you''re escaping any parent directory access periods in the
    file paths, like so:


    ```

    <php

    $file = str_replace(''.'', '''', $_POST[''file'']);

    $contents = file_get_contents(''/path/to/content/'') . $file;


    echo $contents;


    ?

    ```


    It''s also a good idea, if possible, to prefix your escaped filename with its
    path. That way if an attacker provides an absolute path for the file value, it
    will still behave relative to the specified folder.'
