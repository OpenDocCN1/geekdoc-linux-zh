  md: "# Chapter 2\n\n# __wakeup__\n\nThe __wakeup magic method does the exact opposite\
    \ of the __sleep method. When unserialize() is called; __wakeup is automatically\
    \ called, which is helpful for resetting object values, restoring connections,\
    \ and other initialization tasks.\n\nLook at this simple example of __sleep and\
    \ __wakeup in action. This example is going to require two files. The first file,\
    \ you will create as page.php:\n\n```\n<php\nsession_start();\n\nclass Circle\n\
    {\n    public $origin = array('x'=>0, 'y'=>0);\n\n    public function __sleep()\
    \ {\n        echo 'zzzzzz';\n        return array('radius', 'origin');\n    }\n\
    \n    public function __wakeup() {\n        echo 'good morning!';\n    }\n}\n\n\
