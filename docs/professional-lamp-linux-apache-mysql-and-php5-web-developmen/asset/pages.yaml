    +   - XML Extras: The Mozilla Foundation. <http://www.mozilla.org/xmlextras/>


    +   - AJAX Patterns: <http://www.ajaxmatters.org/>


    +   - AJAX Matters: <http://www.ajaxmatters.com/>


    # Summary


    In this chapter, you learned how to use AJAX to push out the of processing of
    web applications onto the client. You also learned that AJAX isn''t new today,
    but is in fact the outgrowth of older techniques, each of which has some drawbacks
    that make them less than ideal. This chapter showed you how to use the AJAX interfaces,
    and how to handle the responses from the client. It also touched on some of the
    AJAX libraries you can use, and even discussed the situations where you shouldn''t
    use it.'
