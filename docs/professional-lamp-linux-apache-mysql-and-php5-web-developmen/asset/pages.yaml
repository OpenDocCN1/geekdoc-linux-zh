- img_proc: true
  md: 'whether to use AJAX and ask yourself AJAX will be beneficial for the application
    you are developing. If you are running into serious usability problems that require
    elaborate workarounds, chances are that AJAX was not the appropriate development
    model.


    In addition to the usability problems, there are the problems of support. Having
    an application relies on AJAX without any fallback support for older browsers
    can block out a large portion of your potential user base. Even for current browsers,
    some require JavaScript to be partially or fully disabled for security reasons.
    Such users would be blocked out of your application, if it does not degrade well
    and offer traditional web functionality as a safety net. Whether this is acceptable
    will depend on the nature of your application, with some applications it is not
    practical to offer a traditional version. Its acceptability will also depend on
    your expected audience and likely choice of browser.


