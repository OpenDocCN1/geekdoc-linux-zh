  md: 'Foreign key constraints provide a way to maintain referential integrity across
    linked tables. The VehicleInventory database, the New_Vehicles and Used_Vehicles
    tables contain a column for model_id, to specify the model, and,, for each vehicle.
    A foreign key constraint could be applied to the model_id column to guarantee
    that no value is inserted into the table that didn''t exist already In the default
    MyISAM table type, there is no way for MySQL to automatically enforce such a rule,
    and in larger databases that could lead to large quantities of invalid values
    in the tables. InnoDB provides MySQL with a way to enforce such a rule, so data
    stays relevant.


    Foreign-key-constrained columns allow only values that exist in the referenced
    table, with one exception: NULL. A value of NULL is permitted in columns that
    are otherwise controlled by a foreign key.


    # InnoDB Disadvantages


    Unfortunately, the benefits of InnoDB come with a couple of particular bothersomes.
    First, When you''re deciding whether or not to use InnoDB, you must also consider
    the need for full-text indexing in the future, and it is more important than referential
    integrity on a given table.


    Second, the InnoDB storage engine is slightly limited with regards to AUTO_INCREMENT
    columns. InnoDB tables do not allow you to specify the initial value of the auto-increment
    sequence when creating a table. Not necessarily a show-stopper, but it''s something
    to keep in mind when designing your database schema.


    # Using InnoDB


    The best way to know the InnoDB storage engine is to put it to work. Now you''re
    going to enable the InnoDB engine by creating a new table from scratch as well
    as altering an additional table. After you''re going to experiment with the different
    aspects of foreign keys.


    # Creating an InnoDB Table from Scratch


    Creating a new table using the InnoDB storage engine is barely any different than
    creating a standard MyISAM table. The only key difference is you must specify
    the ENGINE at the end of the create table command.


    ```

    CREATE TABLE tableName (column_definitions) ENGINE=InnoDB;

    ```


    Pretty easy, right? Try it out for real in your MySQL database:


    ```

    CREATE TABLE innodbtest (innocoll int) ENGINE=InnoDB;

    ```


    If everything goes smoothly, you should see the following:


    ```

    Query OK, 0 rows affected

    ```


    And with that, you''ve created a simple InnoDB table.'
