    \ null;\n\t$arg2 = isset($arr2[$i]) ? $arr2[$i] : null;\n\t$new_array[$i] = func($arg1,\
    \ $arg2);\n}\n```\n\nNote the testing required to make sure the loop doesn't run\
    \ out of arguments for func() when the arrays are different lengths.\n\nNow compare\
    \ it with the one returns a result from one of array_map():\n\n```\n$new_array\
    \ = array_map('func', $arr1, $arr2);\n```\n\nIf doesn't work you're entitled to\
    \ log a bug with php.net. And when you come back months later to work at your\
    \ code, which will take longer to reacquaint yourself?\n\nAnother trick that array_map()\
