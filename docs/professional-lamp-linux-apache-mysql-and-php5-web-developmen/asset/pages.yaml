    \ the values of each of the two directories as the category and item number for\
    \ the PHP script. Like PHP's PCRE syntax uses \\$-fixed backreferences to refer\
    \ to matches in the original pattern. Backreferences are a simple way to include\
    \ a sub-match from the previous directory in the substitution string. Looking\
    \ again at the rule:\n\n```\n# Rewrite/category/item to catalog.php\nRewriteRule\
    \ ^(w)/(w+)/$ catalog.php?cat=$1&item=2\n```\n\nThere are exactly two submatches\
    \ defined in the regular expression matched against the URL: both of the \"word\"\
    character groupings, indicating directories. In the substitution string, the backreferences\
    \ $1 and $2 are used to automatically include the value of the first and second\
    \ sub-matches, correspondingly. Backreferences simply start counting at 1, which\
    \ corresponds to the first match.\n\nWhat other tricks can you do with a simple\
    \ as a rudimentary type-checking layer for your PHP scripts? In some situations,\
    \ you might be pulling a number from an example. If you want to make absolutely\
    \ sure it's a number you're using, and not something potentially evil—like a SQL\
