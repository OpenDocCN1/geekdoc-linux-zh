  md: '# More Obscure PHP


    # Final Observations on the Array Functions


    In terms of the number of functions listed, the array functions form one of the
    largest sections in the manual''s function listing; just behind the filesystem
    functions and not far behind string handling. Even with the amount of abstraction
    that callbacks allow, are there so many? And how can using them contribute to
    code quality?


    # So Many Array Functions


    Throughout PHP3 and PHP4, there have been noticeable gaps in the list of array
    functions. There was a function with which you could sort an array using your
    definition of "less than, greater than, or equal to," but there wasn''t a single
    array function to let you remove all the elements of one array that were "the
    same" as the elements in another, using your definition of "same." Over successive
    versions of PHP, these gaps are identified, and new functions implemented to fill.


    A principle factor backs to the overlapping functionality mentioned at the start
    of the chapter. Having two functions with similar behavior leads to the differences
    in how they are highlighted. There is a function to sort an array and a function
    to sort an array using a callback. There is a function to sort by key, and a function
    to sort by key using a callback. The natural question is to ask whether such differences
    mean for the other array functions.


    If you imagine all possible functions as single points in some space vast, the
    existing functions provide a set of reference points from which the space can
    be charted. Having sort() and usort() suggest the idea of moving towards callbacks;
    from these, you can move independently in the direction of "by key rather than
    value." Now that those directions have been pointed out, having array_diff() is
    inevitably to suggest array_diff() with callback, array_diff() has implemented
    many of these new functions, such as array_diff(), and many others are in CVS
    versions, not yet in stable releases.


    "Orthogonal" means at right angles; to other words, as far from parallel as you
    can get. PHP''s early functions have so many that are so similar to each other
    that they "point in nearly parallel directions in function space," using them
    with other functions that are nearly parallel (e.g., intersect_assoc() and array_intersect_uassoc()),
    leading to regions of function space where PHP''s functions are clustered. The
    array functions form such a cluster. You will certainly find that don''t need
    to be intimate with all of PHP''s array functions to use them effectively, and
    that consistent application of simple combinations of a few functions is as likely
    to net you all the functionality you require. That is orthogonality.


    # Array Function after Array Function


    When using a series of functions to manipulate the contents of an array there
    is a distinct difference in the order manipulations are carried out, compared
    to carrying out the manipulations directly on array elements within a loop. This
    can have an impact on considerations such as the memory requirements of your program.


    Consider this example:


    ```

    $array = array_map(''do_something_fancy'', $array);

    ```'
