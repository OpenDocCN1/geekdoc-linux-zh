  md: "# Chapter 9\n\nAll styles can be varied by choosing to use tabs or spaces,\
    \ or how wide each level of indentation should be. Typically, four or eight spaces\
    \ (eight-space tabs) are the most common, and tabs are often frowned upon because\
    \ people use different types of tabs. Any mix of spaces and tabs that look right\
    \ with one width is unlikely to look right on another, in so-called \"tab damage,\"\
    \ with lines of code and pieces of lines aligning at all sorts of random-indenting.\n\
    \nThe last style is a hoax: if you're going to align opening and closing parentheses\
    \ in columns, you should at least sure you align matching pairs of opening and\
    \ closing parentheses, otherwise the alignment is simply misleading. If saving\
    \ is intent, you might as well use LISP style indentation:\n\n```\nfor($i=0; $i<100;\
    \ $i++)\n  if ($foo[$i]==0)\n    ...etc.);\n```\n\nPEAR prefers K&R-style indentation,\
    \ with four spaces per indent and no tab characters. The reason for ruling out\
    \ tab characters is of course due to the effects of tab damage; but knowing the\
    \ causes of tab damage can go a long way toward preventing it.\n\nTab damage is\
    \ caused when you assume that tabs have a certain width. The following piece of\
    \ code has been written using tabs for indenting, in an editor that has been set\
    \ to use spaces for tabs:\n\n```\n************************************\n* Big\
    \ Flashy\n* Box comment\n*\n*\n* Just Because (TM)\n*\n************************************\n\
    for($i=0; $i<100; $i++)\n{\n  if($a==$i || $b==$i)\n    &&\n    ($c!=$i || $d!=$i)\n\
    \    {\n      echo \"Either a or b is equal to $i, \\n      echo \"and either\
    \ c or d is not.\";\n    }\n}\n```\n\nAnd here is how it would look in an editor\
    \ that has been configured with eight-space tabs:\n\n```\n************************************\n\
    * Big Flashy\n* Box comment\n*\n    * Just Because (TM)\n************************************\n\
    for($i=0; $i<100; $i++)\n{\n  if($a==$i || $b==$i)\n    &&\n    ($c!=$i || $d!=$i))\n\
    }\n```\n\n216"
