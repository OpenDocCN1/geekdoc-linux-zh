  md: '# Content Management Systems


    continually improve existing products. Documentation is an integral part of enabling
    users to understand what an application does or can do.


    Wiki sites are not limited to supporting open source projects, but can also act
    as a reference guide for virtually anything. There are hobby-oriented wikis, language
    wikis, gaming wikis—you could create a wiki for any topic under the sun.


    # MediaWiki


    One of the more popular packages available, and the brains behind Wikipedia, MediaWiki.
    It is available at http://wikipedia.sourceforge.net. The latest release at this
    time of writing is 1.4.4 and will be the focus of this discussion here.


    # Installation Notes


    Prior to installation MediaWiki, you should take note of the following: If you
    have root access, you will not need to create the database pre-installation. If
    you are installing on a remote server, you will need to create the database yourself
    before installation. Also, after the files have been unzipped, you will need to
    chmod the config directory so that it is writable. You will also need to set the
    permissions upon completion of installation.


    The complete installation guide can be found at the MediaWiki web site: http://meta.wikidata.org/wiki/MediaWiki_User%27s_Guide:Installation.


    # General Overview of Features


    Because of the purpose of this is to keep track of a continually evolving body,
    it has some wonderful features for managing users, their input, and version control.
    General functions are available:


    +   - **User customization and access**: Users can customize their site interface
    by editing their templates, setting their own preferences for things such as time
    zone and number of results per page. Admins can assign varying levels of permissions
    to users, turning on and off the ability for them to edit, move, contribute, or
    upload files, among others.


    +   - **Search capabilities**: Visitors to the site can perform a full-text search
    of all the articles contained on the site.


    +   - **Reports**: Reports can be generated to provide specific statistics on
    usage, articles and links, article activity and popularity, and more.


    +   - **Editing articles**: Users can decide to edit any part of an article, articles
    can be merged if an edit conflict occurs, users can preview their edits before
    submitting them, and users are given the use of an editing toolbar to facilitate
    the editing process.


    +   - **Article organization**: Articles can be categorized and categorized into
    unlimited categories.


    +   - **Text and linking controls**: Users can use restricted or full HTML code
    when submitting changes or entering new text. Embedded hyperlinks can also be
    managed.


    +   - **Watchlist**: This feature assists the admin and users in keeping track
    of users'' interests and contributions of particular interest, recent changes,
    and which users have contributed the most. This feature offers a side-by-side
    view of the article pre- and post edit with the changes highlighted so changes
    can be easily identified by the reader.'
