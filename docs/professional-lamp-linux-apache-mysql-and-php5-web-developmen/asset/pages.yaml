    # Ordering If..elseif and Switch Cases


    First of all, if you have a sequence of elseif statements, and one of them can
    possibly be true at any given time, then you should use elseif for all the first.
    Otherwise, after finding the one that matches, PHP will continue to go on and
    leave the rest. You won''t be false, but you''re not the one who has to actually
    do the work. PHP will continue testing in the case variables being tested changed
    while the successful statement was processed.


    If you have a sequence of elseif statements, or a switch statement, then the more
    common cases towards the top, and more cases towards the bottom. In addition giving
    a clearer picture of what the code is doing to readers (by illustrating the typical
    statement first, leaving the hairy edges cases until later), means that on average
    PHP will have to carry fewer tests before it finds one succeeds.


