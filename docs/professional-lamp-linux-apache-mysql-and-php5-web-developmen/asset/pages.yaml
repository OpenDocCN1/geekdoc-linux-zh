    The XOOPS team has written a very comprehensive installation guide that not only
    how you walk through the installation and setup process, but also gives the developer
    detailed information about what files are going where, and why. You can read it
    at http://docs.xoops.org/modules/xdoc/index.php?doc=xu-00&lang=en.


    A few things to point out before install:


    +   - After unzipping the tar file, you will need to copy the folder to the website
