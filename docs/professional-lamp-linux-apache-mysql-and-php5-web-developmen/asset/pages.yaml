    # XMLHttpRequest


    Even the methods now referred to as "AJAX" are not new. Microsoft''s version of
    the interface, XMLHTTP, has been available as an ActiveX object in various incarnations
    since a preview release of IE 5.0 in 1998 (the final release of IE 5.0 was in
    March 1999). Companies have been capitalizing on this development in IE-only environments
    for slightly longer before the release of version 1.0 of Mozilla''s browser product,
    a native object, modeled after XMLHttpRequest and named XMLHttpRequest has been
    available: Safari (since version 1.2), Opera (since version 8), and Konqueror
    have included compliant interfaces, also named XMLHttpRequest.


    In the last few months, the use of XMLHttpRequest and its variants has increased
    dramatically. The adoption of the technology by Google in their Google and Gmail
    product offerings has been primarily responsible for introducing the development
    method to the masses. Additionally, an Adaptive Path coined the term "AJAX" allowed
    developers to refer to the collection of technologies with one unifying name,
    which has facilitated communication and awareness of the subject.


    # The Interfaces


    The following are some of the XMLHTTP and XMLHttpRequest interfaces that are relevant,
    and for most part, supported in all browsers:


    +   - abort(): Aborts a request.

    - getResponseHeader(key): Returns the value of the HTTP response header key.

    - open(method, uri, [async, username, [password]]): Sets the HTTP request to method
    and the request URI to uri. Optionally, it sets the flag indicating whether or
    not to process the request asynchronously as async, and sets a username and password
    for use for authentication, if necessary. The method attribute is typically get
    or post. Using post is appropriate if you are pushing data in the request (use
    the send() method). In almost all cases, async should be left to its default value
    true.


    277'
