    \ executing, which automatically calls the destructors for objects.\n\nOne thing\
    \ to keep in mind is that unlike constructors, which can have parameters, destructors\
    \ can have no parameters.\n\n# Static Keyword\n\nSometimes using object-oriented\
    \ programming, you might need to access a method of a class, without the need\
    \ to create a full-blown object. To fill that need, PHP5 has the static keyword.\
    \ New to PHP5, the static keyword allows class properties and methods to be available\
    \ without instantiating the class. To make a class member static, just add the\
    \ static keyword between the visibility and property or method definition, like\
    \ so:\n\n```\n<php\nclass Circle {\n    public static function calcArea($r) {\n\
    \        return pi() * pow($r, 2);\n    }\n}\n```\n\nUsing the newly created static\
    \ property, you simply use the class name, followed by two colons, then the property\
    \ name or method call:\n\n```\n$r = 5;\necho \"Given a radius of \" . $r .\n\"\
