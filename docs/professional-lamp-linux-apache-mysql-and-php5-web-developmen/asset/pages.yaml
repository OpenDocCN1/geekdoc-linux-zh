- img_proc: true
  md: '# Chapter 6


    Here, you''re telling Apache and mod_auth_mysql to authenticate users against
    your apacheauth database. Apache will be logging into the database using the apache
    account you created earlier, and you''re also telling mod_auth_mysql to hash the
    given password with SHA1, before matching against the value in the database.


    At this point, you should be able to log into the protected area a web browser,
    supply the user credentials added to the user_info table (tester:testpass), and
    be successfully authenticated in the directory.


    While this example is rather and stripped down, mod_auth_mysql actually provides
    a boatload of configuration options, so you can customize your authentication
    for nearly any situation. The following sections describe some of the configuration
    options.


    # AuthMySQLEnable On | Off


    This enables or disables mod_auth_mysql authentication, without having to remove
    or unload the module from Apache database.


    # AuthMySQLHost localhost | ipaddress


    This is the hostname or IP address of the MySQL database server. If your environment
    runs Apache and MySQL on different machines, the default value is localhost, so
    machines running Apache and MySQL can usually ignore this setting.


    # AuthMySQLPort port_number


    This is the TCP/IP port on which MySQL is listening. The default value for MySQL
    is port 3306, but it can be changed. The default value for this is also 3306,
    so the option needs to be specified only if MySQL is listening on a nonstandard
    port.


    # AuthMySQLSocket socket_file_path


    This is the UNIX file used to access MySQL on a UNIX machine. The default value
    is /tmp/mysql.sock, and like AuthMySQLPort, it needs to be used only in nonstandard
    installations.


    # AuthMySQLUserid


    This is the user ID to access the MySQL database holding the authentication information.
    Most database systems do not allow users or the Apache process to access the database
    without a proper user/password combination, so this along with AuthMySQLPassword
    to a non-root user account that has access to the authentication tables. At a
    minimum, the user will need SELECT to access the authentication tables.


    # AuthMySQLPassword


    Used in conjunction with AuthMySQLUser, this option specifies the password for
    the user account accessing the MySQL authentication tables.


    # AuthMySQLDBname


    This is the name of the database in MySQL that holds the authentication tables.
    If no name is specified, the default value of test will be used.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# AuthMySQLUserTable table_name


    This is the name of the database that holds the usernames and passwords. If no
    table is specified, the default of user_info is used.


    # AuthMySQLNameField column_name


    This is the name of the column in the user table (AuthMySQLUserTable) that holds
    the usernames. When creating the table in MySQL, ensure that this column has an
    index or key, ensuring each value is unique. the length of the column is whatever
    you decide it should be in MySQL. The default is user_name.


    # AuthMySQLUserCondition


    When mod_mysql performs a user lookup, it performs a simple SELECT statement,
    with any criteria needed to perform a hash. The AuthMySQLUserCondition field allows
    you to specify extra parameters to be used in the WHERE clause of the SQL statement.


    # AuthMySQLPasswordField column_name


    This is the name of the column in the user table that holds the users'' passwords.
    The length of the column in MySQL should be at least as long as the encrypted
    password hash. The default for AuthMySQLPasswordField is user_password.


    # AuthMySQLPwEncryption none | crypt | scrambled | md5 | aes | sha1


    This is the method of encryption used when encoding passwords in the database,
    as follows:


    +   - none: No encryption/plain text

    - crypt: UNIX crypt() encryption

    - scrambled: MySQL PASSWORD() encryption

    - md5: MD5 hashing

    - aes: Advanced Encryption Standard (AES) encryption

    - sha: Secure Hash Algorithm (SHA1)


    If no value is specified, the default value of crypt is used.


    When using password encryption, make sure the password field in your MySQL tables
    is a BLOB type, not a CHAR, VARCHAR, or BINARY type. Unless the column is one
    of the BLOB variables, MySQL will strip any extra encoded characters from the
    encrypted passwords—and you''ll never be able to match the given password to the
    database values.


    # AuthMySQLSaltField


    This allows you to specify one of three values to use as the "salt value" when
    encrypting passwords. A value of <> mod_mysql to use the password itself as the
    salt field. A value of <string> uses the value of string as the salt field. Any
    string not surrounded by less-than/greater-than symbols is treated as the name
    of a database column, the value of is used as the salt field.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Chapter 6


    # AuthMySQLTable


    This is used to set the name of the table containing group information, when Apache
    is told to check groups instead of individual users (require group require valid-user).


    # AuthMySQLGroupCondition


    Similar to authMySQLUserCondition, this directive allows you to specify conditional
    statements to include in the WHERE clause when matching user groups.


    # AuthMySQLGroupField


    This is the name of the database that contains the group names. This field is
    used when matching groups using Apache''s group directive.


    # AuthMySQLAuthoritative


    This tells Apache whether or not to fallback to other modules by MySQL authentication
    fails.


    # Apache and SSL


    Protecting your web folders with Basic Authentication using either httppasswd
    or mod_auth_mysql increases security. Unfortunately, added layer of security afforded
    by Basic Authentication can be eliminated by a sinister hacker looking to break
    into your system. The problem: when you use Basic Authentication on a standard
    server, the username and password are actually transmitted unencrypted from the
    client to the server. A network-savvy hacker can be monitoring the transmission
    between your server and the client, and sniff out the plain-text passwords as
    they wing.


    The solution: encrypt the communication between the client and the server. In
    Apache, this can be achieved by using Secure Sockets Layer (SSL). SSL in Apache
    comes in the form of mod_ssl, an Apache module that SSL-enables a website that
    Apache controls, allowing communication to and from Apache to be encrypted using
    a range of encryption schemes.


    To enable SSL in Apache, first to see if SSL is included in your Apache binary
    or as a load-module:


    ```

    /path/to/httpd -l

    ls /path/to/apache/modules/

    ```


    If you don''t see mod_ssl.c in the first command output or mod_ssl.so in the listing
    of the Apache modules, you''ll need to build Apache SSL functionality yourself.
    To statically enable SSL, add -enable-ssl to your configure script when building
    from source:


    ```

    ./configure \ \

    --enable-ssl \ \

    # ...and any other configure settings you use

    ```


    154'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Apache Tricks


    If you want to use the dynamic module instead, just add enable=shared at the end
    of the SSL-enabling line:


    ```

    ./configure \\

    --enable-ssl=shared \\

    # ...and any other configure settings you use

    ```


    Then, build and install the new Apache binary and modules using make and make
    install. If you build Apache as a dynamic module, enable it in httpd.conf by adding
    the following line in the global configuration-section:


    ```

    LoadModule ssl_module modules/mod_ssl.so

    ```


    Now you might be thinking it''s time to restart Apache and configure Apache, but
    you''re not quite done setting up your SSL. Before SSL will work, you need to
    have a server key and server certificate that be used to encrypt data, and present
    the client/browser with an SSL certificate.


    In the next few steps, you will create your own self-signed certificate for your
    web server. If you already have an SSL certificate from a bona fide Certificate
    Authority (CA), you should use that if possible. What exactly is the difference,
    you might wonder? Any self-signed certificate is not considered secure, and will
    trigger a warning in a user''s browser, something like "Your browser does not
    recognize the Certificate Authority that issued the site''s certificate." A certificate
    from a proper CA is recommended if you''re doing any sort of ecommerce or secure
    transaction.


    To begin the certificate process, start by creating a private key and certificate
    request:


    ```

    openssl req -new testcert.csr

    ```


    This shows the following on the screen, prompts:


    ```

    Generating a 1024 bit RSA private key

    ****************

    ****************

    ****************

    writing new private key to "privkey.pem"

    Enter PEM pass phrase:

    Verifying - Enter PEM pass phrase:

    ```


    You are asked to enter information that will be incorporated into your certificate
    request.

    What you are asked to enter is what is called a Distinguished Name or a DN.

    There are quite a few fields but you can leave some

    For some fields there will be a default value,

    If you enter '' '', the field will be left blank.


    ```

    Country Name (2 letter code) [AU]:US

    State or Province Name (full name) [Some-State]:Ohio

    Locality Name (eg, city) [:Cincinnati

    Organization (eg, company) [:Internet Widgets Pty Ltd]:TestSSL

    Organizational Unit Name (eg, section) [:SSL Testing Department

    Common Name (eg, YOUR name) [:www.example.com

    Email Address [:youremail@example.com

    ```


    155'
