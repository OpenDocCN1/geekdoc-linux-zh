  md: "# Chapter 2\n\n```\n<?php\n\nclass Circle\n{\n    public $radius;\n\n    public\
    \ function __construct($r)\n    {\n        // Perform actions when object is created\n\
    \        echo \"A circle object is being created.\\\\n\";\n\n        $this->radius\
    \ = $r;\n    }\n}\n\n$c = new Circle(10);\nn?>\n```\n\nIn this example, you've\
    \ simply provided a radius parameter when creating the object — 10 in this case\
    \ — which is automatically interpreted by the constructor, in which turn sets\
    \ the radius of the circle when instantiated.\n\nNow that you have a way to perform\
    \ actions when an object is destroyed, you'll look at a way to perform additional\
    \ actions when an object is destroyed. PHP now includes a special method that\
    \ is called when an object is destroyed, referred to as, logically enough, a destructor.\
    \ An object's destructor is called when all references to an object are removed,\
    \ or it is manually destroyed in your code. Destructors are often used for clean-up\
    \ tasks, such as closing database connections and releasing file handles. To create\
    \ a destructor, add a method to your class, and call it __destruct():\n\n```\n\
    <?php\n\nclass Circle\n{\n    public function __construct()\n    {\n        //\
    \ Perform actions when object is created\n        echo \"A circle object is being\
    \ created.\\\\n\";\n    }\n\n    public function __destruct()\n    {\n       \
    \ // Perform actions when object is destroyed\n        echo \"A circle object\
    \ is being destroyed.\\\\n\";\n    }\n}\n\n$c = new Circle();\n\n// Destroy the\
    \ circle object\nunset($c);\n?>\n```\n\n26"
