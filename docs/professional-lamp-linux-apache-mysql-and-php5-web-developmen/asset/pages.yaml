    The manual states repeatedly that if you''re actually using any of the features
    of regular expression syntax, PHP''s other string functions are likely to be faster
    than the regular expression functions. Don''t split("//+\


    # Regex Syntax


    Speaking of regular expressions, careful design can improve their performance
    as well. Entire books could and have been written on the subject of regular expressions
    and how to write them; for now, keep in mind that the PCRE preg_match() and the
    like provide a richer syntax and smarter engine than the POSIX functions like
    preg().


    # unset()


    Okay, so PHP will clean up variables as they go out of scope; they''re local variables
    at the end of the function, or else else at the end of the script. Generally,
    this means you don''t have to worry about it.


    But if you''ve got a huge structure (around thousands of elements, for example)
    that you are not going to use again, and especially if you''ve got more large
    data to handle in a moment, then you should unset the thing as soon as you''re
    finished. The big lump of free memory that results is then immediately available
    for other uses. On a busy server, freeing large lumps of memory when possible
    could make the difference between fitting everything in RAM and resorting to virtual
    memory on disk.


