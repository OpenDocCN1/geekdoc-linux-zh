- img_proc: true
  md: "# Chapter 2\n\nFinally, the protected keyword specifies that the property or\
    \ method is available only within the defining class, and any other classes that\
    \ extend or inherit from the defining class. Extending and inheriting classes\
    \ are discussed later in the chapter.\n\nWhen reusing PHP4 classes under PHP5,\
    \ it is important to keep in mind that properties defined with the var keyword,\
    \ such as $propertyname, will be treated as public, and an E_STRICT warning is\
    \ issued.\n\nSpecifying the visibility for a class member is as easy as putting\
    \ the appropriate prefix in front of the property or method declaration. In the\
    \ class that you defined earlier, all class members were defined as public. Now\
    \ you're going to change some of the old class members to private, and add some\
    \ new methods.\n\n```\n<?php\nclass Circle {\n    private $center = array('x'\
    \ => 0, 'y' => 0);\n    private $radius = 1;\n\n    public function setRadius($radius)\
    \ {\n        $this->radius = $radius;\n    }\n    public function setCenter($x,\
    \ $y) {\n        $this->center['x'] = $x;\n        $this->center['y'] = $y;\n\
    \    }\n\n    public function calcArea() {\n        return pow($this->radius,\
    \ 2);\n    }\n}\n```\n\nInstead of leaving the properties as public, you changed\
    \ them to private and created functions to set their values. In simple situations\
    \ like this, it is practically overkill to do so, but if you were to expand the\
    \ application, the set functions could be used to do complex calculations on data\
    \ before setting the internal values. Such a separation can also add a layer of\
    \ protection to the private members by validating the provided values before allowing\
    \ the internal data to change.\n\nYou can use your modified class with the following\
    \ code:\n\n```\n$c = new Circle();\n$c->setCenter(0,0);\n$c->setRadius(10);\n\n\
    echo \"The area of the circle is \" . $c->calcArea() . \"\\n\";\n\n// Attempt\
    \ to access a private property\necho \"The private value of radius is \" . $c->radius;\n\
    \n?>\n```"
