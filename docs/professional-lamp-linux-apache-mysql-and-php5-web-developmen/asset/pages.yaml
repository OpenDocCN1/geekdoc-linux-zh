    The upsides of this technique are:\n\n+   - It allows for sending and receiving\
    \ of data to the server without full-page refresh.\n\n+   - It can trigger retrieval\
    \ of data by main application as soon as the data are available.\n\n+   - It's\
    \ simple to use and debug, as all data the application is using is clearly visible\
    \ in the source of the hidden frame.\n\n+   - It can receive graphical data, but\
    \ support for JavaScript variables as image sources is only partially supported\
    \ in browsers (IE, for example, likes only XBM image data assigned like this).\n\
    \n+   - Because frame adds a browser history entry, the user can use the back\
    \ button. However, the behavior of the back button might not be what the user\
    \ expects.\n\nThe downsides are:\n\n+   - It introduces usability problems, such\
    \ as the inability to easily bookmark an application state.\n\n+   - It can partially\
    \ communicate errors by resubmitting requests after a timeout period.\n\n+   -\
    \ The hidden frame's contents could easily be manipulated by the user (this is\
    \ always a concern, but it is somewhat easier for the user to do this with the\
    \ hidden frame technique).\n\n+   - Only one request per hidden frame can be dispatched\
    \ at a given time (which is a downside if the response is important).\n\n# Hidden\
    \ IFRAME\n\nSimilar to the hidden frame technique the hidden IFRAME technique.\
    \ Instead of using a hidden frame within a frameset, this method uses an invisible\
    \ IFRAM element, changing its source location to issue requests and receive responses\
    \ from the server. Google Maps uses this technique to communicate with the server\
    \ without a page refresh."
