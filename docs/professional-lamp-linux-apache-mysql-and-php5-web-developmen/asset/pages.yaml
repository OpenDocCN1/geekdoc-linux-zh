  md: "# Chapter 3\n\nChecking the PHP manual, the appropriate function would appear\
    \ to be imageellipse(). The only difference between your data and its arguments\
    \ is that it expects a width and height, while the supplied data contains only\
    \ a radius. That's a trivial difference. First, define:\n\n```\nfunction imagedapoint($image,\
    \ $datapoint)\n{\n    width = $height = $datapoint[2]*2;\n    imageellipse($image,\
    \ $datapoint[0], $datapoint[1], $width, $height);\n    $datapoint[3];\n}\n```\n\
    \nThen call it:\n\n```\nforeach($datapoints as $datapoint)\n{\n    imagedapoint($image,\
    \ $datapoint);\n}\n```\n\nThat's actually quite straightforward. imagedapoint()\
    \ of course have been more readable had each data point an associative array or\
    \ an object; something that identified its components by name. One could ask you,\
    \ how is the loop outside the function? Indeed, you will be more likely to plotting\
    \ datap points on a chart of just one of. Here's an example:\n\n```\nfunction\
    \ imagedapoints($image, $datapoints)\n{\n    foreach($datapoints as $datapoint)\n\
    \    {\n        width = $height = $datapoint[2]*2;\n        imageellipse($image,\
    \ $datapoint[0], $datapoint[1], $width, $height);\n        $datapoint[3];\n  \
    \  }\nimagedapoints($image, $datapoints);\n```\n\nBut how might array_walk() do\
    \ it first? It uses a callback function. This is effectively the body of the previous\
    \ loop.\n\n```\nfunction imagedapoint($datapoint, $key, $image)\n{\n    width\
    \ = $height = $datapoint[2]*2;\n    imageellipse($image, $datapoint[0], $datapoint[1],\
    \ $width, $height);\n    $datapoint[3];\n}\n```\n\nThen it makes the following:\n\
    \n```\narray_walk('imagedapoint', $datapoints, $image);\n```\n\nUnlike array_map(),array_walk()\
    \ works on a reference to the original array. So if the callback function takes\
    \ its element argument by reference, the element's value can be modified by the\
    \ function and the change will be reflected in the back array to array_walk()."
