  md: '# Code Efficiency


    you serve stuff? It''s often instructive to use the two by side: ab to see how
    your performance looks, and top to see how much effort is going into that performance.


    You run top on the web itself, of course; ab can be in the same place, but for
    fairness''s sake it''s worth running it another machine on the local network (running
    it more than once would introduce additional delays that would hinder your attempts
    to stress the server). For example, you could open a terminal window on your workstation
    and run ab to the web server; running ab on your workstation and top with the
    two terminal windows side-by-side.


    Put simply, ab is an http client on speed. A typical invocation has it requesting
    the page thousand times in close succession, simulating a thousand users hitting
    it nearly at once. Gather statistics on how long the server takes to respond to
    the requests, and whether any failed to be satisfied. Take a look at this example:


    ```

    ab -n1000 -c10 http://bowman/page2test.php

    ```


    This command tells ab to request page2test.php a total of one thousand times,
    with up to ten requests concurrently. So it makes ten requests, and as soon as
    one of them is satisfied and the response has been received, it starts another
    one, not letting up until the total has been reached.


    After it has made one thousand requests, it presents a report of the statistics
    it has gathered. It includes the time for the whole run, the size of the response,
    how many requests were made and how many failed, how rapidly it had been able
    to make requests (corresponding to the rate at which responses were served) in
    bps, and how long the average response time.


    It''s important for benchmarking to adjust the request parameter -n- and large
    enough for the overall statistics to be smoothed out, without any transient behavior
    at the start of the test showing off the results. Twiddling the concurrency parameter
    -c is important. Starting with -c (the lower you set -c, the lower you set -n
    unless you really want to start it and wait that long), you can see if the server
    is capable of responding one request at a time. As increase -c, you increase the
    number of concurrent requests being made, and you can see if your server is able
    to handle the increasing load. As example, if you use IIS that support different
    versions of Microsoft Windows are throttled to a maximum 10 concurrent requests.
    As soon as -c goes above 10 you start failing requests. You can use ApacheBenchmark
    to test other servers; in a way, it''s "Apache" because it''s an Apache Group.
    With increasing load the transfer rate will drop, the rate at which requests are
    made will increase, and eventually requests will start failing. If you''re feeling
    scared, you could simulate using Bashotted: hit your server with -n10000 -c1000
    and watch it have a meltdown.


    Meanwhile, in the other terminal window is the server of what is going on. When
    you run top, the first thing is to look at the load. The three numbers represent
    the average of active processes (that is either running or waiting, as opposed
    to those that are idle) for the past minute, 5 minutes, and 15 minutes, respectively.
    If you think of the server as a bank, process as a teller and the load represents
    people either being served or standing in line. Obviously, if there aren''t enough
    tellers, there will be a lot of irritated people. Likewise, too a high load average
    means that processes are spending too much time queuing for a chance to run. Consequently,
    the people who requested those processes are also having to wait for results or
    their browsers may even give up — not a good look for your site.


    209'
