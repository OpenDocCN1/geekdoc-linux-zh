    | Privilege | Provides |

    | --- | --- |

    | UPDATE | Allows use of UPDATE |

    | USAGE | Synonym for “no privileges”; user can log in but no more |


    The second part of the command ON [resource] is where you specify database level
    and item you are making available. To grant access at the global level, you specify
    *.* as the resource, like so:


    ```

    GRANT [privileges] ON *.* TO [identity]...

    ```


    When you grant access at the database level, you specify the name of the database,
    followed by *. For example, if you wanted to grant access to the testdb database,
    you would use something similar to the following:


    ```

    GRANT [privileges] ON testdb.* TO [identity]...

    ```


    To create permissions for a specific table within a database, you provide the
    name of the database, followed by the table name (separated by a period). If you
    were trying to specify access for the testable table in the testdb database, you
    might use something like this:


    ```

    GRANT [privileges] ON testdb.testable TO [identity]...

    ```


    Granting column-level permissions is slightly different than logical progression
    down the previous three levels. When giving column-level permissions, you must
    specify a column list in parentheses after each privilege in the list, such as:


    ```

    GRANT SELECT (column), INSERT (column) ON testdb.testable TO [identity]...

    ```


    When you specifying column-level privileges, you must use the full table-level
    syntax after ON, or MySQL will return an error.


    The last part of the GRANT command, TO [identity]..., is where you specify the
    access permissions will be granted, and any optional requirements the user must
    meet to be granted this access. The minimum you must provide is ... In MySQL,
    each distinct user must have at least basic permissions set for their username
    and the localhost. For example:


    ```

    GRANT USAGE ON *.* TO tester@localhost

    ```


    Here the user ''tester'' has granted basic access globally, which is equivalent
    to no access at all, but the user is now known to the system. A localhost account
    is created, you can create additional access accounts for the same username at
    any remote host you host:


    ```

    GRANT SELECT ON testdb.* TO tester@192.168.1.2

    ```


    It should not be MySQL when you try and create a remote access account for a user
    without a localhost entry first. Your applications, however, probably will—they
    might not be able to connect remotely, and it’s a common source of hair-pulling
    when first getting used to the MySQL access system.'
