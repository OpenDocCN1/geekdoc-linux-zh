  md: '# Caching Engines


    In addition to being a PHP optimizer and caching engine, you can use eAccelerator
    to accelerate your PHP scripts, so you can redistribute the encoded version to
    clients who have eAccelerator installed, without fear of code snooping.


    > As other PHP encoding solutions, when files are encoded with eAccelerator, they
    are nearly impossible to decrypt using standard tools. They can, however, be reverse-engineered
    using debuggers and disassemblers on the PHP engine itself, but usually such an
    effort is not warranted by the possible reward.


    # Installing eAccelerator


    Like APC, eAccelerator can be installed as a DSO, using the following process.
    First, download a copy of the source code, available at http://eaccelerator.net.


    > Unfortunately, this time eAccelerator is not compatible with the CGI binary
    version of PHP. If you run the CGI binary version, this section is for information
    purposes only.


    Extract the tar that you downloaded, and then go to the newly created directory:


    ```

    tar -xzvf accelerator-0.9.3.tar.gz

    cd accelerator-0.9.3

    ```


    Run your copy of phpize in this directory (again, change paths accordingly):


    ```

    /usr/local/bin/phpize

    ```


    Then, configure the source, and build the binaries:


    ```

    /configure \

    --enable-accelerator=shared \

    --with-php-config=/usr/local/bin/php-config

    make

    ```


    After the build completes, install the DSOs, as root:


    ```

    make install

    ```


    Next, you need to provide a place for eAccelerator to put temporary files. Create
    an eacceler directory in the /tmp folder:


    ```

    mkdir /tmp/eaccelerator

    chmod 0777 /tmp/eaccelerator

    ```


    Finally, add the following to php.ini, and then restart Apache:


    ```

    extension="eaccelerator.so"

    ```


