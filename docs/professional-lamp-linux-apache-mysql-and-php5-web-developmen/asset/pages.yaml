- img_proc: true
  md: "# Chapter 9\n\nFor robustness and effectiveness, Zend's product is obviously\
    \ going to be hard to beat, but its use requires the Zend Encoder to generate\
    \ the bytecode. Note also that APC is distributed as a PECL extension.\n\nWhen\
    \ the program is next called, the cache is retrieved and sent to the Zend engine\
    \ directly, skipping the parsing and compilation stages. All these products will\
    \ check the modification dates of the source file and bytecode file to determine\
    \ if the hash has changed since the last was generated, and re-parse and re-cache\
    \ if necessary. Some, as Zend Optimizer, also can (as the name implies) perform\
    \ optimizations on the bytecode to improve performance, including a number that\
    \ are impossible to emulate in PHP itself (the optimizer is operating at a lower\
    \ level, where one PHP statement may correspond to several instructions that may\
    \ be manipulated independently)\n\nGenerally speaking, a bytecode cache is merely\
    \ a matter of following its installation instructions, with no changes to your\
    \ PHP program's source code. This is often one of the simplest, software-performance\
    \ boosts that can be achieved.\n\nNote, especially in the case of an optimizing\
    \ bytecode cache, the changes in speed of various scripts will change in a nonlinear\
    \ fashion: it is not a matter of every script running 20 percent faster or twice\
    \ as fast. Some will run proportionally faster than others, although the worst\
    \ that can happen is that certain scripts aren't measurably faster. Consequently,\
    \ the results of profiling a site without the cache installed have no bearing\
    \ on the site's profiles.\n\n# Output Pre-Generation\n\nIn contrast to bytecode\
    \ caches, saving generated output for reread does involve changes to your site\
    \ operations. The first given page needs to do determine whether or not it needs\
    \ to run, or if it uses a cached copy of its output.\n\n# PEAR::Cache and PEAR::Cache_Lite\n\
    \nNaturally, PEAR includes packages providing cache output for requests.\n\nCache_Lite\
    \ provides a simple and quick mechanism for storing the output of pages or parts\
    \ of pages as files to be read as required. The following example uses it to cache\
    \ a simple string:\n\n```\n<php\nrequire_once 'Cache/Lite.php';\n\n$id = '42';\
    \ // This is used to identify cache file to use;\n// anything unique that can\
    \ be remembered from access to\n// access will do; if you're caching an entire\
    \ page this way\n// its URL is a natural choice\n\n$options = array(\n    'cacheDir'\
    \ => '/cachefiles/', // Cache_Lite only does file storage:\n    // you'll need\
    \ to specify an\n    // appropriate directory here.\n    'lifetime' => 3600, //\
    \ We'll force an update every hour.\n);\n\n$Cache_Lite = new Cache_Lite($options);\n\
    \nif ($data = $Cache_Lite->get($id)) {\n```"
  merge: -1
  pgno: 250
- img_proc: true
  md: "```\n// Cached copy has been found\nelse {\n    // No copy in the cache; generate\
    \ its contents\n    // and store in $data.\n    $data = \"Hello, World!\"; //\
    \ This could just easily be an entire page.\n\n    // When that's done, save it\
    \ in the cache.\n    $Cache_Lite->save($data);\n}\n// Either way, the output of\
    \ the page is in $data. I presume someone wants\n// to see it...\necho $data;\n\
    ?>\n```\n\nThe most straightforward way you could wrap this around an existing\
    \ script to generate the page and buffer its output. This would mean replacing\
    \ the \"Hello, World!\" with the line following:\n\n```\nob_start();\n/*\n...All\
    \ of your existing script goes here...\n*/\n$data = ob_get_contents();\nob_end_clean();\n\
    ```\n\nThere is nothing to prevent you from using multiple cache files for different\
    \ sections of a single page, or using the same cache in multiple pages.\n\nPEAR\
    \ Cache is more elaborate. Its most prominent difference compared with Cache_Lite\
    \ is that it allows the cache to be implemented in a variety of ways (and you\
    \ could always subclass Cache_Container to create your own). In addition to flat\
    \ file storage, Cache comes with shared memory, the Mohawk Session Handler, and\
    \ databases. It also provides for gzip storage of cached data, and specialized\
    \ caches for storing dynamically generated images and the responses from http\
    \ requests.\n\nIn its most straightforward forward, using PEAR Cache is effectively\
    \ the same as using Cache_Lite. Once again, you need not cache an entire page;\
    \ concentrate primarily on sections that are slow to generate and rarely change.\n\
    \n# Personalized CMS\n\nContent Management Systems themselves provide caching\
    \ themselves. If you decide to write an application for yourself to manage your\
    \ site's contents easier (and why wouldn't you?), then you may wish to do the\
    \ same. Broadly speaking, there are three opportunities for keeping the content\
    \ of the pages synchronized with the contents of the database.\n\n+   Update the\
    \ page when the database content is altered. In other words, your management application,\
    \ as well as updating the contents of the database, generates the page and saves\
    \ the file in the appropriate location, overwriting any older version already\
    \ there. Be aware if the file is deleted for any reason, you'll need to explicitly\
    \ regenerate it—maybe provide yourself the option to \"Regenerate all (absent)\
    \ pages\" in your management application. The generated pages could be PHP scripts\
    \ or static files."
