  md: '# Code Efficiency


    # Client-Side Caching


    Remember that most browsers use a cache. With a little bit of HTTP, you can use
    it—it requires being able to determine either the last time the page changed,
    or knowing the next time they will change.


    If you know the page''s contents were last updated, you can add it as a Last-Modified
    header. Any caching proxies between the client''s browser and your server can
    use this header to decide if any cached copy of the page they hold is current
    (which would be if their cache has the Last-Modified date). Clients can also make
    a HEAD request of a resource and use the Last-Modified header to decide whether
    it''s worthwhile to GET the page itself.


    If you supply an Expires header, you are saying that any cached copy of the page
    is valid until the specified time. With in hand, clients and proxies that cache
    the page can later decide whether to go ahead and request the page anyway.


    For all dates in HTTP headers, the format is the one specified in RFC 2822—that
    is, as returned by date(''r'').


    A header that may include in requests is the If-Modified-Since header. This is
    an RFC-2822 formatted date, and if one is present, your script can (apache_request_headers())
    use this to decide whether to generate and send a full response to the client
    or tell the client that its cached copy is current by sending a 304 Not Modified.
    (A 304 response must not contain any content; headers may still be sent, including
    Last-Modified and Expires.)


    Other cache-control headers exist, and fuller coverage is given by the HTTP specification,
    RFC 2616.


    # Your Own Code


    Aside from wrapping your scripts in more cache-control code, what can you do with
    them to speed them up? This is where the questions of "which is faster" start
    to come up. As you see, you should examine all of these with an empirical eye.


    # Output Buffering


    Output buffering is not just for caching or output post-processing (or clumsy
    "headers sent" errorarounds). Whenever Apache sends data to the user, it does
    so in packets. Each packet has to be wrapped in an envelope so that it gets its
    destination. Sending fewer packets can be faster than sending many smaller ones.
    By buffering PHP''s output, you gather the contents of your page and send it all
    at once, instead of dribbling it few bytes at a time over the course of processing.


    It''s not that simple. When you are dribbling bytes out to the user, they have
    a chance of receiving them sooner, and start to see results quicker, if the page
    loads slowly. They might even find the link they were looking for and click through
    before the browser has finished receiving the document (or if they intend to stay
    on the document for a while, they will surely doing so for longer than the page
    takes to load either way). So you should at least batch up your buffering. Instead
    of sending one huge buffer around your entire script, send several "chapters"
    in sequence; with a chapter ending just before a new block of processing begins.
    Start producing output as soon as feasible. Don''t keep users in suspense.'
