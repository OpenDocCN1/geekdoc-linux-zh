  md: '# Advanced MySQL


    Using the MySQL command-line client is a great way to become familiar with most
    of the commands and functionality of MySQL, which often times might be automated
    in a GUI.


    Enter the following commands to create the database, and call it "VehicleInventory":


    ```

    mysql CREATE DATABASE VehicleInventory;

    ```


    Now you''ve created the database, you need to set it as the active database for
    the remainder of your queries:


    ```

    mysql USE VehicleInventory;

    ```


    Next, create the tables for your database. The basic SQL statement to create a
    table in MySQL is:


    ```

    CREATE TABLE tableName (column_definitions);

    ```


    To create four vehicle information tables, you can use the following:


    ```

    mysql CREATE TABLE Makes (make_id PRIMARY KEY AUTO_INCREMENT, make_name varchar(100)
    );

    mysql CREATE TABLE Models (model_id PRIMARY KEY AUTO_INCREMENT, model_name varchar(200),
    make_id int);

    mysql CREATE TABLE New_Vehicles (vehicle_id PRIMARY KEY AUTO_INCREMENT, model_id
    int, modelyear int, price decimal(10,2), color varchar(200), description text);

    mysql CREATE TABLE Used_Vehicles (vehicle_id PRIMARY KEY AUTO_INCREMENT, model_id
    int, modelyear int, mileage int, price decimal(10,2), color varchar(200), certified
    tintint, warranty tintint, description text);

    ```


    In a nutshell, you use the MySQL CREATE TABLE command, followed by the name of
    the table, and then list the column names and types in parentheses. You''ll also
    note that an auto-incrementing primary key is added to each table, to help you
    uniquely identify rows after they are added.


    # Adding Information


    Now that you''ve created your tables, you need to add some data to them. For that,
    you''re going to use the INSERT statement. The MySQL INSERT command typically
    follows this format:


    ```

    INSERT INTO tableName (column_list) VALUES (new_values);

    ```


    Start by adding initial data to the Makes table:


    ```

    INSERT INTO Makes (make_id, make_name) VALUES (1, ''Ford''), (2, ''Honda''), (3,
    ''Volkswagen''), (4, ''Toyota''), (5, ''Chevrolet'');

    ```


    Here, the basic INSERT syntax is used, but with an added twist: comma-delimited
    set of column values, instead of just one, to populate multiple rows at once.
    Normally, you might leave out the make_id column when inserting into the Makes
    table—the autincremented ID would automatically assign them a number. In this
    case, you specify the ID so the rows you''ll see added to other tables will have
    valid foreign keys.


    75'
