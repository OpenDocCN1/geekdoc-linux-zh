    # # Removing APC


    If there comes a time that you no longer want APC after you''ve installed it,
    you can follow these simple steps to remove it from your PHP installation.


    First, search for the delete extension="apc.so" line from your php.ini file. Alternatively,
    you can just comment it out:


    ```

    ;extension="apc.so";

    ```


    At this point, you can restart Apache, and APC will no longer be active in PHP.
    If you wanted to completely obliterate the DSO from your machine, you can delete
    the apc.so file from your PHP extensions directory once Apache has been restarted.


    # # eAccelerator


    eAccelerator is another compiled-simple PHP caching engine, similar to APC. eAccelerator
    is a fork of the popular TurckMMCache caching engine for PHP4, and is a free encoder
    and optimizer currently maintained by Frank Alcantara and a team of SourceForge
    programmers.


    290'
