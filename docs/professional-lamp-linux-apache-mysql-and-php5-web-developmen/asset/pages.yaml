    # Converting an Existing MyISAM Table


    Creating a new InnoDB table from scratch is all fine and dandy, but you''ve got
    a handful of tables that you''d love to use the InnoDB storage engine. What you
    need is to convert those tables from the default MyISAM table type. Luckily, changing
    the storage engine for a table in MySQL is a simple task—just use the ALTER TABLE
    command and re-specify the engine for a table. To convert the New_Vehicles table,
    which is currently using the default table type of MyISAM, you will use:


    ```

    ALTER TABLE New_Vehicles ENGINE=InnoDB;

    ```


    Run this against your database, and you will see:


    ```

    ERROR 1214 (HY000): The used table doesn''t support FULLTEXT indexes

    ```


    Instead of converting your tables as you''d expect, MySQL has given you an error
    message. As mentioned earlier, InnoDB tables do not support full-text indexing
    in MySQL. If you try to convert a MyISAM table with a defined full-text index
    to InnoDB, you will get this message. For the purposes of this exercise, you''re
    going to delete the full-text index so you can convert the table:


    ```

    ALTER TABLE New_Vehicles DROP index description;

    ```


    And now you should be able to go ahead and convert the table:


    ```

    ALTER TABLE New_Vehicles ENGINE=InnoDB;

    ```


    This time, you should succeed, and you will see something similar to the following:


    ```

    Query OK, 4 rows affected (0.76 sec)

    Records: 4 Duplicates: 0 Warnings: 0

    ```


    # Foreign Keys


    You wouldn''t be able to switch from MyISAM to InnoDB without a good reason, and
    in most cases, foreign keys are as good as any. Once you''ve set up your InnoDB
    table, it''s only a matter of adding a foreign key to enforce referential integrity.
    While it sounds simple on the surface, there are a good number of options to consider
    when creating a foreign key.


    The most basic format of the ALTER TABLE command to create a foreign key looks
    like this:


    ```

    ALTER TABLE [tablename] ADD CONSTRAINT [key_name] FOREIGN KEY ([indexed_column])

    REFERENCES [foreign_table] ([id_column])

    ```


    Starting out, you''re telling MySQL what to change, and how to add (a foreign
    key). Using CONSTRAINT [key_name], you can optionally give the key a name, which
    is often a good idea if you plan on changing the key in the future. The name of
    the column that requires referential integrity follows in parentheses. After that
    is the name of table that will be checked, and the specific column in that foreign
    table to reference.


    To apply this to the vehicle inventory database, add a foreign key refmd to the
    New_Vehicles table, to check the model_id against the model_id column in the Models
    table:


    ```

    ALTER TABLE New_Vehicles ADD CONSTRAINT refmd FOREIGN KEY (model_id) REFERENCES

    Models (model_id);

    ```


