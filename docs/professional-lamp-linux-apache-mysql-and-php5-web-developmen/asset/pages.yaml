    \ same class, you can use the self keyword, in conjunction with a double-colon.\
    \ Using self:: is similar to $this->, but it is for static members only. If you\
    \ wanted to modify the Circle class to use static methods and properties, you\
    \ might do similar to the following:\n\n27"
