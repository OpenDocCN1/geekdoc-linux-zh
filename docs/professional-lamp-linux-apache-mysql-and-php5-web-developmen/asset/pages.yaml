    ```


    If you''re not able to accurately how long of a time frame your script needs,
    and are absolutely sure you have no infinite loops, you can remove the timeout
    completely by setting the value to zero:


    ```

    <?php


    // Will run forever if you''re not careful

    set_time_limit(0);

    ?>

    ```


    When you use `set_time_limit()`, there are two things to keep in mind. First,
    if your server is running PHP in safe mode, using `set_time_limit()` will have
    no effect. You must either disable safe mode, or change the global value in `php.ini`.
    Second, whatever `set_time_limit()` is called, it resets the internal timer to
    0. If your script runs for 15 seconds, and you set the timeout to 20 seconds,
    it won''t exit in 5 more seconds—it will reset the counter to 0 and count for
    a fresh 20 seconds, a total of 35 seconds.


    # Changing Directives


    What if you wanted to change any random runtime configuration setting? To do this,
    you can use the function `ini_set()`. To use `ini_set()`, simply pass the name
    of the setting, and the new value. If the function is successful, it will return
    the old value; if not, it will return false. Use this code:


    ```

    <?php

    echo "Setting error_reporting to E_STRICT...\n";


    $old = ini_set(''error_reporting'', E_STRICT);


    echo "Old value was: " . $old . "\n";


    ?>

    ```


    You should see the following:


    Setting error_reporting to E_STRICT...

    Old value was: 2047


    If you decide you don''t want your changed values anymore, you can use `ini_restore()`
    to reinstate the original values from when the script began execution:'
