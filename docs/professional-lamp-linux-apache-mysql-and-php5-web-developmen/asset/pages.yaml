    \ the following:\n\n```\n<?php\nif (isset($_GET['page']) && is_numeric($_GET['page']))\
    \ {\n    $page = $_GET['page'];\n} else {\n    $page = 1;\n}\n// And so on ...\n\
    ?>\n```\n\nThe previous code simply checks for the existence of a specific $_GET\
    \ value, in this case 'page', and then checks if the value passed is indeed a\
    \ number—if not, a default value of one is assigned.\n\nUsing mod_rewrite, you\
