- img_proc: true
  md: '# Site Security


    To understand the exact flow of the attack, consider the following scenario:


    +   1. The attacker fills out a comment form on a blog or other website. A malicious
    script is included in the comments.


    +   2. The comments are displayed on the page, with the script intact and active.


    +   3. An innocent user visits the site, and reads the attacker''s comments which
    may or may not contain a clickable link.


    +   4. By clicking the attacker''s link, or merely visiting the page, the user
    is asked to verify private information, such as a username or password.


    +   5. The user unknowingly submits the private information, it was requested
    by the legitimate site they were visiting.


    +   6. The user''s stolen is instead routed to a different location on the Internet,
    either to be stored for analysis or the attacker is notified with the new information.


    How can this happen? Cross-site scripting is effective when the "trusted" website
    does not cleanse special characters before sending them as output or markup. In
    the case of web, the less-than symbol <, greater than symbol >, ampersand &, single
    and double quotes, and any UTF-8 character is present in the dynamic output


    Lucky, PHP gives you an arsenal of options to choose from when cleaning your dynamic
    output:


    +   htmlspecialchars(): Escapes ampers, less-than, greater-than, single and double
    quotes, making it a suitable choice for most dynamically generated HTML.


    +   htmlspecialchars(): Similar to htmlspecialchars(), htmlentities will encode
    any special character that has an HTML entity equivalent, in addition to the core
    five covered by html-specialchars()


    +   strip_tags(): Removes all HTML and PHP tags from a string. You can provide
    a list of allowed tags, so you can whitelist "safe" tags, such as formatting,
    and remove any of the more dangerous tags, such as <script>.


    +   utf8_decode(): Converts UTF-8 encoded characters to equivalent ISO-8859-1
    characters.


    # Other Considerations


    Aside from immediately impacting the code you write or how your server is configured,
    there are handful of other issues that must be considered during the design, development,
    and maintenance of your application.


    One of the issues to address is that of keeping your system current and updated
    with all the latest patches. If your operating system has an automated method
    for updating core software, usually a good idea to take advantage of it. Many
    recent web servers have actually exposed flaws in older versions of the software
    — virus and worm writers use vendor-published information about recent patches
    to write their own malicious code they know will affect other versions.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Chapter 7


    Another group that should also be overlooked when updating the system is the PEAR
    and PECL

    packages installed with PHP. Both are easily updated with one simple command:
    pear upgrade-all.

    The key is remembering to run it at regular intervals, or better yet, add it as
    a cron job.


    When coding your queries, there are a couple of small things that can help reduce
    the relici-

    hood of a register_globals exploit or SQL injection attack. First, make sure to
    initialize all variables

    before use; that way there''s no chance that a form or querystring value sneak
    in. Second, make

    turn off any error reporting output on the production web servers. By disabling
    the display of

    er messages, sensitive information might leak when an error occurs, such as a
    syntax error in

    y SQL query, the hostname or IP address of the SQL server.


    Other things that can help maintain the security of your site are not exactly
    anything you can

    or configure. One possible way for a hacker to gain access to your site involves
    a little social engineering

    and little no actual intrusion at all. If you are the administrator of a website,
    responsible for

    the creation and troubleshooting of user logins, you are in a very serious role
    that can be exploited with-

    proper safeguards. In many situations, a hacker needs to call the administrator
    of a website, use the user-

    ame or password for the hapless user, the hacker instantly has a legitimate login
    to the website, without

    any network sniffing or brute-force attack required.


    Another thing that goes a long way towards the safety of the site is frequent
    code/peer review during

    the development cycle. By having your coworkers or peers examine your code, and
    vice versa, you can

    help many obvious security problems be brought to light long before the code actually
    up facing

    the public.


    Last, make sure you keep yourself abreast of the latest security and vulnerability
    news, by frequenting

    security-related sites as Secunia (http://secunia.com/), CVE (http://www.cve.mitre.org/),\and
    CERT (http://www.cert.org/), among others.


    # Summary


    As you can see, there are a fair amount of things to consider when tackling the
    security of your PHP-

    driven website. If you keep rigorous data-cleaning practices, making sure all
    your information is valid

    going in and out of the system, your site will ward off any simple attacker that
    comes at it.'
