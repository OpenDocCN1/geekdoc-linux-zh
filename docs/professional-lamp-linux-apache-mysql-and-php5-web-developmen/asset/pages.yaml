    \ Object\n{\n    [radius] => 5\n}\n\nAssigned:\nCircle Object\n{\n    [radius]\
    \ => 5\n}\n\nCloned:\nCircle Object\n{\n    [radius] => 10\n}\n```\n\nAs you can\
    \ see, $assigned references the $original object, but because you cloned $cloned,\
    \ therefore making a detached copy of $original, its value doesn't change when\
    \ you modify $original.\n\n# Inheritance and Interfaces\n\nOne of the benefits\
    \ of using OOP in PHP is that it allows you to break down your code into logical\
    \ chunks, in order to facilitate reuse. These chunks, when carefully written,\
    \ can be reused again and again, in many different projects, leaving the programmer\
