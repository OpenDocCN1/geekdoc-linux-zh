  md: '# Introduction


    So what''s all the hubbub surrounding LAMP? What is “LAMP” and how do I get one?
    These questions will be answered within the pages of this book. In this case,
    LAMP stands for Linux, Apache, MySQL, and PHP, and has proven to be one of the
    fastest growing ways to develop enterprise-level applications. All these packages
    are open source, and are basically free to use as you wish; the only limit is
    your imagination. In addition, with Open Source technologies you do not only have
    the best minds in the industry working together to provide great packages, but
    also the immense support of the open source community if you come across any troubles.
    After reading this book, you will have an expanded knowledge of LAMP and can put
    it to work as you develop your dynamic websites. Because this is currently the
    only advanced LAMP book available, and a part of Wrox''s Professional Series,
    you can be assured that the information contained within its pages will make you
    a better coder and a step ahead of the rest.


    It should be noted that the term “LAMP” can also include Perl and Python in its
    broader definition, but we have chosen to focus on PHP in this book.


    The goal of this book is to take beginning to intermediate level developer one
    step further, equipping him or her with more advanced-level knowledge of each
    of these modules. We give you the tools in this book to allow you to think “out
    of the box” and find new solutions to old problems.


    # Whom Is This Book For?


    This book is for developers with some experience who want to take their websites
    to the next level. If you''re interested in using Open Source tools to run a dynamic,
    exciting web site, will you find what you need. We assume that anyone reading
    this book has some basic experience in the following areas:


    +   * Web server technology

    * OO coding

    * Database structure, set up, and interaction (retrieving, modifying, and adding
    data)

    * Setting up users and permissions

    * Installing new software

    * Using the command line


    While it is helpful if you have a current LAMP setup that you are familiar with,
    it is not necessary. As long as you are familiar with installing new software,
    you can easily install Apache, MySQL, and PHP together. There are also software
    packages that complete the installation of the three modules for you in one shot,
    such as XAMPP (available at http://www.apachefriends.org/xampp.html).


    After reading this book, you will be able to conquer any LAMP obstacle with confidence,
    have some great ideas for future applications you might wish to write, or rework
    some of your old code with new efficiency and power.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Introduction


    # # What’s Covered in the Book


    A variety of topics are covered in this book:


    +   - A guide to what''s new in PHP 5.0

    - In-depth discussion of OOP in PHP

    - Code efficiency, benchmarking, and improving results

    - Configuring PHP for optimal performance

    - Advanced MySQL queries

    - Apache tips and tricks

    - Site security, locally and remotely

    - Using advanced PHP extensions

    - Common PEAR packages

    - Ajax and PHP

    - Obscure PHP commands

    - CMSs compared and explained

    - Blogging packages

    - A guide for transitioning from other programming languages

    - Caching engines


    # # What You Need to Use This Book


    This book is designed to be used with Linux machines, although much of the information
    in this book can be applied to Windows users as. You will need PHP, MySQL, and
    Apache to the exercises in this book. All three are Open Source programs, so you
    can download and use them free of charge. You will also need a text editor to
    edit your code. Finally, you''ll need a web browser, such as Internet Explorer,
    Navigator, Firefox, Safari, or Opera, to view your web pages.


    As any programmer, software is constantly being improved and debugged, while we
    use the latest and greatest versions of our modules at the time of publishing,
    changes those versions won''t be around. It is important for you to visit the
    source websites for PHP, Apache, and MySQL to get the most updated versions and
    release notes. When developing websites using applications, we recommend that
    you always use the most recent stable release. Using software versions that have
    not been fully tested can be dangerous to your application and leave bugs in your
    code. The same is true for the new learner—you should be learning on a stable
    release of the application, not on a beta version.


    The most recent stable versions that were in effect at the time of this book’s
    writing were:'
  merge: -1
