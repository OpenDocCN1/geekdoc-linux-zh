- img_proc: true
  md: '# Apache Tricks


    skip|S=number

    This flag allows you to skip the number of rules when the current rule matches.
    While the behavior of the skip flag is similar to the chain flag, it behaves exactly
    the opposite manner — skip jumps on a successful match; chain jumps on a failed
    match.


    type|T=mime-type


    If you want to override the MIME type sent for a document, you can use the type
    flag. For example, if you have a bunch of .xml files you want to serve using a
    proper XHTML MIME type, instead of text/html, you could use the:


    ```

    RewriteRule ^.+\.xhtml$ - [application/xhtml+xml]

    ```


    cookie|CO=name:domain=[lifetime:path]

    The cookie flag, as you might infer, sets a cookie on the client''s browser. The
    three required fields — name, value, and domain — specify the name of the cookie,
    the value of the cookie, and the domain for which the cookie is set. The optional
    lifetime parameter represents the life of the cookie, in minutes. The path parameter
    sets the scope of the cookie.


    For example, if you wanted to set a cookie named prevvisit to signify a user has
    visited the home page (and not be bothered with splash slashes), you could use
    this:


    ```

    RewriteRule ^index\.php$ [CO=prevvisit:true:domain]

    ```


    env|E=var:value

    The env flag allows you to set an environment variable var to the value provided.
    The value can also contain regular expression backreferences ($N and %1) for more
    complex variable control. Multiple environment variables can be set in one group
    of flags — they just need to be comma-separated from the rest of the flag list.


    qsappend|QSA


    In most situations when you''ll use mod_rewrite, anything provided as a query-string
    to the original URL is dropped when you perform a rewrite. If you want to preserve
    information instead of dropping it, you can use the qsappend flag. When using
    this flag, the rewrite engine simply takes the original query string and appends
    it to any new query string provided in the rewrite.


    ```

    RewriteRule ^index\.php?foo=bar [QSA]

    ```


    This rule would change the index.php file, using the URL index.php?moo=cow, to
    be index.php?foo=bar&moo=cow.


    In the event that a query-string parameter in the original URL shares the same
    name as a parameter in the RewriteRule, the original value takes precedence.


    137'
