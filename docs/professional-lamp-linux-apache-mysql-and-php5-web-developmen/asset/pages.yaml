    # Creating the Databases


    The first thing you''re going to need to do is create the database and tables
    in MySQL. Begin by starting up your MySQL client at the command line, or if you
    have another program you feel more comfortable with, and can enter MySQL commands
    directly, free to use that.


    ```

    shell$ mysql

    ```


    This will bring the MySQL monitor, which should look similar to the following
    (if you''re using the command-line client):


    ```

    Welcome to the MySQL monitor. Commands with end : or \g.

    Your MySQL connection id is 2 to server version: 4.1.11-log


    Type ''help;;'' or ''\h'' for help. Type ''\c'' to clear the buffer.


    mysql>

    ```


    In many situations, you''ll need to use a login name and password to access the
    MySQL client. To so, just add -u username -p at the end of the mysql command,
    and MySQL will prompt you for the password, like so:


    ```

    shell$ mysql -u username -p

    ```'
