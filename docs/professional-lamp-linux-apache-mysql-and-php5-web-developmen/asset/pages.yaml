  md: '# Chapter 9


    Ideally, you want the load average to be somewhat lower than the number of processors
    your server has, keeping some slack available to handle unusually loads. Brief
    surges are tolerable, but only if they''re brief. The 15-minute load shouldn''t
    surge at all; if it does, then it''s an indication that the server is busy too
    busy, and a backlog forming that takes a long time to work off. A spike large
    enough to significantly influence the 15-minute average could not be dealt with
    quickly.


    Just below the load average in top''s display is the activity level for each processor,
    given as a percentage. This should also stay fairly low, to avoid the Slashhot
    Effect or attack attempts by the latter worm. If there is a dedicated web server,
    then significant activity from the processor when nothing is being served suggests
    that something it shouldn''t be. Check the process list to see which processes
    are using the processor. You may be able to remove some of them. A site that merely
    serves web pages or files would experience very little CPU load at all — a 1980s
    website generator is perfectly capable of transferring data as fast as it can
    be read from—but dynamically generated pages experience a bottleneck at process.


    On the other hand, the server may be running flat out with a nearly idle CPU.
    Check the Windows report generator anecdote, where simple tasks were taking forever
    while the processor spent 85 percent of its time twiddling its thumbs, and the
    determination that the problem lay in the fact there was so little RAM in the
    machine.


    Below top''s CPU usage is a report on the amount of memory available, how much
    is being used, and how much is still free, both in RAM and in the swap file. You
    want to run on the swap file as little as possible, ideally not at all.


    # Hardware Improvements


    So, you''ve decided that the server is running slow. You''ve profiled what''s
    going on and now you''re ready to start making improvements. The most profound
    improvements can come with remembering that your server exists in the real world
    and is subject to physical law. You can''t change the laws of physics: you have
    to accommodate yourself to them.


    The first thing to look at is your connection to the outside world. You need a
    big pipe. If your server is lightly loaded but network traffic is maxed out, then
    your connection is your bottleneck.


    Once that''s dealt with, check the processor. If it constantly running at the
    upper limit of its range, an upgrade could give you more breathing room. How old
    is your memory? Two years? You''ll find that a new box will be twice as fast as
    your current one. Of course, changing the computer is the most fundamental, fraught-with-peril,
    and almost certainly expensive change you can make. It would be nice if you could
    just bring the new box in, swap the cables from the old to the new, perform a
    hard drive transplant, and fire it up. It never seems to work out without simply
    that.


    If the processor is fairly idle, but memory is tight, then increasing RAM is your
    next priority. 512MB is easily sufficient for all the high-volume sites, or sites
    with the largest databases, which are usually cached in RAM by MySQL for speed
    of access.


    For sites that primarily serve static pages or files, RAM is more important than
    processor speed — it''s very simple to just move a chunk of data from one part
    of the machine to another, so being able to quickly work out how to move it is
    not as important as being able to move a lot of it at once.'
