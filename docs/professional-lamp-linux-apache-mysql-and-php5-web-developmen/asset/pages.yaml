  md: 'SOAP: The SOAP extension allows you to write SOAP servers and clients, and
    requires the GNOME XML Library (libxml) to be installed.


    Chapter 8 discusses the XML extensions in greater detail.


    # Tidy Extension


    PHP5 now supports the Tidy library, which is available at http://tidy.sourceforge.net/.
    It assists the coder in cleaning up and perfecting HTML code. This extension is
    available in the PECL library at http://pecl.php.net/package/tidy. For a complete
    list of the Tidy functions and classes available, you can access the PHP manual
    at http://us2.php.net/tidy.


    # SQLite


    Although SQLite was introduced with later versions of PHP, it has been improved
    upon PHP5. SQLite is akin to a mini SQL server. Numerous classes and methods have
    been built into PHP5, and it comes bundled with the installation of PHP5. For
    more information about SQLite, visit the source website: http://sqlite.org.


    # Summary


    While the reworking of the OOP model in PHP5 is undoubtedly the biggest and best
    improvement over PHP4, there are many other areas that have been improved upon
    to make the PHP coder''s life a little easier.


    One of the best aspects of PHP is that it is always changing and growing through
    incremental improvements, as any Open Source language should. The small improvements
    that make up PHP5 will help you work better with MySQL, help streamline your code,
    and give you improved access to the strength of XML. The biggest and best improvement,
    though, is the inclusion of the OOP model. Using OOP instead procedural programming
    will literally change the way you think about code. In the next chapter, you''ll
    find out how to get the most out of this new model in PHP.'
