    \ exist in the previous case where PHP was doing the password hashing. This is\
    \ to prevent any injection attacks or even simple errors where a user's password\
    \ might contain an apostrophe. When hashing the passwords first with PHP, there's\
    \ no need to escape the with addslashes(), because both md5() and sha1() produce\
    \ output consisting only of hexadecimal characters—there's no way an apostrophe\
    \ or other character will change.\n\nTo finish the check_login() function, set\
    \ the return placeholder to true, and create a session variable that you'll use\
    \ in the script to avoid unnecessary repeats:\n\n```\n// Check if a match was\
    \ found\nif (($row = mysql_fetch_array($result)) && $row['count'])\n{\n  $result\
    \ = true;\n  $_SESSION['username'] = $username;\n}\n```\n\n```\n// Close connection\n\
    mysql_close($conn);\n```\n\n```\nreturn $result;\n```\n\nOn the first-time included\
    \ code in the script, you begin by initializing the session data:\n\n```\nsession_start();\n\
    ```\n\nThen you'll first to check if the session variable from check_login() is\
    \ set. If it is not set—meaning the person has not yet authenticated—check for\
    \ the PHP_AUTH_USER server variable and call the check_login() function. The server\
    \ variables PHP_AUTH_USER and PHP_AUTH_PW both exist when PHP attempts to get\
    \ login information using Basic Authentication. If they are not set, the user\
    \ hasn't been prompted for the login information. In this case, you want to prompt\
    \ the user for login information if none has been passed and if the credentials\
