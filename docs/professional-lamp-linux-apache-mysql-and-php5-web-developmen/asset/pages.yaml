  md: '# Chapter 6


    # Enabling mod_rewrite


    The first thing you''ll need to do, before you getting your hands setting up mod_rewrite,
    is to check and see if it''s already installed. At the command line, type:


    ```

    /path/to/httpd

    ```


    Use your own path to Apache''s httpd, obviously.


    If you see mod_rewrite.c listed, it has already been compiled into Apache. If
    not, check to see if it exists as a dynamic module for Apache:


    ```

    ls /path/to/apache/modules/

    ```


    If mod_rewrite.so exists in the file list, then Apache can load it as a module
    with a little tweak to the httpd.conf, file shown later in this section. If it''s
    not compiled yourself package management system your OS uses to install it, or
    if you''re the hands-on type, you can recompile Apache yourself mod_rewrite.


    When enabling functionality in Apache, you have two choices: build statically
    into the Apache binary, or compile the module as a shared object. When building
    the modules statically into Apache, they are available with no extra directives,
    but the module will always be active and consuming whenever Apache is running,
    even if you don''t need it. Building the module as a shared object allows you
    to keep Apache stripped of any “optional” items you may not need, but they must
    be manually configured in httpd.conf. Either method is perfectly acceptable, but
    if you''re unsure of which to choose, the shared module route is a popular choice
    because of its flexibility.


    To build mod_rewrite statically into Apache when building from source, make sure
    your configure file includes --enable-rewrite, like so:


    ```

    /configure \ \

    --enable-rewrite \ \

    # ...and any other configure settings you use

    ```


    If you choose the dynamic module route, just add shared= to the line that enables
    mod_rewrite:


    ```

    /configure \ \

    --enable-rewrite=shared \ \

    # ...and any other configure settings you use

    ```


    Then,s a simple matter of making and installing the server to your system. If
    you built mod_rewrite into Apache statically, you can make your reconfiguration
    worked, by re-running httpd -l. If mod_rewrite.c shows up, it has been successfully
    added to the Apache binary.


    If, instead, you went with the dynamic module, first check to see if it actually
    exists in the Apache directories, as a file called mod_rewrite.so:


    ```

    ls /path/to/apache/modules/

    ```'
