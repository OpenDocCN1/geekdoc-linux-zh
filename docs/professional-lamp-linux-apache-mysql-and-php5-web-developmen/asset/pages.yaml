    \ keep in mind that they behave like static members in the way they are accessed\
    \ — access a class constant, you must use the double-colon (::) syntax. To define\
    \ a class constant, use the const keyword before the constant name, as shown in\
    \ the following code:\n\n```\n<?php\nclass Circle\n{\n    const pi = 3.14159265359;\n\
    \n    public function get()\n{\n        return self::$pi;\n    }\n}\n\necho \"\
    The value of Pi in our Circle class is \" . Circle::pi . \"\\n\";\n\n$c = new\
    \ Circle();\n```\n\n28"
