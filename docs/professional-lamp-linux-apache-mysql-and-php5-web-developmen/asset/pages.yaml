  md: 'The SWFDplayItem object allows a shape, text, sprite, or button to be manipulated
    by being added to a movie by referencing the item using its returned handle after
    being added to the movie. Operations such as skewing, scaling, and moving items
    are all possible operations.


    The SWFFill object is generated by use of the add method of the SWFShape object.
    It allows the fill to be rotated, skewing, and scaling the fill of the shape.


    The SWFont object loads a font for use by the SWFText object. The font can be
    either a definition block (FDB) or a browser-defined font reference.


    The SWFGradient creates a gradient that can then be used by the SWFShape method
    addFill().


    The SWFMorph will take two shapes and the morph into the second shape. This can
    be used for basic animation.


    The SWFMovie object is the one that is necessary for any other objects to work
    correctly, as it is the object that actually writes the Flash out, either to a
    file or to a browser.


    The SWFShape generates a shape. The shape is actually drawn by passing coordinates
    that are drawn with an imaginary pen. With the right coordinates, almost any shape
    can be erased. Also, as mentioned before, this is using the SWFBitmap to add an
    image file to the movie.


    The SWFPprite generates a "movie clip" or animation by adding frames to the movie.
    A frame contains one of the other objects, such as SWFShape. There can be multiple
    SWFPrites objects in a single frame so that two animations are seen at the same
    time. The advantage of adding images to a SWFPprite compared to a SWFMovie object
    is that it encapsulates better for manipulation.


    The SWFText displays text in a Flash animation. An alternative to the SWFText
    object you need to display only small amounts of static information is to use
    images instead of Flash to write the text.


    The SWFTextField is similar to a SWFText object, but with a few differences. SWFTextField
    cannot be rotated or skewed, but can function as form entries.


