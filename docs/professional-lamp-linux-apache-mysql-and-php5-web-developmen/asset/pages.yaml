  md: '# Chapter 11


    For example, AJAX applications exist in one URI namespace. In other words, the
    URI doesn''t change when the user interacts with the application. This makes sense,
    as that''s one of the main selling points of AJAX: the ability to change state
    without refreshing the page or moving to a different page. However, this renders
    the browser''s back button useless and even cause the user to navigate from it
    altogether.


    In 1999 Jakob Nielsen, a well-known usability expert, issued an article indicating
    the top mistakes of web design. The one mistake was disrupting the functionality
    of the browser''s back button. According to Nielsen, the back button is the "second-most
    used navigation feature" after the use of hyperlinks. Workarounds exist to partially
    replicate back-button functionality.


    Another related usability problem is the inability to bookmark a specific application
    state. In traditional applications, an application state is often unique to a
    single URI and can therefore bemarked. An example of this is when a user navigates
    to a product catalog to view detail of a specific product. The user might bookmark
    this page for later. Additionally, the user might want to have a look at the product
    and attempt to send the URI over email. Breaking this bookmark feature can have
    a significant impact on the effectiveness of word-of-mouth advertising. Workarounds
    exist that allow for half of the effort, taking a URI and forwarding it to your
    AJAX application to reconstruct the desired application state. However, for any
    given state, the address bar does not contain this URI, which still leaves the
    problem of communicating to the user how to bookmark the current application state.
    The browser''s bookmarking feature is useless and the application must provide
    other means of bookmarking, utilizing a nonstandard user interface element.


    Work tries to solve these usability and accessibility problems is constantly under
    and advances are being made. The question is often overlooked: Is the usability
    problem from an inappropriate technology? This was the case with problems with
    Flash: developers were trying to implement entire web-based applications with
    Flash. This was a miss; the Flash technology itself, resulted in usability problems.
    The same is the case with AJAX. The technology does a wonderful job with application.
    Google''s Gmail is an excellent example of this. There is very little value in
    being able to bookmark a state in a web-based email client. Additionally, such
    as Google Suggest, users can bookmark a state in Google Suggest. A web-based client
    would not benefit much from all the ability to bookmark a specific application
    state. In contrast, a product catalog suffers greatly if the ability to bookmark
    a state is disrupted. The usability of a content management system would suffer
    greatly if the display of a article could not be marked.


    The temptation to use AJAX techniques to any web application is understandable.
    However, many web applications will be harmed by the use of AJAX. The generality
    among applications that naturally tend to benefit from AJAX is that they are desktop
    applications. Gmail is a web-based version of an email client, which has previously
    performed best as a desktop application (indeed, the real reason for web emails
    was about the ability to access it from anywhere). Google Suggest acts very like
    forms that have traditionally been in desktop applications. With the exception
    of AJAX applet and similar solutions, applications have been almost exclusively
    desktop applications. Developers have attempted to make pure markup and JavaScript
    versions of applications, but these applications do not compare to their native
    counterparts.


    While there are exceptions, a good rule of thumb is that AJAX is good for taking
    traditional desktop applications or elements or creating a web-based version.
    It opens up new possibilities for web applications, but not necessarily beneficial
    positions. You might take care when deciding


    284'
  merge: -1
