    zlib.output_compression = on: Setting zlib.output_compression to all PHP to compress
    the output data using the zlib library, before sending it to the end. This has
    a similar effect using mod_gzip or mod_deflate in Apache: the output bytes are
    reduced, improving transfer time over the Internet.


    # New PHP5


    In addition to the greatly improved object introduced in PHP5, a handful of new
    configuration settings were added. New to PHP5 are the following:


    +   - mail_force_extra_parameters


    +   - register_long_arrays


    +   - session.hash_function


    +   - session.hash_bits_per_character


    +   - zend.zel_compatibility_mode


    The following sections describe these new directives.


    # mail_force_extra_parameters


    This directive allows you to specify specific values to be passed to Sendmail
    when you sends the mail() function. Normally using the mail() function, you can
    pass a fifth parameter to set extra command-line arguments to Sendmail. When this
    directive is set, any Sendmail command-line arguments specified in the fifth parameter
    of mail() are automatically overwritten by the value set in mail_force_extra_parameters.


    > Any value set for mail_force_extra_parameters is always used when sending mail—in
    safe mode, where the fifth argument to mail() is disallowed.


    # register_long_arrays


    When a form is submitted on a website, PHP takes the values in each of the form
    fields, and places them in two large arrays, named according to the method of
    the form (GET or POST). If the form is submitted GET, an array $_GET_VARS is populated
    with the values, each field having a corresponding named index in the array, in
    addition to an identical array named $_GET that has the same values. This duplication
    is primarily for backward-compatibility—the superglobals $_GET and $_POST* were
    not introduced until PHP 4.1.0, so many older applications still use the older
    $_HTTP_VARS arrays.


    If your applications do not use the older-style arrays at all, you should set
    this to off for performance reasons.'
