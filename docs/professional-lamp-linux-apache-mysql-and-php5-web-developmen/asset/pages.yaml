  md: '# Chapter 1


    # mysqli_result


    This class represents the resultset obtained from a query against the database.
    You use this class to manipulate and display query results.


    The methods available to this class:


    +   - close:Closes the resultset (named mysqli_free_result in procedural programming.)

    - data_seek: Retrieves internal pointer position.

    - fetch_field: Retrieves column information from a resultset.

    - fetch_fields: Retrieves information for all columns from a resultset.

    - fetch_field_direct: Retrieves column information for specified column.

    - fetch_array: Retrieves a row as an associative array, a numeric array, or both.

    - fetch_assoc: Retrieves a row as an associative array.

    - fetch_object: Retrieves a row as an object.

    - fetch_row: Retrieves a row as an enumerated array.

    - field_seek: Retrieves row pointer to a specified field offset.


    The properties available to this class are:


    +   - current_field: Returns the offset of the current field pointer.

    - field_count: Returns the number of fields in the resultset.

    - lengths: Returns an array of column lengths.

    - num_rows: Returns the number of rows in the resultset.


    As you can see, the new mysqli class can assist you in writing more efficient
    code, and give you additional flexibility and control over the MySQL functions
    available in PHP 4.


    # XML Support


    PHP5 saw an improvement over PHP4''s XML libraries. There are several new XML
    extensions that have been using for improved standardization and maintenance:


    +   - DOM: This new set of functions replaces the DOMXML functions from PHP4.
    They have been reworked to follow DOM Level 2 standards put by the W3C.

    - XSL: Formerly known as the XSL extension, this extension assists in transforming
    one XML file to another, using the W3C''s XSL stylesheet as the standard.

    - SimpleXML: This set of functions allows you to extract data from an XML file
    simply and easily. You can manipulate, display, and compare attributes and elements
    using the common array foreach().'
