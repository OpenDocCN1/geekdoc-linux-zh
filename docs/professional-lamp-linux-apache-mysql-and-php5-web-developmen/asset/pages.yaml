    # Exploring PECL


    While PECL isn''t as extensive as PEAR, it''s not to say it is without merit.
    Documentation and breadth of function of available packages is more limited than
    PEAR. Many of the PECL packages are still in beta phase and are experimental;
    thus using these packages may take some getting used to. However, there are very
    helpful, if not specific, packages held within PECL walls, and we''ll take a quick
    look at some the more popular packages to give you an idea of what they hold.
    If you would like a more detailed explanation of a PECL package, we have done
    that with PDFLib in Chapter 10.


    # Fileinfo


    Fileinfo PECL package is one of the top downloads at the PECL site, and it''s
    just downright useful. With this extension, you can glean all of information about
    a file, such as MIME types. This package can be downloaded at http://pecl.php.net/Fileinfo.


    Documentation on this package is limited, as is the case with many of the PECL
    packages; however, there is a wiki document that briefly touches on the package
    at the PHP Wiki (http://www.wiki.cc/php/Fileinfo).


    # PDO


    At the time of writing, PDO is still in beta phase and considered to be experimental,
    but it holds great promise for the future of PHP regarding database interaction.
    The purpose of this package is to interface with Data Objects and you to change
    database objects at the drop of a hand. Instead of having to code using database-specific
    functions (mysql_connect and pg_connect, for example), you can create a new PDO
    object that will take care of that. You can then change from MySQL to Postgres
    (or numerous other databases) by simply changing a parameter during object instantiation.
    You can download PDO at http://pecl.php.net/package/PDO.


