    # Ming


    Ming is a third-party extension to PHP that allows a user to create Shockwave
    Flash files without actually having to use Macromedia Flash studio. The functionality
    Ming provides isn''t always what is available in Macromedia''s Flash, because
    of the nature of how Flash files are created using PHP and Ming. Ming provides
    a method to create Flash files that is low on cost and allows for content to be
    dynamically created when it needed.


    # About Ming


    The usefulness of dynamically created Flash files can sometimes be lost for some
    people, especially because you will not have the precise visual control over the
    content layout that people who use Macromedia''s Flash Studio employ, the feature
    set of Ming is limited to that of Flash 4, which is several versions behind the
    latest update. But being able to script the creation and dynamic content to the
    application you''re not using Macromedia''s Flash Studio. This can be helpful
    in distributing content to users who need the features of Flash but also want
    to personalize the content for the user.


    Ming is actually a third-party extension that has PHP wrapper extensions written
    for it, so what needs to be compiled into the PHP binary when it is built. Instructions
    for Ming installation can be found on PHP''s website (http://www.php.net/ming).
    More information about Ming himself can be found at Ming''s site on SourceForge
    (http://ming.sourceforge.net). There are also many tutorials and examples available
    on the Internet that can help to illustrate the functionality of Ming as well
    as pieces of code that could be used as a foundation to build on your Flash movies.


    Ming is implemented in PHP as objects, so that any time you create a shockwave
    file with Ming in PHP you need to least instantiate an instance of the SWFMovie
    object. This following is some code of how to simply generate a file with Ming
    and PHP. To run this code, insert it into a PHP file with no other content in
    it, and then view it in a browser that has the Flash-plugin installed.


    ```

    header(''Content-type: application/x-shockwave-flash'');

    $swf = new SWFMovie();

    $swf->setDimension(100, 100); // width and length in that order

    $swf->setBackground(0,255, 255); // red, green, and blue integers

    $swf->output();

    ?

    ```


    This does not generate much, but it produces a giant blue screen in your browser.
    Examining the code, you can see some of the necessary pieces that will need to
    be included in any Flash file with Ming. The first line tells PHP to set the Content-type
    header so that the browser knows it is a shockwave file and to load the plug-in
    for it. The next line creates the instance of the SWFMovie object. The next two
    lines are optional, but without them, it would be hard to tell anything was generated,
    as they set the size of the shockwave file as well as its background color. The
    last line tells PHP to write the generated object to the output. The only thing
    to make


