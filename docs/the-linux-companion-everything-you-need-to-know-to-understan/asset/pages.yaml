    SIAG Office has a lot of power where you would expect an open source project to
    have it: in its programmability. It is written around a Scheme interpreter, and
    all the commands and functions built into the various applications are exposed
    so that you can get them by writing in Scheme, Tcl or Guille code. SIAG Office
    supports multiple application languages. As an example of its power, one of the
    example spreadsheets that comes with SIAG itself-


