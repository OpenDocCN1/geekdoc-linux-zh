- pgno: 259
  md: '# # The Linux Companion


    # ## Christopher Lynas


    We are in the midst of a technology shift and it is of spectacular dimensions.
    The cause of this shift is a free operating system that challenges Windows and
    is available to all. The operating system Linux.

    Whether you want to use Linux for business or home use. The *Linux Companion*
    provides everything you need to understand and use Linux. From what Linux is,
    to how you can install, run and utilise it, this is the ultimate guide.

    Linux is at a stage where it deserves serious consideration by every computer
    user. This book tells you why.


    Inside:

    - Why choose Linux?

    - Linux applications, features and desktop environments

    - Moving from Microsoft to Linux

    - What hardware you need and where to get free software

    - Implications and applications for business use

    - Tips, tricks and frequently asked questions


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_259_0.png)


    Whether you are considering changing to Linux or have already made the move, this
    is the book that tells you all you need to know.


    Linux / Operating Systems


    ISBN 0-130-18321-0


    £17.99'
