  md: '# Gimp


    Gimp is an acronym for GNU Image Manipulation Program. It is a freely distributed
    piece of software suitable for such tasks as photo retouching, image composition
    and image authoring. It is effectively an Adobe Photoshop clone for UNIX/Linux
    workstations.


    # WINE


    WINE (Wine is not an emulator) is an OS windows emulation library for UNIX. WINE
    competes (somewhat) with Sun’s discontinued WABI project, which is non-OS. To
    ease the migration to other PC compatibility products on Sun, WABI 2.2 will continue
    to be supported and available from Sun as an unbundled product. WINE is the crucial
    piece of software that allows Windows applications such as Microsoft Office to
    run on Linux. While still a developer’s release, there are numerous examples of
    older versions of MS Office running on Linux using WINE. There are rumours that
    it is even possible to run Lotus Notes clients under Linux with WINE.


    # SAMBA


    SAMBA (www/samba.org/) provides an SMB file server for UNIX. Recently, the SAMBA
    team has managed to reverse engineer and develop an NT domain controller for UNIX
    as well. For most networks, SAMBA’s role can be summarised by saying that Samba
    provides a complete replacement for Windows NT, Warp, NFS or Netware servers.
    The SAMBA home page can be seen in Figure 6.10.


    # Squid


    Squid is a high-performance proxy-caching server (www.squid-cache.org/) for Web
    clients, supporting FTP, gopher and HTTP data objects. It is popular with large
    international ISPs (see Figure 6.11).


    # KDE and GNOME


    These are the open source GUIs that provide a user interface resembling the popular
    Windows or Mac GUIs.'
