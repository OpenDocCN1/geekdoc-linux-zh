    > Did you know that...


    # Link


    A link is a directory to another file; the entry itself does not contain any data.
    A distinction should be made between symbolic links, which contain name pointers,
    and hard links. With symbolic links, it is immaterial if the target file exists,
    and if it references a file or a directory, or even a file on a different system.
    Hard links contain pointers. Hard link can only be referenced within the same
    system, and the target cannot be a directory. In addition, hard links are of equal
    rank (that is, the data of the file remains until the last link is deleted).


    Linuxberg also has copies of the most popular Linux distributions, downloadable
