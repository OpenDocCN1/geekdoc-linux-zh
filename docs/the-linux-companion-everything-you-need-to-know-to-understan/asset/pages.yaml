  md: 'manner as Windows, you will find that the process of installing and accessing
    hardware in Linux is quite different.

    That said, this is a simplified explanation of how device drivers are used in
    Linux. In Linux, device drivers are implemented in one of three ways.


    # The kernel


    In this case, support for the device already exists in the kernel itself. Under
    normal circumstances the device will be automatically detected, assigned a basic
    configuration and made available to the rest of the system. Typically the kernel
    will provide direct support for the hardware necessary to mount the root file
    system. The following hardware is supported in this way: standard VGA monitor,
    generic IDE controllers and disks, motherboard devices and chipsets, serial ports
    and parallel ports.


    # Kernel modules


    A kernel module is a portion of the kernel that exists as a separate file. When
    loaded into the running kernel, the module provides the kernel additional functionality.
    In an effort to reduce the resources consumed by the kernel, non-critical devices
    are supported by kernel ''modules''. Modules can be dynamically loaded and unloaded
    as necessary.


    Modules also provide more flexibility, since they can be independently configured
    and reconfigured without rebooting the system. This flexibility allows us to use
    more user-friendly applications to configure the modules, as the system is already
    running in basic form.


    Modules are often used for devices such as soundcards, SCSI adapters and network
    interface cards (NICs).


    # Applications


    In some cases, both the kernel and an application handle devices. The kernel is
    responsible for the parallel port for printers, while the application provides
    its own driver to handle the specifics of that printer.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_82_0.png)'
