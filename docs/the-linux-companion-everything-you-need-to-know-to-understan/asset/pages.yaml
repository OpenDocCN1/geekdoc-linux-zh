- pgno: 22
  md: '# Introduction


    Now this is not the end. It is not even the beginning of the end. But it is,

    haps, the end of the beginning.


    SIR WINSTON CHURCH 1874–1965


    This epic began in Helsinki in 1991 where Linus Torvalds laid the funda-

    tions in creating an operating system for computers that would shape the

    evolution of civilisation in the twenty-first century. The origins of Linux

    semble the beginning of what some consider the greatest masterpiece that

    the Internet has produced. Aided by thousands of enthusiastic programmers,

    led to a meeting of minds that has now created a far more stable operating

    system than had previously existed.


    The Internet has reinforced its position as the basis of the economy for the

    tenty-first century and will unquestionably become the most indispensable

    technology yet devised by the civilised world. It will change our economic sys-

    tems as we proceed to a paperless society, taking advantage of online shopping,

    ease of communication and all the other benefits the Internet will bring us.


    One of the reasons the Internet is such a global success is because there is

    ot one person, company or government who controls it. As it evolves we shall

    see government authorities regulating it but not controlling its evolution.

    Governments may wish to control it and software companies attempt to own

    and control as much of the Internet as they possibly can. It is in nobody’s inter-

    est to have a monopoly controlling this transformation of our lives.


    There are millions of minds and imaginations in the e-world population who

    have the intellectual capabilities and the programming skills to change the evo-

    l of the e-world, and the thought of their future and their children’s future

    being controlled by any one organisation or government is a clear motivation to

    them to achieve freedom from the shackles of ‘closed’ software. I believe that

    rich software companies in the twenty-first century will see their attempted con-

    trol of the e-world decrease, as more and more individuals and companies adopt

    the more stable, reliable and open source software that Linux offers.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The e-world was not conceived in a software company''s laboratory but in the
    world''s universities and research institutions where unused heroes influenced
    and created what we know as the Internet. The Internet evolved from the world''s
    best computer analysts and programmers. It evolved as everyone connected with
    it freely and openly shared his or her experiences to create a technology that
    could be shared by all.


    The majority of today''s computers run on ''closed'' operating systems like DOS,
    Windows, or Macintosh, which means they are controlled by the company that created
    them. These companies are the only ones who can modify their software programs.
    Linux is the future; the open software aspect of its configuration allows any
    computer programmer to modify the inner workings of their computer just by using
    Linux as their operating system. The global support for Linux coupled with this
    capacity to change an operating system is set to change the whole concept of our
    e-world.


    Linux is a phenomenon of the Internet. Born out of the project of a student it
    has grown to be more popular than any other freely available operating system.
    To many, Linux is a mystery. How can something that is free be important? It only
    reinstates the fact that the best things in life are free.


    In a world dominated by large software corporations, how can something that has
    been written by a bunch of ''programmers'' hope to compete? How can software contributed
    by many different people in many different countries around the world have hope
    of being stable and effective? Yet stable and effective it is and compete it does.
    Many universities and research establishments use it for their everyday computing
    needs. People run it on their home PCs and I would wager that most companies are
    using it somewhere even if they do not always realise that they do. Linux is used
    to browse the Web, host Web sites, write documents, send email and, as always
    with computers, play games. Linux is definitely not a toy; it is a fully developed
    and professionally written operating system used by those who demand the highest
    standards all over the world.


    The Linux concept is based on the fundamental principle that the best and most
    stable software comes from the global exchange of programming knowledge, where
    everyone is free to modify, develop, improve and share the codes they use. The
    global development of Linux is truly phenomenal in its extent and adaptation by
    thousands of supporters of open software. Linux is being developed, because of
    this combined global effort, at a momentous rate. If you visit any university''s
    computer department or computer research institution you find the research is
    on Linux, not Windows or Macintosh systems. It is becoming more and more linked
    to the e-world.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'We are about to see a technology shift of spectacular dimensions. I believe
    that Linux will affect the world economy and every computer-related industry in
    the world. The impact of Linux in the computing world will affect share prices,
    profits, margins and operating costs. Its effects will be immense, as this completely
    new and distinct software model takes control. How will this be? you may ask.
    The stability of the product and the economics of Linux, which is to all intents
    and purposes free, will ensure this. Consider the costs to a business of running
    a Windows NT program. The cost is negated by the adoption of Linux as the operating
    system. The managers of IT departments love the system. When accountants from
    finance departments realise the cost savings involved, they will adore it, because
    the cost of Linux is a fraction of that of competing technologies.


    Companies will find it difficult to hold or recruit the best staff in the programming
    world unless they are willing to accommodate their interest in Linux. Linux is
    more than an operating system, it is a movement, with Linux being adopted by millions
    of serious computer developers around the world. Sony has recently announced that
    Linux will be the operating system that will run the next generation of interactive
    televisions. Linux will provide unprecedented business opportunities to those
    who take advantage of what it offers. It is the stability and economy of the system
    that will convince many Linux is our future.


    Linux and the open source movement have achieved such a global following its impact
    on the future of the e-world will be unquestionable. If you want to understand
    the e-world of the future, get involved today to learn and appreciate what is
    going on.


    In the early days of the e-world, software was complex and formidable. But the
    e-world gradually changed this, providing a technology that anyone could use and
    anyone could learn. Linux is emerging like the early days of the e-world. The
    potential of Linux is enormous; as you start to learn and understand, it will
    grow on you. Visit all the Linux sites I mention in this book. Read and try to
    understand what it all means. I believe that the future of the e-world will be
    found in Linux and the open source movement. As the twenty-first century unfolds,
    bringing with it changes in all our lives, we will come to realise that no one
    person or organisation should control the changes.


    Most people use Linux as a simple tool, often installing one of the many good
    CD-ROM-based distributions. A lot of Linux users use it to write applications
    or to run applications written by others. Many Linux users read the HOWTOs passionately
    and feel the thrill of success when some part of the system has been correctly
    configured and the frustration of failure when it'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'has not. Minority are bold enough to write device drivers and offer kernel
    patches to Linux Torvalds, the creator and maintainer of the Linux kernel. Linux
    accepts additions and modifications to the kernel sources from anyone, anywhere.
    This might sound like a recipe for chaos but Linux exercises strict quality control
    and merges all new code into the kernel himself.


    The majority of Linux users do not look at how the operating system works, or
    how it fits together. This is a pity because looking at Linux is a very good way
    to learn about how an operating system functions. It is not well written, all
    the sources are freely available for you to look at. This is because although
    the authors retain the copyright to their software, they allow the software to
    be redistributable under the Free Software Foundation''s GNU Public Licence.


    I am not a ''techie'' but have written this book from my own experience and the
    knowledge I gained from Linux over the last three years when I realised the potential
    that Linux holds. There are many distributions of Linux and it can be difficult
    to choose a distribution when so many exist. In the main they are all excellent
    but which of these distributions is right for you? That will be your, but I hope
    that after you have read this book you will be in a position to make a more informed
    judgement. I experimented with many and always come back to SuSE. At home Linux
    Torvalds uses SuSE as his Linux distribution on his computer and if it is good
    enough for him it is most certainly good for me. SuSE focuses on product excellence
    and this is reflected in its distribution. After spending some time with the SuSE
    development team in Nuremberg soon is often some messaging involved to get everything
    working correctly. This book has not been written as a technical how-to. In my
    writing, speaking and consultancy functions I do not focus on the technology but
    the implications of the technology. Technology today is impacting on everyone''s
    lives in every direction and people are demanding to know the answers. This book
    does not make any assumptions about the knowledge or experience of the reader.
