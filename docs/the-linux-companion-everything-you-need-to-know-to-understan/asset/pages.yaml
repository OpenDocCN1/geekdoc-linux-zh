    +   7. Virtual machine sessions can be run on the Windows NT desktop or run in
    full-screen mode; other virtual machines continue to run in the background.


    +   8. You can use a key to switch between virtual machines.


    +   9. Operating systems already installed on a multi-boot computer will run without
