- pgno: 124
  md: 'do much with a PC when using VMware.


    With VMware you can not only boot to multiple operating systems, but also run
    them simultaneously. You can run Windows 98, Linux and Windows 2000 on the same
    machine all at the same time, with each OS isolated so not to affect the others.


    VMware is paving the way to a higher level of computing with their Virtual Platform
    software. VMware gives users an innovative solution to platform incompatibility
    that offers flexibility and superior performance.


    # How does VMware work?


    VMware Virtual Platform is a thin software layer that permits multiple operating
    systems to run simultaneously, using the same hardware resources. This is made
    possible by transparently multiplexing all hardware resources into multiple virtual
    machines. Each virtual machine has a unique network address and resembles the
    underlying machine. VMware is installed on a host OS (either Linux or Windows
    NT). Once installed, various OSs can be loaded and run concurrently with the host
    OS.


    Although the ability to concurrently run multiple OSs on the same machine is its
    most advertised feature, that is certainly not all it does. The features of VMware
    are as follows:


    +   1. It can encapsulate a virtual machine and enable it to be freely moved around
    a different physical machine.


    +   2. It provides each virtual machine with fault isolation and containment capabilities,
    meaning that if an application crashes or data corruption occurs in a given virtual
    machine this will not affect data or applications outside of that virtual machine.


    +   3. Developers can use a single machine to write and test applications for
    multiple target environments.


    +   4. Organisations can efficiently install new or upgraded versions of operating
    systems or applications throughout their project, while keeping their current
    operating system and applications intact.


    +   5. All users can work with confidence because they know any changes they make
    to a system can be undone with just a click of a mouse button.


    # Did you know that...?


    # Booting


    Booting is the sequence of computer operations from power-up until the system
    is ready for. In Linux, this entails loading the kernel, which can be seen with
    the message uncompressing Linux... and ends with the login: prompt.'
