- pgno: 55
  md: '# How do you want your Linux?


    Nearly every Linux distribution is available in several forms. The form in which
    you acquire your distribution will have a great deal to do with your skill level
    and stamina as a prospective Linux user.


    Linux as an Internet download is potentially strenuous, especially for modern
    users. Still, for many users, downloading Linux remains the cheapest way to obtain
    it. Beware that installing a distribution this way requires lots of free drive
    space; the user must have space to store Linux as it is downloaded, and then to
    install Linux from the downloaded material.


    ''Glue-in'' Linux distributions on CD-ROM are found everywhere—paperbacks, magazines,
    even as ''bonus disks'' which come with other software. Be warned that these distributions
    are unofficial copies (though they are completely legal), you may find that they
    are different from the official distribution by the same name and, in rare cases,
    they are incompatible in some way.


    Sometimes, glue-in Linux CD-ROM disks actually contain a ''house brand'' distribution
    of Linux, which does not match the behaviour or package format of any of the major
    distributions. While these disks do contain fully-fledged Linux operating systems,
    it is almost certainly better for new users (newbies) to buy a more common distribution,
    so that software and technical support will be more forthcoming.


    I recommend that users use a Linux distribution by visiting the official Web page
    and buying the official disk for whichever distribution they have chosen. Why?
    Because these distributions are the genuine article; they come with boot floppies
    and/or install guides, and users can be certain that they receive the full, compatible,
    supported version.


    Of course, the official box set of any distribution is more expensive than unofficial
    versions; in my opinion, the extra security and support are all worth the price
    for beginners. And the prices may surprise you—even the official versions of Linux
    distributions are considerably cheaper than their Windows counterparts.


    Finally, there are the cheap CDs. These are bare CD-ROM disks, which come in a
    disk sleeve and nothing else. No boot floppies, no documentation and you''re on
    your own. If you are planning to need any help at all installing Linux, and you
    can''t find a person to give you that help, stick to SuSE Linux.


    # Is Linux difficult to use?


    This is a frequently asked question, perhaps because most people have heard that
    Linux is similar to UNIX. UNIX has an image problem. Many people think of it as
    something used by scientists and on powerful and expensive'
