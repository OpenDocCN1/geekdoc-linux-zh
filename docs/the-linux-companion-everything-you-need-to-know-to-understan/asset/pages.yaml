- pgno: 16
  md: '# Foreword by IBM


    # An emerging technology at the crossroads – Linux


    Not since the emergence of the Internet in the early 1990s has a technology generated
    such a buzz in computing circles. Many people are aware that it is an operating
    system for both desktops and servers that offers an alternative to Microsoft Windows.
    It is reputably stable and cost-effective. Most will be able to reel off the clichés:
    it is fast, it doesn''t crash and it is free. But beyond that remains a great
    deal of confusion and hesitancy among business users.


    Undoubtedly the emergence of Linux has caused great excitement among IT journalists
    and analysts, always eager to predict the next big thing in computing. However
    those who actually buy IT for business, or run a business dependent on IT, are
    rightly, somewhat circumspect. They will be asking why the great excitement. Why
    should Linux be considered as an alternative to Windows when they all work. They
    have already invested large sums of money into Windows-based systems on the whole
    work. Why change now when 90% of the world uses Windows? After all, isn''t Linux
    just a toy for needs?


    The truth is that Linux is not at a stage in its development where it does serious
    consideration by business. For the first time in many years there is a credible
    alternative to Windows, certainly on the server side. It is hard however for business
    users to separate fact from fiction. Unfortunately, the IT industry isn''t just
    providing effective solutions to customers. Too often an operating system is seen
    as representing something that is either the right or the wrong way of doing things.


    Talk to anyone involved in IT about Linux and you will soon find that emotions
    run high. One well-known US computer newspaper has almost a weekly battle between
    two of its star columnists as Linux is a good or bad thing which in turn generates
    furious debate among readers. This type of dialectic clouds the issue seriously,
    avoiding as it does the suitability of any operating system to business applications.
    In this sense it harms development'
  merge: -1
  img_proc: true
