- pgno: 67
  md: '# Intranet and Internet


    > Did you know that...?


    # Internet


    The Internet is a worldwide network of interconnected computers. Machines are
    accessed via their IP addresses, which are unique. These IP addresses are structured
    in a hierarchical manner. There are top-level and national domains, domains, sub-domains
    and the addresses of each individual machine. Together with the hardware (such
    as 192.168.0.1), there are aliases (such as helios.cosmos.com), which simplify
    the IP address for the user. It is not only the Internet up and running, but also
    a system of protocols (such as FTP, HTTP, TCP) operating on specific layers. Well-known
    services of the Internet are the World Web (WWW or W3). A very important keyword
    in connection with Internet communication is netiquette, which encourages people
    to behave politely and makes sure everything runs smoothly.


    Whether you are talking about your company-wide intranet or the world-wide Internet,
    Linux is the right choice of platform for your WWW server. The SuSE distribution
    contains many server apache: www.apache.org/ (3.4).


    Nearly one in two servers on the Internet use this versatile and powerful WWW
    server. It boasts extensive functionality and is highly configurable, allowing
    you to accomplish all your requirements. With the help of squid, the proxy server,
    frequently requested documents can be held locally. This reduces Internet traffic
    and speeds up access to used documents.


    Linux is also highly suitable as a mail and news server, being able to act as
    such assorted networks. You can continue to use Microsoft Exchange on a Windows
    client.


    There will soon be a shortage of Internet protocol (IP) addresses on the Internet.
    Internet service providers (ISPs) can only supply a small number of addresses,
    SuSE Linux supports IP-masquerading in up a whole network to the Internet. This
    means that a single machine router will take care of the correct routing of all
    network traffic.


    > Did you know that...?


    # Protocol


    Protocols organise communication between the different machines in networks, either
    in hardware or software. They specify the format of the data to be transferred,
    which machines have control over others, and so on. Such protocols include FTP,
    UDP, TCP and HTTP.


    By using firewall, SuSE Linux protects your network from unwanted visitors. The
    packet filter integrated into the kernel allows for flexible adaptation of local
    requirements. Incoming as well as outgoing IP traffic can be restricted.


    # Security


    40 The Linux Companion'
  merge: -1
  img_proc: true
