    document that will probably fulfil your needs.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_203_0.png)


    # Figure 7.6 Read tutorials here


    Did you know...?

    On graphical user interfaces, functions and actions of an application can be reached
    via a menu. Menu offer all available commands and options (just as in a restaurant),
    so you can choose any of them. Normally a menu bar has sub-menus that drop down
    from it. There may be pop-up menus which can be activated with a button or a mouse
    click.


    I recommend that you read several of these choices. There appears to be no single
    source that will completely educate the beginner. The large documents give a good
    grounding, and the specific questions can illuminate some areas that the larger
    documents fail to address. And of course, the Web changes minute by minute, so
