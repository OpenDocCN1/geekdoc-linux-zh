  md: 'distribution. A small group of these Web masters, connected via email, gathered
    together for the purpose of co-ordinating their changes in the form of patches.
    By February 1995, eight core contributors formed the foundation of the original
    Apache group. Less than a year after the group was formed, the Apache server was
    the one server on the Internet.


    Netcraft''s survey of Web servers shows how this particular open source product
    has gained a market share of over 50 cent and has more than held its own against
    Microsoft''s Internet information server.


    # Perl


    Originally developed in 1986 by Larry Perl, Perl (Practical Extraction and Report
    Language) has become the language of choice for system and network administration
    as well as for CGI programming. It is the standard scripting language for all
    Apache Web servers. Perl has the ability to hold together many processes. Large
    sites such as Netscape, Yahoo, CNET, Amazon and Excel make the use of Perl in
    managing their sites and providing interactive services. Perl is now maintained
    by a core group of about 100 programmers who keep in contact with the perl mailing
    list. Larry Wall retains artistic control over the language itself, but a well-defined
    extension mechanism has led to the development of 600 add-modules developed by
    independent programmers. See www.perl.org/(Figure 6.7) for details.


